        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677149187 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u548c\u9e231(\u6768\u9759) / \u5b98\u65b9\u62db\u52df\u5b98-\u6696\u6696\uff08\u6768\u9759\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u4e3b\u64ad\u8bad\u7ec3\u8425 -> 4\u4e2a\u6708\u9ad8\u9636\u7cfb\u7edf\u8bfe |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad** (\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u4ef7\u683c\u3001\u5206\u671f\u7b49\u4fe1\u606f) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u9700\u7167\u987e\u751f\u75c5\u5b69\u5b50\uff0c\u6709\u4e3b\u4e1a\u5ba2\u6237\uff0c\u5b66\u4e60\u65f6\u95f4\u88ab\u9891\u7e41\u6253\u65ad) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad** (\u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** (\u7f3a\u5931\u652f\u4ed8\u3001\u5bb6\u5ead\u3001\u6536\u5165\u3001\u5e74\u9f84\u7b49\u5173\u952e\u4fe1\u606f) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u27a1\u4e2d\n- **\u7279\u5f81\u901f\u5199**\uff1a\u5174\u8da3\u9a71\u52a8\u4e0e\u53d8\u73b0\u671f\u671b\u6df7\u5408\u3002\u7528\u6237\u56e0\u201c\u559c\u6b22\u8bfb\u4e66\u201d\u800c\u6765\uff0c\u5e0c\u671b\u201c\u6539\u5584\u7f8e\u5316\u58f0\u97f3\u201d\uff0c\u4f46\u4e5f\u660e\u786e\u8868\u793a\u201c\u5982\u679c\u80fd\u53d8\u597d\u542c\u53c8\u80fd\u8d5a\u94b1\uff0c\u5c31\u662f\u53cc\u4e30\u6536\u4e86\u201d\u3002\u5bf9\u53d8\u73b0\u8def\u5f84\uff08\u5982\u4e0d\u540c\u5de5\u79cd\u3001\u85aa\u8d44\uff09\u6709\u597d\u5947\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u6781\u901f\u53d8\u73b0\u6216\u8981\u6c42\u4fdd\u5e95\u7684\u8feb\u5207\u6027\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u559c\u6b22\u8bfb\u4e66\uff0c\u5c31\u662f\u58f0\u97f3\u4e0d\u597d\u542c\uff0c\u6240\u4ee5\u60f3\u6539\u5584\u7f8e\u5316\u4e00\u4e0b\u58f0\u97f3[\u6342\u8138]\u201d > \u201c\u8bfb\u4e00\u672c\u597d\u4e66\u4e0d\u53ea\u662f\u5b66\u4e60\u4e86\uff0c\u66f4\u662f\u4e00\u79cd\u4eab\u53d7\uff0c\u6211\u60f3\u5b66\u4e60\u4e00\u4e0b\u58f0\u97f3\uff0c\u5982\u679c\u80fd\u53d8\u597d\u542c\u53c8\u80fd\u8d5a\u94b1\uff0c\u5c31\u662f\u53cc\u4e30\u6536\u4e86\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u8bc4\u7ea7** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u7ecf\u6d4e\u72b6\u51b5\u3001\u652f\u4ed8\u538b\u529b\u6216\u4ef7\u683c\u654f\u611f\u5ea6\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e** \u2014 **\u8bc1\u636e\u8bf4\u660e**\uff1a\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u5b69\u5b50\u751f\u75c5\u4e86\uff0c\u6211\u8001\u662f\u5728\u5f04\u4ed6\u561e\uff0c\u7136\u540e\u5e26\u4ed6\u770b\u75c5\u4e86\uff0c\u6240\u4ee5\u8bf4\u6ca1\u6709\u597d\u597d\u5b66\u4e60\u3002\u201d\u4ee5\u53ca\u201c\u6211\u4eca\u5929\u4e2d\u5348\u6709\u5ba2\u6237\u8fc7\u6765\uff0c\u6240\u4ee5\u8bf4\u6709\u4e00\u4e2a\u5c0f\u65f6\uff0c\u7136\u540e\u4e2d\u95f4\u7684\u4e00\u4e2a\u5c0f\u65f6\u6211\u6ca1\u542c\u5b8c\u201d\u3002\u8868\u660e\u5176\u65f6\u95f4\u88ab\u80b2\u513f\u548c\u4e3b\u4e1a\u9ad8\u5ea6\u788e\u7247\u5316\u5207\u5272\uff0c\u7f3a\u4e4f\u7a33\u5b9a\u3001\u6574\u5757\u7684\u5b66\u4e60\u65f6\u95f4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u8bc4\u7ea7** \u2014 \u672a\u63d0\u53ca\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\u3002\n- **\u5e95\u5ea7\u53d6\u77ed\u677f**\uff1a**\u4f4e** (\u65f6\u95f4\u7ef4\u5ea6\u4e3a\u660e\u786e\u77ed\u677f)\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a(\u4e2d) \u5411 \u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371) \u8fc7\u6e21**\u3002\u7528\u6237\u4e3b\u52a8\u89e3\u91ca\u672a\u5b8c\u6210\u5b66\u4e60\u4efb\u52a1\u7684\u539f\u56e0\uff08\u5b69\u5b50\u751f\u75c5\u3001\u6709\u5ba2\u6237\uff09\uff0c\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u8d23\u4efb\u5fc3\u548c\u6c9f\u901a\u610f\u613f\u3002\u4f46\u53cd\u590d\u5f3a\u8c03\u201c\u58f0\u97f3\u4e0d\u597d\u542c\u201d\u3001\u201c\u58f0\u97f3\u53ef\u80fd\u8fd8\u6ca1\u6709\u6062\u590d\uff0c\u8fd8\u6709\u70b9\u6c99\u54d1\u201d\uff0c\u900f\u9732\u51fa\u5bf9\u81ea\u8eab\u6761\u4ef6\u7684\u4e0d\u81ea\u4fe1\u548c\u7126\u8651\uff0c**\u4f9d\u8d56\u5916\u90e8\uff08\u8001\u5e08\uff09\u7684\u80af\u5b9a\u548c\u9f13\u52b1**\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u597d\u7684\u8001\u5e08\uff0c\u6211\u7684\u58f0\u97f3\u53ef\u80fd\u8fd8\u6ca1\u6709\u6062\u590d\uff0c\u8fd8\u6709\u70b9\u6c99\u54d1\uff0c\u7136\u540e\u4f46\u662f\u90a3\u4e2a\u5b66\u4e60\u5185\u5bb9\u6211\u90fd\u8ba4\u771f\u7684\u53bb\u5b66\u4e86\u3002\u201d > \u201c\u6211\u559c\u6b22\u8bfb\u4e66\uff0c\u5c31\u662f\u58f0\u97f3\u4e0d\u597d\u542c\uff0c\u6240\u4ee5\u60f3\u6539\u5584\u7f8e\u5316\u4e00\u4e0b\u58f0\u97f3[\u6342\u8138]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42** (\u6e34\u671b\u8ba4\u53ef\u3001\u8bc1\u660e\u81ea\u6211\u4ef7\u503c)\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u81ea\u8eab\u58f0\u97f3\u6761\u4ef6\u7684\u4e0d\u81ea\u4fe1\uff08\u201c\u58f0\u97f3\u4e0d\u597d\u542c\u201d\u3001\u201c\u6709\u70b9\u6c99\u54d1\u201d\uff09\uff0c\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u83b7\u5f97\u6280\u80fd\u63d0\u5347\u548c\u5916\u90e8\u8ba4\u53ef\uff0c\u4ece\u800c\u8bc1\u660e\u81ea\u5df1\u7684\u4ef7\u503c\uff0c\u53ef\u80fd\u9690\u542b\u5bf9\u73b0\u72b6\uff08\u5982\u5168\u804c\u5988\u5988\u6216\u4e3b\u4e1a\u8eab\u4efd\uff09\u5bfb\u6c42\u7a81\u7834\u6216\u8865\u5145\u7684\u6e34\u671b\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u5938\u5956\u80af\u5b9a\u4e0e\u9636\u6bb5\u6027\u6210\u5c31\u8ba4\u53ef**\u3002\u9700\u8981\u4e0d\u65ad\u5f3a\u5316\u5176\u201c\u8fdb\u6b65\u660e\u663e\u201d\u3001\u201c\u97f3\u8272\u5f88\u597d\u201d\u3001\u201c\u575a\u6301\u5b66\u4e60\u5f88\u68d2\u201d\u7b49\u6b63\u9762\u53cd\u9988\uff0c\u5e2e\u52a9\u5176\u5efa\u7acb\u81ea\u4fe1\uff0c\u62b5\u5fa1\u56e0\u65f6\u95f4\u4e0d\u8db3\u548c\u57fa\u7840\u4e0d\u81ea\u4fe1\u5e26\u6765\u7684\u632b\u8d25\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b\uff08\u51b2\u52a8\u98ce\u9669\u578b\uff09** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u81ea\u5351\u7126\u8651\uff0c\u4f9d\u8d56\u5916\u90e8\u80af\u5b9a\uff0c\u65f6\u95f4\u8d44\u6e90\u7d27\u5f20) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5ead\u6fc0\u70c8\u53cd\u5bf9\u7b49\u7194\u65ad\u7ea2\u7ebf\u3002**\u4f46\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u7f3a\u5931\uff0c\u9700\u9ad8\u5ea6\u8b66\u60d5**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u9ad8** | \u4fe1\u606f\u7f3a\u5931\u3002\u82e5\u62a5\u540d\u4e3a\u9690\u7792\u5bb6\u4eba\u6216\u4f7f\u7528\u5bb6\u5ead\u5171\u540c\u8d44\u91d1\uff0c\u4e00\u65e6\u88ab\u5bb6\u4eba\u53d1\u73b0\uff0c\u6781\u6613\u5f15\u53d1\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u6781\u9ad8** | **\u65f6\u95f4\u4e25\u91cd\u788e\u7247\u5316**\u3002\u7167\u987e\u751f\u75c5\u5b69\u5b50+\u4e3b\u4e1a\u5ba2\u6237\uff0c\u65e0\u6cd5\u4fdd\u8bc1\u6301\u7eed\u3001\u7a33\u5b9a\u7684\u5b66\u4e60\u6295\u5165\uff0c\u4f5c\u4e1a\u79ef\u538b\u540e\u4ea7\u751f\u5de8\u5927\u632b\u8d25\u611f\u548c\u81ea\u8d23\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u9ad8** | **\u5bf9\u81ea\u8eab\u58f0\u97f3\u6781\u5ea6\u4e0d\u81ea\u4fe1**\u3002\u4e00\u65e6\u5728\u7ec3\u4e60\u6216\u8bd5\u97f3\u4e2d\u53d7\u632b\uff08\u5982\u88ab\u6279\u8bc4\u3001\u8bd5\u97f3\u5931\u8d25\uff09\uff0c\u6781\u6613\u5f52\u56e0\u4e8e\u201c\u6211\u58f0\u97f3\u4e0d\u884c\u201d\u3001\u201c\u6211\u592a\u7b28\u4e86\u201d\uff0c\u81ea\u5c0a\u5fc3\u53d7\u632b\u540e\u76f4\u63a5\u653e\u5f03\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u867d\u6709\u201c\u53cc\u4e30\u6536\u201d\u671f\u671b\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u6781\u901f\u53d8\u73b0\u8981\u6c42\u3002\u82e5\u5b66\u4e60\u4e00\u6bb5\u65f6\u95f4\u540e\uff08\u59821-2\u4e2a\u6708\uff09\u4ecd\u65e0\u4efb\u4f55\u6b63\u5411\u53cd\u9988\u6216\u5fae\u5c0f\u6536\u76ca\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\u3002\u6b64\u65f6\u5b66\u4e60\u96be\u5ea6\u548c\u4f5c\u4e1a\u91cf\u589e\u52a0\uff0c\u5176\u788e\u7247\u5316\u65f6\u95f4\u65e0\u6cd5\u5e94\u5bf9\uff0c\u540c\u65f6\u82e5\u672a\u83b7\u5f97\u8db3\u591f\u7684\u60c5\u611f\u652f\u6301\u548c\u5fae\u5c0f\u6210\u5c31\u8ba4\u53ef\uff0c\u6781\u6613\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u548c\u201c\u6ca1\u6548\u679c\u201d\u7684\u53cc\u91cd\u6253\u51fb\u800c\u653e\u5f03\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4eb2\u7231\u7684\u540c\u5b66\uff0c\u770b\u5230\u4f60\u8bf4\u559c\u6b22\u8bfb\u4e66\uff0c\u771f\u7684\u7279\u522b\u4e3a\u4f60\u5f00\u5fc3\uff01\u80fd\u628a\u70ed\u7231\u53d8\u6210\u5b66\u4e60\u52a8\u529b\u662f\u6700\u68d2\u7684\u8d77\u70b9\u3002\u54b1\u4eec\u5b66\u4e60\u4e0d\u8ffd\u6c42\u4e00\u6b65\u767b\u5929\uff0c\u5c24\u5176\u4f60\u8fd8\u8981\u7167\u987e\u5bb6\u5ead\u548c\u4e3b\u4e1a\uff0c\u7279\u522b\u4e0d\u5bb9\u6613\u3002\u54b1\u4eec\u7684\u8bfe\u7a0b\u8bbe\u8ba1\u5c31\u662f\u5e2e\u4f60\u5229\u7528\u597d\u788e\u7247\u65f6\u95f4\uff0c\u4e00\u70b9\u70b9\u8fdb\u6b65\u3002\u4f60\u58f0\u97f3\u7684\u5e95\u5b50\u5f88\u597d\uff0c\u53ea\u662f\u9700\u8981\u4e00\u4e9b\u65b9\u6cd5\u548c\u7ec3\u4e60\u6765\u2018\u6253\u78e8\u2019\u51fa\u66f4\u52a8\u4eba\u7684\u8d28\u611f\u3002\u522b\u62c5\u5fc3\u6c99\u54d1\u6216\u72b6\u6001\u4e0d\u597d\uff0c\u54b1\u4eec\u4e00\u8d77\u6162\u6162\u6765\uff0c\u6211\u4f1a\u4e00\u76f4\u5728\u8fd9\u91cc\u7ed9\u4f60\u52a0\u6cb9\u6253\u6c14\uff0c\u89c1\u8bc1\u4f60\u6bcf\u4e00\u6b21\u5c0f\u5c0f\u7684\u8fdb\u6b65\uff01\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\u3011**\u3002\u6838\u5fc3\u76ee\u6807\u4e0d\u662f\u5feb\u901f\u53d8\u73b0\uff0c\u800c\u662f\u5efa\u7acb\u81ea\u4fe1\u3001\u5b8c\u6210\u5b66\u4e60\u3001\u83b7\u5f97\u6b63\u5411\u53cd\u9988\u3002\u5339\u914d\u8f7b\u91cf\u3001\u9f13\u52b1\u5f0f\u3001\u788e\u7247\u5316\u5b66\u4e60\u4efb\u52a1\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T6\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a**\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011** (\u9ad8\u98911v1\u9f13\u52b1\u3001\u5fae\u5c0f\u6210\u5c31\u5373\u65f6\u53cd\u9988\u3001\u6297\u632b\u8bdd\u672f\u5e93)\uff1b**\u3010\u788e\u7247\u65f6\u95f4\u7ba1\u7406\u5305\u3011** (5-15\u5206\u949f\u5fae\u4efb\u52a1\u3001\u8bed\u97f3\u6253\u5361\u66ff\u4ee3\u957f\u6587\u672c\u4f5c\u4e1a)\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7edd\u4e0d\u5bf9\u5176\u65bd\u52a0\u201c\u522b\u4eba\u90fd\u884c\u4f60\u4e3a\u4ec0\u4e48\u4e0d\u884c\u201d\u7684\u5bf9\u6bd4\u538b\u529b\uff1b\u7edd\u4e0d\u5728\u5176\u56e0\u5bb6\u5ead/\u4e3b\u4e1a\u803d\u8bef\u5b66\u4e60\u65f6\u6279\u8bc4\u6307\u8d23\uff1b\u7edd\u4e0d\u5bf9\u5176\u4f7f\u7528\u201c\u4fdd\u8bc1\u6708\u5165\u8fc7\u4e07\u201d\u7b49\u6fc0\u8fdb\u53d8\u73b0\u8bdd\u672f\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5f53\u524dC2\u98ce\u9669\u6781\u9ad8\uff0c\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u53ef\u80fd\u6210\u4e3a\u538b\u57ae\u9a86\u9a7c\u7684\u6700\u540e\u4e00\u6839\u7a3b\u8349\uff0c\u89e6\u53d1\u9000\u8d39\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u4eca\u5929\u5b69\u5b50\u751f\u75c5\u4e86\uff0c\u6211\u8001\u662f\u5728\u5f04\u4ed6\u561e\uff0c\u7136\u540e\u5e26\u4ed6\u770b\u75c5\u4e86\uff0c\u6240\u4ee5\u8bf4\u6ca1\u6709\u597d\u597d\u5b66\u4e60\u3002\u201d\n2. > \u201c\u6211\u559c\u6b22\u8bfb\u4e66\uff0c\u5c31\u662f\u58f0\u97f3\u4e0d\u597d\u542c\uff0c\u6240\u4ee5\u60f3\u6539\u5584\u7f8e\u5316\u4e00\u4e0b\u58f0\u97f3[\u6342\u8138]\u201d\n3. > \u201c\u597d\u7684\u8001\u5e08\uff0c\u6211\u7684\u58f0\u97f3\u53ef\u80fd\u8fd8\u6ca1\u6709\u6062\u590d\uff0c\u8fd8\u6709\u70b9\u6c99\u54d1\uff0c\u7136\u540e\u4f46\u662f\u90a3\u4e2a\u5b66\u4e60\u5185\u5bb9\u6211\u90fd\u8ba4\u771f\u7684\u53bb\u5b66\u4e86\u3002\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6\u60c5\u7eea\u5de8\u5a74\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u5c0a\u91cd\u4e0e\u4ef7\u503c\u8ba4\u53ef**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u6781\u81f4\u7684\u60c5\u611f\u652f\u6301\u4e0e\u788e\u7247\u5316\u5b66\u4e60\u8def\u5f84\uff0c\u4e25\u7981\u65bd\u52a0\u4efb\u4f55\u8fdb\u5ea6\u548c\u53d8\u73b0\u538b\u529b\uff0c\u5e76\u5c3d\u5feb\u6838\u5b9e\u5176\u5bb6\u5ead\u51b3\u7b56\u6743\u4e0e\u652f\u4ed8\u6765\u6e90**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
