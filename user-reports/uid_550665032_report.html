    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a550665032 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-01 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5357\u8427(\u9648\u5609\u6021) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u77ed\u5267\u5199\u4f5c\u8bfe\u7a0b\uff08\u610f\u5411\u4e2d\uff0c\u63d0\u53ca1500\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u9700\u8b66\u60d5\u6f5c\u5728\u538b\u529b\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u9700\u7167\u987e\u4e8c\u5e74\u7ea7\u4e0e\u521d\u4e00\u4e24\u4e2a\u5b69\u5b50\uff0c\u4e08\u592b\u5f02\u5730\uff0c\u9700\u5904\u7406\u516c\u5a46\u4e8b\u52a1\uff0c\u5468\u672b\u5b8c\u5168\u88ab\u5360\u7528\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u660e\u786e\u63d0\u53ca\u5bb6\u4eba\u662f\u5426\u652f\u6301\uff0c\u4f46\u4e08\u592b\u5f02\u5730\uff0c\u5bb6\u5ead\u4e8b\u52a1\u7e41\u91cd\uff0c\u5b58\u5728\u6f5c\u5728\u538b\u529b\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u6709\u660e\u786e\u7684\u517c\u804c\u53d8\u73b0\u8bc9\u6c42\uff08\u201c\u770b\u6211\u80fd\u4e0d\u80fd\u628a\u8fd9\u4e2a\u5199\u4f5c\u8fd9\u4e2a\u4e13\u804c\u641e\u8d77\u6765\u201d\uff09\uff0c\u4f46\u540c\u65f6\u4e5f\u8868\u73b0\u51fa\u5bf9\u5b66\u4e60\u65b0\u6280\u80fd\uff08AI\u5199\u4f5c\uff09\u7684\u771f\u5b9e\u5174\u8da3\u548c\u6c42\u77e5\u6b32\uff0c\u5e76\u975e\u7eaf\u7cb9\u201c\u51e0\u5929\u5185\u63d0\u73b0\u201d\u7684\u6781\u7aef\u529f\u5229\u5fc3\u6001\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u770b\u6211\u80fd\u4e0d\u80fd\u628a\u8fd9\u4e2a\u5199\u4f5c\u8fd9\u4e2a\u4e13\u804c\u641e\u8d77\u6765\u3002\u201d > \u201c\u4e00\u53e5\u8bdd\uff0c\u4e0d\u8981\u548c\u94b1\u8fc7\u4e0d\u53bb[\u5077\u7b11]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e (3-4\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u672a\u63d0\u53ca\u7ecf\u6d4e\u62ee\u636e\uff0c\u4f46\u5bb6\u5ead\u4e3b\u5987\u8eab\u4efd\uff0c\u7ecf\u6d4e\u6765\u6e90\u53ef\u80fd\u4f9d\u8d56\u4e08\u592b\uff0c\u5bf91500\u5143\u8bfe\u7a0b\u8d39\u7528\u4f1a\u8c28\u614e\u8003\u8651\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e** \u2014 **\u6838\u5fc3\u77ed\u677f**\u3002\u660e\u786e\u63cf\u8ff0\u65f6\u95f4\u88ab\u80b2\u513f\u3001\u5bb6\u52a1\u3001\u7167\u987e\u8001\u4eba\uff08\u516c\u516c\u770b\u75c5\uff09\u5b8c\u5168\u5207\u5272\uff0c\u5468\u672b\u5b8c\u5168\u65e0\u7a7a\u95f2\u3002\u5b66\u4e60\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\u4e14\u4e0d\u7a33\u5b9a\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4e2d\u4f4e** \u2014 \u4e08\u592b\u5e38\u5e74\u5f02\u5730\uff0c\u5bb6\u5ead\u4e8b\u52a1\u5168\u538b\u4e00\u4eba\uff0c\u5c5e\u4e8e\u201c\u4e27\u5076\u5f0f\u80b2\u513f+\u8d61\u517b\u201d\u6a21\u5f0f\uff0c\u7cbe\u795e\u4e0e\u65f6\u95f4\u652f\u6301\u5ea6\u4f4e\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a**\u3002\u9047\u5230\u56f0\u96be\uff08\u5982\u4e0d\u7406\u89e3\u8bfe\u7a0b\u903b\u8f91\u3001AI\u64cd\u4f5c\u7e41\u7410\uff09\u4f1a\u8868\u8fbe\u201c\u61f5\u201d\u3001\u201c\u5d29\u6e83\u201d\uff0c\u4f46\u5177\u5907\u201c\u542c\u8bdd\u7167\u505a\u201d\u7684\u97e7\u6027\uff0c\u80fd\u901a\u8fc7\u53cd\u590d\u542c\u8bfe\u3001\u8bb0\u7b14\u8bb0\u3001\u8bf7\u6559\u6765\u514b\u670d\uff0c\u5e76\u6700\u7ec8\u5b8c\u6210\u4f5c\u4e1a\u3002\u6709\u81ea\u6211\u6000\u7591\uff08\u201c\u6211\u4e5f\u89c9\u5f97\u6211\u5199\u7684\u592a\u5dee\u4e86\u201d\uff09\uff0c\u4f46\u672a\u51fa\u73b0\u5f7b\u5e95\u653e\u5f03\u7684\u8a00\u8bba\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u521a\u5f00\u59cb\u6211\u662f\u5f88\u61f5...\u867d\u7136\u6211\u4e0d\u7406\u89e3\uff0c\u4f46\u662f\u6211\u8fd8\u4f1a\u7167\u505a\uff0c\u542c\u8bdd\u7167\u505a\u5148\u7167\u505a\u3002\u201d > \u201c\u6211\u7684\u51b2\u7a81\u8001\u662f\u4e0d\u591f\u6570\u91cf\uff0c\u95ee\u5230\u8c46\u5305\u5d29\u6e83\u4e86\uff0c\u6211\u4e5f\u5d29\u6e83\u4e86\uff0c\u7b2c\u4e8c\u5929\u63a5\u7740\u95ee[\u5077\u7b11]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42\uff08\u7126\u8651\u4fdd\u969c\uff09\u4e0e\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42\uff08\u966a\u4f34\u4e0e\u4ef7\u503c\u8ba4\u540c\uff09\u7684\u590d\u5408\u4f53**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e2d\u5e74\u5bb6\u5ead\u4e3b\u5987\u7684\u4ef7\u503c\u7126\u8651\u4e0e\u65f6\u95f4\u8d2b\u56f0**\u3002\u5979\u8eab\u5904\u201c40\u591a\u5c81\u3001\u4e24\u4e2a\u5b69\u5b50\u3001\u4e08\u592b\u5f02\u5730\u3001\u516c\u5a46\u9700\u7167\u6599\u201d\u7684\u5178\u578b\u5939\u5fc3\u5c42\uff0c\u7ebf\u4e0b\u793e\u4ea4\u5708\u72ed\u7a84\uff0c\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u6280\u80fd\uff08\u5199\u4f5c\uff09\u83b7\u5f97\u7ecf\u6d4e\u72ec\u7acb\u53ef\u80fd\u4e0e\u793e\u4f1a\u4ef7\u503c\u8ba4\u540c\uff0c\u62b5\u5fa1\u201c\u88ab\u65f6\u4ee3\u629b\u5f03\u201d\u548c\u201c\u4e2a\u4eba\u4ef7\u503c\u6e6e\u6ca1\u201d\u7684\u6df1\u5c42\u6050\u60e7\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u201d\u7684\u8ba4\u540c\u611f\u4e0e\u201c\u88ab\u8d4b\u80fd\u201d\u7684\u638c\u63a7\u611f**\u3002\u5979\u9700\u8981\u7684\u4e0d\u53ea\u662f\u6280\u80fd\uff0c\u66f4\u662f\u4e00\u4e2a\u80fd\u7406\u89e3\u5979\u5904\u5883\u3001\u7ed9\u4e88\u5979\u5177\u4f53\u65b9\u6cd5\uff08\u5982\u4f55\u7528\u788e\u7247\u65f6\u95f4\u5b66\u4e60\uff09\u3001\u5e76\u80af\u5b9a\u5979\u6bcf\u4e00\u6b65\u5fae\u5c0f\u8fdb\u6b65\u7684\u201c\u6559\u7ec3+\u6218\u53cb\u201d\u3002\u540c\u65f6\uff0c\u73ed\u7ea7\u7fa4\u63d0\u4f9b\u7684\u8f7b\u5ea6\u793e\u4ea4\u4e92\u52a8\uff08\u5982\u4e0e\u5176\u4ed6\u5b66\u5458\u5171\u9e23\u201c\u8111\u5b50\u4e0d\u591f\u7528\u201d\uff09\u4e5f\u80fd\u7f13\u89e3\u5979\u7684\u5b64\u72ec\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u8bba (\u5939\u5fc3\u7537\u793e\u755c\u53d8\u79cd - \u5b9d\u5988\u7248)** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5c5e\u6fc0\u70c8\u53cd\u5bf9\u7684\u76f4\u63a5\u8bc1\u636e\u3002\u4f46**\u65f6\u95f4\u8d44\u6e90\u6781\u5ea6\u532e\u4e4f**\u662f\u6838\u5fc3\u98ce\u9669\u70b9\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u56e0\u5b66\u4e60\u6324\u5360\u5bb6\u5ead\u65f6\u95f4\uff08\u5982\u505a\u996d\u3001\u966a\u5b69\u5b50\uff09\u5f15\u53d1\u5185\u90e8\u77db\u76fe\uff0c\u6216\u5bb6\u4eba\u8d28\u7591\u5176\u201c\u4e0d\u52a1\u6b63\u4e1a\u201d\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u5bb6\u5ead\u7a81\u53d1\u4e8b\u52a1\uff08\u5b69\u5b50\u751f\u75c5\u3001\u8001\u4eba\u4f4f\u9662\uff09\u6216\u8bfe\u7a0b\u96be\u5ea6/\u4f5c\u4e1a\u91cf\u8d85\u51fa\u5176\u788e\u7247\u5316\u65f6\u95f4\u627f\u53d7\u80fd\u529b\uff0c\u5bfc\u81f4\u4f5c\u4e1a\u79ef\u538b\u3001\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\uff0c\u4ea7\u751f\u201c\u6211\u5b9e\u5728\u6ca1\u65f6\u95f4\u5b66\u201d\u7684\u5d29\u6e83\u6027\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u867d\u4f1a\u62b1\u6028\u201c\u61f5\u201d\u3001\u201c\u5d29\u6e83\u201d\uff0c\u4f46\u5177\u5907\u201c\u542c\u8bdd\u7167\u505a\u201d\u7684\u97e7\u6027\uff0c\u4e0d\u5c5e\u4e8e\u73bb\u7483\u5fc3\u7c7b\u578b\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u5982\u679c\u5b66\u4e60\u4e00\u6bb5\u65f6\u95f4\uff08\u59821-2\u4e2a\u6708\uff09\u540e\uff0c\u611f\u89c9\u79bb\u201c\u4e13\u804c\u641e\u8d77\u6765\u201d\u6216\u63a5\u5355\u53d8\u73b0\u7684\u76ee\u6807\u4f9d\u7136\u9065\u8fdc\uff0c\u53ef\u80fd\u56e0\u7126\u8651\u800c\u4ea7\u751f\u9000\u8d39\u5ff5\u5934\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-3\u5468\u540e\uff0c\u7b2c\u4e00\u6b21\u5927\u578b\u7efc\u5408\u4f5c\u4e1a\u63d0\u4ea4\u524d\u540e**\u3002\u6b64\u65f6\u5b66\u4e60\u66f2\u7ebf\u6700\u9661\uff0c\u5bb6\u5ead\u4e0e\u5b66\u4e60\u7684\u65f6\u95f4\u51b2\u7a81\u8fbe\u5230\u9876\u5cf0\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4e91\u6d0b\u5988\u5988\uff0c\u770b\u4e86\u4f60\u7684\u60c5\u51b5\u7279\u522b\u6709\u5171\u9e23\uff0c\u54b1\u4eec\u8fd9\u4e2a\u5e74\u7eaa\u4e0a\u6709\u8001\u4e0b\u6709\u5c0f\uff0c\u5c5e\u4e8e\u81ea\u5df1\u7684\u65f6\u95f4\u90fd\u662f\u6324\u51fa\u6765\u7684\u3002\u4f60\u653e\u5fc3\uff0c\u8fd9\u4e2a\u8bfe\u5c31\u662f\u4e3a\u54b1\u4eec\u8fd9\u79cd\u2018\u65f6\u95f4\u7834\u4ea7\u2019\u7684\u5b9d\u5988\u8bbe\u8ba1\u7684\uff0c\u6240\u6709\u91cd\u70b9\u6211\u90fd\u5e2e\u4f60\u5212\u597d\u4e86\uff0c\u54b1\u4eec\u4e0d\u8d2a\u591a\uff0c\u5c31\u5229\u7528\u597d\u6bcf\u5929\u7761\u524d\u7684\u534a\u5c0f\u65f6\uff0c\u4e00\u6b65\u6b65\u6765\uff0c\u6211\u966a\u4f60\u4e00\u8d77\u628a\u8fd9\u5757\u2018\u81ea\u5df1\u7684\u5730\u76d8\u2019\u7ed9\u5b88\u4f4f\u4e86\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\uff08\u964d\u7ef4\u7248\uff09\u3011**\u3002\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u62c6\u89e3\u523030\u5206\u949f\u5185\u7684\u6bcf\u65e5/\u6bcf\u5468\u5b66\u4e60\u4efb\u52a1\u6e05\u5355\uff0c\u5f3a\u8c03\u201c\u5b8c\u6210\u6bd4\u5b8c\u7f8e\u91cd\u8981\u201d\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u3010\u65f6\u95f4\u7ba1\u7406\u8f85\u52a9\u5305\u3011** + **\u3010\u60c5\u7eea\u5171\u9e23\u793e\u7fa4\u3011**\u3002\u524d\u8005\u63d0\u4f9b\u788e\u7247\u5316\u65f6\u95f4\u5229\u7528\u6280\u5de7\uff08\u5982\uff1a\u5229\u7528\u5b69\u5b50\u5199\u4f5c\u4e1a\u7684\u95f4\u9699\u542c\u8bfe\uff09\uff1b\u540e\u8005\u5c06\u5176\u5f15\u5165\u6709\u7c7b\u4f3c\u7ecf\u5386\u7684\u5b66\u5458\u5c0f\u7ec4\uff0c\u5f62\u6210\u201c\u5b9d\u5988\u4e92\u52a9\u8054\u76df\u201d\uff0c\u63d0\u4f9b\u60c5\u611f\u652f\u6301\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u6700\u540e\u540d\u989d\u201d\u3001\u201c\u5012\u8ba1\u65f6\u201d\u7b49\u65b9\u5f0f\u9ad8\u538b\u903c\u5355\uff1b\u5e03\u7f6e\u9700\u8981\u5927\u5757\u8fde\u7eed\u65f6\u95f4\u624d\u80fd\u5b8c\u6210\u7684\u4f5c\u4e1a\uff1b\u5728\u5979\u56e0\u5bb6\u5ead\u4e8b\u52a1\u8bf7\u5047\u65f6\u8868\u73b0\u51fa\u4efb\u4f55\u4e0d\u8010\u70e6\u6216\u50ac\u4fc3\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u57fa\u7840\u8bfe\u672a\u6d88\u5316\u3001\u672a\u4ea7\u51fa\u7b2c\u4e00\u4e2a\u5c0f\u6210\u679c\u524d\u8fdb\u884c\u4efb\u4f55\u5347\u5355\u63a8\u9500**\u3002\u540e\u7eed\u5347\u5355\u5fc5\u987b\u4e0e\u5176\u65f6\u95f4\u53ef\u884c\u6027\u6df1\u5ea6\u7ed1\u5b9a\uff0c\u63a8\u8350\u201c\u5fae\u5347\u5355\u201d\uff08\u5982500\u5143\u4ee5\u5185\u7684\u4e13\u9879\u6280\u5de7\u5305\uff09\uff0c\u800c\u975e\u9ad8\u65f6\u95f4\u6295\u5165\u7684\u9ad8\u9636\u8bfe\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u5c0f\u5b69\u4e5f\u624d\u4e8c\u5e74\u7ea7\u4e5f\u4e0d\u5927\uff0c\uff0c\u8001\u5927\u7684\u8bdd\u662f\u521d\u4e00\uff0c\u8001\u4e8c\u7684\u8bdd\u624d\u4e8c\u5e74\u7ea7\uff0c\u7136\u540e\u5462\u53c8\u6ca1\u6709\u4eba\u7ed9\u6211\u5e26\u5c0f\u5b69\uff0c\u6211\u81ea\u5df1\u4e00\u4e2a\u4eba\u5e26\uff0c\u7136\u540e\u6211\u8001\u516c\u7684\u8bdd\u53c8\u662f\u5e38\u5e74\u5728\u73e0\u4e09\u89d2\uff0c\u5728\u6df1\u5733\u90a3\u8fb9\u4e0a\u73ed\uff0c\u6240\u4ee5\u7684\u8bdd\u6211\u5c31\u6ca1\u6709\u90a3\u4e48\u591a\u65f6\u95f4\u7cbe\u529b\u53bb\u641e\u8fd9\u4e9b\u201d\n2. > \u201c\u6211\u516c\u516c\u5c31\u662f\u90a3\u8bf4\u90a3\u4e2a\u8170\u75bc\u811a\u75bc\uff0c\u4ed6\u8981\u53bb\u505a\u9488\u7078\uff0c\u55ef\uff0c\u7136\u540e\u5462\uff0c\u6211\u5929\u5929\u56de\u53bb...\u6240\u4ee5\u4f60\u4e00\u5fd9\u8fd9\u4e2a\u4e8b\u60c5\u4e00\u5fd9\u5b8c\uff0c\u54ce\u5440\uff0c\u4e0b\u5348\u4e0a\u6765\u7684\u8bdd\u53c8\u5f97\u7ba1\u5c0f\u5b69\uff0c\u53c8\u53c8\u4e70\u83dc\u505a\u996d\uff0c\u7136\u540e\u5c0f\u5b69\u665a\u4e0a\u7684\u8bdd\u8fd8\u5f97\u7ed9\u4ed6\u641e\u4f5c\u4e1a\uff0c\u68c0\u67e5\u4f5c\u4e1a...\u4e00\u4e2a\u5468\u672b\u5c31\u5565\u5565\u90fd\u4e0d\u7528\u5e72\u4e86\u201d\n3. > \u201c\u770b\u6211\u80fd\u4e0d\u80fd\u628a\u8fd9\u4e2a\u5199\u4f5c\u8fd9\u4e2a\u4e13\u804c\u641e\u8d77\u6765\u3002\u201d & \u201c\u4e00\u53e5\u8bdd\uff0c\u4e0d\u8981\u548c\u94b1\u8fc7\u4e0d\u53bb[\u5077\u7b11]\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4\u5939\u5fc3\u5c42\u5b9d\u5988\u53d8\u79cd\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u65f6\u95f4\u8d2b\u56f0\u4e2d\u5bfb\u627e\u5b89\u5168\u611f\u548c\u4ef7\u503c\u8ba4\u540c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u81f4\u5f39\u6027\u7684\u65f6\u95f4\u89e3\u51b3\u65b9\u6848\u4e0e\u60c5\u611f\u5171\u9e23\uff0c\u5c06\u5979\u4ece\u201c\u7eaa\u5f8b\u4fee\u7f57\u573a\u201d\u8f6c\u5165\u201c\u5b9d\u5988\u4e92\u52a9\u89e3\u538b\u9152\u9986\u201d\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u8bba (\u5939\u5fc3\u5c42\u5b9d\u5988\u53d8\u79cd)\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168/\u793e\u4ea4\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\uff08\u964d\u7ef4\u7248\uff09+\u65f6\u95f4\u7ba1\u7406/\u60c5\u7eea\u5171\u9e23\u8f85\u52a9\u5305\", \"age\": \"40\u5c81\u5de6\u53f3\uff0884\u5e74\uff09\", \"gender\": \"\u5973\", \"city\": \"\u5e7f\u4e1c\uff08\u5177\u4f53\u57ce\u5e02\u672a\u77e5\uff09\"}\n```";
