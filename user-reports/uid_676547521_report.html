    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676547521 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-24 \u81f3 2026-01-28 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | AA\u9053\u5ba3(\u9648\u6653\u5a07) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u57f9\u8bad\u8bfe\u7a0b\uff0812\u5468\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u6709\u5de5\u4f5c\uff0c\u9700\u5904\u7406\u5bb6\u5ead\u4e8b\u52a1\uff0c\u4f46\u80fd\u575a\u6301\u5b66\u4e60\u6253\u5361\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\u5bb6\u5ead\u6001\u5ea6\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u5b66\u4e60\u4e92\u52a8\u3001\u6280\u672f\u64cd\u4f5c\u3001\u793e\u7fa4\u4ea4\u6d41\u3001\u4e2a\u4eba\u751f\u6d3b\u5747\u6709\u6d89\u53ca\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06**\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u5173\u6ce8\u5b66\u4e60\u8fc7\u7a0b\u3001\u6280\u672f\u7ec6\u8282\u548c\u957f\u671f\u6210\u957f\uff0c\u5bf9\u53d8\u73b0\u5468\u671f\u6709\u7406\u6027\u8ba4\u77e5\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6709\u58f0\u8def\u4e0a\u770b\u6765\u6211\u4eec\u8981\u6709\u957f\u671f\u4f5c\u6218\u7684\u51c6\u5907\u5566\uff0c\u9700\u8981\u5b66\u4e60\u7684\u5730\u65b9\u592a\u591a\u4e86\uff0c\u9700\u8981\u6c89\u4e0b\u5fc3\u6765\uff0c\u5404\u4e2a\u51fb\u7834\uff0c\u52a0\u6cb9\u5427\u540c\u5b66\u4eec\uff0c\u4e5f\u4e3a\u81ea\u5df1\u52a0\u6cb9[\u62f3\u5934]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1**\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u80fd\u652f\u4ed8\u8bfe\u7a0b\uff0c\u672a\u8868\u73b0\u51fa\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u6709\u5168\u804c\u5de5\u4f5c\uff08\u201c\u7ea6\u8c08\u5b89\u5fbd\u6765\u4eba\u201d\uff09\uff0c\u9700\u5904\u7406\u5bb6\u5ead\u4e8b\u52a1\uff08\u201c\u5b69\u5b50\u653e\u5047\u4e86\u201d\u3001\u201c\u5bb6\u91cc\u6765\u4eba\u201d\uff09\uff0c\u4f46\u4ecd\u80fd\u575a\u6301\u6bcf\u65e5\u5b66\u4e60\u3001\u6253\u5361\u3001\u5b8c\u6210\u4f5c\u4e1a\uff0c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5f3a\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4e2d** \u2014 \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u80fd\u81ea\u4e3b\u5b89\u6392\u5b66\u4e60\u65f6\u95f4\uff0c\u672a\u63d0\u53ca\u5bb6\u5ead\u963b\u529b\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06**\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u5982\u4e13\u8f91\u5408\u5e76\uff09\u65f6\uff0c\u80fd\u4e3b\u52a8\u7814\u7a76\u3001\u53cd\u590d\u5c1d\u8bd5\uff0c\u5e76\u7406\u6027\u6c42\u52a9\u3002\u60c5\u7eea\u7a33\u5b9a\uff0c\u80fd\u81ea\u6211\u6fc0\u52b1\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u64cd\u4f5c\u5b8c\u4e86\uff0c\u4ed6\u4e0d\u662f\u53d6\u6d88\u554a\uff0c\u4ed6\u662f\u4f55\u7ed9\u5462\uff1f\u6dfb\u52a0\u4f55\u7ed9\u5440\uff1f\u201d\uff08\u9762\u5bf9\u64cd\u4f5c\u56f0\u60d1\uff0c\u6301\u7eed\u63a2\u7d22\uff09> \u201c\u53ea\u8981\u80fd\u63d0\u5347\u53bb\u5ad6\u70b9\u4e0d\u4e22\u4eba\u54c8\uff0c\u800c\u4e14\u8fd8\u80fd\u5237\u4e00\u4e22\u4e22\u6210\u5c31\u611f[\u5077\u7b11]\u201d\uff08\u79ef\u6781\u770b\u5f85\u5b66\u4e60\u8fc7\u7a0b\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u5f52\u5c5e \u4e0e \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u8ba4\u53ef ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5728\u6280\u672f\u64cd\u4f5c\u4e0a\u5b58\u5728\u201c\u4e0d\u719f\u7ec3\u201d\u548c\u201c\u5fc3\u91cc\u6ca1\u5e95\u201d\u7684\u7126\u8651\uff08\u201c\u8fd9\u5c31\u4e0d\u4f1a\u5427\uff0c\u4f60\u5b8c\u5168\u638c\u63e1\uff0c\u5fc3\u91cc\u5c31\u6ca1\u5e95\u201d\uff09\uff0c\u540c\u65f6\u5f3a\u70c8\u6e34\u671b\u878d\u5165\u4e00\u4e2a\u79ef\u6781\u3001\u6b22\u5feb\u7684\u793e\u7fa4\u73af\u5883\uff0c\u83b7\u5f97\u540c\u4f34\u548c\u8001\u5e08\u7684\u8ba4\u53ef\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6280\u672f\u4e0a\u7684\u53ca\u65f6\u80af\u5b9a\u4e0e\u793e\u7fa4\u4e2d\u7684\u4ef7\u503c\u611f\u8d4b\u4e88**\u3002\u4ed6\u9700\u8981\u88ab\u770b\u89c1\u201c\u52aa\u529b\u201d\u548c\u201c\u8fdb\u6b65\u201d\uff0c\u5e76\u5728\u53cb\u597d\u7684\u793e\u7fa4\u4e92\u52a8\u4e2d\u83b7\u5f97\u5f52\u5c5e\u611f\u548c\u6210\u5c31\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** \uff08\u52a8\u673a\u7eaf\u5ea6\u9ad8\uff0c\u8d44\u6e90\u5e95\u5ea7\u4e2d\u7b49\uff0c\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u662f\u4f18\u8d28\u6f5c\u529b\u7528\u6237\uff09 |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** \uff08\u5173\u6ce8\u5b9e\u64cd\u7ec6\u8282\uff0c\u4e3b\u52a8\u5b66\u4e60\uff0c\u79ef\u6781\u4e92\u52a8\uff0c\u4e0d\u5f20\u626c\u4f46\u6c42\u80af\u5b9a\uff09 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4f4e** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u81ea\u4e3b\u6027\u5f3a\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5f3a\uff0c\u5b66\u4e60\u610f\u613f\u575a\u5b9a\uff0c\u80fd\u8ddf\u4e0a\u8fdb\u5ea6\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u5230\u95ee\u9898\u4e3b\u52a8\u6c42\u89e3\uff0c\u60c5\u7eea\u7a33\u5b9a\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u867d\u4e3a\u957f\u671f\u4e3b\u4e49\uff0c\u4f46\u82e5\u4e2d\u671f\uff08\u5982\u7b2c8\u5468\u540e\uff09\u4ecd\u65e0\u4efb\u4f55\u6b63\u5411\u53cd\u9988\uff08\u5982\u8bd5\u97f3\u65e0\u679c\uff09\uff0c\u53ef\u80fd\u4ea7\u751f\u632b\u8d25\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c8-10\u5468\uff08\u6280\u80fd\u8fdb\u9636\u4e0e\u8bd5\u97f3\u521d\u671f\uff09**\u3002\u5f53\u5b66\u4e60\u8fdb\u5165\u8f6f\u4ef6\u64cd\u4f5c\u3001\u591a\u8f68\u5408\u6210\u7b49\u786c\u6838\u73af\u8282\uff0c\u82e5\u53cd\u590d\u53d7\u632b\u4e14\u8bd5\u97f3\u65e0\u679c\uff0c\u53ef\u80fd\u52a8\u6447\u4fe1\u5fc3\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u770b\u5230\u4f60\u5df2\u7ecf\u5728\u7814\u7a76\u4e13\u8f91\u5408\u5e76\u548c\u8bd5\u97f3\u89c4\u5219\u4e86\uff0c\u8fd9\u80a1\u94bb\u7814\u52b2\u5934\u7279\u522b\u68d2\uff01\u54b1\u4eec\u8bfe\u7a0b\u5c31\u662f\u9700\u8981\u4f60\u8fd9\u6837\u7a33\u624e\u7a33\u6253\u7684\u540c\u5b66\u3002\u8fc7\u7a0b\u4e2d\u6709\u4efb\u4f55\u5361\u70b9\uff0c\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u641e\u5b9a\u3002\u8bb0\u4f4f\uff0c\u516d\u73ed\u662f\u54b1\u4eec\u7684\u5bb6\uff0c\u4f60\u5728\u8fd9\u513f\u7684\u6bcf\u4e00\u70b9\u8fdb\u6b65\uff0c\u6211\u4eec\u90fd\u80fd\u770b\u5230\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u3002\u4ed6\u9700\u8981\u624e\u5b9e\u7684\u6280\u80fd\u6559\u5b66\u548c\u6e05\u6670\u7684\u8fdb\u9636\u8def\u5f84\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u793e\u7fa4\u4e92\u52a8\u6fc0\u52b1\u5305**\u3011\u3002\u5c06\u5176\u6811\u7acb\u4e3a\u201c\u5b66\u4e60\u6807\u5175\u201d\uff0c\u5728\u793e\u7fa4\u4e2d\u9002\u65f6\u8868\u626c\u5176\u94bb\u7814\u7cbe\u795e\uff0c\u8d4b\u4e88\u5176\u201c\u73ed\u59d4\u201d\u6216\u201c\u5c0f\u7ec4\u957f\u201d\u7b49\u975e\u6b63\u5f0f\u8eab\u4efd\uff0c\u6ee1\u8db3\u5176\u5c0a\u91cd\u4e0e\u5f52\u5c5e\u9700\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u5ffd\u89c6\u4ed6\u7684\u6280\u672f\u7ec6\u8282\u95ee\u9898**\u3002\u5fc5\u987b\u53ca\u65f6\u3001\u8010\u5fc3\u89e3\u7b54\u30022. **\u53ea\u7ed9\u6cdb\u6cdb\u7684\u9f13\u52b1**\u3002\u53cd\u9988\u9700\u5177\u4f53\uff0c\u5982\u201c\u4f60\u95ee\u7684\u8fd9\u4e2a\u95ee\u9898\u5f88\u5173\u952e\uff0c\u8bf4\u660e\u4f60\u601d\u8003\u5f97\u5f88\u6df1\u5165\u201d\u30023. **\u5c06\u5176\u4e0e\u6025\u4e8e\u6c42\u6210\u7684\u5b66\u5458\u6df7\u4e3a\u4e00\u8c08**\uff0c\u907f\u514d\u7528\u201c\u5feb\u901f\u53d8\u73b0\u201d\u8bdd\u672f\u523a\u6fc0\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5f53\u5176\u5b8c\u6210\u57fa\u7840\u8bfe\u7a0b\u5e76\u53d6\u5f97\u4e00\u5b9a\u6210\u679c\uff08\u5982\u8bd5\u97f3\u901a\u8fc7\uff09\u540e\uff0c\u53ef\u63a8\u8350\u9ad8\u9636\u526a\u8f91\u3001\u540e\u671f\u6216\u5546\u4e1a\u63a5\u5355\u7279\u8bad\u8425\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6709\u58f0\u8def\u4e0a\u770b\u6765\u6211\u4eec\u8981\u6709\u957f\u671f\u4f5c\u6218\u7684\u51c6\u5907\u5566\uff0c\u9700\u8981\u5b66\u4e60\u7684\u5730\u65b9\u592a\u591a\u4e86\uff0c\u9700\u8981\u6c89\u4e0b\u5fc3\u6765\uff0c\u5404\u4e2a\u51fb\u7834\uff0c\u52a0\u6cb9\u5427\u540c\u5b66\u4eec\uff0c\u4e5f\u4e3a\u81ea\u5df1\u52a0\u6cb9[\u62f3\u5934]\u201d **(\u957f\u671f\u4e3b\u4e49\uff0c\u81ea\u6211\u6fc0\u52b1)**\n2. > \u201c\u8fd9\u5c31\u4e0d\u4f1a\u5427\uff0c\u4f60\u5b8c\u5168\u638c\u63e1\uff0c\u5fc3\u91cc\u5c31\u6ca1\u5e95\u3002\u201d **(\u5bf9\u6280\u672f\u638c\u63e1\u6709\u9ad8\u8981\u6c42\uff0c\u8ffd\u6c42\u786e\u5b9a\u6027)**\n3. > \u201c6\u73ed\u624d\u662f\u5bb6\uff0c\u4e5f\u5c31\u5076\u5c14\u53bb\u522b\u4eba\u5bb6\u4e32\u4e2a\u95e8\u3002\u201d **(\u5f3a\u70c8\u7684\u793e\u7fa4\u5f52\u5c5e\u611f\u9700\u6c42)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2\u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u5728\u53cb\u597d\u7684\u793e\u7fa4\u4e2d\u83b7\u5f97\u6280\u672f\u7cbe\u8fdb\u7684\u8ba4\u53ef\u4e0e\u5f52\u5c5e\u611f**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4f4e**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u53ca\u65f6\u3001\u7cbe\u51c6\u7684\u6280\u672f\u652f\u6301\uff0c\u5e76\u5728\u793e\u7fa4\u4e2d\u8d4b\u4e88\u5176\u201c\u9760\u8c31\u5b66\u4e60\u8005\u201d\u7684\u8363\u8a89\u8eab\u4efd**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u793e\u4ea4\u5f52\u5c5e\u4e0e\u5c0a\u91cd\u8ba4\u53ef\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u793e\u7fa4\u4e92\u52a8\u6fc0\u52b1\u5305\"}\n```";
