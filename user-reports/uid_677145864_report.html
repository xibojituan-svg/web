    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49)**\n    *   **\u8868\u5c42\u4fe1\u53f7**: \u660e\u786e\u8868\u8fbe\u201c\u5f53\u7136\u60f3\u201d\u8fdb\u5165\u6709\u58f0\u884c\u4e1a\uff0c\u5bf9\u201c\u753b\u672c\u201d\u7b49\u5177\u4f53\u5de5\u79cd\u611f\u5174\u8da3\uff0c\u5173\u6ce8\u201c\u4e3b\u64ad\u201d\u8eab\u4efd\u3002\u884c\u52a8\u4e0a\u80fd\u5b8c\u6210\u6253\u5361\u3001\u4f5c\u4e1a\uff0c\u54cd\u5e94\u9500\u552e\u5f15\u5bfc\u3002\n    *   **\u6df1\u5c42\u4fe1\u53f7**: \u6838\u5fc3\u8bc9\u6c42\u4e3a**\u53d8\u73b0**\uff08\u201c\u6211\u8981\u505a\u4e3b\u64ad\u201d\uff09\uff0c\u5bf9\u201c\u5b66\u8d39\u8d85\u51fa\u9884\u671f\u201d\u654f\u611f\uff0c\u53cd\u590d\u8be2\u95ee\u4f18\u60e0\u4e0e\u8d60\u54c1\u3002\u5b66\u4e60\u52a8\u529b\u4e0e\u201c\u5feb\u901f\u6323\u5230\u7b2c\u4e00\u6876\u91d1\u201d\u7684\u627f\u8bfa\u5f3a\u76f8\u5173\uff0c**\u5b58\u5728\u5c06\u57f9\u8bad\u7b49\u540c\u4e8e\u5feb\u901f\u5c31\u4e1a/\u8d5a\u94b1\u6e20\u9053\u7684\u9884\u671f**\u3002\n    *   **\u7eaf\u5ea6\u5224\u65ad**: \u804c\u4e1a\u53d1\u5c55\u52a8\u673a\u4e0e\u77ed\u671f\u53d8\u73b0\u52a8\u673a\u6df7\u5408\uff0c\u540e\u8005\u6743\u91cd\u8f83\u9ad8\u3002\u5bf9\u884c\u4e1a\u8ba4\u77e5\u53ef\u80fd\u57fa\u4e8e\u9500\u552e\u5ba3\u4f20\uff0c\u5b58\u5728\u7406\u60f3\u5316\u9884\u671f\u3002\n\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4fe1\u606f\u4e0d\u8db3)**\n    *   **\u65f6\u95f4\u8d44\u6e90**: \u80fd\u53c2\u4e0e\u4e2d\u5348\u76f4\u64ad\u3001\u5b8c\u6210\u4f5c\u4e1a\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u53ef\u652f\u914d\u65f6\u95f4\u3002\u5177\u4f53\u6bcf\u65e5/\u6bcf\u5468\u7a33\u5b9a\u5b66\u4e60\u65f6\u957f\u672a\u77e5\u3002\n    *   **\u7ecf\u6d4e\u8d44\u6e90**: **\u5173\u952e\u96f7\u533a**\u3002\u660e\u786e\u8868\u793a\u201c\u5b66\u8d39\u8d85\u51fa\u9884\u671f\u201d\uff0c\u53cd\u590d\u8bae\u4ef7\u5e76\u8981\u6c42\u989d\u5916\u8d60\u8bfe\uff0c\u663e\u793a\u652f\u4ed8\u80fd\u529b\u6709\u9650\u6216\u5bf9\u8bfe\u7a0b\u4ef7\u503c\u5b58\u7591\uff0c**\u4ef7\u683c\u654f\u611f\u5ea6\u9ad8**\u3002\n    *   **\u8bbe\u5907/\u73af\u5883\u8d44\u6e90**: \u672a\u63d0\u53ca\uff0c\u4fe1\u606f\u4e0d\u8db3\u3002\n    *   **\u5b66\u4e60\u57fa\u7840**: \u80fd\u5b8c\u6210\u65c1\u767d\u3001\u89d2\u8272\u97f3\u4f5c\u4e1a\u5e76\u83b7\u5f97\u6b63\u5411\u53cd\u9988\uff0c\u663e\u793a\u5177\u5907\u57fa\u672c\u5b66\u4e60\u4e0e\u6a21\u4eff\u80fd\u529b\u3002\u4f46\u81ea\u8ff0\u201c\u8fdb\u7a0b\u5feb\uff0c\u6709\u4e9b\u97f3\u9891\u8fd8\u6ca1\u542c\u5b8c\u771f\u6015\u8ddf\u4e0d\u4e0a\u201d\uff0c**\u5b58\u5728\u5b66\u4e60\u8282\u594f\u538b\u529b**\u3002\n\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u7b49\u504f\u4f4e)**\n    *   **\u575a\u6301\u6027**: \u80fd\u8ddf\u968f\u8bad\u7ec3\u8425\u8282\u594f\u5b8c\u6210\u591a\u9879\u4efb\u52a1\uff0c\u663e\u793a\u77ed\u671f\u4efb\u52a1\u9a71\u52a8\u4e0b\u7684\u575a\u6301\u6027\u5c1a\u53ef\u3002\n    *   **\u6297\u538b\u6027**: \u5bf9\u5b66\u4e60\u8fdb\u5ea6\u5feb\u611f\u5230\u538b\u529b\uff08\u201c\u771f\u6015\u8ddf\u4e0d\u4e0a\u201d\uff09\uff0c**\u9762\u5bf9\u5b66\u4e60\u6311\u6218\u65f6\u8868\u73b0\u51fa\u7126\u8651**\u3002\n    *   **\u81ea\u4e3b\u6027**: \u9ad8\u5ea6\u4f9d\u8d56\u9500\u552e\u5f15\u5bfc\uff08\u8be2\u95ee\u201c\u53d1\u4e00\u7fa4\u5417\u201d\u3001\u201c\u738b\u660e\u519b\u524d\u8f88\u7684\u7cbe\u54c1\u8bfe\u5728\u54ea\u201d\uff09\uff0c\u51b3\u7b56\u53d7\u5916\u90e8\u6fc0\u52b1\uff08\u8d60\u8bfe\u3001\u8d44\u6e90\u627f\u8bfa\uff09\u5f71\u54cd\u5927\uff0c\u81ea\u4e3b\u89c4\u5212\u4e0e\u63a2\u7d22\u80fd\u529b\u4fe1\u53f7\u5f31\u3002\n    *   **\u632b\u6298\u9884\u671f**: \u672a\u7ecf\u5386\u660e\u663e\u632b\u6298\uff0c\u4f46\u5bf9\u201c\u8ddf\u4e0d\u4e0a\u201d\u6709\u62c5\u5fe7\u3002**\u5bf9\u201c\u5b66\u5b8c\u5373\u63a5\u5355\u3001\u9ad8\u65f6\u85aa\u201d\u7684\u9884\u671f\u6781\u9ad8\uff0c\u4e0e\u5b9e\u9645\u884c\u4e1a\u95e8\u69db\u53ef\u80fd\u5f62\u6210\u5de8\u5927\u843d\u5dee\uff0c\u662f\u6f5c\u5728\u632b\u6298\u70b9**\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u5df2\u5b8c\u6210\u4e0b\u5355\uff08\u63d0\u53ca\u201c\u8ba2\u5355\u201d\uff09\uff0c\u4f46\u652f\u4ed8\u8fc7\u7a0b\u4f34\u968f\u660e\u663e\u7684\u4ef7\u683c\u72b9\u8c6b\u548c\u8bae\u4ef7\u884c\u4e3a\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: \u4fe1\u606f\u4e0d\u8db3\u3002\u672a\u63d0\u53ca\u914d\u5076\u6216\u5176\u4ed6\u5bb6\u5ead\u6210\u5458\u610f\u89c1\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u4e0e\u627f\u8bfa (B\u7c7b\u503e\u5411)**:\n    *   \u6709\u660e\u786e\u884c\u4e3a\u6295\u5165\uff08\u542c\u8bfe\u3001\u4f5c\u4e1a\uff09\uff0c\u4f46\u52a8\u673a\u4e2d\u201c\u5feb\u901f\u53d8\u73b0\u201d\u5360\u6bd4\u9ad8\uff0c\u5bf9\u5b66\u4e60\u672c\u8eab\u7684\u957f\u671f\u627f\u8bfa\u611f\u5b58\u7591\u3002\u7b26\u5408B\u7c7b\uff08\u6709\u52a8\u673a\u4f46\u6613\u53d7\u632b\uff09\u7279\u5f81\u3002\n*   **\u6b65\u9aa42 - \u8d44\u6e90\u4e0e\u6761\u4ef6 (C\u7c7b\u503e\u5411)**:\n    *   \u7ecf\u6d4e\u8d44\u6e90\u7d27\u5f20\uff08\u4ef7\u683c\u654f\u611f\uff09\uff0c\u5b66\u4e60\u8282\u594f\u9002\u5e94\u6027\u4e00\u822c\uff08\u6015\u8ddf\u4e0d\u4e0a\uff09\u3002\u867d\u6709\u65f6\u95f4\uff0c\u4f46\u7efc\u5408\u8d44\u6e90\u6761\u4ef6\u652f\u6491\u957f\u671f\u5b66\u4e60\u4e0e\u53d8\u73b0\u76ee\u6807\u6709\u538b\u529b\u3002\u7b26\u5408C\u7c7b\uff08\u8d44\u6e90\u4e0d\u8db3\uff09\u7279\u5f81\u3002\n*   **\u6b65\u9aa43 - \u884c\u52a8\u4e0e\u575a\u6301 (B/C\u7c7b\u4e4b\u95f4)**:\n    *   \u5728\u5f3a\u5916\u90e8\u7ec4\u7ec7\uff08\u9500\u552e\u5bc6\u96c6\u63a8\u52a8\uff09\u4e0b\u80fd\u5b8c\u6210\u52a8\u4f5c\uff0c\u4f46\u81ea\u4e3b\u6027\u4e0e\u6297\u538b\u6027\u4e00\u822c\u3002\u4ecb\u4e8eB\u7c7b\uff08\u9700\u7763\u4fc3\uff09\u4e0eC\u7c7b\uff08\u6613\u653e\u5f03\uff09\u4e4b\u95f4\u3002\n*   **\u7efc\u5408\u5224\u5b9a**: **BC\u6df7\u5408\u578b**\u3002\u7528\u6237\u6709\u521d\u6b65\u5174\u8da3\u548c\u884c\u52a8\uff0c\u4f46\u6838\u5fc3\u9a71\u52a8\u529b\u4e3a\u77ed\u671f\u53d8\u73b0\uff0c\u4e14\u652f\u4ed8\u80fd\u529b\u6709\u9650\u3001\u5b66\u4e60\u9002\u5e94\u6027\u5b58\u7591\uff0c\u5c5e\u4e8e**\u9ad8\u6d41\u5931\u98ce\u9669\u7fa4\u4f53**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b: T7 \u4ef7\u683c\u654f\u611f\u6295\u673a\u8005**\n    *   **\u6838\u5fc3\u7279\u5f81**: \u5bf9\u201c\u5feb\u901f\u8d5a\u94b1\u201d\u3001\u201c\u526f\u4e1a\u201d\u3001\u201c\u4f4e\u95e8\u69db\u9ad8\u56de\u62a5\u201d\u5ba3\u4f20\u654f\u611f\uff1b\u4ef7\u683c\u662f\u6838\u5fc3\u51b3\u7b56\u95e8\u69db\uff1b\u5b66\u4e60\u6295\u5165\u4ee5\u201c\u80fd\u5426\u5feb\u901f\u53d8\u73b0\u201d\u4e3a\u8861\u91cf\u6807\u51c6\uff1b\u5fe0\u8bda\u5ea6\u4f4e\uff0c\u6613\u56e0\u9884\u671f\u672a\u8fbe\u6216\u53d1\u73b0\u66f4\u201c\u5212\u7b97\u201d\u9009\u9879\u800c\u6d41\u5931\u3002\n    *   **\u543b\u5408\u70b9**:\n        1.  \u6838\u5fc3\u5173\u6ce8\u70b9\u4ece\u59cb\u81f3\u7ec8\u56f4\u7ed5\u201c\u53d8\u73b0\u201d\uff08\u7b2c\u4e00\u6876\u91d1\u3001\u4e3b\u64ad\u3001\u63a5\u5355\uff09\u3002\n        2.  **\u5173\u952e\u96f7\u533a**\uff1a\u660e\u786e\u8868\u8fbe\u201c\u5b66\u8d39\u8d85\u51fa\u9884\u671f\u201d\uff0c\u53cd\u590d\u8bae\u4ef7\uff08\u201c\u8fd9\u4e2a\u4ef7\u683c\u8fd8\u53ef\u4ee5\u4f18\u60e0\u4e0d\u201d\uff09\uff0c\u5e76\u5bf9\u201c\u8d60\u9001\u7684\u8bfe\u7a0b\u201d\u8fdb\u884c\u786e\u8ba4\uff0c\u4ef7\u683c\u654f\u611f\u5ea6\u6781\u9ad8\u3002\n        3.  \u5b66\u4e60\u884c\u4e3a\u5728\u9500\u552e\u9ad8\u5bc6\u5ea6\u8ddf\u8fdb\u548c\u8d44\u6e90\u627f\u8bfa\u4e0b\u5b8c\u6210\uff0c\u5185\u5728\u9a71\u52a8\u529b\u4e0d\u8db3\u3002\n        4.  \u5bf9\u884c\u4e1a\u8ba4\u77e5\u53ef\u80fd\u505c\u7559\u5728\u9500\u552e\u63cf\u7ed8\u7684\u201c\u65f6\u85aa90-300\u201d\u3001\u201c\u591a\u52b3\u591a\u5f97\u201d\u7684\u7b80\u5355\u5316\u56fe\u666f\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4e2d\u9ad8\u98ce\u9669)\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**: **\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u671f\u5f85\u201c\u5b66\u5b8c\u5373\u63a5\u5355\u201d\u3001\u201c\u5feb\u901f\u6323\u5230\u7b2c\u4e00\u6876\u91d1\u201d\u3002\u5b9e\u9645\u6280\u80fd\u6210\u957f\u4e0e\u63a5\u5355\u53d8\u73b0\u5b58\u5728\u5ef6\u8fdf\u548c\u4e0d\u786e\u5b9a\u6027\uff0c\u6781\u6613\u4ea7\u751f\u201c\u88ab\u9a97\u201d\u611f\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**: **\u9ad8\u98ce\u9669**\u3002\u5df2\u660e\u786e\u8868\u793a\u5b66\u8d39\u6709\u538b\u529b\uff0c\u4efb\u4f55\u5bb6\u5ead\u5f00\u652f\u53d8\u52a8\u6216\u989d\u5916\u6d88\u8d39\u90fd\u53ef\u80fd\u5f15\u53d1\u540e\u6094\u60c5\u7eea\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**: \u4e2d\u98ce\u9669\u3002\u76ee\u524d\u6709\u65f6\u95f4\uff0c\u4f46\u82e5\u540e\u7eed\u751f\u6d3b\u5b89\u6392\u53d8\u5316\uff0c\u7ed3\u5408\u7ecf\u6d4e\u538b\u529b\uff0c\u53ef\u80fd\u6210\u4e3a\u9000\u8d39\u5bfc\u706b\u7d22\u3002\n    4.  **\u8bfe\u7a0b\u8d28\u91cf**: \u4e2d\u98ce\u9669\u3002\u7528\u6237\u66fe\u611f\u89c9\u201c\u8fdb\u7a0b\u5feb\uff0c\u6015\u8ddf\u4e0d\u4e0a\u201d\uff0c\u82e5\u6b63\u5f0f\u8bfe\u96be\u5ea6\u63d0\u5347\u6216\u670d\u52a1\u4e0d\u5982\u4f53\u9a8c\u8425\u5bc6\u96c6\uff0c\u6613\u4ea7\u751f\u4e0d\u6ee1\u3002\n    5.  **\u9500\u552e\u627f\u8bfa\u4e0d\u7b26**: **\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u627f\u8bfa\u4e86\u201c\u4e13\u5c5e\u7248\u6743\u4e66\u201d\u3001\u201c\u4f18\u5148\u5165\u5267\u7ec4\u201d\u3001\u201c\u4e00\u5bf9\u4e00\u6307\u5bfc\u201d\u7b49\u5177\u4f53\u8d44\u6e90\u3002**\u82e5\u540e\u7eed\u8d44\u6e90\u5206\u914d\u4e0d\u53ca\u65f6\u3001\u4e0d\u660e\u786e\u6216\u5b58\u5728\u95e8\u69db\uff0c\u6781\u6613\u5f15\u53d1\u6295\u8bc9**\u3002\u201c\u8d60\u9001\u8bfe\u7a0b\u201d\u82e5\u672a\u5151\u73b0\uff0c\u5c06\u76f4\u63a5\u5bfc\u81f4\u7ea0\u7eb7\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9**: \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u56e0\u7ecf\u6d4e\u538b\u529b\u5b58\u5728\uff0c\u5bb6\u5ead\u77e5\u60c5\u540e\u53cd\u5bf9\u7684\u53ef\u80fd\u6027\u4e0d\u4f4e\u3002\n    7.  **\u7ade\u54c1\u5bf9\u6bd4**: \u4e2d\u98ce\u9669\u3002\u4ef7\u683c\u654f\u611f\u578b\u7528\u6237\u6781\u6613\u88ab\u5176\u4ed6\u5e73\u53f0\u7684\u201c\u66f4\u4f4e\u4ef7\u683c\u201d\u6216\u201c\u66f4\u5feb\u53d8\u73b0\u201d\u5ba3\u4f20\u5438\u5f15\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5408\u89c4\u98ce\u9669\u70b9**:\n    1.  **\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u6a21\u7cca\u5316**: \u9500\u552e\u5927\u91cf\u4f7f\u7528\u201c\u65f6\u85aa90-300\u201d\u3001\u201c\u5feb\u901f\u6323\u5230\u7b2c\u4e00\u6876\u91d1\u201d\u3001\u201c\u76f4\u63a5\u8fdb\u5165...\u8d44\u6e90\u7fa4\u201d\u3001\u201c\u4e13\u5c5e\u7248\u6743\u4e66\u201d\u7b49\u8bdd\u672f\uff0c**\u53ef\u80fd\u8425\u9020\u4e86\u4e0d\u5207\u5b9e\u9645\u7684\u53d8\u73b0\u9884\u671f**\uff0c\u672a\u5145\u5206\u63d0\u793a\u884c\u4e1a\u7ade\u4e89\u6fc0\u70c8\u3001\u6210\u957f\u5468\u671f\u957f\u3001\u6536\u5165\u4e0d\u7a33\u5b9a\u7684\u98ce\u9669\u3002\n    2.  **\u8d60\u54c1\u8bf1\u5bfc**: \u4ee5\u201c\u989d\u5916\u5956\u52b1\u201d\u3001\u201c\u8d60\u9001\u8bfe\u7a0b\u201d\u3001\u201c200\u672c\u516c\u7248\u4e66\u201d\u4f5c\u4e3a\u4fc3\u5355\u624b\u6bb5\uff0c\u5e76\u6697\u793a\u201c\u4e0d\u80fd\u8bf4\u51fa\u53bb\u201d\uff0c\u5b58\u5728\u4e0d\u89c4\u8303\u8425\u9500\u5acc\u7591\u3002\n    3.  **\u5236\u9020\u7d27\u8feb\u611f\u4e0e\u4ece\u4f17\u538b\u529b**: \u201c\u6700\u540e\u4e00\u6b21\u8003\u6838\u201d\u3001\u201c\u540d\u989d\u8981\u6ca1\u6709\u4e86\u201d\u3001\u201c\u901a\u5173\u6210\u529f\u201d\u7b49\u8bdd\u672f\u9891\u7e41\u4f7f\u7528\uff0c\u53ef\u80fd\u5f71\u54cd\u7528\u6237\u7406\u6027\u51b3\u7b56\u3002\n*   **\u4f26\u7406\u9632\u7ebf**: \u9500\u552e\u8fc7\u7a0b\u5b58\u5728**\u5938\u5927\u6536\u76ca\u3001\u6de1\u5316\u98ce\u9669**\u7684\u503e\u5411\uff0c\u5bf9\u4ef7\u683c\u654f\u611f\u3001\u9884\u671f\u7406\u60f3\u5316\u7684\u7528\u6237\u4fdd\u62a4\u4e0d\u8db3\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d\u8bc4\u4f30**: **\u504f\u5dee**\u3002\u7528\u6237\u6838\u5fc3\u8bc9\u6c42\u662f\u201c\u4f4e\u6295\u5165\u3001\u5feb\u53d8\u73b0\u201d\uff0c\u800c\u7cfb\u7edf\u6027\u7684\u914d\u97f3\u57f9\u8bad\u4ea7\u54c1\u9700\u8981\u4e2d\u957f\u671f\u6295\u5165\u624d\u80fd\u89c1\u6548\uff0c\u4e24\u8005\u5b58\u5728\u6839\u672c\u6027\u9519\u914d\u98ce\u9669\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **\u9996\u5468\u91cd\u70b9\u7ba1\u7406\u53d8\u73b0\u9884\u671f\u4e0e\u5efa\u7acb\u4fe1\u4efb**\n*   **\u5177\u4f53\u884c\u52a8\u5efa\u8bae**:\n    1.  **\u9884\u671f\u6821\u6b63\uff08\u5173\u952e\uff09**: \u5165\u73ed24\u5c0f\u65f6\u5185\uff0c\u5fc5\u987b\u8fdb\u884c\u4e00\u5bf9\u4e00\u6c9f\u901a\uff0c**\u7528\u5177\u4f53\u6848\u4f8b\u548c\u6570\u636e\uff08\u975e\u627f\u8bfa\uff09** \u6e05\u6670\u8bf4\u660e\uff1a\u4ece\u5b66\u4e60\u5230\u63a5\u5355\u7684\u5e38\u89c4\u5468\u671f\u3001\u65b0\u624b\u5e38\u89c1\u6536\u5165\u8303\u56f4\u3001\u6210\u529f\u6240\u9700\u7684\u6301\u7eed\u7ec3\u4e60\u65f6\u95f4\u3002**\u5fc5\u987b\u964d\u4f4e\u5176\u201c\u5feb\u901f\u66b4\u5bcc\u201d\u7684\u9884\u671f**\u3002\n    2.  **\u5f3a\u5316\u8fc7\u7a0b\u4ef7\u503c**: \u5c06\u5b66\u4e60\u7126\u70b9\u4ece\u201c\u63a5\u5355\u7ed3\u679c\u201d\u6682\u65f6\u8f6c\u79fb\u5230\u201c\u6280\u80fd\u63d0\u5347\u8fc7\u7a0b\u201d\u548c\u201c\u4f5c\u54c1\u79ef\u7d2f\u201d\uff0c\u591a\u7ed9\u4e88\u5176\u7ec3\u4e60\u6210\u679c\u7684\u5177\u4f53\u80af\u5b9a\uff0c\u5efa\u7acb\u5b66\u4e60\u81ea\u4fe1\u3002\n    3.  **\u900f\u660e\u5316\u8d44\u6e90\u8def\u5f84**: \u6e05\u6670\u544a\u77e5\u201c\u4e13\u5c5e\u7248\u6743\u4e66\u201d\u3001\u5165\u7fa4\u8d44\u6e90\u7684\u5177\u4f53\u7533\u8bf7\u6d41\u7a0b\u3001\u6807\u51c6\u548c\u7b49\u5f85\u65f6\u95f4\uff0c\u907f\u514d\u56e0\u627f\u8bfa\u6a21\u7cca\u4ea7\u751f\u8bef\u4f1a\u3002\n    4.  **\u5bc6\u5207\u5173\u6ce8\u52a8\u6001**: \u8be5\u7528\u6237\u4e3a\u9000\u8d39\u9ad8\u5371\u4eba\u7fa4\u3002\u9700\u5bc6\u5207\u5173\u6ce8\u5176\u524d\u51e0\u5468\u7684\u5b66\u4e60\u53cd\u9988\u3001\u4e92\u52a8\u9891\u7387\uff0c\u5bf9\u4efb\u4f55\u6d88\u6781\u6216\u56f0\u60d1\u8a00\u8bba\u53ca\u65f6\u5e72\u9884\u3002\n    5.  **\u8c28\u614e\u627f\u8bfa**: \u4e25\u7981\u505a\u51fa\u65b0\u7684\u6536\u76ca\u627f\u8bfa\u3002\u6240\u6709\u670d\u52a1\u4e0e\u8d44\u6e90\u8bf4\u660e\u9700\u6e05\u6670\u3001\u6709\u636e\u53ef\u67e5\u3002\n    6.  **\u98ce\u9669\u9884\u6848**: \u51c6\u5907\u597d\u82e5\u7528\u6237\u65e9\u671f\u63d0\u51fa\u9000\u8d39\u65f6\u7684\u6c9f\u901a\u8bdd\u672f\uff0c\u91cd\u70b9\u56de\u987e\u5176\u5b66\u4e60\u6536\u83b7\u4e0e\u957f\u671f\u89c4\u5212\uff0c\u800c\u975e\u7ea0\u7f20\u4e8e\u77ed\u671f\u53d8\u73b0\u3002\n\n{\"core_type\": \"T7 \u4ef7\u683c\u654f\u611f\u6295\u673a\u8005\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u9996\u5468\u91cd\u70b9\u6821\u6b63\u53d8\u73b0\u9884\u671f\"}";
