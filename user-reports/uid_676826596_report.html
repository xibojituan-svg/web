    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u946b\u5b9d\u6765 (UID: 676826596) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-21 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5317\u7b19(\u90ed\u5168\u4e49) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u64ad\u5b66\u5802\u6709\u58f0\u4e66/\u540e\u671f\u5236\u4f5c\u8bfe\u7a0b (\u5df2\u62a5\u540d\u4e0b\u4e2a\u73ed) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u5145\u88d5 (\u4e3b\u52a8\u7eed\u8d39\uff0c\u672a\u63d0\u53ca\u8d44\u91d1\u538b\u529b) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1 (\u63d0\u53ca\u201c\u6211\u7231\u5f80\u9662\u5fd9\u5f97\u6211\u5fd8\u4e86\u201d\u3001\u201c\u6211\u6700\u8fd1\u5f88\u5fd9\u201d\uff0c\u4f46\u80fd\u575a\u6301\u521b\u4f5c\u548c\u63d0\u4ea4\u4f5c\u4e1a) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u5355\u8eab\u72ec\u7acb / \u5df2\u62a5\u5907\u5e76\u652f\u6301 (\u804a\u5929\u4e2d\u672a\u63d0\u53ca\u5bb6\u5ead\u963b\u529b\uff0c\u51b3\u7b56\u72ec\u7acb) |\n| **\u4fe1\u606f\u539a\u5ea6** | \u9971\u6ee1 (\u6709\u5927\u91cf\u539f\u521b\u4f5c\u54c1\u3001\u5b66\u4e60\u4e92\u52a8\u548c\u7eed\u8d39\u884c\u4e3a) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u5173\u6ce8\u521b\u4f5c\u672c\u8eab\u3001\u6280\u672f\u7cbe\u8fdb\u548c\u56e2\u961f\u534f\u4f5c\uff0c\u800c\u975e\u77ed\u671f\u53d8\u73b0\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u540c\u5b66\u4eec\uff0c\u6211\u4eec\u73b0\u5728\u5df2\u4e0a\u7684\u8bfe\u5feb\u6bd5\u4e1a\u4e86\uff0c\u524d\u671f\u58f0\u64ad\u518d\u597d\u671f\u505a\u4e0d\u597d\u4e5f\u662f\u767d\u8d39\uff0c\u6211\u5df1\u62a5\u540d\u4e86\u5b66\u4e60\u540e\u671f\u5236\u4f5c\u201d > \u201c\u8fd9\u662f\u6211\u4e2a\u4eba\u521b\u4f5c\u7684\u4f5c\u54c1\uff0c\u540c\u5b66\u4eec\u7ed9\u4e88\u8c03\u6574\u548c\u4fee\u6539\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u9ad8** \u2014 \u5df2\u8d2d\u4e70\u8bfe\u7a0b\u5e76\u4e3b\u52a8\u7eed\u8d39\u65b0\u73ed\uff0c\u65e0\u8d44\u91d1\u538b\u529b\u8ff9\u8c61\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u6709\u672c\u804c\u5de5\u4f5c(\u201c\u5f80\u9662\u201d\u53ef\u80fd\u6307\u201c\u533b\u9662\u201d)\uff0c\u65f6\u95f4\u788e\u7247\u5316\uff0c\u4f46\u80fd\u6324\u51fa\u65f6\u95f4\u8fdb\u884c\u9ad8\u5f3a\u5ea6\u7684\u539f\u521b\u5199\u4f5c\u548c\u7ec3\u4e60\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u9ad8** \u2014 \u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u963b\u529b\uff0c\u51b3\u7b56\u81ea\u4e3b\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u627e\u4e0d\u5230\u4f5c\u4e1a\u3001\u8f6f\u4ef6\u5b89\u88c5\uff09\u4e3b\u52a8\u8be2\u95ee\u5e76\u5c1d\u8bd5\u89e3\u51b3\uff0c\u5f97\u5230\u53cd\u9988\u540e\u80fd\u6301\u7eed\u6539\u8fdb\uff08\u201c\u62d6\u97f3\u95ee\u9898\u8fdb\u6b65\u4e86\u5f88\u5927\u201d\uff09\u3002\u5fc3\u6001\u79ef\u6781\uff0c\u4e50\u4e8e\u5728\u793e\u7fa4\u4e2d\u534f\u4f5c\u548c\u9f13\u52b1\u4ed6\u4eba\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08\uff0c\u7535\u8111\u4e70\u4e86\uff0c\u6709\u65f6\u95f4\u5e2e\u6211\u5b89\u88c5AU\u201d > \u201c\u6211\u662f\u7535\u8111\u5927\u767d\uff0c\u624d\u4e70\u7684\u7535\u8111\u5b66\u7684\u5934\u8001\u5927\u201d (\u867d\u6709\u56f0\u96be\uff0c\u4f46\u6001\u5ea6\u662f\u5bfb\u6c42\u89e3\u51b3)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u81ea\u8eab\u6280\u80fd\uff08\u5982\u7535\u8111\u64cd\u4f5c\u3001\u540e\u671f\u5236\u4f5c\uff09\u7684\u4e0d\u81ea\u4fe1\uff08\u201c\u7535\u8111\u5927\u767d\u201d\u3001\u201c\u5934\u8001\u5927\u201d\uff09\uff0c\u4ee5\u53ca\u6e34\u671b\u901a\u8fc7\u521b\u4f5c\u83b7\u5f97\u793e\u7fa4\u8ba4\u53ef\u548c\u5b9e\u73b0\u4e2a\u4eba\u4ef7\u503c\uff08\u201c\u6211\u4eec\u7ec4\u7684\u540c\u5b66\u53c2\u8003\u4e00\u4e0b\u5171\u540c\u521b\u4f5c\u201d\uff09\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u5176\u521b\u4f5c\u80fd\u529b\u548c\u5b66\u4e60\u6001\u5ea6\u7684\u6781\u81f4\u80af\u5b9a**\uff0c\u4ee5\u53ca\u63d0\u4f9b**\u5728\u793e\u7fa4\u4e2d\u5c55\u73b0\u9886\u5bfc\u529b\u3001\u83b7\u5f97\u5c0a\u91cd**\u7684\u673a\u4f1a\uff08\u5982\u62c5\u4efb\u5c0f\u7ec4\u6838\u5fc3\uff09\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 **B\u7c7b** (\u9ad8\u52a8\u673a\u3001\u4e2d\u8d44\u6e90\u3001\u9ad8\u5f39\u6027\uff0c\u5177\u5907\u9ad8\u4ef7\u503c\u6f5c\u529b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u517c\u987e **T1 \u5708\u517b\u9886\u8896** \u6f5c\u8d28) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u51b3\u7b56\u72ec\u7acb\uff0c\u65e0\u5bb6\u5ead\u963b\u529b\u4fe1\u53f7\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4e2d | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u672c\u804c\u5de5\u4f5c\u7e41\u5fd9\uff0c\u53ef\u80fd\u5bfc\u81f4\u4f5c\u4e1a\u79ef\u538b\u4ea7\u751f\u7126\u8651\u3002\u9700\u5173\u6ce8\u5176\u65f6\u95f4\u7ba1\u7406\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u5230\u95ee\u9898\u4e3b\u52a8\u6c42\u89e3\uff0c\u975e\u60c5\u7eea\u5316\u62b1\u6028\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u52a8\u673a\u7eaf\u5ea6\u9ad8\uff0c\u5173\u6ce8\u80fd\u529b\u6210\u957f\u800c\u975e\u77ed\u671f\u53d8\u73b0\uff0c\u5bf9\u6536\u76ca\u9884\u671f\u7ba1\u7406\u826f\u597d\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe\u4e2d\u671f\uff08\u7b2c3-5\u5468\uff09\uff0c\u5f53\u8bfe\u7a0b\u96be\u5ea6\uff08\u5982\u590d\u6742\u7684\u540e\u671f\u8f6f\u4ef6\u64cd\u4f5c\uff09\u4e0e\u4ed6\u7684\u201c\u7535\u8111\u5927\u767d\u201d\u73b0\u72b6\u51b2\u7a81\uff0c\u4e14\u65f6\u95f4\u88ab\u5de5\u4f5c\u6324\u538b\u65f6\uff0c\u53ef\u80fd\u4ea7\u751f\u632b\u8d25\u611f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u946b\u5b9d\u6765\uff0c\u770b\u5230\u4f60\u4e3a\u5c0f\u7ec4\u521b\u4f5c\u7684\u5267\u672c\u548c\u79ef\u6781\u7ec4\u7ec7\u8ba8\u8bba\uff0c\u771f\u7684\u975e\u5e38\u6709\u60f3\u6cd5\u548c\u9886\u5bfc\u529b\uff01\u65b0\u4e00\u671f\u7684\u8bfe\u7a0b\u4f1a\u6d89\u53ca\u66f4\u591a\u786c\u6838\u7684\u540e\u671f\u6280\u672f\uff0c\u6211\u77e5\u9053\u4f60\u5de5\u4f5c\u5fd9\u53c8\u662f\u7535\u8111\u65b0\u624b\uff0c\u522b\u62c5\u5fc3\uff0c\u6211\u4eec\u4f1a\u7ed9\u4f60\u6700\u843d\u5730\u7684\u2018\u5c0f\u767d\u53d8\u5927\u795e\u2019\u5b9e\u64cd\u6307\u5357\uff0c\u6709\u4efb\u4f55\u5361\u70b9\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u653b\u514b\u3002\u671f\u5f85\u4f60\u5728\u65b0\u73ed\u91cc\u7ee7\u7eed\u5e26\u9886\u5927\u5bb6\u4ea7\u51fa\u597d\u4f5c\u54c1\uff01\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011+\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf**\u3011\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743**\u3011(\u9488\u5bf9\u540e\u671f\u6280\u672f\u96be\u9898)\u3001\u3010**\u73ed\u59d4\u8d4b\u80fd\u4efb\u547d\u6743**\u3011(\u4efb\u547d\u4e3a\u5c0f\u7ec4\u957f\u6216\u5185\u5bb9\u5ba1\u6838\u5b98\uff0c\u6ee1\u8db3\u5176\u5c0a\u91cd\u4e0e\u9886\u5bfc\u529b\u9700\u6c42)\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u5ffd\u89c6\u6216\u6577\u884d\u4ed6\u7684\u6280\u672f\u6c42\u52a9\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\uff09\u30022. \u53ea\u7ed9\u6cdb\u6cdb\u7684\u8868\u626c\uff0c\u4e0d\u7ed9\u5177\u4f53\u7684\u3001\u6709\u6df1\u5ea6\u7684\u521b\u4f5c\u53cd\u9988\u30023. \u5c06\u4ed6\u89c6\u4e3a\u666e\u901a\u5b66\u5458\uff0c\u4e0d\u7ed9\u4e88\u5728\u793e\u7fa4\u4e2d\u53d1\u6325\u7ec4\u7ec7\u624d\u80fd\u7684\u673a\u4f1a\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u4ed6\u662f\u9ad8\u590d\u8d2d\u6f5c\u529b\u7528\u6237\uff08\u5df2\u7eed\u8d39\uff09\uff0c\u53ef\u57fa\u4e8e\u4ed6\u201c\u8865\u9f50\u77ed\u677f\u201d\uff08\u5982\u540e\u671f\u5236\u4f5c\uff09\u548c\u201c\u8ffd\u6c42\u7cbe\u8fdb\u201d\u7684\u9700\u6c42\uff0c\u63a8\u8350\u66f4\u9ad8\u7ea7\u7684\u4e13\u9879\u8bad\u7ec3\u8425\u6216\u5927\u5e08\u73ed\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u8fd9\u662f\u6211\u4e2a\u4eba\u521b\u4f5c\u7684\u4f5c\u54c1\uff0c\u540c\u5b66\u4eec\u7ed9\u4e88\u8c03\u6574\u548c\u4fee\u6539\u201d **(\u8bc1\u660e\u521b\u4f5c\u70ed\u60c5\u4e0e\u5f00\u653e\u5fc3\u6001)**\n2. > \u201c\u6211\u4eec\u7ec4\u7684\u540c\u5b66\u53c2\u8003\u4e00\u4e0b\u5171\u540c\u521b\u4f5c\uff0c\u505a\u51fa\u4e00\u4e2a\u9002\u5408\u6211\u4eec\u7684\u5267\u672c\uff0c\u6211\u4eec\u5927\u5bb6\u628a\u5404\u81ea\u7684\u7231\u597d\u7279\u957f\u53ca\u9002\u5408\u81ea\u5df1\u7684\u5de5\u4f5c\uff0c\u89d2\u8272\u62a5\u4e0b\uff0c\u4e3a\u4ee5\u540e\u66f4\u597d\u5730\u5408\u4f5c\u6253\u4e0b\u57fa\u7840\u3002\u201d **(\u8bc1\u660e\u793e\u7fa4\u534f\u4f5c\u610f\u613f\u4e0e\u6f5c\u5728\u9886\u5bfc\u529b)**\n3. > \u201c\u6211\u662f\u7535\u8111\u5927\u767d\uff0c\u624d\u4e70\u7684\u7535\u8111\u5b66\u7684\u5934\u8001\u5927\u201d **(\u8bc1\u660e\u5b66\u4e60\u51b3\u5fc3\u4e0e\u5f53\u524d\u77ed\u677f\uff0c\u975e\u62b1\u6028\u800c\u662f\u9648\u8ff0\u4e8b\u5b9e)** \n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010\u4f4e\u8c03\u5b9e\u5e72\u578b\uff0c\u517c\u5177\u5708\u517b\u9886\u8896\u6f5c\u8d28\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u4e0e\u5b9e\u73b0\u521b\u4f5c\u4ef7\u503c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7ed9\u4e88\u6df1\u5ea6\u7684\u6280\u672f\u652f\u6301\u548c\u5728\u793e\u7fa4\u4e2d\u8d4b\u4e88\u4ed6\u7ec4\u7ec7\u8005\u89d2\u8272\uff0c\u6ee1\u8db3\u5176\u88ab\u8ba4\u53ef\u7684\u9700\u6c42\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b (\u517cT1\u6f5c\u8d28)\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd/\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\"}\n```";
