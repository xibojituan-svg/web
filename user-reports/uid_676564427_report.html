        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u6797\u66e6\u89c1\u5c71 (UID: 676564427) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-18 \u81f3 2026-01-21 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5c0f\u5976\u6a58(\u90ed\u5c11\u5a55)\u3001\u4f1a\u98de\u7684\u52a0\u5c3c(\u5468\u94f8\u798f)\u3001\u6458\u6843\u6362\u9152\u94b1(\u4e1b\u6d01) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u526a\u8f91\uff08\u540e\u671f\uff09\u8bfe (\u5df2\u8d2d\uff0c\u5e76\u7533\u8bf7\u5ef6\u671f\u81f387\u671f) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u65e0\u6cd5\u5224\u65ad\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u6781\u5ea6\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u63cf\u8ff0\u201c\u51e0\u4e4e\u6ca1\u6709\u505a\u5176\u4ed6\u4e8b\u7684\u65f6\u95f4\u4e86[\u6342\u8138] \u6d17\u624b\u95f4\u90fd\u5c0f\u8dd1\u201d\u3001\u201c\u73b0\u5728\u7684\u5b66\u4e60\u5904\u4e8e\u2018\u56eb\u56f5\u541e\u54bd\u2019\u72b6\u201d\u3001\u201c\u8fde\u7eed\u71ac\u591c\u4e0d\u8bf4\uff0c\u767d\u5929\u7167\u6837\u5904\u7406\u5404\u79cd\u4e8b\u52a1\uff0c\u8865\u89c9\u90fd\u662f\u2018\u89c1\u7f1d\u63d2\u9488\u2019\u201d\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u7528\u6237\u4e3b\u52a8\u3001\u8be6\u7ec6\u5730\u63cf\u8ff0\u4e86\u5b66\u4e60\u72b6\u6001\u3001\u65f6\u95f4\u5b89\u6392\u3001\u6280\u672f\u95ee\u9898\u53ca\u60c5\u7eea\u6ce2\u52a8\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u81ea\u6211\u5b9e\u73b0\u800c\u6765\uff0c\u8ffd\u6c42\u4e13\u4e1a\u7cbe\u8fdb\u4e0e\u521b\u4f5c\u6210\u5c31\u611f\uff0c\u800c\u975e\u77ed\u671f\u53d8\u73b0\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4e0d\u60f3\u53ea\u505a\u4e00\u4e2a\u2018\u4f1a\u548c\u4eba\u6253\u4ea4\u9053\u2019\u7684\u4eba...\u60f3\u8981\u6162\u6162\u5b9e\u73b0\u5b89\u5b89\u9759\u9759\u4e5f\u80fd\u505a\u4e8b\uff0c\u53ef\u4ee5\u901a\u8fc7\u521b\u4f5c\u83b7\u5f97\u65b0\u7684\u4e0d\u540c\u7684\u6210\u5c31\u611f\uff0c\u8fd8\u53ef\u517c\u987e\u751f\u6d3b\uff0c\u5c3d\u91cf\u8fdc\u79bb\u4e0d\u5fc5\u8981\u7684\u55a7\u56a3[\u5bb3\u7f9e]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\uff0c\u4f46\u80fd\u8d2d\u4e70\u8bfe\u7a0b\u53ca\u767e\u5ea6\u7f51\u76d8\u4f1a\u5458\uff0c\u6682\u65e0\u660e\u663e\u8d44\u91d1\u538b\u529b\u4fe1\u53f7\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u2b07\u4f4e** \u2014 \u6838\u5fc3\u77ed\u677f\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u65f6\u95f4\u88ab\u5de5\u4f5c\u3001\u5bb6\u5ead\u548c\u5b66\u4e60\u6324\u5360\u6b86\u5c3d\uff0c\u5904\u4e8e\u201c\u56eb\u56f5\u541e\u54bd\u201d\u3001\u201c\u8111\u888b\u660f\u660f\u6c89\u6c89\u201d\u7684\u8d85\u8d1f\u8377\u72b6\u6001\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u27a1\u4e2d\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u80fd\u72ec\u7acb\u89e3\u51b3\u95ee\u9898\uff08\u5982\u8d2d\u4e70\u7f51\u76d8\u4f1a\u5458\u3001\u534f\u8c03\u56e2\u961f\u4e8b\u52a1\uff09\uff0c\u9047\u5230\u6280\u672f\u96be\u9898\u4f1a\u4e3b\u52a8\u5bfb\u6c42\u5e2e\u52a9\u5e76\u7406\u89e3\u5bf9\u65b9\u96be\u5904\u3002\u4f46\u5728\u591a\u91cd\u538b\u529b\uff08\u65f6\u95f4\u3001\u6280\u672f\u3001\u5b66\u4e60\u8fdb\u5ea6\uff09\u53e0\u52a0\u4e0b\uff0c\u4f1a\u8868\u73b0\u51fa\u660e\u663e\u7684\u7126\u8651\u548c\u75b2\u60eb\u611f\uff0c\u5e76\u9009\u62e9\u201c\u5ef6\u671f\u201d\u6765\u8c03\u6574\u8282\u594f\uff0c\u800c\u975e\u76f4\u63a5\u653e\u5f03\u6216\u6fc0\u70c8\u62b1\u6028\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u7406\u89e3\u4f60...\u4e0d\u7528\u96be\u4e3a\u5979\u4e86\uff0c\u5979\u4e5f\u4e0d\u5bb9\u6613\u3002\u201d (\u4f53\u73b0\u540c\u7406\u5fc3\u4e0e\u7406\u6027\u6c9f\u901a)\n> \u201c\u8111\u5b50\u55e1\u55e1\u7684[\u6342\u8138]\u201d\u3001\u201c\u8fd9\u51e0\u5929\u6211\u7684\u8111\u888b\u4e00\u76f4\u8bf4\u660f\u6c89\u6c89\u7684[\u6342\u8138]\u201d (\u4f53\u73b0\u538b\u529b\u4e0b\u7684\u60c5\u7eea\u72b6\u6001)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u201c\u5931\u63a7\u611f\u201d\u7684\u6050\u60e7**\u3002\u4f5c\u4e3a\u524d\u5236\u7247\u4eba\uff08\u638c\u63a7\u8005\u89d2\u8272\uff09\uff0c\u8f6c\u578b\u671f\u9762\u4e34\u65f6\u95f4\u5931\u63a7\uff08\u6781\u5ea6\u5fd9\u788c\uff09\u3001\u6280\u672f\u5931\u63a7\uff08\u7535\u8111\u95ee\u9898\uff09\u3001\u5b66\u4e60\u8fdb\u5ea6\u5931\u63a7\uff08\u8bfe\u7a0b\u79ef\u538b\uff09\u7684\u591a\u91cd\u5939\u51fb\uff0c\u8fd9\u6311\u6218\u4e86\u5979\u7684\u80fd\u529b\u548c\u79e9\u5e8f\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u79e9\u5e8f\u91cd\u5efa\u201d\u4e0e\u201c\u4ef7\u503c\u786e\u8ba4\u201d**\u3002\u5e2e\u52a9\u5979\u91cd\u65b0\u83b7\u5f97\u5bf9\u5b66\u4e60\u8fdb\u7a0b\u7684\u638c\u63a7\u611f\uff0c\u5e76\u901a\u8fc7\u4e13\u4e1a\u4e0a\u7684\u70b9\u6ef4\u8fdb\u6b65\uff0c\u786e\u8ba4\u5979\u8f6c\u578b\u63a2\u7d22\u7684\u4ef7\u503c\u548c\u610f\u4e49\uff0c\u6ee1\u8db3\u5176\u201c\u901a\u8fc7\u521b\u4f5c\u83b7\u5f97\u65b0\u6210\u5c31\u611f\u201d\u7684\u6df1\u5c42\u6e34\u671b\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u9ad8\u52a8\u673a\uff0c\u4f46\u8d44\u6e90\u5e95\u5ea7\u5b58\u5728\u4e25\u91cd\u77ed\u677f\uff0c\u9700\u91cd\u70b9\u652f\u6301) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u5177\u5907\u4e13\u4e1a\u80cc\u666f\uff0c\u8ffd\u6c42\u786c\u6838\u6280\u80fd\uff0c\u884c\u52a8\u529b\u5f3a\uff0c\u4f46\u5f53\u524d\u88ab\u73b0\u5b9e\u6761\u4ef6\u4e25\u91cd\u63a3\u8098\uff0c\u5904\u4e8e\u201c\u5b9e\u5e72\u4f46\u53d7\u56f0\u201d\u72b6\u6001) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5c5e\u53cd\u5bf9\u7b49\u5371\u9669\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u672a\u53d1\u73b0\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u56e0\u5de5\u4f5c\u3001\u5bb6\u5ead\u3001\u591a\u7ebf\u5b66\u4e60\u5bfc\u81f4\u65f6\u95f4\u7cbe\u529b\u5f7b\u5e95\u5d29\u76d8\uff0c\u4ea7\u751f\u201c\u5b66\u4e86\u4e5f\u8ddf\u4e0d\u4e0a\u201d\u7684\u7edd\u671b\u611f\uff0c\u4ece\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4e2d | \u6280\u672f\u95ee\u9898\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\uff09\u82e5\u957f\u671f\u65e0\u6cd5\u89e3\u51b3\uff0c\u53e0\u52a0\u65f6\u95f4\u538b\u529b\uff0c\u53ef\u80fd\u6210\u4e3a\u538b\u57ae\u9a86\u9a7c\u7684\u6700\u540e\u4e00\u6839\u7a3b\u8349\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u52a8\u673a\u4e3a\u81ea\u6211\u5b9e\u73b0\u800c\u975e\u5feb\u901f\u53d8\u73b0\uff0c\u5bf9\u77ed\u671f\u6536\u76ca\u671f\u5f85\u4e0d\u9ad8\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c2-4\u5468**\u3002\u5f53\u8bfe\u7a0b\u96be\u5ea6\u63d0\u5347\u3001\u4f5c\u4e1a\u91cf\u589e\u52a0\uff0c\u4e0e\u7528\u6237\u672c\u5c31\u6349\u895f\u89c1\u8098\u7684\u65f6\u95f4\u4ea7\u751f\u5267\u70c8\u51b2\u7a81\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6797\u66e6\u89c1\u5c71\u540c\u5b66\u4f60\u597d\uff0c\u770b\u5230\u4f60\u4e4b\u524d\u4e3a\u4e86\u534f\u8c03\u5b66\u4e60\u65f6\u95f4\u4ed8\u51fa\u4e86\u5f88\u591a\u52aa\u529b\uff0c\u975e\u5e38\u4f69\u670d\u3002\u54b1\u4eec87\u671f\u5f00\u8425\u540e\uff0c\u8bf7\u52a1\u5fc5\u628a\u2018\u5b8c\u6210\u6bd4\u5b8c\u7f8e\u66f4\u91cd\u8981\u2019\u4f5c\u4e3a\u7b2c\u4e00\u539f\u5219\u3002\u4f60\u7684\u4e13\u4e1a\u80cc\u666f\u548c\u7406\u89e3\u529b\u662f\u4f18\u52bf\uff0c\u54b1\u4eec\u4e0d\u8ffd\u6c42\u4e00\u6b21\u6027\u6d88\u5316\u6240\u6709\u5185\u5bb9\uff0c\u91cd\u70b9\u662f\u627e\u5230\u53ef\u6301\u7eed\u7684\u5b66\u4e60\u8282\u594f\uff0c\u54ea\u6015\u6bcf\u5929\u53ea\u8fdb\u6b65\u4e00\u70b9\u70b9\u3002\u6280\u672f\u95ee\u9898\u4ea4\u7ed9\u6211\u4eec\uff0c\u4f60\u4e13\u6ce8\u5728\u521b\u4f5c\u672c\u8eab\u5c31\u597d\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176T2\u5b9e\u5e72\u5c5e\u6027\uff0c\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u843d\u5730\u7684\u6280\u80fd\u8fdb\u9636\u8def\u5f84\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u3010\u65f6\u95f4\u7ba1\u7406\u8f7b\u91cf\u5305\u3011** + **\u3010\u6280\u672f\u95ee\u9898\u7eff\u8272\u901a\u9053\u3011**\u3002\u5fc5\u987b\u4f18\u5148\u5e2e\u52a9\u5979\u89e3\u51b3\u65f6\u95f4\u89c4\u5212\u548c\u8bbe\u5907\u95ee\u9898\uff0c\u8fd9\u662f\u5979\u80fd\u7ee7\u7eed\u5b66\u4e60\u7684\u7269\u7406\u57fa\u7840\u3002\u53ef\u8003\u8651\u63d0\u4f9b\u8bfe\u7a0b\u91cd\u70b9\u6458\u8981\u3001\u7075\u6d3b\u4f5c\u4e1a\u63d0\u4ea4\u673a\u5236\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7ed9\u5979\u65bd\u52a0\u201c\u5fc5\u987b\u8ddf\u76f4\u64ad\u201d\u3001\u201c\u5fc5\u987b\u5b8c\u6210\u6240\u6709\u4f5c\u4e1a\u201d\u7684\u538b\u529b\u3002\u907f\u514d\u7528\u201c\u522b\u4eba\u90fd\u80fd\u505a\u5230\u201d\u6765\u6fc0\u52b1\u5979\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u73b0\u9636\u6bb5\u63a8\u4ecb\u4efb\u4f55\u9ad8\u9636\u3001\u7ebf\u4e0b\u6216\u5927\u989d\u8bfe\u7a0b**\uff08\u5982\u9ad8\u7814\u73ed\uff09\u3002\u5979\u7684\u8d44\u6e90\u5e95\u5ea7\u5df2\u4e25\u91cd\u8fc7\u8f7d\uff0c\u4efb\u4f55\u589e\u52a0\u8d1f\u62c5\u7684\u9500\u552e\u884c\u4e3a\u90fd\u4f1a\u76f4\u63a5\u5f15\u7206\u9000\u8d39\u98ce\u9669\u3002\u53ea\u6709\u5f53\u5979\u660e\u786e\u8868\u8fbe\u201c\u65f6\u95f4\u7406\u987a\u4e86\u201d\u3001\u201c\u627e\u5230\u8282\u594f\u4e86\u201d\u4e4b\u540e\uff0c\u65b9\u53ef\u8c28\u614e\u8bc4\u4f30\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u5df2\u7ecf\u51e0\u4e4e\u6ca1\u6709\u505a\u5176\u4ed6\u4e8b\u7684\u65f6\u95f4\u4e86[\u6342\u8138] \u6d17\u624b\u95f4\u90fd\u5c0f\u8dd1\u201d\n2. > \u201c\u4e0d\u60f3\u53ea\u505a\u4e00\u4e2a\u2018\u4f1a\u548c\u4eba\u6253\u4ea4\u9053\u2019\u7684\u4eba...\u60f3\u8981\u6162\u6162\u5b9e\u73b0\u5b89\u5b89\u9759\u9759\u4e5f\u80fd\u505a\u4e8b\uff0c\u53ef\u4ee5\u901a\u8fc7\u521b\u4f5c\u83b7\u5f97\u65b0\u7684\u4e0d\u540c\u7684\u6210\u5c31\u611f\u201d\n3. > \u201c\u6211\u662f\u5728\u6478\u7d22\u8f6c\u578b...\u6ca1\u5f88\u786e\u5b9a\u8fd9\u4e8e\u6211\u800c\u8a00\u662f\u80af\u5b9a\u6b63\u786e\u4e4b\u524d\u4e5f\u4e0d\u60f3\u60f3\u592a\u591a\u4e86\uff0c\u6211\u8fd8\u9700\u8981\u66f4\u591a\u7684\u6b63\u9762\u53cd\u9988\uff0c\u518d\u4e00\u6b65\u6b65\u63a8\u8fdb\u5427\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u81ea\u6211\u5b9e\u73b0\u4e0e\u79e9\u5e8f\u611f**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u5e2e\u52a9\u5176\u91cd\u5efa\u5b66\u4e60\u8282\u594f\u611f\uff0c\u63d0\u4f9b\u65f6\u95f4\u7ba1\u7406\u652f\u6301\u4e0e\u6280\u672f\u515c\u5e95\uff0c\u4e25\u7981\u65bd\u52a0\u989d\u5916\u538b\u529b\u4e0e\u5347\u5355**\u3002\n\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"risk_level\": \"\u4e2d\u9ad8\", \"refund_risk\": \"\u4e2d\u9ad8\", \"maslow_need\": \"\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u65f6\u95f4\u7ba1\u7406\u8f7b\u91cf\u5305\"}";
