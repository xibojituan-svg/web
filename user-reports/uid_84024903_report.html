        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 84024903 (\u6635\u79f0\uff1a\u9732\u6e7f\u9752\u886b) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u871c\u963f\u91524(\u674e\u4f1f)\u3001\u79cb\u7c73\u679c(\u767d\u82b3) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u7cfb\u7edf\u8bfe (\u4ef7\u683c\uff1a3980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3** (\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u65e0\u6cd5\u5224\u65ad) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3** (\u4ec5\u63d0\u53ca\u201c\u6bcf\u5468\u80af\u5b9a\u67095\u4e2a\u5c0f\u65f6\u4ee5\u4e0a\u7684\u788e\u7247\u5316\u65f6\u95f4\u201d\uff0c\u4f46\u672a\u8bf4\u660e\u5177\u4f53\u804c\u4e1a\u4e0e\u4f5c\u606f) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3** (\u672a\u63d0\u53ca) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49** (\u6709\u5b66\u4e60\u4e92\u52a8\u4e0e\u52a8\u673a\u8868\u8fbe\uff0c\u4f46\u7f3a\u4e4f\u5173\u952e\u8d44\u6e90\u4e0e\u5bb6\u5ead\u80cc\u666f\u4fe1\u606f) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u6709\u660e\u786e\u7684\u526f\u4e1a\u53d8\u73b0\u8bc9\u6c42\uff0c\u4f46\u540c\u65f6\u4e5f\u8868\u73b0\u51fa\u5bf9\u5b66\u4e60\u8fc7\u7a0b\u3001\u6280\u80fd\u63d0\u5347\u548c\u884c\u4e1a\u4f53\u9a8c\u7684\u5174\u8da3\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u662f\u7684\uff0c\u4f20\u7edf\u884c\u4e1a\u9ad8\u4e0d\u6210\u4f4e\u4e0d\u5c31\u7684\u3002\u5176\u4ed6\u884c\u4e1a\u6295\u5165\u7684\u8bd5\u9519\u6210\u672c\u592a\u9ad8\u3002\u6709\u58f0\u4e66\u8fd9\u4e2a\u884c\u4e1a\u53ea\u9700\u8981\u6295\u5165\u65f6\u95f4\u548c\u7cbe\u529b\uff0c\u4f46\u5176\u4ed6\u9644\u5e26\u6210\u672c\u8981\u6c42\u5e76\u4e0d\u9ad8\uff0c\u76f8\u5bf9\u5750\u73ed\u52a0\u73ed\u7c7b\u7684\u5de5\u4f5c\uff0c\u66f4\u80fd\u7167\u987e\u5bb6\u5ead\u751f\u6d3b\u3002\u201d\n> \u201c\u5148cv\u5427\uff0c\u4eca\u5929\u867d\u7136\u770b\u4e86\u6f14\u793a\uff0c\u4e86\u89e3\u4e86\u8fd9\u51e0\u4e2a\u659c\u6760\u804c\u4e1a\uff0c\u4f46\u8fd8\u6ca1\u4e0a\u624b\u8bd5\u8fc7\uff0c\u540e\u9762\u4f1a\u5bf9\u659c\u6760\u5de5\u79cd\u57f9\u8bad\u5417\uff1f\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u5df2\u652f\u4ed83980\u5143\u8bfe\u7a0b\u8d39\u7528\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\u6216\u501f\u8d37\uff0c\u4f46\u672a\u900f\u9732\u66f4\u591a\u8d22\u52a1\u4fe1\u606f\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u81ea\u79f0\u6709\u6bcf\u54685\u5c0f\u65f6\u4ee5\u4e0a\u7684\u788e\u7247\u5316\u65f6\u95f4\u7528\u4e8e\u5b66\u4e60\u548c\u517c\u804c\uff0c\u4f46\u672a\u8bf4\u660e\u5177\u4f53\u804c\u4e1a\uff0c\u65f6\u95f4\u5145\u88d5\u5ea6\u5b58\u7591\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4e2d** \u2014 \u63d0\u53ca\u201c\u66f4\u80fd\u7167\u987e\u5bb6\u5ead\u751f\u6d3b\u201d\uff0c\u6697\u793a\u5bb6\u5ead\u8d23\u4efb\u8f83\u91cd\uff0c\u4f46\u672a\u660e\u786e\u652f\u6301\u6216\u53cd\u5bf9\u6001\u5ea6\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9762\u5bf9\u9500\u552e/\u73ed\u4e3b\u4efb\u7684\u5bc6\u96c6\u4efb\u52a1\u5b89\u6392\uff08\u4f5c\u4e1a\u3001\u76f4\u64ad\u3001\u8003\u6838\uff09\u5747\u80fd\u7a33\u5b9a\u5b8c\u6210\u5e76\u7ed9\u4e88\u79ef\u6781\u53cd\u9988\uff0c\u672a\u8868\u73b0\u51fa\u4efb\u4f55\u7126\u8651\u3001\u81ea\u6211\u6000\u7591\u6216\u4f9d\u8d56\u5b89\u629a\u7684\u8ff9\u8c61\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u5168\u7a0b\u56de\u590d\u7b80\u6d01\u3001\u9ad8\u6548\uff08\u201c\u597d\u7684\u201d\u3001\u201c[OK]\u201d\u3001\u201c\u6536\u5230\u201d\uff09\uff0c\u6309\u65f6\u5b8c\u6210\u6240\u6709\u4efb\u52a1\uff08\u4f5c\u4e1a\u3001\u76f4\u64ad\u3001\u9884\u7ea6\uff09\uff0c\u4e3b\u52a8\u63d0\u95ee\u6280\u672f\u7ec6\u8282\uff08\u5f55\u97f3\u8f6f\u4ef6\u3001\u683c\u5f0f\u8f6c\u6362\uff09\uff0c\u5c55\u73b0\u51fa\u826f\u597d\u7684\u6267\u884c\u529b\u548c\u81ea\u4e3b\u5b66\u4e60\u80fd\u529b\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 (\u7126\u8651\u4fdd\u969c) \u4e0e \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42 (\u5f52\u5c5e\u611f) \u7684\u590d\u5408\u4f53**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u201c\u4f20\u7edf\u884c\u4e1a\u9ad8\u4e0d\u6210\u4f4e\u4e0d\u5c31\u201d\u7684\u73b0\u72b6\u611f\u5230\u7126\u8651\uff0c\u5bfb\u6c42\u4e00\u4efd\u65f6\u95f4\u7075\u6d3b\u3001\u8bd5\u9519\u6210\u672c\u4f4e\u3001\u80fd\u517c\u987e\u5bb6\u5ead\u7684\u526f\u4e1a\u4f5c\u4e3a\u7ecf\u6d4e\u4e0e\u804c\u4e1a\u7684\u201c\u5b89\u5168\u57ab\u201d\u3002\u540c\u65f6\uff0c\u5bf9\u201c\u62b1\u56e2\u53d6\u6696\u201d\u3001\u201c\u4e00\u8d77\u5f55\u4e66\u201d\u7684\u884c\u4e1a\u793e\u7fa4\u6709\u671f\u5f85\uff0c\u5bfb\u6c42\u5f52\u5c5e\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u9760\u8c31\u7684\u9886\u8def\u4eba\u201d\u4e0e\u201c\u7a33\u5b9a\u7684\u6218\u53cb\u5708\u201d**\u3002\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u6267\u884c\u7684\u6210\u957f\u8def\u5f84\uff08\u4eceCV\u5230\u659c\u6760\u5de5\u79cd\uff09\uff0c\u5e76\u6784\u5efa\u4e00\u4e2a\u80fd\u4e92\u76f8\u652f\u6301\u3001\u5171\u540c\u8fdb\u6b65\u7684\u793e\u7fa4\u73af\u5883\uff0c\u6ee1\u8db3\u5176\u5b89\u5168\u4e0e\u5f52\u5c5e\u7684\u53cc\u91cd\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u9ad8\u6267\u884c\u529b\u3001\u7a33\u5b9a\u4ea4\u4ed8\u3001\u5bf9\u6280\u672f\u6709\u8ffd\u6c42) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u3001\u5bb6\u5ead\u53cd\u5bf9\u7b49\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u63d0\u53ca\u201c\u7167\u987e\u5bb6\u5ead\u201d\uff0c\u82e5\u5bb6\u5ead\u7a81\u53d1\u53d8\u6545\u6216\u53cd\u5bf9\uff0c\u53ef\u80fd\u4ea7\u751f\u5f71\u54cd\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u6838\u5fc3\u98ce\u9669\u70b9**\uff1a\u82e5\u5176\u627f\u8bfa\u7684\u201c\u6bcf\u54685\u5c0f\u65f6\u788e\u7247\u65f6\u95f4\u201d\u56e0\u5de5\u4f5c/\u5bb6\u5ead\u7a81\u53d1\u60c5\u51b5\u65e0\u6cd5\u5151\u73b0\uff0c\u5bfc\u81f4\u8bfe\u7a0b\u79ef\u538b\uff0c\u53ef\u80fd\u56e0\u201c\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\u201d\u7684\u81ea\u8d23\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u5b66\u4e60\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u632b\u6298\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u867d\u672a\u6781\u7aef\u8ffd\u95ee\u201c\u51e0\u5929\u8d5a\u94b1\u201d\uff0c\u4f46\u6838\u5fc3\u9a71\u52a8\u529b\u4ecd\u662f\u526f\u4e1a\u53d8\u73b0\u3002\u82e5\u5b66\u4e602-3\u4e2a\u6708\u540e\u63a5\u5355\u673a\u4f1a\u6e3a\u832b\u6216\u6536\u5165\u8fdc\u4f4e\u4e8e\u9884\u671f\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c4-8\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u5b66\u4e60\u96be\u5ea6\u589e\u52a0\uff0c\u82e5\u540c\u65f6\u906d\u9047\u201c\u65f6\u95f4\u88ab\u6324\u538b\u201d\u548c\u201c\u63a5\u5355\u65e0\u671b\u201d\u7684\u53cc\u91cd\u6253\u51fb\uff0c\u6d41\u5931\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u9732\u6e7f\u9752\u886b\u540c\u5b66\u4f60\u597d\uff0c\u770b\u5230\u4f60\u5b66\u4e60\u975e\u5e38\u8ba4\u771f\uff0c\u4f5c\u4e1a\u5b8c\u6210\u5f97\u4e5f\u5f88\u68d2\u3002\u54b1\u4eec\u8fd9\u4e2a\u884c\u4e1a\uff0c\u5c31\u50cf\u4f60\u770b\u5230\u7684\uff0c\u786e\u5b9e\u662f\u4e2a\u2018\u6162\u5de5\u51fa\u7ec6\u6d3b\u2019\u7684\u9886\u57df\uff0c\u524d\u671f\u6253\u597d\u57fa\u7840\u6bd4\u6025\u7740\u63a5\u5355\u66f4\u91cd\u8981\u3002\u6211\u4f1a\u6839\u636e\u4f60\u7684\u65f6\u95f4\u8282\u594f\uff0c\u5e2e\u4f60\u89c4\u5212\u597d\u6bcf\u4e00\u6b65\uff0c\u54b1\u4eec\u7a33\u624e\u7a33\u6253\uff0c\u65e2\u80fd\u5b66\u5230\u771f\u672c\u4e8b\uff0c\u4e5f\u80fd\u517c\u987e\u597d\u5bb6\u5ead\u3002\u4ee5\u540e\u5728\u7fa4\u91cc\uff0c\u54b1\u4eec\u5c31\u662f\u4e00\u8d77\u8fdb\u6b65\u7684\u6218\u53cb\u4e86\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176T2\u8001\u9ec4\u725b\u7279\u8d28\uff0c\u63d0\u4f9b\u624e\u5b9e\u3001\u7cfb\u7edf\u3001\u6709\u6df1\u5ea6\u7684\u6280\u672f\u6559\u5b66\u5185\u5bb9\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u517c\u987e\u5bb6\u5ead\u7684\u9700\u6c42\uff0c\u8865\u5145**\u3010\u65f6\u95f4\u5f39\u6027\u652f\u6301\u5305\u3011**\uff08\u5982\u5f55\u64ad\u8bfe\u53ef\u968f\u65f6\u56de\u770b\u3001\u4f5c\u4e1a\u63d0\u4ea4\u7a97\u53e3\u5bbd\u677e\uff09\u3002\u9488\u5bf9\u5176\u53d8\u73b0\u8bc9\u6c42\uff0c\u5728\u6280\u80fd\u8fbe\u6807\u540e\uff0c\u53ca\u65f6\u63d0\u4f9b**\u3010\u7cbe\u786e\u6d3e\u5355\u5b9e\u6218\u5305\u3011**\uff08B\u6a21\u5757\uff09\uff0c\u7528\u771f\u5b9e\u3001\u5339\u914d\u7684\u8bd5\u97f3\u673a\u4f1a\u6ee1\u8db3\u5176\u5b89\u5168\u9700\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u51e0\u5929\u901f\u6210\u3001\u6708\u5165\u8fc7\u4e07\u201d\u7684\u5938\u5f20\u8bdd\u672f\u523a\u6fc0\u5176\u53d8\u73b0\u7126\u8651\u3002\u907f\u514d\u5728\u5176\u65f6\u95f4\u7d27\u5f20\u65f6\u65bd\u52a0\u9ad8\u538b\u50ac\u4ea4\u4f5c\u4e1a\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u8fdb\u884c\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u9700\u5efa\u7acb\u5728\u6280\u80fd\u663e\u8457\u63d0\u5347\u548c\u4fe1\u4efb\u5efa\u7acb\u4e4b\u540e**\u3002\u4f8b\u5982\uff0c\u5728\u5176\u5b8c\u6210\u57fa\u7840CV\u8bfe\u7a0b\u5e76\u8868\u73b0\u51fa\u8272\u540e\uff0c\u53ef\u63a8\u8350\u540e\u671f\u5236\u4f5c\u3001\u5ba1\u542c\u7b49\u201c\u659c\u6760\u5de5\u79cd\u201d\u8fdb\u9636\u8bfe\u7a0b\uff0c\u5f3a\u8c03\u201c\u591a\u6280\u80fd\u508d\u8eab\uff0c\u63a5\u5355\u8303\u56f4\u66f4\u5e7f\uff0c\u6536\u5165\u66f4\u7a33\u5b9a\u201d\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u662f\u7684\uff0c\u4f20\u7edf\u884c\u4e1a\u9ad8\u4e0d\u6210\u4f4e\u4e0d\u5c31\u7684\u3002\u5176\u4ed6\u884c\u4e1a\u6295\u5165\u7684\u8bd5\u9519\u6210\u672c\u592a\u9ad8\u3002\u6709\u58f0\u4e66\u8fd9\u4e2a\u884c\u4e1a\u53ea\u9700\u8981\u6295\u5165\u65f6\u95f4\u548c\u7cbe\u529b\uff0c\u4f46\u5176\u4ed6\u9644\u5e26\u6210\u672c\u8981\u6c42\u5e76\u4e0d\u9ad8\uff0c\u76f8\u5bf9\u5750\u73ed\u52a0\u73ed\u7c7b\u7684\u5de5\u4f5c\uff0c\u66f4\u80fd\u7167\u987e\u5bb6\u5ead\u751f\u6d3b\u3002\u201d **\uff08\u52a8\u673a\uff1a\u52a1\u5b9e\u53d8\u73b0+\u517c\u987e\u5bb6\u5ead\uff09**\n2. > \u201c\u5148cv\u5427\uff0c\u4eca\u5929\u867d\u7136\u770b\u4e86\u6f14\u793a\uff0c\u4e86\u89e3\u4e86\u8fd9\u51e0\u4e2a\u659c\u6760\u804c\u4e1a\uff0c\u4f46\u8fd8\u6ca1\u4e0a\u624b\u8bd5\u8fc7\uff0c\u540e\u9762\u4f1a\u5bf9\u659c\u6760\u5de5\u79cd\u57f9\u8bad\u5417\uff1f\u201d **\uff08\u884c\u4e3a\uff1a\u4e3b\u52a8\u89c4\u5212\u3001\u6280\u672f\u63a2\u7d22\u503e\u5411\uff09**\n3. > \u201c\u4e2d\u5348\u8001\u5e08\u663e\u793a\u7684\u5f55\u97f3\u8f6f\u4ef6\u662f\u4ec0\u4e48\uff0c\u82f9\u679c\u624b\u673a\u4e0a\u7528\u4ec0\u4e48\u8f6f\u4ef6\uff1f\u6211\u6628\u5929\u7528\u624b\u673a\u8bed\u97f3\u5907\u5fd8\u5f55\u5f55\u97f3\uff0c\u683c\u5f0f\u662f.m4a\u7684\uff0c\u662f\u4e0d\u662f\u8fd8\u9700\u8981\u4e0b\u4e00\u4e2a\u683c\u5f0f\u8f6c\u6362\u8f6f\u4ef6\uff0c\u4ed6\u97f3\u9891\u8f6c\u6362\u6210mp3\u683c\u5f0f\u7684\u624d\u884c\uff1f\u201d **\uff08\u884c\u4e3a\uff1a\u4e3b\u52a8\u89e3\u51b3\u6280\u672f\u95ee\u9898\uff0c\u6267\u884c\u529b\u5f3a\uff0c\u5fc3\u7406\u5f39\u6027\u9ad8\uff09**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u4e00\u4efd\u80fd\u517c\u987e\u5bb6\u5ead\u7684\u3001\u7a33\u5b9a\u7684\u526f\u4e1a\u5b89\u5168\u611f\u4e0e\u884c\u4e1a\u5f52\u5c5e\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6e05\u6670\u3001\u7a33\u5b9a\u7684\u6210\u957f\u8def\u5f84\u4e0e\u65f6\u95f4\u5f39\u6027\u652f\u6301\uff0c\u7528\u771f\u5b9e\u7684\u3001\u5339\u914d\u7684\u6d3e\u5355\u673a\u4f1a\u5151\u73b0\u5176\u53d8\u73b0\u671f\u671b\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\u4e0e\u793e\u4ea4\u9700\u6c42\u590d\u5408\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u65f6\u95f4\u5f39\u6027\u652f\u6301\u5305\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u9655\u897f\"}\n```";
