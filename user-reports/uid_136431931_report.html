        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 136431931 / \u6635\u79f0\uff1a\u9e93\u5c7f\u62fe\u5149 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u70ed\u70ed2(\u7eaa\u9e4f) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u9ad8\u9636\u73ed (4\u4e2a\u6708+1\u4e2a\u6708\u5267\u793e\u5b9e\u8bad)\uff0c\u4ef7\u683c7380\u5143 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u5145\u88d5 (\u5df2\u652f\u4ed87380\u5143) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1 (\u6709\u5168\u804c\u5de5\u4f5c\uff0c\u65f6\u95f4\u96f6\u788e\uff0c\u665a\u4e0a\u56de\u5bb6\u53ef\u7528\u7535\u8111) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u7f3a\u5931 (\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\uff0c**\u9700\u91cd\u70b9\u6838\u67e5**) |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e2d\u7b49 (\u5b66\u4e60\u4e92\u52a8\u79ef\u6781\uff0c\u4f46\u5173\u952e\u5bb6\u5ead\u3001\u8d22\u52a1\u80cc\u666f\u4fe1\u606f\u7f3a\u5931) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u5bf9\u6280\u80fd\u672c\u8eab\u6709\u63a2\u7d22\u6b32\uff0c\u53d8\u73b0\u9884\u671f\u5408\u7406\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5176\u5b9e\u6211\u786e\u5b9e\u5176\u4ed6\u5185\u5bb9\u50cf\u8a00\u60c5\uff0c\u6050\u6016\uff0c\u60ac\u7591\uff0c\u4e5f\u90fd\u60f3\u5c1d\u8bd5\u4e00\u4e0b\uff0c\u6709\u70b9\u8d2a\u5fc3\u554a[\u6342\u8138]\uff0c\u4ee5\u524d\u73a9\u8fc7\u4e00\u9635\u8da3\u914d\u97f3\u4f46\u662f\u6ca1\u6709\u575a\u6301\uff0c\u4e00\u76f4\u89c9\u5f97\u914d\u97f3\u91cc\u89d2\u8272\u626e\u6f14\u633a\u6709\u610f\u601d\u7684\uff0c\u5e74\u7eaa\u5927\u4e86\u624d\u60f3\u8d77\u6765\u8bd5\u8bd5\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u4e00\u6b21\u6027\u652f\u4ed87380\u5143\u9ad8\u9636\u73ed\u8d39\u7528\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u7ecf\u6d4e\u72b6\u51b5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u6709\u5168\u804c\u5de5\u4f5c\uff0c\u65f6\u95f4\u96f6\u788e\uff0c\u4f46\u8868\u793a\u201c\u665a\u4e0a\u56de\u5bb6\u53ef\u4ee5\u505a\u4e00\u4e9b\u7535\u8111\u7684\u6d3b\u201d\uff0c\u5177\u5907\u89c4\u5212\u610f\u8bc6\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u4ec5\u63d0\u53ca\u201c\u5b69\u5b50\u4e0a\u9ad8\u4e2d\u201d\uff0c\u672a\u63d0\u53ca\u914d\u5076\u6216\u5bb6\u4eba\u5bf9\u5b66\u4e60\u3001\u652f\u51fa\u7684\u6001\u5ea6\u3002**\u6b64\u4e3a\u91cd\u5927\u98ce\u9669\u7f3a\u53e3**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u80fd\u4e3b\u52a8\u53cd\u601d\u4f5c\u4e1a\u95ee\u9898\uff0c\u63a5\u53d7\u6307\u5bfc\uff0c\u5fc3\u6001\u5e73\u7a33\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u521a\u542c\u5b8c\u8001\u5e08\u4f5c\u4e1a\u70b9\u8bc4\uff0c\u8c22\u8c22\u8001\u5e08\u5938\u5956\uff0c\u573a\u666f\u95f4\u9694\u65f6\u95f4\u592a\u77ed\uff0c\u6211\u4f1a\u6ce8\u610f\u7684\uff0c\u89d2\u8272\u626e\u6f14\u6ca1\u6709\u6ce8\u610f\u8eab\u4efd\u53d8\u6362\uff0c\u58f0\u97f3\u53cd\u5dee\u6ca1\u51fa\u6765\uff0c\u6211\u7ee7\u7eed\u52aa\u529b[\u62b1\u62f3]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 (\u8ffd\u6c42\u6210\u5c31\u3001\u81ea\u4fe1\u3001\u81ea\u6211\u4ef7\u503c)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u4e2d\u5e74\u9636\u6bb5\uff08\u201c\u5e74\u7eaa\u5927\u4e86\u624d\u60f3\u8d77\u6765\u8bd5\u8bd5\u201d\uff09\uff0c\u53ef\u80fd\u9762\u4e34\u804c\u4e1a\u5026\u6020\u6216\u4ef7\u503c\u611f\u505c\u6ede\uff0c\u5e0c\u671b\u901a\u8fc7\u638c\u63e1\u65b0\u6280\u80fd\u3001\u83b7\u5f97\u65b0\u8eab\u4efd\uff08\u6709\u58f0\u4e3b\u64ad\uff09\u6765\u91cd\u83b7\u793e\u4f1a\u8ba4\u53ef\u548c\u81ea\u6211\u80af\u5b9a\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u8fdb\u9636\u8def\u5f84\u7684\u6e05\u6670\u611f**\u3002\u8ba9\u4ed6\u611f\u53d7\u5230\u81ea\u5df1\u201c\u88ab\u770b\u89c1\u201d\u3001\u201c\u88ab\u8ba4\u53ef\u4e3a\u6709\u6f5c\u529b\u8005\u201d\uff0c\u5e76\u901a\u8fc7\u660e\u786e\u7684\u6210\u957f\u9636\u68af\uff08\u4ece\u659c\u6760\u5230\u5f55\u5236\u5230\u6d3e\u6d3b\uff09\u6ee1\u8db3\u5176\u201c\u6210\u4e3a\u4e13\u5bb6/\u7ba1\u7406\u8005\u201d\u7684\u5c0a\u91cd\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u52a8\u673a\u7eaf\u3001\u6709\u57fa\u7840\u3001\u6709\u89c4\u5212\uff0c\u4f46\u5b58\u5728\u5bb6\u5ead\u652f\u6301\u5ea6\u672a\u77e5\u7684\u98ce\u9669) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u5173\u6ce8\u6280\u80fd\u7ec6\u8282\uff0c\u613f\u610f\u94bb\u7814\uff0c\u884c\u52a8\u529b\u5f3a\uff0c\u4e0d\u5f20\u626c\u4f46\u76ee\u6807\u660e\u786e) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u804a\u5929\u8bb0\u5f55\u5b8c\u5168\u672a\u63d0\u53ca\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u652f\u6301\u3002\u82e5\u5bb6\u4eba\u53cd\u5bf9\u6216\u5bf9\u652f\u51fa\u4e0d\u77e5\u60c5\uff0c\u6781\u6613\u5728\u540e\u7eed\u56e0\u65f6\u95f4\u5360\u7528\u6216\u7ecf\u6d4e\u95ee\u9898\u5f15\u53d1\u51b2\u7a81\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u6709\u5de5\u4f5c\uff0c\u4f46\u5df2\u89c4\u5212\u5229\u7528\u788e\u7247\u548c\u665a\u95f4\u65f6\u95f4\uff0c\u4e14\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u81ea\u6211\u8c03\u6574\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u6001\u79ef\u6781\uff0c\u4e3b\u52a8\u5bfb\u6c42\u53cd\u9988\u5e76\u6539\u8fdb\uff0c\u6297\u632b\u6298\u80fd\u529b\u5f3a\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u5bf9\u53d8\u73b0\u8def\u5f84\u6709\u6e05\u6670\u8ba4\u77e5\uff08\u4ece\u659c\u6760\u5165\u624b\uff09\uff0c\u9884\u671f\u7ba1\u7406\u5230\u4f4d\uff0c\u672a\u8981\u6c42\u77ed\u671f\u66b4\u5bcc\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e1-2\u5468**\u3002\u5f53\u6b63\u5f0f\u8bfe\u7a0b\u4efb\u52a1\u4e0e\u672c\u804c\u5de5\u4f5c\u3001\u5bb6\u5ead\u751f\u6d3b\u65f6\u95f4\u51b2\u7a81\u52a0\u5267\u65f6\uff0c\u82e5\u5bb6\u4eba\u53cd\u5bf9\uff0c\u53ef\u80fd\u5728\u6b64\u9636\u6bb5\u96c6\u4e2d\u7206\u53d1\u77db\u76fe\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u9e93\u5c7f\u62fe\u5149\u540c\u5b66\u4f60\u597d\uff0c\u770b\u5230\u4f60\u63d0\u4ea4\u7684\u4f5c\u4e1a\u548c\u601d\u8003\uff0c\u80fd\u611f\u53d7\u5230\u4f60\u5bf9\u58f0\u97f3\u6f14\u64ad\u662f\u771f\u5fc3\u559c\u6b22\u4e14\u6709\u94bb\u7814\u7cbe\u795e\u7684\uff0c\u8fd9\u4efd\u2018\u8d2a\u5fc3\u2019\uff08\u60f3\u5c1d\u8bd5\u591a\u79cd\u98ce\u683c\uff09\u6070\u6070\u662f\u4f18\u79c0\u4e3b\u64ad\u7684\u6f5c\u8d28\u3002\u54b1\u4eec\u9ad8\u9636\u73ed\u5c31\u662f\u4e3a\u4f60\u8fd9\u6837\u6709\u57fa\u7840\u3001\u60f3\u6df1\u8015\u7684\u540c\u5b66\u8bbe\u8ba1\u7684\uff0c\u63a5\u4e0b\u6765\u6211\u4f1a\u966a\u4f60\u4e00\u8d77\uff0c\u628a\u8fd9\u4efd\u5174\u8da3\u7a33\u7a33\u5730\u53d8\u6210\u4f60\u7684\u786c\u6838\u6280\u80fd\u548c\u7b2c\u4e8c\u6536\u5165\u66f2\u7ebf\u3002**\u7b2c\u4e00\u6b65\uff0c\u54b1\u4eec\u5148\u786e\u4fdd\u5b66\u4e60\u8ba1\u5212\u80fd\u548c\u4f60\u7684\u5de5\u4f5c\u3001\u5bb6\u5ead\u65f6\u95f4\u5b8c\u7f8e\u878d\u5408\uff0c\u6709\u4efb\u4f55\u9700\u8981\u534f\u8c03\u7684\u5730\u65b9\u968f\u65f6\u627e\u6211\u3002**\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176T2\u5b9e\u5e72\u7279\u8d28\uff0c\u63d0\u4f9b\u624e\u5b9e\u7684\u6280\u80fd\u8bad\u7ec3\u548c\u660e\u786e\u7684\u8fdb\u9636\u8def\u5f84\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176**\u5bb6\u5ead\u652f\u6301\u5ea6\u4fe1\u606f\u7f3a\u5931**\u7684\u98ce\u9669\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u5bb6\u5ead\u5173\u7cfb\u6da6\u6ed1\u5305\u3011**\uff08\u8bdd\u672f\u6307\u5bfc\uff09\uff0c\u7531\u73ed\u4e3b\u4efb\u5728\u5f00\u8425\u521d\u671f\u4ee5\u201c\u4e86\u89e3\u5b66\u4e60\u65f6\u95f4\u5b89\u6392\uff0c\u65b9\u4fbf\u63d0\u4f9b\u652f\u6301\u201d\u4e3a\u7531\uff0c\u59d4\u5a49\u63a2\u660e\u5bb6\u4eba\u6001\u5ea6\u5e76\u63d0\u4f9b\u6c9f\u901a\u7b56\u7565\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u53ea\u7ed9\u7a7a\u6d1e\u7684\u8868\u626c\uff0c\u4e0d\u7ed9\u5177\u4f53\u7684\u3001\u6709\u6311\u6218\u6027\u7684\u4e13\u4e1a\u53cd\u9988\u30022. \u5ffd\u7565\u5176\u65f6\u95f4\u89c4\u5212\u9700\u6c42\uff0c\u5e03\u7f6e\u65e0\u6cd5\u5229\u7528\u788e\u7247\u65f6\u95f4\u5b8c\u6210\u7684\u7d27\u6025\u4efb\u52a1\u30023. **\u5ffd\u89c6\u5bb6\u5ead\u98ce\u9669\u6838\u67e5\uff0c\u5728\u5bb6\u4eba\u53cd\u5bf9\u540e\u5f3a\u884c\u633d\u5355**\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u57fa\u4e8e\u5176\u6280\u80fd\u8fdb\u9636\uff08\u5982\u540e\u671f\u5236\u4f5c\u3001\u5bfc\u6f14\u80fd\u529b\uff09\u8fdb\u884c\u5408\u7406\u5347\u5355\uff0c\u4f46\u9700\u5728\u5176\u65f6\u95f4\u7cbe\u529b\u5141\u8bb8\u8303\u56f4\u5185\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5176\u5b9e\u6211\u786e\u5b9e\u5176\u4ed6\u5185\u5bb9\u50cf\u8a00\u60c5\uff0c\u6050\u6016\uff0c\u60ac\u7591\uff0c\u4e5f\u90fd\u60f3\u5c1d\u8bd5\u4e00\u4e0b\uff0c\u6709\u70b9\u8d2a\u5fc3\u554a[\u6342\u8138]\uff0c\u4ee5\u524d\u73a9\u8fc7\u4e00\u9635\u8da3\u914d\u97f3\u4f46\u662f\u6ca1\u6709\u575a\u6301\uff0c\u4e00\u76f4\u89c9\u5f97\u914d\u97f3\u91cc\u89d2\u8272\u626e\u6f14\u633a\u6709\u610f\u601d\u7684\uff0c\u5e74\u7eaa\u5927\u4e86\u624d\u60f3\u8d77\u6765\u8bd5\u8bd5\u201d **\uff08\u52a8\u673a\u7eaf\u5ea6\u9ad8\u7684\u6838\u5fc3\u8bc1\u660e\uff1a\u5174\u8da3\u9a71\u52a8\u3001\u591a\u5143\u63a2\u7d22\uff09**\n2. > \u201c\u6211\u8981\u4e0a\u73ed\uff0c\u4e0d\u662f\u5f88\u5fd9\u4f46\u662f\u6709\u65f6\u5019\u65f6\u95f4\u6709\u70b9\u96f6\u788e\uff0c\u624b\u673a\u4e0a\u7684\u6d3b\u8fd8\u884c\uff0c\u665a\u4e0a\u56de\u5bb6\u53ef\u4ee5\u505a\u4e00\u4e9b\u7535\u8111\u7684\u6d3b\u201d **\uff08\u8d44\u6e90\u5e95\u5ea7\u4e2d\u7b49\u7684\u8bc1\u660e\uff1a\u6709\u65f6\u95f4\u89c4\u5212\u610f\u8bc6\uff0c\u4f46\u53d7\u9650\u4e8e\u5168\u804c\u5de5\u4f5c\uff09**\n3. > \u201c\u521a\u542c\u5b8c\u8001\u5e08\u4f5c\u4e1a\u70b9\u8bc4\uff0c\u8c22\u8c22\u8001\u5e08\u5938\u5956\uff0c\u573a\u666f\u95f4\u9694\u65f6\u95f4\u592a\u77ed\uff0c\u6211\u4f1a\u6ce8\u610f\u7684\uff0c\u89d2\u8272\u626e\u6f14\u6ca1\u6709\u6ce8\u610f\u8eab\u4efd\u53d8\u6362\uff0c\u58f0\u97f3\u53cd\u5dee\u6ca1\u51fa\u6765\uff0c\u6211\u7ee7\u7eed\u52aa\u529b[\u62b1\u62f3]\u201d **\uff08\u5fc3\u7406\u5f39\u6027\u9ad8\u7684\u6838\u5fc3\u8bc1\u660e\uff1a\u4e3b\u52a8\u53cd\u601d\u3001\u79ef\u6781\u6539\u8fdb\u3001\u60c5\u7eea\u7a33\u5b9a\uff09**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2\u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u81ea\u6211\u4ef7\u503c\u91cd\u5851\uff08\u5c0a\u91cd\u9700\u6c42\uff09**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d\u7b49\uff08\u4e3b\u8981\u98ce\u9669\u6765\u81ea\u672a\u77e5\u7684\u5bb6\u5ead\u652f\u6301\u5ea6\uff09**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u5f00\u8425\u521d\u671f\u5b8c\u6210\u5bb6\u5ead\u77e5\u60c5\u6743\u4e0e\u652f\u6301\u5ea6\u6838\u67e5\uff0c\u5e76\u5339\u914d\u786c\u6838\u3001\u6709\u6311\u6218\u6027\u7684\u4e13\u4e1a\u6280\u80fd\u6307\u5bfc**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"maslow_need\": \"\u7b2c\u56db\u5c42\u5c0a\u91cd\u9700\u6c42\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5bb6\u5ead\u5173\u7cfb\u6da6\u6ed1\u5305\"}\n```";
