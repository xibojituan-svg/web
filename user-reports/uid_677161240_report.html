    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677161240\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677161240 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5f20\u4e00\u837b\uff08\u9500\u552e\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6500\u767b\u8ba1\u5212\u9ad8\u9636\u7248\uff087380\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u82b1\u5457\u5206\u671f4\u4e2a\u6708** |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u63a8\u6d4b\u4e3a\u788e\u7247\u5316\u62fc\u51d1\uff08\u591c\u95f4\u53ef\u5b66\u4e60\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e2d\u7b49\uff08\u4e92\u52a8\u79ef\u6781\uff0c\u4f46\u5173\u952e\u80cc\u666f\u4fe1\u606f\u7f3a\u5931\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u800c\u6765\uff0c\u4eab\u53d7\u5b66\u4e60\u4e0e\u4e92\u52a8\u8fc7\u7a0b\uff0c\u5173\u6ce8\u6280\u80fd\u63d0\u5347\uff0c\u800c\u975e\u77ed\u671f\u53d8\u73b0\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5e08\u59d0\uff0c\u6211\u4e0a\u9ea6\u4e86\uff0c\u4f46\u662f\u9ea6\u514b\u98ce\u6ca1\u58f0\u97f3\uff0c\u53c8\u4e0b\u6765\u4e86\u201d (\u79ef\u6781\u53c2\u4e0e\u4e92\u52a8) > \u201c\u611f\u89c9\u4e0d\u9519\uff0c\u8ba9\u4f60\u8d39\u5fc3\u4e86\u201d (\u6b63\u9762\u53cd\u9988) > \u201c\u597d\u7684\u8001\u5e08\uff0c\u665a\u4e0a\u6211\u518d\u8bfb\u8bfb\u770b\u201d (\u4e3b\u52a8\u7ec3\u4e60) > \u201c\u8001\u5e08\u7684\u70b9\u8bc4\u592a\u7280\u5229\u4e86[\u7b11\u8138]\u201d (\u4e50\u4e8e\u63a5\u53d7\u4e13\u4e1a\u53cd\u9988)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u4f7f\u7528\u82b1\u5457\u5206\u671f4\u4e2a\u6708\u652f\u4ed87380\u5143\u8bfe\u7a0b\uff0c\u8868\u660e\u8d44\u91d1\u975e\u4e00\u6b21\u6027\u5145\u88d5\uff0c\u5b58\u5728\u4e00\u5b9a\u5468\u8f6c\u538b\u529b\uff0c\u4f46\u672a\u8fbe\u5230\u501f\u8d37\u62a5\u540d\u7ea7\u522b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u8ddf\u4e0a\u76f4\u64ad\u8bfe\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u591c\u95f4\u7ec3\u4e60\uff08\u201c\u665a\u4e0a\u6211\u518d\u8bfb\u8bfb\u770b\u201d\uff09\uff0c\u65f6\u95f4\u5b89\u6392\u8f83\u4e3a\u89c4\u5f8b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u8fdb\u76f4\u64ad\u95f4\u6ca1\u58f0\u97f3\u3001\u9ea6\u514b\u98ce\u6ca1\u58f0\u97f3\uff09\u80fd\u81ea\u884c\u5c1d\u8bd5\u89e3\u51b3\u6216\u5e73\u9759\u53cd\u9988\uff0c\u672a\u51fa\u73b0\u60c5\u7eea\u5d29\u6e83\u6216\u81ea\u6211\u5426\u5b9a\u3002\u63a5\u53d7\u7280\u5229\u70b9\u8bc4\u540e\u6001\u5ea6\u79ef\u6781\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u521a\u624b\u673a\u6ca1\u7535\u4e86\u201d (\u5ba2\u89c2\u9648\u8ff0\u95ee\u9898) > \u201c\u6211yun\u201d (\u8f7b\u677e\u8c03\u4f83) > \u201c\u6211\u662f\u620f\u7cbe\u201d (\u5c55\u73b0\u5e7d\u9ed8\u4e0e\u81ea\u4fe1) > \u201c\u8001\u5e08\u7684\u70b9\u8bc4\u592a\u7280\u5229\u4e86[\u7b11\u8138]\u201d (\u4ee5\u79ef\u6781\u5fc3\u6001\u770b\u5f85\u6279\u8bc4)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u5efa\u7acb\u6df1\u5ea6\u5e08\u751f/\u540c\u4f34\u8fde\u63a5\u6709\u5f3a\u70c8\u6e34\u671b\uff0c\u5e0c\u671b\u83b7\u5f97\u6301\u7eed\u7684\u5173\u6ce8\u548c\u60c5\u611f\u652f\u6301\uff0c\u800c\u4e0d\u4ec5\u4ec5\u662f\u6280\u80fd\u5b66\u4e60\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u3001\u88ab\u9700\u8981\u3001\u88ab\u6301\u7eed\u966a\u4f34\u201d\u7684\u5f52\u5c5e\u611f**\u3002\u9500\u552e\u201c\u5e08\u59d0\u201d\u7684\u89d2\u8272\u626e\u6f14\u548c\u7ec6\u81f4\u5173\u6000\uff08\u5982\u63d0\u9192\u5403\u996d\uff09\u7cbe\u51c6\u51fb\u4e2d\u4e86\u4ed6\u7684\u60c5\u611f\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T7 \u72c2\u70ed\u6b7b\u5fe0\u7c89** (\u9ad8\u60c5\u611f\u9ecf\u6027\u3001\u9ad8\u63a8\u8350\u610f\u613f) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u7b49\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u652f\u4ed8\u65b9\u5f0f\u4e3a\u5206\u671f\uff0c\u9700\u7559\u610f\u5bb6\u5ead\u8d22\u52a1\u538b\u529b\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u5b66\u4e60\u610f\u613f\u5f3a\uff0c\u65f6\u95f4\u5b89\u6392\u89c4\u5f8b\uff0c\u5d29\u76d8\u98ce\u9669\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u63a5\u53d7\u7280\u5229\u70b9\u8bc4\uff0c\u60c5\u7eea\u7a33\u5b9a\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u5bf9\u201c\u5e08\u59d0\u201d\u7684\u60c5\u611f\u4f9d\u8d56\u6781\u5f3a\uff0c\u82e5\u540e\u7eed\u670d\u52a1\uff08\u5982\u73ed\u4e3b\u4efb\u4ea4\u63a5\uff09\u51fa\u73b0\u65ad\u5c42\uff0c\u6216\u53d8\u73b0\u8fdb\u5ea6\u8fdc\u4f4e\u4e8e\u9884\u671f\uff0c\u53ef\u80fd\u56e0\u60c5\u611f\u843d\u5dee\u5bfc\u81f4\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e1\u4e2a\u6708\u5185**\u3002\u82e5\u201c\u5e08\u59d0\u201d\u89d2\u8272\u7a81\u7136\u62bd\u79bb\uff0c\u6216\u73ed\u7ea7\u6c1b\u56f4\u51b7\u6de1\uff0c\u5176\u60c5\u611f\u9700\u6c42\u5f97\u4e0d\u5230\u6ee1\u8db3\uff0c\u53ef\u80fd\u4ea7\u751f\u201c\u88ab\u629b\u5f03\u611f\u201d\u800c\u9000\u8d39\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u54c8\u55bd\uff0c\u6211\u662f\u4f60\u7684\u65b0\u73ed\u4e3b\u4efbXX\u3002\u4e00\u837b\u5e08\u59d0\u7279\u610f\u8ddf\u6211\u4ea4\u4ee3\u4e86\uff0c\u8bf4\u4f60\u7279\u522b\u8ba4\u771f\u53c8\u6709\u8da3\uff0c\u662f\u4e2a\u2018\u620f\u7cbe\u2019\u6f5c\u529b\u80a1\uff01\u4ee5\u540e\u5b66\u4e60\u4e0a\u6709\u4ec0\u4e48\u95ee\u9898\u968f\u65f6\u627e\u6211\uff0c\u751f\u6d3b\u4e0a\u60f3\u5520\u55d1\u4e86\u4e5f\u6b22\u8fce\u6765\u6233\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u628a\u8fd9\u4e2a\u2018\u620f\u2019\u6f14\u597d\u3001\u6f14\u7cbe\u5f69\uff01\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** (\u56e0\u5176\u6709\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b)\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u3010\u7279\u79cdC\u6a21\u5757\uff08\u60c5\u7eea\u4fdd\u59c6\u4e0e\u4f34\u98de\u6c60\uff09\u3011** + **\u3010D\u6a21\u5757\uff08\u8eab\u4efd\u4e0e\u6743\u529b\u5149\u73af\u6c60\uff09\u3011**\u3002\u5fc5\u987b\u7528\u6b7b\u515a\u59ff\u6001\u4ea4\u5f80\uff0c\u7ed9\u4e88\u9ad8\u60c5\u611f\u8ba4\u540c\u3002\u53ef\u8003\u8651\u8d4b\u4e88\u5176\u201c\u6c14\u6c1b\u7ec4\u7ec4\u957f\u201d\u3001\u201c\u65b0\u4eba\u6b22\u8fce\u5b98\u201d\u7b49\u975e\u6b63\u5f0f\u5934\u8854\uff0c\u6ee1\u8db3\u5176\u88ab\u9700\u8981\u3001\u88ab\u5c0a\u91cd\u7684\u9700\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5728\u5efa\u7acb\u6df1\u5ea6\u60c5\u611f\u8fde\u63a5\u524d\uff0c\u8fdb\u884c\u51b7\u51b0\u51b0\u7684\u3001\u7eaf\u4e8b\u52a1\u6027\u7684\u6c9f\u901a\u3002\u7981\u6b62\u5ffd\u89c6\u5176\u60c5\u611f\u4e92\u52a8\u9700\u6c42\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u8fdb\u884c\u5927\u989d\u63a8\u4ecb\uff0c\u4f46**\u5fc5\u987b\u5efa\u7acb\u5728\u6301\u7eed\u7684\u60c5\u611f\u7ef4\u62a4\u548c\u4fe1\u4efb\u57fa\u7840\u4e0a**\u3002\u5bf9\u4ed6\u6765\u8bf4\uff0c\u4e3a\u201c\u4fe1\u4efb\u7684\u4eba\u201d\u4ed8\u8d39\u7684\u610f\u613f\u8fdc\u9ad8\u4e8e\u4e3a\u201c\u8bfe\u7a0b\u201d\u4ed8\u8d39\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5e08\u59d0\uff0c\u6211\u4e0a\u9ea6\u4e86\uff0c\u4f46\u662f\u9ea6\u514b\u98ce\u6ca1\u58f0\u97f3\uff0c\u53c8\u4e0b\u6765\u4e86\u201d \u2014 **\u79ef\u6781\u53c2\u4e0e\u3001\u4e3b\u52a8\u5c1d\u8bd5\u7684\u8bc1\u660e**\u3002\n2. > \u201c\u8001\u5e08\u7684\u70b9\u8bc4\u592a\u7280\u5229\u4e86[\u7b11\u8138]\u201d \u2014 **\u9ad8\u5fc3\u7406\u5f39\u6027\u3001\u4e50\u4e8e\u63a5\u53d7\u4e13\u4e1a\u53cd\u9988\u7684\u8bc1\u660e**\u3002\n3. > \u201c\u5e08\u59d0\uff0c\u6211\u5e0c\u671b\u4f60\u4e00\u76f4\u90fd\u5728(\u3065\u00af\u00b3\u00af)\u3065\ud83d\udc95\u201d \u2014 **\u6838\u5fc3\u9700\u6c42\u66b4\u9732\uff1a\u6781\u5ea6\u6e34\u671b\u7a33\u5b9a\u3001\u6301\u7eed\u7684\u60c5\u611f\u8fde\u63a5\u548c\u966a\u4f34**\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T7\u72c2\u70ed\u6b7b\u5fe0\u7c89\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u6301\u7eed\u7684\u60c5\u611f\u966a\u4f34\u4e0e\u793e\u7fa4\u5f52\u5c5e\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7528\u201c\u6b7b\u515a\u201d\u59ff\u6001\u63d0\u4f9b\u9ad8\u6d53\u5ea6\u60c5\u611f\u4ef7\u503c\uff0c\u4e25\u9632\u670d\u52a1\u65ad\u5c42\u5bfc\u81f4\u7684\u60c5\u611f\u843d\u5dee\u3011**\u3002\n\n```json\n{\"core_type\": \"T7 \u72c2\u70ed\u6b7b\u5fe0\u7c89\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u793e\u4ea4/\u5c0a\u91cd\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u7279\u79cdC+D\u6a21\u5757\"}\n```";
