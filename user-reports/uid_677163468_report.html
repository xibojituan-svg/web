        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID: 677163468\u7684\u7528\u6237\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677163468 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5b8b\u6653\u6f2b (\u900d\u9065\u5e08\u59d0) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u9a6c\u62c9\u96c5\u6709\u58f0\u4e3b\u64ad\u4f53\u9a8c\u8bfe/\u6b63\u4ef7\u8bfe (\u4ef7\u683c\u672a\u660e\u793a\uff0c\u652f\u4ed8400\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3 (\u9ad8\u5371)** \u2014 \u7528\u6237\u660e\u786e\u8868\u793a\u201c\u501f\u7684\u94b1\u201d\uff0c\u5e76\u8ba1\u5212\u201c\u5230\u671f\u4e86\uff0c\u518d\u501f\u522b\u7684\u8f6f\u4ef6\u201d\u8fdb\u884c\u5468\u8f6c\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u9ad8\u5bbd\u88d5** \u2014 \u81ea\u7531\u804c\u4e1a\u8005\uff0c\u81ea\u79f0\u201c\u65f6\u95f4\u6bd4\u8f83\u5145\u88d5\u201d\uff0c\u4e0d\u5199\u4f5c\u65f6\u201c24\u5c0f\u65f6\u53ef\u4ee5\u652f\u914d\u201d\uff0c\u5199\u4f5c\u65f6\u201c\u8981\u75595\u4e2a\u5c0f\u65f6\u201d\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** \u2014 \u4e92\u52a8\u9891\u7e41\uff0c\u63d0\u4f9b\u4e86\u804c\u4e1a\u3001\u52a8\u673a\u3001\u65f6\u95f4\u3001\u652f\u4ed8\u884c\u4e3a\u7b49\u5173\u952e\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u2b07\u4f4e (2\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u7eaf\u4e3a\u51e0\u5929\u5185\u63d0\u73b0\u4fdd\u5e95\u800c\u6765(\u4f4e\u6781\u5371)**\u3002\u6838\u5fc3\u9a71\u52a8\u662f\u751f\u5b58\u538b\u529b\uff08\u201c\u5b9e\u5728\u662f\u5403\u4e0d\u8d77\u996d\u4e86\u201d\uff09\uff0c\u5bf9\u201c\u591a\u4e45\u80fd\u8d5a\u94b1\u201d\u6781\u5ea6\u654f\u611f\uff0c\u5728\u652f\u4ed8\u540e\u7acb\u5373\u8ffd\u95ee\u201c\u516d\u6708\u4e4b\u524d\u80fd\u62ff\u5230\u6536\u5165\u5417\u201d\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u6211\u8fd9\u8fb9\u517c\u804c\u662f\u5c0f\u8bf4\u5bb6\uff0c\u5b9e\u5728\u662f\u5403\u4e0d\u8d77\u996d\u4e86\uff0c\u5c0f\u8bf4\u4e0e\u6709\u58f0\u5c0f\u8bf4\u4e0d\u5206\u5bb6\uff0c\u5c31\u6709\u4e9b\u5174\u8da3\uff0c\u6765\u770b\u770b\u201d\n> \u201c\u611f\u5174\u8da3\u7684\uff0c\u4ef7\u683c\u4f4e\u4e00\u70b9\u4e5f\u6ca1\u95ee\u9898\uff0c\u997f\u4e0d\u6b7b\u6211\u5c31\u884c[\u6342\u8138]\u201d\n> \u201c\u8001\u5e08\uff0c\u6211\u516d\u6708\u4e4b\u524d\u80fd\u62ff\u5230\u6536\u5165\u5417\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e (0\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u2b07\u4f4e (0\u5206)** \u2014 **\u6838\u5fc3\u77ed\u677f**\u3002\u7528\u6237\u4ec5\u6709300\u5143\uff0c\u62a5\u540d\u8d39400\u5143\u4e3a\u501f\u6b3e\uff0c\u5e76\u8ba1\u5212\u4ee5\u8d37\u517b\u8d37\u3002**\u8d44\u6e90\u5e95\u5ea7\u5df2\u5d29\u584c\uff0c\u89e6\u53caT8-D\u7edd\u8def\u8d4c\u5f92\u7ea2\u7ebf\u3002**\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u2b06\u9ad8 (8\u5206)** \u2014 \u81ea\u7531\u804c\u4e1a\u8005\uff0c\u65f6\u95f4\u9ad8\u5ea6\u81ea\u7531\uff0c\u5b66\u4e60\u610f\u613f\u548c\u6267\u884c\u5ea6\u5c1a\u53ef\uff08\u6309\u65f6\u4ea4\u4f5c\u4e1a\u3001\u8ddf\u76f4\u64ad\uff09\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u672a\u63d0\u53ca\uff0c\u4f46\u57fa\u4e8e\u5176\u7ecf\u6d4e\u72b6\u51b5\uff0c\u63a8\u6d4b\u652f\u6301\u5ea6\u4f4e\u6216\u65e0\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b07\u4f4e (2\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u5728\u521d\u6b21\u5c1d\u8bd5\u540e\u7acb\u5373\u81ea\u6211\u5426\u5b9a\uff08\u201c\u6211\u542c\u7740\u5f88\u96be\u542c\uff0c\u6211\u662f\u4e0d\u662f\u4e0d\u9002\u5408\u505a\u8fd9\u4e2a\u201d\uff09\uff0c\u8868\u73b0\u51fa\u6781\u4f4e\u7684\u81ea\u6211\u6548\u80fd\u611f\uff0c\u9700\u8981\u5916\u90e8\u80af\u5b9a\u6765\u7ef4\u6301\u4fe1\u5fc3\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u6211\u542c\u7740\u5f88\u96be\u542c\uff0c\u6211\u662f\u4e0d\u662f\u4e0d\u9002\u5408\u505a\u8fd9\u4e2a\u201d\n> \u201c\u6211\u90fd\u53ef\u4ee5\uff0c\u4ec0\u4e48\u90fd\u4e0d\u4f1a\uff0c\u4ec0\u4e48\u90fd\u4e0d\u6562\u4fdd\u8bc1\uff0c\u90fd\u662f\u8981\u5b66\u7684\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e00\u5c42\uff1a\u751f\u5b58\u5b89\u5168**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u751f\u5b58\u5371\u673a**\u3002\u4f5c\u4e3a\u81ea\u7531\u804c\u4e1a\u5c0f\u8bf4\u5bb6\uff0c\u9762\u4e34\u201c\u5403\u4e0d\u8d77\u996d\u201d\u7684\u7d27\u8feb\u7ecf\u6d4e\u538b\u529b\uff0c\u5c06\u6709\u58f0\u884c\u4e1a\u89c6\u4e3a\u6551\u547d\u7a3b\u8349\uff0c\u5bf9\u77ed\u671f\u73b0\u91d1\u6d41\u5165\u6709\u6781\u5ea6\u6e34\u6c42\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u7684\u5b89\u5168\u611f\u4e0e\u5373\u65f6\u5e0c\u671b**\u3002\u4ed6\u9700\u8981\u7684\u4e0d\u662f\u8fdc\u666f\uff0c\u800c\u662f\u201c\u4e0b\u4e2a\u6708\u5c31\u80fd\u6709\u6536\u5165\u201d\u7684\u660e\u786e\u627f\u8bfa\u548c\u8def\u5f84\uff0c\u4ee5\u7f13\u89e3\u751f\u5b58\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udd34D\u7c7b** (\u89e6\u53d1T8-D\u7edd\u8def\u8d4c\u5f92\u534f\u8bae) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T8-D \u7edd\u8def\u8d4c\u5f92** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a**\ud83d\udd34\u5df2\u89e6\u53d1 D \u7c7b\u7194\u65ad\u7ea2\u7ebf\uff01**\n- **\u89e6\u53d1\u56e0\u7531**\uff1a**\u590d\u5408\u7edd\u671b\u4fe1\u53f7**\u3002\u8d44\u6e90\u5e95\u5ea7\u8bc4\u5206\u22640\uff08\u501f\u8d37\u62a5\u540d\uff09+ \u5fc3\u7406\u5f39\u6027\u8bc4\u5206\u22642\uff08\u6781\u5ea6\u81ea\u5351\uff09+ \u52a8\u673a\u7eaf\u5ea6\u6781\u4f4e\uff08\u7eaf\u4e3a\u77ed\u671f\u53d8\u73b0\uff09\u3002\u7b26\u5408\u5224\u5b9a\u6811\u7b2c\u4e00\u5c42\u524d\u7f6e\u9694\u7206\u7b5b\u7684\u89e6\u53d1\u6761\u4ef6\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u9ad8** | \u501f\u6b3e\u62a5\u540d\uff0c\u82e5\u88ab\u5bb6\u4eba\u53d1\u73b0\u6216\u8fd8\u6b3e\u538b\u529b\u9aa4\u589e\uff0c\u6781\u6613\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u5e76\u8981\u6c42\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u867d\u7136\u65f6\u95f4\u5145\u88d5\uff0c\u4f46\u82e5\u77ed\u671f\u5185\uff08\u59821-2\u5468\uff09\u63a5\u5355\u5931\u8d25\uff0c\u5176\u8106\u5f31\u7684\u5fc3\u7406\u5f39\u6027\u53ef\u80fd\u5bfc\u81f4\u201c\u5b66\u4e0d\u4f1a\u3001\u8d5a\u4e0d\u5230\u201d\u7684\u5d29\u6e83\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | \u4f5c\u4e1a\u88ab\u62d2\u3001\u8bd5\u97f3\u5931\u8d25\u7b49\u4efb\u4f55\u5fae\u5c0f\u632b\u6298\uff0c\u90fd\u53ef\u80fd\u89e6\u53d1\u5176\u201c\u6211\u662f\u4e0d\u662f\u4e0d\u9002\u5408\u201d\u7684\u81ea\u6211\u5426\u5b9a\uff0c\u8fdb\u800c\u653e\u5f03\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u5bf9\u201c\u516d\u6708\u524d\u62ff\u5230\u6536\u5165\u201d\u62b1\u6709\u5e7b\u60f3\u3002\u4e00\u65e6\u73b0\u5b9e\u4e0e\u9884\u671f\u4e0d\u7b26\uff08\u5982\u63a5\u5355\u5468\u671f\u957f\u3001\u5355\u4ef7\u4f4e\uff09\uff0c\u5c06\u7acb\u523b\u66b4\u6012\u8981\u6c42\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c1-2\u5468\uff0c\u9996\u6b21\u8bd5\u97f3\u5931\u8d25\u6216\u7b2c\u4e00\u7b14\u6536\u5165\u672a\u8fbe\u9884\u671f\u65f6\u3002**\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6211\u5b8c\u5168\u7406\u89e3\u4f60\u73b0\u5728\u7684\u60c5\u51b5\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u6b65\u6765\u3002\u6211\u5148\u5e2e\u4f60\u89c4\u5212\u4e00\u4e2a\u6700\u7a33\u59a5\u3001\u80fd\u6700\u5feb\u89c1\u5230\u5c0f\u94b1\u513f\u7684\u8def\u5f84\uff0c\u8ba9\u4f60\u5148\u7a33\u4f4f\u3002\u522b\u6015\uff0c\u6709\u6211\u5728\uff0c\u54b1\u4eec\u4e0d\u753b\u5927\u997c\uff0c\u5c31\u8e0f\u8e0f\u5b9e\u5b9e\u8d70\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011** \u2014 \u5fc5\u987b\u805a\u7126\u4e8e\u6700\u4f4e\u95e8\u69db\u3001\u6700\u5feb\u80fd\u4ea7\u751f\u73b0\u91d1\u6d41\u7684\u4efb\u52a1\uff08\u5982\u5bf9\u8f68\u3001\u753b\u672c\u3001\u4f4e\u5355\u4ef7\u65c1\u767d\uff09\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u8865\u5145 **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\uff08\u6ee1\u914dC\u6a21\u5757\uff09\uff0c\u63d0\u4f9b\u9ad8\u9891\u3001\u5938\u5f20\u7684\u9f13\u52b1\u548c\u60c5\u7eea\u6258\u5e95\uff0c\u9632\u6b62\u5176\u56e0\u632b\u6298\u800c\u5d29\u6e83\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a**\u7edd\u4e0d\u5bf9\u5176\u4f7f\u7528\u4efb\u4f55\u201c\u66b4\u5bcc\u201d\u3001\u201c\u8f7b\u677e\u6708\u5165\u8fc7\u4e07\u201d\u7684\u8bdd\u672f\uff1b\u7edd\u4e0d\u5728\u5176\u672a\u7a33\u5b9a\u63a5\u5355\u524d\u63a8\u9500\u4efb\u4f55\u9ad8\u9636\u8bfe\u7a0b\uff08\u6218\u7565\u6027\u62d2\u5356\u7194\u65ad\uff09\uff1b\u7edd\u4e0d\u5bf9\u5176\u4f5c\u4e1a\u8fdb\u884c\u51b7\u51b0\u51b0\u7684\u6280\u672f\u6253\u51fb\u3002**\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5347\u5355**\u3002\u5728\u672a\u7a33\u5b9a\u4ea7\u751f\u6536\u5165\u3001\u672a\u5efa\u7acb\u8db3\u591f\u4fe1\u4efb\u548c\u8fd8\u6b3e\u80fd\u529b\u524d\uff0c\u7981\u6b62\u63a8\u8350\u4efb\u4f55\u4ed8\u8d39\u5347\u7ea7\u9879\u76ee\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u8fd9\u8fb9\u517c\u804c\u662f\u5c0f\u8bf4\u5bb6\uff0c\u5b9e\u5728\u662f\u5403\u4e0d\u8d77\u996d\u4e86\uff0c\u5c0f\u8bf4\u4e0e\u6709\u58f0\u5c0f\u8bf4\u4e0d\u5206\u5bb6\uff0c\u5c31\u6709\u4e9b\u5174\u8da3\uff0c\u6765\u770b\u770b\u201d\n2. > \u201c\u624b\u91cc\u6709300...\u501f\u7684\u94b1...\u5230\u671f\u4e86\uff0c\u518d\u501f\u522b\u7684\u8f6f\u4ef6\u201d\n3. > \u201c\u8001\u5e08\uff0c\u6211\u516d\u6708\u4e4b\u524d\u80fd\u62ff\u5230\u6536\u5165\u5417\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T8-D \u7edd\u8def\u8d4c\u5f92\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u751f\u5b58\u5b89\u5168\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7acb\u5373\u542f\u52a8T8-D\u5371\u673a\u5904\u7f6e\u534f\u8bae\uff0c\u8fdb\u884c\u9006\u5411\u9884\u671f\u7ba1\u7406\uff0c\u5e76\u4e25\u9632\u4efb\u4f55\u5fae\u5c0f\u632b\u6298\u5bfc\u81f4\u5176\u60c5\u7eea\u5d29\u6e83\u3011**\u3002\n\n```json\n{\"core_type\": \"T8-D \u7edd\u8def\u8d4c\u5f92\u578b\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u751f\u5b58\u5b89\u5168\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf + \u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\"}\n```";
