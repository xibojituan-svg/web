        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 536037746 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u51ac\u51ac\u8001\u5e08\uff08\u9a6c\u65b0\u6708\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u5f20\u9707\u914d\u97f3\u5b9e\u6218\u8bfe\u7a0b\uff08\u610f\u5411\u9636\u6bb5\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u4ef7\u683c\u654f\u611f\u5ea6\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u9700\u540c\u65f6\u4e0a\u6d1e\u7bab\u8bfe\u3001\u6d41\u884c\u6b4c\u66f2\u8bfe\uff0c\u65f6\u95f4\u51b2\u7a81\uff0c\u4f9d\u8d56\u56de\u653e\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u60c5\u51b5\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\uff08\u7f3a\u4e4f\u652f\u4ed8\u80fd\u529b\u3001\u5bb6\u5ead\u652f\u6301\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u7b49\u5173\u952e\u4fe1\u606f\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u4e86\u201c\u628a\u6bcf\u4e2a\u5c97\u4f4d\u90fd\u6d4f\u89c8\u4e00\u904d\u201d\u7684\u63a2\u7d22\u5fc3\u6001\uff0c\u5bf9\u201c\u5feb\u901f\u6536\u5165\u3001\u957f\u671f\u6536\u5165\u3001\u659c\u6760\u6536\u5165\u201d\u5747\u6709\u5174\u8da3\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u5bf9\u6781\u901f\u53d8\u73b0\u7684\u5f3a\u70c8\u6267\u5ff5\u3002\u5176\u5b66\u4e60\u914d\u97f3\u4e0e\u6d1e\u7bab\u3001\u6d41\u884c\u6b4c\u66f2\u7b49\u5174\u8da3\u5e76\u884c\uff0c\u52a8\u673a\u4e2d\u5174\u8da3\u4e0e\u53d8\u73b0\u5e76\u5b58\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u4e5f\u60f3\u4ece\u5e95\u5c42\u505a\u8d77\uff0c\u628a\u6bcf\u4e2a\u5c97\u4f4d\u90fd\u6d4f\u89c8\u4e00\u904d\uff08\u778e\u60f3\u7684\uff0c\u6bd5\u7adf\u60f3\u505a\u7684\u4eba\u5f88\u591a\uff09\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u2b07\u4f4e** \u2014 \u7528\u6237\u540c\u65f6\u5b66\u4e60\u6d1e\u7bab\u3001\u6d41\u884c\u6b4c\u66f2\u7b49\u591a\u95e8\u8bfe\u7a0b\uff0c\u5df2\u4e0e\u914d\u97f3\u76f4\u64ad\u8bfe\u65f6\u95f4\u51b2\u7a81\uff08\u201c\u4eca\u665a\u62116:40\u8981\u4e0a\u8bfe\u201d\uff09\uff0c\u8868\u660e\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\uff0c\u7cbe\u529b\u5206\u6563\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u27a1\u4e2d**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a(\u4e2d)**\u3002\u7528\u6237\u80fd\u4e3b\u52a8\u5b8c\u6210\u4f5c\u4e1a\u5e76\u83b7\u5f97\u8001\u5e08\u6b63\u9762\u53cd\u9988\uff08\u201c\u975e\u5e38\u8363\u5e78\u80fd\u5f97\u5230\u5e08\u59d0\u548c\u8001\u5e08\u7684\u79f0\u8d5e\u201d\uff09\uff0c\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u5b66\u4e60\u97e7\u6027\u548c\u79ef\u6781\u6027\u3002\u4f46\u672a\u7ecf\u5386\u660e\u663e\u632b\u6298\uff0c\u5f39\u6027\u672a\u53d7\u8003\u9a8c\u3002\u5bf9\u9500\u552e\uff08\u5e08\u59d0\uff09\u7684\u6307\u5bfc\u8868\u73b0\u51fa\u4f9d\u8d56\u548c\u611f\u8c22\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u662f\u7684\uff0c\u6211\u542c\u4e86\u81ea\u5df1\u7684\uff0c\u611f\u89c9\u5f88\u5e73\u6de1\uff0c\u4e5f\u542c\u4e86\u7f51\u4e0a\u7684\uff0c\u73b0\u5728\u88ab\u5e08\u59d0\u8fd9\u4e48\u4e00\u6307\u5bfc\uff0c\u624d\u604d\u7136\u8fc7\u6765\uff0c\u611f\u8c22\u5e08\u59d0\u65e0\u79c1\u7684\u6307\u5bfc\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u81ea\u6211\u80fd\u529b\u7684\u4e0d\u786e\u5b9a\u4e0e\u5bfb\u6c42\u5916\u90e8\u8ba4\u53ef**\u3002\u7528\u6237\u591a\u6b21\u8868\u8fbe\u201c\u778e\u60f3\u7684\u201d\uff0c\u5e76\u5bf9\u81ea\u5df1\u7684\u4f5c\u4e1a\u8bc4\u4ef7\u201c\u5e73\u6de1\u201d\uff0c\u9700\u8981\u201c\u5e08\u59d0\u201d\u7684\u4e13\u4e1a\u6307\u5bfc\u548c\u80af\u5b9a\u6765\u5efa\u7acb\u4fe1\u5fc3\u3002\u5176\u63a2\u7d22\u591a\u4e2a\u5c97\u4f4d\u7684\u60f3\u6cd5\uff0c\u4e5f\u900f\u9732\u51fa\u5bf9\u884c\u4e1a\u8ba4\u77e5\u6a21\u7cca\uff0c\u9700\u8981\u88ab\u5f15\u9886\u548c\u5f52\u5c5e\u5230\u4e00\u4e2a\u201c\u5708\u5b50\u201d\uff08\u5982\u5f20\u9707\u8001\u5e08\u5267\u793e\uff09\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u6743\u5a01\u7684\u8ba4\u53ef\u4e0e\u201c\u88ab\u9009\u4e2d\u201d\u7684\u5f52\u5c5e\u611f**\u3002\u5982\u9500\u552e\u6240\u505a\uff0c\u901a\u8fc7\u201c\u5f20\u9707\u8001\u5e08\u5938\u4f60\u201d\u3001\u201c\u4f18\u79c0\u5b66\u5458\u201d\u3001\u201c\u5355\u72ec\u7ed9\u4f60\u7559\u540d\u989d\u201d\u7b49\u8bdd\u672f\uff0c\u6ee1\u8db3\u5176\u88ab\u770b\u89c1\u3001\u88ab\u80af\u5b9a\u7684\u5c0a\u91cd\u9700\u6c42\uff0c\u5e76\u6784\u5efa\u4e00\u4e2a\u201c\u6211\u4eec\u7684\u4eba\u201d\u7684\u793e\u7fa4\u5f52\u5c5e\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1** \u7c7b\uff08\u5174\u8da3\u9a71\u52a8\uff0c\u4f46\u8d44\u6e90\u5e95\u5ea7\u5b58\u5728\u77ed\u677f\uff0c\u9700\u89c2\u5bdf\uff09 |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T5 \u597d\u73a9\u5c1d\u9c9c\u578b**\uff08\u517c\u987e\u5174\u8da3\u63a2\u7d22\u4e0e\u53d8\u73b0\u53ef\u80fd\uff0c\u65f6\u95f4\u788e\u7247\u5316\uff0c\u5b66\u4e60\u76ee\u7684\u6027\u4e0d\u5f3a\u4f46\u6001\u5ea6\u79ef\u6781\uff09 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4fe1\u606f\u4e0d\u8db3** | \u672a\u77e5 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | **\u65f6\u95f4\u51b2\u7a81\u5bfc\u81f4\u8bfe\u7a0b\u79ef\u538b**\u3002\u73b0\u6709\u6d1e\u7bab\u3001\u6d41\u884c\u6b4c\u66f2\u7b49\u591a\u95e8\u8bfe\u7a0b\u5df2\u5360\u7528\u5176\u65f6\u95f4\uff0c\u82e5\u914d\u97f3\u8bfe\u7a0b\u4f5c\u4e1a\u91cf\u52a0\u5927\u6216\u76f4\u64ad\u9891\u7387\u589e\u52a0\uff0c\u6781\u6613\u56e0\u65e0\u6cd5\u8ddf\u4e0a\u8fdb\u5ea6\u800c\u4ea7\u751f\u7126\u8651\u3001\u81ea\u8d23\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u76ee\u524d\u8868\u73b0\u51fa\u79ef\u6781\u548c\u611f\u6069\u5fc3\u6001\uff0c\u6682\u65e0\u7834\u9632\u8ff9\u8c61\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u82e5\u5728\u77ed\u671f\u5185\uff08\u59821-2\u5468\uff09\u672a\u83b7\u5f97\u4efb\u4f55\u6b63\u5411\u53cd\u9988\uff08\u5982\u8bd5\u97f3\u901a\u8fc7\u3001\u5c0f\u989d\u6536\u76ca\uff09\uff0c\u5176\u6df7\u6742\u7684\u53d8\u73b0\u52a8\u673a\u53ef\u80fd\u53d7\u632b\uff0c\u4ea7\u751f\u201c\u5b66\u8fd9\u4e2a\u6ca1\u7528\u201d\u7684\u60f3\u6cd5\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-3\u5468**\u3002\u5f53\u591a\u95e8\u8bfe\u7a0b\u4f5c\u4e1a\u53e0\u52a0\u3001\u76f4\u64ad\u65e0\u6cd5\u5b9e\u65f6\u53c2\u4e0e\u9700\u770b\u56de\u653e\u65f6\uff0c\u5b66\u4e60\u538b\u529b\u8fbe\u5230\u5cf0\u503c\uff0c\u6613\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u5d29\u76d8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5e08\u59d0\u6ce8\u610f\u5230\u4f60\u8fd8\u5728\u5b66\u6d1e\u7bab\u548c\u5531\u6b4c\uff0c\u771f\u662f\u591a\u624d\u591a\u827a\uff01\u54b1\u4eec\u7684\u6709\u58f0\u8bfe\u4e0d\u8981\u6c42\u4f60\u2018\u8d76\u573a\u2019\uff0c\u6240\u6709\u76f4\u64ad\u90fd\u6709\u56de\u653e\uff0c\u4f5c\u4e1a\u4e5f\u53ef\u4ee5\u7075\u6d3b\u5b89\u6392\u65f6\u95f4\u4ea4\u3002\u4f60\u7684\u76ee\u6807\u662f\u2018\u6d4f\u89c8\u2019\u548c\u2018\u4f53\u9a8c\u2019\uff0c\u54b1\u4eec\u5c31\u6309\u8fd9\u4e2a\u8282\u594f\u6765\uff0c\u522b\u6709\u538b\u529b\u3002\u6709\u4efb\u4f55\u65f6\u95f4\u51b2\u7a81\uff0c\u968f\u65f6\u8ddf\u6211\u8bf4\uff0c\u6211\u7ed9\u4f60\u8c03\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5174\u8da3\u6e38\u4e50\u7ebf\u3011**\u3002\u964d\u4f4e\u786c\u6838\u6280\u80fd\u548c\u5373\u65f6\u53d8\u73b0\u538b\u529b\uff0c\u5f3a\u5316\u8da3\u5473\u6027\u3001\u6210\u5c31\u611f\u548c\u793e\u7fa4\u5f52\u5c5e\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u7075\u6d3b\u5b66\u4e60\u901a\u884c\u8bc1\u3011**\uff08\u6240\u6709\u76f4\u64ad\u81ea\u52a8\u751f\u6210\u56de\u653e+\u91cd\u70b9\u5207\u7247\uff09\uff1b\u9488\u5bf9\u5176\u5bfb\u6c42\u8ba4\u53ef\u7684\u9700\u6c42\uff0c\u8865\u5145 **\u3010\u8f7b\u91cf\u7ea7\u6210\u5c31\u6fc0\u52b1\u5305\u3011**\uff08\u5982\u201c\u58f0\u97f3\u63a2\u7d22\u5bb6\u201d\u5fbd\u7ae0\u3001\u4f5c\u4e1a\u82b1\u5f0f\u5938\u5938\u6a21\u677f\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a**\u7edd\u4e0d\u5bf9T5\u65bd\u52a0\u9ad8\u5f3a\u5ea6\u4f5c\u4e1a\u538b\u529b\u548c\u4e25\u683c\u7684\u51fa\u52e4\u8003\u6838**\uff1b**\u7edd\u4e0d\u7528\u201c\u522b\u4eba\u90fd\u884c\u4f60\u4e3a\u4ec0\u4e48\u4e0d\u884c\u201d\u8fdb\u884c\u5bf9\u6bd4\u65bd\u538b**\uff1b**\u907f\u514d\u5728\u521d\u671f\u8fc7\u5ea6\u5f3a\u8c03\u201c\u6708\u5165\u8fc7\u4e07\u201d\u7684\u53d8\u73b0\u6848\u4f8b\uff0c\u4ee5\u514d\u9020\u6210\u9884\u671f\u843d\u5dee**\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5f53\u524d\u9636\u6bb5\u5e94\u4ee5\u7ef4\u62a4\u5174\u8da3\u3001\u5efa\u7acb\u4fe1\u4efb\u4e3a\u4e3b\uff0c\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u53ef\u80fd\u5f15\u53d1\u5176\u56e0\u65f6\u95f4/\u91d1\u94b1\u538b\u529b\u800c\u4ea7\u751f\u7684\u53cd\u611f\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u4e5f\u60f3\u4ece\u5e95\u5c42\u505a\u8d77\uff0c\u628a\u6bcf\u4e2a\u5c97\u4f4d\u90fd\u6d4f\u89c8\u4e00\u904d\uff08\u778e\u60f3\u7684\uff0c\u6bd5\u7adf\u60f3\u505a\u7684\u4eba\u5f88\u591a\uff09\u201d\n2. > \u201c\u5e08\u59d0\uff0c\u665a\u4e0a7:30\u6211\u8981\u4e0a\u8bfe\u6d1e\u7bab\u65b0\u8bfe\uff0c\u6ca1\u6cd5\u542c\u5e08\u5085\u7684\u8bfe\uff0c\u80fd\u7ed9\u6211\u7559\u4e2a\u56de\u653e\u5417\uff1f\u201d\n3. > \u201c\u662f\u7684\uff0c\u6211\u542c\u4e86\u81ea\u5df1\u7684\uff0c\u611f\u89c9\u5f88\u5e73\u6de1\uff0c\u4e5f\u542c\u4e86\u7f51\u4e0a\u7684\uff0c\u73b0\u5728\u88ab\u5e08\u59d0\u8fd9\u4e48\u4e00\u6307\u5bfc\uff0c\u624d\u604d\u7136\u8fc7\u6765\uff0c\u611f\u8c22\u5e08\u59d0\u65e0\u79c1\u7684\u6307\u5bfc\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T5\u597d\u73a9\u5c1d\u9c9c\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u88ab\u4e13\u4e1a\u5708\u5b50\u8ba4\u53ef\u548c\u63a5\u7eb3\u7684\u5f52\u5c5e\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u5ea6\u7075\u6d3b\u7684\u5b66\u4e60\u8def\u5f84\u548c\u6301\u7eed\u7684\u6b63\u5411\u60c5\u7eea\u53cd\u9988\uff0c\u7edd\u4e0d\u65bd\u52a0\u8fdb\u5ea6\u538b\u529b\u3011**\u3002\n\n```json\n{\"core_type\": \"T5 \u597d\u73a9\u5c1d\u9c9c\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u793e\u4ea4/\u5c0a\u91cd\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf\"}\n```";
