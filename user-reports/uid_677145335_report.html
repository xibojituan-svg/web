    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## \u4e00\u3001 \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d)**: \u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b\uff08\u6309\u65f6\u542c\u8bfe\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u4e3b\u52a8\u7ec3\u4e60\uff09\uff0c\u5bf9\u6709\u58f0\u884c\u4e1a\u6709\u63a2\u7d22\u5174\u8da3\u3002\u4f46**\u53d8\u73b0\u52a8\u673a**\u4e0e**\u5174\u8da3\u52a8\u673a**\u6df7\u5408\uff0c\u9500\u552e\u8bdd\u672f\uff08\u201c\u5feb\u901f\u6323\u5230\u7b2c\u4e00\u6876\u91d1\u201d\u3001\u201c\u63a5\u5355\u8d44\u6e90\u201d\uff09\u5bf9\u51b3\u7b56\u6709\u663e\u8457\u5f15\u5bfc\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4f4e)**: \u4fe1\u606f\u4e0d\u8db3\u3002\u672a\u63d0\u53ca\u804c\u4e1a\u3001\u6536\u5165\u3001\u5bb6\u5ead\u72b6\u51b5\u3001\u53ef\u7528\u5b66\u4e60\u65f6\u95f4\u7b49\u5173\u952e\u8d44\u6e90\u4fe1\u606f\u3002\u7528\u6237\u8be2\u95ee\u201c\u6ca1\u90ae\u7bb1\u600e\u4e48\u53d1\u201d\uff0c\u53ef\u80fd\u6697\u793a\u6570\u5b57\u5de5\u5177\u4f7f\u7528\u719f\u7ec3\u5ea6\u4e00\u822c\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u9ad8)**: \u5b66\u4e60\u6001\u5ea6\u79ef\u6781\uff0c\u80fd\u63a5\u53d7\u53cd\u9988\uff08\u201c\u6211\u4f1a\u53cd\u590d\u8bfb\u4e00\u8bfb\u627e\u627e\u611f\u89c9\u201d\uff09\uff0c\u4e92\u52a8\u914d\u5408\u5ea6\u9ad8\u3002\u9762\u5bf9\u9500\u552e\u5bc6\u96c6\u7684\u8282\u594f\u548c\u50ac\u4fc3\uff08\u5982\u8865\u8bfe\u3001\u4ea4\u4f5c\u4e1a\uff09\uff0c\u672a\u8868\u73b0\u51fa\u660e\u663e\u6297\u62d2\u6216\u538b\u529b\uff0c\u670d\u4ece\u6027\u8f83\u597d\u3002\n\n## \u4e8c\u3001 ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: \u5df2\u652f\u4ed82380\u5143\uff0c\u652f\u4ed8\u5b8c\u6210\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: \u4fe1\u606f\u4e0d\u8db3\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u6216\u4ed6\u4eba\u610f\u89c1\uff0c\u7528\u6237\u8868\u73b0\u4e3a\u72ec\u7acb\u51b3\u7b56\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u4e0e\u8d44\u6e90\u521d\u6b65\u5224\u65ad**: \u52a8\u673a\u660e\u786e\uff08\u5b66\u4e60+\u53d8\u73b0\uff09\uff0c\u884c\u52a8\u914d\u5408\uff0c\u4f46\u8d44\u6e90\u5e95\u5ea7\u4fe1\u606f\u7f3a\u5931\uff0c\u65e0\u6cd5\u5224\u65ad\u5176\u4e0e\u8bfe\u7a0b\u6295\u5165\uff08\u65f6\u95f4\u3001\u7cbe\u529b\u3001\u91d1\u94b1\uff09\u7684\u5339\u914d\u5ea6\u3002\n*   **\u6b65\u9aa42 - \u627f\u8bfa\u4e0e\u884c\u52a8\u4e00\u81f4\u6027**: \u4e00\u81f4\u6027**\u9ad8**\u3002\u7528\u6237\u5168\u7a0b\u8ddf\u8fdb\u9500\u552e\u8282\u594f\uff1a\u6309\u65f6\u542c\u8bfe\uff08\u201c\u660e\u5929\u4e2d\u5348\u542c\u8bfe\u201d\uff09\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u6d3b\u52a8\uff08Pia\u620f\uff09\u3001\u63a5\u53d7\u70b9\u8bc4\u5e76\u7ec3\u4e60\u3001\u6700\u7ec8\u5b8c\u6210\u652f\u4ed8\u3002\n*   **\u6b65\u9aa43 - \u51b3\u7b56\u7406\u6027\u4e0e\u98ce\u9669\u8ba4\u77e5**: \u7406\u6027\u7a0b\u5ea6**\u4e2d\u4f4e**\u3002\u7528\u6237\u51b3\u7b56\u53d7\u9500\u552e\u5f3a\u5f15\u5bfc\uff08\u9650\u65f6\u3001\u540d\u989d\u3001\u8d44\u6e90\u627f\u8bfa\uff09\uff0c\u5bf9\u884c\u4e1a\u96be\u5ea6\u3001\u6295\u5165\u8981\u6c42\u3001\u53d8\u73b0\u5468\u671f\u7b49**\u7f3a\u4e4f\u6df1\u5ea6\u8ffd\u95ee\u548c\u98ce\u9669\u8003\u91cf**\u3002\u5bf9\u201c\u7248\u6743\u4e66\u201d\u3001\u201c\u5165\u9a7b\u5e73\u53f0\u201d\u7b49\u627f\u8bfa\u8868\u73b0\u51fa\u4fe1\u4efb\u548c\u671f\u5f85\u3002\n*   **\u6b65\u9aa44 - \u5f52\u5c5e\u4e0e\u4ef7\u503c\u8ba4\u540c**: \u4ef7\u503c\u8ba4\u540c**\u521d\u6b65\u5efa\u7acb**\u3002\u7528\u6237\u611f\u8c22\u9500\u552e\u6307\u5bfc\uff08\u201c\u5411\u4f60\u5b66\u4e60\u201d\uff09\uff0c\u5bf9\u8bfe\u7a0b\u5185\u5bb9\uff08\u201c\u5e72\u8d27\u201d\uff09\u548c\u81ea\u8eab\u8fdb\u6b65\uff08\u201c\u6536\u83b7\u6ee1\u6ee1\u201d\uff09\u6709\u6b63\u9762\u53cd\u9988\uff0c\u4e0e\u9500\u552e\u5efa\u7acb\u4e86\u521d\u6b65\u7684\u201c\u5e08\u5f92\u201d\u4fe1\u4efb\u5173\u7cfb\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**: **B\u7c7b\uff08\u9ad8\u610f\u613f-\u4e2d\u98ce\u9669\uff09\u7528\u6237**\u3002\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b\u5f3a\uff0c\u4f46\u51b3\u7b56\u53d7\u5916\u90e8\u6fc0\u52b1\u9a71\u52a8\u660e\u663e\uff0c\u5bf9\u957f\u671f\u5b66\u4e60\u7684\u771f\u5b9e\u6210\u672c\u548c\u6311\u6218\u8ba4\u77e5\u53ef\u80fd\u4e0d\u8db3\uff0c\u5b58\u5728\u540e\u7eed\u56e0\u73b0\u5b9e\u843d\u5dee\u800c\u4ea7\u751f\u98ce\u9669\u7684\u53ef\u80fd\u3002\n\n## \u4e09\u3001 \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b: T4 \u52a1\u5b9e\u63a2\u7d22\u8005**\n    *   **\u7279\u5f81**: \u6709\u660e\u786e\u76ee\u6807\uff08\u5b66\u4e60\u6280\u80fd\u3001\u517c\u804c\uff09\uff0c\u884c\u52a8\u529b\u5f3a\uff0c\u613f\u610f\u6295\u5165\u5e76\u9075\u5faa\u6307\u5bfc\u3002\u5bf9\u884c\u4e1a\u6709\u7f8e\u597d\u61a7\u61ac\uff0c\u6613\u88ab\u201c\u8def\u5f84\u6e05\u6670\u201d\u3001\u201c\u8d44\u6e90\u6276\u6301\u201d\u7684\u627f\u8bfa\u5438\u5f15\u3002\n    *   **\u4f9d\u636e**: \u7528\u6237\u884c\u4e3a\u9ad8\u5ea6\u7b26\u5408\u201c\u63a2\u7d22-\u6267\u884c\u201d\u6a21\u5f0f\uff1a\u79ef\u6781\u5b8c\u6210\u5404\u9879\u5b66\u4e60\u4efb\u52a1\uff0c\u5bf9\u9500\u552e\u63d0\u4f9b\u7684\u201c\u53d8\u73b0\u6e20\u9053\u201d\u3001\u201c\u7248\u6743\u4e66\u201d\u3001\u201c\u5165\u9a7b\u5e73\u53f0\u201d\u7b49\u5177\u4f53\u8def\u5f84\u8868\u73b0\u51fa\u5174\u8da3\u548c\u8ddf\u968f\u3002\n\n## \u56db\u3001 \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u6574\u4f53\u98ce\u9669\u7b49\u7ea7: \u4e2d**\n*   **\u9010\u9879\u6392\u67e5**:\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**: **\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u201c\u5feb\u901f\u53d8\u73b0\u201d\u6709\u671f\u5f85\uff0c\u82e5\u6b63\u5f0f\u8bfe\u7a0b\u540e\u63a5\u5355\u56f0\u96be\u6216\u6536\u5165\u4e0e\u5ba3\u4f20\u4e0d\u7b26\uff0c\u6613\u4ea7\u751f\u843d\u5dee\u3002\n    2.  **\u65f6\u95f4\u7cbe\u529b\u4e0d\u8db3**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u900f\u9732\u4e2a\u4eba\u65f6\u95f4\u5b89\u6392\uff0c\u9700\u540e\u7eed\u89c2\u5bdf\u3002\n    3.  **\u7ecf\u6d4e\u538b\u529b**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u652f\u4ed8\u91d1\u989d2380\u5143\uff0c\u672a\u8868\u73b0\u51fa\u538b\u529b\uff0c\u4f46\u5bb6\u5ead\u8d22\u52a1\u60c5\u51b5\u672a\u77e5\u3002\n    4.  **\u8bfe\u7a0b\u8d28\u91cf\u5f02\u8bae**: **\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u548c\u6559\u5e08\u53cd\u9988\u6b63\u9762\u3002\n    5.  **\u9500\u552e\u627f\u8bfa\u672a\u5151\u73b0**: **\u9ad8\u98ce\u9669**\u3002**\u9500\u552e\u591a\u6b21\u627f\u8bfa\u201c\u7248\u6743\u4e66\u201d\u3001\u201c\u5165\u9a7b\u5e73\u53f0\u201d\u3001\u201c\u63a5\u5355\u8d44\u6e90\u201d\u3001\u201c\u5de5\u4f5c\u5ba4\u8d44\u6e90\u201d\u7b49\u3002\u82e5\u540e\u7eed\u73ed\u4e3b\u4efb\u6216\u8bfe\u7a0b\u4f53\u7cfb\u65e0\u6cd5\u5151\u73b0\u8fd9\u4e9b\u5177\u4f53\u8d44\u6e90\uff0c\u6781\u6613\u5f15\u53d1\u6295\u8bc9\u3002**\n    6.  **\u5bb6\u5ead\u53cd\u5bf9**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\n    7.  **\u7ade\u54c1\u5bf9\u6bd4/\u51b2\u52a8\u540e\u6094**: **\u4e2d\u98ce\u9669**\u3002\u51b3\u7b56\u8fc7\u7a0b\u53d7\u9650\u65f6\u3001\u7a00\u7f3a\u6027\uff08\u201c\u6700\u540e\u4e00\u5929\u201d\u3001\u201c\u540d\u989d\u5df2\u5360\u201d\uff09\u5f71\u54cd\uff0c\u5b58\u5728\u51b2\u52a8\u6d88\u8d39\u53ef\u80fd\uff0c\u51b7\u9759\u671f\u540e\u6216\u5bf9\u6bd4\u5176\u4ed6\u4ea7\u54c1\u53ef\u80fd\u4ea7\u751f\u6094\u610f\u3002\n\n## \u4e94\u3001 \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u4e3b\u8981\u96f7\u533a**:\n    *   **\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u8bf1\u5bfc**: **\u9500\u552e\u5b58\u5728\u660e\u663e\u8fc7\u5ea6\u627f\u8bfa**\uff0c\u5982\u201c\u5feb\u901f\u6323\u5230\u7b2c\u4e00\u6876\u91d1\u201d\u3001\u201c\u5e26\u4f60\u5165\u884c\u201d\u3001\u201c\u8ba9\u4f60\u58f0\u97f3\u5347\u503c\u201d\u3001\u201c\u5b89\u6392\u5341\u51e0\u672c\u65b0\u624b\u4e66\u201d\u3001\u201c\u7248\u6743\u4e66\u8d60\u9001\u201d\u7b49\uff0c\u5c06\u5b66\u4e60\u7ed3\u679c\u4e0e\u786e\u5b9a\u6027\u7684\u7ecf\u6d4e\u56de\u62a5\u548c\u8d44\u6e90\u83b7\u53d6\u5f3a\u5173\u8054\uff0c**\u53ef\u80fd\u6784\u6210\u865a\u5047\u6216\u8bef\u5bfc\u6027\u5ba3\u4f20**\u3002\n    *   **\u5236\u9020\u7a00\u7f3a\u4e0e\u7d27\u8feb\u611f**: \u9891\u7e41\u4f7f\u7528\u201c\u6700\u540e\u4e00\u5929\u201d\u3001\u201c\u6700\u7ec8\u5ba1\u6838\u201d\u3001\u201c\u540d\u989d\u5df2\u5360\u201d\u7b49\u8bdd\u672f\uff0c\u8425\u9020\u7d27\u8feb\u6c1b\u56f4\uff0c\u53ef\u80fd\u5f71\u54cd\u7528\u6237\u7406\u6027\u51b3\u7b56\u3002\n    *   **\u201c\u5e08\u5f92\u201d\u5173\u7cfb\u6346\u7ed1**: \u9500\u552e\u4ee5\u201c\u5e08\u59d0\u201d\u3001\u201c\u5a18\u5bb6\u4eba\u201d\u81ea\u79f0\uff0c\u5efa\u7acb\u60c5\u611f\u7ebd\u5e26\uff0c\u53ef\u80fd\u4f7f\u7528\u6237\u5728\u9047\u5230\u95ee\u9898\u65f6\u56e0\u60c5\u611f\u56e0\u7d20\u96be\u4ee5\u7406\u6027\u7ef4\u6743\u3002\n*   **\u5408\u89c4\u6027**: **\u5b58\u5728\u91cd\u5927\u5408\u89c4\u9690\u60a3**\uff0c\u9500\u552e\u8bdd\u672f\u6e38\u8d70\u5728\u8fdd\u89c4\u8fb9\u7f18\uff0c**\u4e3b\u8981\u98ce\u9669\u96c6\u4e2d\u5728\u201c\u627f\u8bfa\u5151\u73b0\u201d\u73af\u8282**\u3002\n\n## \u516d\u3001 \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6: \u504f\u5dee**\n    *   \u7528\u6237\u671f\u5f85\u7684\u662f\u201c**\u8d44\u6e90\u5bfc\u5411\u3001\u5feb\u901f\u53d8\u73b0**\u201d\u7684\u8def\u5f84\uff0c\u4f46\u7cfb\u7edf\u8bfe\u7a0b likely \u662f\u201c**\u80fd\u529b\u5bfc\u5411\u3001\u957f\u671f\u57f9\u517b**\u201d\u7684\u4f53\u7cfb\uff0c\u5b58\u5728\u671f\u671b\u503c\u7ba1\u7406\u7f3a\u53e3\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **\u9996\u5468\u91cd\u70b9\u6821\u6b63\u53d8\u73b0\u9884\u671f\u4e0e\u6f84\u6e05\u8d44\u6e90\u89c4\u5219**\n*   **\u5177\u4f53\u884c\u52a8\u5efa\u8bae**:\n    1.  **\u9884\u671f\u7ba1\u7406\uff08\u5173\u952e\uff09**: \u5165\u5b66\u9996\u5468\u5185\uff0c\u5fc5\u987b\u4e00\u5bf9\u4e00\u6c9f\u901a\uff0c**\u6e05\u6670\u754c\u5b9a\u8bfe\u7a0b\u80fd\u63d0\u4f9b\u7684\u201c\u6559\u5b66\u670d\u52a1\u201d\u3001\u201c\u7ec3\u4e60\u6307\u5bfc\u201d\u4e0e\u9500\u552e\u627f\u8bfa\u7684\u201c\u884c\u4e1a\u8d44\u6e90\u201d\u3001\u201c\u63a5\u5355\u4fdd\u969c\u201d\u4e4b\u95f4\u7684\u533a\u522b**\u3002\u660e\u786e\u5e73\u53f0\u8d44\u6e90\u7684\u4f7f\u7528\u89c4\u5219\u3001\u7248\u6743\u4e66\u7684\u83b7\u53d6\u6761\u4ef6\u548c\u9650\u5236\u3001\u63a5\u5355\u7684\u7ade\u4e89\u6027\u4e0e\u80fd\u529b\u8981\u6c42\u3002\n    2.  **\u5efa\u7acb\u7406\u6027\u8ba4\u77e5**: \u5f15\u5bfc\u7528\u6237\u5173\u6ce8\u6280\u80fd\u6210\u957f\u66f2\u7ebf\uff0c\u800c\u975e\u77ed\u671f\u53d8\u73b0\u3002\u5206\u4eab\u884c\u4e1a\u771f\u5b9e\u6848\u4f8b\uff08\u5305\u62ec\u6210\u529f\u4e0e\u6311\u6218\uff09\uff0c\u5e2e\u52a9\u5efa\u7acb\u5bf9\u6709\u58f0\u884c\u4e1a\u957f\u671f\u6027\u7684\u5408\u7406\u8ba4\u77e5\u3002\n    3.  **\u5f3a\u5316\u652f\u6301\u4e0e\u8ddf\u8fdb**: \u9274\u4e8e\u7528\u6237\u914d\u5408\u5ea6\u9ad8\uff0c\u5e94\u7ed9\u4e88\u79ef\u6781\u7684\u5b66\u4e60\u53cd\u9988\uff0c\u5de9\u56fa\u5176\u5b66\u4e60\u52a8\u673a\u3002\u5bc6\u5207\u5173\u6ce8\u5176\u4f5c\u4e1a\u5b8c\u6210\u60c5\u51b5\u548c\u8bfe\u5802\u53c2\u4e0e\u5ea6\uff0c\u53ca\u65f6\u63d0\u4f9b\u5e2e\u52a9\u3002\n    4.  **\u98ce\u9669\u9884\u8b66**: \u8bb0\u5f55\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa\u7684\u5177\u4f53\u5185\u5bb9\uff0c\u505a\u597d\u9884\u6848\u3002\u82e5\u7528\u6237\u540e\u7eed\u5c31\u201c\u8d44\u6e90\u672a\u5151\u73b0\u201d\u63d0\u51fa\u8d28\u7591\uff0c\u9700\u6709\u5b98\u65b9\u89e3\u91ca\u53e3\u5f84\u548c\u66ff\u4ee3\u65b9\u6848\uff08\u5982\u66f4\u591a\u7ec3\u4e60\u673a\u4f1a\u3001\u5185\u90e8\u8bd5\u97f3\u901a\u9053\u7b49\uff09\u3002\n    5.  **\u60c5\u611f\u8854\u63a5**: \u5e73\u7a33\u627f\u63a5\u9500\u552e\u5efa\u7acb\u7684\u201c\u5e08\u5f92\u201d\u5173\u7cfb\uff0c\u8f6c\u5316\u4e3a\u201c\u6559\u7ec3-\u5b66\u5458\u201d\u5f0f\u7684\u4e13\u4e1a\u652f\u6301\u5173\u7cfb\uff0c\u907f\u514d\u5173\u7cfb\u65ad\u5d16\u5bfc\u81f4\u7528\u6237\u5931\u843d\u3002\n\n{\"core_type\": \"T4 \u52a1\u5b9e\u63a2\u7d22\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u9996\u5468\u6821\u6b63\u53d8\u73b0\u9884\u671f\u4e0e\u8d44\u6e90\u89c4\u5219\"}";
