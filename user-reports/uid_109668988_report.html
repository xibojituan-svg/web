        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 109668988 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5b50\u6e05\u82d2(\u8c22\u6167) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u7cbe\u82f1\u73ed\u6b63\u4ef7\u8bfe (\u5df2\u652f\u4ed8) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3** (\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u65e0\u6cd5\u5224\u65ad) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u7528\u6237\u63d0\u53ca\u201c\u5b69\u5b50\u7761\u89c9\u4e86\uff0c\u4eca\u5929\u4e0d\u80fd\u5f55\u4e86\u201d\uff0c\u8868\u660e\u65f6\u95f4\u53d7\u5bb6\u5ead\u4e8b\u52a1\u5207\u5272) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3** (\u672a\u63d0\u53ca\u5bb6\u5ead\u6210\u5458\u6001\u5ea6) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** (\u7f3a\u5931\u5173\u952e\u4fe1\u606f\uff1a\u652f\u4ed8\u80fd\u529b/\u65b9\u5f0f\u3001\u5bb6\u5ead\u652f\u6301\u5ea6\u3001\u5177\u4f53\u804c\u4e1a/\u6536\u5165\u72b6\u51b5\u3001\u5b66\u4e60\u73af\u5883) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u5bf9\u53d8\u73b0\u8def\u5f84\uff08\u5ba1\u542c\u3001\u540e\u671f\uff09\u8868\u73b0\u51fa\u5174\u8da3\uff0c\u4f46\u8d2d\u4e70\u51b3\u7b56\u65f6\u660e\u786e\u8868\u793a\u201c\u4ef7\u4f4d\u592a\u9ad8\uff0c\u4e70\u4e0d\u8d77\u201d\uff0c\u6700\u7ec8\u9009\u62e9\u4e86\u8f83\u4f4e\u4ef7\u4f4d\u7684\u201c\u7cbe\u82f1\u73ed\u201d\uff0c\u8868\u660e\u5176\u6709\u53d8\u73b0\u610f\u613f\uff0c\u4f46\u6295\u5165\u51b3\u5fc3\u548c\u9884\u7b97\u6709\u9650\uff0c\u5904\u4e8e\u201c\u8bd5\u8bd5\u770b\u201d\u7684\u89c2\u671b\u72b6\u6001\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4ef7\u4f4d\u592a\u9ad8\uff0c\u4e70\u4e0d\u8d77[\u6d41\u6cea]\u201d > \u201c\u90a3\u6211\u8981\u662f\u62a5\u7cbe\u82f1\u8fd8\u80fd\u63a5\u8fd9\u4e9b\u6d3b\u5417\uff1f\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u660e\u786e\u8868\u793a\u201c\u4ef7\u4f4d\u592a\u9ad8\uff0c\u4e70\u4e0d\u8d77\u201d\uff0c\u5bf9\u4ef7\u683c\u654f\u611f\uff0c\u8d44\u91d1\u627f\u8f7d\u529b\u6709\u9650\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e** \u2014 \u65f6\u95f4\u53d7\u5bb6\u5ead\uff08\u5b69\u5b50\uff09\u7275\u5236\uff0c\u5448\u73b0\u788e\u7247\u5316\u7279\u5f81\uff0c\u4e14\u624b\u90e8\u53d7\u4f24\uff08\u201c\u624b\u53d7\u4f24\u4e86\u201d\uff09\u53ef\u80fd\u5f71\u54cd\u64cd\u4f5c\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\uff0c\u4f46\u9700\u8b66\u60d5\u56e0\u65f6\u95f4\u788e\u7247\u5316\u53ef\u80fd\u5f15\u53d1\u7684\u5bb6\u5ead\u77db\u76fe\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u9700\u95f4\u6b47\u6027\u5b89\u629a\u3002\u7528\u6237\u80fd\u4e3b\u52a8\u627f\u8ba4\u56f0\u96be\uff08\u201c\u914d\u97f3\u65f6\u6709\u70b9\u78d5\u7eca\u201d\uff09\uff0c\u5e76\u8868\u8fbe\u611f\u8c22\u548c\u575a\u6301\u610f\u613f\uff0c\u6001\u5ea6\u79ef\u6781\u3002\u4f46\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u5ba1\u542c\u7528\u7535\u8111/\u624b\u673a\uff09\u4f1a\u4e3b\u52a8\u8be2\u95ee\uff0c\u5bf9\u9500\u552e\uff08\u5e08\u59d0\uff09\u6709\u8f83\u5f3a\u7684\u4f9d\u8d56\u548c\u4fe1\u4efb\uff0c\u9700\u8981\u6301\u7eed\u7684\u6b63\u5411\u53cd\u9988\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5e08\u59d0\uff0c\u6211\u4e0d\u592a\u4f1a\u5f55\uff0c\u4f60\u5e2e\u6211\u770b\u770b\u597d\u5417\u201d > \u201c\u5e08\u59d0\uff0c\u6211\u80fd\u8fdb\u54b1\u4eec\u7c7d\u83f2\u56e2\u961f\u5417\uff1f\u9ebb\u70e6\u5e08\u59d0\u628a\u6211\u62c9\u8fdb\u53bb[\u5408\u5341]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 / \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u7f3a\u4e4f\u793e\u4f1a\u8fde\u63a5\u4e0e\u4ef7\u503c\u8ba4\u540c**\u3002\u7528\u6237\u53cd\u590d\u8868\u8fbe\u60f3\u201c\u8fdb\u56e2\u961f\u201d\uff0c\u5bf9\u201c\u5e08\u59d0\u201d\u7684\u6307\u5bfc\u548c\u8ba4\u53ef\u6781\u5ea6\u6e34\u671b\uff0c\u663e\u793a\u51fa\u5728\u5bb6\u5ead\u6216\u539f\u6709\u793e\u4ea4\u5708\u4e2d\u53ef\u80fd\u7f3a\u4e4f\u6210\u5c31\u611f\u4e0e\u5f52\u5c5e\u611f\u3002\u540c\u65f6\uff0c\u5bf9\u201c\u4ef7\u4f4d\u592a\u9ad8\u201d\u7684\u654f\u611f\u4e5f\u66b4\u9732\u4e86\u5bf9\u672a\u6765\u7ecf\u6d4e\u5b89\u5168\u7684\u6f5c\u5728\u7126\u8651\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u56e2\u961f\u9700\u8981\u201d\u7684\u5f52\u5c5e\u611f\u4e0e\u201c\u88ab\u5e08\u59d0\u770b\u597d\u201d\u7684\u6210\u957f\u966a\u4f34**\u3002\u4ed6\u9700\u8981\u7684\u4e0d\u53ea\u662f\u6280\u80fd\uff0c\u66f4\u662f\u4e00\u4e2a\u80fd\u63a5\u7eb3\u4ed6\u3001\u8ba4\u53ef\u4ed6\u3001\u5e26\u9886\u4ed6\u7684\u201c\u7ec4\u7ec7\u201d\u548c\u201c\u5bfc\u5e08\u201d\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1** \u7c7b (\u52a8\u673a\u4e2d\u7b49\uff0c\u8d44\u6e90\u5e95\u5ea7\u8584\u5f31\uff0c\u4f9d\u8d56\u6027\u5f3a\uff0c\u4f46\u914d\u5408\u5ea6\u9ad8) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u6838\u5fc3\u7279\u5f81\uff1a**\u9ad8\u60c5\u611f\u4f9d\u8d56\u3001\u4f4e\u6297\u98ce\u9669\u80fd\u529b\u3001\u6e34\u671b\u88ab\u5e26\u9886\u548c\u8ba4\u53ef**\uff0c\u7b26\u5408\u5176\u53cd\u590d\u5bfb\u6c42\u786e\u8ba4\u3001\u6e34\u671b\u52a0\u5165\u56e2\u961f\u3001\u5bf9\u201c\u5e08\u59d0\u201d\u9ad8\u5ea6\u4fe1\u4efb\u7684\u884c\u4e3a\u6a21\u5f0f) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u501f\u8d37\u3001\u7edd\u5883\u7b49\u6781\u7aef\u60c5\u51b5\u8bc1\u636e\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u56e0\u6295\u5165\u65f6\u95f4\u5b66\u4e60\uff08\u5c24\u5176\u5b69\u5b50\u7761\u89c9\u540e\uff09\u6216\u5c0f\u989d\u652f\u51fa\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u5bb6\u5ead\u4e8b\u52a1\uff08\u5e26\u5b69\u5b50\uff09\u6216\u624b\u90e8\u53d7\u4f24\u7b49\u7a81\u53d1\u72b6\u51b5\u5bfc\u81f4\u65e0\u6cd5\u8ddf\u4e0a\u8bfe\u7a0b\u8282\u594f\uff0c\u4ea7\u751f\u201c\u6211\u505a\u4e0d\u5230\u201d\u7684\u632b\u8d25\u611f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4e2d** | \u5b66\u4e60\u9047\u5230\u6280\u672f\u96be\u9898\uff08\u5982\u8f6f\u4ef6\u64cd\u4f5c\u3001\u5ba1\u542c\u6d41\u7a0b\uff09\u65e0\u4eba\u53ca\u65f6\u54cd\u5e94\uff0c\u6216\u8bd5\u97f3\u591a\u6b21\u5931\u8d25\u540e\u81ea\u5c0a\u5fc3\u53d7\u632b\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u53d1\u73b0\u201c\u7cbe\u82f1\u73ed\u201d\u65e0\u6cd5\u76f4\u63a5\u63a5\u5230\u5fc3\u4eea\u7684\u201c\u5ba1\u542c\u3001\u540e\u671f\u201d\u5355\u5b50\uff0c\u6216\u63a5\u5355\u6536\u5165\u8fdc\u4f4e\u4e8e\u9884\u671f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-3\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u8bfe\u7a0b\u96be\u5ea6\u548c\u4f5c\u4e1a\u91cf\u589e\u52a0\uff0c\u82e5\u540c\u65f6\u906d\u9047\u5bb6\u5ead\u65f6\u95f4\u51b2\u7a81\u6216\u9996\u6b21\u8bd5\u97f3\u5931\u8d25\uff0c\u6781\u6613\u4ea7\u751f\u653e\u5f03\u5ff5\u5934\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u963f\u6c34\u540c\u5b66\uff0c\u770b\u5230\u4f60\u5bf9\u624b\u53d7\u4f24\u4e86\u8fd8\u575a\u6301\u5b66\u4e60\uff0c\u5e08\u59d0\u771f\u7684\u7279\u522b\u611f\u52a8\u3002\u54b1\u4eec\u8fd9\u4e2a\u73ed\u5c31\u50cf\u4e00\u4e2a\u5927\u5bb6\u5ead\uff0c\u4f60\u4e0d\u7528\u62c5\u5fc3\u81ea\u5df1\u662f\u4e2a\u2018\u5c0f\u767d\u2019\uff0c\u66f4\u4e0d\u7528\u6015\u2018\u78d5\u7eca\u2019\uff0c\u56e0\u4e3a\u6bcf\u4e00\u6b65\u90fd\u4f1a\u6709\u5e08\u59d0\u548c\u540c\u5b66\u4eec\u966a\u7740\u4f60\u3002\u4f60\u95ee\u7684\u5ba1\u542c\u548c\u540e\u671f\uff0c\u54b1\u4eec\u5148\u4ece\u57fa\u7840\u6f14\u64ad\u7ec3\u8d77\uff0c\u628a\u6839\u624e\u7a33\uff0c\u5e08\u59d0\u7b54\u5e94\u4f60\uff0c\u53ea\u8981\u6709\u5408\u9002\u7684\u8d44\u6e90\uff0c\u7b2c\u4e00\u65f6\u95f4\u5e26\u4f60\u63a5\u89e6\u3002\u4f60\u4e0d\u662f\u4e00\u4e2a\u4eba\u5728\u5b66\u4e60\uff0c\u54b1\u4eec\u2018\u7c7d\u83f2\u56e2\u961f\u2019\u5c31\u662f\u4f60\u6700\u575a\u5b9e\u7684\u540e\u76fe\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5174\u8da3\u6e38\u4e50\u7ebf**\u3011\u3002\u9274\u4e8e\u5176\u8d44\u91d1\u548c\u65f6\u95f4\u6709\u9650\uff0c\u9996\u8981\u76ee\u6807\u662f\u7ef4\u6301\u5176\u5b66\u4e60\u5174\u8da3\u548c\u793e\u7fa4\u5f52\u5c5e\u611f\uff0c\u907f\u514d\u7528\u9ad8\u96be\u5ea6\u3001\u5feb\u53d8\u73b0\u65bd\u538b\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T6\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a\u3010**\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305**\u3011\u3002\u5305\u62ec\uff1a1\uff09**\u9ad8\u9891\u8f7b\u91cf\u7ea7\u6b63\u53cd\u9988**\uff1a\u4f5c\u4e1a\u70b9\u8bc4\u4ee5\u9f13\u52b1\u4e3a\u4e3b\uff0c\u591a\u4f7f\u7528\u201c\u88ab\u56e2\u961f\u9700\u8981\u201d\u7684\u8bdd\u672f\uff08\u5982\u201c\u4f60\u7684\u58f0\u97f3\u5f88\u9002\u5408\u6211\u4eec\u56e2\u961f\u98ce\u683c\u201d\uff09\u30022\uff09**\u6280\u672f\u515c\u5e95\u670d\u52a1**\uff1a\u63d0\u4f9b\u66f4\u8be6\u7ec6\u7684\u624b\u673a\u64cd\u4f5c\u6307\u5357\u3001\u7b80\u5316\u7248\u4efb\u52a1\uff0c\u964d\u4f4e\u5176\u64cd\u4f5c\u754f\u96be\u60c5\u7eea\u30023\uff09**\u793e\u7fa4\u7834\u51b0\u6d3b\u52a8**\uff1a\u9f13\u52b1\u5176\u5728\u7fa4\u5185\u4e92\u52a8\uff0c\u8d4b\u4e88\u5176\u201c\u5c0f\u7ec4\u957f\u201d\u7b49\u865a\u62df\u8eab\u4efd\uff0c\u589e\u5f3a\u5f52\u5c5e\u611f\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1\uff09\u7edd\u4e0d\u5bf9\u5176\u65bd\u52a0\u8fc7\u5927\u7684\u4f5c\u4e1a\u538b\u529b\u548c\u53d8\u73b0KPI\u30022\uff09\u7edd\u4e0d\u5728\u5176\u8868\u8fbe\u56f0\u96be\u65f6\u53ea\u7ed9\u6807\u51c6\u7b54\u6848\uff0c\u5fc5\u987b\u9644\u52a0\u60c5\u611f\u652f\u6301\u30023\uff09\u7edd\u4e0d\u5ffd\u89c6\u5176\u201c\u60f3\u8fdb\u56e2\u961f\u201d\u7684\u8bf7\u6c42\uff0c\u5373\u4f7f\u6682\u65f6\u65e0\u6cd5\u5b9e\u73b0\uff0c\u4e5f\u8981\u7ed9\u4e88\u201c\u672a\u6765\u53ef\u671f\u201d\u7684\u613f\u666f\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5f53\u524d\u9636\u6bb5\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u53ef\u80fd\u89e6\u53d1\u5176\u8d44\u91d1\u654f\u611f\u795e\u7ecf\uff0c\u5e76\u52a0\u5267\u5176\u201c\u65e0\u6cd5\u5b8c\u6210\u201d\u7684\u7126\u8651\uff0c\u5bfc\u81f4\u5d29\u76d8\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u4ef7\u4f4d\u592a\u9ad8\uff0c\u4e70\u4e0d\u8d77[\u6d41\u6cea]\u201d **(\u8d44\u6e90\u5e95\u5ea7\u8584\u5f31\u7684\u6838\u5fc3\u8bc1\u636e)**\n2. > \u201c\u5e08\u59d0\uff0c\u6211\u80fd\u8fdb\u54b1\u4eec\u7c7d\u83f2\u56e2\u961f\u5417\uff1f\u9ebb\u70e6\u5e08\u59d0\u628a\u6211\u62c9\u8fdb\u53bb[\u5408\u5341]\u201d **(\u9ad8\u60c5\u611f\u4f9d\u8d56\u4e0e\u5f52\u5c5e\u611f\u9700\u6c42\u7684\u76f4\u63a5\u4f53\u73b0)**\n3. > \u201c\u5e08\u59d0\uff0c\u6211\u4e0d\u592a\u4f1a\u5f55\uff0c\u4f60\u5e2e\u6211\u770b\u770b\u597d\u5417\u201d **(\u64cd\u4f5c\u4f9d\u8d56\u6027\u5f3a\uff0c\u9700\u8981\u624b\u628a\u624b\u6307\u5bfc)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6\u60c5\u7eea\u5de8\u5a74\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u793e\u4ea4\u5f52\u5c5e\u4e0e\u5b89\u5168\u966a\u4f34**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d\u504f\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u9ad8\u9891\u60c5\u611f\u966a\u62a4\u4e0e\u6781\u4f4e\u95e8\u69db\u7684\u6210\u5c31\u611f\u53cd\u9988\uff0c\u575a\u51b3\u907f\u514d\u65bd\u52a0\u538b\u529b**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\u504f\u9ad8\", \"maslow_need\": \"\u793e\u4ea4/\u5b89\u5168\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf+\u7597\u6108\u966a\u4f34\u8f85\u52a9\u5305\"}\n```";
