    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u7f3a\u652f\u4ed8\u8bb0\u5f55\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u3001\u7528\u6237\u804c\u4e1a/\u6536\u5165/\u5bb6\u5ead\u7ed3\u6784\u7b49\u8d44\u6e90\u5e95\u5ea7\u6838\u5fc3\u7ef4\u5ea6\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4f4e)**\n    *   **\u8868\u5c42\u52a8\u673a**\uff1a\u53cd\u590d\u8868\u8fbe\u201c\u60f3\u4e0a\u201d\u3001\u201c\u60f3\u52a0\u5165\u5de5\u4f5c\u5ba4\u201d\uff0c\u5bf9\u793e\u7fa4\u4e92\u52a8\uff08\u52a0\u7fa4\u3001\u6015\u89e3\u6563\u3001\u627e\u73ed\u73ed\uff09\u6709\u8f83\u9ad8\u5174\u8da3\u3002\n    *   **\u6df1\u5c42\u52a8\u673a**\uff1a**\u53d8\u73b0\u52a8\u673a\u6a21\u7cca**\uff0c\u672a\u63d0\u53ca\u5177\u4f53\u7ecf\u6d4e\u538b\u529b\u6216\u521b\u6536\u76ee\u6807\u3002\u591a\u6b21\u5f3a\u8c03\u201c\u8d44\u91d1\u7d27\u5f20\u201d\u3001\u201c\u501f\u94b1\u201d\uff0c\u652f\u4ed8\u80fd\u529b\u662f\u6838\u5fc3\u969c\u788d\u3002\u5b66\u4e60\u52a8\u673a\u53ef\u80fd\u8ba9\u4f4d\u4e8e**\u793e\u4ea4\u5f52\u5c5e\u4e0e\u60c5\u611f\u8054\u7ed3\u9700\u6c42**\uff08\u5982\u201c\u7231\u4e0a\u201d\u73ed\u73ed\u58f0\u97f3\u3001\u73cd\u60dc\u7f18\u5206\uff09\u3002\n    *   **\u4fe1\u53f7**\uff1a\u5174\u8da3\u4e0e\u652f\u4ed8\u80fd\u529b\u4e25\u91cd\u51b2\u7a81\uff0c\u52a8\u673a\u4e2d**\u4ece\u4f17\u3001\u60c5\u611f\u4f9d\u8d56**\u6210\u5206\u53ef\u80fd\u9ad8\u4e8e\u5bf9\u6280\u80fd/\u53d8\u73b0\u7684\u771f\u5b9e\u6e34\u671b\u3002\n\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u6781\u4f4e)**\n    *   **\u7ecf\u6d4e\u8d44\u6e90**\uff1a**\u660e\u786e\u3001\u53cd\u590d\u3001\u591a\u6b21\u58f0\u660e\u201c\u6ca1\u8d44\u91d1\u201d\u3001\u201c\u8d44\u91d1\u7d27\u5f20\u201d**\uff0c\u9700\u5411\u670b\u53cb\u501f\u94b1\u652f\u4ed8\u5b66\u8d39\uff0c\u7b14\u8bb0\u672c\u9700\u7ef4\u4fee\u3002\u7ecf\u6d4e\u72b6\u51b5\u62ee\u636e\u3002\n    *   **\u65f6\u95f4/\u7cbe\u529b\u8d44\u6e90**\uff1a\u4fe1\u606f\u4e0d\u8db3\u3002\u4f46\u7528\u6237\u6d3b\u8dc3\u4e8e\u591a\u4e2a\u793e\u7fa4\uff08\u540e\u671f\u73ed\u3001\u79c1\u7fa4\uff09\uff0c\u663e\u793a\u6709\u95f2\u6687\u65f6\u95f4\u3002\n    *   **\u8bbe\u5907/\u6280\u80fd\u8d44\u6e90**\uff1a\u6709\u7535\u8111\uff08I7\u5904\u7406\u5668\uff09\uff0c\u4f46\u201c\u8001\u4e2d\u6bd2\u201d\uff0c\u8bbe\u5907\u7a33\u5b9a\u6027\u5b58\u7591\u3002\u81ea\u79f0\u201c\u540e\u671f\u201d\u5b66\u4e60\u8005\uff0c\u6709\u4e00\u5b9a\u6280\u80fd\u57fa\u7840\u3002\n    *   **\u4fe1\u53f7**\uff1a**\u7ecf\u6d4e\u8d44\u6e90\u4e25\u91cd\u532e\u4e4f**\uff0c\u662f\u5f53\u524d\u6700\u6838\u5fc3\u7684\u5236\u7ea6\u56e0\u7d20\u548c\u98ce\u9669\u70b9\u3002\n\n*   **\u5fc3\u7406\u5f39\u6027 (\u4f4e)**\n    *   **\u6297\u538b\u4e0e\u575a\u6301\u6027**\uff1a\u9762\u5bf9\u9500\u552e\u9ad8\u538b\u50ac\u5355\uff0c\u4ee5\u201c\u8d44\u91d1\u7d27\u5f20\u201d\u4e3a\u7531\u6e29\u548c\u4f46\u6301\u7eed\u5730\u62d2\u7edd\uff0c\u672a\u8868\u73b0\u5f3a\u70c8\u7126\u8651\u6216\u5bf9\u6297\uff0c\u6709\u4e00\u5b9a\u949d\u611f\u529b\u3002\u4f46**\u51b3\u7b56\u6613\u53d7\u60c5\u611f\u548c\u793e\u7fa4\u6c1b\u56f4\u5f71\u54cd**\uff08\u5982\u56e0\u73ed\u73ed\u58f0\u97f3\u201c\u7231\u4e0a\u201d\uff09\u3002\n    *   **\u81ea\u4e3b\u6027\u4e0e\u76ee\u6807\u611f**\uff1a\u76ee\u6807\u6a21\u7cca\uff0c\u884c\u52a8\u88ab\u52a8\u3002\u5bf9\u5206\u73ed\u3001\u73ed\u4f1a\u7b49\u6d41\u7a0b\u7ec6\u8282\u5173\u6ce8\u5ea6\u9ad8\uff0c\u4f46\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u3001\u53d8\u73b0\u8def\u5f84\u7b49\u6838\u5fc3\u95ee\u9898\u63a2\u8ba8\u6781\u5c11\u3002\n    *   **\u4fe1\u53f7**\uff1a**\u6613\u53d7\u5916\u90e8\u6c1b\u56f4\u5f15\u5bfc\uff0c\u5185\u5728\u9a71\u52a8\u529b\u4e0d\u8db3\uff0c\u51b3\u7b56\u7406\u6027\u5f31**\u3002\u5c5e\u4e8e\u201c\u6c1b\u56f4\u9a71\u52a8\u578b\u201d\u800c\u975e\u201c\u76ee\u6807\u9a71\u52a8\u578b\u201d\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a**\u672a\u652f\u4ed8**\u3002\u7528\u6237\u6700\u7ec8\u672a\u5728\u9500\u552e\u50ac\u903c\u4e0b\u5b8c\u6210\u652f\u4ed8\uff0c\u4e14\u652f\u4ed8\u9700\u4f9d\u8d56\u5916\u90e8\u501f\u6b3e\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u4fe1\u606f\u4e0d\u8db3\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u914d\u5076\u6216\u5bb6\u4eba\u610f\u89c1\u3002\n*   **\u6b65\u9aa41-4\u5224\u5b9a**\uff1a\n    *   **\u52a8\u673a (C\u7c7b-\u6a21\u7cca\u52a8\u673a)**\uff1a\u5174\u8da3\u4e0e\u652f\u4ed8\u80fd\u529b\u77db\u76fe\uff0c\u793e\u4ea4\u52a8\u673a\u53ef\u80fd\u5f3a\u4e8e\u5b66\u4e60\u52a8\u673a\u3002\n    *   **\u8d44\u6e90 (D\u7c7b-\u8d44\u6e90\u532e\u4e4f)**\uff1a\u7ecf\u6d4e\u8d44\u6e90\u660e\u786e\u544a\u6025\uff0c\u9700\u501f\u94b1\u6d88\u8d39\u3002\n    *   **\u5fc3\u7406\u5f39\u6027 (C\u7c7b-\u4f4e\u5f39\u6027)**\uff1a\u6613\u53d7\u6c1b\u56f4\u5f71\u54cd\uff0c\u7f3a\u4e4f\u6e05\u6670\u89c4\u5212\u548c\u575a\u6301\u6027\u3002\n    *   **\u7efc\u5408\u5224\u5b9a**\uff1a**C/D\u578b\u8fb9\u7f18\u7528\u6237**\u3002\u6709\u8868\u5c42\u5174\u8da3\u4f46\u7f3a\u4e4f\u6838\u5fc3\u8d44\u6e90\u4e0e\u575a\u5b9a\u52a8\u673a\uff0c\u5904\u4e8e\u8f6c\u5316\u8fb9\u7f18\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**\uff1a**T7 \u8d44\u6e90\u532e\u4e4f\u7684\u89c2\u671b\u8005**\u3002\n    *   **\u7279\u5f81\u543b\u5408**\uff1a\u5bf9\u8bfe\u7a0b\u548c\u793e\u7fa4\u5c55\u793a\u5174\u8da3\uff08\u89c2\u671b\uff09\uff0c\u4f46**\u7ecf\u6d4e\u6761\u4ef6\u660e\u786e\u4e0d\u5141\u8bb8**\uff08\u8d44\u6e90\u532e\u4e4f\uff09\uff0c\u51b3\u7b56\u72b9\u8c6b\uff0c\u6613\u53d7\u4fc3\u9500\u6c1b\u56f4\u548c\u60c5\u611f\u8bdd\u672f\u5f71\u54cd\uff0c\u4f46\u6700\u7ec8\u53ef\u80fd\u56e0\u652f\u4ed8\u95e8\u69db\u653e\u5f03\u3002\n    *   **\u4e0d\u7b26\u70b9**\uff1a\u7528\u6237\u8868\u73b0\u51fa\u9ad8\u4e8eT7\u7684\u793e\u7fa4\u6d3b\u8dc3\u5ea6\u548c\u60c5\u611f\u8054\u7ed3\u9700\u6c42\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u6781\u9ad8)\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u9884\u671f\u7ba1\u7406\u5931\u8861 (\u9ad8\u98ce\u9669)**\uff1a\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa\u201c90%\u4e2d\u7a3f\u7387\u201d\u3001\u201c\u4e00\u4e2a\u6708\u53d8\u73b0\u201d\u3001\u201c\u7761\u540e\u6536\u5165\u201d\uff0c\u4e0e\u7528\u6237\u5b9e\u9645\u80fd\u529b\uff08\u7ecf\u6d4e\u3001\u5199\u4f5c\u57fa\u7840\u672a\u77e5\uff09\u53ef\u80fd\u4e25\u91cd\u4e0d\u7b26\u3002\n    2.  **\u652f\u4ed8\u80fd\u529b\u4e0d\u8db3 (\u6781\u9ad8\u98ce\u9669)**\uff1a**\u7528\u6237\u5df2\u591a\u6b21\u660e\u786e\u8868\u793a\u9700\u501f\u94b1\u652f\u4ed8**\u3002\u8fd9\u662f\u6700\u6838\u5fc3\u7684\u9000\u8d39\u98ce\u9669\uff0c\u6781\u6613\u5728\u8fd8\u6b3e\u538b\u529b\u4e0b\u6216\u5b66\u4e60\u9047\u632b\u65f6\u8981\u6c42\u9000\u8d39\u3002\n    3.  **\u5b66\u4e60\u6548\u679c\u4e0d\u4f73 (\u9ad8\u98ce\u9669)**\uff1a\u7528\u6237\u52a8\u673a\u4e0d\u7eaf\uff08\u793e\u4ea4/\u60c5\u611f\uff09\uff0c\u4e14\u8bbe\u5907\uff08\u7b14\u8bb0\u672c\uff09\u4e0d\u7a33\u5b9a\uff0c\u6301\u7eed\u5b66\u4e60\u548c\u4ea7\u51fa\u6548\u679c\u5b58\u7591\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9 (\u4fe1\u606f\u4e0d\u8db3)**\uff1a\u672a\u63d0\u53ca\u3002\n    5.  **\u4ea7\u54c1\u4ea4\u4ed8\u4e0d\u7b26 (\u4e2d\u98ce\u9669)**\uff1a\u9500\u552e\u627f\u8bfa\u201c\u5de5\u4f5c\u5ba4\u8d44\u6e90\u201d\u3001\u201c\u5546\u5355\u7fa4\u201d\u7b49\u9644\u52a0\u4ef7\u503c\uff0c\u82e5\u4ea4\u4ed8\u6253\u6298\u6263\u6613\u5f15\u53d1\u6295\u8bc9\u3002\n    6.  **\u9500\u552e\u8bf1\u5bfc/\u6b3a\u8bc8 (\u9ad8\u98ce\u9669)**\uff1a\u9500\u552e\u4f7f\u7528\u201c\u6700\u540e\u673a\u4f1a\u201d\u3001\u201c\u6da8\u4ef7\u201d\u3001\u201c\u4f18\u60e0\u5238\u4ef7\u503c14000\u201d\u7b49**\u5236\u9020\u7a00\u7f3a\u548c\u6050\u60e7\u7684\u8bdd\u672f**\uff0c\u4e14\u5b58\u5728\u201c\u4e0d\u6ee1\u610f\u968f\u65f6\u9000\u201d\u7684\u627f\u8bfa\uff0c\u53ef\u80fd\u88ab\u7528\u6237\u89c6\u4e3a\u8bf1\u5bfc\u3002\n    7.  **\u7ade\u54c1\u5bf9\u6bd4/\u9700\u6c42\u6d88\u5931 (\u4f4e\u98ce\u9669)**\uff1a\u672a\u4f53\u73b0\u3002\n\n*   **\u7efc\u5408\u98ce\u9669\u7b49\u7ea7**\uff1a**\u6781\u9ad8**\u3002\u6838\u5fc3\u98ce\u9669\u6e90\u4e8e**\u652f\u4ed8\u80fd\u529b\u4e0e\u4ea7\u54c1\u4ef7\u683c\u4e25\u91cd\u4e0d\u5339\u914d**\uff0c\u53e0\u52a0\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u4e3b\u8981\u8fdd\u89c4\u70b9**\uff1a\n    *   **\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u5938\u5927\u5ba3\u4f20**\uff1a\u9891\u7e41\u4f7f\u7528\u201c90%\u7b7e\u7ea6\u4e2d\u7a3f\u7387\u201d\u3001\u201c\u4e00\u4e2a\u6708\u6295\u7a3f\u53d8\u73b0\u201d\u3001\u201c\u7761\u540e\u6536\u5165\u201d\u3001\u201c\u534e\u4e3d\u8f6c\u8eab\u201d\u7b49\u8bcd\u8bed\uff0c**\u6d89\u5acc\u865a\u5047\u6216\u8bef\u5bfc\u6027\u5ba3\u4f20**\u3002\n    *   **\u5236\u9020\u7126\u8651\u4e0e\u7a00\u7f3a**\uff1a\u4f7f\u7528\u201c\u5c01\u73ed\u5012\u8ba1\u65f6\u201d\u3001\u201c\u9519\u8fc7\u518d\u65e0\u201d\u3001\u201c\u6da8\u4ef7\u201d\u3001\u201c\u798f\u5229\u6d88\u5931\u201d\u7b49\u8bdd\u672f\u65bd\u538b\u3002\n    *   **\u5ffd\u89c6\u7528\u6237\u652f\u4ed8\u80fd\u529b**\uff1a\u5728\u7528\u6237\u591a\u6b21\u58f0\u660e\u201c\u8d44\u91d1\u7d27\u5f20\u201d\u3001\u201c\u501f\u94b1\u201d\u540e\uff0c\u4ecd\u6301\u7eed\u9ad8\u538b\u50ac\u5355\uff0c**\u672a\u8fdb\u884c\u652f\u4ed8\u80fd\u529b\u8bc4\u4f30\u4e0e\u98ce\u9669\u63d0\u793a**\uff0c\u8fdd\u80cc\u9002\u5f53\u6027\u539f\u5219\u3002\n    *   **\u60c5\u611f\u7ed1\u67b6**\uff1a\u201c\u6211\u5bf9\u4f60\u8fd9\u4e48\u7528\u5fc3\uff0c\u4f60\u4e3a\u4ec0\u4e48\u8fd8\u8981\u72b9\u8c6b\uff1f\u201d\u7b49\u8bdd\u672f\u4e0d\u59a5\u3002\n    *   **\u201c\u968f\u65f6\u9000\u8d39\u201d\u627f\u8bfa**\uff1a\u6b64\u627f\u8bfa\u82e5\u672a\u660e\u786e\u9000\u8d39\u6761\u6b3e\u548c\u6761\u4ef6\uff0c\u53ef\u80fd\u5f15\u53d1\u540e\u7eed\u7ea0\u7eb7\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d**\uff1a**\u4e25\u91cd\u9519\u914d**\u3002\u7528\u6237\u5f53\u524d\u7ecf\u6d4e\u72b6\u51b5\u65e0\u6cd5\u627f\u53d72880/4000+\u7684\u8bfe\u7a0b\u8d39\u7528\uff0c\u5f3a\u63a8\u5c06\u5bfc\u81f4\u6781\u9ad8\u503a\u52a1\u548c\u9000\u8d39\u98ce\u9669\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**\u7acb\u5373\u7ec8\u6b62\u8f6c\u5316\uff0c\u542f\u52a8\u53cb\u597d\u529d\u9000**\u3002\n*   **\u5177\u4f53\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u98ce\u9669\u9694\u79bb**\uff1a\u7acb\u5373\u540c\u6b65\u4fe1\u606f\u7ed9\u4ea4\u4ed8\u56e2\u961f\uff0c\u6807\u8bb0\u201c\u9ad8\u98ce\u9669-\u7ecf\u6d4e\u62ee\u636e\u9700\u501f\u6b3e\u652f\u4ed8\u201d\u3002\n    2.  **\u5408\u89c4\u56de\u8bbf**\uff1a\u7531\u73ed\u4e3b\u4efb\u6216\u5ba2\u670d\u7528\u6e29\u548c\u65b9\u5f0f\u8054\u7cfb\u7528\u6237\uff0c**\u660e\u786e\u544a\u77e5\u5b66\u4e60\u9700\u8981\u6301\u7eed\u7684\u65f6\u95f4\u7cbe\u529b\u6295\u5165\uff0c\u4ee5\u53ca\u53d8\u73b0\u7684\u4e0d\u786e\u5b9a\u6027**\uff0c\u7ba1\u7406\u5176\u9884\u671f\u3002\n    3.  **\u529d\u9000\u5f15\u5bfc**\uff1a\u57fa\u4e8e\u7528\u6237\u201c\u8d44\u91d1\u7d27\u5f20\u201d\u7684\u73b0\u72b6\uff0c**\u5efa\u8bae\u5176\u6682\u7f13\u62a5\u8bfe\uff0c\u4f18\u5148\u7a33\u5b9a\u4e3b\u4e1a\u548c\u751f\u6d3b**\u3002\u53ef\u5f15\u5bfc\u5176\u5173\u6ce8\u514d\u8d39\u8d44\u6e90\u6216\u4f4e\u4ef7\u4f53\u9a8c\u5185\u5bb9\u3002\n    4.  **\u4e25\u7981\u7ee7\u7eed\u4fc3\u9500**\uff1a\u4efb\u4f55\u9500\u552e\u6216\u73ed\u4e3b\u4efb\u4e0d\u5f97\u518d\u5bf9\u8be5\u7528\u6237\u8fdb\u884c\u8bfe\u7a0b\u4fc3\u9500\u3002\n    5.  **\u8bb0\u5f55\u5f52\u6863**\uff1a\u5b8c\u6574\u8bb0\u5f55\u7528\u6237\u201c\u9700\u501f\u6b3e\u652f\u4ed8\u201d\u7684\u660e\u786e\u8868\u8ff0\u53ca\u9500\u552e\u6c9f\u901a\u8fc7\u7a0b\uff0c\u4ee5\u5907\u5ba1\u8ba1\u3002\n\n{\"core_type\": \"T7 \u8d44\u6e90\u532e\u4e4f\u7684\u89c2\u671b\u8005\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"product_match\": \"\u9519\u914d\", \"action\": \"\u7acb\u5373\u7ec8\u6b62\u8f6c\u5316\u5e76\u53cb\u597d\u529d\u9000\"}";
