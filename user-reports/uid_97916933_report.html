    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a (UID: 97916933)\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a**\u4e2d\u7b49**\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6709\u58f0\u884c\u4e1a\u7684\u5174\u8da3\uff0c\u5b8c\u6210\u4e86\u6240\u6709\u4f5c\u4e1a\u548c\u76f4\u64ad\u8bfe\uff08\u5c3d\u7ba1\u6709\u9519\u8fc7\u53e3\u4ee4\u7684\u60c5\u51b5\uff09\uff0c\u5e76\u6700\u7ec8\u652f\u4ed8\u4e86\u9ad8\u9636\u73ed\u8d39\u7528\u3002\u52a8\u673a\u504f\u5411**\u53d8\u73b0\u9a71\u52a8**\uff08\u5173\u6ce8\u201c\u517c\u804c\u201d\u3001\u201c\u53d8\u73b0\u65b9\u5f0f\u201d\u3001\u201c\u8bc1\u4e66\u8d39\u7528\u201d\u3001\u201c\u5165\u4f4f\u8d44\u683c\u201d\uff09\uff0c\u4f46\u7f3a\u4e4f\u5bf9\u6280\u80fd\u63d0\u5347\u672c\u8eab\u7684\u70ed\u5ff1\u8868\u8fbe\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u65e0\u4efb\u4f55\u5173\u4e8e\u7528\u6237\u5e74\u9f84\u3001\u804c\u4e1a\u3001\u6536\u5165\u3001\u65f6\u95f4\u3001\u8bbe\u5907\u7b49\u80cc\u666f\u4fe1\u606f\u3002\u652f\u4ed8\u65f6\u5c1d\u8bd5\u4f7f\u7528\u652f\u4ed8\u5b9d\u5206\u671f\uff0c\u63d0\u793a**\u53ef\u80fd\u5b58\u5728\u7ecf\u6d4e\u538b\u529b\u6216\u652f\u4ed8\u80fd\u529b\u6709\u9650**\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a**\u8f83\u4f4e**\u3002\u7528\u6237\u8868\u73b0\u51fa**\u88ab\u52a8\u3001\u4f9d\u8d56\u6027\u5f3a**\u7684\u7279\u70b9\uff1a\u591a\u6b21\u9519\u8fc7\u76f4\u64ad\u53e3\u4ee4\uff08\u201c\u6211\u6ca1\u542c\u89c1\u554a\u201d\u3001\u201c\u6700\u540e\u4e24\u5206\u949f\u6211\u624b\u673a\u5173\u673a\u4e86\u201d\uff09\uff0c\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u652f\u4ed8\u5931\u8d25\u3001\u52a0\u4e0d\u8fdb\u7fa4\uff09\u65f6\u672a\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u800c\u662f\u7b49\u5f85\u9500\u552e\u5f15\u5bfc\u3002\u9762\u5bf9\u5b66\u4e60\u6d41\u7a0b\u8868\u73b0\u51fa\u4e00\u5b9a\u7684**\u60f0\u6027\u548c\u754f\u96be\u60c5\u7eea**\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**\uff1a**\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u4e8e4\u67088\u65e5\u6210\u529f\u652f\u4ed8\u9ad8\u9636\u73ed\u8bfe\u7a0b\u8d39\u7528\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u65e0\u4efb\u4f55\u6d89\u53ca\u5bb6\u5ead\u6216\u914d\u5076\u7684\u8ba8\u8bba\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u4e3a\u72ec\u7acb\u51b3\u7b56\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u7eaf\u5ea6**\uff1a**B\u7c7b\uff08\u529f\u5229\u9a71\u52a8\u578b\uff09**\u3002\u6838\u5fc3\u8bc9\u6c42\u660e\u786e\u4e3a\u201c\u517c\u804c\u53d8\u73b0\u201d\uff0c\u5bf9\u201c\u8bc1\u4e66\u8d39\u7528\u201d\u3001\u201c\u5165\u4f4f\u8d44\u683c\u201d\u3001\u201c\u53d8\u73b0\u65b9\u5f0f\u201d\u9ad8\u5ea6\u5173\u6ce8\uff0c\u5b66\u4e60\u884c\u4e3a\u4e3a\u8fbe\u6210\u6b64\u76ee\u6807\u7684\u5fc5\u8981\u6b65\u9aa4\u3002\n*   **\u6b65\u9aa42 - \u8d44\u6e90\u5e95\u5ea7**\uff1a**D\u7c7b\uff08\u8d44\u6e90\u4e0d\u660e\uff09**\u3002\u5173\u952e\u80cc\u666f\u4fe1\u606f\u5168\u65e0\uff0c\u4f46\u652f\u4ed8\u884c\u4e3a\u53ca\u5bf9\u5206\u671f\u7684\u8be2\u95ee\u6697\u793a\u8d44\u6e90\u53ef\u80fd\u7d27\u5f20\u3002\n*   **\u6b65\u9aa43 - \u5fc3\u7406\u5f39\u6027**\uff1a**C\u7c7b\uff08\u4f4e\u5f39\u6027\u6267\u884c\u8005\uff09**\u3002\u9075\u5faa\u6307\u4ee4\u4f46\u4e3b\u52a8\u6027\u5dee\uff0c\u9047\u5230\u5c0f\u969c\u788d\uff08\u5982\u652f\u4ed8\u6280\u672f\u95ee\u9898\uff09\u6613\u5361\u4f4f\uff0c\u9700\u8981\u5916\u90e8\u6301\u7eed\u63a8\u52a8\u548c\u5177\u4f53\u6307\u5bfc\u3002\n*   **\u7efc\u5408\u5224\u5b9a**\uff1a**B-C-D\u578b\u7528\u6237**\u3002\u6838\u5fc3\u9a71\u52a8\u662f\u53d8\u73b0\uff0c\u4f46\u6267\u884c\u529b\u4f9d\u8d56\u5916\u90e8\u7763\u4fc3\uff0c\u4e14\u8d44\u6e90\u72b6\u51b5\u4e0d\u660e\uff0c\u6784\u6210\u6f5c\u5728\u98ce\u9669\u7ec4\u5408\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **T7 \u529f\u5229\u53d8\u73b0\u5bfb\u6c42\u8005**\u3002\u9ad8\u5ea6\u5339\u914d\u3002\u7528\u6237\u5168\u7a0b\u5173\u6ce8\u70b9\u5728\u4e8e\u201c\u517c\u804c\u201d\u3001\u201c\u53d8\u73b0\u201d\u3001\u201c\u8bc1\u4e66\u201d\u3001\u201c\u5165\u4f4f\u8d44\u683c\u201d\uff08\u5373\u63a5\u5355\u8d44\u6e90\uff09\uff0c\u5bf9\u5b66\u4e60\u672c\u8eab\u7684\u4ef7\u503c\u63a2\u8ba8\u4e3a\u96f6\u3002\u5176\u884c\u4e3a\u6a21\u5f0f\uff08\u5b8c\u6210\u5fc5\u8981\u4efb\u52a1\u4ee5\u83b7\u53d6\u8d44\u683c\uff09\u5b8c\u5168\u7b26\u5408\u8be5\u539f\u578b\u7279\u5f81\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669**\uff1a**\u4e2d\u9ad8**\u3002\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u9884\u671f\u4e0d\u7b26 (\u9ad8)**\uff1a\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa\u201c\u517c\u804c\u53d8\u73b0\u201d\u3001\u201c\u624b\u673a\u53ef\u505a\u201d\u3001\u201c\u5404\u79cd\u5546\u5355\u201d\uff0c\u6781\u6613\u5f15\u53d1\u7528\u6237\u5b66\u540e\u63a5\u5355\u56f0\u96be\u65f6\u7684\u5de8\u5927\u843d\u5dee\u611f\u3002\n    2.  **\u6548\u679c\u4e0d\u8fbe (\u4e2d)**\uff1a\u7528\u6237\u5fc3\u7406\u5f39\u6027\u4f4e\uff0c\u81ea\u4e3b\u7ec3\u4e60\u548c\u6df1\u5ea6\u5b66\u4e60\u52a8\u529b\u4e0d\u8db3\uff0c\u6280\u80fd\u63d0\u5347\u6548\u679c\u53ef\u80fd\u7f13\u6162\uff0c\u6613\u5f52\u548e\u4e8e\u8bfe\u7a0b\u3002\n    3.  **\u7ecf\u6d4e\u538b\u529b (\u4e2d\u9ad8)**\uff1a\u8be2\u95ee\u5206\u671f\u652f\u4ed8\u4e14\u652f\u4ed8\u8fc7\u7a0b\u51fa\u73b0\u969c\u788d\uff0c**\u63d0\u793a\u5176\u652f\u4ed8\u80fd\u529b\u53ef\u80fd\u5904\u4e8e\u4e34\u754c\u70b9**\uff0c\u662f\u9000\u8d39\u7684\u9ad8\u654f\u611f\u89e6\u53d1\u70b9\u3002\n    4.  **\u65f6\u95f4\u51b2\u7a81 (\u4f4e)**\uff1a\u6682\u65e0\u4f53\u73b0\u3002\n    5.  **\u670d\u52a1\u4f53\u9a8c (\u4e2d)**\uff1a\u7528\u6237\u5df2\u9047\u5230\u201c\u52a0\u4e0d\u8fdb\u7fa4\u201d\u7b49\u57fa\u7840\u670d\u52a1\u95ee\u9898\uff0c\u82e5\u540e\u7eed\u73ed\u4e3b\u4efb\u670d\u52a1\u4e0d\u53ca\u65f6\uff0c\u6613\u5f15\u53d1\u4e0d\u6ee1\u3002\n    6.  **\u7ade\u54c1\u5bf9\u6bd4/\u8206\u8bba\u5f71\u54cd (\u4f4e)**\uff1a\u6682\u65e0\u4f53\u73b0\u3002\n    7.  **\u5bb6\u5ead\u53cd\u5bf9 (\u672a\u77e5)**\uff1a\u4fe1\u606f\u4e0d\u8db3\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u98ce\u9669\u70b9**\uff1a\n    *   **\u8fc7\u5ea6\u627f\u8bfa**\uff1a\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u624b\u673a\u53ef\u4ee5\u505a\u7684\u517c\u804c\u201d\u3001\u201c\u5404\u79cd\u5404\u6837\u7684\u5546\u5355\u201d\u3001\u201c\u9501\u5b9a\u5165\u9a7b\u540d\u989d\u201d\uff0c**\u5b58\u5728\u5938\u5927\u517c\u804c\u6613\u5f97\u6027\u548c\u6536\u5165\u524d\u666f\u7684\u5acc\u7591**\uff0c\u662f\u4e3b\u8981\u5408\u89c4\u96f7\u533a\u3002\n    *   **\u5236\u9020\u7a00\u7f3a\u4e0e\u7126\u8651**\uff1a\u9891\u7e41\u4f7f\u7528\u201c\u53d6\u6d88\u62db\u52df\u8d44\u683c\u201d\u3001\u201c\u540d\u989d\u6709\u9650\u201d\u3001\u201c\u62a2\u5238\u201d\u7b49\u8bdd\u672f\uff0c\u7b26\u5408\u884c\u4e1a\u901a\u7528\u4f46\u654f\u611f\u7684\u4fc3\u5355\u7b56\u7565\u3002\n    *   **\u652f\u4ed8\u5f15\u5bfc**\uff1a\u5728\u7528\u6237\u652f\u4ed8\u9047\u5230\u6280\u672f\u95ee\u9898\u65f6\uff0c\u9500\u552e\u63d0\u4f9b\u4e86\u591a\u79cd\u64cd\u4f5c\u6307\u5bfc\uff08\u6362\u6d41\u91cf\u3001\u6e05\u7f13\u5b58\u3001\u626b\u7801\u65b9\u5f0f\uff09\uff0c\u867d\u4e3a\u534f\u52a9\uff0c\u4f46**\u5728\u7528\u6237\u660e\u663e\u652f\u4ed8\u4e0d\u7545\u65f6\u672a\u8fdb\u884c\u652f\u4ed8\u80fd\u529b\u6216\u610f\u613f\u7684\u518d\u786e\u8ba4**\uff0c\u5b58\u5728\u4e00\u5b9a\u98ce\u9669\u3002\n*   **\u6574\u4f53\u8bc4\u4f30**\uff1a\u9500\u552e\u6d41\u7a0b\u5b58\u5728**\u5938\u5927\u53d8\u73b0\u7ed3\u679c**\u7684\u5408\u89c4\u9690\u60a3\uff0c\u4e3a\u540e\u7eed\u4ea4\u4ed8\u57cb\u4e0b\u6295\u8bc9\u5730\u96f7\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**\uff1a**\u504f\u5dee**\u3002\u7528\u6237\u52a8\u673a\uff08\u5feb\u901f\u517c\u804c\u53d8\u73b0\uff09\u4e0e\u4ea7\u54c1\u6838\u5fc3\uff08\u7cfb\u7edf\u6027\u7684\u58f0\u97f3\u6f14\u64ad\u6280\u80fd\u57f9\u8bad\uff09\u5b58\u5728\u672c\u8d28\u504f\u5dee\u3002\u7528\u6237\u671f\u5f85\u7684\u662f\u201c\u5de5\u4f5c\u4ecb\u7ecd\u6240\u201d\uff0c\u800c\u975e\u201c\u804c\u4e1a\u6280\u80fd\u5b66\u6821\u201d\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**24\u5c0f\u65f6\u5185\u542f\u52a8\u9884\u671f\u7ba1\u7406\uff0c\u660e\u786e\u53d8\u73b0\u8def\u5f84**\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9884\u671f\u6821\u6b63\uff08\u5173\u952e\uff09**\uff1a\u9996\u5468\u5185\u5fc5\u987b\u8fdb\u884c\u4e00\u5bf9\u4e00\u6c9f\u901a\uff0c**\u7528\u5177\u4f53\u6848\u4f8b\u548c\u6570\u636e**\u8bf4\u660e\u6709\u58f0\u884c\u4e1a\u53d8\u73b0\u7684\u5468\u671f\u3001\u96be\u5ea6\u3001\u6536\u5165\u9636\u68af\uff0c\u7834\u9664\u201c\u5b66\u5b8c\u5373\u63a5\u5355\u201d\u7684\u5e7b\u60f3\u3002\u5c06\u76ee\u6807\u4ece\u201c\u5feb\u901f\u8d5a\u94b1\u201d\u5f15\u5bfc\u81f3\u201c\u6280\u80fd\u79ef\u7d2f\u201d\u3002\n    2.  **\u5f3a\u5316\u652f\u6301**\uff1a\u9274\u4e8e\u7528\u6237\u5fc3\u7406\u5f39\u6027\u4f4e\uff0c\u9700\u63d0\u4f9b**\u66f4\u7ed3\u6784\u5316\u3001\u66f4\u7ec6\u81f4\u7684\u4efb\u52a1\u62c6\u89e3\u548c\u63d0\u9192**\uff0c\u907f\u514d\u5176\u56e0\u8ff7\u832b\u6216\u754f\u96be\u800c\u6389\u961f\u3002\n    3.  **\u5173\u6ce8\u652f\u4ed8\u538b\u529b**\uff1a\u7559\u610f\u7528\u6237\u540e\u7eed\u662f\u5426\u6709\u62b1\u6028\u8bfe\u7a0b\u4ef7\u503c\u3001\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\u7684\u8a00\u8bba\uff0c\u63d0\u524d\u505a\u597d\u5b89\u629a\u548c\u89e3\u51b3\u65b9\u6848\u6c9f\u901a\u3002\n    4.  **\u5408\u89c4\u515c\u5e95**\uff1a\u4fdd\u5b58\u597d\u9500\u552e\u627f\u8bfa\u7684\u76f8\u5173\u8bb0\u5f55\uff08\u5982\u201c\u624b\u673a\u517c\u804c\u201d\u3001\u201c\u5404\u79cd\u5546\u5355\u201d\u7b49\u804a\u5929\u8bb0\u5f55\uff09\uff0c\u4ee5\u5907\u53d1\u751f\u4e89\u8bae\u65f6\u6838\u67e5\u3002\n\n{\"core_type\": \"T7 \u529f\u5229\u53d8\u73b0\u5bfb\u6c42\u8005\", \"risk_level\": \"\u4e2d\u9ad8\", \"refund_risk\": \"\u4e2d\u9ad8\", \"product_match\": \"\u504f\u5dee\", \"action\": \"24\u5c0f\u65f6\u5185\u542f\u52a8\u9884\u671f\u7ba1\u7406\"}";
