u5b9a\uff0c\u5c06\u201c\u5b66\u5f97\u6162\u201d\u89c6\u4e3a\u4e3b\u8981\u969c\u788d\uff0c\u5e76\u76f4\u63a5\u8be2\u95ee\u201c\u6709\u56f0\u96be\u65f6\u8c01\u80fd\u5e2e\u6211\u201d\uff0c\u8868\u73b0\u51fa\u6781\u5f3a\u7684\u4f9d\u8d56\u6027\u548c\u4f4e\u81ea\u6211\u6548\u80fd\u611f\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5e74\u9f84\u5927\u4e86\u8ddf\u4f60\u4eec\u4e00\u8d77\u73a9\u6709\u70b9\u7b28\u8bf7\u6307\u6559\u8c22\u8c22\u60a8\u201d (04-09 09:22:44)\uff1b> \u201c\u8001\u5e08\u4e0a\u6b21\u6709\u4e2a\u8001\u5e08\u8bf4\u5e74\u9f84\u5927\u4e86\u5b66\u4e0d\u4e86\u8ddf\u4e0d\u4e0a\u8fd9\u6b21\u6211\u4e5f\u4e0d\u6562\u62a5\u540d\u6015\u62c9\u5927\u5bb6\u540e\u817f\u201d (04-09 09:34:01)\uff1b> \u201c\u6709\u56f0\u96be\u65f6\u8c01\u80fd\u5e2e\u6211\u201d (04-09 19:00:16)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u56e0\u5e74\u9f84\u800c\u4ea7\u751f\u7684\u5f3a\u70c8\u81ea\u5351\u611f\u548c\u88ab\u65f6\u4ee3\u629b\u5f03\u7684\u6050\u60e7**\u3002\u4ed6\u5bb3\u6015\u201c\u62c9\u5927\u5bb6\u540e\u817f\u201d\uff0c\u62c5\u5fc3\u81ea\u5df1\u201c\u7b28\u201d\u3001\u201c\u8ddf\u4e0d\u4e0a\u201d\uff0c\u5176\u5b66\u4e60\u884c\u4e3a\u80cc\u540e\u662f\u5bf9\u793e\u4f1a\u4ef7\u503c\u8ba4\u540c\u548c\u7fa4\u4f53\u5f52\u5c5e\u611f\u7684\u5f3a\u70c8\u6e34\u6c42\uff0c\u8d5a\u94b1\u662f\u83b7\u5f97\u5c0a\u91cd\u548c\u8bc1\u660e\u81ea\u6211\u4ef7\u503c\u7684\u9014\u5f84\u4e4b\u4e00\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u3001\u6301\u7eed\u7684\u6b63\u5411\u53cd\u9988\u4e0e\u65e0\u6761\u4ef6\u7684\u63a5\u7eb3**\u3002\u9700\u8981\u4e0d\u65ad\u80af\u5b9a\u4ed6\u7684\u201c\u4e0d\u7b28\u201d\uff0c\u5f3a\u8c03\u4ed6\u7684\u52aa\u529b\u548c\u8fdb\u6b65\uff0c\u8ba9\u4ed6\u611f\u53d7\u5230\u5728\u8fd9\u4e2a\u5b66\u4e60\u793e\u7fa4\u91cc\u662f\u88ab\u9700\u8981\u3001\u88ab\u5c0a\u91cd\u3001\u4e0d\u4f1a\u88ab\u629b\u5f03\u7684\u4e00\u5458\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1** \u7c7b (\u52a8\u673a\u4e2d\u7b49\uff0c\u8d44\u6e90\u5e95\u5ea7\u4f4e\uff0c\u5fc3\u7406\u5f39\u6027\u6781\u4f4e) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u76f4\u63a5\u8bc1\u636e\u89e6\u53d1\u501f\u8d37\u3001\u7edd\u5883\u7b49\u7ea2\u7ebf\u3002\u4f46**\u5bb6\u5ead\u652f\u6301\u5ea6\u672a\u77e5**\u662f\u6f5c\u5728\u98ce\u9669\u70b9\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u82e5\u5bb6\u4eba\u53cd\u5bf9\u5176\u201c\u4e71\u82b1\u94b1\u201d\u5b66\u4e60\uff0c\u6781\u6613\u52a8\u6447\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | \u8bfe\u7a0b\u8282\u594f\u7a0d\u5feb\u3001\u4f5c\u4e1a\u96be\u5ea6\u63d0\u5347\u65f6\uff0c\u4f1a\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u79ef\u7d2f\u632b\u8d25\u611f\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u7b2c\u4e00\u6b21\u72ec\u7acb\u64cd\u4f5c\u8f6f\u4ef6\u5931\u8d25\u3001\u4f5c\u4e1a\u88ab\u6279\u8bc4\u3001\u770b\u5230\u5176\u4ed6\u5b66\u5458\u8fdb\u6b65\u66f4\u5feb\u65f6\uff0c\u90fd\u53ef\u80fd\u56e0\u81ea\u5c0a\u5fc3\u53d7\u632b\u800c\u76f4\u63a5\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u82e5\u77ed\u671f\u5185\u672a\u63a5\u5230\u5546\u5355\u6216\u6536\u76ca\u751a\u5fae\uff0c\u4f1a\u5370\u8bc1\u5176\u201c\u6211\u4e0d\u884c\u201d\u7684\u9884\u8bbe\uff0c\u5bfc\u81f4\u653e\u5f03\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-3\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u8bfe\u7a0b\u96be\u5ea6\u548c\u4f5c\u4e1a\u8981\u6c42\u63d0\u5347\uff0c\u662f\u4ed6\u201c\u8ddf\u4e0d\u4e0a\u201d\u7126\u8651\u7684\u96c6\u4e2d\u7206\u53d1\u671f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5bb6\u540c\u5b66\uff0c\u6b22\u8fce\u4f60\uff01\u73ed\u73ed\u7279\u522b\u60f3\u8ddf\u4f60\u8bf4\uff0c\u6211\u4eec\u8fd9\u4e2a\u73ed\u91cc\u6709\u5f88\u591a\u50cf\u60a8\u4e00\u6837\u70ed\u7231\u751f\u6d3b\u3001\u613f\u610f\u5c1d\u8bd5\u65b0\u4e8b\u7269\u7684\u4f19\u4f34\u3002\u5b66\u4e60AI\u6ca1\u6709\u5e74\u9f84\u95e8\u69db\uff0c\u54b1\u4eec\u4e0d\u62fc\u901f\u5ea6\uff0c\u62fc\u7684\u662f\u575a\u6301\u548c\u70ed\u7231\u3002\u73ed\u73ed\u548c\u966a\u8dd1\u5b98\u4f1a\u4e00\u76f4\u966a\u7740\u4f60\uff0c\u6709\u4efb\u4f55\u4e00\u5c0f\u6b65\u5361\u4f4f\uff0c\u968f\u65f6\u558a\u6211\u4eec\uff0c\u6211\u4eec\u7684\u4efb\u52a1\u5c31\u662f\u5e2e\u4f60\u628a\u8def\u94fa\u5e73\u3002\u4f60\u4ea4\u7684\u6bcf\u4e00\u6b21\u4f5c\u4e1a\uff0c\u90fd\u662f\u5de8\u5927\u7684\u8fdb\u6b65\uff0c\u6211\u4eec\u90fd\u4e3a\u4f60\u9f13\u638c\uff01\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5174\u8da3\u6e38\u4e50\u7ebf\u3011**\u3002\u9996\u8981\u76ee\u6807\u662f\u5efa\u7acb\u4fe1\u5fc3\u548c\u5f52\u5c5e\u611f\uff0c\u800c\u975e\u65bd\u52a0\u53d8\u73b0\u538b\u529b\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u5f3a\u70c8\u8865\u5145\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u5305\u542b\uff1a1\uff09\u4f5c\u4e1a\u7b80\u5316\u7248\uff08\u5982\u53ea\u9700\u63d0\u4ea4\u4e00\u53e5\u8bdd\u914d\u97f3\u6216\u4e00\u5f20\u56fe\uff09\uff1b2\uff09\u6bcf\u65e5\u4e13\u5c5e\u9f13\u52b1\u8bdd\u672f\uff1b3\uff09\u907f\u514d\u5728\u7fa4\u5185\u516c\u5f00\u6bd4\u8f83\u4f5c\u4e1a\u8d28\u91cf\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1\uff09\u7edd\u4e0d\u5bf9\u4ed6\u4f7f\u7528\u4efb\u4f55\u6279\u8bc4\u6216\u6307\u51fa\u4e0d\u8db3\u7684\u70b9\u8bc4\u8bdd\u672f\uff0c\u6240\u6709\u53cd\u9988\u5fc5\u987b\u5305\u88f9\u5728\u201c\u9f13\u52b1-\u5177\u4f53\u8fdb\u6b65\u70b9-\u9f13\u52b1\u201d\u7684\u4e09\u660e\u6cbb\u7ed3\u6784\u4e2d\u30022\uff09\u7edd\u4e0d\u5728\u7fa4\u5185@\u4ed6\u50ac\u4f5c\u4e1a\u6216\u4e0e\u5176\u4ed6\u5b66\u5458\u8fdb\u884c\u8fdb\u5ea6\u5bf9\u6bd4\u30023\uff09\u7edd\u4e0d\u8981\u7ed9\u4ed6\u753b\u201c\u5feb\u901f\u8d5a\u5927\u94b1\u201d\u7684\u997c\uff0c\u91cd\u70b9\u5f3a\u8c03\u201c\u5b66\u4e60\u8fc7\u7a0b\u672c\u8eab\u7684\u4ef7\u503c\u548c\u5feb\u4e50\u201d\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5f53\u524d\u9636\u6bb5\u4efb\u4f55\u5347\u5355\u5efa\u8bae\u90fd\u4f1a\u88ab\u4ed6\u89e3\u8bfb\u4e3a\u201c\u6211\u73b0\u5728\u7684\u6c34\u5e73\u4e0d\u591f\u201d\uff0c\u5f15\u53d1\u7126\u8651\u548c\u9000\u7f29\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5e74\u9f84\u5927\u4e86\u8ddf\u4f60\u4eec\u4e00\u8d77\u73a9\u6709\u70b9\u7b28\u8bf7\u6307\u6559\u8c22\u8c22\u60a8\u201d **(\u81ea\u5351\u4e0e\u4f9d\u8d56)**\n2. > \u201c\u8001\u5e08\u4e0a\u6b21\u6709\u4e2a\u8001\u5e08\u8bf4\u5e74\u9f84\u5927\u4e86\u5b66\u4e0d\u4e86\u8ddf\u4e0d\u4e0a\u8fd9\u6b21\u6211\u4e5f\u4e0d\u6562\u62a5\u540d\u6015\u62c9\u5927\u5bb6\u540e\u817f\u201d **(\u6050\u60e7\u88ab\u629b\u5f03\u4e0e\u5426\u5b9a)**\n3. > \u201c\u6709\u56f0\u96be\u65f6\u8c01\u80fd\u5e2e\u6211\u201d **(\u6781\u5ea6\u4f9d\u8d56\u5916\u90e8\u652f\u6301\uff0c\u7f3a\u4e4f\u81ea\u4e3b\u89e3\u51b3\u95ee\u9898\u7684\u4fe1\u5fc3)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6 \u60c5\u7eea\u5de8\u5a74\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u5c0a\u91cd\u4e0e\u793e\u7fa4\u5f52\u5c5e\u611f\uff0c\u5bf9\u6297\u5e74\u9f84\u5e26\u6765\u7684\u81ea\u5351**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u6781\u81f4\u7684\u60c5\u611f\u629a\u6170\u548c\u96f6\u538b\u529b\u7684\u5b66\u4e60\u8def\u5f84\uff0c\u5265\u79bb\u4e00\u5207\u53ef\u80fd\u5f15\u53d1\u632b\u8d25\u611f\u7684\u4efb\u52a1\u548c\u6bd4\u8f83**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"maslow_need\": \"\u5c0a\u91cd\u5f52\u5c5e\", \"risk_level\": \"\u6781\u9ad8\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf+\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\"}\n```";
