    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u4e0e\u98ce\u63a7\u62a5\u544a\n\n## \u4fe1\u606f\u5145\u8db3\u6027\u8bc4\u4f30\n\u4fe1\u606f\u57fa\u672c\u5145\u8db3\uff0c\u53ef\u8fdb\u884c\u521d\u6b65\u5224\u65ad\u3002\u4f46\u7f3a\u4e4f\u7528\u6237\u5e74\u9f84\u3001\u6027\u522b\u3001\u57ce\u5e02\u3001\u804c\u4e1a\u3001\u6536\u5165\u3001\u5bb6\u5ead\u7ed3\u6784\u7b49\u5173\u952e\u80cc\u666f\u4fe1\u606f\uff0c\u5bf9\u8d44\u6e90\u5e95\u5ea7\u548c\u5fc3\u7406\u5f39\u6027\u7684\u8bc4\u4f30\u5b58\u5728\u4e00\u5b9a\u63a8\u65ad\u6210\u5206\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49)**\n    *   **\u8868\u5c42\u9700\u6c42**\uff1a\u5b66\u4e60AI\u5199\u4f5c\u6280\u80fd\uff0c\u83b7\u53d6\u526f\u4e1a\u53d8\u73b0\u8def\u5f84\uff08\u5c0f\u8bf4/\u77ed\u5267\uff09\u3002\n    *   **\u6df1\u5c42\u9700\u6c42**\uff1a\u89e3\u51b3\u201c\u56ca\u4e2d\u7f9e\u6da9\u201d\u7684\u7ecf\u6d4e\u538b\u529b\uff0c\u5bfb\u6c42\u5feb\u901f\u3001\u4f4e\u95e8\u69db\u7684\u589e\u6536\u65b9\u5f0f\u3002\u5bf9\u4ef7\u683c\u654f\u611f\uff0c\u5bf9\u201c\u5206\u671f\u201d\u3001\u201c\u8865\u5dee\u4ef7\u201d\u7b49\u652f\u4ed8\u65b9\u5f0f\u9ad8\u5ea6\u5173\u6ce8\u3002\n    *   **\u52a8\u673a\u8bc4\u4f30**\uff1a\u529f\u5229\u6027\u3001\u751f\u5b58\u6027\u52a8\u673a\u660e\u786e\uff0c\u4f46\u5b66\u4e60\u97e7\u6027\u4e0e\u957f\u671f\u6295\u5165\u610f\u613f\u5b58\u7591\u3002**\u5bf9\u201c\u8d5a\u94b1\u201d\u7684\u5173\u6ce8\u5ea6\u8fdc\u9ad8\u4e8e\u201c\u5199\u4f5c\u201d\u672c\u8eab**\u3002\n\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d\u4f4e)**\n    *   **\u65f6\u95f4\u8d44\u6e90**\uff1a\u80fd\u5b8c\u6210\u4f53\u9a8c\u8425\u4f5c\u4e1a\u3001\u89c2\u770b\u76f4\u64ad\uff0c\u5177\u5907\u4e00\u5b9a\u53ef\u652f\u914d\u65f6\u95f4\u3002\n    *   **\u7ecf\u6d4e\u8d44\u6e90**\uff1a**\u660e\u786e\u8868\u793a\u201c\u56ca\u4e2d\u7f9e\u6da9\u201d**\uff0c\u5bf9\u8bfe\u7a0b\u4ef7\u683c\u654f\u611f\uff0c\u4e3b\u52a8\u8be2\u95ee\u5206\u671f\u4ed8\u6b3e\u65b9\u6848\u3002\u7ecf\u6d4e\u57fa\u7840\u8584\u5f31\uff0c\u6297\u98ce\u9669\u80fd\u529b\u4f4e\u3002\n    *   **\u8ba4\u77e5\u8d44\u6e90**\uff1a\u5177\u5907\u57fa\u7840\u5b66\u4e60\u4e0e\u64cd\u4f5c\u80fd\u529b\uff08\u80fd\u5b8c\u6210AI\u4ea4\u4e92\u4f5c\u4e1a\uff09\uff0c\u4f46\u5bf9\u5199\u4f5c\u4e13\u4e1a\u6280\u5de7\uff08\u5982\u201c\u5929\u9f99\u516b\u90e8\u201d\u7ed3\u6784\u6cd5\uff09\u638c\u63e1\u5c1a\u6d45\uff0c\u9700\u7cfb\u7edf\u6307\u5bfc\u3002\n    *   **\u793e\u4f1a\u8d44\u6e90**\uff1a\u672a\u63d0\u53ca\uff0c\u4fe1\u606f\u4e0d\u8db3\u3002\n\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u4f4e)**\n    *   **\u670d\u4ece\u6027**\uff1a\u9ad8\u3002\u80fd\u79ef\u6781\u54cd\u5e94\u9500\u552e\u6307\u4ee4\uff0c\u5b8c\u6210\u4f5c\u4e1a\u3001\u56de\u590d\u53e3\u4ee4\u3001\u8fdb\u7fa4\u3002\n    *   **\u4e3b\u52a8\u6027**\uff1a\u4f4e\u3002\u6c9f\u901a\u4ee5\u7b80\u77ed\u56de\u5e94\u4e3a\u4e3b\uff08\u201cOK\u201d\u3001\u201c\u597d\u7684\u201d\u3001\u201c1\u201d\uff09\uff0c\u6781\u5c11\u4e3b\u52a8\u63d0\u95ee\u6216\u8868\u8fbe\u60f3\u6cd5\uff0c\u4ec5\u5728\u6d89\u53ca\u4ef7\u683c\u548c\u652f\u4ed8\u65f6\u4e3b\u52a8\u8be2\u95ee\u3002\n    *   **\u6297\u538b\u6027**\uff1a\u672a\u77e5\u3002\u672a\u7ecf\u5386\u660e\u663e\u632b\u6298\u6d4b\u8bd5\u3002\n    *   **\u51b3\u7b56\u6a21\u5f0f**\uff1a\u8c28\u614e\u3001\u4ef7\u683c\u9a71\u52a8\u3002\u5728\u8868\u73b0\u51fa\u5174\u8da3\u540e\uff0c\u56e0\u4ef7\u683c\u95ee\u9898\u72b9\u8c6b\uff0c\u5e76\u901a\u8fc7\u8be2\u95ee\u201c\u4e0b\u4e00\u6ce2\u62a5\u540d\u201d\u3001\u201c\u8865\u5dee\u4ef7\u201d\u7b49\u65b9\u5f0f\u8bd5\u56fe\u964d\u4f4e\u51b3\u7b56\u95e8\u69db\u548c\u98ce\u9669\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a**\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u4e8e4\u670812\u65e5\u665a\u95f4\u5b8c\u6210\u62a5\u540d\u652f\u4ed8\uff08\u4ef7\u683c\u654f\u611f\uff0c\u6700\u7ec8\u4ee52880\u5143\u4f18\u60e0\u4ef7\u6210\u4ea4\uff09\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u4fe1\u606f\u4e0d\u8db3\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u5bb6\u5ead\u6216\u914d\u5076\u610f\u89c1\uff0c\u9ed8\u8ba4\u89c6\u4e3a\u4e2a\u4eba\u51b3\u7b56\u3002\n*   **\u6b65\u9aa41\uff1a\u9700\u6c42\u5f3a\u5ea6 (B\u7c7b - \u4e2d\u7b49\u9700\u6c42)**\uff1a\u6709\u660e\u786e\u526f\u4e1a\u53d8\u73b0\u9700\u6c42\uff0c\u5e76\u5b8c\u6210\u4e86\u4f53\u9a8c\u8425\u5b66\u4e60\u548c\u4ed8\u8d39\u52a8\u4f5c\uff0c\u4f46\u521d\u59cb\u4ed8\u8d39\u610f\u613f\u56e0\u7ecf\u6d4e\u538b\u529b\u800c\u6447\u6446\uff0c\u975e\u51b2\u52a8\u578b\u8d2d\u4e70\u3002\n*   **\u6b65\u9aa42\uff1a\u652f\u4ed8\u80fd\u529b (C\u7c7b - \u652f\u4ed8\u80fd\u529b\u5f31)**\uff1a**\u5173\u952e\u4fe1\u53f7**\u3002\u660e\u786e\u8868\u8fbe\u201c\u56ca\u4e2d\u7f9e\u6da9\u201d\uff0c\u53cd\u590d\u786e\u8ba4\u4ef7\u683c\u3001\u5206\u671f\u3001\u8865\u5dee\u4ef7\u65b9\u6848\uff0c\u5c5e\u4e8e\u5178\u578b\u7684\u201c\u9884\u7b97\u7d27\u7ef7\u578b\u201d\u7528\u6237\u3002\n*   **\u6b65\u9aa43\uff1a\u884c\u52a8\u529b (B\u7c7b - \u914d\u5408\u5ea6\u9ad8)**\uff1a\u5728\u4f53\u9a8c\u8425\u671f\u95f4\u80fd\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u89c2\u770b\u76f4\u64ad\u3001\u914d\u5408\u9500\u552e\u6d41\u7a0b\uff0c\u884c\u52a8\u670d\u4ece\u6027\u826f\u597d\u3002\n*   **\u6b65\u9aa44\uff1a\u51b3\u7b56\u72b6\u6001 (B\u7c7b - \u5df2\u8f6c\u5316)**\uff1a\u5df2\u5b8c\u6210\u4ed8\u8d39\u8f6c\u5316\uff0c\u8fdb\u5165\u6b63\u5f0f\u73ed\u7fa4\u3002\n*   **\u7efc\u5408\u5224\u5b9a**\uff1a**BCB\u578b\u7528\u6237**\u3002\u5177\u6709\u660e\u786e\u9700\u6c42\u4e14\u884c\u52a8\u914d\u5408\uff0c\u4f46**\u652f\u4ed8\u80fd\u529b\u662f\u663e\u8457\u77ed\u677f**\uff0c\u5c5e\u4e8e\u9ad8\u98ce\u9669\u6613\u6d41\u5931\u4eba\u7fa4\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n**T7 \u751f\u5b58\u594b\u6597\u8005\u578b**\n*   **\u6838\u5fc3\u7279\u5f81**\uff1a\u7ecf\u6d4e\u538b\u529b\u5927\uff0c\u5bfb\u6c42\u4f4e\u95e8\u69db\u3001\u5feb\u56de\u62a5\u7684\u526f\u4e1a\u89e3\u51b3\u65b9\u6848\u3002\u51b3\u7b56\u9ad8\u5ea6\u4f9d\u8d56\u6210\u672c-\u6536\u76ca\u8ba1\u7b97\uff0c\u5bf9\u4ef7\u683c\u6781\u5ea6\u654f\u611f\u3002\n*   **\u5339\u914d\u4f9d\u636e**\uff1a\n    1.  \u76f4\u63a5\u8868\u8fbe\u201c\u56ca\u4e2d\u7f9e\u6da9\u201d\u3002\n    2.  \u5bf9\u8bfe\u7a0b\u4ef7\u683c\u3001\u5206\u671f\u3001\u8865\u5dee\u4ef7\u653f\u7b56\u53cd\u590d\u8be2\u95ee\u3002\n    3.  \u52a8\u673a\u9ad8\u5ea6\u805a\u7126\u201c\u53d8\u73b0\u201d\u3001\u201c\u6295\u7a3f\u8d5a\u94b1\u201d\uff0c\u800c\u975e\u5174\u8da3\u6216\u81ea\u6211\u63d0\u5347\u3002\n    4.  \u5728\u9500\u552e\u4ee5\u201c\u62bd\u5956\u201d\u3001\u201c\u798f\u5229\u201d\u7b49\u7a00\u7f3a\u6027\u8bdd\u672f\u63a8\u52a8\u4e0b\u5b8c\u6210\u652f\u4ed8\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4e2d\u9ad8)\n\u9700\u9010\u9879\u6392\u67e5\u4ee5\u4e0b\u6839\u56e0\uff1a\n1.  **\u6548\u679c\u4e0d\u53ca\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u671f\u5f85\u201c\u4e09\u5468\u6295\u7a3f\u8d5a\u94b1\u201d\uff0c\u82e5\u521d\u671f\u6295\u7a3f\u4e0d\u987a\u6216\u6536\u76ca\u5fae\u8584\uff0c\u6781\u6613\u4ea7\u751f\u201c\u88ab\u9a97\u201d\u611f\u3002\n2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u672c\u8eab\u7ecf\u6d4e\u7d27\u5f20\uff0c\u4efb\u4f55\u989d\u5916\u652f\u51fa\u90fd\u53ef\u80fd\u6210\u4e3a\u9000\u8d39\u5bfc\u706b\u7d22\u3002\n3.  **\u8bfe\u7a0b\u96be\u5ea6**\uff1a\u4e2d\u98ce\u9669\u3002\u7528\u6237\u4f5c\u4e1a\u88ab\u6307\u51fa\u201c\u95ee\u9898\u5f88\u591a\u201d\uff0c\u82e5\u6b63\u5f0f\u8bfe\u5b66\u4e60\u632b\u8d25\u611f\u5f3a\uff0c\u53ef\u80fd\u653e\u5f03\u3002\n4.  **\u65f6\u95f4\u51b2\u7a81**\uff1a\u4f4e\u98ce\u9669\u3002\u76ee\u524d\u65f6\u95f4\u914d\u5408\u5ea6\u5c1a\u53ef\u3002\n5.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a\u4fe1\u606f\u4e0d\u8db3\uff0c\u9700\u540e\u7eed\u89c2\u5bdf\u3002\n6.  **\u7ade\u54c1\u6bd4\u8f83**\uff1a\u4e2d\u98ce\u9669\u3002\u5bf9\u4ef7\u683c\u654f\u611f\u7684\u7528\u6237\uff0c\u540e\u7eed\u82e5\u53d1\u73b0\u66f4\u4f4e\u4ef7\u66ff\u4ee3\u54c1\uff0c\u53ef\u80fd\u540e\u6094\u3002\n7.  **\u670d\u52a1\u4f53\u9a8c**\uff1a\u4e2d\u98ce\u9669\u3002\u5bf9\u201c\u9519\u8fc7\u76f4\u64ad\u798f\u5229\u201d\u6709\u987e\u8651\uff0c\u8868\u660e\u5bf9\u6743\u76ca\u654f\u611f\u3002\u82e5\u73ed\u4e3b\u4efb\u670d\u52a1\u4e0d\u53ca\u65f6\u6216\u627f\u8bfa\u672a\u5151\u73b0\uff0c\u6613\u5f15\u53d1\u6295\u8bc9\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u9500\u552e\u8bdd\u672f**\uff1a\u5b58\u5728**\u8fc7\u5ea6\u627f\u8bfa\u503e\u5411**\uff0c\u5982\u201c\u4e09\u5468\u5c31\u53ef\u4ee5\u5f00\u59cb\u6295\u7a3f\u51c6\u5907\u8d5a\u94b1\u201d\u3001\u201c\u4e00\u7a3f\u591a\u5403\u201d\u7b49\uff0c\u53ef\u80fd\u62d4\u9ad8\u7528\u6237\u9884\u671f\u3002\n*   **\u4ef7\u683c\u4e0e\u652f\u4ed8**\uff1a\u9500\u552e\u5e94\u5bf9\u4e86\u5206\u671f\u3001\u8865\u5dee\u4ef7\u7b49\u8be2\u95ee\uff0c\u6d41\u7a0b\u5408\u89c4\u3002\u4f46\u5229\u7528\u201c\u62bd\u5956\u201d\u3001\u201c\u9650\u65f6\u4f18\u60e0\u201d\u4fc3\u6210\u652f\u4ed8\uff0c\u662f\u9488\u5bf9\u4ef7\u683c\u654f\u611f\u7528\u6237\u7684\u6807\u51c6\u7b56\u7565\u3002\n*   **\u98ce\u9669\u544a\u77e5**\uff1a\u672a\u89c1\u5bf9\u5b66\u4e60\u96be\u5ea6\u3001\u53d8\u73b0\u4e0d\u786e\u5b9a\u6027\u3001\u5468\u671f\u7b49\u98ce\u9669\u7684\u5145\u5206\u63d0\u793a\u3002**\u5b58\u5728\u5408\u89c4\u9690\u60a3**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6838\u5fc3\u7b56\u7565**\uff1a**\u964d\u4f4e\u9884\u671f\uff0c\u5f3a\u5316\u8fc7\u7a0b\u966a\u4f34\uff0c\u805a\u7126\u5fae\u5c0f\u6b63\u53cd\u9988**\uff0c\u9632\u6b62\u56e0\u201c\u8d5a\u94b1\u201d\u9884\u671f\u843d\u7a7a\u800c\u65e9\u671f\u6d41\u5931\u3002\n*   **\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u7834\u51b0\u671f\uff08\u5f00\u8425\u4e00\u5468\uff09**\uff1a\u91cd\u70b9\u6c9f\u901a\uff0c\u4e86\u89e3\u5176\u5177\u4f53\u7ecf\u6d4e\u72b6\u51b5\u4e0e\u6838\u5fc3\u76ee\u6807\uff0c\u9002\u5f53\u7ba1\u7406\u9884\u671f\uff0c\u5f3a\u8c03\u201c\u6280\u80fd\u4e60\u5f97\u201d\u5148\u4e8e\u201c\u5feb\u901f\u53d8\u73b0\u201d\u3002\n    2.  **\u5b66\u4e60\u671f**\uff1a\n        *   **\u9ad8\u9891\u53cd\u9988**\uff1a\u5bf9\u5176\u4f5c\u4e1a\u7ed9\u4e88\u7ec6\u81f4\u3001\u5177\u4f53\u7684\u9f13\u52b1\uff0c\u54ea\u6015\u662f\u5c0f\u8fdb\u6b65\u3002\n        *   **\u964d\u4f4e\u95e8\u69db**\uff1a\u5f15\u5bfc\u5176\u4ece\u201c\u7cbe\u4fee\u5546\u5355\u201d\u7b49\u4f4e\u95e8\u69db\u3001\u6709\u6307\u5bfc\u7684\u53d8\u73b0\u5c1d\u8bd5\u5f00\u59cb\uff0c\u83b7\u53d6\u7b2c\u4e00\u7b14\u5fae\u5c0f\u6536\u5165\uff08\u54ea\u6015\u51e0\u5341\u5143\uff09\uff0c\u5efa\u7acb\u4fe1\u5fc3\u3002\n        *   **\u793e\u7fa4\u6fc0\u52b1**\uff1a\u591a\u63a8\u9001\u201c\u666e\u901a\u5b66\u5458\u901a\u8fc7\u575a\u6301\u83b7\u5f97\u7a3f\u8d39\u201d\u7684\u6848\u4f8b\uff0c\u800c\u975e\u201c\u66b4\u5bcc\u201d\u795e\u8bdd\u3002\n    3.  **\u98ce\u9669\u76d1\u63a7**\uff1a\u5bc6\u5207\u5173\u6ce8\u5176\u4f5c\u4e1a\u63d0\u4ea4\u60c5\u51b5\u3001\u7fa4\u5185\u4e92\u52a8\u9891\u7387\u3002\u4e00\u65e6\u51fa\u73b0\u61c8\u6020\u6216\u8d1f\u9762\u8a00\u8bba\uff0c\u9700\u7acb\u5373\u4e00\u5bf9\u4e00\u4ecb\u5165\uff0c\u4e86\u89e3\u5177\u4f53\u56f0\u96be\uff08\u662f\u5b66\u4e0d\u4f1a\uff1f\u8fd8\u662f\u6ca1\u65f6\u95f4\uff1f\u8fd8\u662f\u89c9\u5f97\u6ca1\u7528\uff1f\uff09\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**\uff1a\n    *   **\u4e3b\u7ebf**\uff1a\u5f15\u5bfc\u5176\u5b8c\u6210**\u57fa\u7840\u7248**\u8bfe\u7a0b\u5b66\u4e60\uff0c\u638c\u63e1\u6295\u7a3f\u57fa\u672c\u6d41\u7a0b\u3002\n    *   **\u589e\u503c\u670d\u52a1**\uff1a\u8c28\u614e\u63a8\u8350\u65d7\u8230\u7248\u5347\u7ea7\uff0c\u9664\u975e\u5176\u5df2\u901a\u8fc7\u57fa\u7840\u5b66\u4e60\u83b7\u5f97\u7a33\u5b9a\u5c0f\u989d\u6536\u76ca\uff0c\u4e14\u6709\u660e\u786e\u8fdb\u9636\u9700\u6c42\u3002**\u5207\u5fcc\u5728\u7528\u6237\u65e0\u6210\u679c\u65f6\u5f3a\u63a8\u9ad8\u9636\u8bfe**\u3002\n    *   **\u4e50\u9ad8\u7ebf\u6302\u8f7d**\uff1a\u53ef\u5173\u8054**\u201c\u77ed\u7bc7\u6545\u4e8b\u6295\u7a3f\u5b9e\u6218\u8425\u201d**\u6216**\u201c\u5546\u5355\u63a5\u5355\u966a\u8dd1\u7fa4\u201d**\u7b49\u8f7b\u91cf\u7ea7\u3001\u7ed3\u679c\u5bfc\u5411\u7684\u540e\u7eed\u670d\u52a1\uff0c\u800c\u975e\u9ad8\u4ef7\u957f\u671f\u8bfe\u7a0b\u3002\n\n{\"core_type\": \"T7 \u751f\u5b58\u594b\u6597\u8005\u578b\", \"risk_level\": \"\u4e2d\u9ad8\", \"refund_risk\": \"\u4e2d\u9ad8\", \"maslow_need\": \"\u751f\u5b58/\u5b89\u5168\", \"target_product_line\": \"\u77ed\u7bc7\u6545\u4e8b\u6295\u7a3f\u5b9e\u6218\u8425/\u5546\u5355\u63a5\u5355\u966a\u8dd1\u7fa4\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}";
