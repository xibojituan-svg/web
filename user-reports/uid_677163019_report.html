    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4ee5\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\u7684\u8eab\u4efd\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677163019\u7684\u7528\u6237\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677163019 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u68a6\u5883\uff08\u674e\u4e50\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u5f55\u64ad\u7cbe\u82f1\u8bfe\uff083980\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u5145\u88d5\uff08\u76f4\u63a5\u652f\u4ed8\uff0c\u65e0\u5206\u671f/\u501f\u8d37\u4fe1\u53f7\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1\uff08\u9700\u63a5\u9001\u5b69\u5b50\uff0c\u767d\u5929\u53ef\u80fd\u56e0\u5b66\u6821\u4e8b\u52a1\u4e2d\u65ad\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u7f3a\u5931\uff08\u672a\u63d0\u53ca\uff0c\u9700\u540e\u7eed\u6838\u67e5\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | \u9971\u6ee1\uff08\u6709\u660e\u786e\u5b66\u4e60\u884c\u4e3a\u3001\u4e92\u52a8\u53cd\u9988\u548c\u652f\u4ed8\u52a8\u4f5c\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06**\u9ad8** (7-8\u5206)\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u81ea\u6211\u5b9e\u73b0\u800c\u6765\uff0c\u5173\u6ce8\u6280\u80fd\u6210\u957f\uff0c\u6709\u660e\u786e\u7684\u804c\u4e1a\u53d1\u5c55\u613f\u666f\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u60f3\u5f80\u5168\u804c\u53d1\u5c55\uff0c\u77e5\u8bc6\u4ed8\u8d39\u90a3\u662f\u5fc5\u987b\u7684\uff0c\u76f8\u5f53\u8ba4\u53ef\u201d\n  > \u201c\u6536\u5165\u662f\u4e00\u65b9\u9762\uff0c\u4f53\u73b0\u81ea\u5df1\u7684\u4ef7\u503c\u4e5f\u633a\u6ee1\u8db3\u7684[\u5472\u7259]\u201d\n  > \u201c\u5e72\u8d27\u6ee1\u6ee1\uff0c\u542c\u7684\u633a\u6709\u6fc0\u60c5\uff0c\u597d\u50cf\u611f\u89c9\u4ee5\u540e\u6709\u6761\u4e0d\u9519\u7684\u51fa\u8def\u5462\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1**\u4e2d** (5-6\u5206)\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u76f4\u63a5\u652f\u4ed83980\u5143\u8bfe\u7a0b\uff0c\u65e0\u7ecf\u6d4e\u538b\u529b\u4fe1\u53f7\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u6709\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b\uff08\u4e3b\u52a8\u5c1d\u8bd5\u56db\u79cd\u65c1\u767d\uff09\uff0c\u4f46\u65f6\u95f4\u53d7\u5bb6\u5ead\u4e8b\u52a1\uff08\u63a5\u9001\u5b69\u5b50\u3001\u5b66\u6821\u6d3b\u52a8\uff09\u5f71\u54cd\uff0c\u5448\u73b0\u788e\u7247\u5316\u7279\u5f81\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u672a\u63d0\u53ca\uff0c\u9700\u540e\u7eed\u6838\u67e5\uff0c\u5b58\u5728\u6f5c\u5728\u98ce\u9669\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06**\u9ad8** (7-8\u5206)\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\uff0c\u79ef\u6781\u5bfb\u6c42\u53cd\u9988\uff0c\u9047\u4e8b\uff08\u5982\u9519\u8fc7\u76f4\u64ad\uff09\u4e3b\u52a8\u6c9f\u901a\uff0c\u65e0\u8d1f\u9762\u60c5\u7eea\u5ba3\u6cc4\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u4eca\u5929\u5728\u5b69\u5b50\u5b66\u6821\u6709\u4e8b\uff0c\u4e0d\u5f97\u5df2\u4e0d\u80fd\u7ee7\u7eed\u542c\u76f4\u64ad\u4e86\uff0c\u540e\u9762\u6709\u56de\u653e\u5417\u201d\n  > \u201c\u5e08\u59d0\u6211\u56db\u4e2a\u90fd\u5f55\u4e86\u4e00\u904d\uff0c\u53d1\u7ed9\u4f60\u542c\u542c\uff0c\u6211\u5148\u9009\u4e00\u4e2a\u53d1\u7fa4\u91cc\u201d\n  > \u201c\u65e9\u4e0a\u55d3\u5b50\u6709\u4e9b\u7d27\uff0c\u4e0b\u5348\u6765\u5f55\u8bd5\u8bd5\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42** \u4e0e **\u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u201c\u88ab\u8ba4\u53ef\u201d\u548c\u201c\u5b9e\u73b0\u4e2a\u4eba\u4ef7\u503c\u201d\u6709\u5f3a\u70c8\u6e34\u671b\u3002\u5979\u4e0d\u4ec5\u5e0c\u671b\u83b7\u5f97\u6536\u5165\uff0c\u66f4\u5e0c\u671b\u8fd9\u4efd\u5de5\u4f5c\u80fd\u5e26\u6765\u793e\u4f1a\u8ba4\u540c\u611f\u548c\u81ea\u6211\u6ee1\u8db3\u611f\uff08\u201c\u4f53\u73b0\u81ea\u5df1\u7684\u4ef7\u503c\u4e5f\u633a\u6ee1\u8db3\u7684\u201d\uff09\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u8d4b\u80fd\uff0c\u4ee5\u53ca\u5c06\u5979\u89c6\u4e3a\u201c\u6f5c\u529b\u4f19\u4f34\u201d\u7684\u5c0a\u91cd\u611f**\u3002\u9500\u552e\u201c\u5e08\u59d0\u201d\u7684\u8eab\u4efd\u548c\u201c\u672a\u6765\u53ef\u4ee5\u505a\u540c\u4e8b\u201d\u7684\u671f\u8bb8\uff0c\u6070\u597d\u6ee1\u8db3\u4e86\u5979\u7684\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 **B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u52a8\u673a\u9ad8\u3001\u5f39\u6027\u9ad8\u3001\u8d44\u6e90\u4e2d\uff0c\u6267\u884c\u529b\u5f3a\uff0c\u9ed8\u9ed8\u8015\u8018) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u96f6\u4e92\u52a8\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u4fe1\u606f\u7f3a\u5931\uff0c\u9700\u6838\u67e5\u5bb6\u5ead\u662f\u5426\u652f\u6301\u5176\u6295\u5165\u65f6\u95f4\u5b66\u4e60\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u4e3b\u8981\u98ce\u9669\u70b9\u3002\u56e0\u63a5\u9001\u5b69\u5b50\u3001\u5b66\u6821\u6d3b\u52a8\u7b49\u5bb6\u5ead\u4e8b\u52a1\uff0c\u53ef\u80fd\u5bfc\u81f4\u5b66\u4e60\u65f6\u95f4\u88ab\u6324\u538b\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\u201d\u7684\u7126\u8651\u548c\u81ea\u8d23\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u5c1d\u8bd5\u5e76\u5bfb\u6c42\u53cd\u9988\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u632b\u6298\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4f4e** | \u52a8\u673a\u7eaf\u5ea6\u9ad8\uff0c\u5173\u6ce8\u957f\u671f\u6210\u957f\u548c\u81ea\u6211\u5b9e\u73b0\uff0c\u5bf9\u201c\u5feb\u901f\u53d8\u73b0\u201d\u7684\u6267\u5ff5\u8f83\u4f4e\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\u3002\u5f53\u6b63\u5f0f\u8bfe\u7a0b\u7684\u9ad8\u5f3a\u5ea6\u5b66\u4e60\u4efb\u52a1\u4e0e\u5bb6\u5ead\u7410\u4e8b\u4ea7\u751f\u4e25\u91cd\u51b2\u7a81\u65f6\uff0c\u53ef\u80fd\u56e0\u201c\u65f6\u95f4\u7ba1\u7406\u5931\u8d25\u201d\u800c\u4ea7\u751f\u6301\u7eed\u7126\u8651\uff0c\u6700\u7ec8\u5bfc\u81f4\u653e\u5f03\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u5979\u8bf4......\u201d**\n> \u201c\u5e08\u59d0\u770b\u5230\u4f60\u7279\u522b\u6709\u60f3\u6cd5\uff0c\u4e5f\u5f88\u6709\u884c\u52a8\u529b\uff0c\u56db\u79cd\u65c1\u767d\u90fd\u8bd5\u4e86\u4e00\u904d\uff0c\u8fd9\u79cd\u94bb\u7814\u52b2\u513f\u662f\u6210\u4e3a\u597d\u4e3b\u64ad\u7684\u5173\u952e\u3002\u54b1\u4eec\u5f88\u591a\u4f18\u79c0\u7684\u5e08\u59d0\u4e5f\u662f\u4ece\u517c\u987e\u5bb6\u5ead\u548c\u5b69\u5b50\u5f00\u59cb\u7684\uff0c\u522b\u62c5\u5fc3\u65f6\u95f4\u788e\uff0c\u54b1\u4eec\u4e00\u8d77\u89c4\u5212\uff0c\u628a\u788e\u7247\u65f6\u95f4\u9ad8\u6548\u5229\u7528\u8d77\u6765\uff0c\u7a33\u7a33\u8fdb\u6b65\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** (\u4ea7\u54c1\u7ebfA)\u3002\u5339\u914d\u5176\u9ad8\u52a8\u673a\u548c\u8ffd\u6c42\u81ea\u6211\u5b9e\u73b0\u7684\u9700\u6c42\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\u7684\u7279\u70b9\uff0c\u8865\u5145 **\u3010\u65f6\u95f4\u89c4\u5212\u8f85\u52a9\u5305\u3011**\uff08\u4f8b\u5982\uff1a\u63d0\u4f9b\u53ef\u62c6\u89e3\u7684\u5fae\u4efb\u52a1\u6e05\u5355\u3001\u5229\u7528\u901a\u52e4/\u5bb6\u52a1\u95f4\u9699\u7684\u201c5\u5206\u949f\u8ddf\u7ec3\u201d\u97f3\u9891\uff09\u3002**\u4e25\u7981**\u8fc7\u65e9\u4ea4\u53c9\u63a8\u9500\u9ad8\u9636\u8bfe\u7a0b\uff0c\u907f\u514d\u9020\u6210\u77e5\u8bc6\u8fc7\u8f7d\u538b\u529b\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u6700\u540e\u540d\u989d\u201d\u3001\u201c\u5012\u8ba1\u65f6\u201d\u7b49\u8bdd\u672f\u5236\u9020\u7126\u8651\uff1b\u5ffd\u89c6\u5176\u5bb6\u5ead\u65f6\u95f4\u9650\u5236\uff0c\u5e03\u7f6e\u65e0\u6cd5\u5728\u788e\u7247\u65f6\u95f4\u5b8c\u6210\u7684\u957f\u4efb\u52a1\uff1b\u5728\u5979\u56e0\u5bb6\u5ead\u4e8b\u52a1\u803d\u8bef\u5b66\u4e60\u65f6\uff0c\u8fdb\u884c\u201c\u4e0d\u52aa\u529b\u201d\u7684\u6307\u8d23\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u524d\u671f\u4e25\u7981\u5347\u5355**\u3002\u5f85\u5176\u5b8c\u5168\u9002\u5e94\u5b66\u4e60\u8282\u594f\uff0c\u5e76\u4ea7\u51fa1-2\u4e2a\u6ee1\u610f\u4f5c\u54c1\u540e\uff0c\u53ef\u57fa\u4e8e\u5176\u6280\u672f\u7cbe\u8fdb\u9700\u6c42\uff0c\u81ea\u7136\u63a8\u4ecb\u9ad8\u9636\u6280\u672f\u8bfe\uff08B\u6a21\u5757\uff09\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u60f3\u5f80\u5168\u804c\u53d1\u5c55\uff0c\u77e5\u8bc6\u4ed8\u8d39\u90a3\u662f\u5fc5\u987b\u7684\uff0c\u76f8\u5f53\u8ba4\u53ef\u3002\u6536\u5165\u662f\u4e00\u65b9\u9762\uff0c\u4f53\u73b0\u81ea\u5df1\u7684\u4ef7\u503c\u4e5f\u633a\u6ee1\u8db3\u7684[\u5472\u7259]\u201d **(\u9ad8\u52a8\u673a\u7eaf\u5ea6\uff0c\u81ea\u6211\u5b9e\u73b0\u9700\u6c42)**\n2. > \u201c\u5e08\u59d0\u6211\u56db\u4e2a\u90fd\u5f55\u4e86\u4e00\u904d\uff0c\u53d1\u7ed9\u4f60\u542c\u542c\uff0c\u6211\u5148\u9009\u4e00\u4e2a\u53d1\u7fa4\u91cc\u201d **(\u9ad8\u6267\u884c\u529b\uff0c\u4e3b\u52a8\u63a2\u7d22)**\n3. > \u201c\u4eca\u5929\u5728\u5b69\u5b50\u5b66\u6821\u6709\u4e8b\uff0c\u4e0d\u5f97\u5df2\u4e0d\u80fd\u7ee7\u7eed\u542c\u76f4\u64ad\u4e86\uff0c\u540e\u9762\u6709\u56de\u653e\u5417\u201d **(\u7406\u6027\u6c9f\u901a\uff0c\u9ad8\u5fc3\u7406\u5f39\u6027\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u7075\u6d3b\u7684\u65f6\u95f4\u7ba1\u7406\u65b9\u6848\u4e0e\u6301\u7eed\u7684\u4e13\u4e1a\u80af\u5b9a\uff0c\u4e25\u9632\u56e0\u5bb6\u5ead\u4e8b\u52a1\u6324\u538b\u5b66\u4e60\u65f6\u95f4\u5bfc\u81f4\u7684\u201c\u8ddf\u4e0d\u4e0a\u201d\u7126\u8651\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\uff08\u4ea7\u54c1\u7ebfA\uff09\"}\n```";
