    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u4e2d\u9ad8**\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b\uff08\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u89c2\u770b\u76f4\u64ad\u3001\u4e3b\u52a8\u63d0\u95ee\uff09\uff0c\u5bf9\u6709\u58f0\u6f14\u64ad/AI\u77ed\u89c6\u9891\u6709\u63a2\u7d22\u5174\u8da3\u3002\u4f46\u52a8\u673a\u4e2d**\u53d8\u73b0\u9884\u671f**\u6210\u5206\u663e\u8457\uff08\u5173\u6ce8\u201c\u517c\u804c\u201d\u3001\u201c\u63a5\u5355\u201d\u3001\u201c\u5de5\u79cd\u201d\u3001\u201c\u4f18\u60e0\u5238\u201d\uff09\uff0c\u5b58\u5728\u5c06\u6280\u80fd\u57f9\u8bad\u4e0e\u5feb\u901f\u53d8\u73b0\u76f4\u63a5\u6302\u94a9\u7684\u503e\u5411\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u4e2d\u7b49**\u3002\u7528\u6237\u4e3a\u5728\u804c\u72b6\u6001\uff08\u201c\u6211\u665a\u4e0a\u5f9710\u70b9\u624d\u4e0b\u73ed\u201d\uff09\uff0c\u8868\u660e\u6709\u57fa\u7840\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u548c\u53ef\u80fd\u7684\u7ecf\u6d4e\u6765\u6e90\u3002\u4f46\u65f6\u95f4\u8d44\u6e90\u7d27\u5f20\uff0c\u4f9d\u8d56\u5f55\u64ad\u56de\u653e\u3002\u672a\u63d0\u53ca\u8bbe\u5907\u3001\u5bb6\u5ead\u652f\u6301\u7b49\u5177\u4f53\u4fe1\u606f\uff0c**\u8d44\u6e90\u8be6\u60c5\u4e0d\u8db3**\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u4e2d\u9ad8**\u3002\u7528\u6237\u4e92\u52a8\u79ef\u6781\u3001\u914d\u5408\u5ea6\u9ad8\uff08\u201c\u597d\u7684\u201d\u3001\u201c\u8c22\u8c22\u8001\u5e08\u201d\u3001\u201c\u8f9b\u82e6\u8001\u5e08\u5566\u201d\uff09\uff0c\u80fd\u4e3b\u52a8\u5b8c\u6210\u9500\u552e\u5e03\u7f6e\u7684\u6253\u5361\u548c\u4f5c\u4e1a\u4efb\u52a1\uff0c\u5bf9\u6b63\u5411\u53cd\u9988\uff08\u201c\u606d\u559c\u901a\u5173\u201d\u3001\u201c\u770b\u597d\u4f60\u201d\uff09\u6709\u826f\u597d\u56de\u5e94\u3002\u9762\u5bf9\u65f6\u95f4\u51b2\u7a81\uff08\u65e0\u6cd5\u770b\u76f4\u64ad\uff09\u80fd\u4e3b\u52a8\u6c9f\u901a\u5e76\u63a5\u53d7\u66ff\u4ee3\u65b9\u6848\uff08\u770b\u56de\u653e\uff09\uff0c\u9002\u5e94\u6027\u8f83\u597d\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u4e8e4\u67087\u65e5\u665a\u4e3b\u52a8\u8be2\u95ee\u4f18\u60e0\u5238\u5e76\u62a5\u540d3\u4e2a\u6708\u8bfe\u7a0b\uff08\u201c\u8001\u5e08\uff0c\u548b\u6709\u4f18\u60e0\u5377\u5417\uff1f\u60f3\u62a53\u4e2a\u6708\u7684\u201d\uff09\uff0c\u5e76\u4e8e4\u67088\u65e5\u786e\u8ba4\u201c\u62a5\u4e86\uff0c\u5e08\u59d0\u201d\u3002\u652f\u4ed8\u884c\u4e3a\u5df2\u53d1\u751f\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u6216\u7b2c\u4e09\u65b9\u51b3\u7b56\u8005\u4fe1\u606f\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u4e3a\u72ec\u7acb\u51b3\u7b56\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u7eaf\u5ea6 (M)**: **B\u7ea7 (\u529f\u5229\u9a71\u52a8\u578b)**\u3002\u7528\u6237\u884c\u4e3a\u4e3b\u7ebf\u6e05\u6670\uff1a\u53c2\u4e0e\u4f53\u9a8c\u8bfe -> \u5b8c\u6210\u4f5c\u4e1a\u83b7\u53d6\u901a\u5173/\u8bd5\u97f3\u8d44\u683c -> \u5173\u6ce8\u517c\u804c\u5de5\u79cd\u4e0e\u53d8\u73b0\u8def\u5f84 -> \u8be2\u95ee\u4f18\u60e0\u5e76\u652f\u4ed8\u3002\u6838\u5fc3\u9a71\u52a8\u529b\u4e3a**\u804c\u4e1a\u63a2\u7d22\u4e0e\u517c\u804c\u53d8\u73b0**\uff0c\u800c\u975e\u7eaf\u7cb9\u7684\u6280\u80fd\u63d0\u5347\u6216\u5174\u8da3\u53d1\u5c55\u3002\n*   **\u6b65\u9aa42 - \u8d44\u6e90\u5e95\u5ea7 (R)**: **B\u7ea7 (\u5e38\u89c4\u8d44\u6e90)**\u3002\u5728\u804c\u8eab\u4efd\uff0c\u80fd\u6324\u51fa\u65f6\u95f4\u53c2\u4e0e\u5b66\u4e60\uff0c\u4f46\u53d7\u5de5\u4f5c\u65f6\u95f4\u9650\u5236\u3002\u5bf9\u5b66\u4e60\u6295\u5165\uff08\u65f6\u95f4\u3001\u7cbe\u529b\uff09\u6709\u57fa\u672c\u4fdd\u969c\uff0c\u4f46\u65e0\u7279\u6b8a\u8d44\u6e90\u4f18\u52bf\uff08\u5982\u5927\u91cf\u7a7a\u95f2\u65f6\u95f4\u3001\u4e13\u4e1a\u8bbe\u5907\u3001\u884c\u4e1a\u4eba\u8109\uff09\u3002\n*   **\u6b65\u9aa43 - \u5fc3\u7406\u5f39\u6027 (E)**: **A\u7ea7 (\u9ad8\u914d\u5408\u9ad8\u5f39\u6027)**\u3002\u7528\u6237\u5168\u7a0b\u8868\u73b0\u51fa\u9ad8\u914d\u5408\u5ea6\u3001\u4f4e\u5bf9\u6297\u6027\u3002\u5bf9\u9500\u552e\u5f15\u5bfc\u7684\u201c\u5feb\u4eba\u4e00\u6b65\u201d\u3001\u201c\u8fdb\u5267\u7ec4\u201d\u3001\u201c\u63a5\u5355\u201d\u7b49\u8bdd\u672f\u63a5\u53d7\u5ea6\u9ad8\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u79ef\u6781\u53cd\u9988\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**: **B-A-B\u578b\u7528\u6237**\u3002\u6838\u5fc3\u7279\u5f81\u4e3a**\u529f\u5229\u9a71\u52a8\u3001\u8d44\u6e90\u5e38\u89c4\u3001\u914d\u5408\u5ea6\u9ad8**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b: T4 \u52a1\u5b9e\u53d8\u73b0\u63a2\u7d22\u8005**\n    *   **\u7279\u5f81\u543b\u5408**: \u76ee\u6807\u660e\u786e\uff08\u517c\u804c/\u53d8\u73b0\uff09\uff0c\u884c\u52a8\u529b\u5f3a\uff08\u6309\u65f6\u5b8c\u6210\u5404\u9879\u4efb\u52a1\uff09\uff0c\u5bf9\u201c\u673a\u4f1a\u201d\u3001\u201c\u8d44\u6e90\u201d\u3001\u201c\u63a5\u5355\u201d\u7b49\u5173\u952e\u8bcd\u654f\u611f\u3002\u914d\u5408\u9500\u552e\u8282\u594f\uff0c\u4f46\u5bf9\u5b66\u4e60\u8fc7\u7a0b\u7684\u957f\u671f\u6027\u548c\u590d\u6742\u6027\u53ef\u80fd\u8ba4\u77e5\u4e0d\u8db3\u3002\n    *   **\u5173\u952e\u4fe1\u53f7**: \u4e3b\u52a8\u8be2\u95ee\u4f18\u60e0\u5e76\u652f\u4ed8\uff1b\u53cd\u590d\u5173\u6ce8\u201c\u517c\u804c\u5de5\u79cd\u201d\u3001\u201c\u8bd5\u97f3\u8ba2\u5355\u201d\u3001\u201c\u8fdb\u5267\u7ec4\u201d\uff1b\u5728\u9500\u552e\u5f3a\u8c03\u201c\u5feb\u4eba\u4e00\u6b65\u201d\u548c\u201c\u53d8\u73b0\u201d\u540e\u5b8c\u6210\u8f6c\u5316\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u98ce\u9669\u7b49\u7ea7: \u4e2d)\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u9884\u671f\u7ba1\u7406\u5931\u8861 (\u9ad8\u98ce\u9669)**: **\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u9500\u552e\u8fc7\u5ea6\u5f3a\u8c03\u201c\u8fdb\u5267\u7ec4\u201d\u3001\u201c\u8bd5\u97f3\u8ba2\u5355(20-150/h)\u201d\u3001\u201c\u5feb\u4eba\u4e00\u6b65\u201d\uff0c\u53ef\u80fd\u5851\u9020\u4e86\u201c\u77ed\u671f\u5b66\u4e60=\u5feb\u901f\u63a5\u5355\u201d\u7684**\u4e0d\u5207\u5b9e\u9645\u9884\u671f**\u3002\u7528\u6237\u652f\u4ed8\u52a8\u673a\u4e0e\u6b64\u5f3a\u76f8\u5173\u3002\n    2.  **\u6548\u679c\u611f\u77e5\u843d\u5dee (\u4e2d\u98ce\u9669)**: \u7528\u6237\u5df2\u5b8c\u6210\u521d\u6b65\u4f5c\u4e1a\u5e76\u83b7\u5f97\u79ef\u6781\u53cd\u9988\uff0c\u77ed\u671f\u6548\u679c\u611f\u77e5\u5c1a\u53ef\u3002\u4f46\u957f\u671f\u6280\u80fd\u63d0\u5347\u4e0e\u53d8\u73b0\u901f\u5ea6\u82e5\u4e0d\u53ca\u9884\u671f\uff0c\u6613\u4ea7\u751f\u843d\u5dee\u3002\n    3.  **\u65f6\u95f4\u7cbe\u529b\u51b2\u7a81 (\u4e2d\u98ce\u9669)**: \u7528\u6237\u5de5\u4f5c\u81f3\u665a10\u70b9\uff0c\u65f6\u95f4\u7d27\u5f20\u3002\u82e5\u6b63\u5f0f\u8bfe\u4e1a\u91cf\u4e0e\u517c\u804c\u5c1d\u8bd5\u5360\u7528\u66f4\u591a\u65f6\u95f4\uff0c\u53ef\u80fd\u56e0\u7cbe\u529b\u4e0d\u6d4e\u4ea7\u751f\u538b\u529b\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9 (\u4fe1\u606f\u4e0d\u8db3)**: \u672a\u63d0\u53ca\uff0c\u98ce\u9669\u6682\u65e0\u6cd5\u8bc4\u4f30\u3002\n    5.  **\u7ecf\u6d4e\u538b\u529b (\u4f4e\u98ce\u9669)**: \u5df2\u652f\u4ed83\u4e2a\u6708\u8bfe\u7a0b\uff0c\u672a\u8868\u73b0\u51fa\u652f\u4ed8\u56f0\u96be\u6216\u4ef7\u683c\u654f\u611f\uff08\u4ec5\u8be2\u95ee\u4f18\u60e0\u5238\uff09\u3002\n    6.  **\u4ea7\u54c1\u670d\u52a1\u7455\u75b5 (\u4f4e\u98ce\u9669)**: \u8bb0\u5f55\u4e2d\u672a\u51fa\u73b0\u670d\u52a1\u6295\u8bc9\u6216\u4ea7\u54c1\u95ee\u9898\u3002\n    7.  **\u7ade\u54c1\u66ff\u4ee3/\u51b2\u52a8\u540e\u6094 (\u4f4e\u98ce\u9669)**: \u7528\u6237\u884c\u4e3a\u8def\u5f84\u8fde\u8d2f\uff0c\u672a\u8868\u73b0\u51fa\u72b9\u8c6b\u6216\u6bd4\u8f83\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5b58\u5728\u98ce\u9669\u70b9**:\n    *   **\u8fc7\u5ea6\u627f\u8bfa\u503e\u5411**: \u9500\u552e\u591a\u6b21\u4f7f\u7528\u201c\u76f4\u63a5\u8fdb\u5267\u7ec4\u201d\u3001\u201c\u6709\u5f88\u5927\u673a\u4f1a\u201d\u3001\u201c\u8ba9\u4f60\u58f0\u97f3\u5347\u503c\u201d\u7b49\u8868\u8ff0\uff0c**\u53ef\u80fd\u6784\u6210\u5bf9\u5b66\u4e60\u6210\u679c\u548c\u5c31\u4e1a\u673a\u4f1a\u7684\u6a21\u7cca\u627f\u8bfa**\uff0c\u9700\u8b66\u60d5\u3002\n    *   **\u5236\u9020\u7d27\u8feb\u611f**: \u201c\u5feb\u4eba\u4e00\u6b65\u201d\u3001\u201c\u6700\u540e\u4e00\u573a\u76f4\u64ad\u201d\u3001\u201c\u62a2\u52a9\u5b66\u91d1\u4f18\u60e0\u5238\u201d\u7b49\u8bdd\u672f\u9891\u7e41\uff0c\u5c5e\u4e8e\u5e38\u89c4\u9500\u552e\u7b56\u7565\uff0c\u4f46\u9700\u6ce8\u610f\u5c3a\u5ea6\uff0c\u907f\u514d\u9020\u6210\u538b\u8feb\u5f0f\u8d2d\u4e70\u3002\n    *   **\u4fe1\u606f\u6838\u67e5**: \u672a\u53d1\u73b0\u4f2a\u9020\u8d44\u8d28\u3001\u8d2c\u4f4e\u7ade\u54c1\u7b49\u4e25\u91cd\u8fdd\u89c4\u3002\u4f46\u5173\u4e8e\u201c\u5b98\u65b9\u8bd5\u97f3\u8ba2\u5355\u201d\u3001\u201c\u5e73\u53f0\u5408\u4f5c\u6e20\u9053\u201d\u7684\u5177\u4f53\u6027\u548c\u771f\u5b9e\u6027\uff0c\u5728\u8bb0\u5f55\u4e2d\u65e0\u6cd5\u6838\u5b9e\u3002\n*   **\u603b\u4f53\u8bc4\u4f30**: \u9500\u552e\u6d41\u7a0b\u5b58\u5728**\u5938\u5927\u6536\u76ca\u548c\u5236\u9020\u7d27\u8feb\u611f\u7684\u5e38\u89c1\u8bdd\u672f**\uff0c\u5904\u4e8e\u5408\u89c4\u7070\u8272\u5730\u5e26\uff0c\u662f\u540e\u7eed\u5ba2\u8bc9\u7684\u4e3b\u8981\u6f5c\u5728\u8bf1\u56e0\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**: **\u5339\u914d**\u3002\u7528\u6237\u76ee\u6807\uff08\u517c\u804c\u53d8\u73b0\uff09\u4e0e\u4ea7\u54c1\u5356\u70b9\uff08\u6280\u80fd\u57f9\u8bad+\u63a5\u5355\u8d44\u6e90\uff09\u8868\u9762\u5951\u5408\u3002\u4f46\u9700\u8b66\u60d5**\u6df1\u5c42\u9519\u914d\u98ce\u9669**\uff0c\u5373\u7528\u6237\u671f\u671b\u7684\u201c\u901f\u6210\u53d8\u73b0\u201d\u4e0e\u6280\u80fd\u5b66\u4e60\u7684\u201c\u957f\u671f\u79ef\u7d2f\u201d\u672c\u8d28\u4e4b\u95f4\u7684\u77db\u76fe\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **\u9996\u5468\u91cd\u70b9\u6821\u6b63\u53d8\u73b0\u9884\u671f\uff0c\u5efa\u7acb\u5408\u7406\u6210\u957f\u8def\u5f84**\n*   **\u5177\u4f53\u884c\u52a8\u5efa\u8bae**:\n    1.  **\u9884\u671f\u7ba1\u7406**: \u5728\u9996\u6b21\u6df1\u5ea6\u6c9f\u901a\u4e2d\uff0c**\u660e\u786e\u6f84\u6e05**\u201c\u5b66\u4e60-\u7ec3\u4e60-\u63a5\u5355\u201d\u7684\u6807\u51c6\u5468\u671f\uff0c\u7528\u8fc7\u5f80\u5b66\u5458\u7684**\u771f\u5b9e\u6210\u957f\u6848\u4f8b**\uff08\u800c\u975e\u4ec5\u6210\u529f\u6848\u4f8b\uff09\u66ff\u4ee3\u9500\u552e\u9636\u6bb5\u7684\u201c\u5feb\u4eba\u4e00\u6b65\u201d\u8bdd\u672f\u3002\u5f3a\u8c03\u57fa\u672c\u529f\u7684\u91cd\u8981\u6027\u3002\n    2.  **\u65f6\u95f4\u89c4\u5212**: \u4e3b\u52a8\u4e86\u89e3\u5176\u5de5\u4f5c\u4f5c\u606f\uff0c\u5171\u540c\u5236\u5b9a**\u53ef\u884c\u7684\u3001\u788e\u7247\u5316\u7684\u5b66\u4e60\u8ba1\u5212**\uff0c\u964d\u4f4e\u5176\u56e0\u65f6\u95f4\u538b\u529b\u4ea7\u751f\u7684\u7126\u8651\u548c\u653e\u5f03\u98ce\u9669\u3002\n    3.  **\u4ef7\u503c\u5f15\u5bfc**: \u5728\u63d0\u4f9b\u8bd5\u97f3\u673a\u4f1a\u65f6\uff0c\u540c\u6b65\u8bf4\u660e\u8bd5\u97f3\u7ade\u4e89\u7684\u5b9e\u9645\u60c5\u51b5\u548c\u901a\u8fc7\u7387\uff0c\u5c06\u91cd\u70b9\u4ece\u201c\u63a5\u5355\u7ed3\u679c\u201d\u8f6c\u5411\u201c**\u8fc7\u7a0b\u53cd\u9988\u4e0e\u6280\u80fd\u8fed\u4ee3**\u201d\u3002\n    4.  **\u98ce\u9669\u9884\u8b66**: \u6e29\u548c\u63d0\u793a\u517c\u804c\u6536\u5165\u7684\u4e0d\u7a33\u5b9a\u6027\uff0c\u5c06\u5176\u76ee\u6807\u4ece\u201c\u7acb\u5373\u8d5a\u53d6\u9ad8\u65f6\u85aa\u201d\u5f15\u5bfc\u81f3\u201c**\u6784\u5efa\u53ef\u6301\u7eed\u7684\u517c\u804c\u80fd\u529b\u4e0e\u6536\u5165\u6e20\u9053**\u201d\u3002\n    5.  **\u6301\u7eed\u5173\u6ce8**: \u8be5\u7528\u6237\u914d\u5408\u5ea6\u9ad8\uff0c\u662f\u4f18\u8d28\u670d\u52a1\u5bf9\u8c61\u3002\u9700\u5bc6\u5207\u8ddf\u8e2a\u5176\u5b66\u4e60\u8fdb\u5ea6\u548c\u9996\u6b21\u63a5\u5355\u5c1d\u8bd5\u540e\u7684\u5fc3\u7406\u72b6\u6001\uff0c\u53ca\u65f6\u758f\u5bfc\u53ef\u80fd\u7684\u632b\u6298\u611f\u3002\n\n{\"core_type\": \"T4 \u52a1\u5b9e\u53d8\u73b0\u63a2\u7d22\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u9996\u5468\u91cd\u70b9\u6821\u6b63\u53d8\u73b0\u9884\u671f\"}";
