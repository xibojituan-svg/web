    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677161919\u7684\u7528\u6237\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677161919 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u4e8e\u53cc\u53cc\uff08\u9500\u552e/\u52a9\u6559\u201c\u68a6\u5883\u201d\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u9ad8\u9636\u73ed\uff087380\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u5168\u6b3e\u5145\u88d5**\uff08\u76f4\u63a5\u652f\u4ed87380\u5143\uff0c\u65e0\u5206\u671f\u3001\u501f\u6b3e\u4fe1\u53f7\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u7528\u6237\u63d0\u53ca\u201c\u6b63\u5728\u4e0a\u73ed\u201d\uff0c\u9700\u4e0b\u73ed\u540e\uff0823\u70b9\u540e\uff09\u624d\u80fd\u5b8c\u6210\u4f5c\u4e1a\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\uff08\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u4e92\u52a8\u79ef\u6781\uff0c\u6709\u660e\u786e\u5174\u8da3\u8868\u8fbe\u548c\u884c\u52a8\u53cd\u9988\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u5174\u8da3\u9a71\u52a8\u4e3a\u4e3b\uff0c\u517c\u6709\u53d8\u73b0\u671f\u5f85\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u56e0\u4e3a\u5e73\u65f6\u5bf9\u914d\u97f3\u5c31\u5f88\u611f\u5174\u8da3\u201d\uff0c\u540c\u65f6\u79ef\u6781\u8ddf\u8fdb\u8bd5\u97f3\u3001\u8be2\u95ee\u63a5\u5355\u6d41\u7a0b\uff0c\u5bf9\u201c\u53d8\u73b0\u8def\u5f84\u201d\u6709\u6e05\u6670\u5173\u6ce8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u60f3\u53d1\u5c55\u7684 \u56e0\u4e3a\u5e73\u65f6\u5bf9\u914d\u97f3\u5c31\u5f88\u611f\u5174\u8da3\u201d\uff1b> \u201c\u597d\u7684\u597d\u7684 \u76f8\u4fe1\u8001\u5e08\u201d\uff1b> \u201c\u6211\u63d0\u4ea4\u8bd5\u97f3\u4e86\u8001\u5e08 \u63a5\u4e0b\u6765\u5c31\u662f\u7b49\u5ba1\u6838\u5417\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u76f4\u63a5\u652f\u4ed87380\u5143\u5168\u6b3e\uff0c\u65e0\u5206\u671f\u6216\u501f\u6b3e\u4fe1\u53f7\uff0c\u8d44\u91d1\u72b6\u51b5\u826f\u597d\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u6709\u5168\u804c\u5de5\u4f5c\uff0c\u5b66\u4e60\u65f6\u95f4\u9700\u5728\u665a\u4e0a\u4e0b\u73ed\u540e\uff0823\u70b9\u540e\uff09\u62fc\u51d1\uff0c\u5c5e\u4e8e\u5178\u578b\u7684\u4e0a\u73ed\u65cf\u788e\u7247\u5316\u65f6\u95f4\u6a21\u5f0f\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff0c\u6682\u65e0\u6cd5\u5224\u65ad\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u9500\u552e\u7684\u4e13\u4e1a\u6307\u5bfc\uff08\u5982\u6c14\u606f\u3001\u5bf9\u8c61\u611f\u8c03\u6574\uff09\uff0c\u7528\u6237\u6001\u5ea6\u79ef\u6781\uff0c\u53cd\u9988\u201c\u5b66\u5230\u4e86\u5f88\u591a[\u52a0\u6cb9]\u8c22\u8c22\u8001\u5e08\u6307\u5bfc\u201d\uff0c\u5c55\u73b0\u51fa\u826f\u597d\u7684\u5b66\u4e60\u5fc3\u6001\u548c\u6267\u884c\u529b\uff0c\u65e0\u4efb\u4f55\u81ea\u5351\u3001\u9000\u7f29\u6216\u4f9d\u8d56\u5b89\u629a\u7684\u4fe1\u53f7\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u597d\u7684 \u6211\u8bd5\u8bd5\u770b\u201d\uff1b> \u201c\u6709\u7684\uff0c\u5b66\u5230\u4e86\u5f88\u591a[\u52a0\u6cb9]\u8c22\u8c22\u8001\u5e08\u6307\u5bfc\u201d\uff1b> \u201c\u6536\u5230\ud83e\udee1\u6211\u6d88\u5316\u6d88\u5316\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34\u4e0e\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e\u7684\u6df7\u5408**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u4e13\u4e1a\u8ba4\u53ef\u548c\u5708\u5c42\u878d\u5165\u7684\u6e34\u671b\u3002\u7528\u6237\u5bf9\u201c\u5b98\u65b9\u8001\u5e08\u8ba4\u53ef\u201d\u3001\u201c\u901a\u5173\u201d\u3001\u201c\u52a0\u5165\u5b98\u65b9\u5e73\u53f0\u201d\u3001\u201c\u4e13\u5c5e\u5267\u7ec4\u8d44\u6e90\u201d\u7b49\u8bcd\u6c47\u53cd\u5e94\u79ef\u6781\uff0c\u663e\u793a\u51fa\u5bf9\u8fdb\u5165\u4e00\u4e2a\u4e13\u4e1a\u3001\u6709\u8d44\u6e90\u7684\u5708\u5c42\u5e76\u83b7\u5f97\u8eab\u4efd\u8ba4\u540c\u7684\u5f3a\u70c8\u9700\u6c42\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u201c\u88ab\u770b\u89c1\u201d\u4e0e\u5708\u5c42\u5f52\u5c5e\u611f**\u3002\u63d0\u4f9b\u660e\u786e\u7684\u8fdb\u9636\u8def\u5f84\uff08\u4ece\u8bd5\u97f3\u5230\u5f55\u4e66\uff09\u3001\u7ed9\u4e88\u5177\u4f53\u7684\u6280\u672f\u8ba4\u53ef\uff08\u201c\u8fdb\u6b65\u7a7a\u95f4\u5f88\u5927\u201d\u3001\u201c\u6211\u5f88\u770b\u597d\u4f60\u201d\uff09\uff0c\u5e76\u8425\u9020\u201c\u6211\u4eec\u662f\u4e00\u8d77\u7684\u201d\u56e2\u961f\u6c1b\u56f4\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u52a8\u673a\u4e2d\u3001\u5f39\u6027\u9ad8\u3001\u8d44\u6e90\u4e2d\uff0c\u6267\u884c\u529b\u5f3a\uff0c\u9ed8\u9ed8\u8ddf\u8fdb) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u8a00\u8bba\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u652f\u4ed8\u4e3a\u5168\u6b3e\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u5de5\u4f5c\u7e41\u5fd9\u5bfc\u81f4\u5b66\u4e60\u65f6\u95f4\u88ab\u4e25\u91cd\u6324\u538b\uff0c\u4f5c\u4e1a\u79ef\u538b\u4ea7\u751f\u7126\u8651\uff0c\u6700\u7ec8\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u5b66\u4e60\u6001\u5ea6\u79ef\u6781\uff0c\u77ed\u671f\u5185\u56e0\u6280\u672f\u632b\u6298\u5d29\u6e83\u7684\u53ef\u80fd\u6027\u4f4e\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u5bf9\u53d8\u73b0\u6709\u671f\u5f85\uff0c\u82e5\u5728\u627f\u8bfa\u5468\u671f\u5185\uff08\u5982\u51e0\u4e2a\u6708\uff09\u672a\u80fd\u63a5\u5230\u7b2c\u4e00\u5355\u6216\u6536\u5165\u8fdc\u4f4e\u4e8e\u9884\u671f\uff0c\u53ef\u80fd\u4ea7\u751f\u8d28\u7591\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-4\u5468\u540e**\u3002\u5f53\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u5de5\u4f5c\u4e0e\u5b66\u4e60\u7684\u53cc\u91cd\u538b\u529b\u53e0\u52a0\uff0c\u82e5\u6b64\u65f6\u63a5\u5355\u8fdb\u5c55\u7f13\u6162\uff0c\u6613\u4ea7\u751f\u201c\u6295\u5165\u4ea7\u51fa\u6bd4\u5931\u8861\u201d\u7684\u52a8\u6447\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6b22\u8fce\u52a0\u5165\uff01\u770b\u5230\u4f60\u767d\u5929\u4e0a\u73ed\u665a\u4e0a\u8fd8\u575a\u6301\u5b66\u4e60\uff0c\u8fd9\u4efd\u70ed\u7231\u548c\u6267\u884c\u529b\u592a\u68d2\u4e86\u3002\u54b1\u4eec\u4e0d\u8ffd\u6c42\u901f\u5ea6\uff0c\u91cd\u70b9\u662f\u6bcf\u4e00\u6b65\u90fd\u8d70\u624e\u5b9e\u3002\u4f60\u7684\u58f0\u97f3\u6761\u4ef6\u548c\u5b66\u4e60\u6001\u5ea6\u90fd\u5f88\u597d\uff0c\u6211\u4f1a\u5e2e\u4f60\u89c4\u5212\u597d\u788e\u7247\u65f6\u95f4\uff0c\u7a33\u624e\u7a33\u6253\u5730\u671d\u7740\u63a5\u5355\u548c\u8fdb\u5267\u7ec4\u7684\u76ee\u6807\u524d\u8fdb\u3002\u6709\u4efb\u4f55\u65f6\u95f4\u5b89\u6392\u4e0a\u7684\u56f0\u96be\uff0c\u968f\u65f6\u627e\u6211\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176T2\u8001\u9ec4\u725b\u7279\u8d28\uff0c\u63d0\u4f9b\u7cfb\u7edf\u3001\u6709\u6df1\u5ea6\u7684\u6280\u672f\u8bfe\u7a0b\u548c\u5b9e\u6218\u4efb\u52a1\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u788e\u7247\u5316\u65f6\u95f4\uff0c\u8865\u5145**\u3010\u65f6\u95f4\u7ba1\u7406\u8f85\u52a9\u5305\u3011**\uff08\u5982\u63d0\u4f9b\u97f3\u9891\u7248\u91cd\u70b9\u6458\u8981\u3001\u53ef\u968f\u65f6\u56de\u770b\u7684\u5f55\u64ad\u5207\u7247\uff09\u3002\u5f85\u5176\u6280\u80fd\u7a33\u5b9a\u540e\uff0c\u53ef\u89c2\u5bdf\u662f\u5426\u51fa\u73b0\u4e3b\u52a8\u5e2e\u52a9\u4ed6\u4eba\u7684\u884c\u4e3a\uff0c\u9002\u65f6\u5f15\u5165 **\u3010\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\u3011** \u7684\u6743\u9650\uff08\u5982\u5c0f\u7ec4\u957f\uff09\uff0c\u6fc0\u53d1\u5176\u6f5c\u5728\u9886\u5bfc\u529b\uff08\u5411\u6df7\u5408\u4f533\u53f7\u8fdb\u5316\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u6700\u540e\u540d\u989d\u201d\u3001\u201c\u9650\u65f6\u79d2\u6740\u201d\u7b49\u5236\u9020\u7126\u8651\u7684\u8bdd\u672f\u903c\u5355\uff1b\u5728\u5176\u56e0\u5de5\u4f5c\u5ef6\u8bef\u4f5c\u4e1a\u65f6\u65bd\u52a0\u538b\u529b\u6216\u6279\u8bc4\uff1b\u8fc7\u65e9\u753b\u201c\u6708\u5165\u8fc7\u4e07\u201d\u7684\u5927\u997c\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5176\u652f\u4ed8\u80fd\u529b\u4e0e\u5b66\u4e60\u610f\u613f\u5747\u8fbe\u6807\uff0c\u5728\u6280\u672f\u8fdb\u9636\u9636\u6bb5\uff0c\u53ef\u63a8\u8350\u9ad8\u9636\u8bbe\u5907\u3001\u79c1\u6559\u8bfe\u7b49\u6df1\u5ea6\u4ea7\u54c1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u60f3\u53d1\u5c55\u7684 \u56e0\u4e3a\u5e73\u65f6\u5bf9\u914d\u97f3\u5c31\u5f88\u611f\u5174\u8da3\u201d\n2. > \u201c\u8001\u5e08\u6211\u6b63\u5728\u4e0a\u73ed\uff0c\u53ea\u670911\u70b9\u8fc7\u7684\u65f6\u5019\u4e0b\u73ed\u540e\u5f55\u4e86\u201d\n3. > \u201c\u6709\u7684\uff0c\u5b66\u5230\u4e86\u5f88\u591a[\u52a0\u6cb9]\u8c22\u8c22\u8001\u5e08\u6307\u5bfc\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u5708\u5c42\u7684\u8ba4\u53ef\u4e0e\u5f52\u5c5e\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5e2e\u52a9\u5176\u9ad8\u6548\u7ba1\u7406\u788e\u7247\u65f6\u95f4\uff0c\u5e76\u63d0\u4f9b\u7a33\u5b9a\u3001\u53ef\u89c1\u7684\u8fdb\u6b65\u53cd\u9988\u4e0e\u63a5\u5355\u8def\u5f84\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u793e\u4ea4/\u5c0a\u91cd\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\"}\n```";
