    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 522786129 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-17 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u68a6\u5883-\u5c9a\u70df\u5e08\u59d0\uff08\u8521\u96ef\uff09\u3001\u503e\u4e16\u6c89\u6d6e\uff08\u9648\u78ca\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u6f14\u64ad\u8bad\u7ec3\u8425\uff08\u603b\u4ef7\u7ea63980\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3**\uff08\u201c\u6211\u6b63\u5728\u501f\u94b1\u5462\u201d\u3001\u201c\u5148\u4ea42000\u5143\u4e0b\u4e2a\u6708\u518d\u4ea42000\u884c\u4e0d\u884c\u554a\uff1f\u201d\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u672a\u77e5\uff08\u4fe1\u606f\u7f3a\u5931\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u9690\u7792\u5077\u62a5 / \u6781\u7aef\u53cd\u5bf9**\uff08\u201c\u73b0\u5728\u5b69\u5b50\u4e0d\u652f\u6301\uff0c\u80fd\u53d8\u73b0\u4e86\uff0c\u6211\u8ba9\u4ed6\u770b\u5230\uff0c\u6211\u8ba9\u5b69\u5b50\u7ed9\u6211\u4e70\u201d\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e25\u91cd\u7f3a\u5931\uff08\u5bf9\u5b66\u4e60\u80fd\u529b\u3001\u65f6\u95f4\u7cbe\u529b\u3001\u8fc7\u5f80\u7ecf\u5386\u5747\u65e0\u63cf\u8ff0\uff0c\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b07\u4f4e\n- **\u7279\u5f81\u901f\u5199**\uff1a\u7eaf\u4e3a\u51e0\u5929\u5185\u63d0\u73b0\u4fdd\u5e95\u800c\u6765(\u4f4e\u6781\u5371)\u3002\u7528\u6237\u5bf9\u201c\u591a\u4e45\u80fd\u8d5a\u94b1\u201d\u6781\u5ea6\u5173\u6ce8\uff0c\u5bf9\u5b66\u4e60\u8fc7\u7a0b\u3001\u80fd\u529b\u63d0\u5347\u65e0\u4efb\u4f55\u5174\u8da3\uff0c\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u5373\u65f6\u53d8\u73b0\u8bc9\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08\u60a8\u597d\uff1a\u4ec0\u4e48\u65f6\u5019\u80fd\u8d5a\u5230\u94b1\uff1f\u201d > \u201c\u5927\u6982\u591a\u957f\u65f6\u95f4\u554a\uff1f\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u6781\u4f4e** \u2014 \u660e\u786e\u8868\u793a\u9700\u8981\u501f\u94b1\u62a5\u540d\uff08\u201c\u6211\u6b63\u5728\u501f\u94b1\u5462\u201d\uff09\uff0c\u4e14\u540e\u7eed\u56e0\u5b69\u5b50\u4e0d\u652f\u6301\u3001\u501f\u4e0d\u5230\u94b1\u800c\u8981\u6c42\u9000\u6b3e\u3002\u8d44\u91d1\u94fe\u6781\u5ea6\u8106\u5f31\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u672a\u77e5** \u2014 \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u8003\u8651\u5230\u5176\u5b66\u4e60\u64cd\u4f5c\u80fd\u529b\uff08\u89c1\u4e0b\u6587\uff09\uff0c\u7cbe\u529b\u6295\u5165\u80fd\u529b\u5b58\u7591\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u6781\u4f4e** \u2014 **\u5bb6\u4eba\uff08\u5b69\u5b50\uff09\u660e\u786e\u53cd\u5bf9**\uff0c\u7528\u6237\u8bd5\u56fe\u9690\u7792\u6216\u671f\u5f85\u7528\u201c\u53d8\u73b0\u201d\u7ed3\u679c\u8bf4\u670d\u5bb6\u4eba\uff0c\u8fd9\u662f\u6781\u9ad8\u7684\u9000\u8d39\u98ce\u9669\u4fe1\u53f7\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)\u3002\u5728\u652f\u4ed8\u622a\u56fe\u7b49\u7b80\u5355\u64cd\u4f5c\u4e0a\u53cd\u590d\u53d7\u632b\uff0c\u5e76\u81ea\u6211\u8d2c\u4f4e\uff08\u201c\u6211\u5f04\u4e86\u597d\u51e0\u6b21\uff1a\u7b28\u86cb\u5475[\u5927\u54ed]\u201d\uff09\uff0c\u8868\u73b0\u51fa\u6781\u4f4e\u7684\u81ea\u6211\u6548\u80fd\u611f\u548c\u6280\u672f\u64cd\u4f5c\u80fd\u529b\uff0c\u5bf9\u9500\u552e\u6709\u5f3a\u70c8\u7684\u60c5\u611f\u4f9d\u8d56\u548c\u8ba8\u597d\u503e\u5411\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08\u4f60\u5e2e\u6211\u9009\u597d\u5417\uff1f\u6211\u4e0d\u4f1a\u201d > \u201c\u6211\u5f04\u4e86\u597d\u51e0\u6b21\uff1a\u7b28\u86cb\u5475[\u5927\u54ed]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u7ecf\u6d4e\u4e0a\u7684\u6781\u5ea6\u4e0d\u5b89\u5168\u611f\u4e0e\u81ea\u6211\u4ef7\u503c\u611f\u7684\u4e25\u91cd\u7f3a\u5931**\u3002\u4ed6\u5e0c\u671b\u901a\u8fc7\u5feb\u901f\u201c\u53d8\u73b0\u201d\u6765\u8bc1\u660e\u81ea\u5df1\u3001\u83b7\u5f97\u5bb6\u5ead\uff08\u5b69\u5b50\uff09\u7684\u8ba4\u53ef\uff0c\u5e76\u89e3\u51b3\u7ecf\u6d4e\u56f0\u5883\u3002\u5176\u884c\u4e3a\uff08\u501f\u94b1\u62a5\u540d\u3001\u64cd\u4f5c\u56f0\u96be\u3001\u81ea\u6211\u8d2c\u4f4e\uff09\u900f\u9732\u51fa\u5f3a\u70c8\u7684\u751f\u5b58\u7126\u8651\u548c\u5bf9\u81ea\u8eab\u80fd\u529b\u7684\u6df1\u5ea6\u4e0d\u81ea\u4fe1\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u65e0\u6761\u4ef6\u7684\u79ef\u6781\u5173\u6ce8\u4e0e\u60c5\u611f\u629a\u6170**\uff0c\u800c\u975e\u6280\u80fd\u538b\u529b\u3002\u4ed6\u9700\u8981\u88ab\u80af\u5b9a\u3001\u88ab\u5173\u6000\uff0c\u4ee5\u5f25\u8865\u73b0\u5b9e\u4e2d\u7684\u632b\u8d25\u611f\u548c\u4f4e\u4ef7\u503c\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udd34D \u7c7b** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **\u9000\u8d39\u89e6\u96f7\u578b (\u9ad8\u5371\u53d8\u4f53)** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a**\ud83d\udd34\u5df2\u89e6\u53d1 D \u7c7b\u7194\u65ad\u7ea2\u7ebf\uff01**\n- **\u89e6\u53d1\u56e0\u7531**\uff1a**1. \u501f\u8d37\u62a5\u540d**\uff08\u201c\u6211\u6b63\u5728\u501f\u94b1\u5462\u201d\uff09\uff1b**2. \u5bb6\u4eba\u6781\u7aef\u53cd\u5bf9**\uff08\u5b69\u5b50\u4e0d\u652f\u6301\uff09\uff1b**3. \u6280\u672f\u64cd\u4f5c\u80fd\u529b\u6781\u5f31\uff0c\u5b66\u4e60\u57fa\u7840\u51e0\u4e4e\u4e3a\u96f6**\u3002\u4e09\u8005\u53e0\u52a0\uff0c\u6784\u6210\u6781\u9ad8\u9000\u8d39\u4e0e\u5ba2\u8bc9\u98ce\u9669\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u6781\u9ad8** | \u5b69\u5b50\u6301\u7eed\u53cd\u5bf9\uff0c\u6216\u5bb6\u4eba\u53d1\u73b0\u5176\u501f\u94b1\u62a5\u540d\uff0c\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | \u5f00\u8bfe\u540e\u9762\u5bf9\u8f6f\u4ef6\u5b89\u88c5\u3001\u4f5c\u4e1a\u63d0\u4ea4\u7b49\u57fa\u7840\u64cd\u4f5c\u5373\u4ea7\u751f\u5de8\u5927\u632b\u8d25\u611f\uff0c\u76f4\u63a5\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | \u7b2c\u4e00\u4efd\u4f5c\u4e1a\u6216\u7b2c\u4e00\u6b21\u8bd5\u97f3\u5931\u8d25\uff0c\u4f1a\u5f7b\u5e95\u51fb\u57ae\u5176\u672c\u5c31\u8106\u5f31\u7684\u81ea\u4fe1\u5fc3\uff0c\u5f52\u548e\u4e8e\u8bfe\u7a0b\u65e0\u7528\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u6781\u9ad8** | \u5bf9\u201c\u7b2c\u4e8c\u5468\u5f00\u901a\u8bd5\u97f3\u201d\u62b1\u6709\u4e0d\u5207\u5b9e\u9645\u7684\u5feb\u901f\u8d5a\u94b1\u5e7b\u60f3\uff0c\u4e00\u65e6\u672a\u7acb\u5373\u53d8\u73b0\uff0c\u6781\u6613\u66b4\u6012\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e48\u5c0f\u65f6\u5185**\uff08\u64cd\u4f5c\u5165\u7fa4\u3001\u767b\u5f55\u5e73\u53f0\u9047\u963b\u65f6\uff09\u53ca**\u7b2c\u4e8c\u5468\u9996\u6b21\u8bd5\u97f3\u5931\u8d25\u6216\u672a\u63a5\u5230\u5355\u65f6**\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cXX\u540c\u5b66\uff0c\u6b22\u8fce\u4f60\uff01\u54b1\u4eec\u4e0d\u7740\u6025\uff0c\u4e00\u6b65\u4e00\u6b65\u6765\u3002\u6211\u77e5\u9053\u4f60\u53ef\u80fd\u5bf9\u624b\u673a\u64cd\u4f5c\u4e0d\u592a\u719f\u6089\uff0c\u6709\u4efb\u4f55\u4e00\u70b9\u5c0f\u95ee\u9898\uff0c\u968f\u65f6\u6233\u6211\uff0c\u6211\u4e00\u6b65\u4e00\u6b65\u6559\u4f60\u3002\u54b1\u4eec\u5148\u5b9a\u4e2a\u5c0f\u76ee\u6807\uff0c\u80fd\u987a\u5229\u8fdb\u5165\u6559\u5ba4\u542c\u8bfe\u5c31\u662f\u80dc\u5229\uff01\u4f60\u80af\u5b66\u80af\u95ee\uff0c\u5df2\u7ecf\u7279\u522b\u68d2\u4e86\uff0c\u6211\u4eec\u4e00\u8d77\u6162\u6162\u6765\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u8f6f\u6027\u7597\u6108\u966a\u4f34\u7ebf\u3011**\u3002**\u6838\u5fc3\u76ee\u6807\u4e0d\u662f\u8ba9\u4ed6\u5b66\u4f1a\u6280\u80fd\uff0c\u800c\u662f\u7ef4\u6301\u5176\u60c5\u7eea\u7a33\u5b9a\uff0c\u907f\u514d\u56e0\u632b\u8d25\u611f\u5f15\u53d1\u6fc0\u70c8\u9000\u8d39\u6295\u8bc9\u3002**\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u5f3a\u5236\u6302\u8f7d **\u3010\u50bb\u74dc\u5f0f\u64cd\u4f5c\u6307\u5f15\u5305\u3011**\uff08\u56fe\u6587/\u89c6\u9891\uff09\u548c **\u3010\u6781\u81f4\u7b80\u5316\u4efb\u52a1\u5305\u3011**\uff08\u5982\uff1a\u53ea\u9700\u63d0\u4ea4\u4e00\u6bb530\u79d2\u8ddf\u8bfb\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u5176\u65bd\u52a0\u4efb\u4f55\u5b66\u4e60\u538b\u529b**\uff0c\u4e0d\u50ac\u4f5c\u4e1a\uff0c\u4e0d\u5f3a\u8c03\u201c\u4f18\u79c0\u5b66\u5458\u201d\u3002\n    2. **\u7edd\u4e0d\u7ed9\u5176\u6d3e\u53d1\u4efb\u4f55\u6709\u96be\u5ea6\u7684\u8bd5\u97f3\u6216\u4efb\u52a1**\u3002\n    3. **\u7edd\u4e0d\u8c08\u8bba\u201c\u591a\u4e45\u80fd\u8d5a\u94b1\u201d\u3001\u201c\u540c\u5b66\u8d5a\u4e86\u591a\u5c11\u94b1\u201d\u7b49\u654f\u611f\u8bdd\u9898**\u3002\n    4. **\u4e25\u7981\u4efb\u4f55\u5f62\u5f0f\u7684\u5347\u5355\u6216\u7eed\u8d39\u63a8\u8350**\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u6b64\u7528\u6237\u4e3a\u6781\u9ad8\u98ce\u9669\u5ba2\u6237\uff0c\u670d\u52a1\u6838\u5fc3\u662f\u5e73\u7a33\u9001\u5176\u7ed3\u4e1a\uff0c\u907f\u514d\u5ba2\u8bc9\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u8001\u5e08\u6211\u6b63\u5728\u501f\u94b1\u5462\u201d\n2. > \u201c\u73b0\u5728\u5b69\u5b50\u4e0d\u652f\u6301\uff0c\u80fd\u53d8\u73b0\u4e86\uff0c\u6211\u8ba9\u4ed6\u770b\u5230\uff0c\u6211\u8ba9\u5b69\u5b50\u7ed9\u6211\u4e70\u201d\n3. > \u201c\u6211\u5f04\u4e86\u597d\u51e0\u6b21\uff1a\u7b28\u86cb\u5475[\u5927\u54ed]\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010\u9ad8\u5371\u9000\u8d39\u89e6\u96f7\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u7ecf\u6d4e\u5b89\u5168\u611f\u548c\u5bb6\u5ead\u8ba4\u53ef\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u81f4\u7684\u60c5\u611f\u629a\u6170\u548c\u50bb\u74dc\u5f0f\u64cd\u4f5c\u652f\u6301\uff0c\u5265\u79bb\u4e00\u5207\u5b66\u4e60\u538b\u529b\uff0c\u76ee\u6807\u4ec5\u4e3a\u5e73\u7a33\u7ed3\u4e1a\uff0c\u4e25\u9632\u5ba2\u8bc9\u3011**\u3002\n\n```json\n{\"core_type\": \"\u9000\u8d39\u89e6\u96f7\u578b\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"risk_level\": \"\u6781\u9ad8\", \"target_product_line\": \"\u8f6f\u6027\u7597\u6108\u966a\u4f34\u7ebf\"}\n```";
