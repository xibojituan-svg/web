    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a (UID: 56974795)\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u9ad8)**: \u5b66\u4e60\u52a8\u673a\u660e\u786e\uff0c\u805a\u7126\u4e8e\u5177\u4f53\u6280\u80fd\u63d0\u5347\uff08\u5982\u5f55\u97f3\u6280\u672f\u3001\u8f6f\u4ef6\u64cd\u4f5c\u3001\u4f5c\u4e1a\u5b8c\u6210\uff09\u3002\u4e3b\u52a8\u63d0\u95ee\u6280\u672f\u7ec6\u8282\uff08\u5982\u7206\u97f3\u5904\u7406\u3001AU\u64cd\u4f5c\u3001\u5bf9\u8f68\u8f6f\u4ef6\uff09\uff0c\u8868\u73b0\u51fa\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u672c\u8eab\u7684\u6295\u5165\u548c\u94bb\u7814\u7cbe\u795e\u3002**\u4f46\u5b58\u5728\u6f5c\u5728\u98ce\u9669\uff1a\u5bf9\u53d8\u73b0\u8def\u5f84\u3001\u884c\u4e1a\u56de\u62a5\u7684\u671f\u671b\u672a\u660e\u786e\u63d0\u53ca\uff0c\u52a8\u673a\u53ef\u80fd\u504f\u5411\u201c\u6280\u80fd\u83b7\u53d6\u201d\u800c\u975e\u201c\u7ed3\u679c\u53d8\u73b0\u201d\u3002**\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d)**: \u5177\u5907\u57fa\u7840\u5b66\u4e60\u8bbe\u5907\uff08\u7535\u8111\u3001\u9ea6\u514b\u98ce\u3001\u9694\u97f3\u68c9\uff09\uff0c\u5e76\u613f\u610f\u4e3a\u5b66\u4e60\u6295\u5165\u989d\u5916\u8d44\u6e90\uff08\u5982\u8d2d\u4e70\u767e\u5ea6\u7f51\u76d8\u4f1a\u5458\u3001\u786c\u76d8\uff09\u3002\u5177\u5907\u4e00\u5b9a\u7684\u81ea\u4e3b\u5b66\u4e60\u80fd\u529b\u548c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\uff08\u8ddf\u8fdb\u8bfe\u7a0b\u3001\u63d0\u4ea4\u4f5c\u4e1a\uff09\u3002\u6280\u672f\u64cd\u4f5c\u80fd\u529b\u4e2d\u7b49\uff0c\u9700\u8981\u73ed\u4e3b\u4efb\u8f85\u52a9\uff08\u5982\u5b89\u88c5\u8f6f\u4ef6\u3001\u8c03\u8bd5\u8bbe\u5907\uff09\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u9ad8)**: \u6c9f\u901a\u6001\u5ea6\u79ef\u6781\u3001\u793c\u8c8c\uff08\u9891\u7e41\u4f7f\u7528\u201c\u8c22\u8c22\u73ed\u73ed\u201d\u3001\u201c\u597d\u7684\u5462\u201d\uff09\u3002\u9762\u5bf9\u6280\u672f\u95ee\u9898\uff08\u5982\u7206\u97f3\u3001\u8f6f\u4ef6\u5b89\u88c5\u8b66\u62a5\uff09\u65f6\u60c5\u7eea\u7a33\u5b9a\uff0c\u80fd\u4e3b\u52a8\u5c1d\u8bd5\u89e3\u51b3\u5e76\u5bfb\u6c42\u5e2e\u52a9\u3002\u5bf9\u73ed\u4e3b\u4efb\u7684\u6307\u5bfc\u548c\u5efa\u8bae\u63a5\u53d7\u5ea6\u9ad8\uff0c\u914d\u5408\u5ea6\u597d\u3002\u5728\u4f5c\u4e1a\u9009\u62e9\u4e0a\u867d\u6709\u7ea0\u7ed3\uff0c\u4f46\u80fd\u81ea\u6211\u8c03\u8282\uff08\u201c\u54ea\u7bc7\u611f\u89c9\u987a\u5c31\u4ea4\u54ea\u7bc7\u201d\uff09\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: \u8bb0\u5f55\u4e2d\u672a\u6d89\u53ca\u652f\u4ed8\u884c\u4e3a\u6216\u4ef7\u683c\u8ba8\u8bba\uff0c**\u65e0\u6cd5\u76f4\u63a5\u5224\u65ad**\u3002\u9700\u7ed3\u5408\u540e\u53f0\u6570\u636e\u786e\u8ba4\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: \u8bb0\u5f55\u4e2d\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u6210\u5458\u6216\u51b3\u7b56\u76f8\u5173\u65b9\uff0c\u6240\u6709\u6c9f\u901a\u5747\u4e3a\u5b66\u5458\u672c\u4eba\u3002**\u521d\u6b65\u5224\u65ad\u4e3a\u72ec\u7acb\u51b3\u7b56\u8005**\u3002\n*   **\u6b65\u9aa41-4 \u7efc\u5408\u5224\u5b9a**:\n    *   **A (\u884c\u52a8\u529b)**: \u9ad8\u3002\u4e3b\u52a8\u8ddf\u8fdb\u8bfe\u7a0b\u3001\u5b89\u88c5\u8f6f\u4ef6\u3001\u63d0\u4ea4\u4f5c\u4e1a\u3001\u63d0\u95ee\u6280\u672f\u7ec6\u8282\u3002\n    *   **B (\u4fe1\u5ff5\u5ea6)**: \u4e2d\u9ad8\u3002\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u548c\u73ed\u4e3b\u4efb\u4fe1\u4efb\u5ea6\u9ad8\uff0c\u9075\u5b88\u89c4\u5219\uff08\u5982\u4e0d\u76f4\u63a5\u53d1\u6bd5\u4e1a\u4f5c\u54c1\u6c42\u70b9\u8bc4\uff09\uff0c\u79ef\u6781\u53c2\u4e0e\u4e92\u52a8\u3002\n    *   **C (\u627f\u8bfa\u611f)**: \u9ad8\u3002\u5df2\u5b8c\u6210\u524d\u671f\u8bfe\u7a0b\uff08\u6709\u201c\u7ed3\u8425\u95ee\u5377\u201d\u5bf9\u8bdd\uff09\uff0c\u5e76\u8fdb\u5165\u65b0\u73ed\u7ea7\u7ee7\u7eed\u5b66\u4e60\uff0c\u6295\u5165\u65f6\u95f4\u4e0e\u8d44\u6e90\u3002\n    *   **D (\u51b3\u7b56\u6a21\u5f0f)**: **\u5de5\u5177\u7406\u6027\u578b**\u3002\u95ee\u9898\u96c6\u4e2d\u4e8e\u5177\u4f53\u6280\u672f\u64cd\u4f5c\u3001\u6d41\u7a0b\u89c4\u8303\u3001\u5b66\u4e60\u5de5\u5177\u83b7\u53d6\uff0c\u51b3\u7b56\u57fa\u4e8e\u5b9e\u7528\u6027\u548c\u95ee\u9898\u89e3\u51b3\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n**T5 \u52a1\u5b9e\u6280\u80fd\u5bfb\u6c42\u8005**\n*   **\u6838\u5fc3\u7279\u5f81\u5339\u914d**: \u5173\u6ce8\u5177\u4f53\u6280\u80fd\u548c\u5de5\u5177\u638c\u63e1\uff08\u5f55\u97f3\u6280\u672f\u3001\u8f6f\u4ef6\u64cd\u4f5c\u3001\u4f5c\u4e1a\u6d41\u7a0b\uff09\uff0c\u5b66\u4e60\u884c\u4e3a\u624e\u5b9e\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u5bf9\u670d\u52a1\u54cd\u5e94\u6ee1\u610f\uff0c\u4e92\u52a8\u793c\u8c8c\u4e14\u914d\u5408\u3002\n*   **\u504f\u79bb\u70b9**: \u672a\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u7126\u8651\u6216\u6025\u4e8e\u6c42\u6210\u5fc3\u6001\uff0c\u4e5f\u672a\u663e\u793a\u51fa\u660e\u786e\u7684\u201c\u526f\u4e1a\u53d8\u73b0\u201d\u7d27\u8feb\u611f\uff0c\u66f4\u504f\u5411\u4e8e\u6280\u80fd\u79ef\u7d2f\u672c\u8eab\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4f4e)\n*   **\u9884\u671f\u7ba1\u7406\u504f\u5dee**: \u4f4e\u3002\u672a\u53d1\u73b0\u5bf9\u201c\u901f\u6210\u201d\u3001\u201c\u9ad8\u85aa\u201d\u7b49\u4e0d\u5207\u5b9e\u9645\u671f\u671b\u7684\u8868\u8ff0\u3002\n*   **\u6548\u679c\u611f\u77e5\u843d\u5dee**: \u4f4e\u3002\u5b66\u5458\u6b63\u5904\u5728\u6280\u80fd\u5b66\u4e60\u548c\u95ee\u9898\u89e3\u51b3\u9636\u6bb5\uff0c\u9891\u7e41\u83b7\u5f97\u73ed\u4e3b\u4efb\u652f\u6301\uff0c\u6682\u65e0\u6548\u679c\u8d1f\u9762\u53cd\u9988\u3002\n*   **\u670d\u52a1\u4f53\u9a8c\u7f3a\u9677**: \u6781\u4f4e\u3002\u6c9f\u901a\u8bb0\u5f55\u663e\u793a\u670d\u52a1\u54cd\u5e94\u53ca\u65f6\u3001\u95ee\u9898\u89e3\u51b3\u6709\u6548\uff0c\u5b66\u5458\u591a\u6b21\u8868\u8fbe\u611f\u8c22\uff0c\u5173\u7cfb\u878d\u6d3d\u3002\n*   **\u7ecf\u6d4e\u538b\u529b\u89e6\u53d1**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u7ecf\u6d4e\u72b6\u51b5\u3002\n*   **\u5bb6\u5ead\u51b3\u7b56\u51b2\u7a81**: \u6781\u4f4e\u3002\u5224\u65ad\u4e3a\u72ec\u7acb\u51b3\u7b56\u8005\u3002\n*   **\u7ade\u54c1\u5bf9\u6bd4/\u5916\u90e8\u5f71\u54cd**: \u4f4e\u3002\u672a\u63d0\u53ca\u5176\u4ed6\u673a\u6784\u6216\u8d1f\u9762\u4fe1\u606f\u3002\n*   **\u5b66\u4e60\u4e2d\u65ad/\u5ba2\u89c2\u963b\u788d**: \u4f4e\u3002\u5b66\u5458\u6301\u7eed\u5b66\u4e60\uff0c\u4ec5\u63d0\u53ca\u201c\u8fd9\u51e0\u5929\u611f\u89c9\u4e0d\u5728\u72b6\u6001\u201d\uff0c\u4f46\u672a\u6784\u6210\u963b\u788d\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u65e0\u8fc7\u5ea6\u627f\u8bfa\u8ff9\u8c61**: \u9500\u552e/\u73ed\u4e3b\u4efb\u56de\u590d\u96c6\u4e2d\u4e8e\u5177\u4f53\u6280\u672f\u6307\u5bfc\u548c\u6d41\u7a0b\u8bf4\u660e\uff0c\u672a\u53d1\u73b0\u5938\u5927\u6536\u76ca\u6216\u4fdd\u969c\u7ed3\u679c\u7684\u8a00\u8bba\u3002\n*   **\u670d\u52a1\u8fb9\u754c\u6e05\u6670**: \u73ed\u4e3b\u4efb\u660e\u786e\u544a\u77e5\u201c\u7cbe\u82f1\u73ed\u8bf4\u73ed\u73ed\u4e0d\u80fd\u5e2e\u5fd9\u542c\u201d\uff0c\u575a\u5b88\u4e86\u6559\u5b66\u8bc4\u4f30\u7684\u72ec\u7acb\u6027\u539f\u5219\u3002\n*   **\u65e0\u8bf1\u5bfc\u501f\u8d37/\u6d88\u8d39**: \u8bb0\u5f55\u4e2d\u4ec5\u6d89\u53ca\u5b66\u5458\u4e3b\u52a8\u8d2d\u4e70\u7f51\u76d8\u4f1a\u5458\uff0c\u73ed\u4e3b\u4efb\u751a\u81f3\u529d\u963b\u5176\u4e0d\u5fc5\u8981\u7684\u6d88\u8d39\uff08\u201c\u82b1\u90a3\u4e2a\u94b1\u6ca1\u610f\u4e49\u201d\uff09\uff0c\u5408\u89c4\u6027\u826f\u597d\u3002\n*   **\u4fe1\u606f\u4fdd\u62a4**: \u8fdc\u7a0b\u534f\u52a9\u65f6\u4f7f\u7528\u4e34\u65f6\u5bc6\u7801\uff0c\u6d41\u7a0b\u89c4\u8303\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d**: **\u5339\u914d**\u3002\u5b66\u5458\u5f53\u524d\u7684\u5b66\u4e60\u8282\u594f\u3001\u95ee\u9898\u7c7b\u578b\u4e0e\u6280\u80fd\u63d0\u5347\u7c7b\u8bfe\u7a0b\u7684\u4ea7\u54c1\u8bbe\u8ba1\u5951\u5408\u5ea6\u9ad8\u3002\n*   **\u6838\u5fc3\u98ce\u9669\u63d0\u793a**: **\u9700\u5173\u6ce8\u5176\u957f\u671f\u5b66\u4e60\u52a8\u673a\u7684\u53ef\u6301\u7eed\u6027\uff0c\u4ee5\u53ca\u4ece\u201c\u6280\u80fd\u5b66\u4e60\u201d\u5230\u201c\u5b9e\u6218\u53d8\u73b0\u201d\u7684\u9884\u671f\u8fc7\u6e21\u662f\u5426\u987a\u7545\u3002**\n*   **\u884c\u52a8\u6307\u5357**:\n    1.  **\u7ef4\u6301\u73b0\u6709\u652f\u6301\u6a21\u5f0f**: \u7ee7\u7eed\u63d0\u4f9b\u53ca\u65f6\u3001\u52a1\u5b9e\u7684\u6280\u672f\u4e0e\u6d41\u7a0b\u652f\u6301\uff0c\u5de9\u56fa\u4fe1\u4efb\u3002\n    2.  **\u9002\u65f6\u5f15\u5bfc\u804c\u4e1a\u89c4\u5212**: \u5728\u540e\u7eed\u6c9f\u901a\u4e2d\uff0c\u53ef\u81ea\u7136\u5f15\u5165\u884c\u4e1a\u73b0\u72b6\u3001\u63a5\u5355\u6e20\u9053\u3001\u4e2a\u4eba\u5b9a\u4f4d\u7b49\u8bdd\u9898\uff0c\u8bd5\u63a2\u5e76\u5f15\u5bfc\u5176\u5bf9\u53d8\u73b0\u8def\u5f84\u7684\u601d\u8003\uff0c**\u9884\u9632\u540e\u671f\u56e0\u201c\u5b66\u5b8c\u4e0d\u77e5\u5982\u4f55\u7528\u201d\u800c\u4ea7\u751f\u7684\u5931\u843d\u611f**\u3002\n    3.  **\u9f13\u52b1\u591a\u98ce\u683c\u5c1d\u8bd5**: \u9488\u5bf9\u5176\u4f5c\u4e1a\u9009\u62e9\u7684\u7ea0\u7ed3\uff0c\u53ef\u9f13\u52b1\u5176\u5728\u5206\u8d5b\u9053\u524d\u8fdb\u884c\u591a\u98ce\u683c\u5c1d\u8bd5\uff0c\u5e2e\u52a9\u5176\u66f4\u6e05\u6670\u5730\u627e\u5230\u9002\u5408\u7684\u8d5b\u9053\u3002\n    4.  **\u5e38\u89c4\u670d\u52a1\uff0c\u65e0\u9700\u7279\u6b8a\u5e72\u9884**: \u5f53\u524d\u9636\u6bb5\u4fdd\u6301\u9ad8\u8d28\u91cf\u5e38\u89c4\u670d\u52a1\u5373\u53ef\uff0c\u5173\u7cfb\u7ef4\u62a4\u826f\u597d\u3002\n\n{\"core_type\": \"T5 \u52a1\u5b9e\u6280\u80fd\u5bfb\u6c42\u8005\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u7ef4\u6301\u652f\u6301\uff0c\u9002\u65f6\u5f15\u5bfc\u804c\u4e1a\u89c4\u5212\"}";
