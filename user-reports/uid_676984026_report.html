    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u63d0\u4f9b\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \ud83c\udf19\u6668 (UID: 676984026) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-21 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u8d85\u4eba\u6897\u54e5(\u803f\u4e1a\u4e1c) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66/AI\u914d\u97f3\u7c7b\u8bfe\u7a0b (\u5df2\u8d2d\u8bbe\u5907sE2200\u5957\u88c5) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u5206\u671f\u6216\u501f\u6b3e\u3002\u63a8\u6d4b\u4e3a\u5168\u6b3e\u5145\u88d5\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u6709\u5168\u804c\u5de5\u4f5c\uff08\u201c\u88ab\u56f0\u5728\u5355\u4f4d\u5f53\u725b\u9a6c\u201d\uff09\uff0c\u4f46\u80fd\u5229\u7528\u5348\u4f11\u3001\u665a\u4e0a\u53ca\u8bf7\u5047\u65f6\u95f4\u5b66\u4e60\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\uff0c\u4f46\u7528\u6237\u80fd\u81ea\u4e3b\u5b89\u6392\u65f6\u95f4\uff08\u5982\u5bb6\u5ead\u805a\u4f1a\uff09\uff0c\u63a8\u6d4b\u5355\u8eab\u6216\u5bb6\u5ead\u652f\u6301\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u8bb0\u5f55\u8be6\u7ec6\u5c55\u73b0\u4e86\u7528\u6237\u7684\u5b66\u4e60\u884c\u4e3a\u3001\u4e92\u52a8\u6a21\u5f0f\u4e0e\u5fc3\u7406\u72b6\u6001\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u2b06\u9ad8]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u4e13\u4e1a\u7cbe\u8fdb\u800c\u6765\u3002\u5173\u6ce8\u53d1\u97f3\u3001\u8282\u594f\u3001\u6587\u672c\u5206\u6790\u7b49\u786c\u6838\u6280\u80fd\u63d0\u5347\uff0c\u5bf9\u53d8\u73b0\u5468\u671f\u6709\u957f\u671f\u9884\u671f\uff08\u201c\u51e0\u5e74\u4e4b\u540e\u6211\u6ca1\u51c6\u5c31\u6ca1\u6709\u8fd9\u5e74\u8f7b\u7684\u58f0\u97f3\u201d\uff09\uff0c\u65e0\u4efb\u4f55\u4fdd\u5e95\u6536\u76ca\u8981\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08\u8bf4\u6211\u4e0d\u80fd\u5149\u987e\u7740\u58f0\u97f3\u597d\u542c\u4e86\uff0c\u88ab\u4eba\u5149\u542c\u4f60\u58f0\u97f3\u4e0d\u77e5\u9053\u4f60\u8bf4\u7684\u662f\u4ec0\u4e48\uff0c\u6211\u89c9\u5f97\u8bf4\u7684\u5bf9\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b06\u9ad8]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u9ad8]** \u2014 \u5df2\u8d2d\u4e70\u8bfe\u7a0b\u53ca\u4e13\u4e1a\u8bbe\u5907\uff08sE2200\u5957\u88c5\uff09\uff0c\u5e76\u8003\u8651\u5347\u7ea7\uff08MK4\uff09\uff0c\u672a\u8868\u73b0\u51fa\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**[\u4e2d]** \u2014 \u6709\u5168\u804c\u5de5\u4f5c\uff0c\u65f6\u95f4\u88ab\u5360\u7528\uff0c\u4f46\u5b66\u4e60\u610f\u613f\u6781\u5f3a\uff0c\u80fd\u4e3b\u52a8\u6324\u51fa\u65f6\u95f4\uff08\u8bf7\u5047\u5b66\u4e60\u3001\u665a\u4e0a\u590d\u76d8\uff09\uff0c\u5e76\u79ef\u6781\u53c2\u4e0e\u793e\u7fa4\u4e92\u52a8\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u4fe1\u606f\u4e0d\u8db3\uff0c\u63a8\u6d4b\u9ad8]** \u2014 \u672a\u63d0\u53ca\u5bb6\u5ead\u963b\u529b\uff0c\u80fd\u81ea\u4e3b\u5b89\u6392\u5b66\u4e60\u4e0e\u793e\u4ea4\u6d3b\u52a8\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u8bbe\u5907\u8c03\u8bd5\u3001\u4e0a\u4f20\u9519\u8bef\uff09\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\uff1b\u9047\u5230\u5b66\u4e60\u632b\u6298\uff08\u4f5c\u4e1a\u88ab\u6279\u8bc4\uff09\u80fd**\u81ea\u6211\u8c03\u8282\u3001\u7406\u6027\u5206\u6790\u5e76\u91cd\u5efa\u4fe1\u5fc3**\uff0c\u800c\u975e\u4f9d\u8d56\u5916\u90e8\u5b89\u629a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u529d\u81ea\u5df1\uff0c\u7b2c\u4e00\uff0c\u6211\u58f0\u97f3\u662f\u597d\u542c\u7684\uff1b\u7b2c\u4e8c\uff0c\u6211\u521a\u5b66\u4e86\u4e00\u4e2a\u6708\uff0c\u6587\u672c\u5206\u6790\u4e0d\u5230\u4f4d\u5c5e\u4e8e\u6b63\u5e38\uff0c\u53ea\u8981\u6211\u7528\u5fc3\u52aa\u529b\uff0c\u603b\u6709\u4e00\u5929\u4f1a\u5206\u6790\u5230\u4f4d\uff1b\u7b2c\u4e09\uff0c\u5230\u65f6\u5019\uff0c\u6211\u4e0d\u4f46\u80fd\u5206\u6790\u597d\u6587\u672c\uff0c\u800c\u4e14\u6211\u8fd8\u58f0\u97f3\u597d\u542c\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u81ea\u8eab\u4e13\u4e1a\u80fd\u529b\u7684**\u9ad8\u6807\u51c6\u8981\u6c42**\u4e0e**\u88ab\u8ba4\u53ef\u7684\u6e34\u671b**\u3002\u5f53\u4f5c\u4e1a\u88ab\u6307\u51fa\u201c\u6587\u672c\u5206\u6790\u4e0d\u5230\u4f4d\u201d\u65f6\uff0c\u4f1a\u4ea7\u751f\u201c\u90c1\u95f7\u201d\u60c5\u7eea\uff0c\u4f46\u80fd\u8fc5\u901f\u8f6c\u5316\u4e3a\u7cbe\u8fdb\u7684\u52a8\u529b\u3002\u5176\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u83b7\u5f97\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u81ea\u6211\u7a81\u7834\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u5c42\u9762\u7684\u6df1\u5ea6\u8ba4\u53ef\u4e0e\u8fdb\u9636\u6311\u6218**\u3002\u4ed6\u4e0d\u9700\u8981\u5ec9\u4ef7\u7684\u5b89\u6170\uff0c\u800c\u662f\u9700\u8981\u88ab\u770b\u89c1\u52aa\u529b\u3001\u88ab\u80af\u5b9a\u6f5c\u529b\uff0c\u5e76\u83b7\u5f97\u901a\u5f80\u66f4\u9ad8\u4e13\u4e1a\u6c34\u51c6\u7684\u8def\u5f84\u6307\u5f15\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\u2b50A \u7c7b** (\u9ad8\u52a8\u673a\u3001\u9ad8\u8d44\u6e90\u3001\u9ad8\u5f39\u6027\uff0c\u6838\u5fc3\u4ef7\u503c\u7528\u6237) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T3 \u6b7b\u78d5\u5b66\u9738\u578b** (\u8ffd\u6c42\u6838\u5fc3\u539f\u7406\uff0c\u4e50\u4e8e\u94bb\u7814\uff0c\u81ea\u6211\u9a71\u52a8\u5f3a\uff0c\u79ef\u6781\u53c2\u4e0e\u4e92\u52a9) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u672a\u53d1\u73b0\u76f8\u5173\u8ff9\u8c61\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u5b66\u4e60\u610f\u613f\u6781\u5f3a\uff0c\u80fd\u4e3b\u52a8\u7ba1\u7406\u65f6\u95f4\uff0c\u98ce\u9669\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | **\u5fc3\u7406\u5f39\u6027\u6781\u9ad8**\uff0c\u5177\u5907\u4f18\u79c0\u7684\u81ea\u6211\u8c03\u8282\u4e0e\u95ee\u9898\u89e3\u51b3\u80fd\u529b\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u52a8\u673a\u4e3a\u80fd\u529b\u6210\u957f\u800c\u975e\u77ed\u671f\u53d8\u73b0\uff0c\u5bf9\u6536\u76ca\u6709\u5408\u7406\u9884\u671f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u65e0\u660e\u663e\u5371\u9669\u7a97\u53e3**\u3002\u6b64\u7c7b\u7528\u6237\u9000\u8d39\u98ce\u9669\u6781\u4f4e\uff0c\u9664\u975e\u8bfe\u7a0b\u8d28\u91cf\u4e25\u91cd\u4e0d\u7b26\u9884\u671f\u6216\u670d\u52a1\u5b8c\u5168\u7f3a\u5931\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6668\u6668\uff0c\u770b\u4e86\u4f60\u7684\u4e92\u52a8\u548c\u4f5c\u4e1a\uff0c\u80fd\u611f\u89c9\u5230\u4f60\u5bf9\u4e13\u4e1a\u6709\u5f88\u9ad8\u7684\u8ffd\u6c42\u548c\u81ea\u6211\u8981\u6c42\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u5c31\u662f\u4e3a\u4f60\u8fd9\u6837\u7684\u2018\u624b\u827a\u4eba\u2019\u51c6\u5907\u7684\uff0c\u8fc7\u7a0b\u53ef\u80fd\u4f1a\u9047\u5230\u74f6\u9888\uff0c\u4f46\u522b\u81ea\u5df1\u95f7\u7740\uff0c\u968f\u65f6\u627e\u6211\u804a\u3002\u6211\u4eec\u7684\u76ee\u6807\u662f\u5e2e\u4f60\u628a\u2018\u58f0\u97f3\u597d\u542c\u2019\u8fd9\u4e2a\u5929\u8d4b\uff0c\u6253\u78e8\u6210\u2018\u8868\u8fbe\u7cbe\u51c6\u52a8\u4eba\u2019\u7684\u771f\u672c\u4e8b\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u63d0\u4f9b\u6df1\u5ea6\u7684\u6587\u672c\u5206\u6790\u3001\u89d2\u8272\u5851\u9020\u3001\u540e\u671f\u5236\u4f5c\u7b49\u8fdb\u9636\u6559\u5b66\u5185\u5bb9\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T3\u5f3a\u70c8\u5efa\u8bae\u8865\u5145**\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011**\u3002\u8d4b\u4e88\u5176\u5411\u4e13\u5bb6\u8001\u5e08\u6df1\u5ea6\u63d0\u95ee\u7684\u7eff\u8272\u901a\u9053\uff0c\u6ee1\u8db3\u5176\u94bb\u7814\u9700\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u7528\u80a4\u6d45\u7684\u5938\u5956\u6577\u884d\u4ed6**\uff08\u5982\u201c\u4f60\u771f\u68d2\u201d\uff09\uff0c\u9700\u8981\u5177\u4f53\u5230\u6280\u672f\u7ec6\u8282\u7684\u80af\u5b9a\uff08\u5982\u201c\u4f60\u8fd9\u6bb5\u7684\u8282\u594f\u5904\u7406\u8fdb\u6b65\u5f88\u5927\u201d\uff09\u30022. **\u63d0\u4f9b\u8fc7\u4e8e\u7b80\u5355\u6216\u91cd\u590d\u6027\u7684\u4efb\u52a1**\uff0c\u8fd9\u4f1a\u8ba9\u4ed6\u611f\u5230\u4e0d\u88ab\u91cd\u89c6\u548c\u65e0\u804a\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u4ed6\u662f\u9ad8\u9636\u8bfe\u7a0b\u3001\u79c1\u6559\u8bfe\u3001\u5927\u5e08\u73ed\u7684\u7edd\u4f73\u6f5c\u5728\u5ba2\u6237\uff0c\u63a8\u4ecb\u65f6\u5e94\u4fa7\u91cd\u201c\u89e3\u51b3\u4f60\u5f53\u524d\u9047\u5230\u7684XX\u74f6\u9888\u201d\u3001\u201c\u901a\u5f80\u4e13\u4e1a\u7ea7\u7684\u8def\u5f84\u201d\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u529d\u81ea\u5df1\uff0c\u7b2c\u4e00\uff0c\u6211\u58f0\u97f3\u662f\u597d\u542c\u7684\uff1b\u7b2c\u4e8c\uff0c\u6211\u521a\u5b66\u4e86\u4e00\u4e2a\u6708\uff0c\u6587\u672c\u5206\u6790\u4e0d\u5230\u4f4d\u5c5e\u4e8e\u6b63\u5e38\uff0c\u53ea\u8981\u6211\u7528\u5fc3\u52aa\u529b\uff0c\u603b\u6709\u4e00\u5929\u4f1a\u5206\u6790\u5230\u4f4d\uff1b\u7b2c\u4e09\uff0c\u5230\u65f6\u5019\uff0c\u6211\u4e0d\u4f46\u80fd\u5206\u6790\u597d\u6587\u672c\uff0c\u800c\u4e14\u6211\u8fd8\u58f0\u97f3\u597d\u542c\u201d **(\u5b8c\u7f8e\u5c55\u73b0\u9ad8\u5fc3\u7406\u5f39\u6027\u4e0e\u6210\u957f\u578b\u601d\u7ef4)**\n2. > \u201c\u6843\u5b50\u4f60\u597d\uff0c\u7136\u540e\u6211\u542c\u4e86\u4f60\u7684\u55ef\u4eca\u65e5\u6253\u5361\uff0c\u611f\u89c9\u4f60\u975e\u5e38\u7684\u52aa\u529b...\u6240\u4ee5\u53ef\u4ee5\u8ba9\u81ea\u5df1\u7684\u72b6\u6001\u653e\u677e\u4e0b\u6765\uff0c\u5c31\u8ddf\u5e73\u5e38\u8bf4\u8bdd\u4e00\u6837\u201d **(\u5c55\u73b0\u4e50\u4e8e\u52a9\u4eba\u3001\u5177\u5907\u521d\u6b65\u6559\u5b66\u4e0e\u53cd\u9988\u80fd\u529b\uff0c\u662f\u5178\u578b\u7684\u201c\u5b66\u9738\u201d\u793e\u7fa4\u8d21\u732e\u884c\u4e3a)**\n3. > \u201c\u73ed\u73ed\uff0c\u6211\u60f3\u5728\u7535\u8111\u7aef\u7ed9\u6211\u5728\u559c\u9a6c\u4e0a\u4f20\u7684\u4f5c\u54c1\u52a0\u4e0a\u97f3\u4e50\uff0c\u600e\u4e48\u52a0\u554a\u201d **(\u4e3b\u52a8\u63a2\u7d22\u9ad8\u9636\u6280\u80fd\uff0c\u5b66\u4e60\u9a71\u52a8\u529b\u5f3a)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T3 \u6b7b\u78d5\u5b66\u9738\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6df1\u5ea6\u7684\u4e13\u4e1a\u5185\u5bb9\u4e0e\u6311\u6218\uff0c\u5e76\u7ed9\u4e88\u5176\u201c\u4e13\u5bb6\u5b66\u5f92\u201d\u822c\u7684\u91cd\u89c6\u611f\u3011**\u3002\n\n```json\n{\"core_type\": \"T3 \u6b7b\u78d5\u5b66\u9738\u578b\", \"risk_level\": \"\u6781\u4f4e\", \"refund_risk\": \"\u6781\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\"}\n```";
