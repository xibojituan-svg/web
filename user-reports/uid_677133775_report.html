    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a (UID: 677133775)\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u4f4e**\u3002\u7528\u6237\u5168\u7a0b\u4e92\u52a8\u79ef\u6781\uff0c\u6309\u65f6\u5b8c\u6210\u6240\u6709\u5b66\u4e60\u4efb\u52a1\uff08\u6668\u7ec3\u3001\u542c\u8bfe\u3001\u6253\u5361\u3001\u4f5c\u4e1a\uff09\uff0c\u8868\u73b0\u51fa\u8f83\u9ad8\u7684\u5b66\u4e60\u670d\u4ece\u6027\u548c\u5bf9\u201c\u53d8\u73b0\u201d\u3001\u201c\u63a5\u5355\u201d\u7684\u660e\u786e\u5174\u8da3\u3002\u4f46**\u6838\u5fc3\u9a71\u52a8\u529b\u4e3a\u7ecf\u6d4e\u538b\u529b**\uff08\u201c\u9762\u4e34\u5931\u4e1a \u6ca1\u6709\u79ef\u84c4\u201d\u3001\u201c\u62c5\u5fc3\u6ca1\u94b1\u8fd8\u6b3e\u201d\uff09\uff0c\u5b66\u4e60\u76ee\u6807\u9ad8\u5ea6\u529f\u5229\u5316\uff0c\u5bf9\u6709\u58f0\u884c\u4e1a\u672c\u8eab\u7684\u70ed\u7231\u6216\u957f\u671f\u804c\u4e1a\u89c4\u5212\u4fe1\u53f7\u5f31\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u6781\u4f4e**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u9762\u4e34\u5931\u4e1a \u6ca1\u6709\u79ef\u84c4\u201d\uff0c\u7ecf\u6d4e\u72b6\u51b5\u7d27\u5f20\uff0c\u652f\u4ed82380\u5143\u8bfe\u7a0b\u8d39\u5b58\u5728\u660e\u663e\u56f0\u96be\u3002\u9500\u552e\u6700\u7ec8\u5f15\u5bfc\u5176\u652f\u4ed8400\u5143\uff08\u7591\u4f3c\u4f4e\u4ef7\u5f15\u6d41\u8bfe\u6216\u9996\u671f\u6b3e\uff09\u3002\u65e0\u7a33\u5b9a\u6536\u5165\u6765\u6e90\uff0c\u6297\u98ce\u9669\u80fd\u529b\u6781\u5dee\u3002**\u6280\u672f\u8bbe\u5907**\u4ec5\u63d0\u53ca\u624b\u673a\uff0c\u5bf9\u9700\u7535\u8111\u64cd\u4f5c\u7684\u201c\u559c\u64adA+\u201d\u5e73\u53f0\u6709\u7591\u95ee\uff0c\u6697\u793a\u786c\u4ef6\u8d44\u6e90\u53ef\u80fd\u4e0d\u8db3\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u4e2d\u4f4e**\u3002\u5728\u9ad8\u538b\u9500\u552e\u8282\u594f\u4e0b\uff08\u9650\u65f6\u4f18\u60e0\u3001\u540d\u989d\u7d27\u8feb\u3001\u540c\u4faa\u538b\u529b\uff09\uff0c\u7528\u6237\u8868\u73b0\u51fa\u4e00\u5b9a\u7684**\u7126\u8651\u548c\u4ece\u4f17**\u3002\u867d\u80fd\u5b8c\u6210\u6307\u4ee4\uff0c\u4f46\u51b3\u7b56\u72b9\u8c6b\uff08\u53cd\u590d\u8be2\u95ee\u7ec6\u8282\u3001\u6700\u7ec8\u5728\u591a\u6b21\u50ac\u4fc3\u4e0b\u624d\u884c\u52a8\uff09\uff0c\u9762\u5bf9\u7ecf\u6d4e\u538b\u529b\u65f6\u8868\u73b0\u51fa\u65e0\u529b\u611f\uff0c\u4f9d\u8d56\u9500\u552e\u63d0\u4f9b\u89e3\u51b3\u65b9\u6848\uff08\u201c400\u201d\uff09\u3002\u6297\u538b\u80fd\u529b\u548c\u72ec\u7acb\u51b3\u7b56\u529b\u504f\u5f31\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: \u5df2\u652f\u4ed8\u3002\u7528\u6237\u6700\u7ec8\u652f\u4ed8\u4e86400\u5143\uff08\u9500\u552e\u5f15\u5bfc\u7684\u201c\u4e24\u4e2a\u6708\u201d\u4f4e\u4ef7\u9009\u9879\uff09\uff0c\u5b8c\u6210\u4e86\u62a5\u540d\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u6216\u914d\u5076\u7684\u8ba8\u8bba\uff0c\u7528\u6237\u4ee5\u72ec\u7acb\u4e2a\u4f53\u8eab\u4efd\u8fdb\u884c\u6c9f\u901a\u548c\u51b3\u7b56\u3002\u9274\u4e8e\u5176\u7ecf\u6d4e\u62ee\u636e\u72b6\u6001\uff0c**\u5b58\u5728\u5bb6\u5ead\u4e0d\u77e5\u60c5\u6216\u53cd\u5bf9\u7684\u6f5c\u5728\u98ce\u9669**\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u4e0e\u8d44\u6e90\u5339\u914d**: **\u4e0d\u5339\u914d (D\u7c7b\u98ce\u9669)**\u3002\u7528\u6237\u52a8\u673a\uff08\u5feb\u901f\u53d8\u73b0\u89e3\u51b3\u751f\u8ba1\uff09\u4e0e\u8bfe\u7a0b\u80fd\u63d0\u4f9b\u7684\u4ef7\u503c\uff08\u9700\u8981\u957f\u671f\u7cfb\u7edf\u5b66\u4e60\u4e0e\u7ec3\u4e60\u624d\u80fd\u53d8\u73b0\uff09\u5b58\u5728**\u4e25\u91cd\u9519\u914d**\u3002\u5176\u6781\u4f4e\u7684\u8d44\u6e90\u5e95\u5ea7\uff08\u65e0\u79ef\u84c4\u3001\u5931\u4e1a\uff09\u65e0\u6cd5\u652f\u6491\u53ef\u80fd\u957f\u8fbe\u6570\u6708\u65e0\u6536\u5165\u7684\u5b66\u4e60\u6295\u5165\u671f\u3002\n*   **\u6b65\u9aa42 - \u627f\u8bfa\u5ea6\u4e0e\u6267\u884c\u529b**: \u8868\u9762\u627f\u8bfa\u5ea6\u9ad8\uff08\u4efb\u52a1\u5b8c\u6210\u5ea6100%\uff09\uff0c\u4f46\u6267\u884c\u529b\u6e90\u4e8e\u9500\u552e\u7684\u5916\u90e8\u9a71\u52a8\u548c\u4efb\u52a1\u6307\u4ee4\uff0c\u800c\u975e\u5185\u9a71\u529b\u3002\u9762\u5bf9\u771f\u5b9e\u4ed8\u8d39\u51b3\u7b56\u65f6\u8868\u73b0\u51fa\u663e\u8457\u72b9\u8c6b\u3002\n*   **\u6b65\u9aa43 - \u51b3\u7b56\u6a21\u5f0f**: \u8868\u73b0\u4e3a**\u7126\u8651-\u4ece\u4f17\u578b\u51b3\u7b56**\u3002\u5728\u9500\u552e\u8425\u9020\u7684\u201c\u540d\u989d\u6709\u9650\u201d\u3001\u201c\u540c\u5b66\u5df2\u884c\u52a8\u201d\u7684\u7d27\u8feb\u6c1b\u56f4\u4e0b\uff0c\u6700\u7ec8\u4ee5\u6700\u4f4e\u6210\u672c\uff08400\u5143\uff09\u5165\u573a\uff0c\u51b3\u7b56\u6838\u5fc3\u662f\u7f13\u89e3\u5f53\u4e0b\u7684\u7126\u8651\u548c\u201c\u9519\u8fc7\u673a\u4f1a\u201d\u7684\u6050\u60e7\uff0c\u800c\u975e\u7406\u6027\u8bc4\u4f30\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**: **D\u7c7b (\u9ad8\u98ce\u9669\u6613\u6d41\u5931\u578b)**\u3002\u7528\u6237\u5904\u4e8e\u201c\u9ad8\u52a8\u673a\u3001\u96f6\u8d44\u6e90\u3001\u4f4e\u5f39\u6027\u201d\u7684\u5371\u9669\u7ec4\u5408\u4e2d\uff0c\u6781\u6613\u56e0\u201c\u6295\u5165\u540e\u65e0\u6cd5\u5feb\u901f\u53d8\u73b0\u201d\u800c\u5931\u671b\uff0c\u9000\u8d39\u6295\u8bc9\u98ce\u9669\u6781\u9ad8\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b: T7 \u751f\u8ba1\u9a71\u52a8\u6295\u673a\u8005**\u3002\n    *   **\u6838\u5fc3\u7279\u5f81**: \u88ab\u6025\u8feb\u7684\u7ecf\u6d4e\u538b\u529b\uff08\u5931\u4e1a\uff09\u9a71\u52a8\uff0c\u5c06\u8bfe\u7a0b\u89c6\u4e3a\u201c\u6551\u547d\u7a3b\u8349\u201d\u6216\u5feb\u901f\u8d5a\u94b1\u7684\u6377\u5f84\u3002\u5bf9\u884c\u4e1a\u8ba4\u77e5\u80a4\u6d45\uff0c\u671f\u5f85\u4f4e\u6295\u5165\u9ad8\u56de\u62a5\u3001\u77ed\u5e73\u5feb\u7684\u53d8\u73b0\u8def\u5f84\u3002\n    *   **\u884c\u4e3a\u5370\u8bc1**: \u5173\u6ce8\u201c\u63a5\u5355\u65b9\u5f0f\u201d\u3001\u201c\u8d5a\u94b1\u5c97\u4f4d\u201d\u3001\u201c\u559c\u64adA+\u201d\uff08\u63a5\u5355\u5e73\u53f0\uff09\uff1b\u5f53\u9500\u552e\u63cf\u7ed8\u201c\u5b66\u5b8c\u5c31\u80fd\u63a5\u5355\u201d\u613f\u666f\u65f6\u4e92\u52a8\u79ef\u6781\uff1b\u4f46\u5728\u9762\u4e34\u5b9e\u9645\u4ed8\u8d39\u65f6\uff0c\u552f\u4e00\u4e14\u53cd\u590d\u7684\u987e\u8651\u5c31\u662f\u201c\u94b1\u201d\u3002\n    *   **\u5173\u952e\u96f7\u533a**: **\u5bf9\u5b66\u4e60\u5468\u671f\u548c\u53d8\u73b0\u96be\u5ea6\u7f3a\u4e4f\u73b0\u5b9e\u8ba4\u77e5**\uff0c\u9884\u671f\u4e25\u91cd\u504f\u79bb\u8bfe\u7a0b\u80fd\u63d0\u4f9b\u7684\u5b9e\u9645\u4ef7\u503c\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u9ad8)\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u9884\u671f\u7ba1\u7406\u5931\u6548 (\u6781\u9ad8\u98ce\u9669)**: \u9500\u552e\u8bdd\u672f\u5f3a\u8c03\u201c\u7b2c\u4e8c\u5468\u8bd5\u97f3\u201d\u3001\u201c\u5feb\u901f\u6323\u5230\u7b2c\u4e00\u6876\u91d1\u201d\u3001\u201c\u5b66\u5b8c\u5c31\u80fd\u7528\u4e0a\u201d\uff0c\u4e0e\u7528\u6237\u201c\u5feb\u901f\u89e3\u51b3\u751f\u8ba1\u201d\u7684\u8bc9\u6c42\u9ad8\u5ea6\u5171\u9e23\uff0c\u4f46\u4e25\u91cd\u6de1\u5316\u4e86\u4e13\u4e1a\u5b66\u4e60\u7684\u957f\u671f\u6027\u548c\u4e0d\u786e\u5b9a\u6027\u3002**\u8fd9\u662f\u6700\u4e3b\u8981\u7684\u9000\u8d39\u8bf1\u56e0**\u3002\n    2.  **\u652f\u4ed8\u80fd\u529b\u4e0d\u8db3 (\u9ad8\u98ce\u9669)**: \u7528\u6237\u5df2\u5904\u4e8e\u201c\u5931\u4e1a\u65e0\u79ef\u84c4\u201d\u72b6\u6001\uff0c400\u5143\u652f\u51fa\u53ef\u80fd\u5df2\u662f\u5176\u8d22\u52a1\u6781\u9650\u3002\u4efb\u4f55\u540e\u7eed\u7684\u7eed\u8d39\u538b\u529b\u6216\u77ed\u671f\u5185\u65e0\u6536\u5165\uff0c\u90fd\u4f1a\u76f4\u63a5\u89e6\u53d1\u652f\u4ed8\u540e\u6094\u548c\u9000\u8d39\u8bc9\u6c42\u3002\n    3.  **\u4ea7\u54c1\u9519\u914d (\u9ad8\u98ce\u9669)**: \u7528\u6237\u9700\u8981\u7684\u53ef\u80fd\u662f\u96f6\u95e8\u69db\u7684\u517c\u804c\u4fe1\u606f\u6216\u77ed\u671f\u6280\u80fd\u5305\uff0c\u800c\u975e\u9700\u8981\u7cfb\u7edf\u6295\u5165\u7684\u957f\u671f\u8bfe\u7a0b\u3002\u73b0\u6709\u4ea7\u54c1\u4e0e\u5176\u9700\u6c42\u9519\u914d\u3002\n    4.  **\u51b3\u7b56\u975e\u7406\u6027 (\u4e2d\u9ad8\u98ce\u9669)**: \u5728\u7126\u8651\u548c\u4ece\u4f17\u538b\u529b\u4e0b\u652f\u4ed8\uff0c\u51b7\u9759\u540e\u6613\u53cd\u6094\u3002\n    5.  \u5bb6\u5ead\u53cd\u5bf9\u3001\u5b66\u4e60\u6548\u679c\u4e0d\u4f73\u3001\u670d\u52a1\u4f53\u9a8c\u95ee\u9898\u7b49\u98ce\u9669\u56e0\u4fe1\u606f\u4e0d\u8db3\u6682\u65e0\u6cd5\u8bc4\u4f30\uff0c\u4f46\u57fa\u4e8e\u5176\u72b6\u6001\uff0c\u5747\u53ef\u80fd\u6210\u4e3a\u6b21\u8981\u89e6\u53d1\u70b9\u3002\n*   **\u7efc\u5408\u98ce\u9669\u7b49\u7ea7**: **\u9ad8**\u3002\u9884\u671f\u843d\u5dee\u4e0e\u652f\u4ed8\u80fd\u529b\u8106\u5f31\u53cc\u91cd\u53e0\u52a0\uff0c\u9000\u8d39\u6982\u7387\u6781\u5927\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5b58\u5728\u663e\u8457\u5408\u89c4\u7455\u75b5**:\n    *   **\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u8bef\u5bfc**: \u9500\u552e\u591a\u6b21\u4f7f\u7528\u201c\u5b66\u5b8c\u5c31\u80fd\u63a5\u5355\u201d\u3001\u201c\u7b2c\u4e8c\u5468\u5f00\u901a\u8bd5\u97f3\u201d\u3001\u201c\u5feb\u901f\u6323\u5230\u7b2c\u4e00\u6876\u91d1\u201d\u7b49\u8bdd\u672f\uff0c**\u53ef\u80fd\u6784\u6210\u5bf9\u5b66\u4e60\u6210\u679c\u548c\u53d8\u73b0\u901f\u5ea6\u7684\u5938\u5927\u5ba3\u4f20**\uff0c\u672a\u5145\u5206\u63d0\u793a\u884c\u4e1a\u7ade\u4e89\u4e0e\u4e2a\u4eba\u52aa\u529b\u7684\u4e0d\u786e\u5b9a\u6027\u3002\n    *   **\u5229\u7528\u7126\u8651\u4e0e\u7d27\u8feb\u611f**: \u9891\u7e41\u4f7f\u7528\u201c\u540d\u989d\u6709\u9650\u201d\u3001\u201c\u6700\u540e\u4e00\u5929\u201d\u3001\u201c\u5176\u4ed6\u540c\u5b66\u5df2\u884c\u52a8\u201d\u7b49\u8bdd\u672f\uff0c\u5bf9\u7ecf\u6d4e\u72b6\u51b5\u672c\u5df2\u8106\u5f31\u7684\u7528\u6237\u65bd\u52a0\u4e0d\u5f53\u538b\u529b\u3002\n    *   **\u672a\u5145\u5206\u8fdb\u884c\u98ce\u9669\u63d0\u793a\u4e0e\u627f\u53d7\u80fd\u529b\u8bc4\u4f30**: \u5728\u660e\u77e5\u7528\u6237\u201c\u9762\u4e34\u5931\u4e1a \u6ca1\u6709\u79ef\u84c4\u201d\u7684\u60c5\u51b5\u4e0b\uff0c\u4f9d\u7136\u5f15\u5bfc\u5176\u4ed8\u8d39\uff0c**\u672a\u5bf9\u5176\u8d22\u52a1\u98ce\u9669\u627f\u53d7\u80fd\u529b\u8fdb\u884c\u5ba1\u614e\u8bc4\u4f30\u548c\u63d0\u793a**\u3002\n    *   **\u4ef7\u683c\u4fe1\u606f\u4e0d\u900f\u660e**: \u4ece2380\u5143\u76f4\u63a5\u5f15\u5bfc\u81f3400\u5143\uff0c\u672a\u6e05\u6670\u8bf4\u660e400\u5143\u5bf9\u5e94\u7684\u5177\u4f53\u4ea7\u54c1\u3001\u670d\u52a1\u671f\u9650\u3001\u540e\u7eed\u5347\u7ea7\u8def\u5f84\u53ca\u8d39\u7528\uff0c\u5b58\u5728\u8bf1\u5bfc\u4f4e\u4ef7\u5165\u5c40\u518d\u8f6c\u5316\u7684\u5acc\u7591\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **24\u5c0f\u65f6\u5185\u542f\u52a8\u9884\u671f\u6821\u6b63\u4e0e\u98ce\u9669\u5b89\u629a**\u3002\n*   **\u884c\u52a8\u6307\u5357**:\n    1.  **\u7d27\u6025\u9884\u671f\u7ba1\u7406**: \u8054\u7cfb\u7528\u6237\uff0c\u9996\u8981\u4efb\u52a1\u662f**\u5927\u5e45\u964d\u4f4e\u5176\u77ed\u671f\u53d8\u73b0\u9884\u671f**\u3002\u6e05\u6670\u8bf4\u660e\uff1a400\u5143\u8bfe\u7a0b\u7684\u6027\u8d28\u3001\u5b66\u4e60\u5185\u5bb9\u3001\u4ee5\u53ca\u4ece\u5b66\u4e60\u5230\u63a5\u5355\u7684**\u771f\u5b9e\u8def\u5f84\u3001\u65f6\u95f4\u5468\u671f\u548c\u6240\u9700\u52aa\u529b**\u3002\u5f3a\u8c03\u6709\u58f0\u884c\u4e1a\u7684\u79ef\u7d2f\u5c5e\u6027\uff0c\u7834\u9664\u201c\u5feb\u901f\u81f4\u5bcc\u201d\u5e7b\u60f3\u3002\n    2.  **\u8d22\u52a1\u98ce\u9669\u6c9f\u901a**: \u53cb\u597d\u8be2\u95ee\u5176\u652f\u4ed8400\u5143\u540e\u662f\u5426\u5f71\u54cd\u57fa\u672c\u751f\u6d3b\uff0c\u660e\u786e\u540e\u7eed\u662f\u5426\u6709\u5176\u4ed6\u6536\u8d39\u9879\u76ee\uff0c\u907f\u514d\u4ea7\u751f\u4e8c\u6b21\u6d88\u8d39\u8bef\u89e3\u3002\n    3.  **\u5efa\u7acb\u4fe1\u4efb\uff0c\u63d0\u4f9b\u771f\u5b9e\u4ef7\u503c**: \u907f\u514d\u7ee7\u7eed\u753b\u997c\u3002\u8f6c\u800c\u63d0\u4f9b\u5207\u5b9e\u53ef\u884c\u7684\u5b66\u4e60\u8ba1\u5212\u3001\u514d\u8d39\u7684\u7ec3\u4e60\u8d44\u6e90\u548c\u5165\u95e8\u6307\u5bfc\uff0c\u5e2e\u52a9\u5176\u5efa\u7acb\u201c\u5148\u5b66\u4e60\uff0c\u540e\u53d8\u73b0\u201d\u7684\u6b63\u786e\u8ba4\u77e5\u3002\n    4.  **\u98ce\u9669\u9884\u6848\u51c6\u5907**: \u5c06\u8be5\u5b66\u5458\u6807\u8bb0\u4e3a**\u9ad8\u9000\u8d39\u98ce\u9669\u7528\u6237**\u3002\u670d\u52a1\u8fc7\u7a0b\u4e2d\u4fdd\u7559\u6240\u6709\u6c9f\u901a\u8bb0\u5f55\uff0c\u7279\u522b\u662f\u5173\u4e8e\u5b66\u4e60\u9884\u671f\u548c\u8bfe\u7a0b\u8bf4\u660e\u7684\u90e8\u5206\u3002\u4e00\u65e6\u7528\u6237\u63d0\u51fa\u9000\u8d39\uff0c\u5e94\u542f\u52a8\u5feb\u901f\u54cd\u5e94\u673a\u5236\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u8bc4\u4f30**: **\u4e25\u91cd\u9519\u914d**\u3002\u5f53\u524d\u4ea7\u54c1\uff08\u7cfb\u7edf\u8bfe\uff09\u4e0e\u7528\u6237\u6025\u8feb\u7684\u751f\u8ba1\u9700\u6c42\u548c\u8106\u5f31\u7684\u8d44\u6e90\u5e95\u5ea7\u5b8c\u5168\u4e0d\u5339\u914d\u3002\u66f4\u5408\u9002\u7684\u53ef\u80fd\u662f\u514d\u8d39\u7684\u804c\u4e1a\u6307\u5bfc\u3001\u4f4e\u4ef7\u7684\u5355\u70b9\u6280\u80fd\u8bfe\u6216\u660e\u786e\u7684\u517c\u804c\u4fe1\u606f\u6e20\u9053\u3002**\u4ece\u5546\u4e1a\u4f26\u7406\u548c\u98ce\u9669\u63a7\u5236\u89d2\u5ea6\uff0c\u5e94\u8003\u8651\u4e3a\u5176\u5f00\u901a\u7eff\u8272\u9000\u8d39\u901a\u9053**\u3002\n\n{\"core_type\": \"T7 \u751f\u8ba1\u9a71\u52a8\u6295\u673a\u8005\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"product_match\": \"\u9519\u914d\", \"action\": \"24h\u5185\u542f\u52a8\u9884\u671f\u6821\u6b63\u4e0e\u98ce\u9669\u5b89\u629a\"}";
