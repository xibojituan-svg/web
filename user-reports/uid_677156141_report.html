    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4e2d\u7f3a\u5931\u5173\u952e\u4fe1\u606f\uff0c\u5305\u62ec\uff1a**\u652f\u4ed8\u65b9\u5f0f\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u5177\u4f53\u8d44\u91d1\u72b6\u51b5\u3001\u8fc7\u5f80\u804c\u4e1a\u80cc\u666f\u3001\u8be6\u7ec6\u65f6\u95f4\u5b89\u6392**\u3002\u4ee5\u4e0b\u5206\u6790\u57fa\u4e8e\u6709\u9650\u4fe1\u606f\u63a8\u5bfc\uff0c\u9700\u540e\u7eed\u8865\u5145\u3002\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677156141 (\u6635\u79f0\uff1a\u8d77\u540d\u771f\u96be) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u828b\u59341(\u8096\u777f) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u542f\u822a\u7cbe\u82f1\u73ed (\u5177\u4f53\u4ef7\u683c\u672a\u77e5) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | [\u4fe1\u606f\u7f3a\u5931] |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1 (\u5f53\u524d\u6709\u4e00\u4e2a\u6708\u7a7a\u4f59\uff0c\u4e94\u6708\u540e\u6709\u4e3b\u4e1a\uff0c\u9700\u5e73\u8861\u65f6\u95f4) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | [\u4fe1\u606f\u7f3a\u5931] |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u60f3\u5229\u7528\u788e\u7247\u65f6\u95f4\u505a\u517c\u804c\uff0c\u6709\u957f\u671f\u6253\u7b97\uff0c\u4f46**\u6781\u5ea6\u8c28\u614e\uff0c\u53cd\u590d\u9a8c\u8bc1\u53ef\u884c\u6027**\uff0c\u5bf9\u201c\u5feb\u901f\u53d8\u73b0\u201d\u7684\u6e34\u671b\u88ab\u5f3a\u70c8\u7684\u98ce\u9669\u89c4\u907f\u610f\u8bc6\u5bf9\u51b2\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u5012\u662f\u66f4\u770b\u91cd\u8fd9\u4e2a\u5de5\u4f5c\u5230\u5e95\u9002\u4e0d\u9002\u5408\u6211\uff0c\u5982\u679c\u4e0d\u9002\u5408\u6211\u7684\u8bdd\u53cd\u800c\u4f1a\u7ed9\u6211\u6dfb\u9ebb\u70e6\uff0c\u4e5f\u4f1a\u7ed9\u4f60\u4eec\u6dfb\u9ebb\u70e6\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 \u672a\u63d0\u53ca\u652f\u4ed8\u80fd\u529b\uff0c\u4f46\u8868\u73b0\u51fa\u5bf9\u201c\u4fbf\u5b9c\u5355\u201d\u548c\u201c\u4e0d\u8d5a\u94b1\u201d\u7684\u654f\u611f\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4f4e] \u2014 \u660e\u786e\u8868\u793a\u201c\u6b63\u597d\u6211\u6709\u4e00\u4e2a\u6708\u7684\u7a7a\u4f59\u65f6\u95f4\uff0c\u4e94\u6708\u4efd\u6709\u5de5\u4f5c\u201d\uff0c\u4e3b\u4e1a\u8f83\u5fd9\uff0c\u9700\u5e73\u8861\u65f6\u95f4\u3002\u65f6\u95f4\u7a97\u53e3\u660e\u786e\u4f46\u6709\u9650\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b07\u4f4e\u6781\u5371]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56\u3002\u7528\u6237\u8868\u73b0\u51fa**\u5f3a\u70c8\u7684\u4e0d\u81ea\u4fe1**\uff08\u201c\u53ef\u80fd\u662f\u6211\u5e74\u7eaa\u5927\u4e86\uff0c\u8ddf\u4e0d\u4e0a\u65f6\u4ee3\u4e86\u201d\uff09\uff0c\u5bf9\u672a\u77e5\u9886\u57df\u6709**\u9ad8\u5ea6\u7126\u8651\u548c\u6000\u7591**\uff0c\u51b3\u7b56\u8fc7\u7a0b\u53cd\u590d\u6447\u6446\uff0c\u6781\u6613\u53d7\u5916\u90e8\u8d1f\u9762\u4fe1\u606f\u5f71\u54cd\uff08\u641c\u5230\u8d1f\u9762\u8bc4\u4ef7\u540e\u7acb\u5373\u8981\u6c42\u9000\u6b3e\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4e0d\u597d\u610f\u601d\u4ee5\u524d\u88ab\u9a97\u8fc7\u6240\u4ee5\u6709\u70b9\u8c28\u614e\u3002\u201d > \u201c\u6211\u521a\u521a\u53bb\u641c\u4e86\u4e00\u4e0b\uff0c\u5f55\u7248\u6743\u4e66\u8fd9\u4e2a\u4e8b\u60c5\u90fd\u8bf4\u4e0d\u8d5a\u94b1\u3002\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u672a\u77e5\u98ce\u9669\u7684\u6781\u5ea6\u6050\u60e7\u548c\u5bf9\u81ea\u6211\u80fd\u529b\u7684\u4e0d\u786e\u5b9a**\u3002\u4ed6\u5e76\u975e\u5355\u7eaf\u8ffd\u6c42\u91d1\u94b1\uff0c\u800c\u662f\u6781\u5ea6\u6e34\u671b\u4e00\u4efd\u201c\u5b89\u5168\u3001\u53ef\u63a7\u3001\u4e0d\u6dfb\u9ebb\u70e6\u201d\u7684\u526f\u4e1a\u5c1d\u8bd5\uff0c\u4ee5\u5bf9\u51b2\u751f\u6d3b\u7684\u4e0d\u786e\u5b9a\u6027\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u786e\u5b9a\u611f\u548c\u5b89\u5168\u611f**\u3002\u9700\u8981\u4e3a\u4ed6\u6784\u5efa\u4e00\u4e2a\u201c\u96f6\u98ce\u9669\u3001\u53ef\u968f\u65f6\u9000\u51fa\u201d\u7684\u6c99\u76d2\u73af\u5883\uff0c\u5e76\u63d0\u4f9b\u6301\u7eed\u7684\u6b63\u5411\u53cd\u9988\uff0c\u5bf9\u6297\u5176\u5185\u5728\u7684\u81ea\u6211\u6000\u7591\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfea **C1** \u7c7b (\u52a8\u673a\u4e2d\u7b49\u4f46\u5fc3\u7406\u5f39\u6027\u6781\u4f4e\uff0c\u8d44\u6e90\u5e95\u5ea7\u4e0d\u660e\uff0c\u51b3\u7b56\u72b9\u8c6b\uff0c\u98ce\u9669\u9ad8) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u6838\u5fc3\u7279\u5f81\uff1a\u60c5\u7eea\u4f9d\u8d56\u5f3a\uff0c\u6613\u53d7\u632b\uff0c\u51b3\u7b56\u53cd\u590d\uff0c\u9700\u8981\u5927\u91cf\u5b89\u629a\u548c\u786e\u5b9a\u6027) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u7b49\u6781\u7aef\u60c5\u51b5)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a/\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | [\u4f4e] | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u56e0\u5176\u72ec\u7acb\u51b3\u7b56\uff0c\u98ce\u9669\u6682\u4f4e\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **[\u9ad8]** | **\u4e94\u6708\u4e3b\u4e1a\u5f00\u59cb\u540e\uff0c\u65f6\u95f4\u51b2\u7a81\u5bfc\u81f4\u65e0\u6cd5\u8ddf\u8fdb\u8bfe\u7a0b\u548c\u63a5\u5355\uff0c\u4ea7\u751f\u81ea\u8d23\u548c\u538b\u529b\uff0c\u6700\u7ec8\u653e\u5f03\u3002** |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **[\u6781\u9ad8]** | **\u9996\u6b21\u63a5\u5355\u53d7\u632b\u3001\u8bbe\u5907\u64cd\u4f5c\u9047\u5230\u56f0\u96be\u3001\u542c\u5230\u8d1f\u9762\u884c\u4e1a\u4fe1\u606f\u3001\u6216\u611f\u89c9\u201c\u8ddf\u4e0d\u4e0a\u201d\u5176\u4ed6\u5b66\u5458\u65f6\uff0c\u81ea\u5c0a\u5fc3\u53d7\u632b\uff0c\u7acb\u5373\u8981\u6c42\u9000\u6b3e\u3002** |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **[\u9ad8]** | **\u8fdb\u5165\u5267\u793e\u540e\u53d1\u73b0\u201c\u4fbf\u5b9c\u5355\u201d\uff08\u4e09\u4e94\u5341/\u5c0f\u65f6\uff09\u6536\u5165\u4e0e\u9884\u671f\u4e0d\u7b26\uff0c\u6216\u77ed\u671f\u5185\u672a\u63a5\u5230\u5355\uff0c\u4ea7\u751f\u201c\u88ab\u9a97\u201d\u611f\u3002** |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e48\u5c0f\u65f6\u5185\uff0c\u6216\u8fdb\u5165\u5267\u793e\u5c1d\u8bd5\u63a5\u5355/\u5b8c\u6210\u7b2c\u4e00\u6b21\u4f5c\u4e1a\u540e\u768424\u5c0f\u65f6\u5185**\u3002\u4efb\u4f55\u5fae\u5c0f\u7684\u632b\u6298\u90fd\u53ef\u80fd\u6210\u4e3a\u5bfc\u706b\u7d22\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u8d77\u540d\u540c\u5b66\uff0c\u770b\u5230\u4f60\u62a5\u540d\u4e86\uff0c\u7279\u522b\u7406\u89e3\u4f60\u6bcf\u4e00\u6b65\u90fd\u60f3\u8d70\u5f97\u7a33\u59a5\u7684\u5fc3\u60c5\u3002\u54b1\u4eec\u4e0d\u7740\u6025\uff0c\u8fd9\u4e2a\u6708\u4f60\u5c31\u5f53\u6765\u2018\u5b9e\u4e60\u2019\u4f53\u9a8c\u7684\uff0c\u6709\u4efb\u4f55\u4e00\u70b9\u89c9\u5f97\u4e0d\u5408\u9002\u3001\u4e0d\u8212\u670d\u7684\u5730\u65b9\uff0c\u4f60\u968f\u65f6\u8ddf\u6211\u8bf4\u3002\u6211\u4eec\u7684\u76ee\u6807\u4e0d\u662f\u8ba9\u4f60\u9a6c\u4e0a\u6210\u4e3a\u5927\u795e\uff0c\u800c\u662f\u5e2e\u4f60\u5b89\u5168\u5730\u5f04\u6e05\u695a\u2018\u8fd9\u4e8b\u5230\u5e95\u9002\u4e0d\u9002\u5408\u6211\u2019\uff0c\u4f60\u653e\u8f7b\u677e\uff0c\u6211\u966a\u4f60\u4e00\u8d77\u8bd5\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf**\u3011\u3002\u6838\u5fc3\u662f\u63d0\u4f9b\u60c5\u7eea\u4ef7\u503c\u548c\u5b89\u5168\u611f\uff0c\u800c\u975e\u65bd\u52a0\u538b\u529b\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n    1.  **\u3010\u96f6\u538b\u529b\u5c1d\u9c9c\u5305\u3011**\uff1a\u63d0\u4f9b\u6700\u7b80\u5355\u7684\u3001\u65e0\u8003\u6838\u7684\u201c\u4f53\u9a8c\u5355\u201d\uff0c\u8ba9\u4ed6\u5148\u611f\u53d7\u201c\u5b8c\u6210\u201d\u7684\u6210\u5c31\u611f\u3002\n    2.  **\u30101V1\u8f6f\u6027\u542f\u52a8\u966a\u8dd1\u3011**\uff1a\u73ed\u4e3b\u4efb\u6216\u52a9\u6559\u524d\u671f\u9ad8\u5f3a\u5ea61\u5bf91\u8ddf\u8fdb\uff0c\u624b\u628a\u624b\u89e3\u51b3\u8bbe\u5907\u3001\u8f6f\u4ef6\u7b49\u64cd\u4f5c\u95ee\u9898\uff0c\u9632\u6b62\u5176\u56e0\u6280\u672f\u95ee\u9898\u7834\u9632\u3002\n    3.  **\u3010\u907f\u5751\u4fe1\u606f\u8327\u623f\u3011**\uff1a\u4e3b\u52a8\u63d0\u4f9b\u6b63\u9762\u5b66\u5458\u6848\u4f8b\u548c\u884c\u4e1a\u79d1\u666e\uff0c\u907f\u514d\u5176\u81ea\u884c\u641c\u7d22\u5230\u8d1f\u9762\u4fe1\u606f\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1.  \u7edd\u4e0d\u5bf9\u4ed6\u4f7f\u7528\u7fa4\u4f53\u6bd4\u8f83\u6216\u65bd\u538b\u8bdd\u672f\uff08\u5982\u201c\u522b\u4eba\u90fd\u600e\u6837\u4e86\u201d\uff09\u3002\n    2.  \u7edd\u4e0d\u5728\u4ed6\u8868\u8fbe\u56f0\u96be\u65f6\u8bb2\u5927\u9053\u7406\uff0c\u5fc5\u987b\u5148\u5171\u60c5\u3002\n    3.  \u7edd\u4e0d\u627f\u8bfa\u77ed\u671f\u5185\u9ad8\u6536\u76ca\uff0c\u91cd\u70b9\u5f3a\u8c03\u201c\u5b89\u5168\u4f53\u9a8c\u201d\u548c\u201c\u80fd\u529b\u6210\u957f\u201d\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u5efa\u7acb\u5145\u5206\u4fe1\u4efb\u3001\u4e14\u5176\u6709\u660e\u663e\u6b63\u5411\u6210\u679c\u524d\uff0c\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u4f1a\u76f4\u63a5\u89e6\u53d1\u4fe1\u4efb\u5d29\u584c\u548c\u9000\u8d39\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u5012\u662f\u66f4\u770b\u91cd\u8fd9\u4e2a\u5de5\u4f5c\u5230\u5e95\u9002\u4e0d\u9002\u5408\u6211\uff0c\u5982\u679c\u4e0d\u9002\u5408\u6211\u7684\u8bdd\u53cd\u800c\u4f1a\u7ed9\u6211\u6dfb\u9ebb\u70e6\uff0c\u4e5f\u4f1a\u7ed9\u4f60\u4eec\u6dfb\u9ebb\u70e6\u3002\u201d\n2. > \u201c\u4e0d\u597d\u610f\u601d\u4ee5\u524d\u88ab\u9a97\u8fc7\u6240\u4ee5\u6709\u70b9\u8c28\u614e\u3002\u201d\n3. > \u201c\u6211\u521a\u521a\u53bb\u641c\u4e86\u4e00\u4e0b\uff0c\u5f55\u7248\u6743\u4e66\u8fd9\u4e2a\u4e8b\u60c5\u90fd\u8bf4\u4e0d\u8d5a\u94b1\u3002\u2026\u2026\u6211\u9009\u62e9\u9000\u6b3e\u3002\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6\u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u4e0e\u786e\u5b9a\u611f\uff08\u7126\u8651\u4fdd\u969c\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u201c\u96f6\u98ce\u9669\u6c99\u76d2\u201d\u4f53\u9a8c\uff0c\u73ed\u4e3b\u4efb\u8fdb\u884c\u9ad8\u5bc6\u5ea6\u3001\u9ad8\u5171\u60c5\u7684\u60c5\u7eea\u966a\u62a4\uff0c\u4e25\u9632\u4efb\u4f55\u5fae\u5c0f\u632b\u6298\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
