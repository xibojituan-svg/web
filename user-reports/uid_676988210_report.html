    <script>
        const markdownText = "\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e\u3002\u7f3a\u4e4f\u660e\u786e\u7684\u4ed8\u8d39\u8bfe\u7a0b\u4fe1\u606f\u3001\u5177\u4f53\u91d1\u989d\u3001\u5bb6\u5ead\u51b3\u7b56\u8005\u4fe1\u606f\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u3001\u804c\u4e1a/\u6536\u5165\u72b6\u51b5\u7b49\u5173\u952e\u7ef4\u5ea6\u3002\n\n# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u4e2d\u7b49**\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5b66\u4e60\u5174\u8da3\u548c\u7ec3\u4e60\u884c\u4e3a\uff08\u53cd\u590d\u7ec3\u4e60\u7ed5\u53e3\u4ee4\u3001\u6587\u672c\u3001\u89d2\u8272\u53f0\u8bcd\uff09\uff0c\u5e76\u4e3b\u52a8\u5bfb\u6c42\u5408\u4f5c\uff08\u201c\u8bf7\u6709\u65f6\u95f4\u610f\u5411\u548c\u6211\u5408\u4f5c\u7537\u89d2\u5bf9\u8bdd\u201d\uff09\uff0c\u663e\u793a\u5185\u5728\u5174\u8da3\u3002\u4f46**\u53d8\u73b0\u52a8\u673a\u4e0d\u660e\u786e**\uff0c\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u517c\u804c\u3001\u8d5a\u94b1\u7b49\u7ecf\u6d4e\u76ee\u6807\uff0c\u66f4\u591a\u662f\u6280\u80fd\u5b66\u4e60\u548c\u793e\u7fa4\u53c2\u4e0e\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u8f83\u4f4e**\u3002**\u6280\u672f\u64cd\u4f5c\u80fd\u529b\u660e\u663e\u8584\u5f31**\uff08\u591a\u6b21\u9047\u5230\u56de\u653e\u3001\u8f6f\u4ef6\u3001\u8bbe\u5907\u5b89\u88c5\u3001\u8bbe\u7f6e\u95ee\u9898\uff0c\u81ea\u79f0\u201c\u767d\u4e01\u201d\uff09\uff0c\u5b66\u4e60\u5de5\u5177\uff08\u559c\u9a6c\u62c9\u96c5APP\uff09\u83b7\u53d6\u5b58\u5728\u969c\u788d\u3002\u65f6\u95f4\u8d44\u6e90\u4f3c\u4e4e\u5145\u8db3\uff08\u9891\u7e41\u4e92\u52a8\u3001\u7ec3\u4e60\uff09\u3002\u7ecf\u6d4e\u8d44\u6e90\u672a\u77e5\uff0c\u4f46\u5df2\u8d2d\u4e70MK4\u8bbe\u5907\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u652f\u4ed8\u610f\u613f\u548c\u80fd\u529b\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u9ad8**\u3002\u7528\u6237**\u5b66\u4e60\u6001\u5ea6\u79ef\u6781**\uff0c\u575a\u6301\u6bcf\u65e5\u7ec3\u4e60\u6253\u5361\uff0c\u4f7f\u7528\u201c\u611f\u6069\u201d\u3001\u201c\u7ed9\u529b\u201d\u7b49\u6b63\u5411\u8bcd\u6c47\u3002\u9047\u5230\u64cd\u4f5c\u56f0\u96be\u65f6\uff08\u5982\u56de\u653e\u6253\u4e0d\u5f00\u3001\u753b\u672c\u4e0d\u4f1a\u7528\uff09\u4f1a\u591a\u6b21\u3001\u8010\u5fc3\u5730\u6c42\u52a9\uff08\u201c\u73ed\u73ed\u4e0d\u4f1a\u64cd\u4f5c\u4e86\u201d\uff09\uff0c\u800c\u975e\u62b1\u6028\u6216\u653e\u5f03\u3002\u60c5\u7eea\u8868\u8fbe\u7a33\u5b9a\uff0c\u6709\u5e7d\u9ed8\u611f\uff08\u201c\u672c\u5bab\u5df2\u77e5\u6653\u4e86\u201d\uff09\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u4e8e3\u670824\u65e5\u8d2d\u4e70\u4e86MK4\u8bbe\u5907\uff08\u201c\u4ed8\u5b8c\u6b3e\u4e86\u201d\uff09\uff0c\u5e76\u540e\u7eed\u8be2\u95ee\u53d1\u7968\u4e8b\u5b9c\u3002**\u4f46\u672a\u660e\u786e\u63d0\u53ca\u662f\u5426\u652f\u4ed8\u4e86\u8bfe\u7a0b\u5b66\u8d39**\uff0c\u6b64\u4e3a\u6838\u5fc3\u4fe1\u606f\u7f3a\u5931\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u5176\u4ed6\u6210\u5458\uff0c\u51b3\u7b56\u770b\u4f3c\u72ec\u7acb\u3002\u4f46\u8003\u8651\u5230\u7528\u6237\u5e74\u9f84\u53ef\u80fd\u504f\u5927\uff08\u4ece\u8bed\u8a00\u98ce\u683c\u63a8\u6d4b\uff09\uff0c\u9700\u8b66\u60d5**\u6f5c\u5728\u7684\u5bb6\u5ead\u53cd\u5bf9\u98ce\u9669**\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u4e0e\u8d44\u6e90\u521d\u6b65\u5224\u65ad**: M\u4e2d\u7b49\uff0cR\u8f83\u4f4e\uff0cE\u9ad8\u3002**\u52a8\u673a\u975e\u7eaf\u53d8\u73b0\u9a71\u52a8\uff0c\u4f46\u5b66\u4e60\u610f\u613f\u5f3a\uff1b\u8d44\u6e90\u77ed\u677f\uff08\u64cd\u4f5c\u80fd\u529b\uff09\u7a81\u51fa**\u3002\n*   **\u6b65\u9aa42 - \u627f\u8bfa\u5ea6\u4e0e\u6267\u884c\u529b\u5224\u65ad**: \u627f\u8bfa\u5ea6\u9ad8\uff08\u575a\u6301\u7ec3\u4e60\u3001\u6253\u5361\uff09\uff0c\u6267\u884c\u529b\u53d7\u9650\u4e8e\u64cd\u4f5c\u80fd\u529b\uff0c\u4f46\u6c42\u52a9\u610f\u613f\u5f3a\u3002\n*   **\u6b65\u9aa43 - \u98ce\u9669\u4e0e\u673a\u4f1a\u7efc\u5408\u5224\u5b9a**: \u7528\u6237\u5c5e\u4e8e**\u9ad8\u610f\u613f\u3001\u4f4e\u64cd\u4f5c\u95e8\u69db\u80fd\u529b**\u7684\u7c7b\u578b\u3002\u4e3b\u8981\u98ce\u9669\u6765\u81ea**\u6280\u672f\u64cd\u4f5c\u632b\u6298\u53ef\u80fd\u5f15\u53d1\u7684\u653e\u5f03**\uff0c\u800c\u975e\u52a8\u673a\u4e0d\u7eaf\u6216\u652f\u4ed8\u80fd\u529b\u95ee\u9898\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b: T4 \u5174\u8da3\u9a71\u52a8\u63a2\u7d22\u8005**\u3002\n    *   **\u4f9d\u636e**: \u6838\u5fc3\u9a71\u52a8\u529b\u662f\u5174\u8da3\u548c\u6280\u80fd\u63d0\u5347\uff08\u7ec3\u4e60\u7ed5\u53e3\u4ee4\u3001\u6717\u8bf5\u6563\u6587\u3001\u5c1d\u8bd5\u89d2\u8272\u6f14\u7ece\uff09\uff0c\u79ef\u6781\u53c2\u4e0e\u793e\u7fa4\u4e92\u52a8\uff08\u5bfb\u627e\u5408\u4f5c\uff09\uff0c\u800c\u975e\u9996\u8981\u5173\u6ce8\u53d8\u73b0\u3002\u5b66\u4e60\u8fc7\u7a0b\u672c\u8eab\u5e26\u6765\u6ee1\u8db3\u611f\uff08\u201c\u6c89\u6dc0\u4e3a\u6211\u7684\u2018\u58f0\u97f3\u6c14\u8d28\u2019\u201d\uff09\u3002**\u6280\u672f\u64cd\u4f5c\u662f\u5176\u4e3b\u8981\u969c\u788d**\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669\u7b49\u7ea7: \u4e2d**\u3002\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**: \u98ce\u9669**\u4e2d**\u3002\u7528\u6237\u76ee\u6807\u6a21\u7cca\uff08\u5174\u8da3\u63a2\u7d22\uff09\uff0c\u77ed\u671f\u4e0d\u6613\u91cf\u5316\u201c\u6548\u679c\u201d\uff0c\u4f46\u82e5\u957f\u671f\u65e0\u6b63\u5411\u53cd\u9988\uff08\u5982\u83b7\u5f97\u8ba4\u53ef\u3001\u5b8c\u6210\u4f5c\u54c1\uff09\u53ef\u80fd\u5931\u671b\u3002\n    2.  **\u65f6\u95f4\u7cbe\u529b\u4e0d\u8db3**: \u98ce\u9669**\u4f4e**\u3002\u7528\u6237\u4e92\u52a8\u9891\u7e41\uff0c\u663e\u793a\u65f6\u95f4\u6295\u5165\u610f\u613f\u5f3a\u3002\n    3.  **\u7ecf\u6d4e\u538b\u529b**: \u98ce\u9669**\u4f4e**\u3002\u5df2\u8d2d\u8bbe\u5907\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u56f0\u96be\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9**: \u98ce\u9669**\u4e2d**\u3002**\u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u4e3a\u6f5c\u5728\u96f7\u533a**\uff0c\u9700\u786e\u8ba4\u5bb6\u5ead\u662f\u5426\u77e5\u60c5\u652f\u6301\u3002\n    5.  **\u8bfe\u7a0b/\u670d\u52a1\u4f53\u9a8c\u5dee**: \u98ce\u9669**\u9ad8**\u3002**\u7528\u6237\u591a\u6b21\u906d\u9047\u64cd\u4f5c\u969c\u788d**\uff08\u56de\u653e\u8fdb\u4e0d\u53bb\u3001\u8f6f\u4ef6\u4e0d\u4f1a\u7528\u3001\u8bbe\u5907\u5b89\u88c5\u8c03\u8bd5\u56f0\u96be\uff09\uff0c\u4e14\u9500\u552e/\u552e\u540e\u6307\u5bfc\u6709\u65f6\u4e0d\u591f\u53ca\u65f6\u6216\u6e05\u6670\uff08\u5982\u753b\u672c\u95ee\u9898\u8ba9\u7528\u6237\u95ee\u7ec4\u957f\uff09\u3002\u8fd9\u662f\u5f53\u524d\u6700\u76f4\u63a5\u7684\u9000\u8d39\u89e6\u53d1\u70b9\u3002\n    6.  **\u7ade\u54c1/\u66ff\u4ee3\u65b9\u6848**: \u98ce\u9669**\u4f4e**\u3002\u672a\u63d0\u53ca\u3002\n    7.  **\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa**: \u98ce\u9669**\u4f4e**\u3002\u8bb0\u5f55\u4e2d\u9500\u552e\u63a8\u8350\u8bbe\u5907\uff0c\u4f46\u672a\u53d1\u73b0\u5938\u5927\u6536\u76ca\u7684\u627f\u8bfa\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u8bbe\u5907\u9500\u552e**: \u9500\u552e\u63a8\u8350\u4e86MK4\u8bbe\u5907\uff0c\u7528\u6237\u8d2d\u4e70\u3002\u9700\u6838\u67e5\u9500\u552e\u8fc7\u7a0b\u4e2d**\u662f\u5426\u6df7\u6dc6\u8bbe\u5907\u8d2d\u4e70\u4e0e\u8bfe\u7a0b\u6548\u679c\u627f\u8bfa**\uff0c\u8bb0\u5f55\u4e2d\u672a\u89c1\u660e\u663e\u8fdd\u89c4\u3002\n*   **\u77e5\u60c5\u540c\u610f**: **\u5173\u952e\u4fe1\u606f\u7f3a\u5931**\u3002\u672a\u770b\u5230\u8bfe\u7a0b\u4ef7\u683c\u3001\u670d\u52a1\u6761\u6b3e\u3001\u5b66\u4e60\u8def\u5f84\u3001\u9884\u671f\u6210\u679c\u7b49\u5173\u952e\u4fe1\u606f\u7684\u786e\u8ba4\u8fc7\u7a0b\u3002**\u9700\u7d27\u6025\u6838\u67e5**\u3002\n*   **\u8fc7\u5ea6\u670d\u52a1\u627f\u8bfa**: \u672a\u89c1\u3002\n*   **\u5bb6\u5ead\u51b3\u7b56**: **\u672a\u6838\u5b9e**\uff0c\u5b58\u5728\u9690\u60a3\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6: \u504f\u5dee**\u3002\u5f53\u524d\u4ea7\u54c1\uff08\u63a8\u6d4b\u4e3a\u6709\u58f0\u6f14\u64ad\u57f9\u8bad\uff09\u5bf9\u7528\u6237**\u64cd\u4f5c\u80fd\u529b\u8981\u6c42\u8f83\u9ad8**\uff0c\u4e0e\u7528\u6237\u201c\u4f4e\u64cd\u4f5c\u95e8\u69db\u80fd\u529b\u201d\u73b0\u72b6\u5b58\u5728\u504f\u5dee\u3002\u7528\u6237\u66f4\u9700\u8981**\u624b\u628a\u624b\u3001\u6781\u5ea6\u8010\u5fc3\u7684\u6280\u672f\u6307\u5bfc\u652f\u6301**\u3002\n*   **\u6700\u4f18\u5148\u52a8\u4f5c**: **\u7acb\u5373\u63d0\u4f9b\u4e00\u5bf9\u4e00\u6280\u672f\u4fdd\u59c6\u652f\u6301**\u3002\n*   **\u884c\u52a8\u6307\u5357**:\n    1.  **\u6280\u672f\u62a4\u822a**: \u6307\u5b9a\u4e13\u5c5e\u52a9\u6559\u6216\u6280\u672f\u5ba2\u670d\uff0c\u901a\u8fc7**\u8fdc\u7a0b\u534f\u52a9\u3001\u5206\u6b65\u622a\u56fe/\u89c6\u9891\u3001\u7b80\u5316\u6d41\u7a0b**\u7b49\u65b9\u5f0f\uff0c\u89e3\u51b3\u7528\u6237\u6240\u6709\u8f6f\u4ef6\u3001\u8bbe\u5907\u64cd\u4f5c\u95ee\u9898\u3002\u76ee\u6807\u662f\u8ba9\u7528\u6237\u201c\u80fd\u7528\u8d77\u6765\u201d\uff0c\u83b7\u5f97\u521d\u6b65\u6210\u5c31\u611f\u3002\n    2.  **\u76ee\u6807\u5171\u5851**: \u4e0e\u7528\u6237\u6c9f\u901a\uff0c\u660e\u786e\u4e00\u4e2a**\u77ed\u671f\u3001\u5177\u4f53\u3001\u53ef\u8fbe\u6210\u7684\u5c0f\u76ee\u6807**\uff08\u5982\uff1a\u5b8c\u6210\u4e00\u6bb51\u5206\u949f\u7684\u89d2\u8272\u914d\u97f3\u5e76\u53d1\u5e03\uff09\uff0c\u5c06\u5174\u8da3\u8f6c\u5316\u4e3a\u53ef\u89c1\u6210\u679c\uff0c\u5de9\u56fa\u5b66\u4e60\u52a8\u529b\u3002\n    3.  **\u5bb6\u5ead\u77e5\u60c5\u786e\u8ba4**: \u5728\u5408\u9002\u65f6\u673a\uff0c\u4ee5\u5173\u6000\u65b9\u5f0f**\u59d4\u5a49\u786e\u8ba4\u8bfe\u7a0b\u5b66\u4e60\u662f\u5426\u83b7\u5f97\u5bb6\u4eba\u652f\u6301**\u3002\n    4.  **\u793e\u7fa4\u8d4b\u80fd**: \u9f13\u52b1\u5176\u5728\u793e\u7fa4\u4e2d\u5c55\u793a\u7ec3\u4e60\u6210\u679c\uff08\u5982\u6717\u8bf5\uff09\uff0c\u83b7\u5f97\u540c\u4f34\u8ba4\u53ef\uff0c\u5f3a\u5316\u5176\u201c\u5174\u8da3\u63a2\u7d22\u8005\u201d\u7684\u8eab\u4efd\u8ba4\u540c\u3002\n    5.  **\u98ce\u9669\u76d1\u63a7**: \u5bc6\u5207\u5173\u6ce8\u5176\u540e\u7eed\u9047\u5230\u64cd\u4f5c\u56f0\u96be\u65f6\u7684\u60c5\u7eea\u53d8\u5316\uff0c\u4e00\u65e6\u51fa\u73b0\u70e6\u8e81\u3001\u6d88\u6781\u8a00\u8bba\uff0c\u9700\u7acb\u5373\u5347\u7ea7\u5904\u7406\u3002\n\n{\"core_type\": \"T4 \u5174\u8da3\u9a71\u52a8\u63a2\u7d22\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u7acb\u5373\u63d0\u4f9b\u4e00\u5bf9\u4e00\u6280\u672f\u4fdd\u59c6\u652f\u6301\"}";
