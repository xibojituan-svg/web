    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677153995 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6668\u516e\u5e08\u59d0(\u8096\u96ef\u99a8) -> \u53ef\u4e3d\u513f(\u5b54\u4ee4\u5a77) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u4e3b\u64ad\u57f9\u8bad\u8bfe\u7a0b (\u4ef7\u683c\u672a\u660e\u786e\u63d0\u53ca\uff0c\u4f46\u7528\u6237\u5df2\u652f\u4ed82380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u5168\u6b3e\u5145\u88d5** (\u7528\u6237\u76f4\u63a5\u652f\u4ed82380\u5143\uff0c\u65e0\u5206\u671f\u3001\u501f\u6b3e\u8ff9\u8c61) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u7528\u6237\u63d0\u53ca\u201c\u7a81\u7136\u6765\u4e86\u5de5\u4f5c\u201d\uff0c\u663e\u793a\u4e3b\u4e1a\u65f6\u95f4\u5360\u7528\uff0c\u5b66\u4e60\u9700\u89c1\u7f1d\u63d2\u9488) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** (\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u60c5\u51b5\uff0c\u9700\u540e\u7eed\u6838\u67e5) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49** (\u5b66\u4e60\u884c\u4e3a\u8bb0\u5f55\u9971\u6ee1\uff0c\u4f46\u5173\u952e\u80cc\u666f\u4fe1\u606f\u5982\u804c\u4e1a\u3001\u5bb6\u5ead\u3001\u8d22\u52a1\u72b6\u51b5\u7f3a\u5931) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34\u578b**\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u201c\u60f3\u9760\u7740\u753b\u672c\u7b49\u5e55\u540e\u5148\u8d5a\u4e00\u70b9\u201d\uff0c\u6709\u660e\u786e\u7684\u77ed\u671f\u53d8\u73b0\u8bc9\u6c42\u3002\u4f46\u540c\u65f6\uff0c\u7528\u6237\u4e5f\u79ef\u6781\u53c2\u4e0e\u5b66\u4e60\u3001\u8bd5\u97f3\uff0c\u5173\u6ce8\u6280\u80fd\u63d0\u5347\uff08\u5982\u8be2\u95ee\u5e72\u97f3\u523a\u8033\u95ee\u9898\uff09\uff0c\u5e76\u4eab\u53d7Pia\u620f\u8fc7\u7a0b\uff0c\u663e\u793a\u51fa\u5174\u8da3\u548c\u63a2\u7d22\u6b32\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5e08\u59d0\uff0c\u6211\u60f3\u62a5\u4e2d\u7ea7\u8bc1\u4e66\u7684\u54ea\u4e2a\u73ed\uff0c\u5728\u5b66\u4e60\u671f\u95f4\u60f3\u9760\u7740\u753b\u672c\u7b49\u5e55\u540e\u5148\u8d5a\u4e00\u70b9\uff0c\u53ef\u4ee5\u5417\uff1f\u6709\u8d44\u6e90\u5417\uff1f\u6709\u70b9\u62c5\u5fc3\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u76f4\u63a5\u652f\u4ed82380\u5143\uff0c\u65e0\u660e\u663e\u7ecf\u6d4e\u538b\u529b\u4fe1\u53f7\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u79ef\u6781\u5b8c\u6210\u6240\u6709\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\uff0c\u4f46\u201c\u7a81\u7136\u6765\u4e86\u5de5\u4f5c\u201d\u663e\u793a\u4e3b\u4e1a\u7e41\u5fd9\uff0c\u65f6\u95f4\u788e\u7247\u5316\uff0c\u5b58\u5728\u6f5c\u5728\u51b2\u7a81\u98ce\u9669\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff0c\u9700\u540e\u7eed\u786e\u8ba4\u3002\u6b64\u9879\u4e3a\u6f5c\u5728\u98ce\u9669\u70b9\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u7528\u6237\u4e3b\u52a8\u63d0\u51fa\u6280\u672f\u95ee\u9898\uff08\u5e72\u97f3\u523a\u8033\u3001\u7834\u97f3\uff09\uff0c\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\u3002\u5728Pia\u620f\u4e2d\u4ec5\u83b7\u5f97\u4e00\u53e5\u53f0\u8bcd\u65f6\uff0c\u867d\u6709\u9057\u61be\uff08\u201c[\u82e6\u6da9]\u201d\uff09\uff0c\u4f46\u80fd\u8fc5\u901f\u81ea\u6211\u8c03\u6574\uff08\u201c\u4e0d\u8fc7\u6ca1\u5173\u7cfb\uff0c\u4e00\u53e5\u8bdd\u7684\u53f0\u8bcd\u6211\u4e5f\u7528\u5fc3\u7684\u53bb\u6f14\u7ece\u201d\uff09\uff0c\u5e76\u79ef\u6781\u7ec3\u4e60\u3002\u5168\u7a0b\u6001\u5ea6\u79ef\u6781\u3001\u914d\u5408\uff0c\u65e0\u62b1\u6028\u6216\u8d1f\u9762\u60c5\u7eea\u5ba3\u6cc4\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5e08\u5144\u8ba9\u9009\u89d2\u8272\uff0c\u6211\u6263\u516c\u5c4f\u4e86\uff0c\u5e08\u5144\u6ca1\u770b\u89c1\uff0c\u6700\u540e\u53ea\u6709\u4e00\u53e5\u53f0\u8bcd\uff0c\u4e0d\u8fc7\u6ca1\u5173\u7cfb\uff0c\u4e00\u53e5\u8bdd\u7684\u53f0\u8bcd\u6211\u4e5f\u7528\u5fc3\u7684\u53bb\u6f14\u7ece\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u81ea\u8eab\u6280\u80fd\u7684\u4e0d\u81ea\u4fe1\u4e0e\u5bf9\u884c\u4e1a\u53d8\u73b0\u8def\u5f84\u7684\u6a21\u7cca\u7126\u8651\u3002\u4ed6\u62c5\u5fc3\u201c\u5e72\u97f3\u523a\u8033\u201d\u3001\u201c\u653e\u4e0d\u5f00\u201d\uff0c\u66f4\u62c5\u5fc3\u6295\u5165\u540e\u201c\u6ca1\u6709\u8d44\u6e90\u201d\u65e0\u6cd5\u53d8\u73b0\uff0c\u672c\u8d28\u662f\u5e0c\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u6280\u80fd\u5e76\u83b7\u5f97\u8ba4\u53ef\uff08\u7ecf\u6d4e\u56de\u62a5\u4e0e\u4e13\u4e1a\u80af\u5b9a\uff09\uff0c\u6765\u5efa\u7acb\u804c\u4e1a\u5b89\u5168\u611f\u548c\u81ea\u6211\u4ef7\u503c\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5373\u65f6\u3001\u5177\u4f53\u3001\u53ef\u91cf\u5316\u7684\u6b63\u53cd\u9988\u4e0e\u8d44\u6e90\u5bf9\u63a5\u7684\u5b89\u5168\u611f**\u3002\u4ed6\u9700\u8981\u88ab\u660e\u786e\u544a\u77e5\u201c\u4f60\u505a\u5f97\u5f88\u597d\u201d\u3001\u201c\u8fd9\u91cc\u6709\u9002\u5408\u4f60\u7684\u5355\u5b50\u201d\uff0c\u4ee5\u7f13\u89e3\u5176\u5bf9\u201c\u6295\u5165\u65e0\u4ea7\u51fa\u201d\u7684\u7126\u8651\uff0c\u5e76\u5f3a\u5316\u5176\u201c\u6211\u80fd\u884c\u201d\u7684\u81ea\u6211\u8ba4\u540c\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u52a8\u673a\u4e2d\u7b49\u3001\u8d44\u6e90\u4e2d\u7b49\u3001\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u5c5e\u4e8e\u53ef\u57f9\u517b\u7684\u6f5c\u529b\u7528\u6237) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u79ef\u6781\u5b8c\u6210\u6240\u6709\u4efb\u52a1\uff0c\u4e3b\u52a8\u5bfb\u6c42\u6280\u80fd\u63d0\u5347\u548c\u53d8\u73b0\u8def\u5f84\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u4e0d\u5f20\u626c\u4f46\u6267\u884c\u529b\u5f3a) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5ead\u51b2\u7a81\u7b49\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4f4e** | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u5f53\u524d\u65e0\u8d1f\u9762\u4fe1\u53f7\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u4e3b\u4e1a\u5de5\u4f5c\u7a81\u7136\u7e41\u5fd9\uff0c\u5bfc\u81f4\u65e0\u6cd5\u8ddf\u4e0a\u8bfe\u7a0b\u8282\u594f\u548c\u4f5c\u4e1a\uff0c\u4ea7\u751f\u201c\u82b1\u4e86\u94b1\u5374\u6ca1\u65f6\u95f4\u5b66\u201d\u7684\u6127\u759a\u548c\u7126\u8651\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u81ea\u6211\u8c03\u8282\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | **\u6838\u5fc3\u98ce\u9669\u70b9**\uff1a\u5bf9\u201c\u753b\u672c\u7b49\u5e55\u540e\u5148\u8d5a\u4e00\u70b9\u201d\u7684\u77ed\u671f\u53d8\u73b0\u671f\u671b\u82e5\u5728\u8bfe\u7a0b\u4e2d\u671f\uff08\u5982\u7b2c3-4\u5468\uff09\u672a\u80fd\u5b9e\u73b0\uff0c\u6216\u63a5\u5355\u8d44\u6e90\u4e0d\u5982\u9884\u671f\uff0c\u53ef\u80fd\u4ea7\u751f\u201c\u88ab\u9a97\u201d\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c3-4\u5468\uff08\u6b7b\u4ea1\u8c37\u9636\u6bb5\uff09**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u5b66\u4e60\u96be\u5ea6\u53ef\u80fd\u63d0\u5347\uff0c\u82e5\u4e3b\u4e1a\u65f6\u95f4\u6324\u538b\u5b66\u4e60\uff0c\u4e14\u672a\u83b7\u5f97\u4efb\u4f55\u5b9e\u8d28\u6027\u7684\u63a5\u5355\u673a\u4f1a\u6216\u5fae\u5c0f\u6536\u76ca\uff0c\u632b\u8d25\u611f\u548c\u6536\u76ca\u7126\u8651\u5c06\u8fbe\u5230\u5cf0\u503c\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u770b\u5230\u4f60\u8fd9\u4e48\u5feb\u5c31\u5b8c\u6210\u4e86\u4f53\u9a8c\u8425\u6240\u6709\u8003\u6838\uff0c\u6267\u884c\u529b\u771f\u7684\u8d85\u5f3a\uff01\u54b1\u4eec\u6b63\u5f0f\u8bfe\u7a0b\u7684\u8bbe\u8ba1\u5c31\u662f\u5e2e\u4f60\u628a\u2018\u80fd\u8d5a\u4e00\u70b9\u2019\u7684\u60f3\u6cd5\u7a33\u7a33\u843d\u5730\u3002\u6211\u77e5\u9053\u4f60\u5de5\u4f5c\u5fd9\uff0c\u54b1\u4eec\u4e0d\u8ffd\u6c42\u901f\u5ea6\uff0c\u6bcf\u5468\u641e\u5b9a\u4e00\u4e2a\u6838\u5fc3\u6280\u5de7\uff0c\u73ed\u73ed\u4f1a\u540c\u6b65\u5e2e\u4f60\u7559\u610f\u9002\u5408\u65b0\u624b\u7684\u753b\u672c\u3001\u5bf9\u8f68\u5c0f\u5355\u5b50\uff0c\u8ba9\u4f60\u8fb9\u5b66\u8fb9\u5b9e\u8df5\uff0c\u6bcf\u4e00\u6b65\u90fd\u8e0f\u8e0f\u5b9e\u5b9e\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u91cd\u70b9\u63d0\u4f9b\u624e\u5b9e\u7684\u6f14\u64ad\u6280\u5de7\u3001\u8bbe\u5907\u8c03\u8bd5\u3001\u8bd5\u97f3\u5b9e\u6218\u6559\u5b66\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u3010\u5feb\u901f\u63a5\u5355\u8f85\u52a9\u5305\u3011**\u3002\u5728\u8bfe\u7a0b\u65e9\u671f\uff08\u7b2c2\u5468\u8d77\uff09\u5373\u63d0\u4f9b\u660e\u786e\u7684\u3001\u4f4e\u95e8\u69db\u7684\u5e55\u540e\u4efb\u52a1\uff08\u5982\u753b\u672c\u3001\u5bf9\u8f68\uff09\u63a5\u5355\u8def\u5f84\u548c\u8d44\u6e90\u5bf9\u63a5\uff0c\u54ea\u6015\u662f\u5c0f\u989d\u3001\u8c61\u5f81\u6027\u7684\u4efb\u52a1\uff0c\u4ee5\u6ee1\u8db3\u5176\u201c\u5148\u8d5a\u4e00\u70b9\u201d\u7684\u5fc3\u7406\u8bc9\u6c42\uff0c\u5efa\u7acb\u4fe1\u5fc3\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u53ea\u753b\u957f\u671f\u53d8\u73b0\u7684\u5927\u997c\uff0c\u800c\u4e0d\u63d0\u4f9b\u77ed\u671f\u3001\u5fae\u5c0f\u7684\u5b9e\u8df5\u673a\u4f1a\u30022. \u5ffd\u89c6\u5176\u4e3b\u4e1a\u65f6\u95f4\u538b\u529b\uff0c\u5e03\u7f6e\u8fc7\u91cf\u6216\u65f6\u95f4\u8981\u6c42\u82db\u523b\u7684\u4f5c\u4e1a\u30023. \u5728\u5176\u63d0\u51fa\u5177\u4f53\u6280\u672f\u95ee\u9898\u65f6\uff0c\u7ed9\u4e88\u6a21\u7cca\u3001\u6577\u884d\u7684\u89e3\u7b54\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u8c28\u614e\u63a8\u4ecb\u8fdb\u9636\u8bfe\u7a0b**\u3002\u9700\u5728\u5176\u901a\u8fc7\u521d\u671f\u5b66\u4e60\u83b7\u5f97\u660e\u786e\u6b63\u53cd\u9988\uff08\u5982\u5b8c\u6210\u7b2c\u4e00\u4e2a\u5c0f\u5355\u3001\u83b7\u5f97\u8001\u5e08\u5177\u4f53\u597d\u8bc4\uff09\u540e\uff0c\u57fa\u4e8e\u5176\u6280\u80fd\u63d0\u5347\u548c\u5174\u8da3\u6df1\u5316\u8fdb\u884c\u63a8\u4ecb\uff0c\u5207\u5fcc\u5728\u5f00\u8bfe\u521d\u671f\u5f3a\u63a8\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5e08\u59d0\uff0c\u6211\u60f3\u62a5\u4e2d\u7ea7\u8bc1\u4e66\u7684\u54ea\u4e2a\u73ed\uff0c\u5728\u5b66\u4e60\u671f\u95f4\u60f3\u9760\u7740\u753b\u672c\u7b49\u5e55\u540e\u5148\u8d5a\u4e00\u70b9\uff0c\u53ef\u4ee5\u5417\uff1f\u6709\u8d44\u6e90\u5417\uff1f\u6709\u70b9\u62c5\u5fc3\u201d **(\u52a8\u673a\u4e0e\u7126\u8651\u7684\u6838\u5fc3\u66b4\u9732)**\n2. > \u201c\u5e08\u5144\u8ba9\u9009\u89d2\u8272\uff0c\u6211\u6263\u516c\u5c4f\u4e86\uff0c\u5e08\u5144\u6ca1\u770b\u89c1\uff0c\u6700\u540e\u53ea\u6709\u4e00\u53e5\u53f0\u8bcd\uff0c\u4e0d\u8fc7\u6ca1\u5173\u7cfb\uff0c\u4e00\u53e5\u8bdd\u7684\u53f0\u8bcd\u6211\u4e5f\u7528\u5fc3\u7684\u53bb\u6f14\u7ece\u201d **(\u9ad8\u5fc3\u7406\u5f39\u6027\u7684\u5178\u578b\u4f53\u73b0)**\n3. > \u201c\u53ef\u662f\u5b66\u59d0\uff0c\u6211\u611f\u89c9\u6211\u7684\u5e72\u97f3\u6709\u65f6\u5019\u4f1a\u6bd4\u8f83\u523a\u8033\uff0c\u800c\u4e14\u5bf9\u4e8e\u60c5\u7eea\u6ce2\u52a8\u5927\u7684\u53e5\u5b50\u53ef\u80fd\u4f1a\u653e\u4e0d\u5f00\u6216\u8005\u7834\u97f3\u201d **(\u4e3b\u52a8\u6c42\u89e3\u3001\u5173\u6ce8\u6280\u80fd\u63d0\u5347\u7684\u5b9e\u5e72\u8868\u73b0)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2\u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u5c0a\u91cd\u4e0e\u804c\u4e1a\u5b89\u5168\u611f**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d\u7b49**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u5728\u8bfe\u7a0b\u65e9\u671f\uff08\u6b7b\u4ea1\u8c37\u524d\uff09\u63d0\u4f9b\u660e\u786e\u7684\u3001\u4f4e\u95e8\u69db\u7684\u5b9e\u8df5\u63a5\u5355\u8def\u5f84\uff0c\u7528\u5fae\u5c0f\u6b63\u53cd\u9988\u5bf9\u51b2\u5176\u6536\u76ca\u7126\u8651\u548c\u65f6\u95f4\u538b\u529b**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5feb\u901f\u63a5\u5355\u8f85\u52a9\u5305\"}\n```";
