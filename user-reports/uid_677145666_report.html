    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## \u4e00\u3001 \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**\n    *   **\u5b66\u4e60\u52a8\u673a**\uff1a\u660e\u786e\u8868\u8fbe\u201c\u60f3\u5148\u4ece\u517c\u804c\u505a\u8d77\uff0c\u6700\u4e3b\u8981\u7684\u662f\u4e3a\u4e86\u63d0\u5347\u81ea\u5df1\u201d\u3002\u52a8\u673a\u5305\u542b\u81ea\u6211\u63d0\u5347\u4e0e\u517c\u804c\u53d8\u73b0\uff0c\u4f46\u66f4\u4fa7\u91cd\u4e8e\u524d\u8005\uff0c\u6709\u4e00\u5b9a\u5185\u5728\u9a71\u52a8\u3002\n    *   **\u4ed8\u8d39\u610f\u613f**\uff1a\u8ba4\u53ef\u77e5\u8bc6\u4ed8\u8d39\u4ef7\u503c\uff08\u201c\u4ed8\u8d39\u80fd\u5b66\u5230\u771f\u4e1c\u897f\u5c31\u503c\u5f97\u201d\uff09\uff0c\u5728\u9500\u552e\u5f15\u5bfc\u4e0b\u5feb\u901f\u51b3\u7b56\u62a5\u540d\u9ad8\u9636\u73ed\uff087380\u5143\uff09\uff0c\u652f\u4ed8\u8fc7\u7a0b\u867d\u6709\u6ce2\u6298\u4f46\u6700\u7ec8\u5b8c\u6210\u3002\n    *   **\u4fe1\u53f7\u5f3a\u5ea6**\uff1a\u4e2d\u7b49\u3002\u6709\u660e\u786e\u7684\u5b66\u4e60\u610f\u613f\u548c\u4ed8\u8d39\u884c\u52a8\uff0c\u4f46\u201c\u63d0\u5347\u81ea\u5df1\u201d\u7684\u52a8\u673a\u76f8\u5bf9\u5bbd\u6cdb\uff0c\u5bf9\u5177\u4f53\u53d8\u73b0\u8def\u5f84\u548c\u6295\u5165\u4ea7\u51fa\u6bd4\u7684\u8ba4\u77e5\u53ef\u80fd\u4e0d\u8db3\u3002\n\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**\n    *   **\u65f6\u95f4/\u7cbe\u529b**\uff1a\u80fd\u575a\u6301\u5b8c\u6210\u4f53\u9a8c\u8425\u4f5c\u4e1a\uff08\u5305\u62ec\u55d3\u5b50\u75bc\u65f6\u4ecd\u575a\u6301\u5f55\u97f3\uff09\uff0c\u8868\u660e\u6709\u4e00\u5b9a\u4e1a\u4f59\u65f6\u95f4\u6295\u5165\u5b66\u4e60\u3002\u9009\u62e9\u201c\u517c\u804c\u201d\u8d77\u6b65\uff0c\u7b26\u5408\u8d44\u6e90\u73b0\u72b6\u3002\n    *   **\u7ecf\u6d4e\u80fd\u529b**\uff1a\u80fd\u4e00\u6b21\u6027\u652f\u4ed87380\u5143\u5b66\u8d39\uff0c\u672a\u8868\u73b0\u51fa\u660e\u663e\u7ecf\u6d4e\u538b\u529b\u6216\u72b9\u8c6b\u3002\u652f\u4ed8\u65b9\u5f0f\u4e3a\u5de5\u5546\u94f6\u884c\u5361\uff0c\u6d41\u7a0b\u6b63\u5e38\u3002\n    *   **\u5b66\u4e60\u57fa\u7840**\uff1a\u81ea\u8ff0\u201c\u96f6\u57fa\u7840\u5c0f\u767d\u201d\uff0c\u901a\u8fc7\u4f53\u9a8c\u8425\u521d\u6b65\u8003\u6838\u3002\u5bf9\u5e73\u53f0\u64cd\u4f5c\uff08\u5982\u627e\u4f5c\u4e1a\u3001\u9886\u6743\u76ca\uff09\u7565\u663e\u751f\u758f\uff0c\u9700\u8981\u5f15\u5bfc\u3002\n    *   **\u4fe1\u53f7\u5f3a\u5ea6**\uff1a\u4e2d\u7b49\u3002\u5177\u5907\u57fa\u672c\u7684\u5b66\u4e60\u65f6\u95f4\u3001\u7ecf\u6d4e\u652f\u4ed8\u80fd\u529b\u548c\u5b66\u4e60\u6267\u884c\u529b\uff0c\u4f46\u5c5e\u4e8e\u884c\u4e1a\u65b0\u624b\uff0c\u6280\u80fd\u548c\u8d44\u6e90\u79ef\u7d2f\u4ece\u96f6\u5f00\u59cb\u3002\n\n*   **\u5fc3\u7406\u5f39\u6027 (E)**\n    *   **\u6297\u632b\u6298\u80fd\u529b**\uff1a\u5728\u9047\u5230\u7cfb\u7edf\u95ee\u9898\uff08\u6743\u76ca\u9886\u53d6\u5931\u8d25\u3001\u4fe1\u606f\u4e0d\u540c\u6b65\uff09\u65f6\uff0c\u521d\u671f\u4fdd\u6301\u793c\u8c8c\u6c9f\u901a\uff08\u201c\u597d\u7684\u201d\u3001\u201c\u9ebb\u70e6\u4e86\u201d\uff09\uff0c\u4f46\u95ee\u9898\u53cd\u590d\u51fa\u73b0\u540e\uff0c\u7126\u8651\u548c\u4e0d\u4fe1\u4efb\u611f\u660e\u663e\u4e0a\u5347\uff08\u201c\u4e0d\u4f1a\u53c8\u4e0a\u5f53\u4e86\ud83d\ude2d\u201d\u3001\u201c\u6211\u600e\u4e48\u89c9\u5f97\u6709\u70b9\u88ab\u9a97\u4e86\u5462\u201d\u3001\u201c\u5b8c\u5168\u662f\u4e00\u79cd\u4fe1\u4efb\uff0c\u53ef\u662f\u6709\u70b9\u5931\u671b\u201d\uff09\uff0c\u5e76\u76f4\u63a5\u63d0\u51fa\u9000\u8d39\u8bc9\u6c42\u3002\n    *   **\u95ee\u9898\u89e3\u51b3\u6a21\u5f0f**\uff1a\u503e\u5411\u4e8e\u4e3b\u52a8\u8be2\u95ee\u548c\u5bfb\u6c42\u786e\u8ba4\uff08\u591a\u6b21\u63d0\u95ee\u64cd\u4f5c\u7ec6\u8282\uff09\uff0c\u4f46\u5728\u9047\u5230\u7cfb\u7edf\u6027\u969c\u788d\u65f6\uff0c\u5bb9\u6613\u5f52\u56e0\u4e8e\u5916\u90e8\uff08\u5e73\u53f0/\u9500\u552e\u95ee\u9898\uff09\uff0c\u60c5\u7eea\u6ce2\u52a8\u8f83\u5927\u3002\n    *   **\u4fe1\u53f7\u5f3a\u5ea6**\uff1a**\u8f83\u4f4e**\u3002**\u5bf9\u6d41\u7a0b\u987a\u7545\u5ea6\u548c\u670d\u52a1\u5373\u65f6\u6027\u8981\u6c42\u9ad8\uff0c\u4fe1\u4efb\u611f\u5efa\u7acb\u5feb\u4f46\u8106\u5f31\uff0c\u9047\u5230\u64cd\u4f5c\u969c\u788d\u65f6\u6613\u4ea7\u751f\u5f3a\u70c8\u7684\u4e0d\u5b89\u5168\u611f\u548c\u6295\u8bc9/\u9000\u8d39\u503e\u5411\u3002**\n\n## \u4e8c\u3001 ABCD\u5224\u5b9a\u6811\u5206\u6790\n\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u5df2\u652f\u4ed87380\u5143\u9ad8\u9636\u73ed\u8d39\u7528\uff0c\u652f\u4ed8\u6210\u529f\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u914d\u5076\u3001\u7236\u6bcd\u7b49\u5bb6\u5ead\u5176\u4ed6\u6210\u5458\u610f\u89c1\uff0c\u7528\u6237\u5168\u7a0b\u81ea\u4e3b\u51b3\u7b56\u3001\u64cd\u4f5c\u4ed8\u6b3e\uff0c\u53ef\u521d\u6b65\u5224\u65ad\u4e3a**\u4e2a\u4eba\u72ec\u7acb\u51b3\u7b56**\u3002\n*   **\u6b65\u9aa41\uff1a\u52a8\u673a\u7eaf\u5ea6 (M)**\uff1aM\u22652\uff08\u6709\u660e\u786e\u5b66\u4e60\u610f\u613f\u548c\u4ed8\u8d39\u884c\u52a8\uff09\u3002\u8fdb\u5165B\u8def\u5f84\u3002\n*   **\u6b65\u9aa42\uff1a\u8d44\u6e90\u5e95\u5ea7 (R)**\uff1aR\u22652\uff08\u6709\u65f6\u95f4\u3001\u6709\u652f\u4ed8\u80fd\u529b\uff09\u3002\u8fdb\u5165B1\u8def\u5f84\u3002\n*   **\u6b65\u9aa43\uff1a\u5fc3\u7406\u5f39\u6027 (E)**\uff1aE\u22642\uff08\u9047\u5230\u670d\u52a1\u6d41\u7a0b\u95ee\u9898\u540e\u8868\u73b0\u51fa\u660e\u663e\u7684\u7126\u8651\u3001\u4e0d\u4fe1\u4efb\u548c\u9000\u8d39\u503e\u5411\uff09\u3002**\u5224\u5b9a\u7ed3\u679c\uff1aB1-E2 (\u4e2d\u98ce\u9669\u89c2\u671b\u8005)**\u3002\n\n## \u4e09\u3001 \u7528\u6237\u539f\u578b\u5339\u914d\n\n*   **\u5339\u914d\u539f\u578b\uff1aT4 \u8c28\u614e\u52a1\u5b9e\u8005**\n    *   **\u7279\u5f81\u543b\u5408\u70b9**\uff1a\n        1.  **\u76ee\u6807\u5bfc\u5411**\uff1a\u4ee5\u201c\u63d0\u5347\u81ea\u5df1\u201d\u548c\u201c\u517c\u804c\u201d\u4e3a\u660e\u786e\u76ee\u6807\uff0c\u8ba4\u53ef\u77e5\u8bc6\u4ed8\u8d39\u4ef7\u503c\u3002\n        2.  **\u8c28\u614e\u6c42\u8bc1**\uff1a\u5bf9\u64cd\u4f5c\u7ec6\u8282\u53cd\u590d\u786e\u8ba4\uff08\u5982\u9009\u4e66\u6280\u5de7\u3001\u6743\u76ca\u9886\u53d6\u6b65\u9aa4\u3001\u73ed\u7ea7\u7c7b\u578b\uff09\uff0c\u5173\u6ce8\u6d41\u7a0b\u5408\u89c4\u6027\u3002\n        3.  **\u4f4e\u5bb9\u9519\u7387**\uff1a**\u5bf9\u670d\u52a1\u7455\u75b5\uff08\u7cfb\u7edf\u5361\u987f\u3001\u4fe1\u606f\u4e0d\u540c\u6b65\u3001\u56de\u590d\u5ef6\u8fdf\uff09\u5bb9\u5fcd\u5ea6\u6781\u4f4e**\uff0c\u4e00\u65e6\u4f53\u9a8c\u4e0d\u7b26\u5408\u9884\u671f\uff0c\u4fe1\u4efb\u8fc5\u901f\u5d29\u584c\uff0c\u9000\u8d39\u8bc9\u6c42\u76f4\u63a5\u4e14\u5f3a\u70c8\u3002\n        4.  **\u52a1\u5b9e\u8bc4\u4f30**\uff1a\u5176\u201c\u5931\u671b\u201d\u548c\u201c\u88ab\u9a97\u201d\u7684\u611f\u53d7\uff0c\u6e90\u4e8e\u4ed8\u8d39\u540e\u672a\u83b7\u5f97\u9884\u671f\u7684\u987a\u7545\u670d\u52a1\u548c\u660e\u786e\u6307\u5f15\uff0c\u5c5e\u4e8e\u5178\u578b\u7684\u201c\u627f\u8bfa-\u4f53\u9a8c\u201d\u843d\u5dee\u3002\n\n## \u56db\u3001 \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n\n*   **\u603b\u4f53\u98ce\u9669\u7b49\u7ea7\uff1a\u9ad8**\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a\u5c1a\u672a\u5f00\u59cb\u6b63\u5f0f\u5b66\u4e60\uff0c\u6682\u4e0d\u9002\u7528\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a\u652f\u4ed8\u8fc7\u7a0b\u987a\u7545\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\uff0c\u98ce\u9669\u4f4e\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a\u7528\u6237\u4e3b\u52a8\u5b89\u6392\u65f6\u95f4\u5b66\u4e60\u5e76\u4ea4\u4f5c\u4e1a\uff0c\u98ce\u9669\u4f4e\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a\u672a\u4f53\u73b0\uff0c\u98ce\u9669\u4f4e\u3002\n    5.  **\u7ade\u54c1\u6bd4\u8f83/\u540e\u6094**\uff1a\u6682\u672a\u4f53\u73b0\uff0c\u98ce\u9669\u4e2d\u3002\n    6.  **\u9500\u552e\u8bef\u5bfc**\uff1a\u9500\u552e\u5b58\u5728**\u6a21\u7cca\u8bdd\u672f**\uff08\u5982\u5c06\u201c\u901a\u5173\u5165\u9a7b\u201d\u6743\u76ca\u4e0e\u201c\u9ad8\u9636\u73ed\u8d44\u683c\u201d\u6df7\u8c08\uff0c\u79f0\u524d\u671f\u8bfe\u4e00\u8d77\u4e0a\u540e\u671f\u6362\u8001\u5e08\uff09\uff0c\u53ef\u80fd\u4f7f\u7528\u6237\u5bf9\u4ea7\u54c1\u7ed3\u6784\u548c\u670d\u52a1\u8854\u63a5\u4ea7\u751f\u56f0\u60d1\u3002**\u6b64\u4e3a\u5173\u952e\u98ce\u9669\u70b9**\u3002\n    7.  **\u670d\u52a1\u4f53\u9a8c\u843d\u5dee**\uff1a**\u6781\u9ad8\u98ce\u9669**\u3002\u4ed8\u8d39\u540e\u7acb\u5373\u906d\u9047\u7cfb\u7edf\u6545\u969c\u3001\u6743\u76ca\u65e0\u6cd5\u9886\u53d6\u3001\u4fe1\u606f\u53cd\u9988\u4e0d\u53ca\u65f6\uff08\u201c\u4ea4\u5b8c\u94b1\u6ca1\u4eba\u7406\u4e86\u201d\uff09\u3001\u73ed\u7ea7\u7c7b\u578b\u4fe1\u606f\u6df7\u4e71\u7b49\u95ee\u9898\uff0c\u4e25\u91cd\u7834\u574f\u4e86\u7528\u6237\u7684\u4fe1\u4efb\u57fa\u7840\u548c\u521d\u59cb\u4f53\u9a8c\uff0c\u662f\u5f15\u53d1\u5f53\u524d\u9000\u8d39\u8bc9\u6c42\u7684\u76f4\u63a5\u5bfc\u706b\u7d22\u3002\n\n## \u4e94\u3001 \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n\n*   **\u3010\u5408\u89c4\u95ee\u9898\u3011**\uff1a\n    1.  **\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u6a21\u7cca\u8868\u8ff0**\uff1a\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u5e26\u4f60\u5165\u884c\u201d\u3001\u201c\u7ed9\u8d44\u6e90\u201d\u3001\u201c\u73b0\u573a\u5bf9\u63a5\u8d44\u6e90\u201d\u3001\u201c\u53d1\u653e\u7248\u6743\u4e66\u201d\u3001\u201c\u52a0\u5165\u5de5\u4f1a/\u5de5\u4f5c\u5ba4\u201d\u7b49\uff0c\u53ef\u80fd\u8425\u9020\u4e86\u201c\u62a5\u540d\u5373\u4fdd\u969c\u5c31\u4e1a/\u6536\u5165\u201d\u7684\u9884\u671f\uff0c\u4e0e\u540e\u7eed\u5b9e\u9645\u670d\u52a1\u53ef\u80fd\u5b58\u5728\u5dee\u8ddd\u3002\n    2.  **\u4fe1\u606f\u6df7\u6dc6**\uff1a\u5728\u7528\u6237\u5df2\u652f\u4ed8\u9ad8\u9636\u73ed\u8d39\u7528\u540e\uff0c\u53d1\u9001\u5173\u4e8e\u201c\u7cbe\u82f1\u73ed\u201d\u7684\u4fe1\u606f\uff0c\u4e14\u89e3\u91ca\u201c\u524d\u671f\u4e00\u8d77\u4e0a\u201d\u903b\u8f91\u4e0d\u6e05\uff0c\u6613\u5f15\u53d1\u7528\u6237\u5bf9\u8bfe\u7a0b\u8d28\u91cf\u548c\u6240\u8d2d\u670d\u52a1\u7684\u8d28\u7591\u3002\n    3.  **\u5236\u9020\u7a00\u7f3a\u4e0e\u7d27\u8feb\u611f**\uff1a\u4f7f\u7528\u201c\u540d\u989d\u5c11\u201d\u3001\u201c\u6293\u7d27\u51b2\u201d\u3001\u201c\u73b0\u573a\u529e\u7406\u201d\u7b49\u8bdd\u672f\uff0c\u7b26\u5408\u5e38\u89c1\u9500\u552e\u7b56\u7565\uff0c\u4f46\u9700\u6ce8\u610f\u5c3a\u5ea6\u3002\n*   **\u3010\u4f26\u7406\u98ce\u9669\u3011**\uff1a\u5728\u7528\u6237\u5df2\u4ea7\u751f\u5f3a\u70c8\u4e0d\u4fe1\u4efb\u611f\u5e76\u63d0\u51fa\u9000\u8d39\u540e\uff0c\u9500\u552e\u4ecd\u5728\u5c1d\u8bd5\u5f15\u5bfc\u5176\u201c\u70b9\u94fe\u63a5\u62a5\u540d\u6b63\u4ef7\u8bfe\u201d\uff0c\u6b64\u884c\u4e3a**\u6781\u6613\u6fc0\u5316\u77db\u76fe\uff0c\u89e6\u53d1\u6295\u8bc9**\u3002\n\n## \u516d\u3001 \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6\u8bc4\u4f30\uff1a\u504f\u5dee**\n    *   \u7528\u6237\u52a8\u673a\uff08\u81ea\u6211\u63d0\u5347+\u517c\u804c\uff09\u4e0e\u4ea7\u54c1\uff08\u6709\u58f0\u6f14\u64ad\u57f9\u8bad\uff09\u8868\u9762\u5339\u914d\u3002\n    *   **\u4f46\u7528\u6237\u6838\u5fc3\u9700\u6c42\u4e0d\u4ec5\u662f\u6280\u80fd\u5b66\u4e60\uff0c\u66f4\u5305\u62ec\u6e05\u6670\u3001\u7a33\u5b9a\u3001\u53ef\u9760\u7684\u670d\u52a1\u6d41\u7a0b\u548c\u9884\u671f\u7ba1\u7406**\u3002\u5f53\u524d\u56e0\u552e\u540e\u7684\u6df7\u4e71\u4f53\u9a8c\u5df2\u5bfc\u81f4\u4e25\u91cd\u4e0d\u5339\u914d\u3002\n\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c\uff0810\u5b57\u5185\uff09\uff1a\u7d27\u6025\u5b89\u629a\uff0c\u900f\u660e\u6d41\u7a0b\uff0c\u91cd\u5efa\u4fe1\u4efb**\n\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u7acb\u5373\u4ecb\u5165\uff0c\u6700\u9ad8\u4f18\u5148\u7ea7**\uff1a\u73ed\u4e3b\u4efb\u9700\u5728**24\u5c0f\u65f6\u5185**\u4e3b\u52a8\u3001\u6b63\u5f0f\u8054\u7cfb\u7528\u6237\uff0c\u4e3a\u7cdf\u7cd5\u7684\u521d\u4f53\u9a8c\u9053\u6b49\uff0c\u627f\u8ba4\u6d41\u7a0b\u95ee\u9898\u3002\n    2.  **\u6d41\u7a0b\u900f\u660e\u5316**\uff1a\u6e05\u6670\u3001\u4e66\u9762\u5316\u5730\u544a\u77e5\u7528\u6237\u4ee5\u4e0b\u4fe1\u606f\uff1a\n        *   \u5df2\u652f\u4ed8\u6b3e\u9879\u5bf9\u5e94\u7684\u786e\u5207\u8bfe\u7a0b\u5185\u5bb9\uff08\u9ad8\u9636\u73ed\uff09\u3001\u670d\u52a1\u5468\u671f\u3001\u73ed\u4e3b\u4efb\u53ca\u6559\u5e08\u56e2\u961f\u3002\n        *   \u201c\u901a\u5173\u5165\u9a7b\u201d\u3001\u201c\u9009\u4e66\u201d\u7b49\u6743\u76ca\u7684\u5177\u4f53\u542b\u4e49\u3001\u5f00\u901a\u6807\u51c6\u548c\u65f6\u95f4\u8868\u3002\n        *   \u63d0\u4f9b\u4e00\u4e2a\u660e\u786e\u7684\u65f6\u95f4\u8282\u70b9\uff0c\u544a\u77e5\u5176\u6240\u6709\u6743\u9650\u4f55\u65f6\u53ef\u6b63\u5e38\u4f7f\u7528\u3002\n    3.  **\u5efa\u7acb\u4e13\u5c5e\u6c9f\u901a\u6e20\u9053**\uff1a\u63d0\u4f9b\u73ed\u4e3b\u4efb\u76f4\u63a5\u8054\u7cfb\u65b9\u5f0f\uff08\u5982\u5de5\u4f5c\u624b\u673a\u53f7\uff09\uff0c\u627f\u8bfa\u54cd\u5e94\u65f6\u6548\uff0c\u907f\u514d\u7528\u6237\u518d\u6b21\u9677\u5165\u201c\u627e\u4e0d\u5230\u4eba\u201d\u7684\u7126\u8651\u3002\n    4.  **\u6821\u6b63\u9884\u671f**\uff1a\u6e29\u548c\u4f46\u660e\u786e\u5730\u6f84\u6e05\uff0c\u5b66\u4e60\u6210\u679c\u4e0e\u4e2a\u4eba\u7ec3\u4e60\u3001\u5b9e\u8df5\u6295\u5165\u5f3a\u76f8\u5173\uff0c\u5e73\u53f0\u63d0\u4f9b\u7684\u662f\u6559\u5b66\u3001\u7ec3\u4e60\u8d44\u6e90\u548c\u63a5\u5355\u673a\u4f1a\uff0c\u800c\u975e\u201c\u4fdd\u5e95\u6536\u5165\u201d\u3002\n    5.  **\u98ce\u9669\u76d1\u63a7**\uff1a\u5c06\u6b64\u5b66\u5458\u6807\u8bb0\u4e3a**\u9ad8\u6295\u8bc9\u98ce\u9669\u7528\u6237**\u3002\u5728\u670d\u52a1\u521d\u671f\uff08\u5c24\u5176\u662f\u524d\u4e24\u5468\uff09\uff0c\u9700\u683c\u5916\u5173\u6ce8\u5176\u5b66\u4e60\u4f53\u9a8c\u548c\u60c5\u7eea\u53cd\u9988\uff0c\u4efb\u4f55\u5c0f\u95ee\u9898\u90fd\u9700\u53ca\u65f6\u3001\u59a5\u5584\u5904\u7406\uff0c\u9632\u6b62\u95ee\u9898\u7d2f\u79ef\u518d\u6b21\u5f15\u53d1\u9000\u8d39\u5371\u673a\u3002\n    6.  **\u534f\u540c\u98ce\u63a7**\uff1a\u5c06\u9500\u552e\u6c9f\u901a\u4e2d\u5b58\u5728\u7684\u6a21\u7cca\u8bdd\u672f\u548c\u53ef\u80fd\u8bef\u5bfc\u7684\u4fe1\u606f\u70b9\u540c\u6b65\u7ed9\u9500\u552e\u7ba1\u7406\u4fa7\uff0c\u907f\u514d\u540c\u7c7b\u95ee\u9898\u518d\u6b21\u53d1\u751f\u3002\n\n{\"core_type\": \"T4 \u8c28\u614e\u52a1\u5b9e\u8005\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u7d27\u6025\u5b89\u629a\uff0c\u900f\u660e\u6d41\u7a0b\uff0c\u91cd\u5efa\u4fe1\u4efb\"}";
