    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n> **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4e3b\u8981\u96c6\u4e2d\u4e8e\u8bfe\u7a0b\u4ea4\u4ed8\u9636\u6bb5\uff0c\u7f3a\u5c11**\u652f\u4ed8\u73af\u8282\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u521d\u59cb\u62a5\u540d\u52a8\u673a\u3001\u8fc7\u5f80\u6536\u5165\u4e0e\u804c\u4e1a\u80cc\u666f**\u7b49\u5173\u952e\u4fe1\u606f\uff0c\u90e8\u5206\u5224\u65ad\u57fa\u4e8e\u6709\u9650\u884c\u4e3a\u6a21\u5f0f\u63a8\u5bfc\u3002\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u67e0\u6aac\u9178\ud83c\udf4b (UID: 253488854) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-26 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6c90\u7efe\u83c0(\u5f20\u5a49\u94b0) / \u85e4\u5b50\u73ed\u73ed(\u5f20\u5029) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u526a\u8f91\u8bad\u7ec3\u8425 (\u540e\u671f\u8bfe\u7a0b) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u7f3a\u5931** (\u9700\u6838\u67e5) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u836f\u5e97\u5de5\u4f5c\uff0c\u9700\u5e26\u5c0f\u5b69\uff0c\u6e05\u660e\u56de\u8001\u5bb6\uff0c\u4e00\u5929\u6700\u591a\u62bd3\u5c0f\u65f6) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** (\u9700\u6838\u67e5) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931** (\u652f\u4ed8\u3001\u5bb6\u5ead\u3001\u521d\u59cb\u52a8\u673a\u4fe1\u606f\u4e0d\u8db3\uff0c\u964d\u7ea7\u7f6e\u4fe1\u5ea6) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34(\u4e2d)\u3002\u6709\u660e\u786e\u7684\u63a5\u5355/\u753b\u672c\u5c97\u610f\u5411\uff0c\u4f46\u5b66\u4e60\u8fc7\u7a0b\u4f34\u968f\u8f83\u591a\u6280\u672f\u7126\u8651\u548c\u5bb6\u5ead\u4e8b\u52a1\u5e72\u6270\uff0c\u52a8\u673a\u5728\u201c\u641e\u94b1\u201d\u4e0e\u201c\u81ea\u6211\u63d0\u5347/\u5174\u8da3\u201d\u95f4\u6447\u6446\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c@\u6c89\u68a6\u7136-\u5317\u4eac-\u5973\u64ad\u2005\u6211\u662f\u7528\u624b\u673a\u5f55\u7684\uff0c\u6e05\u660e\u6211\u65f6\u95f4\u77ed\u5e26\u5c0f\u5b69\u56de\u5bb6\uff0c\u4e00\u5929\u5927\u6982\u80fd\u62bd\u51fa3\u4e2a\u5c0f\u65f6\u65f6\u95f4\uff0c\u6211\u542c\u4f60\u5b89\u6392\u3002\u201d (\u4f53\u73b0\u65f6\u95f4\u7d27\u5f20\u4f46\u4ecd\u6709\u914d\u5408\u610f\u613f)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[**\u4fe1\u606f\u7f3a\u5931**] \u2014 \u4ec5\u63d0\u53ca3000\u5143\u9884\u7b97\u62a5\u540e\u671f\u8bfe\uff0c\u5bf92199\u5143\u8bbe\u5907\u8868\u793a\u201c\u8003\u8651\u4e00\u4e0b\u201d\uff0c\u672a\u89c1\u652f\u4ed8\u538b\u529b\uff0c\u4f46\u4fe1\u606f\u4e0d\u8db3\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[**\u2b07\u4f4e**] \u2014 **\u6838\u5fc3\u77ed\u677f**\u3002\u836f\u5e97\u5de5\u4f5c+\u5e26\u5c0f\u5b69+\u5bb6\u5ead\u4e8b\u52a1\uff08\u8001\u4eba\u53bb\u4e16\uff09\uff0c\u65f6\u95f4\u88ab\u4e25\u91cd\u5207\u5272\uff0c\u4f9d\u8d56\u624b\u673a\u5b66\u4e60\uff0c\u6280\u672f\u57fa\u7840\u8584\u5f31\uff08\u7535\u8111\u4e0d\u719f\uff09\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[**\u4fe1\u606f\u7f3a\u5931**] \u2014 \u672a\u63d0\u53ca\uff0c\u9700\u8b66\u60d5\u6f5c\u5728\u5bb6\u5ead\u5e72\u9884\u98ce\u9669\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b07\u4f4e\u6781\u5371]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u9891\u7e41\u8be2\u95ee\u57fa\u7840\u64cd\u4f5c\uff08\u624b\u673a\u80fd\u5426\u753b\u672c\u3001\u5f55\u97f3\u3001\u5b89\u88c5\u8f6f\u4ef6\uff09\uff0c\u5bf9\u6280\u672f\u7ec6\u8282\u8868\u73b0\u51fa\u9ad8\u5ea6\u4e0d\u81ea\u4fe1\u548c\u4f9d\u8d56\uff0c\u4e00\u53e5\u201c\u83ab\u540d\u6709\u70b9\u614c\u201d\u66b4\u9732\u5176\u8106\u5f31\u5fc3\u6001\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u73ed\u73ed\uff0c\u624b\u673a\u7528\u753b\u672c\u662f\u4e0d\u662f\u4e0d\u53ef\u4ee5\u201d\u3001\u201c\u73ed\u73ed\u6211\u5b89\u88c5\u7684\u8f6f\u4ef6\u600e\u4e48\u662f\u8fd9\u6837\u7684\u201d\u3001\u201c\u662f\u6211\u4e0b\u8f7d\u9519\u4e86\u5417\u201d\u3001\u201c\u83ab\u540d\u6709\u70b9\u614c\uff0c\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u5f52\u5c5e\u4e0e\u5c0a\u91cd\u9700\u6c42** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6280\u672f\u81ea\u5351\u4e0e\u7fa4\u4f53\u878d\u5165\u7126\u8651**\u3002\u5979\u8eab\u5904\u836f\u5e97\u666e\u901a\u5c97\u4f4d\uff0c\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u201c\u6280\u80fd\u201d\u8fdb\u5165\u6709\u58f0\u5708\u5c42\uff0c\u83b7\u5f97\u540c\u4faa\uff08\u201c\u6211\u4eec\u73ed\u90fd\u5f88\u725b\u7684\u201d\uff09\u7684\u8ba4\u53ef\u548c\u5c0a\u91cd\uff0c\u6446\u8131\u201c\u5c0f\u767d\u201d\u8eab\u4efd\u3002\u6280\u672f\u95e8\u69db\u662f\u5979\u6700\u5927\u7684\u6050\u60e7\u6e90\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u624b\u628a\u624b\u7684\u6280\u672f\u4fdd\u59c6\u5f0f\u966a\u4f34\u4e0e\u5373\u65f6\u80af\u5b9a\u7684\u201c\u88ab\u770b\u89c1\u201d\u611f**\u3002\u8ba9\u5979\u611f\u89c9\u201c\u88ab\u56e2\u961f\u9700\u8981\u201d\uff08\u5982\u4e3b\u52a8\u8bf4\u201c\u8fd8\u9700\u8981\u7684\u6211\u53ef\u4ee5\u201d\uff09\uff0c\u5e76\u786e\u4fdd\u6bcf\u4e00\u6b65\u64cd\u4f5c\u90fd\u6709\u660e\u786e\u6307\u5f15\uff0c\u6d88\u9664\u5176\u56e0\u201c\u4e0d\u61c2\u201d\u800c\u4ea7\u751f\u7684\u6050\u614c\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1** \u7c7b (\u8d44\u6e90\u5e95\u5ea7\u5b58\u5728\u660e\u663e\u77ed\u677f\uff0c\u5fc3\u7406\u5f39\u6027\u6781\u4f4e\uff0c\u4f46\u52a8\u673a\u5c1a\u5b58\uff0c\u9700\u9ad8\u5f3a\u5ea6\u652f\u6301) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u6280\u672f\u4f9d\u8d56\u6027\u5f3a\uff0c\u60c5\u7eea\u6613\u6ce2\u52a8\uff0c\u9700\u8981\u6301\u7eed\u7684\u60c5\u611f\u4e0e\u6280\u672f\u53cc\u91cd\u5b89\u629a) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u4f46**\u5bb6\u5ead\u5e72\u9884**\u4e0e**\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8**\u98ce\u9669\u6781\u9ad8)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u76f4\u63a5\u8bc1\u636e\uff0c\u4f46\u5bb6\u5ead\u4e8b\u52a1\uff08\u5e26\u5c0f\u5b69\u3001\u8001\u4eba\u53bb\u4e16\uff09\u5df2\u4e25\u91cd\u5f71\u54cd\u5176\u5b66\u4e60\u8282\u594f\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u9ad8** | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u4f5c\u4e3a\u5b9d\u5988\uff0c\u82e5\u56e0\u5b66\u4e60\u6324\u5360\u5bb6\u5ead\u65f6\u95f4\u6216\u8d44\u91d1\u5f15\u53d1\u77db\u76fe\uff0c\u98ce\u9669\u6781\u9ad8\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u65f6\u95f4\u788e\u7247\u5316+\u6280\u672f\u57fa\u7840\u5dee\uff0c\u4e00\u65e6\u4f5c\u4e1a\u5806\u79ef\u3001\u8f6f\u4ef6\u5b89\u88c5\u5361\u58f3\u6216\u8ddf\u4e0d\u4e0a\u76f4\u64ad\uff0c\u6781\u6613\u56e0\u81ea\u8d23\u548c\u632b\u8d25\u611f\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u5df2\u591a\u6b21\u66b4\u9732\u5bf9\u57fa\u7840\u64cd\u4f5c\u7684\u4e0d\u5b89\u3002\u4e00\u6b21\u8f6f\u4ef6\u5b89\u88c5\u5931\u8d25\u3001\u4e00\u6b21\u4f5c\u4e1a\u88ab\u6279\u8bc4\uff0c\u90fd\u53ef\u80fd\u6210\u4e3a\u60c5\u7eea\u5d29\u6e83\u7684\u5bfc\u706b\u7d22\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u76ee\u524d\u5904\u4e8e\u5b66\u4e60\u521d\u671f\uff0c\u5bf9\u6536\u76ca\u9884\u671f\u5c1a\u4e0d\u660e\u786e\uff0c\u4f46\u82e5\u540e\u671f\u53d1\u73b0\u63a5\u5355\u65e0\u671b\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c\u4e00\u5468\uff0c\u9996\u6b21\u72ec\u7acb\u5b8c\u6210\u8f6f\u4ef6\u5b89\u88c5\u4e0e\u57fa\u7840\u4f5c\u4e1a\u65f6**\u3002\u6280\u672f\u95e8\u69db\u662f\u5176\u7b2c\u4e00\u9053\u9b3c\u95e8\u5173\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u67e0\u6aac\u4f60\u597d\u5440\uff01\u770b\u5230\u4f60\u4e4b\u524d\u7528\u624b\u673a\u5b66\u4e60\u7279\u522b\u8ba4\u771f\uff0c\u771f\u7684\u5f88\u4e0d\u5bb9\u6613\u3002\u54b1\u4eec\u540e\u671f\u8bfe\u4e00\u5f00\u59cb\u8f6f\u4ef6\u5b89\u88c5\u53ef\u80fd\u4f1a\u6709\u70b9\u5c0f\u9ebb\u70e6\uff0c**\u5343\u4e07\u522b\u81ea\u5df1\u786c\u625b**\uff0c\u73ed\u73ed\u51c6\u5907\u4e86\u6700\u8be6\u7ec6\u7684\u56fe\u89e3\u548c\u8fdc\u7a0b\u534f\u52a9\uff0c\u4f60\u968f\u65f6\u558a\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u628a\u5b83\u641e\u5b9a\u3002\u4f60\u80af\u5b66\u3001\u80af\u95ee\uff0c\u8fd9\u5c31\u662f\u6700\u68d2\u7684\u5f00\u59cb\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u6b65\u6765\uff0c\u73ed\u73ed\u966a\u4f60\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf**\u3011\u3002\u9996\u8981\u76ee\u6807\u662f\u5efa\u7acb\u5b89\u5168\u611f\uff0c\u9632\u6b62\u5176\u56e0\u632b\u8d25\u611f\u6d41\u5931\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n    1.  **\u3010\u6781\u7b80\u6280\u672f\u811a\u624b\u67b6\u5305\u3011**\uff1a\u63d0\u4f9b\u624b\u673a\u7aef\u66ff\u4ee3\u65b9\u6848\u3001\u4e00\u952e\u5b89\u88c5\u811a\u672c\u3001\u8d85\u8be6\u7ec6\u56fe\u6587\u6b65\u9aa4\u3002\n    2.  **\u3010\u788e\u7247\u65f6\u95f4\u7ba1\u7406\u5305\u3011**\uff1a\u4e3a\u5176\u91cf\u8eab\u5b9a\u5236\u201c\u6bcf\u65e515\u5206\u949f\u201d\u5fae\u4efb\u52a1\u6e05\u5355\uff0c\u5316\u6574\u4e3a\u96f6\u3002\n    3.  **\u3010\u60c5\u7eea\u4ef7\u503c\u9ad8\u9891\u53cd\u9988\u5305\u3011**\uff1a\u5bf9\u5176\u4efb\u4f55\u5fae\u5c0f\u8fdb\u5c55\uff08\u5982\u6210\u529f\u5b89\u88c5\u8f6f\u4ef6\u3001\u5b8c\u6210\u4e00\u6bb5\u5f55\u97f3\uff09\u8fdb\u884c\u5373\u65f6\u3001\u516c\u5f00\u7684\u8868\u626c\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5728\u5979\u6c42\u52a9\u6280\u672f\u95ee\u9898\u65f6\uff0c\u56de\u590d\u201c\u8fd9\u4e2a\u5f88\u7b80\u5355\u201d\u3001\u201c\u4f60\u770b\u4e0b\u6559\u7a0b\u201d\u3002\u5fc5\u987b\u63d0\u4f9b**\u53ef\u6267\u884c\u7684\u5177\u4f53\u4e0b\u4e00\u6b65**\u6216\u7acb\u5373\u5b89\u6392\u8fdc\u7a0b\u534f\u52a9\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u786e\u4fdd\u5176\u80fd\u7a33\u5b9a\u5b8c\u6210\u5f53\u524d\u540e\u671f\u8bfe\u7a0b\u524d\uff0c\u7edd\u53e3\u4e0d\u63d0\u4efb\u4f55\u8bbe\u5907\u6216\u9ad8\u9636\u8bfe\u7a0b\u3002\u5f53\u524d\u6838\u5fc3\u662f\u201c\u9632\u6d41\u5931\u201d\uff0c\u800c\u975e\u201c\u6269\u9700\u6c42\u201d\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u73ed\u73ed\uff0c\u624b\u673a\u7528\u753b\u672c\u662f\u4e0d\u662f\u4e0d\u53ef\u4ee5\u201d **(\u6280\u672f\u4f9d\u8d56\u4e0e\u4e0d\u5b89)**\n2. > \u201c\u83ab\u540d\u6709\u70b9\u614c\uff0c\u201d **(\u60c5\u7eea\u8106\u5f31\u76f4\u63a5\u5916\u9732)**\n3. > \u201c\u73ed\u73ed\u6211\u5b89\u88c5\u7684\u8f6f\u4ef6\u600e\u4e48\u662f\u8fd9\u6837\u7684\u201d\u3001\u201c\u662f\u6211\u4e0b\u8f7d\u9519\u4e86\u5417\u201d **(\u5178\u578b\u7684\u6280\u672f\u6050\u60e7\u4e0e\u5de8\u5a74\u5f0f\u6c42\u52a9)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6\u60c5\u7eea\u5de8\u5a74\u578b**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u6280\u672f\u5b89\u5168\u611f\u548c\u7fa4\u4f53\u5f52\u5c5e\u611f**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u4fdd\u59c6\u7ea7\u6280\u672f\u624b\u628a\u624b\u6559\u5b66\u4e0e\u9ad8\u9891\u60c5\u7eea\u5b89\u629a**\uff0c\u5148\u4fdd\u7559\u5b58\uff0c\u518d\u8c08\u6210\u957f\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u793e\u4ea4\u5f52\u5c5e\u4e0e\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
