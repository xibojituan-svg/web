    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a676612176\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a676612176 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5927\u55b5\u5e08\u59d0\uff08\u738b\u73ca\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u77ed\u89c6\u9891\u8bfe\u7a0b\uff08\u4ef7\u683c\uff1a3980\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u88ab\u8feb\u5206\u671f**\uff08\u7528\u6237\u4e3b\u52a8\u8be2\u95ee\u201c\u5206\u671f\u653f\u7b56\u201d\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u767d\u5929\u770b\u56de\u653e\uff0c\u665a\u4e0a\u8981\u5e26\u5b69\u5b50\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\uff08\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\uff08\u6709\u660e\u786e\u76ee\u7684\u548c\u57fa\u7840\u6280\u80fd\uff0c\u4f46\u7f3a\u4e4f\u6df1\u5ea6\u60c5\u7eea\u548c\u5bb6\u5ead\u80cc\u666f\u4fe1\u606f\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34(\u4e2d)**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u76ee\u7684\u662f\u201c\u517c\u804c\u526f\u4e1a\u628a\u94b1\u201d\uff0c\u6709\u5f3a\u70c8\u7684\u73b0\u5b9e\u53d8\u73b0\u8bc9\u6c42\uff0c\u4f46\u5e76\u975e\u201c\u51e0\u5929\u5185\u63d0\u73b0\u201d\u7684\u6781\u7aef\u7126\u8651\uff0c\u4e14\u6709\u4e00\u5b9a\u5174\u8da3\u57fa\u7840\uff08\u201c\u505a\u8fc7\u526a\u8f91\u4e5f\u505a\u8fc7\u8c46\u5305\u548c\u5373\u68a6\u7684\u751f\u6210\u201d\uff0c\u201c\u6211\u81ea\u5df1\u505a\u7740\u73a9\u201d\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u517c\u804c\u526f\u4e1a\u628a\u94b1\u3002\u94b1\u4e0d\u597d\u8d5a\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u4e3b\u52a8\u8be2\u95ee\u5206\u671f\u653f\u7b56\uff0c\u8868\u660e\u4e00\u6b21\u6027\u652f\u4ed83980\u5143\u5b58\u5728\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e** \u2014 \u201c\u665a\u4e0a\u8981\u5e26\u5b69\u5b50\uff0c\u6240\u4ee5\u4e00\u822c\u6211\u90fd\u662f\u767d\u5929\u770b\u56de\u653e\u201d\uff0c\u65f6\u95f4\u88ab\u5bb6\u5ead\u8d23\u4efb\u4e25\u91cd\u6324\u538b\uff0c\u5448\u788e\u7247\u5316\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u672a\u63d0\u53ca\uff0c\u4f46\u9700\u8b66\u60d5\u56e0\u201c\u665a\u4e0a\u5e26\u5b69\u5b50\u201d\u53ef\u80fd\u5b58\u5728\u7684\u5bb6\u5ead\u65f6\u95f4\u51b2\u7a81\u98ce\u9669\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u27a1\u4e2d**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a(\u4e2d)**\u3002\u7528\u6237\u80fd\u4e3b\u52a8\u5b8c\u6210\u4f5c\u4e1a\u5e76\u5bfb\u6c42\u53cd\u9988\uff08\u201c\u662f\u8fd9\u6837\u4e48\u201d\uff09\uff0c\u5728\u83b7\u5f97\u6b63\u5411\u8bc4\u4ef7\uff08\u201c\u4f60\u8fd9\u4e2a\u53ef\u4ee5\u5440\u201d\uff09\u540e\u8868\u73b0\u51fa\u79ef\u6781\u56de\u5e94\uff08\u201c\u672a\u6765\u53ef\u671f\u201d\uff09\u3002\u65e0\u60c5\u7eea\u5d29\u6e83\u6216\u8fc7\u5ea6\u4f9d\u8d56\u8ff9\u8c61\uff0c\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u5b66\u4e60\u81ea\u4e3b\u6027\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u662f\u8fd9\u6837\u4e48\u201d (\u4e3b\u52a8\u63d0\u4ea4\u4f5c\u4e1a\u5e76\u5bfb\u6c42\u786e\u8ba4)\uff1b> \u201c\u672a\u6765\u53ef\u671f\u201d (\u83b7\u5f97\u80af\u5b9a\u540e\u7684\u79ef\u6781\u53cd\u9988)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u7ecf\u6d4e\u73b0\u72b6\u7684\u7126\u8651\u4e0e\u4e0d\u5b89\u5168\u611f**\u3002\u201c\u94b1\u4e0d\u597d\u8d5a\u201d\u3001\u201c\u5e74\u7eaa\u5927\u4e86\uff0c\u5750\u7684\u4f4f\u201d\u900f\u9732\u51fa\u5bf9\u5e74\u9f84\u589e\u957f\u548c\u6536\u5165\u6765\u6e90\u7684\u6df1\u5c42\u5fe7\u8651\uff0c\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u65b0\u6280\u80fd\u83b7\u5f97\u4e00\u4efd\u7a33\u5b9a\u7684\u526f\u4e1a\u6536\u5165\uff0c\u4ee5\u62b5\u5fa1\u672a\u6765\u7684\u4e0d\u786e\u5b9a\u6027\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u63d0\u4f9b\u4e00\u6761\u6e05\u6670\u3001\u53ef\u4fe1\u3001\u6709\u4fdd\u969c\u7684\u53d8\u73b0\u8def\u5f84**\u3002\u4ed6\u9700\u8981\u7684\u4e0d\u53ea\u662f\u6280\u80fd\uff0c\u66f4\u662f\u201c\u5b66\u4e86\u5c31\u80fd\u8d5a\u94b1\u201d\u7684\u5b89\u5168\u611f\u3002\u9700\u8981\u5c06\u8bfe\u7a0b\u5305\u88c5\u4e3a\u4e00\u4efd\u53ef\u9760\u7684\u201c\u804c\u4e1a\u4fdd\u9669\u201d\uff0c\u5e76\u7528\u5177\u4f53\u7684\u63a5\u5355\u6d41\u7a0b\u3001\u5de5\u4f5c\u5ba4\u8d44\u6e90\u6765\u5f3a\u5316\u8fd9\u79cd\u4fdd\u969c\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2** \u7c7b (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u8bba** (\u52a8\u673a\u4e2d\u7b49\u4f46\u8d44\u6e90\u5e95\u5ea7\u8584\u5f31\uff0c\u53d8\u73b0\u8bc9\u6c42\u660e\u786e\u4e14\u7d27\u8feb) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u7528\u6237\u867d\u8be2\u95ee\u5206\u671f\uff0c\u4f46\u672a\u63d0\u53ca\u501f\u8d37\uff08\u5982\u82b1\u5457/\u501f\u5457\uff09\uff0c\u4e14\u672a\u51fa\u73b0\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\u3002**\u4f46\u9700\u8b66\u60d5\u5176\u4eceT4\u5411T8-D\uff08\u7edd\u8def\u8d4c\u5f92\uff09\u7684\u6f5c\u5728\u9000\u5316\u98ce\u9669\u3002**\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u82e5\u4e3a\u9690\u7792\u5bb6\u4eba\u62a5\u540d\uff0c\u540e\u7eed\u56e0\u5b66\u4e60\u5360\u7528\u5bb6\u5ead\u65f6\u95f4\uff08\u665a\u4e0a\u5e26\u5b69\u5b50\uff09\u53ef\u80fd\u5f15\u53d1\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u788e\u7247\u5316\u65f6\u95f4\u5b66\u4e60\uff0c\u4e00\u65e6\u56e0\u5e26\u5b69\u5b50\u7b49\u5bb6\u5ead\u4e8b\u52a1\u5bfc\u81f4\u8bfe\u7a0b\u79ef\u538b\uff0c\u6781\u6613\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u3001\u5b66\u4e0d\u4f1a\u201d\u7684\u632b\u8d25\u611f\u548c\u7126\u8651\uff0c\u8fdb\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u7528\u6237\u6709\u4e00\u5b9a\u57fa\u7840\uff08\u201c\u57fa\u7840\u6bd4\u4e00\u822c\u7684\u5c0f\u5b69\u8981\u597d\u4e00\u5927\u622a\u201d\uff09\uff0c\u4e14\u4e3b\u52a8\u63d0\u4ea4\u4f5c\u4e1a\uff0c\u6280\u672f\u6027\u632b\u8d25\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u4f5c\u4e3aT4\u7528\u6237\uff0c\u5bf9\u201c\u591a\u4e45\u80fd\u63a5\u5355\u8d5a\u94b1\u201d\u62b1\u6709\u6781\u9ad8\u671f\u5f85\u3002\u82e5\u5f00\u8bfe\u540e\u77ed\u671f\u5185\uff08\u59821-2\u4e2a\u6708\uff09\u672a\u83b7\u5f97\u660e\u786e\u7684\u63a5\u5355\u673a\u4f1a\u6216\u6536\u5165\u53cd\u9988\uff0c\u6781\u6613\u56e0\u201c\u6295\u5165\u4ea7\u51fa\u6bd4\u4e0d\u7b26\u9884\u671f\u201d\u800c\u66b4\u6012\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c4-8\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u892a\u53bb\uff0c\u5b66\u4e60\u96be\u5ea6\u53ef\u80fd\u63d0\u5347\uff0c\u82e5\u4ecd\u672a\u770b\u5230\u53d8\u73b0\u5e0c\u671b\uff0c\u7ed3\u5408\u5176\u65f6\u95f4\u538b\u529b\uff0c\u9000\u8d39\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5e08\u5144/\u59d0\uff0c\u770b\u5230\u4f60\u8bf4\u2018\u665a\u4e0a\u8981\u5e26\u5b69\u5b50\u2019\uff0c\u592a\u7406\u89e3\u4e86\uff01\u54b1\u4eec\u5f88\u591a\u5b9d\u5988\u5b9d\u7238\u5b66\u5458\u90fd\u662f\u8fd9\u4e48\u8fc7\u6765\u7684\u3002\u522b\u62c5\u5fc3\uff0c\u54b1\u4eec\u7684\u8bfe\u7a0b\u56de\u653e\u968f\u65f6\u80fd\u770b\uff0c\u4f5c\u4e1a\u4e5f\u53ef\u4ee5\u7075\u6d3b\u5b89\u6392\u767d\u5929\u7684\u65f6\u95f4\u505a\u3002**\u6211\u4eec\u7684\u76ee\u6807\u5f88\u5b9e\u5728\uff0c\u5c31\u662f\u5e2e\u4f60\u628a\u788e\u7247\u65f6\u95f4\u53d8\u6210\u5b9e\u5b9e\u5728\u5728\u7684\u526f\u4e1a\u6536\u5165**\uff0c\u4e00\u6b65\u6b65\u6765\uff0c\u6211\u5e26\u4f60\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011**\u3002\u5fc5\u987b\u7d27\u6263\u5176\u201c\u641e\u94b1\u201d\u6838\u5fc3\u8bc9\u6c42\uff0c\u8bfe\u7a0b\u5185\u5bb9\u9700\u9ad8\u5ea6\u6307\u5411\u201c\u5546\u5355\u5236\u4f5c\u6d41\u7a0b\u201d\u3001\u201c\u63a5\u5355\u6e20\u9053\u201d\u3001\u201c\u5982\u4f55\u62a5\u4ef7\u201d\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176**\u65f6\u95f4\u788e\u7247\u5316**\u7279\u70b9\uff0c\u5fc5\u987b\u8865\u5145 **\u3010\u65f6\u95f4\u5f39\u6027\u652f\u6301\u5305\u3011**\uff08\u5982\uff1a\u63d0\u4f9b\u5168\u5929\u5019\u53ef\u56de\u770b\u7684\u7cbe\u526a\u7248\u5f55\u64ad\u3001\u4f5c\u4e1a\u63d0\u4ea4deadline\u9002\u5ea6\u653e\u5bbd\uff09\u3002\u9488\u5bf9\u5176**\u8d44\u6e90\u5e95\u5ea7\u8584\u5f31**\uff08\u8d44\u91d1\u3001\u65f6\u95f4\u53cc\u4f4e\uff09\uff0c\u4e25\u7981\u8fc7\u65e9\u63a8\u9500\u9ad8\u5ba2\u5355\u4ef7\u786c\u4ef6\u6216\u8fdb\u9636\u8bfe\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u753b\u4e0d\u5207\u5b9e\u9645\u7684\u5927\u997c**\uff08\u5982\u201c\u5b66\u5b8c\u7acb\u9a6c\u6708\u5165\u8fc7\u4e07\u201d\uff09\u30022. **\u7528\u4e25\u683c\u7684\u8003\u52e4\u7eaa\u5f8b\u65bd\u538b**\uff08\u5982\u201c\u7f3a\u52e4\u5c31\u6dd8\u6c70\u201d\uff09\uff0c\u8fd9\u4f1a\u52a0\u5267\u5176\u56e0\u5bb6\u5ead\u4e8b\u52a1\u65e0\u6cd5\u8ddf\u4e0a\u7684\u7126\u8651\u30023. **\u5ffd\u89c6\u5176\u5173\u4e8e\u201c\u63a5\u5355\u6d41\u7a0b\u201d\u7684\u5177\u4f53\u95ee\u9898**\uff08\u4ed6\u95ee\u4e86\u201c\u591a\u4eba\u62a2\u5355\u8fd8\u662f\u5148\u505a\u6d4b\u8bd5\u5355\u201d\uff0c\u8bf4\u660e\u4ed6\u5728\u7406\u6027\u8bc4\u4f30\u53ef\u884c\u6027\uff09\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u524d\u671f\u4e25\u7981\u4efb\u4f55\u5347\u5355**\u3002\u5fc5\u987b\u5728\u5176\u901a\u8fc7\u672c\u8bfe\u7a0b\u6210\u529f\u63a5\u5230\u7b2c\u4e00\u5355\u3001\u5efa\u7acb\u4fe1\u4efb\u548c\u4fe1\u5fc3\u540e\uff0c\u518d\u8c28\u614e\u8003\u8651\u63a8\u8350\u8fdb\u9636\u8bfe\u7a0b\u3002\u9996\u8981\u4efb\u52a1\u662f**\u7528\u4e00\u6b21\u771f\u5b9e\u7684\u3001\u54ea\u6015\u91d1\u989d\u5f88\u5c0f\u7684\u63a5\u5355\u4f53\u9a8c\uff0c\u7a33\u4f4f\u5176\u6838\u5fc3\u9884\u671f**\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u517c\u804c\u526f\u4e1a\u628a\u94b1\u3002\u94b1\u4e0d\u597d\u8d5a\u201d **\u2014\u2014 \u6838\u5fc3\u52a8\u673a\uff1a\u52a1\u5b9e\u53d8\u73b0\uff0c\u62b5\u5fa1\u7ecf\u6d4e\u7126\u8651\u3002**\n2. > \u201c\u5e74\u7eaa\u5927\u4e86\uff0c\u5750\u7684\u4f4f[\u7834\u6d95\u4e3a\u7b11]\u201d **\u2014\u2014 \u81ea\u6211\u8ba4\u77e5\uff1a\u6709\u8010\u5fc3\u5b66\u4e60\uff0c\u4f46\u9690\u542b\u5e74\u9f84\u5e26\u6765\u7684\u804c\u4e1a\u5371\u673a\u611f\u3002**\n3. > \u201c\u665a\u4e0a\u8981\u5e26\u5b69\u5b50\uff0c\u6240\u4ee5\u4e00\u822c\u6211\u90fd\u662f\u767d\u5929\u770b\u56de\u653e\u201d **\u2014\u2014 \u8d44\u6e90\u5e95\u5ea7\u77ed\u677f\uff1a\u65f6\u95f4\u88ab\u4e25\u91cd\u5207\u5272\uff0c\u662f\u540e\u7eed\u8ddf\u8fdb\u7684\u6700\u5927\u98ce\u9669\u70b9\u3002**\n4. > \u201c\u63a5\u5355\u662f\u4e2a\u4ec0\u4e48\u6d41\u7a0b\u3002\u591a\u4eba\u62a2\u5355\u8fd8\u662f\u600e\u4e48\u6837\u201d **\u2014\u2014 T4\u5178\u578b\u7279\u5f81\uff1a\u6781\u5ea6\u5173\u6ce8\u53d8\u73b0\u8def\u5f84\u7684\u5177\u4f53\u7ec6\u8282\u548c\u516c\u5e73\u6027\uff0c\u5728\u51b3\u7b56\u524d\u8fdb\u884c\u7406\u6027\u98ce\u9669\u8bc4\u4f30\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4 \u641e\u94b1\u7ed3\u679c\u8bba\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\uff08\u7ecf\u6d4e\u4fdd\u969c\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u4e25\u683c\u7ba1\u63a7\u201c\u5feb\u901f\u53d8\u73b0\u201d\u9884\u671f + \u63d0\u4f9b\u6781\u81f4\u5f39\u6027\u7684\u65f6\u95f4\u652f\u6301\uff0c\u5e76\u7528\u4e00\u6b21\u771f\u5b9e\u7684\u5fae\u5c0f\u63a5\u5355\u4f53\u9a8c\u5feb\u901f\u5151\u73b0\u627f\u8bfa\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u8bba\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf\", \"age\": \"\u672a\u77e5\uff08\u81ea\u79f0\u5e74\u7eaa\u5927\u4e86\uff09\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
