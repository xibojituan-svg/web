    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677175395 (\u6635\u79f0\uff1a\u6168\u800c\u6177/\u590f\u4faf\u674e\u82f1) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e - \u5c0f\u73891(\u7eaa\u6587\u7389) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bad\u7ec3\u8425 (\u652f\u4ed8\u4ef7\uff1a3980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u5168\u6b3e\u5145\u88d5** (\u4e00\u6b21\u6027\u652f\u4ed83980\u5143\uff0c\u672a\u63d0\u53ca\u5206\u671f\u6216\u501f\u6b3e) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u9ad8\u5bbd\u88d5** (\u9000\u4f11\u72b6\u6001\uff0c\u4e3b\u4e1a\u65e0\u538b\u529b\uff0c\u81ea\u8ff0\u6bcf\u5929\u53ef\u6295\u51652-4\u5c0f\u65f6) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** (\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u6210\u5458\u6216\u5bb6\u5ead\u51b3\u7b56\u4fe1\u606f) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** (\u7528\u6237\u4e3b\u52a8\u63d0\u4f9b\u4e86\u5e74\u9f84\u3001\u804c\u4e1a\u3001\u57ce\u5e02\u3001\u52a8\u673a\u7b49\u5173\u952e\u4fe1\u606f\uff0c\u4e92\u52a8\u79ef\u6781) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u2b06\u9ad8]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u800c\u6765(\u9ad8)\u3002\u7528\u6237\u660e\u786e\u586b\u5199\u201c\u8c0b\u751f\u201d\u4f5c\u4e3a\u76ee\u6807\uff0c\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u751f\u5b58\u9a71\u52a8\u548c\u7ed3\u679c\u5bfc\u5411\u3002\u5bf9\u201c\u5751\u201d\u548c\u201c\u4e71\u8c61\u201d\u7684\u8b66\u60d5\uff0c\u4e5f\u53cd\u5411\u5370\u8bc1\u5176\u5bf9\u201c\u771f\u5b9e\u53d8\u73b0\u201d\u7684\u6e34\u671b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c[\u6765\u8bad\u7ec3\u8425\u60f3\u6536\u83b7\u4ec0\u4e48\uff1f\u8d5a\u7c73/\u5174\u8da3]: \u8c0b\u751f\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u2b07\u4f4e]** \u2014 \u7528\u6237\u4e3a56\u5c81\u9000\u4f11\u4eba\u5458\uff0c\u65e0\u4e1a\uff0c\u4e00\u6b21\u6027\u652f\u4ed83980\u5143\u5b66\u8d39\u540e\u8868\u73b0\u51fa\u660e\u663e\u7684**\u8d44\u91d1\u654f\u611f\u548c\u652f\u4ed8\u540e\u7126\u8651**\uff08\u201c\u54ac\u54ac\u7259\u4ea4\u4e863980\u201d\u3001\u201c\u5411\u964c\u751f\u4eba\u8f6c\u8d26\u592a\u5413\u4eba\u4e86\u201d\uff09\uff0c\u8868\u660e\u8fd9\u7b14\u652f\u51fa\u5bf9\u5176\u800c\u8a00\u5e76\u975e\u8f7b\u677e\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**[\u2b06\u9ad8]** \u2014 \u9000\u4f11\u72b6\u6001\uff0c\u4e3b\u4e1a\u65e0\u538b\u529b\uff0c\u81ea\u8ff0\u6bcf\u5929\u53ef\u6295\u51652-4\u5c0f\u65f6\u5b66\u4e60\uff0c\u65f6\u95f4\u9ad8\u5ea6\u81ea\u7531\u4e14\u5145\u88d5\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u4fe1\u606f\u7f3a\u5931]** \u2014 \u804a\u5929\u8bb0\u5f55\u5b8c\u5168\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\uff0c\u65e0\u6cd5\u5224\u65ad\u3002**\u6b64\u7ef4\u5ea6\u7f3a\u5931\u6784\u6210\u91cd\u5927\u98ce\u9669\u76f2\u533a\u3002**\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b07\u4f4e\u6781\u5371]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u652f\u4ed8\u540e\u77ac\u95f4\u9677\u5165\u9ad8\u5ea6\u7126\u8651\u548c\u4e0d\u4fe1\u4efb\u72b6\u6001\uff0c\u9700\u8981\u9500\u552e\u53cd\u590d\u5b89\u629a\u548c\u8bc1\u660e\u201c\u5b98\u65b9\u201d\u8eab\u4efd\u3002\u5bf9\u64cd\u4f5c\u6d41\u7a0b\uff08\u5982\u8fdb\u7fa4\u3001\u9886\u5238\uff09\u7684\u56f0\u60d1\u4f1a\u8fc5\u901f\u8f6c\u5316\u4e3a\u516c\u5f00\u7684\u6050\u614c\u548c\u5a01\u80c1\uff08\u201c\u6211\u8981\u62a5\u6848\u7684\u201d\uff09\uff0c\u663e\u793a\u51fa\u6781\u4f4e\u7684\u4fe1\u4efb\u9608\u503c\u548c\u6781\u9ad8\u7684\u60c5\u7eea\u6ce2\u52a8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u94b1\u5df2\u7ecf\u7f34\u4e86\uff0c\u4e0d\u5151\u73b0\u627f\u8bfa\uff0c\u6211\u8981\u62a5\u6848\u7684\uff0c\u5411\u964c\u751f\u4eba\u8f6c\u8d26\u592a\u5413\u4eba\u4e86[\u53d1\u5446]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e00\u5c42\uff1a\u751f\u5b58\u5b89\u5168** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u9000\u4f11\u540e\u7684\u7ecf\u6d4e\u4e0d\u5b89\u5168\u611f\u4e0e\u4ef7\u503c\u7f3a\u5931**\u300256\u5c81\u9000\u4f11\u65e0\u4e1a\uff0c\u201c\u8c0b\u751f\u201d\u662f\u6838\u5fc3\u9a71\u52a8\u529b\uff0c\u652f\u4ed8\u5927\u989d\u5b66\u8d39\u540e\u7684\u6050\u614c\u76f4\u63a5\u66b4\u9732\u4e86\u5176\u8d22\u52a1\u8106\u5f31\u6027\u548c\u5bf9\u201c\u88ab\u9a97\u201d\u7684\u6df1\u5ea6\u6050\u60e7\uff0c\u672c\u8d28\u662f\u5bfb\u6c42\u4e00\u4efd\u80fd\u5e26\u6765\u7a33\u5b9a\u6536\u5165\u7684\u5b89\u5168\u4fdd\u969c\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u786e\u5b9a\u6027\u4e0e\u5b89\u5168\u611f**\u3002\u4ed6\u4e0d\u9700\u8981\u865a\u65e0\u7684\u68a6\u60f3\uff0c\u9700\u8981\u7684\u662f\u201c\u6bcf\u4e00\u6b65\u90fd\u770b\u5f97\u89c1\u3001\u6478\u5f97\u7740\u201d\u7684\u8def\u5f84\u3001\u660e\u786e\u7684\u89c4\u5219\u3001\u4ee5\u53ca\u5b98\u65b9\u80cc\u4e66\u7684\u201c\u7edd\u5bf9\u9760\u8c31\u201d\u627f\u8bfa\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2** \u7c7b (\u9ad8\u52a8\u673a\uff0c\u4f46\u8d44\u6e90\u5e95\u5ea7\u5b58\u5728\u77ed\u677f\u3010\u8d44\u91d1\u627f\u8f7d\u529b\u4f4e\u3011\uff0c\u4e14\u5fc3\u7406\u5f39\u6027\u6781\u5371) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u578b** (\u6838\u5fc3\u9a71\u52a8\u662f\u201c\u8c0b\u751f\u201d\u548c\u53d8\u73b0) \u4e0e **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u652f\u4ed8\u540e\u7126\u8651\u7206\u53d1\u3001\u64cd\u4f5c\u4f9d\u8d56) \u7684**\u6df7\u5408\u4f53**\u3002\u5f53\u524d\u9636\u6bb5\uff0c**T6\u7279\u5f81\u5360\u636e\u4e3b\u5bfc**\u3002 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u75c7\u7b49\u6781\u7aef\u60c5\u51b5)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a/\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **[\u9ad8]** | **\u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u98ce\u9669\u6781\u9ad8**\u3002\u82e5\u5b66\u8d39\u662f\u7792\u7740\u5bb6\u4eba\u52a8\u7528\u517b\u8001/\u50a8\u84c4\uff0c\u4e00\u65e6\u5bb6\u4eba\u77e5\u60c5\uff0c\u6781\u6613\u5f15\u53d1\u5f3a\u70c8\u5e72\u9884\u548c\u9000\u8d39\u8981\u6c42\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **[\u4f4e]** | \u65f6\u95f4\u5145\u88d5\uff0c\u5b66\u4e60\u610f\u613f\u5f3a\uff0c\u6280\u672f\u6027\u8ddf\u4e0d\u4e0a\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **[\u6781\u9ad8]** | **\u652f\u4ed8\u540e\u7126\u8651\u7684\u5ef6\u7eed**\u3002\u5f00\u8bfe\u540e\u82e5\u9047\u5230\u4efb\u4f55\u64cd\u4f5c\u56f0\u96be\uff08\u8f6f\u4ef6\u5b89\u88c5\u3001\u4f5c\u4e1a\u63d0\u4ea4\uff09\u3001\u6216\u7b2c\u4e00\u5468\u672a\u770b\u5230\u201c\u7acb\u5373\u53d8\u73b0\u201d\u7684\u82d7\u5934\uff0c\u4f1a\u56e0\u201c\u88ab\u9a97\u201d\u611f\u800c\u77ac\u95f4\u5d29\u6e83\u8981\u6c42\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **[\u9ad8]** | \u5bf9\u201c\u5feb\u901f\u517c\u804c\u8d5a\u94b1\u201d\u62b1\u6709\u9ad8\u671f\u5f85\uff0c\u82e5\u521d\u671f\u63a5\u5355\u4e0d\u987a\u6216\u6536\u5165\u5fae\u8584\uff0c\u4f1a\u8fc5\u901f\u8d28\u7591\u8bfe\u7a0b\u4ef7\u503c\uff0c\u8ba4\u4e3a\u4e0e\u201c\u8c0b\u751f\u201d\u76ee\u6807\u4e0d\u7b26\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e48\u5c0f\u65f6\u5185**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u5177\u4f53\u64cd\u4f5c\u96be\u9898\u51fa\u73b0\uff0c\u82e5\u6ca1\u6709\u7acb\u5373\u83b7\u5f97\u201c\u88ab\u63a5\u4f4f\u201d\u7684\u5b89\u5168\u611f\u548c\u5fae\u5c0f\u6b63\u53cd\u9988\uff0c\u5176\u79ef\u7d2f\u7684\u7126\u8651\u5c06\u5168\u9762\u7206\u53d1\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u590f\u4faf\u5927\u54e5/\u963f\u59e8\uff0c\u770b\u5230\u60a8\u7f34\u8d39\u6210\u529f\u4e86\uff0c\u9996\u5148\u7279\u522b\u611f\u8c22\u60a8\u7684\u4fe1\u4efb\uff01\u6211\u77e5\u9053\u60a8\u8fd9\u4e2a\u51b3\u5b9a\u505a\u5f97\u4e0d\u5bb9\u6613\uff0c\u5c24\u5176\u662f\u73b0\u5728\u7f51\u4e0a\u4fe1\u606f\u6742\uff0c\u60a8\u6709\u987e\u8651\u592a\u6b63\u5e38\u4e86\u3002\u60a8\u653e\u5fc3\uff0c\u4ece\u4eca\u5929\u8d77\uff0c\u6211\u5c31\u662f\u60a8\u5728\u559c\u9a6c\u62c9\u96c5\u7684\u2018\u5bf9\u63a5\u4eba\u2019\uff0c\u4efb\u4f55\u64cd\u4f5c\u4e0a\u7684\u4e8b\uff0c\u54ea\u6015\u518d\u5c0f\uff0c\u60a8\u968f\u65f6\u95ee\u6211\uff0c\u6211\u4e00\u6b65\u6b65\u5e26\u60a8\u8d70\u3002\u54b1\u4eec\u4e0d\u56fe\u5feb\uff0c\u5c31\u56fe\u7a33\uff0c\u5148\u628a\u7b2c\u4e00\u6b65\u8d70\u8e0f\u5b9e\u4e86\u3002\u60a8\u7684\u58f0\u97f3\u5e95\u5b50\u5f88\u597d\uff0c\u54b1\u4eec\u5148\u5b9a\u4e2a\u5c0f\u76ee\u6807\uff0c\u6bd4\u5982\u8fd9\u5468\u5148\u719f\u6089\u63a5\u5355\u5e73\u53f0\uff0c\u6211\u5e2e\u60a8\u6311\u4e00\u4e2a\u6700\u9002\u5408\u65b0\u4eba\u7684\u2018\u4fdd\u5e95\u2019\u4e66\u5355\u8bd5\u8bd5\u6c34\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5feb\u901f\u63a5\u5355\u7ebf**\u3011\u3002\u5fc5\u987b\u4f18\u5148\u6ee1\u8db3\u5176\u201c\u8c0b\u751f\u201d\u7684\u751f\u5b58\u9700\u6c42\uff0c\u7528\u6700\u5feb\u901f\u5ea6\uff08\u54ea\u6015\u662f\u5c0f\u989d\u65f6\u85aa\u5355\uff09\u8ba9\u5176\u770b\u5230\u73b0\u91d1\u6d41\u5165\uff0c\u5efa\u7acb\u521d\u6b65\u4fe1\u4efb\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176T6\u7279\u8d28\uff0c\u5fc5\u987b\u5f3a\u5236\u6302\u8f7d\u3010**\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305**\u3011\u3002\u5305\u62ec\uff1a1\uff09**\u624b\u628a\u624b\u64cd\u4f5c\u6307\u5357**\uff08\u56fe\u6587/\u89c6\u9891\uff09\uff1b2\uff09**\u9ad8\u98911\u5bf91\u8fdb\u5ea6\u786e\u8ba4**\uff08\u6bcf\u65e5/\u6bcf\u4e24\u65e5\uff09\uff1b3\uff09**\u5fae\u5c0f\u6210\u5c31\u5373\u65f6\u53cd\u9988**\uff08\u5982\u201c\u4eca\u5929\u6c14\u606f\u7ec3\u5f97\u5f88\u597d\u201d\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1\uff09\u7edd\u4e0d\u5bf9\u5176\u63cf\u7ed8\u201c\u6708\u5165\u8fc7\u4e07\u201d\u7684\u9065\u8fdc\u84dd\u56fe\uff0c\u8981\u8c08\u201c\u4e0b\u5468\u53ef\u80fd\u6709\u7684100\u5143\u65f6\u85aa\u5355\u201d\uff1b2\uff09\u7edd\u4e0d\u5728\u5176\u62b1\u6028\u65f6\u8bb2\u5927\u9053\u7406\uff0c\u8981\u5148\u5171\u60c5\u518d\u7ed9\u89e3\u51b3\u65b9\u6848\uff1b3\uff09\u7edd\u4e0d\u8ba9\u5176\u72ec\u81ea\u9762\u5bf9\u4efb\u4f55\u5e73\u53f0\u64cd\u4f5c\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5347\u5355**\u3002\u5728\u5b8c\u6210\u9996\u4e2a\u53d8\u73b0\u5468\u671f\uff08\u5982\u6210\u529f\u83b7\u5f97\u7b2c\u4e00\u7b14\u6536\u5165\uff09\u5e76\u5efa\u7acb\u7a33\u56fa\u4fe1\u4efb\u524d\uff0c\u4efb\u4f55\u9644\u52a0\u6d88\u8d39\u5efa\u8bae\u90fd\u4f1a\u5f15\u7206\u5176\u201c\u88ab\u9a97\u201d\u654f\u611f\u795e\u7ecf\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c[\u6765\u8bad\u7ec3\u8425\u60f3\u6536\u83b7\u4ec0\u4e48\uff1f\u8d5a\u7c73/\u5174\u8da3]: \u8c0b\u751f\u201d\n2. > \u201c\u4e0d\u662f\u5751\u5c31\u597d\uff0c\u73b0\u5728\u4e71\u8c61\u592a\u591a\u4e86\uff0c\u771f\u5047\u96be\u8fa8\u201d\n3. > \u201c\u94b1\u5df2\u7ecf\u7f34\u4e86\uff0c\u4e0d\u5151\u73b0\u627f\u8bfa\uff0c\u6211\u8981\u62a5\u6848\u7684\uff0c\u5411\u964c\u751f\u4eba\u8f6c\u8d26\u592a\u5413\u4eba\u4e86[\u53d1\u5446]\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010\u7126\u8651\u578b\u751f\u5b58\u8c0b\u751f\u8005\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u751f\u5b58\u5b89\u5168\u4fdd\u969c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5f00\u8bfe48\u5c0f\u65f6\u5185\u63d0\u4f9b\u201c\u624b\u628a\u624b\u201d\u7ea7\u64cd\u4f5c\u966a\u62a4\u4e0e\u5fae\u5c0f\u6b63\u53cd\u9988\uff08\u5982\u7b2c\u4e00\u4e2a\u8bd5\u97f3\u673a\u4f1a\uff09\u3011**\u3002\n\n```json\n{\"core_type\": \"T4\u641e\u94b1\u7ed3\u679c\u578b/T6\u60c5\u7eea\u5de8\u5a74\u578b\uff08\u6df7\u5408\uff0c\u5f53\u524dT6\u4e3b\u5bfc\uff09\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u751f\u5b58\u5b89\u5168\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf + \u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\"}\n```";
