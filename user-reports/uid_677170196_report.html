        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID 677170196 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u7b71\u65f6\u5149(\u6d66\u723d) / \u516d\u6708\u6668\u516e-\u5b98\u65b9\u62db\u52df\u5b98\uff08\u672a\u6210\u5e74\u4eba\u52ff\u52a0\uff09(\u6d66\u723d) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u7cfb\u7edf\u8bfe\uff08\u6500\u767b\u8ba1\u5212\uff09\uff0c\u4ef7\u683c2380\u5143 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u63a8\u6d4b\u4e3a\u788e\u7247\u5316\u65f6\u95f4\uff08\u53ef\u665a\u95f4\u5b66\u4e60\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u672a\u63d0\u53ca |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e2d\u7b49\u504f\u8584\uff08\u7528\u6237\u4e3b\u52a8\u8868\u8fbe\u8f83\u5c11\uff0c\u591a\u4e3a\u9500\u552e\u5f15\u5bfc\u4e0b\u7684\u56de\u5e94\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u800c\u6765(\u9ad8)\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5b66\u4e60\u610f\u613f\u548c\u6280\u80fd\u7cbe\u8fdb\u8bc9\u6c42\uff0c\u4e3b\u52a8\u8bf7\u6559\u6280\u672f\u7ec6\u8282\uff08\u53e3\u6c34\u97f3\u95ee\u9898\uff09\uff0c\u5bf9\u9500\u552e\u7ed9\u4e88\u7684\u79ef\u6781\u53cd\u9988\uff08\u201c\u5f88\u68d2\u5f88\u68d2\u201d\uff09\u548c\u5177\u4f53\u6307\u5bfc\uff08\u201c\u6211\u518d\u6539\u8fdb\u4e00\u4e0b\u201d\uff09\u6709\u6b63\u5411\u56de\u5e94\uff0c\u5e76\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u548c\u6253\u5361\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u60f3\u8bf7\u6559\u4e00\u4e0b\uff0c\u6211\u5f55\u7740\u7684\u65f6\u5019\u611f\u89c9\u5634\u5df4\u91cc\u53e3\u6c34\u8d8a\u6765\u8d8a\u591a\uff0c\u53c8\u4e0d\u597d\u76f4\u63a5\u54bd\u4e0b\u53bb\u5c31\u5f88\u82e6\u607c\u3002\u5f55\u4e4b\u524d\u4e5f\u6ca1\u5403\u4e1c\u897f\uff0c\u4e0d\u77e5\u9053\u548b\u6837\u80fd\u6539\u5584\u4e00\u4e0b\u201d > \u201c\u597d\u7684\u5e08\u59d0\u6211\u518d\u6539\u8fdb\u4e00\u4e0b\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a\u4e2d \u2014 \u80fd\u652f\u4ed82380\u5143\u8bfe\u7a0b\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u652f\u4ed8\u65b9\u5f0f\u53ca\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a\u4e2d \u2014 \u80fd\u8ddf\u4e0a\u6bcf\u65e5\u5b66\u4e60\u4efb\u52a1\uff08\u6668\u7ec3\u3001\u542c\u8bfe\u3001\u4ea4\u4f5c\u4e1a\uff09\uff0c\u5e76\u5728\u665a\u95f4\uff0822:14\uff09\u63d0\u4ea4\u4f5c\u4e1a\uff0c\u8868\u660e\u6709\u76f8\u5bf9\u7a33\u5b9a\u7684\u788e\u7247\u5316\u5b66\u4e60\u65f6\u95f4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a\u672a\u77e5 \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9762\u5bf9\u6280\u672f\u95ee\u9898\uff08\u53e3\u6c34\u97f3\uff09\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u800c\u975e\u62b1\u6028\u6216\u81ea\u6211\u5426\u5b9a\u3002\u5bf9\u9500\u552e\u7684\u5177\u4f53\u6307\u5bfc\uff08\u5982\u8bed\u6c14\u3001\u8282\u594f\u8c03\u6574\uff09\u80fd\u5feb\u901f\u7406\u89e3\u5e76\u6267\u884c\u6539\u8fdb\uff0c\u8868\u73b0\u51fa\u826f\u597d\u7684\u5b66\u4e60\u9002\u5e94\u6027\u548c\u6297\u538b\u6027\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u60f3\u8bf7\u6559\u4e00\u4e0b\uff0c\u6211\u5f55\u7740\u7684\u65f6\u5019\u611f\u89c9\u5634\u5df4\u91cc\u53e3\u6c34\u8d8a\u6765\u8d8a\u591a\uff0c\u53c8\u4e0d\u597d\u76f4\u63a5\u54bd\u4e0b\u53bb\u5c31\u5f88\u82e6\u607c\u3002\u5f55\u4e4b\u524d\u4e5f\u6ca1\u5403\u4e1c\u897f\uff0c\u4e0d\u77e5\u9053\u548b\u6837\u80fd\u6539\u5584\u4e00\u4e0b\u201d \uff08\u4e3b\u52a8\u6c42\u89e3\uff09> \u201c\u597d\u7684\u5e08\u59d0\u6211\u518d\u6539\u8fdb\u4e00\u4e0b\u201d \uff08\u79ef\u6781\u63a5\u53d7\u53cd\u9988\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u4e13\u4e1a\u80fd\u529b\u63d0\u5347\u7684\u6e34\u671b\uff0c\u4ee5\u53ca\u5e0c\u671b\u83b7\u5f97\u6743\u5a01\uff08\u5e08\u59d0/\u5e73\u53f0\uff09\u7684\u8ba4\u53ef\u4e0e\u8d44\u6e90\u503e\u659c\uff08\u5982\u4e13\u5c5e\u7248\u6743\u4e66\uff09\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u8d44\u6e90\u4e0a\u7684\u4f18\u5148\u611f**\u3002\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u770b\u597d\u4f60\u201d\u3001\u201c\u7ed9\u4f60\u5360\u540d\u989d\u201d\u3001\u201c\u4f60\u662f\u91cd\u70b9\u57f9\u517b\u5bf9\u8c61\u201d\uff0c\u7cbe\u51c6\u51fb\u4e2d\u4e86\u7528\u6237\u5bf9\u201c\u88ab\u9009\u4e2d\u201d\u3001\u201c\u88ab\u91cd\u89c6\u201d\u7684\u5c0a\u91cd\u9700\u6c42\uff0c\u5e76\u4e3a\u5176\u63cf\u7ed8\u4e86\u901a\u8fc7\u7cbe\u8fdb\u6280\u80fd\u5b9e\u73b0\u81ea\u6211\u4ef7\u503c\u7684\u8def\u5f84\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7B \u7c7b |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u5411\u6df7\u5408\u4f533\u53f7\u3010\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b\u3011\u8fdb\u5316\u524d\u4f53) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u884c\u4e3a\u72ec\u7acb\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u5b66\u4e60\u610f\u613f\u5f3a\uff0c\u80fd\u8ddf\u4e0a\u8282\u594f\uff0c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5c1a\u53ef\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u632b\u6298\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u82e5\u5b66\u4e60\u540e\u671f\u63a5\u5355\u673a\u4f1a\u4e0e\u9500\u552e\u627f\u8bfa\uff08\u201c\u65f6\u85aa90-300\u201d\u3001\u201c\u5e26\u4f60\u5165\u884c\u201d\uff09\u5dee\u8ddd\u8fc7\u5927\uff0c\u53ef\u80fd\u4ea7\u751f\u5931\u671b\u60c5\u7eea\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe2-3\u4e2a\u6708\u540e\uff0c\u5f53\u6280\u80fd\u63d0\u5347\u4f46\u63a5\u5355\u6e20\u9053\u6216\u6536\u5165\u672a\u8fbe\u9884\u671f\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u770b\u5230\u4f60\u5728\u4f53\u9a8c\u8425\u7684\u8868\u73b0\uff0c\u80fd\u611f\u89c9\u5230\u4f60\u662f\u4e2a\u8e0f\u5b9e\u80af\u5b66\u3001\u5bf9\u81ea\u5df1\u6709\u8981\u6c42\u7684\u4eba\u3002\u63a5\u4e0b\u6765\u7684\u7cfb\u7edf\u8bfe\uff0c\u6211\u4f1a\u7ed9\u4f60\u5339\u914d\u66f4\u6709\u6311\u6218\u6027\u7684\u4efb\u52a1\u548c\u66f4\u7ec6\u81f4\u7684\u6307\u5bfc\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u628a\u771f\u672c\u4e8b\u5b66\u5230\u624b\u3002\u6709\u4efb\u4f55\u6280\u672f\u4e0a\u7684\u2018\u786c\u9aa8\u5934\u2019\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4eec\u4e00\u8d77\u5543\u4e0b\u6765\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011+ **\u89c2\u5bdf\u5e76\u9002\u65f6\u542f\u52a8\u3010\u9ec4\u888d\u52a0\u8eab\u63d0\u5e72\u6cd5\u3011**\u3002\u56e0\u5176\u8868\u73b0\u51fa\u9ad8\u670d\u4ece\u6027\u3001\u9ad8\u6267\u884c\u529b\uff08T2\u7279\u8d28\uff09\uff0c\u4e14\u5bf9\u4e13\u4e1a\u6307\u5bfc\u63a5\u53d7\u5ea6\u9ad8\uff0c\u662f\u6f5c\u5728\u7684\u73ed\u7ea7\u751f\u6001\u5efa\u8bbe\u8005\u3002\u5f53\u5176\u6280\u80fd\u8fbe\u6807\u5e76\u51fa\u73b0\u4e3b\u52a8\u5e2e\u52a9\u4ed6\u4eba\u6216\u7ba1\u7406\u503e\u5411\u65f6\uff0c\u5e94\u7acb\u5373\u63d0\u62d4\u4e3a\u5c0f\u7ec4\u957f\u6216\u4f5c\u4e1a\u7edf\u8ba1\u5b98\uff0c\u8d4b\u4e88\u5176D\u6a21\u5757\u6743\u9650\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u8fc7\u4e8e\u6d6e\u5938\u3001\u4e0d\u5207\u5b9e\u9645\u7684\u201c\u66b4\u5bcc\u201d\u8bdd\u672f\u523a\u6fc0\u5176\u9884\u671f\uff1b\u5ffd\u89c6\u5176\u6280\u672f\u7cbe\u8fdb\u9700\u6c42\uff0c\u53ea\u8fdb\u884c\u60c5\u611f\u5b89\u629a\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u8fdb\u884c\u5927\u989d\u63a8\u4ecb\uff08\u5982\u9ad8\u9636\u8bbe\u5907\u3001\u79c1\u6559\u8bfe\uff09\uff0c\u4f46**\u5fc5\u987b\u5efa\u7acb\u5728\u624e\u5b9e\u7684\u6280\u80fd\u8fdb\u6b65\u548c\u771f\u5b9e\u7684\u63a5\u5355\u6848\u4f8b\u5c55\u793a\u57fa\u7840\u4e0a**\uff0c\u907f\u514d\u7a7a\u5934\u627f\u8bfa\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u60f3\u8bf7\u6559\u4e00\u4e0b\uff0c\u6211\u5f55\u7740\u7684\u65f6\u5019\u611f\u89c9\u5634\u5df4\u91cc\u53e3\u6c34\u8d8a\u6765\u8d8a\u591a\uff0c\u53c8\u4e0d\u597d\u76f4\u63a5\u54bd\u4e0b\u53bb\u5c31\u5f88\u82e6\u607c\u3002\u5f55\u4e4b\u524d\u4e5f\u6ca1\u5403\u4e1c\u897f\uff0c\u4e0d\u77e5\u9053\u548b\u6837\u80fd\u6539\u5584\u4e00\u4e0b\u201d **(\u4e3b\u52a8\u6c42\u89e3\uff0c\u52a8\u673a\u7eaf\u5ea6\u9ad8\u7684\u4f53\u73b0)**\n2. > \u201c\u597d\u7684\u5e08\u59d0\u6211\u518d\u6539\u8fdb\u4e00\u4e0b\u201d **(\u9ad8\u670d\u4ece\u6027\u3001\u9ad8\u6267\u884c\u529b\uff0cT2\u5178\u578b\u7279\u5f81)**\n3. > \u201cyes\u201d **(\u5bf9\u201c\u51c6\u5907\u597d\u6b63\u5f0f\u8fdb\u5165\u6709\u58f0\u884c\u4e1a\u201d\u7684\u660e\u786e\u80af\u5b9a\uff0c\u76ee\u6807\u5bfc\u5411)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u81ea\u6211\u5b9e\u73b0\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u624e\u5b9e\u7684\u6280\u672f\u6307\u5bfc\u4e0e\u771f\u5b9e\u7684\u6210\u957f\u8def\u5f84\uff0c\u907f\u514d\u753b\u997c\uff0c\u5e76\u9002\u65f6\u8d4b\u4e88\u7ba1\u7406\u6743\u9650\uff08D\u6a21\u5757\uff09\u4ee5\u6fc0\u53d1\u5176\u8d23\u4efb\u611f\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
