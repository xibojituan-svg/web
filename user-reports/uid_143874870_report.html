    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a (UID: 143874870)\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u4e2d\u4f4e**\u3002\u7528\u6237\u6838\u5fc3\u8bc9\u6c42\u660e\u786e\uff0c\u5373\u201c\u80fd\u5728\u5e73\u53f0\u6388\u6743\u201d\uff08\u559c\u9a6c\u62c9\u96c5\u7b49\uff09\u5e76\u83b7\u5f97\u6536\u76ca\u3002\u4f46\u52a8\u673a\u5e26\u6709**\u5f3a\u70c8\u7684\u53d8\u73b0\u6295\u673a\u6027**\uff08\u201c\u65e9\u77e5\u9053\u662f\u8fd9\u6837\u6211\u6839\u672c\u5c31\u4e0d\u4f1a\u62a5\u540d\u5b66\uff0c\u6211\u62a5\u540d\u5c31\u662f\u4e3a\u4e86\u80fd\u5728\u5e73\u53f0\u6388\u6743\u201d\uff09\uff0c\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u672c\u8eab\u7684\u5b66\u4e60\u610f\u613f\u548c\u6295\u5165\u5ea6\u5b58\u7591\uff08\u201c\u8fd9\u4e24\u5468\u7684\u8bfe\u6211\u6839\u672c\u6ca1\u542c\u8fdb\u53bb\u201d\uff09\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u4e2d**\u3002\u5177\u5907\u57fa\u7840\u7684\u884c\u52a8\u529b\uff08\u5df2\u5728\u201c\u5947\u8ff9\u521b\u4f5c\u5e73\u53f0\u201d\u4e0a\u4f20\u4f5c\u54c1\u5e76\u5c1d\u8bd5\u7b7e\u7ea6\uff09\uff0c\u6709\u5de5\u4f5c\uff08\u201c\u6211\u89818\u70b9\u624d\u4e0b\u73ed\u201d\uff09\uff0c\u8868\u660e\u6709\u57fa\u672c\u7684\u65f6\u95f4\u548c\u7269\u8d28\u6761\u4ef6\u3002\u4f46**\u4fe1\u606f\u5904\u7406\u4e0e\u5e73\u53f0\u64cd\u4f5c\u80fd\u529b\u8f83\u5f31**\uff08\u591a\u6b21\u8be2\u95ee\u5e73\u53f0\u89c4\u5219\u3001\u64cd\u4f5c\u6d41\u7a0b\uff09\uff0c\u5bf9\u884c\u4e1a\u6e20\u9053\u8ba4\u77e5\u6709\u9650\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u4f4e**\u3002\u9762\u5bf9\u632b\u6298\uff08\u4f5c\u54c1\u88ab\u9000\u56de\u3001\u65e0\u6536\u76ca\uff09\u8868\u73b0\u51fa\u56f0\u60d1\u548c\u8f7b\u5fae\u7126\u8651\uff08\u201c[\u6342\u8138]\u201d\u8868\u60c5\u9ad8\u9891\u4f7f\u7528\uff09\u3002**\u5bf9\u201c\u798f\u5229\u201d\u548c\u201c\u7279\u6b8a\u901a\u9053\u201d\u9ad8\u5ea6\u654f\u611f\u4e14\u4f9d\u8d56**\uff0c\u5f53\u53d1\u73b0\u540c\u671f\u5b66\u5458\u6709\u201c\u7eff\u901a\u201d\u800c\u81ea\u5df1\u6ca1\u6709\u65f6\uff0c\u8868\u73b0\u51fa\u660e\u663e\u7684**\u4e0d\u516c\u5e73\u611f\u548c\u62b1\u6028\u60c5\u7eea**\uff0c\u662f\u6f5c\u5728\u7684\u8d1f\u9762\u60c5\u7eea\u5f15\u7206\u70b9\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: \u5df2\u4ed8\u8d39\uff0819\u671f\u5b66\u5458\uff09\uff0c\u652f\u4ed8\u5b8c\u6210\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: \u4fe1\u606f\u4e0d\u8db3\u3002\u804a\u5929\u8bb0\u5f55\u4e2d\u63d0\u53ca\u201c\u8001\u516c\u201d\uff0c\u4f46\u672a\u6d89\u53ca\u4ed8\u8d39\u51b3\u7b56\u8ba8\u8bba\uff0c**\u5bb6\u5ead\u652f\u6301\u5ea6\u672a\u77e5**\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u7eaf\u5ea6**: **\u6295\u673a\u578b (B\u7c7b)**\u3002\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u5feb\u901f\u53d8\u73b0\u901a\u9053\uff0c\u800c\u975e\u6280\u80fd\u63d0\u5347\u6216\u521b\u4f5c\u672c\u8eab\u3002\n*   **\u6b65\u9aa42 - \u8d44\u6e90\u5e95\u5ea7**: **\u884c\u52a8\u529b\u5c1a\u53ef\u4f46\u80fd\u529b\u6709\u9650 (B/C\u7c7b)**\u3002\u6709\u5c1d\u8bd5\u884c\u4e3a\uff0c\u4f46\u7406\u89e3\u529b\u3001\u6267\u884c\u529b\u3001\u4fe1\u606f\u641c\u96c6\u80fd\u529b\u4e00\u822c\u3002\n*   **\u6b65\u9aa43 - \u5fc3\u7406\u5f39\u6027**: **\u4f4e\u5f39\u6027\uff0c\u6613\u751f\u6028\u603c (D\u7c7b)**\u3002\u5bf9\u627f\u8bfa\u843d\u7a7a\uff08\u5982\u201c\u7eff\u901a\u201d\u798f\u5229\uff09\u5bb9\u5fcd\u5ea6\u4f4e\uff0c\u6613\u4ea7\u751f\u201c\u88ab\u6b3a\u9a97\u611f\u201d\u3002\n*   **\u7efc\u5408\u5224\u5b9a**: **B/D\u6df7\u5408\u578b (\u6295\u673a\u9a71\u52a8\u4e14\u4f4e\u5fc3\u7406\u5f39\u6027)**\u3002\u7528\u6237\u5e26\u7740\u660e\u786e\u7684\u201c\u4ea4\u6613\u201d\u5fc3\u6001\uff08\u7528\u5b66\u8d39\u6362\u6e20\u9053\uff09\u5165\u5b66\uff0c\u5f53\u53d1\u73b0\u9884\u671f\u4e2d\u7684\u201c\u7279\u6b8a\u8d44\u6e90\u201d\u65e0\u6cd5\u5151\u73b0\u6216\u5b66\u4e60\u8fc7\u7a0b\u9047\u5230\u969c\u788d\u65f6\uff0c\u6781\u6613\u4ea7\u751f\u4e0d\u6ee1\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b: T5 \u6295\u673a\u53d8\u73b0\u8005**\u3002\n    *   **\u6838\u5fc3\u7279\u5f81**: \u4ed8\u8d39\u52a8\u673a\u9ad8\u5ea6\u529f\u5229\uff0c\u89c6\u8bfe\u7a0b\u4e3a\u201c\u5165\u573a\u5238\u201d\u6216\u201c\u8d44\u6e90\u7f6e\u6362\u201d\uff0c\u5bf9\u5b66\u4e60\u8fc7\u7a0b\u8010\u5fc3\u4e0d\u8db3\uff0c\u5bf9\u201c\u798f\u5229\u201d\u3001\u201c\u6377\u5f84\u201d\u3001\u201c\u4fdd\u5e95\u6536\u76ca\u201d\u7b49\u4fe1\u606f\u6781\u5ea6\u5173\u6ce8\u3002\n    *   **\u543b\u5408\u8868\u73b0**: \u53cd\u590d\u8ffd\u95ee\u6295\u7a3f\u5e73\u53f0\u3001\u7b7e\u7ea6\u89c4\u5219\u3001\u6536\u76ca\u8fdb\u7fa4\u95e8\u69db\uff1b\u56e0\u201c\u7eff\u901a\u201d\u798f\u5229\u5dee\u5f02\u800c\u8868\u8fbe\u5f3a\u70c8\u4e0d\u6ee1\uff1b\u8bfe\u7a0b\u5185\u5bb9\u5438\u6536\u5ea6\u81ea\u8bc4\u4f4e\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669**: **\u9ad8**\u3002\n*   **\u6839\u56e0\u6392\u67e5**:\n    1.  **\u9884\u671f\u7ba1\u7406\u5931\u63a7 (\u9ad8\u98ce\u9669)**: **\u9500\u552e\u627f\u8bfa\u4e0e\u540e\u7eed\u670d\u52a1\u8131\u8282**\u662f\u6838\u5fc3\u96f7\u533a\u3002\u7528\u6237\u58f0\u79f0\u62a5\u540d\u65f6\u201c\u7cbe\u82f1\u73ed\u73ed\u8bf4\u662f\u53ef\u4ee5\u7684\u201d\uff08\u6307\u7eff\u901a\uff09\uff0c\u4f46\u540e\u7eed\u88ab\u544a\u77e5\u201c19\u671f\u6ca1\u6709\u8fd9\u4e2a\u798f\u5229\u201d\u3002\u8fd9\u662f**\u6700\u9ad8\u7ea7\u522b\u7684\u6295\u8bc9\u89e6\u53d1\u70b9**\u3002\n    2.  **\u6548\u679c\u7126\u8651\u4e0e\u632b\u8d25\u611f (\u4e2d\u9ad8\u98ce\u9669)**: \u4f5c\u54c1\u88ab\u9000\u56de\u3001\u5e73\u53f0\u64cd\u4f5c\u56f0\u96be\u3001\u521d\u671f\u6d41\u91cf\u5c11\uff0c\u53e0\u52a0\u8bfe\u7a0b\u201c\u6ca1\u542c\u8fdb\u53bb\u201d\uff0c\u5b66\u4e60\u6b63\u53cd\u9988\u5f31\u3002\n    3.  **\u5bf9\u6bd4\u4e0d\u516c\u5e73\u611f (\u9ad8\u98ce\u9669)**: \u660e\u786e\u77e5\u6653\u5e76\u6307\u51fa\u201c38\u73ed\u7684\u90fd\u53ef\u4ee5\u6295\u201d\u3001\u201c\u524d\u9762\u4e00\u70b9\u5f00\u8bfe\u7684\u9014\u5f84\u4e0d\u4e00\u6837\u201d\uff0c\u5f3a\u5316\u4e86\u88ab\u533a\u522b\u5bf9\u5f85\u7684\u611f\u77e5\u3002\n    4.  **\u4ea7\u54c1\u9002\u914d\u504f\u5dee (\u4e2d\u98ce\u9669)**: \u7528\u6237\u76ee\u6807\uff08\u5e73\u53f0\u6388\u6743\u7b7e\u7ea6\uff09\u4e0e\u8bfe\u7a0b\u63d0\u4f9b\u7684\u6838\u5fc3\u4ef7\u503c\uff08\u5199\u4f5c\u6280\u80fd\u6559\u5b66\uff09\u53ef\u80fd\u5b58\u5728\u504f\u5dee\uff0c\u82e5\u65e0\u6cd5\u901a\u8fc7\u8bfe\u7a0b\u5b9e\u73b0\u5176\u76f4\u63a5\u76ee\u6807\uff0c\u5931\u671b\u60c5\u7eea\u4f1a\u52a0\u5267\u3002\n    5.  **\u5bb6\u5ead\u652f\u6301/\u51b3\u7b56\u51b2\u7a81**: \u4fe1\u606f\u4e0d\u8db3\uff0c\u9700\u5173\u6ce8\u3002\n    6.  **\u8d44\u91d1\u538b\u529b/\u51b2\u52a8\u6d88\u8d39**: \u672a\u4f53\u73b0\u3002\n    7.  **\u670d\u52a1\u4f53\u9a8c\u7455\u75b5**: \u6709\u64cd\u4f5c\u7b54\u7591\uff0c\u4f46\u672a\u53d1\u73b0\u91cd\u5927\u670d\u52a1\u5931\u8bef\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u3010\u53d1\u73b0\u91cd\u5927\u5408\u89c4\u98ce\u9669\u3011**:\n    *   **\u9500\u552e\u627f\u8bfa\u4e0d\u4e00\u81f4**: \u7528\u6237\u63d0\u53ca\u62a5\u540d\u65f6\u9500\u552e\uff08\u7cbe\u82f1\u73ed\u73ed\uff09\u627f\u8bfa\u6709\u201c\u7eff\u901a\u201d\u798f\u5229\uff0c\u4f46\u540e\u7aef\u73ed\u4e3b\u4efb\uff08\u9500\u552e-\u67ff\u5b50\u8c46\u82b1\u751f\uff09\u660e\u786e\u8868\u793a\u201c19\u671f\u6ca1\u6709\u8fd9\u4e2a\u798f\u5229\u201d\u3002**\u8fd9\u6d89\u5acc\u865a\u5047\u627f\u8bfa\u6216\u8fc7\u5ea6\u627f\u8bfa\uff0c\u662f\u4e25\u91cd\u7684\u9500\u552e\u5408\u89c4\u95ee\u9898**\u3002\n    *   **\u4fe1\u606f\u4f20\u9012\u65ad\u5c42**: \u524d\u540e\u7aef\u5bf9\u201c\u798f\u5229\u201d\u653f\u7b56\u7684\u89e3\u91ca\u5b58\u5728\u77db\u76fe\uff0c\u6613\u5f15\u53d1\u7528\u6237\u4fe1\u4efb\u5371\u673a\u3002\n*   **\u4f26\u7406\u9632\u7ebf**: \u7528\u6237\u5df2\u8868\u73b0\u51fa\u56e0\u201c\u4e0d\u516c\u5e73\u611f\u201d\u800c\u4ea7\u751f\u7684\u8d1f\u9762\u60c5\u7eea\uff0c\u9700\u8b66\u60d5\u5176\u5728\u5c0f\u7fa4\u4f53\u4e2d\u6269\u6563\u4e0d\u6ee1\uff0c\u5f71\u54cd\u5176\u4ed6\u5b66\u5458\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d**: **\u504f\u5dee**\u3002\u7528\u6237\u5bfb\u6c42\u7684\u662f\u201c\u6e20\u9053\u8d44\u6e90\u5feb\u901f\u53d8\u73b0\u201d\uff0c\u800c\u4ea7\u54c1\u6838\u5fc3\u662f\u201c\u6280\u80fd\u6559\u5b66\u201d\u3002\u9700\u7d27\u6025\u6821\u6b63\u9884\u671f\uff0c\u5e76\u5c1d\u8bd5\u5c06\u6280\u80fd\u4e0e\u53d8\u73b0\u8def\u5f84\u505a\u5f3a\u5173\u8054\u5f15\u5bfc\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **\u7acb\u5373\u6838\u5b9e\u9500\u552e\u627f\u8bfa\uff0c\u7d27\u6025\u5b89\u629a\u5e76\u660e\u786e\u8def\u5f84**\u3002\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**:\n    1.  **\u7d27\u6025\u4ecb\u5165\uff0c\u9ad8\u5c42\u7ea7\u6c9f\u901a**: \u73ed\u4e3b\u4efb\u9700\u7acb\u5373\u4e0e\u7528\u6237\u8fdb\u884c\u4e00\u5bf9\u4e00\u6df1\u5ea6\u6c9f\u901a\uff0c**\u9996\u8981\u4efb\u52a1\u662f\u6838\u5b9e\u5e76\u56de\u5e94\u5176\u5173\u4e8e\u201c\u62a5\u540d\u65f6\u627f\u8bfa\u7eff\u901a\u201d\u7684\u8d28\u7591**\u3002\u9700\u534f\u8c03\u524d\u7aef\u9500\u552e\u786e\u8ba4\u5f53\u65f6\u627f\u8bfa\u7ec6\u8282\uff0c\u5e76\u7ed9\u7528\u6237\u4e00\u4e2a\u6e05\u6670\u3001\u8bda\u6073\u7684\u4ea4\u4ee3\u3002\n    2.  **\u9884\u671f\u6821\u6b63\u4e0e\u8def\u5f84\u91cd\u5efa**: \u660e\u786e\u544a\u77e5\u73b0\u6709\u53ef\u5b9e\u73b0\u7684\u6295\u7a3f\u3001\u7b7e\u7ea6\u8def\u5f84\uff08\u5982\u5947\u8ff9\u5e73\u53f0\u3001\u756a\u8304\u7b49\uff09\uff0c\u5e76\u63d0\u4f9b\u8be6\u7ec6\u7684\u64cd\u4f5c\u6307\u5357\u548c\u6210\u529f\u6848\u4f8b\u3002\u5c06\u8bfe\u7a0b\u5185\u5bb9\uff08\u5982\u62c6\u6587\u3001\u77ed\u5267\u5199\u4f5c\uff09\u4e0e\u5e73\u53f0\u6295\u7a3f\u8981\u6c42\u76f4\u63a5\u6302\u94a9\uff0c\u8bc1\u660e\u5b66\u4e60\u7684\u5fc5\u8981\u6027\u3002\n    3.  **\u5f3a\u5316\u8fc7\u7a0b\u6fc0\u52b1**: \u5bf9\u5176\u5df2\u5b8c\u6210\u7684\u884c\u52a8\uff08\u4e0a\u4f20\u4f5c\u54c1\u3001\u7533\u8bf7\u7b7e\u7ea6\uff09\u7ed9\u4e88\u80af\u5b9a\u3002\u9488\u5bf9\u5176\u201c\u8bfe\u6ca1\u542c\u8fdb\u53bb\u201d\u7684\u56f0\u60d1\uff0c\u63d0\u4f9b\u4e2a\u6027\u5316\u7684\u5b66\u4e60\u5efa\u8bae\u6216\u91cd\u70b9\u5185\u5bb9\u56de\u987e\u3002\n    4.  **\u98ce\u9669\u9694\u79bb**: \u907f\u514d\u5728\u7fa4\u5185\u516c\u5f00\u8ba8\u8bba\u201c\u798f\u5229\u5dee\u5f02\u201d\u95ee\u9898\uff0c\u9632\u6b62\u8d1f\u9762\u60c5\u7eea\u6269\u6563\u3002\u5bf9\u8be5\u7528\u6237\u8fdb\u884c\u91cd\u70b9\u5173\u6000\uff0c\u5b9a\u671f\u8ddf\u8fdb\u5176\u6295\u7a3f\u8fdb\u5c55\uff0c\u53ca\u65f6\u89e3\u7b54\u64cd\u4f5c\u95ee\u9898\u3002\n    5.  **\u8bb0\u5f55\u4e0e\u4e0a\u62a5**: \u5c06\u6b64\u6b21\u201c\u627f\u8bfa\u4e0d\u4e00\u81f4\u201d\u4e8b\u4ef6\u8be6\u7ec6\u8bb0\u5f55\u5e76\u4e0a\u62a5\u98ce\u63a7\u53ca\u9500\u552e\u7ba1\u7406\u56e2\u961f\uff0c\u4f5c\u4e3a\u524d\u7aef\u9500\u552e\u8bdd\u672f\u7ba1\u7406\u7684\u6838\u67e5\u6848\u4f8b\u3002\n\n{\"core_type\": \"T5 \u6295\u673a\u53d8\u73b0\u8005\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u7acb\u5373\u6838\u5b9e\u9500\u552e\u627f\u8bfa\u5e76\u5b89\u629a\"}";
