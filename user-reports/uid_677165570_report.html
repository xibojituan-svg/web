    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID: 677165570\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677165570 (\u6635\u79f0\uff1a\u79cb) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u653e\u98de\u7684\u5927\u773c\u775b(\u5f20\u57f9\u6e05) / \u4e00\u975e\ud83c\udf53\u73ed\u73ed(\u5434\u4e00\u975e) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u9ad8\u9636\u73ed (\u4ef7\u683c\uff1a3980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u5206\u671f\u7b49\u4fe1\u606f\uff0c\u65e0\u6cd5\u5224\u65ad\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u4e3a\u201c\u5b66\u751f\u201d\uff0c\u4f46\u672a\u8bf4\u660e\u662f\u5168\u65e5\u5236\u6216\u5728\u804c\uff0c\u65f6\u95f4\u5145\u88d5\u5ea6\u672a\u77e5\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u6709\u660e\u786e\u76ee\u7684\u3001\u804c\u4e1a\u3001\u5174\u8da3\u65b9\u5411\uff0c\u4f46\u7f3a\u4e4f\u65f6\u95f4\u3001\u8d44\u91d1\u3001\u5bb6\u5ead\u7b49\u5173\u952e\u8d44\u6e90\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34(\u4e2d)**\u3002\u660e\u786e\u8868\u8fbe\u201c\u8d5a\u70b9\u5916\u5feb\u201d\u7684\u517c\u804c\u53d8\u73b0\u76ee\u7684\uff0c\u4f46\u540c\u65f6\u80fd\u8ba4\u53ef\u201c\u4f20\u64ad\u6587\u5316\u4ef7\u503c\u201d\u548c\u201c\u77e5\u8bc6\u4ed8\u8d39\u201d\u7684\u610f\u4e49\uff0c\u5e76\u975e\u7eaf\u7cb9\u201c\u51e0\u5929\u5185\u63d0\u73b0\u201d\u7684\u6781\u7aef\u53d8\u73b0\u9a71\u52a8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6765\u8fd9\u91cc\u7684\u76ee\u7684\u662f\u4ec0\u4e48\u5462\uff1f**\u8d5a\u70b9\u5916\u5feb**\u201d\n  > \u201c\u4eca\u5929\u542c\u4e86\u76f4\u64ad\u8bfe\u89c9\u5f97\u8fd9\u4efd\u5de5\u4f5c\u4e5f\u662f\u6709**\u4f20\u64ad\u6587\u5316\u4ef7\u503c**\u7684\u610f\u4e49\u5728\u7684\u3002\u77e5\u8bc6\u4ea7\u6743\u662f\u975e\u5e38\u91cd\u8981\u7684\uff0c\u5176\u5b9e\u73b0\u5728\u5f88\u591a\u90fd\u662f\u4e3a\u77e5\u8bc6\u4ed8\u8d39\uff0c\u53ea\u8981\u4f60\u8ba4\u53ef\u522b\u4eba\u7684\u77e5\u8bc6\u4ea7\u51fa\u5c31\u662f\u5e94\u8be5\u4ed8\u8d39\u7684\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u7ecf\u6d4e\u72b6\u51b5\uff0c\u4f46\u4f5c\u4e3a\u5b66\u751f\uff0c\u9ed8\u8ba4\u8d44\u91d1\u975e\u5bbd\u88d5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u5b66\u751f\u8eab\u4efd\uff0c\u4f46\u672a\u8bf4\u660e\u5177\u4f53\u5b66\u4e1a\u8d1f\u62c5\u3002\u80fd\u5b8c\u6210\u6240\u6709\u4efb\u52a1\uff0c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5c1a\u53ef\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u8bd5\u97f3\u94fe\u63a5\u5931\u6548\u7b49\u6280\u672f\u95ee\u9898\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u76f4\u63a5\u53cd\u9988\u95ee\u9898\u5e76\u7b49\u5f85\u89e3\u51b3\uff0c\u65e0\u62b1\u6028\u6216\u81ea\u6211\u5426\u5b9a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u4f60\u597d\uff0c\u94fe\u63a5\u70b9\u8fdb\u53bb\u5565\u4e5f\u6ca1\u6709\u8bf6\u201d (\u51b7\u9759\u53cd\u9988\u95ee\u9898)\n  > \u201c\u51fa\u95ee\u9898\u561e\u8001\u5e08\u201d (\u76f4\u63a5\u9648\u8ff0\u4e8b\u5b9e\uff0c\u65e0\u60c5\u7eea\u5316\u8bed\u8a00)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 (\u7126\u8651\u4fdd\u969c)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u4f5c\u4e3a\u5b66\u751f\uff0c\u5bf9\u672a\u6765\u7ecf\u6d4e\u72ec\u7acb\u548c\u804c\u4e1a\u53d1\u5c55\u7684**\u4e0d\u5b89\u5168\u611f\u4e0e\u7126\u8651**\u3002\u5e0c\u671b\u901a\u8fc7\u517c\u804c\u589e\u52a0\u6536\u5165\uff0c\u4e3a\u672a\u6765\u589e\u52a0\u4fdd\u969c\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u63d0\u4f9b\u4e00\u6761\u6e05\u6670\u3001\u53ef\u9760\u3001\u4f4e\u98ce\u9669\u7684\u517c\u804c\u53d8\u73b0\u8def\u5f84**\uff0c\u7528\u201c\u771f\u5b9e\u8bd5\u97f3\u201d\u3001\u201c\u5267\u7ec4\u8d44\u6e90\u201d\u3001\u201c\u7cfb\u7edf\u5b66\u4e60\u201d\u7b49\u5177\u4f53\u627f\u8bfa\uff0c\u7f13\u89e3\u5176\u5bf9\u672a\u6765\u7684\u4e0d\u786e\u5b9a\u6027\u7126\u8651\uff0c\u5efa\u7acb\u201c\u5b66\u4e86\u5c31\u80fd\u7528\uff0c\u7528\u4e86\u5c31\u80fd\u8d5a\u201d\u7684\u5b89\u5168\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u52a8\u673a\u4e2d\u7b49\u3001\u8d44\u6e90\u4e2d\u7b49\u3001\u5f39\u6027\u9ad8\u3001\u6267\u884c\u529b\u5f3a) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u7b49\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4f4e** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u5b66\u751f\u8eab\u4efd\u53ef\u80fd\u6d89\u53ca\u5bb6\u5ead\u7ecf\u6d4e\u652f\u6301\uff0c\u9700\u540e\u7eed\u6478\u5e95\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u82e5\u5b66\u4e1a\u538b\u529b\u7a81\u7136\u589e\u5927\uff0c\u5bfc\u81f4\u65e0\u6cd5\u8ddf\u4e0a\u8bfe\u7a0b\u8282\u594f\u548c\u4f5c\u4e1a\uff0c\u53ef\u80fd\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u6280\u672f\u95ee\u9898\u80fd\u51b7\u9759\u5904\u7406\uff0c\u4e0d\u6613\u56e0\u64cd\u4f5c\u56f0\u96be\u800c\u60c5\u7eea\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u82e5\u5728\u627f\u8bfa\u7684\u201c\u517c\u804c\u63a5\u5355\u201d\u5468\u671f\u5185\uff08\u59821-3\u4e2a\u6708\uff09\u672a\u80fd\u83b7\u5f97\u5b9e\u9645\u6536\u5165\u6216\u8bd5\u97f3\u673a\u4f1a\uff0c\u5176\u201c\u8d5a\u5916\u5feb\u201d\u7684\u6838\u5fc3\u8bc9\u6c42\u843d\u7a7a\uff0c\u53ef\u80fd\u5f15\u53d1\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e1-3\u4e2a\u6708**\uff0c\u5373\u5176\u9884\u671f\u5f00\u59cb\u83b7\u5f97\u517c\u804c\u6536\u5165\u7684\u9636\u6bb5\u3002\u82e5\u6b64\u65f6\u7f3a\u4e4f\u6709\u6548\u7684\u6d3e\u5355\u5f15\u5bfc\u6216\u63a5\u5355\u5931\u8d25\uff0c\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u79cb\uff0c\u770b\u5230\u4f60\u62a5\u540d\u65f6\u63d0\u5230\u60f3\u2018\u8d5a\u70b9\u5916\u5feb\u2019\uff0c\u6211\u7279\u522b\u7406\u89e3\u3002\u5b66\u751f\u65f6\u4ee3\u80fd\u6709\u8fd9\u4efd\u89c4\u5212\u975e\u5e38\u96be\u5f97\u3002\u54b1\u4eec\u7684\u8bfe\u7a0b\u5c31\u662f\u4e3a\u4f60\u8fd9\u6837\u6709\u60f3\u6cd5\u3001\u6709\u884c\u52a8\u529b\u7684\u540c\u5b66\u8bbe\u8ba1\u7684\uff0c**\u4ece\u7b2c\u4e00\u5468\u5f00\u59cb\u5c31\u6709\u5b9e\u6218\u7ec3\u4e60\u548c\u5185\u90e8\u8bd5\u97f3\u673a\u4f1a**\u3002\u6211\u4f1a\u5e2e\u4f60\u628a\u6bcf\u4e00\u6b65\u90fd\u89c4\u5212\u6e05\u695a\uff0c\u8ba9\u4f60\u5728\u517c\u987e\u5b66\u4e1a\u7684\u540c\u65f6\uff0c\u7a33\u7a33\u5730\u628a\u6280\u80fd\u53d8\u6210\u6536\u5165\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** (\u4ea7\u54c1\u7ebfA)\u3002\u5339\u914d\u5176\u52a1\u5b9e\u3001\u8ffd\u6c42\u7a33\u5b9a\u53d8\u73b0\u7684\u9700\u6c42\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T2\u7279\u8d28\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010B\u6a21\u5757(\u786c\u6838\u624b\u827a\u6c60)-\u6ee1\u914d\u3011**\uff1a\u63d0\u4f9b\u4e13\u5bb61v1\u7b54\u7591\u3001\u771f\u5b9e\u6d3e\u5355\u5b9e\u6218\u3001\u4e25\u82db\u7684\u4f5c\u4e1a\u70b9\u8bc4\u3002\u8fd9\u662f\u7559\u4f4f\u548c\u8f6c\u5316T2\u7528\u6237\u7684\u5173\u952e\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a**\u753b\u4e0d\u5207\u5b9e\u9645\u7684\u201c\u66b4\u5bcc\u201d\u5927\u997c**\u3002\u5fc5\u987b\u7ba1\u7406\u597d\u5176\u201c\u8d5a\u5916\u5feb\u201d\u7684\u9884\u671f\uff0c\u5f3a\u8c03\u6280\u80fd\u79ef\u7d2f\u548c\u8fc7\u7a0b\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002T2\u7528\u6237\u662f\u590d\u8d2d\u4e3b\u529b\uff0c\u5728\u57fa\u7840\u6280\u80fd\u624e\u5b9e\u540e\uff0c\u53ef\u63a8\u8350\u9ad8\u9636\u8bfe\u7a0b\u6216\u786c\u4ef6\u8bbe\u5907\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6765\u8fd9\u91cc\u7684\u76ee\u7684\u662f\u4ec0\u4e48\u5462\uff1f**\u8d5a\u70b9\u5916\u5feb**\u201d **(\u6838\u5fc3\u52a8\u673a)**\n2. > \u201c\u4eca\u5929\u542c\u4e86\u76f4\u64ad\u8bfe\u89c9\u5f97\u8fd9\u4efd\u5de5\u4f5c\u4e5f\u662f\u6709**\u4f20\u64ad\u6587\u5316\u4ef7\u503c**\u7684\u610f\u4e49\u5728\u7684\u3002\u77e5\u8bc6\u4ea7\u6743\u662f\u975e\u5e38\u91cd\u8981\u7684...\u201d **(\u52a8\u673a\u4e0d\u7eaf\u4e3a\u94b1\uff0c\u6709\u66f4\u9ad8\u5c42\u6b21\u8ba4\u540c)**\n3. > \u201c\u4f60\u597d\uff0c\u94fe\u63a5\u70b9\u8fdb\u53bb\u5565\u4e5f\u6ca1\u6709\u8bf6\u201d **(\u9047\u6280\u672f\u95ee\u9898\u51b7\u9759\u53cd\u9988\uff0c\u5fc3\u7406\u5f39\u6027\u9ad8)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e00\u4efd\u7a33\u5b9a\u3001\u53ef\u9760\u7684\u517c\u804c\u6536\u5165\u4fdd\u969c\uff08\u5b89\u5168\u9700\u6c42\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u57281-3\u4e2a\u6708\u5185\uff0c\u63d0\u4f9b\u771f\u5b9e\u3001\u6709\u6548\u7684\u8bd5\u97f3\u548c\u6d3e\u5355\u673a\u4f1a\uff0c\u5e76\u7ed9\u4e88\u4e25\u683c\u3001\u4e13\u4e1a\u7684\u6280\u80fd\u6307\u5bfc\uff0c\u6ee1\u8db3\u5176\u201c\u5b66\u4ee5\u81f4\u7528\u3001\u7528\u4ee5\u53d8\u73b0\u201d\u7684\u6838\u5fc3\u8bc9\u6c42\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\"}\n```";
