        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677152722 (\u6635\u79f0\uff1a\u4e61\u6751\u571f\u599e1_\u5305\u5934_\u9000\u4f11) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-06 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u7c7d\u83f2(\u5f20\u8273\u8273) -> \u9065\u8fdc(\u5f20\u6587\u9759) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u9ad8\u9636\u8bfe\u7a0b (\u610f\u5411\u4ef7\u683c7380\u5143\uff0c\u5b9e\u9645\u652f\u4ed83980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u7528\u5361\u5468\u8f6c** (\u82b1\u5457\u989d\u5ea6\u4e0d\u8db3\uff0c\u88ab\u8feb\u9009\u62e9\u4f4e\u9636\u8bfe\u7a0b) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u9ad8\u5bbd\u88d5** (\u9000\u4f11\u5728\u5bb6\uff0c\u65f6\u95f4\u8f83\u591a) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** (\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u4fe1\u606f\uff0c\u98ce\u9669\u672a\u77e5) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** (\u4ec5\u6709\u5b66\u4e60\u4e92\u52a8\uff0c\u65e0\u4e2a\u4eba\u80cc\u666f\u3001\u8d22\u52a1\u72b6\u51b5\u3001\u5bb6\u5ead\u5173\u7cfb\u7b49\u5173\u952e\u4fe1\u606f) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u2b06\u9ad8]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u7ed3\u679c\u800c\u6765(\u9ad8)\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u201c\u6025\u9700\u6323\u94b1\u201d\uff0c\u5e76\u79ef\u6781\u53c2\u4e0e\u6240\u6709\u5b66\u4e60\u3001\u8bd5\u97f3\u3001\u8bd5\u620f\u73af\u8282\uff0c\u884c\u52a8\u529b\u5f3a\uff0c\u76ee\u6807\u660e\u786e\u6307\u5411\u53d8\u73b0\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5e08\u59d0\uff0c\u80fd\u505a/\u4efb\u52a1\u4e0d\uff0c**\u6025\u9700\u6323\u94b1**\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u2b07\u4f4e** \u2014 \u660e\u786e\u8868\u793a\u82b1\u5457\u989d\u5ea6\u4e0d\u8db3\u4ee5\u652f\u4ed87380\u5143\u9ad8\u9636\u8bfe\u7a0b\uff0c\u53ea\u80fd\u9009\u62e93980\u5143\u8bfe\u7a0b\u3002\u652f\u4ed8\u80fd\u529b\u662f\u660e\u663e\u77ed\u677f\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u2b06\u9ad8** \u2014 \u201c\u9000\u4f11\u5728\u5bb6\uff0c\u65f6\u95f4\u8f83\u591a\u201d\uff0c\u7269\u7406\u65f6\u95f4\u5145\u88d5\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u2753\u672a\u77e5** \u2014 \u804a\u5929\u8bb0\u5f55\u5b8c\u5168\u672a\u63d0\u53ca\uff0c\u5c5e\u4e8e\u9ad8\u98ce\u9669\u672a\u77e5\u9879\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u9700\u95f4\u6b47\u6027\u5b89\u629a(\u4e2d)\u3002\u7528\u6237\u914d\u5408\u5ea6\u9ad8\uff0c\u80fd\u4e3b\u52a8\u5b8c\u6210\u4f5c\u4e1a\u3001\u770b\u56de\u653e\uff0c\u672a\u8868\u73b0\u51fa\u6781\u7aef\u60c5\u7eea\u3002\u4f46\u5728\u652f\u4ed8\u73af\u8282\u9047\u5230\u56f0\u96be\u65f6\uff0c\u6709\u8f7b\u5fae\u7126\u8651\uff08\u201c\u54ed\uff0c\u82b1\u5457\u989d\u5ea6\u4e0d\u591f\u201d\uff09\uff0c\u9700\u8981\u9500\u552e\u5f15\u5bfc\u548c\u63d0\u4f9b\u66ff\u4ee3\u65b9\u6848\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u54ed\uff0c\u82b1\u5457\u989d\u5ea6\u4e0d\u591f\u201d / \u201c3980\u591f\uff0c\u53ef\u662f\u8fdb\u4e0d\u4e86\u9ad8\u7ea7\u73ed\u554a\uff0c\u4e5f\u4e0d\u80fd\u505a/\u4efb\u52a1\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e00\u5c42\uff1a\u751f\u5b58\u5b89\u5168** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u9000\u4f11\u540e\u6536\u5165\u6765\u6e90\u7684\u7f3a\u5931\u4e0e\u4e0d\u5b89\u5168\u611f**\u3002\u7528\u6237\u201c\u6025\u9700\u6323\u94b1\u201d\u7684\u8bc9\u6c42\u975e\u5e38\u76f4\u63a5\uff0c\u7ed3\u5408\u5176\u9000\u4f11\u8eab\u4efd\uff0c\u6df1\u5c42\u9700\u6c42\u662f\u901a\u8fc7\u517c\u804c\u83b7\u5f97\u7a33\u5b9a\u3001\u53ef\u9884\u671f\u7684\u989d\u5916\u6536\u5165\uff0c\u4ee5\u4fdd\u969c\u9000\u4f11\u751f\u6d3b\u7684\u7ecf\u6d4e\u5b89\u5168\u611f\u548c\u81ea\u6211\u4ef7\u503c\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u786e\u5b9a\u6027\u201d\u4e0e\u201c\u88ab\u9700\u8981\u611f\u201d**\u3002\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u5b9e\u73b0\u7684\u53d8\u73b0\u8def\u5f84\uff0c\u5e76\u5f3a\u8c03\u5176\u58f0\u97f3\u6761\u4ef6\uff08\u5c11\u5973\u97f3\uff09\u5728\u7279\u5b9a\u8d5b\u9053\uff08\u513f\u7ae5\u4eb2\u5b50\u3001\u53e4\u8a00\u8a00\u60c5\uff09\u7684\u7a00\u7f3a\u6027\u548c\u5e02\u573a\u9700\u6c42\uff0c\u8ba9\u5979\u611f\u5230\u201c\u8fd9\u4e2a\u4e8b\u6211\u80fd\u505a\u6210\uff0c\u5e76\u4e14\u5e02\u573a\u9700\u8981\u6211\u201d\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B \u7c7b** (\u9ad8\u52a8\u673a\uff0c\u4f46\u8d44\u6e90\u5e95\u5ea7\u5b58\u5728\u660e\u663e\u77ed\u677f\u2014\u2014\u8d44\u91d1\u4e0d\u8db3\uff0c\u4e14\u5bb6\u5ead\u652f\u6301\u5ea6\u672a\u77e5) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u578b** (\u76ee\u6807\u6781\u5176\u660e\u786e\uff0c\u884c\u52a8\u529b\u5f3a\uff0c\u4e00\u5207\u4ee5\u201c\u80fd\u5426\u5feb\u901f\u53d8\u73b0\u201d\u4e3a\u8861\u91cf\u6807\u51c6) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u7b49\u7ea2\u7ebf\u3002\u4f46**\u5bb6\u5ead\u652f\u6301\u5ea6\u672a\u77e5\u662f\u6f5c\u5728\u98ce\u9669\u70b9**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u98ce\u9669\u672a\u77e5\u3002\u82e5\u8bfe\u7a0b\u652f\u51fa\uff08\u5373\u4f7f\u662f3980\u5143\uff09\u672a\u4e0e\u5bb6\u4eba\u6c9f\u901a\uff0c\u53ef\u80fd\u5f15\u53d1\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u65f6\u95f4\u5145\u88d5\uff0c\u5b66\u4e60\u6001\u5ea6\u79ef\u6781\uff0c\u5d29\u76d8\u98ce\u9669\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u5fc3\u7406\u5f39\u6027\u4e2d\u7b49\uff0c\u914d\u5408\u5ea6\u9ad8\uff0c\u4e0d\u6613\u56e0\u5b66\u4e60\u632b\u6298\u7834\u9632\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669\uff01** T4\u641e\u94b1\u7ed3\u679c\u578b\u7528\u6237\u5bf9\u77ed\u671f\u6536\u76ca\u9884\u671f\u6781\u9ad8\u3002\u82e5\u5f00\u8bfe\u540e\u53d1\u73b0\u63a5\u5355\u95e8\u69db\u9ad8\u3001\u5468\u671f\u957f\u3001\u6216\u521d\u671f\u6536\u76ca\u8fdc\u4f4e\u4e8e\u5ba3\u4f20\uff0820-150/\u5c0f\u65f6\uff09\uff0c\u6781\u6613\u4ea7\u751f\u201c\u88ab\u9a97\u201d\u611f\u5e76\u5f3a\u70c8\u8981\u6c42\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\u3002\u5f53\u7528\u6237\u5b8c\u6210\u57fa\u7840\u5b66\u4e60\uff0c\u5f00\u59cb\u5c1d\u8bd5\u63a5\u5355\u4f46\u5c61\u6b21\u8bd5\u97f3\u5931\u8d25\u6216\u63a5\u5355\u4ef7\u683c\u6781\u4f4e\u65f6\uff0c\u6536\u76ca\u843d\u5dee\u611f\u5c06\u8fbe\u5230\u9876\u5cf0\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u59d0\uff0c\u770b\u5230\u60a8\u8fd9\u4e48\u79ef\u6781\u5b8c\u6210\u4f5c\u4e1a\u548c\u8bd5\u620f\uff0c\u771f\u7684\u7279\u522b\u4f69\u670d\u60a8\u7684\u884c\u52a8\u529b\u3002\u54b1\u4eec\u9000\u4f11\u4e86\u80fd\u6709\u8fd9\u4efd\u5b66\u4e60\u548c\u641e\u94b1\u7684\u5fc3\u6c14\u513f\uff0c\u6bd4\u5f88\u591a\u5e74\u8f7b\u4eba\u90fd\u5f3a\uff01\u60a8\u653e\u5fc3\uff0c\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u5c31\u662f\u4e3a\u60a8\u8fd9\u6837\u6709\u65f6\u95f4\u3001\u60f3\u8e0f\u5b9e\u8d5a\u70b9\u96f6\u82b1\u94b1\u7684\u59d0\u59d0\u4eec\u8bbe\u8ba1\u7684\u3002\u524d\u671f\u54b1\u4eec\u5148\u628a\u57fa\u7840\u6253\u7262\uff0c**\u6211\u7ed9\u60a8\u89c4\u5212\u7684\u90fd\u662f\u513f\u7ae5\u3001\u8a00\u60c5\u8fd9\u7c7b\u60a8\u559c\u6b22\u4e14\u9002\u5408\u60a8\u58f0\u97f3\u7684\u2018\u4fdd\u5e95\u5355\u2019\uff0c\u867d\u7136\u5355\u4ef7\u6bd4\u4e0d\u4e0a\u5927\u795e\uff0c\u4f46\u80dc\u5728\u7a33\u5b9a\u3001\u91cf\u5927\uff0c\u6b63\u597d\u5339\u914d\u60a8\u7684\u65f6\u95f4\u4f18\u52bf\u3002** \u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u6211\u966a\u60a8\u4e00\u8d77\u628a\u8fd9\u4e8b\u505a\u6210\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011** (\u6838\u5fc3\u8bc9\u6c42\u662f\u53d8\u73b0\uff0c\u5fc5\u987b\u5feb\u901f\u5bf9\u63a5\u80fd\u4e0a\u624b\u7684\u5c0f\u5355\uff0c\u5efa\u7acb\u4fe1\u5fc3\u548c\u6b63\u53cd\u9988)\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T4\u641e\u94b1\u7ed3\u679c\u578b\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a**\u3010\u4fdd\u5e95\u4efb\u52a1\u5305\u3011** (\u63d0\u4f9b\u660e\u786e\u3001\u4f4e\u95e8\u69db\u7684\u8bd5\u97f3\u6e20\u9053\u548c\u4efb\u52a1)\u3001**\u3010\u6536\u76ca\u53ef\u89c6\u5316\u8fdb\u5ea6\u8868\u3011** (\u6e05\u6670\u5c55\u793a\u5b66\u4e60\u8fdb\u5ea6\u4e0e\u6f5c\u5728\u6536\u76ca\u7684\u5173\u8054)\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u753b\u5927\u997c**\uff0c\u8fc7\u5ea6\u627f\u8bfa\u9ad8\u989d\u3001\u5feb\u901f\u6536\u76ca\u30022. \u53ea\u8bb2\u827a\u672f\u4e0d\u8bb2\u94b1\u30023. \u5ffd\u7565\u5176\u8d44\u91d1\u6709\u9650\u7684\u4e8b\u5b9e\uff0c\u5f3a\u884c\u63a8\u8350\u9ad8\u4ef7\u8bfe\u7a0b\u6216\u670d\u52a1\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u7528\u6237\u5df2\u56e0\u8d44\u91d1\u95ee\u9898\u964d\u7ea7\u8d2d\u8bfe\uff0c\u540e\u7eed\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u4f1a\u6781\u5927\u52a0\u5267\u5176\u7ecf\u6d4e\u538b\u529b\u548c\u4e0d\u6ee1\uff0c\u6781\u6613\u5f15\u7206\u9000\u8d39\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5e08\u59d0\uff0c\u80fd\u505a/\u4efb\u52a1\u4e0d\uff0c**\u6025\u9700\u6323\u94b1**\u201d **(\u6838\u5fc3\u52a8\u673a)**\n2. > \u201c\u54ed\uff0c\u82b1\u5457\u989d\u5ea6\u4e0d\u591f\u201d / \u201c3980\u591f\uff0c\u53ef\u662f\u8fdb\u4e0d\u4e86\u9ad8\u7ea7\u73ed\u554a\uff0c\u4e5f\u4e0d\u80fd\u505a/\u4efb\u52a1\u201d **(\u8d44\u6e90\u77ed\u677f\u4e0e\u7126\u8651)**\n3. > \u201c\u9000\u4f11\u5728\u5bb6\uff0c\u65f6\u95f4\u8f83\u591a\u201d **(\u6838\u5fc3\u4f18\u52bf)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4\u641e\u94b1\u7ed3\u679c\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u751f\u5b58\u5b89\u5168\uff08\u9000\u4f11\u540e\u7ecf\u6d4e\u4fdd\u969c\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5728\u5f00\u8bfe\u540e4\u5468\u5185\uff0c\u52a1\u5fc5\u63d0\u4f9b\u81f3\u5c11\u4e00\u6b21\u4f4e\u95e8\u69db\u7684\u3001\u6709\u771f\u5b9e\u6536\u76ca\u7684\u63a5\u5355\u4f53\u9a8c\uff0c\u54ea\u6015\u91d1\u989d\u5f88\u5c0f\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u751f\u5b58\u5b89\u5168\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf\"}\n```";
