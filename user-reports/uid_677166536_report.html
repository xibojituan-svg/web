    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID 677166536 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u516d\u6708\u6668\u516e(\u738b\u8339)\u3001\u738b\u5c0f\u4ed9(\u738b\u8339)\u3001\u73ed\u4e3b\u4efb-\u5b89\u7ae5\u58f0(\u5218\u7d20\u82f1) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u9a6c\u62c9\u96c5\u6500\u767b\u8ba1\u5212\u7cbe\u82f1\u7248\uff084\u4e2a\u6708\u7cfb\u7edf\u8bfe\uff0c\u4ef7\u683c2380\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u652f\u4ed8\uff08\u63d0\u53ca2380\u5143\uff0c\u672a\u63d0\u53ca\u5206\u671f\u6216\u501f\u6b3e\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u6700\u8fd1\u65f6\u95f4\u4e0d\u591a\uff0c\u665a\u70b9\u518d\u5b66\u4e60\u201d\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u672a\u77e5\uff08\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\uff08\u7528\u6237\u53d1\u8a00\u6781\u5c11\uff0c\u591a\u4e3a\u7b80\u77ed\u56de\u5e94\uff0c\u65e0\u6cd5\u5224\u65ad\u6df1\u5c42\u52a8\u673a\u3001\u8d44\u6e90\u3001\u5bb6\u5ead\u652f\u6301\u53ca\u5fc3\u7406\u5f39\u6027\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u5168\u7a0b\u8ddf\u968f\u9500\u552e\u5f15\u5bfc\uff0c\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u6253\u5361\u3001\u62a5\u540d\uff0c\u8868\u73b0\u51fa\u5b66\u4e60\u610f\u613f\u548c\u914d\u5408\u5ea6\uff0c\u4f46\u672a\u4e3b\u52a8\u8ffd\u95ee\u53d8\u73b0\u7ec6\u8282\u6216\u8868\u8fbe\u5f3a\u70c8\u641e\u94b1\u6b32\u671b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u76ee\u524d\u542c\u5b8c\u8bfe\u611f\u89c9\u80fd\u63a5\u53d7\uff0c\u6211\u60f3\u63a5\u7740\u5b66\u4e60\u66f4\u591a\u7684\u201d > \u201c\u62a5\u540d4\u4e2a\u6708\u201d > \u201c\u6211\u8981\u505a\u4e3b\u64ad\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u4e2d]** \u2014 \u80fd\u652f\u4ed82380\u5143\u8bfe\u7a0b\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\u6216\u501f\u8d37\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**[\u4f4e]** \u2014 **\u5173\u952e\u77ed\u677f**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u6700\u8fd1\u65f6\u95f4\u4e0d\u591a\uff0c\u665a\u70b9\u518d\u5b66\u4e60\u884c\u5417\uff1f\u201d\uff0c\u8868\u660e\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\uff0c\u5b58\u5728\u8ddf\u8fdb\u98ce\u9669\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u672a\u77e5]** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a**\u3002\u7528\u6237\u5168\u7a0b\u914d\u5408\u3001\u793c\u8c8c\uff0c\u672a\u8868\u73b0\u51fa\u60c5\u7eea\u5d29\u6e83\u6216\u6781\u5ea6\u4f9d\u8d56\u3002\u4f46\u7f3a\u4e4f\u4e3b\u52a8\u63d0\u95ee\u548c\u6df1\u5ea6\u4e92\u52a8\uff0c\u53ef\u80fd\u5c5e\u4e8e\u8c28\u614e\u89c2\u671b\u578b\uff0c\u6297\u538b\u80fd\u529b\u672a\u77e5\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u597d\u7684\uff0c\u8c22\u8c22\u5e08\u59d0\u201d > \u201c\u597d\u7684\u5b66\u59d0\uff0c\u4e00\u5b9a\u51c6\u65f6\u5230\u201d > \u201c\u90a3\u5c31\u597d\uff0c\u6211\u8fd8\u62c5\u5fc3\u4e0d\u884c\u5462\u201d\uff08\u8868\u73b0\u51fa\u5bf9\u6743\u5a01\u7684\u4f9d\u8d56\u548c\u5bfb\u6c42\u8ba4\u53ef\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c / \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u672a\u6765\u7684\u4e0d\u786e\u5b9a\u6027\u548c\u6280\u80fd\u4e0d\u8db3\u7684\u7126\u8651**\u3002\u7528\u6237\u9009\u62e9\u62a5\u540d\u5b66\u4e60\uff0c\u5e0c\u671b\u901a\u8fc7\u638c\u63e1\u6280\u80fd\u83b7\u5f97\u4e00\u4efd\u517c\u804c\u6216\u5168\u804c\u4fdd\u969c\uff0c\u540c\u65f6\u5728\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u5bfb\u6c42\u5bfc\u5e08\uff08\u5e08\u59d0\uff09\u7684\u8ba4\u53ef\u548c\u966a\u4f34\uff0c\u4ee5\u83b7\u5f97\u5b89\u5168\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6301\u7eed\u7684\u6b63\u5411\u53cd\u9988\u4e0e\u660e\u786e\u7684\u8def\u5f84\u6307\u5f15**\u3002\u7528\u201c\u5e08\u59d0\u770b\u597d\u4f60\u201d\u3001\u201c\u8fdb\u6b65\u660e\u663e\u201d\u7b49\u8bdd\u8bed\u5efa\u7acb\u4fe1\u4efb\uff0c\u5e76\u7528\u6e05\u6670\u7684\u8bfe\u7a0b\u5b89\u6392\u548c\u8d44\u6e90\u627f\u8bfa\uff08\u5982\u7248\u6743\u4e66\uff09\u7f13\u89e3\u5176\u5bf9\u201c\u5b66\u4e86\u6ca1\u7528\u201d\u7684\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1\u7c7b** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T5 \u597d\u73a9\u5c1d\u9c9c\u8005** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n**\u5224\u5b9a\u6811\u8def\u5f84\u5206\u6790**\uff1a\n1.  **\u652f\u4ed8\u6838\u67e5**\uff1a\u672a\u53d1\u73b0\u82b1\u5457\u5206\u671f\u22656\u671f\u7b49\u9ad8\u98ce\u9669\u652f\u4ed8\u884c\u4e3a\u3002\n2.  **\u4e09\u8f74\u8bc4\u5206**\uff1a\u52a8\u673a\u7eaf\u5ea6\uff085-6\u5206\uff0c\u4e2d\uff09\u3001\u8d44\u6e90\u5e95\u5ea7\uff085-6\u5206\uff0c\u4e2d\uff0c\u65f6\u95f4\u77ed\u677f\uff09\u3001\u5fc3\u7406\u5f39\u6027\uff085-6\u5206\uff0c\u4e2d\uff09\u3002\n3.  **\u5224\u5b9a\u6811\u5339\u914d**\uff1a\u52a8\u673a\u7eaf\u5ea65-6\u5206\uff0c\u8d44\u6e90\u5e95\u5ea75-7\u5206\uff0c\u65e0\u660e\u786e\u53d8\u73b0\u8ffd\u95ee\uff0c\u53d1\u8a00\u805a\u7126\u4e8e\u201c\u9009\u4e66\u201d\u3001\u201c\u5b66\u4e60\u201d\uff0c\u7b26\u5408**\u5206\u652fC\uff08\u4e2d\u7b49\u5f39\u6027\u901a\u9053\uff09** \u4e2d **\u201c\u5174\u8da3\u805a\u7126\u578b\u89c2\u671b\u8005\u201d** \u573a\u666f\u3002\u56e0\u6b64\u5224\u5b9a\u4e3a **T5 \u597d\u73a9\u5c1d\u9c9c\u8005\uff08\u5174\u8da3\u805a\u7126\u53d8\u4f53\uff09**\uff0c\u5bf9\u5e94 **C1\u7c7b**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u81ea\u4e3b\u62a5\u540d\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u4e2d** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u7528\u6237\u5df2\u660e\u786e\u8868\u793a\u201c\u65f6\u95f4\u4e0d\u591a\u201d\u3002\u82e5\u8bfe\u7a0b\u8282\u594f\u7d27\u51d1\u3001\u4f5c\u4e1a\u91cf\u5927\uff0c\u6781\u6613\u56e0\u65f6\u95f4\u65e0\u6cd5\u534f\u8c03\u800c\u4ea7\u751f\u79ef\u538b\u3001\u81ea\u8d23\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u76ee\u524d\u8868\u73b0\u914d\u5408\uff0c\u672a\u89c1\u660e\u663e\u73bb\u7483\u5fc3\u8ff9\u8c61\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u82e5\u5b66\u4e60\u4e00\u6bb5\u65f6\u95f4\u540e\uff08\u59821-2\u4e2a\u6708\uff09\u4ecd\u672a\u83b7\u5f97\u4efb\u4f55\u6b63\u53cd\u9988\uff08\u5982\u8bd5\u97f3\u5931\u8d25\u3001\u65e0\u6536\u5165\uff09\uff0c\u53ef\u80fd\u4ea7\u751f\u201c\u5b66\u800c\u65e0\u7528\u201d\u7684\u5931\u843d\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\u3002\u5f53\u8bfe\u7a0b\u5185\u5bb9\u52a0\u6df1\u3001\u4f5c\u4e1a\u91cf\u589e\u52a0\uff0c\u800c\u7528\u6237\u788e\u7247\u5316\u65f6\u95f4\u65e0\u6cd5\u5e94\u5bf9\u65f6\uff0c\u662f\u9000\u8d39\u9ad8\u53d1\u671f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u540c\u5b66\u4f60\u597d\uff0c\u770b\u5230\u4f60\u62a5\u540d\u65f6\u63d0\u5230\u6700\u8fd1\u65f6\u95f4\u53ef\u80fd\u4e0d\u592a\u5145\u88d5\uff0c\u8fd9\u5b8c\u5168\u6ca1\u5173\u7cfb\uff01\u54b1\u4eec\u7684\u8bfe\u7a0b\u90fd\u662f\u5f55\u64ad\uff0c\u53ef\u4ee5\u968f\u65f6\u56de\u770b\u3002\u6700\u91cd\u8981\u7684\u662f\u627e\u5230\u81ea\u5df1\u7684\u8282\u594f\uff0c\u54ea\u6015\u6bcf\u5929\u53ea\u6295\u5165\u534a\u5c0f\u65f6\uff0c\u6301\u7eed\u79ef\u7d2f\u4e5f\u4f1a\u6709\u60ca\u559c\u3002\u6709\u4efb\u4f55\u65f6\u95f4\u5b89\u6392\u4e0a\u7684\u56f0\u96be\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4eec\u4e00\u8d77\u8c03\u6574\u8ba1\u5212\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5174\u8da3\u6e38\u4e50\u7ebf\u3011**\u3002\u964d\u4f4e\u5b66\u4e1a\u538b\u529b\uff0c\u5f3a\u5316\u8da3\u5473\u6027\u548c\u6210\u5c31\u611f\uff0c\u907f\u514d\u7528\u201c\u63a5\u5355\u8d5a\u94b1\u201d\u8fc7\u5ea6\u65bd\u538b\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\u7684\u7279\u70b9\uff0c\u8865\u5145 **\u3010\u5f39\u6027\u5b66\u4e60\u8ba1\u5212\u5305\u3011** \u548c **\u3010\u5fae\u6210\u5c31\u6fc0\u52b1\u5305\u3011**\uff08\u5982\u5b8c\u6210\u5c0f\u7247\u6bb5\u5373\u53ef\u83b7\u5f97\u5fbd\u7ae0\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u5bc6\u96c6\u7684\u6253\u5361\u3001\u4e25\u683c\u7684deadline\u548c\u201c\u522b\u4eba\u90fd\u63a5\u5355\u4e86\u201d\u7684\u8bdd\u672f\u5236\u9020\u7126\u8651\u3002\u7981\u6b62\u5c06\u5176\u4e0e\u5168\u804c\u6216\u9ad8\u5f3a\u5ea6\u517c\u804c\u5b66\u5458\u5bf9\u6bd4\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u521d\u671f\u4e25\u7981\u5347\u5355\u3002\u5f85\u5176\u5b8c\u6210\u7b2c\u4e00\u4e2a\u5c0f\u4f5c\u54c1\u5e76\u83b7\u5f97\u6b63\u5411\u53cd\u9988\u540e\uff0c\u53ef\u8bd5\u63a2\u6027\u63a8\u8350 **500\u5143\u4ee5\u5185**\u7684\u8f7b\u91cf\u7ea7\u5174\u8da3\u8fdb\u9636\u8bfe\u7a0b\uff08\u5982\u58f0\u7ebf\u7f8e\u5316\u8bfe\uff09\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u76ee\u524d\u542c\u5b8c\u8bfe\u611f\u89c9\u80fd\u63a5\u53d7\uff0c\u6211\u60f3\u63a5\u7740\u5b66\u4e60\u66f4\u591a\u7684**\u201d \uff08\u52a8\u673a\u4e2d\uff0c\u6709\u5b66\u4e60\u610f\u613f\u4f46\u975e\u72c2\u70ed\uff09\n2. > \u201c**\u5e08\u59d0\u6211\u6700\u8fd1\u65f6\u95f4\u4e0d\u591a\uff0c\u665a\u70b9\u518d\u5b66\u4e60\u884c\u5417\uff1f**\u201d \uff08\u8d44\u6e90\u5e95\u5ea7\u5173\u952e\u77ed\u677f\u66b4\u9732\uff09\n3. > \u201c**\u90a3\u5c31\u597d\uff0c\u6211\u8fd8\u62c5\u5fc3\u4e0d\u884c\u5462**\u201d \uff08\u5fc3\u7406\u5f39\u6027\u4e2d\uff0c\u4f9d\u8d56\u5916\u90e8\u8ba4\u53ef\uff0c\u7f3a\u4e4f\u7edd\u5bf9\u81ea\u4fe1\uff09\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T5 \u597d\u73a9\u5c1d\u9c9c\u8005\uff08\u5174\u8da3\u805a\u7126\u578b\uff09\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e00\u4efd\u53ef\u638c\u63a7\u7684\u526f\u4e1a\u6280\u80fd\u4e0e\u5b66\u4e60\u966a\u4f34\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u81f4\u5f39\u6027\u7684\u5b66\u4e60\u8ba1\u5212\uff0c\u7528\u5fae\u6210\u5c31\u548c\u8da3\u5473\u6027\u7ef4\u6301\u5176\u5b66\u4e60\u52a8\u529b\uff0c\u4e25\u9632\u65f6\u95f4\u538b\u529b\u5bfc\u81f4\u7684\u5d29\u76d8\u3011**\u3002\n\n```json\n{\"core_type\": \"T5 \u597d\u73a9\u5c1d\u9c9c\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168/\u793e\u4ea4\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
