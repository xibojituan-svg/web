    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u4e0e\u98ce\u63a7\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u7f3a\u4e4f\u7528\u6237\u5e74\u9f84\u3001\u804c\u4e1a\u3001\u5bb6\u5ead\u7ed3\u6784\u3001\u6536\u5165\u6c34\u5e73\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u3001\u652f\u4ed8\u80fd\u529b\u7b49\u5173\u952e\u80cc\u666f\u4fe1\u606f\uff0c\u4ec5\u80fd\u4ece\u4e92\u52a8\u884c\u4e3a\u63a8\u65ad\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a\u4e2d\u7b49\u504f\u9ad8\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u517c\u804c\u53d8\u73b0\u9700\u6c42\uff08\u201c\u60f3\u58f0\u97f3\u53d8\u73b0\uff0c\u505a\u517c\u804c\u201d\uff09\uff0c\u4e14\u5bf9\u6709\u58f0\u884c\u4e1a\u6709\u6301\u7eed\u5174\u8da3\uff08\u201c\u55ef\u55ef\u201d\u3001\u201c\u597d\u7684\u201d\u7b49\u79ef\u6781\u56de\u5e94\uff09\u3002\u52a8\u673a\u517c\u5177\u5174\u8da3\u4e0e\u5b9e\u7528\u4e3b\u4e49\uff0c\u4f46**\u7f3a\u4e4f\u5bf9\u884c\u4e1a\u96be\u5ea6\u3001\u65f6\u95f4\u6295\u5165\u7684\u6df1\u5ea6\u8ba4\u77e5**\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4fe1\u606f\u4e25\u91cd\u4e0d\u8db3**\u3002\u4ec5\u77e5\u7528\u6237\u6765\u81ea\u5b89\u5fbd\uff0c\u6709\u624b\u673a\u8bbe\u5907\u53ef\u53c2\u4e0e\u5b66\u4e60\u4e0e\u8bd5\u97f3\u3002\u672a\u77e5\u5176\u7ecf\u6d4e\u72b6\u51b5\u3001\u53ef\u652f\u914d\u65f6\u95f4\u3001\u5bb6\u5ead\u652f\u6301\u3001\u5b66\u4e60\u73af\u5883\u7b49\u5173\u952e\u8d44\u6e90\u3002\u7528\u6237\u63d0\u53ca\u201c\u8003\u8bd5\u201d\uff0c\u53ef\u80fd\u4e3a\u5b66\u751f\u6216\u6709\u804c\u4e1a\u8003\u8bd5\u9700\u6c42\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a\u4e2d\u7b49\u3002\u7528\u6237\u914d\u5408\u5ea6\u9ad8\uff08\u6309\u65f6\u56de\u590d\u3001\u53c2\u4e0e\u76f4\u64ad\u3001\u5b8c\u6210\u4f5c\u4e1a\uff09\uff0c\u9500\u552e\u53cd\u9988\u5176\u4f5c\u4e1a\u201c\u60ca\u8273\u201d\u3001\u201c\u5f88\u9002\u5408\u201d\u3002\u9762\u5bf9\u9500\u552e\u50ac\u4fc3\uff08\u201c\u4f60\u548b\u9000\u51fa\u6765\u4e86\uff1f\u201d\uff09\u65f6\u80fd\u5e73\u548c\u89e3\u91ca\uff08\u201c\u8003\u8bd5\u53bb\u4e86\u201d\uff09\uff0c\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u8010\u5fc3\u548c\u6c9f\u901a\u610f\u613f\u3002\u4f46**\u51b3\u7b56\u8fc7\u7a0b\u7565\u663e\u88ab\u52a8\u548c\u72b9\u8c6b**\uff08\u201c\u6709\u70b9\u60f3\u62a52\u4e2a\u6708\u7684\u2026\u201d\uff09\uff0c\u9762\u5bf9\u8f6c\u5316\u538b\u529b\u65f6\u672a\u8868\u73b0\u51fa\u5f3a\u70c8\u6297\u62d2\u6216\u6df1\u5ea6\u8d28\u7591\uff0c\u5f39\u6027\u4e0a\u9650\u672a\u77e5\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a**\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u4e8e4\u670812\u65e5\u665a\u5b8c\u62103980\u5143\u201c\u7cbe\u82f1\u73ed\u201d\u8bfe\u7a0b\u652f\u4ed8\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4e0e\u5bb6\u4eba\u5546\u8bae\u8fc7\u7a0b\uff0c\u7528\u6237\u72ec\u7acb\u5b8c\u6210\u54a8\u8be2\u4e0e\u652f\u4ed8\uff0c**\u63a8\u6d4b\u4e3a\u72ec\u7acb\u51b3\u7b56**\uff0c\u4f46\u5b58\u5728\u5bb6\u5ead\u51b3\u7b56\u98ce\u9669\u76f2\u533a\u3002\n*   **\u6b65\u9aa41-4\u5224\u5b9a**\uff1a\n    *   **A (\u8ba4\u77e5\u5c42-\u4fe1\u606f)**\uff1a\u7528\u6237\u5df2\u63a5\u6536\u5927\u91cf\u884c\u4e1a\u4fe1\u606f\u3001\u8bfe\u7a0b\u798f\u5229\u3001\u53d8\u73b0\u8def\u5f84\u5ba3\u4f20\u3002\n    *   **B (\u8ba4\u77e5\u5c42-\u4fe1\u4efb)**\uff1a\u901a\u8fc7\u591a\u6b21\u76f4\u64ad\u8bfe\u3001\u4f5c\u4e1a\u70b9\u8bc4\u3001\u8d44\u6e90\u53d1\u653e\u5efa\u7acb\u4fe1\u4efb\uff0c\u9500\u552e\u4ee5\u201c\u5e08\u59d0\u201d\u8eab\u4efd\u62c9\u8fd1\u8ddd\u79bb\uff0c\u7528\u6237\u4fe1\u4efb\u5efa\u7acb\u3002\n    *   **C (\u610f\u5411\u5c42-\u8bc4\u4f30)**\uff1a\u7528\u6237\u8868\u73b0\u51fa\u5174\u8da3\uff0c\u5e76\u5b8c\u6210\u652f\u4ed8\uff0c\u8fdb\u5165\u8bc4\u4f30\u540e\u7684\u884c\u52a8\u9636\u6bb5\u3002\n    *   **D (\u884c\u52a8\u5c42-\u8f6c\u5316)**\uff1a**\u5df2\u5b8c\u6210\u8f6c\u5316**\uff0c\u652f\u4ed83980\u5143\u62a5\u540d\u7cbe\u82f1\u73ed\u3002\n\n**\u5224\u5b9a\u7ed3\u679c\uff1aD\u7c7b\uff08\u5df2\u8f6c\u5316\u7528\u6237\uff09**\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b\uff1aT7 \u52a1\u5b9e\u63a2\u7d22\u8005\u578b**\n    *   **\u7279\u5f81**\uff1a\u76ee\u6807\u660e\u786e\uff08\u517c\u804c\u53d8\u73b0\uff09\uff0c\u884c\u52a8\u914d\u5408\uff08\u8ddf\u8bfe\u3001\u4ea4\u4f5c\u4e1a\uff09\uff0c\u51b3\u7b56\u76f8\u5bf9\u7406\u6027\uff08\u5bf9\u6bd42\u4e2a\u6708\u4e0e4\u4e2a\u6708\u8bfe\u7a0b\uff09\uff0c\u5bf9\u77ed\u671f\u56de\u62a5\u6709\u671f\u5f85\u3002\u7f3a\u4e4f\u5bf9\u884c\u4e1a\u6df1\u6c34\u533a\u7684\u8ba4\u77e5\uff0c\u6613\u88ab\u201c\u5feb\u901f\u63a5\u5355\u201d\u3001\u201c\u8fb9\u5b66\u8fb9\u8d5a\u201d\u8bdd\u672f\u5438\u5f15\u3002\n    *   **\u4f9d\u636e**\uff1a\u7528\u6237\u6838\u5fc3\u8bc9\u6c42\u662f\u201c\u517c\u804c\u201d\u3001\u201c\u53d8\u73b0\u201d\uff0c\u5bf9\u8bfe\u7a0b\u7684\u5177\u4f53\u5185\u5bb9\uff08\u5982\u753b\u672c\u3001\u5bf9\u8f68\uff09\u6709\u5b66\u4e60\u884c\u4e3a\uff0c\u6700\u7ec8\u5728\u9500\u552e\u627f\u8bfa\u201c\u7b2c\u4e8c\u5468\u5f00\u901a\u8bd5\u97f3\u63a5\u5355\u6743\u9650\u201d\u7b49\u798f\u5229\u4e0b\u5b8c\u6210\u652f\u4ed8\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\uff08\u98ce\u9669\u7b49\u7ea7\uff1a\u4e2d\uff09\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u4e0d\u53ca\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u671f\u5f85\u201c\u517c\u804c\u53d8\u73b0\u201d\uff0c\u82e5\u5165\u5b66\u540e\u63a5\u5355\u56f0\u96be\u3001\u6536\u5165\u4e0e\u5ba3\u4f20\u4e0d\u7b26\uff0c\u6781\u6613\u5f15\u53d1\u5931\u671b\u548c\u9000\u8d39\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u9700\u8b66\u60d5**\u3002\u672a\u77e53980\u5143\u5bf9\u5176\u7ecf\u6d4e\u8d1f\u62c5\u7a0b\u5ea6\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u6709\u8003\u8bd5\u7b49\u5b89\u6392\uff0c\u82e5\u8bfe\u7a0b\u5b66\u4e60\u4e0e\u4e3b\u4e1a/\u751f\u6d3b\u51b2\u7a81\uff0c\u53ef\u80fd\u4e2d\u9014\u653e\u5f03\u3002\n    4.  **\u8bfe\u7a0b\u8d28\u91cf**\uff1a**\u4e2d\u98ce\u9669**\u3002\u53d6\u51b3\u4e8e\u6b63\u5f0f\u8bfe\u7a0b\u4e0e\u4f53\u9a8c\u8425\u843d\u5dee\u3002\u7528\u6237\u5df2\u4f53\u9a8c\u90e8\u5206\u6559\u5b66\uff0c\u82e5\u6b63\u8bfe\u670d\u52a1\u6216\u5185\u5bb9\u8d28\u91cf\u4e0b\u6ed1\uff0c\u53ef\u80fd\u5f15\u53d1\u6295\u8bc9\u3002\n    5.  **\u9500\u552e\u627f\u8bfa\u672a\u5151\u73b0**\uff1a**\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u627f\u8bfa\u201c\u7b2c\u4e8c\u5468\u5f00\u901a\u63a5\u5355\u6743\u9650\u201d\u3001\u201c\u8d60\u9001\u7248\u6743\u4e66\u201d\u3001\u201c\u514d\u8003\u6838\u5165\u9a7b\u201d\u7b49\uff0c**\u8fd9\u4e9b\u627f\u8bfa\u662f\u4fc3\u5355\u5173\u952e\uff0c\u82e5\u672a\u53ca\u65f6\u3001\u8db3\u989d\u5151\u73b0\uff0c\u9000\u8d39\u98ce\u9669\u6781\u9ad8**\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u6f5c\u5728\u98ce\u9669**\u3002\n    7.  **\u7ade\u54c1/\u66ff\u4ee3\u65b9\u6848**\uff1a**\u4f4e\u98ce\u9669**\u3002\u5f53\u524d\u672a\u8868\u73b0\u51fa\u6bd4\u8f83\u884c\u4e3a\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5408\u89c4\u70b9**\uff1a\u9500\u552e\u6d41\u7a0b\u5b8c\u6574\uff0c\u6709\u4f53\u9a8c\u8bfe\u3001\u4f5c\u4e1a\u3001\u8f6c\u5316\u73af\u8282\u3002\n*   **\u98ce\u9669\u70b9**\uff1a\n    *   **\u8fc7\u5ea6\u627f\u8bfa\u98ce\u9669**\uff1a\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u7b2c\u4e8c\u5468\u5f00\u901a\u63a5\u5355\u6743\u9650\u201d\u3001\u201c\u85aa\u8d44\u6bd4\u5176\u4ed6\u8d5b\u9053\u9ad8\u201d\u3001\u201c\u9001\u4f60\u51e0\u672c\u7cbe\u54c1\u7248\u6743\u4e66\u201d\uff0c**\u5b58\u5728\u5938\u5927\u63a5\u5355\u5bb9\u6613\u5ea6\u548c\u6536\u76ca\u7684\u5acc\u7591**\u3002\n    *   **\u5236\u9020\u7a00\u7f3a\u4e0e\u7d27\u8feb\u611f**\uff1a\u201c\u6700\u540e\u4e00\u573a\u201d\u3001\u201c\u6ca1\u6709\u56de\u653e\u201d\u3001\u201c\u6309\u4ed8\u6b3e\u987a\u5e8f\u767b\u8bb0\u201d\u3001\u201c\u6293\u7d27\u54e6\u201d\u7b49\u8bdd\u672f\u9891\u7e41\u4f7f\u7528\u3002\n    *   **\u60c5\u611f\u7ed1\u5b9a**\uff1a\u4f7f\u7528\u201c\u5e08\u59d0\u201d\u3001\u201c\u5e26\u4f60\u201d\u3001\u201c\u540c\u4e8b\u201d\u7b49\u79f0\u8c13\u8fdb\u884c\u60c5\u611f\u7ef4\u7cfb\uff0c\u53ef\u80fd\u6a21\u7cca\u5546\u4e1a\u5173\u7cfb\u3002\n    *   **\u672a\u5145\u5206\u63d0\u793a\u98ce\u9669**\uff1a\u804a\u5929\u8bb0\u5f55\u672a\u89c1\u5bf9\u884c\u4e1a\u7ade\u4e89\u3001\u6536\u5165\u4e0d\u786e\u5b9a\u6027\u3001\u5b66\u4e60\u96be\u5ea6\u7684\u7406\u6027\u98ce\u9669\u63d0\u793a\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6838\u5fc3\u4efb\u52a1**\uff1a**\u7ba1\u7406\u9884\u671f\uff0c\u5f3a\u5316\u4ea4\u4ed8\uff0c\u5151\u73b0\u627f\u8bfa\uff0c\u9884\u9632\u9000\u8d39**\u3002\n*   **\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9884\u671f\u7ba1\u7406\uff08\u9996\u8981\uff09**\uff1a\u5f00\u8425\u5373\u660e\u786e\u5b66\u4e60\u8def\u5f84\u3001\u63a5\u5355\u771f\u5b9e\u95e8\u69db\uff08\u975e\u81ea\u52a8\u5f00\u901a\uff09\u3001\u884c\u4e1a\u5e73\u5747\u6536\u5165\u5468\u671f\u4e0e\u6c34\u5e73\uff0c\u964d\u4f4e\u201c\u5feb\u901f\u66b4\u5bcc\u201d\u5e7b\u60f3\u3002\n    2.  **\u627f\u8bfa\u8ffd\u8e2a\u8868**\uff1a\u5efa\u7acb\u6e05\u5355\uff0c\u9010\u4e00\u843d\u5b9e\u9500\u552e\u627f\u8bfa\u7684\u201c\u7248\u6743\u4e66\u201d\u3001\u201c\u63a5\u5355\u6743\u9650\u5f00\u901a\u201d\u3001\u201c\u8bc1\u4e66\u201d\u7b49\uff0c\u4e3b\u52a8\u540c\u6b65\u8fdb\u5ea6\uff0c\u5efa\u7acb\u4fe1\u4efb\u3002\n    3.  **\u4e2a\u6027\u5316\u5173\u6ce8**\uff1a\u4e86\u89e3\u5176\u201c\u8003\u8bd5\u201d\u80cc\u666f\uff0c\u8bc4\u4f30\u5176\u65f6\u95f4\u7a33\u5b9a\u6027\uff0c\u63d0\u4f9b\u7075\u6d3b\u5b66\u4e60\u5efa\u8bae\uff0c\u9884\u9632\u56e0\u65f6\u95f4\u51b2\u7a81\u6389\u961f\u3002\n    4.  **\u65e9\u671f\u6210\u529f\u4f53\u9a8c**\uff1a\u5728\u5176\u5b66\u4e60\u521d\u671f\uff0c\u534f\u52a9\u83b7\u5f97\u4e00\u4e9b\u5c0f\u989d\u3001\u6613\u5b8c\u6210\u7684\u8bd5\u97f3\u6216\u4efb\u52a1\uff0c\u5efa\u7acb\u6b63\u53cd\u9988\u3002\n    5.  **\u98ce\u9669\u6c9f\u901a**\uff1a\u9002\u65f6\u4ee5\u6848\u4f8b\u65b9\u5f0f\u544a\u77e5\u884c\u4e1a\u6311\u6218\uff0c\u5f15\u5bfc\u5176\u5c06\u76ee\u6807\u4ece\u201c\u5feb\u901f\u53d8\u73b0\u201d\u8c03\u6574\u4e3a\u201c\u6280\u80fd\u63d0\u5347+\u957f\u671f\u79ef\u7d2f\u201d\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**\uff1a\n    *   \u5df2\u5339\u914d\u201c\u7cbe\u82f1\u73ed\u201d\uff082\u4e2a\u6708\u7cfb\u7edf\u8bfe\uff09\uff0c\u7b26\u5408\u5176\u8ffd\u6c42\u6548\u7387\u7684\u8bc9\u6c42\u3002\n    *   **\u540e\u7eed\u53ef\u6302\u8f7d**\uff1a**\u6280\u80fd\u8fdb\u9636\u4e50\u9ad8\u6a21\u5757**\uff08\u5982\u89d2\u8272\u97f3\u7cbe\u4fee\u3001\u540e\u671f\u5236\u4f5c\uff09\u3001**\u8d44\u6e90\u5bf9\u63a5\u670d\u52a1**\uff08\u8bd5\u97f3\u673a\u4f1a\u63a8\u9001\uff09\u3001**\u8f7b\u91cf\u5b9e\u6218\u8425**\uff08\u77ed\u7bc7\u5f55\u5236\u9879\u76ee\uff09\uff0c\u6301\u7eed\u63d0\u4f9b\u4ef7\u503c\uff0c\u589e\u5f3a\u7c98\u6027\u3002\n\n{\"core_type\": \"T7 \u52a1\u5b9e\u63a2\u7d22\u8005\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168/\u5c0a\u91cd\", \"target_product_line\": \"\u6280\u80fd\u8fdb\u9636\u4e50\u9ad8\u6a21\u5757\u3001\u8d44\u6e90\u5bf9\u63a5\u670d\u52a1\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u5b89\u5fbd\"}";
