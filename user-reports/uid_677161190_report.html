    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677161190\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677161190 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5f20\u4e00\u837b\uff08\u9500\u552e\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6500\u767b\u8ba1\u5212\u7cbe\u82f1\u7248\uff082\u4e2a\u6708\u8bfe\u7a0b\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u9700\u6838\u67e5\u662f\u5426\u4f7f\u7528\u82b1\u5457/\u5206\u671f\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u660e\u786e\u63d0\u53ca\uff0c\u4f46\u4ece\u54cd\u5e94\u901f\u5ea6\u770b\uff0c\u65f6\u95f4\u76f8\u5bf9\u5145\u88d5\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\uff08\u4e92\u52a8\u79ef\u6781\uff0c\u4f46\u5173\u952e\u98ce\u9669\u7ef4\u5ea6\u4fe1\u606f\u7f3a\u5931\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e**\uff0c\u5173\u6ce8\u63a5\u5355\u6d41\u7a0b\u4e0e\u65f6\u95f4\u8282\u70b9\uff0c\u4f46\u540c\u65f6\u4e5f\u8868\u73b0\u51fa\u5bf9\u5b66\u4e60\u5185\u5bb9\u672c\u8eab\u7684\u5174\u8da3\u548c\u6267\u884c\u529b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u662f\u4e0d\u662f3\u5929\u76f4\u64ad\u8bfe\u542c\u5b8c\u4e86\u4e4b\u540e\uff0c\u5c31\u53ef\u4ee5\u63a5\u5355\u4e86\u5440\uff1f\u8fd8\u662f\u8bf4\u73b0\u5728\u4e5f\u80fd\u63a5\u5355\u201d\n  > \u201c\u6211\u60f3\u5c1d\u8bd5\u4e00\u4e0b\u5148\u5f55\u97f3\uff0c\u8fd8\u6709\u753b\u672c\u201d\u201c\u5ba1\u542c\u6211\u4e5f\u633a\u559c\u6b22\u7684\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u9009\u62e9\u5148\u62a52\u4e2a\u6708\u8bfe\u7a0b\u201c\u8bd5\u8bd5\u770b\u201d\uff0c\u8868\u73b0\u51fa\u5bf9\u4ef7\u683c\u7684\u654f\u611f\u548c\u8c28\u614e\uff0c\u4f46\u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\u6216\u501f\u8d37\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u53ca\u65f6\u5b8c\u6210\u6253\u5361\u3001\u4f5c\u4e1a\u548c\u8bd5\u97f3\uff0c\u54cd\u5e94\u9500\u552e\u6d88\u606f\u8fc5\u901f\uff0c\u8868\u660e\u6709\u76f8\u5bf9\u7a33\u5b9a\u7684\u788e\u7247\u5316\u5b66\u4e60\u65f6\u95f4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8 (7-8\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u9500\u552e\u8be6\u7ec6\u4e14\u7565\u5e26\u538b\u529b\u7684\u4f5c\u4e1a\u70b9\u8bc4\uff0c\u80fd\u6b63\u9762\u63a5\u53d7\uff08\u201c\u8001\u5e08\u8bf4\u5f97\u771f\u597d\uff0c\u7279\u522b\u6709\u9053\u7406\u201d\uff09\uff0c\u5e76\u5feb\u901f\u5b8c\u6210\u65b0\u4f5c\u4e1a\u3002\u5168\u7a0b\u65e0\u4efb\u4f55\u8d1f\u9762\u60c5\u7eea\u6216\u81ea\u6211\u6000\u7591\u8868\u8fbe\uff0c\u6267\u884c\u529b\u5f3a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u4f5c\u4e1a\u5df2\u5b8c\u6210\u2705\u201d\u201c\u8bd5\u97f3\u4e5f\u4e0a\u4f20\u4e86\u201d\u201c\u597d\u5462\uff0c\u8c22\u8c22[\u8036]\u201d\u201c\u6211\u4f1a\u52a0\u6cb9\u7684\uff0c\u8c22\u8c22\u8001\u5e08\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42\uff08\u7126\u8651\u4fdd\u969c\uff09**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u201c\u80fd\u5426\u5feb\u901f\u53d8\u73b0\u201d\u548c\u201c\u5b66\u4e60\u8def\u5f84\u662f\u5426\u6709\u6548\u201d\u5b58\u5728\u4e0d\u786e\u5b9a\u6027\u7126\u8651\u3002\u4ed6\u9700\u8981\u4e00\u4efd\u660e\u786e\u7684\u3001\u53ef\u9884\u671f\u7684\u201c\u6280\u80fd\u53d8\u73b0\u201d\u8def\u7ebf\u56fe\u6765\u83b7\u5f97\u804c\u4e1a\u5b89\u5168\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u786e\u5b9a\u6027\u201d\u4e0e\u201c\u88ab\u770b\u89c1\u7684\u8fdb\u6b65\u201d**\u3002\u63d0\u4f9b\u6e05\u6670\u7684\u63a5\u5355\u65f6\u95f4\u8868\u3001\u9636\u6bb5\u6027\u6210\u679c\u53cd\u9988\uff08\u5982\u4f5c\u4e1a\u70b9\u8bc4\uff09\uff0c\u8ba9\u4ed6\u786e\u4fe1\u6bcf\u4e00\u6b65\u90fd\u5728\u901a\u5f80\u53d8\u73b0\u7684\u8def\u4e0a\uff0c\u4ece\u800c\u7f13\u89e3\u5176\u5bf9\u4e8e\u6295\u5165\u662f\u5426\u503c\u5f97\u7684\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u52a8\u673a\u4e2d\u3001\u8d44\u6e90\u4e2d\u3001\u5f39\u6027\u9ad8) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u672a\u53d1\u73b0\u4fe1\u53f7\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5c1a\u53ef\uff0c\u5b66\u4e60\u6267\u884c\u529b\u5f3a\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u6b63\u9762\u63a5\u53d7\u53cd\u9988\u5e76\u884c\u52a8\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u4e2d** | **\u6838\u5fc3\u98ce\u9669\u70b9**\uff1a\u82e5\u57282\u4e2a\u6708\u8bfe\u7a0b\u7ed3\u675f\u540e\uff0c\u63a5\u5355\u8fdb\u5c55\u8fdc\u4f4e\u4e8e\u5176\u201c\u8bd5\u8bd5\u770b\u201d\u7684\u9884\u671f\uff08\u5982\u8fdf\u8fdf\u65e0\u5355\u6216\u5355\u4ef7\u6781\u4f4e\uff09\uff0c\u53ef\u80fd\u56e0\u6295\u5165\u4ea7\u51fa\u6bd4\u5931\u8861\u800c\u4ea7\u751f\u9000\u8d39\u6216\u62d2\u7edd\u5347\u5355\u7684\u5ff5\u5934\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u8bfe\u7a0b\u4e2d\u540e\u671f\uff08\u7b2c4-8\u5468\uff09**\uff0c\u5f53\u5b66\u4e60\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u82e5\u4ecd\u672a\u83b7\u5f97\u5b9e\u8d28\u6027\u63a5\u5355\u53cd\u9988\u6216\u6536\u5165\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u540c\u5b66\u4f60\u597d\uff0c\u770b\u5230\u4f60\u5728\u4f53\u9a8c\u8425\u671f\u95f4\u6267\u884c\u529b\u8d85\u5f3a\uff0c\u4f5c\u4e1a\u548c\u8bd5\u97f3\u90fd\u5b8c\u6210\u5f97\u5f88\u53ca\u65f6\uff0c\u8fd9\u79cd\u2018\u5b9e\u5e72\u6d3e\u2019\u98ce\u683c\u5728\u6211\u4eec\u8fd9\u7279\u522b\u53d7\u6b22\u8fce\u3002\u54b1\u4eec\u7684\u7cfb\u7edf\u8bfe\u5c31\u662f\u4e3a\u4f60\u8fd9\u6837\u613f\u610f\u884c\u52a8\u7684\u4eba\u8bbe\u8ba1\u7684\uff0c\u6211\u4f1a\u5e2e\u4f60\u628a\u5b66\u4e60\u8def\u5f84\u89c4\u5212\u6e05\u695a\uff0c\u6bcf\u4e2a\u9636\u6bb5\u80fd\u63a5\u89e6\u5230\u4ec0\u4e48\u8d44\u6e90\u3001\u8fbe\u5230\u4ec0\u4e48\u6c34\u5e73\u53ef\u4ee5\u5c1d\u8bd5\u63a5\u5355\uff0c\u90fd\u660e\u660e\u767d\u767d\u3002\u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u628a\u53d8\u73b0\u7684\u8def\u8d70\u624e\u5b9e\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176\u201c\u5b9e\u5e72\u201d\u7279\u8d28\uff0c\u63d0\u4f9b\u6e05\u6670\u3001\u6709\u6311\u6218\u6027\u7684\u6280\u80fd\u8fdb\u9636\u8def\u5f84\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T2\u8001\u9ec4\u725b\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010B\u6a21\u5757\uff1a\u786c\u6838\u624b\u827a\u6c60\u3011**\u3002\u5373\u63d0\u4f9b\u4e13\u5bb61v1\u7b54\u7591\u3001\u7cbe\u51c6\u7684\u4f5c\u4e1a\u70b9\u8bc4\u3001\u4ee5\u53ca**\u5c3d\u65e9\u5f15\u5165\u771f\u5b9e\u6d3e\u5355\u5b9e\u6218\u673a\u4f1a**\u3002\u8fd9\u662f\u5c06\u5176\u8f6c\u5316\u4e3a\u9ad8\u590d\u8d2d\u7528\u6237\u7684\u5173\u952e\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a**\u753b\u4e0d\u5207\u5b9e\u9645\u7684\u5927\u997c**\u3002\u907f\u514d\u627f\u8bfa\u201c\u5b66\u5b8c\u7acb\u5373\u6708\u5165\u8fc7\u4e07\u201d\uff0c\u800c\u5e94\u5f3a\u8c03\u201c\u6280\u80fd\u79ef\u7d2f-\u5c0f\u5355\u8bd5\u6c34-\u7a33\u5b9a\u63a5\u5355\u201d\u7684\u6e10\u8fdb\u8fc7\u7a0b\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u9700\u5efa\u7acb\u5728\u53ef\u89c1\u6210\u679c\u4e0a**\u30022\u4e2a\u6708\u8bfe\u7a0b\u540e\u671f\uff0c\u82e5\u5176\u4f5c\u4e1a\u8d28\u91cf\u548c\u63a5\u5355\u5c1d\u8bd5\u8868\u73b0\u826f\u597d\uff0c\u53ef\u57fa\u4e8e\u5176\u5df2\u53d6\u5f97\u7684\u8fdb\u6b65\u548c\u660e\u786e\u7684\u4e0b\u4e00\u6b65\u6280\u80fd\u7f3a\u53e3\uff0c\u63a8\u4ecb4\u4e2a\u6708\u9ad8\u9636\u8bfe\u7a0b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u662f\u4e0d\u662f3\u5929\u76f4\u64ad\u8bfe\u542c\u5b8c\u4e86\u4e4b\u540e\uff0c\u5c31\u53ef\u4ee5\u63a5\u5355\u4e86\u5440\uff1f\u8fd8\u662f\u8bf4\u73b0\u5728\u4e5f\u80fd\u63a5\u5355\u201d \u2014 **\uff08\u52a8\u673a\uff1a\u5173\u6ce8\u53d8\u73b0\u8def\u5f84\u4e0e\u65f6\u6548\uff09**\n2. > \u201c\u6211\u60f3\u5c1d\u8bd5\u4e00\u4e0b\u5148\u5f55\u97f3\uff0c\u8fd8\u6709\u753b\u672c\u201d\u201c\u5ba1\u542c\u6211\u4e5f\u633a\u559c\u6b22\u7684\u201d \u2014 **\uff08\u52a8\u673a\uff1a\u6709\u5177\u4f53\u5174\u8da3\u65b9\u5411\uff0c\u975e\u7eaf\u6295\u673a\uff09**\n3. > \u201c\u4f5c\u4e1a\u5df2\u5b8c\u6210\u2705\u201d\u201c\u8bd5\u97f3\u4e5f\u4e0a\u4f20\u4e86\u201d\u201c\u8001\u5e08\u8bf4\u5f97\u771f\u597d\uff0c\u7279\u522b\u6709\u9053\u7406\u201d \u2014 **\uff08\u5fc3\u7406\u5f39\u6027\uff1a\u9ad8\u6267\u884c\u529b\uff0c\u6b63\u9762\u63a5\u53d7\u53cd\u9988\uff09**\n4. > \u201c\u8981\u4e0d\u5148\u529e\u4e24\u4e2a\u6708\u7684\u8bd5\u8bd5\u770b\u54c8\u201d\u201c\u9700\u8981\u7684\u8bdd\u518d\u5347\u7ea7\u201d \u2014 **\uff08\u8d44\u6e90\u5e95\u5ea7\uff1a\u8c28\u614e\u51b3\u7b56\uff0c\u5bf9\u4ef7\u683c\u654f\u611f\uff09**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u786e\u5b9a\u6027\u7684\u6280\u80fd\u53d8\u73b0\u8def\u5f84\uff0c\u4ee5\u4fdd\u969c\u804c\u4e1a\u5b89\u5168\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5728\u8bfe\u7a0b\u4e2d\u524d\u671f\u63d0\u4f9b\u6e05\u6670\u7684\u8fdb\u9636\u5730\u56fe\u548c\u771f\u5b9e\u7684\u3001\u54ea\u6015\u5fae\u5c0f\u7684\u63a5\u5355/\u6b63\u53cd\u9988\u673a\u4f1a\uff0c\u4e25\u9632\u201c\u6536\u76ca\u843d\u5dee\u201d\u3011\u3002**\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\"}\n```";
