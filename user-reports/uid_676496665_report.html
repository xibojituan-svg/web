    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a676496665\uff08\u6635\u79f0\uff1a\u4e00\u767e\u5408\u9171\u4e00\uff09\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a676496665 (\u4e00\u767e\u5408\u9171\u4e00) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-24 \u81f3 2026-02-24 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u8d30\u4e2b\u513f(\u738b\u4e66\u5143)\u3001\u5353\u541b\uff08\u674e\u5b9c\u822a\uff09\u3001\u8bd7\u797a\u5eb7\u5eb7(\u5eb7\u8679) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66/AI\u914d\u97f3\u7c7b\u8bfe\u7a0b\uff08\u4ece\u201c\u6500\u767b\u8ba1\u5212\u201d\u6bd5\u4e1a\uff0c\u8fdb\u5165\u65b0\u8425\u671f\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u652f\u4ed8\u65b9\u5f0f\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u9700\u517c\u987e\u5b69\u5b50\uff08\u966a\u5b69\u5b50\u8003\u8bd5\u3001\u770b\u7259\u9f7f\u3001\u5916\u51fa\u6bd4\u8d5b\uff09\uff0c\u4f46\u80fd\u5229\u7528\u788e\u7247\u65f6\u95f4\u5b66\u4e60\u3001\u8865\u8bfe\u3001\u5b8c\u6210\u56e2\u961f\u534f\u4f5c\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u5ead\u6001\u5ea6\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u8bb0\u5f55\u5c55\u73b0\u4e86\u4e30\u5bcc\u7684\u5b66\u4e60\u3001\u793e\u4ea4\u3001\u534f\u4f5c\u548c\u6280\u672f\u884c\u4e3a\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u2b06\u9ad8]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u793e\u4ea4\u5f52\u5c5e\u800c\u6765\uff0c\u4eab\u53d7\u5b66\u4e60\u3001\u521b\u4f5c\u548c\u56e2\u961f\u534f\u4f5c\u7684\u8fc7\u7a0b\uff0c\u800c\u975e\u5355\u7eaf\u8ffd\u6c42\u77ed\u671f\u53d8\u73b0\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n    > \u201c\u6709\u58f0\u4e4b\u591c\u662f\u6211\u4eec\u81ea\u5df1\u7684\uff0c\u6bcf\u4e2a\u4eba\u90fd\u5e94\u8be5\u4e3a\u4e4b\u52aa\u529b\u4e86\u201d\n    > \u201c\u6211\u9009\u4e86\u4e00\u4e2a\u501f\u5200\u4eba\u7684\u7247\u6bb5\uff0c\u4e0d\u77e5\u9053\u9002\u4e0d\u9002\u5408\u8001\u59d0\u59d0\u201d\uff08\u4e3b\u52a8\u5206\u4eab\u4f5c\u54c1\uff09\n    > \u201c\u8981\u6c42\u6ca1\u6709\uff0c\u4f46\u662f\u5f3a\u8feb\u75c7\u7684\u6211\uff0c\u526a\u4e86\uff0c\u6211\u542c\u7740\u96be\u53d7\u201d\uff08\u5bf9\u4f5c\u54c1\u8d28\u91cf\u6709\u81ea\u6211\u8981\u6c42\uff09\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 \u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\uff0c\u4f46\u672a\u663e\u793a\u9ad8\u6d88\u8d39\u80fd\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 \u6709\u56fa\u5b9a\u5de5\u4f5c/\u5bb6\u5ead\u8d23\u4efb\uff08\u9700\u966a\u5b69\u5b50\uff09\uff0c\u4f46\u80fd\u9ad8\u6548\u5229\u7528\u788e\u7247\u65f6\u95f4\u5b8c\u6210\u5b66\u4e60\u3001\u8865\u8bfe\u548c\u590d\u6742\u7684\u56e2\u961f\u540e\u671f\u5de5\u4f5c\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4e2d] \u2014 \u672a\u63d0\u53ca\u53cd\u5bf9\uff0c\u80fd\u534f\u8c03\u65f6\u95f4\u5916\u51fa\u966a\u5b69\u5b50\u6bd4\u8d5b\uff0c\u663e\u793a\u5bb6\u5ead\u4e8b\u52a1\u9700\u4f18\u5148\u5904\u7406\uff0c\u4f46\u672a\u6784\u6210\u5b66\u4e60\u969c\u788d\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9762\u5bf9\u6280\u672f\u95ee\u9898\uff08AU\u63d2\u4ef6\u5b89\u88c5\uff09\u80fd\u8010\u5fc3\u8ddf\u968f\u6307\u5bfc\u89e3\u51b3\uff1b\u5728\u56e2\u961f\u9879\u76ee\u4e2d\u4e3b\u52a8\u627f\u62c5\u534f\u8c03\u3001\u540e\u671f\u5236\u4f5c\u7b49\u538b\u529b\u4efb\u52a1\uff0c\u5e76\u9f13\u52b1\u961f\u53cb\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n    > \u201c\u5bb6\u91cc\u6709\u4e8b\uff0c\u5c24\u5176\u662f\u5b69\u5b50\u6709\u4e8b\uff0c\u5988\u5988\u662f\u6700\u7cdf\u5fc3\u7684\u201d\uff08\u5171\u60c5\u961f\u53cb\uff0c\u60c5\u7eea\u7a33\u5b9a\uff09\n    > \u201c\u76f8\u4e92\u5e2e\u5fd9\uff0c\u8c01\u5bb6\u8fd8\u4e0d\u6709\u70b9\u4ec0\u4e48\u4e8b\uff0c\u54c8\u54c8\uff0c\u6211\u662f\u786c\u9876\u4e0a\u201d\uff08\u4e3b\u52a8\u627f\u62c5\u8d23\u4efb\uff0c\u4e50\u89c2\u79ef\u6781\uff09\n    > \u201c\u6211\u505a\u4f60\u9a6c\u4ed4\uff0c\u4f60\u662f\u961f\u957f\uff0c\u6211\u5e2e\u4f60\u8dd1\u8dd1\u6d3b\u800c\u5df2\u201d\uff08\u5e7d\u9ed8\u5316\u89e3\u89d2\u8272\u5206\u914d\uff0c\u56e2\u961f\u534f\u4f5c\u610f\u613f\u5f3a\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9**\u56e2\u961f\u8ba4\u53ef\u548c\u81ea\u8eab\u6280\u672f\u4ef7\u503c\u88ab\u770b\u89c1**\u6709\u5f3a\u70c8\u9700\u6c42\u3002\u5979\u4eab\u53d7\u5728\u56e2\u961f\u4e2d\u4f5c\u4e3a\u201c\u6280\u672f\u9aa8\u5e72\u201d\u548c\u201c\u534f\u8c03\u8005\u201d\u7684\u89d2\u8272\uff0c\u901a\u8fc7\u5e2e\u52a9\u4ed6\u4eba\uff08\u8c03\u97f3\u3001\u505a\u540e\u671f\u3001\u50ac\u8fdb\u5ea6\uff09\u6765\u83b7\u5f97\u5c0a\u91cd\u548c\u5f52\u5c5e\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u8d4b\u4e88\u5176\u201c\u56e2\u961f\u9886\u8896\u201d\u6216\u201c\u6280\u672f\u6838\u5fc3\u201d\u7684\u6b63\u5f0f\u8eab\u4efd\u4e0e\u6743\u9650**\uff0c\u8ba9\u5979\u4ece\u201c\u53c2\u4e0e\u8005\u201d\u53d8\u4e3a\u201c\u5efa\u8bbe\u8005\u201d\uff0c\u6ee1\u8db3\u5176\u88ab\u9700\u8981\u3001\u88ab\u5c0a\u91cd\u7684\u611f\u89c9\uff0c\u5e76\u652f\u6301\u5979\u5728\u4e13\u4e1a\u7cbe\u8fdb\uff08\u81ea\u6211\u5b9e\u73b0\uff09\u7684\u9053\u8def\u4e0a\u8d70\u5f97\u66f4\u8fdc\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\u2b50A\u7c7b** (\u9ad8\u4ef7\u503c\u9886\u8896\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T1-A \u5bfc\u6f14\u578b\u9886\u8896** (\u8fdb\u5316\u4e2d\uff1a\u4eceT2\u8001\u9ec4\u725b\u5411T1-A\u89c9\u9192) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u8a00\u8bba\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u5bb6\u5ead\u4e8b\u52a1\uff08\u5b69\u5b50\uff09\u53ef\u80fd\u6682\u65f6\u6324\u5360\u65f6\u95f4\uff0c\u4f46\u7528\u6237\u5df2\u5c55\u73b0\u4f18\u79c0\u7684\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u5b66\u4e60\u610f\u613f\u5f3a\uff0c\u80fd\u81ea\u4e3b\u8865\u8bfe\u770b\u56de\u653e\uff0c\u6297\u4e2d\u65ad\u80fd\u529b\u5f3a\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u4e50\u4e8e\u52a9\u4eba\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u5982\u679c\u957f\u671f\u5728\u56e2\u961f\u4e2d\u4ed8\u51fa\uff08\u505a\u540e\u671f\u3001\u534f\u8c03\uff09\u5374\u5f97\u4e0d\u5230\u5b98\u65b9\u8eab\u4efd\u8ba4\u53ef\u6216\u5b9e\u8d28\u6027\u6280\u80fd\u63d0\u5347\uff0c\u53ef\u80fd\u56e0\u201c\u4ef7\u503c\u611f\u5931\u843d\u201d\u800c\u51b7\u5374\u70ed\u60c5\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe\u4e2d\u671f\uff08\u7ea6\u7b2c4-8\u5468\uff09\uff0c\u5f53\u56e2\u961f\u9879\u76ee\u7ed3\u675f\u3001\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u82e5\u6ca1\u6709\u65b0\u7684\u6311\u6218\u6216\u89d2\u8272\u8d4b\u4e88\uff0c\u53ef\u80fd\u8fdb\u5165\u5026\u6020\u671f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u5979\u8bf4......\u201d**\n> \u201c\u767e\u5408\uff0c\u770b\u4e86\u4f60\u5728\u4e0a\u4e2a\u8425\u671f\u7684\u8868\u73b0\uff0c\u7b80\u76f4\u662f\u56e2\u961f\u91cc\u7684\u2018\u5b9a\u6d77\u795e\u9488\u2019\u3002\u65b0\u8425\u671f\u73ed\u73ed\u60f3\u9080\u8bf7\u4f60\u505a\u54b1\u4eec\u73ed\u7684\u2018\u6280\u672f\u7edf\u7b79\u5b98\u2019\uff0c\u8d1f\u8d23\u5e26\u5e26\u65b0\u4eba\u3001\u7ec4\u7ec7\u4e00\u4e0b\u5c0f\u7ec4\u4f5c\u4e1a\uff0c\u4f60\u770b\u6709\u5174\u8da3\u5417\uff1f\u4f60\u7684\u534f\u8c03\u80fd\u529b\u548c\u6280\u672f\u773c\u5149\uff0c\u4e0d\u53d1\u6325\u51fa\u6765\u592a\u53ef\u60dc\u4e86\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf**\u3011/\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u6280\u672f\u94bb\u7814\u503e\u5411\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010**\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743**\u3011\uff08B\u6a21\u5757\uff09\uff0c\u5e76\u6388\u4e88\u3010**\u5c0f\u7ec4\u957f/\u9879\u76ee\u5236\u4f5c\u4eba**\u3011\u7684\u6b63\u5f0f\u8eab\u4efd\uff08D\u6a21\u5757\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u628a\u5979\u5f53\u4f5c\u666e\u901a\u5b66\u5458\u8fdb\u884c\u201c\u586b\u9e2d\u5f0f\u201d\u7ba1\u7406\u6216\u53d1\u5e03\u673a\u68b0\u901a\u77e5\u3002\u7981\u6b62\u5ffd\u89c6\u5979\u7684\u56e2\u961f\u8d21\u732e\uff0c\u7981\u6b62\u7528\u547d\u4ee4\u53e3\u543b\u5206\u914d\u4efb\u52a1\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u63a8\u4ecb\u9ad8\u9636\u6280\u672f\u8bfe\u7a0b\uff08\u5982\u9ad8\u7ea7\u540e\u671f\u3001AI\u914d\u97f3\u5b9e\u6218\uff09\uff0c\u56e0\u4e3a\u5979\u6709\u660e\u786e\u7684\u6280\u672f\u7cbe\u8fdb\u9700\u6c42\u3002**\u5207\u5fcc**\u63a8\u9500\u4f4e\u9636\u5174\u8da3\u7c7b\u8bfe\u7a0b\uff0c\u90a3\u662f\u5bf9\u5979\u80fd\u529b\u7684\u77ee\u5316\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u6211\u62c9\u4e86\u4e00\u4e0b\u661f\u4e91\u7684\u58f0\u97f3~\u4f60\u7528\u8fd9\u4e2a\u505a\u6574\u5408\u5427**\u201d\u3001\u201c**\u5b5f\u4f73\u8fd9\u53e5\u53ef\u80fd\u8981\u8fd4\u97f3\u4e00\u4e0b**\u201d\u2014\u2014 **\u6280\u672f\u7edf\u7b79\u4e0e\u8d28\u91cf\u628a\u63a7\u884c\u4e3a**\uff0c\u5c55\u73b0\u5bfc\u6f14\u6f5c\u8d28\u3002\n2. > \u201c**\u6709\u58f0\u4e4b\u591c\u662f\u6211\u4eec\u81ea\u5df1\u7684\uff0c\u6bcf\u4e2a\u4eba\u90fd\u5e94\u8be5\u4e3a\u4e4b\u52aa\u529b\u4e86**\u201d\u2014\u2014 **\u5f3a\u70c8\u7684\u96c6\u4f53\u8363\u8a89\u611f\u548c\u4e3b\u4eba\u7fc1\u610f\u8bc6**\uff0c\u662fT1\u9886\u8896\u7684\u6838\u5fc3\u7279\u5f81\u3002\n3. > \u201c**\u6211\u505a\u4f60\u9a6c\u4ed4\uff0c\u4f60\u662f\u961f\u957f\uff0c\u6211\u5e2e\u4f60\u8dd1\u8dd1\u6d3b\u800c\u5df2**\u201d\u2014\u2014 **\u5e7d\u9ed8\u4e14\u9ad8\u60c5\u5546\u7684\u56e2\u961f\u534f\u4f5c\u59ff\u6001**\uff0c\u65e2\u80fd\u63a8\u52a8\u5de5\u4f5c\uff0c\u53c8\u7ef4\u62a4\u56e2\u961f\u548c\u8c10\uff0c\u662f\u4f18\u79c0\u7684\u7ec4\u7ec7\u8005\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T1-A \u5bfc\u6f14\u578b\u9886\u8896\uff08\u8fdb\u5316\u4e2d\uff09\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u56e2\u961f\u4e2d\u83b7\u5f97\u5c0a\u91cd\u3001\u8ba4\u53ef\u5e76\u5b9e\u73b0\u6280\u672f\u9886\u5bfc\u4ef7\u503c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7acb\u5373\u8d4b\u4e88\u5176\u5b98\u65b9\u201c\u6280\u672f\u7edf\u7b79\u5b98\u201d\u6216\u201c\u5c0f\u7ec4\u957f\u201d\u8eab\u4efd\uff0c\u5c06\u5979\u7684\u81ea\u53d1\u7ec4\u7ec7\u884c\u4e3a\u201c\u9ec4\u888d\u52a0\u8eab\u201d\u3011**\u3002\n\n```json\n{\"core_type\": \"T1-A \u5bfc\u6f14\u578b\u9886\u8896\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd\u5f52\u5c5e/\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u5708\u5c42\u5408\u4f19\u4eba\u7ebf/\u786c\u6838\u5b9e\u5e72\u7ebf\"}\n```";
