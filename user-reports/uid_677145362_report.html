    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u4e2d\u9ad8**\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5b66\u4e60\u5174\u8da3\u548c\u884c\u52a8\u529b\uff08\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\u3001\u4e3b\u52a8\u63d0\u95ee\uff09\uff0c\u5bf9\u6709\u58f0\u884c\u4e1a\u6709\u63a2\u7d22\u6b32\u3002\u4f46\u521d\u59cb\u52a8\u673a\u53ef\u80fd\u5305\u542b\u5bf9\u526f\u4e1a\u53d8\u73b0\u7684\u671f\u5f85\uff08\u201c\u5e0c\u671b\u6709\u4e2a\u597d\u7ed3\u679c\u201d\uff09\uff0c\u9700\u5173\u6ce8\u5176\u5b66\u4e60\u52a8\u673a\u4e0e\u53d8\u73b0\u9884\u671f\u7684\u5e73\u8861\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u4e2d**\u3002\u7528\u6237\u4e3a\u5728\u804c\u72b6\u6001\uff08\u201c\u5728\u4e0a\u73ed\u8def\u4e0a\u201d\u3001\u201c\u5728\u4e0a\u73ed\u201d\uff09\uff0c\u8868\u660e\u6709\u7a33\u5b9a\u7684\u65f6\u95f4\u4e0e\u57fa\u7840\u7ecf\u6d4e\u6761\u4ef6\u3002\u4f46\u672a\u63d0\u53ca\u5177\u4f53\u804c\u4e1a\u3001\u6536\u5165\u6c34\u5e73\u3001\u5bb6\u5ead\u652f\u6301\u6216\u53ef\u7528\u4e8e\u5b66\u4e60\u7684\u4e13\u7528\u8bbe\u5907/\u73af\u5883\uff0c\u8d44\u6e90\u7ec6\u8282\u4e0d\u8db3\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u4e2d\u4f4e**\u3002\u7528\u6237\u5b66\u4e60\u6001\u5ea6\u79ef\u6781\u3001\u914d\u5408\u5ea6\u9ad8\uff08\u201c\u4e00\u5207\u542c\u5e08\u59d0\u7684\u201d\uff09\uff0c\u4f46\u591a\u6b21\u6d41\u9732\u51fa**\u4e0d\u81ea\u4fe1**\uff08\u201c\u6ca1\u4fe1\u5fc3\u201d\u3001\u201c\u611f\u89c9\u6709\u70b9\u5403\u529b\u201d\u3001\u201c\u770b\u5230\u5927\u5bb6\u4f18\u79c0\u8d8a\u6765\u8d8a\u6ca1\u4fe1\u5fc3\u201d\uff09\uff0c\u4f9d\u8d56\u5916\u90e8\u9f13\u52b1\u4e0e\u6307\u5bfc\uff0c\u9762\u5bf9\u540c\u4faa\u538b\u529b\u65f6\u6613\u4ea7\u751f\u81ea\u6211\u6000\u7591\uff0c\u6297\u632b\u6298\u80fd\u529b\u5b58\u7591\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u4e8e4\u67088\u65e5\u652f\u4ed82380\u5143\u62a5\u540d\u9ad8\u9636\u73ed\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u6216\u914d\u5076\u7684\u8ba8\u8bba\uff0c\u51b3\u7b56\u4f3c\u4e4e\u4e3a\u7528\u6237\u4e2a\u4eba\u505a\u51fa\u3002\n*   **\u6b65\u9aa41 - \u9700\u6c42\u5f3a\u5ea6**: **B\u7c7b\uff08\u4e2d\u5ea6\u9700\u6c42\uff09**\u3002\u6709\u660e\u786e\u5b66\u4e60\u884c\u4e3a\u4e0e\u6295\u5165\uff0c\u4f46\u521d\u59cb\u4fe1\u5fc3\u4e0d\u8db3\uff0c\u52a8\u673a\u4e2d\u63ba\u6742\u53d8\u73b0\u671f\u5f85\u3002\n*   **\u6b65\u9aa42 - \u652f\u4ed8\u80fd\u529b**: **B\u7c7b\uff08\u4e2d\u5ea6\u652f\u4ed8\u80fd\u529b\uff09**\u3002\u80fd\u652f\u4ed82380\u5143\u8bfe\u7a0b\u8d39\u7528\uff0c\u4e14\u4e3a\u5728\u804c\u4eba\u5458\uff0c\u5177\u5907\u57fa\u7840\u652f\u4ed8\u80fd\u529b\uff0c\u4f46\u672a\u4f53\u73b0\u9ad8\u6d88\u8d39\u6216\u5f3a\u7ecf\u6d4e\u5b9e\u529b\u3002\n*   **\u6b65\u9aa43 - \u51b3\u7b56\u901f\u5ea6**: **A\u7c7b\uff08\u5feb\u901f\u51b3\u7b56\uff09**\u3002\u4ece\u9996\u6b21\u8be2\u95ee\u8d39\u7528\u5230\u5b8c\u6210\u652f\u4ed8\uff0c\u51b3\u7b56\u5468\u671f\u77ed\uff08\u7ea6\u534a\u5929\uff09\uff0c\u5728\u9500\u552e\u8425\u9020\u7684\u7a00\u7f3a\u611f\uff08\u201c\u7248\u6743\u4e66\u201d\u3001\u201c\u4f18\u60e0\u5238\u201d\uff09\u548c\u4e2a\u6027\u5316\u9f13\u52b1\uff08\u201c\u6211\u770b\u597d\u4f60\u201d\uff09\u4e0b\u8fc5\u901f\u6210\u4ea4\u3002\n*   **\u7efc\u5408\u5224\u5b9a**: **A-B\u578b\u7528\u6237**\u3002\u9700\u6c42\u660e\u786e\u4e14\u652f\u4ed8\u884c\u52a8\u5feb\uff0c\u4f46\u652f\u4ed8\u5c42\u7ea7\u4e2d\u7b49\uff0c\u4e14\u5fc3\u7406\u5f39\u6027\u504f\u5f31\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n**T4 \u7126\u8651\u8fdb\u53d6\u8005**\u3002\n*   **\u6838\u5fc3\u7279\u5f81**: \u6709\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b\uff0c\u4f46\u5185\u5728\u4fe1\u5fc3\u4e0d\u8db3\uff0c\u6613\u53d7\u5916\u754c\u8bc4\u4ef7\u5f71\u54cd\uff0c\u6e34\u671b\u901a\u8fc7\u201c\u88ab\u9009\u4e2d\u201d\u548c\u201c\u88ab\u5e26\u9886\u201d\u83b7\u5f97\u5b89\u5168\u611f\u4e0e\u6210\u957f\u786e\u8ba4\u3002\n*   **\u5339\u914d\u4f9d\u636e**: \u79ef\u6781\u5b8c\u6210\u5404\u9879\u4efb\u52a1\uff0c\u670d\u4ece\u5b89\u6392\uff0c\u4f46\u9891\u7e41\u8868\u8fbe\u201c\u7d27\u5f20\u201d\u3001\u201c\u6ca1\u4fe1\u5fc3\u201d\u3001\u201c\u5403\u529b\u201d\uff0c\u9700\u8981\u9500\u552e\u6301\u7eed\u7ed9\u4e88\u201c\u7279\u522b\u5173\u6ce8\u201d\uff08\u201c\u6211\u770b\u597d\u7684\u4eba\u4e0d\u591a\uff0c\u4f60\u662f\u5176\u4e2d\u4e00\u4e2a\u201d\uff09\u548c\u9f13\u52b1\u6765\u7ef4\u6301\u5b66\u4e60\u52a8\u529b\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u6574\u4f53\u98ce\u9669**: **\u4e2d**\u3002\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u9884\u671f\u4e0d\u7b26 (\u4e2d)**: \u9500\u552e\u8fc7\u5ea6\u5f3a\u8c03\u201c\u63a5\u5355\u201d\u3001\u201c\u53d8\u73b0\u201d\u3001\u201c\u8d44\u6e90\u201d\uff0c\u53ef\u80fd\u62ac\u9ad8\u4e86\u7528\u6237\u7684\u77ed\u671f\u6536\u76ca\u9884\u671f\u3002\u7528\u6237\u63d0\u53ca\u201c\u5e0c\u671b\u6709\u4e2a\u597d\u7ed3\u679c\u201d\uff0c\u82e5\u540e\u671f\u53d8\u73b0\u4e0d\u53ca\u9884\u671f\uff0c\u6613\u4ea7\u751f\u843d\u5dee\u3002\n    2.  **\u6548\u679c\u4e0d\u4f73 (\u4e2d)**: \u7528\u6237\u5df2\u81ea\u89c9\u201c\u5403\u529b\u201d\u3001\u201c\u8ddf\u4e0d\u4e0a\u201d\uff0c\u82e5\u6b63\u5f0f\u8bfe\u7a0b\u96be\u5ea6\u9661\u589e\u6216\u8fdb\u6b65\u7f13\u6162\uff0c\u632b\u8d25\u611f\u53ef\u80fd\u52a0\u5267\uff0c\u5f52\u56e0\u4e8e\u8bfe\u7a0b\u65e0\u6548\u3002\n    3.  **\u7ecf\u6d4e\u538b\u529b (\u4f4e)**: \u672a\u63d0\u53ca\u652f\u4ed8\u56f0\u96be\uff0c\u91d1\u989d\u4e3a2380\u5143\uff0c\u5c5e\u4e2d\u7b49\u4ef7\u4f4d\u3002\n    4.  **\u65f6\u95f4\u51b2\u7a81 (\u4e2d)**: \u7528\u6237\u4e3a\u5728\u804c\u72b6\u6001\uff0c\u591a\u6b21\u5728\u4e0a\u73ed\u65f6\u95f4\u6c9f\u901a\uff0c**\u9700\u8b66\u60d5\u5176\u5b66\u4e60\u65f6\u95f4\u4e0e\u5de5\u4f5c\u7684\u53ef\u6301\u7eed\u5e73\u8861**\u3002\n    5.  **\u5bb6\u5ead\u53cd\u5bf9 (\u4fe1\u606f\u4e0d\u8db3)**: \u672a\u63d0\u53ca\u3002\n    6.  **\u9500\u552e\u8bef\u5bfc (\u4e2d)**: \u9500\u552e\u5b58\u5728**\u8fc7\u5ea6\u627f\u8bfa\u503e\u5411**\uff08\u201c\u5e26\u4f60\u5165\u884c\u201d\u3001\u201c\u58f0\u97f3\u5347\u503c\u201d\u3001\u201c\u7a33\u7a33\u7684\u63a5\u5355\u53d8\u73b0\u201d\uff09\uff0c\u5e76\u4f7f\u7528\u4e86\u201c\u9650\u91cf\u201d\u3001\u201c\u73b0\u573a\u6388\u6743\u201d\u7b49\u7a00\u7f3a\u8425\u9500\u8bdd\u672f\u3002\n    7.  **\u670d\u52a1\u4f53\u9a8c (\u4f4e)**: \u76ee\u524d\u9500\u552e\u670d\u52a1\u7ec6\u81f4\uff0c\u7528\u6237\u4f53\u9a8c\u826f\u597d\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u4e3b\u8981\u96f7\u533a**:\n    *   **\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u8bf1\u5bfc**: \u9500\u552e\u591a\u6b21\u4f7f\u7528\u201c\u5e26\u4f60\u5165\u884c\u201d\u3001\u201c\u8ba9\u4f60\u58f0\u97f3\u5347\u503c\u201d\u3001\u201c\u63a5\u5355\u53d8\u73b0\u7a33\u7a33\u7684\u201d\u7b49\u7edd\u5bf9\u5316\u627f\u8bfa\uff0c**\u6a21\u7cca\u4e86\u57f9\u8bad\u4e0e\u5c31\u4e1a\u4fdd\u969c\u7684\u8fb9\u754c**\u3002\n    *   **\u7a00\u7f3a\u6027\u903c\u5355**: \u4f7f\u7528\u201c\u6700\u540e\u4e00\u6b21\u8003\u6838\u201d\u3001\u201c\u73b0\u573a\u53d1\u4f18\u60e0\u5238\u3001\u8d60\u7248\u6743\u4e66\u201d\u3001\u201c\u540d\u989d\u6709\u9650\u201d\u7b49\u8bdd\u672f\u5236\u9020\u7d27\u8feb\u611f\uff0c\u4fc3\u4f7f\u7528\u6237\u5728\u77ed\u65f6\u95f4\u5185\u5b8c\u6210\u652f\u4ed8\u3002\n    *   **\u60c5\u611f\u6346\u7ed1**: \u901a\u8fc7\u201c\u5a18\u5bb6\u4eba\u201d\u3001\u201c\u4e0d\u6562\u8f9c\u8d1f\u201d\u7b49\u8bdd\u672f\u5efa\u7acb\u5f3a\u60c5\u611f\u8054\u7cfb\uff0c\u53ef\u80fd\u5f71\u54cd\u7528\u6237\u7406\u6027\u51b3\u7b56\u3002\n*   **\u5408\u89c4\u60c5\u51b5**: \u9500\u552e\u6d41\u7a0b\u5b8c\u6574\uff0c\u4f46\u5b58\u5728\u660e\u663e\u7684**\u8425\u9500\u8bdd\u672f\u538b\u8fc7\u98ce\u9669\u63d0\u793a**\u7684\u95ee\u9898\uff0c\u672a\u6e05\u6670\u8bf4\u660e\u5b66\u4e60\u6210\u679c\u4e0e\u4e2a\u4eba\u52aa\u529b\u3001\u5929\u8d4b\u3001\u5e02\u573a\u673a\u9047\u7684\u5173\u7cfb\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**: **\u5339\u914d**\u3002\u7528\u6237\u6709\u5b66\u4e60\u610f\u613f\uff0c\u4ea7\u54c1\u80fd\u6ee1\u8db3\u5176\u6280\u80fd\u63d0\u5347\u9700\u6c42\u3002\u4f46\u9700\u7ba1\u7406\u5176\u53d8\u73b0\u9884\u671f\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **\u9996\u5468\u5f3a\u5316\u4fe1\u5fc3\u5e76\u6821\u6b63\u53d8\u73b0\u9884\u671f**\u3002\n*   **\u5177\u4f53\u884c\u52a8\u5efa\u8bae**:\n    1.  **\u9884\u671f\u7ba1\u7406**: \u5728\u9996\u6b21\u6c9f\u901a\u4e2d\uff0c\u660e\u786e\u544a\u77e5\u5b66\u4e60\u66f2\u7ebf\u7684\u957f\u671f\u6027\uff0c\u5f3a\u8c03\u201c\u6280\u80fd\u79ef\u7d2f-\u673a\u4f1a\u83b7\u53d6\u201d\u7684\u8def\u5f84\uff0c\u964d\u4f4e\u5176\u5bf9\u201c\u5feb\u901f\u53d8\u73b0\u201d\u7684\u5e7b\u60f3\u3002\u53ef\u5206\u4eab\u5f80\u671f\u5b66\u5458\u7684**\u771f\u5b9e\u6210\u957f\u6848\u4f8b**\uff08\u5305\u62ec\u74f6\u9888\u671f\uff09\u3002\n    2.  **\u4fe1\u5fc3\u7ef4\u62a4**: \u5ef6\u7eed\u524d\u7aef\u9500\u552e\u7684\u201c\u9f13\u52b1\u201d\u7b56\u7565\uff0c\u4f46\u66f4\u4fa7\u91cd\u4e8e**\u5177\u4f53\u8fdb\u6b65\u70b9\u7684\u53cd\u9988**\uff08\u5982\u201c\u8fd9\u6bb5\u7684\u60c5\u7eea\u6bd4\u4e0a\u6b21\u9971\u6ee1\u201d\uff09\uff0c\u800c\u975e\u7a7a\u6cdb\u8868\u626c\u3002\u5efa\u7acb\u201c\u5c0f\u6b65\u5feb\u8dd1\u201d\u7684\u6210\u5c31\u611f\u4f53\u7cfb\u3002\n    3.  **\u65f6\u95f4\u89c4\u5212**: \u4e3b\u52a8\u8be2\u95ee\u5176\u5de5\u4f5c\u8282\u594f\uff0c\u534f\u52a9\u5236\u5b9a**\u53ef\u884c\u7684\u3001\u5f39\u6027\u7684\u5b66\u4e60\u8ba1\u5212**\uff0c\u9884\u9632\u56e0\u65f6\u95f4\u51b2\u7a81\u5bfc\u81f4\u7684\u79ef\u538b\u548c\u7126\u8651\u3002\n    4.  **\u98ce\u9669\u9694\u79bb**: \u907f\u514d\u6cbf\u7528\u524d\u7aef\u201c\u8d44\u6e90\u65e0\u9650\u201d\u3001\u201c\u5305\u63a5\u5355\u201d\u7684\u8bdd\u672f\u3002\u5c06\u652f\u6301\u5b9a\u4f4d\u4e3a\u201c\u63d0\u4f9b\u65b9\u6cd5\u3001\u5e73\u53f0\u548c\u7ec3\u4e60\u673a\u4f1a\u201d\uff0c\u7ed3\u679c\u53d6\u51b3\u4e8e\u4e2a\u4eba\u7ec3\u4e60\u4e0e\u5e02\u573a\u9002\u914d\u3002\n    5.  **\u6301\u7eed\u5173\u6ce8**: \u5bc6\u5207\u89c2\u5bdf\u5176\u8fdb\u5165\u6b63\u5f0f\u8bfe\u7a0b\u540e\u7684\u4f5c\u4e1a\u5b8c\u6210\u60c5\u51b5\u548c\u60c5\u7eea\u53cd\u9988\uff0c**\u524d\u4e24\u5468\u662f\u5173\u952e\u5e72\u9884\u671f**\u3002\n\n{\"core_type\": \"T4 \u7126\u8651\u8fdb\u53d6\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u9996\u5468\u6821\u6b63\u53d8\u73b0\u9884\u671f\u5e76\u5f3a\u5316\u4fe1\u5fc3\"}";
