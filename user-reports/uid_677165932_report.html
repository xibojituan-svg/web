    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677165932\u7684\u7528\u6237\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID 677165932 / \ud83c\udf4a\u6c90\u6c90\u10e6\u6cfd\u14a2\u1dbb |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e-\u7490\u5996\u6709\u58f05(\u5f90\u7490) / \u73ed\u4e3b\u4efb-\u5b89\u7ae5\u58f0(\u5218\u7d20\u82f1) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u9a6c\u62c9\u96c5\u6500\u767b\u8ba1\u5212\u7cbe\u82f1\u7248\uff08\u4ef7\u683c\uff1a4380\u5143\uff0c\u4f7f\u7528400\u5143\u4f18\u60e0\u5238\u540e\u652f\u4ed83980\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u7528\u5361\u5468\u8f6c / \u88ab\u8feb\u5206\u671f**\uff08\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u73b0\u5728\u4ed8\u4e0d\u4e86\u90a3\u4e48\u591a\u201d\u3001\u201c\u6211\u8fd9\u91cc\u5f97\u5bfc\u4e00\u4e0b\u91d1\u989d\u201d\uff0c\u8868\u660e\u8d44\u91d1\u975e\u4e00\u6b21\u6027\u5145\u88d5\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u7528\u6237\u56e0\u201c\u5728\u5916\u5730\u201d\u9519\u8fc7\u76f4\u64ad\uff0c\u9700\u8865\u56de\u653e\uff0c\u663e\u793a\u65f6\u95f4\u4e0d\u56fa\u5b9a\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\uff08\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u6709\u660e\u786e\u7684\u5b66\u4e60\u89c4\u5212\u3001\u53d8\u73b0\u76ee\u6807\u3001\u652f\u4ed8\u884c\u4e3a\u53ca\u540e\u7eed\u4e92\u52a8\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34(\u4e2d)**\u3002\u7528\u6237\u6709\u660e\u786e\u7684\u517c\u804c\u53d8\u73b0\u8bc9\u6c42\uff08\u201c\u8feb\u5207\u7684\u60f3\u591a\u4e00\u7b14\u6536\u5165\u201d\uff09\uff0c\u5e76\u89c4\u5212\u4e86\u201c\u517c\u804c\u505a\u753b\u672c\uff0c\u540e\u9762\u5728\u5b66\u5b66\u540e\u671f\u201d\u7684\u8def\u5f84\u3002\u4f46\u540c\u65f6\u4e5f\u8868\u73b0\u51fa\u5bf9\u5b66\u4e60\u6d41\u7a0b\u7684\u914d\u5408\uff08\u8865\u8bfe\u3001\u4ea4\u4f5c\u4e1a\uff09\uff0c\u52a8\u673a\u4e2d\u6df7\u6742\u4e86\u5174\u8da3\u63a2\u7d22\u4e0e\u53d8\u73b0\u671f\u5f85\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u8fd9\u4e24\u5929\u542c\u8bfe\uff0c\u60f3\u5728\u517c\u804c\u505a\u505a\u753b\u672c\uff0c\u540e\u9762\u5728\u5b66\u5b66\u540e\u671f\u201d > \u201c\u5c31\u662f\u8feb\u5207\u7684\u60f3\u591a\u4e00\u7b14\u6536\u5165\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u652f\u4ed83980\u5143\u8bfe\u7a0b\u8d39\uff0c\u4f46\u652f\u4ed8\u8fc7\u7a0b\u6709\u5ef6\u8fdf\uff08\u201c\u5bfc\u4e00\u4e0b\u91d1\u989d\u201d\uff09\uff0c\u975e\u4e00\u6b21\u6027\u5145\u88d5\u652f\u4ed8\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u5b8c\u6210\u4f5c\u4e1a\u548c\u8865\u8bfe\uff0c\u4f46\u4f1a\u56e0\u201c\u5728\u5916\u5730\u201d\u9519\u8fc7\u76f4\u64ad\uff0c\u65f6\u95f4\u5448\u788e\u7247\u5316\u72b6\u6001\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u672a\u77e5** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff0c\u65e0\u6cd5\u5224\u65ad\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u9519\u8fc7\u76f4\u64ad\u3001\u652f\u4ed8\u64cd\u4f5c\u7b49\u5c0f\u632b\u6298\uff0c\u7528\u6237\u53cd\u5e94\u5e73\u9759\uff08\u201c\u597d\u54d2\u201d\u3001\u201c\u8c22\u8c22\u5e08\u59d0\u201d\uff09\uff0c\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff08\u201c\u80fd\u7ed9\u5b89\u6392\u8fc7\u4e24\u5929\u7684\u65f6\u95f4\u5417\uff1f\u201d\u3001\u201c\u6211\u660e\u5929\u56de\u53bb\u5c31\u770b\u201d\uff09\uff0c\u65e0\u4efb\u4f55\u60c5\u7eea\u5316\u6216\u81ea\u6211\u5426\u5b9a\u7684\u8a00\u8bba\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u660e\u5929\u7684\u76f4\u64ad\u8bfe\uff0c\u6211\u8981\u662f\u6ca1\u6709\u65f6\u95f4\u542c\uff0c\u540e\u5929\u8fd8\u6709\u673a\u4f1a\u5417\uff1f\u201d > \u201c\u542c\u5b8c\u6211\u5c31\u5199\u4f5c\u4e1a\u201d > \u201c\u6211\u7ee7\u7eed\u5b66\u4e60\u6628\u5929\u76f4\u64ad\u8bfe\u7a0b\u5566\uff0c\u6709\u4e8b\u7559\u8a00\u5427[\u6109\u5feb]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u73b0\u6709\u6536\u5165\u7684\u4e0d\u5b89\u5168\u611f\u4e0e\u7126\u8651\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u4e86\u201c\u8feb\u5207\u7684\u60f3\u591a\u4e00\u7b14\u6536\u5165\u201d\uff0c\u5e76\u5df2\u5f00\u59cb\u4e0e\u670b\u53cb\u5408\u4f19\u521b\u4e1a\uff0c\u663e\u793a\u51fa\u5bf9\u7ecf\u6d4e\u72b6\u51b5\u6539\u5584\u7684\u5f3a\u70c8\u6e34\u671b\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u8def\u5f84\u6e05\u6670\u7684\u5b89\u5168\u611f\u4e0e\u786e\u5b9a\u6027**\u3002\u4e3a\u4ed6\u63d0\u4f9b\u4e00\u6761\u770b\u5f97\u89c1\u3001\u6478\u5f97\u7740\u3001\u53ef\u6267\u884c\u7684\u517c\u804c\u53d8\u73b0\u8def\u5f84\uff0c\u7528\u201c\u753b\u672c-\u540e\u671f\u201d\u7684\u660e\u786e\u89c4\u5212\u6765\u5bf9\u51b2\u5176\u7ecf\u6d4e\u7126\u8651\uff0c\u800c\u975e\u7a7a\u6cdb\u7684\u9f13\u52b1\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u52a8\u673a\u4e2d\u7b49\u4f46\u7a33\u5b9a\uff0c\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u6267\u884c\u529b\u5f3a\uff0c\u662f\u73ed\u7ea7\u7684\u7a33\u5b9a\u57fa\u77f3) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n**\u3010\u5224\u5b9a\u6811\u63a8\u6f14\u3011**\uff1a\n1.  **\u652f\u4ed8\u6838\u67e5**\uff1a\u7528\u6237\u652f\u4ed8\u6709\u5ef6\u8fdf\uff08\u201c\u5bfc\u4e00\u4e0b\u91d1\u989d\u201d\uff09\uff0c\u4f46\u672a\u63d0\u53ca\u501f\u8d37\uff0c\u4e0d\u89e6\u53d1C2\u98ce\u9669\u62e6\u622a\u3002\n2.  **\u4e09\u8f74\u8bc4\u5206**\uff1a\u52a8\u673a\u7eaf\u5ea6(5-6\u5206)\u3001\u8d44\u6e90\u5e95\u5ea7(5-6\u5206)\u3001\u5fc3\u7406\u5f39\u6027(7-8\u5206)\u3002\n3.  **\u5224\u5b9a\u6811\u5339\u914d**\uff1a\u52a8\u673a\u22655\u5206\uff0c\u5f39\u6027\u22657\u5206\uff0c\u8fdb\u5165\u201c\u9ad8\u5f39\u6027\u901a\u9053\u201d\u3002\u7528\u6237\u672a\u8868\u73b0\u51fa\u4e3b\u52a8\u7edf\u7b79\u884c\u4e3a\u6216\u6df1\u5ea6\u6280\u672f\u8ffd\u95ee\uff0c\u4f46\u4f5c\u4e1a\u63d0\u4ea4\u7a33\u5b9a\u3001\u914d\u5408\u5ea6\u9ad8\u3001\u60c5\u7eea\u7a33\u5b9a\u3002\u7b26\u5408\u201c\u4ee5\u4e0a\u5747\u672a\u547d\u4e2d\u7684\u9ad8\u52a8\u673a\u3001\u9ad8\u5f39\u6027\u7528\u6237 \u2192 \u9ed8\u8ba4\u5f52\u7c7b\u4e3aT2\u4f4e\u8c03\u8001\u9ec4\u725b\u201d\u3002\n4.  **\u539f\u578b\u5339\u914d**\uff1aT2\u4f4e\u8c03\u8001\u9ec4\u725b\u3002\u7528\u6237\u8868\u73b0\u51fa\u201c\u95f7\u58f0\u5e72\u786c\u6838\u6d3b\u6c42\u80af\u5b9a\u201d\u7684\u7279\u8d28\uff1a\u6309\u65f6\u8865\u8bfe\u3001\u4ea4\u4f5c\u4e1a\u3001\u89c4\u5212\u5b66\u4e60\u8def\u5f84\uff0c\u4e0d\u5f20\u626c\u4f46\u6267\u884c\u529b\u5f3a\u3002\n5.  **ABCD\u6620\u5c04**\uff1aT2\u5bf9\u5e94**B\u7c7b**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u7528\u6237\u6709\u72ec\u7acb\u652f\u4ed8\u548c\u89c4\u5212\u80fd\u529b\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u7528\u6237\u65f6\u95f4\u788e\u7247\u5316\uff0c\u82e5\u8bfe\u7a0b\u8282\u594f\u7d27\u51d1\u3001\u4f5c\u4e1a\u91cf\u5927\uff0c\u53ef\u80fd\u56e0\u201c\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\u201d\u800c\u4ea7\u751f\u7d2f\u79ef\u7126\u8651\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u4e8b\u4e3b\u52a8\u6c9f\u901a\u89e3\u51b3\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u632b\u6298\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u7528\u6237\u5bf9\u201c\u517c\u804c\u6536\u5165\u201d\u6709\u8feb\u5207\u671f\u5f85\u3002\u82e5\u5728\u627f\u8bfa\u5468\u671f\u5185\uff08\u59822-3\u4e2a\u6708\uff09\u672a\u83b7\u5f97\u4efb\u4f55\u5b9e\u8d28\u6027\u7684\u63a5\u5355\u673a\u4f1a\u6216\u5fae\u5c0f\u6536\u76ca\uff0c\u53ef\u80fd\u56e0\u9884\u671f\u672a\u8fbe\u800c\u52a8\u6447\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c4-6\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u5b66\u4e60\u96be\u5ea6\u589e\u52a0\uff0c\u82e5\u4ecd\u672a\u770b\u5230\u4efb\u4f55\u53d8\u73b0\u5e0c\u671b\uff0c\u4e14\u65f6\u95f4\u538b\u529b\u4e0e\u5b66\u4e60\u4efb\u52a1\u51b2\u7a81\uff0c\u9000\u8d39\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6c90\u6c90\uff0c\u770b\u5230\u4f60\u5bf9\u81ea\u5df1\u2018\u753b\u672c-\u540e\u671f\u2019\u7684\u5b66\u4e60\u8def\u5f84\u89c4\u5212\u5f97\u5f88\u6e05\u6670\uff0c\u6267\u884c\u529b\u4e5f\u5f88\u5f3a\uff0c\u8fd9\u975e\u5e38\u68d2\uff01\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u7a0b\u5c31\u662f\u4e3a\u4f60\u8fd9\u6837\u6709\u660e\u786e\u76ee\u6807\u3001\u613f\u610f\u8e0f\u5b9e\u884c\u52a8\u7684\u540c\u5b66\u8bbe\u8ba1\u7684\u3002\u524d\u671f\u6253\u597d\u57fa\u7840\uff0c\u6211\u4f1a\u5e2e\u4f60\u7559\u610f\u9002\u5408\u65b0\u624b\u8bd5\u6c34\u7684\u753b\u672c\u8d44\u6e90\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u628a\u2018\u591a\u4e00\u7b14\u6536\u5165\u2019\u8fd9\u4e2a\u76ee\u6807\u7a33\u7a33\u5b9e\u73b0\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176\u52a1\u5b9e\u3001\u7a33\u5b9a\u7684\u7279\u8d28\uff0c\u63d0\u4f9b\u6e05\u6670\u7684\u6280\u80fd\u8fdb\u9636\u8def\u5f84\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\u7684\u7279\u70b9\uff0c\u8865\u5145**\u3010\u5f39\u6027\u5b66\u4e60\u652f\u6301\u5305\u3011**\uff08\u5982\u91cd\u70b9\u5f55\u64ad\u8bfe\u6807\u8bb0\u3001\u4f5c\u4e1a\u63d0\u4ea4\u65f6\u95f4\u5f39\u6027\u7a97\u53e3\uff09\u3002\u9488\u5bf9\u5176\u53d8\u73b0\u8bc9\u6c42\uff0c\u5728\u9002\u5f53\u65f6\u673a\u5f15\u5165**\u3010\u65b0\u624b\u6d3e\u5355\u5b9e\u6218\u5305\u3011**\uff08B\u6a21\u5757\uff09\uff0c\u7528\u771f\u5b9e\u7684\u5c0f\u989d\u3001\u4f4e\u96be\u5ea6\u8bd5\u97f3\u5355\u5efa\u7acb\u5176\u521d\u671f\u4fe1\u5fc3\u548c\u6b63\u53cd\u9988\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u51e0\u5929\u66b4\u5bcc\u201d\u7684\u8bdd\u672f\u8fc7\u5ea6\u523a\u6fc0\u5176\u53d8\u73b0\u7126\u8651\uff1b\u56e0\u5176\u60c5\u7eea\u7a33\u5b9a\u800c\u5ffd\u89c6\u5176\u65f6\u95f4\u788e\u7247\u5316\u7684\u56f0\u96be\uff0c\u7528\u50f5\u5316\u7684\u8003\u52e4\u5236\u5ea6\u65bd\u538b\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u9700\u5efa\u7acb\u5728\u624e\u5b9e\u7684\u6210\u679c\u57fa\u7840\u4e0a**\u3002\u5f53\u5176\u5b8c\u6210\u57fa\u7840\u8bfe\u7a0b\u5e76\u6210\u529f\u63a5\u52301-2\u5355\u540e\uff0c\u53ef\u987a\u52bf\u63a8\u8350\u540e\u671f\u5236\u4f5c\u3001\u8bbe\u5907\u5347\u7ea7\u7b49\u9ad8\u9636\u8bfe\u7a0b\u6216\u670d\u52a1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5c31\u662f\u8feb\u5207\u7684\u60f3\u591a\u4e00\u7b14\u6536\u5165\u201d **(\u6838\u5fc3\u52a8\u673a\uff1a\u5b89\u5168\u9700\u6c42)**\n2. > \u201c\u6211\u8fd9\u4e24\u5929\u542c\u8bfe\uff0c\u60f3\u5728\u517c\u804c\u505a\u505a\u753b\u672c\uff0c\u540e\u9762\u5728\u5b66\u5b66\u540e\u671f\u201d **(\u89c4\u5212\u6027\u4e0e\u6267\u884c\u529b)**\n3. > \u201c\u660e\u5929\u7684\u76f4\u64ad\u8bfe\uff0c\u6211\u8981\u662f\u6ca1\u6709\u65f6\u95f4\u542c\uff0c\u540e\u5929\u8fd8\u6709\u673a\u4f1a\u5417\uff1f\u201d **(\u9ad8\u5f39\u6027\uff1a\u9047\u4e8b\u4e3b\u52a8\u6c9f\u901a\u89e3\u51b3\uff0c\u800c\u975e\u62b1\u6028\u6216\u653e\u5f03)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e00\u4efd\u53ef\u9760\u7684\u517c\u804c\u6536\u5165\u4ee5\u4fdd\u969c\u7ecf\u6d4e\u5b89\u5168\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u6267\u884c\u7684\u53d8\u73b0\u8def\u5f84\uff0c\u5e76\u7ed9\u4e88\u5176\u65f6\u95f4\u5b89\u6392\u4e0a\u7684\u5f39\u6027\u652f\u6301\uff0c\u7528\u65e9\u671f\u5c0f\u989d\u6b63\u53cd\u9988\u7a33\u4f4f\u5176\u4fe1\u5fc3\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5f39\u6027\u5b66\u4e60\u652f\u6301\u5305\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u5973\", \"city\": \"\u77f3\u5bb6\u5e84\"}\n```";
