    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u674e\u541b (UID: 676233623 / \u6635\u79f0\uff1a\u7b11\u7b11\u6458\u68c9\u82b1) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-01 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u590f\u96e8\u9999\u9999(\u738b\u5448\u65b9) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u64ad\u6709\u58f0\u4e66\u6f14\u64ad\u8bfe\u7a0b + \u97f3\u526aAI\u5236\u4f5c\u5de5\u5177\u5145\u503c\u5305 (929\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u7528\u5361\u5468\u8f6c / \u88ab\u8feb\u5206\u671f** (\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u6700\u8fd1\u592a\u7a77\u4e86\u201d\uff0c\u4f46\u4ecd\u5728\u9500\u552e\u5f15\u5bfc\u4e0b\u9009\u62e9\u4e86929\u5143\u5957\u9910\uff0c\u5b58\u5728\u8d44\u91d1\u538b\u529b) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u767d\u5929\u4e0a\u73ed\uff0c\u665a\u4e0a\u9700\u7167\u987e\u5c0f\u5b69\uff0c\u5f55\u97f3\u9700\u7b49\u5b69\u5b50\u4e0d\u95f9\u65f6) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3** (\u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\uff0c\u4f46\u5b58\u5728\u5bb6\u5ead\u8d23\u4efb) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u6709\u660e\u786e\u7684\u53d8\u73b0\u610f\u56fe\uff08\u8be2\u95eeAI\u4e66\u5236\u4f5c\u6210\u672c\u4e0e\u6536\u76ca\uff09\uff0c\u4f46\u540c\u65f6\u4e5f\u8868\u73b0\u51fa\u5bf9\u6280\u80fd\u5b66\u4e60\uff08\u7ec3\u65e9\u529f\u3001\u542c\u5c0f\u7076\u8bfe\u3001\u63d0\u4ea4\u4f5c\u4e1a\uff09\u7684\u6295\u5165\u548c\u5174\u8da3\uff0c\u5e76\u975e\u7eaf\u7cb9\u8ffd\u6c42\u6781\u901f\u53d8\u73b0\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u5145\u503c\u662f\u5148\u505aAI\u4e66\u7684\u201d > \u201c\u5982\u679c\u505a3\u672cAI\u4e66\uff0c\u662f\u4e0d\u662f\u5c31\u9700\u8981929\u8fd9\u4e2a\u5957\u9910\u4e86\uff1f\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u660e\u786e\u8868\u793a\u201c\u6700\u8fd1\u592a\u7a77\u4e86\u201d\uff0c\u5728\u9500\u552e\u63a8\u8350\u4e0b\u4ecd\u9009\u62e9929\u5143\u5957\u9910\uff0c\u5b58\u5728\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e** \u2014 \u767d\u5929\u9700\u4e0a\u73ed\uff0c\u665a\u4e0a\u9700\u7167\u987e\u5c0f\u5b69\uff08\u201c\u6211\u5bb6\u5c0f\u5b69\uff0c\u6211\u4e00\u6234\u4e0a\u8033\u673a\u5c31\u8981\u51fa\u6765\u4f5c\u5996\u201d\uff09\uff0c\u5f55\u97f3\u73af\u5883\u53d7\u9650\uff0c\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\uff0c\u4f46\u5bb6\u5ead\u8d23\u4efb\uff08\u80b2\u513f\uff09\u5df2\u6784\u6210\u65f6\u95f4\u7cbe\u529b\u4e0a\u7684\u5ba2\u89c2\u9650\u5236\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u9700\u95f4\u6b47\u6027\u5b89\u629a\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u5982\u97f3\u526a\u64cd\u4f5c\uff09\u4f1a\u4e3b\u52a8\u6c42\u52a9\uff0c\u88ab\u62d2\u7edd\u540e\u80fd\u63a5\u53d7\u89c4\u5219\uff08\u201c\u54e6\uff0c\u5fd8\u4e86\uff0c\u62b1\u6b49\u201d\uff09\u3002\u4f46\u5b58\u5728\u56e0\u5bb6\u5ead/\u5de5\u4f5c\u5e72\u6270\u5bfc\u81f4\u7684\u201c\u6df7\u4e71\u201d\u548c\u201c\u6293\u72c2\u201d\u60c5\u7eea\uff0c\u9700\u8981\u5916\u90e8\u5f15\u5bfc\u548c\u786e\u8ba4\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u672c\u6765\u6211\u516c\u53f8\u662f\u5468\u56db\u503c\u73ed\u7684\uff0c\u7ed3\u679c\u6392\u73ed\u88ab\u6362\u4e86\uff0c\u641e\u5f97\u6211\u90fd\u6df7\u4e71\u4e86[\u6293\u72c2]\u201d > \u201c\u6211\u5dee\u70b9\u8981\u57ab\u5e95\u4e86[\u64e6\u6c57]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u7ecf\u6d4e\u538b\u529b\u4e0e\u804c\u4e1a\u53d1\u5c55\u7126\u8651**\u3002\u5728\u201c\u592a\u7a77\u201d\u7684\u72b6\u6001\u4e0b\u4ecd\u613f\u610f\u4e3a\u6280\u80fd\u6295\u8d44\uff0c\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u5e0c\u671b\u901a\u8fc7\u526f\u4e1a\u6280\u80fd\uff08\u6709\u58f0\u4e66/AI\u4e66\uff09\u83b7\u5f97\u989d\u5916\u6536\u5165\uff0c\u7f13\u89e3\u7ecf\u6d4e\u4e0d\u5b89\u5168\u611f\uff0c\u5bfb\u6c42\u4e00\u4efd\u7a33\u5b9a\u7684\u4fdd\u969c\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u4e0e\u8fdb\u5ea6\u638c\u63a7\u611f**\u3002\u4ed6\u9700\u8981\u6e05\u6670\u7684\u8def\u5f84\uff08\u201c\u8d70\u6700\u77ed\u7684\u76f4\u7ebf\u9053\u8def\u201d\uff09\u3001\u53ef\u91cf\u5316\u7684\u6295\u5165\u4ea7\u51fa\u6bd4\uff08\u8ba1\u7b97AI\u4e66\u6210\u672c\uff09\uff0c\u4ee5\u53ca\u5bf9\u4ed6\u56e0\u5bb6\u5ead\u3001\u5de5\u4f5c\u5bfc\u81f4\u5b66\u4e60\u8fdb\u5ea6\u6ce2\u52a8\u7684\u7406\u89e3\u4e0e\u5305\u5bb9\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1** \u7c7b (\u52a8\u673a\u4e2d\u7b49\u4f46\u8d44\u6e90\u5e95\u5ea7\u5b58\u5728\u660e\u663e\u77ed\u677f\uff0c\u9700\u91cd\u70b9\u6276\u6301\u4e0e\u98ce\u9669\u76d1\u63a7) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u578b** (\u6838\u5fc3\u8bc9\u6c42\u662f\u660e\u786e\u7684\u6295\u5165\u4ea7\u51fa\u6bd4\u548c\u53d8\u73b0\u8def\u5f84\uff0c\u5bf9\u201c\u591a\u4e45\u80fd\u8d5a\u94b1\u201d\u654f\u611f\uff0c\u4f46\u5c1a\u5b58\u5b66\u4e60\u610f\u613f) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u867d\u8d44\u91d1\u7d27\u5f20\uff0c\u4f46\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5c5e\u6781\u7aef\u53cd\u5bf9\u8ff9\u8c61)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a/\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4e2d | \u82e5\u5bb6\u4eba\u53d1\u73b0\u5176\u7528\u201c\u592a\u7a77\u201d\u72b6\u6001\u4e0b\u7684\u94b1\u6295\u8d44\u526f\u4e1a\u4e14\u77ed\u671f\u672a\u89c1\u6536\u76ca\uff0c\u53ef\u80fd\u5f15\u53d1\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u65f6\u95f4\u7cbe\u529b\u4e25\u91cd\u788e\u7247\u5316**\uff0c\u5de5\u4f5c\u3001\u80b2\u513f\u53cc\u91cd\u6324\u538b\uff0c\u6781\u6613\u56e0\u65e0\u6cd5\u6309\u65f6\u8ddf\u8bfe\u3001\u505a\u4f5c\u4e1a\u800c\u4ea7\u751f\u7d2f\u79ef\u6027\u632b\u8d25\u548c\u81ea\u8d23\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u60c5\u7eea\u76f8\u5bf9\u7a33\u5b9a\uff0c\u80fd\u63a5\u53d7\u89c4\u5219\uff0c\u6c42\u52a9\u540e\u80fd\u7ee7\u7eed\u5c1d\u8bd5\uff0c\u975e\u73bb\u7483\u5fc3\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | **\u5178\u578bT4\u98ce\u9669**\u3002\u82e5AI\u4e66\u5236\u4f5c\u4e0a\u67b6\u540e\uff0c\u77ed\u671f\u5185\uff08\u59821-2\u4e2a\u6708\uff09\u672a\u83b7\u5f97\u9884\u671f\u6d41\u91cf\u6216\u6536\u76ca\uff0c\u6781\u6613\u56e0\u201c\u6295\u5165929\u5143\u5374\u65e0\u56de\u62a5\u201d\u800c\u4ea7\u751f\u5f3a\u70c8\u843d\u5dee\u611f\u548c\u88ab\u6b3a\u9a97\u611f\uff0c\u8fdb\u800c\u8981\u6c42\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c4-6\u5468\uff08\u6b7b\u4ea1\u8c37\uff09**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u4f5c\u4e1a\u96be\u5ea6\u548c\u5b9e\u64cd\u538b\u529b\u589e\u5927\uff0c\u540c\u65f6\u82e5\u7b2c\u4e00\u6ce2AI\u4e66\u4e0a\u7ebf\u540e\u6570\u636e\u60e8\u6de1\uff0c\u5c06\u6784\u6210\u201c\u65f6\u95f4\u6295\u5165\u65e0\u679c+\u91d1\u94b1\u6295\u5165\u65e0\u679c\u201d\u7684\u53cc\u91cd\u6253\u51fb\uff0c\u9000\u8d39\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u674e\u541b\u540c\u5b66\uff0c\u770b\u5230\u4f60\u53c8\u8981\u5de5\u4f5c\u53c8\u8981\u5e26\u5a03\u8fd8\u8fd9\u4e48\u8ba4\u771f\u5b66\uff0c\u771f\u7684\u5f88\u4f69\u670d\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\uff0c**\u4e0d\u62fc\u901f\u5ea6\u62fc\u6301\u7eed**\uff0c\u4f60\u7684\u60c5\u51b5\u6211\u7279\u522b\u7406\u89e3\u3002\u4ee5\u540e\u4f5c\u4e1a\u8d76\u4e0d\u4e0a\u522b\u7126\u8651\uff0c\u79c1\u4fe1\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u8c03\u6574\u8ba1\u5212\u3002\u4f60\u7684\u76ee\u6807\u5f88\u660e\u786e\uff08\u505aAI\u4e66\u53d8\u73b0\uff09\uff0c\u6211\u4f1a\u91cd\u70b9\u5e2e\u4f60\u76ef\u7740\u8fd9\u6761\u6700\u77ed\u7684\u8def\u5f84\u8d70\uff0c\u907f\u514d\u7ed5\u8fdc\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5feb\u901f\u63a5\u5355\u7ebf**\u3011\u3002\u5fc5\u987b\u4f18\u5148\u6ee1\u8db3\u5176\u53d8\u73b0\u8bc9\u6c42\uff0c\u96c6\u4e2d\u8d44\u6e90\u6307\u5bfc\u5176\u5b8c\u6210\u7b2c\u4e00\u672cAI\u4e66\u7684\u4e0a\u67b6\u4e0e\u57fa\u7840\u8fd0\u8425\uff0c\u54ea\u6015\u6536\u76ca\u5fae\u8584\uff0c\u4e5f\u8981\u5c3d\u5feb\u8ba9\u5176\u770b\u5230\u201c\u95ed\u73af\u201d\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010**\u7075\u6d3b\u5b66\u4e60\u652f\u6301\u5305**\u3011\uff08\u5982\uff1a\u63d0\u4f9b\u91cd\u70b9\u5f55\u64ad\u8bfe\u7247\u6bb5\u3001\u5141\u8bb8\u5ef6\u671f\u4ea4\u4f5c\u4e1a\u3001\u9519\u5cf0\u7b54\u7591\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u5176\u753b\u957f\u671f\u5927\u997c**\u3002\u907f\u514d\u8c08\u8bba\u201c\u6210\u4e3a\u767e\u4e07\u58f0\u4f18\u201d\u7b49\u9065\u8fdc\u613f\u666f\uff0c\u6240\u6709\u6c9f\u901a\u56f4\u7ed5\u201c\u4e0b\u4e00\u6b65\u80fd\u505a\u4ec0\u4e48\u6765\u63a5\u8fd1\u53d8\u73b0\u201d\u3002\n    2. **\u7edd\u4e0d\u5728\u5176\u62b1\u6028\u65f6\u95f4\u4e0d\u591f\u65f6\u65bd\u538b**\u3002\u7981\u6b62\u4f7f\u7528\u201c\u522b\u4eba\u90fd\u80fd\u5b8c\u6210\u4f60\u4e3a\u4ec0\u4e48\u4e0d\u884c\u201d\u7684\u8bdd\u672f\u3002\n    3. **\u7edd\u4e0d\u63a8\u8350\u66f4\u9ad8\u9636\u6216\u66f4\u6602\u8d35\u7684\u8bfe\u7a0b/\u670d\u52a1**\u3002\u5728929\u5143\u6295\u5165\u672a\u89c1\u660e\u786e\u56de\u62a5\u524d\uff0c\u4efb\u4f55\u5347\u5355\u5c1d\u8bd5\u90fd\u662f\u5f15\u7206\u70b9\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5f53\u524d\u9636\u6bb5\u4efb\u4f55\u9644\u52a0\u6d88\u8d39\u5efa\u8bae\u90fd\u4f1a\u52a0\u5267\u5176\u7ecf\u6d4e\u7126\u8651\u548c\u4e0d\u4fe1\u4efb\u611f\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6700\u8fd1\u592a\u7a77\u4e86[\u82e6\u6da9]\u201d \n2. > \u201c\u6211\u5bb6\u5c0f\u5b69\uff0c\u6211\u4e00\u6234\u4e0a\u8033\u673a\u5c31\u8981\u51fa\u6765\u4f5c\u5996[\u88c2\u5f00][\u88c2\u5f00]\u201d\n3. > \u201c\u5982\u679c\u505a3\u672cAI\u4e66\uff0c\u662f\u4e0d\u662f\u5c31\u9700\u8981929\u8fd9\u4e2a\u5957\u9910\u4e86\uff1f\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4\u641e\u94b1\u7ed3\u679c\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\uff08\u7ecf\u6d4e\u4fdd\u969c\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5728\u5176\u201c\u6b7b\u4ea1\u8c37\u201d\u9636\u6bb5\uff08\u7b2c4-6\u5468\uff09\u63d0\u4f9b\u6781\u5f3a\u7684\u786e\u5b9a\u6027\u548c\u5fae\u5c0f\u6b63\u53cd\u9988\uff0c\u4e25\u9632\u6536\u76ca\u843d\u5dee\u3011\u3002**\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u578b\", \"maslow_need\": \"\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\", \"risk_level\": \"\u9ad8\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf\"}\n```";
