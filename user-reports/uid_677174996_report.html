    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49)**\n    *   **\u8868\u5c42\u52a8\u673a**\uff1a\u83b7\u53d6AI\u77ed\u89c6\u9891\u6280\u80fd\uff0c\u63a2\u7d22\u526f\u4e1a/\u5168\u804c\u53d8\u73b0\u53ef\u80fd\uff08\u5546\u5355\u3001\u8d26\u53f7\u3001\u77ed\u5267\uff09\u3002\n    *   **\u6df1\u5c42\u52a8\u673a**\uff1a**\u804c\u4e1a\u8f6c\u578b/\u8fc7\u6e21\u9700\u6c42**\uff08\u4ece\u5efa\u7b51\u884c\u4e1a\u8f6c\u5411\u81ea\u7531\u804c\u4e1a\uff0c\u5bfb\u6c42\u65b0\u6280\u80fd\u652f\u6491\uff09\u3002\u5bf9\u201c\u5de5\u4f5c\u5ba4\u201d\u3001\u201c\u5185\u90e8\u8d44\u6e90\u201d\u3001\u201c\u63a5\u5355\u6e20\u9053\u201d\u7b49\u793e\u7fa4\u548c\u8d44\u6e90\u627f\u8bfa\u8868\u73b0\u51fa\u5174\u8da3\u3002\n    *   **\u98ce\u9669\u4fe1\u53f7**\uff1a\u52a8\u673a\u504f\u5411\u201c\u673a\u4f1a\u63a2\u7d22\u201d\u800c\u975e\u201c\u95ee\u9898\u89e3\u51b3\u201d\uff0c\u5bf9\u201c\u575a\u6301\u201d\u6709\u7591\u8651\uff08\u201c\u5982\u679c\u80fd\u575a\u6301\uff0c\u5e94\u8be5\u8fd8\u53ef\u4ee5\u201d\uff09\uff0c\u5b58\u5728**\u6295\u673a\u8bd5\u6c34**\u5fc3\u6001\u3002\n\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d\u7b49)**\n    *   **\u65f6\u95f4\u8d44\u6e90**\uff1a\u81ea\u7531\u804c\u4e1a\u72b6\u6001\uff0c\u65f6\u95f4\u76f8\u5bf9\u81ea\u7531\uff0c\u80fd\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\u3002\n    *   **\u7ecf\u6d4e\u8d44\u6e90**\uff1a\u80fd\u63a5\u53d73980\u5143\u4e00\u6b21\u6027\u652f\u4ed8\uff08\u8be2\u95ee\u5206\u671f\uff09\uff0c\u4f46\u4ef7\u683c\u654f\u611f\uff08\u201c\u5982\u679c\u4e0d\u8d35\u4f1a\u8003\u8651\u201d\uff09\u3002\n    *   **\u8ba4\u77e5\u8d44\u6e90**\uff1a\u6709\u57fa\u672c\u5b66\u4e60\u80fd\u529b\uff0c\u80fd\u5b8c\u6210AI\u751f\u56fe/\u89c6\u9891\u4f5c\u4e1a\uff0c\u5bf9\u6280\u672f\u903b\u8f91\u6709\u521d\u6b65\u601d\u8003\uff08\u5982\u5206\u955c\u3001\u524d\u540e\u5e27\uff09\u3002**\u5efa\u7b51\u884c\u4e1a\u80cc\u666f\u53ef\u80fd\u5e26\u6765\u7ed3\u6784\u5316\u601d\u7ef4\u4f18\u52bf**\u3002\n    *   **\u98ce\u9669\u4fe1\u53f7**\uff1a\u672a\u900f\u9732\u5177\u4f53\u7ecf\u6d4e\u72b6\u51b5\uff0c\u5bf9\u4e00\u6b21\u6027\u652f\u4ed8\u7565\u6709\u72b9\u8c6b\uff0c**\u8d44\u6e90\u6295\u5165\u51b3\u5fc3\u5f85\u89c2\u5bdf**\u3002\n\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u7b49\u504f\u9ad8)**\n    *   **\u4e3b\u52a8\u6027**\uff1a\u4e3b\u52a8\u8be2\u95ee\u62a5\u540d\u7ec6\u8282\uff08\u4f18\u60e0\u3001\u4ef7\u683c\u3001\u5206\u671f\uff09\u3001\u7d22\u8981\u4f18\u60e0\u5238\u3001\u8981\u6c42\u8fdb\u7fa4\uff08\u201c\u6211\u8981\u8fdb\u6751\u201d\uff09\uff0c\u914d\u5408\u5b8c\u6210\u4f5c\u4e1a\u548c\u4e92\u52a8\u3002\n    *   **\u8010\u632b\u6027**\uff1a\u5728\u9500\u552e\u5bc6\u96c6\u8ddf\u8fdb\u4e0b\u4fdd\u6301\u7a33\u5b9a\u56de\u5e94\uff0c\u672a\u8868\u73b0\u51fa\u660e\u663e\u4e0d\u8010\u70e6\u6216\u9000\u7f29\u3002\n    *   **\u98ce\u9669\u4fe1\u53f7**\uff1a\u56de\u5e94\u8f83\u4e3a\u7b80\u77ed\uff08\u201c\u597d\u201d\u3001\u201c\u55ef\u201d\u3001\u201cOK\u201d\uff09\uff0c**\u6df1\u5ea6\u4e92\u52a8\u548c\u60c5\u611f\u8868\u9732\u8f83\u5c11**\uff0c\u53ef\u80fd\u5c5e\u4e8e\u7406\u6027\u3001\u89c2\u5bdf\u578b\u5b66\u4e60\u8005\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u5df2\u652f\u4ed8\uff083980\u5143\uff0c3.5\u4e2a\u6708\u8bfe\u7a0b\uff09\u3002**\u652f\u4ed8\u5b8c\u6210\uff0c\u8fdb\u5165\u5df2\u4ed8\u8d39\u7528\u6237\u6d41\u7a0b**\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u5bb6\u5ead\u6216\u4ed6\u4eba\u51b3\u7b56\u4fe1\u606f\uff0c\u89c6\u4e3a**\u4e2a\u4eba\u72ec\u7acb\u51b3\u7b56**\u3002\n*   **\u6b65\u9aa41\uff1a\u52a8\u673a\u4e0e\u8d44\u6e90\u521d\u6b65\u5224\u65ad (B\u7c7b - \u673a\u4f1a\u63a2\u7d22\u8005)**\uff1a\u52a8\u673a\u4e3a\u804c\u4e1a\u8f6c\u578b\u4e0e\u526f\u4e1a\u63a2\u7d22\uff0c\u8d44\u6e90\u4e2d\u7b49\uff0c\u5fc3\u7406\u5f39\u6027\u5c1a\u53ef\u3002\u975e\u5f3a\u70c8\u75db\u82e6\u9a71\u52a8\uff0c\u4e5f\u975e\u76f2\u76ee\u8ddf\u98ce\u3002\n*   **\u6b65\u9aa42\uff1a\u627f\u8bfa\u5ea6\u4e0e\u884c\u52a8\u529b\u5224\u65ad (B2\u7c7b - \u8c28\u614e\u8ddf\u968f\u8005)**\uff1a\u5df2\u5b8c\u6210\u652f\u4ed8\u548c\u5165\u73ed\uff0c\u884c\u52a8\u4e0a\u5df2\u627f\u8bfa\u3002\u4f46\u51b3\u7b56\u8fc7\u7a0b\u663e\u793a\u51fa\u4ef7\u683c\u8003\u91cf\u548c\u5bf9\u201c\u575a\u6301\u201d\u7684\u6f5c\u5728\u62c5\u5fe7\uff0c\u627f\u8bfa\u6df1\u5ea6\u6709\u5f85\u8bfe\u7a0b\u4f53\u9a8c\u9a8c\u8bc1\u3002\n*   **\u6b65\u9aa43\uff1a\u957f\u671f\u4ef7\u503c\u4e0e\u98ce\u9669\u5224\u65ad (B2\u7c7b - \u89c2\u671b\u4ef7\u503c\u578b)**\uff1a\u5176\u4ef7\u503c\u83b7\u53d6\u4f9d\u8d56\u4e8e\u8bfe\u7a0b\u662f\u5426\u80fd\u63d0\u4f9b\u6e05\u6670\u7684\u8def\u5f84\u3001\u6709\u6548\u7684\u5b9e\u64cd\u8bad\u7ec3\u53ca\u771f\u5b9e\u7684\u8d44\u6e90\u5bf9\u63a5\uff08\u5982\u5546\u5355\uff09\u3002\u82e5\u521d\u671f\u89c1\u6548\u6162\u6216\u4e0e\u5ba3\u4f20\u4e0d\u7b26\uff0c**\u6d41\u5931\u4e0e\u9000\u8d39\u98ce\u9669\u663e\u8457**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b\uff1aT4 \u52a1\u5b9e\u63a2\u7d22\u8005**\n    *   **\u7279\u5f81**\uff1a\u76ee\u6807\u660e\u786e\uff08\u5b66\u6280\u80fd\u53d8\u73b0\uff09\uff0c\u884c\u52a8\u7406\u6027\uff08\u8be2\u95ee\u4ef7\u683c\u3001\u5206\u671f\u3001\u8d44\u6e90\uff09\uff0c\u5bf9\u627f\u8bfa\u8c28\u614e\uff08\u201c\u770b\u60c5\u51b5\u201d\u3001\u201c\u5982\u679c\u4e0d\u8d35\u4f1a\u8003\u8651\u201d\uff09\u3002\u5173\u6ce8\u6295\u5165\u4ea7\u51fa\u6bd4\u548c\u5b9e\u9645\u8def\u5f84\u3002\n    *   **\u504f\u79bb\u70b9**\uff1a\u7f3a\u4e4fT4\u5178\u578b\u7684\u5f3a\u70c8\u81ea\u4e3b\u89c4\u5212\u548c\u6df1\u5ea6\u95ee\u9898\u8ffd\u95ee\uff0c\u66f4\u504f\u5411\u4e8e\u8ddf\u968f\u8bfe\u7a0b\u5b89\u6392\uff0c**\u5e26\u6709\u4e00\u5b9a\u7684T7 \u8d44\u6e90\u4f9d\u8d56\u578b\u7279\u5f81**\uff0c\u5bf9\u5e73\u53f0\u627f\u8bfa\u7684\u201c\u5de5\u4f5c\u5ba4\u201d\u3001\u201c\u5546\u5355\u6e20\u9053\u201d\u8868\u73b0\u51fa\u4f9d\u8d56\u5174\u8da3\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4e2d)\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u4e0d\u53ca\u9884\u671f (\u9ad8\u98ce\u9669)**\uff1a\u6838\u5fc3\u98ce\u9669\u70b9\u3002\u7528\u6237\u671f\u5f85\u201c\u53d8\u73b0\u201d\uff0c\u82e5\u8bfe\u7a0b\u65e0\u6cd5\u5feb\u901f\u6216\u6e05\u6670\u5730\u5bfc\u5411\u5176\u8ba4\u53ef\u7684\u6536\u76ca\uff08\u5982\u63a5\u5355\uff09\uff0c\u6781\u6613\u5f15\u53d1\u5931\u671b\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b (\u4e2d\u98ce\u9669)**\uff1a\u867d\u5df2\u652f\u4ed8\uff0c\u4f46\u66fe\u8be2\u95ee\u5206\u671f\uff0c\u5bf9\u4ef7\u683c\u654f\u611f\uff0c\u7ecf\u6d4e\u7f13\u51b2\u53ef\u80fd\u6709\u9650\u3002\n    3.  **\u8bfe\u7a0b\u8d28\u91cf (\u4e2d\u98ce\u9669)**\uff1a\u7528\u6237\u6709\u57fa\u672c\u6280\u672f\u7406\u89e3\u529b\uff0c\u82e5\u8bfe\u7a0b\u5185\u5bb9\u80a4\u6d45\u3001\u4e0d\u4f53\u7cfb\uff0c\u53ef\u80fd\u88ab\u8bc6\u522b\u3002\n    4.  **\u65f6\u95f4\u51b2\u7a81 (\u4f4e\u98ce\u9669)**\uff1a\u76ee\u524d\u81ea\u7531\u804c\u4e1a\uff0c\u65f6\u95f4\u51b2\u7a81\u98ce\u9669\u4f4e\u3002\n    5.  **\u5bb6\u5ead\u53cd\u5bf9 (\u4f4e\u98ce\u9669)**\uff1a\u672a\u63d0\u53ca\u3002\n    6.  **\u9500\u552e\u8bef\u5bfc (\u4e2d\u98ce\u9669)**\uff1a\u9500\u552e\u627f\u8bfa\u201c\u7b2c\u4e8c\u5468\u5f00\u901a\u63a5\u5355\u201d\u3001\u201c\u5546\u535580-300/\u5206\u949f\u201d\u3001\u201c\u52a0\u5165\u5de5\u4f5c\u5ba4\u8d44\u6e90\u201d\uff0c**\u82e5\u540e\u7eed\u65e0\u6cd5\u5151\u73b0\u6216\u95e8\u69db\u6781\u9ad8\uff0c\u5c06\u6784\u6210\u91cd\u5927\u9000\u8d39\u7406\u7531**\u3002\n    7.  **\u4e2a\u4eba\u56e0\u7d20 (\u4e2d\u98ce\u9669)**\uff1a\u201c\u575a\u6301\u201d\u610f\u613f\u5b58\u7591\uff0c\u81ea\u7531\u804c\u4e1a\u72b6\u6001\u53ef\u80fd\u4e0d\u7a33\u5b9a\uff0c\u5f71\u54cd\u5b66\u4e60\u6301\u7eed\u6027\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5408\u89c4\u98ce\u9669**\uff1a\n    *   **\u8fc7\u5ea6\u627f\u8bfa**\uff1a\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u7b2c\u4e8c\u5468\u5f00\u901a\u63a5\u5355\u201d\u3001\u201c\u5546\u5355\u4ef7\u683c\u201d\u3001\u201c\u5de5\u4f5c\u5ba4\u5185\u90e8\u8d44\u6e90\u201d\uff0c**\u5b58\u5728\u5938\u5927\u6536\u76ca\u3001\u6a21\u7cca\u5b9e\u73b0\u6761\u4ef6\u7684\u98ce\u9669**\u3002\n    *   **\u5236\u9020\u7a00\u7f3a\u4e0e\u7d27\u8feb\u611f**\uff1a\u201c\u5b98\u65b9\u76f4\u64ad\u65e0\u56de\u653e\u201d\u3001\u201c\u62a5\u540d\u901a\u9053\u5f00\u542f\u201d\u3001\u201c\u5185\u90e8\u5c0f\u7076\u8bfe\u201d\u7b49\u8bdd\u672f\u4f7f\u7528\u9891\u7e41\u3002\n    *   **\u5f31\u5316\u51b3\u7b56\u98ce\u9669**\uff1a\u4ec5\u4e00\u6b21\u63d0\u53ca\u201c\u4e0d\u6ee1\u610f\u652f\u6301\u9000\u8d39\u201d\uff0c\u4f46\u672a\u8be6\u7ec6\u8bf4\u660e\u9000\u8d39\u653f\u7b56\u3002\n*   **\u4f26\u7406\u9632\u7ebf**\uff1a\u9500\u552e\u6d41\u7a0b\u5b58\u5728**\u8bf1\u5bfc\u6027\u8425\u9500**\uff0c\u5c06\u201c\u6280\u80fd\u5b66\u4e60\u201d\u4e0e\u201c\u786e\u5b9a\u6536\u76ca\u201d\u5f3a\u5173\u8054\uff0c\u53ef\u80fd\u62ac\u5347\u7528\u6237\u9884\u671f\uff0c\u4e3a\u540e\u7eed\u670d\u52a1\u548c\u5ba2\u8bc9\u57cb\u4e0b\u9690\u60a3\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6838\u5fc3\u7b56\u7565**\uff1a**\u964d\u4f4e\u9884\u671f\uff0c\u592f\u5b9e\u8fc7\u7a0b\uff0c\u5c55\u793a\u8def\u5f84\uff0c\u53ca\u65f6\u53cd\u9988**\u3002\n*   **\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9884\u671f\u7ba1\u7406\uff08\u5173\u952e\uff09**\uff1a\u9996\u6b21\u6c9f\u901a\u9700\u6f84\u6e05\u201c\u5b66\u4e60-\u5b9e\u8df5-\u63a5\u5355\u201d\u7684\u771f\u5b9e\u5468\u671f\u4e0e\u95e8\u69db\uff0c\u5f3a\u8c03\u6280\u80fd\u79ef\u7d2f\u7684\u91cd\u8981\u6027\uff0c\u5c06\u201c\u5546\u5355\u201d\u5b9a\u4f4d\u4e3a\u5b66\u4e60\u6210\u679c\u7684\u9a8c\u8bc1\u800c\u975e\u4fdd\u5e95\u6536\u76ca\u3002\n    2.  **\u8def\u5f84\u53ef\u89c6\u5316**\uff1a\u4e3a\u5176\u5236\u5b9a\u6e05\u6670\u7684\u5b66\u4e60\u91cc\u7a0b\u7891\u8ba1\u5212\uff0c\u5b9a\u671f\u5c55\u793a\u540c\u7c7b\u578b\u5b66\u5458\uff08\u5c24\u5176\u662f\u8f6c\u578b\u8005\uff09\u7684\u8fdb\u9636\u6848\u4f8b\uff0c\u5f3a\u5316\u5176\u201c\u6bcf\u4e00\u6b65\u90fd\u6709\u6536\u83b7\u201d\u7684\u611f\u77e5\u3002\n    3.  **\u8d44\u6e90\u5bf9\u63a5\u52a1\u5b9e\u5316**\uff1a\u8c28\u614e\u5ba3\u4f20\u201c\u5546\u5355\u201d\u8d44\u6e90\uff0c\u521d\u671f\u53ef\u63d0\u4f9b\u4f4e\u95e8\u69db\u7684\u7ec3\u4e60\u578b\u4efb\u52a1\u6216\u5185\u90e8\u7ade\u8d5b\uff0c\u9010\u6b65\u5f15\u5bfc\u81f3\u771f\u5b9e\u5546\u5355\uff0c\u907f\u514d\u843d\u5dee\u3002\n    4.  **\u5f3a\u5316\u4e92\u52a8\u4e0e\u53cd\u9988**\uff1a\u9488\u5bf9\u5176\u7406\u6027\u3001\u89c2\u5bdf\u578b\u7279\u70b9\uff0c\u63d0\u4f9b\u5177\u4f53\u3001\u6280\u672f\u6027\u7684\u4f5c\u4e1a\u53cd\u9988\uff0c\u8ba4\u53ef\u5176\u8fdb\u6b65\uff08\u5982\u5df2\u505a\uff09\uff0c\u5efa\u7acb\u4e13\u4e1a\u4fe1\u4efb\u3002\n    5.  **\u98ce\u9669\u76d1\u6d4b**\uff1a\u5bc6\u5207\u5173\u6ce8\u5176\u524d\u51e0\u5468\u7684\u5b8c\u8bfe\u7387\u3001\u4f5c\u4e1a\u63d0\u4ea4\u60c5\u51b5\u53ca\u5728\u7fa4\u5185\u7684\u4e92\u52a8\u6df1\u5ea6\uff0c\u5bf9\u6c89\u9ed8\u6216\u6577\u884d\u8ff9\u8c61\u53ca\u65f6\u4ecb\u5165\uff0c\u4e86\u89e3\u5176\u9047\u5230\u7684\u771f\u5b9e\u56f0\u96be\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**\uff1a\n    *   **\u4e3b\u7ebf**\uff1a\u8ddf\u968fAI\u77ed\u89c6\u9891\u6807\u51c6\u8bfe\u7a0b\u4f53\u7cfb\u3002\n    *   **\u589e\u503c\u670d\u52a1**\uff1a\u53ef\u5f15\u5bfc\u5176\u5173\u6ce8**\u9879\u76ee\u5236\u5b9e\u6218\u8bad\u7ec3\u8425**\u6216**\u5546\u5355\u966a\u8dd1\u5c0f\u7ec4**\uff08\u9700\u660e\u786e\u89c4\u5219\uff09\uff0c\u5c06\u5176\u63a2\u7d22\u6b32\u8f6c\u5316\u4e3a\u5177\u4f53\u7684\u9879\u76ee\u76ee\u6807\u3002\n    *   **\u89c4\u907f**\uff1a\u907f\u514d\u5728\u521d\u671f\u8fc7\u5ea6\u63a8\u9500\u66f4\u9ad8\u9636\u3001\u66f4\u6602\u8d35\u7684\u8bfe\u7a0b\u5305\uff0c\u9664\u975e\u5176\u5df2\u4ea7\u751f\u660e\u786e\u7684\u6b63\u5411\u6210\u679c\u548c\u6df1\u5ea6\u5174\u8da3\u3002\n\n{\"core_type\": \"T4 \u52a1\u5b9e\u63a2\u7d22\u8005 (\u504fT7\u8d44\u6e90\u4f9d\u8d56)\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\uff08\u804c\u4e1a\u8f6c\u578b/\u7ecf\u6d4e\u4fdd\u969c\uff09\", \"target_product_line\": \"AI\u77ed\u89c6\u9891\u6807\u51c6\u8bfe+\u9879\u76ee\u5236\u5b9e\u6218\u8bad\u7ec3\u8425\uff08\u8c28\u614e\u63a8\u8350\uff09\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}";
