        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677152917 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5416\u5416\u51b2\u9e2d1(\u65bd\u73ca\u73ca) / \u5b98\u65b9\u62db\u52df\u5b98(\u65bd\u73ca\u73ca) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u6f14\u64ad\u8ba4\u8bc1\u8bfe\u7a0b (\u4ef7\u683c\u672a\u660e\u793a\uff0c\u610f\u54113980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u4f46\u7528\u6237\u6709\u201c\u8ddf\u5bb6\u91cc\u5546\u91cf\u201d\u884c\u4e3a\uff0c\u63a8\u6d4b\u4e3a\u81ea\u6709\u8d44\u91d1\u6216\u5bb6\u5ead\u5171\u540c\u51b3\u7b56\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u6709\u63a5\u9001\u5b69\u5b50\u3001\u642c\u5bb6\u3001\u5904\u7406\u5bb6\u5ead\u4e8b\u52a1\u7b49\u5b89\u6392\uff0c\u8868\u660e\u65f6\u95f4\u88ab\u5bb6\u5ead\u4e8b\u52a1\u5207\u5272\uff0c\u975e\u6574\u5757\u5b66\u4e60\u65f6\u95f4\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u5df2\u62a5\u5907\u5e76\u652f\u6301**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u521a\u624d\u8ddf\u5bb6\u91cc\u5546\u91cf\u4e86\u4e00\u4e0b\u201d\uff0c\u8868\u660e\u5bb6\u5ead\u77e5\u60c5\u4e14\u53c2\u4e0e\u51b3\u7b56\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u7528\u6237\u8868\u8fbe\u4e86\u5b66\u4e60\u611f\u53d7\u3001\u987e\u8651\u3001\u5bb6\u5ead\u60c5\u51b5\uff0c\u4e92\u52a8\u79ef\u6781\uff0c\u4fe1\u606f\u5145\u5206\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u5148\u8003\u8651\u517c\u804c\u201d\uff0c\u6709\u901a\u8fc7\u526f\u4e1a\u589e\u52a0\u6536\u5165\u7684\u52a8\u673a\uff0c\u4f46\u540c\u65f6\u4e5f\u8868\u73b0\u51fa\u5bf9\u884c\u4e1a\u672c\u8eab\u7684\u5174\u8da3\u548c\u201c\u6539\u53d8\u81ea\u5df1\u201d\u7684\u610f\u613f\uff0c\u5e76\u975e\u7eaf\u7cb9\u8ffd\u6c42\u6781\u901f\u53d8\u73b0\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5148\u8003\u8651\u517c\u804c\u5427\uff0c\u81ea\u5df1\u73b0\u5728\u5bf9\u81ea\u5df1\u8fd8\u4e0d\u662f\u592a\u81ea\u4fe1\uff0c\u6240\u4ee5\u60f3\u591a\u5b66\u4e60\u4e00\u4e0b\u6539\u53d8\u4e00\u4e0b\u81ea\u5df1\uff0c\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 \u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\uff0c\u80fd\u8003\u8651\u6570\u5343\u5143\u8bfe\u7a0b\uff0c\u4f46\u9700\u4e0e\u5bb6\u4eba\u5546\u91cf\uff0c\u975e\u968f\u610f\u652f\u914d\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 **\u4e3b\u8981\u77ed\u677f**\u3002\u7528\u6237\u9762\u4e34\u642c\u5bb6\u3001\u5bb6\u5ead\u4e8b\u52a1\uff0c\u65f6\u95f4\u88ab\u4e25\u91cd\u5206\u5272\uff0c\u62c5\u5fc3\u201c\u4e0d\u80fd\u96c6\u4e2d\u65f6\u95f4\u6765\u4e0a\u8bfe\u201d\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u9ad8] \u2014 \u51b3\u7b56\u524d\u4e0e\u5bb6\u4eba\u5546\u91cf\uff0c\u5bb6\u5ead\u77e5\u60c5\u4e14\u672a\u53cd\u5bf9\uff0c\u662f\u79ef\u6781\u4fe1\u53f7\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b07\u4f4e\u6781\u5371]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u7528\u6237\u591a\u6b21\u8868\u8fbe\u201c\u5bf9\u81ea\u5df1\u8fd8\u4e0d\u662f\u592a\u81ea\u4fe1\u201d\u3001\u201c\u538b\u529b\u6709\u70b9\u5927\u201d\u3001\u201c\u6015\u81ea\u5df1\u505a\u4e0d\u597d\uff0c\u8ddf\u4e0d\u4e0a\u201d\u3001\u201c\u5fc3\u91cc\u8fd8\u662f\u89c9\u5f97\u6709\u70b9\u6ca1\u5e95\u201d\u3002\u9762\u5bf9\u65b0\u4e8b\u7269\uff08\u8bd5\u97f3\u64cd\u4f5c\uff09\u65f6\u8868\u73b0\u51fa\u660e\u663e\u7684\u754f\u96be\u548c\u4f9d\u8d56\u6307\u5bfc\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5c31\u662f\u6015\u81ea\u5df1\u505a\u4e0d\u597d\uff0c\u8ddf\u4e0d\u4e0a\uff0c\u6bd5\u7adf\u6ca1\u63a5\u89e6\u8fc7\uff0c\u5fc3\u91cc\u6709\u70b9\u538b\u529b\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5f3a\u70c8\u7684\u81ea\u6211\u6000\u7591\u548c\u4e0d\u81ea\u4fe1**\u3002\u5979\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u4e00\u9879\u65b0\u6280\u80fd\u6765\u201c\u6539\u53d8\u4e00\u4e0b\u81ea\u5df1\u201d\uff0c\u83b7\u5f97\u81ea\u6211\u4ef7\u503c\u7684\u80af\u5b9a\u548c\u5916\u754c\uff08\u5bb6\u5ead\u3001\u793e\u7fa4\uff09\u7684\u8ba4\u53ef\uff0c\u586b\u8865\u56e0\u201c\u6ca1\u63a5\u89e6\u8fc7\u201d\u800c\u4ea7\u751f\u7684\u81ea\u5351\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u80af\u5b9a\u3001\u9f13\u52b1\u548c\u5b89\u5168\u611f**\u3002\u9700\u8981\u4e0d\u65ad\u5f3a\u5316\u201c\u4f60\u80fd\u884c\u201d\u7684\u4fe1\u5ff5\uff0c\u5e76\u63d0\u4f9b\u6e05\u6670\u3001\u7b80\u5355\u3001\u65e0\u538b\u529b\u7684\u8def\u5f84\uff0c\u5e2e\u52a9\u5979\u5efa\u7acb\u521d\u6b65\u7684\u6210\u5c31\u611f\uff0c\u62b5\u5fa1\u56e0\u201c\u6015\u505a\u4e0d\u597d\u201d\u800c\u4ea7\u751f\u7684\u9000\u7f29\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfea **C1 \u7c7b** (\u6709\u660e\u786e\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\uff0c\u4f46\u5fc3\u7406\u5f39\u6027\u6781\u4f4e\uff0c\u9700\u9ad8\u5ea6\u60c5\u7eea\u652f\u6301) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5ead\u53cd\u5bf9\u7b49\u7ea2\u7ebf\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u5df2\u4e0e\u5bb6\u4eba\u6c9f\u901a\uff0c\u5bb6\u5ead\u77e5\u60c5\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u642c\u5bb6\u7b49\u5bb6\u5ead\u4e8b\u52a1\u5bfc\u81f4\u65f6\u95f4\u7cbe\u529b\u65e0\u6cd5\u4fdd\u8bc1\uff0c\u5b66\u4e60\u4efb\u52a1\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u7126\u8651\u548c\u81ea\u8d23\uff0c\u6700\u7ec8\u653e\u5f03\u3002** |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u9996\u6b21\u72ec\u7acb\u5b8c\u6210\u7a0d\u6709\u96be\u5ea6\u7684\u5b9e\u64cd\u4efb\u52a1\uff08\u5982\u590d\u6742\u8f6f\u4ef6\u64cd\u4f5c\u3001\u7b2c\u4e00\u6b21\u6b63\u5f0f\u8bd5\u97f3\uff09\u65f6\uff0c\u82e5\u906d\u9047\u632b\u6298\u6216\u8d1f\u9762\u53cd\u9988\uff0c\u6781\u6613\u56e0\u201c\u6211\u592a\u7b28\u4e86\u201d\u7684\u81ea\u5c0a\u5fc3\u53d7\u635f\u800c\u76f4\u63a5\u9000\u8d39\u3002** |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u82e5\u5728\u8bfe\u7a0b\u521d\u671f\uff08\u5982\u7b2c\u4e00\u3001\u4e8c\u5468\uff09\u672a\u83b7\u5f97\u5373\u65f6\u3001\u7b80\u5355\u3001\u53ef\u89c6\u5316\u7684\u6b63\u5411\u53cd\u9988\uff08\u5982\u8001\u5e08\u8868\u626c\u3001\u5b8c\u6210\u7b80\u5355\u4efb\u52a1\uff09\uff0c\u4f1a\u56e0\u201c\u6ca1\u6536\u83b7\u201d\u800c\u52a8\u6447\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c1-2\u5468**\uff0c\u5f53\u9700\u8981\u72ec\u7acb\u5b8c\u6210\u7b2c\u4e00\u4e2a\u7a0d\u6709\u6311\u6218\u6027\u7684\u4f5c\u4e1a\u6216\u64cd\u4f5c\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4eb2\u7231\u7684\u540c\u5b66\uff0c\u6b22\u8fce\u4f60\uff01\u6211\u77e5\u9053\u4f60\u5e26\u7740\u4e00\u4efd\u2018\u60f3\u6539\u53d8\u81ea\u5df1\u2019\u7684\u52c7\u6c14\u6765\u5230\u8fd9\u91cc\uff0c\u7279\u522b\u4e86\u4e0d\u8d77\u3002\u8bf7\u5b8c\u5168\u653e\u5fc3\uff0c\u54b1\u4eec\u4e0d\u8ddf\u4efb\u4f55\u4eba\u6bd4\uff0c\u53ea\u8ddf\u6628\u5929\u7684\u81ea\u5df1\u6bd4\u3002\u4f60\u7684\u6bcf\u4e00\u6b21\u5c1d\u8bd5\uff0c\u54ea\u6015\u53ea\u662f\u5f55\u4e86\u4e00\u53e5\u8bdd\uff0c\u5728\u6211\u8fd9\u91cc\u90fd\u662f\u6ee1\u5206\u8fdb\u6b65\uff01\u6709\u4efb\u4f55\u4e00\u70b9\u70b9\u5361\u4f4f\u7684\u5730\u65b9\uff0c\u968f\u65f6\u558a\u6211\uff0c\u6211\u624b\u628a\u624b\u5e26\u4f60\uff0c\u54b1\u4eec\u6162\u6162\u6765\uff0c\u4e0d\u7740\u6025\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5174\u8da3\u6e38\u4e50\u7ebf\u3011**\u3002\u9996\u8981\u76ee\u6807\u662f\u5efa\u7acb\u5174\u8da3\u548c\u81ea\u4fe1\uff0c\u800c\u975e\u5f3a\u63a8\u786c\u6838\u6280\u672f\u6216\u5feb\u901f\u53d8\u73b0\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u5f3a\u70c8\u8865\u5145\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u5305\u62ec\uff1a\u6bcf\u65e5\u6696\u5fc3\u6253\u5361\u63d0\u9192\u3001\u4f5c\u4e1a\u63d0\u4ea4\u540e\u79d2\u56de\u7684\u201c\u5f69\u8679\u5c41\u201d\u5f0f\u9f13\u52b1\u3001\u7b80\u5316\u5230\u6781\u81f4\u7684\u64cd\u4f5c\u6307\u5357\uff08\u56fe\u6587/\u89c6\u9891\uff09\u3001\u907f\u514d\u5728\u7fa4\u5185\u516c\u5f00\u5bf9\u6bd4\u6216\u6279\u8bc4\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9T6\u4e0a\u9ad8\u96be\u5ea6\u4f5c\u4e1a\u6216\u590d\u6742\u4efb\u52a1\u65bd\u538b**\u3002\u6240\u6709\u4efb\u52a1\u5fc5\u987b\u62c6\u89e3\u5230\u201c\u50bb\u74dc\u5f0f\u201d\u4e00\u6b65\u4e00\u6307\u4ee4\u3002\n    2. **\u7edd\u4e0d\u5728\u516c\u5f00\u573a\u5408\u7ed9\u4e88\u4efb\u4f55\u5f62\u5f0f\u7684\u6279\u8bc4\u6216\u5bf9\u6bd4**\u3002\u6240\u6709\u53cd\u9988\u5fc5\u987b\u79c1\u804a\uff0c\u4e14\u9075\u5faa\u201c\u5148\u5938\u7206\uff0c\u518d\u8f7b\u63cf\u6de1\u5199\u63d0\u4e00\u4e2a\u5c0f\u5efa\u8bae\u201d\u7684\u683c\u5f0f\u3002\n    3. **\u7edd\u4e0d\u8981\u50ac\u4fc3\u6216\u5f3a\u8c03\u201c\u522b\u4eba\u90fd\u4ea4\u4e86\u201d**\u3002\u5141\u8bb8\u5979\u5ef6\u671f\uff0c\u5e76\u4e3b\u52a8\u5e2e\u5979\u529e\u7406\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u5efa\u7acb\u8db3\u591f\u81ea\u4fe1\u548c\u7a33\u5b9a\u5b66\u4e60\u8282\u594f\u524d\uff0c\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u4f1a\u52a0\u5267\u5176\u7126\u8651\u548c\u9000\u7f29\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5148\u8003\u8651\u517c\u804c\u5427\uff0c\u81ea\u5df1\u73b0\u5728\u5bf9\u81ea\u5df1\u8fd8\u4e0d\u662f\u592a\u81ea\u4fe1\uff0c\u6240\u4ee5\u60f3\u591a\u5b66\u4e60\u4e00\u4e0b\u6539\u53d8\u4e00\u4e0b\u81ea\u5df1\uff0c\u201d\n2. > \u201c\u5c31\u662f\u6015\u81ea\u5df1\u505a\u4e0d\u597d\uff0c\u8ddf\u4e0d\u4e0a\uff0c\u6bd5\u7adf\u6ca1\u63a5\u89e6\u8fc7\uff0c\u5fc3\u91cc\u6709\u70b9\u538b\u529b\u201d\n3. > \u201c\u56e0\u4e3a\u6bd5\u7adf\u662f\u65b0\u884c\u4e1a\uff0c\u7136\u540e\u8eab\u8fb9\u4e5f\u6ca1\u4eba\u505a\u8fc7\u8fd9\u4e2a\u884c\u4e1a\uff0c\u6709\u987e\u8651\u4e5f\u89c9\u5f97\u5e94\u8be5\u4e5f\u5f88\u6b63\u5e38...\u5149\u9760\u7f51\u4e0a\u5b66\u4e60\uff0c\u5fc3\u91cc\u8fd8\u662f\u89c9\u5f97\u6709\u70b9\u6ca1\u5e95\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u4e0e\u81ea\u4fe1\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u81f4\u7b80\u5355\u3001\u65e0\u538b\u529b\u7684\u5b66\u4e60\u8def\u5f84\uff0c\u5e76\u7ed9\u4e88\u6d77\u91cf\u3001\u5373\u65f6\u7684\u60c5\u7eea\u4ef7\u503c\u80af\u5b9a\uff0c\u4e25\u9632\u4efb\u4f55\u632b\u6298\u4f53\u9a8c\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5c0a\u91cd\u5f52\u5c5e\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf+\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\"}\n```";
