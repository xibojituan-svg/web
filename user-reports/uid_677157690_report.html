    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v3.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\uff0c\u5e76\u8f93\u51fa\u5168\u666f\u8bca\u65ad\u62a5\u544a\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677157690 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | kkdd(\u4efb\u6d01) / \u68a6\u5883\uff08\u6696\u6696\uff09 / \u73ed\u4e3b\u4efb-\u6d1b\u5947\u6eaa\u5802(\u5f20\u723d) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u6f14\u64ad\u8bfe\u7a0b\uff08\u5177\u4f53\u4ef7\u683c\u672a\u77e5\uff0c\u7528\u6237\u63d0\u53ca\u201c\u8d44\u91d1\u95ee\u9898\u201d\u9009\u62e9\u201c\u7cbe\u82f1\u73ed\u201d\u800c\u975e\u201c\u9ad8\u9636\u73ed\u201d\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u76ee\u524d\u662f\u8d44\u91d1\u95ee\u9898\u201d\uff0c\u4f46\u672a\u900f\u9732\u652f\u4ed8\u65b9\u5f0f\uff08\u5168\u6b3e/\u5206\u671f/\u501f\u8d37\uff09\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u7528\u6237\u8868\u793a\u201c\u517c\u804c\u201d\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u5de5\u4f5c\u6027\u8d28\u3001\u4f5c\u606f\u65f6\u95f4\u53ca\u5bb6\u5ead\u8d1f\u8377\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u672a\u63d0\u53ca\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u804a\u5929\u8bb0\u5f55\u4ee5\u9500\u552e/\u73ed\u4e3b\u4efb\u5355\u5411\u63a8\u9001\u548c\u50ac\u4fc3\u4e3a\u4e3b\uff0c\u7528\u6237\u4e3b\u52a8\u8868\u8fbe\u6781\u5c11\uff0c\u5173\u952e\u4e09\u8f74\u4fe1\u606f\uff08\u8d44\u91d1\u3001\u65f6\u95f4\u3001\u5bb6\u5ead\uff09\u4e25\u91cd\u7f3a\u5931\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u27a1\u4e2d\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u201c\u6536\u5165+\u7231\u597d\u201d\u6df7\u5408\u9a71\u52a8\uff0c\u5bf9\u53d8\u73b0\u6709\u4e00\u5b9a\u671f\u5f85\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u6781\u7aef\u6025\u8feb\u6027\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u517c\u804c\uff0c\u9664\u4e86\u6536\u5165\uff0c\u8fd8\u662f\u7231\u597d\uff0c\u77e5\u8bc6\u4ed8\u8d39\u6211\u8ba4\u540c\uff0c\u4f46\u662f\u8d39\u7528\u4e0d\u80fd\u592a\u9ad8[\u6342\u8138]\u201d\n> \u201c\u6211\u5f88\u559c\u6b22\u8fd9\u4e2a\u8d5b\u9053\uff0c\u4f46\u662f\u6211\u6015\u6211\u7684\u58f0\u97f3\u4e0d\u8fc7\u5173[\u6342\u8138]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u2b07\u4f4e** \u2014 \u7528\u6237\u660e\u786e\u8868\u793a\u56e0\u201c\u8d44\u91d1\u95ee\u9898\u201d\u653e\u5f03\u9ad8\u9636\u73ed\uff0c\u9009\u62e9\u66f4\u4fbf\u5b9c\u7684\u201c\u7cbe\u82f1\u73ed\u201d\u3002\u8fd9\u662f\u660e\u786e\u7684\u8d44\u91d1\u7d27\u5f20\u4fe1\u53f7\uff0c\u53ef\u80fd\u5f71\u54cd\u540e\u7eed\u5b66\u4e60\u6295\u5165\u548c\u6297\u98ce\u9669\u80fd\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u4ec5\u77e5\u4e3a\u201c\u517c\u804c\u201d\uff0c\u65e0\u6cd5\u5224\u65ad\u5176\u5de5\u4f5c\u5236\u5ea6\u3001\u5bb6\u5ead\u8d1f\u8377\u53ca\u56fa\u5b9a\u5b66\u4e60\u65f6\u95f4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u4fe1\u606f\uff0c\u5b58\u5728\u201c\u5bb6\u4eba\u4e0d\u77e5\u60c5\u201d\u7684\u6f5c\u5728\u98ce\u9669\u3002\n- **\u5e95\u5ea7\u53d6\u77ed\u677f**\uff1a**\u2b07\u4f4e**\u3002\u8d44\u91d1\u7ef4\u5ea6\u5df2\u4eae\u7ea2\u706f\uff0c\u4e14\u65f6\u95f4\u548c\u5bb6\u5ead\u7ef4\u5ea6\u4fe1\u606f\u7f3a\u5931\uff0c\u6309\u98ce\u63a7\u539f\u5219\uff0c\u8d44\u6e90\u5e95\u5ea7\u8bc4\u7ea7\u53d6\u6700\u4f4e\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u8868\u73b0\u51fa**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56**\u3002\u5bf9\u81ea\u8eab\u80fd\u529b\u6781\u5ea6\u4e0d\u81ea\u4fe1\uff0c\u9700\u8981\u5916\u90e8\u6301\u7eed\u80af\u5b9a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u6211\u5f88\u559c\u6b22\u8fd9\u4e2a\u8d5b\u9053\uff0c\u4f46\u662f\u6211\u6015\u6211\u7684\u58f0\u97f3\u4e0d\u8fc7\u5173[\u6342\u8138][\u6342\u8138]\u201d\n> \u201c\u6211\u6ca1\u81ea\u4fe1\uff0c\u8fd8\u662f\u4e00\u6b65\u4e00\u6b65\u8d70\u5427\uff0c\u53ef\u4ee5\u5417\uff1f\u201d\n> \u201c\u6211\u8fd8\u662f\u4e0d\u6ee1\u610f[\u6342\u8138]\u201d\uff08\u5bf9\u4f5c\u4e1a\u7684\u8bc4\u4ef7\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42** \u4e0e **\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42** \u6df7\u5408\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u5ea6\u4e0d\u81ea\u4fe1**\uff08\u201c\u6015\u58f0\u97f3\u4e0d\u8fc7\u5173\u201d\u3001\u201c\u6ca1\u81ea\u4fe1\u201d\uff09\uff0c\u5e0c\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u6280\u80fd\u83b7\u5f97\u81ea\u6211\u8ba4\u53ef\u548c\u4ef7\u503c\u611f\uff0c\u540c\u65f6\u517c\u804c\u589e\u6536\u4ee5\u63d0\u5347\u7ecf\u6d4e\u5b89\u5168\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u5938\u5956\u80af\u5b9a\u4e0e\u5b89\u5168\u611f\u6784\u5efa**\u3002\u9700\u8981\u4e0d\u65ad\u5f3a\u5316\u201c\u4f60\u80fd\u884c\u201d\u7684\u6b63\u9762\u53cd\u9988\uff0c\u540c\u65f6\u8c28\u614e\u7ba1\u7406\u5176\u53d8\u73b0\u9884\u671f\uff0c\u907f\u514d\u56e0\u521d\u671f\u632b\u6298\u6216\u6536\u76ca\u672a\u8fbe\u9884\u671f\u800c\u5f7b\u5e95\u5d29\u6e83\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b\uff08\u51b2\u52a8\u98ce\u9669\u578b\uff09** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5ead\u53cd\u5bf9\u7b49D\u7c7b\u7194\u65ad\u7ea2\u7ebf\u3002\u4f46**\u8d44\u91d1\u7d27\u5f20**\u548c**\u5fc3\u7406\u5f39\u6027\u6781\u4f4e**\u662f\u9ad8\u98ce\u9669\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u82e5\u62a5\u540d\u8d44\u91d1\u632a\u7528\u5bb6\u5ead\u5171\u540c\u8d22\u4ea7\u6216\u5bb6\u4eba\u4e0d\u77e5\u60c5\uff0c\u540e\u7eed\u6613\u5f15\u53d1\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | \u517c\u804c\u65f6\u95f4\u82e5\u4e0d\u7a33\u5b9a\uff0c\u4f5c\u4e1a\u79ef\u538b+\u6280\u672f\u96be\u70b9\uff08\u5982\u8f6f\u4ef6\u64cd\u4f5c\uff09\u4f1a\u8fc5\u901f\u51fb\u57ae\u5176\u672c\u5c31\u8106\u5f31\u7684\u81ea\u4fe1\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669\uff01** \u4e00\u65e6\u9996\u6b21\u8bd5\u97f3\u5931\u8d25\u3001\u4f5c\u4e1a\u88ab\u6279\u3001\u6216\u77ed\u671f\u5185\u672a\u83b7\u5f97\u6b63\u5411\u53cd\u9988\uff0c\u6781\u6613\u4ea7\u751f\u201c\u6211\u679c\u7136\u4e0d\u884c\u201d\u7684\u5d29\u6e83\u60c5\u7eea\uff0c\u76f4\u63a5\u8981\u6c42\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | \u5bf9\u201c\u517c\u804c\u6536\u5165\u201d\u62b1\u6709\u671f\u5f85\uff0c\u82e5\u5b66\u4e601-2\u6708\u540e\u4ecd\u65e0\u63a5\u5355\u673a\u4f1a\u6216\u6536\u5165\u6781\u4f4e\uff0c\u4f1a\u4ea7\u751f\u5f3a\u70c8\u88ab\u6b3a\u9a97\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u6280\u672f\u96be\u5ea6\u63d0\u5347\uff0c\u4f5c\u4e1a\u538b\u529b\u589e\u5927\uff0c\u4e14\u82e5\u672a\u83b7\u5f97\u4efb\u4f55\u63a5\u5355\u6216\u6b63\u5411\u6fc0\u52b1\uff0c\u5176\u201c\u4e0d\u81ea\u4fe1-\u632b\u8d25-\u653e\u5f03\u201d\u7684\u94fe\u6761\u5c06\u88ab\u8fc5\u901f\u6fc0\u6d3b\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u540c\u5b66\u4f60\u597d\uff01\u770b\u5230\u4f60\u5728\u4f53\u9a8c\u8425\u7684\u4f5c\u4e1a\u548c\u53cd\u9988\uff0c\u80fd\u611f\u53d7\u5230\u4f60\u5bf9\u58f0\u97f3\u7684\u70ed\u7231\u548c\u90a3\u4efd\u5c0f\u5fc3\u7ffc\u7ffc\u7684\u8ba4\u771f\uff0c\u8fd9\u7279\u522b\u73cd\u8d35\u3002\u8bf7\u653e\u5fc3\uff0c\u6211\u4eec\u7684\u8bfe\u7a0b\u5c31\u662f\u4e3a\u96f6\u57fa\u7840\u3001\u5bf9\u81ea\u5df1\u58f0\u97f3\u6ca1\u4fe1\u5fc3\u7684\u540c\u5b66\u8bbe\u8ba1\u7684\u3002\u5728\u8fd9\u91cc\uff0c\u8fdb\u6b65\u6bd4\u5b8c\u7f8e\u91cd\u8981\uff0c\u6bcf\u4e00\u6b21\u5f00\u53e3\u90fd\u662f\u80dc\u5229\u3002\u6211\u4f1a\u4e00\u76f4\u966a\u7740\u4f60\uff0c\u54b1\u4eec\u4e0d\u8ddf\u522b\u4eba\u6bd4\uff0c\u53ea\u8ddf\u6628\u5929\u7684\u81ea\u5df1\u6bd4\uff0c\u597d\u5417\uff1f\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\u3011** + **\u3010\u5174\u8da3\u5165\u95e8\u7ebf\u3011**\u3002\u9996\u8981\u4efb\u52a1\u662f\u5efa\u7acb\u81ea\u4fe1\u548c\u5b89\u5168\u611f\uff0c\u800c\u975e\u5f3a\u63a8\u53d8\u73b0\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n    1.  **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\uff1a\u5f3a\u5236\u914d\u5907\u201c\u9f13\u52b1\u5e08\u201d\u89d2\u8272\u73ed\u4e3b\u4efb\uff0c\u9ad8\u9891\u6b21\u3001\u4f4e\u95e8\u69db\u7684\u6b63\u9762\u53cd\u9988\uff08\u5982\u201c\u4eca\u5929\u6c14\u606f\u7a33\u591a\u4e86\uff01\u201d\u201c\u8fd9\u4e2a\u60c5\u7eea\u628a\u63e1\u5f97\u5f88\u51c6\uff01\u201d\uff09\u3002\n    2.  **\u3010\u5c0f\u6b65\u5feb\u8dd1\u6210\u5c31\u5305\u3011**\uff1a\u62c6\u89e3\u5927\u76ee\u6807\u4e3a\u5fae\u4efb\u52a1\uff08\u5982\u201c\u672c\u5468\u5b8c\u62103\u6bb51\u5206\u949f\u8ddf\u8bfb\u201d\uff09\uff0c\u6bcf\u5b8c\u6210\u5373\u53d1\u653e\u865a\u62df\u52cb\u7ae0\u6216\u5c0f\u989d\u79ef\u5206\u5956\u52b1\uff0c\u5236\u9020\u5373\u65f6\u6210\u5c31\u611f\u3002\n    3.  **\u3010\u5b89\u5168\u7f51\u627f\u8bfa\u3011**\uff1a\u660e\u786e\u544a\u77e5\u201c\u5b66\u4f1a\u2260\u7acb\u523b\u63a5\u5355\u201d\uff0c\u8bbe\u7f6e3-6\u4e2a\u6708\u7684\u6280\u80fd\u6210\u957f\u671f\u9884\u671f\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1.  \u7edd\u4e0d\u5bf9\u5176\u4f7f\u7528\u4efb\u4f55\u5bf9\u6bd4\u8bdd\u672f\uff08\u5982\u201c\u522b\u4eba\u90fd\u884c\u4e86\u4f60\u600e\u4e48\u4e0d\u884c\u201d\uff09\u3002\n    2.  \u7edd\u4e0d\u5728\u5176\u672a\u51c6\u5907\u597d\u65f6\u50ac\u4fc3\u53c2\u52a0\u9ad8\u96be\u5ea6\u8bd5\u97f3\u6216\u6bd4\u8d5b\u3002\n    3.  \u7edd\u4e0d\u627f\u8bfa\u5177\u4f53\u53d8\u73b0\u65f6\u95f4\u548c\u91d1\u989d\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u5b8c\u6210\u5f53\u524d\u8bfe\u7a0b\u5e76\u5efa\u7acb\u7a33\u5b9a\u81ea\u4fe1\u524d\uff0c\u7981\u6b62\u4efb\u4f55\u5411\u9ad8\u9636\u8bfe\u3001\u8bbe\u5907\u8bfe\u7b49\u7684\u63a8\u4ecb\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u6211\u6ca1\u81ea\u4fe1\uff0c\u8fd8\u662f\u4e00\u6b65\u4e00\u6b65\u8d70\u5427\uff0c\u53ef\u4ee5\u5417\uff1f**\u201d \u2014\u2014 **\u5fc3\u7406\u5f39\u6027\u6781\u4f4e\u3001\u4f9d\u8d56\u5916\u90e8\u786e\u8ba4\u7684\u6838\u5fc3\u8bc1\u636e**\u3002\n2. > \u201c**\u76ee\u524d\u662f\u8d44\u91d1\u95ee\u9898[\u6342\u8138]**\u201d \u2014\u2014 **\u8d44\u6e90\u5e95\u5ea7\uff08\u8d44\u91d1\u7ef4\u5ea6\uff09\u4eae\u7ea2\u706f\u7684\u76f4\u63a5\u8bc1\u636e**\u3002\n3. > \u201c**\u6211\u5f88\u559c\u6b22\u8fd9\u4e2a\u8d5b\u9053\uff0c\u4f46\u662f\u6211\u6015\u6211\u7684\u58f0\u97f3\u4e0d\u8fc7\u5173[\u6342\u8138][\u6342\u8138]**\u201d \u2014\u2014 **\u52a8\u673a\u4e3a\u5174\u8da3\u4e0e\u6536\u5165\u6df7\u5408\uff0c\u4f46\u88ab\u4e0d\u81ea\u4fe1\u4e25\u91cd\u538b\u5236\u7684\u5178\u578b\u8868\u73b0**\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6\u60c5\u7eea\u5de8\u5a74\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u5c0a\u91cd\uff08\u8bc1\u660e\u81ea\u5df1\uff09\u4e0e\u7ecf\u6d4e\u5b89\u5168\u611f**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u6781\u81f4\u7684\u60c5\u611f\u966a\u4f34\u4e0e\u5b89\u5168\u611f\uff0c\u7528\u201c\u5c0f\u6b63\u53cd\u9988\u201d\u5faa\u73af\u62b5\u5fa1\u5176\u201c\u5927\u5d29\u6e83\u201d\u503e\u5411\uff0c\u4e25\u683c\u7ba1\u7406\u53d8\u73b0\u9884\u671f**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"maslow_need\": \"\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\u4e0e\u7b2c\u56db\u5c42\u5c0a\u91cd\u9700\u6c42\u6df7\u5408\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf+\u5174\u8da3\u5165\u95e8\u7ebf\"}\n```";
