        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677160414 (\u6635\u79f0\uff1a\u9759\u5f85\u82b1\u5f00) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u8c22\u7f8e (\u7b71\u6590/\u7f8e\u7f8e1) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u9a6c\u62c9\u96c5\u6709\u58f0\u6f14\u64ad\u7cfb\u7edf\u8bfe (\u4ef7\u683c\uff1a3980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u4ec5\u63d0\u53ca\u201c\u5e0c\u671b\u4e0d\u8981\u592a\u8d35\u201d\uff0c\u672a\u900f\u9732\u652f\u4ed8\u65b9\u5f0f\u3001\u8d44\u91d1\u6765\u6e90\u6216\u7ecf\u6d4e\u538b\u529b\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u81ea\u8ff0\u6bcf\u5929\u67092\u5c0f\u65f6\u53ef\u7528\u4e8e\u5b66\u4e60\u548c\u517c\u804c\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u63d0\u5230\u201c\u5e73\u8861\u5bb6\u5ead\u201d\uff0c\u4f46\u672a\u660e\u786e\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u6709\u660e\u786e\u7684\u5b66\u4e60\u76ee\u6807\u3001\u65f6\u95f4\u6295\u5165\u548c\u5174\u8da3\u8868\u8fbe\uff0c\u4f46\u7f3a\u4e4f\u5173\u952e\u7684\u5bb6\u5ead\u652f\u6301\u3001\u7ecf\u6d4e\u72b6\u51b5\u53ca\u8fc7\u5f80\u632b\u6298\u5e94\u5bf9\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u5174\u8da3\u4e0e\u53d8\u73b0\u6df7\u5408\u9a71\u52a8**\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u4e86\u5bf9\u6709\u58f0\u6f14\u64ad\u7684\u70ed\u7231\uff08\u201c\u559c\u6b22\u70ed\u7231\u6709\u58f0\u6f14\u64ad\u201d\uff09\uff0c\u5e76\u5c06\u5176\u89c6\u4e3a\u4e00\u79cd\u5174\u8da3\u548c\u7559\u4e0b\u56de\u5fc6\u7684\u65b9\u5f0f\u3002\u540c\u65f6\uff0c\u4e5f\u5f3a\u70c8\u5e0c\u671b\u201c\u5f00\u542f\u53d8\u73b0\u517c\u804c\u6216\u5168\u804c\u201d\u3001\u201c\u5feb\u901f\u5165\u884c\u53d8\u73b0\u62ff\u8d44\u6e90\u201d\u3001\u201c\u6bcf\u6708\u6709\u6536\u5165\u6700\u597d\u201d\u3002\u52a8\u673a\u6df7\u6742\uff0c\u4f46\u5174\u8da3\u6210\u5206\u663e\u8457\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u2460\u559c\u6b22\u70ed\u7231\u6709\u58f0\u6f14\u64ad\uff0c\u559c\u6b22\u8bd7\u8bcd\u6717\u8bf5\uff0c\u57f9\u517b\u4e00\u79cd\u5174\u8da3\u7231\u597d\uff0c\u7ed9\u81ea\u5df1\u7559\u4e0b\u4e00\u4e9b\u58f0\u97f3\u548c\u4f5c\u54c1\u6216\u8005\u662f\u7f8e\u597d\u7684\u56de\u5fc6...\u2464\u8981\u5feb\u901f\u5165\u884c\u53d8\u73b0\u62ff\u8d44\u6e90\u7684\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[**\u4fe1\u606f\u4e0d\u8db3**] \u2014 \u4ec5\u5bf9\u4ef7\u683c\u654f\u611f\uff08\u201c\u5e0c\u671b\u4e0d\u8981\u592a\u8d35\u201d\uff09\uff0c\u672a\u63d0\u53ca\u652f\u4ed8\u538b\u529b\u6216\u8d44\u91d1\u6765\u6e90\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[**\u4e2d**] \u2014 \u660e\u786e\u6bcf\u5929\u67092\u5c0f\u65f6\u788e\u7247\u65f6\u95f4\uff0c\u4e14\u8868\u793a\u4e0d\u5f71\u54cd\u4e3b\u4e1a\u3002\u65f6\u95f4\u76f8\u5bf9\u56fa\u5b9a\uff0c\u4f46\u603b\u91cf\u6709\u9650\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[**\u4fe1\u606f\u4e0d\u8db3**] \u2014 \u63d0\u53ca\u201c\u5e73\u8861\u5bb6\u5ead\u201d\uff0c\u4f46\u672a\u8bf4\u660e\u5bb6\u4eba\u6001\u5ea6\u3002\u5b58\u5728**\u6f5c\u5728\u98ce\u9669**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u4f5c\u4e1a\u6311\u6218\uff08\u201c\u771f\u96be\uff0c\u6ca1\u6709\u628a\u4e09\u4e2a\u89d2\u8272\u533a\u522b\u51fa\u6765\u201d\uff09\u65f6\uff0c\u6001\u5ea6\u79ef\u6781\uff08\u201c\u4e5f\u662f\u60f3\u6311\u6218\u4e00\u4e0b\u201d\uff09\uff0c\u80fd\u63a5\u53d7\u53cd\u9988\uff08\u201c\u8c22\u8c22\uff01\u8001\u5e08\u771f\u5389\u5bb3\u201d\uff09\uff0c\u5e76\u4e3b\u52a8\u5bfb\u6c42\u989d\u5916\u7ec3\u4e60\uff08\u201c\u5e08\u59d0\uff0c\u4f60\u80fd\u628a\u6628\u5929\u90a3\u4e2a\u6050\u6016\u7684\u65c1\u767d\u5185\u5bb9\u53d1\u7ed9\u6211\u770b\u770b\u5417\uff1f\u6211\u60f3\u5f55\u4e0b\u4f60\u542c\u4e0b\u201d\uff09\u3002\u8868\u73b0\u51fa\u8f83\u5f3a\u7684\u5b66\u4e60\u97e7\u6027\u548c\u4e3b\u52a8\u6027\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u771f\u96be\uff0c\u6ca1\u6709\u9009\u513f\u7ae5\u7684\uff0c\u9009\u7684\u7b2c\u4e8c\u4e2a\uff0c\u6211\u597d\u50cf\u6ca1\u6709\u628a\u4e09\u4e2a\u89d2\u8272\u533a\u522b\u51fa\u6765\u3002\u4e5f\u662f\u60f3\u6311\u6218\u4e00\u4e0b\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 (\u5f52\u5c5e\u4e0e\u8ba4\u53ef)** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5728\u5bb6\u5ead\u89d2\u8272\uff08\u6bcd\u4eb2\uff09\u548c\u81ea\u6211\u4ef7\u503c\u5b9e\u73b0\u4e4b\u95f4\u5bfb\u6c42\u5e73\u8861\u4e0e\u8ba4\u53ef\u3002\u5979\u5e0c\u671b\u201c\u7ed9\u81ea\u5df1\u7559\u4e0b\u4e00\u4e9b\u58f0\u97f3\u548c\u4f5c\u54c1\u201d\uff0c\u5e76\u201c\u5e26\u7740\u5b69\u5b50\u4e00\u8d77\u9605\u8bfb\u201d\uff0c\u8fd9\u4e0d\u4ec5\u662f\u6280\u80fd\u5b66\u4e60\uff0c\u66f4\u662f\u5bfb\u6c42\u4e00\u79cd\u80fd\u83b7\u5f97\u5bb6\u5ead\u4e0e\u793e\u4f1a\u53cc\u91cd\u8ba4\u53ef\u7684\u3001\u6709\u610f\u4e49\u7684\u8eab\u4efd\u6807\u7b7e\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u201d\u548c\u201c\u88ab\u80af\u5b9a\u201d\u7684\u6210\u5c31\u611f**\u3002\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u770b\u597d\u4f60\u201d\u3001\u201c\u58f0\u97f3\u6761\u4ef6\u5f88\u4e0d\u9519\u201d\u3001\u201c\u620f\u611f\u548c\u58f0\u7ebf\u5f88\u559c\u6b22\u201d\uff0c\u7528\u6237\u5bf9\u6b64\u79ef\u6781\u56de\u5e94\u3002\u5979\u9700\u8981\u7684\u662f\u901a\u8fc7\u4e13\u4e1a\u5b66\u4e60\uff0c\u83b7\u5f97\u4e00\u4e2a\u80fd\u8bc1\u660e\u81ea\u5df1\u201c\u6709\u4ef7\u503c\u201d\u3001\u201c\u6709\u6f5c\u529b\u201d\u7684\u5708\u5c42\u8eab\u4efd\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u5174\u8da3\u4e0e\u53d8\u73b0\u6df7\u5408\u9a71\u52a8\uff0c\u6709\u4e00\u5b9a\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b\uff0c\u4f46\u9700\u8b66\u60d5\u9884\u671f\u7ba1\u7406) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T5 \u597d\u73a9\u5c1d\u9c9c\u578b** (\u5174\u8da3\u9a71\u52a8\u660e\u663e\uff0c\u4eab\u53d7\u5b66\u4e60\u8fc7\u7a0b\u5e26\u6765\u7684\u65b0\u9c9c\u611f\u548c\u6210\u5c31\u611f\uff0c\u5bf9\u793e\u7fa4\u4e92\u52a8\u548c\u5c55\u793a\u6709\u9700\u6c42\uff0c\u53d8\u73b0\u671f\u671b\u5b58\u5728\u4f46\u975e\u552f\u4e00\u76ee\u7684) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u7edd\u5883\u7b49\u660e\u786e\u4fe1\u53f7\u3002**\u4f46\u5bb6\u5ead\u652f\u6301\u5ea6\u672a\u77e5\u662f\u6f5c\u5728\u98ce\u9669\u70b9**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u82e5\u5b66\u4e60\u6295\u5165\uff08\u65f6\u95f4\u3001\u91d1\u94b1\uff09\u4e0e\u5bb6\u5ead\u8d23\u4efb\uff08\u7167\u987e\u5b69\u5b50\uff09\u4ea7\u751f\u51b2\u7a81\uff0c\u4e14\u5bb6\u4eba\u4e0d\u77e5\u60c5\u6216\u53cd\u5bf9\uff0c\u53ef\u80fd\u5f15\u53d1\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u6bcf\u59292\u5c0f\u65f6\u65f6\u95f4\u76f8\u5bf9\u56fa\u5b9a\uff0c\u81ea\u5f8b\u6027\u5c1a\u53ef\uff0c\u8ddf\u8fdb\u538b\u529b\u4e0d\u5927\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u4e3b\u52a8\u9762\u5bf9\u6311\u6218\u5e76\u5bfb\u6c42\u5e2e\u52a9\uff0c\u4e0d\u6613\u56e0\u5b66\u4e60\u632b\u6298\u76f4\u63a5\u653e\u5f03\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u5bf9\u201c\u5feb\u901f\u5165\u884c\u53d8\u73b0\u201d\u6709\u671f\u5f85\u3002\u82e5\u5b66\u4e60\u521d\u671f\uff08\u59821-2\u4e2a\u6708\uff09\u672a\u83b7\u5f97\u4efb\u4f55\u6b63\u5411\u53cd\u9988\uff08\u5982\u8bd5\u97f3\u673a\u4f1a\u3001\u5c0f\u989d\u6536\u5165\uff09\uff0c\u53ef\u80fd\u4ea7\u751f\u5931\u671b\u60c5\u7eea\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c4-8\u5468\uff08\u201c\u6b7b\u4ea1\u8c37\u201d\u9636\u6bb5\uff09**\u3002\u5f53\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u7cfb\u7edf\u5b66\u4e60\u8fdb\u5165\u67af\u71e5\u671f\uff0c\u4e14\u53d8\u73b0\u627f\u8bfa\u672a\u5373\u65f6\u5151\u73b0\u65f6\uff0c\u52a8\u529b\u5bb9\u6613\u4e0b\u6ed1\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u9759\u5f85\u82b1\u5f00\u540c\u5b66\uff0c\u6b22\u8fce\u4f60\uff01\u770b\u4e86\u4f60\u7684\u5b66\u4e60\u76ee\u6807\uff0c\u7279\u522b\u611f\u52a8\u3002\u80fd\u628a\u70ed\u7231\u3001\u5bb6\u5ead\u548c\u6210\u957f\u7ed3\u5408\u5f97\u8fd9\u4e48\u597d\uff0c\u4f60\u672c\u8eab\u5c31\u662f\u4e2a\u5f88\u6709\u80fd\u91cf\u7684\u5988\u5988\u3002\u5728\u8fd9\u91cc\uff0c\u4f60\u4e0d\u4ec5\u80fd\u5b66\u5230\u6280\u80fd\uff0c\u66f4\u80fd\u627e\u5230\u4e00\u4e2a\u8ba9\u4f60\u88ab\u2018\u542c\u89c1\u2019\u3001\u88ab\u2018\u770b\u89c1\u2019\u7684\u821e\u53f0\u3002\u6211\u4eec\u6162\u6162\u6765\uff0c\u5148\u4eab\u53d7\u7528\u58f0\u97f3\u521b\u9020\u7f8e\u597d\u7684\u8fc7\u7a0b\uff0c\u53d8\u73b0\u662f\u6c34\u5230\u6e20\u6210\u7684\u4e8b\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5174\u8da3\u6e38\u4e50\u7ebf**\u3011\u3002\u4ee5\u5174\u8da3\u548c\u6210\u5c31\u611f\u9a71\u52a8\u4e3a\u4e3b\uff0c\u5f31\u5316\u524d\u671f\u53d8\u73b0\u538b\u529b\uff0c\u5f3a\u5316\u793e\u7fa4\u5c55\u793a\u3001\u4f5c\u54c1\u8f93\u51fa\u548c\u8f7b\u91cf\u7ea7\u8ba4\u53ef\u4f53\u7cfb\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n    1.  **\u3010\u4eb2\u5b50\u5171\u8bfb\u5b9e\u8df5\u5305\u3011**\uff1a\u7ed3\u5408\u5979\u201c\u5e26\u5b69\u5b50\u9605\u8bfb\u201d\u7684\u9700\u6c42\uff0c\u63d0\u4f9b\u513f\u7ae5\u8bfb\u7269\u6f14\u64ad\u6280\u5de7\u548c\u4eb2\u5b50\u5171\u8bfb\u6d3b\u52a8\uff0c\u5c06\u5b66\u4e60\u4e0e\u5bb6\u5ead\u573a\u666f\u7ed3\u5408\uff0c\u63d0\u5347\u4ef7\u503c\u611f\u548c\u575a\u6301\u52a8\u529b\u3002\n    2.  **\u3010\u8f7b\u91cf\u7ea7\u6210\u5c31\u89e3\u9501\u5305\u3011**\uff1a\u8bbe\u7f6e\u9636\u6bb5\u6027\u5c0f\u76ee\u6807\uff08\u5982\u5b8c\u6210\u7b2c\u4e00\u4e2a\u6545\u4e8b\u4e13\u8f91\u3001\u83b7\u5f97\u7b2c\u4e00\u4e2a\u542c\u4f17\u8bc4\u8bba\uff09\uff0c\u5e76\u53ca\u65f6\u7ed9\u4e88\u52cb\u7ae0\u3001\u8bc1\u4e66\u7b49\u865a\u62df\u8363\u8a89\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1.  \u5728\u5f00\u8425\u521d\u671f\u8fc7\u5ea6\u5f3a\u8c03\u201c\u6708\u5165\u8fc7\u4e07\u201d\u3001\u201c\u5feb\u901f\u66b4\u5bcc\u201d\uff0c\u907f\u514d\u62c9\u9ad8\u5176\u77ed\u671f\u53d8\u73b0\u9884\u671f\u3002\n    2.  \u5e03\u7f6e\u8fc7\u4e8e\u67af\u71e5\u3001\u91cd\u590d\u6027\u9ad8\u7684\u7eaf\u6280\u5de7\u7ec3\u4e60\uff0c\u6d88\u8017\u5176\u5174\u8da3\u3002\n    3.  \u5ffd\u89c6\u5176\u201c\u88ab\u770b\u89c1\u201d\u7684\u9700\u6c42\uff0c\u4e0d\u5728\u793e\u7fa4\u4e2d\u7ed9\u4e88\u5176\u4f5c\u54c1\u5c55\u793a\u548c\u516c\u5f00\u8868\u626c\u7684\u673a\u4f1a\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u524d\u671f\u4e25\u7981\u5927\u989d\u5347\u5355**\u3002\u53ef\u8003\u8651\u5728\u5b66\u5458\u53d6\u5f97\u660e\u663e\u8fdb\u6b65\u5e76\u83b7\u5f97\u6210\u5c31\u611f\u540e\uff08\u5982\u5b8c\u6210\u7b2c\u4e00\u4e2a\u4f5c\u54c1\u96c6\uff09\uff0c\u63a8\u8350500\u5143\u4ee5\u5185\u7684\u5fae\u5347\u5355\uff08\u5982\u7279\u8272\u58f0\u7ebf\u7cbe\u4fee\u8bfe\uff09\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u2460\u559c\u6b22\u70ed\u7231\u6709\u58f0\u6f14\u64ad\uff0c\u559c\u6b22\u8bd7\u8bcd\u6717\u8bf5\uff0c\u57f9\u517b\u4e00\u79cd\u5174\u8da3\u7231\u597d\uff0c\u7ed9\u81ea\u5df1\u7559\u4e0b\u4e00\u4e9b\u58f0\u97f3\u548c\u4f5c\u54c1\u6216\u8005\u662f\u7f8e\u597d\u7684\u56de\u5fc6\u201d\n2. > \u201c\u4e5f\u662f\u60f3\u6311\u6218\u4e00\u4e0b\u201d\n3. > \u201c\u8c22\u8c22\uff01\u8001\u5e08\u771f\u5389\u5bb3\uff0c\u6211\u6ca1\u60f3\u5230\u767d\u5929\u548c\u665a\u4e0a\u8fd8\u6709\u533a\u522b[\u5f3a]\u633a\u597d\u73a9\u7684\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T5 \u597d\u73a9\u5c1d\u9c9c\u578b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u4e0e\u8ba4\u53ef\uff0c\u5728\u5bb6\u5ead\u89d2\u8272\u5916\u5efa\u7acb\u6709\u4ef7\u503c\u7684\u81ea\u6211\u8eab\u4efd\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7528\u201c\u5174\u8da3\u6e38\u4e50\u7ebf\u201d\u548c\u201c\u6210\u5c31\u8ba4\u53ef\u4f53\u7cfb\u201d\u7ef4\u7cfb\u5176\u5b66\u4e60\u70ed\u60c5\uff0c\u5ef6\u8fdf\u5e76\u7ba1\u7406\u5176\u53d8\u73b0\u9884\u671f\u3011**\u3002\n\n```json\n{\"core_type\": \"T5 \u597d\u73a9\u5c1d\u9c9c\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf+\u4eb2\u5b50\u5171\u8bfb\u5b9e\u8df5\u5305+\u8f7b\u91cf\u7ea7\u6210\u5c31\u89e3\u9501\u5305\"}\n```";
