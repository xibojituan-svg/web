        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 569172210 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-06 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6709\u58f0\u5c0f\u6e145 / \u5b98\u65b9\u52a9\u6559-\u68a6\u5883 (\u4e8e\u53cc\u53cc) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u9a6c\u62c9\u96c5\u6709\u58f0\u6f14\u64ad\u4f53\u9a8c\u8425/\u9ad8\u9636\u73ed (7380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u672a\u77e5 (\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1 (\u767d\u5929\u5728\u5916\u529e\u4e8b\uff0c\u53ea\u80fd\u6234\u8033\u673a\u542c\u76f4\u64ad) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u672a\u77e5 (\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca) |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e2d\u7b49 (\u6709\u5b66\u4e60\u884c\u4e3a\u4e0e\u4e92\u52a8\uff0c\u4f46\u5173\u952e\u652f\u4ed8\u4e0e\u5bb6\u5ead\u4fe1\u606f\u7f3a\u5931) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06**\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u9a8c\u8bc1\u4e0e\u53d8\u73b0\u800c\u6765\uff0c\u5173\u6ce8\u81ea\u8eab\u5b9e\u529b\u4e0e\u5e02\u573a\u5339\u914d\u5ea6\uff0c\u800c\u975e\u5355\u7eaf\u77ed\u671f\u66b4\u5bcc\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u5bf9\u54ea\u4e9b\u611f\u5174\u8da3\u7684\u90fd\u5f97\u82b1\u94b1\uff0c\u73b0\u5728\u5c31\u662f\u4e0d\u60f3\u82b1\u94b1\u4e86\uff0c\u6211\u5c31\u60f3\u770b\u770b\u6211\u6709\u591a\u5927\u80fd\u529b\uff0c\u80fd\u63a5\u5355\uff0c\u80fd\u8d5a\u94b1\u5417\u201d\n  > \u201c\u4f60\u8bf4\u8fd9\u4e2a\u4e00\u4e2a\u5c0f\u65f6100\u5757\u94b1\u8fd8\u5c11\u5417\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1**\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u660e\u786e\u8868\u793a\u201c\u73b0\u5728\u5c31\u662f\u4e0d\u60f3\u82b1\u94b1\u4e86\u201d\uff0c\u5bf9\u518d\u6b21\u4ed8\u8d39\u5b66\u4e60\u6709\u62b5\u89e6\uff0c\u8d44\u91d1\u53ef\u80fd\u4e0d\u5bbd\u88d5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u5b8c\u6210\u6253\u5361\u548c\u4f5c\u4e1a\uff0c\u4f46\u767d\u5929\u5728\u5916\u529e\u4e8b\uff0c\u65f6\u95f4\u788e\u7247\u5316\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u672a\u77e5** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07**\u4f4e**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u6709\u4e00\u5b9a\u81ea\u6211\u8c03\u6574\u80fd\u529b\uff0c\u4f46\u9047\u5230\u64cd\u4f5c\u95ee\u9898\uff08\u5982\u8bd5\u97f3\u5355\u81ea\u52a8\u4e0a\u4f20\uff09\u4f1a\u8868\u73b0\u51fa\u660e\u663e\u7684\u7126\u8651\u548c\u4f9d\u8d56\uff0c\u9700\u8981\u73ed\u4e3b\u4efb\u7acb\u5373\u5b89\u629a\u548c\u89e3\u91ca\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u8001\u5e08\uff0c\u5feb\u70b9\u513f\uff0c\u6628\u5929\u4f60\u7ed9\u6211\u90a3\u4e2a\u8bd5\u97f3100\u5143\u90a3\u4e2a\u5355\uff0c\u5b83\u600e\u4e48\u81ea\u52a8\u5c31\u4e0a\u4f20\u4e86\uff1f\u6211\u5bfb\u601d\u6211\u8bd5\u4e00\u4e0b\u5462\uff0c\u81ea\u52a8\u4e0a\u4f20\u4e86\u600e\u4e48\u529e\u5462\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 (\u7126\u8651\u4fdd\u969c)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u201c\u88ab\u5272\u97ed\u83dc\u201d\u7684\u6df1\u5ea6\u6050\u60e7\u548c\u4e0d\u4fe1\u4efb\u611f**\u3002\u4ed6\u66fe\u5728\u201c\u68a8\u82b1\u201d\u673a\u6784\u5b66\u4e60\u5e76\u4e0a\u67b6\u8fc7\u4f5c\u54c1\uff0c\u4f46\u8ba4\u4e3a\u5bf9\u65b9\u201c\u4e0d\u9760\u8c31\uff0c\u5272\u97ed\u83dc\u592a\u5389\u5bb3\u201d\uff0c\u56e0\u6b64\u5bf9\u65b0\u7684\u5b66\u4e60\u673a\u4f1a\u62b1\u6709\u6781\u5f3a\u7684\u8b66\u60d5\u5fc3\uff0c\u6838\u5fc3\u8bc9\u6c42\u662f\u9a8c\u8bc1\u81ea\u8eab\u80fd\u529b\u80fd\u5426\u5b89\u5168\u3001\u53ef\u9760\u5730\u53d8\u73b0\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u5b89\u5168\u9a8c\u8bc1\u201d\u4e0e\u201c\u5b9e\u529b\u8ba4\u53ef\u201d**\u3002\u901a\u8fc7\u63d0\u4f9b\u771f\u5b9e\u7684\u8bd5\u97f3\u673a\u4f1a\u3001\u7ec6\u81f4\u7684\u4e13\u4e1a\u53cd\u9988\uff08\u5982\u58f0\u97f3\u9274\u5b9a\uff09\u548c\u660e\u786e\u7684\u63a5\u5355\u8def\u5f84\uff0c\u9010\u6b65\u5efa\u7acb\u4ed6\u5bf9\u5e73\u53f0\u201c\u9760\u8c31\u201d\u7684\u4fe1\u4efb\uff0c\u6d88\u9664\u5176\u88ab\u201c\u5272\u97ed\u83dc\u201d\u7684\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5 C2\u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u8bba** (\u53d8\u73b0\u9a71\u52a8\uff0c\u4f46\u6709\u524d\u8f66\u4e4b\u9274\uff0c\u8b66\u60d5\u6027\u9ad8) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5c5e\u53cd\u5bf9\u7b49\u6781\u7aef\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u65e0\u6cd5\u5224\u65ad\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4e2d | \u65f6\u95f4\u788e\u7247\u5316\uff0c\u82e5\u8bfe\u7a0b\u8282\u594f\u8fc7\u5feb\u6216\u4f5c\u4e1a\u5bc6\u96c6\uff0c\u53ef\u80fd\u56e0\u65e0\u6cd5\u8ddf\u4e0a\u800c\u81ea\u8d23\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4e2d | \u5bf9\u5e73\u53f0\u64cd\u4f5c\uff08\u5982\u8bd5\u97f3\u63d0\u4ea4\uff09\u4e0d\u719f\u6089\u65f6\u6613\u4ea7\u751f\u7126\u8651\uff0c\u82e5\u5f97\u4e0d\u5230\u53ca\u65f6\u3001\u6e05\u6670\u7684\u89e3\u7b54\uff0c\u53ef\u80fd\u56e0\u201c\u9ebb\u70e6\u201d\u800c\u9000\u7f29\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\uff1a\u82e5\u4ed8\u8d39\u540e\u77ed\u671f\u5185\uff08\u59821-2\u4e2a\u6708\uff09\u672a\u63a5\u5230\u7b26\u5408\u5176\u5fc3\u7406\u4ef7\u4f4d\uff08\u5982\u65f6\u85aa100\u5143\uff09\u7684\u5355\u5b50\uff0c\u6216\u611f\u89c9\u6240\u5b66\u5185\u5bb9\u4e0e\u201c\u68a8\u82b1\u201d\u673a\u6784\u5dee\u5f02\u4e0d\u5927\uff0c\u4f1a\u7acb\u523b\u89e6\u53d1\u201c\u53c8\u88ab\u5272\u97ed\u83dc\u201d\u7684\u8ba4\u77e5\uff0c\u5f15\u53d1\u5f3a\u70c8\u9000\u8d39\u8bc9\u6c42\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u4ed8\u8d39\u540e\u7b2c1-2\u4e2a\u6708**\uff0c\u5373\u9996\u6b21\u8bd5\u97f3\u9ad8\u5cf0\u671f\u8fc7\u540e\u82e5\u63a5\u5355\u7ed3\u679c\u4e0d\u7406\u60f3\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6211\u5b8c\u5168\u7406\u89e3\u4f60\u5bf9\u2018\u5272\u97ed\u83dc\u2019\u7684\u62c5\u5fc3\uff0c\u6bd5\u7adf\u5403\u8fc7\u4e8f\u3002\u54b1\u4eec\u559c\u64ad\u4e0d\u4e00\u6837\uff0c\u4e0d\u9760\u753b\u5927\u997c\uff0c\u5c31\u9760\u771f\u672c\u4e8b\u548c\u771f\u5355\u5b50\u8bf4\u8bdd\u3002\u63a5\u4e0b\u6765\u6211\u4f1a\u5e26\u4f60\u4e00\u6b65\u6b65\u9a8c\u8bc1\u4f60\u7684\u5b9e\u529b\uff0c\u770b\u5230\u5e95\u80fd\u63a5\u5230\u4ec0\u4e48\u6837\u7684\u6d3b\uff0c\u8d5a\u5230\u591a\u5c11\u94b1\u3002\u54b1\u4eec\u7528\u7ed3\u679c\u8bc1\u660e\uff0c\u597d\u4e0d\u597d\uff1f\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** (\u4ea7\u54c1\u7ebfA)\u3002\u5fc5\u987b\u5339\u914d\u5176\u201c\u9a8c\u8bc1\u5b9e\u529b\u201d\u7684\u6838\u5fc3\u8bc9\u6c42\uff0c\u8bfe\u7a0b\u5185\u5bb9\u9700\u624e\u5b9e\u3001\u6709\u660e\u786e\u7684\u6280\u80fd\u8fdb\u9636\u548c\u63a5\u5355\u8def\u5f84\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u64cd\u4f5c\u7126\u8651\u548c\u6536\u76ca\u843d\u5dee\u9ad8\u98ce\u9669\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u7cbe\u786e\u6d3e\u5355\u62e6\u622a\u5305(B\u6a21\u5757)\u3011** \u4e0e **\u3010\u9636\u6bb5\u6027\u6210\u679c\u53ef\u89c6\u5316\u5305\u3011**\u3002\u5373\uff1a1) \u4e25\u683c\u7b5b\u9009\u4e0e\u5176\u80fd\u529b\u5339\u914d\u7684\u771f\u5b9e\u8bd5\u97f3\u5355\uff0c\u907f\u514d\u76f2\u76ee\u6295\u9012\u632b\u8d25\u4fe1\u5fc3\uff1b2) \u5b9a\u671f\u5c55\u793a\u540c\u9636\u6bb5\u5b66\u5458\u7684\u771f\u5b9e\u63a5\u5355\u6848\u4f8b\u4e0e\u6536\u5165\u622a\u56fe\uff0c\u7528\u4e8b\u5b9e\u5efa\u7acb\u4fe1\u4efb\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u4f7f\u7528\u201c\u4fdd\u5e95\u6536\u5165\u201d\u3001\u201c\u8f7b\u677e\u6708\u5165\u8fc7\u4e07\u201d\u7b49\u6a21\u7cca\u8bdd\u672f\uff1b\u5728\u5176\u672a\u83b7\u5f97\u5b9e\u8d28\u6027\u63a5\u5355\u6210\u679c\u524d\uff0c\u8fdb\u884c\u4efb\u4f55\u9ad8\u9636\u8bfe\u7a0b\u7684\u4ea4\u53c9\u63a8\u9500\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u9996\u6b21\u6210\u529f\u63a5\u5355\u524d\u8fdb\u884c\u5927\u989d\u5347\u5355**\u3002\u53ef\u8003\u8651\u5728\u9996\u6b21\u63a5\u5355\u5e76\u6536\u5230\u916c\u52b3\u540e\uff0c\u57fa\u4e8e\u5176\u201c\u80fd\u529b\u88ab\u9a8c\u8bc1\u201d\u7684\u6ee1\u8db3\u611f\uff0c\u63a8\u4ecb500\u5143\u4ee5\u5185\u7684\u5fae\u5347\u5355\u6216\u8bbe\u5907\u5468\u8fb9\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u73b0\u5728\u4e0d\u5b66\u4e86\uff0c\u6211\u89c9\u5f97\u4ed6\u4eec\u4e0d\u9760\u8c31\uff0c\u5272\u97ed\u83dc\u592a\u5389\u5bb3\u201d\n2. > \u201c\u5bf9\u54ea\u4e9b\u611f\u5174\u8da3\u7684\u90fd\u5f97\u82b1\u94b1\uff0c\u73b0\u5728\u5c31\u662f\u4e0d\u60f3\u82b1\u94b1\u4e86\uff0c\u6211\u5c31\u60f3\u770b\u770b\u6211\u6709\u591a\u5927\u80fd\u529b\uff0c\u80fd\u63a5\u5355\uff0c\u80fd\u8d5a\u94b1\u5417\u201d\n3. > \u201c\u4f60\u8bf4\u8fd9\u4e2a\u4e00\u4e2a\u5c0f\u65f6100\u5757\u94b1\u8fd8\u5c11\u5417\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4 \u641e\u94b1\u7ed3\u679c\u8bba\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u9700\u6c42\uff1a\u907f\u514d\u518d\u6b21\u88ab\u201c\u5272\u97ed\u83dc\u201d\uff0c\u5bfb\u6c42\u80fd\u529b\u9a8c\u8bc1\u4e0e\u53ef\u9760\u53d8\u73b0\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7528\u771f\u5b9e\u3001\u5339\u914d\u7684\u8bd5\u97f3\u673a\u4f1a\u548c\u6e05\u6670\u7684\u63a5\u5355\u8def\u5f84\uff0c\u9010\u6b65\u6784\u5efa\u201c\u9760\u8c31\u201d\u4fe1\u4efb\uff0c\u7edd\u5bf9\u7981\u6b62\u753b\u997c\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u8bba\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf(A\u7ebf)+\u7cbe\u786e\u6d3e\u5355\u62e6\u622a\u5305\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
