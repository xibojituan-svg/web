    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676502343 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-12 \u81f3 2026-04-03 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6c90\u6b4c(\u674e\u6653\u8273) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u4fe1\u606f\u7f3a\u5931\uff08\u804a\u5929\u8bb0\u5f55\u4e3a\u8bfe\u7a0b\u8fdb\u884c\u4e2d\uff0c\u672a\u63d0\u53ca\u5177\u4f53\u8bfe\u7a0b\u4e0e\u4ef7\u683c\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\uff08\u65e0\u4efb\u4f55\u652f\u4ed8\u65b9\u5f0f\u3001\u4ef7\u683c\u53cd\u5e94\u3001\u7ecf\u6d4e\u72b6\u51b5\u8ba8\u8bba\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\uff08\u65e0\u5de5\u4f5c\u5236\u5ea6\u3001\u4f5c\u606f\u3001\u5bb6\u5ead\u8d1f\u8377\u63cf\u8ff0\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\uff08\u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** - \u804a\u5929\u8bb0\u5f55\u96c6\u4e2d\u4e8e\u8bfe\u7a0b\u4ea4\u4ed8\u4e0e\u4f5c\u4e1a\u8f85\u5bfc\uff0c\u7f3a\u4e4f\u652f\u4ed8\u3001\u5bb6\u5ead\u3001\u65f6\u95f4\u7b49\u5173\u952e\u4e09\u8f74\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u5173\u6ce8\u6280\u672f\u63d0\u5347\u3001\u4f5c\u54c1\u8d28\u91cf\u4e0e\u6d41\u7a0b\u89c4\u8303\uff0c\u5bf9\u53d8\u73b0\u65e0\u6025\u5207\u8981\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u90fd\u6ca1\u5565\u5206\u4eab\u7684 \u505a\u7684\u90fd\u6ca1\u4ed6\u4eec\u597d **\u5c31\u60f3\u4f53\u9a8c\u4e0bS2.0\u7684\u6050\u6016\u4e4b\u5904**\u201d\n> \u201c\u9ebb\u70e6\u821f\u5927  \u8f9b\u82e6\u4e86\u201d\n> \u201c\u8fd9\u4e2d\u7684\u8fd8\u662f\u8981\u7ec3  \u4e0d\u7ec3\u4e0d\u77e5\u9053\u6d41\u7a0b \u505a\u8d77\u6765\u8d39\u52b2\u7684\u5f88\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u65e0\u4efb\u4f55\u652f\u4ed8\u3001\u7ecf\u6d4e\u72b6\u51b5\u4fe1\u606f\u3002\u57fa\u4e8e\u5176\u201c\u767d\u5ad6\u201d\u5386\u53f2\uff08\u201c\u4f1a\u5458\u90fd\u90fd\u706d\u5f00\u90fd\u662f\u767d\u5ad6\u201d\uff09\u548c\u201c\u5f00\u4e86\u9ad8\u7ea7\u4f1a\u5458\u201d\u7684\u8868\u8ff0\uff0c\u63a8\u6d4b\u4e3a\u81ea\u4e3b\u6d88\u8d39\uff0c\u4f46\u65e0\u6cd5\u5224\u65ad\u538b\u529b\u7b49\u7ea7\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u6295\u5165\u6574\u665a\u5236\u4f5c\u4f5c\u54c1\uff08\u201c\u8fd9\u4e2a\u505a\u4e86\u4e00\u4e2a\u665a\u4e0a\u201d\uff09\uff0c\u79ef\u6781\u53c2\u4e0e\u8bfe\u7a0b\u4e92\u52a8\u4e0e\u4f5c\u4e1a\uff0c\u65f6\u95f4\u6295\u5165\u5ea6\u9ad8\u3002\u4f46\u5177\u4f53\u5de5\u4f5c\u5236\u5ea6\u672a\u77e5\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u4fe1\u606f\u3002\n- **\u5e95\u5ea7\u53d6\u77ed\u677f**\uff1a**\u4e2d**\uff08\u56e0\u8d44\u91d1\u4e0e\u5bb6\u5ead\u7ef4\u5ea6\u4fe1\u606f\u7f3a\u5931\uff0c\u57fa\u4e8e\u73b0\u6709\u4fe1\u606f\u53d6\u201c\u65f6\u95f4\u4e0e\u7cbe\u529b\u201d\u7684\u4e2d\u7b49\u8bc4\u7ea7\uff0c\u4f46\u7f6e\u4fe1\u5ea6\u4f4e\uff09\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\uff0c\u79ef\u6781\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u5fc3\u6001\u5e73\u7a33\uff0c\u914d\u5408\u5ea6\u9ad8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c**\u6ca1\u4e8b \u660e\u5929\u90fd\u53ef\u4ee5** \u6211\u5c31\u662f\u521a\u505a\u597d \u8f9b\u82e6\u4e86\u5927\u5927\u201d\n> \u201c**\u4e3b\u8981\u95ee\u9898\u8fd8\u662f\u591a\u4eba\u7269\u7684\u4e00\u81f4\u6027\u8ddf\u6392\u7248\u5185\u5bb9**...\u9a6c\u4e0a\u8fd4\u5de5\u201d\n> \u201c**\u95ee\u4e0d\u6e05\u695a\u5c31\u6015\u6295\u7a3f\u56e0\u4e3a\u6b65\u9aa4\u9519\u8fc7\u4e86\u53ef\u60dc\u4e86**\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u81ea\u8eab\u4f5c\u54c1\u8d28\u91cf\u6709\u8f83\u9ad8\u8981\u6c42\uff08\u201c\u505a\u7684\u90fd\u6ca1\u4ed6\u4eec\u597d\u201d\uff09\uff0c\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u5148\u8fdb\u5de5\u5177\uff08S2.0\uff09\u548c\u89c4\u8303\u6d41\u7a0b\u6765\u63d0\u5347\u4e13\u4e1a\u80fd\u529b\uff0c\u5b9e\u73b0\u6280\u672f\u7cbe\u8fdb\u548c\u521b\u4f5c\u4e0a\u7684\u7a81\u7834\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u6df1\u5ea6\u8ba4\u53ef\u4e0e\u8d44\u6e90\u5bf9\u63a5**\u3002\u4ed6\u9700\u8981\u88ab\u5f53\u4f5c\u201c\u51c6\u4e13\u4e1a\u4eba\u58eb\u201d\u5bf9\u5f85\uff0c\u83b7\u5f97\u6280\u672f\u6307\u5bfc\u3001\u6d41\u7a0b\u89e3\u60d1\u4ee5\u53ca\u4e0e\u9ad8\u624b\uff08\u5982\u665a\u821f\u5927\u5927\uff09\u4ea4\u6d41\u7684\u673a\u4f1a\uff0c\u6ee1\u8db3\u5176\u63a2\u7d22\u6b32\u548c\u6210\u5c31\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b (\u6210\u957f\u6295\u8d44\u578b)** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T3 \u6b7b\u78d5\u5b66\u9738\u578b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4f4e** | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u7528\u6237\u8868\u73b0\u72ec\u7acb\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u5b66\u4e60\u6295\u5165\u5ea6\u9ad8\uff0c\u4e3b\u52a8\u6027\u5f3a\uff0c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u53ef\u89c1\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u5230\u95ee\u9898\u4e3b\u52a8\u6c42\u89e3\uff0c\u4e0d\u60c5\u7eea\u5316\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4f4e** | \u52a8\u673a\u7eaf\u5ea6\u9ad8\uff0c\u5173\u6ce8\u6280\u80fd\u6210\u957f\u800c\u975e\u77ed\u671f\u53d8\u73b0\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u6781\u4f4e\u98ce\u9669**\u3002\u8be5\u7528\u6237\u5c5e\u4e8e\u9ad8\u52a8\u673a\u3001\u9ad8\u5f39\u6027\u7684\u5b66\u4e60\u9a71\u52a8\u578b\uff0c\u9000\u8d39\u98ce\u9669\u4e3b\u8981\u5b58\u5728\u4e8e**\u4ea7\u54c1\u65e0\u6cd5\u6ee1\u8db3\u5176\u6df1\u5ea6\u5b66\u4e60\u548c\u4e13\u4e1a\u8fdb\u9636\u9700\u6c42**\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6768\u540c\u5b66\uff0c\u770b\u5230\u4f60\u5bf9S2.0\u548c\u4f5c\u54c1\u7ec6\u8282\u8fd9\u4e48\u6709\u94bb\u7814\u7cbe\u795e\uff0c\u7edd\u5bf9\u662f\u54b1\u4eec\u73ed\u7684\u2018\u6280\u672f\u62c5\u5f53\u2019\u3002\u540e\u7eed\u6709\u4efb\u4f55\u6df1\u5ea6\u7684\u6280\u672f\u95ee\u9898\u6216\u60f3\u6311\u6218\u66f4\u9ad8\u9636\u7684\u5546\u5355\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u7ed9\u4f60\u5bf9\u63a5\u66f4\u4e13\u4e1a\u7684\u8d44\u6e90\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** + **\u3010\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\u3011**\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T3\u6b7b\u78d5\u5b66\u9738\u578b\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a**\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011**\uff08\u5982\u4e13\u5c5e\u6280\u672f\u7b54\u7591\u901a\u9053\uff09\u3001**\u3010\u9ad8\u9636\u5546\u5355\u5185\u63a8\u901a\u9053\u3011**\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u5b9d\u5988\u9006\u88ad\u201d\u3001\u201c\u5feb\u901f\u53d8\u73b0\u201d\u7b49\u4e0b\u6c89\u8bdd\u672f\u4e0e\u5176\u6c9f\u901a\uff1b\u907f\u514d\u80a4\u6d45\u7684\u5938\u5956\uff0c\u9700\u8981\u7ed9\u4e88\u5177\u4f53\u3001\u6709\u6df1\u5ea6\u7684\u6280\u672f\u53cd\u9988\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u63a8\u4ecb\u4e0e**\u6280\u672f\u6df1\u5ea6\u3001\u8d44\u6e90\u5bf9\u63a5\u76f8\u5173\u7684\u9ad8\u9636\u8bfe\u7a0b\u6216\u670d\u52a1**\uff0c\u4e25\u7981\u7528\u201c\u4fdd\u5e95\u6536\u5165\u201d\u4f5c\u4e3a\u5356\u70b9\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u90fd\u6ca1\u5565\u5206\u4eab\u7684 \u505a\u7684\u90fd\u6ca1\u4ed6\u4eec\u597d  \u5c31\u60f3\u4f53\u9a8c\u4e0bS2.0\u7684\u6050\u6016\u4e4b\u5904**\u201d\n2. > \u201c**\u8fd9\u4e2d\u7684\u8fd8\u662f\u8981\u7ec3  \u4e0d\u7ec3\u4e0d\u77e5\u9053\u6d41\u7a0b \u505a\u8d77\u6765\u8d39\u52b2\u7684\u5f88**\u201d\n3. > \u201c**\u95ee\u4e0d\u6e05\u695a\u5c31\u6015\u6295\u7a3f\u56e0\u4e3a\u6b65\u9aa4\u9519\u8fc7\u4e86\u53ef\u60dc\u4e86**\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T3 \u6b7b\u78d5\u5b66\u9738\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0\u4e0e\u6280\u672f\u7cbe\u8fdb\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6df1\u5ea6\u7684\u6280\u672f\u652f\u6301\u548c\u4e13\u4e1a\u5708\u5c42\u8d44\u6e90\u5bf9\u63a5\uff0c\u6ee1\u8db3\u5176\u63a2\u7d22\u548c\u6210\u957f\u9700\u6c42\u3011**\u3002\n\n```json\n{\"core_type\": \"T3 \u6b7b\u78d5\u5b66\u9738\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u6781\u4f4e\", \"maslow_need\": \"\u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u5708\u5c42\u5408\u4f19\u4eba\u7ebf + \u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\"}\n```";
