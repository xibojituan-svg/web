    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u4fe1\u9706-\u897f\u5b89-\u5973\u64ad |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-23 \u81f3 2026-03-29 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u7efe\u7efe\u73ed\u73ed\uff08\u5f20\u5a49\u94b0\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u6500\u767b\u8ba1\u5212\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u5206\u671f\u6216\u501f\u6b3e\u4fe1\u606f\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4e2d\u7b49**\u3002\u6709\u5168\u804c\u5de5\u4f5c\uff08\u9700\u7528\u817e\u8baf\u4f1a\u8bae\u5f00\u4f1a\uff09\uff0c\u9700\u517c\u987e\u5bb6\u5ead\uff08\u6709\u4e0a\u5c0f\u5b66\u7684\u513f\u5b50\uff09\uff0c\u4f46\u80fd\u4e3b\u52a8\u5b89\u6392\u65f6\u95f4\u5b66\u4e60\u3001\u8c03\u8bd5\u8bbe\u5907\u3001\u5b8c\u6210\u7ec3\u4e60\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u5df2\u62a5\u5907\u5e76\u652f\u6301**\u3002\u4e3b\u52a8\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\uff08\u513f\u5b50\u3001\u642c\u5bb6\uff09\uff0c\u672a\u8868\u73b0\u51fa\u9690\u7792\u6216\u53cd\u5bf9\u8ff9\u8c61\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u804a\u5929\u8bb0\u5f55\u8be6\u7ec6\uff0c\u8986\u76d6\u5b66\u4e60\u3001\u8bbe\u5907\u3001\u5bb6\u5ead\u3001\u4e92\u52a8\u7b49\u591a\u4e2a\u7ef4\u5ea6\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06**\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u5173\u6ce8\u6280\u80fd\u63d0\u5347\u3001\u8bbe\u5907\u8c03\u8bd5\u3001\u4f5c\u4e1a\u8d28\u91cf\uff0c\u5bf9\u53d8\u73b0\u65e0\u6025\u5207\u8981\u6c42\uff0c\u80fd\u7406\u6027\u770b\u5f85\u8bd5\u97f3\u5931\u8d25\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c**\u8fd9\u624d\u662f\u6b63\u5e38\u72b6\u6001**\u201d\uff08\u8bc4\u4ef7\u8bd5\u97f3\u5931\u8d25\uff09\uff1b> \u201c**\u4eca\u5e74\u65e9\u529f\u7684\u6269\u5145\uff0c\u8bb2\u5f97\u5168\u662f\u5e72\u8d27\uff0c\u5f88\u6709\u542f\u53d1**\u201d\uff1b> \u201c**\u6211\u611f\u89c9\u6211\u5e74\u9f84\u5927\u4e86\uff0c\u4e0d\u751c\uff0c\u4e0d\u9002\u5408\u751c\u7f8e\u98ce**\u201d\uff08\u5173\u6ce8\u81ea\u8eab\u97f3\u8272\u5b9a\u4f4d\uff09\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1**\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u5df2\u8d2d\u4e70\u4e13\u4e1a\u8bbe\u5907\uff08\u58f0\u5361\u3001\u8bdd\u7b52\uff09\uff0c\u5e76\u8ba1\u5212\u81ea\u5efa\u5f55\u97f3\u68da\uff08\u9884\u7b97200\u5143\u5185\uff09\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\uff0c\u4f46\u6d88\u8d39\u7406\u6027\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u6709\u5168\u804c\u5de5\u4f5c\u53ca\u5bb6\u5ead\u8d23\u4efb\uff08\u513f\u5b50\u201c\u9b54\u4e38\u201d\uff09\uff0c\u4f46\u80fd\u9ad8\u6548\u5229\u7528\u788e\u7247\u65f6\u95f4\uff08\u4e0a\u73ed\u8c03\u8bd5\u8bbe\u5907\u3001\u4e2d\u5348\u542c\u8bfe\u3001\u665a\u4e0a\u8f85\u5bfc\u5b69\u5b50\u540e\u5b66\u4e60\uff09\uff0c\u5b66\u4e60\u610f\u613f\u5f3a\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u9ad8** \u2014 \u4e3b\u52a8\u5206\u4eab\u5bb6\u5ead\u60c5\u51b5\uff08\u513f\u5b50\u7528\u7535\u8111\u3001\u642c\u5bb6\u8ba1\u5212\uff09\uff0c\u8bed\u6c14\u81ea\u7136\uff0c\u65e0\u5bb6\u5ead\u51b2\u7a81\u8ff9\u8c61\uff0c\u652f\u6301\u5ea6\u826f\u597d\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06**\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08WIFI\u6d88\u5931\u3001\u8f6f\u4ef6\u8bbe\u7f6e\uff09\u4e3b\u52a8\u641c\u7d22\u3001\u8bf7\u6559\uff0c\u903b\u8f91\u6e05\u6670\uff0c\u60c5\u7eea\u7a33\u5b9a\u3002\u80fd\u5b89\u6170\u4ed6\u4eba\uff0c\u63d0\u4f9b\u6b63\u5411\u60c5\u7eea\u4ef7\u503c\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c**\u6211\u7535\u8111\u6c34\u5e73\u5f88\u4e00\u822c**\u201d\uff08\u5766\u7136\u627f\u8ba4\u4e0d\u8db3\uff09\uff1b> \u201c**\u6211\u6597\u667a\u6597\u52c7\u4e8610\u5e74\u4e86\uff0c\u653e\u5f03\u4e86**\u201d\uff08\u5e7d\u9ed8\u5316\u89e3\u80b2\u513f\u538b\u529b\uff09\uff1b> \u201c**\u522b\u56e0\u4e3a\u5e74\u8f7b\u5c31\u4e0d\u7231\u60dc\u81ea\u5df1**\u201d\uff08\u4e3b\u52a8\u5173\u5fc3\u73ed\u4e3b\u4efb\uff0c\u5c55\u73b0\u5171\u60c5\u4e0e\u6210\u719f\uff09\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42** ] \u4e0e [ **\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u4e2d\u5e74\u5973\u6027\u5728\u5bb6\u5ead\u4e0e\u5de5\u4f5c\u4e4b\u5916\uff0c\u5bfb\u6c42**\u4e13\u4e1a\u9886\u57df\u7684\u8ba4\u53ef\u3001\u81ea\u6211\u4ef7\u503c\u7684\u91cd\u4f30\u4e0e\u9ad8\u8d28\u91cf\u7684\u793e\u4ea4\u8fde\u63a5**\u3002\u5979\u6000\u5ff5\u201c\u521d\u4e2d\u65f6\u4ee3\u88ab\u8001\u5e08\u624b\u628a\u624b\u6559\u201d\u7684\u611f\u89c9\uff0c\u6e34\u671b\u5728\u4e13\u4e1a\u793e\u7fa4\u4e2d\u83b7\u5f97\u8eab\u4efd\u8ba4\u540c\u548c\u60c5\u611f\u652f\u6301\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u7684\u80af\u5b9a\u3001\u6df1\u5ea6\u7684\u6280\u672f\u6307\u5bfc\u3001\u4ee5\u53ca\u5c06\u5979\u89c6\u4e3a\u201c\u6709\u6f5c\u529b\u7684\u540c\u884c\u201d\u800c\u975e\u201c\u666e\u901a\u5b66\u5458\u201d\u7684\u5c0a\u91cd\u611f**\u3002\u540c\u65f6\uff0c\u63d0\u4f9b\u6e29\u6696\u3001\u4e92\u52a9\u7684\u793e\u7fa4\u6c1b\u56f4\uff0c\u6ee1\u8db3\u5176\u60c5\u611f\u8fde\u63a5\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u9ad8\u52a8\u673a\u3001\u4e2d\u8d44\u6e90\u3001\u9ad8\u5f39\u6027\uff0c\u662f\u6838\u5fc3\u57f9\u517b\u7528\u6237) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u517c\u987e\u90e8\u5206T3\u6b7b\u78d5\u5b66\u9738\u7279\u8d28) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 **\u5b89\u5168\u672a\u89e6\u53d1**\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u5bb6\u5ead\u53cd\u5bf9\u7b49\u5371\u9669\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4f4e** | \u5bb6\u5ead\u77e5\u60c5\u4e14\u652f\u6301\uff0c\u513f\u5b50\u6559\u80b2\u662f\u91cd\u5fc3\u4f46\u672a\u5f62\u6210\u51b2\u7a81\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5f3a\uff0c\u80fd\u4e3b\u52a8\u534f\u8c03\u5de5\u4f5c\u3001\u5bb6\u5ead\u4e0e\u5b66\u4e60\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u4e8b\u4e3b\u52a8\u6c42\u89e3\uff0c\u60c5\u7eea\u7a33\u5b9a\u6210\u719f\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u867d\u4e0d\u6025\u4e8e\u53d8\u73b0\uff0c\u4f46\u82e5\u957f\u671f\uff08\u59823-6\u4e2a\u6708\u540e\uff09\u5728\u8bd5\u97f3\u3001\u63a5\u5355\u4e0a\u6beb\u65e0\u6b63\u5411\u53cd\u9988\uff0c\u53ef\u80fd\u4ea7\u751f\u4ef7\u503c\u8d28\u7591\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe4-8\u5468\u540e**\u3002\u5f53\u57fa\u7840\u6280\u80fd\u5b66\u4e60\u5b8c\u6bd5\uff0c\u8fdb\u5165\u5b9e\u6218\u8bd5\u97f3\u9636\u6bb5\uff0c\u82e5\u8fde\u7eed\u591a\u6b21\u5931\u8d25\u4e14\u5f97\u4e0d\u5230\u6709\u6548\u6307\u5bfc\uff0c\u53ef\u80fd\u56e0\u201c\u5c0a\u91cd\u9700\u6c42\u201d\u672a\u88ab\u6ee1\u8db3\u800c\u4ea7\u751f\u52a8\u6447\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4fe1\u9706\u59d0\uff0c\u770b\u5230\u60a8\u5bf9\u8bbe\u5907\u8c03\u8bd5\u548c\u65e9\u529f\u5185\u5bb9\u90fd\u94bb\u7814\u5f97\u8fd9\u4e48\u7ec6\uff0c\u7edd\u5bf9\u662f\u54b1\u4eec\u73ed\u7684\u2018\u6280\u672f\u62c5\u5f53\u2019\u548c\u2018\u5b66\u4e60\u59d4\u5458\u2019\u82d7\u5b50\u3002\u4ee5\u540e\u73ed\u91cc\u6709\u540c\u5b66\u9047\u5230\u6280\u672f\u95ee\u9898\uff0c\u53ef\u80fd\u8fd8\u5f97\u8bf7\u60a8\u591a\u6307\u70b9\u3002\u54b1\u4eec\u4e00\u8d77\uff0c\u4e0d\u4ec5\u628a\u4e66\u8bfb\u597d\uff0c\u66f4\u8981\u628a\u8fd9\u2018\u624b\u827a\u4eba\u2019\u7684\u6d3b\u513f\u7ec3\u7cbe\u4e86\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011+\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf**\u3011\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176T2\u5b9e\u5e72+T3\u94bb\u7814\u7279\u8d28\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010**\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743**\u3011\uff08\u5982\u4f18\u5148\u63a5\u5165\u4e13\u5bb6\u7b54\u7591\u3001\u63d0\u4f9b\u9ad8\u9636\u53c2\u6570\u8c03\u6574\u6307\u5357\uff09\u3002\u53ef\u8f7b\u91cf\u6302\u8f7d\u3010**\u8eab\u4efd\u5149\u73af\u6c60**\u3011\u6a21\u5757\uff0c\u5982\u9080\u8bf7\u62c5\u4efb\u5c0f\u7ec4\u957f\u6216\u6280\u672f\u987e\u95ee\uff0c\u6ee1\u8db3\u5176\u5c0a\u91cd\u4e0e\u793e\u4ea4\u9700\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5c06\u5979\u5f53\u4f5c\u201c\u5c0f\u767d\u201d\u6216\u201c\u60c5\u7eea\u5b89\u629a\u5bf9\u8c61\u201d\u8fdb\u884c\u8fc7\u5ea6\u7b80\u5355\u7684\u6559\u5b66\u3002\u907f\u514d\u53ea\u7ed9\u201c\u4f60\u597d\u68d2\u201d\u5f0f\u7684\u6d6e\u5938\u8868\u626c\uff0c\u5979\u9700\u8981\u7684\u662f\u5177\u4f53\u3001\u6709\u6df1\u5ea6\u7684\u6280\u672f\u53cd\u9988\u548c\u8ba4\u53ef\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u63a8\u4ecb\u4e0e**\u6280\u672f\u6df1\u5316\u3001\u8bbe\u5907\u5347\u7ea7\u3001\u9ad8\u9636\u6f14\u64ad\u6280\u5de7**\u76f8\u5173\u7684\u4e2d\u9ad8\u4ef7\u8bfe\u7a0b\u6216\u670d\u52a1\uff0c\u4e25\u7981\u63a8\u9500\u7eaf\u201c\u53d8\u73b0\u6377\u5f84\u201d\u6216\u201c\u60c5\u611f\u966a\u4f34\u201d\u7c7b\u4ea7\u54c1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u6211\u4eff\u4f5b\u56de\u5230\u4e86\u90a3\u4e2a\u6211\u6700\u6000\u5ff5\u7684\u521d\u4e2d\u65f6\u4ee3\uff0c\u56e0\u4e3a\u6211\u7684\u8001\u5e08\u7ed9\u6211\u4eec\u624b\u628a\u624b\u6559\uff0c\u78b0\u89c1\u7efe\u7efe\u89c9\u5f97\u6709\u4e00\u79cd\u88ab\u75bc\u60dc\u7684\u611f\u89c9\uff0c\u8001\u5e08\u771f\u7684\u662f\u4e00\u8154\u70ed\u60c5\uff0c\u6211\u559c\u6b22\u8fd9\u79cd\u5b66\u751f\u65f6\u4ee3\u7684\u611f\u89c9\uff0c\u5f53\u7efe\u7efe\u7684\u5b66\u751f\u597d\u5e78\u798f**\u201d \u2014\u2014 **\u66b4\u9732\u6838\u5fc3\u60c5\u611f\u9700\u6c42\uff1a\u88ab\u4e13\u4e1a\u5730\u6559\u5bfc\u3001\u88ab\u73cd\u60dc\u3001\u627e\u56de\u5b66\u4e60\u4e0e\u6210\u957f\u7684\u7eaf\u7cb9\u5feb\u4e50\u3002**\n2. > \u201c**\u8bbe\u5907\u4e0b\u5f55\u7684\u97f3\uff0c\u62fe\u97f3\u6548\u679c\u786e\u5b9e\u597d\uff0c\u90fd\u4e0d\u6562\u52a8\uff0c\u62ff\u4e00\u4e0b\u624b\u673a\u90fd\u80fd\u5f55\u4e0a**\u201d \u2014\u2014 **\u5173\u6ce8\u6280\u672f\u7ec6\u8282\u4e0e\u4e13\u4e1a\u6548\u679c\uff0c\u662f\u5178\u578b\u7684\u201c\u5b9e\u5e72\u5bb6\u201d\u5173\u6ce8\u70b9\u3002**\n3. > \u201c**\u5927\u5bb6\u5e2e\u6211\u542c\u542c\uff0c\u63d0\u70b9\u5efa\u8bae**\u201d & \u201c**\u5927\u5bb6\u5e2e\u6211\u770b\u770b\uff0c\u6ca1\u95ee\u9898\u6211\u5c31\u4e0b\u5355\u4e86**\u201d \u2014\u2014 **\u79ef\u6781\u878d\u5165\u793e\u7fa4\uff0c\u5bfb\u6c42\u4e92\u52a9\u4e0e\u8ba4\u53ef\uff0c\u540c\u65f6\u51b3\u7b56\u679c\u65ad\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2\u4f4e\u8c03\u5b9e\u5e72\u578b\uff08\u504fT3\u5b66\u9738\uff09\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u9886\u57df\u7684\u5c0a\u91cd\u4e0e\u9ad8\u8d28\u91cf\u7684\u793e\u7fa4\u5f52\u5c5e\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6df1\u5ea6\u7684\u6280\u672f\u6307\u5bfc\u4e0e\u8d4b\u4e88\u5176\u793e\u7fa4\u5185\u7684\u201c\u4e13\u5bb6\u201d\u8eab\u4efd\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u793e\u4ea4\u9700\u6c42\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\"}\n```";
