    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677171625 / \u6635\u79f0\uff1a\u6653\u7ea2 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u516d\u6708\u6668\u516e(\u5218\u519b) / \u5e03\u4e01(\u5218\u519b) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6500\u767b\u8ba1\u5212\u7cfb\u7edf\u8bfe (2380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3** (\u201c\u76ee\u524d\u5168\u90e8\u5bb6\u5f53\u90fd\u538b\u4e0a\u201d) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u5e7c\u513f\u6559\u5e08\uff0c\u6bcf\u59291-2\u5c0f\u65f6) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** (\u672a\u63d0\u53ca\uff0c\u9700\u91cd\u70b9\u6838\u67e5) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\uff0c\u5e26\u6709\u660e\u786e\u7684\u517c\u804c\u53d8\u73b0\u76ee\u7684\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u6781\u901f\u66b4\u5bcc\u7684\u72c2\u70ed\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u76ee\u524d\u7684\u72b6\u6001\u662f\u80fd\u529b\u6709\u9650\uff0c\u60f3\u591a\u8d5a\u4e00\u4efd\u517c\u804c\u517b\u6d3b\u81ea\u5df1\u548c\u5b69\u5b50\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e (2-3\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u6781\u4f4e** \u2014 \u201c\u76ee\u524d\u5168\u90e8\u5bb6\u5f53\u90fd\u538b\u4e0a\u201d\uff0c\u62a5\u540d\u884c\u4e3a\u5df2\u89e6\u53ca\u751f\u5b58\u5e95\u7ebf\uff0c\u5c5e\u4e8e**\u9ad8\u98ce\u9669\u8d1f\u503a\u4fe1\u53f7**\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e** \u2014 \u5e7c\u513f\u6559\u5e08\uff0c\u6bcf\u5929\u4ec51-2\u5c0f\u65f6\u788e\u7247\u5316\u65f6\u95f4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u672a\u77e5** \u2014 \u672a\u63d0\u53ca\uff0c\u4f46\u201c\u517b\u6d3b\u81ea\u5df1\u548c\u5b69\u5b50\u201d\u6697\u793a\u53ef\u80fd\u4e3a\u5355\u4eb2\u6216\u5bb6\u5ead\u7ecf\u6d4e\u652f\u67f1\uff0c\u652f\u6301\u5ea6\u5b58\u7591\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b07\u4f4e\u6781\u5371 (1-2\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56\u3002\u81ea\u6211\u8bc4\u4ef7\u6781\u4f4e\uff0c\u5c06\u9500\u552e\u7684\u6210\u529f\u5f52\u56e0\u4e8e\u201c\u9b44\u529b\u201d\uff0c\u800c\u81ea\u8d2c\u4e3a\u201c\u80c6\u5c0f\u4e14\u61e6\u5f31\u201d\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4f60\u66fe\u7ecf\u7684\u7ecf\u5386\u6bd4\u6211\u96be\u5f97\u591a\uff0c\u4f46\u4f60\u662f\u4e00\u4e2a\u6709\u9b44\u529b\u7684\u4eba\uff0c\u800c\u6211\u662f\u4e2a\u80c6\u5c0f\u4e14\u61e6\u5f31\u7684\u72b6\u6001\u3002\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c (\u5b89\u5168\u9700\u6c42)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u4f5c\u4e3a\u5e7c\u513f\u6559\u5e08\uff08\u6536\u5165\u6709\u9650\uff09\uff0c\u72ec\u81ea\u627f\u62c5\u517b\u80b2\u5b69\u5b50\u7684\u7ecf\u6d4e\u538b\u529b\uff0c\u5bf9\u672a\u6765\u5145\u6ee1\u4e0d\u5b89\u5168\u611f\uff0c\u6025\u9700\u4e00\u4efd\u7a33\u5b9a\u7684\u517c\u804c\u6536\u5165\u6765\u4fdd\u969c\u57fa\u672c\u751f\u6d3b\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u9632\u62a4\u76fe\u5f0f\u7684\u5b89\u5168\u611f\u4e0e\u201c\u88ab\u770b\u89c1\u201d\u7684\u80af\u5b9a**\u3002\u5979\u9700\u8981\u7684\u4e0d\u4ec5\u662f\u6280\u80fd\uff0c\u66f4\u662f\u4e00\u4e2a\u80fd\u6258\u5e95\u3001\u80fd\u7406\u89e3\u5979\u56f0\u5883\u5e76\u7ed9\u4e88\u6301\u7eed\u9f13\u52b1\u7684\u201c\u5f15\u8def\u4eba\u201d\uff0c\u4ee5\u5bf9\u6297\u5176\u5f3a\u70c8\u7684\u81ea\u6211\u5426\u5b9a\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udd34D\u7c7b** (\u89e6\u53d1T8-D\u7edd\u8def\u8d4c\u5f92\u7ea2\u7ebf) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T8-D \u7edd\u8def\u8d4c\u5f92** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a**\ud83d\udd34\u5df2\u89e6\u53d1 D \u7c7b\u7194\u65ad\u7ea2\u7ebf\uff01**\n- **\u89e6\u53d1\u56e0\u7531**\uff1a**\u8d44\u6e90\u5e95\u5ea7\u8bc4\u5206\u22640\uff08\u201c\u5168\u90e8\u5bb6\u5f53\u538b\u4e0a\u201d\u4e3a\u6781\u7aef\u8d1f\u503a\u4fe1\u53f7\uff09+ \u5fc3\u7406\u5f39\u6027\u6781\u4f4e\uff08\u81ea\u5351\u8106\u5f31\uff09**\u3002\u7b26\u5408\u300a\u5224\u5b9a\u6811\u300b\u7b2c\u4e00\u5c42\u524d\u7f6e\u9694\u7206\u7b5b\u7684\u201c\u501f\u8d37\u62a5\u540d+\u590d\u5408\u7edd\u671b\u201d\u6761\u4ef6\uff0c\u5fc5\u987b\u7acb\u5373\u542f\u52a8\u5371\u673a\u5904\u7f6e\u534f\u8bae\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u9ad8** | \u82e5\u4e3a\u9690\u7792\u62a5\u540d\uff0c\u5bb6\u5ead\u53d1\u73b0\u540e\u6781\u6613\u5f15\u53d1\u5267\u70c8\u77db\u76fe\u548c\u7ecf\u6d4e\u8ffd\u7d22\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | \u5e7c\u513f\u6559\u5e08\u5de5\u4f5c\u7e41\u5fd9\uff0c1-2\u5c0f\u65f6\u5b66\u4e60\u65f6\u95f4\u6781\u6613\u88ab\u6324\u5360\uff0c\u4f5c\u4e1a\u79ef\u538b\u540e\u4ea7\u751f\u201c\u94b1\u767d\u82b1\u4e86\u201d\u7684\u5d29\u6e83\u611f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | \u6280\u672f\u5b66\u4e60\u7a0d\u6709\u632b\u6298\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u5931\u8d25\u3001\u666e\u901a\u8bdd\u4e0d\u51c6\uff09\uff0c\u5176\u201c\u80c6\u5c0f\u61e6\u5f31\u201d\u7684\u81ea\u5351\u5fc3\u7406\u4f1a\u8fc5\u901f\u653e\u5927\u4e3a\u201c\u6211\u679c\u7136\u4e0d\u884c\u201d\u7684\u5168\u9762\u81ea\u6211\u5426\u5b9a\uff0c\u89e6\u53d1\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u6781\u9ad8** | \u5bf9\u201c\u517c\u804c\u517b\u6d3b\u81ea\u5df1\u548c\u5b69\u5b50\u201d\u62b1\u6709\u6781\u9ad8\u671f\u5f85\uff0c\u82e5\u77ed\u671f\u5185\uff08\u59821-2\u4e2a\u6708\uff09\u672a\u83b7\u5f97\u4efb\u4f55\u6536\u5165\uff0c\u7edd\u671b\u60c5\u7eea\u4f1a\u8fc5\u901f\u8f6c\u5316\u4e3a\u5ba2\u8bc9\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u892a\u53bb\uff0c\u5b66\u4e60\u96be\u5ea6\u63d0\u5347\uff0c\u65f6\u95f4\u538b\u529b\u4e0e\u96f6\u6536\u5165\u73b0\u5b9e\u53e0\u52a0\uff0c\u9000\u8d39\u98ce\u9669\u8fbe\u5230\u9876\u5cf0\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6653\u7ea2\u59d0\uff0c\u6211\u7279\u522b\u7406\u89e3\u4f60\u73b0\u5728\u60f3\u628a\u6240\u6709\u5e0c\u671b\u90fd\u62bc\u5728\u8fd9\u6761\u8def\u4e0a\u7684\u5fc3\u60c5\u3002\u54b1\u4eec\u4e0d\u7740\u6025\uff0c\u4e00\u6b65\u4e00\u6b65\u6765\u3002\u4f60\u6700\u5927\u7684\u4f18\u52bf\u662f\u8ba4\u771f\u548c\u575a\u6301\uff0c\u8fd9\u51e0\u5929\u6211\u90fd\u770b\u5728\u773c\u91cc\u3002\u4ee5\u540e\u5b66\u4e60\u4e2d\u9047\u5230\u4efb\u4f55\u5361\u58f3\u7684\u5730\u65b9\uff0c\u54ea\u6015\u518d\u5c0f\uff0c\u4f60\u968f\u65f6\u627e\u6211\uff0c\u6211\u5e2e\u4f60\u4e00\u8d77\u89e3\u51b3\u3002\u54b1\u4eec\u7684\u76ee\u6807\u4e0d\u662f\u4e00\u591c\u66b4\u5bcc\uff0c\u662f\u7a33\u7a33\u5730\u589e\u52a0\u4e00\u4efd\u6536\u5165\uff0c\u7ed9\u5b69\u5b50\u591a\u4e00\u4efd\u4fdd\u969c\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011** (\u4f46\u5fc5\u987b\u4f34\u968f\u6781\u5f3a\u7684\u9884\u671f\u7ba1\u7406)\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u5f3a\u5236\u6302\u8f7d **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305 (\u6ee1\u914d\u7279\u79cdC)\u3011** + **\u3010\u964d\u7ef4\u7269\u7406\u4ee3\u529e\u5305 (\u7279\u79cdA)**\u3011\u3002\u73ed\u4e3b\u4efb\u9700\u626e\u6f14\u201c\u7ebf\u4e0a\u957f\u8f88\u201d\u89d2\u8272\uff0c\u63d0\u4f9b\u6781\u81f4\u7684\u60c5\u611f\u6258\u5e95\u548c\u64cd\u4f5c\u4ee3\u52b3\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u7edd\u4e0d\u53ef\u518d\u753b\u4efb\u4f55\u201c\u5feb\u901f\u8d5a\u94b1\u201d\u7684\u5927\u997c**\uff1b2. **\u7edd\u4e0d\u53ef\u5728\u5979\u8868\u8fbe\u81ea\u5351\u65f6\u8fdb\u884c\u4efb\u4f55\u5f62\u5f0f\u7684\u6279\u8bc4\u6216\u5bf9\u6bd4**\uff1b3. **\u7edd\u4e0d\u53ef\u5728\u5979\u9047\u5230\u64cd\u4f5c\u56f0\u96be\u65f6\u8ba9\u5979\u201c\u81ea\u5df1\u770b\u6559\u7a0b\u201d**\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5347\u5355**\u3002\u5728\u786e\u4fdd\u5176\u80fd\u7a33\u5b9a\u5b8c\u6210\u57fa\u7840\u8bfe\u7a0b\u5e76\u4ea7\u751f\u6b63\u5411\u53cd\u9988\uff08\u5982\u83b7\u5f97\u7b2c\u4e00\u7b14\u5c0f\u989d\u6536\u5165\uff09\u524d\uff0c\u7981\u6b62\u63a8\u8350\u4efb\u4f55\u9ad8\u9636\u8bfe\u7a0b\u6216\u8bbe\u5907\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u76ee\u524d\u7684\u72b6\u6001\u662f\u80fd\u529b\u6709\u9650\uff0c\u60f3\u591a\u8d5a\u4e00\u4efd\u517c\u804c\u517b\u6d3b\u81ea\u5df1\u548c\u5b69\u5b50\u201d **\u3010\u751f\u5b58\u538b\u529b\u4e0e\u53d8\u73b0\u52a8\u673a\u7684\u76f4\u63a5\u8bc1\u636e\u3011**\n2. > \u201c\u4f60\u66fe\u7ecf\u7684\u7ecf\u5386\u6bd4\u6211\u96be\u5f97\u591a\uff0c\u4f46\u4f60\u662f\u4e00\u4e2a\u6709\u9b44\u529b\u7684\u4eba\uff0c\u800c\u6211\u662f\u4e2a\u80c6\u5c0f\u4e14\u61e6\u5f31\u7684\u72b6\u6001\u3002\u201d **\u3010\u6781\u4f4e\u5fc3\u7406\u5f39\u6027\u4e0e\u6df1\u5ea6\u81ea\u5351\u7684\u6838\u5fc3\u8bc1\u660e\u3011**\n3. > \u201c\u76ee\u524d\u5168\u90e8\u5bb6\u5f53\u90fd\u538b\u4e0a\u201d **\u3010\u8d44\u6e90\u5e95\u5ea7\u5d29\u584c\u3001\u89e6\u53d1T8-D\u7ea2\u7ebf\u7684\u94c1\u8bc1\u3011**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T8-D \u7edd\u8def\u8d4c\u5f92\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7ecf\u6d4e\u5b89\u5168\u4e0e\u751f\u5b58\u4fdd\u969c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7acb\u5373\u542f\u52a830\u5206\u949f\u5371\u673a\u5904\u7f6e\u534f\u8bae\uff0c\u8fdb\u884c\u201c\u6218\u7565\u6027\u62d2\u552e\u201d\u6216\u53d6\u5f97\u6781\u7aef\u660e\u786e\u7684\u201c\u77e5\u60c5\u540c\u610f\u201d\uff0c\u5e76\u914d\u7f6e\u6ee1\u914d\u60c5\u7eea\u6258\u5e95\u4e0e\u64cd\u4f5c\u4ee3\u529e\u670d\u52a1\u3011**\u3002\n\n```json\n{\"core_type\": \"T8-D \u7edd\u8def\u8d4c\u5f92\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf\uff08\u9700\u5f3a\u9884\u671f\u7ba1\u7406+\u6ee1\u914d\u7597\u6108\u5305\uff09\", \"age\": \"38\u5468\u5c81\", \"gender\": \"\u5973\", \"city\": \"\u6d59\u6c5f\u53f0\u5dde\"}\n```";
