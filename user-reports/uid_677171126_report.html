    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4e3b\u8981\u4e3a\u9500\u552e\u5355\u5411\u6c9f\u901a\u53ca\u7528\u6237\u5c11\u91cf\u56de\u5e94\uff0c\u7f3a\u4e4f\u7528\u6237\u4e3b\u52a8\u63d0\u95ee\u3001\u5bb6\u5ead\u80cc\u666f\u3001\u652f\u4ed8\u80fd\u529b\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u3001\u5177\u4f53\u804c\u4e1a/\u6536\u5165\u72b6\u51b5\u7b49\u5173\u952e\u4fe1\u606f\u3002\u4e09\u8f74\u4fe1\u53f7\u4e0e\u7528\u6237\u539f\u578b\u5224\u65ad\u4e3b\u8981\u57fa\u4e8e\u6709\u9650\u7684\u884c\u4e3a\u548c\u56de\u5e94\u63a8\u5bfc\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49)**\n    *   **\u8868\u5c42**\uff1a\u660e\u786e\u8868\u8fbe\u201c\u770b\u597d\u6709\u58f0\u884c\u4e1a\uff0c\u5e0c\u671b\u81ea\u5df1\u5feb\u901f\u6210\u957f\u201d\uff0c\u5bf9\u201c\u659c\u6760\u753b\u672c\u201d\u7b49\u5177\u4f53\u53d8\u73b0\u5c97\u4f4d\u6709\u5174\u8da3\uff0c\u8868\u73b0\u51fa\u8f83\u5f3a\u7684**\u529f\u5229\u6027\u5b66\u4e60\u52a8\u673a**\uff08\u8d5a\u94b1\u3001\u63a5\u5355\uff09\u3002\n    *   **\u6df1\u5c42**\uff1a\u63d0\u53ca\u201c\u6539\u5584\u81ea\u5df1\u53e3\u624d\u201d\u3001\u201c\u610f\u5fd7\u529b\u662f\u6709\u201d\uff0c\u9690\u542b**\u81ea\u6211\u63d0\u5347\u4e0e\u793e\u4ea4\u5c0a\u91cd\u9700\u6c42**\u3002\u5e74\u9f84\uff0850+\uff09\u548c\u6587\u5316\u7a0b\u5ea6\u7684\u81ea\u6211\u62ab\u9732\uff0c\u663e\u793a\u5176\u5b58\u5728**\u5e74\u9f84\u7126\u8651\u4e0e\u4ef7\u503c\u8bc1\u660e**\u7684\u6df1\u5c42\u52a8\u673a\u3002\n    *   **\u4fe1\u53f7**\uff1a\u52a8\u673a\u6df7\u5408\uff08\u53d8\u73b0+\u81ea\u6211\u5b9e\u73b0\uff09\uff0c\u4f46\u53d8\u73b0\u8bc9\u6c42\u5177\u4f53\u3001\u660e\u786e\u3002\n\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4f4e-\u4fe1\u606f\u4e0d\u8db3)**\n    *   **\u65f6\u95f4**\uff1a\u81ea\u79f0\u201c\u5b69\u5b50\u4e0a\u5b66\u4e86\uff0c\u4e0a\u534810\u70b9\u534a\u5230\u4e0b\u53482\u70b9\u6bd4\u8f83\u6709\u7a7a\u201d\uff0c\u5468\u672b/\u5047\u671f\u65f6\u95f4\u5c11\u3002\u663e\u793a\u4e3a**\u6709\u56fa\u5b9a\u5bb6\u5ead\u7167\u6599\u8d23\u4efb\u7684\u517c\u804c\u5b66\u4e60\u8005**\uff0c\u6bcf\u65e5\u6709\u7ea63.5\u5c0f\u65f6\u53ef\u63a7\u5b66\u4e60\u65f6\u95f4\u3002\n    *   **\u7ecf\u6d4e/\u8bbe\u5907**\uff1a\u672a\u63d0\u53ca\u3002**\u4fe1\u606f\u7f3a\u5931**\uff0c\u9700\u8b66\u60d5\u6f5c\u5728\u652f\u4ed8\u80fd\u529b\u4e0e\u8bbe\u5907\u6295\u5165\u98ce\u9669\u3002\n    *   **\u7cbe\u529b/\u57fa\u7840**\uff1a\u81ea\u8bc4\u201c\u6587\u5316\u4e5f\u4e0d\u9ad8\uff0c\u8bed\u8a00\u8fd9\u65b9\u9762\u4e5f\u662f\u8f83\u5f31\u7684\u201d\uff0c\u4f46\u80fd\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\u3001\u9886\u53d6\u53e3\u4ee4\uff0c\u663e\u793a**\u57fa\u7840\u8f83\u5f31\u4f46\u914d\u5408\u5ea6\u9ad8\u3001\u6267\u884c\u529b\u5c1a\u53ef**\u3002\n\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u7b49\u504f\u9ad8)**\n    *   **\u575a\u6301\u6027**\uff1a\u80fd\u8fde\u7eed\u591a\u65e5\u8ddf\u8fdb\u5b66\u4e60\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\u5e76\u53cd\u9988\uff0c\u884c\u4e3a\u4e0a**\u575a\u6301\u6027\u826f\u597d**\u3002\n    *   **\u6297\u632b\u6027**\uff1a\u4e3b\u52a8\u66b4\u9732\u81ea\u8eab\u5f31\u70b9\uff08\u5e74\u9f84\u5927\u3001\u6587\u5316\u4f4e\uff09\uff0c\u4f46\u5728\u5f97\u5230\u9500\u552e\u9f13\u52b1\u540e\u80fd\u7ee7\u7eed\u53c2\u4e0e\uff0c\u672a\u8868\u73b0\u51fa\u653e\u5f03\u503e\u5411\uff0c**\u6709\u4e00\u5b9a\u97e7\u6027\u4f46\u4f9d\u8d56\u5916\u90e8\u80af\u5b9a**\u3002\n    *   **\u5f00\u653e\u6027**\uff1a\u4e3b\u52a8\u8be2\u95ee\u201c\u54ea\u4e2a\u8f83\u9002\u5408\u6211\u5462\uff1f\u201d\uff0c\u63a5\u53d7\u9500\u552e\u7684\u804c\u4e1a\u89c4\u5212\u5efa\u8bae\uff0c**\u613f\u610f\u5c1d\u8bd5\u548c\u63a5\u53d7\u6307\u5bfc**\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u8bb0\u5f55\u672a\u663e\u793a\u652f\u4ed8\u884c\u4e3a\u6216\u660e\u786e\u8bae\u4ef7\u8fc7\u7a0b\u3002\u7528\u6237\u6700\u7ec8\u201c\u5df2\u62a5\u540d\u201d\uff0c\u4f46**\u65e0\u6cd5\u786e\u8ba4\u662f\u5426\u5df2\u5b8c\u6210\u652f\u4ed8**\u3002**\u9700\u73ed\u4e3b\u4efb\u7d27\u6025\u6838\u5b9e\u652f\u4ed8\u72b6\u6001**\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u7528\u6237\u4e3b\u52a8\u63d0\u53ca\u201c\u5b69\u5b50\u201d\uff0c\u4e14\u65f6\u95f4\u5b89\u6392\u56f4\u7ed5\u5b69\u5b50\uff0c\u8868\u660e\u5176\u4e3a**\u5bb6\u5ead\u4e3b\u5987/\u7956\u6bcd\u89d2\u8272**\u3002\u51b3\u7b56\u53ef\u80fd\u4e3a\u4e2a\u4eba\uff0c\u4f46\u5927\u989d\u652f\u51fa**\u4ecd\u9700\u8b66\u60d5\u5bb6\u5ead\u5176\u4ed6\u6210\u5458\uff08\u5982\u5b50\u5973\u3001\u914d\u5076\uff09\u7684\u77e5\u60c5\u4e0e\u652f\u6301\u5ea6**\u3002**\u98ce\u9669\u6807\u8bb0**\u3002\n*   **\u6b65\u9aa41-4\u5224\u5b9a**\uff1a\n    *   \u52a8\u673a\u660e\u786e\uff08\u53d8\u73b0+\u6539\u5584\uff09\uff0c\u6709\u5b66\u4e60\u884c\u52a8\uff08A\u7c7b\u7279\u5f81\uff09\u3002\n    *   \u8d44\u6e90\u53d7\u9650\uff08\u65f6\u95f4\u788e\u7247\u5316\u3001\u57fa\u7840\u5f31\uff09\uff0c\u4f46\u610f\u613f\u5f3a\u70c8\uff08B/C\u7c7b\u7279\u5f81\uff09\u3002\n    *   \u6700\u7ec8\u5bfc\u5411\uff1a**\u521d\u6b65\u5224\u5b9a\u4e3aB\u7c7b\uff08\u9ad8\u610f\u613f-\u4e2d\u8d44\u6e90\uff09\u6216C\u7c7b\uff08\u4e2d\u610f\u613f-\u4e2d\u8d44\u6e90\uff09\u7528\u6237**\uff0c\u5177\u4f53\u53d6\u51b3\u4e8e\u5176\u672a\u88ab\u62ab\u9732\u7684\u7ecf\u6d4e\u652f\u4ed8\u80fd\u529b\u4e0e\u5bb6\u5ead\u652f\u6301\u5ea6\u3002\n\n## 3. \u5339\u914d\u7528\u6237\u539f\u578b\n*   **\u6700\u5339\u914d\u539f\u578b\uff1aT4 \u52a1\u5b9e\u8fdb\u53d6\u578b**\n    *   **\u7279\u5f81**\uff1a\u76ee\u6807\u660e\u786e\uff08\u659c\u6760\u753b\u672c\uff09\u3001\u5173\u6ce8\u5b9e\u64cd\u4e0e\u53d8\u73b0\u8def\u5f84\u3001\u80fd\u575a\u6301\u5b8c\u6210\u5b66\u4e60\u4efb\u52a1\u3001\u914d\u5408\u5ea6\u9ad8\u3002\n    *   **\u6b21\u5339\u914d\u539f\u578b\uff1aT7 \u4ef7\u503c\u8ffd\u5bfb\u578b**\n    *   **\u7279\u5f81**\uff1a50+\u5e74\u9f84\uff0c\u5bfb\u6c42\u6539\u5584\u53e3\u624d\u3001\u8bc1\u660e\u81ea\u6211\u4ef7\u503c\u3001\u83b7\u5f97\u793e\u4f1a\u8ba4\u540c\u4e0e\u5c0a\u91cd\uff0c\u5b66\u4e60\u5e26\u6709\u4e00\u5b9a\u60c5\u611f\u5bc4\u6258\u8272\u5f69\u3002\n    *   **\u6392\u9664\u539f\u578b**\uff1a\u975e\u51b2\u52a8\u6d88\u8d39\uff08T1\uff09\u3001\u975e\u7eaf\u5174\u8da3\uff08T2\uff09\u3001\u975e\u8d44\u6e90\u4e30\u6c9b\uff08T3\uff09\u3001\u975e\u4f4e\u610f\u613f\uff08T5\uff09\u3001\u975e\u60c5\u7eea\u5316\uff08T6\uff09\u3001\u975e\u6295\u673a\uff08T8\uff09\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4e2d)\n\u9010\u9879\u6392\u67e57\u79cd\u9000\u8d39\u6839\u56e0\uff1a\n1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u57fa\u7840\u5f31\u3001\u5e74\u9f84\u5927\uff0c\u5bf9\u5b66\u4e60\u6548\u679c\u9884\u671f\u7ba1\u7406\u81f3\u5173\u91cd\u8981\u3002\u82e5\u8fdb\u6b65\u7f13\u6162\u6216\u63a5\u5355\u4e0d\u987a\uff0c\u6613\u4ea7\u751f\u843d\u5dee\u3002\n2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u9ad8\u98ce\u9669**\u3002**\u5173\u952e\u4fe1\u606f\u7f3a\u5931**\u300250+\u5e74\u9f84\uff0c\u53ef\u80fd\u4e3a\u5bb6\u5ead\u4e3b\u5987\u6216\u65e0\u7a33\u5b9a\u6536\u5165\uff0c\u9700\u6838\u5b9e\u652f\u4ed8\u6765\u6e90\u662f\u5426\u4e3a\u4e2a\u4eba\u79ef\u84c4\u6216\u9700\u5bb6\u4eba\u652f\u6301\u3002**\u6b64\u4e3a\u6700\u5927\u6f5c\u5728\u96f7\u533a**\u3002\n3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u4e2d\u98ce\u9669**\u3002\u65f6\u95f4\u788e\u7247\u5316\uff0c\u5468\u672b/\u5047\u671f\u65e0\u6687\uff0c\u957f\u671f\u5b66\u4e60\u53ef\u80fd\u56e0\u5bb6\u5ead\u4e8b\u52a1\u4e2d\u65ad\u3002\n4.  **\u8bfe\u7a0b\u8d28\u91cf\u5f02\u8bae**\uff1a**\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u5bf9\u9500\u552e\u3001\u8001\u5e08\u53cd\u9988\u79ef\u6781\uff0c\u8ba4\u53ef\u5b66\u4e60\u5185\u5bb9\u3002\n5.  **\u9500\u552e\u627f\u8bfa\u672a\u5151\u73b0**\uff1a**\u4e2d\u98ce\u9669**\u3002\u9500\u552e\u63d0\u53ca\u201c\u514d\u8bd5\u97f3\u7684\u7248\u6743\u4e66\u8d60\u9001\u201d\u3001\u201c\u5de5\u4f5c\u5ba4\u8d44\u6e90\u201d\u3001\u201c\u5267\u793e\u201d\u7b49\u627f\u8bfa\uff0c**\u73ed\u4e3b\u4efb\u9700\u786e\u4fdd\u540e\u7eed\u8d44\u6e90\u5bf9\u63a5\u4e0e\u627f\u8bfa\u843d\u5b9e**\uff0c\u907f\u514d\u5f15\u53d1\u88ab\u6b3a\u9a97\u611f\u3002\n6.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u4e2d\u98ce\u9669**\u3002\u89c1\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5\u3002\u9700\u5173\u6ce8\u5176\u5bb6\u4eba\u5bf9\u65f6\u95f4\u5360\u7528\u3001\u8d39\u7528\u652f\u51fa\u7684\u6001\u5ea6\u3002\n7.  **\u5e73\u53f0\u670d\u52a1\u4f53\u9a8c**\uff1a**\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u4e92\u52a8\u826f\u597d\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5408\u89c4\u70b9**\uff1a\u9500\u552e\u63d0\u4f9b\u4e86\u5177\u4f53\u5b66\u4e60\u6307\u5bfc\u3001\u4f5c\u4e1a\u70b9\u8bc4\u3001\u884c\u4e1a\u4fe1\u606f\uff0c\u6709\u6b63\u5411\u6fc0\u52b1\u3002\n*   **\u98ce\u9669\u70b9**\uff1a\n    *   **\u8fc7\u5ea6\u627f\u8bfa\u98ce\u9669**\uff1a\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u8d44\u6e90\u201d\u3001\u201c\u4e66\u5355\u201d\u3001\u201c\u5de5\u4f5c\u5ba4\u201d\u3001\u201c\u514d\u8bd5\u97f3\u7248\u6743\u4e66\u201d\uff0c\u53ef\u80fd\u8425\u9020\u201c\u5305\u63a5\u5355\u3001\u5305\u8d44\u6e90\u201d\u7684\u9884\u671f\u3002**\u9700\u6838\u5b9e\u540e\u7eed\u8d44\u6e90\u4f9b\u7ed9\u7684\u771f\u5b9e\u6027\u4e0e\u95e8\u69db**\u3002\n    *   **\u7126\u8651\u5236\u9020**\uff1a\u5229\u7528\u201c\u6dd8\u6c70\u201d\u3001\u201c\u540d\u989d\u201d\u3001\u201c\u6700\u540e\u673a\u4f1a\u201d\u7b49\u8bdd\u672f\uff08\u5982\u201c\u660e\u5929\u4e0a\u5348\u4f1a\u6dd8\u6c70\u6ca1\u6709\u53e3\u4ee4\u7684\u540c\u5b66\u201d\uff09\uff0c\u5c5e\u4e8e\u5e38\u89c4\u4fc3\u5355\u624b\u6bb5\uff0c\u672a\u660e\u663e\u8d8a\u754c\u3002\n    *   **\u9488\u5bf9\u5f31\u52bf\u7fa4\u4f53**\uff1a\u7528\u6237\u81ea\u66dd\u5e74\u9f84\u5927\u3001\u6587\u5316\u4f4e\uff0c\u9500\u552e\u867d\u7ed9\u4e88\u9f13\u52b1\uff0c\u4f46\u6574\u4e2a\u8425\u9500\u94fe\u8def\u4ecd\u53ef\u80fd\u5229\u7528\u5176\u201c\u6539\u53d8\u73b0\u72b6\u201d\u7684\u6025\u5207\u5fc3\u7406\u3002**\u9700\u786e\u4fdd\u4ea7\u54c1\u4e0e\u670d\u52a1\u80fd\u771f\u6b63\u4e3a\u5176\u63d0\u4f9b\u4ef7\u503c**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6838\u5fc3\u7b56\u7565**\uff1a**\u4ef7\u503c\u5f3a\u5316 + \u9884\u671f\u7ba1\u7406 + \u60c5\u611f\u652f\u6301**\u3002\u5c06\u5176\u5b9a\u4f4d\u4e3a\u201c\u7a33\u5065\u6210\u957f\u578b\u5b66\u5458\u201d\uff0c\u91cd\u70b9\u63d0\u4f9b\u6210\u5c31\u611f\u4e0e\u5f52\u5c5e\u611f\u3002\n*   **\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9996\u8981\u4efb\u52a1**\uff1a\u7acb\u5373\u8054\u7cfb\uff0c**\u786e\u8ba4\u652f\u4ed8\u5b8c\u6210**\uff0c\u5e76\u6e29\u548c\u63a2\u8be2\u652f\u4ed8\u65b9\u5f0f\uff08\u4e2a\u4eba/\u5bb6\u5ead\uff09\uff0c\u8bc4\u4f30\u5bb6\u5ead\u652f\u6301\u5ea6\u3002\n    2.  **\u9884\u671f\u7ba1\u7406**\uff1a\u5165\u5b66\u521d\u671f\u5373\u6c9f\u901a\u6e05\u6670\uff0c\u5f3a\u8c03\u6709\u58f0\u884c\u4e1a\u9700\u8981**\u957f\u671f\u7ec3\u4e60\u4e0e\u79ef\u7d2f**\uff0c\u659c\u6760\u753b\u672c\u7b49\u5c97\u4f4d\u4e5f\u6709\u6280\u80fd\u8981\u6c42\uff0c\u964d\u4f4e\u5176\u201c\u5feb\u901f\u53d8\u73b0\u201d\u7684\u8fc7\u9ad8\u671f\u5f85\u3002\u80af\u5b9a\u5176\u201c\u6539\u5584\u53e3\u624d\u201d\u7684\u521d\u5fc3\u3002\n    3.  **\u5b66\u4e60\u89c4\u5212**\uff1a\u6839\u636e\u5176\u201c\u4e0a\u5348\u6709\u7a7a\u201d\u7684\u65f6\u95f4\u7279\u70b9\uff0c\u5236\u5b9a**\u788e\u7247\u5316\u3001\u9636\u68af\u5f0f**\u7684\u5b66\u4e60\u8ba1\u5212\u3002\u521d\u671f\u76ee\u6807\u8bbe\u5b9a\u4e3a\u201c\u5b8c\u6210\u6bcf\u65e5\u5c0f\u7ec3\u4e60\u201d\u3001\u201c\u6d41\u7545\u6717\u8bfb\u4e00\u6bb5\u6587\u5b57\u201d\uff0c\u79ef\u7d2f\u5fae\u5c0f\u6210\u5c31\u611f\u3002\n    4.  **\u8d44\u6e90\u5bf9\u63a5**\uff1a**\u8c28\u614e\u3001\u5206\u9636\u6bb5**\u5151\u73b0\u9500\u552e\u627f\u8bfa\u7684\u8d44\u6e90\u3002\u53ef\u5148\u63d0\u4f9b\u5165\u95e8\u7ea7\u7684\u753b\u672c\u4efb\u52a1\u6216\u8bd5\u97f3\u673a\u4f1a\uff0c\u65e0\u8bba\u7ed3\u679c\u5982\u4f55\uff0c\u5747\u7ed9\u4e88\u8be6\u7ec6\u53cd\u9988\u4e0e\u9f13\u52b1\uff0c\u91cd\u5728\u201c\u53c2\u4e0e\u4f53\u9a8c\u201d\u800c\u975e\u201c\u6210\u529f\u63a5\u5355\u201d\u3002\n    5.  **\u60c5\u611f\u7ef4\u7cfb**\uff1a\u591a\u4f7f\u7528\u201c\u963f\u59e8\u201d\u3001\u201c\u59d0\u59d0\u201d\u7b49\u4eb2\u5207\u79f0\u547c\uff0c\u5728\u73ed\u7ea7\u5185\u8425\u9020\u5c0a\u91cd\u3001\u5305\u5bb9\u7684\u6c1b\u56f4\u3002\u516c\u5f00\u8868\u626c\u5176\u201c\u575a\u6301\u201d\u3001\u201c\u8ba4\u771f\u201d\u7684\u54c1\u8d28\uff0c\u5f3a\u5316\u5176\u81ea\u6211\u4ef7\u503c\u611f\u3002\n    6.  **\u98ce\u9669\u76d1\u63a7**\uff1a\u5bc6\u5207\u5173\u6ce8\u5176\u4f5c\u4e1a\u63d0\u4ea4\u9891\u7387\u3001\u7fa4\u5185\u4e92\u52a8\u79ef\u6781\u6027\u3002\u4e00\u65e6\u51fa\u73b0\u61c8\u6020\u6216\u6d88\u6781\u8a00\u8bba\uff0c\u9700\u7acb\u5373\u4e00\u5bf9\u4e00\u6c9f\u901a\uff0c\u4e86\u89e3\u662f\u65f6\u95f4\u3001\u5bb6\u5ead\u8fd8\u662f\u5b66\u4e60\u56f0\u96be\u95ee\u9898\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**\uff1a\n    *   **\u4e3b\u7ebf**\uff1a\u5339\u914d**\u6709\u58f0\u4e66\u6f14\u64ad\u5165\u95e8/\u8fdb\u9636\u8bfe\u7a0b**\uff0c\u592f\u5b9e\u57fa\u7840\u3002\n    *   **\u589e\u503c/\u4e50\u9ad8\u7ebf**\uff1a\u53ef\u63a8\u8350**\u659c\u6760\u6280\u80fd\u4e13\u9879\u8bfe\uff08\u5982\u753b\u672c\u3001\u5ba1\u542c\u5165\u95e8\uff09**\uff0c\u4e0e\u5176\u5174\u8da3\u70b9\u76f4\u63a5\u6302\u94a9\uff0c\u4f46\u9700\u8bf4\u660e\u4ecd\u9700\u57fa\u7840\u6f14\u64ad\u77e5\u8bc6\u8f85\u52a9\u3002\n    *   **\u614e\u63a8**\uff1a\u9ad8\u5355\u4ef7\u201c\u4fdd\u5e95\u63a5\u5355\u201d\u6216\u201c\u901f\u6210\u5927\u5e08\u73ed\u201d\uff0c\u4e0e\u5176\u5f53\u524d\u57fa\u7840\u548c\u98ce\u9669\u627f\u53d7\u80fd\u529b\u4e0d\u5339\u914d\u3002\n\n{\"core_type\": \"T4 \u52a1\u5b9e\u8fdb\u53d6\u578b (\u517c\u5177T7\u7279\u5f81)\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u9700\u6c42/\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u6709\u58f0\u6f14\u64ad\u57fa\u7840\u8bfe\u7a0b + \u659c\u6760\u6280\u80fd\uff08\u753b\u672c/\u5ba1\u542c\uff09\u5165\u95e8\u8bfe\", \"age\": \"50\u5c81\u4ee5\u4e0a\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}";
