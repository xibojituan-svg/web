    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u7528\u6237UID\uff1a676826797\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676826797 (\u6635\u79f0\uff1a\u9646\u7ea2) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e - \u7b71\u6590\u3010\u5b98\u65b9\u62db\u52df\u5b98\u3011(\u8c22\u7f8e) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u5df2\u62a5\u540d\u7cbe\u82f1\u73ed\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3**\uff08\u524d\u671f\u5df2\u5728\u5176\u4ed6\u673a\u6784\u6295\u51653.8\u4e07\u5143\uff0c\u5bb6\u4eba\u4e0d\u77e5\u60c5\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u9700\u5168\u804c\u7167\u987e78\u5c81\u60a3\u75c5\u4e08\u592b\uff0c\u5973\u513f\u56de\u56fd\u671f\u95f4\u4f1a\u66f4\u5fd9\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u9690\u7792\u5077\u62a5**\uff08\u5bb6\u4eba\u4e0d\u77e5\u9053\u524d\u671f\u5927\u989d\u6295\u5165\uff0c\u672c\u6b21\u62a5\u540d\u53ef\u80fd\u4e5f\u672a\u77e5\u60c5\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u7528\u6237\u4e3b\u52a8\u3001\u8be6\u7ec6\u5730\u62ab\u9732\u4e86\u5bb6\u5ead\u72b6\u51b5\u3001\u8fc7\u5f80\u7ecf\u5386\u3001\u5b66\u4e60\u52a8\u673a\u548c\u987e\u8651\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u2b07\u4f4e**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\uff0c\u4f46\u6838\u5fc3\u9a71\u52a8\u529b\u662f**\u60c5\u611f\u5ba3\u6cc4\u3001\u81ea\u6211\u4ef7\u503c\u5b9e\u73b0\u4e0e\u6b62\u635f\u56de\u672c**\uff0c\u800c\u975e\u7eaf\u7cb9\u7684\u77ed\u671f\u66b4\u5bcc\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u4e0d\u662f\u7740\u6025\u8981\u6536\u5165\u201d\uff0c\u4e3b\u8981\u8bc9\u6c42\u662f\u201c\u5fc3\u60c5\u597d\u4e00\u70b9\u201d\u3001\u201c\u6015\u8111\u5b50\u9000\u5316\u201d\u3001\u201c\u60f3\u628a\u524d\u671f\u6295\u5165\u8d5a\u56de\u6765\u4e00\u4e9b\u201d\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u6211\u5c31\u662f\u60f3\u5b66\u58f0\u97f3\uff0c\u5c31\u662f\u80fd\u591f\u81ea\u5df1\u6709\u70b9\u51fa\u53e3\u5427\uff0c\u90a3\u4e2a\u5fc3\u60c5\u597d\u4e00\u70b9\u3002\u201d > \u201c\u4e3b\u8981\u5c31\u662f\u6211\u524d\u671f\u6295\u4e86\u90a3\u4e48\u591a\uff0c\u6211\u81ea\u5df1\u89c9\u5f97\u8981\u8d5a\u56de\u6765\u8fd9\u4e2a\u94b1\u90fd\u4e0d\u5bb9\u6613...\u73b0\u5728\u5462\u5c31\u662f\u603b\u662f\u60f3\u628a\u90a3\u4e2a\u80fd\u80fd\u8d5a\u56de\u6765\u4e00\u4e9b\u5427\uff0c\u56e0\u4e3a\u8981\u5f88\u7740\u6025\u7684\u8981\u4ec0\u4e48\u6536\u5165\uff0c\u6211\u4e5f\u4e0d\u662f\u8fd9\u6837\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u5df2\u5728\u5176\u4ed6\u673a\u6784\u6295\u51653.8\u4e07\u5143\uff08\u5bb6\u4eba\u4e0d\u77e5\u60c5\uff09\uff0c\u5b58\u5728\u660e\u663e\u7684\u7ecf\u6d4e\u538b\u529b\u548c\u201c\u6c89\u6ca1\u6210\u672c\u201d\u7126\u8651\uff0c\u540e\u7eed\u5927\u989d\u4ed8\u8d39\u610f\u613f\u548c\u80fd\u529b\u5b58\u7591\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u6781\u4f4e** \u2014 \u9700\u5168\u804c\u7167\u987e78\u5c81\u60a3\u75c5\u7684\u4e08\u592b\uff0c\u5bb6\u5ead\u4e8b\u52a1\u5168\u5305\uff0c\u65f6\u95f4\u88ab\u4e25\u91cd\u5207\u5272\uff0c\u5c5e\u4e8e\u5178\u578b\u7684\u201c\u5939\u5fc3\u5c42\u201d\u7167\u62a4\u8005\uff0c\u7cbe\u529b\u9ad8\u5ea6\u67af\u7aed\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4f4e** \u2014 \u5bb6\u4eba\u5bf9\u524d\u671f\u5927\u989d\u6295\u5165\u4e0d\u77e5\u60c5\uff0c\u5b58\u5728\u6f5c\u5728\u7684\u5e72\u9884\u98ce\u9669\u3002\u7528\u6237\u5904\u4e8e\u201c\u9690\u7792\u5077\u62a5\u201d\u72b6\u6001\uff0c\u5bb6\u5ead\u652f\u6301\u7cfb\u7edf\u8584\u5f31\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b07\u4f4e\u6781\u5371**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56**\u3002\u8868\u73b0\u51fa\u5bf9\u6570\u5b57\u64cd\u4f5c\uff08\u5c0f\u7a0b\u5e8f\u4fee\u6539\u4f5c\u4e1a\uff09\u7684\u6050\u614c\u4e0e\u4e0d\u81ea\u4fe1\uff0c\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\uff08\u88ab\u5176\u4ed6\u673a\u6784\u201c\u5957\u8def\u201d\uff09\u5bfc\u81f4\u5176\u6781\u5ea6\u6e34\u671b\u88ab\u770b\u89c1\u3001\u88ab\u7406\u89e3\u3001\u88ab\u4e00\u5bf9\u4e00\u6307\u5bfc\uff0c\u5bf9\u201c\u900f\u660e\u201d\u3001\u201c\u5b9e\u5728\u201d\u7684\u5bfc\u5e08\u6709\u5f3a\u70c8\u7684\u60c5\u611f\u4f9d\u8d56\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u662f\u8bf4\u5fae\u4fe1\u4fee\u6539\uff0c\u6ca1\u64cd\u4f5c\u8fc7[\u5077\u7b11]\u201d > \u201c\u6211\u5e74\u7eaa\u5927\uff0c\u57fa\u672c\u4e0a\u8fd9\u8fb9\u53ef\u80fd\u68a8\u82b1\u8fd8\u662f\u5e74\u7eaa\u5927\u7684\u4eba\u591a\uff0c\u9000\u4f11\u7684\u4eba\u591a\u3002\u201d > \u201c\u592a\u8c22\u8c22\u5e08\u59d0\u4e86\uff0c\u76f8\u89c1\u6068\u665a\uff0c\u6211\u5c31\u611f\u89c9\u4f60\u5f88\u5b9e\u5728\u201d\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34\u4e0e\u5f52\u5c5e\u611f**\uff0c\u5e76\u5f3a\u70c8\u6e34\u671b**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42\uff08\u88ab\u770b\u89c1\u3001\u88ab\u8ba4\u53ef\uff09**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u9ad8\u9f84\u7167\u62a4\u8005\u7684\u5b64\u72ec\u3001\u4ef7\u503c\u611f\u7f3a\u5931\u4e0e\u5bf9\u201c\u4fe1\u606f\u900f\u660e\u3001\u771f\u8bda\u6307\u5bfc\u201d\u7684\u6781\u5ea6\u6e34\u671b**\u3002\u5979\u8eab\u5904\u5bb6\u5ead\u7167\u62a4\u7684\u5c01\u95ed\u73af\u5883\uff0c\u6e34\u671b\u4e00\u4e2a\u60c5\u7eea\u51fa\u53e3\u548c\u80fd\u8bc1\u660e\u81ea\u5df1\u201c\u4e0d\u8001\u201d\u3001\u201c\u6709\u7528\u201d\u7684\u793e\u4ea4\u5708\u3002\u8fc7\u5f80\u88ab\u673a\u6784\u201c\u5957\u8def\u201d\u7684\u7ecf\u5386\u8ba9\u5979\u5bf9\u201c\u900f\u660e\u201d\u3001\u201c\u4e00\u5bf9\u4e00\u201d\u4ea7\u751f\u4e86\u6267\u5ff5\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u7ebf\u4e0a\u5973\u513f/\u59d0\u59b9\u201d\u5f0f\u7684\u5168\u6258\u5e95\u60c5\u611f\u966a\u4f34\u4e0e\u201c\u88ab\u7279\u6b8a\u5173\u7167\u201d\u7684VIP\u5c0a\u8363\u611f**\u3002\u5979\u9700\u8981\u7684\u4e0d\u53ea\u662f\u6280\u80fd\uff0c\u66f4\u662f\u4e00\u4e2a\u80fd\u7406\u89e3\u5979\u5904\u5883\u3001\u8010\u5fc3\u6307\u5bfc\u3001\u7ed9\u4e88\u5979\u6210\u5c31\u611f\u548c\u5f52\u5c5e\u611f\u7684\u201c\u5f15\u8def\u4eba\u201d\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **\u3010\u6df7\u5408\u4f535\u53f7\uff1a\u6570\u5b57\u6df1\u6d77\u5b64\u5c9b\u8131\u56f0\u8005 (T6+T9)\u3011** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 **\u5b89\u5168\u672a\u89e6\u53d1** (\u4f46\u5904\u4e8e\u9ad8\u5371\u8fb9\u7f18)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u7528\u6237\u867d\u672a\u63d0\u53ca\u672c\u6b21\u62a5\u540d\u4f7f\u7528\u501f\u8d37\uff0c\u4f46**\u524d\u671f\u5df2\u67093.8\u4e07\u5143\u4e0d\u660e\u667a\u6295\u5165\u4e14\u5bb6\u4eba\u4e0d\u77e5\u60c5**\uff0c\u5b58\u5728\u5de8\u5927\u7684\u7ecf\u6d4e\u538b\u529b\u548c\u5bb6\u5ead\u77db\u76fe\u9690\u60a3\u3002\u82e5\u672c\u6b21\u5b66\u4e60\u518d\u9047\u632b\u6298\u6216\u611f\u89c9\u201c\u88ab\u5957\u8def\u201d\uff0c\u6781\u6613\u5f15\u53d1\u60c5\u7eea\u5d29\u6e83\u548c\u6fc0\u70c8\u9000\u8d39\u6295\u8bc9\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u9ad8** | \u5bb6\u4eba\u53d1\u73b0\u5176\u518d\u6b21\u4e3a\u201c\u526f\u4e1a\u201d\u6295\u5165\u5927\u7b14\u8d44\u91d1\uff0c\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u548c\u7ecf\u6d4e\u95ee\u8d23\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | \u56e0\u7167\u987e\u4e08\u592b\u6216\u5973\u513f\u56de\u56fd\u7b49\u5bb6\u5ead\u7a81\u53d1\u72b6\u51b5\uff0c\u5bfc\u81f4\u5b66\u4e60\u8fdb\u5ea6\u4e25\u91cd\u6ede\u540e\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u3001\u5b66\u4e0d\u4f1a\u201d\u7684\u81ea\u8d23\u548c\u653e\u5f03\u5fc3\u7406\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u9ad8** | \u9047\u5230\u6280\u672f\u64cd\u4f5c\u96be\u9898\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u3001\u4f5c\u4e1a\u63d0\u4ea4\uff09\u65e0\u4eba\u53ca\u65f6\u54cd\u5e94\uff0c\u6216\u611f\u89c9\u88ab\u73ed\u7ea7\u201c\u5ffd\u89c6\u201d\uff0c\u89e6\u53d1\u5176\u201c\u53c8\u88ab\u9a97\u4e86\u201d\u7684\u8fc7\u5f80\u521b\u4f24\u548c\u81ea\u5351\u611f\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u5b66\u4e60\u4e00\u6bb5\u65f6\u95f4\u540e\uff0c\u53d1\u73b0\u63a5\u5355\u53d8\u73b0\u8fdc\u4e0d\u5982\u9500\u552e\u63cf\u8ff0\u7684\u201c\u7b80\u5355\u201d\u3001\u201c\u5feb\u901f\u201d\uff0c\u4ea7\u751f\u5de8\u5927\u7684\u5fc3\u7406\u843d\u5dee\u548c\u53d7\u9a97\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\u3002\u5f53\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u5bb6\u5ead\u7410\u4e8b\u4e0e\u5b66\u4e60\u538b\u529b\u53e0\u52a0\uff0c\u7b2c\u4e00\u6b21\u72ec\u7acb\u5b8c\u6210\u590d\u6742\u4f5c\u4e1a\u6216\u5c1d\u8bd5\u63a5\u5355\u53d7\u632b\u65f6\uff0c\u662f\u60c5\u7eea\u5d29\u6e83\u548c\u9000\u8d39\u7684\u9ad8\u53d1\u671f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u9646\u7ea2\u59d0\uff0c\u770b\u5230\u60a8\u4e3a\u5bb6\u5ead\u4ed8\u51fa\u8fd9\u4e48\u591a\uff0c\u8fd8\u8fd9\u4e48\u79ef\u6781\u5b66\u4e60\uff0c\u771f\u7684\u7279\u522b\u4f69\u670d\u3002\u60a8\u653e\u5fc3\uff0c\u5728\u8fd9\u91cc\u60a8\u4e0d\u662f\u4e00\u4e2a\u4eba\u2018\u778e\u7422\u78e8\u2019\u3002\u6211\u5c31\u662f\u60a8\u7684\u7ebf\u4e0a\u5c0f\u52a9\u624b\uff0c\u4efb\u4f55\u64cd\u4f5c\u4e0a\u7684\u4e8b\uff0c\u54ea\u6015\u662f\u6700\u5c0f\u7684\u6b65\u9aa4\uff0c\u968f\u65f6\u558a\u6211\uff0c\u6211\u624b\u628a\u624b\u5e26\u60a8\u8d70\u3002\u54b1\u4eec\u4e0d\u56fe\u5feb\uff0c\u5c31\u56fe\u4e2a\u5f00\u5fc3\u548c\u8fdb\u6b65\uff0c\u628a\u8fd9\u513f\u5f53\u6210\u60a8\u7684\u4e00\u4e2a\u2018\u5c0f\u82b1\u56ed\u2019\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u9002\u8001\u9632\u8131\u8282\u4f34\u98de\u8425 (\u4ea7\u54c1\u7ebfC)\u3011** \u6838\u5fc3\u662f\u63d0\u4f9b\u5b89\u5168\u611f\u4e0e\u966a\u4f34\uff0c\u800c\u975e\u9ad8\u538b\u53d8\u73b0\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n    1.  **\u3010\u6838\u5f39\u7ea7\u7279\u79cdA(\u8fdc\u7a0b\u7269\u7406\u4ee3\u529e)\u3011**\uff1a\u5bf9\u4e8e\u4efb\u4f55\u8f6f\u4ef6\u5b89\u88c5\u3001\u4f5c\u4e1a\u4e0a\u4f20\u3001\u5e73\u53f0\u64cd\u4f5c\uff0c\u76f4\u63a5\u4f7f\u7528\u5411\u65e5\u8475/ToDesk\u8fdc\u7a0b\u63a5\u7ba1\uff0c**\u4e25\u7981**\u53d1\u9001\u56fe\u6587\u6559\u7a0b\u3002\n    2.  **\u3010\u6ee1\u914d\u7279\u79cdC(\u51cc\u6668\u60c5\u7eea\u6258\u5e95)\u3011**\uff1a\u73ed\u4e3b\u4efb\u9700\u626e\u6f14\u201c\u7ebf\u4e0a\u5973\u513f\u201d\u89d2\u8272\uff0c\u5b9a\u671f\u8fdb\u884c1v1\u5173\u6000\uff0c\u503e\u542c\u5176\u7167\u987e\u5bb6\u5ead\u7684\u8f9b\u82e6\uff0c\u7ed9\u4e88\u6781\u81f4\u7684\u60c5\u611f\u8ba4\u540c\u548c\u9f13\u52b1\u3002\n    3.  **\u3010\u540c\u4faa\u6276\u76f2\u9632\u7ebf (D\u6a21\u5757)\u3011**\uff1a\u5c06\u5176\u4e0e\u73ed\u7ea7\u5185\u5176\u4ed6\u70ed\u5fc3\u3001\u6709\u8010\u5fc3\u7684\u5b66\u5458\uff08\u5982T7\u578b\uff09\u7ed3\u5bf9\uff0c\u5efa\u7acb\u201c\u5e2e\u6276\u5c0f\u7ec4\u201d\uff0c\u7528\u540c\u4f34\u529b\u91cf\u5206\u644a\u73ed\u4e3b\u4efb\u7684\u6258\u5e95\u538b\u529b\uff0c\u8425\u9020\u201c\u5c0a\u8001\u7231\u5e7c\u201d\u7684\u793e\u7fa4\u6c1b\u56f4\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1.  \u7edd\u4e0d\u5bf9\u5176\u4f7f\u7528\u4efb\u4f55\u201c\u5012\u8ba1\u65f6\u201d\u3001\u201c\u540d\u989d\u6709\u9650\u201d\u7b49\u903c\u5355\u8bdd\u672f\u3002\n    2.  \u7edd\u4e0d\u5728\u5176\u8868\u8fbe\u64cd\u4f5c\u56f0\u96be\u65f6\uff0c\u56de\u590d\u201c\u60a8\u770b\u4e0b\u6559\u7a0b\u201d\u6216\u201c\u91cd\u542f\u8bd5\u8bd5\u201d\u3002\n    3.  \u7edd\u4e0d\u5728\u521d\u671f\u5f3a\u8c03\u201c\u5feb\u901f\u53d8\u73b0\u201d\u3001\u201c\u6708\u5165\u8fc7\u4e07\u201d\uff0c\u9700\u8fdb\u884c**\u9006\u5411\u9884\u671f\u7ba1\u7406**\uff1a\u201c\u54b1\u4eec\u5148\u6253\u597d\u57fa\u7840\uff0c\u53d8\u73b0\u662f\u6c34\u5230\u6e20\u6210\u7684\u4e8b\uff0c\u60a8\u522b\u6025\u3002\u201d\n    4.  \u7981\u6b62\u5c06\u5176\u4e0e\u5e74\u8f7b\u3001\u8fdb\u5ea6\u5feb\u7684\u5b66\u5458\u8fdb\u884c\u4efb\u4f55\u5f62\u5f0f\u7684\u6bd4\u8f83\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5f62\u5f0f\u7684\u5347\u5355\u6216\u4ea4\u53c9\u9500\u552e**\u3002\u5728\u76f8\u5f53\u957f\u4e00\u6bb5\u65f6\u95f4\u5185\uff08\u81f3\u5c113\u4e2a\u6708\uff09\uff0c\u53ea\u805a\u7126\u4e8e\u5f53\u524d\u8bfe\u7a0b\u7684\u60c5\u611f\u966a\u4f34\u4e0e\u57fa\u7840\u6280\u80fd\u638c\u63e1\u3002\u5f85\u5176\u5efa\u7acb\u8db3\u591f\u4fe1\u4efb\u5e76\u8de8\u8d8a\u6570\u5b57\u9e3f\u6c9f\u540e\uff0c\u518d\u8c28\u614e\u8bc4\u4f30\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u8001\u516c\u5927\u6982\u4e5f78\u5c81\u4e86\uff0c\u6211\u6211\u8981\u7167\u987e\u4ed6\uff0c\u4ed6\u8eab\u4f53\u4e0d\u592a\u597d\uff0c\u6240\u4ee5\u6211\u4e5f\u6ca1\u6709\u5f88\u591a\u7684\u7cbe\u529b\uff0c\u5bb6\u91cc\u9762\u6240\u6709\u7684\u4e8b\u60c5\u90fd\u662f\u6211\u505a...\u6211\u5c31\u662f\u60f3\u5b66\u58f0\u97f3\uff0c\u5c31\u662f\u80fd\u591f\u81ea\u5df1\u6709\u70b9\u51fa\u53e3\u5427\uff0c\u90a3\u4e2a\u5fc3\u60c5\u597d\u4e00\u70b9\u3002\u201d\n2. > \u201c\u6211\u662f\u8bf4\u5fae\u4fe1\u4fee\u6539\uff0c\u6ca1\u64cd\u4f5c\u8fc7[\u5077\u7b11]\u201d & \u201c\u6211\u5e74\u7eaa\u5927\uff0c\u57fa\u672c\u4e0a\u8fd9\u8fb9\u53ef\u80fd\u68a8\u82b1\u8fd8\u662f\u5e74\u7eaa\u5927\u7684\u4eba\u591a\uff0c\u9000\u4f11\u7684\u4eba\u591a\u3002\u201d\n3. > \u201c\u6211\u6211\u5bb6\u91cc\u4eba\u90fd\u4e0d\u77e5\u9053\uff0c\u4ed6\u4eec\u4ed6\u4eec\u6ca1\u6709\u77e5\u9053\u6211\u82b1\u4e86\u8fd9\u4e48\u591a\uff083.8\u4e07\uff09...\u592a\u8c22\u8c22\u5e08\u59d0\u4e86\uff0c\u76f8\u89c1\u6068\u665a\uff0c\u6211\u5c31\u611f\u89c9\u4f60\u5f88\u5b9e\u5728\u3002\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010\u6df7\u5408\u4f535\u53f7\uff1a\u6570\u5b57\u6df1\u6d77\u5b64\u5c9b\u8131\u56f0\u8005\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u88ab\u770b\u89c1\u3001\u88ab\u5c0a\u91cd\u7684\u60c5\u611f\u966a\u4f34\u4e0e\u4ef7\u503c\u5b9e\u73b0\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u542f\u52a8\u201c\u7ebf\u4e0a\u5973\u513f\u201d\u5f0f\u5168\u6258\u5e95\u670d\u52a1 + \u7269\u7406\u8fdc\u7a0b\u4ee3\u529e + \u575a\u51b3\u675c\u7edd\u4efb\u4f55\u5347\u5355\u63a8\u9500\u3011**\u3002\n\n```json\n{\"core_type\": \"\u6df7\u5408\u4f535\u53f7\uff1a\u6570\u5b57\u6df1\u6d77\u5b64\u5c9b\u8131\u56f0\u8005 (T6+T9)\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u793e\u4ea4\u4e0e\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u9002\u8001\u9632\u8131\u8282\u4f34\u98de\u8425 (\u4ea7\u54c1\u7ebfC)\", \"age\": \"60\u5c81\u4ee5\u4e0a\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}\n```";
