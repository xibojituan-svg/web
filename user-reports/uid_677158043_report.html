    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677158043 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e - \u554a\u54df\u8349\u83933(\u987e\u79cb\u83b9) / \u9500\u552e - \u897f\u74dc seven \u5b98\u65b9\u62db\u52df\u5b98(\u987e\u79cb\u83b9) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u9a6c\u62c9\u96c5\u6709\u58f0\u6f14\u64ad\u8bad\u7ec3\u8425\uff08\u5177\u4f53\u8bfe\u7a0b\u53ca\u4ef7\u683c\u672a\u77e5\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\uff08\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u91d1\u989d\u3001\u5206\u671f\u60c5\u51b5\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\uff08\u4ec5\u663e\u793a\u80fd\u54cd\u5e94\u767d\u5929\u6d88\u606f\uff0c\u65e0\u6cd5\u5224\u65ad\u804c\u4e1a\u3001\u4f5c\u606f\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\uff08\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u80cc\u666f\u3001\u51b3\u7b56\u6743\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** \u6838\u5fc3\u4e09\u8f74\u4fe1\u606f\uff08\u52a8\u673a\u3001\u8d44\u6e90\u3001\u5bb6\u5ead\uff09\u51e0\u4e4e\u7a7a\u767d\uff0c\u4ec5\u80fd\u901a\u8fc7\u6781\u7b80\u4e92\u52a8\u63a8\u6d4b\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6709\u58f0\u884c\u4e1a\u7684\u5174\u8da3\u548c\u914d\u5408\u5ea6\uff0c\u4f46\u7f3a\u4e4f\u5bf9\u201c\u641e\u94b1\u201d\u76ee\u6807\u7684\u5f3a\u70c8\u8868\u8fbe\u548c\u8ffd\u95ee\u3002\u884c\u4e3a\u4e0a\u88ab\u52a8\u8ddf\u968f\uff0c\u52a8\u673a\u4e0d\u660e\u786e\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u559c\u6b22\u201d (\u5f53\u88ab\u95ee\u53ca\u662f\u5426\u559c\u6b22\u8fd9\u4e2a\u884c\u4e1a\u65f6)\uff1b> \u201c\u90a3\u8fd9\u4e2a\u4e66\u6211\u5f55\u5236\u4f1a\u6709\u6536\u76ca\u5417\u201d (\u5728\u83b7\u5f97\u7248\u6743\u4e66\u540e\u8be2\u95ee\uff0c\u663e\u793a\u5bf9\u6536\u76ca\u6709\u57fa\u7840\u5173\u6ce8\uff0c\u4f46\u975e\u9996\u8981\u9a71\u52a8\u529b)\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u65e0\u4efb\u4f55\u5173\u4e8e\u652f\u4ed8\u80fd\u529b\u3001\u6d88\u8d39\u6c34\u5e73\u7684\u8ba8\u8bba\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u4ec5\u77e5\u80fd\u54cd\u5e94\u767d\u5929\u6d88\u606f\u5e76\u5b8c\u6210\u4f5c\u4e1a\uff0c\u4f46\u5177\u4f53\u65f6\u95f4\u5145\u88d5\u5ea6\u672a\u77e5\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u60c5\u51b5\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u9700\u95f4\u6b47\u6027\u5b89\u629a\u3002\u7528\u6237\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u88ab\u52a8\u548c\u4f9d\u8d56\uff0c\u9700\u8981\u9500\u552e\u660e\u786e\u6307\u5f15\uff08\u5982\u7d22\u8981\u56de\u653e\u3001\u8be2\u95ee\u64cd\u4f5c\u6b65\u9aa4\uff09\uff0c\u4f46\u672a\u51fa\u73b0\u60c5\u7eea\u5316\u62b1\u6028\u6216\u653e\u5f03\u8ff9\u8c61\uff0c\u80fd\u5b8c\u6210\u57fa\u672c\u4efb\u52a1\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5e08\u5144\uff0c\u7ed9\u6211\u4e2a\u56de\u653e\u5427 \u6211\u5728\u5916\u9762\u542c\u7684\uff0c\u6ca1\u505a\u7b14\u8bb0\u201d\uff1b > \u201c\u90a3\u600e\u4e48\u7136\u540e\u5f04\u5462\u201d (\u83b7\u5f97\u7248\u6743\u4e66\u540e\u8be2\u95ee\u540e\u7eed\u64cd\u4f5c)\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 / \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u7f3a\u4e4f\u660e\u786e\u7684\u804c\u4e1a\u65b9\u5411\u548c\u81ea\u6211\u9a71\u52a8\u529b\uff0c\u9700\u8981\u5916\u90e8\uff08\u5e08\u5144/\u793e\u7fa4\uff09\u7684\u660e\u786e\u6307\u5f15\u3001\u4efb\u52a1\u89c4\u5212\u548c\u60c5\u611f\u966a\u4f34\u6765\u83b7\u5f97\u5b89\u5168\u611f\u548c\u5f52\u5c5e\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4fdd\u59c6\u5f0f\u7684\u4efb\u52a1\u62c6\u89e3\u4e0e\u966a\u4f34\u80af\u5b9a**\uff0c\u63d0\u4f9b\u6e05\u6670\u7684\u201c\u4e0b\u4e00\u6b65\u201d\u64cd\u4f5c\u6307\u5357\uff0c\u5e76\u6301\u7eed\u7ed9\u4e88\u201c\u4f60\u505a\u5f97\u5f88\u68d2\u201d\u7684\u6b63\u5411\u53cd\u9988\uff0c\u586b\u8865\u5176\u5185\u5728\u9a71\u52a8\u529b\u7684\u4e0d\u8db3\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1** \u7c7b (\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931\uff0c\u4f46\u65e0\u8d1f\u9762\u4fe1\u53f7\uff0c\u884c\u4e3a\u914d\u5408\uff0c\u5f52\u4e3a\u5f85\u89c2\u5bdf\u7684C1\u7c7b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T5 \u597d\u73a9\u5c1d\u9c9c** (\u884c\u4e3a\u88ab\u52a8\u8ddf\u968f\uff0c\u5174\u8da3\u9a71\u52a8\uff08\u201c\u559c\u6b22\u201d\uff09\uff0c\u5bf9\u6536\u76ca\u6709\u597d\u5947\u4f46\u975e\u6838\u5fc3\u8bc9\u6c42\uff0c\u7b26\u5408\u5c1d\u9c9c\u8005\u7279\u5f81) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4fe1\u606f\u7f3a\u5931** | \u672a\u77e5\uff0c\u98ce\u9669\u65e0\u6cd5\u8bc4\u4f30 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u8bfe\u7a0b\u4efb\u52a1\u4e00\u65e6\u53d8\u590d\u6742\u6216\u9700\u8981\u81ea\u4e3b\u89c4\u5212\u65f6\uff0c\u53ef\u80fd\u56e0\u7f3a\u4e4f\u6307\u5f15\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u76ee\u524d\u8868\u73b0\u5e73\u548c\uff0c\u4f9d\u8d56\u6307\u5f15\u4f46\u672a\u663e\u8106\u5f31\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u5bf9\u6536\u76ca\u6709\u671f\u5f85\uff08\u95ee\u201c\u6709\u6536\u76ca\u5417\u201d\uff09\uff0c\u82e5\u77ed\u671f\u5185\u65e0\u6cd5\u770b\u5230\u53d8\u73b0\u5e0c\u671b\u6216\u8def\u5f84\u4e0d\u6e05\u6670\uff0c\u53ef\u80fd\u5931\u53bb\u8010\u5fc3\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c1-2\u5468**\uff0c\u5f53\u8bfe\u7a0b\u4ece\u201c\u597d\u73a9\u5c1d\u9c9c\u201d\u7684\u5f15\u5bfc\u671f\u8fdb\u5165\u9700\u8981**\u81ea\u4e3b\u7ec3\u4e60\u3001\u6df1\u5ea6\u6295\u5165**\u7684\u9636\u6bb5\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u9f99\u867e\u5b9d\u540c\u5b66\u4f60\u597d\u5440\uff01\u770b\u5230\u4f60\u5728\u4f53\u9a8c\u8425\u91cc\u7279\u522b\u8ba4\u771f\uff0c\u4f5c\u4e1a\u90fd\u6309\u65f6\u5b8c\u6210\u4e86\uff0c\u771f\u7684\u5f88\u68d2\uff01\u6211\u77e5\u9053\u4ece\u2018\u559c\u6b22\u2019\u5230\u2018\u4e0a\u624b\u2019\u53ef\u80fd\u6709\u70b9\u4e0d\u77e5\u9053\u4e0b\u4e00\u6b65\u8be5\u5e72\u561b\uff0c\u522b\u62c5\u5fc3\uff0c\u63a5\u4e0b\u6765\u6211\u4f1a\u50cf\u4f53\u9a8c\u8425\u7684\u5e08\u5144\u4e00\u6837\uff0c\u628a\u6bcf\u5468\u3001\u6bcf\u5929\u8981\u505a\u4ec0\u4e48\u90fd\u6e05\u6e05\u695a\u695a\u544a\u8bc9\u4f60\uff0c\u4f60\u53ea\u8981\u8ddf\u7740\u8d70\u5c31\u884c\u3002\u6709\u4efb\u4f55\u5361\u4f4f\u7684\u5730\u65b9\uff0c\u968f\u65f6\u95ee\u6211\uff0c\u6211\u5e2e\u4f60\u62c6\u89e3\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010\u5174\u8da3\u6e38\u4e50\u7ebf\u3011\u3002\u6838\u5fc3\u662f\u7ef4\u6301\u5174\u8da3\uff0c\u901a\u8fc7**\u77ed\u5e73\u5feb\u3001\u6210\u5c31\u611f\u5f3a**\u7684\u5c0f\u4efb\u52a1\uff08\u5982\u8da3\u5473\u914d\u97f3\u6311\u6218\u3001\u58f0\u97f3\u6a21\u4eff\u79c0\uff09\u4fdd\u6301\u53c2\u4e0e\u611f\uff0c\u907f\u514d\u8fc7\u65e9\u65bd\u52a0\u53d8\u73b0\u538b\u529b\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010\u7ed3\u6784\u5316\u4efb\u52a1\u5bfc\u822a\u5305\u3011\u3002\u4e3a\u5176\u63d0\u4f9b\u6781\u5ea6\u6e05\u6670\u7684\u6bcf\u65e5/\u6bcf\u5468\u4efb\u52a1\u6e05\u5355\u3001\u64cd\u4f5c\u6b65\u9aa4\u622a\u56fe/\u89c6\u9891\uff0c\u51cf\u5c11\u5176\u51b3\u7b56\u548c\u6478\u7d22\u6210\u672c\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7edd\u4e0d\u5bf9T5\u5728\u521d\u671f\u5927\u8c08\u201c\u8270\u82e6\u8bad\u7ec3\u201d\u3001\u201c\u957f\u671f\u575a\u6301\u201d\u548c\u201c\u9ad8\u989d\u56de\u62a5\u201d\uff0c\u8fd9\u4f1a\u5413\u8dd1\u5c1d\u9c9c\u8005\u3002\u7edd\u4e0d\u7ed9\u5176\u5f00\u653e\u6027\u7684\u3001\u9700\u8981\u81ea\u6211\u89c4\u5212\u7684\u5927\u4f5c\u4e1a\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u672a\u89c2\u5bdf\u5230\u5176\u52a8\u673a\u663e\u8457\u8f6c\u5316\u4e3a\u201c\u641e\u94b1\u7ed3\u679c\u5bfc\u5411\uff08T4\uff09\u201d\u6216\u201c\u6b7b\u78d5\u5b66\u9738\uff08T3\uff09\u201d\u4e4b\u524d\uff0c\u7981\u6b62\u4efb\u4f55\u5347\u5355\u884c\u4e3a\uff0c\u4ec5\u63d0\u4f9b\u514d\u8d39\u6216\u6781\u4f4e\u6210\u672c\u7684\u8da3\u5473\u8fdb\u9636\u5185\u5bb9\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5e08\u5144\uff0c\u7ed9\u6211\u4e2a\u56de\u653e\u5427 \u6211\u5728\u5916\u9762\u542c\u7684\uff0c\u6ca1\u505a\u7b14\u8bb0\u201d **(\u4f9d\u8d56\u6307\u5f15\uff0c\u5b66\u4e60\u4e3b\u52a8\u6027\u5f31)**\n2. > \u201c\u559c\u6b22\u201d **(\u5174\u8da3\u9a71\u52a8\uff0c\u975e\u7ed3\u679c\u9a71\u52a8)**\n3. > \u201c\u90a3\u8fd9\u4e2a\u4e66\u6211\u5f55\u5236\u4f1a\u6709\u6536\u76ca\u5417\u201d **(\u5bf9\u6536\u76ca\u6709\u57fa\u7840\u597d\u5947\uff0c\u4f46\u95ee\u6cd5\u88ab\u52a8\uff0c\u975e\u8feb\u5207\u8ffd\u95ee)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T5\u597d\u73a9\u5c1d\u9c9c\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u793e\u4ea4\u966a\u4f34\u4e0e\u7126\u8651\u7f13\u89e3\uff08\u9700\u8981\u660e\u786e\u6307\u5f15\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u201c\u50bb\u74dc\u5f0f\u201d\u4efb\u52a1\u5bfc\u822a\u4e0e\u9ad8\u9891\u8f7b\u91cf\u7ea7\u6b63\u53cd\u9988\uff0c\u4e25\u9632\u8bfe\u7a0b\u96be\u5ea6\u9661\u589e\u3011\u3002**\n\n```json\n{\"core_type\": \"T5 \u597d\u73a9\u5c1d\u9c9c\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u793e\u4ea4/\u5b89\u5168\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf\"}\n```";
