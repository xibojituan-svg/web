    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677133759 (\u6635\u79f0: \u6d2a\u82b3\u5f88\u54c7\u585e) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-05 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u4e3b\u64ad\u516d\u6708\u6668\u516e(\u9648\u5c0f\u4e91) -> \u503e\u4e16\u6c89\u6d6e(\u9648\u78ca) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u7cfb\u7edf\u8bfe (\u6700\u7ec8\u9009\u62e94\u4e2a\u6708\u9ad8\u9636\u8bfe\u7a0b) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3** (\u5411\u6bcd\u4eb2\u501f\u94b1\u652f\u4ed8\u5b66\u8d39) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u7535\u8bdd\u9500\u552e\u5de5\u4f5c\uff0c\u5e38\u52a0\u73ed\u81f3\u6df1\u591c\uff0c\u9700\u5229\u7528\u4e0b\u73ed\u540e\u65f6\u95f4) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u5df2\u62a5\u5907\u5e76\u652f\u6301** (\u5411\u6bcd\u4eb2\u501f\u94b1\uff0c\u6bcd\u4eb2\u77e5\u60c5) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e\uff0c\u4f46\u975e\u6781\u7aef\u77ed\u671f\u66b4\u5bcc\u5fc3\u6001\u3002\u6709\u957f\u671f\u804c\u4e1a\u8f6c\u578b\u7684\u6f5c\u5728\u671f\u671b\uff0c\u5bf9\u6280\u80fd\u5b66\u4e60\u672c\u8eab\u6709\u4e00\u5b9a\u6295\u5165\u548c\u8ba4\u53ef\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8981\u662f\u6211\u80fd\u591f\u5728\u64ad\u97f3\u8fd9\u5757\u6536\u5165\u4e0d\u9519\uff0c\u53ef\u80fd\u4ee5\u540e\u5e72\u5168\u804c\u64ad\u97f3\uff0c\u5411\u4f60\u770b\u9f50\u201d\uff1b > \u201c\u6bcf\u5929\u90fd\u8981\u6253\u7535\u8bdd\uff0c\u6709\u65f6\u5019\u8981\u52a0\u73ed\u523012\u70b9\u3002\u6240\u4ee5\u6211\u60f3\u627e\u4e2a\u66f4\u9002\u5408\u6211\u7684\u5de5\u4f5c\uff0c\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u6708\u85aa\u4ec51900\u5143\uff0c\u660e\u786e\u8868\u793a\u201c\u6ca1\u6709\u8fd9\u4e48\u591a\u94b1\u201d\uff0c\u66fe\u56e0\u82b1\u5457\u8d1f\u503a\u62a5\u540d\u5176\u4ed6\u8bfe\u7a0b\uff08\u5bf9\u5916\u6c49\u8bed\u6559\u5e08\u8d44\u683c\u8bc1\uff09\u4e14\u672a\u53d8\u73b0\uff0c\u672c\u6b21\u62a5\u540d\u9700\u5411\u6bcd\u4eb2\u501f\u6b3e\u3002**\u8d22\u52a1\u538b\u529b\u5de8\u5927\uff0c\u662f\u6838\u5fc3\u77ed\u677f\u3002**\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u5de5\u4f5c\u4e3a\u7535\u8bdd\u9500\u552e\uff0c\u9700\u5750\u73ed\u4e14\u5e38\u52a0\u73ed\uff0c\u4f46\u7528\u6237\u8868\u73b0\u51fa\u5229\u7528\u788e\u7247\u65f6\u95f4\u5b66\u4e60\u7684\u610f\u613f\u548c\u884c\u52a8\uff08\u5982\u4e0b\u73ed\u540e\u542c\u8bfe\u3001\u4ea4\u4f5c\u4e1a\uff09\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4e2d** \u2014 \u6bcd\u4eb2\u613f\u610f\u501f\u94b1\u652f\u6301\uff0c\u8868\u660e\u5bb6\u5ead\u77e5\u60c5\u4e14\u6709\u4e00\u5b9a\u652f\u6301\u5ea6\uff0c\u4f46\u8d44\u91d1\u6765\u6e90\u975e\u81ea\u6709\uff0c\u5b58\u5728\u6f5c\u5728\u5fc3\u7406\u538b\u529b\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u6001\u5ea6\u79ef\u6781\uff0c\u80fd\u4e3b\u52a8\u5b8c\u6210\u4f5c\u4e1a\u3001\u8865\u8bfe\uff0c\u5bf9\u9500\u552e\u53cd\u9988\u826f\u597d\uff08\u201c\u5f88\u6696\u5fc3\u201d\uff09\u3002\u4f46\u8fc7\u5f80\u6709\u88ab\u5176\u4ed6\u8bfe\u7a0b\u201c\u5272\u97ed\u83dc\u201d\u7ecf\u5386\uff08\u82b11\u4e07+\u672a\u63a5\u5230\u5de5\u4f5c\uff09\uff0c\u53ef\u80fd\u5bf9\u7ed3\u679c\u62b1\u6709\u66f4\u9ad8\u671f\u5f85\u6216\u9690\u542b\u4e0d\u4fe1\u4efb\u3002\u9762\u5bf9\u56f0\u96be\uff08\u6ca1\u94b1\uff09\u65f6\u9009\u62e9\u5bfb\u6c42\u5916\u90e8\u5e2e\u52a9\uff08\u501f\u94b1\uff09\uff0c\u800c\u975e\u76f4\u63a5\u653e\u5f03\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u4e5f\u60f3\u8fdb\u6765\uff0c\u6211\u5c31\u662f\u6682\u65f6\u6ca1\u94b1\uff0c\u6ca1\u6709\u522b\u7684\u201d\uff1b > \u201c\u6211\u627e\u6211\u5988\u5988\u501f\u4e86\u94b1\uff0c\u6211\u60f3\u62a5\u540d4\u4e2a\u6708\u7684\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 (\u7126\u8651\u4fdd\u969c)** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u73b0\u6709\u804c\u4e1a\uff08\u7535\u8bdd\u9500\u552e\uff09\u7684\u6781\u5ea6\u4e0d\u6ee1\u4e0e\u751f\u5b58\u7126\u8651**\u3002\u4f4e\u85aa\uff081900\u5143/\u6708\uff09\u3001\u9ad8\u5f3a\u5ea6\u52a0\u73ed\uff08\u81f312\u70b9\uff09\u3001\u5de5\u4f5c\u67af\u71e5\uff0c\u4f7f\u5176\u8feb\u5207\u5bfb\u6c42\u4e00\u6761\u80fd\u5e26\u6765\u7a33\u5b9a\u6536\u5165\u3001\u66f4\u5177\u81ea\u4e3b\u6027\u7684\u65b0\u804c\u4e1a\u8def\u5f84\uff0c\u4ee5\u6446\u8131\u5f53\u524d\u56f0\u5883\uff0c\u83b7\u5f97\u7ecf\u6d4e\u4e0e\u804c\u4e1a\u5b89\u5168\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u786e\u5b9a\u6027\u201d\u4e0e\u201c\u5e0c\u671b\u611f\u201d**\u3002\u9700\u8981\u6e05\u6670\u3001\u53ef\u6267\u884c\u7684\u6210\u957f\u8def\u5f84\uff0c\u4ee5\u53ca\u201c\u4ed8\u51fa\u5373\u6709\u56de\u62a5\u201d\u7684\u660e\u786e\u53cd\u9988\uff0c\u6765\u5bf9\u51b2\u5176\u56e0\u7ecf\u6d4e\u538b\u529b\u548c\u8fc7\u5f80\u5931\u8d25\u7ecf\u5386\u800c\u4ea7\u751f\u7684\u5de8\u5927\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5 C2 \u7c7b** (\u52a8\u673a\u4e2d\u7b49\u4f46\u8d44\u6e90\u5e95\u5ea7\u5b58\u5728\u81f4\u547d\u77ed\u677f-\u8d44\u91d1\u501f\u8d37\uff0c\u5fc3\u7406\u5f39\u6027\u4e2d\u7b49\uff0c\u9700\u91cd\u70b9\u76d1\u63a7) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u578b** (\u6838\u5fc3\u8bc9\u6c42\u662f\u6446\u8131\u5f53\u524d\u4f4e\u85aa\u9ad8\u538b\u5de5\u4f5c\uff0c\u5b9e\u73b0\u517c\u804c\u6216\u5168\u804c\u53d8\u73b0\uff0c\u5bf9\u6295\u8d44\u56de\u62a5\u5468\u671f\u548c\u786e\u5b9a\u6027\u6709\u6781\u9ad8\u671f\u5f85) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 **\u5b89\u5168\u672a\u89e6\u53d1** (\u867d\u5411\u6bcd\u4eb2\u501f\u6b3e\uff0c\u4f46\u975e\u9ad8\u5229\u8d37\u6216\u5f71\u54cd\u57fa\u672c\u751f\u5b58\u7684\u201c\u6551\u547d\u94b1\u201d\uff0c\u4e14\u5bb6\u4eba\u77e5\u60c5\u652f\u6301\u3002)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a/\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| **\u5bb6\u5ead\u5e72\u9884\u578b** | **\u4e2d** | \u867d\u6bcd\u4eb2\u652f\u6301\uff0c\u4f46\u501f\u6b3e\u884c\u4e3a\u672c\u8eab\u53ef\u80fd\u5e26\u6765\u540e\u7eed\u5bb6\u5ead\u7ecf\u6d4e\u77db\u76fe\u6216\u5fc3\u7406\u8d1f\u62c5\uff0c\u82e5\u5b66\u4e60\u521d\u671f\u65e0\u6b63\u5411\u53cd\u9988\uff0c\u53ef\u80fd\u56e0\u6127\u759a\u611f\u800c\u653e\u5f03\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | **\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u5de5\u4f5c\u52a0\u73ed\u4e25\u91cd\uff0c\u7cbe\u529b\u6709\u9650\u3002\u4e00\u65e6\u8bfe\u7a0b\u4efb\u52a1\u4e0e\u5de5\u4f5c\u65f6\u95f4\u51b2\u7a81\uff0c\u6781\u6613\u4ea7\u751f\u79ef\u538b\u3001\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\uff0c\u8fdb\u800c\u81ea\u8d23\u3001\u7126\u8651\uff0c\u6700\u7ec8\u5d29\u76d8\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u4f4e** | \u7528\u6237\u8868\u73b0\u51fa\u8f83\u597d\u7684\u914d\u5408\u5ea6\u4e0e\u6267\u884c\u529b\uff0c\u975e\u60c5\u7eea\u5316\u7c7b\u578b\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u7528\u6237\u80cc\u8d1f\u503a\u52a1\u6295\u8d44\u5b66\u4e60\uff0c\u5bf9\u201c\u5feb\u901f\u63a5\u5355\u8d5a\u94b1\u201d\u62b1\u6709\u6781\u9ad8\u671f\u671b\u3002\u82e5\u5f00\u8425\u540e\u77ed\u671f\u5185\uff08\u59822-4\u5468\uff09\u672a\u611f\u53d7\u5230\u660e\u786e\u7684\u201c\u63a5\u5355\u8def\u5f84\u201d\u6216\u201c\u53d8\u73b0\u5e0c\u671b\u201d\uff0c\u6781\u6613\u56e0\u5de8\u5927\u7684\u6295\u5165\u4ea7\u51fa\u843d\u5dee\u800c\u4ea7\u751f\u88ab\u6b3a\u9a97\u611f\uff0c\u5f15\u53d1\u6fc0\u70c8\u6295\u8bc9\u6216\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468\uff08\u201c\u6b7b\u4ea1\u8c37\u201d\u9636\u6bb5\uff09**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u8bfe\u7a0b\u96be\u5ea6\u53ef\u80fd\u63d0\u5347\uff0c\u4f46\u8ddd\u79bb\u5b9e\u9645\u63a5\u5355\u4ecd\u6709\u8ddd\u79bb\u3002\u82e5\u540c\u65f6\u906d\u9047\u5de5\u4f5c\u7e41\u5fd9\u3001\u4f5c\u4e1a\u79ef\u538b\uff0c\u5176\u7ecf\u6d4e\u538b\u529b\u548c\u7126\u8651\u611f\u5c06\u8fbe\u5230\u5cf0\u503c\uff0c\u9000\u8d39\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6d2a\u82b3\uff0c\u770b\u5230\u4f60\u4e3a\u4e86\u6539\u53d8\u73b0\u72b6\u8fd9\u4e48\u52aa\u529b\uff0c\u751a\u81f3\u60f3\u529e\u6cd5\u514b\u670d\u4e86\u5b66\u8d39\u7684\u56f0\u96be\uff0c\u6211\u7279\u522b\u4f69\u670d\u4f60\u7684\u51b3\u5fc3\u548c\u884c\u52a8\u529b\u3002\u54b1\u4eec\u4e0d\u8ddf\u522b\u4eba\u6bd4\u901f\u5ea6\uff0c\u5c31\u6309\u7167\u4f60\u81ea\u5df1\u7684\u8282\u594f\u6765\u3002\u4f60\u7684\u53cc\u8bed\u80fd\u529b\u662f\u7a00\u7f3a\u4f18\u52bf\uff0c\u8fd9\u884c\u9700\u8981\u4f60\u8fd9\u6837\u7684\u4eba\u624d\u3002\u524d\u671f\u54b1\u4eec\u91cd\u70b9\u662f\u628a\u57fa\u7840\u6253\u624e\u5b9e\uff0c\u6211\u4f1a\u5e2e\u4f60\u89c4\u5212\u597d\u6bcf\u592930\u5206\u949f\u7684\u788e\u7247\u5316\u5b66\u4e60\u65b9\u6848\uff0c\u786e\u4fdd\u6bcf\u4e00\u6b65\u90fd\u8d70\u5f97\u7a33\u3002\u6709\u4efb\u4f55\u65f6\u95f4\u4e0a\u7684\u56f0\u96be\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4eec\u4e00\u8d77\u8c03\u6574\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5feb\u901f\u63a5\u5355\u7ebf**\u3011\u3002\u5fc5\u987b\u4f18\u5148\u8ba9\u5176\u770b\u5230\u201c\u63a5\u5355-\u53d8\u73b0\u201d\u7684\u6e05\u6670\u8def\u5f84\u548c\u77ed\u671f\u53ef\u80fd\u6027\uff0c\u54ea\u6015\u662f\u5c0f\u989d\u3001\u4f4e\u95e8\u69db\u7684\u8bd5\u97f3\u673a\u4f1a\uff0c\u4ee5\u7ef4\u6301\u5176\u4fe1\u5fc3\u548c\u6295\u5165\u611f\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u65f6\u95f4\u7ba1\u7406\u8f85\u52a9\u5305**\u3011\u3002\u9488\u5bf9\u5176\u52a0\u73ed\u591a\u3001\u65f6\u95f4\u788e\u7684\u7279\u70b9\uff0c\u63d0\u4f9b\u6781\u7b80\u7684\u6bcf\u65e5\u8ddf\u5b66\u8ba1\u5212\uff08\u5982\u201c\u6bcf\u65e5\u6838\u5fc315\u5206\u949f\u201d\uff09\u3002**\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\uff0c\u5728\u5176\u56e0\u5de5\u4f5c\u75b2\u60eb\u4ea7\u751f\u7126\u8651\u65f6\uff0c\u63d0\u4f9b\u60c5\u7eea\u5b89\u629a\u548c\u9f13\u52b1\uff0c\u907f\u514d\u5176\u56e0\u81ea\u8d23\u800c\u653e\u5f03\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u5176\u753b\u201c\u8f7b\u677e\u6708\u5165\u8fc7\u4e07\u201d\u7684\u5927\u997c**\uff0c\u9700\u7ba1\u7406\u5176\u77ed\u671f\u6536\u76ca\u9884\u671f\uff0c\u5f3a\u8c03\u201c\u6280\u80fd\u79ef\u7d2f-\u9010\u6b65\u53d8\u73b0\u201d\u7684\u8fc7\u7a0b\u3002\n    2. **\u7edd\u4e0d\u5728\u5176\u8868\u793a\u201c\u52a0\u73ed/\u6ca1\u65f6\u95f4\u201d\u65f6\u65bd\u52a0\u538b\u529b**\uff0c\u5e94\u7acb\u523b\u534f\u52a9\u8c03\u6574\u8ba1\u5212\uff0c\u7ed9\u4e88\u5bbd\u5bb9\u671f\u3002\n    3. **\u4e25\u7981\u4efb\u4f55\u5f62\u5f0f\u7684\u5347\u5355\u6216\u9644\u52a0\u6d88\u8d39\u63a8\u8350**\uff0c\u5176\u7ecf\u6d4e\u72b6\u51b5\u5df2\u5230\u6781\u9650\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u8fd8\u6e05\u6b64\u6b21\u5b66\u4e60\u503a\u52a1\u5e76\u6709\u7a33\u5b9a\u517c\u804c\u6536\u5165\u524d\uff0c\u7981\u6b62\u4efb\u4f55\u8bfe\u7a0b\u6216\u670d\u52a1\u63a8\u8350\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u5de5\u8d44\u624d1900\u4e00\u4e2a\u6708[\u88c2\u5f00] \u6bcf\u5929\u90fd\u8981\u6253\u7535\u8bdd\uff0c\u6709\u65f6\u5019\u8981\u52a0\u73ed\u523012\u70b9\u3002\u6240\u4ee5\u6211\u60f3\u627e\u4e2a\u66f4\u9002\u5408\u6211\u7684\u5de5\u4f5c\uff0c\u201d\n2. > \u201c\u4e4b\u524d\u7528\u82b1\u5457\u62a5\u540d\u4e86\u4e00\u4e2a\u5bf9\u5916\u6c49\u8bed\u6559\u5e08\u8d44\u683c\u8bc1\uff0c\u82b1\u4e86\u62111\u4e07\u591a\uff0c\u5230\u73b0\u5728\u8fd8\u6ca1\u63a5\u5230\u5de5\u4f5c \u6709\u8d1f\u503a\uff0c\u5df2\u7ecf\u6ca1\u6709\u989d\u5ea6\u4e86\uff0c\u6240\u4ee5\u62a5\u4e0d\u4e0a[\u53f9\u6c14]\u201d\n3. > \u201c\u6211\u627e\u6211\u5988\u5988\u501f\u4e86\u94b1 \u6211\u60f3\u62a5\u540d4\u4e2a\u6708\u7684\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4 \u641e\u94b1\u7ed3\u679c\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u6446\u8131\u4f4e\u85aa\u9ad8\u538b\u5de5\u4f5c\uff0c\u83b7\u5f97\u7ecf\u6d4e\u5b89\u5168\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5728\u5f00\u8425\u521d\u671f\u63d0\u4f9b\u6781\u5176\u6e05\u6670\u7684\u201c\u5fae\u53d8\u73b0\u201d\u8def\u5f84\uff0c\u5e76\u914d\u5907\u9ad8\u5f3a\u5ea6\u7684\u65f6\u95f4\u7ba1\u7406\u4e0e\u60c5\u7eea\u966a\u62a4\uff0c\u4e25\u9632\u6536\u76ca\u843d\u5dee\u548c\u7cbe\u529b\u5d29\u76d8\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf+\u65f6\u95f4\u7ba1\u7406\u8f85\u52a9\u5305+\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\"}\n```";
