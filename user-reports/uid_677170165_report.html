    <script>
        const markdownText = "# AI\u5199\u4f5c\u8bfe\u7a0b\u5b66\u5458\u8bca\u65ad\u62a5\u544a\n\n## \u4fe1\u606f\u4e0d\u8db3\u58f0\u660e\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u804a\u5929\u8bb0\u5f55\u4e3b\u8981\u4e3a\u9500\u552e\u5355\u5411\u63a8\u5e7f\u4e0e\u7528\u6237\u7b80\u5355\u56de\u5e94\uff0c\u7f3a\u4e4f\u5173\u4e8e\u5b66\u5458\u4e2a\u4eba\u80cc\u666f\u3001\u5b66\u4e60\u76ee\u6807\u3001\u652f\u4ed8\u80fd\u529b\u3001\u51b3\u7b56\u8fc7\u7a0b\u3001\u8fc7\u5f80\u7ecf\u5386\u53ca\u5bb6\u5ead\u72b6\u51b5\u7684\u5173\u952e\u4fe1\u606f\u3002\u65e0\u6cd5\u51c6\u786e\u5224\u65ad\u8d44\u6e90\u5e95\u5ea7\u3001\u5fc3\u7406\u5f39\u6027\u53ca\u5bb6\u5ead\u51b3\u7b56\u6743\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4f4e-\u4e2d)**\n    *   **\u5174\u8da3\u4fe1\u53f7**\uff1a\u8868\u793a\u201c\u5076\u5c14\u770b\u5c0f\u8bf4\u201d\uff0c\u6709\u201c\u51e0\u5e74\u4ee5\u524d\u5199\u8fc7\uff0c\u4e0d\u8fc7\u7eaf\u624b\u5199\u7684\u201d\u7ecf\u5386\uff0c\u5bf9\u5199\u4f5c\u6709\u57fa\u7840\u5174\u8da3\u3002\n    *   **\u884c\u52a8\u4fe1\u53f7**\uff1a\u53c2\u4e0e\u4f53\u9a8c\u8425\uff0c\u56de\u590d\u76f4\u64ad\u53e3\u4ee4\uff08\u201c\u4e00\u5b57\u5343\u91d1\u201d\u3001\u201cAI\u5199\u4f5c666\u201d\u3001\u201c\u70b9\u77f3\u6210\u91d1\u201d\u3001\u201c4380\u201d\uff09\uff0c\u5b8c\u6210\u4f5c\u4e1a\u5e76\u5206\u4eabKimi\u5bf9\u8bdd\u94fe\u63a5\uff0c\u8868\u660e\u6709\u521d\u6b65\u7684\u53c2\u4e0e\u548c\u5c1d\u8bd5\u610f\u613f\u3002\n    *   **\u6a21\u7cca\u6027**\uff1a\u672a\u660e\u786e\u8868\u8fbe\u5f3a\u70c8\u7684\u53d8\u73b0\u9700\u6c42\u3001\u804c\u4e1a\u8f6c\u578b\u538b\u529b\u6216\u5177\u4f53\u5b66\u4e60\u76ee\u6807\u3002\u52a8\u673a\u505c\u7559\u5728\u201c\u611f\u5174\u8da3\u201d\u548c\u201c\u5c1d\u8bd5\u201d\u5c42\u9762\uff0c\u6df1\u5ea6\u4e0d\u8db3\u3002**\u5b58\u5728\u201c\u5f00\u5c40\u6446\u70c2\u201d\u7684\u620f\u8c11\u56de\u5e94\uff0c\u53ef\u80fd\u9690\u542b\u89c2\u671b\u6216\u968f\u610f\u5fc3\u6001**\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u672a\u77e5)**\n    *   **\u652f\u4ed8\u80fd\u529b**\uff1a\u7528\u6237\u6700\u7ec8\u652f\u4ed8\u4e864380\u5143\u8bfe\u7a0b\u8d39\u7528\uff0c\u8868\u660e\u5177\u5907\u8be5\u4ef7\u4f4d\u7684\u652f\u4ed8\u80fd\u529b\u3002\u4f46\u8d44\u91d1\u6765\u6e90\uff08\u4e2a\u4eba\u50a8\u84c4\u3001\u5bb6\u5ead\u652f\u6301\u7b49\uff09\u3001\u6536\u5165\u7a33\u5b9a\u6027\u3001\u804c\u4e1a\u72b6\u51b5\u5747\u672a\u77e5\u3002\n    *   **\u65f6\u95f4/\u7cbe\u529b**\uff1a\u80fd\u53c2\u4e0e\u665a\u95f4\u76f4\u64ad\u5e76\u5b8c\u6210\u4f5c\u4e1a\uff0c\u663e\u793a\u8fd1\u671f\u6709\u4e00\u5b9a\u7a7a\u95f2\u65f6\u95f4\u3002\u4f46\u957f\u671f\u65f6\u95f4\u6295\u5165\u627f\u8bfa\u672a\u77e5\u3002\n    *   **\u5b66\u4e60\u57fa\u7840**\uff1a\u6709\u624b\u52a8\u5199\u4f5c\u7ecf\u9a8c\uff0c\u4f46\u201c\u51e0\u5e74\u4ee5\u524d\u201d\uff1b\u4f7f\u7528\u8fc7\u201c\u5143\u5b9d\u201dAI\u5de5\u5177\u4f46\u201c\u4e0d\u592a\u4f1a\u7528\u201d\u3002\u5c5e\u4e8e\u6709\u6f5c\u5728\u5174\u8da3\u4f46\u6280\u80fd\u751f\u758f\u7684\u201c\u51c6\u5c0f\u767d\u201d\u72b6\u6001\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u672a\u77e5)**\n    *   **\u6297\u632b\u6027**\uff1a\u672a\u77e5\u3002\u672a\u8868\u73b0\u51fa\u5bf9\u5b66\u4e60\u96be\u5ea6\u7684\u62c5\u5fe7\u6216\u754f\u96be\u60c5\u7eea\uff0c\u4f46\u4e5f\u672a\u5c55\u793a\u51fa\u514b\u670d\u56f0\u96be\u7684\u51b3\u5fc3\u3002\n    *   **\u575a\u6301\u6027**\uff1a\u4f53\u9a8c\u8425\u671f\u95f4\u80fd\u8ddf\u8fdb\uff0c\u4f46\u957f\u671f\u575a\u6301\u5ea6\u672a\u77e5\u3002\n    *   **\u76ee\u6807\u611f**\uff1a\u76ee\u6807\u6a21\u7cca\uff0c\u7f3a\u4e4f\u6e05\u6670\u3001\u575a\u5b9a\u7684\u5b66\u4e60\u89c4\u5212\u548c\u6210\u679c\u9884\u671f\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u5df2\u5b8c\u6210\u652f\u4ed8\uff084380\u5143\uff09\uff0c\u8fdb\u5165\u5df2\u4ed8\u8d39\u5b66\u5458\u6c60\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u7f3a\u5931**\u3002\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u4e3a\u72ec\u7acb\u51b3\u7b56\uff0c\u6216\u9700\u4e0e\u5bb6\u4eba\u5546\u8bae\u3002\u6b64\u4e3a\u6838\u5fc3\u98ce\u9669\u70b9\u3002\n*   **\u6b65\u9aa41-4\u5224\u5b9a**\uff1a\u56e0\u5173\u952e\u4fe1\u606f\uff08\u7279\u522b\u662f\u51b3\u7b56\u6743\u3001\u6df1\u5c42\u52a8\u673a\u3001\u8d44\u6e90\u8be6\u60c5\uff09\u7f3a\u5931\uff0c\u65e0\u6cd5\u8fdb\u884c\u53ef\u9760\u7684ABCD\u8c61\u9650\u5224\u5b9a\u3002\u5f53\u524d\u4ec5\u80fd\u5b9a\u4f4d\u4e3a\u201c**\u5df2\u4ed8\u8d39\u4f46\u7528\u6237\u753b\u50cf\u6a21\u7cca\u7684\u4f53\u9a8c\u8425\u53c2\u4e0e\u8005**\u201d\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d (T1-T8)\n\u57fa\u4e8e\u6709\u9650\u4fe1\u606f\uff0c\u6700\u63a5\u8fd1 **T7 \u673a\u4f1a\u63a2\u7d22\u578b**\u3002\n*   **\u7279\u5f81\u7b26\u5408\u70b9**\uff1a\u88ab\u201cAI\u98ce\u53e3\u201d\u3001\u201c\u7761\u540e\u6536\u76ca\u201d\u3001\u201c\u5feb\u901f\u53d8\u73b0\u201d\u7b49\u673a\u4f1a\u5438\u5f15\uff1b\u6709\u6d45\u5c42\u5174\u8da3\uff08\u770b\u5c0f\u8bf4\u3001\u66fe\u5199\u4f5c\uff09\uff1b\u884c\u52a8\u4e0a\u8868\u73b0\u4e3a\u5c1d\u8bd5\u548c\u53c2\u4e0e\uff08\u5b8c\u6210\u4f53\u9a8c\u8425\u52a8\u4f5c\uff09\uff1b\u4f46\u7f3a\u4e4f\u6df1\u5ea6\u627f\u8bfa\u548c\u6e05\u6670\u89c4\u5212\u3002\n*   **\u4e0d\u786e\u5b9a\u70b9**\uff1a\u65e0\u6cd5\u786e\u8ba4\u5176\u662f\u5426\u5177\u6709T7\u5178\u578b\u7684\u201c\u5e7f\u6cdb\u5c1d\u8bd5\u3001\u6d45\u5c1d\u8f84\u6b62\u201d\u884c\u4e3a\u6a21\u5f0f\uff0c\u6216\u662f\u5426\u53ef\u80fd\u8f6c\u5316\u4e3a\u66f4\u4e13\u6ce8\u7684\u7c7b\u578b\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669\u7b49\u7ea7\uff1a\u4e2d**\n*   **\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa\u201c\u98ce\u53e3\u7ea2\u5229\u201d\u3001\u201c\u7761\u540e\u6536\u76ca\u201d\u3001\u201c90%\u8fc7\u7a3f\u7387\u201d\u3001\u201c\u6536\u76ca1\u4e07-5\u4e07\u201d\uff0c\u6781\u6613\u5728\u5b66\u5458\u5b9e\u64cd\u9047\u963b\u6216\u6536\u76ca\u4e0d\u4f73\u65f6\u5f15\u53d1\u201c\u865a\u5047\u5ba3\u4f20\u201d\u6295\u8bc9\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u672a\u77e5**\u3002\u652f\u4ed84380\u5143\u540e\u662f\u5426\u5b58\u5728\u7ecf\u6d4e\u538b\u529b\u672a\u77e5\uff0c\u9700\u540e\u7eed\u89c2\u5bdf\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u80fd\u8ddf\u4e0a\u4f53\u9a8c\u8425\u8282\u594f\u3002\n    4.  **\u5185\u5bb9\u4e0d\u5339\u914d**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u57fa\u7840\u8584\u5f31\uff08AI\u5de5\u5177\u4e0d\u719f\uff09\uff0c\u82e5\u6b63\u5f0f\u8bfe\u7a0b\u96be\u5ea6\u8df3\u8dc3\u5927\uff0c\u53ef\u80fd\u8ddf\u4e0d\u4e0a\u3002\n    5.  **\u670d\u52a1\u4f53\u9a8c**\uff1a**\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u9500\u552e\u8ddf\u8fdb\u5c1a\u53ef\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u9ad8\u98ce\u9669**\u3002**\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u7f3a\u5931\u662f\u91cd\u5927\u98ce\u9669\u655e\u53e3**\u3002\u53ef\u80fd\u5b58\u5728\u672a\u544a\u77e5\u5bb6\u4eba\u7684\u60c5\u51b5\uff0c\u540e\u7eed\u6613\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u5bfc\u81f4\u9000\u8d39\u3002\n    7.  **\u7ade\u54c1\u6bd4\u8f83/\u51b2\u52a8\u6d88\u8d39\u540e\u6094**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u51b3\u7b56\u8fc7\u7a0b\u77ed\uff0c\u672a\u89c1\u6df1\u5ea6\u6bd4\u8f83\u548c\u7406\u6027\u89c4\u5212\uff0c\u6613\u5728\u51b7\u9759\u540e\u6216\u770b\u5230\u5176\u4ed6\u4fe1\u606f\u65f6\u540e\u6094\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5408\u89c4\u95ee\u9898**\uff1a\n    *   **\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u8bf1\u5bfc**\uff1a\u9500\u552e\u5927\u91cf\u4f7f\u7528\u201c\u628a\u63e1\u98ce\u53e3\u53d8\u73b0\u201d\u3001\u201c\u8eba\u8d5a\u201d\u3001\u201c\u7761\u540e\u6536\u76ca\u201d\u3001\u201c\u6539\u53d8\u81ea\u5df1\u201d\u7b49\u8bcd\u6c47\uff0c\u5e76\u5c55\u793a\u9ad8\u6536\u76ca\u6848\u4f8b\uff08\u6708\u5165\u8fd1\u4e94\u5343\uff09\uff0c**\u5b58\u5728\u660e\u663e\u7684\u5938\u5927\u5ba3\u4f20\u548c\u8bf1\u5bfc\u6d88\u8d39\u503e\u5411**\u3002\n    *   **\u5236\u9020\u7a00\u7f3a\u4e0e\u7d27\u8feb\u611f**\uff1a\u201c\u4eba\u7684\u4e00\u751f\u80fd\u7ecf\u5386\u7684\u98ce\u53e3\u5c48\u6307\u53ef\u6570\u201d\u3001\u201c\u53ea\u6709\u51e0\u4e2a\u540d\u989d\u201d\u7b49\u8bdd\u672f\uff0c\u7b26\u5408\u5236\u9020\u7126\u8651\u548c\u7d27\u8feb\u611f\u7684\u5957\u8def\u3002\n    *   **\u98ce\u9669\u63d0\u793a\u7f3a\u5931**\uff1a\u5168\u7a0b\u672a\u63d0\u53ca\u5b66\u4e60\u96be\u5ea6\u3001\u6240\u9700\u65f6\u95f4\u6295\u5165\u3001\u6536\u76ca\u4e0d\u786e\u5b9a\u6027\u7b49\u98ce\u9669\u3002\n*   **\u4f26\u7406\u98ce\u9669**\uff1a\u5c06\u6559\u80b2\u4ea7\u54c1\u5305\u88c5\u4e3a\u201c\u5feb\u901f\u81f4\u5bcc\u201d\u5de5\u5177\uff0c\u53ef\u80fd\u5438\u5f15\u4e0d\u9002\u5408\u7684\u5b66\u5458\uff0c\u540e\u7eed\u6613\u4ea7\u751f\u7ea0\u7eb7\u548c\u5931\u671b\u60c5\u7eea\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6838\u5fc3\u4efb\u52a1\uff1a\u6df1\u5ea6\u7834\u51b0\uff0c\u5b8c\u6210\u7528\u6237\u753b\u50cf\uff0c\u91cd\u70b9\u6392\u67e5\u51b3\u7b56\u6743\u4e0e\u771f\u5b9e\u9884\u671f**\u3002\n    *   **\u9996\u901a\u7535\u8bdd/\u6c9f\u901a**\uff1a\u5fc5\u987b\u8fdb\u884c\u3002\u91cd\u70b9\u4e86\u89e3\uff1a\n        1.  **\u8d2d\u8bfe\u51b3\u7b56\u8fc7\u7a0b**\uff1a\u662f\u81ea\u5df1\u51b3\u5b9a\uff1f\u662f\u5426\u4e0e\u5bb6\u4eba\u5546\u91cf\uff1f\u5bb6\u4eba\u662f\u5426\u652f\u6301\uff1f\n        2.  **\u5b66\u4e60\u76ee\u6807\u5177\u4f53\u5316**\uff1a\u5e0c\u671b\u8fbe\u5230\u4ec0\u4e48\u5177\u4f53\u6c34\u5e73\uff1f\u671f\u671b\u591a\u4e45\u4ea7\u751f\u6536\u76ca\uff1f\u9884\u671f\u6536\u76ca\u662f\u591a\u5c11\uff1f\n        3.  **\u4e2a\u4eba\u80cc\u666f**\uff1a\u804c\u4e1a\u3001\u7a7a\u95f2\u65f6\u95f4\u3001\u7ecf\u6d4e\u72b6\u51b5\u3002\n        4.  **\u98ce\u9669\u544a\u77e5**\uff1a\u6e29\u548c\u5730\u94fa\u57ab\u5b66\u4e60\u9700\u8981\u6301\u7eed\u7ec3\u4e60\uff0c\u6536\u76ca\u4e0e\u4e2a\u4eba\u6295\u5165\u3001\u4f5c\u54c1\u8d28\u91cf\u3001\u5e02\u573a\u53cd\u9988\u76f8\u5173\uff0c\u7ba1\u7406\u9884\u671f\u3002\n*   **\u5173\u7cfb\u5efa\u7acb**\uff1a\u907f\u514d\u7ee7\u7eed\u4f7f\u7528\u201c\u98ce\u53e3\u201d\u3001\u201c\u66b4\u5bcc\u201d\u8bdd\u672f\u3002\u8f6c\u5411\u5173\u6ce8\u5176\u201c\u66fe\u5199\u4f5c\u201d\u7684\u5174\u8da3\u70b9\uff0c\u80af\u5b9a\u5176\u5c1d\u8bd5AI\u5de5\u5177\u7684\u63a2\u7d22\u7cbe\u795e\uff0c\u5efa\u7acb\u201c\u6280\u80fd\u6210\u957f\u4f19\u4f34\u201d\u5f62\u8c61\u3002\n*   **\u5b66\u4e60\u652f\u6301**\uff1a\n    *   \u521d\u671f\u91cd\u70b9\u5173\u6ce8\u5176AI\u5de5\u5177\uff08\u5982Kimi\uff09\u4f7f\u7528\u719f\u7ec3\u5ea6\uff0c\u63d0\u4f9b\u57fa\u7840\u64cd\u4f5c\u652f\u6301\u3002\n    *   \u56e0\u5176\u6709\u201c\u624b\u5199\u201d\u57fa\u7840\uff0c\u53ef\u5f15\u5bfc\u5176\u5c06\u65e7\u6709\u521b\u4f5c\u60f3\u6cd5\u4e0eAI\u7ed3\u5408\uff0c\u63d0\u5347\u6210\u5c31\u611f\u3002\n    *   \u8bbe\u5b9a\u9636\u6bb5\u6027\u3001\u6613\u8fbe\u6210\u7684\u5c0f\u76ee\u6807\uff08\u5982\u5b8c\u6210\u4e00\u4e2a\u5b8c\u6574\u77ed\u6545\u4e8b\u5927\u7eb2\uff09\uff0c\u907f\u514d\u4e00\u5f00\u59cb\u5c31\u65bd\u52a0\u53d8\u73b0\u538b\u529b\u3002\n*   **\u98ce\u9669\u76d1\u63a7**\uff1a\n    *   **\u91cd\u70b9\u5173\u6ce8**\uff1a\u8bfe\u7a0b\u96be\u5ea6\u63d0\u5347\u65f6\u7684\u53cd\u9988\u3001\u9996\u6b21\u6295\u7a3f\u88ab\u62d2\u6216\u6536\u76ca\u4e0d\u4f73\u65f6\u7684\u60c5\u7eea\u3001\u662f\u5426\u63d0\u53ca\u5bb6\u5ead\u538b\u529b\u3002\n    *   **\u63d0\u524d\u5e72\u9884**\uff1a\u4e00\u65e6\u53d1\u73b0\u6c14\u9981\u6216\u62b1\u6028\u82d7\u5934\uff0c\u7acb\u5373\u8fdb\u884c\u9f13\u52b1\u548c\u4e00\u5bf9\u4e00\u8f85\u5bfc\uff0c\u91cd\u7533\u5b66\u4e60\u66f2\u7ebf\uff0c\u5206\u4eab\u5176\u4ed6\u5b66\u5458\u4ece0\u52301\u7684\u5386\u7a0b\u3002\n*   **\u4ea7\u54c1\u5339\u914d**\uff1a\u7528\u6237\u5df2\u8d2d\u4e70AI\u5199\u4f5c\u8bfe\u7a0b\u3002\u73ed\u4e3b\u4efb\u9700\u5f15\u5bfc\u5176\u624e\u5b9e\u5b8c\u6210\u57fa\u7840\u6a21\u5757\u5b66\u4e60\uff0c**\u6682\u4e0d\u4e3b\u52a8\u63a8\u8350\u66f4\u9ad8\u9636\u6216\u66f4\u6602\u8d35\u7684\u8bfe\u7a0b**\uff0c\u5f85\u5176\u5efa\u7acb\u7a33\u5b9a\u5b66\u4e60\u4e60\u60ef\u3001\u4ea7\u51fa\u521d\u6b65\u6210\u679c\u3001\u4e14\u4fe1\u4efb\u5173\u7cfb\u7262\u56fa\u540e\uff0c\u518d\u6839\u636e\u5176\u8fdb\u5c55\u81ea\u7136\u63a8\u8350\u8fdb\u9636\u5185\u5bb9\u3002\n\n{\"core_type\": \"T7 \u673a\u4f1a\u63a2\u7d22\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd/\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u5df2\u8d2dAI\u5199\u4f5c\u8bfe\uff0c\u9700\u592f\u5b9e\u57fa\u7840\uff0c\u6682\u4e0d\u8ffd\u52a0\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}";
