    <script>
        const markdownText = "# \u7528\u6237\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4ec5\u4e3a\u5f00\u8425\u540e\u670d\u52a1\u8ddf\u8fdb\u7247\u6bb5\uff0c\u7f3a\u5931\u5173\u952e\u51b3\u7b56\u4fe1\u606f\uff08\u5982\uff1a\u652f\u4ed8\u8fc7\u7a0b\u3001\u51b3\u7b56\u52a8\u673a\u3001\u5bb6\u5ead\u652f\u6301\u3001\u7ecf\u6d4e\u72b6\u51b5\u3001\u5b66\u4e60\u76ee\u6807\u3001\u8fc7\u5f80\u7ecf\u5386\uff09\uff0c\u65e0\u6cd5\u5b8c\u6574\u8bc4\u4f30\u4e09\u8f74\u4fe1\u53f7\u4e0e\u98ce\u9669\u3002\n\n---\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u4ec5\u663e\u793a\u4e3a\u5f00\u8425\u540e\u5b66\u5458\uff0c\u4e3b\u52a8\u8be2\u95ee\u6280\u672f\u95ee\u9898\uff08\u7ed1\u5b9a\u3001\u56de\u653e\u3001\u8ba4\u8bc1\uff09\u3001\u786e\u8ba4\u8bfe\u7a0b\u5b89\u6392\u3001\u5c1d\u8bd5\u5b8c\u6210\u4f5c\u4e1a\u3002\u8868\u73b0\u4e3a**\u4efb\u52a1\u9a71\u52a8\u578b**\u7684\u521d\u671f\u914d\u5408\uff0c\u4f46\u6df1\u5c42\u5b66\u4e60\u76ee\u6807\uff08\u5174\u8da3/\u53d8\u73b0/\u8f6c\u884c\uff09\u4e0d\u660e\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u53ef\u63a8\u65ad\u62e5\u6709\u667a\u80fd\u624b\u673a\u3001\u7535\u8111\uff0c\u5177\u5907\u57fa\u7840\u64cd\u4f5c\u80fd\u529b\uff0c\u4f46\u65f6\u95f4\u8d44\u6e90\u7d27\u5f20\uff08\u201c\u5de5\u4f5c\u65e5\u767d\u5929\u6ca1\u65f6\u95f4\u201d\uff09\u3002\u7ecf\u6d4e\u72b6\u51b5\u3001\u53ef\u6295\u5165\u5b66\u4e60\u65f6\u957f\u3001\u8bbe\u5907\u4e13\u4e1a\u5ea6\u672a\u77e5\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a**\u4e2d\u7b49\u504f\u4e0a**\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u7ed1\u5b9a\u3001\u56de\u653e\u3001\u8f6f\u4ef6\u4f7f\u7528\uff09\u65f6\u80fd\u4e3b\u52a8\u3001\u591a\u6b21\u8be2\u95ee\uff0c\u5e76\u5c1d\u8bd5\u89e3\u51b3\uff08\u5f55\u5c4f\uff09\uff0c\u672a\u8868\u73b0\u51fa\u660e\u663e\u632b\u8d25\u6216\u62b1\u6028\u3002\u5bf9\u6d41\u7a0b\u590d\u6742\u6027\u548c\u65b0\u77e5\u8bc6\uff08A+\u3001\u8f6f\u4ef6\uff09\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u56f0\u60d1\uff08\u201c\u6709\u70b9\u7cca\u6d82\u201d\u3001\u201c\u6ca1\u592a\u660e\u767d\u201d\uff09\uff0c\u4f46\u6001\u5ea6\u79ef\u6781\uff0c\u613f\u610f\u8ddf\u968f\u6307\u5f15\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**\uff1a**\u4fe1\u606f\u7f3a\u5931**\u3002\u8bb0\u5f55\u4e2d\u672a\u63d0\u53ca\u652f\u4ed8\u884c\u4e3a\u3001\u91d1\u989d\u3001\u652f\u4ed8\u4eba\u4fe1\u606f\u3002**\u65e0\u6cd5\u5224\u65ad**\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u7f3a\u5931**\u3002\u8bb0\u5f55\u4e2d\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u6210\u5458\u6216\u51b3\u7b56\u76f8\u5173\u65b9\u3002**\u65e0\u6cd5\u5224\u65ad**\u3002\n*   **\u6b65\u9aa41 - \u9700\u6c42\u521a\u6027**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u4ec5\u89c2\u5bdf\u5230\u5bf9\u8bfe\u7a0b\u6d41\u7a0b\u7684\u914d\u5408\u4e0e\u7591\u95ee\uff0c\u672a\u8868\u9732\u660e\u786e\u3001\u5f3a\u70c8\u7684\u5b66\u4e60\u8bc9\u6c42\u6216\u75db\u70b9\u3002\n*   **\u6b65\u9aa42 - \u51b3\u7b56\u7406\u6027**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u65e0\u6cd5\u5224\u65ad\u5176\u62a5\u540d\u662f\u57fa\u4e8e\u7406\u6027\u8c03\u7814\u8fd8\u662f\u51b2\u52a8\u6d88\u8d39\u3002\n*   **\u6b65\u9aa43 - \u652f\u4ed8\u80fd\u529b**\uff1a**\u4fe1\u606f\u7f3a\u5931**\u3002\u65e0\u4efb\u4f55\u7ecf\u6d4e\u72b6\u51b5\u4fe1\u606f\u3002\n*   **\u6b65\u9aa44 - \u884c\u52a8\u529b**\uff1a**\u4e2d\u7b49**\u3002\u80fd\u6309\u65f6\u54cd\u5e94\u73ed\u4e3b\u4efb\u4efb\u52a1\uff08\u7ed1\u5b9a\u3001\u8ba4\u8bc1\uff09\uff0c\u4e3b\u52a8\u63d0\u95ee\u5e76\u5c1d\u8bd5\u5b8c\u6210\u4f5c\u4e1a\uff0c\u4f46\u4e3b\u52a8\u6027\u591a\u4f53\u73b0\u5728\u201c\u88ab\u4efb\u52a1\u9a71\u52a8\u201d\u7684\u54cd\u5e94\u4e0a\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**\uff1a**\u4fe1\u606f\u4e25\u91cd\u4e0d\u8db3\uff0c\u65e0\u6cd5\u8fdb\u884c\u6709\u6548ABCD\u5206\u5c42**\u3002\u5f53\u524d\u884c\u4e3a\u6a21\u5f0f\u66f4\u63a5\u8fd1\u5df2\u4ed8\u8d39\u7528\u6237\u7684**\u521d\u671f\u670d\u52a1\u8ddf\u8fdb\u9636\u6bb5**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u65e0\u6cd5\u7cbe\u786e\u5339\u914d**\u3002\n*   **\u884c\u4e3a\u503e\u5411**\uff1a\u5f53\u524d\u8868\u73b0\u4e0e **T7 \u8c28\u614e\u8ddf\u968f\u8005** \u6216 **T8 \u4efb\u52a1\u6267\u884c\u8005** \u6709\u90e8\u5206\u91cd\u53e0\u3002\u7279\u5f81\u4e3a\uff1a\u9075\u5b88\u89c4\u5219\u3001\u9010\u6b65\u5b8c\u6210\u4efb\u52a1\u3001\u5bf9\u7ec6\u8282\u548c\u6280\u672f\u64cd\u4f5c\u654f\u611f\u3001\u9700\u8981\u660e\u786e\u6307\u5f15\u3001\u81ea\u4e3b\u63a2\u7d22\u548c\u6df1\u5ea6\u76ee\u6807\u611f\u4e0d\u5f3a\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u4f4e\u98ce\u9669**\u3002\u5904\u4e8e\u8bfe\u7a0b\u521d\u671f\uff0c\u5c1a\u672a\u6d89\u53ca\u6548\u679c\u8bc4\u4f30\u3002\n    2.  **\u65f6\u95f4\u7cbe\u529b\u51b2\u7a81**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u5de5\u4f5c\u65e5\u767d\u5929\u6ca1\u65f6\u95f4\u201d\uff0c\u4f9d\u8d56\u665a\u4e0a\u548c\u5468\u672b\u3002**\u9700\u5173\u6ce8\u5176\u957f\u671f\u65f6\u95f4\u5339\u914d\u5ea6**\u3002\n    3.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u4fe1\u606f\u7f3a\u5931\uff0c\u65e0\u6cd5\u8bc4\u4f30**\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u4fe1\u606f\u7f3a\u5931\uff0c\u65e0\u6cd5\u8bc4\u4f30**\u3002\n    5.  **\u9500\u552e\u627f\u8bfa\u4e0d\u7b26**\uff1a**\u4fe1\u606f\u7f3a\u5931\uff0c\u65e0\u6cd5\u8bc4\u4f30**\u3002\u5f53\u524d\u670d\u52a1\u6c9f\u901a\u672a\u53d1\u73b0\u8fc7\u5ea6\u627f\u8bfa\u3002\n    6.  **\u670d\u52a1\u4f53\u9a8c\u5dee**\uff1a**\u4f4e\u98ce\u9669**\u3002\u5f53\u524d\u4e0e\u73ed\u4e3b\u4efb\uff08\u76ae\u86cb\uff09\u4e92\u52a8\u987a\u7545\u3001\u53cb\u597d\uff0c\u95ee\u9898\u5f97\u5230\u53ca\u65f6\u89e3\u7b54\u3002\n    7.  **\u5e73\u53f0/\u4ea7\u54c1\u95ee\u9898**\uff1a**\u4f4e\u98ce\u9669**\u3002\u9047\u5230\u7684\u4e3b\u8981\u662f\u64cd\u4f5c\u6d41\u7a0b\u4e0a\u7684\u56f0\u60d1\uff08\u7ed1\u5b9a\u3001\u8f6f\u4ef6\uff09\uff0c\u5df2\u83b7\u89e3\u51b3\uff0c\u672a\u5347\u7ea7\u4e3a\u5bf9\u5e73\u53f0\u7684\u6295\u8bc9\u3002\n*   **\u7efc\u5408\u98ce\u9669\u7b49\u7ea7**\uff1a**\u4e2d**\uff08\u4e3b\u8981\u57fa\u4e8e\u65f6\u95f4\u51b2\u7a81\u7684\u6f5c\u5728\u98ce\u9669\uff0c\u5176\u4ed6\u7ef4\u5ea6\u56e0\u4fe1\u606f\u7f3a\u5931\u6682\u8bc4\u4f4e\u98ce\u9669\uff09\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5f53\u524d\u8bb0\u5f55\u672a\u53d1\u73b0**\u5938\u5927\u627f\u8bfa\u3001\u8d2c\u635f\u7ade\u54c1\u3001\u5236\u9020\u7126\u8651\u3001\u8bf1\u5bfc\u8d37\u6b3e\u7b49\u8fdd\u89c4\u884c\u4e3a\u3002\n*   **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a**\u4fe1\u606f\u7f3a\u5931\u5bfc\u81f4\u7684\u98ce\u9669\u76f2\u533a**\u3002\u7531\u4e8e\u7f3a\u4e4f\u652f\u4ed8\u548c\u51b3\u7b56\u73af\u8282\u8bb0\u5f55\uff0c\u65e0\u6cd5\u5224\u65ad\u9500\u552e\u524d\u7aef\u662f\u5426\u5b58\u5728\u5408\u89c4\u95ee\u9898\uff08\u5982\uff1a\u672a\u5145\u5206\u544a\u77e5\u98ce\u9669\u3001\u672a\u786e\u8ba4\u5bb6\u5ead\u652f\u6301\u7b49\uff09\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d**\uff1a**\u5339\u914d**\u3002\u7528\u6237\u76ee\u524d\u6b63\u6309\u90e8\u5c31\u73ed\u53c2\u4e0e\u8bfe\u7a0b\uff0c\u672a\u8868\u73b0\u51fa\u4e0e\u4ea7\u54c1\u6a21\u5f0f\u7684\u660e\u663e\u4e0d\u9002\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**\u9996\u5468\u5185\u8fdb\u884c\u6df1\u5ea6\u9700\u6c42\u4e0e\u80cc\u666f\u8bbf\u8c08**\u3002\n*   **\u5177\u4f53\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u8865\u5168\u4fe1\u606f**\uff1a\u5728\u8fd1\u671f1v1\u6c9f\u901a\u4e2d\uff0c\u6e29\u548c\u63a2\u8be2\u5176**\u62a5\u540d\u6838\u5fc3\u52a8\u673a**\u3001**\u5b66\u4e60\u76ee\u6807**\uff08\u5174\u8da3/\u526f\u4e1a/\u804c\u4e1a\uff09\u3001**\u6bcf\u65e5/\u6bcf\u5468\u53ef\u56fa\u5b9a\u6295\u5165\u7684\u5b66\u4e60\u65f6\u95f4**\u3001**\u5bb6\u5ead\u662f\u5426\u77e5\u6653\u5e76\u652f\u6301**\u3002\n    2.  **\u7ba1\u7406\u9884\u671f**\uff1a\u660e\u786e\u544a\u77e5\u8bfe\u7a0b\u540e\u671f\u5bf9\u65f6\u95f4\u6295\u5165\uff08\u5c24\u5176\u662f\u7ec3\u4e60\u548c\u4f5c\u4e1a\uff09\u7684\u8981\u6c42\uff0c\u6821\u51c6\u5176\u201c\u5de5\u4f5c\u65e5\u767d\u5929\u6ca1\u65f6\u95f4\u201d\u7684\u73b0\u5b9e\u4e0e\u8bfe\u7a0b\u8981\u6c42\u4e4b\u95f4\u7684\u5339\u914d\u5ea6\u3002\n    3.  **\u6280\u672f\u5b89\u629a**\uff1a\u6301\u7eed\u63d0\u4f9b\u8010\u5fc3\u3001\u6e05\u6670\u7684\u6280\u672f\u64cd\u4f5c\u6307\u5bfc\uff0c\u56e0\u5176\u5bf9\u6d41\u7a0b\u7ec6\u8282\u654f\u611f\u4e14\u6613\u4ea7\u751f\u56f0\u60d1\uff0c\u63d0\u524d\u3001\u5206\u6b65\u9aa4\u9884\u544a\u540e\u7eed\u590d\u6742\u64cd\u4f5c\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u3001\u5f55\u97f3\u63d0\u4ea4\uff09\uff0c\u964d\u4f4e\u5176\u7126\u8651\u611f\u3002\n    4.  **\u5efa\u7acb\u4fe1\u4efb**\uff1a\u4fdd\u6301\u5f53\u524d\u53cb\u597d\u3001\u53ca\u65f6\u7684\u670d\u52a1\u98ce\u683c\uff0c\u5de9\u56fa\u5176\u201c\u4efb\u52a1\u6267\u884c\u8005\u201d\u7684\u914d\u5408\u5ea6\uff0c\u9010\u6b65\u5f15\u5bfc\u5176\u4ece\u201c\u5b8c\u6210\u4efb\u52a1\u201d\u5411\u201c\u4e3b\u52a8\u63a2\u7d22\u201d\u8f6c\u5316\u3002\n\n{\"core_type\": \"\u4fe1\u606f\u4e0d\u8db3\uff0c\u884c\u4e3a\u503e\u5411T7/T8\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u9996\u5468\u5185\u8fdb\u884c\u6df1\u5ea6\u9700\u6c42\u4e0e\u80cc\u666f\u8bbf\u8c08\"}";
