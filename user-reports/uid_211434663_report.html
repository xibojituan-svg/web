    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID: 211434663\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 211434663 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u68a6\u5883\uff08\u90d1\u5b87\uff09\u3001\u4e54\u672818\uff08\u5468\u8389\u840d\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad/AI\u5199\u4f5c\u4f53\u9a8c\u8425\uff08\u610f\u5411\u6b63\u4ef7\u8bfe\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u88ab\u8feb\u5206\u671f**\uff08\u7528\u6237\u4e3b\u52a8\u63d0\u53ca\u201c\u5206\u671f\u4e86\u56db\u4e2a\u6708\u201d\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u7528\u6237\u81ea\u8ff0\u201c\u7a7a\u95f2\u53ea\u4e09\u4e2a\u5c0f\u65f6\u201d\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\uff08\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u7528\u6237\u4e3b\u52a8\u66b4\u9732\u4e86\u5173\u952e\u7684\u8eab\u4f53\u72b6\u51b5\u3001\u7ecf\u6d4e\u72b6\u51b5\u548c\u5b66\u4e60\u610f\u613f\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b07\u4f4e\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34(\u4e2d)\u4e0e\u53d8\u73b0\u7126\u8651(\u4f4e)\u7684\u590d\u5408\u4f53**\u3002\u7528\u6237\u5bf9\u6709\u58f0\u6f14\u64ad\u8868\u73b0\u51fa\u5174\u8da3\uff08\u60f3\u5c1d\u8bd5\u6b63\u53cd\u6d3e\uff09\uff0c\u4f46\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u5bfb\u627e\u4e00\u6761\u5728\u8eab\u4f53\u9650\u5236\u4e0b\u7684\u751f\u5b58\u51fa\u8def\uff0c\u53d8\u73b0\u8bc9\u6c42\u7d27\u8feb\u4e14\u73b0\u5b9e\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u7a7a\u95f2\u53ea\u4e09\u4e2a\u5c0f\u65f6\uff0c\u56e0\u8eab\u4f53\u539f\u56e0\u53ef\u80fd\u53ea\u80fd\u517c\u804c\u201d\n  > \u201c\u6b8b\u75be\u4eba\u6709\u591a\u5c11\u8865\u8d34\u201d\n  > \u201c\u5206\u671f\u4e86\u56db\u4e2a\u6708\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u9700\u8981\u5206\u671f4\u4e2a\u6708\u652f\u4ed8\u8bfe\u7a0b\u8d39\u7528\uff0c\u5e76\u4e3b\u52a8\u8be2\u95ee\u6b8b\u75be\u4eba\u8865\u8d34\uff0c\u7ecf\u6d4e\u538b\u529b\u660e\u663e\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e** \u2014 \u6bcf\u65e5\u4ec5\u67093\u5c0f\u65f6\u7a7a\u95f2\u65f6\u95f4\uff0c\u4e14\u53d7\u201c\u5bb6\u65cf\u9057\u4f20\u75c5\u201d\uff08\u4e00\u53ea\u773c\u5931\u660e\uff0c\u4e00\u53ea\u6df1\u5ea6\u8fd1\u89c6\uff09\u5f71\u54cd\uff0c\u7cbe\u529b\u4e0e\u64cd\u4f5c\u80fd\u529b\u53d7\u9650\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u672a\u63d0\u53ca\uff0c\u4f46\u7ed3\u5408\u5176\u8eab\u4f53\u72b6\u51b5\u548c\u7ecf\u6d4e\u538b\u529b\uff0c\u5bb6\u5ead\u652f\u6301\u53ef\u80fd\u6709\u9650\u6216\u6784\u6210\u538b\u529b\u6e90\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u7528\u6237\u5728\u5b66\u4e60\u521d\u671f\u5373\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u81ea\u6211\u6000\u7591\u548c\u60b2\u89c2\u9884\u671f\uff0c\u5c06\u5fae\u5c0f\u632b\u6298\uff08\u53e3\u8154\u64cd\u6d41\u53e3\u6c34\uff09\u4e0e\u751f\u5b58\u56f0\u5883\uff08\u8eab\u4f53\u6b8b\u75be\uff09\u5173\u8054\uff0c\u5fc3\u7406\u9632\u7ebf\u8106\u5f31\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6709\u70b9\u8499\u201d\n  > \u201c\u901a\u4e0d\u8fc7\u8fde\u9f99\u5957\u4e0d\u884c\u201d\n  > \u201c\u4e3a\u4ec0\u5f20\u5634\u6d41\u53e3\u6c34\u201d\n  > \u201c\u53cd\u6b63\u6cbb\u4e0d\u597d\u795e\u7ecf\u9057\u4f20\uff0c\u5403\u3a85\u4e0d\u51b7\u4e0d\u997f\u5403\u836f\u5c31\u884c\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42\uff08\u7126\u8651\u4fdd\u969c\uff09**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u56e0\u8eab\u4f53\u6b8b\u75be\u548c\u6709\u9650\u7684\u7ecf\u6d4e\u80fd\u529b\uff0c\u5bf9\u672a\u6765\u751f\u5b58\u4fdd\u969c\u7684\u6781\u5ea6\u7126\u8651\u3002** \u4ed6\u5b66\u4e60\u6709\u58f0\u6f14\u64ad\u7684\u6838\u5fc3\u76ee\u7684\uff0c\u5e76\u975e\u51fa\u4e8e\u5174\u8da3\u6216\u81ea\u6211\u5b9e\u73b0\uff0c\u800c\u662f\u5bfb\u627e\u4e00\u6761\u5728\u73b0\u5b9e\u56f0\u5883\u4e0b\u201c\u80fd\u6d3b\u4e0b\u53bb\u201d\u7684\u8def\u5f84\u3002\u4e00\u53e5\u201c\u901a\u4e0d\u8fc7\u8fde\u9f99\u5957\u4e0d\u884c\u201d\u66b4\u9732\u4e86\u5176\u5c06\u5b66\u4e60\u7ed3\u679c\u4e0e\u751f\u5b58\u5e95\u7ebf\u76f4\u63a5\u6302\u94a9\u7684\u6050\u614c\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u9632\u62a4\u76fe\u5f0f\u7684\u5b89\u5168\u627f\u8bfa\u4e0e\u4f4e\u95e8\u69db\u7684\u751f\u5b58\u5e0c\u671b\u3002** \u4ed6\u4e0d\u9700\u8981\u753b\u5927\u997c\uff0c\u9700\u8981\u7684\u662f\u201c\u5373\u4f7f\u4f60\u8eab\u4f53\u4e0d\u4fbf\u3001\u65f6\u95f4\u6709\u9650\uff0c\u4e5f\u80fd\u901a\u8fc7\u8fd9\u6761\u8def\u83b7\u5f97\u4e00\u4efd\u7a33\u5b9a\u3001\u53ef\u53ca\u7684\u5fae\u8584\u6536\u5165\u201d\u7684\u786e\u5b9a\u6027\u3002\u9700\u8981\u6781\u81f4\u7684\u8010\u5fc3\u3001\u5305\u5bb9\u548c\u201c\u4e0d\u629b\u5f03\u201d\u7684\u966a\u4f34\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b**\uff08\u98ce\u9669\u7ba1\u63a7\u578b\uff09 |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b**\uff08\u4e25\u91cd\u5185\u8017\uff09 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u26a0\ufe0f **\u5df2\u89e6\u53d1 D \u7c7b\u7194\u65ad\u7ea2\u7ebf\uff01**\uff08\u4ea4\u6613\u4fe1\u53f7\u786c\u62e6\u622a\u5c42\uff09\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u7528\u6237\u4e3b\u52a8\u63d0\u53ca\u201c\u5206\u671f\u4e86\u56db\u4e2a\u6708\u201d\uff0c\u7ed3\u5408\u5176\u4f4e\u8d44\u6e90\u5e95\u5ea7\uff08\u8eab\u4f53\u6b8b\u75be\u3001\u65f6\u95f4\u5c11\u3001\u7ecf\u6d4e\u538b\u529b\uff09\uff0c\u7b26\u5408**C2\u88c5B\u7c7b\u62e6\u622a**\u6761\u4ef6\u3002**\u5fc5\u987b\u7acb\u5373\u6267\u884c\u4f53\u9a8c\u5305\u964d\u7ea7\u63a8\u9001\uff0c\u5ef6\u8fdf\u8f6c\u5316\u7a97\u53e348\u5c0f\u65f6\uff0c\u5e76\u7531\u73ed\u4e3b\u4efb\u4e3b\u52a8\u6478\u5e95\u5176\u501f\u8d37\u538b\u529b\u771f\u5b9e\u60c5\u51b5\u3002**\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4e2d | \u82e5\u5bb6\u4eba\u53d1\u73b0\u5176\u501f\u94b1/\u5206\u671f\u62a5\u540d\u5b66\u4e60\u4e00\u4e2a\u201c\u4e0d\u9760\u8c31\u201d\u7684\u526f\u4e1a\uff0c\u53ef\u80fd\u5f3a\u70c8\u53cd\u5bf9\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u6781\u9ad8** | \u6bcf\u65e5\u4ec53\u5c0f\u65f6\u7a7a\u95f2\uff0c\u4e14\u8eab\u4f53\u4e0d\u4fbf\uff0c\u6781\u6613\u56e0\u8ddf\u4e0d\u4e0a\u5b66\u4e60\u8282\u594f\u3001\u64cd\u4f5c\u56f0\u96be\uff08\u5982\u8fdb\u7fa4\u5931\u8d25\uff09\u800c\u4ea7\u751f\u5de8\u5927\u632b\u8d25\u611f\uff0c\u81ea\u8d23\u60c5\u7eea\u7d2f\u79ef\u540e\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | \u4efb\u4f55\u5fae\u5c0f\u7684\u6280\u672f\u632b\u6298\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u5931\u8d25\u3001\u4f5c\u4e1a\u88ab\u62d2\uff09\u3001\u6216\u63a5\u5355\u8fdb\u5ea6\u4e0d\u5982\u9884\u671f\uff0c\u90fd\u53ef\u80fd\u89e6\u53d1\u5176\u201c\u6211\u679c\u7136\u4e0d\u884c\u201d\u7684\u5d29\u6e83\uff0c\u76f4\u63a5\u8981\u6c42\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | \u5bf9\u201c\u9f99\u5957\u201d\u6536\u5165\u62b1\u6709\u6025\u5207\u671f\u5f85\uff0c\u82e51-2\u4e2a\u6708\u5185\u672a\u63a5\u5230\u4efb\u4f55\u5355\u5b50\uff0c\u4f1a\u8ba4\u4e3a\u8bfe\u7a0b\u201c\u9a97\u4eba\u201d\uff0c\u66b4\u6012\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c\u4e00\u5468\u81f3\u7b2c\u4e00\u4e2a\u6708**\u3002\u5f53\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u9762\u5bf9\u5177\u4f53\u7684\u6280\u672f\u7ec3\u4e60\u548c\u8fdf\u8fdf\u672a\u5230\u7684\u53d8\u73b0\u673a\u4f1a\u65f6\uff0c\u5176\u8106\u5f31\u5fc3\u7406\u548c\u73b0\u5b9e\u538b\u529b\u5c06\u5f62\u6210\u5171\u632f\uff0c\u9000\u8d39\u98ce\u9669\u8fbe\u5230\u9876\u5cf0\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cXX\u540c\u5b66\uff0c\u6211\u770b\u5230\u4f60\u975e\u5e38\u8ba4\u771f\uff0c\u4e5f\u4e86\u89e3\u5230\u4f60\u7684\u4e00\u4e9b\u60c5\u51b5\u3002\u8bf7\u653e\u5fc3\uff0c\u6211\u4eec\u8fd9\u4e2a\u73ed\u7ea7\u91cc\u6709\u5f88\u591a\u548c\u4f60\u60c5\u51b5\u76f8\u4f3c\u3001\u65f6\u95f4\u4e0d\u591a\u7684\u540c\u5b66\uff0c\u6211\u4eec\u90fd\u4e00\u6b65\u6b65\u8d70\u8fc7\u6765\u4e86\u3002\u4f60\u7684\u76ee\u6807\u4e0d\u662f\u6210\u4e3a\u5927\u5e08\uff0c\u800c\u662f\u5148\u7a33\u7a33\u5730\u62ff\u5230\u7b2c\u4e00\u7b14\u5c0f\u6536\u5165\u3002\u6211\u4f1a\u966a\u4f60\u4e00\u8d77\uff0c\u54b1\u4eec\u4e0d\u8ddf\u522b\u4eba\u6bd4\u901f\u5ea6\uff0c\u53ea\u8ddf\u81ea\u5df1\u6bd4\u8fdb\u6b65\u3002\u6709\u4efb\u4f55\u64cd\u4f5c\u4e0a\u7684\u56f0\u96be\uff0c\u54ea\u6015\u662f\u6700\u5c0f\u7684\u95ee\u9898\uff0c\u968f\u65f6\u558a\u6211\uff0c\u6211\u624b\u628a\u624b\u6559\u4f60\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72-\u964d\u7ef4\u7248\u3011**\uff08\u76ee\u6807\u8c03\u6574\u4e3a\uff1a\u638c\u63e1\u6700\u57fa\u7840\u7684\u624b\u673a\u5f55\u97f3\u3001\u4e0a\u4f20\u3001\u63a5\u7b80\u5355\u65c1\u767d\u5355\u7684\u80fd\u529b\uff0c\u653e\u5f03\u590d\u6742\u540e\u671f\u548c\u89d2\u8272\u97f3\uff09\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\uff08\u6ee1\u914d\uff09\u3011** + **\u3010\u964d\u7ef4\u7269\u7406\u4ee3\u529e\u5305\u3011**\u3002\u5fc5\u987b\u63d0\u4f9b\u201c\u8f6e\u6905\u7ea7\u201d\u966a\u4f34\uff0c\u73ed\u4e3b\u4efb\u9700\u4e3b\u52a8\u3001\u9891\u7e41\u57301v1\u8ddf\u8fdb\uff0c\u5e76\u968f\u65f6\u51c6\u5907\u8fdc\u7a0b\u534f\u52a9\u89e3\u51b3\u64cd\u4f5c\u95ee\u9898\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u5bf9\u4ed6\u4f7f\u7528\u4efb\u4f55\u201c\u5012\u8ba1\u65f6\u201d\u3001\u201c\u540d\u989d\u6709\u9650\u201d\u7b49\u903c\u5355\u8bdd\u672f\u30022. \u5e03\u7f6e\u9ad8\u96be\u5ea6\u4f5c\u4e1a\u6216\u5f3a\u8c03\u6280\u672f\u6df1\u5ea6\u30023. \u4e0e\u5176\u4ed6\u5b66\u5458\u7684\u6210\u529f\u6848\u4f8b\u8fdb\u884c\u5bf9\u6bd4\u30024. \u627f\u8bfa\u77ed\u671f\u5185\uff08\u59821\u4e2a\u6708\uff09\u4e00\u5b9a\u80fd\u63a5\u5355\u8d5a\u94b1\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5347\u5355**\u3002\u5728\u786e\u8ba4\u5176\u80fd\u7a33\u5b9a\u83b7\u5f97\u5fae\u5c0f\u6536\u5165\u3001\u5efa\u7acb\u4fe1\u5fc3\u4e4b\u524d\uff0c\u7981\u6b62\u63a8\u8350\u4efb\u4f55\u9ad8\u9636\u8bfe\u7a0b\u6216\u8bbe\u5907\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u7a7a\u95f2\u53ea\u4e09\u4e2a\u5c0f\u65f6\uff0c\u56e0\u8eab\u4f53\u539f\u56e0\u53ef\u80fd\u53ea\u80fd\u517c\u804c\u201d\n2. > \u201c\u901a\u4e0d\u8fc7\u8fde\u9f99\u5957\u4e0d\u884c\u201d\n3. > \u201c\u53cd\u6b63\u6cbb\u4e0d\u597d\u795e\u7ecf\u9057\u4f20\uff0c\u5403\u3a85\u4e0d\u51b7\u4e0d\u997f\u5403\u836f\u5c31\u884c\u201d\n4. > \u201c\u5206\u671f\u4e86\u56db\u4e2a\u6708\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u9700\u6c42\u2014\u2014\u5728\u7ecf\u6d4e\u4e0e\u8eab\u4f53\u53cc\u91cd\u56f0\u5883\u4e0b\u5bfb\u627e\u751f\u5b58\u4fdd\u969c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u542f\u52a8C2\u98ce\u9669\u7ba1\u63a7\u6d41\u7a0b\uff0c\u5ef6\u8fdf\u8f6c\u5316\uff0c\u7531\u73ed\u4e3b\u4efb\u8fdb\u884c\u6df1\u5ea6\u6478\u5e95\u548c\u60c5\u7eea\u6258\u5e95\uff0c\u63d0\u4f9b\u964d\u7ef4\u3001\u4fdd\u59c6\u7ea7\u7684\u5168\u966a\u4f34\u670d\u52a1\uff0c\u4e25\u9632\u4efb\u4f55\u6280\u672f\u632b\u6298\u548c\u9884\u671f\u843d\u5dee\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72-\u964d\u7ef4\u7248 + \u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\uff08\u6ee1\u914d\uff09\"}\n```";
