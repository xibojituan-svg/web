    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 145017162 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u51ac\u51ac\u8001\u5e08/\u662d\u5b812 (\u674e\u5fd7\u52c7) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u5f20\u9707\u8001\u5e08\u6709\u58f0\u6f14\u64ad\u8bad\u7ec3\u8425 (\u4ef7\u683c\u672a\u77e5) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u7f3a\u5931** (\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u91d1\u989d\u3001\u5206\u671f\u7b49) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u7f3a\u5931** (\u672a\u63d0\u53ca\u5de5\u4f5c\u6027\u8d28\u3001\u4f5c\u606f\u3001\u5bb6\u5ead\u8d1f\u62c5) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** (\u672a\u63d0\u53ca\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931** (\u5173\u952e\u8d44\u6e90\u5e95\u5ea7\u4fe1\u606f\u51e0\u4e4e\u4e3a\u96f6\uff0c\u964d\u7ea7\u7f6e\u4fe1\u5ea6) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34\u578b**\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u4e86\u201c\u6211\u8981\u5b66\u6709\u58f0\u201d\u7684\u610f\u613f\uff0c\u5e76\u5173\u6ce8\u201c\u4ec0\u4e48\u65f6\u5019\u80fd\u63a5\u5355\u8d5a\u94b1\u201d\u3001\u201c\u6211\u73b0\u5728\u7684\u6c34\u5e73\uff0c\u80fd\u9760\u6709\u58f0\u53d8\u73b0\u5417\u201d\u7b49\u73b0\u5b9e\u95ee\u9898\uff0c\u53d8\u73b0\u76ee\u7684\u660e\u786e\u3002\u4f46\u540c\u65f6\uff0c\u7528\u6237\u4e5f\u8868\u73b0\u51fa\u5bf9\u6280\u80fd\u63d0\u5347\u7684\u79ef\u6781\u6001\u5ea6\uff08\u201c\u5148\u8e0f\u5b9e\u63d0\u5347\u6280\u80fd\u201d\uff09\uff0c\u5e76\u8ba4\u771f\u5b8c\u6210\u4f5c\u4e1a\u3001\u542c\u53d6\u70b9\u8bc4\uff0c\u663e\u793a\u51fa\u4e00\u5b9a\u7684\u5b66\u4e60\u610f\u613f\uff0c\u5e76\u975e\u7eaf\u7cb9\u8ffd\u6c42\u6781\u901f\u53d8\u73b0\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u95ee\u98982.3.4\u6211\u4e5f\u60f3\u95ee\u201d (\u6307\u4ee3\u201c\u4ec0\u4e48\u65f6\u5019\u80fd\u63a5\u5355\u8d5a\u94b1\u201d\u3001\u201c\u6211\u73b0\u5728\u7684\u6c34\u5e73\uff0c\u80fd\u9760\u6709\u58f0\u53d8\u73b0\u5417\u201d\u3001\u201c\u5f97\u7ec3\u5230\u5565\u7a0b\u5ea6\u624d\u80fd\u5f00\u59cb\u63a5\u5355\u8d5a\u94b1\u201d)\uff1b> \u201c\u5148\u8e0f\u5b9e\u63d0\u5347\u6280\u80fd\uff0c\u6309\u65f6\u85aa\u5f55\u4e66\uff0c\u518d\u4e00\u6838\u4e24\u7ffc\u591a\u65b9\u4f4d\u53d1\u5c55\u81ea\u5df1.[\u62f3\u5934]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2753\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u8bc4\u7ea7]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4efb\u4f55\u5173\u4e8e\u5b66\u8d39\u3001\u652f\u4ed8\u80fd\u529b\u3001\u7ecf\u6d4e\u72b6\u51b5\u7684\u63cf\u8ff0\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u7528\u6237\u80fd\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\uff0c\u4f46\u672a\u900f\u9732\u5176\u65e5\u5e38\u5de5\u4f5c\u3001\u5bb6\u5ead\u8d23\u4efb\u7b49\u65f6\u95f4\u5360\u7528\u60c5\u51b5\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u5b8c\u5168\u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\uff0c\u662f**\u91cd\u5927\u98ce\u9669\u9690\u60a3\u70b9**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u7528\u6237\u4e3b\u52a8\u63d0\u51fa\u5177\u4f53\u6280\u672f\u95ee\u9898\uff08\u201c\u611f\u89c9\u81ea\u5df1\u914d\u97f3\u65f6\uff0c\u6c14\u606f\u5904\u7406\u4e0d\u662f\u5f88\u597d\uff0c\u4e0d\u4f1a\u6362\u6c14\u201d\uff09\uff0c\u5e76\u5728\u6536\u5230\u8be6\u7ec6\u3001\u4e13\u4e1a\u7684\u4f5c\u4e1a\u70b9\u8bc4\u540e\uff0c\u79ef\u6781\u53cd\u9988\u201c\u4f53\u4f1a\u5230\u58f0\u97f3\u7531\u8fd1\u53ca\u8fdc\u7684\u611f\u89c9\u4e86\u3002\u4e0d\u6127\u662f\u5b9e\u6218\u6d3e\uff0c\u6709\u9488\u5bf9\u6027\uff0c\u771f\u7684\u63a5\u5730\u6c14\uff01\u201d\uff0c\u8868\u73b0\u51fa\u826f\u597d\u7684\u5b66\u4e60\u5fc3\u6001\u548c\u4ece\u53cd\u9988\u4e2d\u6c72\u53d6\u52a8\u529b\u7684\u80fd\u529b\u3002\u65e0\u4efb\u4f55\u62b1\u6028\u3001\u653e\u5f03\u6216\u60c5\u7eea\u5d29\u6e83\u7684\u8ff9\u8c61\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u611f\u89c9\u81ea\u5df1\u914d\u97f3\u65f6\uff0c\u6c14\u606f\u5904\u7406\u4e0d\u662f\u5f88\u597d\uff0c\u4e0d\u4f1a\u6362\u6c14\u201d\uff1b> \u201c\u8ddf\u7740\u7ec3\u4e60\u4e86\uff0c\u4f53\u4f1a\u5230\u58f0\u97f3\u7531\u8fd1\u53ca\u8fdc\u7684\u611f\u89c9\u4e86\u3002\u4e0d\u6127\u662f\u5b9e\u6218\u6d3e\uff0c\u6709\u9488\u5bf9\u6027\uff0c\u771f\u7684\u63a5\u5730\u6c14\uff01[\u5f3a] \u8c22\u8c22\u5e08\u59d0\uff01[\u73ab\u7470]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u4e2d\u5e74\u8f6c\u578b\u7684\u7126\u8651\u4e0e\u5bf9\u4ef7\u503c\u8ba4\u53ef\u7684\u6e34\u671b**\u3002\u7528\u6237\u81ea\u79f0\u201c\u4e2d\u5e74\u5973\u6027\u201d\uff0c\u5728\u5bfb\u6c42\u4e00\u4efd\u80fd\u5e26\u6765\u7a33\u5b9a\u6536\u5165\u3001\u65f6\u95f4\u7075\u6d3b\u7684\u526f\u4e1a\uff0c\u4ee5\u5e94\u5bf9\u6f5c\u5728\u7684\u7ecf\u6d4e\u6216\u804c\u4e1a\u4e0d\u5b89\u5168\u611f\uff08\u5b89\u5168\u9700\u6c42\uff09\u3002\u540c\u65f6\uff0c\u5979\u5bf9\u4e13\u4e1a\u70b9\u8bc4\u7684\u79ef\u6781\u53cd\u9988\uff08\u201c\u8c22\u8c22\u5e08\u59d0\uff01\u201d\uff09\u548c\u5e0c\u671b\u83b7\u5f97\u201c\u5b98\u65b9\u8bd5\u97f3\u5355\u201d\u7684\u6743\u76ca\uff0c\u663e\u793a\u51fa\u5979\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u624b\u827a\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u548c\u793e\u7fa4\u5f52\u5c5e\u611f\uff08\u5c0a\u91cd\u4e0e\u5f52\u5c5e\u9700\u6c42\uff09\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u6743\u5a01\u7684\u80af\u5b9a\u4e0e\u6e05\u6670\u7684\u6210\u957f\u8def\u5f84\u56fe**\u3002\u5979\u9700\u8981\u88ab\u201c\u5e08\u7236\u201d\uff08\u5f20\u9707\u8001\u5e08\uff09\u8fd9\u6837\u7684\u884c\u4e1a\u6743\u5a01\u8ba4\u53ef\u5176\u6f5c\u529b\uff08\u201c\u5e08\u7236\u8fd8\u662f\u5f88\u770b\u597d\u4f60\u7684\u201d\uff09\uff0c\u5e76\u9700\u8981\u4e00\u6761\u4ece\u201c\u5c0f\u767d\u201d\u5230\u201c\u80fd\u63a5\u5355\u201d\u7684\u53ef\u89c6\u5316\u3001\u53ef\u6267\u884c\u7684\u8fdb\u9636\u8def\u5f84\uff0c\u4ee5\u7f13\u89e3\u5176\u5bf9\u672a\u6765\u7684\u4e0d\u786e\u5b9a\u6027\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u7cbe\u786e\u5224\u5b9a**\u3002\u52a8\u673a\u7eaf\u5ea6\u4e2d\u7b49\uff0c\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4f46\u8d44\u6e90\u5e95\u5ea7\uff08\u5c24\u5176\u662f\u5bb6\u5ead\u652f\u6301\uff09\u4fe1\u606f\u5b8c\u5168\u7f3a\u5931\uff0c\u65e0\u6cd5\u5b8c\u6210\u5224\u5b9a\u6811\u4e2d\u7684\u201c\u6b65\u9aa41.5\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5\u201d\u3002**\u9ad8\u98ce\u9669\u5f85\u5b9a\u72b6\u6001**\u3002 |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **\u503e\u5411\u5339\u914d\uff1aT4 \u641e\u94b1\u7ed3\u679c\u578b**\u3002\u6838\u5fc3\u9a71\u52a8\u662f\u660e\u786e\u7684\u53d8\u73b0\u8bc9\u6c42\uff08\u201c\u4ec0\u4e48\u65f6\u5019\u80fd\u63a5\u5355\u8d5a\u94b1\u201d\uff09\uff0c\u4f46\u5b66\u4e60\u6001\u5ea6\u7aef\u6b63\uff0c\u613f\u610f\u201c\u5148\u8e0f\u5b9e\u63d0\u5347\u6280\u80fd\u201d\uff0c\u5c5e\u4e8eT4\u4e2d\u76f8\u5bf9\u7406\u6027\u3001\u53ef\u5f15\u5bfc\u7684\u4e9a\u578b\u3002 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u57fa\u4e8e\u73b0\u6709\u4fe1\u606f)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u804a\u5929\u8bb0\u5f55\u4e2d\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u6c42\u751f\u3001\u5bb6\u5c5e\u6fc0\u70c8\u53cd\u5bf9\u7b49D\u7c7b\u7ea2\u7ebf\u4fe1\u53f7\u3002**\u4f46\u5bb6\u5ead\u652f\u6301\u5ea6\u672a\u77e5\u662f\u6700\u5927\u9690\u60a3\u3002**\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u9ad8** | **\u3010\u5173\u952e\u672a\u77e5\u98ce\u9669\u3011** \u82e5\u62a5\u540d\u884c\u4e3a\u662f\u7792\u7740\u5bb6\u4eba\uff08\u5c24\u5176\u662f\u914d\u5076\uff09\u8fdb\u884c\uff0c\u6216\u4f7f\u7528\u4e86\u5bb6\u5ead\u91cd\u8981\u5f00\u652f\uff0c\u5f00\u8bfe\u540e\u6781\u6613\u56e0\u5bb6\u5ead\u77db\u76fe\u7206\u53d1\u800c\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4e2d | \u82e5\u5176\u771f\u5b9e\u5de5\u4f5c\u65f6\u95f4\u4e0e\u8bfe\u7a0b\u76f4\u64ad\u3001\u4f5c\u4e1a\u63d0\u4ea4\u65f6\u95f4\u4e25\u91cd\u51b2\u7a81\uff0c\u53ef\u80fd\u5bfc\u81f4\u5b66\u4e60\u8fdb\u5ea6\u843d\u540e\uff0c\u4ea7\u751f\u632b\u8d25\u611f\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u5bfb\u6c42\u95ee\u9898\u89e3\u51b3\u65b9\u6cd5\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u56f0\u96be\u800c\u60c5\u7eea\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d\u9ad8** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u4f5c\u4e3aT4\u641e\u94b1\u7ed3\u679c\u578b\u7528\u6237\uff0c\u82e5\u5728\u8bfe\u7a0b\u4e2d\u671f\uff08\u5982\u7b2c3-4\u5468\uff09\u4ecd\u672a\u770b\u5230\u660e\u786e\u7684\u63a5\u5355\u8def\u5f84\u6216\u83b7\u5f97\u8bd5\u97f3\u673a\u4f1a\uff0c\u6781\u6613\u56e0\u201c\u53d8\u73b0\u627f\u8bfa\u672a\u5151\u73b0\u201d\u800c\u4ea7\u751f\u5f3a\u70c8\u843d\u5dee\u611f\uff0c\u8981\u6c42\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c3-4\u5468\uff08\u6b7b\u4ea1\u8c37\u9636\u6bb5\uff09**\u3002\u5f53\u57fa\u7840\u6280\u80fd\u6559\u5b66\u7ed3\u675f\uff0c\u8fdb\u5165\u5b9e\u6218\u6216\u63a5\u5355\u73af\u8282\u65f6\uff0c\u82e5\u7528\u6237\u53d1\u73b0\u201c\u63a5\u5355\u201d\u4ecd\u9065\u4e0d\u53ef\u53ca\uff0c\u6216\u8bd5\u97f3\u5c61\u6b21\u5931\u8d25\uff0c\u6536\u76ca\u843d\u5dee\u578b\u9000\u8d39\u98ce\u9669\u5c06\u6025\u5267\u5347\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5e08\u59d0/\u5e08\u54e5\u770b\u5230\u4f60\u8bad\u7ec3\u8425\u671f\u95f4\u7279\u522b\u8ba4\u771f\uff0c\u4f5c\u4e1a\u4e5f\u5b8c\u6210\u5f97\u5f88\u68d2\uff01\u54b1\u4eec\u4e2d\u5e74\u8f6c\u578b\u4e0d\u5bb9\u6613\uff0c\u65e2\u8981\u987e\u5bb6\u53c8\u60f3\u5b66\u95e8\u624b\u827a\u589e\u52a0\u6536\u5165\uff0c\u8fd9\u4efd\u51b3\u5fc3\u7279\u522b\u8ba9\u4eba\u4f69\u670d\u3002\u63a5\u4e0b\u6765\u7684\u6b63\u5f0f\u8bfe\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u6211\u4f1a\u5e2e\u4f60\u628a\u6bcf\u4e2a\u9636\u6bb5\u2018\u80fd\u8d5a\u5230\u94b1\u2019\u7684\u5c0f\u76ee\u6807\u90fd\u62c6\u89e3\u6e05\u695a\uff0c\u8ba9\u4f60\u6bcf\u8d70\u4e00\u6b65\u90fd\u5fc3\u91cc\u6709\u5e95\u3002\u6709\u4efb\u4f55\u5173\u4e8e\u65f6\u95f4\u5b89\u6392\u6216\u8005\u5bb6\u91cc\u534f\u8c03\u7684\u96be\u5904\uff0c\u968f\u65f6\u8ddf\u6211\u804a\uff0c\u54b1\u4eec\u4e00\u8d77\u60f3\u529e\u6cd5\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5feb\u901f\u63a5\u5355\u7ebf**\u3011\u3002\u5fc5\u987b\u4f18\u5148\u6ee1\u8db3\u5176\u53d8\u73b0\u7684\u6838\u5fc3\u8bc9\u6c42\u3002\u8bfe\u7a0b\u8bbe\u8ba1\u9700\u7a81\u51fa\u201c\u5b66\u5b8c\u5373\u7528\u201d\u3001\u201c\u5b9e\u6218\u63a5\u5355\u201d\u73af\u8282\uff0c\u5c3d\u65e9\uff08\u5982\u7b2c2-3\u5468\uff09\u63d0\u4f9b\u771f\u5b9e\u7684\u3001\u4f4e\u95e8\u69db\u7684\u8bd5\u97f3\u673a\u4f1a\uff08\u54ea\u6015\u65f6\u85aa\u4e0d\u9ad8\uff09\uff0c\u5efa\u7acb\u6b63\u53cd\u9988\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u5305\uff08\u8f7b\u91cf\uff09**\u3011\u3002\u56e0\u5176\u5b66\u4e60\u6001\u5ea6\u597d\uff0c\u53ef\u63d0\u4f9b1v1\u7684\u9488\u5bf9\u6027\u6c14\u606f\u3001\u6362\u6c14\u95ee\u9898\u6307\u5bfc\uff0c\u4f46\u9700\u63a7\u5236\u6df1\u5ea6\uff0c\u907f\u514d\u8fc7\u65e9\u5f15\u5165\u8fc7\u9ad8\u96be\u5ea6\u7684\u6280\u5de7\u4f7f\u5176\u53d7\u632b\u3002\u3010**\u5708\u5c42\u5f52\u5c5e\u5305**\u3011\u3002\u5c06\u5176\u7eb3\u5165\u201c\u4f18\u79c0\u5b66\u5458\u201d\u5c0f\u7ec4\uff0c\u8d4b\u4e88\u5176\u4e00\u5b9a\u7684\u793e\u7fa4\u8ba4\u53ef\uff08\u5982\u5c0f\u7ec4\u957f\uff09\uff0c\u6ee1\u8db3\u5176\u5c0a\u91cd\u4e0e\u5f52\u5c5e\u9700\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u8981\u56de\u907f\u6216\u6a21\u7cca\u5316\u201c\u63a5\u5355\u65f6\u95f4\u201d\u548c\u201c\u6536\u5165\u9884\u671f\u201d**\u3002\u5fc5\u987b\u7ed9\u51fa\u6e05\u6670\u3001\u4fdd\u5b88\u7684\u8def\u5f84\u56fe\uff08\u4f8b\u5982\uff1a\u5b8c\u6210X\u9636\u6bb5\u5b66\u4e60\uff0c\u53ef\u5c1d\u8bd5Y\u7c7b\u8bd5\u97f3\uff0c\u5e73\u5747\u5468\u671fZ\u4e2a\u6708\uff09\u3002\n    2. **\u7edd\u4e0d\u8981\u5728\u672a\u4e86\u89e3\u5176\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u524d\uff0c\u9f13\u52b1\u5176\u51b2\u52a8\u505a\u91cd\u5927\u8d22\u52a1\u51b3\u7b56\uff08\u5982\u5347\u5355\u9ad8\u4ef7\u8bfe\u7a0b\uff09**\u3002\n    3. \u907f\u514d\u7ed9\u4e88\u4e0d\u5207\u5b9e\u9645\u7684\u201c\u901f\u6210\u66b4\u5bcc\u201d\u753b\u997c\uff0c\u8fd9\u4f1a\u5728\u6b7b\u4ea1\u8c37\u9636\u6bb5\u5f15\u53d1\u5f3a\u70c8\u53cd\u566c\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u3010**\u4e25\u7981\u5728\u5bb6\u5ead\u652f\u6301\u5ea6\u660e\u786e\u524d\u8fdb\u884c\u5927\u989d\u5347\u5355**\u3011\u3002\u53ef\u5c1d\u8bd5500\u5143\u4ee5\u5185\u7684\u5fae\u5347\u5355\uff08\u5982\u5de5\u5177\u5305\u3001\u4e13\u9879\u8bad\u7ec3\u8425\uff09\uff0c\u4f46\u5fc5\u987b\u524d\u7f6e\u6c9f\u901a\u5bb6\u5ead\u77e5\u60c5\u60c5\u51b5\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u95ee\u98982.3.4\u6211\u4e5f\u60f3\u95ee\u201d *(\u66b4\u9732\u6838\u5fc3\u53d8\u73b0\u7126\u8651)*\n2. > \u201c\u5148\u8e0f\u5b9e\u63d0\u5347\u6280\u80fd\uff0c\u6309\u65f6\u85aa\u5f55\u4e66\uff0c\u518d\u4e00\u6838\u4e24\u7ffc\u591a\u65b9\u4f4d\u53d1\u5c55\u81ea\u5df1.[\u62f3\u5934]\u201d *(\u663e\u793a\u7406\u6027\u89c4\u5212\u4e0e\u5b66\u4e60\u610f\u613f\uff0c\u52a8\u673a\u7eaf\u5ea6\u4e2d\u7b49\u7684\u5173\u952e\u8bc1\u636e)*\n3. > \u201c\u611f\u89c9\u81ea\u5df1\u914d\u97f3\u65f6\uff0c\u6c14\u606f\u5904\u7406\u4e0d\u662f\u5f88\u597d\uff0c\u4e0d\u4f1a\u6362\u6c14\u201d *(\u5c55\u793a\u9ad8\u5fc3\u7406\u5f39\u6027\uff1a\u4e3b\u52a8\u63d0\u51fa\u5177\u4f53\u6280\u672f\u95ee\u9898\u5bfb\u6c42\u89e3\u51b3)*\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4\u641e\u94b1\u7ed3\u679c\u578b\uff08\u7406\u6027\u4e9a\u578b\uff09\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u9700\u6c42\uff08\u7ecf\u6d4e\u4fdd\u969c\uff09\u4e0e\u5c0a\u91cd\u9700\u6c42\uff08\u4ef7\u503c\u8ba4\u53ef\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5f00\u8425\u524d\u52a1\u5fc5\u8fdb\u884c\u201c\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5\u201d\uff0c\u5e76\u5728\u8bfe\u7a0b\u65e9\u671f\u63d0\u4f9b\u6e05\u6670\u7684\u53d8\u73b0\u8def\u5f84\u56fe\u548c\u4f4e\u95e8\u69db\u5b9e\u6218\u673a\u4f1a\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u578b\", \"maslow_need\": \"\u5b89\u5168\u4e0e\u5c0a\u91cd\u9700\u6c42\", \"risk_level\": \"\u4e2d\u9ad8\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf+\u786c\u6838\u5b9e\u5e72\u5305(\u8f7b\u91cf)+\u5708\u5c42\u5f52\u5c5e\u5305\"}\n```";
