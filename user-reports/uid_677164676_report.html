    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677164676 / \u6635\u79f0\uff1a\u6d77\u71d5\u98de\u98de\u5440 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e\uff1a\u7c7d\u83f2-\u5b98\u65b9\u603b\u62db\u52df\u5b98\uff08\u8096\u68a6\u83b9\uff09\uff1b\u73ed\u4e3b\u4efb\uff1a\u6854\u5b50JZT\uff08\u7a0b\u5c55\u6b22\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u64ad\u6559\u80b2\u9ad8\u9636\u6f14\u64ad\u8bfe\u7a0b\uff08\u7cbe\u82f1+\u8fdb\u9636\uff0c\u51714\u4e2a\u6708\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u91d1\u989d\u3001\u5206\u671f\u60c5\u51b5\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u63d0\u53ca\u201c\u4e00\u8fb9\u68c0\u67e5\u4f5c\u4e1a\u4e00\u8fb9\u542c\uff0c\u4e00\u8fb9\u505a\u996d\u4e00\u8fb9\u542c\u201d\uff0c\u8868\u660e\u5b66\u4e60\u65f6\u95f4\u9700\u4ece\u5bb6\u52a1\u7b49\u65e5\u5e38\u6d3b\u52a8\u4e2d\u6324\u51fa\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u7528\u6237\u4e92\u52a8\u79ef\u6781\uff0c\u4f46\u5173\u4e8e\u4e2a\u4eba\u80cc\u666f\u3001\u8d22\u52a1\u72b6\u51b5\u3001\u8fc7\u5f80\u7ecf\u5386\u7b49\u5173\u952e\u4fe1\u606f\u7f3a\u5931\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34(\u4e2d)**\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6709\u58f0\u884c\u4e1a\u53d8\u73b0\u524d\u666f\u7684\u5174\u8da3\uff08\u201c\u53d8\u73b0\u7684\u5de5\u79cd\u597d\u591a\uff0c\u597d\u6709\u524d\u666f\u201d\uff09\uff0c\u5e76\u79ef\u6781\u8ddf\u8fdb\u63a5\u5355\u3001\u8fdb\u5267\u7ec4\u7b49\u8bdd\u9898\u3002\u4f46\u5176\u6838\u5fc3\u9a71\u52a8\u529b\u66f4\u504f\u5411\u4e8e\u201c\u8ddf\u968f\u4e00\u4e2a\u597d\u8001\u5e08\u5b66\u4e60\u4e00\u9879\u6709\u4ef7\u503c\u6280\u80fd\u201d\uff0c\u800c\u975e\u7eaf\u7cb9\u7684\u77ed\u671f\u66b4\u5bcc\u5e7b\u60f3\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u53d8\u73b0\u7684\u5de5\u79cd\u597d\u591a\uff0c\u597d\u6709\u524d\u666f\uff0c\u5e94\u8be5\u65e9\u51e0\u5e74\u8ba4\u8bc6\u5e08\u59d0[\u5472\u7259]\u201d\uff1b> \u201c\u771f\u5e0c\u671b\u80fd\u8ddf\u7740\u5e08\u59d0\u5e72\u201d\uff1b> \u201c\u4e0d\u7ba1\u54ea\u884c\uff0c\u6709\u4e2a\u597d\u8001\u5e08\u592a\u91cd\u8981\u5566[\u73ab\u7470]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u672a\u63d0\u53ca\u7ecf\u6d4e\u72b6\u51b5\uff0c\u65e0\u6cd5\u5224\u65ad\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u2b07\u4f4e** \u2014 \u8bc1\u636e\uff1a\u201c\u4e00\u8fb9\u68c0\u67e5\u4f5c\u4e1a\u4e00\u8fb9\u542c\uff0c\u4e00\u8fb9\u505a\u996d\u4e00\u8fb9\u542c\u201d\u3002\u8868\u660e\u53ef\u7528\u65f6\u95f4\u662f\u9ad8\u5ea6\u788e\u7247\u5316\u7684\uff0c\u7cbe\u529b\u88ab\u5bb6\u52a1\u7b49\u4e8b\u52a1\u5206\u5272\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b07\u4f4e\u6781\u5371**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u663e\u7684\u6280\u672f\u4e0d\u81ea\u4fe1\u548c\u4f9d\u8d56\u5fc3\u7406\uff0c\u9700\u8981\u5916\u90e8\u6301\u7eed\u9f13\u52b1\u548c\u201c\u5e26\u9886\u201d\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u8bfb\u5b8c\u4e00\u6bb5\uff0c\u5c31\u53e3\u5e72\u820c\u71e5\u7684\uff0c\u4e0d\u4f1a\u6362\u6c14\uff0c\u6709\u70b9\u7740\u6025\u4e86\u201d\uff1b> \u201c\u597d\u50cf\u662f\u8fd9\u4e48\u56de\u4e8b\uff0c\u5c31\u662f\u771f\u8bfb\u8d77\u6765\uff0c\u53c8\u653e\u4e0d\u5f00\u4e86\u201d\uff1b> \u201c\u4ee5\u540e\u8ddf\u7740\u5e08\u59d0\u627e\u52c7\u6c14[\u5bb3\u7f9e]\u201d\uff1b> \u201c\u6709\u70b9\u7d27\u5f20\uff0c\u6015\u8fdb\u4e0d\u4e86\u89d2\u8272\u201d\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6280\u80fd\u81ea\u5351\u4e0e\u65b9\u5411\u8ff7\u832b**\u3002\u7528\u6237\u5bf9\u81ea\u8eab\u80fd\u529b\uff08\u6362\u6c14\u3001\u653e\u4e0d\u5f00\u3001\u7d27\u5f20\uff09\u6709\u5f3a\u70c8\u7684\u4e0d\u81ea\u4fe1\uff0c\u540c\u65f6\u6e34\u671b\u88ab\u4e00\u4e2a\u5f3a\u6709\u529b\u7684\u201c\u5bfc\u5e08\u201d\uff08\u5e08\u59d0\uff09\u5e26\u9886\u548c\u8ba4\u53ef\uff0c\u4ee5\u627e\u5230\u5f52\u5c5e\u611f\u548c\u524d\u8fdb\u7684\u65b9\u5411\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u9ad8\u624b\u9009\u4e2d\u5e76\u5e87\u62a4\u201d\u7684\u5b89\u5168\u611f\u4e0e\u201c\u88ab\u5e26\u9886\u6210\u957f\u201d\u7684\u786e\u5b9a\u6027**\u3002\u5979\u9700\u8981\u7684\u4e0d\u53ea\u662f\u6280\u672f\uff0c\u66f4\u662f\u4e00\u4e2a\u80fd\u7ed9\u4e88\u5979\u52c7\u6c14\u3001\u4e3a\u5979\u89c4\u5212\u8def\u5f84\u3001\u5e76\u627f\u8bfa\u201c\u7f69\u7740\u4f60\u201d\u7684\u6743\u5a01\u4eba\u7269\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2 \u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u4e25\u91cd\u5185\u8017) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n**\u5224\u5b9a\u6811\u63a8\u6f14\u8fc7\u7a0b**\uff1a\n1.  **\u652f\u4ed8\u6838\u67e5**\uff1a\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u6267\u884c\u3002\n2.  **\u4e09\u8f74\u8bc4\u5206**\uff1a\n    *   **\u52a8\u673a\u7eaf\u5ea6**\uff1a5-6\u5206\uff08\u6709\u53d8\u73b0\u5174\u8da3\uff0c\u4f46\u66f4\u770b\u91cd\u201c\u8ddf\u5bf9\u4eba\u201d\uff09\u3002**\u4e2d**\u3002\n    *   **\u8d44\u6e90\u5e95\u5ea7**\uff1a3-4\u5206\uff08\u65f6\u95f4\u788e\u7247\u5316\uff0c\u662f\u660e\u663e\u77ed\u677f\uff09\u3002**\u4f4e**\u3002\n    *   **\u5fc3\u7406\u5f39\u6027**\uff1a1-2\u5206\uff08\u9891\u7e41\u8868\u8fbe\u4e0d\u81ea\u4fe1\u3001\u7d27\u5f20\u3001\u9700\u8981\u627e\u52c7\u6c14\uff09\u3002**\u4f4e**\u3002\n3.  **\u5224\u5b9a\u6811\u5339\u914d**\uff1a\n    *   \u52a8\u673a\u7eaf\u5ea6\u22655\u5206\uff0c\u8fdb\u5165**\u4e2d\u9ad8\u52a8\u673a\u7cbe\u5206**\u901a\u9053\u3002\n    *   \u5fc3\u7406\u5f39\u6027\u22644\u5206\uff0c\u8fdb\u5165**\u4f4e\u5f39\u6027\u901a\u9053**\u3002\n    *   \u8d44\u6e90\u5e95\u5ea7\u22642\u5206\uff1f\u4e0d\uff0c\u7528\u6237\u80fd\u64cd\u4f5c\u624b\u673a\u3001\u8ddf\u76f4\u64ad\u3001\u4ea4\u4f5c\u4e1a\uff0c\u672a\u51fa\u73b0\u4e25\u91cd\u6570\u5b57\u9e3f\u6c9f\u4fe1\u53f7\uff0c\u6545\u8d44\u6e90\u5e95\u5ea7\u672a\u4f4e\u81f32\u5206\u3002\n    *   \u5339\u914d\u6761\u4ef6\uff1a`\u51fa\u73b0\u201c\u6211\u592a\u7b28\u4e86 / \u597d\u6015\u5b66\u4e0d\u4f1a / \u5931\u7720\u4e86 / \u60f3\u653e\u5f03\u201d\u7b49\u81ea\u5351\u4fe1\u53f7`\u3002\u7528\u6237\u867d\u672a\u7528\u5b8c\u5168\u76f8\u540c\u7684\u8bcd\uff0c\u4f46\u201c\u53e3\u5e72\u820c\u71e5\u3001\u4e0d\u4f1a\u6362\u6c14\u3001\u7740\u6025\u3001\u653e\u4e0d\u5f00\u3001\u7d27\u5f20\u3001\u627e\u52c7\u6c14\u201d\u662f\u5178\u578b\u7684\u81ea\u5351\u4e0e\u4f9d\u8d56\u4fe1\u53f7\u3002\n    *   \u6280\u672f\u8ffd\u95ee\u6df1\u5ea6\uff1f\u65e0\u3002\u7528\u6237\u672a\u8ffd\u95ee\u4efb\u4f55\u6280\u672f\u539f\u7406\u3002\n    *   **\u5224\u5b9a\u7ed3\u679c**\uff1a\u7b26\u5408 **T6 \u60c5\u7eea\u5de8\u5a74** \u7279\u5f81\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u65f6\u95f4\u788e\u7247\u5316\u6697\u793a\u53ef\u80fd\u6709\u5bb6\u5ead\u8d23\u4efb\uff0c\u9700\u540e\u7eed\u6478\u5e95\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | **\u65f6\u95f4\u788e\u7247\u5316\u5bfc\u81f4\u4f5c\u4e1a\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u7126\u8651\u548c\u81ea\u8d23\uff0c\u6700\u7ec8\u653e\u5f03\u3002** |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | **\u9996\u6b21\u72ec\u7acb\u5b8c\u6210\u590d\u6742\u4f5c\u4e1a\uff08\u5982\u540e\u671f\u3001\u957f\u6587\u672c\uff09\u65f6\u53d7\u632b\uff0c\u6216\u6536\u5230\u4e25\u5389\u70b9\u8bc4\uff0c\u81ea\u5c0a\u5fc3\u53d7\u635f\uff0c\u77ac\u95f4\u4ea7\u751f\u201c\u6211\u4e0d\u884c\u201d\u7684\u5ff5\u5934\u800c\u9000\u8d39\u3002** |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u82e5\u5b66\u4e60\u4e00\u6bb5\u65f6\u95f4\u540e\uff08\u59821-2\u4e2a\u6708\uff09\u4ecd\u672a\u83b7\u5f97\u4efb\u4f55\u6b63\u53cd\u9988\uff08\u5982\u63a5\u5230\u5c0f\u5355\u3001\u88ab\u516c\u5f00\u8868\u626c\uff09\uff0c\u53ef\u80fd\u56e0\u201c\u770b\u4e0d\u5230\u5e0c\u671b\u201d\u800c\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\u3002\u6b64\u65f6\u8bfe\u7a0b\u96be\u5ea6\u63d0\u5347\uff0c\u4f5c\u4e1a\u8981\u6c42\u53d8\u9ad8\uff0c\u82e5\u7528\u6237\u65e0\u6cd5\u6309\u65f6\u5b8c\u6210\u6216\u5b8c\u6210\u8d28\u91cf\u4e0d\u4f73\uff0c\u6781\u6613\u89e6\u53d1\u201c\u8106\u5f31\u7834\u9632\u201d\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> **\u201c\u6d77\u71d5\uff0c\u770b\u5230\u4f60\u8bad\u7ec3\u8425\u671f\u95f4\u7279\u522b\u8ba4\u771f\uff0c\u4e00\u8fb9\u5fd9\u5bb6\u52a1\u4e00\u8fb9\u5b66\u4e60\uff0c\u8fd9\u4efd\u575a\u6301\u7279\u522b\u6253\u52a8\u6211\u3002\u522b\u62c5\u5fc3\u2018\u653e\u4e0d\u5f00\u2019\u3001\u2018\u7d27\u5f20\u2019\uff0c\u54b1\u4eec\u73ed\u91cc\u5f88\u591a\u540c\u5b66\u4e00\u5f00\u59cb\u90fd\u8fd9\u6837\u3002\u6211\u7684\u4efb\u52a1\u5c31\u662f\u5e2e\u4f60\u628a\u2018\u4e0d\u6562\u2019\u53d8\u6210\u2018\u6562\u2019\uff0c\u628a\u2018\u4e0d\u719f\u2019\u53d8\u6210\u2018\u719f\u7ec3\u2019\u3002\u4f60\u53ea\u8981\u8ddf\u7740\u6211\u7684\u8282\u594f\u8d70\uff0c\u6bcf\u4e00\u6b65\u6211\u90fd\u4f1a\u7ed9\u4f60\u6700\u5177\u4f53\u7684\u53cd\u9988\uff0c\u54b1\u4eec\u4e0d\u8ddf\u522b\u4eba\u6bd4\uff0c\u53ea\u8ddf\u6628\u5929\u7684\u81ea\u5df1\u6bd4\uff0c\u597d\u5417\uff1f\u201d**\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** (\u4ea7\u54c1\u7ebfA)\u3002\u7528\u6237\u6709\u53d8\u73b0\u610f\u613f\uff0c\u9700\u901a\u8fc7\u624e\u5b9e\u7684\u6280\u80fd\u5b66\u4e60\u5efa\u7acb\u81ea\u4fe1\uff0c\u4f46\u5fc5\u987b\u642d\u914d\u5f3a\u60c5\u7eea\u652f\u6301\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u6ee1\u914d\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305 (C\u6a21\u5757)\u3011**\u3002\u9488\u5bf9T6\u60c5\u7eea\u5de8\u5a74\uff0c\u9700\u8981\u9ad8\u9891\u3001\u5938\u5f20\u7684\u6b63\u9762\u53cd\u9988\u548c\u60c5\u7eea\u6258\u5e95\u3002**\u8c28\u614e\u5f15\u5165\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743 (B\u6a21\u5757)\u3011**\uff0c\u4ec5\u5728\u7528\u6237\u5efa\u7acb\u521d\u6b65\u81ea\u4fe1\u540e\uff0c\u4ee5\u201c\u52a0\u9910\u201d\u5f62\u5f0f\u5c11\u91cf\u63d0\u4f9b\uff0c\u907f\u514d\u77e5\u8bc6\u8fc7\u8f7d\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5728\u5979\u8868\u8fbe\u201c\u6211\u4e0d\u4f1a\u201d\u3001\u201c\u6211\u7d27\u5f20\u201d\u65f6\uff0c\u7528\u201c\u8fd9\u5f88\u7b80\u5355\u201d\u3001\u201c\u522b\u4eba\u90fd\u80fd\u505a\u5230\u201d\u6765\u56de\u5e94\u3002\u7981\u6b62\u5e03\u7f6e\u8d85\u51fa\u5176\u5f53\u524d\u80fd\u529b\u8303\u56f4\u7684\u9ad8\u96be\u5ea6\u6311\u6218\u4f5c\u4e1a\u3002\u7981\u6b62\u5728\u7fa4\u5185\u516c\u5f00\u5bf9\u6bd4\u6279\u8bc4\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u57fa\u7840\u6280\u80fd\u672a\u5de9\u56fa\u3001\u81ea\u4fe1\u5fc3\u672a\u5efa\u7acb\u524d\u8fdb\u884c\u4efb\u4f55\u5347\u5355\u63a8\u9500**\u3002\u5347\u5355\u5fc5\u987b\u5728\u5176\u5b8c\u6210\u7b2c\u4e00\u4e2a\u5c0f\u91cc\u7a0b\u7891\uff08\u5982\u6210\u529f\u5f55\u5236\u4e00\u6bb5\u6ee1\u610f\u7684\u4f5c\u54c1\uff09\u5e76\u83b7\u5f97\u5f3a\u70c8\u6b63\u53cd\u9988\u4e4b\u540e\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u8bfb\u5b8c\u4e00\u6bb5\uff0c\u5c31\u53e3\u5e72\u820c\u71e5\u7684\uff0c\u4e0d\u4f1a\u6362\u6c14\uff0c\u6709\u70b9\u7740\u6025\u4e86\u201d\n2. > \u201c\u597d\u50cf\u662f\u8fd9\u4e48\u56de\u4e8b\uff0c\u5c31\u662f\u771f\u8bfb\u8d77\u6765\uff0c\u53c8\u653e\u4e0d\u5f00\u4e86\u201d\n3. > \u201c\u4ee5\u540e\u8ddf\u7740\u5e08\u59d0\u627e\u52c7\u6c14[\u5bb3\u7f9e]\u201d\n4. > \u201c\u6709\u70b9\u7d27\u5f20\uff0c\u6015\u8fdb\u4e0d\u4e86\u89d2\u8272\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6\u60c5\u7eea\u5de8\u5a74\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u88ab\u9ad8\u624b\u5e26\u9886\u548c\u80af\u5b9a\u7684\u5f52\u5c5e\u611f\u4e0e\u5b89\u5168\u611f**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u201c\u50bb\u74dc\u7248\u201d\u6559\u5b66\u6b65\u9aa4+\u6ee1\u914d\u7684\u60c5\u7eea\u8d5e\u7f8e\u4e0e\u9f13\u52b1\uff08C\u6a21\u5757\u62c9\u6ee1\uff09\uff0c\u7528\u201c\u88ab\u7f69\u7740\u201d\u7684\u5b89\u5168\u611f\u62b5\u6d88\u5176\u6280\u672f\u81ea\u5351**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5c0a\u91cd\u5f52\u5c5e\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\uff08\u9700\u642d\u914d\u6ee1\u914d\u7597\u6108\u966a\u5b66\u5305\uff09\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u5973\uff08\u63a8\u65ad\uff09\", \"city\": \"\u672a\u77e5\"}\n```";
