    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a (UID: 346975354)\n\n## \u4e00\u3001 \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n\n### 1. \u52a8\u673a\u7eaf\u5ea6\n*   **\u5b66\u4e60\u9a71\u52a8**\uff1a\u9ad8\u3002\u7528\u6237\u79ef\u6781\u53c2\u4e0e\u76f4\u64ad\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u4e3b\u52a8\u63d0\u95ee\uff08\u5982\u201c\u5f55\u4e66\u5f55\u5236\u4e00\u4e2a\u5c0f\u65f6\u7684\u6709\u6548\u65f6\u957f\uff0c\u662f\u4e0d\u95f4\u65ad\u7684\u4e00\u53e3\u6c14\u5f55\u5b8c\u5417\uff1f\u201d\uff09\uff0c\u8868\u73b0\u51fa\u5bf9\u6280\u80fd\u63d0\u5347\u7684\u660e\u786e\u5174\u8da3\u3002\n*   **\u53d8\u73b0\u9a71\u52a8**\uff1a\u4e2d\u3002\u5bf9\u201c\u5f55\u4e66+\u753b\u672c\u201d\u7b49\u517c\u804c\u5c97\u4f4d\u611f\u5174\u8da3\uff0c\u5173\u6ce8\u53d8\u73b0\u6e20\u9053\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u6025\u8feb\u7684\u201c\u5feb\u94b1\u201d\u7126\u8651\u3002\n*   **\u5174\u8da3\u9a71\u52a8**\uff1a\u9ad8\u3002\u5bf9Pia\u620f\u4f53\u9a8c\u53cd\u9988\u201c\u73a9\u4e0a\u763e\u4e86\u2026\u2026\u73a9\u7684\u5f88\u55e8\u3002\u770b\u5230\u4e86\u4e0d\u540c\u4eba\u7684\u957f\u77ed\uff0c\u5f97\u4e4b\u6240\u5e78\uff0c\u9887\u6709\u6536\u83b7\u201d\uff0c\u663e\u793a\u51fa\u5bf9\u6709\u58f0\u6f14\u64ad\u6d3b\u52a8\u672c\u8eab\u6709\u6d53\u539a\u5174\u8da3\u548c\u4eab\u53d7\u611f\u3002\n*   **\u793e\u4ea4/\u5f52\u5c5e\u9a71\u52a8**\uff1a\u4e2d\u3002\u4e0e\u9500\u552e\uff08\u5e08\u59d0\uff09\u3001\u73ed\u4e3b\u4efb\u4e92\u52a8\u826f\u597d\uff0c\u6709\u4fe1\u4efb\u5efa\u7acb\uff08\u201c\u5fc5\u987b\u5f97\u4fe1\u5e08\u59d0\u201d\uff09\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u793e\u7fa4\u4f9d\u8d56\u3002\n\n### 2. \u8d44\u6e90\u5e95\u5ea7\n*   **\u65f6\u95f4\u8d44\u6e90**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u63d0\u53ca\u201c\u8eab\u517c\u6570\u804c\u201d\uff0c\u6697\u793a\u53ef\u80fd\u662f\u5728\u804c\u6216\u6709\u591a\u91cd\u8eab\u4efd\uff0c\u4f46\u5177\u4f53\u65f6\u95f4\u5f39\u6027\u672a\u77e5\u3002\n*   **\u7ecf\u6d4e\u8d44\u6e90**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u5df2\u652f\u4ed82380\u5143\u8bfe\u7a0b\u8d39\u7528\uff0c\u4f46\u672a\u63d0\u53ca\u652f\u4ed8\u538b\u529b\u6216\u8d44\u91d1\u6765\u6e90\uff0c\u65e0\u6cd5\u5224\u65ad\u7ecf\u6d4e\u538b\u529b\u3002\n*   **\u8bbe\u5907/\u73af\u5883\u8d44\u6e90**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u6709\u7535\u8111\uff0c\u4f46\u5177\u4f53\u5f55\u97f3\u73af\u5883\u3001\u8bbe\u5907\u4e13\u4e1a\u5ea6\u672a\u77e5\u3002\n*   **\u5b66\u4e60\u57fa\u7840**\uff1a\u4e2d\u3002\u80fd\u8f83\u5feb\u7406\u89e3\u6559\u5b66\u8981\u70b9\uff08\u5982\u65c1\u767d\u4e8c\u6b21\u521b\u4f5c\uff09\uff0c\u5e76\u80fd\u5728\u6307\u5bfc\u4e0b\u6539\u8fdb\u4f5c\u4e1a\uff0c\u5177\u5907\u4e00\u5b9a\u5b66\u4e60\u80fd\u529b\u548c\u609f\u6027\u3002\n\n### 3. \u5fc3\u7406\u5f39\u6027\n*   **\u6297\u538b\u6027**\uff1a\u4e2d\u9ad8\u3002\u80fd\u63a5\u53d7\u9500\u552e\u5bc6\u96c6\u7684\u8282\u594f\uff08\u76f4\u64ad\u3001\u6253\u5361\u3001\u4f5c\u4e1a\u3001Pia\u620f\uff09\uff0c\u5e76\u6309\u65f6\u5b8c\u6210\u4efb\u52a1\uff0c\u672a\u8868\u73b0\u51fa\u70e6\u8e81\u6216\u6297\u62d2\u3002\n*   **\u4e92\u52a8\u4e3b\u52a8\u6027**\uff1a\u9ad8\u3002\u4e3b\u52a8\u63d0\u95ee\u3001\u79ef\u6781\u53cd\u9988\u3001\u914d\u5408\u9500\u552e\u6d41\u7a0b\uff0c\u6c9f\u901a\u793c\u8c8c\u4e14\u79ef\u6781\uff08\u201c\u611f\u8c22\u5e08\u59d0\u89e3\u60d1\u201d\u3001\u201c\u8f9b\u82e6\u4e86\u201d\u3001\u201c\u60a8\u5fd9\u5148\u201d\uff09\u3002\n*   **\u9884\u671f\u7ba1\u7406**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u660e\u786e\u8868\u8fbe\u5bf9\u5b66\u4e60\u6210\u679c\u3001\u53d8\u73b0\u901f\u5ea6\u6216\u6536\u5165\u7684\u8fc7\u9ad8\u6216\u4e0d\u5207\u5b9e\u9645\u7684\u671f\u671b\u3002\u5bf9\u201cAI\u65f6\u85aa\u6d4b\u8bd5\u201d\u7684\u53c2\u8003\u6027\u8868\u793a\u7406\u89e3\u3002\n*   **\u51b3\u7b56\u72ec\u7acb\u6027**\uff1a\u4e2d\u9ad8\u3002\u80fd\u81ea\u4e3b\u9009\u62e9\u611f\u5174\u8da3\u7684\u4e66\u7c4d\u7c7b\u578b\uff08\u7075\u5f02\u3001\u513f\u7ae5\u65b9\u5411\uff09\uff0c\u5e76\u5728\u64cd\u4f5c\u9047\u5230\u95ee\u9898\u65f6\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\u3002\n\n## \u4e8c\u3001 ABCD\u5224\u5b9a\u6811\u5206\u6790\n\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**\uff1a**\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u4e8e4\u67088\u65e5\u652f\u4ed82380\u5143\uff0c\u786e\u8ba4\u8d2d\u4e70\u884c\u4e3a\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u6216\u7b2c\u4e09\u65b9\u51b3\u7b56\u8005\u4fe1\u606f\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u4e3a\u4e2a\u4eba\u72ec\u7acb\u51b3\u7b56\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u7eaf\u5ea6**\uff1a**B\u7c7b\uff08\u5174\u8da3+\u5b66\u4e60\u9a71\u52a8\u578b\uff09**\u3002\u6838\u5fc3\u9a71\u52a8\u529b\u6765\u81ea\u5bf9\u6709\u58f0\u6f14\u64ad\u672c\u8eab\u7684\u5174\u8da3\u548c\u6280\u80fd\u63d0\u5347\u7684\u6e34\u671b\uff0c\u53d8\u73b0\u662f\u9644\u5e26\u76ee\u6807\u800c\u975e\u552f\u4e00\u76ee\u6807\u3002\n*   **\u6b65\u9aa42 - \u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u5f52\u4e3aC\u7c7b\uff08\u8d44\u6e90\u6a21\u7cca\u578b\uff09**\u3002\u5173\u952e\u7684\u65f6\u95f4\u3001\u7ecf\u6d4e\u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u5df2\u652f\u4ed8\u8d39\u7528\u5e76\u5177\u5907\u57fa\u7840\u5b66\u4e60\u80fd\u529b\u3002\n*   **\u6b65\u9aa43 - \u5fc3\u7406\u5f39\u6027**\uff1a**A\u7c7b\uff08\u9ad8\u5f39\u6027\u9002\u5e94\u8005\uff09**\u3002\u914d\u5408\u5ea6\u9ad8\uff0c\u5b66\u4e60\u6001\u5ea6\u79ef\u6781\uff0c\u4e92\u52a8\u826f\u597d\uff0c\u80fd\u9002\u5e94\u8bad\u7ec3\u8425\u8282\u594f\u3002\n*   **\u7efc\u5408\u5224\u5b9a**\uff1a**B-C-A\u578b\u7528\u6237**\u3002\u9ad8\u5174\u8da3\u9a71\u52a8\u3001\u9ad8\u5fc3\u7406\u5f39\u6027\uff0c\u4f46\u8d44\u6e90\u5e95\u5ea7\u4fe1\u606f\u4e0d\u5168\uff0c\u9700\u73ed\u4e3b\u4efb\u540e\u7eed\u8865\u5145\u6838\u67e5\u3002\n\n## \u4e09\u3001 \u7528\u6237\u539f\u578b\u5339\u914d\n**T3 \u5174\u8da3\u63a2\u7d22\u5b9e\u8df5\u8005**\n*   **\u7279\u5f81\u543b\u5408**\uff1a\u5bf9\u6709\u58f0\u6f14\u64ad\u6709\u771f\u5b9e\u5174\u8da3\uff08\u4eab\u53d7Pia\u620f\uff09\uff0c\u5b66\u4e60\u4e3b\u52a8\uff0c\u5173\u6ce8\u6280\u80fd\u672c\u8eab\uff08\u5982\u89d2\u8272\u5851\u9020\u3001\u5f55\u97f3\u6280\u5de7\uff09\uff0c\u53d8\u73b0\u52a8\u673a\u76f8\u5bf9\u5065\u5eb7\uff0c\u4e0e\u9500\u552e/\u73ed\u4e3b\u4efb\u5efa\u7acb\u4e86\u4e00\u5b9a\u4fe1\u4efb\u5173\u7cfb\u3002\n*   **\u4e0d\u7b26\u70b9**\uff1a\u672a\u8868\u73b0\u51faT3\u5178\u578b\u201c\u4f4e\u65f6\u95f4\u538b\u529b\u201d\u7279\u5f81\uff08\u56e0\u201c\u8eab\u517c\u6570\u804c\u201d\u4fe1\u606f\u4e0d\u660e\uff09\u3002\n\n## \u56db\u3001 \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u6781\u4f4e/\u4f4e/\u4e2d/\u9ad8/\u6781\u9ad8)\n*   **\u603b\u4f53\u98ce\u9669**\uff1a**\u4f4e**\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u4e0d\u53ca\u9884\u671f**\uff1a\u4f4e\u3002\u7528\u6237\u5174\u8da3\u9a71\u52a8\u4e3a\u4e3b\uff0c\u5bf9\u201cAI\u65f6\u85aa\u6d4b\u8bd5\u201d\u7684\u5c40\u9650\u6027\u6709\u8ba4\u77e5\uff0c\u672a\u8868\u73b0\u51fa\u4e0d\u5207\u5b9e\u9645\u7684\u6536\u5165\u627f\u8bfa\u4f9d\u8d56\u3002\n    2.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u4e2d\uff08\u5173\u952e\u98ce\u9669\u70b9\uff09**\u3002\u201c\u8eab\u517c\u6570\u804c\u201d\u662f\u6f5c\u5728\u98ce\u9669\u4fe1\u53f7\uff0c\u9700\u786e\u8ba4\u5176\u53ef\u7528\u4e8e\u5b66\u4e60\u548c\u7ec3\u4e60\u7684\u7a33\u5b9a\u65f6\u95f4\u3002\n    3.  **\u7ecf\u6d4e\u538b\u529b**\uff1a\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u8bc4\u4f30\u3002\n    4.  **\u5185\u5bb9/\u670d\u52a1\u4e0d\u7b26**\uff1a\u4f4e\u3002\u9500\u552e\u8fc7\u7a0b\u5c55\u793a\u4e86\u8be6\u7ec6\u6559\u5b66\u3001\u70b9\u8bc4\u3001\u8d44\u6e90\uff08\u7248\u6743\u4e66\uff09\uff0c\u7528\u6237\u5df2\u5f00\u59cb\u9886\u53d6\u8d44\u6e90\uff0c\u672a\u4ea7\u751f\u4e0d\u7b26\u611f\u3002\n    5.  **\u4f53\u9a8c\u843d\u5dee**\uff1a\u4f4e\u3002\u9500\u552e\u670d\u52a1\u7ec6\u81f4\uff08\u4f5c\u4e1a\u70b9\u8bc4\u3001\u6280\u5de7\u6307\u5bfc\uff09\uff0c\u7528\u6237\u53cd\u9988\u6b63\u9762\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u8bc4\u4f30\u3002\n    7.  **\u7ade\u54c1/\u51b2\u52a8\u540e\u6094**\uff1a\u4f4e\u3002\u7528\u6237\u51b3\u7b56\u8fc7\u7a0b\u4f34\u968f\u5b66\u4e60\u4f53\u9a8c\uff0c\u975e\u7eaf\u51b2\u52a8\u6d88\u8d39\uff0c\u4e14\u5df2\u5efa\u7acb\u4e00\u5b9a\u4fe1\u4efb\uff08\u201c\u76f8\u4fe1\u5e08\u59d0\u624d\u6765\u7684\u201d\uff09\u3002\n\n## \u4e94\u3001 \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u8fc7\u5ea6\u627f\u8bfa**\uff1a\u9500\u552e\u63d0\u53ca\u201c\u5e26\u4f60\u5165\u884c\u201d\u3001\u201c\u8ba9\u4f60\u58f0\u97f3\u5347\u503c\u201d\u3001\u201c\u5b89\u6392\u65b0\u624b\u4e66\u201d\u3001\u201c\u65f6\u85aa\u4ece90\u5230500\u201d\u7b49\u672a\u6765\u6536\u76ca\u63cf\u8ff0\uff0c**\u5b58\u5728\u6a21\u7cca\u7684\u6536\u76ca\u5f15\u5bfc\uff0c\u4f46\u672a\u7ed9\u51fa\u5177\u4f53\u91d1\u989d\u6216\u65f6\u95f4\u4fdd\u8bc1**\uff0c\u5c5e\u4e8e\u884c\u4e1a\u5e38\u89c1\u8bdd\u672f\uff0c\u98ce\u9669\u53ef\u63a7\u3002\n*   **\u5236\u9020\u7126\u8651**\uff1a\u4f7f\u7528\u201c\u6700\u540e\u4e00\u6b21\u8003\u6838\u201d\u3001\u201c\u622a\u6b62\u65f6\u95f4\u201d\u3001\u201c\u540d\u989d\u6709\u9650\u201d\u7b49\u8bdd\u672f\u8425\u9020\u7d27\u8feb\u611f\uff0c\u5c5e\u4e8e\u5e38\u89c4\u9500\u552e\u7b56\u7565\uff0c\u672a\u89c2\u5bdf\u5230\u6781\u7aef\u65bd\u538b\u3002\n*   **\u4fe1\u606f\u900f\u660e**\uff1a\u5173\u4e8e\u8bfe\u7a0b\u7248\u672c\uff08\u9ad8\u9636\u7248\u5305\u542b\u7cbe\u82f1+\u8fdb\u9636\uff09\u7684\u7591\u95ee\u5f97\u5230\u53ca\u65f6\u89e3\u7b54\u3002\u7248\u6743\u4e66\u9886\u53d6\u6d41\u7a0b\u6e05\u6670\u3002\n*   **\u603b\u4f53\u8bc4\u4f30**\uff1a\u9500\u552e\u6d41\u7a0b\u5b58\u5728\u884c\u4e1a\u901a\u7528\u7684\u8bdd\u672f\u5305\u88c5\uff0c\u4f46\u672a\u53d1\u73b0**\u4e25\u91cd\u8fdd\u89c4\u6216\u6b3a\u8bc8\u884c\u4e3a**\u3002\u7528\u6237\u662f\u5728\u53c2\u4e0e\u591a\u65e5\u5b66\u4e60\u4f53\u9a8c\u540e\u505a\u51fa\u7684\u652f\u4ed8\u51b3\u7b56\u3002\n\n## \u516d\u3001 \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**\uff1a**\u5339\u914d**\u3002\u7528\u6237\u5174\u8da3\u9a71\u52a8\u3001\u5b66\u4e60\u4e3b\u52a8\uff0c\u4e0e\u9700\u8981\u957f\u671f\u7ec3\u4e60\u548c\u79ef\u7d2f\u7684\u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\u7279\u6027\u76f8\u7b26\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**\u9996\u5468\u5185\u6df1\u5ea6\u8bbf\u8c08\uff0c\u6f84\u6e05\u65f6\u95f4\u4e0e\u9884\u671f**\n*   **\u5177\u4f53\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u5173\u952e\u4fe1\u606f\u8865\u5168**\uff1a\u5728\u5f00\u8425\u521d\u671f\u8fdb\u884c\u4e00\u5bf9\u4e00\u6c9f\u901a\uff0c\u91cd\u70b9\u63a2\u660e\uff1a\n        *   **\u65f6\u95f4\u5b89\u6392**\uff1a\u201c\u8eab\u517c\u6570\u804c\u201d\u7684\u5177\u4f53\u60c5\u51b5\uff1f\u6bcf\u5468\u80fd\u7a33\u5b9a\u6295\u5165\u5b66\u4e60\u3001\u7ec3\u4e60\u3001Pia\u620f\u7684\u65f6\u95f4\u6709\u591a\u5c11\uff1f\n        *   **\u6838\u5fc3\u76ee\u6807**\uff1a\u8fdb\u4e00\u6b65\u6f84\u6e05\u5176\u5b66\u4e60\u76ee\u6807\uff0c\u662f\u5174\u8da3\u6ee1\u8db3\u4e3a\u4e3b\uff0c\u8fd8\u662f\u5e0c\u671b\u8fbe\u5230\u7279\u5b9a\u7ea7\u522b\u7684\u517c\u804c\u6536\u5165\uff1f\u6821\u6b63\u5176\u5bf9\u201c\u63a5\u5355\u201d\u901f\u5ea6\u548c\u96be\u5ea6\u7684\u9884\u671f\u3002\n        *   **\u5bb6\u5ead\u652f\u6301**\uff1a\u59d4\u5a49\u4e86\u89e3\u8bfe\u7a0b\u51b3\u7b56\u662f\u5426\u5b8c\u5168\u81ea\u4e3b\uff0c\u6709\u65e0\u5bb6\u5ead\u7ecf\u6d4e\u6216\u65f6\u95f4\u4e0a\u7684\u6f5c\u5728\u538b\u529b\u3002\n    2.  **\u5173\u7cfb\u7ef4\u62a4\u4e0e\u4fe1\u4efb\u52a0\u56fa**\uff1a\u5ef6\u7eed\u201c\u5e08\u59d0\u201d\u5efa\u7acb\u7684\u4fe1\u4efb\u5173\u7cfb\uff0c\u80af\u5b9a\u5176\u5b66\u4e60\u6001\u5ea6\u548c\u6f5c\u529b\uff08\u5982\u201c\u620f\u611f\u548c\u58f0\u7ebf\u53d7\u6b22\u8fce\u201d\uff09\uff0c\u5f3a\u5316\u5176\u201c\u88ab\u770b\u597d\u201d\u7684\u611f\u89c9\u3002\n    3.  **\u5b66\u4e60\u8def\u5f84\u5f15\u5bfc**\uff1a\u9488\u5bf9\u5176\u9009\u62e9\u7684\u201c\u7075\u5f02\u201d\u548c\u201c\u513f\u7ae5\u201d\u65b9\u5411\uff0c\u63d0\u4f9b\u76f8\u5e94\u7684\u521d\u671f\u7ec3\u4e60\u6750\u6599\u548c\u699c\u6837\u4f5c\u54c1\uff0c\u4fdd\u6301\u5176\u5174\u8da3\u70ed\u5ea6\u3002\n    4.  **\u98ce\u9669\u76d1\u63a7**\uff1a\u5bc6\u5207\u5173\u6ce8\u5176\u5f00\u8bfe\u540e\u7684\u51fa\u52e4\u3001\u4f5c\u4e1a\u63d0\u4ea4\u60c5\u51b5\u3002\u82e5\u51fa\u73b0\u65f6\u95f4\u4e0d\u8db3\u7684\u8ff9\u8c61\uff0c\u9700\u53ca\u65f6\u4ecb\u5165\uff0c\u5e2e\u52a9\u5176\u8c03\u6574\u5b66\u4e60\u8ba1\u5212\u6216\u8bbe\u5b9a\u66f4\u73b0\u5b9e\u7684\u76ee\u6807\uff0c\u907f\u514d\u56e0\u8fdb\u5ea6\u843d\u540e\u4ea7\u751f\u632b\u8d25\u611f\u3002\n\n{\"core_type\": \"T3 \u5174\u8da3\u63a2\u7d22\u5b9e\u8df5\u8005\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u9996\u5468\u5185\u6df1\u5ea6\u8bbf\u8c08\uff0c\u6f84\u6e05\u65f6\u95f4\u4e0e\u9884\u671f\"}";
