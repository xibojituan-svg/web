    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a676689788\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a676689788 (\u8c4c\u8c46\u5410\u8461\u8404\u7c7d-\u5357\u4eac-\u5973\u64ad) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-23 \u81f3 2026-01-28 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5bb8\u7852(\u5eb7\u53cc\u660e) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66/\u914d\u97f3\u8bfe\u7a0b\uff08\u4ece\u4e0a\u4e0b\u6587\u63a8\u65ad\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3** |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\uff0c\u4f46\u4ece\u53d1\u8a00\u9891\u7387\u548c\u65f6\u6bb5\uff08\u65e97\u70b9\u81f3\u665a10\u70b9\uff09\u770b\uff0c**\u65f6\u95f4\u5bbd\u88d5**\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3** |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u7fa4\u5185\u4e92\u52a8\u3001\u6280\u672f\u8ba8\u8bba\u3001\u793e\u4ea4\u95f2\u804a\u3001\u9879\u76ee\u7edf\u7b79\u5747\u6709\u4f53\u73b0\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06**\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u800c\u6765\uff0c\u4eab\u53d7\u5b66\u4e60\u3001\u521b\u4f5c\u548c\u56e2\u961f\u534f\u4f5c\u7684\u8fc7\u7a0b\uff0c\u8ffd\u6c42\u4e13\u4e1a\u7cbe\u8fdb\u548c\u81ea\u6211\u5b9e\u73b0\uff0c\u800c\u975e\u77ed\u671f\u53d8\u73b0\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u60f3\u914d\u597d\u542c\u7684\u597d\u73a9\u7684\u201d\n  > \u201c\u5f53\u4e00\u4efd\u7231\u597d \u522b\u7684 \u522b\u60f3 \u987a\u5176\u81ea\u7136\u5c31\u597d\u201d\n  > \u201c\u8fd9\u70b9\u94b1 \u4e5f\u4e0d\u591f\u5e72\u4ec0\u4e48.\u5c31\u662f\u5927\u5bb6\u7eaf\u7cb9\u559c\u6b22\u914d\u97f3\u201d\n  > \u201c\u6211\u89c9\u5f97\u6211\u4eec\u5c31\u5f53\u4efd\u70ed\u7231\u7684\u4e8b\u60c5 \u597d\u597d\u8ba4\u771f\u5b66\u4e60.\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b06**\u9ad8**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d\u9ad8** \u2014 \u62e5\u6709\u7535\u8111\u3001AU\u8f6f\u4ef6\u7b49\u4e13\u4e1a\u8bbe\u5907\uff0c\u80fd\u8fdb\u884c\u6df7\u97f3\u7b49\u590d\u6742\u64cd\u4f5c\uff0c\u5177\u5907\u4e00\u5b9a\u7684\u786c\u4ef6\u548c\u8f6f\u4ef6\u57fa\u7840\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u9ad8** \u2014 \u53d1\u8a00\u6d3b\u8dc3\uff0c\u80fd\u6295\u5165\u65f6\u95f4\u8fdb\u884c\u5f55\u97f3\u3001\u6df7\u97f3\u3001\u5267\u672c\u8ba8\u8bba\u548c\u56e2\u961f\u534f\u8c03\uff0c\u65f6\u95f4\u652f\u914d\u5ea6\u9ad8\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3**\uff0c\u4f46\u4ece\u5176\u9ad8\u5ea6\u6295\u5165\u7684\u5b66\u4e60\u72b6\u6001\u770b\uff0c\u672a\u53d7\u660e\u663e\u5e72\u6270\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06**\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\uff0c\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u5982AU\u6df7\u7f29\u58f0\u9053\u4e22\u5931\uff09\u80fd\u4e3b\u52a8\u6c42\u52a9\u5e76\u5c1d\u8bd5\u89e3\u51b3\uff0c\u60c5\u7eea\u7a33\u5b9a\u4e50\u89c2\uff0c\u80fd\u9f13\u52b1\u548c\u5f00\u5bfc\u4ed6\u4eba\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u5f04\u5f04\u770b\u201d\uff08\u9047\u5230\u95ee\u9898\u4e3b\u52a8\u5c1d\u8bd5\uff09\n  > \u201c\u653e\u8f7b\u677e \ud83d\ude0e\u201d\uff08\u4e3b\u52a8\u5f00\u5bfc\u7126\u8651\u540c\u5b66\uff09\n  > \u201c\u6211\u4eec\u662f\u6700\u68d2\u7684\u201d\uff08\u79ef\u6781\u9f13\u52b1\u56e2\u961f\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 & \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u4e13\u4e1a\u80fd\u529b\u7684\u8ffd\u6c42\u548c\u83b7\u5f97\u56e2\u961f\u8ba4\u53ef\u7684\u6e34\u671b\u3002\u5979\u4eab\u53d7\u5728\u56e2\u961f\u4e2d\u626e\u6f14\u201c\u534f\u8c03\u8005\u201d\u548c\u201c\u6307\u5bfc\u8005\u201d\u7684\u89d2\u8272\uff0c\u5e76\u4ece\u4e2d\u83b7\u5f97\u4ef7\u503c\u611f\u548c\u5c0a\u91cd\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u8d4b\u4e88\u5176\u201c\u9886\u8896\u201d\u8eab\u4efd\u4e0e\u7edf\u7b79\u6743\u529b**\uff0c\u63d0\u4f9b\u5c55\u793a\u4e13\u4e1a\u80fd\u529b\u548c\u7ec4\u7ec7\u624d\u80fd\u7684\u821e\u53f0\uff0c\u8ba9\u5979\u6210\u4e3a\u73ed\u7ea7\u751f\u6001\u7684\u5efa\u8bbe\u8005\u548c\u7ef4\u62a4\u8005\uff0c\u6ee1\u8db3\u5176\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\u7684\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\u2b50A\u7c7b** (\u9ad8\u4ef7\u503c\u9886\u8896\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T1-A \u5bfc\u6f14\u578b\u9886\u8896** (\u5df2\u89e6\u53d1\u6df7\u5408\u4f533\u53f7\u201c\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b\u201d\u8fdb\u5316) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u81ea\u4e3b\u6027\u5f3a\uff0c\u98ce\u9669\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u6781\u4f4e | \u65f6\u95f4\u5145\u88d5\uff0c\u5b66\u4e60\u70ed\u60c5\u9ad8\uff0c\u4e3b\u52a8\u6027\u5f3a\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u632b\u80fd\u4e3b\u52a8\u6c42\u89e3\uff0c\u5e76\u5f00\u5bfc\u4ed6\u4eba\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u52a8\u673a\u4e3a\u70ed\u7231\u548c\u81ea\u6211\u5b9e\u73b0\uff0c\u5bf9\u77ed\u671f\u53d8\u73b0\u65e0\u5f3a\u8bc9\u6c42\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u51e0\u4e4e\u65e0\u98ce\u9669**\u3002\u552f\u4e00\u98ce\u9669\u70b9\u5728\u4e8e**\u73ed\u4e3b\u4efb\u6216\u5e73\u53f0\u672a\u80fd\u8d4b\u4e88\u5176\u8db3\u591f\u7684\u5c0a\u91cd\u548c\u6743\u9650**\uff0c\u5bfc\u81f4\u5176\u201c\u5bfc\u6f14\u201d\u89d2\u8272\u88ab\u538b\u5236\uff0c\u4ea7\u751f\u201c\u88ab\u77ee\u5316\u201d\u611f\u800c\u5931\u671b\u9000\u51fa\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u8c4c\u8c46\uff0c\u6211\u770b\u4f60\u5728\u7fa4\u91cc\u7279\u522b\u70ed\u5fc3\uff0c\u7ec4\u7ec7\u80fd\u529b\u548c\u4e13\u4e1a\u773c\u5149\u90fd\u5f88\u68d2\u3002\u54b1\u4eec\u8fd9\u4e2a\u73ed\u4ee5\u540e\u5c31\u9760\u4f60\u591a\u5e26\u5e26\u8282\u594f\u4e86\uff0c\u6709\u4ec0\u4e48\u60f3\u6cd5\u4f60\u76f4\u63a5\u5b89\u6392\uff0c\u6211\u5168\u529b\u652f\u6301\u4f60\uff01\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** + **\u3010\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\u3011**\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u6302\u8f7d **\u3010D\u6a21\u5757\uff1a\u8eab\u4efd\u4e0e\u6743\u529b\u5149\u73af\u6c60\u3011**\uff0c\u7acb\u5373\u8d4b\u4e88\u5176\u201c\u7ec4\u957f\u201d\u3001\u201c\u9879\u76ee\u5236\u4f5c\u4eba\u201d\u6216\u201c\u7eaa\u5f8b\u59d4\u5458\u201d\u7b49\u5b98\u65b9\u8eab\u4efd\u3002\u540c\u65f6\u63d0\u4f9b **\u3010B\u6a21\u5757\uff1a\u786c\u6838\u624b\u827a\u6c60\u3011** \u7684\u6df1\u5ea6\u6280\u672f\u7b54\u7591\u652f\u6301\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u5c45\u9ad8\u4e34\u4e0b\u7684\u201c\u8001\u5e08\u5bf9\u5b66\u751f\u201d\u53e3\u543b\u5bf9\u5979\u53d1\u53f7\u65bd\u4ee4\uff1b\u5426\u5b9a\u6216\u5ffd\u89c6\u5979\u7684\u7edf\u7b79\u5b89\u6392\uff1b\u5728\u5979\u7ec4\u7ec7\u6d3b\u52a8\u65f6\u6cfc\u51b7\u6c34\u6216\u8d8a\u6743\u5e72\u6d89\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5979\u5bf9\u4e13\u4e1a\u6709\u8ffd\u6c42\uff0c\u662f\u9ad8\u7aef\u8bbe\u5907\u3001\u9ad8\u9636\u79c1\u6559\u8bfe\u3001\u6df1\u5ea6\u5de5\u4f5c\u574a\u7b49\u9ad8\u5ba2\u5355\u4ef7\u4ea7\u54c1\u7684**\u6838\u5fc3\u4e70\u5355\u76d8**\u3002\u63a8\u4ecb\u65f6\u9700\u4ee5\u201c\u4e3a\u4f60\u91cf\u8eab\u6253\u9020\u7684\u4e13\u4e1a\u8fdb\u9636\u8def\u5f84\u201d\u4e3a\u5207\u5165\u70b9\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u4f60\u8d76\u5feb\u5347\u7ea7** \u592a\u65e0\u804a\u4e86\ud83d\ude44\u201d (\u5bf9\u5e73\u53f0\u6709\u66f4\u9ad8\u671f\u5f85\uff0c\u6e34\u671b\u6311\u6218)\n2. > \u201c**\u6211\u4eec\u73b0\u5728\u4efb\u52a1\u5c31\u662f\u5b66\u4e60 \u5229\u7528\u8fd9\u4e2a\u5e73\u53f0\u5b66\u4e60**\u201d (\u76ee\u6807\u660e\u786e\uff0c\u5b66\u4e60\u5bfc\u5411)\n3. > \u201c**\u65c1\u767d\u5c31\u6309\u4e4b\u524d\u53d1\u7ed9\u9752\u706f\u7684\u672c\u5c31\u884c**\u201d (\u4e3b\u52a8\u5206\u914d\u4efb\u52a1\uff0c\u5c55\u73b0\u7edf\u7b79\u80fd\u529b)\n4. > \u201c**\u4f60\u7684\u8bd5\u97f3\u672c\u8bfb\u5f97\u600e\u4e48\u6837\u4e86**\u201d (\u4e3b\u52a8\u5173\u5fc3\u540c\u4f34\u8fdb\u5ea6\uff0c\u6709\u7ba1\u7406\u8005\u610f\u8bc6)\n5. > \u201c**\u653e\u8f7b\u677e  \u9752\u706f.\u4f60\u662f\u5904\u5973\u5ea7\u5417\uff1f\u8003\u8651\u5468\u5168**\u201d (\u80fd\u6d1e\u5bdf\u4ed6\u4eba\u60c5\u7eea\u5e76\u8fdb\u884c\u5b89\u629a\uff0c\u5177\u5907\u653f\u59d4\u6f5c\u8d28)\n6. > \u201c**\u4f60\u7684\u82e6\u5fc3 \u6211\u4eec\u90fd\u61c2**\u201d (\u60c5\u5546\u9ad8\uff0c\u80fd\u51dd\u805a\u56e2\u961f\u5171\u8bc6)\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T1-A\u5bfc\u6f14\u578b\u9886\u8896 + \u6df7\u5408\u4f533\u53f7\uff08\u6743\u9650\u89c9\u9192\uff09\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\uff0c\u6210\u4e3a\u56e2\u961f\u6838\u5fc3\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7acb\u5373\u6267\u884c\u201c\u9ec4\u888d\u52a0\u8eab\u63d0\u5e72\u6cd5\u201d\uff0c\u8d4b\u4e88\u5176\u5b98\u65b9\u7edf\u7b79\u6743\uff0c\u73ed\u4e3b\u4efb\u9000\u5c45\u5e55\u540e\u5f53\u6367\u54cf\u3011**\u3002\n\n```json\n{\"core_type\": \"T1-A \u5bfc\u6f14\u578b\u9886\u8896 (\u6df7\u5408\u4f533\u53f7\uff1a\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b)\", \"risk_level\": \"\u6781\u4f4e\", \"refund_risk\": \"\u6781\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u5708\u5c42\u5408\u4f19\u4eba\u7ebf\"}\n```";
