    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d-\u4f4e)**\n    *   **\u8868\u5c42\u52a8\u673a**\uff1a\u660e\u786e\u8868\u8fbe\u517c\u804c/\u526f\u4e1a\u53d8\u73b0\u9700\u6c42\uff08\u201c\u517c\u804c\u5de5\u4f5c\u201d\u3001\u201c\u989d\u5916\u6536\u76ca\u201d\uff09\uff0c\u5bf9\u201c\u65f6\u85aa90-300\u201d\u3001\u201c1W\u5de6\u53f3\u201d\u7b49\u6536\u5165\u4fe1\u606f\u6709\u54cd\u5e94\u3002\n    *   **\u6df1\u5c42\u52a8\u673a**\uff1a\u672a\u660e\u786e\u8868\u8fbe\u5185\u5728\u5174\u8da3\u3001\u804c\u4e1a\u8f6c\u578b\u6216\u81ea\u6211\u5b9e\u73b0\u7b49\u6df1\u5c42\u9a71\u52a8\u3002\u5b66\u4e60\u884c\u4e3a\u4e3b\u8981\u53d7\u5916\u90e8\u4efb\u52a1\uff08\u6253\u5361\u3001\u4f5c\u4e1a\uff09\u548c\u9500\u552e\u5f15\u5bfc\u9a71\u52a8\u3002\n    *   **\u4fe1\u53f7\u5f3a\u5ea6**\uff1a\u4e2d\u7b49\u3002\u7528\u6237\u5bf9\u53d8\u73b0\u8def\u5f84\u6709\u660e\u786e\u5173\u6ce8\uff0c\u4f46\u7f3a\u4e4f\u5bf9\u914d\u97f3/\u6709\u58f0\u884c\u4e1a\u672c\u8eab\u70ed\u60c5\u7684\u81ea\u53d1\u8868\u8fbe\u3002\n\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d-\u4f4e)**\n    *   **\u65f6\u95f4\u8d44\u6e90**\uff1a**\u4e25\u91cd\u53d7\u9650**\u3002\u5168\u804c\u4e0a\u73ed\u65cf\uff0c\u5348\u4f11\u4ec550\u5206\u949f\uff0c\u4e0a\u73ed\u65f6\u95f4\u9971\u548c\u4e14\u516c\u53f8\u5bf9\u624b\u673a\u4f7f\u7528\u7ba1\u63a7\u4e25\u683c\uff08\u201c\u4e0a\u73ed\u65f6\u95f4\u4e0d\u80fd\u505a\u4e0e\u5de5\u4f5c\u65e0\u5173\u7684\u4e8b\u201d\uff09\uff0c\u591a\u6b21\u56e0\u5de5\u4f5c\u539f\u56e0\u4e2d\u65ad\u6216\u65e0\u6cd5\u53c2\u4e0e\u76f4\u64ad\u3002\n    *   **\u7ecf\u6d4e\u8d44\u6e90**\uff1a\u672a\u77e5\u3002\u5df2\u652f\u4ed82380\u5143\u8bfe\u7a0b\u8d39\u7528\uff0c\u4f46\u672a\u63d0\u53ca\u652f\u4ed8\u538b\u529b\u6216\u8f7b\u677e\u7a0b\u5ea6\u3002\n    *   **\u7cbe\u529b\u8d44\u6e90**\uff1a\u4e2d\u7b49\u3002\u80fd\u5229\u7528\u665a\u4e0a\u548c\u788e\u7247\u65f6\u95f4\u5b8c\u6210\u4f5c\u4e1a\u548c\u770b\u56de\u653e\uff0c\u4f46\u5766\u8a00\u201c\u4eba\u4e0d\u8212\u670d\u201d\uff0c\u663e\u793a\u7cbe\u529b\u5e76\u975e\u65e0\u9650\u3002\n    *   **\u5b66\u4e60\u57fa\u7840**\uff1a\u672a\u77e5\u3002\u9500\u552e\u53cd\u9988\u201c\u8fdb\u6b65\u660e\u663e\u201d\u3001\u201c\u58f0\u97f3\u72b6\u6001\u597d\u201d\uff0c\u4f46\u7528\u6237\u81ea\u8eab\u672a\u63d0\u53ca\u76f8\u5173\u7ecf\u9a8c\u6216\u5929\u8d4b\u3002\n\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d)**\n    *   **\u6297\u538b\u6027**\uff1a\u4e2d\u7b49\u504f\u9ad8\u3002\u80fd\u5728\u4e25\u683c\u7684\u5de5\u4f5c\u7eaa\u5f8b\u4e0b\u575a\u6301\u5b66\u4e60\uff0c\u9762\u5bf9\u65f6\u95f4\u51b2\u7a81\u65f6\u6001\u5ea6\u5e73\u548c\uff08\u201c\u53ea\u80fd\u665a\u4e0a\u770b\u56de\u653e\u201d\uff09\uff0c\u672a\u8868\u73b0\u51fa\u660e\u663e\u7126\u8651\u6216\u62b1\u6028\u3002\n    *   **\u575a\u6301\u6027**\uff1a\u4e2d\u7b49\u3002\u80fd\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u6253\u5361\uff0c\u54cd\u5e94\u9500\u552e\u4e92\u52a8\uff0c\u4f46\u5b66\u4e60\u6301\u7eed\u6027\u53d7\u5916\u90e8\u65f6\u95f4\u9650\u5236\u5f71\u54cd\u5927\u3002\n    *   **\u81ea\u4e3b\u6027**\uff1a\u4e2d\u7b49\u504f\u4f4e\u3002\u5b66\u4e60\u8def\u5f84\u9ad8\u5ea6\u4f9d\u8d56\u9500\u552e\u5f15\u5bfc\u548c\u4efb\u52a1\u9a71\u52a8\uff08\u201c\u597d\u7684\u201d\u3001\u201c\u8c22\u8c22\u8001\u5e08\u201d\uff09\uff0c\u7f3a\u4e4f\u4e3b\u52a8\u89c4\u5212\u6216\u6df1\u5ea6\u63d0\u95ee\u3002\u5bf9\u8bfe\u7a0b\u65f6\u957f\uff08\u201c\u53ea\u67092\u4e2a\u6708\u201d\uff09\u63d0\u51fa\u7591\u95ee\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u6c42\u8bc1\u610f\u8bc6\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u5df2\u652f\u4ed82380\u5143\u8bfe\u7a0b\u8d39\u7528\uff08\u7528\u6237\u63d0\u53ca\u201c\u5df2\u62a5\u540d\u6210\u529f\u201d\uff09\uff0c\u652f\u4ed8\u884c\u4e3a\u5df2\u5b8c\u6210\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u6216\u914d\u5076\u610f\u89c1\uff0c\u7528\u6237\u51b3\u7b56\u8868\u73b0\u4e3a\u4e2a\u4eba\u884c\u4e3a\u3002\n*   **\u6b65\u9aa41-4\u5224\u5b9a**\uff1a\n    *   **A (\u652f\u4ed8\u80fd\u529b)**\uff1a**\u901a\u8fc7**\u3002\u5df2\u5b8c\u6210\u652f\u4ed8\u3002\n    *   **B (\u9700\u6c42\u5f3a\u5ea6)**\uff1a**\u6709\u6761\u4ef6\u901a\u8fc7**\u3002\u6709\u660e\u786e\u7684\u517c\u804c\u53d8\u73b0\u9700\u6c42\uff0c\u4f46\u53d7\u9650\u4e8e**\u6781\u5f3a\u7684\u65f6\u95f4\u7ea6\u675f**\uff0c\u9700\u6c42\u5b9e\u73b0\u8def\u5f84\u5b58\u5728\u91cd\u5927\u5ba2\u89c2\u969c\u788d\u3002\n    *   **C (\u51b3\u7b56\u81ea\u4e3b)**\uff1a**\u901a\u8fc7**\u3002\u51b3\u7b56\u8fc7\u7a0b\u672a\u53d7\u4ed6\u4eba\u660e\u663e\u5e72\u9884\u3002\n    *   **D (\u5fc3\u7406\u51c6\u5907)**\uff1a**\u9ad8\u98ce\u9669\u672a\u901a\u8fc7**\u3002\u7528\u6237\u5bf9**\u6295\u5165\u4ea7\u51fa\u6bd4\u7684\u73b0\u5b9e\u8ba4\u77e5\u4e0d\u8db3**\u3002\u9500\u552e\u6e32\u67d3\u201c\u788e\u7247\u65f6\u95f4\u5f55\u4e66\uff0c\u7efc\u5408\u6536\u5165\u5927\u6982\u57281W\u5de6\u53f3\u201d\u3001\u201c\u65f6\u85aa90-300\u201d\uff0c\u4f46\u7528\u6237\u73b0\u5b9e\u662f\u201c\u4e0a\u73ed\u65f6\u95f4\u9971\u548c\u201d\u3001\u201c\u5348\u4f11\u4ec550\u5206\u949f\u201d\uff0c**\u4e25\u91cd\u7f3a\u4e4f\u5b9e\u8df5\u6240\u9700\u7684\u65f6\u95f4\u8d44\u6e90**\uff0c\u5b58\u5728\u5de8\u5927\u671f\u671b\u843d\u5dee\u98ce\u9669\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b\uff1aT5 \u65f6\u95f4\u532e\u4e4f\u7684\u52a1\u5b9e\u63a2\u7d22\u8005**\n    *   **\u6838\u5fc3\u7279\u5f81**\uff1a\u6709\u660e\u786e\u7684\u517c\u804c\u589e\u6536\u610f\u613f\uff0c\u4f46\u88ab\u5168\u804c\u5de5\u4f5c\u4e25\u91cd\u6324\u538b\u65f6\u95f4\uff0c\u5b66\u4e60\u884c\u4e3a\u89c1\u7f1d\u63d2\u9488\uff0c\u5bf9\u53d8\u73b0\u627f\u8bfa\u654f\u611f\u4f46\u5b9e\u8df5\u6761\u4ef6\u582a\u5fe7\u3002\n    *   **\u5173\u952e\u543b\u5408\u70b9**\uff1a\u53cd\u590d\u5f3a\u8c03\u5de5\u4f5c\u65f6\u95f4\u9650\u5236\u3001\u5229\u7528\u788e\u7247\u5316\u65f6\u95f4\u5b66\u4e60\u3001\u5173\u6ce8\u53d8\u73b0\u6e20\u9053\u3001\u88ab\u52a8\u8ddf\u968f\u4efb\u52a1\u6d41\u3002\n    *   **\u504f\u5dee\u70b9**\uff1a\u7528\u6237\u60c5\u7eea\u7a33\u5b9a\u3001\u914d\u5408\u5ea6\u9ad8\uff0c\u672a\u8868\u73b0\u51faT5\u5e38\u6709\u7684\u6025\u5207\u7126\u8651\u611f\uff0c\u4f46\u65f6\u95f4\u532e\u4e4f\u8fd9\u4e00\u6838\u5fc3\u77db\u76fe\u6781\u4e3a\u7a81\u51fa\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4e2d-\u9ad8)\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u65f6\u95f4\u6781\u5ea6\u532e\u4e4f\uff0c\u4e0e\u201c\u788e\u7247\u65f6\u95f4\u9ad8\u6536\u5165\u201d\u7684\u5ba3\u4f20\u6a21\u578b\u4e25\u91cd\u51b2\u7a81\uff0c\u6781\u6709\u53ef\u80fd\u65e0\u6cd5\u5b8c\u6210\u5b66\u4e60\u6216\u63a5\u5355\u5b9e\u8df5\uff0c\u5bfc\u81f4\u201c\u65e0\u6548\u679c\u201d\u3002\n    2.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u6781\u9ad8\u98ce\u9669**\u3002\u8fd9\u662f\u6700\u6838\u5fc3\u7684\u5ba2\u89c2\u969c\u788d\u3002\u516c\u53f8\u4e25\u683c\u7ba1\u63a7\u3001\u5348\u4f11\u77ed\u3001\u5de5\u4f5c\u9971\u548c\uff0c**\u6301\u7eed\u5b66\u4e60\u4e0e\u672a\u6765\u63a5\u5355\u7684\u53ef\u884c\u6027\u6781\u4f4e**\u3002\n    3.  **\u7ecf\u6d4e\u538b\u529b**\uff1a\u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u5b9a\u4f4e\u98ce\u9669\u3002\n    4.  **\u8bfe\u7a0b\u8d28\u91cf**\uff1a\u4fe1\u606f\u4e0d\u8db3\u3002\u7528\u6237\u53cd\u9988\u201c\u5f88\u6709\u6536\u83b7\u201d\uff0c\u4f46\u672a\u6d89\u53ca\u6df1\u5ea6\u8bc4\u4ef7\u3002\n    5.  **\u9500\u552e\u8bef\u5bfc**\uff1a**\u4e2d\u98ce\u9669**\u3002\u9500\u552e\u6301\u7eed\u5f3a\u8c03\u9ad8\u65f6\u85aa\u548c\u53d8\u73b0\u673a\u4f1a\uff0c\u4f46**\u672a\u5145\u5206\u8bc4\u4f30\u5e76\u8b66\u793a\u7528\u6237\u65f6\u95f4\u9650\u5236\u5e26\u6765\u7684\u6839\u672c\u6027\u98ce\u9669**\uff0c\u5b58\u5728\u8bf1\u5bfc\u6027\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a\u4fe1\u606f\u4e0d\u8db3\u3002\n    7.  **\u7ade\u54c1\u6bd4\u8f83/\u51b2\u52a8\u6d88\u8d39**\uff1a\u4fe1\u606f\u4e0d\u8db3\u3002\u51b3\u7b56\u8fc7\u7a0b\u770b\u4f3c\u88ab\u76f4\u64ad\u9650\u65f6\u4f18\u60e0\uff08\u201c\u62a2\u5238\u201d\u3001\u201c\u53d1\u4e66\u201d\uff09\u63a8\u52a8\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\n    *   **\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u98ce\u9669\u63d0\u793a\u4e0d\u8db3**\uff1a\u9500\u552e\u5927\u91cf\u4f7f\u7528\u201c\u65f6\u85aa90-300\u201d\u3001\u201c\u7efc\u5408\u6536\u51651W\u5de6\u53f3\u201d\u3001\u201c\u5feb\u901f\u6323\u5230\u7b2c\u4e00\u6876\u91d1\u201d\u7b49\u6536\u76ca\u8bdd\u672f\uff0c\u4f46\u5bf9\u6709\u58f0\u884c\u4e1a\u9700\u8981\u6301\u7eed\u3001\u6574\u5757\u65f6\u95f4\u7ec3\u4e60\u548c\u63a5\u5355\u7684\u73b0\u5b9e\uff0c\u4ee5\u53ca\u8be5\u7528\u6237**\u6781\u7aef\u65f6\u95f4\u532e\u4e4f**\u7684\u9002\u914d\u6027\u95ee\u9898\uff0c**\u672a\u8fdb\u884c\u4efb\u4f55\u4e25\u8083\u7684\u98ce\u9669\u63d0\u793a\u548c\u9002\u914d\u6027\u8bc4\u4f30**\u3002\n    *   **\u5229\u7528\u7a00\u7f3a\u6027\u5236\u9020\u7d27\u8feb\u611f**\uff1a\u201c\u6700\u540e\u4e00\u6b21\u5f55\u97f3\u8003\u6838\u201d\u3001\u201c\u73b0\u573a\u53d1\u4f18\u60e0\u5238\u201d\u3001\u201c\u8d60\u9001\u7248\u6743\u4e66\u201d\u3001\u201c\u62a5\u540d\u901a\u9053\u5f00\u542f\u201d\u7b49\u8bdd\u672f\uff0c\u7b26\u5408\u9650\u65f6\u4fc3\u9500\u6a21\u5f0f\uff0c\u53ef\u80fd\u4fc3\u6210\u4e86\u7528\u6237\u7684\u51b2\u52a8\u51b3\u7b56\u3002\n    *   **\u5408\u89c4\u6027**\uff1a\u6d41\u7a0b\u4e0a\u5b58\u5728\u9500\u552e\u4e0e\u73ed\u4e3b\u4efb\u89d2\u8272\u5207\u6362\uff08\u201c\u9633\u9633\u5988\u59881\u201d\u4e0e\u201c\u79cb\u97f3\u6ce2\u6f9c\u201d\uff09\uff0c\u4f46\u6574\u4f53\u6d41\u7a0b\u5b8c\u6574\u3002**\u6838\u5fc3\u95ee\u9898\u5728\u4e8e\u9500\u552e\u73af\u8282\u672a\u5c65\u884c\u5145\u5206\u544a\u77e5\u4e49\u52a1\uff0c\u672a\u80fd\u6839\u636e\u7528\u6237\u5b9e\u9645\u60c5\u51b5\uff08\u65f6\u95f4\uff09\u8fdb\u884c\u8d1f\u8d23\u4efb\u7684\u5339\u914d\u5efa\u8bae\u3002**\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6\u8bc4\u4f30**\uff1a**\u4e25\u91cd\u9519\u914d**\u3002\u8be5\u8bfe\u7a0b\u9700\u8981\u5b66\u5458\u6295\u5165\u89c4\u5f8b\u65f6\u95f4\u5b66\u4e60\u3001\u7ec3\u4e60\u3001\u8bd5\u97f3\uff0c\u4e0e\u7528\u6237\u201c\u5de5\u4f5c\u65f6\u95f4\u9971\u548c\u3001\u53d7\u4e25\u683c\u7ba1\u63a7\u201d\u7684\u73b0\u5b9e\u6761\u4ef6\u5b58\u5728\u6839\u672c\u6027\u77db\u76fe\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**24\u5c0f\u65f6\u5185\u542f\u52a8\u98ce\u9669\u544a\u77e5\u4e0e\u9884\u671f\u7ba1\u7406**\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u7d27\u6025\u4ecb\u5165**\uff1a\u73ed\u4e3b\u4efb\u9700\u572824\u5c0f\u65f6\u5185\u4e3b\u52a8\u8054\u7cfb\u7528\u6237\uff0c**\u4e0d\u518d\u6cbf\u7528\u9500\u552e\u7aef\u7684\u201c\u9f13\u52b1\u201d\u548c\u201c\u753b\u997c\u201d\u8bdd\u672f**\u3002\n    2.  **\u98ce\u9669\u5766\u8bda\u6c9f\u901a**\uff1a\u660e\u786e\u6307\u51fa\uff0c\u57fa\u4e8e\u5176\u5de5\u4f5c\u65f6\u95f4\u73b0\u72b6\uff0c**\u7cfb\u7edf\u5b66\u4e60\u3001\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\u4e92\u52a8\u53ca\u540e\u7eed\u63a5\u5355\u5b9e\u8df5\u5c06\u9762\u4e34\u5de8\u5927\u6311\u6218**\u3002\u8be2\u95ee\u5176\u8ba1\u5212\u5982\u4f55\u89e3\u51b3\u65f6\u95f4\u51b2\u7a81\u95ee\u9898\u3002\n    3.  **\u6821\u6b63\u53d8\u73b0\u9884\u671f**\uff1a\u964d\u4f4e\u5176\u77ed\u671f\u53d8\u73b0\u9884\u671f\uff0c\u5f3a\u8c03\u6709\u58f0\u884c\u4e1a\u6280\u80fd\u79ef\u7d2f\u7684\u957f\u671f\u6027\u548c\u65f6\u95f4\u6295\u5165\u7684\u5fc5\u8981\u6027\u3002\u4e86\u89e3\u5176\u5b66\u4e60\u7684\u4e3b\u8981\u76ee\u6807\uff08\u662f\u957f\u671f\u5174\u8da3\u57f9\u517b\uff0c\u8fd8\u662f\u5fc5\u987b\u77ed\u671f\u89c1\u6548\uff09\u3002\n    4.  **\u63d0\u4f9b\u5907\u9009\u65b9\u6848**\uff1a\u63a2\u8ba8\u662f\u5426\u66f4\u9002\u5408**\u5b8c\u5168\u81ea\u4e3b\u5b89\u6392\u65f6\u95f4\u7684\u5f55\u64ad\u8bfe\u3001\u66f4\u8f7b\u91cf\u7684\u5165\u95e8\u4f53\u9a8c\u8bfe**\uff0c\u6216\u5efa\u8bae\u5176\u5f85\u5de5\u4f5c\u65f6\u95f4\u66f4\u5bbd\u677e\u65f6\u518d\u7cfb\u7edf\u5b66\u4e60\u3002\n    5.  **\u8bb0\u5f55\u4e0e\u4e0a\u62a5**\uff1a\u5b8c\u6574\u8bb0\u5f55\u672c\u6b21\u6c9f\u901a\uff0c\u660e\u786e\u7528\u6237\u5bf9\u65f6\u95f4\u56f0\u5883\u7684\u8ba4\u77e5\u548c\u540e\u7eed\u610f\u5411\u3002\u82e5\u7528\u6237\u575a\u6301\u5b66\u4e60\uff0c\u9700\u91cd\u70b9\u6807\u8bb0\u4e3a**\u9ad8\u9000\u8d39\u98ce\u9669\u7528\u6237**\uff0c\u540e\u7eed\u670d\u52a1\u4e2d\u6301\u7eed\u5173\u6ce8\u5176\u65f6\u95f4\u6295\u5165\u4e0e\u8fdb\u5ea6\u3002\n    6.  **\u4f26\u7406\u5e95\u7ebf**\uff1a**\u4e25\u7981\u7ee7\u7eed\u4ee5\u201c\u6324\u65f6\u95f4\u5c31\u80fd\u6210\u529f\u201d\u7684\u8bdd\u672f\u8fdb\u884c\u9f13\u52b1**\u3002\u5e94\u57fa\u4e8e\u4e8b\u5b9e\uff0c\u5e2e\u52a9\u7528\u6237\u505a\u51fa\u77e5\u60c5\u9009\u62e9\uff0c\u5fc5\u8981\u65f6\u542f\u52a8\u7eff\u8272\u9000\u8d39\u901a\u9053\uff0c\u907f\u514d\u540e\u7eed\u56e0\u201c\u65e0\u6cd5\u5b66\u4e60\u201d\u4ea7\u751f\u7ea0\u7eb7\u3002\n\n{\"core_type\": \"T5 \u65f6\u95f4\u532e\u4e4f\u7684\u52a1\u5b9e\u63a2\u7d22\u8005\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"product_match\": \"\u9519\u914d\", \"action\": \"24h\u5185\u98ce\u9669\u544a\u77e5\u4e0e\u9884\u671f\u7ba1\u7406\"}";
