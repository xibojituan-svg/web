        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID 677165900 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u653e\u98de\u7684\u5927\u773c\u775b(\u5f20\u57f9\u6e05) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u4f53\u9a8c\u8425\uff08\u610f\u5411\u9ad8\u9636\u73ed\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u4f46\u7528\u6237\u4e3b\u52a8\u8be2\u95ee\u201c\u5b66\u4e60\u7684\u8bdd\u5927\u6982\u9700\u8981\u591a\u5c11\u94b1\u5462\u201d\uff0c\u5e76\u63d0\u53ca\u201c\u624b\u5934\u8d44\u91d1\u4e0d\u8db3\u201d\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u7528\u6237\u804c\u4e1a\u4e3a\u201c\u65e0\u201d\uff0c\u65f6\u95f4\u81ea\u7531\u5ea6\u53ef\u80fd\u8f83\u9ad8\uff0c\u4f46\u672a\u660e\u786e\u8bf4\u660e\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\uff08\u6709\u660e\u786e\u76ee\u7684\u548c\u5174\u8da3\u8868\u8fbe\uff0c\u4f46\u8d44\u6e90\u5e95\u5ea7\u3001\u5bb6\u5ead\u652f\u6301\u3001\u5fc3\u7406\u5f39\u6027\u7b49\u5173\u952e\u7ef4\u5ea6\u4fe1\u606f\u7f3a\u5931\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u2b07\u4f4e**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u53d8\u73b0\u9a71\u52a8\u660e\u786e\uff0c\u4f46\u52a8\u673a\u6df7\u6742\u5174\u8da3\u4e0e\u6210\u957f**\u3002\u521d\u59cb\u76ee\u7684\u4e3a\u201c\u8d5a\u94b1\u201d\uff0c\u4f46\u540e\u7eed\u8868\u8fbe\u51fa\u5bf9\u201c\u57f9\u517b\u5174\u8da3\u7231\u597d\u201d\u3001\u201c\u63d0\u5347\u8868\u8fbe\u201d\u3001\u201c\u4eab\u53d7\u5f55\u97f3\u8fc7\u7a0b\u201d\u548c\u201c\u6210\u957f\u8fc7\u7a0b\u201d\u7684\u8ba4\u53ef\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n    > \u201c\u6765\u8fd9\u91cc\u7684\u76ee\u7684\u662f\u4ec0\u4e48\u5462\uff1f\u8d5a\u94b1\u201d\n    > \u201c\u9664\u4e86\u6536\u5165\u6211\u89c9\u5f97\u8fd9\u4efd\u5de5\u4f5c\u80fd\u8ba9\u6211\u57f9\u517b\u66f4\u591a\u7684\u5174\u8da3\u7231\u597d\u4ee5\u53ca\u8bf4\u8bdd\u8868\u8fbe\u7684\u4e00\u4e2a\u60c5\u7eea\u548c\u8bed\u6c14\u8ba9\u6211\u80fd\u66f4\u597d\u7684\u8ddf\u8eab\u8fb9\u4eba\u53bb\u804a\u5929\u4ec0\u4e48\u7684\u201d\n    > \u201c\u6211\u611f\u89c9\u5b66\u4e60\u7684\u8fc7\u7a0b\u8fd8\u662f\u5f88\u597d\u7684\u56e0\u4e3a\u6211\u89c9\u5f97\u8fd9\u4e5f\u662f\u6211\u7684\u4e00\u4e2a\u6210\u957f\u8fc7\u7a0b\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u7528\u6237\u660e\u786e\u8868\u793a\u201c\u624b\u5934\u8d44\u91d1\u4e0d\u8db3\u201d\uff0c\u5bf9\u5b66\u8d39\u654f\u611f\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u804c\u4e1a\u4e3a\u201c\u65e0\u201d\uff0c\u53ef\u80fd\u65f6\u95f4\u5145\u88d5\uff0c\u4f46\u672a\u8bc1\u5b9e\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u27a1\u4e2d**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a**\u3002\u9762\u5bf9\u6280\u672f\u95ee\u9898\uff08\u94fe\u63a5\u6253\u4e0d\u5f00\uff09\u4f1a\u4e3b\u52a8\u3001\u53cd\u590d\u8be2\u95ee\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u5d29\u6e83\u6216\u653e\u5f03\uff0c\u80fd\u6301\u7eed\u8ddf\u8fdb\u3002\u9047\u5230\u969c\u788d\u65f6\uff08\u5982\u94fe\u63a5\u95ee\u9898\uff09\u4f1a\u5bfb\u6c42\u5e2e\u52a9\uff0c\u4f46\u60c5\u7eea\u7a33\u5b9a\uff0c\u65e0\u8d1f\u9762\u5ba3\u6cc4\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n    > \u201c\u8fd9\u4e2a\u6253\u4e0d\u5f00\u201d\n    > \u201c\u90a3\u73b0\u5728\u600e\u4e48\u529e\u201d\n    > \u201c\u5e08\u59d0\u6211\u8fd9\u8fb9\u76f4\u64ad\u94fe\u63a5\u4e00\u76f4\u770b\u4e0d\u5230\u5440\uff0c\u80fd\u9ebb\u70e6\u60a8\u91cd\u65b0\u53d1\u4e00\u4e0b\u561b\u201d\n    > \u201c\u6211\u8bd5\u8fc7\u4e94\u516d\u6b21\u4e86\u201d [\u5feb\u54ed\u4e86]\uff08\u8f7b\u5fae\u6cae\u4e27\uff0c\u4f46\u4ecd\u5728\u5bfb\u6c42\u89e3\u51b3\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42\uff08\u7126\u8651\u4fdd\u969c\uff09**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u7ecf\u6d4e\u4e0d\u5b89\u5168\u611f\u4e0e\u804c\u4e1a\u8ff7\u832b**\u300222\u5c81\uff0c\u65e0\u4e1a\uff0c\u9996\u8981\u76ee\u7684\u662f\u201c\u8d5a\u94b1\u201d\uff0c\u5bf9\u201c\u624b\u5934\u8d44\u91d1\u4e0d\u8db3\u201d\u654f\u611f\uff0c\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u6709\u58f0\u6280\u80fd\u83b7\u5f97\u4e00\u4efd\u517c\u804c\u6216\u534a\u5168\u804c\u7684\u6536\u5165\u4fdd\u969c\uff0c\u4ee5\u5e94\u5bf9\u751f\u5b58\u538b\u529b\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u63d0\u4f9b\u4e00\u6761\u6e05\u6670\u3001\u53ef\u4fe1\u3001\u53ef\u89e6\u53ca\u7684\u53d8\u73b0\u8def\u5f84\u548c\u804c\u4e1a\u5b89\u5168\u611f**\u3002\u7528\u201c\u5267\u7ec4\u8d44\u6e90\u201d\u3001\u201c\u7248\u6743\u4e66\u201d\u3001\u201c\u63a5\u5355\u673a\u4f1a\u201d\u7b49\u5177\u4f53\u627f\u8bfa\uff0c\u7f13\u89e3\u5176\u5bf9\u672a\u6765\u7684\u4e0d\u786e\u5b9a\u6027\u7126\u8651\uff0c\u7ed9\u4e88\u201c\u88ab\u5e73\u53f0\u9009\u4e2d\u201d\u7684\u5f52\u5c5e\u611f\u548c\u5e0c\u671b\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2 \u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u8bba** (\u52a8\u673a\u7eaf\u5ea6\u4f4e\uff0c\u8d44\u6e90\u5e95\u5ea7\u4f4e\uff0c\u5fc3\u7406\u5f39\u6027\u4e2d\u7b49\uff0c\u53d8\u73b0\u8bc9\u6c42\u660e\u786e) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5c5e\u53cd\u5bf9\u7684\u76f4\u63a5\u8bc1\u636e\u3002\u4f46\u9700\u8b66\u60d5\u5176\u201c\u8d44\u91d1\u4e0d\u8db3\u201d\u53ef\u80fd\u6f14\u53d8\u4e3a\u501f\u8d37\u62a5\u540d\u98ce\u9669\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u672a\u53d1\u73b0\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4e2d | \u82e5\u540e\u7eed\u8bfe\u7a0b\u96be\u5ea6\u9661\u589e\uff0c\u6216\u64cd\u4f5c\u590d\u6742\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\uff09\uff0c\u5176\u201c\u4e2d\u201d\u7b49\u5fc3\u7406\u5f39\u6027\u53ef\u80fd\u4e0d\u8db3\u4ee5\u652f\u6491\uff0c\u4ea7\u751f\u632b\u8d25\u611f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u76ee\u524d\u8868\u73b0\u7a33\u5b9a\uff0c\u9047\u95ee\u9898\u4e3b\u52a8\u6c42\u89e3\uff0c\u672a\u51fa\u73b0\u81ea\u6211\u5426\u5b9a\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669\uff01** \u82e5\u62a5\u540d\u540e\u77ed\u671f\u5185\uff08\u59821-2\u4e2a\u6708\uff09\u672a\u83b7\u5f97\u9884\u671f\u7684\u63a5\u5355\u673a\u4f1a\u6216\u6536\u5165\uff0c\u6781\u6613\u56e0\u201c\u8d5a\u94b1\u201d\u76ee\u7684\u672a\u8fbe\u800c\u66b4\u6012\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c4-8\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u82e5\u63a5\u5355\u53d8\u73b0\u627f\u8bfa\u672a\u5151\u73b0\uff0c\u9000\u8d39\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u540c\u5b66\uff0c\u770b\u5230\u4f60\u586b\u2018\u8d5a\u94b1\u2019\u7684\u76ee\u7684\u4e86\uff0c\u7279\u522b\u5b9e\u5728\u3002\u54b1\u4eec\u8fd9\u884c\u786e\u5b9e\u80fd\u8d5a\u94b1\uff0c\u4f46\u5f97\u5148\u628a\u624b\u827a\u7ec3\u624e\u5b9e\u3002\u4f60\u653e\u5fc3\uff0c\u6211\u4f1a\u91cd\u70b9\u5e2e\u4f60\u76ef\u7740\u9002\u5408\u65b0\u624b\u7684\u53d8\u73b0\u8def\u5f84\u548c\u63a5\u5355\u8d44\u6e90\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u628a\u2018\u5174\u8da3\u2019\u548c\u2018\u8d5a\u94b1\u2019\u90fd\u62ff\u4e0b\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011**\u3002\u5fc5\u987b\u7d27\u5bc6\u7ed1\u5b9a\u201c\u53d8\u73b0\u201d\u76ee\u6807\uff0c\u4f18\u5148\u63d0\u4f9b\u4f4e\u95e8\u69db\u3001\u6613\u4e0a\u624b\u7684\u753b\u672c\u3001\u5bf9\u8f68\u7b49\u517c\u804c\u5c97\u4f4d\u4fe1\u606f\uff0c\u8ba9\u5176\u5feb\u901f\u770b\u5230\u201c\u53ef\u80fd\u6027\u201d\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u201c\u57f9\u517b\u5174\u8da3\u201d\u3001\u201c\u4eab\u53d7\u8fc7\u7a0b\u201d\u7684\u4fa7\u9762\u9700\u6c42\uff0c\u53ef\u9002\u5ea6\u8865\u5145 **\u3010\u5174\u8da3\u5f15\u5bfc\u5305\u3011**\uff0c\u7528\u201c\u559c\u6b22\u770b\u5c0f\u8bf4\u201d\u3001\u201c\u4eab\u53d7\u5f55\u97f3\u201d\u4f5c\u4e3a\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u7684\u60c5\u7eea\u6da6\u6ed1\u5242\uff0c\u9632\u6b62\u7eaf\u529f\u5229\u76ee\u6807\u5e26\u6765\u7684\u8fc7\u65e9\u5026\u6020\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a**\u753b\u4e0d\u5207\u5b9e\u9645\u7684\u5927\u997c**\uff08\u5982\u201c\u5b66\u5b8c\u9a6c\u4e0a\u6708\u5165\u8fc7\u4e07\u201d\uff09\u3002\u5fc5\u987b\u8fdb\u884c**\u9006\u5411\u9884\u671f\u7ba1\u7406**\uff0c\u660e\u786e\u544a\u77e5\u6280\u80fd\u79ef\u7d2f\u548c\u63a5\u5355\u9700\u8981\u65f6\u95f4\u3002\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5728\u5176\u8868\u8fbe\u201c\u8d44\u91d1\u4e0d\u8db3\u201d\u65f6\uff0c\u8fc7\u5ea6\u65bd\u538b\u6216\u5f15\u5bfc\u501f\u8d37\u3002\u9700\u8bc4\u4f30\u5176\u771f\u5b9e\u652f\u4ed8\u80fd\u529b\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u4f53\u9a8c\u8425\u671f\u95f4\u8fdb\u884c\u5927\u989d\u5347\u5355\u63a8\u9500**\u3002\u5e94\u5148\u901a\u8fc7\u5c0f\u989d\u3001\u4f4e\u95e8\u69db\u7684\u5b9e\u6218\u673a\u4f1a\uff08\u5982\u8bd5\u97f3\uff09\u5efa\u7acb\u4fe1\u4efb\uff0c\u9a8c\u8bc1\u5176\u6295\u5165\u5ea6\u548c\u80fd\u529b\u540e\uff0c\u518d\u8c28\u614e\u63a8\u8fdb\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6765\u8fd9\u91cc\u7684\u76ee\u7684\u662f\u4ec0\u4e48\u5462\uff1f\u8d5a\u94b1\u201d\n2. > \u201c\u5e08\u59d0\uff0c\u6211\u60f3\u95ee\u4e00\u4e0b\uff0c\u5c31\u662f\u8bf4\u5982\u679c\u53bb\u5b66\u4e60\u90a3\u4e2a\u8003\u8bc1\u7684\u8bdd\uff0c\u6211\u73b0\u5728\u56e0\u4e3a\u624b\u5934\u8d44\u91d1\u4e0d\u8db3\uff0c\u6211\u53ef\u4ee5\u540e\u9762\u6709\u94b1\u4e4b\u540e\u518d\u53bb\u5b66\u4e60\u5417\u201d\n3. > \u201c\u90a3\u5b66\u4e60\u7684\u8bdd\u5927\u6982\u9700\u8981\u591a\u5c11\u94b1\u5462\u201d\n4. > \u201c\u9664\u4e86\u6536\u5165\u6211\u89c9\u5f97\u8fd9\u4efd\u5de5\u4f5c\u80fd\u8ba9\u6211\u57f9\u517b\u66f4\u591a\u7684\u5174\u8da3\u7231\u597d\u4ee5\u53ca\u8bf4\u8bdd\u8868\u8fbe\u7684\u4e00\u4e2a\u60c5\u7eea\u548c\u8bed\u6c14\u8ba9\u6211\u80fd\u66f4\u597d\u7684\u8ddf\u8eab\u8fb9\u4eba\u53bb\u804a\u5929\u4ec0\u4e48\u7684\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4 \u641e\u94b1\u7ed3\u679c\u8bba\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u9700\u6c42\uff08\u7ecf\u6d4e\u4fdd\u969c\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u4e25\u683c\u7684\u9006\u5411\u9884\u671f\u7ba1\u7406 + \u63d0\u4f9b\u6e05\u6670\u3001\u4f4e\u95e8\u69db\u7684\u65e9\u671f\u53d8\u73b0\u8def\u5f84\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u8bba\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf\"}\n```";
