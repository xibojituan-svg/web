    <script>
        const markdownText = "\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e\u3002\u7f3a\u4e4f\u652f\u4ed8\u4fe1\u606f\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u3001\u5177\u4f53\u8d44\u6e90\u4e0e\u65f6\u95f4\u6295\u5165\u4fe1\u606f\u3001\u6df1\u5c42\u52a8\u673a\u4e0e\u5fc3\u7406\u72b6\u6001\u4fe1\u606f\u3002\n\n# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a**\u6a21\u7cca/\u590d\u5408\u578b**\u3002\u7528\u6237\u8868\u8fbe\u4e86\u201cABCD\u201d\u5168\u90e8\u9009\u9879\uff0c\u540e\u805a\u7126\u201c\u753b\u672c\u201d\u3001\u201c\u8bd5\u97f3\u201d\uff0c\u663e\u793a\u51fa\u5bf9\u201c\u517c\u804c\u8d5a\u94b1\u201d\u548c\u201c\u4e86\u89e3\u884c\u4e1a/\u6280\u80fd\u201d\u7684\u6df7\u5408\u5174\u8da3\u3002**\u7f3a\u4e4f\u660e\u786e\u3001\u575a\u5b9a\u7684\u6838\u5fc3\u9a71\u52a8\u529b\u4fe1\u53f7**\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u4ec5\u77e5\u4e3a\u201c\u4e0a\u73ed\u65cf\u201d\uff0c\u5177\u5907\u57fa\u7840\u5b66\u4e60\u65f6\u95f4\uff08\u80fd\u8ddf\u76f4\u64ad\u3001\u5b8c\u6210\u4f5c\u4e1a\uff09\uff0c\u4f46**\u7ecf\u6d4e\u72b6\u51b5\u3001\u53ef\u6295\u5165\u65f6\u95f4\u3001\u8bbe\u5907\u6761\u4ef6\u3001\u5b66\u4e60\u73af\u5883\u5747\u672a\u77e5**\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a**\u8868\u9762\u914d\u5408\u578b**\u3002\u7528\u6237\u5168\u7a0b\u914d\u5408\u5ea6\u9ad8\uff08\u56de\u590d\u6307\u4ee4\u3001\u5b8c\u6210\u6253\u5361\u3001\u63d0\u4ea4\u4f5c\u4e1a\uff09\uff0c\u4e92\u52a8\u79ef\u6781\u793c\u8c8c\u3002\u4f46**\u7f3a\u4e4f\u4e3b\u52a8\u63d0\u95ee\u3001\u6df1\u5ea6\u63a2\u8ba8\u548c\u60c5\u7eea\u6ce2\u52a8**\uff0c\u914d\u5408\u884c\u4e3a\u53ef\u80fd\u6e90\u4e8e\u793e\u4ea4\u793c\u8c8c\u6216\u4ece\u4f17\uff0c\u771f\u5b9e\u5b66\u4e60\u97e7\u6027\u4e0e\u6297\u538b\u80fd\u529b\u672a\u77e5\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a**\u4fe1\u606f\u7f3a\u5931**\u3002\u8bb0\u5f55\u4e2d\u672a\u63d0\u53ca\u4efb\u4f55\u652f\u4ed8\u3001\u4ef7\u683c\u3001\u8ba2\u5355\u4fe1\u606f\uff0c\u65e0\u6cd5\u5224\u65ad\u7528\u6237\u662f\u5426\u5df2\u4ed8\u8d39\u6216\u5904\u4e8e\u4f53\u9a8c\u9636\u6bb5\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u7f3a\u5931**\u3002\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u3001\u4f34\u4fa3\u6216\u8d22\u52a1\u5171\u540c\u51b3\u7b56\u8005\u7684\u8ba8\u8bba\u3002\n*   **\u6b65\u9aa41-4\u5224\u5b9a**\uff1a\u57fa\u4e8e\u73b0\u6709\u884c\u4e3a\uff0c\u7528\u6237\u8868\u73b0\u51fa**\u9ad8\u670d\u4ece\u6027\uff08B\u8f74\uff09** \u548c\u4e00\u5b9a\u7684**\u5174\u8da3\u63a2\u7d22\uff08C\u8f74\uff09**\uff0c\u4f46A\u8f74\uff08\u652f\u4ed8\u610f\u613f\uff09\u548cD\u8f74\uff08\u51b3\u7b56\u81ea\u4e3b\u6027\uff09\u4fe1\u606f\u7f3a\u5931\u3002**\u6682\u5f52\u7c7b\u4e3aBC\u578b\u7528\u6237\uff08\u914d\u5408\u63a2\u7d22\u8005\uff09**\uff0c\u4f46\u9700\u652f\u4ed8\u4fe1\u606f\u786e\u8ba4\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**\uff1a**T7 \u6d45\u5c1d\u8f84\u6b62\u4f53\u9a8c\u8005**\u3002\n    *   **\u4f9d\u636e**\uff1a\u884c\u4e3a\u9ad8\u5ea6\u914d\u5408\u6d41\u7a0b\uff08\u6253\u5361\u3001\u56de\u590d\u3001\u8ddf\u8bfe\uff09\uff0c\u5bf9\u591a\u4e2a\u65b9\u5411\uff08\u8bd5\u97f3\u3001\u753b\u672c\uff09\u8868\u73b0\u51fa\u5174\u8da3\uff0c\u4f46\u7f3a\u4e4f\u6df1\u5ea6\u6295\u5165\u548c\u660e\u786e\u76ee\u6807\u3002\u7b26\u5408T7\u201c\u6d41\u7a0b\u914d\u5408\u5ea6\u9ad8\u3001\u5174\u8da3\u5e7f\u6cdb\u4f46\u4e0d\u6df1\u5165\u3001\u6613\u88ab\u5f15\u5bfc\u201d\u7684\u7279\u5f81\u3002\n    *   **\u6b21\u9009\u539f\u578b**\uff1aT6 \u9ad8\u7126\u8651\u4ece\u4f17\u8005\uff08\u56e0\u914d\u5408\u5ea6\u9ad8\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u660e\u663e\u7126\u8651\uff09\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669**\uff1a**\u4e2d**\uff08\u5728\u652f\u4ed8\u53d1\u751f\u540e\uff09\u3002\u5f53\u524d\u914d\u5408\u5ea6\u9ad8\uff0c\u4f46\u6839\u57fa\u4e0d\u7a33\u3002\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5174\u8da3\u5728\u201c\u8bd5\u97f3\u201d\u3001\u201c\u753b\u672c\u201d\u7b49\u5177\u4f53\u73af\u8282\uff0c\u82e5\u540e\u7eed\u5b9e\u64cd\u63a5\u5355\u9047\u963b\uff0c\u6613\u611f\u5931\u671b\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b/\u51b2\u52a8\u6d88\u8d39**\uff1a**\u672a\u77e5\u98ce\u9669**\u3002**\u5173\u952e\u4fe1\u606f\u7f3a\u5931**\uff0c\u9700\u6838\u67e5\u652f\u4ed8\u80fd\u529b\u4e0e\u8bfe\u7a0b\u4ef7\u683c\u5339\u914d\u5ea6\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u4e2d\u98ce\u9669**\u3002\u4e0a\u73ed\u65cf\u8eab\u4efd\uff0c\u82e5\u540e\u7eed\u8bfe\u7a0b\u6216\u7ec3\u4e60\u5360\u7528\u8fc7\u591a\u4e1a\u4f59\u65f6\u95f4\uff0c\u53ef\u80fd\u96be\u4ee5\u575a\u6301\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u672a\u77e5\u98ce\u9669**\u3002**\u5173\u952e\u4fe1\u606f\u7f3a\u5931**\u3002\n    5.  **\u9500\u552e\u627f\u8bfa\u4e0d\u7b26**\uff1a**\u4e2d\u98ce\u9669**\u3002\u9500\u552e\u591a\u6b21\u63d0\u53ca\u201c\u65f6\u85aa100-200\u5143\u201d\u3001\u201c\u63a5\u5355\u8d44\u6e90\u201d\u3001\u201c\u7248\u6743\u4e66\u201d\u3001\u201c\u52a9\u5b66\u91d1\u201d\uff0c\u82e5\u540e\u7eed\u5151\u73b0\u6a21\u7cca\u6216\u95e8\u69db\u9ad8\uff0c\u6613\u5f15\u53d1\u4e89\u8bae\u3002\n    6.  **\u4ea7\u54c1\u4f53\u9a8c\u5dee**\uff1a**\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u4e92\u52a8\u987a\u7545\uff0c\u670d\u52a1\u54cd\u5e94\u53ca\u65f6\u3002\n    7.  **\u7ade\u54c1\u6bd4\u8f83/\u9700\u6c42\u53d8\u5316**\uff1a**\u4f4e\u98ce\u9669**\u3002\u6682\u65e0\u6b64\u4fe1\u53f7\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5408\u89c4\u60c5\u51b5**\uff1a\n    *   **\u5b58\u5728\u98ce\u9669\u70b9**\uff1a\u9500\u552e\u8bdd\u672f\u4e2d\u591a\u6b21\u4f7f\u7528\u201c**\u6bcf\u5c0f\u65f6100-200\u5143**\u201d\u3001\u201c**\u63a5\u5355\u6743\u9650**\u201d\u3001\u201c**\u5b98\u65b9\u8ba4\u8bc1**\u201d\u3001\u201c**\u559c\u9a6c\u5ae1\u7cfb\u6f14\u64ad\u5e08**\u201d\u7b49\u53ef\u80fd\u6697\u793a**\u7a33\u5b9a\u9ad8\u6536\u5165\u3001\u5b98\u65b9\u80cc\u4e66\u3001\u7279\u6743\u8eab\u4efd**\u7684\u8bcd\u6c47\uff0c**\u5b58\u5728\u5938\u5927\u5ba3\u4f20\u548c\u6a21\u7cca\u627f\u8bfa\u7684\u98ce\u9669**\u3002\n    *   **\u6d41\u7a0b\u5408\u89c4**\uff1a\u4f53\u9a8c\u8425\u6d41\u7a0b\u5b8c\u6574\uff0c\u6709\u4f5c\u4e1a\u3001\u70b9\u8bc4\u3001\u76f4\u64ad\u8ddf\u8fdb\u3002\n    *   **\u5173\u952e\u7f3a\u5931**\uff1a**\u672a\u53d1\u73b0\u4efb\u4f55\u5173\u4e8e\u8bfe\u7a0b\u4ef7\u683c\u3001\u5408\u540c\u6761\u6b3e\u3001\u9000\u8d39\u653f\u7b56\u7684\u660e\u786e\u544a\u77e5\u8bb0\u5f55**\u3002\u8fd9\u662f\u91cd\u5927\u5408\u89c4\u9690\u60a3\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d**\uff1a**\u504f\u5dee**\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u201c\u753b\u672c\u201d\u7b49\u8f7b\u6280\u80fd\u3001\u6613\u4e0a\u624b\u7684\u201c\u65e0\u58f0\u5c97\u4f4d\u201d\u5174\u8da3\uff0c\u4e0e\u6838\u5fc3\u7684\u201c\u6f14\u64ad\u57f9\u8bad\u201d\u4ea7\u54c1\u8def\u5f84\u5b58\u5728\u504f\u5dee\u3002\u9700\u5f15\u5bfc\u6216\u5339\u914d\u66f4\u7075\u6d3b\u7684\u4ea7\u54c1\u6a21\u5757\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**24h\u5185\u6838\u67e5\u652f\u4ed8\u4e0e\u5bb6\u5ead\u77e5\u60c5**\n*   **\u8be6\u7ec6\u884c\u52a8\u5efa\u8bae**\uff1a\n    1.  **\u9996\u8981\u98ce\u63a7**\uff1a\u7acb\u5373\u79c1\u804a\uff0c\u4ee5\u201c\u5b8c\u5584\u5b66\u4e60\u6863\u6848\u201d\u4e3a\u7531\uff0c\u6e29\u548c\u63a2\u8be2**\u8bfe\u7a0b\u8d39\u7528\u652f\u4ed8\u60c5\u51b5\u3001\u662f\u5426\u4e3a\u672c\u4eba\u51b3\u7b56\u3001\u5bb6\u4eba\u662f\u5426\u77e5\u6653\u652f\u6301**\u3002\u786e\u8ba4\u5176\u7ecf\u6d4e\u627f\u53d7\u529b\u4e0e\u51b3\u7b56\u72ec\u7acb\u6027\u3002\n    2.  **\u9700\u6c42\u6821\u51c6**\uff1a\u6df1\u5165\u6c9f\u901a\uff0c\u660e\u786e\u5176\u6838\u5fc3\u76ee\u6807\u662f\u201c\u5feb\u901f\u5c1d\u8bd5\u517c\u804c\u53d8\u73b0\u201d\u8fd8\u662f\u201c\u7cfb\u7edf\u5b66\u4e60\u6f14\u64ad\u6280\u80fd\u201d\u3002\u6839\u636e\u5176\u201c\u753b\u672c\u201d\u5174\u8da3\uff0c\u4ecb\u7ecd\u591a\u5143\u53d8\u73b0\u8def\u5f84\uff08\u5982\u540e\u671f\u3001\u5ba1\u542c\u7b49\uff09\uff0c\u7ba1\u7406\u5176\u5bf9\u201c\u914d\u97f3\u63a5\u5355\u201d\u7684\u5355\u4e00\u9ad8\u9884\u671f\u3002\n    3.  **\u9884\u671f\u7ba1\u7406**\uff1a\u660e\u786e\u544a\u77e5\u5b66\u4e60\u66f2\u7ebf\u3001\u53d8\u73b0\u5468\u671f\u3001\u63a5\u5355\u7ade\u4e89\u60c5\u51b5\uff0c**\u51b2\u6de1\u9500\u552e\u7aef\u8425\u9020\u7684\u201c\u5feb\u901f\u3001\u9ad8\u85aa\u3001\u6613\u5f97\u201d\u5370\u8c61**\u3002\u5f3a\u8c03\u6280\u80fd\u79ef\u7d2f\u7684\u5fc5\u8981\u6027\u3002\n    4.  **\u6301\u7eed\u89c2\u5bdf**\uff1a\u5173\u6ce8\u5176\u8fdb\u5165\u6b63\u4ef7\u8bfe\u540e\u7684\u6295\u5165\u6df1\u5ea6\uff0c\u5982\u4f5c\u4e1a\u8d28\u91cf\u3001\u63d0\u95ee\u9891\u7387\u3002\u82e5\u6301\u7eed\u505c\u7559\u5728\u201c\u6d45\u5c42\u914d\u5408\u201d\uff0c\u9700\u8b66\u60d5\u5176\u6210\u4e3a\u201c\u6c89\u9ed8\u7684\u6d41\u5931\u8005\u201d\u3002\n\n{\"core_type\": \"T7 \u6d45\u5c1d\u8f84\u6b62\u4f53\u9a8c\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"24h\u5185\u6838\u67e5\u652f\u4ed8\u4e0e\u5bb6\u5ead\u77e5\u60c5\"}";
