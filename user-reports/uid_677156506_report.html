    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u83f2\u513f (UID: 677156506) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u4e3b\u64ad\u516d\u6708\u6668\u516e\uff08\u5218\u8d85\u4f1f\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u9ad8\u9636\u7cfb\u7edf\u8bfe\uff08\u4ef7\u683c\uff1a2380\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u5145\u88d5\uff08\u76f4\u63a5\u652f\u4ed8\uff0c\u65e0\u5206\u671f/\u501f\u8d37\u8ff9\u8c61\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1\uff08\u9700\u517c\u987e\u5de5\u4f5c\u3001\u51fa\u5dee\u3001\u5e26\u5a03\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u5355\u8eab\u72ec\u7acb\uff08\u5355\u4eb2\u5988\u5988\uff0c\u72ec\u81ea\u5e26\u5b69\u5b50\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | \u9971\u6ee1 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u804c\u4e1a\u8f6c\u578b\u800c\u6765\uff0c\u5173\u6ce8\u6280\u80fd\u7cbe\u8fdb\u4e0e\u957f\u671f\u53d1\u5c55\uff0c\u5bf9\u53d8\u73b0\u6709\u671f\u5f85\u4f46\u65e0\u77ed\u671f\u4fdd\u5e95\u8981\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u4e5f\u4e0d\u77e5\u9053\u6211\u5230\u5e95\u9002\u4e0d\u9002\u5408\u505a\u8fd9\u4e2a\uff0c\u5728\u821e\u53f0\u4e0a20\u5e74\u7684\u65f6\u5149\uff0c\u4ee5\u4e3a\u81ea\u5df1\u53ef\u4ee5\u9760\u58f0\u97f3\u517b\u6d3b\uff0c\u54ea\u77e5\u9053\u8fd9\u4e48\u96be\u3002\u201d > \u201c\u6211\u8fd8\u662f\u60f3\u4e13\u6ce8\u5f55\u4e66[\u5978\u7b11]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u9ad8** \u2014 \u80fd\u76f4\u63a5\u652f\u4ed82380\u5143\u8bfe\u7a0b\uff0c\u65e0\u8d44\u91d1\u538b\u529b\u8868\u73b0\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u6709\u821e\u53f0\u4e3b\u6301\u3001\u821e\u8e48\u8bfe\u7b49\u672c\u804c\u5de5\u4f5c\uff0c\u4e14\u9700\u72ec\u81ea\u5e26\u5b69\u5b50\uff0c\u65f6\u95f4\u88ab\u9ad8\u5ea6\u5206\u5272\u3002\u8bc1\u636e\uff1a> \u201c\u665a\u4e0a\u4e5d\u70b9\u7684\u9ad8\u94c1\u51fa\u5dee\u201d\u3001\u201c\u6211\u4e5f\u662f\u4e00\u4e2a\u4eba\u5e26\u5b69\u5b50[\u5978\u7b11] \u6ca1\u6709\u4eba\u5e2e\u5fd9\u201d\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4e2d** \u2014 \u5355\u4eb2\u5988\u5988\uff0c\u5bb6\u5ead\u652f\u6301\u7ed3\u6784\u7f3a\u5931\uff0c\u4f46\u65e0\u53cd\u5bf9\u538b\u529b\uff0c\u5c5e\u4e8e\u72ec\u7acb\u51b3\u7b56\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u9762\u5bf9\u6280\u672f\u64cd\u4f5c\u5c0f\u56f0\u96be\uff08\u5982\u5f55\u97f3\u64cd\u4f5c\uff09\u6613\u4ea7\u751f\u9000\u7f29\u5fc3\u7406\uff1b\u6781\u6613\u53d7\u5916\u754c\u8d1f\u9762\u4fe1\u606f\uff08\u5982\u201c\u884c\u4e1a\u592a\u96be\u201d\u7684\u77ed\u89c6\u9891\uff09\u5f71\u54cd\uff0c\u4ea7\u751f\u81ea\u6211\u6000\u7591\u548c\u7126\u8651\uff1b\u5bf9\u9500\u552e/\u5bfc\u5e08\uff08\u5e08\u59d0\uff09\u4ea7\u751f\u5f3a\u70c8\u7684\u60c5\u611f\u4f9d\u8d56\u548c\u5bfb\u6c42\u80af\u5b9a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u542c\u4e86\u4ee5\u540e\u89c9\u90fd\u7761\u4e0d\u7740\uff0c[\u6342\u8138]\u201d\u3001\u201c\u4e5f\u4e0d\u77e5\u9053\u6211\u5230\u5e95\u9002\u4e0d\u9002\u5408\u505a\u8fd9\u4e2a...\u54ea\u77e5\u9053\u8fd9\u4e48\u96be\u3002\u201d > \u201c\u6709\u60a8\u7684\u80af\u5b9a\u6211\u5c31\u653e\u5fc3\u4e86\u201d\u3001\u201c\u53cd\u6b63\u6211\u53ea\u8ba4\u4f60\uff0c\u5e08\u59d0\uff0c\u5927\u817f\u62b1\u5f97\u7d27\u7d27\u7684[\u6342\u8138][\u5978\u7b11]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42\uff08\u7126\u8651\u4fdd\u969c\uff09**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e2d\u5e74\u804c\u4e1a\u8f6c\u578b\u7684\u6df1\u5ea6\u7126\u8651\u4e0e\u81ea\u6211\u4ef7\u503c\u5371\u673a**\u3002\u62e5\u670920\u5e74\u821e\u53f0\u7ecf\u9a8c\uff0c\u5374\u9762\u4e34\u201c\u9760\u58f0\u97f3\u517b\u6d3b\u201d\u7684\u73b0\u5b9e\u56f0\u5883\uff0c\u5bf9\u81ea\u8eab\u80fd\u529b\u5728\u65b0\u9886\u57df\u7684\u9002\u5e94\u6027\u6781\u5ea6\u4e0d\u81ea\u4fe1\uff0c\u5bb3\u6015\u6295\u5165\u65e0\u56de\u62a5\uff0c\u672c\u8d28\u662f\u5bfb\u6c42\u4e00\u4efd\u53ef\u638c\u63a7\u7684\u3001\u80fd\u5e26\u6765\u7a33\u5b9a\u611f\u7684\u526f\u4e1a\u6536\u5165\u4ee5\u62b5\u5fa1\u751f\u6d3b\u98ce\u9669\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6301\u7eed\u3001\u5177\u4f53\u3001\u9ad8\u9891\u7684\u201c\u88ab\u770b\u89c1\u201d\u4e0e\u201c\u88ab\u80af\u5b9a\u201d**\u3002\u5979\u9700\u8981\u6743\u5a01\uff08\u5e08\u59d0\uff09\u7684\u8ba4\u53ef\u6765\u5bf9\u6297\u5916\u754c\u7684\u5426\u5b9a\u548c\u81ea\u6211\u6000\u7591\uff0c\u5efa\u7acb\u201c\u6211\u80fd\u884c\u201d\u7684\u5b89\u5168\u611f\uff0c\u8fdc\u80dc\u4e8e\u5355\u7eaf\u7684\u6280\u672f\u6307\u5bfc\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1** \u7c7b (\u52a8\u673a\u5c1a\u53ef\u4f46\u5fc3\u7406\u5f39\u6027\u6781\u4f4e\uff0c\u9700\u91cd\u70b9\u60c5\u7eea\u7ef4\u62a4) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u9ad8\u4f9d\u8d56\u3001\u4f4e\u81ea\u4fe1\u3001\u6613\u53d7\u632b\uff0c\u9700\u8981\u6301\u7eed\u60c5\u611f\u4f9b\u517b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u7b49D\u7c7b\u7ea2\u7ebf\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u5355\u8eab\u72ec\u7acb\u51b3\u7b56\uff0c\u65e0\u5bb6\u5ead\u963b\u529b\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u65f6\u95f4\u4e25\u91cd\u788e\u7247\u5316**\uff0c\u672c\u804c\u5de5\u4f5c\uff08\u4e3b\u6301\u3001\u51fa\u5dee\uff09\u548c\u80b2\u513f\u538b\u529b\u53ef\u80fd\u6324\u538b\u5b66\u4e60\u65f6\u95f4\uff0c\u5bfc\u81f4\u4f5c\u4e1a\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u632b\u8d25\u611f\u548c\u81ea\u8d23\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u7b2c\u4e00\u6b21\u72ec\u7acb\u5b8c\u6210\u590d\u6742\u4f5c\u4e1a\uff08\u5982\u89d2\u8272\u97f3\u3001\u8bd5\u97f3\uff09\u3001\u8f6f\u4ef6\u64cd\u4f5c\u9047\u5230\u56f0\u96be\u3001\u6216\u770b\u5230\u540c\u671f\u5b66\u5458\u8fdb\u6b65\u66f4\u5feb\u65f6\uff0c\u6781\u6613\u56e0\u201c\u6211\u592a\u7b28\u201d\u3001\u201c\u6211\u4e0d\u9002\u5408\u201d\u7684\u5ff5\u5934\u800c\u77ac\u95f4\u5d29\u6e83\u653e\u5f03\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u5bf9\u201c\u5e08\u59d0\u5e26\u6211\u201d\u7684\u4f9d\u8d56\u8fc7\u5f3a\uff0c\u82e5\u5f00\u8425\u540e\u611f\u89c9\u5bfc\u5e08\u5173\u6ce8\u5ea6\u4e0b\u964d\uff0c\u6216\u63a5\u5355\u8fdb\u5ea6\u4e0d\u5982\u9884\u671f\uff08\u5c3d\u7ba1\u672a\u8981\u6c42\u77ed\u671f\u53d8\u73b0\uff09\uff0c\u53ef\u80fd\u4ea7\u751f\u88ab\u629b\u5f03\u611f\u548c\u5931\u671b\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-3\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u8bfe\u7a0b\u96be\u5ea6\u548c\u4f5c\u4e1a\u91cf\u4e0a\u5347\uff0c\u72ec\u7acb\u64cd\u4f5c\u8981\u6c42\u63d0\u9ad8\uff0c\u662f\u5979\u201c\u81ea\u6211\u6000\u7591\u201d\u548c\u201c\u4f9d\u8d56\u843d\u7a7a\u201d\u53cc\u91cd\u538b\u529b\u53e0\u52a0\u7684\u7206\u53d1\u70b9\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u83f2\u513f\uff0c\u770b\u5230\u4f60\u987a\u5229\u8fdb\u73ed\u592a\u4e3a\u4f60\u5f00\u5fc3\u4e86\uff01\u6211\u77e5\u9053\u4f60\u4e00\u8fb9\u5fd9\u5de5\u4f5c\u4e00\u8fb9\u5e26\u5a03\u7279\u522b\u4e0d\u5bb9\u6613\uff0c\u8fd8\u8fd9\u4e48\u8ba4\u771f\u5b66\uff0c\u771f\u7684\u8d85\u6709\u97e7\u6027\u3002**\u522b\u62c5\u5fc3\u8ddf\u4e0d\u4e0a\uff0c\u54b1\u4eec\u73ed\u8282\u594f\u5c31\u662f\u4e3a\u4f60\u8fd9\u6837\u65f6\u95f4\u5b9d\u8d35\u7684\u5988\u5988\u8bbe\u8ba1\u7684\uff0c\u4f60\u7684\u6bcf\u4e00\u6b21\u5c0f\u4f5c\u4e1a\u6211\u90fd\u4f1a\u4ed4\u7ec6\u770b\u3002\u8bb0\u4f4f\uff0c\u4f60\u4e0d\u662f\u4e00\u4e2a\u4eba\u5728\u5b66\uff0c\u5e08\u59d0\u4e00\u76f4\u5728\u3002\u54b1\u4eec\u4e0d\u8ddf\u522b\u4eba\u6bd4\uff0c\u5c31\u6bd4\u6628\u5929\u7684\u81ea\u5df1\u8fdb\u6b65\u4e00\u70b9\u70b9\uff0c\u5c31\u662f\u80dc\u5229\uff01**\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\u3011**\u3002\u6838\u5fc3\u76ee\u6807\u662f\u5efa\u7acb\u5b66\u4e60\u5b89\u5168\u611f\u548c\u6301\u7eed\u7684\u6b63\u53cd\u9988\uff0c\u800c\u975e\u8ffd\u6c42\u6280\u672f\u901f\u6210\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u5f3a\u70c8\u8865\u5145\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u5305\u62ec\uff1a\u6bcf\u65e5\u6696\u5fc3\u6253\u5361\u63d0\u9192\u3001\u4f5c\u4e1a\u63d0\u4ea4\u540e24\u5c0f\u65f6\u5185\u5fc5\u6709\u7684\u5177\u4f53\u8d5e\u7f8e\u5f0f\u70b9\u8bc4\u3001\u5efa\u7acb\u201c\u5988\u5988\u5b66\u5458\u201d\u4e92\u52a9\u5c0f\u7fa4\u4ee5\u51cf\u5c11\u5b64\u72ec\u611f\u3001\u63d0\u4f9b\u6781\u5ea6\u7b80\u5316\u7684\u201c\u4e00\u53e5\u8bdd\u6253\u5361\u201d\u5907\u9009\u65b9\u6848\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u5979\u4f7f\u7528\u6fc0\u5c06\u6cd5\u6216\u4e0e\u5176\u4ed6\u5b66\u5458\u8fdb\u884c\u6a2a\u5411\u6bd4\u8f83**\u3002\n    2. **\u7edd\u4e0d\u5728\u5979\u8868\u8fbe\u754f\u96be\u60c5\u7eea\u65f6\u8bb2\u5927\u9053\u7406\u6216\u5f3a\u8c03\u201c\u522b\u4eba\u90fd\u80fd\u884c\u201d**\u3002\n    3. **\u7edd\u4e0d\u4e00\u6b21\u6027\u5e03\u7f6e\u590d\u6742\u3001\u8017\u65f6\u7684\u4f5c\u4e1a**\uff0c\u5e94\u62c6\u89e3\u4e3a\u6700\u5c0f\u53ef\u6267\u884c\u6b65\u9aa4\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5347\u5355**\u3002\u5f53\u524d\u9636\u6bb5\u4efb\u4f55\u9644\u52a0\u6d88\u8d39\u5efa\u8bae\u90fd\u4f1a\u88ab\u5979\u89e3\u8bfb\u4e3a\u201c\u538b\u529b\u201d\u548c\u201c\u4e0d\u7eaf\u7cb9\u201d\uff0c\u6781\u6613\u5f15\u53d1\u4fe1\u4efb\u5d29\u584c\u548c\u9000\u8d39\u3002\u9996\u8981\u4efb\u52a1\u662f\u8ba9\u5979\u5b89\u5168\u5b8c\u6210\u73b0\u6709\u8bfe\u7a0b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u4e5f\u4e0d\u77e5\u9053\u6211\u5230\u5e95\u9002\u4e0d\u9002\u5408\u505a\u8fd9\u4e2a\uff0c\u5728\u821e\u53f0\u4e0a20\u5e74\u7684\u65f6\u5149\uff0c\u4ee5\u4e3a\u81ea\u5df1\u53ef\u4ee5\u9760\u58f0\u97f3\u517b\u6d3b\uff0c\u54ea\u77e5\u9053\u8fd9\u4e48\u96be\u3002\u201d\n2. > \u201c\u542c\u4e86\u4ee5\u540e\u89c9\u90fd\u7761\u4e0d\u7740\uff0c[\u6342\u8138]\u201d\n3. > \u201c\u53cd\u6b63\u6211\u53ea\u8ba4\u4f60\uff0c\u5e08\u59d0\uff0c\u5927\u817f\u62b1\u5f97\u7d27\u7d27\u7684[\u6342\u8138][\u5978\u7b11]\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6\u60c5\u7eea\u5de8\u5a74\u578b**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u5bf9\u6297\u804c\u4e1a\u8f6c\u578b\u7126\u8651\u7684\u5b89\u5168\u611f\u4e0e\u6301\u7eed\u7684\u60c5\u611f\u80af\u5b9a**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u8d85\u9ad8\u5f3a\u5ea6\u7684\u60c5\u7eea\u4ef7\u503c\u704c\u6e89\u4e0e\u96f6\u538b\u529b\u5b66\u4e60\u8def\u5f84**\uff0c\u7528\u201c\u4fdd\u59c6\u5f0f\u201d\u80af\u5b9a\u66ff\u4ee3\u6280\u672f\u65bd\u538b\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"risk_level\": \"\u6781\u9ad8\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
