    <script>
        const markdownText = "\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e\u3002\u7f3a\u4e4f\u652f\u4ed8\u4fe1\u606f\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u3001\u4e2a\u4eba\u80cc\u666f\u3001\u5b66\u4e60\u76ee\u6807\u3001\u7ecf\u6d4e\u72b6\u51b5\u7b49\u5173\u952e\u7ef4\u5ea6\u3002\n\n# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a**\u9ad8**\u3002\u7528\u6237\u6df1\u5ea6\u53c2\u4e0e\u8bfe\u7a0b\u6d3b\u52a8\uff08\u7532\u65b9\u9762\u5bf9\u9762\u3001\u6709\u58f0\u4e4b\u591c\u56e2\u4f53\u8d5b\uff09\uff0c\u79ef\u6781\u8ba8\u8bba\u4f5c\u4e1a\u3001\u8bd5\u97f3\u3001\u7ec4\u961f\u3001\u5267\u672c\u3001\u8bbe\u5907\u7b49\u6280\u672f\u7ec6\u8282\uff0c\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u5b66\u4e60\u4e0e\u5b9e\u8df5\u610f\u613f\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u8bbe\u5907\u578b\u53f7\uff08\u53ef\u80fd\u4e3a\u624b\u673a\u6216\u57fa\u7840\u8bbe\u5907\uff09\u3001\u65f6\u95f4\u6295\u5165\uff08\u9891\u7e41\u5728\u7fa4\u5185\u4e92\u52a8\uff0c\u663e\u793a\u6709\u8f83\u591a\u7a7a\u95f2\u65f6\u95f4\uff09\u3001\u7ecf\u6d4e\u72b6\u51b5\u3002**\u9700\u6838\u5b9e**\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a**\u4e2d\u9ad8**\u3002\u80fd\u4e3b\u52a8\u5e2e\u52a9\u540c\u5b66\u89e3\u7b54\u89c4\u5219\u3001\u534f\u8c03\u7ec4\u961f\uff0c\u5bf9\u7532\u65b9\u8bc4\u5ba1\u7ed3\u679c\u6709\u89c2\u5bdf\u548c\u601d\u8003\uff08\u867d\u6709\u4e2a\u522b\u8d1f\u9762\u8bc4\u4ef7\u4f46\u672a\u8fc7\u5ea6\u60c5\u7eea\u5316\uff09\uff0c\u5c55\u73b0\u51fa\u4e00\u5b9a\u7684\u793e\u7fa4\u534f\u4f5c\u548c\u6297\u538b\u80fd\u529b\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40 \u652f\u4ed8\u6838\u67e5**\uff1a**\u4fe1\u606f\u7f3a\u5931**\u3002\u8bb0\u5f55\u4e2d\u65e0\u4efb\u4f55\u652f\u4ed8\u3001\u4ef7\u683c\u3001\u4f18\u60e0\u8ba8\u8bba\u3002\n*   **\u6b65\u9aa41.5 \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u7f3a\u5931**\u3002\u8bb0\u5f55\u4e2d\u65e0\u4efb\u4f55\u6d89\u53ca\u5bb6\u4eba\u3001\u914d\u5076\u3001\u7ecf\u6d4e\u652f\u6301\u65b9\u7684\u8ba8\u8bba\u3002\n*   **\u6b65\u9aa41 \u52a8\u673a\u7eaf\u5ea6**\uff1aA (\u9ad8)\u3002\u660e\u786e\u6307\u5411\u6280\u80fd\u63d0\u5347\u4e0e\u53d8\u73b0\u5c1d\u8bd5\uff08\u8bd5\u97f3\u3001\u7532\u65b9\u8bc4\u5ba1\uff09\u3002\n*   **\u6b65\u9aa42 \u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u5b9aB/C**\u3002\u65f6\u95f4\u8d44\u6e90\u770b\u4f3c\u5145\u8db3\uff0c\u4f46\u8bbe\u5907\u3001\u7ecf\u6d4e\u57fa\u7840\u672a\u77e5\u3002\n*   **\u6b65\u9aa43 \u5fc3\u7406\u5f39\u6027**\uff1aB (\u4e2d\u9ad8)\u3002\u5177\u5907\u89e3\u51b3\u95ee\u9898\uff08\u7ec4\u961f\u3001\u89c4\u5219\u89e3\u8bfb\uff09\u548c\u793e\u7fa4\u878d\u5165\u80fd\u529b\u3002\n*   **\u7efc\u5408\u5224\u5b9a**\uff1a**\u56e0\u5173\u952e\u652f\u4ed8\u4e0e\u51b3\u7b56\u6743\u4fe1\u606f\u7f3a\u5931\uff0c\u65e0\u6cd5\u5b8c\u6210\u6700\u7ec8ABCD\u5206\u7c7b**\u3002\u73b0\u6709\u4fe1\u53f7\u504f\u5411 **A?B?**\uff08\u9ad8\u52a8\u673a\uff0c\u4e2d\u9ad8\u5f39\u6027\uff0c\u8d44\u6e90\u672a\u77e5\uff09\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**\uff1a**T3 \u52a1\u5b9e\u8fdb\u53d6\u8005**\u3002\n    *   \u4f9d\u636e\uff1a\u9ad8\u5ea6\u5173\u6ce8\u5b9e\u64cd\u3001\u8bd5\u97f3\u673a\u4f1a\u3001\u8bc4\u5ba1\u6807\u51c6\u3001\u56e2\u961f\u534f\u4f5c\uff0c\u884c\u4e3a\u6307\u5411\u660e\u786e\u7684\u7ed3\u679c\uff08\u8fc7\u5ba1\u3001\u7ec4\u961f\u5b8c\u6210\u4f5c\u54c1\uff09\uff0c\u8ba8\u8bba\u5185\u5bb9\u5177\u4f53\u52a1\u5b9e\uff0c\u60c5\u611f\u6ce2\u52a8\u5c0f\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669**\uff1a**\u4f4e**\u3002\n*   **\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a\u4f4e\u3002\u7528\u6237\u5df2\u8fdb\u5165\u5b9e\u64cd\u548c\u8bd5\u97f3\u9636\u6bb5\uff0c\u5173\u6ce8\u70b9\u5728\u4e8e\u5982\u4f55\u201c\u505a\u5f97\u66f4\u597d\u4ee5\u901a\u8fc7\u201d\uff0c\u800c\u975e\u8d28\u7591\u8bfe\u7a0b\u672c\u8eab\u4ef7\u503c\u3002\n    2.  **\u627f\u8bfa\u672a\u5151\u73b0**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u9700\u6838\u67e5\u9500\u552e\u7aef\u662f\u5426\u5bf9\u201c\u4fdd\u8fc7\u201d\u3001\u201c\u4fdd\u7b7e\u7ea6\u201d\u7b49\u6709\u8fc7\u5ea6\u627f\u8bfa\u3002\n    3.  **\u670d\u52a1\u4f53\u9a8c\u5dee**\uff1a\u4f4e\u3002\u7528\u6237\u4e3b\u52a8\u5728\u7fa4\u5185\u89e3\u7b54\u95ee\u9898\uff0c\u626e\u6f14\u4e86\u201c\u534a\u4e2a\u52a9\u6559\u201d\u89d2\u8272\uff0c\u878d\u5165\u5ea6\u6df1\u3002\n    4.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u9700\u6838\u67e5\u3002\n    5.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u9700\u6838\u67e5\u3002\n    6.  **\u65f6\u95f4\u51b2\u7a81**\uff1a\u4f4e\u3002\u5f53\u524d\u4e92\u52a8\u9891\u7e41\uff0c\u65f6\u95f4\u6295\u5165\u5ea6\u9ad8\u3002\n    7.  **\u7ade\u54c1\u6bd4\u8f83/\u8d1f\u9762\u4fe1\u606f**\uff1a\u4f4e\u3002\u672a\u63d0\u53ca\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\n    *   **\u3010\u7528\u6237\u534f\u52a9\u4ed6\u4eba\u3011**\uff1a\u7528\u6237\u591a\u6b21\u4e3b\u52a8\u3001\u8be6\u7ec6\u5730\u5411\u540c\u5b66\u89e3\u91ca\u8bfe\u7a0b\u89c4\u5219\u3001\u4f5c\u4e1a\u8981\u6c42\u3001\u7ec4\u961f\u7b56\u7565\u3001\u8bc4\u5ba1\u6807\u51c6\uff08\u59823\u670828\u65e5\u30014\u67083\u65e5\u5927\u91cf\u53d1\u8a00\uff09\u3002**\u9700\u8b66\u60d5\u5176\u8a00\u8bba\u662f\u5426\u4e0e\u5b98\u65b9\u53e3\u5f84\u5b8c\u5168\u4e00\u81f4\uff0c\u6709\u65e0\u4f20\u64ad\u9519\u8bef\u4fe1\u606f\u6216\u5f15\u53d1\u8bef\u89e3**\u3002\n    *   **\u3010\u7528\u6237\u8bc4\u4ef7\u7532\u65b9\u3011**\uff1a\u7528\u6237\u5bf9\u7532\u65b9\u8bc4\u5ba1\u7ed3\u679c\u6709\u4e2a\u4eba\u5224\u65ad\uff08\u59824\u67084\u65e5\u201c\u7b2c\u4e8c\u4e2a\u771f\u7684\u4e0d\u548b\u5730\uff0c\u4f46\u662f\u7ed9\u4ed6\u8fc7\u4e86\u201d\uff09\uff0c\u5e76\u5728\u7fa4\u5185\u516c\u5f00\u8868\u8fbe\u3002**\u9700\u5173\u6ce8\u5176\u8a00\u8bba\u662f\u5426\u5728\u5408\u89c4\u8303\u56f4\u5185\uff0c\u907f\u514d\u5f15\u53d1\u7fa4\u4f53\u6027\u8d28\u7591**\u3002\n    *   **\u3010\u4fe1\u606f\u7f3a\u5931\u3011**\uff1a**\u652f\u4ed8\u73af\u8282\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u9500\u552e\u627f\u8bfa\u7b49\u5173\u952e\u5408\u89c4\u5ba1\u67e5\u4fe1\u606f\u5b8c\u5168\u7f3a\u5931**\uff0c\u6784\u6210\u91cd\u5927\u98ce\u63a7\u76f2\u533a\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d**\uff1a**\u5339\u914d**\u3002\u7528\u6237\u884c\u4e3a\u4e0e\u201c\u7cbe\u82f1\u5b75\u5316\u201d\u3001\u201c\u7532\u65b9\u9762\u5bf9\u9762\u201d\u3001\u201c\u6709\u58f0\u4e4b\u591c\u201d\u7b49\u9ad8\u9636\u5b9e\u8df5\u4ea7\u54c1\u9ad8\u5ea6\u5951\u5408\uff0c\u53c2\u4e0e\u5ea6\u6df1\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**\u7acb\u5373\u8865\u5145\u652f\u4ed8\u4e0e\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9996\u8981\u98ce\u63a7\u52a8\u4f5c**\uff1a24\u5c0f\u65f6\u5185\uff0c\u79c1\u804a\u7528\u6237\uff0c\u4ee5\u201c\u670d\u52a1\u5347\u7ea7/\u6863\u6848\u5b8c\u5584\u201d\u4e3a\u7531\uff0c\u6e29\u548c\u6838\u67e5**\u652f\u4ed8\u4eba\u3001\u51b3\u7b56\u4eba\u3001\u5bb6\u5ead\u662f\u5426\u77e5\u60c5\u5e76\u652f\u6301**\u3002\u8fd9\u662f\u5f53\u524d\u6700\u5927\u98ce\u9669\u70b9\u3002\n    2.  **\u5173\u7cfb\u7ef4\u62a4\u4e0e\u5f15\u5bfc**\uff1a\u80af\u5b9a\u5176\u79ef\u6781\u6027\u548c\u8d21\u732e\uff0c\u53ef\u5c06\u5176\u53d1\u5c55\u4e3a\u201c\u793e\u7fa4\u9886\u8896\u201d\uff0c\u4f46\u9700\u79c1\u4e0b\u660e\u786e\u89c4\u5219\u8fb9\u754c\uff0c\u63d0\u9192\u5176\u5173\u4e8e\u7532\u65b9\u8bc4\u5ba1\u7684\u8a00\u8bba\u9700\u8c28\u614e\uff0c\u907f\u514d\u5f71\u54cd\u4ed6\u4eba\u3002\n    3.  **\u4ef7\u503c\u5f3a\u5316**\uff1a\u4e3a\u5176\u94fe\u63a5\u66f4\u591a\u5b9a\u5411\u8bd5\u97f3\u673a\u4f1a\u3001\u5185\u90e8\u6bd4\u8d5b\u4fe1\u606f\uff0c\u6ee1\u8db3\u5176\u52a1\u5b9e\u8fdb\u53d6\u7684\u9700\u6c42\u3002\n    4.  **\u6301\u7eed\u89c2\u5bdf**\uff1a\u5173\u6ce8\u5176\u7ec4\u961f\u8fdb\u5c55\u548c\u8bd5\u97f3\u7ed3\u679c\uff0c\u82e5\u591a\u6b21\u8bd5\u97f3\u672a\u8fc7\uff0c\u9700\u63d0\u524d\u4ecb\u5165\u8fdb\u884c\u5fc3\u7406\u758f\u5bfc\u548c\u6280\u5de7\u590d\u76d8\uff0c\u9632\u6b62\u52a8\u673a\u53d7\u632b\u3002\n\n{\"core_type\": \"T3 \u52a1\u5b9e\u8fdb\u53d6\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4f4e\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u7acb\u5373\u8865\u5145\u652f\u4ed8\u4e0e\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5\"}";
        document.getElementById('content').innerHTML = marked.parse(markdownText);
