        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677160808 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e - \u83ab\u8bed9(\u5218\u6587\u4e1c)\u3001\u9648\u9648(\u5218\u6587\u4e1c)\u3001\u53ef\u4e3d\u513f(\u5b54\u4ee4\u5a77) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u9a6c\u62c9\u96c5\u6709\u58f0\u6f14\u64ad\u5e08\u8bad\u7ec3\u8425 (\u4ef7\u683c\uff1a3980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u76f4\u63a5\u8be2\u95ee\u4ef7\u683c\u540e\uff0c\u9500\u552e\u5f15\u5bfc\u81f3\u76f4\u64ad\u95f4\uff0c\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u4e3b\u4e1a\u4e3a\u5a92\u4f53\u884c\u4e1a\uff0c\u538b\u529b\u5927\uff0c\u4f46\u8868\u793a\u201c\u5e73\u65f6\u5728\u9879\u76ee\u4e0a\u7684\u65f6\u5019\u6bcf\u5929\u53ef\u4ee5\u67092\u4e2a\u5c0f\u65f6\uff0c\u5468\u672b\u65f6\u95f4\u4f1a\u591a\u4e00\u4e9b\u201d\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u4fe1\u606f\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u7528\u6237\u57fa\u7840\u4fe1\u606f\uff08\u5e74\u9f84\u3001\u804c\u4e1a\u3001\u5174\u8da3\uff09\u660e\u786e\uff0c\u4f46\u5173\u952e\u51b3\u7b56\u4fe1\u606f\uff08\u652f\u4ed8\u80fd\u529b\u3001\u5bb6\u5ead\u652f\u6301\u3001\u6df1\u5c42\u52a8\u673a\uff09\u7f3a\u5931\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34\u578b**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u6765\u8bad\u7ec3\u8425\u7684\u76ee\u7684\u662f\u201c\u8d5a\u7c73/\u5174\u8da3\u201d\uff0c\u65e2\u6709\u53d8\u73b0\u9700\u6c42\uff0c\u4e5f\u8868\u73b0\u51fa\u5bf9\u5185\u5bb9\u672c\u8eab\u7684\u5174\u8da3\uff08\u559c\u6b22\u4eba\u6587\u793e\u79d1\u3001\u513f\u7ae5\u7c7b\u6709\u58f0\u4e66\uff09\u3002\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u65f6\u85aa90-300\u201d\u3001\u201c\u53d8\u73b0\u6e20\u9053\u201d\u3001\u201c\u7b2c\u4e00\u6876\u91d1\u201d\uff0c\u7528\u6237\u63a5\u53d7\u4f46\u672a\u8868\u73b0\u51fa\u72c2\u70ed\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c[\u6765\u8bad\u7ec3\u8425\u60f3\u6536\u83b7\u4ec0\u4e48\uff1f\u8d5a\u7c73/\u5174\u8da3]: \u8d5a\u7c73/\u5174\u8da3\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 46\u5c81\uff0c\u5317\u4eac\u5a92\u4f53\u4ece\u4e1a\u8005\uff0c\u804c\u4e1a\u76f8\u5bf9\u7a33\u5b9a\u3002\u4f46\u672a\u900f\u9732\u5177\u4f53\u7ecf\u6d4e\u72b6\u51b5\u548c\u652f\u4ed8\u610f\u613f\uff0c\u5bf93980\u5143\u4ef7\u683c\u672a\u8868\u9732\u538b\u529b\uff0c\u4f46\u4e5f\u672a\u7acb\u523b\u652f\u4ed8\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u4e3b\u4e1a\u538b\u529b\u5927\uff0c\u4f46\u80fd\u89c4\u5212\u51fa\u6bcf\u59292\u5c0f\u65f6\u3001\u5468\u672b\u66f4\u591a\u7684\u788e\u7247\u5316\u65f6\u95f4\u7528\u4e8e\u5b66\u4e60\u548c\u517c\u804c\u3002\u5177\u5907\u57fa\u672c\u6267\u884c\u529b\uff0c\u80fd\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u548c\u76f4\u64ad\u6253\u5361\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 **\u9ad8\u98ce\u9669\u7ef4\u5ea6**\u3002\u804a\u5929\u8bb0\u5f55\u5b8c\u5168\u672a\u63d0\u53ca\uff0c\u662f\u6f5c\u5728\u7684\u5de8\u5927\u98ce\u9669\u70b9\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u7528\u6237\u6c9f\u901a\u7b80\u6d01\u3001\u914d\u5408\u5ea6\u9ad8\uff0c\u5bf9\u9500\u552e\u53cd\u9988\uff08\u5982\u201c\u633a\u597d\u7684\uff0c\u5e78\u82e6\u60a8\u201d\uff09\u793c\u8c8c\u4e14\u79ef\u6781\u3002\u9762\u5bf9\u9500\u552e\u5bc6\u96c6\u7684\u4f5c\u4e1a\u548c\u76f4\u64ad\u5b89\u6392\uff0c\u672a\u8868\u73b0\u51fa\u4efb\u4f55\u754f\u96be\u3001\u62b1\u6028\u6216\u7126\u8651\u60c5\u7eea\uff0c\u80fd\u81ea\u4e3b\u5b89\u6392\u65f6\u95f4\uff08\u201c\u597d\uff0c\u665a\u4e00\u70b9\u201d\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4e3b\u4e1a\u7684\u538b\u529b\u8fd8\u662f\u86ee\u5927\u7684\uff0c\u4f1a\u5408\u7406\u5206\u914d\u597d\u517c\u804c\u7684\u65f6\u95f4\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 (\u7126\u8651\u4fdd\u969c)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e2d\u5e74\u804c\u4e1a\u7126\u8651\u4e0e\u6536\u5165\u8865\u5145\u9700\u6c42**\u300246\u5c81\u5a92\u4f53\u4ece\u4e1a\u8005\uff0c\u4e3b\u4e1a\u538b\u529b\u5927\uff0c\u5e0c\u671b\u901a\u8fc7\u6709\u58f0\u526f\u4e1a\u83b7\u5f97\u4e00\u4efd**\u7a33\u5b9a\u3001\u53ef\u9884\u671f\u7684\u517c\u804c\u6536\u5165**\uff0c\u4ee5\u589e\u5f3a\u7ecf\u6d4e\u5b89\u5168\u611f\u548c\u804c\u4e1a\u6297\u98ce\u9669\u80fd\u529b\u3002\u4ed6\u5e76\u975e\u8ffd\u6c42\u66b4\u5bcc\u6216\u81ea\u6211\u5b9e\u73b0\uff0c\u800c\u662f\u5bfb\u6c42\u4e00\u4efd\u53ef\u9760\u7684\u201c\u7b2c\u4e8c\u6536\u5165\u201d\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u8def\u5f84\u6e05\u6670\u3001\u7ed3\u679c\u53ef\u89c1\u201d\u7684\u786e\u5b9a\u6027**\u3002\u4ed6\u9700\u8981\u660e\u786e\u7684\u63a5\u5355\u8def\u5f84\u3001\u7a33\u5b9a\u7684\u65f6\u85aa\u6848\u4f8b\u548c\u53ef\u91cf\u5316\u7684\u6210\u957f\u9636\u68af\uff0c\u4ee5\u5bf9\u51b2\u4e3b\u4e1a\u538b\u529b\u5e26\u6765\u7684\u4e0d\u5b89\u5168\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u52a8\u673a\u4e2d\u7b49\u3001\u8d44\u6e90\u4e2d\u7b49\u3001\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u5c5e\u4e8e\u53ef\u57f9\u517b\u7684\u6f5c\u529b\u7528\u6237) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u578b** (\u6838\u5fc3\u9a71\u52a8\u662f\u201c\u8d5a\u7c73\u201d\uff0c\u4f46\u6001\u5ea6\u52a1\u5b9e\uff0c\u80fd\u63a5\u53d7\u5b66\u4e60\u8fc7\u7a0b\uff0c\u5bf9\u5feb\u901f\u53d8\u73b0\u6709\u671f\u5f85\u4f46\u672a\u6781\u7aef\u5316) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 D \u7c7b\u7194\u65ad\u7ea2\u7ebf\uff01\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u7edd\u5883\u7b49\u8868\u8ff0\u3002**\u4f46\u5bb6\u5ead\u652f\u6301\u5ea6\u4fe1\u606f\u5b8c\u5168\u7f3a\u5931\uff0c\u9700\u5728\u540e\u7eed\u8ddf\u8fdb\u4e2d\u91cd\u70b9\u6392\u67e5\u3002**\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| **\u5bb6\u5ead\u5e72\u9884\u578b** | **\u9ad8** | **\u3010\u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u98ce\u9669\u6781\u9ad8\u3011**\u300246\u5c81\u7528\u6237\u5f88\u53ef\u80fd\u6709\u5bb6\u5ead\u8d23\u4efb\uff0c\u82e5\u62a5\u540d\u8d39\u7528\uff083980\u5143\uff09\u672a\u4e0e\u5bb6\u4eba\u5145\u5206\u6c9f\u901a\uff0c\u6781\u6613\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u5bfc\u81f4\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5c1a\u53ef\uff0c\u80fd\u5229\u7528\u788e\u7247\u65f6\u95f4\uff0c\u4e3b\u4e1a\u538b\u529b\u867d\u5927\u4f46\u5df2\u89c4\u5212\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u6c9f\u901a\u7406\u6027\uff0c\u672a\u8868\u73b0\u51fa\u60c5\u7eea\u5316\u6216\u81ea\u5351\u503e\u5411\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u5bf9\u201c\u65f6\u85aa90-300\u201d\u6709\u660e\u786e\u8ba4\u77e5\u3002\u82e5\u5f00\u8425\u540e\u77ed\u671f\u5185\uff08\u59821-2\u4e2a\u6708\uff09\u65e0\u6cd5\u63a5\u89e6\u5230\u7b26\u5408\u9884\u671f\u7684\u8bd5\u97f3\u5355\u6216\u6536\u5165\uff0c**\u201c\u5b89\u5168\u9700\u6c42\u201d\u672a\u88ab\u6ee1\u8db3**\uff0c\u53ef\u80fd\u56e0\u5931\u671b\u800c\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c4-8\u5468\uff08\u201c\u6b7b\u4ea1\u8c37\u201d\u9636\u6bb5\uff09**\u3002\u5f53\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u6295\u5165\u65f6\u95f4\u4f46\u672a\u89c1\u5230\u5b9e\u8d28\u6027\u6536\u76ca\uff08\u63a5\u5355\u6216\u6536\u5165\uff09\u65f6\uff0c\u7126\u8651\u611f\u4f1a\u8fbe\u5230\u9876\u5cf0\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cX\u54e5/\u59d0\uff0c\u770b\u5230\u60a8\u5a92\u4f53\u5de5\u4f5c\u8fd9\u4e48\u5fd9\u8fd8\u80fd\u575a\u6301\u5b66\u4e60\uff0c\u771f\u7684\u5f88\u4f69\u670d\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\uff0c\u5c31\u662f\u7ed9\u50cf\u60a8\u8fd9\u6837\u6709\u4e3b\u4e1a\u3001\u60f3\u7a33\u59a5\u589e\u52a0\u4e00\u4efd\u6536\u5165\u7684\u4eba\u8bbe\u8ba1\u7684\u3002\u524d\u671f\u54b1\u4eec\u4e0d\u56fe\u5feb\uff0c\u5148\u628a\u57fa\u672c\u529f\u6253\u624e\u5b9e\uff0c\u6211\u4f1a\u5e2e\u60a8\u76ef\u7740\u9002\u5408\u60a8\u97f3\u8272\uff08\u793e\u79d1\u3001\u513f\u7ae5\u7c7b\uff09\u7684**\u7a33\u5b9a\u65f6\u85aa\u5355**\uff0c\u8ba9\u60a8\u6bcf\u5c0f\u65f6\u7684\u7ec3\u4e60\u90fd\u80fd\u770b\u5230\u5b9e\u5b9e\u5728\u5728\u7684\u56de\u62a5\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011**\u3002\u6838\u5fc3\u662f\u7f29\u77ed\u201c\u5b66\u4e60-\u53d8\u73b0\u201d\u7684\u611f\u77e5\u8def\u5f84\uff0c\u7528\u660e\u786e\u7684\u63a5\u5355\u4efb\u52a1\u548c\u65f6\u85aa\u53cd\u9988\u6765\u6301\u7eed\u6ee1\u8db3\u5176\u5b89\u5168\u9700\u6c42\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T4\u7528\u6237\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u786c\u6838\u5b9e\u5e72\u5305\u3011** \u4e2d\u7684 **\u3010\u7cbe\u51c6\u6d3e\u5355\u62e6\u622a\u3011** \u6a21\u5757\u3002\u73ed\u4e3b\u4efb\u9700\u5728\u5f00\u8425\u521d\u671f\u5c31\u4e3a\u5176\u5339\u914d1-2\u4e2a\u96be\u5ea6\u9002\u4e2d\u3001\u65f6\u85aa\u660e\u786e\u7684\u8bd5\u97f3\u673a\u4f1a\uff08\u54ea\u6015\u662f\u5c0f\u5355\uff09\uff0c\u5efa\u7acb\u65e9\u671f\u6b63\u53cd\u9988\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u8981\u753b\u957f\u671f\u5927\u997c**\u3002\u907f\u514d\u8c08\u8bba\u201c\u672a\u6765\u6708\u5165\u8fc7\u4e07\u201d\u3001\u201c\u6210\u4e3a\u5927\u4e3b\u64ad\u201d\uff0c\u805a\u7126\u5728\u201c\u672c\u5468/\u672c\u6708\u80fd\u63a5\u5230\u4ec0\u4e48\u5355\u201d\u3002\n    2. **\u7edd\u4e0d\u8981\u5ffd\u89c6\u5bb6\u5ead\u98ce\u9669**\u3002\u9996\u6b21\u6df1\u5ea6\u6c9f\u901a\u5fc5\u987b\u59d4\u5a49\u63a2\u67e5\u5bb6\u5ead\u5bf9\u6b64\u6b21\u5b66\u4e60\u6295\u5165\u7684\u77e5\u60c5\u4e0e\u652f\u6301\u60c5\u51b5\u3002\n    3. **\u7edd\u4e0d\u8981\u53ea\u7ed9\u60c5\u7eea\u4ef7\u503c\u4e0d\u7ed9\u7ed3\u679c**\u3002T4\u7528\u6237\u5bf9\u201c\u4f60\u597d\u68d2\u201d\u65e0\u611f\uff0c\u4ed6\u4eec\u9700\u8981\u7684\u662f\u201c\u8fd9\u4e2a\u5355\u5b50\u4f60\u4e2d\u4e86/\u65f6\u85aaXX\u5143\u5df2\u7ed3\u7b97\u201d\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u57fa\u7840\u73ed\u672a\u4ea7\u751f\u7a33\u5b9a\u6536\u76ca\u524d\u8fdb\u884c\u4efb\u4f55\u5927\u989d\u5347\u5355\u63a8\u4ecb**\u3002\u53ef\u8003\u8651500\u5143\u4ee5\u5185\u7684\u5de5\u5177\u3001\u8d44\u6599\u5fae\u5347\u5355\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c[\u6765\u8bad\u7ec3\u8425\u60f3\u6536\u83b7\u4ec0\u4e48\uff1f\u8d5a\u7c73/\u5174\u8da3]: \u8d5a\u7c73/\u5174\u8da3\u201d\n2. > \u201c\u4e3b\u4e1a\u7684\u538b\u529b\u8fd8\u662f\u86ee\u5927\u7684\uff0c\u4f1a\u5408\u7406\u5206\u914d\u597d\u517c\u804c\u7684\u65f6\u95f4\u201d\n3. > \u201c\u5165\u9a7b\u5e73\u53f0\u62a5\u540d\u8d39\u7528\u662f\u591a\u5c11\u5462\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4\u641e\u94b1\u7ed3\u679c\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u9700\u6c42\uff08\u5bfb\u6c42\u7a33\u5b9a\u7684\u517c\u804c\u6536\u5165\u4fdd\u969c\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5f00\u8425\u4e00\u4e2a\u6708\u5185\uff0c\u52a1\u5fc5\u901a\u8fc71-2\u6b21\u771f\u5b9e\u3001\u5c0f\u989d\u7684\u6210\u529f\u63a5\u5355\uff0c\u5efa\u7acb\u201c\u8def\u5f84\u53ef\u884c\u201d\u7684\u786e\u5b9a\u6027\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf+\u786c\u6838\u5b9e\u5e72\u5305(\u7cbe\u51c6\u6d3e\u5355\u62e6\u622a)\"}\n```";
