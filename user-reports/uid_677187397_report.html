    <script>
        const markdownText = "\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e\u3002\u7f3a\u5931\u5173\u952e\u4fe1\u606f\uff1a\u7528\u6237\u5e74\u9f84\u3001\u6027\u522b\u3001\u57ce\u5e02\u3001\u804c\u4e1a\u3001\u6536\u5165\u3001\u5bb6\u5ead\u72b6\u51b5\u3001\u5177\u4f53\u5b66\u4e60\u76ee\u6807\u3001\u8fc7\u5f80\u5b66\u4e60\u6295\u5165\u3001\u51b3\u7b56\u81ea\u4e3b\u6027\u3001\u652f\u4ed8\u80fd\u529b\u7ec6\u8282\u3002\n\n# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u4e0e\u98ce\u63a7\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d)**\n    *   **\u5174\u8da3\u9a71\u52a8**\uff1a\u4e3b\u52a8\u9605\u8bfb\u7384\u5e7b\u3001\u6b66\u4fa0\u5c0f\u8bf4\uff0c\u6709\u957f\u671f\u9605\u8bfb\u4e60\u60ef\uff08\u201c\u6709\u4e9b\u5e74\u5934\u4e86\u201d\uff09\u3002\n    *   **\u53d8\u73b0\u9a71\u52a8**\uff1a\u5bf9\u201c\u7761\u540e\u6536\u76ca\u201d\u3001\u201c\u98ce\u53e3\u53d8\u73b0\u201d\u3001\u201c\u6536\u76ca\u5feb\u4e94\u5343\u201d\u7b49\u6982\u5ff5\u6709\u79ef\u6781\u56de\u5e94\uff08\u201c\u597d\u7684\ud83d\udc4c\ud83c\udffb\u201d\u3001\u201c\u5389\u5bb3\u4e86[\u5f3a]\u201d\uff09\uff0c\u8868\u73b0\u51fa\u5bf9\u526f\u4e1a\u589e\u6536\u7684\u5174\u8da3\u3002\n    *   **\u63a2\u7d22\u9a71\u52a8**\uff1a\u5df2\u521d\u6b65\u4f7f\u7528AI\u5de5\u5177\uff08\u201c\u95ee\u95ee\u9898\u201d\u3001\u201c\u627e\u4e1c\u897f\u201d\u3001\u201cP\u56fe\u201d\uff09\uff0c\u5e76\u4e3b\u52a8\u5206\u4eab\u4e0eKimi\u7684\u5bf9\u8bdd\u94fe\u63a5\uff0c\u663e\u793a\u63a2\u7d22\u610f\u613f\u3002\n    *   **\u4fe1\u606f\u7f3a\u53e3**\uff1a\u672a\u660e\u786e\u8868\u8fbe\u6df1\u5c42\u9700\u6c42\uff08\u5982\u804c\u4e1a\u8f6c\u578b\u3001\u6280\u80fd\u7126\u8651\u3001\u81ea\u6211\u5b9e\u73b0\uff09\uff0c\u52a8\u673a\u505c\u7559\u5728\u5174\u8da3\u4e0e\u6d45\u5c42\u53d8\u73b0\u5c42\u9762\u3002\n\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4f4e-\u4e2d)**\n    *   **\u65f6\u95f4\u8d44\u6e90**\uff1a\u80fd\u914d\u5408\u76f4\u64ad\u8bfe\u65f6\u95f4\uff08\u201c\u6ca1\u95ee\u9898\u201d\uff09\uff0c\u5e76\u4e3b\u52a8\u8be2\u95ee\u76f4\u64ad\u3001\u8fdb\u7fa4\u3001\u4f5c\u4e1a\u63d0\u4ea4\uff0c\u663e\u793a\u6709\u53ef\u652f\u914d\u65f6\u95f4\u3002\n    *   **\u8ba4\u77e5\u8d44\u6e90**\uff1a\u6709\u5c0f\u8bf4\u9605\u8bfb\u57fa\u7840\uff0c\u5bf9AI\u6709\u521d\u6b65\u63a5\u89e6\u548c\u63a2\u7d22\u610f\u613f\uff0c\u5177\u5907\u4e00\u5b9a\u5b66\u4e60\u57fa\u7840\u3002\n    *   **\u7ecf\u6d4e\u8d44\u6e90**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u804c\u4e1a\u3001\u6536\u5165\uff0c\u5bf94380\u5143\u8bfe\u7a0b\u7684\u76f4\u63a5\u62a5\u540d\u884c\u4e3a\uff08\u65e0\u8bae\u4ef7\u3001\u65e0\u63d0\u95ee\uff09\u6697\u793a**\u652f\u4ed8\u80fd\u529b\u53ef\u80fd\u5c1a\u53ef\u6216\u51b3\u7b56\u8349\u7387**\uff0c\u9700\u91cd\u70b9\u6838\u67e5\u3002\n    *   **\u4fe1\u606f\u7f3a\u53e3**\uff1a\u804c\u4e1a\u3001\u6536\u5165\u3001\u73b0\u6709\u6280\u80fd\u6c34\u5e73\u3001\u53ef\u7528\u4e8e\u5b66\u4e60\u7684\u56fa\u5b9a\u65f6\u95f4/\u7cbe\u529b\u5747\u672a\u77e5\u3002\n\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d)**\n    *   **\u914d\u5408\u5ea6**\uff1a\u9ad8\u3002\u53ca\u65f6\u56de\u590d\u9500\u552e\uff0c\u4e3b\u52a8\u7d22\u8981\u8d44\u6599\uff08\u201c\u9700\u8981\uff0c\u8c22\u8c22\u5e08\u59d0\u201d\uff09\uff0c\u9075\u5b88\u6307\u4ee4\uff08\u53d1\u53e3\u4ee4\u3001\u52a0\u73ed\u4e3b\u4efb\uff09\u3002\n    *   **\u4e3b\u52a8\u6027**\uff1a\u4e2d\u3002\u4f1a\u4e3b\u52a8\u8be2\u95ee\u76f4\u64ad\u3001\u8fdb\u7fa4\u3001\u73ed\u4e3b\u4efb\u5fae\u4fe1\uff0c\u4f46\u63d0\u95ee\u591a\u56f4\u7ed5\u6d41\u7a0b\uff0c\u672a\u6df1\u5165\u63a2\u8ba8\u8bfe\u7a0b\u5185\u5bb9\u6216\u4e2a\u4eba\u89c4\u5212\u3002\n    *   **\u7a33\u5b9a\u6027**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u6c9f\u901a\u60c5\u7eea\u5e73\u7a33\uff08\u4f7f\u7528\u201c[\u73ab\u7470]\u201d\u3001\u201c\u597d\u561e\u201d\u3001\u201c\u54c8\u54c8\u54c8\u201d\uff09\uff0c\u4f46\u672a\u7ecf\u5386\u538b\u529b\u6216\u632b\u6298\u6d4b\u8bd5\uff0c\u6297\u538b\u6027\u672a\u77e5\u3002\n    *   **\u575a\u6301\u6027**\uff1a\u521d\u6b65\u663e\u793a\u3002\u8ddf\u8fdb\u76f4\u64ad\u3001\u63d0\u4ea4\u4f5c\u4e1a\u53e3\u4ee4\uff0c\u4f46\u5b66\u4e60\u5468\u671f\u77ed\uff0c\u957f\u671f\u575a\u6301\u5ea6\u5f85\u89c2\u5bdf\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u7528\u6237\u5df2\u652f\u4ed84380\u5143\u8bfe\u7a0b\u8d39\u7528\uff08\u201c\u5b9d\uff0c\u5e08\u59d0\u7ed9\u4f60\u62a2\u597d\u4e86\u4f18\u60e0\u5238...\u62a5\u540d\u540e\u8bb0\u5f97\u7ed9\u5e08\u59d0\u622a\u56fe\u201d\uff09\uff0c**\u652f\u4ed8\u52a8\u4f5c\u5df2\u5b8c\u6210**\uff0c\u8fdb\u5165\u5df2\u4ed8\u8d39\u7528\u6237\u6c60\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u5168\u7a0b\u4ec5\u7528\u6237\u4e00\u4eba\u4e0e\u9500\u552e\u6c9f\u901a\uff0c\u672a\u63d0\u53ca\u914d\u5076\u3001\u7236\u6bcd\u7b49\u7b2c\u4e09\u65b9\uff0c**\u521d\u6b65\u5224\u65ad\u4e3a\u4e2a\u4eba\u51b3\u7b56**\uff0c\u4f46\u9700\u5728\u540e\u7eed\u670d\u52a1\u4e2d\u9690\u6027\u786e\u8ba4\u3002\n*   **\u6b65\u9aa42\uff1a\u52a8\u673a-\u8d44\u6e90\u77e9\u9635\u5b9a\u4f4d**\uff1a\u5f53\u524d\u4fe1\u53f7\u6307\u5411 **B\u7c7b\uff08\u52a8\u673a\u4e2d\u7b49\uff0c\u8d44\u6e90\u4e2d\u7b49\uff09**\u3002\u7528\u6237\u6709\u660e\u786e\u5174\u8da3\u548c\u53d8\u73b0\u610f\u613f\uff0c\u5177\u5907\u57fa\u7840\u65f6\u95f4\u548c\u8ba4\u77e5\u8d44\u6e90\uff0c\u4f46\u6df1\u5c42\u52a8\u673a\u548c\u7efc\u5408\u8d44\u6e90\uff08\u5c24\u5176\u7ecf\u6d4e\u6765\u6e90\uff09\u4e0d\u6e05\u6670\uff0c\u5c5e\u4e8e\u201c\u6709\u5f85\u89c2\u5bdf\u548c\u6fc0\u6d3b\u201d\u7684\u7fa4\u4f53\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u6700\u5339\u914d\u539f\u578b\uff1aT5 \u5c1d\u9c9c\u8ddf\u98ce\u578b**\n    *   \u5bf9\u201c\u98ce\u53e3\u201d\u3001\u201cAI\u7ea2\u5229\u201d\u3001\u201c\u7761\u540e\u6536\u76ca\u201d\u7b49\u6982\u5ff5\u53cd\u5e94\u79ef\u6781\u3002\n    *   \u884c\u52a8\u4e0a\u914d\u5408\u5ea6\u9ad8\uff0c\u8ddf\u968f\u9500\u552e\u6307\u5f15\u5b8c\u6210\u62a5\u540d\uff0c\u4f46\u7f3a\u4e4f\u6df1\u5ea6\u601d\u8003\u548c\u81ea\u4e3b\u89c4\u5212\u3002\n    *   \u5206\u4eab\u4e0eKimi\u7684\u5bf9\u8bdd\uff0c\u663e\u793a\u5bf9AI\u5de5\u5177\u672c\u8eab\u6709\u63a2\u7d22\u5174\u8da3\u3002\n*   **\u6b21\u5339\u914d\u539f\u578b\uff1aT3 \u529f\u5229\u53d8\u73b0\u578b**\n    *   \u5bf9\u5b66\u5458\u6536\u76ca\u6848\u4f8b\uff08\u201c\u6536\u76ca\u5feb\u4e94\u5343\u201d\uff09\u8868\u793a\u8ba4\u53ef\uff08\u201c\u5389\u5bb3\u4e86\u201d\uff09\u3002\n    *   \u6838\u5fc3\u9a71\u52a8\u53ef\u80fd\u5305\u542b\u8f83\u5f3a\u7684\u526f\u4e1a\u589e\u6536\u8bc9\u6c42\u3002\n*   **\u6392\u9664\u539f\u578b**\uff1aT1\uff08\u65e0\u5f3a\u70c8\u7126\u8651\uff09\u3001T2\uff08\u65e0\u660e\u786e\u804c\u4e1a\u8f6c\u578b\u4fe1\u53f7\uff09\u3001T4\uff08\u65e0\u6652\u8bc1\u6652\u6210\u5c31\u884c\u4e3a\uff09\u3001T6\uff08\u60c5\u7eea\u7a33\u5b9a\uff09\u3001T7\uff08\u975e\u7f8a\u6bdb\u515a\uff09\u3001T8\uff08\u975e\u9ad8\u51c0\u503c\uff09\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u98ce\u9669\u7b49\u7ea7\uff1a\u4e2d**\n*   **\u6839\u56e0\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f (\u4e2d\u9ad8\u98ce\u9669)**\uff1a\u4f5c\u4e3aT5\u5c1d\u9c9c\u578b\uff0c\u6613\u5bf9\u201c\u901f\u6210\u201d\u3001\u201c\u9ad8\u6536\u76ca\u201d\u4ea7\u751f\u4e0d\u5207\u5b9e\u9645\u671f\u5f85\u3002\u82e5\u5b66\u4e60\u540e\u672a\u80fd\u5feb\u901f\u53d8\u73b0\u6216\u4f5c\u54c1\u53cd\u54cd\u5e73\u5e73\uff0c**\u9000\u8d39\u98ce\u9669\u663e\u8457\u5347\u9ad8**\u3002\n    2.  **\u8d44\u91d1\u538b\u529b (\u4e2d\u98ce\u9669)**\uff1a**\u652f\u4ed8\u884c\u4e3a\u5e72\u8106\uff0c\u4f46\u7ecf\u6d4e\u6765\u6e90\u4e0d\u660e**\u3002\u9700\u8b66\u60d5\u632a\u7528\u751f\u6d3b\u5fc5\u9700\u8d44\u91d1\u6216\u501f\u8d37\u652f\u4ed8\u7684\u53ef\u80fd\uff0c\u540e\u7eed\u7ecf\u6d4e\u538b\u529b\u53ef\u80fd\u5bfc\u81f4\u9000\u8d39\u3002\n    3.  **\u8bfe\u7a0b\u8d28\u91cf\u5f02\u8bae (\u4f4e\u98ce\u9669)**\uff1a\u76ee\u524d\u914d\u5408\u5ea6\u9ad8\uff0c\u672a\u63d0\u51fa\u8d28\u7591\u3002\n    4.  **\u65f6\u95f4\u51b2\u7a81 (\u4f4e\u98ce\u9669)**\uff1a\u5df2\u786e\u8ba4\u65f6\u95f4\uff0c\u4e14\u4e3b\u52a8\u8ddf\u8fdb\u3002\n    5.  **\u5bb6\u5ead\u53cd\u5bf9 (\u4e2d\u98ce\u9669)**\uff1a**\u51b3\u7b56\u6743\u672a\u7ecf\u9a8c\u8bc1**\uff0c\u5b58\u5728\u5bb6\u5ead\u5176\u4ed6\u6210\u5458\u4e0d\u77e5\u60c5\u6216\u53cd\u5bf9\u7684\u53ef\u80fd\u3002\n    6.  **\u9500\u552e\u8bef\u5bfc (\u4f4e\u98ce\u9669)**\uff1a\u8bb0\u5f55\u4e2d\u9500\u552e\u5ba3\u4f20\u5b58\u5728\u201c\u6539\u53d8\u547d\u8fd0\u201d\u3001\u201c\u7b80\u5355\u5feb\u901f\u53d8\u73b0\u201d\u7b49**\u5938\u5927\u503e\u5411**\uff0c\u4f46\u7528\u6237\u672a\u5c31\u6b64\u8ffd\u95ee\u7ec6\u8282\uff0c\u76ee\u524d\u672a\u6784\u6210\u4e89\u8bae\u70b9\u3002\n    7.  **\u7ade\u54c1\u6bd4\u8f83/\u9700\u6c42\u53d8\u5316 (\u4f4e\u98ce\u9669)**\uff1a\u6682\u65e0\u4fe1\u53f7\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u4e3b\u8981\u96f7\u533a**\uff1a\n    *   **\u5938\u5927\u5ba3\u4f20**\uff1a\u9500\u552e\u4f7f\u7528\u201c\u628a\u63e1\u98ce\u53e3\u6539\u53d8\u547d\u8fd0\u7b80\u5355\u3001\u5feb\u901f\u7684\u53d8\u73b0\u673a\u4f1a\u201d\u3001\u201c\u6539\u53d8\u81ea\u5df1\u201d\u7b49\u7edd\u5bf9\u5316\u627f\u8bfa\u7528\u8bed\uff0c**\u8fdd\u53cd\u5408\u89c4\u8981\u6c42**\u3002\n    *   **\u8bf1\u5bfc\u6d88\u8d39**\uff1a\u901a\u8fc7\u201c\u62a2\u4f18\u60e0\u5238\u201d\u3001\u201c\u5b89\u6392\u8d60\u8bfe\u201d\u3001\u201c\u8fdb\u5de5\u4f5c\u5ba4\u65b0\u624b\u6751\u201d\u7b49\u8bdd\u672f\u8425\u9020\u7a00\u7f3a\u611f\u548c\u7279\u6743\u611f\uff0c\u4fc3\u8fdb\u51b2\u52a8\u51b3\u7b56\u3002\n*   **\u5408\u89c4\u70b9**\uff1a\n    *   \u7528\u6237\u4e3b\u52a8\u8be2\u95ee\u5e76\u5b8c\u6210\u62a5\u540d\u6d41\u7a0b\uff0c\u65e0\u5f3a\u4e70\u5f3a\u5356\u8ff9\u8c61\u3002\n    *   \u63d0\u4f9b\u4e86\u90e8\u5206\u5b66\u4e60\u8d44\u6599\u548c\u76f4\u64ad\u5165\u53e3\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u6838\u5fc3\u7b56\u7565**\uff1a**\u5de9\u56fa\u5174\u8da3\uff0c\u7ba1\u7406\u9884\u671f\uff0c\u63d0\u4f9b\u5373\u65f6\u6b63\u53cd\u9988\uff0c\u9010\u6b65\u6df1\u5316\u6280\u80fd\u4e0e\u53d8\u73b0\u8ba4\u77e5\u3002**\n*   **\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u7834\u51b0\u4e0e\u4fe1\u606f\u8865\u5168**\uff1a\u9996\u6b21\u8054\u7cfb\u65f6\uff0c\u4ee5\u201c\u5b66\u4e60\u89c4\u5212\u201d\u4e3a\u7531\uff0c\u81ea\u7136\u8be2\u95ee\u804c\u4e1a\u3001\u65e5\u5e38\u5b89\u6392\u3001\u5b66\u4e60\u76ee\u6807\uff08\u662f\u5174\u8da3\u521b\u4f5c\u8fd8\u662f\u7a33\u5b9a\u526f\u4e1a\uff1f\uff09\uff0c**\u9690\u6027\u6838\u5b9e\u7ecf\u6d4e\u6765\u6e90\u4e0e\u51b3\u7b56\u72ec\u7acb\u6027**\u3002\n    2.  **\u9884\u671f\u7ba1\u7406**\uff1a\u5f3a\u8c03AI\u5199\u4f5c\u9700\u8981\u201c\u79ef\u7d2f\u548c\u7ec3\u4e60\u201d\uff0c\u5206\u4eab\u201c\u4ece\u6a21\u4eff\u5230\u521b\u4f5c\u201d\u3001\u201c\u7b2c\u4e00\u4e2a\u5c0f\u4f5c\u54c1\u8bde\u751f\u201d\u7684\u6e10\u8fdb\u6848\u4f8b\uff0c**\u5bf9\u51b2\u201c\u901f\u6210\u66b4\u5bcc\u201d\u9884\u671f**\u3002\n    3.  **\u9ad8\u9891\u6b63\u53cd\u9988**\uff1a\u5bf9\u5176\u4f5c\u4e1a\u3001\u8bfe\u5802\u4e92\u52a8\u7ed9\u4e88\u53ca\u65f6\u3001\u5177\u4f53\u7684\u8868\u626c\u3002\u5229\u7528\u5176\u201c\u5c1d\u9c9c\u201d\u7279\u6027\uff0c\u5f15\u5bfc\u4f53\u9a8cAI\u751f\u6210\u77ed\u7bc7\u3001\u89d2\u8272\u8bbe\u5b9a\u7b49**\u8da3\u5473\u6027\u5f3a\u3001\u6210\u5c31\u611f\u5feb\u7684\u73af\u8282**\u3002\n    4.  **\u793e\u7fa4\u6fc0\u6d3b**\uff1a\u5c06\u5176\u5f15\u5165\u201c\u65b0\u624b\u6751\u201d\u6216\u5c0f\u7ec4\uff0c\u901a\u8fc7\u540c\u4f34\u5206\u4eab\uff08\u5c24\u5176\u662f\u76f8\u4f3c\u80cc\u666f\u5b66\u5458\u7684\u8fdb\u6b65\uff09\u589e\u5f3a\u5f52\u5c5e\u611f\u548c\u575a\u6301\u52a8\u529b\u3002\n    5.  **\u98ce\u9669\u76d1\u63a7**\uff1a\u5173\u6ce8\u5176\u63d0\u4ea4\u4f5c\u4e1a\u7684\u79ef\u6781\u6027\u53d8\u5316\u3001\u5bf9\u6536\u76ca\u95ee\u9898\u7684\u63d0\u95ee\u9891\u7387\u3002\u82e5\u51fa\u73b0\u61c8\u6020\u6216\u6025\u5207\u8be2\u95ee\u53d8\u73b0\uff0c\u9700\u53ca\u65f6\u4ecb\u5165\uff0c\u63d0\u4f9b\u4e2a\u6027\u5316\u6307\u5bfc\u5e76\u91cd\u7533\u5b66\u4e60\u89c4\u5f8b\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**\uff1a\n    *   **\u6302\u8f7d\u4e50\u9ad8\u7ebf**\uff1a\u4f18\u5148\u63a8\u8350 **\u201c\u77ed\u7bc7\u6545\u4e8b\u521b\u4f5c\u8425\u201d** \u6216 **\u201cAI\u7f51\u6587\u5165\u95e8\u5b9e\u6218\u201d** \u7b49**\u5468\u671f\u8f83\u77ed\u3001\u6210\u679c\u53ef\u89c1**\u7684\u8f7b\u91cf\u7ea7\u4ea7\u54c1\uff0c\u5951\u5408\u5176\u5c1d\u9c9c\u5fc3\u7406\u548c\u5373\u65f6\u53cd\u9988\u9700\u6c42\u3002\n    *   **\u8fdb\u9636\u5f15\u5bfc**\uff1a\u5f85\u5176\u5b8c\u6210\u9996\u4e2a\u4f5c\u54c1\u5e76\u83b7\u5f97\u6210\u5c31\u611f\u540e\uff0c\u518d\u5f15\u5bfc\u81f3 **\u201c\u957f\u7bc7\u6545\u4e8b\u7ed3\u6784\u8bfe\u201d** \u6216 **\u201c\u591a\u5e73\u53f0\u5206\u53d1\u53d8\u73b0\u201d** \u7b49\u6df1\u5ea6\u8bfe\u7a0b\u3002\n\n{\"core_type\": \"T5 \u5c1d\u9c9c\u8ddf\u98ce\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\uff08\u80fd\u529b\u8ba4\u53ef\uff09/\u81ea\u6211\u5b9e\u73b0\uff08\u5174\u8da3\u63a2\u7d22\uff09\", \"target_product_line\": \"\u77ed\u7bc7\u6545\u4e8b\u521b\u4f5c\u8425/AI\u7f51\u6587\u5165\u95e8\u5b9e\u6218\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}";
