    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u53cc\u5b50 (UID: 677155872) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-06 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u661f\u9e7f1(\u5218\u7acb\u541b)\u3001\u83ab\u8bed9(\u5218\u6587\u4e1c)\u3001\u53ef\u4e3d\u513f(\u5b54\u4ee4\u5a77) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bad\u7ec3\u8425 (7380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u5168\u6b3e\u5145\u88d5** (\u660e\u786e\u8868\u793a\u201c\u53eb\u522b\u4eba\u7ed9\u6211\u8f6c\u8d26\u201d\uff0c\u652f\u4ed8\u8fc5\u901f) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u9ad8\u5bbd\u88d5** (\u9500\u552e\u8be2\u95ee\u4e3b\u4e1a\u538b\u529b\u4e0e\u65f6\u95f4\uff0c\u7528\u6237\u56de\u7b54\u201c\u4e00\u822c\u95ee\u9898\u4e0d\u5927\u201d\u3001\u201c\u5177\u4f53\u4ee5\u540e\u7684\u6e20\u9053\uff0c\u6839\u636e\u6e20\u9053\u9700\u6c42\u6765\u5b9a\u65f6\u95f4\u201d) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** (\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u6216\u914d\u5076\u4fe1\u606f\uff0c\u9700\u540e\u7eed\u6838\u67e5) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** (\u7528\u6237\u4e3b\u52a8\u63d0\u4f9b\u4e2a\u4eba\u4fe1\u606f\uff0c\u5e76\u79ef\u6781\u53c2\u4e0e\u4e92\u52a8) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u6765\u8bad\u7ec3\u8425\u662f\u670b\u53cb\u4ecb\u7ecd\uff0c\u5b8c\u5168\u5c0f\u767d\u201d\uff0c\u5bf9\u53d8\u73b0\u6e20\u9053\u6301\u5f00\u653e\u6001\u5ea6\uff0c\u4f46\u66f4\u5173\u6ce8\u6280\u672f\u672c\u8eab\uff08\u201c\u57fa\u672c\u529f\u662f\u5173\u952e\u201d\uff09\uff0c\u672a\u8868\u73b0\u51fa\u5bf9\u6781\u901f\u53d8\u73b0\u6216\u4fdd\u5e95\u6536\u76ca\u7684\u5f3a\u70c8\u8bc9\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4f5c\u4e3a\u4e00\u4e2a\u7eaf\u65b0\u4eba\u5c0f\u767d\uff0c\u5bf9\u4e8e\u884c\u4e1a\u4f53\u9a8c\u5b8c\u5168\u7a7a\u767d\uff0c\u4ee5\u524d\u7684\u5de5\u4f5c\u7ecf\u9a8c\u548c\u5fc3\u5f97\u5b8c\u5168\u6392\u4e0d\u4e0a\u7528\u573a\uff0c\u6240\u4ee5\u672c\u7740\u65b0\u4eba\u8ddf\u7740\u8001\u4eba\u5b66\u7684\u601d\u8def\uff0c\u4f60\u8bf4\u600e\u4e48\u641e\u5c31\u600e\u4e48\u641e\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b06\u9ad8]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u9ad8** \u2014 \u652f\u4ed87380\u5143\u8bfe\u7a0b\u8d39\u65f6\u8868\u793a\u201c\u53eb\u522b\u4eba\u7ed9\u6211\u8f6c\u8d26\u201d\uff0c\u652f\u4ed8\u6d41\u7a0b\u987a\u7545\uff0c\u65e0\u4efb\u4f55\u8d44\u91d1\u538b\u529b\u8ff9\u8c61\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u9ad8** \u2014 \u804c\u4e1a\u4e3a\u201c\u9500\u552e\u4e3b\u7ba1\u201d\uff0c\u80fd\u534f\u8c03\u65f6\u95f4\u53c2\u4e0e\u76f4\u64ad\u3001\u5b8c\u6210\u4f5c\u4e1a\uff0c\u5e76\u8868\u6001\u65f6\u95f4\u201c\u4e00\u822c\u95ee\u9898\u4e0d\u5927\u201d\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff0c\u662f**\u5173\u952e\u98ce\u9669\u4fe1\u606f\u7f3a\u53e3**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u7528\u6237\u4e3b\u52a8\u8be2\u95ee\u4efb\u52a1\u5b8c\u6210\u60c5\u51b5\u3001\u7d22\u8981\u5f55\u64ad\u3001\u79ef\u6781\u5b8c\u6210\u6253\u5361\uff0c\u5bf9\u9500\u552e\u7684\u4e13\u4e1a\u6307\u5bfc\uff08\u5982\u58f0\u97f3\u9274\u5b9a\u53cd\u9988\uff09\u8868\u793a\u611f\u8c22\u5e76\u63a5\u53d7\u3002\u8868\u73b0\u51fa\u8f83\u5f3a\u7684\u76ee\u6807\u5bfc\u5411\u3001\u6267\u884c\u529b\u548c\u72ec\u7acb\u89e3\u51b3\u95ee\u9898\u7684\u80fd\u529b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4f60\u770b\u4e00\u4e0b\uff0c\u5982\u679c\u5408\u683c\uff0c\u9ebb\u70e6\u7ed9\u4e2a\u56de\u590d\uff0c\u8c22\u8c22\uff0c\u5982\u679c\u4e0d\u5408\u683c\u8bf7\u544a\u77e5\uff01\u201d (\u4e3b\u52a8\u5bfb\u6c42\u53cd\u9988\uff0c\u6001\u5ea6\u79ef\u6781)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u4f5c\u4e3a44\u5c81\u7684\u9500\u552e\u4e3b\u7ba1\uff0c\u5176\u8fc7\u5f80\u7ecf\u9a8c\uff08\u201c\u519b\u961f\u558a\u756a\u53f7\u201d\uff09\u5728\u5168\u65b0\u9886\u57df\uff08\u6709\u58f0\u6f14\u64ad\uff09\u5931\u6548\uff0c\u4ea7\u751f\u4e86\u201c\u65b0\u4eba\u5c0f\u767d\u201d\u7684\u8eab\u4efd\u843d\u5dee\u548c\u77e5\u8bc6\u7126\u8651\u3002\u4ed6\u5bfb\u6c42\u7684\u662f\u5728\u65b0\u9886\u57df\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u548c\u8eab\u4efd\u91cd\u5efa\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u5f15\u9886\u8005\u7684\u80af\u5b9a\u4e0e\u6e05\u6670\u7684\u6210\u957f\u8def\u5f84**\u3002\u4ed6\u9700\u8981\u88ab\u4e00\u4e2a\u53ef\u4fe1\u7684\u201c\u5e08\u59d0/\u5bfc\u5e08\u201d\u5e26\u9886\uff0c\u83b7\u5f97\u4f53\u7cfb\u5316\u7684\u6280\u80fd\u63d0\u5347\u548c\u5728\u65b0\u9886\u57df\u7684\u5f52\u5c5e\u611f\u4e0e\u6210\u5c31\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u9ad8\u8d44\u6e90\u3001\u4e2d\u52a8\u673a\u3001\u9ad8\u5f39\u6027\uff0c\u5177\u5907\u826f\u597d\u5b66\u4e60\u57fa\u7840\u4e0e\u4ed8\u8d39\u80fd\u529b\uff0c\u662f\u6838\u5fc3\u57f9\u517b\u5bf9\u8c61) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u5173\u6ce8\u57fa\u672c\u529f\u3001\u6267\u884c\u529b\u5f3a\u3001\u542c\u4ece\u4e13\u4e1a\u6307\u5bfc\u3001\u76ee\u6807\u660e\u786e\u3001\u4e0d\u60c5\u7eea\u5316) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5c5e\u53cd\u5bf9\u8ff9\u8c61\u3002**\u4f46\u5bb6\u5ead\u652f\u6301\u5ea6\u4fe1\u606f\u7f3a\u5931\uff0c\u9700\u73ed\u4e3b\u4efb\u540e\u7eed\u8865\u5145\u6838\u67e5\u3002**\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | **\u4fe1\u606f\u7f3a\u5931\uff0c\u662f\u6700\u5927\u98ce\u9669\u70b9**\u3002\u9700\u786e\u8ba4\u662f\u5426\u4e3a\u5bb6\u5ead\u5171\u540c\u51b3\u7b56\uff0c\u662f\u5426\u5b58\u5728\u9690\u7792\u6d88\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u65f6\u95f4\u5145\u88d5\uff0c\u804c\u4e1a\u7a33\u5b9a\uff0c\u5b66\u4e60\u610f\u613f\u5f3a\uff0c\u56e0\u65f6\u95f4\u5d29\u76d8\u6982\u7387\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u4e0d\u6613\u56e0\u5b66\u4e60\u632b\u6298\u60c5\u7eea\u5316\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u52a8\u673a\u7eaf\u5ea6\u4e2d\u7b49\uff0c\u82e5\u5b66\u4e60\u4e2d\u671f\uff08\u5982\u7b2c3-4\u5468\uff09\u672a\u611f\u53d7\u5230\u660e\u663e\u7684\u6280\u80fd\u63d0\u5347\u6216\u63a5\u5355\u5e0c\u671b\uff0c\u53ef\u80fd\u4ea7\u751f\u8d28\u7591\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c3-4\u5468\uff08\u6280\u80fd\u5e73\u53f0\u671f/\u9996\u6b21\u63a5\u5355\u5c1d\u8bd5\u671f\uff09**\u3002\u82e5\u6b64\u65f6\u611f\u89c9\u8fdb\u6b65\u7f13\u6162\u6216\u63a5\u5355\u65e0\u95e8\uff0c\u6613\u4ea7\u751f\u201c\u6295\u5165\u4ea7\u51fa\u6bd4\u201d\u8d28\u7591\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u53cc\u5b50\u540c\u5b66\u4f60\u597d\uff0c\u770b\u5230\u4f60\u7684\u6863\u6848\u662f\u9500\u552e\u4e3b\u7ba1\uff0c\u6267\u884c\u529b\u4e00\u5b9a\u5f88\u5f3a\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u7a0b\u5c31\u50cf\u4e00\u4e2a\u65b0\u7684\u9500\u552e\u6218\u573a\uff0c\u524d\u671f\u662f\u624e\u5b9e\u7684\u57fa\u672c\u529f\u8bad\u7ec3\uff08\u5c31\u50cf\u7ec3\u8bdd\u672f\u548c\u4ea7\u54c1\u77e5\u8bc6\uff09\uff0c\u4e2d\u671f\u662f\u5b9e\u6218\u6f14\u7ec3\uff08\u6a21\u62df\u63a5\u5355\uff09\uff0c\u540e\u671f\u624d\u662f\u771f\u6b63\u5f00\u5355\u53d8\u73b0\u3002\u6211\u4f1a\u50cf\u4f60\u7684\u2018\u9500\u552e\u6559\u7ec3\u2019\u4e00\u6837\uff0c\u7ed9\u4f60\u6e05\u6670\u7684\u8def\u5f84\u548c\u53cd\u9988\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\u62ff\u4e0b\u8fd9\u4e2a\u65b0\u6280\u80fd\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** (\u5b8c\u7f8e\u5339\u914dT2\u4f4e\u8c03\u5b9e\u5e72\u578b\u9700\u6c42)\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u201c\u5c0f\u767d\u201d\u8eab\u4efd\u548c\u5bf9\u4e13\u4e1a\u5f15\u9886\u7684\u6e34\u6c42\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011** (\u6a21\u5757B)\uff0c\u63d0\u4f9b\u66f4\u6df1\u5ea6\u7684\u539f\u7406\u8bb2\u89e3\u548c1v1\u7b54\u7591\uff0c\u6ee1\u8db3\u5176\u201c\u641e\u61c2\u6838\u5fc3\u201d\u7684\u8bc9\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u53ea\u7ed9\u7a7a\u6d1e\u7684\u9f13\u52b1\uff0c\u4e0d\u7ed9\u5177\u4f53\u3001\u786c\u6838\u7684\u6539\u8fdb\u5efa\u8bae\u548c\u4efb\u52a1\u30022. \u8fc7\u5ea6\u753b\u997c\uff0c\u5f3a\u8c03\u201c\u51e0\u5929\u901f\u6210\u66b4\u5bcc\u201d\uff0c\u7834\u574f\u5176\u4fe1\u4efb\u30023. \u5ffd\u89c6\u5176\u201c\u9500\u552e\u4e3b\u7ba1\u201d\u8eab\u4efd\u80cc\u540e\u7684\u903b\u8f91\u6027\u548c\u7ed3\u679c\u5bfc\u5411\u9700\u6c42\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5f53\u5176\u5b8c\u6210\u57fa\u7840\u8bfe\u7a0b\u5e76\u53d6\u5f97\u4e00\u5b9a\u6210\u679c\u540e\uff0c\u53ef\u5411\u5176\u63a8\u8350\u9ad8\u9636\u7684\u3001\u66f4\u5177\u6311\u6218\u6027\u7684\u4e13\u9879\u8bad\u7ec3\u8425\u6216\u79c1\u8463\u4f1a\uff08\u6a21\u5757D\uff09\uff0c\u6ee1\u8db3\u5176\u8ffd\u6c42\u66f4\u9ad8\u4e13\u4e1a\u5ea6\u548c\u5708\u5c42\u5f52\u5c5e\u7684\u9700\u6c42\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u4f5c\u4e3a\u4e00\u4e2a\u7eaf\u65b0\u4eba\u5c0f\u767d\uff0c\u5bf9\u4e8e\u884c\u4e1a\u4f53\u9a8c\u5b8c\u5168\u7a7a\u767d\uff0c\u4ee5\u524d\u7684\u5de5\u4f5c\u7ecf\u9a8c\u548c\u5fc3\u5f97\u5b8c\u5168\u6392\u4e0d\u4e0a\u7528\u573a\uff0c\u6240\u4ee5\u672c\u7740\u65b0\u4eba\u8ddf\u7740\u8001\u4eba\u5b66\u7684\u601d\u8def\uff0c\u4f60\u8bf4\u600e\u4e48\u641e\u5c31\u600e\u4e48\u641e\u201d\n2. > \u201c\u6bd5\u7adf\u4e0d\u662f\u8bfb\u8bfe\u6587\u548c\u9886\u5bfc\u8bfb\u53d1\u8a00\u7a3f\u201d\n3. > \u201c\u4eca\u5929\u4e0a\u8bfe\u53ea\u6653\u5f97\u4e86\u5927\u6982\u7684\u6846\u67b6\uff0c\u8fd9\u4e2a\u662f\u4ee5\u6280\u672f\u5b9e\u8df5\u4e3a\u524d\u63d0\u7684\u4e8b\u60c5\uff0c\u57fa\u672c\u529f\u662f\u5173\u952e\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2\u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u5728\u65b0\u9886\u57df\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u6e05\u6670\u3001\u786c\u6838\u7684\u6210\u957f\u8def\u5f84\u548c\u4e13\u4e1a\u7684\u6df1\u5ea6\u6307\u5bfc\uff0c\u5e76\u5c3d\u5feb\u8865\u5145\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"maslow_need\": \"\u5c0a\u91cd\u5f52\u5c5e/\u81ea\u6211\u5b9e\u73b0\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\"}\n```";
