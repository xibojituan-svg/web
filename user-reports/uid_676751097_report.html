    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a676751097 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-30 \u81f3 2026-02-04 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6de1\u6de1\u7684\u84dd(\u9646\u4e1b\u5dcd) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66/AI\u914d\u97f3\u76f8\u5173\u8bfe\u7a0b |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u672a\u77e5\uff08\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1\uff08\u9700\u201c\u4e58\u5c0f\u5b69\u7761\u7740\u5f55\u4e86\u4e24\u904d\u201d\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u672a\u77e5\uff08\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | \u9971\u6ee1 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\uff0c\u6709\u53d8\u73b0\u671f\u5f85\u4f46\u66f4\u5173\u6ce8\u6280\u80fd\u7cbe\u8fdb\u4e0e\u793e\u7fa4\u53c2\u4e0e\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u4eec\u8fd9\u4e2a\u7fa4\u8981\u6d3b\u8dc3\u8d77\u6765...\u8981\u4e0d\u7136\u8bbe\u5907\u4e70\u4e86\uff0c\u540e\u671f\u62a5\u4e86\uff0c\u7d22\u5bfc\u4e2d\u4e66\u4e86\uff0c\u4ed6\u90fd\u4e0d\u77e5\u9053\u627e\u8c01\u642d\u201d (\u5173\u6ce8\u793e\u7fa4\u751f\u6001\u4e0e\u534f\u4f5c)\n  > \u201c\u542c\u6c6a\u6db5\u8fd9\u4e48\u8bf4\u6211\u4eec\u8fd9\u884c\u524d\u666f\u53ef\u4ee5\u54e6\u201d (\u5173\u6ce8\u884c\u4e1a\u524d\u666f\uff0c\u975e\u77ed\u671f\u66b4\u5bcc)\n  > \u201c\u73ed\u73ed\u6211\u60f3\u53c2\u4e0e\u4f60\u7684\u65b0\u4e66\uff0c\u6709\u9002\u5408\u6211\u8fd9\u6837\u65b0\u624b\u7684\u89d2\u8272\u5417\uff1f\u201d (\u4e3b\u52a8\u5bfb\u6c42\u5b9e\u8df5\u673a\u4f1a)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 \u62e5\u6709\u82f9\u679cM4\u82af\u7247\u7535\u8111\uff0c\u613f\u610f\u4e3a\u5b66\u4e60\u82b1\u94b1\u88c5\u53cc\u7cfb\u7edf\uff0c\u4f46\u672a\u63d0\u53ca\u9ad8\u989d\u8bbe\u5907\u6216\u5206\u671f\u4ed8\u6b3e\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 \u5b9d\u5988\u8eab\u4efd\uff0c\u65f6\u95f4\u788e\u7247\u5316\uff08\u201c\u4e58\u5c0f\u5b69\u7761\u7740\u5f55\u4e86\u4e24\u904d\u201d\uff09\uff0c\u4f46\u80fd\u575a\u6301\u5b66\u4e60\u3001\u53c2\u4e0e\u8ba8\u8bba\u548c\u62db\u52df\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u672a\u77e5] \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\uff0c\u9047\u5230\u6280\u672f\u96be\u9898\uff08\u82f9\u679c\u7cfb\u7edf\u63d2\u4ef6\u5b89\u88c5\uff09\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff08\u82b1\u94b1\u88c5\u53cc\u7cfb\u7edf\uff09\uff0c\u5e76\u79ef\u6781\u4e0e\u73ed\u4e3b\u4efb\u6c9f\u901a\uff0c\u65e0\u62b1\u6028\u6216\u60c5\u7eea\u5d29\u6e83\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u7cfb\u7edf\u88c5\u597d\u4e86\uff0c\u53ef\u4ee5\u5e2e\u5fd9\u770b\u770b\u53ef\u4ee5\u7528\u5417\u201d (\u9047\u5230\u95ee\u9898\u4e3b\u52a8\u89e3\u51b3\u5e76\u8ddf\u8fdb)\n  > \u201c\u6211\u77e5\u9053\u81ea\u5df1\u7684\u539f\u56e0\uff0c\u4f46\u76ee\u524d\u53ea\u80fd\u9760\u81ea\u5df1\u591a\u7ec3\uff0c\u591a\u542c\u3002\u201d (\u81ea\u6211\u8ba4\u77e5\u6e05\u6670\uff0c\u5f52\u56e0\u4e8e\u81ea\u8eab\u52aa\u529b)\n  > \u9762\u5bf9\u590d\u6742\u7684\u6280\u672f\u95ee\u9898\uff08\u82f9\u679c\u7cfb\u7edf\u517c\u5bb9\u6027\uff09\uff0c\u80fd\u6e05\u6670\u8868\u8ff0\u95ee\u9898\u5e76\u4e0e\u6280\u672f\u3001\u73ed\u4e3b\u4efb\u53cd\u590d\u6c9f\u901a\uff0c\u903b\u8f91\u6e05\u6670\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42 / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u793e\u7fa4\u5f52\u5c5e\u611f\u548c\u56e2\u961f\u534f\u4f5c\u6709\u5f3a\u70c8\u6e34\u671b\uff0c\u5bb3\u6015\u88ab\u5b64\u7acb\u6216\u65e0\u6cd5\u878d\u5165\u5708\u5b50\uff08\u201c\u6211\u4eec\u8fd9\u4e2a\u7fa4\u8981\u6d3b\u8dc3\u8d77\u6765...\u4ed6\u90fd\u4e0d\u77e5\u9053\u627e\u8c01\u642d\u201d\uff09\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u8d4b\u4e88\u5176\u793e\u7fa4\u5efa\u8bbe\u8005\u7684\u8eab\u4efd\u8ba4\u540c\u4e0e\u9886\u5bfc\u6743**\u3002\u5979\u6e34\u671b\u88ab\u770b\u89c1\u3001\u88ab\u9700\u8981\uff0c\u5e76\u80fd\u5728\u96c6\u4f53\u4e2d\u53d1\u6325\u4ef7\u503c\uff0c\u83b7\u5f97\u5c0a\u91cd\u548c\u5f52\u5c5e\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T7 \u72c2\u70ed\u6b7b\u5fe0\u7c89** (\u9ad8\u590d\u8d2d\u6f5c\u529b) \u4e0e **T1-A \u5bfc\u6f14\u578b\u9886\u8896** (\u6838\u5fc3\u5229\u6da6) \u7684 **\u6df7\u5408\u4f533\u53f7\u8fdb\u5316\u524d\u4f53** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u96f6\u4e92\u52a8\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u672a\u63d0\u53ca\u5bb6\u5ead\u77db\u76fe\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4e2d | \u4e3b\u8981\u98ce\u9669\u5728\u4e8e\u6280\u672f\u95ee\u9898\uff08\u5982\u82f9\u679c\u7cfb\u7edf\u517c\u5bb9\u6027\uff09\u82e5\u957f\u671f\u65e0\u6cd5\u89e3\u51b3\uff0c\u53ef\u80fd\u5bfc\u81f4\u5176\u53c2\u4e0e\u611f\u548c\u6210\u5c31\u611f\u53d7\u632b\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u4e0d\u6613\u56e0\u632b\u6298\u653e\u5f03\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u52a8\u673a\u975e\u7eaf\u53d8\u73b0\u9a71\u52a8\uff0c\u66f4\u5173\u6ce8\u8fc7\u7a0b\u4e0e\u793e\u7fa4\uff0c\u5bf9\u77ed\u671f\u6536\u76ca\u843d\u5dee\u5bb9\u5fcd\u5ea6\u8f83\u9ad8\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe\u540e\u7b2c3-4\u5468\uff0c\u5f53\u6280\u672f\u74f6\u9888\uff08\u5982\u63d2\u4ef6\u5b89\u88c5\u3001\u5e72\u97f3\u5904\u7406\uff09\u6301\u7eed\u65e0\u6cd5\u7a81\u7834\uff0c\u4e14\u793e\u7fa4\u4e92\u52a8\u672a\u8fbe\u5176\u9884\u671f\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6211\u770b\u4f60\u5728\u7fa4\u91cc\u7279\u522b\u70ed\u5fc3\uff0c\u6280\u672f\u95ee\u9898\u4e5f\u94bb\u7814\u5f97\u5f88\u900f\uff0c\u662f\u54b1\u4eec\u73ed\u96be\u5f97\u7684\u2018\u6280\u672f+\u6c1b\u56f4\u2019\u53cc\u6599\u62c5\u5f53\u3002\u4ee5\u540e\u73ed\u91cc\u6709\u5565\u9700\u8981\u534f\u8c03\u7684\uff0c\u6216\u8005\u4f60\u60f3\u7ec4\u7ec7\u4e2a\u5bf9\u620f\u5c0f\u5206\u961f\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u5168\u529b\u652f\u6301\u4f60\u5f53\u2018\u5e26\u5934\u5927\u59d0\u2019\uff01\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf**\u3011\u3002\u5979\u5177\u5907T1-A\u7684\u7edf\u7b79\u6f5c\u8d28\u548cT7\u7684\u793e\u7fa4\u9ecf\u6027\uff0c\u5e94\u5f15\u5bfc\u5176\u4ece\u201c\u5b66\u5458\u201d\u5411\u201c\u73ed\u59d4/\u5236\u4f5c\u4eba\u52a9\u7406\u201d\u89d2\u8272\u8fdb\u5316\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743(B\u6a21\u5757)**\u3011+\u3010**\u540c\u9891\u95f2\u804a\u4e0e\u8d5b\u9a6c\u7ed1\u5b9a\u6cd5(D\u6a21\u5757)**\u3011\u3002\u63d0\u4f9b\u6280\u672f\u6df1\u5ea6\u652f\u6301\u7684\u540c\u65f6\uff0c\u8d4b\u4e88\u5176\u7ec4\u7ec7\u6d3b\u52a8\u3001\u62db\u52df\u961f\u53cb\u7684\u6743\u529b\uff0c\u6ee1\u8db3\u5176\u5c0a\u91cd\u4e0e\u5f52\u5c5e\u9700\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5ffd\u89c6\u5979\u7684\u6280\u672f\u95ee\u9898\uff08\u5982\u82f9\u679c\u63d2\u4ef6\u517c\u5bb9\u6027\uff09\uff0c\u6216\u7528\u5b98\u65b9\u8bdd\u672f\u6577\u884d\u3002\u8fd9\u4f1a\u4e25\u91cd\u6253\u51fb\u5176\u70ed\u60c5\u548c\u4fe1\u4efb\u611f\u3002\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5728\u5979\u4e3b\u52a8\u7ec4\u7ec7\u6d3b\u52a8\u6216\u5e2e\u52a9\u540c\u5b66\u65f6\uff0c\u7528\u7ba1\u7406\u8005\u7684\u59ff\u6001\u8fdb\u884c\u5e72\u9884\u6216\u5426\u5b9a\u3002\u5fc5\u987b\u201c\u9000\u5c45\u5e55\u540e\u5f53\u653f\u59d4\u7684\u6367\u54cf\u201d\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5f53\u5979\u6280\u672f\u80fd\u529b\u63d0\u5347\u3001\u793e\u7fa4\u5f71\u54cd\u529b\u5efa\u7acb\u540e\uff0c\u5bf9\u9ad8\u9636\u8bbe\u5907\u3001\u540e\u671f\u8bfe\u7a0b\u3001\u5236\u4f5c\u4eba\u79c1\u6559\u8bfe\u6709\u6781\u9ad8\u4ed8\u8d39\u610f\u613f\u548c\u590d\u8d2d\u6f5c\u529b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u6211\u4eec\u8fd9\u4e2a\u7fa4\u8981\u6d3b\u8dc3\u8d77\u6765...\u8981\u4e0d\u7136\u8bbe\u5907\u4e70\u4e86\uff0c\u540e\u671f\u62a5\u4e86\uff0c\u7d22\u5bfc\u4e2d\u4e66\u4e86\uff0c\u4ed6\u90fd\u4e0d\u77e5\u9053\u627e\u8c01\u642d**\u201d **(\u6838\u5fc3\u8bc1\u636e\uff1a\u5f3a\u70c8\u7684\u793e\u7fa4\u5efa\u8bbe\u8005\u5fc3\u6001\u4e0e\u8d23\u4efb\u611f)**\n2. > \u201c**\u73ed\u73ed\u6211\u60f3\u53c2\u4e0e\u4f60\u7684\u65b0\u4e66\uff0c\u6709\u9002\u5408\u6211\u8fd9\u6837\u65b0\u624b\u7684\u89d2\u8272\u5417\uff1f**\u201d **(\u6838\u5fc3\u8bc1\u636e\uff1a\u4e3b\u52a8\u5bfb\u6c42\u5b9e\u8df5\u4e0e\u878d\u5165\u673a\u4f1a\uff0c\u800c\u975e\u88ab\u52a8\u7b49\u5f85)**\n3. > \u201c**\u6211\u7cfb\u7edf\u88c5\u597d\u4e86\uff0c\u53ef\u4ee5\u5e2e\u5fd9\u770b\u770b\u53ef\u4ee5\u7528\u5417**\u201d & \u201c**\u6211\u6628\u5929\u82b1\u94b1\u505a\u4e86\u53cc\u7cfb\u7edf\u4e86**\u201d **(\u6838\u5fc3\u8bc1\u636e\uff1a\u9ad8\u5fc3\u7406\u5f39\u6027\u4e0e\u6267\u884c\u529b\uff0c\u9047\u5230\u95ee\u9898\u4e3b\u52a8\u6295\u5165\u8d44\u6e90\u89e3\u51b3)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T7+T1-A\u6df7\u5408\u4f53\u8fdb\u5316\u524d\u4f53\uff08\u793e\u7fa4\u6b7b\u5fe0\u7c89+\u6f5c\u5728\u5bfc\u6f14\uff09\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u793e\u7fa4\u4e2d\u83b7\u5f97\u5c0a\u91cd\u3001\u5f52\u5c5e\u611f\u4e0e\u9886\u5bfc\u6743\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u8d4b\u4e88\u5176\u793e\u7fa4\u7ec4\u7ec7\u6743\u4e0e\u6280\u672f\u652f\u6301\uff0c\u6ee1\u8db3\u5176\u201c\u88ab\u9700\u8981\u201d\u7684\u9886\u8896\u6b32\u3011**\u3002\n\n```json\n{\"core_type\": \"T7 \u72c2\u70ed\u6b7b\u5fe0\u7c89\u578b (\u5411T1-A\u8fdb\u5316\u4e2d)\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u793e\u4ea4/\u5c0a\u91cd\", \"target_product_line\": \"\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\", \"age\": \"\u672a\u77e5\uff08\u63a8\u6d4b\u4e3a\u5b9d\u5988\uff0c\u53ef\u80fd30-40\u5c81\uff09\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}\n```";
