    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4ee5\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\u7684\u8eab\u4efd\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u63d0\u4f9b\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 118034154 (\u6635\u79f0\uff1aL\ud83d\udcab\u00edn\u196b\u1a63 / \u5927\u5927\u7684\u592a\u9633_ye) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e - \u6155\u5915\u8bed1(\u5f20\u8c28\u5e06)\uff1b\u73ed\u4e3b\u4efb - \u6854\u5b50JZT(\u7a0b\u5c55\u6b22) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u7cbe\u82f1\u8bfe\u7a0b\uff08\u9ad8\u9636\u7248\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u8bb0\u5f55\u4e2d\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u5b58\u5728\u501f\u8d37\u9690\u60a3\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5de5\u4f5c\u6027\u8d28\u3001\u4f5c\u606f\u65f6\u95f4\uff0c\u4ec5\u663e\u793a\u80fd\u6309\u65f6\u53c2\u4e0e\u76f4\u64ad\u548c\u63d0\u4ea4\u4f5c\u4e1a\uff0c\u65f6\u95f4\u53ef\u63a7\u6027\u4e3a\u4e2d\u7b49\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u5b66\u4e60\u4e92\u52a8\u884c\u4e3a\u8bb0\u5f55\u5145\u8db3\uff0c\u4f46\u4e2a\u4eba\u80cc\u666f\u3001\u7ecf\u6d4e\u72b6\u51b5\u3001\u6df1\u5c42\u52a8\u673a\u7b49\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34(\u4e2d)**\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b\uff08\u6309\u65f6\u542c\u8bfe\u3001\u4ea4\u4f5c\u4e1a\u3001\u505a\u7b14\u8bb0\uff09\uff0c\u5e76\u8868\u8fbe\u4e86\u201c\u5e0c\u671b\u5168\u804c\u6765\u53d8\u73b0\u201d\u7684\u76ee\u6807\u3002\u4f46\u52a8\u673a\u4e2d\u6df7\u5408\u4e86\u5bf9\u884c\u4e1a\u7684\u65b0\u5947\u63a2\u7d22\uff08\u201c\u7a81\u7136\u53d1\u73b0\u8fd9\u4e2a\u884c\u4e1a\u6709\u597d\u591a\u53ef\u4ee5\u505a\u7684\u5de5\u4f5c\u201d\uff09\u548c\u6210\u4e3a\u201c\u5168\u80fd\u4e3b\u64ad\u201d\u7684\u7406\u60f3\u5316\u671f\u5f85\uff0c\u5c1a\u672a\u8868\u73b0\u51fa\u5bf9\u6280\u80fd\u7cbe\u8fdb\u672c\u8eab\u7684\u72c2\u70ed\u8ffd\u6c42\u6216\u6781\u901f\u53d8\u73b0\u7684\u7126\u8651\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5e0c\u671b\u5168\u804c\u6765\u53d8\u73b0\u201d\uff1b\u201c\u60f3\u52aa\u529b\u5b66\u4e60\uff0c\u6210\u4e3a\u5411\u8001\u5e08\u8bf4\u7684\u5168\u80fd\u4e3b\u64ad\u90a3\u6837\u201d\uff1b\u201c\u7a81\u7136\u53d1\u73b0\u8fd9\u4e2a\u884c\u4e1a\u6709\u597d\u591a\u53ef\u4ee5\u505a\u7684\u5de5\u4f5c\uff0c\u90fd\u662f\u4ee5\u524d\u6211\u4e0d\u77e5\u9053\u7684\u201d\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 \u5df2\u652f\u4ed8\u9ad8\u9636\u8bfe\u7a0b\u8d39\u7528\uff0c\u8868\u660e\u6709\u4e00\u5b9a\u652f\u4ed8\u80fd\u529b\uff0c\u4f46\u8d44\u91d1\u6765\u6e90\u4e0d\u660e\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u5bbd\u88d5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 \u80fd\u5168\u7a0b\u8ddf\u8fdb\u4e24\u5929\u5bc6\u96c6\u7684\u4f53\u9a8c\u8425\u76f4\u64ad\uff0819:30, 12:00\u7b49\uff09\uff0c\u6309\u65f6\u63d0\u4ea4\u4f5c\u4e1a\uff0c\u8868\u660e\u6709\u76f8\u5bf9\u56fa\u5b9a\u7684\u5b66\u4e60\u65f6\u95f4\u3002\u4f46\u672a\u900f\u9732\u5177\u4f53\u804c\u4e1a\uff0c\u65e0\u6cd5\u8bc4\u4f30\u65f6\u95f4\u538b\u529b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u672a\u77e5] \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u5168\u7a0b\u6c9f\u901a\u79ef\u6781\u3001\u914d\u5408\u5ea6\u9ad8\uff0c\u5bf9\u9500\u552e/\u73ed\u4e3b\u4efb\u7684\u6307\u5bfc\u548c\u5efa\u8bae\u5747\u4ee5\u201c\u597d\u201d\u3001\u201c\u6536\u5230\u201d\u3001\u201c\u6211\u4f1a\u53bb\u7ec3\u4e60\u7684\u201d\u7b49\u6b63\u9762\u3001\u7b80\u6d01\u7684\u53cd\u9988\u56de\u5e94\u3002\u672a\u8868\u73b0\u51fa\u4efb\u4f55\u81ea\u6211\u6000\u7591\u3001\u7126\u8651\u6216\u4f9d\u8d56\u5b89\u629a\u7684\u8ff9\u8c61\uff0c\u60c5\u7eea\u7a33\u5b9a\u4e14\u6267\u884c\u529b\u5f3a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u4e00\u5b9a\u4f1a\u52aa\u529b\u8ddf\u4e0a\u8001\u5e08\u7684\u6b65\u4f10[\u52a0\u6cb9]\u201d\uff1b\u201c\u6211\u5f97\u597d\u597d\u52aa\u529b\u7684\u7ec3\u4e60\uff0c\u5411\u5e08\u59d0\u5b66\u4e60[\u52a0\u6cb9]\u201d\uff1b\u201c\u6709\u6bd4\u4e4b\u524d\u4e86\u89e3\u4e86\u66f4\u591a\u5173\u4e8e\u64ad\u97f3\u7684\u77e5\u8bc6\uff0c\u8001\u5e08\u6559\u7684\u592a\u597d\u4e86[\u5f3a]\u201d\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u81ea\u8eab\u5728\u65b0\u9886\u57df\u7684\u4ef7\u503c\u611f\u548c\u4e13\u4e1a\u8eab\u4efd\u8ba4\u540c\u7684\u6e34\u671b\u3002\u7528\u6237\u4e0d\u4ec5\u60f3\u8d5a\u94b1\uff0c\u66f4\u60f3\u6210\u4e3a\u88ab\u8ba4\u53ef\u7684\u201c\u5168\u80fd\u4e3b\u64ad\u201d\uff0c\u83b7\u5f97\u5728\u5168\u65b0\u9886\u57df\u7684\u4e13\u4e1a\u8eab\u4efd\u548c\u5c0a\u91cd\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u8eab\u4efd\u8d4b\u80fd**\u3002\u901a\u8fc7\u201c\u58f0\u97f3\u9274\u5b9a\u901a\u8fc7\u201d\u3001\u201c\u4e13\u5c5e\u914d\u97f3\u79c0\u201d\u3001\u201c\u5fa1\u59d0\u97f3\u7279\u8d28\u201d\u7b49\u4e13\u4e1a\u53cd\u9988\uff0c\u8d4b\u4e88\u5176\u201c\u4f60\u5929\u751f\u5c31\u662f\u5403\u8fd9\u7897\u996d\u7684\u201d\u7684\u6f5c\u8d28\u8ba4\u540c\uff0c\u5e76\u5c06\u5176\u7eb3\u5165\u201c\u7cbe\u82f1\u201d\u3001\u201c\u6709\u6f5c\u529b\u4e3b\u64ad\u201d\u7684\u5708\u5c42\uff0c\u6ee1\u8db3\u5176\u83b7\u5f97\u5c0a\u91cd\u548c\u5f52\u5c5e\u611f\u7684\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u8fdb\u5316\u524d\u4f53\uff0c\u6709\u5411\u6df7\u5408\u4f533\u53f7\u3010\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b\u3011\u53d1\u5c55\u7684\u6f5c\u529b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u5f53\u524d\u672a\u663e\u793a\u98ce\u9669\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u7528\u6237\u8868\u73b0\u51fa\u826f\u597d\u7684\u65f6\u95f4\u7ba1\u7406\u548c\u6267\u884c\u529b\uff0c\u5d29\u76d8\u98ce\u9669\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u4e0d\u6613\u56e0\u5b66\u4e60\u632b\u6298\u7834\u9632\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u7528\u6237\u76ee\u6807\u660e\u786e\u4e3a\u201c\u5168\u804c\u53d8\u73b0\u201d\uff0c\u82e5\u5728\u8bfe\u7a0b\u4e2d\u540e\u671f\uff08\u59822-3\u4e2a\u6708\u540e\uff09\u63a5\u5355\u8fdb\u5c55\u7f13\u6162\u6216\u6536\u5165\u672a\u8fbe\u9884\u671f\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u611f\uff0c\u8fdb\u800c\u8d28\u7591\u8bfe\u7a0b\u4ef7\u503c\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe\u540e\u7684 **\u7b2c2-3\u4e2a\u6708**\uff0c\u5373\u6280\u80fd\u5b66\u4e60\u8fdb\u5165\u5e73\u53f0\u671f\uff0c\u4f46\u53d8\u73b0\u6e20\u9053\u5c1a\u672a\u5b8c\u5168\u6253\u5f00\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u592a\u9633\u540c\u5b66\uff0c\u770b\u5230\u4f60\u5728\u4f53\u9a8c\u8425\u7684\u8868\u73b0\u975e\u5e38\u624e\u5b9e\uff0c\u6bcf\u4e00\u6b65\u90fd\u8d70\u5f97\u5f88\u7a33\u3002\u4f60\u7684\u5fa1\u59d0\u97f3\u5e95\u5b50\u5f88\u597d\uff0c\u662f\u5757\u597d\u6599\u5b50\u3002\u63a5\u4e0b\u6765\u7684\u7cfb\u7edf\u8bfe\uff0c\u6211\u4f1a\u7ed9\u4f60\u5339\u914d\u66f4\u6709\u6311\u6218\u6027\u7684\u6587\u672c\u548c\u66f4\u7cbe\u7ec6\u7684\u6307\u5bfc\u3002\u54b1\u4eec\u4e0d\u56fe\u5feb\uff0c\u4f46\u6c42\u6bcf\u4e00\u6b65\u90fd\u8d70\u5f97\u624e\u5b9e\uff0c\u628a\u2018\u5168\u80fd\u4e3b\u64ad\u2019\u8fd9\u4e2a\u76ee\u6807\uff0c\u62c6\u89e3\u6210\u4e00\u4e2a\u4e2a\u4f60\u80fd\u7a33\u7a33\u62ff\u4e0b\u7684\u5c71\u5934\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176\u201c\u5168\u804c\u53d8\u73b0\u201d\u76ee\u6807\u548c\u7a33\u5b9a\u3001\u80af\u5e72\u7684\u7279\u70b9\uff0c\u63d0\u4f9b\u7cfb\u7edf\u3001\u6df1\u5ea6\u7684\u6280\u80fd\u8bad\u7ec3\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T2\u8001\u9ec4\u725b\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010B\u6a21\u5757(\u6ee1\u914d)\uff1a\u786c\u6838\u624b\u827a\u6c60\u3011**\uff0c\u5373\u63d0\u4f9b\u4e13\u5bb61v1\u7b54\u7591\u3001\u5201\u94bb\u53d1\u58f0/AI\u6307\u4ee4\u70b9\u8bc4\u3001\u771f\u5b9e\u6d3e\u5355\u5b9e\u6218\u3002\u540c\u65f6\uff0c**\u6301\u7eed\u76d1\u63a7\u5176\u662f\u5426\u51fa\u73b0\u4e3b\u52a8\u7ba1\u7406\u884c\u4e3a\uff08\u5982\u5e2e\u540c\u5b66\u7b54\u7591\u3001\u7edf\u8ba1\u4f5c\u4e1a\uff09\uff0c\u4e00\u65e6\u51fa\u73b0\uff0c\u7acb\u5373\u542f\u52a8\u3010D\u6a21\u5757\uff1a\u9ec4\u888d\u52a0\u8eab\u63d0\u5e72\u6cd5\u3011**\uff0c\u5c06\u5176\u63d0\u62d4\u4e3a\u7ec4\u957f\u6216\u5236\u4f5c\u4eba\uff0c\u5229\u7528\u5176\u82e6\u5e72\u5e95\u76d8\u56fa\u5316\u4e3a\u751f\u6001\u5efa\u8bbe\u8005\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u51e0\u5929\u5c31\u80fd\u8d5a\u94b1\u201d\u7b49\u4e0d\u5207\u5b9e\u9645\u7684\u8bdd\u672f\u8fc7\u5ea6\u523a\u6fc0\u5176\u53d8\u73b0\u9884\u671f\uff1b\u7528\u201c\u4f5b\u7cfb\u201d\u3001\u201c\u968f\u4fbf\u5b66\u5b66\u201d\u7b49\u8a00\u8bba\u6d88\u89e3\u5176\u8ba4\u771f\u5b66\u4e60\u7684\u52b2\u5934\uff1b\u5ffd\u89c6\u5176\u4f5c\u4e1a\u8d28\u91cf\uff0c\u7ed9\u4e88\u6577\u884d\u7684\u70b9\u8bc4\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u8fdb\u884c\u5927\u989d\u63a8\u4ecb**\u3002\u5f53\u5176\u6280\u80fd\u8fbe\u5230\u4e00\u5b9a\u6c34\u5e73\u540e\uff0c\u53ef\u987a\u7406\u6210\u7ae0\u5730\u63a8\u8350\u9ad8\u9636\u540e\u671f\u8bfe\u3001\u8bbe\u5907\u8bfe\u7b49\uff0c\u6ee1\u8db3\u5176\u6210\u4e3a\u201c\u5168\u80fd\u4e3b\u64ad\u201d\u7684\u6df1\u5c42\u9700\u6c42\u3002\u4f46\u63a8\u4ecb\u5fc5\u987b\u57fa\u4e8e\u5176\u5b9e\u9645\u8fdb\u6b65\u548c\u4f5c\u54c1\uff0c\u6709\u7406\u6709\u636e\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u5f97\u597d\u597d\u52aa\u529b\u7684\u7ec3\u4e60\uff0c\u5411\u5e08\u59d0\u5b66\u4e60[\u52a0\u6cb9]\u201d \u2014\u2014 **\u4f53\u73b0\u9ad8\u914d\u5408\u5ea6\u4e0e\u884c\u52a8\u529b\uff0cT2\u5178\u578b\u7279\u5f81\u3002**\n2. > \u201c\u5e0c\u671b\u5168\u804c\u6765\u53d8\u73b0\u201d \u2014\u2014 **\u660e\u786e\u53d8\u73b0\u76ee\u6807\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u6025\u8e81\uff0c\u52a8\u673a\u7eaf\u5ea6\u4e2d\u7b49\u3002**\n3. > \u201c\u60f3\u52aa\u529b\u5b66\u4e60\uff0c\u6210\u4e3a\u5411\u8001\u5e08\u8bf4\u7684\u5168\u80fd\u4e3b\u64ad\u90a3\u6837\u201d \u2014\u2014 **\u66b4\u9732\u5bf9\u4e13\u4e1a\u8eab\u4efd\u548c\u5c0a\u91cd\u7684\u6e34\u671b\uff0c\u662f\u9a6c\u65af\u6d1b\u7b2c\u56db\u5c42\u9700\u6c42\u7684\u76f4\u63a5\u4f53\u73b0\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5728\u65b0\u9886\u57df\u7684\u4e13\u4e1a\u8eab\u4efd\u8ba4\u540c\u4e0e\u5c0a\u91cd\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u624e\u5b9e\u7684B\u6a21\u5757\u6280\u80fd\u8bad\u7ec3+\u9002\u65f6\u8d4b\u4e88D\u6a21\u5757\u7ba1\u7406\u6743\u9650\uff0c\u5e76\u4e25\u683c\u7ba1\u7406\u5176\u201c\u5168\u804c\u53d8\u73b0\u201d\u7684\u957f\u671f\u9884\u671f\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}\n```";
