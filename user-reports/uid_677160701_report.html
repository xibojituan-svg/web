    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677160701\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677160701 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u7b71\u6590\u5440\uff5e\u5b98\u65b9S\u7ea7\u62db\u52df\u5b98(\u5f90\u632f\u5f3a) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff0c\u6700\u7ec8\u652f\u4ed83980\u5143 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u9700\u6838\u67e5\u662f\u5426\u4f7f\u7528\u5206\u671f/\u501f\u8d37\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u5de5\u5382\u5973\u5de5\uff0c\u591c\u73ed\uff0c\u9700\u5728\u5608\u6742\u73af\u5883\u53ca\u4e0b\u73ed\u540e\u6324\u65f6\u95f4\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u7528\u6237\u4e3b\u52a8\u900f\u9732\u804c\u4e1a\u3001\u5e74\u9f84\u3001\u65f6\u95f4\u9650\u5236\u3001\u5fc3\u7406\u72b6\u6001\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u2b07\u4f4e (\u8bc4\u5206\uff1a3-4\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u7eaf\u4e3a\u51e0\u5929\u5185\u63d0\u73b0\u4fdd\u5e95\u800c\u6765**\u3002\u5bf9\u8bdd\u6838\u5fc3\u56f4\u7ed5\u201c\u80fd\u5426\u63a5\u5355\u201d\u3001\u201c\u591a\u4e45\u8d5a\u94b1\u201d\u3001\u201c\u6dd8\u6c70\u7387\u9ad8\u4e0d\u9ad8\u201d\u5c55\u5f00\uff0c\u5bf9\u5b66\u4e60\u8fc7\u7a0b\u672c\u8eab\u5174\u8da3\u5be5\u5be5\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u7684\u58f0\u97f3\u58f0\u8272\u3002\u53ef\u4ee5\u63a5\u5230\u5355\u5b50\u5417\uff1f\u4ee5\u5b66\u59d0\u5bf9\u58f0\u97f3\u7684\u4e86\u89e3\u201d\n  > \u201c\u8fd9\u4e48\u8bf4\u6211\u58f0\u97f3\u8fd8\u662f\u4e0d\u884c\u554a...\u4f46\u6211\u8fd8\u662f\u611f\u89c9\u81ea\u5df1\u88ab\u6dd8\u6c70\u7387\u5f88\u9ad8\u3002\u201d\n  > \u201c\u957f\u671f\u6536\u5165\u662f\u4e0d\u662f\u53ea\u6709\u6709\u6d41\u91cf\u7684\u60c5\u51b5\u4e0b\u624d\u4f1a\u6709\u6536\u5165\uff0c\u5feb\u901f\u6536\u5165\u5c31\u662f1\u5c0f\u65f6\u591a\u5c11\u94b1\u90a3\u79cd\uff1f\u201d\n  > \u201c\u6211\u5148\u9009\u62e9\u5feb\u901f\u6536\u5165\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e (\u8bc4\u5206\uff1a3-4\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u7ecf\u6d4e\u72b6\u51b5\uff0c\u4f46\u4f5c\u4e3a\u5de5\u5382\u5973\u5de5\uff0c\u5bf93980\u5143\u5b66\u8d39\u7684\u652f\u4ed8\u65b9\u5f0f\u9700\u9ad8\u5ea6\u8b66\u60d5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u2b07\u4f4e** \u2014 \u5de5\u5382\u5973\u5de5\uff0c\u591c\u73ed\u5de5\u4f5c\u5236\uff0c\u5f55\u97f3\u73af\u5883\u5dee\uff08\u201c\u673a\u5668\u566a\u97f3\u6bd4\u8f83\u5927\u201d\uff09\uff0c\u5b66\u4e60\u65f6\u95f4\u88ab\u4e25\u91cd\u6324\u538b\uff0c\u7cbe\u529b\u6709\u9650\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b07\u4f4e\u6781\u5371 (\u8bc4\u5206\uff1a1-2\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56**\u3002\u4e00\u6b21\u8f7b\u5fae\u7684\u3001\u975e\u5426\u5b9a\u7684\u53cd\u9988\uff08\u9500\u552e\u8bf4\u201c\u63a5\u5355\u770b\u7efc\u5408\u80fd\u529b\u201d\uff09\u5373\u5f15\u53d1\u5f3a\u70c8\u7684\u81ea\u6211\u5426\u5b9a\u548c\u653e\u5f03\u5ff5\u5934\uff0c\u9700\u8981\u5916\u90e8\u6301\u7eed\u9f13\u52b1\u548c\u80af\u5b9a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u8fd9\u4e48\u8bf4\u6211\u58f0\u97f3\u8fd8\u662f\u4e0d\u884c\u554a\uff0c\u4e0d\u8fc7\u6211\u4f1a\u52aa\u529b\u7684\uff0c\u8c22\u8c22\u5b66\u59d0\u9f13\u52b1\u3002\u4f46\u4f60\u8fd9\u4e48\u4e00\u8bf4\uff0c\u6211\u8fd8\u662f\u611f\u89c9\u81ea\u5df1\u88ab\u6dd8\u6c70\u7387\u5f88\u9ad8\u3002\u201d\n  > \u201c\u4f60\u7684\u610f\u601d\u662f\u8bf4\u6211\u7684\u58f0\u97f3\u53ea\u9002\u5408\u6050\u6016\u60ac\u7591\u7c7b\u7684\u3002\u50cf\u90a3\u79cd\u90fd\u5e02\u7a7f\u8d8a\u8a00\u60c5\u5c0f\u8bf4\uff0c\u6211\u7684\u58f0\u97f3\u4e0d\u5408\u9002\u554a\u3002\u5e08\u59d0\u89c9\u5f97\u6211\u7684\u58f0\u97f3\u9002\u5408\u4ec0\u4e48\u6211\u5c31\u5e72\u4ec0\u4e48\u5427\u3002\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c (Safety Needs)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u672a\u6765\u7684\u6781\u5ea6\u4e0d\u5b89\u5168\u611f\u4e0e\u5bf9\u81ea\u8eab\u4ef7\u503c\u7684\u6df1\u5ea6\u6000\u7591**\u3002\u4f5c\u4e3a43\u5c81\u7684\u5de5\u5382\u5973\u5de5\uff0c\u5979\u5bfb\u6c42\u7684\u4e0d\u4ec5\u662f\u4e00\u4efd\u517c\u804c\u6536\u5165\uff0c\u66f4\u662f\u4e00\u4efd\u80fd\u8bc1\u660e\u81ea\u5df1\u201c\u8fd8\u884c\u201d\u3001\u80fd\u8ddf\u4e0a\u65f6\u4ee3\u3001\u4e0d\u88ab\u6dd8\u6c70\u7684\u201c\u4fdd\u969c\u201d\u3002\u58f0\u97f3\u662f\u5979\u8bd5\u56fe\u6293\u4f4f\u7684\u6551\u547d\u7a3b\u8349\uff0c\u4efb\u4f55\u5173\u4e8e\u5176\u58f0\u97f3\u201c\u4e0d\u5408\u9002\u201d\u7684\u6697\u793a\u90fd\u4f1a\u76f4\u63a5\u52a8\u6447\u5176\u5b89\u5168\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u65e0\u6761\u4ef6\u7684\u80af\u5b9a\u4e0e\u201c\u88ab\u9009\u4e2d\u201d\u7684\u5b89\u5168\u611f**\u3002\u9700\u8981\u4e0d\u65ad\u5f3a\u5316\u201c\u4f60\u7684\u58f0\u97f3\u5f88\u6709\u6f5c\u529b\u201d\u3001\u201c\u4f60\u88ab\u6211\u4eec\u9009\u4e2d\u4e86\u201d\u3001\u201c\u8ddf\u7740\u6211\uff0c\u6709\u5355\u5b50\u201d\u7684\u627f\u8bfa\uff0c\u7528\u201c\u88ab\u6743\u5a01\u8ba4\u53ef\u201d\u6765\u5bf9\u51b2\u5176\u5185\u5fc3\u7684\u81ea\u5351\u4e0e\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u8bba** (\u52a8\u673a\u7eaf\u5ea6\u4f4e+\u8d44\u6e90\u5e95\u5ea7\u4f4e+\u5fc3\u7406\u5f39\u6027\u4f4e) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 **\u5b89\u5168\u672a\u89e6\u53d1** (\u4f46\u9700\u7acb\u5373\u6838\u67e5\u652f\u4ed8\u65b9\u5f0f)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5c5e\u53cd\u5bf9\u7b49\u6781\u7aef\u8a00\u8bba\u3002\u4f46**\u652f\u4ed8\u65b9\u5f0f\u672a\u77e5**\uff0c\u5b58\u5728\u6f5c\u5728\u98ce\u9669\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u82e5\u5b66\u8d39\u652f\u51fa\u672a\u4e0e\u5bb6\u4eba\u6c9f\u901a\uff0c\u6216\u5360\u7528\u5bb6\u5ead\u91cd\u8981\u5f00\u652f\uff0c\u53ef\u80fd\u5f15\u53d1\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u6781\u9ad8** | **\u591c\u73ed\u5de5\u4f5c\u5236**\u5bfc\u81f4\u65e0\u6cd5\u6309\u65f6\u53c2\u52a0\u76f4\u64ad\u3001\u5b8c\u6210\u4f5c\u4e1a\uff0c\u79ef\u538b\u7684\u632b\u8d25\u611f\u548c\u65f6\u95f4\u538b\u529b\u662f\u6700\u5927\u96f7\u70b9\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | \u63a5\u5355\u8bd5\u97f3\u5931\u8d25\u3001\u6216\u6536\u5230\u4efb\u4f55\u975e\u7edd\u5bf9\u6b63\u9762\u7684\u53cd\u9988\u65f6\uff0c\u6781\u6613\u89e6\u53d1\u201c\u6211\u4e0d\u884c\u201d\u7684\u5d29\u6e83\uff0c\u8fdb\u800c\u8981\u6c42\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u6781\u9ad8** | \u5bf9\u201c\u5feb\u901f\u6536\u5165\u201d\u62b1\u6709\u5e7b\u60f3\uff0c\u82e5\u5f00\u8bfe\u540e1-2\u5468\u5185\u672a\u83b7\u5f97\u4efb\u4f55\u53d8\u73b0\u673a\u4f1a\u6216\u660e\u786e\u8def\u5f84\uff0c\u4f1a\u7acb\u523b\u611f\u5230\u53d7\u9a97\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c1-2\u5468**\u3002\u5f53\u6b63\u5f0f\u8bfe\u7a0b\u5f00\u59cb\uff0c\u4f5c\u4e1a\u96be\u5ea6\u548c\u9891\u7387\u63d0\u5347\uff0c\u800c\u5979\u56e0\u5de5\u4f5c\u65e0\u6cd5\u8ddf\u4e0a\u65f6\uff1b\u6216\u5f53\u9996\u6b21\u8bd5\u97f3\u5931\u8d25\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u59d0\uff0c\u770b\u5230\u4f60\u591c\u73ed\u8fd9\u4e48\u8f9b\u82e6\u8fd8\u575a\u6301\u5b66\u4e60\uff0c\u771f\u7684\u7279\u522b\u4f69\u670d\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u5c31\u662f\u4e3a\u4f60\u8fd9\u6837\u60f3\u6539\u53d8\u3001\u80af\u52aa\u529b\u7684\u4eba\u8bbe\u8ba1\u7684\u3002\u522b\u62c5\u5fc3\u65f6\u95f4\uff0c\u54b1\u4eec\u4e0d\u8ddf\u522b\u4eba\u6bd4\u8fdb\u5ea6\uff0c\u4f60\u5c31\u6309\u4f60\u81ea\u5df1\u7684\u8282\u594f\u6765\u3002\u6709\u6211\u5728\uff0c\u4fdd\u8bc1\u5e26\u4f60\u63a5\u5230\u7b2c\u4e00\u5355\uff0c\u8ba9\u4f60\u770b\u5230\u5b9e\u5b9e\u5728\u5728\u7684\u6539\u53d8\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011**\u3002\u5fc5\u987b\u5c06\u201c\u5feb\u901f\u89c1\u5230\u94b1\u201d\u4f5c\u4e3a\u6838\u5fc3\u627f\u8bfa\u548c\u6559\u5b66\u4e3b\u7ebf\uff0c\u6240\u6709\u6559\u5b66\u5185\u5bb9\u56f4\u7ed5\u201c\u5982\u4f55\u901a\u8fc7\u6700\u7b80\u5355\u7684\u65b9\u5f0f\u63a5\u5230\u7b2c\u4e00\u5355\u201d\u5c55\u5f00\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u8865\u5145 **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u73ed\u4e3b\u4efb\u9700\u626e\u6f14\u201c\u9f13\u52b1\u578b\u957f\u8f88\u201d\u89d2\u8272\uff0c\u5bf9\u5176\u4efb\u4f55\u5fae\u5c0f\u8fdb\u6b65\u7ed9\u4e88\u5938\u5f20\u8d5e\u7f8e\uff0c\u5e76\u4e3b\u52a8\u4e3a\u5176\u534f\u8c03\u65f6\u95f4\uff08\u5982\u5141\u8bb8\u8865\u4ea4\u3001\u63d0\u4f9b\u5f55\u64ad\uff09\uff0c**\u7edd\u5bf9\u907f\u514d**\u7528\u201c\u4e0d\u4ea4\u4f5c\u4e1a\u5c31\u6dd8\u6c70\u201d\u7b49\u65bd\u538b\u8bdd\u672f\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u5bf9\u5979\u7684\u58f0\u97f3\u6216\u4f5c\u4e1a\u7ed9\u51fa\u4efb\u4f55\u5e26\u6709\u201c\u4e0d\u8db3\u201d\u3001\u201c\u9700\u8981\u6539\u8fdb\u201d\u7b49\u5426\u5b9a\u6027\u8bcd\u6c47\u7684\u53cd\u9988\uff0c\u5fc5\u987b\u5168\u90e8\u5305\u88c5\u4e3a\u201c\u6f5c\u529b\u201d\u548c\u201c\u65b9\u5411\u201d\u30022. \u7528\u201c\u5176\u4ed6\u5b66\u5458\u90fd\u5b8c\u6210\u4e86\u201d\u6765\u50ac\u4fc3\u5979\u30023. \u5728\u521d\u671f\u8bb2\u6388\u8fc7\u4e8e\u590d\u6742\u3001\u8fdc\u79bb\u201c\u63a5\u5355\u201d\u7684\u6280\u672f\u7406\u8bba\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5347\u5355**\u3002\u5728\u6210\u529f\u534f\u52a9\u5176\u5b8c\u6210\u7b2c\u4e00\u5355\u53d8\u73b0\u5e76\u83b7\u5f97\u5f3a\u70c8\u6b63\u53cd\u9988\u524d\uff0c\u7981\u6b62\u63a8\u8350\u4efb\u4f55\u9ad8\u9636\u8bfe\u7a0b\u6216\u8bbe\u5907\uff0c\u5426\u5219\u5c06\u76f4\u63a5\u5f15\u7206\u6536\u76ca\u843d\u5dee\u578b\u9000\u8d39\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u662f\u5de5\u5382\u5973\u5de5\uff0c\u673a\u5668\u566a\u97f3\u6bd4\u8f83\u5927\uff0c\u6240\u4ee5\u5f55\u5236\u4e0d\u597d\u3002\u201d **(\u8d44\u6e90\u5e95\u5ea7\u77ed\u677f\u81ea\u8bc1)**\n2. > \u201c\u8fd9\u4e48\u8bf4\u6211\u58f0\u97f3\u8fd8\u662f\u4e0d\u884c\u554a\uff0c\u4e0d\u8fc7\u6211\u4f1a\u52aa\u529b\u7684\uff0c\u8c22\u8c22\u5b66\u59d0\u9f13\u52b1\u3002\u4f46\u4f60\u8fd9\u4e48\u4e00\u8bf4\uff0c\u6211\u8fd8\u662f\u611f\u89c9\u81ea\u5df1\u88ab\u6dd8\u6c70\u7387\u5f88\u9ad8\u3002\u201d **(\u5fc3\u7406\u5f39\u6027\u8106\u5f31\uff0c\u6781\u6613\u56e0\u975e\u5426\u5b9a\u53cd\u9988\u800c\u5d29\u6e83)**\n3. > \u201c\u957f\u671f\u6536\u5165\u662f\u4e0d\u662f\u53ea\u6709\u6709\u6d41\u91cf\u7684\u60c5\u51b5\u4e0b\u624d\u4f1a\u6709\u6536\u5165\uff0c\u5feb\u901f\u6536\u5165\u5c31\u662f1\u5c0f\u65f6\u591a\u5c11\u94b1\u90a3\u79cd\uff1f\u201d\u3001\u201c\u6211\u5148\u9009\u62e9\u5feb\u901f\u6536\u5165\u3002\u201d **(\u52a8\u673a\u7eaf\u5ea6\u4f4e\uff0c\u5f3a\u70c8\u4e14\u6025\u8feb\u7684\u53d8\u73b0\u8bc9\u6c42)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4 \u641e\u94b1\u7ed3\u679c\u8bba\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u7ecf\u6d4e\u4e0e\u804c\u4e1a\u4e0a\u7684\u5b89\u5168\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7528\u201c\u5feb\u901f\u63a5\u5355\u201d\u7684\u660e\u786e\u8def\u5f84\u5b89\u629a\u5176\u7126\u8651\uff0c\u5e76\u7528\u6781\u81f4\u7684\u60c5\u611f\u6258\u5e95\uff08C\u6a21\u5757\u6ee1\u914d\uff09\u9632\u6b62\u5176\u56e0\u632b\u6298\u800c\u5d29\u6e83\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u8bba\", \"maslow_need\": \"\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf+\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
