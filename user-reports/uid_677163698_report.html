    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4f5c\u4e3a\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677163698\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677163698 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e-\u5b59\u91ce\uff0c\u73ed\u4e3b\u4efb-\u5355\u601d\u7ef4 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u64ad\u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u4ef7\u683c7380\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u5168\u6b3e\u5145\u88d5**\uff08\u76f4\u63a5\u652f\u4ed8\uff0c\u65e0\u5206\u671f\u3001\u501f\u8d37\u4fe1\u53f7\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u4e2d\u5348\u534a\u5c0f\u65f6\u3001\u4e0b\u53485\u70b9\u540e\u3001\u665a\u4e0a\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\uff08\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\uff08\u6709\u660e\u786e\u6536\u5165\u3001\u5b66\u4e60\u610f\u613f\u3001\u65f6\u95f4\u5b89\u6392\uff0c\u4f46\u7f3a\u4e4f\u5bb6\u5ead\u3001\u8bbe\u5907\u3001\u8fc7\u5f80\u7ecf\u9a8c\u7b49\u6df1\u5ea6\u4fe1\u606f\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u2b06\u9ad8 (7\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u6210\u957f\u800c\u6765\uff0c\u517c\u5177\u660e\u786e\u7684\u517c\u804c\u53d8\u73b0\u76ee\u6807\uff0c\u4f46\u5fc3\u6001\u52a1\u5b9e\u3001\u4e0d\u6025\u4e8e\u6c42\u6210\uff0c\u5173\u6ce8\u957f\u671f\u6280\u80fd\u79ef\u7d2f\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u76ee\u524d\u6536\u5165\u4e00\u4e07\u591a\u5427\uff0c\u517c\u804c\u671f\u671b1\u4e003\u5343\u5427\uff0c\u5c31\u5f53\u6bcf\u6708\u591a\u4e2a\u8865\u8d34\u201d\n  > \u201c\u6211\u4f1a\u8e0f\u5b9e\u53bb\u5b66\uff0c\u4e0d\u8d2a\u4e0d\u6025\uff0c\u5c31\u662f\u60f3\u95ee\u95ee\u5e08\u59d0\u4e00\u5f00\u59cb\u90fd\u662f\u5f55\u591a\u4e45\uff0c\u55d3\u5b50\u75bc\u6216\u75d2\u65f6\u6709\u4ec0\u4e48\u65b9\u6cd5\u7f13\u89e3\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u73b0\u6709\u6708\u6536\u5165\u4e00\u4e07\u591a\uff0c\u80fd\u5168\u6b3e\u652f\u4ed87380\u5143\u8bfe\u7a0b\uff0c\u65e0\u7ecf\u6d4e\u538b\u529b\u4fe1\u53f7\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u53ef\u7528\u65f6\u95f4\u4e3a\u4e2d\u5348\u534a\u5c0f\u65f6\u3001\u4e0b\u53485\u70b9\u540e\u548c\u665a\u4e0a\uff0c\u5c5e\u4e8e\u5178\u578b\u7684\u4e0a\u73ed\u65cf\u788e\u7247\u5316\u65f6\u95f4\uff0c\u4f46\u89c4\u5212\u6e05\u6670\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff0c\u65e0\u6cd5\u5224\u65ad\u3002**\u6b64\u4e3a\u6f5c\u5728\u98ce\u9669\u70b9**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8 (7-8\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u65b0\u4e8b\u7269\uff08\u8bd5\u97f3\u6587\u7a3f\u3001\u5e73\u53f0\u6ce8\u518c\uff09\u80fd\u4e3b\u52a8\u63d0\u95ee\u3001\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u65e0\u62b1\u6028\u3001\u65e0\u81ea\u6211\u5426\u5b9a\uff0c\u60c5\u7eea\u7a33\u5b9a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6587\u7a3f\u4e0a\u6ca1\u770b\u5230\u5212\u7ebf\u5440\u201d\uff08\u9047\u5230\u95ee\u9898\u76f4\u63a5\u3001\u6e05\u6670\u63d0\u95ee\uff09\n  > \u201c\u5e08\u59d0\uff0c\u6211\u8fd8\u6ca1\u6709\u53bb\u559c\u9a6c\u5b9e\u540d\u8ba4\u8bc1\uff0c\u9700\u8981\u7acb\u5373\u53bb\u4e48\uff0c\u8fdf\u70b9\u884c\u5417\uff1f\u6d41\u7a0b\u662f\uff1f\u5bf9\u4f53\u5236\u5185\u4eba\u5458\u6709\u9650\u5236\u4e48\uff1f\u201d\uff08\u601d\u8003\u5468\u5168\uff0c\u4e3b\u52a8\u8003\u8651\u6f5c\u5728\u9650\u5236\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 & \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u73b0\u6709\u804c\u4e1a/\u6536\u5165\u7ed3\u6784\u7684\u4e0d\u5b89\u5168\u611f\uff0c\u5e0c\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u53ef\u589e\u503c\u7684\u526f\u4e1a\u6280\u80fd\uff0c\u83b7\u5f97\u66f4\u7a33\u5b9a\u7684\u7ecf\u6d4e\u4fdd\u969c\u548c\u804c\u4e1a\u9009\u62e9\u6743\uff08\u5b89\u5168\u9700\u6c42\uff09\u3002\u540c\u65f6\uff0c\u4e5f\u6e34\u671b\u901a\u8fc7\u5b66\u4e60\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u548c\u5c0a\u91cd\uff08\u201c\u6210\u4e3a\u4f18\u79c0\u7684\u6f14\u64ad\u5e08\u201d\uff09\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u8def\u5f84\u7684\u6e05\u6670\u6307\u5f15\u4e0e\u9636\u6bb5\u6027\u6210\u679c\u7684\u80af\u5b9a**\u3002\u4ed6\u9700\u8981\u88ab\u5f53\u6210\u4e00\u4e2a\u7406\u6027\u7684\u3001\u6709\u89c4\u5212\u7684\u6210\u5e74\u4eba\u6765\u5bf9\u5f85\uff0c\u63d0\u4f9b\u660e\u786e\u7684\u6210\u957f\u8def\u7ebf\u56fe\u3001\u5b9e\u64cd\u65b9\u6cd5\u548c\u53ca\u65f6\u7684\u6b63\u9762\u53cd\u9988\uff0c\u800c\u975e\u5355\u7eaf\u7684\u9e21\u6c64\u9f13\u52b1\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u9ad8\u52a8\u673a\u3001\u9ad8\u5f39\u6027\u3001\u52a1\u5b9e\u6267\u884c\u8005) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u8a00\u8bba\u3001\u5bb6\u5ead\u53cd\u5bf9\u7b49\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4f4e** | \u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\uff0c\u4f46\u9700\u5728\u540e\u7eed\u4ea4\u4ed8\u4e2d\u4fa7\u9762\u4e86\u89e3\uff0c\u4ee5\u9632\u9690\u7792\u62a5\u540d\u5f15\u53d1\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u4e3b\u8981\u98ce\u9669\u70b9\u3002\u788e\u7247\u5316\u65f6\u95f4\u5b66\u4e60\uff0c\u82e5\u8bfe\u7a0b\u8282\u594f\u8fc7\u5feb\u3001\u4f5c\u4e1a\u91cf\u8fc7\u5927\uff0c\u53ef\u80fd\u5bfc\u81f4\u79ef\u538b\u548c\u8ddf\u4e0d\u4e0a\uff0c\u4ea7\u751f\u201c\u82b1\u4e86\u94b1\u6ca1\u65f6\u95f4\u5b66\u201d\u7684\u632b\u8d25\u611f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u56f0\u96be\u800c\u60c5\u7eea\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u671f\u671b\u517c\u804c\u6708\u51651-3k\uff0c\u82e5\u5728\u627f\u8bfa\u5468\u671f\uff08\u59823-6\u4e2a\u6708\uff09\u5185\u5b8c\u5168\u65e0\u63a5\u5355\u673a\u4f1a\u6216\u6536\u5165\u8fdc\u4f4e\u4e8e\u9884\u671f\uff0c\u53ef\u80fd\u5f15\u53d1\u8d28\u7591\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c3-4\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u5b66\u4e60\u96be\u5ea6\u548c\u4f5c\u4e1a\u91cf\u53ef\u80fd\u589e\u52a0\uff0c\u82e5\u65f6\u95f4\u7ba1\u7406\u4e0d\u5f53\u5bfc\u81f4\u8fdb\u5ea6\u4e25\u91cd\u843d\u540e\uff0c\u4e14\u672a\u770b\u5230\u4efb\u4f55\u53d8\u73b0\u82d7\u5934\uff0c\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5b59\u4f1f\u540c\u5b66\uff0c\u770b\u5230\u4f60\u89c4\u5212\u7684\u65f6\u95f4\u5f88\u6e05\u6670\uff0c\u76ee\u6807\u4e5f\u5f88\u52a1\u5b9e\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u5c31\u662f\u4e3a\u4e0a\u73ed\u65cf\u8bbe\u8ba1\u7684\uff0c\u8282\u594f\u4f60\u53ef\u4ee5\u81ea\u5df1\u628a\u63e1\u3002\u524d\u671f\u91cd\u70b9\u662f\u6253\u57fa\u7840\uff0c\u4e0d\u7528\u7740\u6025\u63a5\u5355\u3002\u6709\u4efb\u4f55\u64cd\u4f5c\u4e0a\u7684\u95ee\u9898\uff0c\u968f\u65f6\u95ee\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u628a\u6bcf\u4e2a\u6b65\u9aa4\u8d70\u624e\u5b9e\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176\u9ad8\u52a8\u673a\u548c\u52a1\u5b9e\u6027\u683c\uff0c\u63d0\u4f9b\u6e05\u6670\u3001\u6709\u6df1\u5ea6\u7684\u6280\u80fd\u6559\u5b66\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T2\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a**\u3010B\u6a21\u5757(\u6ee1\u914d)\uff1a\u4e13\u5bb61v1\u7b54\u7591 + \u771f\u5b9e\u6d3e\u5355\u5b9e\u6218\u3011**\u3002\u6d3e\u53d1\u6709\u6311\u6218\u6027\u4f46\u53ef\u8fbe\u6210\u7684\u5b9e\u64cd\u4efb\u52a1\uff0c\u7ed9\u4e88\u4e25\u683c\u800c\u4e13\u4e1a\u7684\u70b9\u8bc4\uff0c\u6ee1\u8db3\u5176\u201c\u6c42\u80af\u5b9a\u201d\u548c\u201c\u5b66\u771f\u672c\u4e8b\u201d\u7684\u9700\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u5b9d\u5988\u9006\u88ad\u201d\u3001\u201c\u51e0\u5929\u66b4\u5bcc\u201d\u7b49\u717d\u52a8\u6027\u8bdd\u672f\u523a\u6fc0\u4ed6\uff1b\u5e03\u7f6e\u5927\u91cf\u4f4e\u4ef7\u503c\u3001\u91cd\u590d\u6027\u7684\u4f5c\u4e1a\u6d88\u8017\u5176\u5b9d\u8d35\u7684\u788e\u7247\u65f6\u95f4\uff1b\u5ffd\u89c6\u5176\u63d0\u51fa\u7684\u5177\u4f53\u64cd\u4f5c\u95ee\u9898\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u9700\u5efa\u7acb\u5728\u624e\u5b9e\u7684\u5b66\u4e60\u6210\u679c\u548c\u660e\u786e\u7684\u6280\u80fd\u8fdb\u9636\u8def\u5f84\u4e0a**\u3002\u4f8b\u5982\uff0c\u5728\u5176\u5b8c\u6210\u57fa\u7840\u8bfe\u7a0b\u5e76\u6210\u529f\u63a5\u5355\u540e\uff0c\u63a8\u4ecb\u9ad8\u9636\u540e\u671f\u8bfe\u6216\u8bbe\u5907\u9009\u8d2d\u6307\u5bfc\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u76ee\u524d\u6536\u5165\u4e00\u4e07\u591a\u5427\uff0c\u517c\u804c\u671f\u671b1\u4e003\u5343\u5427\uff0c\u5c31\u5f53\u6bcf\u6708\u591a\u4e2a\u8865\u8d34\u201d **(\u52a1\u5b9e\u53d8\u73b0\u76ee\u6807)**\n2. > \u201c\u6211\u4f1a\u8e0f\u5b9e\u53bb\u5b66\uff0c\u4e0d\u8d2a\u4e0d\u6025\uff0c\u5c31\u662f\u60f3\u95ee\u95ee\u5e08\u59d0\u4e00\u5f00\u59cb\u90fd\u662f\u5f55\u591a\u4e45\uff0c\u55d3\u5b50\u75bc\u6216\u75d2\u65f6\u6709\u4ec0\u4e48\u65b9\u6cd5\u7f13\u89e3\u201d **(\u5173\u6ce8\u5b9e\u64cd\u7ec6\u8282\u4e0e\u53ef\u6301\u7eed\u6027\uff0c\u5fc3\u6001\u5e73\u7a33)**\n3. > \u201c\u5e08\u59d0\uff0c\u6211\u8fd8\u6ca1\u6709\u53bb\u559c\u9a6c\u5b9e\u540d\u8ba4\u8bc1\uff0c\u9700\u8981\u7acb\u5373\u53bb\u4e48\uff0c\u8fdf\u70b9\u884c\u5417\uff1f\u6d41\u7a0b\u662f\uff1f\u5bf9\u4f53\u5236\u5185\u4eba\u5458\u6709\u9650\u5236\u4e48\uff1f\u201d **(\u903b\u8f91\u6e05\u6670\uff0c\u8003\u8651\u5468\u5168\uff0c\u4e3b\u52a8\u6392\u9664\u969c\u788d)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u9700\u6c42\uff08\u7ecf\u6d4e\u4fdd\u969c\uff09\u4e0e\u5c0a\u91cd\u9700\u6c42\uff08\u4e13\u4e1a\u8ba4\u53ef\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u6267\u884c\u7684\u788e\u7247\u5316\u5b66\u4e60\u8def\u5f84\uff0c\u5e76\u786e\u4fdd\u5176\u6bcf\u4e00\u6b65\u52aa\u529b\u90fd\u80fd\u83b7\u5f97\u4e13\u4e1a\u53cd\u9988\u548c\u5fae\u5c0f\u6b63\u53cd\u9988\uff0c\u4e25\u9632\u56e0\u201c\u6ca1\u65f6\u95f4\u201d\u5bfc\u81f4\u7684\u8fdb\u5ea6\u5d29\u584c\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168/\u5c0a\u91cd\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\"}\n```";
