    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u4e0e\u98ce\u63a7\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u96c6\u4e2d\u4e8e\u4f53\u9a8c\u8425\u6d41\u7a0b\uff0c\u7f3a\u4e4f\u7528\u6237\u80cc\u666f\u3001\u5bb6\u5ead\u51b3\u7b56\u3001\u652f\u4ed8\u80fd\u529b\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u7b49\u5173\u952e\u4fe1\u606f\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u4f4e\u7eaf\u5ea6\uff0c\u53d8\u73b0\u9a71\u52a8\u4e3a\u4e3b**\u3002\u7528\u6237\u5bf9\u201c\u5e72\u97f3\u6bcf\u5c0f\u65f6570\u5143\u201d\u3001\u201c\u659c\u6760\u5c97\u4f4d\u201d\u3001\u201c\u53d8\u73b0\u65b9\u5f0f\u201d\u7b49\u7ecf\u6d4e\u56de\u62a5\u4fe1\u606f\u654f\u611f\uff0c\u591a\u6b21\u8be2\u95ee\u64cd\u4f5c\u7ec6\u8282\u3002\u867d\u8868\u793a\u201c\u9002\u5408\uff0c\u56e0\u4e3a\u8fd9\u91cc\u9762\u6709\u597d\u591a\u79cd\u7c7b\u201d\uff0c\u4f46\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u5bfb\u627e\u201c\u603b\u6709\u4e00\u6b3e\u9002\u5408\u6211\u201d\u7684\u53d8\u73b0\u9014\u5f84\uff0c\u5174\u8da3\u63a2\u7d22\u4e0e\u6280\u80fd\u63d0\u5347\u52a8\u673a\u5f31\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u4fe1\u606f\u4e0d\u8db3\uff0c\u503e\u5411\u4e2d\u4f4e**\u3002\u4ec5\u77e5\u7528\u6237\u4f7f\u7528\u624b\u673a\u5f55\u97f3\uff0c\u5bf9\u4e13\u4e1a\u672f\u8bed\uff08\u5982\u5e72\u97f3\u3001\u7acb\u4f53\u58f0\uff09\u4e0d\u719f\u6089\uff0c\u5b66\u4e60\u521d\u671f\u53cd\u9988\u201c\u5934\u6655\u201d\u3001\u201c\u8fd8\u4e0d\u4f1a\u64cd\u4f5c\u201d\uff0c\u8868\u660e\u6280\u80fd\u4e0e\u8ba4\u77e5\u57fa\u7840\u8584\u5f31\u3002**\u672a\u63d0\u53ca\u65f6\u95f4\u3001\u8bbe\u5907\u3001\u7ecf\u6d4e\u7b49\u8d44\u6e90\u72b6\u51b5**\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u4e2d\u7b49\u504f\u4f4e\uff0c\u5b58\u5728\u754f\u96be\u4e0e\u4f9d\u8d56**\u3002\u7528\u6237\u80fd\u5b8c\u6210\u6253\u5361\u3001\u8ddf\u7ec3\u7b49\u6307\u4ee4\u6027\u4efb\u52a1\uff0c\u4f46\u9047\u5230\u56f0\u96be\u65f6\uff08\u5982\u7ed5\u53e3\u4ee4\u5bfc\u81f4\u201c\u5634\u5df4\u5e72\uff0c\u5589\u5499\u75db\u201d\u3001\u6280\u5de7\u201c\u597d\u96be\u6539\u53d8\u201d\uff09\u6613\u4ea7\u751f\u632b\u8d25\u611f\uff0c\u5e76\u591a\u6b21\u5411\u9500\u552e\u5bfb\u6c42\u64cd\u4f5c\u6307\u5bfc\uff08\u201c\u600e\u4e48\u4f7f\u7528\uff1f\u4e0d\u4f1a\u201d\uff09\uff0c\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u4f9d\u8d56\u6027\u548c\u8f83\u4f4e\u7684\u81ea\u4e3b\u89e3\u51b3\u95ee\u9898\u97e7\u6027\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u5df2\u652f\u4ed8**\u3002\u8bb0\u5f55\u663e\u793a\u7528\u6237\u9886\u53d6\u52a9\u5b66\u91d1\u4f18\u60e0\u5238\u5e76\u5b8c\u6210\u652f\u4ed8\uff08\u201c\u4f60\u7684\u8d26\u5355\u201d\uff09\uff0c\u9500\u552e\u786e\u8ba4\u652f\u4ed8\u540e\u79fb\u7fa4\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u7f3a\u5931**\u3002\u5168\u7a0b\u65e0\u4efb\u4f55\u5bb6\u5ead\u3001\u914d\u5076\u6216\u8d22\u52a1\u5171\u540c\u51b3\u7b56\u4eba\u76f8\u5173\u4fe1\u606f\u63d0\u53ca\u3002**\u6b64\u4e3a\u91cd\u5927\u4fe1\u606f\u7f3a\u53e3\u4e0e\u98ce\u9669\u70b9**\u3002\n*   **\u6b65\u9aa41-4 \u5224\u5b9a**: **C\u7c7b\uff08\u6613\u611f\u578b\uff09**\u3002\u7528\u6237\u52a8\u673a\u4ee5\u5feb\u901f\u53d8\u73b0\u4e3a\u4e3b\uff08M-\uff09\uff0c\u8d44\u6e90\u5e95\u5ea7\u4e0d\u660e\u4f46\u521d\u59cb\u8868\u73b0\u663e\u8584\u5f31\uff08R-\uff09\uff0c\u5fc3\u7406\u5f39\u6027\u4e00\u822c\uff08E0\uff09\u3002\u7b26\u5408C\u7c7b\u7279\u5f81\uff1a\u6613\u88ab\u201c\u591a\u5c97\u4f4d\u201d\u3001\u201c\u9ad8\u5355\u4ef7\u201d\u5ba3\u4f20\u5438\u5f15\uff0c\u5bf9\u884c\u4e1a\u8ba4\u77e5\u6d45\uff0c\u6297\u632b\u6298\u80fd\u529b\u4e00\u822c\uff0c\u51b3\u7b56\u53ef\u80fd\u51b2\u52a8\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b: T7 \u6295\u673a\u8bd5\u6c34\u8005**\n    *   **\u7279\u5f81\u543b\u5408**\uff1a\u6838\u5fc3\u8bc9\u6c42\u662f\u5bfb\u627e\u4f4e\u95e8\u69db\u3001\u591a\u9009\u62e9\u7684\u201c\u8d5a\u94b1\u201d\u673a\u4f1a\uff08\u201c\u603b\u6709\u4e00\u6b3e\u9002\u5408\u6211\u201d\uff09\u3002\u5bf9\u884c\u4e1a\u5177\u4f53\u6280\u80fd\uff08\u5982\u5e72\u97f3\u683c\u5f0f\uff09\u548c\u957f\u671f\u6295\u5165\u7f3a\u4e4f\u8ba4\u77e5\uff0c\u884c\u52a8\u4e0a\u8868\u73b0\u4e3a\u914d\u5408\u6253\u5361\u3001\u9886\u8d44\u6599\uff0c\u4f46\u6df1\u5165\u5b66\u4e60\u548c\u81ea\u4e3b\u63a2\u7d22\u610f\u613f\u5f31\u3002\u6613\u88ab\u201c\u591a\u79cd\u7c7b\u201d\u3001\u201c\u9ad8\u65f6\u85aa\u201d\u8bdd\u672f\u4fc3\u5355\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u98ce\u9669\u7b49\u7ea7\uff1a**\u4e2d**)\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u9884\u671f\u843d\u5dee (\u9ad8\u98ce\u9669)**\uff1a\u9500\u552e\u8fc7\u5ea6\u6e32\u67d3\u201c\u591a\u79cd\u53d8\u73b0\u6e20\u9053\u201d\u3001\u201c570\u5143/\u65f6\u201d\u3001\u201c\u659c\u6760\u5c97\u4f4d\u201d\uff0c\u7528\u6237\u53ef\u80fd\u8bef\u4ee5\u4e3a\u5b66\u4e60\u540e\u80fd\u5feb\u901f\u3001\u8f7b\u677e\u83b7\u5f97\u7c7b\u4f3c\u6536\u5165\u3002\u5b9e\u9645\u5b66\u4e60\u66f2\u7ebf\u548c\u63a5\u5355\u96be\u5ea6\u53ef\u80fd\u5bfc\u81f4\u5f3a\u70c8\u5931\u671b\u3002\n    2.  **\u5b66\u4e60\u632b\u8d25 (\u4e2d\u98ce\u9669)**\uff1a\u7528\u6237\u5df2\u8868\u73b0\u51fa\u5bf9\u6280\u5de7\u5b66\u4e60\u7684\u754f\u96be\u60c5\u7eea\uff08\u201c\u597d\u96be\u6539\u53d8\u201d\u3001\u201c\u5934\u6655\u201d\uff09\u3002\u6b63\u5f0f\u8bfe\u7a0b\u82e5\u96be\u5ea6\u63d0\u5347\uff0c\u632b\u8d25\u611f\u53ef\u80fd\u52a0\u5267\u3002\n    3.  **\u5bb6\u5ead\u53cd\u5bf9 (\u9ad8\u98ce\u9669)**\uff1a**\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u5b8c\u5168\u7f3a\u5931**\uff0c\u662f\u6781\u9ad8\u98ce\u9669\u9879\u3002\u652f\u4ed8\u53ef\u80fd\u672a\u7ecf\u914d\u5076\u6216\u5bb6\u5ead\u4e3b\u8981\u6210\u5458\u540c\u610f\u3002\n    4.  **\u7ecf\u6d4e\u538b\u529b (\u4fe1\u606f\u7f3a\u5931)**\uff1a\u65e0\u6cd5\u5224\u65ad\u3002\n    5.  **\u65f6\u95f4\u51b2\u7a81 (\u4fe1\u606f\u7f3a\u5931)**\uff1a\u65e0\u6cd5\u5224\u65ad\u3002\n    6.  **\u6548\u679c\u8d28\u7591 (\u4e2d\u98ce\u9669)**\uff1a\u7528\u6237\u5bf9\u81ea\u8eab\u6539\u53d8\u80fd\u529b\u4fe1\u5fc3\u4e0d\u8db3\uff0c\u82e5\u521d\u671f\u7ec3\u4e60\u6548\u679c\u4e0d\u660e\u663e\uff0c\u6613\u8d28\u7591\u8bfe\u7a0b\u4ef7\u503c\u3002\n    7.  **\u9500\u552e\u8bef\u5bfc (\u4e2d\u98ce\u9669)**\uff1a\u9500\u552e\u8bdd\u672f\u5b58\u5728**\u5938\u5927\u63a5\u5355\u673a\u4f1a\u548c\u6536\u5165**\u7684\u503e\u5411\uff08\u5982\u5f3a\u8c03\u201c\u624b\u673a\u5373\u53ef\u201d\u3001\u201c\u5404\u79cd\u5355\u5b50\u63d0\u4f9b\u201d\uff09\uff0c\u53ef\u80fd\u57cb\u4e0b\u6295\u8bc9\u9690\u60a3\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u4e3b\u8981\u96f7\u533a**\uff1a\n    *   **\u5938\u5927\u5ba3\u4f20\u4e0e\u627f\u8bfa**\uff1a\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c570\u5143/\u65f6\u201d\u3001\u201c\u4e8c\u5341\u51e0\u79cd\u53d8\u73b0\u65b9\u5f0f\u201d\u3001\u201c\u559c\u9a6c\u5ae1\u7cfb\u6f14\u64ad\u5e08\u201d\u3001\u201c\u5e08\u5144\u7f69\u7740\u4f60\u201d\u7b49\uff0c**\u5b58\u5728\u8fc7\u5ea6\u627f\u8bfa\u548c\u6a21\u7cca\u5e73\u53f0\u5b98\u65b9\u89d2\u8272\u98ce\u9669**\u3002\n    *   **\u5236\u9020\u7d27\u8feb\u4e0e\u7a00\u7f3a**\uff1a\u9891\u7e41\u4f7f\u7528\u201c\u6700\u540e\u4e00\u573a\u201d\u3001\u201c\u73b0\u573a\u53d1\u4e66\u201d\u3001\u201c\u5f00\u542f\u62a5\u540d\u901a\u9053\u201d\u3001\u201c\u52a1\u5fc5\u201d\u3001\u201c\u4e0d\u8981\u5f71\u54cd\u5165\u9a7b\u201d\u7b49\u8bdd\u672f\uff0c\u8425\u9020\u7d27\u8feb\u611f\u3002\n    *   **\u5bb6\u5ead\u51b3\u7b56\u6838\u67e5\u7f3a\u5931**\uff1a**\u5168\u7a0b\u672a\u8be2\u95ee\u6216\u786e\u8ba4\u652f\u4ed8\u662f\u5426\u4e3a\u4e2a\u4eba\u72ec\u7acb\u51b3\u7b56\u6216\u5df2\u83b7\u5bb6\u5ead\u652f\u6301**\uff0c\u4e25\u91cd\u8fdd\u53cd\u98ce\u63a7\u6d41\u7a0b\u3002\n    *   **\u98ce\u9669\u63d0\u793a\u4e0d\u8db3**\uff1a\u804a\u5929\u8bb0\u5f55\u672a\u89c1\u5bf9\u5b66\u4e60\u96be\u5ea6\u3001\u53d8\u73b0\u5468\u671f\u3001\u53ef\u80fd\u6295\u5165\u7b49\u98ce\u9669\u8fdb\u884c\u5145\u5206\u63d0\u793a\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**: **\u504f\u5dee**\u3002\u7528\u6237\u4e3a\u5bfb\u6c42\u5feb\u901f\u3001\u591a\u5143\u53d8\u73b0\u7684T7\u6295\u673a\u8bd5\u6c34\u8005\uff0c\u4f46\u4ea7\u54c1\u9700\u8981\u957f\u671f\u7684\u58f0\u97f3\u8bad\u7ec3\u548c\u6280\u80fd\u79ef\u7d2f\u3002\u7528\u6237\u9884\u671f\u4e0e\u4ea7\u54c1\u4ea4\u4ed8\u8def\u5f84\u5b58\u5728\u9519\u914d\u98ce\u9669\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**:\n    1.  **24\u5c0f\u65f6\u5185\u7d27\u6025\u5bb6\u5ead\u77e5\u60c5\u6838\u67e5**\uff1a\u5fc5\u987b\u901a\u8fc7\u7535\u8bdd\u6216\u4e25\u8083\u6587\u5b57\uff0c\u6b63\u5f0f\u5411\u7528\u6237\u786e\u8ba4\u672c\u6b21\u62a5\u540d\u53ca\u652f\u4ed8\u662f\u5426\u5df2\u83b7\u5f97\u914d\u5076\u6216\u5bb6\u5ead\u4e3b\u8981\u8d22\u52a1\u6210\u5458\u7684\u77e5\u6653\u4e0e\u540c\u610f\u3002**\u8fd9\u662f\u9996\u8981\u98ce\u63a7\u52a8\u4f5c**\u3002\n    2.  **\u9996\u5468\u91cd\u70b9\u6821\u6b63\u53d8\u73b0\u9884\u671f**\uff1a\u660e\u786e\u544a\u77e5\u6709\u58f0\u4e66\u6f14\u64ad\u884c\u4e1a\u7684\u6536\u5165\u66f2\u7ebf\u3001\u63a5\u5355\u95e8\u69db\u3001\u6280\u80fd\u6210\u957f\u5468\u671f\uff0c\u7528\u771f\u5b9e\u6848\u4f8b\u66ff\u4ee3\u9500\u552e\u671f\u7684\u201c\u753b\u997c\u201d\u8bdd\u672f\u3002\u7ba1\u7406\u5176\u201c\u5feb\u901f\u8bd5\u904d\u6240\u6709\u5c97\u4f4d\u201d\u7684\u4e0d\u5207\u5b9e\u9645\u60f3\u6cd5\u3002\n    3.  **\u5f3a\u5316\u8fc7\u7a0b\u9f13\u52b1\u4e0e\u5fae\u5c0f\u6b63\u53cd\u9988**\uff1a\u9488\u5bf9\u5176\u6613\u754f\u96be\u7684\u7279\u70b9\uff0c\u5728\u521d\u671f\u7ec3\u4e60\u4e2d\u7ed9\u4e88\u66f4\u5bc6\u96c6\u7684\u7ec6\u8282\u80af\u5b9a\u548c\u9f13\u52b1\uff0c\u5e2e\u52a9\u5176\u5efa\u7acb\u201c\u6539\u53d8\u53ef\u80fd\u201d\u7684\u4fe1\u5fc3\uff0c\u907f\u514d\u65e9\u671f\u6d41\u5931\u3002\n    4.  **\u5173\u6ce8\u5b66\u4e60\u8fdb\u5ea6\u4e0e\u4e92\u52a8**\uff1a\u5bc6\u5207\u7559\u610f\u5176\u5b8c\u6210\u4f5c\u4e1a\u7684\u8d28\u91cf\u548c\u60c5\u7eea\u53cd\u9988\uff0c\u5bf9\u201c\u5934\u6655\u201d\u3001\u201c\u4e0d\u4f1a\u64cd\u4f5c\u201d\u7b49\u4fe1\u53f7\u53ca\u65f6\u63d0\u4f9b\u6e05\u6670\u3001\u8010\u5fc3\u7684\u6307\u5bfc\uff0c\u9632\u6b62\u632b\u8d25\u611f\u7d2f\u79ef\u3002\n\n{\"core_type\": \"T7 \u6295\u673a\u8bd5\u6c34\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"24h\u5185\u7d27\u6025\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\"}";
