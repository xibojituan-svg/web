d\u7684\u70b9\u8bc4\u53ef\u4ee5\u6211\u5148\u6765\u4e48\uff1f\u201d (\u4e3b\u52a8\u627f\u62c5)\n  > \u201c\u6211\u7684\u5b81\u8bfb\u6210\u4e8c\u58f0\u4e86\uff0c\u5e94\u8be5\u662f\u56db\u58f0\u201d (\u81ea\u6211\u7ea0\u9519\uff0c\u8ffd\u6c42\u4e13\u4e1a)\n  > \u201c@\u5189\u5189\u2005\u9996\u9875\u2018\u5546\u5355\u4efb\u52a1\u2019\u90a3\u91cc\u70b9\u8fdb\u53bb\uff0c\u9996\u9009\u201820%\u2019\u5206\u6210\u7684\uff0c\u8981\u770b\u6e05\u7537\u9891\u5973\u9891\u54c8\u201d (\u4e3b\u52a8\u5206\u4eab\u63a5\u5355\u8def\u5f84\uff0c\u52a1\u5b9e)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u5df2\u8d2d\u4e70sE2200\u8bbe\u5907\u5957\u88c5\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u6295\u5165\u610f\u613f\u548c\u80fd\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u65f6\u95f4\u788e\u7247\u5316\uff0c\u6709\u660e\u786e\u7684\u65f6\u95f4\u9650\u5236\uff08\u5341\u70b9\u534a\u540e\u65e0\u6cd5\u5f00\u9ea6\uff09\uff0c\u4f46\u80fd\u575a\u6301\u5b66\u4e60\u3001\u4ea4\u4f5c\u4e1a\u3001\u53c2\u4e0e\u793e\u7fa4\u4e92\u52a8\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u4f53\u73b0\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8 (7-8\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9762\u5bf9\u6280\u672f\u95ee\u9898\uff08\u7535\u8111\u914d\u7f6e\u3001\u6587\u4ef6\u547d\u540d\u3001\u524d\u540e\u9f3b\u97f3\u9519\u8bef\uff09\u65f6\uff0c\u6001\u5ea6\u79ef\u6781\uff0c\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\u6216\u5766\u7136\u63a5\u53d7\u6307\u6b63\uff0c\u65e0\u60c5\u7eea\u5d29\u6e83\u8ff9\u8c61\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u95ee\u9898\u8fd8\u4e0d\u5c11[\u7834\u6d95\u4e3a\u7b11] \u591a\u8c22\u6307\u51fa\u54c8[\u73ab\u7470]\u201d (\u9762\u5bf9\u6279\u8bc4\uff0c\u5fc3\u6001\u5e73\u548c\uff0c\u79ef\u6781\u611f\u8c22)\n  > \u201c\u73ed\u73ed\uff0c\u5192\u53f7\u5220\u6389\u4e86\u4f1a\u5f71\u54cd\u5417\uff1f\u201d (\u9047\u5230\u64cd\u4f5c\u95ee\u9898\uff0c\u51b7\u9759\u8be2\u95ee)\n  > \u201c\u597d\u7684\uff0c\u9700\u8981\u665a\u4e0a\u624d\u80fd\u88c5\u201d (\u9762\u5bf9\u8bbe\u5907\u5b89\u88c5\u7684\u7cfb\u7edf\u517c\u5bb9\u95ee\u9898\uff0c\u4ece\u5bb9\u5b89\u6392)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 (Esteem Needs)** \u4e0e **\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42 (Social Needs)** \u5e76\u91cd\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u6e34\u671b\u901a\u8fc7\u4e13\u4e1a\u80fd\u529b\u7684\u7cbe\u8fdb\u83b7\u5f97\u8ba4\u53ef\uff08\u5c0a\u91cd\uff09\uff0c\u540c\u65f6\u5728\u793e\u7fa4\u4e2d\u5efa\u7acb\u4e92\u52a9\u3001\u88ab\u9700\u8981\u7684\u5173\u7cfb\uff08\u793e\u4ea4\u5f52\u5c5e\uff09\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u8d4b\u4e88\u5176\u201c\u73ed\u7ea7\u5efa\u8bbe\u8005\u201d\u7684\u8eab\u4efd\u8ba4\u540c\u4e0e\u6743\u529b\u611f**\uff0c\u8ba9\u5979\u5728\u5e2e\u52a9\u4ed6\u4eba\u548c\u7edf\u7b79\u4e8b\u52a1\u4e2d\u83b7\u5f97\u6210\u5c31\u611f\u548c\u5c0a\u91cd\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe2 A\u7c7b** (\u9ad8\u4ef7\u503c\u9886\u8896\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T1-A \u5bfc\u6f14\u578b\u9886\u8896** (\u8fdb\u5316\u524d\u4f53\uff1a\u6df7\u5408\u4f533\u53f7 \u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u5f53\u524d\u884c\u4e3a\u672a\u663e\u793a\u5bb6\u5ead\u538b\u529b\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u65f6\u95f4\u867d\u788e\u7247\u5316\uff0c\u4f46\u5b66\u4e60\u610f\u613f\u5f3a\uff0c\u80fd\u4e3b\u52a8\u514b\u670d\u73af\u5883\u9650\u5236\uff08\u5982\u8499\u88ab\u5b50\u5f55\u97f3\uff09\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u5766\u7136\u9762\u5bf9\u9519\u8bef\u548c\u6307\u6b63\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u82e5\u957f\u671f\u63a5\u4e0d\u5230\u5546\u5355\uff0c\u5176\u201c\u52a1\u5b9e\u53d8\u73b0\u201d\u7684\u671f\u671b\u53ef\u80fd\u53d7\u632b\u3002\u9700\u63d0\u524d\u7ba1\u7406\u9884\u671f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe2-3\u4e2a\u6708\u540e\uff0c\u82e5\u6301\u7eed\u65e0\u63a5\u5355\u6210\u679c\uff0c\u53ef\u80fd\u4ea7\u751f\u4ef7\u503c\u8d28\u7591\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4eae\u4eae\uff0c\u6211\u6ce8\u610f\u5230\u4f60\u7279\u522b\u70ed\u5fc3\uff0c\u4e5f\u5f88\u6709\u9886\u5bfc\u529b\u3002\u54b1\u4eec\u73ed\u4ee5\u540e\u7684\u7ec4\u7ec7\u548c\u4e92\u52a9\uff0c\u53ef\u80fd\u8981\u591a\u62dc\u6258\u4f60\u5566\u3002\u6709\u4efb\u4f55\u7edf\u7b79\u4e0a\u7684\u60f3\u6cd5\uff0c\u4f60\u968f\u65f6\u63d0\uff0c\u73ed\u73ed\u7ed9\u4f60\u5168\u529b\u652f\u6301\uff01\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** + **\u3010\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\u3011**\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**D\u6a21\u5757 (\u8eab\u4efd\u4e0e\u6743\u529b\u5149\u73af\u6c60)**\uff1a\u8fc5\u901f\u8d4b\u4e88\u5176\u201c\u5c0f\u7ec4\u957f\u201d\u3001\u201c\u4f5c\u4e1a\u7edf\u8ba1\u5b98\u201d\u6216\u201c\u65b0\u4eba\u5f15\u5bfc\u5458\u201d\u7b49\u975e\u6b63\u5f0f\u5934\u8854\uff0c\u4e0b\u653e\u90e8\u5206\u73ed\u7ea7\u7ba1\u7406\u6743\u9650\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u547d\u4ee4\u6216\u5c45\u9ad8\u4e34\u4e0b\u7684\u53e3\u543b\u4e0e\u5979\u6c9f\u901a\uff1b\u5ffd\u89c6\u6216\u5426\u5b9a\u5979\u7684\u7ec4\u7ec7\u8d21\u732e\uff1b\u5728\u5979\u4e3b\u52a8\u5e2e\u5fd9\u65f6\u6cfc\u51b7\u6c34\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u63a8\u4ecb\u9ad8\u9636\u6280\u672f\u8bfe\u7a0b\uff08\u5982\u540e\u671f\u7cbe\u4fee\u3001\u8bbe\u5907\u8fdb\u9636\uff09\uff0c\u4f46\u9700\u57fa\u4e8e\u5176\u5f53\u524d\u5b66\u4e60\u8fdb\u5ea6\uff0c**\u5207\u5fcc\u5728\u5979\u57fa\u7840\u672a\u7a33\u65f6\u4ea4\u53c9\u63a8\u9500\u5bfc\u81f4\u77e5\u8bc6\u8fc7\u8f7d**\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u4eca\u5929\u70b9\u8bc4\u4eb2\u7231\u7684\u540c\u5b66\u4eec\uff0c\u6211\u5341\u70b9\u534a\u6709\u4e8b\uff0c\u4e8c\u73ed\u7684\u70b9\u8bc4\u53ef\u4ee5\u6211\u5148\u6765\u4e48\uff1f\u201d **(\u4e3b\u52a8\u7edf\u7b79)**\n2. > \u201c@\u5189\u5189\u2005\u9996\u9875\u2018\u5546\u5355\u4efb\u52a1\u2019\u90a3\u91cc\u70b9\u8fdb\u53bb\uff0c\u9996\u9009\u201820%\u2019\u5206\u6210\u7684\uff0c\u8981\u770b\u6e05\u7537\u9891\u5973\u9891\u54c8\u201d **(\u52a1\u5b9e\u52a9\u4eba)**\n3. > \u201c\u95ee\u9898\u8fd8\u4e0d\u5c11[\u7834\u6d95\u4e3a\u7b11] \u591a\u8c22\u6307\u51fa\u54c8[\u73ab\u7470]\u201d **(\u9ad8\u5fc3\u7406\u5f39\u6027\uff0c\u79ef\u6781\u9762\u5bf9\u9519\u8bef)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T1-A \u5bfc\u6f14\u578b\u9886\u8896 (\u89c9\u9192\u4e2d)\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u4e0e\u793e\u7fa4\u5f52\u5c5e\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u8fc5\u901f\u8d4b\u4e88\u5176\u73ed\u7ea7\u7ba1\u7406\u6743\u9650\uff0c\u8ba9\u5979\u6210\u4e3a\u751f\u6001\u5171\u5efa\u8005\uff0c\u6ee1\u8db3\u5176\u88ab\u9700\u8981\u548c\u638c\u63a7\u7684\u6b32\u671b\u3011**\u3002\n\n```json\n{\"core_type\": \"T1-A \u5bfc\u6f14\u578b\u9886\u8896 (\u6df7\u5408\u4f533\u53f7\u8fdb\u5316\u524d\u4f53)\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u793e\u4ea4\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u5708\u5c42\u5408\u4f19\u4eba\u7ebf\"}\n```";
