    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a676982449\u7684\u7528\u6237\u8fdb\u884c\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676982449 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-28 \u81f3 2026-04-07 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6c90\u7efe\u83c0(\u5f20\u5a49\u94b0) / \u5a77\u5a77arain-\u82cf\u5dde-\u5973\u64ad |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u5177\u4f53\u8bfe\u7a0b\u540d\u79f0\u53ca\u4ef7\u683c\u4fe1\u606f\u7f3a\u5931\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u8d44\u91d1\u6765\u6e90\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4e2d/\u9ad8\u5bbd\u88d5**\u3002\u7528\u6237\u591a\u6b21\u8868\u793a\u201c\u65f6\u95f4\u5145\u88d5\u201d\u3001\u201c\u6709\u7a7a\u201d\uff0c\u80fd\u914d\u5408\u7ea6\u5b9a\u65f6\u95f4\uff08\u598219:40\uff09\uff0c\u5e76\u79ef\u6781\u53c2\u4e0e\u5c0f\u7ec4\u4efb\u52a1\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u4fe1\u606f\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u7f3a\u4e4f\u652f\u4ed8\u3001\u5bb6\u5ead\u3001\u521d\u59cb\u52a8\u673a\u3001\u804c\u4e1a\u80cc\u666f\u7b49\u5173\u952e\u4fe1\u606f\uff0c\u5206\u6790\u4e3b\u8981\u57fa\u4e8e\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u7684\u4e92\u52a8\u884c\u4e3a\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u52a8\u673a\u6307\u5411\u6a21\u7cca**\u3002\u73b0\u6709\u8bb0\u5f55\u4e2d\u7528\u6237\u672a\u63d0\u53ca\u4efb\u4f55\u53d8\u73b0\u3001\u8d5a\u94b1\u6216\u804c\u4e1a\u53d1\u5c55\u76ee\u6807\uff0c\u4e5f\u672a\u8868\u8fbe\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u672c\u8eab\u7684\u5f3a\u70c8\u5174\u8da3\u3002\u5176\u884c\u4e3a\u66f4\u504f\u5411\u4e8e**\u5b8c\u6210\u793e\u7fa4\u4efb\u52a1\u548c\u83b7\u53d6\u793e\u4ea4\u8ba4\u53ef**\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> *\u201c\u6211\u65f6\u95f4\u662f\u6709\u7684\uff0c\u4f46\u6211\u4e0d\u4f1a\u505a\u7edf\u5466\uff01\u201d* > *\u201c\u7a81\u7136\u89c9\u5f97\u6211\u600e\u4e48\u8fd9\u4e48\u7b28\u5462\uff01\u201d*\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u672a\u77e5]** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4efb\u4f55\u8d22\u52a1\u4fe1\u606f\uff0c\u65e0\u6cd5\u5224\u65ad\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**[\u4e2d]** \u2014 \u7528\u6237\u8868\u73b0\u51fa\u8f83\u5145\u8db3\u7684\u53ef\u652f\u914d\u65f6\u95f4\uff0c\u80fd\u9891\u7e41\u54cd\u5e94\u7fa4\u6d88\u606f\u3001\u5c1d\u8bd5\u64cd\u4f5c\u8f6f\u4ef6\u3001\u5b8c\u6210\u4f5c\u4e1a\u3002\u4f46**\u6280\u672f\u64cd\u4f5c\u80fd\u529b\u662f\u660e\u663e\u77ed\u677f**\uff0c\u5728\u5b89\u88c5\u8f6f\u4ef6\u3001\u4f7f\u7528AU\u3001\u6587\u4ef6\u683c\u5f0f\u8f6c\u6362\u7b49\u73af\u8282\u53cd\u590d\u9047\u5230\u56f0\u96be\uff0c\u6d88\u8017\u5927\u91cf\u7cbe\u529b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u672a\u77e5]** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u4fe1\u606f\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b07\u4f4e\u6781\u5371]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u7528\u6237\u5728\u5b66\u4e60\u4e2d\u8868\u73b0\u51fa**\u6781\u4f4e\u7684\u81ea\u6211\u6548\u80fd\u611f**\u548c**\u9ad8\u5ea6\u4f9d\u8d56\u5916\u90e8\u786e\u8ba4**\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u3001\u64cd\u4f5c\uff09\u65f6\uff0c\u9891\u7e41\u8868\u8fbe\u81ea\u6211\u5426\u5b9a\uff08\u201c\u6211\u600e\u4e48\u8fd9\u4e48\u7b28\u201d\uff09\uff0c\u5e76\u9700\u8981\u4ed6\u4eba\u4e00\u6b65\u6b65\u6307\u5bfc\u3002\u60c5\u7eea\u6781\u6613\u53d7\u632b\uff0c\u5e76\u5c06\u632b\u8d25\u611f\u5f52\u56e0\u4e8e\u81ea\u8eab\u80fd\u529b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> *\u201c\u7a81\u7136\u89c9\u5f97\u6211\u600e\u4e48\u8fd9\u4e48\u7b28\u5462\uff01\u201d* > *\u201c\u6211\u6709\u65f6\u95f4\u5c31\u662f\u64cd\u4f5c\u4e0d\u5bf9\u5440\uff0c\u5509\ud83d\ude2e\u200d\ud83d\udca8\u201d* > *\u201c\u5509\ud83e\udd26\u53c8\u5f97\u91cd\u65b0\u5f55\u5236\u662f\u5417\u201d*\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34\u4e0e\u5f52\u5c5e\u611f** ] \u517c\u6709 **[\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42\uff08\u6e34\u671b\u88ab\u8ba4\u53ef\uff09]**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u5ea6\u7684\u4e0d\u81ea\u4fe1\u548c\u5bf9\u81ea\u6211\u4ef7\u503c\u7684\u6000\u7591**\u3002\u7528\u6237\u5728\u6280\u672f\u64cd\u4f5c\u4e0a\u7684\u5c61\u5c61\u53d7\u632b\uff0c\u66b4\u9732\u4e86\u5176\u6df1\u5c42\u6050\u60e7\u2014\u2014\u5bb3\u6015\u56e0\u201c\u7b28\u201d\u800c\u88ab\u793e\u7fa4\u629b\u5f03\u6216\u5426\u5b9a\u3002\u5176\u9891\u7e41\u7684\u793c\u8c8c\u3001\u5173\u5fc3\u4ed6\u4eba\uff08\u5982\u5173\u5fc3\u73ed\u73ed\u5403\u996d\u3001\u53d7\u59d4\u5c48\uff09\u7684\u884c\u4e3a\uff0c\u672c\u8d28\u662f**\u5bfb\u6c42\u878d\u5165\u793e\u7fa4\u3001\u83b7\u5f97\u5b58\u5728\u611f\u548c\u88ab\u63a5\u7eb3\u7684\u5b89\u5168\u611f**\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u65e0\u6761\u4ef6\u7684\u79ef\u6781\u5173\u6ce8\u4e0e\u5373\u65f6\u3001\u5177\u4f53\u7684\u80af\u5b9a**\u3002\u4ed6\u4e0d\u9700\u8981\u9ad8\u96be\u5ea6\u7684\u6311\u6218\uff0c\u800c\u662f\u9700\u8981\u5728\u4e00\u4e2a\u201c\u5b89\u5168\u201d\u7684\u73af\u5883\u91cc\uff0c\u901a\u8fc7\u5b8c\u6210\u5fae\u5c0f\u4efb\u52a1\u83b7\u5f97\u201c\u4f60\u771f\u68d2\u201d\u7684\u53cd\u9988\uff0c\u4ece\u800c\u91cd\u5efa\u81ea\u4fe1\u548c\u5f52\u5c5e\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfea C1 \u7c7b** (\u9ad8\u4e92\u52a8\u3001\u9ad8\u4f9d\u8d56\u3001\u4f4e\u81ea\u4e3b\u6027) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u5178\u578b\u7279\u5f81\uff1a\u4f4e\u5fc3\u7406\u5f39\u6027\u3001\u9ad8\u60c5\u7eea\u4f9d\u8d56\u3001\u9700\u8981\u6301\u7eed\u5b89\u629a\u4e0e\u80af\u5b9a) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u57fa\u4e8e\u73b0\u6709\u4fe1\u606f\uff0c\u672a\u53d1\u73b0\u501f\u8d37\u3001\u5bb6\u5ead\u6fc0\u70c8\u53cd\u5bf9\u7b49D\u7c7b\u7ea2\u7ebf)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u4e0d\u9002\u7528\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **[\u672a\u77e5]** | \u4fe1\u606f\u7f3a\u5931\uff0c\u9700\u540e\u7eed\u8865\u5145\u6838\u67e5\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u6280\u672f\u95e8\u69db**\uff1a\u5728\u5b89\u88c5\u8f6f\u4ef6\u3001\u4f7f\u7528AU\u3001\u6587\u4ef6\u683c\u5f0f\u8f6c\u6362\u7b49\u57fa\u7840\u64cd\u4f5c\u4e0a\u6301\u7eed\u5361\u58f3\uff0c\u4ea7\u751f\u201c\u6211\u5b66\u4e0d\u4f1a\u201d\u7684\u7edd\u671b\u611f\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | **\u81ea\u5c0a\u5fc3\u53d7\u632b**\uff1a\u4f5c\u4e1a\u88ab\u9000\u56de\u3001\u64cd\u4f5c\u88ab\u6307\u51fa\u9519\u8bef\u3001\u770b\u5230\u522b\u4eba\u6bd4\u81ea\u5df1\u8fdb\u5ea6\u5feb\u65f6\uff0c\u6781\u6613\u56e0\u201c\u89c9\u5f97\u81ea\u5df1\u7b28\u201d\u800c\u60c5\u7eea\u5d29\u6e83\uff0c\u840c\u751f\u9000\u610f\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u867d\u7136\u5f53\u524d\u672a\u63d0\u53d8\u73b0\uff0c\u4f46\u5982\u679c\u8fdb\u5165\u63a5\u5355\u6216\u5b9e\u6218\u9636\u6bb5\uff0c\u53d1\u73b0\u81ea\u5df1\u4ed8\u51fa\u5de8\u5927\u52aa\u529b\u5374\u65e0\u6210\u679c\uff0c\u4f1a\u4ea7\u751f\u5f3a\u70c8\u7684\u201c\u4e0d\u503c\u5f97\u201d\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c\u4e00\u5468\u81f3\u7b2c\u4e8c\u5468**\u3002\u6b64\u65f6\u6b63\u662f\u63a5\u89e6\u8f6f\u4ef6\u3001\u5b8c\u6210\u7b2c\u4e00\u6b21\u6280\u672f\u6027\u4f5c\u4e1a\u7684\u65f6\u671f\uff0c\u662f\u5176\u632b\u8d25\u611f\u548c\u81ea\u6211\u6000\u7591\u7684\u9876\u5cf0\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> **\u201c\u5c0f\u5218\u540c\u5b66\u4f60\u597d\u5440\uff01\u770b\u5230\u4f60\u7279\u522b\u79ef\u6781\u5730\u914d\u5408\u5c0f\u7ec4\u5de5\u4f5c\uff0c\u771f\u7684\u8d85\u6709\u8d23\u4efb\u5fc3\uff01\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u7a0b\u524d\u671f\u4f1a\u63a5\u89e6\u4e00\u4e9b\u65b0\u8f6f\u4ef6\uff0c\u5c31\u50cf\u5b66\u5f00\u8f66\u4e00\u6837\uff0c\u521a\u5f00\u59cb\u8c01\u90fd\u4f1a\u6709\u70b9\u624b\u5fd9\u811a\u4e71\uff0c\u8fd9\u592a\u6b63\u5e38\u4e86\u3002\u4f60\u5343\u4e07\u522b\u7740\u6025\uff0c\u6709\u4efb\u4f55\u5361\u4f4f\u7684\u5730\u65b9\uff0c\u968f\u65f6@\u6211\u6216\u8005\u7ec4\u957f\uff0c\u6211\u4eec\u4e00\u6b65\u6b65\u5e26\u4f60\u8d70\u901a\u3002\u8bb0\u4f4f\u54e6\uff0c\u5728\u8fd9\u91cc\u6ca1\u6709\u2018\u7b28\u2019\u8fd9\u4e2a\u5b57\uff0c\u53ea\u6709\u2018\u6b63\u5728\u719f\u7ec3\u4e2d\u2019\uff01\u201d**\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5174\u8da3\u6e38\u4e50\u7ebf\u3011**\u3002\u6838\u5fc3\u76ee\u6807\u662f\u7ef4\u6301\u5176\u5b66\u4e60\u5174\u8da3\u548c\u793e\u7fa4\u53c2\u4e0e\u611f\uff0c\u800c\u975e\u5f3a\u6c42\u6280\u672f\u7cbe\u901a\u6216\u5feb\u901f\u53d8\u73b0\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u5305\u542b\uff1a1\uff09**\u50bb\u74dc\u5f0f\u56fe\u6587/\u89c6\u9891\u64cd\u4f5c\u6307\u5357**\uff08\u6bcf\u4e00\u6b65\u622a\u56fe\uff09\uff1b2\uff09**\u201c\u6bcf\u65e5\u5c0f\u6210\u5c31\u201d\u6253\u5361\u9f13\u52b1**\uff1b3\uff09**\u907f\u514d\u5728\u516c\u5f00\u573a\u5408\u6307\u51fa\u5176\u6280\u672f\u9519\u8bef**\uff0c\u79c1\u804a\u6307\u5bfc\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9T6\u7528\u6237\u516c\u5f00\u6279\u8bc4\u6216\u5bf9\u6bd4**\u3002\u5982\u201c\u4f60\u770bXX\u540c\u5b66\u505a\u5f97\u5c31\u5f88\u597d\u201d\u3002\n    2. **\u7edd\u4e0d\u5e03\u7f6e\u8d85\u51fa\u5176\u5f53\u524d\u80fd\u529b\u8303\u56f4\u7684\u590d\u6742\u4efb\u52a1**\uff08\u5982\u72ec\u7acb\u5bf9\u8f68\u3001\u590d\u6742\u540e\u671f\uff09\u3002\n    3. **\u7edd\u4e0d\u5728\u5176\u8868\u8fbe\u201c\u7b28\u201d\u7684\u65f6\u5019\u8bb2\u5927\u9053\u7406\u6216\u704c\u9e21\u6c64**\uff0c\u5e94\u76f4\u63a5\u7ed9\u51fa\u4e0b\u4e00\u6b65\u53ef\u6267\u884c\u7684\u3001\u6700\u7b80\u5355\u7684\u52a8\u4f5c\u6307\u4ee4\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u5176\u5efa\u7acb\u7a33\u5b9a\u81ea\u4fe1\u548c\u5b8c\u6210\u57fa\u7840\u5b66\u4e60\u95ed\u73af\u524d\uff0c\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u662f\u5c06\u5176\u63a8\u5411\u9000\u8d39\u8fb9\u7f18\u7684\u5bfc\u706b\u7d22\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > *\u201c\u7a81\u7136\u89c9\u5f97\u6211\u600e\u4e48\u8fd9\u4e48\u7b28\u5462\uff01\u6211\u662f\u753b57\u7ae0\u7684\u5427\u201d*  \u2014\u2014 **\u6838\u5fc3\u8bc1\u636e\uff1a\u5178\u578b\u7684\u81ea\u6211\u5426\u5b9a\u548c\u4f4e\u81ea\u6211\u6548\u80fd\u611f\u8868\u8fbe\u3002**\n2. > *\u201c\u6211\u6709\u65f6\u95f4\u5c31\u662f\u64cd\u4f5c\u4e0d\u5bf9\u5440\uff0c\u5509\ud83d\ude2e\u200d\ud83d\udca8\u201d* \u2014\u2014 **\u6838\u5fc3\u8bc1\u636e\uff1a\u5c06\u632b\u6298\u5f52\u56e0\u4e8e\u81ea\u8eab\u80fd\u529b\uff0c\u800c\u975e\u5ba2\u89c2\u56f0\u96be\uff0c\u5fc3\u7406\u5f39\u6027\u6781\u4f4e\u3002**\n3. > *\u201c\u5509\ud83e\udd26\u53c8\u5f97\u91cd\u65b0\u5f55\u5236\u662f\u5417\u201d* \u2014\u2014 **\u6838\u5fc3\u8bc1\u636e\uff1a\u9762\u5bf9\u5fae\u5c0f\u632b\u6298\uff08\u91cd\u5f55\uff09\u65f6\u7684\u6cae\u4e27\u548c\u65e0\u529b\u611f\uff0c\u7f3a\u4e4f\u653b\u575a\u514b\u96be\u7684\u97e7\u6027\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u793e\u7fa4\u5f52\u5c5e\u4e0e\u8ba4\u53ef\uff0c\u4ee5\u5bf9\u6297\u6df1\u5c42\u7684\u81ea\u5351\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u50bb\u74dc\u5f0f\u64cd\u4f5c\u6307\u5f15 + \u9ad8\u9891\u6b21\u3001\u5177\u4f53\u5316\u7684\u60c5\u7eea\u4ef7\u503c\u80af\u5b9a\uff0c\u4e3a\u5176\u6253\u9020\u4e00\u4e2a\u201c\u96f6\u632b\u8d25\u611f\u201d\u7684\u5b66\u4e60\u5b89\u5168\u533a\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u793e\u4ea4/\u5c0a\u91cd\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf+\u7597\u6108\u966a\u4f34\u8f85\u52a9\u5305\"}\n```";
