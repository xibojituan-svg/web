    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## \u4e00\u3001 \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a**\u9ad8**\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5b66\u4e60\u4e0e\u5b9e\u64cd\u52a8\u673a\uff0c\u4e3b\u52a8\u63d0\u95ee\u6280\u672f\u7ec6\u8282\uff08\u5982\u77ed\u6545\u4e8b\u6392\u7248\u3001\u97f3\u9891\u7535\u5e73\u63a7\u5236\uff09\u3001\u8ddf\u8fdb\u4f5c\u4e1a\u3001\u7b7e\u7ea6\u6295\u7a3f\u3001\u53c2\u4e0e\u8fdb\u9636\u73ed\uff0c\u5e76\u79ef\u6781\u4e0e\u540c\u5b66\u4e92\u52a8\u534f\u4f5c\uff08\u5982\u8bf7\u6c42\u914d\u97f3\uff09\u3002\u52a8\u673a\u805a\u7126\u4e8e\u6280\u80fd\u63d0\u5347\u4e0e\u53d8\u73b0\u5b9e\u8df5\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4e2d\u7b49**\u3002\u7528\u6237\u6709\u5b66\u4e60\u8bbe\u5907\u5e76\u80fd\u8fdb\u884c\u5f55\u97f3\u64cd\u4f5c\uff0c\u4f46\u5b58\u5728**\u65f6\u95f4\u4e0e\u7cbe\u529b\u5206\u6563**\u7684\u660e\u786e\u7ea6\u675f\uff1a\u9700\u7167\u987e\u5c0f\u5b69\u3001\u5904\u7406\u5bb6\u4e8b\uff08\u88c5\u4fee\u3001\u5e26\u5c0f\u5b69\u5c31\u533b\uff09\u3001\u7ecf\u8425\u751f\u610f\u3002\u8fd9\u4e9b\u56e0\u7d20\u9650\u5236\u4e86\u5176\u8fde\u7eed\u3001\u4e13\u6ce8\u7684\u5b66\u4e60\u6295\u5165\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a**\u9ad8**\u3002\u9762\u5bf9\u5b66\u4e60\u56f0\u96be\uff08\u5982\u6280\u672f\u6982\u5ff5\u6df7\u6dc6\uff09\u3001\u65f6\u95f4\u51b2\u7a81\uff08\u591a\u6b21\u8bf7\u5047\u770b\u56de\u653e\uff09\u3001\u73af\u5883\u5e72\u6270\uff08\u88c5\u4fee\u566a\u97f3\uff09\u65f6\uff0c\u6001\u5ea6\u79ef\u6781\uff0c\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff08\u770b\u56de\u653e\u3001\u8bf7\u6559\u540c\u5b66\uff09\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u65e0\u62b1\u6028\u6216\u8d1f\u9762\u8a00\u8bba\uff0c\u4e0e\u73ed\u73ed\u3001\u540c\u5b66\u4e92\u52a8\u53cb\u597d\u3002\n\n## \u4e8c\u3001 ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u5df2\u786e\u8ba4\u652f\u4ed8\u5e76\u8fdb\u5165\u8bfe\u7a0b\u5b66\u4e60\u53ca\u540e\u7eed\u8fdb\u9636\u73ed\uff0c\u7528\u6237\u8eab\u4efd\u4e3a**\u5df2\u4ed8\u8d39\u5b66\u5458**\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u7528\u6237\u591a\u6b21\u63d0\u53ca\u201c\u5e26\u5c0f\u5b69\u201d\u3001\u201c\u5bb6\u91cc\u6709\u4e8b\u201d\uff0c\u8868\u660e\u5176\u4e3a\u5bb6\u5ead\u4e8b\u52a1\u7684\u4e3b\u8981\u627f\u62c5\u8005\u4e4b\u4e00\uff0c\u4f46\u5e76\u672a\u663e\u793a\u51fa\u5bb6\u5ead\u5bf9\u5176\u5b66\u4e60\u6295\u5165\u7684\u53cd\u5bf9\u6216\u963b\u529b\u3002\u51b3\u7b56\u6743\u6e05\u6670\uff0c\u5b66\u4e60\u884c\u4e3a\u81ea\u4e3b\u3002\n*   **\u6700\u7ec8\u5224\u5b9a**\uff1a**B\u7c7b\u7528\u6237\uff08\u7a33\u5065\u5b9e\u8df5\u8005\uff09**\u3002\u62e5\u6709\u660e\u786e\u5b66\u4e60\u76ee\u6807\u548c\u9ad8\u884c\u52a8\u529b\uff0c\u4f46\u53d7\u5ba2\u89c2\u751f\u6d3b\u4e8b\u52a1\u7275\u7eca\uff0c\u5b66\u4e60\u8282\u594f\u4e0d\u7a33\u5b9a\u4f46\u6301\u7eed\u3002\n\n## \u4e09\u3001 \u7528\u6237\u539f\u578b\u5339\u914d\n**T3 \u52a1\u5b9e\u8fdb\u53d6\u8005**\u3002\n*   **\u7279\u5f81\u543b\u5408**\uff1a\u5b66\u4e60\u76ee\u7684\u660e\u786e\uff08\u7b7e\u7ea6\u3001\u6295\u7a3f\u3001\u63d0\u5347\u6280\u80fd\uff09\uff0c\u884c\u52a8\u529b\u5f3a\uff08\u4e3b\u52a8\u63d0\u95ee\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u4e92\u52a8\uff09\uff0c\u5fc3\u6001\u52a1\u5b9e\uff08\u5173\u6ce8\u5b9e\u64cd\u7ec6\u8282\u5982\u6392\u7248\u3001\u5b57\u4f53\u3001\u97f3\u9891\u6280\u672f\uff09\uff0c\u80fd\u514b\u670d\u90e8\u5206\u5916\u90e8\u5e72\u6270\u575a\u6301\u5b66\u4e60\u3002\n*   **\u504f\u5dee\u8bf4\u660e**\uff1a\u4e0e\u5178\u578bT3\u76f8\u6bd4\uff0c\u5176\u65f6\u95f4\u788e\u7247\u5316\u7a0b\u5ea6\u66f4\u9ad8\uff0c\u4f46\u6838\u5fc3\u7279\u8d28\u9ad8\u5ea6\u4e00\u81f4\u3002\n\n## \u56db\u3001 \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669**\uff1a**\u6781\u4f4e**\u3002\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a\u98ce\u9669\u4f4e\u3002\u7528\u6237\u5df2\u5b9e\u73b0\u201c\u7b7e\u7ea6\u201d\u91cc\u7a0b\u7891\uff0c\u5bf9\u5b66\u4e60\u4ef7\u503c\u6709\u521d\u6b65\u9a8c\u8bc1\uff0c\u4e14\u6301\u7eed\u6295\u5165\u8fdb\u9636\u5b66\u4e60\u3002\n    2.  **\u65f6\u95f4\u7cbe\u529b\u51b2\u7a81**\uff1a**\u98ce\u9669\u4e2d\u7b49**\u3002\u8fd9\u662f\u4e3b\u8981\u6f5c\u5728\u98ce\u9669\u70b9\u3002\u7167\u987e\u5c0f\u5b69\u3001\u751f\u610f\u3001\u5bb6\u4e8b\u6301\u7eed\u5360\u7528\u5176\u65f6\u95f4\uff0c\u53ef\u80fd\u5bfc\u81f4\u540e\u671f\u4f5c\u4e1a\u79ef\u538b\u6216\u53c2\u4e0e\u5ea6\u4e0b\u964d\uff0c\u4f46\u7528\u6237\u76ee\u524d\u901a\u8fc7\u770b\u56de\u653e\u7b49\u65b9\u5f0f\u7075\u6d3b\u8c03\u6574\uff0c\u672a\u4ea7\u751f\u8d1f\u9762\u60c5\u7eea\u3002\n    3.  **\u6559\u5b66\u8d28\u91cf\u8d28\u7591**\uff1a\u98ce\u9669\u6781\u4f4e\u3002\u7528\u6237\u5bf9\u8bfe\u7a0b\u5185\u5bb9\uff08\u5982\u9676\u9676\u5927\u5927\u7684\u8bfe\uff09\u7ed9\u4e88\u6b63\u9762\u53cd\u9988\uff0c\u6280\u672f\u63d0\u95ee\u6df1\u5165\uff0c\u672a\u8868\u8fbe\u4e0d\u6ee1\u3002\n    4.  **\u670d\u52a1\u4f53\u9a8c\u4e0d\u4f73**\uff1a\u98ce\u9669\u6781\u4f4e\u3002\u4e0e\u73ed\u73ed\u6c9f\u901a\u987a\u7545\uff0c\u95ee\u9898\u80fd\u5f97\u5230\u53ca\u65f6\u89e3\u7b54\uff0c\u5173\u7cfb\u878d\u6d3d\u3002\n    5.  **\u7ecf\u6d4e\u538b\u529b**\uff1a\u98ce\u9669\u4f4e\u3002\u65e0\u4efb\u4f55\u5173\u4e8e\u8d39\u7528\u3001\u4ef7\u683c\u7684\u8a00\u8bba\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a\u98ce\u9669\u4f4e\u3002\u867d\u63d0\u53ca\u5bb6\u5ead\u4e8b\u52a1\uff0c\u4f46\u672a\u663e\u793a\u53cd\u5bf9\u610f\u89c1\u3002\n    7.  **\u7ade\u54c1\u8f6c\u79fb/\u5174\u8da3\u8f6c\u79fb**\uff1a\u98ce\u9669\u6781\u4f4e\u3002\u7528\u6237\u540c\u65f6\u5b66\u4e60AI\u5199\u4f5c\u3001\u6709\u58f0\u6f14\u64ad\u3001\u540e\u671f\u7b49\u591a\u4e2a\u8bfe\u7a0b\uff0c\u4e14\u6b63\u5411\u8fc1\u79fb\uff08\u5982\u8bf7\u6c42\u540c\u5b66\u914d\u97f3\uff09\uff0c\u663e\u793a\u51fa\u5728\u8be5\u751f\u6001\u5185\u7684\u6df1\u5ea6\u6c89\u6d78\u4e0e\u591a\u5143\u63a2\u7d22\uff0c\u5174\u8da3\u805a\u7126\u4e14\u7a33\u5b9a\u3002\n\n## \u4e94\u3001 \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u65e0\u98ce\u9669**\u3002\u8bb0\u5f55\u4e2d\u672a\u53d1\u73b0\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa\u3001\u5938\u5927\u6536\u76ca\u3001\u5236\u9020\u7126\u8651\u6216\u8bf1\u5bfc\u501f\u8d37\u7b49\u8fdd\u89c4\u884c\u4e3a\u3002\u6c9f\u901a\u5185\u5bb9\u4ee5\u8bfe\u7a0b\u63d0\u9192\u3001\u5b66\u4e60\u6307\u5bfc\u3001\u95ee\u9898\u89e3\u7b54\u4e3a\u4e3b\uff0c\u7b26\u5408\u670d\u52a1\u89c4\u8303\u3002\u7528\u6237\u4e3b\u52a8\u7eed\u62a5\u8fdb\u9636\u73ed\uff0c\u5c5e\u81ea\u7136\u8f6c\u5316\u3002\n\n## \u516d\u3001 \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**\uff1a**\u5339\u914d**\u3002\u7528\u6237\u5df2\u987a\u5229\u4eceAI\u5199\u4f5c\u57fa\u7840\u8bfe\u8fdb\u5165\u6709\u58f0\u6f14\u64ad\u8fdb\u9636\u8bfe\uff0c\u5b66\u4e60\u8def\u5f84\u6e05\u6670\uff0c\u9700\u6c42\u5339\u914d\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**\u63d0\u4f9b\u7075\u6d3b\u5b66\u4e60\u652f\u6301\u4e0e\u65f6\u95f4\u7ba1\u7406\u5efa\u8bae**\u3002\n*   **\u8be6\u7ec6\u884c\u52a8\u5efa\u8bae**\uff1a\n    1.  **\u8ba4\u53ef\u4e0e\u9f13\u52b1**\uff1a\u80af\u5b9a\u5176\u5df2\u53d6\u5f97\u7684\u201c\u7b7e\u7ea6\u201d\u6210\u679c\u53ca\u79ef\u6781\u7684\u5b66\u4e60\u6001\u5ea6\uff0c\u5f3a\u5316\u5176\u6b63\u53cd\u9988\u3002\n    2.  **\u5f39\u6027\u652f\u6301**\uff1a\u4e3b\u52a8\u4e3a\u5176\u89c4\u5212**\u788e\u7247\u5316\u5b66\u4e60\u65b9\u6848**\uff0c\u5982\u91cd\u70b9\u56de\u770b\u7247\u6bb5\u3001\u63d0\u4f9b\u6587\u5b57\u7248\u8981\u70b9\u603b\u7ed3\uff0c\u51cf\u8f7b\u5176\u56e0\u65f6\u95f4\u51b2\u7a81\u4ea7\u751f\u7684\u7126\u8651\u3002\n    3.  **\u9884\u671f\u7ba1\u7406**\uff1a\u6e29\u548c\u63d0\u9192\u5176\u5e73\u8861\u751f\u6d3b\u4e0e\u5b66\u4e60\u5f3a\u5ea6\uff0c\u907f\u514d\u56e0\u4e8b\u52a1\u7e41\u5fd9\u5bfc\u81f4\u4f5c\u4e1a\u5806\u79ef\u800c\u4ea7\u751f\u632b\u8d25\u611f\u3002\u5f3a\u8c03\u201c\u5b8c\u6210\u6bd4\u5b8c\u7f8e\u91cd\u8981\u201d\u3002\n    4.  **\u8fde\u63a5\u8d44\u6e90**\uff1a\u9f13\u52b1\u5176\u7ee7\u7eed\u5229\u7528\u73ed\u7ea7\u793e\u7fa4\uff08\u5982\u5df2\u53d1\u751f\u7684\u4e92\u52a9\u914d\u97f3\uff09\uff0c\u6784\u5efa\u652f\u6301\u7f51\u7edc\uff0c\u5f25\u8865\u5176\u53ef\u80fd\u56e0\u65f6\u95f4\u95ee\u9898\u65e0\u6cd5\u5168\u7a0b\u76f4\u64ad\u53c2\u4e0e\u7684\u4e92\u52a8\u7f3a\u5931\u3002\n    5.  **\u6301\u7eed\u5173\u6ce8**\uff1a\u7559\u610f\u5176\u4f5c\u4e1a\u63d0\u4ea4\u9891\u7387\u548c\u76f4\u64ad\u51fa\u52e4\u7387\uff0c\u82e5\u51fa\u73b0\u660e\u663e\u4e0b\u6ed1\uff0c\u53ef\u4e3b\u52a8\u5173\u6000\uff0c\u63d0\u4f9b\u66f4\u5177\u9488\u5bf9\u6027\u7684\u65f6\u95f4\u5b89\u6392\u5efa\u8bae\u3002\n\n{\"core_type\": \"T3 \u52a1\u5b9e\u8fdb\u53d6\u8005\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u6781\u4f4e\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u63d0\u4f9b\u788e\u7247\u5316\u5b66\u4e60\u652f\u6301\u65b9\u6848\"}";
