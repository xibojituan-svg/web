    <script>
        const markdownText = "# \u7528\u6237\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u4e2d\u7b49**\u3002\u7528\u6237\u4e3a27\u5c81\u5728\u804c\u4eba\u5458\uff0c\u8868\u73b0\u51fa\u5bf9AI\u77ed\u89c6\u9891\u526f\u4e1a/\u53d8\u73b0\u7684\u660e\u786e\u5174\u8da3\uff0c\u56de\u590d\u79ef\u6781\uff0c\u5b8c\u6210\u4e86\u4f5c\u4e1a\u548c\u76f4\u64ad\u9884\u7ea6\u3002\u52a8\u673a\u504f\u5411**\u5b9e\u7528\u4e3b\u4e49**\uff08\u526f\u4e1a\u589e\u6536\uff09\uff0c\u4f46\u7f3a\u4e4f\u66f4\u6df1\u5c42\u6b21\u7684\u804c\u4e1a\u8f6c\u578b\u6216\u5f3a\u70c8\u5174\u8da3\u9a71\u52a8\u7684\u8868\u8fbe\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u4f4e/\u672a\u77e5**\u3002\u4ec5\u77e5\u7528\u6237\u4e3a\u5728\u804c\u72b6\u6001\uff0c\u6709\u201c\u6bcf\u59291\u5c0f\u65f6\u4ee5\u4e0a\u201d\u7684\u5b66\u4e60\u65f6\u95f4\u3002**\u5173\u952e\u4fe1\u606f\u7f3a\u5931**\uff1a\u5177\u4f53\u804c\u4e1a\u3001\u6536\u5165\u6c34\u5e73\u3001\u53ef\u6295\u5165\u8d44\u91d1\u3001\u8bbe\u5907\u6761\u4ef6\u3001\u8fc7\u5f80\u76f8\u5173\u7ecf\u9a8c\u5747\u672a\u77e5\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u4e2d\u7b49\u504f\u9ad8**\u3002\u7528\u6237\u6c9f\u901a\u914d\u5408\u5ea6\u9ad8\uff08\u201c\u597d\u7684\u201d\u3001\u201c\u6765\u4e86\u201d\u3001\u201c\u5df2\u5b8c\u6210\u201d\uff09\uff0c\u80fd\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u5e76\u53c2\u4e0e\u76f4\u64ad\u3002\u9762\u5bf9\u4e34\u65f6\u5b89\u6392\u51b2\u7a81\uff084\u670811\u65e5\u665a8\u70b9\u76f4\u64ad\u65e0\u6cd5\u51c6\u65f6\uff09\u80fd\u4e3b\u52a8\u6c9f\u901a\uff0c\u8868\u73b0\u51fa\u4e00\u5b9a\u7684**\u8ba1\u5212\u6027\u548c\u8d23\u4efb\u611f**\u3002\u4f46\u6297\u538b\u6027\u3001\u9762\u5bf9\u590d\u6742\u4efb\u52a1\u65f6\u7684\u575a\u6301\u5ea6\u672a\u77e5\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40 (\u652f\u4ed8\u6838\u67e5)**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u4e8e4\u670812\u65e5\u665a\u95f4\u652f\u4ed83980\u5143\u8bfe\u7a0b\u8d39\u7528\uff0c\u8fdb\u5165\u8f6c\u5316\u540e\u9636\u6bb5\u3002\n*   **\u6b65\u9aa41.5 (\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5)**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u4e3a27\u5c81\u5728\u804c\u6210\u5e74\u4eba\uff0c\u7406\u8bba\u4e0a\u5177\u5907\u5b8c\u5168\u51b3\u7b56\u6743\u3002\u804a\u5929\u8bb0\u5f55\u4e2d\u672a\u6d89\u53ca\u4e0e\u5bb6\u4eba\uff08\u5982\u914d\u5076\uff09\u5546\u8bae\u7684\u75d5\u8ff9\uff0c\u53ef\u521d\u6b65\u5224\u65ad\u4e3a**\u4e2a\u4eba\u51b3\u7b56**\u3002\n*   **\u6b65\u9aa4A (\u5b66\u4e60\u529b\u4e0e\u6267\u884c\u529b)**: **B\u7ea7**\u3002\u7528\u6237\u80fd\u5b8c\u6210\u9884\u4e60\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\u3001\u56de\u590d\u6307\u4ee4\uff0c\u8868\u73b0\u51fa\u57fa\u7840\u7684\u5b66\u4e60\u610f\u613f\u548c\u6267\u884c\u529b\u3002\u4f46\u4f5c\u4e1a\u8d28\u91cf\u3001\u6df1\u5ea6\u601d\u8003\u4e0e\u63d0\u95ee\u80fd\u529b\u672a\u77e5\u3002\n*   **\u6b65\u9aa4B (\u76ee\u6807\u4e0e\u8d44\u6e90\u5339\u914d)**: **C\u7ea7**\u3002\u7528\u6237\u6709\u660e\u786e\u7684\u201c\u53d8\u73b0\u201d\u76ee\u6807\uff0c\u4e0e\u8bfe\u7a0b\u5ba3\u4f20\u5339\u914d\u3002\u4f46\u4e2a\u4eba\u8d44\u6e90\u5e95\u5ea7\uff08\u65f6\u95f4\u3001\u7cbe\u529b\u3001\u6280\u80fd\u57fa\u7840\uff09\u4fe1\u606f\u4e0d\u8db3\uff0c\u5b58\u5728**\u76ee\u6807\u4e0e\u8d44\u6e90\u4e0d\u5339\u914d\u7684\u6f5c\u5728\u98ce\u9669**\uff08\u4ec5\u9760\u201c\u6bcf\u59291\u5c0f\u65f6\u201d\u80fd\u5426\u8fbe\u6210\u9ad8\u53d8\u73b0\u9884\u671f\uff1f\uff09\u3002\n*   **\u6b65\u9aa4C (\u627f\u8bfa\u5ea6\u4e0e\u5fc3\u7406\u51c6\u5907)**: **B\u7ea7**\u3002\u7528\u6237\u652f\u4ed8\u884c\u4e3a\u662f\u5f3a\u627f\u8bfa\u4fe1\u53f7\u3002\u4f46\u5bf9\u5b66\u4e60\u96be\u5ea6\u3001\u65f6\u95f4\u6295\u5165\u7684\u957f\u671f\u6027\u3001\u53d8\u73b0\u5468\u671f\u7684\u5fc3\u7406\u51c6\u5907\u672a\u89c1\u5145\u5206\u8ba8\u8bba\uff0c\u53ef\u80fd\u5bf9\u56de\u62a5\u6709**\u901f\u6210\u671f\u5f85**\u3002\n*   **\u6b65\u9aa4D (\u793e\u4ea4\u4e0e\u652f\u6301\u9700\u6c42)**: **C\u7ea7**\u3002\u7528\u6237\u4e92\u52a8\u4ee5\u54cd\u5e94\u4e3a\u4e3b\uff0c\u672a\u4e3b\u52a8\u5bfb\u6c42\u60c5\u611f\u652f\u6301\u6216\u6df1\u5ea6\u8fde\u63a5\u3002\u53ef\u80fd\u5c5e\u4e8e**\u4efb\u52a1\u5bfc\u5411\u578b**\u5b66\u4e60\u8005\uff0c\u5bf9\u793e\u7fa4\u4f9d\u8d56\u5ea6\u4e2d\u7b49\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b: T3 \u52a1\u5b9e\u8fdb\u53d6\u578b**\u3002\u6838\u5fc3\u7279\u5f81\uff1a\u5728\u804c\u72b6\u6001\u3001\u76ee\u6807\u660e\u786e\uff08\u526f\u4e1a\u53d8\u73b0\uff09\u3001\u884c\u52a8\u914d\u5408\u3001\u5bf9\u5b9e\u7528\u6280\u80fd\u548c\u76f4\u63a5\u56de\u62a5\u654f\u611f\u3002\u7b26\u5408T3\u201c\u5173\u6ce8\u6280\u80fd\u63d0\u5347\u548c\u73b0\u5b9e\u6536\u76ca\u201d\u3001\u201c\u5b66\u4e60\u884c\u4e3a\u89c4\u5f8b\u4f46\u6df1\u5ea6\u4e92\u52a8\u6709\u9650\u201d\u7684\u63cf\u8ff0\u3002\n*   **\u6b21\u9009\u539f\u578b: T2 \u673a\u4f1a\u63a2\u7d22\u578b**\u3002\u7528\u6237\u88ab\u201c\u98ce\u53e3\u201d\u3001\u201c\u53d8\u73b0\u201d\u5438\u5f15\uff0c\u6709\u5c1d\u8bd5\u5fc3\u6001\uff0c\u4f46T3\u7684\u201c\u5728\u804c\u201d\u548c\u201c\u5df2\u5b8c\u6210\u652f\u4ed8\u201d\u4f7f\u5176\u66f4\u504f\u5411\u52a1\u5b9e\u800c\u975e\u7eaf\u63a2\u7d22\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669\u7b49\u7ea7: \u4e2d**\n*   **\u6839\u56e0\u6392\u67e5**:\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**: **\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa\u201c7\u5929\u8d5a\u5927\u51e0\u5343\u4e0a\u4e07\u201d\u3001\u201c\u6708\u5165\u7a33\u5b9a3-5\u4e07\u201d\uff0c\u6781\u6613\u62c9\u9ad8\u7528\u6237\u671f\u5f85\u3002\u82e5\u540e\u7eed\u5b9e\u64cd\u96be\u5ea6\u5927\u6216\u53d8\u73b0\u7f13\u6162\uff0c\u6613\u5f15\u53d1\u5931\u671b\u548c\u9000\u8d39\u3002\n    2.  **\u8bfe\u7a0b\u8d28\u91cf\u4e0d\u7b26**: **\u4e2d\u98ce\u9669**\u3002\u53d6\u51b3\u4e8e\u6b63\u5f0f\u8bfe\u4ea4\u4ed8\u662f\u5426\u4e0e\u4f53\u9a8c\u8bfe/\u5ba3\u4f20\u4e00\u81f4\u3002\n    3.  **\u65f6\u95f4\u7cbe\u529b\u4e0d\u8db3**: **\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u4ec5\u627f\u8bfa\u201c\u6bcf\u59291\u5c0f\u65f6\u4ee5\u4e0a\u201d\uff0c\u5728\u804c\u4eba\u5458\u65f6\u95f4\u788e\u7247\u5316\uff0c\u53ef\u80fd\u65e0\u6cd5\u6301\u7eed\u6295\u5165\u5b8c\u6210\u8bfe\u7a0b\u4e0e\u63a5\u5355\u4efb\u52a1\u3002\n    4.  **\u7ecf\u6d4e\u538b\u529b**: **\u4f4e\u98ce\u9669**\u3002\u652f\u4ed83980\u5143\u672a\u8868\u73b0\u51fa\u72b9\u8c6b\uff0c\u4f46\u5177\u4f53\u7ecf\u6d4e\u72b6\u51b5\u672a\u77e5\u3002\n    5.  **\u5bb6\u5ead\u53cd\u5bf9**: **\u4f4e\u98ce\u9669**\u3002\u6210\u5e74\u5728\u804c\uff0c\u51b3\u7b56\u6743\u8f83\u72ec\u7acb\u3002\n    6.  **\u9500\u552e\u8bef\u5bfc**: **\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u8bdd\u672f\u5b58\u5728**\u5938\u5927\u5ba3\u4f20**\uff08\u201c100%\u6536\u5355\u201d\u3001\u201c\u85aa\u8d44\u6bd4\u522b\u4eba\u9ad8\u597d\u51e0\u500d\u201d\u3001\u201c\u72ec\u5bb6\u8d44\u6e90\u201d\uff09\uff0c\u5e76\u5229\u7528\u201c\u5de5\u4f5c\u5ba4\u540d\u989d\u6709\u9650\u201d\u3001\u201c\u989d\u5916\u60ca\u559c\u201d\u7b49**\u5236\u9020\u7a00\u7f3a\u548c\u7279\u6743\u611f**\uff0c\u5c5e\u4e8e\u5408\u89c4\u9ad8\u98ce\u9669\u533a\u3002\n    7.  **\u66ff\u4ee3\u65b9\u6848\u51fa\u73b0**: **\u4f4e\u98ce\u9669**\u3002\u6682\u65e0\u8ff9\u8c61\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u26a0\ufe0f \u91cd\u5927\u96f7\u533a**:\n    *   **\u5938\u5927\u6536\u76ca\u627f\u8bfa**: \u591a\u6b21\u63d0\u53ca\u201c7\u5929\u8d5a\u5927\u51e0\u5343\u4e0a\u4e07\u201d\u3001\u201c\u6708\u5165\u7a33\u5b9a3-5\u4e07\u201d\u3001\u201c\u85aa\u8d44\u6bd4\u522b\u4eba\u9ad8\u597d\u51e0\u500d\u201d\uff0c\u8fdd\u53cd\u5173\u4e8e\u4e0d\u5f97\u5bf9\u57f9\u8bad\u6548\u679c\u4f5c\u51fa\u4fdd\u8bc1\u6027\u627f\u8bfa\u7684\u76d1\u7ba1\u89c4\u5b9a\u3002\n    *   **\u865a\u6784\u7a00\u7f3a\u4e0e\u7279\u6743**: \u201c\u4e0d\u662f\u6240\u6709\u5b66\u5458\u90fd\u80fd\u8fdb\u5e08\u5144\u7684\u5de5\u4f5c\u5ba4\u201d\u3001\u201c\u8d44\u6e90\u6709\u9650\u201d\u3001\u201c\u9886\u53d6\u4e13\u5c5e\u4f18\u60e0\u5238\u201d\u7b49\u8bdd\u672f\uff0c\u6d89\u5acc\u5229\u7528\u8425\u9500\u624b\u6bb5\u5236\u9020\u7d27\u8feb\u611f\u3002\n    *   **\u6346\u7ed1\u4e0e\u6a21\u7cca\u627f\u8bfa**: \u5c06\u201c\u5e73\u53f0\u8d44\u6e90\u201d\u4e0e\u201c\u5de5\u4f5c\u5ba4\u8d44\u6e90\u201d\u6346\u7ed1\uff0c\u6697\u793a\u62a5\u540d\u7cfb\u7edf\u8bfe\u624d\u80fd\u83b7\u5f97\u540e\u8005\uff0c\u4e14\u201c\u5de5\u4f5c\u5ba4\u201d\u7684\u5b9e\u8d28\uff08\u662f\u5185\u90e8\u56e2\u961f\u8fd8\u662f\u5916\u90e8\u5408\u4f5c\uff1f\uff09\u754c\u5b9a\u6a21\u7cca\u3002\n*   **\u5408\u89c4\u98ce\u9669**: **\u9ad8**\u3002\u9500\u552e\u8fc7\u7a0b\u5b58\u5728\u660e\u663e\u7684**\u8fc7\u5ea6\u8425\u9500\u548c\u8bf1\u5bfc\u6d88\u8d39**\u503e\u5411\uff0c\u5df2\u89e6\u53ca\u5408\u89c4\u7ea2\u7ebf\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6838\u5fc3\u7b56\u7565**: **\u9884\u671f\u7ba1\u7406 + \u5373\u65f6\u6b63\u53cd\u9988 + \u8def\u5f84\u62c6\u89e3**\u3002\u9488\u5bf9T3\u52a1\u5b9e\u578b\u7528\u6237\uff0c\u9700\u5c06\u5b8f\u5927\u7684\u201c\u66b4\u5bcc\u201d\u53d9\u4e8b\u8f6c\u5316\u4e3a\u53ef\u6267\u884c\u3001\u53ef\u8861\u91cf\u7684\u9636\u6bb5\u6027\u76ee\u6807\u3002\n*   **\u884c\u52a8\u6307\u5357**:\n    1.  **\u4ea4\u4ed8\u521d\u671f\uff08\u5173\u952e\u671f\uff09**: \u8fc5\u901f\u5efa\u7acb\u4fe1\u4efb\uff0c**\u907f\u514d\u7ee7\u7eed\u5938\u5927**\u3002\u6e05\u6670\u8bf4\u660e\u5b66\u4e60\u8def\u5f84\u3001\u6bcf\u4e2a\u9636\u6bb5\u7684\u4ea7\u51fa\u3001\u4ee5\u53ca\u5408\u7406\u7684\u53d8\u73b0\u5468\u671f\uff08\u5982\uff1a\u7b2c\u4e00\u6708\u719f\u6089\u5de5\u5177\uff0c\u7b2c\u4e8c\u6708\u5c1d\u8bd5\u63a5\u7b80\u5355\u5546\u5355\uff09\u3002**\u91cd\u70b9\u5173\u6ce8\u5176\u65f6\u95f4\u7ba1\u7406**\uff0c\u534f\u52a9\u5236\u5b9a\u53ef\u884c\u7684\u5b66\u4e60\u8ba1\u5212\u3002\n    2.  **\u8fc7\u7a0b\u6fc0\u52b1**: \u5bf9\u5176\u5b8c\u6210\u7684\u4f5c\u4e1a\u3001\u53c2\u4e0e\u5ea6\u7ed9\u4e88\u5177\u4f53\u3001\u53ca\u65f6\u7684\u80af\u5b9a\u3002\u63d0\u4f9b**\u6e05\u6670\u7684\u63a5\u5355\u95e8\u69db\u548c\u6d41\u7a0b\u8bf4\u660e**\uff0c\u7ba1\u7406\u5176\u5bf9\u201c\u5de5\u4f5c\u5ba4\u8d44\u6e90\u201d\u7684\u9884\u671f\u3002\n    3.  **\u98ce\u9669\u9884\u8b66**: \u7559\u610f\u5176\u51fa\u73b0\u201c\u5b66\u4e60\u65f6\u95f4\u4e0d\u8db3\u201d\u3001\u201c\u5b9e\u64cd\u9047\u5230\u56f0\u96be\u201d\u3001\u201c\u521d\u671f\u63a5\u5355\u4e0d\u987a\u201d\u65f6\u7684\u60c5\u7eea\u53cd\u9988\uff0c\u63d0\u524d\u4ecb\u5165\u8f85\u5bfc\uff0c**\u9632\u6b62\u56e0\u843d\u5dee\u611f\u76f4\u63a5\u5bfc\u81f4\u9000\u8d39**\u3002\n    4.  **\u6c9f\u901a\u98ce\u683c**: \u76f4\u63a5\u3001\u52a1\u5b9e\u3001\u63d0\u4f9b\u5e72\u8d27\u3002\u51cf\u5c11\u60c5\u611f\u717d\u52a8\uff0c\u591a\u63d0\u4f9b\u5de5\u5177\u3001\u65b9\u6cd5\u548c\u6848\u4f8b\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**:\n    *   **\u4e3b\u7ebf**: \u5339\u914d**\u6280\u80fd\u8fdb\u9636\u578b**\u8bfe\u7a0b\u6a21\u5757\uff0c\u5f3a\u8c03\u5de5\u5177\u5b9e\u64cd\u3001\u6848\u4f8b\u62c6\u89e3\u3001\u63a5\u5355\u6280\u5de7\u3002\n    *   **\u589e\u503c**: \u53ef\u8c28\u614e\u63a8\u8350\u4e0e\u201c\u5de5\u4f5c\u5ba4\u201d\u6216\u5e73\u53f0\u63a5\u5355\u6e20\u9053\u76f8\u5173\u7684**\u5b9e\u6218\u8bad\u7ec3\u8425\u6216\u9879\u76ee\u5236\u8bfe\u7a0b**\uff0c\u4f46\u5fc5\u987b\u660e\u786e\u89c4\u5219\u3001\u95e8\u69db\u548c\u9884\u671f\uff0c\u907f\u514d\u5f62\u6210\u201c\u4ed8\u8d39\u5373\u53ef\u83b7\u8d44\u6e90\u201d\u7684\u8bef\u89e3\u3002\n    *   **\u89c4\u907f**: \u907f\u514d\u63a8\u8350\u7eaf\u7406\u8bba\u3001\u5174\u8da3\u5bfc\u5411\u6216\u9700\u8981\u5927\u91cf\u521b\u610f\u53d1\u6563\u7684\u4ea7\u54c1\u3002\n\n{\"core_type\": \"T3 \u52a1\u5b9e\u8fdb\u53d6\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd/\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u6280\u80fd\u8fdb\u9636\u4e0e\u5b9e\u6218\u53d8\u73b0\u6a21\u5757\", \"age\": \"27\u5c81\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}";
