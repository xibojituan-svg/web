        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u4e00\u6c5f\u6625\u6c34 (UID: 676161016) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6735\u6735\u5357\u98ce(\u738b\u96c5\u96ef) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u77ed\u6545\u4e8b\u5199\u4f5c\u8bfe (\u57fa\u7840\u73ed\uff0c\u4ef7\u683c2880\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u4f46\u9500\u552e\u4e3b\u52a8\u63d0\u53ca\u82b1\u5457\u3001\u4fe1\u7528\u5361\uff0c\u7528\u6237\u672a\u8868\u9732\u8d44\u91d1\u538b\u529b\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u7528\u6237\u6709\u5b69\u5b50\u9700\u8981\u7167\u987e\uff0c\u5b69\u5b50\u4e0d\u8212\u670d\u65f6\u201c\u4e0d\u6562\u62ff\u624b\u673a\u201d\uff0c\u65f6\u95f4\u88ab\u80b2\u513f\u5207\u5272\u4e25\u91cd) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3** (\u672a\u63d0\u53ca\u914d\u5076\u6216\u5bb6\u4eba\u6001\u5ea6\uff0c\u5b58\u5728\u9690\u7792\u5077\u62a5\u7684\u6f5c\u5728\u98ce\u9669) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** (\u7528\u6237\u4e3b\u52a8\u8868\u8fbe\u6781\u5c11\uff0c\u591a\u4e3a\u88ab\u52a8\u56de\u5e94\uff0c\u5173\u952e\u7ef4\u5ea6\u5982\u5bb6\u5ead\u652f\u6301\u3001\u8d22\u52a1\u72b6\u51b5\u3001\u8fc7\u5f80\u7ecf\u9a8c\u7b49\u5747\u7f3a\u5931) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u5bf9\u201c\u8d5a\u94b1\u201d\u6709\u671f\u5f85\uff0c\u4f46\u66f4\u88ab\u201c\u4f4e\u98ce\u9669\u5c1d\u8bd5\u201d\uff08\u53ef\u9000\u8d39\uff09\u548c\u201c\u81ea\u6211\u63d0\u5347\u201d\u5438\u5f15\u3002\u5176\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u201c\u89e3\u51b3\u4e0d\u81ea\u4fe1\u201d\u548c\u201c\u5bfb\u6c42\u5b89\u5168\u5c1d\u8bd5\u201d\uff0c\u800c\u975e\u7eaf\u7cb9\u7684\u91d1\u94b1\u9965\u6e34\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8fd8\u662f\u89c9\u5f97\u5fc3\u91cc\u6ca1\u5e95\uff0c\u8981\u4e0d\u6211\u62a5\u4e2a\u666e\u901a\u73ed\u8bd5\u8bd5\u5427\uff0c\u5b66\u5b66\u770b\u770b\u4e0d\u884c\u518d\u9000\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4fe1\u606f\u4e0d\u8db3] \u2014 \u672a\u63d0\u53ca\uff0c\u4f46\u4ece\u9009\u62e9\u57fa\u7840\u73ed\u53ca\u53cd\u590d\u786e\u8ba4\u9000\u8d39\u89c4\u5219\u770b\uff0c\u5bf9\u8d44\u91d1\u6295\u5165\u8f83\u4e3a\u8c28\u614e\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u2b07\u4f4e] \u2014 **\u8bc1\u636e\u8bf4\u660e**\uff1a\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u63a5\u4e0a\u5b69\u5b50\u9001\u5230\u8f85\u5bfc\u73ed\u90a3\u91cc\u53bb\u4e86\u521a\u201d\u3001\u201c\u5b69\u5b50\u4e0d\u592a\u8212\u670d\uff0c\u5728\u5bb6\u91cc\u6211\u4e0d\u6562\u62ff\u624b\u673a\uff0c\u4e00\u62ff\u4ed6\u5c31\u62a2\u201d\u3002\u8868\u660e\u5176\u4f5c\u4e3a\u5bb6\u957f\uff0c\u4e2a\u4eba\u53ef\u81ea\u7531\u652f\u914d\u7684\u3001\u8fde\u7eed\u7684\u5b66\u4e60\u65f6\u95f4\u4e25\u91cd\u4e0d\u8db3\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u4e0d\u8db3] \u2014 \u672a\u63d0\u53ca\uff0c\u662f\u91cd\u5927\u98ce\u9669\u9690\u60a3\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b07\u4f4e\u6781\u5371]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56\u3002\u7528\u6237\u591a\u6b21\u8868\u8fbe\u201c\u5bf9\u81ea\u5df1\u7f3a\u4e4f\u4fe1\u5fc3\u201d\u3001\u201c\u6211\u6015\u6211\u81ea\u5df1\u4e0d\u884c\u201d\uff0c\u5bf9\u81ea\u6211\u80fd\u529b\u8bc4\u4f30\u6781\u4f4e\uff0c\u9700\u8981\u5916\u90e8\u6301\u7eed\u80af\u5b9a\u548c\u4f4e\u95e8\u69db\u627f\u8bfa\uff08\u9000\u8d39\uff09\u4f5c\u4e3a\u5b89\u5168\u57ab\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u7684\u4f5c\u4e1a\u5b9e\u9645\u4e0a\u662f\u4e0d\u592a\u6ee1\u610f\u4f46\u662f\u4ed6\u5c31\u662f\u5199\u4e0d\u597d\u201d\uff1b > \u201c\u6211\u6015\u6211\u81ea\u5df1\u4e0d\u884c\u3002\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u81ea\u6211\u4ef7\u503c\u7684\u6df1\u5ea6\u6000\u7591\u548c\u4e0d\u81ea\u4fe1**\u3002\u4f5c\u4e3a\u9700\u8981\u7167\u987e\u5b69\u5b50\u7684\u5bb6\u957f\uff0c\u53ef\u80fd\u9762\u4e34\u4e0e\u793e\u4f1a\u8131\u8282\u3001\u4e2a\u4eba\u4ef7\u503c\u611f\u7f3a\u5931\u7684\u7126\u8651\uff0c\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u4e00\u9879\u65b0\u6280\u80fd\u6765\u8bc1\u660e\u81ea\u5df1\u201c\u53ef\u4ee5\u201d\uff0c\u4f46\u53c8\u6781\u5ea6\u5bb3\u6015\u5931\u8d25\u548c\u635f\u5931\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u201c\u5b89\u5168\u627f\u8bfa\u201d\u4e0e\u201c\u4f4e\u95e8\u69db\u9f13\u52b1\u201d**\u3002\u4ed6\u9700\u8981\u7684\u662f\u4e00\u4e2a\u201c\u5141\u8bb8\u5931\u8d25\u3001\u968f\u65f6\u53ef\u9000\u201d\u7684\u7edd\u5bf9\u5b89\u5168\u73af\u5883\uff0c\u4ee5\u53ca\u5bf9\u4ed6\u5fae\u5c0f\u8fdb\u6b65\u7684\u5373\u65f6\u3001\u5938\u5f20\u7684\u80af\u5b9a\uff0c\u6765\u5bf9\u6297\u5176\u5185\u5fc3\u7684\u81ea\u6211\u5426\u5b9a\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1** \u7c7b (\u52a8\u673a\u4e2d\u7b49\u4f46\u8d44\u6e90\u5e95\u5ea7\u548c\u5fc3\u7406\u5f39\u6027\u53cc\u4f4e\uff0c\u4f9d\u8d56\u6027\u5f3a\uff0c\u98ce\u9669\u9ad8) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u6838\u5fc3\u7279\u5f81\uff1a\u80fd\u529b\u81ea\u5351\u3001\u60c5\u7eea\u4f9d\u8d56\u3001\u9700\u8981\u9ad8\u5f3a\u5ea6\u60c5\u611f\u5b89\u629a\u548c\u7edd\u5bf9\u5b89\u5168\u627f\u8bfa) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u76f4\u63a5\u8bc1\u636e\u8868\u660e\u5b58\u5728\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5c5e\u6781\u7aef\u53cd\u5bf9\u3002**\u4f46\u5bb6\u5ead\u652f\u6301\u5ea6\u672a\u77e5\u662f\u91cd\u5927\u9690\u60a3**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **[\u9ad8]** | **\u3010\u9ad8\u98ce\u9669\u3011** \u804a\u5929\u8bb0\u5f55\u5b8c\u5168\u672a\u63d0\u53ca\u5bb6\u4eba\uff0c\u5b58\u5728\u201c\u7792\u7740\u5bb6\u4eba\u7528\u5bb6\u5ead\u5171\u540c\u8d44\u91d1\u201d\u62a5\u540d\u7684\u6781\u5927\u53ef\u80fd\u3002\u4e00\u65e6\u88ab\u5bb6\u4eba\u53d1\u73b0\uff0c\u6781\u6613\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u5e76\u5f3a\u5236\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **[\u9ad8]** | **\u3010\u9ad8\u98ce\u9669\u3011** \u5176\u201c\u788e\u7247\u5316\u62fc\u51d1\u201d\u7684\u65f6\u95f4\u6a21\u5f0f\uff0c\u6781\u6613\u56e0\u5b69\u5b50\u751f\u75c5\u3001\u5bb6\u5ead\u4e8b\u52a1\u7b49\u5bfc\u81f4\u8bfe\u7a0b\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u7126\u8651\u548c\u81ea\u8d23\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **[\u6781\u9ad8]** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u5f00\u8bfe\u540e\uff0c\u4e00\u65e6\u4f5c\u4e1a\u88ab\u6279\u6539\u3001\u6216\u5c1d\u8bd5\u6295\u7a3f\u88ab\u62d2\uff0c\u5176\u8106\u5f31\u7684\u81ea\u5c0a\u5fc3\u4f1a\u7acb\u523b\u53d7\u632b\uff0c\u4ea7\u751f\u201c\u6211\u679c\u7136\u4e0d\u884c\u201d\u7684\u5d29\u6e83\u611f\uff0c\u5e76\u63f4\u5f15\u201c\u968f\u65f6\u9000\u8d39\u201d\u627f\u8bfa\u8981\u6c42\u9000\u51fa\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **[\u4e2d]** | \u5bf9\u201c\u5feb\u901f\u53d8\u73b0\u201d\u62b1\u6709\u5e7b\u60f3\uff0c\u82e5\u5b66\u4e60\u4e00\u4e24\u5468\u540e\u672a\u80fd\u5982\u9500\u552e\u6240\u8bf4\u201c\u8f7b\u677e\u8fc7\u7a3f\u201d\uff0c\u4f1a\u4ea7\u751f\u88ab\u6b3a\u9a97\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-3\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u8bfe\u7a0b\u96be\u5ea6\u548c\u4f5c\u4e1a\u538b\u529b\u4e0a\u5347\uff0c\u7b2c\u4e00\u6b21\u5c1d\u8bd5\u6295\u7a3f\u6216\u6536\u5230\u8be6\u7ec6\u4f5c\u4e1a\u53cd\u9988\u65f6\uff0c\u662f\u5176\u5fc3\u7406\u9632\u7ebf\u7684\u5d29\u6e83\u70b9\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6625\u6c34\u4f60\u597d\u5440\uff01\u770b\u5230\u4f60\u62a5\u540d\u7279\u522b\u4e3a\u4f60\u5f00\u5fc3\uff0c\u4e5f\u7279\u522b\u7406\u89e3\u4f60\u4e00\u8fb9\u5e26\u5a03\u4e00\u8fb9\u60f3\u63d0\u5347\u81ea\u5df1\u7684\u4e0d\u5bb9\u6613\u3002\u54b1\u4eec\u8fd9\u4e2a\u73ed\u554a\uff0c\u5f88\u591a\u90fd\u662f\u5b9d\u5988\u5b9d\u7238\uff0c\u5927\u5bb6\u65f6\u95f4\u90fd\u788e\uff0c\u6240\u4ee5\u6211\u4eec\u4e0d\u62fc\u901f\u5ea6\uff0c\u5c31\u62fc\u2018\u6301\u7eed\u2019\u3002\u4f60\u5343\u4e07\u522b\u6709\u538b\u529b\uff0c\u4f5c\u4e1a\u665a\u4ea4\u4e00\u70b9\u3001\u5b69\u5b50\u95f9\u4e86\u6ca1\u8ddf\u4e0a\u76f4\u64ad\uff0c\u90fd\u6ca1\u5173\u7cfb\uff0c\u968f\u65f6\u627e\u6211\u8865\u3002\u54b1\u4eec\u7684\u7b2c\u4e00\u6b65\u76ee\u6807\u4e0d\u662f\u7acb\u523b\u8d5a\u94b1\uff0c\u800c\u662f\u2018\u5148\u5b8c\u6210\uff0c\u518d\u5b8c\u7f8e\u2019\uff0c\u6bcf\u5199\u51fa\u4e00\u6bb5\u8bdd\u90fd\u503c\u5f97\u7ed9\u81ea\u5df1\u70b9\u4e2a\u8d5e\uff01\u6709\u4efb\u4f55\u5361\u4f4f\u7684\u5730\u65b9\uff0c\u968f\u65f6\u6233\u6211\uff0c\u6211\u5e2e\u4f60\u4e00\u8d77\u770b\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf**\u3011\u3002\u6838\u5fc3\u76ee\u6807\u662f\u5efa\u7acb\u4fe1\u5fc3\u548c\u4e60\u60ef\uff0c\u800c\u975e\u5f3a\u63a8\u53d8\u73b0\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n    1.  **\u3010\u5fae\u4e60\u60ef\u517b\u6210\u5305\u3011**\uff1a\u62c6\u89e3\u6bcf\u65e5/\u6bcf\u5468\u6700\u4f4e\u5b66\u4e60\u76ee\u6807\uff08\u5982\uff1a\u6bcf\u5929\u770b15\u5206\u949f\u5f55\u64ad\uff09\u3002\n    2.  **\u3010\u5f69\u8679\u5c41\u5938\u5938\u7fa4\u7279\u6743\u3011**\uff1a\u5c06\u5176\u62c9\u5165\u5c0f\u8303\u56f4\u9f13\u52b1\u7fa4\uff0c\u5bf9\u5176\u4efb\u4f55\u5fae\u5c0f\u4ea7\u51fa\uff08\u54ea\u6015\u53ea\u662f\u4e00\u4e2a\u5f00\u5934\uff09\u8fdb\u884c\u516c\u5f00\u3001\u5177\u4f53\u7684\u8868\u626c\u3002\n    3.  **\u3010\u9000\u8d39\u5fc3\u7406\u5b89\u5168\u9600\u3011**\uff1a\u4e3b\u52a8\u3001\u5b9a\u671f\u91cd\u7533\u9000\u8d39\u653f\u7b56\uff0c\u51cf\u8f7b\u5176\u201c\u6c89\u6ca1\u6210\u672c\u201d\u7126\u8651\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1.  \u7edd\u4e0d\u5bf9\u5176\u4f7f\u7528\u201c\u522b\u4eba\u884c\u4f60\u4e3a\u4ec0\u4e48\u4e0d\u884c\u201d\u7684\u6fc0\u5c06\u6cd5\u3002\n    2.  \u7edd\u4e0d\u5728\u73ed\u7ea7\u7fa4\u516c\u5f00\u6279\u8bc4\u6216\u6307\u51fa\u5176\u4f5c\u4e1a\u7684\u201c\u4e25\u91cd\u4e0d\u8db3\u201d\uff0c\u9700\u79c1\u804a\u5e76\u4ee5\u201c\u6211\u4eec\u53ef\u4ee5\u8fd9\u6837\u4f18\u5316\u201d\u7684\u53e3\u543b\u6c9f\u901a\u3002\n    3.  \u7edd\u4e0d\u5728\u524d\u671f\u8fc7\u5ea6\u5f3a\u8c03\u201c\u6708\u5165\u8fc7\u4e07\u201d\u6848\u4f8b\uff0c\u907f\u514d\u5236\u9020\u7126\u8651\u548c\u843d\u5dee\u611f\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728C1\u9636\u6bb5\uff0c\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u4f1a\u6781\u5927\u52a0\u5267\u5176\u8d44\u91d1\u538b\u529b\u548c\u540e\u6094\u60c5\u7eea\uff0c\u662f\u9000\u8d39\u7684\u76f4\u63a5\u5bfc\u706b\u7d22\u3002\u9996\u8981\u4efb\u52a1\u662f\u7a33\u4f4f\u57fa\u7840\u73ed\uff0c\u5b8c\u6210\u670d\u52a1\u95ed\u73af\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u8fd8\u662f\u89c9\u5f97\u5fc3\u91cc\u6ca1\u5e95\uff0c\u8981\u4e0d\u6211\u62a5\u4e2a\u666e\u901a\u73ed\u8bd5\u8bd5\u5427\uff0c\u5b66\u5b66\u770b\u770b\u4e0d\u884c\u518d\u9000**\u201d **(\u6838\u5fc3\u52a8\u673a\uff1a\u5bfb\u6c42\u5b89\u5168\u8bd5\u9519)**\n2. > \u201c**\u6211\u6015\u6211\u81ea\u5df1\u4e0d\u884c\u3002**\u201d **(\u6838\u5fc3\u5fc3\u7406\uff1a\u6df1\u5ea6\u81ea\u5351\u4e0e\u81ea\u6211\u6000\u7591)**\n3. > \u201c**\u5b69\u5b50\u4e0d\u592a\u8212\u670d\uff0c\u5728\u5bb6\u91cc\u6211\u4e0d\u6562\u62ff\u624b\u673a\uff0c\u4e00\u62ff\u4ed6\u5c31\u62a2\u3002**\u201d **(\u6838\u5fc3\u8d44\u6e90\uff1a\u65f6\u95f4\u88ab\u4e25\u91cd\u6324\u538b)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6\u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u4e0e\u4fdd\u969c\uff08\u5bb3\u6015\u5931\u8d25\uff0c\u5bfb\u6c42\u65e0\u98ce\u9669\u5c1d\u8bd5\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u81f4\u7684\u60c5\u611f\u5b89\u629a\u4e0e\u201c\u968f\u65f6\u53ef\u9000\u201d\u7684\u5fc3\u7406\u5b89\u5168\u57ab\uff0c\u524d\u671f\u91cd\u966a\u4f34\u8f7b\u65bd\u538b\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
