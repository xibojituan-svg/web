    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4ee5\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\u7684\u8eab\u4efd\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v1.0\u300b\u89c4\u5219\uff0c\u5bf9\u63d0\u4f9b\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | 677149036 (\u864e\u864e\u5fae\u98ce) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-06 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6881\u6d9b (\u9500\u552e/\u62db\u52df\u5b98) -> \u9648\u78ca (\u73ed\u4e3b\u4efb) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6500\u767b\u8ba1\u5212\u7cbe\u82f1\u7248 (3980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931** (\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u8d44\u91d1\u6765\u6e90\u3001\u662f\u5426\u5206\u671f) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931** (\u672a\u63d0\u53ca\u5de5\u4f5c\u3001\u5bb6\u5ead\u3001\u4f5c\u606f) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931** (\u672a\u63d0\u53ca\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u7f6e\u4fe1\u5ea6\u964d\u4f4e\uff09** (\u4ec5\u89c1\u5b66\u4e60\u4e92\u52a8\uff0c\u65e0\u5173\u952e\u4e09\u8f74\u4fe1\u606f) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8 / **\u27a1\u4e2d** / \u2b07\u4f4e\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u80fd\u529b\u4e0e\u53d8\u73b0\u6df7\u5408\u9a71\u52a8(\u4e2d)**\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6709\u58f0\u6f14\u64ad\u7684\u6d53\u539a\u5174\u8da3\u548c\u53c2\u4e0e\u5ea6\uff0c\u4f46\u9500\u552e\u8bdd\u672f\u4e2d\u591a\u6b21\u63d0\u53ca\u201c\u517c\u804c\u6536\u5165\u201d\u3001\u201c\u63a5\u5355\u201d\u3001\u201c\u53d8\u73b0\u201d\uff0c\u7528\u6237\u672a\u660e\u786e\u53cd\u5bf9\uff0c\u4e14\u6700\u7ec8\u8d2d\u4e70\u884c\u4e3a\u53d1\u751f\u5728\u9500\u552e\u5c55\u793a\u201c\u63a5\u5355\u5e73\u53f0\u201d\u548c\u201c\u65b0\u624b\u4e3b\u64ad\u6536\u5165\u201d\u4e4b\u540e\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u6211\u662f\u620f\u7cbe\u201d (\u5174\u8da3\u9a71\u52a8\u4fe1\u53f7)\n> \u201c\u753b\u672c\uff0c\u8fd9\u4e2a\u5165\u624b\u7b80\u5355\u70b9\uff0c\u5f55\u97f3\u4e5f\u53ef\u4ee5\u201d (\u5bf9\u5177\u4f53\u6280\u80fd\u548c\u5b9e\u64cd\u8def\u5f84\u7684\u5173\u6ce8)\n> **\u9500\u552e\u591a\u6b21\u63d0\u53ca**\uff1a\u201c\u77ed\u5267\u6536\u76ca\u9ad8\uff0c2400/\u5c0f\u65f6\u8d77\u6b65\u201d\u3001\u201c\u6211\u53bb\u5e74\u4e5f\u662f\u7eaf\u5c0f\u767d...\u7b2c\u4e00\u4e2a\u6708\u5230\u624b5438\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b06\u9ad8 / **\u27a1\u4e2d** / \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931** \u2014 \u804a\u5929\u8bb0\u5f55\u5b8c\u5168\u672a\u63d0\u53ca\u652f\u4ed8\u80fd\u529b\u3001\u7ecf\u6d4e\u72b6\u51b5\u3001\u8d44\u91d1\u6765\u6e90\u3002**\u65e0\u6cd5\u8bc4\u7ea7\uff0c\u6784\u6210\u91cd\u5927\u98ce\u9669\u76f2\u533a\u3002**\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931** \u2014 \u7528\u6237\u80fd\u6309\u65f6\u53c2\u4e0e\u76f4\u64ad\u3001\u63d0\u4ea4\u4f5c\u4e1a\uff0c\u4f46\u672a\u900f\u9732\u5de5\u4f5c\u6027\u8d28\u3001\u5bb6\u5ead\u8d1f\u62c5\u3001\u56fa\u5b9a\u53ef\u7528\u65f6\u95f4\u3002**\u65e0\u6cd5\u8bc4\u7ea7\u3002**\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931** \u2014 \u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u76f8\u5173\u4fe1\u606f\u3002**\u65e0\u6cd5\u8bc4\u7ea7\uff0c\u6784\u6210\u91cd\u5927\u98ce\u9669\u76f2\u533a\u3002**\n- **\u5e95\u5ea7\u53d6\u77ed\u677f**\uff1a**\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u4e09\u5757\u677f\u5747\u65e0\u4fe1\u606f\uff0c**\u65e0\u6cd5\u8fdb\u884c\u6709\u6548\u8bc4\u7ea7**\uff0c\u8fd9\u662f\u672c\u6b21\u5206\u6790\u7684\u6700\u5927\u98ce\u9669\u70b9\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8 / **\u27a1\u4e2d** / \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a(\u4e2d)**\u3002\u7528\u6237\u8868\u73b0\u51fa\u79ef\u6781\u3001\u914d\u5408\u7684\u5b66\u4e60\u6001\u5ea6\uff0c\u80fd\u5b8c\u6210\u4f5c\u4e1a\u5e76\u83b7\u5f97\u6b63\u9762\u53cd\u9988\uff08\u201c\u4e0d\u9519\u4e0d\u9519\u201d\u3001\u201c\u6392\u5728\u54b1\u73ed\u524d\u4e94\u540d\u201d\uff09\u3002\u5728Pia\u620f\u540e\u8868\u793a\u201c\u8fd8\u597d\u5c31\u662f\u7d27\u5f20\u201d\uff0c\u5c5e\u4e8e\u6b63\u5e38\u60c5\u7eea\u53cd\u5e94\uff0c\u672a\u89c1\u5d29\u6e83\u3001\u62b1\u6028\u6216\u6781\u5ea6\u4e0d\u81ea\u4fe1\u7684\u8a00\u8bba\u3002\u6574\u4f53\u60c5\u7eea\u5e73\u7a33\uff0c\u914d\u5408\u5ea6\u9ad8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u8fd8\u597d\u5c31\u662f\u7d27\u5f20\u201d (\u6b63\u5e38\u60c5\u7eea\u8868\u8fbe\uff0c\u975e\u5d29\u6e83)\n> \u7528\u6237\u80fd\u79ef\u6781\u56de\u590d\u53e3\u4ee4\u3001\u53c2\u4e0e\u6d3b\u52a8\uff0c\u884c\u4e3a\u914d\u5408\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]** \u4e0e **[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 ]** \u6df7\u5408\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u9879\u65b0\u6280\u80fd\uff08\u6709\u58f0\u6f14\u64ad\uff09\u83b7\u5f97\u8ba4\u53ef\u3001\u8bc1\u660e\u81ea\u6211\u4ef7\u503c\uff0c\u5e76\u53ef\u80fd\u5e0c\u671b\u878d\u5165\u4e00\u4e2a\u5fd7\u540c\u9053\u5408\u7684\u793e\u7fa4\u3002\u4ece\u201c\u6211\u662f\u620f\u7cbe\u201d\u7684\u81ea\u8ff0\u548c\u79ef\u6781\u53c2\u4e0ePia\u620f\u3001\u9009\u62e9\u201c\u753b\u672c\u201d\u7b49\u5b9e\u64cd\u65b9\u5411\u6765\u770b\uff0c\u7528\u6237\u5bf9\u83b7\u5f97\u6210\u5c31\u611f\u3001\u4e13\u4e1a\u8eab\u4efd\u8ba4\u540c\u548c\u793e\u7fa4\u5f52\u5c5e\u611f\u6709\u9700\u6c42\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u793e\u7fa4\u5185\u7684\u8eab\u4efd\u8ba4\u540c**\u3002\u63d0\u4f9b\u6e05\u6670\u7684\u6210\u957f\u8def\u5f84\u3001\u5c55\u793a\u5176\u8fdb\u6b65\u3001\u7ed9\u4e88\u201c\u51c6\u4e13\u4e1a\u4eba\u58eb\u201d\u7684\u8ba4\u53ef\uff0c\u5e76\u8425\u9020\u79ef\u6781\u7684\u793e\u7fa4\u6c1b\u56f4\uff0c\u8ba9\u4ed6\u611f\u53d7\u5230\u88ab\u770b\u89c1\u3001\u88ab\u5c0a\u91cd\u3001\u88ab\u9700\u8981\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b (\u6210\u957f\u6295\u8d44\u578b)** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T5 \u597d\u73a9\u5c1d\u9c9c\u578b** (\u5174\u8da3\u9a71\u52a8\uff0c\u79ef\u6781\u53c2\u4e0e\uff0c\u7ecf\u6d4e\u538b\u529b\u672a\u77e5\uff0c\u793e\u4ea4\u5c5e\u6027\u5f3a) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u804a\u5929\u8bb0\u5f55\u4e2d\u672a\u53d1\u73b0\u501f\u8d37\u652f\u4ed8\u3001\u5bb6\u4eba\u53cd\u5bf9\u3001\u91cd\u5927\u5065\u5eb7\u95ee\u9898\u3001\u65f6\u95f4\u7834\u4ea7\u7b49D\u7c7b\u7194\u65ad\u7ea2\u7ebf\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u9ad8** | **\u3010\u4fe1\u606f\u7f3a\u5931\uff0c\u9ad8\u98ce\u9669\u3011** \u804a\u5929\u8bb0\u5f55\u5b8c\u5168\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\u3002\u82e5\u62a5\u540d\u662f\u80cc\u7740\u5bb6\u4eba\u6216\u4f7f\u7528\u5bb6\u5ead\u5171\u540c\u8d44\u91d1\uff0c\u540e\u7eed\u6781\u6613\u5f15\u53d1\u7ea0\u7eb7\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u3010\u4fe1\u606f\u7f3a\u5931\uff0c\u4e2d\u98ce\u9669\u3011** \u7528\u6237\u76ee\u524d\u5b66\u4e60\u79ef\u6781\uff0c\u4f46\u672a\u77e5\u5176\u771f\u5b9e\u5de5\u4f5c/\u751f\u6d3b\u65f6\u95f4\u5b89\u6392\u3002\u82e5\u540e\u7eed\u8bfe\u7a0b\u5f3a\u5ea6\u4e0e\u5176\u5b9e\u65f6\u53ef\u7528\u65f6\u95f4\u51b2\u7a81\uff0c\u53ef\u80fd\u56e0\u65e0\u6cd5\u8ddf\u8fdb\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u76ee\u524d\u8868\u73b0\u60c5\u7eea\u7a33\u5b9a\uff0c\u914d\u5408\u5ea6\u9ad8\uff0c\u672a\u89c1\u6781\u5ea6\u81ea\u5351\u6216\u4f9d\u8d56\u8ff9\u8c61\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d\u9ad8** | \u9500\u552e\u591a\u6b21\u63d0\u53ca\u201c5438\u5143/\u6708\u201d\u3001\u201c2400/\u5c0f\u65f6\u201d\u7b49\u6536\u76ca\u6848\u4f8b\uff0c\u7528\u6237\u52a8\u673a\u4e2d\u6df7\u5408\u53d8\u73b0\u671f\u5f85\u3002\u82e5\u5b66\u4e60\u540e\u77ed\u671f\u5185\u65e0\u6cd5\u8fbe\u5230\u7c7b\u4f3c\u6536\u76ca\uff0c\u6613\u4ea7\u751f\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\u3002\u5f53\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u5b66\u4e60\u8fdb\u5165\u6df1\u6c34\u533a\uff08\u5982\u590d\u6742\u8f6f\u4ef6\u64cd\u4f5c\u3001\u957f\u65f6\u95f4\u7ec3\u4e60\uff09\uff0c\u4e14\u82e5\u63a5\u5355\u8bd5\u97f3\u4e0d\u987a\u5229\u6216\u6536\u76ca\u8fdc\u4f4e\u4e8e\u9884\u671f\u65f6\uff0c\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u864e\u864e\u5fae\u98ce\u540c\u5b66\u4f60\u597d\uff01\u6211\u662f\u4f60\u7684\u73ed\u4e3b\u4efb\u6d6e\u6c89\u3002\u770b\u5230\u4f60\u5728\u8bad\u7ec3\u8425\u91cc\u2018\u620f\u7cbe\u2019\u7684\u7cbe\u5f69\u8868\u73b0\u548c\u79ef\u6781\u7684\u4f5c\u4e1a\u63d0\u4ea4\uff0c\u80fd\u611f\u53d7\u5230\u4f60\u5bf9\u58f0\u97f3\u6f14\u7ece\u662f\u53d1\u81ea\u5185\u5fc3\u7684\u559c\u6b22\u3002\u63a5\u4e0b\u6765\u7684\u7cfb\u7edf\u8bfe\uff0c\u6211\u4eec\u4f1a\u4e00\u8d77\u628a\u8fd9\u4efd\u5174\u8da3\u6253\u78e8\u6210\u66f4\u4e13\u4e1a\u7684\u80fd\u529b\u3002**\u522b\u62c5\u5fc3\u8fdb\u5ea6\uff0c\u54b1\u4eec\u6309\u81ea\u5df1\u7684\u8282\u594f\u6765\uff0c\u6709\u4efb\u4f55\u64cd\u4f5c\u4e0a\u7684\u5361\u70b9\u6216\u8005\u65f6\u95f4\u5b89\u6392\u4e0a\u7684\u56f0\u96be\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4eec\u4e00\u8d77\u89e3\u51b3\u3002** \u6211\u4eec\u7684\u76ee\u6807\u4e0d\u53ea\u662f\u63a5\u5355\uff0c\u66f4\u662f\u8ba9\u4f60\u4eab\u53d7\u7528\u58f0\u97f3\u5851\u9020\u4e16\u754c\u7684\u4e50\u8da3\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5174\u8da3\u6e38\u4e50\u7ebf\u3011** \u7ed3\u5408 **\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011**\u3002\u524d\u671f\u4ee5\u5174\u8da3\u4fdd\u6301\u548c\u57fa\u7840\u6280\u80fd\u592f\u5b9e\u4e3a\u4e3b\uff0c\u4e2d\u671f\u7a7f\u63d2\u4f4e\u95e8\u69db\u8bd5\u97f3\u673a\u4f1a\uff0c\u7ef4\u6301\u5176\u6210\u5c31\u611f\u548c\u53c2\u4e0e\u611f\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176T5\uff08\u597d\u73a9\u5c1d\u9c9c\uff09\u539f\u578b\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u793e\u7fa4\u6d3b\u52a8\u6fc0\u52b1\u5305\u3011**\uff08\u5982\u5b9a\u671fPia\u620f\u6d3b\u52a8\u3001\u58f0\u97f3\u6311\u6218\u8d5b\uff09\uff0c\u5e76\u9488\u5bf9**\u4fe1\u606f\u7f3a\u5931\u7684\u9ad8\u98ce\u9669\u9879**\uff0c\u8865\u5145 **\u3010\u5bb6\u5ead\u652f\u6301\u4e0e\u65f6\u95f4\u89c4\u5212\u6478\u5e95\u5305\u3011**\uff0c\u5728\u5f00\u8bfe\u540e\u7b2c\u4e00\u5468\u5185\u5fc5\u987b\u5b8c\u6210\u4e00\u5bf9\u4e00\u6c9f\u901a\uff0c\u6478\u6e05\u5176\u8d44\u91d1\u3001\u65f6\u95f4\u3001\u5bb6\u5ead\u652f\u6301\u7684\u771f\u5b9e\u60c5\u51b5\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7edd\u4e0d\u5bf9\u5176\u505a\u51fa\u201cX\u6708\u5185\u5fc5\u8d5aX\u5143\u201d\u7684\u4fdd\u5e95\u627f\u8bfa\uff1b\u907f\u514d\u5728\u793e\u7fa4\u4e2d\u8fc7\u5ea6\u9f13\u5439\u201c\u66b4\u5bcc\u201d\u6848\u4f8b\uff0c\u4ee5\u514d\u62c9\u9ad8\u5176\u4e0d\u5207\u5b9e\u9645\u7684\u9884\u671f\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u5728\u672a\u5b8c\u6210\u5bb6\u5ead\u652f\u6301\u4e0e\u65f6\u95f4\u6478\u5e95\u524d\uff0c\u4e25\u7981\u4efb\u4f55\u5347\u5355\u884c\u4e3a**\u3002\u5373\u4f7f\u6478\u5e95\u540e\u60c5\u51b5\u826f\u597d\uff0c\u5347\u5355\u4e5f\u9700\u8c28\u614e\uff0c\u5e94\u57fa\u4e8e\u5176\u6280\u80fd\u6210\u957f\u548c\u771f\u5b9e\u9700\u6c42\uff0c\u800c\u975e\u7126\u8651\u8425\u9500\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u662f\u620f\u7cbe\u201d **(\u5174\u8da3\u4e0e\u81ea\u6211\u8ba4\u540c\u7684\u5f3a\u4fe1\u53f7)**\n2. > \u201c\u753b\u672c\uff0c\u8fd9\u4e2a\u5165\u624b\u7b80\u5355\u70b9\uff0c\u5f55\u97f3\u4e5f\u53ef\u4ee5\u201d **(\u5173\u6ce8\u5177\u4f53\u6280\u80fd\u548c\u53ef\u64cd\u4f5c\u6027\uff0c\u975e\u7a7a\u8c08\u53d8\u73b0)**\n3. > \u201c\u62a53980\u7684\u201d **(\u51b3\u7b56\u76f8\u5bf9\u679c\u65ad\uff0c\u4f46\u7f3a\u4e4f\u652f\u4ed8\u80cc\u666f\u4fe1\u606f\uff0c\u6784\u6210\u98ce\u9669\u76f2\u533a)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T5 \u597d\u73a9\u5c1d\u9c9c\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u8ba4\u53ef\u4e0e\u793e\u7fa4\u5f52\u5c5e\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u9ad8\u98ce\u9669\u3011**\uff0c**\u6838\u5fc3\u98ce\u9669\u6765\u81ea\u4e09\u8f74\u4fe1\u606f\uff08\u8d44\u91d1\u3001\u65f6\u95f4\u3001\u5bb6\u5ead\uff09\u7684\u5b8c\u5168\u7f3a\u5931**\u3002\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5f00\u8bfe\u4e00\u5468\u5185\u5b8c\u6210\u4e00\u5bf9\u4e00\u6df1\u5ea6\u6478\u5e95\uff0c\u8865\u9f50\u4fe1\u606f\u76f2\u533a\uff0c\u5e76\u4e25\u683c\u63a7\u5236\u5176\u6536\u76ca\u9884\u671f\u3011**\u3002\n\n```json\n{\"core_type\": \"T5 \u597d\u73a9\u5c1d\u9c9c\u578b\", \"maslow_need\": \"\u7b2c\u56db\u5c42\u5c0a\u91cd\u9700\u6c42\u4e0e\u7b2c\u4e09\u5c42\u793e\u4ea4\u9700\u6c42\u6df7\u5408\", \"risk_level\": \"\u4e2d\u9ad8\", \"refund_risk\": \"\u4e2d\u9ad8\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf + \u5feb\u901f\u63a5\u5355\u7ebf + \u5bb6\u5ead/\u65f6\u95f4\u6478\u5e95\u5305\"}\n```";
