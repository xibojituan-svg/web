    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49)**\n    *   **\u8868\u5c42\u52a8\u673a**\uff1a\u660e\u786e\u8868\u8fbe\u201c\u5b66\u8fd9\u4e2a\u4e5f\u5c31\u662f\u7ed9\u81ea\u5df1\u5907\u4e2a\u540e\u8def\u201d\uff0c\u5bfb\u6c42\u526f\u4e1a/\u5907\u80ce\u6536\u5165\u6765\u6e90\u3002\n    *   **\u6df1\u5c42\u52a8\u673a**\uff1a\u5bf9\u9ad8\u6536\u76ca\uff08\u5982\u201c1w+\u201d\uff09\u6301\u6000\u7591\u6001\u5ea6\uff0c\u53cd\u590d\u63d0\u53ca\u201c\u4e0d\u6562\u4e00\u4e0b\u62b1\u592a\u5927\u5e0c\u671b\u201d\u3001\u201c\u6015\u5e0c\u671b\u592a\u5927\u201d\u3002**\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u751f\u5b58\u7126\u8651\u4e0b\u7684\u98ce\u9669\u89c4\u907f**\uff0c\u800c\u975e\u5174\u8da3\u6216\u81ea\u6211\u5b9e\u73b0\u3002\u52a8\u673a\u504f\u5411\u5b9e\u7528\u4e3b\u4e49\uff0c\u4f46\u4f34\u968f\u5f3a\u70c8\u7684\u4e0d\u786e\u5b9a\u611f\u548c\u4f4e\u9884\u671f\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d\u4f4e)**\n    *   **\u7ecf\u6d4e\u8d44\u6e90**\uff1a\u660e\u786e\u8868\u793a\u201c\u7ecf\u6d4e\u538b\u529b\u5927\u201d\uff0c\u56e0\u6b64\u9009\u62e9\u5148\u62a5\u57fa\u7840\u73ed\u800c\u975e\u65d7\u8230\u73ed\u3002\u652f\u4ed8\u80fd\u529b\u6709\u9650\uff0c\u5bf9\u4ef7\u683c\u654f\u611f\u3002\n    *   **\u65f6\u95f4\u8d44\u6e90**\uff1a\u63d0\u53ca\u201c\u517c\u804c\u201d\u72b6\u6001\uff0c\u53ef\u6295\u5165\u65f6\u95f4\u6709\u9650\uff08\u5982\u53c2\u8003\u201c\u6bcf\u5929\u6295\u51652\u5c0f\u65f6\u201d\u7684\u89c4\u5212\uff09\u3002\n    *   **\u8ba4\u77e5\u8d44\u6e90**\uff1a\u5177\u5907\u57fa\u7840\u7406\u89e3\u4e0e\u5b66\u4e60\u610f\u613f\uff08\u201c\u542c\u7684\u8d8a\u591a\uff0c\u89c9\u5f97\u9700\u8981\u5b66\u4e60\u7684\u5730\u65b9\u4e5f\u8d8a\u591a\u201d\uff09\uff0c\u4f46\u5904\u4e8e\u201c\u8fde\u76ae\u6bdb\u90fd\u8c08\u4e0d\u4e0a\u201d\u7684\u521d\u59cb\u9636\u6bb5\uff0c\u5bf9\u884c\u4e1a\u8ba4\u77e5\u4f9d\u8d56\u5916\u90e8\u4fe1\u606f\uff08\u5982\u54a8\u8be2\u201c\u8c46\u5305\u201d\uff09\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u7b49)**\n    *   **\u6297\u538b\u6027**\uff1a\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u52a1\u5b9e\u548c\u8c28\u614e\uff08\u201c\u5e73\u5e38\u5fc3\uff0c\u7528\u5fc3\u6708\uff0c\u52aa\u529b\u505a\u201d\uff09\uff0c\u80fd\u63a5\u53d7\u4ece\u57fa\u7840\u5f00\u59cb\u3002\n    *   **\u632b\u6298\u9884\u671f**\uff1a\u5bf9\u5b66\u4e60\u96be\u5ea6\u548c\u53d8\u73b0\u96be\u5ea6\u6709\u9884\u5224\uff08\u201c\u6ca1\u90a3\u4e48\u5bb9\u6613\u201d\uff09\uff0c**\u4f46\u5b58\u5728\u201c\u4f4e\u6295\u5165\u9ad8\u56de\u62a5\u201d\u7684\u6f5c\u5728\u5e7b\u60f3**\uff08\u88ab\u9500\u552e\u201c\u77ed\u5267\u53d8\u73b0\u5feb\u201d\u3001\u201c\u6708\u5165\u8fc7\u4e07\u201d\u6848\u4f8b\u5438\u5f15\uff09\u3002\n    *   **\u51b3\u7b56\u6a21\u5f0f**\uff1a\u5728\u9500\u552e\u9ad8\u538b\u4e0b\u4ecd\u575a\u6301\u81ea\u8eab\u8282\u594f\uff08\u201c\u5148\u57fa\u7840\u73ed\u201d\uff09\uff0c\u6709\u4e00\u5b9a\u81ea\u4e3b\u6027\uff0c\u4f46\u6613\u88ab\u201c\u8d44\u6e90\u201d\u3001\u201c\u98ce\u53e3\u201d\u7b49\u5916\u90e8\u627f\u8bfa\u5f71\u54cd\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a**\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u8d2d\u4e70\u4e86\u57fa\u7840\u73ed\u8bfe\u7a0b\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u914d\u5076\u3001\u7236\u6bcd\u7b49\u7b2c\u4e09\u65b9\u51b3\u7b56\u8005\uff0c\u7528\u6237\u81ea\u4e3b\u51b3\u7b56\u4ed8\u6b3e\uff0c**\u51b3\u7b56\u6743\u6e05\u6670**\u3002\n*   **\u6b65\u9aa41-4\u5224\u5b9a**\uff1a\n    *   **A (\u652f\u4ed8\u80fd\u529b\u4e0e\u610f\u613f)**\uff1a\u652f\u4ed8\u80fd\u529b\u5f31\uff08\u7ecf\u6d4e\u538b\u529b\u5927\uff09\uff0c\u4f46\u652f\u4ed8\u610f\u613f\u5b58\u5728\uff08\u4e3a\u201c\u5907\u540e\u8def\u201d\u4ed8\u8d39\uff09\u3002**\u5224\u5b9a\u4e3aA-\uff08\u652f\u4ed8\u610f\u613f>\u652f\u4ed8\u80fd\u529b\uff09**\u3002\n    *   **B (\u9700\u6c42\u7d27\u8feb\u5ea6)**\uff1a\u9700\u6c42\u4e3a\u201c\u5907\u540e\u8def\u201d\uff0c\u975e\u5373\u65f6\u751f\u5b58\u5371\u673a\uff0c\u6709\u4e00\u5b9a\u89c4\u5212\u6027\uff0c\u7d27\u8feb\u5ea6**\u4e2d\u7b49**\u3002\n    *   **C (\u76ee\u6807\u6e05\u6670\u5ea6)**\uff1a\u76ee\u6807\u6a21\u7cca\uff0c\u4ece\u201c\u6536\u76ca\u5feb\u7684\u201d\u5230\u201c\u5168\u9762\u4e00\u70b9\u201d\uff0c\u53d7\u9500\u552e\u5f15\u5bfc\u660e\u663e\uff0c\u81ea\u8eab\u89c4\u5212\u4e0d\u6e05\u6670\u3002**\u6e05\u6670\u5ea6\u4f4e**\u3002\n    *   **D (\u884c\u52a8\u529b\u4e0e\u670d\u4ece\u6027)**\uff1a\u80fd\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u4e92\u52a8\uff0c\u5bf9\u9500\u552e\u6307\u4ee4\uff08\u5982\u770b\u6587\u6863\u3001\u4e0a\u8bfe\uff09\u6709\u54cd\u5e94\uff0c**\u521d\u59cb\u670d\u4ece\u6027\u4e2d\u7b49**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b\uff1aT5 \u52a1\u5b9e\u5907\u80ce\u578b**\n    *   \u5178\u578b\u7279\u5f81\uff1a\u4e3a\u5e94\u5bf9\u4e0d\u786e\u5b9a\u6027\uff08\u804c\u4e1a/\u6536\u5165\uff09\u5bfb\u6c42\u526f\u4e1a\u6280\u80fd\uff0c\u52a8\u673a\u73b0\u5b9e\uff08\u5907\u540e\u8def\uff09\uff0c\u5bf9\u6295\u5165\u4ea7\u51fa\u6bd4\u654f\u611f\uff0c\u51b3\u7b56\u8c28\u614e\uff0c\u6613\u88ab\u201c\u4fdd\u5e95\u6536\u76ca\u201d\u548c\u201c\u4f4e\u98ce\u9669\u9ad8\u56de\u62a5\u201d\u8bdd\u672f\u6253\u52a8\u3002\n    *   \u672c\u7528\u6237\u9ad8\u5ea6\u543b\u5408\uff1a\u6838\u5fc3\u8bc9\u6c42\u662f\u201c\u5907\u540e\u8def\u201d\uff0c\u5bf9\u201c1w+\u201d\u9ad8\u6536\u76ca\u6000\u7591\u4f46\u5fc3\u5b58\u671f\u5f85\uff0c\u56e0\u7ecf\u6d4e\u538b\u529b\u9009\u62e9\u4f4e\u5355\u4ef7\u5165\u53e3\u4ea7\u54c1\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669\uff1a\u4e2d\u9ad8**\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5df2\u9884\u8bbe\u8f83\u4f4e\u671f\u671b\uff08\u201c\u6015\u5e0c\u671b\u592a\u5927\u201d\uff09\uff0c\u82e5\u521d\u671f\u5b66\u4e60\u6548\u679c\u6216\u5fae\u5c0f\u53d8\u73b0\u6210\u679c\u4e0d\u8fbe\u5176\u201c\u52a0\u5f3a\u4e2a\u4eba\u4fe1\u5fc3\u201d\u7684\u9608\u503c\uff0c\u6781\u6613\u5931\u671b\u3002\n    2.  **\u8d44\u91d1\u538b\u529b**\uff1a**\u9ad8\u98ce\u9669**\u3002\u5df2\u660e\u786e\u201c\u7ecf\u6d4e\u538b\u529b\u5927\u201d\uff0c\u4efb\u4f55\u989d\u5916\u5f00\u652f\u6216\u53d8\u73b0\u5468\u671f\u957f\u90fd\u53ef\u80fd\u6210\u4e3a\u9000\u8d39\u5bfc\u706b\u7d22\u3002\n    3.  **\u865a\u5047\u5ba3\u4f20**\uff1a**\u4e2d\u98ce\u9669**\u3002\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa\u201c\u77ed\u5267\u84dd\u6d77\u201d\u3001\u201c\u5de5\u4f5c\u5ba4\u8d44\u6e90\u201d\u3001\u201c\u6708\u5165\u8fc7\u4e07\u201d\u6848\u4f8b\uff0c**\u4e0e\u7528\u6237\u201c\u6ca1\u90a3\u4e48\u5bb9\u6613\u201d\u7684\u8ba4\u77e5\u5b58\u5728\u5de8\u5927\u843d\u5dee**\uff0c\u662f\u4e3b\u8981\u96f7\u533a\u3002\n    4.  **\u8bfe\u7a0b\u8d28\u91cf**\uff1a\u4e2d\u98ce\u9669\u3002\u53d6\u51b3\u4e8e\u5b9e\u9645\u4ea4\u4ed8\u662f\u5426\u5339\u914d\u9500\u552e\u63cf\u8ff0\u7684\u201c\u7cfb\u7edf\u5b66\u4e60\u201d\u3001\u201c\u5927\u5496\u57f9\u8bad\u201d\u3002\n    5.  **\u670d\u52a1\u4f53\u9a8c**\uff1a\u4e2d\u98ce\u9669\u3002\u73ed\u4e3b\u4efb\u4ea4\u63a5\u540e\u82e5\u670d\u52a1\u65ad\u6863\u6216\u652f\u6301\u4e0d\u8db3\uff0c\u4f1a\u52a0\u5267\u4e0d\u5b89\u5168\u611f\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a\u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u5b9a\u4f4e\u98ce\u9669\u3002\n    7.  **\u7ade\u54c1\u5bf9\u6bd4**\uff1a\u7528\u6237\u63d0\u53ca\u54a8\u8be2\u201c\u8c46\u5305\u201d\uff0c\u663e\u793a\u6709\u81ea\u4e3b\u4fe1\u606f\u641c\u96c6\u4e60\u60ef\uff0c**\u4e2d\u98ce\u9669**\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u26a0\ufe0f \u91cd\u5927\u8fdd\u89c4\u9884\u8b66**\uff1a\n    *   **\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u5938\u5927\u6536\u76ca**\uff1a\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u77ed\u5267\u5267\u672c\u5e02\u573a\u4ef7\u683c\u201d\uff08\u6570\u4e07\uff09\u3001\u201c\u6708\u5165\u8fc7\u4e07\u6bd4\u6bd4\u7686\u662f\u201d\uff0c\u5e76\u5c55\u793a\u4e2a\u4eba\u6536\u76ca\u622a\u56fe\uff0c**\u6d89\u5acc\u7528\u6781\u7aef\u6848\u4f8b\u6697\u793a\u666e\u9002\u7ed3\u679c**\uff0c\u8fdd\u53cd\u98ce\u9669\u63d0\u793a\u4e49\u52a1\u3002\n    *   **\u8425\u9020\u7a00\u7f3a\u4e0e\u7d27\u8feb\u611f**\uff1a\u201c\u4f18\u60e0\u5238\u4e0d\u591a\u201d\u3001\u201c\u53ea\u5269\u4e00\u4e2a\u540d\u989d\u201d\u662f\u5178\u578b\u7684\u8bdd\u672f\u65bd\u538b\u3002\n    *   **\u6a21\u7cca\u5206\u671f\u6761\u6b3e**\uff1a\u5728\u7528\u6237\u591a\u6b21\u8be2\u95ee\u201c\u80fd\u5206\u671f\u4e48\u201d\u3001\u201c\u4e0d\u80fd\u5206\u671f\uff1f\u201d\u65f6\uff0c\u9500\u552e\u56de\u7b54\u201c\u652f\u6301\u4fe1\u7528\u5361\u548c\u652f\u4ed8\u5b9d\u201d\uff0c**\u672a\u6e05\u6670\u8bf4\u660e\u662f\u4fe1\u7528\u5361\u652f\u4ed8\u540e\u7528\u6237\u81ea\u884c\u5411\u94f6\u884c\u7533\u8bf7\u5206\u671f\uff0c\u5b58\u5728\u8bef\u5bfc\u53ef\u80fd**\u3002\n*   **\u5408\u89c4\u70b9**\uff1a\u9500\u552e\u63d0\u53ca\u201c\u5e73\u53f0\u652f\u6301\u65e0\u7406\u7531\u9000\u6b3e\u201d\uff0c\u5c65\u884c\u4e86\u57fa\u672c\u544a\u77e5\u4e49\u52a1\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6838\u5fc3\u7b56\u7565**\uff1a**\u964d\u4f4e\u9884\u671f\uff0c\u592f\u5b9e\u57fa\u7840\uff0c\u5efa\u7acb\u5fae\u5c0f\u6b63\u53cd\u9988**\u3002\u907f\u514d\u7ee7\u7eed\u201c\u753b\u5927\u997c\u201d\uff0c\u8f6c\u5411\u201c\u5c0f\u6b65\u5feb\u8dd1\uff0c\u53ca\u65f6\u6fc0\u52b1\u201d\u3002\n*   **\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u7834\u51b0\u671f\uff08\u5173\u952e\uff09**\uff1a\u9996\u6b21\u6c9f\u901a\u9700**\u4e3b\u52a8\u7ba1\u7406\u9884\u671f**\uff0c\u5f3a\u8c03\u201c\u5199\u4f5c\u6280\u80fd\u9700\u65f6\u95f4\u79ef\u7d2f\u201d\uff0c\u5c06\u76ee\u6807\u4ece\u201c\u5feb\u901f\u8d5a1w+\u201d\u62c6\u89e3\u4e3a\u201c\u7b2c\u4e00\u5468\u5b8c\u6210\u4e00\u4e2a\u5b8c\u6574\u5f00\u5934\u201d\u3001\u201c\u7b2c\u4e00\u4e2a\u6708\u83b7\u5f97\u4e00\u6b21\u4f5c\u4e1a\u7cbe\u9009\u201d\u7b49\u53ef\u8fbe\u6210\u7684\u5c0f\u76ee\u6807\u3002\n    2.  **\u8fc7\u7a0b\u8ddf\u8fdb**\uff1a\u5bc6\u5207\u5173\u6ce8\u5176\u5b66\u4e60\u8fdb\u5ea6\u4e0e\u4f5c\u4e1a\u5b8c\u6210\u8d28\u91cf\uff0c\u7ed9\u4e88**\u5177\u4f53\u3001\u7ec6\u81f4\u7684\u5199\u4f5c\u6280\u5de7\u53cd\u9988**\uff08\u5982\u9500\u552e\u70b9\u8bc4\u5176\u201c\u8bed\u8a00\u98ce\u683c\u201d\u7684\u65b9\u5f0f\uff09\uff0c\u8ba9\u5176\u611f\u53d7\u5230\u201c\u5b66\u5230\u4e1c\u897f\u201d\u7684\u5b9e\u5728\u4ef7\u503c\u3002\n    3.  **\u98ce\u9669\u76d1\u63a7**\uff1a\u7559\u610f\u5176\u63d0\u53ca\u201c\u7ecf\u6d4e\u538b\u529b\u201d\u3001\u201c\u65f6\u95f4\u4e0d\u591f\u201d\u7684\u8a00\u8bba\uff0c\u53ca\u65f6\u63d0\u4f9b\u5b66\u4e60\u89c4\u5212\u5efa\u8bae\uff0c\u9632\u6b62\u56e0\u7cbe\u529b\u4e0d\u6d4e\u800c\u653e\u5f03\u3002\n    4.  **\u9632\u5fa1\u6027\u6c9f\u901a**\uff1a\u5f53\u7528\u6237\u63d0\u53ca\u6536\u76ca\u65f6\uff0c\u5f15\u5bfc\u5173\u6ce8\u201c\u80fd\u529b\u63d0\u5347\u201d\u548c\u201c\u6d41\u7a0b\u638c\u63e1\u201d\uff0c\u800c\u975e\u76f4\u63a5\u91d1\u94b1\u56de\u62a5\u3002**\u8c28\u614e\u4f20\u9012\u9500\u552e\u627f\u8bfa\u7684\u201c\u5de5\u4f5c\u5ba4\u8d44\u6e90\u201d**\uff0c\u9664\u975e\u786e\u6709\u53ef\u9760\u8def\u5f84\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**\uff1a\n    *   **\u5f53\u524d\u6302\u8f7d**\uff1a\u57fa\u7840\u5199\u4f5c\u8bfe\u3002\u7b26\u5408\u5176\u8c28\u614e\u7684\u5165\u95e8\u5fc3\u6001\u3002\n    *   **\u5347\u73ed\u7b56\u7565**\uff1a**\u5207\u5fcc\u77ed\u671f\u5185\u5f3a\u63a8\u9ad8\u9636\u8bfe**\u3002\u5f85\u5176\u5b8c\u6210\u57fa\u7840\u8bfe\u3001\u4ea7\u51fa1-2\u7bc7\u5b8c\u6574\u4f5c\u54c1\u3001\u5e76\u83b7\u5f97\u521d\u6b65\u6b63\u53cd\u9988\uff08\u5982\u73ed\u5185\u8868\u626c\u3001\u5c0f\u989d\u6295\u7a3f\u5c1d\u8bd5\uff09\u540e\uff0c\u518d\u4ee5\u201c\u6df1\u5316\u6280\u80fd\u3001\u89e3\u9501\u66f4\u591a\u53d8\u73b0\u6e20\u9053\u201d\u4e3a\u75
