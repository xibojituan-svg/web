    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 139547406 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u76db\u840c\u5170\uff08\u9500\u552e\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u9ad8\u9636\u8bfe\u7a0b |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e2d\u7b49\u504f\u9971\u6ee1\uff08\u6709\u5b66\u4e60\u4e92\u52a8\u4e0e\u60c5\u7eea\u8868\u8fbe\uff0c\u4f46\u7f3a\u4e4f\u5173\u952e\u80cc\u666f\u4fe1\u606f\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u5173\u6ce8\u6280\u80fd\u63d0\u5347\u4e0e\u81ea\u6211\u5b9e\u73b0\uff0c\u53d8\u73b0\u8bc9\u6c42\u4e0d\u660e\u663e\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u753b\u672c\uff0c\u5ba1\u542c\uff0c\u5bf9\u8f68\uff0c\u540e\u671f\u90fd\u60f3\u5b66\u201d\n> \u201c\u6211\u4f1a\u7ee7\u7eed\u52aa\u529b\uff0c\u597d\u597d\u5b66\u4e60\uff0c\u8981\u5b66\u7684\u4e1c\u897f\u8fd8\u5f88\u591a\uff0c\u6211\u4e00\u5b9a\u4f1a\u8ba4\u771f\u5b66\u597d\u6bcf\u4e00\u4e2a\u6b65\u9aa4\u201d\n> \u201c\u6539\u53d8\u81ea\u5df1\u7684\u58f0\u97f3\uff0c\u53d8\u6210\u5176\u4ed6\u4eba\u54c8\u54c8\u54c8\uff0c\u60f3\u60f3\u90fd\u5f00\u5fc3\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a\u672a\u77e5 \u2014 \u672a\u63d0\u53ca\u7ecf\u6d4e\u72b6\u51b5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a\u4e2d \u2014 \u80fd\u6309\u65f6\u53c2\u4e0e\u76f4\u64ad\u3001\u63d0\u4ea4\u4f5c\u4e1a\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u65f6\u95f4\u5b89\u6392\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a\u672a\u77e5 \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\uff0c\u80fd\u4ece\u632b\u6298\u4e2d\u5feb\u901f\u5b66\u4e60\u5e76\u8c03\u6574\uff0c\u4e0d\u9700\u8981\u989d\u5916\u60c5\u7eea\u5b89\u629a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u59d0\u59d0\uff0c\u6211\u4eca\u5929\u5f55\u8fd9\u4e2a\u7684\u65f6\u5019\uff0c\u603b\u662f\u6ca1\u529e\u6cd5\u4e00\u6b21\u6027\u5f55\u4e0b\u6765...\u8fd9\u4e2a\u6709\u4ec0\u4e48\u529e\u6cd5\u6539\u5584\u5417\u201d\n> \u201c\u542c\u7740\u6211\u90fd\u8981\u7761\u7740\u4e86\uff0c\u4e2d\u95f4\u91cc\u9762\u8fd8\u5c11\u4e86\u4e24\u4e2a\u5b57...\u201d\n> \uff08\u5728\u5f97\u5230\u9500\u552e\u9f13\u52b1\u540e\uff09\u201c\u597d\u7684\uff0c\u597d\u7684\uff0c\u6211\u4f1a\u52a0\u6cb9\u7684\u3002\u6211\u5148\u770b\u770b\u89c6\u9891\uff0c\u597d\u597d\u5b66\u201d\n> \uff08\u6536\u5230\u901a\u5173\u901a\u77e5\u540e\uff09\u201c\u592a\u6fc0\u52a8\u4e86...\u592a\u5f00\u5fc3\u4e86\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a\u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u81ea\u8eab\u6280\u80fd\u4e0d\u5b8c\u7f8e\u7684\u7126\u8651\uff08\u5982\u201c\u8bfb\u7684\u4e00\u70b9\u611f\u60c5\u90fd\u6ca1\u6709\uff0c\u5f88\u6728\u8bb7\u201d\uff09\uff0c\u4ee5\u53ca\u5bf9\u201c\u8ba9\u4e66\u672c\u91cc\u7684\u4eba\u7269\u6d3b\u8fc7\u6765\u201d\u7684\u8868\u6f14\u827a\u672f\u8ffd\u6c42\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u8fdb\u9636\u8def\u5f84\u7684\u6307\u5f15**\u3002\u4ed6\u9700\u8981\u88ab\u8ba4\u53ef\u4e3a\u201c\u6709\u6f5c\u529b\u3001\u53ef\u5851\u6027\u5f3a\u201d\u7684\u5b66\u5458\uff0c\u5e76\u770b\u5230\u6e05\u6670\u7684\u6280\u80fd\u6210\u957f\u5730\u56fe\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 B \u7c7b |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | T2 \u4f4e\u8c03\u8001\u9ec4\u725b\uff08\u6b63\u5411\u8fdb\u5316\u4e2d\uff09 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u672a\u63d0\u53ca\u5bb6\u5ead\uff0c\u98ce\u9669\u672a\u77e5\u4f46\u4e0d\u9ad8\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u5b66\u4e60\u610f\u613f\u5f3a\uff0c\u80fd\u8ddf\u4e0a\u8282\u594f\uff0c\u5d29\u76d8\u98ce\u9669\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u4e3b\u52a8\u5bfb\u6c42\u65b9\u6cd5\u5e76\u81ea\u6211\u8c03\u6574\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | **\u82e5\u957f\u671f\u65e0\u6cd5\u83b7\u5f97\u4e13\u4e1a\u4e0a\u7684\u7cbe\u8fdb\u611f\u6216\u63a5\u5355\u673a\u4f1a\u6e3a\u832b\uff0c\u53ef\u80fd\u4ea7\u751f\u4ef7\u503c\u6000\u7591\u3002**\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe\u540e2-3\u4e2a\u6708\uff0c\u82e5\u6280\u80fd\u8fdb\u5165\u5e73\u53f0\u671f\u4e14\u65e0\u5b9e\u8d28\u6027\u6210\u679c\uff08\u5982\u63a5\u5355\u3001\u83b7\u5f97\u6df1\u5ea6\u53cd\u9988\uff09\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u606d\u559c\u901a\u5173\uff01\u4f60\u7684\u52aa\u529b\u548c\u609f\u6027\u6211\u4eec\u90fd\u770b\u5230\u4e86\u3002\u63a5\u4e0b\u6765\u7684\u7cfb\u7edf\u8bfe\uff0c\u6211\u4eec\u4f1a\u5e26\u4f60\u4ece\u2018\u4f1a\u8bfb\u2019\u5230\u2018\u4f1a\u6f14\u2019\uff0c\u89e3\u51b3\u4f60\u63d0\u5230\u7684\u2018\u60c5\u7eea\u91ca\u653e\u2019\u548c\u2018\u4eba\u7269\u9c9c\u6d3b\u2019\u7684\u95ee\u9898\u3002\u4f60\u8fd9\u79cd\u80af\u94bb\u7814\u3001\u80fd\u81ea\u7701\u7684\u52b2\u5934\uff0c\u662f\u6210\u4e3a\u597d\u4e3b\u64ad\u6700\u5b9d\u8d35\u7684\u7279\u8d28\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011+ \u3010\u9636\u6bb5\u6027\u6210\u679c\u5c55\u793a\uff08\u5982\u53c2\u4e0e\u5267\u7ec4\u8bd5\u97f3\uff09\u3011\u3002**\u4e25\u7981\u8fc7\u65e9\u4ea4\u53c9\u63a8\u9500\u9ad8\u9636\u8bfe\u7a0b**\uff0c\u9700\u5f85\u5176\u57fa\u7840\u6280\u80fd\u7a33\u56fa\u540e\uff0c\u518d\u81ea\u7136\u5f15\u5bfc\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u51e0\u5929\u5c31\u80fd\u8d5a\u94b1\u201d\u7684\u8bdd\u672f\u523a\u6fc0\u4ed6\uff1b\u5ffd\u89c6\u4ed6\u7684\u6280\u672f\u6027\u63d0\u95ee\uff1b\u53ea\u7ed9\u9e21\u6c64\u4e0d\u7ed9\u5177\u4f53\u6539\u8fdb\u65b9\u6cd5\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u63a8\u4ecb\u9ad8\u9636\u8bfe\u7a0b\uff0c\u4f46\u5fc5\u987b\u5efa\u7acb\u5728\u201c\u4ed6\u5df2\u638c\u63e1\u57fa\u7840\u6280\u80fd\uff0c\u9700\u8981\u7a81\u7834\u74f6\u9888\u201d\u7684\u660e\u786e\u9700\u6c42\u4e0a\uff0c**\u4e25\u7981\u5728\u57fa\u7840\u672a\u7a33\u65f6\u5f3a\u63a8**\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u753b\u672c\uff0c\u5ba1\u542c\uff0c\u5bf9\u8f68\uff0c\u540e\u671f\u90fd\u60f3\u5b66\u201d \u2014\u2014 **\u5c55\u73b0\u5f3a\u70c8\u7684\u5b66\u4e60\u6b32\u548c\u63a2\u7d22\u7cbe\u795e\uff0c\u52a8\u673a\u7eaf\u5ea6\u9ad8\u7684\u76f4\u63a5\u8bc1\u636e\u3002**\n2. > \u201c\u6211\u662f\u89c9\u5f97\u81ea\u5df1\u7684\u60c5\u7eea\u8868\u8fbe\u4e0d\u591f...\u6709\u4e9b\u9700\u8981\u91ca\u653e\u60c5\u7eea\u7684\u65f6\u5019\uff0c\u5634\u5df4\u50cf\u7c98\u4f4f\u4e86\u4e00\u6837\u201d \u2014\u2014 **\u81ea\u6211\u8981\u6c42\u9ad8\uff0c\u5173\u6ce8\u6280\u80fd\u7ec6\u8282\uff0c\u662f\u5178\u578b\u7684T2/T3\u6df7\u5408\u7279\u5f81\u3002**\n3. > \u201c\u6211\u4f1a\u7ee7\u7eed\u52aa\u529b\uff0c\u597d\u597d\u5b66\u4e60\uff0c\u8981\u5b66\u7684\u4e1c\u897f\u8fd8\u5f88\u591a\uff0c\u6211\u4e00\u5b9a\u4f1a\u8ba4\u771f\u5b66\u597d\u6bcf\u4e00\u4e2a\u6b65\u9aa4\u201d \u2014\u2014 **\u8868\u73b0\u51fa\u8e0f\u5b9e\u3001\u81ea\u5f8b\u7684\u8001\u9ec4\u725b\u7279\u8d28\uff0c\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u76f4\u9762\u4e0d\u8db3\u5e76\u8ba1\u5212\u514b\u670d\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u81ea\u6211\u5b9e\u73b0\u4e0e\u6280\u80fd\u7cbe\u8fdb\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u6301\u7eed\u63d0\u4f9b\u6709\u6df1\u5ea6\u7684\u4e13\u4e1a\u53cd\u9988\u548c\u6e05\u6670\u7684\u6210\u957f\u8def\u5f84\uff0c\u907f\u514d\u8ba9\u5176\u9677\u5165\u201c\u5b66\u800c\u65e0\u7528\u201d\u7684\u8ff7\u832b\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
