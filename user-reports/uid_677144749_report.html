    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a (UID: 677144749)\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (Motive Purity): \u4e2d\u9ad8**\n    *   **\u5b66\u4e60\u6295\u5165**: \u7528\u6237\u79ef\u6781\u53c2\u4e0e\u8bad\u7ec3\u8425\u4efb\u52a1\uff08\u6668\u7ec3\u3001\u89c6\u9891\u8bfe\u3001\u76f4\u64ad\uff09\u3001\u6309\u65f6\u63d0\u4ea4\u4f5c\u4e1a\uff08\u65c1\u767d\u3001\u89d2\u8272\u97f3\uff09\u3001\u4e3b\u52a8\u5bf9\u6bd4\u6a21\u4eff\u3001\u5bfb\u6c42\u53cd\u9988\uff08\u201c\u81ea\u5df1\u542c\u8d77\u6765\u602a\u602a\u7684\u201d\uff09\u3002\u8868\u73b0\u51fa\u5bf9\u6280\u80fd\u63d0\u5347\u7684\u771f\u5b9e\u5174\u8da3\u548c\u884c\u52a8\u529b\u3002\n    *   **\u53d8\u73b0\u9884\u671f**: \u5bf9\u201c\u5f55\u4e66\u3001\u5bf9\u8f68\u3001\u7f8e\u5de5\u201d\u7b49\u517c\u804c\u5de5\u4f5c\u8868\u793a\u5174\u8da3\uff0c\u5e76\u4e3b\u52a8\u5c1d\u8bd5\u201c\u5f55\u4e86\u97f3\u53d1\u7ed9\u7532\u65b9\u201d\u3002**\u5b58\u5728\u901a\u8fc7\u526f\u4e1a/\u517c\u804c\u83b7\u5f97\u6536\u5165\u7684\u660e\u786e\u671f\u671b**\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u201c\u4e00\u591c\u66b4\u5bcc\u201d\u6216\u201c\u8f7b\u677e\u6708\u5165\u8fc7\u4e07\u201d\u7b49\u4e0d\u5207\u5b9e\u9645\u7684\u5e7b\u60f3\u3002\n    *   **\u4fe1\u53f7**: \u5174\u8da3\u9a71\u52a8\u4e0e\u53d8\u73b0\u9a71\u52a8\u5e76\u5b58\uff0c\u4ee5\u6280\u80fd\u5b66\u4e60\u4e3a\u57fa\u7840\uff0c\u5bf9\u53d8\u73b0\u8def\u5f84\u6709\u52a1\u5b9e\u63a2\u7d22\u610f\u613f\u3002\n\n*   **\u8d44\u6e90\u5e95\u5ea7 (Resource Base): \u4e2d\u7b49 (\u4fe1\u606f\u4e0d\u8db3)**\n    *   **\u65f6\u95f4\u8d44\u6e90**: \u80fd\u8ddf\u4e0a\u5bc6\u96c6\u7684\u6668\u7ec3\u3001\u76f4\u64ad\u3001\u4f5c\u4e1a\u4efb\u52a1\uff0c\u8868\u660e\u8fd1\u671f\u6709\u53ef\u652f\u914d\u7684\u4e1a\u4f59\u65f6\u95f4\u3002\n    *   **\u7ecf\u6d4e\u8d44\u6e90**: \u652f\u4ed8\u4e862380\u5143\u8bfe\u7a0b\u8d39\u7528\uff0c\u5177\u5907\u4e00\u5b9a\u7684\u6d88\u8d39\u80fd\u529b\u3002\u4f46**\u7f3a\u4e4f\u5bb6\u5ead\u8d22\u52a1\u72b6\u51b5\u3001\u804c\u4e1a\u3001\u6536\u5165\u6c34\u5e73\u7b49\u5173\u952e\u4fe1\u606f**\uff0c\u65e0\u6cd5\u8bc4\u4f30\u5176\u652f\u4ed8\u538b\u529b\u3002\n    *   **\u8bbe\u5907/\u73af\u5883\u8d44\u6e90**: \u4f7f\u7528\u624b\u673a\u5f55\u97f3\uff0c\u63d0\u53ca\u201c\u6362\u4e86\u4e00\u4e2a\u8f6f\u4ef6\u201d\u89e3\u51b3\u95ee\u9898\uff0c\u5177\u5907\u57fa\u7840\u5165\u95e8\u6761\u4ef6\uff0c\u4f46\u672a\u63d0\u53ca\u4e13\u4e1a\u8bbe\u5907\u3002\n    *   **\u4fe1\u53f7**: \u5177\u5907\u5165\u95e8\u7ea7\u5b66\u4e60\u7684\u57fa\u7840\u8d44\u6e90\uff0c\u4f46\u6df1\u5c42\u7ecf\u6d4e\u627f\u538b\u80fd\u529b\u672a\u77e5\u3002\n\n*   **\u5fc3\u7406\u5f39\u6027 (Psychological Resilience): \u4e2d\u9ad8**\n    *   **\u53cd\u9988\u63a5\u7eb3**: \u79ef\u6781\u63a5\u53d7\u9500\u552e\uff08\u5e08\u59d0\uff09\u7684\u8be6\u7ec6\u70b9\u8bc4\u548c\u5efa\u8bae\uff08\u201c\u597d\u7684\uff0c\u660e\u767d\u4e86\u201d\uff09\uff0c\u5e76\u7acb\u5373\u5b9e\u8df5\uff08\u8ddf\u8bfb\u7ec3\u4e60\uff09\u3002\n    *   **\u632b\u6298\u5e94\u5bf9**: \u5bf9\u81ea\u6211\u7ec3\u4e60\u6548\u679c\u6709\u6e05\u9192\u8ba4\u77e5\uff08\u201c\u611f\u89c9\u6709\u70b9\u53d8\u5316\uff0c\u53c8\u611f\u89c9\u6ca1\u53d8\u5316\u201d\uff09\uff0c\u80fd\u4e3b\u52a8\u63d0\u51fa\u56f0\u60d1\uff0c\u800c\u975e\u8f7b\u6613\u6c14\u9981\u6216\u5426\u5b9a\u81ea\u5df1\u3002\n    *   **\u4e3b\u52a8\u6027**: \u4e3b\u52a8\u8fdb\u884c\u5bf9\u6bd4\u5b66\u4e60\u3001\u6a21\u4eff\uff0c\u5e76\u5c1d\u8bd5\u5411\u5916\uff08\u201c\u7532\u65b9\u201d\uff09\u6295\u9012\u5f55\u97f3\uff0c\u5b66\u4e60\u6001\u5ea6\u79ef\u6781\u3001\u5f00\u653e\u3002\n    *   **\u4fe1\u53f7**: \u5b66\u4e60\u5fc3\u6001\u7a33\u5b9a\u3001\u52a1\u5b9e\uff0c\u5177\u5907\u8f83\u597d\u7684\u6210\u957f\u578b\u601d\u7ef4\u548c\u884c\u52a8\u529b\uff0c\u6297\u632b\u6298\u80fd\u529b\u521d\u6b65\u663e\u73b0\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u5df2\u901a\u8fc7**\u3002\u7528\u6237\u4e8e4\u67088\u65e5\u652f\u4ed82380\u5143\u62a5\u540d\u9ad8\u9636\u73ed\uff0c\u5e76\u5b8c\u6210\u8ba2\u5355\u622a\u56fe\u786e\u8ba4\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u3001\u914d\u5076\u6216\u5171\u540c\u51b3\u7b56\u8005\u7684\u4fe1\u606f\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u4e3a\u4e2a\u4eba\u72ec\u7acb\u51b3\u7b56\u3002**\u6b64\u4e3a\u5173\u952e\u4fe1\u606f\u7f3a\u53e3**\u3002\n*   **\u6b65\u9aa41 (\u52a8\u673a\u7eaf\u5ea6)**: \u901a\u8fc7\u3002\u517c\u5177\u5b66\u4e60\u5174\u8da3\u4e0e\u5408\u7406\u53d8\u73b0\u9884\u671f\uff0c\u975e\u7eaf\u6295\u673a\u6216\u7eaf\u5a31\u4e50\u3002\n*   **\u6b65\u9aa42 (\u8d44\u6e90\u5e95\u5ea7)**: **\u6709\u6761\u4ef6\u901a\u8fc7**\u3002\u652f\u4ed8\u884c\u4e3a\u8868\u660e\u5177\u5907\u57fa\u7840\u7ecf\u6d4e\u80fd\u529b\uff0c\u4f46\u5bb6\u5ead\u8d22\u52a1\u80cc\u666f\u672a\u77e5\uff0c\u5b58\u5728\u9690\u6027\u98ce\u9669\u3002\n*   **\u6b65\u9aa43 (\u5fc3\u7406\u5f39\u6027)**: \u901a\u8fc7\u3002\u8868\u73b0\u51fa\u826f\u597d\u7684\u5b66\u4e60\u97e7\u6027\u3001\u4e3b\u52a8\u6027\u548c\u63a5\u7eb3\u53cd\u9988\u7684\u80fd\u529b\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**: **B\u7c7b\u7528\u6237 (\u6f5c\u529b\u578b)**\u3002\u5b66\u4e60\u52a8\u673a\u6b63\u3001\u884c\u52a8\u529b\u5f3a\u3001\u5fc3\u6001\u597d\uff0c\u662f\u4f18\u8d28\u6f5c\u529b\u5b66\u5458\u3002\u4f46\u5bb6\u5ead\u51b3\u7b56\u6743\u4e0e\u7ecf\u6d4e\u5e95\u5ea7\u7684\u5b8c\u6574\u6027\u5b58\u7591\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b: T4 \u52a1\u5b9e\u63a2\u7d22\u8005**\n    *   **\u7279\u5f81\u543b\u5408**:\n        1.  **\u76ee\u6807\u660e\u786e**: \u5bf9\u201c\u5f55\u4e66\u3001\u5bf9\u8f68\u3001\u7f8e\u5de5\u201d\u7b49\u5177\u4f53\u5de5\u79cd\u6709\u5174\u8da3\uff0c\u53d8\u73b0\u76ee\u7684\u6e05\u6670\u4f46\u52a1\u5b9e\u3002\n        2.  **\u884c\u52a8\u529b\u5f3a**: \u6309\u65f6\u5b8c\u6210\u6240\u6709\u5b66\u4e60\u4efb\u52a1\uff0c\u4e3b\u52a8\u7ec3\u4e60\u3001\u5bf9\u6bd4\u3001\u63d0\u4ea4\u4f5c\u4e1a\uff0c\u751a\u81f3\u5c1d\u8bd5\u5411\u5916\u6295\u9012\u3002\n        3.  **\u7406\u6027\u6295\u5165**: \u652f\u4ed8\u540e\u5173\u6ce8\u8bfe\u7a0b\u6fc0\u6d3b\u3001\u8fdb\u7fa4\u7b49\u540e\u7eed\u4e8b\u5b9c\uff0c\u884c\u4e3a\u8fde\u8d2f\u3002\n        4.  **\u91cd\u89c6\u53cd\u9988**: \u5bf9\u9500\u552e\u7684\u4e13\u4e1a\u6307\u5bfc\u56de\u5e94\u79ef\u6781\uff0c\u5e76\u7528\u4e8e\u6539\u8fdb\u7ec3\u4e60\u3002\n    *   **\u504f\u79bb\u70b9**: \u672a\u8868\u73b0\u51faT4\u5178\u578b\u7684\u5f3a\u70c8\u201c\u81ea\u6211\u89c4\u5212\u201d\u6216\u201c\u6210\u672c\u6536\u76ca\u8ba1\u7b97\u201d\u8a00\u8bba\uff0c\u66f4\u504f\u5411\u4e8e\u8ddf\u968f\u6307\u5bfc\u3001\u8e0f\u5b9e\u6267\u884c\u3002\u4f46\u6574\u4f53\u884c\u4e3a\u6a21\u5f0f\u7b26\u5408\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669\u7b49\u7ea7: \u4f4e**\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u6548\u679c\u4e0d\u7b26\u9884\u671f**: **\u4f4e**\u3002\u7528\u6237\u5bf9\u5b66\u4e60\u96be\u5ea6\u6709\u8ba4\u77e5\uff08\u201c\u8981\u5b66\u4e60\u7684\u4e1c\u897f\u975e\u5e38\u591a\u201d\uff09\uff0c\u4e14\u4ece\u7ec3\u4e60\u4e2d\u5df2\u83b7\u5f97\u6b63\u5411\u53cd\u9988\u548c\u8fdb\u6b65\u611f\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**: **\u4e2d (\u4fe1\u606f\u4e0d\u8db3)**\u3002\u652f\u4ed8\u91d1\u989d2380\u5143\uff0c\u672a\u8868\u73b0\u51fa\u72b9\u8c6b\u6216\u8bae\u4ef7\u3002**\u4f46\u5bb6\u5ead\u8d22\u52a1\u60c5\u51b5\u672a\u77e5\uff0c\u662f\u4e3b\u8981\u98ce\u9669\u53d8\u91cf**\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**: **\u4f4e**\u3002\u76ee\u524d\u8ddf\u8bfe\u7d27\u5bc6\uff0c\u672a\u63d0\u53ca\u65f6\u95f4\u95ee\u9898\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9**: **\u4e2d\u9ad8 (\u4fe1\u606f\u4e0d\u8db3)**\u3002**\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u5b8c\u5168\u7f3a\u5931\uff0c\u662f\u6700\u5927\u98ce\u9669\u70b9**\u3002\u4e00\u65e6\u5bb6\u5ead\u4e3b\u8981\u6210\u5458\u53cd\u5bf9\uff0c\u53ef\u80fd\u5f15\u53d1\u9000\u8d39\u3002\n    5.  **\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa**: **\u4f4e**\u3002\u9500\u552e\u627f\u8bfa\u4e86\u201c\u7248\u6743\u4e66\u201d\u3001\u201c\u5e26\u6559\u201d\u3001\u201c\u63a5\u5355\u6e20\u9053\u201d\uff0c\u4f46\u672a\u51fa\u73b0\u201c\u4fdd\u5e95\u6536\u5165\u201d\u3001\u201c\u8f7b\u677e\u6708\u5165\u8fc7\u4e07\u201d\u7b49\u7edd\u5bf9\u5316\u627f\u8bfa\u3002\u7528\u6237\u9884\u671f\u76f8\u5bf9\u7406\u6027\u3002\n    6.  **\u670d\u52a1\u4f53\u9a8c\u843d\u5dee**: **\u4f4e**\u3002\u9500\u552e\u670d\u52a1\u7ec6\u81f4\u3001\u53cd\u9988\u53ca\u65f6\uff0c\u7528\u6237\u4e92\u52a8\u826f\u597d\u3002\n    7.  **\u7ade\u54c1/\u66ff\u4ee3\u65b9\u6848**: **\u4f4e**\u3002\u7528\u6237\u5df2\u6295\u5165\u5b66\u4e60\u5e76\u5c1d\u8bd5\u63a5\u5355\uff0c\u8f6c\u6362\u6210\u672c\u5df2\u4ea7\u751f\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5408\u89c4\u60c5\u51b5: \u57fa\u672c\u5408\u89c4\uff0c\u5b58\u5728\u8f7b\u5fae\u64e6\u8fb9**\n    *   **\u79ef\u6781\u65b9\u9762**: \u9500\u552e\u63d0\u4f9b\u4e86\u5177\u4f53\u7684\u6280\u80fd\u6307\u5bfc\u3001\u7ec3\u4e60\u53cd\u9988\uff0c\u5e76\u5f3a\u8c03\u4e86\u7ec3\u4e60\u548c\u79ef\u7d2f\u7684\u91cd\u8981\u6027\u3002\n    *   **\u98ce\u9669\u70b9**:\n        1.  **\u8d44\u6e90\u8bf1\u5bfc**: \u9891\u7e41\u4f7f\u7528\u201c\u7248\u6743\u4e66\u201d\u3001\u201c\u5267\u793e\u8d44\u6e90\u201d\u3001\u201c\u63a5\u5355\u201d\u3001\u201c\u65f6\u85aa\u201d\u7b49\u4f5c\u4e3a\u6fc0\u52b1\u548c\u4fc3\u6210\u624b\u6bb5\uff0c\u53ef\u80fd\u5f3a\u5316\u7528\u6237\u7684\u53d8\u73b0\u9884\u671f\u3002\n        2.  **\u201c\u72ec\u5ba0\u201d\u8bdd\u672f**: \u4f7f\u7528\u201c\u72ec\u5ba0\u201d\u3001\u201c\u770b\u597d\u4f60\u201d\u3001\u201c\u5a18\u5bb6\u4eba\u201d\u7b49\u60c5\u611f\u7ed1\u5b9a\u8bdd\u672f\uff0c\u53ef\u80fd\u5f71\u54cd\u7528\u6237\u7406\u6027\u51b3\u7b56\u3002\n        3.  **\u7d27\u8feb\u6027\u8425\u9020**: \u201c\u6700\u540e\u4e00\u6b21\u8003\u6838\u201d\u3001\u201c\u73b0\u573a\u53d1\u4f18\u60e0\u5238\u201d\u3001\u201c\u540d\u989d\u5df2\u5360\u201d\u7b49\u8bdd\u672f\u5236\u9020\u7a00\u7f3a\u611f\u548c\u7d27\u8feb\u611f\u3002\n    *   **\u7ed3\u8bba**: \u672a\u53d1\u73b0\u4e25\u91cd\u8fdd\u89c4\uff08\u5982\u4f2a\u9020\u6536\u5165\u3001\u62c5\u4fdd\u5c31\u4e1a\uff09\uff0c\u4f46\u9500\u552e\u8fc7\u7a0b\u4e2d\u5b58\u5728\u4ee5\u8d44\u6e90\u548c\u670d\u52a1\u627f\u8bfa\u4fc3\u5355\u7684\u503e\u5411\uff0c**\u9700\u5173\u6ce8\u540e\u7eed\u670d\u52a1\u80fd\u5426\u5151\u73b0\u8fd9\u4e9b\u8d44\u6e90\u627f\u8bfa**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6: \u5339\u914d**\n    *   \u7528\u6237\u7684\u5b66\u4e60\u6001\u5ea6\u3001\u884c\u52a8\u529b\u4e0e\u7cfb\u7edf\u8bfe\u6240\u9700\u7684\u6301\u7eed\u6295\u5165\u5339\u914d\u5ea6\u9ad8\u3002\u5176\u5bf9\u53d8\u73b0\u7684\u52a1\u5b9e\u671f\u5f85\u4e5f\u4e0e\u8bfe\u7a0b\u63d0\u4f9b\u7684\u6280\u80fd\u548c\u6e20\u9053\u8d44\u6e90\u65b9\u5411\u4e00\u81f4\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c: 24h\u5185\u542f\u52a8\u5bb6\u5ead\u77e5\u60c5\u786e\u8ba4\u4e0e\u6df1\u5ea6\u5b66\u60c5\u6c9f\u901a**\n    *   **\u6838\u5fc3\u52a8\u4f5c**: \u73ed\u4e3b\u4efb\u6dfb\u52a0\u540e\uff0c\u9996\u8981\u4efb\u52a1\u5e76\u975e\u50ac\u8bfe\uff0c\u800c\u662f\u8fdb\u884c\u4e00\u8f6e\u6df1\u5ea6\u6c9f\u901a\u3002\n        1.  **\u5bb6\u5ead\u77e5\u60c5\u786e\u8ba4**: \u4ee5\u5173\u6000\u53e3\u543b\uff0c\u81ea\u7136\u8be2\u95ee\u201c\u5b66\u4e60\u65f6\u95f4\u5b89\u6392\u662f\u5426\u548c\u5bb6\u4eba\u6c9f\u901a\u597d\u201d\u3001\u201c\u652f\u4ed8\u65b9\u5f0f\u662f\u5426\u65b9\u4fbf\u201d\u7b49\uff0c**\u95f4\u63a5\u6838\u5b9e\u5bb6\u5ead\u51b3\u7b56\u652f\u6301\u5ea6**\u3002\u8fd9\u662f\u98ce\u63a7\u5173\u952e\u3002\n        2.  **\u9884\u671f\u7ba1\u7406\u5f3a\u5316**: \u57fa\u4e8e\u5176\u201c\u52a1\u5b9e\u63a2\u7d22\u8005\u201d\u7279\u8d28\uff0c\u80af\u5b9a\u5176\u5b66\u4e60\u6001\u5ea6\uff0c\u540c\u65f6\u5ba2\u89c2\u8bf4\u660e\u6709\u58f0\u884c\u4e1a\u7684\u6210\u957f\u8def\u5f84\u3001\u6536\u5165\u66f2\u7ebf\uff08\u524d\u671f\u6295\u5165\u5927\u3001\u56de\u62a5\u6162\uff09\u3001\u4ee5\u53ca\u6210\u529f\u6240\u9700\u7684\u65f6\u95f4\u4e0e\u7ec3\u4e60\u5f3a\u5ea6\u3002**\u5c06\u5176\u201c\u5c0f\u5c0f\u62c5\u5fc3\u201d\u8f6c\u5316\u4e3a\u7406\u6027\u7684\u957f\u671f\u5b66\u4e60\u8ba1\u5212**\u3002\n        3.  **\u8d44\u6e90\u5bf9\u63a5\u94fa\u57ab**: \u660e\u786e\u544a\u77e5\u7248\u6743\u4e66\u3001\u8bd5\u97f3\u6e20\u9053\u7b49\u8d44\u6e90\u7684\u83b7\u53d6\u89c4\u5219\u3001\u65f6\u95f4\u8282\u70b9\u548c\u6807\u51c6\uff0c\u7ba1\u7406\u5176\u5bf9\u201c\u5e08\u59d0\u72ec\u5ba0\u8d44\u6e90\u201d\u7684\u5373\u65f6\u6027\u9884\u671f\uff0c\u5c06\u5176\u5f15\u5bfc\u81f3\u901a\u8fc7\u7cfb\u7edf\u5b66\u4e60\u8fbe\u6807\u540e\u81ea\u7136\u83b7\u53d6\u7684\u8def\u5f84\u4e0a\u3002\n    *   **\u540e\u7eed\u7b56\u7565**: \u5c06\u5176\u5217\u4e3a**\u91cd\u70b9\u57f9\u517b\u5bf9\u8c61**\u3002\u63d0\u4f9b\u66f4\u7ec6\u81f4\u7684\u4f5c\u4e1a\u53cd\u9988\uff0c\u9f13\u52b1\u5176\u5728\u5b66\u4e60\u7fa4\u5185\u5206\u4eab\u7ec3\u4e60\u5fc3\u5f97\uff0c\u6811\u7acb\u4e3a\u201c\u8fdb\u6b65\u5178\u578b\u201d\u3002\u53ef\u9002\u5f53\u5206\u914d\u4e00\u4e9b\u5165\u95e8\u7ea7\u7684\u8bd5\u97f3\u673a\u4f1a\uff0c\u4fdd\u6301\u5176\u5b66\u4e60\u52a8\u529b\u4e0e\u4fe1\u5fc3\uff0c\u4f46\u9700\u660e\u786e\u544a\u77e5\u8bd5\u97f3\u7ade\u4e89\u7684\u5ba2\u89c2\u6027\u3002\n\n{\"core_type\": \"T4 \u52a1\u5b9e\u63a2\u7d22\u8005\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"product_match\": \"\u5339\u914d\", \"action\": \"24h\u5185\u542f\u52a8\u5bb6\u5ead\u77e5\u60c5\u786e\u8ba4\u4e0e\u6df1\u5ea6\u5b66\u60c5\u6c9f\u901a\"}";
