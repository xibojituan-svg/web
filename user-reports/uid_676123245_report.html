    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a676123245 (\u6635\u79f0\uff1a\u6653\u8339/\u8339\u59d0\u59d0) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-02-10 \u81f3 2026-03-15 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e/\u73ed\u4e3b\u4efb\uff1a\u51cc\u96e8\u73ed\u73ed(\u6768\u8587)\u3001\u8d1d\u8d1d\u99ac7(\u9a6c\u65b0\u6708)\u3001\u51ac\u51ac\u8001\u5e08 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u4fe1\u606f\u7f3a\u5931\uff08\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5177\u4f53\u8bfe\u7a0b\u4e0e\u4ef7\u683c\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u65e0\u6cd5\u5224\u65ad\u652f\u4ed8\u65b9\u5f0f\u3001\u8d44\u91d1\u6765\u6e90\u3001\u662f\u5426\u5b58\u5728\u501f\u8d37\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u6781\u4f4e**\u3002\u7528\u6237\u970024\u5c0f\u65f6\u5728\u533b\u9662\u966a\u62a4\u4e2d\u5ea6\u5fc3\u8870\u7684\u6bcd\u4eb2\uff0c\u660e\u786e\u8868\u793a\u201c\u803d\u8bef\u6211\u4e0a\u8bfe\u201d\u3001\u201c\u4ece\u5fc3\u91cc\u7d2f\u5f97\u614c\u201d\uff0c\u65f6\u95f4\u88ab\u4e25\u91cd\u6324\u5360\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\u3002\u672a\u63d0\u53ca\u5bb6\u4eba\u5bf9\u5b66\u4e60\u7684\u77e5\u60c5\u4e0e\u652f\u6301\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u7f3a\u4e4f\u5173\u4e8e\u52a8\u673a\u3001\u652f\u4ed8\u80fd\u529b\u3001\u5bb6\u5ead\u51b3\u7b56\u3001\u5b66\u4e60\u76ee\u6807\u3001\u8fc7\u5f80\u7ecf\u5386\u7b49\u5173\u952e\u4fe1\u606f\u3002\u804a\u5929\u5185\u5bb9\u4ee5\u60c5\u611f\u4e92\u52a8\u3001\u8282\u65e5\u795d\u798f\u548c\u65e5\u5e38\u5173\u6000\u4e3a\u4e3b\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b07\u4f4e\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u52a8\u673a\u4e0d\u660e\uff0c\u4f46\u53d8\u73b0\u9884\u671f\u6a21\u7cca**\u3002\u804a\u5929\u8bb0\u5f55\u4e2d\u672a\u63d0\u53ca\u4efb\u4f55\u5173\u4e8e\u5b66\u4e60\u76ee\u6807\u3001\u53d8\u73b0\u671f\u671b\u3001\u8bfe\u7a0b\u5185\u5bb9\u6216\u80fd\u529b\u63d0\u5347\u7684\u5177\u4f53\u95ee\u9898\u3002\u4e92\u52a8\u7126\u70b9\u5b8c\u5168\u5728\u60c5\u611f\u8fde\u63a5\u548c\u65e5\u5e38\u5173\u6000\u4e0a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> *\u201c\u5e08\u59d0\uff0c\u6211\u53ef\u4ee5\u53bb\u63a5\u8bd5\u97f3\u5355\u5417\uff0c\u6211\u770b\u7fa4\u91cc\u53d1\u4e86\u4e00\u6761\u201d* (\u552f\u4e00\u4e0e\u5b66\u4e60\u6210\u679c\u76f8\u5173\u7684\u4e3b\u52a8\u8be2\u95ee\uff0c\u4f46\u7f3a\u4e4f\u6df1\u5ea6)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u672a\u63d0\u53ca\u6536\u5165\u3001\u652f\u4ed8\u3001\u4ef7\u683c\u654f\u611f\u5ea6\u3002\u4f46\u63d0\u53ca\u6bcd\u4eb2\u4f4f\u9662\u201c\u70e7\u94b1\u4f3c\u7684\uff0c\u4e00\u888b\u4e03\u767e\u201d\uff0c\u53ef\u80fd\u5b58\u5728\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u6781\u4f4e** \u2014 \u7528\u6237\u660e\u786e\u8868\u793a\u201c\u5728\u533b\u9662\u966a\u5e8a\u201d\u3001\u201c\u803d\u8bef\u6211\u4e0a\u8bfe\u201d\u3001\u201c\u4ece\u5fc3\u91cc\u7d2f\u5f97\u614c\u201d\uff0c\u5904\u4e8e**24\u5c0f\u65f6\u7167\u62a4**\u72b6\u6001\uff0c\u65e0\u56fa\u5b9a\u5b66\u4e60\u65f6\u95f4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u672a\u63d0\u53ca\u5bb6\u4eba\u5bf9\u5b66\u4e60\u7684\u652f\u6301\u6216\u53cd\u5bf9\uff0c\u4f46\u5bb6\u5ead\u91cd\u5fc3\u5728\u7167\u987e\u91cd\u75c5\u6bcd\u4eb2\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u27a1\u4e2d\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a(\u4e2d)**\u3002\u7528\u6237\u8868\u73b0\u51fa\u6781\u5f3a\u7684\u5171\u60c5\u80fd\u529b\u548c\u5bf9\u73ed\u4e3b\u4efb\u7684\u60c5\u611f\u4f9d\u8d56\uff08\u8ba4\u4f5c\u59d0\u59b9\uff09\uff0c\u4e3b\u52a8\u5173\u6000\u73ed\u4e3b\u4efb\u3002\u9762\u5bf9\u5b66\u4e60\u4e2d\u65ad\uff08\u56e0\u966a\u62a4\uff09\u80fd\u63a5\u53d7\u5b89\u6392\uff08\u770b\u56de\u653e\uff09\uff0c\u672a\u8868\u73b0\u51fa\u5d29\u6e83\u6216\u5f52\u548e\u5e73\u53f0\u3002\u4f46\u5f53\u524d\u751f\u6d3b\u538b\u529b\u5de8\u5927\uff0c\u60c5\u7eea\u6d88\u8017\u4e25\u91cd\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> *\u201c\u53ef\u662f\u65e2\u7136\u5df2\u7ecf\u5f00\u59cb\u5b66\u4e86\uff0c\u5c31\u575a\u6301\u5457\u201d* (\u663e\u793a\u4e00\u5b9a\u97e7\u6027) > *\u201c\u8fd9\u4e24\u5929\u611f\u89c9\u4ece\u5fc3\u91cc\u7d2f\u5f97\u614c\u201d* (\u663e\u793a\u5f53\u524d\u538b\u529b\u5de8\u5927)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34** \u4e0e **\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42** \u6df7\u5408\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u5ea6\u7684\u60c5\u611f\u5b64\u72ec\u4e0e\u751f\u6d3b\u91cd\u538b\u4e0b\u7684\u966a\u4f34\u6e34\u6c42**\u3002\u7528\u6237\u4e3b\u52a8\u4e0e\u73ed\u4e3b\u4efb\u5efa\u7acb\u62df\u4eb2\u7f18\u5173\u7cfb\uff08\u8ba4\u59d0\u59b9\uff09\uff0c\u9ad8\u9891\u53d1\u9001\u8282\u65e5\u795d\u798f\u548c\u65e5\u5e38\u5173\u6000\uff0c\u5176\u884c\u4e3a\u6838\u5fc3\u662f\u5bfb\u6c42\u60c5\u611f\u8fde\u63a5\u548c\u793e\u7fa4\u5f52\u5c5e\u611f\uff0c\u4ee5\u5bf9\u6297\u56e0\u7167\u987e\u91cd\u75c5\u6bcd\u4eb2\u800c\u4ea7\u751f\u7684\u8eab\u5fc3\u75b2\u60eb\u4e0e\u5b64\u7acb\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u65e0\u538b\u529b\u7684\u60c5\u611f\u652f\u6301\u4e0e\u793e\u7fa4\u5f52\u5c5e\u611f**\u3002\u5979\u9700\u8981\u7684\u4e0d\u662f\u4e00\u4e2a\u4e25\u5389\u7684\u7763\u5b66\uff0c\u800c\u662f\u4e00\u4e2a\u6e29\u6696\u7684\u201c\u59b9\u59b9\u201d\u548c\u4e00\u7fa4\u53ef\u4ee5\u5076\u5c14\u4ea4\u6d41\u3001\u83b7\u5f97\u9f13\u52b1\u7684\u201c\u540c\u5b66\u201d\uff0c\u4f5c\u4e3a\u5979\u6c89\u91cd\u751f\u6d3b\u7684\u4e00\u4e2a\u60c5\u7eea\u51fa\u53e3\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udd34 D\u7c7b\uff08\u9ad8\u5371\u7194\u65ad\u578b\uff09** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T8 \u6f5c\u6c34\u5403\u74dc\u578b** (\u5f53\u524d\u884c\u4e3a\u66f4\u504f\u5411\u5bfb\u6c42\u60c5\u611f\u8fde\u63a5\uff0c\u800c\u975e\u6df1\u5ea6\u5b66\u4e60) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\ud83d\udd34**\u5df2\u89e6\u53d1 D \u7c7b\u7194\u65ad\u7ea2\u7ebf\uff01**\n- **\u89e6\u53d1\u56e0\u7531**\uff1a**\u65f6\u95f4\u7ea2\u7ebf**\u3002\u7528\u6237\u5904\u4e8e\u201c24\u5c0f\u65f6\u7167\u62a4\u5c97/\u5168\u5929\u5019\u966a\u62a4\u201d\u72b6\u6001\uff08\u7167\u987e\u4e2d\u5ea6\u5fc3\u8870\u7684\u6bcd\u4eb2\uff09\uff0c\u660e\u786e\u8868\u793a\u65e0\u6cd5\u4fdd\u8bc1\u5b66\u4e60\u65f6\u95f4\uff0c\u7b26\u5408D\u7c7b\u7194\u65ad\u6761\u4ef6\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4e2d | \u82e5\u5bb6\u4eba\u53d1\u73b0\u5176\u82b1\u8d39\u65f6\u95f4\u91d1\u94b1\u5728\u5b66\u4e60\u4e0a\uff0c\u800c\u672a\u80fd\u5168\u529b\u7167\u987e\u6bcd\u4eb2\uff0c\u53ef\u80fd\u5f15\u53d1\u77db\u76fe\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u56e0\u966a\u62a4\u538b\u529b\u5b8c\u5168\u65e0\u6cd5\u8ddf\u8bfe\u3001\u5b8c\u6210\u4f5c\u4e1a\uff0c\u4ea7\u751f\u201c\u94b1\u767d\u82b1\u4e86\u201d\u7684\u6127\u759a\u611f\u548c\u632b\u8d25\u611f\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u7528\u6237\u5fc3\u7406\u5f39\u6027\u5c1a\u53ef\uff0c\u4e14\u4e0e\u73ed\u4e3b\u4efb\u5173\u7cfb\u4eb2\u5bc6\uff0c\u4e0d\u6613\u56e0\u6b64\u7834\u9632\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u56e0\u65e0\u6cd5\u6295\u5165\u65f6\u95f4\u5b9e\u8df5\uff0c\u770b\u4e0d\u5230\u4efb\u4f55\u5b66\u4e60\u6210\u679c\u6216\u53d8\u73b0\u53ef\u80fd\uff0c\u4ea7\u751f\u4ef7\u503c\u8d28\u7591\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\u3002\u5f53\u8bfe\u7a0b\u8fdb\u5165\u9700\u8981\u6295\u5165\u66f4\u591a\u65f6\u95f4\u7ec3\u4e60\u548c\u63d0\u4ea4\u4f5c\u4e1a\u7684\u9636\u6bb5\uff0c\u800c\u7528\u6237\u4ecd\u88ab\u56f0\u5728\u533b\u9662\u65f6\uff0c\u632b\u8d25\u611f\u5c06\u8fbe\u5230\u9876\u5cf0\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u8339\u59d0\u59d0\uff0c\u77e5\u9053\u4f60\u6700\u8fd1\u7167\u987e\u963f\u59e8\u7279\u522b\u8f9b\u82e6\uff0c\u5fc3\u91cc\u8fd8\u60e6\u8bb0\u7740\u5b66\u4e60\uff0c\u771f\u7684\u7279\u522b\u4e0d\u5bb9\u6613\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u554a\uff0c\u56de\u653e\u6c38\u4e45\u6709\u6548\uff0c\u4f60\u5343\u4e07\u522b\u6709\u538b\u529b\u3002\u4ec0\u4e48\u65f6\u5019\u963f\u59e8\u60c5\u51b5\u7a33\u5b9a\u4e86\uff0c\u4f60\u6709\u70b9\u81ea\u5df1\u7684\u65f6\u95f4\u4e86\uff0c\u968f\u65f6\u6253\u5f00\u770b\u4e24\u773c\u5c31\u5f53\u653e\u677e\u3002\u54b1\u4eec\u8fd9\u4e2a\u73ed\u6c38\u8fdc\u662f\u4f60\u7684\u540e\u82b1\u56ed\uff0c\u6211\u548c\u540c\u5b66\u4eec\u90fd\u5728\u8fd9\u513f\u966a\u7740\u4f60\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u60c5\u611f\u7597\u6108\u966a\u4f34\u7ebf\u3011**\u3002\u6838\u5fc3\u4e0d\u662f\u4ea4\u4ed8\u6280\u80fd\uff0c\u800c\u662f\u63d0\u4f9b\u7a33\u5b9a\u7684\u60c5\u611f\u652f\u6301\u548c\u4f4e\u538b\u529b\u793e\u7fa4\u5f52\u5c5e\u611f\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\u4e14\u4e0d\u56fa\u5b9a\u7684\u7279\u70b9\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a**\u3010\u5f02\u6b65\u5b66\u4e60\u652f\u6301\u5305\u3011**\uff08\u7cbe\u534e\u7247\u6bb5\u526a\u8f91\u3001\u6587\u5b57\u8981\u70b9\u603b\u7ed3\uff09\u3001**\u3010\u5fc3\u7406\u8212\u7f13\u8f7b\u5185\u5bb9\u5305\u3011**\uff08\u77ed\u97f3\u9891\u51a5\u60f3\u3001\u9f13\u52b1\u8bed\u5f55\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u50ac\u4f5c\u4e1a\u3001\u50ac\u5230\u8bfe\u3001\u5f3a\u8c03\u53d8\u73b0\u627f\u8bfa\u3002\u7981\u6b62\u4efb\u4f55\u589e\u52a0\u5176\u5fc3\u7406\u8d1f\u62c5\u7684\u8a00\u884c\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5f62\u5f0f\u7684\u5347\u5355**\u3002\u5f53\u524d\u72b6\u6001\u4e0b\u7684\u4efb\u4f55\u4ed8\u8d39\u884c\u4e3a\u90fd\u53ef\u80fd\u5728\u672a\u6765\u6210\u4e3a\u5ba2\u8bc9\u5bfc\u706b\u7d22\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > *\u201c\u5509\uff0c\u6ca1\u6709\u529e\u6cd5\u5440\uff0c\u4e2d\u5ea6\u5fc3\u8870\uff0c\u6bcf\u5929\u8981\u8f93\u836f\uff0c\u63a7\u5236\u4e00\u4e0b\uff0c\u5979\u4e0d\u542c\u8bdd\uff0c\u603b\u548c\u62a4\u5de5\u6253\u67b6\uff0c\u90fd\u6362\u4e86\u4e09\u4e2a\u4e86\uff0c\u4f60\u8bf4\u7684\u592a\u5bf9\u4e86\uff0c\u803d\u8bef\u6211\u4e0a\u8bfe\u5440\uff0c\u6628\u665a\u521a\u8fdb\u76f4\u64ad\u95f4\uff0c\u62a4\u5de5\u5c31\u53eb\u6211\u2026\uff0c\u53ef\u662f\u65e2\u7136\u5df2\u7ecf\u5f00\u59cb\u5b66\u4e86\uff0c\u5c31\u575a\u6301\u5457\u201d*\n2. > *\u201c\u70e7\u94b1\u4f3c\u7684\uff0c\u4e00\u888b\u4e03\u767e\u201d*\n3. > *\u201c\u8fd8\u51d1\u5408\uff0c\u6709\u62a4\u5de5\u7ba1\u5927\u4e8b\u4e86\uff0c\u8fd9\u4e24\u5929\u611f\u89c9\u4ece\u5fc3\u91cc\u7d2f\u5f97\u614c\u201d*\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010\u60c5\u611f\u4f9d\u8d56\u578b\u966a\u62a4\u5bb6\u5c5e\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u6c89\u91cd\u751f\u6d3b\u538b\u529b\u4e0b\u5bfb\u627e\u60c5\u611f\u5bc4\u6258\u548c\u793e\u7fa4\u5f52\u5c5e\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u505c\u6b62\u4e00\u5207\u5b66\u4e1a\u65bd\u538b\uff0c\u8f6c\u4e3a\u7eaf\u7cb9\u7684\u60c5\u611f\u966a\u4f34\u4e0e\u652f\u6301\uff0c\u5e76\u505a\u597d\u968f\u65f6\u542f\u52a8\u7eff\u8272\u9000\u8d39\u901a\u9053\u7684\u51c6\u5907\u3011**\u3002\n\n```json\n{\"core_type\": \"T8 \u6f5c\u6c34\u5403\u74dc\u578b (\u60c5\u611f\u4f9d\u8d56\u53d8\u4f53)\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u793e\u4ea4\u9700\u6c42\u4e0e\u5b89\u5168\u9700\u6c42\u6df7\u5408\", \"target_product_line\": \"\u60c5\u611f\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
