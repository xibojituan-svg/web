    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4ee5\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\u7684\u8eab\u4efd\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 226323433 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-13 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u559c\u64ad\u4e0d\u51e1\u3001\u4e14\u6162\u6211\u53eb\u82cf\u5c0f\u9ed8(\u82cf\u9896)\u3001\u732b\u540e\u6709\u732b(\u5218\u6d0b) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u8fdb\u9636\u6f14\u64ad\u8bfe\uff082026\u7b2c1\u671f\uff09\uff0c\u540e\u7eed\u62a5\u540d\u8fd0\u8425\u8bfe |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u9700\u6838\u67e5\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\u5177\u4f53\u804c\u4e1a\u6216\u65f6\u95f4\u5b89\u6392\uff0c\u63a8\u6d4b\u4e3a**\u788e\u7247\u5316\u62fc\u51d1**\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\uff08\u6709\u5b66\u4e60\u884c\u4e3a\u4e0e\u4e92\u52a8\uff0c\u4f46\u7f3a\u4e4f\u5173\u952e\u80cc\u666f\u4fe1\u606f\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e\uff0c\u4f46\u4f34\u968f\u5bf9\u6280\u80fd\u6210\u957f\u7684\u5173\u6ce8**\u3002\u7528\u6237\u4e3b\u52a8\u8be2\u95ee\u8bfe\u7a0b\u3001\u9884\u7ea61V1\u3001\u62a5\u540d\u8fd0\u8425\u8bfe\uff0c\u8868\u73b0\u51fa\u79ef\u6781\u7684\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b\u3002\u5176\u52a8\u673a\u6df7\u5408\u4e86\u53d8\u73b0\u8bc9\u6c42\u4e0e\u6280\u80fd\u63d0\u5347\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u60a8\u597d\uff0c\u6700\u8fd1\u54b1\u6709\u8bfe\u7a0b\u5417\uff0c\u6211\u60f3\u9ebb\u70e6\u60a8\u6392\u4e00\u4e0b\u8bfe\u201d (\u4e3b\u52a8\u6c42\u5b66)\n> \u201c\u563f\u563f\uff0c\u6211\u8fd8\u4ee5\u4e3a\u5f97\u6392\u671f\u5462\uff0c\u8fd9\u4e00\u4e0b\u5b50\u7ea6\u4e0a\u4e86\uff0c\u6211\u8fd8\u6709\u70b9\u5c0f\u6fc0\u52a8\uff0c\u90fd\u6709\u70b9\u7d27\u5f20\u5566\u201d (\u91cd\u89c6\u5b66\u4e60\u673a\u4f1a)\n> \u201c\u62a5\u5b8c\u4e86\u201d (\u5bf9\u8fdb\u9636\u8bfe\u7a0b\u201c\u8fd0\u8425\u8bfe\u201d\u679c\u65ad\u4ed8\u8d39)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u591f\u652f\u4ed8\u8fdb\u9636\u8bfe\u7a0b\u8d39\u7528\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\uff0c\u4f46\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u5145\u88d5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u6309\u65f6\u53c2\u52a0\u8bfe\u7a0b\u3001\u4e3b\u52a8\u9884\u7ea6\u5e76\u5b8c\u62101V1\uff0c\u8868\u660e\u6709\u76f8\u5bf9\u56fa\u5b9a\u7684\u5b66\u4e60\u65f6\u95f4\u5b89\u6392\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u804c\u4e1a\uff0c\u65e0\u6cd5\u5224\u65ad\u81ea\u7531\u5ea6\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8 (7-8\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u7528\u6237\u9047\u5230\u95ee\u9898\uff08\u627e\u4e0d\u5230\u56de\u653e\u3001\u4e0d\u61c2\u58f0\u5c55\u8981\u6c42\uff09\u65f6\uff0c\u80fd\u4e3b\u52a8\u3001\u793c\u8c8c\u5730\u5411\u73ed\u73ed\u63d0\u95ee\uff0c\u83b7\u5f97\u89e3\u7b54\u540e\u7acb\u5373\u6267\u884c\uff0c\u672a\u8868\u73b0\u51fa\u4efb\u4f55\u7126\u8651\u3001\u62b1\u6028\u6216\u81ea\u6211\u5426\u5b9a\u60c5\u7eea\u3002\u9762\u5bf9\u5b9d\u8d35\u76841V1\u673a\u4f1a\uff0c\u867d\u6709\u201c\u7d27\u5f20\u201d\u548c\u201c\u6fc0\u52a8\u201d\uff0c\u4f46\u80fd\u8fc5\u901f\u8c03\u6574\u5e76\u79ef\u6781\u51c6\u5907\uff0c\u5fc3\u6001\u79ef\u6781\u7a33\u5b9a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u73ed\u73ed\uff0c\u6628\u665a\u5927\u5927\u7684\u76f4\u64ad\u8bfe\u7684\u56de\u653e\u5728\u54ea\u91cc\u80fd\u770b\u5230\u554a\uff1f\u6211\u627e\u4e0d\u5230\u4e86\u201d (\u9047\u5230\u95ee\u9898\uff0c\u76f4\u63a5\u3001\u6e05\u6670\u5730\u63d0\u95ee)\n> \u201c\u73ed\u73ed\uff0c\u6211\u6ca1\u5f55\u8fc7\u58f0\u5c55\uff0c\u6240\u4ee5\u60f3\u95ee\u60a8\u4e00\u4e0b...\u201d\uff08\u4e3b\u52a8\u5bfb\u6c42\u64cd\u4f5c\u6307\u5f15\uff0c\u6001\u5ea6\u8c26\u900a\uff09\n> \u201c\u563f\u563f\uff0c\u673a\u4f1a\u5b9d\u8d35\u554a\uff0c\u5fc5\u987b\u627e\u5230\u5e72\u8d27\u554a[\u5472\u7259]\u201d (\u5c06\u7d27\u5f20\u8f6c\u5316\u4e3a\u79ef\u6781\u7684\u884c\u52a8\u52a8\u529b)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 (Esteem Needs)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u4e13\u4e1a\u9886\u57df\uff08\u914d\u97f3/\u8fd0\u8425\uff09\u7684\u89c4\u5219\u548c\u8def\u5f84\u4e0d\u719f\u6089\uff0c\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u6b63\u786e\u7684\u65b9\u6cd5\u548c\u83b7\u5f97\u4e13\u4e1a\u6307\u5bfc\uff0c\u6765\u8d62\u5f97\u4ed6\u4eba\uff08\u7532\u65b9\u3001\u540c\u884c\uff09\u7684\u8ba4\u53ef\u4e0e\u5c0a\u91cd\uff0c\u5b9e\u73b0\u81ea\u6211\u4ef7\u503c\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u8d4b\u80fd**\u3002\u63d0\u4f9b\u6e05\u6670\u3001\u6743\u5a01\u7684\u6307\u5bfc\uff0c\u5e2e\u52a9\u4ed6\u5efa\u7acb\u201c\u5185\u884c\u201d\u7684\u81ea\u4fe1\uff0c\u5e76\u4e3a\u5176\u521b\u9020\u5c55\u793a\u80fd\u529b\u3001\u83b7\u5f97\u8ba4\u53ef\u7684\u673a\u4f1a\uff08\u5982\u8bd5\u97f3\u3001\u63a5\u5355\uff09\u3002\u4ed6\u9700\u8981\u7684\u662f\u201c\u519b\u5e08\u201d\u548c\u201c\u5f15\u8def\u4eba\u201d\uff0c\u800c\u975e\u5355\u7eaf\u7684\u60c5\u7eea\u5b89\u629a\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u95f7\u58f0\u5e72\u786c\u6838\u6d3b\u6c42\u80af\u5b9a) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4f4e** | \u672a\u53d1\u73b0\u76f8\u5173\u4fe1\u53f7\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u7528\u6237\u4e3b\u52a8\u6027\u5f3a\uff0c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u770b\u4f3c\u826f\u597d\uff0c\u4f46\u9700\u786e\u8ba4\u5176\u957f\u671f\u65f6\u95f4\u7a33\u5b9a\u6027\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u4e8b\u4e3b\u52a8\u6c42\u89e3\uff0c\u5fc3\u6001\u79ef\u6781\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | **\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u7528\u6237\u6709\u660e\u786e\u7684\u53d8\u73b0\u671f\u5f85\uff08\u62a5\u540d\u8fd0\u8425\u8bfe\uff09\uff0c\u82e5\u5728\u5408\u7406\u5468\u671f\u5185\uff08\u59823-6\u4e2a\u6708\uff09\u63a5\u5355/\u53d8\u73b0\u8def\u5f84\u4e0d\u6e05\u6670\u6216\u6210\u679c\u4e0d\u8fbe\u9884\u671f\uff0c\u53ef\u80fd\u4ea7\u751f\u5931\u671b\u60c5\u7eea\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe3-6\u4e2a\u6708\u540e\uff0c\u5f53\u6280\u80fd\u5b66\u4e60\u8fdb\u5165\u5e73\u53f0\u671f\uff0c\u4f46\u63a5\u5355\u53d8\u73b0\u6210\u679c\u672a\u663e\u73b0\u65f6\u3002**\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u540c\u5b66\u4f60\u597d\uff0c\u770b\u5230\u4f60\u4e3b\u52a8\u7ea6\u8bfe\u548c\u63d0\u95ee\uff0c\u80fd\u611f\u53d7\u5230\u4f60\u5bf9\u5b66\u4e60\u7684\u8ba4\u771f\u548c\u6e34\u671b\u3002\u54b1\u4eec\u8fd9\u4e2a\u73ed\u50cf\u4f60\u4e00\u6837\u8e0f\u5b9e\u80af\u5e72\u7684\u540c\u5b66\u4e0d\u5c11\uff0c\u63a5\u4e0b\u6765\u6211\u4f1a\u91cd\u70b9\u7ed9\u4f60\u5339\u914d\u4e00\u4e9b\u6709\u6311\u6218\u6027\u4f46\u80fd\u51fa\u6210\u679c\u7684\u5b9e\u6218\u4efb\u52a1\u548c\u6d3e\u5355\u673a\u4f1a\u3002\u6709\u4efb\u4f55\u6280\u672f\u6216\u8def\u5f84\u4e0a\u7684\u56f0\u60d1\uff0c\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u628a\u5b83\u653b\u514b\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176T2\u8001\u9ec4\u725b\u7279\u8d28\uff0c\u63d0\u4f9b\u624e\u5b9e\u7684\u6280\u80fd\u8bad\u7ec3\u548c\u660e\u786e\u7684\u8fdb\u9636\u8def\u5f84\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u9ad8\u5fc3\u7406\u5f39\u6027\u548c\u5c0a\u91cd\u9700\u6c42\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145**\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743 (B\u6a21\u5757)**\u3011\u548c**\u3010\u8eab\u4efd\u4e0e\u6743\u529b\u5149\u73af\u521d\u6b65\u8d4b\u80fd (D\u6a21\u5757)**\u3011\u3002\u4f8b\u5982\uff0c\u5728\u5176\u5b8c\u6210\u9ad8\u8d28\u91cf\u4f5c\u4e1a\u540e\uff0c\u53ef\u9080\u8bf7\u5176\u62c5\u4efb\u5c0f\u7ec4\u957f\u6216\u4f5c\u4e1a\u70b9\u8bc4\u5b98\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u8fc7\u4e8e\u201c\u5a31\u4e50\u5316\u201d\u6216\u201c\u60c5\u611f\u6cdb\u6ee5\u201d\u7684\u65b9\u5f0f\u6c9f\u901a\uff0c\u8fd9\u4f1a\u88ab\u89c6\u4e3a\u4e0d\u4e13\u4e1a\u3002\u4e0d\u8981\u753b\u4e0d\u5207\u5b9e\u9645\u7684\u201c\u66b4\u5bcc\u201d\u5927\u997c\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u7528\u6237\u5df2\u8868\u73b0\u51fa\u590d\u8d2d\u610f\u613f\uff08\u62a5\u540d\u8fd0\u8425\u8bfe\uff09\uff0c\u540e\u7eed\u53ef\u6839\u636e\u5176\u5b66\u4e60\u8fdb\u5ea6\u548c\u6210\u679c\uff0c\u63a8\u4ecb\u66f4\u9ad8\u7ea7\u522b\u7684\u79c1\u6559\u8bfe\u3001\u8bbe\u5907\u8bfe\u6216\u9879\u76ee\u5236\u5b9e\u6218\u8425\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u73ed\u73ed\uff0c\u6211\u6ca1\u5f55\u8fc7\u58f0\u5c55\uff0c\u6240\u4ee5\u60f3\u95ee\u60a8\u4e00\u4e0b\uff0c\u60c5\u7eea\u58f0\u5c55\u5c31\u662f\u5904\u7406\u8fc7\u7684\u5e72\u97f3\u5c31\u53ef\u4ee5\u5417\uff1f\u7136\u540e\u662f\u5728\u6587\u4ef6\u540d\u79f0\u4e0a\u6807\u660e\u90fd\u662f\u4ec0\u4e48\u60c5\u7eea\u5417\uff1f[\u62b1\u62f3]\u201d **(\u4f53\u73b0\u8c26\u900a\u3001\u597d\u5b66\u3001\u9075\u5faa\u89c4\u5219)**\n2. > \u201c\u563f\u563f\uff0c\u6211\u8fd8\u4ee5\u4e3a\u5f97\u6392\u671f\u5462\uff0c\u8fd9\u4e00\u4e0b\u5b50\u7ea6\u4e0a\u4e86\uff0c\u6211\u8fd8\u6709\u70b9\u5c0f\u6fc0\u52a8\uff0c\u90fd\u6709\u70b9\u7d27\u5f20\u5566\u201d **(\u4f53\u73b0\u5bf9\u5b66\u4e60\u673a\u4f1a\u7684\u73cd\u89c6\u548c\u79ef\u6781\u5fc3\u6001)**\n3. > \u201c\u563f\u563f\uff0c\u673a\u4f1a\u5b9d\u8d35\u554a\uff0c\u5fc5\u987b\u627e\u5230\u5e72\u8d27\u554a[\u5472\u7259]\u201d **(\u6838\u5fc3\u52a8\u673a\uff1a\u8ffd\u6c42\u5b9e\u8d28\u6027\u7684\u6280\u80fd\u63d0\u5347\u548c\u6210\u679c)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2\u4f4e\u8c03\u8001\u9ec4\u725b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u4e13\u4e1a\u9886\u57df\u7684\u5c0a\u91cd\u4e0e\u8ba4\u53ef**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4f4e**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u6e05\u6670\u3001\u6709\u6311\u6218\u7684\u6210\u957f\u8def\u5f84\u548c\u53ca\u65f6\u7684\u5b9e\u6218\u6210\u679c\u53cd\u9988\uff0c\u4e25\u9632\u201c\u5b66\u800c\u65e0\u7528\u201d\u7684\u6536\u76ca\u843d\u5dee**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\"}\n```";
