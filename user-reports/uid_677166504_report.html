    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677166504\u7684\u7528\u6237\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677166504 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e-\u665a\u665a\u62db\u52df\u5b98\uff08\u6768\u4e3d\uff09\u3001\u73ed\u4e3b\u4efb-\u6854\u5b50JZT\uff08\u7a0b\u5c55\u6b22\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u64ad\u6559\u80b2\u7cbe\u82f1\u8bfe\u7a0b\uff08\u5df2\u4ed8\u8d39\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u5b58\u5728\u501f\u8d37\u9690\u60a3\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u660e\u786e\u63d0\u53ca\u5de5\u4f5c\u6027\u8d28\u6216\u65f6\u95f4\u5b89\u6392\uff0c\u4ec5\u663e\u793a\u80fd\u6309\u65f6\u53c2\u4e0e\u76f4\u64ad\u548c\u5b8c\u6210\u4f5c\u4e1a\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u5b66\u4e60\u884c\u4e3a\u8bb0\u5f55\u6e05\u6670\uff0c\u4f46\u4e2a\u4eba\u80cc\u666f\u3001\u7ecf\u6d4e\u72b6\u51b5\u3001\u65f6\u95f4\u5b89\u6392\u7b49\u5173\u952e\u4fe1\u606f\u7f3a\u5931\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **[\u2b06\u9ad8]**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u6210\u957f\u4e0e\u53d8\u73b0\u800c\u6765\uff0c\u76ee\u6807\u660e\u786e\u4e14\u8def\u5f84\u6e05\u6670\uff0c\u5173\u6ce8\u884c\u4e1a\u77e5\u8bc6\u4e0e\u53d8\u73b0\u6e20\u9053\uff0c\u5b66\u4e60\u6001\u5ea6\u79ef\u6781\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u60f3\u5148\u8bd5\u8bd5\u6709\u58f0\u4e66\u7684\u5f55\u5236\uff0c\u7b49\u6211\u7684\u80fd\u529b\u66f4\u4e0a\u4e00\u5c42\u697c\u4e4b\u540e\uff0c\u5728\u7a81\u7834\u7a81\u7834\uff0c\u5c1d\u8bd5\u659c\u6760\u5c97\u4f4d\u201d\n  > \u201c\u659c\u6760\u5c97\u4f4d\u591a\u79cd\u591a\u6837\uff0c\u6709\u597d\u591a\u79cd\u53d8\u73b0\u65b9\u5f0f\u554a\uff0c\u8fd8\u6709\u5f55\u4e66\u5440\uff0c\u914d\u97f3\u554a\u3002\u4e3b\u8981\u662f\u660e\u767d\u4e86\uff0c\u6709\u58f0\u4e66\u7684\u6574\u4e2a\u6d41\u7a0b\uff0c\u548c\u559c\u64ad\u56e2\u961f\u7684\u53d1\u5c55\uff0c\u7b49\u7b49[\u5f3a][\u5f3a]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **[\u27a1\u4e2d]**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u5df2\u652f\u4ed8\u8bfe\u7a0b\u8d39\u7528\uff0c\u4f46\u672a\u900f\u9732\u8d44\u91d1\u6765\u6e90\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u5145\u88d5\u6216\u5b58\u5728\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\uff08\u5305\u62ec\u51cc\u6668\u4ea4\u4f5c\u4e1a\uff09\uff0c\u663e\u793a\u6709\u8f83\u7a33\u5b9a\u7684\u5b66\u4e60\u65f6\u95f4\uff0c\u4f46\u672a\u8bf4\u660e\u5177\u4f53\u804c\u4e1a\u6216\u65f6\u95f4\u81ea\u7531\u5ea6\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u672a\u77e5** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **[\u2b06\u9ad8]**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\uff0c\u80fd\u63a5\u53d7\u4e13\u4e1a\u6279\u8bc4\u5e76\u8f6c\u5316\u4e3a\u8fdb\u6b65\u52a8\u529b\uff0c\u65e0\u9700\u989d\u5916\u60c5\u7eea\u5b89\u629a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6709\u611f\u89c9\u4e86\uff0c\u770b\u4e86\u5b66\u59d0\u7684\u6807\u6ce8\uff0c\u611f\u89c9\u81ea\u5df1\u8fd8\u6709\u5f88\u5927\u7684\u8fdb\u6b65\u7a7a\u95f4\u7684[\u6342\u8138]\u201d\n  > \u201c\u6e05\u695a\u4e86\uff0c\u5b66\u59d0\u5206\u6790\u7684\u5f88\u5389\u5bb3\u7684\u3002[\u5f3a]\u5c31\u662f\u52a8\u4f5c\u7684\u6446\u52a8\u4e5f\u4f1a\u5f71\u54cd\u53d1\u51fa\u7684\u58f0\u97f3\uff0c\u53c8\u5b66\u5230\u4e86[\u52a0\u6cb9][\u52a0\u6cb9]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u73b0\u6709\u6536\u5165\u72b6\u51b5\u4e0d\u6ee1\uff08\u201c\u5dee\u5f3a\u4eba\u610f\uff0c\u6ca1\u6709\u5230\u8fbe\u9700\u6c42\u201d\uff09\uff0c\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u4e13\u4e1a\u6280\u80fd\u83b7\u5f97\u7ecf\u6d4e\u72ec\u7acb\u548c\u804c\u4e1a\u5c0a\u91cd\uff0c\u5e76\u5b9e\u73b0\u4e2a\u4eba\u6f5c\u80fd\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u6e05\u6670\u7684\u6210\u957f\u8def\u5f84\u6307\u5f15**\u3002\u4ed6\u9700\u8981\u88ab\u8ba4\u53ef\u4e3a\u201c\u597d\u82d7\u5b50\u201d\uff0c\u5e76\u770b\u5230\u4e00\u6761\u901a\u8fc7\u52aa\u529b\u53ef\u4ee5\u5411\u4e0a\u6500\u722c\u3001\u83b7\u5f97\u6210\u5c31\uff08\u5982\u63a5\u5355\u3001\u6210\u4e3a\u4e13\u4e1a\u4e3b\u64ad\uff09\u7684\u9636\u68af\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u9ad8\u52a8\u673a\u3001\u9ad8\u6267\u884c\u529b\u3001\u5173\u6ce8\u6280\u80fd\u7cbe\u8fdb) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u8868\u73b0\u72ec\u7acb\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u5b66\u4e60\u6001\u5ea6\u79ef\u6781\uff0c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5f3a\uff0c\u5d29\u76d8\u98ce\u9669\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u7406\u6027\u63a5\u53d7\u53cd\u9988\u5e76\u81ea\u6211\u9a71\u52a8\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u82e5\u5728\u627f\u8bfa\u7684\u201c\u53d8\u73b0\u201d\u5468\u671f\u5185\uff08\u59822-3\u4e2a\u6708\uff09\u672a\u80fd\u63a5\u5230\u7b2c\u4e00\u5355\uff0c\u6216\u63a5\u5355\u6536\u5165\u8fdc\u4f4e\u4e8e\u9884\u671f\uff0c\u53ef\u80fd\u56e0\u76ee\u6807\u672a\u8fbe\u6210\u800c\u4ea7\u751f\u843d\u5dee\u611f\uff0c\u8fdb\u800c\u8d28\u7591\u8bfe\u7a0b\u4ef7\u503c\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe\u540e **2-3\u4e2a\u6708**\uff08\u5373\u9884\u671f\u63a5\u5355\u5468\u671f\uff09\uff0c\u82e5\u6b64\u65f6\u4ecd\u672a\u83b7\u5f97\u5b9e\u8d28\u6027\u53d8\u73b0\u6210\u679c\uff0c\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u540c\u5b66\uff0c\u770b\u5230\u4f60\u5728\u4f53\u9a8c\u8425\u671f\u95f4\u7684\u5b66\u4e60\u72b6\u6001\u548c\u8fdb\u6b65\uff0c\u975e\u5e38\u624e\u5b9e\u3002\u4f60\u5c5e\u4e8e\u90a3\u79cd\u2018\u95f7\u58f0\u5e72\u5927\u4e8b\u2019\u7684\u7c7b\u578b\uff0c\u54b1\u4eec\u7cbe\u82f1\u73ed\u5c31\u662f\u4e3a\u8fd9\u6837\u7684\u5b66\u5458\u51c6\u5907\u7684\uff0c\u8bfe\u7a0b\u4f1a\u66f4\u6df1\u5165\uff0c\u6311\u6218\u4e5f\u66f4\u5927\u3002\u6211\u4f1a\u7ed9\u4f60\u5339\u914d\u66f4\u6709\u96be\u5ea6\u7684\u7ec3\u4e60\u548c\u66f4\u7cbe\u51c6\u7684\u70b9\u8bc4\uff0c\u5e2e\u4f60\u628a\u57fa\u7840\u6253\u5f97\u66f4\u7262\uff0c\u4e3a\u63a5\u5355\u505a\u597d\u5145\u5206\u51c6\u5907\u3002\u6709\u4efb\u4f55\u6280\u672f\u4e0a\u7684\u56f0\u60d1\uff0c\u968f\u65f6\u627e\u6211\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743**\u3011+\u3010**\u7cbe\u786e\u6d3e\u5355\u62e6\u622a**\u3011\u3002\u524d\u671f\u63d0\u4f9b\u624e\u5b9e\u7684\u6280\u672f\u6307\u5bfc\uff08B\u6a21\u5757\u6ee1\u914d\uff09\uff0c\u540e\u671f\u5728\u63a5\u5355\u73af\u8282\u4e25\u683c\u628a\u5173\uff0c\u786e\u4fdd\u5176\u7b2c\u4e00\u5355\u4f53\u9a8c\u6210\u529f\uff0c\u5efa\u7acb\u6b63\u5411\u53cd\u9988\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u8f7b\u677e\u8d5a\u94b1\u201d\u3001\u201c\u901f\u6210\u201d\u7b49\u8bdd\u672f\u8fdb\u884c\u9884\u671f\u7ba1\u7406\u3002\u4e25\u7981\u8fc7\u5ea6\u60c5\u611f\u5b89\u629a\uff08C\u6a21\u5757\uff09\uff0c\u8fd9\u4f1a\u88ab\u89c6\u4e3a\u4e0d\u4e13\u4e1a\u548c\u6d6a\u8d39\u65f6\u95f4\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u8fdb\u884c**\u5927\u989d\u63a8\u4ecb**\u3002\u5f53\u5176\u6280\u80fd\u8fbe\u6807\u3001\u5b8c\u6210\u7b2c\u4e00\u5355\u540e\uff0c\u53ef\u987a\u52bf\u63a8\u8350\u9ad8\u9636\u540e\u671f\u8bfe\u3001\u8bbe\u5907\u5347\u7ea7\u5efa\u8bae\u7b49\uff0c\u6ee1\u8db3\u5176\u6280\u672f\u7cbe\u8fdb\u548c\u804c\u4e1a\u53d1\u5c55\u7684\u9700\u6c42\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u60f3\u5148\u8bd5\u8bd5\u6709\u58f0\u4e66\u7684\u5f55\u5236\uff0c\u7b49\u6211\u7684\u80fd\u529b\u66f4\u4e0a\u4e00\u5c42\u697c\u4e4b\u540e\uff0c\u5728\u7a81\u7834\u7a81\u7834\uff0c\u5c1d\u8bd5\u659c\u6760\u5c97\u4f4d\u201d \u2014\u2014 **\u8bc1\u660e\u5176\u52a8\u673a\u7eaf\u5ea6\u9ad8\uff0c\u6709\u6e05\u6670\u7684\u9636\u6bb5\u6027\u76ee\u6807\uff0c\u975e\u76f2\u76ee\u6c42\u5feb\u94b1\u3002**\n2. > \u201c\u6709\u611f\u89c9\u4e86\uff0c\u770b\u4e86\u5b66\u59d0\u7684\u6807\u6ce8\uff0c\u611f\u89c9\u81ea\u5df1\u8fd8\u6709\u5f88\u5927\u7684\u8fdb\u6b65\u7a7a\u95f4\u7684[\u6342\u8138]\u201d \u2014\u2014 **\u8bc1\u660e\u5176\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u7406\u6027\u770b\u5f85\u4e0d\u8db3\uff0c\u5e76\u5c06\u6279\u8bc4\u8f6c\u5316\u4e3a\u5b66\u4e60\u52a8\u529b\u3002**\n3. > \u201c\u5dee\u5f3a\u4eba\u610f\uff0c\u6ca1\u6709\u5230\u8fbe\u9700\u6c42\u201d \u2014\u2014 **\u8bc1\u660e\u5176\u6709\u660e\u786e\u7684\u6539\u5584\u7ecf\u6d4e\u72b6\u51b5\u7684\u9a71\u52a8\u529b\uff0c\u5c5e\u4e8e\u5c0a\u91cd/\u81ea\u6211\u5b9e\u73b0\u9700\u6c42\u5c42\u7ea7\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u901a\u8fc7\u4e13\u4e1a\u7cbe\u8fdb\u83b7\u5f97\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u624e\u5b9e\u7684B\u6a21\u5757\uff08\u786c\u6838\u624b\u827a\uff09\u652f\u6301\uff0c\u5e76\u4e25\u683c\u7ba1\u7406\u5176\u53d8\u73b0\u9884\u671f\uff0c\u786e\u4fdd\u7b2c\u4e00\u5355\u7684\u6210\u529f\u4f53\u9a8c\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd/\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
