    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4ee5\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\u7684\u8eab\u4efd\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v3.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u63d0\u4f9b\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5206\u6790\uff0c\u5e76\u8f93\u51fa\u5b8c\u6574\u7684\u8bca\u65ad\u62a5\u544a\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677170323 (\u6635\u79f0\uff1a\u807d\u6771\u5357-\u53f0\u7063-\u5973\u64ad) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-26 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u4e8c\u4e00\u5148\u751f\u8033(\u5b59\u4f1f\u4f73)\u3001\u6c34\u4e2d\u89c2\u96e8(\u674e\u4e00\u6db5) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u5df2\u8d2d\u8bfe\u7a0b\uff08\u5177\u4f53\u8bfe\u7a0b\u540d\u79f0\u672a\u77e5\uff0c\u6d89\u53ca\u6f14\u64ad\u3001\u540e\u671f\u8bfe\uff09\uff0c\u88ab\u63a8\u8350\u201c\u7ebf\u4e0b\u5927\u5e08\u73ed\u201d\uff0819800\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u8bb0\u5f55\u4e2d\u4ec5\u6709\u4e00\u6b21\u201c\u5df2\u4ed8\u6b3e\u201d\u901a\u77e5\uff0c\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u8d44\u91d1\u6765\u6e90\u6216\u7ecf\u6d4e\u72b6\u51b5\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4e2d\u9ad8\u5bbd\u88d5**\u3002\u7528\u6237\u80fd\u79ef\u6781\u53c2\u4e0e\u5c0f\u7ec4\u8ba8\u8bba\u3001\u6309\u65f6\u4e0a\u8bfe\u3001\u534f\u8c03\u56e2\u961f\u65f6\u95f4\uff08\u5982\u201c\u6bcf\u5468\u516d\u65e5\u4e0b\u5348\u6ca1\u7a7a\uff0c\u665a\u4e0a\u53ef\u4ee5\u201d\uff09\uff0c\u8868\u660e\u6709\u8f83\u89c4\u5f8b\u7684\u53ef\u652f\u914d\u65f6\u95f4\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\u3001\u914d\u5076\u6216\u5bb6\u4eba\u6001\u5ea6\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u7528\u6237\u53c2\u4e0e\u5ea6\u9ad8\uff0c\u4e92\u52a8\u9891\u7e41\uff0c\u63d0\u4f9b\u4e86\u5927\u91cf\u5173\u4e8e\u5b66\u4e60\u6001\u5ea6\u3001\u793e\u4ea4\u884c\u4e3a\u3001\u76ee\u6807\u671f\u671b\u7684\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u8ffd\u6c42\u4e13\u4e1a\u7cbe\u8fdb\u4e0e\u81ea\u6211\u5b9e\u73b0\uff0c\u53d8\u73b0\u9884\u671f\u957f\u8fdc\u4e14\u7406\u6027\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n    > \u201c\u6211\u60f3\u8bf4\u73b0\u5728\u65e2\u7136\u5df2\u7ecf\u4e5f\u5f00\u59cb\u4e0a\u540e\u671f\u8bfe\u4e86\u7684\u8bdd\uff0c\u5c31\u662f\u53ef\u4ee5\u5728\u8bd5\u97f3\u7684\u8fd9\u4e2a\u5c0f\u7684\u8fd9\u4e2atask\u91cc\u9762\u505a\u7684\u597d\u4e00\u70b9\uff0c\u505a\u7684\u7cbe\u81f4\u4e00\u70b9\u3002\u5982\u679c\u662f\u8981\u8d70\u957f\u671f\u7684\u8bdd\uff0c\u5176\u5b9e\u662f\u4e0d\u7740\u6025\u4e8e\u4e00\u65f6\uff0c\u4f46\u662f\u8fd8\u662f\u8981\u7ed9\u81ea\u5df1\u6709\u4e00\u4e2a\u76ee\u6807\u561b\uff0c\u5bf9\u5427\uff1f\u201d\n    > \u201c\u6211\u7406\u89e3\u662f\u9019\u6a23\u56c9...\u800c\u662f\u7d2f\u7a4d\u81ea\u5df1\u7684\u6210\u54c1\u548c\u7d93\u9a57\uff0e\uff0e\u4e4b\u5f8c\u5c31\u4e0d\u662f\u5c0f\u767d\u767d\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b06\u9ad8\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d\u9ad8** \u2014 \u8bc1\u636e\u4e0d\u8db3\u4f46\u53ef\u63a8\u65ad\u3002\u7528\u6237\u80fd\u8fde\u7eed\u8d2d\u4e70\u8bfe\u7a0b\uff08\u6f14\u64ad\u3001\u540e\u671f\uff09\uff0c\u5e76\u5bf919800\u5143\u7684\u5927\u5e08\u73ed\u8868\u73b0\u51fa\u5174\u8da3\u5e76\u7406\u6027\u63a2\u8ba8\u201c\u6295\u8d44\u201d\u903b\u8f91\uff0c\u672a\u8868\u73b0\u51fa\u4ef7\u683c\u654f\u611f\u6216\u8d44\u91d1\u538b\u529b\u3002\u4f46\u5177\u4f53\u652f\u4ed8\u65b9\u5f0f\u672a\u77e5\uff0c\u6545\u8bc4\u7ea7\u4fdd\u5b88\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u9ad8** \u2014 \u8bc1\u636e\uff1a\u79ef\u6781\u53c2\u4e0e\u5c0f\u7ec4\u8ba8\u8bba\u3001\u5267\u672c\u5206\u6790\u3001\u56e2\u961f\u534f\u4f5c\uff0c\u80fd\u534f\u8c03\u65f6\u95f4\uff08\u201c\u5468\u65e5\u4e0a\u5348/\u4e0b\u5348\u6211\u90fd\u884c\u201d\uff09\uff0c\u5b66\u4e60\u6295\u5165\u5ea6\u9ad8\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5bb6\u5ead\u3002**\uff08\u9700\u91cd\u70b9\u6838\u67e5\uff0c\u6b64\u4e3a\u9ad8\u98ce\u9669\u4fe1\u606f\u7f3a\u53e3\uff09**\n- **\u5e95\u5ea7\u53d6\u77ed\u677f**\uff1a**\u9ad8** (\u57fa\u4e8e\u65f6\u95f4\u548c\u7cbe\u529b\u7ef4\u5ea6\u5224\u65ad\uff0c\u4f46\u8d44\u91d1\u548c\u5bb6\u5ead\u7ef4\u5ea6\u4fe1\u606f\u7f3a\u5931\uff0c\u9700\u540e\u7eed\u9a8c\u8bc1)\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\uff0c\u7406\u6027\u5206\u6790\uff0c\u4e3b\u52a8\u5bfb\u6c42\u53cd\u9988\uff0c\u60c5\u7eea\u7a33\u5b9a\u4e14\u79ef\u6781\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n    > \u201c\u6211\u60f3\u8bf7\u6559\u5b66\u957f\u76ee\u524d\u89c2\u5bdf\u6211\u7684\u72b6\u51b5\uff0c\u6709\u54ea\u4e9b\u65b9\u9762\u9700\u8981\u5f3a\u5316\uff0c\u73b0\u5728\u7684\u72b6\u6001\u79bb\u8fc7\u521d\u5ba1\u6216\u4e2d\u66f8\u8fd8\u9700\u8981\u600e\u4e48\u6ce8\u610f\uff1f\u201d\n    > \u201c\u540e\u671f\u5bf9\u6211\u6765\u8bf4\u53ef\u80fd\u6709\u4e00\u70b9\u6311\u6218\uff0c\u6240\u4ee5\u8bf4\uff0c\u4e5f\u662f\u7ee7\u7eed\u52aa\u529b\u201d\n    > \u9762\u5bf9\u8bd5\u97f3\u672a\u8fc7\uff0c\u5f52\u56e0\u4e8e\u201c\u8bd5\u7684\u91cf\u4e0d\u591f\u201d\u3001\u201c\u6587\u672c\u9009\u62e9\u201d\u7b49\u53ef\u63a7\u56e0\u7d20\uff0c\u5e76\u4e3b\u52a8\u5bfb\u6c42\u6539\u8fdb\u65b9\u6848\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0** (\u5f3a\u70c8\u4fe1\u53f7) + **\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u5f52\u5c5e** (\u6b21\u8981\u4fe1\u53f7)\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u4e13\u4e1a\u80fd\u529b\u7cbe\u8fdb\u548c\u83b7\u5f97\u884c\u4e1a\u8ba4\u53ef\u7684\u6e34\u671b\u3002\u5979\u5e76\u975e\u4e3a\u751f\u5b58\u7126\u8651\u800c\u6765\uff0c\u800c\u662f\u8ffd\u6c42\u5728\u914d\u97f3/\u6f14\u64ad\u9886\u57df\u5b9e\u73b0\u4e2a\u4eba\u4ef7\u503c\uff0c\u83b7\u5f97\u5708\u5c42\u8ba4\u540c\u548c\u804c\u4e1a\u6210\u5c31\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u6df1\u5ea6\u8ba4\u53ef\u4e0e\u6210\u957f\u8def\u5f84\u7684\u6307\u5f15**\u3002\u5979\u9700\u8981\u88ab\u770b\u89c1\u5728\u4e13\u4e1a\u4e0a\u7684\u52aa\u529b\u548c\u6f5c\u529b\uff0c\u5e76\u6e34\u671b\u83b7\u5f97\u901a\u5f80\u66f4\u9ad8\u5708\u5c42\uff08\u5982\u5927\u5e08\u73ed\uff09\u7684\u673a\u4f1a\u548c\u8d44\u6e90\u5bf9\u63a5\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\u2b50A\u7c7b (\u4ef7\u503c\u5171\u521b\u578b)** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T1 \u5708\u517b\u9886\u8896\u578b** (\u4e3b\u52a8\u62c5\u4efb\u5c0f\u961f\u957f\uff0c\u7ec4\u7ec7\u56e2\u961f\uff0c\u5236\u5b9a\u89c4\u5219\uff0c\u9f13\u52b1\u961f\u53cb\uff0c\u5177\u5907\u9886\u5bfc\u529b\u548c\u5f71\u54cd\u529b) + **T3 \u6b7b\u78d5\u5b66\u9738\u578b** (\u5173\u6ce8\u6280\u672f\u7ec6\u8282\u3001\u5267\u672c\u903b\u8f91\u3001\u540e\u671f\u6311\u6218\uff0c\u4e3b\u52a8\u5bfb\u6c42\u4e13\u4e1a\u53cd\u9988) |\n| **\u4e3b\u5bfc\u9700\u6c42\u5c42\u6b21** | **\u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0** (\u8ffd\u6c42\u4e13\u4e1a\u7cbe\u8fdb\u3001\u5708\u5c42\u8dc3\u8fc1\u3001\u5b9e\u73b0\u6f5c\u80fd) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u751f\u5b58\u5371\u673a\u3001\u5bb6\u5ead\u53cd\u5bf9\u7b49\u8868\u8ff0\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4f4e** | \u76ee\u524d\u65e0\u4fe1\u53f7\u3002\u4f46**\u5bb6\u5ead\u652f\u6301\u5ea6\u4fe1\u606f\u7f3a\u5931**\uff0c\u662f\u6f5c\u5728\u98ce\u9669\u70b9\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u6781\u4f4e** | \u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5f3a\uff0c\u5b66\u4e60\u6295\u5165\u5ea6\u9ad8\uff0c\u4e3b\u52a8\u6027\u5f3a\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u632b\u5f52\u56e0\u7406\u6027\uff0c\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4f4e** | \u52a8\u673a\u7eaf\u5ea6\u9ad8\uff0c\u8ffd\u6c42\u957f\u671f\u6210\u957f\uff0c\u5bf9\u77ed\u671f\u53d8\u73b0\u65e0\u6025\u5207\u8981\u6c42\u3002\u4f46\u82e5\u957f\u671f\uff08\u5982\u534a\u5e74\u4ee5\u4e0a\uff09\u65e0\u4efb\u4f55\u6b63\u5411\u53cd\u9988\uff08\u5982\u8bd5\u97f3\u901a\u8fc7\uff09\uff0c\u53ef\u80fd\u4ea7\u751f\u632b\u8d25\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u6781\u4f4e\u98ce\u9669**\u3002\u82e5\u5b58\u5728\u98ce\u9669\uff0c\u53ef\u80fd\u5728**\u5f00\u8bfe3-6\u4e2a\u6708\u540e**\uff0c\u56e0\u957f\u671f\u65e0\u5b9e\u8d28\u6027\u8fdb\u5c55\uff08\u5982\u7b7e\u7ea6\u3001\u4e2d\u66f8\uff09\u800c\u4ea7\u751f\u4ef7\u503c\u6000\u7591\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u807d\u6771\u5357\uff0c\u770b\u5230\u4f60\u5728\u5c0f\u7ec4\u91cc\u8fd9\u4e48\u6709\u9886\u5bfc\u529b\uff0c\u5bf9\u4f5c\u54c1\u53c8\u8fd9\u4e48\u6709\u8ffd\u6c42\uff0c\u771f\u662f\u6211\u4eec\u73ed\u7684\u5b9d\u85cf\u5b66\u5458\u3002\u4f60\u7684\u76ee\u6807\u5f88\u6e05\u6670\uff0c\u4e0d\u662f\u56fe\u5feb\u94b1\uff0c\u800c\u662f\u60f3\u771f\u6b63\u5728\u8fd9\u4e2a\u9886\u57df\u624e\u6839\u3002\u63a5\u4e0b\u6765\uff0c\u6211\u4f1a\u91cd\u70b9\u5e2e\u4f60\u5bf9\u63a5\u66f4\u7cbe\u51c6\u7684\u8bd5\u97f3\u8d44\u6e90\u548c\u884c\u4e1a\u53cd\u9988\uff0c\u54b1\u4eec\u4e00\u8d77\u628a\u4f60\u7684\u4e13\u4e1a\u4f18\u52bf\u6253\u78e8\u6210\u771f\u6b63\u7684\u7ade\u4e89\u529b\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** + **\u3010\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\u3011**\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T1\u7279\u8d28\u8865\u5145**\u3010\u9879\u76ee\u5236\u5b9e\u6218\u9886\u5bfc\u529b\u5305\u3011**\uff0c\u9488\u5bf9T3\u7279\u8d28\u8865\u5145**\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011**\u3002\u53ef\u8c28\u614e\u8bd5\u63a2\u5176\u5bf9 **\u3010\u9ad8\u7aef\u8d44\u6e90\u5bf9\u63a5\u7ebf\u3011** (\u5982\u5927\u5e08\u73ed) \u7684\u5174\u8da3\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u5b9d\u5988\u7126\u8651\u201d\u3001\u201c\u5feb\u901f\u53d8\u73b0\u201d\u7b49\u4e0b\u6c89\u8bdd\u672f\u8fdb\u884c\u6c9f\u901a\uff1b\u5ffd\u89c6\u5979\u5728\u4e13\u4e1a\u4e0a\u7684\u6df1\u5ea6\u601d\u8003\uff1b\u628a\u5979\u5f53\u4f5c\u666e\u901a\u5b66\u5458\u8fdb\u884c\u6a21\u677f\u5316\u670d\u52a1\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u8fdb\u884c**\u5927\u989d\u63a8\u4ecb**\uff08\u5982\u5927\u5e08\u73ed\uff09\uff0c\u4f46\u5fc5\u987b\u57fa\u4e8e\u5176**\u81ea\u6211\u5b9e\u73b0**\u548c**\u5708\u5c42\u8dc3\u8fc1**\u9700\u6c42\uff0c\u6e05\u6670\u9610\u8ff0\u957f\u671f\u4ef7\u503c\u4e0e\u8d44\u6e90\u94fe\u63a5\uff0c**\u4e25\u7981\u5938\u5927\u77ed\u671f\u6536\u76ca\u627f\u8bfa**\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u60f3\u8bf7\u6559\u5b66\u957f\u76ee\u524d\u89c2\u5bdf\u6211\u7684\u72b6\u51b5\uff0c\u6709\u54ea\u4e9b\u65b9\u9762\u9700\u8981\u5f3a\u5316\uff0c\u73b0\u5728\u7684\u72b6\u6001\u79bb\u8fc7\u521d\u5ba1\u6216\u4e2d\u66f8\u8fd8\u9700\u8981\u600e\u4e48\u6ce8\u610f\uff1f\u201d **\u2014\u2014 \u4e3b\u52a8\u5bfb\u6c42\u4e13\u4e1a\u53cd\u9988\uff0c\u76ee\u6807\u5bfc\u5411**\n2. > \u201c\u65e2\u7136\u52a0\u5165\u4e86\u54b1\u4eec\u5c0f\u7ec4\u80af\u5b9a\u90fd\u662f\u60f3\u8981\u8bc1\u660e\u81ea\u5df1\u60f3\u8981\u83b7\u5956\u7684\uff0c\u56e0\u4e3a\u54b1\u4eec\u7ec4\u662f\u5954\u7740\u4f18\u80dc\u53bb\u7684\u201d **\u2014\u2014 \u9886\u5bfc\u529b\u3001\u56e2\u961f\u8363\u8a89\u611f\u3001\u8bc1\u660e\u81ea\u6211\u7684\u6e34\u671b**\n3. > \u201c\u5982\u679c\u662f\u8981\u8d70\u957f\u671f\u7684\u8bdd\uff0c\u5176\u5b9e\u662f\u4e0d\u7740\u6025\u4e8e\u4e00\u65f6\uff0c\u4f46\u662f\u8fd8\u662f\u8981\u7ed9\u81ea\u5df1\u6709\u4e00\u4e2a\u76ee\u6807\u561b\u201d **\u2014\u2014 \u957f\u671f\u4e3b\u4e49\uff0c\u4e3a\u80fd\u529b\u800c\u975e\u77ed\u671f\u53d8\u73b0**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T1\u5708\u517b\u9886\u8896+T3\u6b7b\u78d5\u5b66\u9738\u590d\u5408\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u81ea\u6211\u5b9e\u73b0\u4e0e\u5708\u5c42\u8ba4\u53ef\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6df1\u5ea6\u7684\u4e13\u4e1a\u6210\u957f\u652f\u6301\u548c\u9ad8\u7aef\u8d44\u6e90\u5bf9\u63a5\u673a\u4f1a\uff0c\u6ee1\u8db3\u5176\u9886\u8896\u6b32\u4e0e\u6c42\u77e5\u6b32\u3011**\u3002\n\n```json\n{\"core_type\": \"T1 \u5708\u517b\u9886\u8896\u578b + T3 \u6b7b\u78d5\u5b66\u9738\u578b\", \"maslow_need\": \"\u7b2c\u4e94\u5c42\u81ea\u6211\u5b9e\u73b0\", \"risk_level\": \"\u6781\u4f4e\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u5708\u5c42\u5408\u4f19\u4eba\u7ebf\"}\n```";
