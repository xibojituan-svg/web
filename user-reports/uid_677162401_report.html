    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n> **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4e2d\u7f3a\u4e4f\u5173\u4e8e\u652f\u4ed8\u65b9\u5f0f\u3001\u5bb6\u5ead\u652f\u6301\u5ea6\u3001\u5177\u4f53\u5de5\u4f5c\u4e0e\u751f\u6d3b\u65f6\u95f4\u5b89\u6392\u7684\u6df1\u5ea6\u4fe1\u606f\uff0c\u65e0\u6cd5\u7cbe\u786e\u8bc4\u4f30\u5176\u8d44\u6e90\u5e95\u5ea7\uff08\u5c24\u5176\u662f\u8d44\u91d1\u627f\u8f7d\u529b\uff09\u548c\u5bb6\u5ead\u51b3\u7b56\u6743\u3002\u7528\u6237\u52a8\u673a\u548c\u6297\u538b\u6027\u5224\u65ad\u4e3b\u8981\u57fa\u4e8e\u6709\u9650\u7684\u884c\u4e3a\u548c\u8bed\u8a00\u53cd\u5e94\u3002\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u4e07\u4e8bOK (UID: 677162401) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5f20\u4e3d\u7231 (\u9752\u6728) -> \u5f20\u6587\u9759 (\u9065\u8fdc) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u7cbe\u88c5\u7cfb\u7edf\u8bfe\u7a0b (\u4ef7\u683c\u672a\u77e5) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | [\u4fe1\u606f\u7f3a\u5931] |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | [\u4fe1\u606f\u7f3a\u5931] (\u81ea\u79f0\u201c\u665a\u4e0a\u65f6\u95f4\u6bd4\u8f83\u591a\u201d\uff0c\u4f46\u5177\u4f53\u65f6\u957f\u4e0e\u7a33\u5b9a\u6027\u672a\u77e5) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | [\u4fe1\u606f\u7f3a\u5931] |\n| **\u4fe1\u606f\u539a\u5ea6** | [\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09] |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a[\u6df7\u6742\u8bd5\u6c34] \u7528\u6237\u5bf9\u201c\u53d8\u73b0\u201d\u3001\u201c\u63a5\u5355\u201d\u8868\u73b0\u51fa\u5174\u8da3\uff0c\u4f46\u66f4\u5173\u6ce8\u5b66\u4e60\u8fc7\u7a0b\u7684\u201c\u7b80\u5355\u201d\u4e0e\u201c\u771f\u5b9e\u6027\u201d\uff0c\u5bf9\u201c\u8003\u8bc1\u201d\u7b49\u989d\u5916\u6295\u5165\u6709\u7591\u8651\uff0c\u52a8\u673a\u4ecb\u4e8e\u5174\u8da3\u63a2\u7d22\u4e0e\u8d5a\u94b1\u4e4b\u95f4\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u4e0d\u77e5\u9053\u662f\u4e0d\u662f\u771f\u5b9e\u6027\u7684\u5440\u201d > \u201c\u6628\u5929\u8bfe\u4e0a\u8bf4\uff0c\u6211\u4eec\u8981\u81ea\u5df1\u82b13000\u591a\u5757\u94b1\u8003\u4ec0\u4e48\u8bc1\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 \u652f\u4ed8\u8fc7\u7a0b\u987a\u5229\uff0c\u4f46\u672a\u900f\u9732\u652f\u4ed8\u65b9\u5f0f\u4e0e\u8d44\u91d1\u6765\u6e90\u3002\u56fd\u5bb6\u7535\u7f51\u5de5\u4f5c\u80cc\u666f\u6697\u793a\u7a33\u5b9a\u6027\uff0c\u4f46\u5177\u4f53\u627f\u8f7d\u529b\u672a\u77e5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 \u80fd\u5b8c\u6210\u6240\u6709\u76f4\u64ad\u3001\u4f5c\u4e1a\u548c\u8bd5\u97f3\u4efb\u52a1\uff0c\u5e76\u53c2\u4e0ePIA\u620f\u6d3b\u52a8\uff0c\u663e\u793a\u6709\u89c4\u5f8b\u4e1a\u4f59\u65f6\u95f4\u3002\u4f46\u672a\u900f\u9732\u5177\u4f53\u804c\u4e1a\u538b\u529b\u4e0e\u5bb6\u5ead\u65f6\u95f4\u5206\u914d\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 \u5b8c\u5168\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b07\u4f4e\u6781\u5371]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a[\u9700\u95f4\u6b47\u6027\u5b89\u629a] \u5bf9\u7cfb\u7edf\u5224\u5b9a\u3001\u89c4\u5219\u7ec6\u8282\uff08\u5982\u76f4\u64ad\u5b8c\u64ad\u8bb0\u5f55\uff09\u8868\u73b0\u51fa**\u660e\u663e\u7684\u56f0\u60d1\u3001\u8d28\u7591\u548c\u8f7b\u5fae\u5bf9\u6297**\uff0c\u9700\u8981\u9500\u552e\u53cd\u590d\u89e3\u91ca\u5b89\u629a\u3002\u5bf9\u201c\u4e0d\u77e5\u9053\u4f1a\u8fd9\u6837\u505a\u201d\u7684\u4f5c\u4e1a\u53cd\u9988\u6709\u8f7b\u5fae\u63a8\u8bff\u503e\u5411\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5947\u602a\uff0c\u6211\u7b49\u8001\u5e08\u4e0b\u64ad\u4e86\uff0c\u6211\u624d\u51fa\u6765\u7684\uff0c\u4e00\u51fa\u6765\u5c31\u7ed9\u4f60\u53d1\u7684\u53e3\u4ee4\u201d > \u201c\u6211\u4e0d\u77e5\u9053\u4f60\u4eec\u4f1a\u8fd9\u6837\u505a\u51fa\u6765\uff0c\u4e0d\u7136\u6211\u80af\u5b9a\u4f1a\u505a\u5f97\u66f4\u597d\uff0c\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u4e0d\u786e\u5b9a\u6027\u548c\u89c4\u5219\u6a21\u7cca\u7684**\u4f4e\u5bb9\u5fcd\u5ea6**\uff0c\u9700\u8981\u660e\u786e\u7684\u8def\u5f84\u3001\u6e05\u6670\u7684\u89c4\u5219\u548c\u201c\u5b98\u65b9\u201d\u80cc\u4e66\u6765\u83b7\u5f97\u5b89\u5168\u611f\u3002\u5176\u8d28\u7591\u201c\u771f\u5b9e\u6027\u201d\u548c\u7ea0\u7ed3\u4e8e\u201c\u76f4\u64ad\u662f\u5426\u770b\u5b8c\u201d\u7684\u7ec6\u8282\uff0c\u90fd\u6e90\u4e8e\u5bf9\u6295\u5165\uff08\u65f6\u95f4\u3001\u91d1\u94b1\uff09\u80fd\u5426\u83b7\u5f97\u786e\u5b9a\u56de\u62a5\u7684**\u6df1\u5ea6\u7126\u8651**\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u4e0e\u638c\u63a7\u611f**\u3002\u63d0\u4f9b\u6e05\u6670\u3001\u65e0\u6b67\u4e49\u7684\u5b66\u4e60\u8def\u5f84\u3001\u63a5\u5355\u89c4\u5219\u548c\u6210\u529f\u6848\u4f8b\uff0c\u626e\u6f14\u4e00\u4e2a\u6743\u5a01\u3001\u53ef\u9760\u4e14\u8010\u5fc3\u7684\u201c\u5b98\u65b9\u6307\u5357\u201d\u89d2\u8272\uff0c\u6d88\u9664\u5176\u6bcf\u4e00\u6b65\u7684\u7591\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | [\ud83d\udfeaC1] \u7c7b (\u52a8\u673a\u4e2d\u7b49\uff0c\u8d44\u6e90\u4fe1\u606f\u7f3a\u5931\u4f46\u770b\u4f3c\u7a33\u5b9a\uff0c\u5fc3\u7406\u5f39\u6027\u4f4e\uff0c\u9700\u91cd\u70b9\u7ef4\u62a4) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | [T6 \u60c5\u7eea\u5de8\u5a74] (\u6838\u5fc3\u7279\u5f81\uff1a\u5bf9\u89c4\u5219\u654f\u611f\uff0c\u6613\u56e0\u6d41\u7a0b\u4e0d\u7545\u3001\u53cd\u9988\u4e0d\u7b26\u9884\u671f\u800c\u4ea7\u751f\u60c5\u7eea\u6ce2\u52a8\uff0c\u9700\u8981\u6301\u7eed\u3001\u8010\u5fc3\u7684\u5b89\u629a\u548c\u660e\u786e\u7684\u6307\u5f15) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a[\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5ead\u51b2\u7a81\u8bc1\u636e]\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | [\u4f4e] | \u4fe1\u606f\u7f3a\u5931\uff0c\u6682\u65e0\u6cd5\u5224\u65ad\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | [\u4e2d] | \u82e5\u540e\u7eed\u8bfe\u7a0b\u65f6\u95f4\u4e0e\u201c\u665a\u4e0a\u65f6\u95f4\u591a\u201d\u51b2\u7a81\uff0c\u6216\u4f5c\u4e1a\u96be\u5ea6\u9661\u589e\uff0c\u53ef\u80fd\u56e0\u65e0\u6cd5\u534f\u8c03\u800c\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **[\u9ad8]** | **\u8fd9\u662f\u6700\u9ad8\u98ce\u9669\uff01** \u6781\u6613\u56e0\u8f6f\u4ef6\u64cd\u4f5c\u95ee\u9898\u3001\u4f5c\u4e1a\u53cd\u9988\u4e0d\u7b26\u9884\u671f\u3001\u63a5\u5355\u6d41\u7a0b\u590d\u6742\u6216\u73ed\u4e3b\u4efb\u56de\u590d\u4e0d\u53ca\u65f6\u7b49\u201c\u5c0f\u632b\u6298\u201d\u800c\u5fc3\u6001\u5d29\u6e83\uff0c\u4ea7\u751f\u201c\u88ab\u9a97\u201d\u3001\u201c\u6ca1\u7528\u201d\u7684\u8d1f\u9762\u60c5\u7eea\uff0c\u8fdb\u800c\u8981\u6c42\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | [\u4e2d] | \u82e5\u5b66\u4e60\u4e00\u6bb5\u65f6\u95f4\u540e\u672a\u83b7\u5f97\u9884\u671f\u7684\u201c\u7b80\u5355\u201d\u63a5\u5355\u673a\u4f1a\u6216\u6536\u76ca\uff0c\u4f1a\u4ea7\u751f\u5f3a\u70c8\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a[\u5f00\u8bfe\u540e\u7b2c\u4e00\u5468\u81f3\u7b2c\u4e00\u6b21\u590d\u6742\u4f5c\u4e1a/\u8f6f\u4ef6\u64cd\u4f5c\u6559\u5b66\u65f6]\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4e07\u4e8bOK\u540c\u5b66\u4f60\u597d\uff01\u6211\u662f\u4f60\u7684\u73ed\u4e3b\u4efb\u9065\u8fdc\u3002\u770b\u5230\u4f60\u5728\u4f53\u9a8c\u8425\u91cc\u6bcf\u4e00\u6b65\u90fd\u5b8c\u6210\u5f97\u5f88\u8ba4\u771f\uff0c\u7279\u522b\u662f\u5bf9\u7ec6\u8282\u5f88\u5173\u6ce8\uff0c\u8fd9\u70b9\u975e\u5e38\u68d2\uff01\u54b1\u4eec\u7684\u7cfb\u7edf\u8bfe\u6211\u4f1a\u628a\u6bcf\u4e00\u6b65\u7684\u89c4\u5219\u3001\u65f6\u95f4\u8282\u70b9\u548c\u4f60\u80fd\u62ff\u5230\u4ec0\u4e48\u90fd\u8bb2\u5f97\u6e05\u6e05\u695a\u695a\uff0c\u4f60\u53ea\u7ba1\u8ddf\u7740\u8d70\uff0c\u6709\u4efb\u4f55\u4e0d\u6e05\u695a\u7684\u968f\u65f6\u95ee\u6211\uff0c\u6211\u4fdd\u8bc1\u7ed9\u4f60\u6700\u660e\u786e\u7684\u7b54\u590d\u3002\u54b1\u4eec\u7684\u76ee\u6807\u5c31\u662f\u8ba9\u4f60\u5b66\u5f97\u660e\u767d\uff0c\u7ec3\u5f97\u8e0f\u5b9e\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a[\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011] \u4f18\u5148\u5c55\u793a\u6e05\u6670\u3001\u53ef\u91cf\u5316\u7684\u63a5\u5355\u8def\u5f84\u548c\u5165\u95e8\u7ea7\u5355\u6e90\uff0c\u6ee1\u8db3\u5176\u5bf9\u201c\u771f\u5b9e\u6027\u201d\u548c\u201c\u53d8\u73b0\u201d\u7684\u7126\u8651\u9700\u6c42\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a[**\u5fc5\u987b\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**] \u5305\u542b\uff1a1\uff09**\u8d85\u8be6\u7ec6SOP\u56fe\u6587/\u89c6\u9891\u6307\u5f15**\uff08\u9488\u5bf9\u6240\u6709\u8f6f\u4ef6\u3001\u4f5c\u4e1a\u3001\u63a5\u5355\u6d41\u7a0b\uff09\uff1b2\uff09**\u5b9a\u671f1v1\u8fdb\u5ea6\u786e\u8ba4\u4e0e\u9f13\u52b1**\uff1b3\uff09**\u201c\u907f\u5751\u6307\u5357\u201d** \u63d0\u524d\u9884\u544a\u5e38\u89c1\u5b66\u4e60\u96be\u70b9\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a[**\u7edd\u4e0d\u5bf9T6\u4f7f\u7528\u6a21\u7cca\u8bdd\u672f\u6216\u8ba9\u5176\u81ea\u884c\u6478\u7d22**\uff1b**\u7edd\u4e0d\u5728\u5176\u63d0\u51fa\u7591\u95ee\u65f6\u5ef6\u8fdf\u56de\u590d\u6216\u7b80\u5355\u6577\u884d**\uff1b**\u907f\u514d\u5728\u516c\u5f00\u573a\u5408\u6279\u8bc4\u5176\u4f5c\u4e1a\uff0c\u4ee5\u79c1\u804a\u9f13\u52b1\u5f0f\u53cd\u9988\u4e3a\u4e3b**]\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a[**\u4e25\u7981\u5728\u521d\u671f\u8fdb\u884c\u4efb\u4f55\u5347\u5355**] \u9700\u5f85\u5176\u5b8c\u5168\u9002\u5e94\u5b66\u4e60\u8282\u594f\u3001\u83b7\u5f97\u521d\u6b65\u6b63\u53cd\u9988\uff08\u5982\u5b8c\u6210\u7b2c\u4e00\u4e2a\u7b80\u5355\u4efb\u52a1\uff09\u540e\uff0c\u518d\u8003\u8651\u5fae\u5347\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u4e0d\u77e5\u9053\u662f\u4e0d\u662f\u771f\u5b9e\u6027\u7684\u5440\u201d **(\u66b4\u9732\u6838\u5fc3\u7126\u8651\uff1a\u5bf9\u786e\u5b9a\u6027\u7684\u6e34\u6c42)**\n2. > \u201c\u5947\u602a\uff0c\u6211\u7b49\u8001\u5e08\u4e0b\u64ad\u4e86\uff0c\u6211\u624d\u51fa\u6765\u7684\uff0c\u4e00\u51fa\u6765\u5c31\u7ed9\u4f60\u53d1\u7684\u53e3\u4ee4\u201d **(\u66b4\u9732\u5bf9\u89c4\u5219\u548c\u7cfb\u7edf\u5224\u5b9a\u7684\u4f4e\u5bb9\u5fcd\u4e0e\u8d28\u7591)**\n3. > \u201c\u6211\u4e0d\u77e5\u9053\u4f60\u4eec\u4f1a\u8fd9\u6837\u505a\u51fa\u6765\uff0c\u4e0d\u7136\u6211\u80af\u5b9a\u4f1a\u505a\u5f97\u66f4\u597d\uff0c\u201d **(\u66b4\u9732\u9762\u5bf9\u5c0f\u632b\u6298\u65f6\u7684\u63a8\u8bff\u4e0e\u81ea\u6211\u8fa9\u62a4\u503e\u5411)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **[T6\u60c5\u7eea\u5de8\u5a74\u578b]**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **[\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\uff08\u7126\u8651\u4fdd\u969c\uff09]**\u3002\u9000\u5355\u51e0\u7387\u4e3a **[\u9ad8]**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **[\u63d0\u4f9b\u6781\u81f4\u6e05\u6670\u7684SOP\u3001\u53ca\u65f6\u54cd\u5e94\u6bcf\u4e00\u6b21\u7591\u95ee\u3001\u7528\u201c\u5b98\u65b9\u201d\u80cc\u4e66\u7ed9\u4e88\u5b89\u5168\u611f]**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf+\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\"}\n```";
