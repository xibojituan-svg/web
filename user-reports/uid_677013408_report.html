        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677013408 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-10 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u8fea\u8fea1(\u5f20\u4e00\u837b) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6500\u767b\u8ba1\u5212\u7cbe\u82f1\u7248 (2\u4e2a\u6708\uff0c\u603b\u4ef73980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u8d44\u91d1\u5f88\u7d27\u5f20\u201d\uff0c\u4ec5\u67092000\u591a\u70b9\u5b58\u6b3e\uff0c\u62a5\u540d\u524d\u9700\u201c\u5b58\u94b1\u53bb\u5566\u201d\u3001\u201c\u5728\u8981\u94b1\u201d\uff0c\u901a\u8fc7\u6253\u6e38\u620f\u5355\u5b50\uff08\u4ee3\u7ec3\uff09\u7b49\u65b9\u5f0f\u51d1\u94b1\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u9ad8\u5bbd\u88d5**\u3002\u7528\u6237\u65e0\u56fa\u5b9a\u5de5\u4f5c\uff08\u201c\u6ca1\u5728\u4e0a\u73ed\u201d\uff09\uff0c\u65f6\u95f4\u81ea\u7531\uff0c\u53ef\u968f\u65f6\u6253\u6e38\u620f\u5355\u5b50\u548c\u5b66\u4e60\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5bb6\u4eba\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b07\u4f4e\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u7eaf\u4e3a\u51e0\u5929\u5185\u63d0\u73b0\u4fdd\u5e95\u800c\u6765(\u4f4e\u6781\u5371)**\u3002\u7528\u6237\u6838\u5fc3\u52a8\u673a\u662f\u5feb\u901f\u8d5a\u94b1\u4ee5\u89e3\u51b3\u5f53\u524d\u7ecf\u6d4e\u56f0\u5883\uff0c\u5bf9\u884c\u4e1a\u8ba4\u77e5\u6d45\uff08\u201c\u6211\u770b\u8fd9\u4e2a\u6709\u58f0\u884c\u4e1a\u90fd\u8bf4\u505c\u9971\u6ee1\u7684\u201d\uff09\uff0c\u5b66\u4e60\u662f\u624b\u6bb5\u800c\u975e\u76ee\u7684\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u53ef\u4ee5\u6323\u591f\u94b1\u5728\u5b66\u4e48\u201d > \u201c\u94b1\u4e0d\u591f\u201d > \u201c\u8d44\u91d1\u5f88\u7d27\u5f20\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u6781\u4f4e** \u2014 \u4ec5\u67092000\u4f59\u5143\u5b58\u6b3e\uff0c\u62a5\u540d3980\u5143\u8bfe\u7a0b\u9700\u989d\u5916\u7b79\u63aa\uff0c\u5c5e\u4e8e**\u501f\u8d37/\u501f\u6b3e\u62a5\u540d**\u8303\u7574\uff0c\u89e6\u53caD\u7c7b\u7ea2\u7ebf\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u9ad8** \u2014 \u65e0\u4e1a\u72b6\u6001\uff0c\u65f6\u95f4\u5145\u88d5\uff0c\u80fd\u6295\u5165\u5b66\u4e60\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u672a\u63d0\u53ca\uff0c\u4f46\u57fa\u4e8e\u5176\u7ecf\u6d4e\u72b6\u51b5\u548c\u201c\u5728\u8981\u94b1\u201d\u7684\u8868\u8ff0\uff0c\u5bb6\u5ead\u652f\u6301\u5ea6\u5b58\u7591\uff0c\u53ef\u80fd\u4e3a\u77ed\u677f\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u27a1\u4e2d\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a(\u4e2d)**\u3002\u7528\u6237\u5728\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u8868\u73b0\u914d\u5408\uff08\u201c\u55ef\u5462\u201d\u3001\u201c\u6536\u5230\u201d\uff09\uff0c\u80fd\u5b8c\u6210\u4f5c\u4e1a\u5e76\u83b7\u5f97\u6b63\u9762\u53cd\u9988\u3002\u4f46\u5728\u51b3\u7b56\u65f6\u8868\u73b0\u51fa\u72b9\u8c6b\u548c\u5bfb\u6c42\u5916\u90e8\u80af\u5b9a\uff08\u201c\u5e08\u59d0 \u4f60\u770b\u6211\u6709\u5e0c\u671b\u5417 \u52aa\u52aa\u529b\u7684\u8bdd\u201d\uff09\uff0c\u6709\u4e00\u5b9a\u4f9d\u8d56\u6027\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5e08\u59d0 \u4f60\u770b\u6211\u6709\u5e0c\u671b\u5417 \u52aa\u52aa\u529b\u7684\u8bdd\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u7ecf\u6d4e\u4e0a\u7684\u4e0d\u5b89\u5168\u611f\u4e0e\u751f\u5b58\u7126\u8651**\u3002\u7528\u6237\u5904\u4e8e\u65e0\u4e1a\u72b6\u6001\uff0c\u901a\u8fc7\u4e0d\u7a33\u5b9a\u7684\u6e38\u620f\u4ee3\u7ec3\u7ef4\u6301\u751f\u8ba1\uff0c\u5b58\u6b3e\u6781\u5c11\uff0c\u62a5\u540d\u5b66\u8d39\u6784\u6210\u5de8\u5927\u538b\u529b\u3002\u5176\u6838\u5fc3\u9700\u6c42\u662f\u901a\u8fc7\u4e00\u4e2a\u201c\u5feb\u901f\u3001\u786e\u5b9a\u201d\u7684\u53d8\u73b0\u9014\u5f84\uff0c\u83b7\u5f97\u7ecf\u6d4e\u4e0a\u7684\u5b89\u5168\u611f\u548c\u4fdd\u969c\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u77ed\u671f\u5185\u7684\u5e0c\u671b\u611f\u4e0e\u786e\u5b9a\u6027**\u3002\u4ed6\u9700\u8981\u88ab\u53cd\u590d\u544a\u77e5\u201c\u4f60\u6709\u5e0c\u671b\u201d\u3001\u201c\u7537\u64ad\u7a00\u7f3a\u201d\u3001\u201c\u80fd\u8d5a\u94b1\u201d\uff0c\u4ee5\u5bf9\u6297\u56e0\u8d44\u91d1\u6295\u5165\u800c\u4ea7\u751f\u7684\u5de8\u5927\u7126\u8651\u548c\u98ce\u9669\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udd34D\u7c7b** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u578b** (\u4f46\u56e0\u89e6\u53caD\u7c7b\u7ea2\u7ebf\uff0c\u9700\u6309D\u7c7b\u5904\u7406) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\ud83d\udd34**\u5df2\u89e6\u53d1 D \u7c7b\u7194\u65ad\u7ea2\u7ebf\uff01**\n- **\u89e6\u53d1\u56e0\u7531**\uff1a**\u501f\u8d37/\u501f\u6b3e\u62a5\u540d**\u3002\u7528\u6237\u8d44\u91d1\u6781\u5ea6\u7d27\u5f20\uff0c\u62a5\u540d\u8d39\u8fdc\u8d85\u5176\u73b0\u6709\u652f\u4ed8\u80fd\u529b\uff0c\u5c5e\u4e8e\u201c\u5f71\u54cd\u5976\u7c89\u94b1\u201d\u7ea7\u522b\u7684\u8d22\u52a1\u98ce\u9669\u3002**\u5bb6\u5ead\u652f\u6301\u5ea6\u672a\u77e5**\uff0c\u82e5\u4e3a\u9690\u7792\u5bb6\u4eba\u6216\u906d\u53cd\u5bf9\uff0c\u9000\u8d39\u98ce\u9669\u5c06\u6025\u5267\u653e\u5927\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u9ad8** | \u82e5\u5b66\u8d39\u6765\u6e90\u4e3a\u5411\u5bb6\u4eba\u7d22\u8981\u6216\u501f\u6b3e\uff0c\u4e00\u65e6\u5bb6\u4eba\u53cd\u5bf9\u6216\u7ecf\u6d4e\u538b\u529b\u4f20\u5bfc\uff0c\u6781\u6613\u5f15\u53d1\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u65f6\u95f4\u5145\u88d5\uff0c\u5b66\u4e60\u8ddf\u8fdb\u538b\u529b\u5c0f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4e2d | \u5bf9\u201c\u6709\u5e0c\u671b\u5417\u201d\u7684\u53cd\u590d\u786e\u8ba4\uff0c\u663e\u793a\u5176\u4fe1\u5fc3\u4e0d\u8db3\u3002\u4e00\u65e6\u521d\u671f\u63a5\u5355\u4e0d\u987a\u6216\u5b66\u4e60\u9047\u632b\uff0c\u6613\u4ea7\u751f\u201c\u88ab\u9a97\u201d\u611f\u800c\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u7528\u6237\u4e3a\u201c\u641e\u94b1\u201d\u800c\u6765\uff0c\u4e14\u8d44\u91d1\u538b\u529b\u5de8\u5927\uff0c\u5bf9\u77ed\u671f\u53d8\u73b0\u62b1\u6709\u6781\u9ad8\u3001\u751a\u81f3\u4e0d\u5207\u5b9e\u9645\u7684\u671f\u671b\u3002\u5f00\u8bfe\u540e\u82e5\u65e0\u6cd5\u8fc5\u901f\u83b7\u5f97\u6536\u76ca\uff08\u5982\u7b2c\u4e00\u3001\u4e8c\u5468\uff09\uff0c\u5c06\u56e0\u5de8\u5927\u7684\u671f\u671b\u843d\u5dee\u548c\u8fd8\u6b3e\u538b\u529b\u800c\u5f3a\u70c8\u8981\u6c42\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468\uff08\u6b7b\u4ea1\u8c37\u521d\u671f\uff09**\u3002\u5f53\u7528\u6237\u53d1\u73b0\u5b66\u4e60\u6709\u96be\u5ea6\u3001\u63a5\u5355\u5e76\u975e\u6613\u4e8b\u3001\u4e14\u8d26\u6237\u4f59\u989d\u56e0\u8fd8\u6b3e\u800c\u544a\u6025\u65f6\uff0c\u9000\u8d39\u8bc9\u6c42\u4f1a\u96c6\u4e2d\u7206\u53d1\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> **\u201c\u5144\u5f1f\uff0c\u6211\u770b\u4e86\u4f60\u7684\u60c5\u51b5\uff0c\u77e5\u9053\u4f60\u73b0\u5728\u538b\u529b\u5927\uff0c\u60f3\u8d76\u7d27\u9760\u58f0\u97f3\u6323\u70b9\u94b1\u3002\u54b1\u4e0d\u6574\u865a\u7684\uff0c\u63a5\u4e0b\u6765\u6211\u5e26\u4f60\uff0c\u76ee\u6807\u5c31\u4e00\u4e2a\uff1a\u7528\u6700\u5feb\u901f\u5ea6\u8ba9\u4f60\u80fd\u63a5\u4e0a\u5355\uff0c\u54ea\u6015\u662f\u5c0f\u5355\u5b50\u5148\u8dd1\u8d77\u6765\u3002\u8fc7\u7a0b\u4e2d\u6709\u4efb\u4f55\u5361\u58f3\uff0c\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4e00\u8d77\u89e3\u51b3\u3002\u4f60\u58f0\u97f3\u6761\u4ef6\u4e0d\u9519\uff0c\u6709\u620f\uff0c\u4f46\u5f97\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u6025\u4e0d\u5f97\u4e5f\u4e71\u4e0d\u5f97\u3002\u201d**\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011**\u3002\u4e00\u5207\u670d\u52a1\u56f4\u7ed5\u201c\u5982\u4f55\u5c3d\u5feb\u63a5\u5230\u7b2c\u4e00\u5355\u201d\u5c55\u5f00\uff0c\u7b80\u5316\u7406\u8bba\uff0c\u5f3a\u5316\u5b9e\u64cd\u548c\u8bd5\u97f3\u6307\u5bfc\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u8d44\u91d1\u538b\u529b\u548c\u7126\u8651\u5fc3\u6001\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\uff0c\u7528\u4e8e\u65e5\u5e38\u60c5\u7eea\u5b89\u629a\u548c\u4fe1\u5fc3\u5efa\u7acb\uff0c\u9632\u6b62\u5176\u56e0\u77ed\u671f\u65e0\u6536\u76ca\u800c\u5fc3\u6001\u5d29\u6e83\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u5176\u753b\u957f\u671f\u6536\u76ca\u5927\u997c**\u3002\u907f\u514d\u8c08\u8bba\u201c\u5b66\u6210\u540e\u6708\u5165\u8fc7\u4e07\u201d\uff0c\u805a\u7126\u201c\u672c\u5468/\u672c\u6708\u5982\u4f55\u5c1d\u8bd5\u63a5\u7b2c\u4e00\u5355\u201d\u3002\n    2. **\u7edd\u4e0d\u65bd\u52a0\u8fc7\u96be\u7684\u5b66\u4e60\u4efb\u52a1**\u3002\u907f\u514d\u589e\u52a0\u5176\u632b\u8d25\u611f\uff0c\u4efb\u52a1\u8bbe\u8ba1\u4ee5\u201c\u5b8c\u6210\u5373\u6709\u5c0f\u6210\u5c31\u611f\u201d\u4e3a\u6807\u51c6\u3002\n    3. **\u7edd\u4e0d\u5ffd\u89c6\u5176\u7ecf\u6d4e\u72b6\u51b5\u7684\u8be2\u95ee**\u3002\u82e5\u5176\u63d0\u53ca\u8fd8\u6b3e\u538b\u529b\uff0c\u9700\u5f15\u5bfc\u81f3\u5b98\u65b9\u5408\u89c4\u6e20\u9053\u6c9f\u901a\uff0c\u907f\u514d\u79c1\u4e0b\u627f\u8bfa\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u73b0\u6709\u8bfe\u7a0b\u672a\u4ea7\u751f\u7a33\u5b9a\u6536\u76ca\u524d\uff0c\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u662f\u5c06\u5176\u63a8\u5411\u503a\u52a1\u6df1\u6e0a\u548c\u6295\u8bc9\u7684\u5bfc\u706b\u7d22\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u8d44\u91d1\u5f88\u7d27\u5f20\u201d\n2. > \u201c\u53ef\u4ee5\u6323\u591f\u94b1\u5728\u5b66\u4e48\u201d\n3. > \u201c\u5e08\u59d0 \u4f60\u770b\u6211\u6709\u5e0c\u671b\u5417 \u52aa\u52aa\u529b\u7684\u8bdd\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4\u641e\u94b1\u7ed3\u679c\u578b\u3011**\uff0c\u4f46\u5df2**\u89e6\u53d1D\u7c7b\u7ea2\u7ebf**\u3002\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u9700\u6c42\uff08\u7ecf\u6d4e\u4fdd\u969c\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u805a\u7126\u77ed\u671f\u63a5\u5355\u5b9e\u64cd + \u9ad8\u5f3a\u5ea6\u60c5\u7eea\u966a\u62a4\uff0c\u4e25\u9632\u6536\u76ca\u9884\u671f\u7ba1\u7406\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u578b (D\u7c7b\u7ea2\u7ebf)\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf+\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
