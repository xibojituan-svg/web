    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4ee5\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\u7684\u8eab\u4efd\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677165557 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u8e0f\u96ea1(\u4e8e\u83b9) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u5f20\u9707\u8001\u5e08\u6709\u58f0\u6f14\u64ad\u7cfb\u7edf\u8bfe\u7a0b |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u672a\u77e5\uff08\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1\uff08\u4e0a\u73ed\u65cf\uff0c\u9700\u4e0b\u73ed\u540e\u5b66\u4e60\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u672a\u77e5\uff08\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u8868\u8fbe\u4e86\u660e\u786e\u7684\u5b66\u4e60\u610f\u613f\uff08\u201c\u6211\u8981\u5b66\u6709\u58f0\u201d\uff09\uff0c\u5e76\u5b8c\u6210\u4e86\u591a\u6b21\u6253\u5361\u548c\u4f5c\u4e1a\uff0c\u4f46\u5e76\u672a\u5728\u804a\u5929\u4e2d\u4e3b\u52a8\u3001\u9ad8\u9891\u5730\u8ffd\u95ee\u201c\u591a\u4e45\u80fd\u8d5a\u94b1\u201d\u6216\u201c\u4fdd\u5e95\u6536\u76ca\u201d\u3002\u5176\u52a8\u673a\u4ecb\u4e8e\u5174\u8da3\u63a2\u7d22\u4e0e\u517c\u804c\u53d8\u73b0\u4e4b\u95f4\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u8981\u5b66\u6709\u58f0\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u672a\u77e5] \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u7ecf\u6d4e\u72b6\u51b5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 \u7528\u6237\u4e3a\u4e0a\u73ed\u65cf\uff0c\u5b66\u4e60\u9700\u5229\u7528\u4e0b\u73ed\u540e\u7684\u788e\u7247\u65f6\u95f4\uff08\u201c\u7b49\u4e0b\u73ed\u5c31\u542c\u201d\u3001\u201c\u665a\u4e0a\u6709\u4e8b \u8981\u8bf7\u5047\u201d\uff09\uff0c\u65f6\u95f4\u4e0d\u5bbd\u88d5\u4f46\u5c1a\u53ef\u5b89\u6392\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u672a\u77e5] \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u9700\u95f4\u6b47\u6027\u5b89\u629a\u3002\u7528\u6237\u5bf9\u9500\u552e/\u73ed\u4e3b\u4efb\u7684\u6307\u4ee4\uff08\u770b\u56de\u653e\u3001\u4ea4\u4f5c\u4e1a\u3001\u8fdb\u76f4\u64ad\u95f4\uff09\u6709\u56de\u5e94\uff0c\u4f46\u8f83\u4e3a\u88ab\u52a8\u548c\u7b80\u77ed\uff0c\u672a\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u60c5\u7eea\u6ce2\u52a8\u6216\u81ea\u6211\u5426\u5b9a\u3002\u9762\u5bf9\u50ac\u4fc3\uff08\u201c\u4f60\u548b\u8fd8\u6ca1\u5b8c\u6210\u5462\uff1f\u201d\uff09\u65f6\uff0c\u4ee5\u201c\u6211\u4eca\u5929\u6709\u4e9b\u4e8b \u7a0d\u540e\u518d\u56de\u590d \u8c22\u8c22\u201d\u793c\u8c8c\u56de\u5e94\uff0c\u672a\u5d29\u6e83\u4e5f\u672a\u6fc0\u70c8\u5bf9\u6297\uff0c\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u7a33\u5b9a\u6027\u548c\u8fb9\u754c\u611f\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u4eca\u5929\u6709\u4e9b\u4e8b \u7a0d\u540e\u518d\u56de\u590d \u8c22\u8c22\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c / \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u672a\u6765\u7684\u4e0d\u786e\u5b9a\u6027\u548c\u804c\u4e1a\u53d1\u5c55\u7684\u7126\u8651\u3002\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u4e00\u9879\u65b0\u6280\u80fd\uff08\u6709\u58f0\u6f14\u64ad\uff09\u6765\u589e\u52a0\u6536\u5165\u6216\u5f00\u8f9f\u526f\u4e1a\u53ef\u80fd\uff0c\u5bfb\u6c42\u4e00\u79cd\u7ecf\u6d4e\u4e0a\u7684\u5b89\u5168\u611f\u548c\u804c\u4e1a\u4e0a\u7684\u65b0\u8def\u5f84\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u7684\u6210\u957f\u8def\u5f84\u4e0e\u5f52\u5c5e\u611f**\u3002\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u6267\u884c\u7684\u201c\u63a5\u5355-\u53d8\u73b0\u201d\u8def\u7ebf\u56fe\uff0c\u5e76\u8425\u9020\u4e00\u79cd\u201c\u4f60\u4e0d\u662f\u4e00\u4e2a\u4eba\u5728\u6218\u6597\u201d\u7684\u793e\u7fa4\u6c1b\u56f4\uff0c\u6d88\u9664\u5176\u72ec\u81ea\u63a2\u7d22\u7684\u5b64\u72ec\u611f\u548c\u4e0d\u786e\u5b9a\u6027\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 **B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** |\n\n**\u5224\u5b9a\u6811\u8def\u5f84\u63a8\u6f14**\uff1a\n1.  **\u524d\u7f6e\u9694\u7206\u7b5b**\uff1a\u672a\u89e6\u53d1T0\uff08\u65e0\u96f6\u4e92\u52a8\u9ad8\u4e0b\u8f7d\uff09\u3001T8-D\uff08\u65e0\u501f\u8d37/\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\uff09\u7ea2\u7ebf\u3002\n2.  **\u4ea4\u6613\u4fe1\u53f7\u786c\u62e6\u622a\u5c42**\uff1a\u65e0\u652f\u4ed8\u6570\u636e\uff0c\u8df3\u8fc7\u3002\n3.  **\u52a8\u673a\u7eaf\u5ea6**\uff1a\u4e2d\u7b49\uff085-6\u5206\uff09\uff0c\u7528\u6237\u6709\u5b66\u4e60\u884c\u52a8\u4f46\u672a\u9ad8\u9891\u8ffd\u95ee\u53d8\u73b0\u3002\n4.  **\u5fc3\u7406\u5f39\u6027**\uff1a\u4e2d\u7b49\uff085-6\u5206\uff09\uff0c\u7a33\u5b9a\u56de\u5e94\uff0c\u65e0\u5d29\u6e83\u4fe1\u53f7\u3002\n5.  **\u8d44\u6e90\u5e95\u5ea7**\uff1a\u4e2d\u7b49\uff085-6\u5206\uff09\uff0c\u4e0a\u73ed\u65cf\uff0c\u788e\u7247\u65f6\u95f4\u3002\n6.  **\u5206\u652f\u5339\u914d**\uff1a\u8fdb\u5165\u201c\u4e2d\u7b49\u5f39\u6027\u901a\u9053\u201d\u3002\u52a8\u673a\u7eaf\u5ea6\u22655\uff0c\u4f5c\u4e1a\u63d0\u4ea4\u89c4\u5f8b\uff08\u6709\u5b8c\u6210\u8bb0\u5f55\uff09\uff0c\u7b26\u5408 **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** \u7279\u5f81\uff1a\u8ba4\u771f\u3001\u7a33\u5b9a\u3001\u6267\u884c\u529b\u5f3a\uff0c\u4f46\u793e\u4ea4\u4e92\u52a8\u8f83\u5c11\uff0c\u5c5e\u4e8e\u73ed\u7ea7\u7684\u7a33\u5b9a\u57fa\u77f3\u3002\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u8868\u73b0\u72ec\u7acb\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u4f5c\u4e3a\u4e0a\u73ed\u65cf\uff0c\u82e5\u5de5\u4f5c\u7a81\u7136\u7e41\u5fd9\u6216\u751f\u6d3b\u51fa\u73b0\u53d8\u6545\uff0c\u5176\u788e\u7247\u5316\u5b66\u4e60\u65f6\u95f4\u6781\u6613\u88ab\u6324\u538b\uff0c\u5bfc\u81f4\u8bfe\u7a0b\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u7126\u8651\u548c\u81ea\u8d23\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u4e2d\u7b49\uff0c\u672a\u8868\u73b0\u51fa\u73bb\u7483\u5fc3\u7279\u8d28\uff0c\u5bf9\u666e\u901a\u632b\u6298\u6709\u8010\u53d7\u6027\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u82e5\u5728\u627f\u8bfa\u7684\u201c\u63a5\u5355\u201d\u5468\u671f\u5185\uff08\u59822-3\u4e2a\u6708\uff09\u672a\u80fd\u83b7\u5f97\u4efb\u4f55\u5b9e\u8d28\u6027\u7684\u8bd5\u97f3\u673a\u4f1a\u6216\u5fae\u5c0f\u6536\u76ca\uff0c\u5176\u201c\u641e\u94b1\u201d\u7684\u4e2d\u7b49\u52a8\u673a\u53ef\u80fd\u8f6c\u5316\u4e3a\u5931\u671b\uff0c\u5f15\u53d1\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe\u7b2c3-4\u5468\uff0c\u5f53\u8bfe\u7a0b\u96be\u5ea6\u63d0\u5347\u3001\u4f5c\u4e1a\u91cf\u589e\u52a0\uff0c\u800c\u7528\u6237\u56e0\u5de5\u4f5c\u7e41\u5fd9\u51fa\u73b0\u8fde\u7eed\u7f3a\u8bfe\u6216\u4f5c\u4e1a\u62d6\u6b20\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u770b\u5230\u4f60\u6bcf\u6b21\u90fd\u8ba4\u771f\u5b8c\u6210\u4f5c\u4e1a\uff0c\u8fd9\u4efd\u575a\u6301\u7279\u522b\u96be\u5f97\u3002\u54b1\u4eec\u73ed\u5f88\u591a\u540c\u5b66\u90fd\u662f\u4e0a\u73ed\u65cf\uff0c\u65f6\u95f4\u7d27\uff0c\u4f60\u80fd\u8ddf\u4e0a\u8282\u594f\u5df2\u7ecf\u5f88\u68d2\u4e86\u3002\u540e\u7eed\u5b66\u4e60\u5982\u679c\u9047\u5230\u65f6\u95f4\u51b2\u7a81\u522b\u7740\u6025\uff0c\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u8c03\u6574\u8ba1\u5212\u3002\u4f60\u7684\u76ee\u6807\u662f\u8e0f\u8e0f\u5b9e\u5b9e\u628a\u6280\u80fd\u7ec3\u5230\u624b\uff0c\u63a5\u5355\u53d8\u73b0\u662f\u6c34\u5230\u6e20\u6210\u7684\u4e8b\uff0c\u6211\u5e2e\u4f60\u76ef\u7740\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011\u3002T2\u7528\u6237\u4eab\u53d7\u201c\u82b1\u94b1\u4e70\u75db\u82e6\u201d\uff0c\u4ed6\u4eec\u9700\u8981\u6e05\u6670\u3001\u6709\u6311\u6218\u6027\u7684\u5b66\u4e60\u8def\u5f84\u548c\u624e\u5b9e\u7684\u6280\u80fd\u4ea4\u4ed8\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\u7684\u7279\u70b9\uff0c\u8865\u5145\u3010\u65f6\u95f4\u7ba1\u7406\u8f85\u52a9\u5305\u3011\uff08\u5982\u63d0\u4f9b\u97f3\u9891\u788e\u7247\u5316\u5b66\u4e60\u6307\u5357\u3001\u5468\u672b\u8865\u8bfe\u89c4\u5212\uff09\u3002\u53ef\u9010\u6b65\u89c2\u5bdf\uff0c\u82e5\u5176\u540e\u671f\u8868\u73b0\u51fa\u6280\u672f\u94bb\u7814\u503e\u5411\uff0c\u53ef\u89e3\u9501\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u5012\u8ba1\u65f6\u201d\u3001\u201c\u6700\u540e\u540d\u989d\u201d\u7b49\u9ad8\u538b\u8bdd\u672f\u903c\u5355\u3002\u8fd9\u4f1a\u7834\u574f\u5176\u7a33\u5b9a\u7684\u5b66\u4e60\u8282\u594f\u548c\u4fe1\u4efb\u611f\u3002\u4e0d\u8981\u8fc7\u5ea6\u793e\u4ea4\u6253\u6270\uff0c\u4fdd\u6301\u4e13\u4e1a\u3001\u9ad8\u6548\u7684\u6c9f\u901a\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002T2\u7528\u6237\u662f\u590d\u8d2d\u4e3b\u529b\uff0c\u5f53\u5176\u6280\u80fd\u8fbe\u6807\u3001\u5efa\u7acb\u4fe1\u4efb\u540e\uff0c\u5411\u5176\u63a8\u4ecb\u9ad8\u9636\u8bfe\u7a0b\u3001\u8bbe\u5907\u6216\u79c1\u6559\u670d\u52a1\u7684\u6210\u529f\u7387\u9ad8\u3002\u4f46\u9700\u5efa\u7acb\u5728\u201c\u89e3\u51b3\u5176\u5f53\u524d\u5b66\u4e60\u74f6\u9888\u201d\u7684\u57fa\u7840\u4e0a\uff0c\u800c\u975e\u7a7a\u6cdb\u753b\u997c\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u8981\u5b66\u6709\u58f0\u201d \u2014\u2014 **\u660e\u786e\u7684\u5b66\u4e60\u610f\u5411\uff0c\u4f46\u975e\u6025\u5207\u53d8\u73b0**\u3002\n2. > \u201c\u7b49\u4e0b\u73ed\u5c31\u542c\u201d\u3001\u201c\u665a\u4e0a\u6709\u4e8b \u8981\u8bf7\u5047\u201d \u2014\u2014 **\u5178\u578b\u7684\u4e0a\u73ed\u65cf\u788e\u7247\u65f6\u95f4\u6a21\u5f0f**\uff0c\u8d44\u6e90\u5e95\u5ea7\u4e2d\u7b49\u7684\u76f4\u63a5\u8bc1\u636e\u3002\n3. > \u201c\u6211\u4eca\u5929\u6709\u4e9b\u4e8b \u7a0d\u540e\u518d\u56de\u590d \u8c22\u8c22\u201d \u2014\u2014 **\u793c\u8c8c\u3001\u7a33\u5b9a\u3001\u6709\u8fb9\u754c\u611f\u7684\u56de\u5e94**\uff0c\u662f\u4e2d\u7b49\u5fc3\u7406\u5f39\u6027\u7684\u5178\u578b\u8868\u73b0\uff0c\u65e2\u975e\u60c5\u7eea\u5de8\u5a74\u7684\u4f9d\u8d56\uff0c\u4e5f\u975e\u9ad8\u5f39\u6027\u8005\u7684\u5f3a\u52bf\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u786e\u5b9a\u6027\u7684\u6280\u80fd\u6210\u957f\u8def\u5f84\u4ee5\u4fdd\u969c\u672a\u6765\u6536\u5165\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u7075\u6d3b\u7684\u65f6\u95f4\u7ba1\u7406\u652f\u6301\uff0c\u4e25\u9632\u5176\u56e0\u5de5\u4f5c\u7e41\u5fd9\u5bfc\u81f4\u7684\u8bfe\u7a0b\u79ef\u538b\u5d29\u6e83\uff0c\u5e76\u5728\u5176\u6280\u80fd\u8fbe\u6807\u540e\u987a\u52bf\u63a8\u4ecb\u9ad8\u9636\u8bfe\u7a0b\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168/\u793e\u4ea4\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
