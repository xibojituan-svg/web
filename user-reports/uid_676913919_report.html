    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676913919 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-01 \u81f3 2026-03-07 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u957f\u4e50(\u675c\u53cc) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b (\u5df2\u8d2dMK4\u8bbe\u5907) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u5145\u88d5 (\u4e3b\u52a8\u8d2d\u4e70\u8bbe\u5907\uff0c\u672a\u63d0\u53ca\u8d44\u91d1\u538b\u529b) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1 (\u9700\u4e0a\u73ed\u3001\u505a\u996d\u3001\u5e26\u5a03\uff0c\u4f46\u80fd\u6324\u51fa\u65f6\u95f4\u5b66\u4e60\u4ea4\u6d41) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u5df2\u62a5\u5907\u5e76\u652f\u6301 (\u4e08\u592b\u4ece\u53cd\u5bf9\u5230\u79ef\u6781\u53c2\u4e0e\u6539\u9020\u5f55\u97f3\u73af\u5883\uff0c\u5973\u513f\u4e5f\u53c2\u4e0e\u4e92\u52a8) |\n| **\u4fe1\u606f\u539a\u5ea6** | \u9971\u6ee1 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u6709\u53d8\u73b0\u671f\u5f85\uff08\u5173\u6ce8\u8bd5\u97f3\u3001\u63a5\u5355\uff09\uff0c\u4f46\u540c\u6837\u8868\u73b0\u51fa\u5bf9\u6280\u80fd\u672c\u8eab\u7684\u94bb\u7814\u5174\u8da3\u548c\u793e\u7fa4\u5f52\u5c5e\u611f\uff0c\u5e76\u975e\u7eaf\u7cb9\u4e3a\u77ed\u671f\u66b4\u5bcc\u800c\u6765\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8bd5\u97f3\u4e0d\u8981\u7ed9\u81ea\u5df1\u592a\u5927\u538b\u529b\u7b2c\u4e00\u5468\u91cd\u70b9\u5728\u6d41\u7a0b\uff0c\u5728\u62ff\u70b9\u8bc4\uff0c\u8ba4\u771f\u662f\u5bf9\u7684\u4f46\u662f\u4e0d\u8981\u6025\u4e8e\u6c42\u6210\u201d (\u7528\u6237\u63a5\u53d7\u6b64\u89c2\u70b9\uff0c\u672a\u53cd\u9a73\u6216\u65bd\u538b)\uff1b> \u201c\u8c22\u8c22\u63d0\u9192\uff0c\u5dee\u70b9\u5fd8\u4e86\u201d (\u5bf9\u8bd5\u97f3\u673a\u4f1a\u79ef\u6781)\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b06\u9ad8]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u9ad8] \u2014 \u5df2\u62a5\u540d\u8bfe\u7a0b\uff0c\u5e76\u5728\u73ed\u73ed\u63a8\u8350\u4e0b\u4e3b\u52a8\u8d2d\u4e70\u4e86MK4\u58f0\u5361\u7b49\u8bbe\u5907\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 \u6709\u5168\u804c\u5de5\u4f5c\uff0c\u9700\u517c\u987e\u5bb6\u5ead\uff08\u505a\u996d\u3001\u5e26\u5a03\uff09\uff0c\u4f46\u80fd\u5229\u7528\u5348\u4f11\u3001\u665a\u4e0a\u7b49\u788e\u7247\u65f6\u95f4\u5b66\u4e60\u3001\u4ea4\u6d41\u3001\u8c03\u8bd5\u8bbe\u5907\uff0c\u5b66\u4e60\u610f\u613f\u5f3a\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u9ad8] \u2014 **\u6838\u5fc3\u4f18\u52bf**\u3002\u4e08\u592b\u4ece\u6700\u521d\u8ba4\u4e3a\u201c\u6d6a\u8d39\u94b1\u201d\u8f6c\u53d8\u4e3a\u201c\u6bd4\u6211\u7684\u52b2\u8fd8\u5927\u201d\uff0c\u4e3b\u52a8\u5e2e\u5fd9\u6539\u9020\u5f55\u97f3\u73af\u5883\uff1b\u5973\u513f\u4e5f\u597d\u5947\u53c2\u4e0e\u3002\u5bb6\u5ead\u6c1b\u56f4\u652f\u6301\uff0c\u65e0\u963b\u529b\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u8bbe\u5907\u8c03\u8bd5\u3001\u5f55\u97f3\u73af\u5883\uff09\u4e3b\u52a8\u8be2\u95ee\u3001\u5c1d\u8bd5\u89e3\u51b3\uff08\u201c\u6211\u81ea\u5df1\u6478\u7d22\u4e00\u4e0b\u201d\uff09\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u4e50\u4e8e\u81ea\u5632\uff08\u201c\u5634\u5df2\u5e9f\uff0c\u6211\u5c3d\u529b\u4e86[\u6d41\u6cea]\u201d\uff09\uff0c\u65e0\u62b1\u6028\u6216\u653e\u5f03\u503e\u5411\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4e07\u4e8b\u5f00\u5934\u96be\u561b\uff0c\u7ec3\u561b\uff0c\u5c31\u8fd9\u4e48\u7b80\u5355\u3002\u201d (\u9f13\u52b1\u4ed6\u4eba\uff0c\u4e5f\u4f53\u73b0\u81ea\u8eab\u5fc3\u6001)\uff1b> \u201c\u6211\u4ea4\u4e86\uff0c\u5c31\u7b49\u7740\u5ba1\u5224\u4e86[\u7834\u6d95\u4e3a\u7b11]\u201d (\u5bf9\u4f5c\u4e1a\u70b9\u8bc4\u6301\u4e50\u89c2\u5f00\u653e\u6001\u5ea6)\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42 / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5728\u5bb6\u5ead\u548c\u5de5\u4f5c\u4e4b\u5916\uff0c\u5bfb\u6c42\u4e00\u4e2a\u80fd\u83b7\u5f97**\u5f52\u5c5e\u611f\u3001\u8ba4\u540c\u611f\u548c\u4ef7\u503c\u611f**\u7684\u65b0\u793e\u4ea4\u5708\u4e0e\u8eab\u4efd\u3002\u5979\u6e34\u671b\u88ab\u770b\u89c1\u3001\u88ab\u8ba4\u53ef\uff08\u201c\u4f60\u7684\u58f0\u97f3\u6700\u6709\u7279\u8272\u4e86\u201d\uff09\uff0c\u5e76\u5728\u793e\u7fa4\u4e92\u52a8\u4e2d\u83b7\u5f97\u4e50\u8da3\u548c\u8fde\u63a5\uff08\u201c\u770b\u5230\u4f60\u4eec\u804a\u5f97\u8fd9\u4e48\u6d3b\u8dc3\u201d\uff09\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u793e\u7fa4\u4e2d\u7684\u79ef\u6781\u4e92\u52a8\u3001\u8ba4\u53ef\u4e0e\u9f13\u52b1**\uff0c\u8ba9\u5979\u611f\u53d7\u5230\u81ea\u5df1\u662f\u8fd9\u4e2a\u201c\u6709\u58f0\u6f14\u64ad\u7231\u597d\u8005\u201d\u5708\u5b50\u4e2d\u91cd\u8981\u3001\u6709\u8da3\u3001\u88ab\u9700\u8981\u7684\u4e00\u5458\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 B \u7c7b (\u9ad8\u6f5c\u529b\u3001\u9ad8\u4e92\u52a8\u3001\u9700\u5f15\u5bfc\u7684\u4f18\u8d28\u7528\u6237) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T5 \u597d\u73a9\u5c1d\u9c9c\u578b** (\u517c\u5177\u90e8\u5206T2\u5b9e\u5e72\u7279\u8d28) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u6781\u4f4e | \u5bb6\u5ead\u652f\u6301\u5ea6\u9ad8\uff0c\u4e08\u592b\u53c2\u4e0e\u5176\u4e2d\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u65f6\u95f4\u867d\u788e\u7247\u5316\uff0c\u4f46\u5b66\u4e60\u610f\u613f\u5f3a\uff0c\u80fd\u4e3b\u52a8\u8ddf\u4e0a\u8282\u594f\u3002\u98ce\u9669\u5728\u4e8e\u957f\u671f\u5de5\u4f5c\u5bb6\u5ead\u538b\u529b\u7d2f\u79ef\u5bfc\u81f4\u65f6\u95f4\u67af\u7aed\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u5230\u95ee\u9898\u4e3b\u52a8\u6c42\u89e3\uff0c\u5fc3\u6001\u79ef\u6781\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | **\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u5982\u679c\u7ecf\u8fc7\u4e00\u6bb5\u65f6\u95f4\u5b66\u4e60\u8bd5\u97f3\u540e\uff0c\u63a5\u5355\u6210\u679c\u8fdc\u4f4e\u4e8e\u9884\u671f\uff0c\u53ef\u80fd\u4ea7\u751f\u5931\u843d\u611f\u3002\u4f46\u5176\u52a8\u673a\u4e0d\u7eaf\u4e3a\u94b1\uff0c\u793e\u7fa4\u5f52\u5c5e\u611f\u53ef\u7f13\u51b2\u90e8\u5206\u98ce\u9669\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe4-8\u5468\uff0c\u9996\u6b21\u8bd5\u97f3\u5931\u8d25\u6216\u8fde\u7eed\u591a\u6b21\u672a\u4e2d\u9009\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u770b\u5230\u4f60\u5728\u7fa4\u91cc\u7279\u522b\u6d3b\u8dc3\uff0c\u7ed9\u5927\u5bb6\u5f88\u591a\u9f13\u52b1\uff0c\u4e5f\u7279\u522b\u7231\u94bb\u7814\u6280\u672f\u7ec6\u8282\uff0c\u771f\u662f\u6211\u4eec\u73ed\u7684\u5b9d\u85cf\u5b66\u5458\uff01\u54b1\u4eec\u8fd9\u4e2a\u73ed\u5c31\u50cf\u4e00\u4e2a\u6709\u58f0\u5c0f\u5bb6\u5ead\uff0c\u4ee5\u540e\u591a\u5e26\u7740\u5927\u5bb6\u4e00\u8d77\u73a9\uff0c\u4f60\u7684\u58f0\u97f3\u7279\u8272\u548c\u70ed\u5fc3\u80a0\u4e00\u5b9a\u80fd\u5708\u7c89~\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5174\u8da3\u6e38\u4e50\u7ebf**\u3011+\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf** (\u8f7b\u91cf)\u3011\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u94bb\u7814\u7cbe\u795e\uff0c\u53ef\u9002\u5ea6\u8865\u5145\u3010**\u786c\u6838\u5b9e\u5e72\u5305**\u3011(\u5982\u9ad8\u7ea7\u8bbe\u5907\u8c03\u6821\u6280\u5de7\u3001\u89d2\u8272\u97f3\u6df1\u5ea6\u89e3\u6790)\uff0c\u4f46\u9700\u5728\u5176\u4e3b\u52a8\u8be2\u95ee\u65f6\u63d0\u4f9b\uff0c\u907f\u514d\u589e\u52a0\u538b\u529b\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5c06\u5979\u5f53\u4f5c\u7eaf\u201c\u641e\u94b1\u7528\u6237\u201d\u6301\u7eed\u753b\u53d8\u73b0\u5927\u997c\u65bd\u538b\uff1b\u5ffd\u89c6\u5979\u5728\u793e\u7fa4\u4e2d\u7684\u4e92\u52a8\u8d21\u732e\uff1b\u5728\u5979\u5206\u4eab\u751f\u6d3b\u6216\u6280\u672f\u7ec6\u8282\u65f6\u6577\u884d\u56de\u5e94\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u57fa\u4e8e\u5176\u5174\u8da3\u548c\u793e\u7fa4\u7c98\u6027\uff0c\u5728\u8bfe\u7a0b\u540e\u671f\u63a8\u8350\u3010\u9ad8\u9636\u6f14\u64ad\u6280\u5de7\u8bfe\u3011\u6216\u3010\u6709\u58f0\u5267\u5236\u4f5c\u5de5\u4f5c\u574a\u3011\u7b49\u5174\u8da3\u6df1\u5316\u7c7b\u4ea7\u54c1\uff0c**\u4e25\u7981\u5f3a\u63a8\u9ad8\u989d\u201c\u4fdd\u5e95\u63a5\u5355\u201d\u7c7b\u4ea7\u54c1**\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6ca1\u5f00\u59cb\u524d\u8bf4\u6d6a\u8d39\u94b1\uff0c\u5f00\u59cb\u4e86\u6bd4\u6211\u7684\u52b2\u8fd8\u5927\u3002\u6fc0\u53d1\u4e86\u4ed6\u521b\u4f5c\u70ed\u60c5\u201d **(\u5bb6\u5ead\u652f\u6301\u5ea6\u9ad8)**\n2. > \u201c\u4e07\u4e8b\u5f00\u5934\u96be\u561b\uff0c\u7ec3\u561b\uff0c\u5c31\u8fd9\u4e48\u7b80\u5355\u3002\u201d **(\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u5b9e\u5e72\u5fc3\u6001)**\n3. > \u201c\u770b\u5230\u4f60\u4eec\u804a\u5f97\u8fd9\u4e48\u6d3b\u8dc3\uff0c\u611f\u89c9\u6211\u90fd\u8001\u4e86\uff0c\u8ddf\u4e0d\u4e0a\u4f60\u4eec\u7684\u8282\u594f[\u7834\u6d95\u4e3a\u7b11]\u201d **(\u6e34\u671b\u793e\u7fa4\u5f52\u5c5e\u4e0e\u4e92\u52a8)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T5 \u597d\u73a9\u5c1d\u9c9c\u578b\u3011**\uff0c\u517c\u5177\u5b9e\u5e72\u6f5c\u8d28\u3002\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u793e\u7fa4\u5f52\u5c5e\u4e0e\u5c0a\u91cd\u8ba4\u53ef\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5f3a\u5316\u5979\u5728\u793e\u7fa4\u4e2d\u7684\u89d2\u8272\u611f\u4e0e\u4ef7\u503c\u611f\uff0c\u5c06\u5b66\u4e60\u8fc7\u7a0b\u6e38\u620f\u5316\u3001\u793e\u4ea4\u5316\uff0c\u8c28\u614e\u7ba1\u7406\u53d8\u73b0\u9884\u671f\u3011**\u3002\n\n```json\n{\"core_type\": \"T5 \u597d\u73a9\u5c1d\u9c9c\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u793e\u4ea4/\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf+\u5708\u5c42\u5408\u4f19\u4eba\u7ebf(\u8f7b\u91cf)\"}\n```";
