        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677152946 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6696\u6696-\u5b98\u65b9\u62db\u52df\u5b98(\u4f55\u4f73) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u9ad8\u9636\u73ed\u8bfe\u7a0b |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u8d44\u91d1\u7d27\u5f20**\uff08\u201c\u4e00\u4e2a\u94f6\u884c\u5361\u94b1\u4e0d\u591f\u9700\u8981\u7b49\u4e00\u4f1a\u201d\uff0c\u9700\u6362\u5361/\u7b49\u5f85\u8d44\u91d1\u5230\u8d26\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u9ad8\u5bbd\u88d5**\uff08\u5728\u6821\u5927\u5b66\u751f\uff0c\u65e0\u5de5\u4f5c\u538b\u529b\uff0c\u65f6\u95f4\u81ea\u7531\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\uff08\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\uff0c\u9700\u8b66\u60d5\u9690\u7792\u98ce\u9669\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u5b66\u4e60\u8fc7\u7a0b\u3001\u7ecf\u6d4e\u72b6\u51b5\u3001\u52a8\u673a\u5747\u6709\u660e\u786e\u8868\u8fbe\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b07\u4f4e\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u7eaf\u4e3a\u77ed\u671f\u53d8\u73b0\u3001\u89e3\u51b3\u751f\u6d3b\u8d39\u800c\u6765**\uff0c\u5bf9\u5b66\u4e60\u5185\u5bb9\u672c\u8eab\u5174\u8da3\u4e00\u822c\uff0c\u5bf9\u201c\u591a\u4e45\u80fd\u8d5a\u94b1\u201d\u9ad8\u5ea6\u5173\u6ce8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u55ef\uff0c\u8bf4\u5b9e\u8bdd\uff0c\u505a\u8fd9\u4e2a\u517c\u804c\u55ef\uff0c\u8981\u8bf4\u85aa\u6c34\u7684\u8bdd\uff0c\u6211\u60f3\u7684\u8bdd\uff0c\u55ef\uff0c\u8981\u67095000\u5de6\u53f3\uff0c\u4e5f\u53ef\u80fd\u662f\u6211\u60f3\u7684\u6709\u70b9\u9ad8\uff0c\u5c31\u662f\u60f3\u7740\u53ef\u4ee5\u89e3\u51b3\u6211\u7684\u751f\u6d3b\u8d39\u561b\uff0c\u7136\u540e\u4e0d\u60f3\u53eb\u5bb6\u91cc\u518d\u51fa\u94b1\uff0c\u770b\u80fd\u4e0d\u80fd\u81ea\u5df1\u89e3\u51b3\u3002\u201d\n> \u201c\u611f\u89c9\u4ea4\u4e86\u94b1\u4e4b\u540e\u5fc3\u91cc\u614c\u614c\u7684[\u7834\u6d95\u4e3a\u7b11]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u660e\u786e\u8868\u793a\u201c\u7ecf\u6d4e\u4e5f\u6ca1\u6709\u592a\u597d\u201d\uff0c\u652f\u4ed8\u65f6\u51fa\u73b0\u201c\u4e00\u4e2a\u94f6\u884c\u5361\u94b1\u4e0d\u591f\u9700\u8981\u7b49\u4e00\u4f1a\u201d\u7684\u7a98\u8feb\u60c5\u51b5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u9ad8** \u2014 \u5728\u6821\u5927\u5b66\u751f\uff0c\u65f6\u95f4\u5145\u88d5\uff0c\u80fd\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u548c\u8ddf\u8fdb\u76f4\u64ad\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u672a\u63d0\u53ca\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\uff0c\u5b58\u5728**\u9690\u7792\u5077\u62a5**\u7684\u6f5c\u5728\u9ad8\u98ce\u9669\u3002\n- **\u5e95\u5ea7\u53d6\u77ed\u677f**\uff1a**\u4f4e**\uff08\u8d44\u91d1\u77ed\u677f\u4e25\u91cd\uff0c\u4e14\u5bb6\u5ead\u652f\u6301\u5ea6\u4e0d\u660e\uff09\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56**\u3002\u9996\u6b21\u8bd5\u97f3\u5373\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u4e0d\u81ea\u4fe1\uff08\u201c\u90a3\u4e2a\u90fd\u4e0d\u592a\u884c[\u6342\u8138]\u201d\uff09\uff0c\u5bf9\u5b66\u4e60\u8fc7\u7a0b\u611f\u5230\u8ff7\u832b\uff08\u201c\u4e0d\u77e5\u9053\u201d\uff09\uff0c\u4ed8\u8d39\u540e\u7acb\u523b\u51fa\u73b0\u7126\u8651\u548c\u540e\u6094\u60c5\u7eea\uff08\u201c\u5fc3\u91cc\u614c\u614c\u7684\u201d\uff09\uff0c\u5e76\u7acb\u5373\u8be2\u95ee\u9000\u6b3e\u653f\u7b56\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u5e08\u59d0\u8fd9\u4e2a\u8bd5\u97f3\u6211\u611f\u89c9\u6211\u4e0d\u4f1a\u5973\u89d2\u8272\u90a3\u4e2a\u90a3\u4e2a\u5e74\u9f84\u6bb5\u6211\u914d\u4e0d\u51fa\u6765\uff0c\u65c1\u767d\u6211\u914d\u8d77\u6765\u4e5f\u6ca1\u6709\u6545\u4e8b\u611f[\u6342\u8138][\u6342\u8138]\u201d\n> \u201c\u5e08\u59d0\uff0c\u5982\u679c\u55ef\u5c31\u662f\u7a81\u7136\u4e0d\u60f3\u5b66\u4e86\uff0c\u662f\u5728\u4ec0\u4e48\u671f\u9650\u5185\u53ef\u4ee5\u5168\u989d\u9000\u6b3e\u5440\uff1f[\u6342\u8138]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u7ecf\u6d4e\u4e0d\u72ec\u7acb\u5e26\u6765\u7684\u751f\u5b58\u7126\u8651\u4e0e\u81ea\u6211\u4ef7\u503c\u6000\u7591**\u3002\u4f5c\u4e3a\u5185\u5411\u7684\u5927\u5b66\u751f\uff0c\u5bb3\u6015\u627e\u4e0d\u5230\u5bf9\u53e3\u5de5\u4f5c\uff0c\u5e0c\u671b\u901a\u8fc7\u517c\u804c\u5feb\u901f\u83b7\u5f97\u6bcf\u67085000\u5143\u6536\u5165\u4ee5\u201c\u89e3\u51b3\u751f\u6d3b\u8d39\u201d\uff0c\u6446\u8131\u201c\u4e00\u76f4\u82b1\u5bb6\u91cc\u94b1\u201d\u7684\u6127\u759a\u611f\u548c\u5bf9\u672a\u6765\u7684\u4e0d\u786e\u5b9a\u6027\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u5b89\u629a\u4e0e\u786e\u5b9a\u6027\u7684\u627f\u8bfa**\u3002\u4ed6\u9700\u8981\u88ab\u53cd\u590d\u544a\u77e5\u201c\u4f60\u80fd\u884c\u201d\u3001\u201c\u6709\u6211\u5728\u201d\u3001\u201c\u6709\u9000\u8def\u201d\uff0c\u4ee5\u5bf9\u6297\u5176\u56e0\u8d44\u91d1\u7d27\u5f20\u548c\u6280\u80fd\u521d\u5b66\u800c\u4ea7\u751f\u7684\u5de8\u5927\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b\uff08\u51b2\u52a8\u98ce\u9669\u578b\uff09** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u75c7\u7b49D\u7c7b\u7194\u65ad\u7ea2\u7ebf\uff0c\u4f46**\u5bb6\u5ead\u51b3\u7b56\u6743\u4e0d\u660e**\u548c**\u8d44\u91d1\u7d27\u5f20**\u662f\u6781\u9ad8\u98ce\u9669\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u9ad8** | \u5bb6\u4eba\u53d1\u73b0\u5176\u7528\u751f\u6d3b\u8d39\u6216\u501f\u94b1\u62a5\u540d\u8bfe\u7a0b\uff0c\u8981\u6c42\u9000\u6b3e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u65f6\u95f4\u5145\u88d5\uff0c\u5b66\u4e60\u8ddf\u8fdb\u65e0\u538b\u529b\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | \u7b2c\u4e00\u4efd\u4f5c\u4e1a\u53d7\u632b\u3001\u7b2c\u4e00\u6b21\u63a5\u5355\u5931\u8d25\u3001\u6216\u77ed\u671f\u5185\u672a\u8fbe\u5230\u5176\u201c\u89e3\u51b3\u751f\u6d3b\u8d39\u201d\u7684\u8fc7\u9ad8\u9884\u671f\u65f6\uff0c\u6781\u6613\u56e0\u632b\u8d25\u611f\u548c\u7126\u8651\u800c\u8981\u6c42\u9000\u6b3e\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | \u5bf9\u201c\u6708\u51655000\u201d\u62b1\u6709\u77ed\u671f\u5e7b\u60f3\uff0c\u4e00\u65e6\u53d1\u73b0\u5b66\u4e60\u5468\u671f\u957f\u3001\u53d8\u73b0\u6162\uff0c\u4f1a\u7acb\u523b\u611f\u5230\u88ab\u6b3a\u9a97\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c\u4e00\u5468\u5185**\u3002\u7279\u522b\u662f\u9996\u6b21\u63d0\u4ea4\u6b63\u5f0f\u4f5c\u4e1a\u83b7\u5f97\u8d1f\u9762\u53cd\u9988\uff0c\u6216\u9996\u6b21\u5c1d\u8bd5\u63a5\u5355\u5931\u8d25\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u540c\u5b66\u4f60\u597d\uff01\u770b\u5230\u4f60\u987a\u5229\u62a5\u540d\uff0c\u771f\u7684\u4e3a\u4f60\u8fc8\u51fa\u8fd9\u4e00\u6b65\u611f\u5230\u9ad8\u5174\u3002\u6211\u77e5\u9053\u4f60\u53ef\u80fd\u5bf9\u672a\u77e5\u7684\u5b66\u4e60\u8fc7\u7a0b\u6709\u70b9\u5fd0\u5fd1\uff0c\u8fd9\u975e\u5e38\u6b63\u5e38\u3002\u8bf7\u653e\u5fc3\uff0c\u6211\u4eec\u7684\u8bfe\u7a0b\u8bbe\u8ba1\u5c31\u662f\u4e3a\u96f6\u57fa\u7840\u540c\u5b66\u51c6\u5907\u7684\uff0c\u6bcf\u4e00\u6b65\u90fd\u6709\u8001\u5e08\u624b\u628a\u624b\u5e26\u3002**\u6700\u91cd\u8981\u7684\u662f\uff0c\u4f60\u4e0d\u9700\u8981\u6709\u4efb\u4f55\u538b\u529b\uff0c\u7b2c\u4e00\u5468\u662f\u6211\u4eec\u7684\u2018\u4f53\u9a8c\u5468\u2019\uff0c\u6709\u4efb\u4f55\u4e0d\u9002\u5e94\u6216\u8005\u60f3\u6cd5\u53d8\u5316\uff0c\u6211\u4eec\u90fd\u6709\u5b8c\u5584\u7684\u4fdd\u969c\u3002** \u54b1\u4eec\u5148\u653e\u8f7b\u677e\uff0c\u4eab\u53d7\u7528\u58f0\u97f3\u8868\u8fbe\u81ea\u5df1\u7684\u8fc7\u7a0b\uff0c\u597d\u5417\uff1f\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\u3011**\u3002\u6838\u5fc3\u662f**\u964d\u9884\u671f\u3001\u5f3a\u5b89\u629a\u3001\u5c0f\u6b65\u6b63\u53cd\u9988**\u3002\u4e25\u7981\u63a8\u9001\u201c\u5feb\u901f\u63a5\u5355\u201d\u3001\u201c\u9ad8\u85aa\u6848\u4f8b\u201d\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u5f3a\u5236\u6302\u8f7d **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\uff0c\u5305\u542b\uff1a1\uff09\u6bcf\u65e5\u60c5\u7eea\u6253\u5361\u4e0e\u9f13\u52b1\uff1b2\uff09\u5206\u89e3\u5230\u6781\u7ec6\u7684\u5fae\u4efb\u52a1\uff08\u5982\u201c\u4eca\u5929\u53ea\u7ec3\u6c14\u606f5\u5206\u949f\u201d\uff09\uff1b3\uff09\u4f18\u5148\u5206\u914d\u7b80\u5355\u3001\u6613\u83b7\u5f97\u6210\u5c31\u611f\u7684\u201c\u753b\u672c\u201d\u7c7b\u4efb\u52a1\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. \u7edd\u4e0d\u5bf9\u5176\u4f7f\u7528\u4efb\u4f55\u201c\u6708\u5165\u8fc7\u4e07\u201d\u3001\u201c\u5feb\u901f\u53d8\u73b0\u201d\u7684\u8bdd\u672f\u523a\u6fc0\u3002\n    2. \u7edd\u4e0d\u5728\u5176\u8868\u8fbe\u7126\u8651\u65f6\u8bb2\u5927\u9053\u7406\u6216\u65bd\u538b\u3002\n    3. \u7edd\u4e0d\u5728\u5176\u5b8c\u6210\u7b80\u5355\u4efb\u52a1\u540e\uff0c\u7acb\u523b\u5e03\u7f6e\u66f4\u9ad8\u96be\u5ea6\u7684\u6311\u6218\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5f62\u5f0f\u7684\u5347\u5355**\u3002\u5f53\u524d\u8bfe\u7a0b\u5df2\u662f\u9ad8\u98ce\u9669\u6295\u5165\uff0c\u4efb\u4f55\u8ffd\u52a0\u6d88\u8d39\u90fd\u4f1a\u6210\u4e3a\u538b\u57ae\u9a86\u9a7c\u7684\u6700\u540e\u4e00\u6839\u7a3b\u8349\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u55ef\uff0c\u8bf4\u5b9e\u8bdd\uff0c\u505a\u8fd9\u4e2a\u517c\u804c\u55ef\uff0c\u8981\u8bf4\u85aa\u6c34\u7684\u8bdd\uff0c\u6211\u60f3\u7684\u8bdd\uff0c\u55ef\uff0c\u8981\u67095000\u5de6\u53f3\uff0c\u4e5f\u53ef\u80fd\u662f\u6211\u60f3\u7684\u6709\u70b9\u9ad8\uff0c\u5c31\u662f\u60f3\u7740\u53ef\u4ee5\u89e3\u51b3\u6211\u7684\u751f\u6d3b\u8d39\u561b\uff0c\u7136\u540e\u4e0d\u60f3\u53eb\u5bb6\u91cc\u518d\u51fa\u94b1\uff0c\u770b\u80fd\u4e0d\u80fd\u81ea\u5df1\u89e3\u51b3\u3002\u201d\n2. > \u201c\u5e08\u59d0\uff0c\u5982\u679c\u55ef\u5c31\u662f\u7a81\u7136\u4e0d\u60f3\u5b66\u4e86\uff0c\u662f\u5728\u4ec0\u4e48\u671f\u9650\u5185\u53ef\u4ee5\u5168\u989d\u9000\u6b3e\u5440\uff1f[\u6342\u8138]\u201d\n3. > \u201c\u611f\u89c9\u4ea4\u4e86\u94b1\u4e4b\u540e\u5fc3\u91cc\u614c\u614c\u7684[\u7834\u6d95\u4e3a\u7b11]\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6\u60c5\u7eea\u5de8\u5a74\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u6446\u8131\u7ecf\u6d4e\u4f9d\u8d56\u3001\u83b7\u5f97\u5b89\u5168\u4fdd\u969c\uff08\u7b2c\u4e8c\u5c42\uff09**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u5f00\u8bfe\u7b2c\u4e00\u5468\u6781\u81f4\u5b89\u629a+\u660e\u786e\u9000\u6b3e\u4fdd\u969c+\u5206\u914d\u8d85\u7b80\u5355\u4efb\u52a1\u5efa\u7acb\u5fae\u6210\u5c31\u611f**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"maslow_need\": \"\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\", \"risk_level\": \"\u6781\u9ad8\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
