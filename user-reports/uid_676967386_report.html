    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u66e6\u96ea\u98de\u98de (UID: 676967386) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-16 \u81f3 2026-04-03 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u76ae\u86cb\u4e0d\u5410\u76ae(\u5468\u598d) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u64ad\u6709\u58f0\u4e66\u6f14\u64ad\u8bfe\u7a0b (\u5df2\u8d2d\u8bfe)\uff0c\u5e76\u989d\u5916\u8d2d\u4e70\u4e86S2200\u9ea6\u514b\u98ce\u5957\u88c5 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u7528\u5361\u5468\u8f6c / \u8d44\u91d1\u7d27\u5f20** \u2014 \u7528\u6237\u660e\u786e\u8868\u793a\u201c\u4e00\u76f4\u5728\u82b1\u94b1\uff0c\u60f3\u65e9\u70b9\u63a5\u5355\u201d\uff0c\u4e14\u5bf9\u8bbe\u5907\u8d2d\u4e70\u72b9\u8c6b\uff08\u201c\u6ca1\u6709\u6536\u5165\uff0c\u5fc3\u91cc\u6709\u4e9b\u6ca1\u5e95\u201d\uff09\uff0c\u8868\u660e\u8d44\u91d1\u538b\u529b\u5927\uff0c\u975e\u5145\u88d5\u8d44\u91d1\u6295\u5165\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** \u2014 \u7528\u6237\u6709\u5168\u804c\u5de5\u4f5c\uff08\u201c\u65e9\u4e0a\u8981\u4e0a\u73ed\u201d\uff09\uff0c\u5b66\u4e60\u65f6\u95f4\u4f9d\u8d56\u665a\u4e0a\u548c\u4f11\u606f\u65e5\uff0c\u4f46\u80fd\u575a\u6301\u53c2\u4e0e\u8bfe\u7a0b\u548c\u6d3b\u52a8\uff0c\u65f6\u95f4\u7ba1\u7406\u5c1a\u53ef\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u4fe1\u606f\uff0c\u65e0\u6cd5\u5224\u65ad\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u8f83\u9971\u6ee1** \u2014 \u8bb0\u5f55\u8986\u76d6\u4e86\u5b66\u4e60\u3001\u8bbe\u5907\u8d2d\u4e70\u3001\u6280\u672f\u8c03\u8bd5\u3001\u6d3b\u52a8\u53c2\u4e0e\u3001\u60c5\u7eea\u6ce2\u52a8\u7b49\u591a\u4e2a\u7ef4\u5ea6\uff0c\u8db3\u4ee5\u8fdb\u884c\u6709\u6548\u5224\u65ad\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u77ed\u671f\u53d8\u73b0\u9a71\u52a8\u4e3a\u4e3b\uff0c\u6df7\u6742\u5b66\u4e60\u5174\u8da3**\u3002\u7528\u6237\u6838\u5fc3\u76ee\u6807\u662f\u201c\u4e2d\u4e66\u63a5\u5355\u201d\u8d5a\u94b1\uff0c\u5bf9\u5b66\u4e60\u5468\u671f\uff08\u201c\u5927\u6982\u591a\u4e45\u80fd\u4e2d\u4e66\u63a5\u5355\uff1f\u201d\uff09\u548c\u6295\u5165\u4ea7\u51fa\u6bd4\uff08\u201c\u4e00\u76f4\u5728\u82b1\u94b1\uff0c\u60f3\u65e9\u70b9\u63a5\u5355\u201d\uff09\u9ad8\u5ea6\u5173\u6ce8\uff0c\u4f46\u540c\u65f6\u4e5f\u8868\u73b0\u51fa\u5bf9\u8bfe\u7a0b\u5185\u5bb9\uff08\u201c\u542c\u8bfe\u90fd\u80fd\u7406\u89e3\u201d\uff09\u548c\u6280\u80fd\u63d0\u5347\uff08\u201c\u4f1a\u52aa\u529b\u7ec3\u4e60\u7684\u201d\uff09\u7684\u6295\u5165\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u73ed\u73ed\uff0c\u8fd9\u4e2a\u6708\u6211\u80fd\u4e2d\u4e66\u63a5\u5355\u5417\uff1f\u201d > \u201c\u4e00\u76f4\u5728\u82b1\u94b1\uff0c\u60f3\u65e9\u70b9\u63a5\u5355\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u5982\u4e0a\u6240\u8ff0\uff0c\u652f\u4ed8\u8bfe\u7a0b\u548c\u8bbe\u5907\u5df2\u663e\u538b\u529b\uff0c\u5bf9\u540e\u7eed\u6295\u5165\uff08\u5982\u62bd\u5956\u3001\u540e\u671f\u8bfe\uff09\u8868\u73b0\u51fa\u8c28\u614e\u548c\u653e\u5f03\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u6709\u5168\u804c\u5de5\u4f5c\uff0c\u4f46\u80fd\u5229\u7528\u788e\u7247\u65f6\u95f4\u8ddf\u8fdb\u8bfe\u7a0b\u3001\u53c2\u4e0e\u6d3b\u52a8\uff08\u5982\u201c\u6709\u58f0\u4e4b\u591c\u201d\u7ec4\u961f\uff09\uff0c\u5b66\u4e60\u610f\u613f\u5f3a\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u672a\u63d0\u53ca\uff0c\u6309\u6700\u77ed\u677f\u539f\u5219\uff0c**\u6b64\u7ef4\u5ea6\u4fe1\u606f\u7f3a\u5931\u6784\u6210\u91cd\u5927\u98ce\u9669\u9690\u60a3**\uff0c\u9700\u91cd\u70b9\u6392\u67e5\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b07\u4f4e\u6781\u5371]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u7528\u6237\u8868\u73b0\u51fa**\u4e25\u91cd\u7684\u81ea\u6211\u6000\u7591\u548c\u4e0d\u81ea\u4fe1**\uff08\u201c\u603b\u89c9\u5f97\u5fc3\u91cc\u6ca1\u5e95\u201d\u3001\u201c\u6015\u4e00\u76f4\u4e0d\u80fd\u63a5\u5355\u201d\uff09\uff0c\u4e14**\u5bf9\u632b\u6298\uff08\u8bd5\u97f3\u5931\u8d25\uff09\u53cd\u5e94\u6d88\u6781**\uff08\u201c[\u6d41\u6cea]\u201d\uff09\uff0c**\u6781\u5ea6\u4f9d\u8d56\u5916\u90e8\u80af\u5b9a\u548c\u5373\u65f6\u7ed3\u679c\u53cd\u9988**\u6765\u7ef4\u6301\u4fe1\u5fc3\u3002\u73ed\u4e3b\u4efb\u591a\u6b21\u5f3a\u8c03\u201c\u81ea\u4fe1\u201d\u95ee\u9898\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6015\u4e00\u76f4\u4e0d\u80fd\u63a5\u5355\uff0c\u7528\u4e0d\u4e86\u8bbe\u5907[\u6d41\u6cea]\u201d > \u201c\u73ed\u73ed\uff0c\u6211\u7684\u5206\u6210\u4e66\u8bd5\u97f3\u6ca1\u901a\u8fc7[\u6d41\u6cea]\u201d > \u201c\u542c\u8bfe\u90fd\u80fd\u7406\u89e3\uff0c\u81ea\u5df1\u505a\u5c31\u4e0d\u80fd\u900f\u5f7b\u505a\u5230\uff0c\u603b\u89c9\u5f97\u5fc3\u91cc\u6ca1\u5e95\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e / \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6df1\u5c42\u7684\u4e0d\u81ea\u4fe1\u4e0e\u4ef7\u503c\u611f\u7f3a\u5931**\u3002\u5979\u6025\u5207\u5bfb\u6c42\u201c\u4e2d\u4e66\u63a5\u5355\u201d\u4e0d\u4ec5\u662f\u4e3a\u4e86\u7ecf\u6d4e\u56de\u62a5\uff0c\u66f4\u662f\u4e3a\u4e86\u83b7\u5f97\u201c\u6211\u80fd\u884c\u201d\u7684**\u5916\u90e8\u8ba4\u53ef\u548c\u5c0a\u91cd**\uff0c\u4ee5\u5bf9\u6297\u5185\u5fc3\u7684\u81ea\u6211\u6000\u7591\u3002\u540c\u65f6\uff0c\u6301\u7eed\u7684\u91d1\u94b1\u6295\u5165\u5e26\u6765\u7684\u7ecf\u6d4e\u538b\u529b\uff0c\u4e5f\u89e6\u53d1\u4e86\u5bf9**\u672a\u6765\u6536\u5165\u4fdd\u969c\u7684\u7126\u8651**\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u3001\u5177\u4f53\u5316\u7684\u5938\u5956\u80af\u5b9a**\uff0c\u4ee5\u53ca**\u6e05\u6670\u3001\u53ef\u8fbe\u6210\u7684\u5c0f\u76ee\u6807\u8def\u5f84**\uff0c\u5e2e\u52a9\u5979\u5efa\u7acb\u201c\u8fc7\u7a0b\u6210\u5c31\u611f\u201d\uff0c\u800c\u975e\u4ec5\u4ec5\u805a\u7126\u4e8e\u201c\u63a5\u5355\u7ed3\u679c\u201d\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1 \u7c7b** \u2014 \u52a8\u673a\u4e2d\u7b49\u4f46\u5fc3\u7406\u5f39\u6027\u6781\u4f4e\uff0c\u8d44\u6e90\u5e95\u5ea7\u5b58\u5728\u77ed\u677f\uff08\u8d44\u91d1\u7d27\u5f20\uff09\uff0c\u5c5e\u4e8e\u9ad8\u7ef4\u62a4\u3001\u9ad8\u98ce\u9669\u7528\u6237\u3002 |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** \u2014 \u5178\u578b\u7279\u5f81\uff1a\u80fd\u529b\u7126\u8651\u3001\u7ed3\u679c\u5bfc\u5411\u3001\u60c5\u7eea\u6613\u6ce2\u52a8\u3001\u6781\u5ea6\u9700\u8981\u5916\u90e8\u60c5\u7eea\u5b89\u629a\u548c\u5373\u65f6\u6b63\u53cd\u9988\u3002 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5c5e\u5927\u5435\u7b49\u7ea2\u7ebf)\n- **\u89e6\u53d1\u56e0\u7531**\uff1aN/A\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u82e5\u5bb6\u4eba\u53cd\u5bf9\u5176\u6301\u7eed\u6295\u5165\uff0c\u98ce\u9669\u9661\u589e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u7528\u6237\u80fd\u575a\u6301\u4e0a\u8bfe\u3001\u770b\u56de\u653e\uff0c\u65f6\u95f4\u7ba1\u7406\u5c1a\u53ef\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u4e00\u65e6\u8fde\u7eed\u51e0\u6b21\u8bd5\u97f3\u5931\u8d25\u3001\u8bbe\u5907\u53cd\u590d\u51fa\u95ee\u9898\u3001\u6216\u770b\u5230\u540c\u671f\u5b66\u5458\u63a5\u5355\u800c\u81ea\u5df1\u6ca1\u6709\uff0c\u6781\u6613\u56e0\u81ea\u5c0a\u5fc3\u53d7\u632b\u800c\u60c5\u7eea\u5d29\u6e83\uff0c\u4ea7\u751f\u201c\u6211\u592a\u7b28\u4e86/\u5b66\u4e0d\u4f1a/\u88ab\u9a97\u4e86\u201d\u7684\u5ff5\u5934\uff0c\u8fdb\u800c\u8981\u6c42\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | \u5bf9\u201c\u63a5\u5355\u201d\u65f6\u95f4\u9884\u671f\u4e0d\u5207\u5b9e\u9645\uff08\u5e0c\u671b\u672c\u6708\u5185\uff09\uff0c\u82e5\u5b66\u4e60\u4e2d\u671f\uff08\u7b2c4-6\u5468\uff09\u4ecd\u672a\u770b\u5230\u63a5\u5355\u5e0c\u671b\uff0c\u4f1a\u4ea7\u751f\u5f3a\u70c8\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c4-6\u5468\uff08\u201c\u6b7b\u4ea1\u8c37\u201d\u9636\u6bb5\uff09**\u3002\u6b64\u65f6\u6280\u80fd\u5b66\u4e60\u8fdb\u5165\u74f6\u9888\u671f\uff0c\u8bd5\u97f3\u5931\u8d25\u53ef\u80fd\u589e\u591a\uff0c\u82e5\u540c\u671f\u6709\u5b66\u5458\u63a5\u5355\u800c\u5979\u672a\u4e2d\uff0c\u53e0\u52a0\u8bbe\u5907\u64cd\u4f5c\u632b\u6298\uff0c\u6781\u6613\u5f15\u53d1\u5168\u9762\u60c5\u7eea\u5d29\u6e83\u548c\u9000\u8d39\u8bc9\u6c42\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u66e6\u96ea\uff0c\u6211\u7279\u522b\u7406\u89e3\u4f60\u60f3\u5feb\u70b9\u63a5\u5355\u8bc1\u660e\u81ea\u5df1\u7684\u5fc3\u60c5\uff0c\u54b1\u4eec\u73ed\u5f88\u591a\u540c\u5b66\u90fd\u6709\u8fd9\u4e2a\u9636\u6bb5\u3002\u4f46\u6211\u60f3\u8ddf\u4f60\u8bf4\uff0c**\u6709\u58f0\u6f14\u64ad\u5c31\u50cf\u5b66\u6e38\u6cf3\uff0c\u6709\u4eba\u4e09\u8282\u8bfe\u80fd\u6f02\u8d77\u6765\uff0c\u6709\u4eba\u9700\u8981\u5341\u8282\u8bfe\uff0c\u4f46\u6700\u7ec8\u90fd\u80fd\u5b66\u4f1a\u6e38\u5f97\u5f88\u597d\u3002\u4f60\u7684\u58f0\u97f3\u6761\u4ef6\u5f88\u597d\uff08\u5c11\u5973\u97f3\uff09\uff0c\u6211\u4eec\u73b0\u5728\u8981\u505a\u7684\u4e0d\u662f\u548c\u522b\u4eba\u6bd4\u8c01\u5148\u2018\u4e0b\u6c34\u2019\uff0c\u800c\u662f\u628a\u6bcf\u4e00\u4e2a\u6362\u6c14\u3001\u6bcf\u4e00\u4e2a\u52a8\u4f5c\u7ec3\u624e\u5b9e\u3002\u6211\u4f1a\u4e00\u76f4\u966a\u7740\u4f60\uff0c\u54b1\u4eec\u4e0d\u7740\u6025\uff0c\u6bcf\u4e00\u6b65\u8d70\u7a33\u4e86\uff0c\u7ed3\u679c\u81ea\u7136\u5c31\u6765\u4e86\u3002**\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf**\u3011\u3002\u6838\u5fc3\u76ee\u6807\u662f\u7a33\u5b9a\u60c5\u7eea\u3001\u5efa\u7acb\u81ea\u4fe1\uff0c\u800c\u975e\u5f3a\u63a8\u786c\u6838\u6280\u80fd\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n    1. **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\uff1a\u6bcf\u65e5\u79c1\u4fe1\u6253\u5361\u9f13\u52b1\uff0c\u4f5c\u4e1a\u70b9\u8bc4\u4ee5\u201c\u53d1\u73b0\u95ea\u5149\u70b9\u201d\u4e3a\u4e3b\uff0c\u907f\u514d\u76f4\u63a5\u3001\u4e25\u5389\u7684\u6279\u8bc4\u3002\n    2. **\u3010\u5fae\u578b\u6210\u5c31\u4f53\u7cfb\u3011**\uff1a\u4e3a\u5176\u8bbe\u7acb\u975e\u63a5\u5355\u7c7b\u7684\u5c0f\u76ee\u6807\u5e76\u9881\u53d1\u865a\u62df\u52cb\u7ae0\uff08\u5982\u201cAU\u64cd\u4f5c\u5c0f\u80fd\u624b\u201d\u3001\u201c\u575a\u6301\u5168\u52e4\u5956\u201d\uff09\u3002\n    3. **\u3010\u8f7b\u91cf\u793e\u4ea4\u8fde\u63a5\u3011**\uff1a\u9f13\u52b1\u5176\u53c2\u4e0e\u201c\u6709\u58f0\u4e4b\u591c\u201d\u7b49\u56e2\u961f\u6d3b\u52a8\uff08\u5df2\u8868\u73b0\u51fa\u5174\u8da3\uff09\uff0c\u5728\u5c0f\u7ec4\u4e2d\u83b7\u5f97\u5f52\u5c5e\u611f\u548c\u652f\u6301\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u5979\u65bd\u538b\u6216\u5e03\u7f6e\u8fc7\u9ad8\u96be\u5ea6\u4f5c\u4e1a**\uff0c\u907f\u514d\u589e\u52a0\u5176\u632b\u8d25\u611f\u3002\n    2. **\u7edd\u4e0d\u8981\u7528\u201c\u522b\u4eba\u90fd\u4e2d\u4e86\u201d\u6765\u6fc0\u52b1\u5979**\uff0c\u8fd9\u4f1a\u76f4\u63a5\u5f15\u7206\u5176\u7126\u8651\u548c\u81ea\u5351\u3002\n    3. **\u907f\u514d\u7a7a\u6d1e\u7684\u201c\u52a0\u6cb9\u201d\uff0c\u8981\u7ed9\u4e88\u5177\u4f53\u3001\u5fae\u5c0f\u7684\u8fdb\u6b65\u80af\u5b9a**\uff08\u5982\u201c\u4eca\u5929\u8fd9\u4e2a\u513f\u5316\u97f3\u6bd4\u4e0a\u6b21\u81ea\u7136\u591a\u4e86\uff01\u201d\uff09\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5347\u5355**\u3002\u5728\u7528\u6237\u5efa\u7acb\u7a33\u5b9a\u81ea\u4fe1\u548c\u83b7\u5f97\u521d\u6b65\u6b63\u53cd\u9988\uff08\u5982\u4e00\u6b21\u5c0f\u6210\u529f\uff09\u524d\uff0c\u4efb\u4f55\u989d\u5916\u7684\u4ed8\u8d39\u5efa\u8bae\u90fd\u4f1a\u88ab\u89c6\u4e3a\u201c\u5272\u97ed\u83dc\u201d\uff0c\u6781\u6613\u5bfc\u81f4\u4fe1\u4efb\u5d29\u584c\u548c\u9000\u8d39\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u73ed\u73ed\uff0c\u6211\u7684\u662f\u5c5e\u4e8e\u4ec0\u4e48\u97f3\uff1f\u201d (\u5bfb\u6c42\u5916\u90e8\u6807\u7b7e\u548c\u8ba4\u53ef)\n2. > \u201c\u6015\u4e00\u76f4\u4e0d\u80fd\u63a5\u5355\uff0c\u7528\u4e0d\u4e86\u8bbe\u5907[\u6d41\u6cea]\u201d (\u5c06\u8bbe\u5907\u4ef7\u503c\u4e0e\u63a5\u5355\u7ed3\u679c\u5f3a\u7ed1\u5b9a\uff0c\u66b4\u9732\u7126\u8651\u548c\u60b2\u89c2)\n3. > \u201c\u542c\u8bfe\u90fd\u80fd\u7406\u89e3\uff0c\u81ea\u5df1\u505a\u5c31\u4e0d\u80fd\u900f\u5f7b\u505a\u5230\uff0c\u603b\u89c9\u5f97\u5fc3\u91cc\u6ca1\u5e95\u201d (\u5178\u578b\u7684\u80fd\u529b\u7126\u8651\u548c\u81ea\u6211\u6000\u7591)\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6 \u60c5\u7eea\u5de8\u5a74\u578b**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u5c0a\u91cd\u8ba4\u53ef\u548c\u5bf9\u6297\u7ecf\u6d4e\u7126\u8651**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u6781\u81f4\u60c5\u7eea\u4ef7\u503c\uff0c\u7528\u201c\u7597\u6108\u966a\u4f34\u7ebf\u201d\u66ff\u4ee3\u201c\u786c\u6838\u6210\u957f\u7ebf\u201d\uff0c\u4e25\u9632\u5728\u7b2c\u56db\u5468\u201c\u6b7b\u4ea1\u8c37\u201d\u56e0\u8bd5\u97f3\u5931\u8d25\u6216\u5bf9\u6bd4\u540c\u5b66\u800c\u5fc3\u6001\u5d29\u6e83**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"maslow_need\": \"\u5c0a\u91cd/\u5b89\u5168\", \"risk_level\": \"\u6781\u9ad8\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
        document.getElementById('content').innerHTML = marked.parse(markdownText);
