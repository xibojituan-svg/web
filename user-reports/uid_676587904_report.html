        const markdownText = "# \ud83d\udd0d \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676587904 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-12 \u81f3 2026-01-14 |\n| **\u5bf9\u8bdd\u5bf9\u8c61** | \u9500\u552e/\u73ed\u4e3b\u4efb (\u5f20\u8317/\u674e\u6167) |\n| **\u8d2d\u4e70\u4ea7\u54c1** | \u672a\u77e5 (\u63a8\u6d4b\u4e3a\u6709\u58f0\u4e66/\u540e\u671f\u5236\u4f5c\u7c7b\u8bfe\u7a0b) |\n| **\u652f\u4ed8\u65b9\u5f0f** | \u672a\u77e5 |\n| **\u5de5\u4f5c\u5236\u5ea6** | \u672a\u77e5 (\u63a8\u6d4b\u4e3a\u5b9d\u5988/\u6709\u5b69\u5b50) |\n| **\u5bb6\u5ead\u51b3\u7b56\u6743** | \u672a\u77e5 (\u63d0\u53ca\u201c\u8001\u516c\u201d\uff0c\u4f46\u672a\u660e\u786e\u77e5\u60c5\u652f\u6301\u60c5\u51b5) |\n| **\u6210\u4ea4\u573a\u666f** | \u672a\u77e5 (\u8bb0\u5f55\u4e3a\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u7684\u4e92\u52a8) |\n| **\u9000\u8d39\u5386\u53f2** | \u672a\u77e5 |\n| **\u4fe1\u606f\u5b8c\u6574\u5ea6** | **\u4e25\u91cd\u4e0d\u8db3** (\u5173\u952e\u4fe1\u606f\u7f3a\u5931) |\n\n---\n\n## \u4e8c\u3001\u8f6c\u5316\u524d\u5fc5\u95ee\u4e09\u95ee\u6838\u9a8c\n\n> \u5f15\u64ce\u89c4\u5b9a\uff1a\u73ed\u4e3b\u4efb\u5728\u8f6c\u5316\u524d\u5fc5\u987b\u6838\u9a8c\u4ee5\u4e0b\u4e09\u95ee\uff0c\u6b64\u5904\u5ba1\u67e5\u804a\u5929\u4e2d\u662f\u5426\u51fa\u73b0\u76f8\u5173\u4fe1\u606f\u3002\n\n| \u5fc5\u95ee\u95ee\u9898 | \u662f\u5426\u5df2\u6838\u9a8c | \u7528\u6237\u56de\u7b54\u6458\u8981 | \u98ce\u9669\u4fe1\u53f7 |\n|---|---|---|---|\n| Q1 \u5bb6\u5ead\u6838\u67e5\uff1a\"\u5bb6\u91cc\u4eba\u77e5\u9053\u5417\uff1f\u652f\u6301\u5417\uff1f\" | **\u672a\u6838\u9a8c** | > \u65e0\u76f8\u5173\u4fe1\u606f | \u9ad8\u98ce\u9669 (\u5173\u952e\u4fe1\u606f\u7f3a\u5931) |\n| Q2 \u65f6\u95f4\u6838\u67e5\uff1a\"\u665a\u4e0a\u51e0\u70b9\u6709\u7a7a\uff1f\u56fa\u5b9a\u73ed\u8fd8\u662f\u5012\u73ed\uff1f\" | **\u672a\u6838\u9a8c** | > \u65e0\u76f8\u5173\u4fe1\u606f | \u9ad8\u98ce\u9669 (\u5173\u952e\u4fe1\u606f\u7f3a\u5931) |\n| Q3 \u8d44\u91d1\u6838\u67e5\uff1a\"\u81ea\u5df1\u7684\u94b1\u8fd8\u662f\u82b1\u5457/\u4fe1\u7528\u5361\u5206\u671f\uff1f\" | **\u672a\u6838\u9a8c** | > \u65e0\u76f8\u5173\u4fe1\u606f | \u9ad8\u98ce\u9669 (\u5173\u952e\u4fe1\u606f\u7f3a\u5931) |\n\n\u26a0\ufe0f **\u672a\u6838\u9a8c\u9879 = \u76f2\u533a**\uff1a\u73ed\u4e3b\u4efb\u672a\u5728\u804a\u5929\u4e2d\u4e3b\u52a8\u8be2\u95ee\u4e0a\u8ff0\u4efb\u4f55\u95ee\u9898\uff0c**\u6240\u6709\u7ef4\u5ea6\u7684\u5224\u65ad\u7f6e\u4fe1\u5ea6\u81ea\u52a8\u964d\u4f4e\u4e00\u7ea7**\u3002\u7528\u6237\u72b6\u6001\u5904\u4e8e\u9ad8\u98ce\u9669\u672a\u77e5\u533a\u3002\n\n---\n\n## \u4e09\u3001\u4e09\u8f74\u8bc4\u7ea7\n\n### \u8f741\uff1a\u52a8\u673a\u7eaf\u5ea6 \u2192 \u2b06\u9ad8\n\n| \u4fe1\u53f7 | \u8bc1\u636e\u6458\u5f55 |\n|---|---|\n| \u7b2c\u4e00\u53e5\u8bdd\u7684\u95ee\u9898\u5c42\u6b21 | > \u201c\u8fd9\u4e2a\u662f\u4e0d\u662f\u7b80\u4ecb\u4e5f\u5f88\u91cd\u8981\u5416\u201d (\u5173\u6ce8\u5185\u5bb9\u8d28\u91cf) |\n| \u53d8\u73b0\u9884\u671f\u65f6\u95f4\u7ebf | \u672a\u63d0\u53ca\u77ed\u671f\u53d8\u73b0\uff0c\u5173\u6ce8\u5b66\u4e60\u8fc7\u7a0b |\n| \u5bf9\u786e\u5b9a\u6027\u7684\u4f9d\u8d56 | \u672a\u8981\u6c42\u4fdd\u5e95\u627f\u8bfa\uff0c\u63a5\u53d7\u5b66\u4e60\u4e2d\u7684\u56f0\u96be (\u201c\u611f\u89c9\u6211\u8981\u8ddf\u4e0d\u4e0a\u4f60\u4eec\u7684\u8282\u594f\u4e86\u201d) |\n| \u5174\u8da3\u9a71\u52a8\u7a0b\u5ea6 | **\u5185\u5728\u5174\u8da3\u9a71\u52a8** \u2014 \u201c\u6211\u5bf9\u5b66\u540e\u671f\u53c8\u591a\u4e86\u4e00\u4efd\u4fe1\u5fc3\u201d |\n\n**\u5224\u5b9a\u4f9d\u636e**\uff1a\u7528\u6237\u5173\u6ce8\u5b66\u4e60\u5185\u5bb9\u672c\u8eab\u3001\u6280\u672f\u7ec6\u8282\uff08\u63d2\u4ef6\u5b89\u88c5\u3001\u97f3\u6548\uff09\u3001\u793e\u7fa4\u4e92\u52a8\uff0c\u8868\u73b0\u51fa\u5bf9\u6280\u80fd\u63d0\u5347\u7684\u5185\u5728\u5174\u8da3\uff0c\u800c\u975e\u77ed\u671f\u53d8\u73b0\u538b\u529b\u3002\n\n### \u8f742\uff1a\u8d44\u6e90\u5e95\u5ea7 \u2192 \u27a1\u4e2d (\u4fe1\u606f\u4e0d\u8db3\uff0c\u77ed\u677f\u63a8\u6d4b\u4e3a\u65f6\u95f4)\n\n| \u5b50\u7ef4\u5ea6 | \u8bc4\u7ea7 | \u5b9e\u8bc1\u91cf\u5316\u951a\u70b9 | \u8bc1\u636e\u6458\u5f55 |\n|---|---|---|---|\n| \ud83d\udcb0 \u8d44\u91d1 | **\u4e2d (\u63a8\u6d4b)** | \u4e3b\u52a8\u63d0\u53ca\u4e3a\u5b66\u4e60\u8d2d\u4e70\u767e\u5ea6\u7f51\u76d8\u4f1a\u5458 (36\u5143/\u4e24\u4e2a\u6708)\uff0c\u6709\u81ea\u4e3b\u6d88\u8d39\u51b3\u7b56\u80fd\u529b\u3002 | > \u201c\u6211\u5165\u4f1a\u5458\u56e0\u4e3a\u5b58\u5b69\u5b50\u7167\u7247\u89c6\u9891\u5565\u7684\u201d |\n| \u23f1 \u65f6\u95f4 | **\u4f4e (\u63a8\u6d4b)** | **\u5b9d\u5988 (\u5b69\u5b50\u5e74\u9f84\u672a\u77e5)**\uff0c\u5b66\u4e60\u65f6\u95f4\u4f9d\u8d56\u5b69\u5b50\u4f5c\u606f (\u201c\u6211\u5c31\u5b69\u5b50\u7761\u7740\u4e86\u624d\u884c\u201d)\uff0c\u5b58\u5728\u788e\u7247\u5316\u3001\u4e0d\u7a33\u5b9a\u7684\u98ce\u9669\u3002 | > \u201c\u6211\u665a\u4e0a\u8001\u5e08\u70b9\u8bc4\u201d <br> > \u201c\u6211\u5c31\u5b69\u5b50\u7761\u7740\u4e86\u624d\u884c\u201d <br> > \u201c\u6211\u5bb6\u9192\u7740\u5c31\u627e\u6211\u201d |\n| \ud83e\udde0 \u7cbe\u529b | **\u4e2d** | \u5b66\u4e60\u6001\u5ea6\u79ef\u6781\uff0c\u4e3b\u52a8\u53c2\u4e0e\u5b89\u88c5\u3001\u8ba8\u8bba\uff0c\u4f46\u81ea\u8ff0\u7535\u8111\u4e0d\u7ed9\u529b\u3001\u7f51\u7edc\u6162\u3001\u591a\u5e74\u672a\u7528\u7535\u8111\uff0c\u5b58\u5728\u64cd\u4f5c\u969c\u788d\u3002 | > \u201c\u611f\u89c9\u6211\u8981\u8ddf\u4e0d\u4e0a\u4f60\u4eec\u7684\u8282\u594f\u4e86\u201d <br> > \u201c\u6211\u81ea\u5df1\u8fd9\u7535\u8111\u4e5f\u662f\u4e0d\u600e\u4e48\u7ed9\u529b\u201d <br> > \u201c\u6211\u8fd9\u4e5f\u662f\u6162\u6162\u6478\u7d22\uff0c\u597d\u591a\u5e74\u6ca1\u7528\u7535\u8111\u4e86\u201d |\n| \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u51b3\u7b56\u6743 | **\u672a\u77e5** | \u63d0\u53ca\u201c\u8001\u516c\u201d\uff0c\u4f46\u672a\u660e\u786e\u662f\u5426\u77e5\u60c5\u652f\u6301\u3002 | > \u201c\u6211\u8001\u516c\u5403\u4e86\u4e00\u6b21\uff0c\u8bf4\u597d\u5403\u201d |\n\n\u26a1 **\u5e95\u5ea7\u53d6\u77ed\u677f** \u2192 \u6700\u7ec8\u8bc4\u7ea7 = **\u4e2d**\uff08\u77ed\u677f\u7ef4\u5ea6\uff1a**\u65f6\u95f4** - \u5b9d\u5988\u8eab\u4efd\uff0c\u5b66\u4e60\u65f6\u95f4\u4e0d\u786e\u5b9a\u6027\u5f3a\uff09\n\n> \u26a0\ufe0f \u8d44\u6e90\u5e95\u5ea7 = min(\u8d44\u91d1, \u65f6\u95f4, \u7cbe\u529b, \u5bb6\u5ead\u51b3\u7b56\u6743)\u3002**\u5b9d\u5988\u7684\u65f6\u95f4\u81ea\u8ff0\u201c\u5b69\u5b50\u7761\u7740\u540e\u201d\u4e0d\u7b49\u4e8e\u7a33\u5b9a\u53ef\u7528\u65f6\u95f4**\uff0c\u4e14\u5bb6\u5ead\u51b3\u7b56\u6743\u672a\u77e5\uff0c\u6784\u6210\u91cd\u5927\u98ce\u9669\u76f2\u533a\u3002\n\n### \u8f743\uff1a\u5fc3\u7406\u5f39\u6027 \u2192 \u2b06\u9ad8\n\n| \u4fe1\u53f7 | \u8bc1\u636e\u6458\u5f55 |\n|---|---|\n| \u9047\u5230\u95ee\u9898\u65f6\u7684\u7b2c\u4e00\u53cd\u5e94 | > **\u81ea\u6211\u5f52\u56e0/\u79ef\u6781\u89e3\u51b3** \u2014 \u201c\u6211\u5bb6\u4eca\u5929\u7f51\u7edc\u4e0d\u7ed9\u529b[\u6342\u8138]\u4e0d\u7136\u65e9\u5c31\u5b8c\u4e8b\u4e86\u201d |\n| \u51b3\u7b56\u72ec\u7acb\u6027 | \u4e3b\u52a8\u7ec4\u7ec7\u793e\u7fa4\u6d3b\u52a8\u3001\u534f\u8c03\u65f6\u95f4\uff0c\u8868\u73b0\u51fa\u8f83\u5f3a\u7684\u81ea\u4e3b\u6027\u3002 |\n| \u9996\u6b21\u9047\u963b\u65f6\u53cd\u5e94 | \u9047\u5230\u5b89\u88c5\u56f0\u96be\u65f6\uff0c\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff08\u8d2d\u4e70\u4f1a\u5458\u52a0\u901f\uff09\uff0c\u5e76\u9f13\u52b1\u4ed6\u4eba\u3002 |\n| \u7ade\u54c1\u7ecf\u5386 | \u672a\u63d0\u53ca |\n| \u670d\u52a1\u4f9d\u8d56\u5ea6 | **\u72ec\u7acb\u89e3\u51b3/\u793e\u7fa4\u4e92\u52a9** \u2014 \u4e3b\u52a8\u5728\u7fa4\u5185\u89e3\u7b54\u540c\u5b66\u7591\u95ee\uff0c\u5e2e\u52a9\u5b89\u88c5\u6d41\u7a0b\u3002 |\n\n**\u5224\u5b9a\u4f9d\u636e**\uff1a\u7528\u6237\u5fc3\u6001\u79ef\u6781\uff0c\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u7f51\u7edc\u6162\u3001\u5b89\u88c5\u5361\u987f\uff09\u65f6\u80fd\u81ea\u6211\u8c03\u4f83\u5e76\u79ef\u6781\u89e3\u51b3\uff0c\u4e3b\u52a8\u5728\u793e\u7fa4\u4e2d\u63d0\u4f9b\u5e2e\u52a9\uff0c\u8868\u73b0\u51fa\u9ad8\u5fc3\u7406\u5f39\u6027\u3002\n\n---\n\n## \u56db\u3001\u5206\u5c42\u5224\u5b9a\u7ed3\u679c\n\n### \u5224\u5b9a\u6811\u6267\u884c\u8def\u5f84\n\n```\n\u6b65\u9aa40\uff1a\u652f\u4ed8\u6765\u6e90\u524d\u7f6e\u6838\u67e5 \u2192 [\u4fe1\u606f\u7f3a\u5931]\n\u6b65\u9aa41\uff1aD\u7c7b\u7194\u65ad\u68c0\u67e5 \u2192 [\u672a\u89e6\u53d1] (\u672a\u53d1\u73b0\u501f\u8d37\u3001\u751f\u5b58\u5371\u673a\u3001\u5065\u5eb7\u95ee\u9898\u7b49\u4fe1\u53f7)\n\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5 \u2192 [\u26a0\ufe0f\u5bb6\u4eba\u4e0d\u77e5\u60c5\u2192\u964dC2\u9884\u8b66] (\u5173\u952e\u4fe1\u606f\u7f3a\u5931\uff0c\u6309\u6700\u574f\u60c5\u51b5\u5047\u8bbe)\n\u6b65\u9aa42\uff1a\u9700\u6c42\u771f\u5b9e\u5ea6\u68c0\u67e5 \u2192 [\u52a8\u673a\u9ad8\u2192\u7ee7\u7eed]\n\u6b65\u9aa43\uff1aC1\u8bc6\u522b \u2192 [\u5174\u8da3/\u793e\u4ea4\u9a71\u52a8+\u8d44\u6e90\u4e2d+\u5f39\u6027\u9ad8\u2192C1\u7ec8\u6b62] \u2705\n\u6b65\u9aa44\uff1aAB\u533a\u5206 \u2192 [\u8df3\u8fc7\uff0c\u5df2\u5f52\u5165C1]\n\u6b65\u9aa45\uff1a\u4fee\u6b63\u56e0\u5b50 \u2192 [\u5b9d\u5988\u8eab\u4efd\u2192\u65f6\u95f4\u7ef4\u5ea6\u98ce\u9669\u9884\u8b66]\n```\n\n### \u6700\u7ec8\u7ed3\u8bba\n\n| \u9879\u76ee | \u7ed3\u679c |\n|---|---|\n| **ABCD \u5206\u5c42** | **\ud83d\udfeaC1\u7c7b (\u60c5\u7eea\u6d88\u8d39\u578b)** \u2014 \u5174\u8da3\u9a71\u52a8\u3001\u793e\u4ea4\u53c2\u4e0e\u5ea6\u9ad8\u3001\u8d44\u6e90\u5e95\u5ea7\u4e2d\u7b49\u4f46\u6709\u65f6\u95f4\u98ce\u9669\u3002 |\n| **\u7528\u6237\u539f\u578b** | **T1 \ud83c\udf96\ufe0f \u793e\u533a\u5efa\u9020\u8005** \u2014 \u4fe1\u606f\u4e0d\u8db3\u65e0\u6cd5\u5b8c\u5168\u5224\u5b9a\uff0c\u4f46\u8868\u73b0\u51fa\u5f3a\u70c8\u503e\u5411\u3002 |\n| **\u7efc\u5408\u7f6e\u4fe1\u5ea6** | **\u4e2d (\u5173\u952e\u4fe1\u606f\u7f3a\u5931)** \u2014 \u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u652f\u4ed8\u65b9\u5f0f\u3001\u5de5\u4f5c\u5236\u5ea6\u5b8c\u5168\u672a\u77e5\u3002 |\n\n### \u539f\u578b\u5339\u914d\u4f9d\u636e\n\n| \u539f\u578b | \u540d\u79f0 | \u662f\u5426\u547d\u4e2d | \u5339\u914d\u8bc1\u636e |\n|---|---|---|---|\n| T1 | \ud83c\udf96\ufe0f \u793e\u533a\u5efa\u9020\u8005 | **\u662f** | \u4e3b\u52a8\u5728\u7fa4\u5185\u7ec4\u7ec7\u6d3b\u52a8 (\u201c\u54b1\u4eec\u8fd9\u4e24\u5929\u53ef\u4ee5\u770b\u770b\u7b26\u5408\u89d2\u8272\u7684\u7535\u89c6\u5267\u201d)\u3001\u534f\u8c03\u65f6\u95f4 (\u201c\u627e\u4e2a\u665a\u4e0a\u7684\u65f6\u95f4\u201d)\u3001\u89e3\u7b54\u540c\u5b66\u7591\u95ee (\u201c\u4f60\u5f97\u5148\u5b89\u88c5\u4e09\u4ef6\u5957\u7684\u5b89\u88c5\u5305\u201d)\u3002 |\n| T2 | \ud83d\udee0\ufe0f \u5e55\u540e\u627f\u91cd\u8005 | \u5426 | \u672a\u4f53\u73b0 |\n| T3 | \ud83d\udcda \u6280\u672f\u94bb\u7814\u8005 | \u5426 | \u672a\u4f53\u73b0 |\n| T4 | \ud83d\udcdd \u52a1\u5b9e\u53d8\u73b0\u8005 | \u5426 | \u672a\u63d0\u53ca\u53d8\u73b0 |\n| T5 | \ud83c\udf31 \u8bd5\u6c34\u63a2\u7d22\u8005 | \u5426 | \u7528\u6237\u8868\u73b0\u6210\u719f\uff0c\u975e\u4f4e\u9f84\u63a2\u7d22 |\n| T6 | \ud83d\ude1f \u9ad8\u7126\u8651\u4ece\u4f17\u8005 | \u5426 | \u5fc3\u6001\u79ef\u6781\uff0c\u975e\u7126\u8651\u578b |\n| T7 | \ud83d\udd04 \u590d\u8d2d\u751f\u6001\u578b | \u5426 | \u4fe1\u606f\u4e0d\u8db3 |\n| T8 | \ud83d\udd70\ufe0f \u4e34\u754c\u89c2\u671b\u8005 | \u5426 | \u53c2\u4e0e\u5ea6\u6781\u9ad8 |\n| \u9000\u8d39\u578b | \ud83d\udea8 \u4ea7\u54c1\u9519\u914d\u578b | \u5426 | \u672a\u4f53\u73b0 |\n\n**\u6700\u7ec8\u539f\u578b** \u2192 **T1 \ud83c\udf96\ufe0f \u793e\u533a\u5efa\u9020\u8005 (\u503e\u5411)**\uff0c\u7406\u7531\uff1a\u5728\u6709\u9650\u7684\u804a\u5929\u8bb0\u5f55\u4e2d\uff0c\u7528\u6237\u8868\u73b0\u51fa\u6781\u5f3a\u7684\u793e\u7fa4\u7ec4\u7ec7\u3001\u4e92\u52a9\u548c\u9886\u5bfc\u610f\u613f\uff0c\u4e3b\u52a8\u63a8\u52a8\u5b66\u4e60\u8fdb\u7a0b\u548c\u5c0f\u7ec4\u534f\u4f5c\u3002\n\n---\n\n## \u4e94\u3001\u9000\u8d39\u6295\u8bc9\u98ce\u9669\u4e13\u9879\u8bc4\u4f30\n\n### \u98ce\u9669\u7b49\u7ea7\uff1a\ud83d\udfe0\u4e2d\n\n### \u9000\u8d39\u6839\u56e0\u9884\u5224\n\n| \u9000\u8d39\u6839\u56e0\u7c7b\u578b | \u547d\u4e2d\u5224\u65ad | \u8bc1\u636e |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b\uff08\u914d\u5076/\u7236\u6bcd\u53cd\u5bf9\uff0c\u5360\u9000\u8d3925%\uff09 | **\u9ad8\u98ce\u9669 (\u4fe1\u606f\u7f3a\u5931)** | \u5bb6\u5ead\u51b3\u7b56\u6743\u672a\u77e5\uff0c\u662f\u6700\u5927\u98ce\u9669\u70b9\u3002 |\n| \u65f6\u95f4\u7ed3\u6784\u5d29\u6e83\u578b\uff08\u5012\u73ed/\u62a4\u5de5/\u65e0\u6cd5\u53c2\u52a0\uff0c\u536021%\uff09 | **\u4e2d\u98ce\u9669** | \u5b9d\u5988\u8eab\u4efd\uff0c\u5b66\u4e60\u65f6\u95f4\u4f9d\u8d56\u5b69\u5b50\u4f5c\u606f\uff0c\u5b58\u5728\u4e0d\u786e\u5b9a\u6027\u3002 |\n| \u501f\u8d37\u4ed8\u6b3e\u540e\u7ecf\u6d4e\u5d29\u6e83\u578b\uff08\u536015%\uff09 | \u4e0d\u786e\u5b9a | \u652f\u4ed8\u65b9\u5f0f\u672a\u77e5\u3002 |\n| \u8eab\u4f53/\u5065\u5eb7\u95ee\u9898\u578b\uff08\u536013%\uff09 | \u5426 | \u672a\u63d0\u53ca\u3002 |\n| \u51b2\u52a8\u6d88\u8d39\u51b7\u9759\u671f\u6094\u5355\u578b\uff08\u536010%\uff09 | \u4f4e | \u7528\u6237\u5df2\u8fdb\u5165\u5b66\u4e60\u9636\u6bb5\uff0c\u53c2\u4e0e\u5ea6\u9ad8\uff0c\u975e\u51b2\u52a8\u578b\u3002 |\n| \u5185\u5bb9/\u9884\u671f\u843d\u5dee\u578b\uff08\u53607%\uff09 | \u4f4e | \u7528\u6237\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u8868\u73b0\u51fa\u5174\u8da3\u548c\u4fe1\u5fc3\u3002 |\n| \u6570\u5b57\u5316\u64cd\u4f5c\u80fd\u529b\u4e0d\u8db3\u578b\uff08\u53605%\uff09 | **\u4e2d\u98ce\u9669** | \u81ea\u8ff0\u201c\u7535\u8111\u4e0d\u7ed9\u529b\u201d\u3001\u201c\u597d\u591a\u5e74\u6ca1\u7528\u7535\u8111\u4e86\u201d\uff0c\u5b58\u5728\u64cd\u4f5c\u969c\u788d\u3002 |\n\n### \u9000\u8d39\u65f6\u95f4\u7a97\u9884\u6d4b\n\n- **\u9ad8\u5371\u7a97\u53e3**\uff1a**\u9996\u6708\u5185** (\u82e5\u5bb6\u5ead\u53cd\u5bf9\u7206\u53d1\u6216\u65f6\u95f4\u65e0\u6cd5\u534f\u8c03)\n- **\u9884\u5224\u7406\u7531**\uff1a\u6700\u5927\u7684\u98ce\u9669\u6765\u81ea\u672a\u77e5\u7684\u5bb6\u5ead\u652f\u6301\u5ea6\u548c\u4e0d\u7a33\u5b9a\u7684\u5b9d\u5988\u5b66\u4e60\u65f6\u95f4\u3002\u4e00\u65e6\u5bb6\u5ead\u963b\u529b\u51fa\u73b0\u6216\u5b9e\u9645\u5b66\u4e60\u65f6\u95f4\u65e0\u6cd5\u4fdd\u969c\uff0c\u53ef\u80fd\u5728\u8bfe\u7a0b\u538b\u529b\u589e\u5927\u65f6\uff08\u9996\u6708\uff09\u9009\u62e9\u9000\u51fa\u3002\n\n### \u6295\u8bc9\u5347\u7ea7\u98ce\u9669\n\n- **\u6295\u8bc9\u53ef\u80fd\u6027**\uff1a\u4e2d\n- **\u4e3b\u8981\u89e6\u53d1\u70b9**\uff1a**\u5bb6\u5ead\u77db\u76fe** (\u82e5\u62a5\u540d\u65f6\u5bb6\u4eba\u4e0d\u77e5\u60c5) \u6216 **\u65f6\u95f4\u65e0\u6cd5\u534f\u8c03** \u5bfc\u81f4\u8bfe\u7a0b\u65e0\u6cd5\u8ddf\u8fdb\uff0c\u4ea7\u751f\u632b\u8d25\u611f\u3002\n\n---\n\n## \u516d\u3001\u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n\n### \u4f26\u7406\u9632\u7ebf\u89e6\u53d1\u72b6\u6001\uff08\u5341\u6761\uff0c\u9010\u6761\u68c0\u67e5\uff09\n\n| \u9632\u7ebf\u7f16\u53f7 | \u9632\u7ebf\u540d\u79f0 | \u72b6\u6001 |\n|---|---|---|\n| \u2460 | \u65f6\u95f4\u7834\u4ea7\uff08\u6559\u5506\u6302\u673a\u51fa\u52e4\uff09 | \u2705\u672a\u89e6\u53d1 |\n| \u2461 | \u6bd2\u9e21\u6c64PUA\uff08\u6311\u62e8\u5bb6\u5ead\u8bdd\u672f\uff09 | \u2705\u672a\u89e6\u53d1 |\n| \u2462 | \u5e95\u5c42\u5d29\u584c\uff08\u91cd\u75be/\u4e27\u4eb2/\u6324\u538b\u53e3\u7cae\uff09 | \u2705\u672a\u89e6\u53d1 |\n| \u2463 | \u9ad8\u77e5\u9519\u6295\uff08\u5bf9\u9ad8\u7406\u667a\u7528\u6237\u4f7f\u7528\u4e0b\u6c89\u60c5\u611fPUA\u8bdd\u672f\uff09 | \u2705\u672a\u89e6\u53d1 |\n| \u2464 | \u4ee3\u9645\u65ad\u5976\uff08\u4f4e\u9f84\u4f9d\u8d56\u7236\u8f88\uff09 | \u2705\u672a\u89e6\u53d1 |\n| \u2465 | \u94f6\u53d1\u65cf\u64cd\u4f5c\u65ad\u5c42\uff08>65\u5c81+\u590d\u6742\u8f6f\u4ef6\u8bfe\u7a0b\uff09 | \u2705\u672a\u89e6\u53d1 |\n| \u2466 | AI\u5c65\u7ea6\u9020\u5047\uff08AI\u4ee3\u66ff\u771f\u4eba\u8f85\u5bfc\u672a\u544a\u77e5\u7528\u6237\uff09 | \u2705\u672a\u89e6\u53d1 |\n| \u2467 | **\u5bb6\u5ead\u8d44\u91d1\u9690\u7792\uff08\u80cc\u7740\u4f34\u4fa3\u62a5\u540d\uff09** | **\u26a0\ufe0f\u9ad8\u98ce\u9669 (\u4fe1\u606f\u7f3a\u5931)** |\n| \u2468 | \u51b2\u52a8\u8d2d\u4e70\u60c5\u5883\uff08\u6df1\u591c22:00\u540e\u76f4\u64ad\u95f4\u51b2\u5355\uff09 | \u2705\u672a\u89e6\u53d1 |\n| \u2469 | \u9000\u8d39\u5386\u53f2\u9884\u8b66\uff08\u672c\u5e73\u53f0\u6216\u7ade\u54c1\u6709\u9000\u8d39\u8bb0\u5f55\uff09 | \u4e0d\u786e\u5b9a |\n\n### \u9500\u552e\u884c\u4e3a\u5408\u89c4\u5ba1\u67e5\n\n| \u5408\u89c4\u9879 | \u72b6\u6001 |\n|---|---|\n| \u662f\u5426\u5728\u7528\u6237\u8bf4\u201c\u6ca1\u94b1\u201d\u540e\u63a8\u8350\u82b1\u5457/\u4fe1\u7528\u5361 | \u4e0d\u786e\u5b9a |\n| \u662f\u5426\u4f7f\u7528\u201c\u968f\u65f6\u9000\u8d39\u201d\u4f5c\u4e3a\u4fc3\u6210\u8bdd\u672f | \u4e0d\u786e\u5b9a |\n| \u662f\u5426\u5bf9\u8d22\u52a1\u8106\u5f31\u7528\u6237\u4f7f\u7528\u201c\u903c\u81ea\u5df1\u4e00\u628a\u201d\u8bdd\u672f | \u4e0d\u786e\u5b9a |\n| **\u7528\u6237\u8bf4\u201c\u5bb6\u4eba\u4e0d\u77e5\u9053\u201d\u540e\u662f\u5426\u8ffd\u95ee\u6838\u5b9e** | **\u274c\u672a\u6838\u5b9e (\u5173\u952e\u7f3a\u5931)** |\n| \u662f\u5426\u5728\u7528\u6237\u8bf4\u201c\u6211\u53bb\u501f\u94b1\u201d\u540e\u4ecd\u7ee7\u7eed\u63a8\u8fdb\u6210\u4ea4 | \u4e0d\u786e\u5b9a |\n| \u662f\u5426\u4f7f\u7528\u6536\u76ca\u4fdd\u5e95\u627f\u8bfa\uff08\u201c\u4fdd\u8bc1\u6708\u5165\u8fc7\u4e07\u201d\uff09 | \u4e0d\u786e\u5b9a |\n| \u662f\u5426\u5728\u7528\u6237\u8868\u8fbe\u72b9\u8c6b\u65f6\u65bd\u52a0\u65f6\u95f4\u9650\u538b | \u4e0d\u786e\u5b9a |\n\n---\n\n## \u4e03\u3001\u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\n\n### \u2705 \u7acb\u523b\u505a\uff08\u6700\u9ad8\u4f18\u5148\u7ea7\uff09\n\n1.  **\u3010\u7d27\u6025\u301124\u5c0f\u65f6\u5185\u8fdb\u884c\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u5fc5\u987b\u79c1\u804a\u8be2\u95ee\u201c\u5bb6\u91cc\u4eba\u77e5\u9053\u60a8\u5b66\u8fd9\u4e2a\u5417\uff1f\u652f\u6301\u5417\uff1f\u201d\uff0c\u8fd9\u662f\u5f53\u524d\u6700\u9ad8\u98ce\u9669\u70b9\u3002\n2.  **\u8fdb\u884c\u65f6\u95f4\u53ef\u7528\u6027\u6df1\u5ea6\u786e\u8ba4**\uff1a\u660e\u786e\u8be2\u95ee\u6bcf\u65e5/\u6bcf\u5468\u53ef\u7528\u4e8e\u5b66\u4e60\u7684\u56fa\u5b9a\u3001\u4e0d\u53d7\u6253\u6270\u7684\u65f6\u95f4\u6bb5\uff0c\u8bc4\u4f30\u4e0e\u8bfe\u7a0b\u76f4\u64ad/\u4f5c\u4e1a\u7684\u5339\u914d\u5ea6\u3002\n3.  **\u63d0\u4f9b\u6570\u5b57\u5316\u64cd\u4f5c\u652f\u6301\u9884\u6848**\uff1a\u9488\u5bf9\u5176\u201c\u7535\u8111\u4e0d\u7ed9\u529b\u201d\u3001\u201c\u591a\u5e74\u672a\u7528\u7535\u8111\u201d\u7684\u60c5\u51b5\uff0c\u63d0\u524d\u51c6\u5907\u597d\u8be6\u7ec6\u7684\u64cd\u4f5c\u6307\u5357\u548c\u5907\u7528\u652f\u6301\u65b9\u6848\u3002\n\n### \u23f0 \u5165\u5b66\u7b2c\u4e00\u5468\u505a\n\n1.  **\u5f3a\u5316\u793e\u7fa4\u5f52\u5c5e\u611f**\uff1a\u4efb\u547d\u5176\u4e3a\u5c0f\u7ec4\u957f\u6216\u73ed\u59d4\uff0c\u53d1\u6325\u5176\u201c\u793e\u533a\u5efa\u9020\u8005\u201d\u7279\u8d28\uff0c\u63d0\u5347\u7559\u5b58\u3002\n2.  **\u8fdb\u884c\u6e29\u548c\u7684\u9884\u671f\u6821\u6b63**\uff1a\u80af\u5b9a\u5176\u5b66\u4e60\u70ed\u60c5\uff0c\u540c\u65f6\u59d4\u5a49\u8bf4\u660e\u6280\u80fd\u5b66\u4e60\u5230\u53d8\u73b0\u7684\u5468\u671f\uff0c\u907f\u514d\u540e\u671f\u56e0\u53d8\u73b0\u6162\u800c\u4ea7\u751f\u843d\u5dee\u3002\n3.  **\u8865\u5168\u201c\u5fc5\u95ee\u4e09\u95ee\u201d\u4fe1\u606f**\uff1a\u82e5\u4e4b\u524d\u9500\u552e\u672a\u5b8c\u6210\uff0c\u5fc5\u987b\u5728\u7b2c\u4e00\u5468\u5185\u5b8c\u6210\u5bb6\u5ead\u3001\u65f6\u95f4\u3001\u8d44\u91d1\u7684\u6838\u9a8c\u3002\n\n### \u274c \u7edd\u5bf9\u4e0d\u505a\uff08\u96f7\u533a\u8b66\u544a\uff09\n\n1.  **\u4e25\u7981\u5728\u672a\u6838\u5b9e\u5bb6\u5ead\u652f\u6301\u5ea6\u524d\uff0c\u8fdb\u884c\u4efb\u4f55\u5347\u4ed3\u6216\u7eed\u8d39\u63a8\u8350\u3002**\n2.  **\u7981\u6b62\u5ffd\u7565\u5176\u65f6\u95f4\u5c40\u9650\u6027**\uff0c\u5f3a\u884c\u8981\u6c42\u5176\u8ddf\u4e0a\u6240\u6709\u76f4\u64ad\u6216\u9ad8\u5f3a\u5ea6\u4f5c\u4e1a\u3002\n3.  **\u907f\u514d\u4f7f\u7528\u4efb\u4f55\u201c\u5feb\u901f\u53d8\u73b0\u201d\u3001\u201c\u4fdd\u8bc1\u6536\u5165\u201d\u7684\u8bdd\u672f**\uff0c\u4f1a\u7834\u574f\u5176\u5174\u8da3\u9a71\u52a8\u7684\u5b66\u4e60\u5fc3\u6001\u3002\n\n### \ud83d\udcac \u7834\u51b0\u8bdd\u672f\u5efa\u8bae\n\n> \u201c\u770b\u5230\u60a8\u5728\u7fa4\u91cc\u7279\u522b\u70ed\u5fc3\uff0c\u7ecf\u5e38\u5e2e\u52a9\u5176\u4ed6\u540c\u5b66\uff0c\u771f\u662f\u6211\u4eec\u73ed\u7684\u5b9d\u85cf\u5b66\u5458\uff01\u5173\u4e8e\u5b66\u4e60\u65f6\u95f4\uff0c\u60f3\u8ddf\u60a8\u518d\u786e\u8ba4\u4e00\u4e0b\uff0c\u54b1\u4eec\u6bcf\u5468\u7684\u76f4\u64ad\u548c\u4f5c\u4e1a\uff0c\u60a8\u9884\u4f30\u54ea\u4e2a\u65f6\u95f4\u6bb5\u6700\u80fd\u4fdd\u8bc1\u4e0d\u88ab\u6253\u6270\u5462\uff1f\u54b1\u4eec\u4e00\u8d77\u89c4\u5212\u4e2a\u6700\u9002\u5408\u60a8\u7684\u8282\u594f\u3002\u201d\n\n### \u26a0\ufe0f \u5347\u4ed3\u7b56\u7565\n\n- **\u80fd\u5426\u5347\u4ed3**\uff1a**\u6682\u4e0d\u5efa\u8bae**\n- **\u5347\u4ed3\u6761\u4ef6**\uff1a\u5fc5\u987b\u5728**\u660e\u786e\u5bb6\u5ead\u77e5\u60c5\u652f\u6301**\u4e14**\u65f6\u95f4\u89c4\u5212\u7a33\u5b9a\u6267\u884c1\u4e2a\u6708\u540e**\u518d\u8003\u8651\u3002\n- **\u82e5\u7ea0\u7ed3\u4e0d\u51b3**\uff1a\u53ef\u63a8\u8350\u8f7b\u91cf\u7ea7\u7684\u8fdb\u9636\u8d44\u6599\u5305\u6216\u5355\u9879\u8bad\u7ec3\u8425\uff0c\u800c\u975e\u9ad8\u4ef7\u5168\u9636\u8bfe\u7a0b\u3002\n\n---\n\n## \u516b\u3001\u4ea7\u54c1\u4e0e\u670d\u52a1\u5339\u914d\u6027\u5224\u65ad\n\n### \u5f53\u524d\u4ea7\u54c1\u5339\u914d\u5ea6\uff1a\u2705\u5339\u914d (\u57fa\u4e8e\u73b0\u6709\u4fe1\u606f)\n\n| \u7ef4\u5ea6 | \u5224\u65ad |\n|---|---|\n| \u8bfe\u7a0b\u65b9\u5411\u4e0e\u7528\u6237\u5174\u8da3/\u9700\u6c42\u662f\u5426\u4e00\u81f4 | \u4e00\u81f4 (\u5bf9\u540e\u671f\u5236\u4f5c\u3001\u6f14\u64ad\u8868\u73b0\u51fa\u6d53\u539a\u5174\u8da3) |\n| \u8bfe\u7a0b\u96be\u5ea6\u4e0e\u7528\u6237\u64cd\u4f5c\u80fd\u529b\u662f\u5426\u5339\u914d | **\u6709\u504f\u5dee\u9700\u8f85\u52a9** (\u6570\u5b57\u5316\u64cd\u4f5c\u80fd\u529b\u504f\u5f31\uff0c\u9700\u989d\u5916\u652f\u6301) |\n| \u8bfe\u7a0b\u65f6\u95f4\u8981\u6c42\u4e0e\u7528\u6237\u53ef\u7528\u65f6\u95f4\u662f\u5426\u5339\u914d | **\u6709\u538b\u529b\u4f46\u53ef\u534f\u8c03** (\u4f9d\u8d56\u5b69\u5b50\u4f5c\u606f\uff0c\u9700\u4e2a\u6027\u5316\u65f6\u95f4\u89c4\u5212) |\n| \u8bfe\u7a0b\u4ef7\u683c\u4e0e\u7528\u6237\u652f\u4ed8\u80fd\u529b\u662f\u5426\u5339\u914d | \u4e0d\u786e\u5b9a (\u652f\u4ed8\u4fe1\u606f\u7f3a\u5931) |\n| \u62db\u52df\u8425\u5c97\u4f4d\u9009\u62e9\u4e0e\u8d2d\u4e70\u8bfe\u7a0b\u65b9\u5411\u662f\u5426\u4e00\u81f4 | \u4e00\u81f4 (\u804a\u5929\u56f4\u7ed5\u6709\u58f0\u4e66/\u540e\u671f\u5c55\u5f00) |\n\n### \u6539\u914d\u5efa\u8bae\n\n- \u65e0\u9700\u6539\u914d\u4ea7\u54c1\uff0c\u4f46**\u670d\u52a1\u9700\u52a0\u5f3a**\uff1a\u63d0\u4f9b\u66f4\u7075\u6d3b\u7684\u8bfe\u7a0b\u56de\u770b\u673a\u5236\u3001\u4f5c\u4e1a\u63d0\u4ea4\u671f\u9650\uff0c\u5e76\u914d\u5907\u4e13\u5c5e\u7684\u201c\u6280\u672f\u5c0f\u52a9\u624b\u201d\u89e3\u51b3\u5176\u64cd\u4f5c\u95ee\u9898\u3002\n- \u82e5\u540e\u7eed\u53d1\u73b0\u5bb6\u5ead\u5f3a\u70c8\u53cd\u5bf9\u6216\u65f6\u95f4\u5b8c\u5168\u65e0\u6cd5\u4fdd\u969c\uff0c\u5e94\u8003\u8651\u529d\u9000\u6216\u8f6c\u5165\u66f4\u8f7b\u91cf\u3001\u65f6\u95f4\u66f4\u81ea\u7531\u7684\u4ea7\u54c1\u3002\n\n---\n\n## \u4e5d\u3001\u5173\u952e\u8bc1\u636e\u6458\u5f55\n\n> \u4ee5\u4e0b\u4e3a\u804a\u5929\u8bb0\u5f55\u4e2d\u6700\u80fd\u652f\u6491\u5224\u65ad\u7684\u539f\u8bdd\uff08\u6700\u591a5\u6761\uff09\uff1a\n\n1. > \u201c\u6211\u5c31\u5b69\u5b50\u7761\u7740\u4e86\u624d\u884c\u201d \u2014 \u6307\u5411\uff1a**\u65f6\u95f4\u8d44\u6e90\u77ed\u677f (\u5b9d\u5988)**\uff0c\u5b66\u4e60\u65f6\u95f4\u4e0d\u786e\u5b9a\u3002\n2. > \u201c\u6211\u5bf9\u5b66\u540e\u671f\u53c8\u591a\u4e86\u4e00\u4efd\u4fe1\u5fc3\u201d \u2014 \u6307\u5411\uff1a**\u9ad8\u52a8\u673a\u7eaf\u5ea6**\uff0c\u5174\u8da3\u4e0e\u4fe1\u5fc3\u9a71\u52a8\u3002\n3. > \u201c\u54b1\u4eec\u8fd9\u4e24\u5929\u53ef\u4ee5\u770b\u770b\u7b26\u5408\u89d2\u8272\u7684\u7535\u89c6\u5267\u548c\u7535\u5f71\uff0c\u770b\u770b\u4eba\u5bb6\u548b\u8bf4\u7684\uff0c\u627e\u627e\u7ecf\u9a8c\u201d \u2014 \u6307\u5411\uff1a**T1 \u793e\u533a\u5efa\u9020\u8005\u539f\u578b**\uff0c\u4e3b\u52a8\u7ec4\u7ec7\u5b66\u4e60\u6d3b\u52a8\u3002\n4. > \u201c\u611f\u89c9\u6211\u8981\u8ddf\u4e0d\u4e0a\u4f60\u4eec\u7684\u8282\u594f\u4e86[\u6342\u8138]\u6211\u81ea\u5df1\u8fd9\u7535\u8111\u4e5f\u662f\u4e0d\u600e\u4e48\u7ed9\u529b\u201d \u2014 \u6307\u5411\uff1a**\u7cbe\u529b\u7ef4\u5ea6\u4e2d\u7b49**\uff0c\u6709\u5b66\u4e60\u610f\u613f\u4f46\u5b58\u5728\u64cd\u4f5c\u969c\u788d\u548c\u7126\u8651\u3002\n5. > \u201c\u6211\u8001\u516c\u5403\u4e86\u4e00\u6b21\uff0c\u8bf4\u597d\u5403\u201d \u2014 \u6307\u5411\uff1a**\u5bb6\u5ead\u5173\u7cfb\u5b58\u5728\uff0c\u4f46\u51b3\u7b56\u6743\u672a\u77e5**\uff0c\u662f\u6838\u5fc3\u98ce\u9669\u70b9\u3002\n\n---\n\n## \u5341\u3001\u4e00\u53e5\u8bdd\u7ed3\u8bba\uff08\u4f9b\u7ba1\u7406\u5c42\u5feb\u901f\u626b\u8bfb\uff09\n\n> **UID: 676587904** \u5224\u5b9a\u4e3a **\ud83d\udfeaC1\u7c7b (\u60c5\u7eea\u6d88\u8d39\u578b)**\uff08\u503e\u5411 **T1 \u793e\u533a\u5efa\u9020\u8005**\uff09\uff0c\u9000\u8d39\u98ce\u9669 **\u4e2d**\u3002\u6838\u5fc3\u539f\u56e0\uff1a**\u5174\u8da3\u9a71\u52a8\u4e14\u793e\u7fa4\u53c2\u4e0e\u5ea6\u9ad8\uff0c\u4f46\u5bb6\u5ead\u51b3\u7b56\u6743\u4e0e\u65f6\u95f4\u7a33\u5b9a\u6027\u4e24\u5927\u5173\u952e\u4fe1\u606f\u7f3a\u5931\uff0c\u6784\u6210\u9ad8\u98ce\u9669\u76f2\u533a**\u3002\u5efa\u8bae\uff1a**\u73ed\u4e3b\u4efb24\u5c0f\u65f6\u5185\u5fc5\u987b\u79c1\u804a\u6838\u5b9e\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u4e0e\u5177\u4f53\u65f6\u95f4\u5b89\u6392**\u3002\n\n{\"core_type\": \"T1 \u793e\u533a\u5efa\u9020\u8005 (\u503e\u5411)\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u5339\u914d\", \"action\": \"24h\u5185\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\u4e0e\u65f6\u95f4\"}";
