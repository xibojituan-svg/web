    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u7f3a\u4e4f\u652f\u4ed8\u4fe1\u606f\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u5177\u4f53\u804c\u4e1a/\u6536\u5165\u3001\u8fc7\u5f80\u5b66\u4e60\u6295\u5165\u3001\u660e\u786e\u5b66\u4e60\u76ee\u6807\u4e0e\u53d8\u73b0\u9884\u671f\u7b49\u5173\u952e\u7ef4\u5ea6\u4fe1\u606f\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: \u4e2d\u7b49\u3002\u6709\u5b66\u4e60\u884c\u4e3a\uff08\u5b8c\u6210\u4f5c\u4e1a\u3001\u8be2\u95eeA+\u3001\u5173\u5fc3\u8bd5\u97f3\uff09\uff0c\u4f46\u76ee\u6807\u6a21\u7cca\uff08\u201c\u8fd8\u4e0d\u77e5\u9053\u80fd\u4e0d\u80fd\u4e2d\u97f3\u5462\u201d\uff09\uff0c**\u53d8\u73b0\u52a8\u673a\u4e0d\u660e\u786e**\uff0c\u793e\u4ea4\u4e0e\u5174\u8da3\u9a71\u52a8\u660e\u663e\uff08\u7fa4\u5185\u6d3b\u8dc3\u4e92\u52a8\uff0c\u5173\u5fc3\u6280\u672f\u95ee\u9898\u5982\u9ea6\u514b\u98ce\u3001\u4e0a\u4f20\u4e13\u8f91\uff09\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: \u4e2d\u7b49\u504f\u4f4e\u3002\u6709\u65f6\u95f4\u6295\u5165\uff08\u71ac\u591c\u770b\u5f55\u64ad\uff09\uff0c\u6709\u57fa\u7840\u8bbe\u5907\uff08\u9ea6\u514b\u98ce\u3001\u786c\u76d8\uff09\uff0c\u4f46**\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316**\uff08\u4e0a\u73ed\u3001\u7167\u987e\u4f4f\u9662\u5a46\u5a46\uff09\uff0c\u5b66\u4e60\u8fde\u7eed\u6027\u5dee\uff08\u8fc7\u5e74\u671f\u95f4\u672a\u5f00\u7535\u8111\uff09\u3002\u7ecf\u6d4e\u72b6\u51b5\u4e0d\u660e\uff0c\u4f46\u4e3b\u52a8\u8d2d\u4e70\u786c\u76d8\uff08\u4e8c\u6b21\u8d2d\u4e70\uff09\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u6d88\u8d39\u610f\u613f\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u9ad8**\u3002\u5b66\u4e60\u8fc7\u7a0b\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u9ea6\u514b\u98ce\u65e0\u58f0\u3001\u8f6f\u4ef6\u64cd\u4f5c\uff09\u80fd\u6301\u7eed\u6c42\u52a9\u5e76\u5c1d\u8bd5\u89e3\u51b3\u3002\u5bf9\u53cd\u9988\u63a5\u53d7\u5ea6\u9ad8\uff08\u53cd\u590d\u8c03\u6574\u5f55\u97f3\uff09\uff0c\u6001\u5ea6\u79ef\u6781\uff08\u201c\u6b63\u597d\u53ef\u4ee5\u7ec3\u4e60\u7ec3\u4e60\u201d\uff09\uff0c\u793e\u7fa4\u4e92\u52a8\u53cb\u597d\u3001\u4e50\u4e8e\u52a9\u4eba\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u4fe1\u606f\u7f3a\u5931**\u3002\u8bb0\u5f55\u4e2d\u672a\u63d0\u53ca\u652f\u4ed8\u884c\u4e3a\u3001\u91d1\u989d\u3001\u652f\u4ed8\u4eba\u3002\u9700\u6838\u67e5\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u7f3a\u5931**\u3002\u672a\u63d0\u53ca\u914d\u5076/\u5bb6\u4eba\u6001\u5ea6\u3002\u7528\u6237\u63d0\u53ca\u201c\u5a46\u5a46\u4f4f\u9662\u201d\uff0c\u53ef\u80fd\u4e3a\u5df2\u5a5a\u5973\u6027\uff0c\u9700\u6838\u67e5\u5bb6\u5ead\u652f\u6301\u5ea6\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u7eaf\u5ea6 (M)**: **B\u7c7b (\u4e2d\u7b49)**\u3002\u6709\u5b66\u4e60\u884c\u52a8\uff0c\u4f46\u5185\u5728\u9a71\u52a8\u529b\u504f\u5411\u5174\u8da3\u63a2\u7d22\u4e0e\u793e\u7fa4\u5f52\u5c5e\uff0c\u804c\u4e1a\u5316\u76ee\u6807\u6a21\u7cca\u3002\n*   **\u6b65\u9aa42 - \u8d44\u6e90\u5e95\u5ea7 (R)**: **C\u7c7b (\u4e2d\u7b49\u504f\u4f4e)**\u3002\u6709\u65f6\u95f4\u4e0e\u8bbe\u5907\u57fa\u7840\uff0c\u4f46**\u7cbe\u529b\u88ab\u4e25\u91cd\u6324\u5360**\uff08\u5de5\u4f5c\u3001\u5bb6\u5ead\u7167\u62a4\uff09\uff0c\u5c5e\u4e8e\u9ad8\u98ce\u9669\u8017\u6563\u72b6\u6001\u3002\n*   **\u6b65\u9aa43 - \u5fc3\u7406\u5f39\u6027 (E)**: **A\u7c7b (\u9ad8)**\u3002\u97e7\u6027\u597d\uff0c\u4e50\u4e8e\u6c9f\u901a\uff0c\u632b\u6298\u8010\u53d7\u5ea6\u9ad8\u3002\n*   **\u7efc\u5408\u5224\u5b9a**: **B-C-A\u578b**\u3002\u6838\u5fc3\u77db\u76fe\uff1a**\u9ad8\u5f39\u6027\u3001\u4e2d\u7b49\u52a8\u673a\u4e0e\u8106\u5f31\u8d44\u6e90\u5e95\u5ea7\uff08\u65f6\u95f4\uff09\u7684\u51b2\u7a81**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**: **T4 \u793e\u7fa4\u4f9d\u8d56\u578b\u63a2\u7d22\u8005**\u3002\n    *   \u7279\u5f81\uff1a\u5b66\u4e60\u8fc7\u7a0b\u9ad8\u5ea6\u4f9d\u8d56\u73ed\u73ed\u548c\u793e\u7fa4\u652f\u6301\uff08\u9891\u7e41@\u73ed\u73ed\u3001\u7fa4\u5185\u4e92\u52a8\uff09\uff1b\u5b66\u4e60\u52a8\u529b\u90e8\u5206\u6e90\u4e8e\u793e\u7fa4\u5f52\u5c5e\u611f\uff08\u201c\u5927\u5bb6\u4ee5\u540e\u8981\u7ecf\u5e38\u8054\u7cfb\u554a\u201d\uff09\uff1b\u5bf9\u53d8\u73b0\u8def\u5f84\u8ba4\u77e5\u6a21\u7cca\uff0c\u5904\u4e8e\u63a2\u7d22\u548c\u5174\u8da3\u6ee1\u8db3\u9636\u6bb5\uff1b\u6267\u884c\u529b\u5c1a\u53ef\u4f46\u6613\u53d7\u5916\u754c\u5e72\u6270\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u98ce\u9669\u7b49\u7ea7\uff1a\u4e2d)\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**: \u4e2d\u98ce\u9669\u3002\u7528\u6237\u5bf9\u201c\u4e2d\u97f3\u201d\u6301\u4e0d\u786e\u5b9a\u6001\u5ea6\uff08\u201c\u8fd8\u4e0d\u77e5\u9053\u80fd\u4e0d\u80fd\u4e2d\u97f3\u5462\u201d\uff09\uff0c\u82e5\u957f\u671f\u65e0\u6b63\u53cd\u9988\uff0c\u6613\u4ea7\u751f\u5931\u671b\u60c5\u7eea\u3002\n    2.  **\u65f6\u95f4\u7cbe\u529b\u4e0d\u8db3**: **\u9ad8\u98ce\u9669**\u3002\u660e\u786e\u8868\u8fbe\u201c\u5fd9\u7684\u6ca1\u65f6\u95f4\u201d\u3001\u201c\u5a46\u5a46\u4f4f\u9662\u201d\uff0c\u662f**\u6700\u4e3b\u8981\u7684\u9000\u8d39\u8bf1\u56e0**\u3002\n    3.  **\u4ea7\u54c1\u4e0d\u7b26\u9884\u671f**: \u4f4e\u98ce\u9669\u3002\u7528\u6237\u79ef\u6781\u53c2\u4e0e\u8bfe\u7a0b\u3001\u4f5c\u4e1a\u3001\u8003\u8bd5\uff0c\u672a\u8868\u8fbe\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u7684\u4e0d\u6ee1\u3002\n    4.  **\u7ecf\u6d4e\u538b\u529b**: \u4fe1\u606f\u4e0d\u8db3\u3002\u4e3b\u52a8\u590d\u8d2d\u786c\u76d8\uff0c\u6682\u672a\u4f53\u73b0\u7ecf\u6d4e\u538b\u529b\u3002\n    5.  **\u5bb6\u5ead\u53cd\u5bf9**: \u4fe1\u606f\u4e0d\u8db3\u3002**\u9700\u91cd\u70b9\u6838\u67e5**\u3002\n    6.  **\u9500\u552e\u8bef\u5bfc**: \u4f4e\u98ce\u9669\u3002\u8bb0\u5f55\u4e2d\u9500\u552e\u56de\u590d\u591a\u4e3a\u64cd\u4f5c\u6307\u5bfc\u4e0e\u50ac\u4fc3\uff0c\u672a\u89c1\u8fc7\u5ea6\u627f\u8bfa\u3002\n    7.  **\u670d\u52a1\u4f53\u9a8c**: \u4f4e\u98ce\u9669\u3002\u7528\u6237\u4e0e\u73ed\u73ed\u4e92\u52a8\u826f\u597d\uff0c\u591a\u6b21\u8868\u8fbe\u611f\u8c22\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u672a\u53d1\u73b0\u91cd\u5927\u8fdd\u89c4**\u3002\u9500\u552e\u6c9f\u901a\u4ee5\u670d\u52a1\u3001\u63d0\u9192\u3001\u6280\u672f\u6307\u5bfc\u4e3a\u4e3b\u3002\n*   **\u98ce\u9669\u63d0\u793a**: \u8bb0\u5f55\u4e2d\u9500\u552e\u66fe\u63d0\u53ca\u201c\u770b\u6e05\u695a\u5206\u6210\u4e66\u201d\uff0c\u7528\u6237\u56de\u5e94\u201c\u770b\u9519\u4e86\u201d\uff0c\u663e\u793a\u7528\u6237\u5bf9\u5546\u4e1a\u5408\u4f5c\u6761\u6b3e\u7684\u8ba4\u77e5\u53ef\u80fd\u5b58\u5728\u758f\u5ffd\uff0c**\u73ed\u73ed\u9700\u786e\u4fdd\u5173\u952e\u4fe1\u606f\uff08\u5982\u5206\u6210\u534f\u8bae\uff09\u4f20\u8fbe\u6e05\u6670\u65e0\u8bef**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d**: **\u5339\u914d**\u3002\u7528\u6237\u5df2\u5b8c\u6210\u8bfe\u7a0b\u5b66\u4e60\u3001\u8003\u8bd5\uff0c\u5e76\u8fdb\u5165A+\u5e73\u53f0\u5c1d\u8bd5\u8bd5\u97f3\uff0c\u4e0e\u4ea7\u54c1\u8fdb\u9636\u8def\u5f84\u543b\u5408\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **\u9996\u5468\u6821\u6b63\u53d8\u73b0\u9884\u671f\uff0c\u63d0\u4f9b\u7075\u6d3b\u5b66\u4e60\u652f\u6301**\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**:\n    1.  **\u9884\u671f\u7ba1\u7406**: \u5c3d\u5feb\u8fdb\u884c\u4e00\u6b21\u4e00\u5bf9\u4e00\u6c9f\u901a\uff0c**\u660e\u786e\u6f84\u6e05\u6709\u58f0\u884c\u4e1a\u7684\u53d8\u73b0\u5468\u671f\u3001\u96be\u5ea6\u4e0e\u6536\u5165\u9636\u68af**\uff0c\u964d\u4f4e\u5176\u4e0d\u5207\u5b9e\u9645\u7684\u5e7b\u60f3\uff0c\u5efa\u7acb\u957f\u671f\u6210\u957f\u5fc3\u6001\u3002\n    2.  **\u65f6\u95f4\u7ba1\u7406\u652f\u6301**: \u9274\u4e8e\u5176\u65f6\u95f4\u788e\u7247\u5316\uff0c\u63d0\u4f9b**\u5f02\u6b65\u5b66\u4e60\u65b9\u6848**\uff08\u5982\u91cd\u70b9\u5f55\u64ad\u8bfe\u6807\u8bb0\u3001\u788e\u7247\u65f6\u95f4\u7ec3\u4e60\u65b9\u6cd5\uff09\uff0c\u5e76\u8868\u8fbe\u5bf9\u5176\u5bb6\u5ead\u60c5\u51b5\u7684\u7406\u89e3\u4e0e\u652f\u6301\u3002\n    3.  **\u5bb6\u5ead\u77e5\u60c5\u6838\u67e5**: \u59d4\u5a49\u63a2\u8be2\u5bb6\u5ead\uff08\u7279\u522b\u662f\u914d\u5076\uff09\u5bf9\u5176\u5b66\u4e60\u4e0e\u6295\u5165\uff08\u65f6\u95f4\u3001\u91d1\u94b1\uff09\u7684\u6001\u5ea6\uff0c**\u9632\u8303\u56e0\u5bb6\u5ead\u538b\u529b\u5bfc\u81f4\u7684\u7a81\u7136\u9000\u8d39**\u3002\n    4.  **\u5f3a\u5316\u6b63\u5411\u53cd\u9988**: \u5728\u5176\u63d0\u4ea4\u4f5c\u4e1a\u3001\u5c1d\u8bd5\u8bd5\u97f3\u65f6\u7ed9\u4e88\u5177\u4f53\u3001\u53ca\u65f6\u7684\u9f13\u52b1\uff0c\u5c06\u5176\u9ad8\u5fc3\u7406\u5f39\u6027\u8f6c\u5316\u4e3a\u6301\u7eed\u5b66\u4e60\u7684\u52a8\u529b\u3002\n    5.  **\u5229\u7528\u793e\u7fa4\u5f52\u5c5e\u611f**: \u9f13\u52b1\u5176\u5728\u793e\u7fa4\u4e2d\u5206\u4eab\u7ecf\u9a8c\uff08\u5982\u8bbe\u5907\u8c03\u8bd5\uff09\uff0c\u62c5\u4efb\u201c\u70ed\u5fc3\u5b66\u5458\u201d\u89d2\u8272\uff0c\u5de9\u56fa\u5176\u5b66\u4e60\u7c98\u6027\u3002\n\n{\"core_type\": \"T4 \u793e\u7fa4\u4f9d\u8d56\u578b\u63a2\u7d22\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u9996\u5468\u6821\u6b63\u53d8\u73b0\u9884\u671f\uff0c\u63d0\u4f9b\u7075\u6d3b\u652f\u6301\"}";
