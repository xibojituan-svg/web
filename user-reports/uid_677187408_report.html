    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u7f3a\u5931\u5173\u952e\u4fe1\u606f\uff1a\u7528\u6237\u5e74\u9f84\u3001\u804c\u4e1a\u3001\u57ce\u5e02\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u5177\u4f53\u652f\u4ed8\u80fd\u529b\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u3002\n\n---\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a**\u4f4e**\u3002\u6838\u5fc3\u52a8\u673a\u4e3a\u201c\u5c31\u60f3\u8d5a\u94b1\u201d\uff0c\u76ee\u6807\u6a21\u7cca\uff08\u201c\u76ee\u6807\u4e0d\u660e\u786e\u201d\uff09\uff0c\u5bf9\u6709\u58f0\u4e66\u3001AI\u77ed\u89c6\u9891\u5747\u6709\u5174\u8da3\u4f46\u6d45\u5c1d\u8f84\u6b62\u3002\u5b66\u4e60\u9a71\u52a8\u529b\u4e3b\u8981\u6765\u81ea\u5916\u90e8\u7ecf\u6d4e\u538b\u529b\uff08\u201c\u8fdb\u5382\u65f6\u95f4\u592a\u5c11\uff0c\u4e0a\u73ed\u65f6\u95f4\u592a\u957f\u201d\uff09\u548c\u9500\u552e\u5f15\u5bfc\uff0c\u7f3a\u4e4f\u660e\u786e\u7684\u4e2a\u4eba\u89c4\u5212\u4e0e\u5185\u5728\u70ed\u60c5\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4e2d\u4f4e**\u3002\u65f6\u95f4\u8d44\u6e90\u7d27\u5f20\uff08\u4e0a\u591c\u73ed\uff0c\u767d\u5929\u6709\u7a7a\u4f46\u7cbe\u529b\u6709\u9650\uff09\uff0c\u7ecf\u6d4e\u8d44\u6e90\u672a\u77e5\u4f46\u5173\u6ce8\u4ef7\u683c\uff08\u201c\u540e\u9762\u5b66\u8d39\u4e03\u5343\u591a\u5417\u201d\uff09\uff0c\u8ba4\u77e5\u8d44\u6e90\u4e00\u822c\uff08\u201c\u505a\u8d26\u53f7\u6bcf\u5929\u8981\u60f3\u505a\u4ec0\u4e48\uff0c\u52a8\u8111\u4e0d\u592a\u884c\u201d\uff09\uff0c\u5bf9\u5b66\u4e60\u96be\u5ea6\u6709\u754f\u96be\u60c5\u7eea\uff08\u201c\u89c9\u5f97\u6ca1\u90a3\u4e48\u597d\u5b66\u201d\uff09\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a**\u4f4e**\u3002\u8868\u73b0\u51fa\u660e\u663e\u7684**\u754f\u96be\u4e0e\u9003\u907f\u503e\u5411**\uff08\u56e0\u201c\u5929\u5929\u7ec3\u58f0\u201d\u653e\u5f03\u6709\u58f0\u4e66\uff0c\u8ba4\u4e3a\u201c\u6301\u7eed\u597d\u96be\u201d\uff09\u3002\u884c\u52a8\u4f9d\u8d56\u5916\u90e8\u5f15\u5bfc\uff08\u201c\u6211\u5c31\u8ddf\u7740\u4f60\u5b66\u201d\u3001\u201c\u5e08\u59d0\u5e2e\u6211\u62a2\u5457\u201d\uff09\uff0c\u7f3a\u4e4f\u81ea\u4e3b\u89c4\u5212\u4e0e\u575a\u6301\u7684\u97e7\u6027\u3002\u60c5\u7eea\u8868\u8fbe\u88ab\u52a8\u3001\u987a\u4ece\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u672a\u652f\u4ed8\u3002\u7528\u6237\u6700\u7ec8\u8bf7\u6c42\u9500\u552e\u5e2e\u52a9\u62a2\u8d2d3980\u5143\u8bfe\u7a0b\uff0c\u4f46\u8bb0\u5f55\u672a\u663e\u793a\u652f\u4ed8\u5b8c\u6210\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u7f3a\u5931**\u3002\u65e0\u4efb\u4f55\u5173\u4e8e\u5bb6\u5ead\u6216\u4ed6\u4eba\u610f\u89c1\u7684\u63d0\u53ca\uff0c\u9ed8\u8ba4\u89c6\u4e3a\u4e2a\u4eba\u51b3\u7b56\u3002\n*   **\u6b65\u9aa41\uff1a\u9700\u6c42\u4e0e\u76ee\u6807**\uff1aD\u7ea7\u3002\u9700\u6c42\u6a21\u7cca\uff0c\u4ec5\u4e3a\u201c\u8d5a\u94b1\u201d\uff0c\u65e0\u5177\u4f53\u804c\u4e1a\u89c4\u5212\u6216\u6280\u80fd\u63d0\u5347\u76ee\u6807\u3002\n*   **\u6b65\u9aa42\uff1a\u8d44\u6e90\u4e0e\u6295\u5165**\uff1aC\u7ea7\u3002\u6709\u65f6\u95f4\uff08\u767d\u5929\uff09\u4f46\u7cbe\u529b/\u5fc3\u529b\u6295\u5165\u610f\u613f\u4f4e\uff0c\u5bf9\u5b66\u4e60\u6301\u7eed\u6027\u4fe1\u5fc3\u4e0d\u8db3\u3002\n*   **\u6b65\u9aa43\uff1a\u884c\u52a8\u4e0e\u627f\u8bfa**\uff1aD\u7ea7\u3002\u884c\u52a8\u8ddf\u968f\u9500\u552e\u8282\u594f\uff0c\u4f46\u591a\u6b21\u8868\u73b0\u51fa\u72b9\u8c6b\uff08\u201c\u6682\u65f6\u4e0d\u4e86\u201d\u3001\u201c\u7cbe\u529b\u6709\u9650\u201d\uff09\uff0c\u7f3a\u4e4f\u4e3b\u52a8\u63a2\u7d22\u548c\u6df1\u5ea6\u627f\u8bfa\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**\uff1a**D\u7c7b\uff08\u89c2\u671b\u8bd5\u63a2\u578b\uff09**\u3002\u7528\u6237\u5904\u4e8e\u4f4e\u52a8\u673a\u3001\u4f4e\u627f\u8bfa\u7684\u8bd5\u63a2\u72b6\u6001\uff0c\u6781\u6613\u53d7\u632b\u6216\u653e\u5f03\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**\uff1a**T7 \u8ff7\u832b\u8ddf\u98ce\u578b**\u3002\n*   **\u4f9d\u636e**\uff1a\u6838\u5fc3\u7279\u5f81\u9ad8\u5ea6\u543b\u5408\u2014\u2014\u76ee\u6807\u611f\u5f31\uff08\u201c\u76ee\u6807\u4e0d\u660e\u786e\uff0c\u5c31\u60f3\u8d5a\u94b1\u201d\uff09\u3001\u7f3a\u4e4f\u4e3b\u89c1\uff08\u201c\u54ea\u4e2a\u8d5b\u9053\u6bd4\u8f83\u597d\u5165\u624b\u554a\u6211\u5c31\u9009\u54ea\u4e2a\u201d\uff09\u3001\u884c\u52a8\u4f9d\u8d56\u5916\u90e8\u63a8\u52a8\uff08\u8ddf\u968f\u9500\u552e\u5f15\u5bfc\u3001\u8bf7\u6c42\u4ee3\u62a2\u4f18\u60e0\uff09\u3001\u5bf9\u5b66\u4e60\u96be\u5ea6\u654f\u611f\u4e14\u6613\u653e\u5f03\uff08\u4ece\u6709\u58f0\u4e66\u8f6c\u5411\u770b\u4f3c\u66f4\u201c\u7b80\u5355\u201d\u7684AI\u77ed\u89c6\u9891\uff09\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\uff08\u98ce\u9669\u7b49\u7ea7\uff1a**\u9ad8**\uff09\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u671f\u671b\u201c\u8d5a\u94b1\u201d\uff0c\u4f46\u7f3a\u4e4f\u660e\u786e\u76ee\u6807\u548c\u6267\u884c\u97e7\u6027\uff0c\u6781\u6613\u56e0\u77ed\u671f\u672a\u89c1\u6536\u76ca\u6216\u9047\u5230\u5b66\u4e60\u74f6\u9888\u800c\u8ba4\u4e3a\u201c\u65e0\u6548\u201d\u3002\n    2.  **\u65f6\u95f4\u7cbe\u529b\u51b2\u7a81**\uff1a**\u9ad8\u98ce\u9669**\u3002\u591c\u73ed\u5de5\u4f5c\u5df2\u5bfc\u81f4\u5176\u201c\u542c\u7740\u542c\u7740\u53c8\u7761\u7740\u4e86\u201d\uff0c\u517c\u804c\u5b66\u4e60\u4e0e\u4e3b\u4e1a\u7cbe\u529b\u51b2\u7a81\u660e\u663e\u3002\n    3.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u4e2d\u98ce\u9669**\u3002\u5173\u6ce8\u4ef7\u683c\uff0c\u4f46\u5177\u4f53\u7ecf\u6d4e\u72b6\u51b5\u672a\u77e5\u3002\n    4.  **\u8bfe\u7a0b\u8d28\u91cf\u8d28\u7591**\uff1a**\u4e2d\u98ce\u9669**\u3002\u5bf9\u201c\u4e09\u4e2a\u534a\u6708\u90a3\u79cd\u201d\u66f4\u5168\u9762\u8bfe\u7a0b\u611f\u5174\u8da3\uff0c\u6697\u793a\u5bf9\u5f53\u524d\u8bfe\u7a0b\u6df1\u5ea6\u6709\u7591\u8651\u3002\n    5.  **\u9500\u552e\u627f\u8bfa\u4e0d\u7b26**\uff1a**\u4e2d\u98ce\u9669**\u3002\u9500\u552e\u5f3a\u8c03\u201c\u5546\u5355\u53d8\u73b0\u5feb\u201d\u3001\u201c\u95e8\u69db\u4f4e\u201d\uff0c\u82e5\u7528\u6237\u63a5\u5355\u4e0d\u987a\u6216\u6536\u76ca\u4e0d\u53ca\u9884\u671f\uff0c\u6613\u5f15\u53d1\u4e89\u8bae\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u4fe1\u606f\u7f3a\u5931**\u3002\n    7.  **\u7ade\u54c1\u8f6c\u79fb/\u51b2\u52a8\u540e\u6094**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5df2\u5728\u6709\u58f0\u4e66\u548cAI\u77ed\u89c6\u9891\u95f4\u6447\u6446\uff0c\u52a8\u673a\u4e0d\u7eaf\uff0c\u8d2d\u8bfe\u540e\u82e5\u53d1\u73b0\u5176\u4ed6\u201c\u66f4\u6613\u8d5a\u94b1\u201d\u673a\u4f1a\u6216\u51b7\u9759\u540e\u53ef\u80fd\u540e\u6094\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5408\u89c4\u70b9**\uff1a\u9500\u552e\u5f3a\u8c03\u4e86\u5e73\u53f0\u6b63\u89c4\u6027\uff0c\u63d0\u4f9b\u4e86\u90e8\u5206\u5b66\u4e60\u8d44\u6599\u548c\u4f5c\u4e1a\u6307\u5bfc\u3002\n*   **\u98ce\u9669\u70b9**\uff1a\n    *   **\u8fc7\u5ea6\u627f\u8bfa\u98ce\u9669**\uff1a\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u5546\u5355\u62ff\u94b1\u5feb\u201d\u3001\u201c\u8d44\u6e90\u65e0\u6761\u4ef6\u7ed9\u201d\u3001\u201c\u5904\u5728\u98ce\u53e3\u9636\u6bb5\u201d\uff0c\u53ef\u80fd\u5851\u9020\u4e0d\u5207\u5b9e\u9645\u7684\u9884\u671f\u3002\n    *   **\u5236\u9020\u7a00\u7f3a\u4e0e\u7d27\u8feb\u611f**\uff1a\u201c\u6700\u540e\u4e00\u573a\u76f4\u64ad\u201d\u3001\u201c\u540d\u989d\u6709\u9650\u201d\u3001\u201c\u62bd\u5956\u62a2\u5238\u201d\u7b49\u8bdd\u672f\u9891\u7e41\uff0c\u53ef\u80fd\u4fc3\u4f7f\u7528\u6237\u51b2\u52a8\u51b3\u7b56\u3002\n    *   **\u66ff\u4ee3\u51b3\u7b56**\uff1a\u7528\u6237\u8981\u6c42\u201c\u5e08\u59d0\u5e2e\u6211\u62a2\u5457\u201d\uff0c\u9500\u552e\u4ee3\u4e3a\u64cd\u4f5c\uff0c\u867d\u4e3a\u7528\u6237\u8bf7\u6c42\uff0c\u4f46\u9700\u786e\u4fdd\u7528\u6237\u5145\u5206\u77e5\u60c5\u5e76\u81ea\u4e3b\u652f\u4ed8\u3002\n    *   **\u4fe1\u606f\u8f70\u70b8**\uff1a\u591a\u540d\u9500\u552e\u9ad8\u9891\u3001\u591a\u65f6\u6bb5\u8054\u7cfb\uff0c\u53ef\u80fd\u5bf9\u7528\u6237\u9020\u6210\u538b\u529b\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6838\u5fc3\u7b56\u7565**\uff1a**\u964d\u4f4e\u9884\u671f\uff0c\u5f3a\u5316\u8fc7\u7a0b\u7ba1\u7406\uff0c\u9632\u8303\u9000\u8d39**\u3002\u5207\u52ff\u7ee7\u7eed\u9f13\u5439\u201c\u5feb\u94b1\u201d\u5e7b\u60f3\u3002\n*   **\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9884\u671f\u7ba1\u7406**\uff1a\u9996\u6b21\u6c9f\u901a\u5fc5\u987b\u660e\u786e\u5b66\u4e60\u8def\u5f84\u3001\u53d8\u73b0\u5468\u671f\u548c\u5e73\u5747\u6536\u76ca\u8303\u56f4\uff0c\u5f3a\u8c03\u6280\u80fd\u79ef\u7d2f\u7684\u5fc5\u8981\u6027\u548c\u957f\u671f\u6027\u3002\n    2.  **\u76ee\u6807\u5177\u8c61\u5316**\uff1a\u5f15\u5bfc\u7528\u6237\u8bbe\u5b9a\u9996\u4e2a\u5fae\u5c0f\u3001\u53ef\u8861\u91cf\u7684\u76ee\u6807\uff08\u5982\uff1a\u7b2c\u4e00\u5468\u5b8c\u6210\u4e00\u4e2a\u5546\u5355\u6a21\u677f\u7ec3\u4e60\uff09\uff0c\u800c\u975e\u7a7a\u8c08\u201c\u8d5a\u94b1\u201d\u3002\n    3.  **\u7cbe\u529b\u89c4\u5212**\uff1a\u7ed3\u5408\u5176\u591c\u73ed\u4f5c\u606f\uff0c\u534f\u52a9\u5236\u5b9a\u6781\u5176\u7075\u6d3b\u3001\u788e\u7247\u5316\u7684\u5b66\u4e60\u8ba1\u5212\uff0c\u964d\u4f4e\u542f\u52a8\u538b\u529b\u3002\n    4.  **\u9ad8\u9891\u8f7b\u91cf\u4e92\u52a8**\uff1a\u91c7\u7528\u6253\u5361\u3001\u7b80\u5355\u4f5c\u4e1a\u3001\u5c0f\u989d\u5956\u52b1\u7b49\u65b9\u5f0f\u7ef4\u6301\u5176\u53c2\u4e0e\u611f\uff0c\u9632\u6b62\u56e0\u754f\u96be\u800c\u5931\u8054\u3002\n    5.  **\u98ce\u9669\u76d1\u63a7**\uff1a\u5bc6\u5207\u5173\u6ce8\u5176\u524d\u4e24\u5468\u7684\u5b66\u4e60\u5b8c\u6210\u5ea6\u548c\u60c5\u7eea\u53cd\u9988\uff08\u5982\u62b1\u6028\u201c\u96be\u201d\u3001\u201c\u6ca1\u65f6\u95f4\u201d\uff09\uff0c\u53ca\u65f6\u4ecb\u5165\u758f\u5bfc\u6216\u8c03\u6574\u8ba1\u5212\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**\uff1a\n    *   **\u6302\u8f7d\u4e50\u9ad8\u7ebf**\uff1a**\u201c\u8f7b\u91cf\u63a5\u5355\u5b9e\u6218\u8425\u201d**\uff08\u77ed\u671f\u3001\u6a21\u5757\u5316\u3001\u5f3a\u966a\u8dd1\uff09\u3002\u907f\u514d\u63a8\u8350\u9700\u8981\u957f\u671f\u6df1\u5ea6\u6295\u5165\u7684\u201c\u5927\u5e08\u73ed\u201d\u6216\u201c\u5168\u94fe\u8def\u5b75\u5316\u201d\u3002\n    *   **\u7406\u7531**\uff1a\u8be5\u7528\u6237\u9700\u8981\u5373\u65f6\u6b63\u53cd\u9988\u548c\u4f4e\u5fc3\u7406\u8d1f\u62c5\u7684\u5165\u95e8\u8def\u5f84\u3002\u8f7b\u91cf\u5316\u7684\u3001\u4ee5\u5b8c\u6210\u5177\u4f53\u5c0f\u5546\u5355\u4e3a\u76ee\u6807\u7684\u4ea7\u54c1\uff0c\u66f4\u7b26\u5408\u5176\u201c\u6015\u52a8\u8111\u201d\u3001\u201c\u60f3\u5feb\u70b9\u89c1\u6548\u201d\u7684\u5fc3\u7406\uff0c\u4e5f\u80fd\u5728\u53ef\u63a7\u8303\u56f4\u5185\u6d4b\u8bd5\u5176\u771f\u5b9e\u6295\u5165\u5ea6\u3002\n\n{\"core_type\": \"T7 \u8ff7\u832b\u8ddf\u98ce\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168/\u5c0a\u91cd\", \"target_product_line\": \"\u8f7b\u91cf\u63a5\u5355\u5b9e\u6218\u8425\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}";
