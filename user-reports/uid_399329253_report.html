    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a**\u4e2d\u7b49**\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5b66\u4e60\u5174\u8da3\u4e0e\u53c2\u4e0e\u5ea6\uff08\u79ef\u6781\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u5ba1\u542c\u3001\u4e3b\u52a8\u63d0\u95ee\uff09\uff0c\u52a8\u673a\u4ee5\u5174\u8da3\u9a71\u52a8\u548c\u6280\u80fd\u63d0\u5347\u4e3a\u4e3b\u3002\u4f46**\u53d8\u73b0\u52a8\u673a\u4fe1\u53f7\u5f31**\uff0c\u672a\u63d0\u53ca\u63a5\u5355\u3001\u8d5a\u94b1\u7b49\u7ecf\u6d4e\u76ee\u6807\uff0c\u66f4\u591a\u5173\u6ce8\u7ec3\u4e60\u3001\u4e92\u52a8\u548c\u793e\u7fa4\u8ba4\u53ef\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u8f83\u4f4e**\u3002\u5173\u952e\u77ed\u677f\uff1a**\u65e0\u4e13\u4e1a\u5f55\u97f3\u8bbe\u5907**\uff08\u201c\u6211\u8fd8\u6ca1\u6709\u8bbe\u5907\u201d\uff09\uff0c\u4f9d\u8d56\u624b\u673a\u5f55\u97f3\u3002**\u65e0\u4e2a\u4eba\u7535\u8111**\uff08\u9700\u501f\u7528\u5bb6\u4eba\u7535\u8111\u5904\u7406\u6587\u4ef6\uff09\uff0c\u6280\u672f\u64cd\u4f5c\u5b58\u5728\u969c\u788d\u3002\u65f6\u95f4\u8d44\u6e90\u5c1a\u53ef\uff08\u80fd\u53c2\u4e0e\u8bfe\u7a0b\u3001\u5b8c\u6210\u4f5c\u4e1a\uff0c\u4f46\u6709\u5e94\u916c\u7b49\u4e8b\u52a1\uff09\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a**\u9ad8**\u3002\u7528\u6237\u4e92\u52a8\u79ef\u6781\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u4e50\u4e8e\u63a5\u53d7\u53cd\u9988\uff08\u201c\u7ecf\u73ed\u73ed\u786e\u8ba4\u5c31\u653e\u5fc3\u4e86\u201d\uff09\u3002\u9762\u5bf9\u6280\u672f\u95ee\u9898\uff08\u5982\u4f5c\u4e1a\u4e0a\u4f20\u5931\u8d25\u3001\u65e0\u7535\u8111\uff09\u65f6\uff0c\u6001\u5ea6\u79ef\u6781\uff0c\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff08\u201c\u4e0d\u7136\u6211\u53bb\u4e70\u4e2a\u7535\u8111\u5427\u201d\uff09\uff0c\u65e0\u62b1\u6028\u6216\u653e\u5f03\u503e\u5411\u3002\u793e\u7fa4\u878d\u5165\u5ea6\u9ad8\uff0c\u4e50\u4e8e\u9f13\u52b1\u4ed6\u4eba\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**\uff1a**\u901a\u8fc7**\u3002\u7528\u6237\u5df2\u4ed8\u8d39\u5165\u73ed\uff0c\u5904\u4e8e\u8bfe\u7a0b\u670d\u52a1\u5468\u671f\u5185\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u901a\u8fc7**\u3002\u804a\u5929\u8bb0\u5f55\u4e2d\u672a\u51fa\u73b0\u5bb6\u5ead\u53cd\u5bf9\u6216\u51b3\u7b56\u6743\u4e89\u8bae\u4fe1\u53f7\u3002\u7528\u6237\u53ef\u81ea\u4e3b\u5b89\u6392\u5b66\u4e60\u65f6\u95f4\uff08\u5305\u62ec\u665a\u4e0a\u8bfe\u7a0b\uff09\uff0c\u5e76\u63d0\u53ca\u4f7f\u7528\u5bb6\u4eba\u7535\u8111\uff0c\u672a\u9047\u963b\u529b\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u7eaf\u5ea6**\uff1a**B\u7c7b\uff08\u5174\u8da3\u63a2\u7d22\u578b\uff09**\u3002\u5b66\u4e60\u884c\u4e3a\u4e3b\u52a8\uff0c\u4f46\u7f3a\u4e4f\u660e\u786e\u7684\u804c\u4e1a\u5316\u6216\u5f3a\u53d8\u73b0\u8bc9\u6c42\u3002\n*   **\u6b65\u9aa42 - \u8d44\u6e90\u5e95\u5ea7**\uff1a**C\u7c7b\uff08\u8d44\u6e90\u53d7\u9650\u578b\uff09**\u3002**\u6838\u5fc3\u77ed\u677f\u5728\u4e8e\u786c\u4ef6\u8bbe\u5907\u7f3a\u5931**\uff08\u65e0\u7535\u8111\u3001\u65e0\u4e13\u4e1a\u5f55\u97f3\u8bbe\u5907\uff09\uff0c\u6784\u6210\u5b66\u4e60\u4e0e\u53d8\u73b0\u7684\u5b9e\u9645\u969c\u788d\u3002\n*   **\u6b65\u9aa43 - \u5fc3\u7406\u5f39\u6027**\uff1a**A\u7c7b\uff08\u9ad8\u97e7\u6027\u578b\uff09**\u3002\u914d\u5408\u5ea6\u9ad8\uff0c\u5fc3\u6001\u5f00\u653e\uff0c\u79ef\u6781\u89e3\u51b3\u95ee\u9898\u3002\n*   **\u7efc\u5408\u5224\u5b9a**\uff1a**B-C-A\u578b\u7528\u6237**\u3002\u5174\u8da3\u9a71\u52a8\u3001\u8d44\u6e90\u53d7\u9650\u4f46\u5fc3\u6001\u79ef\u6781\u7684\u5b66\u4e60\u8005\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b\uff1aT4 \u5174\u8da3\u9a71\u52a8\u63a2\u7d22\u8005**\u3002\n    *   **\u4f9d\u636e**\uff1a\u6838\u5fc3\u9a71\u52a8\u529b\u4e3a\u4e2a\u4eba\u5174\u8da3\u4e0e\u6280\u80fd\u63d0\u5347\uff08\u7ec3\u4e60\u4e0d\u540c\u8bed\u6c14\u3001\u53c2\u4e0e\u5ba1\u542c\u3001\u6b23\u8d4f\u4ed6\u4eba\u4f5c\u54c1\uff09\u3002\u79ef\u6781\u53c2\u4e0e\u793e\u7fa4\uff0c\u4eab\u53d7\u5b66\u4e60\u8fc7\u7a0b\u672c\u8eab\u3002**\u7f3a\u4e4f\u660e\u786e\u7684\u804c\u4e1a\u89c4\u5212\u4e0e\u53d8\u73b0\u7d27\u8feb\u611f**\uff0c\u4e0eT1\uff08\u804c\u4e1a\u8f6c\u578b\uff09\u3001T2\uff08\u526f\u4e1a\u521b\u6536\uff09\u7b49\u539f\u578b\u6709\u663e\u8457\u533a\u522b\u3002\u8d44\u6e90\u77ed\u677f\u660e\u663e\uff0c\u4f46\u5fc3\u6001\u79ef\u6781\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669\u7b49\u7ea7\uff1a\u4f4e**\u3002\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a\u98ce\u9669\u4f4e\u3002\u7528\u6237\u5bf9\u81ea\u8eab\u8fdb\u6b65\u6709\u611f\u77e5\uff08\u201c\u8fd9\u8ba9\u6211\u6709\u70b9\u70b9\u4fe1\u5fc3\u4e86\u201d\uff09\uff0c\u4e14\u6301\u7eed\u83b7\u5f97\u73ed\u4e3b\u4efb\u6b63\u53cd\u9988\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a\u98ce\u9669\u4f4e\u3002\u672a\u63d0\u53ca\u8d39\u7528\u95ee\u9898\u6216\u7ecf\u6d4e\u56f0\u96be\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a\u98ce\u9669\u4f4e\u3002\u7528\u6237\u80fd\u8f83\u597d\u534f\u8c03\u65f6\u95f4\uff0c\u4ec5\u5076\u5c14\u56e0\u4e8b\u8bf7\u5047\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a\u98ce\u9669\u4f4e\u3002\u672a\u89c1\u76f8\u5173\u4fe1\u53f7\u3002\n    5.  **\u9500\u552e\u627f\u8bfa\u672a\u5151\u73b0**\uff1a\u98ce\u9669\u4f4e\u3002\u8bb0\u5f55\u4e2d\u65e0\u8fc7\u5ea6\u627f\u8bfa\u8ff9\u8c61\uff0c\u670d\u52a1\u4e0e\u5ba3\u4f20\u57fa\u672c\u4e00\u81f4\u3002\n    6.  **\u670d\u52a1\u8d28\u91cf**\uff1a\u98ce\u9669**\u4e2d**\u3002**\u4e3b\u8981\u98ce\u9669\u70b9\u5728\u4e8e\u786c\u4ef6\u95e8\u69db\u53ef\u80fd\u5bfc\u81f4\u7684\u8fdb\u9636\u4f53\u9a8c\u53d7\u963b**\u3002\u65e0\u8bbe\u5907\u53ef\u80fd\u5f71\u54cd\u540e\u671f\u8bfe\u7a0b\u53c2\u4e0e\u3001\u4f5c\u54c1\u8d28\u91cf\u53ca\u8bd5\u97f3\u673a\u4f1a\uff0c\u957f\u671f\u53ef\u80fd\u4ea7\u751f\u632b\u8d25\u611f\u3002\n    7.  **\u7ade\u54c1\u6bd4\u8f83/\u5174\u8da3\u8f6c\u79fb**\uff1a\u98ce\u9669\u4f4e\u3002\u5f53\u524d\u7528\u6237\u6295\u5165\u5ea6\u9ad8\uff0c\u672a\u89c1\u5206\u5fc3\u4fe1\u53f7\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u4f26\u7406\u9632\u7ebf**\uff1a\u65e0\u8d8a\u754c\u6c9f\u901a\u3001\u60c5\u611f\u7ed1\u67b6\u6216\u865a\u5047\u627f\u8bfa\u8ff9\u8c61\u3002\u4e92\u52a8\u56f4\u7ed5\u6559\u5b66\u4e0e\u7ec3\u4e60\u5c55\u5f00\u3002\n*   **\u9500\u552e\u5408\u89c4**\uff1a\u73ed\u4e3b\u4efb\u6c9f\u901a\u4ee5\u5e03\u7f6e\u4f5c\u4e1a\u3001\u89e3\u7b54\u7591\u95ee\u3001\u7ed9\u4e88\u9f13\u52b1\u4e3a\u4e3b\uff0c\u672a\u53d1\u73b0\u8fdd\u89c4\u50ac\u5355\u3001\u5938\u5927\u6536\u76ca\u7b49\u884c\u4e3a\u3002**\u98ce\u9669\u63d0\u793a**\uff1a\u9700\u5173\u6ce8\u7528\u6237\u201c\u65e0\u8bbe\u5907\u201d\u60c5\u51b5\uff0c\u907f\u514d\u5f15\u5bfc\u5176\u4ea7\u751f\u4e0d\u5207\u5b9e\u9645\u7684\u201c\u5feb\u901f\u63a5\u5355\u201d\u9884\u671f\uff0c\u5e94\u5408\u7406\u7ba1\u7406\u5176\u53d8\u73b0\u671f\u671b\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**\uff1a**\u504f\u5dee**\u3002\u5f53\u524d\u8bfe\u7a0b\u4f53\u7cfb\u5305\u542b\u540e\u671f\u3001\u8bd5\u97f3\u7b49\u5bf9\u8bbe\u5907\u6709\u8981\u6c42\u7684\u6a21\u5757\uff0c\u4e0e\u7528\u6237**\u65e0\u7535\u8111\u3001\u65e0\u4e13\u4e1a\u8bbe\u5907**\u7684\u73b0\u72b6\u5b58\u5728\u9519\u914d\u3002\u7528\u6237\u5174\u8da3\u4e0e\u8bfe\u7a0b\u5185\u5bb9\u5339\u914d\uff0c\u4f46\u786c\u4ef6\u6761\u4ef6\u9650\u5236\u4e86\u90e8\u5206\u529f\u80fd\u7684\u4f53\u9a8c\u4e0e\u4ef7\u503c\u83b7\u53d6\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**\u9996\u5468\u5185\u8fdb\u884c\u8bbe\u5907\u6478\u5e95\u4e0e\u9884\u671f\u7ba1\u7406**\u3002\n*   **\u5177\u4f53\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u8bbe\u5907\u60c5\u51b5\u6478\u5e95**\uff1a\u4e3b\u52a8\u79c1\u804a\uff0c\u8be6\u7ec6\u4e86\u89e3\u7528\u6237\u8bbe\u5907\u73b0\u72b6\uff08\u624b\u673a\u578b\u53f7\u3001\u662f\u5426\u6709\u8d2d\u7f6e\u7535\u8111/\u9ea6\u514b\u98ce\u8ba1\u5212\u53ca\u9884\u7b97\uff09\uff0c\u8bc4\u4f30\u5176\u6301\u7eed\u5b66\u4e60\u7684\u786c\u4ef6\u53ef\u884c\u6027\u3002\n    2.  **\u9884\u671f\u6821\u6b63**\uff1a\u660e\u786e\u544a\u77e5\u8bfe\u7a0b\u4e2d\u54ea\u4e9b\u73af\u8282\uff08\u5982\u540e\u671f\u5236\u4f5c\u3001\u9ad8\u8d28\u91cf\u8bd5\u97f3\uff09\u5bf9\u8bbe\u5907\u6709\u786c\u6027\u8981\u6c42\uff0c\u54ea\u4e9b\u7ec3\u4e60\uff08\u5982\u57fa\u7840\u6f14\u64ad\u3001\u8bed\u6c14\u8bad\u7ec3\uff09\u7528\u624b\u673a\u5373\u53ef\u5b8c\u6210\u3002**\u7ba1\u7406\u5176\u53d8\u73b0\u9884\u671f**\uff0c\u5f3a\u8c03\u524d\u671f\u4ee5\u592f\u5b9e\u57fa\u7840\u4e3a\u4e3b\u3002\n    3.  **\u63d0\u4f9b\u66ff\u4ee3\u65b9\u6848**\uff1a\u9488\u5bf9\u65e0\u7535\u8111\u7528\u6237\uff0c\u63d0\u4f9b\u624b\u673a\u7aef\u53ef\u64cd\u4f5c\u7684\u7b80\u5316\u7248\u4f5c\u4e1a\u63d0\u4ea4\u4e0e\u7ec3\u4e60\u65b9\u6848\u3002\u5f15\u5bfc\u5176\u5173\u6ce8\u73b0\u9636\u6bb5\u53ef\u63d0\u5347\u7684\u201c\u620f\u611f\u201d\u3001\u201c\u8bed\u611f\u201d\u90e8\u5206\u3002\n    4.  **\u6301\u7eed\u9f13\u52b1\u4e0e\u8d4b\u80fd**\uff1a\u5145\u5206\u5229\u7528\u5176\u9ad8\u5fc3\u7406\u5f39\u6027\u548c\u793e\u7fa4\u53c2\u4e0e\u5ea6\uff0c\u591a\u7ed9\u4e88\u6b63\u5411\u53cd\u9988\uff0c\u5c06\u5176\u6811\u7acb\u4e3a\u201c\u79ef\u6781\u7ec3\u4e60\u201d\u7684\u699c\u6837\uff0c\u5f3a\u5316\u5176\u5174\u8da3\u9a71\u52a8\u7684\u5b66\u4e60\u52a8\u673a\u3002\n    5.  **\u98ce\u9669\u76d1\u63a7**\uff1a\u957f\u671f\u5173\u6ce8\u7528\u6237\u56e0\u8bbe\u5907\u9650\u5236\u5728\u8bfe\u7a0b\u540e\u671f\uff08\u5982\u8bd5\u97f3\u3001\u540e\u671f\u8bfe\uff09\u53ef\u80fd\u4ea7\u751f\u7684\u632b\u8d25\u611f\uff0c\u53ca\u65f6\u4ecb\u5165\u758f\u5bfc\u6216\u8c03\u6574\u5b66\u4e60\u5efa\u8bae\u3002\n\n{\"core_type\": \"T4 \u5174\u8da3\u9a71\u52a8\u63a2\u7d22\u8005\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u9996\u5468\u5185\u8bbe\u5907\u6478\u5e95\u4e0e\u9884\u671f\u7ba1\u7406\"}";
