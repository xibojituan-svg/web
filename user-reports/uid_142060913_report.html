    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a (UID: 142060913)\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u9ad8)**: \u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5174\u8da3\u9a71\u52a8\u548c\u804c\u4e1a\u53d1\u5c55\u5bfc\u5411\u3002\u4e3b\u52a8\u53c2\u4e0e\u8bfe\u7a0b\u6d3b\u52a8\uff08\u5982pia\u620f\u3001\u8bc1\u4e66\u8003\u8bd5\uff09\u3001\u79ef\u6781\u5e2e\u52a9\u540c\u5b66\u3001\u5206\u4eab\u5b66\u4e60\u8d44\u6599\uff0c\u5e76\u660e\u786e\u8868\u793a\u201c\u5f88\u559c\u6b22\u54b1\u4eec\u6709\u58f0\u8fd9\u4e2a\u884c\u4e1a\u201d\u3001\u201c\u4e5f\u60f3\u4ee5\u540e\u7ee7\u7eed\u597d\u597d\u505a\u4e0b\u53bb\u201d\u3002**\u52a8\u673a\u6e05\u6670\uff0c\u975e\u51b2\u52a8\u6216\u76f2\u76ee\u8ddf\u98ce\u3002**\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d)**: \u5177\u5907\u57fa\u672c\u7684\u5b66\u4e60\u5de5\u5177\uff08\u5982AU\u8f6f\u4ef6\uff09\u548c\u5b66\u4e60\u65f6\u95f4\uff08\u80fd\u53c2\u4e0e\u665a\u95f4\u70b9\u8bc4\uff09\u3002\u5bf9\u8fdb\u9636\u6d88\u8d39\uff08\u5982\u5927\u5e08\u73ed\uff09\u8868\u73b0\u51fa\u5ba1\u614e\u6001\u5ea6\uff0c\u9700\u201c\u8ddf\u5bb6\u91cc\u4eba\u5546\u91cf\u201d\uff0c\u6700\u7ec8\u9009\u62e9\u653e\u5f03\uff0c\u8868\u660e\u5176**\u53ef\u81ea\u7531\u652f\u914d\u7684\u8d44\u91d1\u6216\u5bb6\u5ead\u652f\u6301\u5ea6\u6709\u9650**\u3002\u4f46\u613f\u610f\u4e3a\u8fd0\u8425\u8bfe\u7a0b\u4ed8\u8d39\uff082899\u5143\uff09\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u652f\u4ed8\u80fd\u529b\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u9ad8)**: \u5b66\u4e60\u6001\u5ea6\u79ef\u6781\uff0c\u60c5\u7eea\u7a33\u5b9a\u4e14\u4e50\u4e8e\u52a9\u4eba\u3002\u5728\u793e\u7fa4\u4e2d\u626e\u6f14\u201c\u5c0f\u52a9\u624b\u201d\u89d2\u8272\uff0c\u4e3b\u52a8\u7ef4\u62a4\u79e9\u5e8f\u3001\u89e3\u7b54\u540c\u5b66\u7591\u95ee\u3001\u5206\u4eab\u7ecf\u9a8c\uff08\u5982\u201c\u4e3b\u6253\u4e00\u4e2a\u542c\u8bdd\u2026\u575a\u6301\u5c31\u6709\u610f\u4e49\u201d\uff09\u3002\u9762\u5bf9\u8bfe\u7a0b\u8c03\u6574\uff08\u5982\u8003\u8bd5\u5ef6\u671f\uff09\u80fd\u5e73\u548c\u63a5\u53d7\u3002**\u6297\u538b\u80fd\u529b\u548c\u793e\u7fa4\u878d\u5165\u5ea6\u6781\u9ad8\u3002**\n\n## 2. ABCD\u5224\u5b9a\u6811\u6267\u884c\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: \u5df2\u652f\u4ed8\u8fd0\u8425\u8bfe\u7a0b\u8d39\u7528\uff082899\u5143\uff09\u3002**\u652f\u4ed8\u5b8c\u6210\uff0c\u8fdb\u5165\u4e0b\u4e00\u6b65\u3002**\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: \u5728\u62d2\u7edd\u5927\u5e08\u73ed\u65f6\u63d0\u53ca\u201c\u8ddf\u5bb6\u91cc\u4eba\u5546\u91cf\u4e86\u4e0b\u201d\uff0c\u8868\u660e**\u91cd\u5927\u6d88\u8d39\u51b3\u7b56\u9700\u5bb6\u5ead\u77e5\u60c5\u6216\u540c\u610f**\u3002\u4f46\u540e\u7eed\u81ea\u4e3b\u51b3\u5b9a\u5e76\u652f\u4ed8\u8fd0\u8425\u8bfe\u7a0b\u8d39\u7528\uff0c\u663e\u793a\u5bf9\u4e2d\u7b49\u989d\u5ea6\u6d88\u8d39\u6709\u4e00\u5b9a\u81ea\u4e3b\u6743\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u7eaf\u5ea6 (A)**: \u9ad8\u3002\u5b66\u4e60\u884c\u4e3a\u6301\u7eed\u3001\u4e3b\u52a8\uff0c\u76ee\u6807\u660e\u786e\u3002\n*   **\u6b65\u9aa42 - \u8d44\u6e90\u5e95\u5ea7 (B)**: \u4e2d\u3002\u6709\u57fa\u7840\u5b66\u4e60\u6761\u4ef6\uff0c\u4f46\u5bf9\u9ad8\u989d\u589e\u503c\u670d\u52a1\uff08\u5927\u5e08\u73ed\uff09\u8c28\u614e\u3002\n*   **\u6b65\u9aa43 - \u5fc3\u7406\u5f39\u6027 (A)**: \u9ad8\u3002\u793e\u7fa4\u53c2\u4e0e\u5ea6\u9ad8\uff0c\u60c5\u7eea\u79ef\u6781\uff0c\u9002\u5e94\u6027\u5f3a\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**: **A-B-A\u578b\u7528\u6237**\u3002\u9ad8\u52a8\u673a\u3001\u9ad8\u5f39\u6027\uff0c\u4f46\u8d44\u6e90\uff08\u5c24\u5176\u662f\u7ecf\u6d4e\u8d44\u6e90\uff09\u6709\u9650\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b: T4 \u52a1\u5b9e\u8fdb\u53d6\u8005**\n    *   **\u7279\u5f81\u543b\u5408**: \u76ee\u6807\u660e\u786e\uff08\u6709\u58f0\u884c\u4e1a\u804c\u4e1a\u5316\uff09\uff0c\u5b66\u4e60\u884c\u52a8\u529b\u5f3a\uff08\u4e3b\u52a8\u8003\u8bc1\u3001\u62a5\u8bfe\uff09\uff0c\u79ef\u6781\u53c2\u4e0e\u793e\u7fa4\u5e76\u62c5\u4efb\u652f\u6301\u89d2\u8272\u3002\u6d88\u8d39\u7406\u6027\uff0c\u5728\u201c\u559c\u6b22\u201d\u548c\u201c\u5fc5\u8981\u201d\u4e4b\u95f4\u6743\u8861\uff08\u653e\u5f03\u5927\u5e08\u73ed\uff0c\u9009\u62e9\u8fd0\u8425\u8bfe\uff09\u3002\u5fc3\u6001\u6210\u719f\uff0c\u80fd\u63d0\u4f9b\u6b63\u5411\u60c5\u7eea\u4ef7\u503c\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4f4e)\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**: \u98ce\u9669\u4f4e\u3002\u7528\u6237\u8ba4\u77e5\u6e05\u6670\uff08\u201c\u542c\u8bdd\u5c31\u80fd\u6709\u7ed3\u679c\u201d\uff09\uff0c\u5bf9\u5b66\u4e60\u8fc7\u7a0b\u6709\u5408\u7406\u9884\u671f\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**: \u98ce\u9669**\u4e2d\u4f4e**\u3002\u7528\u6237\u5bf9\u9ad8\u989d\u6d88\u8d39\u654f\u611f\uff08\u5927\u5e08\u73ed\uff09\uff0c\u4f46\u5df2\u4e3a\u8fd0\u8425\u8bfe\u4ed8\u8d39\uff0c\u663e\u793a\u7ecf\u8fc7\u6743\u8861\u3002\u9700\u5173\u6ce8\u5176\u540e\u7eed\u53d8\u73b0\u8282\u594f\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**: \u98ce\u9669\u6781\u4f4e\u3002\u7528\u6237\u65f6\u95f4\u5b89\u6392\u89c4\u5f8b\uff0c\u80fd\u6301\u7eed\u53c2\u4e0e\u665a\u95f4\u6d3b\u52a8\u3002\n    4.  **\u8bfe\u7a0b\u8d28\u91cf\u5f02\u8bae**: \u98ce\u9669\u6781\u4f4e\u3002\u7528\u6237\u5bf9\u8bfe\u7a0b\u548c\u8001\u5e08\uff08\u201c\u571f\u73ed\u201d\u3001\u201c\u5f20\u5e08\u5085\u201d\uff09\u8868\u73b0\u51fa\u8ba4\u53ef\u548c\u5c0a\u91cd\u3002\n    5.  **\u670d\u52a1\u4f53\u9a8c**: \u98ce\u9669\u6781\u4f4e\u3002\u7528\u6237\u4e0e\u73ed\u73ed\u6c9f\u901a\u987a\u7545\uff0c\u4e14\u81ea\u8eab\u626e\u6f14\u670d\u52a1\u652f\u6301\u89d2\u8272\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9**: \u98ce\u9669**\u4f4e**\u3002\u5bb6\u5ead\u5bf9\u91cd\u5927\u6d88\u8d39\u6709\u77e5\u60c5\u6743\uff0c\u4f46\u672a\u963b\u6b62\u5176\u4e2d\u7b49\u989d\u5ea6\u6d88\u8d39\u3002\u9700\u4fdd\u6301\u5173\u6ce8\u3002\n    7.  **\u7ade\u54c1\u8f6c\u79fb**: \u98ce\u9669\u4f4e\u3002\u7528\u6237\u5df2\u5f62\u6210\u793e\u7fa4\u5f52\u5c5e\u611f\u548c\u5b66\u4e60\u8def\u5f84\u4f9d\u8d56\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u65e0\u663e\u8457\u98ce\u9669**\u3002\u9500\u552e\u6c9f\u901a\u4e2d\u672a\u53d1\u73b0\u5938\u5927\u627f\u8bfa\u3001\u5236\u9020\u7126\u8651\u6216\u8bf1\u5bfc\u501f\u8d37\u884c\u4e3a\u3002\u7528\u6237\u51b3\u7b56\u57fa\u4e8e\u81ea\u8eab\u5174\u8da3\u548c\u7406\u6027\u5224\u65ad\u3002\n*   **\u6ce8\u610f\u70b9**: \u7528\u6237\u63d0\u53ca\u201c\u8ddf\u5bb6\u91cc\u4eba\u5546\u91cf\u201d\uff0c\u9500\u552e\u540e\u7eed\u672a\u6df1\u5165\u8ffd\u95ee\u6216\u65bd\u538b\uff0c\u7b26\u5408\u5408\u89c4\u8981\u6c42\u3002\u7528\u6237\u5bf9AI\u97f3\u526a\u7684\u7591\u95ee\u5f97\u5230\u4e86\u6e05\u6670\u3001\u5ba2\u89c2\u7684\u89e3\u7b54\uff08\u529f\u80fd\u5bf9\u6bd4\u3001\u8d39\u7528\u8bf4\u660e\uff09\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**: **\u5339\u914d**\u3002\u8fd0\u8425\u8bfe\u7a0b\u7b26\u5408\u5176\u804c\u4e1a\u5316\u53d1\u5c55\u9700\u6c42\u3002\u7528\u6237\u5bf9\u5927\u5e08\u73ed\u7684\u653e\u5f03\u662f\u7406\u6027\u51b3\u7b56\uff0c\u975e\u4ea7\u54c1\u9519\u914d\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **\u9996\u5468\u5f3a\u5316\u4ef7\u503c\u4ea4\u4ed8\u4e0e\u53d8\u73b0\u8def\u5f84\u5f15\u5bfc**\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**:\n    1.  **\u4ef7\u503c\u951a\u5b9a**: \u5728\u8fd0\u8425\u8bfe\u5f00\u8bfe\u9996\u5468\uff0c\u91cd\u70b9\u5411\u5176\u5c55\u793a\u8bfe\u7a0b\u5185\u5bb9\u4e0e\u201c\u6709\u58f0\u5de5\u5382\u76f4\u901a\u8f66\u201d\u7b49\u798f\u5229\u7684\u76f4\u63a5\u5173\u8054\uff0c\u5f3a\u5316\u5176\u201c\u6295\u8d44\u503c\u5f97\u201d\u7684\u8ba4\u77e5\u3002\n    2.  **\u8def\u5f84\u89c4\u5212**: \u57fa\u4e8e\u5176\u201c\u5c0f\u52a9\u624b\u201d\u7279\u8d28\u548c\u5df2\u6709\u7ecf\u9a8c\uff0c\u534f\u52a9\u5176\u5236\u5b9a\u6e05\u6670\u7684\u3001\u9636\u6bb5\u6027\u7684\u5b66\u4e60\u4e0e\u8bd5\u97f3/\u63a5\u4e66\u76ee\u6807\u3002\u5c06\u5176\u52a9\u4eba\u70ed\u60c5\u8f6c\u5316\u4e3a\u53ef\u91cf\u5316\u7684\u6210\u957f\u91cc\u7a0b\u7891\u3002\n    3.  **\u8d44\u6e90\u94fe\u63a5**: \u56e0\u5176\u8d44\u6e90\u5e95\u5ea7\u4e2d\u7b49\uff0c\u4f18\u5148\u5f15\u5bfc\u5176\u5229\u7528\u597d\u73b0\u6709\u8bfe\u7a0b\u3001\u793e\u7fa4\u8d44\u6e90\uff0c\u907f\u514d\u8fc7\u65e9\u63a8\u8350\u9ad8\u989d\u9644\u52a0\u4ea7\u54c1\u3002\u53ef\u9f13\u52b1\u5176\u5206\u4eab\u5b66\u4e60\u5fc3\u5f97\uff0c\u5de9\u56fa\u5176\u201c\u699c\u6837\u5b66\u5458\u201d\u5730\u4f4d\u3002\n    4.  **\u5bb6\u5ead\u5173\u7cfb\u7ef4\u62a4**: \u5728\u540e\u7eed\u6c9f\u901a\u4e2d\uff0c\u53ef\u81ea\u7136\u8be2\u95ee\u5b66\u4e60\u8fdb\u5c55\u662f\u5426\u4e0e\u5bb6\u4eba\u5206\u4eab\uff0c**\u5c06\u5bb6\u4eba\u7684\u201c\u77e5\u60c5\u201d\u8f6c\u5316\u4e3a\u201c\u652f\u6301\u201d**\uff0c\u4f8b\u5982\u9f13\u52b1\u5176\u7528\u5b66\u4e60\u6210\u679c\u6216\u5c0f\u989d\u6536\u76ca\u83b7\u5f97\u5bb6\u5ead\u8ba4\u53ef\u3002\n    5.  **\u98ce\u9669\u76d1\u63a7**: \u5173\u6ce8\u5176\u8fd0\u8425\u8bfe\u5b66\u4e60\u540e\u7684\u5b9e\u8df5\u5e94\u7528\u548c\u53d8\u73b0\u8fdb\u5c55\u3002\u82e5\u957f\u671f\u65e0\u6b63\u5411\u53cd\u9988\uff0c\u5176\u52a1\u5b9e\u6027\u683c\u53ef\u80fd\u5bfc\u81f4\u52a8\u529b\u8870\u51cf\u3002\u9700\u53ca\u65f6\u4ecb\u5165\uff0c\u8c03\u6574\u9884\u671f\u6216\u63d0\u4f9b\u989d\u5916\u652f\u6301\u3002\n\n{\"core_type\": \"T4 \u52a1\u5b9e\u8fdb\u53d6\u8005\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u9996\u5468\u5f3a\u5316\u4ef7\u503c\u4ea4\u4ed8\u4e0e\u53d8\u73b0\u8def\u5f84\u5f15\u5bfc\"}";
