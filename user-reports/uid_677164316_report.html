    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4f5c\u4e3a\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677164316\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677164316 (\u6635\u79f0\uff1a\u537f\u6cab) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e - \u68a6\u5883\uff08\u82d7\u96ea\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u5df2\u62a5\u540d2\u4e2a\u6708\u7cbe\u82f1\u73ed\uff0c\u610f\u54114\u4e2a\u6708\u9ad8\u9636\u73ed\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u7528\u5361/\u82b1\u5457\u5206\u671f**\uff08\u9500\u552e\u5f15\u5bfc\u4f7f\u7528\uff0c\u7528\u6237\u989d\u5ea6\u4e0d\u8db3\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u7528\u6237\u672a\u660e\u786e\u8bf4\u660e\uff0c\u4f46\u80fd\u8ddf\u4e0a\u76f4\u64ad\u548c\u4f5c\u4e1a\uff0c\u63a8\u6d4b\u6709\u76f8\u5bf9\u56fa\u5b9a\u7684\u4e1a\u4f59\u65f6\u95f4\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\uff08\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u7528\u6237\u4e3b\u52a8\u5206\u4eab\u4e86\u8fc7\u5f80\u7ecf\u5386\u3001\u5b66\u4e60\u52a8\u673a\u3001\u5fc3\u6001\u548c\u5177\u4f53\u5174\u8da3\u65b9\u5411\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e\uff0c\u4f46\u5fc3\u6001\u52a1\u5b9e\uff0c\u4e0d\u8ffd\u6c42\u201c\u51e0\u5929\u66b4\u5bcc\u201d**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u4e3b\u8981\u662f\u6211\u6709\u76ee\u7684\uff0c\u60f3\u8d5a\u94b1\u201d\uff0c\u4f46\u540c\u65f6\u4e5f\u8ba4\u540c\u201c\u6b65\u5b50\u53ef\u4ee5\u8fc8\u7684\u5c0f\uff0c\u4f46\u8981\u8fc8\u7684\u7a33\u4e00\u70b9\u201d\uff0c\u6709\u5b66\u4e60\u610f\u613f\u548c\u8010\u5fc3\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u76ee\u524d\u80af\u5b9a\u662f\u60f3\u5148\u505a\u517c\u804c\uff0c\u6323\u70b9\u94b1\u5206\u62c5\u4e00\u4e0b\u538b\u529b\u3002\u201d\n  > \u201c\u54c8\u54c8\uff0c\u4e3b\u8981\u662f\u6211\u6709\u76ee\u7684\uff0c\u60f3\u8d5a\u94b1[\u5077\u7b11]\u201d\n  > \u201c\u6b65\u5b50\u53ef\u4ee5\u8fc8\u7684\u5c0f\uff0c\u4f46\u8981\u8fc8\u7684\u7a33\u4e00\u70b9[\u5077\u7b11]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 **\u8d44\u91d1\u627f\u8f7d\u529b\uff1a\u2b07\u4f4e (1-4\u5206)** \u2014 **\u6838\u5fc3\u77ed\u677f**\u3002\u660e\u786e\u8868\u793a\u201c\u56ca\u4e2d\u7f9e\u6da9\u201d\uff0c\u65e0\u6cd5\u652f\u4ed8\u66f4\u9ad8\u9636\u8bfe\u7a0b\u8d39\u7528\uff0c\u4fe1\u7528\u5361/\u82b1\u5457\u989d\u5ea6\u4e5f\u4e0d\u591f\u3002\u5b58\u5728\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 **\u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a\u27a1\u4e2d (5-6\u5206)** \u2014 \u80fd\u6309\u65f6\u53c2\u4e0e\u76f4\u64ad\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u63a5\u6536\u5e76\u6267\u884c\u9500\u552e\u6307\u4ee4\uff0c\u8868\u660e\u6709\u76f8\u5bf9\u7a33\u5b9a\u7684\u788e\u7247\u5316\u5b66\u4e60\u65f6\u95f4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 **\u5bb6\u5ead\u652f\u6301\u5ea6\uff1a\u4fe1\u606f\u7f3a\u5931** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff0c\u65e0\u6cd5\u5224\u65ad\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8 (7-8\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u7528\u6237\u66fe\u56e0\u201c\u6f6d\u5dde\u6559\u80b2\u201d\u88ab\u9a97\u516b\u5343\u591a\uff0c\u4ea7\u751f\u5fc3\u7406\u9634\u5f71\uff08\u201c\u6015\u4e86\u6015\u4e86\uff0c\u592a\u96be\u4e86\u201d\uff09\uff0c\u4f46\u5e76\u672a\u56e0\u6b64\u5f7b\u5e95\u653e\u5f03\u6216\u60c5\u7eea\u5d29\u6e83\uff0c\u800c\u662f\u9009\u62e9\u201c\u8bd5\u4e00\u4e0b\u5427\uff0c\u8fd8\u662f\u4e0d\u592a\u7518\u5fc3\u7684\u201d\uff0c\u5e76\u8868\u73b0\u51fa\u201c\u91cf\u529b\u800c\u884c\u201d\u7684\u7406\u6027\u3002\u9762\u5bf9\u64cd\u4f5c\u56f0\u96be\uff08\u4e0a\u4f20\u6587\u4ef6\uff09\u80fd\u81ea\u884c\u5c1d\u8bd5\u89e3\u51b3\uff0c\u9762\u5bf9\u4e0e\u8001\u5e08\u7684\u5dee\u8ddd\uff08\u201c\u4e0d\u592a\u597d\uff0c\u6bd4\u8001\u5e08\u5dee\u8fdc\u4e86\u201d\uff09\u80fd\u8f6c\u5316\u4e3a\u5b66\u4e60\u52a8\u529b\uff08\u201c\u77e5\u9053\u81ea\u5df1\u7684\u4e0d\u8db3\u4e4b\u5904\uff0c\u591a\u52a0\u6539\u5584\u201d\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u4e4b\u524d\u4e5f\u60f3\u8fc7\u505a\u7684\uff0c\u7ed3\u679c\u88ab\u9a97\u4e86[\u6342\u8138]...\u6015\u4e86\u6015\u4e86\uff0c\u592a\u96be\u4e86...\u8bd5\u4e00\u4e0b\u5427\uff0c\u8fd8\u662f\u4e0d\u592a\u7518\u5fc3\u7684\u3002\u4e0d\u8fc7\u8fd8\u662f\u91cf\u529b\u800c\u884c\uff0c\u4e0d\u6562\u518d\u51b2\u52a8\u4e86\uff0c\u4ee3\u4ef7\u592a\u5927[\u88c2\u5f00]\u201d\n  > \u201c\u6211\u600e\u4e48\u4f20\u4e0d\u4e0a\u53bb\u5440\uff0c\u8001\u5e08...\u54e6\uff0c\u53ef\u4ee5\u4e86\u8001\u5e08\u3002\u8bd5\u4e86\u8bd5\u5176\u4ed6\u7684[\u6342\u8138]\u201d\n  > \u201c\u4e0d\u592a\u597d\uff0c\u6bd4\u8001\u5e08\u5dee\u8fdc\u4e86...\u77e5\u9053\u81ea\u5df1\u7684\u4e0d\u8db3\u4e4b\u5904\uff0c\u591a\u52a0\u6539\u5584\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 (Safety Needs)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u56e0\u8fc7\u5f80\u88ab\u9a97\u7ecf\u5386\uff08\u6f6d\u5dde\u6559\u80b2\uff09\u800c\u4ea7\u751f\u7684\u5f3a\u70c8\u4e0d\u5b89\u5168\u611f\u4e0e\u4fe1\u4efb\u5371\u673a**\uff0c\u4ee5\u53ca\u5bf9\u672a\u6765\u7ecf\u6d4e\u72b6\u51b5\u7684\u7126\u8651\uff08\u201c\u5206\u62c5\u4e00\u4e0b\u538b\u529b\u201d\uff09\u3002\u4ed6\u9700\u8981\u7684\u662f\u4e00\u4e2a\u201c\u7a33\u201d\u7684\u3001\u53ef\u9760\u7684\u3001\u4e0d\u4f1a\u91cd\u8e48\u8986\u8f99\u7684\u8def\u5f84\u6765\u4fdd\u969c\u517c\u804c\u6536\u5165\uff0c\u7f13\u89e3\u7ecf\u6d4e\u538b\u529b\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u9632\u62a4\u76fe\u5f0f\u201d\u7684\u5b89\u5168\u611f\u4e0e\u786e\u5b9a\u6027**\u3002\u901a\u8fc7\u5f3a\u8c03\u201c\u559c\u64ad\u662f\u559c\u9a6c\u62c9\u96c5\u751f\u6001\u4f01\u4e1a\u201d\u3001\u201c\u5b98\u65b9\u5927\u5e73\u53f0\u8dd1\u4e0d\u4e86\u201d\u3001\u201c\u7ed9\u4f60\u94fa\u4e00\u6761\u6700\u7a33\u7684\u8def\u201d\u6765\u91cd\u5efa\u4fe1\u4efb\uff0c\u5e76\u7528\u201c\u8010\u5fc3+\u8001\u5e08\u7684\u4e13\u4e1a=\u7a33\u7a33\u7684\u6210\u957f\u201d\u8fd9\u7c7b\u8bdd\u672f\u63d0\u4f9b\u60c5\u7eea\u6258\u5e95\uff0c\u6d88\u9664\u5176\u5bf9\u518d\u6b21\u53d7\u9a97\u548c\u6295\u5165\u65e0\u56de\u62a5\u7684\u6050\u60e7\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2 \u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u8bba** (\u52a1\u5b9e\u53d8\u73b0\u9a71\u52a8\u578b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 **\u5b89\u5168\u672a\u89e6\u53d1**\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u7528\u6237\u867d\u6709\u7ecf\u6d4e\u538b\u529b\uff0c\u4f46\u672a\u63d0\u53ca\u501f\u8d37\u62a5\u540d\uff0c\u4e14\u5fc3\u6001\u7406\u6027\uff08\u201c\u91cf\u529b\u800c\u884c\u201d\uff09\uff0c\u672a\u51fa\u73b0\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\u3002**\u4f46\u9700\u8b66\u60d5\u5176\u56e0\u7ecf\u6d4e\u538b\u529b\u5927\u800c\u53ef\u80fd\u5411T8-D\uff08\u7edd\u8def\u8d4c\u5f92\uff09\u9000\u5316\u7684\u98ce\u9669\u3002**\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u7ecf\u6d4e\u538b\u529b\u53ef\u80fd\u610f\u5473\u7740\u5bb6\u5ead\u8d22\u52a1\u7d27\u5f20\uff0c\u82e5\u5bb6\u4eba\u53cd\u5bf9\u6216\u53d1\u73b0\u5176\u6295\u5165\uff0c\u53ef\u80fd\u5f15\u53d1\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u7528\u6237\u8868\u73b0\u51fa\u826f\u597d\u7684\u6267\u884c\u529b\u548c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\uff0c\u80fd\u8ddf\u4e0a\u8282\u594f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u6709\u88ab\u9a97\u7ecf\u5386\u4f46\u80fd\u81ea\u6211\u8c03\u8282\uff0c\u9047\u6280\u672f\u95ee\u9898\u80fd\u81ea\u884c\u5c1d\u8bd5\u89e3\u51b3\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u9ad8** | **\u6700\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u7528\u6237\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u201c\u5206\u62c5\u538b\u529b\u201d\u7684\u517c\u804c\u53d8\u73b0\u3002\u82e5\u5728\u627f\u8bfa\u5468\u671f\u5185\uff08\u59822-3\u4e2a\u6708\uff09\u672a\u83b7\u5f97\u4efb\u4f55\u5b9e\u8d28\u6027\u7684\u63a5\u5355\u673a\u4f1a\u6216\u5fae\u8584\u6536\u5165\uff0c\u6781\u6613\u56e0\u201c\u6295\u5165\u4ea7\u51fa\u6bd4\u5931\u8861\u201d\u800c\u89e6\u53d1\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c60-90\u5929\uff08\u53732-3\u4e2a\u6708\u540e\uff09**\u3002\u82e5\u6b64\u65f6\u7528\u6237\u4ecd\u672a\u83b7\u5f97\u4efb\u4f55\u53d8\u73b0\u673a\u4f1a\u6216\u53cd\u9988\uff0c\u5176\u56e0\u7ecf\u6d4e\u538b\u529b\u548c\u5bf9\u201c\u7a33\u201d\u7684\u671f\u671b\u843d\u7a7a\u800c\u4ea7\u751f\u7684\u7126\u8651\u5c06\u8fbe\u5230\u9876\u5cf0\uff0c\u9000\u8d39\u98ce\u9669\u6781\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u537f\u6cab\u540c\u5b66\uff0c\u6b22\u8fce\u52a0\u5165\uff01\u77e5\u9053\u4f60\u4e4b\u524d\u6709\u8fc7\u4e0d\u6109\u5feb\u7684\u7ecf\u5386\uff0c\u54b1\u4eec\u8fd9\u6b21\u5c31\u8e0f\u8e0f\u5b9e\u5b9e\u5730\u6765\u3002\u4f60\u7684\u2018\u7a33\u2019\u5b57\u8bc0\u7279\u522b\u5bf9\u8def\uff0c\u6709\u58f0\u884c\u4e1a\u5c31\u662f\u2018\u6162\u5c31\u662f\u5feb\u2019\u3002\u54b1\u4eec\u4e0d\u753b\u5927\u997c\uff0c\u6211\u7ed9\u4f60\u89c4\u5212\u7684\u662f**\u4ece\u753b\u672c\u3001\u7f8e\u5de5\u8fd9\u4e9b\u80fd\u5feb\u901f\u4e0a\u624b\u3001\u7a33\u5b9a\u6709\u5355\u7684\u5c97\u4f4d\u5207\u5165**\uff0c\u5148\u6709\u6536\u5165\u6253\u5e95\uff0c\u518d\u6162\u6162\u7cbe\u8fdb\u6f14\u64ad\u3002\u6bcf\u4e00\u6b65\u90fd\u8d70\u5f97\u7a33\uff0c\u4f60\u7684\u538b\u529b\u624d\u80fd\u771f\u7684\u51cf\u4e0b\u6765\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** (\u4ea7\u54c1\u7ebfA)\u3002\u7528\u6237\u6709\u660e\u786e\u53d8\u73b0\u9700\u6c42\u4e14\u5fc3\u6001\u52a1\u5b9e\uff0c\u9002\u5408\u5f3a\u8c03\u6280\u80fd\u548c\u63a5\u5355\u7684\u8def\u5f84\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n  1.  **\u3010\u7cbe\u786e\u6d3e\u5355\u62e6\u622a\u5305 (B\u6a21\u5757\u53d8\u4f53)\u3011**\uff1a**\u4e25\u7981\u753b\u997c**\u3002\u5fc5\u987b\u660e\u786e\u544a\u77e5\u63a5\u5355\u5e73\u5747\u5468\u671f\uff08\u59822-3\u4e2a\u6708\uff09\uff0c\u5e76\u4f18\u5148\u63a8\u8350**\u753b\u672c\u3001\u5ba1\u542c\u3001\u7f8e\u5de5**\u7b49\u201c\u9700\u6c42\u7a33\u5b9a\u3001\u7ade\u4e89\u76f8\u5bf9\u5c0f\u201d\uff08\u9500\u552e\u539f\u8bdd\uff09\u7684\u5c97\u4f4d\uff0c\u8ba9\u5176\u5feb\u901f\u83b7\u5f97\u6b63\u53cd\u9988\u548c\u5fae\u6536\u5165\uff0c\u5efa\u7acb\u4fe1\u5fc3\u548c\u4fe1\u4efb\u3002\n  2.  **\u3010\u5b89\u5168\u611f\u6784\u5efa\u5305 (C\u6a21\u5757\u53d8\u4f53)\u3011**\uff1a\u9488\u5bf9\u5176\u88ab\u9a97\u7ecf\u5386\uff0c\u73ed\u4e3b\u4efb\u9700\u626e\u6f14\u201c\u53ef\u9760\u9886\u8def\u4eba\u201d\u89d2\u8272\uff0c\u5b9a\u671f\u540c\u6b65\u884c\u4e1a\u771f\u5b9e\u60c5\u51b5\u3001\u63a5\u5355\u6848\u4f8b\uff08\u975e\u5938\u5927\uff09\uff0c\u7528\u4e8b\u5b9e\u548c\u900f\u660e\u5ea6\u91cd\u5efa\u5176\u5b89\u5168\u611f\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n  1.  \u7edd\u4e0d\u5bf9\u5176\u4f7f\u7528\u201c\u6708\u5165\u8fc7\u4e07\u201d\u3001\u201c\u5feb\u901f\u66b4\u5bcc\u201d\u7b49\u8bdd\u672f\u523a\u6fc0\uff0c\u8fd9\u4e0e\u5176\u201c\u7a33\u201d\u7684\u5fc3\u6001\u548c\u88ab\u9a97\u7ecf\u5386\u4e25\u91cd\u51b2\u7a81\u3002\n  2.  \u7edd\u4e0d\u5728\u5176\u672a\u83b7\u5f97\u9996\u6b21\u53d8\u73b0\u4f53\u9a8c\u524d\uff0c\u8fdb\u884c\u4efb\u4f55\u5347\u5355\u63a8\u9500\uff08\u5982\u4ece2\u4e2a\u6708\u53474\u4e2a\u6708\uff09\uff0c\u8fd9\u4f1a\u76f4\u63a5\u89e6\u53d1\u5176\u201c\u518d\u6b21\u88ab\u5272\u97ed\u83dc\u201d\u7684\u8b66\u62a5\u3002\n  3.  \u4e0d\u8981\u53ea\u805a\u7126\u201c\u5f55\u4e66\u201d\uff0c\u5ffd\u89c6\u5176\u5df2\u8868\u8fbe\u7684\u201c\u753b\u672c\u3001\u7f8e\u5de5\u201d\u5174\u8da3\uff0c\u8fd9\u4f1a\u5bfc\u81f4\u5176\u8ba4\u4e3a\u8def\u5f84\u4e0d\u5339\u914d\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u9996\u6b21\u63a5\u5355\u6210\u529f\u524d\u8fdb\u884c\u4efb\u4f55\u5347\u5355**\u3002\u9996\u6b21\u53d8\u73b0\u540e\uff0c\u53ef\u6839\u636e\u5176\u5b9e\u9645\u6536\u5165\u548c\u5b66\u4e60\u8fdb\u5ea6\uff0c\u8c28\u614e\u8bc4\u4f30\u662f\u5426\u63a8\u8350\u66f4\u6df1\u5165\u7684\u8bfe\u7a0b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u76ee\u524d\u80af\u5b9a\u662f\u60f3\u5148\u505a\u517c\u804c\uff0c\u6323\u70b9\u94b1\u5206\u62c5\u4e00\u4e0b\u538b\u529b\u3002**\u201d\n2. > \u201c**\u4e4b\u524d\u4e5f\u60f3\u8fc7\u505a\u7684\uff0c\u7ed3\u679c\u88ab\u9a97\u4e86[\u6342\u8138]...\u6015\u4e86\u6015\u4e86\uff0c\u592a\u96be\u4e86...\u8bd5\u4e00\u4e0b\u5427\uff0c\u8fd8\u662f\u4e0d\u592a\u7518\u5fc3\u7684\u3002\u4e0d\u8fc7\u8fd8\u662f\u91cf\u529b\u800c\u884c\uff0c\u4e0d\u6562\u518d\u51b2\u52a8\u4e86\uff0c\u4ee3\u4ef7\u592a\u5927[\u88c2\u5f00]**\u201d\n3. > \u201c**\u54c8\u54c8\uff0c\u4e3b\u8981\u662f\u6211\u6709\u76ee\u7684\uff0c\u60f3\u8d5a\u94b1[\u5077\u7b11]...\u6b65\u5b50\u53ef\u4ee5\u8fc8\u7684\u5c0f\uff0c\u4f46\u8981\u8fc8\u7684\u7a33\u4e00\u70b9[\u5077\u7b11]**\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4 \u641e\u94b1\u7ed3\u679c\u8bba\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u9700\u6c42\u2014\u2014\u5bfb\u6c42\u4e00\u4efd\u53ef\u9760\u3001\u7a33\u5b9a\u7684\u517c\u804c\u6536\u5165\u4ee5\u7f13\u89e3\u7ecf\u6d4e\u538b\u529b\uff0c\u5e76\u907f\u514d\u518d\u6b21\u53d7\u9a97\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u4e25\u683c\u6267\u884c\u201c\u9006\u5411\u9884\u671f\u7ba1\u7406\u201d\uff0c\u4f18\u5148\u63d0\u4f9b\u753b\u672c/\u7f8e\u5de5\u7b49\u7a33\u5b9a\u5c0f\u5355\u6e20\u9053\uff0c\u5728\u5176\u83b7\u5f97\u9996\u6b21\u6b63\u6536\u76ca\u524d\uff0c\u7edd\u5bf9\u7981\u6b62\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u8bba\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u7cbe\u786e\u6d3e\u5355\u62e6\u622a\u5305 + \u5b89\u5168\u611f\u6784\u5efa\u5305\"}\n```";
