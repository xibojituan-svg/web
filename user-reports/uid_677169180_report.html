        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID 677169180 (\u5fae\u4fe1\u540d: keep awake) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e-\u900d\u9065\u7c7d\u83f2(\u9b4f\u73ca) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u9a6c\u62c9\u96c5\u6500\u767b\u8ba1\u5212\u7cbe\u82f1\u7248\uff08\u9ad8\u9636\u8bfe\u7a0b\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u82b1\u5457\u5206\u671f\u652f\u4ed8**\uff08\u989d\u5ea610000\u5143\uff0c\u6700\u7ec8\u9009\u62e9\u5206\u671f\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5177\u4f53\u4f5c\u606f\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\uff08\u6709\u5b66\u4e60\u4e92\u52a8\u4e0e\u652f\u4ed8\u884c\u4e3a\uff0c\u4f46\u4e2a\u4eba\u80cc\u666f\u4fe1\u606f\u7f3a\u5931\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6709\u58f0\u884c\u4e1a\u53d8\u73b0\u7684\u5174\u8da3\uff08\u4e3b\u52a8\u8be2\u95ee\u5ba1\u542c\u5de5\u4f5c\uff09\uff0c\u4f46\u5e76\u975e\u6781\u7aef\u6025\u8feb\u7684\u201c\u51e0\u5929\u5185\u63d0\u73b0\u201d\u5fc3\u6001\u3002\u5176\u52a8\u673a\u662f\u201c\u5b66\u4e60\u6280\u80fd+\u517c\u804c\u53d8\u73b0\u201d\u7684\u6df7\u5408\u4f53\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08\uff0c\u6211\u60f3\u63a5\u4e2a\u5ba1\u542c\u7684\u5de5\u4f5c\u201d > \u201c\u542c\u5b8c\u8001\u5e08\u7684\u8bb2\u8bfe\uff0c\u5bf9\u5ba1\u542c\u633a\u611f\u5174\u8da3\u7684\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u4f7f\u7528\u82b1\u5457\u5206\u671f\u652f\u4ed87380\u5143\u8bfe\u7a0b\uff0c\u8868\u660e\u6709\u4e00\u5b9a\u652f\u4ed8\u610f\u613f\u4f46\u975e\u5168\u6b3e\u5145\u88d5\uff0c\u5b58\u5728\u5206\u671f\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u4f53\u73b0\u5177\u4f53\u65f6\u95f4\u5b89\u6392\uff0c\u65e0\u6cd5\u5224\u65ad\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b07\u4f4e\u6781\u5371**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u7528\u6237\u5bf9\u9ad8\u65f6\u85aa\u673a\u4f1a\u7684\u7b2c\u4e00\u53cd\u5e94\u662f\u81ea\u6211\u6000\u7591\uff08\u201c\u8fd9\u4e9b\u65f6\u85aa\u592a\u9ad8\u4e86\uff0c\u80fd\u80dc\u4efb\u5417\u201d\uff09\uff0c\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u201c\u4e0d\u914d\u5f97\u611f\u201d\u548c\u4f4e\u81ea\u4fe1\u3002\u9700\u8981\u5916\u90e8\uff08\u9500\u552e\uff09\u7684\u6301\u7eed\u9f13\u52b1\u548c\u201c\u5305\u529e\u5f0f\u201d\u627f\u8bfa\u6765\u83b7\u5f97\u5b89\u5168\u611f\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8fd9\u4e9b\u65f6\u85aa\u592a\u9ad8\u4e86\uff0c\u80fd\u80dc\u4efb\u5417\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 / \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u5f52\u5c5e**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u81ea\u8eab\u80fd\u529b\u6781\u5ea6\u4e0d\u81ea\u4fe1\uff0c\u5bb3\u6015\u5931\u8d25\u548c\u88ab\u6dd8\u6c70\uff0c\u6e34\u671b\u83b7\u5f97\u4e00\u4e2a\u7a33\u5b9a\u3001\u6709\u4fdd\u969c\u7684\u201c\u7ec4\u7ec7\u201d\u4f9d\u9760\u548c\u660e\u786e\u7684\u8def\u5f84\u6307\u5f15\u3002**\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u201c\u88ab\u9009\u4e2d\u201d\u7684\u5b89\u5168\u611f\u4e0e\u201c\u624b\u628a\u624b\u5e26\u4f60\u201d\u7684\u5f52\u5c5e\u611f\u3002** \u9500\u552e\u201c\u5e08\u59d0\u201d\u7684\u4eba\u8bbe\uff08\u5bfc\u6f14\u3001\u6709\u516c\u4f1a\u3001\u6709\u8d44\u6e90\uff09\u548c\u201c\u6211\u7684\u4eba\u201d\u3001\u201c\u62b1\u7d27\u5e08\u59d0\u5927\u817f\u201d\u7b49\u8bdd\u672f\uff0c\u7cbe\u51c6\u5730\u6ee1\u8db3\u4e86\u7528\u6237\u5bf9\u201c\u88ab\u5927\u4f6c\u7f69\u7740\u201d\u7684\u4f9d\u8d56\u5fc3\u7406\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u4e25\u91cd\u5185\u8017) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u867d\u4f7f\u7528\u82b1\u5457\u5206\u671f\uff0c\u4f46\u672a\u63d0\u53ca\u501f\u8d37\u538b\u529b\u6216\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\uff0c\u6682\u672a\u89e6\u53caT8-D\u7ea2\u7ebf\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u5206\u671f\u652f\u4ed8\u53ef\u80fd\u9690\u542b\u5bb6\u5ead\u8d22\u52a1\u538b\u529b\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u4e00\u65e6\u5f00\u8bfe\u540e\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\u3001\u4f5c\u4e1a\u88ab\u6279\u8bc4\uff0c\u6216\u77ed\u671f\u5185\u672a\u83b7\u5f97\u627f\u8bfa\u7684\u201c\u8d44\u6e90\u201d\u548c\u201c\u5e26\u98de\u201d\u611f\uff0c\u6781\u6613\u56e0\u81ea\u6211\u6000\u7591\u800c\u5d29\u6e83\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u4efb\u4f55\u6280\u672f\u632b\u6298\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u5931\u8d25\u3001\u8bd5\u97f3\u672a\u4e2d\u3001\u4f5c\u4e1a\u88ab\u6279\u6539\uff09\u90fd\u53ef\u80fd\u89e6\u53d1\u5176\u201c\u6211\u592a\u7b28\u4e86\u201d\u7684\u8ba4\u77e5\uff0c\u5bfc\u81f4\u77ac\u95f4\u653e\u5f03\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | \u5bf9\u9500\u552e\u63cf\u7ed8\u7684\u201c\u5e08\u59d0\u5e26\u4f60\u201d\u3001\u201c\u5185\u5b9a\u7248\u6743\u4e66\u201d\u62b1\u6709\u4e0d\u5207\u5b9e\u9645\u7684\u671f\u5f85\uff0c\u82e5\u5b9e\u9645\u63a5\u5355\u901f\u5ea6\u6162\u3001\u6536\u76ca\u4f4e\uff0c\u4f1a\u4ea7\u751f\u5f3a\u70c8\u7684\u88ab\u6b3a\u9a97\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u6b63\u5f0f\u8bfe\u96be\u5ea6\u63d0\u5347\uff0c\u82e5\u7b2c\u4e00\u6b21\u72ec\u7acb\u4f5c\u4e1a\u6216\u8bd5\u97f3\u906d\u9047\u632b\u6298\uff0c\u9000\u8d39\u98ce\u9669\u6781\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4eb2\u7231\u7684\uff0c\u6211\u662f\u4f60\u7684\u73ed\u73ed\u5b89\u5b89\u3002\u770b\u5230\u4f60\u9009\u62e9\u4e86\u6211\u4eec\uff0c\u7279\u522b\u4e3a\u4f60\u5f00\u5fc3\uff01\u6211\u77e5\u9053\u4f60\u53ef\u80fd\u5fc3\u91cc\u4f1a\u6709\u70b9\u6253\u9f13\uff0c\u62c5\u5fc3\u81ea\u5df1\u8ddf\u4e0d\u4e0a\u6216\u8005\u505a\u4e0d\u597d\uff0c\u8fd9\u592a\u6b63\u5e38\u4e86\u3002**\u8bf7\u4e00\u5b9a\u8bb0\u4f4f\uff0c\u4f60\u4e0d\u662f\u4e00\u4e2a\u4eba\u5728\u6218\u6597\uff0c\u4ece\u4eca\u5929\u8d77\uff0c\u6709\u4efb\u4f55\u5361\u4f4f\u7684\u5730\u65b9\u3001\u4efb\u4f55\u89c9\u5f97\u81ea\u5df1\u2018\u4e0d\u884c\u2019\u7684\u77ac\u95f4\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u624b\u628a\u624b\u5e26\u4f60\u8fc7\u53bb\u3002\u54b1\u4eec\u4e0d\u8ddf\u522b\u4eba\u6bd4\uff0c\u53ea\u8ddf\u6628\u5929\u7684\u81ea\u5df1\u6bd4\uff0c\u54ea\u6015\u6bcf\u5929\u53ea\u8fdb\u6b65\u4e00\u70b9\u70b9\uff0c\u73ed\u73ed\u90fd\u7ed9\u4f60\u7ad6\u5927\u62c7\u6307\uff01**\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf**\u3011\u3002\u6838\u5fc3\u662f\u63d0\u4f9b\u5b89\u5168\u611f\uff0c\u800c\u975e\u65bd\u52a0\u538b\u529b\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u6ee1\u914d\u3010**\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305 (C\u6a21\u5757)**\u3011\u3002\u73ed\u4e3b\u4efb\u9700\u9ad8\u9891\u4f7f\u7528\u201c\u5938\u5f20\u8d5e\u7f8e\u8bdd\u672f\u8d34\u7eb8\u201d\uff0c\u62ff\u8d70\u6240\u6709\u64cd\u4f5c\u96be\u9898\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u3001\u4f5c\u4e1a\u63d0\u4ea4\uff09\uff0c\u63d0\u4f9b\u201c\u6309\u952e\u7ea7\u7269\u7406\u6295\u5582\u201d\u3002**\u4e25\u7981**\u5728\u521d\u671f\u63a8\u9001\u9ad8\u96be\u5ea6B\u6a21\u5757\uff08\u786c\u6838\u6280\u672f\uff09\u5185\u5bb9\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u7528\u4e25\u5389\u6216\u5bf9\u6bd4\u5f0f\u70b9\u8bc4\u6253\u51fb\u5176\u81ea\u4fe1\uff1b2. \u8fc7\u65e9\u50ac\u4fc3\u5176\u53c2\u4e0e\u9ad8\u7ade\u4e89\u6027\u8bd5\u97f3\uff1b3. \u63d0\u53ca\u201c\u522b\u4eba\u90fd\u5982\u4f55\u5982\u4f55\u4f18\u79c0\u201d\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u57fa\u7840\u6280\u80fd\u672a\u7a33\u56fa\u3001\u9996\u6b21\u6210\u529f\u4f53\u9a8c\u672a\u8fbe\u6210\u524d\u8fdb\u884c\u4efb\u4f55\u5347\u5355\u63a8\u9500**\u3002\u5fc5\u987b\u5148\u5e2e\u52a9\u5176\u5efa\u7acb\u201c\u6211\u80fd\u884c\u201d\u7684\u6700\u5c0f\u6210\u529f\u95ed\u73af\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u8fd9\u4e9b\u65f6\u85aa\u592a\u9ad8\u4e86\uff0c\u80fd\u80dc\u4efb\u5417\u201d \u2014 **\u5178\u578b\u4f4e\u5fc3\u7406\u5f39\u6027\u4fe1\u53f7\uff0c\u9762\u5bf9\u673a\u4f1a\u7b2c\u4e00\u53cd\u5e94\u662f\u81ea\u6211\u6000\u7591\u548c\u9000\u7f29\u3002**\n2. > \u201c\u597d\u7684\u8c22\u8c22\u201d\u3001\u201c\u9ebb\u70e6\u8001\u5e08\u518d\u53d1\u4e00\u4e0b\u201d\u3001\u201c\u8c22\u8c22\u8001\u5e08\uff0c\u8f9b\u82e6\u4e86\u201d \u2014 **\u793c\u8c8c\u4f46\u88ab\u52a8\uff0c\u4f9d\u8d56\u6027\u5f3a\uff0c\u7f3a\u4e4f\u4e3b\u52a8\u63a2\u7d22\u548c\u89e3\u51b3\u95ee\u9898\u7684\u610f\u613f\u3002**\n3. > \u5bf9\u9500\u552e\u957f\u8fbe\u6570\u5206\u949f\u7684\u201c\u4e2a\u4eba\u6210\u529f\u53f2\u201d\u5206\u4eab\u4ec5\u56de\u590d\u201c\u8c22\u8c22\u8001\u5e08\u201d\u3001\u201c\u55ef\u55ef\u201d \u2014 **\u8868\u660e\u5176\u66f4\u5173\u6ce8\u201c\u88ab\u627f\u8bfa\u201d\u7684\u7ed3\u679c\uff08\u6709\u5e08\u59d0\u5e26\uff09\uff0c\u800c\u975e\u5177\u4f53\u7684\u5b66\u4e60\u8def\u5f84\u548c\u65b9\u6cd5\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u4e0e\u5f52\u5c5e\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u81f4\u7684\u60c5\u611f\u6258\u5e95\u4e0e\u50bb\u74dc\u5f0f\u6b65\u9aa4\u6307\u5f15\uff0c\u4e25\u9632\u4efb\u4f55\u5f62\u5f0f\u7684\u6280\u672f\u632b\u6298\u6253\u51fb\u5176\u8106\u5f31\u7684\u81ea\u4fe1\u5fc3\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168/\u5f52\u5c5e\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u5973\", \"city\": \"\u5c71\u4e1c\"}\n```";
