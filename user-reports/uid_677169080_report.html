        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v4.1.3)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID 677169080 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-13 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u7f57\u5e03\u6cca(\u4efb\u4f1f) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u9ad8\u9636\u73ed/\u7cbe\u82f1\u73ed (\u4ef7\u683c2380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3** (\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u82b1\u5457\u989d\u5ea6\u4e0d\u591f\u201d\u3001\u201c\u56ca\u4e2d\u7f9e\u6da9\uff01\u73b0\u5728\u771f\u7684\u6ca1\u7c73\u5440\uff01\u201d) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u7528\u6237\u63d0\u53ca\u201c\u6211\u4e2d\u5348\u8981\u6700\u65e912:30\u624d\u4e0b\u73ed\u201d\uff0c\u8868\u660e\u4e3a\u5728\u804c\u72b6\u6001\uff0c\u65f6\u95f4\u53d7\u9650) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3** (\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49** (\u6709\u660e\u786e\u7684\u652f\u4ed8\u80fd\u529b\u4fe1\u53f7\u548c\u52a8\u673a\u8868\u8fbe\uff0c\u4f46\u5bb6\u5ead\u80cc\u666f\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u7b49\u4fe1\u606f\u7f3a\u5931) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6709\u58f0\u884c\u4e1a\u7684\u5174\u8da3\u548c\u5c1d\u8bd5\u610f\u613f\uff08\u201c\u6211\u8981\u505a\u4e3b\u64ad\u201d\uff09\uff0c\u5e76\u79ef\u6781\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u8bd5\u97f3\u3002\u4f46\u6838\u5fc3\u9a71\u52a8\u529b\u4e2d**\u53d8\u73b0\u8bc9\u6c42\u660e\u786e**\uff08\u5173\u6ce8\u4ef7\u683c\u3001\u63a5\u5355\u3001\u7248\u6743\u4e66\uff09\uff0c\u540c\u65f6\u5939\u6742\u7740\u5bf9\u81ea\u8eab\u80fd\u529b\u7684\u62c5\u5fe7\uff08\u201c\u6015\u81ea\u5df1\u4e0d\u80fd\u52a0\u5165\u6709\u58f0\u884c\u4e1a\u201d\uff09\uff0c\u52a8\u673a\u5e76\u975e\u7eaf\u7cb9\u7684\u81ea\u6211\u5b9e\u73b0\u6216\u5174\u8da3\u63a2\u7d22\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08\uff0c\u6211\u7684\u55d3\u5b50\u4e0d\u80fd\u8bf4\u592a\u591a\u8bdd\uff0c\u4e0d\u7136\u4f1a\u54b3\u55fd\u751a\u81f3\u5931\u58f0\uff01\u6240\u4ee5\u6015\u81ea\u5df1\u4e0d\u80fd\u52a0\u5165\u6709\u58f0\u884c\u4e1a\uff01\u201d > \u201c2380\u201d (\u5173\u6ce8\u4ef7\u683c) > \u201c\u6211\u8981\u505a\u4e3b\u64ad\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 **\u8d44\u91d1\u627f\u8f7d\u529b**\uff1a**\u4f4e** \u2014 \u7528\u6237\u660e\u786e\u8868\u793a\u201c\u82b1\u5457\u989d\u5ea6\u4e0d\u591f\u201d\u3001\u201c\u56ca\u4e2d\u7f9e\u6da9\uff01\u73b0\u5728\u771f\u7684\u6ca1\u7c73\u5440\uff01\u201d\uff0c\u5b58\u5728\u660e\u663e\u7684\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 **\u65f6\u95f4\u4e0e\u7cbe\u529b**\uff1a**\u4e2d** \u2014 \u5728\u804c\u72b6\u6001\uff08\u4e2d\u534812:30\u4e0b\u73ed\uff09\uff0c\u4f46\u80fd\u575a\u6301\u5b8c\u6210\u4f53\u9a8c\u8425\u4f5c\u4e1a\u548c\u76f4\u64ad\u6253\u5361\uff0c\u8868\u660e\u6709\u57fa\u672c\u7684\u788e\u7247\u5316\u65f6\u95f4\u6295\u5165\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 **\u5bb6\u5ead\u652f\u6301\u5ea6**\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u27a1\u4e2d**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a**\u3002\u7528\u6237\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u4e0d\u4f1a\u53d1\u8bd5\u97f3\u6587\u4ef6\uff09\u4f1a\u4e3b\u52a8\u6c42\u52a9\uff0c\u5728\u5f97\u5230\u9f13\u52b1\u548c\u6307\u5bfc\u540e\u80fd\u6062\u590d\u4fe1\u5fc3\uff08\u201c\u8c22\u8c22\u8001\u5e08\u7684\u70b9\u8bc4\uff01\u8ba9\u6211\u5bf9\u81ea\u5df1\u591a\u4e86\u5f88\u591a\u4fe1\u5fc3\uff01\u201d\uff09\u3002\u867d\u6709\u81ea\u6211\u6000\u7591\uff08\u55d3\u5b50\u95ee\u9898\uff09\uff0c\u4f46\u5728\u9500\u552e\u5b89\u629a\u540e\u80fd\u7ee7\u7eed\u884c\u52a8\u3002\u672a\u8868\u73b0\u51fa\u6781\u5ea6\u81ea\u5351\u6216\u5d29\u6e83\u8ff9\u8c61\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08\uff0c\u6211\u7684\u55d3\u5b50\u4e0d\u80fd\u8bf4\u592a\u591a\u8bdd\uff0c\u4e0d\u7136\u4f1a\u54b3\u55fd\u751a\u81f3\u5931\u58f0\uff01\u6240\u4ee5\u6015\u81ea\u5df1\u4e0d\u80fd\u52a0\u5165\u6709\u58f0\u884c\u4e1a\uff01\u201d > \u201c\u8c22\u8c22\u8001\u5e08\u7684\u70b9\u8bc4\uff01\u8ba9\u6211\u5bf9\u81ea\u5df1\u591a\u4e86\u5f88\u591a\u4fe1\u5fc3\uff01\u201d > \u201c\u8001\u5e08\uff0c\u6211\u5728\u559c\u739b\u62c9\u96c5\u5f55\u597d\u5355\uff0c\u5b58\u4e3a\u8349\u7a3f\u540e\uff0c\u8be5\u600e\u4e48\u53d1\u5230\u7532\u65b9\u7684QQ\u90ae\u7bb1\uff1f\u6211\u4e0d\u4f1a\u5f04[\u5bb3\u7f9e]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u7ecf\u6d4e\u72b6\u51b5\u7684\u7126\u8651\u4e0e\u5bf9\u804c\u4e1a\u8f6c\u578b\u7684\u4e0d\u786e\u5b9a\u6027**\u3002\u7528\u6237\u6709\u5f3a\u70c8\u7684\u901a\u8fc7\u526f\u4e1a\u589e\u52a0\u6536\u5165\u7684\u613f\u671b\uff0c\u4f46\u53d7\u9650\u4e8e\u5f53\u524d\u8d44\u91d1\u7d27\u5f20\uff08\u82b1\u5457\u989d\u5ea6\u4e0d\u8db3\uff09\uff0c\u540c\u65f6\u5bf9\u81ea\u8eab\u80fd\u529b\uff08\u55d3\u5b50\u6761\u4ef6\uff09\u80fd\u5426\u80dc\u4efb\u5b58\u5728\u7591\u8651\uff0c\u672c\u8d28\u662f\u5bfb\u6c42\u4e00\u4efd\u80fd\u5e26\u6765\u7a33\u5b9a\u611f\u548c\u5b89\u5168\u611f\u7684\u989d\u5916\u6536\u5165\u4fdd\u969c\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u63d0\u4f9b\u6e05\u6670\u7684\u3001\u4f4e\u98ce\u9669\u7684\u53d8\u73b0\u8def\u5f84\u548c\u6301\u7eed\u7684\u4fe1\u5fc3\u652f\u6301**\u3002\u9700\u8981\u5316\u89e3\u5176\u201c\u6295\u5165\u53ef\u80fd\u6253\u6c34\u6f02\u201d\u7684\u7126\u8651\uff0c\u7528\u5177\u4f53\u7684\u3001\u53ef\u5b9e\u73b0\u7684\u77ed\u671f\u76ee\u6807\uff08\u5982\u63a5\u5355\u6d41\u7a0b\u3001\u7248\u6743\u4e66\uff09\u548c\u6301\u7eed\u7684\u6280\u672f\u6307\u5bfc\uff0c\u6784\u5efa\u5176\u201c\u5b89\u5168\u4e0a\u5cb8\u201d\u7684\u4fe1\u5fc3\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u8bba** (\u5b58\u5728\u5411T8-D\u7edd\u8def\u8d4c\u5f92\u9000\u5316\u7684\u98ce\u9669) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a**\u26a0\ufe0f \u9ec4\u8272\u9884\u8b66 (\u4ea4\u6613\u4fe1\u53f7\u786c\u62e6\u622a)**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u8d44\u91d1\u7d27\u5f20\uff0c\u4f7f\u7528\u82b1\u5457\u5206\u671f\u4e14\u989d\u5ea6\u4e0d\u8db3\uff0c\u7b26\u5408**\u4ea4\u6613\u4fe1\u53f7\u786c\u62e6\u622a\u5c42**\u7684\u9884\u8b66\u6761\u4ef6\u3002\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u652f\u4ed8\u884c\u4e3a\u66b4\u9732\u7ecf\u6d4e\u538b\u529b\uff08\u82b1\u5457\u989d\u5ea6\u4e0d\u8db3\uff09\uff0c\u867d\u672a\u51fa\u73b0\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\uff0c\u4f46\u5df2\u6784\u6210**C2\u88c5B\u7c7b**\u98ce\u9669\uff0c\u5fc5\u987b\u6267\u884c48\u5c0f\u65f6\u6478\u5e95\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4e2d | \u82e5\u62a5\u540d\u8d39\u7528\u5f71\u54cd\u5bb6\u5ead\u57fa\u672c\u5f00\u652f\uff0c\u53ef\u80fd\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4e2d | \u5de5\u4f5c\u7e41\u5fd9\u5bfc\u81f4\u5b66\u4e60\u65f6\u95f4\u65e0\u6cd5\u4fdd\u8bc1\uff0c\u4f5c\u4e1a\u79ef\u538b\u4ea7\u751f\u81ea\u8d23\u548c\u632b\u8d25\u611f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u7528\u6237\u5fc3\u7406\u5f39\u6027\u5c1a\u53ef\uff0c\u9047\u632b\u4f1a\u6c42\u52a9\uff0c\u4f46\u9700\u5173\u6ce8\u5176\u201c\u55d3\u5b50\u95ee\u9898\u201d\u5f15\u53d1\u7684\u6301\u7eed\u81ea\u6211\u6000\u7591\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u9ad8** | **\u6700\u5371\u9669\uff01** \u7528\u6237\u6838\u5fc3\u8bc9\u6c42\u662f\u53d8\u73b0\u3002\u82e5\u5728\u627f\u8bfa\u5468\u671f\u5185\uff08\u59822-3\u4e2a\u6708\uff09\u672a\u80fd\u6210\u529f\u63a5\u5355\u6216\u6536\u5165\u8fdc\u4f4e\u4e8e\u9884\u671f\uff0c\u6781\u6613\u56e0\u201c\u6295\u5165\u4ea7\u51fa\u6bd4\u5931\u8861\u201d\u800c\u66b4\u6012\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e60-90\u5929**\u3002\u82e5\u5728\u6b64\u671f\u95f4\u63a5\u5355\u65e0\u679c\u6216\u6536\u5165\u5fae\u8584\uff0c\u6536\u76ca\u843d\u5dee\u611f\u5c06\u8fbe\u5230\u9876\u5cf0\uff0c\u89e6\u53d1\u9000\u8d39\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u770b\u5230\u4f60\u514b\u670d\u5de5\u4f5c\u5fd9\u3001\u55d3\u5b50\u4e0d\u9002\u8fd8\u575a\u6301\u5b66\u4e60\uff0c\u771f\u7684\u5f88\u4f69\u670d\u4f60\u7684\u884c\u52a8\u529b\u3002\u54b1\u4eec\u8fd9\u6761\u8def\u662f\u2018\u6162\u5c31\u662f\u5feb\u2019\uff0c\u524d\u671f\u6253\u597d\u57fa\u7840\uff0c\u540e\u9762\u63a5\u5355\u624d\u7a33\u3002\u522b\u62c5\u5fc3\u55d3\u5b50\uff0c\u79d1\u5b66\u53d1\u58f0\u65b9\u6cd5\u5c31\u662f\u4fdd\u62a4\u55d3\u5b50\u7684\uff0c\u6211\u4f1a\u4e00\u6b65\u6b65\u5e26\u4f60\u3002\u5173\u4e8e\u8d5a\u94b1\uff0c\u6211\u5148\u7ed9\u4f60\u770b\u51e0\u4e2a\u548c\u4f60\u60c5\u51b5\u7c7b\u4f3c\u7684\u5b66\u5458\uff0c\u4ed6\u4eec\u662f\u600e\u4e48\u4ece0\u52301\u63a5\u5230\u7b2c\u4e00\u5355\u7684\uff0c\u54b1\u4eec\u5b9a\u4e2a\u5207\u5b9e\u53ef\u884c\u7684\u2018\u9996\u5355\u5c0f\u76ee\u6807\u2019\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u9700\u5339\u914d\u5176\u53d8\u73b0\u8bc9\u6c42\uff0c\u4f46\u5fc5\u987b**\u4e25\u63a7\u9884\u671f**\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T4\u98ce\u9669\uff0c\u5fc5\u987b\u9644\u52a0**\u3010\u7cbe\u786e\u6d3e\u5355\u62e6\u622a\u5305\u3011**\u3002\u73ed\u4e3b\u4efb\u9700\u4e25\u683c\u628a\u5173\u5176\u521d\u671f\u8bd5\u97f3\u5355\u8d28\u91cf\uff0c\u907f\u514d\u76f2\u76ee\u6d77\u6295\u5bfc\u81f4\u632b\u8d25\u3002\u540c\u65f6\uff0c\u9488\u5bf9\u5176\u8d44\u91d1\u538b\u529b\uff0c\u53ef\u8003\u8651\u8f7b\u91cf\u5316\u7684**\u3010\u60c5\u7eea\u7597\u6108\u966a\u5b66\u5305\u3011**\u4ee5\u7a33\u5b9a\u60c5\u7eea\uff0c\u4f46**\u4e25\u7981\u8fc7\u5ea6\u60c5\u611f\u6295\u5165\u5bfc\u81f4\u4f9d\u8d56**\u3002\n- **\u6838\u5fc3\u8bdd\u672f\u7b56\u7565**\uff1a**\u5e94\u7528\u201c\u9006\u5411\u9884\u671f\u7ba1\u7406\u9632\u5fa1\u6cd5\u201d**\u3002\u5f00\u5b97\u660e\u4e49\u544a\u77e5\u201c\u5e73\u5747\u63a5\u5355\u5468\u671f\u548c\u6536\u5165\u6ce2\u52a8\u6027\u201d\uff0c\u7528\u5b89\u5168\u611f\uff08\u6e05\u6670\u7684\u8def\u5f84\u3001\u53ef\u63a7\u7684\u98ce\u9669\uff09\u66ff\u4ee3\u753b\u997c\u5f0f\u7684\u66b4\u5bcc\u627f\u8bfa\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u7528\u201c\u5b66\u5b8c\u9a6c\u4e0a\u8d5a\u5927\u94b1\u201d\u3001\u201c\u4fdd\u5e95\u6536\u5165\u201d\u7b49\u8bdd\u672f\u523a\u6fc0\u5176\u53d8\u73b0\u7126\u8651\u30022. \u5728\u5176\u672a\u6253\u597d\u57fa\u7840\u65f6\u5c31\u9f13\u52b1\u5176\u6295\u9012\u9ad8\u96be\u5ea6\u3001\u9ad8\u62a5\u916c\u5355\u5b50\u30023. \u5ffd\u89c6\u5176\u7ecf\u6d4e\u538b\u529b\uff0c\u50ac\u4fc3\u5347\u5355\u6216\u8d2d\u4e70\u6602\u8d35\u8bbe\u5907\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5347\u5355**\u3002\u5728\u7528\u6237\u7ecf\u6d4e\u72b6\u51b5\u672a\u6539\u5584\u3001\u4e14\u672a\u5b9e\u73b0\u7a33\u5b9a\u5c0f\u989d\u53d8\u73b0\u524d\uff0c\u7981\u6b62\u63a8\u8350\u4efb\u4f55\u9ad8\u9636\u8bfe\u7a0b\u6216\u786c\u4ef6\u8bbe\u5907\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > **\u201c\u82b1\u5457\u989d\u5ea6\u4e0d\u591f\uff01\u201d** \u2014\u2014 **\u6838\u5fc3\u98ce\u9669\u4fe1\u53f7**\uff0c\u76f4\u63a5\u66b4\u9732\u8d44\u91d1\u77ed\u677f\u548c\u501f\u8d37\u62a5\u540d\u53ef\u80fd\u6027\u3002\n2. > **\u201c\u56ca\u4e2d\u7f9e\u6da9\uff01\u7b49\u4e0b\u6b21\u5427\uff0c\u73b0\u5728\u771f\u7684\u6ca1\u7c73\u5440\uff01\u201d** \u2014\u2014 **\u4e8c\u6b21\u786e\u8ba4\u7ecf\u6d4e\u538b\u529b**\uff0c\u652f\u4ed8\u80fd\u529b\u662f\u6700\u5927\u77ed\u677f\u3002\n3. > **\u201c\u8001\u5e08\uff0c\u6211\u7684\u55d3\u5b50\u4e0d\u80fd\u8bf4\u592a\u591a\u8bdd\uff0c\u4e0d\u7136\u4f1a\u54b3\u55fd\u751a\u81f3\u5931\u58f0\uff01\u6240\u4ee5\u6015\u81ea\u5df1\u4e0d\u80fd\u52a0\u5165\u6709\u58f0\u884c\u4e1a\uff01\u201d** \u2014\u2014 **\u52a8\u673a\u4e0d\u7eaf\u4e14\u4f34\u6709\u81ea\u6211\u6000\u7591**\uff0c\u662f\u5178\u578b\u7684\u201c\u60f3\u641e\u94b1\u4f46\u6015\u80fd\u529b\u4e0d\u8db3\u201d\u7684T4\u5fc3\u6001\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4 \u641e\u94b1\u7ed3\u679c\u8bba\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\uff08\u7ecf\u6d4e\u4fdd\u969c\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u4e25\u683c\u6267\u884c\u9006\u5411\u9884\u671f\u7ba1\u7406 + 48\u5c0f\u65f6\u652f\u4ed8\u6478\u5e95 + \u7cbe\u786e\u6d3e\u5355\u62e6\u622a\u3011**\u3002**\u5fc5\u987b\u62e6\u622a\u4efb\u4f55\u5347\u5355\u884c\u4e3a\uff0c\u4f18\u5148\u786e\u4fdd\u5176\u80fd\u5728\u5b89\u5168\u671f\u5185\uff0890\u5929\uff09\u63a5\u5230\u7b2c\u4e00\u5355\uff0c\u54ea\u6015\u5355\u4ef7\u5f88\u4f4e\uff0c\u4ee5\u5efa\u7acb\u6b63\u5411\u53cd\u9988\u5faa\u73af\u3002**\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u8bba\", \"maslow_need\": \"\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\", \"risk_level\": \"C2\u7c7b-\u9ad8\u5371\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\uff08\u4e25\u63a7\u9884\u671f\u7248\uff09\"}\n```";
