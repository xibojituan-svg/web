    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID: 677160773\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677160773 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5357\u5915\uff08\u9500\u552e\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u77ed\u89c6\u9891\u5b9e\u6218\u53d8\u73b0\u5168\u653b\u7565\u8bfe\u7a0b\uff08\u610f\u5411\u4ef7\u683c2980/3980\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u9700\u8b66\u60d5\u540e\u7eed\u4f7f\u7528\u82b1\u5457/\u501f\u5457\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u767d\u5929\u4e0a\u73ed\uff0c\u665a\u4e0a\u56de\u5bb6\u8fd8\u6709\u4e00\u5806\u4e8b\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\uff08\u7528\u6237\u53d1\u8a00\u6781\u5c11\uff0c\u4e3b\u8981\u4e3a\u9500\u552e\u5355\u65b9\u9762\u8f93\u51fa\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **[\u2b07\u4f4e]**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u7eaf\u4e3a\u51e0\u5929\u5185\u63d0\u73b0\u4fdd\u5e95\u800c\u6765(\u4f4e\u6781\u5371)**\u3002\u7528\u6237\u6838\u5fc3\u5173\u5207\u662f\u201c\u4e24\u6708\u7684\u8bfe\u7a0b\u80fd\u53d8\u73b0\u5417\uff1f\u201d\u3001\u201c\u6211\u5f97\u5b66\u5230\u4ec0\u4e48\u7a0b\u5ea6\u624d\u80fd\u8f6c\u5230\u94b1\u201d\uff0c\u8868\u73b0\u51fa\u5bf9\u5feb\u901f\u3001\u786e\u5b9a\u53d8\u73b0\u7684\u5f3a\u70c8\u6e34\u671b\uff0c\u800c\u975e\u5bf9\u6280\u80fd\u672c\u8eab\u6216\u81ea\u6211\u5b9e\u73b0\u7684\u8ffd\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4e24\u6708\u7684\u8bfe\u7a0b\u80fd\u53d8\u73b0\u5417\uff1f\u201d > \u201c\u6211\u5f97\u5b66\u5230\u4ec0\u4e48\u7a0b\u5ea6\u624d\u80fd\u8f6c\u5230\u94b1\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **[\u27a1\u4e2d]**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u4fe1\u606f\u4e0d\u8db3]** \u2014 \u672a\u63d0\u53ca\uff0c\u4f46\u5173\u6ce8\u4ef7\u683c\uff08\u201c\u4e24\u4e2a\u670824\u8282\u8bfe\u201d\uff09\uff0c\u5bf92980/3980\u5143\u4ef7\u683c\u654f\u611f\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**[\u2b07\u4f4e]** \u2014 \u660e\u786e\u8868\u793a\u201c\u65f6\u95f4\u4e5f\u6bd4\u8f83\u7d27\u5f20\uff0c\u767d\u5929\u8fd8\u4e0a\u73ed\uff0c\u665a\u4e0a\u56de\u5bb6\u8fd8\u4e00\u5806\u4e8b\u60c5\u201d\uff0c\u5c5e\u4e8e\u5178\u578b\u7684\u793e\u755c\u788e\u7247\u5316\u65f6\u95f4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u4fe1\u606f\u4e0d\u8db3]** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **[\u2b07\u4f4e\u6781\u5371]**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u7528\u6237\u4ec5\u6709\u7684\u51e0\u6b21\u53d1\u8a00\u5747\u56f4\u7ed5\u201c\u62c5\u5fc3\u5b66\u4e0d\u4f1a\u201d\u3001\u201c\u65f6\u95f4\u4e0d\u591f\u201d\u3001\u201c\u9519\u8fc7\u8bfe\u7a0b\u201d\uff0c\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u81ea\u6211\u6000\u7591\u548c\u754f\u96be\u60c5\u7eea\uff0c\u7f3a\u4e4f\u81ea\u4e3b\u89e3\u51b3\u95ee\u9898\u7684\u4fe1\u5fc3\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4e0d\u77e5\u9053\u81ea\u5df1\u80fd\u4e0d\u80fd\u5b66\u4f1a\uff0c\u800c\u4e14\u65f6\u95f4\u4e5f\u6bd4\u8f83\u7d27\u5f20\uff0c\u767d\u5929\u8fd8\u4e0a\u73ed\uff0c\u665a\u4e0a\u56de\u5bb6\u8fd8\u4e00\u5806\u4e8b\u60c5[\u6342\u8138]\u201d > \u201c\u8fd9\u4e24\u5929\u7684\u8bfe\u6709\u7684\u5c31\u6ca1\u542c\u89c1\uff0c\u6709\u4e8b\u5c31\u803d\u8bef\u4e86\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**[ \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c ]**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u526f\u4e1a\u53d8\u73b0\u7684\u6781\u5ea6\u6e34\u671b\u4e0e\u81ea\u8eab\u80fd\u529b\u3001\u65f6\u95f4\u4e0d\u8db3\u4e4b\u95f4\u7684\u5de8\u5927\u77db\u76fe\uff0c\u4ea7\u751f\u4e86\u5f3a\u70c8\u7684\u201c\u6389\u961f\u6050\u614c\u201d\u548c\u4e0d\u5b89\u5168\u611f\u3002** \u4ed6\u5bb3\u6015\u6295\u5165\u91d1\u94b1\u548c\u65f6\u95f4\u540e\uff0c\u4f9d\u7136\u65e0\u6cd5\u83b7\u5f97\u9884\u671f\u7684\u7ecf\u6d4e\u56de\u62a5\uff0c\u65e0\u6cd5\u7f13\u89e3\u751f\u6d3b\u538b\u529b\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u63d0\u4f9b\u786e\u5b9a\u6027\u7684\u201c\u5b89\u5168\u7f51\u201d\u548c\u201c\u4fdd\u59c6\u5f0f\u201d\u7684\u6258\u5e95\u627f\u8bfa\u3002** \u9700\u8981\u660e\u786e\u544a\u77e5\u201c\u53ea\u8981\u8ddf\u7740\u505a\uff0c\u5c31\u80fd\u6709\u6536\u76ca\u201d\u7684\u8def\u5f84\uff0c\u5e76\u7528\u6781\u5f3a\u7684\u7eaa\u5f8b\u6027\u548c\u966a\u4f34\u611f\uff0c\u6d88\u9664\u5176\u56e0\u65f6\u95f4\u788e\u7247\u5316\u548c\u80fd\u529b\u4e0d\u81ea\u4fe1\u5e26\u6765\u7684\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74** (\u4e25\u91cd\u5185\u8017\u578b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u7b49\u4fe1\u53f7\uff0c\u4f46**\u9700\u9ad8\u5ea6\u8b66\u60d5\u5176\u56e0\u201c\u6536\u76ca\u843d\u5dee\u201d\u548c\u201c\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u201d\u800c\u9000\u8d39**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4e2d | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u82e5\u4e3a\u7792\u7740\u5bb6\u4eba\u62a5\u540d\uff0c\u540e\u7eed\u65f6\u95f4\u51b2\u7a81\u53ef\u80fd\u5f15\u53d1\u77db\u76fe\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u6781\u9ad8** | **\u65f6\u95f4\u7d27\u5f20+\u81ea\u6211\u6000\u7591\uff0c\u4e00\u65e6\u8bfe\u7a0b\u8282\u594f\u8ddf\u4e0d\u4e0a\u6216\u4f5c\u4e1a\u65e0\u6cd5\u5b8c\u6210\uff0c\u6781\u6613\u4ea7\u751f\u201c\u6211\u679c\u7136\u4e0d\u884c\u201d\u7684\u5d29\u6e83\u611f\uff0c\u8fdb\u800c\u653e\u5f03\u3002** |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | **\u8f6f\u4ef6\u64cd\u4f5c\u7a0d\u6709\u5361\u987f\u3001\u6307\u4ee4\u8bcd\u4e0d\u7406\u89e3\u3001\u7b2c\u4e00\u6b21\u4f5c\u4e1a\u88ab\u9000\u56de\uff0c\u90fd\u53ef\u80fd\u6210\u4e3a\u538b\u57ae\u5176\u4fe1\u5fc3\u7684\u6700\u540e\u4e00\u6839\u7a3b\u8349\u3002** |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u9ad8** | **\u5bf9\u201c\u7b2c\u4e8c\u5468\u5f00\u901a\u63a5\u5355\u201d\u3001\u201c2-3\u4e2a\u6708\u8986\u76d6\u5b66\u8d39\u201d\u7684\u627f\u8bfa\u62b1\u6709\u6781\u9ad8\u671f\u671b\u3002\u82e52\u4e2a\u6708\u5185\u672a\u63a5\u5230\u5546\u5355\u6216\u6536\u76ca\u751a\u5fae\uff0c\u4f1a\u7acb\u523b\u4ea7\u751f\u88ab\u6b3a\u9a97\u611f\uff0c\u8981\u6c42\u9000\u8d39\u3002** |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\u3002\u6b64\u65f6\u8bfe\u7a0b\u96be\u5ea6\u63d0\u5347\uff0c\u4f5c\u4e1a\u538b\u529b\u589e\u5927\uff0c\u82e5\u63a5\u5355\u4e0d\u987a\u5229\uff0c\u5176\u7126\u8651\u5c06\u8fbe\u5230\u9876\u5cf0\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u540c\u5b66\u4f60\u597d\uff0c\u6211\u662f\u4f60\u7684\u73ed\u4e3b\u4efbXX\u3002\u770b\u5230\u4f60\u767d\u5929\u4e0a\u73ed\u665a\u4e0a\u8fd8\u6709\u4e8b\uff0c\u65f6\u95f4\u786e\u5b9e\u5f88\u5b9d\u8d35\u3002\u522b\u62c5\u5fc3\uff0c\u54b1\u4eec\u7684\u8bfe\u7a0b\u56de\u653e\u53ef\u4ee5\u968f\u65f6\u770b\uff0c\u4f5c\u4e1a\u63d0\u4ea4\u65f6\u95f4\u4e5f\u5f88\u7075\u6d3b\u3002**\u6211\u4eec\u7684\u76ee\u6807\u4e0d\u662f\u8ba9\u4f60\u6210\u4e3a\u4e13\u5bb6\uff0c\u800c\u662f\u8ba9\u4f60\u5728\u6709\u9650\u7684\u65f6\u95f4\u91cc\uff0c\u7a33\u7a33\u5730\u638c\u63e1\u80fd\u63a5\u5355\u8d5a\u94b1\u7684\u6838\u5fc3\u6280\u80fd\u3002** \u6709\u4efb\u4f55\u5361\u4f4f\u7684\u5730\u65b9\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u5e2e\u4f60\u62c6\u89e3\u6210\u6700\u5c0f\u6b65\u9aa4\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u6b65\u6765\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** (\u9700\u5927\u5e45\u964d\u7ef4\u548c\u6258\u5e95)\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\uff08\u6ee1\u914d\uff09\u3011** + **\u3010\u50bb\u74dc\u7248A\u6a21\u5757\uff08\u964d\u7ef4\u7269\u7406\u6307\u4ee4\uff09\u3011**\u3002\u5fc5\u987b\u7528\u201c\u8f6e\u6905\u7ea7\u201d\u966a\u4f34\u548c\u201c\u6309\u952e\u7ea7\u201d\u6307\u5bfc\uff0c\u66ff\u4ee3\u539f\u7406\u6559\u5b66\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a**\u7edd\u4e0d\u5bf9\u5176\u4f7f\u7528\u9ad8\u538b\u8bdd\u672f\uff08\u5982\u201c\u6700\u540e\u540d\u989d\u201d\u3001\u201c\u522b\u4eba\u90fd\u62a5\u540d\u4e86\u201d\uff09\uff1b\u7edd\u4e0d\u5728\u5176\u672a\u5b8c\u6210\u57fa\u7840\u4efb\u52a1\u65f6\u5e03\u7f6e\u9ad8\u96be\u5ea6\u6311\u6218\uff1b\u7edd\u4e0d\u5bf9\u5176\u8bf4\u201c\u8fd9\u4e2a\u5f88\u7b80\u5355\uff0c\u4f60\u81ea\u5df1\u7814\u7a76\u4e0b\u201d\u3002**\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u8bfe\u7a0b\u524d\u534a\u6bb5\uff08\u81f3\u5c112\u4e2a\u6708\u5185\uff09\u8fdb\u884c\u4efb\u4f55\u5f62\u5f0f\u7684\u5347\u5355\u6216\u4ea4\u53c9\u63a8\u9500\u3002** \u5fc5\u987b\u5728\u5176\u6210\u529f\u63a5\u5230\u7b2c\u4e00\u5355\u3001\u5efa\u7acb\u521d\u6b65\u81ea\u4fe1\u540e\uff0c\u518d\u8c28\u614e\u8bd5\u63a2\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u4e0d\u77e5\u9053\u81ea\u5df1\u80fd\u4e0d\u80fd\u5b66\u4f1a**\uff0c\u800c\u4e14\u65f6\u95f4\u4e5f\u6bd4\u8f83\u7d27\u5f20\uff0c\u767d\u5929\u8fd8\u4e0a\u73ed\uff0c\u665a\u4e0a\u56de\u5bb6\u8fd8\u4e00\u5806\u4e8b\u60c5[\u6342\u8138]\u201d \n2. > \u201c\u8fd9\u4e24\u5929\u7684\u8bfe\u6709\u7684\u5c31\u6ca1\u542c\u89c1\uff0c\u6709\u4e8b\u5c31\u803d\u8bef\u4e86\u201d\n3. > \u201c**\u6211\u5f97\u5b66\u5230\u4ec0\u4e48\u7a0b\u5ea6\u624d\u80fd\u8f6c\u5230\u94b1**\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u9700\u6c42\uff08\u7126\u8651\u4fdd\u969c\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u81f4\u7684\u60c5\u611f\u6258\u5e95\uff08\u6ee1\u914dC\u6a21\u5757\uff09\u548c\u50bb\u74dc\u5f0f\u3001\u6b65\u9aa4\u5316\u7684\u4efb\u52a1\u62c6\u89e3\uff08\u964d\u7ef4A\u6a21\u5757\uff09\uff0c\u7528\u201c\u786e\u5b9a\u6027\u201d\u5bf9\u6297\u5176\u201c\u6389\u961f\u6050\u614c\u201d\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\uff08\u9700\u964d\u7ef4+\u7597\u6108\u5305\uff09\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
