        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 126344327 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-12 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u7533\u7f8e\u7c7d(\u738b\u96c5\u4e3d)\u3001\u6e29\u534a\u4ed9(\u5f6d\u5c14\u9526)\u3001\u706b\u5c0f\u7089(\u5f20\u5a1c)\u3001\u7af9\u9752\u6311\u6708(\u9a6c\u5efa\u5a1c) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u77ed\u89c6\u9891/\u6f2b\u5267\u76f8\u5173\u8bfe\u7a0b (\u5df2\u4ece\u77ed\u5267\u8425\u8fdb\u9636\u81f3\u5b9e\u6218\u84258\u671f\uff0c\u5e76\u65b0\u62a5AI\u6f2b\u5267\u7279\u8bad\u8425) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u65e0\u6cd5\u5224\u65ad\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u591a\u6b21\u8868\u793a\u201c\u6700\u8fd1\u6bd4\u8f83\u5fd9\u6ca1\u987e\u4e0a\u5b66\u4e60\u201d\u3001\u201c\u5728\u5f00\u8f66\u201d\uff0c\u4f5c\u4e1a\u9700\u8981\u73ed\u4e3b\u4efb\u63d0\u9192\u548c\u8865\u4ea4\uff0c\u663e\u793a\u65f6\u95f4\u4e0d\u56fa\u5b9a\u4e14\u7d27\u5f20\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u7528\u6237\u53d1\u8a00\u591a\u4e3a\u7b80\u77ed\u56de\u590d\uff0c\u7f3a\u4e4f\u5173\u4e8e\u52a8\u673a\u3001\u80cc\u666f\u3001\u8d44\u6e90\u3001\u60c5\u7eea\u7684\u6df1\u5ea6\u8868\u8fbe\uff0c\u5224\u65ad\u4e3b\u8981\u57fa\u4e8e\u884c\u4e3a\u6a21\u5f0f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u5b8c\u6210\u4e86\u77ed\u5267\u8425\u5e76\u4e3b\u52a8\u8fdb\u9636\u81f3\u5b9e\u6218\u8425\uff0c\u8868\u660e\u6709\u4e00\u5b9a\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b\u3002\u4f46\u5168\u7a0b\u672a\u63d0\u53ca\u53d8\u73b0\u3001\u8d5a\u94b1\u7b49\u5177\u4f53\u76ee\u6807\uff0c\u4e5f\u672a\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u6280\u672f\u94bb\u7814\u6216\u9886\u5bfc\u6b32\u3002\u52a8\u673a\u504f\u5411\u4e8e\u201c\u5b8c\u6210\u4efb\u52a1\u5f0f\u201d\u5b66\u4e60\uff0c\u800c\u975e\u660e\u786e\u7684\u201c\u641e\u94b1\u201d\u6216\u201c\u6781\u5ba2\u201d\u9a71\u52a8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u73ed\u73ed \u6211\u6700\u8fd1\u6bd4\u8f83\u5fd9\u6ca1\u987e\u4e0a\u5b66\u4e60\uff0c\u4f5c\u4e1a\u4e5f\u6539\uff0c\u5148\u4e0d\u70b9\u8bc4\u4e86[\u62b1\u62f3]\u201d (2026-01-12)\n> \u201c\u4e0d\u53c2\u52a0 \u8c22\u8c22[\u62b1\u62f3]\u201d (2026-01-25\uff0c\u62d2\u7edd\u5965\u65af\u5361\u6bd4\u8d5b)\n> \u201c\u5fd8\u8bb0\u8fd8\u6709\u4f5c\u4e1a\u8981\u4ea4[\u6342\u8138]\u201d (2026-03-12)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 \u80fd\u591f\u8fde\u7eed\u62a5\u540d\u77ed\u5267\u8425\u3001\u5b9e\u6218\u8425\u3001AI\u6f2b\u5267\u8425\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u6d88\u8d39\u80fd\u529b\uff0c\u4f46\u672a\u63d0\u53ca\u5177\u4f53\u91d1\u989d\u6216\u652f\u4ed8\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4f4e] \u2014 **\u6838\u5fc3\u77ed\u677f**\u3002\u9891\u7e41\u56e0\u201c\u5fd9\u201d\u3001\u201c\u5f00\u8f66\u201d\u7b49\u539f\u56e0\u65e0\u6cd5\u6309\u65f6\u5b66\u4e60\u3001\u770b\u76f4\u64ad\u3001\u4ea4\u4f5c\u4e1a\uff0c\u9700\u8981\u73ed\u4e3b\u4efb\u53cd\u590d\u63d0\u9192\u548c\u8865\u4ea4\u901a\u9053\u3002\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\u4e14\u4e0d\u7a33\u5b9a\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u672a\u77e5] \u2014 \u4fe1\u606f\u4e0d\u8db3\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u7528\u6237\u591a\u6b21\u9762\u4e34\u201c\u5fd9\u201d\u3001\u201c\u5fd8\u8bb0\u4f5c\u4e1a\u201d\u3001\u201c\u76f4\u64ad\u5361\u987f\u201d\u7b49\u632b\u6298\uff0c\u4f46\u4ece\u672a\u51fa\u73b0\u60c5\u7eea\u5d29\u6e83\u3001\u81ea\u6211\u5426\u5b9a\u6216\u5411\u73ed\u4e3b\u4efb\u7d22\u6c42\u989d\u5916\u60c5\u7eea\u5b89\u629a\u7684\u8ff9\u8c61\u3002\u6001\u5ea6\u59cb\u7ec8\u793c\u8c8c\u3001\u914d\u5408\uff0c\u80fd\u63a5\u53d7\u8865\u4ea4\u65b9\u6848\uff0c\u60c5\u7eea\u7a33\u5b9a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u770b\u4e0d\u4e86 \u592a\u5361\u4e86[\u6d41\u6cea]\u201d (2026-01-16) \u2014 \u9648\u8ff0\u4e8b\u5b9e\uff0c\u65e0\u62b1\u6028\u3002\n> \u201c\u5fd8\u8bb0\u8fd8\u6709\u4f5c\u4e1a\u8981\u4ea4[\u6342\u8138]\u201d (2026-03-12) \u2014 \u4e3b\u52a8\u627f\u8ba4\uff0c\u65e0\u7126\u8651\u3002\n> \u5bf9\u73ed\u4e3b\u4efb\u7684\u6240\u6709\u63d0\u9192\u548c\u50ac\u4fc3\uff0c\u5747\u4ee5\u201c\u597d\u7684\u201d\u3001\u201c\u6536\u5230[\u73ab\u7470]\u201d\u7b49\u7b80\u77ed\u3001\u79ef\u6781\u7684\u56de\u590d\u5e94\u5bf9\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u65f6\u95f4\u7ba1\u7406\u56f0\u96be\u4e0e\u6f5c\u5728\u7684\u5b64\u72ec\u611f**\u3002\u7528\u6237\u9700\u8981\u5916\u90e8\u7ed3\u6784\uff08\u73ed\u4e3b\u4efb\u63d0\u9192\u3001\u622a\u6b62\u65e5\u671f\uff09\u6765\u63a8\u52a8\u5b66\u4e60\u8fdb\u5ea6\uff0c\u5e76\u4eab\u53d7\u5728\u793e\u7fa4\u4e2d\u88ab\u5173\u6ce8\u3001\u88ab\u63d0\u9192\u3001\u88ab\u8d60\u4e88\uff08\u5982\u514d\u8d39\u8d60\u8bfe\u3001\u798f\u5229\uff09\u7684\u5f52\u5c5e\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6e29\u548c\u800c\u575a\u5b9a\u7684\u8fdb\u5ea6\u966a\u4f34\u4e0e\u4efb\u52a1\u7b80\u5316\u670d\u52a1**\u3002\u63d0\u4f9b\u6e05\u6670\u7684\u622a\u6b62\u65e5\u671f\u63d0\u9192\u3001\u4fbf\u6377\u7684\u8865\u4ea4\u901a\u9053\uff0c\u5e76\u5728\u4ed6\u5b8c\u6210\u65f6\u7ed9\u4e88\u53ca\u65f6\u7684\u6b63\u5411\u53cd\u9988\uff08\u5982\u201c\u68d2\u68d2\u54d2\u201d\uff09\uff0c\u8ba9\u4ed6\u611f\u5230\u88ab\u652f\u6301\u800c\u975e\u88ab\u8bc4\u5224\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1\u7c7b** (\u5174\u8da3\u6d88\u8d39\u578b\uff0c\u4f4e\u538b\u529b\u4f4e\u8981\u6c42) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T5 \u597d\u73a9\u5c1d\u9c9c\u8005** (\u56fe\u4e2a\u65b0\u9c9c\uff0c\u7ef4\u6301\u751f\u547d\u4f53\u5f81\u9910) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a[\u65e0]\n\n**\u5224\u5b9a\u6811\u8def\u5f84\u63a8\u6f14**\uff1a\n1.  **\u52a8\u673a\u7eaf\u5ea6 (5-6\u5206)**\uff1a\u6709\u5b66\u4e60\u884c\u52a8\uff08\u62a5\u540d\u591a\u671f\u8bfe\u7a0b\uff09\uff0c\u4f46\u65e0\u660e\u786e\u53d8\u73b0\u6216\u6280\u672f\u94bb\u7814\u8bc9\u6c42\uff0c\u7b26\u5408\u201c\u4e2d\u201d\u8bc4\u7ea7\u3002\n2.  **\u8d44\u6e90\u5e95\u5ea7 (5-6\u5206)**\uff1a\u8d44\u91d1\u80fd\u529b\u4e2d\u7b49\uff0c\u4f46**\u65f6\u95f4\u77ed\u677f\u660e\u663e\uff08\u4f4e\uff09**\uff0c\u7efc\u5408\u8bc4\u7ea7\u4e3a\u201c\u4e2d\u201d\u3002\n3.  **\u5fc3\u7406\u5f39\u6027 (7-8\u5206)**\uff1a\u9ad8\uff0c\u9047\u4e8b\u4e0d\u614c\uff0c\u60c5\u7eea\u7a33\u5b9a\u3002\n4.  **\u5224\u5b9a\u6811\u5339\u914d**\uff1a\u52a8\u673a\u7eaf\u5ea6\u4e2d\u3001\u8d44\u6e90\u5e95\u5ea7\u4e2d\u3001\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u672a\u89e6\u53d1\u4efb\u4f55\u7279\u6b8a\u5206\u652f\u3002\u5728\u201c\u4e2d\u7b49\u5f39\u6027\u901a\u9053\u201d\u4e2d\uff0c\u7528\u6237\u65e0\u9ad8\u9891\u793e\u4ea4\u53d1\u8a00\uff0c\u4e5f\u65e0\u660e\u786e\u53d8\u73b0\u8bc9\u6c42\uff0c\u4f46\u8868\u73b0\u51fa\u89c4\u5f8b\u6027\u5b66\u4e60\u884c\u4e3a\uff08\u5b8c\u6210\u591a\u671f\u8bfe\u7a0b\uff09\u3002\u7b26\u5408 **\u201c\u6c89\u9ed8\u9ad8\u8d44\u6e90\u89c2\u671b\u578b\u201d** \u7279\u5f81\uff08\u52a8\u673a5-7\uff0c\u8d44\u6e90\u22657\uff0c\u53d1\u8a00\u5c11\uff0c\u89c4\u5f8b\u63d0\u4ea4\uff09\u3002\u6839\u636e\u5224\u5b9a\u6811\uff0c\u6b64\u7c7b\u7528\u6237\u5e94\u5f52\u4e3a **A\u7c7b\u89c2\u671b\u7528\u6237\uff08\u6c89\u9ed8\u578b\u7a33\u5b9a\u6f5c\u529b\uff09**\u3002\n5.  **\u6700\u7ec8\u6821\u51c6**\uff1a\u7ed3\u5408\u7528\u6237\u201c\u65f6\u95f4\u788e\u7247\u5316\u201d\u8fd9\u4e00\u663e\u8457\u77ed\u677f\uff0c\u4ee5\u53ca\u5176\u884c\u4e3a\u66f4\u504f\u5411\u4e8e\u201c\u5b8c\u6210\u4efb\u52a1\u201d\u800c\u975e\u201c\u6df1\u5ea6\u53c2\u4e0e\u6216\u9886\u5bfc\u201d\uff0c\u5176\u6838\u5fc3\u9700\u6c42\u662f\u4f4e\u538b\u529b\u4e0b\u7684\u966a\u4f34\u4e0e\u5f52\u5c5e\u611f\u3002\u56e0\u6b64\uff0c\u539f\u578b\u4e0a\u66f4\u8d34\u8fd1 **T5 \u597d\u73a9\u5c1d\u9c9c\u8005**\uff0c\u5206\u5c42\u4e0a\u4eceA\u7c7b\u89c2\u671b\u8c03\u6574\u4e3a **C1\u7c7b\u5174\u8da3\u6d88\u8d39\u578b**\u3002\u8fd9\u662f\u4e00\u4e2a\u6709\u6f5c\u529b\u4f46\u9700\u8981\u8f7b\u538b\u529b\u670d\u52a1\u7684\u7528\u6237\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u72ec\u7acb\u51b3\u7b56\u53ef\u80fd\u6027\u9ad8\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u6838\u5fc3\u98ce\u9669**\u3002\u56e0\u5de5\u4f5c/\u751f\u6d3b\u7e41\u5fd9\u5bfc\u81f4\u4f5c\u4e1a\u6301\u7eed\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\u201d\u7684\u632b\u8d25\u611f\u548c\u538b\u529b\uff0c\u6700\u7ec8\u53ef\u80fd\u9009\u62e9\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u95ee\u9898\u6216\u6279\u8bc4\u800c\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u672a\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u77ed\u671f\u53d8\u73b0\u671f\u671b\uff0c\u5bf9\u8bfe\u7a0b\u4ea7\u51fa\u4ef7\u503c\u9884\u671f\u53ef\u80fd\u8f83\u4e3a\u6a21\u7cca\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u4e2d\u671f\uff08\u7b2c3-5\u5468\uff09**\uff0c\u5f53\u8bfe\u7a0b\u96be\u5ea6\u63d0\u5347\u3001\u4f5c\u4e1a\u91cf\u589e\u52a0\uff0c\u800c\u7528\u6237\u65f6\u95f4\u4f9d\u65e7\u7d27\u5f20\u65f6\uff0c\u7d2f\u79ef\u7684\u672a\u5b8c\u6210\u4f5c\u4e1a\u53ef\u80fd\u5bfc\u81f4\u5176\u4ea7\u751f\u201c\u7b97\u4e86\uff0c\u8ddf\u4e0d\u4e0a\u201d\u7684\u5ff5\u5934\u800c\u9759\u9ed8\u6d41\u5931\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5b9d\u5b50\uff0c\u770b\u5230\u4f60\u4e4b\u524d\u8bfe\u7a0b\u5b8c\u6210\u5f97\u7279\u522b\u68d2\uff01\u65b0\u4e00\u671f\u8bfe\u7a0b\u8282\u594f\u54b1\u4eec\u653e\u8f7b\u677e\uff0c\u4e3b\u6253\u4e00\u4e2a\u2018\u6709\u7a7a\u5c31\u5b66\uff0c\u5b66\u4e86\u5c31\u8d5a\u2019\u3002\u4f5c\u4e1aDDL\u6211\u4f1a\u63d0\u524d\u79c1\u4fe1\u4f60\uff0c\u4e07\u4e00\u5fd9\u5fd8\u4e86\u4e5f\u522b\u6709\u538b\u529b\uff0c\u968f\u65f6\u627e\u6211\u8865\u4ea4\u901a\u9053\u3002\u54b1\u4eec\u4e00\u8d77\u7a33\u7a33\u5730\u8d70\u5b8c\u8fd9\u6bb5\u65c5\u7a0b~\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5174\u8da3\u6e38\u4e50\u7ebf**\u3011\u3002\u5339\u914d\u5176T5\u5c1d\u9c9c\u8005\u5c5e\u6027\uff0c\u63d0\u4f9b\u4f4e\u538b\u529b\u3001\u9ad8\u8da3\u5473\u6027\u7684\u5b66\u4e60\u4f53\u9a8c\uff0c\u907f\u514d\u786c\u6838\u6280\u672f\u538b\u8feb\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\uff08\u8f7b\u91cfC\u6a21\u5757\uff09**\u3011\u3002\u63d0\u4f9b\u6e29\u548c\u7684\u8fdb\u5ea6\u63d0\u9192\u3001\u4fbf\u6377\u7684\u8865\u4ea4\u673a\u5236\u548c\u5b8c\u6210\u65f6\u7684\u5373\u65f6\u9f13\u52b1\u3002**\u4e25\u7981**\u4f7f\u7528\u9ad8\u538b\u903c\u5355\u6216\u7eaa\u5f8b\u60e9\u7f5a\u8bdd\u672f\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u6700\u540e\u540d\u989d\u201d\u3001\u201c\u5012\u8ba1\u65f6\u622a\u6b62\u201d\u3001\u201c\u9519\u8fc7\u53d6\u6d88\u8d44\u683c\u201d\u7b49\u9ad8\u538b\u8bdd\u672f\u50ac\u4fc3\u3002\u4e0d\u8981\u5bf9\u5176\u4f5c\u4e1a\u8d28\u91cf\u8fdb\u884c\u4e25\u5389\u6279\u8bc4\u6216\u65bd\u52a0\u8fc7\u9ad8\u6280\u672f\u538b\u529b\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u8fdb\u884c500\u5143\u4ee5\u5185\u5fae\u5347\u5355\u63a8\u4ecb**\uff08\u5982\u5174\u8da3\u5468\u8fb9\u3001\u8f7b\u91cf\u5de5\u5177\u5305\uff09\u3002\u82e5\u63a8\u4ecb\u9ad8\u9636\u786c\u6838\u8bfe\u7a0b\uff0c\u5fc5\u987b\u5145\u5206\u94fa\u57ab\u4ef7\u503c\uff0c\u5e76\u5f3a\u8c03\u201c\u65f6\u95f4\u81ea\u7531\u5b89\u6392\u201d\uff0c\u907f\u514d\u89e6\u53d1\u5176\u65f6\u95f4\u7126\u8651\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u73ed\u73ed \u6211\u6700\u8fd1\u6bd4\u8f83\u5fd9\u6ca1\u987e\u4e0a\u5b66\u4e60\uff0c\u4f5c\u4e1a\u4e5f\u6539\uff0c\u5148\u4e0d\u70b9\u8bc4\u4e86[\u62b1\u62f3][\u62b1\u62f3][\u62b1\u62f3]\u201d **(\u65f6\u95f4\u788e\u7247\u5316\u3001\u4f4e\u53c2\u4e0e\u5ea6)**\n2. > \u201c\u770b\u4e0d\u4e86 \u592a\u5361\u4e86[\u6d41\u6cea]\u201d **(\u9648\u8ff0\u56f0\u96be\uff0c\u65e0\u60c5\u7eea\u5ba3\u6cc4)**\n3. > \u201c\u5fd8\u8bb0\u8fd8\u6709\u4f5c\u4e1a\u8981\u4ea4[\u6342\u8138]\u201d **(\u4f9d\u8d56\u5916\u90e8\u63d0\u9192\uff0c\u4f46\u6001\u5ea6\u914d\u5408)**\n4. > \u201c\u4e0d\u53c2\u52a0 \u8c22\u8c22[\u62b1\u62f3]\u201d **(\u5bf9\u989d\u5916\u6d3b\u52a8/\u7ade\u8d5b\u65e0\u5174\u8da3\uff0c\u4e13\u6ce8\u4e3b\u7ebf\u4efb\u52a1)**\n5. > \u201c\u597d\u7684 \u9a6c\u4e0a\u53bb\u4ea4[\u73ab\u7470]\u201d **(\u5bf9\u63d0\u9192\u54cd\u5e94\u79ef\u6781\uff0c\u6267\u884c\u529b\u5c1a\u53ef)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T5 \u597d\u73a9\u5c1d\u9c9c\u8005\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u4f4e\u538b\u529b\u3001\u6709\u966a\u4f34\u7684\u793e\u7fa4\u73af\u5883\u4e2d\uff0c\u5b8c\u6210\u4e00\u9879\u201c\u81ea\u6211\u63d0\u5347\u201d\u7684\u8f7b\u91cf\u4efb\u52a1\uff0c\u83b7\u5f97\u5f52\u5c5e\u611f\u4e0e\u5b8c\u6210\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u81f4\u5f39\u6027\u7684\u5b66\u4e60\u8fdb\u5ea6\u7ba1\u7406\uff08\u5bbd\u677eDDL\u3001\u4fbf\u6377\u8865\u4ea4\uff09\u4e0e\u6e29\u548c\u7684\u966a\u4f34\u5f0f\u63d0\u9192\uff0c\u7edd\u4e0d\u53ef\u65bd\u52a0\u9ad8\u538b\u3011**\u3002\n\n```json\n{\"core_type\": \"T5 \u597d\u73a9\u5c1d\u9c9c\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u793e\u4ea4/\u5c0a\u91cd\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
