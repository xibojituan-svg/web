    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v3.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677151889 (\u6635\u79f0\uff1a\u4f9d\u4f9d) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e-\u7070\u7070(\u5f90\u6625\u4e3d) / \u73ed\u4e3b\u4efb-\u6d1b\u5947\u6eaa\u5802(\u5f20\u723d) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6500\u767b\u8ba1\u5212\u9ad8\u9636\u7248 (4\u4e2a\u6708\u8bfe\u7a0b\uff0c\u4ef7\u683c7380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3** (\u7528\u6237\u539f\u8bdd\uff1a\u201c\u6211\u63d0\u524d\u548c\u8001\u5988\u8981\u201d) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u7f3a\u5931** (\u804a\u5929\u8bb0\u5f55\u672a\u4f53\u73b0\u5de5\u4f5c/\u751f\u6d3b\u4f5c\u606f) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** (\u4ec5\u77e5\u9700\u5411\u6bcd\u4eb2\u8981\u94b1\uff0c\u4f46\u672a\u63d0\u53ca\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u652f\u6301) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** (\u7f3a\u4e4f\u5173\u952e\u4e09\u8f74\u4fe1\u606f\uff1a\u8d44\u91d1\u6765\u6e90\u8be6\u60c5\u3001\u65f6\u95f4\u7cbe\u529b\u3001\u5bb6\u5ead\u652f\u6301\u5ea6\u3001\u8fc7\u5f80\u7ecf\u5386) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b07\u4f4e\n- **\u7279\u5f81\u901f\u5199**\uff1a\u53d8\u73b0\u5bfc\u5411\u660e\u786e\uff0c\u5bf9\u5b66\u4e60\u5185\u5bb9\u672c\u8eab\u5174\u8da3\u4e00\u822c\uff0c\u5173\u6ce8\u70b9\u5728\u4e8e\u201c\u5de5\u4f5c\u600e\u4e48\u6837\u201d\u3001\u201c\u80fd\u8d5a\u94b1\u201d\uff0c\u5bf9\u8bfe\u7a0b\u4ef7\u683c\u654f\u611f\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u5c0f\u59d0\u59d0\u6211\u60f3\u5148\u770b\u770b\u5de5\u4f5c\u600e\u4e48\u6837\u5728\u786e\u5b9a\u8981\u4e0d\u8981\u5168\u804c\u53d1\u5c55\u201d\n  > \u201c3.\u8981\u770b\u770b\u662f\u8981\u4ed8\u8d39\u591a\u5c11\u201d\n  > \u201c\u6211\u63d0\u524d\u548c\u8001\u5988\u8981\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e (\u57fa\u4e8e\u77ed\u677f\u539f\u5219)\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u652f\u4ed87380\u5143\u8bfe\u7a0b\u8d39\u7528\u9700\u8981\u201c\u63d0\u524d\u548c\u8001\u5988\u8981\u201d\uff0c\u8868\u660e**\u65e0\u72ec\u7acb\u652f\u4ed8\u80fd\u529b\uff0c\u4f9d\u8d56\u5bb6\u5ead\u8d44\u52a9**\uff0c\u8d44\u91d1\u5e95\u5ea7\u8584\u5f31\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5de5\u4f5c\u3001\u751f\u6d3b\u5b89\u6392\u6216\u53ef\u7528\u5b66\u4e60\u65f6\u95f4\uff0c\u65e0\u6cd5\u8bc4\u4f30\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931/\u4f4e\u98ce\u9669\u9884\u8b66** \u2014 \u4ec5\u77e5\u9700\u5411\u6bcd\u4eb2\u8981\u94b1\uff0c\u4f46\u672a\u660e\u786e\u6bcd\u4eb2\u662f\u5426\u77e5\u60c5\u5e76\u652f\u6301\u6b64\u7b14\u6559\u80b2\u6295\u8d44\u3002\u5b58\u5728**\u5bb6\u4eba\u4e0d\u77e5\u60c5**\u7684\u6f5c\u5728\u98ce\u9669\u3002\n- **\u5e95\u5ea7\u53d6\u77ed\u677f**\uff1a**\u4f4e** (\u8d44\u91d1\u7ef4\u5ea6\u5df2\u89e6\u53d1\u4f4e\u8bc4\u7ea7\uff0c\u4e14\u5bb6\u5ead\u652f\u6301\u5ea6\u5b58\u7591)\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u8868\u73b0\u51fa\u660e\u663e\u7684**\u4e0d\u81ea\u4fe1\u3001\u4f9d\u8d56\u6027\u5f3a\u3001\u60c5\u7eea\u6613\u6ce2\u52a8**\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u7206\u53d1\u611f\uff09\u65f6\u8868\u73b0\u51fa\u7126\u8651\u548c\u632b\u8d25\u611f\uff0c\u9700\u8981\u9500\u552e\u6301\u7eed\u5b89\u629a\u548c\u9f13\u52b1\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u52a9\u6559\u5c0f\u59d0\u59d0\u4ffa\u8fd8\u662f\u627e\u4e0d\u5230\u90a3\u79cd\u7206\u53d1\u611f\u201d\n  > \u201c\u4f46\u662f\u5c31\u662f\u611f\u89c9\u5927\u80c6\u4e86\u4e4b\u540e\u4e0d\u592a\u597d\u542c\u201d\n  > \u201c\u6211\u6ca1\u6709\u4ec0\u4e48\u95ee\u9898\u5566[\u5077\u7b11]\u5c31\u662f\u6709\u70b9\u7d27\u5f20\u81ea\u5df1\u884c\u4e0d\u884c[\u6487\u5634]\u201d\n  > \u201c\u6211\u4e5f\u8001\u7d27\u5f20\u4e86\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c (\u5b89\u5168\u9700\u6c42)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u7ecf\u6d4e\u4e0d\u72ec\u7acb\u5e26\u6765\u7684\u4e0d\u5b89\u5168\u611f\u4e0e\u5bf9\u672a\u6765\u7684\u7126\u8651**\u3002\u7528\u6237\u9700\u8981\u201c\u63d0\u524d\u548c\u8001\u5988\u8981\u201d\u94b1\u62a5\u540d\uff0c\u900f\u9732\u51fa\u5bf9\u81ea\u8eab\u7ecf\u6d4e\u80fd\u529b\u7684\u4e0d\u81ea\u4fe1\u548c\u5bf9\u201c\u6709\u623f\u6709\u8f66\u5c31\u5dee\u5b58\u6b3e\u201d\u73b0\u72b6\u7684\u7126\u8651\u3002\u5b66\u4e60\u6709\u58f0\u4e66\u7684\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u83b7\u53d6\u4e00\u4efd\u80fd\u5e26\u6765\u6536\u5165\u7684\u201c\u5de5\u4f5c\u201d\u6216\u201c\u517c\u804c\u201d\uff0c\u4ee5\u5bfb\u6c42\u7ecf\u6d4e\u4e0a\u7684\u4fdd\u969c\u548c\u72ec\u7acb\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u7684\u8def\u5f84\u6307\u5f15\u4e0e\u9636\u6bb5\u6027\u6210\u5c31\u8ba4\u53ef**\u3002\u907f\u514d\u7a7a\u6cdb\u7684\u9f13\u52b1\uff0c\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u6267\u884c\u3001\u80fd\u5feb\u901f\u83b7\u5f97\u5fae\u5c0f\u6b63\u53cd\u9988\u7684\u5b66\u4e60-\u63a5\u5355\u8def\u5f84\uff0c\u7528\u201c\u5c0f\u6210\u529f\u201d\u7d2f\u79ef\u5176\u81ea\u4fe1\uff0c\u5bf9\u51b2\u5176\u56e0\u8d44\u91d1\u4f9d\u8d56\u548c\u6280\u80fd\u751f\u758f\u5e26\u6765\u7684\u7126\u8651\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udd34 D\u7c7b (\u9ad8\u5371\u7194\u65ad\u578b)** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **\u9000\u8d39\u578b (\u4ea7\u54c1\u9519\u914d\u578b)** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\ud83d\udd34**\u5df2\u89e6\u53d1 D \u7c7b\u7194\u65ad\u7ea2\u7ebf\uff01**\n- **\u89e6\u53d1\u56e0\u7531**\uff1a**\u7ecf\u6d4e\u7ea2\u7ebf** - \u7528\u6237\u660e\u786e\u8868\u793a\u652f\u4ed8\u8bfe\u7a0b\u8d39\u7528\uff087380\u5143\uff09\u9700\u8981\u201c\u63d0\u524d\u548c\u8001\u5988\u8981\u201d\u3002\u8fd9\u7b26\u5408D\u7c7b\u7194\u65ad\u6761\u4ef6\u4e2d\u7684\u201c**\u9ad8\u5ea6\u4f9d\u8d56\u7236\u8f88\u5bb6\u5ead\u3001\u65e0\u72ec\u7acb\u51b3\u7b56\u80fd\u529b\u7684\u4f4e\u9f84\u5931\u4e1a\u9752\u5e74**\u201d\u6216\u201c**\u501f\u8d37\u652f\u4ed8**\u201d\uff08\u5411\u5bb6\u4eba\u501f\u6b3e\uff09\u7279\u5f81\u3002\u8d44\u91d1\u94fe\u8106\u5f31\uff0c\u6297\u98ce\u9669\u80fd\u529b\u6781\u4f4e\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u6781\u9ad8** | \u6bcd\u4eb2\u5f97\u77e5\u5176\u82b1\u8d39\u8fd1\u4e07\u5143\u5b66\u4e60\u201c\u4e0d\u9760\u8c31\u201d\u7684\u526f\u4e1a\u540e\u5f3a\u70c8\u53cd\u5bf9\uff0c\u8981\u6c42\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | \u5f00\u8bfe\u540e\u53d1\u73b0\u5b66\u4e60\u65f6\u95f4\u4e0e\u73b0\u6709\u751f\u6d3b/\u5de5\u4f5c\u51b2\u7a81\uff0c\u6216\u8bfe\u7a0b\u96be\u5ea6\u8d85\u51fa\u9884\u671f\uff0c\u56e0\u81ea\u5351\u548c\u7126\u8651\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | \u9996\u6b21\u72ec\u7acb\u5b8c\u6210\u4f5c\u4e1a\u53d7\u632b\uff08\u5982\u8f6f\u4ef6\u64cd\u4f5c\u3001\u5f55\u97f3\u6548\u679c\u4e0d\u4f73\uff09\uff0c\u81ea\u5c0a\u5fc3\u53d7\u635f\uff0c\u4ea7\u751f\u201c\u6211\u592a\u7b28\u4e86\u5b66\u4e0d\u4f1a\u201d\u7684\u5d29\u6e83\u60c5\u7eea\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | \u5b66\u4e601-2\u5468\u540e\uff0c\u53d1\u73b0\u65e0\u6cd5\u7acb\u523b\u63a5\u5355\u53d8\u73b0\uff0c\u8ba4\u4e3a\u88ab\u201c\u6b3a\u9a97\u201d\uff0c\u60c5\u7eea\u6fc0\u52a8\u8981\u6c42\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e48\u5c0f\u65f6\u5185\u81f3\u7b2c\u4e00\u5468\u4f5c\u4e1a\u63d0\u4ea4\u671f**\u3002\u5f53\u7528\u6237\u9996\u6b21\u9762\u4e34\u72ec\u7acb\u64cd\u4f5c\u56f0\u96be\u6216\u5bb6\u4eba\u8d28\u8be2\u538b\u529b\u65f6\uff0c\u6781\u6613\u89e6\u53d1\u9000\u8d39\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4f9d\u4f9d\u540c\u5b66\u4f60\u597d\uff01\u770b\u5230\u4f60\u5728\u4f53\u9a8c\u8425\u7279\u522b\u8ba4\u771f\u5730\u5b8c\u6210\u4e86\u8bd5\u97f3\uff0c\u80fd\u611f\u89c9\u5230\u4f60\u5bf9\u505a\u597d\u8fd9\u4ef6\u4e8b\u7684\u6e34\u671b\u548c\u4e00\u4e1d\u7d27\u5f20\u3002\u522b\u62c5\u5fc3\uff0c\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u7a0b\u8bbe\u8ba1\u5c31\u662f\u4e00\u6b65\u6b65\u5e26\u4f60\u4ece\u2018\u7d27\u5f20\u2019\u5230\u2018\u4ece\u5bb9\u2019\u7684\u3002\u54b1\u4eec\u4e0d\u8ddf\u522b\u4eba\u6bd4\uff0c\u5c31\u8ddf\u6628\u5929\u7684\u81ea\u5df1\u6bd4\u3002\u7b2c\u4e00\u5468\u54b1\u4eec\u7684\u76ee\u6807\u4e0d\u662f\u63a5\u5927\u5355\uff0c\u800c\u662f\u641e\u5b9a\u7b2c\u4e00\u4e2a\u5c0f\u4f5c\u54c1\uff0c\u6211\u4f1a\u4e00\u76f4\u966a\u7740\u4f60\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\u3011** + **\u3010\u5fae\u578b\u6210\u5c31\u89e3\u9501\u7ebf\u3011**\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u5f3a\u5236\u6302\u8f7d **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\uff0c\u7531\u73ed\u4e3b\u4efb\u6216\u4e13\u5c5e\u52a9\u6559\u63d0\u4f9b\u9ad8\u9891\u3001\u9ad8\u60c5\u611f\u652f\u6301\u76841\u5bf91\u8ddf\u8fdb\u3002\u540c\u65f6\uff0c\u8bfe\u7a0b\u521d\u671f\u8bbe\u8ba1\u5927\u91cf**\u4f4e\u95e8\u69db\u3001\u9ad8\u53cd\u9988\u7684\u5fae\u578b\u4efb\u52a1**\uff08\u5982\uff1a\u6210\u529f\u5b89\u88c5\u8f6f\u4ef6\u3001\u5b8c\u6210\u7b2c\u4e00\u6bb530\u79d2\u8ddf\u8bfb\uff09\uff0c\u5e76\u5373\u65f6\u7ed9\u4e88\u516c\u5f00\u8868\u626c\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7edd\u4e0d\u5bf9\u5176\u4f7f\u7528\u4efb\u4f55\u201c\u901f\u6210\u53d8\u73b0\u201d\u3001\u201c\u6708\u5165\u8fc7\u4e07\u201d\u7684\u8bdd\u672f\uff1b\u7edd\u4e0d\u5728\u5176\u8868\u8fbe\u632b\u8d25\u611f\u65f6\u8bb2\u5927\u9053\u7406\u6216\u4e0e\u5176\u4ed6\u5b66\u5458\u5bf9\u6bd4\uff1b\u7edd\u4e0d\u5728\u5176\u672a\u4e3b\u52a8\u63d0\u53ca\u7684\u60c5\u51b5\u4e0b\u8ffd\u95ee\u5bb6\u5ead\u60c5\u51b5\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5f62\u5f0f\u7684\u5347\u5355\u6216\u9644\u52a0\u9500\u552e**\u3002\u5f53\u524d\u8bfe\u7a0b\u5bf9\u5176\u5df2\u662f\u9ad8\u98ce\u9669\u6295\u8d44\uff0c\u9700\u5168\u529b\u4fdd\u969c\u57fa\u7840\u670d\u52a1\u4ea4\u4ed8\uff0c\u9632\u6b62\u4e8c\u6b21\u538b\u529b\u5bfc\u81f4\u5d29\u76d8\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u6211\u63d0\u524d\u548c\u8001\u5988\u8981**\u201d \u2014\u2014 **D\u7c7b\u7194\u65ad\u7684\u76f4\u63a5\u8bc1\u636e\uff0c\u66b4\u9732\u7ecf\u6d4e\u4e0d\u72ec\u7acb\u4e0e\u8d44\u91d1\u94fe\u8106\u5f31\u6027\u3002**\n2. > \u201c\u6211\u6ca1\u6709\u4ec0\u4e48\u95ee\u9898\u5566[\u5077\u7b11]**\u5c31\u662f\u6709\u70b9\u7d27\u5f20\u81ea\u5df1\u884c\u4e0d\u884c[\u6487\u5634]**\u201d \u2014\u2014 **\u4f4e\u5fc3\u7406\u5f39\u6027\u7684\u5178\u578b\u8868\u73b0\uff0c\u9ad8\u4f9d\u8d56\u3001\u4f4e\u81ea\u4fe1\u3002**\n3. > \u201c\u5c0f\u59d0\u59d0\u6211\u60f3\u5148\u770b\u770b\u5de5\u4f5c\u600e\u4e48\u6837\u5728\u786e\u5b9a\u8981\u4e0d\u8981\u5168\u804c\u53d1\u5c55\u201d \u2014\u2014 **\u4f4e\u52a8\u673a\u7eaf\u5ea6\u7684\u4f53\u73b0\uff0c\u6838\u5fc3\u8bc9\u6c42\u662f\u201c\u5de5\u4f5c\u201d\u548c\u53d8\u73b0\uff0c\u800c\u975e\u5174\u8da3\u6216\u80fd\u529b\u6210\u957f\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u9000\u8d39\u578b\uff08\u4ea7\u54c1\u9519\u914d\u578b\uff09**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\uff08\u7ecf\u6d4e\u4fdd\u969c\uff09**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u542f\u52a8D\u7c7b\u7194\u65ad\u673a\u5236\uff0c\u53cb\u597d\u529d\u9000\u6216\u8f6c\u4e3a\u6700\u4f4e\u4ef7\u4f53\u9a8c\u4ea7\u54c1\uff1b\u82e5\u5df2\u6210\u4ea4\uff0c\u5219\u5fc5\u987b\u6302\u8f7d\u201c\u7597\u6108\u966a\u4f34\u5305\u201d\uff0c\u5e76\u7531\u9ad8\u7ea7\u73ed\u4e3b\u4efb\u91cd\u70b9\u770b\u62a4\uff0c\u4e25\u9632\u5bb6\u5ead\u5e72\u9884\u4e0e\u9996\u6b21\u632b\u8d25**\u3002\n\n```json\n{\"core_type\": \"\u9000\u8d39\u578b (\u4ea7\u54c1\u9519\u914d\u578b)\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
