    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4ee5\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\u7684\u8eab\u4efd\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677169003\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677169003 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u738b\u5c0f\u4ed91(\u738b\u8339) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u4f53\u9a8c\u8425\u540e\u610f\u5411\u9ad8\u9636\u73ed\uff0c\u4ef7\u683c2380\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u672a\u77e5\uff08\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1\uff08\u4e0a\u73ed\u65cf\uff0c\u4ec5\u4e2d\u5348\u3001\u4e0b\u5348\u3001\u665a\u4e0a\u6709\u65f6\u95f4\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u672a\u77e5\uff08\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u800c\u6765(\u9ad8)\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b\uff0c\u5173\u6ce8\u6280\u80fd\u63d0\u5347\uff08\u201c\u8fd8\u662f\u9700\u8981\u591a\u7ec3\u591a\u5b66\u201d\uff09\uff0c\u5bf9\u53d8\u73b0\u8def\u5f84\uff08\u5168\u804c/\u517c\u804c\uff09\u6709\u4e3b\u52a8\u8be2\u95ee\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u6025\u529f\u8fd1\u5229\u7684\u201c\u51e0\u5929\u5185\u63d0\u73b0\u201d\u7684\u6781\u7aef\u7126\u8651\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5168\u804c\u662f\u600e\u4e48\u6837\u7684\uff1f\u201d\uff1b> \u201c\u76f4\u63a5\u5b66\u7684\u8bdd\uff0c\u5b66\u8d39\u591a\u5c11\uff1f\u201d\uff1b> \u201c\u5f55\u4e66\uff0c\u753b\u672c\u201d\uff1b> \u201c\u8fd8\u662f\u9700\u8981\u591a\u7ec3\u591a\u5b66\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a\u4e2d \u2014 \u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\uff0c\u80fd\u63a5\u53d72380\u5143\u8bfe\u7a0b\uff0c\u4f46\u672a\u663e\u793a\u9ad8\u6d88\u8d39\u80fd\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a\u4e2d \u2014 \u660e\u786e\u8868\u793a\u201c\u6211\u5728\u4e0a\u73ed\uff0c\u53ea\u6709\u4e2d\u5348\u548c\u4e0b\u5348\u665a\u4e0a\u6709\u65f6\u95f4\u201d\uff0c\u5c5e\u4e8e\u5178\u578b\u7684\u4e0a\u73ed\u65cf\u788e\u7247\u5316\u65f6\u95f4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a\u672a\u77e5 \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u7528\u6237\u6c9f\u901a\u7b80\u6d01\u9ad8\u6548\uff08\u591a\u7528\u201c[OK]\u201d\u3001\u201c\u597d\u7684\u201d\u3001\u201c\u55ef\u201d\uff09\uff0c\u80fd\u6e05\u6670\u8868\u8fbe\u65f6\u95f4\u9650\u5236\uff08\u201c\u4e0d\u8981\u5237\u5c4f\u201d\uff09\uff0c\u9762\u5bf9\u9500\u552e\u5bc6\u96c6\u4fe1\u606f\u6d41\u80fd\u4fdd\u6301\u7a33\u5b9a\u8282\u594f\uff0c\u672a\u89c1\u4efb\u4f55\u60c5\u7eea\u6ce2\u52a8\u6216\u81ea\u6211\u6000\u7591\u4fe1\u53f7\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u5728\u4e0a\u73ed\uff0c\u53ea\u6709\u4e2d\u5348\u548c\u4e0b\u5348\u665a\u4e0a\u6709\u65f6\u95f4\uff0c\u6240\u4ee5\u4f60\u4e0d\u8981\u5237\u5c4f\u201d\uff08\u6e05\u6670\u8bbe\u5b9a\u8fb9\u754c\uff09\uff1b> \u201c\u597d\u7684\u3002\u665a\u70b9\u201d\uff08\u81ea\u4e3b\u5b89\u6392\u4efb\u52a1\uff09\uff1b> \u201c\u8bf7\u5e08\u59d0\u70b9\u8bc4\uff0c\u8c22\u8c22\u201d\uff08\u4e3b\u52a8\u5bfb\u6c42\u53cd\u9988\uff0c\u59ff\u6001\u79ef\u6781\uff09\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u5f52\u5c5e\u4e0e\u5c0a\u91cd\u9700\u6c42\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u6709\u58f0\u884c\u4e1a\u6709\u63a2\u7d22\u5174\u8da3\uff0c\u4f46\u7f3a\u4e4f\u7cfb\u7edf\u8def\u5f84\u548c\u5708\u5185\u5f52\u5c5e\u611f\u3002\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u83b7\u5f97\u4e00\u6280\u4e4b\u957f\uff0c\u5e76\u878d\u5165\u4e00\u4e2a\u80fd\u63d0\u4f9b\u8d44\u6e90\uff08\u5982\u7248\u6743\u4e66\u3001\u5267\u7ec4\uff09\u7684\u793e\u7fa4\uff0c\u4ece\u800c\u83b7\u5f97\u804c\u4e1a\u8eab\u4efd\u8ba4\u540c\u548c\u5708\u5185\u5c0a\u91cd\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u8def\u5f84\u7684\u6e05\u6670\u6307\u5f15\u4e0e\u5708\u5c42\u51c6\u5165\u7684\u201c\u7279\u6743\u201d\u611f**\u3002\u63d0\u4f9b\u660e\u786e\u7684\u6210\u957f\u8def\u7ebf\u56fe\uff08\u4ece\u65c1\u767d\u5230\u89d2\u8272\u97f3\uff09\u3001\u4e13\u5c5e\u8d44\u6e90\u503e\u659c\uff08\u201c\u7ed9\u4f60\u6311\u4e86\u4e00\u672c\u7248\u6743\u4e66\u201d\uff09\uff0c\u4ee5\u53ca\u8fdb\u5165\u6838\u5fc3\u5708\u5c42\uff08\u201c\u73ed\u73ed\u966a\u8dd1\u7fa4/\u8d44\u6e90\u7fa4\u201d\uff09\u7684\u8d44\u683c\uff0c\u6ee1\u8db3\u5176\u201c\u88ab\u9009\u4e2d\u201d\u548c\u201c\u88ab\u4e13\u4e1a\u8ba4\u53ef\u201d\u7684\u5c0a\u91cd\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 **B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u9ad8\u52a8\u673a\u3001\u4e2d\u8d44\u6e90\u3001\u9ad8\u5f39\u6027\u3001\u52a1\u5b9e\u5b66\u4e60) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u3001\u96f6\u4e92\u52a8\u7b49\u5371\u9669\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u7f3a\u5931\uff0c\u6682\u65e0\u6cd5\u5224\u65ad\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4e2d | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u4e0a\u73ed\u65cf\u65f6\u95f4\u788e\u7247\u5316\uff0c\u82e5\u8bfe\u7a0b\u8282\u594f\u8fc7\u5feb\u3001\u4f5c\u4e1a\u91cf\u8fc7\u5927\uff0c\u53ef\u80fd\u5bfc\u81f4\u4efb\u52a1\u79ef\u538b\u4ea7\u751f\u7126\u8651\uff0c\u6216\u56e0\u65e0\u6cd5\u6309\u65f6\u53c2\u4e0e\u76f4\u64ad/\u5b8c\u6210\u4f5c\u4e1a\u800c\u4ea7\u751f\u201c\u6389\u961f\u611f\u201d\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u6c9f\u901a\u7406\u6027\uff0c\u672a\u89c1\u81ea\u5351\u3001\u4f9d\u8d56\u6216\u60c5\u7eea\u5d29\u6e83\u8ff9\u8c61\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u7528\u6237\u5bf9\u201c\u5f55\u4e66\u3001\u753b\u672c\u201d\u6709\u660e\u786e\u5174\u8da3\uff0c\u82e5\u5728\u627f\u8bfa\u7684\u201c\u65b0\u624b\u4e66\u201d\u6216\u201c\u7248\u6743\u4e66\u201d\u8d44\u6e90\u5bf9\u63a5\u4e0a\u51fa\u73b0\u5ef6\u8fdf\u6216\u843d\u5dee\uff0c\u53ef\u80fd\u5f15\u53d1\u4e0d\u6ee1\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe\u540e2-4\u5468\uff0c\u5f53\u788e\u7247\u5316\u5b66\u4e60\u65f6\u95f4\u4e0e\u8bfe\u7a0b\u5bc6\u96c6\u5ea6\u4ea7\u751f\u51b2\u7a81\uff0c\u4e14\u7b2c\u4e00\u6ce2\u8d44\u6e90\u5bf9\u63a5\u672a\u8fbe\u9884\u671f\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cXX\u540c\u5b66\uff0c\u770b\u5230\u4f60\u65f6\u95f4\u6bd4\u8f83\u7d27\u5f20\u4f46\u5b66\u4e60\u610f\u613f\u5f88\u5f3a\uff0c\u975e\u5e38\u68d2\uff01\u54b1\u4eec\u7684\u8bfe\u7a0b\u548c\u4f5c\u4e1a\u90fd\u652f\u6301\u56de\u770b\u548c\u7075\u6d3b\u5b89\u6392\uff0c\u4f60\u4e0d\u7528\u6709\u2018\u8d76\u4e0d\u4e0a\u2019\u7684\u538b\u529b\u3002\u6211\u4f1a\u6839\u636e\u4f60\u7684\u65f6\u95f4\u8282\u594f\uff0c\u5e2e\u4f60\u89c4\u5212\u6700\u6709\u6548\u7684\u5b66\u4e60\u8def\u5f84\uff0c\u786e\u4fdd\u6bcf\u4e00\u6b65\u90fd\u624e\u5b9e\u3002\u6709\u4efb\u4f55\u65f6\u95f4\u51b2\u7a81\u968f\u65f6\u8ddf\u6211\u8bf4\uff0c\u54b1\u4eec\u4e00\u8d77\u8c03\u6574\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011\u3002\u5339\u914d\u5176\u9ad8\u52a8\u673a\u548c\u9ad8\u5f39\u6027\uff0c\u63d0\u4f9b\u7cfb\u7edf\u3001\u6709\u6df1\u5ea6\u7684\u6280\u80fd\u8bad\u7ec3\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u788e\u7247\u5316\u65f6\u95f4\uff0c\u8865\u5145\u3010**\u7075\u6d3b\u5b66\u4e60\u8def\u5f84\u89c4\u5212\u5305**\u3011\uff08\u4e2a\u6027\u5316\u8bfe\u8868+\u4f5c\u4e1adeadline\u5f39\u6027\u7ba1\u7406\uff09\u3002**\u6301\u7eed\u89c2\u5bdf**\uff0c\u82e5\u5176\u540e\u7eed\u5c55\u73b0\u51fa\u7ec4\u7ec7\u6216\u5e2e\u52a9\u4ed6\u4eba\u7684\u884c\u4e3a\uff0c\u53ef\u542f\u52a8\u3010**\u6743\u9650\u89c9\u9192\u63d0\u5e72\u5305**\u3011\uff08D\u6a21\u5757\uff09\uff0c\u5c06\u5176\u53d1\u5c55\u4e3a\u5c0f\u7ec4\u957f\u6216\u5b66\u4e60\u59d4\u5458\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u5bc6\u96c6\u7684\u3001\u4e0d\u8003\u8651\u5176\u5de5\u4f5c\u65f6\u95f4\u7684\u4fe1\u606f\u201c\u5237\u5c4f\u201d\u6253\u6270\uff1b\u7528\u201c\u4e0d\u5b66\u5c31\u843d\u540e\u201d\u7b49\u5236\u9020\u7126\u8651\u7684\u8bdd\u672f\u65bd\u538b\uff1b\u7ed9\u4e88\u6a21\u7cca\u7684\u8d44\u6e90\u627f\u8bfa\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u63a8\u4ecb\u9ad8\u9636\u8bfe\u7a0b\u6216\u8bbe\u5907\uff0c\u4f46\u5fc5\u987b\u57fa\u4e8e\u5176\u6280\u80fd\u63d0\u5347\u540e\u7684\u5b9e\u9645\u9700\u6c42\uff08\u5982\u201c\u4f60\u7684\u5fa1\u59d0\u97f3\u5f88\u9002\u5408XX\u7c7b\u578b\u4e66\uff0c\u4f46\u9700\u8981\u66f4\u4e13\u4e1a\u7684\u8bbe\u5907\u652f\u6491\u6548\u679c\u201d\uff09\uff0c\u5207\u5fcc\u7a7a\u753b\u5927\u997c\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u5728\u4e0a\u73ed\uff0c\u53ea\u6709\u4e2d\u5348\u548c\u4e0b\u5348\u665a\u4e0a\u6709\u65f6\u95f4\uff0c\u6240\u4ee5\u4f60\u4e0d\u8981\u5237\u5c4f\u201d **(\u6e05\u6670\u7684\u65f6\u95f4\u8fb9\u754c\u4e0e\u7406\u6027\u6c9f\u901a\u80fd\u529b)**\n2. > \u201c\u76f4\u63a5\u5b66\u7684\u8bdd\uff0c\u5b66\u8d39\u591a\u5c11\uff1f\u201d **(\u52a1\u5b9e\u3001\u76ee\u6807\u660e\u786e\uff0c\u5173\u6ce8\u6295\u5165\u4ea7\u51fa\uff0c\u4f46\u975e\u6025\u8e81)**\n3. > \u201c\u5f55\u4e66\uff0c\u753b\u672c\u201d **(\u6709\u5177\u4f53\u7684\u5174\u8da3\u65b9\u5411\uff0c\u800c\u975e\u6cdb\u6cdb\u7684\u201c\u8d5a\u94b1\u201d)**\n4. > \u201c\u55ef\uff0c\u542c\u4f60\u8bfb\u4e86\u4ee5\u540e\u627e\u5230\u4e86\u4e00\u4e9b\u611f\u89c9\u201d **(\u5bf9\u4e13\u4e1a\u6307\u5bfc\u6709\u53cd\u9988\u548c\u5438\u6536\uff0c\u5b66\u4e60\u6001\u5ea6\u79ef\u6781)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u6e05\u6670\u7684\u804c\u4e1a\u8def\u5f84\u4e0e\u5708\u5c42\u5f52\u5c5e\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u9ad8\u5ea6\u7ed3\u6784\u5316\u7684\u5b66\u4e60\u652f\u6301\uff0c\u5e76\u786e\u4fdd\u8d44\u6e90\u5bf9\u63a5\u7684\u53ca\u65f6\u6027\u4e0e\u771f\u5b9e\u6027\uff0c\u5c0a\u91cd\u5176\u65f6\u95f4\u8fb9\u754c\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u793e\u4ea4\u4e0e\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u7075\u6d3b\u5b66\u4e60\u8def\u5f84\u89c4\u5212\u5305\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
