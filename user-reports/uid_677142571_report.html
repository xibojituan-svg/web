    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u4e0e\u98ce\u63a7\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u4e2d\u7b49\u504f\u5b9e\u7528**\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u201c\u517c\u804c\u201d\u3001\u201c\u60f3\u529b\u6240\u80fd\u53ca\u7684\u5148\u8d5a\u94b1\u201d\u3001\u201c\u8fb9\u8d5a\u8fb9\u7ec3\u8fb9\u7cbe\u8fdb\u201d\uff0c\u6838\u5fc3\u9a71\u52a8\u529b\u662f**\u53d8\u73b0**\u3002\u5bf9\u884c\u4e1a\u6709\u521d\u6b65\u4e86\u89e3\uff08\u63d0\u53ca\u670b\u53cb\u3001\u77e5\u9053\u6709\u5e73\u53f0\u65e0\u9700\u8003\u8bc1\uff09\uff0c\u4f46\u8ba4\u77e5\u5c1a\u6d45\uff0c\u5b58\u5728\u201c\u5feb\u901f\u4e0a\u624b\u201d\u7684\u671f\u671b\u3002\u5174\u8da3\u70b9\uff08\u5982\u201c\u62cd\u8fc7\u7535\u89c6\u5267\u201d\uff09\u4e0e\u6280\u80fd\u63d0\u5347\u9700\u6c42\u5e76\u5b58\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u4e2d\u7b49**\u3002\u5177\u5907\u5f55\u97f3\u68da\u7b49\u57fa\u7840\u786c\u4ef6\u8bbe\u5907\uff0c\u8868\u660e\u6709\u4e00\u5b9a\u7269\u8d28\u6295\u5165\u610f\u613f\u3002\u65f6\u95f4\u4e0a\u53ef\u665a\u4e0a\u6295\u5165\uff08\u201c\u767d\u5929\u592a\u4e71\u201d\uff09\uff0c\u4f46\u5b58\u5728\u4e0e\u73b0\u6709\u4e8b\u52a1\uff08\u5982\u665a\u4e0a7\u70b9\u6709\u8bfe\uff09\u7684\u51b2\u7a81\u3002**\u7f3a\u4e4f\u660e\u786e\u7684\u6bcf\u65e5\u56fa\u5b9a\u5b66\u4e60\u65f6\u957f\u627f\u8bfa**\u3002\u6709\u5e7f\u544a/B\u7aef\u7ecf\u9a8c\uff0c\u4e3a\u6f5c\u5728\u52a0\u5206\u9879\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u4e2d\u7b49\u504f\u8106\u5f31**\u3002\u884c\u52a8\u4e0a\u80fd\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\uff0c\u4f46\u8868\u73b0\u51fa**\u8f7b\u5ea6\u62d6\u5ef6**\uff08\u201c\u8fd8\u6ca1\u987e\u4e0a\u770b\u201d\u3001\u201c\u4f5c\u4e1a\u665a\u70b9\u4ea4\u201d\uff09\u548c**\u754f\u96be/\u4f9d\u8d56\u503e\u5411**\uff08\u201c\u6ca1\u6709\u6307\u5bfc\uff0c\u6211\u89c9\u7740\u53ef\u80fd\u5f55\u4e0d\u597d\u201d\u3001\u201c\u76ee\u524d\u4e5f\u8d5a\u4e0d\u5230\u201d\uff09\u3002\u5bf9\u632b\u6298\uff08\u5982pia\u620f\u6ca1\u62a2\u5230\u4f4d\u7f6e\uff09\u6709\u8f7b\u5fae\u62b1\u6028\uff0c\u4f46\u80fd\u63a5\u53d7\u6307\u5bfc\u5e76\u8c03\u6574\uff08\u201c\u597d\u7684\uff0c\u592a\u68d2\u5566\u201d\uff09\u3002**\u5bf9\u5b66\u4e60\u8def\u5f84\u7684\u957f\u671f\u6027\u548c\u8270\u82e6\u6027\u8ba4\u77e5\u4e0d\u8db3**\uff0c\u5b58\u5728\u201c\u8f7b\u677e\u9a7e\u9a6d\u201d\u7684\u5e7b\u60f3\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u5df2\u652f\u4ed8**\uff087380\u5143\uff09\u3002\u652f\u4ed8\u540e\u8868\u6001\u201c\u6211\u4f1a\u8ba4\u771f\u5bf9\u5f85\u201d\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5bb6\u5ead\u6216\u914d\u5076\u610f\u89c1\uff0c\u51b3\u7b56\u770b\u4f3c\u4e2a\u4eba\u505a\u51fa\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u7eaf\u5ea6**: **B\u7c7b\uff08\u529f\u5229\u9a71\u52a8\u578b\uff09**\u3002\u6838\u5fc3\u8bc9\u6c42\u660e\u786e\u4e3a\u517c\u804c\u53d8\u73b0\uff0c\u5bf9\u201c\u8fb9\u8d5a\u8fb9\u5b66\u201d\u6709\u5f3a\u70c8\u671f\u5f85\u3002\n*   **\u6b65\u9aa42 - \u8d44\u6e90\u5e95\u5ea7**: **B\u7c7b\uff08\u8d44\u6e90\u6709\u9650\u578b\uff09**\u3002\u6709\u65f6\u95f4\u788e\u7247\u5316\u3001\u5b66\u4e60\u6301\u7eed\u6027\u5b58\u7591\u7684\u95ee\u9898\uff0c\u4f46\u5177\u5907\u57fa\u7840\u8bbe\u5907\u4e0e\u5b66\u4e60\u884c\u52a8\u529b\u3002\n*   **\u6b65\u9aa43 - \u5fc3\u7406\u5f39\u6027**: **C\u7c7b\uff08\u6613\u632b\u578b\uff09**\u3002\u5bf9\u72ec\u7acb\u64cd\u4f5c\u4fe1\u5fc3\u4e0d\u8db3\uff0c\u9700\u8981\u5916\u90e8\u6307\u5bfc\u548c\u5373\u65f6\u53cd\u9988\uff0c\u5bf9\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u7684\u5c0f\u6ce2\u6298\u654f\u611f\uff0c**\u5b58\u5728\u56e0\u521d\u671f\u53d8\u73b0\u56f0\u96be\u800c\u653e\u5f03\u7684\u98ce\u9669**\u3002\n*   **\u7efc\u5408\u5224\u5b9a**: **B-C\u578b\u7528\u6237**\u3002\u529f\u5229\u9a71\u52a8\u660e\u786e\uff0c\u4f46\u5fc3\u7406\u51c6\u5907\u4e0d\u8db3\uff0c\u8d44\u6e90\u6295\u5165\u7684\u53ef\u6301\u7eed\u6027\u6709\u5f85\u89c2\u5bdf\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b: T5 \u529f\u5229\u52a1\u5b9e\u5c1d\u9c9c\u8005**\u3002\n    *   **\u7279\u5f81\u543b\u5408**: \u4ee5\u517c\u804c\u53d8\u73b0\u4e3a\u6838\u5fc3\u76ee\u6807\uff0c\u5bf9\u201c\u4f4e\u95e8\u69db\u5feb\u901f\u6536\u76ca\u201d\u6709\u671f\u5f85\uff08\u8be2\u95ee\u659c\u6760\u662f\u5426\u9700\u8003\u8bc1\u3001\u5173\u6ce8\u201c\u4e0d\u7528\u592a\u591a\u6280\u672f\u5c31\u80fd\u6709\u6536\u76ca\u201d\uff09\u3002\u613f\u610f\u4e3a\u660e\u786e\u56de\u62a5\u6295\u5165\uff08\u5982\u8d2d\u4e70\u8bfe\u7a0b\uff09\uff0c\u4f46\u8010\u5fc3\u6709\u9650\uff0c\u9700\u8981\u6301\u7eed\u7684\u6b63\u5411\u6fc0\u52b1\uff08\u8bd5\u97f3\u673a\u4f1a\u3001\u70b9\u8bc4\u3001\u901a\u5173\uff09\u6765\u7ef4\u6301\u52a8\u529b\u3002\u884c\u52a8\u529b\u5c1a\u53ef\uff0c\u4f46\u97e7\u6027\u4e00\u822c\uff0c\u6613\u53d7\u521d\u671f\u632b\u6298\u5f71\u54cd\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4e2d)\n\u9010\u9879\u6392\u67e57\u79cd\u9000\u8d39\u6839\u56e0\uff1a\n1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**: **\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u201c\u8fb9\u8d5a\u8fb9\u7ec3\u201d\u6709\u6025\u5207\u671f\u5f85\uff0c\u82e5\u6b63\u5f0f\u8bfe\u521d\u671f\u65e0\u6cd5\u83b7\u5f97\u8bd5\u97f3\u6210\u529f\u6216\u5fae\u5c0f\u53d8\u73b0\uff0c\u6781\u6613\u4ea7\u751f\u201c\u88ab\u9a97\u201d\u611f\u3002**\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa\u201c\u63a5\u5355\u6e20\u9053\u201d\u3001\u201c\u7248\u6743\u4e66\u201d\u53ef\u80fd\u62c9\u9ad8\u9884\u671f**\u3002\n2.  **\u5b66\u4e60\u5f3a\u5ea6\u4e0d\u9002**: **\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5df2\u8868\u73b0\u51fa\u65f6\u95f4\u7d27\u5f20\u548c\u8f7b\u5ea6\u62d6\u5ef6\uff0c\u82e5\u6b63\u5f0f\u8bfe\u8bfe\u4e1a\u91cf\u4e0e\u5176\u517c\u804c\u65f6\u95f4\u51b2\u7a81\uff0c\u53ef\u80fd\u4ea7\u751f\u538b\u529b\u3002\n3.  **\u5185\u5bb9\u8d28\u91cf\u8d28\u7591**: **\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u548c\u6307\u5bfc\u53cd\u9988\uff08\u201c\u6bd4\u8f83\u5b9e\u5728\u201d\u3001\u201c\u592a\u68d2\u5566\u201d\uff09\u6301\u6b63\u9762\u6001\u5ea6\u3002\n4.  **\u670d\u52a1\u627f\u8bfa\u672a\u5151\u73b0**: **\u4e2d\u98ce\u9669**\u3002\u9500\u552e\u627f\u8bfa\u4e86\u201c\u5de5\u4f5c\u5ba4\u8d44\u6e90\u201d\u3001\u201c\u8bd5\u97f3\u5355\u201d\u3001\u201c\u7248\u6743\u4e66\u201d\uff0c\u82e5\u73ed\u4e3b\u4efb\u8854\u63a5\u540e\u8d44\u6e90\u4f9b\u7ed9\u4e0d\u53ca\u65f6\u6216\u4e0d\u5339\u914d\uff0c\u4f1a\u5f15\u53d1\u4e0d\u6ee1\u3002\n5.  **\u7ecf\u6d4e\u538b\u529b**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\uff0c\u4f46\u652f\u4ed87380\u5143\u7528\u4e8e\u517c\u804c\u5b66\u4e60\uff0c\u9700\u5173\u6ce8\u5176\u7ecf\u6d4e\u627f\u53d7\u529b\u3002\n6.  **\u5bb6\u5ead\u53cd\u5bf9**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u9700\u540e\u7eed\u6838\u67e5\u3002\n7.  **\u7ade\u54c1\u6bd4\u8f83/\u51b2\u52a8\u6d88\u8d39\u540e\u6094**: **\u4f4e\u98ce\u9669**\u3002\u7528\u6237\u5df2\u5bf9\u6bd4\u8fc7\u201c\u5176\u4ed6\u5e73\u53f0\u201d\uff0c\u5e76\u56e0\u9500\u552e\u63d0\u4f9b\u7684\u201c\u5b9e\u5728\u201d\u611f\u548c\u201c\u8d44\u6e90\u201d\u800c\u9009\u62e9\u4ed8\u8d39\uff0c\u77ed\u671f\u5185\u540e\u6094\u6982\u7387\u8f83\u4f4e\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5408\u89c4\u70b9**: \u9500\u552e\u8fc7\u7a0b\u63d0\u4f9b\u4e86\u8bd5\u542c\u3001\u4f5c\u4e1a\u70b9\u8bc4\u3001\u76f4\u64ad\u8bfe\u7b49\u4f53\u9a8c\u73af\u8282\uff0c\u7528\u6237\u5b8c\u6210\u4e86\u591a\u9879\u4efb\u52a1\u5e76\u901a\u5173\uff0c\u8f6c\u5316\u6d41\u7a0b\u5b8c\u6574\u3002\n*   **\u98ce\u9669\u70b9**:\n    1.  **\u9884\u671f\u7ba1\u7406\u504f\u5dee**: \u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u63a5\u5355\u6e20\u9053\u201d\u3001\u201c\u7248\u6743\u4e66\u201d\u3001\u201c\u5165\u5708\u201d\u3001\u201c\u53d8\u73b0\u9014\u5f84\u201d\uff0c\u53ef\u80fd\u8425\u9020\u4e86\u201c\u5b66\u5b8c\u5373\u53ef\u63a5\u5355\u201d\u7684**\u8fc7\u5ea6\u4e50\u89c2\u9884\u671f**\uff0c\u4e0e\u7528\u6237\u201c\u4e0d\u77e5\u9053\u4ec0\u4e48\u65f6\u5019\u80fd\u4e0a\u624b\u201d\u7684\u7591\u8651\u5f62\u6210\u6f5c\u5728\u51b2\u7a81\u3002\n    2.  **\u7d27\u8feb\u611f\u8425\u9020**: \u4f7f\u7528\u201c\u6700\u540e\u4e00\u5929\u201d\u3001\u201c\u622a\u6b62\u65f6\u95f4\u201d\u3001\u201c\u540d\u989d\u5360\u597d\u201d\u7b49\u8bdd\u672f\uff0c\u7b26\u5408\u8425\u9500\u8282\u594f\uff0c\u4f46\u9700\u5173\u6ce8\u662f\u5426\u5bfc\u81f4\u7528\u6237\u4ed3\u4fc3\u51b3\u7b56\u3002\n    3.  **\u201c\u8003\u8bc1\u201d\u8bdd\u672f**: \u5bf9\u7528\u6237\u201c\u659c\u6760\u662f\u5426\u9700\u8003\u8bc1\u201d\u7684\u7591\u95ee\uff0c\u56de\u7b54\u201c\u8003\u8bc1\u662f\u5b66\u4e60\u8fc7\u7a0b\u201d\u5b58\u5728**\u6a21\u7cca\u5f15\u5bfc**\uff0c\u672a\u6e05\u6670\u533a\u5206\u8bc1\u4e66\u7684\u5fc5\u8981\u6027\u4e0e\u8bfe\u7a0b\u7684\u6280\u80fd\u57f9\u8bad\u5c5e\u6027\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**: **\u504f\u5dee**\u3002\u7528\u6237\u6838\u5fc3\u9700\u6c42\u662f**\u4f4e\u95e8\u69db\u5feb\u901f\u53d8\u73b0**\uff0c\u800c\u201c\u6500\u767b\u8ba1\u5212\u201d\u4f5c\u4e3a\u7cfb\u7edf\u8bfe\uff0c\u672c\u8d28\u662f**\u6280\u80fd\u4e2d\u957f\u671f\u6df1\u5ea6\u57f9\u8bad**\u3002\u4e24\u8005\u5b58\u5728\u76ee\u6807\u4e0e\u8def\u5f84\u7684\u9519\u4f4d\u98ce\u9669\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **\u9996\u5468\u91cd\u70b9\u6821\u6b63\u53d8\u73b0\u9884\u671f\u4e0e\u5efa\u7acb\u5b66\u4e60\u8282\u594f**\u3002\n*   **\u5177\u4f53\u884c\u52a8\u6307\u5357**:\n    1.  **\u9884\u671f\u7ba1\u7406\uff08\u5173\u952e\uff09**: \u9996\u6b21\u6c9f\u901a\u5fc5\u987b**\u660e\u786e\u6f84\u6e05**\u53d8\u73b0\u8def\u5f84\u4e0e\u65f6\u95f4\u7ebf\u3002\u5f3a\u8c03\u7cfb\u7edf\u5b66\u4e60\u662f\u57fa\u7840\uff0c\u521d\u671f\u4ee5\u201c\u5ba1\u542c\u3001\u5bf9\u8f68\u201d\u7b49\u975e\u6838\u5fc3\u5f55\u97f3\u4efb\u52a1\u6216\u5fae\u5c0f\u5355\u4e3a\u4e3b\uff0c**\u964d\u4f4e\u5176\u201c\u5b66\u5b8c\u5373\u8d5a\u201d\u7684\u9884\u671f**\u3002\u5c06\u9500\u552e\u627f\u8bfa\u7684\u201c\u8d44\u6e90\u201d\u5177\u4f53\u5316\u3001\u9636\u6bb5\u5316\u3002\n    2.  **\u5373\u65f6\u6fc0\u52b1**: \u5145\u5206\u5229\u7528\u5176\u201c\u529f\u5229\u9a71\u52a8\u201d\u7279\u6027\uff0c\u5728\u8bfe\u7a0b\u521d\u671f\u8bbe\u8ba1\u53ef\u5b8c\u6210\u7684\u3001\u4e0e\u201c\u53d8\u73b0\u201d\u6302\u94a9\u7684\u5c0f\u4efb\u52a1\uff08\u5982\u5b8c\u6210\u4e00\u6b21\u6807\u51c6\u8bd5\u97f3\u3001\u4e86\u89e3\u4e00\u4e2a\u63a5\u5355\u5e73\u53f0\u89c4\u5219\uff09\uff0c\u7ed9\u4e88\u53ca\u65f6\u53cd\u9988\u548c\u9f13\u52b1\u3002\n    3.  **\u65f6\u95f4\u89c4\u5212\u652f\u6301**: \u534f\u52a9\u5176\u5236\u5b9a\u5207\u5b9e\u53ef\u884c\u7684\u3001\u57fa\u4e8e\u201c\u665a\u4e0a\u65f6\u95f4\u201d\u7684\u5b66\u4e60\u8ba1\u5212\uff0c\u5f3a\u8c03\u201c\u6bcf\u5929\u5c11\u91cf\u4f46\u6301\u7eed\u201d\u4f18\u4e8e\u201c\u7a81\u51fb\u201d\u3002\n    4.  **\u4fe1\u5fc3\u5efa\u8bbe**: \u5bf9\u5176\u63d0\u4ea4\u7684\u4f5c\u4e1a\u7ed9\u4e88\u5177\u4f53\u3001\u7ec6\u81f4\u7684\u6b63\u5411\u70b9\u8bc4\uff0c\u5f3a\u5316\u5176\u201c\u6e29\u5fa1\u97f3\u201d\u7279\u8d28\u5728\u7279\u5b9a\u8d5b\u9053\uff08\u513f\u7ae5\u3001\u60c5\u611f\uff09\u7684\u4f18\u52bf\uff0c\u7f13\u89e3\u5176\u5bf9\u201c\u6280\u672f\u4e0d\u8db3\u201d\u7684\u7126\u8651\u3002\n    5.  **\u98ce\u9669\u76d1\u63a7**: \u5bc6\u5207\u89c2\u5bdf\u5176\u524d\u4e24\u5468\u5b66\u4e60\u72b6\u6001\u548c\u60c5\u7eea\u53cd\u9988\uff0c\u82e5\u51fa\u73b0\u6301\u7eed\u62d6\u5ef6\u6216\u5bf9\u53d8\u73b0\u8fdb\u5ea6\u5f3a\u70c8\u4e0d\u6ee1\uff0c\u9700\u63d0\u524d\u4ecb\u5165\uff0c\u8fdb\u884c\u5b66\u4e60\u8def\u5f84\u518d\u786e\u8ba4\u6216\u5fc3\u7406\u758f\u5bfc\u3002\n\n{\"core_type\": \"T5 \u529f\u5229\u52a1\u5b9e\u5c1d\u9c9c\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u9996\u5468\u6821\u6b63\u53d8\u73b0\u9884\u671f\u4e0e\u5b66\u4e60\u8282\u594f\"}";
