    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n## \u4fe1\u606f\u5145\u8db3\u6027\u8bc4\u4f30\n\u4fe1\u606f\u5145\u8db3\uff0c\u53ef\u5b8c\u6210\u5206\u6790\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49)**\n    *   **\u8868\u5c42**: \u5bfb\u6c42\u517c\u804c\u53d8\u73b0\uff0c\u660e\u786e\u8868\u793a\u201c\u60f3\u627e\u58f0\u97f3\u517c\u804c\u201d\u3002\n    *   **\u6df1\u5c42**: \u5bf9\u6709\u58f0\u884c\u4e1a\u6709\u63a2\u7d22\u5174\u8da3\uff08\u201c\u90fd\u60f3\u5c1d\u8bd5\u201d\u3001\u201c\u5b66\u65e0\u6b62\u5883\u201d\uff09\uff0c\u613f\u610f\u6295\u5165\u65f6\u95f4\u5b8c\u6210\u4f5c\u4e1a\u548c\u89c2\u770b\u76f4\u64ad\uff0c\u8868\u73b0\u51fa\u5b66\u4e60\u610f\u613f\u3002\n    *   **\u98ce\u9669\u70b9**: \u52a8\u673a\u504f\u5411\u201c\u5c1d\u8bd5\u201d\u548c\u201c\u526f\u4e1a\u589e\u6536\u201d\uff0c\u5bf9\u884c\u4e1a\u96be\u5ea6\u548c\u6295\u5165\u56de\u62a5\u5468\u671f\u8ba4\u77e5\u53ef\u80fd\u4e0d\u8db3\uff0c**\u53d8\u73b0\u9884\u671f\u7ba1\u7406\u662f\u5173\u952e**\u3002\n\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d\u7b49\u504f\u4f4e)**\n    *   **\u65f6\u95f4\u8d44\u6e90**: \u5de5\u85aa\u9636\u5c42\uff08\u62a4\u58eb\uff09\uff0c\u6bcf\u65e5\u788e\u7247\u5316\u65f6\u95f42-3\u5c0f\u65f6\u4e14\u4e0d\u56fa\u5b9a\u3002\u5de5\u4f5c\u7e41\u5fd9\uff08\u9700\u8bf7\u5047\u3001\u5f00\u4f1a\uff09\uff0c**\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\u4e14\u4e0d\u53ef\u63a7**\u3002\n    *   **\u7ecf\u6d4e\u8d44\u6e90**: \u672a\u63d0\u53ca\uff0c\u4f46\u4f5c\u4e3a\u62a4\u58eb\uff0c\u6536\u5165\u7a33\u5b9a\u4f46\u975e\u9ad8\u6536\u5165\uff0c\u5bf9\u4ef7\u683c\u654f\u611f\uff08\u5173\u6ce8\u4f18\u60e0\u5238\uff09\u3002\n    *   **\u6280\u80fd\u8d44\u6e90**: \u58f0\u97f3\u6761\u4ef6\u88ab\u8bc4\u4ef7\u4e3a\u201c\u5fa1\u59d0\u97f3\u201d\uff0c\u6709\u57fa\u7840\u3002\u80fd\u5b8c\u6210\u4f5c\u4e1a\uff0c\u4f46\u9700\u91cd\u65b0\u63d0\u4ea4\uff08\u6280\u672f\u64cd\u4f5c\u53ef\u80fd\u4e0d\u719f\uff09\u3002\u5b66\u4e60\u6001\u5ea6\u79ef\u6781\u3002\n\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u7b49\u504f\u9ad8)**\n    *   **\u914d\u5408\u5ea6**: \u9ad8\u3002\u79ef\u6781\u56de\u590d\u201c\u6536\u5230\u201d\u3001\u201c\u597d\u7684\u201d\uff0c\u6309\u8981\u6c42\u5b8c\u6210\u6253\u5361\u3001\u63d0\u4ea4\u4f5c\u4e1a\u3001\u89c2\u770b\u76f4\u64ad\uff08\u6216\u8865\u56de\u653e\uff09\u3002\n    *   **\u4e3b\u52a8\u6027**: \u4e2d\u7b49\u3002\u4f1a\u4e3b\u52a8\u63d0\u95ee\uff08\u201c\u600e\u4e48\u62a5\u540d\u201d\u3001\u201c\u600e\u4e48\u5b89\u6392\u201d\uff09\uff0c\u5bf9\u6d41\u7a0b\u6709\u8ddf\u8fdb\u610f\u613f\u3002\n    *   **\u6297\u538b\u6027**: \u672a\u7ecf\u5386\u660e\u663e\u632b\u6298\uff0c\u4f46\u80fd\u5e73\u8861\u5de5\u4f5c\u4e0e\u5b66\u4e60\uff08\u63d0\u524d\u8bf7\u5047\uff09\uff0c\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u89c4\u5212\u6027\u548c\u8d23\u4efb\u611f\u3002\n    *   **\u51b3\u7b56\u98ce\u683c**: \u504f\u8c28\u614e\u52a1\u5b9e\u3002\u4ece\u5e7f\u6cdb\u5174\u8da3\uff08\u201c\u90fd\u60f3\u5c1d\u8bd5\u201d\uff09\u5230\u7ed3\u5408\u81ea\u8eab\u201c\u6709\u9650\u8d44\u6e90\u201d\u9009\u62e9\u201c\u753b\u672c\u548c\u5ba1\u542c\u201d\uff0c\u663e\u793a**\u7406\u6027\u6743\u8861**\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: \u672a\u53d1\u751f\u652f\u4ed8\u884c\u4e3a\u3002\u7528\u6237\u5904\u4e8e\u4f53\u9a8c\u8425\u672b\u671f\uff0c\u9500\u552e\u5df2\u5f15\u5bfc\u81f3\u62a5\u540d\u73af\u8282\uff08\u4ef7\u683c7380\u5143\uff09\uff0c\u7528\u6237\u8be2\u95ee\u201c\u600e\u4e48\u62a5\u540d\u201d\u53ca\u201c\u9ad8\u9636\u201d\uff0c**\u5904\u4e8e\u4e34\u95e8\u4e00\u811a\u7684\u8f6c\u5316\u5173\u952e\u671f**\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u7f3a\u5931**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u914d\u5076\u3001\u7236\u6bcd\u7b49\u5bb6\u5ead\u6210\u5458\uff0c\u7528\u6237\u4ee5\u72ec\u7acb\u4e2a\u4f53\u8eab\u4efd\u6c9f\u901a\u3002\u4f5c\u4e3a\u5728\u804c\u62a4\u58eb\uff0c\u6709\u72ec\u7acb\u7ecf\u6d4e\u6765\u6e90\u53ef\u80fd\u6027\u9ad8\uff0c\u4f46\u91cd\u5927\u652f\u51fa\uff08\u59827380\u5143\u8bfe\u7a0b\uff09\u7684\u51b3\u7b56\u662f\u5426\u9700\u4e0e\u5bb6\u4eba\u5546\u8bae\u672a\u77e5\uff0c**\u6b64\u4e3a\u6f5c\u5728\u98ce\u9669\u70b9**\u3002\n*   **\u6b65\u9aa41-4 \u7efc\u5408\u5224\u5b9a**:\n    *   **A (\u652f\u4ed8\u80fd\u529b\u4e0e\u610f\u613f)**: \u6709\u610f\u613f\uff08\u4e3b\u52a8\u8be2\u95ee\uff09\uff0c\u4f46\u652f\u4ed8\u80fd\u529b\u672a\u9a8c\u8bc1\uff0c\u51b3\u7b56\u72ec\u7acb\u6027\u5b58\u7591\u3002\n    *   **B (\u9700\u6c42\u5f3a\u5ea6)**: \u9700\u6c42\u660e\u786e\uff08\u517c\u804c\uff09\uff0c\u4f46\u5f3a\u5ea6\u4e2d\u7b49\uff0c\u672a\u8868\u73b0\u51fa\u6781\u5ea6\u7126\u8651\u6216\u8feb\u5207\u3002\n    *   **C (\u4fe1\u4efb\u5efa\u7acb)**: \u4fe1\u4efb\u5ea6\u826f\u597d\u3002\u7528\u6237\u6301\u7eed\u914d\u5408\u9500\u552e\u6d41\u7a0b\uff0c\u5173\u7cfb\u878d\u6d3d\u3002\n    *   **D (\u51b3\u7b56\u963b\u529b)**: \u4e3b\u8981\u963b\u529b\u6765\u81ea**\u65f6\u95f4\u7684\u4e0d\u786e\u5b9a\u6027**\uff08\u62a4\u58eb\u6392\u73ed\uff09\u548c\u5bf9**\u6295\u5165\u4ea7\u51fa\u6bd4\u7684\u672a\u77e5**\uff08\u201c\u4e0d\u8fdb\u5165\u7cfb\u7edf\u5b66\u4e60\uff0c\u662f\u4e0d\u662f\u5c31\u4e0d\u80fd\u63a5\u5355\u201d\uff09\u3002\n    *   **\u5224\u5b9a\u7ed3\u679c**: **B+/C+\u578b\u7528\u6237**\u3002\u6709\u660e\u786e\u9700\u6c42\u548c\u521d\u6b65\u4fe1\u4efb\uff0c\u4f46\u652f\u4ed8\u51b3\u7b56\u53d7\u5236\u4e8e\u8d44\u6e90\uff08\u65f6\u95f4\u3001\u91d1\u94b1\uff09\u7684\u8c28\u614e\u8bc4\u4f30\u548c\u6f5c\u5728\u7684\u5bb6\u5ead\u51b3\u7b56\u6d41\u7a0b\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b: T4 \u52a1\u5b9e\u63a2\u7d22\u8005**\n    *   **\u7279\u5f81\u543b\u5408**:\n        1.  **\u76ee\u6807\u9a71\u52a8**: \u660e\u786e\u4ee5\u201c\u517c\u804c\u201d\u3001\u201c\u63a5\u5355\u201d\u4e3a\u76ee\u6807\uff0c\u975e\u7eaf\u5174\u8da3\u5b66\u4e60\u3002\n        2.  **\u7406\u6027\u6743\u8861**: \u4ece\u201c\u90fd\u60f3\u5c1d\u8bd5\u201d\u5230\u57fa\u4e8e\u201c\u6709\u9650\u8d44\u6e90\u201d\u9009\u62e9\u5177\u4f53\u5de5\u79cd\uff08\u753b\u672c\u3001\u5ba1\u542c\uff09\uff0c\u51b3\u7b56\u8fc7\u7a0b\u4f53\u73b0\u6210\u672c\u6536\u76ca\u8003\u91cf\u3002\n        3.  **\u914d\u5408\u4f46\u4fdd\u6709\u8ddd\u79bb**: \u884c\u52a8\u4e0a\u914d\u5408\uff0c\u4f46\u63d0\u95ee\u76f4\u6307\u6838\u5fc3\uff08\u62a5\u540d\u6761\u4ef6\u3001\u53d8\u73b0\u8def\u5f84\uff09\uff0c\u5173\u6ce8\u5b9e\u9645\u56de\u62a5\u3002\n        4.  **\u8d44\u6e90\u6709\u9650**: \u65f6\u95f4\u788e\u7247\u5316\u3001\u804c\u4e1a\u6536\u5165\u7a33\u5b9a\u4f46\u975e\u5145\u88d5\uff0c\u7b26\u5408T4\u7684\u5178\u578b\u8d44\u6e90\u7279\u5f81\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669\u7b49\u7ea7: \u4e2d**\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**: **\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u6838\u5fc3\u8bc9\u6c42\u662f\u53d8\u73b0\u3002\u82e5\u5165\u5b66\u540e\u63a5\u5355\u673a\u4f1a\u5c11\u3001\u6536\u5165\u4e0e\u5ba3\u4f20\uff0820-150/\u5c0f\u65f6\uff09\u5dee\u8ddd\u5927\uff0c\u6781\u6613\u5f15\u53d1\u6295\u8bc9\u3002\n    2.  **\u65f6\u95f4\u51b2\u7a81**: **\u9ad8\u98ce\u9669**\u3002\u62a4\u58eb\u804c\u4e1a\u4f5c\u606f\u4e0d\u89c4\u5f8b\uff0c\u4e0e\u56fa\u5b9a\u76f4\u64ad\u8bfe\u3001\u7ec3\u4e60\u8981\u6c42\u53ef\u80fd\u4ea7\u751f\u4e25\u91cd\u51b2\u7a81\uff0c\u5bfc\u81f4\u65e0\u6cd5\u8ddf\u8fdb\u5b66\u4e60\uff0c\u6210\u4e3a\u9000\u8d39\u7406\u7531\u3002\n    3.  **\u7ecf\u6d4e\u538b\u529b**: **\u4e2d\u98ce\u9669**\u30027380\u5143\u5bf9\u5de5\u85aa\u9636\u5c42\u662f\u4e00\u7b14\u4e0d\u5c0f\u5f00\u652f\uff0c\u82e5\u5bb6\u4eba\u4e0d\u540c\u610f\u6216\u81ea\u8eab\u540e\u6094\uff0c\u53ef\u80fd\u8981\u6c42\u9000\u8d39\u3002\n    4.  **\u9500\u552e\u8bef\u5bfc**: \u4f4e\u98ce\u9669\u3002\u9500\u552e\u6d41\u7a0b\u89c4\u8303\uff0c\u5f3a\u8c03\u201c\u81ea\u613f\u62a5\u540d\u201d\uff0c\u4f46\u5173\u4e8e\u201c\u76f4\u63a5\u8fdb\u5267\u7ec4\u201d\u7684\u627f\u8bfa\u82e5\u672a\u5151\u73b0\uff0c\u53ef\u80fd\u5f15\u53d1\u4e89\u8bae\u3002\n    5.  **\u5185\u5bb9\u8d28\u91cf**: \u4f4e\u98ce\u9669\u3002\u4f53\u9a8c\u8425\u53cd\u9988\u5c1a\u53ef\u3002\n    6.  **\u670d\u52a1\u4f53\u9a8c**: \u4f4e\u98ce\u9669\u3002\u76ee\u524d\u670d\u52a1\u54cd\u5e94\u53ca\u65f6\u3002\n    7.  **\u5bb6\u5ead\u53cd\u5bf9**: **\u4e2d\u9ad8\u98ce\u9669**\u3002**\u5173\u952e\u4fe1\u606f\u7f3a\u5931**\uff0c\u82e5\u62a5\u540d\u672a\u544a\u77e5\u5bb6\u4eba\uff0c\u540e\u7eed\u53ef\u80fd\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u5e76\u8981\u6c42\u9000\u8d39\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5408\u89c4\u70b9**:\n    *   \u9500\u552e\u591a\u6b21\u4f7f\u7528\u201c\u81ea\u613f\u62a5\u540d\u201d\u3001\u201c\u6839\u636e\u81ea\u5df1\u76ee\u6807\u51b3\u5b9a\u201d\u7b49\u8bdd\u672f\uff0c\u5c0a\u91cd\u7528\u6237\u9009\u62e9\u3002\n    *   \u672a\u53d1\u73b0\u660e\u663e\u5938\u5927\u6536\u76ca\u6216\u627f\u8bfa\u4fdd\u5e95\u6536\u5165\u3002\n*   **\u98ce\u9669\u70b9**:\n    *   **\u3010\u5173\u952e\u96f7\u533a\u3011** \u9500\u552e\u63d0\u53ca\u201c\u6211\u89c9\u5f97\u4f60\u6709\u5f88\u5927\u673a\u4f1a\u53ef\u4ee5\u76f4\u63a5\u8fdb\u5267\u7ec4\u201d\u3001\u201c\u63d0\u524d\u4e3a\u8fdb\u5267\u7ec4\u505a\u51c6\u5907\u201d\u3002\u6b64\u8868\u8ff0\u53ef\u80fd\u8ba9\u7528\u6237\u4ea7\u751f**\u4e0d\u5207\u5b9e\u9645\u7684\u9884\u671f**\uff0c\u8ba4\u4e3a\u62a5\u540d\u5373\u53ef\u83b7\u5f97\u5267\u7ec4\u673a\u4f1a\uff0c\u5b58\u5728\u8bf1\u5bfc\u5acc\u7591\u3002\n    *   \u672a\u4e3b\u52a8\u8be2\u95ee\u6216\u63d0\u9192\u7528\u6237\u91cd\u5927\u6d88\u8d39\u9700\u4e0e\u5bb6\u4eba\u5546\u8bae\u3002\n    *   \u8f6c\u5316\u8bdd\u672f\u96c6\u4e2d\u4e8e\u201c\u6700\u540e\u673a\u4f1a\u201d\u3001\u201c\u4f18\u60e0\u5238\u201d\u3001\u201c\u540d\u989d\u6709\u9650\u201d\uff0c\u53ef\u80fd\u8425\u9020\u7d27\u8feb\u611f\uff0c\u4f46\u672a\u53d1\u73b0\u865a\u5047\u4fe1\u606f\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6: \u504f\u5dee**\n    *   \u7528\u6237\uff08T4\u52a1\u5b9e\u63a2\u7d22\u8005\uff09\u6838\u5fc3\u9700\u6c42\u662f**\u7075\u6d3b\u3001\u4f4e\u95e8\u69db\u3001\u5feb\u89c1\u6548\u7684\u517c\u804c\u53d8\u73b0**\u3002\n    *   \u7cfb\u7edf\u8bfe\uff08\u9ad8\u9636\uff0c7380\u5143\uff09\u901a\u5e38\u662f**\u957f\u671f\u3001\u7cfb\u7edf\u3001\u91cd\u6295\u5165**\u7684\u5b66\u4e60\u6a21\u5f0f\uff0c\u4e0e\u7528\u6237\u201c\u65f6\u95f4\u788e\u7247\u5316\u3001\u8ffd\u6c42\u660e\u786e\u56de\u62a5\u201d\u7684\u7279\u5f81\u5b58\u5728**\u6f5c\u5728\u9519\u914d**\u3002\u66f4\u9002\u5408\u5979\u7684\u662f**\u8f7b\u91cf\u7ea7\u3001\u9879\u76ee\u5236\u3001\u5f3a\u5b9e\u64cd**\u7684\u77ed\u671f\u8bad\u7ec3\u8425\u6216\u63a5\u5355\u793e\u7fa4\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c: \u7b7e\u7ea6\u524d\u8fdb\u884c\u5bb6\u5ead\u77e5\u60c5\u4e0e\u65f6\u95f4\u6838\u9a8c**\n*   **\u5177\u4f53\u884c\u52a8\u6307\u5357**:\n    1.  **\u9884\u671f\u7ba1\u7406\uff08\u9996\u8981\uff09**: \u6b63\u5f0f\u7b7e\u7ea6\u524d\uff0c\u5fc5\u987b\u5411\u7528\u6237\u5ba2\u89c2\u8bf4\u660e\uff1a\u7cfb\u7edf\u8bfe\u7684\u5b66\u4e60\u5f3a\u5ea6\u3001\u65f6\u95f4\u8981\u6c42\uff1b\u6709\u58f0\u884c\u4e1a\u517c\u804c\u7684\u771f\u5b9e\u6536\u5165\u5206\u5e03\uff08\u5f3a\u8c03\u4e8c\u516b\u5b9a\u5f8b\uff09\uff1b\u201c\u8fdb\u5267\u7ec4\u201d\u9700\u8981\u7684\u80fd\u529b\u79ef\u7d2f\u548c\u7ade\u4e89\u60c5\u51b5\uff0c**\u6821\u6b63\u5176\u57fa\u4e8e\u9500\u552e\u8bdd\u672f\u53ef\u80fd\u5f62\u6210\u7684\u8fc7\u9ad8\u9884\u671f**\u3002\n    2.  **\u5bb6\u5ead\u77e5\u60c5\u6838\u67e5**: \u5fc5\u987b\u8be2\u95ee\uff1a\u201c\u8d2d\u4e70\u8bfe\u7a0b\u662f\u4e00\u7b14\u4e0d\u5c0f\u7684\u6295\u8d44\uff0c\u662f\u5426\u9700\u8981\u548c\u5bb6\u4eba\u5546\u91cf\u4e00\u4e0b\uff1f\u201d\u6216\u201c\u6211\u4eec\u5f88\u591a\u5b66\u5458\u4f1a\u548c\u5bb6\u4eba\u4e00\u8d77\u505a\u51b3\u5b9a\uff0c\u60a8\u8fd9\u8fb9\u9700\u8981\u5417\uff1f\u201d**\u83b7\u53d6\u5bb6\u5ead\u652f\u6301\u6216\u81f3\u5c11\u77e5\u60c5\uff0c\u662f\u907f\u514d\u540e\u7eed\u7ea0\u7eb7\u7684\u5173\u952e**\u3002\n    3.  **\u65f6\u95f4\u53ef\u884c\u6027\u786e\u8ba4**: \u7ed3\u5408\u62a4\u58eb\u6392\u73ed\uff0c\u4e0e\u7528\u6237\u5171\u540c\u89c4\u5212\u4e00\u4e2a\u53ef\u884c\u7684\u5b66\u4e60\u65f6\u95f4\u8868\uff0c\u660e\u786e\u544a\u77e5\u7f3a\u8bfe\u7684\u8865\u6551\u63aa\u65bd\u548c\u53ef\u80fd\u5bf9\u8fdb\u5ea6\u7684\u5f71\u54cd\uff0c\u8ba9\u5176\u5bf9\u65f6\u95f4\u51b2\u7a81\u6709\u9884\u5224\u3002\n    4.  **\u63d0\u4f9b\u66ff\u4ee3\u65b9\u6848\uff08\u5982\u9002\u7528\uff09**: \u5982\u679c\u516c\u53f8\u6709\u66f4\u7075\u6d3b\u3001\u4f4e\u4ef7\u7684\u5165\u95e8\u63a5\u5355\u4ea7\u54c1\uff0c\u53ef\u4f5c\u4e3a\u5907\u9009\u63a8\u8350\uff0c\u66f4\u5339\u914d\u5176\u5f53\u524d\u72b6\u6001\u3002\n    5.  **\u98ce\u9669\u544a\u77e5\u5b58\u6863**: \u5c06\u4ee5\u4e0a\u5173\u4e8e\u65f6\u95f4\u3001\u6548\u679c\u3001\u5bb6\u5ead\u5546\u8bae\u7684\u6c9f\u901a\u8981\u70b9\uff0c\u901a\u8fc7\u6587\u5b57\u5f62\u5f0f\uff08\u5982\u5fae\u4fe1\uff09\u53d1\u9001\u7ed9\u7528\u6237\u786e\u8ba4\uff0c\u5e76\u4fdd\u7559\u8bb0\u5f55\u3002\n\n{\"core_type\": \"T4 \u52a1\u5b9e\u63a2\u7d22\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u7b7e\u7ea6\u524d\u5bb6\u5ead\u77e5\u60c5\u4e0e\u65f6\u95f4\u6838\u9a8c\"}";
