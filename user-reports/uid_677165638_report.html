        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677165638 (\u6635\u79f0\uff1a\u5f90\u4e56\u5de7) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u51ac\u51ac\u8001\u5e08\u3010\u5f20\u9707\u8001\u5e08\u5f92\u5f1f\u3011(\u90d1\u9ece)\u3001\u53ef\u53ef\u8001\u5e081(\u90d1\u9ece) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u5f20\u9707\u8001\u5e08\u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u610f\u5411\u9636\u6bb5\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\uff0c\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u9700\u517c\u987e\u5b69\u5b50\u3001\u5bb6\u5ead\uff08\u8001\u4eba\u4f4f\u9662\uff09\uff0c\u5b66\u4e60\u65f6\u95f4\u9700\u89c1\u7f1d\u63d2\u9488\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\uff0c\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u5ea6\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u5b66\u4e60\u884c\u4e3a\u4e0e\u4e92\u52a8\u4fe1\u53f7\u660e\u786e\uff0c\u4f46\u5173\u952e\u51b3\u7b56\u4fe1\u606f\uff08\u652f\u4ed8\u80fd\u529b\u3001\u5bb6\u5ead\u652f\u6301\u3001\u6df1\u5c42\u52a8\u673a\uff09\u7f3a\u5931\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u2b06\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u4e13\u4e1a\u8ba4\u53ef\u800c\u6765\u3002\u5173\u6ce8\u201c\u7532\u65b9\u6807\u51c6\u201d\u3001\u201c\u5b9e\u6218\u6d3e\u6559\u5b66\u201d\u3001\u201c\u8fdb\u5267\u793e\u56e2\u961f\u201d\uff0c\u8868\u73b0\u51fa\u5bf9\u4e13\u4e1a\u7cbe\u8fdb\u548c\u884c\u4e1a\u8ba4\u53ef\u7684\u5f3a\u70c8\u6e34\u671b\uff0c\u800c\u975e\u5355\u7eaf\u77ed\u671f\u53d8\u73b0\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4e5f\u671f\u5f85\u80fd\u591f\u6210\u957f\u548c\u8fdb\u6b65\uff0c\u7136\u540e\u987a\u5229\u63a5\u5230\u5546\u5355\u548c\u6709\u58f0\u4e66\u7684\u5f55\u5236\u673a\u4f1a\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u6709\u56fa\u5b9a\u5de5\u4f5c/\u5bb6\u5ead\u8d23\u4efb\uff08\u9001\u5b69\u5b50\u3001\u53bb\u533b\u9662\uff09\uff0c\u4f46\u80fd\u5229\u7528\u788e\u7247\u65f6\u95f4\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\u548cPia\u620f\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u4e13\u4e1a\u70b9\u8bc4\uff0c\u80fd\u4e3b\u52a8\u590d\u76d8\u6539\u8fdb\uff08\u201c\u6211\u4e0b\u6b21\u518d\u8bd5\u7740\u8c03\u6574\u6539\u8fdb\u201d\uff09\uff0c\u65e0\u4efb\u4f55\u8d1f\u9762\u60c5\u7eea\u6216\u4f9d\u8d56\u5b89\u629a\u7684\u4fe1\u53f7\uff0c\u8868\u73b0\u51fa\u7a33\u5b9a\u7684\u5b66\u4e60\u5fc3\u6001\u548c\u6267\u884c\u529b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6536\u5230\u5e08\u59d0\u7684\u70b9\u8bc4\u4e86\uff0c\u6211\u4e0b\u6b21\u518d\u8bd5\u7740\u8c03\u6574\u6539\u8fdb\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u6e34\u671b\u83b7\u5f97\u4e13\u4e1a\u6743\u5a01\uff08\u5f20\u9707\u8001\u5e08\uff09\u7684\u8ba4\u53ef\u4e0e\u63a5\u7eb3\uff0c\u8fdb\u5165\u201c\u5267\u793e\u56e2\u961f\u201d\uff0c\u6210\u4e3a\u88ab\u884c\u4e1a\u6807\u51c6\u63a5\u7eb3\u7684\u201c\u5708\u5185\u4eba\u201d\uff0c\u5b9e\u73b0\u4ece\u7231\u597d\u8005\u5230\u4e13\u4e1a\u8005\u7684\u8eab\u4efd\u8dc3\u8fc1\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u8eab\u4efd\u7684\u201c\u52a0\u5195\u201d\u4e0e\u5708\u5c42\u5f52\u5c5e\u611f**\u3002\u63d0\u4f9b\u201c\u88ab\u5e08\u7236\u770b\u597d\u201d\u3001\u201c\u4f18\u79c0\u5b66\u5458\u201d\u3001\u201c\u6709\u673a\u4f1a\u8fdb\u7ec4\u201d\u7b49\u6807\u7b7e\uff0c\u6ee1\u8db3\u5176\u5bf9\u5c0a\u91cd\u548c\u884c\u4e1a\u5730\u4f4d\u7684\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u6709\u5411T1-A\u8fdb\u5316\u7684\u6f5c\u529b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u76ee\u524d\u672a\u53d1\u73b0\u5bb6\u5ead\u77db\u76fe\u4fe1\u53f7\uff0c\u4f46\u9700\u8b66\u60d5\u56e0\u7167\u987e\u8001\u4eba/\u5b69\u5b50\u5bfc\u81f4\u65f6\u95f4\u67af\u7aed\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u5bb6\u5ead\u4e8b\u52a1\uff08\u8001\u4eba\u4f4f\u9662\uff09\u53ef\u80fd\u6324\u538b\u5b66\u4e60\u65f6\u95f4\uff0c\u5bfc\u81f4\u4f5c\u4e1a\u79ef\u538b\u3001\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\uff0c\u4ea7\u751f\u81ea\u8d23\u548c\u65e0\u529b\u611f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u6539\u8fdb\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u632b\u6298\u7834\u9632\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u52a8\u673a\u4e3a\u4e13\u4e1a\u6210\u957f\u800c\u975e\u6781\u901f\u53d8\u73b0\uff0c\u5bf9\u6536\u76ca\u6709\u5408\u7406\u9884\u671f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-4\u5468\u540e**\u3002\u5f53\u5bb6\u5ead\u4e8b\u52a1\u4e0e\u8bfe\u7a0b\u5f3a\u5ea6\u53e0\u52a0\uff0c\u82e5\u65e0\u6cd5\u5e73\u8861\u5bfc\u81f4\u5b66\u4e60\u6389\u961f\uff0c\u53ef\u80fd\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u840c\u751f\u9000\u610f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4e56\u5de7\uff0c\u770b\u5230\u4f60\u53c8\u8981\u987e\u5bb6\u53c8\u8981\u5b66\u4e60\uff0c\u8fd8\u80fd\u628a\u4f5c\u4e1a\u5b8c\u6210\u5f97\u8fd9\u4e48\u597d\uff0c\u771f\u7684\u975e\u5e38\u4f69\u670d\u4f60\u7684\u97e7\u52b2\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u5c31\u662f\u4e3a\u4f60\u8fd9\u6837\u6709\u6f5c\u529b\u4f46\u65f6\u95f4\u7d27\u7684\u4eba\u8bbe\u8ba1\u7684\uff0c\u8282\u594f\u53ef\u4ee5\u81ea\u5df1\u628a\u63e1\uff0c\u6709\u4efb\u4f55\u65f6\u95f4\u51b2\u7a81\u968f\u65f6\u8ddf\u6211\u8bf4\uff0c\u54b1\u4eec\u4e00\u8d77\u8c03\u6574\u8ba1\u5212\u3002\u5f20\u9707\u8001\u5e08\u90a3\u8fb9\u6211\u5df2\u7ecf\u7279\u522b\u63a8\u8350\u4f60\u4e86\uff0c\u4ed6\u5f88\u770b\u597d\u80fd\u6c89\u4e0b\u5fc3\u6253\u78e8\u4f5c\u54c1\u7684\u4eba\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176\u8ffd\u6c42\u4e13\u4e1a\u7cbe\u8fdb\u7684\u9700\u6c42\uff0c\u63d0\u4f9b\u624e\u5b9e\u7684\u6280\u672f\u8bad\u7ec3\u548c\u884c\u4e1a\u8d44\u6e90\u5bf9\u63a5\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\u7684\u7279\u70b9\uff0c\u8865\u5145**\u3010\u5f39\u6027\u65f6\u95f4\u7ba1\u7406\u652f\u6301\u5305\u3011**\uff08\u5982\u5f55\u64ad\u91cd\u70b9\u6807\u8bb0\u3001\u4f5c\u4e1a\u5f39\u6027\u63d0\u4ea4\u7a97\u53e3\uff09\u3002**\u89c2\u5bdf\u5176\u662f\u5426\u51fa\u73b0\u4e3b\u52a8\u5e2e\u52a9\u540c\u5b66\u3001\u7edf\u7b79\u4e8b\u52a1\u7684\u884c\u4e3a\uff0c\u4e00\u65e6\u51fa\u73b0\uff0c\u7acb\u5373\u542f\u52a8\u3010\u9ec4\u888d\u52a0\u8eab\u63d0\u5e72\u6cd5\u3011\uff0c\u6388\u4e88\u5176\u5c0f\u7ec4\u957f\u6216\u52a9\u6559\u8eab\u4efd\uff08D\u6a21\u5757\uff09\uff0c\u5c06\u5176\u56fa\u5316\u4e3a\u751f\u6001\u5efa\u8bbe\u8005\u3002**\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u6700\u540e\u540d\u989d\u201d\u3001\u201c\u9650\u65f6\u4f18\u60e0\u201d\u7b49\u903c\u5355\u8bdd\u672f\u65bd\u538b\u3002\u8fd9\u4f1a\u7834\u574f\u5176\u5efa\u7acb\u7684\u4e13\u4e1a\u4fe1\u4efb\u611f\u3002\u907f\u514d\u5c06\u5176\u5f53\u4f5c\u7eaf\u53d8\u73b0\u7528\u6237\uff08T4\uff09\u5bf9\u5f85\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u8fdb\u884c\u5927\u989d\u8bfe\u7a0b\u63a8\u4ecb\uff0c\u4f46**\u5fc5\u987b\u4e0e\u4e13\u4e1a\u6210\u957f\u8def\u5f84\u5f3a\u5173\u8054**\uff08\u5982\u201c\u4e3a\u4e86\u8fdb\u5267\u793e\uff0c\u4f60\u9700\u8981\u8fd9\u5957\u66f4\u7cfb\u7edf\u7684\u8bad\u7ec3\u201d\uff09\uff0c\u800c\u975e\u5355\u7eaf\u5f3a\u8c03\u8d5a\u94b1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u4e5f\u671f\u5f85\u80fd\u591f\u6210\u957f\u548c\u8fdb\u6b65\uff0c\u7136\u540e\u987a\u5229\u63a5\u5230\u5546\u5355\u548c\u6709\u58f0\u4e66\u7684\u5f55\u5236\u673a\u4f1a\u201d **(\u9ad8\u52a8\u673a\u7eaf\u5ea6\uff0c\u8ffd\u6c42\u6210\u957f\u4e0e\u8ba4\u53ef)**\n2. > \u201c\u6536\u5230\u5e08\u59d0\u7684\u70b9\u8bc4\u4e86\uff0c\u6211\u4e0b\u6b21\u518d\u8bd5\u7740\u8c03\u6574\u6539\u8fdb\u201d **(\u9ad8\u5fc3\u7406\u5f39\u6027\uff0c\u4e3b\u52a8\u6d88\u5316\u6539\u8fdb)**\n3. > \u201c\u5bb6\u91cc\u8001\u4eba\u751f\u75c5\u4e86\u2026\u2026\u51c6\u5907\u8d76\u53bb\u533b\u9662\u63a2\u671b\u201d **(\u8d44\u6e90\u5e95\u5ea7\u4e2d\u4f4d\uff0c\u65f6\u95f4\u788e\u7247\u5316\uff0c\u5b58\u5728\u8ddf\u8fdb\u5d29\u76d8\u98ce\u9669)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u5708\u5c42\u7684\u5c0a\u91cd\u4e0e\u8eab\u4efd\u8ba4\u540c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u4e3b\u8981\u98ce\u9669\u6765\u81ea **\u3010\u5bb6\u5ead\u4e8b\u52a1\u5bfc\u81f4\u7684\u65f6\u95f4\u6324\u538b\u4e0e\u5b66\u4e60\u6389\u961f\u3011**\u3002\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u5f39\u6027\u5b66\u4e60\u652f\u6301\uff0c\u5e76\u5bc6\u5207\u5173\u6ce8\u5176\u201c\u6743\u9650\u89c9\u9192\u201d\u4fe1\u53f7\uff0c\u9002\u65f6\u8d4b\u4e88\u7ba1\u7406\u89d2\u8272\uff08D\u6a21\u5757\uff09\u8fdb\u884c\u6df1\u5ea6\u7ed1\u5b9a\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd/\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5f39\u6027\u65f6\u95f4\u652f\u6301\u5305\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}\n```";
