    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## \u4fe1\u606f\u5145\u8db3\u6027\u8bc4\u4f30\n\u4fe1\u606f\u5145\u8db3\uff0c\u53ef\u5b8c\u6210\u5206\u6790\u3002\n\n---\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**\n    *   **\u5b66\u4e60\u610f\u613f**\uff1a\u4e2d\u7b49\u3002\u7528\u6237\u80fd\u5b8c\u6210\u6668\u7ec3\u3001\u542c\u8bfe\u3001\u6253\u5361\u7b49\u89c4\u5b9a\u52a8\u4f5c\uff0c\u56de\u590d\u201c\u7ee7\u7eed\u52aa\u529b\u201d\u3001\u201c\u4e00\u5b9a\uff0c\u5b66\u4e60\u201d\u3001\u201c\u542c\u8001\u5e08\u6307\u5bfc\u201d\uff0c\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u914d\u5408\u5ea6\u548c\u5b66\u4e60\u610f\u613f\u3002\n    *   **\u804c\u4e1a/\u53d8\u73b0\u9a71\u52a8**\uff1a**\u9ad8**\u3002\u6838\u5fc3\u9a71\u52a8\u529b\u660e\u786e\u3002\u7528\u6237\u4e3b\u52a8\u8be2\u95ee\u201c\u600e\u4e48\u4ea4\u201d\uff0c\u5173\u6ce8\u201c\u6709\u6536\u76ca\uff0c\u5c31\u884c\u201d\uff0c\u5e76\u5728\u8d44\u91d1\u4e0d\u8db3\u65f6\u4e3b\u52a8\u5bfb\u6c42\u201c\u652f\u4ed8\u5b9d\u5206\u671f\u201d\u65b9\u6848\u3002\u5176\u53c2\u4e0e\u8bad\u7ec3\u8425\u7684\u6838\u5fc3\u76ee\u6807\u662f\u83b7\u53d6\u517c\u804c\u6536\u5165\u3002\n    *   **\u5174\u8da3/\u81ea\u6211\u5b9e\u73b0**\uff1a\u4f4e\u3002\u804a\u5929\u8bb0\u5f55\u4e2d\u672a\u4f53\u73b0\u5bf9\u58f0\u97f3\u827a\u672f\u3001\u6f14\u64ad\u672c\u8eab\u7684\u6d53\u539a\u5174\u8da3\u6216\u81ea\u6211\u8868\u8fbe\u8bc9\u6c42\u3002\u9009\u62e9\u201c\u519b\u4e8b\u5386\u53f2\u5c0f\u8bf4\u201d\u53ef\u80fd\u57fa\u4e8e\u9500\u552e\u5f15\u5bfc\u6216\u5bf9\u5185\u5bb9\u7c7b\u578b\u7684\u504f\u597d\uff0c\u800c\u975e\u6df1\u5c42\u5174\u8da3\u3002\n    *   **\u4fe1\u53f7\u5f3a\u5ea6**\uff1a**M- (\u52a8\u673a\u7eaf\u5ea6\u8f83\u4f4e)**\u3002\u52a8\u673a\u9ad8\u5ea6\u96c6\u4e2d\u4e8e\u201c\u5feb\u901f\u53d8\u73b0\u201d\uff0c\u5bf9\u5b66\u4e60\u8fc7\u7a0b\u672c\u8eab\u3001\u6280\u80fd\u63d0\u5347\u7684\u957f\u671f\u4ef7\u503c\u5173\u6ce8\u5ea6\u4f4e\uff0c\u6613\u53d7\u77ed\u671f\u6536\u76ca\u9884\u671f\u5f71\u54cd\u3002\n\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**\n    *   **\u7ecf\u6d4e\u8d44\u6e90**\uff1a**\u8584\u5f31**\u3002\u660e\u786e\u8868\u793a\u201c\u94b1\u4e0d\u591f\u201d\u3001\u201c\u6ca1\u6709\u90a3\u4e48\u591a\u94b1\u201d\uff0c\u9700\u8981\u4f9d\u8d56\u201c\u652f\u4ed8\u5b9d\u5206\u671f\u201d\u652f\u4ed83980\u5143\u8bfe\u7a0b\u8d39\u7528\u3002\u652f\u4ed8\u80fd\u529b\u662f\u5176\u4e3b\u8981\u74f6\u9888\u3002\n    *   **\u65f6\u95f4\u8d44\u6e90**\uff1a\u4e2d\u7b49\u3002\u7528\u6237\u8868\u793a\u53ef\u505a\u201c\u517c\u804c\u201d\uff0c\u80fd\u8ddf\u4e0a\u8fde\u7eed\u591a\u65e5\u7684\u5bc6\u96c6\u76f4\u64ad\u3001\u6253\u5361\u3001\u7ec3\u4e60\u4efb\u52a1\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u53ef\u652f\u914d\u7684\u788e\u7247\u5316\u65f6\u95f4\u3002\n    *   **\u8bbe\u5907/\u73af\u5883\u8d44\u6e90**\uff1a\u672a\u77e5\u3002\u672a\u63d0\u53ca\u5f55\u97f3\u8bbe\u5907\u3001\u5b89\u9759\u73af\u5883\u7b49\u786c\u4ef6\u6761\u4ef6\u3002\n    *   **\u5b66\u4e60\u57fa\u7840**\uff1a\u672a\u77e5\u3002\u672a\u63d0\u53ca\u4efb\u4f55\u76f8\u5173\u80cc\u666f\uff0c\u4ece\u9500\u552e\u201c\u96f6\u57fa\u7840\u5c0f\u767d\u201d\u7684\u901a\u7528\u8bdd\u672f\u63a8\u65ad\uff0c\u53ef\u80fd\u4e3a\u96f6\u57fa\u7840\u3002\n    *   **\u4fe1\u53f7\u5f3a\u5ea6**\uff1a**R- (\u8d44\u6e90\u5e95\u5ea7\u8584\u5f31)**\u3002\u7ecf\u6d4e\u8d44\u6e90\u662f\u660e\u663e\u77ed\u677f\uff0c\u4e14\u672a\u663e\u793a\u51fa\u53ef\u5f25\u8865\u8be5\u77ed\u677f\u7684\u5176\u4ed6\u4f18\u52bf\u8d44\u6e90\uff08\u5982\u4f18\u8d28\u8bbe\u5907\u3001\u6df1\u539a\u57fa\u7840\uff09\u3002\n\n*   **\u5fc3\u7406\u5f39\u6027 (E)**\n    *   **\u575a\u6301\u6027**\uff1a\u4e2d\u7b49\u504f\u4e0a\u3002\u57283\u5929\u7684\u4f53\u9a8c\u8425\u4e2d\u80fd\u575a\u6301\u5b8c\u6210\u4efb\u52a1\uff0c\u670d\u4ece\u5b89\u6392\u3002\n    *   **\u6297\u632b\u6298\u80fd\u529b**\uff1a**\u672a\u77e5/\u5b58\u7591**\u3002\u5168\u7a0b\u5728\u9500\u552e\u9f13\u52b1\u548c\u6b63\u5411\u53cd\u9988\u4e2d\u63a8\u8fdb\uff0c\u672a\u7ecf\u5386\u4efb\u4f55\u5b9e\u8d28\u6027\u7684\u56f0\u96be\u3001\u6279\u8bc4\u6216\u8bd5\u97f3\u5931\u8d25\u3002\u9762\u5bf9\u672a\u6765\u5b66\u4e60\u4e2d\u5fc5\u7136\u9047\u5230\u7684\u74f6\u9888\uff08\u5982\u8bd5\u97f3\u591a\u6b21\u4e0d\u4e2d\u3001\u6536\u5165\u4e0d\u53ca\u9884\u671f\uff09\u65f6\u7684\u53cd\u5e94\u65e0\u6cd5\u5224\u65ad\u3002\n    *   **\u72ec\u7acb\u6027/\u6279\u5224\u6027\u601d\u7ef4**\uff1a\u4f4e\u3002\u7528\u6237\u8bdd\u8bed\u7b80\u77ed\uff0c\u591a\u4e3a\u201c\u597d\u7684\u201d\u3001\u201c\u660e\u767d\u201d\u3001\u201c\u542c\u8001\u5e08\u6307\u5bfc\u201d\uff0c\u8868\u73b0\u51fa\u9ad8\u5ea6\u7684\u987a\u4ece\u6027\u548c\u5bf9\u9500\u552e\u8def\u5f84\u7684\u4f9d\u8d56\uff0c\u7f3a\u4e4f\u4e3b\u52a8\u63d0\u95ee\u6216\u6df1\u5165\u63a2\u8ba8\u3002\n    *   **\u4fe1\u53f7\u5f3a\u5ea6**\uff1a**E- (\u5fc3\u7406\u5f39\u6027\u5b58\u7591\u504f\u4f4e)**\u3002\u9ad8\u987a\u4ece\u6027\u5728\u987a\u5883\u4e2d\u8868\u73b0\u4e3a\u201c\u597d\u7ba1\u7406\u201d\uff0c\u4f46\u5728\u9006\u5883\u4e2d\u53ef\u80fd\u8fc5\u901f\u8f6c\u5316\u4e3a\u653e\u5f03\u6216\u62b1\u6028\u3002**\u6297\u538b\u80fd\u529b\u662f\u6700\u5927\u98ce\u9669\u70b9**\u3002\n\n---\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u5df2\u5b8c\u6210\u652f\u4ed8\uff08\u901a\u8fc7\u5206\u671f\u652f\u4ed83980\u5143\uff09\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u4fe1\u606f\u4e0d\u8db3\u3002\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u6210\u5458\u6216\u9700\u5546\u8bae\u7684\u8ff9\u8c61\uff0c\u770b\u4f3c\u4e3a\u4e2a\u4eba\u51b3\u7b56\u3002\u4f46\u9274\u4e8e\u5176\u7ecf\u6d4e\u62ee\u636e\uff0c**\u5b58\u5728\u5bb6\u5ead\u4e0d\u77e5\u60c5\u6216\u53cd\u5bf9\u7684\u6f5c\u5728\u98ce\u9669**\u3002\n*   **\u5224\u5b9a\u8def\u5f84**\uff1a\n    1.  **\u652f\u4ed8\u80fd\u529b\u5f31 (R-)** \u2192 \u6307\u5411 C/D \u7c7b\u3002\n    2.  **\u52a8\u673a\u7eaf\u5ea6\u4f4e (M-)\uff0c\u4ee5\u5feb\u901f\u53d8\u73b0\u4e3a\u6838\u5fc3** \u2192 \u7ed3\u5408\u8d44\u6e90\u8584\u5f31\uff0c**\u5f3a\u70c8\u6307\u5411 D \u7c7b (\u98ce\u9669\u578b)**\u3002\n    3.  \u5fc3\u7406\u5f39\u6027\u5b58\u7591 (E-)\uff0c\u8fdb\u4e00\u6b65\u5de9\u56fa D \u7c7b\u5224\u65ad\u3002\n*   **\u6700\u7ec8\u5224\u5b9a**\uff1a**D\u7c7b (\u9ad8\u98ce\u9669\u7528\u6237)**\u3002\u8d44\u6e90\u4e0e\u52a8\u673a\u9519\u914d\uff0c\u652f\u4ed8\u80fd\u529b\u4e0d\u8db3\u4e14\u5bf9\u56de\u62a5\u671f\u671b\u9ad8\uff0c\u9000\u8d39\u98ce\u9669\u6781\u9ad8\u3002\n\n---\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n\n*   **\u6838\u5fc3\u7279\u5f81**\uff1a\u7ecf\u6d4e\u62ee\u636e\u3001\u5bfb\u6c42\u517c\u804c\u589e\u6536\u3001\u5bf9\u884c\u4e1a\u8ba4\u77e5\u6d45\u3001\u51b3\u7b56\u987a\u4ece\u3001\u6297\u98ce\u9669\u80fd\u529b\u672a\u77e5\u3002\n*   **\u5339\u914d\u539f\u578b**\uff1a**T7 \u7ecf\u6d4e\u62ee\u636e\u7684\u6295\u673a\u8005**\u3002\n    *   **\u5178\u578b\u7279\u5f81**\uff1a\u652f\u4ed8\u80fd\u529b\u662f\u6700\u5927\u7ea6\u675f\uff0c\u5e0c\u671b\u901a\u8fc7\u4f4e\u6295\u5165\uff08\u65f6\u95f4/\u91d1\u94b1\uff09\u5feb\u901f\u83b7\u5f97\u517c\u804c\u6536\u5165\uff0c\u6539\u53d8\u7ecf\u6d4e\u72b6\u51b5\u3002\u5bf9\u884c\u4e1a\u96be\u5ea6\u548c\u81ea\u8eab\u6761\u4ef6\u8ba4\u77e5\u4e0d\u8db3\uff0c\u6613\u88ab\u201c\u4f4e\u95e8\u69db\u9ad8\u56de\u62a5\u201d\u8bdd\u672f\u5438\u5f15\u3002\n    *   **\u4e00\u81f4\u6027**\uff1a\u9ad8\u5ea6\u543b\u5408\u3002\u7528\u6237\u884c\u4e3a\u5b8c\u5168\u56f4\u7ed5\u201c\u517c\u804c\u201d\u3001\u201c\u6536\u76ca\u201d\u3001\u201c\u5206\u671f\u4ed8\u6b3e\u201d\u5c55\u5f00\uff0c\u5b66\u4e60\u8fc7\u7a0b\u8868\u73b0\u4e3a\u5b8c\u6210\u4efb\u52a1\u7684\u5de5\u5177\u6027\u884c\u4e3a\u3002\n\n---\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u6781\u9ad8)\n\n\u9010\u9879\u6392\u67e57\u79cd\u9000\u8d39\u6839\u56e0\uff1a\n1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u6781\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u6838\u5fc3\u8bc9\u6c42\u662f\u201c\u6709\u6536\u76ca\uff0c\u5c31\u884c\u201d\u3002\u8bfe\u7a0b\u65e0\u6cd5\u4fdd\u8bc1\u77ed\u671f\u7a33\u5b9a\u6536\u5165\uff0c\u4e00\u65e6\u8bd5\u97f3\u5c61\u6b21\u5931\u8d25\u6216\u521d\u671f\u6536\u5165\u5fae\u8584\uff0c\u6781\u6613\u5f15\u53d1\u201c\u88ab\u9a97\u201d\u611f\u3002\n2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u9ad8\u98ce\u9669**\u3002\u5df2\u4f7f\u7528\u5206\u671f\u4ed8\u6b3e\uff0c\u82e5\u540e\u7eed\u751f\u6d3b\u51fa\u73b0\u6ce2\u52a8\u6216\u6536\u5165\u4e0d\u53ca\u9884\u671f\uff0c\u8fd8\u6b3e\u538b\u529b\u5c06\u76f4\u63a5\u8f6c\u5316\u4e3a\u9000\u8d39\u8bc9\u6c42\u3002\n3.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u4e2d\u9ad8\u98ce\u9669**\u3002\u867d\u672a\u63d0\u53ca\uff0c\u4f46\u7ecf\u6d4e\u62ee\u636e\u72b6\u6001\u4e0b\u7684\u5927\u989d\u652f\u51fa\uff0c\u5bb6\u5ead\u4e8b\u540e\u77e5\u60c5\u7684\u53cd\u5bf9\u6982\u7387\u4e0d\u4f4e\u3002\n4.  **\u65f6\u95f4\u51b2\u7a81**\uff1a\u4e2d\u7b49\u98ce\u9669\u3002\u76ee\u524d\u6709\u65f6\u95f4\uff0c\u4f46\u82e5\u517c\u804c\u6295\u5165\u4ea7\u51fa\u6bd4\u8fc7\u4f4e\uff0c\u53ef\u80fd\u56e0\u673a\u4f1a\u6210\u672c\u653e\u5f03\u3002\n5.  **\u5185\u5bb9/\u670d\u52a1\u4e0d\u6ee1**\uff1a\u4f4e\u98ce\u9669\u3002\u76ee\u524d\u914d\u5408\u5ea6\u9ad8\uff0c\u4f46\u82e5\u540e\u7eed\u670d\u52a1\uff08\u5982\u8d44\u6e90\u63a8\u8350\u3001\u6307\u5bfc\uff09\u672a\u8fbe\u5176\u201c\u5feb\u901f\u63a5\u5355\u201d\u9884\u671f\uff0c\u53ef\u80fd\u4e0d\u6ee1\u3002\n6.  **\u7ade\u54c1/\u66ff\u4ee3\u65b9\u6848**\uff1a\u4e2d\u7b49\u98ce\u9669\u3002\u82e5\u53d1\u73b0\u5176\u4ed6\u201c\u66f4\u5feb\u6377\u201d\u7684\u8d5a\u94b1\u9014\u5f84\uff0c\u53ef\u80fd\u8f6c\u79fb\u3002\n7.  **\u4e2a\u4eba\u91cd\u5927\u53d8\u6545**\uff1a\u672a\u77e5\u3002\n\n**\u7efc\u5408\u9000\u8d39\u98ce\u9669\u8bc4\u7ea7**\uff1a**\u6781\u9ad8**\n\n---\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n\n*   **\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u53d8\u73b0\u5f15\u5bfc**\uff1a**\u9500\u552e\u5b58\u5728\u660e\u663e\u8fc7\u5ea6\u5f15\u5bfc**\u3002\u9891\u7e41\u4f7f\u7528\u201c\u65f6\u85aa90-300\u201d\u3001\u201c\u53d8\u73b0\u6e20\u9053\u201d\u3001\u201c\u7b2c\u4e00\u6876\u91d1\u201d\u3001\u201c\u7248\u6743\u4e66\uff08\u53d8\u73b0\u6572\u95e8\u7816\uff09\u201d\u7b49\u8bdd\u672f\uff0c\u5f3a\u5316\u201c\u5b66\u5b8c\u5373\u80fd\u63a5\u5355\u8d5a\u94b1\u201d\u7684\u9884\u671f\uff0c**\u672a\u5145\u5206\u63d0\u793a\u884c\u4e1a\u7ade\u4e89\u6fc0\u70c8\u3001\u6536\u5165\u4e0d\u7a33\u5b9a\u3001\u9700\u8981\u957f\u671f\u79ef\u7d2f\u7684\u73b0\u5b9e**\u3002\n*   **\u5206\u671f\u652f\u4ed8\u5f15\u5bfc**\uff1a\u5728\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u94b1\u4e0d\u591f\u201d\u540e\uff0c\u7acb\u5373\u63d0\u4f9b\u5206\u671f\u65b9\u6848\uff0c\u53ef\u80fd\u8bf1\u5bfc\u5176\u505a\u51fa\u8d85\u51fa\u5f53\u524d\u652f\u4ed8\u80fd\u529b\u7684\u51b3\u7b56\u3002\n*   **\u5236\u9020\u7a00\u7f3a\u4e0e\u7d27\u8feb\u611f**\uff1a\u201c\u540d\u989d\u8981\u6ca1\u6709\u4e86\u201d\u3001\u201c\u73b0\u573a\u53d1\u4f18\u60e0\u5238\u3001\u7248\u6743\u4e66\u201d\u662f\u5e38\u89c4\u9500\u552e\u7b56\u7565\uff0c\u4f46\u7ed3\u5408\u7528\u6237\u8584\u5f31\u7684\u7ecf\u6d4e\u57fa\u7840\uff0c\u6b64\u7b56\u7565**\u52a0\u91cd\u4e86\u5176\u6295\u673a\u5fc3\u6001\u548c\u51b3\u7b56\u538b\u529b**\u3002\n*   **\u77e5\u60c5\u540c\u610f**\uff1a\u7528\u6237\u5bf9\u5b66\u4e60\u7684\u957f\u671f\u6027\u3001\u8270\u5de8\u6027\u8ba4\u77e5\u4e0d\u8db3\uff0c\u9500\u552e\u672a\u8fdb\u884c\u5145\u5206\u7684\u98ce\u9669\u544a\u77e5\u548c\u9884\u671f\u7ba1\u7406\u3002\n\n---\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**\uff1a**\u9519\u914d**\u3002\u7528\u6237\u6838\u5fc3\u9700\u6c42\u662f\u201c\u4f4e\u95e8\u69db\u5feb\u901f\u517c\u804c\u53d8\u73b0\u201d\uff0c\u800c\u7cfb\u7edf\u58f0\u4e50\u8bfe\u7a0b\u662f\u201c\u6280\u80fd\u63d0\u5347\u4e0e\u957f\u671f\u804c\u4e1a\u53d1\u5c55\u201d\u3002\u4e24\u8005\u5b58\u5728\u6839\u672c\u6027\u77db\u76fe\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**24\u5c0f\u65f6\u5185\u542f\u52a8\u6df1\u5ea6\u9884\u671f\u7ba1\u7406\u4e0e\u98ce\u9669\u544a\u77e5**\u3002\n*   **\u5177\u4f53\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u7d27\u6025\u9884\u671f\u6821\u6b63\uff08\u9996\u5468\u6838\u5fc3\uff09**\uff1a\u5fc5\u987b\u5728\u65b0\u4eba\u73ed\u5f00\u8bfe\u524d\uff0c\u8fdb\u884c\u4e00\u5bf9\u4e00\u6c9f\u901a\u3002\u660e\u786e\u544a\u77e5\uff1a\n        *   \u6709\u58f0\u884c\u4e1a\u6536\u5165\u66f2\u7ebf\uff1a\u524d\u671f\u6295\u5165\u5927\u3001\u56de\u62a5\u6162\u3001\u4e0d\u7a33\u5b9a\u3002\n        *   \u8bd5\u97f3\u6210\u529f\u7387\u4e0e\u5e02\u573a\u7ade\u4e89\u7684\u6b8b\u9177\u6027\u3002\n        *   \u5b66\u4e60\u91cd\u70b9\u5e94\u662f\u592f\u5b9e\u57fa\u7840\uff0c\u800c\u975e\u6025\u4e8e\u6c42\u6210\u3002\n        *   **\u5c06\u201c\u6709\u6536\u76ca\u5c31\u884c\u201d\u7684\u6a21\u7cca\u671f\u671b\uff0c\u8f6c\u5316\u4e3a\u201c\u9996\u6708\u5b8c\u6210X\u6b21\u8bd5\u97f3\u201d\u3001\u201c\u9996\u5b63\u5ea6\u4e89\u53d6\u83b7\u5f97\u7b2c\u4e00\u4e2a\u5c0f\u5355\u201d\u7684\u53ef\u6267\u884c\u3001\u53ef\u7ba1\u7406\u7684\u9636\u6bb5\u6027\u76ee\u6807\u3002**\n    2.  **\u8d22\u52a1\u5173\u5207\u8be2\u95ee**\uff1a\u4ee5\u5173\u6000\u65b9\u5f0f\uff0c\u4e86\u89e3\u5176\u5206\u671f\u4ed8\u6b3e\u7684\u8fd8\u6b3e\u8ba1\u5212\uff0c\u8bc4\u4f30\u5176\u7ecf\u6d4e\u538b\u529b\u3002**\u6697\u793a\u82e5\u611f\u538b\u529b\u53ef\u53ca\u65f6\u6c9f\u901a**\uff0c\u4e3a\u540e\u7eed\u53ef\u80fd\u7684\u9000\u8d39\u7533\u8bf7\u7559\u51fa\u5408\u89c4\u51fa\u53e3\u3002\n    3.  **\u5f3a\u5316\u8fc7\u7a0b\u6fc0\u52b1**\uff1a\u5bf9\u5176\u6bcf\u4e00\u6b21\u4f5c\u4e1a\u3001\u7ec3\u4e60\u7ed9\u4e88\u5177\u4f53\u3001\u771f\u8bda\u7684\u53cd\u9988\uff08\u975e\u6cdb\u6cdb\u8868\u626c\uff09\uff0c\u5c06\u6210\u5c31\u611f\u4ece\u201c\u63a5\u5355\u201d\u90e8\u5206\u8f6c\u79fb\u5230\u201c\u6280\u80fd\u53ef\u89c1\u8fdb\u6b65\u201d\u4e0a\u3002\n    4.  **\u8d44\u6e90\u503e\u659c\u4e0e\u5373\u65f6\u53cd\u9988**\uff1a\u5728\u5408\u89c4\u8303\u56f4\u5185\uff0c\u5c3d\u53ef\u80fd\u4e3a\u5176\u63d0\u4f9b\u4e00\u4e9b\u4f4e\u95e8\u69db\u7684\u8bd5\u97f3\u673a\u4f1a\uff08\u5373\u4f7f\u62a5\u916c\u5f88\u4f4e\uff09\uff0c\u8ba9\u5176\u65e9\u671f\u83b7\u5f97\u201c\u6b63\u53cd\u9988\u201d\uff0c\u7ef4\u6301\u5b66\u4e60\u52a8\u529b\u3002\n    5.  **\u5bc6\u5207\u76d1\u63a7**\uff1a\u5c06\u5176\u5217\u4e3a\u9ad8\u98ce\u9669\u7528\u6237\uff0c\u91cd\u70b9\u5173\u6ce8\u5176\u5b66\u4e60\u79ef\u6781\u6027\u53d8\u5316\u3001\u9996\u6b21\u8bd5\u97f3\u5931\u8d25\u540e\u7684\u60c5\u7eea\u3001\u4ee5\u53ca\u4efb\u4f55\u5173\u4e8e\u201c\u8d5a\u94b1\u201d\u3001\u201c\u6ca1\u65f6\u95f4\u201d\u7684\u8a00\u8bba\u3002\n\n{\"core_type\": \"T7 \u7ecf\u6d4e\u62ee\u636e\u7684\u6295\u673a\u8005\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"product_match\": \"\u9519\u914d\", \"action\": \"24h\u5185\u542f\u52a8\u6df1\u5ea6\u9884\u671f\u7ba1\u7406\u4e0e\u98ce\u9669\u544a\u77e5\"}";
