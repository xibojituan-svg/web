    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677167485 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u51ac\u51ac\u8001\u5e08\uff08\u5eca\u6865\u4e4b\u97f39\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u5f20\u9707\u8001\u5e08\u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff08\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff08\u4ec5\u663e\u793a\u80fd\u6309\u65f6\u53c2\u52a0\u76f4\u64ad\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u804c\u4e1a\u6216\u65f6\u95f4\u5b89\u6392\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff08\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u804a\u5929\u8bb0\u5f55\u4ee5\u9500\u552e\u5355\u5411\u8f93\u51fa\u4e3a\u4e3b\uff0c\u7528\u6237\u53cd\u9988\u6781\u5c11\uff08\u4ec510\u6761\uff09\uff0c\u65e0\u6cd5\u5168\u9762\u8bc4\u4f30\u5176\u8d44\u6e90\u5e95\u5ea7\u3001\u5fc3\u7406\u5f39\u6027\u53ca\u6df1\u5c42\u52a8\u673a\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **[\u2b07\u4f4e]**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u53d8\u73b0\u9a71\u52a8\u660e\u786e\uff0c\u4f46\u7f3a\u4e4f\u5bf9\u6280\u80fd\u6210\u957f\u7684\u6df1\u5ea6\u8ffd\u95ee**\u3002\u7528\u6237\u5bf9\u9500\u552e\u5f3a\u8c03\u7684\u201c\u53d8\u73b0\u201d\u3001\u201c\u8d5a\u94b1\u201d\u3001\u201c\u6536\u5165\u201d\u7b49\u5173\u952e\u8bcd\u7ed9\u4e88\u79ef\u6781\u56de\u5e94\uff08\u201c\u80af\u5b9a\u6ee1\u8db3\uff0c\u7edd\u5bf9\u6ee1\u8db3\u201d\uff09\uff0c\u4f46\u5bf9\u6280\u672f\u7ec6\u8282\u3001\u5b66\u4e60\u65b9\u6cd5\u672c\u8eab\u65e0\u4e3b\u52a8\u63a2\u8ba8\u3002\u7b26\u5408\u201c\u51e0\u5929\u80fd\u8d5a\u94b1\u201d\u7684\u4f4e\u7eaf\u5ea6\u7279\u5f81\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u957f\u671f\u6536\u5165\u6392\u7b2c\u4e00\uff0c\u5feb\u901f\u6392\u7b2c\u4e8c[\u5077\u7b11]\u201d > \u201c\u80af\u5b9a\u6ee1\u8db3\uff0c\u7edd\u5bf9\u6ee1\u8db3\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **[\u27a1\u4e2d] (\u63a8\u6d4b)**\n*\u6ce8\uff1a\u4fe1\u606f\u4e25\u91cd\u4e0d\u8db3\uff0c\u57fa\u4e8e\u6709\u9650\u4e92\u52a8\u63a8\u6d4b\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u672a\u77e5** \u2014 \u65e0\u4efb\u4f55\u5173\u4e8e\u7ecf\u6d4e\u72b6\u51b5\u3001\u652f\u4ed8\u80fd\u529b\u7684\u8ba8\u8bba\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d\u7b49** \u2014 \u80fd\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u591a\u573a\u76f4\u64ad\u5e76\u56de\u590d\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u53ef\u63a7\u65f6\u95f4\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u804c\u4e1a\u6216\u65f6\u95f4\u5145\u88d5\u5ea6\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u672a\u77e5** \u2014 \u65e0\u4efb\u4f55\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **[\u2b07\u4f4e\u6781\u5371]**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u7528\u6237\u4ec5\u6709\u7684\u4e3b\u52a8\u8868\u8fbe\u4e2d\uff0c\u900f\u9732\u51fa\u5f3a\u70c8\u7684\u4e0d\u81ea\u4fe1\u548c\u4f9d\u8d56\u5916\u90e8\u80af\u5b9a\u7684\u503e\u5411\u3002\u4e00\u53e5\u201c\u89c9\u5f97\u6bd4\u60f3\u8c61\u4e2d\u7684\u8981\u96be\u4e00\u4e9b\u201d\u540e\uff0c\u7acb\u523b\u8ddf\u201c\u53ef\u80fd\u5c31\u662f\u4e00\u79cd\u4e0d\u81ea\u4fe1\u7684\u60f3\u6cd5\u5427\u201d\uff0c\u9700\u8981\u9500\u552e\u7acb\u5373\u8fdb\u884c\u957f\u7bc7\u7684\u9f13\u52b1\u548c\u201c\u753b\u997c\u201d\u6765\u5b89\u629a\u3002**\u8fd9\u662f\u5178\u578b\u7684\u4f4e\u5fc3\u7406\u5f39\u6027\u3001\u9ad8\u60c5\u7eea\u4f9d\u8d56\u4fe1\u53f7\u3002**\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u55ef\u55ef\uff0c\u89c9\u5f97\u6bd4\u60f3\u8c61\u4e2d\u7684\u8981\u96be\u4e00\u4e9b[\u5077\u7b11]\u52aa\u529b\u5c1d\u8bd5\u5427\u201d > \u201c\u5c31\u662f\u4e00\u79cd\u76f4\u89c9\uff0c\u53ef\u80fd\u5c31\u662f\u4e00\u79cd\u4e0d\u81ea\u4fe1\u7684\u60f3\u6cd5\u5427\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u672a\u6765\u7684\u7ecf\u6d4e\u5b89\u5168\u611f\u5230\u7126\u8651\uff0c\u5e0c\u671b\u901a\u8fc7\u201c\u6709\u58f0\u53d8\u73b0\u201d\u83b7\u5f97\u4e00\u4efd\u786e\u5b9a\u7684\u3001\u957f\u671f\u7684\u517c\u804c\u6536\u5165\u4fdd\u969c\uff0c\u4ee5\u62b5\u5fa1\u751f\u6d3b\u7684\u4e0d\u786e\u5b9a\u6027\u3002** \u5176\u201c\u957f\u671f\u6536\u5165\u6392\u7b2c\u4e00\u201d\u7684\u6392\u5e8f\uff0c\u66b4\u9732\u4e86\u6df1\u5c42\u7684\u4e0d\u5b89\u5168\u611f\u548c\u5bf9\u7a33\u5b9a\u6027\u7684\u6e34\u6c42\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u9009\u4e2d\u201d\u7684\u5b89\u5168\u611f\u4e0e\u201c\u80cc\u9760\u5927\u6811\u201d\u7684\u5f52\u5c5e\u611f\u3002** \u9500\u552e\u53cd\u590d\u5f3a\u8c03\u201c\u6211\u7684\u4eba\u201d\u3001\u201c\u6211\u7684\u56e2\u961f\u201d\u3001\u201c\u5f20\u9707\u8001\u5e08\u5de5\u4f5c\u5ba4\u201d\uff0c\u6210\u529f\u5851\u9020\u4e86\u4e00\u4e2a\u5f3a\u5927\u7684\u5e87\u62a4\u6240\u5f62\u8c61\uff0c\u8fd9\u6b63\u662f\u7528\u6237\u6700\u9700\u8981\u7684\u2014\u2014\u4e00\u4e2a\u80fd\u6d88\u9664\u5176\u7126\u8651\u3001\u63d0\u4f9b\u786e\u5b9a\u8def\u5f84\u7684\u6743\u5a01\u4f9d\u9760\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2 \u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u4e25\u91cd\u5185\u8017) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5ead\u53cd\u5bf9\u7684\u76f4\u63a5\u8bc1\u636e\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4f4e** (\u4fe1\u606f\u4e0d\u8db3) | \u672a\u77e5 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u4e00\u65e6\u8fdb\u5165\u6b63\u8bfe\uff0c\u53d1\u73b0\u5b66\u4e60\u5f3a\u5ea6\u8d85\u51fa\u5176\u788e\u7247\u5316\u65f6\u95f4\u627f\u53d7\u80fd\u529b\uff0c\u6216\u56e0\u5de5\u4f5c/\u751f\u6d3b\u7410\u4e8b\u4e2d\u65ad\u5b66\u4e60\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u7126\u8651\u548c\u81ea\u8d23\uff0c\u8fdb\u800c\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | **\u8fd9\u662f\u6700\u6838\u5fc3\u7684\u98ce\u9669\u70b9\u3002** \u4efb\u4f55\u5fae\u5c0f\u7684\u6280\u672f\u632b\u6298\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u5931\u8d25\u3001\u4f5c\u4e1a\u88ab\u6279\u6539\u3001\u8bd5\u97f3\u672a\u901a\u8fc7\uff09\u3001\u6216\u611f\u89c9\u88ab\u73ed\u4e3b\u4efb\u201c\u51b7\u843d\u201d\uff08\u56de\u590d\u4e0d\u53ca\u65f6\u3001\u8868\u626c\u4e0d\u591f\uff09\uff0c\u90fd\u53ef\u80fd\u77ac\u95f4\u89e6\u53d1\u5176\u201c\u6211\u4e0d\u884c\u201d\u7684\u81ea\u6211\u5426\u5b9a\uff0c\u8fdb\u800c\u8981\u6c42\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | \u5bf9\u9500\u552e\u63cf\u7ed8\u7684\u201c\u5feb\u901f\u6536\u5165\u201d\u3001\u201c\u5267\u793e\u8fdb\u7ec4\u201d\u62b1\u6709\u4e0d\u5207\u5b9e\u9645\u7684\u5e7b\u60f3\u3002\u82e5\u5728\u627f\u8bfa\u671f\u5185\uff08\u59821-2\u4e2a\u6708\uff09\u672a\u63a5\u5230\u4efb\u4f55\u5b9e\u8d28\u6027\u7684\u201c\u5355\u5b50\u201d\u6216\u6536\u5165\u8fdc\u4f4e\u4e8e\u9884\u671f\uff0c\u4f1a\u7acb\u523b\u611f\u5230\u88ab\u6b3a\u9a97\uff0c\u66b4\u6012\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468\u3002** \u6b64\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u771f\u5b9e\u7684\u5b66\u4e60\u96be\u5ea6\u548c\u7ec3\u4e60\u5f3a\u5ea6\u88ad\u6765\uff0c\u7b2c\u4e00\u6b21\u4f5c\u4e1a\u88ab\u4e25\u683c\u70b9\u8bc4\u6216\u7b2c\u4e00\u6b21\u8bd5\u97f3\u5931\u8d25\u65f6\uff0c\u662f\u5176\u5fc3\u7406\u9632\u7ebf\u6700\u8106\u5f31\u7684\u65f6\u523b\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5b9d\uff0c\u6211\u770b\u5230\u4f60\u7279\u522b\u8e0f\u5b9e\uff0c\u6bcf\u4e00\u6b65\u90fd\u8ddf\u5f97\u5f88\u7d27\uff0c\u8fd9\u4efd\u8ba4\u771f\u52b2\u513f\u7279\u522b\u96be\u5f97\uff01\u54b1\u4eec\u4e0d\u8ddf\u522b\u4eba\u6bd4\u901f\u5ea6\uff0c\u5c31\u6309\u4f60\u81ea\u5df1\u7684\u8282\u594f\u6765\u3002\u6709\u4efb\u4f55\u4e00\u70b9\u89c9\u5f97\u5361\u4f4f\u3001\u89c9\u5f97\u96be\u7684\u5730\u65b9\uff0c\u968f\u65f6\u6233\u6211\uff0c\u621124\u5c0f\u65f6\u5728\u7ebf\u7ed9\u4f60\u5f53\u2018\u4eba\u5de5\u5bfc\u822a\u2019\u3002\u8bb0\u4f4f\uff0c\u4f60\u4e0d\u662f\u4e00\u4e2a\u4eba\u5728\u6218\u6597\uff0c\u5e08\u59d0\u548c\u6574\u4e2a\u56e2\u961f\u90fd\u5728\u4f60\u8eab\u540e\u515c\u5e95\u5462\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5feb\u901f\u63a5\u5355\u7ebf**\u3011\u3002\u5fc5\u987b\u5feb\u901f\u8ba9\u5176\u770b\u5230\u201c\u53d8\u73b0\u201d\u7684\u5e0c\u671b\uff0c\u54ea\u6015\u662f\u5c0f\u989d\u3001\u8c61\u5f81\u6027\u7684\u201c\u7b2c\u4e00\u5355\u201d\uff0c\u5bf9\u5176\u4fe1\u5fc3\u7684\u7ef4\u7cfb\u81f3\u5173\u91cd\u8981\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u5f3a\u5236\u6302\u8f7d\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u5373\u6ee1\u914d\u7684C\u6a21\u5757\uff08\u60c5\u7eea\u4fdd\u59c6\uff09\u3002\u73ed\u4e3b\u4efb\u9700\u8981\u9ad8\u9891\u6b21\u3001\u9ad8\u5938\u5f20\u5ea6\u5730\u8fdb\u884c\u201c\u6309\u952e\u7ea7\u201d\u9f13\u52b1\uff08\u201c\u4f60\u8fd9\u4e2a\u6c14\u53e3\u5904\u7406\u5f97\u592a\u68d2\u4e86\uff01\u201d\u201c\u8fd9\u4e2a\u60c5\u7eea\u4ee3\u5165\u611f\u7edd\u4e86\uff01\u201d\uff09\uff0c\u5e76\u4e3b\u52a8\u4e3a\u5176\u62c6\u89e3\u96be\u9898\uff0c\u62ff\u8d70\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u7684\u4e00\u5207\u201c\u969c\u788d\u611f\u201d\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u80fd\u7528\u201c\u6700\u540e\u540d\u989d\u201d\u3001\u201c\u5012\u8ba1\u65f6\u201d\u7b49\u9ad8\u538b\u8bdd\u672f\u903c\u5355**\uff0c\u8fd9\u4f1a\u52a0\u5267\u5176\u7126\u8651\uff0c\u53ef\u80fd\u76f4\u63a5\u5413\u8dd1\u3002\n    2. **\u7edd\u4e0d\u80fd\u5728\u521d\u671f\u5e03\u7f6e\u8fc7\u9ad8\u96be\u5ea6\u7684\u4f5c\u4e1a\u6216\u8fdb\u884c\u4e25\u5389\u7684\u6279\u8bc4**\u3002\u70b9\u8bc4\u9700\u4ee5\u201c\u5148\u5938\u540e\u5fae\u8c03\u201d\u4e3a\u4e3b\u3002\n    3. **\u7edd\u4e0d\u80fd\u5728\u5176\u8868\u8fbe\u56f0\u96be\u65f6\uff0c\u56de\u590d\u201c\u591a\u7ec3\u7ec3\u5c31\u597d\u4e86\u201d\u7b49\u6577\u884d\u8bdd\u672f**\uff0c\u5fc5\u987b\u7ed9\u51fa\u5177\u4f53\u7684\u3001\u53ef\u6267\u884c\u7684\u201c\u4e0b\u4e00\u6b65\u52a8\u4f5c\u201d\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u57fa\u7840\u6280\u80fd\u672a\u7a33\u5b9a\u3001\u672a\u83b7\u5f97\u5176\u5145\u5206\u4fe1\u4efb\u524d\uff0c\u8fdb\u884c\u4efb\u4f55\u5927\u989d\u5347\u5355\u63a8\u4ecb\u3002** \u53ef\u5c1d\u8bd5500\u5143\u4ee5\u5185\u7684\u5fae\u5347\u5355\uff08\u5982\u58f0\u97f3\u7f8e\u5316\u5c0f\u8bfe\u5305\uff09\uff0c\u4f5c\u4e3a\u5176\u201c\u88ab\u91cd\u89c6\u201d\u7684\u60c5\u611f\u9a8c\u8bc1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u55ef\u55ef\uff0c\u89c9\u5f97\u6bd4\u60f3\u8c61\u4e2d\u7684\u8981\u96be\u4e00\u4e9b[\u5077\u7b11]\u52aa\u529b\u5c1d\u8bd5\u5427\u201d \n2. > \u201c\u5c31\u662f\u4e00\u79cd\u76f4\u89c9\uff0c\u53ef\u80fd\u5c31\u662f\u4e00\u79cd\u4e0d\u81ea\u4fe1\u7684\u60f3\u6cd5\u5427\u201d\n3. > \u201c\u957f\u671f\u6536\u5165\u6392\u7b2c\u4e00\uff0c\u5feb\u901f\u6392\u7b2c\u4e8c[\u5077\u7b11]\u201d \n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u9700\u6c42\u2014\u2014\u5bfb\u6c42\u7ecf\u6d4e\u4fdd\u969c\u548c\u60c5\u611f\u6258\u5e95\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u201c\u8f6e\u6905\u7ea7\u201d\u5168\u6258\u5e95\u60c5\u7eea\u4f34\u98de\uff08\u6ee1\u914dC\u6a21\u5757\uff09\uff0c\u7528\u9ad8\u9891\u3001\u5177\u4f53\u7684\u5938\u5f20\u8d5e\u7f8e\u5efa\u7acb\u5b89\u5168\u611f\uff0c\u5e76\u5c3d\u5feb\u5b89\u6392\u4e00\u4e2a\u6781\u4f4e\u95e8\u69db\u7684\u201c\u7b2c\u4e00\u5355\u201d\u9a8c\u8bc1\u5176\u4ef7\u503c\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf + \u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
