    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u63d0\u4f9b\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 122788594 (\u6635\u79f0\uff1aMiko) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-26 \u81f3 2026-01-28 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u4fde\u5e06 (\u5927\u6f02\u4eae) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u4fe1\u606f\u7f3a\u5931 (\u4ece\u4e0a\u4e0b\u6587\u63a8\u65ad\u4e3a\u6709\u58f0\u4e66/\u914d\u97f3\u540e\u671f\u76f8\u5173\u8bfe\u7a0b) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931** (\u65e0\u6cd5\u5224\u65ad) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931** (\u804a\u5929\u663e\u793a\u6df1\u591c\u81f3\u51cc\u6668\u4ecd\u5728\u8fdb\u884c\u540e\u671f\u5236\u4f5c\uff0c\u65f6\u95f4\u6295\u5165\u5ea6\u9ad8\uff0c\u4f46\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u4e3a\u727a\u7272\u7761\u7720\u6216\u6324\u5360\u5176\u4ed6\u521a\u6027\u65f6\u95f4) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931** (\u65e0\u6cd5\u5224\u65ad) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** - \u8bb0\u5f55\u4ec5\u4e3a\u9879\u76ee\u534f\u4f5c\u7247\u6bb5\uff0c\u7f3a\u5c11\u62a5\u540d\u52a8\u673a\u3001\u8d22\u52a1\u72b6\u51b5\u3001\u5bb6\u5ead\u80cc\u666f\u3001\u5b66\u4e60\u76ee\u6807\u7b49\u6838\u5fc3\u4fe1\u606f\uff0c\u5206\u6790\u57fa\u4e8e\u884c\u4e3a\u6a21\u5f0f\u63a8\u65ad\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u2b06\u9ad8]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u4f5c\u54c1\u8d28\u91cf\u800c\u6765\uff0c\u5173\u6ce8\u4e13\u4e1a\u7ec6\u8282\u3001\u56e2\u961f\u534f\u4f5c\u4e0e\u6700\u7ec8\u5448\u73b0\u6548\u679c\uff0c\u800c\u975e\u77ed\u671f\u53d8\u73b0\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u53bb\u60f3\u60f3\u90a3\u4e2a\u4f5c\u54c1\u4ecb\u7ecd\u201d\u3001\u201c\u5e2e\u6211\u542c\u542c [\u5408\u5341] \u97f3\u6548\u6211\u4e5f\u8865\u4e86\u201d\u3001\u201c\u5927\u5bb6\u786e\u8ba4\u4e0b\u81ea\u5df1\u7684\u4e3b\u64ad\u540d\u5b57\uff0c\u6709\u6ca1\u6709\u5199\u9519\uff1f\u201d\u3001\u201c\u6211\u9ebb\u6e9c\u5f55\u4e86\u4ed6 \u518d\u52a0\u4e2a\u5c0fbgm\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b06\u9ad8]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[**\u4fe1\u606f\u7f3a\u5931**] \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4efb\u4f55\u8d22\u52a1\u4fe1\u606f\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[**\u9ad8**] \u2014 \u5728\u6df1\u591c\uff0823\u70b9\u540e\uff09\u4ecd\u6295\u5165\u5927\u91cf\u65f6\u95f4\u8fdb\u884c\u97f3\u9891\u540e\u671f\u7cbe\u7ec6\u8c03\u6574\uff08\u201c\u6211\u4e00\u4e2a\u4e2a\u8c03\u201d\u3001\u201c\u91cd\u542f\u4e86\u4e24\u56de\u201d\uff09\uff0c\u663e\u793a\u51fa\u6781\u9ad8\u7684\u65f6\u95f4\u4e0e\u7cbe\u529b\u6295\u5165\u610f\u613f\u548c\u81ea\u7531\u5ea6\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[**\u4fe1\u606f\u7f3a\u5931**] \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u5bb6\u5ead\u4e92\u52a8\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\uff0c\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u8f6f\u4ef6\u5d29\u6e83\u3001\u97f3\u9891\u7206\u9ea6\uff09\u4e3b\u52a8\u91cd\u542f\u3001\u7814\u7a76\u89e3\u51b3\u65b9\u6848\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u79ef\u6781\u5bfb\u6c42\u56e2\u961f\u53cd\u9988\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u597d\u6d88\u606f \u53ef\u4ee5\u4e86\u201d\uff08\u8f6f\u4ef6\u5d29\u6e83\u540e\u91cd\u542f\u6210\u529f\uff09\uff1b\u201c\u8fd8\u80fd\u5fae\u8c03\u5462 \u4e0d\u6015 \u53ea\u8981\u542c\u51fa\u6765\u54ea\u91cc\u6709\u95ee\u9898\u90fd\u53ef\u4ee5\u8c03\u201d\uff1b\u201c\u6211\u91cd\u542f\u4e86\u4e24\u56de \u6211\u73b0\u5728\u5173\u673a\u4e86 \u53c8\u5f00\u4e86\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 (\u6210\u5c31\u4e0e\u8ba4\u53ef)** ] \u4e0e [ **\u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 (\u521b\u9020\u529b\u4e0e\u610f\u4e49\u611f)** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u4f5c\u54c1\u5b8c\u7f8e\u4e3b\u4e49\u7684\u6267\u7740\uff0c\u6e34\u671b\u901a\u8fc7\u56e2\u961f\u534f\u4f5c\u4ea7\u51fa\u9ad8\u8d28\u91cf\u3001\u53d7\u8ba4\u53ef\u7684\u4f5c\u54c1\uff08\u5982\u53c2\u52a0\u6bd4\u8d5b\uff09\uff0c\u5e76\u5728\u793e\u7fa4\u4e2d\u5c55\u73b0\u9886\u5bfc\u529b\u4e0e\u4e13\u4e1a\u80fd\u529b\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u5c42\u9762\u7684\u6df1\u5ea6\u8ba4\u53ef**\u3001\u8d4b\u4e88\u5176**\u56e2\u961f\u9886\u5bfc/\u6838\u5fc3\u8d21\u732e\u8005**\u7684\u8eab\u4efd\u5149\u73af\u3001\u63d0\u4f9b\u80fd**\u7cbe\u8fdb\u6280\u827a\u5e76\u4ea7\u51fa\u4ee3\u8868\u4f5c**\u7684\u786c\u6838\u6311\u6218\u4e0e\u821e\u53f0\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\u2b50A \u7c7b** (\u9ad8\u52a8\u673a\u3001\u9ad8\u8d44\u6e90\u3001\u9ad8\u5f39\u6027\uff0c\u6838\u5fc3\u4ef7\u503c\u7528\u6237) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** \u4e0e **T1 \u5708\u517b\u9886\u8896\u578b** \u7684\u6df7\u5408\u4f53\u3002\u884c\u4e3a\u4e0a\u8868\u73b0\u51fa\u6781\u5f3a\u7684\u5b9e\u5e72\uff08T2\uff09\u7279\u8d28\uff1a\u4e13\u6ce8\u7ec6\u8282\u3001\u6b7b\u78d5\u6280\u672f\u3001\u9ed8\u9ed8\u4ed8\u51fa\uff1b\u540c\u65f6\u5728\u56e2\u961f\u4e2d\u81ea\u7136\u627f\u62c5\u4e86\u7ec4\u7ec7\u3001\u534f\u8c03\u3001\u6700\u7ec8\u51b3\u7b56\u7684\u9886\u5bfc\u8005\u89d2\u8272\uff08T1\uff09\u3002 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1 D \u7c7b\u7194\u65ad\u7ea2\u7ebf\uff01]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u8bc1\u636e\u8868\u660e\u5b58\u5728\u501f\u8d37\u3001\u5bb6\u5ead\u5f3a\u70c8\u53cd\u5bf9\u7b49D\u7c7b\u98ce\u9669\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4f4e** | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u57fa\u4e8e\u5176\u9ad8\u5ea6\u81ea\u4e3b\u7684\u884c\u4e3a\u6a21\u5f0f\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u6781\u4f4e** | \u81ea\u6211\u9a71\u52a8\u529b\u6781\u5f3a\uff0c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u7a81\u51fa\uff0c\u4e3b\u52a8\u71ac\u591c\u653b\u575a\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u5c06\u6280\u672f\u95ee\u9898\u89c6\u4e3a\u5f85\u89e3\u51b3\u7684\u6311\u6218\u800c\u975e\u632b\u6298\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4f4e** | \u5f53\u524d\u52a8\u673a\u96c6\u4e2d\u4e8e\u80fd\u529b\u63d0\u5347\u4e0e\u4f5c\u54c1\u6210\u5c31\uff0c\u800c\u975e\u5373\u65f6\u91d1\u94b1\u56de\u62a5\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u65e0\u660e\u663e\u9ad8\u98ce\u9669\u65f6\u95f4\u7a97**\u3002\u6f5c\u5728\u98ce\u9669\u70b9\u5728\u4e8e\u957f\u671f\u4ed8\u51fa\u82e5\u672a\u83b7\u5f97\u9884\u671f\u7684\u4e13\u4e1a\u8ba4\u53ef\u6216\u4f5c\u54c1\u672a\u80fd\u8fbe\u5230\u5176\u5185\u5fc3\u9ad8\u6807\u51c6\uff0c\u53ef\u80fd\u4ea7\u751f\u4ef7\u503c\u8d28\u7591\uff0c\u4f46\u8fc7\u7a0b\u7f13\u6162\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cMiko\uff0c\u770b\u4e86\u4f60\u5728\u56e2\u961f\u9879\u76ee\u91cc\u7684\u6295\u5165\u548c\u9886\u5bfc\u529b\uff0c\u975e\u5e38\u4f69\u670d\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\uff0c\u5c31\u662f\u4e3a\u4f60\u8fd9\u6837\u60f3\u628a\u6d3b\u513f\u5e72\u5230\u6781\u81f4\u7684\u4eba\u51c6\u5907\u7684\u3002\u91cc\u9762\u6709\u4e0d\u5c11\u786c\u6838\u7684\u63d2\u4ef6\u6280\u5de7\u548c\u5b9e\u6218\u6848\u4f8b\u62c6\u89e3\uff0c\u76f8\u4fe1\u80fd\u5e2e\u4f60\u628a\u73b0\u5728\u7684\u4f5c\u54c1\u6253\u78e8\u5f97\u66f4\u51fa\u5f69\u3002\u6709\u4efb\u4f55\u6280\u672f\u96be\u9898\uff0c\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u653b\u514b\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011+\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf**\u3011\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176T2\u7279\u8d28\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010**\u4e13\u5bb61v1\u6df1\u5ea6\u7b54\u7591\u5305**\u3011\u548c\u3010**\u5730\u72f1\u96be\u5ea6\u5b9e\u6218\u4efb\u52a1\u5305**\u3011\uff1b\u9488\u5bf9\u5176T1\u7279\u8d28\uff0c\u8865\u5145\u3010**\u73ed\u59d4/\u7ec4\u957f\u4efb\u547d**\u3011\u53ca\u3010**\u5185\u90e8\u4f5c\u54c1\u8bc4\u5ba1\u4f18\u5148\u6743**\u3011\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7ed9\u4ed6\u5e03\u7f6e\u7b80\u5355\u3001\u91cd\u590d\u6027\u7684\u4f5c\u4e1a\uff1b\u7528\u80a4\u6d45\u7684\u5938\u5956\u6577\u884d\u4ed6\uff1b\u5ffd\u89c6\u4ed6\u63d0\u51fa\u7684\u4e13\u4e1a\u95ee\u9898\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u63a8\u4ecb**\u9ad8\u9636\u3001\u6df1\u5ea6\u3001\u80fd\u89e3\u51b3\u5176\u5f53\u524d\u6280\u672f\u74f6\u9888**\u7684\u5927\u989d\u8bfe\u7a0b\uff08\u5982\u5927\u5e08\u73ed\u3001\u4e13\u9879\u8bad\u7ec3\u8425\uff09\uff0c\u4e25\u7981\u63a8\u9500\u4e0e\u5176\u4e13\u4e1a\u8ffd\u6c42\u65e0\u5173\u7684\u201c\u5feb\u9910\u5f0f\u201d\u53d8\u73b0\u8bfe\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u540e\u671f11\u73ed\u201d\uff08\u8868\u660e\u5df2\u662f\u590d\u8d2d\u6216\u9ad8\u9636\u73ed\u5b66\u5458\uff0c\u5b66\u4e60\u8def\u5f84\u6df1\u5165\uff09\n2. > \u201c\u8fd8\u80fd\u5fae\u8c03\u5462 \u4e0d\u6015 \u53ea\u8981\u542c\u51fa\u6765\u54ea\u91cc\u6709\u95ee\u9898\u90fd\u53ef\u4ee5\u8c03\u201d\uff08\u5c55\u73b0\u4e86\u6781\u9ad8\u7684\u8010\u5fc3\u3001\u89e3\u51b3\u95ee\u9898\u7684\u97e7\u6027\u548c\u5bf9\u54c1\u8d28\u7684\u8ffd\u6c42\uff09\n3. > \u201c\u5927\u5bb6\u786e\u8ba4\u4e0b\u81ea\u5df1\u7684\u4e3b\u64ad\u540d\u5b57\uff0c\u6709\u6ca1\u6709\u5199\u9519\uff1f\u201d\u3001\u201c\u6211\u53bb\u60f3\u60f3\u90a3\u4e2a\u4f5c\u54c1\u4ecb\u7ecd\u201d\uff08\u5c55\u73b0\u4e86\u6781\u5f3a\u7684\u8d23\u4efb\u5fc3\u3001\u7ec4\u7ec7\u529b\u548c\u5bf9\u56e2\u961f\u6210\u679c\u7ec6\u8282\u7684\u5173\u6ce8\uff09\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2\u5b9e\u5e72\u9886\u8896\u6df7\u5408\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4e0e\u5b9e\u73b0\u521b\u4f5c\u4ef7\u503c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7ed9\u4e88\u786c\u6838\u6311\u6218\u3001\u4e13\u4e1a\u8ba4\u53ef\u53ca\u56e2\u961f\u9886\u5bfc\u8eab\u4efd\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b/T1 \u5708\u517b\u9886\u8896\u578b\u6df7\u5408\u4f53\", \"maslow_need\": \"\u7b2c\u56db\u5c42\u5c0a\u91cd\u9700\u6c42\u4e0e\u7b2c\u4e94\u5c42\u81ea\u6211\u5b9e\u73b0\", \"risk_level\": \"\u6781\u4f4e\", \"refund_risk\": \"\u6781\u4f4e\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\"}\n```";
