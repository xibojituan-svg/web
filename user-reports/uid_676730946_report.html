        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676730946 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-04 \u81f3 2026-03-14 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5341\u4e8c\u7b19\u7bab8(\u738b\u667a)\u3001\u5929\u96ea\u68a6\u513f(\u8d75\u4e3d\u5a1c) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66/\u914d\u97f3\u7c7b\u8bfe\u7a0b\uff08\u4ece\u5bf9\u8bdd\u63a8\u65ad\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3** |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u4f46\u7528\u6237\u8868\u73b0\u51fa\u5168\u5929\u5019\u5728\u7ebf\u3001\u9891\u7e41\u63d0\u95ee\uff0c\u65f6\u95f4\u4f3c\u4e4e\u8f83\u4e3a\u5145\u88d5\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u4eba\uff0c\u4f46\u7528\u6237\u81ea\u8ff0\u201c60\u4e86\u201d\uff0c\u53ef\u80fd\u4e3a\u9000\u4f11\u6216\u51c6\u9000\u4f11\u72b6\u6001\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u7f3a\u4e4f\u652f\u4ed8\u65b9\u5f0f\u3001\u5bb6\u5ead\u652f\u6301\u3001\u5177\u4f53\u5de5\u4f5c/\u751f\u6d3b\u72b6\u6001\u7b49\u5173\u952e\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u660e\u786e\u63d0\u53ca\u201c\u64ad\u8fd9\u4e2a\u6323\u94b1\u7684\u5427\u201d\uff0c\u6709\u53d8\u73b0\u671f\u671b\uff1b\u4f46\u540c\u65f6\u4e5f\u5728\u79ef\u6781\u5b8c\u6210\u65e9\u529f\u3001\u63d0\u4ea4\u4f5c\u4e1a\u3001\u8be2\u95ee\u6280\u672f\u7ec6\u8282\uff0c\u8868\u73b0\u51fa\u5b66\u4e60\u610f\u613f\u3002\u5bf9\u514d\u8d39/\u4ed8\u8d39\u4e66\u6709\u533a\u5206\u610f\u8bc6\uff0c\u5173\u6ce8\u6536\u76ca\uff0820%\u5206\u6210\uff09\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u201c\u51e0\u5929\u5185\u5fc5\u987b\u63d0\u73b0\u201d\u7684\u6781\u7aef\u6025\u8feb\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8bf4\u54b1\u4eec\u798f\u5229\u7684\u90a3\u4e2a\u4e09\u672c\u4e66\uff0c\u5b83\u662f\u798f\u5229\u4e66\uff0c\u662f\u662f\u4e0d\u4e0d\u6323\u94b1\u7684\u3002\u661f\u671f\u56db\u6211\u4e5f\u6ca1\u62a2\u4e0a\u4e66\uff0c\u6211\u62a2\u4e0a\u4e66\u4e86\uff0c\u7ed3\u679c\u662f\u4e2a\u4ec0\u4e48\u9910\u4e86\u5440\uff1f\u7ed3\u679c\u4e5f\u662f\u4e2a\u514d\u8d39\u4e66\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u4fe1\u606f\u4e0d\u8db3]** \u2014 \u672a\u63d0\u53ca\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**[\u4e2d]** \u2014 \u7528\u6237\u80fd\u575a\u6301\u6bcf\u65e5\u65e9\u529f\u3001\u53c2\u4e0e\u73ed\u4f1a\u3001\u9891\u7e41\u63d0\u95ee\uff0c\u65f6\u95f4\u6295\u5165\u5ea6\u9ad8\u3002\u4f46\u7cbe\u529b\u53ef\u80fd\u56e0\u5e74\u9f84\u548c\u6280\u672f\u9002\u5e94\u95ee\u9898\u800c\u53d7\u9650\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u4fe1\u606f\u4e0d\u8db3]** \u2014 \u672a\u63d0\u53ca\u3002\n- **\u7efc\u5408\u77ed\u677f**\uff1a**\u6280\u672f\u64cd\u4f5c\u80fd\u529b\u6781\u4f4e**\u3002\u8fd9\u662f\u5f53\u524d\u6700\u81f4\u547d\u7684\u77ed\u677f\u3002\u7528\u6237\u53cd\u590d\u9047\u5230\u5e76\u8be2\u95ee\u57fa\u7840\u64cd\u4f5c\u95ee\u9898\uff08\u627e\u4e0d\u5230\u8bfe\u7a0b\u3001\u4e0d\u4f1a\u4e0a\u4f20\u97f3\u9891\u3001\u5206\u4e0d\u6e05\u8d26\u53f7\u3001\u8f6f\u4ef6\u4f7f\u7528\u969c\u788d\uff09\uff0c\u4e14\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u4f9d\u8d56\u548c\u4e0d\u81ea\u4fe1\u3002**\u201c\u6ca1\u6709\u7535\u8111\u201d** \u8fdb\u4e00\u6b65\u9650\u5236\u4e86\u5176\u64cd\u4f5c\u80fd\u529b\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b07\u4f4e\u6781\u5371]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u7528\u6237\u9891\u7e41\u56e0\u64cd\u4f5c\u95ee\u9898\u9677\u5165\u7126\u8651\uff0c\u9700\u8981\u73ed\u4e3b\u4efb\u7684\u53cd\u590d\u786e\u8ba4\u624d\u80fd\u5b89\u5fc3\uff08\u201c\u6211\u611f\u89c9\u6ca1\u6709\u4f60\u7684\u4e00\u53e5\u8bdd\uff0c\u6211\u5c31\u611f\u89c9\u4e0d\u8e0f\u5b9e\u201d\uff09\u3002\u81ea\u6211\u8bc4\u4ef7\u4f4e\uff08\u201c\u6211\u4e0d\u76f8\u4fe1\u81ea\u5df1\u201d\uff09\uff0c\u5e76\u56e0\u81ea\u5df1\u7684\u63d0\u95ee\u5bf9\u73ed\u4e3b\u4efb\u4ea7\u751f\u6127\u759a\u611f\uff0c\u60c5\u7eea\u5185\u8017\u4e25\u91cd\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u867d\u7136\u5b57\u5199\u7684\u4e0d\u597d\uff0c\u4f46\u662f\u4f60\u5728\u4e0a\u9762\u4e00\uff0c\u4e00\u4e00\u76f4\u8bb2\uff0c\u6211\u5728\u4e00\u76f4\u8bb0...\u4f46\u662f\u4f60\u8bf4\u7684\u6bcf\u4e00\u53e5\u8bdd\uff0c\u6211\u867d\u7136\u90fd\u8bb0\u4e0d\u4e0b\u6765...\u6211\u5c31\u662f\u4e0d\u76f8\u4fe1\uff0c\u4e0d\u60f3\u4e0d\u76f8\u4fe1\u6211\u81ea\u5df1...\u518d\u4e00\u6b21\u8ddf\u4f60\u8bf4\u4e00\u58f0\u633a\u4e0d\u597d\u610f\u601d\u7684\uff0c\u4f60\u6559\u7684\u8fd9\u4e2a\u5b66\u751f\u633a\u4e0d\u597d\u610f\u601d\u7684\uff0c\u8f9b\u82e6\u4f60\u4e86\uff0c\u4e5f\u96be\u4e3a\u4f60\u4e86\u3002\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5f3a\u70c8\u7684\u81ea\u6211\u6000\u7591\u4e0e\u4ef7\u503c\u611f\u7f3a\u5931**\u300260\u5c81\u7684\u5e74\u9f84\u3001\u5bf9\u6570\u5b57\u6280\u672f\u7684\u6781\u5ea6\u964c\u751f\uff0c\u4f7f\u5176\u5728\u5b66\u4e60\u793e\u7fa4\u4e2d\u611f\u5230\u683c\u683c\u4e0d\u5165\u548c\u81ea\u5351\u3002\u5979\u6e34\u671b\u901a\u8fc7\u201c\u5b66\u4f1a\u201d\u548c\u201c\u88ab\u80af\u5b9a\u201d\u6765\u8bc1\u660e\u81ea\u5df1\u201c\u8fd8\u884c\u201d\uff0c\u83b7\u5f97\u5c0a\u91cd\u548c\u793e\u7fa4\u5f52\u5c5e\u611f\uff0c\u800c\u4e0d\u4ec5\u4ec5\u662f\u8d5a\u94b1\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u8010\u5fc3\u3001\u80af\u5b9a\u4e0e\u5b89\u5168\u611f**\u3002\u5979\u9700\u8981\u88ab\u5f53\u4f5c\u4e00\u4e2a\u201c\u597d\u5b66\u751f\u201d\u6765\u5bf9\u5f85\uff0c\u9700\u8981\u73ed\u4e3b\u4efb\u6210\u4e3a\u5979\u5728\u8fd9\u4e2a\u964c\u751f\u6570\u5b57\u4e16\u754c\u91cc\u7684\u201c\u5411\u5bfc\u201d\u548c\u201c\u60c5\u7eea\u7a33\u5b9a\u5668\u201d\uff0c\u4efb\u4f55\u6280\u672f\u632b\u6298\u90fd\u53ef\u80fd\u88ab\u5176\u89e3\u8bfb\u4e3a\u201c\u81ea\u5df1\u592a\u7b28\u201d\u7684\u8bc1\u660e\uff0c\u4ece\u800c\u5f15\u53d1\u5d29\u6e83\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1 \u7c7b** (\u9ad8\u610f\u613f\u4f46\u5b58\u5728\u660e\u663e\u77ed\u677f\uff0c\u9700\u91cd\u70b9\u6276\u6301\u4e0e\u98ce\u9669\u76d1\u63a7) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u6838\u5fc3\u7279\u5f81\uff1a\u4f4e\u5fc3\u7406\u5f39\u6027\u3001\u9ad8\u60c5\u7eea\u4f9d\u8d56\u3001\u6280\u672f\u64cd\u4f5c\u80fd\u529b\u5f31\u3001\u9700\u8981\u6301\u7eed\u7684\u60c5\u611f\u786e\u8ba4) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u804a\u5929\u8bb0\u5f55\u672a\u663e\u793a\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5c5e\u53cd\u5bf9\u7b49D\u7c7b\u7ea2\u7ebf)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u5e74\u9f84\u8f83\u5927\uff0c\u5bb6\u5ead\u5e72\u9884\u98ce\u9669\u76f8\u5bf9\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u6280\u672f\u64cd\u4f5c\u8fde\u7eed\u53d7\u632b**\u3002\u4f8b\u5982\uff1a\u53cd\u590d\u5c1d\u8bd5\u4ecd\u65e0\u6cd5\u63d0\u4ea4\u4f5c\u4e1a\u3001\u627e\u4e0d\u5230\u8bfe\u7a0b\u5165\u53e3\u3001\u97f3\u9891\u4e0a\u4f20\u5931\u8d25\uff0c\u7d2f\u79ef\u7684\u632b\u8d25\u611f\u4f1a\u4f7f\u5176\u8ba4\u5b9a\u201c\u6211\u5b66\u4e0d\u4f1a\u201d\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u73ed\u4e3b\u4efb\u56de\u5e94\u4e0d\u53ca\u65f6\u6216\u8bed\u6c14\u7a0d\u663e\u4e0d\u8010\u70e6**\u3002\u5979\u7684\u81ea\u6211\u4ef7\u503c\u611f\u4e0e\u73ed\u4e3b\u4efb\u7684\u53cd\u9988\u6df1\u5ea6\u7ed1\u5b9a\uff0c\u4e00\u65e6\u611f\u5230\u88ab\u5ffd\u89c6\u6216\u5426\u5b9a\uff0c\u6781\u6613\u4ea7\u751f\u201c\u6211\u679c\u7136\u4e0d\u884c\uff0c\u8001\u5e08\u90fd\u5acc\u5f03\u6211\u4e86\u201d\u7684\u60f3\u6cd5\uff0c\u8fdb\u800c\u653e\u5f03\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u5728\u5c1d\u8bd5\u63a5\u5355\uff08\u62a2\u4e66\uff09\u540e\uff0c\u53d1\u73b0\u90fd\u662f\u514d\u8d39\u4e66\u6216\u6536\u76ca\u6781\u4f4e\uff0c\u4e0e\u201c\u6323\u94b1\u201d\u9884\u671f\u4ea7\u751f\u843d\u5dee\uff0c\u4f46\u6b64\u98ce\u9669\u6b21\u4e8e\u60c5\u7eea\u5d29\u6e83\u98ce\u9669\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c\u4e00\u5468\u81f3\u7b2c\u4e8c\u5468**\u3002\u6b64\u9636\u6bb5\u4e3a\u64cd\u4f5c\u95ee\u9898\u96c6\u4e2d\u7206\u53d1\u671f\uff08\u627e\u8bfe\u3001\u4ea4\u4f5c\u4e1a\u3001\u62a2\u4e66\uff09\uff0c\u4e5f\u662f\u5176\u81ea\u4fe1\u5fc3\u6700\u8106\u5f31\u7684\u65f6\u671f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6f58\u963f\u59e8/\u59d0\u59d0\u60a8\u597d\uff01\u770b\u5230\u60a8\u8fd9\u4e48\u8ba4\u771f\u505a\u7b14\u8bb0\u3001\u575a\u6301\u65e9\u529f\uff0c\u771f\u7684\u7279\u522b\u611f\u52a8\u3002\u54b1\u4eec\u8fd9\u4e2a\u5e74\u7eaa\u8fd8\u80fd\u8fd9\u4e48\u6295\u5165\u5730\u5b66\u65b0\u4e1c\u897f\uff0c\u672c\u8eab\u5c31\u662f\u7279\u522b\u4e86\u4e0d\u8d77\u7684\u4e8b\uff01\u60a8\u653e\u5fc3\uff0c\u64cd\u4f5c\u4e0a\u7684\u4efb\u4f55\u5c0f\u95ee\u9898\u90fd\u4e0d\u662f\u95ee\u9898\uff0c\u54b1\u4eec\u8fd9\u4e2a\u73ed\u5c31\u662f\u6765\u89e3\u51b3\u8fd9\u4e9b\u7684\u3002\u60a8\u968f\u65f6\u95ee\u6211\uff0c\u6211\u968f\u65f6\u5728\u3002\u54b1\u4eec\u6162\u6162\u6765\uff0c\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u60a8\u80af\u5b9a\u80fd\u884c\uff01\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5174\u8da3\u6e38\u4e50\u7ebf\u3011**\u3002\u5f31\u5316\u524d\u671f\u53d8\u73b0\u538b\u529b\uff0c\u5f3a\u5316\u201c\u5b66\u4f1a\u4e00\u70b9\u5c0f\u6280\u80fd\u201d\u7684\u6210\u5c31\u611f\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u5f3a\u70c8\u8865\u5145\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u5305\u62ec\uff1a1\uff09\u4e00\u5bf9\u4e00\u4e13\u5c5e\u64cd\u4f5c\u56fe\u6587/\u89c6\u9891\u6307\u5f15\uff08\u975e\u6807\u51c6\u8bdd\u672f\uff09\uff1b2\uff09\u6bcf\u65e5\u201c\u5c0f\u6210\u5c31\u201d\u6253\u5361\u9f13\u52b1\uff1b3\uff09\u5b9a\u671f\u79c1\u804a\u80af\u5b9a\u5176\u8fdb\u6b65\uff08\u54ea\u6015\u53ea\u662f\u627e\u5230\u4e86\u4e00\u4e2a\u6309\u94ae\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u5979\u4f7f\u7528\u4efb\u4f55\u81ea\u52a8\u5316\u8bdd\u672f\u6216\u8ba9\u5979\u53bb\u201c\u770b\u73ed\u7fa4\u516c\u544a\u201d\u81ea\u884c\u89e3\u51b3**\u3002\u5fc5\u987b\u4eba\u5de5\u3001\u8010\u5fc3\u3001\u4e00\u6b65\u6b65\u5f15\u5bfc\u3002\n    2. **\u7edd\u4e0d\u7ed9\u5176\u5e03\u7f6e\u9ad8\u96be\u5ea6\u6216\u9700\u8981\u590d\u6742\u8f6f\u4ef6\u64cd\u4f5c\u7684\u4f5c\u4e1a**\u3002\u4efb\u52a1\u5fc5\u987b\u6781\u5ea6\u7b80\u5316\u3001\u6b65\u9aa4\u6e05\u6670\u3002\n    3. **\u7edd\u4e0d\u5728\u5176\u8868\u8fbe\u7126\u8651\u65f6\uff0c\u53cd\u95ee\u201c\u6211\u8bb2\u5f97\u4e0d\u6e05\u695a\u5417\uff1f\u201d\u6216\u8868\u73b0\u51fa\u4efb\u4f55\u4e0d\u8010\u70e6**\uff08\u5982\u9500\u552e\u66fe\u8bf4\u7684\u201c\u6211\u90fd\u5f00\u59cb\u6211\u81ea\u5df1\u4e86\u201d\u3001\u201c\u6211\u90fd\u8981\u5f00\u59cb\u81ea\u6211\u6000\u7591\u4e86\u201d\u662f**\u9ad8\u5371\u96f7\u533a**\uff09\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u5f53\u524d\u9636\u6bb5\uff0c\u4efb\u4f55\u6d89\u53ca\u66f4\u9ad8\u9636\u3001\u66f4\u590d\u6742\u4ea7\u54c1\u7684\u63a8\u4ecb\u90fd\u4f1a\u52a0\u5267\u5176\u7126\u8651\u548c\u4e0d\u81ea\u4fe1\uff0c\u6781\u6613\u5f15\u53d1\u9000\u8d39\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u6211\u611f\u89c9\u6ca1\u6709\u4f60\u7684\u4e00\u53e5\u8bdd\uff0c\u6211\u5c31\u611f\u89c9\u4e0d\u8e0f\u5b9e\u3002**\u201d\n2. > \u201c**\u6211\u867d\u7136\u5b57\u5199\u7684\u4e0d\u597d...\u4f46\u662f\u4f60\u8bf4\u7684\u6bcf\u4e00\u53e5\u8bdd\uff0c\u6211\u867d\u7136\u90fd\u8bb0\u4e0d\u4e0b\u6765...\u6211\u5c31\u662f\u4e0d\u76f8\u4fe1\uff0c\u4e0d\u60f3\u4e0d\u76f8\u4fe1\u6211\u81ea\u5df1...**\u201d\n3. > \u201c**\u518d\u4e00\u6b21\u8ddf\u4f60\u8bf4\u4e00\u58f0\u633a\u4e0d\u597d\u610f\u601d\u7684\uff0c\u4f60\u6559\u7684\u8fd9\u4e2a\u5b66\u751f\u633a\u4e0d\u597d\u610f\u601d\u7684\uff0c\u8f9b\u82e6\u4f60\u4e86\uff0c\u4e5f\u96be\u4e3a\u4f60\u4e86\u3002**\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u3001\u5f52\u5c5e\u4e0e\u4ef7\u503c\u786e\u8ba4\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u81f4\u8010\u5fc3\u3001\u50bb\u74dc\u5f0f\u64cd\u4f5c\u6307\u5f15\u4e0e\u9ad8\u9891\u60c5\u611f\u80af\u5b9a\uff0c\u4e25\u9632\u6280\u672f\u632b\u8d25\u611f\u548c\u73ed\u4e3b\u4efb\u7684\u8d1f\u9762\u53cd\u9988\u3011\u3002**\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5c0a\u91cd\u5f52\u5c5e\", \"target_product_line\": \"\u5174\u8da
