    <script>
        const markdownText = "# AI\u5199\u4f5c\u8bfe\u5b66\u5458\u5fc3\u7406\u8bca\u65ad\u62a5\u544a (UID: 230323179)\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u9ad8\u5de5\u5177\u6027\u52a8\u673a**\u3002\u7528\u6237\u660e\u786e\u5173\u6ce8\u201cAI\u5199\u4f5c666\u201d\uff0c\u5bf9\u8bfe\u7a0b\u7684\u6838\u5fc3\u4ef7\u503c\uff08\u5199\u4f5c\u6280\u5de7\u3001\u6295\u7a3f\u53d8\u73b0\uff09\u6709\u79ef\u6781\u56de\u5e94\u3002\u62a5\u540d\u540e\u8be2\u95ee\u73ed\u7ea7\u4eba\u6570\u3001\u8bfe\u7a0b\u5ef6\u671f\u3001\u62bd\u5956\u7b49\u7ec6\u8282\uff0c\u8868\u73b0\u51fa\u8f83\u5f3a\u7684**\u7ed3\u679c\u5bfc\u5411\u548c\u52a1\u5b9e\u5fc3\u6001**\u3002\u52a8\u673a\u96c6\u4e2d\u4e8e\u6280\u80fd\u83b7\u53d6\u4e0e\u53d8\u73b0\uff0c\u800c\u975e\u5355\u7eaf\u5174\u8da3\u6216\u793e\u4ea4\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u4e2d\u7b49\u504f\u4e0b**\u3002\u7528\u6237\u5168\u7a0b\u672a\u63d0\u53ca\u4e2a\u4eba\u80cc\u666f\u3001\u804c\u4e1a\u3001\u7ecf\u6d4e\u72b6\u51b5\u6216\u53ef\u7528\u65f6\u95f4\u3002\u4ec5\u4ece\u4e92\u52a8\u6a21\u5f0f\uff08\u7b80\u77ed\u3001\u805a\u7126\u8bfe\u7a0b\u672c\u8eab\uff09\u63a8\u6d4b\uff0c\u53ef\u80fd\u4e3a**\u65f6\u95f4/\u7cbe\u529b\u6709\u9650\u7684\u5728\u804c\u4eba\u58eb\u6216\u65b0\u624b**\uff0c\u5bf9\u989d\u5916\u8d44\u6e90\uff08\u5982\u4eba\u8109\u3001\u8bbe\u5907\uff09\u65e0\u4e3b\u52a8\u8981\u6c42\u3002\u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u65e0\u9ad8\u8d44\u6e90\u4fe1\u53f7\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u4e2d\u7b49**\u3002\u7528\u6237\u80fd\u5b8c\u6210\u4f53\u9a8c\u8425\u4f5c\u4e1a\u5e76\u4e3b\u52a8\u63d0\u4ea4\uff08\u201c\u8001\u5e08\uff0c\u6211\u4ea4\u5728\u7fa4\u91cc\u4e86\u201d\uff09\uff0c\u5bf9\u9500\u552e\u7684\u957f\u7bc7\u6559\u5b66\u548c\u8f6c\u5316\u8bdd\u672f\u6709\u57fa\u672c\u914d\u5408\uff08\u56de\u590d\u201c\u597d\u7684 \u8001\u5e08\u201d\uff09\u3002\u4f46\u5728\u9500\u552e\u9ad8\u5f3a\u5ea6\u8f6c\u5316\u65f6\uff0c\u672a\u8868\u73b0\u51fa\u7126\u8651\u6216\u8feb\u5207\uff0c\u63d0\u95ee\uff08\u73ed\u7ea7\u4eba\u6570\u3001\u62bd\u5956\uff09\u663e\u5f97**\u51b7\u9759\u3001\u6709\u4e3b\u89c1**\u3002\u6297\u538b\u80fd\u529b\u5f85\u89c2\u5bdf\uff0c\u4f46\u521d\u671f\u914d\u5408\u5ea6\u5c1a\u53ef\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 (\u652f\u4ed8\u6838\u67e5)**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u4e8e2026-04-12 22:03:48\u63d0\u53ca\u201c4380\u201d\uff08\u7591\u4f3c\u4ef7\u683c\uff09\uff0c\u5e76\u4e8e22:05:55\u786e\u8ba4\u201c\u5df2\u62a5\u540d\u201d\u3002\u652f\u4ed8\u884c\u4e3a\u5df2\u5b8c\u6210\u3002\n*   **\u6b65\u9aa41.5 (\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5)**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u6216\u914d\u5076\u8ba8\u8bba\uff0c\u51b3\u7b56\u8868\u73b0\u4e3a\u4e2a\u4eba\u884c\u4e3a\u3002\n*   **\u6b65\u9aa41-4\u5224\u5b9a**: **B\u7c7b\uff08\u5de5\u5177\u578b\u52a1\u5b9e\u8005\uff09**\u3002\u52a8\u673a\u660e\u786e\u6307\u5411\u6280\u80fd\u53d8\u73b0\uff08\u9ad8M\uff09\uff0c\u884c\u52a8\u4e0a\u5b8c\u6210\u4e86\u4ece\u542c\u8bfe\u3001\u4ea4\u4f5c\u4e1a\u5230\u4ed8\u8d39\u7684\u5168\u6d41\u7a0b\uff0c\u7b26\u5408\u201c\u6709\u660e\u786e\u76ee\u6807\u4e14\u613f\u610f\u4e3a\u89e3\u51b3\u65b9\u6848\u4ed8\u8d39\u201d\u7684\u7279\u5f81\u3002\u8d44\u6e90\u4fe1\u53f7\u4e0d\u660e\uff0c\u4f46\u5fc3\u7406\u5f39\u6027\u663e\u793a\u5176\u80fd\u6309\u6b65\u9aa4\u884c\u52a8\uff0c\u975e\u6613\u7126\u8651\u6216\u6613\u653e\u5f03\u578b\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b: T4 \u7cbe\u7b97\u5e08\u578b**\n    *   **\u4f9d\u636e**: \u9ad8\u5ea6\u5173\u6ce8\u8bfe\u7a0b\u7684\u5177\u4f53\u7ec6\u8282\uff08\u73ed\u7ea7\u4eba\u6570\u3001\u662f\u5426\u591a\u65b9\u76f4\u64ad\u3001\u8bfe\u7a0b\u5ef6\u671f\u653f\u7b56\u3001\u62bd\u5956\u7ed3\u679c\uff09\uff0c\u8868\u73b0\u51fa\u5f3a\u70c8\u7684**\u6210\u672c\u6548\u76ca\u6838\u7b97\u503e\u5411**\u548c**\u98ce\u9669\u63a7\u5236\u610f\u8bc6**\u3002\u5728\u9500\u552e\u6e32\u67d3\u884c\u4e1a\u7ea2\u5229\u548c\u8d44\u6e90\u65f6\uff0c\u7528\u6237\u53cd\u5e94\u5e73\u6de1\uff0c\u63d0\u95ee\u805a\u7126\u4e8e\u670d\u52a1\u4ea4\u4ed8\u7684\u786e\u5b9a\u6027\u3002\u5176\u201cAI\u5199\u4f5c666\u201d\u7684\u53cd\u9988\u4e5f\u4f53\u73b0\u4e86\u5bf9\u5de5\u5177\u6548\u80fd\u800c\u975e\u60c5\u611f\u8054\u7ed3\u7684\u8ba4\u53ef\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669\u7b49\u7ea7: \u4e2d**\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**: **\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u4e3a\u5178\u578b\u7ed3\u679c\u5bfc\u5411\u8005\uff0c\u82e5\u5b66\u4e60\u540e\u65e0\u6cd5\u638c\u63e1\u53d8\u73b0\u65b9\u6cd5\u6216\u6295\u7a3f\u65e0\u679c\uff0c\u6781\u6613\u56e0\u201c\u627f\u8bfa\u672a\u5151\u73b0\u201d\u611f\u5f15\u53d1\u6295\u8bc9\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b/\u51b2\u52a8\u6d88\u8d39**: **\u4f4e\u98ce\u9669**\u3002\u652f\u4ed8\u8fc7\u7a0b\u5e72\u8106\uff0c\u672a\u8868\u73b0\u51fa\u72b9\u8c6b\u6216\u4ef7\u683c\u654f\u611f\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**: **\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u4e3b\u52a8\u8be2\u95ee\u201c\u8bfe\u7a0b\u5ef6\u671f\u201d\uff0c\u8868\u660e\u65f6\u95f4\u5b89\u6392\u53ef\u80fd\u5b58\u5728\u4e0d\u786e\u5b9a\u6027\uff0c\u662f\u6f5c\u5728\u9000\u8d39\u89e6\u53d1\u70b9\u3002\n    4.  **\u5185\u5bb9\u8d28\u91cf\u4e0d\u6ee1**: **\u4e2d\u98ce\u9669**\u3002\u4f5c\u4e3a\u201c\u7cbe\u7b97\u5e08\u201d\uff0c\u4f1a\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u3001\u5e08\u8d44\u3001\u670d\u52a1\u7684\u201c\u6027\u4ef7\u6bd4\u201d\u8fdb\u884c\u4e25\u683c\u8bc4\u4f30\u3002\n    5.  **\u670d\u52a1\u4f53\u9a8c\u5dee**: **\u4e2d\u98ce\u9669**\u3002\u5173\u6ce8\u73ed\u7ea7\u89c4\u6a21\uff08\u201c\u4e00\u4e2a\u73ed\u6709\u51e0\u4e2a\u540c\u5b66\u201d\uff09\uff0c\u6697\u793a\u5bf9\u4e2a\u6027\u5316\u6307\u5bfc\u6709\u671f\u5f85\u3002\u82e5\u73ed\u4e3b\u4efb\u6216\u966a\u8dd1\u5b98\u670d\u52a1\u4e0d\u8fbe\u5176\u9884\u671f\uff0c\u53ef\u80fd\u4e0d\u6ee1\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9/\u51b3\u7b56\u53d8\u66f4**: **\u4f4e\u98ce\u9669**\u3002\u6682\u65e0\u4fe1\u53f7\u3002\n    7.  **\u7ade\u54c1\u6bd4\u8f83/\u5916\u90e8\u5f71\u54cd**: **\u4f4e\u98ce\u9669**\u3002\u6682\u65e0\u4fe1\u53f7\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u9500\u552e\u884c\u4e3a**:\n    *   **\u5408\u89c4\u70b9**: \u9500\u552e\uff08\u4e00\u7c73\uff09\u63d0\u4f9b\u4e86\u8be6\u7ec6\u7684\u8bfe\u7a0b\u7ed3\u6784\u3001\u5e08\u8d44\u3001\u670d\u52a1\u6a21\u5f0f\uff08\u4e09\u5e08\u3001\u966a\u8dd1\uff09\u548c\u53d8\u73b0\u6848\u4f8b\uff0c\u4fe1\u606f\u62ab\u9732\u8f83\u5145\u5206\u3002\u5f3a\u8c03\u4e86\u201c\u968f\u65f6\u53ef\u63d0\u4ea4\u9000\u8d39\u7533\u8bf7\u201d\u3002\n    *   **\u98ce\u9669\u70b9**: **\u5b58\u5728\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u538b\u529b\u9500\u552e\u5acc\u7591**\u3002\u5982\u201c\u52a0\u5165\u8fdb\u6765\u8ddf\u7740\u5e08\u59d0\u201d\u3001\u201c\u6211\u4e4b\u524d\u7684\u6709\u4e2a\u522b\u4f18\u79c0\u7684\u5b66\u5458\u5728\u5b66\u4e60\u671f\u95f4\u5c31\u628a\u5b66\u8d39\u56de\u6765\u4e86\u201d\u3001\u201c\u8fd9\u4e2a\u884c\u4e1a\u662f\u4f60\u8fc8\u8fdb\u6765\u662f\u975e\u5e38\u660e\u667a\u7684\u9009\u62e9\u201d\u7b49\u8bdd\u672f\uff0c**\u53ef\u80fd\u8425\u9020\u4e86\u4e0d\u5207\u5b9e\u9645\u7684\u9884\u671f**\u3002\u4f7f\u7528\u201c\u6dd8\u6c70\u672a\u5b8c\u6210\u5b66\u4e60\u8005\u201d\u8425\u9020\u7d27\u8feb\u611f\u3002\n*   **\u4f26\u7406\u9632\u7ebf**: \u672a\u53d1\u73b0\u865a\u5047\u8d44\u8d28\u3001\u8bcb\u6bc1\u7ade\u54c1\u7b49\u7ea2\u7ebf\u95ee\u9898\uff0c\u4f46**\u5728\u8425\u9020\u201c\u5feb\u901f\u53d8\u73b0\u201d\u548c\u201c\u8d44\u6e90\u7a00\u7f3a\u201d\u9884\u671f\u4e0a\u5b58\u5728\u5938\u5927\u503e\u5411**\uff0c\u9700\u540e\u7eed\u670d\u52a1\u505a\u5b9e\u4ee5\u5f25\u8865\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6838\u5fc3\u7b56\u7565**: **\u63d0\u4f9b\u786e\u5b9a\u6027\uff0c\u7ba1\u7406\u9884\u671f\uff0c\u805a\u7126\u7ed3\u679c**\u3002\u8be5\u7528\u6237\u4e0d\u9700\u8981\u60c5\u611f\u6309\u6469\uff0c\u9700\u8981\u6e05\u6670\u8def\u5f84\u548c\u53ef\u9760\u4ea4\u4ed8\u3002\n*   **\u884c\u52a8\u6307\u5357**:\n    1.  **\u5f00\u8bfe\u521d\u671f**: \u7acb\u5373\u660e\u786e\u8bfe\u7a0b\u5927\u7eb2\u3001\u65f6\u95f4\u8868\u3001\u4f5c\u4e1a\u63d0\u4ea4\u4e0e\u53cd\u9988\u673a\u5236\u3001\u966a\u8dd1\u5b98\u5bf9\u63a5\u6d41\u7a0b\u3002**\u6240\u6709\u627f\u8bfa\u9700\u4e66\u9762\u5316\u3001\u6d41\u7a0b\u5316**\u3002\n    2.  **\u8fc7\u7a0b\u7ba1\u7406**: \u5b9a\u671f\u540c\u6b65\u5b66\u4e60\u8fdb\u5ea6\u548c\u9636\u6bb5\u6027\u6210\u679c\uff08\u5982\u6295\u7a3f\u6570\u636e\u3001\u8fc7\u7a3f\u7387\uff09\u3002\u53cd\u9988\u9700\u5177\u4f53\u3001\u4e13\u4e1a\uff0c\u76f4\u63a5\u6307\u51fa\u95ee\u9898\u5e76\u63d0\u4f9b\u4fee\u6539\u65b9\u6848\uff0c\u907f\u514d\u7a7a\u6cdb\u9f13\u52b1\u3002\n    3.  **\u98ce\u9669\u9884\u63a7**: \u4e3b\u52a8\u6c9f\u901a\u65f6\u95f4\u5b89\u6392\uff0c\u63d0\u4f9b\u7075\u6d3b\u7684\u8865\u8bfe/\u5ef6\u671f\u65b9\u6848\u3002\u65e9\u671f\u8bc6\u522b\u5176\u5b66\u4e60\u96be\u70b9\uff0c\u63d0\u4f9b\u989d\u5916\u8f85\u5bfc\u8d44\u6e90\uff0c\u9632\u6b62\u56e0\u201c\u5b66\u4e0d\u4f1a\u201d\u800c\u653e\u5f03\u3002\n    4.  **\u6c9f\u901a\u98ce\u683c**: \u7b80\u6d01\u3001\u4e13\u4e1a\u3001\u4fe1\u606f\u5bc6\u5ea6\u9ad8\u3002\u51cf\u5c11\u201c\u5b9d\u5b9d\u201d\u3001\u201c\u52a0\u6cb9\u201d\u7b49\u60c5\u611f\u8bdd\u672f\uff0c\u591a\u7528\u201c\u6839\u636e\u8bfe\u7a0b\u8bbe\u8ba1\u201d\u3001\u201c\u6570\u636e\u8868\u660e\u201d\u3001\u201c\u4e0b\u4e00\u6b65\u5efa\u8bae\u201d\u7b49\u7406\u6027\u8868\u8ff0\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**:\n    *   **\u6302\u8f7d\u4e50\u9ad8\u7ebf**: **\u201c\u6280\u80fd\u5de5\u5177\u7bb1\u201d\u6216\u201c\u5b9e\u6218\u9879\u76ee\u5236\u201d** \u4ea7\u54c1\u7ebf\u3002\u9002\u5408\u63d0\u4f9b\u6807\u51c6\u5316\u5de5\u5177\u3001\u6a21\u677f\u3001SOP\u6d41\u7a0b\u548c\u660e\u786e\u9a8c\u6536\u6807\u51c6\u7684\u8bfe\u7a0b\u4ea7\u54c1\uff0c\u6ee1\u8db3\u5176\u201c\u6309\u56fe\u7d22\u9aa5\u201d\u3001\u201c\u6295\u5165\u5fc5\u6709\u4ea7\u51fa\u201d\u7684\u5fc3\u7406\u9700\u6c42\u3002\n    *   **\u907f\u514d**: \u8fc7\u4e8e\u5f3a\u8c03\u201c\u5708\u5b50\u201d\u3001\u201c\u4eba\u8109\u201d\u3001\u201c\u60c5\u611f\u8d4b\u80fd\u201d\u7684\u793e\u7fa4\u578b\u4ea7\u54c1\u3002\n\n{\"core_type\": \"T4 \u7cbe\u7b97\u5e08\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\uff08\u80fd\u529b\u83b7\u5f97\u8ba4\u53ef\uff09/\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u6280\u80fd\u5de5\u5177\u7bb1/\u5b9e\u6218\u9879\u76ee\u5236\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}";
