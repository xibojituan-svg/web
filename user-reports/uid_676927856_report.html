    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u82d3\u6c50 (UID: 676927856) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-02-13 \u81f3 2026-02-18 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u554a\u54df\u8349\u83935(\u987e\u79cb\u83b9)\u3001\u5927\u6811\u6709\u58f0(\u674e\u6811\u52c7) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b (\u5177\u4f53\u8bfe\u7a0b\u53ca\u4ef7\u683c\u4fe1\u606f\u7f3a\u5931) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931** (\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u91d1\u989d\u3001\u5206\u671f\u7b49) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u9700\u7167\u987e\u5bb6\u4eba\uff0c\u65f6\u95f4\u4e0d\u56fa\u5b9a\uff0c\u4f46\u80fd\u4e3b\u52a8\u89c4\u5212\u5b66\u4e60) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931** (\u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\uff0c\u4f46\u7528\u6237\u4e0e\u5916\u5a46\u540c\u4f4f\uff0c\u9700\u517c\u987e) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** (\u5173\u952e\u652f\u4ed8\u3001\u5bb6\u5ead\u652f\u6301\u4fe1\u606f\u5168\u65e0\uff0c\u5224\u65ad\u57fa\u4e8e\u6709\u9650\u884c\u4e3a\u4fe1\u53f7) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6280\u80fd\u672c\u8eab\u7684\u6d53\u539a\u5174\u8da3\u548c\u94bb\u7814\u7cbe\u795e\uff0c\u4e3b\u52a8\u63a2\u7d22\u4e0d\u540c\u5de5\u79cd\uff08\u753b\u672c\u3001\u540e\u671f\u3001\u5bf9\u8f68\u7b49\uff09\uff0c\u5e76\u79ef\u6781\u7ec3\u4e60\u3002\u867d\u6709\u53d8\u73b0\u8def\u5f84\u7684\u8be2\u95ee\uff0c\u4f46\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u201c\u5b66\u4f1a\u201d\u548c\u201c\u505a\u597d\u201d\uff0c\u800c\u975e\u77ed\u671f\u66b4\u5bcc\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u753b\u672c\u2192\u5ba1\u542c\u2192\u5bf9\u8f68+\u5e72\u97f3\u5904\u7406\u2192\u540e\u671f\u5236\u4f5c(\u7b80\u914d/\u4e2d\u914d/\u7cbe\u914d)\u3002\u90fd\u60f3\u5b66\uff0c\u8bf4\u662f\u8981\u5907\u6848\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[**\u4fe1\u606f\u7f3a\u5931**] \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u7ecf\u6d4e\u72b6\u51b5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[**\u4e2d**] \u2014 \u7528\u6237\u80fd\u4e3b\u52a8\u89c4\u5212\u5b66\u4e60\uff08\u5982\u63d0\u524d\u505a\u65e9\u529f\u3001\u8865\u76f4\u64ad\uff09\uff0c\u4f46\u65f6\u95f4\u53d7\u5bb6\u5ead\u4e8b\u52a1\uff08\u4e09\u4f2f\u5927\u5bff\u3001\u5976\u5976\u60c5\u51b5\uff09\u5f71\u54cd\uff0c\u5448\u73b0\u788e\u7247\u5316\u7279\u5f81\u3002\u5177\u5907\u201c\u5f53\u4e0b\u5c31\u662f\u6700\u597d\u7684\u5f00\u59cb\u201d\u7684\u884c\u52a8\u529b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[**\u4fe1\u606f\u7f3a\u5931**] \u2014 \u672a\u63d0\u53ca\u5bb6\u4eba\u5bf9\u5b66\u4e60\u7684\u6001\u5ea6\uff0c\u4f46\u4e0e\u5916\u5a46\u540c\u4f4f\uff0c\u9700\u5206\u5fc3\u7167\u987e\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9762\u5bf9\u201c\u58f0\u97f3\u6d6e\u201d\u3001\u201c\u627e\u4e0d\u5230\u611f\u89c9\u201d\u7b49\u521d\u671f\u632b\u8d25\uff0c\u80fd\u4e3b\u52a8\u5206\u6790\u539f\u56e0\uff08\u201c\u5934\u62ac\u8d77\u6765\uff0c\u6c14\u8981\u8db3\u4e00\u70b9\u201d\uff09\uff0c\u8c03\u6574\u65b9\u6cd5\uff0c\u5e76\u63a5\u53d7\u201c\u65b0\u4eba\u5f55\u4e00\u904d\u548c\u5341\u51e0\u904d\u4e00\u6837\u201d\u7684\u6307\u5bfc\uff0c\u5fc3\u6001\u79ef\u6781\uff0c\u4e0d\u7ea0\u7ed3\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u6bcf\u6b21\u505a\u4ec0\u4e48\u4e8b\u4e00\u5b9a\u8981\u7b49\u5230\u6709\u5145\u8db3\u65f6\u95f4\u6bb5\u7684\u65f6\u5019\u518d\u505a\uff0c\u5176\u5b9e\u6ca1\u6709\u4ec0\u4e48\u6700\u597d\u7684\u5f00\u59cb\uff0c\u5f53\u4e0b\u5c31\u662f\u6700\u597d\u7684\u5f00\u59cb\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u81ea\u6211\u80fd\u529b\u7684\u4e0d\u786e\u5b9a\u4e0e\u5bfb\u6c42\u4e13\u4e1a\u8ba4\u53ef\u3002\u5979\u53cd\u590d\u7ea0\u7ed3\u5f55\u97f3\u6548\u679c\uff08\u58f0\u97f3\u6d6e\u3001\u8282\u594f\u4e0d\u5bf9\uff09\uff0c\u5e76\u4e3b\u52a8\u5bfb\u6c42\u53cd\u9988\uff0c\u6df1\u5c42\u9700\u6c42\u662f\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u201c\u786c\u6838\u624b\u827a\u201d\u83b7\u5f97\u4e13\u4e1a\u8eab\u4efd\u8ba4\u540c\u548c\u4ed6\u4eba\uff08\u8001\u5e08\u3001\u540c\u5b66\uff09\u7684\u5c0a\u91cd\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u7cbe\u51c6\u80af\u5b9a\u4e0e\u6210\u957f\u89c1\u8bc1**\u3002\u5979\u4e0d\u9700\u8981\u6cdb\u6ee5\u7684\u5b89\u6170\uff0c\u800c\u662f\u9700\u8981\u8001\u5e08\u6307\u51fa\u5177\u4f53\u95ee\u9898\uff08\u5982\u5e08\u59d0\u70b9\u8bc4\u201c\u8981\u6709\u60c5\u7eea\u8fdb\u53bb\u201d\uff09\u5e76\u8ba4\u53ef\u5979\u7684\u6bcf\u4e00\u70b9\u8fdb\u6b65\uff0c\u8ba9\u5979\u611f\u53d7\u5230\u201c\u6211\u5728\u53d8\u4e13\u4e1a\u201d\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u7cbe\u786e\u5224\u5b9aABCD** (\u7f3a\u652f\u4ed8\u4e0e\u5bb6\u5ead\u5173\u952e\u4fe1\u606f) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **[T3 \u6b7b\u78d5\u5b66\u9738\u578b]** (\u9ad8\u52a8\u673a\u7eaf\u5ea6\u503e\u5411\uff0c\u94bb\u7814\u7ec6\u8282\uff0c\u4e3b\u52a8\u89c4\u5212\u5b66\u4e60\uff0c\u8ffd\u6c42\u6280\u80fd\u539f\u7406\u4e0e\u7cbe\u8fdb) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1] (\u57fa\u4e8e\u73b0\u6709\u4fe1\u606f\uff0c\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u7b49\u7ea2\u7ebf)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u9700\u8b66\u60d5\u82e5\u5bb6\u4eba\u53cd\u5bf9\u6216\u5360\u7528\u5176\u5927\u91cf\u65f6\u95f4\u7167\u987e\uff0c\u53ef\u80fd\u5bfc\u81f4\u5b66\u4e60\u4e2d\u65ad\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u7528\u6237\u81ea\u6211\u9a71\u52a8\u529b\u5f3a\uff0c\u80fd\u4e3b\u52a8\u89c4\u5212\uff0c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5c1a\u53ef\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u81ea\u6211\u8c03\u8282\uff0c\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4f4e** | \u5f53\u524d\u52a8\u673a\u4ee5\u5b66\u4e60\u548c\u5174\u8da3\u4e3a\u4e3b\uff0c\u5bf9\u77ed\u671f\u53d8\u73b0\u671f\u671b\u4e0d\u660e\u663e\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c3-4\u5468\uff08\u6280\u80fd\u9ad8\u539f\u671f\uff09**\u3002\u5f53\u5b66\u4e60\u8fdb\u5165\u5e73\u53f0\u671f\uff0c\u6280\u5de7\u590d\u6742\u5ea6\u63d0\u5347\uff0c\u82e5\u957f\u65f6\u95f4\u5f97\u4e0d\u5230\u201c\u8089\u773c\u53ef\u89c1\u201d\u7684\u8fdb\u6b65\u548c\u4e13\u4e1a\u8ba4\u53ef\uff0c\u53ef\u80fd\u4ea7\u751f\u81ea\u6211\u6000\u7591\u548c\u5026\u6020\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u82d3\u6c50\uff0c\u770b\u4e86\u4f60\u524d\u671f\u7684\u7ec3\u4e60\u548c\u63d0\u95ee\uff0c\u80fd\u611f\u89c9\u5230\u4f60\u5bf9\u7ec6\u8282\u7684\u94bb\u7814\u52b2\u548c\u884c\u52a8\u529b\uff0c\u8fd9\u5df2\u7ecf\u662f\u4f18\u79c0\u6f14\u64ad\u8005\u7684\u6838\u5fc3\u7279\u8d28\u4e86\u3002\u54b1\u4eec\u8bfe\u7a0b\u8bbe\u8ba1\u5c31\u662f\u4e3a\u4f60\u8fd9\u79cd\u2018\u60f3\u641e\u61c2\u4e3a\u4ec0\u4e48\u2019\u7684\u540c\u5b66\u51c6\u5907\u7684\uff0c\u8fc7\u7a0b\u4e2d\u6709\u4efb\u4f55\u2018\u5361\u70b9\u2019\uff0c\u522b\u81ea\u5df1\u7422\u78e8\uff0c\u968f\u65f6\u6233\u6211\uff0c\u6211\u4eec\u4e00\u8d77\u628a\u5b83\u62c6\u89e3\u660e\u767d\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u3002\u63d0\u4f9b\u6e05\u6670\u3001\u6709\u6df1\u5ea6\u7684\u6280\u80fd\u8fdb\u9636\u8def\u5f84\uff0c\u6ee1\u8db3\u5176\u94bb\u7814\u9700\u6c42\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743**\u3011\u3002\u8d4b\u4e88\u5176\u5411\u4e13\u5bb6\u8001\u5e08\u6df1\u5ea6\u63d0\u95ee\u7684\u4f18\u5148\u6743\uff0c\u5e76\u5b9a\u671f\u53cd\u9988\u5176\u6280\u80fd\u6210\u957f\u5730\u56fe\uff0c\u6ee1\u8db3\u5176\u5c0a\u91cd\u4e0e\u8ba4\u53ef\u9700\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u7528\u8fc7\u4e8e\u80a4\u6d45\u7684\u201c\u4f60\u597d\u68d2\u201d\u6577\u884d\u70b9\u8bc4\uff1b2. \u53ea\u7ed9\u4efb\u52a1\u4e0d\u7ed9\u539f\u7406\u548c\u6df1\u5ea6\u53cd\u9988\uff1b3. \u5c06\u5176\u4e0e\u8ffd\u6c42\u5feb\u901f\u53d8\u73b0\u7684\u5b66\u5458\u6df7\u4e3a\u4e00\u8c08\uff0c\u7528\u201c\u63a5\u5355\u6848\u4f8b\u201d\u8fc7\u5ea6\u523a\u6fc0\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u63a8\u4ecb**\u9ad8\u9636\u539f\u7406\u8bfe\u3001\u5927\u5e08\u5de5\u4f5c\u574a**\u7b49\u6df1\u5ea6\u5185\u5bb9\uff0c\u4e25\u7981\u7528\u201c\u4fdd\u5e95\u6536\u5165\u201d\u4f5c\u4e3a\u5347\u5355\u8bdd\u672f\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u753b\u672c\u2192\u5ba1\u542c\u2192\u5bf9\u8f68+\u5e72\u97f3\u5904\u7406\u2192\u540e\u671f\u5236\u4f5c(\u7b80\u914d/\u4e2d\u914d/\u7cbe\u914d)\u3002\u90fd\u60f3\u5b66\uff0c\u8bf4\u662f\u8981\u5907\u6848\u201d\n2. > \u201c\u6211\u6bcf\u6b21\u505a\u4ec0\u4e48\u4e8b\u4e00\u5b9a\u8981\u7b49\u5230\u6709\u5145\u8db3\u65f6\u95f4\u6bb5\u7684\u65f6\u5019\u518d\u505a\uff0c\u5176\u5b9e\u6ca1\u6709\u4ec0\u4e48\u6700\u597d\u7684\u5f00\u59cb\uff0c\u5f53\u4e0b\u5c31\u662f\u6700\u597d\u7684\u5f00\u59cb\u201d\n3. > \u201c\u5e08\u59d0\uff0c\u6211\u89c9\u5f97\u753b\u672c\u6709\u4e3b\u89c2\u8272\u5f69\uff0c\u5176\u4ed6\u7684\u90fd\u6709\u6807\u51c6\u7b54\u6848\u3002\u4f46\u662f\u753b\u672c\u662f\u9760\u81ea\u5df1\u7684\u7406\u89e3\u6765\u624b\u52a8\u6dfb\u52a0\uff0c\u600e\u4e48\u77e5\u9053\u5bf9\u4e0d\u5bf9\u5462\uff0c\u4e00\u4e2a\u7248\u6743\u9700\u8981\u4e00\u4e2a\u5267\u7ec420-30\u4eba\uff0c\u662f\u9700\u8981\u81ea\u5df1\u53bb\u7edf\u7b79\u5417\uff1f\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T3 \u6b7b\u78d5\u5b66\u9738\u578b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u9886\u57df\u7684\u5c0a\u91cd\u4e0e\u8ba4\u53ef\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6301\u7eed\u3001\u5177\u4f53\u3001\u6709\u6df1\u5ea6\u7684\u4e13\u4e1a\u53cd\u9988\u4e0e\u6210\u957f\u89c1\u8bc1\uff0c\u6ee1\u8db3\u5176\u201c\u88ab\u4e13\u4e1a\u8ba4\u53ef\u201d\u7684\u9700\u6c42\u3011**\u3002\n\n```json\n{\"core_type\": \"T3 \u6b7b\u78d5\u5b66\u9738\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd\u5f52\u5c5e\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\"}\n```";
