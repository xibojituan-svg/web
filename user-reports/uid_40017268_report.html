        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 40017268 / \u6635\u79f0\uff1a\u65e0\u4eba\u53ef\u6321 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u79cb\u7c73\u679c(\u767d\u82b3) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u672a\u77e5 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u672a\u77e5 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u672a\u77e5 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u672a\u77e5 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad\u3002\u7528\u6237\u4ec5\u5b8c\u6210\u57fa\u7840\u4fe1\u606f\u56de\u590d\uff0c\u672a\u8868\u8fbe\u4efb\u4f55\u5b66\u4e60\u6216\u53d8\u73b0\u610f\u56fe\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> *\u65e0\u6709\u6548\u4fe1\u53f7*\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u672a\u77e5] \u2014 \u65e0\u4fe1\u606f\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u672a\u77e5] \u2014 \u65e0\u4fe1\u606f\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u672a\u77e5] \u2014 \u65e0\u4fe1\u606f\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad\u3002\u7528\u6237\u4ec5\u8fdb\u884c\u673a\u68b0\u5f0f\u56de\u590d\uff0c\u672a\u66b4\u9732\u4efb\u4f55\u60c5\u7eea\u53cd\u5e94\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> *\u65e0\u6709\u6548\u4fe1\u53f7*\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**[\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5b9a\u4f4d]**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u65e0\u6709\u6548\u5bf9\u8bdd\uff0c\u65e0\u6cd5\u5206\u6790\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a\u65e0\u6cd5\u5224\u65ad\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\u5f85\u89c2\u5bdf\uff08\u6682\u5b9aC2\uff09** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **\u5f85\u89c2\u5bdf\u7528\u6237\uff087\u5929\u590d\u67e5\u578b\uff09** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a[\u65e0]\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u672a\u77e5 | \u4fe1\u606f\u4e0d\u8db3 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u672a\u77e5 | \u4fe1\u606f\u4e0d\u8db3 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u672a\u77e5 | \u4fe1\u606f\u4e0d\u8db3 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u672a\u77e5 | \u4fe1\u606f\u4e0d\u8db3 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u672a\u77e5\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u7531\u4e8e\u4fe1\u606f\u4e25\u91cd\u4e0d\u8db3\uff0c\u5efa\u8bae\u91c7\u7528**\u6807\u51c6\u3001\u4e2d\u6027\u3001\u4f4e\u538b\u529b**\u7684\u5f00\u573a\u767d\u8fdb\u884c\u8bd5\u63a2\u6027\u63a5\u89e6\uff0c\u4f8b\u5982\uff1a\u201c\u65e0\u4eba\u53ef\u6321\u540c\u5b66\u4f60\u597d\uff0c\u6211\u662f\u4f60\u7684\u73ed\u4e3b\u4efbXX\u3002\u770b\u5230\u4f60\u5df2\u7ecf\u8fdb\u7fa4\u4e86\uff0c\u6709\u4efb\u4f55\u4e0d\u6e05\u695a\u7684\u5730\u65b9\u968f\u65f6\u95ee\u6211\u54c8\u3002\u54b1\u4eec\u5148\u8f7b\u677e\u4f53\u9a8c\uff0c\u611f\u53d7\u4e00\u4e0b\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u6807\u51c6\u4f53\u9a8c\u7ebf\u3011** (\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5b9a\u5411)\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u6682\u4e0d\u9644\u52a0\u4efb\u4f55\u7279\u6b8a\u6a21\u5757\uff0c\u4ec5\u63d0\u4f9b\u6807\u51c6A\u6a21\u5757\uff08\u57fa\u7840\u8bfe\u7a0b\uff09\u670d\u52a1\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5728\u7528\u6237\u672a\u4e3b\u52a8\u8868\u8fbe\u524d\uff0c\u8fdb\u884c\u4efb\u4f55\u9ad8\u538b\u63a8\u9500\u6216\u8fc7\u5ea6\u60c5\u611f\u5173\u6000\uff0c\u907f\u514d\u5f15\u53d1\u53cd\u611f\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u57287\u5929\u89c2\u5bdf\u671f\u5185\uff0c\u7981\u6b62\u4efb\u4f55\u5f62\u5f0f\u7684\u8bfe\u7a0b\u63a8\u9500\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > *\u4fe1\u606f\u4e25\u91cd\u4e0d\u8db3\uff0c\u65e0\u6709\u6548\u5bf9\u8bdd\u5185\u5bb9\u3002*\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010\u5f85\u89c2\u5bdf\u7528\u6237\u3011**\uff0c\u804a\u5929\u8bb0\u5f55\u8fc7\u5c11\uff0c**\u4fe1\u606f\u4e25\u91cd\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u6781\u4f4e**\u3002\u5f53\u524d\u65e0\u6cd5\u5224\u65ad\u5176\u5185\u5fc3\u6e34\u6c42\u4e0e\u9000\u5355\u51e0\u7387\u3002\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u6807\u51c6\u670d\u52a1\uff0c\u9759\u9ed8\u89c2\u5bdf7\u5929\uff0c\u7b49\u5f85\u66f4\u591a\u884c\u4e3a\u4fe1\u53f7\u540e\u518d\u91cd\u65b0\u5224\u5b9a\u3011**\u3002\n\n---\n\n```json\n{\"core_type\": \"\u5f85\u89c2\u5bdf\u7528\u6237\uff087\u5929\u590d\u67e5\u578b\uff09\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u672a\u77e5\", \"target_product_line\": \"\u6807\u51c6\u4f53\u9a8c\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u6cb3\u5317\"}\n```";
