    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677156866 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u62db\u52df\u5b98\u9999\u8549/\u5b66\u751f\u52ff\u52a0(\u5b5f\u7965\u5a07) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u5e08\u57f9\u8bad\uff08\u4ef7\u683c\u672a\u77e5\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3** |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u81ea\u7531\u804c\u4e1a\uff0c\u65f6\u95f4\u53ef\u80fd\u5bbd\u88d5\uff0c\u4f46\u5177\u4f53\u4f5c\u606f\u672a\u77e5\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3** |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\uff08\u6709\u4e92\u52a8\uff0c\u4f46\u5173\u952e\u51b3\u7b56\u4fe1\u606f\u7f3a\u5931\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u526f\u4e1a\u53d8\u73b0\u9a71\u52a8\u660e\u786e\uff0c\u5bf9\u53d8\u73b0\u8def\u5f84\uff08\u63a5\u5355\u3001\u8bd5\u97f3\uff09\u8868\u73b0\u51fa\u6301\u7eed\u3001\u52a1\u5b9e\u7684\u5173\u6ce8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6765\u8fd9\u91cc\u76ee\u7684\u662f\u7eaf\u5174\u8da3\u8fd8\u662f\u526f\u4e1a\u5462\uff1f\u526f\u4e1a\u201d > \u201c\u8001\u5e08\u4e0d\u662f\u8bf4\u6211\u4eec\u6709\u8d44\u6e90\u53ef\u4ee5\u63a5\u5355\u5417\uff1f\u54e6\uff0c\u5c31\u63a5\u5355\u662f\u600e\u4e48\u63a5\u7684\uff1f\u90a3\u6211\u4eec\u4eca\u5929\u5f55\u7684\u90a3\u4e9b\u4e1c\u897f\u7b97\u4e0d\u7b97\u662f\u8bd5\u97f3\uff1f\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u652f\u4ed8\u80fd\u529b\u6216\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u81ea\u7531\u804c\u4e1a\uff0c\u65f6\u95f4\u76f8\u5bf9\u81ea\u7531\uff0c\u80fd\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u548c\u53c2\u4e0e\u76f4\u64ad\u3002\u4f46\u5b58\u5728**\u8f7b\u5ea6\u6570\u5b57\u64cd\u4f5c\u969c\u788d**\uff08\u8fdb\u4e0d\u53bb\u76f4\u64ad\u95f4\u94fe\u63a5\uff09\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u8fdb\u4e0d\u53bb\u76f4\u64ad\uff09\u65f6\uff0c\u76f4\u63a5\u3001\u7b80\u6d01\u5730\u53cd\u9988\u5e76\u5bfb\u6c42\u5e2e\u52a9\uff0c\u65e0\u60c5\u7eea\u5316\u62b1\u6028\u6216\u81ea\u6211\u5426\u5b9a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u548b\u8fdb\u4e0d\u53bb\u554a\u201d > \u201c\u8fdb\u4e0d\u53bb\u201d > \u201c\u8001\u5e08\u6211\u4eec\u4eca\u5929\u5f55\u7684\u90a3\u4e2a\u6709\u58f0\u4e66\u6709\u6ca1\u6709\u8bc4\u4ef7\u6216\u6253\u5206\u5462\uff1f\u201d\uff08\u76f4\u63a5\u8ffd\u95ee\u7ed3\u679c\uff0c\u65e0\u8d1f\u9762\u60c5\u7eea\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42\uff08\u7126\u8651\u4fdd\u969c\uff09**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u526f\u4e1a\u53d8\u73b0\u8def\u5f84\u7684\u786e\u5b9a\u6027\u9700\u6c42**\u3002\u5979\u53cd\u590d\u8ffd\u95ee\u201c\u63a5\u5355\u600e\u4e48\u63a5\u201d\u3001\u201c\u7b97\u4e0d\u7b97\u8bd5\u97f3\u201d\u3001\u201c\u4ec0\u4e48\u65f6\u5019\u5ba1\u6838\u201d\uff0c\u6838\u5fc3\u7126\u8651\u5728\u4e8e\u6295\u5165\u65f6\u95f4\u540e\u80fd\u5426\u83b7\u5f97\u660e\u786e\u3001\u53ef\u9884\u671f\u7684\u7ecf\u6d4e\u56de\u62a5\uff0c\u4ee5\u589e\u52a0\u751f\u6d3b\u4fdd\u969c\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u8def\u5f84\u6e05\u6670\u7684\u201c\u786e\u5b9a\u6027\u201d\u4e0e\u201c\u638c\u63a7\u611f\u201d**\u3002\u63d0\u4f9b\u660e\u786e\u7684\u63a5\u5355\u6d41\u7a0b\u3001\u6e05\u6670\u7684\u5ba1\u6838\u6807\u51c6\u3001\u53ef\u91cf\u5316\u7684\u8fdb\u6b65\u53cd\u9988\uff0c\u8ba9\u5979\u611f\u89c9\u6bcf\u4e00\u6b65\u90fd\u8d70\u5728\u901a\u5f80\u53d8\u73b0\u7684\u8e0f\u5b9e\u9053\u8def\u4e0a\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b**\uff08\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b\uff09 |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b**\uff08\u52a8\u673a\u660e\u786e\u3001\u884c\u52a8\u52a1\u5b9e\u3001\u60c5\u7eea\u7a33\u5b9a\u3001\u6709\u5b66\u4e60\u97e7\u6027\uff09 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u81ea\u7531\u804c\u4e1a\u8005\u901a\u5e38\u81ea\u4e3b\u6743\u8f83\u9ad8\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u5173\u952e\u98ce\u9669\u70b9**\uff1a\u5b58\u5728\u8f7b\u5ea6\u6570\u5b57\u64cd\u4f5c\u969c\u788d\uff08\u8fdb\u4e0d\u53bb\u76f4\u64ad\u95f4\uff09\u3002\u82e5\u540e\u7eed\u8bfe\u7a0b\u4ea4\u4ed8\u6d89\u53ca\u66f4\u590d\u6742\u7684\u8f6f\u4ef6\u64cd\u4f5c\uff08\u5982AU\uff09\uff0c\u53ef\u80fd\u56e0\u6280\u672f\u95e8\u69db\u4ea7\u751f\u632b\u8d25\u611f\uff0c\u5bfc\u81f4\u201c\u5b66\u4e0d\u4f1a\u201d\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u4e8b\u76f4\u63a5\u6c42\u89e3\uff0c\u4e0d\u6613\u60c5\u7eea\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | **\u6838\u5fc3\u98ce\u9669\u70b9**\uff1a\u4f5c\u4e3a\u660e\u786e\u7684\u201c\u641e\u94b1\u7ed3\u679c\u8bba\u201d\u503e\u5411\u8005\uff0c\u82e5\u5728\u627f\u8bfa\u5468\u671f\u5185\uff08\u59822-3\u4e2a\u6708\uff09\u672a\u80fd\u63a5\u5230\u7b2c\u4e00\u5355\uff0c\u6216\u63a5\u5355\u6536\u5165\u8fdc\u4f4e\u4e8e\u9884\u671f\uff0c\u6781\u6613\u4ea7\u751f\u201c\u88ab\u9a97\u201d\u611f\uff0c\u89e6\u53d1\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c60-90\u5929\uff08\u7b2c\u4e00\u5355\u9884\u671f\u5151\u73b0\u671f\uff09**\u3002\u82e5\u6b64\u65f6\u63a5\u5355\u65e0\u679c\uff0c\u9000\u8d39\u98ce\u9669\u6025\u5267\u5347\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u59d0\uff0c\u770b\u5230\u60a8\u81ea\u7531\u804c\u4e1a\uff0c\u65f6\u95f4\u80fd\u81ea\u5df1\u5b89\u6392\uff0c\u8fd9\u5b66\u8d77\u6765\u5c31\u4ece\u5bb9\u591a\u4e86\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u6700\u5b9e\u5728\u7684\u5c31\u662f\u2018\u5b66\u5b8c\u5c31\u80fd\u7528\u2019\uff0c\u6211\u4f1a\u628a\u6bcf\u4e00\u6b65\u600e\u4e48\u63a5\u5355\u3001\u4ec0\u4e48\u6807\u51c6\u80fd\u8fc7\uff0c\u90fd\u7ed9\u60a8\u634b\u5f97\u660e\u660e\u767d\u767d\u3002\u60a8\u5c31\u8e0f\u8e0f\u5b9e\u5b9e\u8ddf\u7740\u7ec3\uff0c\u6709\u4e0d\u6e05\u695a\u7684\u64cd\u4f5c\u968f\u65f6\u558a\u6211\uff0c\u6211\u5e2e\u60a8\u5f04\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\uff08\u4ea7\u54c1\u7ebfA\uff09\u3002\u5339\u914d\u5176\u526f\u4e1a\u53d8\u73b0\u7684\u660e\u786e\u76ee\u6807\uff0c\u63d0\u4f9b\u7cfb\u7edf\u3001\u4e25\u8083\u7684\u6280\u80fd\u57f9\u8bad\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176**\u8f7b\u5ea6\u6570\u5b57\u64cd\u4f5c\u969c\u788d**\uff0c\u521d\u671f\u9700\u8865\u5145**\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u4e2d\u7684\u201c\u6309\u952e\u7ea7\u6307\u5bfc\u201d\uff08\u7279\u79cdA\u6a21\u5757\uff09\uff0c\u786e\u4fdd\u5979\u80fd\u987a\u5229\u8fdb\u5165\u5b66\u4e60\u73af\u5883\uff0c\u8de8\u8d8a\u7b2c\u4e00\u9053\u6570\u5b57\u9e3f\u6c9f\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a**\u753b\u4e0d\u5207\u5b9e\u9645\u7684\u201c\u66b4\u5bcc\u201d\u5927\u997c**\u3002\u5fc5\u987b\u505a\u9006\u5411\u9884\u671f\u7ba1\u7406\uff0c\u660e\u786e\u544a\u77e5\u6280\u80fd\u79ef\u7d2f\u548c\u63a5\u5355\u9700\u8981\u65f6\u95f4\uff08\u5e73\u57472-3\u4e2a\u6708\uff09\uff0c\u7528\u771f\u5b9e\u6848\u4f8b\u548c\u6e05\u6670\u8def\u5f84\u5efa\u7acb\u4fe1\u4efb\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u5fc5\u987b\u5728\u6280\u80fd\u8fbe\u6807\u3001\u63a5\u5230\u7b2c\u4e00\u5355\u540e\u8fdb\u884c**\u3002\u524d\u671f\u805a\u7126\u57fa\u7840\u6280\u80fd\u4ea4\u4ed8\uff0c\u7528\u7ed3\u679c\u5efa\u7acb\u4fe1\u4efb\u540e\uff0c\u518d\u63a8\u8350\u9ad8\u9636\u8bbe\u5907\u6216\u8bfe\u7a0b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6765\u8fd9\u91cc\u76ee\u7684\u662f\u7eaf\u5174\u8da3\u8fd8\u662f\u526f\u4e1a\u5462\uff1f\u526f\u4e1a\u201d\n2. > \u201c\u8001\u5e08\u4e0d\u662f\u8bf4\u6211\u4eec\u6709\u8d44\u6e90\u53ef\u4ee5\u63a5\u5355\u5417\uff1f\u54e6\uff0c\u5c31\u63a5\u5355\u662f\u600e\u4e48\u63a5\u7684\uff1f\u90a3\u6211\u4eec\u4eca\u5929\u5f55\u7684\u90a3\u4e9b\u4e1c\u897f\u7b97\u4e0d\u7b97\u662f\u8bd5\u97f3\uff1f\u201d\n3. > \u201c\u65c1\u767d\u7ec3\u4e60\u8001\u5e08\u5c31\u662f\u6211\u4eec\u4eca\u5929\u5f55\u7684\u90a3\u4e2a\u65c1\u767d\u7ec3\u4e60\uff0c\u5c31\u4ec0\u4e48\u65f6\u5019\u54e6\u80fd\u7ed9\u90a3\u4e2a\u7ed9\u51fa\u90a3\u4e2a\u5ba1\u6838\u5440\uff1f\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u9700\u6c42\uff1a\u83b7\u5f97\u4e00\u4efd\u6709\u786e\u5b9a\u6027\u7684\u526f\u4e1a\u6536\u5165\u4fdd\u969c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u9884\u671f\u7684\u63a5\u5355\u8def\u5f84\uff0c\u5e76\u8f85\u52a9\u5176\u8de8\u8d8a\u521d\u671f\u6570\u5b57\u64cd\u4f5c\u969c\u788d\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\"}\n```";
