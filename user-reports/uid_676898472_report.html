    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v3.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676898472 (\u897f\u57df\u53f8\u5f92-\u65b0\u7586\u4f0a\u7281-\u7537\u64ad) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-02-28 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u963f\u4e50\u73ed\u73ed(Nick\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u6f14\u64ad\u8bfe\u7a0b (\u5df2\u8d2d) + \u540e\u671f\u8bfe\u7a0b (\u610f\u5411) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u5168\u6b3e\u5145\u88d5** (\u53ef\u8f7b\u677e\u652f\u4ed83980\u5143\u8bbe\u5907\u53ca\u540e\u7eed\u8bfe\u7a0b\uff0c\u8c03\u4f83\u201c\u4e00\u7bb1\u5b50\u4f0a\u7281\u738b\u7684\u9152\u94b1\u4e48\u6709\u4e86\u201d) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u7279\u6b8a\u5012\u73ed/\u788e\u7247\u5316\u62fc\u51d1** (\u516c\u52a1\u5458\uff0c\u7ecf\u5386\u5c01\u95ed\u5f0f\u57f9\u8bad\uff0c\u4f46\u80fd\u5229\u7528\u665a\u4e0a\u548c\u788e\u7247\u65f6\u95f4\u5b8c\u6210\u4f5c\u4e1a\u3001\u4e92\u52a8) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u5355\u8eab\u72ec\u7acb** (\u804a\u5929\u4e2d\u65e0\u4efb\u4f55\u5bb6\u5ead\u51b3\u7b56\u76f8\u5173\u4fe1\u53f7\uff0c\u884c\u52a8\u81ea\u4e3b\uff0c\u7ecf\u6d4e\u72ec\u7acb) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** (\u804c\u4e1a\u3001\u5730\u57df\u3001\u751f\u6d3b\u72b6\u6001\u3001\u5b66\u4e60\u8fdb\u5ea6\u3001\u793e\u4ea4\u4e92\u52a8\u5747\u6709\u5145\u5206\u5c55\u73b0) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u2b06\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u5173\u6ce8\u4e13\u4e1a\u7cbe\u8fdb\u4e0e\u793e\u7fa4\u4e92\u52a8\uff0c\u5bf9\u53d8\u73b0\u65e0\u6025\u5207\u8981\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6240\u6709\u9636\u6bb5\u90fd\u5f97\u653e\u5e73\u5fc3\u6001\uff0c\u521a\u8001\u5e08\u8bf4\u4ece\u827a\u672f\u4e2d\u627e\u4e0d\u5230\u7684\u7b54\u6848\uff0c\u53bb\u751f\u6d3b\u4e2d\u627e\uff0c\u6211\u89c9\u5f97\u633a\u6709\u611f\u89c9\u7684\u3002\u6700\u7ec8\u8fd8\u5f97\u653e\u5e73\u5fc3\u6001\u56de\u5f52\u751f\u6d3b\u3002\u201d (\u8ffd\u6c42\u827a\u672f\u4e0e\u751f\u6d3b\u7684\u611f\u609f)\n  > \u201c\u65e9\u5c31\u60f3\u4f53\u9a8c\u4e00\u4e0b\u9ad8\u7ea7\u88c5\u5907\u4e86\uff0c\u4ee5\u524d\u90fd\u662f\u88f8\u88c5\u201d (\u5bf9\u4e13\u4e1a\u8bbe\u5907\u6709\u8ffd\u6c42\uff0c\u5174\u8da3\u9a71\u52a8)\n  > \u79ef\u6781\u53c2\u4e0e\u4f5c\u4e1a\u3001\u70b9\u8bc4\u3001\u793e\u7fa4\u8ba8\u8bba\uff0c\u5173\u6ce8\u201c\u4e2d\u4e66\u201d\u4f46\u5fc3\u6001\u5e73\u548c\uff0c\u606d\u559c\u4ed6\u4eba\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b06\u9ad8**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u9ad8** \u2014 \u516c\u52a1\u5458\u804c\u4e1a\uff0c\u7ecf\u6d4e\u7a33\u5b9a\u3002\u80fd\u8f7b\u677e\u652f\u4ed83980\u5143\u8bbe\u5907\u53ca\u8003\u8651\u62a5\u540e\u671f\u8bfe\u7a0b\uff0c\u652f\u4ed8\u65e0\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u804c\u4e1a\u4e3a\u516c\u52a1\u5458\uff0c\u65f6\u95f4\u89c4\u5f8b\u3002\u4f46\u671f\u95f4\u7ecf\u5386\u201c\u5c01\u95ed\u5f0f\u57f9\u8bad\u4e00\u4e2a\u534a\u6708\u201d\uff0c\u5bfc\u81f4\u201c\u76f4\u64ad\u8bfe\u90fd\u770b\u4e0d\u4e0a\u4e86\uff0c\u53ea\u80fd\u62bd\u7a7a\u770b\u56de\u653e\u201d\uff0c\u5e76\u7528\u201c\u515a\u6821\u7834\u7535\u8111\u201d\u8d76\u4f5c\u4e1a\u3002**\u65f6\u95f4\u53d7\u9636\u6bb5\u6027\u5de5\u4f5c\u5f71\u54cd\uff0c\u4f46\u5177\u5907\u5f3a\u5927\u7684\u534f\u8c03\u548c\u6267\u884c\u529b**\uff0c\u80fd\u514b\u670d\u56f0\u96be\u5b8c\u6210\u5b66\u4e60\u4efb\u52a1\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u9ad8** \u2014 \u804a\u5929\u4e2d\u65e0\u4efb\u4f55\u5bb6\u5ead\u963b\u529b\u4fe1\u53f7\uff0c\u884c\u52a8\u5b8c\u5168\u81ea\u4e3b\uff0c\u53ef\u63a8\u65ad\u4e3a\u5355\u8eab\u6216\u5bb6\u5ead\u652f\u6301\u5ea6\u9ad8\u3002\n- **\u5e95\u5ea7\u53d6\u77ed\u677f**\uff1a\u65f6\u95f4\u7ef4\u5ea6\u4e3a\u201c\u4e2d\u201d\uff0c\u4f46\u7528\u6237\u5c55\u73b0\u4e86\u6781\u5f3a\u7684\u9002\u5e94\u6027\u548c\u6267\u884c\u529b\uff0c\u7efc\u5408\u8bc4\u4f30\u4e3a**\u9ad8**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u8bbe\u5907\u672a\u5230\u3001\u57f9\u8bad\u51b2\u7a81\u3001\u5730\u57df\u7269\u6d41\u6162\u7b49\u56f0\u96be\uff0c\u6001\u5ea6\u79ef\u6781\u5e7d\u9ed8\uff0c\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff08\u5982\u7528\u624b\u673a\u5f55\u3001\u770b\u56de\u653e\uff09\uff0c\u65e0\u4efb\u4f55\u62b1\u6028\u6216\u60c5\u7eea\u5d29\u6e83\u8ff9\u8c61\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u7528\u515a\u6821\u7834\u7535\u8111\u628a\u4f5c\u4e1a\u505a\u5b8c\u4e86\uff0c\u592a\u96be\u4e86[\u6342\u8138]\u201d (\u4ee5\u5e7d\u9ed8\u5316\u89e3\u56f0\u96be)\n  > \u201c\u6211\u4e0b\u5468\u5c01\u95ed\u5f0f\u57f9\u8bad\u4e00\u4e2a\u534a\u6708\uff0c\u611f\u89c9\u662f\u8d76\u4e0d\u4e0a\u8d9f\u4e86[\u6342\u8138]\u201d (\u9648\u8ff0\u4e8b\u5b9e\uff0c\u65e0\u7126\u8651)\n  > \u201c\u706b\u8f66\u4e0a\u4fe1\u53f7\u592a\u5dee\uff0c\u94fe\u63a5\u90fd\u6253\u4e0d\u5f00\uff0c\u6211\u7b49\u5230\u4e2a\u5927\u7ad9\u518d\u4e0b\u5355\u201d (\u9047\u5230\u95ee\u9898\uff0c\u4e3b\u52a8\u5bfb\u627e\u89e3\u51b3\u529e\u6cd5)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42** + **\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u4e13\u4e1a\u80fd\u529b\u8ba4\u53ef\u4e0e\u793e\u7fa4\u5f52\u5c5e\u611f\u7684\u53cc\u91cd\u6e34\u671b**\u3002\u4ed6\u79ef\u6781\u53c2\u4e0e\u793e\u7fa4\u4e92\u52a8\uff08\u70b9\u8bc4\u540c\u5b66\u3001\u5f00\u73a9\u7b11\u3001\u7ec4\u7ec7\u201c\u5435\u67b6\u201d\u7ec3\u4e60\uff09\uff0c\u5e76\u5c55\u73b0\u51fa\u5bf9\u4e13\u4e1a\u7cbe\u8fdb\u7684\u8ffd\u6c42\uff08\u8d2d\u4e70\u9ad8\u7ea7\u8bbe\u5907\u3001\u5173\u6ce8\u4f5c\u4e1a\u53cd\u9988\uff09\u3002\u5176\u516c\u52a1\u5458\u8eab\u4efd\u53ef\u80fd\u9690\u542b\u5bf9\u4f53\u5236\u5916\u4e2a\u4eba\u6210\u5c31\u548c\u72ec\u7279\u4ef7\u503c\u8bc1\u660e\u7684\u6f5c\u5728\u9700\u6c42\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u6df1\u5ea6\u8ba4\u53ef\u4e0e\u793e\u7fa4\u4e2d\u7684\u6838\u5fc3\u6210\u5458\u8eab\u4efd**\u3002\u4ed6\u9700\u8981\u88ab\u770b\u89c1\u201c\u4e0d\u4ec5\u662f\u4e00\u4e2a\u516c\u52a1\u5458\uff0c\u66f4\u662f\u4e00\u4e2a\u6709\u624d\u534e\u7684\u6f14\u64ad\u8005\u201d\uff0c\u5e76\u5728\u5b66\u4e60\u793e\u7fa4\u4e2d\u83b7\u5f97\u5c0a\u91cd\u548c\u5f71\u54cd\u529b\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\u2b50A \u7c7b (\u4ef7\u503c\u5171\u521b\u578b)** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u517c\u987e **T1 \u5708\u517b\u9886\u8896\u578b** \u6f5c\u8d28) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u6781\u4f4e** | \u5bb6\u5ead\u652f\u6301\u5ea6\u9ad8\uff0c\u7ecf\u6d4e\u72ec\u7acb\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5f3a\uff0c\u80fd\u514b\u670d\u9636\u6bb5\u6027\u56f0\u96be\uff08\u5982\u5c01\u95ed\u57f9\u8bad\uff09\u3002\u98ce\u9669\u70b9\u5728\u4e8e\u957f\u671f\u9ad8\u5f3a\u5ea6\u516c\u52a1\u53ef\u80fd\u6324\u538b\u5b66\u4e60\u65f6\u95f4\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u6781\u9ad8\uff0c\u5e7d\u9ed8\u5316\u89e3\u56f0\u96be\uff0c\u81ea\u6211\u9a71\u52a8\u5f3a\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4f4e** | \u52a8\u673a\u7eaf\u5ea6\u9ad8\uff0c\u4e3a\u5174\u8da3\u548c\u80fd\u529b\u800c\u6765\uff0c\u5bf9\u77ed\u671f\u53d8\u73b0\u65e0\u5f3a\u8bc9\u6c42\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u65e0\u660e\u663e\u5371\u9669\u65f6\u95f4\u7a97**\u3002\u6f5c\u5728\u98ce\u9669\u5728\u4e8e\u82e5\u8bfe\u7a0b\u540e\u671f\u5185\u5bb9\u6df1\u5ea6\u6216\u793e\u7fa4\u6d3b\u8dc3\u5ea6\u65e0\u6cd5\u5339\u914d\u5176\u6210\u957f\u901f\u5ea6\u548c\u793e\u4ea4\u9700\u6c42\uff0c\u53ef\u80fd\u4ea7\u751f\u201c\u4ef7\u503c\u611f\u843d\u5dee\u201d\uff0c\u4f46\u4e0d\u4f1a\u4ee5\u6fc0\u70c8\u9000\u8d39\u5f62\u5f0f\u8868\u73b0\uff0c\u66f4\u53ef\u80fd\u662f\u6c89\u9ed8\u6d41\u5931\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u53f8\u5f92\u540c\u5b66\uff0c\u770b\u4f60\u5728\u7fa4\u91cc\u7279\u522b\u6d3b\u8dc3\uff0c\u70b9\u8bc4\u4e5f\u5f88\u6709\u89c1\u5730\uff0c\u662f\u54b1\u4eec\u73ed\u7684\u5b9d\u85cf\u5b66\u5458\u3002\u4f60\u516c\u52a1\u5458\u7684\u5de5\u4f5c\u80cc\u666f\u80fd\u5e26\u6765\u4e0d\u4e00\u6837\u7684\u89c6\u89d2\uff0c\u4ee5\u540e\u73ed\u91cc\u7684\u6d3b\u52a8\u548c\u8ba8\u8bba\uff0c\u7279\u522b\u9700\u8981\u4f60\u8fd9\u6837\u7684\u2018\u5b9e\u5e72\u6d3e\u2019\u591a\u5e26\u5e26\u8282\u594f\u3002\u6709\u4efb\u4f55\u4e13\u4e1a\u4e0a\u7684\u60f3\u6cd5\uff0c\u968f\u65f6\u627e\u6211\u804a\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011+\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf**\u3011\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176T2\u5b9e\u5e72+T1\u9886\u8896\u6f5c\u8d28\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a\u3010**\u73ed\u59d4/\u5c0f\u7ec4\u957f\u8eab\u4efd**\u3011\u3001\u3010**\u9ad8\u9636\u6280\u5de7\u52a0\u9910\u5305**\u3011\u3001\u3010**\u5185\u90e8\u5ba1\u542c/\u70b9\u8bc4\u5458\u4f53\u9a8c\u673a\u4f1a**\u3011\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u5bf9\u5f85\u5c0f\u767d\u6216\u7126\u8651\u5b66\u5458\u7684\u201c\u54c4\u5c0f\u5b69\u201d\u8bdd\u672f\u4e0e\u4ed6\u6c9f\u901a\uff1b\u5ffd\u89c6\u4ed6\u7684\u4e13\u4e1a\u5efa\u8bae\u548c\u793e\u7fa4\u8d21\u732e\uff1b\u53ea\u63a8\u53d8\u73b0\u8bdd\u672f\u800c\u5ffd\u89c6\u5176\u7cbe\u795e\u8ffd\u6c42\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u63a8\u4ecb**\u9ad8\u9636\u8bfe\u7a0b\u6216\u5708\u5c42\u670d\u52a1**\uff0c\u4f46\u9700\u57fa\u4e8e\u5176\u660e\u786e\u7684\u4e13\u4e1a\u8fdb\u9636\u9700\u6c42\uff0c\u800c\u975e\u5355\u7eaf\u9500\u552e\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6240\u6709\u9636\u6bb5\u90fd\u5f97\u653e\u5e73\u5fc3\u6001\uff0c\u521a\u8001\u5e08\u8bf4\u4ece\u827a\u672f\u4e2d\u627e\u4e0d\u5230\u7684\u7b54\u6848\uff0c\u53bb\u751f\u6d3b\u4e2d\u627e\uff0c\u6211\u89c9\u5f97\u633a\u6709\u611f\u89c9\u7684\u3002\u6700\u7ec8\u8fd8\u5f97\u653e\u5e73\u5fc3\u6001\u56de\u5f52\u751f\u6d3b\u3002\u201d **(\u9ad8\u52a8\u673a\u7eaf\u5ea6\uff0c\u8ffd\u6c42\u7cbe\u795e\u5171\u9e23)**\n2. > \u201c\u7528\u515a\u6821\u7834\u7535\u8111\u628a\u4f5c\u4e1a\u505a\u5b8c\u4e86\uff0c\u592a\u96be\u4e86[\u6342\u8138]\u201d **(\u9ad8\u5fc3\u7406\u5f39\u6027\uff0c\u5e7d\u9ed8\u5316\u89e3\u56f0\u96be)**\n3. > \u201c\u62a5\u62a5\uff0c\u4f60\u8fd9\u6c14\u6c1b\u90fd\u70d8\u6258\u5230\u8fd9\u4e86\uff0c\u4e0d\u62a5\u611f\u89c9\u5bf9\u4e0d\u8d77\u5929\u8d50\u548c\u788e\u788e[\u6342\u8138]\u201d **(\u5f3a\u793e\u4ea4\u5f52\u5c5e\u611f\u9a71\u52a8\u51b3\u7b56)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010\u4f4e\u8c03\u5b9e\u5e72\u578b\u9886\u8896\u6f5c\u8d28\u7528\u6237\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4e0e\u793e\u7fa4\u5f52\u5c5e\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u8d4b\u4e88\u5176\u793e\u7fa4\u6838\u5fc3\u89d2\u8272\u4e0e\u4e13\u4e1a\u6df1\u5ea6\u8ba4\u53ef\uff0c\u5c06\u5176\u53d1\u5c55\u4e3a\u201c\u4ef7\u503c\u5171\u521b\u5408\u4f19\u4eba\u201d\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b (\u517cT1\u6f5c\u8d28)\", \"risk_level\": \"\u6781\u4f4e\", \"refund_risk\": \"\u6781\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd\u9700\u6c42+\u793e\u4ea4\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\"}\n```";
