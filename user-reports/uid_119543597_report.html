    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u4e2d\u9ad8**\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6709\u58f0\u6f14\u64ad\uff08\u5c24\u5176\u662f\u7f51\u6587\u65b9\u5411\uff09\u7684\u660e\u786e\u5174\u8da3\uff08\u201c\u6211\u662f\u6bd4\u8f83\u60f3\u5f55\u7f51\u6587\u7684\u201d\uff09\uff0c\u5e76\u4e3b\u52a8\u5206\u4eab\u81ea\u5df1\u7684\u65b9\u8a00\u6280\u80fd\uff08\u6f6e\u6c55\u8bdd\u3001\u6e2f\u666e\u3001\u53f0\u666e\uff09\uff0c\u663e\u793a\u51fa\u5bf9\u58f0\u97f3\u6280\u80fd\u672c\u8eab\u7684\u597d\u5947\u4e0e\u63a2\u7d22\u6b32\u3002\u6709\u201c\u5e72\u4e2d\u5b66\u201d\u7684\u5b9e\u8df5\u610f\u8bc6\u3002\u4f46\u52a8\u673a\u4e2d\u53ef\u80fd\u6df7\u5408\u4e86\u5bf9\u201c\u53d8\u73b0\u201d\u3001\u201c\u63a5\u5355\u201d\u7b49\u526f\u4e1a\u6536\u76ca\u7684\u671f\u5f85\uff0c\u9700\u540e\u7eed\u89c2\u5bdf\u5176\u5b66\u4e60\u9a71\u52a8\u529b\u662f\u5174\u8da3\u4e3b\u5bfc\u8fd8\u662f\u53d8\u73b0\u4e3b\u5bfc\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u4e2d\u4f4e**\u3002\u7528\u6237\u5177\u5907\u4e00\u5b9a\u7684\u97f3\u9891\u540e\u671f\u7ecf\u9a8c\uff08\u201c\u540e\u671f\u548c\u5bf9\u8f68\u4ee5\u524d\u505a\u8fc7\u201d\uff09\uff0c\u8868\u660e\u6709\u76f8\u5173\u6280\u80fd\u57fa\u7840\u548c\u65f6\u95f4\u6295\u5165\u5386\u53f2\u3002\u4f46\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5173\u4e8e**\u7ecf\u6d4e\u72b6\u51b5\u3001\u804c\u4e1a\u3001\u53ef\u652f\u914d\u65f6\u95f4\u3001\u5bb6\u5ead\u652f\u6301**\u7b49\u5173\u952e\u8d44\u6e90\u4fe1\u606f\uff0c**\u4fe1\u606f\u4e25\u91cd\u4e0d\u8db3**\u3002\u7528\u6237\u5bf9\u9ad8\u9636\u8bfe\u7a0b\u7684\u652f\u4ed8\u884c\u4e3a\uff08\u201c\u9ad8\u9636\u201d\u3001\u201c\u662f\u8fd9\u4e2a\u5427\u201d\uff09\u8868\u660e\u5176\u5177\u5907\u4e00\u5b9a\u7684\u652f\u4ed8\u80fd\u529b\uff0c\u4f46\u8d44\u91d1\u6765\u6e90\uff08\u4e2a\u4eba\u50a8\u84c4/\u5bb6\u5ead\u652f\u6301\uff09\u4e0d\u660e\uff0c\u6784\u6210**\u5173\u952e\u98ce\u9669\u70b9**\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u4e2d\u9ad8**\u3002\u7528\u6237\u8868\u73b0\u51fa\u8f83\u9ad8\u7684**\u884c\u52a8\u529b\u4e0e\u670d\u4ece\u6027**\uff1a\u6309\u65f6\u5b8c\u6210\u65e9\u529f\u3001\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\u3001\u4e3b\u52a8\u63d0\u95ee\uff08\u201c\u6bdb\u5b81\u7684\u5fae\u4fe1\u201d\uff09\u3002\u9762\u5bf9\u8d1f\u9762\u53cd\u9988\uff08\u201c\u6c14\u606f\u5f97\u7ec3\u5440\uff0c\u592a\u6296\u4e86\u201d\u3001\u201c\u54ac\u5b57\u4e0d\u884c\u201d\uff09\u65f6\uff0c\u80fd\u63a5\u7eb3\u5e76\u4e3b\u52a8\u7ec3\u4e60\u6539\u8fdb\uff08\u201c\u4eca\u5929\u6211\u7ec3\u4e86\u201d\u3001\u201c\u6211\u5f55\u4e09\u904d\u4e86\uff0c\u6ca1\u6ee1\u610f\u201d\uff09\uff0c\u663e\u793a\u51fa\u8f83\u597d\u7684\u8010\u632b\u6027\u548c\u6210\u957f\u5fc3\u6001\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u5df2\u9009\u62e9\u9ad8\u9636\u8bfe\u7a0b\u5e76\u5b8c\u6210\u652f\u4ed8\uff08\u622a\u56fe\u786e\u8ba4\uff09\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u7f3a\u5931**\u3002\u65e0\u4efb\u4f55\u5173\u4e8e\u5bb6\u5ead\u3001\u914d\u5076\u6216\u5171\u540c\u51b3\u7b56\u8005\u7684\u8ba8\u8bba\u3002\u9274\u4e8e\u7528\u6237\u652f\u4ed8\u4e86\u9ad8\u9636\u8bfe\u7a0b\uff0c**\u5fc5\u987b\u6838\u67e5\u662f\u5426\u4e3a\u6210\u5e74\u4eba\u53ca\u652f\u4ed8\u662f\u5426\u83b7\u5f97\u5bb6\u5ead\u77e5\u60c5/\u652f\u6301**\u3002\u8fd9\u662f\u5f53\u524d\u6700\u5927\u7684\u98ce\u63a7\u76f2\u533a\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u4e0e\u627f\u8bfa**: B\u7c7b\uff08\u5174\u8da3\u63a2\u7d22\u578b\uff09\u3002\u7528\u6237\u6709\u660e\u786e\u5174\u8da3\u65b9\u5411\uff08\u7f51\u6587\uff09\uff0c\u4e14\u884c\u52a8\u914d\u5408\u5ea6\u9ad8\uff0c\u4f46\u957f\u671f\u804c\u4e1a\u5316\u52a8\u673a\u5f85\u89c2\u5bdf\u3002\n*   **\u6b65\u9aa42 - \u8d44\u6e90\u4e0e\u6761\u4ef6**: **\u65e0\u6cd5\u5224\u5b9a**\u3002\u56e0\u8d44\u6e90\u5e95\u5ea7\u4fe1\u606f\uff08\u65f6\u95f4\u3001\u7ecf\u6d4e\u3001\u73af\u5883\uff09\u4e25\u91cd\u7f3a\u5931\uff0c\u65e0\u6cd5\u5f52\u7c7b\u81f3C\u7c7b\uff08\u8d44\u6e90\u5145\u8db3\uff09\u6216D\u7c7b\uff08\u8d44\u6e90\u532e\u4e4f\uff09\u3002\n*   **\u6b65\u9aa43 - \u5f39\u6027\u4e0e\u575a\u6301**: A\u7c7b\uff08\u9ad8\u5f39\u6027\uff09\u3002\u4ece\u5f53\u524d\u4e92\u52a8\u770b\uff0c\u7528\u6237\u5b66\u4e60\u6001\u5ea6\u79ef\u6781\uff0c\u80fd\u63a5\u53d7\u53cd\u9988\u5e76\u6301\u7eed\u7ec3\u4e60\u3002\n\n**\u7efc\u5408\u5224\u5b9a**: **B/A\u578b\uff08\u5174\u8da3\u63a2\u7d22-\u9ad8\u5f39\u6027\uff09**\uff0c\u4f46**\u56e0\u5bb6\u5ead\u51b3\u7b56\u6743\u4e0e\u8d44\u6e90\u4fe1\u606f\u7f3a\u5931\uff0c\u5224\u5b9a\u7f6e\u4fe1\u5ea6\u4f4e**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u6700\u5339\u914d\u539f\u578b: T3 \u52a1\u5b9e\u63a2\u7d22\u8005**\u3002\u7528\u6237\u8868\u73b0\u51fa\u201c\u5e72\u4e2d\u5b66\u201d\u7684\u7279\u8d28\uff0c\u6709\u660e\u786e\u5174\u8da3\u70b9\uff08\u7f51\u6587\uff09\uff0c\u5e76\u57fa\u4e8e\u73b0\u6709\u6280\u80fd\uff08\u540e\u671f\uff09\u8fdb\u884c\u63a2\u7d22\uff0c\u884c\u52a8\u529b\u5f3a\u3002\n*   **\u6b21\u5339\u914d\u539f\u578b: T2 \u5174\u8da3\u9a71\u52a8\u8005**\u3002\u5bf9\u58f0\u97f3\u6f14\u7ece\u672c\u8eab\u6709\u70ed\u60c5\uff0c\u613f\u610f\u4e3a\u5174\u8da3\u6295\u5165\u7ec3\u4e60\u548c\u4ed8\u8d39\u3002\n*   **\u4e0d\u5339\u914d\u539f\u578b**: T1\uff08\u5f3a\u76ee\u6807\uff09\u3001T4\uff08\u7126\u8651\u6295\u673a\uff09\u3001T5\uff08\u8d44\u6e90\u4f9d\u8d56\uff09\u3001T6\uff08\u9ad8\u7126\u8651\u4ece\u4f17\uff09\u3001T7\uff08\u4f4e\u5f39\u6027\uff09\u3001T8\uff08\u7eaf\u53d8\u73b0\uff09\u3002\u7528\u6237\u672a\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u7126\u8651\u3001\u6295\u673a\u6216\u7eaf\u53d8\u73b0\u5fc3\u6001\uff0c\u4e5f\u672a\u663e\u793a\u51fa\u8d44\u6e90\u4f9d\u8d56\u6216\u4f4e\u5f39\u6027\u7279\u5f81\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u98ce\u9669\u7b49\u7ea7: \u4e2d**\u3002\u6838\u5fc3\u98ce\u9669\u96c6\u4e2d\u4e8e\u4fe1\u606f\u76f2\u533a\u3002\n*   **\u9010\u9879\u6392\u67e5**:\n    1.  **\u6548\u679c\u4e0d\u53ca\u9884\u671f**: \u4f4e\u3002\u7528\u6237\u6709\u6280\u80fd\u57fa\u7840\uff0c\u4e14\u5bf9\u7ec3\u4e60\u6709\u8010\u5fc3\uff0c\u9884\u671f\u7ba1\u7406\u76f8\u5bf9\u5bb9\u6613\u3002\n    2.  **\u65f6\u95f4\u51b2\u7a81**: **\u672a\u77e5\uff08\u9ad8\u98ce\u9669\uff09**\u3002\u672a\u63d0\u53ca\u804c\u4e1a\u3001\u5b66\u4e1a\u6216\u5bb6\u5ead\u65f6\u95f4\u5b89\u6392\uff0c\u662f\u6f5c\u5728\u9000\u8d39\u4e3b\u56e0\u3002\n    3.  **\u7ecf\u6d4e\u538b\u529b**: **\u672a\u77e5\uff08\u9ad8\u98ce\u9669\uff09**\u3002\u652f\u4ed8\u8d44\u91d1\u6765\u6e90\u4e0d\u660e\uff0c\u662f\u5426\u632a\u7528\u751f\u6d3b\u8d39\u3001\u501f\u8d37\u6216\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u672a\u77e5\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9**: **\u672a\u77e5\uff08\u9ad8\u98ce\u9669\uff09**\u3002**\u5bb6\u5ead\u51b3\u7b56\u6743\u5b8c\u5168\u672a\u9a8c\u8bc1\uff0c\u662f\u6700\u9ad8\u98ce\u9669\u70b9**\u3002\n    5.  **\u8bfe\u7a0b\u4e0d\u7b26**: \u4f4e\u3002\u7528\u6237\u5174\u8da3\uff08\u7f51\u6587\uff09\u4e0e\u8bfe\u7a0b\u65b9\u5411\u5339\u914d\u3002\n    6.  **\u9500\u552e\u8bef\u5bfc**: \u4f4e\u3002\u9500\u552e\u8fc7\u7a0b\u4ee5\u9f13\u52b1\u3001\u63d0\u4f9b\u4ef7\u503c\u4e3a\u4e3b\uff0c\u672a\u89c1\u8fc7\u5ea6\u627f\u8bfa\u201c\u4fdd\u5e95\u6536\u5165\u201d\u3002\n    7.  **\u5e73\u53f0\u4f53\u9a8c**: \u4f4e\u3002\u76ee\u524d\u4e92\u52a8\u987a\u7545\uff0c\u672a\u89c1\u6295\u8bc9\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5408\u89c4\u70b9**: \u9500\u552e\u4fa7\u91cd\u4e8e\u6280\u80fd\u6307\u5bfc\u3001\u5b66\u4e60\u8def\u5f84\u89c4\u5212\u548c\u4e2a\u4eba\u6210\u957f\u6545\u4e8b\uff0c\u672a\u53d1\u73b0\u660e\u663e\u5938\u5927\u6536\u76ca\u6216\u865a\u5047\u627f\u8bfa\u3002\n*   **\u98ce\u9669\u70b9**:\n    *   **\u3010\u5173\u952e\u96f7\u533a\u3011\u672a\u6210\u5e74/\u5bb6\u5ead\u51b3\u7b56\u6838\u67e5\u7f3a\u5931**: \u9500\u552e\u6635\u79f0\u542b\u201c\u672a\u6210\u5e74\u52ff\u52a0\u201d\uff0c\u4f46\u5168\u7a0b\u672a\u5bf9\u7528\u6237\u5e74\u9f84\u53ca\u652f\u4ed8\u51b3\u7b56\u72ec\u7acb\u6027\u8fdb\u884c\u4efb\u4f55\u6838\u5b9e\u3002**\u8fd9\u662f\u91cd\u5927\u5408\u89c4\u4e0e\u98ce\u63a7\u6f0f\u6d1e**\u3002\n    *   \u9500\u552e\u63d0\u53ca\u201c\u5e08\u5144\u624b\u91cc\u8fd8\u6709200\u591a\u672c\u516c\u7248\u4e66\u201d\u3001\u201c\u6211\u7684\u4e66\u7537\u4e3b\u9884\u5b9a\u4f60\u4e86\u201d\u7b49\u4e2a\u4eba\u8d44\u6e90\u627f\u8bfa\uff0c\u53ef\u80fd\u5f15\u53d1\u540e\u7eed\u5bf9\u5e73\u53f0\u670d\u52a1\u7684\u6df7\u6dc6\u6216\u671f\u5f85\u843d\u5dee\u3002\n    *   \u4f7f\u7528\u201c\u5951\u7ea6\u7cbe\u795e\u201d\u7b49\u8bdd\u672f\u65bd\u538b\uff08\u201c\u5982\u679c\u4f60\u8981\u653e\u5f03\u6ca1\u95ee\u9898\uff0c\u8bf7\u8ddf\u5e08\u5144\u8bf4\u660e\u54c8\u201d\uff09\uff0c\u867d\u5728\u50ac\u8bfe\u8bed\u5883\u4e2d\uff0c\u4f46\u9700\u6ce8\u610f\u5c3a\u5ea6\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**: **\u5339\u914d**\u3002\u7528\u6237\u5174\u8da3\uff08\u7f51\u6587\u6f14\u64ad\uff09\u4e0e\u9ad8\u9636\u8bfe\u7a0b\u5185\u5bb9\u5339\u914d\uff0c\u4e14\u6709\u540e\u671f\u57fa\u7840\uff0c\u80fd\u66f4\u597d\u9002\u5e94\u8bfe\u7a0b\u8981\u6c42\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **24h\u5185\u7d27\u6025\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\u4e0e\u652f\u4ed8\u6765\u6e90**\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**:\n    1.  **\u9996\u8981\u98ce\u63a7\u52a8\u4f5c**: \u73ed\u4e3b\u4efb\u63a5\u624b\u540e\uff0c**\u5fc5\u987b\u572824\u5c0f\u65f6\u5185\u4ee5\u6e29\u548c\u4f46\u76f4\u63a5\u7684\u65b9\u5f0f\uff0c\u6838\u5b9e\u7528\u6237\u5e74\u9f84\u3001\u804c\u4e1a\u72b6\u6001\u53ca\u672c\u6b21\u8d2d\u8bfe\u7684\u652f\u4ed8\u8d44\u91d1\u6765\u6e90\uff08\u662f\u5426\u4e2a\u4eba\u50a8\u84c4\u3001\u662f\u5426\u544a\u77e5\u5bb6\u4eba\u5e76\u83b7\u5f97\u652f\u6301\uff09**\u3002\u8fd9\u662f\u9632\u8303\u540e\u7eed\u5bb6\u5ead\u7ea0\u7eb7\u9000\u8d39\u7684\u6838\u5fc3\u3002\n    2.  **\u9884\u671f\u7ba1\u7406**: \u5728\u9996\u5468\u6c9f\u901a\u4e2d\uff0c\u5f3a\u5316\u201c\u6280\u80fd\u63d0\u5347-\u8bd5\u97f3\u673a\u4f1a-\u7ed3\u679c\u4e0d\u786e\u5b9a\u201d\u7684\u94fe\u8def\uff0c\u80af\u5b9a\u5176\u5174\u8da3\u548c\u884c\u52a8\u529b\uff0c\u4f46\u6821\u6b63\u201c\u5feb\u901f\u53d8\u73b0\u201d\u7684\u9884\u671f\u3002\u53ef\u7ed3\u5408\u5176\u201c\u540e\u671f\u201d\u7ecf\u9a8c\uff0c\u5f15\u5bfc\u5176\u5173\u6ce8\u5168\u6d41\u7a0b\u6280\u80fd\u4ef7\u503c\u3002\n    3.  **\u5b66\u4e60\u652f\u6301**: \u56e0\u5176\u4e3aT3\u52a1\u5b9e\u63a2\u7d22\u8005\uff0c\u63d0\u4f9b\u6e05\u6670\u7684\u5b66\u4e60\u8def\u5f84\u56fe\u3001\u660e\u786e\u7684\u7ec3\u4e60\u76ee\u6807\u548c\u53ca\u65f6\u7684\u53cd\u9988\u3002\u53ef\u9f13\u52b1\u5176\u5c06\u201c\u5f55\u4e09\u904d\u4e0d\u6ee1\u610f\u201d\u7684\u94bb\u7814\u7cbe\u795e\u7528\u4e8e\u5b8c\u6210\u8bfe\u7a0b\u9879\u76ee\u3002\n    4.  **\u5173\u7cfb\u5efa\u7acb**: \u7528\u6237\u5bf9\u9500\u552e\uff08\u201c\u54e5\u201d\uff09\u4fe1\u4efb\u5ea6\u8f83\u9ad8\u3002\u73ed\u4e3b\u4efb\u9700\u5e73\u7a33\u627f\u63a5\uff0c\u80af\u5b9a\u5176\u524d\u671f\u52aa\u529b\uff0c\u5efa\u7acb\u4e13\u4e1a\u3001\u53ef\u9760\u7684\u8f85\u5bfc\u5173\u7cfb\u3002\n    5.  **\u6301\u7eed\u89c2\u5bdf**: \u5bc6\u5207\u5173\u6ce8\u5176\u8fdb\u5165\u6b63\u8bfe\u540e\u7684\u65f6\u95f4\u6295\u5165\u7a33\u5b9a\u6027\uff0c\u4ee5\u53ca\u662f\u5426\u6301\u7eed\u8868\u73b0\u51fa\u5bf9\u6280\u80fd\u672c\u8eab\u7684\u5174\u8da3\u3002\n\n{\"core_type\": \"T3 \u52a1\u5b9e\u63a2\u7d22\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u5339\u914d\", \"action\": \"24h\u5185\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\u4e0e\u652f\u4ed8\u6765\u6e90\"}";
