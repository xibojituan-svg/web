    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | 677154466 (\u6635\u79f0\uff1a\u7720\u4e91\u542c\u98ce) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u4e3b\u64ad\u516d\u6708\u6668\u516e(\u9648\u5c0f\u4e91)\u3001\u53ef\u4e3d\u513f(\u5b54\u4ee4\u5a77) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u6f14\u64ad\u8bfe\u7a0b (\u4ef7\u683c\uff1a2380\u5143\uff0c4\u4e2a\u6708) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u5145\u88d5 (\u76f4\u63a5\u652f\u4ed82380\u5143\uff0c\u65e0\u5206\u671f\u6216\u501f\u6b3e\u8ff9\u8c61) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1 (\u767d\u5929\u6709\u7a7a\uff0c\u4f46\u665a\u4e0a8\u70b9\u540e\u65e0\u6cd5\u53c2\u52a0\u76f4\u64ad\uff0c\u9700\u5904\u7406\u5176\u4ed6\u4e8b\u52a1) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u5355\u8eab\u72ec\u7acb (\u804a\u5929\u4e2d\u672a\u63d0\u53ca\u5bb6\u5ead\uff0c\u51b3\u7b56\u81ea\u4e3b) |\n| **\u4fe1\u606f\u539a\u5ea6** | \u9971\u6ee1 (\u4e92\u52a8\u9891\u7e41\uff0c\u5b66\u4e60\u884c\u4e3a\u3001\u52a8\u673a\u3001\u987e\u8651\u5747\u6709\u6e05\u6670\u8868\u8fbe) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u517c\u987e\u53d8\u73b0\uff0c\u4f46\u65e0\u77ed\u671f\u66b4\u5bcc\u5e7b\u60f3\u3002\u8ba4\u53ef\u5b66\u4e60\u8fc7\u7a0b\uff0c\u5173\u6ce8\u6280\u80fd\u7ec6\u8282\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u76ee\u524d\u7684\u8bdd\u662f\u6253\u7b97\u517c\u804c\u8d5a\u4e00\u70b9\u94b1\uff0c\u5982\u679c\u4e4b\u540e\u771f\u7684\u53ef\u4ee5\u5c31\u662f\u5b8c\u5168\u652f\u6491\u8d77\u6211\u7684\u65e5\u5e38\u5f00\u9500\u7684\u8bdd\uff0c\u662f\u6709\u5f80\u5168\u804c\u65b9\u9762\u8003\u8651\u7684\u3002\u4e3b\u8981\u5c31\u662f\u7f3a\u94b1[\u6342\u8138]\u5f53\u7136\u4e86\u5c31\u662f\u55ef\u56e0\u4e3a\u8fd8\u662f\u611f\u5174\u8da3\u624d\u60f3\u5c1d\u8bd5\u8fd9\u4e2a\u884c\u4e1a\u7684\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u76f4\u63a5\u652f\u4ed82380\u5143\u8bfe\u7a0b\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\uff0c\u4f46\u201c\u7f3a\u94b1\u201d\u8868\u660e\u5bf9\u517c\u804c\u6536\u5165\u6709\u9700\u6c42\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u5b8c\u6210\u6bcf\u65e5\u4f5c\u4e1a\u548c\u76f4\u64ad\u5b66\u4e60\uff0c\u4f46\u65f6\u95f4\u5448\u788e\u7247\u5316\uff08\u201c\u4e0b\u53485\u70b9\u5de6\u53f3\u201d\u3001\u201c\u665a\u4e0a\u5fd9\u201d\u3001\u201c\u521a\u8d77\u201d\uff09\uff0c\u665a\u4e0a8\u70b9\u540e\u65e0\u6687\u53c2\u4e0e\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u9ad8** \u2014 \u672a\u63d0\u53ca\u5bb6\u5ead\u963b\u529b\uff0c\u51b3\u7b56\u81ea\u4e3b\uff0c\u652f\u6301\u5ea6\u9ed8\u8ba4\u8f83\u9ad8\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u5982\u5f55\u97f3\u3001\u8f6f\u4ef6\uff09\u4f1a\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u800c\u975e\u62b1\u6028\u6216\u653e\u5f03\u3002\u80fd\u63a5\u53d7\u53cd\u9988\u5e76\u81ea\u6211\u8c03\u4f83\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u56e0\u4e3a\u6211\u8bfb\u7740\u8bfb\u7740\u6211\u7684\u5634\u5c31\u8dd1\u504f\u4e86\uff0c\u7136\u540e\u3002\u6211\u5c31\u5f97\u4e00\u6574\u6bb5\u91cd\u6765\uff0c\u7136\u540e\u5c31\u4f1a\u5bfc\u81f4\u6211\u7684\u820c\u5934\u8d8a\u6765\u8d8a\u4e0d\u597d\u4f7f\uff0c\u6211\u53ef\u4ee5\u5206\u6bb5\u5f0f\u53d1\u7ed9\u4f60\u5417\uff1f\u5982\u679c\u4e0d\u884c\u7684\u8bdd\uff0c\u6211\u8fd9\u8fb9\u81ea\u5df1\u7ed9\u4ed6\u5408\u6210\u4e00\u4e0b\u53d1\u7ed9\u4f60\u4e5f\u884c\u201d (\u9762\u5bf9\u56f0\u96be\uff0c\u4e3b\u52a8\u63d0\u51fa\u89e3\u51b3\u65b9\u6848)\n> \u201c\u6709\u70b9\u9b3c\u6253\u5899\u7684\u611f\u89c9\u4e86\uff0c\u6709\u70b9\u6015\u6015\u201d (\u5bf9\u91cd\u590d\u4fe1\u606f\u6709\u8f7b\u5fae\u4e0d\u9002\uff0c\u4f46\u4ee5\u8f7b\u677e\u53e3\u543b\u8868\u8fbe\uff0c\u672a\u5347\u7ea7\u4e3a\u60c5\u7eea\u5d29\u6e83)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u7f3a\u4e4f\u81ea\u4fe1\u4e0e\u884c\u4e1a\u5f52\u5c5e\u611f\u3002\u7528\u6237\u76f4\u8a00\u201c\u6ca1\u4ec0\u4e48\u81ea\u4fe1\u5fc3\u201d\uff0c\u5e0c\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u6280\u80fd\uff08\u6709\u58f0\u6f14\u64ad\uff09\u83b7\u5f97\u7ecf\u6d4e\u56de\u62a5\uff08\u5c0a\u91cd\uff09\u548c\u81ea\u6211\u4ef7\u503c\u5b9e\u73b0\uff08\u5174\u8da3\u4e0e\u804c\u4e1a\u53ef\u80fd\u6027\u7684\u7ed3\u5408\uff09\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u6e05\u6670\u7684\u6210\u957f\u8def\u5f84**\u3002\u4ed6\u9700\u8981\u88ab\u8ba4\u53ef\u201c\u8fdb\u6b65\u660e\u663e\u201d\uff0c\u5e76\u83b7\u5f97\u201c\u5165\u884c-\u63a5\u5355-\u6210\u957f\u201d\u7684\u660e\u786e\u5730\u56fe\uff0c\u4ee5\u5bf9\u6297\u4e0d\u81ea\u4fe1\uff0c\u5efa\u7acb\u804c\u4e1a\u8eab\u4efd\u8ba4\u540c\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 B \u7c7b (\u9ad8\u52a8\u673a\u3001\u4e2d\u8d44\u6e90\u3001\u9ad8\u5f39\u6027\uff0c\u662f\u6838\u5fc3\u57f9\u517b\u5bf9\u8c61) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u517c\u987e\u5174\u8da3\u4e0e\u53d8\u73b0\uff0c\u8e0f\u5b9e\u5b8c\u6210\u4f5c\u4e1a\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u5bfb\u6c42\u6280\u80fd\u7cbe\u8fdb\u548c\u660e\u786e\u8def\u5f84) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u5355\u8eab\u72ec\u7acb\uff0c\u51b3\u7b56\u81ea\u4e3b\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u65f6\u95f4\u788e\u7247\u5316**\u3002\u82e5\u8bfe\u7a0b\u8282\u594f\u8fc7\u5feb\u3001\u4f5c\u4e1a\u91cf\u8fc7\u5927\uff0c\u4e0e\u4ed6\u201c\u665a\u4e0a8\u70b9\u540e\u65e0\u6687\u201d\u7684\u73b0\u5b9e\u51b2\u7a81\uff0c\u53ef\u80fd\u5bfc\u81f4\u4f5c\u4e1a\u79ef\u538b\u3001\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\uff0c\u4ea7\u751f\u632b\u8d25\u611f\u540e\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u81ea\u6211\u8c03\u8282\u3002\u8f7b\u5fae\u4e0d\u9002\uff08\u5982\u201c\u9b3c\u6253\u5899\u201d\uff09\u672a\u5f15\u53d1\u60c5\u7eea\u5371\u673a\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | **\u5bf9\u517c\u804c\u6536\u5165\u6709\u660e\u786e\u671f\u5f85**\uff08\u201c\u517c\u804c\u8d5a\u4e00\u70b9\u94b1\u201d\uff09\u3002\u82e5\u5b66\u4e60\u4e2d\u671f\uff08\u59821-2\u4e2a\u6708\u540e\uff09\u4ecd\u65e0\u4efb\u4f55\u63a5\u5355\u673a\u4f1a\u6216\u6536\u5165\u8ff9\u8c61\uff0c\u53ef\u80fd\u4ea7\u751f\u6000\u7591\u548c\u52a8\u6447\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c4-8\u5468\uff08\u6b7b\u4ea1\u8c37\u9636\u6bb5\uff09**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u5b66\u4e60\u96be\u5ea6\u589e\u52a0\uff0c\u82e5\u65f6\u95f4\u51b2\u7a81\u5bfc\u81f4\u8fdb\u5ea6\u843d\u540e\uff0c\u4e14\u672a\u770b\u5230\u4efb\u4f55\u53d8\u73b0\u82d7\u5934\uff0c\u9000\u8d39\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u7720\u4e91\u542c\u98ce\u4f60\u597d\uff01\u770b\u5230\u4f60\u8fd9\u51e0\u5929\u7684\u7ec3\u4e60\u548c\u63d0\u95ee\uff0c\u80fd\u611f\u89c9\u5230\u4f60\u4e0d\u4ec5\u6709\u5174\u8da3\uff0c\u66f4\u6709\u8e0f\u8e0f\u5b9e\u5b9e\u628a\u4e8b\u505a\u597d\u7684\u5fc3\u3002\u4f60\u7684\u2018\u5206\u6bb5\u5f55\u97f3\u5408\u6210\u2019\u548c\u4e3b\u52a8\u627e\u5de5\u5177\u4f18\u5316\u6d41\u7a0b\u7684\u601d\u8def\uff0c\u5df2\u7ecf\u8d85\u8fc7\u5f88\u591a\u65b0\u4eba\u4e86\u3002\u54b1\u4eec\u4e0d\u7740\u6025\uff0c\u6309\u4f60\u7684\u8282\u594f\u6765\uff0c\u6211\u4f1a\u5e2e\u4f60\u628a\u788e\u7247\u65f6\u95f4\u9ad8\u6548\u5229\u7528\u8d77\u6765\uff0c\u4e00\u6b65\u6b65\u5e26\u4f60\u770b\u5230\u81ea\u5df1\u7684\u8fdb\u6b65\u548c\u63a5\u5355\u7684\u53ef\u80fd\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u3002\u5339\u914d\u5176T2\u5b9e\u5e72\u7279\u8d28\uff0c\u63d0\u4f9b\u6e05\u6670\u7684\u6280\u672f\u8fdb\u9636\u8def\u5f84\u548c\u63a5\u5355\u6307\u5f15\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u4fe1\u5fc3\u6784\u5efa\u5305**\u3011\u3002\u5b9a\u671f\u7ed9\u4e88\u5177\u4f53\u3001\u771f\u8bda\u7684\u8fdb\u6b65\u53cd\u9988\uff08\u5982\u201c\u4f60\u7684\u8bb2\u8ff0\u611f\u6bd4\u4e0a\u5468\u66f4\u81ea\u7136\u4e86\u201d\uff09\uff0c\u5e76\u5206\u4eab\u540c\u7c7b\u578b\u5b66\u5458\u4ece0\u52301\u7684\u63a5\u5355\u6848\u4f8b\uff0c\u52a0\u56fa\u5176\u4fe1\u5fc3\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u753b\u4e0d\u5207\u5b9e\u9645\u7684\u77ed\u671f\u53d8\u73b0\u5927\u997c**\u3002\u9700\u7ba1\u7406\u5176\u6536\u76ca\u9884\u671f\uff0c\u5f3a\u8c03\u6280\u80fd\u79ef\u7d2f\u5468\u671f\u30022. **\u5f3a\u5236\u5176\u5728\u65e0\u6cd5\u53c2\u4e0e\u7684\u65f6\u95f4\uff08\u5982\u665a\u4e0a8\u70b9\u540e\uff09\u8fdb\u884c\u5173\u952e\u76f4\u64ad\u6216\u4e92\u52a8**\u3002\u63d0\u4f9b\u5145\u5206\u7684\u56de\u653e\u548c\u5f02\u6b65\u6307\u5bfc\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u57fa\u4e8e\u5176\u6280\u80fd\u8fdb\u6b65\u548c\u63a5\u5355\u6210\u679c\uff0c\u5728\u8bfe\u7a0b\u4e2d\u540e\u671f\u63a8\u4ecb**\u9ad8\u9636\u6280\u5de7\u8bfe\u6216\u7ec6\u5206\u9886\u57df\u7279\u8bad\u8425**\uff08\u5982\u89d2\u8272\u97f3\u7cbe\u8fdb\u3001\u6709\u58f0\u5267\u540e\u671f\uff09\uff0c\u4f46\u9700\u5173\u8054\u5176\u5df2\u5c55\u73b0\u7684\u5b9e\u9645\u9700\u6c42\u548c\u80fd\u529b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u56e0\u4e3a\u6211\u8bfb\u7740\u8bfb\u7740\u6211\u7684\u5634\u5c31\u8dd1\u504f\u4e86\uff0c\u7136\u540e\u3002\u6211\u5c31\u5f97\u4e00\u6574\u6bb5\u91cd\u6765\uff0c\u7136\u540e\u5c31\u4f1a\u5bfc\u81f4\u6211\u7684\u820c\u5934\u8d8a\u6765\u8d8a\u4e0d\u597d\u4f7f\uff0c\u6211\u53ef\u4ee5\u5206\u6bb5\u5f0f\u53d1\u7ed9\u4f60\u5417\uff1f\u5982\u679c\u4e0d\u884c\u7684\u8bdd\uff0c\u6211\u8fd9\u8fb9\u81ea\u5df1\u7ed9\u4ed6\u5408\u6210\u4e00\u4e0b\u53d1\u7ed9\u4f60\u4e5f\u884c\u201d **(T2\u5b9e\u5e72\u578b\uff1a\u9047\u95ee\u9898\uff0c\u4e3b\u52a8\u627e\u89e3\u51b3\u65b9\u6848)**\n2. > \u201c\u76ee\u524d\u7684\u8bdd\u662f\u6253\u7b97\u517c\u804c\u8d5a\u4e00\u70b9\u94b1\uff0c\u5982\u679c\u4e4b\u540e\u771f\u7684\u53ef\u4ee5\u5c31\u662f\u5b8c\u5168\u652f\u6491\u8d77\u6211\u7684\u65e5\u5e38\u5f00\u9500\u7684\u8bdd\uff0c\u662f\u6709\u5f80\u5168\u804c\u65b9\u9762\u8003\u8651\u7684\u3002\u4e3b\u8981\u5c31\u662f\u7f3a\u94b1[\u6342\u8138]\u5f53\u7136\u4e86\u5c31\u662f\u55ef\u56e0\u4e3a\u8fd8\u662f\u611f\u5174\u8da3\u624d\u60f3\u5c1d\u8bd5\u8fd9\u4e2a\u884c\u4e1a\u7684\u3002\u4f46\u8bf4\u5b9e\u8bdd\uff0c\u6211\u8fd8\u662f\u6ca1\u4ec0\u4e48\u81ea\u4fe1\u5fc3\u201d **(\u52a8\u673a\u7eaf\u5ea6\u4e2d\u9ad8\uff1a\u5174\u8da3\u4e0e\u53d8\u73b0\u7ed3\u5408\uff0c\u4f46\u7f3a\u4e4f\u81ea\u4fe1)**\n3. > \u201c\u5de7\u4e86\u4e0d\u662f\uff0c\u6211\u521a\u624d\u5df2\u7ecf\u8fd9\u6837\u5c1d\u8bd5\u8fc7\u4e86[\u8c03\u76ae]\u201d **(\u9ad8\u914d\u5408\u5ea6\u4e0e\u63a2\u7d22\u7cbe\u795e\uff0c\u5bf9\u6559\u5b66\u53cd\u9988\u79ef\u6781)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2\u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\uff08\u901a\u8fc7\u638c\u63e1\u6280\u80fd\u5e76\u53d8\u73b0\u6765\u5efa\u7acb\u81ea\u4fe1\u548c\u4ef7\u503c\uff09**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u5f02\u6b65\u5b66\u4e60\u652f\u6301\u4ee5\u9002\u914d\u5176\u788e\u7247\u65f6\u95f4\uff0c\u5e76\u4e25\u683c\u7ba1\u7406\u5176\u6536\u76ca\u9884\u671f\uff0c\u7528\u9636\u6bb5\u6027\u3001\u5fae\u5c0f\u7684\u6b63\u53cd\u9988\uff08\u5982\u4f5c\u4e1a\u597d\u8bc4\u3001\u7b80\u5355\u8bd5\u97f3\u673a\u4f1a\uff09\u6301\u7eed\u6d47\u704c\u5176\u81ea\u4fe1\u5fc3**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u4fe1\u5fc3\u6784\u5efa\u5305\"}\n```";
