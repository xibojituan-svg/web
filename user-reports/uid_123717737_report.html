        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 123717737 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-02-15 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u592a\u9633\u4e5f\u6253\u4f1e(\u674e\u56fd\u5f3a) / \u5c11\u6e38\uff08\u505aAI\u7684\u5bfc\u6f14\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u77ed\u5267\u5199\u4f5c\u8bfe\u7a0b\uff08\u63a8\u6d4b\uff09\uff0c\u610f\u5411\u5347\u5355\u201c\u6539\u7a3f\u8bfe\u201d\uff081880\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3002\u4f46\u4ece\u8f7b\u677e\u8ba8\u8bba\u5347\u5355\u4e14\u672a\u63d0\u4ef7\u683c\u538b\u529b\u770b\uff0c**\u63a8\u6d4b\u4e3a\u5168\u6b3e\u5145\u88d5**\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u63d0\u53ca\u201c\u503c\u73ed\u201d\u3001\u201c\u5fd9\u4e86\u4e00\u5468\u4e86\u201d\u3001\u201c\u8fd9\u5468\u4e00\u5171\u7761\u4e86\u4e8c\u5341\u4e2a\u5c0f\u65f6\u5de6\u53f3\u201d\u3001\u201c\u52a0\u73ed72\u5c0f\u65f6\u4e0d\u7761\u89c9\u201d\uff0c\u663e\u793a\u5de5\u4f5c\u7e41\u5fd9\uff0c\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\u4e14\u4e0d\u56fa\u5b9a\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u4fe1\u606f\uff0c\u65e0\u6cd5\u5224\u65ad\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u7528\u6237\u4e92\u52a8\u9891\u7e41\uff0c\u4e3b\u52a8\u5206\u4eab\u751f\u6d3b\uff0c\u8868\u8fbe\u6e05\u6670\uff0c\u4fe1\u606f\u5145\u8db3\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34(\u4e2d)**\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u8bfe\u7a0b\u5185\u5bb9\uff08\u5982\u7d22\u8981\u201c\u8fc7\u7a0b\u201d\uff09\u3001\u8d44\u6599\uff08\u7d22\u8981\u201c\u7206\u6b3e\u201d\u8d44\u6599\uff09\u548c\u5347\u5355\uff08\u6539\u7a3f\u8bfe\uff09\u7684\u5174\u8da3\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u6781\u901f\u53d8\u73b0\u7684\u8feb\u5207\u6027\u3002\u5176\u52a8\u673a\u6df7\u5408\u4e86\u5174\u8da3\u63a2\u7d22\u3001\u6280\u80fd\u63d0\u5347\u548c\u6f5c\u5728\u7684\u53d8\u73b0\u671f\u671b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u8981\u7206\u6b3e\u201d (\u5bf9\u5185\u5bb9\u6709\u8ffd\u6c42)\uff1b> \u201c\u611f\u89c9\u5b66\u7684\u633a\u591a \u9700\u8981\u6c89\u6dc0\u4e00\u4e0b\u201d (\u6709\u5b66\u4e60\u89c4\u5212\uff0c\u975e\u76f2\u76ee\u8ffd\u8bfe)\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 \u80fd\u8f7b\u677e\u8ba8\u8bba\u5e76\u51b3\u5b9a\u8d2d\u4e701880\u5143\u7684\u6539\u7a3f\u8bfe\uff0c\u672a\u8868\u73b0\u51fa\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4f4e] \u2014 **\u6838\u5fc3\u77ed\u677f**\u3002\u5de5\u4f5c\u5f3a\u5ea6\u6781\u5927\uff08\u201c\u52a0\u73ed72\u5c0f\u65f6\u4e0d\u7761\u89c9\u201d\uff09\uff0c\u65f6\u95f4\u9ad8\u5ea6\u4e0d\u53ef\u63a7\uff0c\u662f\u5b66\u4e60\u7684\u4e3b\u8981\u969c\u788d\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u4e0d\u8db3] \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u7528\u6237\u9762\u5bf9\u9ad8\u5f3a\u5ea6\u5de5\u4f5c\uff08\u201c\u5fd9\u4e86\u4e00\u5468\u4e86\u201d\uff09\u548c\u7a81\u53d1\u72b6\u51b5\uff08\u201c\u6389\u4e86\u4e2a\u84dd\u7259\u8033\u673a\u201d\uff09\u65f6\uff0c\u4ee5\u8c03\u4f83\uff08\u201c\u76f4\u63a5\u5728\u5bb6\u6012\u4f11\u4e24\u5929\u201d\uff09\u548c\u5206\u4eab\uff08\u201c\u7096\u7684\u9e21\u6c64\u201d\uff09\u7684\u65b9\u5f0f\u5e94\u5bf9\uff0c\u672a\u5411\u9500\u552e\u4f20\u9012\u8d1f\u9762\u60c5\u7eea\u6216\u6c42\u52a9\uff0c\u8868\u73b0\u51fa\u8f83\u5f3a\u7684\u81ea\u6211\u8c03\u8282\u548c\u4e50\u89c2\u5fc3\u6001\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u52a0\u73ed72\u5c0f\u65f6\u4e0d\u7761\u89c9 \u8fd8\u4e0d\u75af\u72c2\u5417\u201d (\u4ee5\u5e7d\u9ed8\u5316\u89e3\u538b\u529b)\uff1b> \u201c\u6211\u90fd\u6ca1\u71ac\u8fc7\u732a\u6cb9[\u6342\u8138]\u201d (\u8f7b\u677e\u81ea\u5632)\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u9ad8\u5f3a\u5ea6\u3001\u9ad8\u538b\u529b\u7684\u5de5\u4f5c\u73af\u5883\uff08\u201c\u4e00\u5468\u7761\u4e86\u4e8c\u5341\u4e2a\u5c0f\u65f6\u201d\uff09\u5e26\u6765\u7684**\u7cbe\u795e\u5b64\u72ec\u548c\u60c5\u611f\u758f\u79bb**\u3002\u4ed6\u9700\u8981\u4ece\u67af\u71e5\u3001\u75b2\u60eb\u7684\u5de5\u4f5c\u4e2d\u62bd\u79bb\uff0c\u5bfb\u627e\u4e00\u4e2a\u80fd\u83b7\u5f97\u8ba4\u540c\u3001\u8f7b\u677e\u4ea4\u6d41\u548c\u6709\u5f52\u5c5e\u611f\u7684\u793e\u7fa4\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e00\u4e2a\u53ef\u4ee5\u653e\u677e\u3001\u88ab\u770b\u89c1\u3001\u88ab\u8ba4\u53ef\uff0c\u5e76\u80fd\u63d0\u4f9b\u6b63\u5411\u53cd\u9988\u7684\u201c\u7cbe\u795e\u540e\u82b1\u56ed\u201d**\u3002\u4ed6\u4eab\u53d7\u4e0e\u73ed\u73ed\uff08\u9500\u552e\uff09\u7684\u65e5\u5e38\u95f2\u804a\uff08\u5982\u8ba8\u8bba\u70e4\u8089\u3001\u5206\u4eab\u9e21\u6c64\uff09\uff0c\u8fd9\u672c\u8eab\u5c31\u662f\u4e00\u79cd\u60c5\u611f\u8865\u7ed9\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u52a8\u673a\u4e2d\u7b49\uff0c\u8d44\u6e90\u5e95\u5ea7\u6709\u65f6\u95f4\u77ed\u677f\u4f46\u65e0D\u7c7b\u98ce\u9669\uff0c\u5fc3\u7406\u5f39\u6027\u9ad8) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T5 \u597d\u73a9\u5c1d\u9c9c\u578b** (\u6838\u5fc3\u9a71\u52a8\u662f\u5bfb\u627e\u65b0\u9c9c\u611f\u3001\u793e\u4ea4\u4e50\u8da3\u548c\u8eab\u4efd\u8ba4\u540c\uff0c\u800c\u975e\u786c\u6838\u53d8\u73b0\u3002\u4e92\u52a8\u79ef\u6781\uff0c\u4e50\u4e8e\u5206\u4eab\u751f\u6d3b\uff0c\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u6709\u63a2\u7d22\u6b32\u4f46\u65e0\u6b7b\u78d5\u538b\u529b\u3002) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5c5e\u53cd\u5bf9\u7b49\u8ff9\u8c61\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u672a\u63d0\u53ca\u5bb6\u5ead\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\uff1a\u56e0\u5de5\u4f5c\u6781\u5ea6\u7e41\u5fd9\uff08\u201c\u52a0\u73ed72\u5c0f\u65f6\u201d\uff09\u5bfc\u81f4\u8bfe\u7a0b\u4e25\u91cd\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u82b1\u4e86\u94b1\u5374\u6ca1\u65f6\u95f4\u5b66\u201d\u7684\u6127\u759a\u611f\u548c\u632b\u8d25\u611f\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u5584\u4e8e\u81ea\u6211\u8c03\u4f83\uff0c\u4e0d\u6613\u56e0\u5b66\u4e60\u56f0\u96be\u7834\u9632\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u5982\u679c\u8bfe\u7a0b\u65e0\u6cd5\u63d0\u4f9b\u6301\u7eed\u7684\u201c\u65b0\u9c9c\u611f\u201d\u548c\u201c\u793e\u4ea4\u6ee1\u8db3\u611f\u201d\uff0c\u6216\u5347\u5355\u540e\u5185\u5bb9\u67af\u71e5\uff0c\u53ef\u80fd\u56e0\u5174\u8da3\u6d88\u9000\u800c\u6d41\u5931\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-3\u5468\u540e**\u3002\u6b64\u65f6\u5de5\u4f5c\u538b\u529b\u4e0e\u8bfe\u7a0b\u4efb\u52a1\u53e0\u52a0\uff0c\u82e5\u65e0\u6cd5\u8ddf\u4e0a\u8fdb\u5ea6\uff0c\u6781\u6613\u4ea7\u751f\u201c\u7b97\u4e86\uff0c\u592a\u5fd9\u4e86\u201d\u7684\u653e\u5f03\u5ff5\u5934\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201croc\uff0c\u77e5\u9053\u4f60\u5e73\u65f6\u5de5\u4f5c\u8ddf\u6253\u4ed7\u4f3c\u7684\uff0c\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u4e0d\u5377\u8fdb\u5ea6\u3002\u4f60\u5c31\u5f53\u8fd9\u513f\u662f\u4e2a\u2018\u5199\u4f5c\u8336\u6c34\u95f4\u2019\uff0c\u6709\u7a7a\u4e86\u8fdb\u6765\u6ce1\u676f\u8336\uff0c\u542c\u542c\u8bfe\uff0c\u804a\u4e24\u53e5\u3002\u4f5c\u4e1a\u561b\uff0c\u6709\u7075\u611f\u5c31\u5199\uff0c\u6ca1\u7075\u611f\u5c31\u770b\uff0c\u4e3b\u6253\u4e00\u4e2a\u653e\u677e\u548c\u597d\u73a9\u3002\u522b\u8ba9\u5b66\u4e60\u6210\u4e86\u4f60\u52a0\u73ed\u540e\u7684\u53c8\u4e00\u9879\u4efb\u52a1\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5174\u8da3\u6e38\u4e50\u7ebf**\u3011\u3002\u6838\u5fc3\u662f\u7ef4\u6301\u5176\u53c2\u4e0e\u611f\u548c\u65b0\u9c9c\u611f\uff0c\u800c\u975e\u65bd\u52a0\u786c\u6838\u5b66\u4e60\u538b\u529b\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010**\u5f02\u6b65\u8f7b\u91cf\u4e92\u52a8\u5305**\u3011\uff08\u5982\uff1a\u788e\u7247\u5316\u77e5\u8bc6\u5361\u7247\u3001\u8f7b\u677e\u6709\u8da3\u7684\u6bcf\u65e5\u5c0f\u6311\u6218\u3001\u65e0\u9700\u957f\u65f6\u95f4\u6295\u5165\u7684\u793e\u7fa4\u8bdd\u9898\u4e92\u52a8\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7ed9\u4ed6\u5e03\u7f6e\u786c\u6027\u3001\u9ad8\u5f3a\u5ea6\u7684\u4f5c\u4e1a\u4efb\u52a1\uff1b\u7528\u201c\u522b\u4eba\u90fd\u5b8c\u6210\u4e86\u201d\u6765\u65bd\u538b\uff1b\u8fc7\u5ea6\u5f3a\u8c03\u53d8\u73b0\u548c\u63a5\u5355\u538b\u529b\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u9700\u7ed1\u5b9a\u201c\u793e\u4ea4\u4ef7\u503c\u201d\u548c\u201c\u8eab\u4efd\u8ba4\u540c\u201d**\u3002\u4f8b\u5982\uff0c\u5347\u5355\u540e\u53ef\u8fdb\u5165\u201c\u6838\u5fc3\u73a9\u5bb6\u7fa4\u201d\u3001\u201c\u4f18\u5148\u53c2\u4e0e\u5185\u90e8\u6d3b\u52a8\u201d\uff0c\u6ee1\u8db3\u5176T5\u539f\u578b\u5bf9\u5708\u5c42\u548c\u597d\u73a9\u7684\u9700\u6c42\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u8fd9\u5468\u4e00\u5171\u7761\u4e86\u4e8c\u5341\u4e2a\u5c0f\u65f6\u5de6\u53f3\u201d **(\u8d44\u6e90\u5e95\u5ea7\u65f6\u95f4\u77ed\u677f\u7684\u6838\u5fc3\u8bc1\u636e)**\n2. > \u201c\u611f\u89c9\u5b66\u7684\u633a\u591a \u9700\u8981\u6c89\u6dc0\u4e00\u4e0b\u201d **(\u52a8\u673a\u975e\u7eaf\u53d8\u73b0\uff0c\u6709\u5b66\u4e60\u89c4\u5212)**\n3. > \u201c\u6211\u5c31\u9634\u9b42\u4e0d\u6563\u7684\u8ddf\u7740\u4f60\u4e86\u201d **(\u5bf9\u4e0e\u73ed\u73ed\u7684\u793e\u4ea4\u8fde\u63a5\u6709\u5f3a\u70c8\u8ba4\u540c\u548c\u4f9d\u8d56)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T5 \u597d\u73a9\u5c1d\u9c9c\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u9ad8\u538b\u5de5\u4f5c\u5916\u5bfb\u627e\u8f7b\u677e\u3001\u6709\u8ba4\u540c\u611f\u7684\u793e\u4ea4\u5708\u5c42\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5c06\u5b66\u4e60\u6e38\u620f\u5316\u3001\u793e\u4ea4\u5316\uff0c\u5f7b\u5e95\u5378\u6389\u5176\u8fdb\u5ea6\u538b\u529b\uff0c\u628a\u8bfe\u7a0b\u6253\u9020\u6210\u4ed6\u7684\u201c\u7cbe\u795e\u4f11\u606f\u7ad9\u201d\u3011**\u3002\n\n```json\n{\"core_type\": \"T5 \u597d\u73a9\u5c1d\u9c9c\u578b\", \"maslow_need\": \"\u793e\u4ea4/\u5c0a\u91cd\u9700\u6c42\", \"risk_level\": \"\u4e2d\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf+\u5f02\u6b65\u8f7b\u91cf\u4e92\u52a8\u5305\"}\n```";
        document.getElementById('content').innerHTML = marked.parse(markdownText);
