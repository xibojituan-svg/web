        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677153965 (\u6635\u79f0: \u5446\u5446) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e\uff1a\u6668\u516e\u5e08\u59d0(\u8096\u96ef\u99a8)\uff1b\u73ed\u4e3b\u4efb\uff1a\u9065\u8fdc\u4e0d\u8fdc(\u5f20\u6587\u9759) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e3b\u64ad\u57f9\u8bad\u8bfe\u7a0b (\u4e24\u4e2a\u6708\u671f\uff0c\u4ef7\u683c\u7ea62380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u7528\u5361\u5468\u8f6c / \u88ab\u8feb\u5206\u671f** (\u7528\u6237\u63d0\u53ca\u201c\u4e24\u4e2a\u6708\u7684\u4e5f\u5dee\u4e0d\u591a\u6211\u4e00\u4e2a\u6708\u7684\u5de5\u8d44\u4e86\u201d\uff0c\u652f\u4ed8\u538b\u529b\u660e\u663e) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u7528\u6237\u591a\u6b21\u8868\u793a\u201c\u5728\u4e0a\u73ed\u201d\u3001\u201c\u6709\u7a7a\u7684\u65f6\u5019\u770b\u4e0b\u201d\uff0c\u663e\u793a\u4e3a\u5728\u804c\u72b6\u6001\uff0c\u65f6\u95f4\u6709\u9650) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** (\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u4fe1\u606f\uff0c\u9700\u91cd\u70b9\u6838\u67e5) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** (\u7f3a\u4e4f\u652f\u4ed8\u65b9\u5f0f\u3001\u5bb6\u5ead\u80cc\u666f\u3001\u8fc7\u5f80\u7ecf\u5386\u3001\u5177\u4f53\u804c\u4e1a\u7b49\u5173\u952e\u4fe1\u606f) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34(\u4e2d)\u3002\u7528\u6237\u5bf9\u6709\u58f0\u884c\u4e1a\u53d8\u73b0\u611f\u5174\u8da3\uff0c\u4f46\u66f4\u5173\u6ce8\u201c\u7b80\u5355\u201d\u3001\u201c\u4eb2\u5b50\u7c7b\u201d\u7b49\u4f4e\u95e8\u69db\u3001\u4f4e\u538b\u529b\u65b9\u5411\uff0c\u5bf9\u5feb\u901f\u8d5a\u5927\u94b1\u7684\u6e34\u671b\u4e0d\u5f3a\u70c8\uff0c\u52a8\u673a\u4e2d\u6df7\u6742\u4e86\u5174\u8da3\u63a2\u7d22\u548c\u526f\u4e1a\u5c1d\u8bd5\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u611f\u89c9\u5c0f\u670b\u53cb\u7684\uff0c\u540e\u9762\u51e0\u6b21\u4f5c\u4e1a\u6211\u90fd\u662f\u9009\u4eb2\u5b50\u7c7b\u7684\uff0c\u6211\u89c9\u5f97\u7b80\u5355\u70b9\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u660e\u786e\u8868\u793a2380\u5143\u7684\u8bfe\u7a0b\u8d39\u7528\u76f8\u5f53\u4e8e\u5176\u4e00\u4e2a\u6708\u5de5\u8d44\uff0c\u652f\u4ed8\u538b\u529b\u5927\uff0c\u8d44\u91d1\u627f\u8f7d\u529b\u5f31\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e** \u2014 \u5728\u804c\u72b6\u6001\uff0c\u591a\u6b21\u56e0\u4e0a\u73ed\u65e0\u6cd5\u53ca\u65f6\u8ddf\u8fdb\u76f4\u64ad\u6216\u4efb\u52a1\uff0c\u65f6\u95f4\u788e\u7247\u5316\uff0c\u7cbe\u529b\u6709\u9650\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u672a\u77e5** \u2014 \u804a\u5929\u8bb0\u5f55\u5b8c\u5168\u672a\u63d0\u53ca\uff0c\u662f\u91cd\u5927\u98ce\u9669\u655e\u53e3\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u9700\u95f4\u6b47\u6027\u5b89\u629a(\u4e2d)\u3002\u7528\u6237\u4f1a\u4e3b\u52a8\u8868\u8fbe\u201c\u7d27\u5f20\u201d\u3001\u201c\u653e\u4e0d\u5f00\u201d\u7b49\u4e0d\u81ea\u4fe1\u60c5\u7eea\uff0c\u4f46\u80fd\u63a5\u53d7\u9f13\u52b1\u5e76\u7ee7\u7eed\u884c\u52a8\uff0c\u672a\u51fa\u73b0\u6781\u7aef\u8d1f\u9762\u6216\u4f9d\u8d56\u884c\u4e3a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u89c9\u5f97\u6211\u6bcf\u6b21\u5f55\u90fd\u6709\u7d27\u5f20\uff0c\u653e\u4e0d\u5f00\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u526f\u4e1a\u589e\u6536\u7684\u6e34\u671b\u4e0e\u5bf9\u6295\u5165\u98ce\u9669\u7684\u6050\u60e7\u5e76\u5b58**\u3002\u7528\u6237\u6709\u201c\u4e4b\u524d\u4e5f\u6709\u88ab\u9a97\u8fc7\u201d\u7684\u7ecf\u5386\uff0c\u5bf92380\u5143\u7684\u6295\u5165\u975e\u5e38\u654f\u611f\uff0c\u5bb3\u6015\u201c\u4ea4\u4e86\u94b1\u4e5f\u4e0d\u80fd\u8d5a\u5230\u201d\uff0c\u672c\u8d28\u662f\u5bfb\u6c42\u4e00\u4efd\u5b89\u5168\u3001\u6709\u4fdd\u969c\u7684\u989d\u5916\u6536\u5165\u6765\u62b5\u5fa1\u751f\u6d3b\u4e0d\u786e\u5b9a\u6027\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u4e0e\u5b89\u5168\u611f**\u3002\u9700\u8981\u4e0d\u65ad\u63d0\u4f9b\u201c\u770b\u5f97\u89c1\u201d\u7684\u8def\u5f84\uff08\u5982\u7b80\u5355\u4efb\u52a1\u3001\u660e\u786e\u53cd\u9988\u3001\u7248\u6743\u4e66\u627f\u8bfa\uff09\u548c\u201c\u4fe1\u5f97\u8fc7\u201d\u7684\u80cc\u4e66\uff08\u5982\u5e08\u59d0\u9886\u8def\u4eba\u8eab\u4efd\u3001\u6210\u529f\u6848\u4f8b\uff09\uff0c\u6765\u5bf9\u51b2\u5176\u56e0\u8d44\u91d1\u7d27\u5f20\u548c\u8fc7\u5f80\u53d7\u9a97\u7ecf\u5386\u4ea7\u751f\u7684\u4e0d\u4fe1\u4efb\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1** \u7c7b (\u52a8\u673a\u4e2d\u7b49\u3001\u8d44\u6e90\u5e95\u5ea7\u8584\u5f31\u3001\u6709\u660e\u786e\u98ce\u9669\u70b9) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T5 \u597d\u73a9\u5c1d\u9c9c** (\u504f\u5411\u4f4e\u538b\u529b\u3001\u6709\u8da3\u5473\u6027\u7684\u5165\u95e8\u5c1d\u8bd5\uff0c\u5bf9\u201c\u4eb2\u5b50\u7c7b\u201d\u3001\u201c\u7b80\u5355\u201d\u5185\u5bb9\u611f\u5174\u8da3\uff0c\u800c\u975e\u6b7b\u78d5\u6280\u672f\u6216\u8ffd\u6c42\u66b4\u5bcc) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u501f\u8d37\u3001\u7edd\u5883\u7b49\u660e\u786e\u8bc1\u636e\uff0c\u4f46**\u652f\u4ed8\u538b\u529b\u5927**\u548c**\u5bb6\u5ead\u4fe1\u606f\u7f3a\u5931**\u662f\u6f5c\u5728\u98ce\u9669\u70b9\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | **\u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u98ce\u9669\u9ad8**\u3002\u82e5\u8bfe\u7a0b\u8d39\u7528\u52a8\u7528\u5bb6\u5ead\u5171\u540c\u8d44\u91d1\u4e14\u672a\u62a5\u5907\uff0c\u6781\u6613\u5f15\u53d1\u51b2\u7a81\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | \u5728\u804c\u72b6\u6001\uff0c\u65f6\u95f4\u788e\u7247\u5316\u3002\u4e00\u65e6\u6b63\u5f0f\u8bfe\u7a0b\u8282\u594f\u52a0\u5feb\u6216\u8981\u6c42\u56fa\u5b9a\u65f6\u95f4\u53c2\u4e0e\uff0c\u6781\u6613\u56e0\u201c\u6ca1\u65f6\u95f4\u201d\u4ea7\u751f\u79ef\u538b\u548c\u81ea\u8d23\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u7528\u6237\u80fd\u8868\u8fbe\u56f0\u96be\u5e76\u63a5\u53d7\u6307\u5bfc\uff0c\u672a\u8868\u73b0\u51fa\u6781\u7aef\u60c5\u7eea\u5316\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u5bf9\u201c\u7b80\u5355\u201d\u548c\u201c\u4eb2\u5b50\u7c7b\u201d\u6709\u504f\u597d\uff0c\u82e5\u521d\u671f\u63a5\u5355\u4efb\u52a1\u590d\u6742\u6216\u7ade\u4e89\u6fc0\u70c8\uff0c\u672a\u8fbe\u9884\u671f\uff0c\u6613\u4ea7\u751f\u201c\u88ab\u9a97\u201d\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\u3002\u65b0\u9c9c\u611f\u8fc7\u540e\uff0c\u9762\u4e34\u65f6\u95f4\u6295\u5165\u4e0e\u8bfe\u7a0b\u96be\u5ea6\u7684\u53cc\u91cd\u538b\u529b\uff0c\u82e5\u672a\u83b7\u5f97\u5373\u65f6\u6b63\u53cd\u9988\uff08\u5982\u7b80\u5355\u8bd5\u97f3\u673a\u4f1a\uff09\uff0c\u9000\u8d39\u98ce\u9669\u6fc0\u589e\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5446\u5446\u540c\u5b66\u4f60\u597d\uff01\u6668\u516e\u5e08\u59d0\u7279\u610f\u8ddf\u6211\u4ea4\u4ee3\u4e86\uff0c\u4f60\u58f0\u97f3\u91cc\u7684\u4eb2\u548c\u529b\u7279\u522b\u9002\u5408\u8bb2\u513f\u7ae5\u6545\u4e8b\uff0c\u8fd9\u662f\u5f88\u96be\u5f97\u7684\u5929\u8d4b\u3002\u54b1\u4eec\u4e0d\u7740\u6025\uff0c\u5148\u4ece\u4f60\u6700\u611f\u5174\u8da3\u7684\u3001\u6700\u7b80\u5355\u7684\u4eb2\u5b50\u7c7b\u5185\u5bb9\u5f00\u59cb\u73a9\uff0c\u6211\u4f1a\u5e2e\u4f60\u7559\u610f\u8fd9\u7c7b\u7b80\u5355\u7684\u8bd5\u97f3\u5355\u3002\u8bb0\u4f4f\uff0c\u54b1\u4eec\u7684\u6838\u5fc3\u76ee\u6807\u662f\u2018\u5b89\u5168\u5730\u73a9\u51fa\u70b9\u96f6\u82b1\u94b1\u2019\uff0c\u6709\u4efb\u4f55\u65f6\u95f4\u5b89\u6392\u4e0a\u7684\u56f0\u96be\u968f\u65f6\u627e\u6211\uff0c\u6211\u4eec\u4e00\u8d77\u8c03\u6574\u8ba1\u5212\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5174\u8da3\u6e38\u4e50\u7ebf**\u3011\u3002\u6838\u5fc3\u662f\u7ef4\u6301\u4f4e\u538b\u529b\u3001\u9ad8\u8da3\u5473\u6027\u7684\u5b66\u4e60\u4f53\u9a8c\uff0c\u907f\u514d\u65bd\u52a0\u201c\u5fc5\u987b\u5feb\u901f\u53d8\u73b0\u201d\u7684\u538b\u529b\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010**\u5f02\u6b65\u7075\u6d3b\u5b66\u4e60\u5305**\u3011\uff08\u5982\u5f55\u64ad\u8bfe\u7cbe\u534e\u5207\u7247\u3001\u53ef\u968f\u65f6\u63d0\u4ea4\u7684\u788e\u7247\u5316\u7ec3\u4e60\uff09\uff1b\u9488\u5bf9\u5176\u5b89\u5168\u611f\u9700\u6c42\uff0c\u8865\u5145\u3010**\u5fae\u578b\u6b63\u53cd\u9988\u5305**\u3011\uff08\u5982\u5b9a\u671f\u63d0\u4f9b\u6781\u7b80\u5355\u7684\u3001\u65e0\u7ade\u4e89\u7684\u4eb2\u5b50\u7c7b\u8bd5\u97f3\u6216\u6717\u8bfb\u4efb\u52a1\uff0c\u5e76\u7ed9\u4e88\u5373\u65f6\u5956\u52b1\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7edd\u4e0d\u5bf9\u5176\u65bd\u538b\u8981\u6c42\u957f\u65f6\u95f4\u3001\u56fa\u5b9a\u65f6\u95f4\u7684\u76f4\u64ad\u8ddf\u8bfe\uff1b\u7edd\u4e0d\u7528\u201c\u6708\u5165\u8fc7\u4e07\u201d\u7b49\u6fc0\u8fdb\u6848\u4f8b\u523a\u6fc0\u5176\u7126\u8651\uff1b\u7edd\u4e0d\u5ffd\u89c6\u5176\u201c\u65f6\u95f4\u7d27\u5f20\u201d\u7684\u53cd\u9988\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5f53\u524d\u5ba2\u5355\u4ef7\uff082380\u5143\uff09\u5df2\u89e6\u53ca\u5176\u652f\u4ed8\u80fd\u529b\u7ea2\u7ebf\uff0c\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u5c06\u6781\u5927\u53ef\u80fd\u76f4\u63a5\u89e6\u53d1\u9000\u8d39\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5e08\u59d0\uff0c\u6211\u6709\u70b9\u62c5\u5fc3\u3002\u56e0\u4e3a\u4e4b\u524d\u4e5f\u6709\u88ab\u9a97\u8fc7\u201d\n2. > \u201c\u6015\u4ea4\u4e86\u94b1\u4e5f\u4e0d\u80fd\u8d5a\u5230\uff0c\u6216\u8005\u540e\u671f\u5565\u90fd\u6ca1\u6709\u201d\n3. > \u201c\u4e24\u4e2a\u6708\u7684\u4e5f\u5dee\u4e0d\u591a\u6211\u4e00\u4e2a\u6708\u7684\u5de5\u8d44\u4e86\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T5\u597d\u73a9\u5c1d\u9c9c\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\uff08\u7126\u8651\u4fdd\u969c\uff09**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d\u504f\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u201c\u5b89\u5168\u3001\u7b80\u5355\u3001\u6709\u8da3\u201d\u7684\u5165\u95e8\u8def\u5f84\uff0c\u5e76\u4e25\u683c\u89c4\u907f\u4efb\u4f55\u5347\u5355\u6216\u65f6\u95f4\u538b\u69a8**\u3002\n\n```json\n{\"core_type\": \"T5 \u597d\u73a9\u5c1d\u9c9c\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\u504f\u9ad8\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf\"}\n```";
