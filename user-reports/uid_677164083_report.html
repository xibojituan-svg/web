    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677164083 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u7b71\u6590\uff08\u5b98\u65b9\u52a9\u6559-\u7c7d\u83f2\u56e2\u961f\uff09/ \u84dd\u6cab\u513f6 / \u6854\u5b50JZT |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u7cbe\u82f1\u8bfe\u7a0b\uff08\u5df2\u652f\u4ed8\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\uff0c\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u81ea\u79f0\u201c\u767d\u5929\u65f6\u95f4\u4f1a\u5145\u88d5\u4e9b\u201d\uff0c\u4f46\u201c\u4e0b\u53483\u70b9\u4ee5\u540e\u548c\u665a\u4e0a\uff0c\u4f1a\u5fd9\u4e9b\u201d\uff0c\u9700\u7167\u987e\u5b69\u5b50\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u5df2\u62a5\u5907\u5e76\u652f\u6301**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u6211\u5bb6\u6ca1\u4eba\u7ba1\u6211\u201d\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u7528\u6237\u4e3b\u52a8\u63d0\u4f9b\u4e86\u5927\u91cf\u80cc\u666f\u4fe1\u606f\u3001\u5b66\u4e60\u52a8\u673a\u548c\u65f6\u95f4\u5b89\u6392\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **[\u27a1\u4e2d]**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u5174\u8da3\u9a71\u52a8\u4e3a\u4e3b\uff0c\u517c\u804c\u53d8\u73b0\u4e3a\u8f85**\u3002\u7528\u6237\u591a\u6b21\u5f3a\u8c03\u201c\u611f\u5174\u8da3\u201d\u3001\u201c\u89c9\u5f97\u597d\u73a9\u201d\u3001\u201c\u559c\u6b22\u8fd9\u4e2a\u6c1b\u56f4\u201d\uff0c\u5bf9\u5177\u4f53\u8d5b\u9053\u201c\u90fd\u60f3\u8bd5\u8bd5\u201d\uff0c\u4e0d\u6311\u5de5\u4f5c\u3002\u540c\u65f6\uff0c\u4e5f\u8868\u8fbe\u4e86\u201c\u4e0d\u4e3a\u8d5a\u591a\u5c11\uff0c\u5148\u8bd5\u8bd5\u201d\u7684\u517c\u804c\u610f\u613f\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u5bf9\u77ed\u671f\u66b4\u5bcc\u7684\u6025\u5207\u6e34\u671b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u662f\u611f\u5174\u8da3\u3002\u4ee5\u540e\u591a\u6307\u6559\uff01\u201d > \u201c\u4e0d\u4e3a\u8d5a\u591a\u5c11\uff0c\u5148\u8bd5\u8bd5\u81ea\u5df1\u559c\u6b22\u54ea\u4e2a\uff0c\u6211\u662f\u89c9\u5f97\u597d\u73a9\uff0c\u800c\u4e14\u89c9\u5f97\u548c\u5e08\u59d0\u548c\u7c7d\u83f2\u8001\u5e08\u3001\u5de5\u4f5c\u5ba4\u6c1b\u56f4\u540c\u9891\uff0c\u5f88\u559c\u6b22\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **[\u27a1\u4e2d]**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u4e2d]** \u2014 \u5df2\u652f\u4ed8\u6b63\u4ef7\u8bfe\u7a0b\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u652f\u4ed8\u65b9\u5f0f\u4e0e\u7ecf\u6d4e\u538b\u529b\u3002\u81ea\u79f0\u201c\u4ee5\u524d\u5e72\u7684\u4e5f\u4e0d\u9519\u201d\uff0c\u76ee\u524d\u65e0\u4e3b\u4e1a\uff0c\u7ecf\u6d4e\u72b6\u51b5\u4e0d\u660e\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**[\u4e2d]** \u2014 \u67093-4\u5c0f\u65f6/\u5929\u7684\u788e\u7247\u5316\u5b66\u4e60\u65f6\u95f4\uff0c\u4f46\u9700\u7167\u987e\u4e0a\u5b66\u7684\u5b69\u5b50\uff0c\u65f6\u95f4\u88ab\u5bb6\u5ead\u8d23\u4efb\u5206\u5272\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u9ad8]** \u2014 \u660e\u786e\u8868\u793a\u201c\u6211\u5bb6\u6ca1\u4eba\u7ba1\u6211\u201d\uff0c\u5bb6\u5ead\u652f\u6301\u5ea6\u9ad8\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **[\u2b06\u9ad8]**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u7528\u6237\u8868\u73b0\u51fa\u6781\u5f3a\u7684\u4e3b\u52a8\u6027\u548c\u89e3\u51b3\u95ee\u9898\u7684\u80fd\u529b\u3002\u9047\u5230\u201c\u627e\u4e0d\u5230\u7fa4\u201d\u3001\u201c\u8fdb\u4e0d\u53bb\u4f01\u4e1a\u5fae\u4fe1\u201d\u7b49\u6280\u672f\u95ee\u9898\u65f6\uff0c\u80fd\u51b7\u9759\u3001\u6e05\u6670\u5730\u63cf\u8ff0\u95ee\u9898\u5e76\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff08\u201c\u662f\u4f01\u4e1a\u5fae\u4fe1\u7fa4\u540d\u201d\u3001\u201c\u662f\u4f01\u4e1a\u5fae\u4fe1\u7fa4\u5417\u201d\u3001\u201c\u6211\u600e\u4e48\u8fdb\u4e0d\u53bb\u201d\uff09\uff0c\u800c\u975e\u60c5\u7eea\u5d29\u6e83\u3002\u5bf9\u58f0\u97f3\u7684\u4e0d\u81ea\u4fe1\uff08\u201c\u4e0d\u559c\u6b22\u81ea\u5df1\u7684\u58f0\u97f3\u201d\uff09\u4e5f\u8f6c\u5316\u4e3a\u5b66\u4e60\u52a8\u529b\uff0c\u800c\u975e\u653e\u5f03\u7406\u7531\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u53e6\u5916\u914d\u97f3\u4f5c\u4e1a\u662f\u53d1\u7ed9\u5e08\u59d0\u8fd8\u662f\u53d1\u7fa4\u91cc\uff0c\u6211\u5728\u7fa4\u91cc\u5417\uff1f[\u6342\u8138]\u201d > \u201c\u6211\u6ca1\u627e\u5230...\u662f\u4f01\u4e1a\u5fae\u4fe1\u7fa4\u540d...\u662f\u4f01\u4e1a\u5fae\u4fe1\u7fa4\u5417\u201d > \u201c\u8fd9\u662f\u4f01\u4e1a\u5fae\u4fe1\uff0c\u6211\u600e\u4e48\u8fdb\u4e0d\u53bb\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u5f52\u5c5e\u4e0e\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u8ba4\u53ef** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e2d\u5e74\u8f6c\u578b\u671f\u7684\u4ef7\u503c\u611f\u7f3a\u5931\u4e0e\u793e\u4ea4\u5708\u5c42\u91cd\u5efa\u9700\u6c42**\u3002\u7528\u6237\u66fe\u662f\u8bbe\u8ba1\u5e08\uff0c\u56e0\u884c\u4e1a\uff08\u201c\u7531\u4e91\u7aef\u8dcc\u8c37\u5e95\u201d\uff09\u548c\u4e2a\u4eba\u539f\u56e0\uff08\u201c\u521a\u521a\u79bb\u5f00\u201d\u5de5\u4f5c\u5c97\u4f4d\uff09\u8fdb\u5165\u7a7a\u7a97\u671f\uff0c\u9700\u8981\u65b0\u7684\u793e\u4f1a\u89d2\u8272\u548c\u793e\u7fa4\u5f52\u5c5e\u6765\u586b\u8865\u7a7a\u767d\uff0c\u5e76\u6e34\u671b\u901a\u8fc7\u65b0\u6280\u80fd\u83b7\u5f97\u8ba4\u53ef\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u3001\u88ab\u9700\u8981\u3001\u88ab\u56e2\u961f\u63a5\u7eb3\u201d\u7684\u5708\u5c42\u8ba4\u540c\u611f**\u3002\u7528\u6237\u5bf9\u9500\u552e/\u73ed\u4e3b\u4efb\u8868\u73b0\u51fa\u6781\u9ad8\u7684\u60c5\u611f\u4f9d\u8d56\uff08\u201c\u62b1\u7d27\u5e08\u59d0\u5927\u817f\u4e0d\u653e\u201d\u3001\u201c\u540e\u9762\u4f60\u4e0d\u5e26\u6211\u4e86\u5417\uff1f[\u6d41\u6cea]\u201d\uff09\uff0c\u5e76\u53cd\u590d\u5f3a\u8c03\u559c\u6b22\u201c\u6c1b\u56f4\u540c\u9891\u201d\uff0c\u8fd9\u8fdc\u8d85\u51fa\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u672c\u8eab\u7684\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T7 \u72c2\u70ed\u6b7b\u5fe0\u7c89** (\u9ad8\u60c5\u611f\u9ecf\u6027\u3001\u9ad8\u793e\u4ea4\u9700\u6c42\u3001\u9ad8\u590d\u8d2d\u6f5c\u529b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4f4e** | \u5bb6\u5ead\u652f\u6301\u5ea6\u9ad8\uff0c\u65e0\u6b64\u98ce\u9669\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u65f6\u95f4\u5b89\u6392\u6e05\u6670\uff0c\u81ea\u5f8b\u6027\u9ad8\uff0c\u4e14\u5bf9\u5b66\u4e60\u6709\u70ed\u60c5\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u5230\u95ee\u9898\u4e3b\u52a8\u6c42\u89e3\uff0c\u975e\u60c5\u7eea\u5316\u4eba\u683c\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u867d\u4e0d\u6025\u4e8e\u53d8\u73b0\uff0c\u4f46\u82e5\u957f\u671f\uff08\u59823-6\u4e2a\u6708\uff09\u65e0\u4efb\u4f55\u6b63\u5411\u53cd\u9988\uff08\u5982\u8bd5\u97f3\u673a\u4f1a\u3001\u793e\u7fa4\u4e92\u52a8\u51b7\u5374\uff09\uff0c\u5176\u201c\u88ab\u9700\u8981\u201d\u7684\u60c5\u611f\u9700\u6c42\u672a\u6ee1\u8db3\uff0c\u53ef\u80fd\u4ea7\u751f\u5931\u843d\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-3\u4e2a\u6708\u540e**\u3002\u82e5\u793e\u7fa4\u6c1b\u56f4\u51b7\u5374\u3001\u73ed\u4e3b\u4efb\u5173\u6000\u51cf\u5f31\u3001\u4e14\u672a\u83b7\u5f97\u4efb\u4f55\u5f62\u5f0f\u7684\u201c\u88ab\u770b\u89c1\u201d\uff08\u5982\u4f5c\u4e1a\u88ab\u70b9\u8bc4\u3001\u88ab\u9080\u8bf7\u53c2\u4e0e\u793e\u7fa4\u6d3b\u52a8\uff09\uff0c\u5176\u5f52\u5c5e\u611f\u9700\u6c42\u843d\u7a7a\uff0c\u53ef\u80fd\u65e0\u58f0\u6d41\u5931\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> **\u201cXX\u59d0/\u54e5\uff0c\u6b22\u8fce\u52a0\u5165\u54b1\u4eec\u7684\u2018\u58f0\u97f3\u5267\u7ec4\u2019\uff01\u6211\u770b\u4f60\u4ee5\u524d\u662f\u8bbe\u8ba1\u5e08\uff0c\u5ba1\u7f8e\u548c\u8282\u594f\u611f\u80af\u5b9a\u4e00\u6d41\uff0c\u54b1\u4eec\u73ed\u6b63\u7f3a\u4f60\u8fd9\u6837\u6709\u751f\u6d3b\u9605\u5386\u548c\u72ec\u7279\u89c6\u89d2\u7684\u2018\u827a\u672f\u603b\u76d1\u2019\u3002\u4ee5\u540e\u73ed\u91cc\u641e\u6d3b\u52a8\u3001\u9009\u672c\u5b50\uff0c\u4f60\u53ef\u5f97\u5e2e\u6211\u628a\u628a\u5173\uff01\u54b1\u4eec\u8fd9\u4e2a\u73ed\uff0c\u6280\u672f\u8981\u5b66\uff0c\u4f46\u66f4\u662f\u4e00\u4e2a\u597d\u73a9\u3001\u6709\u6e29\u5ea6\u7684\u5708\u5b50\uff0c\u4f60\u6765\u4e86\uff0c\u8fd9\u4e2a\u5708\u5b50\u5c31\u66f4\u5b8c\u6574\u4e86\u3002\u201d**\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf**\u3011\u3002\u91cd\u70b9\u4e0d\u662f\u201c\u5b66\u201d\uff0c\u800c\u662f\u201c\u53c2\u4e0e\u201d\u548c\u201c\u88ab\u9700\u8981\u201d\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u793e\u7fa4\u6c1b\u56f4\u7ec4\u6838\u5fc3\u6210\u5458\u8eab\u4efd**\u3011\u3002\u8d4b\u4e88\u5176\u975e\u6b63\u5f0f\u7684\u201c\u73ed\u59d4\u201d\u3001\u201c\u6d3b\u52a8\u7b56\u5212\u8005\u201d\u6216\u201c\u65b0\u5b66\u5458\u5f15\u8def\u4eba\u201d\u89d2\u8272\uff0c\u6ee1\u8db3\u5176\u5c0a\u91cd\u4e0e\u793e\u4ea4\u9700\u6c42\u3002\u3010**\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305**\u3011\u7684\u8f7b\u91cf\u7248\uff0c\u7528\u4e8e\u7ef4\u6301\u9ad8\u9891\u3001\u6709\u6e29\u5ea6\u76841v1\u79c1\u804a\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5c06\u5176\u89c6\u4e3a\u666e\u901a\u5b66\u5458\u8fdb\u884c\u673a\u68b0\u5316\u7ba1\u7406\u3002\u7981\u6b62\u7528\u51b0\u51b7\u7684\u4efb\u52a1\u6307\u4ee4\u66ff\u4ee3\u60c5\u611f\u8fde\u63a5\u3002\u7981\u6b62\u5728\u5176\u4e3b\u52a8\u63d0\u4f9b\u5e2e\u52a9\u6216\u5206\u4eab\u65f6\uff0c\u4ec5\u56de\u590d\u201c\u6536\u5230\u201d\u3001\u201c\u597d\u7684\u201d\u7b49\u6577\u884d\u6027\u8bdd\u8bed\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u5fc5\u987b\u4e0e\u201c\u8eab\u4efd\u5347\u7ea7\u201d\u7ed1\u5b9a**\u3002\u4f8b\u5982\uff0c\u5347\u5355\u9ad8\u9636\u8bfe\u7a0b\u65f6\u7684\u8bdd\u672f\u5e94\u4e3a\uff1a\u201cXX\u59d0\uff0c\u4ee5\u4f60\u7684\u9886\u609f\u529b\u548c\u70ed\u60c5\uff0c\u5b66\u5b8c\u57fa\u7840\u8bfe\u592a\u53ef\u60dc\u4e86\u3002\u54b1\u4eec\u9ad8\u9636\u73ed\u6709\u4e2a\u2018\u5b66\u957f/\u5b66\u59d0\u5e26\u6559\u2019\u8ba1\u5212\uff0c\u6211\u89c9\u5f97\u4f60\u7279\u522b\u9002\u5408\uff0c\u4e0d\u4ec5\u80fd\u81ea\u5df1\u7cbe\u8fdb\uff0c\u8fd8\u80fd\u5e26\u7740\u65b0\u540c\u5b66\u4e00\u8d77\u73a9\uff0c\u4f60\u8003\u8651\u4e0b\uff1f\u201d\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > **\u201c\u6211\u662f\u611f\u5174\u8da3\u3002\u4ee5\u540e\u591a\u6307\u6559\uff01\u201d** (\u5174\u8da3\u9a71\u52a8\uff0c\u59ff\u6001\u8c26\u548c)\n2. > **\u201c\u4e0d\u4e3a\u8d5a\u591a\u5c11\uff0c\u5148\u8bd5\u8bd5\u81ea\u5df1\u559c\u6b22\u54ea\u4e2a\uff0c\u6211\u662f\u89c9\u5f97\u597d\u73a9\uff0c\u800c\u4e14\u89c9\u5f97\u548c\u5e08\u59d0\u548c\u7c7d\u83f2\u8001\u5e08\u3001\u5de5\u4f5c\u5ba4\u6c1b\u56f4\u540c\u9891\uff0c\u5f88\u559c\u6b22\u3002\u201d** (\u6838\u5fc3\u9700\u6c42\u662f\u201c\u540c\u9891\u201d\u7684\u793e\u7fa4\u5f52\u5c5e\u611f)\n3. > **\u201c\u5e08\u59d0\uff0c\u540e\u9762\u4f60\u4e0d\u5e26\u6211\u4e86\u5417\uff1f[\u6d41\u6cea]\u201d** (\u5bf9\u9500\u552e/\u73ed\u4e3b\u4efb\u4ea7\u751f\u5f3a\u70c8\u60c5\u611f\u4f9d\u8d56\uff0c\u662f\u5178\u578b\u7684T7\u6b7b\u5fe0\u7c89\u7279\u5f81)\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T7 \u72c2\u70ed\u6b7b\u5fe0\u7c89\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u4e2d\u5e74\u8f6c\u578b\u671f\u627e\u5230\u4e00\u4e2a\u80fd\u63d0\u4f9b\u5f52\u5c5e\u611f\u3001\u5c0a\u91cd\u611f\u548c\u65b0\u793e\u4f1a\u89d2\u8272\u7684\u9ad8\u60c5\u611f\u8fde\u63a5\u793e\u7fa4\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5c06\u5176\u4ece\u201c\u5b66\u5458\u201d\u8eab\u4efd\u5347\u7ea7\u4e3a\u201c\u73ed\u7ea7\u5171\u5efa\u8005/\u6838\u5fc3\u5708\u5c42\u6210\u5458\u201d\uff0c\u6301\u7eed\u63d0\u4f9b\u60c5\u7eea\u4ef7\u503c\u548c\u88ab\u9700\u8981\u611f\u3011**\u3002\n\n```json\n{\"core_type\": \"T7 \u72c2\u70ed\u6b7b\u5fe0\u7c89\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u793e\u4ea4\u5f52\u5c5e\u4e0e\u5c0a\u91cd\u8ba4\u53ef\", \"target_product_line\": \"\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\", \"age\": \"\u4e2d\u5e74\uff08\u5177\u4f53\u672a\u77e5\uff0c\u81ea\u79f0\u73ed\u7ea7\u91cc\u5c81\u6570\u7a0d\u5927\uff09\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
