    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a\u4e2d\u7b49\u3002\u7528\u6237\u8868\u8fbe\u4e86\u201c\u633a\u60f3\u7684\uff0c\u6253\u7b97\u8bd5\u8bd5\u770b\u201d\u7684\u5174\u8da3\uff0c\u5e76\u5b8c\u6210\u4e86\u62db\u52df\u8425\u6240\u6709\u4efb\u52a1\uff0c\u8868\u73b0\u51fa\u5b66\u4e60\u610f\u613f\u3002\u4f46\u52a8\u673a\u66f4\u591a\u6e90\u4e8e\u5bf9\u201c\u517c\u804c\u53d8\u73b0\u201d\u3001\u201c\u63a5\u5355\u201d\u7b49\u7ecf\u6d4e\u6536\u76ca\u7684\u5438\u5f15\uff0c\u5bf9\u884c\u4e1a\u96be\u5ea6\u548c\u81ea\u8eab\u6295\u5165\u7684\u8ba4\u77e5\u53ef\u80fd\u4e0d\u8db3\uff08\u5982\u62c5\u5fc3\u65b0\u624b\u62a2\u4e0d\u5230\u5355\uff09\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a\u8f83\u4f4e\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u7528\u6237\u7684\u804c\u4e1a\u3001\u5b66\u5386\u3001\u7ecf\u6d4e\u72b6\u51b5\u3001\u53ef\u7528\u65f6\u95f4\u7b49\u5173\u952e\u80cc\u666f\u4fe1\u606f\u3002\u4ec5\u77e5\u5176\u201c\u56de\u6d88\u606f\u6709\u4e9b\u6162\u201d\uff0c\u53ef\u80fd\u65f6\u95f4\u4e0d\u56fa\u5b9a\u3002**\u4fe1\u606f\u4e25\u91cd\u4e0d\u8db3**\uff0c\u65e0\u6cd5\u8bc4\u4f30\u5176\u5b66\u4e60\u65f6\u95f4\u3001\u8bbe\u5907\u3001\u7ecf\u6d4e\u652f\u4ed8\u80fd\u529b\u7b49\u57fa\u7840\u8d44\u6e90\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a\u4e2d\u7b49\u504f\u9ad8\u3002\u7528\u6237\u80fd\u4e3b\u52a8\u53cd\u9988\u7ec3\u4e60\u4e2d\u7684\u56f0\u96be\uff08\u201c\u4e00\u53e3\u6c14\u8bfb\u4e0d\u4e86\u592a\u591a\u201d\u3001\u201c\u5589\u5499\u5e72\u201d\u3001\u201c\u5ff5\u5230\u540e\u9762\u4f1a\u8d8a\u6765\u8d8a\u5feb\uff0c\u4e5f\u4f1a\u5361\u58f3\u201d\uff09\uff0c\u5e76\u5728\u9500\u552e\u9f13\u52b1\u4e0b\u6301\u7eed\u8ddf\u8fdb\u4efb\u52a1\uff0c\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u575a\u6301\u6027\u548c\u914d\u5408\u5ea6\u3002\u4f46\u5bf9\u672a\u6765\u63a5\u5355\u7ade\u4e89\u8868\u73b0\u51fa\u62c5\u5fe7\uff0c\u5b58\u5728\u4e00\u5b9a\u7126\u8651\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u5df2\u652f\u4ed8\u3002\u7528\u6237\u63d0\u4f9b\u4e86\u8ba2\u5355\u7f16\u53f7 `202604084001616007941376349`\uff0c\u5e76\u5df2\u8fdb\u5165\u73ed\u7ea7\u7fa4\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u5168\u7a0b\u4e3a\u4e2a\u4eba\u4e0e\u9500\u552e\u6c9f\u901a\uff0c\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u6210\u5458\u6216\u51b3\u7b56\u76f8\u5173\u65b9\u3002\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u4e3a\u72ec\u7acb\u51b3\u7b56\u3002\n*   **\u6b65\u9aa41-4\u5224\u5b9a**\uff1a\u57fa\u4e8e\u73b0\u6709\u4fe1\u606f\uff0c\u7528\u6237\u8868\u73b0\u51fa\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\uff08\u5b8c\u6210\u6253\u5361\u3001\u4f5c\u4e1a\uff09\uff0c\u4f46\u8d44\u6e90\u5e95\u5ea7\u4e0d\u660e\uff0c\u52a8\u673a\u4e2d\u201c\u53d8\u73b0\u201d\u9a71\u52a8\u660e\u663e\u3002\u521d\u6b65\u503e\u5411 **B\u7c7b\uff08\u6447\u6446\u89c2\u671b\u578b\uff09** \u6216 **C\u7c7b\uff08\u51b2\u52a8\u5c1d\u9c9c\u578b\uff09**\uff0c\u56e0\u7f3a\u4e4f\u5bb6\u5ead\u4e0e\u8d44\u6e90\u4fe1\u606f\uff0c\u7f6e\u4fe1\u5ea6\u8f83\u4f4e\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**\uff1a**T5 \u517c\u804c\u53d8\u73b0\u63a2\u7d22\u8005**\u3002\n    *   **\u4f9d\u636e**\uff1a\u6838\u5fc3\u9a71\u52a8\u529b\u4e3a\u517c\u804c\u589e\u6536\uff08\u201c\u6253\u7b97\u8bd5\u8bd5\u770b\u201d\uff09\uff0c\u5bf9\u201c\u8bd5\u97f3\u201d\u3001\u201c\u63a5\u5355\u201d\u3001\u201c\u65f6\u85aa\u201d\u7b49\u5173\u952e\u8bcd\u6709\u56de\u5e94\u3002\u80fd\u5b8c\u6210\u57fa\u672c\u5b66\u4e60\u4efb\u52a1\uff0c\u4f46\u5bf9\u884c\u4e1a\u7ade\u4e89\u6709\u73b0\u5b9e\u62c5\u5fe7\uff0c\u7b26\u5408T5\u201c\u5173\u6ce8\u77ed\u671f\u53d8\u73b0\u3001\u6613\u56e0\u73b0\u5b9e\u963b\u529b\u653e\u5f03\u201d\u7684\u7279\u5f81\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669\u7b49\u7ea7**\uff1a**\u4e2d**\u3002\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa\u201c\u65f6\u85aa90-300\u201d\u3001\u201c\u788e\u7247\u65f6\u95f4\u5f55\u4e66\uff0c\u7efc\u5408\u6536\u5165\u5927\u6982\u57281W\u5de6\u53f3\u201d\uff0c\u6781\u6613\u5f15\u53d1\u7528\u6237\u5bf9\u5b66\u4e60\u540e\u53d8\u73b0\u96be\u5ea6\u548c\u6536\u5165\u7684\u843d\u5dee\u611f\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u652f\u4ed8\u538b\u529b\u6216\u8bfe\u7a0b\u4ef7\u683c\u8ba8\u8bba\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u201c\u56de\u6d88\u606f\u6709\u4e9b\u6162\u201d\uff0c\u6697\u793a\u65f6\u95f4\u53ef\u80fd\u4e0d\u5145\u88d5\u3002\u6b63\u5f0f\u8bfe\u7a0b\u5f00\u59cb\u540e\uff0c\u82e5\u4e0e\u5de5\u4f5c/\u751f\u6d3b\u51b2\u7a81\uff0c\u6613\u4ea7\u751f\u9000\u8d39\u5ff5\u5934\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u3002\n    5.  **\u9500\u552e\u8bef\u5bfc**\uff1a**\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u8bdd\u672f\u5b58\u5728**\u5938\u5927\u5ba3\u4f20\u548c\u5236\u9020\u7a00\u7f3a\u7d27\u8feb\u611f**\uff08\u5982\u201c\u9632\u6b62\u4ee5\u540e\u7ed9\u4f60\u4e66\u4f60\u65ad\u66f4\uff0c\u4f60\u6d88\u5931\uff01\u201d\u3001\u201c\u6ca1\u53e3\u4ee4\u53d6\u6d88\u62db\u52df\u8d44\u683c\uff01\u201d\u3001\u201c\u73b0\u573a\u53d1\u2018\u4f18\u60e0\u5238\u2019\u201d\u3001\u201c\u540d\u989d\u5df2\u7ecf\u5360\u4e0b\u201d\uff09\uff0c\u662f\u4e3b\u8981\u98ce\u9669\u70b9\u3002\n    6.  **\u4ea7\u54c1\u4e0d\u7b26**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u201c\u65b0\u624b\u62a2\u5355\u201d\u7684\u62c5\u5fe7\u8868\u660e\u5176\u5bf9\u5e02\u573a\u7ade\u4e89\u6709\u521d\u6b65\u8ba4\u77e5\uff0c\u82e5\u6b63\u5f0f\u8bfe\u7a0b\u65e0\u6cd5\u5feb\u901f\u6ee1\u8db3\u5176\u63a5\u5355\u9884\u671f\uff0c\u53ef\u80fd\u8ba4\u4e3a\u4ea7\u54c1\u4e0e\u5ba3\u4f20\u4e0d\u7b26\u3002\n    7.  **\u670d\u52a1\u4f53\u9a8c**\uff1a\u76ee\u524d\u670d\u52a1\u4f53\u9a8c\u5c1a\u53ef\uff0c\u9500\u552e\u8ddf\u8fdb\u7d27\u5bc6\u3002\u98ce\u9669\u4e3b\u8981\u770b\u540e\u7eed\u73ed\u4e3b\u4efb\u670d\u52a1\u4e0e\u8d44\u6e90\u5bf9\u63a5\u662f\u5426\u987a\u7545\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5b58\u5728\u4e25\u91cd\u4e0d\u5408\u89c4\u884c\u4e3a**\uff1a\n    *   **\u5938\u5927\u6536\u76ca\u627f\u8bfa**\uff1a\u660e\u786e\u63d0\u53ca\u5177\u4f53\u6536\u5165\u6848\u4f8b\uff08\u201c\u524d\u5e74\u521a\u5165\u884c\u7684\uff0c\u5e72\u4e863\u4e2a\u6708\u540e\u8f6c\u5168\u804c\u4e86\u201d\u3001\u201c\u7efc\u5408\u6536\u5165\u5927\u6982\u57281W\u5de6\u53f3\u201d\uff09\u548c\u65f6\u85aa\u8303\u56f4\uff08\u201c\u65f6\u85aa90-300\u201d\uff09\uff0c\u8fdd\u53cd\u5173\u4e8e\u7981\u6b62\u627f\u8bfa\u5177\u4f53\u6536\u76ca\u7684\u5408\u89c4\u8981\u6c42\u3002\n    *   **\u5236\u9020\u865a\u5047\u7d27\u8feb**\uff1a\u9891\u7e41\u4f7f\u7528\u201c\u53d6\u6d88\u8d44\u683c\u201d\u3001\u201c\u6700\u540e\u4e00\u6b21\u201d\u3001\u201c\u73b0\u573a\u6388\u6743\u201d\u7b49\u8bdd\u672f\uff0c\u8425\u9020\u7a00\u7f3a\u5047\u8c61\u3002\n    *   **\u8fc7\u5ea6\u8bf1\u5bfc**\uff1a\u5229\u7528\u201c\u901a\u5173\u201d\u3001\u201c\u89e3\u9501\u201d\u3001\u201c\u798f\u5229\u201d\u3001\u201c\u72ec\u5bb6\u8d44\u6e90\u201d\u7b49\u8bcd\u6c47\u8fdb\u884c\u60c5\u611f\u7ed1\u5b9a\u548c\u8bf1\u5bfc\u3002\n*   **\u4f26\u7406\u9632\u7ebf**\uff1a\u9500\u552e\u8fc7\u7a0b\u4ee5\u201c\u53d8\u73b0\u201d\u4e3a\u6838\u5fc3\u9a71\u52a8\u529b\uff0c\u5bf9\u884c\u4e1a\u957f\u671f\u53d1\u5c55\u3001\u6280\u80fd\u6df1\u5ea6\u79ef\u7d2f\u3001\u827a\u672f\u8ffd\u6c42\u7b49\u4ef7\u503c\u5f15\u5bfc\u4e0d\u8db3\uff0c**\u7528\u6237\u7684\u5b66\u4e60\u52a8\u673a\u5efa\u7acb\u5728\u8106\u5f31\u7684\u201c\u5feb\u901f\u53d8\u73b0\u201d\u9884\u671f\u4e0a**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**\uff1a**\u504f\u5dee**\u3002\u7528\u6237\u4e3a\u201c\u517c\u804c\u53d8\u73b0\u63a2\u7d22\u8005\u201d\uff08T5\uff09\uff0c\u6838\u5fc3\u8bc9\u6c42\u662f\u4f4e\u95e8\u69db\u3001\u5feb\u89c1\u6548\u7684\u517c\u804c\u673a\u4f1a\u3002\u800c\u201c\u6500\u767b\u8ba1\u5212\u201d\u4f5c\u4e3a\u56db\u4e2a\u6708\u7cfb\u7edf\u8bfe\uff0c\u5c5e\u4e8e\u91cd\u6295\u5165\u3001\u957f\u5468\u671f\u7684\u6df1\u5ea6\u4ea7\u54c1\uff0c\u4e0e\u7528\u6237\u5f53\u524d\u7684\u8f7b\u91cf\u3001\u5feb\u901f\u53d8\u73b0\u9884\u671f\u5b58\u5728**\u6f5c\u5728\u9519\u914d**\u3002\u7528\u6237\u53ef\u80fd\u671f\u5f85\u7684\u662f\u66f4\u76f4\u63a5\u7684\u8bd5\u97f3\u6e20\u9053\u6216\u8f7b\u91cf\u8bad\u7ec3\u8425\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**24\u5c0f\u65f6\u5185\u8fdb\u884c\u9884\u671f\u7ba1\u7406\u4e0e\u98ce\u9669\u6c9f\u901a**\u3002\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u7d27\u6025\u9884\u671f\u6821\u6b63**\uff1a\u9996\u5468\u5185\u5fc5\u987b\u8fdb\u884c\u4e00\u5bf9\u4e00\u6c9f\u901a\uff0c**\u660e\u786e\u6f84\u6e05**\u884c\u4e1a\u771f\u5b9e\u6536\u5165\u5468\u671f\u3001\u65b0\u624b\u7ade\u4e89\u73b0\u72b6\u3001\u7cfb\u7edf\u5b66\u4e60\u7684\u5fc5\u8981\u6027\uff0c\u964d\u4f4e\u5176\u4e0d\u5207\u5b9e\u9645\u7684\u201c\u901f\u6210\u53d8\u73b0\u201d\u9884\u671f\u3002\u5f15\u7528\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa\u7684\u8bdd\u672f\u8fdb\u884c\u6e29\u548c\u4fee\u6b63\u3002\n    2.  **\u6316\u6398\u771f\u5b9e\u8d44\u6e90\u4e0e\u52a8\u673a**\uff1a\u5c3d\u5feb\u4e86\u89e3\u7528\u6237\u7684\u804c\u4e1a\u3001\u6bcf\u65e5\u53ef\u56fa\u5b9a\u5b66\u4e60\u65f6\u957f\u3001\u53ef\u7528\u8bbe\u5907\u3001\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\uff0c\u8bc4\u4f30\u5176\u80fd\u5426\u652f\u64914\u4e2a\u6708\u7684\u7cfb\u7edf\u5b66\u4e60\u3002\n    3.  **\u5f3a\u5316\u8fc7\u7a0b\u4ef7\u503c**\uff1a\u5728\u670d\u52a1\u4e2d\uff0c\u591a\u5f3a\u8c03\u6280\u80fd\u63d0\u5347\u3001\u4e2a\u4eba\u6210\u957f\u3001\u5708\u5b50\u878d\u5165\u7b49\u957f\u671f\u4ef7\u503c\uff0c\u800c\u4e0d\u4ec5\u4ec5\u662f\u63a5\u5355\u3002\u5f15\u5bfc\u7528\u6237\u5173\u6ce8\u5b66\u4e60\u672c\u8eab\u7684\u6536\u83b7\u3002\n    4.  **\u63d0\u4f9b\u5373\u65f6\u6b63\u53cd\u9988**\uff1a\u5728\u8bfe\u7a0b\u521d\u671f\uff0c\u8bbe\u8ba1\u4e00\u4e9b\u80fd\u5feb\u901f\u83b7\u5f97\u6210\u5c31\u611f\u7684\u5c0f\u4efb\u52a1\u6216\u53cd\u9988\uff08\u5982\u58f0\u97f3\u8bca\u65ad\u3001\u7247\u6bb5\u70b9\u8bc4\uff09\uff0c\u5f25\u8865\u5176\u201c\u53d8\u73b0\u201d\u53cd\u9988\u7684\u5ef6\u8fdf\u3002\n    5.  **\u98ce\u9669\u76d1\u63a7**\uff1a\u5c06\u8be5\u7528\u6237\u6807\u8bb0\u4e3a\u201c\u9ad8\u9884\u671f\u7ba1\u7406\u201d\u5bf9\u8c61\uff0c\u5bc6\u5207\u5173\u6ce8\u5176\u524d\u4e24\u5468\u7684\u5b66\u4e60\u6295\u5165\u5ea6\u548c\u60c5\u7eea\u53d8\u5316\uff0c\u5bf9\u4efb\u4f55\u5173\u4e8e\u201c\u63a5\u5355\u6162\u201d\u3001\u201c\u6ca1\u65f6\u95f4\u201d\u7684\u62b1\u6028\u9700\u7acb\u5373\u54cd\u5e94\u3002\n\n{\"core_type\": \"T5 \u517c\u804c\u53d8\u73b0\u63a2\u7d22\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"24\u5c0f\u65f6\u5185\u8fdb\u884c\u9884\u671f\u7ba1\u7406\u4e0e\u98ce\u9669\u6c9f\u901a\"}";
