        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676395816 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-02-28 \u81f3 2026-03-06 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u82b1\u82b1\u82b1\u3001\u5a01\u5ec9(\u738b\u9633)\u3001\u51c0\u6d77\u5c0f\u9c7c(\u9648\u8389) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66/AI\u77ed\u89c6\u9891\u7b49\u526f\u4e1a\u6280\u80fd\u57f9\u8bad\u8fdb\u9636\u8bfe\u7a0b\uff08\u63a8\u6d4b\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u4ef7\u683c\u3001\u8d44\u91d1\u6765\u6e90\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u672a\u63d0\u53ca\u5de5\u4f5c\u3001\u5bb6\u5ead\u3001\u65f6\u95f4\u5b89\u6392\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u672a\u63d0\u53ca\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u5173\u952e\u4e09\u8f74\u4fe1\u606f\uff08\u8d44\u91d1\u3001\u65f6\u95f4\u3001\u5bb6\u5ead\uff09\u51e0\u4e4e\u4e3a\u96f6\uff0c\u5224\u65ad\u4e3b\u8981\u57fa\u4e8e\u6709\u9650\u7684\u793e\u4ea4\u4e0e\u5b66\u4e60\u884c\u4e3a\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u5174\u8da3\u548c\u793e\u7fa4\u5f52\u5c5e\u800c\u6765\uff0c\u5b66\u4e60\u8fc7\u7a0b\u8f7b\u677e\uff0c\u65e0\u53d8\u73b0\u7126\u8651\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u6211\u6413\u5b8c\u4e86 \u53d1\u7ed9\u82b1\u82b1\u4e86 \u3002\u8bf4\u7b49\u4e0b\u6b21\u4e00\u8d77 \u6ca1\u5173\u7cfb \uff5e\u201d\n> \u201c\u4ec0\u4e48\u65f6\u5019\u53ef\u4ee5\u4e5f\u7ed9\u6211\u4e2a\u5c0f\u89d2\u8272\u73a9\u73a9\u201d\n> \u201c\u6211\u5f97\u81ea\u5df1\u7ec3\u591a\u4f1a \u627e\u56de\u611f\u89c9 \u624d\u6562\u53d1\u7ed9\u4f60\u542c\u542c \u51f6\u6211\u6211\u4e5f\u4f1a\u54ed\u7684 \u54c8\u54c8\u54c8\u54c8\u54c8\u54c8\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u65e0\u4efb\u4f55\u652f\u4ed8\u3001\u4ef7\u683c\u3001\u7ecf\u6d4e\u72b6\u51b5\u4fe1\u606f\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u65e0\u5de5\u4f5c\u3001\u4f5c\u606f\u3001\u5bb6\u5ead\u8d1f\u62c5\u4fe1\u606f\u3002\u4f46\u7528\u6237\u80fd\u201c\u71ac\u591c\u52304\u70b9\u201d\u770b\u7fa4\u804a\uff0c\u4e14\u80fd\u5b8c\u6210\u4f5c\u4e1a\uff0c\u63a8\u6d4b\u6709\u4e00\u5b9a\u7a7a\u95f2\u65f6\u95f4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u65e0\u4efb\u4f55\u63d0\u53ca\u3002\n- **\u5e95\u5ea7\u53d6\u77ed\u677f**\uff1a**\u4e2d**\u3002\u56e0\u5173\u952e\u4fe1\u606f\u7f3a\u5931\uff0c\u65e0\u6cd5\u8bc4\u4f30\u4e3a\u201c\u9ad8\u201d\uff1b\u4f46\u57fa\u4e8e\u5176\u6d3b\u8dc3\u7684\u5b66\u4e60\u548c\u793e\u4ea4\u884c\u4e3a\uff0c\u6682\u4e0d\u5f52\u4e3a\u201c\u4f4e\u201d\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\uff0c\u5fc3\u6001\u8f7b\u677e\uff0c\u80fd\u4e3b\u52a8\u6c42\u52a9\u5e76\u81ea\u6211\u8c03\u4f83\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u597d\u4e45\u6ca1\u5f00\u8fc7\u55d3 \u6211\u611f\u89c9 \u6211\u6709\u70b9\u4e0d\u4f1a \u8bfb\u7684\u65f6\u5019 \u6211\u7684\u820c\u5934 \u597d\u50cf\u6253\u7ed3\u4e86[\u82e6\u6da9]\u548b\u641e\u52d2\u201d \uff08\u9047\u5230\u95ee\u9898\uff0c\u4e3b\u52a8\u5bfb\u6c42\u5177\u4f53\u89e3\u51b3\u65b9\u6cd5\uff09\n> \u201c\u6211\u5f97\u81ea\u5df1\u7ec3\u591a\u4f1a \u627e\u56de\u611f\u89c9 \u624d\u6562\u53d1\u7ed9\u4f60\u542c\u542c \u51f6\u6211\u6211\u4e5f\u4f1a\u54ed\u7684 \u54c8\u54c8\u54c8\u54c8\u54c8\u54c8\u201d \uff08\u4ee5\u73a9\u7b11\u65b9\u5f0f\u8868\u8fbe\u7d27\u5f20\uff0c\u800c\u975e\u5d29\u6e83\uff09\n> \u201c\u6211\u4ec0\u4e48\u90fd\u4e0d\u662f \u53ef\u4ee5\u4e0d\u81ea\u6211\u4ecb\u7ecd\u5417 \u54c8\u54c8\u54c8\u54c8\u201d \uff08\u7528\u81ea\u5632\u5316\u89e3\u793e\u4ea4\u538b\u529b\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34** + **\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5f3a\u70c8\u7684\u793e\u7fa4\u878d\u5165\u6e34\u671b\u4e0e\u81ea\u6211\u4ef7\u503c\u786e\u8ba4\u9700\u6c42\u3002\u5979\u901a\u8fc7\u5e7d\u9ed8\u3001\u81ea\u5632\u3001\u79ef\u6781\u4e92\u52a8\u6765\u5bfb\u6c42\u5728\u7fa4\u4f53\u4e2d\u7684\u5b58\u5728\u611f\u548c\u8ba4\u53ef\uff0c\u5bb3\u6015\u88ab\u5ffd\u89c6\uff08\u201c\u53c8\u88ab\u9057\u5fd8\u4e86\u662f\u4e0d\u662f\u201d\uff09\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u8425\u9020\u4e00\u4e2a\u6e29\u6696\u3001\u6709\u8da3\u3001\u6709\u5f52\u5c5e\u611f\u7684\u201c\u73a9\u4f34\u201d\u793e\u7fa4**\uff0c\u8ba9\u5979\u611f\u5230\u88ab\u770b\u89c1\u3001\u88ab\u63a5\u7eb3\u3001\u88ab\u9700\u8981\u3002\u7ed9\u4e88\u5979\u201c\u5c0f\u89d2\u8272\u201d\u6216\u201c\u73ed\u59d4\u201d\u7b49\u8eab\u4efd\u6807\u7b7e\uff0c\u6ee1\u8db3\u5176\u88ab\u5c0a\u91cd\u7684\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfea C1\u7c7b\uff08\u60c5\u7eea\u6d88\u8d39\u578b\uff09** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T5 \u597d\u73a9\u5c1d\u9c9c\u578b** (\u793e\u4ea4\u9a71\u52a8\uff0c\u5174\u8da3\u5bfc\u5411\uff0c\u7ecf\u6d4e\u65e0\u538b\u611f) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4f4e** | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u56e0\u5176\u793e\u4ea4\u9a71\u52a8\uff0c\u5bb6\u5ead\u53cd\u5bf9\u98ce\u9669\u76f8\u5bf9\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u7528\u6237\u4e3b\u52a8\u6027\u5f3a\uff0c\u80fd\u71ac\u591c\u53c2\u4e0e\u793e\u7fa4\uff0c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u770b\u4f3c\u5c1a\u53ef\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u5584\u4e8e\u7528\u5e7d\u9ed8\u5316\u89e3\u538b\u529b\uff0c\u975e\u60c5\u7eea\u5de8\u5a74\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4f4e** | \u52a8\u673a\u7eaf\u5ea6\u9ad8\uff0c\u4e3a\u5174\u8da3\u548c\u793e\u4ea4\u800c\u6765\uff0c\u5bf9\u77ed\u671f\u53d8\u73b0\u65e0\u5f3a\u70c8\u671f\u5f85\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-4\u5468\u540e**\u3002\u82e5\u793e\u7fa4\u6c1b\u56f4\u51b7\u5374\u3001\u4e92\u52a8\u51cf\u5c11\uff0c\u6216\u8bfe\u7a0b\u5185\u5bb9\u53d8\u5f97\u67af\u71e5\u3001\u4f5c\u4e1a\u538b\u529b\u589e\u5927\uff0c\u5176\u793e\u4ea4\u548c\u8da3\u5473\u6027\u9700\u6c42\u5f97\u4e0d\u5230\u6ee1\u8db3\u65f6\uff0c\u53ef\u80fd\u56e0\u201c\u65e0\u804a\u201d\u6216\u201c\u6ca1\u610f\u601d\u201d\u800c\u6d41\u5931\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u54c8\u54c8\uff0c\u770b\u5230\u4f60\u5728\u7fa4\u91cc\u7279\u522b\u6d3b\u8dc3\uff0c\u662f\u6211\u4eec\u7684\u5f00\u5fc3\u679c\u6ca1\u9519\u4e86\uff01\u54b1\u4eec\u8fd9\u4e2a\u73ed\u5c31\u7f3a\u4f60\u8fd9\u6837\u80fd\u5e26\u6c14\u6c1b\u7684\u2018\u620f\u7cbe\u2019\u3002\u4ee5\u540e\u6709\u2018\u5c0f\u89d2\u8272\u2019\u6216\u8005\u597d\u73a9\u7684\u6d3b\u52a8\uff0c\u7b2c\u4e00\u4e2a@\u4f60\uff01\u4e00\u8d77\u73a9\u7740\u5c31\u628a\u672c\u4e8b\u5b66\u4e86\uff0c\u600e\u4e48\u6837\uff1f\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5174\u8da3\u6e38\u4e50\u7ebf**\u3011\u3002\u6838\u5fc3\u662f\u201c\u73a9\u4e2d\u5b66\u201d\uff0c\u5f31\u5316\u786c\u6838\u6280\u80fd\u548c\u53d8\u73b0\u538b\u529b\uff0c\u5f3a\u5316\u793e\u7fa4\u4e92\u52a8\u3001\u8da3\u5473\u6d3b\u52a8\u3001\u58f0\u97f3\u6e38\u620f\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u793e\u7fa4\u6c1b\u56f4\u5b98\u6fc0\u52b1\u5305**\u3011\u3002\u8d4b\u4e88\u5176\u201c\u6c14\u6c1b\u7ec4\u7ec4\u957f\u201d\u3001\u201c\u620f\u7cbe\u76f2\u76d2\u4f53\u9a8c\u5b98\u201d\u7b49\u975e\u6b63\u5f0f\u5934\u8854\uff0c\u9f13\u52b1\u5176\u7ec4\u7ec7\u8bdd\u9898\u3001\u5e26\u52a8\u4e92\u52a8\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5bf9\u5979\u4f7f\u7528\u4e25\u8083\u3001\u9ad8\u538b\u7684\u201c\u641e\u94b1\u201d\u8bdd\u672f\u6216\u5e03\u7f6e\u8fc7\u4e8e\u67af\u71e5\u3001\u7e41\u91cd\u7684\u786c\u6838\u4f5c\u4e1a\u3002\u4e0d\u8981\u5ffd\u89c6\u5979\u5728\u7fa4\u91cc\u7684\u53d1\u8a00\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u76f4\u63a5\u5347\u5355**\u3002\u5982\u9700\u8f6c\u5316\uff0c\u5fc5\u987b\u57fa\u4e8e\u5176\u5174\u8da3\u70b9\uff08\u5982\u201c\u5c0f\u89d2\u8272\u201d\u914d\u97f3\u673a\u4f1a\u3001\u8da3\u5473\u914d\u97f3\u6bd4\u8d5b\u5956\u54c1\u7b49\uff09\u8bbe\u8ba1\u8f7b\u91cf\u7ea7\u3001\u6e38\u620f\u5316\u7684\u4ea7\u54c1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u4ec0\u4e48\u90fd\u4e0d\u662f \u53ef\u4ee5\u4e0d\u81ea\u6211\u4ecb\u7ecd\u5417 \u54c8\u54c8\u54c8\u54c8\u201d \uff08\u793e\u4ea4\u9700\u6c42\u4e0e\u81ea\u5632\u5f0f\u5bfb\u6c42\u8ba4\u53ef\uff09\n2. > \u201c\u4ec0\u4e48\u65f6\u5019\u53ef\u4ee5\u4e5f\u7ed9\u6211\u4e2a\u5c0f\u89d2\u8272\u73a9\u73a9\u201d \uff08\u5174\u8da3\u9a71\u52a8\uff0c\u5bfb\u6c42\u53c2\u4e0e\u611f\u548c\u4ef7\u503c\u611f\uff09\n3. > \u201c\u6211\u53c8\u88ab\u9057\u5fd8\u4e86\u662f\u4e0d\u662f\u201d \uff08\u5bb3\u6015\u88ab\u793e\u7fa4\u5ffd\u89c6\uff0c\u6e34\u671b\u88ab\u770b\u89c1\uff09\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T5\u597d\u73a9\u5c1d\u9c9c\u578b**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u793e\u7fa4\u5f52\u5c5e\u4e0e\u8da3\u5473\u8ba4\u540c**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4f4e**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u6301\u7eed\u63d0\u4f9b\u6709\u8da3\u3001\u6709\u6e29\u5ea6\u7684\u793e\u7fa4\u4e92\u52a8\u4f53\u9a8c\uff0c\u8ba9\u5979\u201c\u73a9\u201d\u4e0b\u53bb**\u3002\n\n```json\n{\"core_type\": \"T5 \u597d\u73a9\u5c1d\u9c9c\u578b\", \"maslow_need\": \"\u793e\u4ea4/\u5c0a\u91cd\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf\"}\n```";
