        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 33237138 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6696\u6696\uff08\u6768\u68a6\u5b87\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u9ad8\u9636\u73ed\uff082\u4e2a\u6708\u8bfe\u7a0b\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u4ec5\u77e5\u7528\u6237\u5df2\u62a5\u540d\uff0c\u4f46\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u8d44\u91d1\u6765\u6e90\u3001\u4ef7\u683c\u53cd\u5e94\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u4ec5\u77e5\u7528\u6237\u4e3a\u517c\u804c\u610f\u5411\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u5de5\u4f5c\u6027\u8d28\u3001\u4f5c\u606f\u3001\u5bb6\u5ead\u8d1f\u62c5\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u672a\u63d0\u53ca\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u5173\u952e\u4e09\u8f74\u4fe1\u53f7\uff08\u8d44\u91d1\u3001\u65f6\u95f4\u3001\u5bb6\u5ead\u652f\u6301\uff09\u5b8c\u5168\u7a7a\u767d\uff0c\u4ec5\u80fd\u57fa\u4e8e\u6709\u9650\u884c\u4e3a\u8fdb\u884c\u63a8\u65ad\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u27a1\u4e2d\n- **\u7279\u5f81\u901f\u5199**\uff1a\u80fd\u529b\u6210\u957f\u4e0e\u517c\u804c\u53d8\u73b0\u6df7\u5408\u9a71\u52a8\u3002\u5bf9\u884c\u4e1a\u6709\u201c\u5c0f\u671f\u5f85\u201d\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u6781\u901f\u53d8\u73b0\u7684\u8feb\u5207\u6027\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u4e3b\u8981\u8fd8\u662f\u517c\u804c\u201d\uff1b\u201c\u610f\u4e49\u7684\u8bdd \u53ef\u80fd\u5c31\u662f\u60f3\u7a0d\u5fae\u6539\u53d8\u4e00\u4e0b\u73b0\u5728\u7684\u751f\u6d3b\u72b6\u6001\u5427\u201d\uff1b\u201c\u5bf9\u8fd9\u4e2a\u884c\u4e1a\u8fd8\u662f\u6709\u70b9\u5c0f\u671f\u5f85\u9102\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e (\u4fe1\u606f\u4e0d\u8db3\uff0c\u6309\u6700\u77ed\u677f\u539f\u5219\u6682\u5b9a)\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u65e0\u4efb\u4f55\u5173\u4e8e\u652f\u4ed8\u80fd\u529b\u3001\u7ecf\u6d4e\u72b6\u51b5\u7684\u5bf9\u8bdd\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u4ec5\u8868\u793a\u201c\u517c\u804c\u201d\uff0c\u4f46\u672a\u8bf4\u660e\u5177\u4f53\u5de5\u4f5c\u5236\u3001\u5bb6\u5ead\u8d1f\u62c5\u3001\u53ef\u7528\u5b66\u4e60\u65f6\u95f4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u672a\u63d0\u53ca\u5bb6\u4eba\uff0c\u65e0\u6cd5\u5224\u65ad\u3002\n- **\u5e95\u5ea7\u53d6\u77ed\u677f**\uff1a**\u4f4e**\u3002\u7531\u4e8e\u8d44\u91d1\u3001\u65f6\u95f4\u3001\u5bb6\u5ead\u652f\u6301\u4e09\u5927\u5173\u952e\u7ef4\u5ea6\u4fe1\u606f\u5b8c\u5168\u7f3a\u5931\uff0c\u4f9d\u636e\u201c\u4fe1\u606f\u4e0d\u8db3\u964d\u7ea7\u7f6e\u4fe1\u5ea6\u201d\u539f\u5219\uff0c**\u5fc5\u987b\u89c6\u4e3a\u9ad8\u98ce\u9669\u77ed\u677f**\uff0c\u6682\u5b9a\u4e3a\u201c\u4f4e\u201d\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\uff0c\u95ed\u73af\u6c42\u89e3\u3002\u9762\u5bf9\u9500\u552e\u63d0\u4f9b\u7684\u8bd5\u97f3\u673a\u4f1a\uff0c\u9009\u62e9\u201c\u6211\u8fd8\u662f\u518d\u5b66\u4e60\u4e00\u4e0b\u201d\uff0c\u8868\u73b0\u51fa\u8c28\u614e\u3001\u8e0f\u5b9e\u3001\u4e0d\u5192\u8fdb\u7684\u6001\u5ea6\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c[OK]\u6211\u8fd8\u662f\u518d\u5b66\u4e60\u4e00\u4e0b\u201d\uff1b\u201c\u5e08\u59d0 \u8fd9\u4e2a\u770b\u4e0d\u4e86\u5440\u201d\uff08\u53d1\u73b0\u95ee\u9898\uff0c\u5e73\u9759\u53cd\u9988\uff09\uff1b\u201c\u5e08\u59d0 \u90a3\u4e2a\u4fe9\u4e2a\u6708\u7684\u7801\u8fd8\u6709\u5417\u201d\uff08\u4e3b\u52a8\u8be2\u95ee\uff0c\u884c\u52a8\u529b\u5f3a\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u201c\u6539\u53d8\u73b0\u5728\u7684\u751f\u6d3b\u72b6\u6001\u201d\u6709\u671f\u5f85\uff0c\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u65b0\u6280\u80fd\u83b7\u5f97\u6210\u5c31\u611f\u548c\u81ea\u6211\u4ef7\u503c\u8ba4\u540c\uff0c\u6446\u8131\u53ef\u80fd\u5b58\u5728\u7684\u201c\u505c\u6ede\u611f\u201d\u6216\u201c\u4e0d\u88ab\u770b\u89c1\u201d\u7684\u72b6\u6001\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u5938\u5956\u80af\u5b9a\u4e0e\u201c\u88ab\u9009\u4e2d\u201d\u7684\u4e13\u5c5e\u611f**\u3002\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u770b\u597d\u4f60\u201d\u3001\u201c\u7ed9\u4f60\u5355\u72ec\u7533\u8bf7\u8d44\u6e90\u201d\u3001\u201c\u53ea\u5ba0\u81ea\u5df1\u7684\u5b66\u751f\u201d\uff0c\u7cbe\u51c6\u51fb\u4e2d\u4e86\u5176\u6e34\u671b\u88ab\u8ba4\u53ef\u3001\u88ab\u7279\u6b8a\u5bf9\u5f85\u7684\u5c0a\u91cd\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b\uff08\u51b2\u52a8\u98ce\u9669\u578b\uff09** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u578b** (\u503e\u5411) / **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u5f85\u89c2\u5bdf) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u804a\u5929\u8bb0\u5f55\u4e2d\u672a\u53d1\u73b0\u501f\u8d37\u3001\u751f\u5b58\u5371\u673a\u3001\u5bb6\u5ead\u6fc0\u70c8\u53cd\u5bf9\u7b49D\u7c7b\u7194\u65ad\u7ea2\u7ebf\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u9ad8** | **\u5173\u952e\u4fe1\u606f\u7f3a\u5931\uff01** \u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u3001\u8d44\u91d1\u6765\u6e90\u662f\u5426\u72ec\u7acb\u5b8c\u5168\u672a\u77e5\uff0c\u8fd9\u662f\u6700\u5927\u98ce\u9669\u70b9\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u82e5\u5b9e\u9645\u53ef\u7528\u65f6\u95f4\u4e0e\u627f\u8bfa\u7684\u201c\u517c\u804c\u53ef\u505a\u201d\u4e25\u91cd\u4e0d\u7b26\uff08\u5982\u591c\u73ed\u3001\u5e26\u5a03\uff09\uff0c\u6613\u56e0\u65e0\u6cd5\u8ddf\u8bfe\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u76ee\u524d\u8868\u73b0\u7406\u6027\u3001\u8e0f\u5b9e\uff0c\u5fc3\u7406\u5f39\u6027\u9ad8\u3002\u4f46\u82e5\u540e\u7eed\u5b66\u4e60\u9047\u5230\u6280\u672f\u74f6\u9888\u4e14\u5f97\u4e0d\u5230\u53ca\u65f6\u53cd\u9988\uff0c\u53ef\u80fd\u8f6c\u4e3a\u7126\u8651\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d\u9ad8** | \u4f5c\u4e3aT4\u539f\u578b\uff0c\u5bf9\u201c\u63a5\u5355\u8d5a\u94b1\u201d\u6709\u660e\u786e\u671f\u5f85\u3002\u82e5\u5f00\u8bfe\u540e\u53d1\u73b0\u53d8\u73b0\u8def\u5f84\u6f2b\u957f\u3001\u63a5\u5355\u56f0\u96be\uff0c\u6613\u4ea7\u751f\u201c\u88ab\u9a97\u201d\u611f\u3002\u9500\u552e\u5df2\u94fa\u57ab\u201c\u591a\u52b3\u591a\u5f97\u201d\u3001\u201c\u6162\u6162\u505a\u8d77\u6765\u201d\uff0c\u4f46\u7528\u6237\u9884\u671f\u4ecd\u9700\u4e25\u63a7\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-4\u5468**\u3002\u5f53\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u8fdb\u5165\u5b9e\u64cd\u548c\u63a5\u5355\u5c1d\u8bd5\u9636\u6bb5\uff0c\u82e5\u8fdb\u5c55\u7f13\u6162\u6216\u906d\u9047\u632b\u6298\uff0c\u7ed3\u5408\u53ef\u80fd\u7684\u5bb6\u5ead/\u65f6\u95f4\u538b\u529b\uff0c\u9000\u8d39\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cXX\u540c\u5b66\uff0c\u770b\u5230\u4f60\u5728\u4f53\u9a8c\u8425\u8e0f\u5b9e\u5b66\u4e60\u7684\u8bb0\u5f55\uff0c\u5e08\u59d0\u7279\u522b\u770b\u597d\u4f60\u3002\u54b1\u4eec\u4e0d\u8ffd\u6c42\u4e00\u6b65\u767b\u5929\uff0c\u6709\u58f0\u884c\u4e1a\u662f\u2018\u6162\u529f\u592b\u51fa\u7ec6\u6d3b\u2019\uff0c\u6211\u4f1a\u966a\u4f60\u4e00\u8d77\uff0c\u628a\u6bcf\u4e00\u6b65\u8d70\u7a33\u3002**\u4f60\u6bcf\u4e00\u70b9\u8fdb\u6b65\uff0c\u6211\u90fd\u4f1a\u770b\u5728\u773c\u91cc\u3002** \u54b1\u4eec\u5148\u5b9a\u4e2a\u5c0f\u76ee\u6807\uff0c\u6bd4\u5982\u8fd9\u5468\u641e\u5b9a\u4e00\u4e2a\u53d1\u58f0\u6280\u5de7\uff0c\u600e\u4e48\u6837\uff1f\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u3002\u4fa7\u91cd\u6280\u80fd\u6253\u78e8\u3001\u63a5\u5355\u6d41\u7a0b\u6559\u5b66\uff0c\u6ee1\u8db3\u5176\u201c\u6539\u53d8\u751f\u6d3b\u72b6\u6001\u201d\u7684\u52a1\u5b9e\u76ee\u6807\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176**\u5c0a\u91cd\u9700\u6c42**\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010**\u6210\u5c31\u8ba4\u53ef\u4f53\u7cfb\u5305**\u3011\uff1a\u5982\u5b66\u4e60\u52cb\u7ae0\u3001\u4f5c\u4e1a\u4e0a\u699c\u3001\u8001\u5e08\u4e00\u5bf9\u4e00\u8bed\u97f3\u70b9\u8bc4\u3001\u9636\u6bb5\u6027\u5b66\u4e60\u6210\u679c\u8bc1\u4e66\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u7edd\u4e0d\u53ef\u5938\u5927\u77ed\u671f\u6536\u76ca**\uff0c\u907f\u514d\u5236\u9020\u201c\u5b66\u5b8c\u7acb\u523b\u8d5a\u5927\u94b1\u201d\u7684\u5e7b\u89c9\u30022. \u907f\u514d\u4f7f\u7528\u201c\u5b9d\u5988\u7126\u8651\u201d\u3001\u201c\u624b\u5fc3\u5411\u4e0a\u201d\u7b49\u4e0b\u6c89PUA\u8bdd\u672f\uff0c\u8fd9\u4e0e\u4ed6\u7684\u5fc3\u7406\u72b6\u6001\u4e0d\u5339\u914d\u30023. \u5728\u5176\u672a\u4e3b\u52a8\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u524d\uff0c**\u4e25\u7981\u8ffd\u95ee\u201c\u5bb6\u4eba\u652f\u6301\u5417\u201d\u7b49\u53ef\u80fd\u5f15\u7206\u96f7\u533a\u7684\u95ee\u9898**\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5f62\u5f0f\u7684\u5347\u5355**\u3002\u5fc5\u987b\u5148\u5b8c\u6210\u201c\u5bb6\u5ead\u51b3\u7b56\u6743\u201d\u4e0e\u201c\u771f\u5b9e\u65f6\u95f4/\u8d44\u91d1\u201d\u6838\u67e5\uff0c\u4fe1\u606f\u8865\u9f50\u524d\uff0c\u9501\u5b9a\u5728\u5f53\u524d\u4ea7\u54c1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u610f\u4e49\u7684\u8bdd \u53ef\u80fd\u5c31\u662f\u60f3\u7a0d\u5fae\u6539\u53d8\u4e00\u4e0b\u73b0\u5728\u7684\u751f\u6d3b\u72b6\u6001\u5427**\u201d \u2014\u2014 \u66b4\u9732\u6838\u5fc3\u52a8\u673a\uff1a\u5bfb\u6c42\u6539\u53d8\u4e0e\u4ef7\u503c\u611f\uff08\u5c0a\u91cd\u9700\u6c42\uff09\u3002\n2. > \u201c**[OK]\u6211\u8fd8\u662f\u518d\u5b66\u4e60\u4e00\u4e0b**\u201d \u2014\u2014 \u9762\u5bf9\u8bd5\u97f3\u673a\u4f1a\u9009\u62e9\u8c28\u614e\u592f\u5b9e\u57fa\u7840\uff0c\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u975e\u51b2\u52a8\u578b\u3002\n3. > \u201c**\u5e08\u59d0 \u90a3\u4e2a\u4fe9\u4e2a\u6708\u7684\u7801\u8fd8\u6709\u5417**\u201d \u2014\u2014 \u884c\u52a8\u679c\u65ad\uff0c\u5728\u9500\u552e\u8425\u9020\u7684\u201c\u7a00\u7f3a\u201d\u548c\u201c\u4e13\u5c5e\u201d\u6c1b\u56f4\u4e0b\u5feb\u901f\u51b3\u7b56\uff0c\u6613\u53d7\u201c\u88ab\u770b\u91cd\u201d\u60c5\u7eea\u5f71\u54cd\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4\u641e\u94b1\u7ed3\u679c\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u4e0e\u81ea\u6211\u4ef7\u503c\u8bc1\u660e\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c**\u6838\u5fc3\u98ce\u9669\u6765\u81ea\u5b8c\u5168\u672a\u77e5\u7684\u5bb6\u5ead\u652f\u6301\u4e0e\u771f\u5b9e\u8d44\u6e90\u60c5\u51b5**\u3002\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5165\u5b66\u4e00\u5468\u5185\uff0c\u7531\u73ed\u4e3b\u4efb\u4ee5\u201c\u5b66\u4e60\u89c4\u5212\u201d\u4e3a\u540d\uff0c\u6e29\u548c\u8865\u5168\u5bb6\u5ead\u3001\u5de5\u4f5c\u3001\u652f\u4ed8\u65b9\u5f0f\u4fe1\u606f\uff0c\u5b8c\u6210\u98ce\u9669\u590d\u6838\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u7b2c\u56db\u5c42\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u6210\u5c31\u8ba4\u53ef\u4f53\u7cfb\u5305\"}\n```";
