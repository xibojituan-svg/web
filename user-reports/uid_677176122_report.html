    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u7f3a\u4e4f\u7528\u6237\u4e2a\u4eba\u80cc\u666f\u3001\u804c\u4e1a\u3001\u6536\u5165\u3001\u5bb6\u5ead\u72b6\u51b5\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u7b49\u5173\u952e\u4fe1\u606f\uff0c\u65e0\u6cd5\u51c6\u786e\u8bc4\u4f30\u8d44\u6e90\u5e95\u5ea7\u548c\u5fc3\u7406\u5f39\u6027\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49)**\n    *   **\u8868\u5c42**\uff1a\u5b66\u4e60AI\u77ed\u89c6\u9891\u6280\u80fd\uff0c\u5bfb\u6c42\u526f\u4e1a\u53d8\u73b0\uff08\u201c\u6709\u5174\u8da3\u201d\u3001\u201c\u80fd\u63a5\u5546\u7a3f\u4e0d\u201d\uff09\u3002\n    *   **\u6df1\u5c42**\uff1a\u5bf9\u201c\u5feb\u901f\u6536\u76ca\u201d\u3001\u201c\u7761\u540e\u6536\u5165\u201d\u6709\u660e\u663e\u5174\u8da3\uff0c\u5173\u6ce8\u5b66\u4e60\u5468\u671f\uff08\u201c2\u4e2a\u6708\u80fd\u5b66\u5b8c\u5427\u201d\uff09\u3001\u540e\u7eed\u6307\u5bfc\uff08\u201c\u966a\u8dd1\u7ed3\u675f\u4e4b\u540e\u662f\u4e0d\u662f\u5c31\u6ca1\u4eba\u6307\u5bfc\u4e86\u201d\uff09\u53ca\u8d44\u6e90\u4fdd\u969c\uff08\u5de5\u4f5c\u5ba4\u7b7e\u7ea6\u3001MCN\uff09\u3002\u52a8\u673a\u504f\u5411**\u5b9e\u7528\u4e3b\u4e49\u548c\u7ed3\u679c\u5bfc\u5411**\uff0c\u4f46\u672a\u8868\u8fbe\u6df1\u5c42\u5174\u8da3\u6216\u804c\u4e1a\u8f6c\u578b\u51b3\u5fc3\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u672a\u77e5)**\n    *   **\u4fe1\u606f\u7f3a\u5931**\uff1a\u5e74\u9f84\u3001\u804c\u4e1a\u3001\u6536\u5165\u3001\u53ef\u652f\u914d\u65f6\u95f4\u3001\u8bbe\u5907\u6761\u4ef6\u3001\u8fc7\u5f80\u76f8\u5173\u7ecf\u9a8c\u5747\u672a\u77e5\u3002\u4ec5\u77e5\u7528\u6237\u5728\u5730\u94c1\u4e0a\u6c9f\u901a\uff0c\u53ef\u80fd\u4e3a\u4e0a\u73ed\u65cf\u3002\n    *   **\u63a8\u65ad**\uff1a\u80fd\u652f\u4ed82980\u5143\u8bfe\u7a0b\u8d39\u7528\uff0c\u5177\u5907\u57fa\u7840\u7ecf\u6d4e\u80fd\u529b\u3002\u5bf9\u5b66\u4e60\u65f6\u95f4\u6709\u660e\u786e\u8981\u6c42\uff082\u4e2a\u6708\uff09\uff0c\u53ef\u80fd\u65f6\u95f4\u6709\u9650\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u7b49\u504f\u4f4e)**\n    *   **\u8868\u73b0**\uff1a\u6c9f\u901a\u914d\u5408\u5ea6\u9ad8\uff08\u56de\u590d\u201c\u597d\u7684\u201d\u3001\u201c\u55ef\u55ef\u201d\uff0c\u6309\u8981\u6c42\u53d1\u53e3\u4ee4\uff09\uff0c**\u4f46\u8868\u73b0\u51fa\u660e\u663e\u7684\u4f9d\u8d56\u6027\u548c\u8def\u5f84\u5bfb\u6c42**\u3002\u53cd\u590d\u786e\u8ba4\u5b66\u4e60\u5468\u671f\u3001\u966a\u8dd1\u7ed3\u675f\u540e\u6307\u5bfc\u3001\u5347\u7ea7\u53ef\u80fd\uff0c\u663e\u793a**\u5bf9\u786e\u5b9a\u6027\u548c\u5916\u90e8\u652f\u6301\u7684\u5f3a\u9700\u6c42**\uff0c\u81ea\u4e3b\u63a2\u7d22\u548c\u6297\u98ce\u9669\u80fd\u529b\u5b58\u7591\u3002\n    *   **\u97e7\u6027\u4fe1\u53f7\u5f31**\uff1a\u672a\u4e3b\u52a8\u63d0\u95ee\u6280\u672f\u7ec6\u8282\uff0c\u672a\u8868\u8fbe\u5b66\u4e60\u4e2d\u53ef\u80fd\u9047\u5230\u7684\u56f0\u96be\u53ca\u5e94\u5bf9\u60f3\u6cd5\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u5df2\u5b8c\u6210\u652f\u4ed8\uff08\u201c\u5df2\u62a5\u540d\u201d\uff09\uff0c\u4e3a\u5df2\u4ed8\u8d39\u7528\u6237\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u4fe1\u606f\u4e0d\u8db3\u3002\u7528\u6237\u72ec\u7acb\u5b8c\u6210\u54a8\u8be2\u4e0e\u652f\u4ed8\uff0c\u672a\u63d0\u53ca\u4e0e\u4ed6\u4eba\u5546\u8bae\uff0c\u6682\u63a8\u65ad\u4e3a\u72ec\u7acb\u51b3\u7b56\u3002\n*   **\u5224\u5b9a\u8def\u5f84**\uff1aA0 (\u5df2\u652f\u4ed8) \u2192 **B\u7c7b\u7528\u6237 (\u5df2\u8f6c\u5316\u4ed8\u8d39\u5b66\u5458)**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b\uff1aT7 \u8d44\u6e90\u5bfb\u79df\u578b**\n    *   **\u6838\u5fc3\u7279\u5f81**\uff1a\u76ee\u6807\u660e\u786e\u6307\u5411\u201c\u53d8\u73b0\u201d\u548c\u201c\u8d44\u6e90\u201d\uff0c\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u672c\u8eab\u5173\u6ce8\u5ea6\u4f4e\u4e8e\u5bf9\u201c\u63a5\u5355\u6e20\u9053\u201d\u3001\u201c\u5de5\u4f5c\u5ba4\u7b7e\u7ea6\u201d\u3001\u201cMCN\u8d44\u6e90\u201d\u7684\u5173\u6ce8\u3002\u5bfb\u6c42\u7684\u662f**\u786e\u5b9a\u6027\u53d8\u73b0\u8def\u5f84\u548c\u5916\u90e8\u8d44\u6e90\u6258\u4e3e**\uff08\u201c\u5e08\u59d0\u7684\u5de5\u4f5c\u5ba4\u8d44\u6e90\u4e5f\u4f1a\u7ed9\u5230\u4f60\u6258\u4e3e\u201d\uff09\u3002\n    *   **\u6b21\u8981\u7279\u5f81**\uff1a\u517c\u5177\u90e8\u5206 **T8 \u673a\u4f1a\u4e3b\u4e49\u578b** \u7279\u70b9\uff0c\u88ab\u201c\u5feb\u901f\u6536\u76ca\u201d\u3001\u201c\u7761\u540e\u6536\u5165\u201d\u3001\u201c\u98ce\u53e3\u201d\u7b49\u8bdd\u672f\u5438\u5f15\uff0c\u5e0c\u671b\u77ed\u671f\u6295\u5165\u5feb\u901f\u89c1\u6548\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u98ce\u9669\u7b49\u7ea7\uff1a\u4e2d)\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u9884\u671f\u201c2\u4e2a\u6708\u5b66\u5b8c\u201d\u5e76\u63a5\u5546\u5355\uff0c\u82e5\u5b66\u4e60\u8fdb\u5ea6\u6216\u53d8\u73b0\u7ed3\u679c\u4e0d\u53ca\u9884\u671f\uff0c\u6613\u5f15\u53d1\u5931\u671b\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a\u672a\u77e5\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5173\u6ce8\u5b66\u4e60\u65f6\u957f\uff0c\u82e5\u5b9e\u9645\u6240\u9700\u65f6\u95f4\u8fdc\u8d852\u4e2a\u6708\uff0c\u6216\u4e0e\u5de5\u4f5c\u751f\u6d3b\u51b2\u7a81\uff0c\u53ef\u80fd\u653e\u5f03\u3002\n    4.  **\u8bfe\u7a0b\u8d28\u91cf**\uff1a\u672a\u77e5\u3002\u53d6\u51b3\u4e8e\u5b9e\u9645\u4ea4\u4ed8\u3002\n    5.  **\u9500\u552e\u627f\u8bfa\u4e0d\u7b26**\uff1a**\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa\u201c\u5de5\u4f5c\u5ba4\u7b7e\u7ea6\u201d\u3001\u201c\u5185\u90e8\u8d44\u6e90\u201d\u3001\u201c\u7b2c8\u5929\u63a5\u5355\u201d\uff0c\u82e5\u540e\u7eed\u8d44\u6e90\u5bf9\u63a5\u4e0d\u7545\u6216\u95e8\u69db\u8fc7\u9ad8\uff0c\u6781\u6613\u5f15\u53d1\u6295\u8bc9\u3002**\uff08\u5173\u952e\u96f7\u533a\uff09**\n    6.  **\u670d\u52a1\u4f53\u9a8c**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5728\u610f\u201c\u966a\u8dd1\u7ed3\u675f\u540e\u201d\u7684\u6307\u5bfc\uff0c\u82e5\u7ed3\u8bfe\u540e\u670d\u52a1\u65ad\u5d16\u5f0f\u4e0b\u964d\uff0c\u53ef\u80fd\u4e0d\u6ee1\u3002\n    7.  **\u7ade\u54c1/\u66ff\u4ee3\u65b9\u6848**\uff1a\u672a\u77e5\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u4e3b\u8981\u8fdd\u89c4\u70b9**\uff1a\n    *   **\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u6346\u7ed1\u9500\u552e**\uff1a**\u4e25\u91cd\u8fdd\u89c4**\u3002\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u6bd5\u4e1a\u76f4\u63a5\u7b7e\u7ea6\u5de5\u4f5c\u5ba4MCN\u201d\u3001\u201c\u4eab\u53d7\u6240\u6709\u5185\u90e8\u6743\u76ca\u201d\u3001\u201c\u5e08\u59d0\u5e26\u4f60\u201d\u3001\u201c\u4e00\u8d77\u63a5\u5355\u5e72\u6d3b\u201d\uff0c\u5c06\u5e73\u53f0\u8bfe\u7a0b\u4e0e\u4e2a\u4eba/\u5de5\u4f5c\u5ba4\u8d44\u6e90\u8fdb\u884c**\u4e0d\u5f53\u6346\u7ed1**\uff0c\u6697\u793a\u6216\u660e\u793a\u4e86\u8bfe\u7a0b\u5916\u7684\u5c31\u4e1a\u4fdd\u969c\uff0c\u6784\u6210**\u865a\u5047\u6216\u8bef\u5bfc\u6027\u627f\u8bfa**\u3002**\uff08\u5173\u952e\u96f7\u533a\uff09**\n    *   **\u5236\u9020\u7a00\u7f3a\u4e0e\u7d27\u8feb\u611f**\uff1a\u201c\u62fc\u624b\u901f\u62a2\u5238\u201d\u3001\u201c\u4eca\u665a\u5f00\u653e\u5c11\u91cf\u540d\u989d\u201d\u3001\u201c\u4f18\u60e0\u5238\u6709\u65f6\u6548\u201d\u7b49\u8bdd\u672f\u5408\u89c4\u4f46\u9700\u6ce8\u610f\u5c3a\u5ea6\u3002\n    *   **\u6536\u76ca\u5938\u5927**\uff1a\u5c55\u793a\u201c\u5355\u6761\u89c6\u9891\u6536\u76ca800-1500\u201d\u3001\u201c\u6bcf\u5468\u7ed3\u7b97\u201d\u7b49\u6848\u4f8b\uff0c\u672a\u5145\u5206\u63d0\u793a\u98ce\u9669\uff0c\u53ef\u80fd\u6784\u6210\u6536\u76ca\u8bef\u5bfc\u3002\n*   **\u5408\u89c4\u90e8\u5206**\uff1a\u660e\u786e\u4e86\u8bfe\u7a0b\u65f6\u957f\uff082\u4e2a\u6708/3.5\u4e2a\u6708\uff09\u3001\u89e3\u9501\u8282\u594f\u3001\u7b2c8\u5929\u5f00\u901a\u63a5\u5355\u6743\u9650\u7b49\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6838\u5fc3\u7b56\u7565**\uff1a**\u7ba1\u7406\u9884\u671f + \u5f3a\u5316\u8fc7\u7a0b\u6fc0\u52b1 + \u9010\u6b65\u91ca\u653e\u8d44\u6e90**\u3002\n*   **\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9884\u671f\u7ba1\u7406\uff08\u91cd\u4e2d\u4e4b\u91cd\uff09**\uff1a\u9996\u6b21\u6c9f\u901a\u9700\u6e29\u548c\u4f46\u6e05\u6670\u5730\u201c\u6821\u51c6\u201d\u9884\u671f\u3002\u5f3a\u8c03\u6280\u80fd\u5b66\u4e60\u662f\u53d8\u73b0\u7684\u57fa\u7840\uff0c\u5de5\u4f5c\u5ba4\u8d44\u6e90\u662f\u201c\u4f18\u79c0\u6bd5\u4e1a\u5b66\u5458\u7684\u4f18\u9009\u673a\u4f1a\u201d\uff0c\u800c\u975e\u81ea\u52a8\u4eab\u6709\u7684\u4fdd\u969c\u3002\u660e\u786e\u63a5\u5355\u6743\u9650\u5f00\u901a\u4e0d\u7b49\u4e8e\u7acb\u5373\u6709\u9ad8\u989d\u6536\u5165\uff0c\u9700\u79ef\u7d2f\u4f5c\u54c1\u548c\u901a\u8fc7\u5ba1\u6838\u3002\n    2.  **\u5f3a\u5316\u8fc7\u7a0b\u53cd\u9988**\uff1a\u9488\u5bf9\u5176\u4f9d\u8d56\u6027\u5f3a\u7279\u70b9\uff0c\u63d0\u4f9b\u9ad8\u9891\u3001\u7ec6\u81f4\u7684\u4f5c\u4e1a\u53cd\u9988\u548c\u6b63\u5411\u6fc0\u52b1\u3002\u5efa\u7acb\u201c\u5c0f\u76ee\u6807-\u8fbe\u6210-\u5956\u52b1\u201d\u7684\u5373\u65f6\u53cd\u9988\u5faa\u73af\uff0c\u5de9\u56fa\u5b66\u4e60\u4fe1\u5fc3\u3002\n    3.  **\u900f\u660e\u5316\u8d44\u6e90\u8def\u5f84**\uff1a\u6e05\u6670\u8bf4\u660e\u63a5\u5165\u5546\u5355\u3001\u63a5\u89e6\u5de5\u4f5c\u5ba4\u8d44\u6e90\u7684\u5177\u4f53\u6807\u51c6\u3001\u6d41\u7a0b\u548c\u9009\u62d4\u673a\u5236\uff0c\u907f\u514d\u4ea7\u751f\u201c\u88ab\u6b3a\u9a97\u201d\u611f\u3002\n    4.  **\u5173\u6ce8\u5b66\u4e60\u8282\u594f**\uff1a\u4e3b\u52a8\u8ddf\u8fdb\u5176\u5b66\u4e60\u8fdb\u5ea6\uff0c\u9884\u9632\u56e0\u65f6\u95f4\u4e0d\u8db3\u6216\u9047\u5230\u74f6\u9888\u800c\u6389\u961f\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**\uff1a\n    *   **\u6302\u8f7d\u4ea7\u54c1\u7ebf**\uff1a\u4f18\u5148\u5f15\u5bfc\u5b8c\u6210\u5df2\u8d2d\u7684**AI\u77ed\u89c6\u9891\u53d8\u73b0\u57fa\u7840\u8bfe\uff082980\uff09**\u3002\u8c28\u614e\u63a8\u9ad8\u9636\u8bfe\uff0c\u9664\u975e\u7528\u6237\u5df2\u4ea7\u51fa\u4f18\u8d28\u4f5c\u54c1\u5e76\u8868\u73b0\u51fa\u5f3a\u70c8\u8fdb\u9636\u610f\u613f\u3002\n    *   **\u540e\u7eed\u8f6c\u5316**\uff1a\u82e5\u7528\u6237\u5b66\u4e60\u987a\u5229\u3001\u4f5c\u54c1\u8fbe\u6807\uff0c\u53ef\u57fa\u4e8e\u5176\u5b9e\u9645\u6210\u679c\uff08\u800c\u975e\u9500\u552e\u627f\u8bfa\uff09\u63a8\u8350**\u5546\u5355\u5b9e\u6218\u8425\u6216\u8d44\u6e90\u5bf9\u63a5\u670d\u52a1**\uff0c\u5b9e\u73b0\u4ef7\u503c\u5ef6\u4f38\u3002\n\n{\"core_type\": \"T7 \u8d44\u6e90\u5bfb\u79df\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168/\u5c0a\u91cd\", \"target_product_line\": \"AI\u77ed\u89c6\u9891\u53d8\u73b0\u57fa\u7840\u8bfe\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}";
