    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4ee5\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\u7684\u8eab\u4efd\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a676750291\u7684\u7528\u6237\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676750291 (\u6635\u79f0\uff1a\u5d14\u709c/\u6d1b\u77e5\u7476) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-02-14 \u81f3 2026-03-19 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6de1\u6de1\u7684\u84dd(\u9646\u4e1b\u5dcd) -> \u6ca7\u6d77\u73ed\u73ed(\u5ec9\u5927\u52c7) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u914d\u97f3\u8bfe\u7a0b (\u8fdb\u9636\u73ed/\u6b63\u4ef7\u73ed) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3** |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u5730\u94c1\u901a\u52e4\u3001\u665a\u95f4\u5b66\u4e60) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3** |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** (\u6280\u672f\u4e92\u52a8\u3001\u60c5\u7eea\u8868\u8fbe\u3001\u793e\u4ea4\u53c2\u4e0e\u5747\u6709\u4f53\u73b0) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **[\u2b06\u9ad8]**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u4e13\u4e1a\u7cbe\u8fdb\u800c\u6765\uff0c\u5173\u6ce8\u6280\u672f\u7ec6\u8282\u4e0e\u884c\u4e1a\u6807\u51c6\uff0c\u8ffd\u6c42\u81ea\u6211\u5b9e\u73b0\u4e0e\u4e13\u4e1a\u8ba4\u53ef\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u73ed\u73ed\uff0c\u6709\u65f6\u95f4\u80fd\u5e2e\u6211\u770b\u4e00\u4e0b\u6211\u5e72\u97f3\u5904\u7406\u7684\u7b26\u5408\u4ea4\u97f3\u6807\u51c6\u5417\uff1f\u5fc3\u91cc\u6ca1\u5e95\uff0c\u6bcf\u6b21\u90fd\u662f\u8fd9\u4e48\u5904\u7406\u7684\u3002\u201d\n  > \u201c\u4eb2\uff0c\u8bf7\u6559\u4e2a\u95ee\u9898\uff0c\u50cf\u4f60\u4eec\u8fd9\u6837\u7684\u6210\u624b\u662f\u4e0d\u662f\u54ea\u4e2a\u672c\u5b50\u8bfb\u8d77\u6765\u90fd\u6ca1\u95ee\u9898\uff1f\u6211\u8bd5\u97f3\u7684\u65f6\u5019\uff0c\u6709\u4e9b\u672c\u5b50\u603b\u611f\u89c9\u8bfb\u4e0d\u660e\u767d\uff0c\u662f\u4e0d\u662f\u8fd8\u662f\u6c34\u5e73\u95ee\u9898\uff1f\u201d\n  > \u201c\u73ed\u73ed\uff0c\u5f55\u6709\u58f0\u4e66\u7684\u89d2\u8272\u97f3\uff0c\u662f\u5f55\u5b8c\u97f3\u4e4b\u540e\u5206\u522b\u505a\u5b8c\u5e72\u97f3\u5904\u7406\u518d\u5bf9\u8f68\uff1f\u8fd8\u662f\u5bf9\u5b8c\u8f68\u4ee5\u540e\u518d\u7edf\u4e00\u505a\u5e72\u97f3\u5904\u7406\uff1f\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **[\u27a1\u4e2d]**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u4e2d]** \u2014 \u81ea\u8d2d\u8bbe\u5907\uff08\u63d0\u53ca\u201c\u6253\u6807\u5668\u201d\uff09\uff0c\u4f46\u672a\u63d0\u53ca\u9ad8\u7aef\u8bbe\u5907\u6216\u7ecf\u6d4e\u538b\u529b\uff0c\u8d44\u91d1\u72b6\u51b5\u7a33\u5b9a\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**[\u4e2d]** \u2014 \u6709\u56fa\u5b9a\u5de5\u4f5c\uff08\u5730\u94c1\u901a\u52e4\uff09\uff0c\u4f46\u80fd\u5229\u7528\u788e\u7247\u65f6\u95f4\uff08\u5730\u94c1\u4e0a\u3001\u665a\u95f4\uff09\u5b66\u4e60\u3001\u4ea4\u4f5c\u4e1a\u3001\u63d0\u95ee\uff0c\u5b66\u4e60\u6295\u5165\u5ea6\u8f83\u9ad8\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u4fe1\u606f\u4e0d\u8db3]** \u2014 \u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\uff0c\u4f46\u5b66\u4e60\u884c\u4e3a\u672a\u53d7\u660e\u663e\u5e72\u6270\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **[\u2b07\u4f4e\u6781\u5371]**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56**\u3002\u5b58\u5728\u660e\u663e\u7684\u81ea\u6211\u6000\u7591\u548c\u4e0d\u81ea\u4fe1\uff0c\u9700\u8981\u9891\u7e41\u7684\u5916\u90e8\u80af\u5b9a\u548c\u6307\u5bfc\u6765\u7ef4\u6301\u4fe1\u5fc3\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u771f\u5fc3\u89c9\u5f97\u6211\u7684\u58f0\u97f3\u4e00\u70b9\u90fd\u4e0d\u597d\u542c\uff0c\u6015\u7ed9\u5927\u5bb6\u62c9\u540e\u817f[\u51b7\u6c57]\u201d\n  > \u201c\u6211\u4e00\u76f4\u89c9\u5f97\u548c\u522b\u4eba\u5dee\u592a\u591a\uff0c\u6ca1\u60f3\u5230\u8fd8\u80fd\u8fc7\u521d\u5ba1\uff0c\u8fd9\u80fd\u8bf4\u660e\u6211\u8fdb\u6b65\u4e86\u5427\u201d\n  > \u201c\u9700\u8981\u5b66\u7684\u592a\u591a\u4e86[\u6342\u8138]\u201d\u3001\u201c\u5413\u6b7b\u6211\u4e86\u201d\uff08\u56e0\u586b\u9519\u95ee\u5377\u800c\u6050\u614c\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 ]**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u5ea6\u7684\u4e0d\u81ea\u4fe1\u4e0e\u5bf9\u4e13\u4e1a\u8ba4\u53ef\u7684\u6e34\u6c42**\u3002\u5979\uff08\u4ece\u8eab\u4efd\u8bc1\u53f7\u63a8\u65ad\u4e3a\u5973\u6027\uff0950\u5c81\uff0c\u62c5\u5fc3\u81ea\u5df1\u5e74\u9f84\u5927\u3001\u58f0\u97f3\u4e0d\u597d\u542c\u3001\u6280\u672f\u8ddf\u4e0d\u4e0a\uff0c\u5bb3\u6015\u88ab\u65f6\u4ee3\u548c\u540c\u9f84\u4eba\u629b\u5f03\u3002\u5979\u7684\u6838\u5fc3\u75db\u82e6\u662f\u201c\u81ea\u6211\u4ef7\u503c\u611f\u4f4e\u201d\uff0c\u9700\u8981\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u65b0\u6280\u80fd\u5e76\u83b7\u5f97\u5916\u754c\uff08\u73ed\u73ed\u3001\u540c\u5b66\u3001\u7532\u65b9\uff09\u7684\u8ba4\u53ef\uff0c\u6765\u91cd\u5efa\u81ea\u5c0a\u548c\u81ea\u4fe1\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u9632\u62a4\u76fe\u5f0f\u201d\u7684\u4e13\u4e1a\u80af\u5b9a\u4e0e\u201c\u6309\u952e\u7ea7\u201d\u7684\u7cbe\u51c6\u6307\u5bfc**\u3002\u5979\u9700\u8981\u7684\u4e0d\u53ea\u662f\u9f13\u52b1\uff0c\u66f4\u662f\u6765\u81ea\u201c\u6743\u5a01\u201d\uff08\u73ed\u73ed/\u8001\u5e08\uff09\u5bf9\u5979\u6280\u672f\u7ec6\u8282\u7684\u8ba4\u53ef\u548c\u624b\u628a\u624b\u7684\u7ea0\u9519\uff0c\u4ee5\u6b64\u8bc1\u660e\u201c\u6211\u53ef\u4ee5\uff0c\u6211\u4e0d\u5dee\u201d\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u4e25\u91cd\u5185\u8017) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u5b66\u4e60\u884c\u4e3a\u6301\u7eed\uff0c\u672a\u89c1\u5bb6\u5ead\u963b\u529b\u4fe1\u53f7\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u6280\u672f\u64cd\u4f5c\u6301\u7eed\u53d7\u632b**\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u5931\u8d25\u3001AU\u64cd\u4f5c\u9057\u5fd8\u3001\u4f5c\u4e1a\u6807\u51c6\u4e0d\u6e05\uff09\u4f1a\u5f15\u53d1\u201c\u6211\u592a\u7b28\u4e86\uff0c\u5b66\u4e0d\u4f1a\u201d\u7684\u5d29\u6e83\uff0c\u8fdb\u800c\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | **\u4efb\u4f55\u8d1f\u9762\u53cd\u9988\u6216\u65e0\u4eba\u53ca\u65f6\u56de\u5e94**\u3002\u4e00\u6b21\u8bd5\u97f3\u5931\u8d25\u3001\u4e00\u6b21\u4f5c\u4e1a\u88ab\u4e25\u5389\u70b9\u8bc4\u3001\u4e00\u6b21\u63d0\u95ee\u672a\u5f97\u5230\u53ca\u65f6\u89e3\u7b54\uff0c\u90fd\u53ef\u80fd\u89e6\u53d1\u5176\u201c\u6211\u4e0d\u884c\u201d\u7684\u81ea\u6211\u5426\u5b9a\uff0c\u5bfc\u81f4\u60c5\u7eea\u5d29\u6e83\u548c\u9000\u8d39\u5ff5\u5934\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u5982\u679c\u6295\u5165\u5927\u91cf\u7cbe\u529b\u540e\uff0c\u957f\u65f6\u95f4\uff08\u59822-3\u4e2a\u6708\uff09\u672a\u901a\u8fc7\u8bd5\u97f3\u6216\u63a5\u5230\u5355\uff0c\u4f1a\u4ea7\u751f\u201c\u4ed8\u51fa\u65e0\u56de\u62a5\u201d\u7684\u5931\u843d\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-4\u5468\uff0c\u7b2c\u4e00\u6b21\u72ec\u7acb\u5b8c\u6210\u590d\u6742\u4f5c\u4e1a\u6216\u906d\u9047\u6280\u672f\u96be\u9898\u65f6**\u3002\u4f8b\u5982\uff0c\u72ec\u7acb\u5b8c\u6210AU\u591a\u8f68\u540e\u671f\u3001\u5904\u7406\u5e72\u97f3\u9047\u5230\u74f6\u9888\u3001\u6216\u9996\u6b21\u8bd5\u97f3\u88ab\u62d2\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u5979\u8bf4......\u201d**\n> \u201c\u5d14\u709c/\u77e5\u7476\u59d0\uff0c\u770b\u5230\u4f60\u4e4b\u524d\u95ee\u4e86\u5f88\u591a\u7279\u522b\u7ec6\u8282\u7684\u6280\u672f\u95ee\u9898\uff0c\u80fd\u611f\u89c9\u5230\u4f60\u5bf9\u4e13\u4e1a\u6807\u51c6\u6709\u5f88\u9ad8\u7684\u8ffd\u6c42\uff0c\u8fd9\u70b9\u7279\u522b\u68d2\uff01\u54b1\u4eec\u8fd9\u4e2a\u73ed\u5c31\u662f\u5e2e\u4f60\u628a\u6bcf\u4e00\u4e2a\u2018\u5fc3\u91cc\u6ca1\u5e95\u2019\u7684\u73af\u8282\u90fd\u592f\u5b9e\u3002\u522b\u62c5\u5fc3\u5e74\u9f84\u548c\u8d77\u70b9\uff0c\u5f88\u591a\u4f18\u79c0\u4e3b\u64ad\u90fd\u662f\u4e2d\u5e74\u624d\u5f00\u59cb\u3002\u4f60\u53ea\u7ba1\u95ee\uff0c\u6211\u4fdd\u8bc1\u6bcf\u4e2a\u95ee\u9898\u90fd\u7ed9\u4f60\u62c6\u89e3\u5f97\u660e\u660e\u767d\u767d\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u628a\u2018\u4e0d\u786e\u5b9a\u2019\u53d8\u6210\u2018\u80f8\u6709\u6210\u7af9\u2019\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** (\u4ea7\u54c1\u7ebfA)\u3002\u5979\u5bf9\u6280\u672f\u6709\u8ffd\u6c42\uff0c\u9700\u8981\u624e\u5b9e\u7684\u6280\u80fd\u4ea4\u4ed8\u6765\u5efa\u7acb\u81ea\u4fe1\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u5f3a\u70c8\u8865\u5145\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u9488\u5bf9\u5176T6\u60c5\u7eea\u5de8\u5a74\u7279\u8d28\uff0c\u9700\u8981\u9ad8\u9891\u3001\u7ec6\u817b\u7684\u60c5\u611f\u6258\u5e95\u3002**\u8003\u8651\u6302\u8f7d\u3010\u964d\u7ef4\u7269\u7406\u4ee3\u529e\u5305\u3011**\uff0c\u5728\u5176\u9047\u5230\u8f6f\u4ef6\u5b89\u88c5\u3001\u64cd\u4f5c\u6b65\u9aa4\u9057\u5fd8\u65f6\uff0c\u76f4\u63a5\u63d0\u4f9b\u201c\u4e00\u952e\u5f0f\u201d\u89e3\u51b3\u65b9\u6848\u6216\u4ee3\u64cd\u4f5c\u6307\u5f15\uff0c\u907f\u514d\u5176\u9677\u5165\u64cd\u4f5c\u6050\u614c\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n  1. **\u7edd\u4e0d\u5bf9\u5176\u4f7f\u7528\u4efb\u4f55\u5426\u5b9a\u6216\u6279\u8bc4\u6027\u8bed\u8a00**\uff0c\u5373\u4f7f\u7ea0\u9519\u4e5f\u8981\u7528\u201c\u53ef\u4ee5\u66f4\u597d\u201d\u7684\u53e5\u5f0f\u3002\n  2. **\u7edd\u4e0d\u5141\u8bb8\u5176\u63d0\u95ee\u540e\u5f97\u4e0d\u5230\u53ca\u65f6\u56de\u5e94**\uff08\u8d85\u8fc72\u5c0f\u65f6\u672a\u56de\u590d\u98ce\u9669\u6fc0\u589e\uff09\u3002\n  3. **\u7edd\u4e0d\u5e03\u7f6e\u8d85\u51fa\u5176\u5f53\u524d\u80fd\u529b\u8303\u56f4\u592a\u591a\u7684\u201c\u6311\u6218\u6027\u201d\u4f5c\u4e1a**\uff0c\u5e94\u62c6\u89e3\u4e3a\u5c0f\u6b65\u9aa4\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u77ed\u671f\u5185\u4e25\u7981\u4efb\u4f55\u5347\u5355\u63a8\u9500**\u3002\u5fc5\u987b\u5728\u5176\u6280\u672f\u7a33\u5b9a\u3001\u5e76\u83b7\u5f97\u81f3\u5c111-2\u6b21\u6b63\u5411\u53cd\u9988\uff08\u5982\u8bd5\u97f3\u901a\u8fc7\u3001\u4f5c\u4e1a\u88ab\u8868\u626c\uff09\u540e\uff0c\u518d\u4ee5\u201c\u4e3a\u4e86\u8ba9\u4f60\u4f5c\u54c1\u66f4\u5b8c\u7f8e\u201d\u4e3a\u7531\uff0c\u8c28\u614e\u63a8\u8350\u540e\u671f\u8bfe\u7b49\u8fdb\u9636\u5185\u5bb9\u3002**\u4f18\u5148\u63a8\u8350\u4f4e\u5ba2\u5355\u4ef7\u3001\u9ad8\u60c5\u7eea\u4ef7\u503c\u7684\u5468\u8fb9\u670d\u52a1**\uff08\u5982\u58f0\u97f3\u8bca\u65ad\u3001\u5b9a\u5236\u5316\u70b9\u8bc4\uff09\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c@@\uff5e\u534a\u4ed9\u513f\uff5e&\u2005\uff0c\u771f\u5fc3\u89c9\u5f97\u6211\u7684\u58f0\u97f3\u4e00\u70b9\u90fd\u4e0d\u597d\u542c\uff0c\u6015\u7ed9\u5927\u5bb6\u62c9\u540e\u817f[\u51b7\u6c57]\u201d **\u2014\u2014 \u5178\u578bT6\u81ea\u5351\u4fe1\u53f7**\n2. > \u201c\u6211\u4e00\u76f4\u89c9\u5f97\u548c\u522b\u4eba\u5dee\u592a\u591a\uff0c\u6ca1\u60f3\u5230\u8fd8\u80fd\u8fc7\u521d\u5ba1\uff0c\u8fd9\u80fd\u8bf4\u660e\u6211\u8fdb\u6b65\u4e86\u5427\u201d **\u2014\u2014 \u6781\u5ea6\u4f9d\u8d56\u5916\u90e8\u80af\u5b9a\u6765\u786e\u8ba4\u81ea\u6211\u4ef7\u503c**\n3. > \u201c\u73ed\u73ed\uff0c\u6709\u65f6\u95f4\u80fd\u5e2e\u6211\u770b\u4e00\u4e0b\u6211\u5e72\u97f3\u5904\u7406\u7684\u7b26\u5408\u4ea4\u97f3\u6807\u51c6\u5417\uff1f\u5fc3\u91cc\u6ca1\u5e95\uff0c\u6bcf\u6b21\u90fd\u662f\u8fd9\u4e48\u5904\u7406\u7684\u3002\u201d **\u2014\u2014 \u6280\u672f\u8ffd\u6c42\uff08T3\u503e\u5411\uff09\u4e0e\u81ea\u6211\u6000\u7591\uff08T6\u6838\u5fc3\uff09\u7684\u6df7\u5408\u4f53\uff0c\u6307\u5411\u3010\u6df7\u5408\u4f531\u53f7\uff1a\u9ad8\u77e5\u5185\u8017\u8005\u3011\u7684\u8fdb\u5316\u524d\u4f53**\n4. > \u201c\u9700\u8981\u5b66\u7684\u592a\u591a\u4e86[\u6342\u8138]\u201d\u3001\u201c\u5f53\u65f6\u542c\u5b8c\u6ca1\u64cd\u4f5c\uff0c\u8fc7\u540e\u5c31\u5fd8\u4e86\u3002\u201d **\u2014\u2014 \u9762\u5bf9\u77e5\u8bc6\u8fc7\u8f7d\u7684\u7126\u8651\u548c\u8bb0\u5fc6\u529b\u6311\u6218\uff0c\u662f\u6df7\u5408\u4f531\u53f7\u7684\u5178\u578b\u6273\u673a\u4fe1\u53f7**\n5. > \u201c\u5413\u6b7b\u6211\u4e86\u201d\uff08\u56e0\u586b\u9519\u95ee\u5377\u800c\u6050\u614c\uff09 **\u2014\u2014 \u5fc3\u7406\u5f39\u6027\u6781\u4f4e\uff0c\u5bf9\u5fae\u5c0f\u5931\u8bef\u53cd\u5e94\u8fc7\u5ea6**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6\u60c5\u7eea\u5de8\u5a74\u578b\uff0c\u5e76\u6b63\u5728\u5411\u6df7\u5408\u4f531\u53f7\uff08\u9ad8\u77e5\u5185\u8017\u8005\uff09\u8fdb\u5316\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4e0e\u4ef7\u503c\u786e\u8ba4\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u201c\u50bb\u74dc\u7248\u201dA\u6a21\u5757\uff08\u964d\u7ef4\u6307\u4ee4\uff09+ \u6ee1\u914dC\u6a21\u5757\uff08\u9ad8\u9891\u60c5\u7eea\u8d5e\u7f8e\u4e0e\u5373\u65f6\u7b54\u7591\uff09\uff0c\u5e76\u5728\u5176\u51fa\u73b0\u77e5\u8bc6\u8fc7\u8f7d\u4fe1\u53f7\u65f6\uff0c\u4e3b\u52a8\u6267\u884c\u201c\u6218\u7565\u6027\u62d2\u5356\u7194\u65ad\u201d\uff0c\u66ff\u5979\u505a\u51cf\u6cd5\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b (\u6df7\u5408\u4f531\u53f7\u8fdb\u5316\u524d\u4f53)\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305 + \u964d\u7ef4\u7269\u7406\u4ee3\u529e\u5305\", \"age\": \"50\u5c81\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}\n```";
