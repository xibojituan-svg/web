    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4ee5\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\u7684\u8eab\u4efd\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677167033\u7684\u7528\u6237\u8fdb\u884c\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677167033 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u7e41\u661f/\u68a6\u5883/101\u6696\u6696 (\u674e\u579a\u6d01) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b (7380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u82b1\u5457/\u4fe1\u7528\u5361\u5206\u671f (\u9ad8\u98ce\u9669)** - \u7528\u6237\u4e3b\u52a8\u63d0\u53ca\u201c\u5728\u4ed8\u5462\uff1f\u201d\u5e76\u5feb\u901f\u652f\u4ed87380\u5143\uff0c\u7ed3\u5408\u5176\u53d8\u73b0\u6025\u5207\u5fc3\u6001\uff0c\u5b58\u5728\u9ad8\u6982\u7387\u4f7f\u7528\u5206\u671f\u6216\u501f\u8d37\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** - \u7528\u6237\u80fd\u54cd\u5e94\u767d\u5929\u4efb\u52a1\uff0c\u4f46\u4e2d\u9014\u6709\u201c\u521a\u6709\u70b9\u4e8b\uff0c\u79bb\u5f00\u4e86\u5341\u5206\u949f\u201d\uff0c\u8868\u660e\u65f6\u95f4\u975e\u5b8c\u5168\u81ea\u7531\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** - \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\uff0c\u9700\u540e\u7eed\u6838\u67e5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** - \u5bf9\u8bdd\u5185\u5bb9\u4e30\u5bcc\uff0c\u884c\u4e3a\u4e0e\u52a8\u673a\u4fe1\u53f7\u660e\u786e\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b07\u4f4e (\u8bc4\u5206\uff1a2\u5206)\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u7eaf\u4e3a\u51e0\u5929\u5185\u63d0\u73b0\u4fdd\u5e95\u800c\u6765**\u3002\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u77ed\u671f\u5feb\u901f\u53d8\u73b0\uff0c\u5bf9\u6280\u80fd\u6210\u957f\u672c\u8eab\u5174\u8da3\u4f4e\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u4ec0\u4e48\u65f6\u5019\u53ef\u4ee5\u8d5a\u94b1[\u6342\u8138][\u6342\u8138][\u6342\u8138]\u201d\n  > \u201c\u80fd\u517c\u804c\u8d5a\u94b1\u7684\u90fd\u53ef\u4ee5\u201d\n  > \u201c\u6211\u4ea4\u4e86\uff0c\u6211\u7740\u6025\u8d5a\u94b1\uff0c\u54c8\u54c8\u201d\n  > \u201c\u94b1\u591a\u94b1\u5c11\u90fd\u884c\uff0c\u5c11\u7684\u8bdd\u6211\u8d70\u91cf\u591a\u8bfb\u51e0\u672c\u4e5f\u884c\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d (\u8bc4\u5206\uff1a5\u5206)\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u652f\u4ed87380\u5143\u8bfe\u7a0b\u8d39\uff0c\u4f46\u652f\u4ed8\u65b9\u5f0f\u5b58\u7591\uff08\u53ef\u80fd\u5206\u671f\uff09\uff0c\u975e\u5145\u88d5\u8d44\u91d1\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u8ddf\u4e0a\u767d\u5929\u4efb\u52a1\uff0c\u884c\u52a8\u529b\u5f3a\uff0c\u4f46\u65f6\u95f4\u5448\u788e\u7247\u5316\u7279\u5f81\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u672a\u63d0\u53ca\uff0c\u9700\u540e\u7eed\u6838\u67e5\uff0c\u5b58\u5728\u6f5c\u5728\u98ce\u9669\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u27a1\u4e2d (\u8bc4\u5206\uff1a5\u5206)\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a**\u3002\u7528\u6237\u8868\u73b0\u51fa\u79ef\u6781\u3001\u914d\u5408\u7684\u6001\u5ea6\uff0c\u884c\u52a8\u529b\u5f3a\uff0c\u672a\u51fa\u73b0\u5d29\u6e83\u6216\u81ea\u6211\u5426\u5b9a\u4fe1\u53f7\u3002\u4f46\u5bf9\u53d8\u73b0\u65f6\u95f4\u7ebf\u9ad8\u5ea6\u5173\u6ce8\uff0c\u9700\u9500\u552e\u6301\u7eed\u5b89\u629a\u548c\u5f15\u5bfc\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u5bf9\u4efb\u4f55\u4e8b\u60c5\uff0c\u53ea\u8981\u6211\u51b3\u5b9a\u8981\u53bb\u5e72\uff0c\u6211\u80af\u5b9a\u5c31\u4f1a\u5c3d\u529b\u53bb\u628a\u5b83\u505a\u597d\u3002\u201d (\u4f53\u73b0\u4e00\u5b9a\u97e7\u6027)\n  > \u5168\u7a0b\u6c9f\u901a\u793c\u8c8c\u3001\u914d\u5408\uff0c\u65e0\u8d1f\u9762\u60c5\u7eea\u5ba3\u6cc4\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 (\u7126\u8651\u4fdd\u969c)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u77ed\u671f\u7ecf\u6d4e\u6536\u5165\u6709\u8feb\u5207\u6e34\u671b\uff0c\u5e0c\u671b\u901a\u8fc7\u517c\u804c\u5feb\u901f\u83b7\u5f97\u7ecf\u6d4e\u4fdd\u969c\uff0c\u7f13\u89e3\u6f5c\u5728\u7684\u751f\u5b58\u6216\u751f\u6d3b\u538b\u529b\u3002**\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u9884\u671f\u7684\u53d8\u73b0\u8def\u5f84\u56fe\u548c\u5b89\u5168\u627f\u8bfa\u611f**\uff0c\u7528\u201c\u6309\u90e8\u5c31\u73ed\u5c31\u80fd\u62ff\u5230\u7ed3\u679c\u201d\u7684\u786e\u5b9a\u6027\uff0c\u5bf9\u51b2\u5176\u56e0\u201c\u7740\u6025\u8d5a\u94b1\u201d\u800c\u4ea7\u751f\u7684\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b (\u98ce\u9669\u7ba1\u63a7\u578b)** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u8bba** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u4f46\u9700\u8b66\u60d5\u5411T8-D\u9000\u5316)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u7528\u6237\u652f\u4ed8\u884c\u4e3a\uff08\u5feb\u901f\u652f\u4ed87380\u5143\uff09\u7ed3\u5408\u5176\u201c\u7740\u6025\u8d5a\u94b1\u201d\u7684\u4f4e\u7eaf\u5ea6\u52a8\u673a\uff0c**\u7b26\u5408\u300a\u5224\u5b9a\u6811\u300b\u7b2c\u4e00\u5c42-B\u201c\u4ea4\u6613\u4fe1\u53f7\u786c\u62e6\u622a\u5c42\u201d\u7684\u9884\u8b66\u6761\u4ef6**\u3002\u867d\u672a\u76f4\u63a5\u63d0\u53ca\u501f\u8d37\uff0c\u4f46\u7ed3\u6784\u98ce\u9669\u9ad8\uff0c\u5fc5\u987b\u6267\u884c48\u5c0f\u65f6\u6478\u5e95\u6838\u67e5\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u82e5\u652f\u4ed8\u6b3e\u9879\u6765\u6e90\u4e3a\u5bb6\u5ead\u91cd\u8981\u5f00\u652f\u6216\u672a\u7ecf\u5bb6\u4eba\u540c\u610f\uff0c\u540e\u7eed\u53ef\u80fd\u5f15\u53d1\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u7528\u6237\u884c\u52a8\u529b\u5f3a\uff0c\u914d\u5408\u5ea6\u9ad8\uff0c\u65f6\u95f4\u7ba1\u7406\u5c1a\u53ef\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u5fc3\u7406\u5f39\u6027\u4e2d\u7b49\uff0c\u672a\u8868\u73b0\u51fa\u6280\u672f\u754f\u96be\u6216\u60c5\u7eea\u5d29\u6e83\u8ff9\u8c61\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669\uff01** \u7528\u6237\u5bf9\u201c\u591a\u4e45\u80fd\u8d5a\u94b1\u201d\u6709\u660e\u786e\u4e14\u6025\u5207\u7684\u671f\u5f85\u3002\u82e5\u5f00\u8bfe\u540e1-2\u4e2a\u6708\u5185\u672a\u83b7\u5f97\u4efb\u4f55\u53d8\u73b0\u673a\u4f1a\u6216\u6b63\u5411\u53cd\u9988\uff0c\u6781\u6613\u56e0\u201c\u627f\u8bfa\u672a\u5151\u73b0\u201d\u611f\u800c\u66b4\u6012\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c4-8\u5468**\u3002\u82e5\u6b64\u65f6\u7528\u6237\u4ecd\u672a\u83b7\u5f97\u4efb\u4f55\u8bd5\u97f3\u901a\u8fc7\u6216\u5fae\u5c0f\u6536\u5165\uff0c\u5c06\u89e6\u53d1\u5176\u201c\u6536\u76ca\u843d\u5dee\u201d\u7ea2\u7ebf\uff0c\u9000\u8d39\u6295\u8bc9\u98ce\u9669\u6025\u5267\u5347\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u770b\u5230\u4f60\u884c\u52a8\u529b\u8fd9\u4e48\u5f3a\uff0c\u771f\u7684\u5f88\u68d2\uff01\u54b1\u4eec\u8fd9\u4e2a\u884c\u4e1a\uff0c\u5c31\u50cf\u5b66\u5f00\u8f66\uff0c\u62ff\u5230\u9a7e\u7167\uff08\u57fa\u7840\u6280\u80fd\uff09\u662f\u7b2c\u4e00\u6b65\uff0c\u4e0a\u8def\u63a5\u5355\uff08\u53d8\u73b0\uff09\u662f\u7b2c\u4e8c\u6b65\u3002\u6211\u4f1a\u7ed9\u4f60\u4e00\u4efd\u6e05\u6670\u7684\u2018\u63a5\u5355\u8fdb\u5ea6\u5730\u56fe\u2019\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u7a33\u624e\u7a33\u6253\u5730\u628a\u94b1\u8d5a\u5230\u624b\u3002**\u524d\u671f\u53ef\u80fd\u4f1a\u6709\u70b9\u67af\u71e5\uff0c\u4f46\u53ea\u8981\u4f60\u8ddf\u7740\u5730\u56fe\u8d70\uff0c\u6211\u4fdd\u8bc1\u4f60\u80fd\u770b\u5230\u5b9e\u5b9e\u5728\u5728\u7684\u8fdb\u6b65\u548c\u673a\u4f1a\u3002**\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011** - \u6838\u5fc3\u6ee1\u8db3\u5176\u53d8\u73b0\u8bc9\u6c42\uff0c\u8bfe\u7a0b\u8bbe\u8ba1\u9700\u7a81\u51fa\u201c\u5b9e\u6218\u3001\u6d3e\u5355\u3001\u53d8\u73b0\u6848\u4f8b\u201d\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T4\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a**\u3010\u7cbe\u786e\u6d3e\u5355\u62e6\u622a\u5305\u3011** + **\u3010\u9006\u5411\u9884\u671f\u7ba1\u7406\u9632\u5fa1\u5305\u3011**\u3002\u5fc5\u987b\u4e25\u63a7\u5176\u201c\u66b4\u5bcc\u5e7b\u60f3\u201d\uff0c\u7528\u771f\u5b9e\u3001\u6e10\u8fdb\u7684\u63a5\u5355\u6848\u4f8b\u66ff\u4ee3\u7a7a\u5934\u627f\u8bfa\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u753b\u5927\u997c**\uff0c\u627f\u8bfa\u201c\u51e0\u5929/\u51e0\u5468\u5185\u5fc5\u8d5a\u94b1\u201d\uff1b2. \u5ffd\u89c6\u5176\u652f\u4ed8\u65b9\u5f0f\u98ce\u9669\uff0c\u4e0d\u8fdb\u884c\u5bb6\u5ead\u652f\u6301\u5ea6\u6478\u5e95\uff1b3. \u7528\u201c\u5174\u8da3\u201d\u3001\u201c\u60c5\u6000\u201d\u7b49\u975e\u529f\u5229\u6027\u8bdd\u9898\u8fc7\u5ea6\u6c9f\u901a\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u57fa\u7840\u6280\u80fd\u672a\u8fbe\u6807\u3001\u672a\u83b7\u5f97\u9996\u6b21\u5c0f\u989d\u6536\u5165\u524d\uff0c\u8fdb\u884c\u4efb\u4f55\u9ad8\u9636\u8bfe\u7a0b\u6216\u8bbe\u5907\u7684\u5347\u5355\u63a8\u9500**\u3002\u5fc5\u987b\u6267\u884c\u201c\u5148\u6709\u7ed3\u679c\uff0c\u518d\u8c08\u5347\u7ea7\u201d\u7684\u94c1\u5f8b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u4ec0\u4e48\u65f6\u5019\u53ef\u4ee5\u8d5a\u94b1[\u6342\u8138][\u6342\u8138][\u6342\u8138]\u201d **(\u4f4e\u52a8\u673a\u7eaf\u5ea6\u6838\u5fc3\u8bc1\u636e)**\n2. > \u201c\u80fd\u517c\u804c\u8d5a\u94b1\u7684\u90fd\u53ef\u4ee5\u201d **(\u529f\u5229\u6027\u5bfc\u5411\uff0c\u65e0\u89c6\u6280\u80fd\u504f\u597d)**\n3. > \u201c\u6211\u4ea4\u4e86\uff0c\u6211\u7740\u6025\u8d5a\u94b1\uff0c\u54c8\u54c8\u201d & \u201c\u94b1\u591a\u94b1\u5c11\u90fd\u884c\uff0c\u5c11\u7684\u8bdd\u6211\u8d70\u91cf\u591a\u8bfb\u51e0\u672c\u4e5f\u884c\u201d **(\u6025\u5207\u53d8\u73b0\u5fc3\u6001\u4e0e\u201c\u8d70\u91cf\u201d\u601d\u7ef4\uff0c\u5178\u578bT4\u7279\u5f81)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4 \u641e\u94b1\u7ed3\u679c\u8bba\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7ecf\u6d4e\u5b89\u5168\u4e0e\u4fdd\u969c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u4e25\u683c\u6267\u884c\u9006\u5411\u9884\u671f\u7ba1\u7406 + 48\u5c0f\u65f6\u5185\u652f\u4ed8\u65b9\u5f0f\u4e0e\u5bb6\u5ead\u652f\u6301\u5ea6\u6478\u5e95\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u8bba\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf\"}\n```";
