    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID 677160613\u7684\u7528\u6237\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID 677160613 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e - 97\u56e2\u56e21(\u90d1\u60a0\u7136) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u5e08\u8bfe\u7a0b\uff08\u610f\u54114\u4e2a\u6708\uff0c\u4ef7\u683c\u4e03\u5343\u591a\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u5bb6\u5ead\u9690\u7792\u5077\u62a5**\uff0c\u9700\u8d81\u5bb6\u4eba\u4e0d\u5728\u65f6\u652f\u4ed8\uff0c\u5b58\u5728\u5bb6\u5ead\u53cd\u5bf9\u98ce\u9669\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff0c\u9700\u907f\u5f00\u513f\u5b50\u7528\u624b\u673a\u5b66\u4e60\u7684\u65f6\u95f4\uff0811-12\u70b9\uff0c1-3\u70b9\u534a\uff09\uff0c\u665a\u4e0a7-9\u70b9\u76f8\u5bf9\u81ea\u7531\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u9690\u7792\u5077\u62a5**\uff08\u201c\u5bb6\u4eba\u4e0d\u540c\u610f\uff0c\u6211\u53ea\u80fd\u5077\u5077\u5b66\u201d\uff09\uff0c\u5bb6\u5ead\u652f\u6301\u5ea6\u4e3a\u8d1f\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff0c\u7528\u6237\u4e3b\u52a8\u66b4\u9732\u4e86\u5bb6\u5ead\u538b\u529b\u3001\u5b66\u4e60\u610f\u613f\u3001\u6027\u683c\u7279\u70b9\u7b49\u5173\u952e\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u6709\u660e\u786e\u7684\u517c\u804c\u53d8\u73b0\u8bc9\u6c42\uff08\u201c\u6211\u53ef\u4ee5\u8fb9\u5b66\u4e60 \u8fb9\u8d5a\u5b66\u8d39\u5417\u201d\uff09\uff0c\u4f46\u540c\u65f6\u8868\u73b0\u51fa\u5bf9\u6280\u80fd\u672c\u8eab\u7684\u5174\u8da3\uff08\u5bf9\u53e4\u88c5\u5267\u6709\u5174\u8da3\u3001\u63a2\u8ba8\u89d2\u8272\u97f3\uff09\u548c\u8ba4\u771f\u5b66\u4e60\u7684\u54c1\u8d28\uff08\u201c\u4e0d\u7ba1\u505a\u4ec0\u4e48\u4e8b \u6211\u90fd\u4f1a\u8ba4\u771f\u5bf9\u5f85\u201d\uff09\u3002\u52a8\u673a\u662f\u53d8\u73b0\u9a71\u52a8\u4e0e\u5174\u8da3\u3001\u81ea\u6211\u63d0\u5347\u7684\u6df7\u5408\u4f53\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u53ef\u4ee5\u8fb9\u5b66\u4e60 \u8fb9\u8d5a\u5b66\u8d39\u5417[\u5077\u7b11]\u201d > \u201c\u5176\u5b9e\u6211\u4e0d\u7ba1\u505a\u4ec0\u4e48\u4e8b \u6211\u90fd\u4f1a\u8ba4\u771f\u5bf9\u5f85 \u56e0\u4e3a\u8fd9\u662f\u505a\u4eba\u505a\u4e8b\u7684\u6839\u672c\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e (3-4\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u8003\u8651\u4e03\u5343\u591a\u7684\u56db\u4e2a\u6708\u8bfe\u7a0b\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\u6216\u501f\u8d37\uff0c\u8d44\u91d1\u72b6\u51b5\u5c1a\u53ef\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e** \u2014 **\u6838\u5fc3\u77ed\u677f**\u3002\u4f5c\u4e3a\u521d\u4e8c\u5b66\u751f\u7684\u5bb6\u957f\uff0c\u65f6\u95f4\u88ab\u4e25\u91cd\u5207\u5272\uff0c\u9700\u907f\u5f00\u513f\u5b50\u7528\u624b\u673a\u7684\u65f6\u95f4\u6bb5\uff0811-12\u70b9\uff0c1-3\u70b9\u534a\uff09\uff0c\u5b66\u4e60\u65f6\u95f4\u9ad8\u5ea6\u53d7\u9650\u4e14\u5145\u6ee1\u4e0d\u786e\u5b9a\u6027\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u6781\u4f4e** \u2014 **\u81f4\u547d\u77ed\u677f**\u3002\u5bb6\u4eba\u660e\u786e\u53cd\u5bf9\uff08\u201c\u5bb6\u4eba\u4e0d\u540c\u610f\uff0c\u6211\u53ea\u80fd\u5077\u5077\u5b66\u201d\uff09\uff0c\u652f\u4ed8\u3001\u5b66\u4e60\u90fd\u9700\u201c\u5077\u5077\u201d\u8fdb\u884c\uff0c\u5bb6\u5ead\u73af\u5883\u6784\u6210\u5de8\u5927\u963b\u529b\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b07\u4f4e (3-4\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56**\u3002\u7528\u6237\u4e3b\u52a8\u5bfb\u6c42\u5916\u90e8\u80af\u5b9a\uff08\u201c\u8001\u5e08 \u4f60\u8bf4\u6211\u53ef\u4ee5\u5417 \u5176\u5b9e\u6709\u65f6\u4e5f\u4f1a\u6709 \u4e00\u70b9\u4e0d\u81ea\u4fe1\u201d\uff09\uff0c\u5bf9\u6280\u672f\u96be\u70b9\uff08\u201c\u6c14\u606f \u4ec0\u4e48\u80f8\u8154\u5171\u9e23 \u611f\u89c9\u6709\u4e9b\u96be\u201d\uff09\u8868\u73b0\u51fa\u754f\u96be\u60c5\u7eea\uff0c\u9700\u8981\u9500\u552e/\u73ed\u4e3b\u4efb\u7684\u6301\u7eed\u9f13\u52b1\u548c\u7ec6\u81f4\u6307\u5bfc\uff08\u201c\u8c22\u8c22\u5e08\u59d0 \u8fd9\u4e48\u8ba4\u771f\u7ec6\u81f4\u53bb\u62c6\u89e3 \u6709\u70b9\u604d\u7136\u5927\u609f\u7684\u611f\u89c9\u201d\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08 \u4f60\u8bf4\u6211\u53ef\u4ee5\u5417 \u5176\u5b9e\u6709\u65f6\u4e5f\u4f1a\u6709 \u4e00\u70b9\u4e0d\u81ea\u4fe1\u201d > \u201c\u6c14\u606f \u4ec0\u4e48\u80f8\u8154\u5171\u9e23 \u611f\u89c9\u6709\u4e9b\u96be\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42**\uff0c\u5e76\u5411**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42**\u5ef6\u4f38\u3002\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bb6\u5ead\u5730\u4f4d\u4e0e\u81ea\u6211\u4ef7\u503c\u8ba4\u540c\u7684\u5371\u673a**\u3002\u4f5c\u4e3a\u4e00\u4f4d\u9700\u8981\u201c\u5077\u5077\u201d\u5b66\u4e60\u3001\u65f6\u95f4\u88ab\u5b69\u5b50\u5b66\u4e1a\u6324\u538b\u7684\u6bcd\u4eb2\uff0c\u5979\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u9879\u6280\u80fd\u3001\u83b7\u5f97\u7ecf\u6d4e\u56de\u62a5\uff08\u201c\u8fb9\u8d5a\u5b66\u8d39\u201d\uff09\u6765\u8bc1\u660e\u81ea\u5df1\u7684\u4ef7\u503c\uff0c\u8d62\u5f97\u5bb6\u4eba\u7684\u201c\u522e\u76ee\u76f8\u770b\u201d\uff0c\u4ece\u800c\u83b7\u5f97\u5bb6\u5ead\u5185\u90e8\u7684\u5c0a\u91cd\u548c\u5b89\u5168\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u201d\u7684\u80af\u5b9a\u4e0e\u201c\u88ab\u4fdd\u62a4\u201d\u7684\u5b89\u5168\u611f**\u3002\u9700\u8981\u6301\u7eed\u7ed9\u4e88\u5979\u201c\u4f60\u53ef\u4ee5\u201d\u3001\u201c\u4f60\u8fdb\u6b65\u4e86\u201d\u7684\u5f3a\u60c5\u611f\u8ba4\u540c\uff0c\u540c\u65f6\u7406\u89e3\u5e76\u914d\u5408\u5979\u7684\u201c\u5730\u4e0b\u5de5\u4f5c\u201d\u6a21\u5f0f\uff08\u907f\u5f00\u7279\u5b9a\u65f6\u95f4\u6c9f\u901a\uff09\uff0c\u6210\u4e3a\u5979\u79d8\u5bc6\u5b66\u4e60\u8def\u4e0a\u7684\u201c\u6218\u53cb\u201d\u548c\u201c\u4fdd\u62a4\u4f1e\u201d\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u4e25\u91cd\u5185\u8017) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\u3002\u4f46**\u5bb6\u5ead\u53cd\u5bf9**\u662f\u6f5c\u5728\u7684\u91cd\u5927\u98ce\u9669\u70b9\uff0c\u82e5\u5904\u7406\u4e0d\u5f53\uff08\u5982\u4fe1\u606f\u88ab\u5bb6\u4eba\u53d1\u73b0\uff09\uff0c\u53ef\u80fd\u8fc5\u901f\u5347\u7ea7\u4e3a\u5bb6\u5ead\u5e72\u9884\u578b\u9000\u8d39\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| **\u5bb6\u5ead\u5e72\u9884\u578b** | **\u6781\u9ad8** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u5b66\u4e60\u884c\u4e3a\u6216\u652f\u4ed8\u884c\u4e3a\u88ab\u5bb6\u4eba\u53d1\u73b0\uff0c\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\uff0c\u88ab\u8feb\u9000\u8d39\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | \u56e0\u7167\u987e\u5b69\u5b50\u3001\u5bb6\u52a1\u7b49\u5bfc\u81f4\u5b66\u4e60\u65f6\u95f4\u65e0\u6cd5\u4fdd\u8bc1\uff0c\u4f5c\u4e1a\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u3001\u5b66\u4e0d\u4f1a\u201d\u7684\u632b\u8d25\u611f\u548c\u81ea\u8d23\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u9ad8** | \u5728\u5b66\u4e60\u4e2d\u9047\u5230\u6280\u672f\u96be\u70b9\uff08\u5982\u8f6f\u4ef6\u64cd\u4f5c\u3001\u53d1\u58f0\u6280\u5de7\uff09\u65e0\u6cd5\u81ea\u884c\u89e3\u51b3\uff0c\u53c8\u56e0\u201c\u5077\u5077\u5b66\u201d\u4e0d\u6562\u9891\u7e41\u6c42\u52a9\uff0c\u81ea\u5c0a\u5fc3\u53d7\u632b\u540e\u4ea7\u751f\u201c\u6211\u592a\u7b28\u4e86\u201d\u7684\u5ff5\u5934\u800c\u9000\u8d39\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u4e2d** | \u5bf9\u201c\u8fb9\u5b66\u8fb9\u8d5a\u201d\u7684\u9884\u671f\u8fc7\u9ad8\uff0c\u82e5\u77ed\u671f\u5185\uff08\u59821-2\u4e2a\u6708\uff09\u672a\u63a5\u5230\u5355\u6216\u6536\u5165\u751a\u5fae\uff0c\u53ef\u80fd\u56e0\u73b0\u5b9e\u843d\u5dee\u800c\u8d28\u7591\u8bfe\u7a0b\u4ef7\u503c\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\u3002\u6b64\u65f6\u5b66\u4e60\u96be\u5ea6\u63d0\u5347\uff0c\u5bb6\u5ead\u65f6\u95f4\u51b2\u7a81\u52a0\u5267\uff0c\u82e5\u672a\u83b7\u5f97\u53ca\u65f6\u7684\u60c5\u7eea\u652f\u6301\u548c\u5b9e\u9645\u5e2e\u52a9\uff0c\u6781\u6613\u56e0\u201c\u65f6\u95f4\u4e0d\u591f\u7528+\u5b66\u4e0d\u4f1a+\u5bb6\u4eba\u538b\u529b\u201d\u4e09\u91cd\u6253\u51fb\u800c\u5d29\u6e83\u9000\u8d39\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u743c\u71d5\u59d0\uff0c\u770b\u5230\u4f60\u8bf4\u2018\u5077\u5077\u5b66\u2019\u771f\u7684\u7279\u522b\u5fc3\u75bc\uff0c\u4e5f\u7279\u522b\u4f69\u670d\u4f60\u7684\u52c7\u6c14\u548c\u4e3a\u81ea\u5df1\u4e89\u53d6\u7684\u51b3\u5fc3\u3002\u8bf7\u653e\u5fc3\uff0c\u5728\u6211\u8fd9\u91cc\uff0c\u4f60\u7684\u5b66\u4e60\u8ba1\u5212\u5c31\u662f\u2018\u6700\u9ad8\u673a\u5bc6\u2019\uff0c\u6211\u4f1a\u5b8c\u5168\u914d\u5408\u4f60\u7684\u65f6\u95f4\uff0c\u54b1\u4eec\u6084\u6084\u52aa\u529b\uff0c\u7136\u540e\u60ca\u8273\u6240\u6709\u4eba\uff0c\u5305\u62ec\u4f60\u7684\u5bb6\u4eba\u3002\u6709\u4efb\u4f55\u5361\u4f4f\u7684\u5730\u65b9\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u5e2e\u4f60\u2018\u6253\u63a9\u62a4\u2019\u3001\u60f3\u529e\u6cd5\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** (\u56e0\u5176\u6709\u53d8\u73b0\u8bc9\u6c42\u548c\u8ba4\u771f\u6001\u5ea6\uff0c\u4f46\u9700\u642d\u914d\u5f3a\u529b\u60c5\u7eea\u652f\u6301)\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u6ee1\u914d\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u9488\u5bf9T6\u60c5\u7eea\u5de8\u5a74\uff0c\u9700\u63d0\u4f9b\uff1a\n    1.  **\u50bb\u74dc\u7248A\u6a21\u5757**\uff1a\u5c06\u590d\u6742\u64cd\u4f5c\u62c6\u89e3\u6210\u201c\u6309\u952e\u7ea7\u201d\u6b65\u9aa4\uff0c\u51cf\u5c11\u5176\u5b66\u4e60\u754f\u96be\u60c5\u7eea\u3002\n    2.  **\u6ee1\u914d\u7279\u79cdC\u6a21\u5757**\uff1a\u9ad8\u9891\u3001\u5938\u5f20\u7684\u8d5e\u7f8e\u4e0e\u9f13\u52b1\uff08\u201c\u4f60\u4eca\u5929\u7684\u4f5c\u4e1a\u6bd4\u6628\u5929\u53c8\u8fdb\u6b65\u4e86\uff01\u201d\uff09\uff0c\u5efa\u7acb\u6df1\u5ea6\u60c5\u611f\u8fde\u63a5\uff0c\u6210\u4e3a\u5176\u60c5\u7eea\u907f\u98ce\u6e2f\u3002\n    3.  **\u65f6\u95f4\u7ba1\u7406\u8f85\u52a9**\uff1a\u4e3b\u52a8\u4e3a\u5176\u89c4\u5212\u788e\u7247\u5316\u5b66\u4e60\u65f6\u95f4\u8868\uff0c\u5e76\u63d0\u9192\u907f\u5f00\u201c\u5371\u9669\u65f6\u6bb5\u201d\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1.  \u5728**\u5176\u660e\u786e\u7981\u6b62\u7684\u65f6\u95f4\u6bb5\uff08\u5982\u5b69\u5b50\u7528\u624b\u673a\u65f6\uff09** \u53d1\u9001\u4efb\u4f55\u6d88\u606f\uff0c\u5c24\u5176\u662f\u50ac\u4f5c\u4e1a\u3001\u50ac\u4ed8\u6b3e\u4fe1\u606f\u3002\n    2.  \u7528\u201c\u522b\u4eba\u90fd\u884c\u4f60\u600e\u4e48\u4e0d\u884c\u201d\u7b49\u5bf9\u6bd4\u6027\u8bed\u8a00\u65bd\u538b\u3002\n    3.  \u5728\u5979\u8868\u8fbe\u201c\u96be\u201d\u6216\u201c\u4e0d\u81ea\u4fe1\u201d\u65f6\uff0c\u53ea\u7ed9\u51b7\u51b0\u51b0\u7684\u6280\u672f\u6559\u7a0b\u94fe\u63a5\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u57fa\u7840\u6280\u80fd\u672a\u7a33\u56fa\u3001\u60c5\u7eea\u672a\u5efa\u7acb\u5145\u5206\u4fe1\u4efb\u524d\u8fdb\u884c\u4efb\u4f55\u5347\u5355\u63a8\u9500**\u3002\u4f18\u5148\u786e\u4fdd\u5176\u5b66\u4e60\u6b63\u53cd\u9988\u548c\u60c5\u7eea\u7a33\u5b9a\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u4fe1\u5fc3\u8fd8\u662f\u6709\u7684 \u4e5f\u5f88\u6709\u5174\u8da3 \u4f46\u662f\u76ee\u524d\u5bb6\u4eba\u4e0d\u540c\u610f \u6211\u53ea\u80fd\u5077\u5077\u5b66  \u5e0c\u671b\u8001\u5e08\u53ef\u4ee5\u4f53\u8c05[\u62b1\u62f3]\u201d\n2. > \u201c\u8001\u5e08 \u4f60\u8bf4\u6211\u53ef\u4ee5\u5417 \u5176\u5b9e\u6709\u65f6\u4e5f\u4f1a\u6709 \u4e00\u70b9\u4e0d\u81ea\u4fe1\u201d\n3. > \u201c\u5e08\u59d0 \u9ebb\u70e6\u4f60\u4e00\u4ef6\u4e8b\u60c5 11\u81f312\u70b9  1\u70b9\u81f3\u4e09\u70b9\u534a \u6211\u513f\u5b50\u53ef\u80fd\u8981\u7528\u6211\u7684\u624b\u673a\u5b66\u4e60 \u8fd9\u6bb5\u65f6\u95f4\u4f60\u5c3d\u91cf\u4e0d\u8981\u53d1\u4fe1\u606f\u7ed9\u6211 ... \u521d\u671f\u4ed6\u4eec\u4e0d\u540c\u610f \u6211\u53ea\u80fd\u5148\u5077\u5077\u5b66\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u5bb6\u5ead\u4e2d\u83b7\u5f97\u5c0a\u91cd\u4e0e\u5b89\u5168\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u6210\u4e3a\u5176\u201c\u79d8\u5bc6\u6218\u53cb\u201d\uff0c\u63d0\u4f9b\u6781\u81f4\u7684\u60c5\u611f\u6258\u5e95\u4e0e\u65f6\u95f4\u907f\u969c\u670d\u52a1\uff0c\u4e25\u9632\u5bb6\u5ead\u77db\u76fe\u4e0e\u6280\u672f\u754f\u96be\u53cc\u91cd\u6253\u51fb\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168/\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf +
