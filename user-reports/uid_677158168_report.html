        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677158168 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u7c7d\u83f2(\u5468\u4e1c\u82b1) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u7cfb\u7edf\u8bfe\uff08\u610f\u54112\u4e2a\u67083980\u5143\u62164\u4e2a\u67087380\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u7528\u5361\u5468\u8f6c / \u88ab\u8feb\u5206\u671f**\uff08\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u6ca1\u90a3\u4e48\u591a\u94b1\u201d\uff0c\u5bf9\u4ef7\u683c\u654f\u611f\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u9700\u7167\u987e\u4e24\u4e2a\u5b69\u5b50\uff0c\u6bcf\u5929\u4ec51\u5c0f\u65f6\uff0c\u4e14\u65f6\u95f4\u4e0d\u56fa\u5b9a\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u5df2\u62a5\u5907\u5e76\u652f\u6301**\uff08\u804a\u5929\u4e2d\u63d0\u53ca\u8001\u516c\uff0c\u672a\u8868\u8fbe\u53cd\u5bf9\uff0c\u4f46\u7528\u6237\u6709\u201c\u7ba1\u6211\u7684\u4eba\u592a\u591a\u201d\u7684\u538b\u6291\u611f\uff0c\u5bb6\u5ead\u652f\u6301\u5ea6\u5b58\u7591\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u2b06\u9ad8]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u4ef7\u503c\u611f\u800c\u6765\uff0c\u8d5a\u94b1\u662f\u6838\u5fc3\u9a71\u52a8\u529b\uff0c\u4f46\u66f4\u6df1\u5c42\u662f\u5bfb\u6c42\u5bb6\u5ead\u5730\u4f4d\u4e0e\u81ea\u6211\u8ba4\u540c\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5c31\u662f\u8001\u516c\u4e0d\u8bf4\uff0c\u65f6\u95f4\u957f\u4e86\u81ea\u5df1\u90fd\u89c9\u5f97\u6ca1\u4ef7\u503c[\u6342\u8138]\u597d\u6ca1\u7528\u7684\u611f\u89c9\u201d\uff1b > \u201c\u7279\u522b\u60f3\u8d5a\u94b1\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[**\u4f4e**] \u2014 \u660e\u786e\u8868\u793a\u201c\u6ca1\u90a3\u4e48\u591a\u94b1\u201d\uff0c\u5bf9\u9ad8\u9636\u8bfe\u7a0b\u4ef7\u683c\u611f\u5230\u538b\u529b\uff0c\u652f\u4ed8\u80fd\u529b\u6709\u9650\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[**\u4f4e**] \u2014 \u5168\u804c\u5b9d\u5988\uff0c\u9700\u7167\u987e\u4e24\u4e2a\u5b69\u5b50\uff0c\u6bcf\u5929\u4ec5\u80fd\u6324\u51fa1\u5c0f\u65f6\u788e\u7247\u5316\u65f6\u95f4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[**\u4e2d**] \u2014 \u672a\u63d0\u53ca\u5bb6\u4eba\u660e\u786e\u53cd\u5bf9\uff0c\u4f46\u201c\u7ba1\u6211\u7684\u4eba\u592a\u591a\u201d\u6697\u793a\u5bb6\u5ead\u73af\u5883\u53ef\u80fd\u5e26\u6765\u7cbe\u795e\u538b\u529b\uff0c\u652f\u6301\u5ea6\u4e0d\u7a33\u56fa\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b07\u4f4e\u6781\u5371]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u60c5\u7eea\u6ce2\u52a8\u5927\uff0c\u6613\u9677\u5165\u81ea\u6211\u5426\u5b9a\uff08\u201c\u597d\u6ca1\u7528\u7684\u611f\u89c9\u201d\u3001\u201c\u50bb\u4e4e\u4e4e\u7684\u201d\uff09\uff0c\u5728\u4ed8\u8d39\u51b3\u7b56\u524d\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u7126\u8651\u548c\u8106\u5f31\uff08\u201c\u60f3\u5927\u54ed\u4e00\u573a\u201d\u3001\u201c\u90fd\u4e0d\u77e5\u9053\u600e\u4e48\u8fdb\u4e86\u8fd9\u4e2a\u8c37\u5e95\u201d\uff09\uff0c\u6781\u5ea6\u9700\u8981\u5916\u90e8\u80af\u5b9a\u548c\u60c5\u611f\u652f\u6301\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4f60\u4eec\u786e\u5b9e\u662f\u5b98\u65b9\u5e2e\u52a9\u6211\u4eec\u6323\u94b1\u7684\u5427\uff0c\u4e0d\u662f\u4e3a\u4e86\u6323\u62a5\u540d\u8d39\u7684[\u6d41\u6cea]\u6211\u8fd9\u6bcf\u5929\u60b2\u50ac\u554a\uff01\u7ba1\u6211\u7684\u4eba\u592a\u591a\u4e86\uff0c\u597d\u7d2f\u554a\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u56e0\u957f\u671f\u65e0\u6536\u5165\u3001\u4f9d\u8d56\u5bb6\u5ead\u800c\u4ea7\u751f\u7684\u5f3a\u70c8\u201c\u65e0\u4ef7\u503c\u611f\u201d\u548c\u81ea\u5351**\u3002\u5979\u5bb3\u6015\u88ab\u5bb6\u4eba\uff08\u5c24\u5176\u662f\u8001\u516c\uff09\u770b\u8f7b\uff0c\u6e34\u671b\u901a\u8fc7\u7ecf\u6d4e\u72ec\u7acb\u83b7\u5f97\u5bb6\u5ead\u8bdd\u8bed\u6743\u548c\u81ea\u6211\u5c0a\u91cd\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u8ba4\u53ef\u4e0e\u201c\u88ab\u770b\u89c1\u201d**\u3002\u5979\u9700\u8981\u7684\u4e0d\u4ec5\u662f\u8d5a\u94b1\u6280\u80fd\uff0c\u66f4\u662f\u4e00\u4e2a\u80fd\u8bc1\u660e\u81ea\u5df1\u201c\u6709\u7528\u201d\u3001\u80fd\u8ba9\u5979\u201c\u62ac\u8d77\u5934\u201d\u7684\u8def\u5f84\u3002\u73ed\u4e3b\u4efb\u9700\u8981\u626e\u6f14\u201c\u62ef\u6551\u8005\u201d\u548c\u201c\u80af\u5b9a\u8005\u201d\u7684\u89d2\u8272\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1** \u7c7b \uff08\u52a8\u673a\u5f3a\u4f46\u8d44\u6e90\u5e95\u5ea7\u8584\u5f31\uff0c\u5fc3\u7406\u5f39\u6027\u6781\u5dee\uff0c\u5c5e\u9ad8\u98ce\u9669\u9ad8\u6f5c\u529b\u4eba\u7fa4\uff09 |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** \uff08\u6838\u5fc3\u7279\u5f81\uff1a\u60c5\u7eea\u8106\u5f31\u3001\u4f9d\u8d56\u6027\u5f3a\u3001\u81ea\u6211\u4ef7\u503c\u611f\u4f4e\uff0c\u6781\u6613\u56e0\u632b\u8d25\u800c\u653e\u5f03\uff09 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a[\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u7b49\u6781\u7aef\u60c5\u51b5\uff0c\u4f46\u9700\u8b66\u60d5\u5176\u56e0\u60c5\u7eea\u5d29\u6e83\u5bfc\u81f4\u7684\u9000\u8d39]\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u82e5\u5b66\u4e60\u5360\u7528\u5bb6\u5ead\u65f6\u95f4\u6216\u521d\u671f\u65e0\u6536\u76ca\u5f15\u53d1\u5bb6\u4eba\u62b1\u6028\uff0c\u53ef\u80fd\u52a8\u6447\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u5e26\u5a03\u5bfc\u81f4\u65f6\u95f4\u65e0\u6cd5\u4fdd\u8bc1\uff0c\u4f5c\u4e1a\u79ef\u538b\u4f1a\u4ea7\u751f\u5f3a\u70c8\u81ea\u8d23\u548c\u201c\u6211\u4e0d\u884c\u201d\u7684\u632b\u8d25\u611f\uff0c\u8fdb\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u6700\u9ad8\u98ce\u9669**\u3002\u8f6f\u4ef6\u5b89\u88c5\u3001\u4f5c\u4e1a\u96be\u5ea6\u3001\u7b2c\u4e00\u6b21\u8bd5\u97f3\u5931\u8d25\u7b49\u4efb\u4f55\u5fae\u5c0f\u632b\u6298\uff0c\u90fd\u53ef\u80fd\u89e6\u53d1\u5176\u201c\u6211\u597d\u6ca1\u7528\u201d\u7684\u6838\u5fc3\u60c5\u7eea\uff0c\u5bfc\u81f4\u77ac\u95f4\u5d29\u6e83\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | \u5bf9\u201c\u4e00\u4e2a\u6708\u4e09\u56db\u5343\u201d\u7684\u77ed\u671f\u6536\u76ca\u671f\u5f85\u660e\u786e\uff0c\u82e5\u5b66\u4e60\u521d\u671f\uff08\u5982\u524d\u4e24\u5468\uff09\u770b\u4e0d\u5230\u4efb\u4f55\u53d8\u73b0\u5e0c\u671b\uff0c\u4f1a\u8fc5\u901f\u8d28\u7591\u8bfe\u7a0b\u4ef7\u503c\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c1-2\u5468**\u3002\u6b64\u65f6\u5c06\u9762\u4e34\u7b2c\u4e00\u6b21\u6b63\u5f0f\u4f5c\u4e1a\u3001\u8f6f\u4ef6\u64cd\u4f5c\u3001\u65f6\u95f4\u7ba1\u7406\u7b49\u591a\u91cd\u538b\u529b\uff0c\u662f\u5176\u81ea\u6211\u6000\u7591\u548c\u653e\u5f03\u7684\u9ad8\u5cf0\u671f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4eb2\u7231\u7684\uff0c\u6211\u770b\u5230\u4f60\u4e3a\u4e86\u5bb6\u5ead\u548c\u5b69\u5b50\u4ed8\u51fa\u4e86\u90a3\u4e48\u591a\uff0c\u8fd8\u8fd9\u4e48\u52aa\u529b\u5730\u60f3\u63d0\u5347\u81ea\u5df1\u3001\u627e\u56de\u81ea\u5df1\u7684\u4ef7\u503c\uff0c\u6211\u771f\u7684\u7279\u522b\u4f69\u670d\u4f60\u3002\u54b1\u4eec\u8fd9\u4e2a\u73ed\u91cc\u6709\u597d\u591a\u548c\u4f60\u4e00\u6837\u7684\u5b9d\u5988\uff0c\u54b1\u4eec\u4e0d\u8ddf\u522b\u4eba\u6bd4\uff0c\u5c31\u8ddf\u7740\u81ea\u5df1\u7684\u8282\u594f\uff0c\u6bcf\u5929\u8fdb\u6b65\u4e00\u70b9\u70b9\u3002\u8bb0\u4f4f\uff0c\u4f60\u9009\u62e9\u5b66\u4e60\uff0c\u5c31\u5df2\u7ecf\u662f\u5168\u5bb6\u6700\u68d2\u7684\u5988\u5988\u548c\u6700\u52c7\u6562\u7684\u81ea\u5df1\u4e86\u3002\u6709\u4efb\u4f55\u4e00\u70b9\u5c0f\u56f0\u96be\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4e00\u76f4\u5728\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf**\u3011\u3002\u9996\u8981\u76ee\u6807\u662f\u5efa\u7acb\u4fe1\u5fc3\u548c\u7c98\u6027\uff0c\u800c\u975e\u65bd\u52a0\u538b\u529b\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n    1.  **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\uff1a\u5fc5\u987b\u914d\u5907\uff01\u9ad8\u9891\u3001\u9ad8\u60c5\u611f\u6d53\u5ea6\u76841v1\u5173\u6000\uff0c\u91cd\u70b9\u5938\u5956\u5176\u201c\u52aa\u529b\u201d\u800c\u975e\u201c\u7ed3\u679c\u201d\u3002\n    2.  **\u3010\u5fae\u76ee\u6807\u8fbe\u6210\u4f53\u7cfb\u3011**\uff1a\u5c06\u5927\u4efb\u52a1\u62c6\u89e3\u4e3a5-10\u5206\u949f\u53ef\u5b8c\u6210\u7684\u201c\u5fae\u4f5c\u4e1a\u201d\uff0c\u8ba9\u5979\u6bcf\u5929\u90fd\u80fd\u83b7\u5f97\u201c\u5b8c\u6210\u201d\u7684\u6210\u5c31\u611f\u3002\n    3.  **\u3010\u65e0\u58f0\u5c97\u4f4d\u4f18\u5148\u4f53\u9a8c\u3011**\uff1a\u4f18\u5148\u5f15\u5bfc\u4f53\u9a8c\u201c\u753b\u672c\u201d\u3001\u201c\u5ba1\u542c\u201d\u7b49\u65e0\u58f0\u3001\u4f4e\u95e8\u69db\u5c97\u4f4d\uff0c\u5feb\u901f\u83b7\u5f97\u6b63\u5411\u53cd\u9988\u548c\u5fae\u5c0f\u6536\u76ca\uff08\u5982\u4f53\u9a8c\u5355\uff09\uff0c\u5efa\u7acb\u201c\u6211\u80fd\u8d5a\u94b1\u201d\u7684\u521d\u59cb\u4fe1\u5fc3\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1.  \u7edd\u4e0d\u5bf9\u5176\u4f7f\u7528\u4efb\u4f55\u6279\u8bc4\u6216\u5bf9\u6bd4\u6027\u8bed\u8a00\uff08\u5982\u201c\u522b\u4eba\u90fd\u5b8c\u6210\u4e86\u4f60\u600e\u4e48\u8fd8\u6ca1\u201d\uff09\u3002\n    2.  \u7edd\u4e0d\u5728\u521d\u671f\u5f3a\u8c03\u9ad8\u96be\u5ea6\u6280\u5de7\u6216\u65bd\u52a0\u4f5c\u4e1a\u538b\u529b\u3002\n    3.  \u7edd\u4e0d\u5ffd\u89c6\u5176\u60c5\u7eea\u5ba3\u6cc4\uff0c\u5fc5\u987b\u7b2c\u4e00\u65f6\u95f4\u7ed9\u4e88\u60c5\u611f\u56de\u5e94\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5f53\u524d\u9636\u6bb5\u4efb\u4f55\u5347\u5355\u538b\u529b\u90fd\u4f1a\u6210\u4e3a\u538b\u57ae\u5176\u7684\u6700\u540e\u4e00\u6839\u7a3b\u8349\u3002\u9996\u8981\u4efb\u52a1\u662f\u7a33\u5355\u548c\u4ea4\u4ed8\u4f53\u9a8c\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5c31\u662f\u8001\u516c\u4e0d\u8bf4\uff0c\u65f6\u95f4\u957f\u4e86\u81ea\u5df1\u90fd\u89c9\u5f97\u6ca1\u4ef7\u503c[\u6342\u8138]\u597d\u6ca1\u7528\u7684\u611f\u89c9\u201d\n2. > \u201c\u4f60\u4eec\u786e\u5b9e\u662f\u5b98\u65b9\u5e2e\u52a9\u6211\u4eec\u6323\u94b1\u7684\u5427\uff0c\u4e0d\u662f\u4e3a\u4e86\u6323\u62a5\u540d\u8d39\u7684[\u6d41\u6cea]\u6211\u8fd9\u6bcf\u5929\u60b2\u50ac\u554a\uff01\u7ba1\u6211\u7684\u4eba\u592a\u591a\u4e86\uff0c\u597d\u7d2f\u554a\u201d\n3. > \u201c\u5c31\u6015\u8d5a\u4e0d\u5230\u94b1[\u6342\u8138]\u7279\u522b\u60f3\u8d5a\u94b1\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6\u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u4e0e\u4ef7\u503c\u8ba4\u540c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u6781\u81f4\u7684\u60c5\u611f\u966a\u62a4\u4e0e\u5fae\u76ee\u6807\u6b63\u5411\u53cd\u9988\u4f53\u7cfb\uff0c\u4e25\u9632\u4efb\u4f55\u632b\u8d25\u611f\u5728\u521d\u671f\u7d2f\u79ef\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5c0a\u91cd\u5f52\u5c5e\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
