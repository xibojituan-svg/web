    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a676954932\u7684\u7528\u6237\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a676954932 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-02-27 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u4e2b\u4e2b(\u6c6a\u9510) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u5199\u4f5c\u8bfe\uff08\u57fa\u7840\u73ed\uff09\u3001\u6539\u7a3f\u8bfe\uff08\u610f\u5411\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u672a\u63d0\u53ca |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u5de5\u4f5c\u7e41\u5fd9\uff0c\u5468\u672b\u6700\u5fd9\uff0c\u5e38\u52a0\u73ed\uff0c\u770b\u76f4\u64ad\u9700\u56de\u653e\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u672a\u63d0\u53ca |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\uff08\u5b66\u4e60\u884c\u4e3a\u4e0e\u65f6\u95f4\u51b2\u7a81\u4fe1\u606f\u660e\u786e\uff0c\u4f46\u52a8\u673a\u4e0e\u8d44\u6e90\u7ec6\u8282\u8f83\u5c11\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\uff0c\u6709\u5b66\u4e60\u610f\u613f\u4f46\u672a\u8868\u73b0\u51fa\u6781\u5f3a\u53d8\u73b0\u6e34\u671b\u6216\u6280\u672f\u94bb\u7814\u70ed\u60c5\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u73ed\u73ed\uff0c\u6211\u7684\u90a3\u4e2a\u77ed\u7bc7\u5c0f\u8bf4\u5199\u5b8c\u4e86\uff0c\u73ed\u73ed\u4f60\u53ef\u4ee5\u5e2e\u6211\u770b\u4e00\u4e0b\u5417\uff1f\u201d (\u4e3b\u52a8\u63d0\u4ea4\u4f5c\u4e1a\u5e76\u5bfb\u6c42\u53cd\u9988\uff0c\u6709\u5b66\u4e60\u610f\u613f)\n> \u201c\u90a3\u4e2a\u6539\u7a3f\u8bfe\uff0c\u8fd8\u53ef\u4ee5\u62a5\u540d\u5417\u201d (\u4e3b\u52a8\u8be2\u95ee\u8fdb\u9636\u8bfe\u7a0b\uff0c\u6709\u6301\u7eed\u5b66\u4e60\u610f\u5411)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e (3-4\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u6216\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u2b07\u4f4e** \u2014 \u6838\u5fc3\u77ed\u677f\u3002\u5de5\u4f5c\u7e41\u5fd9\uff08\u201c\u660e\u5929\u8981\u4e0a\u73ed\u201d\u3001\u201c\u5468\u516d\uff0c\u5468\u5929\u662f\u8fd9\u4e24\u5929\u6700\u5fd9\u7684\u65f6\u5019\u201d\u3001\u201c\u4e34\u65f6\u52a0\u4e2a\u73ed\u201d\uff09\uff0c\u65e0\u6cd5\u53c2\u52a0\u76f4\u64ad\uff0c\u53ea\u80fd\u770b\u56de\u653e\uff0c\u5b66\u4e60\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8 (7-8\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9762\u5bf9\u6280\u672f\u95ee\u9898\uff08\u767b\u5f55\u3001\u627e\u89c6\u9891\u3001\u64cd\u4f5c\uff09\u591a\u6b21\u5c1d\u8bd5\uff0c\u672a\u62b1\u6028\u6216\u60c5\u7eea\u5d29\u6e83\uff0c\u80fd\u5e73\u548c\u6c9f\u901a\u5e76\u63a5\u53d7\u89e3\u51b3\u65b9\u6848\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u8bd5\u4e86\u4e00\u4e0b\u201d\u3001\u201c\u6211\u8bd5\u4e86\u4e00\u4e0b\uff0c\u8fd8\u662f\u4e0d\u884c\uff0c\u6211\u4e24\u4e2a\u624b\u673a\u53f7\u90fd\u767b\u5f55\u4e86\uff0c\u4e24\u4e2a\u8d26\u53f7\u662f\u4e0d\u4e00\u6837\u7684\u201d (\u9762\u5bf9\u767b\u5f55\u95ee\u9898\uff0c\u591a\u6b21\u4e3b\u52a8\u5c1d\u8bd5)\n> \u201c\u73ed\u73ed\uff0c\u6211\u5468\u516d\uff0c\u5468\u5929\u662f\u8fd9\u4e24\u5929\u6700\u5fd9\u7684\u65f6\u5019[\u6342\u8138]\u201d (\u9648\u8ff0\u4e8b\u5b9e\uff0c\u65e0\u62b1\u6028\uff0c\u914d\u5408\u5bfb\u6c42\u66ff\u4ee3\u65b9\u6848)\n> \u201c\u597d\u7684\uff0c\u73ed\u73ed\uff0c\u4f5c\u4e1a\u5df2\u5b8c\u6210[\u6109\u5feb]\u201d (\u5728\u65f6\u95f4\u7d27\u5f20\u60c5\u51b5\u4e0b\u5b8c\u6210\u4f5c\u4e1a\uff0c\u6001\u5ea6\u79ef\u6781)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 / \u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u65f6\u95f4\u6781\u5ea6\u532e\u4e4f**\u5bfc\u81f4\u7684**\u5b66\u4e60\u8fdb\u5ea6\u7126\u8651**\u548c**\u4e0e\u96c6\u4f53\u8131\u8282\u7684\u5b64\u72ec\u611f**\u3002\u4ed6\u65e0\u6cd5\u53c2\u4e0e\u76f4\u64ad\u4e92\u52a8\u3001\u5b9e\u65f6\u70b9\u8bc4\uff0c\u53ea\u80fd\u901a\u8fc7\u56de\u653e\u548c\u6587\u5b57\u6c9f\u901a\u8ffd\u8d76\u8fdb\u5ea6\uff0c\u62c5\u5fc3\u9519\u8fc7\u5173\u952e\u5185\u5bb9\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u4f60\u6ca1\u6709\u88ab\u843d\u4e0b\u201d\u7684\u5b89\u5168\u611f**\u548c**\u201c\u5f02\u6b65\u4e5f\u80fd\u5b66\u597d\u201d\u7684\u786e\u5b9a\u6027**\u3002\u9700\u8981\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u5f02\u6b65\u8ddf\u8fdb\u7684\u8def\u5f84\u89c4\u5212\uff0c\u5e76\u5bf9\u5176\u6bcf\u4e00\u6b21\u4e3b\u52a8\u6c9f\u901a\u548c\u5b8c\u6210\u4f5c\u4e1a\u7ed9\u4e88\u53ca\u65f6\u3001\u80af\u5b9a\u7684\u56de\u5e94\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u52a8\u673a\u4e2d\u7b49\u3001\u8d44\u6e90\u5e95\u5ea7\u4f4e\u4f46\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9ed8\u9ed8\u5b8c\u6210\u4efb\u52a1) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u96f6\u4e92\u52a8\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u4e2d** | **\u56e0\u5de5\u4f5c\u6301\u7eed\u7e41\u5fd9\uff0c\u4f5c\u4e1a\u79ef\u538b\u8fc7\u591a\uff0c\u4ea7\u751f\u201c\u6c38\u8fdc\u8ddf\u4e0d\u4e0a\u201d\u7684\u65e0\u529b\u611f\uff0c\u6700\u7ec8\u653e\u5f03\u3002** |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u81ea\u884c\u89e3\u51b3\u95ee\u9898\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u76ee\u524d\u672a\u8868\u73b0\u51fa\u6025\u5207\u53d8\u73b0\u8bc9\u6c42\uff0c\u66f4\u5173\u6ce8\u5b66\u4e60\u8fc7\u7a0b\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u8bfe\u7a0b\u4e2d\u540e\u671f\uff08\u7b2c4-6\u5468\uff09**\uff0c\u5f53\u8bfe\u7a0b\u96be\u5ea6\u548c\u4f5c\u4e1a\u91cf\u589e\u52a0\uff0c\u800c\u5176\u65f6\u95f4\u74f6\u9888\u65e0\u6cd5\u7a81\u7834\u65f6\uff0c\u7d2f\u79ef\u7684\u8fdb\u5ea6\u538b\u529b\u53ef\u80fd\u5bfc\u81f4\u653e\u5f03\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u96fe\u51c7\uff0c\u770b\u5230\u4f60\u5de5\u4f5c\u7279\u522b\u5fd9\uff0c\u73ed\u73ed\u90fd\u8bb0\u4e0b\u4e86\u3002\u54b1\u4eec\u7684\u8bfe\u7a0b\u8bbe\u8ba1\u5145\u5206\u8003\u8651\u4e86\u50cf\u4f60\u8fd9\u6837\u65f6\u95f4\u5b9d\u8d35\u7684\u540c\u5b66\uff0c\u6240\u6709\u76f4\u64ad\u90fd\u6709\u56de\u653e\uff0c\u5173\u952e\u8282\u70b9\u6211\u4f1a\u5355\u72ec\u63d0\u9192\u4f60\u3002\u4f60\u6309\u81ea\u5df1\u7684\u8282\u594f\u6765\uff0c\u6709\u4efb\u4f55\u5361\u70b9\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u7684\u76ee\u6807\u662f\u2018\u5b66\u4f1a\u2019\uff0c\u4e0d\u662f\u2018\u8d76\u5b8c\u2019\u3002\u4f60\u6bcf\u6b21\u4e3b\u52a8\u4ea4\u4f5c\u4e1a\uff0c\u90fd\u7279\u522b\u68d2\uff01\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011- \u5176\u52a8\u673a\u548c\u5b8c\u6210\u4f5c\u4e1a\u7684\u884c\u4e3a\u8868\u660e\u4ed6\u503e\u5411\u4e8e\u8ba4\u771f\u5b66\u6280\u80fd\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u77ed\u677f\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145**\u3010\u5f02\u6b65\u5b66\u4e60\u62a4\u822a\u5305\u3011**\uff1a1) **\u5b9a\u5236\u7248\u5b66\u4e60\u8def\u5f84\u56fe**\uff08\u6807\u6ce8\u54ea\u4e9b\u8bfe\u53ef\u500d\u901f\uff0c\u54ea\u4e9b\u5fc5\u987b\u7ec6\u770b\uff09\uff1b2) **\u4f5c\u4e1a\u63d0\u4ea4\u7eff\u8272\u901a\u9053**\uff08\u5141\u8bb8\u5176\u5728\u4e0d\u5f71\u54cd\u8d28\u91cf\u7684\u524d\u63d0\u4e0b\uff0c\u5f39\u6027\u63d0\u4ea4\uff09\uff1b3) **\u5173\u952e\u77e5\u8bc6\u70b9\u201c\u8131\u6c34\u7248\u201d\u7b14\u8bb0**\uff08\u7531\u73ed\u4e3b\u4efb\u6216\u52a9\u6559\u63d0\u70bc\uff0c\u79c1\u53d1\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u5176\u4ed6\u540c\u5b66\u90fd\u5b8c\u6210\u4e86\u201d\u7b49\u8bdd\u8bed\u65bd\u52a0\u540c\u4faa\u538b\u529b\uff1b\u56e0\u5176\u65e0\u6cd5\u53c2\u52a0\u76f4\u64ad\u800c\u5ffd\u89c6\u6216\u51cf\u5c11\u5bf9\u5176\u7684\u5173\u6ce8\u4e0e\u53cd\u9988\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5176\u4e3b\u52a8\u8be2\u95ee\u6539\u7a3f\u8bfe\uff0c\u663e\u793a\u6709\u5347\u5355\u6f5c\u529b\u3002\u63a8\u4ecb\u65f6\u5e94\u5f3a\u8c03\u8bfe\u7a0b\u7684**\u5f02\u6b65\u5b66\u4e60\u53cb\u597d\u6027**\u548c**\u6210\u679c\u4ea4\u4ed8\u7684\u786e\u5b9a\u6027**\uff08\u5982\u201c\u603b\u7f16\u6279\u6ce8\u5f0f\u6539\u7a3f\u201d\uff09\uff0c\u800c\u975e\u201c\u9650\u65f6\u4f18\u60e0\u201d\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u73ed\u73ed\uff0c\u6211\u5468\u516d\uff0c\u5468\u5929\u662f\u8fd9\u4e24\u5929\u6700\u5fd9\u7684\u65f6\u5019[\u6342\u8138]\u201d **(\u8d44\u6e90\u5e95\u5ea7\u77ed\u677f\u7684\u6838\u5fc3\u8bc1\u636e)**\n2. > \u201c\u73ed\u73ed\uff0c\u6211\u4e34\u65f6\u52a0\u4e2a\u73ed\uff0c\u6211\u56de\u53bb\u770b\u56de\u653e\u201d **(\u9ad8\u5fc3\u7406\u5f39\u6027\u7684\u4f53\u73b0\uff1a\u4e3b\u52a8\u5b89\u6392\u66ff\u4ee3\u65b9\u6848\uff0c\u4e0d\u62b1\u6028)**\n3. > \u201c\u73ed\u73ed\uff0c\u6211\u7684\u90a3\u4e2a\u77ed\u7bc7\u5c0f\u8bf4\u5199\u5b8c\u4e86\uff0c\u73ed\u73ed\u4f60\u53ef\u4ee5\u5e2e\u6211\u770b\u4e00\u4e0b\u5417\uff1f\u201d **(\u4e2d\u7b49\u52a8\u673a\u7684\u4f53\u73b0\uff1a\u4e3b\u52a8\u5b8c\u6210\u5e76\u5bfb\u6c42\u53cd\u9988\uff0c\u6709\u5b66\u4e60\u5185\u9a71\u529b)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u65f6\u95f4\u532e\u4e4f\u4e2d\u5bfb\u6c42\u786e\u5b9a\u6027\u7684\u5b66\u4e60\u8fdb\u5ea6\u4e0e\u5b89\u5168\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u5b9a\u5236\u5316\u7684\u5f02\u6b65\u5b66\u4e60\u8def\u5f84\u4e0e\u53ca\u65f6\u3001\u80af\u5b9a\u7684\u4f5c\u4e1a\u53cd\u9988\uff0c\u7edd\u4e0d\u8ba9\u5176\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u4ea7\u751f\u5b64\u7acb\u65e0\u63f4\u611f\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168/\u793e\u4ea4\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5f02\u6b65\u5b66\u4e60\u62a4\u822a\u5305\"}\n```";
