    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4ee5\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\u7684\u8eab\u4efd\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v3.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u63d0\u4f9b\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\uff0c\u5e76\u6309\u7167\u300a\u8bca\u65ad\u62a5\u544a\u8f93\u51fa\u6a21\u677f\u300b\u7684\u683c\u5f0f\u8f93\u51fa\u5168\u666f\u62a5\u544a\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a296799948 / \u6635\u79f0\uff1a\u4e5d\u6816 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u7f8e\u4eba\u5fd7(\u4f55\u5a1f)\u3001\u73ed\u4e3b\u4efb-\u6d1b\u5947\u6eaa\u5802(\u5f20\u723d) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u9ad8\u9636\u7cfb\u7edf\u8bfe\u7a0b\uff08\u4ef7\u683c\u672a\u77e5\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u7f3a\u5931**\u3002\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u91d1\u989d\u3001\u662f\u5426\u5206\u671f\u6216\u501f\u8d37\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u7f3a\u5931**\u3002\u7528\u6237\u4ec5\u901a\u8fc7\u9009\u62e9\u9898\u56de\u7b54\u201c1-2\u5c0f\u65f6\u201d\uff0c\u4f46\u65e0\u5177\u4f53\u5de5\u4f5c/\u751f\u6d3b\u80cc\u666f\u4f50\u8bc1\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u3010\u9ad8\u5371\u9884\u8b66\u3011\u5bb6\u4eba\u4e0d\u652f\u6301**\u3002\u7528\u6237\u9009\u62e9\u9898\u56de\u7b54\u201cB.\u53ef\u80fd\u8001\u516c\u4e0d\u652f\u6301\u201d\uff0c\u9500\u552e\u56de\u5e94\u201c\u5bb6\u4eba\u6682\u65f6\u4e0d\u652f\u6301\u4e5f\u6ca1\u5173\u7cfb\uff0c\u5f88\u591a\u5b66\u5458\u90fd\u662f\u5148\u6084\u6084\u5b66\u201d\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u5173\u952e\u4fe1\u606f\u5982\u652f\u4ed8\u65b9\u5f0f\u3001\u5177\u4f53\u804c\u4e1a\u3001\u5bb6\u5ead\u7ecf\u6d4e\u72b6\u51b5\u3001\u771f\u5b9e\u65f6\u95f4\u5b89\u6392\u5747\u672a\u77e5\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u5bf9\u6709\u58f0\u884c\u4e1a\u5177\u4f53\u5de5\u79cd\uff08\u753b\u672c\u3001\u5ba1\u542c\u3001\u5f55\u4e66\uff09\u8868\u73b0\u51fa\u660e\u786e\u5174\u8da3\uff0c\u5b66\u4e60\u6001\u5ea6\u79ef\u6781\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u753b\u672c\uff0c\u5ba1\u542c\u86ee\u611f\u5174\u8da3\u7684\u201d\n  > \u201c\u611f\u89c9\u66f4\u575a\u5b9a\u4e86\u6211\u5165\u884c\u7684\u5fc3\u3002\u6709\u4fe1\u5fc3\uff01\u4e0d\u80fd\u4e00\u53e3\u5403\u6210\u5927\u80d6\u5c0f\u5b50\uff0c\u8981\u6162\u6162\u79ef\u5c11\u6210\u591a\uff0c\u591a\u52b3\u591a\u5f97[\u52a0\u6cb9]\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u65e0\u4efb\u4f55\u5173\u4e8e\u652f\u4ed8\u80fd\u529b\u3001\u6536\u5165\u3001\u7ecf\u6d4e\u72b6\u51b5\u7684\u63cf\u8ff0\u3002**\u65e0\u6cd5\u8bc4\u7ea7\uff0c\u89c6\u4e3a\u9ad8\u98ce\u9669\u9879\u3002**\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u4ec5\u901a\u8fc7\u9009\u62e9\u9898\u56de\u7b54\u201cB.1-2\u5c0f\u65f6\u201d\uff0c\u4f46\u65e0\u5177\u4f53\u5de5\u4f5c\u5236\u5ea6\u3001\u751f\u6d3b\u8d1f\u8377\u4f50\u8bc1\u3002**\u65e0\u6cd5\u8bc4\u7ea7\uff0c\u89c6\u4e3a\u9ad8\u98ce\u9669\u9879\u3002**\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u2b07\u4f4e** \u2014 \u660e\u786e\u8868\u793a\u201c\u53ef\u80fd\u8001\u516c\u4e0d\u652f\u6301\u201d\uff0c\u9500\u552e\u4e5f\u786e\u8ba4\u201c\u5bb6\u4eba\u6682\u65f6\u4e0d\u652f\u6301\u4e5f\u6ca1\u5173\u7cfb\u201d\u3002**\u89e6\u53ca\u5bb6\u5ead\u51b3\u7b56\u6743\u7ea2\u7ebf\u3002**\n- **\u5e95\u5ea7\u53d6\u77ed\u677f**\uff1a**\u2b07\u4f4e**\u3002\u5bb6\u5ead\u652f\u6301\u5ea6\u89e6\u53ca\u7ea2\u7ebf\uff0c\u4e14\u8d44\u91d1\u3001\u65f6\u95f4\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931\uff0c\u6784\u6210\u6781\u9ad8\u98ce\u9669\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u27a1\u4e2d\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u6001\u5ea6\u79ef\u6781\uff0c\u914d\u5408\u5ea6\u9ad8\uff0c\u80fd\u63a5\u53d7\u6307\u5bfc\u3002\u4f46**\u5bb6\u5ead\u963b\u529b\u662f\u5de8\u5927\u6f5c\u5728\u538b\u529b\u6e90**\uff0c\u4e00\u65e6\u66b4\u9732\u53ef\u80fd\u5f15\u53d1\u60c5\u7eea\u6ce2\u52a8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u611f\u89c9\u66f4\u575a\u5b9a\u4e86\u6211\u5165\u884c\u7684\u5fc3\u3002\u6709\u4fe1\u5fc3\uff01\u4e0d\u80fd\u4e00\u53e3\u5403\u6210\u5927\u80d6\u5c0f\u5b50\uff0c\u8981\u6162\u6162\u79ef\u5c11\u6210\u591a\uff0c\u591a\u52b3\u591a\u5f97[\u52a0\u6cb9]\u3002\u201d (\u8868\u73b0\u51fa\u79ef\u6781\u5fc3\u6001)\n  > **\u3010\u5bb6\u5ead\u963b\u529b\u8bc1\u636e\u3011**\uff1a\u9009\u62e9\u9898\u7b54\u6848\u201cBACB\u201d\u4e2d\uff0c\u7b2c\u4e8c\u9898\u9009\u62e9\u201cB.\u53ef\u80fd\u8001\u516c\u4e0d\u652f\u6301\u201d\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c** \u4e0e **\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e** \u6df7\u5408\u578b\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bb6\u5ead\u5185\u90e8\u7684\u4e0d\u88ab\u8ba4\u53ef\u4e0e\u6f5c\u5728\u7684\u8d22\u52a1\u4e0d\u5b89\u5168\u611f**\u3002\u7528\u6237\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u6709\u58f0\u6280\u80fd\u83b7\u5f97\u989d\u5916\u6536\u5165\uff08\u201c\u6bcf\u6708\u591a\u8d5a2000\uff5e3000\u5757\u201d\uff09\uff0c\u5e76\u9009\u62e9\u201cB.\u5b58\u70b9\u94b1\u5b9e\u73b0\u81ea\u5df1\u7684\u5c0f\u76ee\u6807\u201d\u548c\u201cC.\u4f53\u9a8c\u9760\u58f0\u97f3\u8d5a\u94b1\u7684\u6210\u5c31\u611f\u201d\uff0c\u8fd9\u65e2\u4f53\u73b0\u4e86\u5bf9\u7ecf\u6d4e\u4fdd\u969c\u7684\u6e34\u671b\uff08\u5b89\u5168\u9700\u6c42\uff09\uff0c\u4e5f\u9690\u542b\u4e86\u8bc1\u660e\u81ea\u6211\u4ef7\u503c\u3001\u83b7\u5f97\u8ba4\u53ef\u7684\u8bc9\u6c42\uff08\u5c0a\u91cd\u9700\u6c42\uff09\u3002**\u201c\u53ef\u80fd\u8001\u516c\u4e0d\u652f\u6301\u201d\u662f\u5173\u952e\u4fe1\u53f7\uff0c\u8868\u660e\u5176\u5b66\u4e60\u884c\u4e3a\u53ef\u80fd\u9762\u4e34\u5bb6\u5ead\u963b\u529b\uff0c\u6df1\u5c42\u9700\u6c42\u662f\u5bfb\u6c42\u7ecf\u6d4e\u72ec\u7acb\u548c\u5bb6\u5ead\u5730\u4f4d\u8ba4\u53ef\u3002**\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6210\u5c31\u8ba4\u53ef\u4e0e\u98ce\u9669\u515c\u5e95\u7684\u53cc\u91cd\u4fdd\u969c**\u3002\u4e00\u65b9\u9762\uff0c\u9700\u8981\u6301\u7eed\u80af\u5b9a\u5176\u5b66\u4e60\u8fdb\u6b65\u548c\u6f5c\u5728\u4ef7\u503c\uff0c\u6ee1\u8db3\u5176\u5c0a\u91cd\u9700\u6c42\uff1b\u53e6\u4e00\u65b9\u9762\uff0c\u5fc5\u987b\u8c28\u614e\u5904\u7406\u5bb6\u5ead\u5173\u7cfb\uff0c\u907f\u514d\u56e0\u5bb6\u4eba\u53cd\u5bf9\u5f15\u53d1\u5267\u70c8\u51b2\u7a81\u548c\u9000\u8d39\uff0c\u5e76\u63d0\u4f9b\u6e05\u6670\u3001\u52a1\u5b9e\u7684\u6280\u80fd\u6210\u957f\u8def\u5f84\uff0c\u800c\u975e\u5938\u5927\u53d8\u73b0\u627f\u8bfa\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udd34 D\u7c7b\uff08\u9ad8\u5371\u7194\u65ad\u578b\uff09** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **\u9000\u8d39\u578b\uff08\u4ea7\u54c1\u9519\u914d\u578b\uff09** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a**\ud83d\udd34\u5df2\u89e6\u53d1 D \u7c7b\u7194\u65ad\u7ea2\u7ebf\uff01**\n- **\u89e6\u53d1\u56e0\u7531**\uff1a**\u5bb6\u5ead\u51b3\u7b56\u6743\u7ea2\u7ebf**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u53ef\u80fd\u8001\u516c\u4e0d\u652f\u6301\u201d\uff0c\u9500\u552e\u56de\u5e94\u201c\u5bb6\u4eba\u6682\u65f6\u4e0d\u652f\u6301\u4e5f\u6ca1\u5173\u7cfb\uff0c\u5f88\u591a\u5b66\u5458\u90fd\u662f\u5148\u6084\u6084\u5b66\u201d\uff0c\u8fd9\u8bc1\u5b9e\u4e86\u7528\u6237\u62a5\u540d\u884c\u4e3a**\u5bb6\u4eba\u4e0d\u77e5\u60c5/\u4e0d\u652f\u6301**\u3002\u6839\u636e\u5224\u5b9a\u6811\u6b65\u9aa41.5\uff0c\u6b64\u60c5\u51b5\u9700\u89e6\u53d1D\u7c7b\u7194\u65ad\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u6781\u9ad8** | **\u7792\u7740\u8001\u516c\u62a5\u540d\uff0c\u4e00\u65e6\u88ab\u5bb6\u4eba\u53d1\u73b0\uff0c\u6781\u6613\u5f15\u53d1\u6fc0\u70c8\u77db\u76fe\u548c\u7ecf\u6d4e\u8ffd\u7d22\uff0c\u662f\u6700\u9ad8\u5371\u7684\u9000\u8d39\u89e6\u53d1\u70b9\u3002** |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u65f6\u95f4\u6295\u5165\u627f\u8bfa\uff081-2\u5c0f\u65f6\uff09\u4e0e\u5b9e\u9645\u751f\u6d3b\uff08\u672a\u77e5\uff09\u53ef\u80fd\u51b2\u7a81\uff0c\u82e5\u65e0\u6cd5\u8ddf\u4e0a\u5b66\u4e60\u8fdb\u5ea6\uff0c\u4f1a\u4ea7\u751f\u632b\u8d25\u611f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u76ee\u524d\u8868\u73b0\u914d\u5408\uff0c\u4f46\u5bb6\u5ead\u538b\u529b\u662f\u6f5c\u5728\u60c5\u7eea\u5d29\u6e83\u70b9\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u5bf9\u201c\u6162\u6162\u79ef\u5c11\u6210\u591a\u201d\u6709\u8ba4\u77e5\uff0c\u4f46\u82e5\u521d\u671f\u63a5\u5355\u4e0d\u987a\uff0c\u7ed3\u5408\u5bb6\u5ead\u538b\u529b\uff0c\u53ef\u80fd\u52a0\u901f\u9000\u8d39\u51b3\u7b56\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e1-2\u5468\u5185**\u3002\u5f53\u9700\u8981\u6295\u5165\u56fa\u5b9a\u65f6\u95f4\u5b66\u4e60\u3001\u5b8c\u6210\u4f5c\u4e1a\u65f6\uff0c\u4e0e\u5bb6\u5ead\u751f\u6d3b\u7684\u51b2\u7a81\u53ef\u80fd\u66b4\u9732\uff0c\u6216\u5bb6\u4eba\u53d1\u73b0\u652f\u51fa\uff0c\u5bfc\u81f4\u77db\u76fe\u7206\u53d1\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4e5d\u6816\u540c\u5b66\u4f60\u597d\uff01\u770b\u5230\u4f60\u5728\u4f53\u9a8c\u8425\u5bf9\u753b\u672c\u548c\u5ba1\u542c\u7279\u522b\u611f\u5174\u8da3\uff0c\u8fd9\u4efd\u70ed\u60c5\u975e\u5e38\u5b9d\u8d35\u3002\u5b66\u4e60\u662f\u7ed9\u81ea\u5df1\u6295\u8d44\uff0c\u6bcf\u4e00\u6b65\u6210\u957f\u90fd\u503c\u5f97\u9a84\u50b2\u3002\u6211\u4eec\u8bfe\u7a0b\u8bbe\u8ba1\u8003\u8651\u4e86\u5927\u5bb6\u7684\u65f6\u95f4\uff0c\u652f\u6301\u788e\u7247\u5316\u5b66\u4e60\u3002**\u6700\u91cd\u8981\u7684\u662f\uff0c\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u6709\u4efb\u4f55\u9700\u8981\u534f\u8c03\u5bb6\u5ead\u6216\u65f6\u95f4\u7684\u5730\u65b9\uff0c\u968f\u65f6\u53ef\u4ee5\u8ddf\u6211\u6c9f\u901a\uff0c\u6211\u4eec\u4e00\u8d77\u60f3\u529e\u6cd5\u3002** \u5148\u6253\u597d\u57fa\u7840\uff0c\u4eab\u53d7\u58f0\u97f3\u521b\u4f5c\u7684\u4e50\u8da3\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5174\u8da3\u5165\u95e8\u4e0e\u5bb6\u5ead\u548c\u8c10\u7ebf\u3011**\u3002**\u9274\u4e8e\u5176D\u7c7b\u8eab\u4efd\uff0c\u9996\u8981\u5efa\u8bae\u662f\u53cb\u597d\u529d\u9000\u3002** \u82e5\u575a\u6301\u5b66\u4e60\uff0c\u5fc5\u987b\u964d\u7ea7\u4ea7\u54c1\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u8865\u5145 **\u3010\u5bb6\u5ead\u6c9f\u901a\u6307\u5bfc\u5305\u3011**\uff08\u63d0\u4f9b\u5982\u4f55\u4e0e\u5bb6\u4eba\u6c9f\u901a\u5b66\u4e60\u4ef7\u503c\u7684\u8bdd\u672f\u53c2\u8003\uff09\u548c **\u3010\u6781\u8f7b\u91cf\u65f6\u95f4\u7ba1\u7406\u5305\u3011**\uff08\u9488\u5bf9\u5176\u627f\u8bfa\u76841-2\u5c0f\u65f6\uff0c\u63d0\u4f9b\u6700\u788e\u7247\u5316\u7684\u5b66\u4e60\u65b9\u6848\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7edd\u4e0d\u53ef\u9f13\u52b1\u5176\u201c\u6084\u6084\u5b66\u201d\uff0c\u5fc5\u987b\u4e25\u8083\u6c9f\u901a\u5bb6\u5ead\u77e5\u60c5\u6743\u7684\u91cd\u8981\u6027\u3002\u7981\u6b62\u4f7f\u7528\u4efb\u4f55\u201c\u8bc1\u660e\u7ed9\u5bb6\u4eba\u770b\u201d\u201c\u7ecf\u6d4e\u72ec\u7acb\u624d\u80fd\u6709\u5730\u4f4d\u201d\u7b49\u53ef\u80fd\u6fc0\u5316\u5bb6\u5ead\u77db\u76fe\u7684PUA\u8bdd\u672f\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5347\u5355\u884c\u4e3a**\u3002\u5f53\u524d\u8bfe\u7a0b\u5df2\u5c5e\u9ad8\u98ce\u9669\uff0c\u540e\u7eed\u4efb\u4f55\u4ea7\u54c1\u63a8\u8350\u90fd\u9700\u6781\u5ea6\u8c28\u614e\uff0c\u5e76\u4f18\u5148\u5efa\u8bae\u5176\u89e3\u51b3\u5bb6\u5ead\u652f\u6301\u95ee\u9898\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > **\u201cBACB\u201d** (\u7528\u6237\u5bf9\u9500\u552e\u95ee\u5377\u7684\u7b54\u6848\uff0c\u5176\u4e2dB\u9009\u9879\u4e3a\u201c\u53ef\u80fd\u8001\u516c\u4e0d\u652f\u6301\u201d)\n2. > **\u201c\u5bb6\u4eba\u6682\u65f6\u4e0d\u652f\u6301\u4e5f\u6ca1\u5173\u7cfb\uff0c\u5f88\u591a\u5b66\u5458\u90fd\u662f\u5148\u6084\u6084\u5b66\u3001\u518d\u7528\u6536\u5165\u548c\u6210\u679c\u8bf4\u8bdd\u7684\uff5e\u201d** (\u9500\u552e\u56de\u5e94\uff0c\u5750\u5b9e\u4e86\u5bb6\u5ead\u4e0d\u77e5\u60c5/\u4e0d\u652f\u6301\u7684\u72b6\u6001)\n3. > **\u201c\u611f\u89c9\u66f4\u575a\u5b9a\u4e86\u6211\u5165\u884c\u7684\u5fc3\u3002\u6709\u4fe1\u5fc3\uff01\u4e0d\u80fd\u4e00\u53e3\u5403\u6210\u5927\u80d6\u5c0f\u5b50\uff0c\u8981\u6162\u6162\u79ef\u5c11\u6210\u591a\uff0c\u591a\u52b3\u591a\u5f97[\u52a0\u6cb9]\u3002\u201d** (\u7528\u6237\u79ef\u6781\u7684\u5b66\u4e60\u52a8\u673a\uff0c\u4e0e\u9ad8\u5371\u7684\u5bb6\u5ead\u652f\u6301\u5ea6\u5f62\u6210\u5f3a\u70c8\u51b2\u7a81)\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010\u9000\u8d39\u578b\uff08\u5bb6\u5ead\u5e72\u9884\u9ad8\u5371\u578b\uff09\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u5bb6\u5ead\u4e2d\u83b7\u5f97\u7ecf\u6d4e\u72ec\u7acb\u4e0e\u5c0a\u91cd\u8ba4\u53ef\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7acb\u5373\u542f\u52a8\u5bb6\u5ead\u77e5\u60c5\u6743\u590d\u6838\uff0c\u4e25\u8083\u6c9f\u901a\u98ce\u9669\uff0c\u5efa\u8bae\u964d\u7ea7\u4ea7\u54c1\u6216\u53cb\u597d\u529d\u9000\u3011**\u3002\n\n```json\n{\"core_type\": \"\u9000\u8d39\u578b\uff08\u5bb6\u5ead\u5e72\u9884\u9ad8\u5371\u578b\uff09\", \"maslow_need\": \"\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\u4e0e\u7b2c\u56db\u5c42\u5c0a\u91cd\u9700\u6c42\u6df7\u5408\", \"risk_level\": \"\u6781\u9ad8\", \"target_product_line\": \"\u5174\u8da3\u5165\u95e8\u4e0e\u5bb6\u5ead\u548c\u8c10\u7ebf\uff08\u9996\u8981\u5efa\u8bae\u529d\u9000\uff09\"}\n```";
