    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u4e0e\u98ce\u63a7\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u7f3a\u4e4f\u652f\u4ed8\u7ec6\u8282\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u6536\u5165\u6c34\u5e73\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u7b49\u5173\u952e\u4fe1\u606f\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a**\u4e2d\u7b49\u504f\u9ad8**\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5b66\u4e60\u884c\u52a8\u529b\uff08\u4e3b\u52a8\u8be2\u95ee\u8bd5\u97f3\u3001\u8bbe\u5907\u5b89\u88c5\u3001\u4f5c\u4e1a\u63d0\u4ea4\u3001\u5bfb\u6c42\u642d\u6863\uff09\uff0c\u5e76\u4e3b\u52a8\u54a8\u8be2\u9ad8\u7814\u73ed\uff0c\u663e\u793a\u51fa\u5bf9\u6280\u80fd\u63d0\u5347\u548c\u884c\u4e1a\u5165\u5708\u7684\u6e34\u671b\u3002\u4f46\u52a8\u673a\u4e2d\u53ef\u80fd\u5305\u542b\u5bf9\u201c\u5708\u5b50\u201d\u548c\u201c\u673a\u4f1a\u201d\u7684\u5411\u5f80\uff0c\u5b58\u5728\u4e00\u5b9a\u4ece\u4f17\u6216\u793e\u4ea4\u5c5e\u6027\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u80fd\u652f\u4ed819800\u5143\u9ad8\u7814\u73ed\u8d39\u7528\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u7ecf\u6d4e\u57fa\u7840\u3002\u4f46\u5177\u4f53\u804c\u4e1a\u3001\u6536\u5165\u7a33\u5b9a\u6027\u3001\u53ef\u652f\u914d\u5b66\u4e60\u65f6\u95f4\u672a\u77e5\u3002**\u9700\u8b66\u60d5**\u201c\u54ac\u7259\u8dfa\u811a\u201d\u7684\u652f\u4ed8\u884c\u4e3a\u53ef\u80fd\u6697\u793a\u7ecf\u6d4e\u538b\u529b\u6216\u51b2\u52a8\u51b3\u7b56\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a**\u9ad8**\u3002\u7528\u6237\u4e92\u52a8\u79ef\u6781\uff0c\u53cd\u9988\u53ca\u65f6\uff08\u591a\u6b21\u201c\u6536\u5230\u201d\uff09\uff0c\u80fd\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff08\u5b89\u88c5\u8bbe\u5907\u3001\u5bfb\u6c42\u8c03\u8bd5\uff09\uff0c\u5bf9\u73ed\u4e3b\u4efb\u8bc4\u4ef7\u6b63\u9762\u4e14\u5171\u60c5\u3002\u9762\u5bf9\u5b66\u4e60\u4efb\u52a1\uff08\u5982\u8bd5\u97f3\uff09\u6709\u201c\u9f13\u8d77\u52c7\u6c14\u201d\u7684\u8868\u8ff0\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u6311\u6218\u610f\u613f\u548c\u97e7\u6027\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 \u652f\u4ed8\u6838\u67e5**\uff1a\u7528\u6237\u5df2\u652f\u4ed8\u5f53\u524d\u8bfe\u7a0b\uff08\u8fdb\u9636\u8bfe\uff09\uff0c\u5e76\u4e8e4\u67088\u65e5\u51b3\u5b9a\u652f\u4ed819800\u5143\u9ad8\u7814\u73ed\u8d39\u7528\u3002\u652f\u4ed8\u80fd\u529b\u5df2\u9a8c\u8bc1\uff0c\u4f46\u652f\u4ed8\u8fc7\u7a0b\uff08\u662f\u5426\u5206\u671f\u3001\u5bb6\u5ead\u662f\u5426\u77e5\u60c5\uff09\u672a\u77e5\u3002\n*   **\u6b65\u9aa41.5 \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u5173\u952e\u4fe1\u606f\u7f3a\u5931**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u6210\u5458\u6216\u51b3\u7b56\u534f\u5546\u8fc7\u7a0b\u3002\u7528\u6237\u51b3\u7b56\u8868\u73b0\u4e3a\u4e2a\u4eba\u884c\u4e3a\uff08\u201c\u4e00\u54ac\u7259\u4e00\u8dfa\u811a\u201d\uff09\uff0c**\u5b58\u5728\u5bb6\u5ead\u4e0d\u77e5\u60c5\u7684\u91cd\u5927\u98ce\u9669**\u3002\n*   **\u6b65\u9aa42-4 \u7efc\u5408\u5224\u5b9a**\uff1a\n    *   **\u652f\u4ed8\u80fd\u529b (B\u8f74)**\uff1a\u5177\u5907\u652f\u4ed8\u9ad8\u5355\u4ef7\u8bfe\u7a0b\u7684\u80fd\u529b\uff0c\u521d\u6b65\u5224\u65ad\u4e3aB\u7c7b\uff08\u6709\u652f\u4ed8\u80fd\u529b\uff09\u3002\n    *   **\u5b66\u4e60\u52a8\u673a (A\u8f74)**\uff1a\u6709\u660e\u786e\u5b66\u4e60\u884c\u52a8\u548c\u5411\u4e0a\u4ed8\u8d39\u610f\u613f\uff0c\u52a8\u673a\u8f83\u5f3a\uff0c\u521d\u6b65\u5224\u65ad\u4e3aA\u7c7b\uff08\u9ad8\u52a8\u673a\uff09\u3002\n    *   **\u51b3\u7b56\u6a21\u5f0f (C/D\u8f74)**\uff1a\u51b3\u7b56\u901f\u5ea6\u5feb\uff08\u5f53\u5929\u54a8\u8be2\u5f53\u5929\u51b3\u5b9a\uff09\uff0c\u5bf9\u9500\u552e\u63a8\u8350\u63a5\u53d7\u5ea6\u9ad8\uff0c\u7f3a\u4e4f\u6bd4\u4ef7\u548c\u6df1\u5ea6\u8c03\u7814\u8fc7\u7a0b\uff0c\u8868\u73b0\u51fa**\u660e\u663e\u7684C\u7c7b\uff08\u6613\u5f15\u5bfc\u578b\uff09\u7279\u5f81**\u3002\n    *   **\u521d\u6b65\u5224\u5b9a**\uff1a**A-B-C\u578b\u7528\u6237**\uff08\u9ad8\u52a8\u673a\u3001\u6709\u8d44\u6e90\u3001\u6613\u5f15\u5bfc\uff09\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b\uff1aT3 \u63a2\u7d22\u5c1d\u9c9c\u8005**\u3002\n    *   **\u4f9d\u636e**\uff1a\u5bf9\u65b0\u9c9c\u4e8b\u7269\uff08\u9ad8\u7814\u73ed\u3001\u7ebf\u4e0b\u5708\u5b50\uff09\u597d\u5947\u5e76\u613f\u610f\u6295\u5165\uff1b\u5b66\u4e60\u884c\u4e3a\u4e3b\u52a8\uff0c\u4e50\u4e8e\u4e92\u52a8\uff1b\u51b3\u7b56\u53d7\u6743\u5a01\uff08\u73ed\u4e3b\u4efb\u63a8\u8350\uff09\u548c\u201c\u7a00\u7f3a\u6027\u201d\uff08\u540d\u989d\u6709\u9650\uff09\u5f71\u54cd\u8f83\u5927\u3002\n    *   **\u504f\u79bb\u70b9**\uff1a\u539f\u578bT3\u901a\u5e38\u51b3\u7b56\u66f4\u8f7b\u3001\u8bd5\u9519\u6210\u672c\u4f4e\uff0c\u800c\u7528\u6237\u6b64\u6b21\u51b3\u7b56\u6d89\u53ca\u9ad8\u989d\u8d39\u7528\u548c\u7ebf\u4e0b\u65f6\u95f4\uff0c\u6295\u5165\u66f4\u91cd\uff0c\u66f4\u63a5\u8fd1 **T5 \u673a\u4f1a\u5bfb\u89c5\u8005** \u7684\u201c\u6295\u8d44\u201d\u5fc3\u6001\uff0c\u4f46\u7f3a\u4e4fT5\u7684\u529f\u5229\u6027\u7ed3\u679c\u8bc9\u6c42\u8bc1\u636e\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669\u7b49\u7ea7\uff1a\u4e2d**\u3002\n*   **\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a\u4e2d\u98ce\u9669\u3002\u7528\u6237\u5bf9\u9ad8\u7814\u73ed\u62b1\u6709\u201c\u62d3\u5708\u5b50\u201d\u3001\u201c\u89c1\u4e16\u9762\u201d\u3001\u201c\u7ebf\u4e0b\u6307\u5bfc\u201d\u7684\u6df7\u5408\u671f\u671b\uff0c\u82e5\u5b9e\u9645\u4ea4\u4ed8\u611f\u77e5\u4ef7\u503c\u4e0d\u8db3\u6613\u5f15\u53d1\u5931\u671b\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u9ad8\u98ce\u9669**\u3002\u201c\u4e00\u54ac\u7259\u4e00\u8dfa\u811a\u201d\u662f\u660e\u786e\u7684\u7ecf\u6d4e\u538b\u529b\u4fe1\u53f7\uff0c\u9700\u9ad8\u5ea6\u8b66\u60d5\u3002\n    3.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u9ad8\u98ce\u9669**\u3002**\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u5b8c\u5168\u7f3a\u5931\uff0c\u662f\u6700\u5927\u98ce\u9669\u70b9**\u3002\n    4.  **\u65f6\u95f4\u51b2\u7a81**\uff1a\u4e2d\u98ce\u9669\u3002\u7528\u6237\u8be2\u95ee\u4e86\u6bcf\u65e5\u5b66\u4e60\u65f6\u957f\uff0c\u663e\u793a\u5bf9\u65f6\u95f4\u6295\u5165\u6709\u8003\u91cf\uff0c\u4f46\u672a\u6765\u7a81\u53d1\u65f6\u95f4\u51b2\u7a81\u53ef\u80fd\u6027\u5b58\u5728\u3002\n    5.  **\u9500\u552e\u8bef\u5bfc**\uff1a\u4f4e\u98ce\u9669\u3002\u9500\u552e\u6c9f\u901a\u8bb0\u5f55\u672a\u53d1\u73b0\u5938\u5927\u627f\u8bfa\uff0c\u4f46\u5f3a\u8c03\u4e86\u201c\u540d\u989d\u7a00\u7f3a\u201d\u3001\u201c\u6210\u529f\u7387\u201d\uff0c\u5b58\u5728\u4e00\u5b9a\u538b\u529b\u8425\u9500\u3002\n    6.  **\u4ea7\u54c1\u4e0d\u7b26**\uff1a\u4f4e\u98ce\u9669\u3002\u7528\u6237\u4e3b\u52a8\u54a8\u8be2\uff0c\u9500\u552e\u8fdb\u884c\u4e86\u4ea7\u54c1\u4ecb\u7ecd\uff0c\u4fe1\u606f\u57fa\u672c\u5bf9\u79f0\u3002\n    7.  **\u670d\u52a1\u4f53\u9a8c**\uff1a\u4f4e\u98ce\u9669\u3002\u7528\u6237\u5bf9\u5f53\u524d\u73ed\u4e3b\u4efb\u670d\u52a1\u8bc4\u4ef7\u6781\u9ad8\uff0c\u5173\u7cfb\u826f\u597d\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u9500\u552e\u884c\u4e3a**\uff1a\u57fa\u672c\u5408\u89c4\u3002\u672a\u53d1\u73b0\u865a\u5047\u627f\u8bfa\u3002\u4f46\u5b58\u5728\u5229\u7528\u201c\u540d\u989d\u7a00\u7f3a\u201d\uff08\u201c\u4eca\u5929\u8fd8\u80fd\u63d2\u4eba\uff0c\u4f30\u8ba1\u660e\u5929\u5c31\u5c01\u73ed\u201d\uff09\u5236\u9020\u7d27\u8feb\u611f\u7684\u8bdd\u672f\uff0c\u5c5e\u4e8e\u7070\u8272\u5730\u5e26\u3002\n*   **\u4e3b\u8981\u4f26\u7406\u98ce\u9669**\uff1a\n    *   **\u91cd\u5927\u98ce\u9669\uff1a\u672a\u6838\u5b9e\u5bb6\u5ead\u652f\u4ed8\u77e5\u60c5\u6743**\u3002\u9500\u552e\u5728\u63a8\u52a8\u9ad8\u5ba2\u5355\u4ef7\u4ea7\u54c1\u65f6\uff0c**\u672a\u4e3b\u52a8\u8be2\u95ee\u6216\u5efa\u8bae\u7528\u6237\u4e0e\u5bb6\u4eba\u5546\u91cf**\uff0c\u4e25\u91cd\u8fdd\u53cd\u98ce\u63a7\u4f26\u7406\u3002\n    *   \u5bf9\u7528\u6237\u201c\u54ac\u7259\u8dfa\u811a\u201d\u7684\u652f\u4ed8\u538b\u529b\u4fe1\u53f7\u672a\u7ed9\u4e88\u5173\u5207\u6216\u98ce\u9669\u63d0\u793a\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**\uff1a**\u5339\u914d**\u3002\u7528\u6237\u5b66\u4e60\u884c\u4e3a\u79ef\u6781\uff0c\u6709\u5411\u4e0a\u5b66\u4e60\u610f\u613f\uff0c\u9ad8\u7814\u73ed\u4e0e\u5176\u63a2\u7d22\u548c\u63d0\u5347\u7684\u52a8\u673a\u5339\u914d\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**24\u5c0f\u65f6\u5185\u7d27\u6025\u6838\u67e5\u5bb6\u5ead\u652f\u4ed8\u77e5\u60c5\u60c5\u51b5**\u3002\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u7acb\u5373\u5e72\u9884\uff0824\u5c0f\u65f6\u5185\uff09**\uff1a\u73ed\u4e3b\u4efb\u9700\u4ee5\u5173\u6000\u4e3a\u7531\uff0c\u79c1\u804a\u7528\u6237\uff0c\u6e29\u548c\u4f46\u660e\u786e\u5730\u8be2\u95ee\uff1a\u201c\u770b\u5230\u60a8\u5bf9\u5b66\u4e60\u5f88\u6709\u70ed\u60c5\uff0c\u4e3a\u60a8\u9ad8\u5174\uff01\u9ad8\u7814\u73ed\u662f\u4e00\u7b14\u4e0d\u5c0f\u7684\u6295\u5165\uff0c\u4e3a\u4e86\u60a8\u540e\u7eed\u5b66\u4e60\u66f4\u5b89\u5fc3\uff0c\u65b9\u4fbf\u95ee\u4e0b\u60a8\u548c\u5bb6\u4eba\u5546\u91cf\u8fc7\u4e86\u5417\uff1f\u6211\u4eec\u9700\u8981\u786e\u4fdd\u4e3b\u8981\u51b3\u7b56\u8005\u90fd\u77e5\u60c5\u5e76\u652f\u6301\u60a8\u7684\u5b66\u4e60\u8ba1\u5212\u3002\u201d **\u5fc5\u987b\u83b7\u5f97\u5bb6\u5ead\u77e5\u60c5\u7684\u786e\u5207\u7b54\u590d**\u3002\n    2.  **\u98ce\u9669\u7f13\u51b2**\uff1a\u82e5\u5bb6\u5ead\u4e0d\u77e5\u60c5\uff0c\u5fc5\u987b\u542f\u52a8\u201c\u51b7\u9759\u671f\u201d\u6d41\u7a0b\uff0c\u5efa\u8bae\u7528\u6237\u4e0e\u5bb6\u4eba\u6c9f\u901a\u540e\u518d\u786e\u8ba4\uff0c\u5e76\u660e\u786e\u544a\u77e5\u9000\u6539\u653f\u7b56\u3002\u5373\u4f7f\u5bb6\u5ead\u77e5\u60c5\uff0c\u4e5f\u9700\u540c\u6b65\u53d1\u9001\u8bfe\u7a0b\u8be6\u7ec6\u65e5\u7a0b\u3001\u8d39\u7528\u660e\u7ec6\u3001\u9000\u8d39\u653f\u7b56\u7b49\u4e66\u9762\u786e\u8ba4\u3002\n    3.  **\u9884\u671f\u7ba1\u7406**\uff1a\u5728\u7528\u6237\u53c2\u8bfe\u524d\uff0c\u660e\u786e\u6c9f\u901a\u9ad8\u7814\u73ed\u7684\u6838\u5fc3\u4ef7\u503c\uff08\u6280\u80fd\u63d0\u5347\u3001\u884c\u4e1a\u8ba4\u77e5\uff09\u3001\u975e\u4fdd\u5e95\u627f\u8bfa\uff08\u4e0d\u4fdd\u8bc1\u7b7e\u7ea6\uff09\uff0c\u6821\u6b63\u5176\u5bf9\u201c\u5708\u5b50\u201d\u548c\u201c\u673a\u4f1a\u201d\u7684\u8fc7\u9ad8\u9884\u671f\u3002\n    4.  **\u6301\u7eed\u5173\u6ce8**\uff1a\u7559\u610f\u7528\u6237\u5728\u9ad8\u7814\u73ed\u671f\u95f4\u7684\u65f6\u95f4\u6295\u5165\u3001\u7ecf\u6d4e\u72b6\u51b5\u53cd\u9988\uff0c\u4ee5\u53ca\u7ed3\u8bfe\u540e\u5bf9\u201c\u673a\u4f1a\u201d\u7684\u9884\u671f\u843d\u5dee\uff0c\u63d0\u524d\u505a\u597d\u5fc3\u7406\u758f\u5bfc\u548c\u670d\u52a1\u8854\u63a5\u3002\n\n{\"core_type\": \"T3 \u63a2\u7d22\u5c1d\u9c9c\u8005 (\u504fT5\u503e\u5411)\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u5339\u914d\", \"action\": \"24h\u5185\u6838\u67e5\u5bb6\u5ead\u652f\u4ed8\u77e5\u60c5\"}";
