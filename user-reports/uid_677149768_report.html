        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677149768 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-06 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u82b8\u71994/\u6696\u6696\uff08\u5b59\u4f1f\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u7cbe\u82f1\u7248\u8bfe\u7a0b\uff083980\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3**\uff08\u9700\u7b49\u4ed6\u4eba\u8fd8\u6b3e\u6765\u652f\u4ed8\u5168\u6b3e\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u80fd\u53ca\u65f6\u5b8c\u6210\u4f5c\u4e1a\uff0c\u63a8\u6d4b\u6709\u4e00\u5b9a\u788e\u7247\u5316\u65f6\u95f4\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\uff08\u672a\u63d0\u53ca\u5bb6\u5ead\uff0c\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931**\uff08\u5173\u952e\u4fe1\u606f\u5982\u804c\u4e1a\u3001\u5bb6\u5ead\u3001\u8fc7\u5f80\u5b66\u4e60\u7ec6\u8282\u5747\u672a\u77e5\uff0c\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b07\u4f4e\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u7eaf\u4e3a\u51e0\u5929\u5185\u63d0\u73b0\u4fdd\u5e95\u800c\u6765(\u4f4e\u6781\u5371)**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u5df2\u5b66\u5f97\u5dee\u4e0d\u591a\u4e86\u201d\uff0c\u62a5\u540d\u4e3b\u8981\u52a8\u673a\u662f\u201c\u63a5\u5355\u201d\u3001\u201c\u62ff\u7248\u6743\u4e66\u201d\u7b49\u53d8\u73b0\u627f\u8bfa\uff0c\u800c\u975e\u5b66\u4e60\u65b0\u6280\u80fd\u3002\n- **\u804a\u5929\ 1d\uff1b\u201c\u70b9\u4e0d\u52a8\u554a\u201d\uff1b\u201c\u70b9\u4e0d\u5f00\u201d\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u7ecf\u6d4e\u72b6\u51b5\u7684\u6df1\u5ea6\u7126\u8651\u4e0e\u4e0d\u5b89\u5168\u611f**\u3002\u4ed6\u53cd\u590d\u63d0\u53ca\u201c\u94b1\u201d\u3001\u201c\u4ed8\u6b3e\u201d\uff0c\u5e76\u9700\u8981\u7b49\u5f85\u4ed6\u4eba\u8fd8\u6b3e\u6765\u652f\u4ed8\u5b66\u8d39\uff0c\u8868\u660e\u5176\u8d22\u52a1\u72b6\u51b5\u7d27\u5f20\uff0c\u5e0c\u671b\u901a\u8fc7\u201c\u5feb\u901f\u63a5\u5355\u201d\u83b7\u5f97\u5373\u65f6\u7ecf\u6d4e\u56de\u62a5\u6765\u7f13\u89e3\u751f\u5b58\u538b\u529b\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u9632\u62a4\u76fe\u5f0f\u7684\u9000\u8d39\u901a\u9053\u4e0e\u6781\u81f4\u7684\u64cd\u4f5c\u7b80\u5316**\u3002\u4ed6\u9700\u8981\u88ab\u660e\u786e\u544a\u77e5\u201c\u5b66\u4e0d\u4f1a/\u8d5a\u4e0d\u5230\u94b1\u600e\u4e48\u529e\u201d\u7684\u4fdd\u969c\uff0c\u4ee5\u53ca\u6240\u6709\u64cd\u4f5c\u6d41\u7a0b\u5fc5\u987b\u6781\u5176\u7b80\u5355\u3001\u65e0\u9700\u52a8\u8111\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udd34D\u7c7b** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u517c\u5177 **T4 \u641e\u94b1\u7ed3\u679c\u578b** \u7684\u6025\u8feb\u53d8\u73b0\u8bc9\u6c42) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a**\ud83d\udd34\u5df2\u89e6\u53d1 D \u7c7b\u7194\u65ad\u7ea2\u7ebf\uff01**\n- **\u89e6\u53d1\u56e0\u7531**\uff1a**\u652f\u4ed8\u94fe\u5b58\u5728\u501f\u6b3e\u9690\u60a3**\uff08\u9700\u7b49\u4ed6\u4eba\u8fd8\u6b3e\uff09\uff0c\u4e14\u5fc3\u7406\u5f39\u6027\u6781\u4f4e\uff0c\u64cd\u4f5c\u7b80\u5355\u9a8c\u8bc1\u7801\u90fd\u8868\u73b0\u51fa\u5de8\u5927\u632b\u8d25\u611f\u3002**\u5bb6\u5ead\u652f\u6301\u5ea6\u672a\u77e5\uff0c\u4f46\u9ad8\u98ce\u9669**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u9ad8** | \u5b66\u8d39\u6765\u6e90\u4e3a\u201c\u7b49\u522b\u4eba\u8fd8\u6b3e\u201d\uff0c\u6781\u6709\u53ef\u80fd\u662f\u7792\u7740\u5bb6\u4eba\u6216\u501f\u6b3e\u652f\u4ed8\uff0c\u4e00\u65e6\u88ab\u5bb6\u4eba\u53d1\u73b0\u6216\u8fd8\u6b3e\u538b\u529b\u5927\uff0c\u6781\u6613\u7206\u53d1\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u5bf9\u590d\u6742\u64cd\u4f5c\uff08\u5982\u767b\u5f55\u3001\u9a8c\u8bc1\u7801\uff09\u8868\u73b0\u51fa\u660e\u663e\u754f\u96be\u60c5\u7eea\uff0c\u540e\u7eed\u8bfe\u7a0b\u4e2d\u4efb\u4f55\u7a0d\u590d\u6742\u7684\u8f6f\u4ef6\u5b89\u88c5\u3001\u4f5c\u4e1a\u63d0\u4ea4\u90fd\u53ef\u80fd\u6210\u4e3a\u653e\u5f03\u5bfc\u706b\u7d22\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u4efb\u4f55\u6280\u672f\u6027\u632b\u6298\uff08\u5982\u8f6f\u4ef6\u88c5\u4e0d\u4e0a\u3001\u5f55\u97f3\u6548\u679c\u4e0d\u4f73\uff09\u3001\u6216\u7b2c\u4e00\u6b21\u8bd5\u97f3\u5931\u8d25\uff0c\u90fd\u4f1a\u76f4\u63a5\u6467\u6bc1\u5176\u672c\u5c31\u8106\u5f31\u7684\u81ea\u4fe1\uff0c\u5bfc\u81f4\u60c5\u7eea\u5d29\u6e83\u5e76\u5f52\u548e\u4e8e\u8bfe\u7a0b\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u62a5\u540d\u52a8\u673a\u662f\u201c\u5feb\u901f\u63a5\u5355\u201d\uff0c\u4e00\u65e6\u5f00\u8bfe\u540e\u53d1\u73b0\u4e0d\u80fd\u7acb\u523b\u53d8\u73b0\uff08\u5982\u201c\u7b2c8\u5929\u63a5\u5355\u201d\u627f\u8bfa\u672a\u5151\u73b0\uff09\uff0c\u4f1a\u7acb\u523b\u611f\u5230\u88ab\u6b3a\u9a97\uff0c\u5f15\u53d1\u6fc0\u70c8\u6295\u8bc9\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c\u4e00\u5468\u81f3\u7b2c\u4e8c\u5468**\u3002\u6b64\u65f6\u5c06\u9762\u4e34\u7b2c\u4e00\u6b21\u5b9e\u64cd\u4efb\u52a1\u548c\u201c\u63a5\u5355\u201d\u671f\u671b\u7684\u521d\u6b21\u68c0\u9a8c\uff0c\u4efb\u4f55\u632b\u6298\u90fd\u4f1a\u76f4\u63a5\u5f15\u7206\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> **\u201c\u540c\u5b66\u4f60\u597d\uff01\u606d\u559c\u52a0\u5165\uff01\u54b1\u4eec\u8fd9\u91cc\u4e3b\u6253\u4e00\u4e2a\u2018\u7701\u5fc3\u2019\uff0c\u6240\u6709\u64cd\u4f5c\u6211\u90fd\u7ed9\u4f60\u505a\u6210\u2018\u4e00\u952e\u641e\u5b9a\u2019\u7684\u6559\u7a0b\u3002\u4f60\u5565\u90fd\u4e0d\u7528\u6101\uff0c\u8ddf\u7740\u70b9\u70b9\u5c31\u884c\u3002\u4e07\u4e00\u9047\u5230\u4efb\u4f55\u5361\u4f4f\u7684\u5730\u65b9\uff0c\u522b\u81ea\u5df1\u7422\u78e8\uff0c\u7acb\u523b\u6233\u6211\uff0c\u621130\u79d2\u5185\u7ed9\u4f60\u8fdc\u7a0b\u641e\u5b9a\uff01\u54b1\u4eec\u5148\u8f7b\u677e\u4e0a\u624b\uff0c\u8d5a\u5c0f\u94b1\u7684\u4e8b\u6c34\u5230\u6e20\u6210\u3002\u201d**\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\u3011**\u3002\u6838\u5fc3\u76ee\u6807\u662f\u7ef4\u6301\u5176\u60c5\u7eea\u7a33\u5b9a\uff0c\u907f\u514d\u65e9\u671f\u632b\u8d25\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u5f3a\u5236\u6302\u8f7d **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011** \u548c **\u3010\u6781\u81f4\u7b80\u5316\u64cd\u4f5c\u5305\u3011**\u3002\u6240\u6709\u4f5c\u4e1a\u7b80\u5316\u5230\u201c\u4ea4\u4e00\u53e5\u8bdd\u5f55\u97f3\u5373\u53ef\u201d\uff0c\u53cd\u9988\u4ee5\u201c\u65e0\u8111\u5938\u8d5e\u201d\u4e3a\u4e3b\u3002**\u4e25\u7981**\u5728\u521d\u671f\u63a8\u9001\u4efb\u4f55\u771f\u5b9e\u3001\u6709\u96be\u5ea6\u7684\u8bd5\u97f3\u5355\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u4ed6\u4f7f\u7528\u4efb\u4f55\u4e13\u4e1a\u672f\u8bed\u6216\u590d\u6742\u6307\u4ee4**\u3002\n    2. **\u7edd\u4e0d\u5728\u524d\u4e24\u5468\u63d0\u53ca\u201c\u63a5\u5355\u201d\u3001\u201c\u53d8\u73b0\u201d\u7b49\u654f\u611f\u8bcd**\uff0c\u7528\u201c\u7ec3\u4e60\u201d\u3001\u201c\u73a9\u4e00\u4e0b\u201d\u4ee3\u66ff\u3002\n    3. **\u7edd\u4e0d\u5b89\u6392\u4efb\u4f55\u6709\u7ade\u4e89\u6027\u6216\u9700\u8981\u5bf9\u6bd4\u7684\u4f5c\u4e1a**\u3002\n    4. **\u7edd\u4e0d\u5141\u8bb8\u4efb\u4f55\u52a9\u6559\u6216\u8001\u5e08\u7ed9\u4e88\u4e25\u8083\u6216\u6279\u8bc4\u6027\u53cd\u9988**\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5f62\u5f0f\u7684\u5347\u5355**\u3002\u6b64\u7528\u6237\u4e3a\u6781\u9ad8\u98ce\u9669\u5ba2\u7fa4\uff0c\u5f53\u524d\u8bfe\u7a0b\u80fd\u5e73\u7a33\u7ed3\u8bfe\u5373\u4e3a\u80dc\u5229\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u73b0\u5fae\u4fe1\u53ea\u67091000\u5143...\u4ed8\u4e0d\u4e86\uff01\u6211\u53c8\u4e0d\u77e5\u9053\u4eca\u5929\u4e0b\u5348\u8981\u4ed8\u6b3e\u201d\n2. > \u201c\u8bf4\u5b9e\u8bdd\uff0c\u4f60\u4eec\u8fd9\u4e8c\u4e2a\u67083980\u4e0d\u8d35\uff0c\u53ea\u662f\u6211\u4ee5\u524d\u82b1\u58f0\u97f3\u65b9\u9762\u7684\u94b1\u592a\u591a\uff01\u5df2\u597d\u591a\u4e07\u4e86\uff01\u6211\u4e5f\u5b66\u4e86\u5341\u4e2a\u6708\u4e86\uff01\u4e5f\u5b66\u5f97\u5dee\u4e0d\u591a\u4e86\uff01\u201d\n3. > \u201c\u624b\u673a\u53f7\u8f93\u5165\u4f1a\u7684\uff0c\u5c31\u662f\u90a3\u4e2a\u9a8c\u8bc1\u7801\uff0c\u9ebb\u70e6...\u70b9\u4e0d\u52a8\u554a...\u70b9\u4e0d\u5f00\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6\u60c5\u7eea\u5de8\u5a74+T4\u641e\u94b1\u7ed3\u679c\u6df7\u5408\u9ad8\u5371\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7528\u6700\u5feb\u3001\u6700\u4e0d\u8d39\u529b\u7684\u65b9\u5f0f\u8d5a\u5230\u94b1\uff0c\u7f13\u89e3\u7ecf\u6d4e\u7126\u8651\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u6781\u81f4\u7b80\u5316\u6240\u6709\u6d41\u7a0b + \u524d\u4e24\u5468\u5b8c\u5168\u5c4f\u853d\u2018\u53d8\u73b0\u2019\u8bdd\u9898 + \u63d0\u4f9b\u60c5\u7eea\u4ef7\u503c\u8fdc\u5927\u4e8e\u6280\u80fd\u4ef7\u503c\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
