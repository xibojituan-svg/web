    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a676974662\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a676974662 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-05 \u81f3 2026-03-07 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u4e91\u95f4\u6708\uff08\u91d1\u5955\u5f64\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u77ed\u5267\u5199\u4f5c\u8bfe |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e2d\u7b49\uff08\u5b66\u4e60\u884c\u4e3a\u4e0e\u793e\u4ea4\u4e92\u52a8\u4fe1\u606f\u9971\u6ee1\uff0c\u4f46\u5173\u952e\u80cc\u666f\u4fe1\u606f\u7f3a\u5931\uff09 |\n\n> **\u4fe1\u606f\u4e0d\u8db3\u8bf4\u660e**\uff1a\u804a\u5929\u8bb0\u5f55\u4e2d\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u53ef\u7528\u5b66\u4e60\u65f6\u95f4\u3001\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u7b49\u5173\u952e\u80cc\u666f\u4fe1\u606f\uff0c\u8fd9\u4f1a\u5f71\u54cd\u5bf9\u201c\u8d44\u6e90\u5e95\u5ea7\u201d\u548c\u201c\u5bb6\u5ead\u51b3\u7b56\u98ce\u9669\u201d\u7684\u7cbe\u51c6\u8bc4\u4f30\u3002\u5f53\u524d\u5206\u6790\u4e3b\u8981\u57fa\u4e8e\u5176\u5b66\u4e60\u884c\u4e3a\u548c\u793e\u4ea4\u8868\u73b0\u3002\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u7cbe\u8fdb\u800c\u6765\uff0c\u5177\u5907\u5f3a\u70c8\u7684\u81ea\u6211\u9a71\u52a8\u548c\u5b66\u4e60\u94bb\u7814\u7cbe\u795e\uff0c\u4eab\u53d7\u5b66\u4e60\u8fc7\u7a0b\u672c\u8eab\uff0c\u5e76\u5c55\u73b0\u51fa\u9886\u5bfc\u4e0e\u5efa\u8bbe\u6b32\u671b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6709\u7684\u4eba\u6297\u66b4\u51fb\u5c5e\u6027\u7565\u9ad8\uff0c\u6709\u6297\u6027\uff0c\u53ef\u4ee5\u52a0\u5927\u529b\u5ea6\u66b4\u51fb\u4ed6\u201d\n  > \u201c\u63d0\u793a\u8bcd\u4e5f\u662f AI \u7ed9\u7684\uff0c\u6211\u7684\u601d\u8003\u65b9\u5f0f\u662f\u6211\u8981\u4ec0\u4e48\uff0c\u6211\u80fd\u7ed9 AI \u4ec0\u4e48\uff0c\u6211\u9700\u8981 AI \u8f93\u51fa\u4ec0\u4e48\u7ed9\u6211\u201d\n  > \u201c@\u6240\u6709\u4eba \u7b2c\u4e00\u5468\u7684\u4f5c\u4e1a\u6a21\u677f\uff0c\u8bfe\u4ef6PPT\u8fd8\u6709\u76f8\u5173\u5c0f\u8bf4\u7d20\u6750\u5df2\u7ecf\u4e0a\u4f20\u5230\u7981\u8a00\u7fa4\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u672a\u77e5] \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u4f53\u73b0\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 \u80fd\u5728\u5de5\u4f5c\u65e5\u7684\u767d\u5929\u548c\u665a\u4e0a\u9891\u7e41\u4e92\u52a8\u3001\u62c6\u6587\u3001\u505a\u56fe\uff0c\u8868\u660e\u6709\u8f83\u4e3a\u5145\u88d5\u7684\u788e\u7247\u5316\u6216\u6574\u5757\u65f6\u95f4\u6295\u5165\u5b66\u4e60\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u672a\u77e5] \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u4f53\u73b0\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\uff0c\u5177\u5907\u6781\u5f3a\u7684\u6297\u538b\u548c\u81ea\u5632\u80fd\u529b\uff0c\u751a\u81f3\u4e3b\u52a8\u8981\u6c42\u201c\u52a0\u5927\u529b\u5ea6\u66b4\u51fb\u201d\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6709\u7684\u4eba\u6297\u66b4\u51fb\u5c5e\u6027\u7565\u9ad8\uff0c\u6709\u6297\u6027\uff0c\u53ef\u4ee5\u52a0\u5927\u529b\u5ea6\u66b4\u51fb\u4ed6\u201d\n  > \u201c\u5c34\u5c2c\u7684\u62a0\u811a\u201d\uff08\u88ab\u73ed\u73ed\u8c03\u4f83\u540e\u8f7b\u677e\u56de\u5e94\uff09\n  > \u201c\u6211\u5403\u4e86\u7535\u706f\u6ce1\u201d\uff08\u7528\u5e7d\u9ed8\u5316\u89e3\u6280\u672f\u96be\u9898\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u201c\u88ab\u8ba4\u53ef\u201d\u548c\u201c\u638c\u63a7\u611f\u201d\u7684\u5f3a\u70c8\u9700\u6c42\u3002\u4ed6\u6e34\u671b\u5728\u7fa4\u4f53\u4e2d\u5efa\u7acb\u6743\u5a01\uff08\u5982\u88ab\u73ed\u73ed\u620f\u79f0\u4e3a\u201c\u4e2d\u4e66\u4ee4\u201d\u540e\u6b23\u7136\u63a5\u53d7\u5e76\u5c65\u884c\u804c\u8d23\uff09\uff0c\u5e76\u901a\u8fc7\u6280\u672f\u94bb\u7814\u548c\u5e2e\u52a9\u4ed6\u4eba\u6765\u83b7\u5f97\u5c0a\u91cd\u4e0e\u81ea\u6211\u4ef7\u503c\u5b9e\u73b0\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u8d4b\u4e88\u6743\u529b\u4e0e\u821e\u53f0**\u3002\u63d0\u4f9b\u5b98\u65b9\u8ba4\u8bc1\u7684\u8eab\u4efd\uff08\u5982\u7ec4\u957f\u3001\u52a9\u6559\uff09\uff0c\u7ed9\u4e88\u5176\u7edf\u7b79\u3001\u6307\u5bfc\u3001\u70b9\u8bc4\u4ed6\u4eba\u7684\u6743\u9650\uff0c\u8ba9\u4ed6\u4ece\u201c\u4f18\u79c0\u5b66\u5458\u201d\u5347\u7ea7\u4e3a\u201c\u73ed\u7ea7\u751f\u6001\u7684\u5efa\u8bbe\u8005\u4e0e\u7ef4\u62a4\u8005\u201d\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \u2b50A \u7c7b |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T1-A \u5bfc\u6f14\u578b\u9886\u8896**\uff08\u6df7\u5408\u4f533\u53f7\uff1a\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b\u8fdb\u5316\u524d\u4f53\uff09 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u57fa\u4e8e\u5176\u9ad8\u81ea\u4e3b\u6027\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u6781\u4f4e | \u5b66\u4e60\u70ed\u60c5\u9ad8\u6da8\uff0c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5f3a\uff0c\u4e3b\u52a8\u6027\u5f3a\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u6781\u9ad8\uff0c\u4e3b\u52a8\u8981\u6c42\u201c\u66b4\u51fb\u201d\uff0c\u6297\u538b\u80fd\u529b\u5f3a\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u5176\u6838\u5fc3\u9a71\u52a8\u662f\u80fd\u529b\u6210\u957f\u548c\u5c0a\u91cd\u9700\u6c42\uff0c\u800c\u975e\u77ed\u671f\u53d8\u73b0\uff0c\u5bf9\u6536\u76ca\u843d\u5dee\u5bb9\u5fcd\u5ea6\u8f83\u9ad8\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f53\u4ed6\u7684\u201c\u5bfc\u6f14\u201d\u6743\u529b\u88ab\u5265\u593a\u6216\u5ffd\u89c6\u65f6**\u3002\u4f8b\u5982\uff0c\u73ed\u4e3b\u4efb\u6536\u56de\u5176\u7fa4\u7ba1\u7406\u6743\u9650\u3001\u5426\u5b9a\u5176\u7edf\u7b79\u5efa\u8bae\u3001\u6216\u5c06\u5176\u89c6\u4e3a\u666e\u901a\u5b66\u5458\u5bf9\u5f85\uff0c\u53ef\u80fd\u89e6\u53d1\u5176\u201c\u88ab\u77ee\u5316\u201d\u7684\u53cd\u5f39\u60c5\u7eea\uff0c\u5bfc\u81f4\u70ed\u60c5\u6d88\u9000\u751a\u81f3\u6d41\u5931\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4e2d\u4e66\u4ee4\u540c\u5fd7\uff0c\u6211\u770b\u4f60\u7ec4\u7ec7\u80fd\u529b\u548c\u94bb\u7814\u7cbe\u795e\u90fd\u662f\u4e00\u6d41\u7684\uff0c\u8fd9\u4e2a\u73ed\u4ee5\u540e\u5c31\u4ea4\u7ed9\u4f60\u5e2e\u6211\u7ba1\u4e86\u3002\u9047\u5230\u6280\u672f\u96be\u9898\u4f60\u5e26\u5934\u653b\u575a\uff0c\u7fa4\u91cc\u6709\u6389\u961f\u7684\u4f60\u5e2e\u5fd9\u62c9\u4e00\u628a\uff0c\u54b1\u4eec\u4e00\u8d77\u628a14\u73ed\u6253\u9020\u6210\u6807\u6746\u73ed\uff0c\u600e\u4e48\u6837\uff1f\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf**\u3011\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u7edf\u7b79\u6307\u6325\u6743\u5305**\u3011+\u3010**\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743**\u3011\u3002\u5fc5\u987b\u7acb\u5373\u8d4b\u4e88\u5176\u5b98\u65b9\u8eab\u4efd\uff08\u5982\u201c\u5b66\u4e60\u59d4\u5458\u201d\u3001\u201c\u52a9\u6559\u201d\uff09\uff0c\u5f00\u653e\u817e\u8baf\u6587\u6863\u7f16\u8f91\u6743\uff0c\u5141\u8bb8\u5176\u7ec4\u7ec7\u5c0f\u7ec4\u8ba8\u8bba\u3001\u6c47\u603b\u4f5c\u4e1a\u3001\u5206\u4eab\u6280\u672f\u5fc3\u5f97\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u547d\u4ee4\u6216\u6307\u5bfc\u7684\u53e3\u543b\u5bf9\u4ed6\u8bf4\u8bdd\uff1b\u5ffd\u89c6\u6216\u9a73\u56de\u4ed6\u63d0\u51fa\u7684\u73ed\u7ea7\u7ba1\u7406\u5efa\u8bae\uff1b\u5c06\u4ed6\u4e0e\u666e\u901a\u5b66\u5458\u4e00\u89c6\u540c\u4ec1\uff0c\u4e0d\u7ed9\u7279\u6b8a\u6743\u9650\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5f53\u4ed6\u6280\u672f\u9047\u5230\u74f6\u9888\u6216\u6e34\u671b\u66f4\u9ad8\u7ea7\u522b\u8ba4\u540c\u65f6\uff0c\u987a\u52bf\u63a8\u8350\u9ad8\u9636\u79c1\u6559\u8bfe\u3001\u9879\u76ee\u5b9e\u6218\u8425\u7b49\uff0c\u6ee1\u8db3\u5176\u201c\u6210\u4e3a\u4e13\u5bb6\u201d\u7684\u81ea\u6211\u5b9e\u73b0\u9700\u6c42\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u6709\u7684\u4eba\u6297\u66b4\u51fb\u5c5e\u6027\u7565\u9ad8\uff0c\u6709\u6297\u6027\uff0c\u53ef\u4ee5\u52a0\u5927\u529b\u5ea6\u66b4\u51fb\u4ed6**\u201d \u2014\u2014 \u9ad8\u5fc3\u7406\u5f39\u6027\u4e0e\u9886\u5bfc\u6f5c\u8d28\u7684\u76f4\u63a5\u5ba3\u8a00\u3002\n2. > \u201c**@\u6240\u6709\u4eba \u7b2c\u4e00\u5468\u7684\u4f5c\u4e1a\u6a21\u677f\uff0c\u8bfe\u4ef6PPT\u8fd8\u6709\u76f8\u5173\u5c0f\u8bf4\u7d20\u6750\u5df2\u7ecf\u4e0a\u4f20\u5230\u7981\u8a00\u7fa4**\u201d \u2014\u2014 \u4e3b\u52a8\u627f\u62c5\u73ed\u7ea7\u7ba1\u7406\u804c\u8d23\uff0c\u81ea\u53d1\u7ec4\u7ec7\u4e0e\u63d0\u9192\u3002\n3. > \u201c**\u73ed\u73ed\uff0c\u6211\u88ab\u8c46\u5305\u73a9\u75af\u4e86...\u4f60\u6709\u7a7a\u5e2e\u6211\u7785\u7785**\u201d \u2014\u2014 \u9047\u5230\u6280\u672f\u96be\u9898\u4e3b\u52a8\u94bb\u7814\u5e76\u5bfb\u6c42\u66f4\u4f18\u89e3\uff0c\u662f\u5178\u578b\u7684\u6781\u5ba2\u94bb\u7814\u7cbe\u795e\uff08T3\u7279\u8d28\uff09\uff0c\u4e0e\u9886\u5bfc\u529b\uff08T1\uff09\u7ed3\u5408\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T1-A \u5bfc\u6f14\u578b\u9886\u8896\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u4e0e\u6743\u529b\uff0c\u5b9e\u73b0\u81ea\u6211\u4ef7\u503c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7acb\u5373\u6388\u4e88\u5b98\u65b9\u8eab\u4efd\u4e0e\u73ed\u7ea7\u7ba1\u7406\u6743\u9650\uff0c\u5c06\u5176\u56fa\u5316\u4e3a\u201c\u7f16\u5916\u73ed\u4e3b\u4efb\u201d\u3011**\u3002\n\n```json\n{\"core_type\": \"T1-A \u5bfc\u6f14\u578b\u9886\u8896 (\u6df7\u5408\u4f533\u53f7\u8fdb\u5316\u524d\u4f53)\", \"risk_level\": \"\u6781\u4f4e\", \"refund_risk\": \"\u6781\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd/\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
