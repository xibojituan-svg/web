    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a676920705\uff08\u6635\u79f0\uff1a\u83b9\u83b9\uff09\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a676920705 (\u83b9\u83b9) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-12 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u4e45\u9605\u7684\u98ce(\u51af\u58eb\u52c7) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u5df2\u8d2d\uff09\u3001\u540e\u671f\u526a\u8f91\u8bfe\u7a0b\uff08\u5df2\u8d2d\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3**\uff08\u660e\u786e\u8868\u793a\u201c\u8d44\u91d1\u6709\u70b9\u56f0\u96be\u201d\u3001\u201c\u9700\u8981\u6512\u94b1\u201d\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u6709\u5b69\u5b50\uff0c\u9700\u5229\u7528\u5468\u672b\u8865\u8bfe\uff0c\u5b66\u4e60\u65f6\u95f4\u4e0d\u56fa\u5b9a\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u672a\u77e5**\uff08\u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u63d0\u53ca\u201c\u8981\u9632\u7740\u5b69\u5b50\u4e0d\u80fd\u62ff\u53bb\u73a9\u4e86\u201d\uff0c\u6697\u793a\u5bb6\u5ead\u73af\u5883\u9700\u517c\u987e\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u5bf9\u8bdd\u5145\u5206\u66b4\u9732\u4e86\u7ecf\u6d4e\u538b\u529b\u3001\u5b66\u4e60\u8fdb\u5ea6\u3001\u8bbe\u5907\u56f0\u6270\u53ca\u5347\u5355\u51b3\u7b56\u8fc7\u7a0b\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e**\uff0c\u5b66\u4e60\u610f\u613f\u5f3a\u4f46\u53d7\u7ecf\u6d4e\u6761\u4ef6\u5236\u7ea6\u3002\u6838\u5fc3\u9a71\u52a8\u662f\u201c\u8865\u8d34\u5bb6\u7528\u201d\u3001\u201c\u8ba9\u7528\u94b1\u8f7b\u677e\u4e00\u4e9b\u201d\uff0c\u5c5e\u4e8e\u5178\u578b\u7684\u52a1\u5b9e\u53d8\u73b0\u8bc9\u6c42\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u201c\u51e0\u5929\u5185\u5fc5\u987b\u8d5a\u94b1\u201d\u7684\u6781\u7aef\u6025\u8feb\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u662f\u6253\u7b97\u517c\u804c\u4e00\u4e0b\uff0c\u8865\u8d34\u4e00\u4e0b\u5bb6\u7528\uff0c\u5c31\u5e73\u65f6\u7528\u94b1\u8f7b\u677e\u4e00\u4e9b\u201d\uff1b > \u201c\u6211\u60f3\u95ee\u4e00\u4e0b\u5c31\u662f\u753b\u672c\u90a3\u4e9b\u5de5\u4f5c\u53ef\u4ee5\u6709\u5f97\u505a\u5417\uff1f\u5c31\u662f\u659c\u6760\u65b9\u9762\u7684\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e (2-3\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 **\u8d44\u91d1\u627f\u8f7d\u529b**\uff1a**\u4f4e** \u2014 \u591a\u6b21\u660e\u786e\u8868\u793a\u201c\u8d44\u91d1\u6709\u70b9\u56f0\u96be\u201d\u3001\u201c\u9700\u8981\u6512\u94b1\u201d\u3001\u201c\u8fd8\u6ca1\u94b1\u4e70\u8bbe\u5907\u201d\uff0c\u8d2d\u4e704000\u5143\u8bbe\u5907\u9700\u6512\u94b1\uff0c\u62a5\u540d\u540e\u671f\u8bfe\u7a0b\u65f6\u611f\u53f9\u201c\u73b0\u5728\u8fd8\u6ca1\u5f00\u59cb\u8d5a\u94b1\u5c31\u4e0d\u65ad\u82b1\u94b1\u4e86\u201d\u3002\n- \u23f1 **\u65f6\u95f4\u4e0e\u7cbe\u529b**\uff1a**\u4e2d\u4f4e** \u2014 \u6709\u5b66\u4e60\u610f\u613f\uff08\u201c\u5468\u672b\u5c3d\u91cf\u4e5f\u8865\u4e00\u4e0b\u201d\uff09\uff0c\u4f46\u8fdb\u5ea6\u843d\u540e\uff08\u201c\u843d\u4e0b\u5f88\u591a\u529f\u8bfe\u8fd8\u6ca1\u5168\u90e8\u8865\u5b8c\u201d\uff09\uff0c\u4e14\u9700\u7167\u987e\u5b69\u5b50\uff0c\u65f6\u95f4\u88ab\u4e25\u91cd\u788e\u7247\u5316\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 **\u5bb6\u5ead\u652f\u6301\u5ea6**\uff1a**\u4e2d** \u2014 \u672a\u63d0\u53ca\u5f3a\u70c8\u53cd\u5bf9\uff0c\u4f46\u9700\u201c\u9632\u7740\u5b69\u5b50\u201d\uff0c\u8bf4\u660e\u5bb6\u5ead\u73af\u5883\u5b58\u5728\u4e00\u5b9a\u5e72\u6270\uff0c\u975e\u7edd\u5bf9\u652f\u6301\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b07\u4f4e\u6781\u5371 (2-3\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56**\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u8bbe\u5907\u56de\u97f3\u3001\u8f6f\u4ef6\u64cd\u4f5c\uff09\u65f6\uff0c\u8868\u73b0\u51fa\u660e\u663e\u7684\u65e0\u52a9\u548c\u4f9d\u8d56\uff08\u201c\u4e0d\u592a\u4f1a\u201d\u3001\u201c\u600e\u4e48\u89e3\u51b3\u5462\u201d\u3001\u201c\u5230\u65f6\u6536\u5230\u8f9b\u82e6\u73ed\u73ed\u6559\u4e00\u4e0b\u201d\uff09\u3002\u867d\u7136\u80fd\u81ea\u884c\u201c\u7422\u78e8\u4e00\u4e0b\u201d\uff0c\u4f46\u6574\u4f53\u5448\u73b0\u51fa\u9700\u8981\u5916\u90e8\u8be6\u7ec6\u6307\u5bfc\u548c\u60c5\u7eea\u6258\u5e95\u7684\u72b6\u6001\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4e0d\u592a\u4f1a\u201d\uff1b > \u201c\u54e6\u54e6\uff0c\u6211\u81ea\u5df1\u7422\u78e8\u4e00\u4e0b\u201d\uff1b > \u201c\u6211\u90a3\u4e2a\u9ea6\u6709\u5f88\u5927\u56de\u97f3\uff0c\u600e\u4e48\u89e3\u51b3\u5462\u201d\uff1b > \u201c\u770b\u5230\u6709\u4e9b\u540c\u5b66\u90fd\u5df2\u7ecf\u8981\u53473\u7ea7\u4e86\u201d\uff08\u8868\u73b0\u51fa\u540c\u4faa\u538b\u529b\u4e0b\u7684\u7126\u8651\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42\uff08\u7126\u8651\u4fdd\u969c\uff09**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u7ecf\u6d4e\u538b\u529b\u4e0b\u7684\u4e0d\u5b89\u5168\u611f\u4e0e\u6280\u80fd\u7126\u8651**\u3002\u5979\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u914d\u97f3\u83b7\u5f97\u4e00\u4efd\u7a33\u5b9a\u7684\u517c\u804c\u6536\u5165\u6765\u7f13\u89e3\u5bb6\u5ead\u7ecf\u6d4e\u538b\u529b\uff08\u5b89\u5168\u9700\u6c42\uff09\uff0c\u4f46\u540c\u65f6\u56e0\u8d44\u91d1\u77ed\u7f3a\u3001\u5b66\u4e60\u8fdb\u5ea6\u843d\u540e\u3001\u6280\u672f\u64cd\u4f5c\u4e0d\u719f\u7ec3\u800c\u611f\u5230\u53cc\u91cd\u7126\u8651\uff0c\u5bb3\u6015\u201c\u6389\u961f\u201d\uff0c\u5bb3\u6015\u6295\u5165\u6ca1\u6709\u56de\u62a5\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u201d\u7684\u80af\u5b9a\u4e0e\u201c\u53ef\u8fbe\u6210\u201d\u7684\u8def\u5f84\u5b89\u5168\u611f**\u3002\u5979\u4e0d\u9700\u8981\u7a7a\u6d1e\u7684\u9e21\u6c64\uff0c\u9700\u8981\u7684\u662f\u5bf9\u5979\u201c\u8d44\u91d1\u56f0\u96be\u4ecd\u575a\u6301\u5b66\u4e60\u201d\u7684\u7406\u89e3\u3001\u5bf9\u5979\u5fae\u5c0f\u8fdb\u6b65\u7684\u660e\u786e\u5938\u5956\uff08\u5982\u73ed\u73ed\u5bf9\u5176\u5f55\u97f3\u7684\u8868\u626c\uff09\uff0c\u4ee5\u53ca\u4e00\u6761\u6e05\u6670\u3001\u53ef\u6267\u884c\u3001\u4e0d\u589e\u52a0\u5176\u7ecf\u6d4e\u4e0e\u5fc3\u7406\u8d1f\u62c5\u7684\u6210\u957f\u8def\u5f84\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b (\u98ce\u9669\u7ba1\u63a7\u578b)** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u5411T4\u641e\u94b1\u7ed3\u679c\u8bba\u8f7b\u5ea6\u504f\u79fb\u7684\u590d\u5408\u4f53) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 **\u5b89\u5168\u672a\u89e6\u53d1**\uff0c\u4f46\u5df2\u63a5\u8fd1\u7ea2\u7ebf\u3002\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u7528\u6237\u867d\u672a\u63d0\u53ca\u501f\u8d37\uff0c\u4f46\u53cd\u590d\u5f3a\u8c03\u8d44\u91d1\u56f0\u96be\uff0c\u5c5e\u4e8e**\u9ad8\u8d1f\u503a\u98ce\u9669\u4eba\u7fa4**\u3002\u82e5\u9500\u552e\u6301\u7eed\u65bd\u538b\u6216\u53d8\u73b0\u627f\u8bfa\u65e0\u6cd5\u5feb\u901f\u5151\u73b0\uff0c\u6781\u6613\u56e0\u7ecf\u6d4e\u538b\u529b\u4e0e\u5b66\u4e60\u632b\u8d25\u611f\u53e0\u52a0\uff0c\u9000\u5316\u4e3aT8-D\uff08\u7edd\u8def\u8d4c\u5f92\uff09\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| **\u5bb6\u5ead\u5e72\u9884\u578b** | **\u4e2d** | \u82e5\u56e0\u5b66\u4e60/\u8d2d\u4e70\u8bbe\u5907\u8fdb\u4e00\u6b65\u52a0\u5267\u5bb6\u5ead\u7ecf\u6d4e\u7d27\u5f20\uff0c\u53ef\u80fd\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | **\u6700\u5371\u9669**\u3002\u65f6\u95f4\u788e\u7247\u5316\u3001\u8bfe\u7a0b\u843d\u4e0b\u591a\u3001\u6280\u672f\u64cd\u4f5c\u6709\u969c\u788d\uff08\u8bbe\u5907\u56de\u97f3\u3001\u8f6f\u4ef6\u4f7f\u7528\uff09\uff0c\u591a\u91cd\u538b\u529b\u4e0b\u6781\u6613\u4ea7\u751f\u201c\u5b66\u4e0d\u4f1a\u3001\u8ddf\u4e0d\u4e0a\u201d\u7684\u5d29\u6e83\u611f\uff0c\u4ece\u800c\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u9ad8** | \u5fc3\u7406\u5f39\u6027\u4f4e\uff0c\u4e00\u65e6\u4f5c\u4e1a\u88ab\u4e25\u5389\u6279\u8bc4\u3001\u6216\u63a5\u5355\u5c1d\u8bd5\u591a\u6b21\u5931\u8d25\uff0c\u6781\u6613\u4ea7\u751f\u201c\u6211\u592a\u7b28\u4e86\u201d\u3001\u201c\u767d\u82b1\u94b1\u4e86\u201d\u7684\u81ea\u6211\u5426\u5b9a\uff0c\u89e6\u53d1\u9000\u8d39\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u4e2d** | \u5bf9\u201c\u753b\u672c\u201d\u7b49\u659c\u6760\u517c\u804c\u6709\u671f\u5f85\uff0c\u82e5\u5728\u6295\u5165\u8bbe\u5907\u53ca\u540e\u671f\u8bfe\u7a0b\u8d39\u7528\u540e\uff0c\u77ed\u671f\u5185\u4ecd\u65e0\u4efb\u4f55\u6536\u5165\uff0c\u4f1a\u4ea7\u751f\u5f3a\u70c8\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\u3002\u6b64\u65f6\u5b66\u4e60\u96be\u5ea6\u589e\u52a0\uff08\u5982\u540e\u671f\u8f6f\u4ef6\u64cd\u4f5c\uff09\uff0c\u82e5\u8bbe\u5907\u95ee\u9898\uff08\u56de\u97f3\uff09\u672a\u89e3\u51b3\uff0c\u4f5c\u4e1a\u538b\u529b\u589e\u5927\uff0c\u540c\u65f6\u201c\u753b\u672c\u201d\u7b49\u53d8\u73b0\u6e20\u9053\u672a\u5f00\u901a\uff0c\u4e09\u91cd\u7126\u8651\u53e0\u52a0\uff0c\u9000\u8d39\u98ce\u9669\u6781\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u83b9\u83b9\uff0c\u770b\u5230\u4f60\u8bf4\u2018\u843d\u4e0b\u5f88\u591a\u529f\u8bfe\u2019\u8fd8\u60e6\u8bb0\u7740\u8865\uff0c\u7279\u522b\u7406\u89e3\u4f60\u4e00\u8fb9\u987e\u5bb6\u4e00\u8fb9\u60f3\u63d0\u5347\u81ea\u5df1\u7684\u4e0d\u5bb9\u6613\u3002\u54b1\u4eec\u4e0d\u6025\uff0c\u8bfe\u7a0b\u6c38\u4e45\u56de\u653e\uff0c\u4f60\u7684\u8282\u594f\u6700\u91cd\u8981\u3002\u8bbe\u5907\u56de\u97f3\u7684\u95ee\u9898\u522b\u7126\u8651\uff0c\u54b1\u4eec\u4e00\u8d77\u6162\u6162\u8c03\uff0c\u5f88\u591a\u5988\u5988\u5b66\u5458\u4e00\u5f00\u59cb\u90fd\u8fd9\u6837\uff0c\u540e\u6765\u90fd\u89e3\u51b3\u4e86\u3002\u4f60\u5148\u4fdd\u8bc1\u4f11\u606f\uff0c\u5b66\u4e60\u662f\u4e3a\u4e86\u8ba9\u751f\u6d3b\u66f4\u597d\uff0c\u522b\u8ba9\u5b83\u6210\u4e86\u8d1f\u62c5\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\uff0c\u4f46\u5fc5\u987b\u642d\u914d\u6781\u81f4\u7684\u60c5\u7eea\u6258\u5e95\u4e0e\u8def\u5f84\u7b80\u5316\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\uff08\u6ee1\u914dC\u6a21\u5757\uff09\u3011** + **\u3010\u964d\u7ef4\u7269\u7406\u4ee3\u529e\u5305\uff08\u7279\u79cdA\u6a21\u5757\uff09\u3011**\u3002\u5fc5\u987b\u63d0\u4f9b\u201c\u8f6e\u6905\u7ea7\u201d\u966a\u4f34\uff0c\u624b\u628a\u624b\u89e3\u51b3\u64cd\u4f5c\u95ee\u9898\uff0c\u5e76\u5bf9\u5176\u6bcf\u4e00\u4e2a\u5fae\u5c0f\u8fdb\u6b65\u7ed9\u4e88\u5938\u5f20\u8d5e\u7f8e\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u5979\u4f7f\u7528\u4efb\u4f55\u201c\u5012\u8ba1\u65f6\u201d\u3001\u201c\u540d\u989d\u6709\u9650\u201d\u7b49\u903c\u5355\u8bdd\u672f**\uff0c\u8fd9\u4f1a\u52a0\u5267\u5176\u7ecf\u6d4e\u7126\u8651\u3002\n    2. **\u7edd\u4e0d\u5728\u5176\u57fa\u7840\u8bfe\u7a0b\u672a\u6d88\u5316\u3001\u8bbe\u5907\u64cd\u4f5c\u672a\u719f\u7ec3\u65f6\uff0c\u5f3a\u63a8\u66f4\u9ad8\u9636\u3001\u66f4\u6602\u8d35\u7684\u8bfe\u7a0b**\uff08\u672c\u6b21\u540e\u671f\u73ed\u5347\u5355\u5df2\u57cb\u96f7\uff09\u3002\n    3. **\u7edd\u4e0d\u7528\u201c\u522b\u4eba\u90fd\u884c\u4f60\u600e\u4e48\u4e0d\u884c\u201d\u7684\u5bf9\u6bd4\u5f0f\u6fc0\u52b1**\uff0c\u5979\u5df2\u8868\u73b0\u51fa\u201c\u6389\u961f\u6050\u614c\u201d\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5927\u989d\u5347\u5355**\u3002\u5728\u73b0\u6709\u8bfe\u7a0b\u672a\u4ea7\u751f\u6b63\u5411\u6536\u76ca\uff08\u54ea\u6015\u662f\u5c0f\u989d\u201c\u753b\u672c\u201d\u6536\u5165\uff09\u4e14\u5b66\u4e60\u4fe1\u5fc3\u672a\u5efa\u7acb\u524d\uff0c\u7981\u6b62\u63a8\u8350\u4efb\u4f55\u65b0\u8bfe\u7a0b\u3002\u6240\u6709\u670d\u52a1\u91cd\u5fc3\u5e94\u7528\u4e8e **\u201c\u5e2e\u5979\u63a5\u5230\u7b2c\u4e00\u5355\uff0c\u65e0\u8bba\u591a\u5c0f\u201d**\uff0c\u4ee5\u5efa\u7acb\u6b63\u53cd\u9988\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > **\u201c\u73ed\u73ed\uff0c\u6211\u8d44\u91d1\u6709\u70b9\u56f0\u96be\u54e6\uff0c\u53ef\u4ee5\u665a\u70b9\u4e70\u5417\u201d** \u2014\u2014 **\u8d44\u6e90\u5e95\u5ea7\u77ed\u677f\uff08\u8d44\u91d1\uff09\u7684\u76f4\u63a5\u8bc1\u636e**\u3002\n2. > **\u201c\u6211\u6709\u4e9b\u4e5f\u843d\u4e0b\u5f88\u591a\u529f\u8bfe\u8fd8\u6ca1\u5168\u90e8\u8865\u5b8c\u201d** \u2014\u2014 **\u65f6\u95f4\u7cbe\u529b\u788e\u7247\u5316\u4e0e\u5b66\u4e60\u7126\u8651\u7684\u8bc1\u636e**\u3002\n3. > **\u201c\u6211\u90a3\u4e2a\u9ea6\u6709\u5f88\u5927\u56de\u97f3\uff0c\u600e\u4e48\u89e3\u51b3\u5462\u201d**\u3001**\u201c\u4e0d\u592a\u4f1a\u201d** \u2014\u2014 **\u5fc3\u7406\u5f39\u6027\u4f4e\u3001\u6280\u672f\u4f9d\u8d56\u5f3a\u7684\u76f4\u63a5\u8bc1\u636e**\u3002\n4. > **\u201c\u73b0\u5728\u8fd8\u6ca1\u5f00\u59cb\u8d5a\u94b1\u5c31\u4e0d\u65ad\u82b1\u94b1\u4e86[\u6342\u8138][\u6342\u8138]\u201d** \u2014\u2014 **\u7ecf\u6d4e\u538b\u529b\u4e0e\u6295\u5165\u4ea7\u51fa\u7126\u8651\u7684\u96c6\u4e2d\u7206\u53d1**\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6\u60c5\u7eea\u5de8\u5a74\u578b + T4\u641e\u94b1\u7ed3\u679c\u8bba\u8f7b\u5ea6\u590d\u5408\u4f53\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7ecf\u6d4e\u4e0e\u6280\u80fd\u7684\u53cc\u91cd\u5b89\u5168\u4fdd\u969c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u81f4\u60c5\u7eea\u6258\u5e95\u4e0e\u4fdd\u59c6\u7ea7\u64cd\u4f5c\u6307\u5bfc\uff0c\u4f18\u5148\u5e2e\u5979\u83b7\u5f97\u54ea\u6015\u5fae\u5c0f\u7684\u6b63\u6536\u76ca\uff08\u5982\u753b\u672c\u517c\u804c\uff09\uff0c\u5efa\u7acb\u4fe1\u5fc3\uff0c\u4e25\u9632\u5728\u57fa\u7840\u4e0d\u7a33\u65f6\u7ee7\u7eed\u5347\u5355\u52a0\u538b\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b (\u504fT4\u590d\u5408)\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\uff08\u9700\u642d\u914d\u6ee1\u914d\u7597\u6108\u966a\u5b66\u5305+\u964d\u7ef4\u4ee3\u529e\u5305\uff09\", \"age\": \"\u672a\u77e5\uff08\u63a8\u6d4b\u4e3a\u6709\u5b69\u6bcd\u4eb2\uff09\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}\n```";
