        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 189545601 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u51ac\u51ac\u8001\u5e08 / \u662d\u5b812 (\u674e\u5fd7\u52c7) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u5f20\u9707\u8001\u5e08\u6709\u58f0\u6f14\u64ad\u8bad\u7ec3\u8425 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3** (\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u4ef7\u683c\u3001\u5206\u671f\u7b49) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u9ad8\u5bbd\u88d5** (\u7528\u6237\u81ea\u8ff0\u201c\u9000\u4f11\u4e86\uff0c\u6709\u65f6\u95f4\u201d) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3** (\u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49** (\u7528\u6237\u4e92\u52a8\u79ef\u6781\uff0c\u4f46\u5173\u952e\u5bb6\u5ead\u3001\u8d22\u52a1\u4fe1\u606f\u7f3a\u5931) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u6781\u7aef\u6025\u8feb\u6027\uff1b\u5bf9\u201c\u753b\u672c\u201d\u7b49\u5177\u4f53\u5de5\u79cd\u611f\u5174\u8da3\uff0c\u6709\u8fb9\u5b66\u8fb9\u505a\u7684\u610f\u613f\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u517c\u804c\u505a\u505a\u753b\u5932\uff0c\u8001\u5e08\u80fd\u4ecb\u7ecd\u5417\uff1f\u6211\u662f\u9000\u4f11\u7684\uff0c\u6709\u65f6\u95f4\u3002\u201d > \u201c\u8fb9\u5e72\u8fb9\u5b66\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b06\u9ad8]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u4fe1\u606f\u4e0d\u8db3]** \u2014 \u672a\u63d0\u53ca\u8d22\u52a1\u72b6\u51b5\uff0c\u4f46\u9000\u4f11\u8eab\u4efd\u901a\u5e38\u610f\u5473\u7740\u6709\u7a33\u5b9a\u9000\u4f11\u91d1\uff0c\u65e0\u91cd\u5927\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**[\u2b06\u9ad8]** \u2014 \u660e\u786e\u8868\u793a\u9000\u4f11\uff0c\u65f6\u95f4\u5145\u88d5\uff0c\u80fd\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\u4e92\u52a8\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u4fe1\u606f\u4e0d\u8db3]** \u2014 \u672a\u63d0\u53ca\uff0c\u662f**\u5173\u952e\u98ce\u9669\u4fe1\u606f\u7f3a\u53e3**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u53e3\u6c34\u591a\uff09\u4e3b\u52a8\u8be2\u95ee\u89e3\u51b3\u65b9\u6848\uff0c\u4e0a\u9ea6\u7d27\u5f20\u4f46\u80fd\u6b63\u5411\u603b\u7ed3\u201c\u611f\u89c9\u633a\u597d\u201d\uff0c\u5b66\u4e60\u6001\u5ea6\u79ef\u6781\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u65f6\u95f4\u592a\u77ed\uff0c\u6709\u70b9\u7d27\u5f20\u3002\u4f46\u611f\u89c9\u633a\u597d\uff01\u201d > \u201c\u8001\u5e08\uff0c\u6211\u5f55\u7684\u65f6\u95f4\u957f\u4e86\uff0c\u5634\u91cc\u53e3\u6c34\u5f88\u591a\uff0c\u8fd9\u600e\u4e48\u89e3\u51b3\uff1f\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42** ] \u4e0e [ **\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u9000\u4f11\u540e\u4e0e\u793e\u4f1a\u8fde\u63a5\u51cf\u5f31\uff0c\u5bfb\u6c42\u65b0\u7684\u793e\u4f1a\u89d2\u8272\u3001\u793e\u7fa4\u5f52\u5c5e\u611f\u548c\u4ef7\u503c\u518d\u786e\u8ba4\u3002\u4ed6\u9700\u8981\u201c\u88ab\u770b\u89c1\u201d\u3001\u201c\u88ab\u9700\u8981\u201d\u7684\u611f\u89c9\uff0c\u800c\u4e0d\u4ec5\u4ec5\u662f\u91d1\u94b1\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u793e\u7fa4\u878d\u5165\u611f\u3001\u5bfc\u5e08\u7684\u8ba4\u53ef\u4e0e\u9f13\u52b1\u3001\u4ee5\u53ca\u4e00\u4e2a\u80fd\u53d1\u6325\u4f59\u70ed\u7684\u201c\u65b0\u8eab\u4efd\u201d**\u3002\u8ba9\u4ed6\u611f\u89c9\u81ea\u5df1\u662f\u201c\u4f18\u79c0\u5b66\u5458\u201d\uff0c\u662f\u201c\u88ab\u9009\u4e2d\u7684\u4eba\u201d\uff0c\u672a\u6765\u80fd\u5728\u5267\u7ec4\u4e2d\u6709\u4e00\u5e2d\u4e4b\u5730\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u52a8\u673a\u4e2d\u7b49\uff0c\u8d44\u6e90\u5e95\u5ea7\u65f6\u95f4\u5145\u88d5\u4f46\u5bb6\u5ead\u4fe1\u606f\u672a\u77e5\uff0c\u5fc3\u7406\u5f39\u6027\u9ad8) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **[T5 \u597d\u73a9\u5c1d\u9c9c\u578b]** (\u9000\u4f11\u5bfb\u6c42\u65b0\u4f53\u9a8c\u4e0e\u793e\u4ea4\uff0c\u5bf9\u201c\u753b\u672c\u201d\u7b49\u5177\u4f53\u3001\u6709\u8da3\u7684\u5f62\u5f0f\u611f\u5174\u8da3\uff0c\u53d8\u73b0\u9700\u6c42\u975e\u6781\u7aef\u8feb\u5207) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u501f\u8d37\u3001\u7edd\u5883\u7b49\u5371\u9669\u4fe1\u53f7\u3002**\u4f46\u5bb6\u5ead\u652f\u6301\u5ea6\u672a\u77e5\u662f\u6f5c\u5728\u98ce\u9669\u70b9**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **[\u4e2d]** | **\u5173\u952e\u4fe1\u606f\u7f3a\u5931**\u3002\u82e5\u5bb6\u4eba\u53cd\u5bf9\u5176\u201c\u778e\u6298\u817e\u201d\u6216\u82b1\u8d39\uff0c\u53ef\u80fd\u5f15\u53d1\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **[\u4f4e]** | \u65f6\u95f4\u5145\u88d5\uff0c\u5b66\u4e60\u6001\u5ea6\u597d\uff0c\u80fd\u8ddf\u4e0a\u8282\u594f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **[\u4f4e]** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u5230\u95ee\u9898\u4e3b\u52a8\u6c42\u89e3\uff0c\u975e\u60c5\u7eea\u5316\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **[\u4e2d]** | \u867d\u672a\u8981\u6c42\u6781\u901f\u53d8\u73b0\uff0c\u4f46\u82e5\u5b66\u4e60\u540e\u671f\u53d1\u73b0\u201c\u753b\u672c\u201d\u7b49\u659c\u6760\u6536\u5165\u8fdc\u4f4e\u4e8e\u9884\u671f\uff0c\u6216\u63a5\u5355\u56f0\u96be\uff0c\u53ef\u80fd\u4ea7\u751f\u5931\u671b\u60c5\u7eea\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c3-4\u5468**\u3002\u65b0\u9c9c\u611f\u8fc7\u540e\uff0c\u82e5\u5b9e\u64cd\uff08\u5982\u8bd5\u97f3\u3001\u753b\u672c\uff09\u8fdb\u5c55\u7f13\u6162\uff0c\u672a\u83b7\u5f97\u5b9e\u8d28\u6027\u201c\u53c2\u4e0e\u611f\u201d\u6216\u5fae\u5c0f\u6210\u5c31\uff0c\u53ef\u80fd\u56e0\u201c\u65e0\u804a\u201d\u6216\u201c\u65e0\u671b\u201d\u800c\u6d41\u5931\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cX\u53d4\u53d4/\u963f\u59e8\uff0c\u770b\u5230\u60a8\u8fd9\u4e48\u79ef\u6781\u5b8c\u6210\u4f5c\u4e1a\u548c\u4e92\u52a8\uff0c\u771f\u7684\u7279\u522b\u68d2\uff01\u54b1\u4eec\u73ed\u597d\u591a\u540c\u5b66\u90fd\u8bf4\u8981\u5411\u60a8\u8fd9\u4f4d\u2018\u6a21\u8303\u5b66\u957f\u2019\u5b66\u4e60\u5462\u3002\u60a8\u65f6\u95f4\u5145\u88d5\uff0c\u7ecf\u9a8c\u4e30\u5bcc\uff0c\u4ee5\u540e\u73ed\u91cc\u7684\u2018\u753b\u672c\u5c0f\u7ec4\u2019\u6216\u8005\u2018\u65b0\u4eba\u7b54\u7591\u89d2\u2019\uff0c\u53ef\u5f97\u591a\u6307\u671b\u60a8\u6765\u5e26\u5e26\u5927\u5bb6\u4e86\uff01\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5174\u8da3\u6e38\u4e50\u7ebf**\u3011\u3002\u91cd\u70b9\u5f15\u5bfc\u81f3\u201c\u753b\u672c\u201d\u3001\u201c\u5bf9\u8f68\u201d\u7b49\u4f4e\u95e8\u69db\u3001\u8da3\u5473\u6027\u5f3a\u3001\u80fd\u5feb\u901f\u83b7\u5f97\u53c2\u4e0e\u611f\u548c\u5fae\u5c0f\u6210\u5c31\u7684\u659c\u6760\u4efb\u52a1\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u793e\u4ea4\u4e0e\u5c0a\u91cd\u9700\u6c42\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\uff08\u8f7b\u91cf\uff09**\u3011\u3002\u5982\u4efb\u547d\u4e3a\u5c0f\u7ec4\u957f\u3001\u9080\u8bf7\u53c2\u4e0e\u201c\u9000\u4f11\u5b66\u5458\u4ff1\u4e50\u90e8\u201d\u5206\u4eab\u3001\u9881\u53d1\u201c\u5b66\u4e60\u6807\u5175\u201d\u865a\u62df\u52cb\u7ae0\u7b49\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u8fc7\u5ea6\u65bd\u538b\u6216\u5e03\u7f6e\u8fc7\u4e8e\u67af\u71e5\u3001\u9ad8\u96be\u5ea6\u7684\u7eaf\u6280\u5de7\u8bad\u7ec3\u30022. \u53ea\u753b\u201c\u6708\u5165\u8fc7\u4e07\u201d\u7684\u5927\u997c\u800c\u5ffd\u89c6\u5176\u201c\u53c2\u4e0e\u611f\u201d\u548c\u201c\u88ab\u8ba4\u53ef\u201d\u7684\u9700\u6c42\u30023. **\u5ffd\u89c6\u5bb6\u5ead\u98ce\u9669\u6392\u67e5**\uff0c\u5fc5\u987b\u901a\u8fc7\u95f2\u804a\u65b9\u5f0f\u4e86\u89e3\u5bb6\u4eba\u6001\u5ea6\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u8c28\u614e\u63a8\u4ecb\u9ad8\u9636\u8bfe\u7a0b**\u3002\u5207\u5165\u70b9\u5e94\u662f\u201c\u89e3\u9501\u66f4\u591a\u6709\u8da3\u89d2\u8272/\u5de5\u79cd\u201d\u3001\u201c\u6210\u4e3a\u5267\u793e\u6838\u5fc3\u6210\u5458\u201d\uff0c\u800c\u975e\u201c\u8d5a\u66f4\u591a\u94b1\u201d\u3002\u91d1\u989d\u4e0d\u5b9c\u8fc7\u5927\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u8001\u5e08\u591a\u63a8\u8350\u753b\u5932\u5417\uff1f\u8fd9\u7528\u4ec0\u4e48\u8f6f\u4ef6\uff1f\u54c8\u54c8\u54c8\uff0c\u5565\u4e5f\u4e0d\u61c2\u3002**\u9000\u4f11\u4e86\u3002**\u201d\n2. > \u201c\u6211\u7684\u58f0\u97f3\u4e5f\u4e0d\u77e5\u5408\u9002\u4e0d\uff1f**\u517c\u804c\u505a\u505a\u753b\u5932**\uff0c\u8001\u5e08\u80fd\u4ecb\u7ecd\u5417\uff1f\u6211\u662f\u9000\u4f11\u7684\uff0c**\u6709\u65f6\u95f4**\u3002\u201d\n3. > \u201c\u8fb9\u5e72\u8fb9\u5b66\u3002\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **[T5 \u597d\u73a9\u5c1d\u9c9c\u578b\u9000\u4f11\u65cf]**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **[\u5bfb\u627e\u9000\u4f11\u540e\u7684\u65b0\u793e\u4ea4\u5708\u5b50\u548c\u4ef7\u503c\u8ba4\u540c\u611f]**\u3002\u9000\u5355\u51e0\u7387\u4e3a **[\u4e2d\u7b49]**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **[\u7528\u201c\u5174\u8da3\u6e38\u4e50\u7ebf\u201d\u548c\u201c\u8f7b\u91cf\u5708\u5c42\u8eab\u4efd\u201d\u6301\u7eed\u63d0\u4f9b\u65b0\u9c9c\u611f\u4e0e\u5f52\u5c5e\u611f\uff0c\u5e76\u79d8\u5bc6\u6392\u67e5\u5bb6\u5ead\u652f\u6301\u5ea6]**\u3002\n\n```json\n{\"core_type\": \"T5 \u597d\u73a9\u5c1d\u9c9c\u578b\", \"maslow_need\": \"\u793e\u4ea4\u4e0e\u5c0a\u91cd\u9700\u6c42\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf + \u5708\u5c42\u5408\u4f19\u4eba\u7ebf(\u8f7b\u91cf)\"}\n```";
