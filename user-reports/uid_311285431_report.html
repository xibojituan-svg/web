    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 311285431 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-02 \u81f3 2026-04-03 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u660e\u7389\u9676\u9676(\u9648\u7490)\u3001\u4ee5\u6cab\u563b\u563b(\u9ad8\u946b)\u3001\u9ed8\u8bed\u99a8\u58f0(\u8d75\u658c) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u5199\u4f5c\u8bfe\uff08\u5df2\u8d2d\uff09\uff0cAIGC\u77ed\u89c6\u9891\u8bfe\uff08\u88ab\u63a8\u8350\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u7591\u4f3c\u5168\u6b3e\u5145\u88d5\uff08\u5df2\u8d2d\u591a\u95e8\u8bfe\u7a0b\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u6781\u4f4e**\u3002\u653f\u5e9c\u5316\u503a\u9879\u76ee\u5de5\u4f5c\uff0c\u957f\u671f\u8d85\u8d1f\u8377\u8fd0\u8f6c\uff0c\u9891\u7e41\u52a0\u73ed\u81f3\u6df1\u591c\uff0c\u5468\u672b\u9700\u4e0b\u4e61\uff0c\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\u4e14\u4e0d\u53ef\u63a7\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u672a\u63d0\u53ca\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u7528\u6237\u4e3b\u52a8\u3001\u8be6\u7ec6\u5730\u5206\u4eab\u4e86\u5de5\u4f5c\u3001\u751f\u6d3b\u3001\u5b66\u4e60\u72b6\u6001\u53ca\u5185\u5fc3\u60f3\u6cd5\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u8ffd\u6c42\u81ea\u6211\u5b9e\u73b0\u4e0e\u6280\u80fd\u7cbe\u8fdb\uff0c\u53d8\u73b0\u9884\u671f\u6a21\u7cca\u4e14\u975e\u77ed\u671f\u5bfc\u5411\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u6211\u4e00\u76f4\u90fd\u5f88\u559c\u6b22\u52a8\u6f2b\uff0c\u5927\u5b66\u6bd5\u4e1a\u540e\uff0c\u5de5\u4f5c\u6027\u8d28\u53d8\u52a8\u540e\uff0c\u53c8\u4e00\u4e2a\u4eba\u629a\u517b\u5b69\u5b50\u3001\u7167\u987e\u8001\u4eba\uff0c\u5c31\u6ca1\u6709\u52c7\u6c14\u53bb\u8ffd\u6c42\u81ea\u5df1\u7684\u68a6\u60f3\u201d\n> \u201c\u4ece\u6211\u672c\u4eba\u6765\u8bf4\uff0c\u662f\u771f\u7684\u60f3\u5b66\uff0c\u4f46\u5e73\u65f6\u5de5\u4f5c\u592a\u5fd9\u4e86\uff0c\u73b0\u5728\u5e74\u9f84\u53c8\u662f50\u5c81\u4e86\uff0c\u516c\u53f8\u7ed9\u4e70\u7740\u793e\u4fdd\uff0c\u6240\u4ee5\u592a\u9e21\u808b\u4e86\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d\u9ad8** \u2014 \u5df2\u8fde\u7eed\u8d2d\u4e70\u201c\u7cbe\u82f1\u3001\u8fdb\u9636\u3001\u540e\u671f\u3001\u8fd0\u8425\u3001\u5199\u4f5c\u201d\u7b49\u591a\u95e8\u8bfe\u7a0b\uff0c\u6709\u7a33\u5b9a\u5de5\u4f5c\u4e0e\u793e\u4fdd\uff0c\u7ecf\u6d4e\u57fa\u7840\u5c1a\u53ef\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u6781\u4f4e** \u2014 **\u6838\u5fc3\u77ed\u677f**\u3002\u7528\u6237\u53cd\u590d\u5f3a\u8c03\u201c\u5de5\u4f5c\u592a\u5fd9\u4e86\uff0c\u4ece\u53bb\u5e748\u6708\u4efd\u653f\u5e9c\u5316\u503a\u5f00\u59cb\uff0c\u5929\u5929\u90fd\u5728\u8d85\u8d1f\u8377\u8fd0\u8f6c\u201d\u3001\u201c\u52a0\u73ed\u52a0\u4e86\u4e2a\u901a\u5bb5\u201d\u3001\u201c\u665a\u4e0a\u90fd\u5728\u52a0\u73ed\u201d\u3001\u201c\u5468\u672b\u4e0b\u4e61\u8dd1\u73b0\u573a\u201d\u3002\u53ef\u7528\u65f6\u95f4\u88ab\u9ad8\u5f3a\u5ea6\u5de5\u4f5c\u4e25\u91cd\u6324\u538b\uff0c\u5b66\u4e60\u4f9d\u8d56\u201c\u6478\u9c7c\u201d\u3001\u201c\u665a\u4e0a\u548c\u5468\u672b\u8865\u8bfe\u201d\u3001\u201c\u542c\u56de\u653e\u201d\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u63d0\u53ca\u201c\u4e00\u4e2a\u4eba\u629a\u517b\u5b69\u5b50\u3001\u7167\u987e\u8001\u4eba\u201d\uff0c\u4f46\u672a\u660e\u786e\u63d0\u53ca\u5bb6\u4eba\u5bf9\u5b66\u4e60\u7684\u6001\u5ea6\u3002\n- **\u5e95\u5ea7\u53d6\u77ed\u677f**\uff1a**\u2b07\u4f4e**\uff08\u65f6\u95f4\u4e0e\u7cbe\u529b\u7ef4\u5ea6\u6781\u4f4e\uff09\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9762\u5bf9\u65f6\u95f4\u51b2\u7a81\u3001\u8eab\u4f53\u4e0d\u9002\uff08\u611f\u5192\u3001\u722c\u5c71\u7d2f\u762b\uff09\u3001\u6280\u672f\u95ee\u9898\uff08\u8fdb\u4e0d\u53bb\u76f4\u64ad\uff09\u65f6\uff0c\u6001\u5ea6\u79ef\u6781\uff0c\u4e3b\u52a8\u6c9f\u901a\u8bf7\u5047\u3001\u5bfb\u6c42\u66ff\u4ee3\u65b9\u6848\uff08\u542c\u56de\u653e\uff09\uff0c\u65e0\u62b1\u6028\u6216\u5f52\u548e\u4ed6\u4eba\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u6628\u665a\u5b9e\u5728\u6ca1\u529e\u6cd5\uff0c\u52a0\u73ed\u52a0\u4e86\u4e2a\u901a\u5bb5\uff0c\u4eca\u5929\u7b49\u5f00\u5b8c\u4f1a\u56de\u5bb6\u7761\u89c9\u53bb\u201d\n> \u201c\u8fd0\u8425\u8bfe\u8fd9\u5468\u5c31\u7ed3\u675f\u4e86\uff0c\u5468\u65e5\u6211\u53ef\u4ee5\u4ece\u5934\u597d\u597d\u542c\u542c\u201d\n> \u201c\u5dee\u70b9\u90fd\u5fd8\u8bb0\u505a\u4f5c\u4e1a\u4e86\uff0c\u4e2d\u5348\u4f11\u606f\u65f6\u8d76\u7d27\u505a\u4e86\u63d0\u4ea4\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u4e2d\u5e74\u804c\u4e1a\u5026\u6020\u4e0e\u68a6\u60f3\u672a\u7adf\u7684\u9057\u61be\u3002\u7528\u6237\u6709\u7a33\u5b9a\u7684\u5de5\u4f5c\uff08\u653f\u5e9c\u5316\u503a\u76f8\u5173\uff09\u548c\u793e\u4fdd\uff0c\u4f46\u6df1\u611f\u5de5\u4f5c\u201c\u9e21\u808b\u201d\uff0c\u5185\u5fc3\u4ecd\u6000\u63e3\u5bf9\u52a8\u6f2b\u7684\u201c\u68a6\u60f3\u201d\uff0c\u6e34\u671b\u572850\u5c81\u8fd9\u4e2a\u8282\u70b9\u201c\u8ffd\u6c42\u81ea\u5df1\u7684\u68a6\u60f3\u201d\uff0c\u5b9e\u73b0\u4e2a\u4eba\u4ef7\u503c\uff0c\u800c\u975e\u4ec5\u4e3a\u751f\u5b58\u6216\u5b89\u5168\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u7684\u68a6\u60f3\u5bb6\u201d\u7684\u8ba4\u540c\u611f\u4e0e\u966a\u4f34\u611f**\u3002\u63d0\u4f9b\u4e00\u79cd\u201c\u5373\u4fbf\u518d\u5fd9\uff0c\u4f60\u4e5f\u5728\u4e3a\u81ea\u5df1\u6d3b\u201d\u7684\u4eea\u5f0f\u611f\u548c\u793e\u7fa4\u5f52\u5c5e\uff0c\u8ba9\u4ed6\u611f\u5230\u5b66\u4e60\u662f\u5728\u4e3a\u201c\u68a6\u60f3\u201d\u84c4\u529b\uff0c\u800c\u4e0d\u4ec5\u4ec5\u662f\u6280\u80fd\u57f9\u8bad\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b (\u6210\u957f\u6295\u8d44\u578b)** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u5728\u6781\u5ea6\u7e41\u5fd9\u4e2d\u4ecd\u575a\u6301\u63d0\u4ea4\u4f5c\u4e1a\u3001\u542c\u56de\u653e\uff0c\u9ed8\u9ed8\u8ddf\u8fdb\uff0c\u52a1\u5b9e\u4f4e\u8c03) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u7ecf\u6d4e\u72ec\u7acb\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u56e0\u5de5\u4f5c\u6301\u7eed\u9ad8\u538b\u5bfc\u81f4\u8bfe\u7a0b\u4e25\u91cd\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u82b1\u4e86\u94b1\u5374\u6ca1\u65f6\u95f4\u5b66\u201d\u7684\u6127\u759a\u611f\u548c\u632b\u8d25\u611f\uff0c\u6700\u7ec8\u56e0\u201c\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\u201d\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u81ea\u6211\u8c03\u8282\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d\u4f4e | \u52a8\u673a\u7eaf\u5ea6\u9ad8\uff0c\u5bf9\u77ed\u671f\u53d8\u73b0\u671f\u671b\u4f4e\uff0c\u4f46\u82e5\u957f\u671f\uff08\u5982\u534a\u5e74\u540e\uff09\u611f\u89c9\u6beb\u65e0\u6210\u957f\uff0c\u53ef\u80fd\u4ea7\u751f\u4ef7\u503c\u8d28\u7591\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c3-4\u5468**\u3002\u6b64\u65f6\u8bfe\u7a0b\u96be\u5ea6\u548c\u4f5c\u4e1a\u91cf\u53ef\u80fd\u589e\u52a0\uff0c\u800c\u7528\u6237\u5de5\u4f5c\u8d1f\u8377\u672a\u51cf\uff0c\u79ef\u538b\u7684\u8bfe\u7a0b\u548c\u4f5c\u4e1a\u6210\u4e3a\u4e0d\u53ef\u627f\u53d7\u4e4b\u91cd\uff0c\u5bfc\u81f4\u201c\u4e60\u5f97\u6027\u65e0\u52a9\u201d\u800c\u653e\u5f03\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cXX\u59d0/\u54e5\uff0c\u770b\u5230\u60a8\u7684\u5de5\u4f5c\u5f3a\u5ea6\uff0c\u771f\u7684\u975e\u5e38\u656c\u4f69\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u5c31\u662f\u4e3a\u60a8\u8fd9\u6837\u7684\u2018\u65f6\u95f4\u7a00\u7f3a\u8005\u2019\u8bbe\u8ba1\u7684\u3002**\u8bfe\u7a0b\u6c38\u4e45\u56de\u653e\uff0c\u4f5c\u4e1a\u6ca1\u6709\u786c\u6027\u622a\u6b62\u65e5\u671f**\u3002\u60a8\u4e0d\u7528\u8d76\uff0c\u54b1\u4eec\u7684\u76ee\u6807\u4e0d\u662f\u2018\u6309\u65f6\u6bd5\u4e1a\u2019\uff0c\u800c\u662f\u2018\u6bcf\u5b66\u4e00\u70b9\uff0c\u90fd\u79bb\u60a8\u559c\u6b22\u7684\u52a8\u6f2b\u4e16\u754c\u66f4\u8fd1\u4e00\u6b65\u2019\u3002\u7d2f\u4e86\u5c31\u4f11\u606f\uff0c\u6709\u7a7a\u4e86\u968f\u65f6\u6361\u8d77\u6765\uff0c\u6211\u4e00\u76f4\u5728\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5174\u8da3\u6e38\u4e50\u7ebf\u3011**\u3002\u5f31\u5316\u53d8\u73b0\u548c\u4f5c\u4e1a\u538b\u529b\uff0c\u5f3a\u5316\u5174\u8da3\u63a2\u7d22\u548c\u793e\u7fa4\u966a\u4f34\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n    1.  **\u3010\u5f02\u6b65\u5b66\u4e60\u652f\u6301\u5305\u3011**\uff1a\u6240\u6709\u76f4\u64ad\u8bfe\u81ea\u52a8\u751f\u6210\u7cbe\u534e\u7b14\u8bb0/\u601d\u7ef4\u5bfc\u56fe\uff0c\u4e00\u952e\u53d1\u9001\u3002\n    2.  **\u3010\u5f39\u6027\u4f5c\u4e1a\u673a\u5236\u3011**\uff1a\u5141\u8bb8\u5176\u63d0\u4ea4\u201c\u5b66\u4e60\u5fc3\u5f97\u201d\u6216\u201c\u7075\u611f\u788e\u7247\u201d\u66ff\u4ee3\u6807\u51c6\u4f5c\u4e1a\u3002\n    3.  **\u3010\u68a6\u60f3\u52a0\u6cb9\u7ad9\u3011**\uff1a\u5b9a\u671f\u63a8\u9001\u4e0e\u5176\u5174\u8da3\uff08\u52a8\u6f2b\u3001\u5199\u4f5c\uff09\u76f8\u5173\u7684\u8f7b\u91cf\u7ea7\u62d3\u5c55\u8d44\u6599\u6216\u6848\u4f8b\uff0c\u7ef4\u6301\u5b66\u4e60\u706b\u79cd\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u522b\u4eba\u90fd\u4ea4\u4f5c\u4e1a\u4e86\u201d\u3001\u201c\u518d\u4e0d\u5b66\u5c31\u8ddf\u4e0d\u4e0a\u4e86\u201d\u7b49\u8bdd\u672f\u5236\u9020\u7126\u8651\u3002\u7981\u6b62\u50ac\u4fc3\u5176\u6309\u65f6\u4e0a\u8bfe\u3001\u4ea4\u4f5c\u4e1a\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u73b0\u6709\u8bfe\u7a0b\u672a\u6d88\u5316\u524d\uff0c\u4efb\u4f55\u5347\u5355\u63a8\u8350\u90fd\u662f\u538b\u57ae\u4ed6\u7684\u6700\u540e\u4e00\u6839\u7a3b\u8349\u3002\u9500\u552e\u63d0\u53ca\u77ed\u89c6\u9891\u8bfe\u5df2\u5c5e\u98ce\u9669\u884c\u4e3a\uff0c\u73ed\u4e3b\u4efb\u9700\u505a\u201c\u964d\u6e29\u201d\u5904\u7406\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u4ece\u6211\u672c\u4eba\u6765\u8bf4\uff0c\u662f\u771f\u7684\u60f3\u5b66\uff0c\u4f46\u5e73\u65f6\u5de5\u4f5c\u592a\u5fd9\u4e86\uff0c\u73b0\u5728\u5e74\u9f84\u53c8\u662f50\u5c81\u4e86\uff0c\u516c\u53f8\u7ed9\u4e70\u7740\u793e\u4fdd\uff0c\u6240\u4ee5\u592a\u9e21\u808b\u4e86\u201d\n2. > \u201c\u6211\u5de5\u4f5c\u592a\u5fd9\u4e86\uff0c\u4ece\u53bb\u5e748\u6708\u4efd\u653f\u5e9c\u5316\u503a\u5f00\u59cb\uff0c\u5929\u5929\u90fd\u5728\u8d85\u8d1f\u8377\u8fd0\u8f6c\u201d\n3. > \u201c\u6211\u4e00\u76f4\u90fd\u5f88\u559c\u6b22\u52a8\u6f2b\uff0c\u5927\u5b66\u6bd5\u4e1a\u540e\uff0c\u5de5\u4f5c\u6027\u8d28\u53d8\u52a8\u540e\uff0c\u53c8\u4e00\u4e2a\u4eba\u629a\u517b\u5b69\u5b50\u3001\u7167\u987e\u8001\u4eba\uff0c\u5c31\u6ca1\u6709\u52c7\u6c14\u53bb\u8ffd\u6c42\u81ea\u5df1\u7684\u68a6\u60f3\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0\uff08\u91cd\u62fe\u68a6\u60f3\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u89e3\u9664\u65f6\u95f4\u538b\u8feb\u611f\uff0c\u63d0\u4f9b\u5f02\u6b65\u3001\u5f39\u6027\u3001\u5174\u8da3\u5bfc\u5411\u7684\u5b66\u4e60\u652f\u6301\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"maslow_need\": \"\u7b2c\u4e94\u5c42\u81ea\u6211\u5b9e\u73b0\", \"risk_level\": \"\u4e2d\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf+\u5f02\u6b65\u5b66\u4e60\u652f\u6301\u5305\"}\n```";
