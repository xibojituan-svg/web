    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677164430\u7684\u7528\u6237\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677164430 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5174\u6f84\u3010\u7b71\u6590\u56e2\u961f\u3011(\u5e38\u8d8a) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6500\u767b\u8ba1\u52122025\u7cbe\u82f1\u7248\uff08\u610f\u5411\u4ef7\u683c7380/3980\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3 / \u88ab\u8feb\u5206\u671f**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u5bb6\u91cc\u73b0\u5728\u771f\u7684\u6ca1\u6709\u94b1\u201d\u3001\u201c\u6211\u7238\u73b0\u5728\u8fd8\u5728\u6b20\u94b1\u3002\u6211\u5988\u4e5f\u6ca1\u6709\u5de5\u4f5c\u201d\uff0c\u6700\u7ec8\u901a\u8fc7\u82b1\u5457\u5206\u671f\u652f\u4ed8\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u9ad8\u5bbd\u88d5**\u3002\u7528\u6237\u65e0\u5de5\u4f5c\uff0c\u81ea\u79f0\u6bcf\u5929\u67095\u5c0f\u65f6\u788e\u7247\u5316\u65f6\u95f4\u7528\u4e8e\u5b66\u4e60\u548c\u517c\u804c\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u9690\u7792\u5077\u62a5 \u2192 \u6781\u7aef\u53cd\u5bf9 \u2192 \u8270\u96be\u8bf4\u670d**\u3002\u7528\u6237\u7236\u4eb2\u5f3a\u70c8\u53cd\u5bf9\uff08\u201c\u6211\u7238\u5c31\u662f\u4e0d\u653e\u5fc3\uff0c\u5bb3\u6015\u6211\u88ab\u9a97\u201d\uff09\uff0c\u751a\u81f3\u67e5\u5230\u516c\u53f8\u6709\u201c\u88ab\u544a\u7684\u524d\u79d1\u201d\uff0c\u7528\u6237\u201c\u6c42\u4e86\u597d\u4e45\u201d\u624d\u52c9\u5f3a\u540c\u610f\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u804a\u5929\u8bb0\u5f55\u5b8c\u6574\uff0c\u6e05\u6670\u5c55\u73b0\u4e86\u7528\u6237\u7684\u5b66\u4e60\u884c\u4e3a\u3001\u5bb6\u5ead\u7ecf\u6d4e\u72b6\u51b5\u3001\u51b3\u7b56\u8fc7\u7a0b\u548c\u60c5\u7eea\u6ce2\u52a8\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u2b06\u9ad8 (7-8\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u957f\u671f\u804c\u4e1a\u53d1\u5c55\u800c\u6765\uff0c\u5b66\u4e60\u610f\u613f\u5f3a\u70c8\uff0c\u884c\u52a8\u529b\u5f3a\uff0c\u6709\u660e\u786e\u7684\u804c\u4e1a\u8f6c\u578b\u89c4\u5212\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5982\u679c\u6709\u58f0\u9002\u5408\u6211\uff0c\u6211\u5c31\u6253\u7b97\u8ddf\u5bb6\u957f\u8c08\u8c08\u505a\u4e3b\u4e1a\u201d > \u201c\u6211\u4e00\u5b9a\u4f1a\u597d\u597d\u5b66\u7684\u201d > \u4e3b\u52a8\u5b8c\u6210\u65e9\u529f\u3001\u63d0\u4ea4\u4f5c\u4e1a\u3001\u8be2\u95ee\u5f55\u97f3\u6280\u672f\u7ec6\u8282\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e (1-2\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u6781\u4f4e** \u2014 \u5bb6\u5ead\u7ecf\u6d4e\u56f0\u96be\uff08\u7236\u4eb2\u6b20\u503a\u3001\u6bcd\u4eb2\u65e0\u4e1a\uff09\uff0c\u4e2a\u4eba\u65e0\u6536\u5165\uff0c\u652f\u4ed8\u5b66\u8d39\u9700\u4f9d\u8d56\u82b1\u5457\u5206\u671f\uff0c\u8d44\u91d1\u538b\u529b\u5de8\u5927\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u9ad8** \u2014 \u65e0\u5de5\u4f5c\uff0c\u81ea\u79f0\u6bcf\u5929\u67095\u5c0f\u65f6\u53ef\u7528\u65f6\u95f4\uff0c\u4e14\u80fd\u6309\u65f6\u5b8c\u6210\u8bad\u7ec3\u8425\u4efb\u52a1\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u6781\u4f4e** \u2014 \u5bb6\u957f\u56e0\u7ecf\u6d4e\u538b\u529b\u548c\u9632\u9a97\u62c5\u5fe7\u800c\u5f3a\u70c8\u53cd\u5bf9\uff0c\u7528\u6237\u9700\u201c\u6c42\u4e86\u597d\u4e45\u201d\u624d\u8270\u96be\u8bf4\u670d\uff0c\u5bb6\u5ead\u652f\u6301\u7cfb\u7edf\u8106\u5f31\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a**\u3002\u9762\u5bf9\u5bb6\u5ead\u53cd\u5bf9\u548c\u7ecf\u6d4e\u538b\u529b\u65f6\u8868\u73b0\u51fa\u7126\u8651\u548c\u8106\u5f31\uff08\u201c\u6211\u521a\u521a\u5dee\u70b9\u5df2\u7ecf\u8981\u54ed\u4e86\u201d\uff09\uff0c\u4f46\u5728\u5f97\u5230\u9500\u552e\u5b89\u629a\u548c\u627f\u8bfa\u540e\u80fd\u8fc5\u901f\u6062\u590d\u4fe1\u5fc3\u548c\u51b3\u5fc3\u3002\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u80fd\u4e3b\u52a8\u53cd\u9988\u56f0\u96be\uff08\u201c\u7ec3\u820c\u5934\u90a3\u4e00\u6b65\u7684\u65f6\u5019\u4f1a\u89c9\u5f97\u5f88\u9178\u201d\uff09\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u653e\u5f03\u503e\u5411\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u521a\u521a\u5dee\u70b9\u5df2\u7ecf\u8981\u54ed\u4e86\u201d > \u201c\u6211\u6c42\u4e86\u597d\u4e45\u201d > \u201c\u6211\u4e00\u5b9a\u4f1a\u597d\u597d\u5b66\u7684\uff0c\u6c38\u8fdc\u8ddf\u7740\u5b66\u59d0\u7684\u6b65\u4f10\u8d70\u201d\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42\uff08\u7126\u8651\u4fdd\u969c\uff09**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u7ecf\u6d4e\u5b89\u5168\u4e0e\u804c\u4e1a\u51fa\u8def\u7126\u8651**\u3002\u4f5c\u4e3a\u65e0\u4e1a\u9752\u5e74\uff0c\u9762\u4e34\u5bb6\u5ead\u7ecf\u6d4e\u538b\u529b\u548c\u7236\u6bcd\u50ac\u627e\u5de5\u4f5c\u7684\u53cc\u91cd\u538b\u529b\uff0c\u6025\u9700\u4e00\u4e2a\u80fd\u5feb\u901f\u5e26\u6765\u6536\u5165\u3001\u6539\u53d8\u73b0\u72b6\u7684\u201c\u6551\u547d\u7a3b\u8349\u201d\u3002\u6709\u58f0\u884c\u4e1a\u88ab\u5176\u89c6\u4e3a\u89e3\u51b3\u751f\u5b58\u5371\u673a\u548c\u83b7\u5f97\u5bb6\u5ead\u8ba4\u53ef\u7684\u53ef\u884c\u8def\u5f84\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u9632\u62a4\u76fe\u201d\u5f0f\u7684\u5b89\u5168\u611f\u4e0e\u201c\u5f15\u8def\u4eba\u201d\u5f0f\u7684\u786e\u5b9a\u6027**\u3002\u9700\u8981\u63d0\u4f9b\u6781\u5f3a\u7684\u5408\u540c\u4fdd\u969c\u3001\u660e\u786e\u7684\u53d8\u73b0\u8def\u5f84\u627f\u8bfa\uff0c\u4ee5\u53ca\u73ed\u4e3b\u4efb\u201c\u4fdd\u9a7e\u62a4\u822a\u201d\u7684\u5f3a\u4f9d\u8d56\u5173\u7cfb\uff0c\u6765\u5bf9\u51b2\u5176\u5bb6\u5ead\u53cd\u5bf9\u548c\u7ecf\u6d4e\u538b\u529b\u5e26\u6765\u7684\u5de8\u5927\u4e0d\u5b89\u5168\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udd34 D\u7c7b** (\u89e6\u53d1T8-D\u7edd\u8def\u8d4c\u5f92\u5371\u673a\u5904\u7f6e\u534f\u8bae) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T8-D \u7edd\u8def\u8d4c\u5f92** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a**\ud83d\udd34\u5df2\u89e6\u53d1 D \u7c7b\u7194\u65ad\u7ea2\u7ebf\uff01**\n- **\u89e6\u53d1\u56e0\u7531**\uff1a**\u590d\u5408\u7edd\u671b\u4fe1\u53f7**\u3002\u8d44\u6e90\u5e95\u5ea7\u8bc4\u5206\u22640\uff08\u5bb6\u5ead\u6b20\u503a\u3001\u65e0\u6536\u5165\u3001\u82b1\u5457\u5206\u671f\uff09+ \u5fc3\u7406\u5f39\u6027\u8bc4\u5206\u22644\uff08\u9762\u5bf9\u538b\u529b\u60c5\u7eea\u5d29\u6e83\uff09+ **\u4fdd\u5e95\u5e7b\u60f3**\uff08\u5c06\u8bfe\u7a0b\u89c6\u4e3a\u89e3\u51b3\u5bb6\u5ead\u7ecf\u6d4e\u56f0\u5883\u7684\u552f\u4e00\u51fa\u8def\uff09\u3002\u7b26\u5408T8-D\u5371\u673a\u5904\u7f6e\u534f\u8bae\u7684\u7ea2\u7ebf1\uff08\u7f51\u8d37\u786e\u8ba4\uff09\u4e0e\u7ea2\u7ebf4\uff08\u590d\u5408\u7edd\u671b\uff09\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| **\u5bb6\u5ead\u5e72\u9884\u578b** | **\u6781\u9ad8** | \u7236\u4eb2\u672c\u5c31\u5f3a\u70c8\u53cd\u5bf9\uff0c\u4e00\u65e6\u5b66\u4e60\u521d\u671f\u672a\u8fbe\u9884\u671f\u6216\u5bb6\u5ead\u7ecf\u6d4e\u538b\u529b\u52a0\u5267\uff0c\u7236\u4eb2\u53ef\u80fd\u5f3a\u5236\u8981\u6c42\u9000\u8d39\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u4e2d** | \u867d\u7136\u65f6\u95f4\u5145\u88d5\uff0c\u4f46\u82e5\u5b66\u4e60\u9047\u5230\u6280\u672f\u74f6\u9888\uff08\u5982\u8f6f\u4ef6\u64cd\u4f5c\u3001\u8bd5\u97f3\u5931\u8d25\uff09\uff0c\u7ed3\u5408\u5176\u5bb6\u5ead\u538b\u529b\uff0c\u5bb9\u6613\u4ea7\u751f\u201c\u6211\u662f\u4e0d\u662f\u53c8\u9009\u9519\u4e86\u201d\u7684\u5d29\u6e83\u611f\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u9ad8** | \u7ecf\u6d4e\u538b\u529b\u5df2\u4f7f\u5176\u5904\u4e8e\u60c5\u7eea\u8fb9\u7f18\u3002\u4efb\u4f55\u5b66\u4e60\u632b\u6298\u3001\u6d3e\u5355\u5ef6\u8fdf\u6216\u4e0e\u540c\u5b66\u5bf9\u6bd4\u4ea7\u751f\u7684\u81ea\u5351\u611f\uff0c\u90fd\u53ef\u80fd\u6210\u4e3a\u201c\u538b\u57ae\u9a86\u9a7c\u7684\u6700\u540e\u4e00\u6839\u7a3b\u8349\u201d\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u7528\u6237\u62b1\u6709\u201c\u5feb\u901f\u6536\u5165\u548c\u957f\u671f\u7684\u201d\u53cc\u91cd\u9ad8\u671f\u5f85\uff0c\u5e76\u5c06\u6b64\u89c6\u4e3a\u5bb6\u5ead\u7ecf\u6d4e\u89e3\u836f\u3002\u82e5\u5f00\u8bfe\u540e2-3\u4e2a\u6708\u5185\u672a\u80fd\u83b7\u5f97\u53ef\u89c2\u6536\u5165\uff0c\u6781\u5927\u6982\u7387\u56e0\u201c\u6551\u547d\u94b1\u6253\u6c34\u6f02\u201d\u7684\u7edd\u671b\u611f\u800c\u6fc0\u70c8\u6295\u8bc9\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-3\u4e2a\u6708**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u82e5\u63a5\u5355\u53d8\u73b0\u4e0d\u53ca\u9884\u671f\uff0c\u5bb6\u5ead\u538b\u529b\u4e0e\u4e2a\u4eba\u7126\u8651\u53e0\u52a0\uff0c\u5c06\u5f15\u7206\u5168\u9762\u9000\u8d39\u5371\u673a\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> **\u201c\u6211\u5b8c\u5168\u7406\u89e3\u4f60\u73b0\u5728\u8eab\u4e0a\u7684\u62c5\u5b50\u548c\u5bb6\u4eba\u7684\u62c5\u5fc3\u3002\u8fd9\u6761\u8def\u6211\u4eec\u4e00\u8d77\u8d70\uff0c\u7a33\u624e\u7a33\u6253\u3002\u54b1\u4eec\u4e0d\u56fe\u5feb\uff0c\u56fe\u7684\u662f\u6bcf\u4e00\u6b65\u90fd\u8d70\u5f97\u8e0f\u5b9e\uff0c\u8ba9\u4f60\u548c\u5bb6\u4eba\u771f\u6b63\u653e\u5fc3\u3002\u6709\u4efb\u4f55\u56f0\u96be\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u662f\u4f60\u7684\u5b66\u59d0\uff0c\u66f4\u662f\u4f60\u7684\u6218\u53cb\u3002\u201d**\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\uff08\u56e0\u5176\u5b66\u4e60\u52a8\u673a\u7eaf\u5ea6\u9ad8\uff0c\u9700\u7528\u624e\u5b9e\u6280\u80fd\u5efa\u7acb\u4fe1\u5fc3\uff09\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u5f3a\u5236\u6302\u8f7d **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\uff08\u6ee1\u914d\u7279\u79cdC\uff09\u3011** + **\u3010\u7cbe\u786e\u6d3e\u5355\u62e6\u622a\uff08B\u6a21\u5757\uff09\u3011**\u3002\u7528\u9ad8\u6d53\u5ea6\u60c5\u611f\u966a\u4f34\uff08C\uff09\u5bf9\u51b2\u5176\u60c5\u7eea\u98ce\u9669\uff0c\u7528\u7cbe\u51c6\u3001\u53ef\u63a7\u7684\u65e9\u671f\u6d3e\u5355\u673a\u4f1a\uff08B\uff09\u7ba1\u7406\u5176\u53d8\u73b0\u9884\u671f\uff0c\u4e25\u9632\u66b4\u5bcc\u5e7b\u60f3\u7834\u706d\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u7edd\u4e0d\u5bf9\u5176\u4f7f\u7528\u4efb\u4f55\u201c\u5feb\u901f\u66b4\u5bcc\u201d\u3001\u201c\u8f7b\u677e\u6708\u5165\u8fc7\u4e07\u201d\u7684\u8bdd\u672f**\uff0c\u8fd9\u7b49\u4e8e\u70b9\u71c3\u70b8\u836f\u6876\u30022. **\u7edd\u4e0d\u5728\u5176\u672a\u7a33\u5b9a\u63a5\u5355\u524d\uff0c\u8fdb\u884c\u4efb\u4f55\u4ea4\u53c9\u9500\u552e\u6216\u5347\u5355**\u30023. **\u7edd\u4e0d\u5ffd\u89c6\u5176\u4efb\u4f55\u4e00\u6b21\u60c5\u7eea\u4f4e\u843d\u4fe1\u53f7**\uff0c\u5fc5\u987b\u7b2c\u4e00\u65f6\u95f4\u4ecb\u5165\u5b89\u629a\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u5176\u7ecf\u6d4e\u72b6\u51b5\u6539\u5584\u3001\u7a33\u5b9a\u53d8\u73b0\u81f3\u5c113\u4e2a\u6708\u4e4b\u524d\uff0c\u7981\u6b62\u63a8\u8350\u4efb\u4f55\u9ad8\u9636\u8bfe\u7a0b\u6216\u786c\u4ef6\u8bbe\u5907\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > **\u201c\u5bb6\u91cc\u73b0\u5728\u771f\u7684\u6ca1\u6709\u94b1\u201d\u3001\u201c\u6211\u7238\u73b0\u5728\u8fd8\u5728\u6b20\u94b1\u3002\u6211\u5988\u4e5f\u6ca1\u6709\u5de5\u4f5c\u201d** \u2014\u2014 **\u8d44\u6e90\u5e95\u5ea7\u5d29\u584c\u7ea7\u8bc1\u636e\uff0c\u5bb6\u5ead\u7ecf\u6d4e\u6fd2\u5371\u3002**\n2. > **\u201c\u5982\u679c\u6709\u58f0\u9002\u5408\u6211\uff0c\u6211\u5c31\u6253\u7b97\u8ddf\u5bb6\u957f\u8c08\u8c08\u505a\u4e3b\u4e1a\u201d** \u2014\u2014 **\u5c06\u8bfe\u7a0b\u89c6\u4e3a\u89e3\u51b3\u751f\u5b58\u5371\u673a\u7684\u552f\u4e00\u51fa\u8def\uff0c\u52a8\u673a\u4e0e\u538b\u529b\u9ad8\u5ea6\u7ed1\u5b9a\uff0c\u98ce\u9669\u6781\u9ad8\u3002**\n3. > **\u201c\u6211\u521a\u521a\u5dee\u70b9\u5df2\u7ecf\u8981\u54ed\u4e86\u201d\u3001\u201c\u6211\u6c42\u4e86\u597d\u4e45\u201d** \u2014\u2014 **\u5fc3\u7406\u5f39\u6027\u5728\u5bb6\u5ead\u538b\u529b\u4e0b\u5df2\u663e\u8106\u5f31\uff0c\u51b3\u7b56\u8fc7\u7a0b\u5145\u6ee1\u60c5\u611f\u6323\u624e\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T8-D \u7edd\u8def\u8d4c\u5f92\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u9700\u6c42\uff08\u7ecf\u6d4e\u4fdd\u969c\u4e0e\u804c\u4e1a\u51fa\u8def\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7acb\u5373\u542f\u52a8T8-D\u5371\u673a\u5904\u7f6e\u534f\u8bae\uff0c\u8fdb\u884c\u4e25\u683c\u7684\u9006\u5411\u9884\u671f\u7ba1\u7406\uff0c\u5e76\u5728\u540e\u7eed\u670d\u52a1\u4e2d\u63d0\u4f9b\u8d85\u9ad8\u5f3a\u5ea6\u7684\u60c5\u7eea\u6258\u5e95\u4e0e\u7cbe\u786e\u7684\u65e9\u671f\u53d8\u73b0\u8def\u5f84\u5f15\u5bfc\u3011**\u3002\n\n```json\n{\"core_type\": \"T8-D \u7edd\u8def\u8d4c\u5f92\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\uff08\u5fc5\u987b\u6346\u7ed1\u6ee1\u914d\u60c5\u7eea\u7597\u6108\u5305\u4e0e\u7cbe\u786e\u6d3e\u5355\uff09\"}\n```";
