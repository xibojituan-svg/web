    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49)**\n    *   **\u53d8\u73b0\u9a71\u52a8**\uff1a\u6838\u5fc3\u52a8\u673a\u4e3a\u201c\u6ca1\u4ec0\u4e48\u94b1\u4e86\u201d\uff0c\u5e0c\u671b\u201c\u8e0f\u8e0f\u5b9e\u5b9e\u8d5a\u94b1\u201d\u3002\u9000\u4f0d\u540e\u6295\u8d44\u5931\u8d25\uff0c\u7ecf\u6d4e\u538b\u529b\u662f\u4e3b\u8981\u9a71\u52a8\u529b\u3002\n    *   **\u5174\u8da3\u840c\u82bd**\uff1a\u66fe\u60f3\u8fc7\u5f53\u58f0\u4f18\uff0c\u5bf9\u58f0\u97f3\u9886\u57df\u6709\u521d\u6b65\u5174\u8da3\uff0c\u4f46\u975e\u7eaf\u7cb9\u70ed\u7231\u3002\n    *   **\u76ee\u6807\u6a21\u7cca**\uff1a\u5b66\u4e60\u9884\u671f\u4e3a\u201c\u591a\u5b66\u591a\u7ec3\uff0c\u8d8a\u6765\u8d8a\u597d\u5427\u201d\uff0c\u7f3a\u4e4f\u5177\u4f53\u3001\u53ef\u91cf\u5316\u7684\u53d8\u73b0\u76ee\u6807\u6216\u804c\u4e1a\u89c4\u5212\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d\u7b49\u504f\u4f4e)**\n    *   **\u7ecf\u6d4e\u8d44\u6e90**\uff1a\u9000\u4f0d\u8d39\u56e0\u6295\u8d44\u4e8f\u635f\u5927\u534a\uff0c**\u5f53\u524d\u7ecf\u6d4e\u72b6\u51b5\u7d27\u5f20**\u3002\u4f46\u4ecd\u6709\u80fd\u529b\u652f\u4ed8\u5b66\u8d39\u5e76\u65b0\u8d2d\u4e09\u5343\u591a\u5143\u7535\u8111\uff0c\u5177\u5907\u57fa\u7840\u6d88\u8d39\u80fd\u529b\u3002\n    *   **\u65f6\u95f4\u8d44\u6e90**\uff1a\u81ea\u79f0\u201c\u4e0d\u4e0a\u73ed\u201d\uff0c\u65f6\u95f4\u81ea\u7531\u5ea6\u8f83\u9ad8\uff0c\u4f46**\u6613\u53d7\u4e2a\u4eba\u751f\u6d3b\uff08\u4e0e\u5bf9\u8c61\u5435\u67b6\u3001\u5bb6\u5ead\u4e8b\u52a1\u3001\u7ea0\u7eb7\uff09\u5e72\u6270**\uff0c\u5b66\u4e60\u8fde\u7eed\u6027\u5b58\u7591\u3002\n    *   **\u8bbe\u5907\u8d44\u6e90**\uff1a\u5df2\u4e3b\u52a8\u8d2d\u7f6e\u7535\u8111\uff0c\u5e76\u54a8\u8be2\u3001\u8d2d\u4e70\u4e86\u4e13\u4e1a\u9ea6\u514b\u98ce\uff08MK4\uff09\uff0c\u5728\u8bbe\u5907\u6295\u5165\u4e0a**\u663e\u793a\u51fa\u4e00\u5b9a\u7684\u51b3\u5fc3\u548c\u884c\u52a8\u529b**\u3002\n    *   **\u793e\u4f1a\u652f\u6301**\uff1a\u5bb6\u4eba\uff08\u51b3\u7b56\u6743\u65b9\uff09\u5bf9\u5176\u5b66\u4e60\u6709\u5e72\u9884\uff08\u201c\u5bb6\u4eba\u4e0d\u8ba9\u62a5\u201d\u540e\u671f\u8bfe\uff09\uff0c**\u5bb6\u5ead\u652f\u6301\u5ea6\u6709\u9650\u4e14\u5b58\u5728\u9690\u6027\u51b3\u7b56\u6743**\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u7b49\u504f\u4f4e)**\n    *   **\u60c5\u7eea\u7a33\u5b9a\u6027\u5f31**\uff1a\u591a\u6b21\u63d0\u53ca\u4e0e\u5bf9\u8c61\u5435\u67b6\u5f71\u54cd\u72b6\u6001\uff0c\u5e76\u56e0\u6b64\u5bf9\u73ed\u4e3b\u4efb\u6492\u8c0e\u3002\u60c5\u7eea\u6613\u53d7\u4eb2\u5bc6\u5173\u7cfb\u6ce2\u52a8\u5f71\u54cd\u3002\n    *   **\u6297\u538b\u80fd\u529b\u5f85\u89c2\u5bdf**\uff1a\u80fd\u4e3b\u52a8\u9053\u6b49\u5e76\u8c03\u6574\uff0c\u4f46\u751f\u6d3b\u7410\u4e8b\uff08\u7ea0\u7eb7\u3001\u626b\u5893\uff09\u9891\u7e41\u6253\u65ad\u5b66\u4e60\u8282\u594f\uff0c**\u663e\u793a\u6297\u5e72\u6270\u80fd\u529b\u4e00\u822c**\u3002\n    *   **\u884c\u52a8\u529b\u5c1a\u53ef**\uff1a\u80fd\u5b8c\u6210\u5165\u7fa4\u3001\u9009\u4e66\u3001\u8d2d\u8bbe\u5907\u3001\u8c03\u8bd5\u3001\u4ea4\u4f5c\u4e1a\u7b49\u89c4\u5b9a\u52a8\u4f5c\uff0c\u5728\u793e\u7fa4\u4e2d\u8868\u73b0\u6d3b\u8dc3\uff08\u53d1\u901a\u77e5\u3001\u4e92\u52a8\uff09\uff0c**\u8868\u9762\u914d\u5408\u5ea6\u9ad8**\u3002\n    *   **\u81ea\u6211\u8ba4\u77e5\u6e05\u6670**\uff1a\u81ea\u8ba4\u201ci\u4eba\u201d\uff0c\u73b0\u5b9e\u4e2d\u4e0d\u5584\u8a00\u8f9e\uff0c\u5bf9\u81ea\u8eab\u6027\u683c\u6709\u8ba4\u77e5\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u5df2\u652f\u4ed8\uff08\u53ef\u5165\u7fa4\u3001\u9009\u7248\u6743\u4e66\u3001\u88ab\u50ac\u4f5c\u4e1a\uff09\uff0c\u901a\u8fc7\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u5b58\u5728\u5bb6\u5ead\u51b3\u7b56\u5e72\u9884**\u3002\u7528\u6237\u63d0\u53ca\u201c\u5bb6\u4eba\u4e0d\u8ba9\u62a5\u201d\u540e\u671f\u8bfe\uff0c\u8868\u660e\u91cd\u5927\u6d88\u8d39\uff08\u53ef\u80fd\u5305\u62ec\u521d\u59cb\u62a5\u540d\uff09\u9700\u5bb6\u5ead\u77e5\u60c5\u6216\u540c\u610f\uff0c\u5bb6\u5ead\u4e3a\u6f5c\u5728\u51b3\u7b56\u65b9\u6216\u7ecf\u6d4e\u6765\u6e90\u3002\n*   **\u6b65\u9aa41\uff1a\u52a8\u673a\u7eaf\u5ea6**\uff1aB\u7c7b\uff08\u6df7\u5408\u52a8\u673a\uff09\u3002\u7ecf\u6d4e\u538b\u529b\u4e3a\u4e3b\uff0c\u5174\u8da3\u4e3a\u8f85\uff0c\u76ee\u6807\u6a21\u7cca\u3002\n*   **\u6b65\u9aa42\uff1a\u8d44\u6e90\u5e95\u5ea7**\uff1aC\u7c7b\uff08\u8d44\u6e90\u53d7\u9650\uff09\u3002\u65f6\u95f4\u5145\u88d5\u4f46\u788e\u7247\u5316\uff0c\u7ecf\u6d4e\u521a\u8131\u8d2b\uff0c\u5bb6\u5ead\u652f\u6301\u5f31\u3002\n*   **\u6b65\u9aa43\uff1a\u5fc3\u7406\u5f39\u6027**\uff1aC\u7c7b\uff08\u5f39\u6027\u4e0d\u8db3\uff09\u3002\u60c5\u7eea\u6613\u6ce2\u52a8\uff0c\u6297\u5e72\u6270\u80fd\u529b\u5f31\uff0c\u4f46\u884c\u52a8\u914d\u5408\u5ea6\u5c1a\u53ef\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**\uff1a**BCC\u578b**\u3002\u52a8\u673a\u4e0d\u7eaf\u3001\u8d44\u6e90\u53d7\u9650\u3001\u5fc3\u7406\u5f39\u6027\u4e0d\u8db3\u7684\u6df7\u5408\u578b\u7528\u6237\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**\uff1a**T5 \u7ecf\u6d4e\u9a71\u52a8\u6c42\u751f\u8005**\n    *   **\u6838\u5fc3\u7279\u5f81**\uff1a\u7ecf\u6d4e\u538b\u529b\u4e3a\u4e3b\u8981\u5b66\u4e60\u9a71\u52a8\u529b\uff0c\u5bfb\u6c42\u5feb\u901f\u53d8\u73b0\u8def\u5f84\u3002\u8d44\u6e90\u6709\u9650\uff0c\u6297\u98ce\u9669\u80fd\u529b\u5f31\uff0c\u6613\u56e0\u751f\u6d3b\u53d8\u6545\u4e2d\u65ad\u5b66\u4e60\u3002\n    *   **\u4e00\u81f4\u6027**\uff1a\u7528\u6237\u201c\u4e8f\u4e86\u5927\u534a\u9000\u4f0d\u8d39\u201d\u3001\u201c\u6ca1\u4ec0\u4e48\u94b1\u4e86\u201d\u662f\u6838\u5fc3\u75db\u70b9\uff0c\u5b66\u4e60\u4e3a\u8c0b\u751f\u624b\u6bb5\u3002\u8bbe\u5907\u6295\u5165\u663e\u793a\u5176\u201c\u6c42\u751f\u201d\u51b3\u5fc3\uff0c\u4f46\u5bb6\u5ead\u5e72\u9884\u3001\u60c5\u7eea\u6ce2\u52a8\u3001\u4e8b\u52a1\u5e72\u6270\u5747\u7b26\u5408\u8d44\u6e90\u4e0e\u5fc3\u7406\u53d7\u9650\u7279\u5f81\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u98ce\u9669\u7b49\u7ea7**\uff1a**\u4e2d**\n*   **\u6839\u56e0\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u76ee\u6807\u6a21\u7cca\uff08\u201c\u8d8a\u6765\u8d8a\u597d\u5427\u201d\uff09\uff0c\u4f46\u9690\u542b\u7ecf\u6d4e\u56de\u62a5\u671f\u671b\u3002\u82e5\u4e2d\u671f\u65e0\u53d8\u73b0\u611f\u77e5\uff0c\u6613\u5931\u671b\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u9ad8\u98ce\u9669**\u3002**\u521d\u59cb\u7ecf\u6d4e\u72b6\u51b5\u5df2\u7d27\u5f20**\uff0c\u662f\u6838\u5fc3\u98ce\u9669\u6e90\u3002\u4efb\u4f55\u989d\u5916\u5f00\u652f\u6216\u6536\u5165\u5ef6\u8fdf\u90fd\u53ef\u80fd\u89e6\u53d1\u9000\u8d39\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u4e2d\u98ce\u9669**\u3002\u867d\u4e0d\u4e0a\u73ed\uff0c\u4f46\u751f\u6d3b\u5e72\u6270\u591a\uff08\u5435\u67b6\u3001\u7ea0\u7eb7\u3001\u5bb6\u4e8b\uff09\uff0c\u5b66\u4e60\u6301\u7eed\u6027\u5b58\u7591\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u4e2d\u9ad8\u98ce\u9669**\u3002**\u5df2\u663e\u6027\u66b4\u9732\u5bb6\u5ead\u5bf9\u7ee7\u7eed\u4ed8\u8d39\uff08\u540e\u671f\u8bfe\uff09\u7684\u53cd\u5bf9**\uff0c\u5bb6\u5ead\u53ef\u80fd\u5bf9\u5df2\u6709\u6d88\u8d39\u4e0d\u77e5\u60c5\u6216\u4e0d\u540c\u610f\uff0c\u662f\u91cd\u5927\u9690\u60a3\u3002\n    5.  **\u4ea7\u54c1\u4e0d\u7b26**\uff1a\u4f4e\u98ce\u9669\u3002\u76ee\u524d\u914d\u5408\u5ea6\u9ad8\uff0c\u672a\u8868\u8fbe\u4e0d\u6ee1\u3002\n    6.  **\u670d\u52a1\u4e0d\u6ee1**\uff1a\u4f4e\u98ce\u9669\u3002\u4e0e\u73ed\u4e3b\u4efb\u5173\u7cfb\u826f\u597d\u3002\n    7.  **\u7ade\u54c1\u8f6c\u79fb/\u5174\u8da3\u8f6c\u79fb**\uff1a\u4f4e\u98ce\u9669\u3002\u6682\u65e0\u8ff9\u8c61\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\n    *   **\u5bb6\u5ead\u77e5\u60c5\u6743**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u660e\u786e\u63d0\u5230\u201c\u5bb6\u4eba\u4e0d\u8ba9\u62a5\u201d\uff0c\u5f3a\u70c8\u6697\u793a\u5f53\u524d\u8bfe\u7a0b\u6d88\u8d39\u53ef\u80fd\u672a\u83b7\u5bb6\u5ead\u5b8c\u5168\u652f\u6301\u6216\u77e5\u60c5\u3002\u9500\u552e\u672a\u5728\u8bb0\u5f55\u4e2d\u5bf9\u6b64\u8fdb\u884c\u6838\u5b9e\u4e0e\u5f15\u5bfc\u544a\u77e5\uff0c\u5b58\u5728**\u91cd\u5927\u5408\u89c4\u9690\u60a3**\u3002\n    *   **\u8fc7\u5ea6\u627f\u8bfa**\uff1a\u8bb0\u5f55\u4e2d\u9500\u552e\u672a\u53d1\u73b0\u5938\u5927\u627f\u8bfa\uff0c\u4f46\u9700\u8b66\u60d5\u5bf9\u201c\u7ecf\u6d4e\u9a71\u52a8\u578b\u201d\u7528\u6237\u65e0\u610f\u8bc6\u5f3a\u5316\u201c\u5feb\u94b1\u201d\u9884\u671f\u3002\n    *   **\u8bbe\u5907\u9500\u552e**\uff1a\u7528\u6237\u4e3b\u52a8\u8be2\u95ee\u5e76\u8d2d\u4e70MK4\u8bbe\u5907\uff0c\u8fc7\u7a0b\u81ea\u7136\uff0c\u672a\u53d1\u73b0\u5f3a\u63a8\u8ff9\u8c61\u3002\n*   **\u7ed3\u8bba**\uff1a**\u5bb6\u5ead\u77e5\u60c5\u6743\u6838\u67e5\u7f3a\u5931**\uff0c\u4e3a\u4e3b\u8981\u5408\u89c4\u6f0f\u6d1e\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**\uff1a**\u504f\u5dee**\u3002\u7528\u6237\u7ecf\u6d4e\u9a71\u52a8\u4e14\u8d44\u6e90\u6709\u9650\uff0c\u9002\u5408\u5f3a\u8c03\u201c\u8f7b\u8d44\u4ea7\u3001\u5feb\u4e0a\u624b\u3001\u63a5\u5355\u8def\u5f84\u6e05\u6670\u201d\u7684\u5165\u95e8\u4ea7\u54c1\u3002\u5f53\u524d\u8bfe\u7a0b\u82e5\u5468\u671f\u957f\u3001\u53d8\u73b0\u6162\uff0c\u5219\u5339\u914d\u5ea6\u4f4e\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**\u7acb\u5373\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\u4e0e\u652f\u4ed8\u5171\u8bc6**\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u7d27\u6025\u98ce\u63a7\uff0824\u5c0f\u65f6\u5185\uff09**\uff1a\u73ed\u4e3b\u4efb\u9700\u4ee5\u5173\u6000\u65b9\u5f0f\uff0c**\u6e29\u548c\u4f46\u76f4\u63a5\u6838\u5b9e\u62a5\u540d\u8d39\u7528\u6765\u6e90\u53ca\u5bb6\u5ead\u77e5\u6653\u60c5\u51b5**\u3002\u4f8b\u5982\uff1a\u201c\u770b\u5230\u4f60\u8bf4\u5bb6\u4eba\u5bf9\u5b66\u4e60\u6709\u5efa\u8bae\uff0c\u60f3\u4e86\u89e3\u4e0b\u5f53\u65f6\u62a5\u540d\uff0c\u5bb6\u91cc\u662f\u5426\u4e5f\u652f\u6301\u4f60\u8fd9\u4e2a\u51b3\u5b9a\uff1f\u54b1\u4eec\u4e00\u8d77\u5b66\u4e60\uff0c\u4e5f\u5e0c\u671b\u83b7\u5f97\u5bb6\u4eba\u7684\u7406\u89e3\u548c\u652f\u6301\u3002\u201d\n    2.  **\u9884\u671f\u7ba1\u7406**\uff1a\u5728\u540e\u7eed\u6c9f\u901a\u4e2d\uff0c**\u6821\u6b63\u5176\u201c\u8e0f\u8e0f\u5b9e\u5b9e\u8d5a\u94b1\u201d\u7684\u9884\u671f**\uff0c\u5f3a\u8c03\u5b66\u4e60\u5468\u671f\u3001\u57fa\u672c\u529f\u91cd\u8981\u6027\u53ca\u524d\u671f\u6536\u5165\u7684\u6e10\u8fdb\u6027\uff0c\u907f\u514d\u5176\u56e0\u77ed\u671f\u5185\u672a\u53d8\u73b0\u800c\u5d29\u6e83\u3002\n    3.  **\u60c5\u611f\u652f\u6301\u4e0e\u8282\u594f\u7ef4\u62a4**\uff1a\u5145\u5f53\u7a33\u5b9a\u652f\u6301\u8005\uff0c\u5728\u5176\u60c5\u7eea\u6ce2\u52a8\uff08\u5982\u5435\u67b6\uff09\u65f6\u7ed9\u4e88\u7b80\u5355\u5173\u6000\uff0c\u5e76\u5e2e\u52a9\u5176\u5efa\u7acb\u89c4\u5f8b\u7684\u5b66\u4e60\u8282\u594f\uff0c\u5bf9\u6297\u751f\u6d3b\u5e72\u6270\u3002\n    4.  **\u805a\u7126\u5c0f\u5fae\u6b63\u53cd\u9988**\uff1a\u53ca\u65f6\u80af\u5b9a\u5176\u8bbe\u5907\u6295\u5165\u3001\u4f5c\u4e1a\u5b8c\u6210\u7b49\u5177\u4f53\u884c\u52a8\uff0c\u521b\u9020\u201c\u638c\u63a7\u611f\u201d\u548c\u201c\u8fdb\u6b65\u611f\u201d\uff0c\u7ef4\u7cfb\u5b66\u4e60\u52a8\u529b\u3002\n    5.  **\u8c28\u614e\u63a8\u8fdb\u589e\u503c\u670d\u52a1**\uff1a\u5728**\u5bb6\u5ead\u77e5\u60c5\u95ee\u9898\u89e3\u51b3\u524d**\uff0c\u4e25\u7981\u63a8\u8350\u4efb\u4f55\u4ed8\u8d39\u5347\u7ea7\u3001\u540e\u671f\u8bfe\u7b49\u589e\u503c\u670d\u52a1\u3002\u5373\u4f7f\u89e3\u51b3\u540e\uff0c\u4e5f\u9700\u57fa\u4e8e\u5176\u5b9e\u9645\u5b66\u4e60\u8fdb\u5c55\u548c\u7ecf\u6d4e\u72b6\u51b5\u5ba1\u614e\u8bc4\u4f30\u3002\n\n{\"core_type\": \"T5 \u7ecf\u6d4e\u9a71\u52a8\u6c42\u751f\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u7acb\u5373\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\u4e0e\u652f\u4ed8\u5171\u8bc6\"}";
