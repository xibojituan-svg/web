    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4ee5\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\u7684\u8eab\u4efd\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677169842 (\u6635\u79f0\uff1a\u828b\u6ce5\u68d2\u69cc) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e - \u5927\u6d6a\u6dd8\u6c99\u3010\u7c7d\u83f2\u56e2\u961f\u3011(\u795d\u4e54\u4e91) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u64ad\u6559\u80b2\u9ad8\u9636\u73ed (\u4ef7\u683c\u672a\u77e5\uff0c\u6709\u52a9\u5b66\u91d1) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u5df2\u652f\u4ed8\uff0c\u4f46\u672a\u63d0\u53ca\u8d44\u91d1\u6765\u6e90\u3002\u9700\u8b66\u60d5C2\u7c7b\u98ce\u9669\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u80fd\u53ca\u65f6\u54cd\u5e94\u5e76\u5b8c\u6210\u4f5c\u4e1a\uff0c\u65f6\u95f4\u770b\u4f3c\u5bbd\u88d5\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u804c\u4e1a\u6216\u65f6\u95f4\u5b89\u6392\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u4e92\u52a8\u79ef\u6781\uff0c\u4f46\u591a\u4e3a\u4efb\u52a1\u54cd\u5e94\uff0c\u7f3a\u4e4f\u6df1\u5c42\u4e2a\u4eba\u4fe1\u606f\u66b4\u9732\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **[\u2b07\u4f4e]**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u7eaf\u4e3a\u51e0\u5929\u5185\u63d0\u73b0\u4fdd\u5e95\u800c\u6765(\u4f4e\u6781\u5371)**\u3002\u5bf9\u8bdd\u6838\u5fc3\u56f4\u7ed5\u201c\u8bd5\u97f3\u201d\u3001\u201c\u63a5\u5355\u201d\u3001\u201c\u53d8\u73b0\u201d\uff0c\u5bf9\u201c\u5206\u6210\u4e66\u201d\u6709\u660e\u786e\u504f\u597d\uff0c\u5bf9\u6280\u80fd\u7cbe\u8fdb\u672c\u8eab\u5174\u8da3\u5be5\u5be5\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u5206\u6210\u4e66\u5427\u201d\n> \u201c\u786e\u5b9e\u662f\u60f3\u5f53\u4e2a\u517c\u804c\u6765\u505a\u7684\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **[\u27a1\u4e2d]**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u4e2d]** \u2014 \u5df2\u652f\u4ed8\u9ad8\u9636\u73ed\u8d39\u7528\uff0c\u4f46\u652f\u4ed8\u65b9\u5f0f\u672a\u77e5\uff0c\u65e0\u6cd5\u5224\u65ad\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**[\u4e2d]** \u2014 \u80fd\u6309\u65f6\u53c2\u52a0\u76f4\u64ad\u3001\u63d0\u4ea4\u4f5c\u4e1a\uff0c\u54cd\u5e94\u8fc5\u901f\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u65f6\u95f4\u5b89\u6392\uff0c\u53ef\u80fd\u5b58\u5728\u788e\u7247\u5316\u98ce\u9669\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u4fe1\u606f\u4e0d\u8db3]** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **[\u27a1\u4e2d]**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a(\u4e2d)**\u3002\u9762\u5bf9\u9500\u552e\u50ac\u4fc3\u548c\u590d\u6742\u64cd\u4f5c\uff08\u5982\u9009\u4e66\u3001\u652f\u4ed8\uff09\u65f6\uff0c\u8868\u73b0\u51fa\u77ed\u6682\u7684\u56de\u907f\uff08\u201c\u6211\u6709\u70b9\u4e8b\u201d\uff09\uff0c\u4f46\u80fd\u8fc5\u901f\u6062\u590d\u5e76\u5b8c\u6210\u6307\u4ee4\u3002\u5bf9\u6b63\u9762\u53cd\u9988\uff08\u201c\u60ca\u8273\u201d\u3001\u201c\u68d2\u68d2\u54d2\u201d\uff09\u53cd\u5e94\u79ef\u6781\uff0c\u4f9d\u8d56\u5916\u90e8\u6fc0\u52b1\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u597d\u7684\u597d\u7684\uff0c\u8c22\u8c22\u5b66\u59d0\u201d (\u9ad8\u9891\u793c\u8c8c\u7528\u8bed\uff0c\u663e\u793a\u670d\u4ece\u6027)\n> \u201c\u6211\u6709\u70b9\u4e8b\u201d (\u9762\u5bf9\u652f\u4ed8\u538b\u529b\u65f6\u7684\u77ed\u6682\u56de\u907f)\n> \u201c\u597d\u6709\u6210\u5c31\u611f\u201d (\u5bf9\u7b80\u5355\u6280\u80fd\u638c\u63e1\u540e\u7684\u79ef\u6781\u53cd\u9988)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u4e3b\u4e1a\u4e0d\u7a33\u5b9a\uff08\u201c\u7a81\u7136\u9047\u5230\u88c1\u5458\u6216\u8005\u7ecf\u6d4e\u5371\u673a\u201d\uff09\u7684\u7126\u8651\uff0c\u6e34\u671b\u901a\u8fc7\u4e00\u4e2a\u201c\u81ea\u7531\u201d\u3001\u201c\u4e0d\u5360\u7528\u4e3b\u4e1a\u65f6\u95f4\u201d\u7684\u517c\u804c\u6765\u5efa\u7acb\u7ecf\u6d4e\u5b89\u5168\u57ab\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u4e0e\u8def\u5f84\u611f**\u3002\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u9884\u671f\u7684\u53d8\u73b0\u8def\u5f84\u56fe\uff0c\u5e76\u4e0d\u65ad\u7528\u201c\u5b98\u65b9\u201d\u3001\u201c\u5408\u4f5c\u201d\u3001\u201c\u540c\u4e8b\u201d\u7b49\u8bcd\u6c47\u5f3a\u5316\u5176\u201c\u5373\u5c06\u83b7\u5f97\u7a33\u5b9a\u517c\u804c\u6536\u5165\u201d\u7684\u8eab\u4efd\u8ba4\u540c\u548c\u5b89\u5168\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u8bba** (\u4e25\u9632\u9884\u671f\u578b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5c5e\u53cd\u5bf9\u7684\u76f4\u63a5\u8bc1\u636e\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4e2d | \u82e5\u652f\u4ed8\u884c\u4e3a\u9690\u7792\u5bb6\u4eba\uff0c\u540e\u7eed\u5b66\u4e60\u65f6\u95f4\u6216\u7ecf\u6d4e\u538b\u529b\u53ef\u80fd\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4e2d | \u82e5\u517c\u804c\u53d8\u73b0\u5468\u671f\u8fdc\u8d85\u5176\u9884\u671f\uff08\u5982\u627f\u8bfa\u201c\u7b2c\u4e8c\u5468\u63a5\u5355\u201d\u4f46\u5b9e\u9645\u65e0\u679c\uff09\uff0c\u5176\u201c\u641e\u94b1\u201d\u52a8\u673a\u65e0\u6cd5\u6ee1\u8db3\uff0c\u6781\u6613\u56e0\u201c\u6536\u76ca\u843d\u5dee\u201d\u800c\u5d29\u76d8\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u7528\u6237\u670d\u4ece\u6027\u9ad8\uff0c\u60c5\u7eea\u76f8\u5bf9\u7a33\u5b9a\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u632b\u6298\u800c\u76f4\u63a5\u653e\u5f03\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669\uff01** \u7528\u6237\u4e3a\u201c\u5206\u6210\u4e66\u201d\u548c\u5feb\u901f\u517c\u804c\u800c\u6765\u3002\u82e5\u5f00\u8425\u540e\u63a5\u5355\u8def\u5f84\u4e0d\u6e05\u6670\u3001\u7b2c\u4e00\u5355\u6536\u5165\u8fdc\u4f4e\u4e8e\u9884\u671f\u6216\u5468\u671f\u8fc7\u957f\uff0c\u5c06\u76f4\u63a5\u89e6\u53d1\u5176\u6838\u5fc3\u7126\u8651\uff0c\u5bfc\u81f4\u5f3a\u70c8\u9000\u8d39\u610f\u613f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\u3002\u6b64\u65f6\u201c\u7b2c\u4e8c\u5468\u5f00\u901a\u63a5\u4e66\u6743\u9650\u201d\u7684\u627f\u8bfa\u82e5\u672a\u5151\u73b0\uff0c\u6216\u63a5\u5355\u5c1d\u8bd5\u5c61\u6b21\u5931\u8d25\uff0c\u7528\u6237\u5c06\u8fc5\u901f\u4ece\u201c\u671f\u5f85\u201d\u8f6c\u4e3a\u201c\u5931\u671b\u201d\uff0c\u9000\u8d39\u98ce\u9669\u6025\u5267\u5347\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u828b\u6ce5\u68d2\u69cc\u540c\u5b66\u4f60\u597d\uff01\u606d\u559c\u901a\u5173\uff01\u770b\u5230\u4f60\u9009\u4e86\u8fd9\u4e48\u591a\u6709\u610f\u601d\u7684\u4e66\uff0c\u80fd\u611f\u89c9\u5230\u4f60\u5bf9\u6709\u58f0\u53d8\u73b0\u662f\u8ba4\u771f\u89c4\u5212\u7684\u3002\u54b1\u4eec\u8fd9\u4e2a\u9ad8\u9636\u73ed\uff0c\u6838\u5fc3\u76ee\u6807\u5c31\u662f\u5e2e\u4f60\u628a\u2018\u5174\u8da3\u2019\u53d8\u6210\u2018\u6536\u5165\u2019\u3002\u63a5\u4e0b\u6765\u6211\u4f1a\u7ed9\u4f60\u4e00\u4efd\u6e05\u6670\u7684\u2018\u65b0\u624b\u63a5\u5355\u8def\u5f84\u56fe\u2019\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u7a33\u624e\u7a33\u6253\u5730\u628a\u7b2c\u4e00\u5355\u62ff\u5230\u624b\u3002\u8fc7\u7a0b\u4e2d\u6709\u4efb\u4f55\u5173\u4e8e\u63a5\u5355\u7684\u7591\u95ee\uff0c\u968f\u65f6\u627e\u6211\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5feb\u901f\u63a5\u5355\u7ebf**\u3011\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T4\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a\u3010**\u7cbe\u786e\u6d3e\u5355\u62e6\u622a\u5305\uff08B\u6a21\u5757\uff09**\u3011\u4e0e\u3010**\u9006\u5411\u9884\u671f\u7ba1\u7406\u9632\u5fa1\u5305**\u3011\u3002\u5fc5\u987b\u4e25\u63a7\u5176\u66b4\u5bcc\u5e7b\u60f3\uff0c\u7528\u771f\u5b9e\u6848\u4f8b\u548c\u6570\u636e\u7ba1\u7406\u5176\u9884\u671f\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a**\u7edd\u4e0d\u5bf9T4\u7528\u6237\u8fc7\u5ea6\u63cf\u7ed8\u201c\u8f7b\u677e\u6708\u5165\u8fc7\u4e07\u201d\u7684\u84dd\u56fe\uff1b\u7981\u6b62\u5728\u5176\u672a\u638c\u63e1\u57fa\u7840\u6280\u80fd\u524d\uff0c\u7528\u201c\u9ad8\u989d\u5206\u6210\u4e66\u201d\u6301\u7eed\u523a\u6fc0\u5176\u6b32\u671b\uff1b\u907f\u514d\u4f7f\u7528\u201c\u4f5b\u7cfb\u201d\u3001\u201c\u6162\u6162\u6765\u201d\u7b49\u6d88\u89e3\u5176\u7d27\u8feb\u611f\u7684\u8bdd\u672f\u3002**\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u5728\u6210\u529f\u63a5\u5230\u7b2c\u4e00\u5355\u5e76\u5b8c\u6210\u4ea4\u4ed8\u524d\uff0c\u4e25\u7981\u4efb\u4f55\u5f62\u5f0f\u7684\u5347\u5355\u6216\u4ea4\u53c9\u9500\u552e\uff08\u5982\u8bbe\u5907\u3001\u9ad8\u9636\u540e\u671f\u8bfe\uff09\u3002**\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5206\u6210\u4e66\u5427\u201d \u2014\u2014 **\u52a8\u673a\u7eaf\u5ea6\u7684\u76f4\u63a5\u8bc1\u636e\uff0c\u76ee\u6807\u660e\u786e\u6307\u5411\u53d8\u73b0\u3002**\n2. > \u201c\u786e\u5b9e\u662f\u60f3\u5f53\u4e2a\u517c\u804c\u6765\u505a\u7684\u201d \u2014\u2014 **\u518d\u6b21\u786e\u8ba4\u5176\u641e\u94b1\u52a8\u673a\uff0c\u800c\u975e\u5174\u8da3\u6216\u81ea\u6211\u5b9e\u73b0\u3002**\n3. > \u201c\u597d\u6709\u6210\u5c31\u611f\u201d \u2014\u2014 **\u5bf9\u7b80\u5355\u6280\u80fd\uff08\u753b\u672c\uff09\u7684\u79ef\u6781\u53cd\u9988\uff0c\u663e\u793a\u5176\u9700\u8981\u5373\u65f6\u6b63\u53cd\u9988\u6765\u7ef4\u6301\u5b66\u4e60\u52a8\u529b\uff0c\u5fc3\u7406\u5f39\u6027\u4e2d\u7b49\uff0c\u4f9d\u8d56\u5916\u90e8\u6fc0\u52b1\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4 \u641e\u94b1\u7ed3\u679c\u8bba\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7ecf\u6d4e\u5b89\u5168\u57ab\uff08\u9a6c\u65af\u6d1b\u7b2c\u4e8c\u5c42\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u4e25\u683c\u6267\u884c\u9006\u5411\u9884\u671f\u7ba1\u7406\uff0c\u7528\u6e05\u6670\u3001\u771f\u5b9e\u7684\u63a5\u5355\u8def\u5f84\u56fe\u66ff\u4ee3\u865a\u5e7b\u66b4\u5bcc\u627f\u8bfa\uff0c\u5e76\u5728\u5176\u63a5\u5230\u7b2c\u4e00\u5355\u524d\u4e25\u9632\u4efb\u4f55\u5347\u5355\u52a8\u4f5c\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u8bba\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
