    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677164921\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677164921 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u7490\u5996\u6709\u58f0(\u5f90\u7490) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66/\u914d\u97f3\u8bfe\u7a0b\uff08\u6500\u767b\u8ba1\u5212\uff09\uff0c\u4ef7\u683c2380\u5143 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u5168\u6b3e\u5145\u88d5**\uff08\u4e3b\u52a8\u63d0\u51fa\u5206\u671f\u88ab\u62d2\u540e\uff0c\u9009\u62e9\u5168\u6b3e\u652f\u4ed8\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u53ef\u6309\u65f6\u53c2\u4e0e\u76f4\u64ad\u3001\u5b8c\u6210\u4f5c\u4e1a\uff0c\u4f46\u672a\u63d0\u53ca\u5177\u4f53\u804c\u4e1a\u6216\u65f6\u95f4\u5b89\u6392\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\uff08\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u5b66\u4e60\u4e92\u52a8\u3001\u652f\u4ed8\u884c\u4e3a\u3001\u672a\u6765\u89c4\u5212\u5747\u6709\u660e\u786e\u8868\u8fbe\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u2b06\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u5173\u6ce8\u6280\u80fd\u63d0\u5347\u4e0e\u884c\u4e1a\u89c4\u5212\uff0c\u53d8\u73b0\u8bc9\u6c42\u7406\u6027\u4e14\u4e0e\u5b66\u4e60\u8fdb\u7a0b\u7ed1\u5b9a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u4ee5\u76ee\u524d\u6211\u7684\u6c34\u51c6\u548c\u65f6\u95f4\uff0c\u6211\u5bf9\u6709\u58f0\u5f55\u5236\uff0c\u7edf\u7b79\uff0c\u4ee5\u53ca\u540e\u671f\u6bd4\u8f83\u611f\u5174\u8da3\u201d\n  > \u201c\u6211\u4f1a\u7ee7\u7eed\u5b66\u4e60\u4e00\u76f4\u52aa\u529b\u7684\u201d\n  > \u5bf9\u201c\u5feb\u901f\u6323\u5230\u7b2c\u4e00\u6876\u91d1\u201d\u7684\u76f4\u64ad\u8bfe\u79ef\u6781\u54cd\u5e94\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u6025\u529f\u8fd1\u5229\u7684\u201c\u51e0\u5929\u5185\u53d8\u73b0\u201d\u7126\u8651\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u652f\u4ed82380\u5143\u8bfe\u7a0b\uff0c\u4f46\u66fe\u5c1d\u8bd5\u5206\u671f\uff0c\u8868\u660e\u8d44\u91d1\u975e\u6781\u5ea6\u5bbd\u88d5\uff0c\u4f46\u5177\u5907\u57fa\u672c\u652f\u4ed8\u80fd\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u8ddf\u4e0a\u6bcf\u65e5\u5b66\u4e60\u4efb\u52a1\uff08\u6668\u7ec3\u3001\u542c\u8bfe\u3001\u4ea4\u4f5c\u4e1a\u3001\u53c2\u4e0ePia\u620f\uff09\uff0c\u5b66\u4e60\u72b6\u6001\u7a33\u5b9a\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u5168\u5929\u5019\u81ea\u7531\u65f6\u95f4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u672a\u77e5** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff0c\u65e0\u6cd5\u5224\u65ad\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u8be6\u7ec6\u3001\u5177\u4f53\u7684\u4f5c\u4e1a\u70b9\u8bc4\uff08\u5982\u8bed\u6c14\u3001\u60c5\u7eea\u63a7\u5236\uff09\uff0c\u80fd\u79ef\u6781\u63a5\u53d7\u5e76\u7acb\u523b\u5b9e\u8df5\u6539\u8fdb\uff08\u201c\u597d\u7684\u6211\u4f1a\u6ce8\u610f\u8bed\u6c14\u4e0e\u60c5\u7eea\u7684\u63a7\u5236\u201d\u3001\u201c\u662f\u7684\uff0c\u6839\u636e\u60a8\u7684\u6807\u6ce8\u70b9\u6a21\u4eff\u4e86\u4e00\u904d\u201d\uff09\uff0c\u8868\u73b0\u51fa\u6781\u5f3a\u7684\u5b66\u4e60\u97e7\u6027\u548c\u6267\u884c\u529b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u597d\u7684\u6211\u4f1a\u6ce8\u610f\u8bed\u6c14\u4e0e\u60c5\u7eea\u7684\u63a7\u5236\u201d\n  > \u201c\u662f\u7684\uff0c\u6839\u636e\u60a8\u7684\u6807\u6ce8\u70b9\u6a21\u4eff\u4e86\u4e00\u904d\u201d\n  > \u5168\u7a0b\u6c9f\u901a\u793c\u8c8c\u3001\u79ef\u6781\uff0c\u65e0\u4efb\u4f55\u8d1f\u9762\u60c5\u7eea\u6216\u81ea\u6211\u6000\u7591\u7684\u8868\u8fbe\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 & \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u8fdb\u5165\u65b0\u9886\u57df\uff08\u6709\u58f0\u884c\u4e1a\uff09\u7684\u8def\u5f84\u4e0d\u6e05\u6670\uff0c\u6e34\u671b\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u548c\u660e\u786e\u7684\u6210\u957f\u9636\u68af\uff0c\u4ee5\u5b9e\u73b0\u4e2a\u4eba\u4ef7\u503c\uff08\u201c\u5411\u5e08\u59d0\u5b66\u4e60\u7684\u201d\u3001\u201c\u6211\u4f1a\u4e0d\u65ad\u63d0\u5347\u81ea\u5df1\u7684\u6c34\u5e73\u201d\uff09\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u201c\u88ab\u9009\u4e2d\u201d\u7684\u7cbe\u82f1\u611f**\u3002\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u6211\u770b\u597d\u7684\u4eba\u4e0d\u591a\uff0c\u4f60\u662f\u5176\u4e2d\u4e00\u4e2a\u201d\u3001\u201c\u7ed9\u4f60\u6311\u4e86\u4e00\u672c\u7248\u6743\u4e66\u201d\uff0c\u8fd9\u79cd\u201c\u7279\u6b8a\u5173\u7167\u201d\u548c\u201c\u6f5c\u529b\u8ba4\u53ef\u201d\u6781\u5927\u5730\u6ee1\u8db3\u4e86\u4ed6\u7684\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b**\uff08\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b\uff09 |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b**\uff08\u9ad8\u52a8\u673a\u3001\u9ad8\u5f39\u6027\u3001\u5f3a\u6267\u884c\u529b\uff0c\u662f\u73ed\u7ea7\u7684\u7a33\u5b9a\u57fa\u77f3\uff09 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u7edd\u5883\u3001\u6781\u7aef\u5a01\u80c1\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u652f\u4ed8\u884c\u4e3a\u679c\u65ad\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u5b66\u4e60\u72b6\u6001\u7a33\u5b9a\uff0c\u6267\u884c\u529b\u5f3a\uff0c\u6309\u65f6\u5b8c\u6210\u4efb\u52a1\uff0c\u5d29\u76d8\u98ce\u9669\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u79ef\u6781\u63a5\u53d7\u53cd\u9988\u5e76\u6539\u8fdb\uff0c\u65e0\u81ea\u5351\u6216\u4f9d\u8d56\u4fe1\u53f7\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u82e5\u5728\u6295\u5165\u5b66\u4e60\u540e\uff08\u59821-2\u4e2a\u6708\uff09\u63a5\u5355\u673a\u4f1a\u8fdc\u4f4e\u4e8e\u9884\u671f\uff08\u9500\u552e\u63d0\u53ca\u201c\u65b0\u624b\u4e66\u201d\u3001\u201c\u65f6\u85aa90-500\u201d\uff09\uff0c\u53ef\u80fd\u56e0\u73b0\u5b9e\u4e0e\u627f\u8bfa\u843d\u5dee\u800c\u4ea7\u751f\u8d28\u7591\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe\u540e\u7684**\u7b2c4-8\u5468**\uff0c\u5f53\u6280\u80fd\u5b66\u4e60\u8fdb\u5165\u5e73\u53f0\u671f\uff0c\u800c\u53d8\u73b0\u8def\u5f84\u4ecd\u672a\u6e05\u6670\u6216\u63a5\u5355\u53d7\u632b\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u9a6c\u4e01\uff0c\u770b\u5230\u4f60\u5728\u4f53\u9a8c\u8425\u7684\u8868\u73b0\uff0c\u6267\u884c\u529b\u5f3a\u3001\u609f\u6027\u9ad8\uff0c\u662f\u73ed\u91cc\u96be\u5f97\u7684\u2018\u79cd\u5b50\u9009\u624b\u2019\u3002\u6b63\u5f0f\u8bfe\u8282\u594f\u4f1a\u66f4\u5feb\uff0c\u6311\u6218\u4e5f\u66f4\u5927\uff0c\u4f46\u6211\u76f8\u4fe1\u4ee5\u4f60\u7684\u97e7\u52b2\u5b8c\u5168\u80fd\u8ddf\u4e0a\u3002\u4ee5\u540e\u6709\u4efb\u4f55\u6280\u672f\u96be\u9898\u6216\u5bf9\u884c\u4e1a\u6709\u7591\u60d1\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4eec\u4e00\u8d77\u653b\u514b\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176\u9ad8\u52a8\u673a\u548c\u9ad8\u6267\u884c\u529b\uff0c\u63d0\u4f9b\u7cfb\u7edf\u3001\u6709\u6df1\u5ea6\u7684\u6280\u80fd\u57f9\u8bad\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T2\u8001\u9ec4\u725b\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145**\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011**\uff08B\u6a21\u5757\uff09\u548c**\u3010\u5b9e\u6218\u6d3e\u5355\u673a\u4f1a\u3011**\u3002\u53ef\u9010\u6b65\u8d4b\u4e88\u5176**\u3010\u5c0f\u7ec4\u957f/\u4f5c\u4e1a\u70b9\u8bc4\u5b98\u3011**\u7b49\u8eab\u4efd\uff08D\u6a21\u5757\uff09\uff0c\u6fc0\u53d1\u5176\u6f5c\u5728\u9886\u5bfc\u529b\uff0c\u5411\u6df7\u5408\u4f533\u53f7\uff08\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b\uff09\u8fdb\u5316\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u80a4\u6d45\u7684\u5938\u5956\u6577\u884d\u4ed6\u3002\u4ed6\u7684\u8fdb\u6b65\u9700\u8981\u5177\u4f53\u3001\u4e13\u4e1a\u7684\u70b9\u8bc4\u3002\u7981\u6b62\u7528\u5bf9\u5f85T6\u60c5\u7eea\u5de8\u5a74\u7684\u201c\u65e0\u8111\u5938\u201d\u65b9\u5f0f\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5f53\u4ed6\u5728\u6280\u672f\u4e0a\u53d6\u5f97\u660e\u663e\u7a81\u7834\uff08\u5982\u6210\u529f\u63a5\u5355\u6216\u4f5c\u54c1\u8d28\u91cf\u663e\u8457\u63d0\u5347\uff09\u65f6\uff0c\u53ef\u4ee5\u987a\u52bf\u63a8\u8350\u9ad8\u9636\u8bfe\u7a0b\uff08\u5982\u540e\u671f\u5236\u4f5c\u3001\u9ad8\u7ea7\u914d\u97f3\u6280\u5de7\uff09\uff0c\u56e0\u4e3a\u4ed6\u8ffd\u6c42\u7684\u662f\u80fd\u529b\u7cbe\u8fdb\u548c\u81ea\u6211\u5b9e\u73b0\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > **\u201c\u4ee5\u76ee\u524d\u6211\u7684\u6c34\u51c6\u548c\u65f6\u95f4\uff0c\u6211\u5bf9\u6709\u58f0\u5f55\u5236\uff0c\u7edf\u7b79\uff0c\u4ee5\u53ca\u540e\u671f\u6bd4\u8f83\u611f\u5174\u8da3\u201d** \u2014\u2014 \u6e05\u6670\u3001\u7406\u6027\u7684\u804c\u4e1a\u89c4\u5212\uff0c\u52a8\u673a\u7eaf\u5ea6\u9ad8\u3002\n2. > **\u201c\u662f\u7684\uff0c\u6839\u636e\u60a8\u7684\u6807\u6ce8\u70b9\u6a21\u4eff\u4e86\u4e00\u904d\u201d** \u2014\u2014 \u6781\u5f3a\u7684\u6267\u884c\u529b\u548c\u5b66\u4e60\u97e7\u6027\uff0c\u5fc3\u7406\u5f39\u6027\u9ad8\u7684\u76f4\u63a5\u4f53\u73b0\u3002\n3. > **\u201c\u6211\u4f1a\u7ee7\u7eed\u5b66\u4e60\u4e00\u76f4\u52aa\u529b\u7684\u201d** \u2014\u2014 \u7a33\u5b9a\u7684\u5b66\u4e60\u627f\u8bfa\u548c\u5185\u9a71\u529b\uff0c\u662fT2\u8001\u9ec4\u725b\u7684\u5178\u578b\u7279\u5f81\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u660e\u786e\u7684\u6210\u957f\u8def\u5f84\uff0c\u5b9e\u73b0\u81ea\u6211\u4ef7\u503c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6301\u7eed\u3001\u6709\u6311\u6218\u6027\u7684\u4e13\u4e1a\u4efb\u52a1\uff08B\u6a21\u5757\uff09\uff0c\u5e76\u5728\u9002\u5f53\u65f6\u673a\u8d4b\u4e88\u7ba1\u7406\u6743\u9650\uff08D\u6a21\u5757\uff09\uff0c\u5c06\u5176\u8f6c\u5316\u4e3a\u73ed\u7ea7\u751f\u6001\u7684\u5efa\u8bbe\u8005\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
