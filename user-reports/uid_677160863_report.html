    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | Lucky.girl\u9b4f\u5bdc (UID: 677160863) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u83ab\u8bed9/\u9648\u9648(\u5218\u6587\u4e1c) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u4e3b\u64ad\u8bad\u7ec3\u8425 (3980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u7528\u6237\u76f4\u63a5\u652f\u4ed83980\u5143\uff0c\u672a\u63d0\u53ca\u8d44\u91d1\u6765\u6e90\u3002\u9700\u8b66\u60d5\u201c\u5f71\u89c6\u6f14\u5458\u201d\u804c\u4e1a\u6536\u5165\u4e0d\u7a33\u5b9a\uff0c\u53ef\u80fd\u5b58\u5728\u4fe1\u7528\u5361\u5468\u8f6c\u6216\u501f\u8d37\u98ce\u9669\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u804c\u4e1a\u4e3a\u5f71\u89c6\u6f14\u5458\uff0c\u4e0d\u62cd\u620f\u65f6\u6bcf\u5929\u670916\u5c0f\u65f6\uff0c\u62cd\u620f\u65f6\u4ec5\u67092\u5c0f\u65f6\uff0c\u4e14\u9891\u7e41\u51fa\u5dee\u8d76\u98de\u673a\uff0c\u65f6\u95f4\u9ad8\u5ea6\u4e0d\u89c4\u5f8b\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u4fe1\u606f\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u7528\u6237\u63d0\u4f9b\u4e86\u8be6\u7ec6\u7684\u4e2a\u4eba\u4fe1\u606f\u3001\u5b66\u4e60\u52a8\u673a\u548c\u804c\u4e1a\u80cc\u666f\uff0c\u4e92\u52a8\u79ef\u6781\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u5174\u8da3\u4e0e\u53d8\u73b0\u76ee\u7684\u6df7\u6742\uff0c\u5bf9\u53d8\u73b0\u6e20\u9053\u6709\u660e\u786e\u5173\u6ce8\uff0c\u4f46\u540c\u65f6\u4e5f\u8868\u73b0\u51fa\u5bf9\u4e13\u4e1a\u6280\u5de7\u7684\u5b66\u4e60\u70ed\u60c5\u548c\u8ba4\u771f\u6001\u5ea6\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u7c73\u548c\u5174\u8da3\u90fd\u6709\u201d\uff1b > \u201c\u8001\u5e08\u6211\u60f3\u95ee\u54b1\u4eec\u8fd9\u4e2a\u662f\u4e0a\u5b8c\u4e09\u5929\u8bfe\uff0c\u559c\u9a6c\u62c9\u96c5\u7ed9\u5f00\u901a\u8fd9\u4e2a\u4e3b\u6301\u5f55\u4e66\u6743\u9650\u5417\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u76f4\u63a5\u652f\u4ed83980\u5143\uff0c\u4f46\u6f14\u5458\u804c\u4e1a\u6536\u5165\u4e0d\u7a33\u5b9a\uff0c\u5b58\u5728\u6f5c\u5728\u8d22\u52a1\u98ce\u9669\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u4e0d\u62cd\u620f\u65f6\u65f6\u95f4\u5145\u88d5\uff0c\u4f46\u62cd\u620f\u65f6\u4ec52\u5c0f\u65f6\uff0c\u4e14\u9891\u7e41\u51fa\u5dee\uff0c\u5b66\u4e60\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\u4e14\u4e0d\u7a33\u5b9a\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e** \u2014 \u672a\u63d0\u53ca\uff0c\u9700\u4f5c\u4e3a\u9ad8\u98ce\u9669\u9879\u76d1\u63a7\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u5982\u8bd5\u97f3\u5355\u8981\u6c42\uff09\u4f1a\u4e3b\u52a8\u63d0\u95ee\uff0c\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\u3002\u5bf9\u4f5c\u4e1a\u8d28\u91cf\u6709\u81ea\u6211\u8981\u6c42\uff0c\u4f1a\u4e3b\u52a8\u91cd\u5f55\u4f18\u5316\uff0c\u800c\u975e\u62b1\u6028\u6216\u653e\u5f03\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u60f3\u518d\u91cd\u65b0\u5f55\u4e00\u904d\u201d\uff1b > \u201c\u6211\u8ba9\u6211\u670b\u53cb\u5e2e\u6211\u542c\u542c\u201d\uff1b > \u201c\u5269\u4e0b\u7684\u6211\u660e\u5929\u7ed9\u60a8\u8bd5\u620f\u5427[\u51b7\u6c57]\u592a\u7d2f\u4e86\u4eca\u5929\u201d (\u75b2\u60eb\u540e\u9009\u62e9\u8c03\u6574\uff0c\u800c\u975e\u653e\u5f03)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 (\u8ffd\u6c42\u6210\u5c31\u3001\u8ba4\u53ef\u3001\u4e13\u4e1a\u8eab\u4efd)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u4f5c\u4e3a\u5f71\u89c6\u6f14\u5458\uff0c\u5bfb\u6c42\u804c\u4e1a\u7684\u591a\u5143\u53d1\u5c55\u548c\u4e13\u4e1a\u8eab\u4efd\u7684\u8ba4\u53ef\u3002\u5979\u9700\u8981\u5c06\u201c\u6f14\u5458\u201d\u7684\u6280\u80fd\uff08\u8868\u6f14\u3001\u53f0\u8bcd\uff09\u8f6c\u5316\u4e3a\u6709\u58f0\u9886\u57df\u7684\u201c\u4e13\u4e1a\u4e3b\u64ad\u201d\u8eab\u4efd\uff0c\u5e76\u83b7\u5f97\u884c\u4e1a\u5185\u7684\u80af\u5b9a\u548c\u8d44\u6e90\uff0c\u4ee5\u5bf9\u6297\u6f14\u827a\u884c\u4e1a\u7684\u4e0d\u7a33\u5b9a\u6027\uff0c\u5efa\u7acb\u804c\u4e1a\u81ea\u4fe1\u548c\u65b0\u7684\u793e\u4f1a\u6807\u7b7e\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u8eab\u4efd\u7684\u201c\u8ba4\u8bc1\u201d\u4e0e\u5708\u5c42\u5f52\u5c5e\u611f**\u3002\u63d0\u4f9b\u201c\u5019\u9009\u4eba\u624d\u201d\u3001\u201c\u8fdb\u5165\u5267\u7ec4\u7fa4\u201d\u3001\u201c\u4e0e\u5e08\u59d0\u5e76\u80a9\u4f5c\u6218\u201d\u7b49\u8c61\u5f81\u4e13\u4e1a\u8ba4\u53ef\u548c\u5708\u5c42\u51c6\u5165\u7684\u627f\u8bfa\uff0c\u8fdc\u6bd4\u5355\u7eaf\u753b\u6536\u5165\u5927\u997c\u66f4\u6709\u6548\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u52a8\u673a\u4e2d\u7b49\uff0c\u8d44\u6e90\u4e2d\u7b49\uff0c\u5f39\u6027\u9ad8\uff0c\u6709\u660e\u786e\u804c\u4e1a\u80cc\u666f\u548c\u6280\u80fd\u8fc1\u79fb\u6f5c\u529b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u5177\u5907\u4e13\u4e1a\u6280\u80fd\u57fa\u7840\uff0c\u8ba4\u771f\u5b8c\u6210\u4f5c\u4e1a\uff0c\u5173\u6ce8\u5b9e\u64cd\u548c\u6743\u9650\uff0c\u8ffd\u6c42\u901a\u8fc7\u52aa\u529b\u83b7\u5f97\u8ba4\u53ef\u548c\u8d44\u6e90\uff0c\u800c\u975e\u5355\u7eaf\u5bfb\u6c42\u60c5\u7eea\u5b89\u6170\u6216\u901f\u6210\u53d8\u73b0) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u4fe1\u606f\u7f3a\u5931\u9879\u3002\u82e5\u62a5\u540d\u8d39\u7528\u672a\u4e0e\u5bb6\u4eba\u6c9f\u901a\u6216\u906d\u53cd\u5bf9\uff0c\u98ce\u9669\u9aa4\u589e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u6f14\u5458\u62cd\u620f\u6216\u51fa\u5dee\u671f\u95f4\uff0c\u5b8c\u5168\u65e0\u6cd5\u8ddf\u4e0a\u76f4\u64ad\u3001\u4f5c\u4e1a\u8282\u594f\uff0c\u4ea7\u751f\u201c\u6389\u961f\u201d\u7684\u7126\u8651\u548c\u632b\u8d25\u611f\uff0c\u6700\u7ec8\u56e0\u8fdb\u5ea6\u843d\u540e\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u4e0d\u6613\u56e0\u6b64\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u5bf9\u201c\u5f00\u901a\u6743\u9650\u201d\u3001\u201c\u8fdb\u5165\u5267\u7ec4\u201d\u6709\u660e\u786e\u671f\u5f85\u3002\u82e5\u6b63\u5f0f\u8bfe\u7a0b\u540e\uff0c\u53d1\u73b0\u63a5\u5355\u8d44\u6e90\u3001\u6743\u9650\u5f00\u901a\u4e0e\u9884\u671f\u6709\u8f83\u5927\u5ef6\u8fdf\u6216\u843d\u5dee\uff0c\u53ef\u80fd\u4ea7\u751f\u8d28\u7591\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u6b63\u5f0f\u5f00\u8bfe\u540e2-4\u5468**\u3002\u5f53\u9ad8\u5f3a\u5ea6\u3001\u56fa\u5b9a\u8282\u594f\u7684\u8bfe\u7a0b\u4e0e\u5979\u4e0d\u53ef\u63a7\u7684\u62cd\u620f/\u51fa\u5dee\u65e5\u7a0b\u4ea7\u751f\u4e25\u91cd\u51b2\u7a81\uff0c\u4e14\u9996\u6279\u201c\u8d44\u6e90\u627f\u8bfa\u201d\u672a\u80fd\u5373\u65f6\u5151\u73b0\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u9b4f\u5bdc\uff0c\u770b\u5230\u4f60\u7684\u6f14\u5458\u80cc\u666f\u548c\u4f5c\u54c1\uff0c\u771f\u7684\u89c9\u5f97\u4f60\u662f\u6709\u58f0\u884c\u4e1a\u7684\u2018\u5929\u8d4b\u578b\u9009\u624b\u2019\u3002\u54b1\u4eec\u8fd9\u4e2a\u5708\u5b50\uff0c\u6700\u7f3a\u7684\u5c31\u662f\u6709\u8868\u6f14\u529f\u5e95\u548c\u89d2\u8272\u5851\u9020\u80fd\u529b\u7684\u4eba\u3002\u6211\u77e5\u9053\u4f60\u65f6\u95f4\u4e0d\u89c4\u5f8b\uff0c\u522b\u62c5\u5fc3\uff0c\u54b1\u4eec\u7684\u8bfe\u7a0b\u548c\u4f5c\u4e1a\u673a\u5236\u5c31\u662f\u4e3a\u50cf\u4f60\u8fd9\u6837\u5fd9\u788c\u7684\u4e13\u4e1a\u4eba\u58eb\u8bbe\u8ba1\u7684\u3002\u4f60\u7684\u6838\u5fc3\u76ee\u6807\u4e0d\u662f\u8d76\u4f5c\u4e1a\uff0c\u800c\u662f\u628a\u6bcf\u4e00\u6b21\u7ec3\u4e60\u90fd\u5f53\u6210\u4e00\u4e2a\u2018\u5c0f\u89d2\u8272\u2019\uff0c\u6211\u4f1a\u6839\u636e\u4f60\u7684\u65f6\u95f4\uff0c\u5e2e\u4f60\u89c4\u5212\u6700\u6709\u6548\u7684\u8fdb\u9636\u8def\u5f84\uff0c\u786e\u4fdd\u4f60\u6bcf\u4e00\u6b65\u90fd\u8e29\u5728\u2018\u4e13\u4e1a\u8ba4\u8bc1\u2019\u548c\u2018\u8d44\u6e90\u5bf9\u63a5\u2019\u7684\u5173\u952e\u70b9\u4e0a\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u91cd\u70b9\u5bf9\u63a5B\u6a21\u5757\uff08\u786c\u6838\u624b\u827a\u6c60\uff09\uff0c\u59821v1\u9488\u5bf9\u6027\u7684\u620f\u611f\u3001\u89d2\u8272\u97f3\u6307\u5bfc\uff0c\u4ee5\u53ca\u771f\u5b9e\u3001\u5339\u914d\u5176\u58f0\u97f3\u7279\u8d28\u7684\u8bd5\u97f3\u5355\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u4e0d\u7a33\u5b9a\u7684\u7279\u70b9\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u5f02\u6b65\u5b66\u4e60\u652f\u6301\u5305\u3011**\uff08\u5982\u6240\u6709\u76f4\u64ad\u63d0\u4f9b\u5b8c\u6574\u5f55\u64ad+\u91cd\u70b9\u6458\u8981\uff09\uff0c\u5e76\u914d\u7f6e **\u3010\u5f39\u6027\u4f5c\u4e1a\u673a\u5236\u3011**\uff08\u5141\u8bb8\u5728\u51fa\u5dee/\u62cd\u620f\u671f\u95f4\u7533\u8bf7\u5ef6\u671f\uff0c\u4f46\u9700\u8865\u4ea4\uff09\u3002\u540c\u65f6\uff0c\u53ef\u8f7b\u91cf\u6302\u8f7dD\u6a21\u5757\uff08\u8eab\u4efd\u5149\u73af\u6c60\uff09\uff0c\u5982\u8d4b\u4e88\u201c\u6f5c\u529b\u4e3b\u64ad\u201d\u79f0\u53f7\uff0c\u9080\u8bf7\u53c2\u4e0e\u5185\u90e8\u4f18\u79c0\u4f5c\u54c1\u8d4f\u6790\u4f1a\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u50f5\u5316\u7684\u8003\u52e4\u548c\u4f5c\u4e1a\u622a\u6b62\u65e5\u671f\u65bd\u538b\u3002\u4e0d\u8981\u5c06\u5979\u4e0e\u65f6\u95f4\u5145\u88d5\u7684\u5b66\u5458\u8fdb\u884c\u8fdb\u5ea6\u6bd4\u8f83\u3002**\u7edd\u4e0d\u5bf9\u5979\u7a7a\u8c08\u201c\u575a\u6301\u5c31\u80fd\u66b4\u5bcc\u201d\u7684\u865a\u5984\u9884\u671f**\uff0c\u8981\u8c08\u201c\u5982\u4f55\u5229\u7528\u4f60\u7684\u8868\u6f14\u4f18\u52bf\uff0c\u5728XX\u7c7b\u4f5c\u54c1\u4e2d\u5feb\u901f\u5efa\u7acb\u8fa8\u8bc6\u5ea6\u201d\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u5fc5\u987b\u4e0e\u201c\u8d44\u6e90\u6df1\u5ea6\u7ed1\u5b9a\u201d**\u3002\u5347\u5355\u8bdd\u672f\u5e94\u56f4\u7ed5\u201c\u72ec\u5bb6\u7248\u6743\u4e66\u8d44\u6e90\u201d\u3001\u201c\u5b9a\u5411\u5267\u7ec4\u63a8\u8350\u201d\u3001\u201c\u9ad8\u7aef\u5546\u5355\u901a\u9053\u201d\u7b49\u80fd\u5f3a\u5316\u5176\u201c\u4e13\u4e1a\u8eab\u4efd\u201d\u548c\u201c\u8d44\u6e90\u5708\u5c42\u201d\u7684\u6743\u76ca\u5c55\u5f00\uff0c\u800c\u975e\u5355\u7eaf\u8d29\u5356\u66f4\u591a\u8bfe\u7a0b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u7c73\u548c\u5174\u8da3\u90fd\u6709\u201d\n2. > \u201c\u4e0d\u62cd\u620f\u7684\u8bdd\uff0c\u6bcf\u5929\u90fd\u670916\u4e2a\u5c0f\u65f6\uff0c\u62cd\u620f\u7684\u8bdd\uff0c\u6bcf\u5929\u4e5f\u67092\u4e2a\u5c0f\u65f6\u201d\n3. > \u201c\u6211\u60f3\u518d\u91cd\u65b0\u5f55\u4e00\u904d\u201d\uff1b\u201c\u6211\u8ba9\u6211\u670b\u53cb\u5e2e\u6211\u542c\u542c\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2\u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u4e13\u4e1a\u8eab\u4efd\u8ba4\u53ef\u4e0e\u7a33\u5b9a\u8d44\u6e90\u5708\u5c42**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u9ad8\u5ea6\u5f39\u6027\u3001\u8d44\u6e90\u5bfc\u5411\u7684\u5b66\u4e60\u8def\u5f84\uff0c\u5e76\u7528\u201c\u4e13\u4e1a\u8ba4\u8bc1\u201d\u548c\u201c\u5708\u5c42\u51c6\u5165\u201d\u66ff\u4ee3\u7a7a\u6d1e\u7684\u53d8\u73b0\u627f\u8bfa**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5f02\u6b65\u5b66\u4e60\u652f\u6301\u5305\"}\n```";
