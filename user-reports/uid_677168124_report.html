    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n## \u4fe1\u606f\u4e0d\u8db3\u58f0\u660e\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u7f3a\u5931\u5173\u952e\u7ef4\u5ea6\u4fe1\u606f\uff1a\u7528\u6237\u5e74\u9f84\u3001\u6027\u522b\u3001\u57ce\u5e02\u3001\u804c\u4e1a\u3001\u6536\u5165\u6c34\u5e73\u3001\u5bb6\u5ead\u72b6\u51b5\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u3001\u5177\u4f53\u652f\u4ed8\u80fd\u529b\u4e0e\u9884\u7b97\u3002\u7528\u6237\u53d1\u8a00\u6781\u5c11\uff0c\u591a\u4e3a\u88ab\u52a8\u56de\u5e94\uff0c\u5bfc\u81f4\u6df1\u5c42\u52a8\u673a\u4e0e\u8d44\u6e90\u5e95\u5ea7\u5224\u65ad\u4f9d\u636e\u8584\u5f31\u3002\n\n---\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n\n### \u52a8\u673a\u7eaf\u5ea6\n*   **\u8868\u5c42\u52a8\u673a**\uff1a\u660e\u786e\u8868\u8fbe\u201c\u60f3\u5b66\u201d\u3001\u201c\u771f\u5fc3\u60f3\u5b66\u201d\uff0c\u5bf9\u201c\u63d0\u793a\u8bcd\u201d\u3001\u201c\u5546\u5355\u201d\u3001\u201c\u77ed\u5267\u201d\u7b49\u5177\u4f53\u6280\u80fd\u548c\u53d8\u73b0\u8def\u5f84\u6709\u8ffd\u95ee\u3002\n*   **\u6df1\u5c42\u52a8\u673a**\uff1a**\u5f3a\u70c8\u7684\u526f\u4e1a/\u8d5a\u94b1\u9a71\u52a8**\u3002\u591a\u6b21\u8be2\u95ee\u201c\u6b63\u5f0f\u5b66\u5458\u591a\u5c11\u94b1\u201d\u3001\u201c\u5b66\u8d39\u8d35\u4e0d\u8d35\u201d\u3001\u201c\u5c31\u6015\u4ea4\u4e0d\u8d77\u201d\uff0c\u6838\u5fc3\u62c5\u5fe7\u662f\u201c\u6211\u4e3b\u8981\u6015\u63a5\u4e0d\u5230\u5355\u5b50 \u8d5a\u4e0d\u5230\u94b1\u201d\u3002\u5b66\u4e60\u662f\u624b\u6bb5\uff0c\u53d8\u73b0\u662f\u6838\u5fc3\u76ee\u7684\u3002\n*   **\u7eaf\u5ea6\u8bc4\u4f30**\uff1a**\u5de5\u5177\u578b\u52a8\u673a\u4e3b\u5bfc**\u3002\u5b66\u4e60AI\u6280\u80fd\u88ab\u89c6\u4e3a\u83b7\u53d6\u6536\u5165\u7684\u76f4\u63a5\u5de5\u5177\uff0c\u5bf9\u201c\u5de5\u4f5c\u5ba4\u201d\u3001\u201c\u6d3e\u5355\u201d\u3001\u201c\u7eff\u901a\u201d\u7b49\u8d44\u6e90\u6276\u6301\u8868\u73b0\u51fa\u5174\u8da3\u3002\u5185\u5728\u5174\u8da3\u6216\u957f\u671f\u804c\u4e1a\u89c4\u5212\u4fe1\u53f7\u5f31\u3002\n\n### \u8d44\u6e90\u5e95\u5ea7\n*   **\u7ecf\u6d4e\u8d44\u6e90**\uff1a**\u660e\u663e\u62ee\u636e\u4fe1\u53f7**\u3002\u76f4\u8a00\u201c\u5c31\u6015\u4ea4\u4e0d\u8d77\u201d\uff0c\u5bf9\u4ef7\u683c\u654f\u611f\u3002\u652f\u4ed8\u80fd\u529b\u5b58\u7591\uff0c\u5c5e\u4e8e\u4ef7\u683c\u654f\u611f\u578b\u7528\u6237\u3002\n*   **\u65f6\u95f4\u8d44\u6e90**\uff1a\u53ef\u8ddf\u8fdb\u665a\u95f4\u76f4\u64ad\u3001\u5b8c\u6210\u4f5c\u4e1a\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u53ef\u652f\u914d\u4e1a\u4f59\u65f6\u95f4\u3002\n*   **\u8ba4\u77e5/\u6280\u80fd\u8d44\u6e90**\uff1a\u96f6\u57fa\u7840\u8d77\u6b65\uff08\u9500\u552e\u8bdd\u672f\u63d0\u53ca\uff09\uff0c\u4f46\u80fd\u5b8c\u6210\u4f5c\u4e1a\u5e76\u63d0\u51fa\u201c\u5546\u5355\u7a3f\u5b50\u5f88\u96be\u8fc7\u5417\u201d\u7b49\u5b9e\u64cd\u6027\u95ee\u9898\uff0c\u5177\u5907\u57fa\u672c\u5b66\u4e60\u4e0e\u6267\u884c\u80fd\u529b\u3002\n*   **\u793e\u4f1a\u8d44\u6e90**\uff1a\u65e0\u76f8\u5173\u4fe1\u606f\u3002\u5bf9\u9500\u552e\u63d0\u53ca\u7684\u201c\u5de5\u4f5c\u5ba4\u8d44\u6e90\u201d\u6709\u671f\u5f85\uff0c\u8868\u660e\u5e0c\u671b\u501f\u52a9\u5916\u90e8\u8d44\u6e90\u5f25\u8865\u81ea\u8eab\u4e0d\u8db3\u3002\n\n### \u5fc3\u7406\u5f39\u6027\n*   **\u575a\u6301\u6027**\uff1a\u5c1a\u53ef\u3002\u80fd\u8ddf\u968f\u8bfe\u7a0b\u8282\u594f\uff0c\u56de\u590d\u201c\u597d\u7684\u201d\u3001\u201c\u660e\u767d\u201d\uff0c\u5e76\u5b8c\u6210\u4f5c\u4e1a\u3002\n*   **\u6297\u632b\u6027**\uff1a**\u8f83\u4f4e\uff0c\u5b58\u5728\u660e\u663e\u7126\u8651**\u3002\u5c1a\u672a\u5f00\u59cb\u6b63\u5f0f\u5b66\u4e60\u6216\u63a5\u5355\uff0c\u5df2\u63d0\u524d\u62c5\u5fe7\u201c\u63a5\u4e0d\u5230\u5355\u5b50\u201d\u3001\u201c\u8d5a\u4e0d\u5230\u94b1\u201d\u3001\u201c\u7a3f\u5b50\u5f88\u96be\u8fc7\u201d\uff0c\u8868\u73b0\u51fa\u5bf9\u7ed3\u679c\u4e0d\u786e\u5b9a\u6027\u7684\u9ad8\u5ea6\u5fe7\u8651\u548c\u98ce\u9669\u89c4\u907f\u503e\u5411\u3002\n*   **\u81ea\u4e3b\u6027**\uff1a\u8f83\u4f4e\u3002\u4e92\u52a8\u4ee5\u56de\u5e94\u9500\u552e\u4e3a\u4e3b\uff0c\u4e3b\u52a8\u63d0\u95ee\u8f83\u5c11\uff0c\u51b3\u7b56\u4f9d\u8d56\u5916\u90e8\u5f15\u5bfc\uff08\u5982\u8be2\u95ee\u4ef7\u683c\u3001\u53d8\u73b0\u53ef\u80fd\u6027\uff09\u3002\n\n---\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**\uff1a\u7528\u6237\u4e3b\u52a8\u8be2\u95ee\u4ef7\u683c\u5e76\u8868\u8fbe\u652f\u4ed8\u62c5\u5fe7\uff08\u201c\u5c31\u6015\u4ea4\u4e0d\u8d77\u201d\uff09\uff0c**\u652f\u4ed8\u610f\u613f\u4e0e\u652f\u4ed8\u80fd\u529b\u5b58\u5728\u4e25\u91cd\u9519\u914d\u98ce\u9669**\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u65e0\u76f8\u5173\u4fe1\u606f\u3002\u4ece\u5bf9\u8bdd\u8bed\u5883\u770b\uff0c\u51b3\u7b56\u53ef\u80fd\u4e3a\u4e2a\u4eba\u884c\u4e3a\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u4e0e\u8d44\u6e90**\uff1a\u52a8\u673a\u5f3a\uff08\u53d8\u73b0\u9a71\u52a8\uff09\uff0c\u4f46\u8d44\u6e90\u5e95\u5ea7\u8584\u5f31\uff08\u7ecf\u6d4e\u62ee\u636e\uff09\u3002**\u52a8\u673a\u4e0e\u8d44\u6e90\u4e0d\u5339\u914d**\u3002\n*   **\u6b65\u9aa42 - \u627f\u8bfa\u5ea6**\uff1a\u6709\u5b66\u4e60\u884c\u4e3a\uff08\u8ddf\u8bfe\u3001\u4ea4\u4f5c\u4e1a\uff09\uff0c\u4f46\u6838\u5fc3\u5361\u70b9\u5728\u4ed8\u8d39\u8f6c\u5316\uff0c\u5bf9\u540e\u7eed\u6295\u5165\u7684\u627f\u8bfa\u5ea6\u53d6\u51b3\u4e8e\u5bf9\u201c\u4fdd\u5e95\u6536\u76ca\u201d\u7684\u4fe1\u4efb\u5ea6\uff0c\u76ee\u524d\u627f\u8bfa\u5ea6\u4e0d\u7a33\u5b9a\u3002\n*   **\u6b65\u9aa43 - \u9002\u5408\u5ea6**\uff1a\u4ea7\u54c1\uff08AI\u77ed\u89c6\u9891\u53d8\u73b0\uff09\u4e0e\u7528\u6237\u9700\u6c42\uff08\u5feb\u901f\u526f\u4e1a\u6536\u5165\uff09\u8868\u9762\u5339\u914d\uff0c\u4f46\u7528\u6237\u6297\u632b\u6027\u4f4e\u4e0e\u884c\u4e1a\u9700\u8981\u4e00\u5b9a\u79ef\u7d2f\u7684\u7279\u70b9\u5b58\u5728\u6f5c\u5728\u51b2\u7a81\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**\uff1a**B\u7c7b\uff08\u9ad8\u610f\u5411-\u4f4e\u8d44\u6e90\uff09\u7528\u6237**\u3002\u6709\u660e\u786e\u5b66\u4e60-\u53d8\u73b0\u610f\u5411\uff0c\u4f46\u652f\u4ed8\u80fd\u529b\u4e0d\u8db3\uff0c\u4e14\u5bf9\u6295\u8d44\u56de\u62a5\u5b58\u5728\u8d85\u524d\u7126\u8651\u3002\n\n---\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n**T7 \u751f\u8ba1\u8c0b\u751f\u578b**\n*   **\u6838\u5fc3\u7279\u5f81**\uff1a\u5c06\u8bfe\u7a0b\u89c6\u4e3a\u8c0b\u751f\u6216\u6539\u5584\u7ecf\u6d4e\u72b6\u51b5\u7684\u5de5\u5177\uff0c\u5bf9\u6295\u5165\u4ea7\u51fa\u6bd4\u6781\u5ea6\u654f\u611f\uff0c\u8ffd\u6c42\u77ed\u671f\u3001\u786e\u5b9a\u7684\u73b0\u91d1\u56de\u62a5\u3002\n*   **\u5339\u914d\u4f9d\u636e**\uff1a\u6240\u6709\u4e92\u52a8\u56f4\u7ed5\u201c\u5b66\u8d39\u201d\u548c\u201c\u80fd\u5426\u8d5a\u5230\u94b1\u201d\u5c55\u5f00\uff1b\u5bf9\u201c\u5546\u5355\u201d\u3001\u201c\u6d3e\u5355\u201d\u7b49\u76f4\u63a5\u53d8\u73b0\u9014\u5f84\u5174\u8da3\u6d53\u539a\uff1b\u5bf9\u5b66\u4e60\u8fc7\u7a0b\u672c\u8eab\u7684\u5174\u8da3\u5f31\uff1b\u5b58\u5728\u201c\u6015\u4ea4\u4e0d\u8d77\u201d\u7684\u7ecf\u6d4e\u538b\u529b\u8868\u8ff0\u3002\n\n---\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\uff08\u6781\u9ad8\uff09\n\n\u9010\u9879\u6392\u67e57\u5927\u9000\u8d39\u6839\u56e0\uff1a\n1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u671f\u5f85\u201c\u524d\u671f\u4e5f\u9700\u8981\u6709\u6536\u5165\u201d\u3001\u201c\u6015\u63a5\u4e0d\u5230\u5355\u5b50\u201d\uff0c\u82e5\u5b66\u4e60\u540e\u77ed\u671f\u5185\u672a\u83b7\u5f97\u5b9e\u9645\u6536\u5165\uff0c\u6781\u6613\u5f15\u53d1\u201c\u6548\u679c\u4e0d\u7b26\u201d\u6295\u8bc9\u3002\n2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u9ad8\u98ce\u9669**\u3002\u5df2\u660e\u786e\u8868\u8fbe\u652f\u4ed8\u538b\u529b\uff0c\u662f\u5f53\u524d\u8f6c\u5316\u7684\u6838\u5fc3\u969c\u788d\uff0c\u4e5f\u662f\u672a\u6765\u9000\u8d39\u7684\u76f4\u63a5\u5bfc\u706b\u7d22\u3002\n3.  **\u8bfe\u7a0b\u8d28\u91cf**\uff1a\u76ee\u524d\u672a\u8d28\u7591\uff0c\u4f46\u82e5\u540e\u7eed\u89c9\u5f97\u8bfe\u7a0b\u65e0\u6cd5\u76f4\u63a5\u89e3\u51b3\u5176\u201c\u63a5\u5355\u201d\u95ee\u9898\uff0c\u98ce\u9669\u4f1a\u4e0a\u5347\u3002\n4.  **\u670d\u52a1\u4f53\u9a8c**\uff1a\u76ee\u524d\u4e92\u52a8\u6b63\u5e38\uff0c\u98ce\u9669\u8f83\u4f4e\u3002\n5.  **\u65f6\u95f4\u51b2\u7a81**\uff1a\u6682\u65e0\u4fe1\u53f7\u3002\n6.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a\u6682\u65e0\u4fe1\u606f\u3002\n7.  **\u7ade\u54c1\u6bd4\u8f83/\u51b2\u52a8\u6d88\u8d39**\uff1a\u6682\u65e0\u4fe1\u53f7\uff0c\u4f46\u7528\u6237\u5bf9\u4ef7\u683c\u654f\u611f\uff0c\u6613\u53d7\u66f4\u4f4e\u4ef7\u683c\u6216\u201c\u4fdd\u6536\u76ca\u201d\u627f\u8bfa\u5f71\u54cd\u3002\n\n**\u7efc\u5408\u9000\u8d39\u98ce\u9669\uff1a\u9ad8**\u3002\u6838\u5fc3\u98ce\u9669\u6e90\u4e8e**\u7ecf\u6d4e\u538b\u529b**\u4e0e\u5bf9**\u77ed\u671f\u53d8\u73b0\u7684\u8fc7\u9ad8\u671f\u671b**\u4e4b\u95f4\u7684\u5de8\u5927\u843d\u5dee\u3002\n\n---\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u8fc7\u5ea6\u627f\u8bfa**\uff1a\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u5546\u5355\u6536\u76ca\u201d\uff08\u5982\u201c\u5355\u6761\u89c6\u9891\u6536\u76ca\u8fbe800-1500\u5143\u201d\u3001\u201c\u62a5\u4ef7\u516d\u4f4d\u6570\u201d\uff09\u3001\u201c\u5de5\u4f5c\u5ba4\u8d44\u6e90\u201d\u3001\u201c\u6d3e\u5355\u4fdd\u969c\u201d\uff0c**\u5b58\u5728\u6697\u793a\u201c\u4fdd\u5e95\u6536\u5165\u201d\u7684\u503e\u5411**\uff0c\u53ef\u80fd\u62d4\u9ad8\u7528\u6237\u9884\u671f\u3002\n*   **\u5236\u9020\u7126\u8651**\uff1a\u4f7f\u7528\u201c\u98ce\u53e3\u201d\u3001\u201c\u4e00\u4e2a\u4eba\u5c31\u662f\u4e00\u652f\u56e2\u961f\u201d\u3001\u201c\u7edd\u5bf9\u98ce\u53e3\u201d\u7b49\u8bdd\u672f\uff0c\u5c5e\u4e8e\u884c\u4e1a\u901a\u7528\u7126\u8651\u8425\u9500\uff0c\u5c1a\u5728\u5c3a\u5ea6\u5185\u3002\n*   **\u4ef7\u683c\u6a21\u7cca**\uff1a\u5728\u7528\u6237\u591a\u6b21\u8be2\u95ee\u4ef7\u683c\u65f6\uff0c\u672a\u76f4\u63a5\u56de\u5e94\uff0c\u800c\u662f\u4ee5\u201c\u6027\u4ef7\u6bd4\u8d85\u9ad8\u201d\u3001\u201c\u65e0\u6cd5\u8861\u91cf\u201d\u7b49\u8bdd\u672f\u89c4\u907f\uff0c**\u53ef\u80fd\u5f15\u53d1\u7528\u6237\u88ab\u8bf1\u5bfc\u611f**\u3002\n*   **\u98ce\u9669\u63d0\u793a\u7f3a\u5931**\uff1a\u5168\u7a0b\u672a\u63d0\u53ca\u5b66\u4e60\u66f2\u7ebf\u3001\u5e02\u573a\u7ade\u4e89\u3001\u6536\u5165\u4e0d\u786e\u5b9a\u6027\u7b49\u98ce\u9669\uff0c**\u4fe1\u606f\u5448\u73b0\u4e0d\u5747\u8861**\u3002\n\n---\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n\n### \u884c\u52a8\u6307\u5357\uff08\u8f6c\u5316\u524d\uff09\n1.  **\u98ce\u9669\u524d\u7f6e\uff0c\u7ba1\u7406\u9884\u671f**\uff1a**\u5fc5\u987b**\u5728\u8f6c\u5316\u524d\u8fdb\u884c\u4e00\u5bf9\u4e00\u6c9f\u901a\uff0c\u660e\u786e\u544a\u77e5\uff1aAI\u6280\u80fd\u53d8\u73b0\u9700\u8981\u5b66\u4e60\u5468\u671f\u548c\u5b9e\u8df5\u79ef\u7d2f\uff0c\u521d\u671f\u6536\u5165\u4e0d\u7a33\u5b9a\uff0c\u65e0\u6cd5\u4fdd\u8bc1\u201c\u5b66\u5b8c\u5373\u63a5\u5355\u3001\u63a5\u5355\u5373\u9ad8\u6536\u5165\u201d\u3002\u964d\u4f4e\u5176\u201c\u5feb\u901f\u56de\u672c\u201d\u7684\u5e7b\u60f3\u3002\n2.  **\u805a\u7126\u4ef7\u503c\uff0c\u800c\u975e\u627f\u8bfa**\uff1a\u6c9f\u901a\u91cd\u70b9\u4ece\u201c\u4fdd\u8bc1\u6709\u5355\u201d\u8f6c\u5411\u201c\u6559\u4f1a\u4f60\u63a5\u5355\u7684\u80fd\u529b\u548c\u63d0\u4f9b\u63a5\u5355\u7684\u6e20\u9053\u201d\u3002\u5c55\u793a\u5f80\u671f\u5b66\u5458\u4ece0\u52301\u7684\u6210\u957f\u6848\u4f8b\uff08\u800c\u975e\u5355\u7eaf\u7684\u9ad8\u6536\u5165\u6848\u4f8b\uff09\uff0c\u5f3a\u8c03\u6280\u80fd\u63d0\u5347\u7684\u957f\u671f\u4ef7\u503c\u3002\n3.  **\u63a2\u7d22\u652f\u4ed8\u65b9\u6848**\uff1a\u8bd5\u63a2\u6027\u8be2\u95ee\u7528\u6237\u9884\u7b97\uff0c\u6216\u4ecb\u7ecd\u5206\u671f\u7b49\u652f\u4ed8\u5de5\u5177\uff0c\u4f46**\u7edd\u4e0d\u80fd\u8bf1\u5bfc\u8d85\u524d\u6d88\u8d39\u6216\u501f\u8d37**\u3002\n4.  **\u5f3a\u5316\u4fe1\u4efb\u4e0e\u966a\u4f34**\uff1a\u80af\u5b9a\u5176\u5f53\u524d\u7684\u5b66\u4e60\u6001\u5ea6\u548c\u4f5c\u4e1a\u5b8c\u6210\u60c5\u51b5\uff0c\u5efa\u7acb\u4e2a\u4eba\u4fe1\u4efb\u3002\u5f3a\u8c03\u73ed\u4e3b\u4efb\u548c\u5de5\u4f5c\u5ba4\u7684\u957f\u671f\u966a\u4f34\u4ef7\u503c\uff0c\u800c\u4e0d\u4ec5\u662f\u201c\u6d3e\u5355\u673a\u5668\u201d\u3002\n\n### \u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6302\u8f7d\u4ea7\u54c1\u7ebf**\uff1a**\u8c28\u614e\u63a8\u8350\u9ad8\u5355\u4ef7\u201c\u5168\u80fd\u73ed\u201d\u6216\u201c\u4fdd\u5c31\u4e1a\u73ed\u201d**\u3002\u7528\u6237\u7ecf\u6d4e\u57fa\u7840\u8584\u5f31\uff0c\u9ad8\u5ba2\u5355\u4ef7\u4ea7\u54c1\u4f1a\u6781\u5927\u653e\u5927\u5176\u6295\u8d44\u7126\u8651\u548c\u9000\u8d39\u98ce\u9669\u3002\n*   **\u5efa\u8bae\u8def\u5f84**\uff1a\n    *   **\u4f18\u5148\u8003\u8651\u4f4e\u5355\u4ef7\u5165\u95e8\u4ea7\u54c1**\uff08\u5982\u4f53\u9a8c\u8425\u540e\u7684\u6b63\u5f0f\u5165\u95e8\u8bfe\uff09\uff0c\u964d\u4f4e\u5176\u51b3\u7b56\u95e8\u69db\u548c\u8bd5\u9519\u6210\u672c\u3002\n    *   \u5982\u679c\u5fc5\u987b\u63a8\u9ad8\u5355\u4ef7\u4ea7\u54c1\uff0c**\u5fc5\u987b\u6346\u7ed1\u6e05\u6670\u7684\u3001\u5206\u9636\u6bb5\u7684\u6210\u679c\u4ea4\u4ed8\u9884\u671f**\uff08\u5982\uff1a\u7b2c\u4e00\u9636\u6bb5\u638c\u63e1\u6280\u80fd\uff0c\u7b2c\u4e8c\u9636\u6bb5\u5c1d\u8bd5\u63a5\u7b80\u5355\u5546\u5355\uff0c\u7b2c\u4e09\u9636\u6bb5\u8fdb\u9636\uff09\uff0c\u5e76\u5c06\u8d39\u7528\u4e0e\u9636\u6bb5\u4ef7\u503c\u5f3a\u5173\u8054\u3002\n    *   **\u5f3a\u70c8\u5efa\u8bae**\u5728\u9500\u552e\u6d41\u7a0b\u4e2d\u589e\u52a0\u201c\u9884\u671f\u7ba1\u7406\u201d\u548c\u201c\u98ce\u9669\u544a\u77e5\u201d\u73af\u8282\uff0c\u5e76\u4fdd\u7559\u8bb0\u5f55\u3002\n\n---\n\n```json\n{\"core_type\": \"T7 \u751f\u8ba1\u8c0b\u751f\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168/\u5c0a\u91cd\", \"target_product_line\": \"\u8c28\u614e\u63a8\u8350\uff0c\u4f18\u5148\u4f4e\u5355\u4ef7\u5165\u95e8\u4ea7\u54c1\uff0c\u82e5\u63a8\u9ad8\u5355\u4ef7\u9700\u5f3a\u5316\u9636\u6bb5\u4ef7\u503c\u4e0e\u98ce\u9669\u544a\u77e5\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
