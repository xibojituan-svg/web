    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a145715635\uff08\u5f6d\u5a1f\u5a1f\uff09\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a145715635 / \u6635\u79f0\uff1a\u5f6d\u5a1f\u5a1f |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6a59\u6a59(\u9a6c\u745c) / \u5b98\u65b9\u62db\u52df\u5b98-\u68a6\u5883(\u9a6c\u745c) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u9ad8\u9636\u8bfe\u7a0b\uff08\u4ef7\u683c\u672a\u77e5\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3**\uff08\u660e\u786e\u63d0\u53ca\u201c\u623f\u8d37\uff0c\u5b69\u5b50\u4e0a\u5b66\u201d\u538b\u529b\uff0c\u62a5\u540d\u51b3\u7b56\u53d7\u7ecf\u6d4e\u538b\u529b\u9a71\u52a8\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u4f5c\u4e3a\u5185\u52e4\uff0c\u63a8\u6d4b\u4e3a\u4e0a\u73ed\u65cf\uff0c\u9700\u5229\u7528\u4e1a\u4f59\u65f6\u95f4\u5b66\u4e60\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u5ea6\uff0c\u9700\u540e\u7eed\u6478\u5e95\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u7528\u6237\u4e3b\u52a8\u8868\u8fbe\u4e86\u6838\u5fc3\u52a8\u673a\u3001\u73b0\u5b9e\u538b\u529b\u548c\u5b66\u4e60\u610f\u613f\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u2b07\u4f4e**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u7eaf\u4e3a\u51e0\u5929\u5185\u63d0\u73b0\u4fdd\u5e95\u800c\u6765(\u4f4e\u6781\u5371)**\u3002\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u89e3\u51b3\u201c\u751f\u6d3b\u538b\u529b\u5927\u201d\u7684\u71c3\u7709\u4e4b\u6025\uff0c\u5bf9\u201c\u589e\u52a0\u4e00\u4efd\u6536\u5165\u201d\u6709\u8feb\u5207\u671f\u5f85\uff0c\u5bf9\u201c\u6539\u53d8\u58f0\u7ebf\u201d\u7684\u5174\u8da3\u662f\u6b21\u8981\u7684\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u751f\u6d3b\u538b\u529b\u592a\u5927\u4e86\uff0c\u60f3\u589e\u52a0\u4e00\u4efd\u6536\u5165[\u76b1\u7709]\u201d\n  > \u201c\u60f3\u62a5\u9ad8\u9636\u7684\uff0c\u4f46\u786e\u5b9e\u538b\u529b\u5927\u3002\u3002\u623f\u8d37\uff0c\u5b69\u5b50\u4e0a\u5b66\u3002\u524d\u671f\u53ef\u4ee5\u591a\u63a5\u70b9\u5de5\u4f5c\u4e48[\u76b1\u7709]\u201d\n  > \u201c\u90a3\u5b66\u4e60\u671f\u95f4\u53ef\u4ee5\u63a5\u753b\u672c\uff0c\u5ba1\u542c\u7684\u5de5\u4f5c\u4e48[\u76b1\u7709]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u660e\u786e\u8868\u793a\u56e0\u201c\u623f\u8d37\uff0c\u5b69\u5b50\u4e0a\u5b66\u201d\u538b\u529b\u5927\uff0c\u62a5\u540d\u51b3\u7b56\u53d7\u7ecf\u6d4e\u6761\u4ef6\u4e25\u91cd\u5236\u7ea6\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u4f5c\u4e3a\u201c\u4e00\u822c\u5185\u52e4\u201d\uff0c\u65f6\u95f4\u53ef\u80fd\u8f83\u4e3a\u89c4\u5f8b\uff0c\u4f46\u9700\u517c\u987e\u5bb6\u5ead\uff0c\u7cbe\u529b\u6709\u9650\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\uff0c\u9700\u540e\u7eed\u6838\u67e5\uff0c\u662f\u6f5c\u5728\u98ce\u9669\u70b9\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u27a1\u4e2d**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a(\u4e2d)**\u3002\u7528\u6237\u8868\u73b0\u51fa\u201c\u52e4\u80fd\u8865\u62d9\u201d\u7684\u79ef\u6781\u5fc3\u6001\uff0c\u80fd\u63a5\u53d7\u201c\u6162\u6162\u52aa\u529b\u201d\u7684\u8fc7\u7a0b\uff0c\u672a\u51fa\u73b0\u5d29\u6e83\u6216\u6781\u5ea6\u81ea\u5351\u4fe1\u53f7\u3002\u4f46\u5728\u9762\u4e34\u7ecf\u6d4e\u538b\u529b\u65f6\uff0c\u4f1a\u53cd\u590d\u786e\u8ba4\u53d8\u73b0\u8def\u5f84\uff0c\u9700\u8981\u9500\u552e\u7ed9\u4e88\u660e\u786e\u7684\u201c\u8fb9\u5b66\u8fb9\u8d5a\u201d\u7684\u8def\u5f84\u5b89\u629a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u611f\u89c9\u9700\u8981\u5b66\u4e60\u7684\u8fd8\u5f88\u591a[\u6109\u5feb]\uff0c\u6162\u6162\u52aa\u529b[\u52a0\u6cb9]\u201d\n  > \u201c\u55ef\u55ef\uff0c\u5f55\u4e66\u7684\u80fd\u529b\u53ef\u80fd\u8fd8\u9700\u8981\u6162\u6162\u5b66\u4e60\u63d0\u5347\u201d\n  > \u201c\u55ef\u3002\u90a3\u6211\u62a5\u540d\u3002\u52e4\u80fd\u8865\u62d9\uff0c\u53ea\u8981\u575a\u6301\u4e00\u5b9a\u80fd\u770b\u5230\u7ed3\u679c[\u52a0\u6cb9]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42\uff08\u7126\u8651\u4fdd\u969c\uff09**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u7ecf\u6d4e\u5b89\u5168\u611f\u7684\u4e25\u91cd\u7f3a\u5931**\u300238\u5c81\u5185\u52e4\uff0c\u9762\u4e34\u623f\u8d37\u3001\u5b69\u5b50\u6559\u80b2\u7b49\u521a\u6027\u652f\u51fa\uff0c\u5bf9\u201c\u589e\u52a0\u4e00\u4efd\u6536\u5165\u201d\u6709\u6781\u5176\u8feb\u5207\u7684\u73b0\u5b9e\u9700\u6c42\uff0c\u5b66\u4e60\u662f\u624b\u6bb5\uff0c\u53d8\u73b0\u662f\u76ee\u7684\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u63d0\u4f9b\u4e00\u6761\u6e05\u6670\u3001\u53ef\u4fe1\u3001\u53ef\u9884\u671f\u7684\u517c\u804c\u53d8\u73b0\u8def\u5f84\u56fe**\uff0c\u5e76\u7528\u201c\u52e4\u80fd\u8865\u62d9\u201d\u7684\u4ef7\u503c\u89c2\u7ed9\u4e88\u5176\u575a\u6301\u7684\u4fe1\u5fc3\uff0c\u7f13\u89e3\u5176\u56e0\u7ecf\u6d4e\u538b\u529b\u4ea7\u751f\u7684\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b**\uff08\u98ce\u9669\u7ba1\u63a7\u578b\uff09 |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u8bba** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u7528\u6237\u867d\u7ecf\u6d4e\u538b\u529b\u5927\uff0c\u4f46\u672a\u63d0\u53ca\u501f\u8d37\u62a5\u540d\uff0c\u4e14\u5fc3\u6001\u8f83\u4e3a\u79ef\u6781\uff08\u201c\u52e4\u80fd\u8865\u62d9\u201d\uff09\uff0c\u6682\u672a\u89e6\u53caT8-D\u7edd\u8def\u8d4c\u5f92\u7ea2\u7ebf\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| **\u5bb6\u5ead\u5e72\u9884\u578b** | **\u4e2d** | \u82e5\u62a5\u540d\u8d39\u7528\u52a8\u7528\u5bb6\u5ead\u50a8\u84c4\u4e14\u672a\u4e0e\u5bb6\u4eba\u5145\u5206\u6c9f\u901a\uff0c\u53ef\u80fd\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u4e2d** | \u5de5\u4f5c\u4e0e\u5bb6\u5ead\u5360\u7528\u7cbe\u529b\uff0c\u5bfc\u81f4\u5b66\u4e60\u8fdb\u5ea6\u843d\u540e\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u632b\u8d25\u611f\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u4f4e** | \u76ee\u524d\u5fc3\u6001\u5c1a\u53ef\uff0c\u4f46\u82e5\u521d\u671f\u8bd5\u97f3\u591a\u6b21\u5931\u8d25\uff0c\u53ef\u80fd\u52a8\u6447\u5176\u201c\u52e4\u80fd\u8865\u62d9\u201d\u7684\u4fe1\u5fc3\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u6781\u9ad8** | **\u8fd9\u662f\u6700\u5927\u98ce\u9669\u70b9**\u3002\u82e5\u5f00\u8bfe\u540e\u53d1\u73b0\u201c\u8fb9\u5b66\u8fb9\u8d5a\u201d\u7684\u627f\u8bfa\u65e0\u6cd5\u5728\u77ed\u671f\u5185\u5151\u73b0\uff0c\u6216\u63a5\u5355\u6536\u5165\u8fdc\u4f4e\u4e8e\u9884\u671f\uff0c\u5c06\u76f4\u63a5\u89e6\u53d1\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c1-2\u4e2a\u6708**\u3002\u6b64\u65f6\u5b66\u4e60\u8fdb\u5165\u5e73\u53f0\u671f\uff0c\u82e5\u8fdf\u8fdf\u65e0\u6cd5\u83b7\u5f97\u7b2c\u4e00\u7b14\u6536\u5165\uff08\u54ea\u6015\u662f\u753b\u672c\u3001\u5ba1\u542c\u7b49\u4f4e\u5355\u4ef7\u5de5\u4f5c\uff09\uff0c\u5176\u201c\u53d8\u73b0\u89e3\u538b\u201d\u7684\u6838\u5fc3\u8bc9\u6c42\u843d\u7a7a\uff0c\u9000\u8d39\u98ce\u9669\u6025\u5267\u5347\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5a1f\u5a1f\u59d0\uff0c\u770b\u5230\u4f60\u8bf4\u2018\u52e4\u80fd\u8865\u62d9\u2019\u7279\u522b\u611f\u52a8\u3002\u54b1\u4eec\u8fd9\u4e2a\u73ed\u91cc\u6709\u4e0d\u5c11\u548c\u4f60\u60c5\u51b5\u76f8\u4f3c\u7684\u5b9d\u5988\u548c\u4e0a\u73ed\u65cf\uff0c\u90fd\u662f\u60f3\u9760\u58f0\u97f3\u591a\u4e00\u4efd\u6536\u5165\u3002\u524d\u671f\u54b1\u4eec\u4e0d\u8d2a\u591a\uff0c\u5148\u9501\u5b9a\u2018\u753b\u672c\u2019\u548c\u2018\u5ba1\u542c\u2019\u8fd9\u4e24\u4e2a\u80fd\u6700\u5feb\u4e0a\u624b\u3001\u9a6c\u4e0a\u6709\u6d3b\u5e72\u7684\u65b9\u5411\uff0c\u6211\u628a\u63a5\u5355\u6e20\u9053\u548c\u6807\u51c6\u5148\u53d1\u4f60\uff0c\u4f60\u5fc3\u91cc\u6709\u5e95\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\u6765\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011**\u3002\u5fc5\u987b\u4f18\u5148\u6ee1\u8db3\u5176\u201c\u589e\u52a0\u6536\u5165\u201d\u7684\u6838\u5fc3\u8bc9\u6c42\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T4\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u7cbe\u786e\u6d3e\u5355\u62e6\u622a\u5305\u3011**\u3002\u5373\uff1a**A(\u57fa\u7840\u8bfe) + B(\u7cbe\u786e\u6d3e\u5355\u62e6\u622a)**\u3002B\u6a21\u5757\u7684\u6838\u5fc3\u662f**\u4e25\u63a7\u9884\u671f**\uff0c\u5e76\u7cbe\u51c6\u5bf9\u63a5\u201c\u753b\u672c\u201d\u3001\u201c\u5ba1\u542c\u201d\u7b49\u4f4e\u95e8\u69db\u3001\u5feb\u53cd\u9988\u7684\u517c\u804c\u4efb\u52a1\uff0c\u5efa\u7acb\u521d\u671f\u4fe1\u4efb\u548c\u5fae\u5c0f\u6b63\u53cd\u9988\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u753b\u5927\u997c\uff0c\u627f\u8bfa\u201c\u5b66\u5b8c\u7acb\u523b\u6708\u5165\u8fc7\u4e07\u201d\uff1b2. \u53ea\u8bb2\u9ad8\u6df1\u7684\u6f14\u64ad\u6280\u5de7\uff0c\u4e0d\u63d0\u4f9b\u5177\u4f53\u7684\u3001\u53ef\u7acb\u5373\u64cd\u4f5c\u7684\u53d8\u73b0\u8def\u5f84\uff1b3. \u5ffd\u89c6\u5176\u7ecf\u6d4e\u538b\u529b\uff0c\u76f2\u76ee\u63a8\u9500\u66f4\u9ad8\u9636\u3001\u66f4\u6602\u8d35\u7684\u8bfe\u7a0b\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u7528\u6237\u672a\u901a\u8fc7\u521d\u671f\u517c\u804c\u83b7\u5f97\u7a33\u5b9a\u6536\u5165\u524d\u8fdb\u884c\u4efb\u4f55\u5927\u989d\u5347\u5355\u63a8\u4ecb**\u3002\u53ef\u8003\u8651500\u5143\u4ee5\u5185\u7684\u5fae\u5347\u5355\uff08\u5982\u5de5\u5177\u5305\u3001\u7279\u5b9a\u6280\u80fd\u77ed\u8bad\uff09\uff0c\u4e14\u5fc5\u987b\u4e0e\u201c\u63d0\u5347\u63a5\u5355\u6548\u7387/\u5355\u4ef7\u201d\u5f3a\u76f8\u5173\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u751f\u6d3b\u538b\u529b\u592a\u5927\u4e86\uff0c\u60f3\u589e\u52a0\u4e00\u4efd\u6536\u5165[\u76b1\u7709]\u201d\n2. > \u201c\u60f3\u62a5\u9ad8\u9636\u7684\uff0c\u4f46\u786e\u5b9e\u538b\u529b\u5927\u3002\u3002\u623f\u8d37\uff0c\u5b69\u5b50\u4e0a\u5b66\u3002\u524d\u671f\u53ef\u4ee5\u591a\u63a5\u70b9\u5de5\u4f5c\u4e48[\u76b1\u7709]\u201d\n3. > \u201c\u90a3\u5b66\u4e60\u671f\u95f4\u53ef\u4ee5\u63a5\u753b\u672c\uff0c\u5ba1\u542c\u7684\u5de5\u4f5c\u4e48[\u76b1\u7709]\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4 \u641e\u94b1\u7ed3\u679c\u8bba\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u89e3\u51b3\u7ecf\u6d4e\u538b\u529b\uff0c\u83b7\u5f97\u5b89\u5168\u611f\u548c\u4fdd\u969c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5f00\u8425\u5373\u63d0\u4f9b\u6e05\u6670\u3001\u4f4e\u95e8\u69db\u7684\u517c\u804c\u8def\u5f84\uff08\u5982\u753b\u672c/\u5ba1\u542c\uff09\uff0c\u5e76\u7528\u5fae\u5c0f\u6b63\u53cd\u9988\u5efa\u7acb\u4fe1\u4efb\uff0c\u4e25\u9632\u6536\u76ca\u843d\u5dee\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u8bba\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf + \u7cbe\u786e\u6d3e\u5355\u62e6\u622a\u5305\"}\n```";
