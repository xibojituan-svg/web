    <script>
        const markdownText = "\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e\u3002\u7f3a\u4e4f\u652f\u4ed8\u4fe1\u606f\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u5177\u4f53\u804c\u4e1a\u6536\u5165\u3001\u8fc7\u5f80\u5b66\u4e60\u6295\u5165\u3001\u660e\u786e\u5b66\u4e60\u76ee\u6807\u4e0e\u53d8\u73b0\u9884\u671f\u7b49\u5173\u952e\u7ef4\u5ea6\u4fe1\u606f\u3002\n\n# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u9ad8)**\n    *   **\u663e\u6027\u52a8\u673a**: \u5bfb\u6c42\u804c\u4e1a\u8f6c\u578b/\u201c\u8dd1\u8def\u201d\uff08\u201c\u73b0\u5728\u5c31\u6307\u671b\u6709\u58f0\u5e26\u6211\u8dd1\u8def\u201d\uff09\u3001\u5174\u8da3\u63a2\u7d22\uff08\u201c\u505a\u4e0d\u4e86\u4e3b\u64ad\u6211\u8fd8\u505a\u4e0d\u4e86\u540e\u671f\u201d\uff09\u3001\u793e\u4ea4\u5f52\u5c5e\uff08\u79ef\u6781\u878d\u5165\u793e\u7fa4\uff0c\u9891\u7e41@\u540c\u5b66\u4e92\u52a8\uff09\u3002\n    *   **\u9690\u6027\u52a8\u673a**: \u7f13\u89e3\u804c\u573a\u5026\u6020\uff08\u62b1\u6028\u51fa\u5dee\u3001\u5199\u62a5\u544a\u8f9b\u82e6\uff09\u3001\u5bfb\u6c42\u4ef7\u503c\u8ba4\u540c\uff08\u5728\u7fa4\u5185\u6d3b\u8dc3\uff0c\u5bfb\u6c42\u5173\u6ce8\u4e0e\u5938\u5956\uff09\u3001\u9003\u907f\u73b0\u5b9e\u538b\u529b\uff08\u5c06\u6709\u58f0\u89c6\u4e3a\u201c\u8dd1\u8def\u201d\u51fa\u53e3\uff09\u3002\n    *   **\u7eaf\u5ea6\u5224\u65ad**: \u6df7\u5408\u578b\u52a8\u673a\u3002**\u65e2\u6709\u660e\u786e\u7684\u804c\u4e1a\u53d1\u5c55\u8bc9\u6c42\uff08\u540e\u671f\u65b9\u5411\uff09\uff0c\u4e5f\u63ba\u6742\u4e86\u660e\u663e\u7684\u60c5\u7eea\u5ba3\u6cc4\u548c\u793e\u4ea4\u9700\u6c42**\u3002\u5bf9\u201c\u8dd1\u8def\u201d\u7684\u671f\u5f85\u53ef\u80fd\u9690\u542b\u4e0d\u5207\u5b9e\u9645\u7684\u5e7b\u60f3\u3002\n\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d)**\n    *   **\u65f6\u95f4\u7cbe\u529b**: **\u5728\u804c\u72b6\u6001\uff0c\u4e14\u5de5\u4f5c\u7e41\u5fd9\uff08\u9891\u7e41\u51fa\u5dee\u3001\u5199\u62a5\u544a\u3001\u7ba1\u7406\u4e0b\u5c5e\uff09**\uff0c\u5b66\u4e60\u65f6\u95f4\u88ab\u4e25\u91cd\u6324\u538b\uff08\u201c\u6211\u4ed8\u51fa\u7684\u65f6\u95f4\u5c11\u201d\u3001\u201c\u5f97\u751f\u5b58\u201d\uff09\u3002\u4f46\u80fd\u5229\u7528\u788e\u7247\u65f6\u95f4\uff08\u8f66\u4e0a\u3001\u51fa\u5dee\u95f4\u9699\uff09\u53c2\u4e0e\u5b66\u4e60\u8ba8\u8bba\u3002\n    *   **\u7ecf\u6d4e\u57fa\u7840**: \u4fe1\u606f\u4e0d\u8db3\u3002\u6709\u7a33\u5b9a\u5de5\u4f5c\uff08\u7ba1\u7406\u5c97\uff0c\u53ef\u516c\u8d39\u51fa\u5dee\uff09\uff0c\u5177\u5907\u4e00\u5b9a\u652f\u4ed8\u80fd\u529b\uff0c\u4f46\u5177\u4f53\u6536\u5165\u4e0e\u8bfe\u7a0b\u8d39\u7528\u5360\u6bd4\u672a\u77e5\u3002\n    *   **\u5b66\u4e60\u57fa\u7840**: \u81ea\u79f0\u201c\u83dc\u201d\uff08\u201c\u4f30\u8ba1\u6ca1\u60f3\u5230\u8fd8\u6709\u6211\u8fd9\u4e48\u83dc\u7684\u201d\uff09\uff0c\u4f46\u79ef\u6781\u53c2\u4e0e\u5c0f\u7ec4\u4f5c\u4e1a\uff08\u7ec4\u7ec7\u817e\u8baf\u4f1a\u8bae\u8ba8\u8bba\u5267\u672c\u3001\u5206\u914d\u89d2\u8272\uff09\uff0c\u8868\u73b0\u51fa\u8f83\u5f3a\u7684\u884c\u52a8\u529b\u548c\u56e2\u961f\u534f\u4f5c\u80fd\u529b\u3002**\u660e\u786e\u4e3b\u653b\u201c\u540e\u671f\u201d\u65b9\u5411**\u3002\n\n*   **\u5fc3\u7406\u5f39\u6027 (\u9ad8)**\n    *   **\u632b\u6298\u5e94\u5bf9**: \u4f5c\u4e1a\u5931\u8bef\uff08\u4ea4\u9519\u6587\u672c\uff09\u540e\u80fd\u81ea\u5632\u5e76\u201c\u5f15\u4ee5\u4e3a\u6212\u201d\uff0c\u5fc3\u6001\u79ef\u6781\u3002\u5728\u5fd9\u788c\u4e2d\u4ecd\u575a\u6301\u8ddf\u8fdb\u5b66\u4e60\u4efb\u52a1\u3002\n    *   **\u4e92\u52a8\u6a21\u5f0f**: **\u6781\u5ea6\u6d3b\u8dc3\u3001\u9ad8\u793e\u4ea4\u5377\u5165\u5ea6**\u3002\u662f\u7fa4\u5185\u7684\u6c14\u6c1b\u7ec4\u548c\u8fde\u63a5\u8005\uff08\u9891\u7e41@\u4ed6\u4eba\u3001\u7ec4\u7ec7\u4f1a\u8bae\u3001\u534f\u8c03\u89d2\u8272\uff09\u3002\u5584\u4e8e\u81ea\u5632\uff08\u201c\u6211\u8bdd\u591a\u201d\u3001\u201c\u6211\u88c5\u7684\u201d\uff09\uff0c\u60c5\u7eea\u5916\u9732\u4e14\u6b63\u9762\u3002\n    *   **\u575a\u6301\u6027**: \u5728\u9ad8\u538b\u5de5\u4f5c\u4e0b\uff08\u51fa\u5dee\u3001\u8d76\u62a5\u544a\uff09\u4ecd\u52aa\u529b\u53c2\u4e0e\u8bfe\u7a0b\u6d3b\u52a8\uff0c\u4e3b\u52a8\u7d22\u8981\u4efb\u52a1\u3001\u914d\u5408\u73ed\u73ed\uff0c\u663e\u793a\u51fa\u8f83\u5f3a\u7684\u575a\u6301\u610f\u613f\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u4fe1\u606f\u7f3a\u5931**\u3002\u8bb0\u5f55\u4e2d\u672a\u63d0\u53ca\u652f\u4ed8\u884c\u4e3a\u3001\u91d1\u989d\u3001\u65b9\u5f0f\u3002\u9700\u6838\u67e5\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u7f3a\u5931**\u3002\u8bb0\u5f55\u4e2d\u672a\u63d0\u53ca\u914d\u5076\u3001\u5b50\u5973\u6216\u5176\u4ed6\u5bb6\u5ead\u6210\u5458\u6001\u5ea6\u3002\u9700\u6838\u67e5\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u4e0e\u8d44\u6e90\u521d\u5ba1 (A/B\u7c7b\u5206\u6d41)**:\n    *   \u52a8\u673a\u660e\u786e\uff08\u540e\u671f\u65b9\u5411+\u8dd1\u8def\u613f\u671b\uff09\uff0c\u8d44\u6e90\u5c1a\u53ef\uff08\u5728\u804c\u3001\u6709\u884c\u52a8\u529b\uff09\uff0c\u5fc3\u7406\u5f39\u6027\u9ad8\u3002**\u521d\u6b65\u5f52\u4e3aB\u7c7b\uff08\u6f5c\u529b\u7528\u6237\uff09**\uff0c\u4f46\u9700\u8865\u5168\u652f\u4ed8\u4e0e\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u3002\n*   **\u6b65\u9aa42 - \u627f\u8bfa\u5ea6\u4e0e\u6267\u884c\u529b\u6df1\u6790 (B1/B2/C\u7c7b)**:\n    *   \u6267\u884c\u529b\u5f3a\uff08\u7ec4\u7ec7\u4f1a\u8bae\u3001\u627f\u62c5\u89d2\u8272\uff09\uff0c\u793e\u7fa4\u627f\u8bfa\u5ea6\u9ad8\u3002\u4f46**\u65f6\u95f4\u8d44\u6e90\u7d27\u5f20\u662f\u6700\u5927\u77ed\u677f**\uff0c\u4e14\u201c\u8dd1\u8def\u201d\u52a8\u673a\u53ef\u80fd\u9690\u542b\u8fc7\u9ad8\u9884\u671f\u3002\u6682\u5f52**B2\u7c7b\uff08\u9ad8\u610f\u613f\u4f46\u8d44\u6e90\u53d7\u9650\u578b\uff09**\uff0c\u5b58\u5728\u56e0\u65f6\u95f4\u65e0\u6cd5\u5339\u914d\u800c\u6d41\u5931\u6216\u6295\u8bc9\u7684\u98ce\u9669\u3002\n*   **\u6b65\u9aa43 - \u98ce\u9669\u4e0e\u4ef7\u503c\u7ec8\u5224 (C/D\u7c7b)**:\n    *   \u4e0d\u5c5e\u4e8eC\u7c7b\uff08\u7eaf\u5174\u8da3\uff09\u6216D\u7c7b\uff08\u4f4e\u610f\u613f\u4f4e\u8d44\u6e90\uff09\u3002\u4ef7\u503c\u5728\u4e8e\u9ad8\u6d3b\u8dc3\u5ea6\u53ef\u80fd\u5e26\u52a8\u793e\u7fa4\u6c1b\u56f4\uff0c\u98ce\u9669\u5728\u4e8e\u65f6\u95f4\u51b2\u7a81\u53ef\u80fd\u5bfc\u81f4\u5b66\u4e60\u6210\u679c\u4e0d\u53ca\u9884\u671f\uff0c\u8fdb\u800c\u5f15\u53d1\u9000\u8d39\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b: T4 \u793e\u4ea4\u9a71\u52a8\u63a2\u7d22\u8005**\n    *   **\u6838\u5fc3\u7279\u5f81**: \u5b66\u4e60\u52a8\u673a\u4e2d\u793e\u4ea4\u5f52\u5c5e\u548c\u60c5\u611f\u4ef7\u503c\u5360\u6bd4\u9ad8\uff1b\u4eab\u53d7\u793e\u7fa4\u4e92\u52a8\u4e0e\u56e2\u961f\u534f\u4f5c\u8fc7\u7a0b\uff1b\u5c06\u5b66\u4e60\u89c6\u4e3a\u62d3\u5c55\u4eba\u8109\u3001\u83b7\u5f97\u8ba4\u540c\u7684\u9014\u5f84\uff1b\u6267\u884c\u529b\u4f53\u73b0\u5728\u793e\u4ea4\u7ec4\u7ec7\u4e0a\u3002\n    *   **\u543b\u5408\u70b9**:\n        1.  \u6781\u5f3a\u7684\u793e\u7fa4\u6d3b\u8dc3\u5ea6\u4e0e\u8fde\u63a5\u884c\u4e3a\uff08\u9891\u7e41@\u3001\u7ec4\u7ec7\u4f1a\u8bae\u3001\u5173\u5fc3\u540c\u5b66\uff09\u3002\n        2.  \u8868\u8fbe\u4e2d\u5145\u6ee1\u60c5\u611f\u4e92\u52a8\uff08\u201c\u7231\u4f60\u4eec\u2026\u557e\u557e\u201d\u3001\u201c\u62b1\u62b1\u201d\uff09\u3002\n        3.  \u660e\u786e\u4ece\u793e\u7fa4\u4e2d\u83b7\u5f97\u652f\u6301\u4e0e\u5feb\u4e50\uff08\u201c\u6709\u4f60\u4eec\u4e86\uff0c\u8fd9\u4e0d\u662f\u6760\u6760\u7684\u201d\u3001\u201c\u8fd9\u4e0b\u53c8\u89c9\u5f97\u6765\u6709\u58f0\u592a\u5bf9\u4e86\u201d\uff09\u3002\n    *   **\u504f\u5dee\u70b9**: \u517c\u5177\u660e\u786e\u7684\u201c\u540e\u671f\u201d\u6280\u80fd\u5b66\u4e60\u76ee\u6807\u548c\u201c\u8dd1\u8def\u201d\u7684\u804c\u4e1a\u8f6c\u578b\u8bc9\u6c42\uff0c\u6bd4\u5178\u578b\u7684T4\u539f\u578b\u529f\u5229\u6027\u66f4\u5f3a\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669\u7b49\u7ea7: \u4e2d**\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u6548\u679c\u4e0d\u53ca\u9884\u671f**: **\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u201c\u5e26\u6211\u8dd1\u8def\u201d\u62b1\u6709\u671f\u5f85\uff0c\u82e5\u540e\u671f\u5b66\u4e60\u65e0\u6cd5\u5feb\u901f\u89c1\u5230\u53d8\u73b0\u53ef\u80fd\uff0c\u6613\u4ea7\u751f\u843d\u5dee\u3002\n    2.  **\u65f6\u95f4\u65e0\u6cd5\u4fdd\u969c**: **\u9ad8\u98ce\u9669**\u3002**\u9891\u7e41\u51fa\u5dee\u3001\u5de5\u4f5c\u7e41\u5fd9\u662f\u6700\u5927\u96f7\u533a**\u3002\u201c\u5f97\u751f\u5b58\u201d\u8868\u660e\u5de5\u4f5c\u4f18\u5148\u7ea7\u9ad8\u4e8e\u5b66\u4e60\uff0c\u6613\u56e0\u65f6\u95f4\u51b2\u7a81\u5bfc\u81f4\u8bfe\u7a0b\u5b8c\u6210\u5ea6\u4f4e\u3002\n    3.  **\u7ecf\u6d4e\u538b\u529b**: \u4f4e\u98ce\u9669\uff08\u57fa\u4e8e\u73b0\u6709\u4fe1\u606f\u63a8\u65ad\uff09\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9**: **\u4fe1\u606f\u7f3a\u5931\uff0c\u9700\u6838\u67e5**\u3002\n    5.  **\u8bfe\u7a0b\u8d28\u91cf\u5f02\u8bae**: \u4f4e\u98ce\u9669\u3002\u76ee\u524d\u4e92\u52a8\u79ef\u6781\uff0c\u672a\u8868\u9732\u4e0d\u6ee1\u3002\n    6.  **\u9500\u552e\u627f\u8bfa\u4e0d\u7b26**: \u4f4e\u98ce\u9669\u3002\u8bb0\u5f55\u4e2d\u9500\u552e\u4ecb\u5165\u5c11\uff0c\u672a\u53d1\u73b0\u8fc7\u5ea6\u627f\u8bfa\u3002\n    7.  **\u4e2a\u4eba\u7a81\u53d1\u72b6\u51b5**: \u4f4e\u98ce\u9669\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u4f26\u7406\u9632\u7ebf**: \u672a\u53d1\u73b0\u7528\u6237\u5904\u4e8e\u660e\u663e\u8106\u5f31\u72b6\u6001\uff08\u5982\u6291\u90c1\u503e\u8bc9\uff09\u3002\u4f46\u5176\u5c06\u8bfe\u7a0b\u89c6\u4e3a\u201c\u8dd1\u8def\u201d\u51fa\u53e3\uff0c**\u9700\u8b66\u60d5\u5229\u7528\u5176\u804c\u573a\u5026\u6020\u8fdb\u884c\u7126\u8651\u8425\u9500**\u3002\n*   **\u9500\u552e\u5408\u89c4**: \u8bb0\u5f55\u4e2d\u9500\u552e\u52a8\u4f5c\u4e3a\u5e38\u89c4\u670d\u52a1\uff08\u53d1\u8d44\u6599\u3001\u89e3\u7b54\u6280\u672f\u95ee\u9898\uff09\uff0c\u672a\u53d1\u73b0\u8fdd\u89c4\u627f\u8bfa\u3001\u903c\u5355\u7b49\u884c\u4e3a\u3002**\u4f46\u652f\u4ed8\u73af\u8282\u548c\u5bb6\u5ead\u51b3\u7b56\u77e5\u60c5\u6743\u6838\u67e5\u7f3a\u5931\uff0c\u662f\u5408\u89c4\u6f0f\u6d1e**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6: \u504f\u5dee**\n    *   \u7528\u6237\u6838\u5fc3\u8bc9\u6c42\u662f\u201c\u540e\u671f\u201d\u6280\u80fd\u548c\u201c\u8dd1\u8def\u201d\u53ef\u80fd\uff0c\u4f46\u5f53\u524d\u793e\u7fa4\u4e92\u52a8\u548c\u8bfe\u7a0b\u5185\u5bb9\u82e5\u504f\u91cd\u64ad\u97f3\u5b9e\u64cd\uff0c\u53ef\u80fd\u4e0e\u5979\u7684\u6838\u5fc3\u76ee\u6807\u4ea7\u751f\u504f\u5dee\uff0c\u9700\u5173\u6ce8\u5176\u540e\u671f\u65b9\u5411\u7684\u5b66\u4e60\u8d44\u6e90\u5339\u914d\u5ea6\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **24h\u5185\u6838\u67e5\u652f\u4ed8\u4e0e\u5bb6\u5ead\u77e5\u60c5\uff0c\u9996\u5468\u6821\u6b63\u53d8\u73b0\u9884\u671f**\n    *   **\u7acb\u5373\u884c\u52a8**: \u79c1\u804a\u786e\u8ba4\u652f\u4ed8\u72b6\u6001\uff0c\u5e76\u59d4\u5a49\u4e86\u89e3\u5bb6\u5ead\u662f\u5426\u652f\u6301\u6b64\u6b21\u5b66\u4e60\u6295\u5165\uff08\u7279\u522b\u662f\u5927\u989d\u8bfe\u7a0b\uff09\u3002\n    *   **\u9884\u671f\u7ba1\u7406**: \u5728\u9996\u5468\u5185\uff0c\u9488\u5bf9\u5176\u201c\u8dd1\u8def\u201d\u671f\u671b\uff0c\u8fdb\u884c\u4e00\u5bf9\u4e00\u6c9f\u901a\uff0c\u5ba2\u89c2\u5206\u6790\u6709\u58f0\u884c\u4e1a\u73b0\u72b6\u3001\u540e\u671f\u5c97\u4f4d\u8981\u6c42\u53ca\u6210\u957f\u5468\u671f\uff0c**\u5c06\u201c\u5feb\u901f\u8dd1\u8def\u201d\u7684\u5e7b\u60f3\u8f6c\u5316\u4e3a\u201c\u6280\u80fd\u53e0\u52a0/\u526f\u4e1a\u63a2\u7d22\u201d\u7684\u52a1\u5b9e\u76ee\u6807**\u3002\n    *   **\u65f6\u95f4\u7ba1\u7406\u652f\u6301**: \u8ba4\u53ef\u5176\u5de5\u4f5c\u7e41\u5fd9\uff0c\u534f\u52a9\u5236\u5b9a\u7075\u6d3b\u7684\u5b66\u4e60\u8ba1\u5212\uff08\u5982\u91cd\u70b9\u6293\u540e\u671f\u8bfe\u7a0b\u3001\u5229\u7528\u56de\u653e\uff09\uff0c\u907f\u514d\u56e0\u5b8c\u8bfe\u538b\u529b\u8fc7\u5927\u800c\u653e\u5f03\u3002\n    *   **\u53d1\u6325\u793e\u4ea4\u4ef7\u503c**: \u9f13\u52b1\u5176\u62c5\u4efb\u5c0f\u7ec4\u957f\u6216\u540e\u671f\u6280\u672f\u5206\u4eab\u89d2\u8272\uff0c\u5c06\u5176\u793e\u4ea4\u80fd\u91cf\u8f6c\u5316\u4e3a\u5b66\u4e60\u751f\u4ea7\u529b\uff0c\u5de9\u56fa\u5176\u793e\u7fa4\u5f52\u5c5e\u611f\u548c\u6210\u5c31\u611f\u3002\n\n{\"core_type\": \"T4 \u793e\u4ea4\u9a71\u52a8\u63a2\u7d22\u8005 (\u6df7\u5408\u804c\u4e1a\u8f6c\u578b\u52a8\u673a)\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"24h\u5185\u6838\u67e5\u652f\u4ed8\u4e0e\u5bb6\u5ead\u77e5\u60c5\uff0c\u9996\u5468\u6821\u6b63\u53d8\u73b0\u9884\u671f\"}";
