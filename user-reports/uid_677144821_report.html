    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u4f4e**\u3002\u7528\u6237\u4e3a\u5b9d\u5988\uff0c\u5bfb\u6c42\u201c\u517c\u804c\u201d\u548c\u201c\u753b\u672c/\u5ba1\u542c\u201d\u7b49\u5177\u4f53\u5de5\u79cd\uff0c\u8868\u73b0\u51fa\u660e\u786e\u7684**\u53d8\u73b0\u5bfc\u5411**\u3002\u5bf9\u201c\u9700\u8981\u4ed8\u8d39\u5417\u201d\u7684\u8be2\u95ee\u663e\u793a\u5bf9\u6295\u5165\u6210\u672c\u7684\u654f\u611f\u3002\u6574\u4f53\u52a8\u673a\u504f\u5411**\u5b9e\u7528\u4e3b\u4e49**\uff0c\u5bf9\u6280\u80fd\u63d0\u5347\u7684\u957f\u671f\u5174\u8da3\u4e0d\u660e\u663e\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u6781\u4f4e**\u3002\u4fe1\u606f\u4e25\u91cd\u4e0d\u8db3\u3002\u4ec5\u77e5\u7528\u6237\u4e3a\u201c\u5b9d\u5988\u201d\uff0c\u6709\u201c\u65f6\u95f4\u201d\u3002**\u5b8c\u5168\u7f3a\u5931**\u5173\u952e\u4fe1\u606f\uff1a\u5bb6\u5ead\u7ecf\u6d4e\u72b6\u51b5\u3001\u53ef\u652f\u914d\u5b66\u4e60\u65f6\u95f4\u3001\u8bbe\u5907\u6761\u4ef6\u3001\u5bb6\u5ead\u652f\u6301\u5ea6\u3001\u8fc7\u5f80\u7ecf\u9a8c/\u6559\u80b2\u80cc\u666f\u3002\u7528\u6237\u8be2\u95ee\u201c\u5f55\u5c4f\u884c\u5417\u201d\u3001\u201c\u6211\u8fd9\u91cc\u548b\u6ca1\u6709\u8bed\u97f3\u5f55\u5236\u5462\u201d\uff0c\u6697\u793a**\u8bbe\u5907\u4e0e\u6570\u5b57\u6280\u80fd\u57fa\u7840\u53ef\u80fd\u8584\u5f31**\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u4e2d\u7b49\u504f\u4f4e**\u3002\u7528\u6237\u914d\u5408\u5ea6\u9ad8\uff08\u5b8c\u6210\u6240\u6709\u6253\u5361\u3001\u4f5c\u4e1a\u3001\u9884\u7ea6\uff09\uff0c\u884c\u52a8\u529b\u5c1a\u53ef\u3002\u4f46\u63d0\u95ee\u201c\u6ca1\u5b66\u8fc7\u4e5f\u53ef\u4ee5\u5417\u201d\u3001\u201c\u8981\u600e\u6837\u6539\u53d8\u97f3\u8272\u201d\u663e\u793a\u51fa**\u5bf9\u81ea\u8eab\u80fd\u529b\u7684\u4e0d\u786e\u5b9a\u548c\u7126\u8651**\u3002\u4e2d\u9014\u9000\u51fa\u4e00\u6b21\u76f4\u64ad\uff08\u201c\u8001\u5e08\u6709\u70b9\u4e8b \u9000\u4e86\u201d\uff09\uff0c\u4f46\u88ab\u529d\u56de\u540e\u7ee7\u7eed\u8ddf\u8fdb\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u575a\u6301\u5ea6\u4f46\u6613\u53d7\u5e72\u6270\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u5df2\u652f\u4ed87380\u5143\u62a5\u540d\u201c\u9ad8\u9636\u201d\u8bfe\u7a0b\uff0c\u5e76\u6dfb\u52a0\u65b0\u73ed\u4e3b\u4efb\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u914d\u5076\u6216\u5176\u4ed6\u5bb6\u5ead\u6210\u5458\u610f\u89c1\u3002\u4f5c\u4e3a\u5b9d\u5988\uff0c**\u5bb6\u5ead\u51b3\u7b56\u6743\u662f\u91cd\u5927\u98ce\u9669\u70b9**\uff0c\u4f46\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u4e0e\u8d44\u6e90\u521d\u6b65\u5224\u65ad**: \u52a8\u673a\u660e\u786e\uff08\u517c\u804c\u53d8\u73b0\uff09\uff0c\u4f46\u8d44\u6e90\u5e95\u5ea7\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931\uff0c\u5fc3\u7406\u5f39\u6027\u4e00\u822c\u3002**\u521d\u6b65\u8fdb\u5165B\u7c7b\uff08\u52a8\u673a\u660e\u786e\u4f46\u8d44\u6e90\u5b58\u7591\uff09**\u3002\n*   **\u6b65\u9aa42 - \u627f\u8bfa\u5ea6\u4e0e\u884c\u52a8\u529b\u9a8c\u8bc1**: \u627f\u8bfa\u5ea6**\u9ad8**\uff08\u5b8c\u6210\u5168\u90e8\u6307\u5b9a\u52a8\u4f5c\uff09\uff0c\u884c\u52a8\u529b**\u4e2d\u7b49**\uff08\u6309\u65f6\u5b8c\u6210\uff0c\u4f46\u9700\u591a\u6b21\u63d0\u9192\uff09\u3002\n*   **\u6b65\u9aa43 - \u6297\u98ce\u9669\u4e0e\u957f\u671f\u4ef7\u503c\u8bc4\u4f30**: **\u6297\u98ce\u9669\u80fd\u529b\u672a\u77e5**\u3002\u56e0\u8d44\u6e90\u4fe1\u606f\u7f3a\u5931\uff0c\u65e0\u6cd5\u8bc4\u4f30\u5176\u5e94\u5bf9\u5b66\u4e60\u632b\u6298\u3001\u65f6\u95f4\u51b2\u7a81\u6216\u53d8\u73b0\u5ef6\u8fdf\u7684\u80fd\u529b\u3002\u957f\u671f\u4ef7\u503c\u8ba4\u540c\u611f**\u4f4e**\uff0c\u5173\u6ce8\u70b9\u59cb\u7ec8\u5728\u201c\u63a5\u5355\u201d\u3001\u201c\u5de5\u79cd\u201d\u3001\u201c\u52a0\u5165\u56e2\u961f\u201d\u3002\n*   **\u6b65\u9aa44 - \u7efc\u5408\u5224\u5b9a**: **B2\u578b (\u9ad8\u627f\u8bfa-\u4f4e\u8d44\u6e90-\u53d8\u73b0\u9a71\u52a8)**\u3002\u7528\u6237\u6709\u884c\u52a8\u610f\u613f\u548c\u521d\u6b65\u627f\u8bfa\uff0c\u4f46**\u8d44\u6e90\u5e95\u5ea7\u4e0d\u660e\u662f\u6700\u5927\u9690\u60a3**\uff0c\u4e14\u52a8\u673a\u9ad8\u5ea6\u529f\u5229\u5316\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **T4 \u529f\u5229\u53d8\u73b0\u8005**\u3002\u6838\u5fc3\u7279\u5f81\u9ad8\u5ea6\u543b\u5408\uff1a\u8eab\u4efd\u4e3a\u5b9d\u5988\uff0c\u6838\u5fc3\u8bc9\u6c42\u662f\u7075\u6d3b\u517c\u804c\u53d8\u73b0\uff0c\u5bf9\u201c\u753b\u672c\u201d\u3001\u201c\u5ba1\u542c\u201d\u3001\u201c\u52a0\u5165\u56e2\u961f\u201d\u7b49\u5177\u4f53\u53d8\u73b0\u8def\u5f84\u8868\u73b0\u51fa\u5174\u8da3\uff0c\u5bf9\u7406\u8bba\u5b66\u4e60\u6216\u957f\u671f\u6210\u957f\u5174\u8da3\u6de1\u8584\u3002**\u7f3a\u4e4fT6\uff08\u9ad8\u7126\u8651\u4ece\u4f17\u8005\uff09\u7684\u76f2\u76ee\u8ddf\u98ce\u611f\uff0c\u76ee\u6807\u76f8\u5bf9\u5177\u4f53**\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u6574\u4f53\u98ce\u9669\u7b49\u7ea7**: **\u9ad8**\u3002\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**: **\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u671f\u5f85\u5feb\u901f\u63a5\u5355\uff08\u201c\u8bd5\u97f3\u8ba2\u5355\u201d\u3001\u201c\u8fdb\u5267\u7ec4\u201d\uff09\uff0c\u4f46\u8bfe\u7a0b\u4ea4\u4ed8\u4e0e\u53d8\u73b0\u5b58\u5728\u65f6\u95f4\u5dee\u548c\u4e0d\u786e\u5b9a\u6027\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**: **\u672a\u77e5\u98ce\u9669**\u3002\u652f\u4ed87380\u5143\u5bf9\u5b9d\u5988\u5bb6\u5ead\u53ef\u80fd\u6784\u6210\u538b\u529b\uff0c\u4f46\u672a\u63d0\u53ca\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**: **\u9ad8\u98ce\u9669**\u3002\u5b9d\u5988\u8eab\u4efd\u610f\u5473\u7740\u5bb6\u5ead\u4e8b\u52a1\u53ef\u80fd\u968f\u65f6\u4e2d\u65ad\u5b66\u4e60\u3002\n    4.  **\u5185\u5bb9\u4e0d\u5339\u914d**: **\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5174\u8da3\u5728\u201c\u753b\u672c/\u5ba1\u542c\u201d\uff0c\u8bfe\u7a0b\u82e5\u4ee5\u201c\u6f14\u64ad\u201d\u4e3a\u4e3b\uff0c\u53ef\u80fd\u4ea7\u751f\u504f\u5dee\u3002\n    5.  **\u670d\u52a1\u4f53\u9a8c**: **\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u9500\u552e\u670d\u52a1\u8ddf\u8fdb\u7d27\u5bc6\uff0c\u4f53\u9a8c\u5c1a\u53ef\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9**: **\u9ad8\u98ce\u9669**\u3002**\u5173\u952e\u96f7\u533a**\u3002\u804a\u5929\u8bb0\u5f55\u5b8c\u5168\u672a\u6d89\u53ca\u914d\u5076\u6216\u5bb6\u5ead\u652f\u6301\uff0c\u662f\u6f5c\u5728\u7684\u7206\u53d1\u70b9\u3002\n    7.  **\u7ade\u54c1/\u8d1f\u9762\u4fe1\u606f**: **\u4f4e\u98ce\u9669**\u3002\u5f53\u524d\u672a\u4f53\u73b0\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5938\u5927\u5ba3\u4f20\u4e0e\u627f\u8bfa**: \u9500\u552e\u591a\u6b21\u4f7f\u7528\u201c\u76f4\u63a5\u8fdb\u5267\u7ec4\u201d\u3001\u201c\u5feb\u4eba\u4e00\u6b65\u201d\u3001\u201c\u73b0\u573a\u53d1\u798f\u5229\u52a9\u5b66\u91d1\u201d\u7b49\u8bdd\u672f\uff0c**\u5b58\u5728\u8bf1\u5bfc\u548c\u5938\u5927\u9884\u671f\u98ce\u9669**\u3002\n*   **\u4ef7\u683c\u4e0e\u4ef7\u503c\u4f20\u9012**: 7380\u5143\u201c\u9ad8\u9636\u201d\u8bfe\u7a0b\u7684\u4ef7\u683c\u672a\u5728\u804a\u5929\u4e2d\u5145\u5206\u8fdb\u884c\u4ef7\u503c\u94fa\u57ab\uff0c\u76f4\u63a5\u4ece\u201c\u8bd5\u97f3\u201d\u8df3\u5230\u201c\u62a5\u540d\u201d\uff0c**\u8f6c\u5316\u94fe\u8def\u6025\u4fc3\uff0c\u4ef7\u503c\u5851\u9020\u4e0d\u8db3**\u3002\n*   **\u77e5\u60c5\u540c\u610f**: \u7528\u6237\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u3001\u670d\u52a1\u5468\u671f\u3001\u53d8\u73b0\u6982\u7387\u7b49\u5173\u952e\u4fe1\u606f\u4e86\u89e3\u4e0d\u8db3\uff0c\u4e3b\u8981\u88ab\u201c\u63a5\u5355\u8d44\u6e90\u201d\u3001\u201c\u52a9\u5b66\u91d1\u201d\u5438\u5f15\u3002**\u77e5\u60c5\u540c\u610f\u4e0d\u5145\u5206**\u3002\n*   **\u5bb6\u5ead\u51b3\u7b56**: **\u91cd\u5927\u5408\u89c4\u6f0f\u6d1e**\u3002\u9500\u552e\u5168\u7a0b\u672a\u8be2\u95ee\u6216\u786e\u8ba4\u5bb6\u5ead\uff08\u5c24\u5176\u662f\u914d\u5076\uff09\u662f\u5426\u77e5\u60c5\u5e76\u652f\u6301\uff0c**\u8fdd\u53cd\u4e86\u9488\u5bf9\u5b9d\u5988\u7b49\u5bb6\u5ead\u51b3\u7b56\u8005\u7684\u5fc5\u8981\u98ce\u63a7\u6d41\u7a0b**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**: **\u504f\u5dee**\u3002\u7528\u6237\u76ee\u6807\uff08\u753b\u672c/\u5ba1\u542c\u517c\u804c\uff09\u4e0e\u5178\u578b\u6709\u58f0\u6f14\u64ad\u4e3b\u64ad\u57f9\u517b\u8bfe\u7a0b\u5b58\u5728\u65b9\u5411\u5dee\u5f02\uff0c\u9700\u5728\u540e\u7eed\u670d\u52a1\u4e2d\u91cd\u70b9\u6821\u6b63\u548c\u5339\u914d\u8d44\u6e90\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **24h\u5185\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\u4e0e\u652f\u4ed8\u80fd\u529b**\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**:\n    1.  **\u7d27\u6025\u98ce\u63a7\uff0824\u5c0f\u65f6\u5185\uff09**: \u65b0\u73ed\u4e3b\u4efb\u9996\u901a\u7535\u8bdd\u5fc5\u987b**\u6e29\u548c\u800c\u575a\u5b9a\u5730\u6838\u5b9e\u5bb6\u5ead\u7ecf\u6d4e\u72b6\u51b5\u53ca\u914d\u5076\u662f\u5426\u77e5\u60c5\u5e76\u652f\u6301\u672c\u6b21\u6559\u80b2\u6295\u8d44**\u3002\u8fd9\u662f\u9632\u6b62\u540e\u7eed\u9000\u8d39\u51b2\u7a81\u7684\u6838\u5fc3\u3002\n    2.  **\u9884\u671f\u7ba1\u7406\uff08\u9996\u5468\uff09**: \u660e\u786e\u544a\u77e5\u201c\u753b\u672c/\u5ba1\u542c\u201d\u5c97\u4f4d\u7684\u6280\u80fd\u8981\u6c42\u3001\u5b66\u4e60\u8def\u5f84\u3001\u5e02\u573a\u4f9b\u9700\u53ca\u53d8\u73b0\u5468\u671f\uff0c**\u964d\u4f4e\u5176\u4e0d\u5207\u5b9e\u9645\u7684\u5feb\u901f\u53d8\u73b0\u9884\u671f**\u3002\u5c06\u8bfe\u7a0b\u4ef7\u503c\u4ece\u201c\u63a5\u5355\u201d\u5411\u201c\u638c\u63e1\u53ef\u8fc1\u79fb\u6280\u80fd\u201d\u9002\u5ea6\u5f15\u5bfc\u3002\n    3.  **\u8d44\u6e90\u652f\u6301**: \u4e86\u89e3\u5176\u6bcf\u65e5\u53ef\u56fa\u5b9a\u6295\u5165\u7684\u5b66\u4e60\u65f6\u95f4\u6bb5\u548c\u8bbe\u5907\u6761\u4ef6\uff08\u624b\u673a/\u7535\u8111/\u73af\u5883\uff09\uff0c\u63d0\u4f9b\u6700\u4f4e\u53ef\u884c\u6027\u7684\u5b66\u4e60\u65b9\u6848\u3002\n    4.  **\u6301\u7eed\u5173\u6ce8**: \u91cd\u70b9\u89c2\u5bdf\u5176\u9047\u5230\u7b2c\u4e00\u4e2a\u5b66\u4e60\u96be\u70b9\u6216\u65f6\u95f4\u51b2\u7a81\u65f6\u7684\u53cd\u5e94\uff0c\u63d0\u524d\u4ecb\u5165\u758f\u5bfc\uff0c\u9632\u6b62\u56e0\u632b\u8d25\u611f\u6216\u5bb6\u5ead\u4e8b\u52a1\u76f4\u63a5\u653e\u5f03\u3002\n\n{\"core_type\": \"T4 \u529f\u5229\u53d8\u73b0\u8005\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"product_match\": \"\u504f\u5dee\", \"action\": \"24h\u5185\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\u4e0e\u652f\u4ed8\u80fd\u529b\"}";
