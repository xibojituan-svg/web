    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n> **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4e2d\u7f3a\u5931\u5173\u4e8e\u7528\u6237**\u652f\u4ed8\u80fd\u529b\uff08\u8d44\u91d1\u6765\u6e90\u3001\u662f\u5426\u501f\u6b3e\uff09**\u3001**\u5bb6\u5ead\u51b3\u7b56\u6743\uff08\u662f\u5426\u77e5\u60c5\u652f\u6301\uff09**\u3001**\u8fc7\u5f80\u5b66\u4e60/\u5de5\u4f5c\u7ecf\u5386**\u3001**\u660e\u786e\u7684\u6536\u5165\u9884\u671f**\u7b49\u5173\u952e\u4fe1\u606f\u3002\u5224\u65ad\u4e3b\u8981\u57fa\u4e8e\u7528\u6237\u884c\u4e3a\u6a21\u5f0f\u548c\u6709\u9650\u4e92\u52a8\u3002\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677164468 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-06 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u7c7d\u83f2(\u82cf\u7476\u7476) / \u6851\u6986\u975e\u665a\u97f36(\u82cf\u7476\u7476) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u9ad8\u9636\u8bfe\u7a0b (\u652f\u4ed87380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u652f\u4ed8\u8fc7\u7a0b\u5b58\u5728\u5468\u8f6c\u8ff9\u8c61** (\u5fae\u4fe1\u4f59\u989d\u4e0d\u8db3\uff0c\u9700\u4ed6\u4eba\u8f6c\u8d26\uff0c\u94f6\u884c\u5361\u652f\u4ed8\u53d7\u9650) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u81ea\u7531\u804c\u4e1a\uff0c\u53ef\u54cd\u5e94\u767d\u5929\u53ca\u665a\u4e0a\u7684\u76f4\u64ad\u3001\u4f5c\u4e1a) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** (\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u6210\u5458\uff0c\u65e0\u6cd5\u5224\u65ad) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931** (\u7528\u6237\u4e3b\u52a8\u8868\u8fbe\u6781\u5c11\uff0c\u591a\u4e3a\u88ab\u52a8\u56de\u590d\u548c\u5b8c\u6210\u6307\u4ee4) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u5bf9\u201c\u517c\u804c\u201d\u3001\u201c\u63a5\u5355\u201d\u3001\u201c\u5de5\u79cd\u201d\u7b49\u5173\u952e\u8bcd\u6709\u56de\u5e94\uff0c\u4f46\u5168\u7a0b\u672a\u4e3b\u52a8\u8be2\u95ee\u6536\u76ca\u7ec6\u8282\u6216\u8868\u8fbe\u5f3a\u70c8\u7684\u8d5a\u94b1\u6e34\u671b\uff0c\u66f4\u50cf\u662f\u5728\u9500\u552e\u5f15\u5bfc\u4e0b\u7684\u88ab\u52a8\u8ddf\u968f\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u80fd\u505a\u7684\u5de5\u79cd\uff1a1.\u753b\u672c2.\u5ba1\u542c\u201d (\u5728\u9500\u552e\u53cd\u590d\u50ac\u4fc3\u4e0b\u624d\u7ed9\u51fa\u56de\u5e94)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u652f\u4ed87380\u5143\u65f6\u51fa\u73b0\u201c\u5fae\u4fe1\u4f59\u989d\u4e0d\u8db3\uff0c\u7528\u94f6\u884c\u5361\u6709\u4e0d\u80fd\u7528\u201d\u7684\u60c5\u51b5\uff0c\u9700\u8981\u4ed6\u4eba\u8f6c\u8d26\u5468\u8f6c\uff0c\u8868\u660e**\u53ef\u652f\u914d\u8d44\u91d1\u7d27\u5f20**\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u81ea\u7531\u804c\u4e1a\u8eab\u4efd\uff0c\u65f6\u95f4\u76f8\u5bf9\u7075\u6d3b\uff0c\u80fd\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\uff0c\u4f46\u4e3b\u52a8\u6027\u4e0d\u5f3a\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u5b8c\u5168\u672a\u63d0\u53ca\uff0c\u6309\u6700\u77ed\u677f\u539f\u5219\uff0c\u89c6\u4e3a**\u4f4e**\u6216\u672a\u77e5\u98ce\u9669\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u9700\u95f4\u6b47\u6027\u5b89\u629a\u3002\u7528\u6237\u80fd\u5b8c\u6210\u6307\u4ee4\uff0c\u4f46\u5728\u652f\u4ed8\u73af\u8282\u9047\u5230\u6280\u672f\u95ee\u9898\u65f6\u8868\u73b0\u51fa**\u4f9d\u8d56\u9500\u552e\u6307\u5bfc**\uff0c\u9700\u8981\u4e00\u6b65\u6b65\u5f15\u5bfc\uff0c\u7f3a\u4e4f\u72ec\u7acb\u89e3\u51b3\u95ee\u9898\u7684\u80fd\u529b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u7684\u4e0d\u5728\u4e00\u4e2a\u5361\u4e0a\uff0c\u6709\u4e00\u4e2a\u5361\u63d0\u793a\u4e0d\u80fd\u652f\u4ed8\uff0c\u6211\u600e\u4e48\u529e\u201d (\u9047\u5230\u652f\u4ed8\u969c\u788d\u65f6\uff0c\u7b2c\u4e00\u53cd\u5e94\u662f\u6c42\u52a9\uff0c\u800c\u975e\u81ea\u884c\u5c1d\u8bd5\u89e3\u51b3)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u672a\u6765\u7684\u4e0d\u786e\u5b9a\u6027\u548c\u7ecf\u6d4e\u4e0d\u5b89\u5168\u611f**\u3002\u4f5c\u4e3a\u81ea\u7531\u804c\u4e1a\u8005\uff0c\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u4e00\u9879\u65b0\u6280\u80fd\uff08\u6709\u58f0\u6f14\u64ad\uff09\u6765\u83b7\u5f97\u4e00\u4efd\u7a33\u5b9a\u7684\u517c\u804c\u6536\u5165\u4fdd\u969c\uff0c\u62b5\u5fa1\u804c\u4e1a\u98ce\u9669\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u7684\u8def\u5f84\u89c4\u5212\u548c\u5b89\u5168\u611f\u7ed9\u4e88**\u3002\u4ed6\u9700\u8981\u6e05\u6670\u7684\u201c\u63a5\u5355-\u8d5a\u94b1\u201d\u8def\u7ebf\u56fe\uff0c\u4ee5\u53ca\u201c\u5b66\u4e86\u5c31\u80fd\u7528\uff0c\u7528\u4e86\u5c31\u80fd\u8d5a\u201d\u7684\u786e\u5b9a\u611f\uff0c\u6765\u7f13\u89e3\u5bf9\u672a\u6765\u7684\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1** \u7c7b (\u52a8\u673a\u4e2d\u7b49\u3001\u8d44\u6e90\u5e95\u5ea7\u8584\u5f31\u3001\u5b58\u5728\u652f\u4ed8\u5468\u8f6c\u8ff9\u8c61) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T5 \u597d\u73a9\u5c1d\u9c9c** (\u884c\u4e3a\u88ab\u52a8\uff0c\u8ddf\u968f\u5f15\u5bfc\uff0c\u5bf9\u201c\u5de5\u79cd\u201d\u3001\u201c\u8bd5\u620f\u201d\u7b49\u65b0\u9c9c\u4e8b\u7269\u6709\u56de\u5e94\uff0c\u4f46\u7f3a\u4e4f\u6b7b\u78d5\u7cbe\u795e\u548c\u660e\u786e\u76ee\u6807) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u867d\u652f\u4ed8\u5468\u8f6c\uff0c\u4f46\u672a\u8bc1\u5b9e\u4e3a\u501f\u8d37\u6216\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a/\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u4fe1\u606f\u7f3a\u5931\uff0c\u82e5\u4e3a\u9690\u7792\u5bb6\u4eba\u652f\u4ed8\uff0c\u98ce\u9669\u8f83\u9ad8\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u81ea\u7531\u804c\u4e1a\u65f6\u95f4\u867d\u7075\u6d3b\uff0c\u4f46\u7528\u6237\u4e3b\u52a8\u6027\u5f31\uff0c\u82e5\u8bfe\u7a0b\u96be\u5ea6\u63d0\u5347\u6216\u9700\u8981\u66f4\u591a\u81ea\u5f8b\u7ec3\u4e60\uff0c\u6613\u56e0\u62d6\u5ef6\u3001\u8ddf\u4e0d\u4e0a\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4e2d** | \u652f\u4ed8\u73af\u8282\u5df2\u663e\u4f9d\u8d56\uff0c\u82e5\u540e\u7eed\u8f6f\u4ef6\u5b89\u88c5\u3001\u4f5c\u4e1a\u96be\u5ea6\u3001\u63a5\u5355\u7ade\u4e89\u7b49\u9047\u5230\u632b\u6298\uff0c\u53ef\u80fd\u56e0\u65e0\u52a9\u548c\u632b\u8d25\u611f\u800c\u653e\u5f03\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u201c\u753b\u672c\u3001\u5ba1\u542c\u201d\u7b49\u5de5\u79cd\u6709\u521d\u6b65\u8ba4\u77e5\uff0c\u82e5\u5f00\u8bfe\u540e\u53d1\u73b0\u63a5\u5355\u95e8\u69db\u9ad8\u3001\u5468\u671f\u957f\u3001\u6536\u76ca\u4e0e\u9884\u671f\u4e0d\u7b26\uff08\u5982\u7b2c\u4e00\u5468\u65e0\u6cd5\u63a5\u5355\uff09\uff0c\u6781\u6613\u56e0\u201c\u88ab\u9a97\u611f\u201d\u800c\u8981\u6c42\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7684\u7b2c1-2\u5468**\u3002\u5f53\u7406\u8bba\u8bfe\u7ed3\u675f\uff0c\u5f00\u59cb\u8981\u6c42\u81ea\u4e3b\u7ec3\u4e60\u3001\u5c1d\u8bd5\u63a5\u5355\u4f46\u5c61\u5c61\u53d7\u632b\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u540c\u5b66\u4f60\u597d\uff01\u770b\u5230\u4f60\u987a\u5229\u62a5\u540d\uff0c\u7279\u522b\u4e3a\u4f60\u9ad8\u5174\u3002\u6211\u77e5\u9053\u81ea\u7531\u804c\u4e1a\u6700\u9700\u8981\u7684\u5c31\u662f\u4e00\u4efd\u80fd\u81ea\u5df1\u638c\u63a7\u7684\u7a33\u5b9a\u6536\u5165\u6765\u6e90\u3002\u54b1\u4eec\u7684\u8bfe\u7a0b\u5c31\u662f\u4e3a\u4f60\u8fd9\u6837\u6709\u60f3\u6cd5\u4f46\u9700\u8981\u6e05\u6670\u8def\u5f84\u7684\u4eba\u8bbe\u8ba1\u7684\u3002\u522b\u62c5\u5fc3\u4e00\u5f00\u59cb\u4e0d\u719f\u7ec3\uff0c\u6211\u4f1a\u4e00\u6b65\u6b65\u5e26\u4f60\uff0c\u4ece\u7b2c\u4e00\u4e2a\u5c0f\u5355\u5b50\u5f00\u59cb\uff0c\u54b1\u4eec\u7a33\u624e\u7a33\u6253\uff0c\u628a\u8fd9\u4efd\u517c\u804c\u6536\u5165\u843d\u5230\u5b9e\u5904\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5feb\u901f\u63a5\u5355\u7ebf**\u3011\u3002\u5fc5\u987b\u4f18\u5148\u6ee1\u8db3\u5176\u201c\u7126\u8651\u4fdd\u969c\u201d\u9700\u6c42\uff0c\u5feb\u901f\u5bfc\u5411\u80fd\u4ea7\u751f\u5fae\u5c0f\u6b63\u53cd\u9988\u7684\u5b9e\u64cd\u548c\u63a5\u5355\u673a\u4f1a\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T5\u5c1d\u9c9c\u578b\u53ca\u652f\u4ed8\u80fd\u529b\u5f31\u7684\u7279\u70b9\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a\u3010**\u4fdd\u59c6\u5f0f\u5de5\u5177\u6307\u5bfc\u5305**\u3011\uff08\u89e3\u51b3\u8f6f\u4ef6\u3001\u8bbe\u5907\u95ee\u9898\uff09\u3001\u3010**\u5fae\u5355\u5b9e\u6218\u4f18\u5148\u901a\u9053**\u3011\uff08\u63d0\u4f9b\u4f4e\u95e8\u69db\u3001\u5feb\u7ed3\u7b97\u7684\u8bd5\u97f3\u673a\u4f1a\uff0c\u54ea\u6015\u5355\u4ef7\u4f4e\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7edd\u4e0d\u5bf9\u4ed6\u7a7a\u8c08\u201c\u58f0\u97f3\u827a\u672f\u201d\u3001\u201c\u957f\u8fdc\u53d1\u5c55\u201d\uff1b\u7edd\u4e0d\u5728\u5176\u672a\u5b8c\u6210\u7b2c\u4e00\u4e2a\u5c0f\u76ee\u6807\u524d\u63a8\u4ecb\u4efb\u4f55\u5347\u5355\u6216\u9ad8\u4ef7\u8bbe\u5907\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u901a\u8fc7\u57fa\u7840\u63a5\u5355\u83b7\u5f97\u7a33\u5b9a\u611f\u548c\u6b63\u6536\u76ca\u524d\uff0c\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u4f1a\u6781\u5927\u52a0\u5267\u5176\u7ecf\u6d4e\u538b\u529b\u548c\u9000\u8d39\u98ce\u9669\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u662f\u81ea\u7531\u804c\u4e1a\u201d **(\u8d44\u6e90\u4e0e\u72b6\u6001\u5b9a\u4f4d)**\n2. > \u201c\u6211\u7684\u4e0d\u5728\u4e00\u4e2a\u5361\u4e0a\uff0c\u6709\u4e00\u4e2a\u5361\u63d0\u793a\u4e0d\u80fd\u652f\u4ed8\uff0c\u6211\u600e\u4e48\u529e\u201d **(\u8d44\u91d1\u627f\u8f7d\u529b\u5f31\u3001\u4f9d\u8d56\u6027\u5f3a)**\n3. > \u201c\u80fd\u505a\u7684\u5de5\u79cd\uff1a1.\u753b\u672c2.\u5ba1\u542c\u201d **(\u5728\u5f3a\u70c8\u5f15\u5bfc\u4e0b\u624d\u7ed9\u51fa\u76ee\u6807\u56de\u5e94\uff0c\u52a8\u673a\u88ab\u52a8)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T5\u597d\u73a9\u5c1d\u9c9c\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\uff08\u7126\u8651\u4fdd\u969c\uff09**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u5728\u5f00\u8bfe\u4e24\u5468\u5185\uff0c\u7528\u201c\u4fdd\u59c6\u5f0f\u6307\u5bfc+\u5fae\u5355\u5feb\u53cd\u201d\u5e2e\u4ed6\u8d5a\u5230\u7b2c\u4e00\u7b14\u5c0f\u94b1\uff0c\u5efa\u7acb\u786e\u5b9a\u6027\u548c\u4fe1\u5fc3**\u3002\n\n```json\n{\"core_type\": \"T5 \u597d\u73a9\u5c1d\u9c9c\u578b\", \"maslow_need\": \"\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf\"}\n```";
