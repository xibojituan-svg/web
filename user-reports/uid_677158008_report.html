    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4e2d**\u7f3a\u5931\u652f\u4ed8\u65b9\u5f0f\u3001\u5bb6\u5ead\u8d22\u52a1\u72b6\u51b5\u3001\u5177\u4f53\u804c\u4e1a\u4e0e\u6536\u5165\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\uff08\u5c24\u5176\u662f\u914d\u5076\u6001\u5ea6\uff09** \u7b49\u5173\u952e\u4fe1\u606f\uff0c\u5bfc\u81f4\u8d44\u6e90\u5e95\u5ea7\u4e0e\u5bb6\u5ead\u652f\u6301\u5ea6\u8bc4\u4f30\u3001\u9000\u8d39\u98ce\u9669\u9884\u5224\u5b58\u5728\u8f83\u5927\u4e0d\u786e\u5b9a\u6027\u3002\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677158008 / Lisawusa |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u738b\u6708\u79c0 (\u9500\u552e/\u52a9\u6559) -> \u5b54\u4ee4\u5a77 (\u73ed\u4e3b\u4efb\u53ef\u4e50) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | 7380\u5143\u8fdb\u9636\u73ed (\u542b2\u4e2a\u6708\u7cbe\u82f1\u73ed) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u7f3a\u5931** |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u9700\u7167\u987e\u5e7c\u513f\uff0c\u76f4\u64ad\u8bfe\u4f1a\u88ab\u6253\u65ad) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6709\u58f0\u6f14\u64ad\u7684\u5174\u8da3\u548c\u6280\u80fd\u63a2\u7d22\u6b32\uff08\u559c\u6b22\u79d1\u5e7b/\u54f2\u5b66/\u8a00\u60c5\uff0c\u9ad8\u667a\u89d2\u8272\uff09\uff0c\u5e76\u79ef\u6781\u53c2\u4e0e\u8bd5\u97f3\u548c\u4f5c\u4e1a\uff0c\u4f46**\u7f3a\u4e4f\u5bf9\u201c\u5feb\u901f\u53d8\u73b0\u201d\u7684\u6025\u5207\u8ffd\u95ee\u6216\u538b\u529b\u8868\u8ff0**\uff0c\u52a8\u673a\u66f4\u504f\u5411\u201c\u5b66\u4e60+\u5174\u8da3\u63a2\u7d22+\u6f5c\u5728\u53d8\u73b0\u201d\u7684\u6df7\u5408\u4f53\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u559c\u6b22\u79d1\u5e7b\u7c7b/\u54f2\u5b66\u7c7b/\u8a00\u60c5\u7c7b\u4e66\u7c4d\uff0c\u559c\u6b22\u9ad8\u667a\u7c7b\u89d2\u8272\u201d\uff1b > \u201c\u90fd\u53ef\u4ee5\u659c\u6760\u5c97\u4f4d\uff0c\u4f18\u5148\u540e\u671f\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u4fe1\u606f\u7f3a\u5931]** \u2014 \u672a\u63d0\u53ca\u652f\u4ed8\u538b\u529b\u6216\u7ecf\u6d4e\u72b6\u51b5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u2b07\u4f4e** \u2014 \u660e\u786e\u8868\u793a\u201c\u76f4\u64ad\u8bfe\u7a0b\u542c\u5230\u4e00\u534a\u5a03\u5c31\u9192\u4e86\u201d\uff0c\u663e\u793a\u5176\u65f6\u95f4\u88ab\u80b2\u513f\u8d23\u4efb\u9ad8\u5ea6\u788e\u7247\u5316\uff0c\u96be\u4ee5\u4fdd\u8bc1\u8fde\u7eed\u3001\u5b8c\u6574\u7684\u5b66\u4e60\u65f6\u6bb5\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u4fe1\u606f\u7f3a\u5931]** \u2014 \u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\uff0c\u4f46\u9700\u7167\u987e\u5e7c\u513f\uff0c\u53ef\u80fd\u5360\u7528\u5927\u91cf\u7cbe\u529b\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u9700\u95f4\u6b47\u6027\u5b89\u629a\u3002\u7528\u6237\u80fd\u4e3b\u52a8\u5b8c\u6210\u4f5c\u4e1a\u3001\u63d0\u95ee\uff08\u5982\u4f55\u56de\u770b\u76f4\u64ad\uff09\uff0c\u5e76\u793c\u8c8c\u81f4\u8c22\uff0c\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u81ea\u4e3b\u6027\u548c\u914d\u5408\u5ea6\u3002\u4f46**\u65f6\u95f4\u88ab\u80b2\u513f\u6253\u65ad\u540e\u7684\u4e3b\u52a8\u6c42\u52a9**\uff0c\u6697\u793a\u5176\u53ef\u80fd\u9700\u8981\u5916\u90e8\u652f\u6301\u6765\u7ef4\u6301\u5b66\u4e60\u8282\u594f\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5e08\u5144\u597d\uff0c\u76f4\u64ad\u8bfe\u7a0b\u542c\u5230\u4e00\u534a\u5a03\u5c31\u9192\u4e86\uff0c\u540e\u534a\u8282\u6ca1\u542c\u5230\u3002\u4e0d\u77e5\u9053\u600e\u4e48\u6837\u91cd\u65b0\u5b66\u4e60\u4e00\u4e0b\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u88ab\u80b2\u513f\u8d23\u4efb\u6346\u7ed1\u7684\u201c\u81ea\u6211\u201d\u7f3a\u5931\u611f**\u3002\u5979\u7684\u65f6\u95f4\u88ab\u5b69\u5b50\u5207\u5272\uff0c\u6e34\u671b\u4e00\u4e2a\u80fd\u8bc1\u660e\u81ea\u6211\u4ef7\u503c\u3001\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u548c\u793e\u7fa4\u5f52\u5c5e\u7684\u201c\u6210\u4eba\u8eab\u4efd\u201d\u51fa\u53e3\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u201d\u7684\u5c0a\u91cd\u611f\u548c\u201c\u5988\u5988\u4e5f\u80fd\u6709\u4e8b\u4e1a\u201d\u7684\u793e\u7fa4\u5f52\u5c5e\u611f**\u3002\u63d0\u4f9b\u4e00\u79cd\u201c\u5373\u4f7f\u65f6\u95f4\u788e\u7247\u5316\uff0c\u4f60\u4e5f\u80fd\u8fdb\u6b65\u5e76\u88ab\u4e13\u4e1a\u5708\u5b50\u63a5\u7eb3\u201d\u7684\u786e\u5b9a\u6027\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1** \u7c7b (\u52a8\u673a\u4e2d\u7b49\u3001\u8d44\u6e90\u5e95\u5ea7\u5b58\u5728\u660e\u663e\u77ed\u677f\u3010\u65f6\u95f4\u3011\u3001\u914d\u5408\u5ea6\u5c1a\u53ef) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T5 \u597d\u73a9\u5c1d\u9c9c** (\u504f\u5b66\u4e60\u63a2\u7d22\u5174\u8da3) \u4e0e **T2 \u4f4e\u8c03\u5b9e\u5e72** (\u8ba4\u771f\u5b8c\u6210\u4f5c\u4e1a) \u7684\u6df7\u5408\u4f53\uff0c\u5f53\u524d\u66f4\u504f\u5411T5\u3002 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u7b49\u7ea2\u7ebf\u4fe1\u606f\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** (\u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u9700\u8b66\u60d5) | \u82e5\u4e3a\u9690\u7792\u914d\u5076\u4f7f\u7528\u5bb6\u5ead\u50a8\u84c4\u652f\u4ed8\uff0c\u540e\u7eed\u53ef\u80fd\u56e0\u7ecf\u6d4e\u538b\u529b\u6216\u914d\u5076\u53cd\u5bf9\u5f15\u53d1\u51b2\u7a81\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669\uff01** \u56e0\u80b2\u513f\u5bfc\u81f4\u65e0\u6cd5\u6309\u65f6\u8ddf\u76f4\u64ad\u3001\u5b8c\u6210\u4f5c\u4e1a\uff0c\u4ea7\u751f\u79ef\u538b\u548c\u632b\u8d25\u611f\uff0c\u6700\u7ec8\u81ea\u6211\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u7528\u6237\u6c9f\u901a\u793c\u8c8c\u3001\u4e3b\u52a8\uff0c\u65e0\u660e\u663e\u60c5\u7eea\u5316\u6216\u4f9d\u8d56\u503e\u5411\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u82e5\u8fdb\u5165\u6b63\u5f0f\u5b66\u4e60\u540e\uff0c\u53d1\u73b0\u53d8\u73b0\u901f\u5ea6\u8fdc\u4f4e\u4e8e\u9884\u671f\uff08\u5c24\u5176\u662f\u65f6\u95f4\u6295\u5165\u4ea7\u51fa\u6bd4\u4f4e\uff09\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\u3002\u5f53\u8bfe\u7a0b\u8282\u594f\u52a0\u5feb\u3001\u4f5c\u4e1a\u96be\u5ea6\u548c\u5bc6\u5ea6\u63d0\u5347\uff0c\u4e0e\u80b2\u513f\u65f6\u95f4\u51b2\u7a81\u52a0\u5267\u65f6\uff0c\u662f\u6700\u6613\u5d29\u6e83\u653e\u5f03\u7684\u8282\u70b9\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cLisa\u5988\u5988/\u59d0\u59b9\uff0c\u770b\u5230\u4f60\u8bad\u7ec3\u8425\u671f\u95f4\u5e26\u5a03\u8fd8\u90a3\u4e48\u8ba4\u771f\u4ea4\u4f5c\u4e1a\uff0c\u7279\u522b\u4f69\u670d\uff01\u54b1\u4eec\u73ed\u597d\u591a\u5b9d\u5988\uff0c\u90fd\u8ddf\u4f60\u60c5\u51b5\u7c7b\u4f3c\u3002\u54b1\u4eec\u7684\u8bfe\u7a0b\u8bbe\u8ba1\u548c\u4f5c\u4e1a\u63d0\u4ea4\u65f6\u95f4\u90fd\u975e\u5e38\u7075\u6d3b\uff0c**\u5b8c\u5168\u4e3a\u4f60\u8fd9\u6837\u65f6\u95f4\u88ab\u5207\u788e\u4f46\u6709\u5fc3\u5b66\u4e60\u7684\u5988\u5988\u91cf\u8eab\u6253\u9020**\u3002\u4ee5\u540e\u76f4\u64ad\u770b\u56de\u653e\u5c31\u884c\uff0c\u6709\u4efb\u4f55\u65f6\u95f4\u5b89\u6392\u4e0a\u7684\u56f0\u96be\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4eec\u4e00\u8d77\u60f3\u529e\u6cd5\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5174\u8da3\u6e38\u4e50\u7ebf\u3011** (\u4f18\u5148\u4fdd\u62a4\u5b66\u4e60\u5174\u8da3\u548c\u793e\u7fa4\u5f52\u5c5e\u611f\uff0c\u964d\u4f4e\u53d8\u73b0\u538b\u529b) + **\u3010\u659c\u6760\u521b\u6536\u7ebf\u3011** (\u5339\u914d\u5176\u201c\u4f18\u5148\u540e\u671f\u201d\u7684\u5174\u8da3\u70b9\uff0c\u63d0\u4f9b\u591a\u5143\u5316\u53c2\u4e0e\u53ef\u80fd)\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u3010\u7075\u6d3b\u65f6\u95f4\u7ba1\u7406\u5305\u3011** (\u63d0\u4f9b\u6240\u6709\u8bfe\u7a0b\u7684\u9ad8\u6e05\u56de\u653e\u3001\u788e\u7247\u5316\u5b66\u4e60\u6307\u5357\u3001\u5f39\u6027\u4f5c\u4e1a\u63d0\u4ea4\u7a97\u53e3)\uff1b **\u3010\u5b9d\u5988\u5171\u5b66\u793e\u7fa4\u3011** (\u5c06\u5176\u5f15\u5165\u6709\u76f8\u4f3c\u80cc\u666f\u7684\u5b66\u5458\u5c0f\u7ec4\uff0c\u589e\u5f3a\u5f52\u5c5e\u611f\u548c\u4e92\u52a9)\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7edd\u4e0d\u5bf9\u5979\u5f3a\u8c03\u201c\u5fc5\u987b\u51c6\u65f6\u76f4\u64ad\u201d\u3001\u201c\u6bcf\u5929\u56fa\u5b9a\u51e0\u5c0f\u65f6\u7ec3\u4e60\u201d\uff0c\u8fd9\u4f1a\u76f4\u63a5\u5f15\u7206\u5176\u65f6\u95f4\u7126\u8651\u3002\u907f\u514d\u7528\u201c\u522b\u4eba\u5168\u804c\u5b66\u4e60\u5f88\u5feb\u63a5\u5355\u201d\u7684\u4f8b\u5b50\u65bd\u538b\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u786e\u8ba4\u5176\u65f6\u95f4\u56f0\u5883\u5f97\u5230\u7f13\u89e3\u3001\u5b66\u4e60\u8fdb\u5165\u7a33\u5b9a\u6b63\u5faa\u73af\u4e4b\u524d\uff0c\u7981\u6b62\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5e08\u5144\u597d\uff0c\u76f4\u64ad\u8bfe\u7a0b\u542c\u5230\u4e00\u534a\u5a03\u5c31\u9192\u4e86\uff0c\u540e\u534a\u8282\u6ca1\u542c\u5230\u3002\u4e0d\u77e5\u9053\u600e\u4e48\u6837\u91cd\u65b0\u5b66\u4e60\u4e00\u4e0b\u201d **(\u6838\u5fc3\u77ed\u677f\uff1a\u65f6\u95f4\u88ab\u80b2\u513f\u5207\u5272)**\n2. > \u201c\u559c\u6b22\u79d1\u5e7b\u7c7b/\u54f2\u5b66\u7c7b/\u8a00\u60c5\u7c7b\u4e66\u7c4d\uff0c\u559c\u6b22\u9ad8\u667a\u7c7b\u89d2\u8272\u201d **(\u52a8\u673a\uff1a\u5174\u8da3\u63a2\u7d22\u5bfc\u5411)**\n3. > \u201c\u90fd\u53ef\u4ee5\u659c\u6760\u5c97\u4f4d\uff0c\u4f18\u5148\u540e\u671f\u201d **(\u76ee\u6807\uff1a\u591a\u5143\u63a2\u7d22\uff0c\u975e\u5355\u4e00\u53d8\u73b0\u6267\u5ff5)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010\u65f6\u95f4\u788e\u7247\u5316\u7684\u5174\u8da3\u63a2\u7d22\u578b\u5b9d\u5988\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u5988\u5988\u8eab\u4efd\u4e4b\u5916\u83b7\u5f97\u4e13\u4e1a\u8ba4\u540c\u548c\u793e\u7fa4\u5f52\u5c5e\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u504f\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u81f4\u7075\u6d3b\u7684\u65f6\u95f4\u89e3\u51b3\u65b9\u6848\u548c\u6784\u5efa\u5b9d\u5988\u5171\u5b66\u652f\u6301\u7cfb\u7edf\u3011**\u3002\n\n```json\n{\"core_type\": \"T5 \u597d\u73a9\u5c1d\u9c9c\u578b (\u504fT2\u6df7\u5408)\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u793e\u4ea4/\u5c0a\u91cd\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf+\u659c\u6760\u521b\u6536\u7ebf\"}\n```";
