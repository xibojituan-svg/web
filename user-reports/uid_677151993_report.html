    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u4e0e\u98ce\u9669\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u7f3a\u5c11\u652f\u4ed8\u73af\u8282\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u5177\u4f53\u804c\u4e1a\u4e0e\u6536\u5165\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u3001\u8be6\u7ec6\u65f6\u95f4\u6295\u5165\u627f\u8bfa\u7b49\u4fe1\u606f\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a**\u4e2d\u7b49**\u3002\u660e\u786e\u517c\u804c\u53d8\u73b0\u76ee\u7684\uff08\u5728\u804c\uff0c\u517c\u804c\uff09\uff0c\u5bf9\u201c\u63a5\u5355\u201d\u3001\u201c\u5de5\u4f5c\u5ba4\u201d\u3001\u201c\u8d44\u6e90\u201d\u7b49\u53d8\u73b0\u8def\u5f84\u8868\u73b0\u51fa\u5f3a\u70c8\u5174\u8da3\u3002\u4f46\u5b66\u4e60\u52a8\u673a\u4e0e\u53d8\u73b0\u9884\u671f\u9ad8\u5ea6\u7ed1\u5b9a\uff0c\u5b58\u5728**\u529f\u5229\u5316\u5b66\u4e60**\u503e\u5411\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u63a8\u6d4b\u4e2d\u7b49\u504f\u4f4e**\u3002\u5df2\u77e5\u4e3a\u5728\u804c\u72b6\u6001\uff0c\u6709\u5bb6\u5ead\uff08\u9700\u7167\u987e\u5c0f\u5b69\uff09\uff0c\u8868\u660e\u6709\u57fa\u7840\u6536\u5165\u4f46\u65f6\u95f4\u788e\u7247\u5316\uff08\u65e9\u4e0a\u6709\u7a7a\uff0c\u4e0b\u5348\u665a\u4e0a\u65f6\u95f4\u5c11\uff09\u3002\u672a\u900f\u9732\u5177\u4f53\u804c\u4e1a\u3001\u6536\u5165\u6c34\u5e73\u53ca\u53ef\u6295\u5165\u7684\u5b66\u4e60\u9884\u7b97\uff0c\u8d44\u6e90\u6e05\u6670\u5ea6\u4e0d\u8db3\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a**\u4e2d\u7b49\u504f\u9ad8**\u3002\u7528\u6237\u4e3b\u52a8\u3001\u914d\u5408\u5ea6\u9ad8\uff08\u6309\u65f6\u56de\u590d\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u9884\u7ea6\u76f4\u64ad\uff09\uff0c\u80fd\u63d0\u51fa\u5177\u4f53\u6280\u672f\u95ee\u9898\uff08\u5373\u68a6AI\u529f\u80fd\uff09\uff0c\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u63a2\u7d22\u6b32\u548c\u5b66\u4e60\u97e7\u6027\u3002\u4f46\u5bf9\u8bfe\u7a0b\u7ed3\u6784\u4e0e\u957f\u671f\u627f\u8bfa\uff083.5\u4e2a\u6708\uff09\u5b58\u5728\u7591\u8651\uff0c\u53cd\u590d\u786e\u8ba4\u798f\u5229\u4e0e\u8d44\u6e90\u6301\u7eed\u6027\uff0c\u663e\u793a\u51fa**\u8c28\u614e\u4e0e\u7ed3\u679c\u5bfc\u5411**\u7684\u5fc3\u6001\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 \u652f\u4ed8\u6838\u67e5**\uff1a**\u672a\u89c2\u5bdf\u5230\u652f\u4ed8\u884c\u4e3a**\u3002\u9500\u552e\u5df2\u53d1\u9001\u4f18\u60e0\u5238\u94fe\u63a5\uff0c\u7528\u6237\u8868\u8fbe\u4e86\u62a5\u540d\u610f\u5411\uff08\u201c\u5e94\u8be5\u662f\u7684\u201d\uff09\uff0c\u4f46\u672a\u5728\u8bb0\u5f55\u4e2d\u5b8c\u6210\u652f\u4ed8\u52a8\u4f5c\u3002**\u9700\u91cd\u70b9\u6838\u67e5**\u3002\n*   **\u6b65\u9aa41.5 \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u63d0\u53ca\u201c\u7167\u987e\u5c0f\u5b69\u201d\uff0c\u6697\u793a\u6709\u5bb6\u5ead\u8d23\u4efb\uff0c\u4f46\u672a\u63d0\u53ca\u914d\u5076\u6216\u5176\u4ed6\u5bb6\u5ead\u6210\u5458\u5bf9\u6559\u80b2\u6d88\u8d39\u7684\u77e5\u60c5\u6216\u540c\u610f\u60c5\u51b5\u3002**\u5b58\u5728\u5bb6\u5ead\u51b3\u7b56\u98ce\u9669\u76f2\u533a**\u3002\n*   **\u6b65\u9aa41-4 \u7efc\u5408\u5224\u5b9a**\uff1a\n    *   **A (\u652f\u4ed8\u80fd\u529b+\u610f\u613f)**\uff1a\u652f\u4ed8\u610f\u613f\u660e\u786e\uff0c\u4f46\u652f\u4ed8\u80fd\u529b\uff083980\u5143\uff09\u4e0e\u5bb6\u5ead\u8d22\u52a1\u5339\u914d\u5ea6\u672a\u77e5\u3002\n    *   **B (\u9700\u6c42\u5f3a\u5ea6)**\uff1a\u9700\u6c42\u5f3a\u5ea6\u9ad8\uff0c\u96c6\u4e2d\u4e8e\u201c\u63a5\u5355\u8d44\u6e90\u201d\u3001\u201c\u5de5\u4f5c\u5ba4\u6210\u5458\u8eab\u4efd\u201d\u7b49\u53d8\u73b0\u627f\u8bfa\u3002\n    *   **C (\u8ba4\u77e5\u5339\u914d)**\uff1a\u5b58\u5728**\u663e\u8457\u504f\u5dee**\u3002\u7528\u6237\u671f\u671b\u901a\u8fc73.5\u4e2a\u6708\u5b66\u4e60\u8fdb\u5165\u201c\u5de5\u4f5c\u5ba4\u201d\u83b7\u5f97\u7a33\u5b9a\u5546\u5355\uff0c\u5bf9AI\u77ed\u89c6\u9891\u6280\u80fd\u5b66\u4e60\u7684\u957f\u671f\u6027\u3001\u5e02\u573a\u7ade\u4e89\u53ca\u4e2a\u4eba\u6295\u5165\u8ba4\u77e5\u53ef\u80fd\u4e0d\u8db3\u3002\n    *   **D (\u884c\u52a8\u529b)**\uff1a\u884c\u52a8\u529b\u5f3a\uff0c\u914d\u5408\u5ea6\u9ad8\u3002\n    *   **\u521d\u6b65\u5206\u7c7b**\uff1a\u503e\u5411 **B\u7c7b\uff08\u5f3a\u9700\u6c42\u9a71\u52a8\u578b\uff09**\uff0c\u4f46\u9700\u5b8c\u6210\u652f\u4ed8\u4e0e\u5bb6\u5ead\u77e5\u60c5\u6838\u67e5\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b\uff1aT5 \u529f\u5229\u52a1\u5b9e\u8005**\u3002\n    *   **\u6838\u5fc3\u7279\u5f81**\uff1a\u76ee\u6807\u660e\u786e\uff08\u517c\u804c\u8d5a\u94b1\uff09\uff0c\u884c\u52a8\u914d\u5408\uff0c\u4f46\u5bf9\u8bfe\u7a0b\u6548\u679c\u548c\u8d44\u6e90\u5151\u73b0\u62b1\u6709\u9ad8\u671f\u5f85\uff0c\u51b3\u7b56\u57fa\u4e8e\u201c\u6295\u8d44\u56de\u62a5\u201d\u8ba1\u7b97\u3002\n    *   **\u543b\u5408\u70b9**\uff1a\u53cd\u590d\u786e\u8ba4\u201c\u8bfe\u7a0b\u540e\u662f\u5426\u8fd8\u7ed9\u5355\u201d\u3001\u201c\u5de5\u4f5c\u5ba4\u6210\u5458\u201d\u8d44\u683c\u3001\u8bfe\u7a0b\u5b89\u6392\u662f\u5426\u5f71\u54cd\u73b0\u6709\u751f\u6d3b\uff0c\u5747\u4f53\u73b0\u5f3a\u70c8\u7684\u7ed3\u679c\u5bfc\u5411\u548c\u98ce\u9669\u63a7\u5236\u610f\u8bc6\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669\u7b49\u7ea7\uff1a\u4e2d**\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u4e0d\u53ca\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa\u201c\u63a5\u5355\u8d44\u6e90\u201d\u3001\u201c\u5de5\u4f5c\u5ba4\u201d\u3001\u201c\u5546\u5355\u966a\u8dd1\u201d\uff0c\u6613\u4f7f\u7528\u6237\u4ea7\u751f\u201c\u5b66\u5b8c\u5373\u80fd\u63a5\u5355\u8d5a\u94b1\u201d\u7684\u9519\u8bef\u9884\u671f\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u4e2d\u98ce\u9669**\u30023980\u5143\u5bf9\u517c\u804c\u9700\u6c42\u7528\u6237\u53ef\u80fd\u662f\u4e00\u7b14\u4e0d\u5c0f\u5f00\u652f\uff0c\u82e5\u53d8\u73b0\u4e0d\u53ca\u9884\u671f\u6613\u5f15\u53d1\u7ecf\u6d4e\u540e\u6094\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5df2\u8868\u660e\u65f6\u95f4\u788e\u7247\u5316\uff08\u4ec5\u65e9\u4e0a\u6709\u7a7a\uff09\uff0c\u4e0e\u53ef\u80fd\u5bc6\u96c6\u7684\u8bfe\u7a0b\u5b89\u6392\u6216\u4f5c\u4e1a\u8981\u6c42\u53ef\u80fd\u4ea7\u751f\u51b2\u7a81\u3002\n    4.  **\u5185\u5bb9\u8d28\u91cf**\uff1a\u4fe1\u606f\u4e0d\u8db3\u3002\n    5.  **\u670d\u52a1\u4f53\u9a8c**\uff1a\u4fe1\u606f\u4e0d\u8db3\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u4e2d\u98ce\u9669**\u3002**\u5b58\u5728\u5bb6\u5ead\u51b3\u7b56\u9ed1\u7bb1**\uff0c\u82e5\u914d\u5076\u4e0d\u77e5\u60c5\u6216\u53cd\u5bf9\uff0c\u53ef\u80fd\u5f15\u53d1\u540e\u7eed\u7ea0\u7eb7\u3002\n    7.  **\u7ade\u54c1\u5bf9\u6bd4/\u51b2\u52a8\u6d88\u8d39**\uff1a\u4f4e\u98ce\u9669\u3002\u7528\u6237\u51b3\u7b56\u7ecf\u8fc7\u591a\u8f6e\u95ee\u7b54\uff0c\u76f8\u5bf9\u7406\u6027\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u2705 \u5408\u89c4\u70b9**\uff1a\u9500\u552e\u6d41\u7a0b\u5b8c\u6574\uff0c\u63d0\u4f9b\u4e86\u8bfe\u7a0b\u4fe1\u606f\u3001\u4ef7\u683c\u3001\u5b89\u6392\u3002\n*   **\u26a0\ufe0f \u98ce\u9669\u70b9**\uff1a\n    1.  **\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u8d44\u6e90\u7ed1\u5b9a**\uff1a**\u4e25\u91cd\u8fdd\u89c4**\u3002\u591a\u6b21\u5f3a\u8c03\u201c\u8fdb\u5de5\u4f5c\u5ba4\u201d\u3001\u201c\u5bf9\u63a5\u8d44\u6e90\u201d\u3001\u201c\u5546\u5355\u966a\u8dd1\u201d\uff0c\u5c06\u8bfe\u7a0b\u4ef7\u503c\u4e0e\u4e0d\u786e\u5b9a\u7684\u5916\u90e8\u8d44\u6e90\u8fc7\u5ea6\u6346\u7ed1\uff0c\u6d89\u5acc\u865a\u5047\u6216\u8bef\u5bfc\u6027\u5ba3\u4f20\u3002\n    2.  **\u5bb6\u5ead\u51b3\u7b56\u7f3a\u5931**\uff1a\u672a\u4e3b\u52a8\u8be2\u95ee\u6216\u786e\u8ba4\u5bb6\u5ead\u4e3b\u8981\u6210\u5458\u77e5\u60c5\u540c\u610f\uff0c**\u8fdd\u53cd\u91cd\u5927\u6d88\u8d39\u5bb6\u5ead\u77e5\u60c5\u539f\u5219**\u3002\n    3.  **\u652f\u4ed8\u73af\u8282\u7f3a\u5931**\uff1a\u8bb0\u5f55\u6b62\u4e8e\u53d1\u9001\u4f18\u60e0\u5238\uff0c\u672a\u89c2\u5bdf\u5230\u652f\u4ed8\u5b8c\u6210\u53ca\u540e\u7eed\u786e\u8ba4\uff0c\u6d41\u7a0b\u4e0d\u5b8c\u6574\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6\uff1a\u504f\u5dee**\u3002\u7528\u6237\u671f\u5f85\u7684\u662f\u201c\u8d44\u6e90\u5165\u53e3\u201d\u548c\u201c\u5feb\u901f\u53d8\u73b0\u901a\u9053\u201d\uff0c\u800c\u4ea7\u54c1\u6838\u5fc3\u662f\u6280\u80fd\u6559\u5b66\u3002\u5b58\u5728**\u671f\u671b\u503c\u7ba1\u7406**\u7684\u5de8\u5927\u6311\u6218\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a\n    1.  **\u652f\u4ed8\u4e0e\u5bb6\u5ead\u53cc\u91cd\u6838\u67e5**\uff1a\u572824\u5c0f\u65f6\u5185\uff0c\u9996\u8981\u786e\u8ba4\u652f\u4ed8\u662f\u5426\u5b8c\u6210\u3002\u652f\u4ed8\u540e\uff0c\u5fc5\u987b\u901a\u8fc7\u7535\u8bdd\u6216\u5fae\u4fe1\uff0c**\u6e29\u548c\u800c\u575a\u5b9a\u5730\u6838\u5b9e\u914d\u5076\u6216\u5176\u4ed6\u5bb6\u5ead\u4e3b\u8981\u6210\u5458\u662f\u5426\u77e5\u6653\u5e76\u540c\u610f\u6b64\u6b21\u6559\u80b2\u6d88\u8d39**\u3002\u8fd9\u662f\u98ce\u63a7\u5e95\u7ebf\u3002\n    2.  **\u9996\u5468\u6821\u6b63\u53d8\u73b0\u9884\u671f**\uff1a\u5728\u7528\u6237\u8fdb\u73ed\u540e\u7b2c\u4e00\u5468\uff0c\u73ed\u4e3b\u4efb\u9700\u91cd\u70b9\u6c9f\u901a\uff0c\u660e\u786e\u8bfe\u7a0b\u80fd\u63d0\u4f9b\u7684\u6280\u80fd\u3001\u77e5\u8bc6\u3001\u65b9\u6cd5\u8bba\uff0c\u4ee5\u53ca\u201c\u8d44\u6e90\u201d\u7684\u771f\u5b9e\u542b\u4e49\uff08\u5982\u4fe1\u606f\u6e20\u9053\u3001\u6848\u4f8b\u5206\u4eab\u3001\u800c\u975e\u4fdd\u8bc1\u8ba2\u5355\uff09\uff0c\u964d\u4f4e\u5176\u4e0d\u5207\u5b9e\u9645\u7684\u53d8\u73b0\u9884\u671f\u3002\n    3.  **\u65f6\u95f4\u7ba1\u7406\u652f\u6301**\uff1a\u9488\u5bf9\u5176\u788e\u7247\u5316\u65f6\u95f4\uff0c\u63d0\u4f9b\u7075\u6d3b\u7684\u5b66\u4e60\u8def\u5f84\u5efa\u8bae\u548c\u56de\u653e\u5229\u7528\u6307\u5357\uff0c\u9884\u9632\u56e0\u65f6\u95f4\u51b2\u7a81\u5bfc\u81f4\u7684\u5b66\u4e1a\u632b\u8d25\u3002\n    4.  **\u5173\u6ce8\u5b66\u4e60\u8fc7\u7a0b\u800c\u975e\u7ed3\u679c\u627f\u8bfa**\uff1a\u5728\u540e\u7eed\u670d\u52a1\u4e2d\uff0c\u5f15\u5bfc\u5176\u5173\u6ce8\u6280\u80fd\u63d0\u5347\u548c\u4e2a\u4eba\u4f5c\u54c1\u79ef\u7d2f\uff0c\u800c\u975e\u5355\u7eaf\u8ffd\u95ee\u201c\u4f55\u65f6\u7ed9\u5355\u201d\u3002\n\n{\"core_type\": \"T5 \u529f\u5229\u52a1\u5b9e\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u652f\u4ed8\u4e0e\u5bb6\u5ead\u77e5\u60c5\u53cc\u6838\u67e5\"}";
