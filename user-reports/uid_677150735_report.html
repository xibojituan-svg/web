    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u4e0e\u98ce\u9669\u8bca\u65ad\u62a5\u544a (UID: 677150735)\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49)**: \u5174\u8da3\u9a71\u52a8\u4e0e\u53d8\u73b0\u9700\u6c42\u6df7\u5408\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6709\u58f0\u6f14\u64ad\u7684\u6d53\u539a\u5174\u8da3\uff08\u201c\u6211\u559c\u6b22\u58f0\u4e50\u201d\u3001\u201c\u6e34\u671b\u5f97\u5230\u4f60\u7684\u4eb2\u81ea\u6307\u5bfc\u201d\uff09\uff0c\u5e76\u5bf9\u201c\u5168\u80fd\u4e3b\u64ad\u201d\u3001\u201c\u659c\u6760\u5de5\u4f5c\u201d\u7b49\u591a\u5143\u5316\u53d8\u73b0\u8def\u5f84\u8868\u73b0\u51fa\u5f3a\u70c8\u6e34\u671b\u3002\u52a8\u673a\u4e2d\u65e2\u6709\u4e2a\u4eba\u7231\u597d\u4e0e\u81ea\u6211\u5b9e\u73b0\u7684\u6210\u5206\uff0c\u4e5f\u5305\u542b\u660e\u786e\u7684\u526f\u4e1a/\u517c\u804c\u6536\u5165\u671f\u671b\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4fe1\u606f\u4e0d\u8db3)**: **\u5173\u952e\u4fe1\u606f\u7f3a\u5931**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u900f\u9732\u7528\u6237\u7684\u5e74\u9f84\u3001\u804c\u4e1a\u3001\u7ecf\u6d4e\u72b6\u51b5\u3001\u6bcf\u65e5\u53ef\u6295\u5165\u5b66\u4e60\u65f6\u95f4\u3001\u8bbe\u5907\u6761\u4ef6\u7b49\u5173\u952e\u8d44\u6e90\u4fe1\u606f\u3002\u4ec5\u4ece\u201c\u5168\u6c11K\u6b4c\u53ef\u4e2a\u4eba\u72ec\u5531\u5c112\u4e2a\u5c0f\u65f6\uff0c\u591a\u8fbe4\u5c0f\u65f6\u201d\u53ef\u63a8\u6d4b\u5176\u6709\u8f83\u591a\u4e1a\u4f59\u65f6\u95f4\uff0c\u4f46\u7a33\u5b9a\u6027\u672a\u77e5\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u7b49\u504f\u9ad8)**: \u5b66\u4e60\u914d\u5408\u5ea6\u9ad8\uff0c\u884c\u52a8\u529b\u5f3a\u3002\u7528\u6237\u80fd\u79ef\u6781\u54cd\u5e94\u9500\u552e\u6307\u4ee4\uff08\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u52a0\u76f4\u64ad\u3001\u4e0a\u9ea6\u4e92\u52a8\uff09\uff0c\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u4f5c\u4e1a\u5f55\u5236\uff09\u4f1a\u4e3b\u52a8\u53cd\u9988\u5e76\u793c\u8c8c\u6c9f\u901a\uff08\u201c\u8001\u5e08\u8f9b\u82e6\u4e86\uff0c\u665a\u5b89\u201d\uff09\u3002\u5bf9\u9500\u552e\u63cf\u7ed8\u7684\u84dd\u56fe\uff08\u201c\u4f7f\u6211\u91cd\u65b0\u5145\u6eff\u4e86\u5e0c\u671b\u201d\uff09\u8868\u73b0\u51fa\u8f83\u9ad8\u7684\u4fe1\u4efb\u4e0e\u79ef\u6781\u60c5\u7eea\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 (\u652f\u4ed8\u6838\u67e5)**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u4e8e4\u67088\u65e5\u5b8c\u6210\u201c\u6500\u767b\u8ba1\u5212\u7cbe\u82f1\u7248\u201d\u8bfe\u7a0b\u652f\u4ed8\u3002\n*   **\u6b65\u9aa41.5 (\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5)**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u65e0\u4efb\u4f55\u5173\u4e8e\u5bb6\u5ead\u5176\u4ed6\u6210\u5458\uff08\u5982\u914d\u5076\u3001\u7236\u6bcd\uff09\u77e5\u60c5\u6216\u53c2\u4e0e\u51b3\u7b56\u7684\u5bf9\u8bdd\u75d5\u8ff9\u3002**\u5b58\u5728\u5bb6\u5ead\u51b3\u7b56\u6743\u672a\u6838\u5b9e\u7684\u6f5c\u5728\u98ce\u9669**\u3002\n*   **\u6b65\u9aa42-4 (\u52a8\u673a-\u8d44\u6e90-\u884c\u52a8\u529b\u7efc\u5408\u5224\u5b9a)**: \u57fa\u4e8e\u73b0\u6709\u4fe1\u606f\uff0c\u7528\u6237\u8868\u73b0\u51fa\u8f83\u5f3a\u7684\u5b66\u4e60\u610f\u613f\uff08A\uff09\u548c\u4e00\u5b9a\u7684\u884c\u52a8\u529b\uff08D\uff09\uff0c\u4f46\u8d44\u6e90\u5e95\u5ea7\uff08B\uff09\u548c\u5fc3\u7406\u5f39\u6027\uff08C\uff09\u4e2d\u7684\u6297\u538b\u4e0e\u957f\u671f\u575a\u6301\u80fd\u529b\u672a\u77e5\u3002\u7efc\u5408\u5224\u5b9a\u4e3a **A-D\u578b (\u9ad8\u610f\u613f-\u884c\u52a8\u578b)**\uff0c\u4f46\u57fa\u7840\u4fe1\u606f\u4e0d\u5168\uff0c\u9700\u8865\u5145\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b: T3 \u5174\u8da3\u63a2\u7d22\u8005**\u3002\u6838\u5fc3\u7279\u5f81\u4e3a\u88ab\u5174\u8da3\uff08\u6709\u58f0\u3001\u58f0\u4e50\uff09\u5438\u5f15\uff0c\u5bf9\u5b66\u4e60\u8fc7\u7a0b\u672c\u8eab\u62b1\u6709\u70ed\u60c5\uff0c\u5e76\u5e0c\u671b\u5c06\u5174\u8da3\u53d1\u5c55\u4e3a\u526f\u4e1a\u3002\u7528\u6237\u5bf9\u201c\u5168\u80fd\u4e3b\u64ad\u201d\u3001\u201c\u5e7f\u64ad\u5267\u201d\u3001\u201c\u659c\u6760\u5de5\u4f5c\u201d\u7684\u5e7f\u6cdb\u5174\u8da3\uff0c\u4ee5\u53ca\u5bf9\u8001\u5e08\u4e2a\u4eba\uff08\u201c\u60a8\u662f\u6211\u7684\u6069\u5e08\u201d\uff09\u7684\u60c5\u611f\u6295\u5c04\uff0c\u5747\u7b26\u5408T3\u539f\u578b\u7279\u5f81\u3002**\u9700\u8b66\u60d5\u5176\u5174\u8da3\u53ef\u80fd\u5e7f\u6cdb\u4f46\u4e0d\u6df1\u5165\uff0c\u6613\u4ea7\u751f\u4e0d\u5207\u5b9e\u9645\u7684\u201c\u5168\u80fd\u201d\u5e7b\u60f3**\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4e2d)\n\u9010\u9879\u6392\u67e57\u79cd\u9000\u8d39\u6839\u56e0\uff1a\n1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f (\u9ad8\u98ce\u9669)**: \u7528\u6237\u5bf9\u201c\u5168\u80fd\u4e3b\u64ad\u201d\u3001\u201c\u659c\u6760\u5de5\u4f5c\u6211\u90fd\u60f3\u505a\u201d\u7684\u671f\u671b\u6781\u9ad8\uff0c\u4e14\u9500\u552e\u5f3a\u8c03\u4e86\u201c\u8d44\u6e90\u201d\u3001\u201c\u53d8\u73b0\u201d\u3001\u201c\u7248\u6743\u4e66\u201d\u3002**\u6781\u6613\u56e0\u5b9e\u9645\u5b66\u4e60\u96be\u5ea6\u3001\u63a5\u5355\u7ade\u4e89\u3001\u6536\u5165\u56de\u62a5\u5468\u671f\u957f\u800c\u4ea7\u751f\u5de8\u5927\u843d\u5dee**\u3002\n2.  **\u7ecf\u6d4e\u538b\u529b (\u4fe1\u606f\u4e0d\u8db3)**: \u652f\u4ed8\u8fc7\u7a0b\u987a\u5229\uff0c\u4f46\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff08\u5206\u671f/\u5168\u6b3e\uff09\u6216\u7ecf\u6d4e\u72b6\u51b5\u3002\u9700\u540e\u7eed\u6838\u67e5\u3002\n3.  **\u65f6\u95f4\u51b2\u7a81 (\u4fe1\u606f\u4e0d\u8db3)**: \u5f53\u524d\u8868\u73b0\u51fa\u8f83\u591a\u7a7a\u95f2\u65f6\u95f4\uff0c\u4f46\u957f\u671f\u7a33\u5b9a\u6027\u672a\u77e5\u3002\n4.  **\u8bfe\u7a0b\u8d28\u91cf\u5f02\u8bae (\u4e2d\u98ce\u9669)**: \u76ee\u524d\u5bf9\u8bfe\u7a0b\u548c\u8001\u5e08\u53cd\u9988\u79ef\u6781\u3002\u98ce\u9669\u5728\u4e8e\u540e\u7eed\u7cfb\u7edf\u8bfe\u82e5\u4e0e\u5f53\u524d\u201c\u8bad\u7ec3\u8425\u201d\u9ad8\u4e92\u52a8\u3001\u5f3a\u6fc0\u52b1\u6a21\u5f0f\u5dee\u5f02\u8fc7\u5927\uff0c\u53ef\u80fd\u4ea7\u751f\u5931\u671b\u3002\n5.  **\u5bb6\u5ead\u53cd\u5bf9 (\u9ad8\u98ce\u9669)**: **\u5bb6\u5ead\u51b3\u7b56\u6743\u672a\u6838\u5b9e\uff0c\u662f\u91cd\u5927\u98ce\u9669\u70b9**\u3002\u652f\u4ed8\u884c\u4e3a\u53ef\u80fd\u4e3a\u4e2a\u4eba\u51b2\u52a8\u51b3\u7b56\u3002\n6.  **\u88ab\u8bf1\u5bfc\u6d88\u8d39 (\u4e2d\u98ce\u9669)**: \u9500\u552e\u6d41\u7a0b\u5b58\u5728\u5bc6\u96c6\u7684\u201c\u76f4\u64ad\u53e3\u4ee4-\u5956\u52b1-\u8d44\u683c\u201d\u7ed1\u5b9a\u3001\u7a00\u7f3a\u6027\u8bdd\u672f\uff08\u201c\u7edf\u8ba1\u798f\u5229\u8d44\u6e90\u540d\u989d\u201d\uff09\u548c\u6210\u529f\u6848\u4f8b\u5c55\u793a\uff0c\u7b26\u5408\u884c\u4e1a\u901a\u7528\u8f6c\u5316\u7b56\u7565\u3002\u7528\u6237\u867d\u81ea\u613f\u652f\u4ed8\uff0c\u4f46**\u51b3\u7b56\u53ef\u80fd\u5efa\u7acb\u5728\u77ed\u671f\u9ad8\u60c5\u7eea\u4ef7\u503c\u548c\u8d44\u6e90\u627f\u8bfa\u4e4b\u4e0a**\u3002\n7.  **\u7ade\u54c1\u6bd4\u8f83/\u804c\u4e1a\u89c4\u5212\u53d8\u66f4 (\u4f4e\u98ce\u9669)**: \u5f53\u524d\u672a\u4f53\u73b0\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5408\u89c4\u6027**: \u9500\u552e\u6d41\u7a0b\u57fa\u672c\u5408\u89c4\uff0c\u4f7f\u7528\u4e86\u5b98\u65b9\u8bdd\u672f\u8fdb\u884c\u6743\u76ca\u786e\u8ba4\u548c\u9632\u8bc8\u9a97\u63d0\u9192\u3002\n*   **\u4f26\u7406\u98ce\u9669\u70b9**:\n    *   **\u8fc7\u5ea6\u627f\u8bfa\u98ce\u9669**: \u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u53d8\u73b0\u201d\u3001\u201c\u8d44\u6e90\u201d\u3001\u201c\u7248\u6743\u4e66\u201d\u3001\u201c\u659c\u6760\u5c97\u4f4d\u201d\uff0c\u5e76\u5c55\u793a\u201c\u5408\u4f5c\u5355\u5b50\u201d\uff0c\u53ef\u80fd\u5851\u9020\u4e86\u201c\u5b66\u5b8c\u5373\u53ef\u8f7b\u677e\u63a5\u5355\u8d5a\u94b1\u201d\u7684\u9884\u671f\uff0c**\u4e0e\u884c\u4e1a\u73b0\u5b9e\u5b58\u5728\u5dee\u8ddd**\u3002\n    *   **\u51b3\u7b56\u538b\u529b**: \u901a\u8fc7\u201c\u53d6\u6d88\u8003\u6838\u8d44\u683c\u201d\u3001\u201c\u76f4\u63a5\u62a5\u51fa\u7fa4\u201d\u3001\u201c\u540e\u53f0\u7edf\u8ba1\u540d\u989d\u201d\u7b49\u8bdd\u672f\u8425\u9020\u7d27\u8feb\u611f\uff0c\u53ef\u80fd\u4fc3\u6210\u4e86\u7528\u6237\u7684\u51b2\u52a8\u51b3\u7b56\u3002\n    *   **\u5bb6\u5ead\u77e5\u60c5\u7f3a\u4f4d**: **\u5168\u7a0b\u672a\u5f15\u5bfc\u6216\u8be2\u95ee\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\uff0c\u662f\u91cd\u5927\u4f26\u7406\u4e0e\u98ce\u63a7\u6f0f\u6d1e**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6 (\u504f\u5dee)**: \u7528\u6237\u5174\u8da3\u5e7f\u6cdb\u3001\u671f\u671b\u503c\u9ad8\uff0c\u4f46\u201c\u6500\u767b\u8ba1\u5212\u201d\u4f5c\u4e3a\u7cfb\u7edf\u8bfe\u7a0b\uff0c\u5176\u7ed3\u6784\u5316\u3001\u957f\u671f\u5316\u7684\u5b66\u4e60\u8def\u5f84\u4e0e\u7528\u6237\u201c\u5feb\u901f\u5168\u80fd\u201d\u7684\u5e7b\u60f3\u53ef\u80fd\u5b58\u5728\u504f\u5dee\u3002\u9700\u5728\u5165\u5b66\u521d\u671f\u8fdb\u884c\u9884\u671f\u7ba1\u7406\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **24\u5c0f\u65f6\u5185\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\u4e0e\u652f\u4ed8\u80fd\u529b**\u3002\n*   **\u5177\u4f53\u884c\u52a8\u6307\u5357**:\n    1.  **\u7d27\u6025\u98ce\u63a7**: \u73ed\u4e3b\u4efb\u63a5\u624b\u540e\uff0c\u9996\u8981\u4efb\u52a1\u975e\u5b66\u4e60\u6307\u5bfc\uff0c\u800c\u662f\u8fdb\u884c**\u652f\u4ed8\u540e\u56de\u8bbf**\u3002\u9700\u4ee5\u6e29\u548c\u65b9\u5f0f\u4e86\u89e3\uff1a\u2460\u672c\u6b21\u8d2d\u8bfe\u662f\u5426\u4e0e\u5bb6\u4eba\u5546\u91cf\u8fc7\uff1f\u5bb6\u4eba\u662f\u5426\u652f\u6301\uff1f\u2461\u5b66\u8d39\u652f\u4ed8\u65b9\u5f0f\uff08\u662f\u5426\u4f7f\u7528\u4fe1\u8d37\u4ea7\u54c1\uff09\uff1f\u2462\u5bf9\u5b66\u4e60\u7684\u65f6\u95f4\u89c4\u5212\u662f\u600e\u6837\u7684\uff1f\n    2.  **\u9884\u671f\u6821\u6b63**: \u5728\u5f00\u8bfe\u9996\u5468\uff0c\u7ed3\u5408\u7528\u6237T3\u539f\u578b\u7279\u70b9\uff0c\u8fdb\u884c\u4e00\u5bf9\u4e00\u6c9f\u901a\u3002**\u660e\u786e\u6f84\u6e05**\uff1a\u2460\u201c\u5168\u80fd\u4e3b\u64ad\u201d\u9700\u8981\u957f\u671f\u5206\u9636\u6bb5\u4fee\u70bc\uff0c\u5f53\u524d\u9636\u6bb5\u7684\u5b66\u4e60\u6838\u5fc3\u76ee\u6807\uff1b\u2461\u201c\u659c\u6760\u5c97\u4f4d\u201d\uff08\u5982\u753b\u672c\u3001\u540e\u671f\uff09\u9700\u8981\u5148\u7cbe\u901a\u6f14\u64ad\u57fa\u7840\uff0c\u4e14\u8d44\u6e90\u7ade\u4e89\u6fc0\u70c8\uff1b\u2462\u201c\u7248\u6743\u4e66\u201d\u548c\u201c\u63a5\u5355\u201d\u662f\u5b66\u4e60\u6210\u679c\u7684\u5e94\u7528\uff0c\u800c\u975e\u62a5\u540d\u5373\u5f97\u7684\u4fdd\u8bc1\u3002\u5e2e\u52a9\u5176\u5c06\u5174\u8da3\u8f6c\u5316\u4e3a\u53ef\u6301\u7eed\u7684\u5b66\u4e60\u8ba1\u5212\u3002\n    3.  **\u5174\u8da3\u7ef4\u7cfb\u4e0e\u9f13\u52b1**: \u80af\u5b9a\u5176\u5f53\u524d\u7684\u5b66\u4e60\u70ed\u60c5\u548c\u884c\u52a8\u529b\uff08\u5982\u4e0a\u9ea6\u5c1d\u8bd5\uff09\uff0c\u5c06\u5176\u5bf9\u201c\u6069\u5e08\u201d\u7684\u60c5\u611f\u4f9d\u8d56\u9010\u6b65\u8f6c\u79fb\u5230\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u548c\u4e2a\u4eba\u6210\u957f\u7684\u5173\u6ce8\u4e0a\u3002\u4e3a\u5176\u63a8\u8350\u7b26\u5408\u5176\u201c\u5fa1\u5988\u97f3\u201d\u7279\u70b9\u7684\u7ec6\u5206\u8d5b\u9053\uff08\u5982\u4eba\u6587\u3001\u6210\u957f\u7c7b\uff09\u4f5c\u4e3a\u521d\u671f\u4e13\u6ce8\u65b9\u5411\uff0c\u907f\u514d\u8d2a\u591a\u3002\n    4.  **\u6301\u7eed\u89c2\u5bdf**: \u5bc6\u5207\u5173\u6ce8\u7528\u6237\u8fdb\u5165\u7cfb\u7edf\u8bfe\u540e\u7684\u9002\u5e94\u60c5\u51b5\uff0c\u7279\u522b\u662f\u5f53\u8bfe\u7a0b\u8282\u594f\u4ece\u201c\u8bad\u7ec3\u8425\u201d\u7684\u9ad8\u9891\u4e92\u52a8\u8f6c\u4e3a\u5e38\u89c4\u6559\u5b66\u65f6\uff0c\u5176\u53c2\u4e0e\u5ea6\u548c\u53cd\u9988\u53d8\u5316\u3002\n\n{\"core_type\": \"T3 \u5174\u8da3\u63a2\u7d22\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"24\u5c0f\u65f6\u5185\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\u4e0e\u652f\u4ed8\u80fd\u529b\"}";
