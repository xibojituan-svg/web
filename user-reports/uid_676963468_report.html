    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4ee5\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\u7684\u8eab\u4efd\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n### **\u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a**\n\n**\u4fe1\u606f\u5145\u8db3\u5ea6\u8bc4\u4f30**\uff1a\u4fe1\u606f\u5145\u8db3\uff0c\u53ef\u8fdb\u884c\u6709\u6548\u5206\u6790\u3002\u804a\u5929\u8bb0\u5f55\u5c55\u73b0\u4e86\u7528\u6237\u5728\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u7684\u9ad8\u9891\u4e92\u52a8\u3001\u5177\u4f53\u884c\u52a8\u548c\u60c5\u611f\u8868\u8fbe\uff0c\u8986\u76d6\u4e86\u4e09\u8f74\u4fe1\u53f7\u7684\u5173\u952e\u7ef4\u5ea6\u3002\n\n---\n\n#### **1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6**\n\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u9ad8)**\n    *   **\u5185\u5728\u9a71\u52a8**\uff1a\u660e\u786e\u8868\u8fbe\u201c\u4e3a\u4e86\u505a\u4e00\u4e2a\u5c31\u7b97\u8001\u4e86\u4e5f\u8981\u505a\u4e2a\u4f18\u96c5\u53c8\u6709\u80fd\u529b\u7684\u8001\u59d0\u59d0\u201d\uff0c\u8ffd\u6c42\u4e2a\u4eba\u6210\u957f\u4e0e\u4ef7\u503c\u5b9e\u73b0\uff0c\u5c5e\u4e8e\u9ad8\u9636\u7cbe\u795e\u9700\u6c42\u3002\n    *   **\u884c\u52a8\u6295\u5165**\uff1a\u4e3b\u52a8\u5c1d\u8bd5\u4e0d\u540c\u5f55\u97f3\u73af\u5883\uff08\u7a97\u53f0\u3001\u8863\u67dc\uff09\u3001\u575a\u6301\u65e9\u529f\u3001\u53cd\u590d\u7ec3\u4e60\u5e73\u7fd8\u820c\u3001\u4e3b\u52a8\u8981\u6c42\u5e03\u7f6e\u4f5c\u4e1a\u3001\u79ef\u6781\u51c6\u5907\u5347\u7ea7\u7535\u8111\u8bbe\u5907\u3002\u5b66\u4e60\u884c\u4e3a\u9ad8\u5ea6\u81ea\u89c9\u3001\u6301\u7eed\u3002\n    *   **\u5b66\u4e60\u6001\u5ea6**\uff1a\u201c\u611f\u89c9\u53c8\u56de\u5230\u4e86\u5c0f\u65f6\u5019\u201d\u3001\u201c\u5927\u5b66\u6bd5\u4e1a\u540e\u7b2c\u4e00\u6b21\u8fd9\u6837\u6295\u5165\u7684\u5b66\u4e60\u201d\uff0c\u8868\u73b0\u51fa\u7eaf\u7cb9\u7684\u5b66\u4e60\u70ed\u60c5\u548c\u6c89\u6d78\u611f\u3002\n\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d\u7b49)**\n    *   **\u7ecf\u6d4e\u4e0e\u65f6\u95f4**\uff1a\u6709\u7a33\u5b9a\u5de5\u4f5c\uff08\u9700\u4e0a\u73ed\uff09\uff0c\u8ba1\u5212\u4e3a\u65b0\u6280\u80fd\u6295\u8d44\uff08\u914d\u7f6e\u65b0\u7535\u8111\uff0c\u9884\u7b973000-5000\u5143\uff09\uff0c\u8868\u660e\u5177\u5907\u4e00\u5b9a\u7684\u53ef\u652f\u914d\u6536\u5165\u548c\u51b3\u7b56\u6743\u3002\u4f46\u9700\u8981\u517c\u987e\u5bb6\u5ead\uff08\u6709\u4e24\u4e2a\u5b69\u5b50\uff09\uff0c\u65f6\u95f4\u53ef\u80fd\u88ab\u5206\u5272\u3002\n    *   **\u8bbe\u5907\u4e0e\u73af\u5883**\uff1a\u76ee\u524d\u4e3b\u8981\u4f7f\u7528\u624b\u673a\uff0c\u610f\u8bc6\u5230\u73af\u5883\u95ee\u9898\uff08\u201c\u623f\u95f4\u5c0f\u70b9\uff0c\u76f8\u5bf9\u6bd4\u8f83\u5b89\u9759\u201d\uff09\uff0c\u5e76\u6b63\u5728\u79ef\u6781\u89e3\u51b3\u8bbe\u5907\u77ed\u677f\uff08\u54a8\u8be2\u5e76\u51b3\u5b9a\u8d2d\u4e70\u53f0\u5f0f\u7535\u8111\uff09\u3002\u884c\u52a8\u529b\u5f3a\uff0c\u80fd\u4e3b\u52a8\u5bfb\u6c42\u548c\u6574\u5408\u8d44\u6e90\u3002\n    *   **\u793e\u4f1a\u652f\u6301**\uff1a\u4e0e\u73ed\u4e3b\u4efb\u4e92\u52a8\u7d27\u5bc6\uff0c\u5728\u7fa4\u5185\u79ef\u6781\u4e0e\u5176\u4ed6\u5b66\u5458\u4ea4\u6d41\uff08\u8bf7\u6559\u62a2\u4e66\u7ecf\u9a8c\u3001\u5938\u8d5e\u540c\u5b66\uff09\uff0c\u521d\u6b65\u6784\u5efa\u4e86\u5b66\u4e60\u793e\u7fa4\u652f\u6301\u7f51\u7edc\u3002\n\n*   **\u5fc3\u7406\u5f39\u6027 (\u9ad8)**\n    *   **\u632b\u6298\u5e94\u5bf9**\uff1a\u9762\u5bf9\u201c\u5e73\u7fd8\u820c\u201d\u96be\u70b9\uff0c\u6001\u5ea6\u79ef\u6781\uff08\u201c\u6211\u5f97\u591a\u5b66\u591a\u7ec3\u201d\u3001\u201c\u6211\u518d\u7ee7\u7eed\u52a0\u6cb9\u201d\uff09\uff0c\u80fd\u63a5\u53d7\u53cd\u9988\u5e76\u5236\u5b9a\u6539\u8fdb\u8ba1\u5212\u3002\u64cd\u4f5c\u5931\u8bef\uff08\u9009\u9519\u4e66\u3001\u627e\u4e0d\u5230\u56de\u653e\uff09\u65f6\u80fd\u81ea\u5632\uff08\u201c\u6211\u771f\u7b28\u201d\uff09\u5e76\u5feb\u901f\u8c03\u6574\u3002\n    *   **\u575a\u6301\u6027**\uff1a\u6bcf\u65e5\u575a\u6301\u65e9\u529f\u3001\u4e3b\u52a8\u52a0\u7ec3\u3001\u8868\u793a\u201c\u8981\u5b66\u7684\u592a\u591a\u4e86\uff0c\u611f\u89c9\u65f6\u95f4\u90fd\u4e0d\u591f\u7528\u201d\uff0c\u663e\u793a\u51fa\u5f3a\u70c8\u7684\u81ea\u5f8b\u6027\u548c\u97e7\u6027\u3002\n    *   **\u60c5\u7eea\u72b6\u6001**\uff1a\u6574\u4f53\u60c5\u7eea\u79ef\u6781\u3001\u7a33\u5b9a\uff0c\u5e38\u4f7f\u7528[\u73ab\u7470][\u62e5\u62b1]\u7b49\u8868\u60c5\uff0c\u5bf9\u73ed\u4e3b\u4efb\u548c\u540c\u5b66\u5145\u6ee1\u5584\u610f\u4e0e\u9f13\u52b1\uff0c\u5c5e\u4e8e\u9ad8\u80fd\u91cf\u3001\u9ad8\u914d\u5408\u5ea6\u7528\u6237\u3002\n\n#### **2. ABCD\u5224\u5b9a\u6811\u5206\u6790**\n\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u8bb0\u5f55\u4e2d\u672a\u6d89\u53ca\u652f\u4ed8\u884c\u4e3a\u6216\u8bfe\u7a0b\u4ef7\u683c\u8ba8\u8bba\uff0c**\u65e0\u6cd5\u76f4\u63a5\u5224\u5b9a**\u3002\u4f46\u7528\u6237\u5df2\u6df1\u5ea6\u53c2\u4e0e\u8bfe\u7a0b\u5b66\u4e60\u3001\u51c6\u5907\u8bbe\u5907\u6295\u8d44\uff0c**\u652f\u4ed8\u610f\u613f\u5448\u5f3a\u9633\u6027\u4fe1\u53f7**\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u7528\u6237\u4e3b\u52a8\u63d0\u53ca\u4e3a\u5b69\u5b50\u201c\u62fc\u4e86\u4e24\u6b21\u547d\uff0c\u51d1\u6210\u4e86\u4e00\u4e2a\u597d\u5b57\u201d\uff0c\u5e76\u8ba1\u5212\u81ea\u884c\u8d2d\u4e70\u7535\u8111\uff0c\u8868\u660e\u5176\u4e3a\u5bb6\u5ead\u6838\u5fc3\u6210\u5458\uff0c\u62e5\u6709**\u8f83\u9ad8\u7684\u4e2a\u4eba\u6d88\u8d39\u51b3\u7b56\u6743**\u3002\n*   **\u6838\u5fc3\u5224\u5b9a**\uff1a\u52a8\u673a\u7eaf\u5ea6\u9ad8\u3001\u884c\u52a8\u529b\u5f3a\u3001\u5fc3\u7406\u5f39\u6027\u597d\uff0c\u5c5e\u4e8e\u5178\u578b\u7684**B\u7c7b\uff08\u9ad8\u610f\u613f-\u9ad8\u884c\u52a8\uff09\u6f5c\u529b\u7528\u6237**\u3002\u6b63\u5904\u4e8e\u6280\u80fd\u5b66\u4e60\u548c\u8bbe\u5907\u5347\u7ea7\u7684\u6295\u5165\u671f\uff0c\u662f\u5411A\u7c7b\uff08\u9ad8\u4ef7\u503c\uff09\u7528\u6237\u8f6c\u5316\u7684\u5173\u952e\u9636\u6bb5\u3002\n\n#### **3. \u7528\u6237\u539f\u578b\u5339\u914d (T1-T8)**\n\n**\u5339\u914d\u539f\u578b\uff1aT3 \u81ea\u5f8b\u8fdb\u53d6\u578b**\n*   **\u6838\u5fc3\u7279\u5f81**\uff1a\u76ee\u6807\u6e05\u6670\uff08\u63d0\u5347\u64ad\u97f3\u6280\u80fd\u3001\u8ffd\u6c42\u4f18\u96c5\u8001\u5e74\uff09\u3001\u81ea\u6211\u9a71\u52a8\u6027\u5f3a\u3001\u9075\u5b88\u89c4\u5219\u3001\u79ef\u6781\u5bfb\u6c42\u53cd\u9988\u5e76\u4ed8\u8bf8\u5b9e\u8df5\u3002\n*   **\u5178\u578b\u8868\u73b0**\uff1a\u6bcf\u65e5\u95ee\u5019\u4e0e\u65e9\u529f\u6253\u5361\u3001\u8ba4\u771f\u5b8c\u6210\u4f5c\u4e1a\u3001\u4e3b\u52a8\u66b4\u9732\u5f31\u70b9\uff08\u5e73\u7fd8\u820c\u95ee\u9898\uff09\u5e76\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\u3001\u4e3a\u5b66\u4e60\u6548\u679c\u4e3b\u52a8\u4f18\u5316\u786c\u4ef6\uff08\u7535\u8111\uff09\u3002\n*   **\u4e0eT6\uff08\u60c5\u7eea\u5de8\u5a74\uff09\u7684\u533a\u5206**\uff1a\u8be5\u7528\u6237\u60c5\u7eea\u7a33\u5b9a\u3001\u79ef\u6781\uff0c\u9047\u5230\u95ee\u9898\u805a\u7126\u4e8e\u89e3\u51b3\uff08\u201c\u6211\u591a\u52a0\u7ec3\u4e60\u201d\uff09\u800c\u975e\u62b1\u6028\u6216\u7d22\u53d6\u60c5\u7eea\u4ef7\u503c\uff0c\u4e0eT6\u4f9d\u8d56\u578b\u6709\u672c\u8d28\u533a\u522b\u3002\n\n#### **4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4f4e)**\n\n\u9010\u9879\u6392\u67e57\u79cd\u9000\u8d39\u6839\u56e0\uff1a\n1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a\u98ce\u9669**\u4f4e**\u3002\u7528\u6237\u5bf9\u8fdb\u6b65\u6709\u611f\u77e5\uff08\u201c\u611f\u89c9\u8138\u90fd\u53d8\u5f97\u7d27\u81f4\u4e86\u201d\u3001\u201c\u4e00\u904d\u5c31\u8fc7\u4e86\uff0c\u5f00\u5fc3\u201d\uff09\uff0c\u4e14\u5c06\u96be\u70b9\u5f52\u56e0\u4e8e\u81ea\u8eab\u7ec3\u4e60\u4e0d\u8db3\uff0c\u800c\u975e\u8bfe\u7a0b\u65e0\u6548\u3002\n2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a\u98ce\u9669**\u4f4e**\u3002\u6709\u8ba1\u5212\u4e14\u7406\u6027\u5730\u914d\u7f6e\u7535\u8111\uff08\u9884\u7b97\u5185\uff09\uff0c\u672a\u8868\u73b0\u51fa\u7ecf\u6d4e\u7a98\u8feb\u3002\n3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a\u98ce\u9669**\u4e2d**\u3002\u6709\u5168\u804c\u5de5\u4f5c\u53ca\u4e24\u4e2a\u5b69\u5b50\uff0c\u672a\u6765\u65f6\u95f4\u53ef\u80fd\u7d27\u5f20\uff0c\u4f46\u5f53\u524d\u65f6\u95f4\u7ba1\u7406\u826f\u597d\u3002\n4.  **\u8bfe\u7a0b\u5185\u5bb9\u4e0d\u7b26**\uff1a\u98ce\u9669**\u6781\u4f4e**\u3002\u7528\u6237\u5b66\u4e60\u5185\u5bb9\u4e0e\u64ad\u97f3\u8bfe\u7a0b\u9ad8\u5ea6\u5339\u914d\uff0c\u4e14\u6295\u5165\u5ea6\u9ad8\u3002\n5.  **\u670d\u52a1\u8d28\u91cf\u6295\u8bc9**\uff1a\u98ce\u9669**\u6781\u4f4e**\u3002\u4e0e\u73ed\u4e3b\u4efb\u5173\u7cfb\u878d\u6d3d\uff0c\u4e92\u52a8\u9891\u7e41\u4e14\u6b63\u5411\u3002\n6.  **\u5e73\u53f0\u64cd\u4f5c\u56f0\u96be**\uff1a\u98ce\u9669**\u4f4e**\u3002\u867d\u6709\u77ed\u6682\u64cd\u4f5c\u56f0\u60d1\uff08\u627e\u4e0d\u5230\u56de\u653e\uff09\uff0c\u4f46\u80fd\u5feb\u901f\u5728\u6307\u5bfc\u4e0b\u89e3\u51b3\uff0c\u672a\u4ea7\u751f\u8d1f\u9762\u60c5\u7eea\u3002\n7.  **\u7ade\u54c1\u8f6c\u79fb/\u51b2\u52a8\u6d88\u8d39**\uff1a\u98ce\u9669**\u4f4e**\u3002\u5b66\u4e60\u8def\u5f84\u6e05\u6670\uff0c\u6301\u7eed\u6295\u5165\uff0c\u672a\u8868\u73b0\u51fa\u6447\u6446\u3002\n\n**\u7efc\u5408\u9000\u8d39\u98ce\u9669\uff1a\u4f4e**\u3002\u7528\u6237\u5904\u4e8e\u6df1\u5ea6\u6295\u5165\u7684\u5b66\u4e60\u5fc3\u6d41\u4e2d\uff0c\u77ed\u671f\u9000\u8d39\u53ef\u80fd\u6027\u6781\u4f4e\u3002**\u4e3b\u8981\u98ce\u9669\u70b9\u5728\u4e8e\u4e2d\u957f\u671f\u53ef\u80fd\u56e0\u5bb6\u5ead/\u5de5\u4f5c\u4e8b\u52a1\u5bfc\u81f4\u65f6\u95f4\u4e0d\u8db3\u800c\u4e2d\u65ad\uff0c\u800c\u975e\u5bf9\u8bfe\u7a0b\u4e0d\u6ee1\u3002**\n\n#### **5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5**\n\n*   **\u5408\u89c4\u60c5\u51b5\u826f\u597d**\uff1a\u8bb0\u5f55\u4e2d\u9500\u552e\uff08\u73ed\u4e3b\u4efb\uff09\u89d2\u8272\u4e3b\u8981\u4e3a**\u6559\u5b66\u670d\u52a1\u4e0e\u652f\u6301**\uff08\u7ea0\u6b63\u53d1\u97f3\u3001\u6307\u5bfc\u8bbe\u5907\u3001\u63d0\u9192\u8bfe\u7a0b\uff09\uff0c\u672a\u53d1\u73b0\u8fc7\u5ea6\u627f\u8bfa\u3001\u5938\u5927\u6536\u76ca\u6216\u9ad8\u538b\u903c\u5355\u8bdd\u672f\u3002\n*   **\u4f26\u7406\u4eae\u70b9**\uff1a\u73ed\u4e3b\u4efb\u5206\u4eab\u4e86\u4e2a\u4eba\u751f\u6d3b\uff08\u63a5\u5b69\u5b50\u3001\u770b\u5c0f\u5b66\uff09\uff0c\u5efa\u7acb\u4e86**\u5e73\u7b49\u7684\u3001\u670b\u53cb\u5f0f\u7684\u4fe1\u4efb\u5173\u7cfb**\uff0c\u7b26\u5408\u6559\u80b2\u670d\u52a1\u4f26\u7406\u3002\n*   **\u6f5c\u5728\u98ce\u9669\u70b9**\uff1a\u65e0\u3002\u9500\u552e\u5efa\u8bae\uff08\u5982\u7535\u8111\u914d\u7f6e\uff09\u57fa\u4e8e\u6280\u672f\u8001\u5e08\u610f\u89c1\uff0c\u5ba2\u89c2\u4e2d\u7acb\u3002\n\n#### **6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**\n\n*   **\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u5f3a\u5316\u4e13\u4e1a\u4fe1\u4efb**\uff1a\u6301\u7eed\u63d0\u4f9b\u7cbe\u51c6\u7684\u53d1\u97f3\u6307\u5bfc\uff08\u5982\u5e73\u7fd8\u820c\uff09\u548c\u8bbe\u5907\u5efa\u8bae\uff0c\u5de9\u56fa\u5176\u201c\u4e13\u4e1a\u5f15\u8def\u4eba\u201d\u5f62\u8c61\u3002\n    2.  **\u63d0\u4f9b\u6210\u5c31\u611f\u71c3\u6599**\uff1a\u53ca\u65f6\u80af\u5b9a\u5176\u7ec6\u5fae\u8fdb\u6b65\uff08\u5982\u666e\u901a\u8bdd\u6d4b\u8bd5\u901a\u8fc7\u3001\u65e9\u529f\u575a\u6301\uff09\uff0c\u5c06\u5979\u7684\u81ea\u6211\u6fc0\u52b1\uff08\u201c\u7ed9\u597d\u5b66\u4e0d\u670d\u8001\u4e0d\u670d\u8f93\u7684\u81ea\u5df1\u70b9\u4e2a\u8d5e\u201d\uff09\u4e0e\u8bfe\u7a0b\u4ef7\u503c\u7ed1\u5b9a\u3002\n    3.  **\u9884\u9632\u65f6\u95f4\u98ce\u9669**\uff1a\u63d0\u524d\u5173\u6ce8\u5176\u65f6\u95f4\u5206\u914d\uff0c\u82e5\u5176\u63d0\u53ca\u5fd9\u788c\uff0c\u53ef\u63d0\u4f9b**\u788e\u7247\u5316\u5b66\u4e60\u65b9\u6848**\u6216\u5f55\u64ad\u91cd\u70b9\u6807\u8bb0\uff0c\u5e2e\u52a9\u5176\u7ef4\u6301\u5b66\u4e60\u8fde\u7eed\u6027\u3002\n    4.  **\u5f15\u5bfc\u793e\u7fa4\u89d2\u8272**\uff1a\u9f13\u52b1\u5979\u5728\u7fa4\u5185\u5206\u4eab\u7ec3\u4e60\u5fc3\u5f97\uff08\u5982\u8bbe\u5907\u9009\u8d2d\u7ecf\u9a8c\uff09\uff0c\u5c06\u5176\u8f6c\u5316\u4e3a**\u79ef\u6781\u5b66\u5458\u699c\u6837**\uff0c\u65e2\u80fd\u6ee1\u8db3\u5176\u5c0a\u91cd\u9700\u6c42\uff0c\u4e5f\u80fd\u4fc3\u8fdb\u793e\u7fa4\u6d3b\u8dc3\u3002\n\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**\uff1a\n    *   **\u5f53\u524d\u6302\u8f7d**\uff1a\u64ad\u97f3\u57fa\u7840\u6280\u80fd\u8bfe\u7a0b\u5339\u914d\u5ea6\u6781\u9ad8\uff0c\u7528\u6237\u6b63\u5904\u4e8e\u751c\u871c\u671f\u3002\n    *   **\u8fdb\u9636\u63a8\u8350**\uff1a\u53ef\u9002\u65f6\u63a8\u8350**\u540e\u671f\u5236\u4f5c\u8f6f\u4ef6\u8bfe\u7a0b\u3001\u6709\u58f0\u4e66\u5f55\u5236\u5b9e\u6218\u8425\u3001\u4e2a\u4eba\u54c1\u724c\u58f0\u97f3\u6253\u9020**\u7b49\u8fdb\u9636\u4ea7\u54c1\u7ebf\u3002\u5979\u7684\u8bbe\u5907\u6295\u5165\u548c\u5b66\u4e60\u70ed\u60c5\u8868\u660e\uff0c\u5176\u4e3a**\u201c\u6280\u80fd\u6df1\u5316-\u53d8\u73b0\u63a2\u7d22\u201d\u7c7b\u4ea7\u54c1**\u7684\u4f18\u8d28\u6f5c\u5728\u7528\u6237\u3002\n    *   **\u8f6c\u5316\u65f6\u673a**\uff1a\u5f85\u5176\u5b8c\u6210\u5f53\u524d\u9636\u6bb5\u5b66\u4e60\u3001\u8bbe\u5907\u5230\u4f4d\u5e76\u4ea7\u51fa\u521d\u6b65\u4f5c\u54c1\uff08\u5982\u5b8c\u6210\u8bd5\u97f3\uff09\u540e\uff0c\u5176\u4fe1\u5fc3\u548c\u53d8\u73b0\u610f\u613f\u5c06\u8fbe\u5230\u9ad8\u70b9\uff0c\u662f\u63a8\u8350\u8fdb\u9636\u8bfe\u7a0b\u7684\u9ec4\u91d1\u7a97\u53e3\u3002\n\n{\"core_type\": \"T3 \u81ea\u5f8b\u8fdb\u53d6\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u6709\u58f0\u4e66\u5f55\u5236\u5b9e\u6218\u8425/\u4e2a\u4eba\u54c1\u724c\u58f0\u97f3\u8bfe\", \"age\": \"30-45\u5c81\uff08\u57fa\u4e8e\u6709\u5b66\u9f84\u5b69\u5b50\u53ca\u2018\u8001\u59d0\u59d0\u2019\u81ea\u79f0\uff09\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}";
