    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## \u4e00\u3001 \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a**\u4e2d\u7b49**\u3002\u7528\u6237\u6838\u5fc3\u8bc9\u6c42\u4e3a\u201c\u6323\u70b9\u96f6\u82b1\u201d\uff0c\u6709\u660e\u786e\u7684\u53d8\u73b0\u671f\u5f85\u3002\u5b66\u4e60\u884c\u4e3a\u4e3b\u52a8\uff08\u575a\u6301\u6253\u5361\u3001\u4e3b\u52a8\u4ea4\u4f5c\u4e1a\u3001\u53c2\u4e0e\u7fa4\u5185\u642d\u620f\uff09\uff0c\u5bf9\u6280\u80fd\u63d0\u5347\u6709\u6e34\u671b\uff0c\u4f46\u52a8\u673a\u4e2d\u201c\u5c1d\u8bd5/\u526f\u4e1a\u201d\u6210\u5206\u5927\u4e8e\u201c\u70ed\u7231/\u804c\u4e1a\u8f6c\u578b\u201d\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4e2d\u7b49\u504f\u5f31**\u3002**\u5173\u952e\u77ed\u677f\uff1a\u65e0\u4e2a\u4eba\u7535\u8111**\uff0c\u9700\u501f\u7528\u914d\u5076\u7b14\u8bb0\u672c\u6216\u4e34\u65f6\u8d2d\u7f6e\u3002\u5df2\u6295\u5165\u7ea64000\u5143\u8d2d\u7f6e\u4e13\u4e1a\u8bbe\u5907\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u8d44\u91d1\u6295\u5165\u610f\u613f\uff0c\u4f46\u51b3\u7b56\u8fc7\u7a0b\u72b9\u8c6b\uff08\u201c\u62c5\u5fc3\u8fd8\u6ca1\u6323\u94b1\u5148\u6d88\u8d39\u4e86\u597d\u591a\u201d\uff09\uff0c\u5bb6\u5ead\u7ecf\u6d4e\u652f\u6301\u60c5\u51b5\u4e0d\u660e\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a**\u9ad8**\u3002\u9762\u5bf9\u8bd5\u97f3\u5931\u8d25\u3001\u8bbe\u5907\u5b89\u88c5\u4e0e\u8f6f\u4ef6\u64cd\u4f5c\u56f0\u96be\uff08\u201c\u7535\u8111\u5c0f\u767d\u201d\uff09\u3001\u65f6\u95f4\u51b2\u7a81\uff08\u5b69\u5b50\u5360\u7528\uff09\u7b49\u591a\u91cd\u969c\u788d\uff0c\u6001\u5ea6\u79ef\u6781\uff0c\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff08\u8be2\u95ee\u6280\u672f\u3001\u8ba1\u5212\u4e70\u7535\u8111\uff09\uff0c\u4e50\u4e8e\u63a5\u53d7\u540c\u5b66\u548c\u8001\u5e08\u53cd\u9988\uff0c\u5177\u5907\u6210\u957f\u578b\u601d\u7ef4\u3002\n\n## \u4e8c\u3001 ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u5df2\u652f\u4ed8\u8bfe\u7a0b\u8d39\u7528\uff0c\u5e76\u989d\u5916\u652f\u4ed8\u7ea64000\u5143\u8d2d\u4e70\u8bbe\u5907\uff0c\u652f\u4ed8\u884c\u4e3a\u5b8c\u6210\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u63d0\u53ca\u201c\u8001\u516c\u6709\u4e2a\u7b14\u8bb0\u672c\uff0c\u4f46\u662f\u4ed6\u4e0d\u7ecf\u5e38\u5728\u5bb6\u968f\u8eab\u5916\u5e26\u7740\u201d\uff0c\u5e76\u5728\u672a\u4e0e\u9500\u552e\u6df1\u5165\u63a2\u8ba8\u5bb6\u5ead\u652f\u6301\u7684\u60c5\u51b5\u4e0b\u81ea\u884c\u51b3\u5b9a\u8d2d\u4e70\u8bbe\u5907\uff0c\u6697\u793a\u5176\u5bf9\u5bb6\u5ead\u8d44\u91d1\u6709\u4e00\u5b9a\u81ea\u4e3b\u652f\u914d\u6743\uff0c\u4f46**\u5bb6\u5ead\u4e3b\u8981\u6210\u5458\uff08\u5982\u914d\u5076\uff09\u5bf9\u6b64\u6b21\u5b66\u4e60\u53ca\u5927\u989d\u8bbe\u5907\u6295\u5165\u7684\u77e5\u60c5\u4e0e\u652f\u6301\u7a0b\u5ea6\u672a\u77e5**\u3002\n*   **\u6b65\u9aa42-4\u7efc\u5408\u5224\u5b9a**\uff1a\u52a8\u673a\u660e\u786e\uff08B\uff09\uff0c\u8d44\u6e90\u5b58\u5728\u77ed\u677f\u4f46\u5df2\u5f00\u59cb\u8865\u8db3\uff08C\uff09\uff0c\u5fc3\u7406\u5f39\u6027\u5f3a\uff08A\uff09\uff0c\u5b66\u4e60\u884c\u4e3a\u79ef\u6781\uff08A\uff09\u3002\u7efc\u5408\u5224\u5b9a\u4e3a **B\u7c7b\uff08\u8fdb\u53d6\u52a1\u5b9e\u578b\uff09**\u3002\n\n## \u4e09\u3001 \u7528\u6237\u539f\u578b\u5339\u914d\n**T3 \u52a1\u5b9e\u53d8\u73b0\u63a2\u7d22\u8005**\u3002\u5178\u578b\u7279\u5f81\uff1a\u5b66\u4e60\u76ee\u6807\u76f4\u63a5\u6307\u5411\u517c\u804c\u589e\u6536\uff08\u201c\u6323\u70b9\u96f6\u82b1\u201d\uff09\uff0c\u80fd\u514b\u670d\u56f0\u96be\u575a\u6301\u5b66\u4e60\u4e0e\u5b9e\u64cd\uff08\u5e26\u75c5\u6253\u5361\u3001\u4e3b\u52a8\u642d\u620f\uff09\uff0c\u613f\u610f\u4e3a\u201c\u751f\u4ea7\u5de5\u5177\u201d\uff08\u8bbe\u5907\uff09\u6295\u8d44\u4ee5\u63d0\u5347\u6210\u529f\u7387\uff0c\u4f46\u5bf9\u957f\u671f\u6295\u5165\u4e0e\u56de\u62a5\u7684\u786e\u5b9a\u6027\u5b58\u5728\u62c5\u5fe7\u3002\n\n## \u56db\u3001 \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669**\uff1a**\u4f4e**\u3002\n*   **\u6839\u56e0\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u4e0d\u53ca\u9884\u671f**\uff1a\u4e2d\u98ce\u9669\u3002\u7528\u6237\u5bf9\u201c\u89c1\u5230\u94b1\u201d\u6709\u671f\u5f85\uff0c\u82e5\u957f\u671f\u65e0\u8bd5\u97f3\u6210\u529f\u6216\u53d8\u73b0\u673a\u4f1a\uff0c\u6613\u4ea7\u751f\u632b\u8d25\u611f\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a\u4e2d\u98ce\u9669\u3002\u8bbe\u5907\u652f\u51fa\u4e3a\u8ba1\u5212\u5916\u5927\u989d\u6d88\u8d39\uff08\u201c\u597d\u8d35\u554a\u201d\uff09\uff0c\u82e5\u540e\u7eed\u65e0\u6b63\u5411\u53cd\u9988\uff0c\u53ef\u80fd\u540e\u6094\u3002\n    3.  \u65f6\u95f4\u51b2\u7a81\u3001\u5185\u5bb9\u4e0d\u7b26\u3001\u670d\u52a1\u4f53\u9a8c\u3001\u9500\u552e\u627f\u8bfa\u3001\u5bb6\u5ead\u53cd\u5bf9\u98ce\u9669\u5747\u4e3a**\u4f4e**\u3002\u7528\u6237\u4e3b\u52a8\u7ba1\u7406\u65f6\u95f4\uff08\u63d0\u524d\u770b\u8bfe\uff09\uff0c\u8ba4\u53ef\u8bfe\u7a0b\u5185\u5bb9\u4e0e\u6307\u5bfc\uff0c\u79ef\u6781\u4e92\u52a8\uff0c\u9500\u552e\u8fc7\u7a0b\u65e0\u8fc7\u5ea6\u627f\u8bfa\u3002**\u4f46\u5bb6\u5ead\u53cd\u5bf9\u98ce\u9669\u56e0\u4fe1\u606f\u4e0d\u8db3\u9700\u5173\u6ce8**\u3002\n\n## \u4e94\u3001 \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u9500\u552e\u884c\u4e3a**\uff1a\u9500\u552e\u5728\u8bbe\u5907\u63a8\u5e7f\u4e2d\u5b58\u5728**\u8f7b\u5fae\u65bd\u538b\u4e0e\u89c4\u907f\u7528\u6237\u6838\u5fc3\u987e\u8651**\u7684\u503e\u5411\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u201c\u6ca1\u6709\u7535\u8111\u201d\u548c\u201c\u62c5\u5fc3\u5148\u6d88\u8d39\u201d\u7684\u987e\u8651\uff0c\u9500\u552e\u4ee5\u201c\u4f18\u60e0\u73b0\u5728\u6709\u201d\u3001\u201c\u4e70\u4e86\u5fc3\u6001\u5c31\u4e0d\u4e00\u6837\u201d\u3001\u201c\u5e72\u5c31\u5b8c\u4e86\u201d\u7b49\u8bdd\u672f\u63a8\u52a8\u4e0b\u5355\uff0c**\u672a\u5145\u5206\u5c0a\u91cd\u7528\u6237\u5f53\u524d\u7684\u5ba2\u89c2\u6761\u4ef6\u9650\u5236\u548c\u8d22\u52a1\u8c28\u614e\u5fc3\u7406**\u3002\n*   **\u98ce\u9669\u63d0\u793a**\uff1a\u9500\u552e\u5f3a\u8c03\u4e86\u8bbe\u5907\u5bf9\u97f3\u8d28\u548c\u63a5\u5355\u7684\u91cd\u8981\u6027\uff0c\u4f46**\u672a\u5c31\u201c\u8bbe\u5907\u6295\u5165\u4e0d\u4fdd\u8bc1\u63a5\u5355\u6210\u529f\u201d\u8fdb\u884c\u660e\u786e\u7684\u98ce\u9669\u63d0\u793a**\u3002\n\n## \u516d\u3001 \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d**\uff1a**\u5339\u914d**\u3002\u7528\u6237\u884c\u4e3a\u4e0e\u6709\u58f0\u6f14\u64ad\u6280\u80fd\u5b66\u4e60\u8def\u5f84\u5951\u5408\u5ea6\u9ad8\uff0c\u79ef\u6781\u53c2\u4e0e\u5b9e\u8df5\uff08\u642d\u620f\uff09\u3002\n*   **\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9996\u8981\u52a8\u4f5c**\uff1a**24\u5c0f\u65f6\u5185\u6e29\u548c\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\u4e0e\u652f\u6301\u5ea6**\u3002\u4ee5\u5173\u5fc3\u8bbe\u5907\u4f7f\u7528\u60c5\u51b5\u4e3a\u7531\uff0c\u81ea\u7136\u8be2\u95ee\u201c\u8bbe\u5907\u5230\u4f4d\u540e\uff0c\u5bb6\u4eba\u89c9\u5f97\u600e\u4e48\u6837\uff1f\u201d\uff0c\u8bc4\u4f30\u662f\u5426\u5b58\u5728\u6f5c\u5728\u5bb6\u5ead\u77db\u76fe\u98ce\u9669\u3002\n    2.  **\u6838\u5fc3\u7b56\u7565**\uff1a**\u9996\u6708\u91cd\u70b9\u63d0\u4f9b\u201c\u5fae\u5c0f\u6b63\u53cd\u9988\u201d**\u3002\u5bc6\u5207\u5173\u6ce8\u5176\u8bd5\u97f3\u52a8\u6001\uff0c\u4e89\u53d6\u5e2e\u52a9\u5176\u83b7\u5f97\u4e00\u6b21\u8bd5\u97f3\u901a\u8fc7\u6216\u4f18\u8d28\u4f5c\u4e1a\u70b9\u8bc4\uff0c\u5f3a\u5316\u5176\u201c\u6295\u5165\u503c\u5f97\u201d\u7684\u611f\u77e5\uff0c\u5bf9\u51b2\u7ecf\u6d4e\u62c5\u5fe7\u3002\n    3.  **\u957f\u671f\u652f\u6301**\uff1a**\u63d0\u4f9b\u7b80\u6613\u64cd\u4f5c\u6307\u5f15\u4e0e\u6280\u672f\u515c\u5e95**\u3002\u9488\u5bf9\u5176\u201c\u7535\u8111\u5c0f\u767d\u201d\u72b6\u6001\uff0c\u63d0\u4f9b\u56fe\u6587/\u89c6\u9891\u7248AU\u3001\u6709\u58f0\u55b5\u57fa\u7840\u64cd\u4f5c\u6307\u5357\uff0c\u5e76\u786e\u4fdd\u6280\u672f\u7b54\u7591\u6e20\u9053\u7545\u901a\uff0c\u964d\u4f4e\u64cd\u4f5c\u95e8\u69db\u5e26\u6765\u7684\u632b\u8d25\u611f\u3002\n    4.  **\u9884\u671f\u7ba1\u7406**\uff1a\u5728\u540e\u7eed\u6c9f\u901a\u4e2d\uff0c**\u6e29\u548c\u6821\u6b63\u5176\u201c\u5feb\u901f\u53d8\u73b0\u201d\u9884\u671f**\uff0c\u5f3a\u8c03\u6280\u80fd\u79ef\u7d2f\u7684\u5468\u671f\u6027\uff0c\u540c\u65f6\u591a\u5c55\u793a\u540c\u7c7b\u578b\uff08\u5b9d\u5988\u3001\u517c\u804c\uff09\u5b66\u5458\u7684\u8fdb\u9636\u6848\u4f8b\uff0c\u6811\u7acb\u5408\u7406\u699c\u6837\u3002\n\n{\"core_type\": \"T3 \u52a1\u5b9e\u53d8\u73b0\u63a2\u7d22\u8005\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"product_match\": \"\u5339\u914d\", \"action\": \"24h\u5185\u6838\u67e5\u5bb6\u5ead\u652f\u6301\u5ea6\"}";
        document.getElementById('content').innerHTML = marked.parse(markdownText);
