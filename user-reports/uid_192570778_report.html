    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID 192570778 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u82cf\u7476\u7476 (\u6851\u6986\u975e\u665a\u97f37) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u9ad8\u9636\u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b (7380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1 (\u81ea\u7531\u804c\u4e1a\uff0c\u4f46\u9700\u7167\u987e\u5b69\u5b50) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e2d\u7b49 (\u4e92\u52a8\u79ef\u6781\uff0c\u4f46\u5173\u952e\u5bb6\u5ead/\u652f\u4ed8\u4fe1\u606f\u7f3a\u5931) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u53d8\u73b0\u53cc\u91cd\u9a71\u52a8\uff0c\u5bf9\u201c\u517c\u804c\u201d\u3001\u201c\u63a5\u5355\u201d\u3001\u201c\u5de5\u79cd\u201d\u7b49\u53d8\u73b0\u8def\u5f84\u8868\u73b0\u51fa\u660e\u786e\u4e14\u6301\u7eed\u7684\u5174\u8da3\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6765\u5230\u8fd9\u4e2a\u5e73\u53f0\u5462\uff0c\u4e0d\u662f\u4e3a\u4ec0\u4e48\uff0c\u5c31\u4e3a\u4e86\u6323\u94b1\uff0c\u6240\u4ee5\u55ef\u4ee5\u540e\u6709\u4ec0\u4e48\u55ef\u6765\u94b1\u7684\u8def\u5b50\u7684\u8bdd\uff0c\u5927\u5bb6\u53ef\u4ee5\u5171\u540c\u53bb\u5206\u4eab\u4e00\u4e0b\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a\u4e2d \u2014 \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u80fd\u652f\u4ed87380\u5143\u9ad8\u9636\u8bfe\u7a0b\uff0c\u6709\u4e00\u5b9a\u8d44\u91d1\u57fa\u7840\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a\u4e2d \u2014 \u81ea\u7531\u804c\u4e1a\uff0c\u81ea\u79f0\u201c\u6bcf\u5929\u90fd\u6709\u65f6\u95f4\u201d\uff0c\u4f46\u9700\u7167\u987e\u5b69\u5b50\uff08\u201c\u7ed9\u5a03\u5a03\u505a\u6cbb\u7597\u201d\uff09\uff0c\u65f6\u95f4\u788e\u7247\u5316\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a\u672a\u77e5 \u2014 \u4fe1\u606f\u4e0d\u8db3\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u94fe\u63a5\u6253\u4e0d\u5f00\u3001\u4e0a\u4f20\u9519\u8bef\u97f3\u9891\uff09\u65f6\uff0c\u4e3b\u52a8\u3001\u5e73\u548c\u5730\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u65e0\u4efb\u4f55\u60c5\u7eea\u5d29\u6e83\u6216\u62b1\u6028\u8ff9\u8c61\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08\u7b2c\u4e00\u4e2a\u6253\u4e0d\u5f00\u5440\uff01\u201d > \u201c\u5e08\u59d0\uff0c\u4f60\u6628\u5929\u53d1\u7ed9\u6211\u90a3\u4e2a\u8bd5\u97f3\u5355\u6211\u70b9\u9519\u4e86\uff0c\u4e0a\u4f20\u7684\u9519\u8bef\u97f3\u9891\u600e\u4e48\u529e\uff1f\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 (\u7126\u8651\u4fdd\u969c)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u4f5c\u4e3a\u201c\u534a\u804c\u4e1a\u7684\u5168\u5988\u5988\u201d\uff0c\u5b58\u5728\u7ecf\u6d4e\u72ec\u7acb\u7684\u6e34\u671b\u4e0e\u5bb6\u5ead\u8d23\u4efb\u5e26\u6765\u7684\u65f6\u95f4\u538b\u529b\uff0c\u6838\u5fc3\u75db\u70b9\u662f\u5bfb\u6c42\u4e00\u4efd\u80fd\u517c\u987e\u5bb6\u5ead\u3001\u65f6\u95f4\u7075\u6d3b\u3001\u6709\u7a33\u5b9a\u6536\u5165\u4fdd\u969c\u7684\u526f\u4e1a\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u63d0\u4f9b\u660e\u786e\u7684\u53d8\u73b0\u8def\u5f84\u4e0e\u201c\u786e\u5b9a\u6027\u201d**\u3002\u5979\u9700\u8981\u770b\u5230\u6e05\u6670\u7684\u201c\u5de5\u79cd\u201d\uff08\u753b\u672c\u3001\u5ba1\u542c\u3001\u5bf9\u8f68\u3001\u540e\u671f\uff09\u548c\u201c\u63a5\u5355\u201d\u53ef\u80fd\u6027\uff0c\u4ee5\u5bf9\u6297\u5bf9\u672a\u6765\u7684\u4e0d\u786e\u5b9a\u6027\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 **B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u52a8\u673a\u9ad8\u3001\u5f39\u6027\u9ad8\u3001\u8d44\u6e90\u4e2d\uff0c\u52a1\u5b9e\u80af\u5e72\uff0c\u6267\u884c\u529b\u5f3a) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u7b49\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4e2d | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u9700\u8b66\u60d5\u5176\u201c\u534a\u804c\u4e1a\u5168\u5988\u5988\u201d\u8eab\u4efd\u80cc\u540e\u662f\u5426\u5b58\u5728\u5bb6\u5ead\u7ecf\u6d4e\u538b\u529b\u6216\u53cd\u5bf9\u610f\u89c1\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5c1a\u53ef\uff0c\u4e14\u4e3b\u52a8\u6027\u5f3a\uff0c\u4f46\u9700\u5173\u6ce8\u5176\u201c\u788e\u7247\u5316\u201d\u65f6\u95f4\u4e0e\u8bfe\u7a0b\u5f3a\u5ea6\u7684\u5339\u914d\u5ea6\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u4e8b\u4e3b\u52a8\u6c9f\u901a\u89e3\u51b3\uff0c\u65e0\u81ea\u5351\u3001\u62b1\u6028\u4fe1\u53f7\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u5176\u201c\u4e3a\u6323\u94b1\u800c\u6765\u201d\u7684\u52a8\u673a\u660e\u786e\uff0c\u82e5\u5728\u627f\u8bfa\u671f\u5185\uff08\u5982\u201c\u8fd9\u51e0\u5929\u5c31\u53ef\u4ee5\u5f00\u59cb\u5c1d\u8bd5\u5b9e\u6218\u63a5\u5355\u201d\uff09\u672a\u83b7\u5f97\u5b9e\u8d28\u6027\u63a5\u5355\u673a\u4f1a\u6216\u6536\u5165\uff0c\u6781\u6613\u4ea7\u751f\u88ab\u6b3a\u9a97\u611f\uff0c\u89e6\u53d1\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e1-2\u4e2a\u6708**\u3002\u82e5\u6b64\u65f6\u4ecd\u672a\u83b7\u5f97\u6709\u6548\u7684\u63a5\u5355\u5f15\u5bfc\u6216\u5fae\u5c0f\u53d8\u73b0\u6210\u679c\uff0c\u6536\u76ca\u843d\u5dee\u611f\u5c06\u8fbe\u5230\u9876\u5cf0\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u59d0\uff0c\u770b\u5230\u4f60\u53c8\u662f\u5e26\u5a03\u53c8\u662f\u5b66\u4e60\uff0c\u771f\u7684\u592a\u62fc\u4e86\uff01\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u5c31\u662f\u4e3a\u4f60\u8fd9\u6837\u60f3\u517c\u987e\u5bb6\u5ead\u548c\u6536\u5165\u7684\u5988\u5988\u8bbe\u8ba1\u7684\u3002\u4f60\u653e\u5fc3\uff0c\u6211\u4f1a\u628a\u6700\u9002\u5408\u54b1\u4eec\u5b9d\u5988\u65f6\u95f4\u7075\u6d3b\u3001\u4e0a\u624b\u5feb\u7684\u63a5\u5355\u95e8\u8def\uff08\u6bd4\u5982\u5ba1\u542c\u3001\u5bf9\u8f68\uff09\u4f18\u5148\u6574\u7406\u7ed9\u4f60\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u7a33\u7a33\u5730\u628a\u94b1\u8d5a\u4e86\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011\u3002\u5339\u914d\u5176\u9ad8\u52a8\u673a\u548c\u52a1\u5b9e\u6027\u683c\uff0c\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u843d\u5730\u7684\u6280\u80fd\u8def\u5f84\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010\u7cbe\u786e\u6d3e\u5355\u62e6\u622a\u5305 (B\u6a21\u5757)\u3011\u3002\u9488\u5bf9\u5176\u201c\u5ba1\u542c\u540e\u671f\u90fd\u6709\u5174\u8da3\u201d\u7684\u660e\u786e\u65b9\u5411\uff0c\u63d0\u4f9b\u7cbe\u51c6\u7684\u5de5\u79cd\u4ecb\u7ecd\u3001\u63a5\u5355\u6e20\u9053\u548c\u521d\u671f\u7b80\u5355\u7684\u5b9e\u6218\u4efb\u52a1\uff0c\u5feb\u901f\u5efa\u7acb\u201c\u6211\u80fd\u8d5a\u94b1\u201d\u7684\u4fe1\u5fc3\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u753b\u4e0d\u5207\u5b9e\u9645\u7684\u5927\u997c\uff08\u5982\u201c\u4e00\u4e2a\u6708\u8f7b\u677e\u8fc7\u4e07\u201d\uff09\u3002\u907f\u514d\u8fc7\u5ea6\u5f3a\u8c03\u201c\u901f\u6210\u201d\uff0c\u800c\u5e94\u5f3a\u8c03\u201c\u8def\u5f84\u6e05\u6670\u201d\u548c\u201c\u79ef\u7d2f\u53d8\u73b0\u201d\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u9700\u7ed1\u5b9a\u660e\u786e\u6210\u679c**\u3002\u5728\u5b8c\u6210\u521d\u671f\u5c0f\u5355\u3001\u5efa\u7acb\u4fe1\u4efb\u540e\uff0c\u53ef\u987a\u52bf\u63a8\u4ecb\u9ad8\u9636\u8bbe\u5907\u6216\u6df1\u5ea6\u8bfe\u7a0b\uff0c\u4f46\u5fc5\u987b\u4e0e\u5176\u5df2\u5c55\u73b0\u7684\u5174\u8da3\uff08\u5982\u540e\u671f\uff09\u548c\u5df2\u53d6\u5f97\u7684\u5fae\u5c0f\u6210\u679c\u5f3a\u5173\u8054\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6765\u5230\u8fd9\u4e2a\u5e73\u53f0\u5462\uff0c\u4e0d\u662f\u4e3a\u4ec0\u4e48\uff0c\u5c31\u4e3a\u4e86\u6323\u94b1\uff0c\u6240\u4ee5\u55ef\u4ee5\u540e\u6709\u4ec0\u4e48\u55ef\u6765\u94b1\u7684\u8def\u5b50\u7684\u8bdd\uff0c\u5927\u5bb6\u53ef\u4ee5\u5171\u540c\u53bb\u5206\u4eab\u4e00\u4e0b\u3002\u201d **(\u9ad8\u7eaf\u5ea6\u641e\u94b1\u52a8\u673a)**\n2. > \u201c\u8001\u5e08\u7b2c\u4e00\u4e2a\u6253\u4e0d\u5f00\u5440\uff01\u201d \u201c\u5e08\u59d0\uff0c\u4f60\u6628\u5929\u53d1\u7ed9\u6211\u90a3\u4e2a\u8bd5\u97f3\u5355\u6211\u70b9\u9519\u4e86\uff0c\u4e0a\u4f20\u7684\u9519\u8bef\u97f3\u9891\u600e\u4e48\u529e\uff1f\u201d **(\u9ad8\u5fc3\u7406\u5f39\u6027\uff0c\u9047\u4e8b\u4e3b\u52a8\u6c9f\u901a\u89e3\u51b3)**\n3. > \u201c\u5ba1\u542c\u540e\u671f\u90fd\u6709\u5174\u8da3\u201d **(\u76ee\u6807\u660e\u786e\uff0c\u5bf9\u53d8\u73b0\u8def\u5f84\u6709\u5177\u4f53\u601d\u8003)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2 \u4f4e\u8c03\u8001\u9ec4\u725b**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u4e00\u4efd\u65f6\u95f4\u7075\u6d3b\u3001\u6709\u786e\u5b9a\u6536\u5165\u4fdd\u969c\u7684\u526f\u4e1a\uff08\u5b89\u5168\u9700\u6c42\uff09**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u5728\u627f\u8bfa\u671f\u5185\uff081-2\u4e2a\u6708\uff09\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u6267\u884c\u7684\u63a5\u5355\u8def\u5f84\u548c\u5fae\u5c0f\u6210\u679c\u9a8c\u8bc1\uff0c\u675c\u7edd\u6536\u76ca\u843d\u5dee**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u5973\", \"city\": \"\u56db\u5ddd\"}\n```";
