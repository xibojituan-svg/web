    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a**\u9ad8**\u3002\u7528\u6237\u8868\u73b0\u51fa\u6781\u5f3a\u7684\u5b66\u4e60\u6295\u5165\u5ea6\u4e0e\u76ee\u6807\u611f\u3002\u4e3b\u52a8\u7ec4\u7ec7\u961f\u4f0d\u3001\u7814\u7a76\u8d5b\u5236\u3001\u534f\u8c03\u961f\u53cb\u3001\u94bb\u7814AU\u6280\u672f\u7ec6\u8282\u3001\u4e3b\u52a8\u5206\u4eab\u7ecf\u9a8c\u3001\u89c4\u5212\u65f6\u95f4\u3002\u5c06\u8bfe\u7a0b\u5b66\u4e60\u4e0e\u672a\u6765\u5c31\u4e1a/\u53d8\u73b0\uff08\u201c\u6709\u58f0\u561b\uff0c\u5c31\u662f\u540e\u9762\u4e00\u4e2a\u5927\u6982\u7684\u4e00\u4e2a\u5c31\u4e1a\u65b9\u5411\u5427\u201d\uff09\u53ca\u4e2a\u4eba\u5174\u8da3\uff08\u4e3a\u5199\u5267\u672c\u753b\u5c01\u9762\u800c\u5b66\u753b\u753b\uff09\u660e\u786e\u5173\u8054\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4e2d\u9ad8**\u3002\u7528\u6237\u4e3a\u4e0a\u6d77\u5730\u533a\u5b9d\u5988\uff0c\u6709\u8f66\uff0c\u80fd\u8d1f\u62c5**\u516d\u5343\u591a\u5143\u7684\u7ed8\u753b\u76f4\u64ad\u8bfe**\uff0c\u8868\u660e\u6709\u8f83\u597d\u7684\u7ecf\u6d4e\u57fa\u7840\u4e0e\u4ed8\u8d39\u5b66\u4e60\u610f\u613f\u3002\u62e5\u6709\u4e13\u4e1a\u5f55\u97f3\u8bbe\u5907\u5e76\u4e3b\u52a8\u8c03\u8bd5\uff0c\u5177\u5907\u57fa\u7840\u786c\u4ef6\u6761\u4ef6\u3002\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u8f83\u5f3a\uff08\u534f\u8c03\u591a\u4e2a\u8bfe\u7a0b\u4e0e\u80b2\u513f\uff09\uff0c\u4f46**\u80b2\u513f\uff08\u4e24\u4e2a\u5c0f\u5b69\uff09\u548c\u5bb6\u5ead\u4e8b\u52a1\uff08\u72ec\u81ea\u957f\u9014\u9a7e\u8f66\u56de\u8001\u5bb6\uff09\u4f1a\u6324\u5360\u56fa\u5b9a\u5b66\u4e60\u65f6\u95f4**\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a**\u9ad8**\u3002\u7528\u6237\u60c5\u7eea\u7a33\u5b9a\u3001\u79ef\u6781\uff0c\u6c9f\u901a\u4e2d\u9891\u7e41\u4f7f\u7528[\u5077\u7b11][\u7834\u6d95\u4e3a\u7b11]\u7b49\u8868\u60c5\uff0c\u9762\u5bf9\u8bbe\u5907\u95ee\u9898\uff08\u58f0\u9053\u4e0d\u5e73\u8861\uff09\u3001\u65f6\u95f4\u51b2\u7a81\u3001\u80b2\u513f\u5e72\u6270\u7b49\u6311\u6218\u65f6\uff0c\u6001\u5ea6\u4e50\u89c2\uff0c\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff08\u627e\u8001\u5e08\u8fdc\u7a0b\u8c03\u8bd5\u3001\u8c03\u6574\u8bfe\u7a0b\u5b89\u6392\uff09\uff0c\u5e76\u4e50\u4e8e\u52a9\u4eba\uff0c\u5728\u793e\u7fa4\u4e2d\u626e\u6f14**\u7ec4\u7ec7\u8005\u4e0e\u652f\u6301\u8005**\u89d2\u8272\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u8bb0\u5f55\u672a\u76f4\u63a5\u6d89\u53ca\u652f\u4ed8\u73af\u8282\uff0c\u4f46\u7528\u6237\u63d0\u53ca\u5df2\u62a5\u540d\u6210\u529f\uff08\u201c\u62a5\u540d\u6210\u529f\u5566\u201d\uff09\u5e76\u79ef\u6781\u53c2\u4e0e\u540e\u7eed\u6240\u6709\u8bfe\u7a0b\u6d3b\u52a8\uff0c**\u9ed8\u8ba4\u652f\u4ed8\u5df2\u5b8c\u6210\u4e14\u65e0\u5f02\u8bae**\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u7528\u6237\u4e3a\u5bb6\u5ead\u4e3b\u5987\uff08\u201c\u5728\u5bb6\u91cc\u9762\u6ca1\u6709\u4e0a\u7740\u73ed\u201d\uff09\uff0c\u4e08\u592b\u5728\u56fd\u5916\u9879\u76ee\u3002\u7528\u6237\u81ea\u4e3b\u51b3\u7b56\u62a5\u540d\u591a\u4e2a\u8bfe\u7a0b\uff08\u6709\u58f0\u3001\u7ed8\u753b\uff09\u3001\u5b89\u6392\u957f\u9014\u81ea\u9a7e\u56de\u8001\u5bb6\u7b49\u4e8b\u5b9c\uff0c\u663e\u793a\u51fa**\u6781\u9ad8\u7684\u5bb6\u5ead\u5185\u90e8\u51b3\u7b56\u81ea\u4e3b\u6743**\u3002\u7ecf\u6d4e\u652f\u51fa\u7531\u4e2a\u4eba/\u5bb6\u5ead\u5171\u540c\u627f\u62c5\uff0c\u65e0\u51b3\u7b56\u969c\u788d\u4fe1\u53f7\u3002\n*   **\u6b65\u9aa41-4\u5224\u5b9a**\uff1a\n    *   **A\uff08\u52a8\u673a\uff09**\uff1a\u5f3a\u5185\u5728\u9a71\u52a8\uff08\u5174\u8da3+\u804c\u4e1a\u89c4\u5212\uff09\uff0c**A+**\u3002\n    *   **B\uff08\u8d44\u6e90\uff09**\uff1a\u65f6\u95f4\u76f8\u5bf9\u5145\u88d5\u4f46\u788e\u7247\u5316\uff0c\u7ecf\u6d4e\u4e0e\u8bbe\u5907\u8d44\u6e90\u5145\u8db3\uff0c**B+**\u3002\n    *   **C\uff08\u884c\u52a8\uff09**\uff1a\u884c\u52a8\u529b\u6781\u5f3a\uff0c\u9ad8\u5ea6\u5377\u5165\u8bfe\u7a0b\u4e0e\u793e\u7fa4\u6d3b\u52a8\uff0c**C+**\u3002\n    *   **D\uff08\u5339\u914d\uff09**\uff1a\u8bfe\u7a0b\u5185\u5bb9\uff08\u6709\u58f0\u6f14\u64ad\u3001AU\u6280\u672f\u3001\u6bd4\u8d5b\uff09\u4e0e\u7528\u6237\u76ee\u6807\u9ad8\u5ea6\u5339\u914d\uff0c\u7528\u6237\u79ef\u6781\u5e94\u7528\u3002**D+**\u3002\n*   **\u7efc\u5408\u5224\u5b9a**\uff1a**A+\u578b\u4f18\u8d28\u5b66\u5458**\u3002\u9ad8\u52a8\u673a\u3001\u5f3a\u884c\u52a8\u3001\u8d44\u6e90\u9002\u914d\uff0c\u662f\u8bfe\u7a0b\u7684\u7406\u60f3\u53c2\u4e0e\u8005\u548c\u793e\u7fa4\u6d3b\u8dc3\u8d21\u732e\u8005\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**\uff1a**T3 \u81ea\u5f8b\u8fdb\u53d6\u8005**\u3002\u6838\u5fc3\u7279\u5f81\uff1a\u76ee\u6807\u660e\u786e\u3001\u81ea\u6211\u9a71\u52a8\u6027\u5f3a\u3001\u5b66\u4e60\u6295\u5165\u5ea6\u9ad8\u3001\u5584\u4e8e\u89c4\u5212\u4e0e\u6267\u884c\u3001\u4e50\u4e8e\u5206\u4eab\u5e76\u627f\u62c5\u7ec4\u7ec7\u89d2\u8272\u3002\u7528\u6237\u5b8c\u5168\u7b26\u5408\u8be5\u539f\u578b\u63cf\u8ff0\u3002\n*   **\u6b21\u8981\u539f\u578b\u7279\u5f81**\uff1a\u7565\u5e26T1\uff08\u5174\u8da3\u63a2\u7d22\u8005\uff09\u7684\u591a\u5143\u5174\u8da3\u63a2\u7d22\uff08\u540c\u65f6\u5b66\u4e60\u7ed8\u753b\uff09\uff0c\u4f46\u4ee5T3\u7684\u6df1\u5ea6\u6295\u5165\u548c\u6210\u679c\u5bfc\u5411\u4e3a\u4e3b\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u6574\u4f53\u98ce\u9669**\uff1a**\u6781\u4f4e**\u3002\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a\u98ce\u9669\u6781\u4f4e\u3002\u7528\u6237\u5b66\u4e60\u8fc7\u7a0b\u79ef\u6781\uff0c\u5df2\u6709\u521d\u6b65\u6536\u83b7\u611f\uff08\u8bbe\u5907\u8c03\u8bd5\u6210\u529f\u3001\u53c2\u4e0e\u6bd4\u8d5b\uff09\uff0c\u4e14\u8ba4\u77e5\u7406\u6027\uff08\u201c\u8fd8\u5728\u5b66\u4e60\u4e2d\u201d\uff09\u3002\n    2.  **\u65f6\u95f4\u51b2\u7a81**\uff1a\u98ce\u9669**\u4f4e**\u3002\u7528\u6237\u867d\u65f6\u95f4\u7d27\u5f20\uff08\u80b2\u513f\u3001\u5176\u4ed6\u8bfe\u7a0b\u3001\u957f\u9014\u51fa\u884c\uff09\uff0c\u4f46\u5c55\u73b0\u51fa\u5353\u8d8a\u7684\u65f6\u95f4\u89c4\u5212\u4e0e\u534f\u8c03\u80fd\u529b\uff08\u8c03\u6574\u753b\u753b\u8bfe\u3001\u6302\u673a\u542c\u8bfe\uff09\uff0c\u5e76\u63d0\u524d\u9884\u8b66\uff08\u201c\u73ed\u4f1a\u53ef\u80fd\u8d76\u4e0d\u4e0a\u201d\uff09\uff0c\u9884\u671f\u7ba1\u7406\u826f\u597d\u3002\n    3.  **\u7ecf\u6d4e\u538b\u529b**\uff1a\u98ce\u9669\u6781\u4f4e\u3002\u5df2\u4ed8\u8d39\u53c2\u52a0\u5176\u4ed6\u9ad8\u4ef7\u8bfe\u7a0b\uff0c\u8868\u660e\u6709\u6301\u7eed\u6559\u80b2\u6295\u8d44\u610f\u613f\u548c\u80fd\u529b\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a\u98ce\u9669\u6781\u4f4e\u3002\u5bb6\u5ead\u51b3\u7b56\u6743\u81ea\u4e3b\uff0c\u4e14\u5c06\u5b66\u4e60\u4e0e\u5bb6\u5ead\u8d23\u4efb\uff08\u6559\u5b69\u5b50\u753b\u753b\uff09\u7ed3\u5408\u3002\n    5.  **\u670d\u52a1\u4f53\u9a8c**\uff1a\u98ce\u9669\u4f4e\u3002\u4e0e\u9500\u552e\uff08\u73ed\u73ed\uff09\u4e92\u52a8\u6b63\u5e38\uff0c\u4e3b\u8981\u95ee\u9898\u4e3a\u6280\u672f\u64cd\u4f5c\u7c7b\uff0c\u5df2\u83b7\u89e3\u51b3\u3002**\u9700\u5173\u6ce8\u73ed\u73ed\u56de\u590d\u7684\u53ca\u65f6\u6027\u4e0e\u4e13\u4e1a\u6027**\uff08\u5982\u5bf9\u4f1a\u8bae\u56de\u653e\u3001\u89c4\u5219\u4e0d\u6e05\u7684\u56de\u590d\u8f83\u4e3a\u6a21\u7cca\uff09\u3002\n    6.  **\u4ea7\u54c1\u9519\u914d**\uff1a\u98ce\u9669\u6781\u4f4e\u3002\u7528\u6237\u5bf9\u8bfe\u7a0b\u5185\u5bb9\uff08AU\u3001\u6bd4\u8d5b\u3001\u6f14\u64ad\uff09\u8868\u73b0\u51fa\u6d53\u539a\u5174\u8da3\u548c\u5b9e\u9645\u5e94\u7528\u3002\n    7.  **\u4ece\u4f17\u540e\u6094**\uff1a\u98ce\u9669\u6781\u4f4e\u3002\u51b3\u7b56\u57fa\u4e8e\u4e2a\u4eba\u5174\u8da3\u4e0e\u804c\u4e1a\u89c4\u5212\uff0c\u975e\u51b2\u52a8\u6216\u4ece\u4f17\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u65e0\u91cd\u5927\u4f26\u7406\u98ce\u9669**\u3002\u9500\u552e\u6c9f\u901a\u8bb0\u5f55\u7247\u6bb5\u4e2d\u672a\u53d1\u73b0\u8fc7\u5ea6\u627f\u8bfa\u3001\u5938\u5927\u6536\u76ca\u3001\u5236\u9020\u7126\u8651\u7b49\u8fdd\u89c4\u8bdd\u672f\u3002\n*   **\u6f5c\u5728\u6539\u8fdb\u70b9**\uff1a\u9500\u552e\uff08\u73ed\u73ed\uff09\u5bf9\u90e8\u5206\u8bfe\u7a0b\u5b89\u6392\uff08\u5982\u4f1a\u8bae\u56de\u653e\u3001\u89c4\u5219\u7ec6\u8282\uff09\u7684\u56de\u590d\u8f83\u4e3a\u7b80\u7565\uff08\u201c\u6211\u4e5f\u4e0d\u6e05\u695a\u201d\u3001\u201c\u6211\u4eec\u8e6d\u8bfe\u7684\u201d\uff09\uff0c**\u867d\u672a\u8fdd\u89c4\uff0c\u4f46\u53ef\u80fd\u5f71\u54cd\u4e13\u4e1a\u670d\u52a1\u4f53\u9a8c**\u3002\u5efa\u8bae\u63d0\u4f9b\u66f4\u51c6\u786e\u3001\u4e3b\u52a8\u7684\u4fe1\u606f\u540c\u6b65\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d**\uff1a**\u9ad8\u5ea6\u5339\u914d**\u3002\u5f53\u524d\u8bfe\u7a0b\uff08\u542b\u6bd4\u8d5b\u3001\u5b9e\u64cd\u3001\u70b9\u8bc4\uff09\u5b8c\u5168\u7b26\u5408\u7528\u6237\u63d0\u5347\u6280\u80fd\u3001\u53c2\u4e0e\u5b9e\u8df5\u3001\u83b7\u5f97\u53cd\u9988\u7684\u6df1\u5ea6\u9700\u6c42\u3002\n*   **\u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9996\u4f18\u52a8\u4f5c**\uff1a**\u8d4b\u4e88\u793e\u7fa4\u7ec4\u7ec7\u89d2\u8272\uff0c\u63d0\u4f9b\u6df1\u5ea6\u652f\u6301**\u3002\u53ef\u9080\u8bf7\u5176\u62c5\u4efb\u5c0f\u7ec4\u957f\u6216\u73ed\u7ea7\u52a9\u624b\uff0c\u53d1\u6325\u5176\u7ec4\u7ec7\u534f\u8c03\u80fd\u529b\u3002\n    2.  **\u670d\u52a1\u5f3a\u5316**\uff1a\u8ba4\u53ef\u5176\u5b66\u4e60\u70ed\u60c5\u4e0e\u8d21\u732e\uff0c\u5728\u516c\u5f00\u573a\u5408\u7ed9\u4e88\u8868\u626c\u3002\u5bf9\u5176\u63d0\u51fa\u7684\u6280\u672f\u3001\u89c4\u5219\u95ee\u9898\uff0c\u63d0\u4f9b**\u6e05\u6670\u3001\u53ca\u65f6\u3001\u6743\u5a01\u7684\u89e3\u7b54**\uff0c\u907f\u514d\u6a21\u7cca\u56de\u5e94\u3002\n    3.  **\u98ce\u9669\u9884\u9632**\uff1a**\u63d0\u524d\u540c\u6b65\u8bfe\u7a0b\u5173\u952e\u65f6\u95f4\u8282\u70b9\u4e0e\u5047\u671f\u5b89\u6392**\uff0c\u5e2e\u52a9\u5176\u66f4\u597d\u5730\u89c4\u5212\u65f6\u95f4\uff0c\u5c24\u5176\u662f\u5728\u5176\u63d0\u53ca\u7684\u5bd2\u5047\u671f\u95f4\u548c\u957f\u9014\u51fa\u884c\u671f\u95f4\u3002\u53ef\u63d0\u4f9b\u8bfe\u7a0b\u56de\u653e\u3001\u8d44\u6599\u5305\u7b49\u7075\u6d3b\u5b66\u4e60\u652f\u6301\u3002\n    4.  **\u6f5c\u529b\u6316\u6398**\uff1a\u4f5c\u4e3a**\u9ad8\u610f\u5411\u7eed\u8d39\u6216\u5347\u73ed\u6f5c\u5728\u7528\u6237**\uff0c\u53ef\u5173\u6ce8\u5176\u5b66\u4e60\u8fdb\u5c55\uff0c\u5728\u8bfe\u7a0b\u540e\u671f\u9002\u65f6\u4ecb\u7ecd\u66f4\u8fdb\u9636\u7684\u8bfe\u7a0b\u6216\u670d\u52a1\uff0c\u94fe\u63a5\u5176\u201c\u5c31\u4e1a\u65b9\u5411\u201d\u76ee\u6807\u3002\n\n{\"core_type\": \"T3 \u81ea\u5f8b\u8fdb\u53d6\u8005\", \"risk_level\": \"\u6781\u4f4e\", \"refund_risk\": \"\u6781\u4f4e\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u8d4b\u4e88\u7ec4\u7ec7\u89d2\u8272\uff0c\u63d0\u4f9b\u6df1\u5ea6\u652f\u6301\"}";
