    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a565117540\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 565117540 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-14 \u81f3 2026-03-19 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u552f\u4e00\u9e3f\u989c(\u5f20\u6653\u6587) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u5177\u4f53\u8bfe\u7a0b\u540d\u79f0\u53ca\u4ef7\u683c\u672a\u77e5\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3** |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u6df1\u591c\u5b66\u4e60\uff0c\u767d\u5929\u5fd9\uff0c\u8def\u4e0a\u542c\u8bfe\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3** |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** - \u7f3a\u4e4f\u652f\u4ed8\u3001\u5bb6\u5ead\u3001\u804c\u4e1a\u3001\u62a5\u540d\u52a8\u673a\u7b49\u5173\u952e\u4fe1\u606f\uff0c\u4ec5\u80fd\u57fa\u4e8e\u5b66\u4e60\u8fc7\u7a0b\u884c\u4e3a\u5206\u6790\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u201c\u62a2\u4e66\u201d\u3001\u201c\u8bd5\u97f3\u201d\u3001\u201c\u5f55\u4e66\u201d\u7b49\u53d8\u73b0\u76f8\u5173\u6d3b\u52a8\u7684\u79ef\u6781\u5c1d\u8bd5\uff0c\u4f46\u540c\u65f6\u4e5f\u5c55\u73b0\u51fa\u5bf9\u201c\u57fa\u672c\u529f\u201d\u3001\u201c\u60c5\u7eea\u6f14\u7ece\u201d\u3001\u201c\u6587\u672c\u5206\u6790\u201d\u7b49\u80fd\u529b\u63d0\u5347\u5185\u5bb9\u7684\u5b66\u4e60\u610f\u613f\u548c\u56f0\u60d1\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8fd9\u6b21\u62a2\u4e86\u8fd9\u4e2a\u4e66...\u4e0d\u77e5\u9053\u81ea\u5df1\u4f1a\u90a3\u4e2a\u7c7b\u578b\uff0c\u90fd\u8bd5\u8bd5\u201d > \u201c\u6211\u611f\u89c9\u6211\u4ec0\u4e48\u97f3\u6211\u90fd\u5b66\u4e0d\u4f1a...\u53ef\u80fd\u662f\u6ca1\u6709\u8ba4\u771f\u5b66\uff0c\u6211\u5f80\u540e\u7684\u52a0\u6cb9\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4fe1\u606f\u4e0d\u8db3] \u2014 \u65e0\u76f8\u5173\u4fe1\u606f\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4f4e] \u2014 **\u6838\u5fc3\u77ed\u677f**\u3002\u7528\u6237\u591a\u6b21\u63d0\u53ca\u201c\u65f6\u95f4\u592a\u5c11\u201d\u3001\u201c\u665a\u4e0a\u6df1\u591c\u8fd8\u5728\u5b66\u4e60\uff0c\u767d\u5929\u90fd\u6ca1\u6709\u65f6\u95f4\u201d\u3001\u201c\u5728\u56de\u5bb6\u7684\u8def\u4e0a\u201d\u3001\u201c\u521a\u624d\u6211\u6b63\u5fd9\u201d\uff0c\u663e\u793a\u5176\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\u4e14\u7d27\u5f20\uff0c\u5b66\u4e60\u65f6\u95f4\u9700\u201c\u62fc\u51d1\u201d\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u4e0d\u8db3] \u2014 \u65e0\u76f8\u5173\u4fe1\u606f\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b07\u4f4e\u6781\u5371]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u9891\u7e41\u81ea\u6211\u5426\u5b9a\uff08\u201c\u6211\u771f\u7b28\u201d\u3001\u201c\u6211\u8fd9\u4e2a\u5b66\u751f\u6559\u8d77\u6765\u6709\u70b9\u8d39\u52b2\u201d\u3001\u201c\u6211\u611f\u89c9\u6211\u4ec0\u4e48\u97f3\u6211\u90fd\u5b66\u4e0d\u4f1a\u201d\uff09\uff0c\u5bf9\u64cd\u4f5c\u6d41\u7a0b\uff08\u4f5c\u4e1a\u63d0\u4ea4\u3001\u4f1a\u8bae\u65f6\u95f4\u3001\u6587\u672c\u96c6\u6570\uff09\u8868\u73b0\u51fa\u660e\u663e\u7684\u6df7\u4e71\u548c\u4f9d\u8d56\uff0c\u9700\u8981\u73ed\u4e3b\u4efb\u53cd\u590d\u786e\u8ba4\u548c\u5b89\u629a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08\uff01\u6211\u7684\u8bd5\u97f3\u6ca1\u6709\u4e0a\u4f20\u8fc7\u671f\u4e86[\u6487\u5634]\u201d > \u201c\u6211\u662f\u4e0d\u662f\u6709\u4f5c\u4e1a\u6ca1\u6709\u5b8c\u6210\u5440\u201d > \u201c\u6211\u5230\u5e95\u662f\u662f\u8bfb13\u8fd8\u662f\u8bfb10\u7b2c10\u7ea7\uff1f\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u5ea6\u7684\u4e0d\u81ea\u4fe1\u4e0e\u4ef7\u503c\u611f\u7f3a\u5931**\u3002\u7528\u6237\u5c06\u5b66\u4e60\u4e2d\u7684\u4efb\u4f55\u5c0f\u632b\u6298\uff08\u5982\u5f55\u9519\u96c6\u6570\u3001\u64cd\u4f5c\u5931\u8bef\uff09\u90fd\u5f52\u56e0\u4e3a\u81ea\u8eab\u201c\u7b28\u201d\u3001\u201c\u4e66\u8bfb\u7684\u5c11\u201d\uff0c\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u6280\u80fd\u6765\u83b7\u5f97\u5916\u754c\u7684\u8ba4\u53ef\u548c\u81ea\u6211\u80af\u5b9a\uff0c\u586b\u8865\u5185\u5fc3\u7684\u4ef7\u503c\u6d3c\u5730\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u5938\u5956\u80af\u5b9a\u4e0e\u65e0\u6761\u4ef6\u7684\u8010\u5fc3\u63a5\u7eb3**\u3002\u4ed6\u9700\u8981\u88ab\u53cd\u590d\u544a\u77e5\u201c\u4f60\u4e0d\u7b28\u201d\u3001\u201c\u4f60\u80fd\u884c\u201d\uff0c\u5e76\u901a\u8fc7\u5b8c\u6210\u5fae\u5c0f\u4efb\u52a1\u83b7\u5f97\u5373\u65f6\u3001\u5938\u5f20\u7684\u6b63\u9762\u53cd\u9988\uff0c\u6765\u5efa\u7acb\u8106\u5f31\u7684\u81ea\u4fe1\u5fc3\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1** \u7c7b (\u9ad8\u4f9d\u8d56\u3001\u4f4e\u5f39\u6027\u3001\u8d44\u6e90\u7d27\u5f20) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1] (\u57fa\u4e8e\u73b0\u6709\u4fe1\u606f\uff0c\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u7b49\u7ea2\u7ebf)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a[\u65e0]\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | [\u4e2d] | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u65f6\u95f4\u7d27\u5f20\u53ef\u80fd\u6324\u538b\u5bb6\u5ead\u8d23\u4efb\uff0c\u82e5\u5bb6\u4eba\u53cd\u5bf9\uff0c\u98ce\u9669\u6fc0\u589e\u3002** |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **[\u6781\u9ad8]** | **\u8fd9\u662f\u6700\u5927\u98ce\u9669\u70b9\u3002** \u5176\u788e\u7247\u5316\u65f6\u95f4\u4e0e\u8bfe\u7a0b\u56fa\u5b9a\u8282\u594f\u4e25\u91cd\u51b2\u7a81\uff0c\u4e00\u65e6\u4f5c\u4e1a\u5806\u79ef\u3001\u9519\u8fc7\u76f4\u64ad\uff0c\u6781\u6613\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u4ea7\u751f\u5de8\u5927\u632b\u8d25\u611f\u548c\u81ea\u8d23\uff0c\u8fdb\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **[\u6781\u9ad8]** | **\u6838\u5fc3\u98ce\u9669\u3002** \u4efb\u4f55\u6280\u672f\u6027\u56f0\u96be\uff08\u8f6f\u4ef6\u64cd\u4f5c\u3001\u6587\u672c\u7406\u89e3\u3001\u4f5c\u4e1a\u63d0\u4ea4\u5931\u8d25\uff09\u3001\u6216\u6765\u81ea\u8001\u5e08/\u540c\u5b66\u7684\u4efb\u4f55\u975e\u6b63\u9762\u53cd\u9988\uff08\u5373\u4f7f\u662f\u4e2d\u6027\u5efa\u8bae\uff09\uff0c\u90fd\u53ef\u80fd\u88ab\u5176\u89e3\u8bfb\u4e3a\u201c\u81ea\u5df1\u592a\u7b28\u201d\u7684\u8bc1\u660e\uff0c\u5bfc\u81f4\u60c5\u7eea\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | [\u4e2d] | \u77ed\u671f\u5185\u82e5\u201c\u62a2\u4e66\u201d\u3001\u201c\u8bd5\u97f3\u201d\u65e0\u679c\uff0c\u53ef\u80fd\u52a0\u5267\u5176\u201c\u6211\u4e0d\u884c\u201d\u7684\u8d1f\u9762\u8ba4\u77e5\uff0c\u4f46\u5f53\u524d\u5176\u5173\u6ce8\u70b9\u66f4\u591a\u5728\u201c\u5b66\u4f1a\u201d\u800c\u975e\u201c\u8d5a\u5230\u201d\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c2-3\u5468**\u3002\u6b64\u65f6\u8bfe\u7a0b\u96be\u5ea6\u63d0\u5347\uff08\u8fdb\u5165\u6587\u672c\u5206\u6790\u3001\u65c1\u767d\uff09\uff0c\u4f5c\u4e1a\u8981\u6c42\u66f4\u590d\u6742\uff0c\u5176\u65f6\u95f4\u7ba1\u7406\u77ed\u677f\u548c\u81ea\u4fe1\u5fc3\u77ed\u677f\u5c06\u540c\u65f6\u53d7\u5230\u4e25\u5cfb\u8003\u9a8c\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4eb2\u7231\u7684\u540c\u5b66\uff0c\u770b\u5230\u4f60\u6df1\u591c\u8fd8\u5728\u52aa\u529b\uff0c\u771f\u7684\u7279\u522b\u611f\u52a8\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u7a0b\u8bbe\u8ba1\u5c31\u662f\u8003\u8651\u5230\u5927\u5bb6\u65f6\u95f4\u4e0d\u56fa\u5b9a\uff0c\u6240\u4ee5**\u6bcf\u4e00\u6b65\u90fd\u7ed9\u4f60\u62c6\u89e3\u5f97\u7279\u522b\u7ec6\uff0c\u4f60\u53ea\u8981\u8ddf\u7740\u63d0\u793a\u4e00\u5c0f\u6b65\u4e00\u5c0f\u6b65\u6765\u5c31\u884c\uff0c\u5b8c\u5168\u4e0d\u7528\u6015\u2018\u6f0f\u6389\u2019\u4ec0\u4e48\u3002** \u8bb0\u4f4f\uff0c\u5728\u8fd9\u91cc\u6ca1\u6709\u2018\u7b28\u5b66\u751f\u2019\uff0c\u53ea\u6709\u8fd8\u6ca1\u627e\u5230\u65b9\u6cd5\u7684\u2018\u6f5c\u529b\u80a1\u2019\u3002\u6709\u4efb\u4f55\u5361\u4f4f\u7684\u5730\u65b9\uff0c\u968f\u65f6\u558a\u6211\uff0c\u6211\u7684\u4efb\u52a1\u5c31\u662f\u5e2e\u4f60\u628a\u8def\u94fa\u5e73\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5174\u8da3\u6e38\u4e50\u7ebf\u3011**\u3002**\u7edd\u5bf9\u7981\u6b62**\u63a8\u5165\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011\u6216\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011\u3002\u9996\u8981\u76ee\u6807\u662f\u8ba9\u4ed6\u5728\u65e0\u538b\u529b\u73af\u5883\u4e0b\u83b7\u5f97\u201c\u5b8c\u6210\u201d\u548c\u201c\u88ab\u8868\u626c\u201d\u7684\u4f53\u9a8c\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\uff08\u6ee1\u914d\uff09\u3011**\u3002\u5fc5\u987b\u914d\u5907\u3002\u5305\u62ec\uff1a\u2460\u6bcf\u65e5\u201c\u65e0\u8111\u8ddf\u7ec3\u201d\u5fae\u4efb\u52a1\uff08\u5982\u201c\u4eca\u5929\u53ea\u7ec35\u5206\u949f\u53e3\u90e8\u64cd\u5e76\u6253\u5361\u201d\uff09\uff1b\u2461\u4f5c\u4e1a\u63d0\u4ea4\u7684\u201c\u624b\u628a\u624b\u201d\u56fe\u6587\u6307\u5f15\uff1b\u2462\u5bf9\u5176\u4efb\u4f55\u5fae\u5c0f\u5b8c\u6210\u7ed9\u4e88\u201c\u54c7\u585e\uff01\u201d\u201c\u8fd9\u4e2a\u7ec6\u8282\u628a\u63e1\u5f97\u592a\u597d\u4e86\uff01\u201d\u7b49\u5938\u5f20\u5f0f\u8868\u626c\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u5176\u4f7f\u7528\u4efb\u4f55\u6279\u8bc4\u6216\u4e2d\u6027\u5efa\u8bae\u8bed\u6c14**\uff0c\u6240\u6709\u53cd\u9988\u5fc5\u987b\u5305\u88f9\u5728\u201c\u80af\u5b9a-\u5efa\u8bae-\u9f13\u52b1\u201d\u7684\u4e09\u660e\u6cbb\u7ed3\u6784\u4e2d\u3002\n    2. **\u7edd\u4e0d\u7ed9\u4ed6\u5e03\u7f6e\u8d85\u51fa\u5176\u5f53\u524d\u80fd\u529b\u7684\u6311\u6218\u6027\u4efb\u52a1**\uff08\u5982\u590d\u6742\u7684\u89d2\u8272\u97f3\u3001\u957f\u7bc7\u6587\u672c\uff09\u3002\n    3. **\u7edd\u4e0d\u5728\u7fa4\u5185\u516c\u5f00@\u4ed6\u8be2\u95ee\u4f5c\u4e1a\u8fdb\u5ea6**\uff0c\u6240\u6709\u6c9f\u901a\u79c1\u804a\u8fdb\u884c\u3002\n    4. **\u7edd\u4e0d\u4e0e\u4ed6\u8ba8\u8bba\u201c\u63a5\u5355\u201d\u3001\u201c\u53d8\u73b0\u5468\u671f\u201d\u3001\u201c\u884c\u4e1a\u7ade\u4e89\u201d\u7b49\u73b0\u5b9e\u538b\u529b\u8bdd\u9898\u3002**\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u5f53\u524d\u9636\u6bb5\uff0c\u4efb\u4f55\u5347\u5355\u5efa\u8bae\u90fd\u4f1a\u88ab\u4ed6\u89c6\u4e3a\u201c\u6211\u73b0\u5728\u7684\u94b1\u767d\u82b1\u4e86\uff0c\u8fd8\u9700\u8981\u66f4\u591a\u94b1\u624d\u80fd\u5b66\u4f1a\u201d\u7684\u538b\u529b\u6e90\uff0c\u6781\u6613\u89e6\u53d1\u9000\u8d39\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u8001\u5e08\uff01\u6211\u7684\u8bd5\u97f3\u6ca1\u6709\u4e0a\u4f20\u8fc7\u671f\u4e86[\u6487\u5634]\u201d **(\u5178\u578b\u4f9d\u8d56\u4e0e\u8106\u5f31\u8868\u73b0)**\n2. > \u201c\u8c22\u8c22\u8001\u5e08\uff01\u6559\uff0c\u6211\u8fd9\u4e2a\u5b66\u751f\u6559\u8d77\u6765\u6709\u70b9\u8d39\u52b2\u54c8\uff0c\u4e3b\u8981\u662f\u81ea\u5df1\u4e66\u8bfb\u7684\u5c11\uff0c\u597d\u591a\u5b57\u9762\u610f\u601d\u7406\u89e3\u4e0d\u900f...\u201d **(\u6df1\u5ea6\u81ea\u5351\u4e0e\u81ea\u6211\u5426\u5b9a)**\n3. > \u201c\u6211\u7684\u65f6\u95f4\u5c31\u662f\u592a\u5c11\u4e86\uff0c\u56e0\u4e3a\u665a\u4e0a\u665a\u4e0a\u6df1\u591c\u8fd8\u5728\u5b66\u4e60\uff0c\u767d\u5929\u90fd\u6ca1\u6709\u65f6\u95f4\u3002\u201d **(\u8d44\u6e90\u5e95\u5ea7\u77ed\u677f\u7684\u6838\u5fc3\u8bc1\u636e)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6\u60c5\u7eea\u5de8\u5a74\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u5c0a\u91cd\u4e0e\u4ef7\u503c\u8ba4\u540c**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u6781\u81f4\u7684\u60c5\u611f\u4fdd\u59c6\u5f0f\u670d\u52a1\uff0c\u5265\u79bb\u4e00\u5207\u5b66\u4e60\u632b\u8d25\u611f\uff0c\u7528\u5938\u5f20\u7684\u6b63\u9762\u53cd\u9988\u5582\u517b\u5176\u8106\u5f31\u7684\u81ea\u4fe1\u5fc3\uff0c\u5e76\u5e2e\u52a9\u4ed6\u62c6\u89e3\u4efb\u52a1\u81f3\u6700\u5c0f\u53ef\u6267\u884c\u5355\u5143\u3002**\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5c0a\u91cd\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf+\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\"}\n```";
