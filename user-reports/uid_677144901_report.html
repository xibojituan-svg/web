    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49)**\n    *   **\u5174\u8da3\u9a71\u52a8**\uff1a\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6709\u58f0\u6f14\u64ad\u7684\u771f\u5b9e\u5174\u8da3\uff0c\u4e3b\u52a8\u7d22\u8981\u7ec3\u4e60\u6587\u672c\u3001\u8be2\u95ee\u5546\u914d\u97f3\u9891\u53c2\u8003\u3001\u5206\u4eab\u5b66\u4e60\u540e\u5bf9\u5f71\u89c6\u5267\u58f0\u97f3\u7684\u5173\u6ce8\u53d8\u5316\uff08\u201c\u66f4\u591a\u5173\u6ce8\u7684\u662f\u58f0\u97f3\u4e86\u201d\uff09\u3002\n    *   **\u526f\u4e1a\u53d8\u73b0**\uff1a\u660e\u786e\u63d0\u53ca\u4e0a\u6d77\u751f\u6d3b\u6210\u672c\u9ad8\u3001\u5b69\u5b50\u6d88\u8d39\u9ad8\uff0c\u5bf9\u201c\u53d8\u73b0\u201d\u3001\u201c\u63a5\u5355\u8d44\u6e90\u201d\u7b49\u8bdd\u9898\u6709\u56de\u5e94\uff0c\u8868\u660e\u6709\u901a\u8fc7\u526f\u4e1a\u589e\u52a0\u6536\u5165\u7684\u73b0\u5b9e\u9700\u6c42\u3002\n    *   **\u5b66\u4e60\u6295\u5165**\uff1a\u79ef\u6781\u53c2\u4e0e\u6253\u5361\u3001\u63d0\u4ea4\u4f5c\u4e1a\u3001\u8be2\u95ee\u7ec3\u4e60\u65b9\u6cd5\uff0c\u914d\u5408\u5ea6\u8f83\u9ad8\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d\u7b49)**\n    *   **\u65f6\u95f4\u7cbe\u529b**\uff1a\u7528\u6237\u4e3a\u5bb6\u957f\uff08\u5b69\u5b50\u5df2\u8f83\u5927\uff09\uff0c\u6709\u4e00\u5b9a\u53ef\u652f\u914d\u7684\u788e\u7247\u5316\u65f6\u95f4\u53c2\u4e0e\u5b66\u4e60\u4e0e\u7ec3\u4e60\u3002\u66fe\u56e0\u5b69\u5b50\u53d1\u70e7\u4e34\u65f6\u5f71\u54cd\u53c2\u4e0e\uff0c\u4f46\u80fd\u5feb\u901f\u6062\u590d\u8ddf\u8fdb\u3002\n    *   **\u7ecf\u6d4e\u57fa\u7840**\uff1a\u8eab\u5904\u4e0a\u6d77\uff0c\u6709\u652f\u4ed8\u8bfe\u7a0b\u8d39\u7528\u7684\u80fd\u529b\uff08\u5df2\u4ed8\u6b3e\uff09\uff0c\u4f46\u5bf9\u4ef7\u683c\u53ef\u80fd\u654f\u611f\uff08\u8be2\u95ee\u201c\u4eca\u5929\u5c31\u8981\u4ed8\u6b3e\u5417\uff1f\u201d\uff09\u3002\n    *   **\u8bbe\u5907\u4e0e\u8ba4\u77e5**\uff1a\u521d\u6b65\u5177\u5907\u5b66\u4e60\u6761\u4ef6\uff08\u624b\u673a\uff09\uff0c\u5bf9\u884c\u4e1a\u6709\u57fa\u7840\u8ba4\u77e5\u5e76\u613f\u610f\u6295\u5165\u5b66\u4e60\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u9ad8)**\n    *   **\u914d\u5408\u4e0e\u97e7\u6027**\uff1a\u5bf9\u9500\u552e\u63a8\u9001\u7684\u4f5c\u4e1a\u3001\u76f4\u64ad\u3001\u6253\u5361\u4efb\u52a1\u5747\u80fd\u53ca\u65f6\u54cd\u5e94\u5e76\u5b8c\u6210\uff0c\u9762\u5bf9\u201c\u5b69\u5b50\u53d1\u70e7\u201d\u7a81\u53d1\u60c5\u51b5\u80fd\u59a5\u5584\u5904\u7406\u5e76\u7ee7\u7eed\u53c2\u4e0e\u540e\u7eed\u73af\u8282\u3002\n    *   **\u4e3b\u52a8\u6027\u4e0e\u6210\u957f\u5fc3\u6001**\uff1a\u4e3b\u52a8\u63d0\u95ee\uff08\u7d22\u8981\u6587\u672c\u3001\u8be2\u95ee\u7ec3\u4e60\u6cd5\u3001\u7248\u6743\u4e66\u5efa\u8bae\uff09\uff0c\u8ba4\u53ef\u201c\u575a\u6301\u7ec3\u4e60\u57fa\u672c\u529f\u201d\uff0c\u5b66\u4e60\u540e\u8ba4\u77e5\u53d1\u751f\u79ef\u6781\u53d8\u5316\u3002\n    *   **\u51b3\u7b56\u72ec\u7acb\u6027**\uff1a\u80fd\u57fa\u4e8e\u81ea\u8eab\u60c5\u51b5\uff08\u5982\u9009\u62e9\u513f\u7ae5\u6545\u4e8b\u96c6\uff09\u505a\u51fa\u5224\u65ad\uff0c\u4f46\u6574\u4f53\u5bf9\u9500\u552e\u5f15\u5bfc\u7684\u670d\u4ece\u6027\u8f83\u9ad8\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a**\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u4e8e4\u67088\u65e5\u5b8c\u6210\u4ed8\u6b3e\uff0c\u622a\u56fe\u77ed\u4fe1\uff0c\u5e76\u6dfb\u52a0\u73ed\u4e3b\u4efb\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4e0e\u914d\u5076\u6216\u5bb6\u4eba\u5546\u8bae\u8fc7\u7a0b\u3002\u7528\u6237\u81ea\u4e3b\u5b8c\u6210\u62a5\u540d\u652f\u4ed8\uff0c\u4f46\u5bb6\u5ead\u5185\u90e8\u662f\u5426\u77e5\u60c5\u3001\u662f\u5426\u652f\u6301\u672a\u77e5\uff0c**\u5b58\u5728\u6f5c\u5728\u5bb6\u5ead\u51b3\u7b56\u98ce\u9669**\u3002\n*   **\u6b65\u9aa41-4\u5224\u5b9a**\uff1a\n    *   \u52a8\u673a\u517c\u5177\u5174\u8da3\u4e0e\u53d8\u73b0\uff0c\u6709\u4e00\u5b9a\u8d44\u6e90\uff0c\u914d\u5408\u5ea6\u9ad8 \u2192 **\u975eA\u7c7b\uff08\u7eaf\u5174\u8da3/\u4f53\u9a8c\u8005\uff09**\u3002\n    *   \u5bf9\u53d8\u73b0\u6709\u671f\u5f85\u4f46\u672a\u8868\u73b0\u51fa\u4e0d\u5207\u5b9e\u9645\u7684\u66b4\u5bcc\u5e7b\u60f3\uff0c\u5b66\u4e60\u884c\u4e3a\u624e\u5b9e \u2192 **\u975eB\u7c7b\uff08\u6295\u673a/\u901f\u6210\u8005\uff09**\u3002\n    *   \u5df2\u4ed8\u8d39\uff0c\u5b66\u4e60\u884c\u4e3a\u79ef\u6781\uff0c\u6709\u660e\u786e\u540e\u7eed\u52a8\u4f5c\uff08\u9009\u4e66\uff09\u2192 **\u975eC\u7c7b\uff08\u72b9\u8c6b/\u89c2\u671b\u8005\uff09**\u3002\n    *   \u7efc\u5408\u5224\u65ad\u4e3a **D\u7c7b\uff08\u9ad8\u610f\u5411\u4ed8\u8d39\u5b66\u5458\uff09**\uff0c\u5df2\u8fdb\u5165\u4ea4\u4ed8\u670d\u52a1\u9636\u6bb5\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n**T5 \u52a1\u5b9e\u63a2\u7d22\u8005**\n*   **\u7279\u5f81\u543b\u5408**\uff1a\u6838\u5fc3\u52a8\u673a\u662f\u201c\u63a2\u7d22\u4e00\u9879\u53ef\u884c\u7684\u526f\u4e1a\u6280\u80fd\u4ee5\u589e\u52a0\u6536\u5165\u201d\uff0c\u517c\u987e\u4e2a\u4eba\u5174\u8da3\u3002\u884c\u52a8\u529b\u5f3a\uff0c\u80fd\u6309\u8981\u6c42\u5b8c\u6210\u5b66\u4e60\u52a8\u4f5c\uff0c\u5bf9\u884c\u4e1a\u6709\u57fa\u7840\u4e86\u89e3\u540e\u4ea7\u751f\u66f4\u5177\u4f53\u7684\u63a2\u7d22\u884c\u4e3a\uff08\u5982\u5206\u6790\u914d\u97f3\uff09\u3002\u51b3\u7b56\u76f8\u5bf9\u7406\u6027\uff0c\u4f1a\u5173\u6ce8\u5177\u4f53\u7ec6\u8282\uff08\u7248\u6743\u4e66\u9009\u62e9\u3001\u7ec3\u4e60\u65b9\u6cd5\uff09\u3002\n*   **\u4e0d\u7b26\u70b9**\uff1a\u672a\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u804c\u4e1a\u8f6c\u578b\u7126\u8651\u6216\u5bf9\u73b0\u6709\u5de5\u4f5c\u7684\u6781\u5ea6\u4e0d\u6ee1\uff0c\u66f4\u591a\u662f\u201c\u9526\u4e0a\u6dfb\u82b1\u201d\u6216\u201c\u672a\u96e8\u7ef8\u7f2a\u201d\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u98ce\u9669\u7b49\u7ea7\uff1a\u4e2d**\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u5b66\u4e60\u6709\u671f\u5f85\uff0c\u82e5\u521d\u671f\u7ec3\u4e60\u53cd\u9988\u4e0d\u4f73\u6216\u63a5\u5355\u53d8\u73b0\u8def\u5f84\u4e0d\u6e05\u6670\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u4f4e\u98ce\u9669**\u3002\u5df2\u4ed8\u6b3e\uff0c\u4e14\u672a\u5728\u6c9f\u901a\u4e2d\u62b1\u6028\u4ef7\u683c\uff0c\u4f46\u63d0\u53ca\u4e0a\u6d77\u6d88\u8d39\u9ad8\uff0c\u9700\u5173\u6ce8\u5176\u957f\u671f\u4ed8\u8d39\u80fd\u529b\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u4e3a\u5bb6\u957f\uff0c\u65f6\u95f4\u53ef\u80fd\u88ab\u5bb6\u5ead\u4e8b\u52a1\u6324\u5360\uff08\u5982\u5b69\u5b50\u751f\u75c5\uff09\uff0c\u867d\u80fd\u534f\u8c03\uff0c\u4f46\u957f\u671f\u575a\u6301\u5b58\u5728\u6311\u6218\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u4e2d\u9ad8\u98ce\u9669**\u3002**\u5173\u952e\u96f7\u533a**\u3002**\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u7f3a\u5931**\uff0c\u82e5\u540e\u7eed\u5b66\u4e60\u6295\u5165\u65f6\u95f4\u589e\u591a\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\uff0c\u53ef\u80fd\u6210\u4e3a\u9000\u8d39\u5bfc\u706b\u7d22\u3002\n    5.  **\u9500\u552e\u627f\u8bfa\u4e0d\u7b26**\uff1a**\u4f4e\u98ce\u9669**\u3002\u9500\u552e\u8bdd\u672f\u4ee5\u201c\u8d44\u6e90\u201d\u3001\u201c\u673a\u4f1a\u201d\u4e3a\u4e3b\uff0c\u672a\u53d1\u73b0\u660e\u786e\u3001\u5938\u5f20\u7684\u6536\u76ca\u627f\u8bfa\u3002\n    6.  **\u8bfe\u7a0b\u8d28\u91cf\u4e0d\u6ee1**\uff1a**\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u7528\u6237\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u548c\u6559\u5e08\u53cd\u9988\u79ef\u6781\u3002\n    7.  **\u7ade\u54c1/\u66ff\u4ee3\u65b9\u6848**\uff1a**\u4f4e\u98ce\u9669**\u3002\u6682\u65e0\u8ff9\u8c61\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5408\u89c4\u60c5\u51b5**\uff1a\n    *   \u9500\u552e\u8fc7\u7a0b\u4f7f\u7528\u4e86\u201c\u65f6\u85aa80-300\u201d\u3001\u201c\u7248\u6743\u4e66\u8d44\u6e90\u201d\u3001\u201c\u5de5\u4f5c\u5ba4\u201d\u3001\u201c\u4eba\u8109\u201d\u7b49\u8bdd\u672f\u8fdb\u884c\u5438\u5f15\u548c\u4fc3\u5355\uff0c\u5c5e\u4e8e\u884c\u4e1a\u5e38\u89c1\u8425\u9500\u65b9\u5f0f\uff0c\u672a\u53d1\u73b0\u660e\u663e\u8fdd\u89c4\u627f\u8bfa\u3002\n    *   \u5b58\u5728\u4e00\u5b9a\u7684\u201c\u7a00\u7f3a\u6027\u201d\uff08\u201c\u53ea\u9080\u8bf7\u4e86\u80fd\u901a\u5173\u7684\u540c\u5b66\u201d\uff09\u548c\u201c\u4ece\u4f17\u538b\u529b\u201d\uff08\u201c\u540e\u53f0\u6709\u8003\u52e4\u8ffd\u8e2a\u201d\uff09\u8425\u9020\u3002\n*   **\u4f26\u7406\u98ce\u9669**\uff1a**\u4f4e**\u3002\u7528\u6237\u51b3\u7b56\u57fa\u4e8e\u81ea\u8eab\u5174\u8da3\u548c\u9700\u6c42\uff0c\u9500\u552e\u5f15\u5bfc\u672a\u8fc7\u5ea6\u5229\u7528\u5176\u7126\u8651\u6216\u5236\u9020\u865a\u5047\u7d27\u8feb\u611f\u3002\u4e3b\u8981\u98ce\u9669\u70b9\u5728\u4e8e**\u672a\u660e\u786e\u63a2\u67e5\u5bb6\u5ead\u652f\u6301\u60c5\u51b5**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6\uff1a\u5339\u914d**\u3002\u7528\u6237\u5df2\u9009\u62e9\u513f\u7ae5\u6545\u4e8b\u96c6\uff0c\u4e0e\u201c\u5bb6\u957f\u201d\u8eab\u4efd\u53ca\u97f3\u8272\u63a2\u7d22\u9636\u6bb5\u76f8\u5339\u914d\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a\n    1.  **\u9996\u5468\u5185\u8fdb\u884c\u5bb6\u5ead\u652f\u6301\u5ea6\u786e\u8ba4**\u3002\u4ee5\u5173\u6000\u6216\u5b66\u4e60\u8ba1\u5212\u6c9f\u901a\u4e3a\u7531\uff0c\u59d4\u5a49\u4e86\u89e3\u5bb6\u4eba\u662f\u5426\u77e5\u6653\u5e76\u652f\u6301\u5176\u5b66\u4e60\uff0c\u63d0\u524d\u5316\u89e3\u6f5c\u5728\u77db\u76fe\u3002\n    2.  **\u5f3a\u5316\u8fc7\u7a0b\u6fc0\u52b1\u4e0e\u5fae\u5c0f\u6b63\u53cd\u9988**\u3002\u8be5\u7c7b\u578b\u7528\u6237\u9700\u8981\u6301\u7eed\u770b\u5230\u81ea\u5df1\u7684\u8fdb\u6b65\u548c\u6280\u80fd\u63d0\u5347\u7684\u4ef7\u503c\u611f\u3002\u53ca\u65f6\u70b9\u8bc4\u4f5c\u4e1a\uff0c\u80af\u5b9a\u5176\u52aa\u529b\u548c\u7ec6\u5fae\u8fdb\u6b65\u3002\n    3.  **\u7ba1\u7406\u53d8\u73b0\u9884\u671f\uff0c\u805a\u7126\u6280\u80fd\u6210\u957f**\u3002\u5728\u540e\u7eed\u6c9f\u901a\u4e2d\uff0c\u5c06\u201c\u53d8\u73b0\u201d\u4e0e\u201c\u6280\u80fd\u8fbe\u6807\u201d\u5f3a\u5173\u8054\uff0c\u907f\u514d\u8ba9\u5176\u4ea7\u751f\u201c\u4ed8\u8d39\u5373\u80fd\u63a5\u5355\u201d\u7684\u8bef\u89e3\u3002\u5f15\u5bfc\u5176\u5173\u6ce8\u6bcf\u9636\u6bb5\u7684\u80fd\u529b\u7a81\u7834\u3002\n    4.  **\u63d0\u4f9b\u6e05\u6670\u7684\u5b66\u4e60\u8def\u5f84\u4e0e\u8d44\u6e90**\u3002\u4e3a\u5176\u89c4\u5212\u6e05\u6670\u7684\u9636\u6bb5\u6027\u7ec3\u4e60\u76ee\u6807\uff08\u5982\u5b8c\u6210\u7248\u6743\u4e66\u7ae0\u8282\u3001\u53c2\u4e0e\u8bd5\u97f3\uff09\uff0c\u5e76\u660e\u786e\u544a\u77e5\u53ef\u83b7\u53d6\u7684\u652f\u6301\u8d44\u6e90\uff08\u5982\u8f85\u5bfc\u3001\u7d20\u6750\uff09\u3002\n\n{\"core_type\": \"T5 \u52a1\u5b9e\u63a2\u7d22\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u9996\u5468\u5185\u786e\u8ba4\u5bb6\u5ead\u652f\u6301\u5ea6\"}";
