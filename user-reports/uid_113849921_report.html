    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID: 113849921\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 113849921 (\u6635\u79f0\uff1a\u667a\u6167\u7c7d\u513f) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e\uff1a\ud83c\udf38\u7c7d\u83f2\u5e08\u59d0\uff08\u80e1\u6885\u73cd\uff09\uff1b\u73ed\u4e3b\u4efb\uff1a\u6854\u5b50JZT\uff08\u7a0b\u5c55\u6b22\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u9ad8\u9636\u8bfe\u7a0b\uff08\u5df2\u652f\u4ed8\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u5145\u88d5\uff08\u672a\u63d0\u53ca\u5206\u671f\u6216\u501f\u8d37\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1\uff08\u767d\u5929\u9700\u5de5\u4f5c/\u5904\u7406\u4e8b\u52a1\uff0c\u53ef\u770b\u56de\u653e\uff0c\u665a\u95f4\u6709\u7a7a\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u7f3a\u5931\uff08\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e2d\u7b49\uff08\u4e92\u52a8\u79ef\u6781\uff0c\u4f46\u4e2a\u4eba\u4fe1\u606f\u5982\u5e74\u9f84\u3001\u804c\u4e1a\u3001\u5bb6\u5ead\u80cc\u666f\u7f3a\u5931\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **[\u2b06\u9ad8]**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765**\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5b66\u4e60\u610f\u613f\uff08\u201c\u8ddf\u4f4f\u597d\u597d\u5b66\u4e60\u201d\uff09\uff0c\u4e3b\u52a8\u5c1d\u8bd5\u8bd5\u97f3\u3001\u63d0\u4ea4\u4f5c\u4e1a\uff0c\u5e76\u5bf9Pia\u620f\u7b49\u4e13\u4e1a\u5b9e\u8df5\u73af\u8282\u8868\u73b0\u51fa\u597d\u5947\u548c\u53c2\u4e0e\u611f\u3002\u867d\u6709\u53d8\u73b0\u8be2\u95ee\uff0c\u4f46\u66f4\u4fa7\u91cd\u4e8e\u4e86\u89e3\u5b66\u4e60\u8def\u5f84\u548c\u63a5\u5355\u903b\u8f91\uff0c\u800c\u975e\u201c\u51e0\u5929\u5185\u63d0\u73b0\u201d\u7684\u6781\u7aef\u53d8\u73b0\u9a71\u52a8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08\uff0c\u6211\u60f3\u5f55\u4e00\u4e2a\u8fd9\u4e2a\u8bd5\u8bd5\uff0c\u8fd9\u4e2a\u9700\u8981\u4ec0\u4e48\u611f\u89c9\u5462\u201d > \u201c\u7b2c\u4e00\u6b21\u73a9\uff0c\u624d\u77e5\u9053pia\u620f\u4ec0\u4e48\u610f\u601d[\u5077\u7b11]\u201d > \u201c\u8001\u5e08\uff0c\u5b66\u4e60\u7cfb\u7edf\u8bfe\u662f\u5f55\u64ad\u8bfe\u8fd8\u662f\u76f4\u64ad\uff0c\u4e00\u822c\u5b66\u591a\u4e45\u53ef\u4ee5\u63a5\u5355\u88ab\u9009\u4e2d\u554a\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **[\u27a1\u4e2d]**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u591f\u652f\u4ed8\u9ad8\u9636\u8bfe\u7a0b\u8d39\u7528\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\u6216\u501f\u8d37\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u5b8c\u6210\u4f5c\u4e1a\u3001\u770b\u56de\u653e\u3001\u53c2\u4e0e\u665a\u95f4\u76f4\u64ad\uff0c\u4f46\u767d\u5929\u9700\u8981\u8bf7\u5047\u770b\u56de\u653e\uff0c\u8868\u660e\u65f6\u95f4\u975e\u5b8c\u5168\u81ea\u7531\uff0c\u9700\u5728\u5de5\u4f5c\u548c\u5b66\u4e60\u95f4\u5e73\u8861\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff0c\u65e0\u6cd5\u5224\u65ad\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **[\u2b06\u9ad8]**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u7528\u6237\u4e92\u52a8\u793c\u8c8c\u3001\u79ef\u6781\uff0c\u5bf9\u8001\u5e08\u7684\u9f13\u52b1\u548c\u6307\u5bfc\u7ed9\u4e88\u6b63\u5411\u53cd\u9988\uff08\u201c\u611f\u8c22\u8001\u5e08\u7684\u9f13\u52b1\u201d\uff09\uff0c\u672a\u8868\u73b0\u51fa\u4efb\u4f55\u81ea\u5351\u3001\u7126\u8651\u6216\u4f9d\u8d56\u60c5\u7eea\u3002\u80fd\u4e3b\u52a8\u63d0\u95ee\u3001\u6309\u65f6\u5b8c\u6210\u4efb\u52a1\uff0c\u5e76\u81ea\u884c\u5b89\u6392\u65f6\u95f4\u770b\u56de\u653e\uff0c\u663e\u793a\u51fa\u826f\u597d\u7684\u81ea\u6211\u7ba1\u7406\u80fd\u529b\u548c\u7a33\u5b9a\u7684\u5b66\u4e60\u5fc3\u6001\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u597d\u7684\uff0c\u8c22\u8c22\u8001\u5e08[\u62b1\u62f3]\u201d > \u201c\u6211\u4e0b\u5348\u8bd5\u8bd5\uff0c\u611f\u8c22\u8001\u5e08\u7684\u9f13\u52b1\uff01\u201d > \u201c\u8001\u5e08\uff0c\u6211\u4eca\u5929\u4e2d\u5348\u8bf7\u5047\uff0c\u770b\u56de\u653e[\u6109\u5feb]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u81ea\u8eab\u58f0\u97f3\u5929\u8d4b\u548c\u672a\u6765\u5728\u4e13\u4e1a\u9886\u57df\u83b7\u5f97\u8ba4\u53ef\u7684\u6e34\u671b\u3002\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u5176\u201c\u58f0\u97f3\u6709\u5e95\u5b50\u201d\u3001\u201c\u5fa1\u59d0\u97f3\u201d\u3001\u201c\u9002\u5408\u56fd\u5b66\u5386\u53f2\u7c7b\u201d\uff0c\u7528\u6237\u5bf9\u6b64\u8868\u73b0\u51fa\u79ef\u6781\u7684\u63a5\u53d7\u548c\u611f\u8c22\uff0c\u663e\u793a\u51fa\u5bf9\u4e13\u4e1a\u8eab\u4efd\u8ba4\u540c\u548c\u5916\u754c\u5c0a\u91cd\u7684\u5f3a\u70c8\u9700\u6c42\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u8fdb\u9636\u8def\u5f84\u7684\u6e05\u6670\u6307\u5f15**\u3002\u63d0\u4f9b\u660e\u786e\u7684\u6280\u80fd\u63d0\u5347\u8def\u5f84\u3001\u7ed9\u4e88\u5176\u58f0\u97f3\u7279\u8d28\uff08\u5fa1\u59d0\u97f3\uff09\u7684\u4e13\u4e1a\u5b9a\u4f4d\uff0c\u5e76\u521b\u9020\u673a\u4f1a\u8ba9\u5176\u624d\u534e\u5728\u793e\u7fa4\u6216\u5b9e\u8df5\u4e2d\u83b7\u5f97\u5c55\u793a\u4e0e\u8ba4\u53ef\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u9ad8\u52a8\u673a\u3001\u9ad8\u5f39\u6027\u3001\u4e2d\u7b49\u8d44\u6e90\uff0c\u7a33\u5b9a\u6267\u884c\uff0c\u8ffd\u6c42\u80fd\u529b\u6210\u957f\u4e0e\u5916\u754c\u8ba4\u53ef) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u8a00\u8bba\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u5f53\u524d\u65e0\u8ff9\u8c61\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u7528\u6237\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5c1a\u53ef\uff0c\u80fd\u901a\u8fc7\u770b\u56de\u653e\u8865\u8bfe\uff0c\u81ea\u5f8b\u6027\u8f83\u5f3a\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e92\u52a8\u79ef\u6781\u6b63\u5411\uff0c\u65e0\u81ea\u5351\u6216\u4f9d\u8d56\u4fe1\u53f7\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | **\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u7528\u6237\u5173\u6ce8\u201c\u5b66\u591a\u4e45\u53ef\u4ee5\u63a5\u5355\u88ab\u9009\u4e2d\u201d\uff0c\u82e5\u5728\u7cfb\u7edf\u5b66\u4e60\u540e\u957f\u65f6\u95f4\u65e0\u6cd5\u83b7\u5f97\u7b26\u5408\u5176\u9884\u671f\u7684\u5b9e\u8df5\u673a\u4f1a\u6216\u6b63\u5411\u53cd\u9988\uff08\u5982\u8bd5\u97f3\u5931\u8d25\u3001\u63a5\u5355\u56f0\u96be\uff09\uff0c\u53ef\u80fd\u4ea7\u751f\u4ef7\u503c\u6000\u7591\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe\u540e\u7b2c4-8\u5468\uff0c\u5f53\u57fa\u7840\u6280\u80fd\u5b66\u4e60\u5b8c\u6bd5\uff0c\u8fdb\u5165\u5b9e\u6218\u63a5\u5355\u9636\u6bb5\uff0c\u82e5\u8fde\u7eed\u591a\u6b21\u8bd5\u97f3\u5931\u8d25\u6216\u63a5\u5355\u6536\u5165\u8fdc\u4f4e\u4e8e\u9884\u671f\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u667a\u6167\u7c7d\u513f\u540c\u5b66\u4f60\u597d\uff01\u7c7d\u83f2\u5e08\u59d0\u7279\u610f\u8ddf\u6211\u4ea4\u63a5\u4e86\uff0c\u8bf4\u4f60\u7684\u58f0\u97f3\u5e95\u5b50\u7279\u522b\u597d\uff0c\u662f\u96be\u5f97\u7684\u5fa1\u59d0\u97f3\uff0c\u5f88\u6709\u6f5c\u529b\u3002\u54b1\u4eec\u9ad8\u9636\u73ed\u5c31\u662f\u4e3a\u4f60\u8fd9\u6837\u6709\u57fa\u7840\u3001\u80af\u94bb\u7814\u7684\u540c\u5b66\u51c6\u5907\u7684\uff0c\u63a5\u4e0b\u6765\u6211\u4f1a\u91cd\u70b9\u5e26\u4f60\u6253\u78e8\u89d2\u8272\u5851\u9020\u548c\u5b9e\u6218\u63a5\u5355\u6280\u5de7\uff0c\u671f\u5f85\u4f60\u6210\u4e3a\u73ed\u91cc\u7684\u6807\u6746\uff01\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176\u9ad8\u52a8\u673a\u548c\u9ad8\u5f39\u6027\uff0c\u63d0\u4f9b\u7cfb\u7edf\u3001\u6709\u6df1\u5ea6\u7684\u6280\u80fd\u8bad\u7ec3\u548c\u5b9e\u6218\u673a\u4f1a\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176**T2\u8001\u9ec4\u725b**\u7279\u8d28\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145**\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011**\uff08B\u6a21\u5757\uff09\uff0c\u5e76\u89c2\u5bdf\u5176\u662f\u5426\u51fa\u73b0\u4e3b\u52a8\u5e2e\u52a9\u540c\u5b66\u3001\u7edf\u7b79\u4e8b\u52a1\u7684\u884c\u4e3a\uff0c\u4e3a\u6f5c\u5728\u7684**\u6df7\u5408\u4f533\u53f7\uff08\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b\uff09**\u8fdb\u5316\u505a\u51c6\u5907\uff0c\u9002\u65f6\u6388\u4e88**\u3010\u9ec4\u888d\u52a0\u8eab\u63d0\u5e72\u3011**\uff08D\u6a21\u5757\uff09\u6743\u9650\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u4f4e\u5e7c\u6216\u8fc7\u5ea6\u60c5\u611f\u5316\u7684\u65b9\u5f0f\u6c9f\u901a\uff1b\u5e03\u7f6e\u8fc7\u4e8e\u7b80\u5355\u3001\u65e0\u6311\u6218\u6027\u7684\u4efb\u52a1\uff1b\u5ffd\u89c6\u5176\u5bf9\u4e8e\u4e13\u4e1a\u6210\u957f\u548c\u8def\u5f84\u6e05\u6670\u5ea6\u7684\u9700\u6c42\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5f53\u5176\u6280\u80fd\u8fbe\u5230\u4e00\u5b9a\u6c34\u5e73\u540e\uff0c\u53ef\u4ee5\u63a8\u8350\u66f4\u9ad8\u7ea7\u7684\u79c1\u6559\u8bfe\u3001\u8bbe\u5907\u6216\u5782\u76f4\u9886\u57df\u6df1\u9020\u8bfe\u7a0b\uff08\u5982\u6709\u58f0\u5267\u540e\u671f\u5236\u4f5c\uff09\uff0c\u4f46\u63a8\u4ecb\u903b\u8f91\u5fc5\u987b\u57fa\u4e8e\u5176\u80fd\u529b\u6210\u957f\u548c\u804c\u4e1a\u89c4\u5212\uff0c\u800c\u975e\u5236\u9020\u7126\u8651\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u8001\u5e08\uff0c\u6211\u60f3\u5f55\u4e00\u4e2a\u8fd9\u4e2a\u8bd5\u8bd5\uff0c\u8fd9\u4e2a\u9700\u8981\u4ec0\u4e48\u611f\u89c9\u5462\u201d **(\u4e3b\u52a8\u63a2\u7d22\uff0c\u9ad8\u52a8\u673a)**\n2. > \u201c\u7b2c\u4e00\u6b21\u73a9\uff0c\u624d\u77e5\u9053pia\u620f\u4ec0\u4e48\u610f\u601d[\u5077\u7b11]\u201d **(\u5bf9\u4e13\u4e1a\u5b9e\u8df5\u597d\u5947\uff0c\u4e50\u4e8e\u5c1d\u8bd5)**\n3. > \u201c\u8001\u5e08\uff0c\u5b66\u4e60\u7cfb\u7edf\u8bfe\u662f\u5f55\u64ad\u8bfe\u8fd8\u662f\u76f4\u64ad\uff0c\u4e00\u822c\u5b66\u591a\u4e45\u53ef\u4ee5\u63a5\u5355\u88ab\u9009\u4e2d\u554a\u201d **(\u5173\u6ce8\u8def\u5f84\u4e0e\u7ed3\u679c\uff0c\u4f46\u975e\u6025\u529f\u8fd1\u5229\uff0c\u5c5e\u4e8e\u5408\u7406\u89c4\u5212\u578b\u63d0\u95ee)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u9886\u57df\u7684\u5c0a\u91cd\u4e0e\u8ba4\u53ef\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6e05\u6670\u3001\u6709\u6311\u6218\u6027\u7684\u6210\u957f\u8def\u5f84\uff0c\u5e76\u53ca\u65f6\u7ed9\u4e88\u4e13\u4e1a\u5c42\u9762\u7684\u80af\u5b9a\u4e0e\u5b9e\u6218\u673a\u4f1a\uff0c\u9632\u8303\u201c\u5b66\u800c\u65e0\u7528\u201d\u7684\u6536\u76ca\u843d\u5dee\u611f\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
