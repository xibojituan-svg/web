        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677152032 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6668\u516e\u5e08\u59d0(\u80e1\u82e5\u4f0a)\u3001\u53ef\u4e3d\u513f(\u5b54\u4ee4\u5a77) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u64ad\u6500\u767b\u8ba1\u5212\uff087380\u5143\u8fdb\u9636\u73ed\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u5145\u88d5 (\u76f4\u63a5\u652f\u4ed82380\u5143\uff0c\u672a\u63d0\u53ca\u5206\u671f\u6216\u501f\u6b3e) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1 (\u767d\u5929\u53ef\u5b66\u4e60\uff0c\u4f466-7\u6708\u51fa\u56fd\u6709\u65f6\u5dee\uff0c\u9700\u534f\u8c03) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u5355\u8eab\u72ec\u7acb (\u804a\u5929\u4e2d\u672a\u63d0\u53ca\u5bb6\u4eba\uff0c\u51b3\u7b56\u72ec\u7acb) |\n| **\u4fe1\u606f\u539a\u5ea6** | \u9971\u6ee1 (\u5b66\u4e60\u4e92\u52a8\u79ef\u6781\uff0c\u6709\u660e\u786e\u65f6\u95f4\u89c4\u5212\u4fe1\u606f) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e\uff0c\u4f46\u540c\u65f6\u5bf9\u6280\u80fd\u5b66\u4e60\u6709\u79ef\u6781\u53cd\u9988\u548c\u6295\u5165\uff0c\u5c5e\u4e8e\u201c\u8fb9\u5b66\u8fb9\u8d5a\u201d\u7684\u6df7\u5408\u578b\u52a8\u673a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u60f3\u505a\u8fd9\u4e2a\u884c\u4e1a\u7684\u3002\u201d > \u201c\u517c\u804c\u8d77\u6b65\uff0c\u65f6\u95f4\u7075\u6d3b\u8fd8\u80fd\u8fb9\u5b66\u8fb9\u8d5a\uff5e\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u9ad8] \u2014 \u80fd\u76f4\u63a5\u652f\u4ed8\u8bfe\u7a0b\u8d39\u7528\uff0c\u672a\u8868\u73b0\u51fa\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 \u80fd\u8ddf\u4e0a\u8bad\u7ec3\u8425\u8282\u594f\uff0c\u4f466-7\u6708\u51fa\u56fd\u4f1a\u5e26\u6765\u65f6\u95f4\u51b2\u7a81\u548c\u65f6\u5dee\u95ee\u9898\uff0c\u662f\u4e3b\u8981\u77ed\u677f\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u9ad8] \u2014 \u51b3\u7b56\u72ec\u7acb\uff0c\u672a\u63d0\u53ca\u5bb6\u5ead\u963b\u529b\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9762\u5bf9\u4f5c\u4e1a\u70b9\u8bc4\uff0c\u80fd\u4e3b\u52a8\u8c03\u6574\u3001\u91cd\u5f55\uff0c\u5e76\u611f\u8c22\u6307\u5bfc\uff0c\u8868\u73b0\u51fa\u79ef\u6781\u7684\u5b66\u4e60\u5fc3\u6001\u548c\u97e7\u6027\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u597d\u7684\uff0c\u8c22\u8c22\u4f60\uff0c\u6211\u8c03\u6574\u4e0b\u8bd5\u8bd5\u770b\u201d > \u201c\u4eca\u5929\u4e00\u76f4\u5728\u5fd9\uff0c\u6211\u5f85\u4f1a\u513f\u518d\u8bd5\u4e00\u4e0b\uff0c\u8c22\u8c22\u4f60\u7684\u6307\u6559\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bfb\u6c42\u5728\u4e13\u4e1a\u9886\u57df\uff08\u6709\u58f0\u6f14\u64ad\uff09\u83b7\u5f97\u8ba4\u53ef\u548c\u8eab\u4efd\u8ba4\u540c\uff0c\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u638c\u63e1\u4e00\u95e8\u6280\u80fd\uff0c\u83b7\u5f97\u201c\u4e13\u4e1a\u4eba\u58eb\u201d\u7684\u5f52\u5c5e\u611f\u548c\u6210\u5c31\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u5c42\u9762\u7684\u80af\u5b9a\u4e0e\u8d4b\u80fd**\u3002\u8ba9\u4ed6\u611f\u53d7\u5230\u81ea\u5df1\u7684\u58f0\u97f3\u7279\u8d28\uff08\u6e29\u5fa1\u97f3\uff09\u88ab\u6b23\u8d4f\uff0c\u5b66\u4e60\u8fdb\u6b65\u88ab\u770b\u89c1\uff0c\u5e76\u4e3a\u4ed6\u89c4\u5212\u6e05\u6670\u7684\u804c\u4e1a\u6210\u957f\u8def\u5f84\uff0c\u6ee1\u8db3\u5176\u201c\u88ab\u770b\u89c1\u3001\u88ab\u8ba4\u53ef\u201d\u7684\u5c0a\u91cd\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 **B\u7c7b** (\u52a8\u673a\u4e2d\u7b49\uff0c\u8d44\u6e90\u4e2d\u7b49\uff0c\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u6709\u660e\u786e\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u5173\u6ce8\u6280\u80fd\u63d0\u5347\uff0c\u8ba4\u771f\u5b8c\u6210\u4f5c\u4e1a\uff0c\u79ef\u6781\u5bfb\u6c42\u53cd\u9988\uff0c\u76ee\u6807\u5bfc\u5411\u4e3a\u201c\u8fb9\u5b66\u8fb9\u8d5a\u201d\uff0c\u4f46\u4e0d\u8fc7\u5ea6\u7126\u8651\u77ed\u671f\u53d8\u73b0) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u51b3\u7b56\u72ec\u7acb\uff0c\u65e0\u5bb6\u5ead\u963b\u529b\u4fe1\u53f7\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a6-7\u6708\u51fa\u56fd\u671f\u95f4\uff0c\u56e0\u65f6\u5dee\u548c\u884c\u7a0b\u53ef\u80fd\u5bfc\u81f4\u5b66\u4e60\u4efb\u52a1\u79ef\u538b\uff0c\u4ea7\u751f\u7126\u8651\u6216\u6389\u961f\u611f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u63a5\u53d7\u6307\u5bfc\u5e76\u4e3b\u52a8\u8c03\u6574\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u56f0\u96be\u7834\u9632\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u5bf9\u201c\u8fb9\u5b66\u8fb9\u8d5a\u201d\u6709\u671f\u5f85\uff0c\u82e5\u5728\u51fa\u56fd\u524d\u540e\u672a\u80fd\u83b7\u5f97\u9884\u671f\u7684\u63a5\u5355\u673a\u4f1a\u6216\u6b63\u5411\u53cd\u9988\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u51fa\u56fd\u671f\u95f4\u53ca\u56de\u56fd\u540e\u8854\u63a5\u671f (6\u6708-7\u6708\u5e95)**\u3002\u6b64\u9636\u6bb5\u82e5\u56e0\u65f6\u5dee\u3001\u5fd9\u788c\u5bfc\u81f4\u5b66\u4e60\u4e2d\u65ad\uff0c\u4e14\u73ed\u4e3b\u4efb\u8ddf\u8fdb\u4e0d\u8db3\uff0c\u6613\u4ea7\u751f\u201c\u94b1\u767d\u82b1\u4e86\u201d\u7684\u5931\u843d\u611f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6b22\u8fce\u52a0\u5165\uff01\u770b\u5230\u4f60\u5728\u8bad\u7ec3\u8425\u91cc\u5bf9\u2018\u60c5\u5883\u611f\u2019\u548c\u2018\u5171\u60c5\u2019\u7684\u9886\u609f\u7279\u522b\u5feb\uff0c\u8fd9\u79cd\u5bf9\u58f0\u97f3\u7ec6\u8282\u7684\u654f\u611f\u5ea6\u662f\u6210\u4e3a\u597d\u4e3b\u64ad\u7684\u5173\u952e\u3002\u4f60\u7684\u2018\u6e29\u5fa1\u97f3\u2019\u5f88\u6709\u5e02\u573a\u6f5c\u529b\u3002\u6211\u77e5\u9053\u4f606-7\u6708\u6709\u51fa\u56fd\u5b89\u6392\uff0c\u522b\u62c5\u5fc3\uff0c\u6211\u4eec\u5df2\u7ecf\u4e3a\u4f60\u89c4\u5212\u597d\u4e86\u5f39\u6027\u5b66\u4e60\u8def\u5f84\uff0c\u6838\u5fc3\u662f\u2018\u6280\u80fd\u7cbe\u8fdb\u2019\uff0c\u63a5\u5355\u5b9e\u6218\u7b49\u4f60\u56de\u56fd\u540e\u65e0\u7f1d\u8854\u63a5\u3002\u8fd9\u6bb5\u65f6\u95f4\uff0c\u6211\u4eec\u91cd\u70b9\u5e2e\u4f60\u6253\u78e8\u5185\u529f\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u3002\u5339\u914d\u5176T2\u5b9e\u5e72\u7279\u8d28\uff0c\u63d0\u4f9b\u6e05\u6670\u7684\u6280\u672f\u8fdb\u9636\u8def\u5f84\u548c\u5b9e\u64cd\u4efb\u52a1\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u5f39\u6027\u5b66\u4e60\u652f\u6301\u5305**\u3011\u3002\u9488\u5bf9\u5176\u51fa\u56fd\u671f\u95f4\u7684\u65f6\u95f4\u77ed\u677f\uff0c\u63d0\u4f9b\u5f55\u64ad\u8bfe\u91cd\u70b9\u6807\u6ce8\u3001\u4f5c\u4e1a\u63d0\u4ea4\u65f6\u95f4\u5f39\u6027\u5ef6\u957f\u3001\u5f52\u56fd\u540e\u5b66\u4e60\u8ba1\u5212\u91cd\u542f\u8f85\u5bfc\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u5ffd\u89c6\u5176\u51fa\u56fd\u671f\u95f4\u7684\u5b66\u4e60\u72b6\u6001\uff0c\u653e\u4efb\u4e0d\u7ba1\u30022. \u5728\u5176\u51fa\u56fd\u524d\u8fc7\u5ea6\u627f\u8bfa\u77ed\u671f\u9ad8\u989d\u6536\u76ca\uff0c\u9020\u6210\u56de\u56fd\u540e\u7684\u5fc3\u7406\u843d\u5dee\u30023. \u7528\u5927\u91cf\u60c5\u7eea\u5b89\u629a\u4ee3\u66ff\u5b9e\u8d28\u6027\u7684\u4e13\u4e1a\u6307\u5bfc\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002T2\u7528\u6237\u6709\u957f\u671f\u6df1\u8015\u6f5c\u529b\uff0c\u5728\u6280\u80fd\u8fdb\u9636\u3001\u9ad8\u9636\u8bbe\u5907\u3001\u5782\u76f4\u9886\u57df\u6df1\u9020\uff08\u5982\u5546\u914d\u3001\u5e7f\u64ad\u5267\uff09\u7b49\u65b9\u9762\u6709\u5347\u5355\u7a7a\u95f4\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u60f3\u505a\u8fd9\u4e2a\u884c\u4e1a\u7684\u3002\u201d **(\u52a8\u673a\u4e0e\u51b3\u5fc3)**\n2. > \u201c\u4e0d\u8fc7\u6211\u6709\u4e00\u4ef6\u4e8b\u60c5\u60f3\u95ee\u4e00\u4e0b\uff0c\u56e0\u4e3a\u6211\u5df2\u7ecf\u534a\u5e74\u524d\u5c31\u5b9a\u4e866\u6708\u4efd\u548c7\u6708\u4efd\u662f\u5728\u56fd\u5916\u7684\uff0c\u8fd9\u6837\u4f1a\u4e0d\u4f1a\u5f71\u54cd\u8fd9\u8fb9\u7684\u5f55\u97f3\u201d **(\u8d44\u6e90\u77ed\u677f\u4e0e\u89c4\u5212\u6027)**\n3. > \u201c\u597d\u7684\uff0c\u8c22\u8c22\u4f60\uff0c\u6211\u8c03\u6574\u4e0b\u8bd5\u8bd5\u770b\u201d **(\u9ad8\u5fc3\u7406\u5f39\u6027\u4e0e\u6267\u884c\u529b)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2\u4f4e\u8c03\u5b9e\u5e72\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u9886\u57df\u7684\u5c0a\u91cd\u4e0e\u5f52\u5c5e\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u4e3a\u5176\u51fa\u56fd\u671f\u95f4\u5b9a\u5236\u5f39\u6027\u5b66\u4e60\u8ba1\u5212\uff0c\u5e76\u4fdd\u6301\u4e13\u4e1a\u5c42\u9762\u7684\u6301\u7eed\u5173\u6ce8\u4e0e\u8d4b\u80fd\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"maslow_need\": \"\u7b2c\u56db\u5c42\u5c0a\u91cd\u9700\u6c42\", \"risk_level\": \"\u4e2d\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5f39\u6027\u5b66\u4e60\u652f\u6301\u5305\"}\n```";
