    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a676706838 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-31 \u81f3 2026-02-27 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9053\u5ba3(\u9648\u6653\u5a07) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66/\u914d\u97f3\u7c7b\u8bfe\u7a0b\uff08\u4ece\u5bf9\u8bdd\u63a8\u65ad\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3** |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u4f4f\u9662\u671f\u95f4\u4ecd\u575a\u6301\u5b66\u4e60\uff0c\u4f46\u672f\u540e\u6062\u590d\u671f\u5f71\u54cd\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u63d0\u53ca\u4e08\u592b\u5728\u5e7f\u4e1c\uff0c\u5a46\u5a46\u966a\u62a4\uff0c\u4f46\u672a\u63d0\u53ca\u5bf9\u5b66\u4e60\u7684\u6001\u5ea6\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u5b66\u4e60\u72b6\u6001\u3001\u4e2a\u4eba\u751f\u6d3b\u3001\u60c5\u7eea\u5747\u6709\u5145\u5206\u66b4\u9732\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u2b06\u9ad8 (7-8\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u6210\u957f\u800c\u6765\uff0c\u5173\u6ce8\u6280\u80fd\u7cbe\u8fdb\uff0c\u4eab\u53d7\u5b66\u4e60\u8fc7\u7a0b\uff0c\u6709\u660e\u786e\u7684\u81ea\u6211\u5b9e\u73b0\u8ffd\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u4e3b\u8981\u6211\u89c9\u5f97\u6211\u7684\u8fdb\u633a\u6162\u7684...\u5c31\u6000\u7591\u6211\u9002\u4e0d\u9002\u5408\u505a\u8fd9\u884c\u201d\uff08\u5bf9\u8fdb\u6b65\u901f\u5ea6\u6709\u7126\u8651\uff0c\u8bf4\u660e\u5728\u610f\u5b66\u4e60\u6548\u679c\uff09\n  > \u201c\u5f00\u5e74\u5c0f\u76ee\u6807\uff0c\u4e2d\u4e66[\u52a0\u6cb9]\u201d\uff08\u6709\u660e\u786e\u7684\u804c\u4e1a\u76ee\u6807\uff09\n  > \u4e3b\u52a8\u627f\u62c5\u7fa4\u5185\u50ac\u8bfe\u3001@\u540c\u5b66\u7b49\u7ec4\u7ec7\u5de5\u4f5c\uff0c\u8868\u73b0\u51fa\u5efa\u8bbe\u8005\u5fc3\u6001\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u6216\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u6709\u56fa\u5b9a\u5b66\u4e60\u65f6\u95f4\uff08\u80fd\u53c2\u52a0\u76f4\u64ad\u8bfe\u3001\u505a\u4f5c\u4e1a\uff09\uff0c\u4f46\u8fd1\u671f\u56e0\u624b\u672f\u4f4f\u9662\uff0c\u65f6\u95f4\u53d7\u5230\u51b2\u51fb\u3002\u672f\u540e\u6062\u590d\u671f\u4ecd\u575a\u6301\u5b66\u4e60\uff0c\u8868\u660e\u6709\u8f83\u5f3a\u7684\u5b66\u4e60\u610f\u613f\u548c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4e2d** \u2014 \u4e08\u592b\u5728\u5916\u5730\uff0c\u5a46\u5a46\u4e34\u65f6\u966a\u62a4\uff0c\u5bb6\u5ead\u652f\u6301\u7f51\u7edc\u5b58\u5728\u4f46\u975e\u6838\u5fc3\u652f\u6301\u8005\u3002\u5b66\u4e60\u51b3\u7b56\u76f8\u5bf9\u72ec\u7acb\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b07\u4f4e (3-4\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56**\u3002\u9047\u5230\u5b66\u4e60\u74f6\u9888\uff08\u60c5\u7eea\u8868\u8fbe\u4e0d\u5230\u4f4d\uff09\u65f6\uff0c\u4ea7\u751f\u5f3a\u70c8\u7684\u81ea\u6211\u6000\u7591\uff08\u201c\u6000\u7591\u6211\u9002\u4e0d\u9002\u5408\u505a\u8fd9\u884c\u201d\u3001\u201c\u6c38\u8fdc\u5728\u81ea\u6211\u6000\u7591\u4e2d\u201d\uff09\uff0c\u5e76\u4e3b\u52a8\u5411\u73ed\u4e3b\u4efb\u5bfb\u6c42\u60c5\u7eea\u5b89\u6170\uff08\u201c\u6ca1\u4e8b\uff0c\u6211\u5c31\u8ddf\u4f60\u804a\u4e00\u4e0b\u6211\u7684\u72b6\u6001\u201d\uff09\u3002\u672f\u540e\u5267\u75db\u65f6\u60c5\u7eea\u5d29\u6e83\uff08\u201c\u60f3\u53bb\u6b7b\uff0c\u4e0d\u60f3\u6d3b\u4e86\u201d\uff09\uff0c\u6781\u5ea6\u4f9d\u8d56\u5916\u90e8\u5b89\u629a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6c38\u8fdc\u5728\u81ea\u6211\u6000\u7591\u4e2d\u201d\n  > \u201c\u60f3\u53bb\u6b7b\uff0c\u4e0d\u60f3\u6d3b\u4e86\u201d\uff08\u672f\u540e\u75bc\u75db\u65f6\u7684\u6781\u7aef\u60c5\u7eea\u8868\u8fbe\uff09\n  > \u201c\u75bc\u7684\u8ba9\u4eba\u53d1\u75af\u201d\n  > \u201c\u6211\u5c31\u8ddf\u4f60\u804a\u4e00\u4e0b\u6211\u7684\u72b6\u6001...\u6ca1\u5176\u4ed6\u7684\u610f\u601d\u201d\uff08\u4e3b\u52a8\u5bfb\u6c42\u60c5\u7eea\u652f\u6301\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u5f52\u5c5e\u9700\u6c42** \u4e0e **\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42** \u4ea4\u7ec7\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6280\u672f\u74f6\u9888\u5e26\u6765\u7684\u5f3a\u70c8\u81ea\u6211\u5426\u5b9a\u4e0e\u4ef7\u503c\u611f\u7f3a\u5931**\u3002\u5979\u5e76\u975e\u5355\u7eaf\u8ffd\u6c42\u53d8\u73b0\uff0c\u800c\u662f\u6e34\u671b\u901a\u8fc7\u5b66\u4e60\u83b7\u5f97\u8ba4\u53ef\u3001\u878d\u5165\u96c6\u4f53\uff08\u73ed\u7ea7\uff09\uff0c\u5e76\u8bc1\u660e\u81ea\u5df1\u7684\u4ef7\u503c\u3002\u5f53\u5b66\u4e60\u8fdb\u5c55\u4e0d\u987a\u65f6\uff0c\u4f1a\u9677\u5165\u201c\u6211\u4e0d\u884c\u201d\u7684\u81ea\u5351\u6f29\u6da1\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u65e0\u6761\u4ef6\u7684\u80af\u5b9a\u4e0e\u201c\u88ab\u9700\u8981\u201d\u7684\u5f52\u5c5e\u611f**\u3002\u5979\u9700\u8981\u88ab\u770b\u89c1\u3001\u88ab\u9f13\u52b1\u3001\u88ab\u8d4b\u4e88\u8d23\u4efb\uff08\u5982\u7fa4\u5185\u50ac\u8bfe\uff09\uff0c\u4ee5\u6b64\u5bf9\u6297\u81ea\u6211\u6000\u7591\uff0c\u5efa\u7acb\u5b66\u4e60\u81ea\u4fe1\u548c\u793e\u7fa4\u8eab\u4efd\u8ba4\u540c\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5 C2\u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u4e25\u91cd\u5185\u8017) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\u3002\u4f46\u9700\u8b66\u60d5\u5176\u60c5\u7eea\u5d29\u6e83\u65f6\u53ef\u80fd\u4ea7\u751f\u7684\u9000\u8d39\u51b2\u52a8\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4f4e** | \u5bb6\u5ead\u652f\u6301\u5ea6\u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u4e08\u592b\u5728\u5916\u5730\uff0c\u5e72\u9884\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u82e5\u540e\u7eed\u56e0\u751f\u6d3b\u53d8\u6545\uff08\u5982\u5065\u5eb7\u95ee\u9898\u590d\u53d1\u3001\u5bb6\u5ead\u4e8b\u52a1\uff09\u5bfc\u81f4\u5b66\u4e60\u4e2d\u65ad\uff0c\u7d2f\u79ef\u7684\u632b\u8d25\u611f\u53ef\u80fd\u5f15\u53d1\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u4efb\u4f55\u4e00\u6b21\u4f5c\u4e1a\u88ab\u4e25\u5389\u6279\u8bc4\u3001\u8bd5\u97f3\u5931\u8d25\u3001\u6216\u611f\u5230\u88ab\u73ed\u7ea7/\u8001\u5e08\u5ffd\u89c6\uff0c\u90fd\u53ef\u80fd\u89e6\u53d1\u201c\u6211\u4e0d\u9002\u5408/\u6211\u592a\u7b28\u4e86\u201d\u7684\u5d29\u6e83\uff0c\u8fdb\u800c\u4ea7\u751f\u9000\u8d39\u5ff5\u5934\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u867d\u7136\u5f53\u524d\u52a8\u673a\u7eaf\u5ea6\u9ad8\uff0c\u4f46\u82e5\u957f\u671f\u65e0\u6cd5\u83b7\u5f97\u6b63\u5411\u53cd\u9988\uff08\u5982\u63a5\u5355\u3001\u88ab\u8ba4\u53ef\uff09\uff0c\u81ea\u6211\u6000\u7591\u4f1a\u52a0\u5267\uff0c\u53ef\u80fd\u8f6c\u5316\u4e3a\u5bf9\u8bfe\u7a0b\u4ef7\u503c\u7684\u8d28\u7591\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c3-4\u5468\uff08\u6280\u80fd\u74f6\u9888\u671f\uff09** \u4ee5\u53ca **\u4efb\u4f55\u4e00\u6b21\u91cd\u8981\u4f5c\u4e1a/\u8003\u6838\u53cd\u9988\u540e**\u3002\u672f\u540e\u75bc\u75db\u671f\u7684\u60c5\u7eea\u5d29\u6e83\u5df2\u662f\u4e00\u6b21\u9884\u6f14\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4eb2\u7231\u7684\uff0c\u6211\u770b\u5230\u4f60\u7279\u522b\u8ba4\u771f\uff0c\u4f5c\u4e1a\u4e5f\u4ea4\u5f97\u5f88\u53ca\u65f6\uff0c\u8fd8\u80fd\u4e3b\u52a8\u5e2e\u5927\u5bb6\u50ac\u8bfe\uff0c\u771f\u662f\u6211\u4eec\u73ed\u7684\u5b9d\u85cf\u540c\u5b66\uff01\u5b66\u4e60\u8def\u4e0a\u6709\u5361\u58f3\u592a\u6b63\u5e38\u4e86\uff0c\u522b\u6015\uff0c\u54b1\u4eec\u4e00\u8d77\u6162\u6162\u78e8\u3002\u4f60\u6bcf\u6b21\u6709\u60c5\u7eea\u6216\u8005\u89c9\u5f97\u5b66\u4e0d\u52a8\u4e86\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4e0d\u4ec5\u662f\u4f60\u7684\u73ed\u73ed\uff0c\u4e5f\u662f\u4f60\u7684\u6811\u6d1e\u548c\u6218\u53cb\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** + **\u3010\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\u3011**\uff08\u8d4b\u4e88\u5176\u73ed\u7ea7\u7ba1\u7406\u89d2\u8272\uff09\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u8865\u5145\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\uff08\u6ee1\u914dC\u6a21\u5757\uff09\u3002\u9488\u5bf9\u5176\u6280\u672f\u74f6\u9888\uff08\u60c5\u7eea\u8868\u8fbe\uff09\uff0c\u989d\u5916\u63d0\u4f9b**\u8f7b\u91cfB\u6a21\u5757**\uff08\u4e13\u5bb61v1\u60c5\u7eea\u6f14\u7ece\u6307\u5bfc\uff09\uff0c\u4f46\u9700\u5728\u9ad8\u5ea6\u9f13\u52b1\u7684\u8bed\u5883\u4e0b\u8fdb\u884c\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5728\u5979\u8868\u8fbe\u81ea\u6211\u6000\u7591\u65f6\uff0c\u7528\u201c\u522b\u4eba\u90fd\u884c\u4f60\u600e\u4e48\u4e0d\u884c\u201d\u6216\u8fc7\u4e8e\u51b7\u9759\u7684\u6280\u672f\u5206\u6790\u56de\u5e94\uff1b\u7981\u6b62\u5728\u5979\u60c5\u7eea\u4f4e\u843d\u65f6\u5e03\u7f6e\u9ad8\u96be\u5ea6\u6311\u6218\u6027\u4f5c\u4e1a\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u5176\u60c5\u7eea\u4e0d\u7a33\u5b9a\u6216\u6280\u80fd\u74f6\u9888\u671f\u8fdb\u884c\u4efb\u4f55\u5347\u5355\u63a8\u9500**\u3002\u53ea\u6709\u5f53\u5979\u5728\u793e\u7fa4\u4e2d\u83b7\u5f97\u8db3\u591f\u8ba4\u53ef\u3001\u60c5\u7eea\u7a33\u5b9a\u540e\uff0c\u65b9\u53ef\u8003\u8651\u8f7b\u91cf\u7ea7\u5347\u5355\uff08\u5982\u58f0\u97f3\u5b9a\u5236\u670d\u52a1\uff09\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u4e3b\u8981\u6211\u89c9\u5f97\u6211\u7684\u8fdb\u633a\u6162\u7684...\u5c31\u6000\u7591\u6211\u9002\u4e0d\u9002\u5408\u505a\u8fd9\u884c\u201d\n2. > \u201c\u60f3\u53bb\u6b7b\uff0c\u4e0d\u60f3\u6d3b\u4e86\u201d\uff08\u672f\u540e\u75bc\u75db\u65f6\uff09\n3. > \u201c\u6c38\u8fdc\u5728\u81ea\u6211\u6000\u7591\u4e2d...\u52a0\u6cb9\ud83d\udcaa\u201d\uff08\u81ea\u6211\u5426\u5b9a\u4e0e\u81ea\u6211\u9f13\u52b1\u7684\u77db\u76fe\u4f53\uff09\n4. > \u201c\u6ca1\u4e8b\uff0c\u6211\u5c31\u8ddf\u4f60\u804a\u4e00\u4e0b\u6211\u7684\u72b6\u6001\u201d\uff08\u4e3b\u52a8\u5bfb\u6c42\u60c5\u7eea\u652f\u6301\uff09\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u793e\u7fa4\u5f52\u5c5e\u4e0e\u5c0a\u91cd\u8ba4\u53ef\uff0c\u4ee5\u5bf9\u6297\u6df1\u5c42\u7684\u81ea\u6211\u6000\u7591\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6ee1\u914d\u7684\u60c5\u7eea\u6258\u5e95\uff08C\u6a21\u5757\uff09+ \u8d4b\u4e88\u5176\u73ed\u7ea7\u5185\u201c\u88ab\u9700\u8981\u201d\u7684\u89d2\u8272\uff08D\u6a21\u5757\u8f7b\u91cf\u6743\u9650\uff09\uff0c\u7528\u5b89\u5168\u611f\u5305\u88f9\u6280\u672f\u6307\u5bfc\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u793e\u4ea4/\u5c0a\u91cd\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305 + \u5708\u5c42\u5408\u4f19\u4eba\u89d2\u8272\"}\n```";
