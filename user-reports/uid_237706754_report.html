        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 237706754 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-04 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u7389\u7389\u4e09\u6dfc (\u66fe\u73b0\u4e3d) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b (\u5df2\u8d2d)\uff0c\u540e\u7eed\u8003\u8651\u97f3\u526a/\u8fd0\u8425\u8bfe |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u7ecf\u6d4e\u538b\u529b\u6216\u5bb6\u5ead\u53cd\u5bf9\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4e2d\u7b49/\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u591a\u6b21\u63d0\u53ca\u201c\u503c\u73ed\u201d\u3001\u201c\u4e0a\u73ed\u201d\u3001\u201c\u5fd9\u201d\uff0c\u8868\u660e\u6709\u5168\u804c\u5de5\u4f5c\uff0c\u5b66\u4e60\u65f6\u95f4\u9700\u4ece\u5de5\u4f5c\u95f4\u9699\u4e2d\u6324\u51fa\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\uff0c\u65e0\u6cd5\u5224\u65ad\u652f\u6301\u6216\u53cd\u5bf9\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u804a\u5929\u8bb0\u5f55\u8be6\u7ec6\uff0c\u8986\u76d6\u4e86\u5b66\u4e60\u3001\u5b9e\u8df5\u3001\u793e\u7fa4\u4e92\u52a8\u3001\u5347\u5355\u51b3\u7b56\u7b49\u591a\u4e2a\u7ef4\u5ea6\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u80fd\u529b\u6210\u957f\u4e0e\u517c\u804c\u53d8\u73b0\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u79ef\u6781\u53c2\u4e0e\u8bd5\u97f3\u3001\u5267\u7ec4\u5b9e\u8df5\uff0c\u5173\u6ce8\u6280\u80fd\u63d0\u5347\uff08\u5982\u5bf9\u8f68\u3001\u5ba1\u97f3\u3001\u89d2\u8272\u7406\u89e3\uff09\uff0c\u4f46\u4e5f\u660e\u786e\u8868\u793a\u201c\u8138\u76ae\u6709\u70b9\u8584\u201d\u3001\u201c\u6211\u8fd9\u4e2a\u4eba\u5427\uff0c\u4e8b\u60c5\u4e00\u591a\u5c31\u5bb9\u6613\u5bb9\u6613\u70e6\u8e81\u201d\uff0c\u5bf9\u53d8\u73b0\u8def\u5f84\u548c\u538b\u529b\u6709\u73b0\u5b9e\u987e\u8651\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u524d\u9762\u627e\u58a8\u97f3\u548c\u4e09\u5206\u642d\u97f3\uff0c\u90fd\u6ca1\u4e2d\uff0c\u90fd\u4e0d\u597d\u610f\u518d\u627e\u4ed6\u4eec\u4e86\u201d (\u4f53\u73b0\u5bf9\u7ed3\u679c\u7684\u5728\u610f\u548c\u632b\u8d25\u611f) > \u201c\u6211\u540e\u671f\u548c\u8fdb\u9636\u90fd\u843d\u4e0b\u4e86\u597d\u591a\u8bfe\u2026\u6211\u4e0d\u786e\u5b9a\u81ea\u5df1\u80fd\u4e0d\u80fd\u575a\u6301\u4e0b\u53bb\uff0c\u6240\u4ee5\u4e0d\u60f3\u62a5\u201d (\u5bf9\u957f\u671f\u6295\u5165\u548c\u53d8\u73b0\u7684\u72b9\u8c6b)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 \u6709\u80fd\u529b\u8d2d\u4e70\u8bfe\u7a0b\u5e76\u8003\u8651\u5347\u5355\uff08\u97f3\u526a/\u8fd0\u8425\uff09\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u56f0\u96be\uff0c\u4f46\u5347\u5355\u51b3\u7b56\u8c28\u614e\uff0c\u8868\u660e\u8d44\u91d1\u975e\u65e0\u9650\u5145\u88d5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 **\u4e3b\u8981\u77ed\u677f**\u3002\u5168\u804c\u5de5\u4f5c\uff08\u9700\u503c\u73ed\uff09\uff0c\u5b66\u4e60\u65f6\u95f4\u788e\u7247\u5316\uff0c\u591a\u6b21\u56e0\u201c\u5fd9\u4e0a\u73ed\u7684\u4e8b\u201d\u5f71\u54cd\u5b66\u4e60\u8fdb\u5ea6\u548c\u5267\u7ec4\u534f\u4f5c\uff0c\u7cbe\u529b\u88ab\u5de5\u4f5c\u5927\u91cf\u5360\u7528\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u4e0d\u8db3] \u2014 \u672a\u63d0\u53ca\uff0c\u65e0\u6cd5\u8bc4\u7ea7\uff0c\u4f46\u6784\u6210\u6f5c\u5728\u98ce\u9669\u70b9\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u8bd5\u97f3\u672a\u4e2d\u3001\u4f5c\u4e1a\u6280\u672f\u95ee\u9898\uff08\u5c0f\u7a0b\u5e8fbug\uff09\u3001\u5267\u7ec4\u534f\u4f5c\u4e0d\u7545\u7b49\u632b\u6298\uff0c\u7528\u6237\u8868\u73b0\u51fa\u79ef\u6781\u7684\u89e3\u51b3\u95ee\u9898\u6001\u5ea6\uff1a\u4e3b\u52a8\u6c42\u52a9\u3001\u534f\u8c03\u8d44\u6e90\u3001\u63d0\u51fa\u5177\u4f53\u6539\u8fdb\u8981\u6c42\uff0c\u5e76\u80fd\u81ea\u6211\u8c03\u4f83\uff08\u201c\u6362\u6211\u4e5f\u8fd9\u6837\u201d\uff09\u3002\u867d\u6709\u60c5\u7eea\u6ce2\u52a8\uff08\u201c\u5bb9\u6613\u70e6\u8e81\u201d\uff09\uff0c\u4f46\u80fd\u5feb\u901f\u56de\u5f52\u7406\u6027\u5904\u7406\u4e8b\u52a1\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5e08\u59d0\uff0c\u4f60\u7a7a\u4e86\u5e2e\u6211\u770b\u4e00\u4e0b\uff0c\u4ed6\u8bf4\u7684\u8fd9\u4e9b\u65b9\u9762\u6211\u8981\u600e\u6837\u6539\u8fdb\uff0c\u6211\u81ea\u5df1\u89c9\u5f97\u8fd9\u6b21\u6bd4\u4ee5\u5f80\u90fd\u8981\u8868\u73b0\u5f97\u597d\u201d (\u4e3b\u52a8\u5bfb\u6c42\u4e13\u4e1a\u53cd\u9988\u4ee5\u6539\u8fdb) > \u201c\u540c\u5b66\u4eec\uff0c20-30\u96c6\u7684\u89d2\u8272\u97f3\u548c\u65c1\u767d\u8981\u6293\u7d27\u65f6\u95f4\u4e86\u54df\uff0c\u4e0d\u7136\u548b\u4eec\u8981\u843d\u540e\u54af\uff01\u201d (\u4e3b\u52a8\u627f\u62c5\u534f\u8c03\u89d2\u8272\uff0c\u63a8\u52a8\u9879\u76ee)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 (\u6210\u5c31\u3001\u8ba4\u53ef\u3001\u80fd\u529b\u8bc1\u660e) ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u786c\u6838\u6280\u80fd\uff08\u6709\u58f0\u6f14\u64ad\uff09\u6765\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u548c\u793e\u7fa4\u5730\u4f4d\uff0c\u4ee5\u5bf9\u6297\u56e0\u201c\u8138\u76ae\u8584\u201d\u548c\u201c\u4e8b\u60c5\u4e00\u591a\u5c31\u70e6\u8e81\u201d\u5e26\u6765\u7684\u4e0d\u81ea\u4fe1\u4e0e\u5931\u63a7\u611f\u3002** \u5979\u79ef\u6781\u53c2\u4e0e\u5267\u7ec4\u7ba1\u7406\u3001\u5ba1\u97f3\u3001\u5bf9\u8f68\u7b49\u590d\u6742\u5de5\u4f5c\uff0c\u5e76\u5e0c\u671b\u83b7\u5f97\u201c\u4e00\u8bed\u60ca\u9192\u68a6\u4e2d\u4eba\u201d\u5f0f\u7684\u4e13\u4e1a\u70b9\u62e8\uff0c\u672c\u8d28\u662f\u8ffd\u6c42\u201c\u6211\u80fd\u884c\u201d\u7684\u80fd\u529b\u8bc1\u660e\u548c\u4ed6\u4eba\u5c0a\u91cd\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u7ed9\u4e88\u5176\u201c\u4e13\u4e1a\u534f\u4f5c\u8005\u201d\u548c\u201c\u6f5c\u529b\u80a1\u201d\u7684\u8eab\u4efd\u8ba4\u540c\u3002** \u80af\u5b9a\u5979\u5728\u6280\u672f\u7ec6\u8282\u4e0a\u7684\u94bb\u7814\uff08\u5982\u97f3\u91cf\u3001\u566a\u97f3\u5224\u65ad\uff09\u3001\u5728\u5267\u7ec4\u4e2d\u7684\u534f\u8c03\u80fd\u529b\uff0c\u8ba9\u5979\u611f\u53d7\u5230\u81ea\u5df1\u662f\u56e2\u961f\u4e2d\u4e0d\u53ef\u6216\u7f3a\u7684\u3001\u88ab\u5c0a\u91cd\u7684\u6280\u672f\u578b\u4eba\u624d\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u52a8\u673a\u4e2d\u7b49\u3001\u8d44\u6e90\u4e2d\u7b49\u3001\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u662f\u5178\u578b\u7684\u53ef\u57f9\u517b\u3001\u9700\u5f15\u5bfc\u7684\u6f5c\u529b\u7528\u6237) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u6838\u5fc3\u7279\u5f81\uff1a\u4e0d\u5f20\u626c\uff0c\u4f46\u6df1\u5165\u53c2\u4e0e\u5177\u4f53\u4e8b\u52a1\uff0c\u8ffd\u6c42\u786c\u6838\u6280\u80fd\u7684\u7cbe\u8fdb\u548c\u56e2\u961f\u5185\u7684\u5b9e\u7528\u4ef7\u503c\u8ba4\u53ef) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5c5e\u5927\u5435\u7b49\u8ff9\u8c61\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e (\u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u672a\u63d0\u53ca\u53cd\u5bf9) | \u672a\u77e5\uff0c\u9700\u540e\u7eed\u89c2\u5bdf\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u56e0\u5168\u804c\u5de5\u4f5c\u201c\u503c\u73ed\u201d\u5bfc\u81f4\u5b66\u4e60\u4efb\u52a1\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u592a\u75b2\u60eb\u4e86\u201d\u3001\u201c\u843d\u4e0b\u597d\u591a\u8bfe\u201d\u7684\u7126\u8651\u548c\u81ea\u8d23\uff0c\u6700\u7ec8\u56e0\u65e0\u6cd5\u8ddf\u4e0a\u8fdb\u5ea6\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u5230\u95ee\u9898\u4e3b\u52a8\u6c42\u89e3\u800c\u975e\u62b1\u6028\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u591a\u6b21\u8bd5\u97f3\u672a\u4e2d\uff08\u201c\u90fd\u6ca1\u4e2d\u201d\uff09\u53ef\u80fd\u6253\u51fb\u5176\u4fe1\u5fc3\uff0c\u82e5\u957f\u671f\u65e0\u6b63\u53cd\u9988\uff08\u5982\u63a5\u5355\u3001\u4e2d\u97f3\uff09\uff0c\u53ef\u80fd\u8d28\u7591\u5b66\u4e60\u4ef7\u503c\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u8bfe\u7a0b\u4e2d\u540e\u671f\uff08\u7b2c4-8\u5468\uff09**\uff0c\u5f53\u5267\u7ec4\u4efb\u52a1\u3001\u4e2a\u4eba\u4f5c\u4e1a\u3001\u5de5\u4f5c\u538b\u529b\u4e09\u91cd\u53e0\u52a0\u65f6\uff0c\u6781\u6613\u56e0\u65f6\u95f4\u7cbe\u529b\u8017\u5c3d\u800c\u4ea7\u751f\u653e\u5f03\u5ff5\u5934\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u5979\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u5979\u8bf4......\u201d**\n> \u201c\u770b\u5230\u4f60\u5728\u7fa4\u91cc\u534f\u8c03\u5267\u7ec4\u3001\u5ba1\u97f3\u5bf9\u8f68\u7279\u522b\u7ec6\u81f4\uff0c\u771f\u662f\u4e2a\u9760\u8c31\u7684\u4f19\u4f34\uff01\u54b1\u4eec\u8fd9\u884c\u5c31\u9700\u8981\u4f60\u8fd9\u6837\u65e2\u61c2\u6280\u672f\u53c8\u6709\u8d23\u4efb\u5fc3\u7684\u5b9e\u5e72\u6d3e\u3002\u6211\u77e5\u9053\u4f60\u5de5\u4f5c\u5fd9\uff0c\u65f6\u95f4\u7d27\uff0c\u522b\u62c5\u5fc3\u8ddf\u4e0d\u4e0a\u3002\u54b1\u4eec\u7684\u6838\u5fc3\u662f\u2018\u7ec3\u4f1a\u2019\u800c\u4e0d\u662f\u2018\u5237\u5b8c\u2019\uff0c\u6211\u4f1a\u5e2e\u4f60\u6839\u636e\u4f60\u7684\u503c\u73ed\u8868\uff0c\u5b9a\u5236\u4e00\u4e2a\u5f39\u6027\u5b66\u4e60\u8ba1\u5212\uff0c\u628a\u52b2\u513f\u7528\u5728\u5200\u5203\u4e0a\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u3002\u5979\u9700\u8981\u7684\u662f\u624e\u5b9e\u7684\u6280\u80fd\u63d0\u5347\u548c\u9879\u76ee\u5b9e\u8df5\u5e26\u6765\u7684\u6210\u5c31\u611f\u3002\u907f\u514d\u7528\u201c\u5feb\u901f\u53d8\u73b0\u201d\u753b\u997c\uff0c\u800c\u662f\u5f3a\u8c03\u201c\u6280\u80fd\u7cbe\u8fdb\u201d\u548c\u201c\u4f5c\u54c1\u79ef\u7d2f\u201d\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\u7684\u7279\u70b9\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010**\u65f6\u95f4\u7ba1\u7406\u8f85\u52a9\u5305**\u3011\uff08\u5982\u91cd\u70b9\u4efb\u52a1\u62c6\u89e3\u3001\u788e\u7247\u65f6\u95f4\u5229\u7528\u6307\u5357\uff09\u3002\u9488\u5bf9\u5176\u6e34\u671b\u8ba4\u53ef\u7684\u9700\u6c42\uff0c\u53ef\u8865\u5145\u3010**\u5185\u90e8\u534f\u4f5c\u8005\u8ba4\u8bc1**\u3011\uff08\u5982\u8d4b\u4e88\u201c\u6280\u672f\u8d28\u68c0\u5458\u201d\u3001\u201c\u5267\u7ec4\u534f\u8c03\u5b98\u201d\u7b49\u975e\u6b63\u5f0f\u5934\u8854\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u7ed9\u5979\u6301\u7eed\u753b\u201c\u5feb\u94b1\u201d\u5927\u997c**\uff0c\u8fd9\u4e0e\u5176\u5b9e\u5e72\u6027\u683c\u4e0d\u7b26\u4e14\u6613\u5f15\u53d1\u843d\u5dee\u611f\u30022. **\u7528\u5bc6\u96c6\u7684\u3001\u6b7b\u677f\u7684\u6253\u5361\u4efb\u52a1\u65bd\u538b**\uff0c\u8fd9\u4f1a\u52a0\u5267\u5176\u5de5\u4f5c\u4e0e\u5b66\u4e60\u7684\u51b2\u7a81\u7126\u8651\u30023. **\u5ffd\u89c6\u5979\u5728\u6280\u672f\u7ec6\u8282\u4e0a\u7684\u4ed8\u51fa\u548c\u63d0\u95ee**\uff0c\u5fc5\u987b\u7ed9\u4e88\u4e13\u4e1a\u3001\u5177\u4f53\u7684\u53cd\u9988\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u8fdb\u884c\u5c0f\u989d\u5347\u5355\u63a8\u4ecb\uff08\u5982\u97f3\u526a\u5de5\u5177\uff09\uff0c\u4f46\u9700\u7d27\u5bc6\u7ed3\u5408\u5176\u5f53\u524d\u5b66\u4e60\u9636\u6bb5\u548c\u5b9e\u9645\u9879\u76ee\u9700\u6c42**\u3002\u5728\u5979\u660e\u786e\u8868\u793a\u201c\u592a\u75b2\u60eb\u201d\u3001\u201c\u843d\u4e0b\u8bfe\u201d\u65f6\uff0c\u4e25\u7981\u5f3a\u63a8\u5927\u8bfe\u3002\u5347\u5355\u8bdd\u672f\u5e94\u56f4\u7ed5\u201c\u63d0\u5347\u4f60\u5f53\u524d\u5267\u7ec4\u5de5\u4f5c\u6548\u7387/\u4f5c\u54c1\u8d28\u91cf\u201d\u5c55\u5f00\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5e08\u59d0\uff0c\u4f60\u7a7a\u4e86\u5e2e\u6211\u770b\u4e00\u4e0b\uff0c\u4ed6\u8bf4\u7684\u8fd9\u4e9b\u65b9\u9762\u6211\u8981\u600e\u6837\u6539\u8fdb\uff0c\u6211\u81ea\u5df1\u89c9\u5f97\u8fd9\u6b21\u6bd4\u4ee5\u5f80\u90fd\u8981\u8868\u73b0\u5f97\u597d\u201d **(\u8ffd\u6c42\u4e13\u4e1a\u7cbe\u8fdb\u4e0e\u8ba4\u53ef)**\n2. > \u201c\u6211\u8fd9\u4e2a\u4eba\u5427\uff0c\u4e8b\u60c5\u4e00\u591a\u5c31\u5bb9\u6613\u5bb9\u6613\u70e6\u8e81\u201d **(\u8d44\u6e90\u5e95\u5ea7\u77ed\u677f\uff1a\u7cbe\u529b\u7ba1\u7406)**\n3. > \u201c\u540c\u5b66\u4eec\uff0c20-30\u96c6\u7684\u89d2\u8272\u97f3\u548c\u65c1\u767d\u8981\u6293\u7d27\u65f6\u95f4\u4e86\u54df\uff0c\u4e0d\u7136\u548b\u4eec\u8981\u843d\u540e\u54af\uff01\u201d **(\u4e3b\u52a8\u627f\u62c5\u3001\u56e2\u961f\u534f\u4f5c\u610f\u8bc6\u5f3a)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2\u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u548c\u80fd\u529b\u8bc1\u660e**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u5e2e\u52a9\u5979\u8fdb\u884c\u7cbe\u529b\u7ba1\u7406\uff0c\u5c06\u5b66\u4e60\u4efb\u52a1\u4e0e\u5176\u201c\u5b9e\u5e72\u534f\u4f5c\u8005\u201d\u89d2\u8272\u6df1\u5ea6\u7ed1\u5b9a\uff0c\u7ed9\u4e88\u5177\u4f53\u7684\u6280\u672f\u8ba4\u53ef\u548c\u5f39\u6027\u8fdb\u5ea6\u652f\u6301**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"maslow_need\": \"\u7b2c\u56db\u5c42\u5c0a\u91cd\u9700\u6c42\", \"risk_level\": \"\u4e2d\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u65f6\u95f4\u7ba1\u7406\u8f85\u52a9\u5305\"}\n```";
