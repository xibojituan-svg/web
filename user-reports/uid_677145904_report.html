    <script>
        const markdownText = "\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e\u3002\u7f3a\u5931\u5173\u952e\u4fe1\u606f\uff1a\u652f\u4ed8\u884c\u4e3a\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u5177\u4f53\u8d44\u6e90\u60c5\u51b5\uff08\u5982\u8bbe\u5907\u3001\u65f6\u95f4\uff09\u3001\u6df1\u5c42\u52a8\u673a\u7ec6\u8282\u3001\u5bf9\u4ef7\u683c\u7684\u654f\u611f\u5ea6\u3002\n\n# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u4e0e\u98ce\u63a7\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4f4e-\u4e2d)**\n    *   **\u8868\u5c42\u4fe1\u53f7**: \u5174\u8da3\u9a71\u52a8\uff08\u201c\u559c\u6b22\u52a8\u8d77\u6765\u7684\u201d\uff09\u3001\u517c\u804c\u589e\u6536\uff08\u201c\u8eab\u517c\u6570\u804c\u201d\uff09\u3001\u6280\u80fd\u63d0\u5347\uff08\u79ef\u6781\u4e92\u52a8\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u8be2\u95ee\u7ec6\u8282\uff09\u3002\n    *   **\u6df1\u5c42\u4fe1\u53f7**: \u5b58\u5728**\u53d8\u73b0\u7126\u8651**\uff08\u53cd\u590d\u8be2\u95ee\u5165\u9a7b\u3001\u63a5\u5355\u6210\u529f\u7387\u3001\u5b66\u5b8c\u662f\u5426\u4e0d\u7ba1\uff09\uff0c\u5bf9\u627f\u8bfa\u7684\u201c\u8d44\u6e90\u201d\u548c\u201c\u4fdd\u969c\u201d\u9ad8\u5ea6\u5173\u6ce8\u3002\u5174\u8da3\u4e0e\u529f\u5229\u5e76\u5b58\uff0c\u4f46\u529f\u5229\u6027\u62c5\u5fe7\u66f4\u7a81\u51fa\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d-\u4f4e)**\n    *   **\u65f6\u95f4/\u7cbe\u529b**: \u5927\u5b66\u751f\uff0c\u6709\u65f6\u95f4\u53c2\u4e0e\u8bad\u7ec3\u8425\u548c\u76f4\u64ad\uff0c\u4f46\u63d0\u53ca\u201c\u665a\u4e0a\u8003\u8bd5\u201d\uff0c\u65f6\u95f4\u975e\u5b8c\u5168\u81ea\u7531\u3002\n    *   **\u7ecf\u6d4e/\u8bbe\u5907**: **\u5173\u952e\u4fe1\u606f\u7f3a\u5931**\u3002\u672a\u63d0\u53ca\u652f\u4ed8\u80fd\u529b\u4e0e\u8bbe\u5907\u60c5\u51b5\uff0c\u4f46\u4e3b\u52a8\u63d0\u53ca\u201c\u521a\u62a5\u4e86\u9a7e\u6821\u201d\u4f5c\u4e3a\u72b9\u8c6b\u7406\u7531\uff0c\u6697\u793a**\u8fd1\u671f\u6709\u5927\u989d\u652f\u51fa\u6216\u7ecf\u6d4e\u89c4\u5212**\uff0c\u5bf9\u4ef7\u683c\u654f\u611f\u3002\n    *   **\u6280\u80fd\u57fa\u7840**: \u5b66\u4e60\u6001\u5ea6\u8ba4\u771f\uff0c\u80fd\u5b8c\u6210\u4f5c\u4e1a\u5e76\u63d0\u95ee\uff0c\u5177\u5907\u57fa\u672c\u5b66\u4e60\u80fd\u529b\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d)**\n    *   **\u575a\u6301\u6027**: \u826f\u597d\u3002\u80fd\u6309\u65f6\u5b8c\u6210\u5b66\u4e60\u4efb\u52a1\uff0c\u4e92\u52a8\u79ef\u6781\u3002\n    *   **\u6297\u538b\u6027**: **\u504f\u4f4e**\u3002\u8868\u73b0\u51fa\u660e\u663e\u7684**\u81ea\u6211\u6000\u7591\u548c\u4e0d\u81ea\u4fe1**\uff08\u201c\u6211\u6015\u6211\u8bd5\u97f3\u5b8c\u6ca1\u4eba\u8981[\u6d41\u6cea]\u201d\uff09\uff0c\u5bf9\u672a\u6765\u7684\u4e0d\u786e\u5b9a\u6027\u611f\u5230\u7126\u8651\u3002\n    *   **\u81ea\u4e3b\u6027**: \u4e2d\u7b49\u3002\u80fd\u4e3b\u52a8\u63d0\u95ee\uff08\u5982\u63a5\u5355\u6d41\u7a0b\uff09\uff0c\u4f46\u5728\u51b3\u7b56\u4e0a\u4f9d\u8d56\u9500\u552e\u5f15\u5bfc\u548c\u627f\u8bfa\uff0c\u5e76\u9700\u8981\u201c\u548c\u5bb6\u957f\u5546\u91cf\u201d\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u4fe1\u606f\u7f3a\u5931**\u3002\u8bb0\u5f55\u672a\u6d89\u53ca\u652f\u4ed8\u73af\u8282\uff0c\u65e0\u6cd5\u5224\u65ad\u652f\u4ed8\u610f\u613f\u3001\u80fd\u529b\u53ca\u652f\u4ed8\u4eba\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u90e8\u5206\u89e6\u53ca**\u3002\u7528\u6237\u4e3a20\u5c81\u5927\u5b66\u751f\uff0c\u5728\u9500\u552e\u903c\u5355\u65f6\u4e3b\u52a8\u63d0\u51fa\u201c\u6211\u9700\u8981\u548c\u6211\u5bb6\u957f\u5546\u91cf\u201d\uff0c\u8868\u660e**\u91cd\u5927\u6d88\u8d39\u51b3\u7b56\u53ef\u80fd\u4e0d\u5b8c\u5168\u81ea\u4e3b\uff0c\u9700\u5bb6\u5ead\u652f\u6301\u6216\u77e5\u60c5**\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u7eaf\u5ea6 (B\u7c7b-\u7126\u8651\u9a71\u52a8\u578b)**: \u5174\u8da3\u4e0e\u53d8\u73b0\u9700\u6c42\u6df7\u5408\uff0c\u4f46**\u5bf9\u201c\u5b66\u5b8c\u80fd\u5426\u63a5\u5355\u201d\u7684\u7126\u8651\u548c\u4e0d\u786e\u5b9a\u6027\u662f\u6838\u5fc3\u9a71\u52a8\u529b**\u3002\u975e\u7eaf\u7cb9\u70ed\u7231\uff0c\u4e5f\u975e\u660e\u786e\u7684\u804c\u4e1a\u8f6c\u578b\uff0c\u5c5e\u4e8e\u5bfb\u6c42\u201c\u4fdd\u969c\u201d\u7684\u7126\u8651\u578b\u5b66\u4e60\u8005\u3002\n*   **\u6b65\u9aa42 - \u8d44\u6e90\u5e95\u5ea7 (C\u7c7b-\u8d44\u6e90\u53d7\u9650\u578b)**: \u5927\u5b66\u751f\u8eab\u4efd\uff0c\u65f6\u95f4\u76f8\u5bf9\u5145\u88d5\u4f46\u975e\u7edd\u5bf9\uff1b\u7ecf\u6d4e\u72b6\u51b5\u4e0d\u660e\uff0c\u4f46\u201c\u62a5\u9a7e\u6821\u201d\u63d0\u793a\u6d88\u8d39\u8c28\u614e\uff1b\u8bbe\u5907\u60c5\u51b5\u672a\u77e5\u3002\u6574\u4f53\u8d44\u6e90\u6709\u9650\uff0c\u6297\u98ce\u9669\u80fd\u529b\u5f31\u3002\n*   **\u6b65\u9aa43 - \u5fc3\u7406\u5f39\u6027 (C\u7c7b-\u6613\u632b\u578b)**: \u5b66\u4e60\u914d\u5408\u5ea6\u9ad8\uff0c\u4f46**\u5185\u5728\u81ea\u4fe1\u4e0d\u8db3\uff0c\u5bf9\u5931\u8d25\uff08\u63a5\u4e0d\u5230\u5355\uff09\u6709\u707e\u96be\u5316\u60f3\u8c61**\uff0c\u6613\u56e0\u521d\u671f\u632b\u6298\u6216\u9884\u671f\u4e0d\u7b26\u800c\u653e\u5f03\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**: **B-C-C\u578b\u7528\u6237**\u3002\u7126\u8651\u9a71\u52a8\u3001\u8d44\u6e90\u6709\u9650\u3001\u5fc3\u7406\u5f39\u6027\u4e0d\u8db3\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b: T7 \u8d44\u6e90\u532e\u4e4f\u7126\u8651\u8005**\n    *   \u5178\u578b\u7279\u5f81\uff1a\u6709\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b\uff0c\u4f46**\u7ecf\u6d4e\u57fa\u7840\u8584\u5f31**\uff08\u5b66\u751f\uff09\uff0c**\u5bf9\u6295\u8d44\u56de\u62a5\u9ad8\u5ea6\u654f\u611f\u4e14\u7126\u8651**\uff0c\u5fc3\u7406\u627f\u53d7\u529b\u4f4e\uff0c\u9700\u8981\u6301\u7eed\u7684\u5916\u90e8\u80af\u5b9a\u548c\u201c\u4fdd\u969c\u201d\u627f\u8bfa\u3002\n    *   \u672c\u7528\u6237\u9ad8\u5ea6\u543b\u5408\uff1a\u5927\u5b66\u751f\u8eab\u4efd\u3001\u5bf9\u201c\u5165\u9a7b\u6210\u529f\u7387\u201d\u3001\u201c\u63a5\u5355\u4fdd\u969c\u201d\u53cd\u590d\u786e\u8ba4\u3001\u81ea\u6211\u6000\u7591\u3001\u51b3\u7b56\u9700\u5bb6\u5ead\u4ecb\u5165\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4e2d-\u9ad8)\n\u9010\u9879\u6392\u67e57\u5927\u9000\u8d39\u6839\u56e0\uff1a\n1.  **\u6548\u679c\u4e0d\u53ca\u9884\u671f (\u9ad8\u98ce\u9669)**: \u7528\u6237\u5bf9\u201c\u5b66\u5b8c\u5373\u63a5\u5355\u201d\u3001\u201c100%\u5165\u9a7b\u201d\u62b1\u6709\u9ad8\u671f\u5f85\u3002**\u4e00\u65e6\u5b66\u4e60\u521d\u671f\u8bd5\u97f3\u672a\u4e2d\u6216\u5165\u9a7b\u9047\u963b\uff0c\u6781\u6613\u4ea7\u751f\u201c\u88ab\u9a97\u201d\u611f\uff0c\u662f\u6700\u5927\u9000\u8d39\u98ce\u9669\u70b9\u3002**\n2.  **\u7ecf\u6d4e\u538b\u529b (\u4e2d\u98ce\u9669)**: \u201c\u62a5\u9a7e\u6821\u201d\u63d0\u793a\u8fd1\u671f\u6709\u89c4\u5212\u6027\u652f\u51fa\uff0c\u8bfe\u7a0b\u8d39\u7528\u53ef\u80fd\u6784\u6210\u538b\u529b\u3002\u82e5\u5bb6\u4eba\u4e0d\u540c\u610f\uff0c\u9000\u8d39\u98ce\u9669\u9661\u589e\u3002\n3.  **\u65f6\u95f4\u51b2\u7a81 (\u4f4e\u98ce\u9669)**: \u76ee\u524d\u770b\u65f6\u95f4\u53ef\u8c03\u914d\uff0c\u4f46\u5927\u5b66\u751f\u5b66\u4e1a\u5b58\u5728\u5468\u671f\u6027\u5fd9\u95f2\uff0c\u98ce\u9669\u53ef\u63a7\u3002\n4.  **\u5bb6\u5ead\u53cd\u5bf9 (\u4e2d\u9ad8\u98ce\u9669)**: **\u5df2\u660e\u786e\u9700\u8981\u201c\u548c\u5bb6\u957f\u5546\u91cf\u201d**\uff0c\u5bb6\u5ead\u51b3\u7b56\u6743\u672a\u786e\u8ba4\u662f\u91cd\u5927\u98ce\u9669\u655e\u53e3\u3002\n5.  **\u9500\u552e\u8bef\u5bfc (\u4e2d\u98ce\u9669)**: \u9500\u552e\u627f\u8bfa\u201c\u4e0d\u7528\u8003\u6838\u201d\u3001\u201c\u5165\u9a7b\u7b80\u5355\u201d\u3001\u201c\u63a5\u4e0d\u5230\u5355\u4e0d\u81f3\u4e8e\u201d\uff0c\u5b58\u5728**\u8fc7\u5ea6\u627f\u8bfa\u503e\u5411**\uff0c\u53ef\u80fd\u62d4\u9ad8\u7528\u6237\u9884\u671f\u3002\n6.  **\u4ea7\u54c1\u9519\u914d (\u4e2d\u98ce\u9669)**: \u7528\u6237\u5174\u8da3\u5728\u201c\u5f55\u4e66\u548c\u753b\u672c\u201d\uff08\u5b9e\u64cd\uff09\uff0c\u82e5\u8bfe\u7a0b\u7406\u8bba\u8fc7\u591a\u6216\u8fdb\u5ea6\u4e0d\u7b26\u9884\u671f\uff0c\u53ef\u80fd\u5931\u671b\u3002\n7.  **\u670d\u52a1\u4f53\u9a8c (\u4f4e\u98ce\u9669)**: \u76ee\u524d\u5bf9\u9500\u552e\u670d\u52a1\u53cd\u9988\u6b63\u9762\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5938\u5927\u627f\u8bfa**: \u9500\u552e\u63d0\u53ca\u201c\u5b66\u5b8c\u80af\u5b9a\u662f\u5165\u9a7b\u7b80\u5355\u4e00\u70b9\u201d\u3001\u201c\u6211\u4e4b\u524d\u7684\u540c\u5b66\u76ee\u524d\u8fd8\u6ca1\u51fa\u73b0\u63a5\u4e0d\u5230\u5355\u7684\u201d\uff0c**\u5b58\u5728\u6a21\u7cca\u5316\u6210\u529f\u7387\u3001\u6697\u793a\u4fdd\u7ed3\u679c\u7684\u503e\u5411**\uff0c\u9700\u8b66\u60d5\u3002\n*   **\u538b\u529b\u903c\u5355**: \u4f7f\u7528\u201c\u540d\u989d\u8981\u6ca1\u6709\u4e86\u54c8\uff0c\u798f\u5229\u5b66\u59d0\u90fd\u7ed9\u4f60\u51c6\u5907\u597d\u4e86\u5462\u201d\u7b49\u8bdd\u672f\uff0c\u7b26\u5408\u5e38\u89c1\u9500\u552e\u8282\u594f\uff0c\u4f46\u672a\u53d1\u73b0\u6781\u7aef\u80c1\u8feb\u3002\n*   **\u5bb6\u5ead\u77e5\u60c5**: **\u91cd\u5927\u7f3a\u9677**\u3002\u9500\u552e\u5728\u7528\u6237\u63d0\u51fa\u9700\u4e0e\u5bb6\u957f\u5546\u91cf\u540e\uff0c\u672a\u4e3b\u52a8\u6838\u5b9e\u5bb6\u5ead\u77e5\u60c5\u60c5\u51b5\uff0c\u800c\u662f\u7ee7\u7eed\u63a8\u8fdb\uff08\u201cOKOK\uff0c\u53ef\u4ee5\u7684\u54c8\u201d\u5e76\u8f6c\u79fb\u8bdd\u9898\uff09\uff0c**\u4e25\u91cd\u8fdd\u53cd\u9488\u5bf9\u5b66\u751f\u5ba2\u7fa4\u7684\u4f26\u7406\u9632\u7ebf**\u3002\n*   **\u98ce\u9669\u63d0\u793a**: \u672a\u53d1\u73b0\u5bf9\u5b66\u4e60\u96be\u5ea6\u3001\u7ade\u4e89\u60c5\u51b5\u3001\u6536\u76ca\u4e0d\u786e\u5b9a\u6027\u8fdb\u884c\u5145\u5206\u63d0\u793a\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **\u7acb\u5373\u6838\u5b9e\u5bb6\u5ead\u77e5\u60c5\u4e0e\u652f\u4ed8\u610f\u613f**\n*   **\u884c\u52a8\u6307\u5357**:\n    1.  **\u9996\u5468\u6838\u5fc3\u4efb\u52a1**: \u73ed\u4e3b\u4efb\u63a5\u624b\u540e\uff0c**24\u5c0f\u65f6\u5185\u5fc5\u987b\u4e0e\u7528\u6237\u672c\u4eba\u53ca\uff08\u5c3d\u53ef\u80fd\uff09\u5176\u5bb6\u957f\u8fdb\u884c\u4e09\u65b9\u6c9f\u901a**\uff0c\u660e\u786e\u8bfe\u7a0b\u6027\u8d28\u3001\u6295\u5165\u3001\u9884\u671f\uff0c\u83b7\u5f97\u5bb6\u5ead\u652f\u6301\u3002\u8fd9\u662f\u9632\u6b62\u540e\u7eed\u7ea0\u7eb7\u7684**\u6700\u5173\u952e\u4e00\u6b65**\u3002\n    2.  **\u9884\u671f\u7ba1\u7406**: \u9996\u6b21\u6c9f\u901a\u5373\u6821\u6b63\u201c\u5305\u63a5\u5355\u201d\u5e7b\u60f3\uff0c\u660e\u786e\u8bf4\u660e\u8bd5\u97f3\u7ade\u4e89\u6027\u3001\u5165\u9a7b\u6807\u51c6\u3001\u6536\u76ca\u4e0e\u52aa\u529b\u6b63\u76f8\u5173\u3002\u5f3a\u8c03\u6280\u80fd\u79ef\u7d2f\u7684\u957f\u671f\u6027\u3002\n    3.  **\u4fe1\u5fc3\u5efa\u7acb**: \u9488\u5bf9\u5176\u4e0d\u81ea\u4fe1\uff0c\u521d\u671f\u7ed9\u4e88\u66f4\u5bc6\u96c6\u3001\u5177\u4f53\u7684\u6b63\u53cd\u9988\uff0c\u5e2e\u52a9\u5176\u5b8c\u6210\u7b2c\u4e00\u4e2a\u5c0f\u4f5c\u54c1\uff0c\u5efa\u7acb\u521d\u6b65\u6210\u5c31\u611f\u3002\n    4.  **\u8d44\u6e90\u652f\u6301**: \u4f18\u5148\u6307\u5bfc\u624b\u673a\u5f55\u97f3\u7b49\u4f4e\u95e8\u69db\u8d77\u6b65\u65b9\u5f0f\uff0c\u5339\u914d\u65b0\u624b\u5355\uff0c\u964d\u4f4e\u5176\u521d\u59cb\u8bbe\u5907\u7126\u8651\u3002\n    5.  **\u98ce\u9669\u76d1\u63a7**: \u6807\u8bb0\u4e3a\u9ad8\u98ce\u9669\u7528\u6237\uff0c\u5bc6\u5207\u5173\u6ce8\u5176\u524d\u4e24\u6b21\u8bd5\u97f3\u7ed3\u679c\u540e\u7684\u60c5\u7eea\u6ce2\u52a8\uff0c\u53ca\u65f6\u5e72\u9884\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u8bc4\u4f30**: **\u504f\u5dee**\u3002\u7528\u6237\u9700\u8981\u7684\u662f\u201c\u4f4e\u98ce\u9669\u3001\u9ad8\u786e\u5b9a\u6027\u7684\u517c\u804c\u8def\u5f84\u201d\uff0c\u4f46\u4ea7\u54c1\u672c\u8d28\u662f\u201c\u6280\u80fd\u57f9\u8bad+\u5e73\u53f0\u63a5\u5165\u201d\uff0c\u5b58\u5728\u4e0d\u786e\u5b9a\u6027\u3002\u9700\u901a\u8fc7\u5f3a\u670d\u52a1\u548c\u9884\u671f\u7ba1\u7406\u6765\u5f25\u8865\u6b64\u504f\u5dee\u3002\n\n{\"core_type\": \"T7 \u8d44\u6e90\u532e\u4e4f\u7126\u8651\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\u9ad8\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u7acb\u5373\u6838\u5b9e\u5bb6\u5ead\u77e5\u60c5\u4e0e\u652f\u4ed8\u610f\u613f\"}";
