    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a\u4e2d\u7b49\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u5b66\u4e60\u76ee\u7684\uff08\u201c0\u7c89\u60f3\u505a\u5feb\u624b\u7684\u8367\u5149\u8ba1\u5212\u201d\u3001\u201c\u80fd\u72ec\u7acb\u63a5\u5546\u5355\u5417\u201d\uff09\uff0c\u6709\u53d8\u73b0\u548c\u6280\u80fd\u63d0\u5347\u7684\u52a1\u5b9e\u9700\u6c42\u3002\u4f46\u5b66\u4e60\u884c\u4e3a\u53d7\u9650\u4e8e\u4e3b\u4e1a\uff08\u8d27\u8f66\u53f8\u673a\uff09\uff0c\u6295\u5165\u5ea6\u4e25\u91cd\u4e0d\u8db3\uff0c\u5b58\u5728\u201c\u56e4\u8bfe\u201d\u548c\u201c\u77e5\u8bc6\u7126\u8651\u201d\u503e\u5411\uff08\u62c5\u5fc3\u201c\u6bd5\u4e1a\u5373\u5931\u4e1a\u201d\uff09\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u8f83\u4f4e**\u3002**\u4e3b\u4e1a\u4e3a\u8d27\u8f66\u53f8\u673a\uff0c\u5de5\u4f5c\u5f3a\u5ea6\u5927\u3001\u65f6\u95f4\u4e0d\u56fa\u5b9a\uff08\u201c\u6bcf\u5929\u665a\u4e0a\u90fd\u5728\u5e72\u6d3b\u201d\u3001\u201c\u8fd8\u5728\u5916\u9762\u5e72\u6d3b\u201d\uff09\uff0c\u4e14\u66fe\u63d0\u53ca\u56e0\u5de5\u4f5c\uff08\u201c\u4e0b\u96ea\u8def\u6ed1\u201d\uff09\u5bfc\u81f4\u4e8b\u6545\u3002** \u53ef\u81ea\u7531\u652f\u914d\u7684\u5b66\u4e60\u65f6\u95f4\u548c\u7cbe\u529b\u6781\u4e3a\u6709\u9650\u3002\u7ecf\u6d4e\u72b6\u51b5\u672a\u660e\uff0c\u4f46\u8fde\u7eed\u62a5\u8bfe\uff08\u57fa\u7840\u8425\u3001\u5b9e\u6218\u8425\u3001\u6f2b\u5267\u8425\uff09\u663e\u793a\u6709\u4e00\u5b9a\u652f\u4ed8\u610f\u613f\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a\u4e2d\u7b49\u504f\u9ad8\u3002\u7528\u6237\u6001\u5ea6\u79ef\u6781\u3001\u793c\u8c8c\uff08\u201c\u591a\u8c22\u8001\u5e08\u201d\uff09\uff0c\u591a\u6b21\u4e3b\u52a8\u63d0\u95ee\uff0c\u6709\u6301\u7eed\u5b66\u4e60\u610f\u613f\u3002\u9762\u5bf9\u8bfe\u7a0b\u8ddf\u4e0d\u4e0a\u3001\u4f5c\u4e1a\u5ef6\u8fdf\u7b49\u73b0\u5b9e\u56f0\u96be\uff0c\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u575a\u6301\u548c\u4e50\u89c2\uff08\u201c\u4e00\u6709\u7a7a\u6211\u5c31\u91cd\u65b0\u5b66\u4e60\u8bfe\u7a0b\u201d\uff09\uff0c\u4f46\u540c\u65f6\u4e5f\u6d41\u9732\u51fa\u660e\u663e\u7684\u7126\u8651\u548c\u529b\u4e0d\u4ece\u5fc3\uff08\u201c\u5b66\u7684\u4e00\u584c\u7cca\u6d82\u201d\u3001\u201c\u8ddf\u4e0d\u4e0a\u8282\u594f\u201d\uff09\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**\uff1a\u5df2\u652f\u4ed8\u57fa\u7840\u8425\u3001\u5b9e\u6218\u8425\u8d39\u7528\uff0c\u5e76\u5df2\u62a5\u540d\u6f2b\u5267\u8425\uff08L3\u8bfe\u7a0b\uff09\u3002\u652f\u4ed8\u884c\u4e3a\u8fde\u7eed\uff0c\u65e0\u5f02\u5e38\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u4e2d\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u6210\u5458\u6216\u51b3\u7b56\u76f8\u5173\u65b9\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u4e3a\u72ec\u7acb\u51b3\u7b56\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u7eaf\u5ea6**\uff1aB\u7c7b\uff08\u6df7\u5408\u52a8\u673a\uff09\u3002\u65e2\u6709\u6280\u80fd\u53d8\u73b0\u7684\u660e\u786e\u76ee\u6807\uff0c\u4e5f\u5b58\u5728\u56e0\u65f6\u95f4\u4e0d\u8db3\u5bfc\u81f4\u7684\u7126\u8651\u6027\u56e4\u8bfe\u884c\u4e3a\u3002\n*   **\u6b65\u9aa42 - \u8d44\u6e90\u5e95\u5ea7**\uff1a**C\u7c7b\uff08\u8d44\u6e90\u532e\u4e4f\uff09**\u3002**\u6838\u5fc3\u9650\u5236\u56e0\u7d20\u4e3a\u201c\u65f6\u95f4\u8d44\u6e90\u201d\u4e25\u91cd\u532e\u4e4f**\uff0c\u804c\u4e1a\u7279\u6027\u5bfc\u81f4\u5176\u65e0\u6cd5\u4fdd\u8bc1\u89c4\u5f8b\u7684\u5b66\u4e60\u6295\u5165\uff0c\u8fd9\u662f\u5176\u5b66\u4e60\u6548\u679c\u4e0d\u4f73\u7684\u6839\u672c\u539f\u56e0\u3002\n*   **\u6b65\u9aa43 - \u5fc3\u7406\u5f39\u6027**\uff1aB\u7c7b\uff08\u4e2d\u7b49\u5f39\u6027\uff09\u3002\u80fd\u4fdd\u6301\u6c9f\u901a\u548c\u63d0\u95ee\uff0c\u4f46\u5b66\u4e60\u632b\u6298\u611f\u660e\u663e\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**\uff1a**BC\u578b\u7528\u6237**\u3002\u6709\u5b66\u4e60\u610f\u613f\u4f46\u88ab\u5ba2\u89c2\u6761\u4ef6\u4e25\u91cd\u5236\u7ea6\uff0c\u5c5e\u4e8e**\u9ad8\u6295\u5165\u98ce\u9669\u3001\u4f4e\u5b8c\u6210\u5ea6**\u7684\u5178\u578b\u4eba\u7fa4\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**\uff1a**T5 \u65f6\u95f4\u532e\u4e4f\u7684\u52a1\u5b9e\u8005**\u3002\n    *   **\u7279\u5f81\u543b\u5408**\uff1a\u6709\u660e\u786e\u7684\u804c\u4e1a\u63d0\u5347\u6216\u526f\u4e1a\u9700\u6c42\uff08\u77ed\u89c6\u9891\u53d8\u73b0\uff09\uff0c\u4f46\u88ab\u5168\u804c\u5de5\u4f5c\uff08\u957f\u9014\u8d27\u8fd0\uff09\u4e25\u91cd\u6324\u538b\u65f6\u95f4\uff0c\u5bfc\u81f4\u5b66\u4e60\u8fdb\u7a0b\u788e\u7247\u5316\u3001\u62d6\u5ef6\u4e25\u91cd\u3001\u5b8c\u6210\u5ea6\u4f4e\u3002\u7528\u6237\u53cd\u590d\u8bf7\u6c42\u4f5c\u4e1a\u5ef6\u8fdf\u3001\u81ea\u8ff0\u201c\u65f6\u95f4\u592a\u7d27\u201d\u3001\u201c\u5929\u5929\u5fd9\u201d\u662f\u5178\u578b\u8868\u73b0\u3002\n    *   **\u6b21\u8981\u7279\u5f81**\uff1a\u517c\u5177T6\uff08\u9ad8\u7126\u8651\u4ece\u4f17\u8005\uff09\u7684\u90e8\u5206\u7279\u8d28\uff0c\u5982\u62c5\u5fc3\u6280\u672f\u8fed\u4ee3\uff08\u201c\u4f1a\u4e0d\u4f1a\u5b66\u5b8c\u6f2b\u5267\u53c8\u51fa\u73b0\u53e6\u5916\u4e00\u79cd\u5267\u201d\uff09\u3001\u5bf9\u5e02\u573a\u524d\u666f\u7126\u8651\uff08\u201c\u6bd5\u4e1a\u5373\u5931\u4e1a\u201d\uff09\uff0c\u4f46\u5176\u6838\u5fc3\u77db\u76fe\u662f\u65f6\u95f4\u532e\u4e4f\u800c\u975e\u5355\u7eaf\u7126\u8651\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669\u7b49\u7ea7**\uff1a**\u4e2d**\u3002\n*   **\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5df2\u8868\u9732\u201c\u5b66\u7684\u4e00\u584c\u7cca\u6d82\u201d\u3001\u201c\u4e00\u4e2a\u50cf\u6837\u7684\u4f5c\u54c1\u4e5f\u505a\u4e0d\u51fa\u6765\u201d\uff0c\u82e5\u540e\u7eed\u65e0\u6cd5\u4ea7\u51fa\u6210\u679c\uff0c\u6613\u5f15\u53d1\u5931\u671b\u3002\n    2.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u6781\u9ad8\u98ce\u9669**\u3002**\u8fd9\u662f\u6700\u4e3b\u8981\u7684\u9000\u8d39\u6839\u56e0**\u3002\u7528\u6237\u4e3b\u4e1a\u5df2\u591a\u6b21\u5bfc\u81f4\u5176\u65e0\u6cd5\u4e0a\u8bfe\u3001\u5b8c\u6210\u4f5c\u4e1a\uff0c\u65b0\u62a5\u540d\u7684\u6f2b\u5267\u8425\u5c06\u52a0\u5267\u65f6\u95f4\u51b2\u7a81\u3002\n    3.  **\u5185\u5bb9\u4e0d\u7b26**\uff1a\u4f4e\u98ce\u9669\u3002\u7528\u6237\u63d0\u95ee\u5177\u4f53\uff0c\u8868\u660e\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u6709\u57fa\u672c\u8ba4\u77e5\uff0c\u672a\u8d28\u7591\u8bfe\u7a0b\u672c\u8eab\u3002\n    4.  **\u670d\u52a1\u4f53\u9a8c**\uff1a\u4f4e\u98ce\u9669\u3002\u7528\u6237\u5bf9\u73ed\u73ed\u670d\u52a1\u6001\u5ea6\u6ee1\u610f\uff08\u201c\u591a\u8c22\u8001\u5e08\u575a\u6301\u4e0d\u61c8\u7684\u4ed8\u51fa\u201d\uff09\uff0c\u6c9f\u901a\u987a\u7545\u3002\n    5.  **\u7ecf\u6d4e\u538b\u529b**\uff1a\u4fe1\u606f\u4e0d\u8db3\u3002\u672a\u63d0\u53ca\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a\u4fe1\u606f\u4e0d\u8db3\u3002\u672a\u63d0\u53ca\u3002\n    7.  **\u7ade\u54c1\u6bd4\u8f83/\u51b2\u52a8\u6d88\u8d39**\uff1a\u4f4e\u98ce\u9669\u3002\u7528\u6237\u662f\u57fa\u4e8e\u73b0\u6709\u8bfe\u7a0b\u5ef6\u7eed\u62a5\u540d\uff0c\u975e\u51b2\u52a8\u65b0\u8d2d\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u98ce\u9669\u70b9**\uff1a\n    1.  **\u8fc7\u5ea6\u627f\u8bfa**\uff1a\u9500\u552e\u5728\u56de\u5e94\u201c\u5b66\u5b8c\u540e\u80fd\u72ec\u7acb\u63a5\u5546\u5355\u5417\u201d\u65f6\uff0c\u56de\u7b54\u201c\u4e3b\u653b\u4e00\u4e2a\u65b9\u5411\u201d\uff0c\u672a\u5938\u5927\u4fdd\u8bc1\uff0c\u4f46\u4ea6\u672a\u5145\u5206\u5f3a\u8c03\u6280\u80fd\u638c\u63e1\u9700\u8981\u65f6\u95f4\u7ec3\u4e60\u7684\u524d\u63d0\uff0c**\u5b58\u5728\u6a21\u7cca\u5316\u5904\u7406**\u3002\n    2.  **\u672a\u5145\u5206\u8b66\u793a\u98ce\u9669**\uff1a\u5728\u7528\u6237\u660e\u663e\u65f6\u95f4\u4e0d\u8db3\u3001\u524d\u671f\u8bfe\u7a0b\u5c1a\u672a\u638c\u63e1\u7684\u60c5\u51b5\u4e0b\uff0c**\u9500\u552e\u672a\u5bf9\u5176\u7eed\u62a5\u66f4\u9ad8\u9636\u3001\u66f4\u8017\u65f6\u7684\u6f2b\u5267\u8425\u8fdb\u884c\u98ce\u9669\u63d0\u793a\u6216\u80fd\u529b\u8bc4\u4f30**\uff0c\u5b58\u5728\u201c\u91cd\u9500\u552e\u3001\u8f7b\u9002\u914d\u201d\u7684\u5acc\u7591\u3002\n    3.  **\u77e5\u60c5\u540c\u610f**\uff1a\u672a\u53d1\u73b0\u865a\u5047\u5ba3\u4f20\u3002\u4f46\u7528\u6237\u5bf9\u5b66\u4e60\u6240\u9700\u7684\u65f6\u95f4\u6295\u5165\u663e\u7136\u9884\u4f30\u4e0d\u8db3\u3002\n*   **\u7ed3\u8bba**\uff1a\u9500\u552e\u8fc7\u7a0b\u57fa\u672c\u5408\u89c4\uff0c\u4f46\u5728**\u7528\u6237\u9002\u914d\u6027\u8bc4\u4f30\u548c\u98ce\u9669\u544a\u77e5\u65b9\u9762\u5b58\u5728\u660e\u663e\u7f3a\u5931**\uff0c\u53ef\u80fd\u4e3a\u540e\u7eed\u670d\u52a1\u548c\u5ba2\u8bc9\u57cb\u4e0b\u9690\u60a3\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**\uff1a**\u504f\u5dee**\u3002\u7528\u6237\u6709\u5b66\u4e60\u610f\u613f\uff0c\u4f46\u73b0\u6709\u4ea7\u54c1\uff08\u9700\u8981\u9ad8\u5f3a\u5ea6\u3001\u8fde\u7eed\u6027\u6295\u5165\u7684\u8425\u671f\u8bfe\u7a0b\uff09\u4e0e\u5176\u6781\u5ea6\u532e\u4e4f\u7684\u65f6\u95f4\u8d44\u6e90\u4e25\u91cd\u4e0d\u5339\u914d\u3002\u7eed\u62a5\u6f2b\u5267\u8425\u5c06\u8fdb\u4e00\u6b65\u52a0\u5267\u9519\u914d\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**\u7d27\u6025\u8fdb\u884c\u5b66\u4e60\u65f6\u95f4\u4e0e\u76ee\u6807\u6821\u51c6\u8bbf\u8c08**\u3002\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u7acb\u5373\u5e72\u9884**\uff1a\u4e3b\u52a8\u8054\u7cfb\u7528\u6237\uff0c\u8fdb\u884c\u4e00\u5bf9\u4e00\u6df1\u5ea6\u6c9f\u901a\u3002\u6838\u5fc3\u662f\u5e2e\u52a9\u5176**\u8ba4\u6e05\u73b0\u5b9e\u65f6\u95f4\u7ea6\u675f**\uff0c\u5171\u540c\u5236\u5b9a\u4e00\u4e2a**\u6781\u5ea6\u7cbe\u7b80\u3001\u53ef\u884c**\u7684\u201c\u6700\u5c0f\u53ef\u884c\u5b66\u4e60\u8ba1\u5212\u201d\uff08MVP\uff09\uff0c\u4f8b\u5982\u6bcf\u5468\u53ea\u805a\u7126\u638c\u63e11\u4e2a\u6838\u5fc3\u5de5\u5177\u6216\u5b8c\u62101\u4e2a\u5fae\u4efb\u52a1\u3002\n    2.  **\u8c03\u6574\u9884\u671f**\uff1a\u660e\u786e\u544a\u77e5\uff0c\u5728\u5176\u5f53\u524d\u5de5\u4f5c\u5f3a\u5ea6\u4e0b\uff0c**\u4ee5\u201c\u63a5\u5546\u5355\u201d\u4e3a\u77ed\u671f\u76ee\u6807\u4e0d\u73b0\u5b9e**\u3002\u5c06\u5b66\u4e60\u76ee\u6807\u8c03\u6574\u4e3a\u201c\u957f\u671f\u6280\u80fd\u50a8\u5907\u201d\u548c\u201c\u788e\u7247\u5316\u719f\u6089\u6d41\u7a0b\u201d\uff0c\u964d\u4f4e\u5176\u7126\u8651\u548c\u632b\u8d25\u611f\u3002\n    3.  **\u8d44\u6e90\u9002\u914d**\uff1a\u5f15\u5bfc\u5176\u4f18\u5148\u5b66\u4e60\u5f55\u64ad\u8bfe\u3001\u5229\u7528\u56de\u653e\uff0c\u653e\u5f03\u5fc5\u987b\u5b9e\u65f6\u53c2\u4e0e\u7684\u90e8\u5206\u3002\u63d0\u4f9b**\u9ad8\u5ea6\u7ed3\u6784\u5316\u7684\u81ea\u5b66\u8def\u5f84\u56fe**\u548c**\u5e38\u89c1\u95ee\u9898FAQ\u6587\u6863**\uff0c\u51cf\u5c11\u5176\u56e0\u63d0\u95ee\u7b49\u5f85\u6d88\u8017\u7684\u7cbe\u529b\u3002\n    4.  **\u98ce\u9669\u63d0\u793a**\uff1a\u5bf9\u4e8e\u5df2\u62a5\u540d\u7684\u6f2b\u5267\u8425\uff0c\u9700\u660e\u786e\u544a\u77e5\u8bfe\u7a0b\u5f3a\u5ea6\uff0c\u5e76**\u63a2\u8ba8\u5ef6\u671f\u5b66\u4e60\u7684\u53ef\u80fd\u6027**\uff0c\u907f\u514d\u56e0\u65e0\u6cd5\u8ddf\u8fdb\u5bfc\u81f4\u94b1\u6b3e\u635f\u5931\u548c\u8d1f\u9762\u4f53\u9a8c\u3002\n    5.  **\u957f\u671f\u7ef4\u7cfb**\uff1a\u5c06\u5176\u5217\u4e3a\u201c\u9ad8\u5173\u6000\u3001\u4f4e\u9884\u671f\u201d\u7528\u6237\uff0c\u5b9a\u671f\uff08\u5982\u6bcf\u4e24\u5468\uff09\u8f7b\u91cf\u8ddf\u8fdb\uff0c\u5173\u6ce8\u5176\u72b6\u6001\u53d8\u5316\uff0c\u5728\u5176\u65f6\u95f4\u5141\u8bb8\u65f6\u63d0\u4f9b\u652f\u6301\uff0c\u6838\u5fc3\u76ee\u6807\u662f\u7ef4\u6301\u5b66\u4e60\u706b\u79cd\u4e0d\u706d\uff0c\u800c\u975e\u5f3a\u6c42\u8bfe\u7a0b\u8fdb\u5ea6\u3002\n\n{\"core_type\": \"T5 \u65f6\u95f4\u532e\u4e4f\u7684\u52a1\u5b9e\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u7d27\u6025\u8fdb\u884c\u65f6\u95f4\u4e0e\u76ee\u6807\u6821\u51c6\u8bbf\u8c08\"}";
