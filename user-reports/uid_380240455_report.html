    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 380240455 (\u6635\u79f0\uff1a\u6768\u80dc\u516d) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5c0f\u73891 / \u9648\u9648\u73ed\u73ed (\u7eaa\u6587\u7389) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u9a6c\u62c9\u96c5\u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u672a\u77e5** (\u8bb0\u5f55\u4e2d\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c**\u9700\u91cd\u70b9\u6838\u67e5\u662f\u5426\u5b58\u5728\u501f\u8d37/\u5206\u671f\u98ce\u9669**) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u6446\u5730\u644a\uff0c\u53ef\u6324\u51fa3-5\u5c0f\u65f6/\u5929\uff0c\u8fb9\u5356\u714e\u997c\u8fb9\u542c\u8bfe) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u672a\u77e5** (\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\uff0c**\u9700\u6838\u67e5**) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** (\u63d0\u4f9b\u4e86\u5e74\u9f84\u3001\u804c\u4e1a\u3001\u57ce\u5e02\u3001\u5b66\u4e60\u52a8\u673a\u3001\u65f6\u95f4\u7b49\u5173\u952e\u4fe1\u606f) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e\uff0c\u4f46\u6df7\u6742\u5174\u8da3\u9a71\u52a8**\u3002\u660e\u786e\u8868\u793a\u201c\u8d5a\u7c73+\u5174\u8da3\u201d\uff0c\u5bf9\u201c\u53d8\u73b0\u6e20\u9053\u201d\u3001\u201c\u7b2c\u4e00\u6876\u91d1\u201d\u3001\u201c\u8eab\u517c\u6570\u804c\u201d\u7b49\u8bdd\u9898\u9ad8\u5ea6\u5173\u6ce8\uff0c\u4f46\u540c\u65f6\u4e5f\u8868\u73b0\u51fa\u5bf9\u5b66\u4e60\u672c\u8eab\u7684\u597d\u5947\u548c\u8fdb\u6b65\u540e\u7684\u6210\u5c31\u611f\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n    > \u201c\u8d5a\u7c73+\u5174\u8da3\u201d\n    > \u201c\u8eab\u517c\u6570\u804c\u201d\n    > \u201c1. \u5b66\u5458\u771f\u5b9e\u4e2d\u4e66\u7387\u591a\u5c11\uff1f\u65b0\u4eba\u5e73\u5747\u8bd5\u97f3\u591a\u5c11\u6b21\u624d\u80fd\u4e2d\u7b2c\u4e00\u5355\uff1f 2. \u4e13\u5c5e\u5355\u5b50\u4fdd\u5e95\u6709\u5417\uff1f\u80fd\u4e0d\u80fd\u4fdd\u8bc1\u6bcf\u6708\u81f3\u5c11\u51e0\u5355\uff1f\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e (3-4\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u804c\u4e1a\u4e3a\u201c\u6446\u5730\u644a\u5356\u714e\u997c\u679c\u5b50\u201d\uff0c\u5c5e\u4e8e\u5c0f\u672c\u7ecf\u8425\uff0c\u6297\u98ce\u9669\u80fd\u529b\u5f31\uff0c\u5bf9\u8d44\u91d1\u6295\u5165\u654f\u611f\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u81ea\u79f0\u6bcf\u5929\u67093-5\u5c0f\u65f6\u53ef\u7528\u4e8e\u5b66\u4e60\uff0c\u65f6\u95f4\u76f8\u5bf9\u53ef\u63a7\uff0c\u4f46\u9700\u5728\u6446\u644a\u95f4\u9699\u8fdb\u884c\uff0c\u5c5e\u4e8e**\u788e\u7247\u5316\u62fc\u51d1**\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u672a\u77e5** \u2014 \u672a\u63d0\u53ca\uff0c\u9700\u6838\u67e5\u3002\u4f4643\u5c81\u7537\u6027\uff0c\u804c\u4e1a\u4e3a\u4e2a\u4f53\u6237\uff0c\u5bb6\u5ead\u7ecf\u6d4e\u538b\u529b\u53ef\u80fd\u8f83\u5927\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8 (7-8\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3**\u3002\u9762\u5bf9Pia\u620f\u5b9e\u6218\u4e2d\u201c\u7533\u8bf7\u4e0d\u901a\u8fc7\u201d\u3001\u201c\u611f\u89c9\u662f\u7a7a\u6c14\u201d\u7684\u793e\u4ea4\u51b7\u9047\uff0c\u4ec5\u5ba2\u89c2\u9648\u8ff0\uff0c\u672a\u8868\u73b0\u51fa\u6cae\u4e27\u6216\u62b1\u6028\u3002\u4e3b\u52a8\u8bf7\u6559\u201c\u57fa\u672c\u529f\u4ece\u54ea\u91cc\u5f00\u59cb\u7ec3\u4e60\u201d\uff0c\u8868\u73b0\u51fa\u79ef\u6781\u89e3\u51b3\u95ee\u9898\u7684\u6001\u5ea6\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n    > \u201c\u6211\u5728\u76f4\u64ad\u95f4\uff0c\u8001\u5e08\u597d\u50cf\u770b\u4e0d\u89c1\u6211...\u7533\u8bf7\u4e5f\u4e0d\u901a\u8fc7...\u6211\u5728\u91cc\u9762\u611f\u89c9\u662f\u7a7a\u6c14...\u53ef\u80fd\u662f\u5427\u201d (\u5ba2\u89c2\u9648\u8ff0\uff0c\u65e0\u60c5\u7eea\u5ba3\u6cc4)\n    > \u201c\u7ec3\u5f97\u4e71\u4e03\u516b\u7cdf\u7684\uff0c\u662f\u6309\u4f60\u53d1\u7684\u89c6\u9891\u987a\u5e8f\u7ec3\u4e60\u5462\uff1f\u8fd8\u662f\u6309\u4f60\u53d1\u7684\u65b0\u4eba\u57fa\u672c\u529f\u6587\u5b57\u7684\u7ec3\u4e60\uff1f\u201d (\u9047\u5230\u56f0\u60d1\uff0c\u4e3b\u52a8\u5bfb\u6c42\u6e05\u6670\u6307\u5f15)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 (\u7126\u8651\u4fdd\u969c) \u4e3a\u4e3b\uff0c\u517c\u6709\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42 (\u5c0a\u91cd\u5f52\u5c5e)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u6536\u5165\u4e0d\u7a33\u5b9a\u548c\u672a\u6765\u4fdd\u969c\u7684\u6df1\u5c42\u7126\u8651**\u3002\u4f5c\u4e3a43\u5c81\u6446\u5730\u644a\u7684\u4e2a\u4f53\u6237\uff0c\u4ed6\u5bfb\u6c42\u7684\u4e0d\u4ec5\u662f\u4e00\u4efd\u517c\u804c\u6536\u5165\uff0c\u66f4\u662f\u4e00\u4e2a\u80fd\u5e26\u6765\u7a33\u5b9a\u611f\u548c\u804c\u4e1a\u5c0a\u4e25\u7684\u201c\u7b2c\u4e8c\u66f2\u7ebf\u201d\uff0c\u4ee5\u62b5\u5fa1\u4e3b\u4e1a\uff08\u6446\u644a\uff09\u7684\u4e0d\u786e\u5b9a\u6027\u98ce\u9669\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u4e13\u4e1a\u4f53\u7cfb\u63a5\u7eb3\u5e76\u770b\u5230\u660e\u786e\u4e0a\u5347\u8def\u5f84\u201d\u7684\u5b89\u5168\u611f\u4e0e\u5e0c\u671b**\u3002\u4ed6\u9700\u8981\u88ab\u80af\u5b9a\u201c\u6709\u5851\u9020\u6027\u201d\u3001\u201c\u53ef\u5851\u6027\u5f88\u5f3a\u201d\uff0c\u5e76\u770b\u5230\u6e05\u6670\u7684\u63a5\u5355\u3001\u53d8\u73b0\u8def\u5f84\u56fe\uff0c\u4ee5\u5bf9\u51b2\u73b0\u5b9e\u751f\u6d3b\u4e2d\u7684\u7ecf\u6d4e\u538b\u529b\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2 \u98ce\u9669\u7ba1\u63a7\u578b** (\u52a8\u673a\u4e2d\u7b49\u4f46\u8d44\u6e90\u5e95\u5ea7\u8584\u5f31\uff0c\u5b58\u5728\u53d8\u73b0\u7126\u8651) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u8bba (\u52a1\u5b9e\u53d8\u73b0\u9a71\u52a8\u578b)** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 **\u5b89\u5168\u672a\u89e6\u53d1** (\u672a\u53d1\u73b0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u8a00\u8bba)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u3002\u4f46**\u652f\u4ed8\u65b9\u5f0f\u672a\u77e5\uff0c\u662f\u6700\u5927\u98ce\u9669\u70b9**\uff0c\u5fc5\u987b\u5728\u8f6c\u5316\u524d\u5b8c\u6210\u652f\u4ed8\u6838\u67e5\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u82e5\u62a5\u540d\u8d39\u7528\u5360\u5bb6\u5ead\u652f\u51fa\u6bd4\u4f8b\u8fc7\u9ad8\uff0c\u53ef\u80fd\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u65f6\u95f4\u76f8\u5bf9\u53ef\u63a7\uff0c\u4e14\u6709\u4e3b\u52a8\u5b66\u4e60\u610f\u613f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u81ea\u6211\u6d88\u5316\u632b\u6298\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669\uff01** \u82e5\u5728\u627f\u8bfa\u7684\u201c\u8fb9\u5b66\u8fb9\u63a5\u5355\u201d\u5468\u671f\u5185\uff08\u59822-3\u4e2a\u6708\uff09\u672a\u80fd\u83b7\u5f97\u5b9e\u8d28\u6027\u6536\u5165\uff0c\u6216\u63a5\u5355\u9891\u7387/\u6536\u5165\u8fdc\u4f4e\u4e8e\u9884\u671f\uff0c\u6781\u6613\u56e0\u201c\u6295\u5165\u4ea7\u51fa\u6bd4\u5931\u8861\u201d\u800c\u66b4\u6012\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-3\u4e2a\u6708**\uff0c\u5373\u8fdb\u5165\u627f\u8bfa\u7684\u201c\u8bd5\u97f3\u63a5\u5355\u671f\u201d\u4f46\u5c61\u8bd5\u4e0d\u4e2d\u6216\u6536\u5165\u5fae\u8584\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6768\u54e5\uff0c\u770b\u5230\u4f60\u4e00\u8fb9\u987e\u7740\u644a\u5b50\u4e00\u8fb9\u8fd9\u4e48\u8ba4\u771f\u5b66\uff0c\u771f\u7684\u4f69\u670d\u3002\u54b1\u4eec\u8fd9\u884c\uff0c\u524d\u671f\u5c31\u50cf\u5b66\u624b\u827a\uff0c\u5f97\u628a\u57fa\u672c\u529f\u6253\u624e\u5b9e\u4e86\u624d\u80fd\u63a5\u597d\u6d3b\u513f\u3002\u4f60\u653e\u5fc3\uff0c\u6211\u4f1a\u5e2e\u4f60\u76ef\u7740\uff0c\u6709\u5408\u9002\u7684\u5355\u5b50\u7b2c\u4e00\u65f6\u95f4\u63a8\u7ed9\u4f60\u3002\u54b1\u4eec\u4e0d\u56fe\u5feb\uff0c\u56fe\u7684\u662f\u7a33\u5f53\u957f\u8fdc\uff0c\u628a\u8fd9\u95e8\u624b\u827a\u53d8\u6210\u4f60\u4e00\u4e2a\u53ef\u9760\u7684\u2018\u526f\u4e1a\u5907\u80ce\u2019\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5fc5\u987b\u5bf9\u63a5\u771f\u5b9e\u3001\u660e\u786e\u7684\u53d8\u73b0\u8def\u5f84\uff0c\u8bfe\u7a0b\u5185\u5bb9\u9700\u9ad8\u5ea6\u5b9e\u7528\uff0c\u805a\u7126\u4e8e\u80fd\u5feb\u901f\u4e0a\u624b\u7684\u201c\u65f6\u85aa\u4e66\u201d\u548c\u201c\u659c\u6760\u5de5\u79cd\u201d\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T4\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u7cbe\u786e\u6d3e\u5355\u62e6\u622a\u4e0e\u9884\u671f\u7ba1\u7406\u5305\u3011**\u3002\u73ed\u4e3b\u4efb\u9700\u4e3b\u52a8\u7ba1\u7406\u5176\u53d8\u73b0\u9884\u671f\uff0c\u660e\u786e\u544a\u77e5\u884c\u4e1a\u5e73\u5747\u8bd5\u97f3\u6210\u529f\u7387\u3001\u65b0\u4eba\u6210\u957f\u5468\u671f\uff0c\u5e76\u7cbe\u51c6\u5339\u914d\u4e0e\u5176\u5f53\u524d\u80fd\u529b\u76f8\u7b26\u7684\u8bd5\u97f3\u673a\u4f1a\uff0c\u675c\u7edd\u4e0d\u5207\u5b9e\u9645\u7684\u5e7b\u60f3\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u5176\u4f7f\u7528\u201c\u8f7b\u677e\u6708\u5165\u8fc7\u4e07\u201d\u3001\u201c\u4fdd\u5e95\u63a5\u5355\u201d\u7b49\u8fc7\u5ea6\u627f\u8bfa\u8bdd\u672f**\u3002\n    2. **\u7981\u6b62\u5728\u5176\u57fa\u7840\u4e0d\u7262\u65f6\uff0c\u76f2\u76ee\u63a8\u9500\u9ad8\u4ef7\u8bbe\u5907\u6216\u9ad8\u9636\u8bfe\u7a0b**\u3002\n    3. **\u907f\u514d\u7a7a\u6d1e\u7684\u201c\u52a0\u6cb9\u201d\u9f13\u52b1\uff0c\u9700\u63d0\u4f9b\u5177\u4f53\u3001\u53ef\u6267\u884c\u7684\u6539\u8fdb\u5efa\u8bae\u548c\u8d44\u6e90**\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u524d\u671f\u4e25\u7981\u5927\u989d\u5347\u5355**\u3002\u53ef\u8003\u8651\u5728**\u5176\u6210\u529f\u63a5\u5230\u7b2c\u4e00\u5355\u5e76\u83b7\u5f97\u7a33\u5b9a\u6536\u5165\u540e**\uff0c\u518d\u57fa\u4e8e\u5176\u5b9e\u9645\u9700\u6c42\uff08\u5982\u8bbe\u5907\u5347\u7ea7\u3001\u540e\u671f\u6280\u80fd\uff09\u8fdb\u884c\u5c0f\u989d\u3001\u52a1\u5b9e\u7684\u5347\u5355\u63a8\u4ecb\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c[\u5e74\u9f84]\uff1a43\u5c81 [\u804c\u4e1a]: \u6446\u5730\u644a\u5356\u714e\u997c\u679c\u5b50 [\u6765\u8bad\u7ec3\u8425\u60f3\u6536\u83b7\u4ec0\u4e48\uff1f\u8d5a\u7c73/\u5174\u8da3]: \u8d5a\u7c73+\u5174\u8da3\u201d **(\u6838\u5fc3\u52a8\u673a\u4e0e\u8d44\u6e90\u80cc\u666f)**\n2. > \u201c\u4e00\u8fb9\u5356\u714e\u997c\uff0c\u4e00\u8fb9\u542c\u5e08\u59d0\u7684\u8bfe[\u6342\u8138]\u201d **(\u65f6\u95f4\u788e\u7247\u5316\u4e0e\u52a1\u5b9e\u62fc\u640f\u72b6\u6001)**\n3. > \u201c1. \u5b66\u5458\u771f\u5b9e\u4e2d\u4e66\u7387\u591a\u5c11\uff1f\u65b0\u4eba\u5e73\u5747\u8bd5\u97f3\u591a\u5c11\u6b21\u624d\u80fd\u4e2d\u7b2c\u4e00\u5355\uff1f 2. \u4e13\u5c5e\u5355\u5b50\u4fdd\u5e95\u6709\u5417\uff1f\u80fd\u4e0d\u80fd\u4fdd\u8bc1\u6bcf\u6708\u81f3\u5c11\u51e0\u5355\uff1f\u201d **(\u5178\u578b\u7684T4\u641e\u94b1\u7ed3\u679c\u8bba\u4e09\u8fde\u95ee\uff0c\u66b4\u9732\u6838\u5fc3\u7126\u8651\u70b9)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4 \u641e\u94b1\u7ed3\u679c\u8bba\uff08\u52a1\u5b9e\u53d8\u73b0\u9a71\u52a8\u578b\uff09\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e00\u4efd\u80fd\u62b5\u5fa1\u6446\u644a\u6536\u5165\u6ce2\u52a8\u7684\u7a33\u5b9a\u526f\u4e1a\u4fdd\u969c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u4e25\u683c\u6267\u884c\u9006\u5411\u9884\u671f\u7ba1\u7406 + \u7cbe\u786e\u6d3e\u5355\uff0c\u7528\u201c\u771f\u5b9e\u3001\u53ef\u63a7\u201d\u7684\u63a5\u5355\u8def\u5f84\u66ff\u4ee3\u201c\u66b4\u5bcc\u201d\u5e7b\u60f3\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u8bba\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\", \"age\": \"43\u5c81\", \"gender\": \"\u7537\", \"city\": \"\u8d35\u5dde\u94dc\u4ec1\"}\n```";
