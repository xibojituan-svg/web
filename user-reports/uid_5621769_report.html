    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49)**\n    *   **\u5b66\u4e60\u9a71\u52a8**\uff1a\u7528\u6237\u4e3b\u52a8\u5b8c\u6210\u4f5c\u4e1a\uff0c\u5e76\u5bf9AI\u751f\u6210\u5185\u5bb9\u7684\u8d28\u91cf\uff08\u60c5\u8282\u903b\u8f91\u4e0d\u901a\uff09\u63d0\u51fa\u5177\u4f53\u89c2\u5bdf\uff0c\u663e\u793a\u51fa\u5bf9\u5199\u4f5c\u6280\u5de7\u7684\u771f\u5b9e\u6c42\u77e5\u6b32\u3002\n    *   **\u53d8\u73b0\u9a71\u52a8**\uff1a\u660e\u786e\u8be2\u95ee\u201c\u53d8\u73b0\u7684\u6e20\u9053\u201d\u3001\u201c\u8bfe\u7a0b\u4ef7\u683c\u201d\u3001\u201c\u7b7e\u7ea6MCN\u201d\u7b49\u5546\u4e1a\u5316\u95ee\u9898\uff0c\u5bf9\u6295\u5165\u4ea7\u51fa\u6bd4\u654f\u611f\u3002\n    *   **\u793e\u4ea4\u63a8\u8350**\uff1a\u901a\u8fc7\u201c\u5251\u732a\u54e5\u54e5\u201d\u63a8\u8350\u800c\u6765\uff0c\u6709\u4e00\u5b9a\u4fe1\u4efb\u57fa\u7840\uff0c\u4f46\u975e\u76f2\u76ee\u8ddf\u4ece\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d\u7b49)**\n    *   **\u65f6\u95f4\u8d44\u6e90**\uff1a\u81ea\u79f0\u201c\u767d\u5929\u7684\u65f6\u95f4\u6bd4\u8f83\u5fd9\uff0c\u90fd\u662f\u665a\u4e0a\u6709\u65f6\u95f4\u201d\uff0c\u5468\u672b\u4e0b\u5348\u4e5f\u53ef\u80fd\u6709\u51b2\u7a81\u3002\u8868\u660e\u6709\u4e3b\u4e1a\uff0c\u5b66\u4e60\u65f6\u95f4\u6709\u9650\uff0c\u4f9d\u8d56\u8bfe\u7a0b\u56de\u653e\u529f\u80fd\u3002\n    *   **\u7ecf\u6d4e\u8d44\u6e90**\uff1a\u5bf9\u4ef7\u683c\u654f\u611f\uff0c\u4e3b\u52a8\u8be2\u95ee\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u652f\u4ed8\u56f0\u96be\u3002\u9884\u7b97\u201c\u6ca1\u6709\u6982\u5ff5\u201d\uff0c\u5904\u4e8e\u89c2\u671b\u8bc4\u4f30\u9636\u6bb5\u3002\n    *   **\u8ba4\u77e5\u8d44\u6e90**\uff1a\u80fd\u7406\u89e3AI\u5199\u4f5c\u201c\u6838\u5fc3\u8fd8\u662f\u5199\u6545\u4e8b\u7684\u4eba\u201d\uff0c\u5177\u5907\u57fa\u7840\u8ba4\u77e5\u548c\u6279\u5224\u6027\u601d\u7ef4\uff0c\u5b66\u4e60\u80fd\u529b\u5c1a\u53ef\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u7b49\u504f\u9ad8)**\n    *   **\u4e92\u52a8\u914d\u5408\u5ea6**\uff1a\u5bf9\u9500\u552e\uff08\u5e08\u59d0\uff09\u7684\u6307\u5bfc\u3001\u50ac\u4fc3\u3001\u7fa4\u5185\u4e92\u52a8\u8981\u6c42\u5747\u80fd\u53ca\u65f6\u3001\u793c\u8c8c\u56de\u5e94\uff08\u201c\u597d\u7684\ud83d\udc4c\ud83c\udffb\u201d\u3001\u201c\u611f\u8c22\u5e08\u59d0\u201d\uff09\uff0c\u914d\u5408\u5ea6\u9ad8\u3002\n    *   **\u51b3\u7b56\u72ec\u7acb\u6027**\uff1a\u4f1a\u4e3b\u52a8\u3001\u7ec6\u81f4\u5730\u8be2\u95ee\u8bfe\u7a0b\u5b89\u6392\u3001\u5e08\u8d44\u3001\u540e\u7eed\u8d44\u6e90\u3001\u73ed\u4e3b\u4efb\u5f52\u5c5e\u7b49\u5173\u952e\u95ee\u9898\uff0c**\u51b3\u7b56\u8f83\u4e3a\u7406\u6027\uff0c\u4e0d\u51b2\u52a8**\u3002\n    *   **\u98ce\u9669\u610f\u8bc6**\uff1a\u5173\u6ce8\u8bfe\u7a0b\u7ed3\u675f\u540e\u7684\u8d44\u6e90\u6301\u7eed\u6027\uff0c\u5bf9\u201c\u5185\u63a8\u7801\u201d\u7b49\u6743\u76ca\u6709\u6e05\u6670\u8ba4\u77e5\u9700\u6c42\uff0c\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u8c28\u614e\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u7528\u6237\u63d0\u53ca\u4ef7\u683c\u201c4380\u201d\uff0c\u4f46\u804a\u5929\u8bb0\u5f55\u672a\u663e\u793a\u6700\u7ec8\u652f\u4ed8\u884c\u4e3a\u3002\u9500\u552e\u5728\u50ac\u4fc3\u62a5\u540d\u3002**\u652f\u4ed8\u72b6\u6001\u5f85\u786e\u8ba4**\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u8bb0\u5f55\u4e2d\u672a\u6d89\u53ca\u914d\u5076\u3001\u7236\u6bcd\u7b49\u5bb6\u5ead\u51b3\u7b56\u8005\u4fe1\u606f\uff0c\u7528\u6237\u8868\u73b0\u4e3a\u72ec\u7acb\u51b3\u7b56\u4e2a\u4f53\u3002\n*   **\u6b65\u9aa41-4\u7efc\u5408\u5224\u5b9a**\uff1a\n    *   **A (\u8ba4\u77e5\u4e0e\u610f\u613f)**\uff1a**\u5f3a**\u3002\u6709\u660e\u786e\u5b66\u4e60\u610f\u613f\uff0c\u5b8c\u6210\u4f5c\u4e1a\u5e76\u601d\u8003\uff0c\u4e3b\u52a8\u8be2\u95ee\u8bfe\u7a0b\u7ec6\u8282\u3002\n    *   **B (\u8d44\u6e90\u4e0e\u6761\u4ef6)**\uff1a**\u4e2d**\u3002\u6709\u65f6\u95f4\u9650\u5236\uff0c\u4f46\u53ef\u901a\u8fc7\u56de\u653e\u89e3\u51b3\uff1b\u7ecf\u6d4e\u4e0a\u672a\u9732\u602f\uff0c\u5904\u4e8e\u4ef7\u503c\u8bc4\u4f30\u671f\u3002\n    *   **C (\u51b3\u7b56\u4e0e\u884c\u52a8)**\uff1a**\u4e2d**\u3002\u51b3\u7b56\u7406\u6027\uff0c\u4fe1\u606f\u6536\u96c6\u5145\u5206\uff0c\u4f46\u884c\u52a8\uff08\u652f\u4ed8\uff09\u6ede\u540e\uff0c\u9700\u4e34\u95e8\u4e00\u811a\u3002\n    *   **D (\u98ce\u9669\u4e0e\u627f\u8bfa)**\uff1a**\u4e2d\u4f4e**\u3002\u672a\u8868\u73b0\u51fa\u9ad8\u627f\u8bfa\u6216\u60c5\u7eea\u5316\u7ed1\u5b9a\uff0c\u5173\u6ce8\u70b9\u5728\u4e8e\u8bfe\u7a0b\u4ef7\u503c\u4e0e\u957f\u671f\u6743\u76ca\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**\uff1a**B+\u578b (\u9ad8\u610f\u613f\u3001\u4e2d\u8d44\u6e90\u3001\u7406\u6027\u51b3\u7b56\u578b)**\u3002\u7528\u6237\u4ef7\u503c\u5224\u65ad\u6e05\u6670\uff0c\u9700\u8981\u5f3a\u6709\u529b\u7684\u4ef7\u503c\u8bc1\u660e\u548c\u4f4e\u98ce\u9669\u627f\u8bfa\u6765\u4fc3\u6210\u6700\u7ec8\u8f6c\u5316\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b\uff1aT4 \u7cbe\u660e\u52a1\u5b9e\u578b**\n    *   **\u7279\u5f81**\uff1a\u76ee\u6807\u660e\u786e\uff08\u5b66\u6280\u80fd\u3001\u8981\u53d8\u73b0\uff09\uff0c\u51b3\u7b56\u7406\u6027\uff0c\u5173\u6ce8\u6295\u5165\u4ea7\u51fa\u6bd4\u3001\u8bfe\u7a0b\u5177\u4f53\u5185\u5bb9\u3001\u5e08\u8d44\u529b\u91cf\u53ca\u540e\u7eed\u8d44\u6e90\u652f\u6301\u3002\u5bf9\u9500\u552e\u8bdd\u672f\u6709\u514d\u75ab\u529b\uff0c\u9700\u8981\u770b\u5230\u201c\u5b9e\u6253\u5b9e\u201d\u7684\u4ef7\u503c\u548c\u8def\u5f84\u3002\u7528\u6237\u53cd\u590d\u786e\u8ba4\u8bfe\u7a0b\u5b89\u6392\u3001\u5e08\u8d44\u3001\u73ed\u4e3b\u4efb\u5f52\u5c5e\u3001\u8bfe\u540e\u8d44\u6e90\uff0c\u5b8c\u5168\u7b26\u5408\u6b64\u7c7b\u578b\u7279\u5f81\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669\u7b49\u7ea7\uff1a\u4e2d**\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5bf9AI\u5199\u4f5c\u6709\u57fa\u7840\u8ba4\u77e5\uff0c\u77e5\u9053\u201c\u9700\u8981\u4fee\u6539\u201d\uff0c\u9884\u671f\u76f8\u5bf9\u7406\u6027\u3002\u4f46\u82e5\u8bfe\u7a0b\u65e0\u6cd5\u63d0\u4f9b\u5176\u671f\u5f85\u7684\u201c\u53bb\u9664AI\u5473\u201d\u3001\u201c\u6295\u7a3f\u5b9e\u6218\u6307\u5bfc\u201d\u7b49\u8fdb\u9636\u4ef7\u503c\uff0c\u6613\u5f15\u53d1\u5931\u671b\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u4f4e\u98ce\u9669**\u3002\u672a\u8868\u9732\u652f\u4ed8\u538b\u529b\uff0c\u66f4\u591a\u662f\u5728\u6743\u8861\u4ef7\u683c\u4e0e\u4ef7\u503c\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u4e2d\u98ce\u9669**\u3002**\u7528\u6237\u660e\u786e\u8868\u793a\u767d\u5929\u5fd9\u3001\u5468\u672b\u4e0b\u5348\u53ef\u80fd\u51b2\u7a81**\uff0c\u9ad8\u5ea6\u4f9d\u8d56\u56de\u653e\u3002\u82e5\u8bfe\u7a0b\u4e92\u52a8\u3001\u76f4\u64ad\u70b9\u8bc4\u7b49\u6838\u5fc3\u4ef7\u503c\u56e0\u65e0\u6cd5\u53c2\u4e0e\u76f4\u64ad\u800c\u5927\u6253\u6298\u6263\uff0c\u53ef\u80fd\u6210\u4e3a\u9000\u8d39\u7406\u7531\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u4f4e\u98ce\u9669**\u3002\u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u672a\u4f53\u73b0\u3002\n    5.  **\u9500\u552e\u5938\u5927\u5ba3\u4f20**\uff1a**\u4e2d\u98ce\u9669**\u3002\u9500\u552e\u63d0\u53ca\u201c\u526f\u4e1a\u8d85\u8fc7\u4e3b\u4e1a\u201d\u3001\u201c\u5b66\u4e60\u671f\u95f4\u8d5a\u56de\u5b66\u8d39\u201d\u7b49\u6536\u76ca\u627f\u8bfa\uff0c**\u7528\u6237\u82e5\u540e\u671f\u65e0\u6cd5\u5b9e\u73b0\uff0c\u6613\u4ea7\u751f\u88ab\u8bef\u5bfc\u611f**\u3002\u7528\u6237\u5173\u6ce8\u201c\u7b7e\u7ea6MCN\u662f\u5b66\u5b8c\u8bfe\u7a0b\u540e\u5b66\u5458\u548c\u673a\u6784\u81ea\u5df1\u7684\u884c\u4e3a\u4e86\u662f\u5427\u201d\uff0c\u8868\u660e\u5bf9\u6743\u8d23\u8fb9\u754c\u654f\u611f\u3002\n    6.  **\u670d\u52a1\u4f53\u9a8c\u5dee**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5173\u6ce8\u73ed\u4e3b\u4efb\u66f4\u6362\u95ee\u9898\uff0c\u8868\u660e\u5728\u610f\u670d\u52a1\u8fde\u8d2f\u6027\u3002\u82e5\u6b63\u5f0f\u8bfe\u670d\u52a1\u4e0e\u4f53\u9a8c\u8bfe\u843d\u5dee\u5927\uff0c\u53ef\u80fd\u5f15\u53d1\u4e0d\u6ee1\u3002\n    7.  **\u7ade\u54c1\u6bd4\u8f83**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7406\u6027\u51b3\u7b56\u8005\u901a\u5e38\u4f1a\u591a\u65b9\u6bd4\u8f83\uff0c\u82e5\u53d1\u73b0\u66f4\u5177\u6027\u4ef7\u6bd4\u7684\u7ade\u54c1\uff0c\u53ef\u80fd\u52a8\u6447\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5408\u89c4\u70b9**\uff1a\u9500\u552e\u8be6\u7ec6\u4ecb\u7ecd\u4e86\u8bfe\u7a0b\u7ed3\u6784\u3001\u5e08\u8d44\u3001\u670d\u52a1\u6a21\u5f0f\uff0c\u5bf9\u7528\u6237\u95ee\u9898\u56de\u5e94\u57fa\u672c\u5230\u4f4d\u3002\n*   **\u98ce\u9669\u70b9**\uff1a\n    *   **\u3010\u8fc7\u5ea6\u627f\u8bfa\u98ce\u9669\u3011**\uff1a\u9500\u552e\u4f7f\u7528\u201c\u526f\u4e1a\u8d85\u8fc7\u4e3b\u4e1a\u201d\u3001\u201c\u5b66\u4e60\u671f\u95f4\u5c31\u628a\u5b66\u8d39\u56de\u6765\u4e86\u201d\u7b49\u4e2a\u4eba\u6848\u4f8b\u8fdb\u884c\u6536\u76ca\u8bf1\u5bfc\uff0c**\u5b58\u5728\u5938\u5927\u5ba3\u4f20\u98ce\u9669**\u3002\n    *   **\u3010\u6a21\u7cca\u6743\u8d23\u8fb9\u754c\u3011**\uff1a\u5bf9\u201c\u5185\u63a8\u7801\u201d\u7b49\u8d44\u6e90\u7684\u89e3\u91ca\uff08\u201c\u65b0\u624b\u4fdd\u62a4\u201d\uff09\u53ef\u80fd\u8ba9\u7528\u6237\u8bef\u4ee5\u4e3a\u6c38\u4e45\u6743\u76ca\uff0c\u9700\u660e\u786e\u5176\u4e3a\u5b66\u4e60\u671f\u5185\u7684\u670d\u52a1\u3002\n    *   **\u3010\u652f\u4ed8\u50ac\u4fc3\u3011**\uff1a\u5728\u7528\u6237\u672a\u660e\u786e\u8868\u8fbe\u652f\u4ed8\u610f\u5411\u524d\uff0c\u4f7f\u7528\u201c\u4fdd\u62a4\u201d\u3001\u201c\u968f\u65f6\u9000\u8d39\u201d\u7b49\u8bdd\u672f\u65bd\u538b\uff0c\u867d\u4e3a\u5e38\u89c1\u7b56\u7565\uff0c\u4f46\u9700\u6ce8\u610f\u5206\u5bf8\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6838\u5fc3\u7b56\u7565**\uff1a**\u4ef7\u503c\u5f3a\u5316\u4e0e\u98ce\u9669\u6d88\u9664**\u3002\u9488\u5bf9T4\u7cbe\u660e\u52a1\u5b9e\u578b\u7528\u6237\uff0c\u9700\u63d0\u4f9b\u8d85\u9884\u671f\u7684\u786e\u5b9a\u6027\u3002\n*   **\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9996\u901a\u7535\u8bdd\u91cd\u70b9**\uff1a\u6b63\u5f0f\u73ed\u4e3b\u4efb\u63a5\u624b\u540e\uff0c\u9996\u901a\u7535\u8bdd\u5e94\u76f4\u63a5\u3001\u4e13\u4e1a\u5730\u56de\u5e94\u5176\u6240\u6709\u5173\u5207\uff1a\u6e05\u6670\u8bf4\u660e\u76f4\u64ad\u4e0e\u56de\u653e\u6743\u76ca\u3001\u5177\u4f53\u670d\u52a1\u6d41\u7a0b\uff08\u5982\u4f55\u6539\u7a3f\u3001\u6295\u7a3f\uff09\u3001\u660e\u786e\u201c\u5185\u63a8\u7801\u201d\u7b49\u8d44\u6e90\u7684\u6709\u6548\u671f\u4e0e\u4f7f\u7528\u89c4\u5219\u3002**\u5efa\u7acb\u4e13\u4e1a\u3001\u9760\u8c31\u7684\u7b2c\u4e00\u5370\u8c61**\u3002\n    2.  **\u5b66\u4e60\u8ba1\u5212\u5b9a\u5236**\uff1a\u9274\u4e8e\u5176\u65f6\u95f4\u7d27\u5f20\uff0c\u4e3b\u52a8\u534f\u52a9\u5236\u5b9a\u4ee5\u201c\u56de\u653e\u5b66\u4e60+\u96c6\u4e2d\u7b54\u7591\u201d\u4e3a\u4e3b\u7684\u5b66\u4e60\u8ba1\u5212\uff0c\u5e76\u5f3a\u8c03\u76f4\u64ad\u4e92\u52a8\uff08\u5982\u4f5c\u4e1a\u70b9\u8bc4\uff09\u7684\u53ef\u56de\u770b\u4ef7\u503c\u3002\n    3.  **\u4ef7\u503c\u53ef\u89c6\u5316**\uff1a\u591a\u63d0\u4f9b\u540c\u7c7b\u578b\uff08\u4e0a\u73ed\u65cf\u3001\u65f6\u95f4\u5c11\uff09\u5b66\u5458\u7684\u6210\u529f\u6848\u4f8b\u3001\u7a3f\u8d39\u622a\u56fe\u3001\u5177\u4f53\u7684\u6539\u7a3f\u524d\u540e\u5bf9\u6bd4\uff0c\u5f3a\u5316\u5176\u201c\u6295\u5165\u5fc5\u6709\u56de\u62a5\u201d\u7684\u8ba4\u77e5\u3002\n    4.  **\u98ce\u9669\u515c\u5e95\u6c9f\u901a**\uff1a\u53ef\u9002\u5f53\u91cd\u7533\u5b66\u4e60\u534f\u8bae\u4e2d\u7684\u9000\u8d39\u6761\u6b3e\uff08\u5982\u6709\uff09\uff0c\u7ed9\u4e88\u7406\u6027\u5b89\u5168\u611f\uff0c\u4f46\u907f\u514d\u8fc7\u5ea6\u8425\u9500\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**\uff1a\n    *   **\u9996\u9009\u6302\u8f7d**\uff1a**\u77ed\u5267\u5267\u672c\u521b\u4f5c\u73ed\uff08\u7528\u6237\u5df2\u8868\u8fbe\u503e\u5411\uff09**\u3002\u8be5\u4ea7\u54c1\u7ebf\u53d8\u73b0\u8def\u5f84\u66f4\u6e05\u6670\uff0c\u53ef\u80fd\u66f4\u7b26\u5408\u5176\u201c\u52a1\u5b9e\u201d\u9700\u6c42\u3002\n    *   **\u5907\u9009\u8bf4\u660e**\uff1a\u82e5\u7528\u6237\u9884\u7b97\u6709\u9650\uff0c\u53ef\u8bf4\u660e\u77ed\u6545\u4e8b\u57fa\u7840\u73ed\u4f5c\u4e3a\u8d77\u70b9\uff0c\u4f46\u9700\u5f3a\u8c03\u8fdb\u9636\u8def\u5f84\u548c\u4e0e\u77ed\u5267\u73ed\u7684\u5dee\u5f02\uff0c\u907f\u514d\u5176\u56e0\u201c\u6ca1\u5b66\u5230\u60f3\u5b66\u7684\u201d\u800c\u5931\u671b\u3002\n\n{\"core_type\": \"T4 \u7cbe\u660e\u52a1\u5b9e\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u77ed\u5267\u5267\u672c\u521b\u4f5c\u73ed\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}";
