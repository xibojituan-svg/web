        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676572013 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-17 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u68b5\u58f0\u58a8\u96ea(\u8d75\u96ea\u9732) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u5f20\u9707\u5b9e\u6218\u73ed5\u671f (\u5df2\u7ed3\u8425)\uff1b\u540e\u671f\u8bfe\u7a0b (\u610f\u5411\u4e2d) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u4f46\u63d0\u53ca\u201c\u8fc7\u5e74\u6709\u70b9\u5b58\u6b3e\u4e86\u60f3\u5148\u5206\u914d\u4e00\u4e0b\u201d\uff0c\u63a8\u6d4b\u4e3a\u81ea\u6709\u8d44\u91d1\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4e2d\u7b49/\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u591a\u6b21\u56e0\u201c\u6f14\u51fa\u201d\u3001\u201c\u8003\u8bd5\u201d\u8bf7\u5047\uff0c\u8868\u660e\u65f6\u95f4\u53d7\u4e3b\u4e1a/\u5b66\u4e1a\u6324\u538b\uff0c\u9700\u62fc\u51d1\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\uff0c\u9ed8\u8ba4\u4e3a\u5355\u8eab\u72ec\u7acb\u6216\u5df2\u62a5\u5907\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u4e92\u52a8\u79ef\u6781\uff0c\u4f46\u6838\u5fc3\u51b3\u7b56\u4fe1\u606f\uff08\u652f\u4ed8\u3001\u5bb6\u5ead\u3001\u6df1\u5c42\u52a8\u673a\uff09\u7f3a\u5931\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u578b\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6280\u80fd\u672c\u8eab\u7684\u5174\u8da3\uff08\u4e3b\u52a8\u8be2\u95eeAU\u8f6f\u4ef6\u3001\u8bbe\u5907\u578b\u53f7\uff09\uff0c\u4f46\u540c\u65f6\u4e5f\u5173\u6ce8\u53d8\u73b0\u8def\u5f84\uff08\u8be2\u95ee\u540e\u671f\u8bfe\u662f\u5426\u9001\u97f3\u6548\uff09\u3002\u672a\u8868\u73b0\u51fa\u5bf9\u6781\u901f\u53d8\u73b0\u7684\u5f3a\u70c8\u6267\u5ff5\uff0c\u4e5f\u672a\u8981\u6c42\u4fdd\u5e95\u627f\u8bfa\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u60f3\u4e86\u60f3\u8fd8\u662f\u60f3\u8bd5\u8bd5\u201d (\u5bf9\u540e\u671f\u8bfe)\uff1b > \u201c\u4e3b\u8981\u662f\u8fc7\u5e74\u6709\u70b9\u5b58\u6b3e\u4e86\u60f3\u5148\u5206\u914d\u4e00\u4e0b\u201d (\u5bf9\u8bbe\u5907\u6295\u5165)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u6709\u5b58\u6b3e\u53ef\u652f\u914d\u7528\u4e8e\u8d2d\u4e70\u8bbe\u5907\uff082000\u5143\u5de6\u53f3\uff09\uff0c\u4f46\u9700\u8981\u201c\u5206\u914d\u201d\uff0c\u975e\u8d22\u52a1\u81ea\u7531\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u4e3b\u4e1a/\u5b66\u4e1a\u7e41\u5fd9\uff08\u6f14\u51fa\u3001\u8003\u8bd5\uff09\uff0c\u591a\u6b21\u8bf7\u5047\uff0c\u4f46\u80fd\u575a\u6301\u5b8c\u6210\u8bfe\u7a0b\u548c\u4f5c\u4e1a\uff0c\u65f6\u95f4\u9700\u201c\u6324\u201d\u51fa\u6765\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u5b9a\u4e2d**\u3002\u672a\u63d0\u53ca\u53cd\u5bf9\u6216\u652f\u6301\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08AU\u5b89\u88c5\uff09\u80fd\u81ea\u884c\u641c\u7d22\u89e3\u51b3\uff0c\u5b89\u88c5\u6210\u529f\u540e\u4e3b\u52a8\u62a5\u559c\u3002\u9762\u5bf9\u65f6\u95f4\u51b2\u7a81\u80fd\u4e3b\u52a8\u6c9f\u901a\u8bf7\u5047\u5e76\u627f\u8bfa\u8865\u8bfe\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u65e0\u62b1\u6028\u6216\u4f9d\u8d56\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5b89\u88c5\u4e0a\u4e86[\u574f\u7b11]\u201d (\u89e3\u51b3\u95ee\u9898\u540e)\uff1b > \u201c\u6709\u4e2a\u8003\u8bd5\u6700\u8fd1...\u4f5c\u4e1a\u53ef\u80fd\u4e5f\u8981\u665a\u70b9...\u4e89\u53d6\u660e\u665a11\u524d\u4ea4[\u6342\u8138]\u201d (\u4e3b\u52a8\u6c9f\u901a\uff0c\u79ef\u6781\u89e3\u51b3)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 (\u8ffd\u6c42\u6210\u5c31\u3001\u8ba4\u53ef\u3001\u4e13\u4e1a\u8eab\u4efd)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u4e13\u4e1a\u6280\u80fd\u7684\u5411\u5f80\u4e0e\u8eab\u4efd\u8ba4\u540c\u7684\u6e34\u671b\u3002\u4ed6\u4e3b\u52a8\u7814\u7a76\u8bbe\u5907\u3001\u8f6f\u4ef6\uff0c\u5e76\u8003\u8651\u6295\u5165\u5b58\u6b3e\u5347\u7ea7\u88c5\u5907\uff0c\u8868\u660e\u4ed6\u4e0d\u4ec5\u60f3\u201c\u5b66\u4f1a\u201d\uff0c\u66f4\u60f3\u201c\u50cf\u4e13\u4e1a\u4eba\u58eb\u4e00\u6837\u201d\u62e5\u6709\u5f97\u4f53\u7684\u5de5\u5177\u548c\u80fd\u529b\uff0c\u4ee5\u83b7\u5f97\u5708\u5185\u8ba4\u53ef\u548c\u81ea\u4fe1\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u8eab\u4efd\u7684\u8d4b\u80fd\u4e0e\u80af\u5b9a**\u3002\u5c06\u4ed6\u89c6\u4e3a\u201c\u51c6\u4e13\u4e1a\u4eba\u58eb\u201d\uff0c\u63d0\u4f9b\u8fdb\u9636\u7684\u6280\u672f\u6307\u5bfc\u3001\u8bbe\u5907\u9009\u8d2d\u5efa\u8bae\uff0c\u5e76\u5bf9\u5176\u5b66\u4e60\u6210\u679c\u7ed9\u4e88\u4e13\u4e1a\u5c42\u9762\u7684\u8ba4\u53ef\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u52a8\u673a\u4e2d\u7b49\u3001\u8d44\u6e90\u4e2d\u7b49\u3001\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3a\u53ef\u57f9\u517b\u7684\u6f5c\u529b\u7528\u6237) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u5173\u6ce8\u786c\u6838\u6280\u80fd\uff0c\u80fd\u514b\u670d\u56f0\u96be\u5b8c\u6210\u4efb\u52a1\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u4e0d\u5f20\u626c\u4f46\u6301\u7eed\u884c\u52a8) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5ead\u51b2\u7a81\u8ff9\u8c61\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u672a\u63d0\u53ca\u5bb6\u5ead\uff0c\u98ce\u9669\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u4e3b\u4e1a/\u5b66\u4e1a\u65f6\u95f4\u51b2\u7a81**\u662f\u6700\u5927\u98ce\u9669\u3002\u82e5\u8bfe\u7a0b\u5f3a\u5ea6\u6301\u7eed\u4e0e\u201c\u6f14\u51fa\u201d\u3001\u201c\u8003\u8bd5\u201d\u51b2\u7a81\uff0c\u53ef\u80fd\u5bfc\u81f4\u4f5c\u4e1a\u79ef\u538b\u3001\u4ea7\u751f\u632b\u8d25\u611f\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u81ea\u884c\u89e3\u51b3\u6280\u672f\u95ee\u9898\uff0c\u60c5\u7eea\u7a33\u5b9a\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u672a\u8868\u73b0\u51fa\u5bf9\u77ed\u671f\u66b4\u5229\u7684\u6e34\u671b\uff0c\u66f4\u5173\u6ce8\u6280\u80fd\u6210\u957f\uff0c\u5bf9\u53d8\u73b0\u6709\u5408\u7406\u9884\u671f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u8bfe\u7a0b\u4e2d\u671f\uff08\u7b2c4-8\u5468\uff09**\uff0c\u5f53\u4e3b\u4e1a\u7e41\u5fd9\u671f\u4e0e\u8bfe\u7a0b\u4f5c\u4e1a\u9ad8\u5cf0\u671f\u91cd\u53e0\u65f6\uff0c\u6613\u56e0\u65f6\u95f4\u65e0\u6cd5\u534f\u8c03\u800c\u4ea7\u751f\u6301\u7eed\u7126\u8651\uff0c\u6700\u7ec8\u53ef\u80fd\u9009\u62e9\u653e\u5f03\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u770b\u5230\u4f60\u4e4b\u524d\u80fd\u81ea\u5df1\u641e\u5b9aAU\u5b89\u88c5\uff0c\u6267\u884c\u529b\u771f\u5f3a\uff01\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u8282\u594f\u7d27\uff0c\u77e5\u9053\u4f60\u5e73\u65f6\u6709\u6f14\u51fa/\u8003\u8bd5\uff0c\u65f6\u95f4\u4e0a\u54b1\u4eec\u7075\u6d3b\u5b89\u6392\uff0c\u6838\u5fc3\u662f\u638c\u63e1\u65b9\u6cd5\u3002\u9047\u5230\u65f6\u95f4\u51b2\u7a81\u968f\u65f6\u8ddf\u6211\u8bf4\uff0c\u54b1\u4eec\u4e00\u8d77\u89c4\u5212\u8865\u8bfe\uff0c\u4fdd\u8bc1\u4f60\u4e0d\u6389\u961f\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176T2\u5b9e\u5e72\u7279\u8d28\uff0c\u63d0\u4f9b\u6e05\u6670\u7684\u6280\u80fd\u8fdb\u9636\u8def\u5f84\u548c\u5b9e\u64cd\u4efb\u52a1\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\u7684\u7279\u70b9\uff0c\u8865\u5145 **\u3010\u5f39\u6027\u65f6\u95f4\u7ba1\u7406\u5305\u3011**\uff08\u5982\u91cd\u70b9\u5185\u5bb9\u6458\u8981\u3001\u53ef\u62c6\u5206\u5b8c\u6210\u7684\u4f5c\u4e1a\u6a21\u5757\uff09\u3002\u9488\u5bf9\u5176\u5c0a\u91cd\u9700\u6c42\uff0c\u8865\u5145 **\u3010\u4e13\u4e1a\u8eab\u4efd\u8ba4\u540c\u5305\u3011**\uff08\u5982\u9080\u8bf7\u53c2\u4e0e\u5185\u90e8\u5ba1\u542c\u3001\u7ed9\u4e88\u201c\u6f5c\u529b\u5b66\u5458\u201d\u79f0\u53f7\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5c06\u5176\u5f53\u4f5c\u201c\u60c5\u7eea\u5de8\u5a74\u201d\u8fc7\u5ea6\u5b89\u629a\uff0c\u6216\u5f53\u4f5c\u201c\u597d\u73a9\u5c1d\u9c9c\u201d\u8005\u53ea\u63d0\u4f9b\u5a31\u4e50\u5185\u5bb9\u3002**\u4e25\u7981\u5ffd\u89c6\u5176\u65f6\u95f4\u56f0\u5883\uff0c\u7528\u50f5\u5316\u7684\u8003\u52e4\u65bd\u538b\u3002**\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u8fdb\u884c**\u5927\u989d\u63a8\u4ecb**\uff0c\u4f46\u5fc5\u987b\u4e0e\u5176\u804c\u4e1a\u89c4\u5212\u3001\u65f6\u95f4\u5b89\u6392\u6df1\u5ea6\u7ed3\u5408\uff0c\u63d0\u4f9b\u6e05\u6670\u7684\u6295\u5165\u4ea7\u51fa\u6bd4\u548c\u7075\u6d3b\u7684\u5b66\u4e60\u65b9\u6848\u3002\u907f\u514d\u63a8\u9500\u7eaf\u201c\u5174\u8da3\u201d\u6216\u201c\u5708\u5c42\u201d\u7c7b\u4ea7\u54c1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u5b89\u88c5\u4e0a\u4e86[\u574f\u7b11]**\u201d \u2014\u2014 \u8bc1\u660e\u9ad8\u5fc3\u7406\u5f39\u6027\u4e0e\u89e3\u51b3\u95ee\u9898\u7684\u80fd\u529b\uff0cT2\u5b9e\u5e72\u578b\u5178\u578b\u7279\u5f81\u3002\n2. > \u201c**\u4e3b\u8981\u662f\u8fc7\u5e74\u6709\u70b9\u5b58\u6b3e\u4e86\u60f3\u5148\u5206\u914d\u4e00\u4e0b[\u5403\u74dc][\u5403\u74dc]**\u201d \u2014\u2014 \u8bc1\u660e\u52a8\u673a\u975e\u7eaf\u6295\u673a\uff0c\u6709\u89c4\u5212\u5730\u6295\u5165\u5b66\u4e60\uff0c\u8d44\u6e90\u5e95\u5ea7\u4e2d\u7b49\u3002\n3. > \u201c**\u6709\u4e2a\u8003\u8bd5\u6700\u8fd1...\u4f5c\u4e1a\u53ef\u80fd\u4e5f\u8981\u665a\u70b9...\u4e89\u53d6\u660e\u665a11\u524d\u4ea4[\u6342\u8138]**\u201d \u2014\u2014 \u8bc1\u660e\u65f6\u95f4\u7d27\u5f20\u4f46\u6001\u5ea6\u79ef\u6781\uff0c\u4e3b\u52a8\u6c9f\u901a\uff0c\u8d23\u4efb\u611f\u5f3a\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2\u4f4e\u8c03\u5b9e\u5e72\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u8eab\u4efd\u8ba4\u53ef\u4e0e\u5c0a\u91cd\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u5f39\u6027\u7684\u65f6\u95f4\u652f\u6301\u4e0e\u4e13\u4e1a\u7684\u6280\u80fd\u80af\u5b9a\uff0c\u907f\u514d\u56e0\u65f6\u95f4\u51b2\u7a81\u5bfc\u81f4\u79ef\u7d2f\u6027\u653e\u5f03\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5f39\u6027\u65f6\u95f4\u7ba1\u7406\u5305\"}\n```";
