    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v3.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u63d0\u4f9b\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\uff0c\u5e76\u8f93\u51fa\u7ed3\u6784\u5316\u8bca\u65ad\u62a5\u544a\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676258978 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-06 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5c0f\u51b7\u73ed\u73ed/\u5c0f\u51b7\u8c46\u8c46 (\u738b\u96ea) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u7cbe\u82f1\u8bfe (3980\u5143) + \u8fdb\u9636\u8bfe (3400\u5143\uff0c\u5df2\u7533\u8bf7\u9000\u6362) + \u610f\u5411\u540e\u671f\u8bfe |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u8d44\u91d1\u7d27\u5f20\u9690\u60a3** (\u7528\u6237\u81ea\u8ff0\u201c\u8d44\u91d1\u8fd9\u4e00\u5757\u6bd4\u8f83\u7d27\u5f20\u201d\uff0c\u539f\u8ba1\u5212\u4e70\u8bbe\u5907\u6362\u7535\u8111\u5df2\u6401\u7f6e) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u5468\u672b\u6ca1\u65f6\u95f4\uff0c\u5de5\u4f5c\u65e5\u665a\u4e0a\u6709\u65f6\u9519\u8fc7\u76f4\u64ad\uff0c\u9700\u770b\u56de\u653e) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** (\u804a\u5929\u4e2d\u672a\u63d0\u53ca\u5bb6\u4eba\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** (\u5b66\u4e60\u8fc7\u7a0b\u3001\u6280\u672f\u64cd\u4f5c\u3001\u9000\u6362\u8bfe\u610f\u5411\u3001\u4e2a\u4eba\u56f0\u5883\u5747\u6709\u660e\u786e\u8868\u8fbe) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06**\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u5b66\u4e60\u8fc7\u7a0b\u6295\u5165\uff0c\u5173\u6ce8\u6280\u80fd\u638c\u63e1\u672c\u8eab\uff0c\u53d8\u73b0\u8bc9\u6c42\u6a21\u7cca\u4e14\u975e\u77ed\u671f\u9a71\u52a8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u4e0a\u73ed\uff0c\u6211\u73b0\u5728\u662f\u611f\u89c9\u8d8a\u5b66\u8d8a\u627e\u4e0d\u5230\uff0c\u8d8a\u5b66\u8d8a\u4e0d\u5728\u72b6\u6001\uff0c\u627e\u4e0d\u5230\u611f\u89c9\u4e86\uff0c\u611f\u89c9\u4e71\u4e86\u3002\u201d\n  > \u201c\u5929\u5929\u8ddf\u7740\u7ec3\u529f\u623f\u7ec3\u7740\u3002\u53cd\u800c\u8fd8\u628a\u81ea\u5df1\u6574\u4e0d\u4f1a\u4e86\u3002\u201d\n  > \u201c\u901a\u8fc7\u8fd9\u6bb5\u65f6\u95f4\u7684\u5b66\u4e60\u3002\u6211\u89c9\u5f97\u81ea\u5df1\u4e0d\u9002\u5408\u505a\u6f14\u64ad\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07**\u4f4e**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 **\u8d44\u91d1\u627f\u8f7d\u529b\uff1a\u4f4e** \u2014 \u8bc1\u636e\uff1a\u660e\u786e\u8868\u793a\u201c\u8d44\u91d1\u8fd9\u4e00\u5757\u6bd4\u8f83\u7d27\u5f20\u201d\uff0c\u539f\u8ba1\u5212\u4e70\u8bbe\u5907\u548c\u6362\u7535\u8111\uff08\u65e7\u7535\u8111CPU\u8001\u3001\u7cfb\u7edf\u7248\u672c\u4f4e\uff09\u5df2\u56e0\u8d44\u91d1\u95ee\u9898\u6401\u7f6e\u3002\n- \u23f1 **\u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a\u4e2d** \u2014 \u8bc1\u636e\uff1a\u80fd\u575a\u6301\u63d0\u4ea4\u4f5c\u4e1a\u3001\u53c2\u4e0e\u5b66\u4e60\uff0c\u4f46\u5468\u672b\u6ca1\u65f6\u95f4\uff0c\u6709\u65f6\u9519\u8fc7\u76f4\u64ad\u770b\u56de\u653e\u3002\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u9047\u5230\u6280\u672f\u95ee\u9898\uff08AU\u5b89\u88c5\u3001\u7cfb\u7edf\u5347\u7ea7\u3001\u683c\u5f0f\u8f6c\u6362\uff09\u80fd\u79ef\u6781\u5bfb\u6c42\u89e3\u51b3\uff0c\u4f46\u8fc7\u7a0b\u7565\u663e\u5403\u529b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 **\u5bb6\u5ead\u652f\u6301\u5ea6\uff1a\u4fe1\u606f\u7f3a\u5931** \u2014 \u8bc1\u636e\uff1a\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u4fe1\u606f\uff0c**\u5b58\u5728\u201c\u5bb6\u4eba\u4e0d\u77e5\u60c5\u201d\u7684\u6f5c\u5728\u9ad8\u98ce\u9669**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07**\u4f4e\u6781\u5371**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56**\u3002\u5b66\u4e60\u9047\u5230\u74f6\u9888\u65f6\uff08\u627e\u4e0d\u5230\u611f\u89c9\u3001\u832b\u7136\uff09\u8868\u73b0\u51fa\u660e\u663e\u7684\u7126\u8651\u3001\u81ea\u6211\u6000\u7591\u548c\u60c5\u7eea\u5d29\u6e83\u503e\u5411\uff0c\u6781\u5ea6\u4f9d\u8d56\u73ed\u4e3b\u4efb\u7684\u5b89\u629a\u548c\u6307\u5bfc\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u4e0a\u73ed\uff0c\u6211\u73b0\u5728\u662f\u611f\u89c9\u8d8a\u5b66\u8d8a\u627e\u4e0d\u5230\uff0c\u8d8a\u5b66\u8d8a\u4e0d\u5728\u72b6\u6001\uff0c\u627e\u4e0d\u5230\u611f\u89c9\u4e86\uff0c\u611f\u89c9\u4e71\u4e86\u3002\u5c31\u662f\u8bf4\u4e0d\u51fa\u6765\u7684\u611f\u89c9\u3002\u611f\u89c9\u90a3\u513f\u90a3\u513f\u90fd\u4e0d\u5bf9[\u6d41\u6cea][\u6d41\u6cea]\u201d\n  > \u201c\u6536\u5230\u3002\u597d\u832b\u7136[\u5927\u54ed][\u5927\u54ed]\u201d\n  > \u201c\u73ed\u73ed\u5230\u8fd9\u91cc\u4e0d\u4f1a\u4e86[\u5927\u54ed][\u5927\u54ed]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c** (\u5b89\u5168\u9700\u6c42) \u4e0e **\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e** (\u5c0a\u91cd\u9700\u6c42) \u6df7\u5408\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5f3a\u70c8\u7684\u81ea\u6211\u5426\u5b9a\u4e0e\u6280\u80fd\u4e60\u5f97\u7126\u8651**\u3002\u7528\u6237\u5e76\u975e\u5355\u7eaf\u8ffd\u6c42\u7ecf\u6d4e\u53d8\u73b0\uff0c\u800c\u662f\u5e0c\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u6280\u80fd\uff08\u6f14\u64ad/\u540e\u671f\uff09\u6765\u83b7\u5f97**\u81ea\u6211\u4ef7\u503c\u8ba4\u540c\u548c\u5b89\u5168\u611f**\uff0c\u4f46\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u7684\u632b\u6298\uff08\u201c\u6574\u4e0d\u4f1a\u4e86\u201d\u3001\u201c\u832b\u7136\u201d\uff09\u6781\u6613\u89e6\u53d1\u5176\u81ea\u5351\u5fc3\u7406\uff0c\u9677\u5165\u201c\u6211\u4e0d\u884c\u201d\u7684\u5d29\u6e83\u5faa\u73af\u3002\u8d44\u91d1\u7d27\u5f20\u8fdb\u4e00\u6b65\u653e\u5927\u4e86\u5176\u5bf9\u201c\u6295\u5165\u662f\u5426\u503c\u5f97\u201d\u7684\u7126\u8651\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u3001\u5177\u4f53\u7684\u6b63\u5411\u53cd\u9988\u4e0e\u201c\u5c0f\u6b65\u5feb\u8dd1\u201d\u7684\u6210\u5c31\u611f\u8bbe\u8ba1**\u3002\u907f\u514d\u4efb\u4f55\u53ef\u80fd\u5f15\u53d1\u5176\u81ea\u6211\u5426\u5b9a\u7684\u6bd4\u8f83\u6216\u65bd\u538b\uff0c\u5c06\u5927\u76ee\u6807\u62c6\u89e3\u4e3a\u53ef\u5373\u65f6\u5b8c\u6210\u3001\u83b7\u5f97\u8ba4\u53ef\u7684\u5c0f\u4efb\u52a1\uff0c\u7528\u6301\u7eed\u3001\u5177\u4f53\u7684\u8fdb\u6b65\u8bc1\u660e\u201c\u4f60\u53ef\u4ee5\u201d\uff0c\u91cd\u5efa\u5176\u5b66\u4e60\u4fe1\u5fc3\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5 C2\u7c7b\uff08\u51b2\u52a8\u98ce\u9669\u578b\uff09** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u4f46\u5904\u4e8eC2\u9ad8\u5371\u8fb9\u7f18)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u76f4\u63a5\u89e6\u53d1D\u7c7b\u7194\u65ad\u7ea2\u7ebf\uff0c\u4f46**\u8d44\u91d1\u7d27\u5f20 + \u5fc3\u7406\u5f39\u6027\u6781\u4f4e + \u5bb6\u5ead\u652f\u6301\u5ea6\u672a\u77e5**\u6784\u6210\u9ad8\u5371\u7ec4\u5408\u3002\n\n**\u5224\u5b9a\u6811\u63a8\u6f14**\uff1a\n1.  **\u6b65\u9aa40/1/1.5**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u652f\u4ed8\uff0c\u4f46\u8d44\u91d1\u7d27\u5f20\u3002**\u5bb6\u5ead\u51b3\u7b56\u6743\u672a\u77e5\uff0c\u89e6\u53d1\u9884\u8b66**\uff0c\u9700\u964d\u5165C2\u89c2\u5bdf\u3002\n2.  **\u6b65\u9aa42**\uff1a\u52a8\u673a\u7eaf\u5ea6\u9ad8\uff0c\u4f46\u8d44\u6e90\u5e95\u5ea7\uff08\u8d44\u91d1\u4f4e\u3001\u5fc3\u7406\u5f39\u6027\u4f4e\uff09\u7efc\u5408\u8bc4\u7ea7\u4e3a**\u4f4e**\u3002\u7b26\u5408\u201c\u52a8\u673a\u7eaf\u5ea6\u4f4e\u6216\u8d44\u6e90\u5e95\u5ea7\u4f4e \u2192 C2\u7c7b\u201d\u8def\u5f84\u3002\n3.  **\u6b65\u9aa43/4**\uff1a\u975e\u5174\u8da3/\u793e\u4ea4\u9a71\u52a8\uff0c\u4e09\u8f74\u672a\u5168\u9ad8\uff0c\u6545\u5f52\u5165C2\u7c7b\u3002\n4.  **\u9700\u6c42\u5c42\u6b21\u4ea4\u53c9\u9a8c\u8bc1**\uff1a\u7b2c\u4e8c\u5c42\uff08\u5b89\u5168\u9700\u6c42\uff1a\u8d44\u91d1\u7d27\u5f20\u3001\u5bfb\u6c42\u6280\u80fd\u4fdd\u969c\uff09\u4e0e\u7b2c\u56db\u5c42\uff08\u5c0a\u91cd\u9700\u6c42\uff1a\u6e34\u671b\u901a\u8fc7\u6280\u80fd\u8bc1\u660e\u81ea\u5df1\uff09\u6df7\u5408\uff0c\u4f46\u8d44\u6e90\u5e95\u5ea7\u548c\u5fc3\u7406\u5f39\u6027\u4e0d\u8db3\uff0c\u5339\u914dC2\u7c7b\u9ad8\u98ce\u9669\u7279\u5f81\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| **\u5bb6\u5ead\u5e72\u9884\u578b** | **\u9ad8** | \u5bb6\u4eba\u82e5\u4e0d\u77e5\u60c5\uff0c\u4e00\u65e6\u53d1\u73b0\u5176\u82b1\u8d39\u6570\u5343\u5143\u5b66\u4e60\u4e14\u77ed\u671f\u5185\u65e0\u6536\u76ca\uff0c\u6781\u6613\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u5e76\u5f3a\u5236\u8981\u6c42\u9000\u8d39\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | \u6280\u672f\u64cd\u4f5c\u56f0\u96be\uff08\u5982AU\u8f6f\u4ef6\u5b89\u88c5\u3001\u7cfb\u7edf\u5347\u7ea7\uff09\u53e0\u52a0\u5b66\u4e60\u74f6\u9888\u671f\u7684\u832b\u7136\u611f\uff0c\u6781\u6613\u5bfc\u81f4\u5176\u56e0\u201c\u5b66\u4e0d\u4f1a\u201d\u800c\u653e\u5f03\uff0c\u5e76\u5f52\u548e\u4e8e\u8bfe\u7a0b\u96be\u5ea6\u6216\u670d\u52a1\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u4efb\u4f55\u4e00\u6b21\u4f5c\u4e1a\u53d7\u632b\u3001\u8001\u5e08\u8d1f\u9762\u70b9\u8bc4\u6216\u5b66\u4e60\u8fdb\u5ea6\u843d\u540e\uff0c\u90fd\u53ef\u80fd\u6210\u4e3a\u5176\u60c5\u7eea\u5d29\u6e83\u5e76\u7533\u8bf7\u9000\u8d39\u7684\u76f4\u63a5\u5bfc\u706b\u7d22\u3002\u8bc1\u636e\uff1a\u5df2\u56e0\u201c\u627e\u4e0d\u5230\u611f\u89c9\u201d\u800c\u8868\u8fbe\u5f3a\u70c8\u8d1f\u9762\u60c5\u7eea\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u4e2d** | \u867d\u975e\u7eaf\u53d8\u73b0\u9a71\u52a8\uff0c\u4f46\u82e5\u957f\u671f\u65e0\u6cd5\u83b7\u5f97\u201c\u5b66\u4f1a\u201d\u7684\u786e\u5b9a\u611f\u548c\u6210\u5c31\u611f\uff0c\u53ef\u80fd\u8d28\u7591\u8bfe\u7a0b\u4ef7\u503c\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-4\u5468\u6280\u80fd\u74f6\u9888\u671f**\uff08\u5df2\u89e6\u53d1\uff09\u53ca**\u4efb\u4f55\u9700\u8981\u72ec\u7acb\u5b8c\u6210\u590d\u6742\u6280\u672f\u64cd\u4f5c\uff08\u5982AU\u4f5c\u4e1a\uff09\u7684\u8282\u70b9**\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u59d0\uff0c\u770b\u5230\u4f60\u4ea4\u4f5c\u4e1a\u7279\u522b\u79ef\u6781\uff0c\u8fd9\u4efd\u8ba4\u771f\u52b2\u513f\u7279\u522b\u6253\u52a8\u6211\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u554a\uff0c\u5c31\u50cf\u5b66\u9a91\u81ea\u884c\u8f66\uff0c\u6bcf\u4e2a\u4eba\u90fd\u4f1a\u6709\u4e2a\u2018\u611f\u89c9\u8981\u6454\u2019\u7684\u574e\u513f\uff0c\u8fd9\u592a\u6b63\u5e38\u4e86\uff0c\u6070\u6070\u8bf4\u660e\u4f60\u5728\u7a81\u7834\uff01\u4ee5\u540e\u6709\u4efb\u4f55\u2018\u6574\u4e0d\u4f1a\u4e86\u2019\u3001\u2018\u611f\u89c9\u4e71\u4e86\u2019\u7684\u65f6\u5019\uff0c\u5343\u4e07\u522b\u81ea\u5df1\u618b\u7740\uff0c\u968f\u65f6\u6233\u6211\uff0c\u54b1\u4e00\u8d77\u628a\u5b83\u634b\u987a\u3002\u4f60\u7684\u6bcf\u4e00\u6b65\uff0c\u6211\u90fd\u770b\u7740\u5462\uff0c\u7a33\u624e\u7a33\u6253\u5c31\u662f\u6700\u5feb\u7684\u8def\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\u3011** + **\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\uff08\u964d\u9636\u7248\uff09\u3011**\u3002\u5fc5\u987b\u4f18\u5148\u7a33\u5b9a\u60c5\u7eea\uff0c\u518d\u8c08\u6280\u80fd\u6210\u957f\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n  1.  **\u3010\u624b\u628a\u624b\u6280\u672f\u62a4\u822a\u5305\u3011**\uff1a\u9488\u5bf9\u5176\u6570\u5b57\u5316\u64cd\u4f5c\u4e0d\u719f\u7ec3\uff08AU\u5b89\u88c5\u3001\u7cfb\u7edf\u5347\u7ea7\u3001\u683c\u5f0f\u8f6c\u6362\uff09\uff0c\u63d0\u4f9b\u8d85\u8be6\u7ec6\u7684\u56fe\u6587/\u89c6\u9891\u6307\u5f15\uff0c\u751a\u81f3\u9884\u7ea6\u65f6\u95f4\u8fdc\u7a0b\u534f\u52a9\u3002\n  2.  **\u3010\u5fae\u6210\u5c31\u5373\u65f6\u53cd\u9988\u5305\u3011**\uff1a\u8bbe\u7acb\u6781\u6613\u8fbe\u6210\u7684\u201c\u6bcf\u65e5\u5c0f\u76ee\u6807\u201d\uff08\u5982\uff1a\u6210\u529f\u6253\u5f00AU\u5e76\u5bfc\u5165\u4e00\u6bb5\u97f3\u9891\uff09\uff0c\u5b8c\u6210\u540e\u7acb\u5373\u7ed9\u4e88\u5938\u5f20\u7684\u6b63\u9762\u80af\u5b9a\u3002\n  3.  **\u3010\u9884\u671f\u7ba1\u7406\u5f3a\u5316\u5305\u3011**\uff1a\u53cd\u590d\u3001\u660e\u786e\u5730\u544a\u77e5\u201c\u6280\u80fd\u5e73\u53f0\u671f\u201d\u662f\u5fc5\u7ecf\u8fc7\u7a0b\uff0c\u7528\u5176\u4ed6\u5b66\u5458\u7c7b\u4f3c\u7ecf\u5386\uff08\u533f\u540d\uff09\u8fdb\u884c\u5b89\u629a\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n  1.  \u5728\u5176\u8868\u8fbe\u201c\u832b\u7136\u201d\u3001\u201c\u4e0d\u4f1a\u201d\u65f6\uff0c\u4f7f\u7528\u201c\u522b\u4eba\u90fd\u80fd\u505a\u5230\u201d\u3001\u201c\u4f60\u8981\u591a\u7ec3\u4e60\u201d\u7b49\u5bf9\u6bd4\u6027\u6216\u65bd\u538b\u8bdd\u672f\u3002\n  2.  \u50ac\u4fc3\u5176\u8d2d\u4e70\u8bbe\u5907\u6216\u5347\u4ed3\u540e\u671f\u8bfe\u3002**\u8d44\u91d1\u7d27\u5f20\u662f\u5ba2\u89c2\u4e8b\u5b9e\uff0c\u4efb\u4f55\u9500\u552e\u52a8\u4f5c\u90fd\u53ef\u80fd\u6210\u4e3a\u538b\u57ae\u9a86\u9a7c\u7684\u6700\u540e\u4e00\u6839\u7a3b\u8349**\u3002\n  3.  \u5e03\u7f6e\u8d85\u51fa\u5176\u5f53\u524d\u80fd\u529b\u3001\u9700\u8981\u5927\u91cf\u72ec\u7acb\u94bb\u7814\u7684\u590d\u6742\u4f5c\u4e1a\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5f53\u524d\u6838\u5fc3\u4efb\u52a1\u662f\u7a33\u4f4f\u7cbe\u82f1\u8bfe\u5b66\u4e60\uff0c\u5b8c\u6210\u670d\u52a1\u95ed\u73af\u3002\u5728\u672a\u786e\u8ba4\u5176\u8d44\u91d1\u538b\u529b\u7f13\u89e3\u3001\u5b66\u4e60\u4fe1\u5fc3\u5efa\u7acb\u3001\u4e14\u5bb6\u5ead\u77e5\u60c5\u652f\u6301\u524d\uff0c\u7981\u6b62\u63a8\u8350\u4efb\u4f55\u4ed8\u8d39\u4ea7\u54c1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u4e0a\u73ed\uff0c\u6211\u73b0\u5728\u662f\u611f\u89c9\u8d8a\u5b66\u8d8a\u627e\u4e0d\u5230\uff0c\u8d8a\u5b66\u8d8a\u4e0d\u5728\u72b6\u6001\uff0c\u627e\u4e0d\u5230\u611f\u89c9\u4e86\uff0c\u611f\u89c9\u4e71\u4e86\u3002\u5c31\u662f\u8bf4\u4e0d\u51fa\u6765\u7684\u611f\u89c9\u3002\u611f\u89c9\u90a3\u513f\u90a3\u513f\u90fd\u4e0d\u5bf9[\u6d41\u6cea][\u6d41\u6cea]\u201d **\uff08\u5fc3\u7406\u5f39\u6027\u6781\u4f4e\uff0c\u6613\u5d29\u6e83\uff09**\n2. > \u201c\u90a3\u5982\u679c\u4e0d\u62a5\u540e\u671f\u5c31\u9000\u4e0d\u4e86\u8bfe\u662f\u5417\uff1f\u56e0\u4e3a\u6211\u8fd9\u6bb5\u65f6\u95f4\u53d1\u751f\u4e86\u4e00\u4e9b\u4e8b\u60c5\u3002\u5728\u8d44\u91d1\u8fd9\u4e00\u5757\u6bd4\u8f83\u7d27\u5f20\u3002\u672c\u6765\u4ee5\u524d\u8fd8\u6253\u7b97\u4e70\u8bbe\u5907\u548c\u6362\u4e00\u4e0b\u7535\u8111\u7684\u3002\u201d **\uff08\u8d44\u91d1\u5e95\u5ea7\u4f4e\uff0c\u5b58\u5728\u652f\u4ed8\u538b\u529b\uff09**\n3. > \u201c\u73ed\u73ed\u8bbe\u5907\u6682\u65f6\u4e0d\u8003\u8651\u3002\u6ca1\u94b1\u3002\u8fd8\u6709\u5c31\u662f\u5f88\u957f\u4e00\u6bb5\u65f6\u95f4\u3002\u6211\u53ef\u80fd\u4f1a\u6ca1\u6709\u65f6\u95f4\u6765\u597d\u597d\u5b66\u4e60\u3002\u201d **\uff08\u8d44\u6e90\u5e95\u5ea7\u53cc\u4f4e\uff1a\u8d44\u91d1+\u65f6\u95f4\uff0c\u4e14\u900f\u9732\u51fa\u6f5c\u5728\u7684\u653e\u5f03\u98ce\u9669\uff09**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6\u60c5\u7eea\u5de8\u5a74\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u901a\u8fc7\u638c\u63e1\u6280\u80fd\u83b7\u5f97\u5b89\u5168\u611f\u548c\u5c0a\u91cd\uff08\u7b2c\u4e8c\u3001\u56db\u5c42\u9700\u6c42\uff09**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u6781\u81f4\u7684\u60c5\u611f\u966a\u4f34\u4e0e\u624b\u628a\u624b\u7684\u6280\u672f\u62a4\u822a\uff0c\u4e25\u7981\u4efb\u4f55\u9500\u552e\u52a8\u4f5c\uff0c\u9996\u8981\u76ee\u6807\u662f\u5e2e\u52a9\u5176\u5efa\u7acb\u201c\u6211\u80fd\u5b66\u4f1a\u201d\u7684\u6700\u5c0f\u786e\u5b9a\u6027**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"maslow_need\": \"\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\u4e0e\u7b2c\u56db\u5c42\u5c0a\u91cd\u9700\u6c42\u6df7\u5408\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf+\u624b\u628a\u624b\u6280\u672f\u62a4\u822a\u5305\"}\n```";
