    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u4f55\u5915\u4e4b99-\u5e7f\u4e1c-\u81ea\u7531\u804c\u4e1a (UID: 677164732) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-06 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6851\u6986\u975e\u665a\u97f36(\u82cf\u7476\u7476) / \u7c7d\u83f2(\u82cf\u7476\u7476) / \u9065\u8fdc(\u5f20\u6587\u9759) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u9ad8\u9636\u8bfe\u7a0b (7380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **[\u4fe1\u606f\u7f3a\u5931]** (\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u4e0e\u8d44\u91d1\u6765\u6e90) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **[\u4fe1\u606f\u7f3a\u5931]** (\u4ec5\u77e5\u4e3a\u81ea\u7531\u804c\u4e1a\uff0c\u65f6\u95f4\u81ea\u7531\u5ea6\u672a\u77e5) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **[\u4fe1\u606f\u7f3a\u5931]** (\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u4fe1\u606f) |\n| **\u4fe1\u606f\u539a\u5ea6** | **[\u4e25\u91cd\u7f3a\u5931]** (\u5173\u952e\u4e09\u8f74\u4fe1\u606f\u5982\u652f\u4ed8\u80fd\u529b\u3001\u5bb6\u5ead\u652f\u6301\u3001\u65f6\u95f4\u5b89\u6392\u5747\u65e0\u63d0\u53ca\uff0c**\u7f6e\u4fe1\u5ea6\u964d\u4f4e**) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6709\u58f0\u884c\u4e1a\u591a\u79cd\u5de5\u79cd\uff08\u914d\u97f3\u3001\u753b\u672c\u3001\u5ba1\u542c\u7b49\uff09\u7684\u5e7f\u6cdb\u5174\u8da3\uff0c\u5e76\u79ef\u6781\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u8bd5\u97f3\uff0c\u6709\u660e\u786e\u7684\u517c\u804c\u8d5a\u94b1\u610f\u56fe\u3002\u4f46\u540c\u65f6\u4e5f\u6d41\u9732\u51fa\u5bf9\u201c\u6545\u4e8b\u611f\u201d\u3001\u201c\u5927\u5496\u201d\u7684\u5174\u8da3\uff0c\u52a8\u673a\u4e2d\u6df7\u6742\u4e86\u201c\u597d\u73a9\u5c1d\u9c9c\u201d\u548c\u201c\u81ea\u6211\u63d0\u5347\u201d\u7684\u6210\u5206\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4eb2\u5b50\u3001\u60c5\u611f\u7535\u53f0\u3001\u53e4\u8a00\u5c0f\u8bf4\u3001\u5386\u53f2\u6587\u5b66\u3001\u793e\u79d1\u6211\u90fd\u5f88\u6709\u5174\u8da3\uff0c\u5c24\u5176\u662f\u6211\u81ea\u5df1\u5c31\u662f\u53e4\u8a00\u6df1\u5ea6\u7231\u597d\u8005\uff0c\u5728\u756a\u8304\u4e0a\u542c\u4e66\u89c9\u5f97\u5f88\u591a\u90fd\u914d\u5f97\u4e0d\u597d\uff0c\u5f88\u5f71\u54cd\u770b\u4e66\u60c5\u7eea[\u5077\u7b11]\u53e6\u5916\u6211\u4e5f\u53ef\u4ee5\u5c1d\u8bd5\u82f1\u8bed\u8bfb\u7269\u6216\u8005\u6f6e\u6c55\u8bdd\u914d\u97f3\uff0c\u9700\u8981\u7684\u8bdd[\u5077\u7b11]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[**\u4fe1\u606f\u7f3a\u5931**] \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u8d22\u52a1\u72b6\u51b5\u3001\u652f\u4ed8\u538b\u529b\u6216\u6d88\u8d39\u80fd\u529b\u3002**\u6b64\u4e3a\u91cd\u5927\u98ce\u9669\u76f2\u533a**\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[**\u63a8\u6d4b\u4e2d\u9ad8**] \u2014 \u7528\u6237\u4e3a\u201c\u81ea\u7531\u804c\u4e1a\u201d\uff0c\u5728\u4f53\u9a8c\u8425\u671f\u95f4\u80fd\u9891\u7e41\u3001\u53ca\u65f6\u54cd\u5e94\u9500\u552e\u4fe1\u606f\uff0c\u5b8c\u6210\u591a\u9879\u4f5c\u4e1a\uff0c\u5e76\u4e3b\u52a8\u8ffd\u95ee\u8bfe\u7a0b\u5b89\u6392\uff0c\u663e\u793a\u51fa\u8f83\u9ad8\u7684\u65f6\u95f4\u53ef\u652f\u914d\u5ea6\u548c\u6295\u5165\u610f\u613f\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[**\u4fe1\u606f\u7f3a\u5931**] \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u5173\u7cfb\u6216\u51b3\u7b56\u80cc\u666f\u3002**\u6b64\u4e3a\u91cd\u5927\u98ce\u9669\u76f2\u533a**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u7528\u6237\u8868\u73b0\u51fa\u826f\u597d\u7684\u5b66\u4e60\u5fc3\u6001\u548c\u6267\u884c\u529b\u3002\u9762\u5bf9\u201c\u4e0a\u9ea6\u6162\u4e86\uff0c\u6ca1\u8f6e\u5230\u201d\u7684\u5c0f\u632b\u6298\uff0c\u80fd\u4e3b\u52a8\u53cd\u9988\u5e76\u63a5\u53d7\u66ff\u4ee3\u65b9\u6848\uff08\u5f55\u4e09\u6bb5\u53f0\u8bcd\uff09\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u914d\u5408\u5ea6\u9ad8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4e0a\u9ea6\u6162\u4e86\uff0c\u6ca1\u8f6e\u5230[\u6342\u8138]\u201d (\u4e3b\u52a8\u53cd\u9988\u95ee\u9898) > \u201c\u8c22\u8c22\u8001\u5e08\u54c8[\u73ab\u7470]\u201d (\u63a5\u53d7\u5b89\u629a\u4e0e\u66ff\u4ee3\u65b9\u6848)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u73b0\u6709\u6709\u58f0\u4f5c\u54c1\u8d28\u91cf\u7684\u4e0d\u6ee1\uff08\u201c\u89c9\u5f97\u5f88\u591a\u90fd\u914d\u5f97\u4e0d\u597d\u201d\uff09\uff0c\u4ee5\u53ca\u5e0c\u671b\u901a\u8fc7\u638c\u63e1\u4e13\u4e1a\u80fd\u529b\uff0c\u83b7\u5f97\u884c\u4e1a\u8ba4\u53ef\uff08\u201c\u53d6\u5f97\u8bc1\u4e66\u201d\u3001\u201c\u8fdb\u5267\u7ec4\u201d\uff09\uff0c\u5b9e\u73b0\u4ece\u201c\u7231\u597d\u8005\u201d\u5230\u201c\u4e13\u4e1a\u8005\u201d\u7684\u8eab\u4efd\u8dc3\u8fc1\uff0c\u83b7\u5f97\u5c0a\u91cd\u4e0e\u81ea\u6211\u4ef7\u503c\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u5708\u5c42\u5f52\u5c5e\u611f**\u3002\u6301\u7eed\u7ed9\u4e88\u5176\u201c\u6709\u6f5c\u529b\u201d\u3001\u201c\u53ef\u76f4\u63a5\u8fdb\u5267\u7ec4\u201d\u7684\u6b63\u9762\u53cd\u9988\uff0c\u5e76\u6784\u5efa\u201c\u4e0e\u5927\u5496\u540c\u884c\u201d\u3001\u201c\u8fdb\u5165\u4e13\u4e1a\u5708\u5b50\u201d\u7684\u613f\u666f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **[\u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u5b9a \ud83d\udfe7B \u7c7b]** (\u52a8\u673a\u660e\u786e\u3001\u884c\u52a8\u529b\u5f3a\uff0c\u4f46\u5173\u952e\u5bb6\u5ead\u4e0e\u8d22\u52a1\u4fe1\u606f\u7f3a\u5931\uff0c\u65e0\u6cd5\u6392\u9664C/D\u7c7b\u98ce\u9669) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **[T3 \u6b7b\u78d5\u5b66\u9738\u578b]** (\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u5b66\u4e60\u610f\u613f\u3001\u6267\u884c\u529b\u3001\u5bf9\u4e13\u4e1a\u77e5\u8bc6\u7684\u5c0a\u91cd\u548c\u8ffd\u6c42\uff0c\u5e76\u4e3b\u52a8\u63a2\u7d22\u591a\u79cd\u53ef\u80fd\u6027) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1] (\u804a\u5929\u8bb0\u5f55\u4e2d\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5ead\u51b2\u7a81\u7b49\u7ea2\u7ebf\u4fe1\u53f7)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **[\u9ad8]** (\u4fe1\u606f\u7f3a\u5931\uff0c\u98ce\u9669\u672a\u77e5) | **\u3010\u9ad8\u98ce\u9669\u76f2\u533a\u3011**\uff1a\u82e5\u652f\u4ed8\u884c\u4e3a\u9690\u7792\u5bb6\u4eba\uff0c\u6216\u52a8\u7528\u5bb6\u5ead\u91cd\u8981\u8d44\u91d1\uff0c\u540e\u7eed\u6781\u6613\u7206\u53d1\u51b2\u7a81\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | [\u4f4e] | \u81ea\u7531\u804c\u4e1a\u8005\u65f6\u95f4\u76f8\u5bf9\u81ea\u7531\uff0c\u4e14\u5df2\u5c55\u73b0\u51fa\u9ad8\u914d\u5408\u5ea6\uff0c\u56e0\u65f6\u95f4\u51b2\u7a81\u5d29\u76d8\u98ce\u9669\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | [\u4f4e] | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u632b\u6298\u6216\u8d1f\u9762\u53cd\u9988\u800c\u60c5\u7eea\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | [\u4e2d] | \u5bf9\u201c\u8fdb\u5267\u7ec4\u201d\u3001\u201c\u63a5\u5355\u201d\u6709\u8f83\u9ad8\u671f\u5f85\u3002\u82e5\u5f00\u8bfe\u540e\u53d1\u73b0\u63a5\u5355\u95e8\u69db\u9ad8\u3001\u5468\u671f\u957f\u3001\u6536\u76ca\u4e0e\u5ba3\u4f20\u4e0d\u7b26\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e1\u4e2a\u6708\u5185**\u3002\u5f53\u7406\u8bba\u8bfe\u7a0b\u8fdb\u5165\u5b9e\u64cd\u63a5\u5355\u9636\u6bb5\uff0c\u82e5\u5b9e\u9645\u63a5\u5355\u673a\u4f1a\u3001\u6536\u5165\u4e0e\u524d\u671f\u201c\u5feb\u4eba\u4e00\u6b65\u201d\u3001\u201c\u76f4\u63a5\u8fdb\u5267\u7ec4\u201d\u7684\u627f\u8bfa\u4ea7\u751f\u660e\u663e\u5dee\u8ddd\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4f55\u5915\u540c\u5b66\uff0c\u770b\u5230\u4f60\u5728\u4f53\u9a8c\u8425\u7684\u8868\u73b0\uff0c\u771f\u7684\u8ba9\u6211\u60f3\u8d77\u90a3\u4e9b\u6700\u7ec8\u6210\u4e3a\u884c\u4e1a\u5927\u5496\u7684\u5b66\u5458\u2014\u2014\u4e0d\u4ec5\u6709\u5929\u8d4b\uff0c\u66f4\u6709\u6b7b\u78d5\u5230\u5e95\u7684\u94bb\u7814\u7cbe\u795e\u3002\u54b1\u4eec\u9ad8\u9636\u8bfe\u5c31\u662f\u4e3a\u4f60\u8fd9\u6837\u7684\u2018\u6f5c\u529b\u80a1\u2019\u51c6\u5907\u7684\uff0c\u63a5\u4e0b\u6765\u6211\u4f1a\u5e26\u4f60\u4e00\u6b65\u6b65\u62c6\u89e3\u5927\u5496\u7684\u6f14\u64ad\u79d8\u7c4d\uff0c\u8ba9\u4f60\u4ece\u2018\u7231\u597d\u8005\u2019\u771f\u6b63\u8715\u53d8\u4e3a\u88ab\u5e02\u573a\u8ba4\u53ef\u7684\u2018\u4e13\u4e1a\u6f14\u64ad\u8005\u2019\u3002\u6709\u4efb\u4f55\u5361\u70b9\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4eec\u4e00\u8d77\u653b\u514b\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u3002\u5339\u914d\u5176T3\u6b7b\u78d5\u5b66\u9738\u7279\u8d28\uff0c\u63d0\u4f9b\u7cfb\u7edf\u3001\u6df1\u5165\u3001\u6709\u6311\u6218\u6027\u7684\u4e13\u4e1a\u8bfe\u7a0b\u548c\u4f5c\u4e1a\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u5174\u8da3\u5e7f\u6cdb\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a\u3010**\u591a\u8d5b\u9053\u5c1d\u9c9c\u5305**\u3011\uff08\u5982\u53e4\u8a00\u3001\u4eb2\u5b50\u3001\u82f1\u8bed\u3001\u65b9\u8a00\u7b49\u7ec6\u5206\u8d5b\u9053\u4ecb\u7ecd\u4e0e\u8bd5\u97f3\u673a\u4f1a\uff09\uff1b\u9488\u5bf9\u5176\u5c0a\u91cd\u9700\u6c42\uff0c\u8865\u5145\u3010**\u5bfc\u5e081v1\u70b9\u8bc4\u7279\u6743**\u3011\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a**\u7edd\u4e0d\u8981\u7ed9\u51fa\u6a21\u7cca\u6216\u65e0\u6cd5\u5151\u73b0\u7684\u63a5\u5355\u627f\u8bfa**\u3002\u907f\u514d\u4f7f\u7528\u201c\u5f88\u5feb\u201d\u3001\u201c\u9a6c\u4e0a\u201d\u7b49\u8bcd\uff0c\u5e94\u660e\u786e\u63a5\u5355\u8def\u5f84\u4e0e\u5468\u671f\u3002\u7edd\u4e0d\u8981\u5ffd\u89c6\u5176\u4e13\u4e1a\u63a2\u8ba8\u7684\u6df1\u5ea6\u9700\u6c42\uff0c\u7528\u5957\u8bdd\u6577\u884d\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u7528\u6237\u5df2\u8d2d\u4e70\u9ad8\u9636\u8bfe\u7a0b\uff0c\u5f53\u524d\u6838\u5fc3\u662f\u505a\u597d\u4ea4\u4ed8\uff0c\u5efa\u7acb\u4fe1\u4efb\u3002\u4e25\u7981\u5728\u8bfe\u7a0b\u521d\u671f\u8fdb\u884c\u4e8c\u6b21\u5347\u5355\u63a8\u9500\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u4eb2\u5b50\u3001\u60c5\u611f\u7535\u53f0\u3001\u53e4\u8a00\u5c0f\u8bf4\u3001\u5386\u53f2\u6587\u5b66\u3001\u793e\u79d1\u6211\u90fd\u5f88\u6709\u5174\u8da3\uff0c\u5c24\u5176\u662f\u6211\u81ea\u5df1\u5c31\u662f\u53e4\u8a00\u6df1\u5ea6\u7231\u597d\u8005\uff0c\u5728\u756a\u8304\u4e0a\u542c\u4e66\u89c9\u5f97\u5f88\u591a\u90fd\u914d\u5f97\u4e0d\u597d\uff0c\u5f88\u5f71\u54cd\u770b\u4e66\u60c5\u7eea[\u5077\u7b11]\u53e6\u5916\u6211\u4e5f\u53ef\u4ee5\u5c1d\u8bd5\u82f1\u8bed\u8bfb\u7269\u6216\u8005\u6f6e\u6c55\u8bdd\u914d\u97f3\uff0c\u9700\u8981\u7684\u8bdd[\u5077\u7b11]\u201d **(\u4f53\u73b0\u5174\u8da3\u9a71\u52a8\u3001\u4e13\u4e1a\u8ffd\u6c42\u4e0e\u81ea\u6211\u5b9e\u73b0\u9700\u6c42)**\n2. > \u201c\u4e3b\u64ad\u914d\u97f3\uff0c\u753b\u672c\uff0c\u5ba1\u542c\uff0c\u5bf9\u8f68+\u5e72\u97f3\uff0c\u540e\u671f\uff0c\u6211\u90fd\u53ef\u4ee5\u201d / \u201c\u90fd\u60f3\u505a\u201d **(\u4f53\u73b0\u5e7f\u6cdb\u63a2\u7d22\u6b32\u548c\u5f3a\u884c\u52a8\u610f\u613f)**\n3. > \u201c\u4e0a\u9ea6\u6162\u4e86\uff0c\u6ca1\u8f6e\u5230[\u6342\u8138]\u201d / \u201c\u4e09\u6bb5\u89d2\u8272\u53f0\u8bcd\u6628\u665a\u5df2\u7ecf\u4ea4\u4e86\u554a\u201d **(\u4f53\u73b0\u79ef\u6781\u4e89\u53d6\u3001\u4e3b\u52a8\u53cd\u9988\u3001\u9ad8\u6267\u884c\u529b\uff0c\u5fc3\u7406\u5f39\u6027\u597d)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T3 \u6b7b\u78d5\u5b66\u9738\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u81ea\u6211\u5b9e\u73b0\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff08\u4e3b\u8981\u98ce\u9669\u6765\u81ea\u672a\u77e5\u7684\u5bb6\u5ead\u8d22\u52a1\u5e72\u9884\u548c\u6536\u76ca\u9884\u671f\u7ba1\u7406\uff09\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6e05\u6670\u3001\u4e13\u4e1a\u7684\u6210\u957f\u8def\u5f84\u56fe\uff0c\u5e76\u4e25\u683c\u7ba1\u7406\u5176\u63a5\u5355\u6536\u76ca\u9884\u671f\u3011**\u3002\n\n```json\n{\"core_type\": \"T3 \u6b7b\u78d5\u5b66\u9738\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u591a\u8d5b\u9053\u5c1d\u9c9c\u5305\"}\n```";
