    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u4e0e\u8d28\u91cf\u98ce\u63a7\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u7f3a\u4e4f\u652f\u4ed8\u8bb0\u5f55\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u3001\u7528\u6237\u4e2a\u4eba\u80cc\u666f\uff08\u5e74\u9f84/\u804c\u4e1a/\u6536\u5165\uff09\u3001\u5177\u4f53\u4ea7\u54c1\u4ef7\u683c\u4e0e\u627f\u8bfa\u7ec6\u8282\u3002\n\n---\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a**\u4e2d\u7b49-\u6df7\u6742**\u3002\u521d\u59cb\u660e\u786e\u4e3a\u201c\u4e1a\u4f59\u7231\u597d\u201d\uff0c\u4f46\u9500\u552e\u6301\u7eed\u5f15\u5bfc\u81f3\u201c\u53d8\u73b0\u201d\u3001\u201c\u63a5\u5355\u201d\u3001\u201c\u517c\u804c\u201d\uff0c\u7528\u6237\u672a\u5f3a\u70c8\u6297\u62d2\uff0c\u8868\u73b0\u51fa\u5bf9\u201c\u52a8\u753b\u7247\u3001\u6e38\u620f\u201d\u3001\u201c\u540e\u671f\u201d\u7b49\u5177\u4f53\u65b9\u5411\u7684\u5174\u8da3\u3002\u52a8\u673a\u4ece\u7eaf\u5174\u8da3\u5411\u6f5c\u5728\u53d8\u73b0\u503e\u659c\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u201c\u5feb\u901f\u8d5a\u94b1\u201d\u7126\u8651\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u63a8\u6d4b\u4e2d\u7b49**\u3002\u7528\u6237\u4e3a\u4e0a\u73ed\u65cf\uff0c\u6709\u56fa\u5b9a\u5de5\u4f5c\uff0c\u80fd\u5229\u7528\u5348\u4f11\u3001\u4e0b\u73ed\u65f6\u95f4\u5b66\u4e60\u3002\u5bf9\u201c\u6478\u9c7c\u201d\u73af\u5883\u7684\u63cf\u8ff0\u6697\u793a\u5de5\u4f5c\u73af\u5883\u8f83\u4e3a\u89c4\u8303\uff0c\u53ef\u80fd\u6709\u4e00\u5b9a\u53ef\u652f\u914d\u65f6\u95f4\u548c\u57fa\u7840\u8bbe\u5907\uff08\u7535\u8111\uff09\u3002\u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\u6216\u65f6\u95f4\u6781\u5ea6\u7d27\u5f20\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a**\u8f83\u9ad8**\u3002\u6c9f\u901a\u914d\u5408\u5ea6\u9ad8\uff0c\u6309\u65f6\u5b8c\u6210\u591a\u9879\u4f5c\u4e1a\uff08\u57fa\u672c\u529f\u3001\u5f55\u64ad\u8bfe\u3001\u58f0\u97f3\u9274\u5b9a\u3001\u65c1\u767d\uff09\uff0c\u4e3b\u52a8\u63d0\u95ee\uff08\u201c\u5c0f\u5973\u5b69\u5462\uff1f\u201d\uff09\uff0c\u5bf9\u9500\u552e\u5efa\u8bae\uff08\u5982\u6124\u6012\u60c5\u7eea\u7ec3\u4e60\uff09\u8868\u793a\u63a5\u53d7\u5e76\u613f\u610f\u5c1d\u8bd5\u3002\u9762\u5bf9\u5bc6\u96c6\u7684\u76f4\u64ad\u548c\u4f5c\u4e1a\u5b89\u6392\uff0c\u867d\u6709\u201c\u4e0a\u73ed\u4e2d\u201d\u7684\u5ba2\u89c2\u9650\u5236\uff0c\u4f46\u6001\u5ea6\u79ef\u6781\uff0c\u672a\u62b1\u6028\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u6267\u884c\n\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**\uff1a**\u65e0\u6cd5\u6838\u67e5**\u3002\u8bb0\u5f55\u7ec8\u6b62\u4e8e\u9500\u552e\u5f15\u5bfc\u201c\u4fdd\u5b58\u4f18\u60e0\u5238\u626b\u7801\u9886\u5238\u201d\u3001\u201c\u62a5\u5b8c\u622a\u56fe\u53d1\u7ed9\u6211\u201d\uff0c\u672a\u89c1\u5230\u7528\u6237\u652f\u4ed8\u884c\u4e3a\u6216\u786e\u8ba4\u4fe1\u606f\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u672a\u89e6\u53d1**\u3002\u5168\u7a0b\u4e3a\u4e2a\u4eba\u6c9f\u901a\uff0c\u672a\u63d0\u53ca\u914d\u5076\u3001\u7236\u6bcd\u7b49\u5bb6\u5ead\u6210\u5458\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u7eaf\u5ea6\u5224\u65ad**\uff1a\u52a8\u673a\u6df7\u6742\uff08B\u7c7b\u4fe1\u53f7\uff09\u3002\u521d\u59cb\u4e3a\u5174\u8da3\uff0c\u540e\u671f\u88ab\u5f15\u5bfc\u5173\u6ce8\u53d8\u73b0\u4e0e\u5de5\u79cd\u3002\n*   **\u6b65\u9aa42 - \u8d44\u6e90\u5e95\u5ea7\u5224\u65ad**\uff1a\u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u5f52\u4e3aC\u7c7b\uff08\u5e38\u89c4\u8d44\u6e90\uff09\u3002\n*   **\u6b65\u9aa43 - \u5fc3\u7406\u5f39\u6027\u5224\u65ad**\uff1a\u5f39\u6027\u8f83\u9ad8\uff08A\u7c7b\u4fe1\u53f7\uff09\u3002\u914d\u5408\u3001\u6267\u884c\u3001\u53cd\u9988\u826f\u597d\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**\uff1a**B-C-A\u578b\u7528\u6237**\u3002\u6838\u5fc3\u7279\u5f81\u4e3a\uff1a**\u5174\u8da3\u5165\u95e8\uff0c\u6613\u88ab\u5f15\u5bfc\uff0c\u6267\u884c\u529b\u5f3a\uff0c\u4f46\u6838\u5fc3\u4ed8\u8d39\u52a8\u673a\u548c\u51b3\u7b56\u4fe1\u606f\u7f3a\u5931**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n\n*   **\u5339\u914d\u539f\u578b**\uff1a**T3 \u5174\u8da3\u63a2\u7d22\u8005**\u3002\n    *   **\u4f9d\u636e**\uff1a\u4ee5\u201c\u4e1a\u4f59\u7231\u597d\u201d\u4e3a\u8d77\u70b9\uff0c\u5bf9\u7279\u5b9a\u5185\u5bb9\u9886\u57df\uff08\u52a8\u753b\u3001\u6e38\u620f\uff09\u6709\u660e\u786e\u5174\u8da3\uff0c\u5b66\u4e60\u8fc7\u7a0b\u8ba4\u771f\u3001\u914d\u5408\u3002\u867d\u88ab\u9500\u552e\u5f15\u5bfc\u81f3\u53d8\u73b0\u8bdd\u9898\uff0c\u4f46\u81ea\u8eab\u672a\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u529f\u5229\u7126\u8651\u6216\u6295\u673a\u5fc3\u6001\uff0c\u884c\u52a8\u9a71\u52a8\u529b\u66f4\u591a\u6e90\u4e8e\u5bf9\u5185\u5bb9\u672c\u8eab\u7684\u5174\u8da3\u548c\u63a2\u7d22\u6b32\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n\n*   **\u98ce\u9669\u7b49\u7ea7**\uff1a**\u4e2d**\u3002\n*   **\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a\u4e2d\u98ce\u9669\u3002\u7528\u6237\u5bf9\u201c\u6b63\u592a\u97f3\u201d\u3001\u201c\u540e\u671f\u201d\u6709\u5177\u4f53\u671f\u5f85\uff0c\u82e5\u8bfe\u7a0b\u65e0\u6cd5\u6ee1\u8db3\u5176\u4e2a\u6027\u5316\u53d1\u5c55\u6216\u6280\u80fd\u63d0\u5347\u9884\u671f\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u3002\n    2.  **\u53d8\u73b0\u627f\u8bfa\u843d\u7a7a**\uff1a**\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u8bd5\u97f3\u8ba2\u5355\u201d\u3001\u201c\u517c\u804c\u201d\u3001\u201c\u8fdb\u5267\u7ec4\u201d\u3001\u201c\u53d8\u73b0\u201d\uff0c\u5e76\u7ed9\u51fa\u201c20-150\u6bcf\u5c0f\u65f6\u201d\u7684\u62a5\u4ef7\u5f15\u5bfc\u3002**\u8fd9\u662f\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\n    3.  **\u65f6\u95f4\u7cbe\u529b\u51b2\u7a81**\uff1a\u4f4e\u98ce\u9669\u3002\u7528\u6237\u5df2\u5e73\u8861\u5de5\u4f5c\u4e0e\u5b66\u4e60\uff0c\u4e14\u5fc3\u7406\u5f39\u6027\u9ad8\u3002\n    4.  **\u4ea7\u54c1\u670d\u52a1\u4e0d\u7b26**\uff1a\u4e2d\u98ce\u9669\u3002\u53d6\u51b3\u4e8e\u540e\u7eed\u8bfe\u7a0b\u5185\u5bb9\u4e0e\u9500\u552e\u63cf\u8ff0\u7684\u201c\u52a8\u753b\u3001\u6e38\u620f\u914d\u97f3\u201d\u3001\u201c\u540e\u671f\u201d\u6559\u5b66\u5339\u914d\u5ea6\u3002\n    5.  **\u7ecf\u6d4e\u538b\u529b**\uff1a\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u8bc4\u4f30\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u8bc4\u4f30\u3002\n    7.  **\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa**\uff1a**\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u8bdd\u672f\u5b58\u5728\u660e\u663e\u5f15\u5bfc\uff1a\u201c\u8fd9\u51e0\u5929\u5c31\u53ef\u4ee5\u5c1d\u8bd5\u5f00\u59cb\u5b9e\u6218\u63a5\u5355\u201d\u3001\u201c\u4ef7\u4f4d20-150\u6bcf\u5c0f\u65f6\u201d\u3001\u201c\u4f60\u7684\u6c34\u5e73\u6211\u89c9\u5f97\u662f\u6709\u53ef\u80fd\u76f4\u63a5\u8fdb\u5267\u7ec4\u7684\u201d\u3002**\u5b58\u5728\u5938\u5927\u63a5\u5355\u53ef\u80fd\u6027\u4e0e\u901f\u5ea6\u7684\u98ce\u9669**\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n\n*   **\u4e3b\u8981\u96f7\u533a**\uff1a\n    *   **\u3010\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u8bf1\u5bfc\u3011**\uff1a\u9500\u552e\u9891\u7e41\u4f7f\u7528\u201c\u8bd5\u97f3\u8ba2\u5355\u201d\u3001\u201c\u53d8\u73b0\u201d\u3001\u201c\u63a5\u5355\u201d\u3001\u201c\u8fdb\u5267\u7ec4\u201d\u3001\u201c\u76f4\u63a5\u8fdb\u5267\u7ec4\u201d\u7b49\u8bcd\u6c47\uff0c\u5e76\u7ed9\u51fa\u5177\u4f53\u4ef7\u683c\u533a\u95f4\uff0820-150\u5143/\u65f6\uff09\uff0c**\u5f3a\u70c8\u6697\u793a\u62a5\u8bfe\u540e\u5373\u53ef\u5feb\u901f\u83b7\u5f97\u517c\u804c\u6536\u5165**\uff0c\u53ef\u80fd\u6784\u6210\u865a\u5047\u6216\u8bef\u5bfc\u6027\u5ba3\u4f20\u3002\n    *   **\u3010\u5236\u9020\u7d27\u8feb\u611f\u3011**\uff1a\u4f7f\u7528\u201c\u52a9\u5b66\u91d1\u4f18\u60e0\u5238\u201d\u3001\u201c\u9a6c\u4e0a\u62a2\u201d\u3001\u201c\u6ca1\u6709\u540d\u989d\u4e86\u201d\u7b49\u8bdd\u672f\uff0c\u8425\u9020\u7a00\u7f3a\u6027\uff0c\u50ac\u4fc3\u51b3\u7b56\u3002\n    *   **\u3010\u5408\u89c4\u6027\u3011**\uff1a\u6d41\u7a0b\u4e0a\uff0c\u5728\u7528\u6237\u672a\u660e\u786e\u8868\u8fbe\u8d2d\u4e70\u610f\u5411\u524d\uff0c\u5df2\u5f15\u5bfc\u81f3\u652f\u4ed8\u73af\u8282\uff08\u201c\u4fdd\u5b58\u4f18\u60e0\u5238\u626b\u7801\u9886\u5238\u201d\uff09\u3002\n*   **\u603b\u4f53\u8bc4\u4ef7**\uff1a**\u9500\u552e\u8bdd\u672f\u5b58\u5728\u663e\u8457\u5408\u89c4\u98ce\u9669**\uff0c\u5c24\u5176\u5728\u53d8\u73b0\u627f\u8bfa\u65b9\u9762\uff0c\u6613\u5f15\u53d1\u540e\u7eed\u5ba2\u8bc9\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n\n*   **\u4ea7\u54c1\u5339\u914d**\uff1a**\u504f\u5dee**\u3002\u7528\u6237\u662f\u5178\u578b\u7684\u201c\u5174\u8da3\u63a2\u7d22\u8005\u201d(T3)\uff0c\u6838\u5fc3\u9700\u6c42\u662f\u53d1\u5c55\u201c\u52a8\u753b\u3001\u6e38\u620f\u201d\u76f8\u5173\u914d\u97f3\u7231\u597d\u3002\u9500\u552e\u5374\u5c06\u5176\u5bfc\u5411\u201c\u5feb\u901f\u517c\u804c\u53d8\u73b0\u201d\u7684\u901a\u7528\u8def\u5f84\uff0c\u53ef\u80fd\u9519\u914d\u5176\u6df1\u5c42\u5b66\u4e60\u52a8\u673a\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**\u9996\u5468\u6821\u6b63\u53d8\u73b0\u9884\u671f\uff0c\u5f3a\u5316\u5174\u8da3\u5f15\u5bfc**\u3002\n*   **\u5177\u4f53\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9884\u671f\u7ba1\u7406**\uff1a\u73ed\u4e3b\u4efb\u9996\u5468\u6c9f\u901a\u5fc5\u987b\u660e\u786e\u6f84\u6e05\uff1a\u8bfe\u7a0b\u6838\u5fc3\u662f\u6280\u80fd\u6559\u5b66\uff0c\u63a5\u5355\u4f9d\u8d56\u4e8e\u4e2a\u4eba\u52aa\u529b\u3001\u5e02\u573a\u673a\u4f1a\u4e0e\u6301\u7eed\u7ec3\u4e60\uff0c**\u76f4\u63a5\u7ea0\u6b63\u9500\u552e\u5173\u4e8e\u201c\u5feb\u901f\u63a5\u5355\u3001\u8fdb\u5267\u7ec4\u201d\u7684\u8fc7\u5ea6\u6697\u793a**\u3002\n    2.  **\u5174\u8da3\u951a\u5b9a**\uff1a\u6df1\u5165\u4e86\u89e3\u7528\u6237\u5bf9\u201c\u52a8\u753b\u3001\u6e38\u620f\u201d\u3001\u201c\u540e\u671f\u201d\u7684\u5177\u4f53\u5174\u8da3\u70b9\uff0c\u5728\u8bfe\u7a0b\u670d\u52a1\u4e2d\u63d0\u4f9b\u76f8\u5173\u7d20\u6750\u3001\u6848\u4f8b\u548c\u6307\u5bfc\uff0c\u5c06\u5176\u5174\u8da3\u8f6c\u5316\u4e3a\u957f\u671f\u5b66\u4e60\u52a8\u529b\u3002\n    3.  **\u98ce\u9669\u76d1\u63a7**\uff1a\u5bc6\u5207\u5173\u6ce8\u8be5\u7528\u6237\u5728\u5b66\u4e60\u521d\u671f\u7684\u53cd\u9988\uff0c\u7279\u522b\u662f\u5bf9\u201c\u5b9e\u6218\u673a\u4f1a\u201d\u3001\u201c\u53d8\u73b0\u8def\u5f84\u201d\u7684\u8be2\u95ee\uff0c\u9700\u7ed9\u4e88\u771f\u5b9e\u3001\u5ba2\u89c2\u7684\u884c\u4e1a\u4fe1\u606f\uff0c\u907f\u514d\u518d\u6b21\u5f15\u53d1\u8fc7\u9ad8\u671f\u5f85\u3002\n    4.  **\u670d\u52a1\u5f3a\u5316**\uff1a\u56e0\u5176\u914d\u5408\u5ea6\u9ad8\uff0c\u53ef\u63d0\u4f9b\u66f4\u591a\u4e2a\u6027\u5316\u53cd\u9988\u548c\u9f13\u52b1\uff0c\u5de9\u56fa\u5176\u5b66\u4e60\u6b63\u53cd\u9988\uff0c\u5c06\u5173\u6ce8\u70b9\u4ece\u201c\u7ed3\u679c\uff08\u53d8\u73b0\uff09\u201d\u8f6c\u5411\u201c\u8fc7\u7a0b\uff08\u6280\u80fd\u6210\u957f\u4e0e\u5174\u8da3\u6ee1\u8db3\uff09\u201d\u3002\n\n{\"core_type\": \"T3 \u5174\u8da3\u63a2\u7d22\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u9996\u5468\u6821\u6b63\u53d8\u73b0\u9884\u671f\uff0c\u5f3a\u5316\u5174\u8da3\u5f15\u5bfc\"}";
