    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u4e0e\u98ce\u63a7\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u7f3a\u5c11\u652f\u4ed8\u65b9\u5f0f\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u3001\u5177\u4f53\u804c\u4e1a\u4e0e\u6536\u5165\u3001\u8be6\u7ec6\u5bb6\u5ead\u80cc\u666f\u7b49\u4fe1\u606f\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49)**\n    *   **\u8868\u5c42**\uff1a\u5bfb\u6c42\u526f\u4e1a\u6536\u5165\uff08\u201c\u5165\u4e0d\u6577\u51fa\uff0c\u6ee1\u8db3\u4e0d\u4e86\u82b1\u9500\u5f00\u652f\u201d\uff09\uff0c\u4e3a\u9000\u4f11\u540e\uff0815\u4e2a\u6708\u540e\uff09\u505a\u51c6\u5907\u3002\n    *   **\u6df1\u5c42**\uff1a\u5bf9\u58f0\u97f3/\u6f14\u64ad\u6709\u6f5c\u5728\u5174\u8da3\uff08\u66fe\u4e8e22\u5e74\u5f55\u8fc7\u6545\u4e8b\uff09\uff0c\u5b58\u5728\u81ea\u6211\u63d0\u5347\u548c\u793e\u4ea4\u5f52\u5c5e\u9700\u6c42\uff08\u201c\u8ddf\u5b9a\u4f60\u4e86\u201d\u3001\u201c\u4ee5\u540e\u8ddf\u7740\u5e08\u59d0\u6df7\u4e86\u201d\uff09\u3002\n    *   **\u98ce\u9669\u4fe1\u53f7**\uff1a**\u53d8\u73b0\u9884\u671f\u6a21\u7cca**\uff0c\u5bf9\u884c\u4e1a\u8ba4\u77e5\u6d45\uff08\u201c\u6211\u8fd9\u6c34\u5e73\u6015\u662f\u4e0d\u884c\u201d\u3001\u201c\u7528\u624b\u673a\u5f55\u5417\u201d\uff09\uff0c\u5b66\u4e60\u52a8\u673a\u6613\u53d7\u77ed\u671f\u53d8\u73b0\u538b\u529b\u51b2\u51fb\u3002\n\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d\u7b49\u504f\u4f4e)**\n    *   **\u65f6\u95f4**\uff1a\u5728\u804c\u72b6\u6001\uff0c\u5de5\u4f5c\u7e41\u5fd9\uff08\u201c\u8001\u677f\u4eca\u5929\u4e2d\u5348\u4e00\u76f4\u5728\u8fd9\u201d\u3001\u201c\u4e2d\u5348\u4e5f\u6ca1\u4f11\u606f\u201d\uff09\uff0c\u4f46\u5373\u5c06\u9000\u4f11\uff0815\u4e2a\u6708\uff09\uff0c\u672a\u6765\u65f6\u95f4\u8d44\u6e90\u9884\u671f\u589e\u52a0\u3002\n    *   **\u7ecf\u6d4e**\uff1a**\u652f\u4ed8\u538b\u529b\u660e\u663e**\uff08\u201c\u4e09\u4e2a\u591a\u6708\u5de5\u8d44\u5462\u201d\u3001\u201c\u6709[\u538b\u529b]\u201d\uff09\uff0c\u9009\u62e9\u6700\u4f4e\u6863\uff082\u4e2a\u6708\uff09\u5206\u671f\u65b9\u6848\u3002\n    *   **\u6280\u80fd**\uff1a\u58f0\u97f3\u6761\u4ef6\u88ab\u9500\u552e\u8ba4\u53ef\uff08\u201c\u5fa1\u59d0\u8303\u513f\u201d\u3001\u201c\u620f\u611f\u548c\u58f0\u7ebf\u5f88\u559c\u6b22\u201d\uff09\uff0c\u4f46\u81ea\u6211\u8bc4\u4ef7\u4f4e\uff08\u201c\u592a\u751f\u4e86\u201d\uff09\uff0c\u5c5e\u7eaf\u65b0\u624b\u3002\n    *   **\u8bbe\u5907**\uff1a\u521d\u671f\u8ba1\u5212\u7528\u624b\u673a\u5f55\u97f3\uff0c\u65e0\u4e13\u4e1a\u8bbe\u5907\u3002\n\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u7b49)**\n    *   **\u884c\u52a8\u529b**\uff1a\u826f\u597d\u3002\u80fd\u6309\u65f6\u5b8c\u6210\u8bad\u7ec3\u8425\u4f5c\u4e1a\u3001\u53e3\u90e8\u64cd\uff0c\u914d\u5408\u5ea6\u9ad8\u3002\n    *   **\u8010\u632b\u529b**\uff1a**\u4e2d\u7b49\u504f\u8106\u5f31**\u3002\u6613\u81ea\u6211\u6000\u7591\uff08\u201c\u6015\u662f\u4e0d\u884c\u201d\uff09\uff0c\u5bf9\u5b66\u4e60\u5468\u671f\u548c\u96be\u5ea6\u6709\u754f\u96be\u60c5\u7eea\uff08\u201c2\u4e2a\u6708\u5462\u201d\uff09\u3002\n    *   **\u81ea\u4e3b\u6027**\uff1a\u4e2d\u7b49\u3002\u4f9d\u8d56\u9500\u552e\u5f15\u5bfc\uff08\u201c\u6211\u8981\u8ddf\u7740\u4f60\u5f00\u59cb\u505a\u201d\uff09\uff0c\u4f46\u5728\u5173\u952e\u51b3\u7b56\uff08\u5982\u5206\u671f\u9009\u62e9\uff09\u4e0a\u80fd\u8868\u8fbe\u81ea\u8eab\u538b\u529b\u3002\n    *   **\u627f\u8bfa\u5ea6**\uff1a\u4e2d\u7b49\u3002\u5728\u9500\u552e\u5f3a\u8ddf\u8fdb\u4e0b\u5b8c\u6210\u8f6c\u5316\uff0c\u4f46\u521d\u59cb\u72b9\u8c6b\u660e\u663e\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**\uff1a\u5df2\u652f\u4ed8\uff08\u201c\u5df2\u4ed8\u6b3e\u201d\uff09\uff0c\u9009\u62e9**2\u4e2a\u6708\u5206\u671f**\uff0c\u8868\u660e\u7ecf\u6d4e\u538b\u529b\u5927\uff0c\u5bf9\u957f\u671f\u6295\u5165\u8c28\u614e\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u7f3a\u5931**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u914d\u5076\u6216\u5b50\u5973\u610f\u89c1\uff0c\u7528\u6237\u51b3\u7b56\u770b\u4f3c\u72ec\u7acb\uff0c\u4f46\u98ce\u9669\u672a\u77e5\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u7eaf\u5ea6**\uff1aB\u7c7b\uff08\u6df7\u5408\u52a8\u673a\uff09\u3002\u526f\u4e1a\u589e\u6536\u4e3a\u4e3b\uff0c\u5174\u8da3\u4e3a\u8f85\u3002\n*   **\u6b65\u9aa42 - \u8d44\u6e90\u5e95\u5ea7**\uff1aC\u7c7b\uff08\u8d44\u6e90\u5403\u7d27\uff09\u3002\u65f6\u95f4\u788e\u7247\u5316\uff0c\u7ecf\u6d4e\u538b\u529b\u5927\uff0c\u8bbe\u5907\u57fa\u7840\u5f31\u3002\n*   **\u6b65\u9aa43 - \u5fc3\u7406\u5f39\u6027**\uff1aB\u7c7b\uff08\u5f39\u6027\u4e00\u822c\uff09\u3002\u884c\u52a8\u529b\u5c1a\u53ef\uff0c\u4f46\u4fe1\u5fc3\u4e0d\u8db3\uff0c\u6613\u7126\u8651\u3002\n*   **\u7efc\u5408\u5224\u5b9a**\uff1a**B-C\u578b**\uff08\u6df7\u5408\u52a8\u673a\uff0c\u8d44\u6e90\u5403\u7d27\uff09\u3002\u6838\u5fc3\u98ce\u9669\u5728\u4e8e**\u8584\u5f31\u7684\u7ecf\u6d4e\u57fa\u7840\u4e0e\u6a21\u7cca\u7684\u9ad8\u53d8\u73b0\u9884\u671f\u4e4b\u95f4\u7684\u9519\u914d**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**\uff1a**T5 \u7ecf\u6d4e\u654f\u611f\u578b\u5c1d\u9c9c\u8005**\n    *   \u7279\u5f81\uff1a\u53d7\u201c\u526f\u4e1a\u201d\u3001\u201c\u589e\u6536\u201d\u5438\u5f15\uff0c\u5bf9\u4ef7\u683c\u654f\u611f\uff08\u9009\u62e9\u6700\u77ed\u5206\u671f\uff09\uff0c\u652f\u4ed8\u51b3\u7b56\u72b9\u8c6b\uff08\u201c\u4e09\u4e2a\u591a\u6708\u5de5\u8d44\u5462\u201d\uff09\uff0c\u5bf9\u5b66\u4e60\u6295\u5165\u4ea7\u51fa\u6bd4\u6709\u5373\u65f6\u6027\u8981\u6c42\uff0c\u81ea\u6211\u6548\u80fd\u611f\u4f4e\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4e2d\u9ad8)\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u4e0d\u53ca\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u81ea\u8eab\u6c34\u5e73\u8ba4\u77e5\u4f4e\uff08\u201c\u592a\u751f\u4e86\u201d\uff09\uff0c\u82e5\u521d\u671f\u63a5\u5355\u4e0d\u987a\u6216\u53cd\u9988\u4e0d\u4f73\uff0c\u6781\u6613\u4ea7\u751f\u201c\u5b66\u4e0d\u4f1a\u201d\u7684\u632b\u8d25\u611f\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u9ad8\u98ce\u9669**\u3002\u660e\u786e\u8868\u8fbe\u652f\u4ed8\u538b\u529b\uff0c\u5206\u671f\u8fd8\u6b3e\u53ef\u80fd\u52a0\u5267\u7126\u8651\uff0c\u6210\u4e3a\u9000\u8d39\u5bfc\u706b\u7d22\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u4e2d\u98ce\u9669**\u3002\u5f53\u524d\u5de5\u4f5c\u7e41\u5fd9\uff0c\u4f46\u9000\u4f11\u540e\u65f6\u95f4\u5145\u88d5\uff0c\u5173\u952e\u5728\u4e8e\u80fd\u5426\u575a\u6301\u5230\u9000\u4f11\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u672a\u77e5\u98ce\u9669**\u3002\u4fe1\u606f\u7f3a\u5931\uff0c\u9700\u6392\u67e5\u3002\n    5.  **\u9500\u552e\u8bef\u5bfc**\uff1a**\u4e2d\u98ce\u9669**\u3002\u9500\u552e\u5b58\u5728**\u8fc7\u5ea6\u627f\u8bfa\u503e\u5411**\uff08\u201c\u5e26\u4f60\u5165\u884c\u201d\u3001\u201c\u8ba9\u4f60\u58f0\u97f3\u5347\u503c\u201d\u3001\u201c\u5b89\u6392\u5341\u51e0\u672c\u65b0\u624b\u4e66\u201d\uff09\uff0c\u53ef\u80fd\u62c9\u9ad8\u7528\u6237\u9884\u671f\u3002\n    6.  **\u670d\u52a1\u4f53\u9a8c**\uff1a\u4f4e\u98ce\u9669\u3002\u76ee\u524d\u4e92\u52a8\u826f\u597d\u3002\n    7.  **\u7ade\u54c1/\u66ff\u4ee3\u65b9\u6848**\uff1a\u4f4e\u98ce\u9669\u3002\u672a\u63d0\u53ca\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u4e3b\u8981\u96f7\u533a**\uff1a\n    *   **\u3010\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u5938\u5927\u5ba3\u4f20\u3011**\uff1a\u9500\u552e\u591a\u6b21\u4f7f\u7528\u201c\u5e26\u4f60\u5165\u884c\u201d\u3001\u201c\u58f0\u97f3\u5347\u503c\u201d\u3001\u201c\u5b89\u6392\u4e66\u5355\u201d\u7b49\u8bdd\u672f\uff0c\u6697\u793a\u8d44\u6e90\u4fdd\u969c\u548c\u53d8\u73b0\u786e\u5b9a\u6027\uff0c**\u5b58\u5728\u8bef\u5bfc\u98ce\u9669**\u3002\n    *   **\u3010\u5236\u9020\u7a00\u7f3a\u4e0e\u7d27\u8feb\u611f\u3011**\uff1a\u9891\u7e41\u4f7f\u7528\u201c\u6700\u540e\u4e00\u5929\u201d\u3001\u201c\u540d\u989d\u8981\u6ca1\u6709\u4e86\u201d\u3001\u201c\u73b0\u573a\u53d1\u4f18\u60e0\u5238\u201d\u7b49\u9650\u65f6\u4fc3\u9500\u8bdd\u672f\uff0c\u662f\u5408\u89c4\u9ad8\u538b\u7ebf\u3002\n    *   **\u3010\u672a\u5145\u5206\u63d0\u793a\u98ce\u9669\u3011**\uff1a\u672a\u6e05\u6670\u8bf4\u660e\u6709\u58f0\u884c\u4e1a\u6210\u529f\u7387\u3001\u6536\u5165\u6ce2\u52a8\u6027\u3001\u8bbe\u5907\u6295\u5165\u5fc5\u8981\u6027\u7b49\uff0c**\u672a\u5e73\u8861\u7528\u6237\u9884\u671f**\u3002\n    *   **\u3010\u56de\u907f\u5173\u952e\u95ee\u9898\u3011**\uff1a\u5f53\u7528\u6237\u8be2\u95ee\u201c\u540e\u671f\u600e\u4e48\u8054\u7cfb\u4f60\u201d\u65f6\uff0c\u56de\u7b54\u6a21\u7cca\uff08\u201c\u6211\u662f\u6559\u804c\u4eba\u5458\u4e00\u76f4\u90fd\u5728\u7684\u201d\uff09\uff0c\u672a\u660e\u786e\u552e\u540e\u4e0e\u9500\u552e\u89d2\u8272\u5206\u79bb\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**\uff1a**\u504f\u5dee**\u3002\u7528\u6237\u7ecf\u6d4e\u654f\u611f\u3001\u4fe1\u5fc3\u4e0d\u8db3\uff0c\u5374\u62a5\u540d\u4e86\u4ee5\u201c\u5feb\u901f\u63a5\u5355\u201d\u4e3a\u5356\u70b9\u7684\u8bad\u7ec3\u8425\u4ea7\u54c1\uff0c\u6613\u56e0\u521d\u671f\u53d8\u73b0\u56f0\u96be\u800c\u6d41\u5931\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a\n    1.  **24\u5c0f\u65f6\u5185\u8fdb\u884c\u9884\u671f\u7ba1\u7406\u8bbf\u8c08**\uff1a\u9996\u8981\u4efb\u52a1\u662f**\u6821\u6b63\u5176\u4e0d\u5207\u5b9e\u9645\u7684\u5feb\u901f\u53d8\u73b0\u9884\u671f**\u3002\u660e\u786e\u544a\u77e5\u6709\u58f0\u6f14\u64ad\u7684\u5b66\u4e60\u66f2\u7ebf\u3001\u521d\u671f\u6295\u5165\uff08\u65f6\u95f4\u3001\u53ef\u80fd\u9700\u8981\u7684\u8bbe\u5907\uff09\u3001\u6536\u5165\u7684\u4e0d\u786e\u5b9a\u6027\uff0c\u5c06\u5176\u76ee\u6807\u4ece\u201c\u63a5\u5355\u8d5a\u94b1\u201d\u8c03\u6574\u4e3a\u201c\u9000\u4f11\u524d\u57f9\u517b\u5174\u8da3\u4e0e\u6280\u80fd\u201d\u3002\n    2.  **\u5efa\u7acb\u4fe1\u4efb\u4e0e\u60c5\u611f\u652f\u6301**\uff1a\u7528\u6237\u8868\u8fbe\u201c\u8ddf\u5b9a\u4f60\u4e86\u201d\uff0c\u60c5\u611f\u4f9d\u8d56\u5f3a\u3002\u73ed\u4e3b\u4efb\u9700\u627f\u63a5\u6b64\u4fe1\u4efb\uff0c\u591a\u7ed9\u4e88\u5177\u4f53\u3001\u7ec6\u5fae\u7684\u8fdb\u6b65\u80af\u5b9a\uff0c\u5bf9\u6297\u5176\u81ea\u6211\u6000\u7591\u3002\n    3.  **\u63d0\u4f9b\u4f4e\u6210\u672c\u542f\u52a8\u65b9\u6848**\uff1a\u8ba4\u53ef\u5176\u7528\u624b\u673a\u7ec3\u4e60\u7684\u8d77\u6b65\u65b9\u5f0f\uff0c\u524d\u671f\u907f\u514d\u65bd\u52a0\u8bbe\u5907\u8d2d\u4e70\u538b\u529b\u3002\u5236\u5b9a\u7b26\u5408\u5176\u788e\u7247\u5316\u65f6\u95f4\u7684\u7ec3\u4e60\u8ba1\u5212\u3002\n    4.  **\u9690\u6027\u6838\u67e5\u5bb6\u5ead\u652f\u6301\u5ea6**\uff1a\u5728\u65e5\u5e38\u6c9f\u901a\u4e2d\u81ea\u7136\u4e86\u89e3\u5176\u5bb6\u5ead\u5bf9\u6b64\u6b21\u5b66\u4e60\u6295\u5165\u7684\u6001\u5ea6\u3002\n    5.  **\u91cd\u70b9\u5173\u6ce8\u9996\u6708\u5b66\u4e60\u53cd\u9988**\uff1a\u9996\u6708\u662f\u4fe1\u5fc3\u5efa\u7acb\u6216\u5d29\u584c\u7684\u5173\u952e\u671f\uff0c\u9700\u9ad8\u9891\u3001\u79ef\u6781\u4e92\u52a8\uff0c\u786e\u4fdd\u5176\u80fd\u5b8c\u6210\u57fa\u7840\u4efb\u52a1\uff0c\u83b7\u5f97\u6b63\u5411\u53cd\u9988\u3002\n\n{\"core_type\": \"T5 \u7ecf\u6d4e\u654f\u611f\u578b\u5c1d\u9c9c\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\u9ad8\", \"product_match\": \"\u504f\u5dee\", \"action\": \"24h\u5185\u6821\u6b63\u53d8\u73b0\u9884\u671f\u4e0e\u5efa\u7acb\u4fe1\u4efb\"}";
