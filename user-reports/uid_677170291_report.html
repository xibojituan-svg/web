    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n- **\u52a8\u673a\u7eaf\u5ea6 (\u9ad8)**: \u804c\u4e1a\u76f8\u5173\u6027\u5f3a\uff08\u58f0\u97f3\u76f8\u5173\u884c\u4e1a\u4ece\u4e1a\u8005\uff09\uff0c\u6709\u660e\u786e\u804c\u4e1a\u53d1\u5c55\u76ee\u6807\uff08\u6df1\u8015\u58f0\u97f3\u9886\u57df\uff09\uff0c\u6301\u6709\u666e\u901a\u8bdd\u4e8c\u7532\u8bc1\u4e66\uff0c\u5177\u5907\u4e13\u4e1a\u57fa\u7840\u3002\u5b66\u4e60\u76ee\u7684\u660e\u786e\uff08\u57f9\u517b\u80fd\u529b\u3001\u591a\u4e00\u9879\u6280\u80fd\uff09\uff0c**\u975e\u5355\u7eaf\u201c\u8d5a\u5feb\u94b1\u201d\u5fc3\u6001**\uff08\u660e\u786e\u8868\u793a\u201c\u4e0d\u6025\u7740\u8d5a\u94b1\u201d\uff09\u3002\n- **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d)**: \u5728\u804c\u72b6\u6001\uff08\u65e9\u516b\u665a\u516d\uff0c\u5468\u4e94\u81f3\u5468\u65e5\u6700\u5fd9\uff09\uff0c\u8868\u660e\u6709\u7a33\u5b9a\u5de5\u4f5c\uff08\u82f1\u8bed\u8001\u5e08\uff09\uff0c\u5177\u5907\u82f1\u8bed\u53e3\u8bed\u7279\u957f\u3002\u65f6\u95f4\u8d44\u6e90\u7d27\u5f20\u4f46\u80fd\u4e3b\u52a8\u534f\u8c03\uff08\u627f\u8bfa\u8865\u8bfe\uff09\u3002\u652f\u4ed82380\u5143\u62a5\u540d\u9ad8\u9636\u73ed\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u7ecf\u6d4e\u57fa\u7840\u3002\n- **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u9ad8)**: \u5b66\u4e60\u6001\u5ea6\u79ef\u6781\uff08\u4e3b\u52a8\u63d0\u4ea4\u4f5c\u4e1a\u3001\u5bfb\u6c42\u53cd\u9988\u3001\u4e3b\u52a8\u8865\u8bfe\uff09\uff0c\u80fd\u63a5\u53d7\u6279\u8bc4\u5e76\u5bfb\u6c42\u6539\u8fdb\uff08\u591a\u6b21\u81ea\u6211\u6279\u8bc4\u5f55\u97f3\u201c\u522b\u626d\u201d\u3001\u201c\u5c2c\u201d\uff09\u3002\u9762\u5bf9\u6280\u672f\u969c\u788d\uff08\u627e\u4e0d\u5230\u76f4\u64ad\u94fe\u63a5\uff09\u8868\u73b0\u51fa**\u8f83\u5f3a\u7126\u8651\u548c\u6025\u5207**\uff0c\u4f46\u95ee\u9898\u89e3\u51b3\u540e\u8fc5\u901f\u6062\u590d\u79ef\u6781\u72b6\u6001\u3002\u6709\u660e\u786e\u7684\u81ea\u6211\u63d0\u5347\u9a71\u52a8\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n- **\u6b65\u9aa40 \u652f\u4ed8\u6838\u67e5**: \u5df2\u652f\u4ed82380\u5143\u62a5\u540d\u9ad8\u9636\u73ed\uff08\u201c\u6500\u767b\u8ba1\u5212\u201d\uff09\uff0c\u652f\u4ed8\u52a8\u4f5c\u5b8c\u6210\u3002\n- **\u6b65\u9aa41.5 \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u914d\u5076\u3001\u7236\u6bcd\u7b49\u7b2c\u4e09\u65b9\u51b3\u7b56\u8005\u3002\u7528\u6237\u5168\u7a0b\u81ea\u4e3b\u51b3\u7b56\u9009\u4e66\u3001\u62a5\u540d\uff0c\u663e\u793a**\u72ec\u7acb\u51b3\u7b56\u6743\u9ad8**\u3002\n- **\u6b65\u9aa41 \u52a8\u673a\u7eaf\u5ea6 (A)**: \u9ad8\u3002\u804c\u4e1a\u5173\u8054+\u6280\u80fd\u63d0\u5347+\u5174\u8da3\u9a71\u52a8\u3002\n- **\u6b65\u9aa42 \u8d44\u6e90\u5e95\u5ea7 (B)**: \u4e2d\u3002\u6709\u7a33\u5b9a\u5de5\u4f5c\u4e0e\u652f\u4ed8\u80fd\u529b\uff0c\u4f46\u65f6\u95f4\u53d7\u5168\u804c\u5de5\u4f5c\u9650\u5236\u3002\n- **\u6b65\u9aa43 \u5fc3\u7406\u5f39\u6027 (B)**: \u4e2d\u9ad8\u3002\u5b66\u4e60\u6295\u5165\u5ea6\u9ad8\uff0c\u4f46\u6613\u56e0\u64cd\u4f5c\u95ee\u9898\u4ea7\u751f\u7126\u8651\u3002\n- **\u5224\u5b9a\u7ed3\u679c**: **A-B-B\u578b**\u3002\u9ad8\u52a8\u673a\u3001\u4e2d\u7b49\u8d44\u6e90\u4e0e\u5fc3\u7406\u5f39\u6027\u7684\u6f5c\u529b\u7528\u6237\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n- **T4 \u52a1\u5b9e\u8fdb\u53d6\u578b**: \u6838\u5fc3\u7279\u5f81\u5339\u914d\u5ea6\u9ad8\u3002\u804c\u4e1a\u80cc\u666f\u4e0e\u5b66\u4e60\u76ee\u6807\u5f3a\u76f8\u5173\uff0c\u8ffd\u6c42\u5b9e\u7528\u6280\u80fd\u63d0\u5347\uff08\u6f14\u64ad\u6280\u5de7\u3001\u5bf9\u8f68\u3001\u5ba1\u542c\u7b49\u591a\u5de5\u79cd\u5174\u8da3\uff09\uff0c\u6709\u660e\u786e\u7684\u81ea\u6211\u6295\u8d44\u548c\u804c\u4e1a\u53d1\u5c55\u89c4\u5212\u3002**\u975e\u51b2\u52a8\u6d88\u8d39\uff0c\u51b3\u7b56\u57fa\u4e8e\u7406\u6027\u8bc4\u4f30**\uff08\u5148\u4f53\u9a8c\u8bad\u7ec3\u8425\u518d\u51b3\u5b9a\u62a5\u73ed\uff09\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4e2d\u4f4e)\n\u9010\u9879\u6392\u67e5\uff1a\n1.  **\u6548\u679c\u4e0d\u53ca\u9884\u671f**: \u98ce\u9669\u4f4e\u3002\u7528\u6237\u5bf9\u81ea\u8eab\u6c34\u5e73\u6709\u6e05\u6670\u8ba4\u77e5\uff08\u201c\u57fa\u672c\u529f\u4e0d\u5230\u4f4d\u201d\uff09\uff0c\u9884\u671f\u7ba1\u7406\u8f83\u597d\uff0c\u4e14\u5b66\u4e60\u76ee\u7684\u504f\u91cd\u80fd\u529b\u6210\u957f\u800c\u975e\u5373\u65f6\u53d8\u73b0\u3002\n2.  **\u7ecf\u6d4e\u538b\u529b**: \u98ce\u9669\u4f4e\u3002\u5df2\u652f\u4ed8\uff0c\u4e14\u672a\u8868\u73b0\u51fa\u4ef7\u683c\u654f\u611f\u6216\u72b9\u8c6b\u3002\n3.  **\u65f6\u95f4\u51b2\u7a81**: \u98ce\u9669**\u4e2d**\u3002\u7528\u6237\u5de5\u4f5c\u7e41\u5fd9\uff08\u65e9\u516b\u665a\u516d\uff09\uff0c\u591a\u6b21\u56e0\u5de5\u4f5c\u9519\u8fc7\u76f4\u64ad\u5e76\u4ea7\u751f\u7126\u8651\u3002**\u8fd9\u662f\u4e3b\u8981\u98ce\u9669\u70b9**\uff0c\u53ef\u80fd\u5f71\u54cd\u540e\u7eed\u8bfe\u7a0b\u51fa\u52e4\u4e0e\u5b8c\u6210\u7387\u3002\n4.  **\u5bb6\u5ead\u53cd\u5bf9**: \u98ce\u9669\u4f4e\u3002\u672a\u63d0\u53ca\u3002\n5.  **\u7ade\u54c1\u6bd4\u8f83/\u540e\u6094**: \u98ce\u9669\u4f4e\u3002\u52a8\u673a\u5185\u751f\uff0c\u5bf9\u9500\u552e\u548c\u8bfe\u7a0b\u5185\u5bb9\u8868\u73b0\u51fa\u4fe1\u4efb\u4e0e\u8ba4\u53ef\u3002\n6.  **\u670d\u52a1\u4f53\u9a8c**: \u98ce\u9669\u4f4e\u3002\u867d\u6709\u56e0\u627e\u4e0d\u5230\u94fe\u63a5\u4ea7\u751f\u7684\u77ed\u6682\u5f3a\u70c8\u7126\u8651\uff08\u201c\u6025\u6b7b\u4e86\u201d\u3001\u201c\u534a\u4e2a\u5c0f\u65f6\u4e86\u201d\uff09\uff0c\u4f46\u95ee\u9898\u89e3\u51b3\u540e\u60c5\u7eea\u8fc5\u901f\u5e73\u590d\uff0c\u5bf9\u9500\u552e\u4fdd\u6301\u793c\u8c8c\u3002\n7.  **\u91cd\u5927\u53d8\u6545**: \u57fa\u4e8e\u73b0\u6709\u4fe1\u606f\uff0c\u98ce\u9669\u4f4e\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n- **\u98ce\u9669\u70b9**: \u9500\u552e\u5728\u50ac\u4fc3\u53c2\u4e0e\u76f4\u64ad\u65f6\u4f7f\u7528\u4e86\u201c\u5173\u7cfb\u5230\u80fd\u4e0d\u80fd\u901a\u5173\u6210\u529f\u201d\u3001\u201c\u6ca1\u53e3\u4ee4\u53d6\u6d88\u62db\u52df\u8d44\u683c\u201d\u7b49\u8bdd\u672f\uff0c**\u5b58\u5728\u5229\u7528\u8003\u6838\u548c\u7a00\u7f3a\u6027\u5236\u9020\u7d27\u8feb\u611f\u7684\u503e\u5411**\u3002\u4f46\u672a\u53d1\u73b0\u865a\u5047\u627f\u8bfa\u6536\u5165\u3001\u8bcb\u6bc1\u540c\u884c\u7b49\u7ea2\u7ebf\u95ee\u9898\u3002\n- **\u5408\u89c4\u6027**: \u6574\u4f53\u6d41\u7a0b\u5408\u89c4\uff0c\u7528\u6237\u62a5\u540d\u57fa\u4e8e\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u7684\u8ba4\u53ef\u548c\u81ea\u8eab\u804c\u4e1a\u89c4\u5212\u3002\u9500\u552e\u5728\u7528\u6237\u7126\u8651\u65f6\u63d0\u4f9b\u4e86\u89e3\u51b3\u65b9\u6848\uff08\u8865\u53d1\u94fe\u63a5\uff09\uff0c\u672a\u51fa\u73b0\u5931\u8054\u6216\u63a8\u8bff\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n- **\u6838\u5fc3\u7b56\u7565**: **\u63d0\u4f9b\u5f3a\u652f\u6301\u611f\u4e0e\u7075\u6d3b\u6027**\uff0c\u5316\u89e3\u5176\u65f6\u95f4\u51b2\u7a81\u7126\u8651\uff0c\u5de9\u56fa\u5176\u52a1\u5b9e\u8fdb\u53d6\u7684\u5b66\u4e60\u52a8\u673a\u3002\n- **\u884c\u52a8\u6307\u5357**:\n    1.  **\u7834\u51b0\u4e0e\u9884\u671f\u7ba1\u7406**: \u80af\u5b9a\u5176\u804c\u4e1a\u80cc\u666f\u4e0e\u5b66\u4e60\u6001\u5ea6\uff0c\u660e\u786e\u544a\u77e5\u8bfe\u7a0b\u652f\u6301\u56de\u770b\uff0c\u7f13\u89e3\u5176\u56e0\u5de5\u4f5c\u65f6\u95f4\u4ea7\u751f\u7684\u51fa\u52e4\u538b\u529b\u3002\n    2.  **\u65f6\u95f4\u89c4\u5212\u534f\u52a9**: \u4e3b\u52a8\u534f\u52a9\u5236\u5b9a\u7075\u6d3b\u7684\u5b66\u4e60\u8ba1\u5212\uff0c\u5229\u7528\u5176\u201c\u8865\u8bfe\u201d\u4e60\u60ef\uff0c\u5c06\u5b66\u4e60\u4efb\u52a1\u6a21\u5757\u5316\u3002\n    3.  **\u53cd\u9988\u4e0e\u6fc0\u52b1**: \u9488\u5bf9\u5176\u201c\u81ea\u6211\u8981\u6c42\u9ad8\u3001\u6613\u89c9\u4e0d\u8db3\u201d\u7684\u7279\u70b9\uff0c\u63d0\u4f9b\u5177\u4f53\u3001\u53ca\u65f6\u7684\u4f5c\u4e1a\u53cd\u9988\uff0c\u5f3a\u8c03\u8fdb\u6b65\u800c\u975e\u5b8c\u7f8e\u3002\n    4.  **\u98ce\u9669\u76d1\u63a7**: \u5bc6\u5207\u5173\u6ce8\u5176\u8bfe\u7a0b\u8fdb\u5ea6\uff0c\u82e5\u51fa\u73b0\u56e0\u5de5\u4f5c\u803d\u8bef\u5b66\u4e60\u7684\u60c5\u51b5\uff0c\u9700\u7b2c\u4e00\u65f6\u95f4\u4e3b\u52a8\u4ecb\u5165\u63d0\u4f9b\u652f\u6301\uff0c\u9632\u6b62\u79ef\u7d2f\u632b\u8d25\u611f\u3002\n    5.  **\u8d44\u6e90\u94fe\u63a5**: \u5229\u7528\u5176\u82f1\u8bed\u8001\u5e08\u80cc\u666f\u548c\u5174\u8da3\uff08\u82f1\u8bed\u5411\u3001\u513f\u7ae5\u5411\uff09\uff0c\u63a8\u8350\u76f8\u5173\u4e13\u9898\u8d44\u6e90\u6216\u5b66\u4e60\u5c0f\u7ec4\uff0c\u589e\u5f3a\u5f52\u5c5e\u611f\u4e0e\u4ef7\u503c\u611f\u3002\n- **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**: \u5df2\u5339\u914d\u201c\u6500\u767b\u8ba1\u5212\u201d\u9ad8\u9636\u73ed\u3002\u53ef\u540e\u7eed\u5173\u6ce8\u5176\u5b66\u4e60\u8fdb\u5c55\uff0c\u9002\u65f6\u63a8\u8350**\u4e13\u9898\u7cbe\u8fdb\u8bfe\uff08\u5982\u513f\u7ae5\u6545\u4e8b\u6f14\u64ad\u3001\u82f1\u8bed\u914d\u97f3\uff09\u6216\u6280\u80fd\u62d3\u5c55\u8bfe\uff08\u5982\u540e\u671f\u5236\u4f5c\uff09**\uff0c\u7b26\u5408\u5176\u201c\u591a\u6280\u80fd\u53d1\u5c55\u201d\u7684\u8bc9\u6c42\u3002\n\n{\"core_type\": \"T4 \u52a1\u5b9e\u8fdb\u53d6\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u6500\u767b\u8ba1\u5212\uff08\u5df2\u6302\u8f7d\uff09\uff0c\u540e\u7eed\u53ef\u5339\u914d\u4e13\u9898\u7cbe\u8fdb\u8bfe\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u5973\uff08\u4ece\u5bf9\u8bdd\u8bed\u6c14\u548c\u5934\u50cf\u63a8\u65ad\uff09\", \"city\": \"\u672a\u77e5\"}";
