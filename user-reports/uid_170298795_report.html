    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 170298795 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-16 \u81f3 2026-03-27 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u661f\u665a(\u5a04\u742a\u7476) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u77ed\u6545\u4e8b\u521b\u4f5c\u8bfe (\u57fa\u7840\u73ed) + \u610f\u5411\u77ed\u5267\u8fdb\u9636\u73ed (\u8865\u5dee\u4ef71500\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u8d44\u91d1\u7d27\u5f20** (\u63d0\u53ca\u5bb6\u5ead\u964d\u85aa1/3\uff0c\u4e2a\u4eba\u751f\u6d3b\u5bb6\u5ead\u5f00\u652f\u5927\uff0c\u8377\u5305\u627f\u53d7\u4e0d\u4e86) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u767d\u5929\u4e0a\u73ed\uff0c\u4ec5\u665a\u4e0a\u548c\u5468\u672b\u6709\u65f6\u95f4\uff0c\u9700\u517c\u987e\u5b69\u5b50\u5b66\u4e60\u8f85\u5bfc) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u5bb6\u4eba\u77e5\u60c5** (\u63d0\u53ca\u5bb6\u5ead\u964d\u85aa\u3001\u517b\u5bb6\u7cca\u53e3\u3001\u5e2e\u8865\u5bb6\u7528\uff0c\u4f46\u672a\u63d0\u53ca\u53cd\u5bf9) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** (\u5b66\u4e60\u6001\u5ea6\u3001\u5bb6\u5ead\u60c5\u51b5\u3001\u7ecf\u6d4e\u538b\u529b\u3001\u5174\u8da3\u52a8\u673a\u5747\u6709\u660e\u786e\u8868\u8fbe) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u27a1\u4e2d\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u80fd\u529b\u5174\u8da3\u4e0e\u53d8\u73b0\u7126\u8651\u6df7\u5408\u9a71\u52a8**\u3002\u4e00\u65b9\u9762\u8868\u8fbe\u5bf9\u5c0f\u8bf4\u5199\u4f5c\u7684\u6d53\u539a\u5174\u8da3\uff08\u201c\u8d85\u7ea7\u65e0\u654c\u559c\u6b22\u201d\uff09\uff0c\u53e6\u4e00\u65b9\u9762\u56e0\u5bb6\u5ead\u7ecf\u6d4e\u538b\u529b\uff08\u964d\u85aa\uff09\u800c\u5f3a\u70c8\u5e0c\u671b\u517c\u804c\u8d5a\u94b1\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u6211\u4e5f\u60f3\u505a\u517c\u804c\u8d5a\u94b1\u201d\n> \u201c\u6211\u8fd9\u4e2a\u5f88\u60f3\u5199\u5c0f\u8bf4\u77ed\u5267\u8d5a\u94b1 \u4e0d\u8bf4\u6539\u5584\u5bb6\u91cc\u4eba\u751f\u6d3b \u5c31\u662f\u4fdd\u8bc1\u751f\u5b58 \u4fdd\u8bc1\u76ee\u524d\u751f\u5b58\u8d28\u91cf\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 **\u8d44\u91d1\u627f\u8f7d\u529b\uff1a\u4f4e** \u2014 \u660e\u786e\u63d0\u53ca\u201c\u4ece\u524d\u5e74\u5f00\u59cb\u5c31\u964d\u85aa\u4e09\u5206\u4e4b\u4e00\u201d\u3001\u201c\u517b\u5bb6\u7cca\u53e3\u7684\u6536\u5165\u672c\u6765\u4e0d\u591a\u8fd8\u5c11\u4e86\u8fd9\u4e48\u591a\u201d\u3001\u201c\u4e2a\u4eba\u751f\u6d3b\u5bb6\u5ead\u5f00\u652f\u90fd\u5f88\u5927 \u4e2a\u4e2a\u6708\u90fd\u641e \u8377\u5305\u4e5f\u627f\u53d7\u4e0d\u4e86\u201d\u3002\u652f\u4ed8\u8fdb\u9636\u8bfe\u7a0b\u9700\u201c\u5faa\u5e8f\u6e10\u8fdb\u201d\uff0c\u7ecf\u6d4e\u538b\u529b\u5927\u3002\n- \u23f1 **\u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a\u4f4e** \u2014 \u767d\u5929\u4e0a\u73ed\uff0c\u665a\u4e0a\u548c\u5468\u672b\u5b66\u4e60\uff0c\u4f46\u9700\u540c\u65f6\u8f85\u5bfc8\u5c81\u654f\u611f\u5973\u513f\u5b66\u4e60\uff08\u201c\u4e00\u8fb9\u542c\u8bfe\u4e00\u8fb9\u4e5f\u8f85\u5bfc\u5b69\u5b50\u5b66\u4e60\u201d\uff09\uff0c\u81ea\u8ff0\u201c\u6700\u8fd1\u4e0d\u505c\u4e0a\u8bfe \u597d\u7d2f\u554a\u201d\u3001\u201c\u611f\u89c9\u975e\u5e38\u75b2\u60eb\u201d\u3002\u65f6\u95f4\u88ab\u5de5\u4f5c\u548c\u80b2\u513f\u9ad8\u5ea6\u6324\u538b\uff0c\u7cbe\u529b\u5206\u6563\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 **\u5bb6\u5ead\u652f\u6301\u5ea6\uff1a\u4e2d** \u2014 \u5bb6\u5ead\u60c5\u51b5\u77e5\u60c5\uff08\u63d0\u53ca\u517b\u5bb6\u7cca\u53e3\uff09\uff0c\u4f46\u5bb6\u5ead\u8d1f\u62c5\uff08\u5b69\u5b50\u6559\u80b2\u3001\u7ecf\u6d4e\u538b\u529b\uff09\u662f\u4e3b\u8981\u538b\u529b\u6e90\u800c\u975e\u652f\u6301\u6e90\u3002\n- **\u5e95\u5ea7\u53d6\u77ed\u677f**\uff1a**\u4f4e** (\u8d44\u91d1\u548c\u65f6\u95f4\u7cbe\u529b\u53cc\u4f4e)\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56**\u3002\u5b66\u4e60\u521d\u671f\u5373\u8868\u8fbe\u8ff7\u832b\uff08\u201c\u5f88\u8ff7\u832b\u201d\u3001\u201c\u6211\u89c9\u5f97\u597d\u96be\u201d\uff09\uff0c\u5bf9\u5b69\u5b50\u7684\u6559\u80b2\u95ee\u9898\u8868\u73b0\u51fa\u9ad8\u5ea6\u7126\u8651\u548c\u65e0\u52a9\uff08\u201c\u6211\u771f\u7684\u6ca1\u6709\u529e\u6cd5\u4e86\u201d\u3001\u201c\u5b69\u5b50\u6027\u683c\u975e\u5e38\u654f\u611f\u81ea\u5351\u201d\uff09\uff0c\u60c5\u7eea\u6613\u53d7\u5916\u754c\uff08\u5b69\u5b50\u6210\u7ee9\u3001\u8bfe\u7a0b\u96be\u5ea6\uff09\u5f71\u54cd\uff0c\u4f9d\u8d56\u8001\u5e08\u9f13\u52b1\u548c\u5b89\u629a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u6211\u73b0\u5728\u770b\u4e0d\u6e05\u8fd9\u4e2a\u6545\u4e8b\u4e86\uff0c\u5f88\u8ff7\u832b\u201d\n> \u201c\u6211\u771f\u7684\u6ca1\u6709\u529e\u6cd5\u4e86\u201d\uff08\u8c08\u53ca\u5b69\u5b50\u8003\u8bd5\uff09\n> \u201c\u6211\u5b69\u5b50\u6027\u683c\u975e\u5e38\u654f\u611f\u81ea\u5351\u7684\uff0c\u5982\u679c\u8fd9\u6b21\u8fd8\u8003\u7838 \u80af\u5b9a\u5f88\u4f24\u5fc3\u5f88\u4f24\u5fc3\u7684\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u56e0\u4e3b\u4e1a\u6536\u5165\u9aa4\u964d\uff08\u964d\u85aa1/3\uff09\u5f15\u53d1\u7684\u5bb6\u5ead\u7ecf\u6d4e\u5b89\u5168\u7126\u8651**\uff0c\u4ee5\u53ca\u5bf9\u5b69\u5b50\u6559\u80b2\u7684\u9ad8\u5ea6\u7126\u8651\u3002\u5b66\u4e60\u52a8\u673a\u6df7\u6742\u7740\u5bf9\u5199\u4f5c\u7684\u5174\u8da3\uff0c\u4f46\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u201c\u4fdd\u8bc1\u751f\u5b58\u8d28\u91cf\u201d\u548c\u201c\u5e2e\u8865\u5bb6\u7528\u201d\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u63d0\u4f9b\u786e\u5b9a\u6027\u7684\u5b66\u4e60\u8def\u5f84\u548c\u6e29\u548c\u7684\u9f13\u52b1\uff0c\u540c\u65f6\u8c28\u614e\u7ba1\u7406\u5176\u53d8\u73b0\u9884\u671f\uff0c\u907f\u514d\u56e0\u77ed\u671f\u65e0\u6cd5\u53d8\u73b0\u800c\u52a0\u5267\u5176\u7126\u8651\u548c\u5d29\u6e83\u98ce\u9669\u3002**\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b\uff08\u51b2\u52a8\u98ce\u9669\u578b\uff09** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u89e6\u53d1\u501f\u8d37\u3001\u7edd\u5883\u7b49D\u7c7b\u7ea2\u7ebf\uff0c\u4f46**\u8d44\u91d1\u627f\u8f7d\u529b\u4f4e**\u548c**\u5fc3\u7406\u5f39\u6027\u6781\u4f4e**\u662f\u9ad8\u98ce\u9669\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4e2d | \u7ecf\u6d4e\u538b\u529b\u5927\uff0c\u82e5\u5b66\u4e60\u6295\u5165\uff08\u65f6\u95f4\u3001\u91d1\u94b1\uff09\u77ed\u671f\u5185\u672a\u89c1\u6536\u76ca\uff0c\u53ef\u80fd\u5f15\u53d1\u5bb6\u5ead\u5185\u90e8\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u65f6\u95f4\u7cbe\u529b\u4e25\u91cd\u4e0d\u8db3**\uff08\u5de5\u4f5c+\u80b2\u513f+\u5b66\u4e60\uff09\uff0c\u6781\u6613\u56e0\u75b2\u60eb\u3001\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u5fc3\u7406\u5f39\u6027\u6781\u4f4e**\uff0c\u9047\u5230\u5b66\u4e60\u632b\u6298\uff08\u5982\u4f5c\u4e1a\u96be\u3001\u6295\u7a3f\u88ab\u62d2\uff09\u6216\u5b69\u5b50\u6559\u80b2\u95ee\u9898\u53e0\u52a0\u65f6\uff0c\u6781\u6613\u60c5\u7eea\u5d29\u6e83\uff0c\u5f52\u548e\u4e8e\u8bfe\u7a0b\u201c\u6ca1\u7528\u201d\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | \u6838\u5fc3\u8bc9\u6c42\u662f\u201c\u5e2e\u8865\u5bb6\u7528\u201d\uff0c\u82e5\u8bfe\u7a0b\u7ed3\u675f\u540e\u77ed\u671f\u5185\u65e0\u6cd5\u83b7\u5f97\u7ecf\u6d4e\u56de\u62a5\uff0c\u4f1a\u4ea7\u751f\u5f3a\u70c8\u88ab\u6b3a\u9a97\u611f\u548c\u6124\u6012\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-3\u5468\u540e**\uff0c\u5f53\u8bfe\u7a0b\u96be\u5ea6\u63d0\u5347\u3001\u4f5c\u4e1a\u538b\u529b\u589e\u5927\uff0c\u540c\u65f6\u5bb6\u5ead\uff08\u5b69\u5b50\u8003\u8bd5\uff09\u548c\u5de5\u4f5c\u538b\u529b\u53e0\u52a0\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5609\u9896\u5988\u5988/\u7238\u7238\uff0c\u770b\u5230\u60a8\u8fd9\u4e48\u8ba4\u771f\u4e0a\u8bfe\u8fd8\u60e6\u8bb0\u7740\u5b69\u5b50\u5b66\u4e60\uff0c\u771f\u7684\u592a\u4e0d\u5bb9\u6613\u4e86\u3002\u54b1\u4eec\u5b66\u4e60\u5199\u4f5c\u662f\u4e2a\u6162\u529f\u592b\uff0c\u5c31\u50cf\u966a\u5b69\u5b50\u6210\u957f\u4e00\u6837\uff0c\u6025\u4e0d\u5f97\u3002\u60a8\u5148\u987e\u597d\u5bb6\u91cc\u548c\u5b69\u5b50\uff0c\u8bfe\u7a0b\u54b1\u4eec\u6162\u6162\u8ddf\uff0c\u6709\u56de\u653e\uff0c\u4f5c\u4e1a\u91cf\u529b\u800c\u884c\u3002\u54b1\u4eec\u9996\u8981\u76ee\u6807\u662f\u60a8\u522b\u592a\u7d2f\uff0c\u80fd\u4eab\u53d7\u5199\u4f5c\u8fd9\u4e2a\u8fc7\u7a0b\uff0c\u6709\u70b9\u81ea\u5df1\u7684\u7a7a\u95f4\uff0c\u5c31\u662f\u6700\u5927\u7684\u8fdb\u6b65\u4e86\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\u3011**\u3002**\u4e25\u7981\u7acb\u5373\u63a8\u8350\u77ed\u5267\u8fdb\u9636\u73ed**\u3002\u5f53\u524d\u6838\u5fc3\u662f\u7a33\u4f4f\u5176\u57fa\u7840\u73ed\u5b66\u4e60\uff0c\u63d0\u4f9b\u60c5\u7eea\u652f\u6301\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n    1.  **\u3010\u5f39\u6027\u5b66\u4e60\u5305\u3011**\uff1a\u5141\u8bb8\u5176\u7075\u6d3b\u4f7f\u7528\u56de\u653e\uff0c\u51cf\u8f7b\u76f4\u64ad\u8ddf\u8bfe\u538b\u529b\u3002\n    2.  **\u3010\u8f7b\u91cf\u4f5c\u4e1a\u5305\u3011**\uff1a\u5141\u8bb8\u5176\u63d0\u4ea4\u7b80\u5316\u7248\u6216\u5ef6\u671f\u63d0\u4ea4\u4f5c\u4e1a\uff0c\u964d\u4f4e\u5176\u56e0\u5b8c\u4e0d\u6210\u4f5c\u4e1a\u800c\u4ea7\u751f\u7684\u632b\u8d25\u611f\u3002\n    3.  **\u3010\u5fc3\u7406\u6309\u6469\u5305\u3011**\uff1a\u73ed\u4e3b\u4efb\u5b9a\u671f\u8fdb\u884c\u6e29\u548c\u9f13\u52b1\uff0c\u5173\u6ce8\u5176\u60c5\u7eea\u800c\u975e\u5355\u7eaf\u50ac\u4f5c\u4e1a\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1.  \u7edd\u4e0d\u5bf9\u5176\u4f7f\u7528\u201c\u5feb\u901f\u53d8\u73b0\u201d\u3001\u201c\u6708\u5165\u8fc7\u4e07\u201d\u7b49\u627f\u8bfa\u6027\u8bdd\u672f\u3002\n    2.  \u7edd\u4e0d\u5728\u5176\u8868\u8fbe\u75b2\u60eb\u3001\u7126\u8651\u65f6\u5f3a\u884c\u63a8\u9500\u5347\u73ed\u6216\u52a0\u8bfe\u3002\n    3.  \u7edd\u4e0d\u5bf9\u5176\u65bd\u52a0\u4f5c\u4e1a\u548c\u51fa\u52e4\u538b\u529b\uff0c\u907f\u514d\u6210\u4e3a\u538b\u57ae\u5176\u7684\u6700\u540e\u4e00\u6839\u7a3b\u8349\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u5b8c\u6210\u5f53\u524d\u57fa\u7840\u73ed\u3001\u4e14\u5176\u60c5\u7eea\u548c\u7ecf\u6d4e\u72b6\u51b5\u660e\u663e\u6539\u5584\u524d\uff0c\u7981\u6b62\u63a8\u8350\u4efb\u4f55\u4ed8\u8d39\u8fdb\u9636\u8bfe\u7a0b\u3002\u9500\u552e\u63d0\u53ca\u7684\u201c\u8865\u5dee\u62a5\u77ed\u5267\u8bfe\u201d\u5e94\u7acb\u5373\u53eb\u505c\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u8fd9\u4e2a\u5f88\u60f3\u5199\u5c0f\u8bf4\u77ed\u5267\u8d5a\u94b1 \u4e0d\u8bf4\u6539\u5584\u5bb6\u91cc\u4eba\u751f\u6d3b \u5c31\u662f\u4fdd\u8bc1\u751f\u5b58 \u4fdd\u8bc1\u76ee\u524d\u751f\u5b58\u8d28\u91cf\u201d\n2. > \u201c\u6700\u8fd1\u4e0d\u505c\u4e0a\u8bfe \u597d\u7d2f\u554a\u201d\u3001\u201c\u611f\u89c9\u975e\u5e38\u75b2\u60eb\u201d\n3. > \u201c\u6211\u771f\u7684\u6ca1\u6709\u529e\u6cd5\u4e86\u201d\u3001\u201c\u6211\u5b69\u5b50\u6027\u683c\u975e\u5e38\u654f\u611f\u81ea\u5351\u7684\uff0c\u5982\u679c\u8fd9\u6b21\u8fd8\u8003\u7838 \u80af\u5b9a\u5f88\u4f24\u5fc3\u5f88\u4f24\u5fc3\u7684\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6\u60c5\u7eea\u5de8\u5a74\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u7ecf\u6d4e\u4e0e\u5bb6\u5ead\u53cc\u91cd\u538b\u529b\u4e0b\u7684\u5b89\u5168\u7126\u8651\uff08\u7b2c\u4e8c\u5c42\uff09**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u6781\u81f4\u7684\u60c5\u611f\u5b89\u629a\u4e0e\u538b\u529b\u8c41\u514d\uff0c\u575a\u51b3\u4e0d\u65bd\u52a0\u4efb\u4f55\u989d\u5916\u5b66\u4e60\u4e0e\u4ed8\u8d39\u538b\u529b\uff0c\u5c06\u5176\u89c6\u4e3a\u201c\u7597\u6108\u578b\u201d\u5b66\u5458\u800c\u975e\u201c\u4ea7\u51fa\u578b\u201d\u5b66\u5458\u8fdb\u884c\u7ef4\u62a4**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
