    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u4e0e\u98ce\u63a7\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u4f4e**\u3002\u7528\u6237\u53cd\u590d\u8868\u8fbe\u201c\u5bb3\u6015\u6253\u6c34\u6f02\u201d\u3001\u201c\u94b1\u597d\u4e0d\u5bb9\u6613\u624d\u8d5a\u6765\u201d\uff0c\u6838\u5fc3\u9a71\u52a8\u529b\u662f**\u89c4\u907f\u7ecf\u6d4e\u635f\u5931**\u548c**\u5bf9\u8fc7\u5f80\u88ab\u9a97\u7ecf\u5386\u7684\u521b\u4f24\u5e94\u6fc0**\uff0c\u800c\u975e\u5bf9\u6709\u58f0\u884c\u4e1a\u7684\u6df1\u5ea6\u5174\u8da3\u6216\u804c\u4e1a\u89c4\u5212\u3002\u5b66\u4e60\u52a8\u673a\u88ab\u7126\u8651\u548c\u6050\u60e7\u4e3b\u5bfc\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u5f31**\u3002\u660e\u786e\u8868\u793a\u201c\u624b\u4e0a\u6ca1\u6709\u8fd9\u4e48\u591a\u94b1\u201d\uff0c\u53ea\u80fd\u9009\u62e9\u4ef7\u683c\u66f4\u4f4e\u7684\u7cbe\u82f1\u73ed\u3002\u652f\u4ed8\u80fd\u529b\u6709\u9650\uff0c**\u7ecf\u6d4e\u538b\u529b\u663e\u8457**\u3002\u540c\u65f6\uff0c\u7528\u6237\u5904\u4e8e\u751f\u75c5\u72b6\u6001\uff08\u201c\u55d3\u5b50\u72b6\u6001\u4e0d\u597d\u201d\u3001\u201c\u5403\u4e86\u836f\u6709\u70b9\u7d2f\u201d\uff09\uff0c**\u5065\u5eb7\u4e0e\u7cbe\u529b\u8d44\u6e90\u4e0d\u8db3**\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u6781\u4f4e**\u3002\u8868\u73b0\u51fa**\u9ad8\u7126\u8651\u3001\u4f4e\u81ea\u4fe1\u3001\u5f3a\u4f9d\u8d56**\u3002\u591a\u6b21\u8868\u8fbe\u201c\u5bb3\u6015\u201d\u3001\u201c\u5fc3\u91cc\u6709\u4e2a\u7ed3\u201d\u3001\u201c\u5f88\u4e71\u201d\u3001\u201c\u8111\u5b50\u4e00\u56e2\u6d46\u7cca\u201d\u3001\u201c\u6015\u8bb0\u4e0d\u4f4f\u201d\u3002\u51b3\u7b56\u8fc7\u7a0b\u5145\u6ee1\u53cd\u590d\u548c\u62c5\u5fe7\uff0c\u5bf9\u9500\u552e\u63d0\u4f9b\u7684\u201c\u5ef6\u671f\u5f00\u8bfe\u3001\u5148\u8fdb\u5267\u793e\u201d\u65b9\u6848\u8868\u73b0\u51fa\u5f3a\u70c8\u4f9d\u8d56\uff0c\u5c5e\u4e8e\u5178\u578b\u7684**\u98ce\u9669\u89c4\u907f\u578b**\u4eba\u683c\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u5df2\u6210\u529f\u62a5\u540d\u7cbe\u82f1\u73ed\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u5bb6\u5ead\u6210\u5458\uff0c\u7528\u6237\u51b3\u7b56\u8868\u73b0\u4e3a\u4e2a\u4eba\u884c\u4e3a\u3002\u4f46\u57fa\u4e8e\u5176\u7ecf\u6d4e\u538b\u529b\u548c\u7126\u8651\u72b6\u6001\uff0c**\u5b58\u5728\u5bb6\u5ead\u7ecf\u6d4e\u72b6\u51b5\u4e0d\u652f\u6301\u6216\u4e0d\u77e5\u60c5\u7684\u6f5c\u5728\u98ce\u9669**\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u4e0e\u627f\u8bfa (A/B)**: **B\u7c7b (\u4f4e\u52a8\u673a/\u4f4e\u627f\u8bfa)**\u3002\u7528\u6237\u8d2d\u4e70\u884c\u4e3a\u662f**\u5728\u9500\u552e\u63d0\u4f9b\u7684\u201c\u96f6\u98ce\u9669\u201d\u8bd5\u7528\u65b9\u6848\uff08\u5ef6\u671f\u5f00\u8bfe\u3001\u53ef\u9000\u6b3e\u3001\u5148\u8fdb\u5267\u793e\uff09\u9a71\u52a8\u4e0b\uff0c\u4e3a\u7f13\u89e3\u81ea\u8eab\u7126\u8651\u800c\u505a\u51fa\u7684\u51b3\u7b56**\uff0c\u5e76\u975e\u57fa\u4e8e\u6e05\u6670\u7684\u5b66\u4e60\u76ee\u6807\u548c\u804c\u4e1a\u627f\u8bfa\u3002\n*   **\u6b65\u9aa42 - \u8d44\u6e90\u4e0e\u6761\u4ef6 (C/D)**: **D\u7c7b (\u8d44\u6e90\u532e\u4e4f)**\u3002\u7ecf\u6d4e\u8d44\u6e90\u7d27\u5f20\uff0c\u5065\u5eb7\u72b6\u6001\u4e0d\u4f73\uff0c\u5b66\u4e60\u80fd\u529b\u81ea\u8bc4\u4f4e\uff08\u6015\u8bb0\u4e0d\u4f4f\uff09\uff0c\u7efc\u5408\u6761\u4ef6\u5dee\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**: **B-D\u578b\u7528\u6237**\u3002\u9ad8\u98ce\u9669\u7fa4\u4f53\uff0c\u6838\u5fc3\u7279\u5f81\u662f**\u5728\u8d44\u6e90\u532e\u4e4f\u7684\u60c5\u51b5\u4e0b\uff0c\u56e0\u7126\u8651\u548c\u6050\u60e7\u88ab\u201c\u5b89\u5168\u627f\u8bfa\u201d\u5438\u5f15\u800c\u4ed8\u8d39**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**: **T7 \u8d44\u6e90\u532e\u4e4f\u7684\u7126\u8651\u5bfb\u6c42\u8005**\u3002\n*   **\u7279\u5f81\u543b\u5408\u70b9**:\n    1.  **\u7ecf\u6d4e\u654f\u611f**: \u53cd\u590d\u63d0\u53ca\u94b1\u6765\u4e4b\u4e0d\u6613\uff0c\u56e0\u4ef7\u683c\u9009\u62e9\u7cbe\u82f1\u73ed\u3002\n    2.  **\u51b3\u7b56\u53d7\u60c5\u7eea\u9a71\u52a8**: \u88ab\u201c\u5bb3\u6015\u518d\u6b21\u88ab\u9a97\u201d\u7684\u6050\u60e7\u548c\u9500\u552e\u63d0\u4f9b\u7684\u201c\u5b89\u5168\u7f51\u201d\uff08\u53ef\u9000\u6b3e\u3001\u5148\u8fdb\u5267\u793e\uff09\u8bf4\u670d\u3002\n    3.  **\u4f4e\u81ea\u6211\u6548\u80fd\u611f**: \u5bf9\u5b66\u4e60\u80fd\u529b\uff08\u8bb0\u4e0d\u4f4f\uff09\u3001\u63a5\u5355\u80fd\u529b\uff08\u4e0d\u4f1a\u659c\u6760\uff09\u5747\u8868\u73b0\u51fa\u4e0d\u81ea\u4fe1\u3002\n    4.  **\u9ad8\u4f9d\u8d56\u503e\u5411**: \u9891\u7e41\u5411\u9500\u552e\u786e\u8ba4\u7ec6\u8282\uff0c\u5bfb\u6c42\u5373\u65f6\u4fdd\u8bc1\uff08\u201c\u8fd9\u6837\u5c31\u53ef\u4ee5\u4e86\u5bf9\u5417\u201d\uff09\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u6781\u9ad8)\n*   **\u98ce\u9669\u7b49\u7ea7**: **\u6781\u9ad8**\u3002\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u9884\u671f\u7ba1\u7406\u5931\u8861**: **\u6781\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u627f\u8bfa\u201c\u5148\u8fdb\u5267\u793e\u63a5\u6d3b\u201d\u3001\u201c\u7cbe\u82f1\u73ed\u4e5f\u53ef\u63a5\u659c\u6760\u201d\uff0c\u4f46\u7528\u6237\u6838\u5fc3\u8bc9\u6c42\u662f\u201c\u5c3d\u5feb\u63a5\u5355\u8d5a\u94b1\u201d\u3002\u7cbe\u82f1\u73ed\u8bfe\u7a0b\u5185\u5bb9\uff08\u5982\u4e0d\u6559\u540e\u671f\uff09\u4e0e\u7528\u6237\u5bf9\u201c\u63a5\u6240\u6709\u659c\u6760\u5355\u201d\u7684\u9884\u671f\u5b58\u5728**\u4e25\u91cd\u504f\u5dee**\u3002\n    2.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**: **\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5b66\u4e60\u57fa\u7840\u5f31\u3001\u72b6\u6001\u5dee\uff0c\u5b9e\u64cd\u8fdb\u5ea6\u53ef\u80fd\u7f13\u6162\uff0c\u201c\u8fb9\u5b66\u8fb9\u8d5a\u201d\u7684\u627f\u8bfa\u6781\u6613\u843d\u7a7a\u3002\n    3.  **\u7ecf\u6d4e\u538b\u529b\u53cd\u566c**: **\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u672c\u5c31\u7ecf\u6d4e\u7d27\u5f20\uff0c\u82e5\u5b66\u4e60\u521d\u671f\u65e0\u6536\u5165\uff0c\u4ed8\u8d39\u538b\u529b\u4f1a\u8fc5\u901f\u8f6c\u5316\u4e3a\u9000\u8d39\u8bc9\u6c42\u3002\n    4.  **\u7ade\u54c1/\u66ff\u4ee3\u65b9\u6848**: \u4e2d\u98ce\u9669\u3002\u7528\u6237\u6709\u88ab\u9a97\u7ecf\u5386\uff0c\u5bf9\u884c\u4e1a\u4fe1\u4efb\u5ea6\u4f4e\uff0c\u4f46\u6682\u65e0\u63d0\u53ca\u5176\u4ed6\u7ade\u54c1\u3002\n    5.  **\u670d\u52a1\u4f53\u9a8c\u7455\u75b5**: \u4e2d\u98ce\u9669\u3002\u7528\u6237\u62c5\u5fc3\u76f4\u64ad\u65e0\u6cd5\u56de\u653e\u3001\u8bb0\u4e0d\u4f4f\u5185\u5bb9\uff0c\u5bf9\u540e\u7eed\u6559\u5b66\u670d\u52a1\u4ea4\u4ed8\u7684\u5bb9\u9519\u7387\u6781\u4f4e\u3002\n    6.  **\u5bb6\u5ead/\u73af\u5883\u963b\u529b**: **\u9ad8\u98ce\u9669**\u3002**\u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7ecf\u6d4e\u538b\u529b\u6697\u793a\u53ef\u80fd\u5b58\u5728\u5bb6\u5ead\u53cd\u5bf9\u98ce\u9669\uff0c\u9700\u7d27\u6025\u6838\u67e5\u3002**\n    7.  **\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa**: **\u6781\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u63d0\u51fa\u201c\u5148\u62a5\u540d\u3001\u4e0d\u5f00\u8bfe\u3001\u8fdb\u5267\u793e\u611f\u53d7\u3001\u4e0d\u6ee1\u610f\u5168\u989d\u9000\u201d\u7684\u65b9\u6848\uff0c\u867d\u4fc3\u6210\u8ba2\u5355\uff0c\u4f46**\u6781\u5927\u62ac\u9ad8\u4e86\u7528\u6237\u5bf9\u201c\u96f6\u98ce\u9669\u8bd5\u9519\u201d\u548c\u201c\u5267\u793e\u5373\u65f6\u6536\u76ca\u201d\u7684\u9884\u671f**\uff0c\u4e3a\u540e\u7eed\u670d\u52a1\u57cb\u4e0b\u91cd\u5927\u9690\u60a3\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u4e3b\u8981\u96f7\u533a**:\n    *   **\u3010\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u6a21\u7cca\u8868\u8ff0\u3011**\uff1a\u9500\u552e\u79f0\u201c\u7cbe\u82f1\u73ed\u4e5f\u53ef\u4ee5\u63a5\u659c\u6760\u201d\uff0c\u5e76\u627f\u8bfa\u201c\u5e26\u4f60\u8fdb\u5267\u793e\u63a5\u6d3b\u201d\uff0c\u53ef\u80fd\u8ba9\u7528\u6237\u8bef\u8ba4\u4e3a\u62a5\u540d\u540e\u5373\u53ef\u83b7\u5f97\u8d5a\u94b1\u673a\u4f1a\uff0c**\u6a21\u7cca\u4e86\u201c\u5b66\u4e60\u201d\u4e0e\u201c\u53d8\u73b0\u201d\u4e4b\u95f4\u7684\u5fc5\u8981\u8fc7\u7a0b\u548c\u4e0d\u786e\u5b9a\u6027**\u3002\n    *   **\u3010\u5229\u7528\u6050\u60e7\u4e0e\u7126\u8651\u3011**\uff1a\u9500\u552e\u51c6\u786e\u6293\u4f4f\u4e86\u7528\u6237\u201c\u5bb3\u6015\u6253\u6c34\u6f02\u201d\u7684\u5fc3\u7406\uff0c\u901a\u8fc7\u63d0\u4f9b\u201c\u5ef6\u671f\u53ef\u9000\u201d\u65b9\u6848\u4fc3\u6210\u4ea4\u6613\uff0c\u6b64\u7b56\u7565\u867d\u6709\u6548\u4f46**\u6e38\u8d70\u5728\u4f26\u7406\u8fb9\u7f18**\uff0c\u5c06\u7528\u6237\u7684\u7126\u8651\u60c5\u7eea\u8f6c\u5316\u4e3a\u8d2d\u4e70\u52a8\u529b\u3002\n    *   **\u3010\u672a\u5145\u5206\u62ab\u9732\u98ce\u9669\u3011**\uff1a\u672a\u6e05\u6670\u544a\u77e5\u7528\u6237\u7cbe\u82f1\u73ed\u4e0e\u9ad8\u9636\u73ed\u5728\u6559\u5b66\u5185\u5bb9\u3001\u63a5\u5355\u8303\u56f4\u4e0a\u7684\u5177\u4f53\u5dee\u5f02\uff0c\u5c24\u5176\u662f\u5728\u7528\u6237\u53cd\u590d\u8ffd\u95ee\u201c\u659c\u6760\u6211\u4eec\u7cbe\u82f1\u73ed\u6709\u6559\u5417\u201d\u65f6\uff0c\u56de\u7b54\u201c\u4e5f\u53ef\u4ee5\u7684\u201d\u3001\u201c\u6211\u8fd9\u91cc\u53ef\u4ee5\u63a5\u201d\u5b58\u5728**\u8bef\u5bfc\u6027**\u3002\n    *   **\u3010\u672a\u6838\u5b9e\u652f\u4ed8\u80fd\u529b\u3011**\uff1a\u5728\u5df2\u77e5\u7528\u6237\u201c\u624b\u4e0a\u6ca1\u6709\u8fd9\u4e48\u591a\u94b1\u201d\u7684\u60c5\u51b5\u4e0b\uff0c\u672a\u8fdb\u4e00\u6b65\u8bc4\u4f30\u8be5\u7b14\u6559\u80b2\u652f\u51fa\u5bf9\u5176\u751f\u6d3b\u7684\u5b9e\u9645\u5f71\u54cd\uff0c**\u5b58\u5728\u8bf1\u5bfc\u8d85\u652f\u4ed8\u80fd\u529b\u7684\u98ce\u9669**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**: **\u9519\u914d**\u3002\u7528\u6237\u7684\u6df1\u5c42\u9700\u6c42\u662f\u201c\u4f4e\u98ce\u9669\u5feb\u901f\u53d8\u73b0\u201d\uff0c\u4f46\u7cbe\u82f1\u73ed\u4ea7\u54c1\u662f\u201c\u57fa\u7840\u6280\u80fd\u6559\u5b66\u201d\uff0c\u4e24\u8005\u5b58\u5728\u6839\u672c\u77db\u76fe\u3002\u7528\u6237\u5b9e\u5219\u662f\u88ab\u9500\u552e\u7684\u201c\u5b89\u5168\u627f\u8bfa\u201d\u548c\u201c\u5267\u793e\u8d44\u6e90\u201d\u5438\u5f15\uff0c\u800c\u975e\u4ea7\u54c1\u672c\u8eab\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **24h\u5185\u7d27\u6025\u4ecb\u5165\uff0c\u8fdb\u884c\u4e09\u91cd\u6821\u51c6**\u3002\n    1.  **\u9884\u671f\u6821\u51c6\uff08\u9996\u8981\uff09**: \u5fc5\u987b\u7acb\u5373\u3001\u6e05\u6670\u3001\u4e66\u9762\u5316\u5730\u8bf4\u660e\uff1a\u2460\u7cbe\u82f1\u73ed\u7684\u6559\u5b66\u8303\u56f4\u4e0e\u53d8\u73b0\u8def\u5f84\uff1b\u2461\u201c\u8fdb\u5267\u793e\u201d\u7684\u6027\u8d28\uff08\u89c2\u5bdf/\u7ec3\u4e60 vs. \u76f4\u63a5\u63a5\u5355\u8d5a\u94b1\uff09\uff1b\u2462\u4ece\u5b66\u4e60\u5230\u63a5\u5355\u7684\u771f\u5b9e\u5468\u671f\u4e0e\u4e0d\u786e\u5b9a\u6027\u3002**\u7c89\u788e\u201c\u4ed8\u8d39\u5373\u8d5a\u94b1\u201d\u7684\u5e7b\u60f3**\u3002\n    2.  **\u5bb6\u5ead\u77e5\u60c5\u6838\u67e5**: \u4ee5\u5173\u6000\u65b9\u5f0f\uff0c\u59d4\u5a49\u4e86\u89e3\u6b64\u6b21\u4ed8\u8d39\u662f\u5426\u4e3a\u4e2a\u4eba\u53ef\u652f\u914d\u8d44\u91d1\uff0c\u5bb6\u5ead\u662f\u5426\u77e5\u60c5\u652f\u6301\u3002**\u6b64\u4e3a\u6838\u5fc3\u98ce\u63a7\u70b9**\u3002\n    3.  **\u5b66\u4e60\u8ba1\u5212\u4e0e\u5065\u5eb7\u5173\u6000**: \u9274\u4e8e\u7528\u6237\u751f\u75c5\u4e14\u7126\u8651\uff0c\u5236\u5b9a\u6781\u5176\u7b80\u5355\u3001\u660e\u786e\u7684\u9996\u5468\u5b66\u4e60\u8ba1\u5212\uff0c\u4ee5\u5efa\u7acb\u638c\u63a7\u611f\u548c\u5fae\u5c0f\u6210\u529f\u4f53\u9a8c\u3002\u540c\u65f6\u8868\u8fbe\u5065\u5eb7\u5173\u6000\uff0c\u964d\u4f4e\u5176\u56e0\u72b6\u6001\u4e0d\u4f73\u5bfc\u81f4\u7684\u632b\u8d25\u611f\u3002\n*   **\u540e\u7eed\u98ce\u63a7\u91cd\u70b9**: \u5c06\u8be5\u5b66\u5458\u6807\u8bb0\u4e3a**\u6700\u9ad8\u4f18\u5148\u7ea7\u98ce\u63a7\u5bf9\u8c61**\u3002\u9996\u6708\u91cd\u70b9\u5173\u6ce8\u5176\u5b66\u4e60\u8fdb\u5ea6\u3001\u60c5\u7eea\u6ce2\u52a8\u53ca\u5bf9\u53d8\u73b0\u7684\u8ffd\u95ee\u3002\u4e00\u65e6\u53d1\u73b0\u9884\u671f\u518d\u6b21\u5931\u8861\u6216\u7ecf\u6d4e\u538b\u529b\u8a00\u8bba\uff0c\u9700\u7acb\u5373\u5347\u7ea7\u5904\u7406\u3002\n\n```json\n{\"core_type\": \"T7 \u8d44\u6e90\u532e\u4e4f\u7684\u7126\u8651\u5bfb\u6c42\u8005\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"product_match\": \"\u9519\u914d\", \"action\": \"24h\u5185\u7d27\u6025\u4e09\u91cd\u6821\u51c6\u4e0e\u98ce\u63a7\"}\n```";
