    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4e3b\u8981\u4e3a\u8bfe\u7a0b\u4e2d\u671f\uff08\u7b2c\u4e94\u5468\uff09\u7684\u4f5c\u4e1a\u534f\u4f5c\u4e0e\u6280\u672f\u4ea4\u6d41\uff0c**\u7f3a\u4e4f\u5173\u952e\u7684\u524d\u671f\u54a8\u8be2\u3001\u652f\u4ed8\u51b3\u7b56\u3001\u5bb6\u5ead\u652f\u6301\u3001\u521d\u59cb\u5b66\u4e60\u52a8\u673a\u3001\u7ecf\u6d4e\u72b6\u51b5\u3001\u8fc7\u5f80\u7ecf\u5386\u7b49\u6838\u5fc3\u4fe1\u606f**\uff0c\u65e0\u6cd5\u5b8c\u6574\u6267\u884cABCD\u5224\u5b9a\u6811\u4e0e\u9000\u8d39\u6839\u56e0\u6392\u67e5\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a**\u9ad8**\u3002\u7528\u6237\u8868\u73b0\u51fa\u6781\u5f3a\u7684\u5b9e\u8df5\u4e0e\u6295\u5165\u5ea6\uff0c\u79ef\u6781\u7ec4\u7ec7\u540c\u5b66\u534f\u4f5c\u3001\u53cd\u590d\u6253\u78e8\u97f3\u9891\u3001\u4e3b\u52a8\u5b66\u4e60\u540e\u671f\u6280\u672f\u3002\u81ea\u8ff0\u5bfb\u627e\u65b0\u8d5b\u9053\uff0c\u6709\u660e\u786e\u7684\u8f6c\u578b/\u518d\u5c31\u4e1a\u76ee\u6807\uff0c\u5185\u5728\u9a71\u52a8\u529b\u5f3a\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u81ea\u8ff0\u66fe\u4e3a\u201c\u5343\u4e07\u5bcc\u7fc1\u201d\u540e\u7ecf\u5386\u4e8b\u4e1a\u4f4e\u8c37\u4e0e\u5065\u5eb7\u95ee\u9898\uff0c\u76ee\u524d\u7ecf\u6d4e\u72b6\u51b5\u4e0d\u660e\u3002\u65f6\u95f4\u8d44\u6e90\u5145\u88d5\uff08\u53ef\u9891\u7e41\u6c9f\u901a\u3001\u665a\u4e0a\u5f55\u97f3\u3001\u8dd1\u6b65\uff09\uff0c\u4f46\u5f55\u97f3\u73af\u5883\u5dee\uff08\u5de5\u5382\u566a\u97f3\uff09\uff0c**\u786c\u4ef6/\u73af\u5883\u8d44\u6e90\u5b58\u5728\u660e\u663e\u77ed\u677f**\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a**\u6781\u9ad8**\u3002\u7ecf\u5386\u91cd\u5927\u4eba\u751f\u632b\u6298\u540e\u4ecd\u79ef\u6781\u5bfb\u627e\u51fa\u8def\uff0c\u81ea\u6211\u6fc0\u52b1\uff08\u201c\u575a\u6301\u5c31\u662f\u80dc\u5229\u201d\uff09\uff0c\u5728\u8bfe\u7a0b\u4e2d\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff08\u97f3\u9891\u5904\u7406\u3001\u534f\u8c03\u540c\u5b66\uff09\uff0c\u4e50\u4e8e\u5206\u4eab\u7ecf\u9a8c\uff0c\u6297\u538b\u4e0e\u590d\u539f\u529b\u5f3a\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\uff08\u6b65\u9aa40-1.5\uff09\n*   **\u6b65\u9aa40 \u652f\u4ed8\u6838\u67e5**\uff1a**\u65e0\u6cd5\u5224\u65ad**\u3002\u8bb0\u5f55\u4e2d\u65e0\u652f\u4ed8\u76f8\u5173\u4fe1\u606f\u3002\n*   **\u6b65\u9aa41.5 \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u65e0\u6cd5\u5224\u65ad**\u3002\u8bb0\u5f55\u4e2d\u65e0\u5bb6\u5ead\u76f8\u5173\u8ba8\u8bba\u3002\n*   **\u7efc\u5408\u5224\u5b9a**\uff1a\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u8fdb\u884c\u5b8c\u6574ABCD\u5206\u7c7b\u3002\u4ec5\u4ece\u73b0\u6709\u884c\u4e3a\u770b\uff0c\u7528\u6237\u5904\u4e8e**\u6df1\u5ea6\u53c2\u4e0e\u548c\u5b9e\u64cd\u9636\u6bb5**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**\uff1a**T3 \u52a1\u5b9e\u8f6c\u578b\u8005**\u3002\n    *   **\u4f9d\u636e**\uff1a\u6709\u660e\u786e\u7684\u4eba\u751f\u8f6c\u578b\u80cc\u666f\uff08\u4e8b\u4e1a\u4f4e\u8c37\u540e\u5bfb\u627e\u65b0\u8d5b\u9053\uff09\uff0c\u5b66\u4e60\u76ee\u6807\u52a1\u5b9e\uff08\u5bfb\u627e\u9002\u5408\u7684\u8d5b\u9053\uff09\uff0c\u884c\u52a8\u529b\u6781\u5f3a\uff08\u4e3b\u52a8\u7ec4\u7ec7\u3001\u7ec3\u4e60\u3001\u89e3\u51b3\u95ee\u9898\uff09\uff0c\u5fc3\u6001\u6210\u719f\u575a\u97e7\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u6574\u4f53\u98ce\u9669**\uff1a**\u4f4e**\u3002\n*   **\u6839\u56e0\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a\u98ce\u9669**\u4f4e**\u3002\u7528\u6237\u6df1\u5ea6\u53c2\u4e0e\uff0c\u5bf9\u5b66\u4e60\u8fc7\u7a0b\u7684\u56f0\u96be\uff08\u5982\u666e\u901a\u8bdd\u3001\u73af\u5883\u566a\u97f3\uff09\u6709\u8ba4\u77e5\uff0c\u4e14\u81ea\u6211\u5f52\u56e0\uff08\u201c\u4eba\u7269\u6027\u683c\u5206\u6790\u4e0d\u591f\u51c6\u786e\u201d\uff09\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u5386\u53f2\u7ecf\u6d4e\u72b6\u51b5\u4e0d\u4f73\uff0c\u4f46\u73b0\u72b6\u4e0d\u660e\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a\u98ce\u9669**\u4f4e**\u3002\u7528\u6237\u65f6\u95f4\u5b89\u6392\u7075\u6d3b\uff0c\u4e3b\u52a8\u6295\u5165\u3002\n    4.  **\u8bfe\u7a0b\u4e0d\u7b26\u9884\u671f**\uff1a\u98ce\u9669**\u4f4e**\u3002\u7528\u6237\u79ef\u6781\u5b8c\u6210\u4f5c\u4e1a\u5e76\u5e94\u7528\u6240\u5b66\uff08\u5982AU\u8f6f\u4ef6\u3001\u5bf9\u8f68\uff09\u3002\n    5.  **\u670d\u52a1\u4f53\u9a8c**\uff1a\u98ce\u9669**\u4f4e**\u3002\u4e0e\u9500\u552e\uff08\u73ed\u73ed\uff09\u4e92\u52a8\u826f\u597d\uff0c\u8ba4\u53ef\u73ed\u73ed\u4ed8\u51fa\uff08\u201c\u73ed\u73ed\u662f\u6700\u597d\u7684\u201d\uff09\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\n    7.  **\u7ade\u54c1/\u66ff\u4ee3\u65b9\u6848**\uff1a\u98ce\u9669**\u4f4e**\u3002\u7528\u6237\u805a\u7126\u4e8e\u5f53\u524d\u8bfe\u7a0b\u5b9e\u8df5\uff0c\u672a\u63d0\u53ca\u4ed6\u5904\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u65e0\u663e\u8457\u98ce\u9669**\u3002\u8bb0\u5f55\u4e2d\u9500\u552e\uff08\u73ed\u73ed\uff09\u884c\u4e3a\u4e3b\u8981\u4e3a\u8bfe\u7a0b\u8f85\u5bfc\u3001\u4f5c\u4e1a\u50ac\u4ea4\u3001\u6280\u672f\u7b54\u7591\uff0c\u672a\u53d1\u73b0\u8fc7\u5ea6\u627f\u8bfa\u3001\u8d2c\u635f\u7ade\u54c1\u3001\u8bf1\u5bfc\u8d37\u6b3e\u7b49\u8fdd\u89c4\u884c\u4e3a\u3002\n*   **\u6f5c\u5728\u5173\u6ce8\u70b9**\uff1a\u7528\u6237\u81ea\u66dd\u91cd\u5927\u4e2a\u4eba\u632b\u6298\uff08\u7834\u4ea7\u3001\u5065\u5eb7\u95ee\u9898\uff09\uff0c**\u9700\u8b66\u60d5\u9500\u552e\u6216\u73ed\u4e3b\u4efb\u5229\u7528\u6b64\u7ecf\u5386\u8fdb\u884c\u60c5\u611f\u7ed1\u67b6\u6216\u5236\u9020\u7126\u8651\u4ee5\u7eed\u8d39**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d**\uff1a**\u5339\u914d**\u3002\u7528\u6237\u884c\u4e3a\u4e0e\u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\u7684\u5b9e\u8df5\u3001\u534f\u4f5c\u5c5e\u6027\u9ad8\u5ea6\u5951\u5408\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a\n    1.  **\u63d0\u4f9b\u73af\u5883\u89e3\u51b3\u65b9\u6848**\uff1a\u9488\u5bf9\u5176\u5f55\u97f3\u73af\u5883\u566a\u97f3\u5927\u7684**\u6838\u5fc3\u75db\u70b9**\uff0c\u4e3b\u52a8\u63d0\u4f9b\u964d\u566a\u6280\u5de7\u3001\u5f55\u97f3\u65f6\u6bb5\u5efa\u8bae\u6216\u4f4e\u6210\u672c\u8bbe\u5907\u65b9\u6848\uff0c\u4f53\u73b0\u652f\u6301\u3002\n    2.  **\u5f3a\u5316\u4ef7\u503c\u8ba4\u53ef\u4e0e\u8def\u5f84\u5f15\u5bfc**\uff1a\u80af\u5b9a\u5176\u7ec4\u7ec7\u80fd\u529b\u3001\u5b66\u4e60\u97e7\u6027\u548c\u8fdb\u6b65\uff0c\u5e76**\u7ed3\u5408\u5176\u8f6c\u578b\u80cc\u666f\uff0c\u5f15\u5bfc\u5173\u6ce8\u957f\u671f\u6280\u80fd\u79ef\u7d2f\u4e0e\u63a5\u5355\u6e20\u9053**\uff0c\u5de9\u56fa\u5b66\u4e60\u52a8\u673a\u3002\n    3.  **\u907f\u514d\u60c5\u611f\u8425\u9500**\uff1a\u5728\u540e\u7eed\u6c9f\u901a\u4e2d\uff0c**\u8c28\u614e\u63d0\u53ca\u7528\u6237\u8fc7\u5f80\u632b\u6298**\uff0c\u805a\u7126\u5f53\u524d\u5b66\u4e60\u6210\u679c\u4e0e\u672a\u6765\u804c\u4e1a\u53ef\u80fd\u6027\uff0c\u4fdd\u6301\u4e13\u4e1a\u8fb9\u754c\u3002\n\n{\"core_type\": \"T3 \u52a1\u5b9e\u8f6c\u578b\u8005\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u63d0\u4f9b\u5f55\u97f3\u73af\u5883\u964d\u566a\u652f\u6301\"}";
        document.getElementById('content').innerHTML = marked.parse(markdownText);
