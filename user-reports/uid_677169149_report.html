    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4f5c\u4e3a\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677169149 (\u6635\u79f0\uff1a\ud83d\udc2c-\u5e7f\u4e1c-\u5973\u64ad) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-11 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e-\u7f57\u5e03\u6cca(\u4efb\u4f1f)\uff0c\u73ed\u4e3b\u4efb-\u5b89\u7ae5\u58f0(\u5218\u7d20\u82f1) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u5df2\u62a5\u540d\u201c\u6500\u767b\u8ba1\u5212\u7cbe\u82f1\u7248\u201d\u6b63\u4ef7\u8bfe |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7591\u4f3c\u4fe1\u7528\u5361\u6216\u50a8\u84c4\u5361\u652f\u4ed8**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u8d44\u91d1\u6709\u9650\u201d\uff0c\u4f46\u672a\u63d0\u53ca\u501f\u8d37\u6216\u5206\u671f\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u9700\u517c\u987e\u5e26\u5a03\uff08\u5e7c\u513f\u56ed\u5c0f\u73ed\uff09\uff0c\u65e9\u4e0a8-9\u70b9\u76f4\u64ad\u65f6\u6bb5\u9700\u9001\u5a03\u4e0a\u5b66\u65e0\u6cd5\u53c2\u52a0\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u672a\u63d0\u53ca**\u3002\u804a\u5929\u4e2d\u672a\u6d89\u53ca\u5bb6\u4eba\u6001\u5ea6\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u7528\u6237\u8868\u8fbe\u4e86\u8be6\u7ec6\u7684\u4e2a\u4eba\u60c5\u51b5\u3001\u5b66\u4e60\u52a8\u673a\u3001\u65f6\u95f4\u9650\u5236\u548c\u60c5\u611f\u4f9d\u8d56\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34(\u4e2d)**\u3002\u7528\u6237\u6709\u660e\u786e\u7684\u517c\u804c\u53d8\u73b0\u8bc9\u6c42\uff08\u201c\u4f5c\u4e3a\u526f\u4e1a\u517c\u804c\u6323\u94b1\u201d\uff09\uff0c\u4f46\u540c\u65f6\u4e5f\u8868\u73b0\u51fa\u5bf9\u6280\u80fd\u63d0\u5347\u3001\u81ea\u6211\u6210\u957f\u548c\u83b7\u5f97\u8ba4\u53ef\u7684\u6e34\u671b\uff08\u201c\u60f3\u6210\u4e3a\u8d8a\u6765\u8d8a\u597d\u7684\u81ea\u5df1\u201d\u3001\u201c\u5e0c\u671b\u6709\u5929\u80fd\u8ba9\u66f4\u591a\u7684\u4eba\u542c\u5230\u6211\u7684\u914d\u97f3\u6211\u7684\u58f0\u97f3\u201d\uff09\u3002\u52a8\u673a\u662f\u201c\u53d8\u73b0+\u81ea\u6211\u5b9e\u73b0\u201d\u7684\u6df7\u5408\u4f53\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u662f\u633a\u60f3\u80fd\u628a\u914d\u97f3\u5f53\u6210\u526f\u4e1a\u8d5a\u94b1\uff0c\u4e5f\u5e0c\u671b\u6709\u5929\u80fd\u8ba9\u66f4\u591a\u7684\u4eba\u542c\u5230\u6211\u7684\u914d\u97f3\u6211\u7684\u58f0\u97f3[\u8c03\u76ae]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u660e\u786e\u8868\u793a\u201c\u8d44\u91d1\u6709\u9650\uff0c\u4e13\u4e1a\u8bfe\u8d39\u7528\u7684\u8bdd\uff0c\u4f30\u8ba1\u5c31\u62a5\u4e0d\u4e86\u201d\u3002\u6700\u7ec8\u62a5\u540d\uff0c\u4f46\u8d44\u91d1\u538b\u529b\u662f\u660e\u663e\u77ed\u677f\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e** \u2014 \u5b9d\u5988\u8eab\u4efd\uff0c\u9700\u7167\u987e\u5e7c\u513f\u56ed\u5c0f\u73ed\u7684\u5b69\u5b50\uff0c\u65e9\u4e0a\u9ec4\u91d1\u5b66\u4e60\u65f6\u6bb5\u88ab\u5360\u7528\uff0c\u53ea\u80fd\u5229\u7528\u788e\u7247\u5316\u65f6\u95f4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u672a\u77e5** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff0c\u4f46\u9700\u4f5c\u4e3a\u6f5c\u5728\u98ce\u9669\u70b9\u89c2\u5bdf\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b07\u4f4e\u6781\u5371**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u8868\u73b0\u51fa\u5bf9\u9500\u552e\u201c\u5e08\u59d0\u201d\u6781\u5f3a\u7684\u60c5\u611f\u4f9d\u8d56\u548c\u4fe1\u4efb\uff0c\u5c06\u5bf9\u65b9\u89c6\u4e3a\u201c\u5a18\u5bb6\u4eba\u201d\u3002\u5f53\u9500\u552e\u8bef\u53d1\u6d88\u606f\u7ed9\u4ed6\u4eba\u65f6\uff0c\u7528\u6237\u53cd\u5e94\u662f\u201c\u5413\u6b7b\u6211\u4e86\u201d\u3001\u201c\u4e0d\u77e5\u6240\u63aa[\u6487\u5634][\u6487\u5634]\u201d\uff0c\u663e\u793a\u51fa\u9ad8\u654f\u611f\u548c\u4f4e\u5b89\u5168\u611f\u3002\u5bf9\u73ed\u4e3b\u4efb\u7684\u201c\u673a\u5668\u4eba\u201d\u5f0f\u6c9f\u901a\u4e5f\u8868\u73b0\u51fa\u4e0d\u9002\u5e94\u548c\u8f7b\u5fae\u6392\u65a5\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u545c\u545c\ud83d\ude2d\u5413\u6b7b\u6211\u4e86\u201d\u3001\u201c\u5e78\u597d\u662f\u522b\u4eba\uff0c\u6211\u6709\u70b9\u4e0d\u77e5\u6240\u63aa[\u6487\u5634][\u6487\u5634]\u201d\u3001\u201c\u4eca\u5929\u6ca1\u6536\u5230\u5e08\u59d0\u4fe1\u606f\uff0c\u611f\u89c9\u6709\u70b9\u7d27\u5f20[\u7834\u6d95\u4e3a\u7b11][\u6342\u8138]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34\u4e0e\u5f52\u5c5e\u611f + \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u4e0e\u8ba4\u53ef**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u7ebf\u4e0b\u793e\u4ea4\u5708\u5c42\u72ed\u7a84\u7684\u5b9d\u5988\uff0c\u5728\u80b2\u513f\u548c\u81ea\u6211\u4ef7\u503c\u5b9e\u73b0\u7684\u5939\u7f1d\u4e2d\u6323\u624e\uff0c\u6781\u5ea6\u6e34\u671b\u88ab\u770b\u89c1\u3001\u88ab\u8ba4\u53ef\u3001\u88ab\u4e00\u4e2a\u201c\u53ef\u9760\u201d\u7684\u5708\u5b50\u63a5\u7eb3\u3002** \u5979\u7fa1\u6155\u201c\u522b\u4eba\u5149\u9c9c\u4eae\u4e3d\u201d\uff0c\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u914d\u97f3\u83b7\u5f97\u7ecf\u6d4e\u72ec\u7acb\u548c\u8eab\u4efd\u8ba4\u540c\uff0c\u586b\u8865\u5185\u5fc3\u7684\u4e0d\u81ea\u4fe1\u548c\u5b64\u72ec\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u63d0\u4f9b\u201c\u4ea6\u5e08\u4ea6\u53cb\u4ea6\u5bb6\u4eba\u201d\u7684\u5f3a\u60c5\u611f\u8fde\u63a5\u548c\u201c\u88ab\u7279\u6b8a\u5173\u7167\u201d\u7684VIP\u611f\u3002** \u5979\u9700\u8981\u7684\u4e0d\u4ec5\u662f\u6280\u80fd\uff0c\u66f4\u662f\u4e00\u4e2a\u53ef\u4ee5\u4f9d\u8d56\u3001\u503e\u8bc9\u3001\u83b7\u5f97\u6301\u7eed\u9f13\u52b1\u548c\u80af\u5b9a\u7684\u201c\u7ebf\u4e0a\u5a18\u5bb6\u201d\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u4e25\u91cd\u5185\u8017) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u7b49D\u7c7b\u7ea2\u7ebf\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u82e5\u5bb6\u4eba\uff08\u5c24\u5176\u662f\u914d\u5076\uff09\u53cd\u5bf9\u5176\u82b1\u8d39\u65f6\u95f4\u548c\u91d1\u94b1\u5b66\u4e60\uff0c\u6781\u6613\u5f15\u53d1\u77db\u76fe\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u5e26\u5a03\u5bfc\u81f4\u65f6\u95f4\u6781\u5ea6\u788e\u7247\u5316\uff0c\u65e0\u6cd5\u8ddf\u4e0a\u76f4\u64ad\u548c\u4f5c\u4e1a\u8282\u594f\uff0c\u4ea7\u751f\u201c\u6389\u961f\u201d\u7684\u7126\u8651\u548c\u81ea\u8d23\uff0c\u6700\u7ec8\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u5bf9\u201c\u5e08\u59d0\u201d\u7684\u60c5\u611f\u4f9d\u8d56\u8fc7\u5f3a\u3002\u4e00\u65e6\u6b63\u8bfe\u73ed\u4e3b\u4efb\u65e0\u6cd5\u63d0\u4f9b\u540c\u7b49\u5bc6\u5ea6\u7684\u60c5\u611f\u56de\u5e94\uff0c\u6216\u906d\u9047\u4e00\u6b21\u4e25\u5389\u7684\u3001\u672a\u52a0\u94fa\u57ab\u7684\u4f5c\u4e1a\u6279\u8bc4\uff0c\u5176\u81ea\u5c0a\u5fc3\u6781\u6613\u53d7\u632b\uff0c\u4ea7\u751f\u201c\u88ab\u629b\u5f03\u201d\u611f\u800c\u5d29\u6e83\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u82e5\u5728\u627f\u8bfa\u7684\u201c\u63a5\u5355\u201d\u5468\u671f\u5185\uff08\u59822-3\u4e2a\u6708\uff09\u672a\u83b7\u5f97\u4efb\u4f55\u53d8\u73b0\u673a\u4f1a\uff0c\u4f1a\u56e0\u201c\u8d44\u91d1\u6709\u9650\u201d\u7684\u538b\u529b\u800c\u8d28\u7591\u8bfe\u7a0b\u4ef7\u503c\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-3\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u6b63\u5f0f\u8bfe\u4e1a\u538b\u529b\u589e\u5927\uff0c\u65f6\u95f4\u51b2\u7a81\u95ee\u9898\u51f8\u663e\uff0c\u82e5\u73ed\u4e3b\u4efb\u672a\u80fd\u53ca\u65f6\u7ed9\u4e88\u9ad8\u5f3a\u5ea6\u60c5\u611f\u6258\u5e95\uff0c\u6781\u6613\u89e6\u53d1\u201c\u8ddf\u4e0d\u4e0a-\u81ea\u8d23-\u653e\u5f03\u201d\u94fe\u6761\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4eb2\u7231\u7684\uff0c\u770b\u5230\u4f60\u4e3a\u4e86\u517c\u987e\u5b9d\u5b9d\u548c\u5b66\u4e60\u8fd9\u4e48\u52aa\u529b\uff0c\u771f\u7684\u7279\u522b\u4f69\u670d\u4f60\uff01\u54b1\u4eec\u73ed\u5f88\u591a\u5b9d\u5988\u540c\u5b66\uff0c\u5927\u5bb6\u65f6\u95f4\u90fd\u633a\u788e\u7684\uff0c\u522b\u62c5\u5fc3\u8ddf\u4e0d\u4e0a\u3002\u76f4\u64ad\u6709\u56de\u653e\uff0c\u4f5c\u4e1a\u54b1\u4eec\u53ef\u4ee5\u7075\u6d3b\u4ea4\uff0c\u6700\u91cd\u8981\u7684\u662f\u4f60\u5b66\u5f97\u5f00\u5fc3\u3001\u6709\u6536\u83b7\u3002\u4ee5\u540e\u6709\u4efb\u4f55\u4e8b\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4e0d\u4ec5\u662f\u4f60\u7684\u73ed\u73ed\uff0c\u4e5f\u662f\u4f60\u7684\u2018\u7ebf\u4e0a\u95fa\u871c\u2019\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\u3011**\u3002\u6838\u5fc3\u76ee\u6807\u4e0d\u662f\u5feb\u901f\u53d8\u73b0\uff0c\u800c\u662f\u5efa\u7acb\u5b89\u5168\u611f\u548c\u6301\u7eed\u5b66\u4e60\u7684\u4fe1\u5fc3\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\uff08\u6ee1\u914dC\u6a21\u5757\uff09\u3011** + **\u3010\u964d\u7ef4\u50bb\u74dc\u7248A\u6a21\u5757\u3011**\u3002\u5fc5\u987b\u62ff\u8d70\u6280\u672f\u96be\u9898\uff0c\u7ed9\u4e88\u6781\u5938\u5f20\u7684\u8d5e\u7f8e\u548c\u201c\u6309\u952e\u7ea7\u201d\u6307\u5bfc\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u7528\u7eaa\u5f8b\u6216\u8003\u52e4\u65bd\u538b**\uff08\u5982\u201c\u9519\u8fc7\u76f4\u64ad\u53d6\u6d88\u8f85\u5bfc\u201d\uff09\u30022. **\u8fdb\u884c\u51b7\u51b0\u51b0\u7684\u6280\u672f\u70b9\u8bc4**\uff08\u5fc5\u987b\u5148\u5938\u518d\u59d4\u5a49\u63d0\u5efa\u8bae\uff09\u30023. **\u5728\u5979\u8868\u8fbe\u7126\u8651\u65f6\u8bb2\u5927\u9053\u7406**\uff08\u5fc5\u987b\u5148\u5171\u60c5\uff09\u30024. **\u5728\u521d\u671f\u8fdb\u884c\u4efb\u4f55\u5347\u5355\u63a8\u9500**\uff08\u4f1a\u52a0\u5267\u5176\u7ecf\u6d4e\u538b\u529b\u548c\u7126\u8651\u611f\uff09\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u81f3\u5c11\u5728\u5f00\u8bfe\u5934\u4e24\u4e2a\u6708\u5185\uff0c\u7edd\u5bf9\u7981\u6b62\u63d0\u53ca\u4efb\u4f55\u9ad8\u9636\u8bfe\u7a0b\u6216\u8bbe\u5907\u8d2d\u4e70\u3002\u5f85\u5176\u60c5\u7eea\u7a33\u5b9a\u3001\u5efa\u7acb\u8db3\u591f\u4fe1\u4efb\u540e\uff0c\u518d\u4ee5\u201c\u4e3a\u4f60\u91cf\u8eab\u63a8\u8350\u201d\u7684\u65b9\u5f0f\u8c28\u614e\u8bd5\u63a2\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5e08\u59d0\uff0c\u6211\u5176\u5b9e\u633a\u7fa1\u6155\u522b\u4eba\u5149\u9c9c\u4eae\u4e3d\u7684\uff0c\u4f46\u662f\u6211\u60f3\u522b\u4eba\u80cc\u540e\u90fd\u662f\u4ed8\u51fa\u5f88\u591a\u52aa\u529b\u5f97\u5230\u6765\u7684\u3002\u6211\u4e5f\u60f3\u6210\u4e3a\u8d8a\u6765\u8d8a\u597d\u7684\u81ea\u5df1\uff0c\u6211\u4e5f\u60f3\u7ed9\u5b69\u5b50\u597d\u7684\u751f\u6d3b\u73af\u5883\uff0c\u6240\u4ee5\u6211\u4e5f\u5f97\u52aa\u529b\u624d\u884c\u3002\u201d **\uff08\u66b4\u9732\u81ea\u6211\u4ef7\u503c\u8ffd\u6c42\u4e0e\u6bcd\u804c\u538b\u529b\uff09**\n2. > \u201c\u4eca\u5929\u6ca1\u6536\u5230\u5e08\u59d0\u4fe1\u606f\uff0c\u611f\u89c9\u6709\u70b9\u7d27\u5f20[\u7834\u6d95\u4e3a\u7b11][\u6342\u8138]\u201d **\uff08\u5178\u578b\u60c5\u7eea\u4f9d\u8d56\u4e0e\u4f4e\u5b89\u5168\u611f\u4fe1\u53f7\uff09**\n3. > \u201c\u5e08\u59d0\uff0c\u4f60\u4e0d\u8981\u53d6\u7b11\u6211\u54c8\u3002\u6211\u611f\u89c9\u6211\u4eec\u7684\u73ed\u4e3b\u4efb\u73ed\u73ed\u8001\u5e08\u8bf4\u8bdd\u50cf\u4e2a\u673a\u5668\u4eba\u4f3c\u7684\u201d\u3001\u201c\u8fd8\u662f\u4e60\u60ef\u8ddf\u5e08\u59d0\u5bf9\u63a5[\u5618]\u201d **\uff08\u5bf9\u5f3a\u60c5\u611f\u8fde\u63a5\u7684\u9500\u552e\u4ea7\u751f\u6df1\u5ea6\u4f9d\u8d56\uff0c\u5bf9\u6807\u51c6\u5316\u670d\u52a1\u7684\u73ed\u4e3b\u4efb\u4ea7\u751f\u6392\u65a5\uff0cT6\u6838\u5fc3\u7279\u5f81\uff09**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u88ab\u770b\u89c1\u3001\u88ab\u8ba4\u53ef\u3001\u83b7\u5f97\u7ebf\u4e0a\u60c5\u611f\u5f52\u5c5e\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6ee1\u914d\u7684\u201c\u60c5\u7eea\u4fdd\u59c6\u201d\u670d\u52a1\uff08C\u6a21\u5757\uff09\uff0c\u7528\u9ad8\u9891\u3001\u6e29\u6696\u3001\u4e2a\u6027\u5316\u7684\u56de\u5e94\u5efa\u7acb\u7edd\u5bf9\u4fe1\u4efb\uff0c\u5e76\u4e3a\u5176\u788e\u7247\u5316\u65f6\u95f4\u63d0\u4f9b\u6781\u81f4\u7075\u6d3b\u7684\u201c\u6cc4\u538b\u7ad9\u201d\u5f0f\u5b66\u4e60\u65b9\u6848\u3011**\u3002\n\n```json\n{\"core_type\":
