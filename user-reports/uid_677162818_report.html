    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID 677162818 (\u6635\u79f0\uff1a\u80d6\u5b50\uff08\u7626\uff09) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u7c7d\u83f2(\u5f20\u8273\u8273)\u3001\u6854\u5b50JZT(\u7a0b\u5c55\u6b22) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u9ad8\u9636\u8bfe\u7a0b (\u7cbe\u82f1\u7248+\u8fdb\u9636\u7248)\uff0c\u4ef7\u683c7380\u5143 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u672a\u77e5 (\u4fe1\u606f\u7f3a\u5931) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1 (\u5de5\u85aa\u9636\u5c42\uff0c\u4e0b\u73ed\u540e\u5b66\u4e60) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u672a\u77e5 (\u4fe1\u606f\u7f3a\u5931) |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e2d\u7b49 (\u6709\u57fa\u7840\u4e92\u52a8\uff0c\u4f46\u5173\u952e\u652f\u4ed8/\u5bb6\u5ead\u4fe1\u606f\u7f3a\u5931) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u27a1\u4e2d\n- **\u7279\u5f81\u901f\u5199**\uff1a\u5e26\u6709\u660e\u786e\u517c\u804c\u53d8\u73b0\u76ee\u7684\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u201c\u51e0\u5929\u5185\u5fc5\u987b\u8d5a\u94b1\u201d\u7684\u6781\u7aef\u7126\u8651\u3002\u5173\u6ce8\u884c\u4e1a\u5de5\u79cd\uff08\u753b\u672c\u3001\u5ba1\u6838\u3001\u540e\u671f\uff09\uff0c\u6709\u957f\u671f\u5b66\u4e60\u610f\u613f\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8bf4\u767d\u4e86\u5c31\u662f\u60f3\u591a\u8d5a\u4e00\u70b9\u94b1\u3002\u201d > \u201c\u540e\u671f\u8fd8\u80fd\u5b66\u5bf9\u8f68 \u548c\u540e\u671f\u4e0d\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a\u4e2d \u2014 \u5de5\u85aa\u9636\u5c42\uff0c\u8d2d\u4e707380\u5143\u9ad8\u9636\u8bfe\u7a0b\uff0c\u65e0\u660e\u663e\u501f\u8d37\u4fe1\u53f7\uff0c\u4f46\u9700\u5173\u6ce8\u652f\u4ed8\u65b9\u5f0f\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a\u4e2d \u2014 \u4e0b\u73ed\u540e\u5b66\u4e60\uff0c\u80fd\u5b8c\u6210\u4f5c\u4e1a\u548c\u76f4\u64ad\uff0c\u4f46\u65f6\u95f4\u975e\u6781\u5ea6\u81ea\u7531\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a\u672a\u77e5 \u2014 \u4fe1\u606f\u7f3a\u5931\uff0c\u9700\u540e\u7eed\u6838\u67e5\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u80fd\u5ba2\u89c2\u81ea\u6211\u8bc4\u4ef7\u4e0d\u8db3\uff0c\u4e3b\u52a8\u5bfb\u6c42\u7ec6\u8282\u63d0\u5347\uff0c\u9762\u5bf9\u9500\u552e\u9f13\u52b1\u65f6\u4fdd\u6301\u8c26\u900a\uff0c\u65e0\u81ea\u5351\u6216\u5d29\u6e83\u8ff9\u8c61\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u89c9\u5f97\u8fd8\u662f\u548c\u522b\u4eba\u5dee\u7684\u8fdc\u5462[\u6342\u8138]\u201d > \u201c\u6bcf\u4e00\u79cd\u6587\u672c\u7684\u60c5\u7eea\u600e\u6837\u8868\u8fbe\u6211\u77e5\u9053\uff0c\u4f46\u662f\u7ec6\u8282\u8fd8\u662f\u5dee\u5f88\u591a\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a41\u5c81\u4e2d\u5e74\u7537\u6027\uff0c\u5bf9\u81ea\u8eab\u58f0\u97f3\u6761\u4ef6\uff08\u201c\u9752\u6da9\u201d\u3001\u201c\u5355\u8584\u201d\uff09\u5b58\u5728\u4e0d\u81ea\u4fe1\uff0c\u6e34\u671b\u901a\u8fc7\u4e13\u4e1a\u5b66\u4e60\u548c\u6280\u80fd\u63d0\u5347\uff0c\u83b7\u5f97\u793e\u4f1a\u8ba4\u53ef\u4e0e\u81ea\u6211\u4ef7\u503c\u80af\u5b9a\uff0c\u6446\u8131\u201c\u666e\u901a\u5de5\u85aa\u201d\u7684\u8eab\u4efd\u7126\u8651\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u5708\u5c42\u5f52\u5c5e\u611f**\u3002\u901a\u8fc7\u201c\u9752\u53d4\u97f3\u201d\u7684\u7cbe\u51c6\u5b9a\u4f4d\u3001\u4f5c\u4e1a\u7684\u7ec6\u81f4\u70b9\u8bc4\u4ee5\u53ca\u201c\u8fdb\u5267\u7ec4\u201d\u7684\u53ef\u80fd\u6027\u63cf\u7ed8\uff0c\u6ee1\u8db3\u5176\u88ab\u4e13\u4e1a\u4f53\u7cfb\u63a5\u7eb3\u548c\u5c0a\u91cd\u7684\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7B \u7c7b |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u8fdb\u5316\u524d\u4f53\uff0c\u6709\u5411\u6df7\u5408\u4f533\u53f7\u3010\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b\u3011\u53d1\u5c55\u7684\u6f5c\u529b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u7f3a\u5931\uff0c\u9700\u540e\u7eed\u6838\u67e5\u5bb6\u5ead\u652f\u6301\u5ea6\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4e2d | \u82e5\u5de5\u4f5c\u7a81\u7136\u7e41\u5fd9\uff0c\u6324\u538b\u5b66\u4e60\u65f6\u95f4\uff0c\u53ef\u80fd\u5bfc\u81f4\u4f5c\u4e1a\u79ef\u538b\u4ea7\u751f\u7126\u8651\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u7406\u6027\u770b\u5f85\u5dee\u8ddd\uff0c\u4e3b\u52a8\u5bfb\u6c42\u6539\u8fdb\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u632b\u6298\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | **\u6838\u5fc3\u98ce\u9669\u70b9**\uff1a\u82e5\u5728\u627f\u8bfa\u7684\u201c\u8fdb\u5267\u7ec4\u201d\u6216\u201c\u63a5\u5355\u201d\u5468\u671f\u5185\uff08\u59822-3\u4e2a\u6708\uff09\u672a\u80fd\u83b7\u5f97\u5b9e\u8d28\u6027\u673a\u4f1a\u6216\u6536\u5165\uff0c\u53ef\u80fd\u4ea7\u751f\u8d28\u7591\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe\u540e\u7684 **\u7b2c2-3\u4e2a\u6708**\uff0c\u5373\u6280\u80fd\u5b66\u4e60\u8fdb\u5165\u5e73\u53f0\u671f\uff0c\u4f46\u53d8\u73b0\u8def\u5f84\u5c1a\u672a\u6e05\u6670\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u80d6\u5b50\u79c0\u540c\u5b66\uff0c\u770b\u4e86\u4f60\u7684\u4f5c\u4e1a\u548c\u6c9f\u901a\uff0c\u80fd\u611f\u89c9\u5230\u4f60\u662f\u4e2a\u8e0f\u5b9e\u3001\u5bf9\u81ea\u5df1\u6709\u8981\u6c42\u7684\u4eba\u300241\u5c81\u6b63\u662f\u58f0\u97f3\u6700\u6709\u6545\u4e8b\u611f\u548c\u8d28\u611f\u7684\u9ec4\u91d1\u5e74\u9f84\uff0c\u4f60\u7684\u2018\u9752\u53d4\u97f3\u2019\u8fa8\u8bc6\u5ea6\u5f88\u9ad8\uff0c\u662f\u5e02\u573a\u7a00\u7f3a\u7684\u7c7b\u578b\u3002\u54b1\u4eec\u4e0d\u8ddf\u522b\u4eba\u6bd4\u901f\u5ea6\uff0c\u5c31\u8e0f\u8e0f\u5b9e\u5b9e\u628a\u6bcf\u4e00\u4e2a\u6587\u672c\u7684\u60c5\u7eea\u7ec6\u8282\u62a0\u5230\u4f4d\uff0c\u4f60\u7684\u4f18\u52bf\u4f1a\u8d8a\u6765\u8d8a\u660e\u663e\u3002\u4ee5\u540e\u73ed\u91cc\u6709\u9700\u8981\u7edf\u7b79\u534f\u8c03\u7684\u6d3b\u513f\uff0c\u6211\u7b2c\u4e00\u4e2a\u60f3\u5230\u4f60\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011+ \u89c2\u5bdf\u671f\u540e\uff0c\u89c6\u5176\u7ec4\u7ec7\u534f\u8c03\u610f\u613f\uff0c\u53ef\u6302\u8f7d\u3010\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\u3011\u7684\u9884\u5907\u6743\u9650\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u51e0\u5929\u5c31\u80fd\u8d5a\u5927\u94b1\u201d\u7684\u8bdd\u672f\u8fc7\u5ea6\u523a\u6fc0\u5176\u53d8\u73b0\u9884\u671f\uff1b\u7528\u5c45\u9ad8\u4e34\u4e0b\u7684\u6001\u5ea6\u5426\u5b9a\u5176\u81ea\u6211\u6539\u8fdb\u7684\u52aa\u529b\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5f53\u5176\u6280\u80fd\u8fbe\u6807\u3001\u4fe1\u5fc3\u5efa\u7acb\u540e\uff0c\u53ef\u987a\u6ed1\u63a8\u8350\u540e\u671f\u8bfe\u3001\u8bbe\u5907\u8bfe\u7b49\u9ad8\u9636\u4ea7\u54c1\u3002\u4f46\u9700\u57fa\u4e8e\u5176\u5b9e\u9645\u8fdb\u6b65\uff0c\u7528\u201c\u4e13\u4e1a\u5347\u7ea7\u201d\u800c\u975e\u201c\u5feb\u901f\u8d5a\u94b1\u201d\u7684\u8bdd\u672f\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u4eca\u5e74\u90fd41\u4e86\uff0c\u6309\u8bf4\u4e2d\u5e74\u7537\u4eba\u7684\u58f0\u97f3\u4e0d\u662f\u50cf\u5f55\u51fa\u6765\u7684\u90a3\u6837\u4e48\uff0c\u58f0\u97f3\u611f\u89c9\u8fd8\u662f\u6709\u70b9\u5355\u8584\uff0c\u9752\u6da9\u201d **(\u66b4\u9732\u5e74\u9f84\u3001\u81ea\u6211\u5ba1\u89c6\u3001\u5bfb\u6c42\u4e13\u4e1a\u8ba4\u53ef)**\n2. > \u201c\u6bcf\u4e00\u79cd\u6587\u672c\u7684\u60c5\u7eea\u600e\u6837\u8868\u8fbe\u6211\u77e5\u9053\uff0c\u4f46\u662f\u7ec6\u8282\u8fd8\u662f\u5dee\u5f88\u591a\u201d **(\u7406\u6027\u5206\u6790\u81ea\u8eab\u77ed\u677f\uff0c\u6709\u660e\u786e\u6539\u8fdb\u65b9\u5411\uff0c\u975e\u60c5\u7eea\u5316\u62b1\u6028)**\n3. > \u201c\u8bf4\u767d\u4e86\u5c31\u662f\u60f3\u591a\u8d5a\u4e00\u70b9\u94b1\u3002\u201d **(\u52a8\u673a\u76f4\u63a5\u4f46\u5e73\u548c\uff0c\u672a\u8868\u73b0\u51fa\u6781\u7aef\u7126\u8651\u6216\u4fdd\u5e95\u8981\u6c42)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4e0e\u5708\u5c42\u5f52\u5c5e\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u624e\u5b9e\u7684\u6280\u672f\u53cd\u9988\u4e0e\u660e\u786e\u7684\u8fdb\u9636\u8def\u5f84\uff0c\u4e25\u9632\u201c\u63a5\u5355\u627f\u8bfa\u201d\u843d\u7a7a\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u5f52\u5c5e\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\", \"age\": \"41\u5c81\", \"gender\": \"\u7537\
