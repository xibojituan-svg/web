        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u51ac\u96ea\u68ee\u6797 (UID: 676984272) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-02 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e-\u7396\u65f6\u5149\u3010\u7c7d\u83f2\u56e2\u961f\u3011(\u9a6c\u6210) / \u73ed\u4e3b\u4efb-\u9752\u9e1f\u6d1b\u4e00(\u9e7f\u73cd\u73cd) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u9ad8\u9636\u8bfe\u7a0b (\u5df2\u652f\u4ed8) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u5145\u88d5 (\u5df2\u652f\u4ed8\u8ba2\u5355\uff0c\u65e0\u5206\u671f/\u501f\u6b3e\u8ff9\u8c61) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u4e2d (\u788e\u7247\u5316\u62fc\u51d1\uff0c\u6bcf\u65e52-3\u5c0f\u65f6) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u5df2\u62a5\u5907\u5e76\u652f\u6301 (\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u5bb6\u4eba\u662f\u5426\u652f\u6301\u505a\u6709\u58f0\u526f\u4e1a\uff1a\u662f\u201d) |\n| **\u4fe1\u606f\u539a\u5ea6** | \u9971\u6ee1 (\u7528\u6237\u4e3b\u52a8\u63d0\u4f9b\u5b66\u4e60\u76ee\u6807\u3001\u65f6\u95f4\u3001\u5bb6\u5ead\u652f\u6301\u7b49\u4fe1\u606f\uff0c\u4e92\u52a8\u79ef\u6781) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u5174\u8da3\u4e0e\u53d8\u73b0\u76ee\u7684\u6df7\u6742\uff0c\u76ee\u6807\u6e05\u6670\u4f46\u975e\u6025\u529f\u8fd1\u5229\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u2460\u559c\u6b22\u70ed\u7231\u6709\u58f0\u6f14\u64ad\u662f\u620f\u7cbe\uff0c\u559c\u6b22\u8bd7\u8bcd\u6717\u8bf5\uff0c\u57f9\u517b\u4e00\u79cd\u5174\u8da3\u7231\u597d\uff0c\u7ed9\u81ea\u5df1\u7559\u4e0b\u4e00\u4e9b\u58f0\u97f3\u548c\u4f5c\u54c1\u6216\u8005\u662f\u7f8e\u597d\u7684\u56de\u5fc6 \u2461\u5c0f\u767d\uff0c\u60f3\u5b66\u6280\u5de7\uff0c\u60f3\u8981\u5f00\u542f\u53d8\u73b0\u517c\u804c\u6216\u5168\u804c\uff0c\u540c\u65f6\u4e5f\u60f3\u62ff\u559c\u9a6c\u5b98\u65b9\u8d44\u6e90\u548c\u6276\u6301\u653f\u7b56\uff1b\u5bfb\u627e\u5fd7\u540c\u9053\u5408\u7684\u4f19\u4f34\uff0c\u5171\u540c\u8fdb\u6b65\u7ed3\u4f34\u800c\u884c\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b06\u9ad8]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a\u9ad8 \u2014 \u5df2\u5168\u6b3e\u652f\u4ed8\u9ad8\u9636\u8bfe\u7a0b\uff0c\u65e0\u8d44\u91d1\u538b\u529b\u8ff9\u8c61\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a\u4e2d \u2014 \u81ea\u8ff0\u6bcf\u65e5\u67092-3\u5c0f\u65f6\u788e\u7247\u5316\u65f6\u95f4\u7528\u4e8e\u5b66\u4e60\u548c\u517c\u804c\uff0c\u5177\u5907\u57fa\u7840\u5b66\u4e60\u6761\u4ef6\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a\u9ad8 \u2014 \u660e\u786e\u8868\u793a\u5bb6\u4eba\u652f\u6301\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8) \u2014 \u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u5982\u8bbe\u5907\u8c03\u8bd5\u3001\u8f6f\u4ef6\u4f7f\u7528\uff09\u4e3b\u52a8\u63d0\u95ee\u5e76\u79ef\u6781\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u65e0\u62b1\u6028\u6216\u60c5\u7eea\u5d29\u6e83\u8ff9\u8c61\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u73ed\u73ed\uff0c\u621120KHz\u7684\u8fd9\u4e2a\u6807\u7ebf\u5e94\u8be5\u600e\u4e48\u5f04\u51fa\u6765\uff1f\u201d (\u4e3b\u52a8\u6c42\u89e3) > \u201c\u597d\u7684\u73ed\u73ed\uff0c\u53ef\u662f\u6211\u770b\u4e0d\u5230\u6211\u5230\u6ca1\u523020KHZ\uff0c\u5728\u4fa7\u8fb9\u7684\u6807\u7ebf\u4e0a\u6ca1\u6709\u6807\u6ce8\uff0c\u6709\u4ec0\u4e48\u529e\u6cd5\u53ef\u4ee5\u6574\u51fa\u6765\u201d (\u8ffd\u95ee\u7ec6\u8282)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u4e13\u4e1a\u6280\u80fd\u7684\u6e34\u6c42\u4e0e\u81ea\u6211\u4ef7\u503c\u5b9e\u73b0\u7684\u5411\u5f80\u3002\u5979\u4e0d\u4ec5\u60f3\u201c\u641e\u94b1\u201d\uff0c\u66f4\u5e0c\u671b\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u3001\u878d\u5165\u793e\u7fa4\u3001\u7559\u4e0b\u4f5c\u54c1\uff0c\u5b9e\u73b0\u4ece\u201c\u5c0f\u767d\u201d\u5230\u201c\u4e13\u4e1a\u8005\u201d\u7684\u8eab\u4efd\u8f6c\u53d8\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u5f52\u5c5e\u611f\u7684\u8d4b\u4e88**\u3002\u8ba9\u5979\u611f\u53d7\u5230\u81ea\u5df1\u662f\u201c\u5708\u5185\u4eba\u201d\uff0c\u6280\u80fd\u88ab\u8ba4\u53ef\uff0c\u52aa\u529b\u88ab\u770b\u89c1\uff0c\u5e76\u80fd\u4e0e\u5fd7\u540c\u9053\u5408\u8005\u5171\u540c\u8fdb\u6b65\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 **B\u7c7b** (\u9ad8\u6f5c\u529b\u3001\u9ad8\u914d\u5408\u5ea6\u3001\u6709\u660e\u786e\u6210\u957f\u8def\u5f84) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u517c\u987eT3\u7279\u8d28) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u5bb6\u4eba\u660e\u786e\u652f\u6301\uff0c\u98ce\u9669\u6781\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4e2d | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u82e5\u540e\u7eed\u517c\u804c\u6d3e\u5355\u673a\u4f1a\u5c11\u6216\u8bd5\u97f3\u5c61\u6b21\u5931\u8d25\uff0c\u53ef\u80fd\u56e0\u201c\u53d8\u73b0\u65e0\u95e8\u201d\u800c\u4ea7\u751f\u843d\u5dee\u611f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u6216\u5b66\u4e60\u632b\u6298\u800c\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u5bf9\u53d8\u73b0\u6709\u671f\u5f85\uff0c\u82e5\u5b66\u4e60\u4e2d\u671f\uff08\u5982\u7b2c4-6\u5468\uff09\u53d1\u73b0\u63a5\u5355\u96be\u5ea6\u8fdc\u8d85\u9884\u671f\u6216\u6536\u76ca\u5fae\u8584\uff0c\u53ef\u80fd\u4ea7\u751f\u5931\u671b\u60c5\u7eea\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe**\u7b2c4-8\u5468**\uff0c\u5373\u6280\u80fd\u5b66\u4e60\u8fdb\u5165\u5e73\u53f0\u671f\u3001\u5f00\u59cb\u5bc6\u96c6\u8bd5\u97f3\u4f46\u53ef\u80fd\u906d\u9047\u5931\u8d25\u6216\u7ade\u4e89\u6fc0\u70c8\u7684\u9636\u6bb5\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u51ac\u96ea\uff0c\u770b\u5230\u4f60\u4e3a\u81ea\u5df1\u89c4\u5212\u4e86\u6e05\u6670\u7684\u5b66\u4e60\u76ee\u6807\u548c\u65f6\u95f4\uff0c\u800c\u4e14\u5bb6\u4eba\u4e5f\u652f\u6301\uff0c\u8fd9\u771f\u662f\u6700\u68d2\u7684\u8d77\u70b9\u4e86\u3002\u4f60\u63d0\u7684\u5173\u4e8e\u8bbe\u5907\u548c\u6280\u672f\u7684\u95ee\u9898\u90fd\u5f88\u4e13\u4e1a\uff0c\u770b\u5f97\u51fa\u4f60\u662f\u771f\u7684\u60f3\u8e0f\u8e0f\u5b9e\u5b9e\u5b66\u597d\u8fd9\u95e8\u624b\u827a\u3002\u63a5\u4e0b\u6765\u4e24\u4e2a\u6708\uff0c\u6211\u4f1a\u662f\u4f60\u7684\u2018\u6280\u672f\u987e\u95ee\u2019\u548c\u2018\u8d44\u6e90\u5bfc\u822a\u2019\uff0c\u54b1\u4eec\u4e0d\u6025\u4e8e\u6c42\u6210\uff0c\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u5148\u628a\u57fa\u7840\u6253\u7262\uff0c\u628a\u4f5c\u54c1\u78e8\u7cbe\u3002\u6709\u4efb\u4f55\u5361\u70b9\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4eec\u4e00\u8d77\u653b\u514b\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011+\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf**\u3011\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176T2\u5b9e\u5e72+T3\u5b66\u9738\u7279\u8d28\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010**\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743**\u3011\uff08\u5982\u4f18\u5148\u83b7\u5f97\u5927\u5496\u7b54\u7591\u3001\u6df1\u5ea6\u6280\u672f\u6587\u6863\uff09\uff0c\u5e76\u53ef\u9002\u5ea6\u5f15\u5165\u3010**\u9879\u76ee\u5236\u5b9e\u6218\u5305**\u3011\uff08\u5982\u53c2\u4e0e\u5c0f\u7ec4\u753b\u672c\u3001\u6709\u58f0\u5267\u5236\u4f5c\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u53ea\u7ed9\u7a7a\u6d1e\u7684\u9f13\u52b1\uff0c\u4e0d\u7ed9\u5177\u4f53\u7684\u3001\u53ef\u6267\u884c\u7684\u6539\u8fdb\u5efa\u8bae\u30022. \u5c06\u5979\u4e0e\u6025\u4e8e\u53d8\u73b0\u7684\u5b66\u5458\u6df7\u4e3a\u4e00\u8c08\uff0c\u8fc7\u5ea6\u5f3a\u8c03\u201c\u5feb\u94b1\u201d\u6848\u4f8b\u30023. \u5ffd\u7565\u5979\u5728\u6280\u672f\u7ec6\u8282\u4e0a\u7684\u63d0\u95ee\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5979\u5177\u5907\u9ad8\u590d\u8d2d\u6f5c\u529b\uff08T2/T3\u6df7\u5408\uff09\uff0c\u5728\u5b8c\u6210\u5f53\u524d\u8bfe\u7a0b\u5e76\u6709\u4f5c\u54c1\u4ea7\u51fa\u540e\uff0c\u53ef\u9488\u5bf9\u6027\u63a8\u8350\u66f4\u9ad8\u7ea7\u7684**\u5927\u5e08\u73ed\u3001\u5267\u793e\u7b7e\u7ea6\u3001\u8bbe\u5907\u5347\u7ea7\u6307\u5bfc**\u7b49\u9ad8\u9636\u4ea7\u54c1\u6216\u670d\u52a1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u2460\u559c\u6b22\u70ed\u7231\u6709\u58f0\u6f14\u64ad\u662f\u620f\u7cbe\uff0c\u559c\u6b22\u8bd7\u8bcd\u6717\u8bf5\uff0c\u57f9\u517b\u4e00\u79cd\u5174\u8da3\u7231\u597d\uff0c\u7ed9\u81ea\u5df1\u7559\u4e0b\u4e00\u4e9b\u58f0\u97f3\u548c\u4f5c\u54c1\u6216\u8005\u662f\u7f8e\u597d\u7684\u56de\u5fc6 \u2461\u5c0f\u767d\uff0c\u60f3\u5b66\u6280\u5de7\uff0c\u60f3\u8981\u5f00\u542f\u53d8\u73b0\u517c\u804c\u6216\u5168\u804c\uff0c\u540c\u65f6\u4e5f\u60f3\u62ff\u559c\u9a6c\u5b98\u65b9\u8d44\u6e90\u548c\u6276\u6301\u653f\u7b56\uff1b\u5bfb\u627e\u5fd7\u540c\u9053\u5408\u7684\u4f19\u4f34\uff0c\u5171\u540c\u8fdb\u6b65\u7ed3\u4f34\u800c\u884c\u201d\n2. > \u201c\u73ed\u73ed\uff0c\u621120KHz\u7684\u8fd9\u4e2a\u6807\u7ebf\u5e94\u8be5\u600e\u4e48\u5f04\u51fa\u6765\uff1f...\u53ef\u662f\u6211\u770b\u4e0d\u5230\u6211\u5230\u6ca1\u523020KHZ\uff0c\u5728\u4fa7\u8fb9\u7684\u6807\u7ebf\u4e0a\u6ca1\u6709\u6807\u6ce8\uff0c\u6709\u4ec0\u4e48\u529e\u6cd5\u53ef\u4ee5\u6574\u51fa\u6765\u201d\n3. > \u201c\u5434\u6daf\u5e08\u5144\u7684\u76f4\u64ad\u8ba9\u6211\u5bf9\u6709\u58f0\u6f14\u64ad\u6709\u4e86\u66f4\u6df1\u7684\u7406\u89e3...\u8fd9\u6761\u8def\u6ca1\u6709\u6377\u5f84\uff0c\u53ea\u6709\u4e00\u6b65\u6b65\u8e0f\u5b9e\u8d70\u4e0b\u53bb\uff0c\u624d\u80fd\u8d70\u5f97\u66f4\u8fdc\u3002\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2\u4f4e\u8c03\u5b9e\u5e72\u578b\uff08\u504fT3\u5b66\u9738\uff09\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6301\u7eed\u3001\u5177\u4f53\u7684\u6280\u672f\u53cd\u9988\u4e0e\u5b9e\u6218\u673a\u4f1a\uff0c\u7ba1\u7406\u597d\u4e2d\u671f\u53d8\u73b0\u9884\u671f\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd/\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\"}\n```";
