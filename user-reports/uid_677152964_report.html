        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677152964 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e - \u76db\u840c\u5170\u300e\u5b98\u65b9\u62db\u52df\u5b98\u300f(\u6768\u65ed) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u7cbe\u82f1\u73ed\u8bfe\u7a0b\uff08\u4e2d\u9636\uff09\uff0c\u610f\u5411\u5347\u7ea7\u81f3\u9ad8\u9636\u73ed |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u73b0\u91d1\u652f\u4ed8\uff0c\u8d44\u91d1\u7d27\u5f20**\u3002\u7528\u6237\u9700\u53bb\u94f6\u884c\u5b58\u94b1\uff0c\u660e\u786e\u8868\u793a\u201c\u6ca1\u8fd9\u4e48\u591a\u94b1\u201d\uff0c\u4e14\u62d2\u7edd\u4f7f\u7528\u4fe1\u7528\u5361/\u82b1\u5457\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4e2d\u7b49**\u3002\u7528\u6237\u81ea\u8ff0\u201c\u4e2d\u7b49\u201d\uff0c\u80fd\u5b8c\u6210\u4f5c\u4e1a\u548c\u542c\u8bfe\uff0c\u4f46\u4e0a\u5348\u6709\u4e8b\u4f1a\u5ef6\u8fdf\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5bb6\u5ead\u6001\u5ea6\uff0c\u4f46\u7528\u6237\u63d0\u5230\u201c\u6211\u7238\u5988\u4e0d\u8ba9\u6211\u7528\u4fe1\u7528\u5361\u201d\uff0c\u6697\u793a\u5bb6\u5ead\u5bf9\u8d22\u52a1\u6709\u7ba1\u63a7\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u7528\u6237\u4e92\u52a8\u79ef\u6781\uff0c\u4f46\u5173\u4e8e\u5bb6\u5ead\u652f\u6301\u3001\u804c\u4e1a\u3001\u6536\u5165\u7b49\u5173\u952e\u80cc\u666f\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u578b\u3002\u6709\u901a\u8fc7\u6709\u58f0\u884c\u4e1a\u517c\u804c\u8d5a\u94b1\u7684\u660e\u786e\u610f\u613f\uff0c\u4f46\u540c\u65f6\u4e5f\u8868\u73b0\u51fa\u5bf9\u7279\u5b9a\u8d5b\u9053\uff08\u5982\u7535\u53f0\u7f8e\u6587\uff09\u7684\u5174\u8da3\u548c\u63a2\u7d22\u6b32\uff0c\u52a8\u673a\u4e2d\u6df7\u6742\u4e86\u201c\u641e\u94b1\u201d\u4e0e\u201c\u5174\u8da3/\u80fd\u529b\u63a2\u7d22\u201d\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08\u542c\u4f60\u8bb2\u5b8c\uff0c\u6211\u89c9\u5f97\u6211\u53ef\u4ee5\u8bd5\u8bd5\u7535\u53f0\u7f8e\u6587\u201d\uff1b> \u201c\u54c8\u54c8\u8c22\u8c22\u5e08\u59d0\uff0c\u4e0d\u77e5\u9053\u81ea\u5df1\u9002\u4e0d\u9002\u5408\u513f\u7ae5\u8d5b\u9053\u201d\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u652f\u4ed8\u9ad8\u9636\u8bfe\u7a0b\u8d39\u7528\u56f0\u96be\uff0c\u9700\u53bb\u94f6\u884c\u5b58\u94b1\uff0c\u4e14\u660e\u786e\u8868\u793a\u201c\u6ca1\u8fd9\u4e48\u591a\u94b1\u201d\uff0c\u8d44\u91d1\u94fe\u8106\u5f31\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u81ea\u8ff0\u201c\u4e2d\u7b49\u201d\uff0c\u80fd\u8ddf\u4e0a\u8bad\u7ec3\u8425\u8282\u594f\uff0c\u5b8c\u6210\u4f5c\u4e1a\u548c\u4e92\u52a8\uff0c\u4f46\u975e\u9ad8\u5ea6\u5bbd\u88d5\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u5b58\u5728\u98ce\u9669\u4fe1\u53f7** \u2014 \u63d0\u53ca\u201c\u7238\u5988\u4e0d\u8ba9\u6211\u7528\u4fe1\u7528\u5361\u201d\uff0c\u8868\u660e\u5bb6\u5ead\u5bf9\u8d22\u52a1\u6709\u5e72\u9884\uff0c\u53ef\u80fd\u5bf9\u9ad8\u989d\u6559\u80b2\u6d88\u8d39\u6301\u4fdd\u5b88\u6216\u53cd\u5bf9\u6001\u5ea6\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u9700\u95f4\u6b47\u6027\u5b89\u629a\u3002\u7528\u6237\u80fd\u4e3b\u52a8\u63d0\u95ee\u3001\u5bfb\u6c42\u5e2e\u52a9\uff08\u5982\u95ee\u4f5c\u4e1a\u3001\u95ee\u64cd\u4f5c\uff09\uff0c\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u627e\u4e0d\u5230\u97f3\u9891\u6587\u4ef6\uff09\u80fd\u81ea\u884c\u5c1d\u8bd5\u89e3\u51b3\uff08\u5b58\u5230QQ\u6d4f\u89c8\u5668\uff09\u3002\u4f46\u5728\u652f\u4ed8\u73af\u8282\u8868\u73b0\u51fa\u660e\u663e\u7684\u72b9\u8c6b\u548c\u538b\u529b\u3002\u6574\u4f53\u60c5\u7eea\u7a33\u5b9a\uff0c\u4f9d\u8d56\u9500\u552e\u6307\u5bfc\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5e08\u59d0 \u5f53\u6211\u70b9\u51fb\u9009\u62e9\u7684\u65f6\u5019\u5c31\u51fa\u73b0\u4e86\u8fd9\u4e2a\u754c\u9762\uff0c\u4f46\u662f\u6211\u627e\u4e0d\u5230\u6211\u7684\u97f3\u9891\uff0c\u6211\u8fd9\u4e00\u6b65\u5bf9\u5417\u201d\uff1b> \u201c\u6ca1\u8fd9\u4e48\u591a\u600e\u4e48\u529e\u201d\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u672a\u6765\u7684**\u7ecf\u6d4e\u4e0d\u5b89\u5168\u611f**\u548c**\u804c\u4e1a\u8def\u5f84\u7684\u8ff7\u832b**\u3002\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u4e00\u9879\u6280\u80fd\u83b7\u5f97\u7a33\u5b9a\u7684\u517c\u804c\u6536\u5165\uff0c\u4ee5\u62b5\u5fa1\u6f5c\u5728\u7684\u7ecf\u6d4e\u98ce\u9669\uff0c\u5bfb\u6c42\u4e00\u4efd\u201c\u4fdd\u969c\u201d\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u7684\u8def\u5f84\u627f\u8bfa**\u4e0e**\u4f4e\u98ce\u9669\u7684\u8d77\u6b65\u652f\u6301**\u3002\u4ed6\u9700\u8981\u88ab\u660e\u786e\u544a\u77e5\u201c\u6309\u90e8\u5c31\u73ed\u5c31\u80fd\u6709\u6536\u5165\u201d\uff0c\u5e76\u611f\u53d7\u5230\u5e73\u53f0\u548c\u5e08\u59d0\u4f1a\u4e3a\u4ed6\u515c\u5e95\uff0c\u964d\u4f4e\u5176\u8bd5\u9519\u6210\u672c\u548c\u8d77\u6b65\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1** \u7c7b (\u6709\u660e\u786e\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\uff0c\u4f46\u8d44\u6e90\u5e95\u5ea7\u8584\u5f31\uff0c\u5b58\u5728\u652f\u4ed8\u538b\u529b\u548c\u6f5c\u5728\u5bb6\u5ead\u98ce\u9669) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u578b (\u504f\u7126\u8651\u7248)**\u3002\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u83b7\u5f97\u7ecf\u6d4e\u4fdd\u969c\uff0c\u4f46\u5bf9\u81ea\u8eab\u80fd\u529b\u548c\u6295\u5165\u56de\u62a5\u6709\u7591\u8651\uff0c\u9700\u8981\u5f3a\u7ed3\u679c\u5bfc\u5411\u548c\u4f4e\u95e8\u69db\u627f\u8bfa\u3002 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u7528\u6237\u867d\u8d44\u91d1\u7d27\u5f20\uff0c\u4f46\u575a\u6301\u4f7f\u7528\u73b0\u91d1\u50a8\u84c4\u652f\u4ed8\uff0c\u660e\u786e\u62d2\u7edd\u501f\u8d37\uff08\u201c\u8fd9\u4e2a\u4e1c\u897f\u6211\u662f\u4e07\u4e07\u4e0d\u6562\u63a5\u89e6\u7684\u201d\uff09\uff0c\u5b88\u4f4f\u4e86\u8d22\u52a1\u5e95\u7ebf\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u82e5\u540e\u7eed\u5927\u989d\u8865\u5dee\u4ef7\u5347\u7ea7\u8bfe\u7a0b\u88ab\u5bb6\u5ead\u53d1\u73b0\u5e76\u53cd\u5bf9\uff0c\u53ef\u80fd\u5f15\u53d1\u51b2\u7a81\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u65f6\u95f4\u5b89\u6392\u201c\u4e2d\u7b49\u201d\uff0c\u4f46\u5b66\u4e60\u6001\u5ea6\u79ef\u6781\uff0c\u80fd\u4e3b\u52a8\u8865\u8bfe\uff0c\u5d29\u76d8\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u9047\u5230\u64cd\u4f5c\u95ee\u9898\u80fd\u4e3b\u52a8\u8be2\u95ee\u5e76\u5c1d\u8bd5\u89e3\u51b3\uff0c\u5fc3\u7406\u5f39\u6027\u5c1a\u53ef\uff0c\u975e\u5de8\u5a74\u578b\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u5bf9\u201c\u8fb9\u5b66\u8fb9\u8d5a\u201d\u671f\u671b\u9ad8\uff0c\u82e5\u5728\u7cbe\u82f1\u73ed\u5b66\u4e60\u671f\u95f4\uff082\u4e2a\u6708\uff09\u672a\u80fd\u83b7\u5f97\u9884\u671f\u7684\u8bd5\u97f3\u673a\u4f1a\u6216\u5fae\u5c0f\u6536\u76ca\uff0c\u6781\u6613\u4ea7\u751f\u201c\u88ab\u9a97\u201d\u611f\uff0c\u5f15\u53d1\u5f3a\u70c8\u9000\u8d39\u8bc9\u6c42\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c4-8\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u82e5\u5b9e\u64cd\u63a5\u5355\u8fdb\u5c55\u7f13\u6162\uff0c\u4e0e\u9500\u552e\u63cf\u7ed8\u7684\u201c\u5feb\u901f\u4e0a\u624b\u201d\u84dd\u56fe\u4ea7\u751f\u843d\u5dee\uff0c\u9000\u8d39\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6c11\u6cd5\u5178\u540c\u5b66\u4f60\u597d\uff01\u770b\u5230\u4f60\u8bad\u7ec3\u8425\u671f\u95f4\u7279\u522b\u8ba4\u771f\uff0c\u4f5c\u4e1a\u548c\u4e92\u52a8\u90fd\u5b8c\u6210\u5f97\u5f88\u597d\uff0c\u5e08\u59d0\u4e5f\u5938\u4f60\u58f0\u97f3\u6761\u4ef6\u4e0d\u9519\u3002\u54b1\u4eec\u7cbe\u82f1\u73ed\u7684\u6838\u5fc3\u76ee\u6807\u5c31\u662f\u2018\u7a33\u624e\u7a33\u6253\uff0c\u5148\u63a5\u5c0f\u5355\u2019\uff0c\u6211\u4f1a\u5e2e\u4f60\u89c4\u5212\u597d\u6bcf\u4e00\u6b65\uff0c\u4ece\u6700\u7b80\u5355\u7684\u65c1\u767d\u3001\u753b\u672c\u5f00\u59cb\uff0c\u8ba9\u4f60\u5728\u5b66\u4e60\u7684\u540c\u65f6\u5c31\u80fd\u770b\u5230\u5b9e\u5b9e\u5728\u5728\u7684\u8fdb\u6b65\u548c\u53ef\u80fd\u7684\u5c0f\u6536\u76ca\u3002\u54b1\u4eec\u4e0d\u56fe\u5feb\uff0c\u56fe\u7684\u662f\u6bcf\u4e00\u6b65\u90fd\u8d70\u5f97\u7a33\u3001\u8d5a\u5f97\u5b89\u5fc3\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5feb\u901f\u63a5\u5355\u7ebf\uff08\u8f7b\u91cf\u7248\uff09**\u3011\u3002\u6838\u5fc3\u662f\u201c\u4f4e\u96be\u5ea6\u3001\u5feb\u53cd\u9988\u201d\u3002\u4f18\u5148\u5f15\u5bfc\u5176\u5b8c\u6210\u753b\u672c\u3001\u7b80\u5355\u65c1\u767d\u7b49\u6613\u4e0a\u624b\u7684\u659c\u6760\u4efb\u52a1\uff0c\u54ea\u6015\u6536\u5165\u5fae\u8584\uff0c\u91cd\u5728\u5efa\u7acb\u201c\u6211\u80fd\u8d5a\u94b1\u201d\u7684\u4fe1\u5fc3\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u8d44\u91d1\u538b\u529b\u548c\u7126\u8651\u5fc3\u6001\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010**\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305**\u3011\u4e0e\u3010**\u5fae\u6536\u76ca\u53ef\u89c6\u5316\u5305**\u3011\u3002\u73ed\u4e3b\u4efb\u9700\u9ad8\u9891\u3001\u5177\u4f53\u5730\u53cd\u9988\u5176\u5fae\u5c0f\u8fdb\u6b65\uff0c\u5e76\u5c55\u793a\u5176\u4ed6\u5b66\u5458\u901a\u8fc7\u7b80\u5355\u4efb\u52a1\u83b7\u5f97\u6536\u76ca\u7684\u6848\u4f8b\uff08\u54ea\u6015\u662f\u51e0\u5341\u5143\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5728\u7cbe\u82f1\u73ed\u524d\u671f\uff08\u81f3\u5c11\u7b2c\u4e00\u4e2a\u6708\uff09**\u7edd\u4e0d\u5bf9\u5176\u65bd\u52a0\u9ad8\u96be\u5ea6\u4f5c\u4e1a\u538b\u529b**\uff1b**\u7edd\u4e0d\u5bf9\u5176\u63cf\u7ed8\u4e0d\u5207\u5b9e\u9645\u7684\u9ad8\u6536\u5165\u84dd\u56fe**\uff1b**\u4e25\u7981\u5728\u672a\u5efa\u7acb\u4fe1\u4efb\u548c\u5fae\u5c0f\u6210\u679c\u524d\uff0c\u50ac\u4fc3\u5176\u8865\u5dee\u4ef7\u5347\u7ea7\u9ad8\u9636\u73ed**\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u7cbe\u82f1\u73ed\u5b66\u4e60\u671f\u5185\u8fdb\u884c\u5927\u989d\u5347\u5355\u63a8\u4ecb**\u3002\u4ec5\u53ef\u5728\u5176\u901a\u8fc7\u659c\u6760\u4efb\u52a1\u83b7\u5f97\u7a33\u5b9a\u5fae\u5c0f\u6536\u76ca\u3001\u4e14\u4e3b\u52a8\u8868\u8fbe\u5b66\u4e60\u74f6\u9888\u540e\uff0c\u65b9\u53ef\u8c28\u614e\u63a2\u8ba8\u5347\u7ea7\u53ef\u80fd\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u76ee\u524d\u53ea\u6709\u73b0\u91d1\uff0c\u53ef\u80fd\u5f97\u53bb\u94f6\u884c\u6362\u4e00\u4e0b\u94b1\u201d\n2. > \u201c\u6ca1\u8fd9\u4e48\u591a\u600e\u4e48\u529e\u201d\n3. > \u201c\u6211\u7238\u5988\u4e0d\u8ba9\u6211\u7528\u4fe1\u7528\u5361\uff0c\u8fd8\u6709\u82b1\u5457\u4e4b\u7c7b\u7684\uff0c\u8fd9\u4e2a\u4e1c\u897f\u6211\u662f\u4e07\u4e07\u4e0d\u6562\u63a5\u89e6\u7684\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T4\u641e\u94b1\u7ed3\u679c\u578b\uff08\u7126\u8651\u7248\uff09**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u7ecf\u6d4e\u4fdd\u969c\uff08\u5b89\u5168\u9700\u6c42\uff09**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d\u504f\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u5728\u7cbe\u82f1\u73ed\u521d\u671f\uff081\u4e2a\u6708\u5185\uff09\u52a1\u5fc5\u5f15\u5bfc\u5176\u5b8c\u6210\u81f3\u5c111-2\u4e2a\u80fd\u5e26\u6765\u5fae\u5c0f\u73b0\u91d1\u56de\u62a5\u7684\u5b9e\u64cd\u4efb\u52a1\uff0c\u5efa\u7acb\u201c\u5b66\u4e60=\u6709\u56de\u62a5\u201d\u7684\u786e\u5b9a\u6027\u611f\u77e5**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf\uff08\u8f7b\u91cf\u7248\uff09\"}\n```";
