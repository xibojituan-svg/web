    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u4e9a\u4e91 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-10 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u8d85\u4eba\u6897\u54e5(\u803f\u4e1a\u4e1c) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b + \u5f55\u97f3\u8bbe\u5907 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u5145\u88d5 (\u5df2\u8d2d\u8bfe\u7a0b\u53ca\u8bbe\u5907\uff0c\u672a\u63d0\u53ca\u8d44\u91d1\u538b\u529b) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u4e2d (\u6709\u56fa\u5b9a\u5de5\u4f5c\uff0c\u9700\u8bf7\u5047\u6216\u542c\u56de\u653e\uff0c\u4f46\u80fd\u575a\u6301\u5b66\u4e60\u4e0e\u4e92\u52a8) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u7f3a\u5931 (\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u60c5\u51b5) |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e2d\u7b49 (\u5b66\u4e60\u4e92\u52a8\u79ef\u6781\uff0c\u4f46\u5173\u952e\u5bb6\u5ead\u53ca\u6df1\u5c42\u52a8\u673a\u4fe1\u606f\u4e0d\u8db3) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06**\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u5173\u6ce8\u53d1\u97f3\u3001\u8bbe\u5907\u3001\u540e\u671f\u6280\u672f\u7b49\u4e13\u4e1a\u7ec6\u8282\uff0c\u5bf9\u53d8\u73b0\u65e0\u6025\u5207\u8981\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u73ed\u73ed\uff0c\u4f60\u770b\u8fd9\u4e2a\u505a\u591c\u542c\u53ef\u4ee5\u4e0d\u201d\u3001\u201c\u8fd9\u4e9b\u4ee5\u540e\u662f\u4e0d\u662f\u4e5f\u4f1a\u5b66\u5230\u201d\u3001\u201c\u540e\u9762\u5347\u7ea7\u662f\u4e0d\u662f\u6bd4\u524d\u9762\u8fd9\u51e0\u7ea7\u8981\u96be\u4e00\u70b9\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1**\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u5df2\u4e3a\u8bfe\u7a0b\u548c\u8bbe\u5907\u4ed8\u8d39\uff0c\u4f46\u4e3b\u52a8\u8be2\u95ee\u201c\u540e\u9762\u5230\u5e95\u8fd8\u8981\u6295\u8d44\u591a\u5c11\u201d\uff0c\u5bf9\u6301\u7eed\u6295\u5165\u6709\u6210\u672c\u610f\u8bc6\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u575a\u6301\u5b66\u4e60\u3001\u6253\u5361\u3001\u4e92\u52a8\uff0c\u4f46\u9700\u8bf7\u5047\u5904\u7406\u4e2a\u4eba\u4e8b\u52a1\uff0c\u65f6\u95f4\u975e\u5b8c\u5168\u81ea\u7531\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff0c\u6784\u6210\u6f5c\u5728\u98ce\u9669\u77ed\u677f\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06**\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9047\u5230\u95ee\u9898\uff08\u5982\u540e\u9f3b\u97f3\u56f0\u6270\u3001\u7535\u8111\u8001\u65e7\uff09\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u80fd\u81ea\u6211\u8c03\u8282\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u7ecf\u5e38\u540c\u5b66\u4eec\u70b9\u8bc4\u7684\u65f6\u5019\uff0c\u90fd\u8bf4\u6211\u53d1\u97f3\u4e0d\u6807\u51c6...\u542c\u4f60\u8fd9\u4e48\u8bf4\u6211\u653e\u5fc3\u591a\u4e86\u201d\u3001\u201c\u672c\u6765\u4e00\u5f00\u59cb\u4e5f\u6ca1\u671f\u671b\u592a\u9ad8\uff0c\u90a3\u5c31\u8fd9\u6837\uff0c\u4e00\u76f4\u505a\u5c31\u884c\u4e86[\u5472\u7259]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42** ] \u4e0e [ **\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u6e34\u671b\u5728\u793e\u7fa4\u4e2d\u83b7\u5f97\u8ba4\u53ef\u4e0e\u5f52\u5c5e\u611f\uff0c\u901a\u8fc7\u79ef\u6781\u70b9\u8bc4\u4ed6\u4eba\u3001\u53c2\u4e0e\u4e92\u52a8\u6765\u5efa\u7acb\u8fde\u63a5\uff0c\u540c\u65f6\u5e0c\u671b\u81ea\u5df1\u7684\u4e13\u4e1a\u80fd\u529b\uff08\u53d1\u97f3\uff09\u5f97\u5230\u80af\u5b9a\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u793e\u7fa4\u5185\u7684\u79ef\u6781\u53cd\u9988\u4e0e\u4e13\u4e1a\u8eab\u4efd\u8ba4\u540c**\u3002\u8ba9\u4ed6\u611f\u53d7\u5230\u81ea\u5df1\u662f\u201c\u6709\u6f5c\u529b\u7684\u4e00\u5458\u201d\uff0c\u5e76\u901a\u8fc7\u5728\u540c\u5b66\u95f4\u7684\u4e92\u52a8\u83b7\u5f97\u4ef7\u503c\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 **B\u7c7b** (\u52a8\u673a\u7eaf\u5ea6\u9ad8\uff0c\u8d44\u6e90\u5e95\u5ea7\u4e2d\u7b49\uff0c\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u793e\u4ea4\u9a71\u52a8\u5f3a) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T5 \u597d\u73a9\u5c1d\u9c9c\u578b** (\u793e\u4ea4\u6d3b\u8dc3\uff0c\u4e50\u4e8e\u4e92\u52a8\uff0c\u5b66\u4e60\u8fc7\u7a0b\u672c\u8eab\u5e26\u6765\u4e50\u8da3\uff0c\u5bf9\u53d8\u73b0\u7ed3\u679c\u6709\u671f\u5f85\u4f46\u4e0d\u6025\u8feb) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5ead\u5927\u5435\u7b49\u8ff9\u8c61\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u4fe1\u606f\u7f3a\u5931\uff0c**\u9700\u91cd\u70b9\u6392\u67e5**\u3002\u82e5\u5b58\u5728\u5bb6\u4eba\u53cd\u5bf9\u6216\u4e0d\u77e5\u60c5\uff0c\u98ce\u9669\u5c06\u663e\u8457\u5347\u9ad8\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u5b66\u4e60\u6001\u5ea6\u79ef\u6781\uff0c\u80fd\u4e3b\u52a8\u5b89\u6392\u65f6\u95f4\uff0c\u81ea\u5f8b\u6027\u8f83\u597d\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u81ea\u6211\u5f00\u89e3\uff0c\u4e3b\u52a8\u5bfb\u6c42\u5e2e\u52a9\u800c\u975e\u62b1\u6028\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4f4e** | \u52a8\u673a\u975e\u7eaf\u53d8\u73b0\u9a71\u52a8\uff0c\u5bf9\u5b66\u4e60\u8fc7\u7a0b\u6709\u5408\u7406\u9884\u671f\uff08\u201c\u672c\u6765\u4e00\u5f00\u59cb\u4e5f\u6ca1\u671f\u671b\u592a\u9ad8\u201d\uff09\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c4-6\u5468\uff08\u6280\u80fd\u5e73\u53f0\u671f\uff09**\u3002\u5f53\u57fa\u7840\u7ec3\u4e60\u8fdb\u5165\u74f6\u9888\uff0c\u82e5\u7f3a\u4e4f\u53ca\u65f6\u7684\u6b63\u53cd\u9988\u548c\u793e\u7fa4\u6fc0\u52b1\uff0c\u53ef\u80fd\u4ea7\u751f\u201c\u4ed8\u51fa\u65e0\u8fdb\u6b65\u201d\u7684\u5026\u6020\u611f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4e9a\u4e91\uff0c\u770b\u5230\u4f60\u5728\u7fa4\u91cc\u8fd9\u4e48\u70ed\u5fc3\u5730\u7ed9\u5927\u5bb6\u70b9\u8bc4\uff0c\u73ed\u73ed\u89c9\u5f97\u4f60\u7279\u522b\u6709\u2018\u5b66\u59d0\u2019\u98ce\u8303\uff01\u54b1\u4eec\u8fd9\u4e2a\u73ed\u6709\u4f60\u8fd9\u6837\u4e50\u4e8e\u5206\u4eab\u3001\u5171\u540c\u8fdb\u6b65\u7684\u540c\u5b66\uff0c\u6c1b\u56f4\u771f\u7684\u7279\u522b\u597d\u3002\u63a5\u4e0b\u6765\u7684\u5b66\u4e60\u8def\u4e0a\uff0c\u4f60\u4e0d\u4ec5\u662f\u5b66\u5458\uff0c\u4e5f\u662f\u54b1\u4eec\u73ed\u7684\u2018\u6c1b\u56f4\u62c5\u5f53\u2019\uff0c\u671f\u5f85\u4f60\u5e26\u7740\u5927\u5bb6\u4e00\u8d77\u73a9\u8f6c\u58f0\u97f3\uff01\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5174\u8da3\u6e38\u4e50\u7ebf**\u3011+ \u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\uff08\u8f7b\u91cf\uff09**\u3011\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u793e\u4ea4\u4e0e\u5c0a\u91cd\u9700\u6c42\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010**\u793e\u7fa4\u4e92\u52a8\u6fc0\u52b1\u5305**\u3011\uff0c\u5982\u8d4b\u4e88\u201c\u70b9\u8bc4\u5b98\u201d\u3001\u201c\u5c0f\u7ec4\u957f\u201d\u7b49\u865a\u62df\u8eab\u4efd\uff0c\u5e76\u5728\u793e\u7fa4\u516c\u5f00\u8868\u626c\u5176\u79ef\u6781\u884c\u4e3a\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5ffd\u89c6\u4ed6\u7684\u793e\u4ea4\u8d21\u732e\u3002\u4e0d\u8981\u53ea\u628a\u4ed6\u5f53\u666e\u901a\u5b66\u5458\u7ba1\u7406\uff0c\u8981\u8d4b\u4e88\u4ed6\u4e00\u5b9a\u7684\u793e\u7fa4\u89d2\u8272\u548c\u8363\u8a89\u611f\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u8fdb\u884c\u9002\u5ea6\u5347\u5355\u63a8\u4ecb**\u3002\u56e0\u5176\u5df2\u8d2d\u4e70\u8bbe\u5907\uff0c\u5bf9\u4e13\u4e1a\u6709\u8ffd\u6c42\uff0c\u53ef\u63a8\u8350\u4e0e\u8bbe\u5907\u914d\u5957\u7684\u8fdb\u9636\u540e\u671f\u8bfe\u7a0b\u6216\u9ad8\u9636\u6f14\u64ad\u8425\uff0c\u4f46\u9700\u57fa\u4e8e\u5176\u201c\u80fd\u529b\u63d0\u5347\u201d\u800c\u975e\u201c\u5feb\u901f\u53d8\u73b0\u201d\u7684\u8bc9\u6c42\u8fdb\u884c\u6c9f\u901a\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u7ecf\u5e38\u540c\u5b66\u4eec\u70b9\u8bc4\u7684\u65f6\u5019\uff0c\u90fd\u8bf4\u6211\u53d1\u97f3\u4e0d\u6807\u51c6\uff0c\u88ab\u7ea0\u7684\u5b57\u90fd\u662f\u540e\u9f3b\u97f3\uff0c\u4e0d\u662f\u4e00\u4e24\u4e2a\u4eba\u8fd9\u6837\u8bf4\u4e86\uff0c\u542c\u4f60\u8fd9\u4e48\u8bf4\u6211\u653e\u5fc3\u591a\u4e86[\u5472\u7259]\u201d **(\u4f53\u73b0\u5fc3\u7406\u5f39\u6027\u4e0e\u5bfb\u6c42\u8ba4\u53ef)**\n2. > \u201c\u672c\u6765\u4e00\u5f00\u59cb\u4e5f\u6ca1\u671f\u671b\u592a\u9ad8\uff0c\u90a3\u5c31\u8fd9\u6837\uff0c\u4e00\u76f4\u505a\u5c31\u884c\u4e86[\u5472\u7259]\u201d **(\u4f53\u73b0\u52a8\u673a\u7eaf\u5ea6\u548c\u7a33\u5b9a\u5fc3\u6001)**\n3. > \u201c\u73ed\u73ed\uff0c\u80fd\u4e0d\u80fd\u900f\u4e2a\u5e95\uff1f\u540e\u9762\u5230\u5e95\u8fd8\u8981\u6295\u8d44\u591a\u5c11\u5440\uff1f\u600e\u4e48\u611f\u89c9\u4e00\u76f4\u5728\u4e0d\u65ad\u6295\u8d44[\u6342\u8138]\u201d **(\u4f53\u73b0\u5bf9\u6210\u672c\u7684\u5173\u6ce8\uff0c\u975e\u76f2\u76ee\u6d88\u8d39)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T5 \u597d\u73a9\u5c1d\u9c9c\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u793e\u7fa4\u5f52\u5c5e\u611f\u4e0e\u80fd\u529b\u88ab\u5c0a\u91cd**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4f4e**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u5c06\u5176\u7eb3\u5165\u73ed\u59d4\u6216\u70b9\u8bc4\u5b98\u4f53\u7cfb\uff0c\u7528\u793e\u7fa4\u8363\u8a89\u611f\u9501\u4f4f\u4ed6**\u3002\n\n```json\n{\"core_type\": \"T5 \u597d\u73a9\u5c1d\u9c9c\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u793e\u4ea4\u4e0e\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf+\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\uff08\u8f7b\u91cf\uff09\"}\n```";
