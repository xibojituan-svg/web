    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u6bb5\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a676976271 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6696\u6696-\u5b98\u65b9\u62db\u52df\u5b98(\u4f55\u4f73) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u4ef7\u683c\u672a\u660e\u786e\uff0c\u63d0\u53ca3980\u521d\u7ea7/7380\u4e2d\u7ea7\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u7f3a\u5931**\u3002\u7528\u6237\u6700\u7ec8\u4ed8\u6b3e\u6210\u529f\uff0c\u4f46\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u8d44\u91d1\u6765\u6e90\u3001\u662f\u5426\u5206\u671f\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u7f3a\u5931**\u3002\u7528\u6237\u5df2\u9000\u4f11\uff0c\u65f6\u95f4\u770b\u4f3c\u5145\u88d5\uff0c\u4f46\u672a\u63d0\u53ca\u5177\u4f53\u65e5\u5e38\u5b89\u6392\u3001\u7167\u62a4\u8d1f\u62c5\u7b49\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\u3002\u672a\u63d0\u53ca\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u5173\u952e\u4fe1\u606f\u5982\u652f\u4ed8\u65b9\u5f0f\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u5177\u4f53\u65f6\u95f4\u7cbe\u529b\u72b6\u51b5\u3001\u8fc7\u5f80\u6536\u5165\u4e0e\u671f\u671b\u503c\u5747\u672a\u83b7\u53d6\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u5174\u8da3\u4e0e\u81ea\u6211\u5b9e\u73b0\u800c\u6765\uff0c\u53d8\u73b0\u8bc9\u6c42\u6a21\u7cca\uff0c\u5b66\u4e60\u9a71\u52a8\u6e90\u4e8e\u5185\u5728\u70ed\u7231\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u6211\u53c2\u52a0\u6717\u8bf5\u5b66\u4e60\uff0c\u66f4\u591a\u662f\u7231\u597d\uff0c\u6216\u4e3a\u4e86\u9632\u8001\u5e74\u75f4\u5446\uff0c\u7ed3\u679c\u8d70\u5230\u4e86\u73b0\u5728\u3002\u201d\n> \u201c\u575a\u5b9a\u7684\u5f80\u524d\u8d70\u3002[\u73ab\u7470][\u62f3\u5934]\u201d\uff08\u56de\u5e94\u9500\u552e\u5173\u4e8e\u201c\u6765\u6709\u58f0\u884c\u4e1a\u53d1\u5c55\u201d\u7684\u63d0\u95ee\uff09\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u672a\u63d0\u53ca\u6536\u5165\u3001\u652f\u4ed8\u80fd\u529b\u3001\u7ecf\u6d4e\u72b6\u51b5\u3002\u5df2\u9000\u4f11\uff0c\u6536\u5165\u6765\u6e90\u4e0d\u660e\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u5df2\u9000\u4f11\uff0c\u65f6\u95f4\u76f8\u5bf9\u81ea\u7531\uff0c\u80fd\u5b8c\u6210\u4f5c\u4e1a\u3001\u542c\u8bfe\u3002\u4f46**\u5e74\u9f8469\u5c81**\uff0c\u89c6\u529b\u5f31\uff08\u201c\u6211\u89c6\u529b\u5f31\u3002\u4e0d\u80fd\u8001\u76ef\u7740\u624b\u673a\u201d\uff09\uff0c\u6570\u5b57\u5316\u64cd\u4f5c\u80fd\u529b\u5b58\u7591\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\u3002\n- **\u5e95\u5ea7\u53d6\u77ed\u677f**\uff1a**\u4f4e**\u3002\u8d44\u91d1\u7ef4\u5ea6\u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u5e74\u9f8469\u5c81\u89e6\u53ca**\u94f6\u53d1\u65cf\u64cd\u4f5c\u65ad\u5c42**\u7ea2\u7ebf\uff0c\u7cbe\u529b\u7ef4\u5ea6\u81ea\u52a8\u964d\u7ea7\uff0c\u4e14\u5b58\u5728\u89c6\u529b\u969c\u788d\uff0c\u6574\u4f53\u5e95\u5ea7\u8bc4\u4f30\u4e3a\u4f4e\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u8868\u73b0\u51fa\u660e\u663e\u7684\u81ea\u6211\u6000\u7591\u3001\u4e0d\u81ea\u4fe1\uff0c\u9700\u8981\u5916\u90e8\u6301\u7eed\u786e\u8ba4\u548c\u5b89\u629a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u6211\u4e0d\u8e0f\u5b9e\u3002[\u5472\u7259][\u5c34\u5c2c]\u201d\uff08\u5728\u5df2\u88ab\u544a\u77e5\u901a\u8fc7\u521d\u5ba1\u540e\u4ecd\u53cd\u590d\u786e\u8ba4\uff09\n> \u201c\u6211\u62c5\u5fc3\u901a\u5173\u8fc7\u4e0d\u4e86\u5173\u3002[\u73ab\u7470][\u5472\u7259][\u5077\u7b11]\u201d\n> \u201c\u8bf4\u771f\u7684\u633a\u832b\u7136\u3002\u201d\uff08\u5728\u9500\u552e\u8be2\u95ee\u804c\u4e1a\u548c\u6536\u5165\u671f\u671b\u65f6\uff0c\u56de\u907f\u95ee\u9898\uff0c\u8f6c\u800c\u503e\u8bc9\u4e2a\u4eba\u5386\u53f2\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42** \u4e0e **\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42** \u6df7\u5408\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u9000\u4f11\u540e\u7684\u4ef7\u503c\u5931\u843d\u4e0e\u8eab\u4efd\u7126\u8651**\u3002\u7528\u6237\u53cd\u590d\u5f3a\u8c03\u8fc7\u53bb\u7684\u6210\u5c31\uff08\u4f01\u4e1a\u4e2d\u5c42/\u6b63\u804c\uff09\uff0c\u5e76\u79f0\u6717\u8bf5\u5e26\u6765\u4e86\u201c\u5f88\u5927\u7684\u79ef\u6781\u5f71\u54cd\u201d\uff0c\u8868\u660e\u4ed6\u6e34\u671b\u901a\u8fc7\u65b0\u6280\u80fd\u91cd\u65b0\u83b7\u5f97\u793e\u4f1a\u8ba4\u53ef\u548c\u81ea\u6211\u4ef7\u503c\u611f\uff0c\u5bf9\u6297\u56e0\u9000\u4f11\u548c\u5e74\u9f84\u589e\u957f\u5e26\u6765\u7684\u201c\u832b\u7136\u201d\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u5c0a\u91cd\u3001\u8ba4\u53ef\u4e0e\u201c\u88ab\u9700\u8981\u201d\u7684\u5f52\u5c5e\u611f**\u3002\u4ed6\u9700\u8981\u88ab\u5f53\u4f5c\u4e00\u4e2a\u201c\u6709\u7ecf\u9a8c\u3001\u6709\u5e95\u8574\u7684\u6f5c\u529b\u8005\u201d\u800c\u975e\u201c\u8001\u5e74\u4eba\u201d\u6765\u5bf9\u5f85\uff0c\u6e34\u671b\u5728\u793e\u7fa4\u4e2d\u627e\u5230\u65b0\u4f4d\u7f6e\uff0c\u5ef6\u7eed\u8fc7\u53bb\u7684\u9886\u5bfc\u529b\u6216\u5f71\u54cd\u529b\uff08\u5982\u201c\u4e00\u8def\u6709\u4f60\uff0c\u4e00\u8def\u5411\u524d\u201d\uff09\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udd34D\u7c7b\uff08\u9ad8\u5371\u7194\u65ad\u578b\uff09** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b**\uff08\u6df7\u5408T8\u6f5c\u6c34\u5403\u74dc\u578b\u7684\u89c2\u5bdf\u7279\u8d28\uff09 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\ud83d\udd34**\u5df2\u89e6\u53d1 D \u7c7b\u7194\u65ad\u7ea2\u7ebf\uff01**\n- **\u89e6\u53d1\u56e0\u7531**\uff1a**\u8eab\u4efd\u7ea2\u7ebf + \u5065\u5eb7\u7ea2\u7ebf**\u3002\u7528\u6237\u5e74\u9f8469\u5c81\uff08>65\u5c81\uff09\uff0c\u4e14\u81ea\u8ff0\u201c\u89c6\u529b\u5f31\u201d\uff0c\u5c5e\u4e8e**\u94f6\u53d1\u65cf\u64cd\u4f5c\u65ad\u5c42**\u3002\u6839\u636e\u5f15\u64ce\u89c4\u5219\uff0c\u552e\u5356\u590d\u6742\u8f6f\u4ef6\u8bfe\u7a0b\u7ed9>65\u5c81\u7528\u6237\u65f6\uff0c\u7cbe\u529b\u7ef4\u5ea6\u81ea\u52a8\u964d\u4f4e\u4e00\u7ea7\uff0c**\u4e0d\u5f97\u8fdb\u5165\u6b63\u5e38\u5927\u8bfe\u670d\u52a1\u6c60**\uff0c\u5e94\u76f4\u63a5\u89e6\u53d1D\u7c7b\u7194\u65ad\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4e2d | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u9ad8\u9f84\u7528\u6237\u51b3\u7b56\u53ef\u80fd\u53d7\u5b50\u5973\u5f71\u54cd\uff0c\u82e5\u5bb6\u4eba\u53cd\u5bf9\u6781\u6613\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u6781\u9ad8** | **\u94f6\u53d1\u65cf\u64cd\u4f5c\u65ad\u5c42**\uff1a\u8bfe\u7a0bAPP/\u8f6f\u4ef6\u64cd\u4f5c\u590d\u6742\uff0c\u89c6\u529b\u969c\u788d\u5bfc\u81f4\u65e0\u6cd5\u8ddf\u4e0a\u76f4\u64ad\u3001\u5b8c\u6210\u4f5c\u4e1a\uff0c\u4ea7\u751f\u5de8\u5927\u632b\u8d25\u611f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | \u5fc3\u7406\u5f39\u6027\u6781\u4f4e\uff0c\u9047\u5230\u7b2c\u4e00\u4e2a\u6280\u672f\u96be\u9898\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u3001\u97f3\u9891\u5bfc\u51fa\uff09\u5c31\u53ef\u80fd\u56e0\u81ea\u5c0a\u5fc3\u53d7\u632b\u800c\u653e\u5f03\uff0c\u5e76\u5f52\u548e\u4e8e\u8bfe\u7a0b\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u52a8\u673a\u7eaf\u5ea6\u9ad8\uff0c\u5bf9\u53d8\u73b0\u671f\u671b\u4e0d\u660e\uff0c\u4f46\u82e5\u53d1\u73b0\u5b66\u4e60\u8fc7\u7a0b\u4e0e\u201c\u9632\u8001\u5e74\u75f4\u5446\u201d\u7684\u8f7b\u677e\u9884\u671f\u4e0d\u7b26\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c\u4e00\u5468**\u3002\u5f53\u9700\u8981\u72ec\u7acb\u64cd\u4f5c\u8f6f\u4ef6\u3001\u5b8c\u6210\u590d\u6742\u4f5c\u4e1a\u65f6\uff0c\u64cd\u4f5c\u56f0\u96be\u4e0e\u5fc3\u7406\u8106\u5f31\u53cc\u91cd\u53e0\u52a0\uff0c\u6781\u6613\u5d29\u6e83\u9000\u8d39\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cX\u8001\u5e08\uff08\u7528\u5c0a\u79f0\uff09\uff0c\u770b\u5230\u60a8\u8fc7\u53bb\u7684\u7ecf\u5386\uff0c\u771f\u7684\u975e\u5e38\u656c\u4f69\u3002\u60a8\u4e0d\u662f\u4ece\u96f6\u5f00\u59cb\u7684\u5c0f\u767d\uff0c\u800c\u662f\u5e26\u7740\u51e0\u5341\u5e74\u4eba\u751f\u9605\u5386\u548c\u6717\u8bf5\u529f\u5e95\u6765\u2018\u73a9\u58f0\u97f3\u2019\u7684\u8d44\u6df1\u524d\u8f88\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\uff0c\u60a8\u5c31\u5f53\u662f\u4e2a\u9ad8\u7ea7\u7684\u5174\u8da3\u4ff1\u4e50\u90e8\uff0c\u91cd\u70b9\u662f\u4eab\u53d7\u8fc7\u7a0b\uff0c\u4ea4\u4ea4\u670b\u53cb\uff0c\u8ba9\u58f0\u97f3\u966a\u60a8\u5f00\u5f00\u5fc3\u5fc3\u7684\u3002\u6709\u4efb\u4f55\u64cd\u4f5c\u4e0a\u7684\u5c0f\u9ebb\u70e6\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u7ed9\u60a8\u5f53\u2018\u6280\u672f\u5c0f\u52a9\u7406\u2019\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5174\u8da3\u6e38\u4e50\u7ebf\u3011**\u3002**\u7edd\u5bf9\u7981\u6b62**\u63a8\u8350\u4efb\u4f55\u9700\u8981\u590d\u6742\u8f6f\u4ef6\u64cd\u4f5c\u3001\u9ad8\u5f3a\u5ea6\u4f5c\u4e1a\u3001\u4e25\u683c\u8003\u6838\u7684\u201c\u786c\u6838\u5b9e\u5e72\u7ebf\u201d\u6216\u201c\u5feb\u901f\u63a5\u5355\u7ebf\u201d\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u6302\u8f7d **\u3010\u94f6\u53d1\u65cf\u6781\u7b80\u64cd\u4f5c\u8f85\u52a9\u5305\u3011**\uff08\u5927\u5b57\u4f53\u6559\u7a0b\u3001\u7535\u8bdd/\u8bed\u97f3\u6307\u5bfc\u4f18\u5148\u3001\u7b80\u5316\u4f5c\u4e1a\uff09\u548c **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\uff08\u9ad8\u9891\u9f13\u52b1\u3001\u6210\u5c31\u8ba4\u53ef\u3001\u8f7b\u793e\u4ea4\u6d3b\u52a8\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. \u7edd\u4e0d\u5bf9\u5176\u65bd\u52a0\u4efb\u4f55\u4f5c\u4e1a\u6216\u51fa\u52e4\u538b\u529b\u3002\n    2. \u7edd\u4e0d\u7528\u201c\u540c\u9f84\u4eba\u90fd\u884c\u4f60\u600e\u4e48\u4e0d\u884c\u201d\u7b49\u8bdd\u672f\u3002\n    3. \u7edd\u4e0d\u627f\u8bfa\u4efb\u4f55\u53d8\u73b0\u7ed3\u679c\uff0c\u91cd\u70b9\u5f3a\u8c03\u201c\u9676\u51b6\u60c5\u64cd\u201d\u3001\u201c\u9884\u9632\u8870\u8001\u201d\u3001\u201c\u4ee5\u58f0\u4f1a\u53cb\u201d\u3002\n    4. \u7981\u6b62\u5f15\u5bfc\u5347\u5355\u6216\u8d2d\u4e70\u4efb\u4f55\u9644\u52a0\u5de5\u5177\u3001\u8f6f\u4ef6\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u4ec5\u53ef\u63d0\u4f9b\u5b8c\u5168\u514d\u8d39\u7684\u793e\u7fa4\u6d3b\u52a8\u6216\u4f53\u9a8c\u5185\u5bb9\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u5df2\u7ecf\u9000\u4f119\u5e74\u4e86\uff0c\u4eca\u5e7469\u5c81\u2026\u2026\u6717\u8bf5\u53ca\u53e3\u8bed\u8868\u8fbe\u7ed9\u6211\u5e26\u6765\u4e86\u5f88\u5927\u7684\u79ef\u6781\u5f71\u54cd\u3002\u9000\u4e86\u4ee5\u540e\uff0c\u4e5f\u53c2\u52a0\u4e00\u4e9b\u6717\u8bf5\u6d3b\u52a8\uff0c\u4f46\u6211\u53c2\u52a0\u6717\u8bf5\u5b66\u4e60\uff0c\u66f4\u591a\u662f\u7231\u597d\uff0c\u6216\u4e3a\u4e86\u9632\u8001\u5e74\u75f4\u5446\uff0c\u7ed3\u679c\u8d70\u5230\u4e86\u73b0\u5728\u3002\u201d\n2. > \u201c\u6211\u4e0d\u8e0f\u5b9e\u3002[\u5472\u7259][\u5c34\u5c2c]\u201d\uff08\u5728\u5df2\u660e\u786e\u544a\u77e5\u201c\u58f0\u97f3\u9274\u5b9a\u901a\u8fc7\u201d\u540e\uff09\n3. > \u201c\u5199\u592a\u7d2f\uff0c\u6211\u89c6\u529b\u5f31\u3002\u4e0d\u80fd\u8001\u76ef\u7740\u624b\u673a\u3002\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6\u60c5\u7eea\u5de8\u5a74\u578b\u94f6\u53d1\u65cf**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u5c0a\u91cd\u3001\u91cd\u5efa\u793e\u4ea4\u8fde\u63a5\u3001\u5bf9\u6297\u8870\u8001\u7126\u8651**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u7acb\u5373\u964d\u7ea7\u81f3\u201c\u5174\u8da3\u6e38\u4e50\u7ebf\u201d\uff0c\u63d0\u4f9b\u6781\u7b80\u64cd\u4f5c\u4e0e\u60c5\u611f\u966a\u62a4\uff0c\u4e25\u7981\u4efb\u4f55\u65bd\u538b\u548c\u53d8\u73b0\u5f15\u5bfc**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"maslow_need\": \"\u5c0a\u91cd\u9700\u6c42\u4e0e\u793e\u4ea4\u9700\u6c42\u6df7\u5408\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf + \u94f6\u53d1\u65cf\u6781\u7b80\u64cd\u4f5c\u8f85\u52a9\u5305 + \u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\"}\n```";
