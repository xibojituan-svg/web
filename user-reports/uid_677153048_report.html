        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677153048 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u65bd\u73ca\u73ca (\u6696\u59d0/\u5416\u5416) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u9ad8\u9636\u73ed (\u7ea67380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u7f3a\u5931** (\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u8d44\u91d1\u6765\u6e90) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u7f3a\u5931** (\u4ec5\u77e5\u5728\u94f6\u884c\u5de5\u4f5c\uff0c\u5177\u4f53\u4f5c\u606f\u672a\u77e5) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u5bb6\u4eba\u4e0d\u77e5\u60c5** (\u7528\u6237\u4e3b\u52a8\u63d0\u53ca\u201c\u6211\u76ee\u524d\u5728\u94f6\u884c\uff0c\u6211\u4eec\u4e0d\u8ba9\u505a\u526f\u4e1a\u201d\uff0c\u5e76\u8be2\u95ee\u534f\u8bae\u53ef\u5426\u7531\u914d\u5076\u4ee3\u7b7e) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931** (\u5173\u952e\u8d44\u91d1\u3001\u65f6\u95f4\u3001\u5bb6\u5ead\u652f\u6301\u5ea6\u4fe1\u606f\u4e0d\u8db3\uff0c\u964d\u7ea7\u7f6e\u4fe1\u5ea6) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u957f\u671f\u53d1\u5c55\u800c\u6765\uff0c\u5174\u8da3\u9a71\u52a8\uff0c\u884c\u52a8\u529b\u5f3a\uff0c\u5173\u6ce8\u884c\u4e1a\u672c\u8eab\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u662f\u5f88\u770b\u597d\u8fd9\u4e2a\u884c\u4e1a\u201d\n  > \u201c\u6211\u8fd9\u4eba\u5c31\u662f\u95f2\u4e0d\u4f4f\u201d\n  > \u201c\u6211\u53ef\u4ee5\u4ece\u753b\u672c\u5f00\u59cb\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u672a\u63d0\u53ca\u652f\u4ed8\u80fd\u529b\u3001\u8d44\u91d1\u6765\u6e90\u6216\u7ecf\u6d4e\u538b\u529b\u3002\u4f46\u80fd\u8003\u86517380\u5143\u8bfe\u7a0b\uff0c\u4e14\u4e3b\u4e1a\u4e3a\u94f6\u884c\u5de5\u4f5c\uff0c\u63a8\u6d4b\u6709\u7a33\u5b9a\u6536\u5165\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u94f6\u884c\u5de5\u4f5c\uff0c\u80fd\u5168\u7a0b\u8ddf\u4e0a\u5348\u3001\u4e2d\u5348\u76f4\u64ad\uff0c\u79ef\u6781\u4ea4\u4f5c\u4e1a\uff0c\u884c\u52a8\u529b\u5f3a\u3002\u4f46\u9700\u517c\u987e\u4e3b\u4e1a\uff0c\u4e14\u526f\u4e1a\u9700\u201c\u95f7\u58f0\u53d1\u5927\u8d22\u201d\uff0c\u65f6\u95f4\u9700\u534f\u8c03\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u2b07\u4f4e\u6781\u5371** \u2014 **\u5bb6\u4eba\u4e0d\u77e5\u60c5**\uff0c\u4e14\u56e0\u94f6\u884c\u89c4\u5b9a\u9700\u9690\u7792\u526f\u4e1a\uff0c\u5b58\u5728\u5bb6\u5ead/\u804c\u573a\u5e72\u9884\u98ce\u9669\u3002\n- **\u5e95\u5ea7\u53d6\u77ed\u677f**\uff1a**\u4e2d** (\u53d7\u5236\u4e8e**\u5bb6\u5ead\u652f\u6301\u5ea6\u4f4e**)\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u9a71\u52a8\uff0c\u79ef\u6781\u89e3\u51b3\u95ee\u9898\uff0c\u5fc3\u6001\u4e50\u89c2\uff0c\u914d\u5408\u5ea6\u9ad8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u4e0d\u662f\u6700\u806a\u660e\u5e94\u8be5\u662f\u6700\u8ba4\u771f\u8e0f\u5b9e\u201d\n  > \u201c\u6211\u6765\u5e2e\u4f60 \u540e\u9762\u7684\u7edf\u7b79\uff0c\u753b\u672c \u6211\u5e94\u8be5\u90fd\u53ef\u4ee5\u5e72\u201d\n  > \u201c\u597d\u7684\u5440\u201d\u3001\u201c\u575a\u6301\uff01\uff01\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5728\u7a33\u5b9a\u7684\u94f6\u884c\u5de5\u4f5c\u4e2d\uff0c\u5bfb\u6c42\u4e2a\u4eba\u4ef7\u503c\u8bc1\u660e\u548c\u989d\u5916\u6210\u5c31\u8ba4\u53ef\uff0c\u6e34\u671b\u201c\u95f7\u58f0\u53d1\u5927\u8d22\u201d\u4ee5\u83b7\u5f97\u7ecf\u6d4e\u72ec\u7acb\u548c\u804c\u4e1a\u4e0a\u7684\u81ea\u6211\u7a81\u7834\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6210\u5c31\u611f\u7684\u5373\u65f6\u53cd\u9988\u4e0e\u5708\u5c42\u5f52\u5c5e\u611f**\u3002\u4ed6\u9700\u8981\u88ab\u770b\u89c1\u3001\u88ab\u8ba4\u53ef\u4e3a\u201c\u8ba4\u771f\u8e0f\u5b9e\u201d\u7684\u884c\u52a8\u8005\uff0c\u5e76\u6e34\u671b\u878d\u5165\u4e00\u4e2a\u80fd\u201c\u4e00\u8d77\u597d\u597d\u5de5\u4f5c\uff0c\u597d\u597d\u8d5a\u94b1\u201d\u7684\u79ef\u6781\u5708\u5b50\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b (\u6210\u957f\u6295\u8d44\u578b)** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u884c\u52a8\u529b\u5f3a\uff0c\u4e3b\u52a8\u627f\u62c5\uff0c\u5173\u6ce8\u5b9e\u64cd\u8def\u5f84) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u89e6\u53d1\u7ecf\u6d4e\u3001\u5065\u5eb7\u3001\u65f6\u95f4\u7b49\u7194\u65ad\u7ea2\u7ebf\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| **\u5bb6\u5ead\u5e72\u9884\u578b** | **\u9ad8** | **\u7792\u7740\u5355\u4f4d\u4e0e\u5bb6\u4eba\u62a5\u540d\uff0c\u4e00\u65e6\u88ab\u53d1\u73b0\u6216\u4ea7\u751f\u5fc3\u7406\u538b\u529b\uff0c\u6781\u6613\u5f15\u53d1\u9000\u8d39\u3002** |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u5b66\u4e60\u6001\u5ea6\u79ef\u6781\uff0c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5c1a\u53ef\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u6027\u5f3a\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u76ee\u6807\u660e\u786e\uff08\u6708\u526f\u4e1a3k\uff09\uff0c\u82e5\u5b66\u4e60\u540e\u77ed\u671f\u65e0\u6cd5\u8fbe\u5230\u9884\u671f\uff0c\u53ef\u80fd\u4ea7\u751f\u8d28\u7591\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e1-2\u4e2a\u6708\u5185**\u3002\u5f53\u526f\u4e1a\u6295\u5165\u4e0e\u4e3b\u4e1a\u65f6\u95f4\u51b2\u7a81\u52a0\u5267\uff0c\u6216\u5bb6\u4eba/\u5355\u4f4d\u53d1\u73b0\u98ce\u9669\u66b4\u9732\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u665a\u5b89\u540c\u5b66\uff0c\u770b\u5230\u4f60\u5b66\u4e60\u8fd9\u4e48\u79ef\u6781\u8ba4\u771f\uff0c\u771f\u7684\u7279\u522b\u68d2\uff01\u54b1\u4eec\u8fd9\u4e2a\u5708\u5b50\u5c31\u9700\u8981\u4f60\u8fd9\u6837\u8e0f\u5b9e\u80af\u5e72\u7684\u4eba\u3002\u6211\u77e5\u9053\u4f60\u65f6\u95f4\u5b9d\u8d35\uff0c\u8fd8\u8981\u517c\u987e\u94f6\u884c\u7684\u5de5\u4f5c\uff0c\u54b1\u4eec\u5c31\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u628a\u6280\u80fd\u624e\u5b9e\u4e86\u3002**\u5173\u4e8e\u526f\u4e1a\u4fdd\u5bc6\u548c\u8eab\u4efd\u7684\u95ee\u9898\u4f60\u5b8c\u5168\u4e0d\u7528\u62c5\u5fc3\uff0c\u54b1\u4eec\u6709\u6210\u719f\u7684\u5e94\u5bf9\u7ecf\u9a8c\uff0c\u5f88\u591a\u50cf\u4f60\u4e00\u6837\u7684\u540c\u5b66\u90fd\u5904\u7406\u5f97\u5f88\u597d\u3002** \u6709\u4efb\u4f55\u9700\u8981\u534f\u8c03\u7684\u5730\u65b9\uff0c\u968f\u65f6\u627e\u6211\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** + **\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011**\u3002\u4f18\u5148\u6ee1\u8db3\u5176\u201c\u5b66\u4ee5\u81f4\u7528\u3001\u5feb\u901f\u9a8c\u8bc1\u201d\u7684\u52a1\u5b9e\u9700\u6c42\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176**T2\u5b9e\u5e72\u578b**\u7279\u8d28\u548c**\u5c0a\u91cd\u9700\u6c42**\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u5708\u5c42\u8ba4\u53ef\u4e0e\u8d44\u6e90\u5bf9\u63a5\u5305\u3011**\uff0c\u5982\uff1a\u9080\u8bf7\u8fdb\u5165\u201c\u5b9e\u5e72\u6d3e\u201d\u5c0f\u7fa4\u3001\u5206\u914d\u5c0f\u7ec4\u957f\u89d2\u8272\u3001\u4f18\u5148\u83b7\u5f97\u5185\u90e8\u8bd5\u97f3\u673a\u4f1a\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5728\u7fa4\u5185\u6216\u516c\u5f00\u573a\u5408\u63d0\u53ca\u4efb\u4f55\u53ef\u80fd\u66b4\u9732\u5176\u94f6\u884c\u804c\u5458\u8eab\u4efd\u7684\u4fe1\u606f\uff1b\u907f\u514d\u4f7f\u7528\u201c\u5b9d\u5988\u9006\u88ad\u201d\u3001\u201c\u5168\u804c\u5e26\u5a03\u201d\u7b49\u4e0e\u5176\u8eab\u4efd\u4e0d\u7b26\u7684\u8bdd\u672f\uff1b\u4e0d\u8981\u8fc7\u5ea6\u627f\u8bfa\u77ed\u671f\u5185\uff08\u59821-2\u4e2a\u6708\uff09\u5fc5\u8fbe3000\u5143\u6536\u5165\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5f53\u524d7380\u5143\u9ad8\u9636\u73ed\u5df2\u5339\u914d\u5176\u9700\u6c42\u4e0e\u98ce\u9669\uff0c\u540e\u7eed\u4e25\u7981\u63a8\u8350\u66f4\u6602\u8d35\u8bbe\u5907\u6216\u8bfe\u7a0b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u76ee\u524d\u5728\u94f6\u884c\uff0c\u6211\u4eec\u4e0d\u8ba9\u505a\u526f\u4e1a[\u6342\u8138][\u6342\u8138][\u6342\u8138]\u201d\n2. > \u201c\u5c31\u662f\u6211\u60f3\u95f7\u58f0\u53d1\u5927\u8d22 \u5bf9\u201d\n3. > \u201c\u6696\u59d0\uff0c\u6211\u7684\u76ee\u6807\u662f\u6bcf\u4e2a\u6708\u526f\u4e1a3k\uff0c\u6709\u5e0c\u671b\u5427\u3002\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2\u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u8bc1\u660e\u81ea\u6211\u4ef7\u503c\u4e0e\u83b7\u5f97\u5c0a\u91cd\uff08\u7b2c\u56db\u5c42\u9700\u6c42\uff09**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u5e2e\u52a9\u5176\u5b89\u5168\u5730\u5e73\u8861\u4e3b\u4e1a\u4e0e\u526f\u4e1a\uff0c\u63d0\u4f9b\u9690\u79d8\u7684\u6210\u5c31\u8ba4\u53ef\u548c\u63a5\u5355\u8def\u5f84**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"maslow_need\": \"\u7b2c\u56db\u5c42\u5c0a\u91cd\u9700\u6c42\", \"risk_level\": \"\u4e2d\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5feb\u901f\u63a5\u5355\u7ebf+\u5708\u5c42\u8ba4\u53ef\u5305\"}\n```";
