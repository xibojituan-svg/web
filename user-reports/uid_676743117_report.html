    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a\u4e2d\u7b49\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6709\u58f0\u6f14\u64ad\u7684\u5174\u8da3\u548c\u6295\u5165\uff08\u4e3b\u52a8\u5206\u4eab\u89c2\u5f71\u611f\u53d7\u3001\u79ef\u6781\u8c03\u8bd5\u8bbe\u5907\u3001\u575a\u6301\u5b8c\u6210\u4f5c\u4e1a\uff09\uff0c\u4f46\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u591a\u6b21\u63d0\u53ca\u6280\u672f\u56f0\u96be\uff08AU\u64cd\u4f5c\u3001\u58f0\u5361\u8c03\u8bd5\u3001\u8f6f\u4ef6\u4f7f\u7528\uff09\uff0c\u4e14**\u5728\u8bfe\u7a0b\u540e\u671f\uff08\u7b2c\u516b\u5468\uff09\u56e0\u4f4f\u9662\u800c\u8fdb\u5ea6\u53d7\u963b\uff0c\u6700\u7ec8\u9009\u62e9\u63d0\u4ea4\u8fc7\u5f80\u8bd5\u97f3\u800c\u975e\u65b0\u5f55\u5236\u4f5c\u4e1a**\uff0c\u8868\u660e\u5176\u5b66\u4e60\u52a8\u673a\u867d\u771f\u5b9e\u4f46\u97e7\u6027\u4e00\u822c\uff0c\u6613\u53d7\u73b0\u5b9e\u56e0\u7d20\u5e72\u6270\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a\u4e2d\u7b49\u3002\u7528\u6237\u62e5\u6709\u57fa\u7840\u5f55\u97f3\u8bbe\u5907\uff08\u68a8\u82b1\u8d2d\u4e70\uff09\uff0c\u6709\u5927\u91cf\u7a7a\u95f2\u65f6\u95f4\uff08\u81ea\u79f0\u201c\u9000\u4f11\u4e86\uff0c\u6709\u65f6\u95f4\u201d\uff09\uff0c\u5177\u5907\u57fa\u672c\u7684\u5b66\u4e60\u6761\u4ef6\u3002\u4f46**\u6280\u672f\u57fa\u7840\u8584\u5f31**\uff08\u9700\u81ea\u884c\u6478\u7d22\u7535\u8111\u5f55\u97f3\u3001AU\u64cd\u4f5c\u3001\u8f6f\u4ef6\u5b89\u88c5\uff09\uff0c\u4e14**\u5728\u8bfe\u7a0b\u5173\u952e\u671f\u56e0\u5065\u5eb7\u95ee\u9898\uff08\u80be\u7ed3\u77f3\u4f4f\u9662\uff09\u4e2d\u65ad\u5b66\u4e60**\uff0c\u663e\u793a\u51fa\u8d44\u6e90\u7a33\u5b9a\u6027\u5b58\u5728\u98ce\u9669\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a\u4e2d\u7b49\u504f\u9ad8\u3002\u7528\u6237\u6001\u5ea6\u79ef\u6781\u3001\u914d\u5408\u5ea6\u9ad8\uff08\u9891\u7e41\u56de\u590d\u201c\u6536\u5230\u201d\u3001\u4f7f\u7528\u793c\u8c8c\u8868\u60c5\uff09\uff0c\u9047\u5230\u6280\u672f\u95ee\u9898\u80fd\u4e3b\u52a8\u5c1d\u8bd5\u89e3\u51b3\uff08\u201c\u81ea\u5df1\u4e71\u63b0\u5f04\u597d\u4e86\u201d\uff09\u3002\u9762\u5bf9\u4f4f\u9662\u7b49\u7a81\u53d1\u72b6\u51b5\uff0c\u4ecd\u5c1d\u8bd5\u7528\u8033\u673a\u542c\u8bfe\uff0c\u5e76\u79ef\u6781\u6c9f\u901a\u89e3\u51b3\u65b9\u6848\u3002**\u4f46\u9762\u5bf9\u590d\u6742\u7684\u6280\u672f\u5b66\u4e60\uff08AU\u540e\u671f\uff09\u8868\u73b0\u51fa\u660e\u663e\u7684\u5403\u529b\u611f\u548c\u7126\u8651**\uff08\u201c\u8ddf\u7684\u5f88\u5403\u529b\u201d\uff09\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**\uff1a\u8bb0\u5f55\u4e2d\u672a\u76f4\u63a5\u6d89\u53ca\u652f\u4ed8\u4fe1\u606f\uff0c**\u65e0\u6cd5\u5224\u65ad**\u3002\u9700\u540e\u53f0\u6838\u67e5\u652f\u4ed8\u72b6\u6001\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u7528\u6237\u63d0\u53ca\u201c\u6211\u53ea\u6709\u7236\u4eb2\u7684\u89d2\u8272\u5427\u201d\uff0c\u7ed3\u5408\u5176\u9000\u4f11\u72b6\u6001\uff0c\u63a8\u6d4b\u4e3a**\u72ec\u7acb\u51b3\u7b56\u8005**\uff0c\u5bb6\u5ead\u51b3\u7b56\u963b\u529b\u4f4e\u3002\n*   **\u6b65\u9aa41-4 \u7efc\u5408\u5224\u5b9a**\uff1a\n    *   **A\uff08\u652f\u4ed8\u80fd\u529b\uff09**\uff1a\u4fe1\u606f\u4e0d\u8db3\u3002\n    *   **B\uff08\u9700\u6c42\u5f3a\u5ea6\uff09**\uff1a\u4e2d\u7b49\u3002\u6709\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\uff0c\u4f46\u76ee\u6807\u611f\u4e0d\u6781\u81f4\uff0c\u6613\u53d7\u632b\u3002\n    *   **C\uff08\u51b3\u7b56\u81ea\u4e3b\u6027\uff09**\uff1a\u9ad8\u3002\u72ec\u7acb\u51b3\u7b56\uff0c\u6c9f\u901a\u4e3b\u52a8\u3002\n    *   **D\uff08\u884c\u52a8\u914d\u5408\u5ea6\uff09**\uff1a\u9ad8\u3002\u79ef\u6781\u54cd\u5e94\u901a\u77e5\uff0c\u52aa\u529b\u5b8c\u6210\u4f5c\u4e1a\u3002\n    *   **\u521d\u6b65\u5206\u5c42**\uff1a\u504f\u5411 **B2C1D1**\uff08\u9700\u6c42\u4e2d\u7b49\u4f46\u660e\u786e\u3001\u81ea\u4e3b\u51b3\u7b56\u3001\u9ad8\u914d\u5408\uff09\u3002\u56e0A\u8f74\u4fe1\u606f\u7f3a\u5931\uff0c\u9700\u7ed3\u5408\u652f\u4ed8\u4fe1\u606f\u6700\u7ec8\u786e\u8ba4\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n**T5 \u52a1\u5b9e\u63a2\u7d22\u8005**\u3002\n*   **\u7279\u5f81\u543b\u5408**\uff1a\u9000\u4f11\u4eba\u7fa4\uff0c\u6709\u65f6\u95f4\u6295\u5165\u65b0\u5174\u8da3\uff1b\u5b66\u4e60\u6001\u5ea6\u8ba4\u771f\uff0c\u884c\u52a8\u914d\u5408\uff1b\u76ee\u6807\u76f8\u5bf9\u52a1\u5b9e\uff08\u5b8c\u6210\u8bfe\u7a0b\u3001\u5c1d\u8bd5\u8bd5\u97f3\uff09\uff0c\u975e\u6025\u529f\u8fd1\u5229\u578b\uff1b**\u6280\u672f\u5b66\u4e60\u80fd\u529b\u662f\u4e3b\u8981\u74f6\u9888**\uff0c\u6613\u4ea7\u751f\u632b\u8d25\u611f\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\uff08\u98ce\u9669\u7b49\u7ea7\uff1a\u4e2d\uff09\n*   **\u6839\u56e01 - \u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a\u98ce\u9669**\u4e2d**\u3002\u7528\u6237\u5df2\u611f\u53d7\u5230\u5b66\u4e60\u56f0\u96be\uff08AU\u64cd\u4f5c\u5403\u529b\uff09\uff0c\u4e14**\u6700\u7ec8\u6bd5\u4e1a\u4f5c\u4e1a\u672a\u80fd\u6309\u8d28\u91cf\u5b8c\u6210\uff08\u63d0\u4ea4\u65e7\u8bd5\u97f3\uff09**\uff0c\u53ef\u80fd\u5bf9\u5b66\u4e60\u6210\u679c\u6ee1\u610f\u5ea6\u4e0d\u9ad8\u3002\n*   **\u6839\u56e02 - \u65f6\u95f4\u7cbe\u529b\u4e0d\u8db3**\uff1a\u98ce\u9669**\u4f4e**\u3002\u7528\u6237\u65f6\u95f4\u5145\u88d5\uff0c\u4f46**\u7a81\u53d1\u5065\u5eb7\u95ee\u9898**\u5bfc\u81f4\u8bfe\u7a0b\u672b\u6bb5\u53c2\u4e0e\u5ea6\u4e0b\u964d\uff0c\u5c5e\u4e0d\u53ef\u63a7\u56e0\u7d20\u3002\n*   **\u6839\u56e03 - \u4ea7\u54c1\u670d\u52a1\u4e0d\u7b26**\uff1a\u98ce\u9669**\u4f4e**\u3002\u7528\u6237\u672a\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u6216\u670d\u52a1\u63d0\u51fa\u8d28\u7591\u3002\n*   **\u6839\u56e04 - \u7ecf\u6d4e\u538b\u529b**\uff1a\u4fe1\u606f\u4e0d\u8db3\u3002\n*   **\u6839\u56e05 - \u5bb6\u5ead\u53cd\u5bf9**\uff1a\u98ce\u9669**\u6781\u4f4e**\u3002\u72ec\u7acb\u51b3\u7b56\u3002\n*   **\u6839\u56e06 - \u7ade\u54c1\u6bd4\u8f83/\u8d1f\u9762\u4fe1\u606f**\uff1a\u98ce\u9669**\u4f4e**\u3002\u672a\u63d0\u53ca\u3002\n*   **\u6839\u56e07 - \u9500\u552e\u8fc7\u5ea6\u627f\u8bfa**\uff1a\u98ce\u9669**\u4f4e**\u3002\u8bb0\u5f55\u4e2d\u9500\u552e\u6c9f\u901a\u591a\u4e3a\u4e8b\u52a1\u6027\u56de\u590d\uff0c\u672a\u89c1\u8fc7\u5ea6\u627f\u8bfa\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u9500\u552e\u6c9f\u901a**\uff1a\u57fa\u672c\u5408\u89c4\uff0c\u4ee5\u4e8b\u52a1\u6027\u901a\u77e5\u548c\u95ee\u9898\u89e3\u7b54\u4e3a\u4e3b\u3002**\u4f46\u5b58\u5728\u5bf9\u7528\u6237\u6280\u672f\u95ee\u9898\uff08\u5982\u58f0\u5361\u8c03\u8bd5\u3001\u8f6f\u4ef6\u5b89\u88c5\uff09\u6307\u5bfc\u8fc7\u4e8e\u7b80\u7565\u6216\u63a8\u7ed9\u5916\u90e8\u6e20\u9053\uff08\u201c\u4f60\u53bb\u641c\u58f0\u5361\u8c03\u8bd5\u201d\uff09\u7684\u60c5\u51b5**\uff0c\u53ef\u80fd\u5f71\u54cd\u7528\u6237\u4f53\u9a8c\u3002\n*   **\u98ce\u9669\u70b9**\uff1a\u7528\u6237\u4f4f\u9662\u671f\u95f4\uff0c\u9500\u552e\u4ecd\u5728\u63a8\u9001\u8bfe\u7a0b\u901a\u77e5\uff0c\u867d\u7ecf\u7528\u6237\u540c\u610f\uff08\u201c\u53ef\u4ee5\u542c\u8bfe\u201d\uff09\uff0c\u4f46**\u9700\u5173\u6ce8\u5176\u8eab\u4f53\u72b6\u51b5\u662f\u5426\u771f\u6b63\u9002\u5408\u5b66\u4e60\uff0c\u907f\u514d\u5f15\u53d1\u201c\u4e0d\u987e\u7528\u6237\u5065\u5eb7\u201d\u7684\u4f26\u7406\u4e89\u8bae**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d**\uff1a**\u5339\u914d**\u3002\u57fa\u7840\u6f14\u64ad\u8bfe\u7a0b\u7b26\u5408\u5176\u63a2\u7d22\u9700\u6c42\uff0c\u4f46**AU\u7b49\u540e\u671f\u5236\u4f5c\u6a21\u5757\u5bf9\u5176\u6311\u6218\u8f83\u5927**\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**\u7ed3\u8bfe\u540e\u91cd\u70b9\u5173\u6000\u5b66\u4e60\u6210\u679c\u4e0e\u5065\u5eb7**\u3002\n*   **\u8be6\u7ec6\u6307\u5357**\uff1a\n    1.  **\u7ed3\u4e1a\u5173\u6000**\uff1a\u4e3b\u52a8\u8054\u7cfb\uff0c\u795d\u8d3a\u7ed3\u4e1a\uff0c\u5e76**\u91cd\u70b9\u8be2\u95ee\u5176\u5bf9\u8bfe\u7a0b\u7684\u6574\u4f53\u611f\u53d7\u3001AU\u7b49\u96be\u70b9\u6a21\u5757\u7684\u638c\u63e1\u60c5\u51b5\uff0c\u4ee5\u53ca\u4f4f\u9662\u662f\u5426\u5f71\u54cd\u6700\u7ec8\u5b66\u4e60\u4f53\u9a8c**\u3002\n    2.  **\u6280\u672f\u652f\u63f4**\uff1a\u9488\u5bf9\u5176\u6280\u672f\u8584\u5f31\u70b9\uff0c\u53ef\u63d0\u4f9b**\u7b80\u5316\u7248\u7684\u64cd\u4f5c\u6307\u5357\u6216\u63a8\u8350\u66f4\u57fa\u7840\u7684\u8f85\u52a9\u7ec3\u4e60\u8d44\u6e90**\uff0c\u964d\u4f4e\u5176\u632b\u8d25\u611f\u3002\n    3.  **\u9884\u671f\u7ba1\u7406**\uff1a\u6e29\u548c\u6c9f\u901a\uff0c\u4e86\u89e3\u5176\u5bf9\u201c\u4e2d\u97f3\u201d\u7b49\u7ed3\u679c\u7684\u671f\u5f85\uff0c**\u5f15\u5bfc\u5176\u5173\u6ce8\u8fc7\u7a0b\u6536\u83b7\u548c\u5174\u8da3\u57f9\u517b**\uff0c\u4e3a\u53ef\u80fd\u7684\u8fdb\u9636\u8bfe\u7a0b\u63a8\u8350\u94fa\u57ab\u3002\n    4.  **\u5065\u5eb7\u5173\u6000**\uff1a\u8868\u8fbe\u5bf9\u5176\u8eab\u4f53\u7684\u5173\u5fc3\uff0c\u4f53\u73b0\u4eba\u6587\u5173\u6000\u3002\n\n{\"core_type\": \"T5 \u52a1\u5b9e\u63a2\u7d22\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u7ed3\u8bfe\u540e\u91cd\u70b9\u5173\u6000\u5b66\u4e60\u6210\u679c\u4e0e\u5065\u5eb7\"}";
