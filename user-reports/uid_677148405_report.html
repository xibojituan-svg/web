    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u4e0e\u98ce\u63a7\u62a5\u544a (UID: 677148405)\n\n## \u4e00\u3001 \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u9ad8)**\n    *   **\u5b66\u4e60\u5174\u8da3\u4e0e\u8ba4\u540c\u611f\u5f3a**\uff1a\u5bf9\u8bfe\u7a0b\u5185\u5bb9\uff08\u5982\u201c\u5bf9\u8c61\u611f\u201d\u6280\u5de7\uff09\u53cd\u9988\u79ef\u6781\uff08\u201c\u8fd9\u4e2a\u597d\u5b9e\u7528\u201d\uff09\uff0c\u5b66\u4e60\u8fc7\u7a0b\u6295\u5165\uff08\u201c\u505a\u4e86\u597d\u591a\u7b14\u8bb0\u201d\uff09\uff0c\u5e76\u8868\u8fbe\u201c\u89c9\u5f97\u81ea\u5df1\u6765\u5bf9\u4e86\u201d\u3002\n    *   **\u526f\u4e1a\u53d8\u73b0\u9a71\u52a8\u660e\u786e**\uff1a\u591a\u6b21\u4e3b\u52a8\u8be2\u95ee\u201c\u80fd\u4e0d\u80fd\u63a5\u5230\u5355\uff1f\u201d\uff0c\u5bf9\u201c\u753b\u672c\u5de5\u4f5c\u201d\u3001\u201c\u53d8\u73b0\u65b9\u5f0f\u201d\u8868\u73b0\u51fa\u6d53\u539a\u5174\u8da3\uff0c\u7b26\u5408\u201c\u591a\u52b3\u591a\u5f97\u201d\u7684\u8ba4\u77e5\u3002\n    *   **\u5bf9\u884c\u4e1a\u5708\u5c42\u6709\u5411\u5f80**\uff1a\u8ba4\u540c\u201c\u5e72\u51c0\u7684\u5708\u5b50\u201d\u63cf\u8ff0\uff0c\u5bfb\u6c42\u5f52\u5c5e\u611f\u4e0e\u6b63\u5411\u73af\u5883\u3002\n\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d\u7b49)**\n    *   **\u65f6\u95f4\u4e0e\u7cbe\u529b**\uff1a\u80fd\u5168\u7a0b\u8ddf\u8fdb\u8bad\u7ec3\u8425\uff08\u5168\u52e4\uff09\uff0c\u53c2\u4e0e\u665a\u95f4\u52a0\u7ec3\uff0c\u8868\u660e\u6709\u8f83\u5145\u88d5\u7684\u4e1a\u4f59\u65f6\u95f4\u6216\u53ef\u8c03\u914d\u7684\u7cbe\u529b\u3002\n    *   **\u8bbe\u5907\u4e0e\u6280\u80fd\u57fa\u7840**\uff1a\u5177\u5907\u57fa\u672c\u64cd\u4f5c\u80fd\u529b\uff08\u4f1a\u53d1\u90ae\u7bb1\uff09\uff0c\u80fd\u5b8c\u6210\u5f55\u97f3\u4f5c\u4e1a\u3002\u672a\u63d0\u53ca\u786c\u4ef6\u969c\u788d\u3002\n    *   **\u7ecf\u6d4e\u80fd\u529b**\uff1a**\u5173\u952e\u4fe1\u606f\u7f3a\u5931**\u3002\u672a\u63d0\u53ca\u652f\u4ed8\u91d1\u989d\u3001\u652f\u4ed8\u65b9\u5f0f\uff08\u5982\u5206\u671f\uff09\u3001\u804c\u4e1a\u6216\u5bb6\u5ead\u7ecf\u6d4e\u72b6\u51b5\u3002**\u65e0\u6cd5\u8bc4\u4f30\u652f\u4ed8\u538b\u529b\u4e0e\u51b3\u7b56\u6743\u91cd**\u3002\n\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u9ad8)**\n    *   **\u884c\u52a8\u529b\u4e0e\u670d\u4ece\u6027\u9ad8**\uff1a\u79ef\u6781\u54cd\u5e94\u9500\u552e\u6307\u4ee4\uff08\u53d1\u53e3\u4ee4\u3001\u4ea4\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\uff09\uff0c\u4e3b\u52a8\u91cd\u5f55\u4f5c\u4e1a\u5e76\u81ea\u6211\u53cd\u601d\uff08\u201c\u820c\u5934\u4e0d\u592a\u5229\u7d22\u201d\uff09\u3002\n    *   **\u632b\u6298\u5bb9\u5fcd\u5ea6\u5c1a\u53ef**\uff1a\u9762\u5bf9\u201c\u77e5\u9053\u4e86\u505a\u4e0d\u5230\u201d\u7684\u56f0\u96be\u6709\u8ba4\u77e5\uff0c\u80fd\u63a5\u53d7\u201c\u6162\u6162\u6765\u201d\u7684\u5efa\u8bae\uff0c\u672a\u8868\u73b0\u51fa\u6025\u8e81\u6216\u653e\u5f03\u3002\n    *   **\u4fe1\u4efb\u5efa\u7acb\u826f\u597d**\uff1a\u5bf9\u201c\u5e08\u59d0\u201d\u89d2\u8272\u9ad8\u5ea6\u4fe1\u4efb\uff0c\u79f0\u547c\u4eb2\u5207\uff0c\u63a5\u53d7\u5b89\u6392\uff08\u201c\u542c\u5e08\u59d0\u5b89\u6392\u201d\uff09\u3002\n\n## \u4e8c\u3001 ABCD\u5224\u5b9a\u6811\u5206\u6790\n\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5** \u2705 \u5df2\u652f\u4ed8\u3002\u7528\u6237\u660e\u786e\u56de\u590d\u201c\u4ed8\u597d\u4e86\u201d\u3002\u4f46\u652f\u4ed8\u91d1\u989d\u3001\u8bfe\u7a0b\u7248\u672c\uff08\u7cbe\u82f1\u73ed\uff09\u3001\u652f\u4ed8\u65b9\u5f0f\uff08\u5168\u6b3e/\u5206\u671f\uff09**\u4fe1\u606f\u7f3a\u5931**\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5** \u26a0\ufe0f **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u5168\u7a0b\u804a\u5929\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u6210\u5458\u3001\u914d\u5076\u610f\u89c1\u6216\u5bb6\u5ead\u8d22\u52a1\u8ba8\u8bba\u3002\u51b3\u7b56\u8868\u73b0\u4e3a\u9ad8\u5ea6\u4e2a\u4eba\u5316\u3002\n*   **\u6b65\u9aa42-4\uff1a\u52a8\u673a-\u8d44\u6e90-\u5fc3\u7406\u8bc4\u4f30**\n    *   **\u52a8\u673a (B\u7c7b\uff1a\u5174\u8da3\u4e0e\u53d8\u73b0\u6df7\u5408)**\uff1a\u517c\u5177\u6280\u80fd\u5b66\u4e60\u5174\u8da3\u4e0e\u660e\u786e\u7684\u526f\u4e1a\u589e\u6536\u671f\u671b\uff0c\u52a8\u673a\u590d\u5408\u4f46\u6e05\u6670\u3002\n    *   **\u8d44\u6e90 (C\u7c7b\uff1a\u57fa\u7840\u53ef\u884c\u4f46\u4e0a\u9650\u4e0d\u660e)**\uff1a\u65f6\u95f4\u3001\u6267\u884c\u529b\u8fbe\u6807\uff0c\u4f46\u7ecf\u6d4e\u5e95\u724c\u4e0e\u5bb6\u5ead\u652f\u6301\u7cfb\u7edf\u672a\u77e5\uff0c\u5b58\u5728\u9690\u6027\u98ce\u9669\u3002\n    *   **\u5fc3\u7406 (B\u7c7b\uff1a\u79ef\u6781\u4ece\u4f17\u8005)**\uff1a\u4fe1\u4efb\u5f15\u5bfc\uff0c\u670d\u4ece\u6027\u5f3a\uff0c\u6613\u53d7\u793e\u7fa4\u6c1b\u56f4\uff08\u201c\u5e72\u51c0\u7684\u5708\u5b50\u201d\u3001\u201c\u4f20\u5e2e\u5e26\u201d\uff09\u5f71\u54cd\uff0c\u884c\u52a8\u79ef\u6781\u3002\n*   **\u5224\u5b9a\u7ed3\u679c\uff1aB-C-B\u578b\u7528\u6237**\u3002\u9ad8\u610f\u613f\u3001\u5f3a\u884c\u52a8\u529b\uff0c\u4f46**\u5bb6\u5ead\u4e0e\u7ecf\u6d4e\u57fa\u7840\u4fe1\u606f\u4e0d\u660e\uff0c\u6784\u6210\u4e3b\u8981\u98ce\u9669\u76f2\u533a**\u3002\n\n## \u4e09\u3001 \u7528\u6237\u539f\u578b\u5339\u914d\n\n*   **\u5339\u914d\u539f\u578b\uff1aT4 \u52a1\u5b9e\u63a2\u7d22\u8005**\n    *   **\u7279\u5f81**\uff1a\u76ee\u6807\u660e\u786e\uff08\u5b66\u6280\u80fd\u3001\u63a5\u5355\u8d5a\u94b1\uff09\uff0c\u6267\u884c\u529b\u5f3a\uff0c\u5bf9\u884c\u4e1a\u6709\u57fa\u7840\u8ba4\u540c\uff0c\u4fe1\u4efb\u6743\u5a01\uff08\u9500\u552e/\u5e08\u59d0\uff09\uff0c\u5904\u4e8e\u79ef\u6781\u5b66\u4e60\u548c\u5c1d\u8bd5\u9636\u6bb5\u3002\n    *   **\u504f\u79bb\u70b9**\uff1a\u539f\u578b\u901a\u5e38\u9690\u542b\u4e00\u5b9a\u7684\u98ce\u9669\u627f\u53d7\u80fd\u529b\u8bc4\u4f30\uff0c\u4f46\u672c\u4f8b\u4e2d\u8be5\u7ef4\u5ea6\u4fe1\u606f\u4e0d\u8db3\u3002\n\n## \u56db\u3001 \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4e2d)\n\n\u9010\u9879\u6392\u67e57\u5927\u6839\u56e0\uff1a\n1.  **\u6548\u679c\u4e0d\u53ca\u9884\u671f**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u201c\u63a5\u5355\u201d\u6709\u660e\u786e\u671f\u5f85\uff0c\u82e5\u5b66\u4e60\u540e\u671f\u53d8\u73b0\u8def\u5f84\u4e0d\u7545\u6216\u63a5\u5355\u56f0\u96be\uff0c\u6613\u5f15\u53d1\u5931\u671b\u3002\n2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u9ad8\u98ce\u9669**\u3002**\u652f\u4ed8\u80fd\u529b\u4e0e\u8bfe\u7a0b\u4ef7\u683c\u5339\u914d\u5ea6\u672a\u77e5**\uff0c\u662f\u6700\u5927\u98ce\u9669\u70b9\u3002\u82e5\u4e3a\u501f\u8d37\u6216\u632a\u7528\u91cd\u8981\u8d44\u91d1\u652f\u4ed8\uff0c\u540e\u7eed\u538b\u529b\u4e0b\u9000\u8d39\u8bc9\u6c42\u5f3a\u70c8\u3002\n3.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u9ad8\u98ce\u9669**\u3002**\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u5b8c\u5168\u7f3a\u5931**\uff0c\u662f\u91cd\u5927\u6f5c\u5728\u96f7\u533a\u3002\u4e00\u65e6\u5bb6\u5ead\u4e3b\u8981\u6210\u5458\uff08\u5982\u914d\u5076\uff09\u4e8b\u540e\u53cd\u5bf9\uff0c\u6781\u6613\u5f15\u53d1\u7ea0\u7eb7\u3002\n4.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u53c2\u4e0e\u5ea6\u6781\u9ad8\uff0c\u65f6\u95f4\u5b89\u6392\u7075\u6d3b\u3002\n5.  **\u5065\u5eb7\u539f\u56e0**\uff1a**\u4f4e\u98ce\u9669**\u3002\u672a\u63d0\u53ca\u3002\n6.  **\u9500\u552e\u8bef\u5bfc**\uff1a**\u4f4e\u98ce\u9669**\u3002\u9500\u552e\u8fc7\u7a0b\u4ee5\u6280\u5de7\u6559\u5b66\u3001\u8d44\u6e90\u5c55\u793a\u3001\u793e\u7fa4\u6e29\u6696\u4e3a\u4e3b\uff0c\u8fc7\u5ea6\u627f\u8bfa\uff08\u5982\u4fdd\u5e95\u6536\u5165\uff09\u8ff9\u8c61\u4e0d\u660e\u663e\u3002\n7.  **\u7ade\u54c1\u6bd4\u8f83/\u51b2\u52a8\u6d88\u8d39\u540e\u6094**\uff1a**\u4f4e\u98ce\u9669**\u3002\u7528\u6237\u8868\u73b0\u51fa\u6301\u7eed\u7684\u5b66\u4e60\u70ed\u60c5\u548c\u8ba4\u540c\u611f\uff0c\u975e\u51b2\u52a8\u51b3\u7b56\u8ff9\u8c61\u3002\n\n## \u4e94\u3001 \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n\n*   **\u5408\u89c4\u70b9**\uff1a\u9500\u552e\u4fa7\u91cd\u4e8e\u6280\u80fd\u6559\u5b66\u3001\u884c\u4e1a\u8d44\u6e90\u5c55\u793a\u3001\u5b66\u4e60\u9f13\u52b1\uff0c\u4f7f\u7528\u4e86\u201c\u5e08\u59d0\u201d\u8eab\u4efd\u5efa\u7acb\u4fe1\u4efb\uff0c\u672a\u53d1\u73b0\u660e\u663e\u8fdd\u89c4\u627f\u8bfa\u3002\n*   **\u98ce\u9669\u70b9**\uff1a\n    1.  **\u3010\u5173\u952e\u96f7\u533a\u3011\u5bb6\u5ead\u77e5\u60c5\u6743\u6838\u67e5\u7f3a\u5931**\uff1a\u9500\u552e\u5168\u7a0b\u672a\u5f15\u5bfc\u6216\u786e\u8ba4\u7528\u6237\u8d2d\u4e70\u51b3\u7b56\u662f\u5426\u5df2\u4e0e\u5bb6\u4eba\u6c9f\u901a\uff0c**\u4e25\u91cd\u8fdd\u53cd\u98ce\u63a7\u6d41\u7a0b**\u3002\n    2.  **\u652f\u4ed8\u80fd\u529b\u8bc4\u4f30\u7f3a\u5931**\uff1a\u672a\u4e86\u89e3\u7528\u6237\u804c\u4e1a\u3001\u6536\u5165\u4e0e\u8bfe\u7a0b\u4ef7\u683c\u7684\u5339\u914d\u5ea6\uff0c\u76f4\u63a5\u5f15\u5bfc\u81f3\u652f\u4ed8\u73af\u8282\u3002\n    3.  **\u53d8\u73b0\u9884\u671f\u7ba1\u7406**\uff1a\u867d\u5c55\u793a\u4e86\u201c\u65f6\u85aa300\u5143\u201d\u7b49\u6848\u4f8b\uff0c\u4f46\u672a\u5145\u5206\u5f3a\u8c03\u4e2a\u4f53\u5dee\u5f02\u3001\u6210\u957f\u5468\u671f\u4e0e\u5e02\u573a\u7ade\u4e89\uff0c\u53ef\u80fd\u57cb\u4e0b\u201c\u6548\u679c\u4e0d\u53ca\u9884\u671f\u201d\u98ce\u9669\u3002\n\n## \u516d\u3001 \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**\uff1a**\u5339\u914d**\u3002\u7528\u6237\u5b66\u4e60\u610f\u613f\u5f3a\uff0c\u884c\u52a8\u529b\u9ad8\uff0c\u9002\u5408\u9700\u8981\u6301\u7eed\u7ec3\u4e60\u4e0e\u793e\u7fa4\u652f\u6301\u7684\u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a\n    1.  **\u3010\u7d27\u6025\u301124\u5c0f\u65f6\u5185\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\u4e0e\u652f\u4ed8\u80fd\u529b**\uff1a\u9996\u901a\u7535\u8bdd\u5fc5\u987b\u6e29\u548c\u4f46\u660e\u786e\u5730\u4e86\u89e3\uff1a\u2460\u8bfe\u7a0b\u8d39\u7528\u6765\u6e90\uff08\u81ea\u6709\u5b58\u6b3e/\u5de5\u8d44/\u501f\u8d37/\u5bb6\u5ead\u5171\u540c\u8d44\u91d1\uff09\uff1b\u2461\u662f\u5426\u5df2\u4e0e\u914d\u5076\u6216\u4e3b\u8981\u5bb6\u5ead\u6210\u5458\u6c9f\u901a\u5e76\u83b7\u652f\u6301\u3002\u6b64\u6b65\u9aa4\u4e3a**\u98ce\u9669\u9632\u63a7\u5e95\u7ebf**\u3002\n    2.  **\u5f3a\u5316\u53d8\u73b0\u9884\u671f\u7ba1\u7406**\uff1a\u5728\u9996\u6b21\u5b66\u4e60\u89c4\u5212\u6c9f\u901a\u4e2d\uff0c\u660e\u786e\u5b66\u4e60\u66f2\u7ebf\u3001\u63a5\u5355\u95e8\u69db\u3001\u6536\u5165\u6ce2\u52a8\u6027\uff0c\u6811\u7acb\u201c\u957f\u671f\u7ec3\u4e60\uff0c\u9010\u6b65\u53d8\u73b0\u201d\u7684\u5408\u7406\u9884\u671f\u3002\n    3.  **\u5229\u7528\u9ad8\u670d\u4ece\u6027\u5efa\u7acb\u5b66\u4e60\u8282\u594f**\uff1a\u7528\u6237\u914d\u5408\u5ea6\u9ad8\uff0c\u53ef\u5feb\u901f\u5236\u5b9a\u6e05\u6670\u7684\u5468/\u6708\u5b66\u4e60\u4e0e\u7ec3\u4e60\u8ba1\u5212\uff0c\u901a\u8fc7\u6b63\u53cd\u9988\uff08\u5982\u4f5c\u4e1a\u70b9\u8bc4\u3001\u5fae\u5c0f\u8fdb\u6b65\u8ba4\u53ef\uff09\u7ef4\u6301\u5176\u5b66\u4e60\u52a8\u529b\u3002\n    4.  **\u6301\u7eed\u5173\u6ce8\u63a5\u5355\u8bc9\u6c42**\uff1a\u5728\u7528\u6237\u8fdb\u5165\u63a5\u5355\u9636\u6bb5\u65f6\uff0c\u63d0\u4f9b\u5207\u5b9e\u7684\u8bd5\u97f3\u6307\u5bfc\u548c\u8d44\u6e90\u5bf9\u63a5\uff0c\u907f\u514d\u5176\u56e0\u521d\u671f\u53d7\u632b\u800c\u4fe1\u5fc3\u5d29\u584c\u3002\n\n{\"core_type\": \"T4 \u52a1\u5b9e\u63a2\u7d22\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u7d27\u6025\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\u4e0e\u652f\u4ed8\u80fd\u529b\"}";
