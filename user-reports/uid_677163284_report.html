    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID 677163284 (\u6635\u79f0\uff1a\u6e05\u6b22\u6653\u6653) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6851\u6986\u975e\u665a\u97f36(\u82cf\u7476\u7476) -> \u6854\u5b50JZT(\u7a0b\u5c55\u6b22) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u64ad\u6559\u80b2\u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b (\u9ad8\u9636\u73ed\uff0c\u4ef7\u683c7380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u5206\u671f\u6216\u501f\u8d37\u4fe1\u606f\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u7528\u6237\u63d0\u53ca\u201c\u5e73\u65f6\u4e0a\u73ed\u65f6\u5c31\u80fd\u5f04\uff08\u753b\u672c\uff09\u201d\uff0c\u63a8\u6d4b\u4e3a\u5728\u804c\u72b6\u6001\uff0c\u65f6\u95f4\u788e\u7247\u5316\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u5b66\u4e60\u884c\u4e3a\u4fe1\u53f7\u5145\u8db3\uff0c\u4f46\u5173\u952e\u98ce\u9669\u4fe1\u606f\uff08\u652f\u4ed8\u3001\u5bb6\u5ead\u3001\u8be6\u7ec6\u65f6\u95f4\uff09\u7f3a\u5931\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34(\u4e2d)**\u3002\u7528\u6237\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u5b66\u4e60\u5174\u8da3\u548c\u6210\u957f\u6e34\u671b\uff0c\u5bf9\u53d8\u73b0\u6709\u671f\u5f85\u4f46\u975e\u552f\u4e00\u9a71\u52a8\u3002\u6838\u5fc3\u662f\u201c\u4f53\u9a8c\u65b0\u4e8b\u7269\u201d\u548c\u201c\u83b7\u5f97\u6210\u957f\u201d\u7684\u6df7\u5408\u52a8\u673a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u65e0\u8bba\u5982\u4f55\u90fd\u80fd\u5f97\u5230\u6210\u957f\uff0c\u4e5f\u80fd\u4f53\u9a8c\u5f88\u4e0d\u4e00\u6837\u7684\u4e1c\u897f\u3002\u201d\n  > \u201c\u542c\u4e86\u4eca\u5929\u7684\u76f4\u64ad\uff0c\u771f\u7684\u6709\u6253\u5f00\u65b0\u4e16\u754c\u5927\u95e8\u7684\u611f\u89c9...\u80fd\u4e0d\u80fd\u8e0f\u8fdb\u53bb\uff0c\u8fdb\u53bb\u540e\u80fd\u4e0d\u80fd\u8d70\u957f\u8fdc\u90fd\u5f88\u5438\u5f15\u4eba\uff0c\u4f46\u662f\u53c8\u5145\u6ee1\u4e86\u672a\u77e5\u3002\u8fd8\u662f\u5f88\u5174\u594b\u7684\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u652f\u4ed87380\u5143\u8bfe\u7a0b\uff0c\u4f46\u672a\u900f\u9732\u8d44\u91d1\u6765\u6e90\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u5145\u88d5\u6216\u5b58\u5728\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u5728\u804c\u72b6\u6001\uff0c\u4f46\u80fd\u5229\u7528\u4e0a\u73ed\u65f6\u95f4\u5b8c\u6210\u201c\u753b\u672c\u201d\u7c7b\u4efb\u52a1\uff0c\u8868\u660e\u6709\u4e00\u5b9a\u788e\u7247\u5316\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u672a\u77e5** \u2014 \u65e0\u4fe1\u606f\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u4f5c\u4e1a\u96be\u5ea6\uff08\u201c\u53ea\u597d\u6311\u4e86\u4e00\u4e2a\u81ea\u5df1\u64c5\u957f\u7684\u7ed9\u5a03\u8bb2\u6545\u4e8b[\u6342\u8138]\u201d\uff09\u548c\u4ed6\u4eba\u5bf9\u6bd4\uff08\u201c\u8d8a\u914d\u8d8a\u80fd\u611f\u53d7\u5230\u5dee\u8ddd[\u6342\u8138]\u201d\uff09\u65f6\uff0c\u80fd\u7406\u6027\u770b\u5f85\uff0c\u4e3b\u52a8\u5bfb\u6c42\u5b66\u4e60\uff08\u201c\u6211\u591a\u542c\u542c\u4f18\u79c0\u6848\u4f8b\u7ee7\u7eed\u5b66\u4e60\u201d\uff09\uff0c\u65e0\u8d1f\u9762\u60c5\u7eea\u5ba3\u6cc4\uff0c\u5fc3\u6001\u79ef\u6781\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u4eca\u5929\u65e9\u4e0a\u5df2\u7ecf\u53cd\u9988\u4e86\u5427\uff1f\u800c\u4e14\u8bf4\u7684\u7279\u522b\u7ec6\u81f4\u3002\u8fd8\u6709\u54ea\u4e2a\u4f5c\u4e1a\uff1f\u201d (\u7406\u6027\u6c9f\u901a\uff0c\u786e\u8ba4\u4fe1\u606f)\n  > \u201c\u8d8a\u914d\u8d8a\u80fd\u611f\u53d7\u5230\u5dee\u8ddd[\u6342\u8138]\uff0c\u9700\u8981\u5b66\u4e60\u7684\u5730\u65b9\u592a\u591a\u5566\u3002\u201d (\u81ea\u6211\u8ba4\u77e5\u6e05\u6670\uff0c\u5c06\u5dee\u8ddd\u89c6\u4e3a\u5b66\u4e60\u52a8\u529b\u800c\u975e\u6253\u51fb)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u201c\u65b0\u4e16\u754c\u201d\u7684\u597d\u5947\u4e0e\u5bf9\u201c\u4e13\u4e1a\u80fd\u529b\u201d\u7684\u5c0a\u91cd\u6e34\u671b\u3002\u5979\u5e76\u975e\u5355\u7eaf\u4e3a\u94b1\uff0c\u800c\u662f\u88ab\u201c\u6709\u58f0\u6f14\u64ad\u201d\u8fd9\u4e2a\u4e13\u4e1a\u9886\u57df\u6240\u5438\u5f15\uff0c\u5e0c\u671b\u83b7\u5f97\u6280\u80fd\u63d0\u5347\u3001\u4e13\u4e1a\u8ba4\u53ef\uff0c\u5e76\u878d\u5165\u8fd9\u4e2a\u5708\u5b50\uff0c\u5b9e\u73b0\u4e2a\u4eba\u4ef7\u503c\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u8fdb\u9636\u8def\u5f84\u7684\u6e05\u6670\u6307\u5f15**\u3002\u5979\u9700\u8981\u88ab\u5f53\u4f5c\u4e00\u4e2a\u201c\u6709\u6f5c\u529b\u7684\u540c\u884c\u201d\u6765\u5bf9\u5f85\uff0c\u800c\u975e\u4e00\u4e2a\u201c\u5c0f\u767d\u5b66\u5458\u201d\u3002\u63d0\u4f9b\u4e13\u4e1a\u7684\u70b9\u8bc4\u3001\u7ed9\u4e88\u201c\u5c11\u5fa1\u97f3\u201d\u7b49\u4e13\u4e1a\u6807\u7b7e\uff0c\u5e76\u5c55\u793a\u6e05\u6670\u7684\u6210\u957f\u8def\u5f84\uff08\u5982\u4ece\u753b\u672c\u5230\u65c1\u767d\u5230\u89d2\u8272\uff09\uff0c\u80fd\u6781\u5927\u6ee1\u8db3\u5979\u7684\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u8fdb\u5316\u524d\u4f53\uff0c\u6709\u5411\u6df7\u5408\u4f533\u53f7\u3010\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b\u3011\u53d1\u5c55\u7684\u6f5c\u529b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u96f6\u4e92\u52a8\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u5fc3\u6001\u6210\u719f\uff0c\u4e3b\u52a8\u51b3\u7b56\u53ef\u80fd\u6027\u9ad8\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u82e5\u540e\u7eed\u8bfe\u7a0b\u5f3a\u5ea6\u8fdc\u8d85\u5176\u788e\u7247\u5316\u65f6\u95f4\u627f\u53d7\u80fd\u529b\uff0c\u6216\u957f\u671f\u63a5\u4e0d\u5230\u7b26\u5408\u5176\u201c\u5168\u80fd\u578b\u9009\u624b\u201d\u9884\u671f\u7684\u4f18\u8d28\u8ba2\u5355\uff0c\u53ef\u80fd\u56e0\u201c\u6210\u957f\u505c\u6ede\u611f\u201d\u800c\u6d41\u5931\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u7406\u6027\u770b\u5f85\u5dee\u8ddd\uff0c\u81ea\u6211\u9a71\u52a8\u5b66\u4e60\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | **\u6f5c\u5728\u98ce\u9669**\uff1a\u867d\u7136\u5f53\u524d\u52a8\u673a\u4e0d\u7eaf\u4e3a\u94b1\uff0c\u4f46\u82e5\u957f\u671f\uff08\u59823-6\u4e2a\u6708\uff09\u65e0\u6cd5\u83b7\u5f97\u4efb\u4f55\u5f62\u5f0f\u7684\u6b63\u53cd\u9988\uff08\u5982\u63a5\u5355\u3001\u4f5c\u54c1\u88ab\u8ba4\u53ef\uff09\uff0c\u6700\u521d\u7684\u201c\u5174\u594b\u611f\u201d\u53ef\u80fd\u6d88\u9000\uff0c\u4ea7\u751f\u4ef7\u503c\u8d28\u7591\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c4-8\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u82e5\u6280\u80fd\u63d0\u5347\u8fdb\u5165\u5e73\u53f0\u671f\uff0c\u4e14\u63a5\u5355\u53d8\u73b0\u8def\u5f84\u4e0d\u6e05\u6670\uff0c\u5bb9\u6613\u4ea7\u751f\u7126\u8651\u548c\u653e\u5f03\u5ff5\u5934\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6653\u6653\uff0c\u770b\u4e86\u4f60\u4f53\u9a8c\u8425\u7684\u8868\u73b0\uff0c\u771f\u7684\u5f88\u68d2\uff01\u4f60\u7684\u2018\u5c11\u5fa1\u97f3\u2019\u8fa8\u8bc6\u5ea6\u5f88\u9ad8\uff0c\u5b66\u4e60\u6001\u5ea6\u53c8\u7279\u522b\u624e\u5b9e\uff0c\u662f\u73ed\u91cc\u5f88\u6709\u6f5c\u529b\u7684\u2018\u79cd\u5b50\u9009\u624b\u2019\u3002\u63a5\u4e0b\u6765\u7684\u6b63\u8bfe\uff0c\u6211\u4eec\u4f1a\u5e26\u4f60\u4ece\u2018\u753b\u672c\u2019\u7a33\u624e\u7a33\u6253\uff0c\u4e00\u6b65\u6b65\u89e3\u9501\u65c1\u767d\u3001\u89d2\u8272\u97f3\uff0c\u76ee\u6807\u662f\u5e2e\u4f60\u6210\u4e3a\u80fd\u9a7e\u9a6d\u591a\u79cd\u98ce\u683c\u7684\u2018\u5168\u80fd\u578b\u6f14\u64ad\u8005\u2019\u3002\u8fc7\u7a0b\u4e2d\u6709\u4efb\u4f55\u5361\u70b9\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4eec\u4e00\u8d77\u653b\u514b\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5979\u7684\u5b66\u4e60\u6001\u5ea6\u548c\u6210\u957f\u6e34\u671b\u9002\u5408\u4e25\u8083\u3001\u6709\u6df1\u5ea6\u7684\u8bfe\u7a0b\u5185\u5bb9\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T2\u8001\u9ec4\u725b\u7279\u8d28\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010B\u6a21\u5757\uff1a\u786c\u6838\u624b\u827a\u6c60\u3011**\uff08\u5982\u4e13\u5bb61v1\u7b54\u7591\u3001\u9ad8\u9636\u6280\u5de7\u70b9\u8bc4\u3001\u771f\u5b9e\u6d3e\u5355\u5b9e\u6218\uff09\u3002\u540c\u65f6\uff0c**\u6301\u7eed\u89c2\u5bdf**\uff0c\u82e5\u5176\u51fa\u73b0\u4e3b\u52a8\u5e2e\u52a9\u540c\u5b66\u3001\u7edf\u7b79\u7ec3\u4e60\u7b49\u884c\u4e3a\uff0c\u7acb\u5373\u542f\u52a8 **\u3010D\u6a21\u5757\uff1a\u9ec4\u888d\u52a0\u8eab\u63d0\u5e72\u6cd5\u3011**\uff0c\u4efb\u547d\u4e3a\u5c0f\u7ec4\u957f\u6216\u201c\u58f0\u97f3\u6863\u6848\u5b98\u201d\uff0c\u6fc0\u53d1\u5176\u9886\u5bfc\u6f5c\u80fd\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u5b9d\u5988\u517c\u804c\u6708\u5165\u8fc7\u4e07\u201d\u7b49\u4f4e\u7aef\u53d8\u73b0\u8bdd\u672f\u523a\u6fc0\u5979\u3002\u907f\u514d\u8fc7\u5ea6\u60c5\u611f\u5b89\u629a\uff08C\u6a21\u5757\uff09\uff0c\u5979\u9700\u8981\u7684\u662f\u4e13\u4e1a\u8ba4\u53ef\uff08B\u6a21\u5757\uff09\u548c\u6210\u957f\u7a7a\u95f4\uff08D\u6a21\u5757\uff09\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5f53\u5979\u6280\u80fd\u8fbe\u5230\u4e00\u5b9a\u6c34\u5e73\u540e\uff0c\u53ef\u4ee5\u63a8\u8350\u9ad8\u9636\u540e\u671f\u8bfe\u3001\u8bbe\u5907\u8bfe\u7b49\uff0c\u6ee1\u8db3\u5176\u201c\u6210\u4e3a\u4e13\u4e1a\u4eba\u58eb\u201d\u7684\u6df1\u5c42\u9700\u6c42\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u65e0\u8bba\u5982\u4f55\u90fd\u80fd\u5f97\u5230\u6210\u957f\uff0c\u4e5f\u80fd\u4f53\u9a8c\u5f88\u4e0d\u4e00\u6837\u7684\u4e1c\u897f\u3002**\u201d (\u52a8\u673a\u4e0d\u7eaf\u4e3a\u94b1\uff0c\u91cd\u5728\u4f53\u9a8c\u4e0e\u6210\u957f)\n2. > \u201c**\u542c\u4e86\u4eca\u5929\u7684\u76f4\u64ad\uff0c\u771f\u7684\u6709\u6253\u5f00\u65b0\u4e16\u754c\u5927\u95e8\u7684\u611f\u89c9...\u80fd\u4e0d\u80fd\u8e0f\u8fdb\u53bb\uff0c\u8fdb\u53bb\u540e\u80fd\u4e0d\u80fd\u8d70\u957f\u8fdc\u90fd\u5f88\u5438\u5f15\u4eba\uff0c\u4f46\u662f\u53c8\u5145\u6ee1\u4e86\u672a\u77e5\u3002\u8fd8\u662f\u5f88\u5174\u594b\u7684\u3002**\u201d (\u5bf9\u4e13\u4e1a\u9886\u57df\u7684\u597d\u5947\u4e0e\u5411\u5f80\uff0c\u81ea\u6211\u5b9e\u73b0\u9a71\u52a8)\n3. > \u201c**\u8d8a\u914d\u8d8a\u80fd\u611f\u53d7\u5230\u5dee\u8ddd[\u6342\u8138]\uff0c\u9700\u8981\u5b66\u4e60\u7684\u5730\u65b9\u592a\u591a\u5566\u3002**\u201d (\u7406\u6027\u8ba4\u77e5\u5dee\u8ddd\uff0c\u5fc3\u6001\u79ef\u6781\uff0c\u5c06\u538b\u529b\u8f6c\u5316\u4e3a\u5b66\u4e60\u52a8\u529b)\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u6301\u7eed\u63d0\u4f9b\u4e13\u4e1a\u7684B\u6a21\u5757\uff08\u786c\u6838\u624b\u827a\uff09\u53cd\u9988\uff0c\u5e76\u9002\u65f6\u8d4b\u4e88D\u6a21\u5757\uff08\u7ba1\u7406\u6743\u9650\uff09\u6fc0\u53d1\u5176\u9886\u5bfc\u529b\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}\n```";
