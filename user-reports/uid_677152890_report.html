    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n> **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4e3b\u8981\u96c6\u4e2d\u4e8e\u4f53\u9a8c\u8425\u671f\u95f4\u7684\u5b66\u4e60\u4e92\u52a8\u4e0e\u8f6c\u5316\u73af\u8282\uff0c\u7f3a\u4e4f\u5173\u4e8e\u7528\u6237**\u652f\u4ed8\u80fd\u529b\u8be6\u60c5\uff08\u8d44\u91d1\u6765\u6e90\u3001\u662f\u5426\u5206\u671f\uff09**\u3001**\u5bb6\u5ead\u51b3\u7b56\u6743\u4e0e\u77e5\u60c5\u60c5\u51b5**\u3001**\u5177\u4f53\u5de5\u4f5c\u6027\u8d28\u4e0e\u65f6\u95f4\u5b89\u6392**\u3001**\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u4e0e\u6297\u538b\u6027**\u7b49\u5173\u952e\u7ef4\u5ea6\u7684\u6df1\u5ea6\u4fe1\u606f\u3002\u4ee5\u4e0b\u5206\u6790\u57fa\u4e8e\u73b0\u6709\u6587\u672c\u63a8\u65ad\uff0c\u7f6e\u4fe1\u5ea6\u4e2d\u7b49\u3002\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677152890 / \u6635\u79f0\uff1a\u8033\u6771\u9673 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u738b\u8def\u5ddd (\u9500\u552e/\u51cc\u4e91\u5e08\u5144) \u2192 \u5b54\u4ee4\u5a77 (\u73ed\u4e3b\u4efb\u53ef\u4e50) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u5df2\u8d2d\u4e704\u4e2a\u6708\u9ad8\u9636\u73ed |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u7f3a\u5931**\u3002\u4ec5\u63d0\u53ca\u201c\u6ca1\u7ed1\u94f6\u884c\u5361\u201d\uff0c\u540e\u652f\u4ed8\u6210\u529f\uff0c\u65e0\u6cd5\u5224\u65ad\u652f\u4ed8\u65b9\u5f0f\u4e0e\u538b\u529b\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u4e3a\u5728\u804c\u72b6\u6001\uff08\u201c\u5904\u7406\u5de5\u4f5c\u4e0a\u7684\u4e8b\u201d\uff09\uff0c\u4f46\u8fd1\u671f\u4f11\u5047\uff08\u201c\u8fd9\u6bb5\u65f6\u95f4\u6b63\u597d\u5728\u4f11\u5047\uff0c\u65f6\u95f4\u80fd\u81ea\u7531\u8c03\u914d\u3002\u4e0b\u5468\u4f11\u5047\u7ed3\u675f\u65f6\u95f4\u5c31\u6ca1\u8fd9\u4e48\u81ea\u7531\u4e86\u201d\uff09\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\u3002\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u4fe1\u606f\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u5b66\u4e60\u4e92\u52a8\u9971\u6ee1\uff0c\u4f46\u4e2a\u4eba\u80cc\u666f\u4e0e\u8d22\u52a1\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u5174\u8da3\u4e0e\u53d8\u73b0\u9700\u6c42\u6df7\u6742\u3002\u660e\u786e\u8868\u793a\u201c\u6323\u70b9\u5916\u5757\u5feb\u201d\uff0c\u540c\u65f6\u5bf9\u884c\u4e1a\u672c\u8eab\u201c\u8d8a\u6765\u8d8a\u611f\u5174\u8da3\u201d\uff0c\u5e76\u89c4\u5212\u4e86\u591a\u4e2a\u659c\u6760\u5c97\u4f4d\uff08\u753b\u672c\u3001\u5ba1\u542c\u3001\u5bf9\u8f68\u7b49\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5165\u8fd9\u884c\u7684\u76ee\u7684\u4e00\u4e2a\u4e5f\u662f\u4e3a\u4e86\u57f9\u517b\u81ea\u5df1\u7684\u5174\u8da3\uff0c\u4e00\u4e2a\u5c31\u662f\u6323\u70b9\u5916\u5757\u5feb\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u4fe1\u606f\u7f3a\u5931]** \u2014 \u6210\u529f\u652f\u4ed8\u9ad8\u9636\u73ed\u8d39\u7528\uff0c\u4f46\u8d44\u91d1\u6765\u6e90\u4e0d\u660e\uff0c\u65e0\u6cd5\u8bc4\u4f30\u5176\u8d44\u91d1\u5145\u88d5\u5ea6\u4e0e\u540e\u7eed\u7eed\u8d39\u6f5c\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u5728\u804c\u72b6\u6001\uff0c\u4f46\u80fd\u79ef\u6781\u5b8c\u6210\u65e9\u529f\u3001\u4f5c\u4e1a\u3001\u8bd5\u97f3\uff0c\u5e76\u53c2\u4e0e\u591a\u573a\u76f4\u64ad\u3002**\u98ce\u9669\u70b9\u5728\u4e8e\u4f11\u5047\u7ed3\u675f\u540e\u65f6\u95f4\u81ea\u7531\u5ea6\u4e0b\u964d**\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u4fe1\u606f\u7f3a\u5931]** \u2014 \u5b8c\u5168\u672a\u63d0\u53ca\uff0c\u5b58\u5728\u6f5c\u5728\u98ce\u9669\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u4efb\u52a1\uff08\u5982\u8bd5\u97f3\u3001\u4f5c\u4e1a\uff09\u4e3b\u52a8\u63d0\u95ee\u3001\u79ef\u6781\u5b8c\u6210\uff1b\u88ab\u6307\u51fa\u4e0e\u4f18\u79c0\u8005\u5dee\u8ddd\u65f6\uff0c\u6001\u5ea6\u79ef\u6781\uff08\u201c\u7ee7\u7eed\u52aa\u529b\uff0c\u4e89\u53d6\u5411\u5927\u4f6c\u9760\u8fd1\u201d\uff09\uff1b\u55d3\u5b50\u54d1\u4e86\u4f1a\u4e3b\u52a8\u8bf4\u660e\u60c5\u51b5\uff0c\u672a\u8868\u73b0\u51fa\u62b1\u6028\u6216\u653e\u5f03\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u55ef\u55ef \u5df2\u7ecf\u53d1\u73b0\u4e86\u81ea\u5df1\u548c\u4ed6\u4eec\u7684\u5dee\u8ddd\uff0c\u7ee7\u7eed\u52aa\u529b\uff0c\u4e89\u53d6\u5411\u5927\u4f6c\u9760\u8fd1\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9**\u4e2a\u4eba\u4ef7\u503c\u4e0e\u793e\u4f1a\u8ba4\u540c**\u7684\u8ffd\u6c42\u3002\u4ed6\u4e0d\u4ec5\u60f3\u8d5a\u94b1\uff0c\u66f4\u6e34\u671b\u5728\u4e00\u4e2a\u6709\u201c\u5708\u5c42\u201d\uff08\u5982\u5267\u7ec4\u3001\u540c\u5b66\u4eba\u8109\uff09\u7684\u9886\u57df\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u548c\u8eab\u4efd\u5f52\u5c5e\u611f\uff08\u201c\u4e89\u53d6\u5411\u5927\u4f6c\u9760\u8fd1\u201d\u3001\u201c\u548c\u73ed\u7ea7\u7684\u540c\u5b66\u76f8\u4e92\u719f\u6089\u4e00\u4e0b\u201d\uff09\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u5708\u5c42\u878d\u5165\u611f**\u3002\u5c06\u4ed6\u89c6\u4e3a\u201c\u6f5c\u529b\u80a1\u201d\uff0c\u7ed9\u4e88\u5177\u4f53\u7684\u6280\u5de7\u6307\u5bfc\uff08\u5982\u5e08\u5144\u7684\u4f5c\u4e1a\u70b9\u8bc4\uff09\uff0c\u5e76\u5f3a\u8c03\u4ed6\u672a\u6765\u5728\u884c\u4e1a\u5185\u7684\u201c\u4eba\u8109\u8d44\u6e90\u201d\u4ef7\u503c\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u52a8\u673a\u4e2d\u7b49\u3001\u6267\u884c\u529b\u5f3a\u3001\u98ce\u9669\u70b9\u5728\u4e8e\u65f6\u95f4\u4e0e\u5bb6\u5ead\u4fe1\u606f\u7f3a\u5931) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T3 \u6b7b\u78d5\u5b66\u9738\u578b** (\u5b66\u4e60\u6001\u5ea6\u8ba4\u771f\u3001\u4e3b\u52a8\u63d0\u95ee\u3001\u8ffd\u6c42\u6280\u80fd\u7cbe\u8fdb\u3001\u5bf9\u884c\u4e1a\u6709\u7cfb\u7edf\u6027\u8ba4\u77e5\u6e34\u671b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **[\u4e2d]** | **\u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u9700\u8b66\u60d5**\u3002\u82e5\u652f\u4ed8\u884c\u4e3a\u9690\u7792\u5bb6\u4eba\uff0c\u540e\u7eed\u53ef\u80fd\u5f15\u53d1\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **[\u4e2d]** | **\u4f11\u5047\u7ed3\u675f\u540e\u65f6\u95f4\u51b2\u7a81**\u3002\u4e0b\u5468\u6062\u590d\u5de5\u4f5c\u540e\uff0c\u82e5\u65e0\u6cd5\u534f\u8c03\u5b66\u4e60\u4e0e\u76f4\u64ad\u65f6\u95f4\uff0c\u53ef\u80fd\u56e0\u79ef\u538b\u4efb\u52a1\u4ea7\u751f\u7126\u8651\u5e76\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **[\u4f4e]** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u56f0\u96be\uff08\u5982\u8f6f\u4ef6\u95ee\u9898\uff09\u800c\u60c5\u7eea\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **[\u4e2d]** | \u5bf9\u201c\u659c\u6760\u201d\u5c97\u4f4d\u548c\u201c\u7248\u6743\u4e66\u201d\u6709\u8f83\u9ad8\u671f\u5f85\u3002\u82e5\u8fdb\u5165\u6b63\u8bfe\u540e\u53d1\u73b0\u63a5\u5355\u95e8\u69db\u9ad8\u3001\u6536\u76ca\u5468\u671f\u957f\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-4\u5468\u540e**\u3002\u5c4a\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u5de5\u4f5c\u4e0e\u5b66\u4e60\u65f6\u95f4\u51b2\u7a81\u52a0\u5267\uff0c\u82e5\u672a\u83b7\u5f97\u9884\u671f\u7684\u5b9e\u8df5\u673a\u4f1a\u6216\u6b63\u5411\u53cd\u9988\uff0c\u632b\u8d25\u611f\u53ef\u80fd\u7d2f\u79ef\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u8033\u6771\u9673\u4f60\u597d\uff0c\u6211\u662f\u73ed\u73ed\u53ef\u4e50\u3002\u770b\u4e86\u4f60\u5728\u4f53\u9a8c\u8425\u7684\u8868\u73b0\uff0c\u771f\u7684\u975e\u5e38\u624e\u5b9e\uff0c\u7279\u522b\u662f\u4f60\u5bf9\u753b\u672c\u3001\u5ba1\u542c\u8fd9\u4e9b\u5e55\u540e\u5de5\u79cd\u4e5f\u6709\u7814\u7a76\uff0c\u4e00\u770b\u5c31\u662f\u6253\u7b97\u5728\u8fd9\u4e2a\u884c\u4e1a\u6df1\u8015\u7684\u2018\u6280\u672f\u6d41\u2019\u3002\u54b1\u4eec\u9ad8\u9636\u73ed\u5c31\u662f\u4e3a\u4f60\u8fd9\u6837\u6709\u60f3\u6cd5\u3001\u80af\u94bb\u7814\u7684\u540c\u5b66\u51c6\u5907\u7684\uff0c\u6211\u4f1a\u5e2e\u4f60\u5bf9\u63a5\u66f4\u5782\u76f4\u7684\u8d44\u6e90\u548c\u540c\u9891\u7684\u2018\u5377\u738b\u2019\u540c\u5b66\uff0c\u54b1\u4eec\u4e00\u8d77\u628a\u5174\u8da3\u53d8\u6210\u786c\u5b9e\u529b\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u3002\u91cd\u70b9\u5bf9\u63a5\u6280\u80fd\u63d0\u5347\u6a21\u5757\u3001\u9879\u76ee\u5236\u5b9e\u6218\uff08\u5982\u753b\u672c\u3001\u5ba1\u542c\u5165\u95e8\u4efb\u52a1\uff09\u3001\u7248\u6743\u4e66\u5f55\u5236\u6307\u5bfc\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T3\u6b7b\u78d5\u5b66\u9738\u578b\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a\u3010**\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743**\u3011\uff08\u5982\u4e13\u5c5e\u7b54\u7591\u65f6\u95f4\u3001\u52a0\u9910\u6280\u672f\u5206\u4eab\uff09\u3001\u3010**\u540c\u9891\u5708\u5b50\u5f15\u5165**\u3011\uff08\u5982\u201c\u6280\u672f\u6d41\u201d\u5c0f\u7fa4\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7edd\u4e0d\u8981\u53ea\u628a\u4ed6\u5f53\u201c\u5c0f\u767d\u201d\u5bf9\u5f85\uff0c\u907f\u514d\u8fc7\u5ea6\u7b80\u5355\u7684\u9f13\u52b1\uff1b\u7edd\u4e0d\u8981\u7a7a\u8c08\u201c\u6708\u5165\u8fc7\u4e07\u201d\u800c\u5ffd\u89c6\u6280\u80fd\u6210\u957f\u7684\u957f\u671f\u8def\u5f84\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u77ed\u671f\u5185\u7684\u4e8c\u6b21\u5347\u5355**\u3002\u5e94\u5148\u786e\u4fdd\u5176\u5728\u9ad8\u9636\u73ed\u83b7\u5f97\u624e\u5b9e\u6210\u679c\u4e0e\u5f52\u5c5e\u611f\uff0c\u540e\u7eed\u53ef\u6839\u636e\u5176\u63a5\u5355\u6216\u9879\u76ee\u53c2\u4e0e\u60c5\u51b5\uff0c\u63a8\u8350\u66f4\u9ad8\u7ea7\u522b\u7684\u4e13\u9879\u8bad\u7ec3\u6216\u8d44\u6e90\u5305\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5165\u8fd9\u884c\u7684\u76ee\u7684\u4e00\u4e2a\u4e5f\u662f\u4e3a\u4e86\u57f9\u517b\u81ea\u5df1\u7684\u5174\u8da3\uff0c\u4e00\u4e2a\u5c31\u662f\u6323\u70b9\u5916\u5757\u5feb\u201d\n2. > \u201c\u54c8\u55bd\uff0c\u51cc\u4e91\u5e08\u5144\uff0c\u672a\u6765\u5b66\u4e60\u4e2d\u60f3\u505a\u7684\u659c\u6760\u5c97\u4f4d\uff1a\u524d\u671f\u4f18\u5148\u753b\u672c\uff0c\u5ba1\u542c\uff0c\u5bf9\u8f68+\u5e72\u97f3\u5904\u7406\uff1b\u540e\u671f\u6162\u6162\u63d0\u5347\u6280\u80fd\u4e86\u63a5\u540e\u671f\u3002\u90fd\u60f3\u5c1d\u8bd5[\u5472\u7259]\u201d\n3. > \u201c\u55ef\u55ef \u5df2\u7ecf\u53d1\u73b0\u4e86\u81ea\u5df1\u548c\u4ed6\u4eec\u7684\u5dee\u8ddd\uff0c\u7ee7\u7eed\u52aa\u529b\uff0c\u4e89\u53d6\u5411\u5927\u4f6c\u9760\u8fd1\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T3\u6b7b\u78d5\u5b66\u9738\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4e0e\u5708\u5c42\u5f52\u5c5e**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d\u7b49**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u6e05\u6670\u7684\u6280\u672f\u6210\u957f\u8def\u5f84\u3001\u53ca\u65f6\u7684\u9879\u76ee\u5b9e\u8df5\u53cd\u9988\uff0c\u5e76\u5e2e\u52a9\u4ed6\u878d\u5165\u201c\u6280\u672f\u6d41\u201d\u540c\u9891\u5708\u5b50\uff0c\u4ee5\u5bf9\u6297\u540e\u7eed\u7684\u65f6\u95f4\u538b\u529b**\u3002\n\n```json\n{\"core_type\": \"T3 \u6b7b\u78d5\u5b66\u9738\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u5f52\u5c5e/\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\"}\n```";
