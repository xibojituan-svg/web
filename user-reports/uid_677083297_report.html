        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u672c\u6b21\u5206\u6790\u4ec5\u57fa\u4e8e\u9500\u552e\u7684\u5355\u5411\u63a8\u9001\u8bb0\u5f55\uff0c\u7528\u6237\u4ec5\u5728\u672b\u5c3e\u6709\u4e00\u6b21\u7b80\u77ed\u56de\u5e94\u3002**\u4e25\u91cd\u7f3a\u5931**\u5173\u4e8e\u7528\u6237\u4e2a\u4eba\u80cc\u666f\u3001\u8d22\u52a1\u72b6\u51b5\u3001\u65f6\u95f4\u7cbe\u529b\u3001\u5bb6\u5ead\u652f\u6301\u3001\u5b66\u4e60\u52a8\u673a\u3001\u8fc7\u5f80\u7ecf\u5386\u3001\u5fc3\u7406\u72b6\u6001\u7b49\u5173\u952e\u4fe1\u606f\u3002\u4ee5\u4e0b\u5206\u6790\u57fa\u4e8e\u9500\u552e\u8bdd\u672f\u7684\u201c\u5438\u5f15\u529b\u951a\u70b9\u201d\u8fdb\u884c\u53cd\u5411\u63a8\u6d4b\uff0c\u5b58\u5728\u8f83\u9ad8\u63a8\u65ad\u6027\u3002\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677083297 (\u6635\u79f0\u672a\u77e5) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-09 \u81f3 2026-04-05 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u559c\u64ad\u00b7\u4f73\u4f73 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u672a\u660e\u786e\u8d2d\u4e70\u3002\u9500\u552e\u63a8\u9001\u6d89\u53ca\uff1aAI\u77ed\u89c6\u9891\u8bfe\u3001\u6709\u58f0\u4e66\u914d\u97f3\u8bfe\u3001AI\u5199\u4f5c\u8bfe\u3001\u4e2a\u4ebaIP\u76f4\u64ad\u8bfe\u7b49\uff0c\u4ef7\u683c\u4ece\u514d\u8d39\u52301\u5143\u4f53\u9a8c\u8bfe\u4e0d\u7b49\u3002 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u7f3a\u5931**\u3002\u65e0\u652f\u4ed8\u884c\u4e3a\u6216\u652f\u4ed8\u80fd\u529b\u8ba8\u8bba\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u7f3a\u5931**\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\ 1\u653e\u5f03\u6216\u60c5\u7eea\u6ce2\u52a8\u7684\u5bf9\u8bdd\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u65e0\u76f8\u5173\u8bc1\u636e\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u57fa\u4e8e\u9500\u552e\u8bdd\u672f\u7684\u201c\u5438\u5f15\u529b\u951a\u70b9\u201d\u53cd\u5411\u63a8\u65ad\u7528\u6237\u53ef\u80fd\u88ab\u89e6\u52a8\u7684\u9700\u6c42\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c / \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 ] (\u63a8\u65ad)\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u73b0\u6709\u6536\u5165\u6216\u804c\u4e1a\u5b89\u5168\u611f\u7684\u6f5c\u5728\u7126\u8651**\u3002\u9500\u552e\u53cd\u590d\u5f3a\u8c03\u201c\u526f\u4e1a\u201d\u3001\u201c\u7075\u6d3b\u6536\u5165\u201d\u3001\u201c\u628a\u7a7a\u95f2\u65f6\u95f4\u53d8\u6210\u94b1\u201d\u3001\u201c\u4e0d\u7528\u51fa\u4e00\u4efd\u529b\u8d5a\u4e00\u4efd\u94b1\u201d\uff0c\u7cbe\u51c6\u51fb\u4e2d\u4e86\u7528\u6237\u5bf9\u7ecf\u6d4e\u4fdd\u969c\u548c\u6297\u98ce\u9669\u80fd\u529b\u7684\u9700\u6c42\u3002\u540c\u65f6\uff0c\u201c\u5b9d\u5988\u201d\u3001\u201c\u666e\u901a\u4eba\u201d\u7b49\u6848\u4f8b\u4e5f\u6697\u793a\u4e86\u5bf9\u793e\u7fa4\u5f52\u5c5e\u548c\u8eab\u4efd\u8ba4\u540c\u7684\u6e34\u671b\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u201d\u7684\u5b89\u5168\u611f\u4e0e\u201c\u88ab\u5e26\u9886\u201d\u7684\u786e\u5b9a\u6027**\u3002\u63d0\u4f9b\u4e00\u4e2a\u6e05\u6670\u3001\u4f4e\u95e8\u69db\u3001\u6709\u540c\u4f34\uff08\u6848\u4f8b\uff09\u7684\u8def\u5f84\uff0c\u7f13\u89e3\u5176\u5bf9\u672a\u77e5\u9886\u57df\u7684\u7126\u8651\uff0c\u5e76\u7ed9\u4e88\u201c\u4f60\u4e5f\u80fd\u505a\u5230\u201d\u7684\u793e\u7fa4\u8ba4\u540c\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **[\ud83d\udfeaC1]** \u7c7b (\u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u5f52\u4e3a\u6f5c\u5728\u610f\u5411\u4f46\u672a\u8f6c\u5316\u7684\u89c2\u671b\u7528\u6237) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **[T8 \u6f5c\u6c34\u5403\u74dc]** (\u57fa\u4e8e\u6781\u4f4e\u4e92\u52a8\u9891\u7387\u548c\u88ab\u52a8\u8be2\u95ee\uff0c\u6700\u7b26\u5408\u201c\u6211\u5c31\u770b\u770b\u201d\u7684\u7279\u5f81) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5ead\u53cd\u5bf9\u7b49\u8ff9\u8c61\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | [\u672a\u77e5] | \u4fe1\u606f\u7f3a\u5931\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | [\u4e2d] | **\u6700\u53ef\u80fd**\u3002\u82e5\u5176\u65f6\u95f4\u788e\u7247\u5316\u6216\u5de5\u4f5c\u7e41\u5fd9\uff0c\u65e0\u6cd5\u8ddf\u4e0a\u5b66\u4e60\u8282\u594f\uff0c\u6613\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a-\u81ea\u8d23-\u653e\u5f03\u201d\u7684\u8fde\u9501\u53cd\u5e94\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | [\u672a\u77e5] | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u9700\u8b66\u60d5\u5176\u56e0\u201cAI\u5de5\u5177\u64cd\u4f5c\u590d\u6742\u201d\u3001\u201c\u7b2c\u4e00\u6b21\u4f5c\u4e1a\u96be\u5b8c\u6210\u201d\u800c\u53d7\u632b\u653e\u5f03\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | [\u9ad8] | **\u6781\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u8fc7\u5ea6\u6e32\u67d3\u201c\u5feb\u901f\u63a5\u5355\u201d\u3001\u201c\u9ad8\u65f6\u85aa\u201d\uff0c\u82e5\u7528\u6237\u62a5\u540d\u540e\u77ed\u671f\u5185\u672a\u770b\u5230\u53d8\u73b0\u7ed3\u679c\uff0c\u6781\u6613\u4ea7\u751f\u88ab\u6b3a\u9a97\u611f\u5e76\u5f15\u53d1\u6295\u8bc9\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c\u4e00\u5468\u81f3\u7b2c\u4e09\u5468**\u3002\u5f53\u7528\u6237\u53d1\u73b0\u5b66\u4e60\u6709\u95e8\u69db\u3001\u53d8\u73b0\u975e\u5373\u65f6\uff0c\u4e14\u9700\u8981\u6295\u5165\u6301\u7eed\u7cbe\u529b\u65f6\uff0c\u843d\u5dee\u611f\u6700\u5927\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u770b\u5230\u4f60\u4e4b\u524d\u5bf9AI\u89c6\u9891/\u914d\u97f3\u611f\u5174\u8da3\uff0c\u7279\u522b\u7406\u89e3\u4f60\u60f3\u7528\u65b0\u6280\u80fd\u589e\u52a0\u4e00\u4efd\u6536\u5165\u7684\u5fc3\u60c5\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bad\u7ec3\u8425\u91cc\u5f88\u591a\u540c\u5b66\u90fd\u662f\u96f6\u57fa\u7840\u5f00\u59cb\u7684\uff0c\u522b\u62c5\u5fc3\u8ddf\u4e0d\u4e0a\uff0c\u54b1\u4eec\u7b2c\u4e00\u5468\u7684\u76ee\u6807\u4e0d\u662f\u63a5\u5927\u5355\uff0c\u800c\u662f\u5148\u2018\u73a9\u8d77\u6765\u2019\uff0c\u505a\u51fa\u7b2c\u4e00\u4e2a\u5c5e\u4e8e\u81ea\u5df1\u7684\u5c0f\u4f5c\u54c1\u3002\u6709\u4efb\u4f55\u5361\u4f4f\u7684\u5730\u65b9\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u89e3\u51b3\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5174\u8da3\u6e38\u4e50\u7ebf\u3011**\u3002\u9996\u8981\u76ee\u6807\u662f\u964d\u4f4e\u5176\u542f\u52a8\u95e8\u69db\uff0c\u7528\u201c\u597d\u73a9\u3001\u6613\u4e0a\u624b\u201d\u5438\u5f15\u5176\u5b8c\u6210\u521d\u6b65\u5b66\u4e60\uff0c\u5efa\u7acb\u4fe1\u5fc3\u548c\u7c98\u6027\uff0c\u800c\u975e\u76f4\u63a5\u5f3a\u63a8\u201c\u786c\u6838\u5b9e\u5e72\u201d\u6216\u201c\u5feb\u901f\u63a5\u5355\u201d\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u9ad8\u6536\u76ca\u843d\u5dee\u98ce\u9669\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u7528\u9ad8\u9891\u3001\u4f4e\u96be\u5ea6\u7684\u6b63\u53cd\u9988\uff08\u5982\u5b8c\u6210\u4e00\u4e2a\u7b80\u5355AI\u751f\u6210\u4efb\u52a1\u5c31\u7ed9\u4e88\u5938\u5f20\u8868\u626c\uff09\u7ef4\u6301\u5176\u5b66\u4e60\u52a8\u529b\uff0c\u5265\u79bb\u4e00\u5207\u589e\u52a0\u632b\u8d25\u611f\u7684\u590d\u6742\u4efb\u52a1\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5728\u524d\u671f\u8fc7\u5ea6\u627f\u8bfa\u53d8\u73b0\u901f\u5ea6\u548c\u91d1\u989d\uff1b\u5e03\u7f6e\u590d\u6742\u3001\u8017\u65f6\u7684\u4f5c\u4e1a\uff1b\u5c06\u5176\u4e0e\u8fdb\u5ea6\u5feb\u3001\u6210\u679c\u597d\u7684\u5b66\u5458\u5bf9\u6bd4\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u9996\u6b21\u8bfe\u7a0b\u5b8c\u6210\u524d\u8fdb\u884c\u4efb\u4f55\u5347\u5355**\u3002\u53ea\u6709\u5728\u786e\u8ba4\u5176\u5b8c\u6210\u57fa\u7840\u5b66\u4e60\u3001\u83b7\u5f97\u6210\u5c31\u611f\u540e\uff0c\u65b9\u53ef\u8bd5\u63a2\u6027\u63a8\u8350500\u5143\u4ee5\u5185\u7684\u5fae\u5347\u5355\u4ea7\u54c1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u662f\u6709\u8fd9\u65b9\u9762\u7684\u8bfe\u5417\uff1f\u201d **(\u7528\u6237\u552f\u4e00\u4e3b\u52a8\u53d1\u8a00\uff0c\u66b4\u9732\u5176\u88ab\u52a8\u3001\u89c2\u671b\u72b6\u6001)**\n2. > \u201c[\u9500\u552e]\ud83d\udcb0100\u5143/\u5206\u949f\u7684\u89c6\u9891\u526a\u8f91\u5355\u6765\u4e86\uff01\u4e0a\u6b21\u8ddf\u4f60\u804a\u7684\u77ed\u89c6\u9891\u526f\u4e1a\uff0c\u5df2\u7ecf\u6709\u670b\u53cb\u8d5a\u5230\u65b0\u5e74\u7b2c\u4e00\u7b14\u4e86\u3002\u201d **(\u9500\u552e\u6301\u7eed\u4ee5\u9ad8\u6536\u76ca\u3001\u5feb\u53d8\u73b0\u4f5c\u4e3a\u6838\u5fc3\u94a9\u5b50)**\n3. > \u201c[\u9500\u552e]\u4e0e\u5176\u4e00\u76f4\u8ffd\u7740\u65f6\u85aa\u8dd1\uff0c\u4e0d\u5982\u628a\u81ea\u5a92\u4f53\u4e00\u4e2a\u4eba\u5c31\u80fd\u957f\u671f\u8d5a\u94b1\u201d **(\u9500\u552e\u8bdd\u672f\u4ece\u201c\u5feb\u94b1\u201d\u8f6c\u5411\u201c\u957f\u671f\u7cfb\u7edf\u201d\uff0c\u8bd5\u56fe\u8f6c\u5316\u66f4\u9ad8\u9636\u9700\u6c42\uff0c\u4f46\u7528\u6237\u672a\u56de\u5e94)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T8 \u6f5c\u6c34\u5403\u74dc\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u53d6\u4e00\u4efd\u4f4e\u95e8\u69db\u7684\u526f\u4e1a\u5b89\u5168\u611f\uff0c\u7f13\u89e3\u7126\u8651\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff08\u4e00\u65e6\u4ed8\u8d39\u540e\u9884\u671f\u672a\u8fbe\uff09\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7528\u201c\u5174\u8da3\u6e38\u4e50\u7ebf\u201d+\u201c\u7597\u6108\u966a\u5b66\u5305\u201d\u964d\u4f4e\u542f\u52a8\u95e8\u69db\uff0c\u4e25\u63a7\u524d\u671f\u6536\u76ca\u9884\u671f\uff0c\u7528\u9ad8\u9891\u6b63\u53cd\u9988\u7ef4\u6301\u5b66\u4e60\u52a8\u529b\u3011**\u3002\n\n```json\n{\"core_type\": \"T8 \u6f5c\u6c34\u5403\u74dc\u578b\", \"maslow_need\": \"\u5b89\u5168/\u793e\u4ea4\u9700\u6c42\", \"risk_level\": \"\u9ad8\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf+\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
