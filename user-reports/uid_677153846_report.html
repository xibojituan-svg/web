    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677153846\u7684\u7528\u6237\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677153846 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-06 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6709\u58f0\u5c0f\u6e145(\u4e8e\u53cc\u53cc) / \u5b98\u65b9\u52a9\u6559-\u68a6\u5883(\u4e8e\u53cc\u53cc) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u9ad8\u9636\u73ed (7380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u4ec5\u89c1\u8ba2\u5355\u7f16\u53f7\uff0c\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u5206\u671f\u6216\u8d44\u91d1\u6765\u6e90\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u804c\u4e1a\u4e3a\u62a4\u58eb\uff0c\u63a8\u6d4b\u65f6\u95f4\u788e\u7247\u5316\uff0c\u4f46\u672a\u660e\u786e\u63d0\u53ca\u73ed\u6b21\u6216\u53ef\u652f\u914d\u5b66\u4e60\u65f6\u6bb5\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u6709\u660e\u786e\u804c\u4e1a\u3001\u76ee\u7684\u548c\u4e92\u52a8\uff0c\u4f46\u7f3a\u4e4f\u652f\u4ed8\u3001\u65f6\u95f4\u3001\u5bb6\u5ead\u7b49\u5173\u952e\u98ce\u9669\u7ef4\u5ea6\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e\uff0c\u4f46\u4f34\u968f\u5bf9\u6280\u80fd\u63d0\u5347\u7684\u5174\u8da3\u3002\u5c5e\u4e8e\u201c\u52a1\u5b9e\u53d8\u73b0+\u5174\u8da3\u63a2\u7d22\u201d\u7684\u6df7\u5408\u52a8\u673a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6765\u8fd9\u91cc\u7684\u76ee\u7684\u662f\u4ec0\u4e48\u5462\uff1f\u517c\u804c\u8d5a\u94b1\u201d\uff1b> \u201c\u662f\u60f3\u5728\u8fd9\u4e2a\u884c\u4e1a\u7ee7\u7eed\u53d1\u5c55\u7684 \u4e89\u53d6\u5728\u517c\u804c\u505a\u5230\u5168\u804c[\u5077\u7b11]\u201d\uff1b> \u201c\u6539\u53d8\u58f0\u7ebf\u201d\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u5df2\u652f\u4ed87380\u5143\u6b63\u4ef7\u8bfe\uff0c\u672a\u8868\u73b0\u51fa\u7ecf\u6d4e\u538b\u529b\uff0c\u4f46\u8d44\u91d1\u6765\u6e90\u672a\u77e5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u62a4\u58eb\u804c\u4e1a\uff0c\u63a8\u6d4b\u65f6\u95f4\u788e\u7247\u5316\u3002\u80fd\u6309\u65f6\u5b8c\u6210\u6253\u5361\u548c\u4f5c\u4e1a\uff0c\u6267\u884c\u529b\u5c1a\u53ef\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u65f6\u95f4\u5b89\u6392\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8 (7-8\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u4e3b\u52a8\u53cd\u9988\u6280\u672f\u95ee\u9898\uff08\u201c\u6211\u611f\u89c9\u6211\u7684\u58f0\u7ebf \u6c89\u4e0d\u4e0b\u53bb\u201d\uff09\uff0c\u5e76\u63a5\u53d7\u6307\u5bfc\u540e\u8868\u793a\u201c\u6211\u5148\u505a\u7ec3\u4e60\u5427\u201d\uff0c\u8868\u73b0\u51fa\u79ef\u6781\u89e3\u51b3\u95ee\u9898\u7684\u6001\u5ea6\uff0c\u65e0\u60c5\u7eea\u5316\u62b1\u6028\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u611f\u89c9\u6211\u7684\u58f0\u7ebf \u6c89\u4e0d\u4e0b\u53bb\u201d\uff1b> \u201c\u597d\u7684 \u8c22\u8c22\u8001\u5e08 \u6211\u4f1a\u52aa\u529b\u54d2[\u62f3\u5934]\u201d\uff1b> \u201c\u597d\u7684 \u6211\u5148\u505a\u7ec3\u4e60\u5427\u201d\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 (\u7126\u8651\u4fdd\u969c) \u4e0e \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 (\u80fd\u529b\u8ba4\u53ef) \u7684\u6df7\u5408**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u804c\u4e1a\u53d1\u5c55\u4e0d\u786e\u5b9a\u6027\u7684\u7126\u8651\uff08\u62a4\u58eb\u804c\u4e1a\u5bfb\u6c42\u517c\u804c/\u5168\u804c\u8f6c\u578b\uff09\uff0c\u4ee5\u53ca\u5bf9\u81ea\u8eab\u80fd\u529b\uff08\u58f0\u7ebf\u63a7\u5236\uff09\u80fd\u5426\u88ab\u5e02\u573a\u8ba4\u53ef\u7684\u62c5\u5fe7\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u4e13\u4e1a\u8ba4\u53ef\u201d\u4e0e\u201c\u8def\u5f84\u6e05\u6670\u7684\u5b89\u5168\u611f\u201d**\u3002\u5979\u9700\u8981\u88ab\u660e\u786e\u544a\u77e5\u201c\u4f60\u7684\u58f0\u97f3\u6709\u6f5c\u529b\u201d\u3001\u201c\u6309\u8fd9\u4e2a\u8def\u5f84\u8d70\u53ef\u4ee5\u53d8\u73b0\u201d\uff0c\u4ece\u800c\u83b7\u5f97\u4ece\u201c\u62a4\u58eb\u201d\u5230\u201c\u6709\u58f0\u6f14\u64ad\u5e08\u201d\u8eab\u4efd\u8f6c\u53d8\u7684\u4fe1\u5fc3\u548c\u4fdd\u969c\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u52a8\u673a\u4e2d\u3001\u5f39\u6027\u9ad8\u3001\u8d44\u6e90\u4e2d\uff0c\u6267\u884c\u529b\u5f3a\uff0c\u5173\u6ce8\u6280\u80fd) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u8a00\u8bba\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u5df2\u72ec\u7acb\u652f\u4ed8\uff0c\u98ce\u9669\u6682\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u62a4\u58eb\u5de5\u4f5c\u53ef\u80fd\u5b58\u5728\u7684\u591c\u73ed\u6216\u7a81\u53d1\u52a0\u73ed\uff0c\u5bfc\u81f4\u65e0\u6cd5\u89c4\u5f8b\u8ddf\u8bfe\uff0c\u4f5c\u4e1a\u79ef\u538b\u4ea7\u751f\u7126\u8651\u3002** |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u6c42\u89e3\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u632b\u6298\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | **\u6838\u5fc3\u98ce\u9669\u70b9\u3002** \u82e5\u5728\u627f\u8bfa\u7684\u201c\u517c\u804c\u8d5a\u94b1\u201d\u8def\u5f84\u4e0a\u957f\u65f6\u95f4\uff08\u59822-3\u4e2a\u6708\uff09\u63a5\u4e0d\u5230\u5355\u6216\u6536\u5165\u6781\u4f4e\uff0c\u53ef\u80fd\u56e0\u9884\u671f\u672a\u8fbe\u800c\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7684\u7b2c60-90\u5929\uff08\u63a5\u5355\u7a7a\u7a97\u671f\uff09**\u3002\u82e5\u6b64\u65f6\u6280\u80fd\u6709\u63d0\u5347\u4f46\u65e0\u5b9e\u9645\u53d8\u73b0\u673a\u4f1a\uff0c\u7126\u8651\u611f\u4f1a\u8fbe\u5230\u9876\u5cf0\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5a1f\u5a1c\uff0c\u770b\u5230\u4f60\u62a4\u58eb\u7684\u5de5\u4f5c\u80cc\u666f\u8fd8\u80fd\u8fd9\u4e48\u575a\u6301\u5b66\u4e60\uff0c\u771f\u7684\u7279\u522b\u4f69\u670d\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u5c31\u662f\u4e3a\u4f60\u8fd9\u6837\u60f3\u8e0f\u5b9e\u5b66\u95e8\u624b\u827a\u3001\u589e\u52a0\u4e00\u4efd\u6536\u5165\u4fdd\u969c\u7684\u4eba\u8bbe\u8ba1\u7684\u3002\u4f60\u4e0d\u7528\u7740\u6025\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u5148\u628a\u57fa\u7840\u6253\u7262\u3002\u4f60\u7684\u58f0\u97f3\u5e95\u5b50\u5f88\u597d\uff0c\u65b9\u5411\u4e5f\u660e\u786e\uff08\u6539\u53d8\u58f0\u7ebf\uff09\uff0c\u8ddf\u7740\u8bfe\u7a0b\u8d70\uff0c\u63a5\u5355\u662f\u6c34\u5230\u6e20\u6210\u7684\u4e8b\u3002\u8fc7\u7a0b\u4e2d\u6709\u4efb\u4f55\u65f6\u95f4\u4e0a\u7684\u56f0\u96be\uff08\u6bd4\u5982\u591c\u73ed\u8c03\u4f11\uff09\uff0c\u968f\u65f6\u8ddf\u6211\u8bf4\uff0c\u54b1\u4eec\u4e00\u8d77\u8c03\u6574\u8ba1\u5212\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176T2\u8001\u9ec4\u725b\u7279\u8d28\uff0c\u63d0\u4f9b\u624e\u5b9e\u7684\u6280\u80fd\u8bad\u7ec3\u548c\u660e\u786e\u7684\u8fdb\u9636\u8def\u5f84\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u3010\u7cbe\u786e\u6d3e\u5355\u62e6\u622a\u5305(B\u6a21\u5757\u53d8\u4f53)\u3011**\u3002\u5728\u57fa\u7840\u6280\u80fd\u8fbe\u6807\u540e\uff0c\u4f18\u5148\u4e3a\u5176\u5339\u914d\u7b26\u5408\u5176\u58f0\u7ebf\u7279\u70b9\uff08\u90fd\u5e02\u3001\u8a00\u60c5\u3001\u9752\u5c11\u5e74\u56fd\u5b66\uff09\u7684\u771f\u5b9e\u3001\u4f4e\u95e8\u69db\u8bd5\u97f3\u5355\uff0c**\u5feb\u901f\u5efa\u7acb\u201c\u5b66\u4e60-\u63a5\u5355\u201d\u7684\u6b63\u5411\u53cd\u9988\u5faa\u73af**\uff0c\u8fd9\u662f\u7a33\u4f4f\u5979\u7684\u5173\u952e\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u753b\u4e0d\u5207\u5b9e\u9645\u7684\u201c\u66b4\u5bcc\u201d\u5927\u997c\u30022. \u5728\u5979\u56e0\u5de5\u4f5c\u803d\u8bef\u5b66\u4e60\u65f6\u65bd\u52a0\u538b\u529b\uff0c\u800c\u5e94\u534f\u52a9\u8c03\u6574\u8ba1\u5212\u30023. \u63d0\u4f9b\u4e0e\u5176\u58f0\u7ebf\u4e0d\u7b26\u6216\u96be\u5ea6\u8fc7\u9ad8\u7684\u8bd5\u97f3\u5355\uff0c\u5bfc\u81f4\u632b\u8d25\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u9700\u5efa\u7acb\u5728\u6280\u80fd\u663e\u8457\u63d0\u5347\u548c\u9996\u6b21\u63a5\u5355\u6210\u529f\u4e4b\u540e**\u3002\u5979\u5177\u5907T2\u5411T3\uff08\u6781\u5ba2\u6d3e\uff09\u6216\u6df7\u5408\u4f533\u53f7\uff08\u6743\u9650\u89c9\u9192\uff09\u8fdb\u5316\u7684\u6f5c\u529b\uff0c\u540e\u7eed\u53ef\u63a8\u8350\u9ad8\u9636\u8bbe\u5907\u6216\u79c1\u6559\u8bfe\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6765\u8fd9\u91cc\u7684\u76ee\u7684\u662f\u4ec0\u4e48\u5462\uff1f\u517c\u804c\u8d5a\u94b1\u201d\n2. > \u201c\u662f\u60f3\u5728\u8fd9\u4e2a\u884c\u4e1a\u7ee7\u7eed\u53d1\u5c55\u7684 \u4e89\u53d6\u5728\u517c\u804c\u505a\u5230\u5168\u804c[\u5077\u7b11]\u201d\n3. > \u201c\u6211\u611f\u89c9\u6211\u7684\u58f0\u7ebf \u6c89\u4e0d\u4e0b\u53bb\u201d & \u201c\u597d\u7684 \u6211\u5148\u505a\u7ec3\u4e60\u5427\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2\u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u9700\u6c42\uff08\u804c\u4e1a\u4fdd\u969c\uff09\u4e0e\u5c0a\u91cd\u9700\u6c42\uff08\u80fd\u529b\u8ba4\u53ef\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5728\u6280\u80fd\u8fbe\u6807\u540e\uff0c\u7cbe\u51c6\u3001\u5feb\u901f\u5730\u63d0\u4f9b\u4e0e\u5176\u80fd\u529b\u5339\u914d\u7684\u8bd5\u97f3\u673a\u4f1a\uff0c\u5efa\u7acb\u201c\u5b66\u4e60-\u53d8\u73b0\u201d\u7684\u77ed\u671f\u6b63\u53cd\u9988\uff0c\u4e25\u9632\u6536\u76ca\u843d\u5dee\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168/\u5c0a\u91cd\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u7cbe\u786e\u6d3e\u5355\u62e6\u622a\u5305\"}\n```";
