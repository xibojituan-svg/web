    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u4e0e\u98ce\u63a7\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u4e2d\u7b49**\u3002\u6838\u5fc3\u52a8\u673a\u4e3a\u517c\u804c\u53d8\u73b0\uff08\u201c\u60f3\u8fd9\u505a\u517c\u804c\u6323\u70b9\u94b1\u561b\u201d\uff09\uff0c\u5bf9AI/\u6709\u58f0\u6f14\u64ad\u6280\u80fd\u6709\u5b66\u4e60\u5174\u8da3\uff08\u201c\u672c\u8eab\u6709\u70b9\u5b50\u6717\u8bf5\u529f\u5e95\u201d\uff09\uff0c\u5e76\u5173\u6ce8\u8bfe\u7a0b\u5177\u4f53\u5185\u5bb9\u4e0e\u56e2\u961f\u67b6\u6784\u3002\u4f46\u5b58\u5728**\u53d8\u73b0\u9884\u671f\u6a21\u7cca**\uff08\u201c\u4e0d\u77e5\u9053\u5177\u4f53\u9700\u8981\u6295\u5165\u591a\u5c11\u65f6\u95f4\u201d\uff09\uff0c\u4e14\u5bf9\u8bfe\u7a0b\u4ef7\u683c\u654f\u611f\uff08\u201c\u51e0\u5343\u5757\u7684\u8bfe\u65f6\u8d39\u8fd8\u662f\u6709\u70b9\u5403\u529b\u7684\u201d\uff09\uff0c\u5b66\u4e60\u52a8\u673a\u4e0e\u5feb\u901f\u53d8\u73b0\u671f\u671b\u4ea4\u7ec7\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u8f83\u4f4e**\u3002**\u5728\u6821\u5b66\u751f\u8eab\u4efd**\uff0c\u7ecf\u6d4e\u8d44\u6e90\u6709\u9650\uff0c\u5bf9\u4ef7\u683c\u654f\u611f\u3002\u65f6\u95f4\u8d44\u6e90\u4e3a\u517c\u804c\u6295\u5165\uff0c\u5b58\u5728\u4e0d\u786e\u5b9a\u6027\u3002\u5177\u5907\u4e00\u5b9a\u7684\u5b66\u4e60\u80fd\u529b\u4e0e\u521d\u6b65\u6280\u80fd\uff08\u6717\u8bf5\u3001AI\u6982\u5ff5\u7406\u89e3\uff09\uff0c\u4f46\u7f3a\u4e4f\u884c\u4e1a\u7ecf\u9a8c\u4e0e\u6210\u719f\u4f5c\u54c1\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u4e2d\u7b49\u504f\u9ad8**\u3002**\u4e92\u52a8\u79ef\u6781**\uff0c\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u56de\u590d\u6d88\u606f\u3001\u53c2\u4e0e\u76f4\u64ad\u3002**\u4e3b\u52a8\u63d0\u95ee**\uff08\u8be2\u95ee\u56e2\u961f\u67b6\u6784\u3001\u4ef7\u683c\u3001\u4f18\u60e0\uff09\uff0c\u8868\u73b0\u51fa\u63a2\u7d22\u4e0e\u89c4\u5212\u610f\u613f\u3002\u5bf9\u9500\u552e\u627f\u8bfa\uff08\u5982\u5546\u5355\u3001\u6bd4\u8d5b\uff09\u672a\u8868\u73b0\u51fa\u76f2\u76ee\u5174\u594b\uff0c**\u6709\u4e00\u5b9a\u7406\u6027\u601d\u8003**\uff08\u201c\u54ac\u54ac\u7259\u4e5f\u80fd\u4e70\u201d\uff09\u3002\u4f46\u5bf9\u8d44\u6e90\u6d88\u8017\u654f\u611f\uff08\u201c\u70b9\u6570\u5df2\u7ecf\u8981\u7528\u5b8c\u4e86\u201d\uff09\uff0c\u53ef\u80fd\u9690\u542b\u5bf9\u6295\u5165\u4ea7\u51fa\u6bd4\u7684\u62c5\u5fe7\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u6267\u884c\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u5df2\u652f\u4ed8**\uff08\u7528\u6237\uff1a\u201c\u5df2\u652f\u4ed8\u201d\uff09\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u4e3a\u5728\u6821\u5b66\u751f\uff0c\u4f46\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5b66\u8d39\u6765\u6e90\uff08\u4e2a\u4eba\u50a8\u84c4/\u5bb6\u5ead\u652f\u6301\uff09\u53ca\u5bb6\u5ead\u662f\u5426\u77e5\u60c5\u3002**\u6b64\u4e3a\u5173\u952e\u98ce\u9669\u70b9**\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u4e0e\u8d44\u6e90\u5339\u914d (A/B\u8f74)**: **B- (\u8d44\u6e90\u6709\u9650\u578b)**\u3002\u52a8\u673a\u660e\u786e\uff08\u517c\u804c\u53d8\u73b0+\u6280\u80fd\u5b66\u4e60\uff09\uff0c\u4f46\u5b66\u751f\u8eab\u4efd\u5bfc\u81f4\u7ecf\u6d4e\u4e0e\u65f6\u95f4\u8d44\u6e90\u5747\u53d7\u9650\uff0c\u4e0e\u8bfe\u7a0b\u53ef\u80fd\u7684\u9ad8\u5f3a\u5ea6\u3001\u5feb\u53d8\u73b0\u627f\u8bfa\u5b58\u5728\u6f5c\u5728\u51b2\u7a81\u3002\n*   **\u6b65\u9aa42 - \u51b3\u7b56\u6a21\u5f0f\u4e0e\u627f\u8bfa\u503e\u5411 (C\u8f74)**: **C2 (\u5ba1\u614e\u6c42\u8bc1\u578b)**\u3002\u51b3\u7b56\u524d\u591a\u6b21\u4e3b\u52a8\u8be2\u95ee\u7ec6\u8282\uff08\u4ef7\u683c\u3001\u4f18\u60e0\u3001\u56e2\u961f\u7ed3\u6784\u3001\u517c\u804c\u5efa\u8bae\uff09\uff0c\u5bf9\u9500\u552e\u4fe1\u606f\u8fdb\u884c\u6838\u5b9e\uff08\u6307\u51fa\u7fa4\u4e8c\u7ef4\u7801\u65e5\u671f\u9519\u8bef\uff09\uff0c\u672a\u8f7b\u6613\u88ab\u627f\u8bfa\u6253\u52a8\u3002\n*   **\u6b65\u9aa43 - \u884c\u52a8\u4e0e\u6295\u5165\u5ea6 (D\u8f74)**: **D2 (\u79ef\u6781\u53c2\u4e0e\u578b)**\u3002\u914d\u5408\u5b8c\u6210\u5404\u9879\u4efb\u52a1\uff08\u4f5c\u4e1a\u3001\u6253\u5361\u3001\u8fdb\u7fa4\uff09\uff0c\u54cd\u5e94\u53ca\u65f6\uff0c\u8868\u73b0\u51fa\u8f83\u9ad8\u7684\u521d\u59cb\u914d\u5408\u5ea6\u3002\n*   **\u7efc\u5408\u5224\u5b9a**: **B-C2-D2**\u3002\u8d44\u6e90\u6709\u9650\u7684\u5ba1\u614e\u53c2\u4e0e\u8005\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b: T5 \u52a1\u5b9e\u63a2\u7d22\u8005**\u3002\n    *   **\u4f9d\u636e**: \u6838\u5fc3\u8bc9\u6c42\u4e3a\u517c\u804c\u53d8\u73b0\uff0c\u5bf9\u5177\u4f53\u8def\u5f84\uff08\u5546\u5355\u3001\u56e2\u961f\uff09\u6709\u52a1\u5b9e\u8ffd\u95ee\u3002\u5b66\u4e60\u884c\u52a8\u529b\u5f3a\uff0c\u4f46\u7ecf\u6d4e\u6761\u4ef6\u6709\u9650\uff0c\u5bf9\u4ef7\u683c\u654f\u611f\u3002\u5bf9\u8fc7\u5ea6\u7f8e\u597d\u7684\u627f\u8bfa\uff08\u5982\u201c\u5927\u4f6c\u5185\u5b9a\u201d\uff09\u53cd\u5e94\u5e73\u6de1\uff0c\u66f4\u5173\u6ce8\u53ef\u843d\u5730\u7684\u7ec6\u8282\u3002\n    *   **\u504f\u5dee\u70b9**: \u7528\u6237\u8868\u73b0\u51fa\u6bd4\u5178\u578bT5\u66f4\u5f3a\u7684\u4e3b\u52a8\u63a2\u7d22\u610f\u613f\uff08\u8be2\u95ee\u56e2\u961f\u67b6\u6784\uff09\u548c\u4e00\u5b9a\u7684\u6280\u80fd\u81ea\u4fe1\uff0c\u4f46\u6838\u5fc3\u7279\u5f81\uff08\u8d44\u6e90\u6709\u9650\u3001\u52a1\u5b9e\u3001\u91cd\u53d8\u73b0\uff09\u9ad8\u5ea6\u543b\u5408\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u98ce\u9669\u7b49\u7ea7\uff1a\u4e2d)\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**: **\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u7b2c\u4e8c\u5468\u63a5\u5355\u201d\u3001\u201c100-300/\u5206\u949f\u201d\uff0c\u53ef\u80fd\u5851\u9020\u4e86**\u4e0d\u5207\u5b9e\u9645\u7684\u5feb\u901f\u53d8\u73b0\u9884\u671f**\u3002\u7528\u6237\u65f6\u95f4\u6709\u9650\uff0c\u82e5\u6295\u5165\u540e\u6536\u76ca\u4e0d\u53ca\u9884\u671f\uff0c\u6781\u6613\u5f15\u53d1\u6295\u8bc9\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b/\u51b2\u52a8\u6d88\u8d39**: **\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u51e0\u5343\u5757\u2026\u6709\u70b9\u5403\u529b\u201d\uff0c\u652f\u4ed8\u51b3\u7b56\u53ef\u80fd\u5305\u542b\u201c\u54ac\u54ac\u7259\u201d\u7684\u51b2\u52a8\u6210\u5206\u3002**\u5b66\u751f\u8eab\u4efd+\u5bb6\u5ead\u51b3\u7b56\u6743\u672a\u6838\u5b9e**\u662f\u91cd\u5927\u98ce\u9669\u6e90\u3002\n    3.  **\u8bfe\u7a0b\u8d28\u91cf/\u670d\u52a1\u4e0d\u7b26**: **\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5173\u6ce8\u5177\u4f53\u5e08\u8d44\uff08\u5e84\u5468\u8001\u5e08\uff09\u3001\u56e2\u961f\u67b6\u6784\uff0c\u82e5\u5b9e\u9645\u8bfe\u7a0b\u6216\u670d\u52a1\u4e0e\u9500\u552e\u63cf\u8ff0\uff08\u5982\u201c\u65b0\u624b\u6751\u5de5\u4f5c\u5ba4\u201d\u5177\u4f53\u8fd0\u4f5c\uff09\u6709\u5dee\u8ddd\uff0c\u53ef\u80fd\u5f15\u53d1\u4e0d\u6ee1\u3002\n    4.  **\u65f6\u95f4\u51b2\u7a81**: **\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u8ba1\u5212\u517c\u804c\uff0c\u5b66\u4e1a\u4e3a\u4e3b\u3002\u82e5\u8bfe\u7a0b\u8017\u65f6\u8fdc\u8d85\u9884\u671f\uff0c\u53ef\u80fd\u5bfc\u81f4\u65e0\u6cd5\u8ddf\u8fdb\uff0c\u4ea7\u751f\u632b\u8d25\u611f\u3002\n    5.  **\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa**: **\u4e2d\u98ce\u9669**\u3002\u9500\u552e\u63d0\u53ca\u201c\u6bd4\u8d5b\u5185\u5b9a\u5de5\u4f5c\u201d\u3001\u201c\u4e13\u5c5e\u63a5\u5355\u6e20\u9053\u201d\u7b49\uff0c\u5b58\u5728\u4e00\u5b9a\u5938\u5927\u53ef\u80fd\uff0c\u4e3a\u7528\u6237\u540e\u7eed\u8d28\u7591\u57cb\u4e0b\u9690\u60a3\u3002\n    6.  **\u4e2a\u4eba/\u5bb6\u5ead\u53d8\u6545**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\n    7.  **\u7ade\u54c1/\u66ff\u4ee3\u65b9\u6848**: **\u4f4e\u98ce\u9669**\u3002\u5f53\u524d\u672a\u8868\u73b0\u51fa\u5bf9\u6bd4\u884c\u4e3a\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u4e3b\u8981\u95ee\u9898**:\n    *   **\u5938\u5927\u6536\u76ca\u4e0e\u5c31\u4e1a\u524d\u666f**: \u9500\u552e\u63d0\u53ca\u201c\u5f88\u591a\u5b66\u5458\u62ff\u5230\u540d\u6b21\uff0c\u5de5\u4f5c\u88ab\u5927\u4f6c\u5185\u5b9a\u201d\u3001\u201c\u7b2c\u4e8c\u5468\u5373\u5f00\u901a\u63a5\u5355\u6743\u9650\u201d\u7b49\uff0c**\u5b58\u5728\u8fc7\u5ea6\u627f\u8bfa\u548c\u6697\u793a\u4fdd\u969c\u6027\u7ed3\u679c\u7684\u98ce\u9669**\u3002\n    *   **\u672a\u5145\u5206\u63d0\u793a\u98ce\u9669\u4e0e\u6295\u5165**: \u672a\u9488\u5bf9\u5b66\u751f\u517c\u804c\u7684\u5b9e\u9645\u60c5\u51b5\uff0c\u5145\u5206\u8bf4\u660e\u5b66\u4e60\u65f6\u95f4\u6210\u672c\u3001\u6280\u80fd\u63d0\u5347\u5468\u671f\u53ca\u53d8\u73b0\u7684\u4e0d\u786e\u5b9a\u6027\u3002\n    *   **\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5\u7f3a\u5931**: **\u5173\u952e\u5408\u89c4\u6f0f\u6d1e**\u3002\u672a\u5bf9\u5728\u6821\u5b66\u751f\u652f\u4ed8\u5927\u989d\u5b66\u8d39\u7684\u5bb6\u5ead\u77e5\u60c5\u60c5\u51b5\u8fdb\u884c\u4efb\u4f55\u6838\u5b9e\u3002\n*   **\u5408\u89c4\u70b9**: \u7528\u6237\u4e3b\u52a8\u8be2\u95ee\u4ef7\u683c\u4e0e\u7ec6\u8282\uff0c\u9500\u552e\u8fdb\u884c\u4e86\u90e8\u5206\u89e3\u7b54\uff0c\u672a\u53d1\u73b0\u5f3a\u4e70\u5f3a\u5356\u6216\u6b3a\u8bc8\u6027\u8bdd\u672f\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**: **\u504f\u5dee**\u3002\u8bfe\u7a0b\u5185\u5bb9\uff08AIGC\u89c6\u9891\u521b\u4f5c\uff09\u4e0e\u7528\u6237\u521d\u59cb\u5174\u8da3\u70b9\uff08\u6709\u58f0\u6f14\u64ad\u517c\u804c\uff09\u5b58\u5728**\u8d5b\u9053\u504f\u5dee**\u3002\u867d\u7136\u9500\u552e\u540e\u7eed\u5f15\u5bfc\u81f3AI\u8d5b\u9053\uff0c\u4f46\u7528\u6237\u6700\u521d\u5bfb\u6c42\u7684\u662f\u58f0\u97f3\u53d8\u73b0\uff0c\u9700\u5173\u6ce8\u5176\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u7684\u76ee\u6807\u6f02\u79fb\u4e0e\u56f0\u60d1\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **24h\u5185\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\uff0c\u6821\u6b63\u53d8\u73b0\u9884\u671f**\u3002\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**:\n    1.  **\u7d27\u6025\u98ce\u63a7**: \u9996\u901a\u7535\u8bdd\u5fc5\u987b\u6e29\u548c\u6838\u5b9e\u5b66\u8d39\u6765\u6e90\uff0c\u786e\u8ba4\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\uff0c\u5e76\u8bb0\u5f55\u5728\u6848\u3002\u5982\u4e3a\u79c1\u81ea\u652f\u4ed8\uff0c\u9700\u542f\u52a8\u5bb6\u5ead\u77e5\u60c5\u786e\u8ba4\u6d41\u7a0b\u3002\n    2.  **\u9884\u671f\u7ba1\u7406**: \u5728\u9996\u6b21\u5b66\u4e60\u89c4\u5212\u6c9f\u901a\u4e2d\uff0c\u660e\u786e\u5f3a\u8c03\u6280\u80fd\u5b66\u4e60\u5468\u671f\uff0c\u7528\u6848\u4f8b\u8bf4\u660e\u4ece\u5b66\u4e60\u5230\u7a33\u5b9a\u63a5\u5355\u7684\u6b63\u5e38\u65f6\u95f4\u7ebf\uff0c**\u964d\u4f4e\u5176\u201c\u7b2c\u4e8c\u5468\u53d8\u73b0\u201d\u7684\u8fc7\u9ad8\u671f\u671b**\u3002\u5c06\u76ee\u6807\u4ece\u201c\u5feb\u901f\u8d5a\u94b1\u201d\u5f15\u5bfc\u81f3\u201c\u6280\u80fd\u79ef\u7d2f\u201d\u3002\n    3.  **\u9700\u6c42\u805a\u7126**: \u786e\u8ba4\u5176\u5f53\u524d\u6838\u5fc3\u76ee\u6807\u662f\u201cAI\u89c6\u9891\u5546\u5355\u201d\u8fd8\u662f\u201c\u6709\u58f0\u6f14\u64ad\u201d\u3002\u5982\u662f\u540e\u8005\uff0c\u9700\u8bf4\u660e\u5f53\u524d\u8bfe\u7a0b\u7684\u76f8\u5173\u6027\u4e0e\u5c40\u9650\u6027\uff0c\u907f\u514d\u540e\u7eed\u56e0\u65b9\u5411\u4e0d\u7b26\u4ea7\u751f\u5931\u671b\u3002\n    4.  **\u8fdb\u5ea6\u5173\u6000**: \u56e0\u5176\u4e3a\u5b66\u751f\uff0c\u9700\u5173\u6ce8\u5176\u5b66\u4e1a\u4e0e\u8bfe\u7a0b\u7684\u65f6\u95f4\u5b89\u6392\uff0c\u63d0\u4f9b\u7075\u6d3b\u7684\u5b66\u4e60\u8fdb\u5ea6\u5efa\u8bae\uff0c\u907f\u514d\u56e0\u65f6\u95f4\u51b2\u7a81\u5bfc\u81f4\u6389\u961f\u3002\n    5.  **\u9f13\u52b1\u4e0e\u6b63\u53cd\u9988**: \u5229\u7528\u5176\u5b66\u4e60\u80fd\u529b\u8f83\u5f3a\u3001\u914d\u5408\u5ea6\u9ad8\u7684\u7279\u70b9\uff0c\u5728\u5176\u5b8c\u6210\u521d\u671f\u4f5c\u54c1\u65f6\u7ed9\u4e88\u5177\u4f53\u3001\u53ca\u65f6\u7684\u80af\u5b9a\uff0c\u5f3a\u5316\u5176\u5b66\u4e60\u6210\u5c31\u611f\uff0c\u5bf9\u51b2\u7eaf\u7cb9\u529f\u5229\u6027\u76ee\u6807\u53ef\u80fd\u5e26\u6765\u7684\u632b\u8d25\u611f\u3002\n\n{\"core_type\": \"T5 \u52a1\u5b9e\u63a2\u7d22\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"24h\u5185\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\uff0c\u6821\u6b63\u53d8\u73b0\u9884\u671f\"}";
