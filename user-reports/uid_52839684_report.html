    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n> **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4e3b\u8981\u53cd\u6620\u7528\u6237\u5f00\u8425\u540e\u7b2c\u4e00\u81f3\u4e09\u5468\u7684\u5b66\u4e60\u8ddf\u8fdb\u60c5\u51b5\uff0c**\u7f3a\u5931\u5173\u952e\u7684\u524d\u7aef\u8f6c\u5316\u3001\u652f\u4ed8\u3001\u5bb6\u5ead\u80cc\u666f\u3001\u804c\u4e1a\u4e0e\u6536\u5165\u3001\u62a5\u540d\u6838\u5fc3\u52a8\u673a\u7b49\u6df1\u5ea6\u4fe1\u606f**\u3002\u4ee5\u4e0b\u5206\u6790\u57fa\u4e8e\u6709\u9650\u7684\u4e92\u52a8\u884c\u4e3a\u6a21\u5f0f\u63a8\u65ad\uff0c\u5b58\u5728\u4e00\u5b9a\u4e0d\u786e\u5b9a\u6027\u3002\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 52839684 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-06 \u81f3 2026-03-21 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5317\u5317\u6155\u767d(\u5468\u7136) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u7cbe\u82f19\u671f\u8bfe\u7a0b (\u5177\u4f53\u4ef7\u683c\u672a\u77e5) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | [\u4fe1\u606f\u7f3a\u5931] |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u5de5\u4f5c\u95f4\u9699\u5b66\u4e60\uff0c\u9700\u534f\u8c03\u5de5\u4f5c\u65f6\u95f4\u542c\u8bfe) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | [\u4fe1\u606f\u7f3a\u5931] |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** (\u7f3a\u4e4f\u52a8\u673a\u3001\u652f\u4ed8\u3001\u5bb6\u5ead\u3001\u804c\u4e1a\u7b49\u5173\u952e\u4fe1\u606f) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34(\u4e2d)**\u3002\u7528\u6237\u8868\u73b0\u51fa\u8f83\u5f3a\u7684\u5b66\u4e60\u6295\u5165\u548c\u5174\u8da3\u63a2\u7d22\uff0c\u4e3b\u52a8\u542c\u5267\u3001\u8d2d\u4e70\u8bbe\u5907\u3001\u79ef\u6781\u4ea4\u4f5c\u4e1a\uff0c\u4f46\u804a\u5929\u4e2d\u672a\u660e\u786e\u63d0\u53ca\u53d8\u73b0\u76ee\u6807\u6216\u7ecf\u6d4e\u538b\u529b\uff0c\u52a8\u673a\u66f4\u504f\u5411\u201c\u5174\u8da3\u63a2\u7d22+\u6280\u80fd\u63d0\u5347\u201d\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u4e5f\u60f3\u64ad\u51fa\u90a3\u6837\u7684\u611f\u89c9\u3002[\u5472\u7259][\u5472\u7259][\u5472\u7259]\u201d (\u88ab\u4f18\u79c0\u6f14\u64ad\u5438\u5f15\uff0c\u8ffd\u6c42\u827a\u672f\u8868\u8fbe)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b06\u9ad8]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[**\u4e2d\u9ad8**] \u2014 \u4e3b\u52a8\u8d2d\u4e70\u68ee\u6d77\u585e\u5c14MK4\u4e13\u4e1a\u9ea6\u514b\u98ce\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u6d88\u8d39\u80fd\u529b\u548c\u4e3a\u5174\u8da3\u6295\u8d44\u7684\u610f\u613f\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[**\u4e2d**] \u2014 \u80fd\u5229\u7528\u5de5\u4f5c\u95f4\u9699\u5b66\u4e60\u3001\u4ea4\u4f5c\u4e1a\u3001\u542c\u56de\u653e\uff0c\u4f46\u9700\u8981\u534f\u8c03\u65f6\u95f4\uff0c\u975e\u5b8c\u5168\u81ea\u7531\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[**\u4fe1\u606f\u7f3a\u5931**] \u2014 \u65e0\u76f8\u5173\u4fe1\u606f\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9047\u5230\u95ee\u9898\uff08\u5982\u8bbe\u5907\u5b89\u88c5\u3001\u58f0\u97f3\u4e0d\u6ee1\u610f\uff09\u4f1a\u4e3b\u52a8\u5c1d\u8bd5\u89e3\u51b3\uff0c\u5bfb\u6c42\u65b9\u6cd5\uff08\u542c\u4f18\u79c0\u4e3b\u64ad\u3001\u8bf7\u6559\u73ed\u73ed\uff09\uff0c\u60c5\u7eea\u7a33\u5b9a\u79ef\u6781\uff0c\u4e92\u52a8\u4e2d\u5145\u6ee1\u201c\u7231\u4f60\u201d\u3001\u201c\u611f\u6069\u201d\u7b49\u6b63\u5411\u53cd\u9988\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u5b89\u597d\u4e86\u201d (\u8bbe\u5907\u5b89\u88c5\u9047\u5230\u95ee\u9898\u540e\u81ea\u884c\u89e3\u51b3)\uff1b> \u201c\u6211\u89c9\u5f97\u6548\u679c\u8fd8\u4e0d\u592a\u597d\uff0c\u611f\u60c5\u4e0d\u591f...\u4eca\u665a\u4e0a\u597d\u597d\u542c\u542c\u8bfe[\u5472\u7259]\u201d (\u81ea\u6211\u8bc4\u4f30\u540e\uff0c\u4e3b\u52a8\u5bfb\u6c42\u8bfe\u7a0b\u63d0\u5347)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u81ea\u6211\u58f0\u97f3\u548c\u8868\u8fbe\u80fd\u529b\u7684**\u4e0d\u81ea\u4fe1\u4e0e\u9ad8\u671f\u5f85**\uff0c\u6e34\u671b\u901a\u8fc7\u4e13\u4e1a\u5b66\u4e60\u83b7\u5f97\u8ba4\u53ef\uff0c\u5e76\u878d\u5165\u4e00\u4e2a\u79ef\u6781\u5411\u4e0a\u7684\u5b66\u4e60\u793e\u7fa4\uff08\u5317\u5bb6\u519b\uff09\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u8fdb\u9636\u5f15\u5bfc**\uff0c\u4ee5\u53ca\u5c06\u4ed6\u89c6\u4e3a\u201c\u4f18\u79c0\u5b66\u5458\u201d\u7684**\u5708\u5c42\u5f52\u5c5e\u611f**\u3002\u4ed6\u9700\u8981\u88ab\u770b\u89c1\u52aa\u529b\uff0c\u5e76\u76f8\u4fe1\u901a\u8fc7\u79ef\u7d2f\u80fd\u8fbe\u5230\u201c\u64ad\u51fa\u90a3\u6837\u611f\u89c9\u201d\u7684\u81ea\u6211\u5b9e\u73b0\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B \u7c7b** (\u9ad8\u6295\u5165\u3001\u9ad8\u914d\u5408\u3001\u76ee\u6807\u611f\u660e\u786e\u4f46\u975e\u6781\u7aef\u529f\u5229) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T3 \u6b7b\u78d5\u5b66\u9738\u578b** (\u914d\u5408\u5ea6\u9ad8\uff0c\u4e3b\u52a8\u63a2\u7d22\uff0c\u8ffd\u6c42\u6280\u80fd\u7cbe\u8fdb\uff0c\u6709\u5b8c\u7f8e\u4e3b\u4e49\u503e\u5411) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | [\u4fe1\u606f\u7f3a\u5931] |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u5de5\u4f5c\u4e0e\u5b66\u4e60\u65f6\u95f4\u51b2\u7a81\u52a0\u5267\uff0c\u5bfc\u81f4\u4f5c\u4e1a\u79ef\u538b\u3001\u76f4\u64ad\u8bfe\u65e0\u6cd5\u8ddf\u8fdb\u800c\u4ea7\u751f\u7126\u8651\u548c\u632b\u8d25\u611f\u3002** |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u95ee\u9898\u7834\u9632\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d\u4f4e** | \u82e5\u957f\u671f\u7ec3\u4e60\u540e\u81ea\u6211\u611f\u89c9\u8fdb\u6b65\u7f13\u6162\uff0c\u6216\u53d1\u73b0\u63a5\u5355\u53d8\u73b0\u95e8\u69db\u8fdc\u8d85\u9884\u671f\uff0c\u53ef\u80fd\u4ea7\u751f\u4ef7\u503c\u6000\u7591\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u8bfe\u7a0b\u4e2d\u540e\u671f\uff08\u7b2c4-6\u5468\uff09**\u3002\u5f53\u8bfe\u7a0b\u96be\u5ea6\u63d0\u5347\u3001\u4f5c\u4e1a\u91cf\u52a0\u5927\uff0c\u540c\u65f6\u5de5\u4f5c\u7e41\u5fd9\u65f6\uff0c\u5bb9\u6613\u56e0\u201c\u65f6\u95f4\u7cbe\u529b\u4e0d\u6d4e\u5bfc\u81f4\u5b66\u4e60\u6548\u679c\u505c\u6ede\u201d\u800c\u4ea7\u751f\u653e\u5f03\u5ff5\u5934\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5317\u5317\u770b\u5230\u4f60\u4e3a\u4e86\u58f0\u97f3\u66f4\u5b8c\u7f8e\u751a\u81f3\u53bb\u505a\u4e86\u624b\u672f\uff0c\u8fd9\u4efd\u6b7b\u78d5\u7684\u52b2\u513f\u592a\u8ba9\u4eba\u4f69\u670d\u4e86\uff01\u54b1\u4eec\u2018\u5317\u5bb6\u519b\u2019\u5c31\u9700\u8981\u4f60\u8fd9\u6837\u8ffd\u6c42\u6781\u81f4\u7684\u6218\u53cb\u3002\u522b\u62c5\u5fc3\u8fdb\u5ea6\uff0c\u4f60\u7684\u6bcf\u4e00\u6b65\u624e\u5b9e\u79ef\u7d2f\uff0c\u73ed\u73ed\u90fd\u770b\u5728\u773c\u91cc\uff0c\u54b1\u4eec\u4e00\u8d77\u628a\u57fa\u672c\u529f\u6253\u7262\uff0c\u4f60\u79bb\u2018\u64ad\u51fa\u90a3\u79cd\u611f\u89c9\u2019\u4e0d\u8fdc\u4e86\uff01\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u3002\u5339\u914d\u5176T3\u6b7b\u78d5\u5b66\u9738\u7279\u8d28\uff0c\u63d0\u4f9b\u7cfb\u7edf\u3001\u6df1\u5165\u3001\u6709\u6311\u6218\u6027\u7684\u8bad\u7ec3\u5185\u5bb9\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\u7279\u70b9\uff0c\u8865\u5145\u3010**\u7075\u6d3b\u65f6\u95f4\u7ba1\u7406\u5305**\u3011\uff08\u5982\u91cd\u70b9\u5f55\u64ad\u8bfe\u5207\u7247\u3001\u5f02\u6b65\u4f5c\u4e1a\u53cd\u9988\u901a\u9053\uff09\u3002\u9488\u5bf9\u5176\u8ffd\u6c42\u827a\u672f\u8868\u8fbe\uff0c\u53ef\u8865\u5145\u3010**\u9ad8\u9636\u8d4f\u6790\u4e0e\u62c6\u89e3\u5305**\u3011\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u5feb\u901f\u53d8\u73b0\u201d\u7684\u8bdd\u672f\u8fc7\u5ea6\u523a\u6fc0\uff0c\u8fd9\u53ef\u80fd\u4f1a\u7834\u574f\u5176\u6c89\u6d78\u5b66\u4e60\u7684\u5fc3\u6d41\u72b6\u6001\u3002\u907f\u514d\u5e03\u7f6e\u5927\u91cf\u4f4e\u4ef7\u503c\u7684\u91cd\u590d\u6027\u4f5c\u4e1a\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5f53\u5176\u6280\u80fd\u6709\u660e\u663e\u63d0\u5347\u5e76\u8868\u73b0\u51fa\u66f4\u9ad8\u9636\u7684\u5b66\u4e60\u6e34\u671b\u65f6\uff0c\u53ef\u4ee5\u63a8\u4ecb\u6df1\u5ea6\u6f14\u64ad\u6280\u5de7\u3001IP\u5b75\u5316\u6216\u5546\u4e1a\u63a5\u5355\u6307\u5bfc\u7c7b\u9ad8\u9636\u8bfe\u7a0b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5317\u5317 \u628a\u4eca\u5929\u65e9\u529f\u8bfe\u7684\u7ec3\u4e60\u6587\u672c\u53d1\u6211\u4e00\u4e0b\u201d **(\u4e3b\u52a8\u7d22\u53d6\u6750\u6599\uff0c\u5b66\u4e60\u9a71\u52a8\u6027\u5f3a)**\n2. > \u201c\u6211\u4e3a\u4e86\u81ea\u5df1\u7684\u9f3b\u97f3\uff0c\u8bf4\u8bdd\u6709\u70b9\u9f3b\u5b50\u547c\u5438\u4e0d\u7545\uff0c\u6628\u5929\u53bb\u505a\u4e86\u4e2a\u9f3b\u5b50\u7684\u5c0f\u624b\u672f...\u533b\u751f\u8bf4\u4e00\u4e2a\u661f\u671f\u540e\uff0c\u9f3b\u5b50\u4e0d\u5835\u4e86\uff0c\u58f0\u97f3\u80fd\u66f4\u6e05\u8106\u4e9b\u3002\u201d **(\u4e3a\u4f18\u5316\u5b66\u4e60\u6761\u4ef6\u8fdb\u884c\u8eab\u4f53\u6295\u5165\uff0c\u51b3\u5fc3\u6781\u5927)**\n3. > \u201c\u6536\u83b7\u5f88\u5927,\u6211\u89c9\u5f97\u90a3\u624d\u662f\u8bb2\u6545\u4e8b\u7684\u611f\u89c9...\u6211\u4e5f\u60f3\u64ad\u51fa\u90a3\u6837\u7684\u611f\u89c9\u3002[\u5472\u7259]\u201d **(\u88ab\u827a\u672f\u8868\u8fbe\u5438\u5f15\uff0c\u8ffd\u6c42\u81ea\u6211\u5b9e\u73b0\uff0c\u800c\u975e\u5355\u7eaf\u529f\u5229)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T3\u6b7b\u78d5\u5b66\u9738\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4f4e**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u6301\u7eed\u7684\u4e13\u4e1a\u6b63\u53cd\u9988\u548c\u7075\u6d3b\u7684\u65f6\u95f4\u652f\u6301\uff0c\u4fdd\u62a4\u5176\u5b66\u4e60\u5fc3\u6d41**\u3002\n\n```json\n{\"core_type\": \"T3 \u6b7b\u78d5\u5b66\u9738\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd/\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\"}\n```";
