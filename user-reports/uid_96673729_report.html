    <script>
        const markdownText = "**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u7f3a\u4e4f\u5173\u952e\u4fe1\u606f\uff1a\u7528\u6237\u5e74\u9f84\u3001\u6027\u522b\u3001\u57ce\u5e02\u3001\u804c\u4e1a\u3001\u6536\u5165\u3001\u5bb6\u5ead\u72b6\u51b5\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u3001\u5177\u4f53\u652f\u4ed8\u91d1\u989d\u4e0e\u65b9\u5f0f\u3001\u51b3\u7b56\u6d41\u7a0b\u7ec6\u8282\u3002\n\n---\n\n### **\u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a**\n\n#### **1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6**\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u4e2d\u7b49\u504f\u5de5\u5177\u6027**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u60f3\u7528ai\u505a\u8d26\u53f7\u201d\uff0c\u5bf9\u201c\u505a\u8d26\u53f7\u201d\u65b9\u5411\u611f\u5174\u8da3\uff0c\u5e76\u4e3b\u52a8\u8be2\u95ee\u201c\u81ea\u5a92\u4f53\u77e9\u9635\u201d\u7b49\u5b9e\u64cd\u95ee\u9898\uff0c\u663e\u793a\u51fa\u660e\u786e\u7684\u6280\u80fd\u83b7\u53d6\u548c\u526f\u4e1a\u53d8\u73b0\u610f\u56fe\u3002\u4f46\u52a8\u673a\u4e2d\u201c\u5174\u8da3\u201d\u6210\u5206\u4e0d\u660e\u663e\uff0c\u66f4\u504f\u5411\u4e8e\u5b9e\u7528\u4e3b\u4e49\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u6781\u4f4e**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u6211\u4e5f\u6ca1\u591a\u5c11\u94b1\u201d\u3001\u201c\u6211\u662f\u60f3\u5b66\u4f46\u662f\u6ca1\u6709\u672c\u91d1\u201d\u3001\u201c\u94b1\u4e0d\u592a\u591f\u201d\uff0c\u76f4\u63a5\u66b4\u9732\u4e86**\u4e25\u91cd\u7684\u7ecf\u6d4e\u7ea6\u675f**\u3002\u8fd9\u662f\u6700\u6838\u5fc3\u7684\u8d1f\u9762\u4fe1\u53f7\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u4e2d\u7b49**\u3002\u7528\u6237\u80fd\u5b8c\u6210\u4f5c\u4e1a\u3001\u8ddf\u8bfe\u3001\u4e92\u52a8\uff0c\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u914d\u5408\u5ea6\u4e0e\u6267\u884c\u529b\uff08\u201c\u5b8c\u6210\u4e86\u201d\u3001\u201c\u597d\u201d\u3001\u201c\u53ef\u4ee5\u201d\uff09\u3002\u4f46\u5728\u9762\u5bf9\u201c\u81ea\u5a92\u4f53\u77e9\u9635\u201d\u7684\u5b9e\u64cd\u56f0\u96be\u65f6\uff0c\u8868\u73b0\u51fa**\u8f7b\u5fae\u7684\u754f\u96be\u548c\u8d28\u7591**\uff08\u201c\u90a3\u4e5f\u4e0d\u65b9\u4fbf\u554a\u201d\u3001\u201c\u63d0\u73b0\u8fd8\u5f97\u662f\u522b\u4eba\u7684\u94f6\u884c\u5361\u201d\uff09\uff0c\u9700\u8981\u9500\u552e\u53cd\u590d\u89e3\u91ca\u5b89\u629a\uff0c\u97e7\u6027\u4e00\u822c\uff0c\u6613\u53d7\u73b0\u5b9e\u969c\u788d\u5f71\u54cd\u3002\n\n#### **2. ABCD\u5224\u5b9a\u6811**\n*   **\u6b65\u9aa40 (\u652f\u4ed8\u6838\u67e5)**: **\u672a\u5b8c\u6210\u652f\u4ed8**\u3002\u8bb0\u5f55\u6b62\u4e8e\u7528\u6237\u8868\u793a\u201c\u94b1\u4e0d\u592a\u591f\u201d\uff0c\u9500\u552e\u5f15\u5bfc\u6dfb\u52a0\u73ed\u4e3b\u4efb\u5fae\u4fe1\uff0c\u4f46**\u672a\u786e\u8ba4\u652f\u4ed8\u6210\u529f**\u3002**\u5173\u952e\u652f\u4ed8\u73af\u8282\u7f3a\u5931**\u3002\n*   **\u6b65\u9aa41.5 (\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5)**: **\u4fe1\u606f\u7f3a\u5931**\u3002\u65e0\u4efb\u4f55\u5173\u4e8e\u5bb6\u5ead\u3001\u914d\u5076\u3001\u5b50\u5973\u7684\u8ba8\u8bba\uff0c\u65e0\u6cd5\u5224\u65ad\u51b3\u7b56\u6743\u5f52\u5c5e\u3002\u7528\u6237\u8868\u73b0\u51fa\u72ec\u7acb\u7684\u51b3\u7b56\u610f\u5411\u3002\n*   **\u6700\u7ec8\u5224\u5b9a**: **D\u7c7b\uff08\u9ad8\u98ce\u9669\u89c2\u671b\u8005\uff09**\u3002\u6838\u5fc3\u7279\u5f81\uff1a**\u5f3a\u610f\u613f\uff08M\u4e2d\uff09 + \u5f31\u8d44\u6e90\uff08R\u6781\u4f4e\uff09**\u3002\u7528\u6237\u6709\u5b66\u4e60\u610f\u613f\u548c\u660e\u786e\u76ee\u6807\uff0c\u4f46**\u652f\u4ed8\u80fd\u529b\u662f\u6700\u5927\u77ed\u677f**\uff0c\u6781\u6613\u56e0\u7ecf\u6d4e\u538b\u529b\u653e\u5f03\u6216\u4ea7\u751f\u5f3a\u70c8\u540e\u6094\u60c5\u7eea\u3002\n\n#### **3. \u7528\u6237\u539f\u578b\u5339\u914d**\n*   **\u5339\u914d\u539f\u578b: T7 \u52a1\u5b9e\u6c42\u5b58\u578b**\n    *   **\u7279\u5f81**: \u76ee\u6807\u660e\u786e\uff08\u505a\u8d26\u53f7\u53d8\u73b0\uff09\uff0c\u6781\u5ea6\u5173\u6ce8\u6295\u5165\u4ea7\u51fa\u6bd4\u548c\u5b9e\u64cd\u53ef\u884c\u6027\uff0c\u5bf9\u201c\u672c\u91d1\u201d\u3001\u201c\u65b9\u4fbf\u6027\u201d\u7b49\u73b0\u5b9e\u6761\u4ef6\u654f\u611f\u3002\n    *   **\u6838\u5fc3\u8bc9\u6c42**: \u4f4e\u95e8\u69db\u3001\u5feb\u89c1\u6548\u3001\u80fd\u89e3\u51b3\u773c\u524d\u7ecf\u6d4e\u538b\u529b\u7684\u6280\u80fd\u3002\u5bf9\u201c\u753b\u997c\u201d\u548c\u8fdc\u671f\u627f\u8bfa\u4fe1\u4efb\u5ea6\u4f4e\u3002\n    *   **\u98ce\u9669**: **\u652f\u4ed8\u80fd\u529b\u4e0e\u8bfe\u7a0b\u4ef7\u683c\u4e0d\u5339\u914d**\u662f\u6838\u5fc3\u77db\u76fe\u3002\n\n#### **4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u98ce\u9669\u7b49\u7ea7: \u9ad8)**\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u6548\u679c\u4e0d\u53ca\u9884\u671f**: \u4e2d\u98ce\u9669\u3002\u7528\u6237\u76ee\u6807\u5177\u4f53\uff08\u505a\u8d26\u53f7\uff09\uff0c\u82e5\u521d\u671f\u89c1\u6548\u6162\uff0c\u6613\u5931\u671b\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**: **\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5df2\u660e\u786e\u8868\u8fbe\u7ecf\u6d4e\u56f0\u96be\uff0c\u5b66\u8d39\u53ef\u80fd\u6765\u81ea\u501f\u8d37\u6216\u6324\u538b\u5fc5\u8981\u5f00\u652f\uff0c\u652f\u4ed8\u540e\u540e\u6094\u6982\u7387\u6781\u9ad8\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**: \u4f4e\u98ce\u9669\u3002\u6682\u65e0\u4f53\u73b0\u3002\n    4.  **\u5185\u5bb9/\u670d\u52a1\u4e0d\u6ee1**: \u4e2d\u98ce\u9669\u3002\u7528\u6237\u5bf9\u201c\u73ed\u73ed\u201d\u8eab\u4efd\u63d0\u51fa\u8d28\u7591\uff08\u201c\u4f60\u4e0d\u662f\u8001\u5e08\u5417\uff1f\u6ca1\u5b66\u8fd9\u4e2a\uff1f\u201d\uff09\uff0c\u663e\u793a\u5176\u5bf9\u5e08\u8d44\u4e13\u4e1a\u5ea6\u6709\u8981\u6c42\uff0c\u82e5\u540e\u7eed\u670d\u52a1\u4e0d\u8fbe\u9884\u671f\u53ef\u80fd\u4e0d\u6ee1\u3002\n    5.  **\u9500\u552e\u8bef\u5bfc**: **\u4e2d\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u5728\u89e3\u91ca\u201c\u81ea\u5a92\u4f53\u77e9\u9635\u201d\u65f6\u5b58\u5728**\u8fc7\u5ea6\u7b80\u5316\u98ce\u9669\u548c\u5408\u89c4\u95ee\u9898**\uff08\u7528\u5bb6\u4eba\u8d26\u53f7\u3001\u526f\u5361\uff09\uff0c\u53ef\u80fd\u57cb\u4e0b\u8bef\u5bfc\u9690\u60a3\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9**: \u672a\u77e5\u98ce\u9669\u3002\u4fe1\u606f\u4e0d\u8db3\u3002\n    7.  **\u7ade\u54c1/\u66ff\u4ee3\u65b9\u6848**: \u4f4e\u98ce\u9669\u3002\u6682\u65e0\u4f53\u73b0\u3002\n\n#### **5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5**\n*   **\u4e3b\u8981\u96f7\u533a**:\n    *   **\u3010\u8d44\u6e90\u5938\u5927\u4e0e\u98ce\u9669\u9690\u7792\u3011**\uff1a\u9500\u552e\u5728\u56de\u5e94\u201c\u81ea\u5a92\u4f53\u77e9\u9635\u201d\u95ee\u9898\u65f6\uff08\u201c\u7528\u5bb6\u4eba\u670b\u53cb\u7684\uff0c\u5305\u62ec\u526f\u53f7\u8fd9\u4e9b\u90fd\u662f\u53ef\u4ee5\u7528\u7684\u54c8\u201d\uff09\uff0c**\u672a\u5145\u5206\u63d0\u793a\u591a\u8d26\u53f7\u8fd0\u8425\u7684\u5e73\u53f0\u89c4\u5219\u98ce\u9669\u548c\u4e2a\u4eba\u4fe1\u606f\u5408\u89c4\u98ce\u9669**\uff0c\u5b58\u5728\u8bef\u5bfc\u503e\u5411\u3002\n    *   **\u3010\u652f\u4ed8\u80fd\u529b\u5ffd\u89c6\u3011**\uff1a\u5728\u7528\u6237\u591a\u6b21\u660e\u786e\u8868\u793a\u201c\u6ca1\u94b1\u201d\u3001\u201c\u94b1\u4e0d\u591f\u201d\u540e\uff0c\u9500\u552e\u4ecd\u4ee5\u201c\u6015\u5565\u5462\u201d\u3001\u201c\u6295\u8d44\u81ea\u5df1\u201d\u7b49\u8bdd\u672f\u63a8\u52a8\uff0c**\u672a\u5ba1\u614e\u8bc4\u4f30\u7528\u6237\u771f\u5b9e\u507f\u4ed8\u80fd\u529b**\uff0c\u53ef\u80fd\u8bf1\u5bfc\u975e\u7406\u6027\u6d88\u8d39\u3002\n    *   **\u3010\u8fc7\u5ea6\u627f\u8bfa\u3011**\uff1a\u5f3a\u8c03\u201c\u5b66\u4e60\u7b2c\u4e8c\u5468\u5373\u5f00\u901a\u63a5\u5355\u6743\u9650\u201d\u3001\u201c\u5546\u535580-300/\u6bcf\u5206\u949f\u201d\u7b49\uff0c\u53ef\u80fd\u8425\u9020\u201c\u5feb\u901f\u66b4\u5bcc\u201d\u9884\u671f\uff0c\u4e0e\u5b9e\u9645\u5b66\u4e60\u66f2\u7ebf\u548c\u63a5\u5355\u96be\u5ea6\u53ef\u80fd\u5b58\u5728\u5dee\u8ddd\u3002\n\n#### **6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**\n*   **\u6838\u5fc3\u7b56\u7565**: **\u98ce\u9669\u7ba1\u63a7\u4f18\u5148\uff0c\u5f3a\u5316\u4ef7\u503c\u611f\u77e5\u4e0e\u4f4e\u95e8\u69db\u542f\u52a8**\u3002\n*   **\u884c\u52a8\u6307\u5357**:\n    1.  **\u652f\u4ed8\u524d\u6df1\u5ea6\u6c9f\u901a\uff08\u5fc5\u987b\u6267\u884c\uff09**: \u65b0\u73ed\u4e3b\u4efb\u63a5\u624b\u540e\uff0c**\u9996\u8981\u4efb\u52a1**\u662f\u8fdb\u884c\u4e00\u5bf9\u4e00\u6c9f\u901a\uff0c\u6e29\u548c\u63a2\u8be2\u7528\u6237\u7ecf\u6d4e\u72b6\u51b5\u3001\u5b66\u8d39\u6765\u6e90\uff08\u50a8\u84c4/\u501f\u8d37/\u5bb6\u5ead\u652f\u6301\uff09\uff0c**\u660e\u786e\u544a\u77e5\u5b66\u4e60\u5468\u671f\u3001\u89c1\u6548\u65f6\u95f4\u3001\u63a5\u5355\u7684\u771f\u5b9e\u95e8\u69db**\uff0c\u7ba1\u7406\u9884\u671f\u3002\n    2.  **\u805a\u7126\u6700\u5c0f\u53ef\u884c\u6027\u4ea7\u54c1\uff08MVP\uff09**: \u5f15\u5bfc\u7528\u6237\u5c06\u76ee\u6807\u4ece\u201c\u505a\u8d26\u53f7\u77e9\u9635\u201d\u62c6\u89e3\u4e3a\u201c\u5148\u505a\u51fa\u7b2c\u4e00\u4e2a\u6709\u6d41\u91cf\u7684AI\u89c6\u9891\u5355\u54c1\u201d\u3002\u5f3a\u8c03\u8bfe\u7a0b\u524d\u671f\u5c31\u80fd\u638c\u63e1\u7684\u3001\u53ef\u7acb\u5373\u5c1d\u8bd5\u53d8\u73b0\u7684\u8f7b\u91cf\u6280\u80fd\uff08\u5982\u56fe\u6587\u5e26\u8d27\u3001\u7b80\u5355\u5546\u5355\uff09\u3002\n    3.  **\u63d0\u4f9b\u8d22\u52a1\u67d4\u6027\u65b9\u6848**: \u5982\u5e73\u53f0\u6709\u5206\u671f\u3001\u5956\u5b66\u91d1\u3001\u6309\u6a21\u5757\u4ed8\u8d39\u7b49\u9009\u9879\uff0c\u5e94\u4f18\u5148\u63a8\u8350\u3002\u5982\u65e0\uff0c\u53ef\u5efa\u8bae\u7528\u6237\u4ece\u514d\u8d39/\u4f4e\u4ef7\u8d44\u6e90\u5f00\u59cb\u79ef\u7d2f\uff0c\u5efa\u7acb\u4fe1\u4efb\u3002\n    4.  **\u5f3a\u5316\u8fc7\u7a0b\u6fc0\u52b1\u4e0e\u5373\u65f6\u53cd\u9988**: \u5bf9\u8be5\u7528\u6237\u9700\u7ed9\u4e88\u66f4\u5bc6\u96c6\u7684\u4f5c\u4e1a\u70b9\u8bc4\u3001\u5c0f\u4efb\u52a1\u5956\u52b1\u548c\u6b63\u5411\u53cd\u9988\uff0c\u7528\u201c\u5c0f\u6210\u529f\u201d\u5bf9\u51b2\u5176\u7ecf\u6d4e\u538b\u529b\u5e26\u6765\u7684\u7126\u8651\u3002\n    5.  **\u5408\u89c4\u8bdd\u672f\u6821\u51c6**: \u540e\u7eed\u6c9f\u901a\u4e2d\uff0c\u6d89\u53ca\u8d26\u53f7\u3001\u63d0\u73b0\u3001\u89c4\u5219\u7b49\u95ee\u9898\uff0c\u5fc5\u987b\u8865\u5145\u5e73\u53f0\u5b98\u65b9\u89c4\u5219\u8bf4\u660e\uff0c\u907f\u514d\u627f\u8bfa\u65e0\u6cd5\u4fdd\u8bc1\u7684\u5b9e\u64cd\u8def\u5f84\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**:\n    *   **\u9996\u9009**: **\u201c\u8f7b\u91cf\u526f\u4e1a\u5165\u95e8\u5305\u201d\u6216\u201c\u5355\u6280\u80fd\u6a21\u5757\u8bfe\u201d**\u3002\u4ef7\u683c\u66f4\u4f4e\uff0c\u5468\u671f\u66f4\u77ed\uff0c\u80fd\u5feb\u901f\u9a8c\u8bc1\u5176\u5174\u8da3\u4e0e\u80fd\u529b\uff0c\u7b26\u5408\u5176\u201c\u52a1\u5b9e\u6c42\u5b58\u201d\u5fc3\u6001\u3002\n    *   **\u6b21\u9009**: \u82e5\u7528\u6237\u575a\u6301\u62a5\u540d\u7cfb\u7edf\u8bfe\uff0c\u5fc5\u987b**\u660e\u786e\u7b7e\u8ba2\u5b66\u4e60\u534f\u8bae\uff0c\u7a81\u51fa\u9000\u6b3e\u6761\u6b3e\u548c\u9636\u6bb5\u6027\u76ee\u6807**\uff0c\u5e76\u5efa\u8bae\u5176\u4ece\u6700\u57fa\u7840\u7684\u201cAI\u751f\u56fe\u63a5\u5355\u201d\u6a21\u5757\u5f00\u59cb\uff0c\u5feb\u901f\u89c1\u5230\u5fae\u6536\u76ca\uff0c\u5efa\u7acb\u4fe1\u5fc3\u3002\n\n---\n\n{\"core_type\": \"T7 \u52a1\u5b9e\u6c42\u5b58\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168/\u5c0a\u91cd\", \"target_product_line\": \"\u8f7b\u91cf\u526f\u4e1a\u5165\u95e8\u5305/\u5355\u6280\u80fd\u6a21\u5757\u8bfe\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}";
