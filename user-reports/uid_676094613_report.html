        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676094613 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u65b9\u52c7 (\u9500\u552e) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b (2\u4e2a\u6708\u7cbe\u82f1\u7248\uff0c\u4ef7\u683c\u672a\u660e\u793a) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u7528\u5361\u5468\u8f6c / \u88ab\u8feb\u5206\u671f** (\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u73b0\u5728\u624b\u91cc\u6ca1\u6709\u94b1\u3002\u5f97\u660e\u5929\u624d\u80fd\u4ea4\u4e0a\u3002\u201d\uff0c\u5e76\u4e3b\u52a8\u8be2\u95ee\u5206\u671f\u4ed8\u6b3e\u65b9\u5f0f) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u9500\u552e\u63d0\u53ca\u201c\u5b69\u5b50\u7761\u4e86\u4e4b\u540e\u62bd\u51fa\u6765\u4e94\u5206\u949f\u300110min\u300130min\u3001\u4e00\u4e2a\u5c0f\u65f6\u53bb\u5f55\u97f3\u201d\uff0c\u7528\u6237\u672a\u53cd\u9a73\u4e14\u8868\u793a\u60f3\u505a\u517c\u804c\u201c\u4e0d\u4f1a\u592a\u7d2f\u201d\uff0c\u6697\u793a\u65f6\u95f4\u6709\u9650\u4e14\u788e\u7247\u5316) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** (\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u6210\u5458\u6216\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\uff0c\u5b58\u5728\u98ce\u9669\u76f2\u533a) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** (\u7528\u6237\u53d1\u8a00\u6781\u5c11\uff0c\u591a\u4e3a\u88ab\u52a8\u56de\u5e94\uff0c\u5173\u952e\u4fe1\u606f\u5982\u804c\u4e1a\u3001\u5bb6\u5ead\u3001\u5177\u4f53\u7ecf\u6d4e\u72b6\u51b5\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u5747\u7f3a\u5931\uff0c\u5224\u65ad\u4f9d\u8d56\u9500\u552e\u5355\u65b9\u5f15\u5bfc\u548c\u7528\u6237\u5c11\u91cf\u53cd\u9988) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b07\u4f4e\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u7eaf\u4e3a\u51e0\u5929\u5185\u63d0\u73b0\u4fdd\u5e95\u800c\u6765(\u4f4e\u6781\u5371)**\u3002\u7528\u6237\u6838\u5fc3\u8bc9\u6c42\u662f\u201c\u517c\u804c\u201d\u3001\u201c\u4e0d\u4f1a\u592a\u7d2f\u201d\uff0c\u5bf9\u201c\u957f\u77e5\u8bc6\u201d\u3001\u201c\u7cbe\u795e\u4eab\u53d7\u201d\u7684\u8868\u8ff0\u66f4\u50cf\u662f\u9644\u548c\u9500\u552e\u8bdd\u672f\u3002\u5176\u6240\u6709\u4e92\u52a8\u5747\u56f4\u7ed5\u201c\u62a5\u540d\u201d\u3001\u201c\u4ea4\u94b1\u201d\u3001\u201c\u64cd\u4f5c\u201d\u7b49\u6d41\u7a0b\u6027\u95ee\u9898\uff0c\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u3001\u6280\u80fd\u63d0\u5347\u672c\u8eab\u65e0\u4efb\u4f55\u4e3b\u52a8\u63d0\u95ee\u6216\u63a2\u8ba8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08\u60a8\u597d\uff01\u6211\u60f3\u505a\u517c\u804c\u7684\u3002\u4e0d\u4f1a\u592a\u7d2f\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u660e\u786e\u8868\u793a\u201c\u73b0\u5728\u624b\u91cc\u6ca1\u6709\u94b1\u3002\u5f97\u660e\u5929\u624d\u80fd\u4ea4\u4e0a\u3002\u201d\uff0c\u5e76\u4e3b\u52a8\u8be2\u95ee\u5206\u671f\u4ed8\u6b3e\u3002\u652f\u4ed8\u80fd\u529b\u7d27\u5f20\uff0c\u5b58\u5728\u501f\u8d37\u6216\u52a8\u7528\u5468\u8f6c\u8d44\u91d1\u7684\u98ce\u9669\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u63a5\u53d7\u201c\u788e\u7247\u5316\u65f6\u95f4\u201d\u5b66\u4e60\u7684\u8bbe\u5b9a\uff0c\u8868\u660e\u6709\u517c\u804c\u610f\u613f\u548c\u4e00\u5b9a\u65f6\u95f4\u89c4\u5212\uff0c\u4f46\u201c\u4e0d\u4f1a\u592a\u7d2f\u201d\u4e5f\u6697\u793a\u7cbe\u529b\u6295\u5165\u6709\u9650\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931 (\u6309\u4f4e\u98ce\u9669\u5904\u7406)** \u2014 \u804a\u5929\u8bb0\u5f55\u5b8c\u5168\u672a\u63d0\u53ca\u5bb6\u5ead\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\u3002**\u6b64\u7ef4\u5ea6\u4fe1\u606f\u7f3a\u5931\u662f\u91cd\u5927\u98ce\u9669\u70b9**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u7528\u6237\u8868\u73b0\u51fa\u6781\u5f3a\u7684**\u6280\u672f\u64cd\u4f5c\u4f9d\u8d56\u548c\u4f4e\u81ea\u4e3b\u6027**\uff1a\u591a\u6b21\u8be2\u95ee\u201c\u65c1\u767d\u4f5c\u4e1a\u5728\u54ea\u91cc\u627e\u201d\u3001\u201c\u4f5c\u4e1a\u5c0f\u7a0b\u5e8f\u5230\u54ea\u91cc\u53bb\u627e\u201d\u3001\u201c\u70b9\u786e\u8ba4\uff0c\u70b9\u4e0d\u5f00\u201d\u3001\u201c\u5f80\u4e0b\u6211\u4e0d\u4f1a\u64cd\u4f5c\u4e86\u201d\u3002\u9762\u5bf9\u6700\u7b80\u5355\u7684\u7cfb\u7edf\u64cd\u4f5c\u90fd\u8868\u73b0\u51fa\u65e0\u52a9\u548c\u4f9d\u8d56\uff0c\u4e00\u65e6\u8fdb\u5165\u6b63\u5f0f\u5b66\u4e60\uff0c\u9762\u5bf9\u66f4\u590d\u6742\u7684\u8f6f\u4ef6\u3001\u6280\u5de7\u548c\u4f5c\u4e1a\u538b\u529b\uff0c\u6781\u6613\u56e0\u632b\u8d25\u611f\u800c\u653e\u5f03\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08\uff0c\u6211\u4e0d\u4f1a\u64cd\u4f5c\u3002\u201d > \u201c\u8001\u5e08\uff0c\u4f5c\u4e1a\u5c0f\u7a0b\u5e8f\u5230\u54ea\u91cc\u53bb\u627e\u554a\uff1f\u201d > \u201c\u70b9\u786e\u8ba4\uff0c\u70b9\u4e0d\u5f00\u3002\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c (\u5b89\u5168\u9700\u6c42)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u81ea\u8eab\u80fd\u529b\u6781\u5ea6\u4e0d\u81ea\u4fe1\uff0c\u4e14\u7f3a\u4e4f\u72ec\u7acb\u89e3\u51b3\u95ee\u9898\u7684\u57fa\u672c\u80fd\u529b**\u3002\u4ed6\u5bfb\u6c42\u7684\u5e76\u975e\u201c\u81ea\u6211\u5b9e\u73b0\u201d\u6216\u201c\u5c0a\u91cd\u201d\uff0c\u800c\u662f\u4e00\u4e2a**\u4f4e\u98ce\u9669\u3001\u4f4e\u95e8\u69db\u3001\u6709\u660e\u786e\u4fdd\u5e95\u627f\u8bfa\u7684\u201c\u5b89\u5168\u6e2f\u6e7e\u201d**\uff0c\u4ee5\u7f13\u89e3\u5bf9\u672a\u77e5\u9886\u57df\uff08\u6709\u58f0\u884c\u4e1a\uff09\u548c\u81ea\u8eab\u80fd\u529b\u7684\u7126\u8651\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4fdd\u59c6\u5f0f\u7684\u3001\u65e0\u5fae\u4e0d\u81f3\u7684\u201c\u624b\u628a\u624b\u201d\u6307\u5bfc\u4e0e\u5373\u65f6\u80af\u5b9a**\u3002\u4ed6\u9700\u8981\u88ab\u660e\u786e\u544a\u77e5\u6bcf\u4e00\u6b65\u8be5\u600e\u4e48\u505a\uff0c\u5e76\u5728\u5b8c\u6210\u6700\u7b80\u5355\u52a8\u4f5c\u540e\u83b7\u5f97\u5938\u5f20\u7684\u8d5e\u7f8e\uff0c\u4ee5\u7ef4\u6301\u5176\u8106\u5f31\u7684\u5b66\u4e60\u52a8\u529b\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2 \u7c7b** (\u52a8\u673a\u7eaf\u5ea6\u4f4e + \u8d44\u6e90\u5e95\u5ea7\u5b58\u5728\u77ed\u677f + \u5fc3\u7406\u5f39\u6027\u6781\u4f4e) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u5178\u578b\u7279\u5f81\uff1a\u4f4e\u81ea\u4e3b\u6027\u3001\u9ad8\u4f9d\u8d56\u3001\u6613\u56e0\u64cd\u4f5c\u56f0\u96be\u7b49\u5c0f\u4e8b\u7834\u9632\u3001\u8ffd\u6c42\u201c\u4e0d\u7d2f\u201d\u7684\u7b80\u5355\u53d8\u73b0) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u867d\u8d44\u91d1\u7d27\u5f20\u5e76\u8be2\u95ee\u5206\u671f\uff0c\u4f46\u672a\u63d0\u53ca\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5ead\u53cd\u5bf9)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a/\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u82e5\u62a5\u540d\u52a8\u7528\u5bb6\u5ead\u50a8\u5907\u91d1\u6216\u5bb6\u4eba\u4e0d\u77e5\u60c5\uff0c\u98ce\u9669\u9aa4\u589e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | \u6b63\u5f0f\u5f00\u8bfe\u540e\uff0c\u9762\u5bf9\u590d\u6742\u7684\u8f6f\u4ef6\u5b89\u88c5\u3001\u4f5c\u4e1a\u63d0\u4ea4\u3001\u5f55\u97f3\u526a\u8f91\u7b49\u64cd\u4f5c\uff0c\u4f1a\u56e0\u201c\u4e0d\u4f1a\u64cd\u4f5c\u201d\u800c\u8fc5\u901f\u79ef\u7d2f\u632b\u8d25\u611f\uff0c\u9009\u62e9\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u4efb\u4f55\u8d85\u51fa\u5176\u7406\u89e3\u8303\u56f4\u7684\u6280\u672f\u6b65\u9aa4\u3001\u7b2c\u4e00\u6b21\u4f5c\u4e1a\u7684\u8d1f\u9762\u53cd\u9988\u3001\u751a\u81f3\u53ea\u662f\u627e\u4e0d\u5230\u8bfe\u7a0b\u5165\u53e3\uff0c\u90fd\u53ef\u80fd\u6210\u4e3a\u5176\u60c5\u7eea\u5d29\u6e83\u5e76\u7533\u8bf7\u9000\u8d39\u7684\u76f4\u63a5\u5bfc\u706b\u7d22\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | \u5bf9\u201c\u517c\u804c\u201d\u3001\u201c\u4e0d\u4f1a\u592a\u7d2f\u201d\u6709\u5e7b\u60f3\uff0c\u4e00\u65e6\u53d1\u73b0\u5b66\u4e60\u9700\u8981\u6295\u5165\u7cbe\u529b\u3001\u63a5\u5355\u9700\u8981\u7ade\u4e89\uff0c\u4f1a\u7acb\u523b\u611f\u5230\u88ab\u6b3a\u9a97\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c\u4e00\u5468\uff0c\u9996\u6b21\u72ec\u7acb\u5b8c\u6210\u8f6f\u4ef6\u5b89\u88c5\u6216\u63d0\u4ea4\u590d\u6742\u4f5c\u4e1a\u65f6**\u3002\u9884\u8ba1\u5728\u63a5\u89e6\u5b9e\u9645\u5b66\u4e60\u5de5\u5177\u768448\u5c0f\u65f6\u5185\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u540c\u5b66\u4f60\u597d\uff01\u6211\u662f\u4f60\u7684\u4e13\u5c5e\u73ed\u4e3b\u4efb[\u540d\u5b57]\u3002\u6211\u77e5\u9053\u521a\u5f00\u59cb\u63a5\u89e6\u65b0\u4e1c\u897f\u603b\u4f1a\u6709\u70b9\u61f5\uff0c\u522b\u62c5\u5fc3\uff0c\u54b1\u4eec\u4e0d\u7740\u6025\u3002\u4f60\u53ea\u9700\u8981\u8ddf\u7740\u6211\uff0c\u6211\u8ba9\u4f60\u70b9\u54ea\u91cc\u4f60\u5c31\u70b9\u54ea\u91cc\uff0c\u8ba9\u4f60\u5f55\u4ec0\u4e48\u4f60\u5c31\u5f55\u4ec0\u4e48\uff0c\u5176\u4ed6\u590d\u6742\u7684\u90fd\u4ea4\u7ed9\u6211\u3002\u54b1\u4eec\u7684\u76ee\u6807\u5c31\u662f\u8f7b\u677e\u8d77\u6b65\uff0c\u5148\u4eab\u53d7\u5f55\u97f3\u7684\u4e50\u8da3\uff0c\u4f60\u6bcf\u5b8c\u6210\u4e00\u5c0f\u6b65\uff0c\u6211\u90fd\u4f1a\u4e3a\u4f60\u70b9\u8d5e\uff01\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\u3011** (\u6838\u5fc3\u76ee\u6807\u4e0d\u662f\u6280\u80fd\u63d0\u5347\uff0c\u800c\u662f\u7ef4\u6301\u5176\u4e0d\u8131\u8425)\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u3010\u50bb\u74dc\u5f0f\u64cd\u4f5c\u6307\u5f15\u5305\u3011** (\u56fe\u6587\u5e76\u8302\u3001\u4e00\u6b65\u4e00\u622a\u56fe)\u3001**\u3010\u6bcf\u65e5\u5fae\u5c0f\u6210\u5c31\u6253\u5361\u5305\u3011** (\u5b8c\u6210\u767b\u5f55\u3001\u542c5\u5206\u949f\u8bfe\u7b49\u5373\u53ef\u6253\u5361\u83b7\u8d5e)\u3001**\u3010\u5f3a\u60c5\u7eea\u5b89\u629a\u5305\u3011** (\u73ed\u4e3b\u4efb\u9ad8\u9891\u3001\u5938\u5f20\u7684\u6b63\u9762\u53cd\u9988)\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9T6\u5e03\u7f6e\u4efb\u4f55\u6709\u96be\u5ea6\u7684\u4f5c\u4e1a\u6216\u63d0\u51fa\u6280\u672f\u6027\u8981\u6c42**\u3002\n    2. **\u7edd\u4e0d\u5728\u5176\u9762\u524d\u63d0\u53ca\u5176\u4ed6\u5b66\u5458\u7684\u5feb\u901f\u8fdb\u6b65\u6216\u9ad8\u989d\u6536\u5165\u6848\u4f8b**\u3002\n    3. **\u7edd\u4e0d\u4f7f\u7528\u4efb\u4f55\u4e13\u4e1a\u672f\u8bed\u6c9f\u901a\uff0c\u5168\u90e8\u8f6c\u5316\u4e3a\u201c\u70b9\u8fd9\u91cc\u201d\u3001\u201c\u542c\u8fd9\u4e2a\u201d\u3001\u201c\u8bf4\u4e00\u53e5\u201d\u7b49\u6307\u4ee4**\u3002\n    4. **\u7edd\u4e0d\u50ac\u4fc3\u5176\u5b66\u4e60\u8fdb\u5ea6\uff0c\u53ea\u9f13\u52b1\u5176\u201c\u53c2\u4e0e\u201d\u884c\u4e3a**\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u6b64\u7528\u6237\u4e3a\u6781\u9ad8\u6d41\u5931\u98ce\u9669\u7528\u6237\uff0c\u5f53\u524d\u552f\u4e00\u76ee\u6807\u662f\u5e73\u7a33\u5b8c\u6210\u670d\u52a1\u5468\u671f\uff0c\u907f\u514d\u6295\u8bc9\u3002\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u4f1a\u52a0\u5267\u5176\u7ecf\u6d4e\u538b\u529b\u548c\u9884\u671f\uff0c\u5bfc\u81f4\u63d0\u524d\u5d29\u76d8\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u8001\u5e08\u60a8\u597d\uff01\u6211\u60f3\u505a\u517c\u804c\u7684\u3002\u4e0d\u4f1a\u592a\u7d2f\u3002\u201d **(\u4f4e\u7eaf\u5ea6\u52a8\u673a\u4e0e\u4f4e\u6295\u5165\u610f\u613f)**\n2. > \u201c\u73b0\u5728\u624b\u91cc\u6ca1\u6709\u94b1\u3002\u5f97\u660e\u5929\u624d\u80fd\u4ea4\u4e0a\u3002\u201d **(\u8d44\u6e90\u5e95\u5ea7\u77ed\u677f-\u8d44\u91d1\u7d27\u5f20)**\n3. > \u201c\u8001\u5e08\uff0c\u6211\u4e0d\u4f1a\u64cd\u4f5c\u3002\u201d & \u201c\u70b9\u786e\u8ba4\uff0c\u70b9\u4e0d\u5f00\u3002\u201d **(\u5fc3\u7406\u5f39\u6027\u6781\u4f4e\uff0c\u64cd\u4f5c\u4f9d\u8d56\u6027\u5f3a\uff0c\u6613\u7834\u9632)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u9700\u6c42\u2014\u2014\u5bfb\u6c42\u4e00\u4e2a\u65e0\u9700\u52a8\u8111\u3001\u65e0\u632b\u6298\u7684\u201c\u5b89\u5168\u201d\u517c\u804c\u5e7b\u60f3\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u50bb\u74dc\u5f0f\u3001\u6b65\u6b65\u8ddf\u8fdb\u7684\u201c\u624b\u628a\u624b\u201d\u6559\u5b66\u4e0e\u9ad8\u9891\u60c5\u7eea\u5b89\u629a\uff0c\u5265\u79bb\u4e00\u5207\u6311\u6218\u6027\u4efb\u52a1\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
