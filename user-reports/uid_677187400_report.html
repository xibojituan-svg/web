    <script>
        const markdownText = "\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e\u3002\u7f3a\u4e4f\u652f\u4ed8\u884c\u4e3a\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u3001\u5177\u4f53\u8d44\u6e90\u72b6\u51b5\u3001\u6df1\u5ea6\u9700\u6c42\u8868\u8fbe\u7b49\u4fe1\u606f\u3002\n\n# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u4e2d\u7b49\u504f\u5de5\u5177\u6027**\u3002\u660e\u786e\u9009\u62e9\u201c1.\u60f3\u53d1\u5c55\u517c\u804c\uff0c\u526f\u4e1a\u53d8\u73b0\u201d\uff0c\u76ee\u6807\u4e3a\u7ecf\u6d4e\u6536\u5165\u3002\u5bf9AI\u5de5\u5177\u5df2\u6709\u4f7f\u7528\u7ecf\u9a8c\uff0c\u80fd\u751f\u6210\u8f83\u590d\u6742\u7684\u63d0\u793a\u8bcd\uff0c\u663e\u793a\u4e00\u5b9a\u5174\u8da3\u4e0e\u57fa\u7840\u3002\u4f46\u672a\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u5185\u5728\u70ed\u60c5\u6216\u957f\u671f\u804c\u4e1a\u89c4\u5212\uff0c\u52a8\u673a\u504f\u5411\u77ed\u671f\u751f\u5b58\u4e0e\u53d8\u73b0\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u8f83\u4f4e**\u300227\u5c81\uff0c\u5f85\u4e1a\u72b6\u6001\uff0c**\u7ecf\u6d4e\u57fa\u7840\u8584\u5f31\uff0c\u65e0\u7a33\u5b9a\u6536\u5165**\u3002\u65f6\u95f4\u8d44\u6e90\u770b\u4f3c\u5145\u8db3\uff08\u80fd\u8ddf\u8bfe\u3001\u4ea4\u4f5c\u4e1a\uff09\uff0c\u4f46\u5b66\u4e60\u8bbe\u5907/\u5de5\u5177\u4f9d\u8d56\u7f51\u76d8\u7b49\u514d\u8d39\u8d44\u6e90\u3002\u793e\u4f1a\u8d44\u6e90\uff08\u884c\u4e1a\u4eba\u8109\u3001\u6307\u5bfc\uff09\u4e3b\u8981\u4f9d\u8d56\u8bfe\u7a0b\u65b9\u63d0\u4f9b\u3002**\u5173\u952e\u77ed\u677f\uff1a\u7ecf\u6d4e\u538b\u529b\u5927\uff0c\u6297\u98ce\u9669\u80fd\u529b\u4f4e**\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u4e2d\u7b49\u504f\u4e0a**\u3002\u6c9f\u901a\u914d\u5408\u5ea6\u9ad8\uff0c\u80fd\u6309\u65f6\u5b8c\u6210\u6307\u4ee4\uff08\u9884\u7ea6\u3001\u8fdb\u7fa4\u3001\u4ea4\u4f5c\u4e1a\uff09\u3002\u4e3b\u52a8\u8be2\u95ee\u76f4\u64ad\u94fe\u63a5\u3001\u7f51\u76d8\u683c\u5f0f\uff0c\u663e\u793a\u4e00\u5b9a\u81ea\u4e3b\u6027\u548c\u8ddf\u8fdb\u610f\u613f\u3002\u5bf9\u201c3980\u201d\u4ef7\u683c\u672a\u8868\u73b0\u51fa\u660e\u663e\u4ef7\u683c\u654f\u611f\u6216\u72b9\u8c6b\uff0c\u884c\u52a8\u8f83\u5feb\uff0c\u4f46\u53ef\u80fd\u9690\u542b**\u51b2\u52a8\u51b3\u7b56**\u98ce\u9669\u3002\u6574\u4f53\u8868\u73b0\u987a\u4ece\u3001\u79ef\u6781\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u4e3b\u52a8\u53d1\u51fa\u201c3980\u201d\u5e76\u5b8c\u6210\u652f\u4ed8\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u5bb6\u5ead\u6216\u4f34\u4fa3\u610f\u89c1\uff0c\u7528\u6237\u4e3a27\u5c81\u6210\u5e74\u5973\u6027\uff0c\u6682\u89c6\u4e3a\u72ec\u7acb\u51b3\u7b56\u3002\n*   **\u6b65\u9aa41 - \u9700\u6c42\u7d27\u8feb\u6027**: **\u9ad8**\u3002\u5f85\u4e1a\u72b6\u6001\uff0c\u5bfb\u6c42\u517c\u804c\u53d8\u73b0\uff0c\u751f\u5b58\u538b\u529b\u9a71\u52a8\uff0c\u9700\u6c42\u7d27\u8feb\u3002\n*   **\u6b65\u9aa42 - \u652f\u4ed8\u80fd\u529b**: **\u4f4e**\u3002\u5f85\u4e1a\u72b6\u6001\uff0c\u652f\u4ed83980\u5143\u8bfe\u7a0b\u6b3e\u53ef\u80fd\u52a8\u7528\u5b58\u6b3e\u6216\u501f\u8d37\uff0c**\u652f\u4ed8\u80fd\u529b\u4e0e\u8bfe\u7a0b\u4ef7\u683c\u5b58\u5728\u660e\u663e\u5f20\u529b**\u3002\n*   **\u6b65\u9aa43 - \u51b3\u7b56\u6a21\u5f0f**: **\u504f\u611f\u6027/\u4ece\u4f17**\u3002\u5728\u9500\u552e\u5bc6\u96c6\u6e32\u67d3\u201c\u8d44\u6e90\u201d\u3001\u201c\u63a5\u5355\u201d\u3001\u201c\u98ce\u53e3\u201d\u3001\u201c\u798f\u5229\u201d\u540e\u5feb\u901f\u51b3\u7b56\uff0c\u7f3a\u4e4f\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u3001\u5408\u540c\u6761\u6b3e\u3001\u53d8\u73b0\u53ef\u884c\u6027\u7684\u7406\u6027\u6c42\u8bc1\u3002\n*   **\u6b65\u9aa44 - \u884c\u52a8\u529b**: **\u9ad8**\u3002\u80fd\u8ddf\u8fdb\u8bfe\u7a0b\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u4e3b\u52a8\u8be2\u95ee\uff0c\u521d\u671f\u884c\u52a8\u529b\u5f3a\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**: **B-\u578b (\u9ad8\u7d27\u8feb-\u4f4e\u652f\u4ed8\u529b-\u611f\u6027\u51b3\u7b56)**\u3002\u5f3a\u9700\u6c42\u9a71\u52a8\uff0c\u4f46\u7ecf\u6d4e\u57fa\u7840\u4e0e\u8bfe\u7a0b\u6295\u5165\u4e0d\u5339\u914d\uff0c\u51b3\u7b56\u53ef\u80fd\u57fa\u4e8e\u5bf9\u201c\u5feb\u901f\u53d8\u73b0\u201d\u7684\u8fc7\u5ea6\u4e50\u89c2\u9884\u671f\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u6838\u5fc3\u539f\u578b**: **T3 \u751f\u5b58\u7126\u8651\u578b**\u3002\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u89e3\u51b3\u5f85\u4e1a\u72b6\u6001\u4e0b\u7684\u7ecf\u6d4e\u538b\u529b\uff0c\u5bfb\u6c42\u53ef\u5feb\u901f\u4e0a\u624b\u7684\u53d8\u73b0\u6280\u80fd\u3002\u5bf9\u201c\u8d44\u6e90\u201d\u548c\u201c\u63a5\u5355\u201d\u627f\u8bfa\u9ad8\u5ea6\u654f\u611f\u3002\n*   **\u6b21\u8981\u7279\u5f81**: \u5e26\u6709 **T5 \u8d44\u6e90\u89c5\u98df\u578b** \u8272\u5f69\uff0c\u5bf9\u9500\u552e\u63d0\u4f9b\u7684\u201c\u7f51\u76d8\u8d44\u6599\u201d\u3001\u201c\u63d0\u793a\u8bcd\u201d\u3001\u201c\u63a5\u5355\u6e20\u9053\u201d\u7b49\u5177\u4f53\u8d44\u6e90\u8868\u73b0\u51fa\u63a5\u6536\u548c\u5174\u8da3\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669**: **\u9ad8**\u3002B-\u578b\u7528\u6237\u662f\u9000\u8d39\u9ad8\u53d1\u533a\u3002\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**: **\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u671f\u5f85\u201c\u517c\u804c\u526f\u4e1a\u53d8\u73b0\u201d\uff0c\u82e5\u8bfe\u7a0b\u7ed3\u675f\u540e\u63a5\u5355\u56f0\u96be\u3001\u6536\u5165\u5fae\u8584\uff0c\u6781\u6613\u5f15\u53d1\u201c\u865a\u5047\u5ba3\u4f20\u201d\u6295\u8bc9\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**: **\u9ad8\u98ce\u9669**\u3002\u5f85\u4e1a\u72b6\u6001\u652f\u4ed8\u8fd14000\u5143\uff0c\u82e5\u77ed\u671f\u5185\u65e0\u6cd5\u4ea7\u751f\u6536\u5165\uff0c\u7ecf\u6d4e\u538b\u529b\u4f1a\u8fc5\u901f\u8f6c\u5316\u4e3a\u9000\u8d39\u8bc9\u6c42\u3002\n    3.  **\u8bfe\u7a0b\u8d28\u91cf**: **\u4e2d\u98ce\u9669**\u3002\u53d6\u51b3\u4e8e\u540e\u7eed\u8bfe\u7a0b\u4ea4\u4ed8\u662f\u5426\u4e0e\u5ba3\u4f20\u7684\u201c\u5b9e\u64cd\u201d\u3001\u201c\u966a\u8dd1\u201d\u3001\u201c\u6d3e\u5355\u201d\u5339\u914d\u3002\n    4.  **\u670d\u52a1\u4f53\u9a8c**: **\u4e2d\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u5bf9\u9500\u552e\u670d\u52a1\u54cd\u5e94\u79ef\u6781\uff0c\u4f46\u82e5\u4ed8\u8d39\u540e\u670d\u52a1\u964d\u7ea7\u6216\u201c\u6d3e\u5355\u201d\u627f\u8bfa\u672a\u5151\u73b0\uff0c\u98ce\u9669\u5347\u9ad8\u3002\n    5.  **\u5b66\u4e60\u96be\u5ea6**: **\u4f4e\u98ce\u9669**\u3002\u7528\u6237\u5df2\u5c55\u793a\u4e00\u5b9aAI\u4f7f\u7528\u57fa\u7840\u548c\u5b66\u4e60\u914d\u5408\u5ea6\u3002\n    6.  **\u65f6\u95f4\u51b2\u7a81**: **\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u65f6\u95f4\u770b\u4f3c\u5145\u88d5\u3002\n    7.  **\u5bb6\u5ead\u53cd\u5bf9**: **\u672a\u77e5\u98ce\u9669**\u3002\u4fe1\u606f\u4e0d\u8db3\uff0c\u9700\u540e\u7eed\u5173\u6ce8\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u98ce\u9669\u70b9**:\n    1.  **\u8fc7\u5ea6\u627f\u8bfa**: \u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u63a5\u5355\u8d44\u6e90\u201d\u3001\u201c\u591a\u6e20\u9053\u53d8\u73b0\u201d\u3001\u201c\u7b2c\u4e8c\u5468\u5f00\u901a\u63a5\u5355\u6743\u9650\u201d\u3001\u201c\u8fb9\u5b66\u4e60\u8fb9\u63a5\u5355\u201d\uff0c**\u53ef\u80fd\u8425\u9020\u4e0d\u5207\u5b9e\u9645\u7684\u6536\u5165\u9884\u671f**\uff0c\u6d89\u5acc\u8fc7\u5ea6\u627f\u8bfa\u3002\n    2.  **\u5229\u7528\u7126\u8651**: \u9488\u5bf9\u5f85\u4e1a\u7528\u6237\u7684\u751f\u5b58\u7126\u8651\u8fdb\u884c\u8425\u9500\uff0c\u867d\u5c5e\u5e38\u89c1\uff0c\u4f46\u9700\u8b66\u60d5\u662f\u5426\u5938\u5927\u884c\u4e1a\u95e8\u69db\u4e0e\u53d8\u73b0\u96be\u5ea6\u3002\n    3.  **\u4fe1\u606f\u8f70\u70b8\u4e0e\u4ece\u4f17\u5f15\u5bfc**: \u4f7f\u7528\u201c\u540d\u989d\u6709\u9650\u201d\u3001\u201c\u62bd\u5956\u201d\u3001\u201c\u559c\u62a5\u201d\u7b49\u7b56\u7565\uff0c\u53ef\u80fd\u4fc3\u4f7f\u611f\u6027\u51b3\u7b56\u3002\n    4.  **\u5408\u540c\u4e0e\u6761\u6b3e\u62ab\u9732**: \u8bb0\u5f55\u4e2d\u672a\u89c1\u5bf9\u8bfe\u7a0b\u5408\u540c\u3001\u9000\u6b3e\u653f\u7b56\u7b49\u5173\u952e\u6761\u6b3e\u7684\u4e3b\u52a8\u8bf4\u660e\u4e0e\u786e\u8ba4\uff0c**\u5b58\u5728\u5408\u89c4\u9690\u60a3**\u3002\n*   **\u7ed3\u8bba**: \u9500\u552e\u8fc7\u7a0b\u5b58\u5728**\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u672a\u5145\u5206\u62ab\u9732\u98ce\u9669**\u7684\u5408\u89c4\u98ce\u9669\uff0c\u6613\u5f15\u53d1\u540e\u7eed\u4e89\u8bae\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6838\u5fc3\u7b56\u7565**: **\u5feb\u901f\u5efa\u7acb\u4fe1\u4efb + \u7ba1\u7406\u9884\u671f + \u63d0\u4f9b\u5373\u65f6\u4ef7\u503c**\u3002\n*   **\u884c\u52a8\u6307\u5357**:\n    1.  **\u4ed8\u8d39\u540e\u9ec4\u91d124\u5c0f\u65f6**: \u7acb\u5373\u6df1\u5ea6\u6c9f\u901a\uff0c\u4e86\u89e3\u5176\u5177\u4f53\u7ecf\u6d4e\u72b6\u51b5\u3001\u5b66\u4e60\u8bbe\u5907\u3001\u6bcf\u65e5\u53ef\u6295\u5165\u65f6\u95f4\uff0c**\u59d4\u5a49\u7ba1\u7406\u6536\u5165\u9884\u671f**\uff0c\u5f3a\u8c03\u6280\u80fd\u79ef\u7d2f\u5468\u671f\u3002\n    2.  **\u5f3a\u5316\u8fc7\u7a0b\u6fc0\u52b1**: \u5bf9\u5176\u4f5c\u4e1a\u5b8c\u6210\u3001\u4e92\u52a8\u7ed9\u4e88\u53ca\u65f6\u3001\u5177\u4f53\u7684\u8868\u626c\uff0c\u5c06\u5176\u201c\u914d\u5408\u5ea6\u9ad8\u201d\u7684\u4f18\u52bf\u8f6c\u5316\u4e3a\u5b66\u4e60\u6210\u5c31\u611f\u3002\n    3.  **\u63d0\u4f9b\u201c\u5c0f\u80dc\u201d\u4f53\u9a8c**: \u5c3d\u5feb\u5f15\u5bfc\u5176\u5b8c\u6210\u4e00\u4e2a\u6781\u7b80\u7684\u53ef\u53d1\u5e03\u4f5c\u54c1\uff08\u5982\u56fe\u6587\uff09\uff0c\u6216\u4ecb\u7ecd\u4e00\u4e2a\u95e8\u69db\u6781\u4f4e\u7684\u5fae\u4efb\u52a1\uff08\u5982\u6d4b\u8bd5\u5355\uff09\uff0c**\u54ea\u6015\u6536\u76ca\u6781\u4f4e**\uff0c\u65e8\u5728\u5efa\u7acb\u201c\u5b66\u6709\u6240\u7528\u201d\u7684\u521d\u6b65\u4fe1\u5fc3\u3002\n    4.  **\u900f\u660e\u5316\u63a5\u5355\u8def\u5f84**: \u6e05\u6670\u8bf4\u660e\u5e73\u53f0\u63a5\u5355\u89c4\u5219\u3001\u8bc4\u5ba1\u6807\u51c6\u3001\u7ade\u4e89\u60c5\u51b5\uff0c\u907f\u514d\u8ba9\u5176\u4ea7\u751f\u201c\u4ed8\u8d39\u5373\u4fdd\u5e95\u201d\u7684\u8bef\u89e3\u3002\n    5.  **\u91cd\u70b9\u5173\u6ce8\u60c5\u7eea\u4e0e\u7ecf\u6d4e\u6ce2\u52a8**: \u6b64\u7528\u6237\u7c7b\u578b\u5728\u9047\u5230\u5b66\u4e60\u74f6\u9888\u6216\u63a5\u5355\u4e0d\u987a\u65f6\uff0c\u5bb9\u6613\u4ea7\u751f\u5f3a\u70c8\u632b\u8d25\u611f\u548c\u7ecf\u6d4e\u7126\u8651\uff0c\u9700\u63d0\u524d\u5e72\u9884\uff0c\u63d0\u4f9b\u60c5\u611f\u652f\u6301\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**:\n    *   **\u4e3b\u7ebf**: \u6302\u8f7d**\u6280\u80fd\u5b9e\u6218\u578b\u4e50\u9ad8\u7ebf**\uff0c\u5f3a\u8c03\u201c\u6280\u80fd-\u4f5c\u54c1-\u63a5\u5355\u201d\u7684\u95ed\u73af\u8bad\u7ec3\u3002\n    *   **\u589e\u8d2d/\u7eed\u8d39**: \u77ed\u671f\u5185\u8c28\u614e\u63a8\u8350\u9ad8\u4ef7\u8fdb\u9636\u8bfe\u3002\u53ef\u8003\u8651**\u4f4e\u4ef7\u3001\u9ad8\u9891\u7387\u7684\u8f7b\u54a8\u8be2\u6216\u7d20\u6750\u5e93\u670d\u52a1**\uff0c\u4f5c\u4e3a\u5176\u53d8\u73b0\u8fc7\u7a0b\u4e2d\u7684\u201c\u5de5\u5177\u5305\u201d\uff0c\u5951\u5408\u5176\u201c\u8d44\u6e90\u89c5\u98df\u201d\u7279\u6027\uff0c\u4e14\u7ecf\u6d4e\u538b\u529b\u5c0f\u3002\n    *   **\u8b66\u60d5**: **\u7edd\u5bf9\u907f\u514d\u63a8\u8350\u4efb\u4f55\u9700\u8981\u989d\u5916\u5927\u989d\u6295\u5165\uff08\u5982\u8bbe\u5907\u3001\u8f6f\u4ef6\u4f1a\u5458\uff09\u6216\u627f\u8bfa\u201c\u4fdd\u5e95\u6536\u5165\u201d\u7684\u4ea7\u54c1**\u3002\n\n{\"core_type\": \"T3 \u751f\u5b58\u7126\u8651\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168/\u751f\u5b58\", \"target_product_line\": \"\u6280\u80fd\u5b9e\u6218\u578b\u4e50\u9ad8\u7ebf\", \"age\": \"27\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}";
