    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4f5c\u4e3a\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677164169 (\u6635\u79f0: \u9648\u66e6) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-11 (\u4f53\u9a8c\u8425\u8f6c\u5316\u671f) |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5b98\u65b9\u52a9\u6559-\u68a6\u5883(\u4e8e\u53cc\u53cc) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u7cbe\u82f1\u73ed (2\u4e2a\u6708\u8bfe\u7a0b\uff0c\u4ef7\u683c\u672a\u660e\u793a\uff0c\u4f46\u63d0\u53ca\u201c7380\u201d\uff0c\u63a8\u6d4b\u4e3a\u603b\u4ef7\u6216\u9ad8\u9636\u73ed\u4ef7\u683c) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u5168\u6b3e\u5145\u88d5** (\u7528\u6237\u4e3b\u52a8\u8be2\u95ee\u4ef7\u683c\uff0c\u8868\u793a\u201c\u53ef\u4ee5\u63a5\u53d7\u201d\u540e\u76f4\u63a5\u652f\u4ed8\uff0c\u65e0\u5206\u671f\u3001\u501f\u6b3e\u4fe1\u53f7) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u7528\u6237\u80fd\u6309\u65f6\u5b8c\u6210\u6668\u7ec3\u3001\u542c\u8bfe\u3001\u63d0\u4ea4\u4f5c\u4e1a\uff0c\u4f46\u672a\u63d0\u53ca\u5177\u4f53\u804c\u4e1a\u6216\u65f6\u95f4\u5b89\u6392\uff0c\u63a8\u6d4b\u4e3a\u4e0a\u73ed\u65cf\u6216\u65f6\u95f4\u76f8\u5bf9\u53ef\u63a7\u7684\u81ea\u7531\u804c\u4e1a\u8005) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** (\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u5bb6\u5ead\u652f\u6301\u5ea6\u4fe1\u606f) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** (\u7528\u6237\u4e92\u52a8\u79ef\u6781\uff0c\u8868\u8fbe\u6e05\u6670\uff0c\u4fe1\u606f\u5145\u8db3) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u9664\u4e86\u63a5\u5355\u8d5a\u94b1\uff0c\u9996\u5148\u60f3\u8981\u6539\u53d8\u58f0\u7ebf\u201d\uff0c\u8868\u660e\u5176\u52a8\u673a\u662f**\u6280\u80fd\u63d0\u5347\uff08\u6539\u53d8\u58f0\u7ebf\uff09\u4e0e\u53d8\u73b0\uff08\u63a5\u5355\uff09\u7684\u6df7\u5408\u4f53**\u3002\u5bf9\u8bfe\u7a0b\u8d39\u7528\u3001\u57f9\u8bad\u65b9\u6848\u3001\u6027\u4ef7\u6bd4\u3001\u5168\u6d41\u7a0b\u64cd\u4f5c\u65b9\u6cd5\u8868\u73b0\u51fa\u9ad8\u5ea6\u5173\u6ce8\u548c\u7406\u6027\u8bc4\u4f30\uff0c\u800c\u975e\u5355\u7eaf\u8ffd\u6c42\u201c\u51e0\u5929\u5185\u63d0\u73b0\u201d\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u9996\u5148\u60f3\u8981\u6539\u53d8\u58f0\u7ebf\u201d\n  > \u201c\u57f9\u8bad\u8d39\u7528\u662f\u591a\u5c11\u5440\u201d\n  > \u201c\u6bd4\u8f83\u4e0d\u9519\u7684\u517c\u804c\u673a\u4f1a\uff0c\u4f46\u4e5f\u60f3\u4e86\u89e3\u4e00\u4e0b\u6027\u4ef7\u6bd4\u201d\n  > \u201c\u82e5\u53c2\u4e0e\uff0c\u5e0c\u671b\u80fd\u8bbe\u4e00\u4e2a\u76ee\u6807\uff0c\u638c\u63e1\u5168\u6d41\u7a0b\u7684\u64cd\u4f5c\u65b9\u6cd5\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d (6\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 **\u8d44\u91d1\u627f\u8f7d\u529b**\uff1a**\u4e2d** \u2014 \u80fd\u76f4\u63a5\u652f\u4ed8\u8bfe\u7a0b\u8d39\u7528\uff08\u201c\u53ef\u4ee5\u63a5\u53d7\u201d\uff09\uff0c\u672a\u8868\u73b0\u51fa\u7ecf\u6d4e\u538b\u529b\u6216\u501f\u8d37\u8ff9\u8c61\uff0c\u4f46\u4f1a\u5ba1\u614e\u8bc4\u4f30\u6027\u4ef7\u6bd4\u3002\n- \u23f1 **\u65f6\u95f4\u4e0e\u7cbe\u529b**\uff1a**\u4e2d** \u2014 \u80fd\u8ddf\u4e0a\u4f53\u9a8c\u8425\u8282\u594f\uff0c\u6309\u65f6\u5b8c\u6210\u6240\u6709\u4efb\u52a1\uff08\u6668\u7ec3\u3001\u542c\u8bfe\u3001\u63d0\u4ea4\u4f5c\u4e1a\uff09\uff0c\u8868\u73b0\u51fa\u8f83\u597d\u7684\u6267\u884c\u529b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 **\u5bb6\u5ead\u652f\u6301\u5ea6**\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff0c\u65e0\u6cd5\u5224\u65ad\u3002**\u6b64\u9879\u4e3a\u77ed\u677f\uff0c\u9700\u540e\u7eed\u6838\u67e5**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8 (8\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3**\u3002\u9762\u5bf9\u9500\u552e\u7684\u4e13\u4e1a\u70b9\u8bc4\u548c\u5efa\u8bae\uff08\u5982\u6c14\u606f\u3001\u5bf9\u8c61\u611f\uff09\uff0c\u7528\u6237\u6001\u5ea6\u79ef\u6781\uff0c\u8868\u793a\u611f\u8c22\u5e76\u613f\u610f\u7ec3\u4e60\uff08\u201c\u8c22\u8c22\u5206\u4eab\uff0c\u6211\u4f1a\u597d\u597d\u7ec3\u4e60\u201d\uff09\u3002\u5728\u63d0\u51fa\u5bf9\u57f9\u8bad\u6a21\u5f0f\u7684\u6df1\u5ea6\u8d28\u7591\u65f6\uff08\u201c\u53ef\u80fd\u8fd9\u4e2a\u4eba\u5176\u5b9e\u4e0d\u9002\u5408\uff0c\u4f46\u4f60\u4eec\u4f1a\u6709\u5f88\u591a\u5bf9\u7b56\u5438\u5f15\u5176\u53c2\u4e0e\u201d\uff09\uff0c**\u903b\u8f91\u6e05\u6670\u3001\u8868\u8fbe\u7406\u6027\uff0c\u6ca1\u6709\u60c5\u7eea\u5316\u62b1\u6028\u6216\u81ea\u6211\u5426\u5b9a**\uff0c\u800c\u662f\u5bfb\u6c42\u89e3\u91ca\u548c\u786e\u8ba4\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u8c22\u8c22\u5206\u4eab\uff0c\u6211\u4f1a\u597d\u597d\u7ec3\u4e60\uff0c\u671f\u5f85\u6539\u53d8[\u7231\u5fc3]\u201d\n  > \u201c\u6c34\u6df1\u6c34\u6d45\u8bd5\u4e86\u624d\u77e5\u9053[\u62f3\u5934][\u62f3\u5934]\u201d **(\u4f53\u73b0\u63a2\u7d22\u548c\u627f\u62c5\u98ce\u9669\u7684\u5fc3\u6001)**\n  > \u5bf9\u57f9\u8bad\u6a21\u5f0f\u7684\u8d28\u7591\u539f\u6587\uff0c\u5c55\u73b0\u4e86**\u6279\u5224\u6027\u601d\u7ef4\u548c\u98ce\u9669\u9632\u8303\u610f\u8bc6**\uff0c\u800c\u975e\u8106\u5f31\u7834\u9632\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 (Esteem Needs)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u81ea\u8eab\u80fd\u529b\u5728\u964c\u751f\u9886\u57df\uff08\u6709\u58f0\u6f14\u64ad\uff09\u7684**\u4e0d\u786e\u5b9a\u6027\u548c\u4ef7\u503c\u9a8c\u8bc1\u7684\u6e34\u671b**\u3002\u4ed6\u9700\u8981\u8bc1\u660e\u81ea\u5df1\u4e0d\u4ec5\u80fd\u5b66\u4f1a\uff0c\u8fd8\u80fd\u638c\u63e1\u201c\u5168\u6d41\u7a0b\u64cd\u4f5c\u65b9\u6cd5\u201d\uff0c\u751a\u81f3\u4ece\u201c\u6280\u672f\u6d3e\u6253\u5de5\u8005\u201d\u601d\u7ef4\u5347\u7ea7\u5230\u201c\u8d44\u6e90\u534f\u8c03\u8005\u201d\u7684\u5c42\u9762\uff0c\u4ee5\u83b7\u5f97\u4e13\u4e1a\u4e0a\u7684\u8ba4\u53ef\u548c\u5c0a\u91cd\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u6e05\u6670\u7684\u6210\u957f\u8def\u5f84\u56fe**\u3002\u4ed6\u4e0d\u9700\u8981\u9e21\u6c64\u5f0f\u5b89\u6170\uff0c\u800c\u662f\u9700\u8981\u88ab\u8ba4\u53ef\u4e3a\u201c\u6709\u6f5c\u529b\u3001\u6709\u60f3\u6cd5\u201d\u7684\u7406\u6027\u5b66\u4e60\u8005\uff0c\u5e76\u770b\u5230\u4e00\u6761\u4ece\u6280\u672f\u5230\u8d44\u6e90\u6574\u5408\u7684\u53ef\u5b9e\u73b0\u8def\u5f84\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u9ad8\u52a8\u673a\u7eaf\u5ea6\u3001\u9ad8\u6267\u884c\u529b\u3001\u7406\u6027\u52a1\u5b9e) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 **\u5b89\u5168\u672a\u89e6\u53d1**\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u65e0\u6781\u7aef\u8a00\u8bba\u3001\u65e0\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n**\u5224\u5b9a\u6811\u8def\u5f84\u56de\u6eaf**\uff1a\n1.  **\u652f\u4ed8\u6838\u67e5**\uff1a\u7528\u6237\u4e3b\u52a8\u8be2\u95ee\u4ef7\u683c\u540e\u76f4\u63a5\u652f\u4ed8\uff0c\u65e0\u5206\u671f/\u501f\u8d37\u4fe1\u53f7\uff0c**\u901a\u8fc7**\u3002\n2.  **\u4e09\u8f74\u8bc4\u5206**\uff1a\u52a8\u673a\u7eaf\u5ea6(6\u5206/\u4e2d)\u3001\u8d44\u6e90\u5e95\u5ea7(6\u5206/\u4e2d)\u3001\u5fc3\u7406\u5f39\u6027(8\u5206/\u9ad8)\u3002\n3.  **\u5224\u5b9a\u6811\u5339\u914d**\uff1a\u52a8\u673a\u22655\u5206\uff0c\u5f39\u6027\u22657\u5206\uff08\u9ad8\u5f39\u6027\u901a\u9053\uff09\u3002\u7528\u6237\u672a\u8868\u73b0\u51fa\u4e3b\u52a8\u7edf\u7b79\u884c\u4e3a(T1)\u6216\u6df1\u5ea6\u6280\u672f\u8ffd\u95ee(T3)\uff0c\u4e5f\u672a\u8868\u73b0\u51fa\u9ad8\u9891\u793e\u4ea4(T7)\u3002**\u6839\u636e\u5224\u5b9a\u6811\u7b2c\u4e09\u5c42\u5206\u652fA\u7684\u515c\u5e95\u903b\u8f91**\uff1a\u201c\u4ee5\u4e0a\u5747\u672a\u547d\u4e2d\u7684\u9ad8\u52a8\u673a\u3001\u9ad8\u5f39\u6027\u7528\u6237 \u2192 \u9ed8\u8ba4\u5f52\u7c7b\u4e3a T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u201d\u3002\n4.  **ABCD\u6620\u5c04**\uff1aT2 \u2192 B\u7c7b\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4f4e** | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u7528\u6237\u51b3\u7b56\u7406\u6027\u72ec\u7acb\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u548c\u6267\u884c\u529b\u5df2\u521d\u6b65\u9a8c\u8bc1\uff0c\u98ce\u9669\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u7406\u6027\u52a1\u5b9e\uff0c\u4e0d\u6613\u56e0\u5b66\u4e60\u632b\u6298\u60c5\u7eea\u5d29\u6e83\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u4e2d** | **\u8fd9\u662f\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u7528\u6237\u5bf9\u201c\u6027\u4ef7\u6bd4\u201d\u3001\u201c\u5168\u6d41\u7a0b\u638c\u63e1\u201d\u3001\u201c2\u4e2a\u6708\u6548\u679c\u201d\u6709\u660e\u786e\u9884\u671f\u3002\u82e5\u8bfe\u7a0b\u4ea4\u4ed8\u65e0\u6cd5\u6ee1\u8db3\u5176\u201c\u638c\u63e1\u65b9\u6cd5\u8bba\u201d\u548c\u201c\u770b\u5230\u660e\u786e\u8fdb\u6b65\u201d\u7684\u7406\u6027\u76ee\u6807\uff0c\u53ef\u80fd\u56e0\u201c\u4ef7\u503c\u672a\u8fbe\u9884\u671f\u201d\u800c\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c4-8\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u82e5\u7528\u6237\u611f\u89c9\u6280\u80fd\u63d0\u5347\u7f13\u6162\u3001\u63a5\u5355\u65e0\u671b\u6216\u8bfe\u7a0b\u5185\u5bb9\u4e0e\u201c\u5168\u6d41\u7a0b\u64cd\u4f5c\u201d\u9884\u671f\u4e0d\u7b26\uff0c\u7406\u6027\u8bc4\u4f30\u540e\u53ef\u80fd\u9009\u62e9\u9000\u51fa\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u9648\u66e6\uff0c\u770b\u5230\u4f60\u5728\u4f53\u9a8c\u8425\u671f\u95f4\u5bf9\u5168\u6d41\u7a0b\u64cd\u4f5c\u548c\u804c\u4e1a\u8def\u5f84\u601d\u8003\u5f97\u975e\u5e38\u6df1\u5165\uff0c\u8fd9\u4efd\u8ba4\u771f\u548c\u8fdc\u89c1\u5f88\u96be\u5f97\u3002\u63a5\u4e0b\u6765\u7684\u7cbe\u82f1\u73ed\uff0c\u6211\u4f1a\u91cd\u70b9\u5e2e\u4f60\u62c6\u89e3\u4ece\u2018\u4f1a\u8bfb\u2019\u5230\u2018\u4f1a\u505a\u9879\u76ee\u2019\u7684\u6bcf\u4e00\u6b65\uff0c\u7ed9\u4f60\u6e05\u6670\u7684\u91cc\u7a0b\u7891\u548c\u5b9e\u6218\u673a\u4f1a\u3002\u54b1\u4eec\u4e0d\u641e\u865a\u7684\uff0c\u5c31\u8e0f\u8e0f\u5b9e\u5b9e\u628a\u4f60\u60f3\u638c\u63e1\u7684\u65b9\u6cd5\u8bba\u843d\u5730\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** (\u4ea7\u54c1\u7ebfA)\u3002\u5339\u914d\u5176\u8ffd\u6c42\u6280\u80fd\u7cbe\u8fdb\u548c\u638c\u63e1\u65b9\u6cd5\u8bba\u7684\u6838\u5fc3\u9700\u6c42\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n  1.  **\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011(B\u6a21\u5757)**\uff1a\u9488\u5bf9\u5176\u7406\u6027\u3001\u597d\u5b66\u7684\u7279\u70b9\uff0c\u63d0\u4f9b\u66f4\u6df1\u5ea6\u7684\u6280\u672f\u539f\u7406\u89e3\u7b54\u548c1v1\u7b54\u7591\u673a\u4f1a\u3002\n  2.  **\u3010\u9879\u76ee\u5236\u5b9e\u6218\u4efb\u52a1\u5305\u3011(B\u6a21\u5757)**\uff1a\u5c3d\u65e9\u5b89\u6392\u5176\u53c2\u4e0e\u5c0f\u578b\u5267\u7ec4\u4efb\u52a1\uff08\u5982\u753b\u672c\u3001\u5bf9\u8f68\uff09\uff0c\u6ee1\u8db3\u5176\u201c\u638c\u63e1\u5168\u6d41\u7a0b\u201d\u7684\u8bc9\u6c42\uff0c\u5e76\u5efa\u7acb\u6b63\u5411\u53cd\u9988\u3002\n  3.  **\u3010\u9636\u6bb5\u6027\u6210\u957f\u590d\u76d8\u3011(\u8f7b\u91cfC\u6a21\u5757)**\uff1a\u5b9a\u671f\uff08\u5982\u6bcf\u4e24\u5468\uff09\u8fdb\u884c1v1\u590d\u76d8\uff0c\u7528\u6570\u636e\u548c\u4f5c\u54c1\u5bf9\u6bd4\u5c55\u793a\u5176\u8fdb\u6b65\uff0c\u5f3a\u5316\u5176\u201c\u9009\u62e9\u6b63\u786e\u201d\u7684\u8ba4\u77e5\uff0c**\u62b5\u5fa1\u6536\u76ca\u843d\u5dee\u98ce\u9669**\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n  1.  \u7528\u201c\u5b9d\u5988\u9006\u88ad\u201d\u3001\u201c\u6708\u5165\u8fc7\u4e07\u201d\u7b49\u611f\u6027\u6848\u4f8b\u5bf9\u5176\u8fdb\u884c\u8f70\u70b8\u5f0f\u63a8\u9500\u3002**\u4ed6\u9700\u8981\u7684\u662f\u903b\u8f91\u548c\u8def\u5f84\uff0c\u4e0d\u662f\u6545\u4e8b**\u3002\n  2.  \u7ed9\u51fa\u6a21\u7cca\u3001\u65e0\u6cd5\u91cf\u5316\u7684\u627f\u8bfa\u3002\u6240\u6709\u5173\u4e8e\u6210\u957f\u5468\u671f\u3001\u63a5\u5355\u53ef\u80fd\u6027\u7684\u63cf\u8ff0\u5fc5\u987b\u5177\u4f53\u3001\u6709\u4f9d\u636e\u3002\n  3.  \u5ffd\u89c6\u6216\u6577\u884d\u5176\u5173\u4e8e\u8bfe\u7a0b\u4f53\u7cfb\u3001\u6559\u5b66\u65b9\u6cd5\u7684\u6df1\u5ea6\u63d0\u95ee\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u8fdb\u884c\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u5fc5\u987b\u4e0e\u6e05\u6670\u7684\u6280\u80fd\u8fdb\u9636\u8def\u5f84\u548c\u8d44\u6e90\u5bf9\u63a5\u84dd\u56fe\u7ed1\u5b9a**\u3002\u4f8b\u5982\uff0c\u5728\u7cbe\u82f1\u73ed\u4e2d\u671f\uff0c\u5f53\u5176\u638c\u63e1\u57fa\u7840\u6280\u80fd\u540e\uff0c\u53ef\u57fa\u4e8e\u5176\u201c\u7edf\u7b79\u534f\u8c03\u201d\u7684\u5174\u8da3\uff0c\u63a8\u4ecb\u9ad8\u9636\u7684\u5267\u7ec4\u7ba1\u7406\u6216\u5236\u4f5c\u4eba\u8bfe\u7a0b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > **\u201c\u9996\u5148\u60f3\u8981\u6539\u53d8\u58f0\u7ebf\u201d** \u2014\u2014 \u660e\u786e\u6280\u80fd\u63d0\u5347\u52a8\u673a\uff0c\u975e\u7eaf\u53d8\u73b0\u9a71\u52a8\u3002\n2. > **\u201c\u57f9\u8bad\u8ddf\u8bc1\u4e66\u662f\u4e00\u8d77\u7684\u5417\u201d\u3001\u201c\u6bd4\u8f83\u4e0d\u9519\u7684\u517c\u804c\u673a\u4f1a\uff0c\u4f46\u4e5f\u60f3\u4e86\u89e3\u4e00\u4e0b\u6027\u4ef7\u6bd4\u201d** \u2014\u2014 \u5178\u578b\u7406\u6027\u8bc4\u4f30\u8005\uff0c\u5173\u6ce8\u6295\u5165\u4ea7\u51fa\u6bd4\u548c\u4ea7\u54c1\u7ec6\u8282\u3002\n3. > **\u201c\u82e5\u53c2\u4e0e\uff0c\u5e0c\u671b\u80fd\u8bbe\u4e00\u4e2a\u76ee\u6807\uff0c\u638c\u63e1\u5168\u6d41\u7a0b\u7684\u64cd\u4f5c\u65b9\u6cd5\u3002\u76ee\u524d\u89c9\u5f97\u7edf\u7b79\uff0c\u753b\u672c\uff0c\u5ba1\u542c\uff0c\u5bf9\u8f68\u76f8\u5bf9\u81ea\u7531\u3001\u5bb9\u6613\u5165\u624b\uff0c\u540e\u671f\uff0c\u7f8e\u5de5\u6ea2\u4ef7\u66f4\u9ad8\uff0c\u5f55\u4e66\u786e\u5b9e\u9700\u8981\u5b66\u4e60\u3002\u201d** \u2014\u2014 **\u6838\u5fc3\u5224\u65ad\u4f9d\u636e**\u3002\u5c55\u73b0\u4e86\u6e05\u6670\u7684\u89c4\u5212\u80fd\u529b\u3001\u5bf9\u884c\u4e1a\u5206\u5de5\u7684\u8ba4\u77e5\u3001\u4ee5\u53ca\u4ece\u6267\u884c\u8005\u5411\u7ba1\u7406\u8005/\u8d44\u6e90\u6574\u5408\u8005\u601d\u7ef4\u7684\u8dc3\u8fc1\u503e\u5411\uff0c\u5fc3\u7406\u5f39\u6027\u548c\u8ba4\u77e5\u6c34\u5e73\u6781\u9ad8\u3002\n4. > **\u201c\u6c34\u6df1\u6c34\u6d45\u8bd5\u4e86\u624d\u77e5\u9053[\u62f3\u5934][\u62f3\u5934]\u201d** \u2014\u2014 \u4f53\u73b0\u884c\u52a8\u529b\u548c\u98ce\u9669\u627f\u62c5\u610f\u8bc6\uff0c\u975e\u754f\u9996\u754f\u5c3e\u578b\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4e0e\u53ef\u9a8c\u8bc1\u7684\u6210\u957f\u8def\u5f84\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u4e3b\u8981\u98ce\u9669\u6765\u81ea **\u3010\u8bfe\u7a0b\u4ef7\u503c\u672a\u8fbe\u5176\u7406\u6027\u9884\u671f\u3011**\u3002\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u91cf\u5316\u7684\u6210\u957f\u5730\u56fe\u4e0e\u65e9\u671f\u5b9e\u6218\u673a\u4f1a\uff0c\u7528\u4e8b\u5b9e\u6ee1\u8db3\u5176\u201c\u638c\u63e1\u5168\u6d41\u7a0b\u201d\u7684\u76ee\u6807\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\"}\n```";
