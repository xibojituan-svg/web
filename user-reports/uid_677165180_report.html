    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677165180\uff08\u6635\u79f0\uff1a\u5361\u5361\uff09\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677165180 / \u6635\u79f0\uff1a\u5361\u5361 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e - \u7490\u5996\u6709\u58f0(\u5f90\u7490) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u7cfb\u7edf\u8bfe\uff08\u4ef7\u683c\uff1a2380\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u652f\u4ed8\uff08\u201c\u652f\u4ed8\u5b8c\u6210\u4e86\u201d\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u4e2d\u7b49\u5bbd\u88d5\uff08\u80fd\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0ePia\u620f\uff0c\u672a\u63d0\u53ca\u65f6\u95f4\u7d27\u5f20\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u7f3a\u5931\uff08\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e2d\u7b49\uff08\u4e92\u52a8\u79ef\u6781\uff0c\u4f46\u6df1\u5ea6\u4e2a\u4eba\u4fe1\u606f\u5982\u5e74\u9f84\u3001\u804c\u4e1a\u3001\u5bb6\u5ead\u80cc\u666f\u7f3a\u5931\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u5174\u8da3\u4e0e\u53d8\u73b0\u76ee\u7684\u6df7\u5408\u3002\u5bf9\u6709\u58f0\u884c\u4e1a\u201c\u5f88\u6709\u672a\u6765\u201d\u8868\u793a\u8ba4\u53ef\uff0c\u79ef\u6781\u53c2\u4e0e\u8bd5\u97f3\u63a5\u5355\uff0c\u4f46\u540c\u65f6\u4e5f\u4eab\u53d7\u5b66\u4e60\u8fc7\u7a0b\uff08\u5982Pia\u620f\u201c\u5f88\u597d\u73a9\u201d\uff09\u3002\u672a\u8868\u73b0\u51fa\u6781\u901f\u53d8\u73b0\u7684\u8feb\u5207\u538b\u529b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08\u8bb2\u7684\u901a\u4fd7\u6613\u61c2 \u611f\u89c9\u6709\u58f0\u884c\u4e1a\u5f88\u6709\u672a\u6765 \u76ee\u524d\u4e5f\u662f\u4fe1\u5fc3\u6ee1\u6ee1 \u60f3\u52aa\u529b\u5b66\u4e60\u8bd5\u4e00\u4e0b\u5462[\u52a0\u6cb9]\u201d > \u201c\u5e08\u59d0\uff0c\u62a2\u5230\u4e00\u4e2a\u5c0f\u9752\uff0c\u65b9\u8a00\u7248\u7684\uff0c\u867d\u7136\u6ca1\u51e0\u53e5\u53f0\u8bcd\uff0c\u521a\u4e0a\u9ea6\u6709\u70b9\u7d27\u5f20\uff0c\u65b9\u8a00\u4e5f\u6709\u70b9\u627e\u4e0d\u5230\u8c03\uff0c\u4f46\u662f\u89c9\u5f97\u5f88\u597d\u73a9\uff0c\u80fd\u53c2\u4e0e\u8fdb\u53bb\u5c31\u89c9\u5f97\u5df2\u7ecf\u8fc8\u51fa\u4e00\u5927\u6b65\u4e86\uff0c\u5f00\u5fc3[\u8df3\u8df3]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 \u80fd\u652f\u4ed82380\u5143\u8bfe\u7a0b\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\u6216\u501f\u8d37\uff0c\u4f46\u672a\u663e\u793a\u9ad8\u6d88\u8d39\u80fd\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 \u80fd\u8ddf\u4e0a\u5bc6\u96c6\u7684\u8bfe\u7a0b\u3001\u4f5c\u4e1a\u548cPia\u620f\u5b89\u6392\uff0c\u54cd\u5e94\u53ca\u65f6\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u5168\u5929\u5019\u81ea\u7531\u65f6\u95f4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u672a\u77e5] \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff0c\u65e0\u6cd5\u5224\u65ad\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9762\u5bf9Pia\u620f\u7d27\u5f20\u3001\u65b9\u8a00\u627e\u4e0d\u5230\u8c03\u7b49\u6311\u6218\uff0c\u80fd\u79ef\u6781\u770b\u5f85\uff08\u201c\u89c9\u5f97\u5df2\u7ecf\u8fc8\u51fa\u4e00\u5927\u6b65\u4e86\uff0c\u5f00\u5fc3\u201d\uff09\u3002\u63a5\u53d7\u4e13\u4e1a\u70b9\u8bc4\u540e\u80fd\u79ef\u6781\u53cd\u9988\uff08\u201c\u8fd9\u6837\u5c31\u592a\u6e05\u6670\u4e86\uff01\uff01\u201d\uff09\uff0c\u65e0\u8d1f\u9762\u60c5\u7eea\u8868\u9732\uff0c\u8868\u73b0\u51fa\u8f83\u5f3a\u7684\u5b66\u4e60\u97e7\u6027\u548c\u4e50\u89c2\u5fc3\u6001\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5e08\u59d0\uff0c\u62a2\u5230\u4e00\u4e2a\u5c0f\u9752\uff0c\u65b9\u8a00\u7248\u7684\uff0c\u867d\u7136\u6ca1\u51e0\u53e5\u53f0\u8bcd\uff0c\u521a\u4e0a\u9ea6\u6709\u70b9\u7d27\u5f20\uff0c\u65b9\u8a00\u4e5f\u6709\u70b9\u627e\u4e0d\u5230\u8c03\uff0c\u4f46\u662f\u89c9\u5f97\u5f88\u597d\u73a9\uff0c\u80fd\u53c2\u4e0e\u8fdb\u53bb\u5c31\u89c9\u5f97\u5df2\u7ecf\u8fc8\u51fa\u4e00\u5927\u6b65\u4e86\uff0c\u5f00\u5fc3[\u8df3\u8df3]\u201d > \u201c\u8fd9\u6837\u5c31\u592a\u6e05\u6670\u4e86\uff01\uff01\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u6e34\u671b\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u5728\u96c6\u4f53\u4e2d\u627e\u5230\u4f4d\u7f6e\u3002\u4ece\u201c\u80fd\u53c2\u4e0e\u8fdb\u53bb\u5c31\u89c9\u5f97\u5df2\u7ecf\u8fc8\u51fa\u4e00\u5927\u6b65\u4e86\uff0c\u5f00\u5fc3\u201d\u53ef\u4ee5\u770b\u51fa\uff0c\u5176\u6210\u5c31\u611f\u4e0d\u4ec5\u6765\u6e90\u4e8e\u6280\u80fd\u63d0\u5347\uff0c\u66f4\u6765\u6e90\u4e8e\u88ab\u56e2\u961f\u63a5\u7eb3\u548c\u53c2\u4e0e\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u201c\u88ab\u770b\u89c1\u201d\u7684\u5f52\u5c5e\u611f**\u3002\u9500\u552e\u201c\u770b\u597d\u4f60\u201d\u3001\u201c\u4f60\u662f\u73ed\u91cc\u975e\u5e38\u6709\u5851\u9020\u6027\u7684\u5b66\u5458\u201d\u7b49\u8bdd\u8bed\u5bf9\u5176\u6fc0\u52b1\u4f5c\u7528\u660e\u663e\uff0c\u540c\u65f6\u63d0\u4f9b\u201c\u5267\u7ec4\u7fa4\u201d\u3001\u201c\u642d\u97f3\u201d\u7b49\u793e\u7fa4\u673a\u4f1a\uff0c\u6ee1\u8db3\u5176\u793e\u4ea4\u4e0e\u5c0a\u91cd\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 **B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u9ad8\u52a8\u673a\u3001\u9ad8\u6267\u884c\u529b\u3001\u7a33\u5b9a\u4ea4\u4ed8) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u652f\u4ed8\u884c\u4e3a\u679c\u65ad\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u5b66\u4e60\u72b6\u6001\u79ef\u6781\uff0c\u65f6\u95f4\u7ba1\u7406\u826f\u597d\uff0c\u5d29\u76d8\u98ce\u9669\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u79ef\u6781\u770b\u5f85\u6311\u6218\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u56f0\u96be\u7834\u9632\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u82e5\u5728\u540e\u7eed\u5b66\u4e60\u4e2d\u957f\u65f6\u95f4\u63a5\u4e0d\u5230\u5355\uff0c\u6216\u53d1\u73b0\u53d8\u73b0\u8def\u5f84\u4e0e\u9884\u671f\u4e0d\u7b26\uff0c\u53ef\u80fd\u4ea7\u751f\u5931\u671b\u60c5\u7eea\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe\u540e\u7684 **\u7b2c1-2\u4e2a\u6708**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u892a\u53bb\uff0c\u82e5\u6280\u80fd\u63d0\u5347\u8fdb\u5165\u5e73\u53f0\u671f\u4e14\u672a\u83b7\u5f97\u5b9e\u9645\u6536\u76ca\uff08\u5982\u8bd5\u97f3\u5931\u8d25\u3001\u63a5\u5355\u56f0\u96be\uff09\uff0c\u53ef\u80fd\u4ea7\u751f\u52a8\u6447\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5361\u5361\uff0c\u770b\u5230\u4f60\u5728\u4f53\u9a8c\u8425\u7684\u8868\u73b0\uff0c\u5e08\u59d0\u7279\u522b\u653e\u5fc3\u3002\u4f60\u65e2\u6709\u8e0f\u5b9e\u7684\u884c\u52a8\u529b\uff0c\u53c8\u6709\u4eab\u53d7\u8fc7\u7a0b\u7684\u4e50\u89c2\u5fc3\u6001\uff0c\u8fd9\u5728\u6709\u58f0\u8def\u4e0a\u7279\u522b\u5b9d\u8d35\u3002\u6b63\u5f0f\u8bfe\u8282\u594f\u4f1a\u66f4\u5feb\uff0c\u6311\u6218\u4e5f\u66f4\u5927\uff0c\u4f46\u4ee5\u4f60\u7684\u97e7\u52b2\uff0c\u80af\u5b9a\u80fd\u7a33\u7a33\u62ff\u4e0b\u3002\u8bb0\u4f4f\uff0c\u4f60\u4e0d\u662f\u4e00\u4e2a\u4eba\u5728\u6218\u6597\uff0c\u54b1\u4eec\u5267\u7ec4\u7fa4\u968f\u65f6\u662f\u4f60\u7684\u540e\u76fe\uff0c\u6709\u4efb\u4f55\u5361\u70b9\u968f\u65f6\u558a\u6211\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011\u3002\u5339\u914d\u5176T2\u8001\u9ec4\u725b\u7279\u8d28\uff0c\u63d0\u4f9b\u7cfb\u7edf\u3001\u624e\u5b9e\u7684\u6280\u80fd\u8bad\u7ec3\u548c\u660e\u786e\u7684\u8fdb\u9636\u8def\u5f84\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010\u793e\u7fa4\u53c2\u4e0e\u6fc0\u52b1\u5305\u3011\u3002\u56e0\u5176\u8868\u73b0\u51fa\u5bf9\u201c\u53c2\u4e0e\u611f\u201d\u548c\u201c\u88ab\u8ba4\u53ef\u201d\u7684\u9700\u6c42\uff0c\u5e94\u4e3b\u52a8\u63d0\u4f9b\u66f4\u591a\u7fa4\u5185\u89d2\u8272\uff08\u5982\u5c0f\u7ec4\u957f\u3001\u4f5c\u4e1a\u4e92\u8bc4\u5458\uff09\uff0c\u5e76\u9080\u8bf7\u5176\u53c2\u4e0e\u5267\u7ec4Pia\u620f\u3001\u5408\u914d\u9879\u76ee\uff0c\u5f3a\u5316\u5f52\u5c5e\u611f\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u51e0\u5929\u5c31\u80fd\u8d5a\u5927\u94b1\u201d\u7b49\u4e0d\u5207\u5b9e\u9645\u7684\u8bdd\u672f\u8fc7\u5ea6\u523a\u6fc0\u5176\u53d8\u73b0\u9884\u671f\u3002\u907f\u514d\u8ba9\u5176\u4ea7\u751f\u201c\u52aa\u529b\u5c31\u5e94\u7acb\u5373\u6709\u56de\u62a5\u201d\u7684\u9519\u89c9\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u8fdb\u884c**\u9002\u5ea6\u5347\u5355**\u3002\u5f53\u5176\u6280\u80fd\u6709\u660e\u663e\u7a81\u7834\uff08\u5982\u63a5\u5230\u7b2c\u4e00\u5355\u3001\u83b7\u5f97\u91cd\u8981\u8ba4\u53ef\uff09\u65f6\uff0c\u53ef\u987a\u52bf\u63a8\u8350\u9ad8\u9636\u8bfe\u7a0b\u6216\u8bbe\u5907\uff0c\u4f46\u9700\u57fa\u4e8e\u5176\u5b9e\u9645\u6210\u957f\u9636\u6bb5\uff0c\u7406\u7531\u5145\u5206\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u8001\u5e08\u8bb2\u7684\u901a\u4fd7\u6613\u61c2 \u611f\u89c9\u6709\u58f0\u884c\u4e1a\u5f88\u6709\u672a\u6765 \u76ee\u524d\u4e5f\u662f\u4fe1\u5fc3\u6ee1\u6ee1 \u60f3\u52aa\u529b\u5b66\u4e60\u8bd5\u4e00\u4e0b\u5462[\u52a0\u6cb9]\u201d **(\u52a8\u673a\u4e2d\u9ad8\uff0c\u6001\u5ea6\u79ef\u6781)**\n2. > \u201c\u5e08\u59d0\uff0c\u62a2\u5230\u4e00\u4e2a\u5c0f\u9752\uff0c\u65b9\u8a00\u7248\u7684\uff0c\u867d\u7136\u6ca1\u51e0\u53e5\u53f0\u8bcd\uff0c\u521a\u4e0a\u9ea6\u6709\u70b9\u7d27\u5f20\uff0c\u65b9\u8a00\u4e5f\u6709\u70b9\u627e\u4e0d\u5230\u8c03\uff0c\u4f46\u662f\u89c9\u5f97\u5f88\u597d\u73a9\uff0c\u80fd\u53c2\u4e0e\u8fdb\u53bb\u5c31\u89c9\u5f97\u5df2\u7ecf\u8fc8\u51fa\u4e00\u5927\u6b65\u4e86\uff0c\u5f00\u5fc3[\u8df3\u8df3]\u201d **(\u9ad8\u5fc3\u7406\u5f39\u6027\uff0c\u4eab\u53d7\u8fc7\u7a0b\uff0c\u793e\u4ea4\u5f52\u5c5e\u9700\u6c42)**\n3. > \u201c\u597d\u561f\u201d\u3001\u201c\u597d\u561f\u597d\u561f\u201d\u3001\u201c\u597d\u561f\u201d **(\u9ad8\u9891\u4f7f\u7528\u53ef\u7231\u8bed\u6c14\u8bcd\uff0c\u914d\u5408\u5ea6\u9ad8\uff0c\u670d\u4ece\u6027\u597d\uff0c\u5178\u578bT2\u7279\u5f81)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u4e13\u4e1a\u793e\u7fa4\u4e2d\u83b7\u5f97\u8ba4\u53ef\u4e0e\u5f52\u5c5e\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u7a33\u5b9a\u7684\u6280\u80fd\u6210\u957f\u8def\u5f84\u548c\u53ca\u65f6\u7684\u793e\u7fa4\u6b63\u5411\u53cd\u9988\uff0c\u4e25\u9632\u6536\u76ca\u843d\u5dee\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd/\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u793e\u7fa4\u53c2\u4e0e\u6fc0\u52b1\u5305\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
