    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4e3a\u8f6c\u5316\u540e\u7247\u6bb5\uff0c\u7f3a\u5931\u5173\u952e\u51b3\u7b56\u4fe1\u606f\u3002\u65e0\u6cd5\u5224\u65ad\u652f\u4ed8\u65b9\u5f0f\uff08\u662f\u5426\u88ab\u529d\u5bfc\u82b1\u5457\uff09\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u771f\u5b9e\u7ecf\u6d4e\u72b6\u51b5\u3001\u5de5\u4f5c/\u65f6\u95f4\u5b89\u6392\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u53ca\u5fc3\u7406\u5f39\u6027\u5173\u952e\u4fe1\u53f7\uff08\u5982\u9047\u632b\u53cd\u5e94\uff09\u3002\u4ee5\u4e0b\u5206\u6790\u57fa\u4e8e\u6709\u9650\u4fe1\u606f\uff0c\u9700\u73ed\u4e3b\u4efb\u540e\u7eed\u8865\u5145\u3002\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677149676 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e-\u8fea\u8fea(\u5f20\u4e00\u837b)\u3001\u73ed\u4e3b\u4efb-\u6d1b\u5947\u6eaa\u5802(\u5f20\u723d) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6500\u767b\u8ba1\u5212\u9ad8\u9636\u7248\uff08\u6709\u58f0\u4e66\u57f9\u8bad\u8bfe\u7a0b\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u82b1\u5457\u5206\u671f**\uff08\u7528\u6237\u81ea\u8ff0\u201c\u4e5f\u662f\u82b1\u5457\u5206\u671f[\u6342\u8138]\u201d\uff09\uff0c\u8d44\u91d1\u6765\u6e90\u4e0d\u660e\uff0c\u5b58\u5728\u9690\u60a3\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u591a\u6b21\u56e0\u4e8b\u8bf7\u5047\u3001\u8865\u8bfe\uff0c\u63d0\u53ca\u201c\u4eca\u5929\u4e8b\u7a0d\u5fae\u6709\u70b9\u591a\u201d\u3001\u201c\u4e4b\u524d\u6709\u70b9\u5fd9\u201d\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\uff08\u672a\u63d0\u53ca\u5bb6\u4eba\uff0c\u65e0\u6cd5\u5224\u65ad\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\uff08\u5173\u952e\u4e09\u8f74\u4fe1\u606f\u4e0d\u8db3\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u27a1\u4e2d\n- **\u7279\u5f81\u901f\u5199**\uff1a\u80fd\u529b\u5174\u8da3\u4e0e\u53d8\u73b0\u671f\u671b\u6df7\u5408\u3002\u5bf9\u8bfe\u7a0b\u5185\u5bb9\uff08\u7ec3\u6c14\u53d1\u58f0\u3001\u7b49\u7ea7\u63d0\u5347\u8def\u5f84\uff09\u6709\u5177\u4f53\u7591\u95ee\uff0c\u8868\u73b0\u51fa\u5b66\u4e60\u610f\u613f\uff1b\u540c\u65f6\u4e5f\u5173\u6ce8\u53d8\u73b0\u5c97\u4f4d\u3001\u63a5\u5355\u8def\u5f84\u548c\u201c\u659c\u6760\u201d\u53d1\u5c55\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u73b0\u5728\u5982\u679c\u5b66\u4e60\u8981\u53d8\u73b0\u7684\u8bdd\u5c31\u662f\u753b\u672c\u548c\u5ba1\u542c\uff0c\u4ee5\u53ca\u914d\u97f3\u4e86\u201d\uff1b> \u201c\u4f46\u662f\u8fd8\u662f\u5b66\u4e86\u4e00\u4e9b\uff0c\u4e5f\u86ee\u6709\u610f\u601d\u7684\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u652f\u4ed8\u65b9\u5f0f\u4e3a\u201c\u82b1\u5457\u5206\u671f\u201d\uff0c\u4e14\u8bed\u6c14\u201c\u4e5f\u662f\u82b1\u5457\u5206\u671f[\u6342\u8138]\u201d\u9690\u542b\u65e0\u5948\u6216\u538b\u529b\uff0c\u8d44\u91d1\u6765\u6e90\u4e0e\u8fd8\u6b3e\u80fd\u529b\u4e0d\u660e\uff0c\u89e6\u53d1**\u652f\u4ed8\u6765\u6e90\u98ce\u9669\u9884\u8b66**\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e** \u2014 \u591a\u6b21\u56e0\u4e8b\uff08\u5982\u7236\u6bcd\u505a\u80c3\u80a0\u955c\uff09\u9519\u8fc7\u76f4\u64ad\u3001\u9700\u8981\u8865\u8bfe\uff0c\u81ea\u8ff0\u201c\u4eca\u5929\u4e8b\u7a0d\u5fae\u6709\u70b9\u591a\u201d\u3001\u201c\u4e4b\u524d\u542c\u4e00\u534a\u603b\u6709\u4e8b\u201d\uff0c\u663e\u793a\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\u4e14\u4e0d\u53ef\u63a7\u3002**\u65e0\u7535\u8111\uff0c\u53ea\u6709\u5e73\u677f**\uff0c\u8bbe\u5907\u6761\u4ef6\u53ef\u80fd\u9650\u5236\u90e8\u5206\u5b66\u4e60/\u5b9e\u64cd\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u672a\u63d0\u53ca\uff0c\u65e0\u6cd5\u5224\u65ad\u3002\u4f46\u7528\u6237\u9700\u966a\u540c\u7236\u6bcd\u5c31\u533b\uff0c\u53ef\u80fd\u627f\u62c5\u5bb6\u5ead\u7167\u62a4\u8d23\u4efb\u3002\n- **\u5e95\u5ea7\u53d6\u77ed\u677f**\uff1a**\u4f4e**\uff08\u8d44\u91d1\u548c\u65f6\u95f4\u7ef4\u5ea6\u5747\u4eae\u7ea2\u706f\uff09\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u27a1\u4e2d (\u504f\u4e0b\uff0c\u4fe1\u606f\u4e0d\u8db3)\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a(\u4e2d)**\u3002\u6001\u5ea6\u793c\u8c8c\u3001\u914d\u5408\uff08\u201c\u8c22\u8c22\u5e08\u59d0\u201d\u3001\u201c\u8f9b\u82e6\u4e86\u201d\uff09\uff0c\u80fd\u63a5\u53d7\u8865\u8bfe\u5b89\u6392\u3002\u4f46\u672a\u7ecf\u5386\u660e\u663e\u632b\u6298\uff0c\u771f\u5b9e\u6297\u538b\u6027\u672a\u77e5\u3002\u5bf9\u5b66\u4e60\u96be\u70b9\uff08\u7ec3\u6c14\u53d1\u58f0\uff09\u6709\u8ba4\u77e5\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u6781\u5ea6\u7126\u8651\u6216\u653e\u5f03\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8fd8\u662f\u7ec3\u6c14\u53d1\u58f0\u8fd9\u65b9\u9762\u4e0d\u592a\u987a\uff0c\u53ef\u80fd\u4e5f\u548c\u65f6\u95f4\u77ed\u6709\u5173\u5427\u201d\uff1b> \u201c\u90a3\u5c31\u6162\u6162\u6765\uff0c\u8c22\u8c22\u5e08\u59d0\u4e86\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e**\uff08\u6df7\u5408\u578b\uff09\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u7ecf\u6d4e\u4e0a\u4f9d\u8d56\u5206\u671f\u652f\u4ed8\uff0c\u65f6\u95f4\u4e0a\u88ab\u5bb6\u5ead\u4e8b\u52a1\uff08\u5982\u966a\u540c\u7236\u6bcd\u5c31\u533b\uff09\u4e25\u91cd\u5207\u5272\uff0c\u663e\u793a\u51fa**\u5bf9\u73b0\u6709\u751f\u6d3b\u72b6\u6001\u7f3a\u4e4f\u638c\u63a7\u611f\u548c\u5b89\u5168\u611f**\uff0c\u6e34\u671b\u901a\u8fc7\u4e00\u9879\u201c\u659c\u6760\u201d\u6280\u80fd\u83b7\u5f97\u989d\u5916\u6536\u5165\u4fdd\u969c\u548c\u81ea\u4e3b\u6027\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u7684\u6210\u957f\u8def\u5f84\u548c\u6e29\u548c\u7684\u8fdb\u5ea6\u8ba4\u53ef**\u3002\u4ed6\u9700\u8981\u6e05\u6670\u7684\u201c\u4e0b\u4e00\u6b65\u201d\u6307\u5f15\uff08\u5982\u7b49\u7ea7\u5982\u4f55\u63d0\u5347\uff09\u548c\u201c\u6162\u6162\u6765\u201d\u7684\u5305\u5bb9\uff0c\u800c\u975e\u9ad8\u538b\u50ac\u4fc3\u3002\u540c\u65f6\uff0c\u63d0\u4f9b\u201c\u659c\u6760\u201d\u53d1\u5c55\u7684\u53ef\u80fd\u6027\uff0c\u6ee1\u8db3\u5176**\u5bfb\u6c42\u7ecf\u6d4e\u72ec\u7acb\u4e0e\u4ef7\u503c\u8ba4\u53ef**\u7684\u6df7\u5408\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b\uff08\u51b2\u52a8\u98ce\u9669\u578b\uff09** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u578b** (\u6df7\u5408 T6 \u60c5\u7eea\u5de8\u5a74\u98ce\u9669) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 **\u5b89\u5168\u672a\u89e6\u53d1** (\u4f46\u5904\u4e8eC2\u7c7b\u9ad8\u98ce\u9669\u8fb9\u7f18)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u660e\u786e\u7194\u65ad\u7ea2\u7ebf\uff08\u5982\u501f\u8d37\u3001\u5bb6\u4eba\u53cd\u5bf9\uff09\uff0c\u4f46**\u82b1\u5457\u5206\u671f+\u65f6\u95f4\u788e\u7247\u5316**\u6784\u6210\u9ad8\u98ce\u9669\u7ec4\u5408\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u652f\u4ed8\u65b9\u5f0f\u4e3a\u82b1\u5457\u5206\u671f\uff0c\u82e5\u5bb6\u4eba\u4e0d\u77e5\u60c5\u6216\u53cd\u5bf9\uff0c\u6781\u6613\u5f15\u53d1\u8d44\u91d1\u7ea0\u7eb7\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316**\uff0c\u56e0\u5bb6\u5ead\u4e8b\u52a1\u9891\u7e41\u4e2d\u65ad\u5b66\u4e60\uff0c\u4f5c\u4e1a\u79ef\u538b\u540e\u4ea7\u751f\u632b\u8d25\u611f\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4e2d** | \u5bf9\u7ec3\u6c14\u53d1\u58f0\u7b49\u57fa\u672c\u529f\u6709\u754f\u96be\u60c5\u7eea\uff08\u201c\u4e0d\u592a\u987a\u201d\uff09\uff0c\u82e5\u521d\u671f\u4f5c\u4e1a\u53cd\u9988\u4e0d\u4f73\u6216\u8f6f\u4ef6\u64cd\u4f5c\uff08\u4ec5\u5e73\u677f\uff09\u9047\u963b\uff0c\u53ef\u80fd\u81ea\u5c0a\u5fc3\u53d7\u632b\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | **\u5178\u578b\u7684T4\u641e\u94b1\u7ed3\u679c\u578b**\uff0c\u5173\u6ce8\u201c\u53d8\u73b0\u201d\u3001\u201c\u659c\u6760\u201d\u3001\u201c\u63a5\u5355\u201d\u3002\u82e5\u5f00\u8bfe\u540e\u53d1\u73b0\u65e0\u6cd5\u5feb\u901f\u63a5\u5355\u6216\u6536\u76ca\u4e0e\u9884\u671f\u4e0d\u7b26\uff0c\u6781\u6613\u4ea7\u751f\u88ab\u6b3a\u9a97\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\u3002\u5c4a\u65f6\u5b66\u4e60\u538b\u529b\uff08\u76f4\u64ad\u3001\u4f5c\u4e1a\uff09\u4e0e\u65f6\u95f4\u51b2\u7a81\u52a0\u5267\uff0c\u540c\u65f6\u201c\u53d8\u73b0\u201d\u627f\u8bfa\u672a\u5373\u65f6\u5151\u73b0\uff0c\u53cc\u91cd\u538b\u529b\u4e0b\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u540c\u5b66\u4f60\u597d\uff0c\u770b\u5230\u4f60\u62a5\u540d\u65f6\u7528\u4e86\u5206\u671f\uff0c\u80fd\u611f\u53d7\u5230\u4f60\u60f3\u6539\u53d8\u73b0\u72b6\u7684\u51b3\u5fc3\u3002\u54b1\u4eec\u8fd9\u4e2a\u884c\u4e1a\u786e\u5b9e\u662f\u2018\u6162\u5de5\u51fa\u7ec6\u6d3b\u2019\uff0c\u5c24\u5176\u662f\u524d\u671f\u57fa\u672c\u529f\u3002**\u522b\u62c5\u5fc3\u8fdb\u5ea6\uff0c\u54b1\u4eec\u73ed\u5f88\u591a\u540c\u5b66\u90fd\u662f\u5229\u7528\u788e\u7247\u65f6\u95f4\u5b66\u4e60\u7684\uff0c\u6211\u4f1a\u6839\u636e\u4f60\u7684\u65f6\u95f4\u5e2e\u4f60\u89c4\u5212\u6700\u7701\u529b\u7684\u5b66\u4e60\u8def\u5f84\u3002** \u54b1\u4eec\u5148\u5b9a\u4e2a\u5c0f\u76ee\u6807\uff0c\u628a\u6c14\u606f\u7ec3\u987a\uff0c\u4eab\u53d7\u8fd9\u4e2a\u8fc7\u7a0b\uff0c\u53d8\u73b0\u662f\u6c34\u5230\u6e20\u6210\u7684\u4e8b\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u7a33\u5065\u722c\u5761\u7ebf\u3011**\u3002**\u7edd\u5bf9\u7981\u6b62**\u4e00\u4e0a\u6765\u5c31\u63a8\u201c\u5feb\u901f\u63a5\u5355\u7ebf\u201d\u3002\u4f18\u5148\u592f\u5b9e\u57fa\u7840\uff0c\u5339\u914d\u5176\u201c\u6162\u6162\u6765\u201d\u7684\u5fc3\u6001\u548c\u6709\u9650\u65f6\u95f4\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176**\u8bbe\u5907\u53ea\u6709\u5e73\u677f**\u548c**\u65f6\u95f4\u788e\u7247\u5316**\u7684\u7279\u70b9\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a**\u3010\u79fb\u52a8\u7aef\u53cb\u597d\u5b66\u4e60\u5305\u3011**\uff08\u9002\u914d\u5e73\u677f\u7684\u6559\u7a0b\u3001\u5de5\u5177\uff09\u3001**\u3010\u788e\u7247\u65f6\u95f4\u7ba1\u7406\u5305\u3011**\uff085-15\u5206\u949f\u5fae\u7ec3\u4e60\u6307\u5357\uff09\u3001**\u3010\u5fc3\u7406\u7f13\u538b\u966a\u8dd1\u5305\u3011**\uff08\u5b9a\u671f1v1\u8fdb\u5ea6\u590d\u76d8\uff0c\u91cd\u70b9\u8868\u626c\u5fae\u5c0f\u8fdb\u6b65\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u4ed6\u9f13\u5439\u201c\u6708\u5165\u8fc7\u4e07\u201d\u6216\u201c\u5feb\u901f\u53d8\u73b0\u201d**\uff0c\u8fd9\u4f1a\u76f4\u63a5\u70b9\u71c3\u6536\u76ca\u843d\u5dee\u578b\u9000\u8d39\u3002\n    2. **\u7edd\u4e0d\u5728\u5176\u56e0\u5bb6\u5ead\u4e8b\u52a1\u8bf7\u5047\u65f6\u65bd\u52a0\u538b\u529b**\uff08\u5982\u201c\u522b\u4eba\u90fd\u4ea4\u4e86\u4f60\u600e\u4e48\u6ca1\u4ea4\u201d\uff09\u3002\n    3. **\u907f\u514d\u5e03\u7f6e\u9ad8\u96be\u5ea6\u6216\u9700\u7535\u8111\u590d\u6742\u64cd\u4f5c\u7684\u4f5c\u4e1a**\uff0c\u521d\u671f\u4ee5\u5e73\u677f\u53ef\u5b8c\u6210\u7684\u8f7b\u91cf\u7ec3\u4e60\u4e3a\u4e3b\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5347\u5355**\u3002\u5728\u5b8c\u6210\u5f53\u524d\u8bfe\u7a0b\u5e76\u6709\u7a33\u5b9a\u4ea7\u51fa\uff08\u5982\u5b8c\u6210\u7b2c\u4e00\u4e2a\u5c0f\u4f5c\u54c1\uff09\u524d\uff0c\u7981\u6b62\u63a8\u8350\u4efb\u4f55\u9ad8\u4ef7\u8bbe\u5907\u3001\u8fdb\u9636\u8bfe\u6216\u4f1a\u5458\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u4e5f\u662f\u82b1\u5457\u5206\u671f[\u6342\u8138]**\u201d \u2014\u2014 **\u8d44\u91d1\u98ce\u9669\u6838\u5fc3\u8bc1\u636e**\n2. > \u201c**\u6211\u7238\u5988\u624d\u8fdb\u53bb\u505a\u80c3\u80a0\u955c\u4e0d\u4e45\uff0c\u53ef\u80fd\u8fd8\u662f\u9700\u8981\u8bf7\u5047\u4e86**\u201d \u2014\u2014 **\u65f6\u95f4\u788e\u7247\u5316\u4e0e\u5bb6\u5ead\u8d23\u4efb\u8bc1\u636e**\n3. > \u201c**\u73b0\u5728\u5982\u679c\u5b66\u4e60\u8981\u53d8\u73b0\u7684\u8bdd\u5c31\u662f\u753b\u672c\u548c\u5ba1\u542c\uff0c\u4ee5\u53ca\u914d\u97f3\u4e86**\u201d \u2014\u2014 **T4\u641e\u94b1\u7ed3\u679c\u578b\u52a8\u673a\u8bc1\u636e**\n4. > \u201c**\u4f46\u662f\u6211\u76ee\u524d\u6ca1\u6709\u8bbe\u5907[\u6342\u8138]**\u201d \u2014\u2014 **\u8d44\u6e90\u9650\u5236\uff08\u8bbe\u5907\uff09\u8bc1\u636e**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4\u641e\u94b1\u7ed3\u679c\u578b\u3011**\uff0c\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u9700\u6c42\uff08\u7ecf\u6d4e\u4fdd\u969c\uff09\u4e0e\u5c0a\u91cd\u9700\u6c42\uff08\u4ef7\u503c\u8ba4\u53ef\uff09\u7684\u6df7\u5408\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u4e25\u683c\u7ba1\u7406\u5176\u53d8\u73b0\u9884\u671f + \u63d0\u4f9b\u6781\u5ea6\u7075\u6d3b\u3001\u5305\u5bb9\u7684\u788e\u7247\u5316\u5b66\u4e60\u652f\u6301\u65b9\u6848\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u578b\", \"maslow_need\": \"\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\u4e0e\u7b2c\u56db\u5c42\u5c0a\u91cd\u9700\u6c42\u6df7\u5408\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"target_product_line\": \"\u7a33\u5065\u722c\u5761\u7ebf + \u79fb\u52a8\u7aef\u53cb\u597d\u5b66\u4e60\u5305 + \u788e\u7247\u65f6\u95f4\u7ba1\u7406\u5305 + \u5fc3\u7406\u7f13\u538b\u966a\u8dd1\u5305\"}\n```";
