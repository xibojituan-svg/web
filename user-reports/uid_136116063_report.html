        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n> **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4e3a\u8bfe\u7a0b\u4ea4\u4ed8\u671f\u7247\u6bb5\uff0c\u7f3a\u5931\u5173\u952e\u51b3\u7b56\u4fe1\u606f\uff08\u5982\u8d2d\u4e70\u52a8\u673a\u3001\u652f\u4ed8\u80fd\u529b\u3001\u5bb6\u5ead\u652f\u6301\u5ea6\u3001\u804c\u4e1a\u80cc\u666f\u3001\u7ecf\u6d4e\u72b6\u51b5\u7b49\uff09\uff0c\u65e0\u6cd5\u5b8c\u6574\u8bc4\u4f30\u4e09\u8f74\u4fe1\u53f7\u4e0e\u98ce\u9669\u3002\u4ee5\u4e0b\u5206\u6790\u57fa\u4e8e\u73b0\u6709\u884c\u4e3a\u6a21\u5f0f\u63a8\u65ad\u3002\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u5de7\u514b\u529b-\u6d59\u6c5f-\u5973\u64ad (UID: 136116063) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-05 \u81f3 2026-03-14 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6696\u5c0f\u6ca8(\u859b\u654f) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u4fe1\u606f\u7f3a\u5931\uff08\u63a8\u6d4b\u4e3a\u6709\u58f0\u6f14\u64ad\u7c7b\u8bfe\u7a0b\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u4fe1\u606f\u7f3a\u5931\uff08\u5df2\u4e0b\u5355\u8d2d\u4e70MK4\u8bbe\u5907\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u6d88\u8d39\u80fd\u529b\uff0c\u4f46\u8d44\u91d1\u6765\u6e90\u4e0d\u660e\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u4fe1\u606f\u7f3a\u5931\uff08\u804a\u5929\u6d3b\u8dc3\uff0c\u80fd\u6295\u5165\u65f6\u95f4\u5b66\u4e60\u3001\u5b89\u88c5\u8f6f\u4ef6\u3001\u8c03\u8bd5\u8bbe\u5907\uff0c\u65f6\u95f4\u5f39\u6027\u5c1a\u53ef\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u7f3a\u5931\uff08\u672a\u63d0\u53ca\u5bb6\u5ead\uff0c\u98ce\u9669\u672a\u77e5\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34(\u4e2d)\u3002\u804a\u5929\u4e2d\u672a\u76f4\u63a5\u63d0\u53ca\u8d5a\u94b1\u76ee\u6807\uff0c\u66f4\u591a\u8868\u73b0\u4e3a\u5bf9\u6280\u80fd\u5b66\u4e60\u7684\u6295\u5165\u3001\u793e\u7fa4\u4e92\u52a8\u548c\u8bbe\u5907\u6295\u8d44\u7684\u79ef\u6781\u8ddf\u8fdb\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u662f\u60f3\u591a\u8d5b\u9053\u8fdb\u884c\u5457\uff0c\u5c31\u662f\u60f3\u60ac\u7591\u6050\u6016\uff0c\uff0c\u90a3\u79cd\u90fd\u5e02\u8a00\u60c5\uff0c\u53e4\u53e4\u8a00\uff0c\u90fd\u60f3\u8bd5\u4e00\u8bd5\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 \u80fd\u81ea\u4e3b\u4e0b\u5355\u8d2d\u4e70\u4e13\u4e1a\u9ea6\u514b\u98ce\uff08MK4\uff09\uff0c\u65e0\u7ecf\u6d4e\u538b\u529b\u8868\u73b0\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u7ecf\u6d4e\u72b6\u51b5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 \u80fd\u6295\u5165\u65f6\u95f4\u5b66\u4e60\u3001\u5b89\u88c5\u8f6f\u4ef6\u3001\u8c03\u8bd5\u8bbe\u5907\u3001\u53c2\u4e0e\u793e\u7fa4\u4e92\u52a8\uff0c\u4f46\u672a\u900f\u9732\u804c\u4e1a\uff0c\u65f6\u95f4\u7a33\u5b9a\u6027\u672a\u77e5\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4f4e] \u2014 **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\uff0c\u4e3a\u6700\u5927\u98ce\u9669\u77ed\u677f\u3002\u5bb6\u5ead\u6001\u5ea6\u5b8c\u5168\u672a\u77e5\uff0c\u5b58\u5728\u6f5c\u5728\u5e72\u9884\u98ce\u9669\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9762\u5bf9\u6280\u672f\u95ee\u9898\uff08AU\u5b89\u88c5\u3001\u964d\u566a\uff09\u4e3b\u52a8\u5728\u793e\u7fa4\u6c42\u52a9\u5e76\u5c1d\u8bd5\u89e3\u51b3\uff1b\u63a5\u53d7\u4e13\u4e1a\u53cd\u9988\uff08\u73ed\u73ed\u70b9\u8bc4\uff09\u6001\u5ea6\u79ef\u6781\uff0c\u80fd\u7406\u6027\u5206\u6790\u81ea\u8eab\u95ee\u9898\uff0c\u65e0\u8d1f\u9762\u60c5\u7eea\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u91cd\u97f3\u5728\u540e\u9762\u5dee\u5f88\u591a\u610f\u601d\u201d\uff1b > \u201c\u8fd9\u4e2a\u540e\u6765\u6211\u77e5\u9053\u4e86 \u4e0b\u9762\u4e00\u70b9\u5c31\u6062\u590d\u4e86[\u6342\u8138] \u5c31\u662f\u4f60\u6628\u5929\u7684\u89c6\u9891\u4e2d\u5728\u97f3\u9891\u4e2d\u95f4\u53d6\u566a\u97f3\u6837\u672c\u665a\u70b9\u6211\u8fd8\u8981\u518d\u4ed4\u7ec6\u770b\u770b\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u793e\u7fa4\u5f52\u5c5e\u611f\u548c\u4e13\u4e1a\u8ba4\u53ef\u7684\u5f3a\u70c8\u6e34\u671b\u3002\u5979\u79ef\u6781\u878d\u5165\u793e\u7fa4\uff08\u79f0\u540c\u5b66\u4e3a\u201c\u5927\u795e\u201d\u3001\u201c\u7537\u795e\u201d\u3001\u201c\u9e2d\u9e2d\u5973\u795e\u201d\uff09\uff0c\u4e3b\u52a8\u53c2\u4e0e\u4e92\u52a8\uff08\u731c\u58f0\u97f3\u3001\u5e2e\u52a9\u540c\u5b66\u3001\u8ba8\u8bba\u8bbe\u5907\uff09\uff0c\u5e76\u56e0\u88ab\u526f\u73ed\u9009\u4e2d\u642d\u6863\u800c\u611f\u5230\u201c\u4e0d\u80fd\u8f9c\u8d1f\u5979\u7684\u4e00\u756a\u5fc3\u610f\u201d\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6301\u7eed\u7684\u6b63\u9762\u53cd\u9988\u4e0e\u793e\u7fa4\u8eab\u4efd\u8ba4\u540c**\u3002\u8ba9\u5979\u611f\u53d7\u5230\u81ea\u5df1\u662f\u201c\u88ab\u9009\u4e2d\u201d\u3001\u201c\u88ab\u770b\u597d\u201d\u7684\uff0c\u662f\u8fd9\u4e2a\u5c0f\u5708\u5b50\u91cc\u6709\u4ef7\u503c\u7684\u4e00\u5458\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B \u7c7b** (\u57fa\u4e8e\u73b0\u6709\u884c\u4e3a\u63a8\u65ad\uff0c\u52a8\u673a\u4e2d\u7b49\uff0c\u8d44\u6e90\u4e2d\u7b49\uff0c\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4f46\u5bb6\u5ead\u4fe1\u606f\u7f3a\u5931\u662f\u91cd\u5927\u9690\u60a3) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T3 \u6b7b\u78d5\u5b66\u9738\u578b** (\u5b66\u4e60\u6001\u5ea6\u8ba4\u771f\uff0c\u4e3b\u52a8\u94bb\u7814\u6280\u672f\u7ec6\u8282\uff0c\u79ef\u6781\u5bfb\u6c42\u53cd\u9988\u5e76\u8c03\u6574\uff0c\u793e\u7fa4\u4e92\u52a8\u53cb\u597d) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | **\u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u4e3a\u6700\u5927\u98ce\u9669\u70b9**\u3002\u82e5\u8bfe\u7a0b/\u8bbe\u5907\u652f\u51fa\u672a\u7ecf\u5bb6\u4eba\u540c\u610f\uff0c\u53ef\u80fd\u5f15\u53d1\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u5b66\u4e60\u4e3b\u52a8\u6027\u9ad8\uff0c\u80fd\u514b\u670d\u6280\u672f\u969c\u788d\uff08\u5982AU\u5b89\u88c5\uff09\uff0c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5c1a\u53ef\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e50\u4e8e\u63a5\u53d7\u6279\u8bc4\u6307\u6b63\uff0c\u89e3\u51b3\u95ee\u9898\u5bfc\u5411\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u5f53\u524d\u5174\u8da3\u9a71\u52a8\u660e\u663e\uff0c\u82e5\u957f\u671f\u65e0\u6cd5\u83b7\u5f97\u63a5\u5355\u6b63\u53cd\u9988\u6216\u793e\u7fa4\u8ba4\u53ef\uff0c\u70ed\u60c5\u53ef\u80fd\u6d88\u9000\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e1-2\u4e2a\u6708**\u3002\u65b0\u9c9c\u611f\u8fc7\u540e\uff0c\u82e5\u6280\u80fd\u63d0\u5347\u9047\u5230\u74f6\u9888\uff0c\u4e14\u672a\u80fd\u83b7\u5f97\u9884\u671f\u7684\u793e\u7fa4\u5f52\u5c5e\u611f\u6216\u5fae\u5c0f\u6210\u5c31\uff08\u5982\u8bd5\u97f3\u6210\u529f\uff09\uff0c\u53ef\u80fd\u51fa\u73b0\u52a8\u529b\u8870\u51cf\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5de7\u514b\u529b\uff0c\u770b\u5230\u4f60\u5728\u7fa4\u91cc\u90a3\u4e48\u70ed\u5fc3\u5730\u5e2e\u540c\u5b66\u89e3\u51b3\u95ee\u9898\uff0c\u5bf9\u8bbe\u5907\u3001\u8f6f\u4ef6\u7684\u7814\u7a76\u4e5f\u8fd9\u4e48\u4e0a\u5fc3\uff0c\u771f\u7684\u5f88\u6709\u2018\u5b66\u9738\u2019\u6f5c\u8d28\uff01\u526f\u73ed\u80fd\u9009\u4e2d\u4f60\u642d\u6863\uff0c\u8bf4\u660e\u4f60\u7684\u58f0\u97f3\u6761\u4ef6\u548c\u5b66\u4e60\u6001\u5ea6\u65e9\u5c31\u88ab\u5927\u5bb6\u770b\u5728\u773c\u91cc\u4e86\u3002\u54b1\u4eec\u8fd9\u4e2a\u73ed\uff0c\u5c31\u9700\u8981\u4f60\u8fd9\u6837\u65e2\u8ba4\u771f\u53c8\u80fd\u5e26\u52a8\u6c1b\u56f4\u7684\u2018\u6280\u672f\u62c5\u5f53\u2019\uff0c\u4ee5\u540e\u591a\u5e26\u5e26\u5927\u5bb6\u5440\uff01\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u3002\u5339\u914d\u5176\u94bb\u7814\u6280\u672f\u548c\u8ffd\u6c42\u4e13\u4e1a\u63d0\u5347\u7684\u7279\u8d28\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T3\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a\u3010**\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743**\u3011\uff08\u63d0\u4f9b\u66f4\u6df1\u5165\u7684\u6280\u672f\u7b54\u7591\u901a\u9053\uff09\uff1b\u3010**\u793e\u7fa4\u6838\u5fc3\u6210\u5458\u8eab\u4efd**\u3011\uff08\u8d4b\u4e88\u5176\u5c0f\u7ec4\u957f\u6216\u7b54\u7591\u5b98\u89d2\u8272\uff0c\u6ee1\u8db3\u5c0a\u91cd\u4e0e\u5f52\u5c5e\u9700\u6c42\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5ffd\u89c6\u5176\u6280\u672f\u94bb\u7814\u7684\u70ed\u60c5\uff0c\u53ea\u7ed9\u9e21\u6c64\u4e0d\u7ed9\u5e72\u8d27\uff1b\u5c06\u5176\u8fb9\u7f18\u5316\uff0c\u4e0d\u7ed9\u4e88\u793e\u7fa4\u89d2\u8272\u8ba4\u53ef\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u76f2\u76ee\u5927\u989d\u5347\u5355**\u3002\u5728\u5efa\u7acb\u6df1\u5ea6\u4fe1\u4efb\u5e76\u786e\u8ba4\u5176\u5bb6\u5ead\u652f\u6301\u4e0e\u7ecf\u6d4e\u72b6\u51b5\u524d\uff0c\u4ec5\u53ef\u57fa\u4e8e\u5176\u660e\u786e\u7684\u6280\u80fd\u8fdb\u9636\u9700\u6c42\uff0c\u63a8\u4ecb**500\u5143\u4ee5\u5185**\u7684\u5fae\u8bfe\u6216\u5de5\u5177\u5305\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u662f\u60f3\u591a\u8d5b\u9053\u8fdb\u884c\u5457\uff0c\u5c31\u662f\u60f3\u60ac\u7591\u6050\u6016\uff0c\uff0c\u90a3\u79cd\u90fd\u5e02\u8a00\u60c5\uff0c\u53e4\u53e4\u8a00\uff0c\u90fd\u60f3\u8bd5\u4e00\u8bd5\uff0c\u55ef\uff0c\u6211\u66f4\u503e\u5411\u4e8e M K \u56db\uff0c\u6240\u4ee5\u6211\u53ef\u80fd\u662f\uff0c\uff0c\u6211\u4eca\u5929\u60f3\u4e0b\u5355 M K \u56db\u201d\n2. > \u201c\u526f\u73ed \u6211\u8fd8\u6ca1\u8bbe\u5907 \u662f\u4e0d\u662f\u4e0d\u80fd\u548c\u4f60\u4eec\u642d\u97f3[\u6342\u8138]... \u8bbe\u5907\u4eca\u5929\u4e0b\u5355\u6765\u5f97\u53ca\u5417[\u6342\u8138]\u201d\n3. > \u201c\u73ed\u73ed \u6211\u4eca\u5929\u6709\u7a7a\u5e2e\u542c\u4e0b[\u73ab\u7470]... \u73ed\u73ed \u6211\u518d\u597d\u597d\u63e3\u6469\u4e0b\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T3\u6b7b\u78d5\u5b66\u9738\u578b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u793e\u7fa4\u5f52\u5c5e\u4e0e\u4e13\u4e1a\u5c0a\u91cd\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff08\u4e3b\u8981\u98ce\u9669\u6765\u81ea\u672a\u77e5\u7684\u5bb6\u5ead\u5e72\u9884\uff09\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u8d4b\u4e88\u5176\u793e\u7fa4\u6838\u5fc3\u89d2\u8272\uff0c\u63d0\u4f9b\u6301\u7eed\u7684\u6280\u672f\u6b63\u53cd\u9988\u4e0e\u8eab\u4efd\u8ba4\u540c\u3011**\u3002\n\n```json\n{\"core_type\": \"T3 \u6b7b\u78d5\u5b66\u9738\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u5f52\u5c5e\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\"}\n```";
