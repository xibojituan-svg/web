    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u7f3a\u5c11\u652f\u4ed8\u8bb0\u5f55\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u3001\u7528\u6237\u4e2a\u4eba\u80cc\u666f\uff08\u5982\u804c\u4e1a\u3001\u5e74\u9f84\u3001\u7ecf\u6d4e\u72b6\u51b5\uff09\u3001\u660e\u786e\u7684\u8bfe\u7a0b\u5b66\u4e60\u76ee\u6807\u4e0e\u9884\u671f\u3002\n\n---\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a**\u4e2d\u7b49**\u3002\u7528\u6237\u6709\u660e\u786e\u7684\u5b66\u4e60\u884c\u4e3a\uff08\u6309\u65f6\u4ea4\u4f5c\u4e1a\u3001\u7d22\u8981\u53e3\u4ee4\u3001\u8be2\u95ee\u8bfe\u4ef6\uff09\uff0c\u8868\u73b0\u51fa\u5bf9\u201c\u5b66\u4f1a\u6280\u80fd\u201d\u7684\u6c42\u77e5\u6b32\u3002\u4f46\u52a8\u673a\u4e2d\u63ba\u6742\u660e\u663e\u7684\u201c\u53d8\u73b0\u7126\u8651\u201d\uff08\u62b1\u6028\u6709\u58f0\u4e66\u53d8\u73b0\u4f4e\u3001\u6548\u7387\u4f4e\uff09\u548c\u201c\u4ece\u4f17\u6bd4\u8f83\u201d\uff08\u8be2\u95ee\u540c\u5b66\u4ef7\u683c\u3001\u62c5\u5fc3\u5b66\u4e0d\u4f1a\u3001\u5173\u6ce8\u4ed6\u4eba\u8bc4\u4ef7\uff09\uff0c**\u5b66\u4e60\u76ee\u6807\u6a21\u7cca\uff0c\u5bf9\u201c\u53d8\u73b0\u201d\u7684\u671f\u671b\u9ad8\u4e8e\u5bf9\u201c\u638c\u63e1\u6280\u80fd\u201d\u672c\u8eab**\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4e2d\u7b49\u504f\u4e0b**\u3002\u7528\u6237\u6709\u7535\u8111\uff08\u66fe\u7ef4\u4fee\uff09\uff0c\u5728\u804c\uff08\u516c\u53f8\u6ca1\u4fe1\u53f7\u3001\u5468\u672b\u4e0a\u73ed\uff09\uff0c\u8868\u660e\u6709\u57fa\u7840\u5b66\u4e60\u8bbe\u5907\u548c\u56fa\u5b9a\u6536\u5165\u3002\u4f46**\u65f6\u95f4\u8d44\u6e90\u7d27\u5f20**\uff08\u4e0a\u73ed\u3001\u62c5\u5fc3\u6ca1\u65f6\u95f4\uff09\uff0c\u4e14\u5bf9\u989d\u5916\u6295\u5165\uff08\u598220000\u5143\u5b66\u8d39\uff09\u654f\u611f\uff0c\u663e\u793a\u51fa**\u7ecf\u6d4e\u9884\u7b97\u6709\u9650\uff0c\u6297\u98ce\u9669\u80fd\u529b\u8f83\u5f31**\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a**\u4e2d\u7b49**\u3002\u7528\u6237\u80fd\u575a\u6301\u5b8c\u6210\u5f53\u524d\u8bfe\u7a0b\u4f5c\u4e1a\uff0c\u9047\u5230\u95ee\u9898\uff08\u5982\u627e\u4e0d\u5230\u8bfe\u4ef6\u3001\u7535\u8111\u7ef4\u4fee\uff09\u4f1a\u4e3b\u52a8\u8be2\u95ee\u5e76\u5bfb\u6c42\u66ff\u4ee3\u65b9\u6848\uff08\u542c\u56de\u653e\uff09\uff0c\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u575a\u6301\u5ea6\u548c\u95ee\u9898\u89e3\u51b3\u610f\u613f\u3002\u4f46**\u6613\u53d7\u5916\u754c\u4fe1\u606f\u5e72\u6270**\uff08\u88ab\u540c\u5b66\u8bf4\u7684\u4ef7\u683c\u201c\u5413\u9000\u201d\uff09\uff0c\u5bf9\u5b66\u4e60\u96be\u5ea6\u6709\u754f\u96be\u60c5\u7eea\uff08\u201c\u6015\u5b66\u4e0d\u4f1a\u201d\uff09\uff0c\u4e14\u5bf9\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\uff08\u6709\u58f0\u8bfe\uff09\u6709\u8f83\u5f3a\u7684\u632b\u8d25\u611f\u548c\u62b1\u6028\uff0c**\u97e7\u6027\u4e00\u822c\uff0c\u5bb9\u6613\u56e0\u632b\u6298\u6216\u5bf9\u6bd4\u800c\u4ea7\u751f\u52a8\u6447**\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a**\u65e0\u6cd5\u5224\u65ad**\u3002\u8bb0\u5f55\u4e2d\u65e0\u652f\u4ed8\u884c\u4e3a\u6216\u660e\u786e\u652f\u4ed8\u51ed\u8bc1\u4fe1\u606f\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u65e0\u6cd5\u5224\u65ad**\u3002\u8bb0\u5f55\u4e2d\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u6210\u5458\u6216\u51b3\u7b56\u76f8\u5173\u65b9\u3002\n*   **\u6b65\u9aa42\uff1a\u52a8\u673a-\u8d44\u6e90\u5339\u914d**\uff1a**B\u7c7b\uff08\u52a8\u673a\u5c1a\u53ef\uff0c\u8d44\u6e90\u5403\u7d27\uff09**\u3002\u7528\u6237\u6709\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\uff0c\u4f46\u65f6\u95f4\u3001\u7ecf\u6d4e\u9884\u7b97\u5747\u663e\u7d27\u5f20\uff0c\u4e14\u5bf9\u5b66\u4e60\u6210\u679c\uff08\u53d8\u73b0\uff09\u6709\u8f83\u9ad8\u4e14\u6a21\u7cca\u7684\u671f\u5f85\u3002\n*   **\u6b65\u9aa43\uff1a\u627f\u8bfa\u5ea6-\u884c\u52a8\u529b**\uff1a**B2\u578b\uff08\u9ad8\u627f\u8bfa\u8bd5\u63a2\u8005\uff09**\u3002\u7528\u6237\u8868\u73b0\u51fa\u8f83\u9ad8\u7684\u8bfe\u7a0b\u53c2\u4e0e\u5ea6\uff08\u4ea4\u4f5c\u4e1a\u3001\u95ee\u95ee\u9898\uff09\uff0c\u4f46\u5bf9\u5347\u7ea7\u62a5\u8bfe\uff08\u77ed\u89c6\u9891/AIGC\u8bfe\uff09\u8868\u73b0\u51fa\u660e\u663e\u7684\u72b9\u8c6b\u3001\u6bd4\u4ef7\u3001\u6c42\u8bc1\u884c\u4e3a\uff0c\u5c5e\u4e8e\u201c\u79ef\u6781\u8ddf\u8fdb\u4f46\u51b3\u7b56\u8c28\u614e\u201d\u7684\u7c7b\u578b\u3002\n*   **\u6b65\u9aa44\uff1a\u98ce\u9669\u8010\u53d7**\uff1a**\u4f4e\u98ce\u9669\u8010\u53d7**\u3002\u5bf9\u4ef7\u683c\u6781\u5ea6\u654f\u611f\uff08\u53cd\u590d\u786e\u8ba4\u8d39\u7528\uff09\uff0c\u5bf9\u5b66\u4e60\u5931\u8d25\u6709\u9884\u8bbe\u6050\u60e7\uff08\u201c\u6015\u5b66\u4e0d\u4f1a\u201d\uff09\uff0c\u4e14\u5df2\u6709\u9000\u8d39\u7ecf\u5386\uff08\u6709\u58f0\u8fdb\u9636\u8bfe\u5df2\u9000\uff09\uff0c\u8868\u660e\u5176\u8bd5\u9519\u6210\u672c\u9ad8\uff0c\u51b3\u7b56\u4fdd\u5b88\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b\uff1aT5 \u7cbe\u6253\u7ec6\u7b97\u7684\u52a1\u5b9e\u8005**\u3002\n    *   **\u4f9d\u636e**\uff1a\u9ad8\u5ea6\u5173\u6ce8\u4ef7\u683c\u4e0e\u6027\u4ef7\u6bd4\uff08\u53cd\u590d\u8be2\u95ee\u4ef7\u683c\u3001\u4e0e\u540c\u5b66\u6bd4\u4ef7\uff09\uff1b\u5b66\u4e60\u884c\u4e3a\u52a1\u5b9e\uff08\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u7d22\u8981\u798f\u5229\uff09\uff1b\u5bf9\u201c\u989d\u5916\u82b1\u8d39\u201d\u548c\u201c\u53d8\u73b0\u6548\u7387\u201d\u6781\u4e3a\u654f\u611f\uff1b\u51b3\u7b56\u524d\u9700\u8981\u5927\u91cf\u4fe1\u606f\u786e\u8ba4\u548c\u5bf9\u6bd4\u3002\u540c\u65f6\u5e26\u6709\u90e8\u5206**T7 \u4fe1\u606f\u8fc7\u8f7d\u7684\u89c2\u671b\u8005**\u7279\u5f81\uff0c\u6613\u53d7\u5916\u90e8\u4fe1\u606f\uff08\u540c\u5b66\u3001\u7fa4\u804a\uff09\u5f71\u54cd\uff0c\u51b3\u7b56\u7f13\u6162\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669\u7b49\u7ea7\uff1a\u4e2d**\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u4e0d\u53ca\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u201c\u53d8\u73b0\u201d\u6709\u660e\u786e\u4f46\u6a21\u7cca\u7684\u671f\u5f85\uff08\u201c\u505a\u6f2b\u5267\u4e0a\u67b6\u201d\uff09\uff0c\u4e14\u5df2\u5bf9\u6709\u58f0\u8bfe\u53d8\u73b0\u6548\u7387\u5931\u671b\u3002\u82e5\u77ed\u89c6\u9891\u8bfe\u65e0\u6cd5\u5feb\u901f\u6ee1\u8db3\u5176\u53d8\u73b0\u9884\u671f\uff0c\u6781\u6613\u5f15\u53d1\u5931\u671b\u548c\u6295\u8bc9\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u4ef7\u683c\u654f\u611f\uff0c\u4e14\u63d0\u53ca\u5df2\u6709\u4e07\u5143\u7ea7\u8bfe\u7a0b\u652f\u51fa\uff0c\u7ecf\u6d4e\u538b\u529b\u611f\u77e5\u660e\u663e\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u591a\u6b21\u63d0\u53ca\u4e0a\u73ed\u3001\u65f6\u95f4\u7d27\u5f20\uff0c\u82e5\u8bfe\u7a0b\u5b89\u6392\u4e0e\u5de5\u4f5c\u51b2\u7a81\uff0c\u53ef\u80fd\u6210\u4e3a\u9000\u8d39\u7406\u7531\u3002\n    4.  **\u8bfe\u7a0b\u8d28\u91cf**\uff1a**\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u5bf9\u5f53\u524d\u5199\u4f5c\u8bfe\u73ed\u4e3b\u4efb\u670d\u52a1\u6ee1\u610f\uff0c\u672a\u62b1\u6028\u8bfe\u7a0b\u5185\u5bb9\u3002\n    5.  **\u9500\u552e\u8bef\u5bfc**\uff1a**\u4f4e\u98ce\u9669**\u3002\u9500\u552e\u6c9f\u901a\u4e2d\u672a\u53d1\u73b0\u5938\u5927\u627f\u8bfa\uff0c\u4f46**\u5b58\u5728\u6a21\u7cca\u5730\u5e26**\uff08\u5982\u201c\u7edd\u5bf9\u4e0d\u518d\u6536\u4e00\u5206\u94b1\u201d vs \u5de5\u5177\u514d\u8d39\u4f46\u672a\u660e\u786e\u5176\u4ed6\u6f5c\u5728\u6210\u672c\uff09\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\n    7.  **\u7ade\u54c1\u6bd4\u8f83**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u4e3b\u52a8\u8fdb\u884c\u5916\u90e8\u6bd4\u4ef7\uff08\u540c\u5b66\u59043500\u5143\uff09\uff0c\u4e14\u5bf9\u884c\u4e1a\u4fe1\u606f\u6709\u6536\u96c6\u884c\u4e3a\uff0c\u6613\u53d7\u66f4\u4f4e\u4ef7\u683c\u6216\u201c\u66f4\u597d\u201d\u627f\u8bfa\u5438\u5f15\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u603b\u4f53\u5408\u89c4\uff0c\u4f46\u5b58\u5728\u98ce\u9669\u70b9**\uff1a\n    *   **\u2705 \u672a\u53d1\u73b0\u8fc7\u5ea6\u627f\u8bfa**\uff1a\u9500\u552e\u672a\u4fdd\u8bc1\u6536\u5165\u3001\u672a\u627f\u8bfa\u4fdd\u5e95\u7b7e\u7ea6\u3002\n    *   **\u26a0\ufe0f \u5b58\u5728\u5bf9\u6bd4\u4e0e\u8d2c\u4f4e**\uff1a\u9500\u552e\u5728\u5bf9\u8bdd\u4e2d**\u9690\u6666\u8d2c\u4f4e\u7ade\u54c1\uff08\u6709\u58f0\u8bfe\u7a0b\uff09**\uff0c\u5e76\u62ac\u9ad8\u5199\u4f5c/\u77ed\u89c6\u9891\u8bfe\u4ef7\u503c\uff08\u201c\u8ba4\u77e5\u66f4\u9ad8\u201d\u3001\u201c\u66f4\u5bb9\u6613\u53d8\u73b0\u201d\uff09\uff0c\u867d\u672a\u6307\u540d\u9053\u59d3\uff0c\u4f46\u5b58\u5728\u4e0d\u5f53\u5bf9\u6bd4\u98ce\u9669\u3002\n    *   **\u26a0\ufe0f \u4ef7\u683c\u8868\u8ff0\u9700\u4e25\u8c28**\uff1a\u9500\u552e\u5bf9\u201c20000\u5143\u201d\u4f20\u95fb\u7684\u89e3\u91ca\u8f83\u4e3a\u590d\u6742\uff0c\u867d\u610f\u5728\u6f84\u6e05\uff0c\u4f46\u53ef\u80fd\u8ba9\u7528\u6237\u66f4\u56f0\u60d1\u3002\u5bf9\u4e8e\u8bfe\u7a0b\u4ef7\u683c\uff083980\uff09\u5e94\u4fdd\u6301\u53e3\u5f84\u4e00\u81f4\u3002\n    *   **\u2705 \u672a\u53d1\u73b0\u50ac\u5355\u538b\u8feb**\uff1a\u9500\u552e\u8ddf\u8fdb\u8282\u594f\u5c1a\u53ef\uff0c\u672a\u5728\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u665a\u70b9\u201d\u540e\u5f3a\u884c\u903c\u5355\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6\uff1a\u504f\u5dee**\u3002\u7528\u6237\u6838\u5fc3\u8bc9\u6c42\u662f\u201c\u9ad8\u6548\u3001\u660e\u786e\u3001\u4f4e\u6210\u672c\u7684\u53d8\u73b0\u8def\u5f84\u201d\uff0c\u4f46\u77ed\u89c6\u9891/AIGC\u8bfe\u7a0b\u5c5e\u4e8e\u6280\u80fd\u6df1\u5316\u548c\u5de5\u5177\u5e94\u7528\u8bfe\u7a0b\uff0c\u53d8\u73b0\u5468\u671f\u548c\u7ed3\u679c\u4e0d\u786e\u5b9a\u6027\u8f83\u9ad8\uff0c\u4e0e\u7528\u6237\u6025\u5207\u7684\u3001\u4f4e\u98ce\u9669\u7684\u53d8\u73b0\u671f\u671b\u5b58\u5728**\u6f5c\u5728\u9519\u914d**\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**\u9996\u5468\u91cd\u70b9\u6821\u6b63\u53d8\u73b0\u9884\u671f\u4e0e\u5b66\u4e60\u8def\u5f84**\n*   **\u5177\u4f53\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9884\u671f\u7ba1\u7406**\uff1a\u5728\u7528\u6237\u62a5\u540d\u540e\uff08\u82e5\u53d1\u751f\uff09\uff0c**\u7b2c\u4e00\u65f6\u95f4\u8fdb\u884c\u4e00\u5bf9\u4e00\u6c9f\u901a**\uff0c\u6e05\u6670\u8bf4\u660e\uff1a\u2460\u8bfe\u7a0b\u6838\u5fc3\u662f\u638c\u63e1AI\u89c6\u9891\u5236\u4f5c\u6280\u80fd\uff1b\u2461\u53d8\u73b0\u53d6\u51b3\u4e8e\u4e2a\u4eba\u6295\u5165\u3001\u4f5c\u54c1\u8d28\u91cf\u53ca\u5e02\u573a\u673a\u4f1a\uff1b\u2462\u63d0\u4f9b\u8fc7\u5f80\u5b66\u5458\u7684**\u771f\u5b9e\u6848\u4f8b\uff08\u5305\u62ec\u6210\u529f\u4e0e\u666e\u901a\u6848\u4f8b\uff09\u53ca\u5927\u81f4\u5468\u671f**\uff0c\u964d\u4f4e\u5176\u4e0d\u5207\u5b9e\u9645\u7684\u5e7b\u60f3\u3002\n    2.  **\u5b66\u4e60\u89c4\u5212**\uff1a\u7ed3\u5408\u5176\u201c\u4e0a\u73ed\u65cf\u201d\u8eab\u4efd\uff0c\u5e2e\u52a9\u5236\u5b9a**\u53ef\u884c\u7684\u3001\u788e\u7247\u5316\u7684\u5b66\u4e60\u8ba1\u5212**\uff0c\u5f3a\u8c03\u56de\u653e\u548c\u4f5c\u4e1a\u8f85\u5bfc\u7684\u4ef7\u503c\uff0c\u7f13\u89e3\u5176\u65f6\u95f4\u7126\u8651\u3002\n    3.  **\u98ce\u9669\u9694\u79bb**\uff1a\u660e\u786e\u544a\u77e5\u8bfe\u7a0b\u5305\u542b\u5185\u5bb9\u3001\u5de5\u5177\uff08\u54ea\u4e9b\u514d\u8d39/\u4ed8\u8d39\uff09\u3001\u670d\u52a1\u8fb9\u754c\uff0c\u907f\u514d\u540e\u7eed\u56e0\u201c\u989d\u5916\u8d39\u7528\u201d\u6216\u201c\u670d\u52a1\u8303\u56f4\u201d\u4ea7\u751f\u7ea0\u7eb7\u3002**\u4e66\u9762\u786e\u8ba4\u5173\u952e\u627f\u8bfa**\u3002\n    4.  **\u5efa\u7acb\u4fe1\u4efb**\uff1a\u5ef6\u7eed\u5f53\u524d\u826f\u597d\u7684\u670d\u52a1\u5173\u7cfb\uff0c\u5bf9\u5176\u95ee\u9898\u53ca\u65f6\u3001\u8010\u5fc3\u89e3\u7b54\uff0c\u6210\u4e3a\u5176\u53ef\u9760\u7684\u4fe1\u606f\u6e90\uff0c\u51cf\u5c11\u5176\u4ece\u5916\u90e8\u83b7\u53d6\u6df7\u4e71\u4fe1\u606f\u7684\u52a8\u673a\u3002\n    5.  **\u5173\u6ce8\u4fe1\u53f7**\uff1a\u5bc6\u5207\u7559\u610f\u5176\u5f00\u8bfe\u540e\u7684\u5b8c\u6210\u5ea6\u3001\u63d0\u95ee\u9891\u7387\u53ca\u60c5\u7eea\u53d8\u5316\u3002\u4e00\u65e6\u51fa\u73b0\u201c\u5b66\u4e0d\u4f1a\u201d\u3001\u201c\u6ca1\u7528\u201d\u3001\u201c\u6d6a\u8d39\u65f6\u95f4\u201d\u7b49\u8d1f\u9762\u53cd\u9988\uff0c\u9700\u7acb\u5373\u4ecb\u5165\uff0c\u63d0\u4f9b\u989d\u5916\u8f85\u5bfc\u6216\u8fdb\u884c\u5b66\u4e60\u76ee\u6807\u590d\u76d8\u3002\n\n{\"core_type\": \"T5 \u7cbe\u6253\u7ec6\u7b97\u7684\u52a1\u5b9e\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u9996\u5468\u91cd\u70b9\u6821\u6b63\u53d8\u73b0\u9884\u671f\u4e0e\u5b66\u4e60\u8def\u5f84\"}";
