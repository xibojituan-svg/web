    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677169146 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e-\u7f57\u5e03\u6cca(\u4efb\u4f1f) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u9a6c\u62c9\u96c5\u6500\u767b\u8ba1\u5212\u7cbe\u82f1\u7248\uff08\u5df2\u652f\u4ed8\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u4ec5\u663e\u793a\u201c\u652f\u4ed8\u6210\u529f\u201d\uff0c\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u5206\u671f\u6216\u501f\u8d37\u60c5\u51b5\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u591a\u6b21\u63d0\u53ca\u201c\u4e0a\u73ed\u65f6\u95f4\u201d\u3001\u201c\u592a\u5fd9\u4e86\u201d\uff0c\u8868\u660e\u5b66\u4e60\u65f6\u95f4\u9700\u4ece\u5de5\u4f5c\u95f4\u9699\u4e2d\u6324\u51fa\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u4fe1\u606f\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u7528\u6237\u53d1\u8a00\u6781\u5c11\uff08\u4ec58\u6761\uff09\uff0c\u4e14\u5747\u4e3a\u7b80\u77ed\u56de\u5e94\uff0c\u65e0\u6cd5\u5224\u65ad\u6df1\u5c42\u52a8\u673a\u3001\u5bb6\u5ead\u72b6\u51b5\u3001\u5fc3\u7406\u5f39\u6027\u7b49\u5173\u952e\u7ef4\u5ea6\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u6781\u7aef\u6025\u8feb\u6216\u201c\u51e0\u5929\u5185\u63d0\u73b0\u201d\u7684\u72c2\u70ed\u3002\u6709\u5b66\u4e60\u884c\u52a8\uff08\u5b8c\u6210\u4f5c\u4e1a\u3001\u770b\u5f55\u64ad\u8bfe\uff09\uff0c\u4f46\u4e92\u52a8\u6df1\u5ea6\u6709\u9650\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u517c\u804c\u201d (\u5bf9\u201c\u517c\u804c\u8fd8\u662f\u5168\u804c\u201d\u95ee\u9898\u7684\u76f4\u63a5\u56de\u7b54)\uff1b> \u201c\u597d\u7684\uff0c\u8c22\u8c22\u201d (\u5bf9\u9500\u552e\u5b89\u6392\u5b66\u4e60\u8ba1\u5212\u7684\u56de\u5e94)\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u5df2\u652f\u4ed8\u6b63\u4ef7\u8bfe\u7a0b\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\u6216\u501f\u8d37\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u652f\u4ed8\u65b9\u5f0f\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u5bbd\u88d5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e** \u2014 \u660e\u786e\u8868\u793a\u201c\u4e0a\u73ed\u65f6\u95f4\u53ea\u80fd\u542c\uff0c\u4e0d\u80fd\u8bf4\u8bdd\u201d\u3001\u201c\u592a\u5fd9\u4e86\uff0c\u6ca1\u542c\u4e0a\u8bfe\u201d\u3001\u201c\u5176\u4ed6\u7684\uff0c\u665a\u70b9\u513f\u64cd\u4f5c\uff0c\u4e0a\u73ed\u201d\u3002\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\uff0c\u662f\u660e\u663e\u7684\u77ed\u677f\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u65e0\u4efb\u4f55\u76f8\u5173\u4fe1\u606f\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u4fe1\u606f\u4e0d\u8db3**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u672a\u8868\u73b0\u51fa\u4efb\u4f55\u60c5\u7eea\u6ce2\u52a8\uff08\u65e0\u8bba\u662f\u79ef\u6781\u8fd8\u662f\u6d88\u6781\uff09\u3002\u9762\u5bf9\u9500\u552e\u7684\u5bc6\u96c6\u6307\u5bfc\u548c\u9f13\u52b1\uff0c\u56de\u5e94\u975e\u5e38\u7b80\u77ed\u3001\u88ab\u52a8\u3002\u65e0\u6cd5\u5224\u65ad\u5176\u9762\u5bf9\u632b\u6298\u65f6\u7684\u53cd\u5e94\u6a21\u5f0f\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u597d\u68d2\u554a\uff0c\u5e08\u59d0\u8bfb\u7684\u201d (\u552f\u4e00\u4e00\u6b21\u4e3b\u52a8\u7684\u79ef\u6781\u53cd\u9988\uff0c\u4f46\u4ecd\u662f\u9488\u5bf9\u4ed6\u4eba\u7684\u8bc4\u4ef7\uff0c\u800c\u975e\u81ea\u6211\u8868\u8fbe)\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42\uff08\u7126\u8651\u4fdd\u969c\uff09**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u672a\u6765\u7684\u4e0d\u786e\u5b9a\u6027\u548c\u804c\u4e1a\u8f6c\u578b\u7684\u7126\u8651**\u3002\u9009\u62e9\u201c\u517c\u804c\u201d\u800c\u975e\u201c\u5168\u804c\u201d\uff0c\u8868\u660e\u5176\u6838\u5fc3\u8bc9\u6c42\u662f\u5728\u73b0\u6709\u5de5\u4f5c\u4e4b\u5916\uff0c\u5bfb\u6c42\u4e00\u4efd\u7a33\u5b9a\u7684\u3001\u6709\u4fdd\u969c\u7684\u989d\u5916\u6536\u5165\u6765\u6e90\uff0c\u4ee5\u62b5\u5fa1\u6f5c\u5728\u7684\u7ecf\u6d4e\u98ce\u9669\u6216\u804c\u4e1a\u5026\u6020\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u4e0e\u8def\u5f84\u611f**\u3002\u4ed6\u9700\u8981\u6e05\u6670\u7684\u3001\u53ef\u6267\u884c\u7684\u517c\u804c\u53d8\u73b0\u8def\u5f84\u56fe\uff0c\u4ee5\u53ca\u201c\u8ddf\u7740\u505a\u5c31\u80fd\u6709\u7ed3\u679c\u201d\u7684\u7a33\u5b9a\u9884\u671f\u3002\u9500\u552e\u63d0\u4f9b\u7684\u201c\u65f6\u85aa90-300\u201d\u3001\u201c\u7248\u6743\u4e66\u201d\u3001\u201c\u5165\u5267\u7ec4\u7fa4\u201d\u7b49\u5177\u4f53\u8d44\u6e90\uff0c\u6b63\u662f\u51fb\u4e2d\u4e86\u4ed6\u7684\u5b89\u5168\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1\u7c7b** (\u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u5f52\u4e3a\u5174\u8da3/\u89c2\u671b\u578b\uff0c\u9700\u540e\u7eed\u89c2\u5bdf) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T5 \u597d\u73a9\u5c1d\u9c9c\u8005 / T2 \u4f4e\u8c03\u8001\u9ec4\u725b (\u5f85\u89c2\u5bdf)** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 **\u5b89\u5168\u672a\u89e6\u53d1**\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u3001\u96f6\u4e92\u52a8\u6216\u8d44\u6e90\u76d7\u69a8\u7b49\u5371\u9669\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4f4e** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u56e0\u5176\u4e3a\u517c\u804c\u4e14\u65f6\u95f4\u7d27\u5f20\uff0c\u5bb6\u5ead\u5e72\u9884\u98ce\u9669\u76f8\u5bf9\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u8fd9\u662f\u6700\u9ad8\u98ce\u9669\u70b9**\u3002\u5176\u201c\u4e0a\u73ed\u592a\u5fd9\u201d\u7684\u73b0\u72b6\u4e0e\u8bfe\u7a0b\u8981\u6c42\u7684\u76f4\u64ad\u3001\u4f5c\u4e1a\u3001\u4e92\u52a8\u5b58\u5728\u4e25\u91cd\u51b2\u7a81\u3002\u4e00\u65e6\u5de5\u4f5c\u7e41\u5fd9\u52a0\u5267\uff0c\u6781\u6613\u56e0\u201c\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\u201d\u800c\u4ea7\u751f\u81ea\u8d23\u3001\u7126\u8651\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4e2d** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u56e0\u5176\u4e92\u52a8\u88ab\u52a8\uff0c\u53ef\u80fd\u5c5e\u4e8e\u5185\u5411\u6216\u9ad8\u81ea\u5c0a\u578b\u3002\u82e5\u5728\u521d\u671f\u4f5c\u4e1a\u6216\u8bd5\u97f3\u4e2d\u906d\u9047\u4e25\u5389\u6279\u8bc4\u6216\u5931\u8d25\uff0c\u53ef\u80fd\u56e0\u201c\u4e22\u9762\u5b50\u201d\u800c\u9ed8\u9ed8\u9000\u51fa\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u5bf9\u517c\u804c\u53d8\u73b0\u6709\u660e\u786e\u671f\u5f85\u3002\u82e5\u5728\u627f\u8bfa\u7684\u201c\u5b66\u4e60\u671f\u95f4\u201d\u5185\u672a\u80fd\u83b7\u5f97\u4efb\u4f55\u5b9e\u8d28\u6027\u7684\u63a5\u5355\u673a\u4f1a\u6216\u6b63\u5411\u53cd\u9988\uff0c\u4f1a\u4ea7\u751f\u88ab\u6b3a\u9a97\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\u3002\u6b64\u65f6\u8bfe\u7a0b\u96be\u5ea6\u548c\u4f5c\u4e1a\u91cf\u589e\u52a0\uff0c\u800c\u5176\u5de5\u4f5c\u4e0e\u5b66\u4e60\u7684\u65f6\u95f4\u77db\u76fe\u5c06\u96c6\u4e2d\u7206\u53d1\uff0c\u82e5\u672a\u83b7\u5f97\u4efb\u4f55\u517c\u804c\u6536\u5165\u6216\u6210\u5c31\u611f\uff0c\u9000\u8d39\u98ce\u9669\u6781\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u770b\u5230\u4f60\u5de5\u4f5c\u5f88\u5fd9\u8fd8\u575a\u6301\u5b66\u4e60\uff0c\u771f\u7684\u5f88\u4f69\u670d\u4f60\u7684\u884c\u52a8\u529b\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u7a0b\u5c31\u662f\u4e3a\u517c\u804c\u8bbe\u8ba1\u7684\uff0c\u6240\u6709\u76f4\u64ad\u90fd\u6709\u56de\u653e\uff0c\u4f5c\u4e1a\u63d0\u4ea4\u65f6\u95f4\u4e5f\u5f88\u7075\u6d3b\u3002\u4f60\u4e0d\u7528\u6709\u2018\u6389\u961f\u2019\u7684\u538b\u529b\uff0c\u6211\u4f1a\u6839\u636e\u4f60\u7684\u65f6\u95f4\u8282\u594f\uff0c\u5e2e\u4f60\u89c4\u5212\u6700\u7701\u529b\u3001\u6700\u9ad8\u6548\u7684\u5b66\u4e60\u8def\u5f84\uff0c\u786e\u4fdd\u6bcf\u4e00\u6b65\u90fd\u8e29\u5728\u517c\u804c\u53d8\u73b0\u7684\u8282\u70b9\u4e0a\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011**\u3002\u6838\u5fc3\u662f\u7f29\u77ed\u5176\u4ece\u5b66\u4e60\u5230\u83b7\u5f97\u7b2c\u4e00\u7b14\u517c\u804c\u6536\u5165\u7684\u8def\u5f84\u3002\u4f18\u5148\u63d0\u4f9b\u624b\u673a\u7aef\u5373\u53ef\u5b8c\u6210\u7684\u3001\u77ed\u5e73\u5feb\u7684\u8bd5\u97f3\u5355\uff0c\u5efa\u7acb\u65e9\u671f\u6b63\u53cd\u9988\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u5f39\u6027\u65f6\u95f4\u7ba1\u7406\u5305\u3011** \u548c **\u3010\u9632\u6389\u961f\u63d0\u9192\u5305\u3011**\u3002\u4f8b\u5982\uff1a\u63d0\u4f9b\u6240\u6709\u4efb\u52a1\u7684\u6587\u5b57\u7248\u8981\u70b9\u603b\u7ed3\u3001\u8bbe\u7f6e\u4e2a\u6027\u5316\u4f46\u975e\u5f3a\u5236\u7684\u63d0\u9192\u3001\u5141\u8bb8\u4f5c\u4e1a\u5ef6\u8fdf\u63d0\u4ea4\uff08\u9700\u63d0\u524d\u62a5\u5907\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u6700\u540e\u540d\u989d\u201d\u3001\u201c\u5012\u8ba1\u65f6\u201d\u7b49\u5236\u9020\u7126\u8651\u7684\u8bdd\u672f\u903c\u5355\uff1b\u5728\u5176\u62b1\u6028\u5de5\u4f5c\u5fd9\u65f6\uff0c\u56de\u590d\u201c\u522b\u4eba\u90fd\u80fd\u505a\u5230\uff0c\u4f60\u4e3a\u4ec0\u4e48\u4e0d\u884c\u201d\uff1b\u5e03\u7f6e\u5927\u91cf\u9700\u8981\u6574\u5757\u65f6\u95f4\u624d\u80fd\u5b8c\u6210\u7684\u590d\u6742\u4f5c\u4e1a\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u521d\u671f\uff08\u524d2\u4e2a\u6708\uff09\u8fdb\u884c\u5927\u989d\u5347\u5355\u63a8\u4ecb**\u3002\u53ea\u6709\u5f53\u5176\u901a\u8fc7\u517c\u804c\u83b7\u5f97\u7a33\u5b9a\u5c0f\u989d\u6536\u5165\u3001\u5efa\u7acb\u4fe1\u5fc3\u540e\uff0c\u65b9\u53ef\u8bd5\u63a2\u6027\u63a8\u8350\u8fdb\u9636\u8bfe\u7a0b\u3002\u4f18\u5148\u63a8\u8350**\u4f4e\u5ba2\u5355\u4ef7\u3001\u9ad8\u5b9e\u7528\u6027\u7684\u5fae\u8bfe\u6216\u5de5\u5177\u5305**\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u517c\u804c\u201d **(\u6838\u5fc3\u52a8\u673a\u951a\u70b9)**\n2. > \u201c\u4e0a\u73ed\u65f6\u95f4\u53ea\u80fd\u542c\uff0c\u4e0d\u80fd\u8bf4\u8bdd\u54c8[\u51b7\u6c57]\u201d **(\u8d44\u6e90\u5e95\u5ea7\u77ed\u677f\u6838\u5fc3\u8bc1\u636e)**\n3. > \u201c\u4eca\u5929\u4e2d\u5348\u592a\u5fd9\u4e86\uff0c\u6ca1\u542c\u4e0a\u8bfe\uff0c\u6ca1\u6709\u56de\u653e\u5417\u201d **(\u65f6\u95f4\u51b2\u7a81\u4e0e\u8ddf\u8fdb\u98ce\u9669\u7684\u76f4\u63a5\u4f53\u73b0)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010\u6c89\u9ed8\u89c2\u671b\u578b\u517c\u804c\u8005\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e00\u4efd\u6709\u786e\u5b9a\u6027\u7684\u517c\u804c\u6536\u5165\u4fdd\u969c\uff08\u5b89\u5168\u9700\u6c42\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u5ea6\u5f39\u6027\u7684\u65f6\u95f4\u5b89\u6392\u4e0e\u6e05\u6670\u7684\u3001\u53ef\u5feb\u901f\u9a8c\u8bc1\u7684\u517c\u804c\u63a5\u5355\u8def\u5f84\uff0c\u7528\u65e9\u671f\u5fae\u5c0f\u6210\u529f\u5efa\u7acb\u5176\u4fe1\u5fc3\u3011**\u3002\n\n```json\n{\"core_type\": \"T5/T2 \u5f85\u89c2\u5bdf\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\u9ad8\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf+\u5f39\u6027\u65f6\u95f4\u7ba1\u7406\u5305\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
