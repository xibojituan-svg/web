    <script>
        const markdownText = "\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e\u3002\u7f3a\u4e4f\u7528\u6237\u5e74\u9f84\u3001\u6027\u522b\u3001\u57ce\u5e02\u3001\u804c\u4e1a\u3001\u6536\u5165\u3001\u5bb6\u5ead\u72b6\u51b5\u3001\u5177\u4f53\u5b66\u4e60\u76ee\u6807\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u3001\u652f\u4ed8\u80fd\u529b\u3001\u51b3\u7b56\u81ea\u4e3b\u6027\u7b49\u5173\u952e\u4fe1\u606f\u3002\n\n# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u4e0e\u98ce\u63a7\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49)**\n    *   **\u8868\u5c42**: \u5b66\u4e60AI\u77ed\u89c6\u9891\u6280\u80fd\uff0c\u5bfb\u6c42\u526f\u4e1a/\u517c\u804c\u53d8\u73b0\u3002\n    *   **\u6df1\u5c42**: \u5bf9\u201c\u957f\u671f\u505a\u201d\u526f\u4e1a\u6709\u660e\u786e\u610f\u5411\uff0c\u5bf9\u5546\u5355\u3001\u5de5\u4f5c\u5ba4\u7b7e\u7ea6\u7b49\u5177\u4f53\u53d8\u73b0\u8def\u5f84\u8868\u73b0\u51fa\u5174\u8da3\u3002**\u52a8\u673a\u504f\u5411\u5b9e\u7528\u4e3b\u4e49\uff0c\u4f46\u672a\u660e\u786e\u8868\u8fbe\u5177\u4f53\u7ecf\u6d4e\u538b\u529b\u6216\u5f3a\u70c8\u6539\u53d8\u73b0\u72b6\u7684\u6e34\u671b\u3002**\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4fe1\u606f\u4e0d\u8db3)**\n    *   **\u65f6\u95f4**: \u8868\u793a\u201c\u8fd9\u51e0\u5929\u6211\u90fd\u6709\u65f6\u95f4\u201d\u3001\u201c\u6682\u65f6\u6ca1\u4e8b\u201d\uff0c\u6697\u793a\u8fd1\u671f\u65f6\u95f4\u5145\u88d5\uff0c\u4f46**\u957f\u671f\u65f6\u95f4\u6295\u5165\u7a33\u5b9a\u6027\u672a\u77e5**\u3002\n    *   **\u8bbe\u5907/\u6280\u80fd**: \u63d0\u53ca\u201c\u6709\u7535\u8111\u57fa\u7840\u201d\uff0c\u5177\u5907\u57fa\u672c\u5b66\u4e60\u6761\u4ef6\u3002\n    *   **\u7ecf\u6d4e/\u793e\u4f1a**: **\u5b8c\u5168\u7f3a\u5931**\u3002\u65e0\u6536\u5165\u3001\u50a8\u84c4\u3001\u5bb6\u5ead\u8d1f\u62c5\u7b49\u4fe1\u606f\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u7b49\u504f\u9ad8)**\n    *   **\u914d\u5408\u5ea6**: \u9ad8\u3002\u79ef\u6781\u56de\u5e94\u9500\u552e\uff0c\u6309\u65f6\u4e0a\u8bfe\uff0c\u5b8c\u6210\u4f5c\u4e1a\uff0c\u590d\u5236\u53e3\u4ee4\u3002\n    *   **\u4e3b\u52a8\u6027**: \u4e2d\u7b49\u3002\u4e3b\u52a8\u8be2\u95ee\u201c\u4eca\u5929\u6709\u4f5c\u4e1a\u662f\u5427\u201d\u3001\u201c\u8001\u5e08\uff0c\u73b0\u5728\u6709\u65f6\u95f4\u5417\u201d\uff0c\u5e76\u63d0\u4ea4\u4f5c\u4e1a\u3002\u4f46\u63d0\u95ee\u6df1\u5ea6\u8f83\u6d45\uff0c\u591a\u56f4\u7ed5\u6d41\u7a0b\u3002\n    *   **\u6297\u538b/\u575a\u6301**: **\u672a\u77e5**\u3002\u672a\u7ecf\u5386\u632b\u6298\u6216\u538b\u529b\u6d4b\u8bd5\uff0c\u4ec5\u8868\u73b0\u51fa\u521d\u6b65\u7684\u5b66\u4e60\u987a\u4ece\u6027\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 \u652f\u4ed8\u6838\u67e5**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u63d0\u53ca\u4ef7\u683c\u201c2980\u201d\u5e76\u5b8c\u6210\u62a5\u540d\uff0c\u8fdb\u5165\u73ed\u7ea7\u7fa4\u3002\n*   **\u6b65\u9aa41.5 \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u6216\u4ed6\u4eba\u610f\u89c1\uff0c\u7528\u6237\u8868\u73b0\u51fa\u72ec\u7acb\u51b3\u7b56\u7684\u8868\u8c61\uff0c\u4f46\u65e0\u6cd5\u786e\u8ba4\u662f\u5426\u5b58\u5728\u9690\u6027\u5bb6\u5ead\u538b\u529b\u6216\u5171\u540c\u51b3\u7b56\u3002\n*   **\u6b65\u9aa41 \u9700\u6c42\u5f3a\u5ea6**: B\u7c7b\uff08\u4e2d\u7b49\uff09\u3002\u6709\u660e\u786e\u5b66\u4e60\u610f\u613f\u548c\u201c\u957f\u671f\u505a\u201d\u7684\u6253\u7b97\uff0c\u4f46\u9700\u6c42\u591a\u7531\u9500\u552e\u5f15\u5bfc\u548c\u5851\u9020\uff0c\u81ea\u53d1\u4ea7\u751f\u7684\u3001\u5177\u4f53\u5316\u7684\u75db\u70b9\u63cf\u8ff0\u7f3a\u5931\u3002\n*   **\u6b65\u9aa42 \u652f\u4ed8\u80fd\u529b**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u65e0\u6cd5\u8bc4\u4f302980\u5143\u5bf9\u5176\u7ecf\u6d4e\u538b\u529b\u6c34\u5e73\u3002\n*   **\u6b65\u9aa43 \u884c\u52a8\u529b**: B\u7c7b\uff08\u4e2d\u7b49\uff09\u3002\u80fd\u8ddf\u4e0a\u8bfe\u7a0b\u8282\u594f\uff0c\u5b8c\u6210\u6307\u4ee4\u6027\u52a8\u4f5c\uff08\u542c\u8bfe\u3001\u4ea4\u4f5c\u4e1a\uff09\uff0c\u4f46\u7f3a\u4e4f\u8d85\u51fa\u5f15\u5bfc\u5916\u7684\u81ea\u4e3b\u63a2\u7d22\u884c\u4e3a\u3002\n*   **\u6b65\u9aa44 \u76ee\u6807\u611f**: B\u7c7b\uff08\u4e2d\u7b49\uff09\u3002\u76ee\u6807\u4e3a\u201c\u53d8\u73b0\u201d\uff0c\u4f46\u5177\u4f53\u76ee\u6807\uff08\u5982\u6708\u589e\u6536\u591a\u5c11\u3001\u4f55\u65f6\u63a5\u5355\uff09\u6a21\u7cca\uff0c\u6613\u53d7\u9500\u552e\u63cf\u7ed8\u7684\u201c\u5546\u5355\u201d\u3001\u201c\u7b7e\u7ea6\u201d\u7b49\u524d\u666f\u5f71\u54cd\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**: **B-\u7c7b (\u5f85\u89c2\u5bdf\u578b)**\u3002\u5df2\u5b8c\u6210\u652f\u4ed8\uff0c\u6709\u57fa\u7840\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\uff0c\u4f46\u6838\u5fc3\u8d44\u6e90\u5e95\u5ea7\u4e0e\u6df1\u5c42\u52a8\u673a\u4e0d\u660e\uff0c\u51b3\u7b56\u72ec\u7acb\u6027\u5b58\u7591\uff0c\u9700\u540e\u7eed\u6df1\u5ea6\u8ddf\u8fdb\u786e\u8ba4\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u6700\u5339\u914d\u539f\u578b: T4 \u52a1\u5b9e\u63a2\u7d22\u8005**\n    *   \u7279\u5f81\uff1a\u76ee\u6807\u660e\u786e\uff08\u8d5a\u94b1\uff09\uff0c\u914d\u5408\u5ea6\u9ad8\uff0c\u5bf9\u5177\u4f53\u8def\u5f84\uff08\u5982\u5546\u5355\u4ef7\u683c\u3001\u5de5\u4f5c\u5ba4\u8d44\u6e90\uff09\u611f\u5174\u8da3\uff0c\u884c\u52a8\u504f\u88ab\u52a8\u8ddf\u968f\u3002\n    *   \u6b21\u5339\u914d\u539f\u578b: T2 \u7126\u8651\u6539\u5584\u8005 (\u56e0\u7126\u8651\u611f\u672a\u663e\u6027\u8868\u8fbe\uff0c\u5339\u914d\u5ea6\u8f83\u4f4e)\u3002\n*   **\u4e0d\u5339\u914d\u539f\u578b**: T1 (\u7f3a\u4e4f\u5b64\u6ce8\u4e00\u63b7\u611f)\u3001T3 (\u7f3a\u4e4f\u660e\u786e\u6210\u5c31\u5bfc\u5411)\u3001T5/T6/T7/T8 (\u672a\u8868\u73b0\u51fa\u76f8\u5e94\u60c5\u7eea\u5316\u3001\u4f9d\u8d56\u6216\u5bf9\u6297\u7279\u5f81)\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u6839\u56e01 - \u6548\u679c\u4e0d\u53ca\u9884\u671f (\u9ad8\u98ce\u9669)**: \u9500\u552e\u8fc7\u5ea6\u627f\u8bfa\u201c\u5de5\u4f5c\u5ba4\u7b7e\u7ea6\u201d\u3001\u201c\u5185\u90e8\u8d44\u6e90\u201d\u3001\u201c\u5546\u5355\u4fdd\u969c\u201d\uff0c\u6781\u6613\u5728\u5b66\u5458\u65e0\u6cd5\u5feb\u901f\u63a5\u5355\u6216\u6536\u76ca\u672a\u8fbe\u5ba3\u4f20\u65f6\u5f15\u53d1\u6295\u8bc9\u3002**\u8fd9\u662f\u4e3b\u8981\u98ce\u9669\u70b9\u3002**\n*   **\u6839\u56e02 - \u7ecf\u6d4e\u538b\u529b (\u672a\u77e5\u98ce\u9669)**: \u652f\u4ed8\u80fd\u529b\u4e0d\u660e\uff0c\u9700\u8b66\u60d5\u540e\u7eed\u56e0\u7ecf\u6d4e\u72b6\u51b5\u53d8\u5316\u5bfc\u81f4\u7684\u9000\u8d39\u3002\n*   **\u6839\u56e03 - \u65f6\u95f4\u51b2\u7a81 (\u4e2d\u98ce\u9669)**: \u7528\u6237\u76ee\u524d\u201c\u6709\u65f6\u95f4\u201d\uff0c\u4f46\u82e5\u4e3b\u4e1a\u7e41\u5fd9\u6216\u5bb6\u5ead\u4e8b\u52a1\u589e\u591a\uff0c\u53ef\u80fd\u65e0\u6cd5\u575a\u6301\u5b66\u4e60\u3002\n*   **\u6839\u56e04 - \u5185\u5bb9/\u670d\u52a1\u4e0d\u7b26 (\u4e2d\u98ce\u9669)**: \u9500\u552e\u5f3a\u8c03\u201c\u8d44\u6e90\u201d\u3001\u201c\u5546\u5355\u201d\uff0c\u82e5\u6b63\u5f0f\u8bfe\u7a0b\u91cd\u5fc3\u504f\u5411\u6280\u80fd\u6559\u5b66\u800c\u975e\u76f4\u63a5\u6d3e\u5355\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u3002\n*   **\u6839\u56e05 - \u5b66\u4e60\u632b\u8d25 (\u4e2d\u98ce\u9669)**: \u7528\u6237\u6709\u57fa\u7840\uff0c\u4f46AI\u77ed\u89c6\u9891\u5236\u4f5c\u6709\u95e8\u69db\uff0c\u9047\u5230\u96be\u70b9\u65f6\u82e5\u8f85\u5bfc\u4e0d\u53ca\u65f6\u53ef\u80fd\u653e\u5f03\u3002\n*   **\u6839\u56e06 - \u5bb6\u5ead\u53cd\u5bf9 (\u672a\u77e5\u98ce\u9669)**: \u51b3\u7b56\u6743\u4e0d\u660e\uff0c\u5b58\u5728\u9690\u60a3\u3002\n*   **\u6839\u56e07 - \u9500\u552e\u8bef\u5bfc (\u9ad8\u98ce\u9669)**: \u9500\u552e\u5927\u91cf\u4f7f\u7528\u201c\u5185\u90e8\u8d44\u6e90\u201d\u3001\u201c\u5b9a\u5411\u6d3e\u5355\u7fa4\u201d\u3001\u201c\u7b7e\u7ea6MCN\u201d\u7b49\u8bdd\u672f\uff0c**\u5b58\u5728\u5938\u5927\u548c\u8bf1\u5bfc\u6027\u627f\u8bfa\u7684\u5acc\u7591**\uff0c\u662f\u91cd\u5927\u5408\u89c4\u98ce\u9669\u70b9\u3002\n*   **\u7efc\u5408\u98ce\u9669\u7b49\u7ea7: \u9ad8**\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u26a0\ufe0f \u91cd\u5927\u8fdd\u89c4\u9884\u8b66**:\n    *   **\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u8bf1\u5bfc**: \u9500\u552e\u9891\u7e41\u4f7f\u7528\u201c\u5de5\u4f5c\u5ba4\u7b7e\u7ea6\u201d\u3001\u201c\u5185\u90e8\u8d44\u6e90\u201d\u3001\u201c\u5546\u5355\u4fdd\u969c\u201d\u3001\u201c\u5e74\u5ba1\u901a\u9053\u201d\u7b49\u8bcd\u6c47\uff0c\u6697\u793a\u4e0e\u57f9\u8bad\u7ed3\u679c\u5f3a\u7ed1\u5b9a\u7684\u5c31\u4e1a/\u6536\u5165\u4fdd\u969c\uff0c**\u6d89\u5acc\u8fdd\u53cd\u300a\u5e7f\u544a\u6cd5\u300b\u53ca\u6559\u80b2\u57f9\u8bad\u884c\u4e1a\u89c4\u8303**\u3002\n    *   **\u865a\u6784\u7d27\u8feb\u611f**: \u201c\u62fc\u624b\u901f\u62a2\u540d\u989d\u201d\u3001\u201c\u4eca\u665a\u5f00\u653e\u5c11\u91cf\u540d\u989d\u201d\u7b49\u662f\u5178\u578b\u903c\u5355\u8bdd\u672f\u3002\n    *   **\u6df7\u6dc6\u8eab\u4efd**: \u9500\u552e\u4ee5\u201c\u5e08\u59d0\u201d\u3001\u201c\u5de5\u4f5c\u5ba4\u8d1f\u8d23\u4eba\u201d\u7b49\u591a\u91cd\u8eab\u4efd\u8fdb\u884c\u8425\u9500\uff0c\u6a21\u7cca\u4e86\u9500\u552e\u4e0e\u6559\u5b66/\u8d44\u6e90\u63d0\u4f9b\u65b9\u7684\u8fb9\u754c\u3002\n*   **\u5408\u89c4\u9879**: \u7528\u6237\u5b8c\u6210\u4e86\u652f\u4ed8\u52a8\u4f5c\uff0c\u6d41\u7a0b\u4e0a\u65e0\u76f4\u63a5\u8fdd\u89c4\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6838\u5fc3\u7b56\u7565**: **\u5feb\u901f\u5efa\u7acb\u4fe1\u4efb\uff0c\u7ba1\u7406\u9884\u671f\uff0c\u592f\u5b9e\u6280\u80fd\uff0c\u8c28\u614e\u5151\u73b0\u201c\u8d44\u6e90\u201d\u627f\u8bfa\u3002**\n*   **\u884c\u52a8\u6307\u5357**:\n    1.  **\u9996\u5468\u6df1\u5ea6\u8bbf\u8c08**: \u7acb\u5373\u8fdb\u884c\u4e00\u5bf9\u4e00\u6c9f\u901a\uff0c\u91cd\u70b9\u4e86\u89e3\uff1a\u2460\u5f53\u524d\u804c\u4e1a\u3001\u6536\u5165\u72b6\u51b5\u3001\u5b66\u4e60AI\u77ed\u89c6\u9891\u7684**\u5177\u4f53\u7ecf\u6d4e\u76ee\u6807**\uff08\u5982\u6bcf\u6708\u5e0c\u671b\u589e\u52a0\u591a\u5c11\u6536\u5165\uff09\uff1b\u2461**\u6bcf\u65e5/\u6bcf\u5468\u53ef\u7a33\u5b9a\u6295\u5165\u7684\u5b66\u4e60\u65f6\u95f4**\uff1b\u2462**\u5bb6\u5ead\u662f\u5426\u652f\u6301**\uff1b\u2463\u5bf9\u201c\u5546\u5355\u201d\u3001\u201c\u7b7e\u7ea6\u201d\u7684**\u5177\u4f53\u7406\u89e3\u4e0e\u671f\u671b**\u3002\u6b64\u6b65\u9aa4\u81f3\u5173\u91cd\u8981\uff0c\u7528\u4e8e\u6821\u51c6\u9884\u671f\u5e76\u6536\u96c6\u98ce\u63a7\u4fe1\u606f\u3002\n    2.  **\u9884\u671f\u7ba1\u7406**: \u5728\u73ed\u7ea7\u7fa4\u53ca\u79c1\u4e0b\u6c9f\u901a\u4e2d\uff0c\u660e\u786e\u5f3a\u8c03\u201c\u6280\u80fd\u5b66\u4e60\u662f\u57fa\u7840\uff0c\u53d8\u73b0\u7ed3\u679c\u56e0\u4eba\u800c\u5f02\u201d\u3001\u201c\u5de5\u4f5c\u5ba4\u8d44\u6e90\u4e3a\u4f18\u79c0\u5b66\u5458\u63d0\u4f9b\u673a\u4f1a\uff0c\u975e\u4fdd\u8bc1\u6027\u5c31\u4e1a\u201d\uff0c**\u5f31\u5316\u9500\u552e\u7aef\u7684\u8fc7\u5ea6\u627f\u8bfa**\u3002\n    3.  **\u8fc7\u7a0b\u6fc0\u52b1**: \u9488\u5bf9\u5176\u201c\u52a1\u5b9e\u201d\u7279\u70b9\uff0c\u591a\u63d0\u4f9b**\u9636\u6bb5\u6027\u3001\u53ef\u8fbe\u6210\u7684\u5c0f\u76ee\u6807\u6fc0\u52b1**\uff08\u5982\u5b8c\u6210\u67d0\u4e2a\u5de5\u5177\u5b66\u4e60\u3001\u505a\u51fa\u7b2c\u4e00\u4e2a\u5b8c\u6574\u89c6\u9891\uff09\uff0c\u800c\u975e\u7a7a\u6cdb\u7684\u201c\u672a\u6765\u6536\u76ca\u201d\u753b\u997c\u3002\n    4.  **\u98ce\u9669\u76d1\u63a7**: \u5bc6\u5207\u5173\u6ce8\u5176\u5b66\u4e60\u8fdb\u5ea6\u4e0e\u4e92\u52a8\u9891\u7387\u53d8\u5316\u3002\u4e00\u65e6\u51fa\u73b0\u4f5c\u4e1a\u62d6\u5ef6\u3001\u6d88\u6781\u53d1\u8a00\uff0c\u9700\u7acb\u5373\u4ecb\u5165\uff0c\u4e86\u89e3\u662f\u65f6\u95f4\u95ee\u9898\u3001\u6280\u80fd\u56f0\u96be\u8fd8\u662f\u9884\u671f\u843d\u5dee\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**:\n    *   **\u4e3b\u7ebf**: \u6309\u90e8\u5c31\u73ed\u8ddf\u968f**AI\u77ed\u89c6\u9891\u6807\u51c6\u8bfe\u7a0b\u4f53\u7cfb**\u5b66\u4e60\uff0c\u786e\u4fdd\u6280\u80fd\u6253\u7262\u3002\n    *   **\u589e\u503c/\u6302\u8f7d**: **\u6682\u7f13\u63a8\u8350\u9ad8\u9636\u6216\u9ad8\u4ef7\u589e\u503c\u670d\u52a1**\u3002\u5f85\u5176\u5b8c\u6210\u57fa\u7840\u8bfe\u7a0b\u3001\u4ea7\u51fa\u5408\u683c\u4f5c\u54c1\u3001\u4e14\u7ecf\u8bbf\u8c08\u786e\u8ba4\u5176\u8d44\u6e90\u5e95\u5ea7\u7a33\u5b9a\u540e\uff0c\u518d\u8c28\u614e\u63a8\u8350\u5982\u201c\u5546\u5355\u5b9e\u6218\u8425\u201d\u3001\u201c\u8fdb\u9636\u526a\u8f91\u8bfe\u201d\u7b49\u4ea7\u54c1\u3002**\u5207\u5fcc\u5728\u521d\u671f\u7ee7\u7eed\u6e32\u67d3\u201c\u8d44\u6e90\u6377\u5f84\u201d\u3002**\n\n{\"core_type\": \"T4 \u52a1\u5b9e\u63a2\u7d22\u8005\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168/\u5c0a\u91cd\", \"target_product_line\": \"AI\u77ed\u89c6\u9891\u6807\u51c6\u8bfe\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}";
