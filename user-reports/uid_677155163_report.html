    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u6bb5\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677155163 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5f6c\u5f6c(\u8bb8\u5f6c) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u64ad\u6709\u58f0\u6f14\u64ad\u9ad8\u9636\u73ed\uff08\u4ef7\u683c7380\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u9700\u6838\u67e5\u662f\u5426\u4f7f\u7528\u82b1\u5457/\u5206\u671f\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u9700\u4e2d\u5348\u63a5\u5b69\u5b50\u3001\u505a\u996d\uff0c\u53ea\u80fd\u8fb9\u5403\u8fb9\u542c\uff0c\u665a\u4e0a\u6709\u201c\u4e0a\u6848\u201d\u4efb\u52a1\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\u5bb6\u5ead\u6001\u5ea6\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u4e92\u52a8\u6df1\u5165\uff0c\u6d89\u53ca\u804c\u4e1a\u3001\u751f\u6d3b\u3001\u5b66\u4e60\u7ec6\u8282\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **[\u2b06\u9ad8]**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u6210\u957f\u548c\u81ea\u6211\u63d0\u5347\u800c\u6765\uff0c\u4eab\u53d7\u5b66\u4e60\u8fc7\u7a0b\uff0c\u6709\u660e\u786e\u7684\u5174\u8da3\u65b9\u5411\uff08\u60ac\u7591\u7c7b\u3001\u9752\u53d4\u97f3\uff09\uff0c\u5e76\u613f\u610f\u4e3a\u63d0\u5347\u6280\u80fd\u4ed8\u51fa\u884c\u52a8\uff08\u5982\u8ba1\u5212\u6212\u70df\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u633a\u60f3\u5f55\u97f3\u7684\uff0c\u63d0\u5347\u81ea\u5df1[\u80dc\u5229]\u201d\uff1b> \u201c\u542c\u4e86\u4f60\u8bb2\u89e3\uff0c\u89c9\u5f97\u6211\u5728\u5f55\u8fd9\u4e2a\u60ac\u7591\u6587\u672c\u8fd8\u53ef\u4ee5\u505a\u7684\u66f4\u597d[\u80dc\u5229]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **[\u27a1\u4e2d]**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u4e2d]** \u2014 \u80fd\u652f\u4ed87380\u5143\u8bfe\u7a0b\uff0c\u4f46\u672a\u900f\u9732\u8d44\u91d1\u6765\u6e90\uff0c\u9700\u8b66\u60d5\u662f\u5426\u5b58\u5728\u501f\u8d37\u53ef\u80fd\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**[\u4f4e]** \u2014 **\u6838\u5fc3\u77ed\u677f**\u3002\u804c\u4e1a\u4e3a\u8b66\u5bdf\uff08\u201c\u4e0a\u6848\u201d\uff09\uff0c\u5de5\u4f5c\u7e41\u5fd9\u4e14\u4e0d\u89c4\u5f8b\uff0c\u540c\u65f6\u9700\u517c\u987e\u5bb6\u5ead\uff08\u4e2d\u5348\u63a5\u5b69\u5b50\uff09\uff0c\u5b66\u4e60\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u4fe1\u606f\u4e0d\u8db3]** \u2014 \u672a\u63d0\u53ca\uff0c\u4f46\u80fd\u517c\u987e\u5b69\u5b50\uff0c\u63a8\u6d4b\u6709\u4e00\u5b9a\u652f\u6301\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **[\u2b06\u9ad8]**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u201c\u55d3\u5b50\u4e0d\u5bf9\u201d\u3001\u201c\u54bd\u708e\u201d\u7b49\u5ba2\u89c2\u56f0\u96be\uff0c\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff08\u8be2\u95ee\u662f\u5426\u9700\u6212\u70df\u3001\u8dd1\u6b65\u662f\u5426\u5bf9\u6c14\u606f\u6709\u5e2e\u52a9\uff09\uff0c\u5e76\u8868\u73b0\u51fa\u79ef\u6781\u8c03\u6574\u7684\u610f\u613f\u3002\u60c5\u7eea\u7a33\u5b9a\uff0c\u65e0\u62b1\u6028\u6216\u81ea\u6211\u5426\u5b9a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u53ef\u4ee5\u6212\u70df\uff0c\u672c\u6765\u5c31\u6709\u8ba1\u5212\u6212\u4e86\uff0c\u6211\u5e73\u65f6\u8dd1\u6b65\u5e94\u8be5\u4f1a\u5bf9\u6c14\u606f\u6709\u5e2e\u52a9\u5427\u201d\uff1b\u9762\u5bf9\u9500\u552e\u201c\u673a\u5668\u4eba\u201d\u7684\u8c03\u4f83\uff0c\u4ee5\u5e7d\u9ed8\u56de\u5e94\uff08\u201c\u5c31\u77e5\u9053\u9ed8\u9ed8\u7684\u542c\u201d\uff09\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u804c\u4e1a\u8eab\u4efd\u5e26\u6765\u7684\u793e\u4ea4\u5c40\u9650\u4e0e\u81ea\u6211\u4ef7\u503c\u611f\u5bfb\u6c42**\u3002\u4f5c\u4e3a\u53bf\u57ce\u7684\u8b66\u5bdf\uff08\u201c\u5728\u4e00\u4e2a\u53bf\u91cc\u201d\u3001\u201c\u5c71\u91cc\u7684\u65ee\u65ef\u65ef\u91cc\u201d\uff09\uff0c\u4ed6\u63d0\u5230\u201c\u4e0d\u5584\u4e8e\u4ea4\u9645\u201d\uff0c\u793e\u4ea4\u5708\u53ef\u80fd\u8f83\u7a84\u3002\u5b66\u4e60\u6709\u58f0\u6f14\u64ad\uff0c\u4e0d\u4ec5\u662f\u6280\u80fd\u63d0\u5347\uff0c\u66f4\u662f**\u5728\u73b0\u6709\u804c\u4e1a\u8eab\u4efd\u4e4b\u5916\uff0c\u5efa\u7acb\u4e00\u4e2a\u80fd\u83b7\u5f97\u5916\u754c\u8ba4\u53ef\u548c\u6b23\u8d4f\uff08\u201c\u4f60\u7684\u58f0\u97f3\u662f\u4e0d\u662f\u8ff7\u5012\u4f60\u4eec\u90a3\u5f88\u591a\u4eba\u201d\uff09\u7684\u65b0\u8eab\u4efd\u548c\u793e\u4ea4\u51fa\u53e3**\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u5708\u5c42\u5f52\u5c5e\u611f**\u3002\u4ed6\u9700\u8981\u7684\u4e0d\u53ea\u662f\u201c\u80fd\u8d5a\u94b1\u201d\uff0c\u66f4\u662f\u88ab\u4e00\u4e2a\u4e13\u4e1a\u5708\u5b50\uff08\u5982\u201c\u5e08\u59d0\u5de5\u4f5c\u5ba4\u201d\u3001\u201c\u5b98\u65b9\u5e73\u53f0\u201d\uff09\u63a5\u7eb3\u548c\u8ba4\u53ef\uff0c\u8bc1\u660e\u81ea\u5df1\u5728\u4e25\u8083\u804c\u4e1a\u4e4b\u5916\uff0c\u62e5\u6709\u88ab\u6b23\u8d4f\u7684\u624d\u534e\u548c\u53ef\u80fd\u6027\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u6709\u5411 **\u6df7\u5408\u4f533\u53f7\uff1a\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b** \u8fdb\u5316\u6f5c\u529b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u672a\u63d0\u53ca\u5bb6\u5ead\u53cd\u5bf9\uff0c\u4f46\u9700\u786e\u8ba4\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u4e2d** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u8b66\u5bdf\u5de5\u4f5c\u201c\u4e0a\u6848\u201d\u4efb\u52a1\u4e0d\u89c4\u5f8b\uff0c\u53ef\u80fd\u5bfc\u81f4\u5b66\u4e60\u8ba1\u5212\u9891\u7e41\u4e2d\u65ad\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\u201d\u7684\u632b\u8d25\u611f\u548c\u81ea\u8d23\uff0c\u6700\u7ec8\u56e0\u65f6\u95f4\u65e0\u6cd5\u4fdd\u8bc1\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u4e0d\u6613\u60c5\u7eea\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u52a8\u673a\u4e3a\u81ea\u6211\u63d0\u5347\u548c\u5174\u8da3\uff0c\u5bf9\u201c\u5feb\u901f\u53d8\u73b0\u201d\u8bc9\u6c42\u4e0d\u660e\u663e\uff0c\u4f46\u82e5\u957f\u671f\u65e0\u6b63\u5411\u53cd\u9988\uff08\u5982\u63a5\u5355\u3001\u4f5c\u54c1\u8ba4\u53ef\uff09\uff0c\u70ed\u60c5\u53ef\u80fd\u6d88\u9000\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\u3002\u5f53\u8bfe\u7a0b\u5185\u5bb9\u52a0\u6df1\u3001\u4f5c\u4e1a\u91cf\u589e\u52a0\uff0c\u4e0e\u4ed6\u7e41\u5fd9\u4e14\u4e0d\u89c4\u5f8b\u7684\u5de5\u4f5c/\u5bb6\u5ead\u65f6\u95f4\u4ea7\u751f\u4e25\u91cd\u51b2\u7a81\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5e08\u5144\uff0c\u770b\u5230\u4f60\u901a\u5173\u4e86\u7279\u522b\u4e3a\u4f60\u9ad8\u5174\uff01\u4f60\u7684\u58f0\u97f3\u6761\u4ef6\u548c\u5b66\u4e60\u6001\u5ea6\u90fd\u7279\u522b\u68d2\u3002\u6211\u77e5\u9053\u4f60\u4eec\u5de5\u4f5c\u6027\u8d28\u7279\u6b8a\uff0c\u65f6\u95f4\u4e0a\u53ef\u80fd\u6ca1\u90a3\u4e48\u81ea\u7531\u3002\u522b\u62c5\u5fc3\uff0c\u54b1\u4eec\u7684\u8bfe\u7a0b\u548c\u4f5c\u4e1a\u90fd\u652f\u6301\u56de\u770b\u548c\u7075\u6d3b\u5b89\u6392\u3002\u4f60\u6309\u81ea\u5df1\u7684\u8282\u594f\u6765\uff0c\u6709\u4efb\u4f55\u65f6\u95f4\u51b2\u7a81\u968f\u65f6\u8ddf\u6211\u8bf4\uff0c\u54b1\u4eec\u4e00\u8d77\u8c03\u6574\u8ba1\u5212\u3002\u91cd\u8981\u7684\u662f\u4f60\u4eab\u53d7\u8fd9\u4e2a\u8fc7\u7a0b\uff0c\u628a\u6f14\u64ad\u5f53\u6210\u4e00\u4e2a\u91ca\u653e\u538b\u529b\u3001\u5c55\u73b0\u53e6\u4e00\u4e2a\u81ea\u5df1\u7684\u7a97\u53e3\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u3002\u5339\u914d\u5176\u9ad8\u52a8\u673a\u548c\u52a1\u5b9e\u6027\u683c\uff0c\u63d0\u4f9b\u624e\u5b9e\u7684\u6280\u672f\u8bad\u7ec3\u548c\u660e\u786e\u7684\u8fdb\u9636\u8def\u5f84\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n    1.  **\u3010\u65f6\u95f4\u5f39\u6027\u9002\u914d\u5305\u3011**\uff1a\u5141\u8bb8\u4f5c\u4e1a\u5f39\u6027\u63d0\u4ea4\uff0c\u63d0\u4f9b\u5f55\u64ad\u91cd\u70b9\u5207\u7247\uff0c\u51cf\u5c11\u76f4\u64ad\u4f9d\u8d56\u538b\u529b\u3002\n    2.  **\u3010\u5708\u5c42\u8eab\u4efd\u8d4b\u80fd\u5305\u3011**\uff1a\u5728\u5176\u6280\u80fd\u8fbe\u6807\u540e\uff08\u5982\u5b8c\u6210\u7b2c\u4e00\u4e2a\u9ad8\u8d28\u91cf\u4f5c\u54c1\uff09\uff0c\u8fc5\u901f\u8d4b\u4e88\u5176 **\u201c\u7eaa\u5f8b\u59d4\u5458\u201d\u3001\u201c\u5c0f\u7ec4\u957f\u201d\u6216\u201c\u65b0\u5175\u8f85\u5bfc\u5458\u201d** \u7b49\u89d2\u8272\uff08**D\u6a21\u5757\uff1a\u9ec4\u888d\u52a0\u8eab\u63d0\u5e72\u6cd5**\uff09\uff0c\u6ee1\u8db3\u5176\u5c0a\u91cd\u9700\u6c42\u548c\u6f5c\u5728\u7684\u9886\u5bfc\u6b32\uff0c\u5c06\u5176\u56fa\u5316\u4e3a\u751f\u6001\u5efa\u8bbe\u8005\u3002\n    3.  **\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011**\uff08B\u6a21\u5757\uff09\uff1a\u9488\u5bf9\u5176\u8ba1\u7b97\u673a\u8bbe\u8ba1\u80cc\u666f\uff0c\u53ef\u5f15\u5bfc\u5173\u6ce8\u540e\u671f\u5236\u4f5c\u3001AU\u8f6f\u4ef6\u7b49\u6280\u672f\u5c42\u9762\uff0c\u6ee1\u8db3\u5176\u6df1\u5ea6\u63a2\u7d22\u6b32\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1.  \u7528\u201c\u6253\u5361\u7387\u4f4e\u201d\u3001\u201c\u4f5c\u4e1a\u62d6\u62c9\u201d\u7b49\u8bdd\u672f\u65bd\u538b\uff0c\u8fd9\u4f1a\u52a0\u5267\u5176\u56e0\u65f6\u95f4\u4e0d\u8db3\u4ea7\u751f\u7684\u6127\u759a\u611f\u3002\n    2.  \u5ffd\u89c6\u5176\u8b66\u5bdf\u804c\u4e1a\u80cc\u666f\u7684\u7279\u6b8a\u6027\uff0c\u7528\u5bf9\u5f85\u666e\u901a\u4e0a\u73ed\u65cf\u7684\u65f6\u95f4\u8981\u6c42\u6765\u7ea6\u675f\u4ed6\u3002\n    3.  \u5728\u5176\u8868\u73b0\u51fa\u5e2e\u52a9\u4ed6\u4eba\u6216\u7edf\u7b79\u610f\u613f\u65f6\uff0c\u4ecd\u7528\u201c\u5b66\u751f\u201d\u59ff\u6001\u5c45\u9ad8\u4e34\u4e0b\u6c9f\u901a\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5176\u52a8\u673a\u7eaf\u6b63\uff0c\u6709\u7a33\u5b9a\u804c\u4e1a\u515c\u5e95\uff0c\u5bf9\u9ad8\u4ef7\u503c\u3001\u80fd\u5e26\u6765\u8eab\u4efd\u8ba4\u540c\u7684\u8fdb\u9636\u8bfe\u7a0b\uff08\u5982\u79c1\u6559\u8bfe\u3001\u9ad8\u7ea7\u8bbe\u5907\u6307\u5bfc\uff09\u6709\u6f5c\u5728\u4ed8\u8d39\u610f\u613f\u3002\u4f46\u9700\u5728\u5176\u65f6\u95f4\u5b89\u6392\u76f8\u5bf9\u7a33\u5b9a\u3001\u4e14\u6709\u521d\u6b65\u6210\u679c\u540e\u63a8\u8fdb\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u6211\u633a\u60f3\u5f55\u97f3\u7684\uff0c\u63d0\u5347\u81ea\u5df1[\u80dc\u5229]**\u201d \u2014\u2014 **\u9ad8\u52a8\u673a\u7eaf\u5ea6**\u7684\u6838\u5fc3\u8bc1\u660e\uff0c\u975e\u5355\u7eaf\u53d8\u73b0\u9a71\u52a8\u3002\n2. > \u201c**\u4e2d\u5348\u63a5\u5b69\u5b50\u653e\u5b66\u8fd8\u5f97\u5e26\u4e0a\u5403\u996d[\u6342\u8138]**\u201d \u2014\u2014 **\u8d44\u6e90\u5e95\u5ea7\uff08\u65f6\u95f4\uff09\u77ed\u677f**\u7684\u5178\u578b\u8868\u73b0\uff0c\u751f\u6d3b\u8282\u594f\u7d27\u5f20\u3002\n3. > \u201c**\u6211\u53ef\u4ee5\u6212\u70df\uff0c\u672c\u6765\u5c31\u6709\u8ba1\u5212\u6212\u4e86\uff0c\u6211\u5e73\u65f6\u8dd1\u6b65\u5e94\u8be5\u4f1a\u5bf9\u6c14\u606f\u6709\u5e2e\u52a9\u5427**\u201d \u2014\u2014 **\u9ad8\u5fc3\u7406\u5f39\u6027**\u7684\u4f53\u73b0\uff0c\u9762\u5bf9\u56f0\u96be\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u800c\u975e\u62b1\u6028\u6216\u9000\u7f29\u3002\n4. > \u201c**\u6211\u4e0d\u5584\u4e8e\u4ea4\u9645[\u5fc3\u788e]**\u201d \u2014\u2014 **\u66b4\u9732\u5176\u6df1\u5c42\u9700\u6c42\uff08\u5c0a\u91cd\u4e0e\u793e\u4ea4\u7a81\u7834\uff09**\uff0c\u6709\u58f0\u6f14\u64ad\u53ef\u80fd\u6210\u4e3a\u5176\u5efa\u7acb\u65b0\u793e\u4ea4\u8ba4\u540c\u7684\u9014\u5f84\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u6709\u5411 **\u3010\u6df7\u5408\u4f533\u53f7\uff08\u6743\u9650\u89c9\u9192\uff09\u3011** \u8fdb\u5316\u7684\u6f5c\u529b\u3002\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u5708\u5c42\u7684\u5c0a\u91cd\u4e0e\u8eab\u4efd\u8ba4\u540c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u81f4\u7684\u65f6\u95f4\u5f39\u6027\u670d\u52a1\uff0c\u5e76\u5728\u5176\u6280\u80fd\u8fbe\u6807\u540e\u8fc5\u901f\u201c\u63d0\u5e72\u201d\uff0c\u8d4b\u4e88\u5176\u793e\u7fa4\u7ba1\u7406\u6743\u9650\uff0c\u7528\u8363\u8a89\u611f\u7ed1\u5b9a\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u65f6\u95f4\u5f39\u6027\u9002\u914d\u5305 + \u5708\u5c42\u8eab\u4efd\u8d4b\u80fd\u5305\"}\n```";
