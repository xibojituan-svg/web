    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a676695998\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676695998 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e - \u6843\u5341\u516d/\u5927\u57232(\u5b59\u7389\u5fb7) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u9a6c\u62c9\u96c5\u6500\u767b\u8ba1\u5212\u7cbe\u82f1\u7248 (3980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u88ab\u8feb\u5206\u671f** (\u4e3b\u52a8\u8be2\u95ee\u5206\u671f\uff0c\u82b1\u5457\u65e0\u6cd5\u652f\u4ed8\uff0c\u6700\u7ec8\u4f7f\u7528\u652f\u4ed8\u5b9d\u626b\u7801) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u4ece\u5bf9\u8bdd\u8282\u594f\u63a8\u65ad\uff0c\u975e\u5168\u5929\u5019\u7a7a\u95f2\uff0c\u4f46\u80fd\u6309\u65f6\u5b8c\u6210\u4efb\u52a1) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** (\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** (\u6709\u5145\u8db3\u7684\u884c\u4e3a\u548c\u60c5\u7eea\u4fe1\u53f7) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u6709\u660e\u786e\u7684\u53d8\u73b0\u8bc9\u6c42\u548c\u5b89\u5168\u611f\u9700\u6c42\uff0c\u4f46\u540c\u65f6\u4e5f\u8868\u73b0\u51fa\u5bf9\u6280\u80fd\u63d0\u5347\u7684\u5174\u8da3\u548c\u8ba4\u53ef\u3002\u5e76\u975e\u7eaf\u7cb9\u7684\u201c\u51e0\u5929\u63d0\u73b0\u201d\u9a71\u52a8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u62c5\u5fc3\u5c06\u6765\u6536\u8d39\u95ee\u9898\u3002\u5982\u679c\u4e0d\u6323\u94b1\u5148\u4ea4\u8d39\uff0c\u81ea\u5df1\u662f\u5426\u6709\u80fd\u529b\u8d5a\u56de\u5b66\u8d39\uff1f\u6ca1\u6709\u5b89\u5168\u611f\u3002\u201d\n> \u201c\u4ef7\u683c\u4f4e\u70b9\u6ca1\u5173\u7cfb\uff0c\u6211\u53ef\u4ee5\u5148\u7ec3\u4e60\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e (3-4\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u4e3b\u52a8\u8be2\u95ee\u5206\u671f\uff0c\u82b1\u5457\u65e0\u6cd5\u4f7f\u7528\uff0c\u652f\u4ed83980\u5143\u8bfe\u7a0b\u5b58\u5728\u660e\u663e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u6309\u65f6\u5b8c\u6210\u6668\u7ec3\u3001\u542c\u8bfe\u3001\u4ea4\u4f5c\u4e1a\uff0c\u5b66\u4e60\u884c\u4e3a\u7a33\u5b9a\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u672a\u63d0\u53ca\uff0c\u9700\u540e\u7eed\u6838\u67e5\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b07\u4f4e\u6781\u5371 (1-2\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56**\u3002\u9047\u5230\u6280\u672f\u96be\u70b9\uff08\u5982\u591a\u89d2\u8272\u914d\u97f3\uff09\u65f6\uff0c\u4f1a\u8fc5\u901f\u4ea7\u751f\u81ea\u6211\u6000\u7591\u548c\u653e\u5f03\u5ff5\u5934\uff0c\u6781\u5ea6\u4f9d\u8d56\u8001\u5e08\u7684\u9f13\u52b1\u548c\u80af\u5b9a\u6765\u7ef4\u6301\u4fe1\u5fc3\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u6211\u611f\u89c9\u5c0f\u5973\u5b69\u58f0\u97f3\uff0c\u6211\u8bf4\u4e0d\u597d\u201d\n> \u201c\u4e0b\u5348\u53bb\u8bfb\u90a3\u4e2a\u8bd5\u97f3\u5355\uff0c\u4e00\u4e2a\u4eba\u4f34\u4e94\u516d\u4e2a\u89d2\u8272\uff0c\u4e00\u53e3\u6c14\u8bfb\u5b8c\uff0c\u611f\u89c9\u597d\u7d2f\uff0c\u6211\u90fd\u5feb\u5931\u53bb\u4fe1\u5fc3\u4e86\uff0c\u5475\u5475\u201d\n> \u201c\u4f60\u7684\u58f0\u97f3\u662f\u6709\u5929\u8d4b\u7684\uff0c\u5929\u751f\u5c31\u597d\u542c\u3002\u6211\u8fd9\u9700\u8981\u540e\u5929\u953b\u70bc\uff0c\u4e0d\u77e5\u9053\u80fd\u5f97\u5230\u6807\u51c6\u4e0d\uff1f\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 (\u7126\u8651\u4fdd\u969c)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u672a\u6765\u7684\u7ecf\u6d4e\u5b89\u5168\u611f\u548c\u81ea\u6211\u80fd\u529b\u7684\u4e0d\u81ea\u4fe1**\u3002\u4ed6\u62c5\u5fc3\u6295\u5165\u5b66\u8d39\u540e\u65e0\u6cd5\u56de\u672c\uff0c\u5728\u5c1d\u8bd5\u7a0d\u6709\u96be\u5ea6\u7684\u4efb\u52a1\uff08\u591a\u89d2\u8272\u914d\u97f3\uff09\u65f6\uff0c\u4f1a\u7acb\u523b\u8054\u60f3\u5230\u201c\u81ea\u5df1\u4e0d\u884c\u201d\uff0c\u4ea7\u751f\u5f3a\u70c8\u7684\u632b\u8d25\u611f\u548c\u9000\u7f29\u5fc3\u7406\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6301\u7eed\u3001\u5177\u4f53\u3001\u5938\u5f20\u7684\u80af\u5b9a\u4e0e\u9f13\u52b1\uff0c\u4ee5\u53ca\u201c\u624b\u628a\u624b\u201d\u7684\u8def\u5f84\u5b89\u5168\u611f**\u3002\u4ed6\u9700\u8981\u88ab\u53cd\u590d\u544a\u77e5\u201c\u4f60\u53ef\u4ee5\u201d\u3001\u201c\u4f60\u8fdb\u6b65\u4e86\u201d\u3001\u201c\u6211\u5e26\u4f60\u201d\uff0c\u6765\u5bf9\u6297\u5185\u5fc3\u7684\u81ea\u6211\u5426\u5b9a\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74** (\u4e25\u91cd\u5185\u8017\u578b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u867d\u4f7f\u7528\u5206\u671f\u652f\u4ed8\uff0c\u4f46\u672a\u63d0\u53ca\u501f\u8d37\uff08\u5982\u501f\u5457/\u7f51\u8d37\uff09\uff0c\u4e14\u65e0\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\uff0c\u6682\u672a\u8fbeT8-D\u7ea2\u7ebf\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4e2d | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u652f\u4ed8\u538b\u529b\u53ef\u80fd\u6765\u6e90\u4e8e\u5bb6\u5ead\uff0c\u9700\u8b66\u60d5\u540e\u7eed\u5bb6\u5ead\u77db\u76fe\u7206\u53d1\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u4e00\u65e6\u8bfe\u7a0b\u96be\u5ea6\u63d0\u5347\uff08\u5982\u72ec\u7acb\u5b8c\u6210\u590d\u6742\u540e\u671f\uff09\uff0c\u6216\u8fde\u7eed\u8bd5\u97f3\u5931\u8d25\uff0c\u5176\u8106\u5f31\u7684\u81ea\u4fe1\u5fc3\u4f1a\u8fc5\u901f\u5d29\u6e83\uff0c\u4ea7\u751f\u201c\u6211\u592a\u7b28\u4e86\uff0c\u5b66\u4e0d\u4f1a\u201d\u7684\u5ff5\u5934\uff0c\u8fdb\u800c\u8981\u6c42\u9000\u8d39\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | **\u6700\u6838\u5fc3\u98ce\u9669**\u3002\u4efb\u4f55\u6280\u672f\u4e0a\u7684\u632b\u6298\u3001\u8001\u5e08\u7684\u4e25\u5389\u70b9\u8bc4\u3001\u6216\u4e0e\u5176\u4ed6\u5b66\u5458\u7684\u5bf9\u6bd4\uff0c\u90fd\u53ef\u80fd\u6210\u4e3a\u5176\u60c5\u7eea\u5d29\u6e83\u3001\u653e\u5f03\u5b66\u4e60\u7684\u5bfc\u706b\u7d22\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u5bf9\u53d8\u73b0\u5468\u671f\u6709\u7126\u8651\uff0c\u82e51-2\u4e2a\u6708\u5185\u65e0\u4efb\u4f55\u6b63\u5411\u53cd\u9988\uff08\u5982\u63a5\u5230\u5c0f\u5355\uff09\uff0c\u4f1a\u52a0\u5267\u5176\u4e0d\u5b89\u5168\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u8bfe\u7a0b\u8fdb\u5165\u5b9e\u64cd\u548c\u8bd5\u97f3\u9636\u6bb5\uff0c\u632b\u6298\u611f\u6700\u5bb9\u6613\u7d2f\u79ef\u7206\u53d1\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u540c\u5b66\u4f60\u597d\uff01\u770b\u5230\u4f60\u4f53\u9a8c\u8425\u671f\u95f4\u7279\u522b\u8ba4\u771f\uff0c\u4f5c\u4e1a\u90fd\u6309\u65f6\u5b8c\u6210\u4e86\uff0c\u8fd9\u79cd\u8e0f\u5b9e\u7684\u6001\u5ea6\u7279\u522b\u68d2\uff01\u6b63\u5f0f\u8bfe\u54b1\u4eec\u4e00\u6b65\u6b65\u6765\uff0c**\u6709\u4efb\u4f55\u89c9\u5f97\u96be\u7684\u5730\u65b9\uff0c\u968f\u65f6\u558a\u6211\uff0c\u6211\u5e2e\u4f60\u62c6\u89e3**\u3002\u54b1\u4eec\u4e0d\u8ddf\u522b\u4eba\u6bd4\u901f\u5ea6\uff0c\u5c31\u6bd4\u8c01\u66f4\u7a33\u3001\u66f4\u624e\u5b9e\u3002\u4f60\u80af\u5b9a\u6ca1\u95ee\u9898\uff0c\u6211\u770b\u597d\u4f60\uff01\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf**\u3011\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u6ee1\u914d\u52a0\u8f7d\u3010**\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305**\u3011\u3002**\u6807\u51c6A(\u50bb\u74dc\u7248) + C(\u6ee1\u914d\u5168\u5f00)**\u3002\u4f5c\u4e1a\u70b9\u8bc4\u4ee5\u9f13\u52b1\u548c\u53d1\u73b0\u5fae\u5c0f\u8fdb\u6b65\u4e3a\u4e3b\uff1b\u6280\u672f\u96be\u70b9\u76f4\u63a5\u7ed9\u201c\u6309\u952e\u7ea7\u201d\u89e3\u51b3\u65b9\u6848\uff0c\u907f\u514d\u8ba9\u5176\u9677\u5165\u81ea\u6211\u6000\u7591\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u5bf9\u4ed6\u8fdb\u884c\u4e25\u5389\u7684\u6279\u8bc4\u6216\u4e0e\u5176\u4ed6\u5b66\u5458\u5bf9\u6bd4\u30022. \u5e03\u7f6e\u8d85\u51fa\u5176\u5f53\u524d\u80fd\u529b\u592a\u591a\u7684\u9ad8\u96be\u5ea6\u6311\u6218\u4f5c\u4e1a\u30023. \u8fc7\u65e9\u5f3a\u8c03\u201c\u63a5\u5927\u5355\u3001\u8d5a\u5feb\u94b1\u201d\uff0c\u52a0\u5267\u5176\u7126\u8651\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728T6\u60c5\u7eea\u672a\u7a33\u5b9a\u3001\u672a\u5efa\u7acb\u575a\u5b9e\u81ea\u4fe1\u548c\u6210\u529f\u4f53\u9a8c\u524d\uff0c\u4efb\u4f55\u4ea4\u53c9\u9500\u552e\u90fd\u662f\u5f15\u7206\u9000\u8d39\u7684\u96f7\u533a\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u62c5\u5fc3\u5c06\u6765\u6536\u8d39\u95ee\u9898\u3002\u5982\u679c\u4e0d\u6323\u94b1\u5148\u4ea4\u8d39\uff0c\u81ea\u5df1\u662f\u5426\u6709\u80fd\u529b\u8d5a\u56de\u5b66\u8d39\uff1f\u6ca1\u6709\u5b89\u5168\u611f\u3002\u201d **(\u5b89\u5168\u9700\u6c42\u4e0e\u4e0d\u81ea\u4fe1\u7684\u96c6\u4e2d\u4f53\u73b0)**\n2. > \u201c\u4e0b\u5348\u53bb\u8bfb\u90a3\u4e2a\u8bd5\u97f3\u5355\uff0c\u4e00\u4e2a\u4eba\u4f34\u4e94\u516d\u4e2a\u89d2\u8272\uff0c\u4e00\u53e3\u6c14\u8bfb\u5b8c\uff0c\u611f\u89c9\u597d\u7d2f\uff0c\u6211\u90fd\u5feb\u5931\u53bb\u4fe1\u5fc3\u4e86\uff0c\u5475\u5475\u201d **(\u5178\u578b\u4f4e\u5fc3\u7406\u5f39\u6027\uff0c\u9047\u632b\u5373\u81ea\u6211\u5426\u5b9a)**\n3. > \u201c\u4f60\u7684\u58f0\u97f3\u662f\u6709\u5929\u8d4b\u7684\uff0c\u5929\u751f\u5c31\u597d\u542c\u3002\u6211\u8fd9\u9700\u8981\u540e\u5929\u953b\u70bc\uff0c\u4e0d\u77e5\u9053\u80fd\u5f97\u5230\u6807\u51c6\u4e0d\uff1f\u201d **(\u5f3a\u70c8\u7684\u6bd4\u8f83\u5fc3\u7406\u548c\u81ea\u5351\u611f\uff0c\u9700\u8981\u5916\u90e8\u80af\u5b9a)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6\u60c5\u7eea\u5de8\u5a74**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u7ecf\u6d4e\u5b89\u5168\u611f\u5e76\u8bc1\u660e\u81ea\u5df1\u201c\u80fd\u884c\u201d**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u201c\u8f6e\u6905\u7ea7\u201d\u7684\u60c5\u7eea\u6258\u5e95\u548c\u4fdd\u59c6\u5f0f\u7684\u6b65\u9aa4\u6307\u5bfc\uff0c\u7528\u5938\u5f20\u7684\u8d5e\u7f8e\u5bf9\u51b2\u5176\u5185\u5728\u7684\u81ea\u6211\u5426\u5b9a**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
