    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 269570347 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-12 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6c88\u81fb\u6167\uff08\u73ed\u73ed\uff09\u3001\u5218\u4e39\uff08\u4e39\u54e5/\u4e09\u54e5\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u77ed\u89c6\u9891/\u77ed\u5267\u76f8\u5173\u8bfe\u7a0b\uff08\u63d0\u53caL3\u62a5\u540d\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u672a\u77e5\uff08\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1\uff08\u7528\u6237\u63d0\u53ca\u201c\u6700\u8fd1\u633a\u5fd9\u7684\uff0c\u6ca1\u7a7a\u5b66\u201d\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u672a\u77e5 |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e2d\u7b49\uff08\u6280\u672f\u4ea4\u6d41\u5145\u5206\uff0c\u4f46\u4e2a\u4eba\u80cc\u666f\u4fe1\u606f\u7f3a\u5931\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u53d8\u73b0\u800c\u6765\uff0c\u5173\u6ce8\u6280\u672f\u7cbe\u8fdb\u4e0e\u5546\u4e1a\u5b9e\u8df5\uff0c\u5df2\u4ea7\u751f\u5b9e\u9645\u6536\u5165\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u4e39\u54e5\uff0c\u4f60\u770b\u4e00\u4e0b\u8fd9\u4e2a\u89c6\u9891\u5462\uff0c\u50cf\u8fd9\u79cd\u7c7b\u578b\u7684\uff0c\u4f60\u89c9\u5f97\u62a5\u4ef7\u591a\u5c11\u6bd4\u8f83\u5408\u9002\u554a\uff1f\u201d\n  > \u201c\u4e0a\u6b21\u90a3\u4e2a\u5546\u5355\u5df2\u7ecf\u505a\u5b8c\u4e86\uff0c\u4e24\u5206\u534a\u591a\uff0c\u4ed6\u4eec\u6700\u540e\u7ed3\u679c\u5341\u56db\u5343\u5757\u94b1\uff0c\u7136\u540e\u73b0\u5728\u53c8\u6709\u4e00\u4e2a...\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b06\u9ad8\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u9ad8** \u2014 \u5df2\u6210\u529f\u63a5\u5355\u5e76\u6536\u6b3e\uff084000\u5143\uff09\uff0c\u5177\u5907\u5546\u4e1a\u53d8\u73b0\u80fd\u529b\uff0c\u8d44\u91d1\u538b\u529b\u5c0f\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u6295\u5165\u65f6\u95f4\u8fdb\u884c\u6280\u672f\u94bb\u7814\u548c\u63a5\u5355\uff0c\u4f46\u8fd1\u671f\u8868\u793a\u201c\u633a\u5fd9\u7684\uff0c\u6ca1\u7a7a\u5b66\u201d\uff0c\u65f6\u95f4\u975e\u7edd\u5bf9\u5bbd\u88d5\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u672a\u77e5** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9047\u5230\u6280\u672f\u96be\u9898\uff08\u5982Vidu\u89d2\u8272\u4f53\u578b\u63a7\u5236\uff09\u80fd\u4e3b\u52a8\u5206\u6790\u3001\u5c1d\u8bd5\u591a\u79cd\u89e3\u51b3\u65b9\u6848\uff0c\u5e76\u4e0e\u8001\u5e08\u8fdb\u884c\u6df1\u5ea6\u6280\u672f\u63a2\u8ba8\uff0c\u65e0\u4efb\u4f55\u60c5\u7eea\u5d29\u6e83\u6216\u4f9d\u8d56\u5b89\u629a\u7684\u8ff9\u8c61\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u53d1\u73b0\u4ed6\u8fd9\u4e2a\u6bcf\u6b21\u5f00\u59cb\u7684\u7b2c\u4e00\u4e2a\u624b\u9488\u554a\uff0c\u5c31\u662f\u6211\u4eec\u4e0a\u4f20\u7684\u8fd9\u4e2a\u56fe\u4e00\u3002\u90a3\u4e2a\u50cf\u6211\u4eec\u8fd9\u4e2a\u89c6\u89d2\uff0c\u5b83\u600e\u4e48\u63a7\u5236\u5462\uff1f\u201d\n  > \u201c\u55ef\uff0c\u786e\u5b9e\u4e0d\u597d\u63a7\u5236\uff0c\u8fd8\u662f\u591a\u751f\u51e0\u4e2a\u56fe\u5148\u628a\u89d2\u8272\u653e\u4e0a\u53bb\u624d\u597d\u201d\uff08\u7406\u6027\u63a5\u53d7\u6280\u672f\u9650\u5236\uff0c\u5e76\u8c03\u6574\u7b56\u7565\uff09\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 & \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9**\u4e13\u4e1a\u80fd\u529b\u8ba4\u53ef**\u548c**\u5e02\u573a\u4ef7\u683c\u5b9a\u4f4d**\u7684\u4e0d\u786e\u5b9a\u3002\u4ed6\u9891\u7e41\u5411\u201c\u4e39\u54e5\u201d\u8bf7\u6559\u62a5\u4ef7\u6280\u5de7\uff08\u201c\u62a5\u9ad8\u4e86\u8fd8\u662f\u4f4e\u4e86\uff1f\u201d\uff09\uff0c\u5e76\u5e0c\u671b\u4f5c\u54c1\u201c\u51fa\u5f69\u201d\u3001\u201c\u597d\u770b\u201d\uff0c\u8fd9\u53cd\u6620\u4e86\u4ed6\u4e0d\u4ec5\u60f3\u8d5a\u94b1\uff0c\u66f4\u6e34\u671b\u83b7\u5f97\u884c\u4e1a\u5185\u7684\u4e13\u4e1a\u5c0a\u91cd\u548c\u8eab\u4efd\u8ba4\u540c\uff0c\u5b9e\u73b0\u4ece\u201c\u5b66\u4e60\u8005\u201d\u5230\u201c\u4e13\u4e1a\u5236\u4f5c\u4eba\u201d\u7684\u8dc3\u8fc1\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u201c\u6218\u53cb\u201d\u6216\u201c\u524d\u8f88\u201d\u8ba4\u540c\u611f**\u3002\u5f53\u4ed6\u5206\u4eab\u6210\u529f\u63a5\u5355\uff08\u201c\u5b66\u8d39\u56de\u6765\u4e86\u201d\uff09\u65f6\uff0c\u7ed9\u4e88\u201c\u76f8\u5f53\u4e0d\u9519\u201d\u7684\u80af\u5b9a\uff1b\u5f53\u4ed6\u63a2\u8ba8\u6280\u672f\u96be\u9898\u65f6\uff0c\u63d0\u4f9b\u6df1\u5ea6\u7684\u3001\u5e73\u7b49\u7684\u6280\u672f\u5207\u78cb\uff0c\u800c\u975e\u5355\u5411\u6559\u5b66\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe2 A\u7c7b** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T3 \u6b7b\u78d5\u6781\u5ba2\u6d3e** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u5df2\u5b9e\u73b0\u53d8\u73b0\uff0c\u5bb6\u5ead\u963b\u529b\u53ef\u80fd\u6027\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u65f6\u95f4\u51b2\u7a81\u662f\u6700\u5927\u98ce\u9669**\u3002\u8fd1\u671f\u5df2\u8868\u793a\u201c\u6700\u8fd1\u633a\u5fd9\u7684\uff0c\u6ca1\u7a7a\u5b66\u201d\uff0c\u82e5\u8bfe\u7a0b\u6392\u671f\u4e0e\u5176\u5de5\u4f5c/\u63a5\u5355\u51b2\u7a81\uff0c\u53ef\u80fd\u5bfc\u81f4\u65e0\u6cd5\u8ddf\u8fdb\u5b66\u4e60\u800c\u4ea7\u751f\u4ef7\u503c\u843d\u5dee\u611f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u6280\u672f\u94bb\u7814\u4e2d\u9047\u5230\u95ee\u9898\u80fd\u7406\u6027\u5206\u6790\uff0c\u65e0\u60c5\u7eea\u5d29\u6e83\u8ff9\u8c61\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | **\u5df2\u6210\u529f\u53d8\u73b0**\uff0c\u4e14\u4e3b\u52a8\u5bfb\u6c42\u66f4\u9ad8\u62a5\u4ef7\uff0c\u5bf9\u5b66\u4e60\u6295\u5165\u4ea7\u51fa\u6bd4\u6709\u6b63\u5411\u9a8c\u8bc1\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe\u540e2-4\u5468\uff0c\u5f53\u5176\u5546\u4e1a\u9879\u76ee\u4e0e\u8bfe\u7a0b\u5b66\u4e60\u65f6\u95f4\u4ea7\u751f\u4e25\u91cd\u51b2\u7a81\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4e39\u54e5\uff0c\u770b\u5230\u4f60\u5df2\u7ecf\u80fd\u63a5\u5355\u62a5\u4ef7\u4e86\uff0c\u771f\u5389\u5bb3\uff01\u54b1\u4eecL3\u7684\u8bfe\u7a0b\u8bbe\u8ba1\u4e86\u5f88\u591a\u5546\u4e1a\u5b9e\u6218\u6848\u4f8b\u548c\u9ad8\u7ea7\u6280\u5de7\uff0c\u6b63\u597d\u80fd\u5e2e\u4f60\u628a\u62a5\u4ef7\u518d\u5f80\u4e0a\u63d0\u4e00\u63d0\uff0c\u628a\u6d3b\u513f\u505a\u5f97\u66f4\u2018\u51fa\u5f69\u2019\u3002\u65f6\u95f4\u4e0a\u54b1\u4eec\u7075\u6d3b\u5b89\u6392\uff0c\u4ee5\u4f60\u7684\u9879\u76ee\u4f18\u5148\uff0c\u6709\u4e0d\u61c2\u7684\u968f\u65f6@\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u7422\u78e8\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** \u642d\u914d **\u3010\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\u3011**\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u6302\u8f7d **\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011**\uff08B\u6a21\u5757\u6ee1\u914d\uff09\uff0c\u63d0\u4f9b\u4e0e\u540e\u7aef\u6280\u672f\u4e13\u5bb6\uff08\u5982\u4e39\u54e5\uff09\u7684\u76f4\u63a5\u3001\u6df1\u5ea6\u4ea4\u6d41\u901a\u9053\u3002\u53ef\u8003\u8651\u5f15\u5165 **\u3010\u5546\u4e1a\u63a5\u5355\u8d44\u6e90\u5305\u3011**\uff0c\u5bf9\u63a5\u66f4\u9ad8\u4ef7\u503c\u7684\u5546\u5355\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u5b9d\u5b9d\u201d\u3001\u201c\u5b9d\u5b50\u201d\u7b49\u4f4e\u9f84\u5316\u79f0\u547c\uff1b\u7528\u6253\u5361\u3001\u4f5c\u4e1a\u7b49\u5b66\u751f\u5316\u7ba1\u7406\u65b9\u5f0f\u65bd\u538b\uff1b\u5728\u4ed6\u63a2\u8ba8\u9ad8\u7ea7\u6280\u672f\u95ee\u9898\u65f6\u7ed9\u51fa\u80a4\u6d45\u6216\u6577\u884d\u7684\u7b54\u6848\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u4ed6\u5df2\u9a8c\u8bc1\u5b66\u4e60\u4ef7\u503c\uff0c\u4e14\u8ffd\u6c42\u66f4\u9ad8\u4e13\u4e1a\u5ea6\uff0c\u662f\u9ad8\u4ef7\u8fdb\u9636\u8bfe\u3001\u79c1\u6559\u8bfe\u3001\u8bbe\u5907/\u8f6f\u4ef6\u63a8\u8350\u7684\u4f18\u8d28\u76ee\u6807\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u4e39\u54e5\uff0c\u4f60\u770b\u4e00\u4e0b\u8fd9\u4e2a\u89c6\u9891\u5462\uff0c\u50cf\u8fd9\u79cd\u7c7b\u578b\u7684\uff0c\u4f60\u89c9\u5f97\u62a5\u4ef7\u591a\u5c11\u6bd4\u8f83\u5408\u9002\u554a\uff1f\u521a\u624d\u6709\u4e2a\u4eba\u8ba9\u6211\u62a5\u4ef7\u7684\uff0c\u6211\u611f\u89c9\u6211\u62a5\u4f4e\u4e86\u201d **\uff08\u5546\u4e1a\u5b9e\u8df5\u4e0e\u4ef7\u503c\u63a2\u7d22\uff09**\n2. > \u201c\u4e09\u54e5\uff0c\u4f60\u770b\u4e00\u4e0b\u8fd9\u4e2a\u89c6\u9891\u5462\uff0c\u50cf\u8fd9\u79cd\u7c7b\u578b\u7684\uff0c\u4f60\u89c9\u5f97\u62a5\u4ef7\u591a\u5c11\u6bd4\u8f83\u5408\u9002\u554a\uff1f... \u6211\u62a5\u7684\u662f\u516d\u767e\u4e00\u5206\u949f... \u5230\u65f6\u5019\u5148\u505a\u4e00\u628a\u518d\u8bf4\u5427\u3002\u201d **\uff08\u52a1\u5b9e\u3001\u884c\u52a8\u529b\u5f3a\u3001\u5bfb\u6c42\u4e13\u4e1a\u6307\u5bfc\uff09**\n3. > \u201c\u6211\u53d1\u73b0\u4ed6\u8fd9\u4e2a\u6bcf\u6b21\u5f00\u59cb\u7684\u7b2c\u4e00\u4e2a\u624b\u9488\u554a\uff0c\u5c31\u662f\u6211\u4eec\u4e0a\u4f20\u7684\u8fd9\u4e2a\u56fe\u4e00\u3002\u90a3\u4e2a\u50cf\u6211\u4eec\u8fd9\u4e2a\u89c6\u89d2\uff0c\u5b83\u600e\u4e48\u63a7\u5236\u5462\uff1f\u201d **\uff08\u6df1\u5ea6\u6280\u672f\u8ffd\u95ee\uff0c\u6781\u5ba2\u7279\u8d28\uff09**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T3 \u6b7b\u78d5\u6781\u5ba2\u6d3e\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4e0e\u5b9e\u73b0\u80fd\u529b\u7a81\u7834\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6df1\u5ea6\u7684\u6280\u672f\u5207\u78cb\u4e0e\u5546\u4e1a\u8d44\u6e90\u5bf9\u63a5\uff0c\u5c0a\u91cd\u5176\u65f6\u95f4\u81ea\u4e3b\u6027\uff0c\u907f\u514d\u4f4e\u9f84\u5316\u3001\u6d41\u7a0b\u5316\u7ba1\u7406\u3011**\u3002\n\n```json\n{\"core_type\": \"T3 \u6b7b\u78d5\u6781\u5ba2\u6d3e\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u5e38\u5dde\"}\n```";
