    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49)**\n    *   **\u8868\u5c42\u52a8\u673a**: \u660e\u786e\u8868\u8fbe\u201c\u58f0\u97f3\u53d8\u73b0\uff0c\u505a\u517c\u804c\u201d\u3001\u201c\u5168\u804c\u600e\u4e48\u505a\u201d\u7684\u8bc9\u6c42\uff0c\u5bfb\u6c42\u526f\u4e1a/\u5168\u804c\u6536\u5165\u6765\u6e90\u3002\n    *   **\u6df1\u5c42\u52a8\u673a**: \u5bf9\u201c\u5c45\u5bb6\u529e\u516c\u201d\u3001\u201c\u81ea\u7531\u201d\u3001\u201c\u7167\u987e\u5b69\u5b50\u548c\u5bb6\u5ead\u201d\u6709\u660e\u786e\u5173\u6ce8\uff0c\u663e\u793a**\u8ffd\u6c42\u5de5\u4f5c\u4e0e\u5bb6\u5ead\u5e73\u8861**\u7684\u6df1\u5c42\u9700\u6c42\u3002\u5bf9\u884c\u4e1a\u6709\u521d\u6b65\u5174\u8da3\uff08\u201c\u559c\u6b22\u201d\uff09\uff0c\u4f46\u8ba4\u77e5\u5c1a\u6d45\uff08\u201c\u5c31\u662f\u8fd8\u4e0d\u4f1a\u201d\uff09\u3002\n    *   **\u98ce\u9669\u4fe1\u53f7**: \u52a8\u673a\u504f\u5411\u5b9e\u7528\u4e3b\u4e49\uff08\u8d5a\u94b1\u3001\u7075\u6d3b\uff09\uff0c\u5bf9\u5b66\u4e60\u96be\u5ea6\uff08\u201c\u5927\u6982\u8981\u5b66\u4e60\u591a\u4e45\u201d\uff09\u548c\u6295\u5165\u4ea7\u51fa\u6bd4\u5b58\u5728\u7591\u8651\uff0c\u5174\u8da3\u6df1\u5ea6\u5f85\u89c2\u5bdf\u3002\n\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d\u7b49\u504f\u4f4e)**\n    *   **\u65f6\u95f4\u8d44\u6e90**: \u80fd\u53c2\u4e0e\u591a\u573a\u76f4\u64ad\u3001\u63d0\u4ea4\u4f5c\u4e1a\uff0c\u663e\u793a\u6709\u53ef\u652f\u914d\u7684\u788e\u7247\u5316\u65f6\u95f4\u3002\u4f46\u672a\u63d0\u53ca\u4e3b\u4e1a\u60c5\u51b5\uff0c\u5168\u804c\u65f6\u95f4\u6295\u5165\u610f\u613f\u4e0d\u660e\u3002\n    *   **\u7ecf\u6d4e\u8d44\u6e90**: \u80fd\u652f\u4ed87380\u5143\u9ad8\u9636\u73ed\u8d39\u7528\uff0c\u5177\u5907\u57fa\u7840\u652f\u4ed8\u80fd\u529b\u3002\u4f46\u672a\u900f\u9732\u6536\u5165\u6c34\u5e73\u6216\u7ecf\u6d4e\u538b\u529b\uff0c\u5bf9\u4ef7\u683c\u654f\u611f\u5ea6\u672a\u77e5\u3002\n    *   **\u8bbe\u5907/\u73af\u5883\u8d44\u6e90**: \u672a\u63d0\u53ca\u5f55\u97f3\u8bbe\u5907\u3001\u73af\u5883\u7b49\u786c\u4ef6\u6761\u4ef6\uff0c\u5b58\u5728\u6f5c\u5728\u77ed\u677f\u3002\n    *   **\u6280\u80fd\u8d44\u6e90**: \u9500\u552e\u53cd\u9988\u201c\u57fa\u7840\u90fd\u5f88\u597d\u201d\u3001\u201c\u5f88\u60ca\u8273\u201d\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u58f0\u97f3\u5929\u8d4b\u6216\u57fa\u7840\u3002\u4f46\u7528\u6237\u81ea\u8bc4\u201c\u8fd8\u4e0d\u4f1a\u201d\uff0c\u4fe1\u5fc3\u4e0d\u8db3\u3002\n\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u7b49)**\n    *   **\u987a\u4ece\u6027/\u914d\u5408\u5ea6\u9ad8**: \u79ef\u6781\u56de\u590d\u3001\u53c2\u4e0e\u76f4\u64ad\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u63a5\u53d7\u70b9\u8bc4\uff0c\u6001\u5ea6\u793c\u8c8c\uff08\u591a\u6b21\u201c\u611f\u8c22\u5e08\u59d0\u201d\uff09\u3002\n    *   **\u4e3b\u52a8\u6027\u4e00\u822c**: \u63d0\u95ee\u591a\u4e3a\u56de\u5e94\u9500\u552e\u5f15\u5bfc\u6216\u6f84\u6e05\u4fe1\u606f\uff08\u201c\u5c5e\u4e8e\u4f60\u4eec\u56e2\u961f\u5417\uff1f\u201d\u201c\u798f\u5229\u627e\u4f60\u9886\u5417\uff1f\u201d\uff09\uff0c\u7f3a\u4e4f\u81ea\u53d1\u6df1\u5ea6\u63a2\u7d22\u3002\n    *   **\u51b3\u7b56\u72b9\u8c6b**: \u5728\u9500\u552e\u591a\u6b21\u50ac\u5355\u540e\uff0c\u624d\u5728\u4f53\u9a8c\u8425\u672b\u671f\u51b3\u5b9a\u62a5\u540d\uff0c\u8fc7\u7a0b\u4e2d\u53cd\u590d\u8be2\u95ee\u7ec6\u8282\uff08\u56de\u653e\u3001\u62a5\u540d\u5fc5\u8981\u6027\u3001\u9009\u4e66\u673a\u5236\uff09\uff0c**\u5b58\u5728\u660e\u663e\u7684\u8c28\u614e\u548c\u4f9d\u8d56\u503e\u5411**\u3002\n    *   **\u6297\u538b\u6027\u672a\u77e5**: \u672a\u7ecf\u5386\u660e\u663e\u632b\u6298\uff0c\u9762\u5bf9\u672a\u6765\u5b66\u4e60\u538b\u529b\u548c\u63a5\u5355\u7ade\u4e89\u7684\u5fc3\u7406\u627f\u53d7\u529b\u672a\u77e5\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u4e8e4\u670812\u65e5\u652f\u4ed87380\u5143\u9ad8\u9636\u73ed\u8d39\u7528\uff0c\u5b8c\u6210\u8f6c\u5316\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u914d\u5076\u3001\u7236\u6bcd\u7b49\u5bb6\u5ead\u6210\u5458\u610f\u89c1\uff0c\u7528\u6237\u51b3\u7b56\u770b\u4f3c\u72ec\u7acb\uff0c\u4f46\u201c\u7167\u987e\u5b69\u5b50\u548c\u5bb6\u5ead\u201d\u7684\u8868\u8ff0\u6697\u793a\u5bb6\u5ead\u8d23\u4efb\u53ef\u80fd\u5f71\u54cd\u5176\u5b66\u4e60\u6295\u5165\u5ea6\u3002\n*   **\u6b65\u9aa41 - \u9700\u6c42\u771f\u5b9e\u6027**: **\u771f\u5b9e**\u3002\u7528\u6237\u5bf9\u517c\u804c/\u5168\u804c\u3001\u5de5\u4f5c\u6a21\u5f0f\u3001\u5b66\u4e60\u8def\u5f84\u6709\u5177\u4f53\u63d0\u95ee\uff0c\u975e\u5355\u7eaf\u4fe1\u606f\u6536\u96c6\u3002\n*   **\u6b65\u9aa42 - \u4ed8\u8d39\u80fd\u529b**: **\u5177\u5907**\u3002\u5df2\u5b8c\u6210\u652f\u4ed8\u3002\n*   **\u6b65\u9aa43 - \u4ed8\u8d39\u610f\u613f**: **\u4e2d\u7b49\u504f\u4e0a**\u3002\u867d\u7ecf\u72b9\u8c6b\uff0c\u4f46\u6700\u7ec8\u4ed8\u8d39\uff0c\u663e\u793a\u610f\u613f\u5b58\u5728\u3002\n*   **\u6b65\u9aa44 - \u884c\u52a8\u529b**: **\u4e2d\u7b49**\u3002\u80fd\u8ddf\u8fdb\u4f53\u9a8c\u8425\u4efb\u52a1\uff0c\u4f46\u51b3\u7b56\u8f83\u6162\uff0c\u9700\u5916\u90e8\u63a8\u52a8\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**: **B\u7c7b\u7528\u6237 (\u6447\u6446\u52a1\u5b9e\u578b)**\u3002\u5177\u5907\u4ed8\u8d39\u80fd\u529b\u548c\u57fa\u7840\u610f\u613f\uff0c\u9700\u6c42\u771f\u5b9e\uff0c\u4f46\u52a8\u673a\u504f\u5b9e\u7528\u4e3b\u4e49\uff0c\u51b3\u7b56\u8c28\u614e\uff0c\u4f9d\u8d56\u5f15\u5bfc\uff0c\u540e\u7eed\u5b66\u4e60\u575a\u6301\u5ea6\u548c\u4ef7\u503c\u611f\u77e5\u662f\u5173\u952e\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b: T4 \u8c28\u614e\u8ddf\u4ece\u8005**\n    *   **\u6838\u5fc3\u7279\u5f81**: \u76ee\u6807\u660e\u786e\uff08\u8d5a\u94b1/\u517c\u804c\uff09\uff0c\u4f46\u4fe1\u5fc3\u4e0d\u8db3\u3001\u5bb3\u6015\u8e29\u5751\u3002\u51b3\u7b56\u4f9d\u8d56\u6743\u5a01\uff08\u9500\u552e/\u5e08\u59d0\uff09\u5f15\u5bfc\u548c\u627f\u8bfa\uff0c\u9700\u8981\u660e\u786e\u7684\u8def\u5f84\u548c\u4fdd\u969c\u3002\u914d\u5408\u5ea6\u9ad8\uff0c\u4f46\u4e3b\u52a8\u6027\u4e0d\u5f3a\u3002\n    *   **\u543b\u5408\u70b9**:\n        1.  \u53cd\u590d\u786e\u8ba4\u201c\u62a5\u540d\u5fc5\u8981\u6027\u201d\u3001\u201c\u662f\u5426\u5c5e\u4e8e\u56e2\u961f\u201d\u3001\u201c\u798f\u5229\u662f\u5426\u627e\u4f60\u9886\u201d\uff0c\u5bfb\u6c42\u786e\u5b9a\u6027\u548c\u5f52\u5c5e\u611f\u3002\n        2.  \u51b3\u7b56\u524d\u591a\u6b21\u8be2\u95ee\u7ec6\u8282\uff08\u76f4\u64ad\u56de\u653e\u3001\u5168\u804c\u6761\u4ef6\u3001\u9009\u4e66\u673a\u5236\uff09\uff0c\u4f53\u73b0\u8c28\u614e\u3002\n        3.  \u6c9f\u901a\u793c\u8c8c\u3001\u987a\u4ece\uff0c\u79ef\u6781\u5b8c\u6210\u4f53\u9a8c\u8425\u4efb\u52a1\uff0c\u5c5e\u4e8e\u201c\u597d\u5b66\u751f\u201d\u7c7b\u578b\u3002\n        4.  \u5bf9\u201c\u5e08\u59d0\u201d\u4ea7\u751f\u4fe1\u4efb\u548c\u4f9d\u8d56\uff08\u201c\u4ee5\u540e\u662f\u4e0d\u662f\u6709\u4ec0\u4e48\u4e8b\u90fd\u7b2c\u4e00\u65f6\u95f4\u53ef\u4ee5\u627e\u4f60\uff1f\u201d\uff09\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4e2d)\n\u9010\u9879\u6392\u67e57\u5927\u6839\u56e0\uff1a\n1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**: **\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u201c\u5b66\u4e60\u591a\u4e45\u201d\u6709\u7591\u95ee\uff0c\u671f\u5f85\u201c\u5feb\u901f\u53d8\u73b0\u201d\u3002\u82e5\u5b66\u4e60\u66f2\u7ebf\u9661\u5ced\u6216\u63a5\u5355\u4e0d\u987a\uff0c\u6613\u4ea7\u751f\u843d\u5dee\u3002\n2.  **\u7ecf\u6d4e\u538b\u529b**: **\u4e2d\u98ce\u9669**\u3002\u652f\u4ed87380\u5143\u4f46\u672a\u900f\u9732\u7ecf\u6d4e\u80cc\u666f\uff0c\u82e5\u526f\u4e1a\u6536\u5165\u4e0d\u53ca\u9884\u671f\uff0c\u53ef\u80fd\u5f15\u53d1\u7ecf\u6d4e\u8003\u91cf\u3002\n3.  **\u65f6\u95f4\u51b2\u7a81**: **\u4e2d\u98ce\u9669**\u3002\u867d\u8ffd\u6c42\u7075\u6d3b\uff0c\u4f46\u517c\u987e\u5bb6\u5ead\u4e0e\u5b66\u4e60\u53ef\u80fd\u4ea7\u751f\u65f6\u95f4\u538b\u529b\uff0c\u5c24\u5176\u662f\u8fdb\u5165\u5b9e\u64cd\u7ec3\u4e60\u9636\u6bb5\u3002\n4.  **\u8bfe\u7a0b\u8d28\u91cf\u5f02\u8bae**: **\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u5bf9\u9500\u552e\u548c\u4f53\u9a8c\u8425\u53cd\u9988\u6b63\u9762\u3002\n5.  **\u670d\u52a1\u4f53\u9a8c\u4e0d\u4f73**: **\u4f4e\u98ce\u9669**\u3002\u4e0e\u9500\u552e\u4e92\u52a8\u826f\u597d\uff0c\u4f46\u9700\u5173\u6ce8\u8f6c\u4ea4\u73ed\u4e3b\u4efb\u540e\u7684\u670d\u52a1\u8854\u63a5\u3002\n6.  **\u9500\u552e\u627f\u8bfa\u4e0d\u7b26**: **\u4e2d\u98ce\u9669**\u3002\u9500\u552e\u627f\u8bfa\u201c\u7b2c\u4e8c\u5468\u5f00\u901a\u63a5\u4e66\u6743\u9650\u201d\u3001\u201c\u514d\u8003\u6838\u5165\u9a7b\u201d\u3001\u201c\u4e00\u5bf9\u4e00\u4f5c\u4e1a\u70b9\u8bc4\u201d\u7b49\uff0c**\u9700\u786e\u4fdd\u540e\u7eed\u670d\u52a1\u5168\u90e8\u5151\u73b0**\uff0c\u5426\u5219\u6613\u5f15\u53d1\u6295\u8bc9\u3002\n7.  **\u5bb6\u5ead\u53cd\u5bf9**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u9700\u540e\u7eed\u5173\u6ce8\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u57fa\u672c\u5408\u89c4**: \u9500\u552e\u8fc7\u7a0b\u672a\u53d1\u73b0\u660e\u663e\u5a01\u903c\u3001\u6b3a\u8bc8\u8bdd\u672f\u3002\u63d0\u4f9b\u4e86\u4f53\u9a8c\u8425\u3001\u76f4\u64ad\u3001\u4f5c\u4e1a\u70b9\u8bc4\u7b49\u524d\u7f6e\u670d\u52a1\u3002\n*   **\u98ce\u9669\u70b9**:\n    *   **\u627f\u8bfa\u5177\u4f53\u5316**: \u201c\u7b2c\u4e8c\u5468\u5f00\u901a\u63a5\u4e66\u6743\u9650\u201d\u3001\u201c\u514d\u8003\u6838\u5165\u9a7bA+\u5e73\u53f0\u201d\u3001\u201c\u4e00\u5bf9\u4e00\u4f5c\u4e1a\u70b9\u8bc4\u201d\u7b49\u627f\u8bfa\u5177\u4f53\uff0c**\u9700\u6709\u660e\u786e\u5408\u540c\u6216\u6761\u6b3e\u5bf9\u5e94**\uff0c\u5426\u5219\u6613\u5f15\u53d1\u4e89\u8bae\u3002\n    *   **\u6536\u76ca\u6697\u793a**: \u63d0\u53ca\u201c\u7d2b\u895f\u5927\u5927\u4e00\u5c0f\u65f65000\u5757\u201d\u7b49\u5934\u90e8\u6848\u4f8b\uff0c\u867d\u672a\u76f4\u63a5\u627f\u8bfa\u7528\u6237\u53ef\u8fbe\u540c\u7b49\u6c34\u5e73\uff0c\u4f46\u53ef\u80fd\u8425\u9020\u4e0d\u5207\u5b9e\u9645\u7684\u9884\u671f\u3002**\u9700\u5728\u540e\u7eed\u6c9f\u901a\u4e2d\u7ba1\u7406\u6536\u76ca\u9884\u671f**\u3002\n    *   **\u5236\u9020\u7a00\u7f3a\u6027**: \u201c\u6700\u540e\u4e00\u6279\u8bd5\u97f3\u5355\u201d\u3001\u201c24\u5c0f\u65f6\u6709\u6548\u201d\u3001\u201c\u624b\u4e0a\u8fd8\u67091\u5957\u5b8c\u6574\u7684\u62a5\u540d\u798f\u5229\u201d\u7b49\u8bdd\u672f\uff0c\u5c5e\u4e8e\u5e38\u89c1\u4fc3\u5355\u6280\u5de7\uff0c\u672a\u8fc7\u5ea6\u8fdd\u89c4\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6838\u5fc3\u7b56\u7565**: **\u63d0\u4f9b\u786e\u5b9a\u6027\u3001\u5efa\u7acb\u5f52\u5c5e\u611f\u3001\u7ba1\u7406\u9884\u671f\u3001\u5c0f\u6b65\u5feb\u8dd1**\u3002\n*   **\u884c\u52a8\u6307\u5357**:\n    1.  **\u5f3a\u5316\u4fe1\u4efb\u4e0e\u5f52\u5c5e**: \u73ed\u4e3b\u4efb\u63a5\u624b\u540e\uff0c\u7b2c\u4e00\u65f6\u95f4\u5efa\u7acb\u8054\u7cfb\uff0c\u91cd\u7533\u9500\u552e\u627f\u8bfa\u7684\u670d\u52a1\u9879\uff08\u63a5\u5355\u6743\u9650\u3001\u4e00\u5bf9\u4e00\u6307\u5bfc\u7b49\uff09\uff0c\u660e\u786e\u81ea\u5df1\u4e0e\u9500\u552e\u7684\u53cc\u91cd\u652f\u6301\u89d2\u8272\uff0c\u590d\u5236\u201c\u5e08\u59d0\u201d\u7684\u5173\u6000\u6a21\u5f0f\u3002\n    2.  **\u8def\u5f84\u6e05\u6670\u5316**: \u4e3a\u5176\u5236\u5b9a\u6781\u5176\u6e05\u6670\u7684\u5b66\u4e60\u5468\u8ba1\u5212\u3001\u63a5\u5355\u51c6\u5907\u65f6\u95f4\u8868\u3002\u5c06\u5927\u76ee\u6807\u62c6\u89e3\u4e3a\u53ef\u8fbe\u6210\u7684\u5c0f\u4efb\u52a1\uff08\u5982\uff1a\u7b2c\u4e00\u5468\u5b8c\u6210\u8bbe\u5907\u8c03\u8bd5\u3001\u7b2c\u4e8c\u5468\u5b8c\u6210\u9996\u4e2a\u8bd5\u97f3\uff09\uff0c\u53ca\u65f6\u7ed9\u4e88\u6b63\u5411\u53cd\u9988\u3002\n    3.  **\u9884\u671f\u7ba1\u7406**: \u65e9\u671f\u6c9f\u901a\u4e2d\uff0c\u5ba2\u89c2\u8bf4\u660e\u884c\u4e1a\u6536\u5165\u5206\u5e03\uff08\u91d1\u5b57\u5854\u7ed3\u6784\uff09\uff0c\u5f3a\u8c03\u524d\u671f\u79ef\u7d2f\u7684\u91cd\u8981\u6027\uff0c\u5c06\u201c\u53d8\u73b0\u201d\u9884\u671f\u8c03\u6574\u4e3a\u201c\u80fd\u529b\u6210\u957f+\u5c0f\u989d\u53d8\u73b0\u201d\u7ec4\u5408\u3002\n    4.  **\u964d\u4f4e\u542f\u52a8\u95e8\u69db**: \u4f18\u5148\u5f15\u5bfc\u5b8c\u6210\u7b80\u5355\u7684\u65c1\u767d\u7c7b\u4efb\u52a1\u6216\u5bf9\u8f68\u540e\u671f\u7b49\u201c\u659c\u6760\u201d\u5de5\u79cd\uff0c\u8ba9\u5176\u5feb\u901f\u83b7\u5f97\u201c\u5b8c\u6210\u611f\u201d\u548c\u5fae\u5c0f\u6b63\u53cd\u9988\uff0c\u5efa\u7acb\u4fe1\u5fc3\u3002\n    5.  **\u4e3b\u52a8\u5173\u6000\uff0c\u9884\u9632\u9000\u7f29**: \u8be5\u7c7b\u7528\u6237\u9047\u5230\u56f0\u96be\u53ef\u80fd\u4e0d\u4e3b\u52a8\u6c42\u52a9\u3002\u73ed\u4e3b\u4efb\u9700\u5b9a\u671f\u4e3b\u52a8\u8be2\u95ee\u8fdb\u5ea6\u3001\u96be\u70b9\uff0c\u63d0\u524d\u63d0\u4f9b\u89e3\u51b3\u65b9\u6848\uff0c\u9632\u6b62\u95ee\u9898\u5806\u79ef\u5bfc\u81f4\u653e\u5f03\u3002\n    6.  **\u793e\u7fa4\u94fe\u63a5**: \u5c06\u5176\u5f15\u5165\u5b66\u4e60\u6c1b\u56f4\u597d\u3001\u6709\u540c\u7c7b\u5b66\u5458\uff08\u5b9d\u5988\u3001\u517c\u804c\u8005\uff09\u7684\u5c0f\u7ec4\uff0c\u901a\u8fc7\u540c\u4f34\u5f71\u54cd\u589e\u5f3a\u575a\u6301\u52a8\u529b\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**:\n    *   **\u4e3b\u7ebf**: \u6309\u5df2\u8d2d\u9ad8\u9636\u73ed\u8def\u5f84\u63a8\u8fdb\u3002\n    *   **\u589e\u503c/\u4e50\u9ad8\u7ebf**: \u521d\u671f\u53ef\u63a8\u8350**\u5165\u95e8\u7ea7\u5f55\u97f3\u8bbe\u5907\u5957\u9910**\uff08\u89e3\u51b3\u786c\u4ef6\u62c5\u5fe7\uff09\u3001**\u77ed\u671f\u65c1\u767d\u5b9e\u6218\u8bad\u7ec3\u8425**\uff08\u5feb\u901f\u5efa\u7acb\u4fe1\u5fc3\uff09\u3002\u4e2d\u540e\u671f\u6839\u636e\u5176\u5174\u8da3\uff08\u8a00\u60c5\u7c7b\uff09\u63a8\u8350**\u7ec6\u5206\u9886\u57df\u89d2\u8272\u97f3\u7cbe\u4fee\u8bfe**\u6216**\u8a00\u60c5\u7c7b\u4e66\u5355\u8d44\u6e90\u5305**\u3002\n\n{\"core_type\": \"T4 \u8c28\u614e\u8ddf\u4ece\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168/\u5c0a\u91cd\", \"target_product_line\": \"\u8bbe\u5907\u5957\u9910\u3001\u77ed\u671f\u5b9e\u6218\u8425\u3001\u7ec6\u5206\u9886\u57df\u7cbe\u4fee\u8bfe\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}";
