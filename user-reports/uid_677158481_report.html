    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677158481 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u516d\u6708\u6668\u516e3(\u5218\u4e9a\u5a1f) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b (\u4ef7\u683c\u672a\u660e\u793a\uff0c\u63d0\u53ca\u201c2380\u201d\u53ef\u80fd\u4e3a\u4f18\u60e0\u540e\u4ef7\u683c) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u4ec5\u63d0\u53ca\u201c2380\u201d\uff0c\u672a\u6d89\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u8d44\u91d1\u6765\u6e90\u6216\u5bb6\u5ead\u8ba8\u8bba\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u80fd\u8ddf\u4e0a\u5bc6\u96c6\u7684\u76f4\u64ad\u3001\u4f5c\u4e1a\u3001Pia\u620f\uff0c\u8868\u660e\u6709\u8f83\u591a\u53ef\u652f\u914d\u65f6\u95f4\uff0c\u4f46\u5177\u4f53\u804c\u4e1a\u3001\u4f5c\u606f\u672a\u77e5\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u4eba\u6216\u5bb6\u5ead\u8d22\u52a1\u72b6\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49\u504f\u4e0b**\u3002\u5bf9\u8bdd\u4ee5\u9500\u552e\u5f15\u5bfc\u548c\u7528\u6237\u6267\u884c\u6307\u4ee4\u4e3a\u4e3b\uff0c\u7528\u6237\u4e3b\u52a8\u66b4\u9732\u7684\u4e2a\u4eba\u4fe1\u606f\u6781\u5c11\uff0c**\u5173\u952e\u7ef4\u5ea6\uff08\u652f\u4ed8\u80fd\u529b\u3001\u5bb6\u5ead\u652f\u6301\u3001\u6df1\u5c42\u52a8\u673a\uff09\u4e25\u91cd\u7f3a\u5931**\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34\u578b**\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6280\u80fd\u5b66\u4e60\u7684\u5174\u8da3\u548c\u6295\u5165\uff08\u4e3b\u52a8\u91cd\u5f55\u3001\u53c2\u4e0ePia\u620f\uff09\uff0c\u4f46\u9500\u552e\u5168\u7a0b\u4ee5\u201c\u53d8\u73b0\u201d\u3001\u201c\u63a5\u5355\u201d\u3001\u201c\u65f6\u85aa90-300\u201d\u3001\u201c\u7b2c\u4e00\u6876\u91d1\u201d\u7b49\u4e3a\u94a9\u5b50\u9a71\u52a8\uff0c\u7528\u6237\u672a\u660e\u786e\u8868\u8fbe\u957f\u671f\u6216\u7eaf\u7cb9\u7684\u5174\u8da3\u9a71\u52a8\uff0c\u4e5f\u672a\u63d0\u51fa\u6781\u901f\u53d8\u73b0\u8981\u6c42\u3002\u52a8\u673a\u5728\u201c\u5b66\u6280\u80fd\u201d\u548c\u201c\u8d5a\u5916\u5feb\u201d\u4e4b\u95f4\u6447\u6446\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5185\u5bb9\u4e30\u5bcc\uff0c\u5e72\u8d27\u6ee1\u6ee1\uff1b\u7531\u6d45\u5165\u6df1\uff0c\u5f15\u4eba\u5165\u80dc\uff01\u201d (\u5bf9\u5185\u5bb9\u8ba4\u53ef) > \u201c\u8fd9\u4e2aPIA\u8fd8\u86ee\u597d\u73a9\u7684\u201d (\u4f53\u9a8c\u4e50\u8da3)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[**\u4fe1\u606f\u4e0d\u8db3**] \u2014 \u672a\u63d0\u53ca\u4efb\u4f55\u7ecf\u6d4e\u72b6\u51b5\uff0c\u4ec5\u6700\u540e\u51fa\u73b0\u201c2380\u201d\u4ef7\u683c\uff0c\u65e0\u6cd5\u5224\u65ad\u5176\u652f\u4ed8\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[**\u4e2d**] \u2014 \u80fd\u8fde\u7eed\u591a\u65e5\u53c2\u4e0e\u5348\u95f4\u76f4\u64ad\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u52a0\u665a\u95f4Pia\u620f\uff0c\u663e\u793a\u65f6\u95f4\u76f8\u5bf9\u5bbd\u88d5\uff0c\u6295\u5165\u5ea6\u9ad8\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[**\u4fe1\u606f\u4e0d\u8db3**] \u2014 \u804a\u5929\u8bb0\u5f55\u5b8c\u5168\u672a\u6d89\u53ca\u5bb6\u5ead\uff0c\u662f**\u91cd\u5927\u98ce\u9669\u76f2\u533a**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u201c\u6c34\u5e73\u592a\u5dee\u201d\u7684\u81ea\u8bc4\u548c\u201c\u611f\u89c9\u4e0d\u7406\u60f3\u201d\u7684\u4f5c\u4e1a\uff0c\u7528\u6237\u53cd\u5e94\u662f\u201c\u6162\u6162\u51cf\u8f7b\u4f53\u91cd\uff0c\u52a0\u628a\u529b\u5427\u201d\u3001\u201c\u6839\u636e\u8001\u5e08\u7684\u6307\u70b9\uff0c\u6211\u53c8\u91cd\u65b0\u5f55\u4e86\u4e00\u904d\u201d\uff0c\u8868\u73b0\u51fa\u79ef\u6781\u7684\u884c\u52a8\u529b\u548c\u4ece\u6307\u5bfc\u4e2d\u5b66\u4e60\u7684\u80fd\u529b\uff0c\u65e0\u62b1\u6028\u6216\u653e\u5f03\u503e\u5411\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8fd9\u662f\u6211\u521a\u624d\u7684\u8bd5\u97f3\uff0c\u611f\u89c9\u8fd8\u662f\u5f88\u4e0d\u7406\u60f3\uff0c\u8bf7\u8001\u5e08\u6279\u8bc4\u201d (\u4e3b\u52a8\u5bfb\u6c42\u53cd\u9988) > \u201c\u5c0f\u767d\u7684\u5fc3\u91cc\u662f\u4e86\u89e3\u7684\uff0c\u60f3\u98de\u9ad8\u70b9\uff0c\u53ef\u4f53\u91cd\u592a\u5927\u554a\u3002\u6162\u6162\u51cf\u8f7b\u4f53\u91cd\uff0c\u52a0\u628a\u529b\u5427\uff01\u201d (\u5e7d\u9ed8\u81ea\u5632\uff0c\u5fc3\u6001\u79ef\u6781)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u4f5c\u4e3a\u201c\u7406\u5de5\u7537\u201d\uff0c\u5728\u64ad\u97f3\u9886\u57df\u662f\u201c\u5c0f\u767d\u201d\uff0c\u5b58\u5728\u5bf9\u81ea\u8eab\u827a\u672f\u8868\u8fbe\u80fd\u529b\u548c\u5728\u65b0\u9886\u57df\u83b7\u5f97\u8ba4\u53ef\u7684\u4e0d\u81ea\u4fe1\u3002\u4ed6\u9700\u8981\u7684\u662f**\u901a\u8fc7\u638c\u63e1\u4e00\u9879\u65b0\u6280\u80fd\uff0c\u83b7\u5f97\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u548c\u793e\u7fa4\u5f52\u5c5e\u611f**\uff0c\u4ece\u800c\u63d0\u5347\u81ea\u6211\u4ef7\u503c\u611f\u548c\u88ab\u5c0a\u91cd\u7684\u611f\u89c9\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u793e\u7fa4\u878d\u5165\u611f**\u3002\u4ed6\u975e\u5e38\u4eab\u53d7\u8001\u5e08\u7684\u7ec6\u81f4\u70b9\u8bc4\u3001Pia\u620f\u4e2d\u7684\u4e92\u52a8\u4ee5\u53ca\u201c\u901a\u5173\u6210\u529f\u201d\u7684\u8363\u8a89\u3002\u63d0\u4f9b\u660e\u786e\u7684\u8fdb\u6b65\u53cd\u9988\u548c\u5c06\u4ed6\u7eb3\u5165\u201c\u5708\u5185\u4eba\u201d\u7684\u8eab\u4efd\u8ba4\u540c\uff0c\u662f\u6838\u5fc3\u9a71\u52a8\u529b\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u7cbe\u786e\u5224\u5b9a**\u3002\u57fa\u4e8e\u73b0\u6709\u79ef\u6781\u4fe1\u53f7\uff0c\u503e\u5411 **\ud83d\udfe7B\u7c7b** (\u6709\u6f5c\u529b\uff0c\u4f46\u9700\u8865\u5168\u5bb6\u5ead\u4e0e\u652f\u4ed8\u4fe1\u606f)\u3002 |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **[T2 \u4f4e\u8c03\u5b9e\u5e72\u578b]**\u3002\u7528\u6237\u8868\u73b0\u51fa\u8e0f\u5b9e\u3001\u8ba4\u771f\u3001\u9075\u5faa\u6307\u5bfc\u3001\u613f\u610f\u7ec3\u4e60\u6253\u78e8\u7684\u7279\u8d28\u3002\u4ed6\u4eab\u53d7\u5b66\u4e60\u8fc7\u7a0b\u672c\u8eab\u5e26\u6765\u7684\u8fdb\u6b65\u548c\u4e50\u8da3\uff08\u5982Pia\u620f\uff09\uff0c\u800c\u4e0d\u4ec5\u4ec5\u662f\u7ed3\u679c\u3002\u7b26\u5408\u201c\u95f7\u58f0\u5e72\u786c\u6838\u6d3b\u6c42\u80af\u5b9a\u201d\u7684\u753b\u50cf\u3002 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u804a\u5929\u8bb0\u5f55\u4e2d\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5ead\u5267\u70c8\u51b2\u7a81\u7b49D\u7c7b\u7ea2\u7ebf\u4fe1\u53f7\u3002**\u4f46\u5bb6\u5ead\u4e0e\u652f\u4ed8\u4fe1\u606f\u7f3a\u5931\uff0c\u9700\u5728\u8f6c\u5316\u524d\u7d27\u6025\u8865\u5168\u6838\u67e5**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** (\u56e0\u4fe1\u606f\u7f3a\u5931\uff0c\u98ce\u9669\u4e0d\u53ef\u5ffd\u89c6) | \u82e5\u62a5\u540d\u662f\u7792\u7740\u5bb6\u4eba\u52a8\u7528\u5bb6\u5ead\u50a8\u5907\u91d1\u6216\u5f15\u53d1\u77db\u76fe\uff0c\u98ce\u9669\u6781\u9ad8\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u7528\u6237\u65f6\u95f4\u6295\u5165\u5ea6\u9ad8\uff0c\u5b66\u4e60\u6001\u5ea6\u79ef\u6781\uff0c\u81ea\u5f8b\u6027\u8f83\u597d\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u63a5\u53d7\u6279\u8bc4\u5e76\u4e3b\u52a8\u6539\u8fdb\uff0c\u975e\u60c5\u7eea\u5316\u4eba\u683c\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u9500\u552e\u8fc7\u5ea6\u6e32\u67d3\u201c\u65f6\u85aa90-300\u201d\u3001\u201c\u788e\u7247\u65f6\u95f4\u6708\u51651W\u201d\uff0c\u82e5\u6b63\u5f0f\u5b66\u4e60\u540e\u63a5\u5355\u673a\u4f1a\u6216\u6536\u5165\u8fdc\u4e0d\u53ca\u9884\u671f\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468\uff08\u6b7b\u4ea1\u8c37\u521d\u671f\uff09**\u3002\u5f53\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u8fdb\u5165\u67af\u71e5\u7ec3\u4e60\u671f\uff0c\u82e5\u540c\u65f6\u53d1\u73b0\u63a5\u5355\u53d8\u73b0\u56f0\u96be\uff0c\u4e14\u5bb6\u5ead\u53cd\u5bf9\u538b\u529b\u6d6e\u73b0\uff0c\u53ef\u80fd\u5f15\u53d1\u9000\u8d39\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cXX\u540c\u5b66\uff0c\u770b\u5230\u4f60\u5728\u4f53\u9a8c\u8425\u91cc\u90a3\u4e48\u8ba4\u771f\u6253\u78e8\u4f5c\u4e1a\uff0c\u8fd8\u4e3b\u52a8\u6f14\u4e86\u6cd5\u6d77\uff0c\u8fd9\u80a1\u94bb\u7814\u52b2\u513f\u7279\u522b\u6253\u52a8\u6211\u3002\u54b1\u4eec\u6b63\u5f0f\u8bfe\u4f1a\u5e26\u4f60\u66f4\u6df1\u5730\u624e\u8fdb\u89d2\u8272\u548c\u6545\u4e8b\u91cc\uff0c\u4f60\u8fd9\u79cd\u2018\u7406\u5de5\u7537+\u73ed\u5e72\u2019\u7684\u903b\u8f91\u548c\u9886\u5bfc\u529b\uff0c\u5728\u7406\u89e3\u4eba\u7269\u548c\u628a\u63a7\u53d9\u4e8b\u8282\u594f\u4e0a\u4f1a\u662f\u5de8\u5927\u4f18\u52bf\u3002\u522b\u62c5\u5fc3\u2018\u4f53\u91cd\u2019\uff0c\u54b1\u4eec\u4e00\u8d77\u79d1\u5b66\u2018\u51cf\u91cd\u2019\uff0c\u6bcf\u4e00\u6b65\u8fdb\u6b65\u6211\u90fd\u4f1a\u7ed9\u4f60\u6700\u5b9e\u5728\u7684\u53cd\u9988\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u3002\u5339\u914d\u5176T2\u5b9e\u5e72\u7279\u8d28\uff0c\u63d0\u4f9b\u6e05\u6670\u7684\u6280\u672f\u8fdb\u9636\u8def\u5f84\u548c\u5b9e\u6218\u673a\u4f1a\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u5c0a\u91cd\u9700\u6c42\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010**\u5708\u5c42\u8eab\u4efd\u8d4b\u80fd\u5305**\u3011\u3002\u5982\uff1a\u4efb\u547d\u4e3a\u5c0f\u7ec4\u957f\u3001\u9080\u8bf7\u8fdb\u5165\u201c\u7cbe\u82f1\u5b9e\u8bad\u7fa4\u201d\u3001\u7ed9\u4e88\u4f5c\u54c1\u4f18\u5148\u5c55\u793a\u6743\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u8981\u53ea\u753b\u53d8\u73b0\u5927\u997c\u800c\u5ffd\u89c6\u6280\u80fd\u53cd\u9988**\u3002\u907f\u514d\u6301\u7eed\u7528\u201c\u5f88\u5feb\u80fd\u8d5a\u591a\u5c11\u201d\u523a\u6fc0\uff0c\u5e94\u591a\u5f3a\u8c03\u201c\u4f60\u8fd9\u6bb5\u620f\u611f\u6bd4\u4e0a\u5468\u53c8\u8fdb\u6b65\u4e86\u201d\u3002\n    2. **\u7edd\u4e0d\u8981\u5728\u5bb6\u5ead\u4fe1\u606f\u672a\u6838\u5b9e\u524d\u63a8\u52a8\u5927\u989d\u5347\u5355**\u3002\u5fc5\u987b\u8865\u5168\u201c\u5bb6\u5ead\u77e5\u60c5\u6743\u201d\u4fe1\u606f\uff0c\u5426\u5219\u98ce\u9669\u6781\u9ad8\u3002\n    3. \u7edd\u4e0d\u8981\u5c06\u4ed6\u4e0e\u5929\u8d4b\u578b\u5b66\u5458\u6bd4\u8f83\uff0c\u5e94\u5f3a\u8c03\u5176\u201c\u52aa\u529b\u578b\u201d\u8fdb\u6b65\u7684\u53ef\u8d35\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u5728\u8865\u5168\u5bb6\u5ead\u4e0e\u652f\u4ed8\u80fd\u529b\u4fe1\u606f\u524d\uff0c\u4e25\u7981\u4efb\u4f55\u5347\u5355**\u3002\u4fe1\u606f\u786e\u8ba4\u540e\uff0c\u53ef\u57fa\u4e8e\u5176\u5b66\u4e60\u8fdb\u5ea6\u548c\u6210\u679c\uff0c\u63a8\u8350\u8fdb\u9636\u6280\u5de7\u7c7b\u8bfe\u7a0b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5c0f\u767d\u7684\u5fc3\u91cc\u662f\u4e86\u89e3\u7684\uff0c\u60f3\u98de\u9ad8\u70b9\uff0c\u53ef\u4f53\u91cd\u592a\u5927\u554a\u3002\u6162\u6162\u51cf\u8f7b\u4f53\u91cd\uff0c\u52a0\u628a\u529b\u5427\uff01\u518d\u6b21\u611f\u8c22\u3002\u201d **(\u8bc1\u660e\uff1a\u81ea\u5632\u5f0f\u4e50\u89c2\uff0c\u9ad8\u5fc3\u7406\u5f39\u6027\uff0cT2\u5b9e\u5e72\u5fc3\u6001)**\n2. > \u201c\u8fd9\u4e2aPIA\u8fd8\u86ee\u597d\u73a9\u7684\u201d\u3001\u201c\u5927\u5bb6\u6f14\u7684\u771f\u4e0d\u9519\u201d\u3001\u201c\u6211\u6f14\u4e86\u6700\u540e\u7684\u6cd5\u6d77\uff0c\u597d\u73a9\u3002\u5f88\u6709\u6536\u83b7\u201d **(\u8bc1\u660e\uff1a\u4eab\u53d7\u5b66\u4e60\u8fc7\u7a0b\uff0c\u793e\u4ea4\u4e0e\u5c0a\u91cd\u9700\u6c42\u9a71\u52a8\uff0c\u975e\u7eaf\u529f\u5229)**\n3. > \u201c\u8fd9\u662f\u6211\u521a\u624d\u7684\u8bd5\u97f3\uff0c\u611f\u89c9\u8fd8\u662f\u5f88\u4e0d\u7406\u60f3\uff0c\u8bf7\u8001\u5e08\u6279\u8bc4\u201d **(\u8bc1\u660e\uff1a\u4e3b\u52a8\u5bfb\u6c42\u4e13\u4e1a\u53cd\u9988\uff0c\u5b66\u4e60\u5bfc\u5411\u660e\u786e)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u793e\u7fa4\u5c0a\u91cd\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff08\u4e3b\u8981\u98ce\u9669\u6765\u81ea\u672a\u9a8c\u8bc1\u7684\u5bb6\u5ead\u4e0e\u652f\u4ed8\u9690\u60a3\uff09\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7acb\u5373\u8865\u5168\u5bb6\u5ead\u77e5\u60c5\u6743\u4e0e\u652f\u4ed8\u80fd\u529b\u6838\u67e5\uff0c\u5e76\u5728\u670d\u52a1\u4e2d\u6301\u7eed\u7ed9\u4e88\u624e\u5b9e\u7684\u6280\u80fd\u8ba4\u53ef\u4e0e\u8eab\u4efd\u8d4b\u4e88\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"maslow_need\": \"\u7b2c\u56db\u5c42\u5c0a\u91cd\u9700\u6c42\", \"risk_level\": \"\u4e2d\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5708\u5c42\u8eab\u4efd\u8d4b\u80fd\u5305\"}\n```";
