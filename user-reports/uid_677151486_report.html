    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u7f3a\u5c11\u7528\u6237\u4e3b\u52a8\u63d0\u95ee\u3001\u4e2a\u4eba\u80cc\u666f\u3001\u5bb6\u5ead\u51b3\u7b56\u3001\u652f\u4ed8\u80fd\u529b\u3001\u5b66\u4e60\u76ee\u6807\u3001\u8fc7\u5f80\u7ecf\u5386\u7b49\u5173\u952e\u4fe1\u606f\uff0c\u7528\u6237\u4e92\u52a8\u591a\u4e3a\u88ab\u52a8\u54cd\u5e94\uff0c\u6df1\u5c42\u52a8\u673a\u4e0e\u8d44\u6e90\u5e95\u5ea7\u4fe1\u53f7\u4e0d\u8db3\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: \u4e2d\u4f4e\u3002\u7528\u6237\u8868\u73b0\u51fa\u57fa\u7840\u5b66\u4e60\u914d\u5408\u5ea6\uff08\u5b8c\u6210\u6253\u5361\u3001\u63d0\u4ea4\u53e3\u4ee4\u3001\u8be2\u95ee\u8bfe\u7a0b\uff09\uff0c\u4f46\u7f3a\u4e4f\u4e3b\u52a8\u63a2\u7d22\u548c\u660e\u786e\u76ee\u6807\u8868\u8fbe\u3002\u5bf9\u201c\u8003\u8bc1\u6536\u8d39\u201d\u548c\u201c\u540e\u7eed\u6536\u8d39\u201d\u7684\u8be2\u95ee\u663e\u793a\u51fa**\u8c28\u614e\u4e0e\u98ce\u9669\u89c4\u907f**\u503e\u5411\uff0c\u800c\u975e\u5f3a\u70c8\u7684\u6280\u80fd\u63d0\u5347\u6216\u53d8\u73b0\u6e34\u671b\u3002\u52a8\u673a\u504f\u5411\u201c\u8bd5\u8bd5\u770b\u201d\u548c\u201c\u907f\u514d\u635f\u5931\u201d\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: \u4fe1\u606f\u4e0d\u8db3\u3002\u4ec5\u77e5\u7528\u6237\u62e5\u6709\u667a\u80fd\u624b\u673a\uff08\u53ef\u80fd\u591a\u90e8\uff09\uff0c\u80fd\u64cd\u4f5c\u5fae\u4fe1/\u652f\u4ed8\u5b9d\u652f\u4ed8\u3002**\u7f3a\u4e4f\u65f6\u95f4\u6295\u5165\u627f\u8bfa**\uff08\u9500\u552e\u8be2\u95ee\u6bcf\u65e5\u53ef\u6295\u5165\u65f6\u95f4\u672a\u83b7\u56de\u590d\uff09\u3001\u8bbe\u5907\u6761\u4ef6\u3001\u5b66\u4e60\u73af\u5883\u3001\u7ecf\u6d4e\u72b6\u51b5\u7b49\u5173\u952e\u8d44\u6e90\u4fe1\u53f7\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: \u4e2d\u3002\u7528\u6237\u80fd\u6309\u90e8\u5c31\u73ed\u5b8c\u6210\u8bad\u7ec3\u8425\u4efb\u52a1\uff08\u6668\u7ec3\u3001\u4f5c\u4e1a\u3001\u770b\u76f4\u64ad\uff09\uff0c\u4e92\u52a8\u793c\u8c8c\uff08\u4f7f\u7528\u656c\u8bed\u3001\u8868\u60c5\u7b26\u53f7\uff09\u3002\u9762\u5bf9\u652f\u4ed8\u6280\u672f\u95ee\u9898\uff08\u624b\u673a\u53f7\u4e0d\u4e00\u81f4\uff09\u65f6\uff0c\u80fd\u914d\u5408\u9500\u552e\u5c1d\u8bd5\u89e3\u51b3\uff0c\u672a\u8868\u73b0\u51fa\u660e\u663e\u70e6\u8e81\u6216\u653e\u5f03\uff0c**\u5177\u5907\u57fa\u7840\u7684\u4efb\u52a1\u6267\u884c\u4e0e\u95ee\u9898\u89e3\u51b3\u8010\u5fc3**\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: \u5df2\u652f\u4ed8\u3002\u7528\u6237\u5b8c\u6210\u4e86\u201c\u9ad8\u9636\u201d\u8bfe\u7a0b\u7684\u652f\u4ed8\uff0c\u5c3d\u7ba1\u8fc7\u7a0b\u4e2d\u9047\u5230\u64cd\u4f5c\u95ee\u9898\uff0c\u4f46\u6700\u7ec8\u6210\u529f\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u4e0d\u8db3\uff0c\u98ce\u9669\u70b9**\u3002\u5168\u7a0b\u65e0\u4efb\u4f55\u5bb6\u5ead\u6216\u914d\u5076\u63d0\u53ca\uff0c\u7528\u6237\u72ec\u7acb\u5b8c\u6210\u54a8\u8be2\u4e0e\u652f\u4ed8\u3002\u4f46\u9274\u4e8e\u5176\u8c28\u614e\u8be2\u95ee\u6536\u8d39\u7684\u884c\u4e3a\uff0c**\u4e0d\u6392\u9664\u540e\u7eed\u5bb6\u5ead\u77e5\u60c5\u540e\u4ea7\u751f\u4e89\u8bae\u7684\u53ef\u80fd**\u3002\n*   **\u6b65\u9aa41-4 \u5224\u5b9a**: **C\u7c7b\u7528\u6237\uff08\u8c28\u614e\u8ddf\u968f\u8005\uff09**\u3002\u7528\u6237\u884c\u4e3a\u6a21\u5f0f\u4e3a\u88ab\u52a8\u54cd\u5e94\u9500\u552e\u5f15\u5bfc\uff0c\u5b8c\u6210\u4e86\u4ece\u4f53\u9a8c\u5230\u4ed8\u8d39\u7684\u5168\u6d41\u7a0b\uff0c\u4f46\u7f3a\u4e4f\u81ea\u53d1\u70ed\u60c5\u4e0e\u6df1\u5ea6\u627f\u8bfa\u3002\u5176\u4ed8\u8d39\u51b3\u7b56\u53ef\u80fd\u66f4\u591a\u6e90\u4e8e\u201c\u901a\u5173\u201d\u6c1b\u56f4\u8425\u9020\u3001\u9650\u65f6\u4f18\u60e0\uff08\u52a9\u5b66\u91d1\u3001\u7248\u6743\u4e66\uff09\u7684\u63a8\u52a8\uff0c\u4ee5\u53ca\u201c\u907f\u514d\u9519\u8fc7\u673a\u4f1a\u201d\u7684\u5fc3\u7406\uff0c\u800c\u975e\u5f3a\u70c8\u7684\u5185\u5728\u9a71\u52a8\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b: T5 \u8c28\u614e\u8ddf\u968f\u8005**\u3002\n    *   \u7279\u5f81\u7b26\u5408\uff1a\u5728\u5f3a\u5f15\u5bfc\u4e0b\u5b8c\u6210\u5b66\u4e60\u52a8\u4f5c\u4e0e\u652f\u4ed8\uff0c\u4e92\u52a8\u4ee5\u5e94\u7b54\u4e3a\u4e3b\uff0c\u5bf9\u201c\u6536\u8d39\u201d\u654f\u611f\uff0c\u8868\u73b0\u51fa\u4ece\u4f17\uff08\u8ddf\u968f\u6d41\u7a0b\uff09\u4e0e\u98ce\u9669\u89c4\u907f\uff08\u786e\u8ba4\u65e0\u540e\u7eed\u6536\u8d39\uff09\u5fc3\u6001\u3002\n    *   \u4e0d\u7b26\u70b9\uff1a\u7f3a\u4e4fT5\u5178\u578b\u7684\u201c\u53cd\u590d\u786e\u8ba4\u7ec6\u8282\u201d\u884c\u4e3a\uff0c\u63d0\u95ee\u8f83\u5c11\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669\u7b49\u7ea7: \u4e2d**\u3002\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u9884\u671f\u7ba1\u7406\u5931\u8861**: **\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u8fc7\u5ea6\u5f3a\u8c03\u201c\u65f6\u85aa\u8bd5\u97f3\u201d\u3001\u201c\u5168\u5e73\u53f0\u53d8\u73b0\u201d\u3001\u201c\u5de5\u4f5c\u5ba4\u5408\u4f5c\u201d\u7b49\u8fdc\u671f\u6536\u76ca\uff0c\u53ef\u80fd\u5851\u9020\u4e86\u4e0d\u5207\u5b9e\u9645\u7684\u201c\u5feb\u901f\u53d8\u73b0\u201d\u9884\u671f\u3002\u7528\u6237\u8be2\u95ee\u201c\u8003\u8bc1\u6536\u8d39\u201d\u8868\u660e\u5176\u5bf9\u201c\u8bc1\u4e66\u201d\u4e0e\u201c\u53d8\u73b0\u201d\u7684\u5173\u7cfb\u5b58\u5728\u6a21\u7cca\u8ba4\u77e5\u3002\n    2.  **\u80fd\u529b\u4ea7\u54c1\u9519\u914d**: \u4e2d\u98ce\u9669\u3002\u7528\u6237\u58f0\u97f3\u6761\u4ef6\u88ab\u8bc4\u4ef7\u4e3a\u201c\u5fa1\u59d0\u97f3\u201d\u3001\u201c\u53ef\u5851\u6027\u5f3a\u201d\uff0c\u4f46\u5b66\u4e60\u6295\u5165\u5ea6\u4e0e\u4e3b\u52a8\u6027\u672a\u77e5\uff0c\u540e\u7eed\u9ad8\u5f3a\u5ea6\u7ec3\u4e60\u53ef\u80fd\u8ddf\u4e0d\u4e0a\u3002\n    3.  **\u51b3\u7b56\u4ed3\u4fc3/\u5bb6\u5ead\u538b\u529b**: **\u4e2d\u9ad8\u98ce\u9669**\u3002\u652f\u4ed8\u51b3\u7b56\u53d1\u751f\u5728\u8bad\u7ec3\u8425\u672b\u671f\u5bc6\u96c6\u4fc3\u9500\u73af\u8282\uff08\u52a9\u5b66\u91d1\u3001\u7248\u6743\u4e66\u3001\u9650\u65f6\u901a\u9053\uff09\uff0c**\u5b58\u5728\u51b2\u52a8\u6d88\u8d39\u53ef\u80fd**\u3002\u5bb6\u5ead\u51b3\u7b56\u6743\u672a\u9a8c\u8bc1\u662f\u91cd\u5927\u9690\u60a3\u3002\n    4.  **\u7ecf\u6d4e\u538b\u529b\u611f\u77e5**: \u4fe1\u606f\u4e0d\u8db3\u3002\u65e0\u6cd5\u5224\u65ad\u3002\n    5.  **\u670d\u52a1\u4f53\u9a8c\u843d\u5dee**: \u4f4e\u98ce\u9669\u3002\u76ee\u524d\u9500\u552e\u670d\u52a1\u54cd\u5e94\u53ca\u65f6\u3002\n    6.  **\u7ade\u54c1\u5bf9\u6bd4/\u8d1f\u9762\u4fe1\u606f**: \u4fe1\u606f\u4e0d\u8db3\u3002\u65e0\u6cd5\u5224\u65ad\u3002\n    7.  **\u4e2a\u4eba\u91cd\u5927\u53d8\u6545**: \u4fe1\u606f\u4e0d\u8db3\u3002\u65e0\u6cd5\u5224\u65ad\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5408\u89c4\u95ee\u9898**:\n    *   **\u5938\u5927\u6536\u76ca**: \u9500\u552e\u63d0\u53ca\u201c\u5168\u5e73\u53f0\u90fd\u4f1a\u4ea7\u751f\u6536\u76ca\u201d\u3001\u201c\u4e00\u4e2a\u6708\u4e5f\u6709\u4e00\u4e24\u5343\u3001\u4e24\u4e09\u5343\u7684\u6536\u76ca\u201d\uff0c\u4ee5\u4e2a\u4eba\u6848\u4f8b\u6697\u793a\u666e\u9002\u6027\uff0c\u5b58\u5728**\u5938\u5927\u517c\u804c\u6536\u5165**\u7684\u5acc\u7591\u3002\n    *   **\u5236\u9020\u7a00\u7f3a\u4e0e\u7d27\u8feb**: \u201c\u6700\u540e\u4e00\u573a\u76f4\u64ad\u201d\u3001\u201c\u73b0\u573a\u53d1\u653e\u52a9\u5b66\u91d1\u201d\u3001\u201c\u5f00\u542f\u62a5\u540d\u901a\u9053\u201d\u7b49\u8bdd\u672f\uff0c\u8425\u9020\u7a00\u7f3a\u6027\uff0c\u53ef\u80fd\u4fc3\u4f7f\u975e\u7406\u6027\u51b3\u7b56\u3002\n    *   **\u89c4\u907f\u76f4\u63a5\u56de\u7b54**: \u5f53\u7528\u6237\u660e\u786e\u8be2\u95ee\u201c\u8003\u8bc1\u7684\u90a3\u4e2a\u5b66\u4e60\u8425\u662f\u6536\u8d39\u7684\u201d\uff0c\u9500\u552e\u56de\u590d\u201c\u4f60\u5148\u522b\u7740\u6025\u8003\u8651\u540e\u7eed\u8d39\u7528\u7684\u95ee\u9898\u201d\uff0c**\u672a\u76f4\u63a5\u3001\u6e05\u6670\u544a\u77e5\u6b63\u4ef7\u8bfe\u8d39\u7528**\uff0c\u5b58\u5728\u4fe1\u606f\u4e0d\u900f\u660e\u3002\n*   **\u4f26\u7406\u98ce\u9669**: \u4e3b\u8981\u98ce\u9669\u5728\u4e8e**\u5229\u7528\u7528\u6237\u4ece\u4f17\u5fc3\u7406\u548c\u89c4\u907f\u635f\u5931\u5fc3\u6001\uff0c\u4fc3\u4f7f\u5176\u5728\u672a\u5145\u5206\u7406\u89e3\u8bfe\u7a0b\u957f\u671f\u6295\u5165\uff08\u65f6\u95f4\u3001\u7cbe\u529b\uff09\u4e0e\u771f\u5b9e\u56de\u62a5\u7387\u7684\u60c5\u51b5\u4e0b\u5b8c\u6210\u652f\u4ed8**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**: **\u504f\u5dee**\u3002\u7528\u6237\u52a8\u673a\u4e0d\u660e\u786e\u3001\u4e3b\u52a8\u6027\u4e00\u822c\uff0c\u4e0e\u9700\u8981\u9ad8\u81ea\u5f8b\u3001\u957f\u671f\u7ec3\u4e60\u7684\u201c\u9ad8\u9636\u201d\u6f14\u64ad\u8bfe\u7a0b\u5b58\u5728\u6f5c\u5728\u9519\u914d\u98ce\u9669\u3002\u66f4\u9002\u5408\u4ece\u201c\u4f53\u9a8c\u8425-\u5165\u95e8\u8bfe\u201d\u8def\u5f84\u89c2\u5bdf\u5176\u6301\u7eed\u6295\u5165\u5ea6\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **24h\u5185\u542f\u52a8\u9884\u671f\u7ba1\u7406\u4e0e\u5bb6\u5ead\u77e5\u60c5\u6838\u67e5**\u3002\n*   **\u5177\u4f53\u884c\u52a8\u5efa\u8bae**:\n    1.  **\u9996\u5468\u6df1\u5ea6\u8bbf\u8c08**: \u91cd\u70b9\u4e86\u89e3\u5176\u5b66\u4e60\u76ee\u6807\uff08\u662f\u5174\u8da3\uff1f\u517c\u804c\uff1f\uff09\u3001\u6bcf\u65e5\u53ef\u56fa\u5b9a\u6295\u5165\u65f6\u95f4\u3001\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u3002**\u660e\u786e\u544a\u77e5\u9ad8\u9636\u8bfe\u7a0b\u7684\u5b66\u4e60\u5f3a\u5ea6\u3001\u6838\u5fc3\u662f\u6280\u80fd\u63d0\u5347\u800c\u975e\u201c\u4fdd\u5e95\u53d8\u73b0\u201d**\u3002\n    2.  **\u6821\u6b63\u53d8\u73b0\u9884\u671f**: \u6e05\u6670\u8bf4\u660e\u8bc1\u4e66\u7684\u4f5c\u7528\u3001\u63a5\u5355\u7684\u7ade\u4e89\u6027\u4e0e\u80fd\u529b\u8981\u6c42\uff0c\u7528\u6848\u4f8b\u5c55\u793a\u4ece\u5b66\u4e60\u5230\u63a5\u5355\u7684\u6b63\u5e38\u5468\u671f\u4e0e\u6536\u5165\u5206\u5e03\u533a\u95f4\uff0c\u7834\u9664\u201c\u5feb\u901f\u8d5a\u94b1\u201d\u5e7b\u60f3\u3002\n    3.  **\u5efa\u7acb\u652f\u6301\u611f**: \u56e0\u5176\u4e3a\u8c28\u614e\u8ddf\u968f\u578b\uff0c\u9700\u63d0\u4f9b\u66f4\u6e05\u6670\u3001\u7ed3\u6784\u5316\u7684\u5b66\u4e60\u8def\u5f84\u6307\u5f15\u548c\u53ca\u65f6\u7684\u6b63\u9762\u53cd\u9988\uff0c\u589e\u5f3a\u5176\u5b66\u4e60\u4fe1\u5fc3\u4e0e\u7c98\u6027\u3002\n    4.  **\u98ce\u9669\u76d1\u63a7**: \u5bc6\u5207\u5173\u6ce8\u5176\u524d\u4e24\u5468\u4f5c\u4e1a\u5b8c\u6210\u8d28\u91cf\u4e0e\u4e92\u52a8\u9891\u7387\uff0c\u82e5\u51fa\u73b0\u660e\u663e\u5403\u529b\u6216\u6c89\u9ed8\uff0c\u9700\u4e3b\u52a8\u4ecb\u5165\uff0c\u8bc4\u4f30\u662f\u5426\u9700\u8c03\u6574\u5b66\u4e60\u8ba1\u5212\u6216\u542f\u52a8\u529d\u9000\u6d41\u7a0b\u3002\n\n{\"core_type\": \"T5 \u8c28\u614e\u8ddf\u968f\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"24h\u5185\u542f\u52a8\u9884\u671f\u7ba1\u7406\u4e0e\u5bb6\u5ead\u77e5\u60c5\u6838\u67e5\"}";
