        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677158945 (\u6635\u79f0\uff1a\u9676\u9633) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u7b71\u6590\u5440\uff5e\u5b98\u65b9\u62db\u52df\u5b98\uff08\u90d1\u78ca\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bad\u7ec3\u8425 (\u4ef7\u683c\uff1a3980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u76f4\u63a5\u652f\u4ed83980\u5143\uff0c\u672a\u63d0\u53ca\u8d44\u91d1\u6765\u6e90\u3001\u5206\u671f\u6216\u501f\u6b3e\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u63d0\u53ca\u4e3b\u4e1a\u4e3a\u901a\u4fe1\u884c\u4e1a\uff0c\u4f46\u672a\u660e\u786e\u6bcf\u65e5\u53ef\u6295\u5165\u7684\u788e\u7247\u5316\u65f6\u95f4\u3002\u9500\u552e\u66fe\u8be2\u95ee\u201c\u5e73\u5747\u4e00\u5929\u80fd1\uff5e2\u4e2a\u5c0f\u65f6\u788e\u7247\u5316\u65f6\u95f4\u561b\uff1f\u201d\uff0c\u7528\u6237\u672a\u6b63\u9762\u56de\u7b54\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u7528\u6237\u8868\u8fbe\u4e86\u660e\u786e\u7684\u5b66\u4e60\u52a8\u673a\u548c\u5174\u8da3\uff0c\u4f46\u5173\u4e8e**\u8d44\u91d1\u3001\u65f6\u95f4\u3001\u5bb6\u5ead\u652f\u6301**\u7b49\u5173\u952e\u8d44\u6e90\u5e95\u5ea7\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931\uff0c\u9700\u964d\u7ea7\u7f6e\u4fe1\u5ea6\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e\uff0c\u4f46\u6df7\u6742\u4e86\u5bf9\u6280\u80fd\u63d0\u5347\u548c\u5174\u8da3\u63a2\u7d22\u7684\u6e34\u671b\uff0c\u4e0d\u8981\u6c42\u6781\u901f\u53d8\u73b0\u4fdd\u5e95\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8fd9\u4e2a\u5c31\u662f\u5de5\u4f5c\u561b\uff0c\u517c\u804c\u561b\uff0c\u5c31\u662f\u60f3\u591a\u5b66\u4e00\u4e2a\u6280\u80fd\u5427\uff0c\u5c31\u662f\uff0c\u55ef\uff0c\u521a\u5f00\u59cb\u5c31\u662f\u6323\u94b1\u4e0d\u6323\u94b1\u90fd\u65e0\u6240\u8c13\uff0c\u6211\u5c31\u662f\u60f3\u8ba9\u81ea\u5df1\u591a\u4e00\u4e2a\u6280\u80fd\uff0c\u7136\u540e\u5c31\u662f\uff0c\u55ef\uff0c\u6ca1\u6709\u90a3\u4e48\u5927\u7684\u5371\u673a\u611f\u5427\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d] (\u4fe1\u606f\u4e0d\u8db3\uff0c\u6309\u4e2d\u6027\u4fdd\u5b88\u4f30\u8ba1)\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 \u80fd\u76f4\u63a5\u652f\u4ed83980\u5143\u8bfe\u7a0b\u8d39\u7528\uff0c\u672a\u8868\u73b0\u51fa\u7ecf\u6d4e\u538b\u529b\u3002\u4f46\u8d44\u91d1\u6765\u6e90\u4e0d\u660e\uff0c\u65e0\u6cd5\u6392\u9664\u6f5c\u5728\u98ce\u9669\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 \u6709\u4e3b\u4e1a\uff08\u901a\u4fe1\u884c\u4e1a\uff09\uff0c\u80fd\u6309\u65f6\u5b8c\u6210\u8bad\u7ec3\u8425\u4f5c\u4e1a\u548c\u76f4\u64ad\u6253\u5361\uff0c\u8868\u660e\u6709\u4e00\u5b9a\u788e\u7247\u65f6\u95f4\u3002\u4f46\u672a\u660e\u786e\u627f\u8bfa\u6bcf\u65e51-2\u5c0f\u65f6\uff0c\u5b58\u5728\u4e0d\u786e\u5b9a\u6027\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4e2d] \u2014 **\u4fe1\u606f\u7f3a\u5931**\u3002\u672a\u63d0\u53ca\u53cd\u5bf9\u6216\u652f\u6301\uff0c\u6309\u4e2d\u6027\u5904\u7406\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u8868\u73b0\u51fa\u79ef\u6781\u3001\u4e3b\u52a8\u7684\u5b66\u4e60\u6001\u5ea6\uff0c\u9047\u5230\u95ee\u9898\u4e3b\u52a8\u5bfb\u6c42\u5177\u4f53\u53cd\u9988\uff08\u5982\u8be2\u95ee\u6c14\u606f\u3001\u8282\u594f\u5982\u4f55\u953b\u70bc\uff09\uff0c\u80fd\u4eab\u53d7\u5b66\u4e60\u8fc7\u7a0b\uff0c\u6709\u6b63\u5411\u60c5\u7eea\u53cd\u9988\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u611f\u89c9\u81ea\u5df1\u6253\u5f00\u4e86\u4e00\u4e2a\u65b0\u7684\u4e16\u754c\uff0c\u56e0\u4e3a\u6211\u5f88\u5185\u5411\uff0c\u5e73\u65f6\u4e5f\u4e0d\u600e\u4e48\u548c\u540c\u4e8b\u804a\u5929\uff0c\u73b0\u5728\u4e00\u4e2a\u4eba\u5f55\u97f3\uff0c\u60f3\u600e\u4e48\u8bf4\u600e\u4e48\u8bf4\uff0c\u5f88\u5f00\u5fc3\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 (\u7126\u8651\u4fdd\u969c) & \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42 (\u5f52\u5c5e\u611f) ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e3b\u4e1a\uff08\u901a\u4fe1\u884c\u4e1a\uff09\u5e26\u6765\u7684\u804c\u4e1a\u5371\u673a\u611f**\uff0c\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u65b0\u6280\u80fd\u589e\u52a0\u5b89\u5168\u57ab\u3002\u540c\u65f6\uff0c\u6027\u683c\u5185\u5411\uff0c\u6e34\u671b\u4e00\u4e2a**\u5b89\u5168\u3001\u53ef\u81ea\u6211\u8868\u8fbe**\u7684\u793e\u4ea4/\u5174\u8da3\u51fa\u53e3\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u63d0\u4f9b\u201c\u6280\u80fd\u6210\u957f\u201d\u7684\u786e\u5b9a\u611f\u548c\u201c\u88ab\u770b\u89c1\u3001\u88ab\u8ba4\u53ef\u201d\u7684\u793e\u7fa4\u5f52\u5c5e\u611f**\u3002\u8ba9\u4ed6\u611f\u89c9\u5728\u8fd9\u4e2a\u9886\u57df\u6709\u8fdb\u6b65\u3001\u6709\u540c\u4f34\uff0c\u80fd\u6709\u6548\u5bf9\u51b2\u4e3b\u4e1a\u7684\u4e0d\u5b89\u5168\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u52a8\u673a\u4e2d\u7b49\uff0c\u8d44\u6e90\u5e95\u5ea7\u4e2d\u7b49\uff0c\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u6709\u660e\u786e\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u6709\u660e\u786e\u76ee\u6807\uff0c\u4e3b\u52a8\u5b8c\u6210\u4f5c\u4e1a\u3001\u5bfb\u6c42\u53cd\u9988\uff0c\u5173\u6ce8\u6280\u80fd\u63d0\u5347\u7ec6\u8282\uff0c\u4e0d\u5f20\u626c\u4f46\u884c\u52a8\u529b\u5f3a) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | **\u4fe1\u606f\u7f3a\u5931**\u3002\u82e5\u62a5\u540d\u4e3a\u9690\u7792\u5bb6\u4eba\u6216\u4f7f\u7528\u5bb6\u5ead\u91cd\u8981\u8d44\u91d1\uff0c\u98ce\u9669\u5c06\u6025\u5267\u5347\u9ad8\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u4e3b\u4e1a\uff08\u901a\u4fe1\u884c\u4e1a\uff09\u7a81\u53d1\u6027\u52a0\u73ed\u6216\u51fa\u5dee\uff0c\u5bfc\u81f4\u65e0\u6cd5\u8ddf\u4e0a\u5b66\u4e60\u8fdb\u5ea6\uff0c\u4ea7\u751f\u79ef\u538b\u548c\u81ea\u8d23\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u7528\u6237\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u6027\u5f3a\uff0c\u4e0d\u6613\u56e0\u5b66\u4e60\u632b\u6298\u800c\u76f4\u63a5\u653e\u5f03\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u5b66\u4e60\u4e2d\u671f\uff08\u59821-2\u4e2a\u6708\u540e\uff09\u82e5\u672a\u83b7\u5f97\u4efb\u4f55\u6b63\u5411\u53cd\u9988\uff08\u5982\u8bd5\u97f3\u5931\u8d25\u3001\u65e0\u6536\u5165\uff09\uff0c\u53ef\u80fd\u56e0\u4e0e\u201c\u7f13\u89e3\u5371\u673a\u611f\u201d\u7684\u521d\u8877\u4e0d\u7b26\u800c\u4ea7\u751f\u843d\u5dee\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c4-8\u5468\uff08\u6280\u80fd\u5e73\u53f0\u671f/\u9996\u6b21\u8bd5\u97f3\u5931\u8d25\u671f\uff09**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u82e5\u6280\u80fd\u63d0\u5347\u7f13\u6162\u4e14\u65e0\u53d8\u73b0\u8ff9\u8c61\uff0c\u5b89\u5168\u9700\u6c42\u672a\u88ab\u6ee1\u8db3\u7684\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u9676\u9633\u540c\u5b66\u4f60\u597d\uff01\u770b\u5230\u4f60\u5728\u4f53\u9a8c\u8425\u91cc\u4e3b\u52a8\u63d0\u4ea4\u4f5c\u4e1a\u3001\u79ef\u6781\u63d0\u95ee\uff0c\u80fd\u611f\u53d7\u5230\u4f60\u5bf9\u6f14\u64ad\u7684\u8ba4\u771f\u548c\u70ed\u7231\u3002\u901a\u4fe1\u884c\u4e1a\u7684\u5de5\u4f5c\u8282\u594f\u6211\u77e5\u9053\uff0c\u80fd\u6324\u51fa\u65f6\u95f4\u5b66\u4e60\u65b0\u6280\u80fd\u7279\u522b\u4e0d\u5bb9\u6613\u3002\u63a5\u4e0b\u6765\u7684\u7cfb\u7edf\u8bfe\uff0c\u6211\u4eec\u4f1a\u5e2e\u4f60\u628a\u2018\u5b89\u5168\u611f\u2019\u505a\u5b9e\uff0c\u6bcf\u4e00\u6b65\u90fd\u8d70\u5f97\u624e\u5b9e\u3002\u6709\u4efb\u4f55\u65f6\u95f4\u5b89\u6392\u4e0a\u7684\u56f0\u96be\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4eec\u4e00\u8d77\u8c03\u6574\u8ba1\u5212\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u3002\u5339\u914d\u5176T2\u5b9e\u5e72\u7279\u8d28\uff0c\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u6267\u884c\u7684\u6280\u80fd\u8fdb\u9636\u8def\u5f84\u548c\u5b9e\u64cd\u4efb\u52a1\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u5185\u5411\u6027\u683c\u548c\u793e\u4ea4\u9700\u6c42\uff0c\u53ef\u8f7b\u91cf\u8865\u5145\u3010**\u5708\u5c42\u8fde\u63a5\u5305**\u3011\uff08\u5982\u5c0f\u7ec4\u4f5c\u4e1a\u3001\u540c\u57ce/\u540c\u884c\u4e1a\u5b66\u5458\u4ea4\u6d41\uff09\uff0c\u589e\u5f3a\u5f52\u5c5e\u611f\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u524d\u671f\u8fc7\u5ea6\u627f\u8bfa\u53d8\u73b0\u901f\u5ea6\u548c\u91d1\u989d**\u30022. **\u5ffd\u89c6\u5176\u65f6\u95f4\u7ba1\u7406\u9700\u6c42**\uff0c\u5e03\u7f6e\u8fc7\u91cf\u6216\u65f6\u95f4\u51b2\u7a81\u7684\u4f5c\u4e1a\u30023. **\u4ec5\u8fdb\u884c\u6cdb\u6cdb\u7684\u9f13\u52b1**\uff0c\u4e0d\u63d0\u4f9b\u5177\u4f53\u3001\u53ef\u64cd\u4f5c\u7684\u6280\u672f\u53cd\u9988\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u8fdb\u884c\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u5fc5\u987b\u5efa\u7acb\u5728\u6280\u80fd\u6709\u660e\u663e\u63d0\u5347\u548c\u5176\u83b7\u5f97\u521d\u6b65\u6b63\u53cd\u9988\uff08\u5982\u8bd5\u97f3\u901a\u8fc7\uff09\u4e4b\u540e**\u3002\u524d\u671f\u5e94\u805a\u7126\u4e8e\u5f53\u524d\u8bfe\u7a0b\u7684\u4ef7\u503c\u4ea4\u4ed8\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6843\u4e03\u8001\u5e08\u597d\u5389\u5bb3\u554a\uff0c\u8fd9\u5f97\u7ec3\u4e60\u591a\u4e45\uff0c\u624d\u53ef\u4ee5\u5230\u8fbe\u5979\u8fd9\u79cd\u6c34\u5e73\u201d **(\u6c42\u77e5\u6b32\u4e0e\u957f\u671f\u4e3b\u4e49\u5fc3\u6001)**\n2. > \u201c\u5b66\u59d0\uff0c\u4f60\u542c\u4e00\u4e0b\uff0c\u53ef\u4ee5\u4e0d\uff1f\u5982\u679c\u53ef\u4ee5\uff0c\u6211\u5c31\u53d1\u5230\u73ed\u7ea7\u7fa4\u91cc\u9762\u4e86\u201d **(\u4e3b\u52a8\u5bfb\u6c42\u53cd\u9988\uff0c\u9075\u5b88\u89c4\u5219)**\n3. > \u201c\u521a\u5f00\u59cb\u5c31\u662f\u6323\u94b1\u4e0d\u6323\u94b1\u90fd\u65e0\u6240\u8c13\uff0c\u6211\u5c31\u662f\u60f3\u8ba9\u81ea\u5df1\u591a\u4e00\u4e2a\u6280\u80fd\uff0c\u7136\u540e\u5c31\u662f\uff0c\u55ef\uff0c\u6ca1\u6709\u90a3\u4e48\u5927\u7684\u5371\u673a\u611f\u5427\u3002\u201d **(\u6838\u5fc3\u52a8\u673a\uff1a\u5b89\u5168\u9700\u6c42\u9a71\u52a8\uff0c\u800c\u975e\u7eaf\u6295\u673a)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2\u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u53d6\u65b0\u6280\u80fd\u4ee5\u5bf9\u6297\u804c\u4e1a\u5371\u673a\u611f\uff08\u5b89\u5168\u9700\u6c42\uff09\u5e76\u627e\u5230\u81ea\u6211\u8868\u8fbe\u7684\u51fa\u53e3\uff08\u793e\u4ea4\u9700\u6c42\uff09**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d\u7b49**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u5728\u6280\u80fd\u5e73\u53f0\u671f\uff08\u7b2c4-8\u5468\uff09\u63d0\u4f9b\u7cbe\u51c6\u7684\u201c\u5c0f\u80dc\u201d\u53cd\u9988\uff08\u5982\u4e00\u6b21\u6210\u529f\u7684\u8bd5\u97f3\u6216\u660e\u786e\u7684\u6280\u5de7\u7a81\u7834\uff09\uff0c\u5e76\u5bc6\u5207\u5173\u6ce8\u5176\u65f6\u95f4\u5b89\u6392\u4e0e\u5bb6\u5ead\u652f\u6301\u60c5\u51b5**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168/\u793e\u4ea4\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u8f7b\u91cf\u5708\u5c42\u8fde\u63a5\u5305\"}\n```";
