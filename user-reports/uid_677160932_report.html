    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n> **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u5bb6\u5ead\u8d22\u52a1\u72b6\u51b5\u3001\u5177\u4f53\u5de5\u4f5c\u4e0e\u5bb6\u5ead\u65f6\u95f4\u5b89\u6392\u3001\u5bb6\u5ead\u6210\u5458\u6001\u5ea6\u7b49\u5173\u952e\u4fe1\u606f\uff0c\u5bfc\u81f4\u5bf9\u8d44\u6e90\u5e95\u5ea7\u3001\u5bb6\u5ead\u652f\u6301\u5ea6\u3001\u652f\u4ed8\u94fe\u98ce\u9669\u7684\u5224\u65ad\u7f6e\u4fe1\u5ea6\u964d\u4f4e\u3002\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677160932 (\u963f\u5bb9) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u82b1\u6c14\u88ad\u4eba6/\u7c7d\u83f2 (\u5b8b\u6653\u78ca) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u7cbe\u82f1\u8bfe (\u4ef7\u683c\u672a\u660e\u793a\uff0c\u63d0\u53ca\u5dee\u4ef77380-3980=3400) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u7f3a\u5931** (\u7528\u6237\u63d0\u53ca\u201c\u8d44\u91d1\u95ee\u9898\uff0c\u5bb6\u5ead\u5b69\u5b50\uff0c\u623f\u8d37\u201d\uff0c\u4f46\u672a\u8bf4\u660e\u652f\u4ed8\u65b9\u5f0f) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u7f3a\u5931** (\u4ec5\u77e5\u4e3a\u4e0a\u73ed\u65cf\uff0c\u788e\u7247\u5316\u65f6\u95f4\u53ef\u7528\uff0c\u4f46\u5177\u4f53\u65f6\u957f\u4e0e\u7a33\u5b9a\u6027\u672a\u77e5) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** (\u672a\u63d0\u53ca\u5bb6\u5ead\u6210\u5458\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931** (\u5173\u952e\u7ef4\u5ea6\u4fe1\u606f\u4e0d\u8db3\uff0c\u964d\u7ea7\u7f6e\u4fe1\u5ea6) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u660e\u786e\u8868\u8fbe\u201c\u517c\u804c\u53d8\u73b0\u201d\u7684\u641e\u94b1\u76ee\u6807\uff0c\u4f46\u540c\u65f6\u4e5f\u6d41\u9732\u51fa\u5bf9\u914d\u97f3\u7684\u5174\u8da3\u548c\u201c\u5b66\u65e0\u6b62\u5883\u201d\u7684\u5b66\u4e60\u5fc3\u6001\uff0c\u52a8\u673a\u4e2d\u6df7\u6742\u4e86\u5174\u8da3\u63a2\u7d22\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u517c\u804c\u53d8\u73b0\uff0c\u201d > \u201c\u6211\u611f\u89c9\u6717\u8bfb\u65f6\u5019\uff0c\u6bd4\u8f83\u7d27\u5f20\uff0c\u6ca1\u6709\u81ea\u5df1\u7684\u8282\u594f\uff0c\u5f88\u96be\u5e26\u5165\u60c5\u611f\uff0c\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d] (\u56e0\u4fe1\u606f\u7f3a\u5931\uff0c\u8bc4\u7ea7\u504f\u4fdd\u5b88)\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u2b07\u4f4e\u6781\u5371]** \u2014 **\u8bc1\u636e\u8bf4\u660e**\uff1a\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u56e0\u4e3a\u7684\u786e\u8d44\u91d1\u95ee\u9898\uff0c\u5bb6\u5ead\u5b69\u5b50\uff0c\u623f\u8d37\u7b49\u95ee\u9898\u201d\uff0c\u9009\u62e9\u4e86\u4ef7\u683c\u8f83\u4f4e\u7684\u7cbe\u82f1\u8bfe\u800c\u975e\u9ad8\u9636\u8bfe\uff0c\u8d44\u91d1\u538b\u529b\u5927\uff0c\u627f\u8f7d\u529b\u5f31\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**[\u27a1\u4e2d]** \u2014 **\u8bc1\u636e\u8bf4\u660e**\uff1a\u4f5c\u4e3a\u4e0a\u73ed\u65cf\uff0c\u80fd\u6309\u65f6\u5b8c\u6210\u6240\u6709\u4f5c\u4e1a\u3001\u53c2\u52a0\u76f4\u64ad\u3001\u4e3b\u52a8\u52a0\u7ec3\uff0c\u663e\u793a\u6709\u7a33\u5b9a\u7684\u788e\u7247\u5316\u65f6\u95f4\u6295\u5165\uff0c\u4f46\u672a\u63d0\u53ca\u52a0\u73ed\u3001\u901a\u52e4\u7b49\u5177\u4f53\u6d88\u8017\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u4fe1\u606f\u7f3a\u5931]** \u2014 **\u8bc1\u636e\u8bf4\u660e**\uff1a\u5b8c\u5168\u672a\u63d0\u53ca\u5bb6\u5ead\u6001\u5ea6\uff0c\u662f\u91cd\u5927\u98ce\u9669\u76f2\u533a\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u56f0\u96be\uff08\u8282\u594f\u611f\u3001\u60c5\u611f\u5e26\u5165\u3001\u89d2\u8272\u8f6c\u6362\uff09\u65f6\uff0c\u80fd\u4e3b\u52a8\u3001\u5177\u4f53\u5730\u63d0\u51fa\u95ee\u9898\uff0c\u5e76\u79ef\u6781\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff08\u201c\u6211\u52aa\u529b\u7ec3\u4e60\u53bb\u4e86\u201d\uff09\uff0c\u800c\u975e\u60c5\u7eea\u5316\u62b1\u6028\u6216\u653e\u5f03\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08\uff01\u8bd5\u97f3\u5355\uff0c\u6211\u770b\u4e86\u6587\u672c\uff0c\u6574\u7bc7\u6bcf\u4e2a\u89d2\u8272\u7684\u5e74\u9f84\u3001\u6027\u522b\u3001\u6027\u683c\u90fd\u4e0d\u4e00\u6837\uff0c\u6211\u73b0\u5728\u6bd4\u8f83\u96be\u5206\u522b\u8f6c\u6362\u6bcf\u4e2a\u89d2\u8272\u6f14\u64ad[\u6342\u8138]\u201d > \u201c\u662f\u4e0d\u662f\u53ef\u4ee5\u53ea\u6f14\u64ad\u4e00\u5c0f\u6bb5\uff0c\u81ea\u5df1\u89c9\u5f97\u6709\u628a\u63e1\u7684\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u81ea\u6211\u80fd\u529b\u7684\u4e0d\u786e\u4fe1\u4e0e\u5bfb\u6c42\u4e13\u4e1a\u8ba4\u53ef**\u3002\u4ed6\u53cd\u590d\u63d0\u53ca\u81ea\u5df1\u5728\u8282\u594f\u3001\u60c5\u611f\u3001\u89d2\u8272\u8f6c\u6362\u4e0a\u7684\u56f0\u96be\uff0c\u5e76\u4e3b\u52a8\u8bf7\u6c42\u8001\u5e08\u6307\u5bfc\uff0c\u6df1\u5c42\u9700\u6c42\u662f\u5e0c\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u6280\u80fd\uff0c\u83b7\u5f97\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u548c\u5708\u5c42\u5f52\u5c5e\u611f\uff0c\u4ece\u800c\u63d0\u5347\u81ea\u6211\u4ef7\u503c\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u770b\u89c1\u201d\u4e0e\u201c\u8d4b\u80fd\u201d**\u3002\u53ca\u65f6\u3001\u5177\u4f53\u3001\u4e13\u4e1a\u7684\u53cd\u9988\uff08\u5982\u9500\u552e\u6240\u505a\u7684\u8be6\u7ec6\u70b9\u8bc4\uff09\uff0c\u8ba9\u4ed6\u611f\u53d7\u5230\u81ea\u5df1\u7684\u52aa\u529b\u548c\u8fdb\u6b65\u88ab\u770b\u89c1\u3001\u88ab\u8ba4\u53ef\uff0c\u4ece\u800c\u5efa\u7acb\u201c\u6211\u80fd\u884c\u201d\u7684\u4fe1\u5fc3\u548c\u5728\u8fd9\u4e2a\u5708\u5b50\u7684\u5f52\u5c5e\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1** \u7c7b (\u52a8\u673a\u4e2d\u7b49\u3001\u8d44\u6e90\u5e95\u5ea7\u6709\u660e\u663e\u77ed\u677f\uff08\u8d44\u91d1\uff09\u3001\u4f46\u5fc3\u7406\u5f39\u6027\u9ad8\u3001\u5b66\u4e60\u6001\u5ea6\u597d) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T3 \u6b7b\u78d5\u5b66\u9738** (\u5177\u5907\u94bb\u7814\u7cbe\u795e\uff0c\u4e3b\u52a8\u66b4\u9732\u95ee\u9898\u3001\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u9075\u5faa\u6559\u5b66\u5b89\u6392\uff0c\u8ffd\u6c42\u8fdb\u6b65) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u7528\u6237\u867d\u63d0\u53ca\u8d44\u91d1\u538b\u529b\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u501f\u8d37\u3001\u7edd\u5883\u7b49\u6781\u7aef\u884c\u4e3a\uff0c\u4e14\u6c9f\u901a\u7406\u6027\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **[\u9ad8]** | **\u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u98ce\u9669\u9ad8**\u3002\u7528\u6237\u6709\u5bb6\u5ead\u5b69\u5b50\u623f\u8d37\uff0c\u82e5\u8bfe\u7a0b\u652f\u51fa\u672a\u83b7\u5bb6\u4eba\u652f\u6301\uff0c\u6781\u6613\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u5bfc\u81f4\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | [\u4f4e] | \u7528\u6237\u5b66\u4e60\u6267\u884c\u529b\u5f3a\uff0c\u6309\u65f6\u5b8c\u6210\u6240\u6709\u4efb\u52a1\uff0c\u4e3b\u52a8\u6027\u5f3a\uff0c\u5d29\u76d8\u98ce\u9669\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | [\u4f4e] | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u5230\u95ee\u9898\u4e3b\u52a8\u6c42\u89e3\uff0c\u975e\u60c5\u7eea\u5316\u4eba\u683c\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **[\u4e2d]** | \u7528\u6237\u6838\u5fc3\u8bc9\u6c42\u662f\u201c\u517c\u804c\u53d8\u73b0\u201d\uff0c\u82e5\u5728\u7cbe\u82f1\u8bfe\u5b66\u4e60\u5468\u671f\u5185\u672a\u83b7\u5f97\u4efb\u4f55\u53d8\u73b0\u673a\u4f1a\u6216\u660e\u786e\u8def\u5f84\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e1-2\u4e2a\u6708**\u3002\u5f53\u57fa\u7840\u5b66\u4e60\u70ed\u60c5\u8fc7\u540e\uff0c\u82e5\u4ecd\u672a\u770b\u5230\u53d8\u73b0\u5e0c\u671b\uff0c\u53e0\u52a0\u5bb6\u5ead\u7ecf\u6d4e\u538b\u529b\uff0c\u53ef\u80fd\u52a8\u6447\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u963f\u5bb9\u4f60\u597d\uff0c\u770b\u5230\u4f60\u5728\u8bad\u7ec3\u8425\u671f\u95f4\u7279\u522b\u8ba4\u771f\uff0c\u4f5c\u4e1a\u548c\u76f4\u64ad\u4e00\u6b21\u4e0d\u843d\uff0c\u8fd8\u4e3b\u52a8\u52a0\u7ec3\u63d0\u95ee\uff0c\u8fd9\u79cd\u2018\u6b7b\u78d5\u2019\u7cbe\u795e\u662f\u6210\u4e3a\u4f18\u79c0\u4e3b\u64ad\u6700\u5b9d\u8d35\u7684\u54c1\u8d28\u3002\u54b1\u4eec\u7cbe\u82f1\u8bfe\u5c31\u662f\u4e3a\u4f60\u8fd9\u6837\u613f\u610f\u4e0b\u529f\u592b\u7684\u540c\u5b66\u8bbe\u8ba1\u7684\uff0c\u6211\u4f1a\u91cd\u70b9\u5173\u6ce8\u4f60\u7684\u7ec3\u4e60\u53cd\u9988\uff0c\u5e2e\u4f60\u628a\u2018\u9752\u53d4\u97f3\u2019\u7684\u4f18\u52bf\u548c\u8282\u594f\u60c5\u611f\u7684\u95ee\u9898\u4e00\u4e2a\u4e2a\u653b\u514b\u6389\u3002\u6709\u4efb\u4f55\u5361\u70b9\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4eec\u4e00\u8d77\u89e3\u51b3\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** (\u5339\u914d\u5176T3\u6b7b\u78d5\u5b66\u9738\u7279\u8d28\uff0c\u63d0\u4f9b\u624e\u5b9e\u7684\u6280\u5de7\u8bad\u7ec3\u548c\u660e\u786e\u7684\u8fdb\u9636\u8def\u5f84)\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u8d44\u91d1\u538b\u529b\u548c\u5bf9\u53d8\u73b0\u7684\u671f\u5f85\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u5fae\u63a5\u5355\u4f53\u9a8c\u5305\u3011** \u6216 **\u3010\u5ba1\u542c/\u753b\u672c\u5165\u95e8\u5b9e\u8df5\u5305\u3011**\uff0c\u8ba9\u5176\u5728\u5b66\u4e60\u65e9\u671f\u5c31\u80fd\u6709\u5fae\u5c0f\u6b63\u53cd\u9988\u548c\u6536\u5165\u53ef\u80fd\uff0c\u7f13\u89e3\u7126\u8651\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a**\u7edd\u4e0d\u5bf9\u4ed6\u7a7a\u8c08\u5174\u8da3\u548c\u68a6\u60f3\uff0c\u8981\u7ed9\u4e88\u5177\u4f53\u3001\u53ef\u6267\u884c\u7684\u7ec3\u4e60\u65b9\u6cd5\u548c\u77ed\u671f\u76ee\u6807\u3002\u907f\u514d\u5728\u65e9\u671f\u65bd\u52a0\u8fc7\u5927\u7684\u53d8\u73b0\u538b\u529b\uff0c\u4f46\u9700\u660e\u786e\u7ed9\u51fa\u53d8\u73b0\u8def\u5f84\u56fe\u3002**\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u77ed\u671f\u5185\uff08\u59823\u4e2a\u6708\u5185\uff09\u8fdb\u884c\u5927\u989d\u5347\u5355\u63a8\u4ecb**\u3002\u53ef\u5f15\u5bfc\u5176\u901a\u8fc7\u7cbe\u82f1\u8bfe\u6210\u679c\uff08\u5982\u5b8c\u6210\u67d0\u672c\u4e66\u5f55\u5236\uff09\u8bc1\u660e\u4ef7\u503c\u540e\uff0c\u518d\u8003\u8651\u8865\u5dee\u4ef7\u5347\u9636\u3002**\u5f53\u524d\u9636\u6bb5\uff0c\u4efb\u4f55\u5347\u5355\u52a8\u4f5c\u90fd\u53ef\u80fd\u89e6\u53d1\u5176\u5bb6\u5ead\u8d22\u52a1\u8b66\u62a5\u3002**\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u8001\u5e08\uff0c\u6211\u60f3\u95ee\u4e00\u4e0b\uff0c\u6211\u53ea\u62a5\u4e86\u7cbe\u82f1\u8bfe\uff0c\u73b0\u5728\u56e0\u4e3a\u7684\u786e\u8d44\u91d1\u95ee\u9898\uff0c\u5bb6\u5ead\u5b69\u5b50\uff0c\u623f\u8d37\u7b49\u95ee\u9898\uff0c\u6211\u540e\u9762\u8db3\u591f\u52aa\u529b\u5b66\u4e60\uff0c\u53d1\u73b0\u81ea\u5df1\u4e5f\u771f\u70ed\u7231\u8fd9\u4e2a\u884c\u4e1a\uff0c\u540e\u9762\u8fd8\u6709\u63d0\u5347\u7684\u65b9\u6cd5\u6216\u8005\u6e20\u9053\u5417\u201d **(\u66b4\u9732\u8d44\u6e90\u77ed\u677f\u4e0e\u957f\u671f\u5b66\u4e60\u610f\u613f)**\n2. > \u201c\u8001\u5e08\uff01\u8bd5\u97f3\u5355\uff0c\u6211\u770b\u4e86\u6587\u672c\uff0c\u6574\u7bc7\u6bcf\u4e2a\u89d2\u8272\u7684\u5e74\u9f84\u3001\u6027\u522b\u3001\u6027\u683c\u90fd\u4e0d\u4e00\u6837\uff0c\u6211\u73b0\u5728\u6bd4\u8f83\u96be\u5206\u522b\u8f6c\u6362\u6bcf\u4e2a\u89d2\u8272\u6f14\u64ad[\u6342\u8138]\u201d **(\u66b4\u9732\u5177\u4f53\u56f0\u96be\u5e76\u4e3b\u52a8\u6c42\u52a9\uff0c\u975e\u62b1\u6028)**\n3. > \u201c\u6211\u611f\u89c9\u6717\u8bfb\u65f6\u5019\uff0c\u6bd4\u8f83\u7d27\u5f20\uff0c\u6ca1\u6709\u81ea\u5df1\u7684\u8282\u594f\uff0c\u5f88\u96be\u5e26\u5165\u60c5\u611f\uff0c\u201d **(\u7cbe\u51c6\u81ea\u6211\u5256\u6790\uff0c\u8ffd\u6c42\u4e13\u4e1a\u63d0\u5347)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T3\u6b7b\u78d5\u5b66\u9738\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u5708\u5c42\u5f52\u5c5e\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u65e9\u671f\u63d0\u4f9b\u5fae\u5c0f\u6b63\u53cd\u9988\uff08\u5982\u5fae\u63a5\u5355\uff09\u5e76\u4e25\u9632\u5bb6\u5ead\u8d22\u52a1\u98ce\u9669\u66b4\u9732\u3011**\u3002\n\n```json\n{\"core_type\": \"T3 \u6b7b\u78d5\u5b66\u9738\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u5f52\u5c5e\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5fae\u63a5\u5355\u4f53\u9a8c\u5305\"}\n```";
