    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677168494 (\u6635\u79f0\uff1a\u5c0f\u900f\u660e) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u51ac\u51ac\u8001\u5e08\uff08\u9500\u552e\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u5f20\u9707\u8001\u5e08\u6709\u58f0\u6f14\u64ad\u8bad\u7ec3\u8425\uff08\u4ef7\u683c\u672a\u77e5\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3** |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u5168\u804c\u4e0a\u73ed+\u7167\u987e\u5c0f\u5b69\uff0c\u6bcf\u59291-2\u5c0f\u65f6\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3** |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\uff08\u6709\u660e\u786e\u65f6\u95f4\u3001\u804c\u4e1a\u3001\u6280\u80fd\u80cc\u666f\uff0c\u4f46\u7f3a\u4e4f\u652f\u4ed8\u65b9\u5f0f\u3001\u5bb6\u5ead\u652f\u6301\u5ea6\u7b49\u5173\u952e\u4fe1\u606f\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u4e86\u517c\u804c\u53d8\u73b0\u7684\u52a1\u5b9e\u8bc9\u6c42\uff08\u201c\u6bcf\u5929\u4e00\u4e24\u4e2a\u5c0f\u65f6\u517c\u804c\u201d\uff09\uff0c\u4f46\u540c\u65f6\u4e5f\u8868\u73b0\u51fa\u5bf9\u6280\u80fd\u672c\u8eab\uff08\u201c\u53c2\u4e0e\u7684\u611f\u89c9\u201d\uff09\u548c\u81ea\u8eab\u80fd\u529b\u63d0\u5347\uff08\u201c\u58f0\u97f3\u5f88\u5e73\uff0c\u6ca1\u4ec0\u4e48\u611f\u60c5\u201d\uff09\u7684\u5173\u6ce8\uff0c\u5e76\u975e\u7eaf\u7cb9\u7684\u201c\u51e0\u5929\u63d0\u73b0\u201d\u578b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4e3b\u8981\u8fd8\u662f\u60f3\u5f55\u4e66\uff0c\u56e0\u4e3a\u6211\u60f3\u8981\u6709\u90a3\u79cd\u53c2\u4e0e\u7684\u611f\u89c9\u3002\u201d > \u201c\u662f\u7684\uff0c\u6211\u4e5f\u611f\u89c9\u58f0\u97f3\u5f88\u5e73\uff0c\u6ca1\u4ec0\u4e48\u611f\u60c5\u3002\u4ee3\u5165\u60c5\u611f\u53c8\u611f\u89c9\u592a\u5047\uff0c\u4e0d\u771f\u5b9e\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u7ecf\u6d4e\u72b6\u51b5\u6216\u652f\u4ed8\u65b9\u5f0f\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u5168\u804c\u4e0a\u73ed+\u7167\u987e\u5c0f\u5b69\uff0c\u6bcf\u5929\u53ef\u62bd\u51fa1-2\u5c0f\u65f6\uff0c\u5c5e\u4e8e\u5178\u578b\u7684\u788e\u7247\u5316\u65f6\u95f4\u5229\u7528\u8005\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b07\u4f4e\u6781\u5371**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56**\u3002\u7528\u6237\u5bf9\u81ea\u8eab\u80fd\u529b\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u4e0d\u81ea\u4fe1\uff08\u201c\u58f0\u97f3\u5f88\u5e73\u201d\u3001\u201c\u592a\u5047\u201d\u3001\u201c\u4e0d\u80fd\u4fdd\u6301\u201d\uff09\uff0c\u4e14\u5bf9\u8001\u5e08\u6709\u6781\u9ad8\u7684\u60c5\u611f\u4f9d\u8d56\u548c\u8ba4\u53ef\uff08\u201c\u592a\u6709\u4eb2\u548c\u529b\u4e86\uff0c\u8ddf\u7740\u4f60\u4eec\u5b66\u4e00\u70b9\u90fd\u4e0d\u89c9\u5f97\u6709\u538b\u529b\u201d\uff09\uff0c\u5c5e\u4e8e\u5178\u578b\u7684\u201c\u9700\u8981\u88ab\u80af\u5b9a\u548c\u9f13\u52b1\u201d\u578b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u662f\u7684\uff0c\u6211\u4e5f\u611f\u89c9\u58f0\u97f3\u5f88\u5e73\uff0c\u6ca1\u4ec0\u4e48\u611f\u60c5\u3002\u4ee3\u5165\u60c5\u611f\u53c8\u611f\u89c9\u592a\u5047\uff0c\u4e0d\u771f\u5b9e\u3002\u6bcf\u6b21\u64ad\u51fa\u6765\u7684\u60c5\u611f\u90fd\u4e0d\u4e00\u6837\uff0c\u6709\u65f6\u5019\u5bf9\u7684\u6f14\u64ad\u53c8\u4e0d\u80fd\u4fdd\u6301\uff0c\u91cd\u505a\u7684\u65f6\u5019\u53c8\u4e0d\u4e00\u6837\u4e86\u3002\u201d > \u201c\u4e1c\u4e1c\u8001\u5e08\u548c\u5f20\u9707\u8001\u5e08\u592a\u6709\u4eb2\u548c\u529b\u4e86\uff0c\u8ddf\u7740\u4f60\u4eec\u5b66\uff0c\u55ef\uff0c\u4e00\u70b9\u90fd\u4e0d\u89c9\u5f97\u6709\u538b\u529b\uff0c\u5c31\u597d\u50cf\u670b\u53cb\u4e00\u6837\u7684\u3002\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34\u4e0e\u5f52\u5c5e\u611f**\uff0c\u5e76\u5f3a\u70c8\u6e34\u671b**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42\uff08\u88ab\u8ba4\u53ef\uff09**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u81ea\u8eab\u80fd\u529b\u7684\u4e0d\u81ea\u4fe1\u4e0e\u5bf9\u60c5\u611f\u652f\u6301\u7684\u6df1\u5ea6\u6e34\u6c42**\u3002\u5979\u5bb3\u6015\u81ea\u5df1\u201c\u505a\u4e0d\u597d\u201d\u3001\u201c\u4e0d\u771f\u5b9e\u201d\uff0c\u5728\u9ad8\u538b\u7684\u804c\u573a\u548c\u5bb6\u5ead\u751f\u6d3b\u4e4b\u5916\uff0c\u9700\u8981\u4e00\u4e2a\u5b89\u5168\u3001\u6e29\u6696\u3001\u88ab\u9f13\u52b1\u7684\u73af\u5883\u6765\u83b7\u5f97\u4ef7\u503c\u611f\u548c\u5f52\u5c5e\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u5938\u5956\u80af\u5b9a\u4e0e\u201c\u88ab\u770b\u89c1\u201d\u7684\u5b89\u5168\u611f**\u3002\u5979\u9700\u8981\u88ab\u6301\u7eed\u5730\u9f13\u52b1\u3001\u88ab\u5177\u4f53\u5730\u8ba4\u53ef\uff08\u5982\u201c\u5973\u738b\u97f3\u201d\u3001\u201c\u975e\u5e38\u68d2\u201d\uff09\uff0c\u5e76\u5c06\u8fd9\u79cd\u5e08\u751f\u5173\u7cfb\u5347\u534e\u4e3a\u4e00\u79cd\u201c\u670b\u53cb\u201d\u822c\u7684\u5e73\u7b49\u3001\u65e0\u538b\u529b\u7684\u966a\u4f34\u5173\u7cfb\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2 \u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74** (\u4e25\u91cd\u5185\u8017\u578b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5c5e\u53cd\u5bf9\u7684\u76f4\u63a5\u8bc1\u636e\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u9700\u8b66\u60d5\u56e0\u5b66\u4e60\u6324\u5360\u5bb6\u5ead\u65f6\u95f4\u6216\u8d39\u7528\u95ee\u9898\u5f15\u53d1\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u5168\u804c+\u5e26\u5a03\u7684\u788e\u7247\u5316\u65f6\u95f4\u6781\u6613\u88ab\u7a81\u53d1\u4e8b\u4ef6\u6324\u5360\uff0c\u4e00\u65e6\u56e0\u201c\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\u201d\u4ea7\u751f\u81ea\u8d23\u548c\u538b\u529b\uff0c\u6781\u6613\u89e6\u53d1\u201c\u6211\u592a\u7b28\u4e86\uff0c\u5b66\u4e0d\u4f1a\u201d\u7684\u5d29\u6e83\u60c5\u7eea\uff0c\u5bfc\u81f4\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u4e00\u65e6\u4f5c\u4e1a\u88ab\u4e25\u5389\u6279\u8bc4\u3001\u8bd5\u97f3\u5931\u8d25\uff0c\u6216\u611f\u89c9\u88ab\u8001\u5e08/\u56e2\u961f\u5ffd\u89c6\uff0c\u5176\u8106\u5f31\u7684\u81ea\u4fe1\u5fc3\u4f1a\u77ac\u95f4\u5d29\u584c\uff0c\u4ea7\u751f\u5f3a\u70c8\u7684\u81ea\u6211\u5426\u5b9a\u548c\u9000\u8d39\u51b2\u52a8\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u5982\u679c\u77ed\u671f\u5185\uff08\u59821-2\u4e2a\u6708\uff09\u672a\u83b7\u5f97\u4efb\u4f55\u6b63\u53cd\u9988\uff08\u5982\u8bd5\u97f3\u901a\u8fc7\u3001\u88ab\u516c\u5f00\u8868\u626c\uff09\uff0c\u53ef\u80fd\u4f1a\u8d28\u7591\u8bfe\u7a0b\u4ef7\u503c\uff0c\u4f46\u56e0\u5176\u5bf9\u60c5\u611f\u4ef7\u503c\u7684\u91cd\u89c6\uff0c\u6b64\u98ce\u9669\u7a0d\u4f4e\u4e8e\u60c5\u7eea\u7834\u9632\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468\uff0c\u7b2c\u4e00\u6b21\u63d0\u4ea4\u6b63\u5f0f\u4f5c\u4e1a\u6216\u53c2\u4e0e\u8bd5\u97f3\u540e\u6536\u5230\u8d1f\u9762/\u672a\u901a\u8fc7\u53cd\u9988\u65f6\u3002**\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5c0f\u900f\u660e\uff0c\u770b\u5230\u4f60\u8bf4\u2018\u60f3\u8981\u6709\u53c2\u4e0e\u7684\u611f\u89c9\u2019\uff0c\u6211\u7279\u522b\u61c2\u3002\u54b1\u4eec\u8fd9\u4e2a\u73ed\u5c31\u50cf\u4e00\u4e2a\u58f0\u97f3\u7684\u6e38\u4e50\u573a\uff0c\u522b\u6015\u2018\u6f14\u4e0d\u597d\u2019\u6216\u2018\u4e0d\u771f\u5b9e\u2019\uff0c\u8fd9\u91cc\u6ca1\u6709\u5bf9\u9519\uff0c\u53ea\u6709\u5c1d\u8bd5\u548c\u8fdb\u6b65\u3002\u6211\u4f1a\u4e00\u76f4\u5728\u8fd9\u91cc\uff0c\u4f60\u4efb\u4f55\u4e00\u70b9\u5c0f\u5c0f\u7684\u8fdb\u6b65\uff0c\u6211\u90fd\u4f1a\u7b2c\u4e00\u4e2a\u4e3a\u4f60\u9f13\u638c\u3002\u54b1\u4eec\u6162\u6162\u6765\uff0c\u4eab\u53d7\u8fd9\u4e2a\u8fc7\u7a0b\u5c31\u597d\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf**\u3011\u3002\u6838\u5fc3\u662f\u63d0\u4f9b\u5b89\u5168\u611f\u548c\u60c5\u7eea\u4ef7\u503c\uff0c\u800c\u975e\u9ad8\u538b\u641e\u94b1\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u6ee1\u914d\u3010**\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\uff08C\u6a21\u5757\uff09**\u3011\u3002\u540c\u65f6\uff0c\u56e0\u5176\u6709\u8bbe\u8ba1\u80cc\u666f\uff08\u670d\u88c5\u8bbe\u8ba1\u3001AI\u8bbe\u8ba1\uff09\uff0c\u53ef\u8f7b\u5ea6\u5f15\u5165\u3010**\u5174\u8da3\u63a2\u7d22\u5305\uff08B\u6a21\u5757\u8f7b\u91cf\u7248\uff09**\u3011\uff0c\u5982\u5f15\u5bfc\u5979\u5c1d\u8bd5\u4e3a\u6709\u58f0\u4e66\u8bbe\u8ba1\u5c01\u9762\u6216AI\u751f\u6210\u6d77\u62a5\uff0c\u5c06\u5176\u73b0\u6709\u6280\u80fd\u4e0e\u8bfe\u7a0b\u7ed3\u5408\uff0c\u521b\u9020\u5373\u65f6\u6b63\u53cd\u9988\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u7981\u6b62\u4f7f\u7528\u4efb\u4f55\u9ad8\u538b\u3001\u6050\u5413\u5f0f\u8bdd\u672f**\uff08\u5982\u201c\u6dd8\u6c70\u201d\u3001\u201c\u7b5b\u51fa\u53bb\u201d\uff09\u30022. **\u7981\u6b62\u5728\u5979\u4f5c\u4e1a\u4e0d\u4f73\u65f6\u8fdb\u884c\u51b7\u51b0\u51b0\u7684\u6280\u672f\u6279\u5224**\uff0c\u5fc5\u987b\u5148\u80af\u5b9a\u518d\u59d4\u5a49\u5efa\u8bae\u30023. **\u7981\u6b62\u5728\u5979\u8868\u8fbe\u7126\u8651\u65f6\u8bb2\u5927\u9053\u7406\u6216\u50ac\u4fc3**\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u521d\u671f\uff08\u524d2\u4e2a\u6708\uff09\u8fdb\u884c\u4efb\u4f55\u5927\u989d\u5347\u5355\u63a8\u4ecb**\u3002\u53ef\u5c1d\u8bd5500\u5143\u4ee5\u5185\u7684\u5fae\u5347\u5355\uff08\u5982\u58f0\u97f3\u5b9a\u5236\u670d\u52a1\u3001\u5174\u8da3\u5c0f\u8bfe\uff09\uff0c\u4e14\u5fc5\u987b\u5305\u88c5\u6210\u201c\u4e3a\u4f60\u4e13\u5c5e\u6253\u9020\u7684\u9f13\u52b1\u793c\u5305\u201d\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u662f\u7684\uff0c\u6211\u4e5f\u611f\u89c9\u58f0\u97f3\u5f88\u5e73\uff0c\u6ca1\u4ec0\u4e48\u611f\u60c5\u3002\u4ee3\u5165\u60c5\u611f\u53c8\u611f\u89c9\u592a\u5047\uff0c\u4e0d\u771f\u5b9e\u3002\u6bcf\u6b21\u64ad\u51fa\u6765\u7684\u60c5\u611f\u90fd\u4e0d\u4e00\u6837\uff0c\u6709\u65f6\u5019\u5bf9\u7684\u6f14\u64ad\u53c8\u4e0d\u80fd\u4fdd\u6301\uff0c\u91cd\u505a\u7684\u65f6\u5019\u53c8\u4e0d\u4e00\u6837\u4e86\u3002\u201d **\uff08\u5178\u578bT6\u81ea\u5351\u4e0e\u5185\u8017\u4fe1\u53f7\uff09**\n2. > \u201c\u4e1c\u4e1c\u8001\u5e08\u548c\u5f20\u9707\u8001\u5e08\u592a\u6709\u4eb2\u548c\u529b\u4e86\uff0c\u8ddf\u7740\u4f60\u4eec\u5b66\uff0c\u55ef\uff0c\u4e00\u70b9\u90fd\u4e0d\u89c9\u5f97\u6709\u538b\u529b\uff0c\u5c31\u597d\u50cf\u670b\u53cb\u4e00\u6837\u7684\u3002\u201d **\uff08\u5bf9\u60c5\u611f\u8fde\u63a5\u548c\u4f4e\u538b\u73af\u5883\u7684\u9ad8\u5ea6\u4f9d\u8d56\uff09**\n3. > \u201c\u6211\u73b0\u5728\u662f\u5168\u804c\u4e0a\u73ed\u517c\u7167\u987e\u5c0f\u5b69\uff0c\u6bcf\u5929\u4e00\u4e24\u4e2a\u5c0f\u65f6\u517c\u804c\u662f\u6ca1\u6709\u95ee\u9898\u7684\u3002\u201d **\uff08\u8d44\u6e90\u5e95\u5ea7\u4e2d\uff0c\u65f6\u95f4\u788e\u7247\u5316\u7684\u5178\u578b\u7279\u5f81\uff09**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u88ab\u8ba4\u53ef\u3001\u88ab\u9f13\u52b1\u3001\u5728\u65e0\u538b\u529b\u7684\u73af\u5883\u4e2d\u83b7\u5f97\u5f52\u5c5e\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u81f4\u7684\u60c5\u611f\u6258\u5e95\uff08C\u6a21\u5757\u6ee1\u914d\uff09\uff0c\u7528\u5938\u5f20\u7684\u8d5e\u7f8e\u66ff\u4ee3\u4e25\u5389\u7684\u6279\u8bc4\uff0c\u5c06\u5b66\u4e60\u8fc7\u7a0b\u8f6c\u5316\u4e3a\u4e00\u573a\u6e29\u6696\u7684\u201c\u670b\u53cb\u5f0f\u201d\u966a\u4f34\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u793e\u4ea4/\u5c0a\u91cd\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}\n```";
