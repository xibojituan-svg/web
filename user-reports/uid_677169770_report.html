    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4f5c\u4e3a\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677169770\u7684\u7528\u6237\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677169770 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u554a\u7f3a3(\u5f20\u6d69) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u9a6c\u62c9\u96c5\u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u4ef7\u683c\u672a\u660e\u793a\uff0c\u4f46\u63d0\u53ca\u201c\u9ad8\u9636\u540d\u989d\u201d\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u5916\u5361\u652f\u4ed8\u969c\u788d**\uff0c\u9700\u7528\u6bcd\u4eb2\u56fd\u5185\u624b\u673a\u53f7\u4ee3\u4e3a\u64cd\u4f5c\uff0c\u5b58\u5728\u652f\u4ed8\u6d41\u7a0b\u590d\u6742\u6027\u548c\u6f5c\u5728\u5bb6\u5ead\u77e5\u60c5\u98ce\u9669\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u4e3a\u5bf9\u5916\u4e2d\u6587\u6559\u5e08\uff0c\u8eab\u5904\u6c99\u7279\uff0c\u4e0e\u56fd\u5185\u67095\u5c0f\u65f6\u65f6\u5dee\uff0c\u4f46\u660e\u786e\u8868\u793a\u67091-2\u5c0f\u65f6\u788e\u7247\u65f6\u95f4\u7528\u4e8e\u517c\u804c\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u4f7f\u7528\u6bcd\u4eb2\u624b\u673a\u53f7\u6ce8\u518c\uff0c\u4f46\u672a\u63d0\u53ca\u6bcd\u4eb2\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\u3002\u5b58\u5728\u201c\u9690\u7792\u5077\u62a5\u201d\u6216\u201c\u5df2\u62a5\u5907\u5e76\u652f\u6301\u201d\u4e24\u79cd\u53ef\u80fd\uff0c\u9700\u6838\u5b9e\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u7528\u6237\u63d0\u4f9b\u4e86\u5e74\u9f84\u3001\u804c\u4e1a\u3001\u5730\u7406\u4f4d\u7f6e\u3001\u5b66\u4e60\u76ee\u6807\u3001\u8bbe\u5907\u4fe1\u606f\u7b49\u5173\u952e\u6570\u636e\uff0c\u4e92\u52a8\u79ef\u6781\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **[\u2b07\u4f4e]**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34\uff0c\u5174\u8da3\u4e0e\u53d8\u73b0\u76ee\u7684\u5e76\u5b58\uff0c\u65e0\u660e\u663e\u77ed\u671f\u66b4\u5bcc\u5e7b\u60f3\u3002**\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n    > \u201c\u6765\u8bad\u7ec3\u8425\u60f3\u6536\u83b7\u4ec0\u4e48\uff1f\u8d5a\u7c73/\u5174\u8da3: Both\u201d\n    > \u201c\u5feb\u901f\uff0c\u957f\u671f\u90fd\u53ef\u4ee5\u3002\u659c\u6760\u91cc\u5c31\u5bf9\u540e\u671f\u611f\u5174\u8da3\u3002\u201d\n    > \u201c\u53ea\u8981\u65f6\u95f4\u5141\u8bb8\u5c31\u884c\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **[\u27a1\u4e2d]**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u4e2d]** \u2014 \u804c\u4e1a\u4e3a\u5bf9\u5916\u4e2d\u6587\u6559\u5e08\uff0c\u6709\u7a33\u5b9a\u6536\u5165\uff0c\u4f46\u652f\u4ed8\u65f6\u4f7f\u7528\u5916\u5361\u9047\u963b\uff0c\u9700\u6bcd\u4eb2\u534f\u52a9\uff0c\u8868\u660e\u5176\u56fd\u5185\u91d1\u878d\u5de5\u5177\u4e0d\u4fbf\uff0c\u4f46\u975e\u7ecf\u6d4e\u7a98\u8feb\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**[\u4e2d]** \u2014 \u67091-2\u5c0f\u65f6\u788e\u7247\u65f6\u95f4\uff0c\u804c\u4e1a\u76f8\u5bf9\u81ea\u7531\uff0c\u4f46\u8eab\u5904\u6d77\u5916\u67095\u5c0f\u65f6\u65f6\u5dee\uff0c\u5bf9\u540c\u6b65\u76f4\u64ad/\u6253\u5361\u6784\u6210\u6311\u6218\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u4f4e/\u4fe1\u606f\u4e0d\u8db3]** \u2014 **\u5173\u952e\u98ce\u9669\u70b9**\u3002\u4f7f\u7528\u6bcd\u4eb2\u624b\u673a\u53f7\u6ce8\u518c\u5e76\u7ed1\u5b9a\u8bfe\u7a0b\uff0c\u6bcd\u4eb2\u662f\u5426\u77e5\u60c5\u5e76\u652f\u6301\u5b58\u7591\u3002\u82e5\u4e3a\u201c\u9690\u7792\u5077\u62a5\u201d\uff0c\u5219\u6784\u6210\u91cd\u5927\u9000\u8d39\u98ce\u9669\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **[\u2b06\u9ad8]**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3**\u3002\u8868\u73b0\u51fa\u72ec\u7acb\u3001\u7406\u6027\u3001\u6709\u8fb9\u754c\u611f\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u624b\u673a\u6253\u4e0d\u5f00docx\u3001\u65f6\u5dee\u8ba1\u7b97\u3001\u8d26\u53f7\u7ed1\u5b9a\uff09\u80fd\u4e3b\u52a8\u3001\u6e05\u6670\u5730\u63d0\u51fa\u5e76\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u800c\u975e\u60c5\u7eea\u5316\u62b1\u6028\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n    > \u201c\u6211\u8fd9\u91cc\u6bd4\u4f60\u4eec\u665a5\u5c0f\u65f6\uff0c\u6240\u4ee5\u6211\u9700\u8981\u6bcf\u6b21\u7b97\u597d\u65f6\u5dee\uff0c\u5c3d\u91cf\u4e0d\u8d85\u65f6\u201d\n    > \u201c\u6211\u7684\u662f\u5916\u5361\uff0c\u53ef\u4ee5\u5e2e\u6211\u5148\u4fdd\u7559\u4e00\u4e2a\u9ad8\u9636\u540d\u989d\u5417\u201d\n    > \u201c\u6362\u7ed1\u540e\u6211\u5c31\u53ef\u4ee5\u7528\u6211\u6d77\u5916\u53f7\u7801\u63a5\u6536\u9a8c\u8bc1\u7801\u4e86\u5417\uff1f\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34\u4e0e\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u8eab\u5904\u6d77\u5916\uff08\u6c99\u7279\uff09\uff0c\u53ef\u80fd\u5b58\u5728\u4e00\u5b9a\u7684\u6587\u5316\u758f\u79bb\u611f\u548c\u793e\u4ea4\u5708\u5c42\u5355\u4e00\u3002\u4f5c\u4e3a45\u5c81\u7684\u5973\u6027\u6559\u5e08\uff0c\u804c\u4e1a\u7a33\u5b9a\u4f46\u53ef\u80fd\u7f3a\u4e4f\u65b0\u9c9c\u611f\u548c\u6210\u5c31\u611f\uff0c\u6e34\u671b\u901a\u8fc7\u65b0\u7684\u6280\u80fd\u5b66\u4e60\u83b7\u5f97**\u5708\u5c42\u8ba4\u540c\u548c\u65b0\u7684\u793e\u4ea4\u8fde\u63a5**\uff0c\u540c\u65f6\u8bc1\u660e\u81ea\u5df1\u7684\u4ef7\u503c\uff08\u201cBoth\u201d\u8d5a\u7c73\u548c\u5174\u8da3\uff09\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u5708\u5c42\u878d\u5165\u611f**\u3002\u5979\u9700\u8981\u88ab\u5f53\u4f5c\u4e00\u4e2a\u6709\u80fd\u529b\u3001\u6709\u89c1\u89e3\u7684\u6210\u5e74\u4eba\u5bf9\u5f85\uff08\u800c\u975e\u5c0f\u767d\uff09\uff0c\u5979\u7684\u58f0\u97f3\u6761\u4ef6\u548c\u5b66\u4e60\u6001\u5ea6\u9700\u8981\u5f97\u5230\u4e13\u4e1a\u5c42\u9762\u7684\u80af\u5b9a\uff0c\u5e76\u8ba9\u5979\u611f\u53d7\u5230\u81ea\u5df1\u662f\u4e00\u4e2a\u6709\u6f5c\u529b\u7684\u201c\u82d7\u5b50\u201d\uff0c\u6b63\u5728\u8fdb\u5165\u4e00\u4e2a\u6709\u8da3\u3001\u6709\u6599\u7684\u5708\u5b50\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u9ad8\u52a8\u673a\u7eaf\u5ea6\u3001\u9ad8\u5fc3\u7406\u5f39\u6027\u3001\u8d44\u6e90\u5e95\u5ea7\u4e2d\u7b49\u4e14\u7a33\u5b9a) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u7edd\u5883\u3001\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\u3002**\u4f46\u9700\u8b66\u60d5\u5bb6\u5ead\u652f\u6301\u5ea6\u98ce\u9669**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | **\u6838\u5fc3\u98ce\u9669**\uff1a\u8bfe\u7a0b\u7ed1\u5b9a\u5728\u6bcd\u4eb2\u624b\u673a\u53f7\u4e0a\u3002\u82e5\u6bcd\u4eb2\u4e0d\u77e5\u60c5\u6216\u53cd\u5bf9\uff0c\u53ef\u80fd\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u5e76\u8981\u6c42\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u7528\u6237\u81ea\u5f8b\u6027\u5f3a\uff0c\u80fd\u4e3b\u52a8\u7ba1\u7406\u65f6\u5dee\uff0c\u5b66\u4e60\u610f\u613f\u660e\u786e\u3002\u4f46\u9700\u5173\u6ce8\u6d77\u5916\u7f51\u7edc\u3001\u5e73\u53f0\u517c\u5bb9\u6027\u7b49\u5ba2\u89c2\u969c\u788d\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u89e3\u51b3\u95ee\u9898\u5bfc\u5411\uff0c\u4e0d\u6613\u56e0\u5b66\u4e60\u632b\u6298\u60c5\u7eea\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4f4e** | \u52a8\u673a\u975e\u7eaf\u53d8\u73b0\u9a71\u52a8\uff08\u201cBoth\u201d\uff09\uff0c\u5bf9\u6536\u76ca\u6709\u7406\u6027\u9884\u671f\uff08\u201c\u5feb\u901f\uff0c\u957f\u671f\u90fd\u53ef\u4ee5\u201d\uff09\uff0c\u4e0d\u6613\u56e0\u77ed\u671f\u672a\u63a5\u5355\u800c\u66b4\u6012\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e1-2\u5468**\u3002\u5f53\u8bfe\u7a0b\u5f3a\u5ea6\u589e\u52a0\u3001\u9700\u8981\u66f4\u591a\u65f6\u95f4\u6295\u5165\uff0c\u4e14\u6d77\u5916\u64cd\u4f5c\u4e0d\u4fbf\u3001\u4e0e\u5bb6\u4eba\u6c9f\u901a\u6210\u672c\u7b49\u95ee\u9898\u53e0\u52a0\u65f6\uff0c\u53ef\u80fd\u56e0\u201c\u592a\u9ebb\u70e6\u201d\u800c\u653e\u5f03\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6b22\u8fce\u52a0\u5165\uff01\u770b\u5230\u60a8\u5728\u56fd\u5916\u8fd8\u8fd9\u4e48\u79ef\u6781\u5730\u8c03\u6574\u65f6\u5dee\u5b66\u4e60\uff0c\u771f\u7684\u5f88\u4f69\u670d\u60a8\u7684\u884c\u52a8\u529b\u548c\u5bf9\u58f0\u97f3\u7684\u70ed\u7231\u3002\u54b1\u4eec\u73ed\u91cc\u6709\u597d\u51e0\u4f4d\u6d77\u5916\u540c\u5b66\uff0c\u4ee5\u540e\u53ef\u4ee5\u591a\u4ea4\u6d41\u3002\u60a8\u7684\u58f0\u97f3\u6761\u4ef6\u5f88\u6709\u7279\u70b9\uff0c\u620f\u611f\u4e5f\u4e0d\u9519\uff08\u5f15\u7528\u9500\u552e\u70b9\u8bc4\uff09\uff0c\u671f\u5f85\u770b\u5230\u60a8\u66f4\u7cbe\u5f69\u7684\u4f5c\u54c1\u3002\u6709\u4efb\u4f55\u56e0\u4e3a\u65f6\u5dee\u6216\u6d77\u5916\u7f51\u7edc\u5bfc\u81f4\u7684\u64cd\u4f5c\u95ee\u9898\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4eec\u4e00\u8d77\u60f3\u529e\u6cd5\u89e3\u51b3\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176T2\u201c\u4f4e\u8c03\u8001\u9ec4\u725b\u201d\u7279\u8d28\uff0c\u63d0\u4f9b\u624e\u5b9e\u7684\u6280\u80fd\u8bad\u7ec3\u548c\u660e\u786e\u7684\u8fdb\u9636\u8def\u5f84\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n    1.  **\u3010\u65f6\u5dee\u53cb\u597d\u578b\u5b66\u4e60\u5305\u3011**\uff1a\u63d0\u4f9b\u76f4\u64ad\u56de\u653e\u3001\u5f39\u6027\u4f5c\u4e1a\u63d0\u4ea4\u65f6\u95f4\uff08\u660e\u786e\u544a\u77e5\u6700\u665a\u53ef\u5ef6\u8fdf\u81f3\u5176\u5f53\u5730\u65f6\u95f4\u51e0\u70b9\uff09\u3002\n    2.  **\u3010\u6d77\u5916\u64cd\u4f5c\u6307\u5357\u5305\u3011**\uff1a\u9488\u5bf9\u5916\u5361\u652f\u4ed8\u3001\u6d77\u5916\u624b\u673a\u53f7\u9a8c\u8bc1\u3001\u7279\u5b9a\u5730\u533a\u8bbf\u95ee\u559c\u9a6c\u62c9\u96c5/\u5fae\u4fe1\u53ef\u80fd\u9047\u5230\u7684\u95ee\u9898\uff0c\u63d0\u4f9b\u56fe\u6587\u6216\u89c6\u9891SOP\u3002\n    3.  **\u3010\u6280\u672f\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011**\uff08B\u6a21\u5757\uff09\uff1a\u56e0\u5176\u5bf9\u201c\u540e\u671f\u201d\u611f\u5174\u8da3\uff0c\u53ef\u9002\u65f6\u5f15\u5165AU\u7b49\u8f6f\u4ef6\u7684\u9ad8\u7ea7\u6280\u5de7\u7b54\u7591\uff0c\u6ee1\u8db3\u5176\u63a2\u7d22\u6b32\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1.  \u7528\u201c\u5b9d\u5988\u201d\u3001\u201c\u5c0f\u767d\u201d\u7b49\u53ef\u80fd\u77ee\u5316\u5176\u8eab\u4efd\u7684\u79f0\u547c\u3002\u5e94\u79f0\u201c\u8001\u5e08\u201d\u6216\u76f4\u547c\u5176\u540d\u3002\n    2.  \u5ffd\u89c6\u5176\u6d77\u5916\u65f6\u5dee\uff0c\u5728\u975e\u5176\u6d3b\u8dc3\u65f6\u95f4\u9891\u7e41@\u6216\u50ac\u4fc3\u3002\n    3.  \u4f7f\u7528\u8fc7\u4e8e\u60c5\u611f\u5316\u3001\u5938\u5f20\u7684\u201c\u5b9d\u5b9d\u201d\u3001\u201c\u4eb2\u201d\u7b49\u8bdd\u672f\uff0c\u4fdd\u6301\u4e13\u4e1a\u3001\u5c0a\u91cd\u7684\u4ea4\u6d41\u98ce\u683c\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5f53\u5176\u6280\u80fd\u8fbe\u5230\u4e00\u5b9a\u6c34\u5e73\uff0c\u4e14\u8868\u73b0\u51fa\u5bf9\u201c\u540e\u671f\u201d\u7b49\u6df1\u5ea6\u5185\u5bb9\u7684\u5174\u8da3\u65f6\uff0c\u53ef\u63a8\u8350\u9ad8\u9636\u8bfe\u7a0b\u6216\u8bbe\u5907\u3002\u63a8\u4ecb\u8bdd\u672f\u5e94\u4fa7\u91cd\u201c\u6280\u80fd\u7cbe\u8fdb\u201d\u548c\u201c\u62d3\u5bbd\u53ef\u80fd\u6027\u201d\uff0c\u800c\u975e\u201c\u5feb\u901f\u8d5a\u94b1\u201d\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c[\u6211\u7684\u6027\u522b/\u5e74\u9f84]\uff1a \u5973\uff0c45 [\u6240\u5728\u57ce\u5e02/\u804c\u4e1a]: \u6c99\u7279\u8fbe\u66fc/\u5bf9\u5916\u4e2d\u6587\u6559\u5e08 [\u6765\u8bad\u7ec3\u8425\u60f3\u6536\u83b7\u4ec0\u4e48\uff1f\u8d5a\u7c73/\u5174\u8da3]: Both\u201d \u2014\u2014 **\u52a8\u673a\u660e\u786e\u4e14\u7406\u6027\uff0c\u975e\u7eaf\u641e\u94b1\u9a71\u52a8\u3002**\n2. > \u201c\u6211\u8fd9\u91cc\u6bd4\u4f60\u4eec\u665a5\u5c0f\u65f6\uff0c\u6240\u4ee5\u6211\u9700\u8981\u6bcf\u6b21\u7b97\u597d\u65f6\u5dee\uff0c\u5c3d\u91cf\u4e0d\u8d85\u65f6\u201d \u2014\u2014 **\u9ad8\u81ea\u5f8b\u6027\u3001\u9ad8\u5fc3\u7406\u5f39\u6027\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\u3002**\n3. > \u201c\u6211\u7684\u662f\u5916\u5361\uff0c\u53ef\u4ee5\u5e2e\u6211\u5148\u4fdd\u7559\u4e00\u4e2a\u9ad8\u9636\u540d\u989d\u5417\u201d \u2014\u2014 **\u652f\u4ed8\u610f\u613f\u660e\u786e\uff0c\u4f46\u5b58\u5728\u5ba2\u89c2\u969c\u788d\uff0c\u9700\u534f\u52a9\u89e3\u51b3\u3002**\n4. > \u201c@\u91d1\u5b50\u2005\u662f\u8c01\u7ed9\u4e86\u4f60\u6743\u529b\u5728\u7fa4\u91cc\u9a82\u4eba\uff1f\u795e\u5fd7\u4e0d\u6e05\u53bb\u53bb\u6302\u5f53\u5730\u7cbe\u795e\u79d1\uff01@\u7b71\u6590-\u52a9\u6559\uff08\u672a\u6210\u5e74\u52ff\u52a0\uff09\u2005\u8bf7\u7fa4\u4e3b\u5c06\u6b64\u4eba\u8e22\u51fa\u7fa4\u201d \u2014\u2014 **\u6709\u6b63\u4e49\u611f\u3001\u6709\u8fb9\u754c\u3001\u6562\u4e8e\u7ef4\u62a4\u793e\u7fa4\u79e9\u5e8f\uff0c\u5177\u5907\u6f5c\u5728\u7684T1\u9886\u8896\u6f5c\u8d28\uff08\u6df7\u5408\u4f533\u53f7\u8fdb\u5316\u524d\u4f53\uff09\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u6709\u5411 **\u3010\u6df7\u5408\u4f533\u53f7\uff08\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b\uff09\u3011** \u8fdb\u5316\u7684\u6f5c\u529b\u3002\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u6709\u4ef7\u503c\u7684\u5708\u5c42\u5f52\u5c5e\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u4f46\u5b58\u5728 **\u3010\u5bb6\u5ead\u77e5\u60c5\u6743\u3011\u548c\u3010\u6d77\u5916\u64cd\u4f5c\u4e0d\u4fbf\u3011** \u4e24\u5927\u9690\u60a3\u3002\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u4e13\u4e1a\u3001\u5c0a\u91cd\u3001\u9ad8\u6548\u7684\u95ee\u9898\u89e3\u51b3\u65b9\u6848\uff0c\u5e76\u79c1\u4e0b\u6838\u5b9e\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u3011**\u3002\u670d\u52a1\u6838\u5fc3\u662f **\u3010\u7ed9\u4e88\u624e\u5b9e\u7684B\u6a21\u5757\uff08\u786c\u6838\u624b\u827a\uff09\u8bad\u7ec3\u548c\u9002\u5ea6\u7684D\u6a21\u5757\uff08\u8eab\u4efd\u8d4b\u4e88\uff09\u673a\u4f1a\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u793e\u4ea4\u4e0e\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\", \"age\": \"45\u5c81\", \"gender\": \"\u5973\", \"city\": \"\u6c99\u7279\u8fbe\u66fc\"}\n```";
