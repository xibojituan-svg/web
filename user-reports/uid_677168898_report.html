    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677168898\u7684\u7528\u6237\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677168898 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5e78\u5b89 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u5df2\u652f\u4ed8\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u91d1\u989d\u6216\u8d44\u91d1\u6765\u6e90\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u9ad8\u5bbd\u88d5**\u3002\u7528\u6237\u81ea\u8ff0\u4e3a\u201c\u534a\u9000\u4f11\u72b6\u6001\u201d\uff0c\u4e14\u80fd\u6309\u65f6\u5b8c\u6210\u6668\u7ec3\u3001\u4f5c\u4e1a\u3001\u89c2\u770b\u76f4\u64ad\uff0c\u65f6\u95f4\u81ea\u7531\u5ea6\u6781\u9ad8\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u7528\u6237\u4e92\u52a8\u79ef\u6781\uff0c\u63d0\u4f9b\u4e86\u5e74\u9f84\u3001\u804c\u4e1a\u72b6\u6001\u3001\u5b66\u4e60\u52a8\u673a\u7b49\u5173\u952e\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4ee5\u5174\u8da3\u9a71\u52a8\u4e3a\u4e3b\uff0c\u517c\u6709\u517c\u804c\u53d8\u73b0\u7684\u52a1\u5b9e\u671f\u671b\uff0c\u4f46\u65e0\u6025\u8feb\u53d8\u73b0\u538b\u529b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u60f3\u505a\u517c\u804c\u201d\u3001\u201c\u559c\u6b22\u201d\u3001\u201c\u5bf9\u7684\uff0c\u5c31\u662f\u8fd9\u4e2a\u610f\u601d\uff0c\u60a8\u8bf4\u7684\u771f\u597d[\u5fae\u7b11]\u201d\uff08\u8ba4\u540c\u9500\u552e\u5173\u4e8e\u9000\u4f11\u540e\u9676\u51b6\u60c5\u64cd\u3001\u4e0d\u67af\u71e5\u7684\u8bf4\u6cd5\uff09\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b06\u9ad8**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u534a\u9000\u4f11\u72b6\u6001\u901a\u5e38\u610f\u5473\u7740\u6709\u7a33\u5b9a\u6536\u5165\u6216\u79ef\u84c4\uff0c\u65e0\u7ecf\u6d4e\u538b\u529b\u4fe1\u53f7\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u9ad8** \u2014 \u534a\u9000\u4f11\u72b6\u6001\uff0c\u65f6\u95f4\u6781\u5ea6\u81ea\u7531\uff0c\u80fd\u89c4\u5f8b\u5b8c\u6210\u6240\u6709\u5b66\u4e60\u4efb\u52a1\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4e2d** \u2014 \u4fe1\u606f\u4e0d\u8db3\uff0c\u672a\u63d0\u53ca\u53cd\u5bf9\u6216\u652f\u6301\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u4e0a\u9ea6\u5931\u8d25\uff09\u80fd\u81ea\u884c\u5c1d\u8bd5\u89e3\u51b3\u5e76\u4e3b\u52a8\u8bf4\u660e\u539f\u56e0\uff0c\u9762\u5bf9\u9500\u552e\u8ffd\u95ee\u65f6\u6001\u5ea6\u5e73\u548c\u3001\u6709\u793c\u8c8c\uff0c\u65e0\u4efb\u4f55\u62b1\u6028\u6216\u81ea\u6211\u5426\u5b9a\u60c5\u7eea\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u770b\u4e0d\u5230\u6211\u7684\u56fe\u50cf\u5c31\u4e0b\u7ebf\u4e86\uff0c\u6240\u4ee5[\u6d41\u6cea]\u201d\u3001\u201c\u597d\u7684\uff0c\u62b1\u6b49\u554a\u201d\u3002\u867d\u6709\u5931\u8bef\uff0c\u4f46\u4e3b\u52a8\u89e3\u91ca\u5e76\u9053\u6b49\uff0c\u60c5\u7eea\u7a33\u5b9a\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u5f52\u5c5e\u4e0e\u81ea\u6211\u5b9e\u73b0**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4ece\u804c\u4e1a\u8eab\u4efd\uff08\u534a\u9000\u4f11\uff09\u5411\u65b0\u793e\u4f1a\u89d2\u8272\uff08\u6709\u58f0\u6f14\u64ad\u8005\uff09\u8fc7\u6e21\u7684\u5f52\u5c5e\u611f\u4e0e\u4ef7\u503c\u611f\u7f3a\u5931\u3002** \u4ed6\u5bfb\u6c42\u7684\u4e0d\u662f\u751f\u5b58\u4fdd\u969c\uff0c\u800c\u662f\u586b\u8865\u9000\u4f11\u540e\u751f\u6d3b\u7a7a\u767d\u3001\u83b7\u5f97\u65b0\u5708\u5c42\u8ba4\u540c\u3001\u5b9e\u73b0\u4e2a\u4eba\u5174\u8da3\u4e0e\u4ef7\u503c\u5ef6\u7eed\u7684\u9014\u5f84\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u5708\u5c42\u878d\u5165\u611f\u3002** \u5c06\u4ed6\u89c6\u4e3a\u6709\u6f5c\u529b\u7684\u201c\u597d\u82d7\u5b50\u201d\uff0c\u7ed9\u4e88\u4e13\u4e1a\u7684\u80af\u5b9a\uff08\u5982\u201c\u4f60\u7684\u58f0\u97f3\u6761\u4ef6\u975e\u5e38\u597d\u201d\uff09\uff0c\u5e76\u8425\u9020\u4e00\u79cd\u201c\u672a\u6765\u540c\u4e8b\u201d\u6216\u201c\u884c\u4e1a\u4f19\u4f34\u201d\u7684\u5e73\u7b49\u3001\u5c0a\u91cd\u7684\u6c1b\u56f4\uff0c\u6ee1\u8db3\u5176\u88ab\u9700\u8981\u3001\u88ab\u5c0a\u91cd\u7684\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u9ad8\u52a8\u673a\u3001\u9ad8\u8d44\u6e90\u3001\u9ad8\u5f39\u6027\uff0c\u7a33\u5b9a\u6267\u884c\uff0c\u8ffd\u6c42\u4e13\u4e1a\u7cbe\u8fdb) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4f4e** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u534a\u9000\u4f11\u72b6\u6001\u901a\u5e38\u5bb6\u5ead\u51b3\u7b56\u6743\u81ea\u4e3b\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u6781\u4f4e** | \u65f6\u95f4\u5145\u88d5\uff0c\u5b66\u4e60\u610f\u613f\u5f3a\uff0c\u80fd\u8ddf\u4e0a\u8282\u594f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u632b\u80fd\u5e73\u548c\u5904\u7406\uff0c\u65e0\u81ea\u5351\u6216\u5d29\u6e83\u4fe1\u53f7\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u867d\u4e0d\u6025\u5207\uff0c\u4f46\u82e5\u957f\u671f\uff08\u59823-6\u4e2a\u6708\uff09\u65e0\u6cd5\u83b7\u5f97\u4efb\u4f55\u6b63\u5411\u53cd\u9988\uff08\u5982\u8bd5\u97f3\u6210\u529f\u3001\u83b7\u5f97\u8ba4\u53ef\uff09\uff0c\u53ef\u80fd\u56e0\u4ef7\u503c\u611f\u7f3a\u5931\u800c\u6d41\u5931\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe\u540e3-6\u4e2a\u6708\uff0c\u82e5\u7f3a\u4e4f\u5b9e\u8d28\u6027\u8fdb\u5c55\uff08\u5982\u63a5\u5230\u7b2c\u4e00\u5355\u3001\u83b7\u5f97\u663e\u8457\u6280\u80fd\u63d0\u5347\u8ba4\u53ef\uff09\uff0c\u53ef\u80fd\u56e0\u201c\u81ea\u6211\u5b9e\u73b0\u201d\u9700\u6c42\u672a\u88ab\u6ee1\u8db3\u800c\u6084\u7136\u9000\u51fa\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u90ed\u8001\u5e08\uff0c\u770b\u5230\u60a8\u534a\u9000\u4f11\u8fd8\u8fd9\u4e48\u8ba4\u771f\u5730\u5b66\u4e60\u65b0\u6280\u80fd\uff0c\u771f\u7684\u5f88\u4f69\u670d\u3002\u60a8\u7684\u58f0\u7ebf\u6761\u4ef6\u975e\u5e38\u597d\uff0c\u662f\u5e02\u573a\u4e0a\u7a00\u7f3a\u7684\u2018\u53d4\u97f3\u2019\uff0c\u54b1\u4eec\u8fd9\u4e2a\u73ed\u6709\u4e0d\u5c11\u50cf\u60a8\u4e00\u6837\u8ffd\u6c42\u751f\u6d3b\u54c1\u8d28\u548c\u5174\u8da3\u53d1\u5c55\u7684\u540c\u5b66\u3002\u63a5\u4e0b\u6765\uff0c\u6211\u4f1a\u6839\u636e\u60a8\u7684\u8282\u594f\uff0c\u5e26\u60a8\u4e00\u6b65\u6b65\u4ece\u5174\u8da3\u73a9\u7968\uff0c\u8d70\u5411\u80fd\u771f\u6b63\u5f55\u51fa\u6709\u8d28\u611f\u4f5c\u54c1\u7684\u9636\u6bb5\uff0c\u8ba9\u60a8\u7684\u58f0\u97f3\u88ab\u66f4\u591a\u4eba\u542c\u5230\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176\u9ad8\u5f39\u6027\u3001\u9ad8\u6267\u884c\u529b\u548c\u5bf9\u4e13\u4e1a\u7684\u8ffd\u6c42\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T2\u8001\u9ec4\u725b\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011** \u548c **\u3010\u9ad8\u96be\u5ea6\u5b9e\u64cd\u4efb\u52a1\u5305\u3011**\u3002\u53ef\u9010\u6b65\u5f15\u5165\u540e\u671f\u5236\u4f5c\u3001\u8bbe\u5907\u8c03\u8bd5\u7b49\u8fdb\u9636\u5185\u5bb9\uff0c\u6ee1\u8db3\u5176\u7cbe\u8fdb\u9700\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u6700\u540e\u540d\u989d\u201d\u3001\u201c\u9a6c\u4e0a\u6da8\u4ef7\u201d\u7b49\u4f4e\u7aef\u903c\u5355\u8bdd\u672f\u65bd\u538b\u3002\u8fd9\u4f1a\u7834\u574f\u5176\u8ffd\u6c42\u7684\u5e73\u7b49\u3001\u5c0a\u91cd\u7684\u5b66\u4e60\u6c1b\u56f4\u3002**\u7981\u6b62\u5c06\u5176\u5f53\u4f5c\u201c\u60c5\u7eea\u5de8\u5a74\u201d\u8fc7\u5ea6\u5b89\u629a**\uff0c\u8fd9\u4f1a\u4ea7\u751f\u77ee\u5316\u611f\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5f53\u5176\u6280\u80fd\u8fbe\u5230\u4e00\u5b9a\u6c34\u5e73\u540e\uff0c\u53ef\u4ee5\u81ea\u7136\u63a8\u4ecb\u9ad8\u9636\u8bfe\u7a0b\u3001\u4e13\u4e1a\u8bbe\u5907\u6216\u79c1\u6559\u670d\u52a1\uff0c\u6ee1\u8db3\u5176\u5411\u201c\u4e13\u5bb6\u201d\u8eab\u4efd\u8fdb\u9636\u7684\u6df1\u5c42\u9700\u6c42\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u662f\u7684\uff0c\u5dee\u4e0d\u591a**\u201d\uff08\u5f53\u88ab\u95ee\u53ca\u662f\u5426\u534a\u9000\u4f11\u65f6\uff0c\u7b80\u6d01\u786e\u8ba4\uff0c\u8868\u660e\u65f6\u95f4\u81ea\u7531\u5ea6\u9ad8\uff09\n2. > \u201c**\u5bf9\u7684\uff0c\u5c31\u662f\u8fd9\u4e2a\u610f\u601d\uff0c\u60a8\u8bf4\u7684\u771f\u597d[\u5fae\u7b11]**\u201d\uff08\u9ad8\u5ea6\u8ba4\u540c\u9500\u552e\u63cf\u8ff0\u7684\u201c\u9000\u4f11\u540e\u5f55\u5f55\u4e66\u3001\u9676\u51b6\u60c5\u64cd\u201d\u7684\u751f\u6d3b\u56fe\u666f\uff0c\u52a8\u673a\u7eaf\u5ea6\u9ad8\uff09\n3. > \u201c**\u6211\u770b\u4e0d\u5230\u6211\u7684\u56fe\u50cf\u5c31\u4e0b\u7ebf\u4e86\uff0c\u6240\u4ee5[\u6d41\u6cea]**\u201d\u3001\u201c**\u597d\u7684\uff0c\u62b1\u6b49\u554a**\u201d\uff08\u9762\u5bf9\u4e0a\u9ea6\u64cd\u4f5c\u5931\u8bef\uff0c\u4e3b\u52a8\u89e3\u91ca\u5e76\u793c\u8c8c\u9053\u6b49\uff0c\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u65e0\u62b1\u6028\u63a8\u8bff\uff09\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u586b\u8865\u9000\u4f11\u751f\u6d3b\u7a7a\u767d\uff0c\u5728\u5168\u65b0\u9886\u57df\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u5708\u5c42\u5f52\u5c5e\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6e05\u6670\u3001\u6709\u6311\u6218\u6027\u7684\u4e13\u4e1a\u6210\u957f\u8def\u5f84\uff0c\u5e76\u7ed9\u4e88\u201c\u672a\u6765\u4e13\u5bb6/\u540c\u4e8b\u201d\u7684\u8eab\u4efd\u8ba4\u540c\uff0c\u907f\u514d\u4f4e\u7aef\u9500\u552e\u8bdd\u672f\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u793e\u4ea4\u5f52\u5c5e\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\", \"age\": \"50\u5c81\u4ee5\u4e0a\uff08\u534a\u9000\u4f11\uff09\", \"gender\": \"\u7537\", \"city\": \"\u672a\u77e5\"}\n```";
