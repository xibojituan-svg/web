    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## \u4e00\u3001 \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d)**: \u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b\uff08\u6309\u65f6\u5b8c\u6210\u65e9\u529f\u3001\u4f5c\u4e1a\u3001\u89c2\u770b\u76f4\u64ad\uff09\uff0c\u5bf9\u201c\u53d8\u73b0\u201d\u3001\u201c\u63a5\u5355\u201d\u3001\u201c\u7248\u6743\u4e66\u201d\u7b49\u5173\u952e\u8bcd\u6709\u79ef\u6781\u56de\u5e94\u3002\u4f46\u6df1\u5c42\u52a8\u673a\u504f\u5411**\u53d8\u73b0\u5bfc\u5411**\u548c**\u8d44\u6e90\u83b7\u53d6**\uff08\u5982\u201c\u8eab\u517c\u6570\u804c\u201d\uff09\uff0c\u5bf9\u6280\u80fd\u63d0\u5347\u672c\u8eab\u7684\u4ef7\u503c\u8ba4\u77e5\u53ef\u80fd\u4e0d\u8db3\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4f4e)**: \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5173\u4e8e\u7ecf\u6d4e\u72b6\u51b5\u3001\u804c\u4e1a\u80cc\u666f\u3001\u53ef\u7528\u5b66\u4e60\u65f6\u95f4\uff08\u4ec5\u63d0\u53ca\u201c\u8eab\u517c\u6570\u804c\u201d\u548c\u201c\u665a\u4e00\u70b9\u201d\uff09\u6216\u5bb6\u5ead\u652f\u6301\u7684\u4fe1\u606f\u3002**\u5173\u952e\u4fe1\u606f\u7f3a\u5931**\uff0c\u65e0\u6cd5\u8bc4\u4f30\u5176\u652f\u4ed8\u80fd\u529b\u3001\u65f6\u95f4\u6295\u5165\u7a33\u5b9a\u6027\u53ca\u5bb6\u5ead\u51b3\u7b56\u73af\u5883\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d)**: \u7528\u6237\u80fd\u63a5\u53d7\u53cd\u9988\uff08\u201c\u70b9\u8bc4\u7684\u4ed4\u7ec6\u770b\u4e86\uff0c\u6709\u5e2e\u52a9\u201d\uff09\uff0c\u5e76\u4e3b\u52a8\u66b4\u9732\u7ec3\u4e60\u4e2d\u7684\u56f0\u96be\uff08\u201c\u8fd0\u7528\u7684\u65f6\u5019\u5c31\u4e0d\u884c\u4e86\u201d\u3001\u201c\u4ee3\u5165\u4e0d\u4e86\u60c5\u7eea\u201d\uff09\uff0c\u8868\u73b0\u51fa\u4e00\u5b9a\u7684**\u5b66\u4e60\u97e7\u6027\u548c\u6c42\u52a9\u610f\u613f**\u3002\u4f46\u5bf9\u56f0\u96be\uff08\u5982\u60c5\u7eea\u4ee3\u5165\uff09\u7684\u5f52\u56e0\u504f\u5411\u5916\u90e8\u6280\u5de7\uff0c\u53ef\u80fd\u9690\u542b\u5bf9\u5b66\u4e60\u66f2\u7ebf\u8fc7\u957f\u7684\u6f5c\u5728\u4e0d\u8010\u3002\n\n## \u4e8c\u3001 ABCD\u5224\u5b9a\u6811\u6267\u884c\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u4e8e4\u67088\u65e5\u652f\u4ed82380\u5143\u62a5\u540d\u9ad8\u9636\u73ed\uff0c\u5e76\u6210\u529f\u8fdb\u5165\u65b0\u73ed\u7ea7\u7fa4\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u5168\u7a0b\u4e3a\u5355\u4eba\u6c9f\u901a\uff0c\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u6210\u5458\u6216\u51b3\u7b56\u76f8\u5173\u65b9\u3002\n*   **\u6b65\u9aa41 - \u5b66\u4e60\u610f\u613f (B\u7c7b)**: \u7528\u6237\u884c\u52a8\u914d\u5408\u5ea6\u9ad8\uff0c\u5b8c\u6210\u6240\u6709\u6307\u5b9a\u4efb\u52a1\uff08\u6253\u5361\u3001\u4f5c\u4e1a\u3001\u76f4\u64ad\uff09\uff0c\u7b26\u5408B\u7c7b\uff08\u6709\u884c\u52a8\u610f\u613f\uff09\u7279\u5f81\u3002\n*   **\u6b65\u9aa42 - \u8d44\u6e90\u5339\u914d (\u4fe1\u606f\u4e0d\u8db3)**: \u56e0\u8d44\u6e90\u5e95\u5ea7\u4fe1\u606f\u7f3a\u5931\uff0c\u65e0\u6cd5\u5224\u65ad\u5176\u65f6\u95f4\u3001\u7ecf\u6d4e\u3001\u5bb6\u5ead\u652f\u6301\u662f\u5426\u4e0e\u8bfe\u7a0b\u8981\u6c42\uff08\u6301\u7eed\u7ec3\u4e60\u3001\u53ef\u80fd\u9700\u8bbe\u5907\u6295\u5165\uff09\u5339\u914d\u3002\n*   **\u6b65\u9aa43 - \u5fc3\u7406\u9884\u671f (C\u7c7b\u503e\u5411)**: \u7528\u6237\u5bf9\u201c\u53d8\u73b0\u201d\u3001\u201c\u63a5\u5355\u201d\u3001\u201c\u7248\u6743\u4e66\u201d\u7b49\u7ed3\u679c\u6027\u627f\u8bfa\u53cd\u5e94\u79ef\u6781\uff0c\u4f46\u5bf9\u7ec3\u4e60\u4e2d\u9047\u5230\u7684\u5b9e\u8d28\u6027\u56f0\u96be\uff08\u60c5\u7eea\u4ee3\u5165\u3001\u5077\u6c14\uff09\u8868\u73b0\u51fa\u660e\u663e\u7684\u632b\u8d25\u611f\uff08\u201c\u5f55\u4e86\u597d\u591a\u904d\uff0c\u611f\u89c9\u8fd8\u662f\u4e0d\u5230\u4f4d\u201d\uff09\u3002**\u5b58\u5728\u201c\u5feb\u901f\u53d8\u73b0\u201d\u9884\u671f\u4e0e\u201c\u6280\u80fd\u4e60\u5f97\u9700\u8981\u957f\u671f\u7ec3\u4e60\u201d\u73b0\u5b9e\u4e4b\u95f4\u7684\u6f5c\u5728\u77db\u76fe**\u3002\n*   **\u6b65\u9aa44 - \u51b3\u7b56\u6a21\u5f0f (C\u7c7b\u503e\u5411)**: \u5728\u9500\u552e\u5bc6\u96c6\u63d0\u4f9b\u201c\u4e13\u5c5e\u8d44\u6e90\u201d\u3001\u201c\u7248\u6743\u4e66\u201d\u3001\u201c\u91cd\u70b9\u57f9\u517b\u201d\u7b49\u627f\u8bfa\u540e\uff0c\u7528\u6237\u8fc5\u901f\u505a\u51fa\u652f\u4ed8\u51b3\u7b56\u3002\u51b3\u7b56\u8fc7\u7a0b**\u53d7\u5916\u90e8\u6fc0\u52b1\uff08\u8d44\u6e90\u3001\u8ba4\u53ef\uff09\u9a71\u52a8\u660e\u663e**\uff0c\u7f3a\u4e4f\u5bf9\u81ea\u8eab\u6295\u5165\u4e0e\u8bfe\u7a0b\u957f\u671f\u4ef7\u503c\u7684\u72ec\u7acb\u5ba1\u614e\u8bc4\u4f30\u3002\n\n**\u5224\u5b9a\u7ed3\u679c: C\u7c7b (\u9ad8\u610f\u613f\u3001\u9ad8\u884c\u52a8\uff0c\u4f46\u5b58\u5728\u8d44\u6e90-\u9884\u671f\u9519\u914d\u98ce\u9669)**\n\n## \u4e09\u3001 \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b: T7 \u8d44\u6e90\u6e34\u6c42\u578b\u5b9e\u8df5\u8005**\n    *   **\u7279\u5f81**: \u5bf9\u201c\u8d44\u6e90\u201d\uff08\u5982\u7248\u6743\u4e66\u3001\u63a5\u5355\u6e20\u9053\u3001\u4e13\u5c5e\u6307\u5bfc\uff09\u8868\u73b0\u51fa\u9ad8\u5ea6\u5174\u8da3\u548c\u79ef\u6781\u4e89\u53d6\u3002\u884c\u52a8\u529b\u5f3a\uff0c\u613f\u610f\u5b8c\u6210\u89c4\u5b9a\u52a8\u4f5c\u4ee5\u83b7\u53d6\u8d44\u6e90\u3002\u4f46\u5bf9\u6280\u80fd\u63d0\u5347\u7684\u957f\u671f\u6027\u548c\u8270\u82e6\u6027\u8ba4\u77e5\u53ef\u80fd\u4e0d\u8db3\uff0c\u6613\u56e0\u521d\u671f\u5b9e\u8df5\u6548\u679c\u4e0d\u53ca\u9884\u671f\u800c\u4ea7\u751f\u52a8\u6447\u3002\n    *   **\u4f9d\u636e**: \u7528\u6237\u5bf9\u9500\u552e\u63d0\u4f9b\u7684\u5404\u9879\u201c\u8d44\u6e90\u6743\u76ca\u201d\uff08\u8bd5\u97f3\u6743\u9650\u3001\u7248\u6743\u4e66\u3001\u5165\u7fa4\u8d44\u683c\uff09\u5747\u7ed9\u4e88\u79ef\u6781\u56de\u5e94\u548c\u611f\u8c22\uff0c\u5e76\u6700\u7ec8\u4e3a\u83b7\u53d6\u8fd9\u4e9b\u8d44\u6e90\u627f\u8bfa\u800c\u4ed8\u8d39\u3002\n\n## \u56db\u3001 \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u6839\u56e01 - \u6548\u679c\u672a\u8fbe\u9884\u671f (\u9ad8\u98ce\u9669)**: \u7528\u6237\u5df2\u8868\u73b0\u51fa\u5bf9\u201c\u60c5\u7eea\u4ee3\u5165\u201d\u3001\u201c\u5077\u6c14\u201d\u7b49\u6838\u5fc3\u6280\u80fd\u638c\u63e1\u7684\u7126\u8651\u3002\u82e5\u6b63\u5f0f\u5f00\u8bfe\u540e\u6280\u80fd\u63d0\u5347\u901f\u5ea6\u6162\u4e8e\u5176\u201c\u5feb\u901f\u63a5\u5355\u201d\u9884\u671f\uff0c**\u9000\u8d39\u98ce\u9669\u6781\u9ad8**\u3002\n*   **\u6839\u56e02 - \u7ecf\u6d4e\u538b\u529b (\u4fe1\u606f\u4e0d\u8db3)**: \u65e0\u76f8\u5173\u4fe1\u606f\u3002\n*   **\u6839\u56e03 - \u65f6\u95f4\u51b2\u7a81 (\u4e2d\u98ce\u9669)**: \u7528\u6237\u591a\u6b21\u8868\u793a\u201c\u665a\u4e00\u70b9\u201d\u5b8c\u6210\u4efb\u52a1\uff0c\u4e14\u201c\u8eab\u517c\u6570\u804c\u201d\uff0c\u6697\u793a\u5176\u65f6\u95f4\u53ef\u80fd\u7d27\u5f20\uff0c\u5b58\u5728\u56e0\u65f6\u95f4\u65e0\u6cd5\u4fdd\u8bc1\u800c\u653e\u5f03\u5b66\u4e60\u7684\u98ce\u9669\u3002\n*   **\u6839\u56e04 - \u5bb6\u5ead\u53cd\u5bf9 (\u4fe1\u606f\u4e0d\u8db3)**: \u65e0\u76f8\u5173\u4fe1\u606f\u3002\n*   **\u6839\u56e05 - \u9500\u552e\u8bef\u5bfc (\u4e2d\u98ce\u9669)**: \u9500\u552e\u8fc7\u7a0b\u4e2d\u5b58\u5728**\u8fc7\u5ea6\u627f\u8bfa\u503e\u5411**\uff0c\u5982\u201c\u5e26\u4f60\u5165\u884c\u201d\u3001\u201c\u8ba9\u4f60\u58f0\u97f3\u5347\u503c\u201d\u3001\u201c\u91cd\u70b9\u57f9\u517b\u5bf9\u8c61\u201d\u3001\u201c\u7248\u6743\u4e66\uff08\u53ef\u4e0a\u67b6\u4e2a\u4eba\u4e13\u8f91\uff09\u201d\u7b49\uff0c\u53ef\u80fd\u62ac\u9ad8\u4e86\u7528\u6237\u5bf9\u5b66\u4e60\u6210\u679c\u548c\u8d44\u6e90\u6276\u6301\u7a0b\u5ea6\u7684\u9884\u671f\u3002\n*   **\u6839\u56e06 - \u670d\u52a1\u4f53\u9a8c (\u4f4e\u98ce\u9669)**: \u76ee\u524d\u5bf9\u9500\u552e\uff08\u5e08\u59d0\uff09\u7684\u670d\u52a1\u53cd\u9988\u975e\u5e38\u6b63\u9762\u3002\n*   **\u6839\u56e07 - \u5e73\u53f0\u98ce\u9669 (\u4f4e\u98ce\u9669)**: \u6682\u65e0\u4f53\u73b0\u3002\n*   **\u7efc\u5408\u9000\u8d39\u98ce\u9669: \u4e2d\u9ad8\u98ce\u9669**\u3002\u4e3b\u8981\u98ce\u9669\u96c6\u4e2d\u4e8e**\u6548\u679c\u9884\u671f\u7ba1\u7406**\u548c**\u65f6\u95f4\u6295\u5165\u53ef\u6301\u7eed\u6027**\u3002\n\n## \u4e94\u3001 \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u26a0\ufe0f \u98ce\u9669\u70b9**:\n    1.  **\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u6a21\u7cca\u8868\u8ff0**: \u9500\u552e\u591a\u6b21\u4f7f\u7528\u201c\u5e26\u4f60\u5165\u884c\u201d\u3001\u201c\u58f0\u97f3\u5347\u503c\u201d\u3001\u201c\u91cd\u70b9\u57f9\u517b\u201d\u3001\u201c\u7248\u6743\u4e66\u53ef\u4e0a\u67b6\u4e2a\u4eba\u4e13\u8f91\u201d\u7b49\u8bdd\u672f\uff0c\u53ef\u80fd\u8ba9\u7528\u6237\u8bef\u89e3\u4e3a\u4ed8\u8d39\u540e\u5373\u53ef\u8f7b\u677e\u83b7\u5f97\u53d8\u73b0\u673a\u4f1a\u4e0e\u6210\u719f\u4f5c\u54c1\uff0c**\u5b58\u5728\u5938\u5927\u5ba3\u4f20\u98ce\u9669**\u3002\n    2.  **\u5236\u9020\u7a00\u7f3a\u4e0e\u7d27\u8feb\u611f**: \u201c\u6700\u540e\u4e00\u6b21\u8003\u6838\u201d\u3001\u201c\u6c47\u603b\u6700\u7ec8\u540d\u5355\u201d\u3001\u201c\u73b0\u573a\u53d1\u4f18\u60e0\u5238\u201d\u3001\u201c\u540d\u989d\u5df2\u5360\u4e0b\u201d\u7b49\u8bdd\u672f\u9891\u7e41\u4f7f\u7528\uff0c\u7b26\u5408\u9500\u552e\u8282\u594f\uff0c\u4f46\u9700\u6ce8\u610f\u662f\u5426\u6784\u6210\u4e0d\u5f53\u65bd\u538b\u3002\n    3.  **\u60c5\u611f\u7ed1\u5b9a**: \u9500\u552e\u901a\u8fc7\u201c\u6211\u770b\u597d\u4f60\u201d\u3001\u201c\u5bf9\u4f60\u86ee\u6709\u4fe1\u5fc3\u201d\u3001\u201c\u72ec\u5ba0\u8d44\u6e90\u201d\u7b49\u5efa\u7acb\u4e2a\u4eba\u60c5\u611f\u94fe\u63a5\uff0c\u867d\u6709\u52a9\u4e8e\u8f6c\u5316\uff0c\u4f46\u9700\u8b66\u60d5\u540e\u7eed\u670d\u52a1\u82e5\u65e0\u6cd5\u5339\u914d\u6b64\u627f\u8bfa\uff0c\u6613\u5f15\u53d1\u88ab\u6b3a\u9a97\u611f\u3002\n*   **\u5408\u89c4\u6027**: \u6d41\u7a0b\u4e0a\u5b8c\u6210\u4e86\u6253\u5361\u3001\u4f5c\u4e1a\u3001\u70b9\u8bc4\u7b49\u73af\u8282\uff0c\u5f15\u5bfc\u7528\u6237\u5b8c\u6210\u4e86\u652f\u4ed8\u52a8\u4f5c\u3002\u4f46**\u5728\u6548\u679c\u627f\u8bfa\u548c\u8d44\u6e90\u63cf\u8ff0\u7684\u5ba2\u89c2\u6027\u4e0a\u5b58\u5728\u64e6\u8fb9\u7403\u98ce\u9669**\u3002\n\n## \u516d\u3001 \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6: \u504f\u5dee**\u3002\u7528\u6237\u4e3a**\u8d44\u6e90\u9a71\u52a8\u578b**\uff0c\u4f46\u4ea7\u54c1\u6838\u5fc3\u662f**\u6280\u80fd\u6559\u5b66\u578b**\u3002\u7528\u6237\u671f\u5f85\u7684\u662f\u201c\u8d44\u6e90\u901a\u9053\u201d\u548c\u201c\u5feb\u901f\u53d8\u73b0\u201d\uff0c\u800c\u8bfe\u7a0b\u4ea4\u4ed8\u7684\u662f\u201c\u6280\u80fd\u8bad\u7ec3\u201d\u548c\u201c\u957f\u671f\u79ef\u7d2f\u201d\u3002\u6b64\u9519\u914d\u662f\u540e\u7eed\u98ce\u9669\u7684\u4e3b\u8981\u6765\u6e90\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**:\n    **\u9996\u5468\u91cd\u70b9\u6821\u6b63\u53d8\u73b0\u9884\u671f\uff0c\u5f3a\u5316\u8fc7\u7a0b\u4ef7\u503c**\n    1.  **\u9884\u671f\u7ba1\u7406\uff08\u5173\u952e\uff09**: \u9996\u6b21\u6c9f\u901a\u5fc5\u987b\u660e\u786e\u5b66\u4e60\u66f2\u7ebf\uff0c\u5f3a\u8c03\u201c\u6280\u80fd\u79ef\u7d2f\u5728\u524d\uff0c\u8d44\u6e90\u53d8\u73b0\u5728\u540e\u201d\u3002\u7528\u5177\u4f53\u6848\u4f8b\u8bf4\u660e\u4ece\u5b66\u4e60\u5230\u63a5\u5355\u7684\u5e38\u89c1\u65f6\u95f4\u5468\u671f\u548c\u6240\u9700\u7ec3\u4e60\u91cf\uff0c**\u964d\u4f4e\u5176\u4e0d\u5207\u5b9e\u9645\u7684\u5feb\u901f\u56de\u62a5\u9884\u671f**\u3002\n    2.  **\u8fc7\u7a0b\u6fc0\u52b1**: \u5c06\u5176\u5bf9\u201c\u8d44\u6e90\u201d\u7684\u5173\u6ce8\uff0c\u5de7\u5999\u5f15\u5bfc\u81f3\u5bf9\u201c\u4e2a\u4eba\u80fd\u529b\u6210\u957f\u91cc\u7a0b\u7891\u201d\u7684\u5173\u6ce8\u3002\u4f8b\u5982\uff0c\u5c06\u201c\u83b7\u5f97\u7248\u6743\u4e66\u201d\u7684\u76ee\u6807\u8f6c\u5316\u4e3a\u201c\u5b8c\u6210XX\u5c0f\u65f6\u7ec3\u4e60\u540e\uff0c\u7528\u8fbe\u6807\u4f5c\u54c1\u89e3\u9501\u7248\u6743\u4e66\u5f55\u5236\u8d44\u683c\u201d\u3002\n    3.  **\u65f6\u95f4\u89c4\u5212\u652f\u6301**: \u4e3b\u52a8\u8be2\u95ee\u5176\u201c\u8eab\u517c\u6570\u804c\u201d\u7684\u5177\u4f53\u60c5\u51b5\uff0c\u534f\u52a9\u5236\u5b9a\u5207\u5b9e\u53ef\u884c\u7684\u3001\u788e\u7247\u5316\u7684\u5b66\u4e60\u8ba1\u5212\uff0c\u964d\u4f4e\u56e0\u65f6\u95f4\u538b\u529b\u5bfc\u81f4\u7684\u632b\u8d25\u611f\u548c\u8131\u843d\u98ce\u9669\u3002\n    4.  **\u98ce\u9669\u76d1\u63a7**: \u5bc6\u5207\u5173\u6ce8\u5176\u5728\u524d\u51e0\u8282\u6b63\u8bfe\u540e\u7684\u53cd\u9988\uff0c\u7279\u522b\u662f\u9047\u5230\u6280\u5de7\u96be\u70b9\u65f6\u7684\u60c5\u7eea\u53cd\u5e94\u3002\u4e00\u65e6\u51fa\u73b0\u201c\u5b66\u4e86\u6ca1\u7528\u201d\u7684\u82d7\u5934\uff0c\u9700\u7acb\u5373\u4ecb\u5165\uff0c\u8fdb\u884c\u5b66\u4e60\u52a8\u673a\u5f3a\u5316\u548c\u56f0\u96be\u758f\u5bfc\u3002\n\n```json\n{\"core_type\": \"T7 \u8d44\u6e90\u6e34\u6c42\u578b\u5b9e\u8df5\u8005\", \"risk_level\": \"\u4e2d\u9ad8\u98ce\u9669\", \"refund_risk\": \"\u4e2d\u9ad8\u98ce\u9669\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u9996\u5468\u91cd\u70b9\u6821\u6b63\u53d8\u73b0\u9884\u671f\"}\n```";
