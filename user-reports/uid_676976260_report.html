    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u7f3a\u4e4f\u521d\u59cb\u4ed8\u8d39\u51b3\u7b56\u3001\u5bb6\u5ead\u652f\u6301\u5ea6\u3001\u5177\u4f53\u7ecf\u6d4e\u72b6\u51b5\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u7b49\u5173\u952e\u4fe1\u606f\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a\u4e2d\u7b49\u3002\u6709\u660e\u786e\u7684\u6280\u80fd\u63d0\u5347\u548c\u53d8\u73b0\u610f\u613f\uff08\u201c\u4e00\u8d77\u5b8c\u6210\u6709\u58f0\u68a6\u201d\uff09\uff0c\u4f46**\u52a8\u673a\u6613\u53d7\u5bb6\u5ead\u4e8b\u52a1\uff08\u80b2\u513f\uff09\u548c\u60c5\u7eea\u6ce2\u52a8\u5e72\u6270**\uff0c\u8868\u73b0\u51fa\u201c\u60f3\u5b66\u4f46\u6015\u641e\u4e0d\u5b9a\u201d\u7684\u77db\u76fe\u5fc3\u6001\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a\u4e2d\u7b49\u504f\u5f31\u3002\u65f6\u95f4\u8d44\u6e90\u4e25\u91cd\u4e0d\u8db3\uff08\u201c\u54c4\u5a03\u9014\u4e2d\u5077\u65f6\u95f4\u770b\u201d\u3001\u201c\u5a03\u4e00\u54ed\uff0c\u624b\u4e00\u6296\u201d\u3001\u201c\u767d\u5929\u6bcf\u6b21\u5c31\u7761\u534a\u4e2a\u5c0f\u65f6\u201d\uff09\uff0c\u7269\u7406\u73af\u5883\u4e0d\u4f73\uff08\u201c\u4e0d\u662f\u9e21\u53eb\u5c31\u662f\u72d7\u53eb\u201d\uff09\u3002\u7ecf\u6d4e\u4e0a**\u5b58\u5728\u538b\u529b**\uff08\u201c\u624b\u91cc\u9762\u4e0d\u65b9\u4fbf\u201d\u3001\u201c\u538b\u529b\u6709\u70b9\u5927\u201d\uff09\uff0c\u4f46\u5df2\u4e3a\u8bfe\u7a0b\u4ed8\u8d39\u5e76\u8d2d\u4e70\u4e86SE2200\u9ea6\u514b\u98ce\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u6295\u5165\u610f\u613f\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a\u4e2d\u7b49\u3002\u6709\u5b66\u4e60\u610f\u613f\u548c\u793e\u7fa4\u4e92\u52a8\u79ef\u6781\u6027\uff08\u4e3b\u52a8\u63d0\u95ee\u3001\u53c2\u4e0e\u8ba8\u8bba\u3001\u63d0\u4f9b\u5267\u672c\uff09\uff0c\u4f46**\u4f9d\u8d56\u6027\u5f3a\u3001\u6613\u7126\u8651**\uff08\u9891\u7e41\u8be2\u95ee\u64cd\u4f5c\u7ec6\u8282\u3001\u62c5\u5fc3\u505a\u4e0d\u597d\u3001\u8bbe\u5907\u9009\u62e9\u7ea0\u7ed3\uff09\uff0c\u6297\u538b\u80fd\u529b\u4e00\u822c\uff0c\u9762\u5bf9\u6280\u672f\u56f0\u96be\u548c\u80b2\u513f\u538b\u529b\u65f6\u6613\u4ea7\u751f\u9000\u7f29\u60c5\u7eea\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u5df2\u652f\u4ed8\u8bfe\u7a0b\u8d39\u7528\uff0c\u5e76\u989d\u5916\u8d2d\u4e70\u4e86SE2200\u9ea6\u514b\u98ce\u3002**\u652f\u4ed8\u884c\u4e3a\u5df2\u53d1\u751f**\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u5bb6\u5ead\u652f\u6301\u5ea6\u5b58\u7591**\u3002\u7528\u6237\u63d0\u5230\u201c\u6211\u7238\u4e5f\u4e0d\u8ba9\uff0c\u4f46\u662f\u6211\u6ca1\u6709\u544a\u8bc9\u4ed6\u201d\uff0c\u4e14\u8d2d\u4e70\u8bbe\u5907\u65f6\u88ab\u8001\u516c\u8bf4\uff0c\u9009\u62e9\u201c\u5077\u6478\u6765\u201d\u3002\u663e\u793a\u5bb6\u5ead\uff08\u5c24\u5176\u7236\u8f88\u548c\u914d\u5076\uff09\u53ef\u80fd\u4e0d\u652f\u6301\u6216\u4e0d\u77e5\u60c5\uff0c\u51b3\u7b56\u5b58\u5728**\u5355\u65b9\u9762\u6027\u98ce\u9669**\u3002\n*   **\u6b65\u9aa42-4\u5224\u5b9a**\uff1a\u7efc\u5408\u4e09\u8f74\u4fe1\u53f7\uff1a\n    *   **\u52a8\u673a\uff08B\u7c7b\uff09**\uff1a\u6709\u53d8\u73b0\u671f\u671b\uff0c\u4f46\u88ab\u73b0\u5b9e\u6324\u538b\uff0c\u7eaf\u5ea6\u4e2d\u7b49\u3002\n    *   **\u8d44\u6e90\uff08C\u7c7b\uff09**\uff1a\u65f6\u95f4\u788e\u7247\u5316\u4e14\u88ab\u4e25\u91cd\u6324\u5360\uff0c\u7ecf\u6d4e\u6709\u538b\u529b\uff0c\u73af\u5883\u5e72\u6270\u5927\u3002\n    *   **\u5fc3\u7406\uff08C\u7c7b\uff09**\uff1a\u6613\u7126\u8651\u3001\u4f9d\u8d56\u6307\u5bfc\uff0c\u97e7\u6027\u4e00\u822c\u3002\n    *   **\u7efc\u5408\u5224\u5b9a**\uff1a**BCC\u578b\u7528\u6237**\u3002\u6709\u5b66\u4e60\u610f\u613f\u4f46\u627f\u8f7d\u538b\u529b\u5927\uff0c\u5c5e\u4e8e\u9ad8\u5173\u6000\u3001\u9ad8\u8ddf\u8fdb\u98ce\u9669\u7c7b\u522b\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**\uff1a**T5 \u8d1f\u91cd\u524d\u884c\u8005**\u3002\n    *   \u6838\u5fc3\u7279\u5f81\uff1a\u80cc\u8d1f\u5bb6\u5ead\u8d23\u4efb\uff08\u65b0\u624b\u5988\u5988\uff09\uff0c\u5728\u6709\u9650\u65f6\u95f4\u548c\u7cbe\u529b\u4e2d\u5bfb\u6c42\u7a81\u7834\uff0c\u52a8\u673a\u771f\u5b9e\u4f46\u6267\u884c\u963b\u529b\u5927\uff0c\u6613\u56e0\u5bb6\u5ead\u4e8b\u52a1\u4e2d\u65ad\u5b66\u4e60\uff0c\u9700\u8981\u5f3a\u60c5\u611f\u652f\u6301\u4e0e\u7075\u6d3b\u65b9\u6848\u3002\n    *   \u6b21\u8981\u7279\u5f81\uff1a\u517c\u6709T4\uff08\u8d44\u6e90\u532e\u4e4f\u8005\uff09\u7684\u65f6\u95f4\u7ecf\u6d4e\u538b\u529b\uff0c\u548cT6\uff08\u9ad8\u7126\u8651\u4ece\u4f17\u8005\uff09\u7684\u4f9d\u8d56\u4e0e\u7126\u8651\u611f\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\uff08\u98ce\u9669\u7b49\u7ea7\uff1a\u4e2d\uff09\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a\u4e2d\u98ce\u9669\u3002\u7528\u6237\u5df2\u611f\u77e5\u5b66\u4e60\u96be\u5ea6\uff08\u201c\u5e72\u97f3\u592a\u96be\u4e86\u201d\u3001\u201c\u4f5c\u4e1a\u597d\u51e0\u6b21\u6ca1\u505a\u201d\uff09\uff0c\u82e5\u77ed\u671f\u5185\u65e0\u6b63\u53cd\u9988\uff0c\u6613\u4ea7\u751f\u632b\u8d25\u611f\u3002\n    2.  **\u65f6\u95f4\u7cbe\u529b\u51b2\u7a81**\uff1a**\u9ad8\u98ce\u9669**\u3002**\u80b2\u513f\u662f\u5f53\u524d\u6700\u5927\u5e72\u6270\u6e90**\uff0c\u4e14\u65e0\u4eba\u5e2e\u5fd9\uff0c\u6301\u7eed\u6324\u5360\u5b66\u4e60\u65f6\u95f4\u3002\n    3.  **\u7ecf\u6d4e\u538b\u529b**\uff1a\u4e2d\u98ce\u9669\u3002\u5df2\u8868\u8fbe\u7ecf\u6d4e\u538b\u529b\uff0c\u5bf9\u540e\u7eed\u8bfe\u7a0b\uff08\u5982\u540e\u671f\u8bfe\uff09\u652f\u4ed8\u72b9\u8c6b\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u9ad8\u98ce\u9669**\u3002**\u5bb6\u5ead\u4e0d\u77e5\u60c5\u6216\u53cd\u5bf9\u662f\u91cd\u5927\u9690\u60a3**\uff0c\u53ef\u80fd\u6210\u4e3a\u9000\u8d39\u7684\u76f4\u63a5\u5bfc\u706b\u7d22\u3002\n    5.  **\u4ea7\u54c1\u670d\u52a1\u7455\u75b5**\uff1a\u4f4e\u98ce\u9669\u3002\u76ee\u524d\u5bf9\u73ed\u73ed\u670d\u52a1\u53cd\u9988\u79ef\u6781\u3002\n    6.  **\u7ade\u54c1/\u66ff\u4ee3\u65b9\u6848**\uff1a\u4f4e\u98ce\u9669\u3002\u672a\u63d0\u53ca\u3002\n    7.  **\u51b2\u52a8\u6d88\u8d39\u540e\u6094**\uff1a\u4f4e\u98ce\u9669\u3002\u7528\u6237\u6709\u6301\u7eed\u53c2\u4e0e\u884c\u4e3a\uff0c\u975e\u51b2\u52a8\u578b\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u9500\u552e\u884c\u4e3a**\uff1a\u9500\u552e\uff08\u5f3a\u54e5\uff09\u56de\u5e94\u57fa\u672c\u4e3a\u64cd\u4f5c\u6307\u5bfc\u4e0e\u5b89\u629a\uff0c\u672a\u53d1\u73b0\u8fc7\u5ea6\u627f\u8bfa\u3001\u865a\u5047\u5ba3\u4f20\u6216\u9ad8\u538b\u903c\u5355\u3002\u5728\u7528\u6237\u8868\u8fbe\u7ecf\u6d4e\u538b\u529b\u65f6\uff0c\u56de\u5e94\u201c\u7406\u89e3\u7684\uff0c\u5f53\u5988\u5988\u786e\u5b9e\u5f88\u8f9b\u82e6\u201d\uff0c\u6001\u5ea6\u5408\u7406\u3002\n*   **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a**\u672a\u4e3b\u52a8\u63a2\u67e5\u5e76\u786e\u8ba4\u5bb6\u5ead\u652f\u6301\u60c5\u51b5**\u3002\u5728\u7528\u6237\u900f\u9732\u201c\u6211\u7238\u4e5f\u4e0d\u8ba9\uff0c\u4f46\u662f\u6211\u6ca1\u6709\u544a\u8bc9\u4ed6\u201d\u65f6\uff0c\u9500\u552e\u672a\u8ddf\u8fdb\u6b64\u5173\u952e\u98ce\u9669\u4fe1\u53f7\uff0c\u5c5e\u4e8e**\u5bb6\u5ead\u77e5\u60c5\u6743\u6838\u67e5\u7f3a\u4f4d**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d**\uff1a**\u504f\u5dee**\u3002\u5f53\u524d\u6807\u51c6\u5316\u7684\u76f4\u64ad\u8bfe\u3001\u5bc6\u96c6\u4f5c\u4e1a\u6a21\u5f0f\u4e0e\u7528\u6237\u6781\u5ea6\u788e\u7247\u5316\u7684\u65f6\u95f4\u3001\u9ad8\u5e72\u6270\u73af\u5883\u4e25\u91cd\u4e0d\u5339\u914d\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**24h\u5185\u542f\u52a8\u5bb6\u5ead\u652f\u6301\u5ea6\u6c9f\u901a**\n*   **\u5177\u4f53\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u98ce\u9669\u5e72\u9884\uff08\u9996\u8981\uff09**\uff1a\u73ed\u4e3b\u4efb\u9700\u572824\u5c0f\u65f6\u5185\u4ee5\u5173\u6000\u65b9\u5f0f\uff0c\u6e29\u548c\u6838\u5b9e\u5bb6\u5ead\uff08\u7279\u522b\u662f\u914d\u5076\uff09\u5bf9\u5b66\u5458\u5b66\u4e60\u53ca\u6d88\u8d39\u7684\u77e5\u60c5\u4e0e\u652f\u6301\u7a0b\u5ea6\u3002**\u76ee\u6807\u662f\u4e89\u53d6\u5bb6\u5ead\u7406\u89e3\u6216\u81f3\u5c11\u77e5\u60c5\uff0c\u907f\u514d\u540e\u7eed\u56e0\u5bb6\u5ead\u77db\u76fe\u5f15\u53d1\u6fc0\u70c8\u6295\u8bc9**\u3002\n    2.  **\u9884\u671f\u7ba1\u7406**\uff1a\u660e\u786e\u544a\u77e5\u7528\u6237\uff0c\u4f5c\u4e3a\u65b0\u624b\u5988\u5988\uff0c\u5b66\u4e60\u8fdb\u5ea6\u53ef\u4ee5\u653e\u7f13\uff0c**\u5b8c\u6210\u6bd4\u5b8c\u7f8e\u66f4\u91cd\u8981**\u3002\u5e2e\u52a9\u5176\u8bbe\u5b9a\u6781\u4f4e\u3001\u53ef\u5b9e\u73b0\u7684\u5468\u76ee\u6807\uff08\u5982\u201c\u672c\u5468\u53ea\u542c1\u8282\u56de\u653e\u201d\uff09\u3002\n    3.  **\u670d\u52a1\u8c03\u6574**\uff1a\n        *   **\u65f6\u95f4\u652f\u6301**\uff1a\u63d0\u4f9b\u6240\u6709\u76f4\u64ad\u7684\u5f55\u64ad\u7cbe\u534e\u7247\u6bb5\uff08\u975e\u5168\u7a0b\uff09\uff0c\u5141\u8bb8\u5176\u7528\u201c\u4e24\u500d\u901f\u201d\u7b49\u65b9\u5f0f\u7075\u6d3b\u5b66\u4e60\u3002\n        *   **\u6280\u672f\u51cf\u8d1f**\uff1a\u7b80\u5316\u4f5c\u4e1a\u63d0\u4ea4\u8981\u6c42\uff0c\u5141\u8bb8\u5176\u63d0\u4ea4\u201c\u7ec3\u4e60\u7247\u6bb5\u201d\u800c\u975e\u5b8c\u6574\u4f5c\u4e1a\u3002\n        *   **\u60c5\u611f\u652f\u6301**\uff1a\u5b9a\u671f\u8fdb\u884c\u7b80\u77ed\u7684\u4e00\u5bf9\u4e00\u8bed\u97f3\u6c9f\u901a\uff0c\u7ed9\u4e88\u9f13\u52b1\uff0c\u91cd\u70b9\u8868\u626c\u5176\u201c\u575a\u6301\u201d\u800c\u975e\u201c\u6210\u679c\u201d\u3002\n    4.  **\u8f6c\u5316\u8c28\u614e**\uff1a\u5728\u5bb6\u5ead\u652f\u6301\u95ee\u9898\u672a\u89e3\u51b3\u3001\u7528\u6237\u65f6\u95f4\u672a\u89c1\u6539\u5584\u524d\uff0c**\u6682\u505c\u4efb\u4f55\u540e\u7eed\u8bfe\u7a0b\uff08\u5982\u540e\u671f\u8bfe\uff09\u7684\u9500\u552e\u63a8\u8350**\uff0c\u907f\u514d\u52a0\u91cd\u5176\u7ecf\u6d4e\u548c\u5fc3\u7406\u8d1f\u62c5\u3002\n\n{\"core_type\": \"T5 \u8d1f\u91cd\u524d\u884c\u8005\", \"risk_level\": \"\u4e2d\"
