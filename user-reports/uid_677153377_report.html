        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u859b\u6674 (UID: 677153377) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u7f8e\u4eba\u5fd7(\u4f55\u5a1f)\u3001\u6d1b\u5947\u6eaa\u5802(\u5f20\u723d) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u64ad\u6709\u58f0\u4e66\u9ad8\u9636\u7cfb\u7edf\u8bfe |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u4ef7\u683c\u3001\u8d44\u91d1\u6765\u6e90\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u4ec5\u77e5\u7528\u6237\u4e0b\u5348\u548c\u665a\u4e0a\u6709\u8bfe\uff0c\u4f46\u672a\u8bf4\u660e\u5de5\u4f5c/\u751f\u6d3b\u72b6\u6001\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u4fe1\u606f\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u804a\u5929\u8bb0\u5f55\u96c6\u4e2d\u4e8e\u5b66\u4e60\u6307\u5bfc\u548c\u4efb\u52a1\u8ddf\u8fdb\uff0c\u7f3a\u4e4f\u5173\u4e8e\u7528\u6237\u80cc\u666f\u3001\u7ecf\u6d4e\u72b6\u51b5\u3001\u5bb6\u5ead\u3001\u65f6\u95f4\u5b89\u6392\u7b49\u5173\u952e\u5206\u5c42\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u27a1\u4e2d\n- **\u7279\u5f81\u901f\u5199**\uff1a\u80fd\u529b\u5174\u8da3\u4e0e\u53d8\u73b0\u671f\u671b\u6df7\u5408\u3002\u5bf9\u6709\u58f0\u6f14\u64ad\u672c\u8eab\uff08\u5982\u53e4\u98ce\u3001\u56fd\u5b66\uff09\u8868\u73b0\u51fa\u5174\u8da3\uff0c\u4f46\u540c\u65f6\u4e5f\u5173\u6ce8\u517c\u804c\u5c97\u4f4d\u548c\u53d8\u73b0\u65b9\u5f0f\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u89c9\u5f97\u5e08\u59d0\u8bf4\u7684\u8fd9\u4e2a\u53e4\u4ee3\u7c7b\u578b\u7684\uff0c\u8fd8\u6709\u504f\u9752\u5c11\u5e74\u56fd\u5b66\u6587\u5316\u7684\uff0c\u8fd9\u4e9b\u6211\u90fd\u8fd8\u633a\u559c\u6b22\u7684\u201d\n  > \u201c\u5bf9\u753b\u672c\u6bd4\u8f83\u611f\u5174\u8da3\u201d\uff08\u753b\u672c\u4e3a\u5267\u7ec4\u517c\u804c\u5c97\u4f4d\u4e4b\u4e00\uff09\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u26a0\ufe0f \u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u8bc4\u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u65e0\u4efb\u4f55\u5173\u4e8e\u652f\u4ed8\u80fd\u529b\u3001\u7ecf\u6d4e\u72b6\u51b5\u7684\u8ba8\u8bba\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u4ec5\u77e5\u201c\u4e0b\u5348\u548c\u665a\u4e0a\u6709\u8bfe\u201d\uff0c\u65e0\u6cd5\u5224\u65ad\u5de5\u4f5c\u5236\u5ea6\u3001\u5bb6\u5ead\u8d1f\u8377\u3001\u56fa\u5b9a\u5b66\u4e60\u65f6\u95f4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u9500\u552e\u66fe\u95ee\u201c\u4f1a\u6709\u5bb6\u4eba\u4e0d\u7406\u89e3\u4e0d\u652f\u6301\u5417\uff1f\u201d\uff0c\u7528\u6237\u56de\u7b54\u201c2\u6ca1\u6709\u51b2\u7a81\u201d\uff0c\u4f46\u6b64\u56de\u7b54\u8fc7\u4e8e\u7b3c\u7edf\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u201c\u5bb6\u4eba\u77e5\u60c5\u652f\u6301\u201d\u8fd8\u662f\u201c\u5355\u8eab\u72ec\u7acb\u201d\u3002**\u6b64\u4e3a\u9ad8\u98ce\u9669\u4fe1\u606f\u76f2\u533a\u3002**\n- **\u5e95\u5ea7\u53d6\u77ed\u677f**\uff1a**\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\uff0c\u6682\u6309\u201c\u4e2d\u201d\u8bc4\u7ea7\u5904\u7406\uff0c\u4f46**\u7f6e\u4fe1\u5ea6\u6781\u4f4e**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9762\u5bf9\u9500\u552e\u7ec6\u81f4\u7684\u4f5c\u4e1a\u70b9\u8bc4\u548c\u6307\u5bfc\uff0c\u7528\u6237\u5168\u7a0b\u6001\u5ea6\u79ef\u6781\u3001\u914d\u5408\u5ea6\u9ad8\uff0c\u65e0\u4efb\u4f55\u8d1f\u9762\u60c5\u7eea\u6216\u4f9d\u8d56\u5b89\u629a\u7684\u8ff9\u8c61\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u597d\u7684\u5e08\u59d0\u201d\u3001\u201c\u6709\u4fe1\u5fc3\u7684\uff0c\u5e08\u59d0\u201d\u3001\u201c\u597d\u7684\uff0c\u5e08\u59d0\uff0c\u8c22\u8c22\u4f60\u201d\u3002\u5168\u7a0b\u56de\u590d\u7b80\u6d01\u3001\u6b63\u5411\uff0c\u65e0\u62b1\u6028\u3001\u7126\u8651\u6216\u81ea\u6211\u6000\u7591\u7684\u8868\u8fbe\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 (\u6e34\u671b\u8ba4\u53ef\u4e0e\u8bc1\u660e)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u7528\u6237\u8868\u8fbe\u201c\u6211\u8981\u6539\u53d8\u201d\uff0c\u5e76\u9009\u62e9\u201c\u5b58\u70b9\u94b1\u5b9e\u73b0\u81ea\u5df1\u7684\u5c0f\u76ee\u6807\u201d\u4f5c\u4e3a\u6536\u5165\u7528\u9014\u3002\u8fd9\u900f\u9732\u51fa\u4e00\u79cd\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u65b0\u6280\u80fd\u3001\u83b7\u5f97\u7ecf\u6d4e\u6536\u76ca\u6765**\u8bc1\u660e\u81ea\u6211\u4ef7\u503c\u3001\u5b9e\u73b0\u4e2a\u4eba\u5c0f\u76ee\u6807**\u7684\u6e34\u671b\uff0c\u800c\u975e\u7eaf\u7cb9\u7684\u751f\u5b58\u7126\u8651\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u5938\u5956\u80af\u5b9a\u4e0e\u9636\u6bb5\u6027\u6210\u5c31\u8ba4\u53ef**\u3002\u7528\u6237\u5bf9\u9500\u552e\u201c\u770b\u597d\u4f60\u201d\u3001\u201c\u8fdb\u6b65\u5f88\u5927\u201d\u7b49\u6b63\u9762\u53cd\u9988\u63a5\u53d7\u826f\u597d\uff0c\u9700\u8981\u6301\u7eed\u7684\u6b63\u5411\u6fc0\u52b1\u6765\u5f3a\u5316\u5176\u201c\u6211\u80fd\u884c\u201d\u7684\u4fe1\u5ff5\uff0c\u6ee1\u8db3\u5176\u88ab\u5c0a\u91cd\u548c\u8ba4\u53ef\u7684\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b (\u6210\u957f\u6295\u8d44\u578b)** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u914d\u5408\u5ea6\u9ad8\uff0c\u884c\u52a8\u529b\u5f3a\uff0c\u9ed8\u9ed8\u5b8c\u6210\u4efb\u52a1\uff0c\u8ffd\u6c42\u5b9e\u9645\u6280\u80fd\u63d0\u5347) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | **\u4fe1\u606f\u7f3a\u5931\u662f\u6700\u5927\u98ce\u9669**\u3002\u82e5\u5b9e\u9645\u5b58\u5728\u5bb6\u4eba\u53cd\u5bf9\u6216\u8d44\u91d1\u9690\u7792\uff0c\u98ce\u9669\u6781\u9ad8\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u82e5\u5176\u201c\u4e0b\u5348\u548c\u665a\u4e0a\u6709\u8bfe\u201d\u610f\u5473\u7740\u5012\u73ed\u6216\u9ad8\u5f3a\u5ea6\u5de5\u4f5c\uff0c\u53ef\u80fd\u5bfc\u81f4\u65e0\u6cd5\u8ddf\u4e0a\u76f4\u64ad\u548c\u4f5c\u4e1a\u8fdb\u5ea6\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u76ee\u524d\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u914d\u5408\u5ea6\u597d\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u52a8\u673a\u7eaf\u5ea6\u4e2d\u7b49\uff0c\u5305\u542b\u53d8\u73b0\u671f\u671b\u3002\u82e5\u5b66\u4e60\u521d\u671f\u672a\u83b7\u5f97\u9884\u671f\u4e2d\u7684\u517c\u804c\u673a\u4f1a\u6216\u6b63\u5411\u53cd\u9988\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe\u540e2-4\u5468\uff0c\u5f53\u8bfe\u7a0b\u96be\u5ea6\u63d0\u5347\u3001\u4f5c\u4e1a\u91cf\u52a0\u5927\uff0c\u540c\u65f6\u517c\u804c\u53d8\u73b0\u672a\u8fbe\u9884\u671f\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u859b\u6674\uff0c\u606d\u559c\u4f60\u6b63\u5f0f\u52a0\u5165\uff01\u6211\u770b\u5230\u4f60\u5728\u4f53\u9a8c\u8425\u7279\u522b\u8ba4\u771f\uff0c\u4f5c\u4e1a\u5b8c\u6210\u5f97\u53c8\u5feb\u53c8\u597d\uff0c\u5c24\u5176\u662f\u5bf9\u53e4\u98ce\u548c\u56fd\u5b66\u65b9\u5411\u6709\u81ea\u5df1\u7684\u60f3\u6cd5\uff0c\u8fd9\u975e\u5e38\u68d2\u3002\u63a5\u4e0b\u6765\u7684\u7cfb\u7edf\u8bfe\uff0c\u6211\u4eec\u4f1a\u4e00\u6b65\u6b65\u5e2e\u4f60\u628a\u5174\u8da3\u53d8\u6210\u624e\u5b9e\u7684\u80fd\u529b\uff0c\u8ba9\u4f60\u4e0d\u4ec5\u80fd\u5f55\u51fa\u81ea\u5df1\u559c\u6b22\u7684\u4f5c\u54c1\uff0c\u66f4\u80fd\u83b7\u5f97\u5b9e\u5b9e\u5728\u5728\u7684\u6210\u957f\u548c\u8ba4\u53ef\u3002\u6709\u4efb\u4f55\u9700\u8981\u8c03\u6574\u8282\u594f\u7684\u5730\u65b9\uff0c\u968f\u65f6\u8ddf\u6211\u6c9f\u901a\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u3002\u5339\u914d\u5176T2\u5b9e\u5e72\u578b\u7279\u8d28\uff0c\u63d0\u4f9b\u6e05\u6670\u3001\u7cfb\u7edf\u7684\u6280\u80fd\u8fdb\u9636\u8def\u5f84\u548c\u5b9e\u64cd\u9879\u76ee\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u7b2c\u56db\u5c42\uff08\u5c0a\u91cd\uff09\u9700\u6c42\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010**\u6210\u5c31\u8ba4\u53ef\u4e0e\u5c55\u793a\u5305**\u3011\uff0c\u5982\uff1a\u5b9a\u671f\u4f5c\u54c1\u70b9\u8bc4\u3001\u4f18\u79c0\u4f5c\u4e1a\u5c55\u793a\u3001\u9636\u6bb5\u6027\u80fd\u529b\u8ba4\u8bc1\u5fbd\u7ae0\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u8fc7\u5ea6\u627f\u8bfa\u77ed\u671f\u9ad8\u989d\u53d8\u73b0\uff0c\u7834\u574f\u5176\u957f\u671f\u6210\u957f\u9884\u671f\u30022. \u5ffd\u89c6\u5176\u65f6\u95f4\u5b89\u6392\uff0c\u5f3a\u5236\u8981\u6c42\u5728\u4e0d\u5408\u7406\u65f6\u6bb5\u53c2\u4e0e\u76f4\u64ad\u6216\u63d0\u4ea4\u4f5c\u4e1a\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u5728**\u672a\u6478\u6e05\u5176\u771f\u5b9e\u8d44\u91d1\u72b6\u51b5\u548c\u5bb6\u5ead\u652f\u6301\u5ea6\u524d\uff0c\u4e25\u7981\u4efb\u4f55\u5347\u5355\u884c\u4e3a**\u3002\u5f53\u524d\u4fe1\u606f\u7f3a\u5931\uff0c\u98ce\u9669\u672a\u77e5\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u89c9\u5f97\u5e08\u59d0\u8bf4\u7684\u8fd9\u4e2a\u53e4\u4ee3\u7c7b\u578b\u7684\uff0c\u8fd8\u6709\u504f\u9752\u5c11\u5e74\u56fd\u5b66\u6587\u5316\u7684\uff0c\u8fd9\u4e9b\u6211\u90fd\u8fd8\u633a\u559c\u6b22\u7684\u201d **(\u5174\u8da3\u9a71\u52a8\u8bc1\u636e)**\n2. > \u201c\u6211\u8981\u6539\u53d8\u201d **(\u81ea\u6211\u63d0\u5347\u4e0e\u8bc1\u660e\u52a8\u673a)**\n3. > \u201c1B2\u6ca1\u6709\u51b2\u7a813\u5df2\u7ecf\u5f00\u59cb\u884c\u52a84B\u201d **(\u65f6\u95f4\u6295\u5165\u610f\u613f\u4e0e\u76ee\u6807\u5bfc\u5411\uff1a\u5b58\u94b1\u5b9e\u73b0\u5c0f\u76ee\u6807)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2\u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u5c0a\u91cd\u4e0e\u8bc1\u660e\u81ea\u6211\u4ef7\u503c**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u7acb\u5373\u8fdb\u884c\u6df1\u5ea6\u4fe1\u606f\u8865\u5168\uff08\u7279\u522b\u662f\u5bb6\u5ead\u652f\u6301\u4e0e\u771f\u5b9e\u65f6\u95f4\uff09\uff0c\u5e76\u5339\u914d\u201c\u786c\u6838\u5b9e\u5e72+\u6210\u5c31\u8ba4\u53ef\u201d\u7684\u670d\u52a1\u7ec4\u5408\uff0c\u4e25\u7981\u76f2\u76ee\u5347\u5355**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"maslow_need\": \"\u7b2c\u56db\u5c42\u5c0a\u91cd\u9700\u6c42\", \"risk_level\": \"\u4e2d\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u6210\u5c31\u8ba4\u53ef\u4e0e\u5c55\u793a\u5305\"}\n```";
