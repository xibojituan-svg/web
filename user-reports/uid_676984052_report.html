        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676984052 (\u6635\u79f0\uff1a\u9646\u997c\u5b50) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-25 \u81f3 2026-04-05 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u8d85\u4eba\u6897\u54e5(\u803f\u4e1a\u4e1c)\u3001\u552e\u540e-\u795d\u6625 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u6f14\u64ad\u8bfe\u7a0b (\u542bsE2200\u5f55\u97f3\u8bbe\u5907) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u7f3a\u5931** (\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u9700\u8b66\u60d5) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u9ad8\u5bbd\u88d5** (\u6709\u5e74\u5047\uff0c\u80fd\u51cc\u66684-5\u70b9\u5f55\u97f3\uff0c\u5468\u672b\u56de\u57ce\uff0c\u65f6\u95f4\u81ea\u4e3b\u5ea6\u9ad8) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** (\u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\uff0c\u9700\u8b66\u60d5) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** (\u5b66\u4e60\u4e92\u52a8\u3001\u751f\u6d3b\u5206\u4eab\u3001\u793e\u7fa4\u4ea4\u6d41\u5747\u4e30\u5bcc) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u2b06\u9ad8]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u5173\u6ce8\u6280\u80fd\u7cbe\u8fdb\uff0c\u6709\u957f\u671f\u5b66\u4e60\u9884\u671f\uff0c\u65e0\u77ed\u671f\u53d8\u73b0\u538b\u529b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u6709\u4e00\u672c\u513f\u7ae5\u8bfb\u7269\uff0c\u6211\u6253\u7b97\u5f55\u7ed9\u5916\u7525\u5973\u3002\u201d > \u201c\u6211\u6700\u8fd1\u5c31\u662f\u5728\u78e8\u90a3\u4e2a\u524d\u540e\u9f3b\u97f3\uff0c\u78e8\u6b7b\u6211\u4e86\uff0c\u6211\u4f1a\u7ee7\u7eed\u52a0\u6cb9\u7684\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b06\u9ad8]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[**\u4e2d**] \u2014 \u8d2d\u4e70\u4e86\u4e13\u4e1a\u5f55\u97f3\u8bbe\u5907\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u652f\u4ed8\u65b9\u5f0f\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u5403\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[**\u9ad8**] \u2014 \u65f6\u95f4\u9ad8\u5ea6\u81ea\u4e3b\uff0c\u80fd\u51cc\u6668\u5f55\u97f3\u3001\u5468\u672b\u8865\u8bfe\u3001\u53c2\u4e0e\u793e\u7fa4\u4e92\u52a8\uff0c\u7cbe\u529b\u5145\u6c9b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[**\u4fe1\u606f\u7f3a\u5931**] \u2014 **\u5173\u952e\u98ce\u9669\u70b9**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u4eba\uff0c\u5b58\u5728\u201c\u9690\u7792\u5077\u62a5\u201d\u6216\u201c\u5355\u8eab\u72ec\u7acb\u201d\u4e24\u79cd\u53ef\u80fd\uff0c\u9700\u6838\u5b9e\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\uff0c\u79ef\u6781\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u60c5\u7eea\u7a33\u5b9a\u4e14\u4e50\u4e8e\u52a9\u4eba\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u51cc\u6668\u5f55\u7684\uff0c\u9e1f\u8d77\u5e8a\u4e4b\u524d\uff0c\u73ed\u73ed\u4f60\u770b\u4e0b\uff0c\u662f\u4e0d\u662f\u4f1a\u597d\u4e00\u70b9\u3002\u201d (\u9047\u5230\u5e95\u566a\u95ee\u9898\u4e3b\u52a8\u8c03\u6574\u65f6\u95f4\u89e3\u51b3) > \u201c\u600e\u4e48\u90fd\u5f55\u4e0d\u597d[\u6d41\u6cea]...\u591a\u7ec3\u4e60\u5c31\u884c\u3002\u201d (\u77ed\u6682\u60c5\u7eea\u6ce2\u52a8\u540e\u8fc5\u901f\u81ea\u6211\u8c03\u8282\u5e76\u63a5\u53d7\u5efa\u8bae)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 (\u5f52\u5c5e\u4e0e\u6210\u5c31)** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5728\u4e13\u4e1a\u793e\u7fa4\u4e2d\u5bfb\u6c42**\u8ba4\u53ef\u4e0e\u4ef7\u503c\u611f**\u3002\u5979\u79ef\u6781\u70b9\u8bc4\u540c\u5b66\u3001\u5206\u4eab\u5b66\u4e60\u65b9\u6cd5\u3001\u6e34\u671b\u6280\u672f\u8fdb\u6b65\uff08\u5982\u559c\u9a6c\u62c9\u96c5\u7b49\u7ea7\u63d0\u5347\uff09\uff0c\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u83b7\u5f97\u201c\u4e13\u4e1a\u8eab\u4efd\u201d\u7684\u8ba4\u540c\u548c\u5708\u5c42\u5185\u7684\u5c0a\u91cd\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u8d4b\u4e88\u5176\u201c\u4e13\u5bb6\u201d\u6216\u201c\u52a9\u6559\u201d\u8eab\u4efd**\uff0c\u8ba9\u5979\u5728\u793e\u7fa4\u4e2d\u83b7\u5f97\u6743\u5a01\u611f\u548c\u88ab\u9700\u8981\u611f\uff0c\u6ee1\u8db3\u5176\u5c0a\u91cd\u4e0e\u5f52\u5c5e\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\u2b50A \u7c7b** (\u9ad8\u52a8\u673a\u3001\u9ad8\u8d44\u6e90\u3001\u9ad8\u5f39\u6027\uff0c\u6838\u5fc3\u4ef7\u503c\u7528\u6237) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u517c\u987e\u90e8\u5206T1\u9886\u8896\u7279\u8d28) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a[\u65e0]\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | **\u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u4e3a\u6700\u5927\u98ce\u9669\u70b9**\u3002\u82e5\u4e3a\u9690\u7792\u5bb6\u4eba\u62a5\u540d\uff0c\u4e00\u65e6\u66b4\u9732\u53ef\u80fd\u5f15\u53d1\u5f3a\u70c8\u51b2\u7a81\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u65f6\u95f4\u5145\u88d5\uff0c\u5b66\u4e60\u81ea\u4e3b\u6027\u5f3a\uff0c\u5d29\u76d8\u98ce\u9669\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u5230\u95ee\u9898\u4e3b\u52a8\u89e3\u51b3\uff0c\u4e0d\u6613\u7834\u9632\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4f4e** | \u52a8\u673a\u7eaf\u4e3a\u6280\u80fd\u63d0\u5347\u548c\u5174\u8da3\uff0c\u5bf9\u77ed\u671f\u53d8\u73b0\u65e0\u5f3a\u8bc9\u6c42\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e1\u4e2a\u6708\u5185**\u3002\u82e5**\u5bb6\u5ead\u53cd\u5bf9**\u95ee\u9898\u7206\u53d1\uff0c\u5c06\u5728\u6b64\u9636\u6bb5\u96c6\u4e2d\u663e\u73b0\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u997c\u5b50\uff0c\u770b\u4e86\u4f60\u5728\u7fa4\u91cc\u7684\u4e92\u52a8\uff0c\u611f\u89c9\u4f60\u7279\u522b\u70ed\u5fc3\uff0c\u53d1\u97f3\u6280\u5de7\u4e5f\u94bb\u7814\u5f97\u5f88\u6df1\u3002\u4ee5\u540e\u73ed\u91cc\u7684\u2018\u524d\u540e\u9f3b\u97f3\u7ea0\u97f3\u5c0f\u7ec4\u2019\u5c31\u4ea4\u7ed9\u4f60\u6765\u5e26\u597d\u4e0d\u597d\uff1f\u4f60\u7684\u7ecf\u9a8c\u5bf9\u540c\u5b66\u4eec\u7279\u522b\u6709\u5e2e\u52a9\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011+\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf**\u3011\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743**\u3011(\u6ee1\u8db3\u5176\u94bb\u7814\u9700\u6c42)\u3001\u3010**\u73ed\u59d4/\u5c0f\u7ec4\u957f\u4efb\u547d**\u3011(\u6ee1\u8db3\u5176\u5c0a\u91cd\u4e0e\u5f52\u5c5e\u9700\u6c42)\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5c06\u5176\u89c6\u4e3a\u666e\u901a\u5b66\u5458\u8fdb\u884c\u673a\u68b0\u5316\u7ba1\u7406\u3002\u4e0d\u8981\u5ffd\u89c6\u5176\u8f93\u51fa\u4ef7\u503c\u3001\u8d21\u732e\u611f\u7684\u6e34\u671b\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u8fdb\u884c\u5927\u989d\u9ad8\u9636\u8bfe\u7a0b\u63a8\u4ecb\uff08\u5982\u5927\u5e08\u73ed\u3001\u540e\u671f\u5236\u4f5c\u8bfe\uff09\uff0c\u56e0\u5176\u6709\u5f3a\u70c8\u5b66\u4e60\u7eb5\u6df1\u9700\u6c42\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u6700\u8fd1\u5c31\u662f\u5728\u78e8\u90a3\u4e2a\u524d\u540e\u9f3b\u97f3\uff0c\uff0c\u78e8\u6b7b\u6211\u4e86\uff0c\u6211\u4f1a\u7ee7\u7eed\u52a0\u6cb9\u7684\uff0c\u8c22\u8c22\u54e6\u3002\u201d **(\u9ad8\u52a8\u673a\u7eaf\u5ea6\uff0c\u6b7b\u78d5\u7cbe\u795e)**\n2. > \u201c\u51cc\u6668\u5f55\u7684\uff0c\u9e1f\u8d77\u5e8a\u4e4b\u524d\uff0c\u73ed\u73ed\u4f60\u770b\u4e0b\uff0c\u662f\u4e0d\u662f\u4f1a\u597d\u4e00\u70b9\u3002\u201d **(\u9ad8\u5fc3\u7406\u5f39\u6027\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898)**\n3. > \u201c\u5bf9\u4e86\uff0c\u5927\u5bb6\u4eca\u5929\u53bb\u559c\u9a6c\u62c9\u96c5\u770b\uff0c\u7b49\u7ea7\u5347\u4e86\u5417\uff1f\uff0c\u4e0a\u6b21\u73ed\u73ed\u5f00\u4f1a\uff0c\u6211\u8fd8\u57281\uff0c\u4eca\u5929\u5347\u4e86\u201d **(\u5c0a\u91cd\u9700\u6c42\uff0c\u8ffd\u6c42\u6210\u5c31\u4e0e\u8ba4\u53ef)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2\u4f4e\u8c03\u5b9e\u5e72\u578b\uff08\u6f5c\u529b\u9886\u8896\uff09\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u4e13\u4e1a\u5708\u5c42\u4e2d\u83b7\u5f97\u5c0a\u91cd\u3001\u8ba4\u53ef\u4e0e\u4ef7\u503c\u5f52\u5c5e\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u4f46\u5b58\u5728 **\u3010\u5bb6\u5ead\u77e5\u60c5\u6743\u3011\u8fd9\u4e00\u9690\u853d\u9ad8\u98ce\u9669\u9879**\u3002\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u8d4b\u4e88\u5176\u793e\u7fa4\u5185\u201c\u4e13\u5bb6\u201d\u6216\u201c\u7ba1\u7406\u8005\u201d\u8eab\u4efd\uff0c\u7528\u8363\u8a89\u611f\u7ed1\u5b9a\uff0c\u5e76\u79c1\u4e0b\u6e29\u548c\u6838\u5b9e\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"maslow_need\": \"\u7b2c\u56db\u5c42\u5c0a\u91cd\u9700\u6c42\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\"}\n```";
