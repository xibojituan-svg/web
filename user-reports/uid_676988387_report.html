    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | 676988387 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-27 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u552e\u540e\u5c0f\u742a\u3001\u6c90\u7efe\u83c0(\u5f20\u5a49\u94b0)\u3001\u4e00\u51e1\u725b\u725b(\u738b\u5c11\u5a1c) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3** |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u663e\u793a\u6709\u5b69\u5b50\uff08\u201c\u8bad\u5b69\u5b50\u201d\uff09\uff0c\u8868\u660e\u6709\u5bb6\u5ead\u8d23\u4efb\uff0c\u4f46\u5177\u4f53\u65f6\u95f4\u5b89\u6392\u672a\u77e5\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u6709\u5927\u91cf\u6280\u672f\u64cd\u4f5c\u3001\u5b66\u4e60\u8fdb\u5ea6\u548c\u793e\u7fa4\u4e92\u52a8\u8bb0\u5f55\uff0c\u4f46\u7f3a\u4e4f\u652f\u4ed8\u3001\u5bb6\u5ead\u3001\u804c\u4e1a\u7b49\u5173\u952e\u80cc\u666f\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6280\u80fd\u5b66\u4e60\u7684\u6d53\u539a\u5174\u8da3\u548c\u6295\u5165\uff0c\u4e3b\u52a8\u53c2\u4e0e\u793e\u7fa4\u4efb\u52a1\u3001\u8bf7\u6559\u6280\u672f\u95ee\u9898\u3001\u5bf9\u6bd4\u8bbe\u5907\u4f53\u9a8c\u3002\u867d\u6709\u53d8\u73b0\u6f5c\u529b\uff08\u5982\u5173\u6ce8\u201c\u753b\u672c\u5c97\u201d\uff09\uff0c\u4f46\u5f53\u524d\u9a71\u52a8\u66f4\u504f\u5411\u4e8e**\u80fd\u529b\u63d0\u5347\u3001\u5174\u8da3\u63a2\u7d22\u548c\u793e\u7fa4\u53c2\u4e0e**\uff0c\u800c\u975e\u77ed\u671f\u6781\u901f\u53d8\u73b0\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u89c9\u5f97\u8fd9\u5957\u8bbe\u5907\u7528\u8d77\u6765\u8fd8\u633a\u559c\u6b22\u7684\uff0c\u8ba9\u6211\u633a\u653e\u677e\u7684\uff0c\u751a\u81f3\u80fd\u53d1\u73b0\u81ea\u5df1\u7684\u5b57\u97f3\u53d1\u7684\u4e0d\u5bf9\u3002\u4e4b\u524d\u5728\u68a8\u82b1\u4e70\u4e86\u4e24\u5957\uff0c\u7528\u7684\u6211\u8d85\u7ea7\u7d27\u5f20\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u652f\u4ed8\u538b\u529b\u6216\u7ecf\u6d4e\u72b6\u51b5\uff0c\u4f46\u8d2d\u4e70\u8fc7\u5176\u4ed6\u673a\u6784\u8bfe\u7a0b\uff08\u68a8\u82b1\uff09\uff0c\u8868\u660e\u6709\u4e00\u5b9a\u6d88\u8d39\u80fd\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d**\u3002\u7528\u6237\u80fd\u6295\u5165\u65f6\u95f4\u5b66\u4e60\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u5c0f\u7ec4\u4efb\u52a1\uff08\u5982\u9886\u7ae0\u8282\u3001\u642d\u97f3\uff09\uff0c\u5e76\u6df1\u591c\uff0822:57\uff09\u4ecd\u5728\u5b66\u4e60/\u56de\u653e\u8bfe\u7a0b\u3002\u4f46\u9700\u517c\u987e\u5bb6\u5ead\uff08\u6709\u5b69\u5b50\uff09\uff0c\u65f6\u95f4\u53ef\u80fd\u88ab\u788e\u7247\u5316\u5206\u5272\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u4eba\u652f\u6301\u6216\u53cd\u5bf9\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3**\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08AU\u64cd\u4f5c\u3001\u5e95\u566a\u3001\u8bbe\u5907\u8bbe\u7f6e\uff09\u65f6\uff0c\u80fd\u4e3b\u52a8\u3001\u5177\u4f53\u5730\u63d0\u95ee\uff0c\u5e76\u5c1d\u8bd5\u7406\u89e3\u539f\u7406\uff08\u201c\u5bf9\u8f68\u8be5\u600e\u4e48\u64cd\u4f5c\u201d\uff09\u3002\u867d\u6709\u81ea\u6211\u6000\u7591\uff08\u201c\u58f0\u97f3\u548b\u8fd9\u4e48\u7c97\u201d\uff09\uff0c\u4f46\u80fd\u63a5\u53d7\u6307\u5bfc\u5e76\u6301\u7eed\u7ec3\u4e60\uff0c\u672a\u51fa\u73b0\u60c5\u7eea\u5d29\u6e83\u6216\u62b1\u6028\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u73ed\u73ed\uff0c\u6211\u5728\u9009\u62e9\u964d\u566a\u65f6\uff0c\u6ca1\u9009\u597d\u6837\u672c\uff0c\u60f3\u64a4\u56de\uff0c\u4e0d\u77e5\u9053\u8be5\u600e\u4e48\u64cd\u4f5c\u201d (\u9047\u5230\u95ee\u9898\uff0c\u76f4\u63a5\u5bfb\u6c42\u5177\u4f53\u89e3\u51b3\u65b9\u6848)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u81ea\u6211\u58f0\u97f3\u8868\u73b0\u7684\u4e0d\u81ea\u4fe1\uff08\u201c\u58f0\u97f3\u542c\u4e0a\u53bb\u5f88\u7c97\u5f88\u5927\u201d\uff09\uff0c\u4ee5\u53ca\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u201c\u786c\u6838\u624b\u827a\u201d\uff08\u6709\u58f0\u6f14\u64ad\u3001\u753b\u672c\u5206\u6790\uff09\u6765\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u548c\u793e\u7fa4\u4e2d\u7684\u4ef7\u503c\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u8d4b\u80fd**\u3002\u80af\u5b9a\u5979\u7684\u5b66\u4e60\u6001\u5ea6\u3001\u6280\u672f\u8fdb\u6b65\u7684\u7ec6\u8282\uff0c\u5e76\u8d4b\u4e88\u5979\u5728\u5b66\u4e60\u793e\u7fa4\u4e2d\u7684\u89d2\u8272\u548c\u8d23\u4efb\uff08\u5982\u4e3b\u52a8\u627f\u62c5\u5c0f\u7ec4\u4efb\u52a1\uff09\uff0c\u6ee1\u8db3\u5176\u88ab\u5c0a\u91cd\u548c\u5b9e\u73b0\u6f5c\u80fd\u7684\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 **B\u7c7b** (\u9ad8\u6f5c\u529b\u3001\u9ad8\u4e92\u52a8\u3001\u9700\u5f15\u5bfc\u7684\u4f18\u8d28\u5b66\u5458) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u6709\u5bb6\u5ead\uff08\u5b69\u5b50\uff09\uff0c\u82e5\u5b66\u4e60\u4e25\u91cd\u6324\u5360\u5bb6\u5ead\u65f6\u95f4\u6216\u4ea7\u751f\u989d\u5916\u6d88\u8d39\u53ef\u80fd\u5f15\u53d1\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u7528\u6237\u5b66\u4e60\u4e3b\u52a8\u6027\u9ad8\uff0c\u80fd\u5229\u7528\u788e\u7247\u65f6\u95f4\u8ddf\u8fdb\u3002\u4e3b\u8981\u98ce\u9669\u5728\u4e8e\u6280\u672f\u96be\u9898\u5806\u79ef\uff08\u5982\u6301\u7eed\u65e0\u6cd5\u89e3\u51b3\u5e95\u566a\u3001AU\u64cd\u4f5c\uff09\u5bfc\u81f4\u632b\u8d25\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u5230\u95ee\u9898\u4e3b\u52a8\u6c42\u89e3\uff0c\u975e\u60c5\u7eea\u5316\u62b1\u6028\u578b\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u867d\u7136\u5f53\u524d\u52a8\u673a\u975e\u7eaf\u53d8\u73b0\uff0c\u4f46\u82e5\u8bfe\u7a0b\u540e\u671f\u65e0\u6cd5\u63d0\u4f9b\u6e05\u6670\u7684\u6280\u80fd\u8fdb\u9636\u8def\u5f84\u6216\u5b9e\u8df5\u673a\u4f1a\uff08\u5982\u63a5\u5355\u3001\u753b\u672c\u5c97\uff09\uff0c\u53ef\u80fd\u4ea7\u751f\u4ef7\u503c\u6000\u7591\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u8bfe\u7a0b\u4e2d\u540e\u671f\uff08\u7b2c4-6\u5468\uff09**\u3002\u5f53\u57fa\u7840\u6280\u80fd\u5b66\u4e60\u5b8c\u6bd5\uff0c\u8fdb\u5165\u66f4\u590d\u6742\u7684\u5b9e\u6218\u6216\u63a5\u5355\u73af\u8282\u65f6\uff0c\u82e5\u611f\u89c9\u201c\u5b66\u65e0\u6240\u7528\u201d\u6216\u9047\u5230\u96be\u4ee5\u903e\u8d8a\u7684\u6280\u672f\u74f6\u9888\uff0c\u53ef\u80fd\u4ea7\u751f\u52a8\u6447\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u770b\u5230\u4f60\u5728\u7fa4\u91cc\u7279\u522b\u6d3b\u8dc3\uff0c\u4e0d\u4ec5\u81ea\u5df1\u5b66\u5f97\u8ba4\u771f\uff0c\u8fd8\u4e3b\u52a8\u5e2e\u540c\u5b66\u642d\u97f3\u3001\u627f\u62c5\u5c0f\u7ec4\u4efb\u52a1\uff0c\u8fd9\u79cd\u2018\u5b9e\u5e72\u5bb6\u2019\u7cbe\u795e\u7279\u522b\u68d2\uff01\u54b1\u4eec\u8bfe\u7a0b\u540e\u671f\u4f1a\u6709\u5f88\u591a\u50cf\u753b\u672c\u5206\u6790\u8fd9\u6837\u7684\u786c\u6838\u5b9e\u6218\u73af\u8282\uff0c\u7279\u522b\u9002\u5408\u4f60\u8fd9\u79cd\u80af\u94bb\u7814\u7684\u5b66\u5458\u3002\u8fc7\u7a0b\u4e2d\u6709\u4efb\u4f55\u6280\u672f\u5361\u70b9\uff0c\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u628a\u5b83\u653b\u514b\u6389\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** + **\u3010\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\u3011** \n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u6280\u672f\u94bb\u7814\u9700\u6c42\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011**\uff08\u6a21\u5757B\uff09\uff0c\u5141\u8bb8\u5979\u5c31AU\u3001\u8bbe\u5907\u3001\u89d2\u8272\u5851\u9020\u7b49\u7ec6\u8282\u8fdb\u884c\u6df1\u5ea6\u63d0\u95ee\u3002\u540c\u65f6\uff0c\u56e0\u5176\u793e\u7fa4\u53c2\u4e0e\u5ea6\u9ad8\uff0c\u53ef\u8d4b\u4e88 **\u3010\u73ed\u59d4\u8d4b\u80fd\u4efb\u547d\u6743\u3011**\uff08\u6a21\u5757D\u8f7b\u91cf\uff09\uff0c\u5982\u5c0f\u7ec4\u957f\u52a9\u7406\uff0c\u589e\u5f3a\u5f52\u5c5e\u611f\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u53ea\u7ed9\u6cdb\u6cdb\u7684\u9f13\u52b1\uff0c\u4e0d\u89e3\u51b3\u5177\u4f53\u6280\u672f\u95ee\u9898\u30022. \u5c06\u5176\u4e0e\u8ffd\u6c42\u5feb\u901f\u53d8\u73b0\u7684\u5b66\u5458\u6df7\u4e3a\u4e00\u8c08\uff0c\u7528\u201c\u9a6c\u4e0a\u8d5a\u94b1\u201d\u7684\u8bdd\u672f\u523a\u6fc0\u5979\u30023. \u5ffd\u89c6\u5979\u5728\u793e\u7fa4\u4e2d\u7684\u8d21\u732e\u548c\u4ef7\u503c\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5979\u5df2\u8d2d\u4e70\u8fc7\u7ade\u54c1\u8bfe\u7a0b\uff0c\u4e14\u5b66\u4e60\u610f\u613f\u5f3a\uff0c\u5bf9\u540e\u7eed\u9ad8\u9636\u8bfe\u7a0b\uff08\u5982\u540e\u671f\u5236\u4f5c\u3001\u5546\u4e1a\u63a5\u5355\u7279\u8bad\uff09\u6709\u6f5c\u5728\u9700\u6c42\u3002\u63a8\u4ecb\u65f6\u5e94\u4fa7\u91cd\u201c\u6280\u80fd\u6df1\u5ea6\u201d\u548c\u201c\u884c\u4e1a\u8d44\u6e90\u201d\uff0c\u800c\u975e\u201c\u53d8\u73b0\u901f\u5ea6\u201d\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u89c9\u5f97\u8fd9\u5957\u8bbe\u5907\u7528\u8d77\u6765\u8fd8\u633a\u559c\u6b22\u7684\uff0c\u8ba9\u6211\u633a\u653e\u677e\u7684\uff0c\u751a\u81f3\u80fd\u53d1\u73b0\u81ea\u5df1\u7684\u5b57\u97f3\u53d1\u7684\u4e0d\u5bf9\u3002\u4e4b\u524d\u5728\u68a8\u82b1\u4e70\u4e86\u4e24\u5957\uff0c\u7528\u7684\u6211\u8d85\u7ea7\u7d27\u5f20\u201d **(\u4f53\u73b0\u5174\u8da3\u9a71\u52a8\u3001\u5bf9\u6bd4\u5b66\u4e60\u3001\u8ffd\u6c42\u6b63\u5411\u4f53\u9a8c)**\n2. > \u201c\u73ed\u73ed\uff0c\u6211\u5728\u9009\u62e9\u964d\u566a\u65f6\uff0c\u6ca1\u9009\u597d\u6837\u672c\uff0c\u60f3\u64a4\u56de\uff0c\u4e0d\u77e5\u9053\u8be5\u600e\u4e48\u64cd\u4f5c\u201d **(\u4f53\u73b0\u9047\u5230\u95ee\u9898\u4e3b\u52a8\u3001\u5177\u4f53\u6c42\u89e3\uff0c\u975e\u60c5\u7eea\u5316)**\n3. > \u201c@\u68c9\u82b1\u80d6\u8c46\u5305-\u5185\u8499\u53e4-\u5973\u64ad \u6211\u53ef\u4ee5\u8bd5\u8bd5\u201d \u53ca\u4e3b\u52a8\u9886\u53d6\u65c1\u767d\u3001\u89d2\u8272\u4efb\u52a1 **(\u4f53\u73b0\u9ad8\u793e\u7fa4\u53c2\u4e0e\u5ea6\u548c\u5b9e\u5e72\u7cbe\u795e)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2\u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4e0e\u81ea\u6211\u80fd\u529b\u5b9e\u73b0**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4f4e**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u6301\u7eed\u3001\u5177\u4f53\u7684\u6280\u672f\u652f\u6301\u4e0e\u5b9e\u6218\u8d4b\u80fd\uff0c\u5e76\u8d4b\u4e88\u5176\u793e\u7fa4\u4e2d\u7684\u4ef7\u503c\u89d2\u8272**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\"}\n```";
