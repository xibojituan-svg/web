    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677152670\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677152670 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-06 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u4e00\u6728(\u5b59\u6676) / \u7c7d\u83f2\u3010\u5b98\u65b9\u62db\u52df\u5b98\u3011(\u5b59\u6676) / \u73ed\u4e3b\u4efb-\u5fc3\u60a6\u541b\u516e(\u5355\u601d\u7ef4) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u9a6c\u62c9\u96c5\u6709\u58f0\u6f14\u64ad\u9ad8\u9636\u7cfb\u7edf\u8bfe\uff087380\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3**\u3002\u7528\u6237\u81ea\u8ff0\u201c\u624b\u91cc\u53ea\u67092700\u591a\u201d\uff0c\u62a5\u540d\u9700\u5411\u5bb6\u957f\u7533\u8bf7\uff0c\u5b58\u5728\u5206\u671f\u4ed8\u6b3e\u53ef\u80fd\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u9ad8\u5bbd\u88d5**\u3002\u7528\u6237\u4e3a\u804c\u9ad8\u5b66\u751f\uff08\u9ad8\u4e8c\uff09\uff0c\u81ea\u8ff0\u201c\u7a7a\u95f2\u65f6\u95f4\u5f88\u957f\u201d\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u9690\u7792\u5077\u62a5**\u3002\u7528\u6237\u591a\u6b21\u8868\u8fbe\u201c\u4e0d\u592a\u6562\u548c\u4ed6\u8bf4\uff08\u7238\u7238\uff09\u201d\u3001\u201c\u6015\u4ed6\u4eec\u4e0d\u652f\u6301\u201d\u3001\u201c\u6015\u4ed6\u4eec\u64cd\u5fc3\u201d\uff0c\u6700\u7ec8\u4e0e\u6bcd\u4eb2\u5546\u91cf\u540e\u62a5\u540d\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u804a\u5929\u8bb0\u5f55\u5b8c\u6574\u5c55\u73b0\u4e86\u4ece\u4f53\u9a8c\u8425\u5b66\u4e60\u3001\u4f5c\u4e1a\u63d0\u4ea4\u3001\u5174\u8da3\u8868\u8fbe\u3001\u5bb6\u5ead\u6c9f\u901a\u5230\u6700\u7ec8\u62a5\u540d\u7684\u5168\u8fc7\u7a0b\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u2b06\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u6709\u660e\u786e\u7684\u804c\u4e1a\u5411\u5f80\uff0c\u4eab\u53d7\u5b66\u4e60\u8fc7\u7a0b\uff0c\u53d8\u73b0\u8bc9\u6c42\u4e0d\u6025\u5207\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u4ece\u5c0f\u5230\u5927\u6700\u60f3\u5e72\u7684\u5c31\u53ea\u6709\u914d\u97f3\u8fd9\u4e00\u677f\u5757\u201d\n  > \u201c\u5176\u5b9e\u6211\u5f88\u5c0f\u7684\u65f6\u5019\u5c31\u63a5\u89e6\u8fc7\uff0c\u5bf9\u8fd9\u4e2a\u884c\u4e1a\u5f88\u611f\u5174\u8da3\u201d\n  > \u201c\u6709\u58f0\u4e66\u4e5f\u5dee\u4e0d\u591a\u542c\u4e867\u5e74\u4e86\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u7528\u6237\u4e3a\u804c\u9ad8\u5b66\u751f\uff0c\u65e0\u72ec\u7acb\u7ecf\u6d4e\u80fd\u529b\uff0c\u62a5\u540d\u9700\u5411\u7236\u6bcd\u7533\u8bf7\uff0c\u81ea\u8ff0\u201c\u624b\u91cc\u53ea\u67092700\u591a\u201d\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u9ad8** \u2014 \u5b66\u751f\u8eab\u4efd\uff0c\u7a7a\u95f2\u65f6\u95f4\u957f\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4f4e** \u2014 \u5b58\u5728\u6c9f\u901a\u969c\u788d\uff0c\u7528\u6237\u201c\u4e0d\u6562\u8bf4\u201d\uff0c\u6bcd\u4eb2\u201c\u6015\u88ab\u9a97\u3001\u6015\u82b1\u592a\u591a\u94b1\u201d\uff0c\u7236\u4eb2\u4e0d\u77e5\u60c5\u3002\u5bb6\u5ead\u652f\u6301\u662f\u660e\u663e\u77ed\u677f\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u27a1\u4e2d**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u9700\u95f4\u6b47\u6027\u5b89\u629a\u3002\u7528\u6237\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u4f9d\u8d56\u6027\u548c\u4e0d\u81ea\u4fe1\uff08\u201c\u4e0d\u592a\u6562\u8bf4\u201d\u3001\u201c\u6015\u4ed6\u4eec\u4e0d\u652f\u6301\u201d\uff09\uff0c\u4f46\u5728\u9500\u552e\u5f15\u5bfc\u4e0b\u80fd\u5b8c\u6210\u6c9f\u901a\u548c\u62a5\u540d\u6d41\u7a0b\uff0c\u672a\u51fa\u73b0\u5d29\u6e83\u6216\u653e\u5f03\u4fe1\u53f7\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u4f46\u662f\u6211\u4e0d\u592a\u6562\u548c\u4ed6\u8bf4\u201d\n  > \u201c\u6211\u6015\u4ed6\u4eec\u64cd\u5fc3\u201d\n  > \u201c\u6015\u4ed6\u4eec\u4e0d\u652f\u6301\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42 / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u8eab\u4efd\u8ba4\u540c\u4e0e\u4ef7\u503c\u611f\u7f3a\u5931**\u3002\u4f5c\u4e3a\u804c\u9ad8\u5b66\u751f\uff0c\u5728\u201c\u5b66\u6821\u5f31\u5316\u4e86\u4eba\u4e0e\u4eba\u4e4b\u95f4\u7684\u5dee\u522b\u201d\u7684\u80cc\u666f\u4e0b\uff0c\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u81ea\u5df1\u771f\u6b63\u70ed\u7231\u7684\u6280\u80fd\uff08\u914d\u97f3\uff09\uff0c\u6765\u83b7\u5f97\u533a\u522b\u4e8e\u540c\u9f84\u4eba\u7684\u72ec\u7279\u4ef7\u503c\u3001\u5bb6\u5ead\u8ba4\u53ef\u548c\u793e\u4f1a\u5c0a\u91cd\uff0c\u800c\u975e\u7eaf\u7cb9\u7684\u751f\u5b58\u538b\u529b\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u201d\u7684\u80af\u5b9a\u4e0e\u201c\u88ab\u8d4b\u80fd\u201d\u7684\u5f52\u5c5e\u611f**\u3002\u80af\u5b9a\u4ed6\u7684\u5174\u8da3\u548c\u6f5c\u529b\uff0c\u5c06\u4ed6\u7eb3\u5165\u4e00\u4e2a\u201c\u4e13\u4e1a\u5708\u5b50\u201d\uff0c\u8ba9\u4ed6\u611f\u89c9\u81ea\u5df1\u6b63\u5728\u901a\u5f80\u68a6\u60f3\u7684\u9053\u8def\u4e0a\uff0c\u83b7\u5f97\u8eab\u4efd\u8ba4\u540c\u548c\u7fa4\u4f53\u5f52\u5c5e\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1\u7c7b** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T5 \u597d\u73a9\u5c1d\u9c9c\u8005\uff08\u5174\u8da3\u805a\u7126\u53d8\u4f53\uff09** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u9ad8** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u7236\u4eb2\u4e0d\u77e5\u60c5\u6216\u540e\u7eed\u5f3a\u70c8\u53cd\u5bf9\uff0c\u53ef\u80fd\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u5e76\u8981\u6c42\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u65f6\u95f4\u5145\u88d5\uff0c\u5b66\u4e1a\u538b\u529b\u53ef\u63a7\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4e2d | \u5b66\u4e60\u8fc7\u7a0b\u4e2d\u82e5\u9047\u5230\u6280\u672f\u96be\u9898\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u3001\u8bbe\u5907\u8c03\u8bd5\uff09\uff0c\u53ef\u80fd\u56e0\u7f3a\u4e4f\u72ec\u7acb\u89e3\u51b3\u80fd\u529b\u800c\u4ea7\u751f\u632b\u8d25\u611f\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u52a8\u673a\u4ee5\u5174\u8da3\u548c\u804c\u4e1a\u5411\u5f80\u4e3a\u4e3b\uff0c\u5bf9\u77ed\u671f\u53d8\u73b0\u671f\u5f85\u4e0d\u9ad8\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e1-2\u5468**\u3002\u5f53\u5b66\u4e60\u8fdb\u5165\u5b9e\u64cd\u9636\u6bb5\uff08\u5982\u5b89\u88c5\u8f6f\u4ef6\u3001\u4f7f\u7528\u8bbe\u5907\uff09\uff0c\u82e5\u9047\u5230\u56f0\u96be\u4e14\u5bb6\u5ead\u652f\u6301\u4e0d\u8db3\u65f6\uff0c\u6613\u4ea7\u751f\u653e\u5f03\u5ff5\u5934\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u540c\u5b66\u4f60\u597d\uff01\u770b\u5230\u4f60\u4ece\u5c0f\u5c31\u70ed\u7231\u914d\u97f3\uff0c\u575a\u6301\u4e86\u8fd9\u4e48\u591a\u5e74\uff0c\u771f\u7684\u5f88\u96be\u5f97\u3002\u5728\u8fd9\u91cc\u4f60\u4e0d\u662f\u4e00\u4e2a\u666e\u901a\u5b66\u751f\uff0c\u800c\u662f\u4e00\u4e2a\u672a\u6765\u7684\u58f0\u97f3\u521b\u4f5c\u8005\u3002\u54b1\u4eec\u73ed\u6709\u5f88\u591a\u548c\u4f60\u4e00\u6837\u6000\u63e3\u68a6\u60f3\u7684\u540c\u5b66\uff0c\u63a5\u4e0b\u6765\u7684\u5b66\u4e60\uff0c\u6211\u4eec\u4e00\u8d77\u628a\u5174\u8da3\u53d8\u6210\u4f60\u7684\u2018\u8d85\u80fd\u529b\u2019\u3002\u6709\u4efb\u4f55\u64cd\u4f5c\u4e0a\u7684\u5c0f\u95ee\u9898\u968f\u65f6\u627e\u6211\uff0c\u522b\u6015\u9ebb\u70e6\uff0c\u54b1\u4eec\u4e00\u6b65\u6b65\u6765\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5174\u8da3\u6e38\u4e50\u7ebf\u3011**\u3002\u91cd\u70b9\u5f15\u5bfc\u5176\u4eab\u53d7\u58f0\u97f3\u521b\u4f5c\u7684\u4e50\u8da3\uff0c\u63a2\u7d22\u4e0d\u540c\u58f0\u7ebf\u98ce\u683c\uff08\u5982\u4ed6\u63d0\u5230\u7684\u513f\u7ae5\u3001\u60c5\u611f\u3001\u7384\u5e7b\u7b49\uff09\uff0c\u5f31\u5316\u524d\u671f\u201c\u63a5\u5355\u8d5a\u94b1\u201d\u538b\u529b\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176**\u8d44\u6e90\u5e95\u5ea7\uff08\u5bb6\u5ead\u652f\u6301\uff09\u77ed\u677f**\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a**\u3010\u65b0\u624b\u4fdd\u59c6\u7ea7\u542f\u52a8\u5305\u3011**\u3002\u5305\u542b\uff1a1) \u8bbe\u5907\u9009\u8d2d\u7b80\u6613\u6307\u5357\uff08\u907f\u514d\u88ab\u5751\uff09\uff1b2) \u8f6f\u4ef6\u5b89\u88c5\u8fdc\u7a0b\u534f\u52a9\u9884\u6848\uff1b3) \u4e0e\u5bb6\u957f\u6c9f\u901a\u7684\u201c\u6210\u679c\u5c55\u793a\u201d\u8bdd\u672f\u6a21\u677f\uff08\u5e2e\u52a9\u4ed6\u83b7\u5f97\u5bb6\u5ead\u652f\u6301\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u8fc7\u65e9\u3001\u8fc7\u9891\u7e41\u5730\u5f3a\u8c03\u201c\u63a5\u5355\u201d\u3001\u201c\u53d8\u73b0\u201d\uff0c\u8fd9\u4f1a\u7834\u574f\u5176\u5174\u8da3\u9a71\u52a8\u7684\u7eaf\u7cb9\u6027\uff0c\u5e76\u53ef\u80fd\u5f15\u53d1\u5bb6\u5ead\u5bf9\u5176\u201c\u4e0d\u52a1\u6b63\u4e1a\u201d\u7684\u62c5\u5fe7\u3002\u7981\u6b62\u7528\u9ad8\u538b\u903c\u5355\u8bdd\u672f\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u57fa\u7840\u6280\u80fd\u672a\u7a33\u56fa\u524d\u8fdb\u884c\u4efb\u4f55\u786c\u4ef6\u6216\u9ad8\u9636\u8bfe\u7a0b\u63a8\u9500**\u3002\u9996\u8981\u4efb\u52a1\u662f\u5e2e\u52a9\u4ed6\u83b7\u5f97\u7b2c\u4e00\u4e2a\u5c0f\u6210\u679c\uff08\u5982\u4e00\u6bb5\u6ee1\u610f\u7684\u4f5c\u54c1\uff09\uff0c\u5efa\u7acb\u81ea\u4fe1\u548c\u5bb6\u5ead\u8ba4\u53ef\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u4ece\u5c0f\u5230\u5927\u6700\u60f3\u5e72\u7684\u5c31\u53ea\u6709\u914d\u97f3\u8fd9\u4e00\u677f\u5757\u201d\n2. > \u201c\u5176\u5b9e\u6211\u5f88\u5c0f\u7684\u65f6\u5019\u5c31\u63a5\u89e6\u8fc7\uff0c\u5bf9\u8fd9\u4e2a\u884c\u4e1a\u5f88\u611f\u5174\u8da3\u201d\n3. > \u201c\u4f46\u662f\u6211\u4e0d\u592a\u6562\u548c\u4ed6\u8bf4\u201d\u3001\u201c\u6015\u4ed6\u4eec\u4e0d\u652f\u6301\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T5 \u597d\u73a9\u5c1d\u9c9c\u8005\uff08\u5174\u8da3\u805a\u7126\u53d8\u4f53\uff09\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u8eab\u4efd\u8ba4\u540c\u4e0e\u5c0a\u91cd\uff0c\u5c06\u70ed\u7231\u8f6c\u5316\u4e3a\u4ef7\u503c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u60c5\u7eea\u4ef7\u503c\u4e0e\u65b0\u624b\u4fdd\u59c6\u7ea7\u652f\u6301\uff0c\u7a33\u56fa\u5176\u5174\u8da3\uff0c\u5e76\u534f\u52a9\u5176\u83b7\u5f97\u5bb6\u5ead\u8ba4\u53ef\u3011**\u3002\n\n```json\n{\"core_type\": \"T5 \u597d\u73a9\u5c1d\u9c9c\u8005\uff08\u5174\u8da3\u805a\u7126\u53d8\u4f53\uff09\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u793e\u4ea4/\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf + \u65b0\u624b\u4fdd\u59c6\u7ea7\u542f\u52a8\u5305\"}\n```";
