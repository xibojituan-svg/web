    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4ee5\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\u7684\u8eab\u4efd\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u63d0\u4f9b\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 566841611 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-18 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u59b9\u5c0f\u753b\uff08\u5e9e\u6d77\u82b1\uff09\u3001\u6b23\u8fb0\uff08\u6c88\u838e\u838e\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u77ed\u5267\u8bfe\u3001\u6539\u7a3f\u8bfe\u3001\u77ed\u89c6\u9891\u8bfe\uff08\u5df2\u8d2d\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u4e0a\u73ed\u65cf\uff0c\u665a\u4e0a\u9700\u4e0a\u73ed\uff0c\u53ea\u80fd\u6234\u8033\u673a\u542c\u8bfe\uff0c\u4f5c\u4e1a\u9700\u71ac\u591c\u5b8c\u6210\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3** |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u5b66\u4e60\u884c\u4e3a\u3001\u60c5\u7eea\u3001\u4e92\u52a8\u8bb0\u5f55\u5b8c\u6574\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34(\u4e2d)**\u3002\u7528\u6237\u6709\u660e\u786e\u7684\u53d8\u73b0\u8bc9\u6c42\uff08\u6295\u7a3f\u3001\u7b7e\u7ea6\uff09\uff0c\u4f46\u540c\u65f6\u4e5f\u8868\u73b0\u51fa\u5bf9\u5b66\u4e60\u672c\u8eab\u3001\u6280\u80fd\u7cbe\u8fdb\u7684\u6295\u5165\u548c\u7126\u8651\u3002\u52a8\u673a\u662f\u201c\u53d8\u73b0+\u6280\u80fd\u63d0\u5347\u201d\u7684\u6df7\u5408\u4f53\uff0c\u800c\u975e\u7eaf\u7cb9\u7684\u201c\u51e0\u5929\u5185\u63d0\u73b0\u4fdd\u5e95\u201d\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u90a3\u4e2a\u53cd\u5e38\u7684\u884c\u4e3a\u90fd\u53d8\u6210\u4e3b\u89d2\u7684\u884c\u4e3a\u5566\uff0c\u6211\u4eca\u5929\u91cd\u65b0\u5199\u4e86\u4e00\u7bc7\u793e\u4f1a\u6253\u8138\u7684\u201d\uff1b> \u201c\u73ed\u73ed\uff0c\u6211\u524d\u9762\u505a\u7684\u4f5c\u4e1a\u5e73\u51e1\u5927\u5927\u8bf4\u90fd\u4e0d\u884c\uff0c\u6211\u73b0\u5728\u6b63\u5728\u505a\u201d\uff1b> \u201c\u73ed\u73ed\uff0c\u6211\u6628\u5929\u5728\u756a\u8304\u6295\u7684\u77ed\u6545\u4e8b\u7b7e\u7ea6\u5566\u201d\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u4e2d]** \u2014 \u5df2\u8d2d\u4e70\u591a\u95e8\u8bfe\u7a0b\uff08\u77ed\u5267\u3001\u6539\u7a3f\u3001\u77ed\u89c6\u9891\uff09\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u4ed8\u8d39\u610f\u613f\u548c\u80fd\u529b\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u652f\u4ed8\u65b9\u5f0f\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**[\u4f4e]** \u2014 **\u6838\u5fc3\u77ed\u677f**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u4e0a\u73ed\u90fd\u6ca1\u65f6\u95f4\uff0c\u6628\u665a\u4e00\u591c\u6ca1\u7761\u624d\u628a\u4f5c\u4e1a\u505a\u5b8c\u201d\u3001\u201c\u665a\u4e0a\u8fd8\u8981\u4e0a\u73ed\uff0c\u53ea\u80fd\u6234\u8033\u673a\u542c\u201d\u3001\u201c\u90fd\u5fd9\u4e0d\u8fc7\u6765\u5566\uff0c\u73b0\u5728\u5934\u90fd\u5fd9\u6655\u5566\u201d\u3002\u65f6\u95f4\u6781\u5ea6\u7d27\u5f20\uff0c\u7cbe\u529b\u88ab\u5de5\u4f5c\u4e25\u91cd\u6324\u538b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u4fe1\u606f\u4e0d\u8db3]** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b07\u4f4e\u6781\u5371]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u9762\u5bf9\u5b66\u4e60\u632b\u6298\uff08\u4f5c\u4e1a\u88ab\u8bc4\u201c\u4e0d\u884c\u201d\uff09\u65f6\uff0c\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u81ea\u6211\u5426\u5b9a\u548c\u7126\u8651\uff0c\u9700\u8981\u73ed\u4e3b\u4efb\u9891\u7e41\u7684\u9f13\u52b1\u548c\u5177\u4f53\u6307\u5bfc\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u611f\u89c9\u81ea\u5df1\u7684\u903b\u8f91\u601d\u7ef4\u8ddf\u4e0d\u4e0a\u201d\uff1b> \u201c\u611f\u89c9\u4e00\u76f4\u90fd\u8ddf\u4e0d\u4e0a\u5927\u5927\u7684\u8282\u594f\u201d\uff1b> \u201c\u53ef\u5c31\u662f\u81ea\u5df1\u7684\u63a5\u53d7\u80fd\u529b\u592a\u6162\u5566\u201d\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u80fd\u529b\u7126\u8651\u4e0e\u65f6\u95f4\u532e\u4e4f\u5e26\u6765\u7684\u53cc\u91cd\u4e0d\u5b89\u5168\u611f**\u3002\u7528\u6237\u5bb3\u6015\u81ea\u5df1\u201c\u8ddf\u4e0d\u4e0a\u8282\u594f\u201d\u3001\u201c\u63a5\u53d7\u80fd\u529b\u6162\u201d\uff0c\u5728\u9ad8\u538b\u5de5\u4f5c\u4e0b\u6324\u51fa\u65f6\u95f4\u5b66\u4e60\uff0c\u5374\u56e0\u4f5c\u4e1a\u88ab\u5426\u5b9a\u800c\u611f\u5230\u632b\u8d25\uff0c\u62c5\u5fc3\u6295\u5165\u7684\u65f6\u95f4\u7cbe\u529b\u65e0\u6cd5\u83b7\u5f97\u56de\u62a5\uff08\u6280\u80fd\u63d0\u5347\u6216\u53d8\u73b0\uff09\uff0c\u4ece\u800c\u5a01\u80c1\u5230\u5176\u804c\u4e1a\u8f6c\u578b\u6216\u526f\u4e1a\u53d1\u5c55\u7684\u201c\u5b89\u5168\u9884\u671f\u201d\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u7684\u52aa\u529b\u201d\u4e0e\u201c\u53ef\u5b9e\u73b0\u7684\u8fdb\u6b65\u9636\u68af\u201d**\u3002\u63d0\u4f9b\u5177\u4f53\u7684\u3001\u6b65\u9aa4\u5316\u7684\u6307\u5bfc\uff08\u5982\u73ed\u73ed\u5bf9\u5267\u672c\u7684\u8be6\u7ec6\u4fee\u6539\u5efa\u8bae\uff09\uff0c\u5e76\u5bf9\u5176\u4efb\u4f55\u5fae\u5c0f\u7684\u8fdb\u6b65\uff08\u5982\u77ed\u6545\u4e8b\u7b7e\u7ea6\uff09\u7ed9\u4e88\u5373\u65f6\u3001\u5938\u5f20\u7684\u80af\u5b9a\uff0c\u5e2e\u52a9\u5176\u5efa\u7acb\u201c\u6211\u80fd\u5b66\u4f1a\u201d\u7684\u4fe1\u5fc3\uff0c\u62b5\u5fa1\u56e0\u65f6\u95f4\u4e0d\u8db3\u548c\u80fd\u529b\u7126\u8651\u5e26\u6765\u7684\u5d29\u6e83\u98ce\u9669\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2 \u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74** (\u4e25\u91cd\u5185\u8017\u578b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a[\u672a\u53d1\u73b0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u7b49\u4fe1\u53f7]\n\n**\u5224\u5b9a\u6811\u8def\u5f84\u63a8\u6f14**\uff1a\n1.  **\u4e09\u8f74\u8bc4\u5206**\uff1a\u52a8\u673a\u7eaf\u5ea6(5-6\u5206)\u3001\u8d44\u6e90\u5e95\u5ea7(3-4\u5206\uff0c\u65f6\u95f4\u77ed\u677f)\u3001\u5fc3\u7406\u5f39\u6027(1-2\u5206)\u3002\n2.  **\u6267\u884c\u5224\u5b9a\u6811**\uff1a\n    *   \u672a\u89e6\u53d1\u524d\u7f6e\u9694\u7206\u7b5b\uff08\u52a8\u673a\u4e0d\u4e3a0\uff0c\u65e0\u501f\u8d37\u5a01\u80c1\uff09\u3002\n    *   \u52a8\u673a\u7eaf\u5ea6\u22655\uff0c\u8fdb\u5165\u201c\u4e2d\u9ad8\u52a8\u673a\u7cbe\u5206\u201d\u3002\n    *   \u5fc3\u7406\u5f39\u6027\u22644\uff0c\u8fdb\u5165\u201c\u4f4e\u5f39\u6027\u901a\u9053\u201d\u3002\n    *   \u547d\u4e2d\u5206\u652fB\u6761\u4ef6\uff1a\u201c\u51fa\u73b0\u2018\u6211\u592a\u7b28\u4e86 / \u597d\u6015\u5b66\u4e0d\u4f1a / \u5931\u7720\u4e86 / \u60f3\u653e\u5f03\u2019\u7b49\u81ea\u5351\u4fe1\u53f7\u201d\uff0c\u4e14**\u672a**\u540c\u65f6\u6ee1\u8db3\u201c\u6280\u672f\u8ffd\u95ee\u6df1\u5ea6\u22652\u5c42\u201d\u3002\n    *   **\u5224\u5b9a\u7ed3\u679c**\uff1aT6 \u60c5\u7eea\u5de8\u5a74\u3002\n3.  **ABCD\u6620\u5c04**\uff1aT6 \u2192 C2\u7c7b\uff08\u98ce\u9669\u7ba1\u63a7\u578b\uff09\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u5f53\u524d\u5b66\u4e60\u5df2\u5360\u7528\u5927\u91cf\u4f11\u606f\u65f6\u95f4\uff08\u71ac\u591c\uff09\uff0c\u82e5\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u98ce\u9669\u589e\u52a0\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u5de5\u4f5c\u7e41\u5fd9+\u8bfe\u7a0b\u538b\u529b\u5927\uff08\u540c\u65f6\u5b66\u591a\u95e8\u8bfe\uff09\uff0c\u4e00\u65e6\u4f5c\u4e1a\u8fde\u7eed\u88ab\u5426\u6216\u65f6\u95f4\u65e0\u6cd5\u534f\u8c03\uff0c\u6781\u6613\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u81ea\u8d23\u5d29\u6e83\uff0c\u4ea7\u751f\u201c\u7b97\u4e86\uff0c\u653e\u5f03\u5427\u201d\u7684\u5ff5\u5934\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | **\u6700\u53ef\u80fd\u5f15\u7206\u70b9**\u3002\u7528\u6237\u5df2\u591a\u6b21\u8868\u8fbe\u201c\u8ddf\u4e0d\u4e0a\u201d\u3001\u201c\u903b\u8f91\u601d\u7ef4\u4e0d\u884c\u201d\u3001\u201c\u63a5\u53d7\u80fd\u529b\u6162\u201d\u3002\u4efb\u4f55\u4e00\u6b21\u4e25\u5389\u7684\u3001\u7f3a\u4e4f\u5177\u4f53\u6307\u5bfc\u7684\u8d1f\u9762\u53cd\u9988\uff0c\u90fd\u53ef\u80fd\u6210\u4e3a\u538b\u57ae\u5176\u5fc3\u7406\u9632\u7ebf\u7684\u6700\u540e\u4e00\u6839\u7a3b\u8349\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u867d\u7136\u5df2\u6709\u77ed\u6545\u4e8b\u7b7e\u7ea6\u7684\u79ef\u6781\u4fe1\u53f7\uff0c\u4f46\u5982\u679c\u540e\u7eed\u5728\u66f4\u671f\u5f85\u7684\u77ed\u5267\u6295\u7a3f\u4e0a\u6301\u7eed\u53d7\u632b\uff0c\u6216\u53d8\u73b0\u5468\u671f\u8fdc\u8d85\u9884\u671f\uff0c\u4ecd\u53ef\u80fd\u56e0\u843d\u5dee\u800c\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u4e2d\u540e\u671f\uff08\u7b2c4-8\u5468\uff09\u53ca\u7ed3\u8425\u524d\u540e**\u3002\u6b64\u65f6\u4f5c\u4e1a\u96be\u5ea6\u548c\u6570\u91cf\u8fbe\u5230\u5cf0\u503c\uff0c\u7528\u6237\u65f6\u95f4\u7cbe\u529b\u6fd2\u4e34\u67af\u7aed\uff0c\u81ea\u6211\u6000\u7591\u6700\u4e25\u91cd\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u770b\u5230\u4f60\u5de5\u4f5c\u8fd9\u4e48\u5fd9\u8fd8\u575a\u6301\u5b66\u4e60\u3001\u4ea4\u4f5c\u4e1a\uff0c\u771f\u7684\u7279\u522b\u4f69\u670d\u4f60\u7684\u6bc5\u529b\u3002\u54b1\u4eec\u4e0d\u8ddf\u522b\u4eba\u6bd4\u8fdb\u5ea6\uff0c\u5c31\u6309\u7167\u4f60\u81ea\u5df1\u7684\u8282\u594f\u6765\uff0c\u54ea\u6015\u4e00\u5468\u53ea\u6d88\u5316\u900f\u4e00\u4e2a\u77e5\u8bc6\u70b9\uff0c\u90fd\u662f\u5de8\u5927\u7684\u8fdb\u6b65\u3002\u6709\u4efb\u4f55\u5361\u4f4f\u7684\u5730\u65b9\u968f\u65f6\u627e\u6211\uff0c\u6211\u5e2e\u4f60\u62c6\u89e3\u6210\u6700\u5c0f\u6b65\u9aa4\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u6b65\u6765\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\uff08\u56e0\u5176\u6709\u53d8\u73b0\u8bc9\u6c42\u548c\u7b7e\u7ea6\u6210\u679c\uff0c\u9700\u6280\u672f\u63d0\u5347\uff09\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u5f3a\u70c8\u8865\u5145\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u9488\u5bf9\u5176T6\u60c5\u7eea\u5de8\u5a74\u7279\u8d28\uff0c\u9700\u8981\u6ee1\u914d\u7684C\u6a21\u5757\uff08\u60c5\u7eea\u4fdd\u59c6\u4e0e\u4f34\u98de\u6c60\uff09\u8fdb\u884c\u6258\u5e95\u3002\n    - **A\u6a21\u5757\uff08\u51cf\u538b\u7248\uff09**\uff1a\u5c06\u590d\u6742\u4efb\u52a1\u62c6\u89e3\u4e3a\u201c\u6309\u952e\u7ea7\u201d\u52a8\u4f5c\u5305\u3002\u4f8b\u5982\uff0c\u4e0d\u8bf4\u201c\u63d0\u5347\u903b\u8f91\u201d\uff0c\u800c\u662f\u8bf4\u201c\u8fd9\u4e00\u6b65\uff0c\u5148\u7ed9\u4e3b\u89d2\u52a0\u4e00\u53e5OS\u89e3\u91ca\u52a8\u673a\u201d\u3002\n    - **C\u6a21\u5757\uff08\u6ee1\u914d\u5168\u5f00\uff09**\uff1a\u5bf9\u5176\u4efb\u4f55\u5fae\u5c0f\u8fdb\u6b65\uff08\u5982\u6309\u65f6\u4ea4\u4f5c\u4e1a\u3001\u6210\u529f\u7b7e\u7ea6\uff09\u7ed9\u4e88\u6781\u5938\u5f20\u7684\u3001\u516c\u5f00\u7684\u8d5e\u7f8e\u3002\u5b9a\u671f\u79c1\u804a\u8fdb\u884c\u60c5\u7eea\u758f\u5bfc\uff0c\u4e3b\u52a8\u8be2\u95ee\u201c\u6700\u8fd1\u538b\u529b\u5927\u4e0d\u5927\uff1f\u6709\u6ca1\u6709\u54ea\u91cc\u5361\u4f4f\u4e86\uff1f\u201d\uff0c\u800c\u4e0d\u662f\u7b49\u5176\u5d29\u6e83\u3002\n    - **B\u6a21\u5757\uff08\u8c28\u614e\u4f7f\u7528\uff09**\uff1a\u6d3e\u5355\u6216\u5b9e\u6218\u4efb\u52a1\u9700\u5728\u5176\u60c5\u7eea\u7a33\u5b9a\u3001\u6709\u5c0f\u6210\u679c\u65f6\u8fdb\u884c\uff0c\u5e76\u964d\u4f4e\u9884\u671f\uff0c\u5f3a\u8c03\u201c\u8fc7\u7a0b\u79ef\u7d2f\u6bd4\u7ed3\u679c\u66f4\u91cd\u8981\u201d\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u7528\u201c\u522b\u4eba\u90fd\u884c\u4f60\u600e\u4e48\u4e0d\u884c\u201d\u7b49\u5bf9\u6bd4\u8bdd\u8bed\u65bd\u538b\uff1b2. \u5728\u5176\u8868\u8fbe\u7126\u8651\u65f6\uff0c\u53ea\u56de\u590d\u201c\u52a0\u6cb9\u201d\u7b49\u9e21\u6c64\u8bdd\u672f\u800c\u4e0d\u7ed9\u5177\u4f53\u89e3\u51b3\u65b9\u6848\uff1b3. \u5728\u5176\u65f6\u95f4\u7d27\u5f20\u65f6\uff0c\u50ac\u4fc3\u5176\u52a0\u5feb\u8fdb\u5ea6\u6216\u53e0\u52a0\u65b0\u4efb\u52a1\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u8bfe\u7a0b\u4e2d\u671f\u6216\u7528\u6237\u8868\u8fbe\u201c\u5fd9\u4e0d\u8fc7\u6765\u201d\u65f6\u8fdb\u884c\u4efb\u4f55\u5347\u5355\u63a8\u9500**\u3002\u672c\u6b21\u8bb0\u5f55\u4e2d\u9500\u552e\u5728\u5176\u660e\u786e\u8868\u793a\u201c\u5934\u90fd\u5fd9\u6655\u5566\u201d\u540e\u4ecd\u63a8\u9500\u77ed\u89c6\u9891\u8bfe\u5e76\u6210\u529f\u8f6c\u5316\uff0c**\u6b64\u64cd\u4f5c\u98ce\u9669\u6781\u9ad8**\uff0c\u6781\u6613\u5f15\u53d1\u7528\u6237\u56e0\u8bfe\u7a0b\u5806\u79ef\u4ea7\u751f\u201c\u77e5\u8bc6\u6d88\u5316\u4e0d\u826f\u201d\u7684\u6050\u614c\uff0c\u4ece\u800c\u9000\u8d39\u3002\u5e94\u6267\u884c **\u3010\u6218\u7565\u6027\u62d2\u5356\u7194\u65ad\u3011**\uff0c\u5efa\u8bae\u5176\u5148\u6d88\u5316\u73b0\u6709\u8bfe\u7a0b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u4e0a\u73ed\u90fd\u6ca1\u65f6\u95f4\uff0c\u6628\u665a\u4e00\u591c\u6ca1\u7761\u624d\u628a\u4f5c\u4e1a\u505a\u5b8c\u3002\u611f\u89c9\u4e0d\u592a\u597d\uff0c\u4eca\u5929\u8fd9\u7bc7\u8981\u662f\u53ef\u4ee5\u505a\u597d\u628a\u5b83\u4fee\u6539\u8fc7\u6765\u201d \u2014\u2014 **\u3010\u8d44\u6e90\u5e95\u5ea7\u77ed\u677f\uff1a\u65f6\u95f4\u7cbe\u529b\u67af\u7aed\u3011**\n2. > \u201c\u611f\u89c9\u81ea\u5df1\u7684\u903b\u8f91\u601d\u7ef4\u8ddf\u4e0d\u4e0a\u201d\u3001\u201c\u611f\u89c9\u4e00\u76f4\u90fd\u8ddf\u4e0d\u4e0a\u5927\u5927\u7684\u8282\u594f\u201d\u3001\u201c\u53ef\u5c31\u662f\u81ea\u5df1\u7684\u63a5\u53d7\u80fd\u529b\u592a\u6162\u5566\u201d \u2014\u2014 **\u3010\u5fc3\u7406\u5f39\u6027\u6781\u4f4e\uff1a\u6301\u7eed\u81ea\u6211\u5426\u5b9a\u4e0e\u80fd\u529b\u7126\u8651\u3011**\n3. > \u201c\u90fd\u5fd9\u4e0d\u8fc7\u6765\u5566\uff0c\u73b0\u5728\u5934\u90fd\u5fd9\u6655\u5566\u201d \u2014\u2014 **\u3010\u98ce\u9669\u4fe1\u53f7\uff1a\u8bfe\u7a0b\u8fc7\u8f7d\uff0c\u6fd2\u4e34\u5d29\u6e83\u8fb9\u7f18\u3011**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u9700\u6c42\uff08\u62b5\u5fa1\u80fd\u529b\u7126\u8651\u4e0e\u65f6\u95f4\u538b\u529b\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u6ee1\u914dC\u6a21\u5757\u60c5\u7eea\u6258\u5e95 + A\u6a21\u5757\u4efb\u52a1\u62c6\u89e3\uff0c\u4e25\u7981\u5728\u7126\u8651\u671f\u5347\u5355\u52a0\u538b\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"maslow_need\": \"\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\uff08\u5fc5\u987b\u6302\u8f7d\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\uff09\"}\n```";
