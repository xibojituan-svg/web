    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 176319193 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u767d\u767d- AI\u5199\u4f5c\u9ad8\u7ea7\u6559\u7ec3(\u8d75\u660e\u660e) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u5199\u4f5c\u8bfe\u7a0b\uff08\u77ed\u6545\u4e8b\u73ed\uff0c2880\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3**\uff08\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u6211\u5148\u53bb\u8981\u70b9\ud83d\udcb0\u201d\uff0c\u6697\u793a\u9700\u5411\u4ed6\u4eba\u501f\u94b1\u6216\u7b79\u63aa\u8d44\u91d1\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u7528\u6237\u63d0\u53ca\u201c\u8fd9\u51e0\u5929\u8001\u5bb6\u6765\u5ba2\u4eba\u4e86\uff0c\u6ca1\u7a7a\u201d\uff0c\u8868\u660e\u5b66\u4e60\u65f6\u95f4\u6613\u53d7\u5bb6\u5ead/\u751f\u6d3b\u4e8b\u52a1\u6324\u538b\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\uff08\u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\uff0c\u4f46\u652f\u4ed8\u884c\u4e3a\u9700\u201c\u8981\u94b1\u201d\uff0c\u5b58\u5728\u9690\u7792\u6216\u53cd\u5bf9\u98ce\u9669\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u5bf9\u8bdd\u5145\u5206\u66b4\u9732\u4e86\u7528\u6237\u7684\u5b66\u4e60\u72b6\u6001\u3001\u7ecf\u6d4e\u72b6\u51b5\u548c\u60c5\u7eea\u6ce2\u52a8\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u800c\u6765(\u9ad8)\u3002\u7528\u6237\u5173\u6ce8\u5177\u4f53\u5199\u4f5c\u6280\u5de7\u3001\u5de5\u4f5c\u6d41\u7a0b\uff0c\u5bf9\u201c\u591a\u4e45\u8d5a\u94b1\u201d\u7684\u6025\u8feb\u6027\u4f4e\u4e8e\u5bf9\u201c\u5982\u4f55\u5b66\u4f1a\u201d\u7684\u7126\u8651\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5e94\u8be5\u662f\u5199\u5c0f\u8bf4\u7684\u5de5\u4f5c\u6d41\u7a0b\u4e0d\u5bf9\uff0c\u6211\u5199\u51fa\u6765\u4e0d\u5438\u5f15\u4eba\u3002\u201d > \u201c\u6211\u662f\u60f3\u5148\u5b66\u4f1a\u77ed\u7bc7\uff0c\u7136\u540e\u7279\u522b\u719f\u7ec3\u4e86\u518d\u5b66\u77ed\u5267\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u660e\u786e\u8868\u793a\u201c\u5de5\u8d44\u5230\u73b0\u5728\u6ca1\u53d1\u201d\uff0c\u62a5\u540d\u9700\u201c\u5148\u53bb\u8981\u70b9\ud83d\udcb0\u201d\uff0c\u8d44\u91d1\u94fe\u8106\u5f31\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u6709\u5b66\u4e60\u610f\u613f\uff0c\u4f46\u65f6\u95f4\u53d7\u5bb6\u5ead\u4e8b\u52a1\u5f71\u54cd\uff08\u201c\u8001\u5bb6\u6765\u5ba2\u4eba\u4e86\u201d\uff09\uff0c\u5b66\u4e60\u8fde\u7eed\u6027\u5b58\u7591\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4f4e** \u2014 \u652f\u4ed8\u884c\u4e3a\u9700\u5411\u5bb6\u4eba/\u4ed6\u4eba\u201c\u8981\u94b1\u201d\uff0c**\u9ad8\u5ea6\u7591\u4f3c\u9690\u7792\u6216\u5bb6\u4eba\u4e0d\u652f\u6301**\uff0c\u6784\u6210\u91cd\u5927\u98ce\u9669\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u521d\u6b21\u5c1d\u8bd5\u53d7\u632b\u5373\u81ea\u6211\u5426\u5b9a\uff0c\u5bf9\u201c\u5b66\u4e0d\u4f1a\u201d\u6709\u5f3a\u70c8\u6050\u60e7\uff0c\u4f9d\u8d56\u5916\u90e8\u80af\u5b9a\u548c\u8def\u5f84\u6307\u5f15\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8fd8\u662f\u4e0d\u884c\u3002\u770b\u7684\u6587\u592a\u591a\u4e86\u3002\u770b\u8fd9\u4e9bBug\u592a\u591a\u201d > \u201c\u5b66\u5f88\u591a\uff0c\u6211\u6015\u5b66\u4e0d\u4f1a\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u81ea\u8eab\u80fd\u529b\u6781\u5ea6\u4e0d\u81ea\u4fe1\uff0c\u5bb3\u6015\u6295\u5165\u540e\u518d\u6b21\u5931\u8d25\uff0c\u9677\u5165\u201c\u5b66\u4e0d\u4f1a-\u8d5a\u4e0d\u5230\u94b1\u201d\u7684\u6076\u6027\u5faa\u73af\uff0c\u672c\u8d28\u662f\u5bfb\u6c42\u4e00\u4efd\u786e\u5b9a\u6027\u548c\u5b89\u5168\u611f\uff0c\u4ee5\u62b5\u5fa1\u5931\u4e1a\u6216\u6536\u5165\u4e0d\u7a33\u5e26\u6765\u7684\u751f\u5b58\u7126\u8651\u3002**\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5373\u65f6\u3001\u5177\u4f53\u3001\u53ef\u9a8c\u8bc1\u7684\u5fae\u5c0f\u6b63\u53cd\u9988**\uff0c\u4ee5\u53ca\u4e00\u4e2a\u201c\u624b\u628a\u624b\u3001\u7edd\u4e0d\u4f1a\u51fa\u9519\u201d\u7684\u4fdd\u59c6\u5f0f\u5b66\u4e60\u8def\u5f84\uff0c\u7528\u4ee5\u5bf9\u51b2\u5176\u5185\u5fc3\u7684\u5de8\u5927\u6050\u60e7\u548c\u81ea\u5351\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5 C2\u7c7b** (\u52a8\u673a\u5c1a\u53ef\u4f46\u8d44\u6e90\u5e95\u5ea7\u548c\u5fc3\u7406\u5f39\u6027\u53cc\u4f4e\uff0c\u98ce\u9669\u6781\u9ad8) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u6838\u5fc3\u7279\u5f81\uff1a\u81ea\u5351\u3001\u6613\u53d7\u632b\u3001\u9700\u8981\u6301\u7eed\u60c5\u7eea\u5b89\u629a\u548c\u6781\u5ea6\u7b80\u5316\u7684\u8def\u5f84) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\ud83d\udfe1 **\u9ec4\u706f\u9884\u8b66\uff0c\u903c\u8fd1\u7ea2\u7ebf\uff01** (\u672a\u76f4\u63a5\u89e6\u53d1\u501f\u8d37\uff0c\u4f46\u201c\u8981\u94b1\u201d\u884c\u4e3a\u5df2\u6784\u6210\u9ad8\u98ce\u9669\u4fe1\u53f7)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u652f\u4ed8\u80fd\u529b\u4e0d\u8db3\uff0c\u9700\u5916\u90e8\u7b79\u63aa\u8d44\u91d1\uff0c\u5bb6\u5ead\u652f\u6301\u5ea6\u5b58\u7591\uff0c\u6781\u6613\u56e0\u7ecf\u6d4e\u538b\u529b\u6216\u5bb6\u5ead\u77db\u76fe\u5f15\u53d1\u9000\u8d39\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u9ad8** | \u4e3a\u62a5\u540d\u5411\u5bb6\u4eba\u8981\u94b1\u88ab\u62d2\u6216\u5f15\u53d1\u4e89\u5435\uff0c\u6210\u4e3a\u9000\u8d39\u76f4\u63a5\u5bfc\u706b\u7d22\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u56e0\u5bb6\u5ead\u4e8b\u52a1\uff08\u5982\u5ba2\u4eba\u6765\u8bbf\uff09\u4e2d\u65ad\u5b66\u4e60\uff0c\u4ea7\u751f\u79ef\u538b\u548c\u81ea\u8d23\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u7b2c\u4e00\u4efd\u4f5c\u4e1a\u53d7\u632b\u3001\u8f6f\u4ef6\u5b89\u88c5\u5931\u8d25\u3001\u8ddf\u4e0d\u4e0a\u76f4\u64ad\u8282\u594f\u7b49\u4efb\u4f55\u5fae\u5c0f\u56f0\u96be\uff0c\u90fd\u53ef\u80fd\u76f4\u63a5\u51fb\u57ae\u5176\u4fe1\u5fc3\uff0c\u8bf4\u51fa\u201c\u6211\u592a\u7b28\u4e86\uff0c\u5b66\u4e0d\u4f1a\u201d\u5e76\u8981\u6c42\u9000\u8d39\u3002** |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u5b66\u4e601-2\u5468\u540e\uff0c\u53d1\u73b0\u65e0\u6cd5\u7acb\u5373\u5199\u51fa\u201c\u5438\u5f15\u4eba\u201d\u7684\u6545\u4e8b\uff0c\u53d8\u73b0\u65e0\u671b\uff0c\u4ea7\u751f\u88ab\u6b3a\u9a97\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c\u4e00\u5468\u81f3\u7b2c\u4e8c\u5468**\u3002\u9996\u6b21\u6b63\u5f0f\u4f5c\u4e1a\u63d0\u4ea4\u524d\u540e\uff0c\u662f\u5176\u81ea\u4fe1\u5fc3\u6700\u8106\u5f31\u7684\u65f6\u671f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u540c\u5b66\u4f60\u597d\uff0c\u770b\u5230\u4f60\u5df2\u7ecf\u52c7\u6562\u5730\u8fc8\u51fa\u4e86\u7b2c\u4e00\u6b65\uff0c\u7279\u522b\u4e3a\u4f60\u9ad8\u5174\uff01\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u7a0b\u8bbe\u8ba1\u5c31\u662f\u2018\u5c0f\u6b65\u5feb\u8dd1\u2019\uff0c\u6bcf\u5b8c\u6210\u4e00\u4e2a\u5c0f\u4efb\u52a1\u90fd\u6709\u660e\u786e\u53cd\u9988\u3002\u4f60\u5b8c\u5168\u4e0d\u7528\u62c5\u5fc3\u2018\u5b66\u4e0d\u4f1a\u2019\uff0c\u56e0\u4e3a\u6211\u548c\u70b9\u8bc4\u8001\u5e08\u4f1a\u50cf\u2018\u5bfc\u822a\u2019\u4e00\u6837\uff0c\u4e00\u6b65\u4e00\u6b65\u544a\u8bc9\u4f60\u2018\u5f80\u5de6\u8f6c\u2019\u3001\u2018\u5f80\u53f3\u8f6c\u2019\uff0c\u4f60\u53ea\u9700\u8981\u8ddf\u7740\u8d70\u5c31\u884c\u3002\u6709\u4efb\u4f55\u5361\u4f4f\u7684\u5730\u65b9\uff0c\u54ea\u6015\u518d\u5c0f\uff0c\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u89e3\u51b3\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\u3011**\u3002\u6838\u5fc3\u76ee\u6807\u662f\u5efa\u7acb\u4fe1\u5fc3\uff0c\u800c\u975e\u8ffd\u6c42\u786c\u6838\u4ea7\u51fa\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u6ee1\u914d **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u5305\u62ec\uff1a1\uff09\u6bcf\u65e5\u6253\u5361\u9f13\u52b1\uff1b2\uff09\u4f5c\u4e1a\u53ea\u8981\u6c42\u201c\u5b8c\u6210\u201d\u800c\u975e\u201c\u5b8c\u7f8e\u201d\uff0c\u5e76\u7ed9\u4e88\u5938\u5f20\u8d5e\u7f8e\uff1b3\uff09\u63d0\u4f9b\u201c\u4e00\u952e\u53bb\u566a\u201d\u7b49\u50bb\u74dc\u5f0f\u5de5\u5177\uff0c\u964d\u4f4e\u64cd\u4f5c\u95e8\u69db\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u5176\u65bd\u52a0\u4efb\u4f55\u4f5c\u4e1a\u96be\u5ea6\u548c\u8fdb\u5ea6\u538b\u529b**\uff0c\u7981\u6b62\u4f7f\u7528\u201c\u5176\u4ed6\u540c\u5b66\u90fd\u5b8c\u6210\u4e86\u201d\u7b49\u5bf9\u6bd4\u8bdd\u672f\u3002\n    2. **\u7981\u6b62\u5728\u524d\u671f\u8c08\u8bba\u201c\u9ad8\u7a3f\u8d39\u201d\u3001\u201c\u7206\u6b3e\u201d\u7b49\u7ed3\u679c\u9884\u671f**\uff0c\u805a\u7126\u4e8e\u201c\u4eca\u5929\u53c8\u638c\u63e1\u4e86\u4e00\u4e2a\u5c0f\u6280\u5de7\u201d\u3002\n    3. **\u4e25\u7981\u63a8\u8350\u4efb\u4f55\u5347\u5355\u6216\u9ad8\u4ef7\u8bfe\u7a0b**\uff0c\u907f\u514d\u52a0\u5267\u5176\u7ecf\u6d4e\u538b\u529b\u548c\u7126\u8651\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u5f00\u73ed\u540e\u81f3\u5c11\u4e09\u4e2a\u6708\u5185\uff0c\u4e25\u7981\u4efb\u4f55\u5f62\u5f0f\u7684\u5347\u5355**\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u8fd8\u662f\u4e0d\u884c\u3002\u770b\u7684\u6587\u592a\u591a\u4e86\u3002\u770b\u8fd9\u4e9bBug\u592a\u591a**\u201d *(\u66b4\u9732\u632b\u8d25\u611f\u4e0e\u81ea\u6211\u5426\u5b9a)*\n2. > \u201c**\u5de5\u8d44\u5230\u73b0\u5728\u6ca1\u53d1**\u201d / \u201c**\u6211\u5148\u53bb\u8981\u70b9\ud83d\udcb0**\u201d *(\u66b4\u9732\u8106\u5f31\u7684\u7ecf\u6d4e\u5e95\u5ea7\u548c\u652f\u4ed8\u9690\u60a3)*\n3. > \u201c**\u5b66\u5f88\u591a\uff0c\u6211\u6015\u5b66\u4e0d\u4f1a**\u201d *(\u6838\u5fc3\u6050\u60e7\uff1a\u80fd\u529b\u4e0d\u8db3\uff0c\u800c\u975e\u4e0d\u60f3\u5b66)*\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6\u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7528\u786e\u5b9a\u7684\u5b66\u4e60\u8def\u5f84\u6362\u53d6\u5b89\u5168\u611f\uff0c\u62b5\u5fa1\u5bf9\u81ea\u8eab\u80fd\u529b\u7684\u6df1\u5ea6\u7126\u8651\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7528\u6781\u81f4\u7b80\u5316\u7684\u6b65\u9aa4\u548c\u6cdb\u6ee5\u7684\u6b63\u9762\u53cd\u9988\uff0c\u4e3a\u5176\u642d\u5efa\u4e00\u4e2a\u201c\u7edd\u4e0d\u4f1a\u5931\u8d25\u201d\u7684\u5a74\u513f\u5b66\u6b65\u73af\u5883\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
