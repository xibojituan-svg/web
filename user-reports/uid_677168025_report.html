        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID 677168025 (\u6635\u79f0\uff1a\u9e9f\u9e9f) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u4e00\u6c40\u96ea(\u59dc\u9e23) \u2192 \u6854\u5b50JZT(\u7a0b\u5c55\u6b22) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u6f14\u64ad\u9ad8\u9636\u8bfe\u7a0b |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3** (\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1 (\u6bcf\u65e5\u7ea62\u5c0f\u65f6\uff0c\u9700\u517c\u987e\u770b\u5b69\u5b50) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3** (\u672a\u63d0\u53ca\u5bb6\u5ead\u6001\u5ea6) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49** (\u6709\u804c\u4e1a\u3001\u65f6\u95f4\u3001\u5b66\u4e60\u53cd\u9988\u4fe1\u606f\uff0c\u4f46\u7f3a\u4e4f\u652f\u4ed8\u3001\u5bb6\u5ead\u3001\u6df1\u5c42\u52a8\u673a\u4fe1\u606f) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u27a1\u4e2d\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u5bf9\u884c\u4e1a\u53d8\u73b0\u8def\u5f84\uff08\u753b\u672c\u3001\u5ba1\u542c\uff09\u8868\u73b0\u51fa\u660e\u786e\u5174\u8da3\uff0c\u8ba4\u53ef\u5176\u201c\u81ea\u7531\u3001\u53ef\u53c2\u4e0e\u5de5\u4f5c\u591a\u201d\u7684\u4f18\u70b9\uff0c\u4f46\u540c\u65f6\u4e5f\u8868\u73b0\u51fa\u201c\u95e8\u5916\u6c49\uff0c\u4e86\u89e3\u4e86\u89e3\u201d\u7684\u89c2\u671b\u5fc3\u6001\uff0c\u672a\u8868\u73b0\u51fa\u6781\u901f\u53d8\u73b0\u7684\u72c2\u70ed\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8fd9\u4e2a\u884c\u4e1a\u771f\u7684\u633a\u597d\uff0c\u81ea\u7531\uff0c\u800c\u4e14\u53ef\u53c2\u4e0e\u5f97\u5de5\u4f5c\u4e5f\u591a\u201d > \u201c\u4e1c\u5317\u5473\u5176\u5b9e\u633a\u597d\u542c\uff0c\u6211\u8fd9\u662f\u95e8\u5916\u6c49\uff0c\u4e86\u89e3\u4e86\u89e3\u5427\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u2b07\u4f4e** \u2014 \u660e\u786e\u8868\u793a\u201c\u6bcf\u5929\u80fd\u62bd\u51fa2\u5c0f\u65f6\u5de6\u53f3\u201d\uff0c\u4e14\u665a\u4e0a\u9700\u8981\u201c\u770b\u7740\u5b69\u5b50\u201d\uff0c\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\u4e14\u6709\u9650\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u7528\u6237\u4e3b\u52a8\u66b4\u9732\u81ea\u8eab\u77ed\u677f\uff08\u201c\u524d\u540e\u9f3b\u97f3\u4e0d\u5206\u201d\uff09\uff0c\u5e76\u7528\u201c\u95e8\u5916\u6c49\u201d\u81ea\u5632\uff0c\u663e\u793a\u51fa\u5bf9\u81ea\u8eab\u80fd\u529b\u7684\u4e0d\u81ea\u4fe1\u548c\u6f5c\u5728\u7684\u754f\u96be\u60c5\u7eea\u3002\u9762\u5bf9\u9500\u552e\u201c\u6ca1\u5173\u7cfb\uff0c\u91cd\u70b9\u662f\u6f14\u64ad\u6280\u5de7\u201d\u7684\u9f13\u52b1\uff0c\u4ec5\u56de\u590d\u201c\u597d\u5427\u201d\uff0c\u672a\u8868\u73b0\u51fa\u79ef\u6781\u7684\u81ea\u6211\u8c03\u6574\u6216\u63a2\u7d22\u6b32\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u662f\u524d\u540e\u9f3b\u97f3\u4e0d\u5206[\u6342\u8138]\u201d > \u201c\u4e1c\u5317\u5473\u5176\u5b9e\u633a\u597d\u542c\uff0c\u6211\u8fd9\u662f\u95e8\u5916\u6c49\uff0c\u4e86\u89e3\u4e86\u89e3\u5427\u201d > \u201c\u6709\u6536\u83b7\uff0c\u542c\u7740\u7b80\u5355\uff0c\u4f46\u662f\u81ea\u5df1\u53bb\u8bfb\u7684\u65f6\u5019\u8fd8\u662f\u633a\u96be\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u5f53\u524d\u7ecf\u6d4e\u73af\u5883\uff08\u201c\u73b0\u5728\u7ecf\u6d4e\u5927\u73af\u5883\u90fd\u5f88\u5dee\u201d\uff09\u548c\u672a\u6765\u804c\u4e1a\u5b89\u5168\uff08\u201c\u968f\u65f6\u4f1a\u5931\u4e1a\u201d\uff09\u7684\u666e\u904d\u6027\u7126\u8651\uff0c\u5e0c\u671b\u901a\u8fc7\u53d1\u5c55\u526f\u4e1a\u83b7\u5f97\u4e00\u4efd\u201c\u5b89\u5168\u611f\u201d\u548c\u201c\u9000\u8def\u201d\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u9632\u62a4\u76fe\u5f0f\u7684\u5b89\u5168\u611f\u4e0e\u4f4e\u95e8\u69db\u7684\u80af\u5b9a**\u3002\u9700\u8981\u4e0d\u65ad\u5f3a\u8c03\u201c\u6ca1\u5173\u7cfb\u201d\u3001\u201c\u6162\u6162\u6765\u201d\uff0c\u5e76\u63d0\u4f9b\u6e05\u6670\u3001\u7b80\u5355\u3001\u53ef\u6267\u884c\u7684\u8def\u5f84\uff0c\u6d88\u9664\u5176\u56e0\u201c\u95e8\u5916\u6c49\u201d\u8eab\u4efd\u548c\u6280\u672f\u77ed\u677f\uff08\u524d\u540e\u9f3b\u97f3\uff09\u4ea7\u751f\u7684\u5b66\u4e60\u6050\u60e7\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2** \u7c7b (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74** (\u4e25\u91cd\u5185\u8017) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u7b49\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4e2d | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u9700\u8b66\u60d5\u56e0\u5b66\u4e60\u6324\u5360\u5e26\u5a03\u65f6\u95f4\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u65f6\u95f4\u788e\u7247\u5316\u4e14\u6709\u9650\uff08\u6bcf\u59292\u5c0f\u65f6\uff0c\u665a\u4e0a\u5e26\u5a03\uff09\uff0c\u4e00\u65e6\u8bfe\u7a0b\u8282\u594f\u52a0\u5feb\u6216\u4f5c\u4e1a\u96be\u5ea6\u63d0\u5347\uff0c\u6781\u6613\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u81ea\u8d23\u3001\u653e\u5f03\u3002** |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u7528\u6237\u5df2\u81ea\u66dd\u77ed\u677f\uff08\u524d\u540e\u9f3b\u97f3\uff09\uff0c\u5bf9\u5b9e\u64cd\uff08\u201c\u81ea\u5df1\u53bb\u8bfb\u96be\u201d\uff09\u6709\u754f\u96be\u60c5\u7eea\u3002\u4efb\u4f55\u6280\u672f\u6027\u6279\u8bc4\u6216\u590d\u6742\u64cd\u4f5c\u90fd\u53ef\u80fd\u89e6\u53d1\u5176\u201c\u6211\u592a\u7b28\u4e86\u201d\u7684\u81ea\u5351\u611f\uff0c\u5bfc\u81f4\u77ac\u95f4\u5d29\u6e83\u9000\u8d39\u3002** |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u5bf9\u201c\u753b\u672c\u3001\u5ba1\u542c\u201d\u7b49\u5177\u4f53\u5c97\u4f4d\u6709\u5174\u8da3\uff0c\u82e5\u77ed\u671f\u5185\u65e0\u6cd5\u63a5\u89e6\u5230\u76f8\u5173\u5b9e\u8df5\u6216\u6536\u76ca\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2\u5468\u5de6\u53f3\uff0c\u9996\u6b21\u63d0\u4ea4\u9ad8\u96be\u5ea6\u4f5c\u4e1a\u6216\u8fdb\u884c\u89d2\u8272\u97f3\u8003\u6838\u65f6\u3002**\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u9e9f\u9e9f\u4f60\u597d\u5440\uff01\u770b\u5230\u4f60\u4e4b\u524d\u8bf4\u81ea\u5df1\u662f\u2018\u95e8\u5916\u6c49\u2019\uff0c\u8fd8\u62c5\u5fc3\u524d\u540e\u9f3b\u97f3\uff0c\u8fd9\u592a\u6b63\u5e38\u5566\uff01\u54b1\u4eec\u73ed\u91cc\u597d\u591a\u5927\u795e\u4e00\u5f00\u59cb\u90fd\u8fd9\u6837\u3002\u522b\u6015\uff0c\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u5c31\u662f\u7ed9\u2018\u95e8\u5916\u6c49\u2019\u5f00\u7684\u95e8\uff0c\u6bcf\u4e00\u6b65\u6211\u90fd\u966a\u7740\u4f60\uff0c\u54b1\u4eec\u4e0d\u8ddf\u522b\u4eba\u6bd4\uff0c\u5c31\u6bd4\u6628\u5929\u7684\u81ea\u5df1\u8fdb\u6b65\u4e00\u70b9\u70b9\u5c31\u597d\u3002\u4f60\u6bcf\u5929\u80fd\u62bd2\u5c0f\u65f6\u5df2\u7ecf\u5f88\u68d2\u4e86\uff0c\u54b1\u4eec\u5c31\u5229\u7528\u597d\u8fd92\u5c0f\u65f6\uff0c\u7a33\u7a33\u5730\u5b66\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u9002\u8001\u4f34\u98de\u8425\u3011** (\u4ea7\u54c1\u7ebfC)\u3002\u6838\u5fc3\u662f**\u5168\u966a\u4f34\u3001\u4fdd\u59c6\u7ea7\u3001\u964d\u7ef4\u64cd\u4f5c**\uff0c\u800c\u975e\u9ad8\u538b\u786c\u6838\u8bad\u7ec3\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u6ee1\u914d **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305 (C\u6a21\u5757)\u3011**\u3002\u63d0\u4f9b\u201c\u8f6e\u6905\u7ea7\u201d\u60c5\u7eea\u6258\u5e95\uff0c\u7528\u6781\u5938\u5f20\u7684\u8d5e\u7f8e\u66ff\u4ee3\u6280\u672f\u6279\u8bc4\u3002\u521d\u671f\u53ef\u642d\u914d **\u3010\u964d\u7ef4\u7269\u7406\u4ee3\u529e (\u7279\u79cdA\u6a21\u5757)\u3011**\uff0c\u5e2e\u52a9\u5176\u5b8c\u6210\u590d\u6742\u7684\u8f6f\u4ef6\u5b89\u88c5\u3001\u4f5c\u4e1a\u63d0\u4ea4\u7b49\u64cd\u4f5c\uff0c\u8de8\u8d8a\u6570\u5b57\u64cd\u4f5c\u6050\u60e7\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5bf9\u5176\u4f5c\u4e1a\u8fdb\u884c\u51b7\u51b0\u51b0\u7684\u6280\u672f\u6311\u523a\uff1b\u7528\u201c\u522b\u4eba\u90fd\u884c\u4f60\u600e\u4e48\u4e0d\u884c\u201d\u65bd\u538b\uff1b\u5e03\u7f6e\u8d85\u51fa\u51762\u5c0f\u65f6\u7cbe\u529b\u4e0a\u9650\u7684\u590d\u6742\u4efb\u52a1\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u57fa\u7840\u6280\u80fd\u672a\u7a33\u5b9a\u3001\u81ea\u4fe1\u5fc3\u672a\u5efa\u7acb\u524d\u8fdb\u884c\u4efb\u4f55\u5347\u5355\u63a8\u9500**\u3002\u4f18\u5148\u8003\u8651\u4f4e\u5ba2\u5355\u4ef7\u3001\u9ad8\u60c5\u7eea\u4ef7\u503c\u7684\u8f7b\u4ea4\u4ed8\u4ea7\u54c1\uff08\u5982\u58f0\u97f3\u7f8e\u5316\u5305\uff09\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u662f\u524d\u540e\u9f3b\u97f3\u4e0d\u5206[\u6342\u8138]\u201d \n2. > \u201c\u4e1c\u5317\u5473\u5176\u5b9e\u633a\u597d\u542c\uff0c\u6211\u8fd9\u662f\u95e8\u5916\u6c49\uff0c\u4e86\u89e3\u4e86\u89e3\u5427\u201d\n3. > \u201c\u6709\u6536\u83b7\uff0c\u542c\u7740\u7b80\u5355\uff0c\u4f46\u662f\u81ea\u5df1\u53bb\u8bfb\u7684\u65f6\u5019\u8fd8\u662f\u633a\u96be\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u9700\u6c42\u2014\u2014\u5bfb\u6c42\u4e00\u4efd\u4e0d\u53d7\u7ecf\u6d4e\u6ce2\u52a8\u5f71\u54cd\u7684\u526f\u4e1a\u4fdd\u969c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u6ee1\u914d\u60c5\u7eea\u6258\u5e95(C\u6a21\u5757) + \u964d\u7ef4\u7269\u7406\u4ee3\u529e(\u7279\u79cdA\u6a21\u5757)\uff0c\u7528\u6781\u81f4\u7684\u5b89\u5168\u611f\u5305\u88f9\u5176\u8106\u5f31\u7684\u81ea\u4fe1\u5fc3\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u9002\u8001\u4f34\u98de\u8425\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
