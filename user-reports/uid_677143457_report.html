    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u804a\u5929\u8bb0\u5f55\u4e3b\u8981\u8986\u76d6\u8f6c\u5316\u671f\u53ca\u652f\u4ed8\u73af\u8282\uff0c\u7f3a\u4e4f\u7528\u6237\u80cc\u666f\u3001\u5bb6\u5ead\u72b6\u51b5\u3001\u804c\u4e1a/\u5b66\u4e1a\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u3001\u652f\u4ed8\u80fd\u529b\u7b49\u5173\u952e\u4fe1\u606f\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a\u4e2d\u7b49\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6709\u58f0\u6f14\u64ad\u7684\u5174\u8da3\u548c\u70ed\u60c5\uff08\u5982\u4e0a\u9ea6\u540e\u201c\u597d\u6fc0\u52a8\u201d\uff09\uff0c\u5e76\u79ef\u6781\u53c2\u4e0e\u7ec3\u4e60\u548c\u53cd\u9988\u3002\u4f46\u652f\u4ed8\u73af\u8282\u663e\u793a**\u51b3\u7b56\u53d7\u9500\u552e\u5f15\u5bfc\u548c\u9650\u65f6\u798f\u5229\uff08\u5982\u7248\u6743\u4e66\u3001\u540d\u989d\uff09\u5f71\u54cd\u8f83\u5927**\uff0c\u5b58\u5728\u51b2\u52a8\u6d88\u8d39\u7279\u5f81\u3002\u6df1\u5c42\u804c\u4e1a\u89c4\u5212\u6216\u6280\u80fd\u63d0\u5347\u52a8\u673a\u4e0d\u660e\u786e\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u6781\u4f4e\u98ce\u9669**\u3002\u7528\u6237\u4e3a\u4e2a\u4eba\u652f\u4ed8\uff08\u652f\u4ed8\u5b9d\u4f59\u989d4000\u5143\uff09\uff0c\u4e14\u9500\u552e\u660e\u786e\u8981\u6c42\u201c\u4e00\u5b9a\u8981\u7236\u6bcd\u77e5\u6653\u201d\uff0c\u7528\u6237\u4e5f\u63d0\u53ca\u9700\u5bb6\u957f\u534f\u52a9\u5bf9\u516c\u652f\u4ed8\u3002\u8868\u660e\u5176\u4e3a**\u7ecf\u6d4e\u672a\u5b8c\u5168\u72ec\u7acb\u7684\u5e74\u8f7b\u4eba\uff08\u53ef\u80fd\u4e3a\u5b66\u751f\uff09**\uff0c\u652f\u4ed8\u80fd\u529b\u6709\u9650\uff0c\u4f46\u5bb6\u5ead\u53ef\u80fd\u63d0\u4f9b\u652f\u6301\u3002\u65f6\u95f4\u8d44\u6e90\u4e0a\uff0c\u80fd\u8ddf\u4e0a\u8bad\u7ec3\u8425\u8282\u594f\uff0c\u4f46\u672a\u63d0\u53ca\u56fa\u5b9a\u5b66\u4e60\u65f6\u6bb5\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a\u4e2d\u7b49\u504f\u9ad8\u3002\u5b66\u4e60\u6001\u5ea6\u79ef\u6781\uff0c\u670d\u4ece\u6027\u5f3a\uff08\u201c\u597d\u7684\u8001\u5e08/\u5e08\u59d0\u201d\u9ad8\u9891\u51fa\u73b0\uff09\uff0c\u80fd\u63a5\u53d7\u53cd\u9988\u5e76\u5c1d\u8bd5\u8c03\u6574\u3002\u4f46\u5728\u9762\u4e34\u652f\u4ed8\u969c\u788d\uff08\u4f59\u989d\u4e0d\u8db3\uff09\u65f6\u8868\u73b0\u51fa\u4f9d\u8d56\uff08\u201c\u6211\u4e0d\u77e5\u9053\u6211\u600e\u4e48\u8ddf\u6211\u7238\u5988\u8bf4\u201d\uff09\u548c\u6025\u5207\uff08\u201c\u6211\u597d\u60f3\u62a5\u201d\uff09\uff0c**\u81ea\u4e3b\u51b3\u7b56\u548c\u95ee\u9898\u89e3\u51b3\u80fd\u529b\u8f83\u5f31**\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**\uff1a\u5df2\u652f\u4ed8\u3002\u652f\u4ed8\u65b9\u5f0f\u4e3a\u652f\u4ed8\u5b9d\u8f6c\u8d26\uff08\u90e8\u5206\u4f59\u989d+\uff1f\uff09\uff0c\u91d1\u989d\u4e3a3980\u5143\uff08\u7cbe\u82f1\u8bfe\u7a0b\uff09\u3002**\u5173\u952e\u70b9\uff1a\u7528\u6237\u652f\u4ed8\u65f6\u4f59\u989d\u4e0d\u8db3\uff0c\u4e14\u9500\u552e\u5728\u7528\u6237\u63d0\u51fa\u201c\u5bf9\u516c\u7684\u8bdd\uff0c\u90a3\u6211\u5f97\u8ba9\u6211\u7684\u5bb6\u957f\u5e2e\u6211\u4ed8\u201d\u540e\uff0c\u4ecd\u5f15\u5bfc\u5176\u5148\u62a5\u4f4e\u4ef7\u8bfe\u7a0b\u5e76\u627f\u8bfa\u53ef\u540e\u7eed\u5347\u7ea7\uff0c\u672a\u575a\u51b3\u6682\u505c\u6d41\u7a0b\u786e\u8ba4\u5bb6\u5ead\u77e5\u60c5\u4e0e\u652f\u6301\u3002**\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u672a\u901a\u8fc7**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u9700\u8981\u5bb6\u957f\u4ed8\u6b3e\uff08\u201c\u8ba9\u6211\u7684\u5bb6\u957f\u5e2e\u6211\u4ed8\u201d\uff09\u4e14\u4e0d\u77e5\u5982\u4f55\u4e0e\u7236\u6bcd\u6c9f\u901a\uff0c\u9500\u552e\u4ec5\u8f7b\u63cf\u6de1\u5199\u56de\u5e94\u201c\u597d\u597d\u8ddf\u7236\u6bcd\u6c9f\u901a\u54e6\u201d\u3001\u201c\u4e00\u5b9a\u8ddf\u7236\u6bcd\u8bf4\u4e00\u4e0b\u4f60\u8981\u5b66\u4e60\u6709\u58f0\u54e6\u201d\uff0c\u968f\u5373\u7ee7\u7eed\u63a8\u8fdb\u652f\u4ed8\u548c\u540e\u7eed\u6d41\u7a0b\u3002**\u5bb6\u5ead\u51b3\u7b56\u6743\u672a\u786e\u8ba4\uff0c\u5b58\u5728\u91cd\u5927\u5408\u89c4\u98ce\u9669\u3002**\n*   **\u6b65\u9aa42 - \u6700\u7ec8\u5224\u5b9a**\uff1a**D\u7c7b\uff08\u4f9d\u8d56\u578b\u51b3\u7b56\u8005\uff09**\u3002\u7528\u6237\u5b66\u4e60\u884c\u4e3a\u670d\u4ece\uff0c\u4f46\u91cd\u5927\u8d22\u52a1\u51b3\u7b56\u4f9d\u8d56\u5916\u90e8\uff08\u5bb6\u5ead\uff09\uff0c\u4e14\u9500\u552e\u672a\u5b8c\u6210\u5fc5\u8981\u786e\u8ba4\u3002\u52a8\u673a\u53d7\u5373\u65f6\u5956\u52b1\u548c\u5173\u7cfb\u7ed1\u5b9a\uff08\u201c\u4f60\u662f\u6211\u5e26\u5165\u884c\u7684\u201d\uff09\u9a71\u52a8\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **T7 \u51b2\u52a8\u5c1d\u9c9c\u8005**\uff1a\u7b26\u5408\u6838\u5fc3\u7279\u5f81\u3002\u88ab\u8bad\u7ec3\u8425\u7684\u5373\u65f6\u53cd\u9988\u3001\u4e0a\u9ea6\u4f53\u9a8c\u3001\u7248\u6743\u4e66\u798f\u5229\u3001\u9500\u552e\u7684\u4e2a\u4eba\u627f\u8bfa\uff08\u201c\u6211\u5e26\u4f60\u201d\uff09\u5feb\u901f\u6fc0\u53d1\u5174\u8da3\u548c\u8d2d\u4e70\u51b2\u52a8\u3002\u5bf9\u884c\u4e1a\u957f\u671f\u6295\u5165\u548c\u56f0\u96be\u8ba4\u77e5\u4e0d\u8db3\uff0c\u51b3\u7b56\u8f7b\u7387\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669**\uff1a**\u9ad8**\u3002\n*   **\u6839\u56e0\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u4e0d\u7b26\u9884\u671f**\uff1a\u4e2d\u3002\u7528\u6237\u5bf9\u5b66\u4e60\u6709\u70ed\u60c5\uff0c\u4f46\u53ef\u80fd\u5bf9\u201c\u5feb\u901f\u53d8\u73b0\u201d\u548c\u201c\u5e08\u59d0\u5e26\u4f60\u201d\u7684\u627f\u8bfa\u6709\u8fc7\u9ad8\u671f\u5f85\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u9ad8**\u3002\u7528\u6237\u81ea\u8eab\u652f\u4ed8\u80fd\u529b\u660e\u663e\u4e0d\u8db3\uff08\u4f59\u989d\u4e0d\u8db3\uff09\uff0c\u9700\u5bb6\u5ead\u652f\u6301\u3002\u82e5\u5bb6\u5ead\u4e0d\u540c\u610f\u6216\u540e\u7eed\u611f\u5230\u7ecf\u6d4e\u538b\u529b\uff0c\u9000\u8d39\u98ce\u9669\u6781\u9ad8\u3002\n    3.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u6781\u9ad8**\u3002**\u9500\u552e\u6d41\u7a0b\u4e2d\u6700\u5927\u7684\u96f7\u533a**\u3002\u5bb6\u5ead\u5b8c\u5168\u4e0d\u77e5\u60c5\u6216\u53cd\u5bf9\u7684\u53ef\u80fd\u6027\u6781\u5927\uff0c\u662f\u672a\u6765\u9000\u8d39\u7684\u6700\u53ef\u80fd\u5bfc\u706b\u7d22\u3002\n    4.  **\u65f6\u95f4\u51b2\u7a81**\uff1a\u4f4e\u3002\u76ee\u524d\u770b\u65f6\u95f4\u53ef\u534f\u8c03\u3002\n    5.  **\u8bfe\u7a0b\u8d28\u91cf**\uff1a\u4e2d\u3002\u6682\u672a\u4f53\u73b0\u3002\n    6.  **\u670d\u52a1\u4f53\u9a8c**\uff1a\u4f4e\u3002\u76ee\u524d\u9500\u552e\u670d\u52a1\u79ef\u6781\u3002\n    7.  **\u9500\u552e\u8bef\u5bfc**\uff1a**\u4e2d\u9ad8**\u3002\u9500\u552e\u5b58\u5728**\u5f15\u5bfc\u7528\u6237\u89c4\u907f\u5bb6\u5ead\u51b3\u7b56**\u7684\u5acc\u7591\uff08\u5efa\u8bae\u5148\u62a5\u4f4e\u4ef7\u8bfe\u518d\u5347\u7ea7\uff09\uff0c\u5e76\u8fc7\u5ea6\u627f\u8bfa\u8d44\u6e90\uff08\u201c\u7ed9\u4f60\u6311\u4e86\u4e00\u672c\u7248\u6743\u4e66 \u540d\u989d\u5df2\u7ecf\u5360\u4e0b\u201d\uff09\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u91cd\u5927\u8fdd\u89c4**\uff1a\n    *   **\u672a\u6838\u5b9e\u5bb6\u5ead\u77e5\u60c5\u540c\u610f**\uff1a\u5728\u7528\u6237\u660e\u786e\u8868\u8fbe\u652f\u4ed8\u9700\u5bb6\u957f\u534f\u52a9\u4e14\u6c9f\u901a\u56f0\u96be\u65f6\uff0c\u672a\u7ec8\u6b62\u6d41\u7a0b\u575a\u6301\u6838\u5b9e\uff0c\u8fdd\u53cd\u4e86\u9488\u5bf9\u7ecf\u6d4e\u975e\u72ec\u7acb\u7528\u6237\u7684\u6838\u5fc3\u98ce\u63a7\u539f\u5219\u3002\n    *   **\u8bf1\u5bfc\u89c4\u907f\u51b3\u7b56\u969c\u788d**\uff1a\u5728\u7528\u6237\u652f\u4ed8\u80fd\u529b\u4e0d\u8db3\u65f6\uff0c\u5f15\u5bfc\u5176\u9009\u62e9\u4f4e\u4ef7\u8bfe\u7a0b\u5e76\u627f\u8bfa\u201c\u540e\u7eed\u53ef\u5347\u7ea7\u201d\uff0c\u5b9e\u8d28\u662f\u964d\u4f4e\u5f53\u4e0b\u51b3\u7b56\u95e8\u69db\uff0c\u5c06\u5bb6\u5ead\u53cd\u5bf9\u98ce\u9669\u540e\u7f6e\u3002\n*   **\u5408\u89c4\u7455\u75b5**\uff1a\n    *   \u8fc7\u5ea6\u4f7f\u7528\u201c\u4fdd\u8fc7\u201d\u3001\u201c\u5360\u540d\u989d\u201d\u3001\u201c\u5a18\u5bb6\u4eba\u201d\u7b49\u60c5\u611f\u7ed1\u5b9a\u548c\u7a00\u7f3a\u6027\u8bdd\u672f\u3002\n    *   \u53d8\u73b0\u627f\u8bfa\uff08\u201c\u5feb\u901f\u6323\u5230\u7b2c\u4e00\u6876\u91d1\u201d\uff09\u8f83\u4e3a\u6a21\u7cca\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**24\u5c0f\u65f6\u5185\u7d27\u6025\u6838\u5b9e\u5bb6\u5ead\u77e5\u60c5\u4e0e\u652f\u6301\u60c5\u51b5**\n*   **\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u7d27\u6025\u98ce\u63a7\u4ecb\u5165**\uff1a\u73ed\u4e3b\u4efb\u9996\u8054\u5fc5\u987b\u6e29\u548c\u4f46\u575a\u5b9a\u5730\u6838\u5b9e\u8bfe\u7a0b\u8d2d\u4e70\u662f\u5426\u83b7\u5f97\u5bb6\u5ead\uff08\u7236\u6bcd\uff09\u77e5\u60c5\u4e0e\u5168\u989d\u652f\u6301\u3002\u9700\u83b7\u53d6\u660e\u786e\u8bc1\u636e\uff08\u5982\u5bb6\u957f\u77e5\u60c5\u5f55\u97f3/\u6587\u5b57\u786e\u8ba4\uff09\u3002\n    2.  **\u6821\u6b63\u9884\u671f**\uff1a\u660e\u786e\u544a\u77e5\u5b66\u4e60\u8def\u5f84\u3001\u53d8\u73b0\u5468\u671f\u548c\u96be\u5ea6\uff0c\u964d\u4f4e\u5176\u201c\u5e08\u59d0\u5168\u7a0b\u5e26\u98de\u201d\u7684\u4e0d\u5207\u5b9e\u9645\u671f\u671b\u3002\u5f3a\u8c03\u4e2a\u4eba\u52aa\u529b\u4e0e\u6301\u7eed\u7ec3\u4e60\u7684\u91cd\u8981\u6027\u3002\n    3.  **\u5f3a\u5316\u652f\u6301**\uff1a\u56e0\u5176\u670d\u4ece\u6027\u597d\uff0c\u53ef\u5efa\u7acb\u89c4\u5f8b\u7684\u5b66\u4e60\u8ddf\u8fdb\u8ba1\u5212\uff0c\u7ed9\u4e88\u5177\u4f53\u3001\u53ca\u65f6\u7684\u6b63\u53cd\u9988\uff0c\u5de9\u56fa\u5176\u5b66\u4e60\u4e60\u60ef\u548c\u5174\u8da3\u3002\n    4.  **\u9884\u6848\u51c6\u5907**\uff1a\u505a\u597d\u5bb6\u5ead\u8054\u7cfb\u540e\u53ef\u80fd\u53d1\u751f\u9000\u8d39\u7684\u9884\u6848\uff0c\u51c6\u5907\u7eff\u8272\u901a\u9053\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u8bc4\u4f30**\uff1a**\u504f\u5dee**\u3002\u7528\u6237\u52a8\u673a\u504f\u5174\u8da3\u5c1d\u9c9c\u548c\u60c5\u611f\u4f9d\u8d56\uff0c\u4f46\u8d2d\u4e70\u7684\u4ea7\u54c1\uff08\u7cfb\u7edf\u8bfe\uff09\u9700\u8981\u8f83\u5f3a\u7684\u81ea\u5f8b\u6027\u548c\u957f\u671f\u6295\u5165\u3002\u5176\u7ecf\u6d4e\u57fa\u7840\u548c\u5bb6\u5ead\u652f\u6301\u5ea6\u5b58\u5728\u91cd\u5927\u9690\u60a3\uff0c\u4e0e\u8bfe\u7a0b\u6240\u9700\u7684\u7a33\u5b9a\u6295\u5165\u524d\u63d0\u4e0d\u5339\u914d\u3002\n\n{\"core_type\": \"T7 \u51b2\u52a8\u5c1d\u9c9c\u8005\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"product_match\": \"\u504f\u5dee\", \"action\": \"24\u5c0f\u65f6\u5185\u7d27\u6025\u6838\u5b9e\u5bb6\u5ead\u77e5\u60c5\"}";
