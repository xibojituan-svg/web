    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a55119555\u7684\u7528\u6237\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 55119555 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u68a6\u5883\uff08\u90d1\u5b87\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bad\u7ec3\u8425\uff08\u4f53\u9a8c\u8425\u9636\u6bb5\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u6d89\u53ca\u4ed8\u6b3e\u884c\u4e3a\uff0c\u65e0\u6cd5\u5224\u65ad\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u4ec5\u77e5\u4e3a\u201c\u81ea\u7531\u4eba\u201d\uff0c\u65f6\u95f4\u81ea\u7531\u5ea6\u53ef\u80fd\u8f83\u9ad8\uff0c\u4f46\u5177\u4f53\u4f5c\u606f\u672a\u77e5\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\uff08\u6709\u57fa\u7840\u753b\u50cf\uff0c\u4f46\u7f3a\u4e4f\u5173\u952e\u98ce\u9669\u7ef4\u5ea6\u4fe1\u606f\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **[\u2b07\u4f4e]**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u5174\u8da3\u9a71\u52a8\u4e3a\u4e3b\uff0c\u53d8\u73b0\u4e3a\u6b21\u8981\u6216\u9644\u5e26\u671f\u671b\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u8bd5\u8bd5\u81ea\u5df1\u58f0\u97f3\u7684\u9b45\u529b\u201d\uff0c\u5c06\u7231\u597d\u53d8\u73b0\u662f\u201c\u5f53\u7136\u6700\u597d\u201d\uff0c\u4f46\u5e76\u975e\u552f\u4e00\u6216\u8feb\u5207\u76ee\u7684\u3002\u52a8\u673a\u66f4\u504f\u5411\u4e8e\u81ea\u6211\u63a2\u7d22\u548c\u5174\u8da3\u6ee1\u8db3\uff0c\u800c\u975e\u201c\u51e0\u5929\u5185\u63d0\u73b0\u201d\u7684\u6781\u7aef\u53d8\u73b0\u8bc9\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8bd5\u8bd5\u81ea\u5df1\u58f0\u97f3\u7684\u9b45\u529b[\u6109\u5feb]\u201d > \u201c\u5e74\u8f7b\u65f6\u5c31\u559c\u6b22\u770b\u4e66\uff0c\u770b\u5230\u9ad8\u5174\u4e86\u5c31\u5927\u58f0\u7684\u6717\u8bf5\u51fa\u6765\uff0c\u800c\u4eca\u6709\u673a\u4f1a\u628a\u7231\u597d\u53d8\u73b0\u5f53\u7136\u6700\u597d\uff0c\u4e0d\u60f3\u592a\u7ea6\u675f\u81ea\u5df1\uff0c\u517c\u804c\u5373\u53ef\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **[\u27a1\u4e2d]**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u7528\u623757\u5c81\uff0c\u804c\u4e1a\u201c\u81ea\u7531\u4eba\u201d\uff0c\u6709\u7ecf\u6d4e\u80fd\u529b\u540c\u65f6\u62a5\u540d\u201c\u8425\u517b\u5e08\u201d\u548c\u201c\u559c\u64ad\u201d\u8bfe\u7a0b\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u6d88\u8d39\u80fd\u529b\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u8d22\u52a1\u72b6\u51b5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u201c\u81ea\u7531\u4eba\u201d\u8eab\u4efd\u610f\u5473\u7740\u65f6\u95f4\u76f8\u5bf9\u81ea\u7531\uff0c\u80fd\u8ddf\u4e0a\u9500\u552e\u5b89\u6392\u7684\u5404\u9879\u4efb\u52a1\uff08\u6253\u5361\u3001\u5f55\u97f3\u3001\u542c\u8bfe\uff09\u3002\u4f46\u5e74\u9f8457\u5c81\uff0c\u7cbe\u529b\u4e0e\u5b66\u4e60\u65b0\u4e8b\u7269\u7684\u6548\u7387\u53ef\u80fd\u4e0d\u53ca\u5e74\u8f7b\u4eba\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u60c5\u51b5\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **[\u2b07\u4f4e\u6781\u5371]**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u663e\u7684\u6280\u672f\u4e0d\u81ea\u4fe1\u548c\u51b3\u7b56\u4f9d\u8d56\u3002\u9762\u5bf9\u9009\u4e66\u4efb\u52a1\u65f6\uff0c\u8fde\u7eed\u8ffd\u95ee\u201c\u4e0d\u5f97\u8981\u9886\u554a\ud83d\ude26\u201d\u3001\u201c\u9ebb\u70e6\u8001\u5e08\u7ed9\u4e2a\u5efa\u8bae\u5457\u201d\uff0c\u5e76\u76f4\u8a00\u201c\u559c\u6b22\u4f60\u76f8\u4fe1\u4f60\u201d\uff0c\u663e\u793a\u51fa\u5f3a\u70c8\u7684\u201c\u6309\u952e\u7ea7\u7269\u7406\u6295\u5582\u201d\u9700\u6c42\u3002\u5e74\u9f84\u56e0\u7d20\u53ef\u80fd\u52a0\u5267\u4e86\u9762\u5bf9\u6570\u5b57\u64cd\u4f5c\u65f6\u7684\u6050\u614c\u548c\u4e0d\u81ea\u4fe1\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u9009\u4e66 \u96be\u9053\u8001\u5e08\u7ed9\u4e2a\u5efa\u8bae\u5457[\u73ab\u7470]\u201d > \u201c\u4e0d\u5f97\u8981\u9886\u554a\ud83d\ude26\u201d > \u201c\u559c\u6b22\u4f60\u76f8\u4fe1\u4f60[\u73ab\u7470]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34** ] \u4e0e [ **\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6570\u5b57\u65f6\u4ee3\u7684\u8131\u8282\u611f\u4e0e\u6280\u80fd\u4e0d\u81ea\u4fe1**\u300257\u5c81\u7684\u201c\u81ea\u7531\u4eba\u201d\uff0c\u867d\u6709\u65f6\u95f4\u548c\u5174\u8da3\uff0c\u4f46\u5728\u9762\u5bf9\u65b0\u5e73\u53f0\u3001\u65b0\u4efb\u52a1\uff08\u5982\u9009\u4e66\u3001\u64cd\u4f5c\u5c0f\u7a0b\u5e8f\uff09\u65f6\uff0c\u8868\u73b0\u51fa\u660e\u663e\u7684\u8ff7\u832b\u548c\u4f9d\u8d56\u3002\u5979\u9700\u8981\u88ab\u5f15\u9886\u3001\u88ab\u80af\u5b9a\uff0c\u4ee5\u5bf9\u6297\u201c\u88ab\u65f6\u4ee3\u629b\u5f03\u201d\u7684\u7126\u8651\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u3001\u88ab\u9700\u8981\u3001\u88ab\u5475\u62a4\u201d\u7684\u7ebf\u4e0a\u957f\u8f88\u5f0f\u60c5\u611f\u62a4\u822a**\u3002\u63d0\u4f9b\u660e\u786e\u7684\u6b65\u9aa4\u6307\u5f15\u3001\u6beb\u4e0d\u541d\u556c\u7684\u8d5e\u7f8e\uff08\u9500\u552e\u5df2\u505a\uff09\uff0c\u5e76\u6784\u5efa\u4e00\u4e2a\u5b89\u5168\u3001\u6709\u5f52\u5c5e\u611f\u7684\u7ebf\u4e0a\u5b66\u4e60\u793e\u7fa4\uff0c\u8ba9\u5979\u611f\u5230\u81ea\u5df1\u6709\u4ef7\u503c\u3001\u88ab\u5c0a\u91cd\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T9 \u6570\u5b57\u76f2\u533a\u96be\u6c11** (\u6781\u91cd\u62a4\u822a\u578b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5c5e\u53cd\u5bf9\u4fe1\u53f7\u3002\u4f46\u9700\u8b66\u60d5\u56e0\u64cd\u4f5c\u56f0\u96be\u6216\u5b66\u4e60\u632b\u8d25\u611f\u5bfc\u81f4\u7684\u60c5\u7eea\u5d29\u6e83\u9000\u8d39\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f4657\u5c81\u201c\u81ea\u7531\u4eba\u201d\u53ef\u80fd\u5bb6\u5ead\u5e72\u9884\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u4e00\u65e6\u8bfe\u7a0b\u8fdb\u5165\u5b9e\u64cd\u9636\u6bb5\uff08\u5982\u4f7f\u7528AU\u8f6f\u4ef6\u3001\u590d\u6742\u5e73\u53f0\u64cd\u4f5c\uff09\uff0c\u6781\u53ef\u80fd\u56e0\u201c\u5b66\u4e0d\u4f1a\u201d\u3001\u201c\u627e\u4e0d\u5230\u201d\u800c\u4ea7\u751f\u5de8\u5927\u632b\u8d25\u611f\uff0c\u81ea\u8d23\u60c5\u7eea\u7d2f\u79ef\u540e\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u7528\u6237\u5df2\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u4f9d\u8d56\u6027\u548c\u4e0d\u81ea\u4fe1\u3002\u4efb\u4f55\u4e00\u6b21\u4f5c\u4e1a\u88ab\u62d2\u3001\u64cd\u4f5c\u5931\u8d25\uff0c\u6216\u611f\u89c9\u201c\u88ab\u5ffd\u7565\u201d\uff08\u5982\u672a\u53ca\u65f6\u5f97\u5230\u56de\u590d\uff09\uff0c\u90fd\u53ef\u80fd\u89e6\u53d1\u201c\u6211\u592a\u7b28\u4e86\uff0c\u7b97\u4e86\u201d\u7684\u9000\u8d39\u5ff5\u5934\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u5bf9\u201c\u7231\u597d\u53d8\u73b0\u201d\u6709\u671f\u5f85\uff0c\u4f46\u5e76\u975e\u552f\u4e00\u76ee\u7684\u3002\u82e5\u957f\u65f6\u95f4\uff08\u59821-2\u4e2a\u6708\uff09\u65e0\u4efb\u4f55\u6b63\u5411\u53cd\u9988\uff08\u5982\u63a5\u5230\u5c0f\u5355\u3001\u83b7\u5f97\u8ba4\u53ef\uff09\uff0c\u5174\u8da3\u53ef\u80fd\u6d88\u9000\uff0c\u4ea7\u751f\u201c\u6d6a\u8d39\u65f6\u95f4\u201d\u7684\u60f3\u6cd5\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c1-2\u5468\uff0c\u9996\u6b21\u63a5\u89e6\u590d\u6742\u8f6f\u4ef6/\u72ec\u7acb\u5b8c\u6210\u590d\u6742\u4efb\u52a1\u65f6**\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u5979\u8bf4......\u201d**\n> \u201c\u963f\u745e\u59d0\uff0c\u770b\u5230\u60a8\u8fd9\u4e48\u70ed\u7231\u6717\u8bfb\uff0c\u771f\u7684\u7279\u522b\u611f\u52a8\u3002\u54b1\u4eec\u8fd9\u4e2a\u5e74\u9f84\u8fd8\u80fd\u52c7\u6562\u5c1d\u8bd5\u65b0\u4e8b\u7269\uff0c\u672c\u8eab\u5c31\u662f\u4e00\u4ef6\u7279\u522b\u9177\u7684\u4e8b\uff01\u60a8\u653e\u5fc3\uff0c\u63a5\u4e0b\u6765\u7684\u5b66\u4e60\uff0c\u60a8\u4e0d\u7528\u6015\u4efb\u4f55\u64cd\u4f5c\u4e0a\u7684\u9ebb\u70e6\uff0c\u6240\u6709\u586b\u8868\u3001\u8fdb\u7fa4\u3001\u4ea4\u4f5c\u4e1a\u7684\u6b65\u9aa4\uff0c\u60a8\u968f\u65f6\u558a\u6211\uff0c\u6211\u4e00\u6b65\u6b65\u5e26\u7740\u60a8\u5f04\u3002\u54b1\u4eec\u4e0d\u56fe\u5feb\uff0c\u5c31\u56fe\u4e2a\u5f00\u5fc3\u548c\u8fdb\u6b65\uff0c\u60a8\u6709\u4efb\u4f55\u4e00\u70b9\u5c0f\u6210\u5c31\uff0c\u6211\u90fd\u7b2c\u4e00\u4e2a\u7ed9\u60a8\u9f13\u638c\uff01\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u9002\u8001\u9632\u8131\u8282\u4f34\u98de\u8425\uff08\u4ea7\u54c1\u7ebfC\uff09**\u3011\u3002\u6838\u5fc3\u662f\u966a\u4f34\u4e0e\u5b89\u5168\u611f\uff0c\u800c\u975e\u786c\u6838\u6280\u672f\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u6ee1\u914d\u3010**\u6838\u5f39\u7ea7\u7279\u79cdA(\u8fdc\u7a0b\u7269\u7406\u4ee3\u529e)**\u3011\u4e0e\u3010**\u6ee1\u914d\u7279\u79cdC(\u51cc\u6668\u60c5\u7eea\u6258\u5e95)**\u3011\u3002\u7528\u201c\u9738\u603b\u5f0f\u4e00\u952e\u5305\u529e\u201d\u8de8\u8d8a\u6570\u5b57\u9e3f\u6c9f\uff0c\u7528\u201c\u7ebf\u4e0a\u957f\u8f88\u5f0f\u60c5\u611f\u62a4\u822a\u201d\u5efa\u7acb\u6df1\u5ea6\u4fe1\u4efb\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7ed9\u5979\u53d1\u56fe\u6587\u64cd\u4f5c\u624b\u518c\u6216\u8bf4\u201c\u60a8\u81ea\u5df1\u518d\u770b\u770b\u6559\u7a0b\u201d\uff1b\u5728\u5979\u6c42\u52a9\u65f6\u56de\u590d\u8fc7\u6162\uff1b\u7528\u6280\u672f jargon\uff08\u5982\u201cAU\u201d\u3001\u201c\u538b\u9650\u5668\u201d\uff09\u8fdb\u884c\u6559\u5b66\uff1b\u5728\u5979\u9762\u524d\u8fc7\u5ea6\u5938\u5956\u5e74\u8f7b\u5b66\u5458\u7684\u5feb\u901f\u8fdb\u6b65\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u57fa\u7840\u6280\u80fd\u672a\u7a33\u56fa\u3001\u60c5\u7eea\u672a\u5efa\u7acb\u7edd\u5bf9\u5b89\u5168\u611f\u524d\u8fdb\u884c\u4efb\u4f55\u5347\u5355\u63a8\u9500**\u3002\u4f18\u5148\u8003\u8651\u4f4e\u5ba2\u5355\u4ef7\u3001\u9ad8\u60c5\u7eea\u4ef7\u503c\u7684\u201c\u58f0\u97f3\u7eaa\u5ff5\u54c1\u201d\u7b49\u8f7b\u4ea4\u4ed8\u4ea7\u54c1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u8bd5\u8bd5\u81ea\u5df1\u58f0\u97f3\u7684\u9b45\u529b[\u6109\u5feb]**\u201d \u2014\u2014 \u6838\u5fc3\u52a8\u673a\u662f\u5174\u8da3\u63a2\u7d22\uff0c\u975e\u529f\u5229\u53d8\u73b0\u3002\n2. > \u201c**\u9009\u4e66 \u96be\u9053\u8001\u5e08\u7ed9\u4e2a\u5efa\u8bae\u5457[\u73ab\u7470]**\u201d / \u201c**\u4e0d\u5f97\u8981\u9886\u554a\ud83d\ude26**\u201d \u2014\u2014 \u5178\u578b\u7684\u6280\u672f\u64cd\u4f5c\u4f9d\u8d56\u4e0e\u51b3\u7b56\u4e0d\u81ea\u4fe1\u4fe1\u53f7\u3002\n3. > \u201c**\u559c\u6b22\u4f60\u76f8\u4fe1\u4f60[\u73ab\u7470]**\u201d \u2014\u2014 \u60c5\u611f\u4f9d\u8d56\u6027\u5f3a\uff0c\u5c06\u4fe1\u4efb\u5b8c\u5168\u6258\u4ed8\u7ed9\u9500\u552e/\u73ed\u4e3b\u4efb\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T9 \u6570\u5b57\u76f2\u533a\u96be\u6c11\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u8de8\u8d8a\u6570\u5b57\u9e3f\u6c9f\u7684\u5b89\u5168\u611f\u4e0e\u7ebf\u4e0a\u966a\u4f34\u7684\u5c0a\u91cd\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u542f\u52a8\u201c\u9738\u603b\u5f0f\u4e00\u952e\u5305\u529e\u201d\u670d\u52a1\uff0c\u73ed\u4e3b\u4efb\u5316\u8eab\u7ebf\u4e0a\u201c\u5b50\u5973\u201d\uff0c\u7269\u7406\u4ee3\u529e\u6240\u6709\u590d\u6742\u64cd\u4f5c\uff0c\u5e76\u7528\u9ad8\u9891\u3001\u5938\u5f20\u7684\u8d5e\u7f8e\u5efa\u7acb\u60c5\u611f\u62a4\u57ce\u6cb3\u3011**\u3002\n\n```json\n{\"core_type\": \"T9 \u6570\u5b57\u76f2\u533a\u96be\u6c11\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u793e\u4ea4/\u5c0a\u91cd\", \"target_product_line\": \"\u9002\u8001\u4f34\u98de\u8425\uff08\u4ea7\u54c1\u7ebfC\uff09\"}\n```";
