    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u4e48\u6709\u4e48\u6709\u9e2d (UID: 676520707) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-23 \u81f3 2026-01-27 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u8721\u7b14(\u738b\u601d\u4f73) / \u4e45\u9605\u73ed\u73ed |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6500\u767b\u8ba1\u5212\u8fdb\u9636\u7248 (\u5df2\u8d2d\uff0c\u5ef6\u671f\u81f33\u670826\u65e5\u5f00\u8425) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u8d44\u91d1\u6765\u6e90\u6216\u5bb6\u5ead\u7ecf\u6d4e\u72b6\u51b5\u8ba8\u8bba\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u9700\u517c\u987e\u80b2\u513f\uff08\u201c\u54c4\u5b69\u5b50\u7761\u89c9\u201d\uff09\u3001\u5bb6\u52a1\u3001\u4e2a\u4eba\u5b66\u4e60\u53ca\u793e\u7fa4\u6d3b\u52a8\u7ec4\u7ec7\uff0c\u65f6\u95f4\u88ab\u9ad8\u5ea6\u5207\u5272\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u4eba\u5bf9\u5b66\u4e60\u7684\u6001\u5ea6\uff08\u652f\u6301\u6216\u53cd\u5bf9\uff09\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u804a\u5929\u8bb0\u5f55\u8be6\u7ec6\u5c55\u793a\u4e86\u7528\u6237\u5728\u793e\u7fa4\u4e2d\u7684\u6d3b\u8dc3\u5ea6\u3001\u7ec4\u7ec7\u80fd\u529b\u548c\u5b66\u4e60\u72b6\u6001\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u2b06\u9ad8]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u793e\u7fa4\u5f52\u5c5e\u800c\u6765\uff0c\u5174\u8da3\u9a71\u52a8\u660e\u663e\uff0c\u5173\u6ce8\u5b66\u4e60\u8fc7\u7a0b\u4e0e\u793e\u7fa4\u6d3b\u52a8\u7ec4\u7ec7\uff0c\u65e0\u4efb\u4f55\u77ed\u671f\u53d8\u73b0\u6216\u4fdd\u5e95\u627f\u8bfa\u8981\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u6eda\u53bb\u5f04\u4f5c\u4e1a\u4e86\u201d\uff1b > \u201c\u6bd5\u4e1a\u665a\u4f1a\uff0c\u53ef\u4e0d\u5f97\u5f04\u5f97\u6f02\u6f02\u4eae\u4eae\u201d\uff1b > \u201c\u540c\u65f6\u4e0a\u4e24\u4e2a\u8bfe\u987e\u4e0d\u4e0a\u6765\u201d\uff08\u4e3b\u52a8\u5ef6\u671f\u8fdb\u9636\u8bfe\u4ee5\u4fdd\u8bc1\u5b66\u4e60\u8d28\u91cf\uff09\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4fe1\u606f\u4e0d\u8db3] \u2014 \u672a\u63d0\u53ca\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 \u7528\u6237\u65f6\u95f4\u88ab\u80b2\u513f\u3001\u5b66\u4e60\u3001\u793e\u7fa4\u7ec4\u7ec7\u591a\u91cd\u5360\u7528\uff08\u201c\u611f\u89c9\u8fd9\u51e0\u5929\u5c31\u6ca1\u505c\u4e0b\u6765\u8fc7\u201d\uff09\uff0c\u4f46\u80fd\u901a\u8fc7\u9ad8\u6548\u89c4\u5212\uff08\u201c\u6211\u6eda\u53bb\u5f04\u4f5c\u4e1a\u4e86\u201d\u3001\u201c\u4e00\u4f1a\u5199\u5b8c\u6211\u518d\u56de\u6765\u722c\u697c\u201d\uff09\u5b8c\u6210\u591a\u9879\u4efb\u52a1\uff0c\u7cbe\u529b\u7ba1\u7406\u80fd\u529b\u8f83\u5f3a\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u4e0d\u8db3] \u2014 \u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9047\u5230\u95ee\u9898\uff08\u5982\u4f5c\u4e1a\u622a\u6b62\u65f6\u95f4\u7591\u60d1\u3001\u6280\u672f\u95ee\u9898\uff09\u4e3b\u52a8\u8be2\u95ee\u3001\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u5e76\u5feb\u901f\u8c03\u6574\u884c\u52a8\uff08\u201c\u5148\u4ea4\u4e00\u4efd\u4fdd\u5e95\u201d\uff09\u3002\u60c5\u7eea\u7a33\u5b9a\uff0c\u4e50\u4e8e\u52a9\u4eba\uff0c\u65e0\u62b1\u6028\u6216\u4f9d\u8d56\u503e\u5411\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4e0d\u884c\uff0c\u6211\u73b0\u5728\u5148\u4ea4\u4e00\u4efd\u3002\u665a\u70b9\u505a\u5b8c\u540e\u671f\u518d\u63d0\u4ea4\u4e00\u4e0b\u4fee\u6539\u7684\u3002\u4fdd\u5e95\u662f\u4ea4\u4e86\u7684\u201d\uff1b > \u201c\u6ca1\u4e8b\uff0c\u6211\u6765\u5f04\u201d\uff08\u4e3b\u52a8\u627f\u62c5\u6280\u672f\u96be\u9898\uff09\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42** \u4e0e **\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5728\u7e41\u5fd9\u7684\u80b2\u513f\u4e0e\u4e2a\u4eba\u751f\u6d3b\u4e2d\uff0c**\u6e34\u671b\u83b7\u5f97\u9ad8\u8d28\u91cf\u7684\u793e\u7fa4\u8fde\u63a5\u3001\u8ba4\u53ef\u4e0e\u6210\u5c31\u611f**\u3002\u901a\u8fc7\u4e3b\u52a8\u627f\u62c5\u6bd5\u4e1a\u665a\u4f1a\u4e3b\u6301\u4eba\u53ca\u7ec4\u7ec7\u8005\u7684\u89d2\u8272\uff0c\u5bfb\u6c42\u5728\u96c6\u4f53\u4e2d\u7684\u4ef7\u503c\u4f53\u73b0\u548c\u88ab\u9700\u8981\u7684\u611f\u89c9\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u8d4b\u4e88\u5176\u201c\u5708\u5c42\u9886\u8896\u201d\u7684\u8eab\u4efd\u8ba4\u540c\u4e0e\u516c\u5f00\u8868\u5f70**\uff0c\u6ee1\u8db3\u5176\u88ab\u5c0a\u91cd\u548c\u83b7\u5f97\u5f52\u5c5e\u611f\u7684\u6838\u5fc3\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\u2b50A \u7c7b** (\u9ad8\u52a8\u673a\u3001\u9ad8\u5f39\u6027\u3001\u8d44\u6e90\u5e95\u5ea7\u4e2d\u7b49\u4f46\u7ba1\u7406\u80fd\u529b\u5f3a\u7684\u6d3b\u8dc3\u6838\u5fc3\u7528\u6237) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T1 \u5708\u517b\u9886\u8896\u578b** (\u4e3b\u52a8\u627f\u62c5\u7ec4\u7ec7\u5de5\u4f5c\uff0c\u4eab\u53d7\u7edf\u7b79\u534f\u8c03\uff0c\u4e50\u4e8e\u670d\u52a1\u793e\u7fa4\uff0c\u5bfb\u6c42\u8ba4\u53ef\u4e0e\u9886\u5bfc\u5730\u4f4d) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u8868\u73b0\u51fa\u8f83\u5f3a\u7684\u72ec\u7acb\u6027\u548c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\uff0c\u5bb6\u5ead\u7a81\u53d1\u91cd\u5927\u53d8\u6545\u53ef\u80fd\u6027\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u7528\u6237\u5df2\u8bc1\u660e\u5176\u5728\u9ad8\u5f3a\u5ea6\u591a\u4efb\u52a1\u4e0b\u7684\u8ddf\u8fdb\u80fd\u529b\u3002\u98ce\u9669\u70b9\u5728\u4e8e**\u540c\u65f6\u5b66\u4e60\u591a\u4e2a\u8bfe\u7a0b\u5bfc\u81f4\u7cbe\u529b\u8fc7\u5ea6\u5206\u6563**\uff08\u5df2\u4e3b\u52a8\u5ef6\u671f\u4e00\u95e8\uff09\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u4e0d\u5c5e\u4e8e\u60c5\u7eea\u6613\u788e\u578b\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u6781\u4f4e | \u52a8\u673a\u975e\u77ed\u671f\u53d8\u73b0\uff0c\u5bf9\u5b66\u4e60\u8fc7\u7a0b\u548c\u793e\u7fa4\u4f53\u9a8c\u7684\u6ee1\u610f\u5ea6\u9ad8\u4e8e\u5bf9\u5373\u65f6\u6536\u76ca\u7684\u671f\u5f85\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u4f4e\u98ce\u9669**\u3002\u5982\u9047\u98ce\u9669\uff0c\u53ef\u80fd\u5728**\u5f00\u8bfe\u521d\u671f\u56e0\u8bfe\u7a0b\u5185\u5bb9\u4e0e\u793e\u7fa4\u671f\u5f85\u4e0d\u7b26\uff08\u5982\u7f3a\u4e4f\u4e92\u52a8\u3001\u6210\u5c31\u611f\u4f4e\uff09** \u800c\u4ea7\u751f\u5931\u671b\u60c5\u7eea\uff0c\u4f46\u9000\u8d39\u51b2\u52a8\u4f4e\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4e48\u6709\u4e48\u6709\u9e2d\uff0c\u770b\u5230\u4f60\u5728\u4e45\u9605\u73ed\u6bd5\u4e1a\u665a\u4f1a\u4e0a\u7684\u7edf\u7b79\u80fd\u529b\u592a\u51fa\u8272\u4e86\uff0c\u7b80\u76f4\u662f\u5929\u751f\u7684\u7ec4\u7ec7\u8005\uff01\u65b0\u4e00\u671f\u7684\u6500\u767b\u8ba1\u5212\uff0c\u73ed\u73ed\u7279\u522b\u5e0c\u671b\u4f60\u80fd\u7ee7\u7eed\u53d1\u6325\u9886\u8896\u624d\u80fd\uff0c\u6bd4\u5982\u62c5\u4efb\u54b1\u4eec\u65b0\u73ed\u7ea7\u7684\u2018\u58f0\u97f3\u6d3b\u52a8\u5b98\u2019\u6216\u8005\u73ed\u957f\uff0c\u5e26\u7740\u5927\u5bb6\u4e00\u8d77\u73a9\u51fa\u82b1\u6837\u3001\u5b66\u51fa\u6210\u679c\u3002\u4f60\u7684\u7ecf\u9a8c\u548c\u70ed\u60c5\uff0c\u662f\u73ed\u7ea7\u6700\u5b9d\u8d35\u7684\u8d22\u5bcc\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf**\u3011\u3002\u5c06\u5176\u7eb3\u5165\u73ed\u59d4\u4f53\u7cfb\uff0c\u8d4b\u4e88\u5176\u6d3b\u52a8\u7b56\u5212\u3001\u65b0\u4eba\u5f15\u5bfc\u7b49\u804c\u8d23\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u8eab\u4efd\u5149\u73af\u5305**\u3011\u3002\u63d0\u4f9b\u5982\u201c\u660e\u661f\u5b66\u5458\u201d\u3001\u201c\u793e\u7fa4\u8d21\u732e\u5956\u201d\u7b49\u865a\u62df\u8363\u8a89\uff0c\u5e76\u5728\u793e\u7fa4\u5185\u516c\u5f00\u8868\u626c\u5176\u8d21\u732e\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5c06\u5176\u89c6\u4e3a\u666e\u901a\u5b66\u5458\u8fdb\u884c\u5355\u5411\u77e5\u8bc6\u704c\u8f93\u3002**\u7edd\u4e0d\u8981\u5ffd\u89c6\u6216\u5426\u5b9a\u5176\u7ec4\u7ec7\u8d21\u732e**\uff0c\u907f\u514d\u8ba9\u5176\u611f\u5230\u201c\u5de5\u5177\u4eba\u5316\u201d\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u8fdb\u884c\u5927\u989d\u63a8\u4ecb\uff08\u5982\u9ad8\u9636\u8bad\u7ec3\u8425\u3001\u7ebf\u4e0b\u6e38\u5b66\u3001\u7ec8\u8eab\u4f1a\u5458\uff09\u3002\u56e0\u5176\u8ffd\u6c42\u6df1\u5ea6\u5f52\u5c5e\u4e0e\u6210\u5c31\uff0c\u5bf9\u9ad8\u4ef7\u503c\u3001\u9ad8\u8eab\u4efd\u7684\u8fdb\u9636\u4ea7\u54c1\u6709\u6f5c\u5728\u9700\u6c42\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u6bd5\u4e1a\u665a\u4f1a\uff0c\u53ef\u4e0d\u5f97\u5f04\u5f97\u6f02\u6f02\u4eae\u4eae**\u201d \u2014\u2014 \u4f53\u73b0\u5bf9\u793e\u7fa4\u6d3b\u52a8\u7684\u6295\u5165\u611f\u548c\u8ffd\u6c42\u5b8c\u7f8e\u7684\u9886\u5bfc\u5fc3\u6001\u3002\n2. > \u201c**\u6211\u6eda\u53bb\u5f04\u4f5c\u4e1a\u4e86**\u201d \u2014\u2014 \u4f53\u73b0\u9ad8\u5ea6\u7684\u5b66\u4e60\u81ea\u4e3b\u6027\u548c\u6267\u884c\u529b\uff0c\u52a8\u673a\u5185\u9a71\u3002\n3. > \u201c**\u540c\u65f6\u4e0a\u4e24\u4e2a\u8bfe\u987e\u4e0d\u4e0a\u6765**\u201d \u2014\u2014 \u4f53\u73b0\u5bf9\u5b66\u4e60\u8d28\u91cf\u7684\u91cd\u89c6\u548c\u7406\u6027\u7684\u81ea\u6211\u89c4\u5212\u80fd\u529b\uff0c\u800c\u975e\u76f2\u76ee\u62a5\u8bfe\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T1 \u5708\u517b\u9886\u8896\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u793e\u7fa4\u4e2d\u83b7\u5f97\u5c0a\u91cd\u3001\u5f52\u5c5e\u611f\u4e0e\u9886\u5bfc\u5730\u4f4d\u7684\u8ba4\u53ef\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u8d4b\u4e88\u5176\u5b98\u65b9\u8eab\u4efd\u4e0e\u8363\u8000\uff0c\u5c06\u5176\u4ece\u201c\u5b66\u5458\u201d\u8f6c\u5316\u4e3a\u201c\u5408\u4f5c\u4f19\u4f34\u201d\u3011**\u3002\n\n```json\n{\"core_type\": \"T1 \u5708\u517b\u9886\u8896\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u793e\u4ea4\u4e0e\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\"}\n```";
