    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v3.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u6b78\u96f6-\u6d77\u53e3-\u5973\u64ad (UID: 676789554) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-25 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5c0f\u51b7\u73ed\u73ed(\u738b\u96ea) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u5df2\u8d2d\uff09\uff0c\u610f\u5411\u8ffd\u52a0\u540e\u671f\u8bfe\u7a0b\uff084\u670817\u65e5\u73ed\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u4ef7\u683c\u3001\u8d44\u91d1\u6765\u6e90\u7b49\u5173\u952e\u4fe1\u606f\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u9ad8\u5bbd\u88d5**\u3002\u7528\u6237\u80fd\u9891\u7e41\u5728\u767d\u5929\u3001\u665a\u95f4\u4e92\u52a8\uff0c\u53c2\u4e0e\u5c0f\u7ec4\u6392\u7ec3\uff08\u7ea6\u665a\u4e0a8\uff1a30\uff09\uff0c\u5e76\u4e3b\u52a8\u5b89\u6392\u65f6\u95f4\u91cd\u5f55\u3001\u8865\u8bfe\uff0c\u663e\u793a\u65f6\u95f4\u81ea\u4e3b\u6027\u5f3a\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\u6216\u51b3\u7b56\u8fc7\u7a0b\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u7f3a\u5931\u652f\u4ed8\u3001\u5bb6\u5ead\u3001\u804c\u4e1a\u3001\u6536\u5165\u7b49\u6838\u5fc3\u7ecf\u6d4e\u4e0e\u51b3\u7b56\u4fe1\u606f\uff0c\u4ec5\u80fd\u57fa\u4e8e\u5b66\u4e60\u884c\u4e3a\u8fdb\u884c\u6709\u9650\u5206\u6790\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06**\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u5173\u6ce8\u6280\u80fd\u7cbe\u8fdb\u3001\u4f5c\u54c1\u6253\u78e8\uff0c\u53d8\u73b0\u9884\u671f\u6a21\u7cca\u6216\u957f\u8fdc\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u770b\u770b\u6709\u6ca1\u6709\u53ef\u521b\u4f5c\u6027[\u5472\u7259]\u201d (2026-03-25 10:38:39)\n  > \u201c\u542c\u5b8c\u51a0\u519b\u4f5c\u54c1\uff0c\u611f\u89c9\u592a\u9065\u8fdc\uff0c\u76ee\u524d\u80fd\u52aa\u529b\u5230\u54ea\uff0c\u771f\u7684\u662f\u6ca1\u6709\u5e95[\u6342\u8138]\u4f46\u4e00\u5b9a\u5168\u529b\u4ee5\u8d74\uff0c\u4e0d\u60f3\u62d6\u6211\u4eec\u7ec4\u7684\u540e\u817f[\u62f3\u5934]\u201d (2026-04-02 09:58:52)\n  > \u5168\u7a0b\u56f4\u7ed5\u53d1\u97f3\u3001\u8282\u594f\u3001\u5bf9\u8f68\u3001\u6df7\u54cd\u7b49\u6280\u672f\u7ec6\u8282\u53cd\u590d\u8bf7\u6559\u548c\u7ec3\u4e60\uff0c\u65e0\u4efb\u4f55\u5173\u4e8e\u201c\u8d5a\u94b1\u201d\u3001\u201c\u53d8\u73b0\u201d\u3001\u201c\u63a5\u5355\u201d\u7684\u8be2\u95ee\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b06**\u9ad8**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u7ecf\u6d4e\u538b\u529b\u3001\u652f\u4ed8\u56f0\u96be\u6216\u4ef7\u683c\u654f\u611f\u3002\u4e3b\u52a8\u54a8\u8be2\u5e76\u8ba1\u5212\u62a5\u540d\u540e\u671f\u8fdb\u9636\u8bfe\u7a0b\uff084\u670817\u65e5\u73ed\uff09\uff0c\u6697\u793a\u6709\u6301\u7eed\u5b66\u4e60\u9884\u7b97\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u9ad8** \u2014 \u65f6\u95f4\u5145\u88d5\uff08\u767d\u5929\u3001\u665a\u4e0a\u5747\u53ef\u4e92\u52a8\u3001\u53c2\u4e0e\u5c0f\u7ec4\u6d3b\u52a8\uff09\uff0c\u7cbe\u529b\u5145\u6c9b\uff08\u80fd\u65e9\u8d77\u5f55\u97f3\u3001\u53cd\u590d\u91cd\u5f55\u3001\u4e3b\u52a8\u8981\u6c42\u8865\u8bfe\uff09\u3002\u5177\u5907\u9ad8\u5ea6\u81ea\u5f8b\u6027\u548c\u6267\u884c\u529b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u5bb6\u5ead\uff0c\u4f46\u65f6\u95f4\u81ea\u7531\u5ea6\u9ad8\uff0c\u4fa7\u9762\u6697\u793a\u53ef\u80fd\u65e0\u91cd\u5927\u5bb6\u5ead\u8d1f\u62c5\u6216\u5df2\u83b7\u652f\u6301\u3002\n- **\u5e95\u5ea7\u53d6\u77ed\u677f**\uff1a**\u9ad8**\u3002\u5c3d\u7ba1\u8d44\u91d1\u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u4ece\u5176\u79ef\u6781\u6295\u5165\u5b66\u4e60\u3001\u8ba1\u5212\u8ffd\u52a0\u8bfe\u7a0b\u7684\u884c\u4e3a\u63a8\u65ad\uff0c\u8d44\u91d1\u7ef4\u5ea6\u81f3\u5c11\u4e3a\u201c\u4e2d\u201d\uff0c\u4e14\u65f6\u95f4\u3001\u7cbe\u529b\u7ef4\u5ea6\u5747\u4e3a\u201c\u9ad8\u201d\uff0c\u6574\u4f53\u5e95\u5ea7\u7a33\u56fa\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06**\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\uff0c\u9047\u5230\u95ee\u9898\u4e3b\u52a8\u5bfb\u6c42\u5177\u4f53\u89e3\u51b3\u65b9\u6848\uff0c\u5fc3\u6001\u79ef\u6781\uff0c\u6297\u538b\u6027\u5f3a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u597d\u7684\uff0c\u90a3\u6211\u518d\u627e\u627e\u611f\u89c9\u201d (2026-03-28 09:13:51) \u2014 \u9762\u5bf9\u5c16\u9510\u58f0\u97f3\u95ee\u9898\uff0c\u4e3b\u52a8\u8c03\u6574\u3002\n  > \u201c\u6211\u542c\u7740\u602a\u522b\u626d\uff0c\u53c8\u4e0d\u77e5\u9053\u5f80\u54ea\u91cc\u6539\u201d (2026-03-28 17:42:20) \u2014 \u9047\u5230\u6280\u672f\u74f6\u9888\uff0c\u4e3b\u52a8\u3001\u5177\u4f53\u5730\u6c42\u52a9\u3002\n  > \u201c\u597d\u7684\uff0c\u627e\u5230\u4e00\u70b9\u70b9\u611f\u89c9\u4e86[\u5472\u7259]\u8c22\u8c22\u73ed\u73ed\u8010\u5fc3\u6307\u5bfc\u54c8\u201d (2026-03-28 22:16:21) \u2014 \u83b7\u5f97\u8fdb\u6b65\u540e\u79ef\u6781\u53cd\u9988\uff0c\u60c5\u7eea\u7a33\u5b9a\u6b63\u5411\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0** \u4e0e **\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u5f52\u5c5e** \u6df7\u5408\u9a71\u52a8\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u4e13\u4e1a\u80fd\u529b\u7cbe\u8fdb\u7684\u6e34\u671b\u4e0e\u4e0d\u6ee1\u8db3\u611f\uff08\u201c\u611f\u89c9\u592a\u9065\u8fdc\u201d\uff09\uff0c\u4ee5\u53ca\u5f3a\u70c8\u7684\u56e2\u961f\u8d23\u4efb\u611f\u548c\u5f52\u5c5e\u9700\u6c42\uff08\u201c\u4e0d\u60f3\u62d6\u6211\u4eec\u7ec4\u7684\u540e\u817f\u201d\uff09\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u6df1\u5ea6\u8ba4\u53ef\u4e0e\u6210\u957f\u8def\u5f84\u7684\u6e05\u6670\u6307\u5f15**\uff0c\u4ee5\u53ca**\u5728\u793e\u7fa4\u4e2d\u5efa\u7acb\u8fde\u63a5\u3001\u83b7\u5f97\u534f\u4f5c\u6210\u5c31\u611f\u7684\u673a\u4f1a**\u3002\u5979\u9700\u8981\u88ab\u770b\u89c1\u5728\u4e13\u4e1a\u4e0a\u7684\u52aa\u529b\u548c\u8fdb\u6b65\uff0c\u5e76\u4eab\u53d7\u4e0e\u540c\u597d\u5171\u540c\u521b\u4f5c\u7684\u4e50\u8da3\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\u2b50A\u7c7b (\u4ef7\u503c\u5171\u521b\u578b)** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u517c\u987e **T1 \u5708\u517b\u9886\u8896\u578b** \u6f5c\u8d28) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5ead\u51b2\u7a81\u7b49\u7ea2\u7ebf\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4f4e** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u57fa\u4e8e\u5176\u72ec\u7acb\u51b3\u7b56\u548c\u5b66\u4e60\u6295\u5165\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u6781\u4f4e** | \u65f6\u95f4\u7cbe\u529b\u5145\u6c9b\uff0c\u5b66\u4e60\u81ea\u5f8b\u6027\u5f3a\uff0c\u4e3b\u52a8\u6027\u5f3a\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u5230\u95ee\u9898\u4e3b\u52a8\u6c42\u89e3\uff0c\u5fc3\u6001\u79ef\u6781\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4f4e** | \u52a8\u673a\u7eaf\u5ea6\u9ad8\uff0c\u4e3a\u80fd\u529b\u800c\u6765\uff0c\u77ed\u671f\u5185\u5bf9\u53d8\u73b0\u65e0\u8feb\u5207\u8981\u6c42\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u6781\u4f4e\u98ce\u9669**\u3002\u82e5\u5b58\u5728\u98ce\u9669\uff0c\u53ef\u80fd\u51fa\u73b0\u5728 **\u8bfe\u7a0b\u5185\u5bb9\u6df1\u5ea6\u6216\u670d\u52a1\u8d28\u91cf\u65e0\u6cd5\u6ee1\u8db3\u5176\u9ad8\u9636\u5b66\u4e60\u9700\u6c42\u65f6**\uff0c\u4f8b\u5982\u611f\u5230\u201c\u5b66\u4e0d\u5230\u65b0\u4e1c\u897f\u201d\u6216\u201c\u6307\u5bfc\u6c34\u5e73\u6709\u9650\u201d\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6b78\u96f6\u540c\u5b66\uff0c\u770b\u5230\u4f60\u5728\u57fa\u7840\u8425\u91cc\u5bf9\u7ec6\u8282\u7684\u94bb\u7814\u548c\u56e2\u961f\u534f\u4f5c\u7684\u70ed\u60c5\uff0c\u975e\u5e38\u6b23\u8d4f\uff01\u63a5\u4e0b\u6765\u7684\u8bfe\u7a0b\u4f1a\u66f4\u6df1\u5165\uff0c\u6311\u6218\u4e5f\u66f4\u5927\u3002\u4f60\u662f\u6211\u4eec\u91cd\u70b9\u5173\u6ce8\u7684\u2018\u6f5c\u529b\u80a1\u2019\uff0c\u671f\u5f85\u4f60\u4e0d\u4ec5\u80fd\u81ea\u5df1\u5b66\u5f97\u624e\u5b9e\uff0c\u4e5f\u80fd\u5e26\u52a8\u5c0f\u7ec4\u4e00\u8d77\u8fdb\u6b65\u3002\u6709\u4efb\u4f55\u6df1\u5ea6\u95ee\u9898\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4eec\u4e00\u8d77\u653b\u514b\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** + **\u3010\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\u3011**\u3002\u5979\u5177\u5907\u6210\u4e3a\u6838\u5fc3\u5b66\u5458\u548c\u793e\u7fa4KOC\u7684\u6f5c\u8d28\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176T2\u5b9e\u5e72+T1\u9886\u8896\u6f5c\u8d28\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u9879\u76ee\u5b9e\u6218\u5e26\u7ec3\u5305\u3011** \u548c **\u3010\u5c0f\u7ec4\u957f/\u73ed\u59d4\u6fc0\u52b1\u7279\u6743\u3011**\uff0c\u7ed9\u4e88\u5176\u5e26\u9886\u56e2\u961f\u3001\u53c2\u4e0e\u9879\u76ee\u7684\u673a\u4f1a\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u5b9d\u5988\u7126\u8651\u201d\u3001\u201c\u5feb\u901f\u53d8\u73b0\u201d\u7b49\u4e0b\u6c89\u8bdd\u672f\u4e0e\u5176\u6c9f\u901a\uff0c\u8fd9\u4f1a\u4e25\u91cd\u9519\u914d\u5176\u9ad8\u9636\u9700\u6c42\u3002\u4e0d\u8981\u5c06\u5176\u89c6\u4e3a\u666e\u901a\u5b66\u5458\u8fdb\u884c\u6a21\u677f\u5316\u670d\u52a1\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u8fdb\u884c\u5927\u989d\u8bfe\u7a0b\u63a8\u4ecb\uff08\u5982\u9ad8\u9636\u5927\u5e08\u73ed\u3001\u4e13\u9879\u8bad\u7ec3\u8425\uff09\uff0c\u4f46**\u5356\u70b9\u5fc5\u987b\u662f\u201c\u6df1\u5ea6\u6280\u80fd\u7cbe\u8fdb\u201d\u3001\u201c\u5708\u5c42\u8d44\u6e90\u94fe\u63a5\u201d\u3001\u201c\u9879\u76ee\u5b9e\u6218\u673a\u4f1a\u201d**\uff0c\u800c\u975e\u201c\u63a5\u5355\u6e20\u9053\u201d\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u770b\u770b\u6709\u6ca1\u6709\u53ef\u521b\u4f5c\u6027[\u5472\u7259]\u201d **(\u9ad8\u52a8\u673a\u7eaf\u5ea6\uff0c\u4e3a\u521b\u4f5c\u80fd\u529b\u800c\u6765)**\n2. > \u201c\u4e0d\u60f3\u62d6\u6211\u4eec\u7ec4\u7684\u540e\u817f[\u62f3\u5934]\u201d **(\u9ad8\u56e2\u961f\u8d23\u4efb\u611f\u4e0e\u793e\u4ea4\u5f52\u5c5e\u9700\u6c42)**\n3. > \u201c\u6211\u542c\u7740\u602a\u522b\u626d\uff0c\u53c8\u4e0d\u77e5\u9053\u5f80\u54ea\u91cc\u6539\u201d **(\u9ad8\u5fc3\u7406\u5f39\u6027\uff0c\u5177\u4f53\u95ee\u9898\u5177\u4f53\u6c42\u52a9\uff0c\u975e\u60c5\u7eea\u5316\u62b1\u6028)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2\u4f4e\u8c03\u5b9e\u5e72\u578b\uff0c\u517c\u5177T1\u9886\u8896\u6f5c\u8d28\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7b2c\u4e94\u5c42\u81ea\u6211\u5b9e\u73b0\uff08\u4e13\u4e1a\u7cbe\u8fdb\uff09\u4e0e\u7b2c\u4e09\u5c42\u793e\u4ea4\u5f52\u5c5e\uff08\u56e2\u961f\u534f\u4f5c\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6df1\u5ea6\u4e13\u4e1a\u6307\u5bfc+\u8d4b\u4e88\u793e\u7fa4\u9886\u5bfc\u89d2\u8272\uff0c\u6ee1\u8db3\u5176\u9ad8\u9636\u6210\u957f\u4e0e\u4ef7\u503c\u5b9e\u73b0\u9700\u6c42\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b (\u517c\u5177T1\u6f5c\u8d28)\", \"risk_level\": \"\u6781\u4f4e\", \"refund_risk\": \"\u6781\u4f4e\", \"maslow_need\": \"\u81ea\u6211\u5b9e\u73b0+\u793e\u4ea4\u5f52\u5c5e\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u5708\u5c42\u5408\u4f19\u4eba\u7ebf + \u9879\u76ee\u5b9e\u6218\u5e26\u7ec3\u5305\"}\n```";
