    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | Cicy\u897f\u897f (UID: 676521105) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-12 \u81f3 2026-04-08 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5218\u6377\u3001\u5eb7\u8363\u4e66\u3001\u674e\u51b0\u88d5\u3001\u738b\u96c5\u4e3d |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66/\u77ed\u5267\u76f8\u5173\u8bfe\u7a0b\uff08\u5df2\u8d2d\u8bfe\uff0c\u5e76\u7eed\u62a5\u4e86\u201c\u660e\u661f\u73ed\u4e3b\u4efb\u201d\u73ed\u6b21\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u5145\u88d5\uff08\u4e3b\u52a8\u8d2d\u4e70299\u5143\u5bf9\u8f68\u5de5\u5177\uff0c\u5e76\u7eed\u62a5\u65b0\u73ed\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u6781\u4f4e/\u788e\u7247\u5316\u62fc\u51d1**\uff08\u56e0\u53cd\u590d\u4f4f\u9662\uff0c\u5b66\u4e60\u65f6\u95f4\u88ab\u4e25\u91cd\u6324\u538b\uff0c\u9700\u201c\u767d\u5929\u6709\u7cbe\u795e\u5c31\u8865\u8bfe\u201d\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\uff08\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\uff0c\u9700\u8b66\u60d5\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u5b66\u4e60\u884c\u4e3a\u3001\u60c5\u7eea\u3001\u7eed\u62a5\u51b3\u7b56\u5747\u6709\u6e05\u6670\u4f53\u73b0\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\uff0c\u5174\u8da3\u9a71\u52a8\u4e0e\u53d8\u73b0\u671f\u5f85\u5e76\u5b58\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u6781\u901f\u53d8\u73b0\u7684\u8feb\u5207\u6027\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u573a\u666f\u642d\u5efa\u6211\u89c9\u5f97\u597d\u96be[\u6342\u8138]\uff0c\u4f5c\u4e1a\u5b8c\u6210\u7684\u5f88\u6162\uff0c\u8fd9\u4e24\u5929\u5728\u8865\u8bfe\u4e2d\u201d (\u5173\u6ce8\u6280\u80fd\u672c\u8eab) > \u201c\u8003\u8bd5\u4e5f\u62a5\u597d\u4e86\u201d (\u79ef\u6781\u8003\u53d6\u884c\u4e1a\u8ba4\u8bc1\uff0c\u6709\u957f\u671f\u6295\u5165\u610f\u613f)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u652f\u4ed8\u8bfe\u7a0b\u8d39\u7528\u53ca\u989d\u5916\u5de5\u5177\u8d39\uff0c\u672a\u89c1\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u6781\u4f4e** \u2014 **\u6838\u5fc3\u77ed\u677f**\u3002\u56e0\u5065\u5eb7\u95ee\u9898\u53cd\u590d\u4f4f\u9662\uff0c\u5b66\u4e60\u8fdb\u7a0b\u591a\u6b21\u4e2d\u65ad\uff0c\u65f6\u95f4\u6781\u5ea6\u4e0d\u7a33\u5b9a\u4e14\u7cbe\u529b\u53d7\u9650\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff0c\u9700\u91cd\u70b9\u6392\u67e5\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b07\u4f4e\u6781\u5371]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u9047\u5230\u5b66\u4e60\u56f0\u96be\u65f6\uff0c\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u81ea\u6211\u5426\u5b9a\u548c\u4f9d\u8d56\u5916\u90e8\u5b89\u629a\u7684\u503e\u5411\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u8fd9\u4e2a\u70c2\u6c34\u5e73\u201d (\u4e25\u91cd\u81ea\u6211\u5426\u5b9a) > \u201c\u611f\u89c9\u751f\u75c5\u4f11\u606f\u7684\u65f6\u95f4\u592a\u957f\u4e86\uff0c\u65ad\u6863\u4e86\u3002\u201d (\u5c06\u8fdb\u5ea6\u843d\u540e\u5f52\u56e0\u4e8e\u5916\u90e8\uff0c\u6709\u632b\u8d25\u611f)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u56e0\u5065\u5eb7\u95ee\u9898\u5bfc\u81f4\u7684\u5b66\u4e60\u8fdb\u5ea6\u843d\u540e\uff0c\u5f15\u53d1\u4e86\u5f3a\u70c8\u7684\u201c\u6211\u4e0d\u884c\u201d\u3001\u201c\u6211\u592a\u7b28\u201d\u7684\u81ea\u5351\u611f\u548c\u4ef7\u503c\u611f\u7f3a\u5931\u3002** \u5979\u9700\u8981\u901a\u8fc7\u5b66\u4e60\u83b7\u5f97\u6210\u5c31\u6765\u91cd\u5efa\u81ea\u4fe1\u548c\u83b7\u5f97\u793e\u7fa4\u8ba4\u53ef\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u3001\u65e0\u6761\u4ef6\u7684\u80af\u5b9a\u4e0e\u9f13\u52b1\uff0c\u4ee5\u53ca\u201c\u5e26\u75c5\u575a\u6301\u201d\u7684\u793e\u7fa4\u5f52\u5c5e\u611f\u4e0e\u966a\u4f34\u3002** \u5728\u5979\u56e0\u8eab\u4f53\u539f\u56e0\u65e0\u6cd5\u8ddf\u4e0a\u65f6\uff0c\u63d0\u4f9b\u60c5\u611f\u652f\u6301\u6bd4\u6280\u672f\u6307\u5bfc\u66f4\u91cd\u8981\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1** \u7c7b (\u52a8\u673a\u5c1a\u53ef\uff0c\u4f46\u8d44\u6e90\u5e95\u5ea7\u548c\u5fc3\u7406\u5f39\u6027\u5b58\u5728\u4e25\u91cd\u77ed\u677f\uff0c\u9700\u91cd\u70b9\u6276\u6301) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u5178\u578b\u7279\u5f81\uff1a\u9ad8\u60c5\u7eea\u4f9d\u8d56\u3001\u4f4e\u81ea\u6211\u8bc4\u4ef7\u3001\u6613\u56e0\u632b\u6298\u800c\u653e\u5f03) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u7b49\u7ea2\u7ebf)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a/\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u82e5\u5bb6\u4eba\u53cd\u5bf9\u5176\u5e26\u75c5\u5b66\u4e60\u6216\u8ba4\u4e3a\u8bfe\u7a0b\u52a0\u91cd\u8d1f\u62c5\uff0c\u53ef\u80fd\u6210\u4e3a\u9000\u8d39\u5bfc\u706b\u7d22\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u56e0\u53cd\u590d\u4f4f\u9662\uff0c\u8bfe\u7a0b\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u6c38\u8fdc\u8ddf\u4e0d\u4e0a\u201d\u7684\u7edd\u671b\u611f\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u6700\u9ad8\u98ce\u9669**\u3002\u4e00\u65e6\u4f5c\u4e1a\u88ab\u6279\u8bc4\u6216\u8f6f\u4ef6\u64cd\u4f5c\u4e0d\u987a\uff0c\u4e00\u53e5\u8d1f\u9762\u8bc4\u4ef7\u5c31\u53ef\u80fd\u89e6\u53d1\u201c\u6211\u592a\u7b28\u4e86\u201d\u7684\u5d29\u6e83\uff0c\u76f4\u63a5\u9000\u8bfe\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u5f53\u524d\u9636\u6bb5\u66f4\u5173\u6ce8\u5b66\u4e60\u8fc7\u7a0b\u4e0e\u793e\u7fa4\u4e92\u52a8\uff0c\u800c\u975e\u77ed\u671f\u53d8\u73b0\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\uff0c\u5f53\u8bfe\u7a0b\u96be\u5ea6\u63d0\u5347\u3001\u4f5c\u4e1a\u538b\u529b\u589e\u5927\uff0c\u800c\u5979\u56e0\u5065\u5eb7\u95ee\u9898\u518d\u6b21\u6389\u961f\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u897f\u897f\u4f60\u597d\u5440\uff0c\u73ed\u73ed\u77e5\u9053\u4f60\u5728\u4e0a\u4e00\u671f\u5b66\u4e60\u65f6\u975e\u5e38\u52aa\u529b\uff0c\u5373\u4f7f\u8eab\u4f53\u4e0d\u8212\u670d\u4e5f\u5728\u575a\u6301\uff0c\u8fd9\u4efd\u70ed\u7231\u548c\u575a\u97e7\u7279\u522b\u8ba9\u4eba\u4f69\u670d\uff01\u65b0\u7684\u4e00\u671f\uff0c\u6211\u4eec\u8282\u594f\u653e\u6162\u70b9\u6ca1\u5173\u7cfb\uff0c\u4f60\u7684\u5065\u5eb7\u6c38\u8fdc\u662f\u7b2c\u4e00\u4f4d\u7684\u3002\u73ed\u73ed\u4f1a\u6839\u636e\u4f60\u7684\u60c5\u51b5\u8c03\u6574\u5b66\u4e60\u8ba1\u5212\uff0c\u54b1\u4eec\u7684\u76ee\u6807\u4e0d\u662f\u2018\u8ddf\u4e0a\u2019\uff0c\u800c\u662f\u2018\u6bcf\u4e00\u6b65\u90fd\u6709\u6536\u83b7\u2019\u3002\u6709\u4efb\u4f55\u4e0d\u8212\u670d\u6216\u8ddf\u4e0d\u4e0a\u7684\u5730\u65b9\uff0c\u968f\u65f6\u8ddf\u6211\u8bf4\uff0c\u6211\u4eec\u4e00\u8d77\u60f3\u529e\u6cd5\uff0c\u5343\u4e07\u522b\u81ea\u5df1\u786c\u625b\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf**\u3011\u3002\u6838\u5fc3\u662f\u964d\u4f4e\u5b66\u4e60\u538b\u529b\uff0c\u4ee5\u201c\u5b8c\u6210\u201d\u800c\u975e\u201c\u5b8c\u7f8e\u201d\u4e3a\u76ee\u6807\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u8865\u5145\u3010**\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305**\u3011\u3002\u5305\u62ec\uff1a1\uff09\u4e2a\u6027\u5316\u3001\u6781\u5ea6\u7b80\u5316\u7684\u5b66\u4e60\u4efb\u52a1\u6e05\u5355\uff1b2\uff09\u6bcf\u65e5\u201c\u5fae\u5c0f\u6210\u5c31\u201d\u6253\u5361\u4e0e\u5938\u5f20\u5f0f\u8d5e\u7f8e\uff1b3\uff09\u75c5\u4e2d\u5173\u6000\u4e0e\u8fdb\u5ea6\u8c41\u514d\u7279\u6743\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u5979\u8fdb\u884c\u6a2a\u5411\u6bd4\u8f83\u6216\u65bd\u52a0\u4f5c\u4e1a\u538b\u529b**\uff08\u5982\u201c\u5176\u4ed6\u540c\u5b66\u90fd\u4ea4\u4e86\u201d\uff09\u3002\n    2. **\u7edd\u4e0d\u7ed9\u5979\u7684\u4f5c\u4e1a\u505a\u4e25\u8083\u3001\u76f4\u63a5\u7684\u8d1f\u9762\u70b9\u8bc4**\uff0c\u6240\u6709\u53cd\u9988\u5fc5\u987b\u5305\u88f9\u5728\u5927\u91cf\u80af\u5b9a\u4e2d\u3002\n    3. **\u7edd\u4e0d\u5728\u5979\u56e0\u5065\u5eb7\u8bf7\u5047\u65f6\uff0c\u50ac\u4fc3\u5979\u8865\u8bfe\u6216\u5f3a\u8c03\u843d\u4e0b\u7684\u5185\u5bb9**\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5f62\u5f0f\u7684\u5347\u5355**\u3002\u5728\u5065\u5eb7\u72b6\u51b5\u7a33\u5b9a\u3001\u5b66\u4e60\u4fe1\u5fc3\u91cd\u5efa\u4e4b\u524d\uff0c\u4efb\u4f55\u989d\u5916\u4ed8\u8d39\u5efa\u8bae\u90fd\u4f1a\u88ab\u89c6\u4e3a\u538b\u529b\u6e90\uff0c\u6781\u6613\u89e6\u53d1\u9000\u8d39\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u573a\u666f\u642d\u5efa\u6211\u89c9\u5f97\u597d\u96be[\u6342\u8138]\uff0c\u4f5c\u4e1a\u5b8c\u6210\u7684\u5f88\u6162\uff0c\u8fd9\u4e24\u5929\u5728\u8865\u8bfe\u4e2d\u201d\n2. > \u201c\u6211\u8fd9\u4e2a\u70c2\u6c34\u5e73\u201d\n3. > \u201c\u6211\u53c8\u4f4f\u9662\u4e86\uff0c\u73b0\u5728\u8fd8\u6ca1\u51fa\u9662\u3002\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u4e0e\u5f52\u5c5e\u611f\uff0c\u4ee5\u5bf9\u6297\u56e0\u75c5\u4ea7\u751f\u7684\u81ea\u5351\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u542f\u52a8\u6781\u81f4\u7597\u6108\u966a\u4f34\u6a21\u5f0f\uff0c\u5265\u79bb\u4e00\u5207\u632b\u8d25\u611f\u6765\u6e90\uff0c\u7528\u60c5\u611f\u652f\u6301\u66ff\u4ee3\u5b66\u4e60\u538b\u529b\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"maslow_need\": \"\u7b2c\u56db\u5c42\u5c0a\u91cd\u9700\u6c42\", \"risk_level\": \"\u9ad8\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
