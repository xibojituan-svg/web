    <script>
        const markdownText = "# AI\u5199\u4f5c\u5b66\u5458\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u7f3a\u4e4f\u652f\u4ed8\u4fe1\u606f\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u3001\u5177\u4f53\u5e74\u9f84/\u57ce\u5e02/\u804c\u4e1a\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u3001\u660e\u786e\u5b66\u4e60\u76ee\u6807\u4e0e\u65f6\u95f4\u6295\u5165\u627f\u8bfa\u3002\n\n---\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49)**\n    *   **\u5174\u8da3\u9a71\u52a8**\uff1a\u6709\u660e\u786e\u7684\u521b\u4f5c\u5174\u8da3\uff08\u6e38\u620f\u540c\u4eba\u6587\u3001\u624b\u6e38\u540c\u4eba\uff09\uff0c\u5df2\u6709\u5b9e\u8df5\uff08\u5728\u664b\u6c5f\u3001\u8bdd\u672c\u5c0f\u8bf4\u53d1\u5e03\u5b58\u7a3f\uff09\u3002\n    *   **\u95ee\u9898\u9a71\u52a8**\uff1a\u5b58\u5728\u660e\u786e\u75db\u70b9\u2014\u2014\u201c\u6709\u7075\u611f\u548c\u5927\u7eb2\uff0c\u4f46\u4e0d\u77e5\u5982\u4f55\u586b\u8089\u201d\uff0c\u5de5\u5177\uff08\u8c46\u5305\u3001Kimi\uff09\u4f7f\u7528\u505c\u7559\u5728\u8868\u5c42\uff0c\u6e34\u671b\u7cfb\u7edf\u65b9\u6cd5\u3002\n    *   **\u53d8\u73b0\u9a71\u52a8**\uff1a\u5bf9\u9500\u552e\u63cf\u8ff0\u7684\u591a\u79cd\u53d8\u73b0\u65b9\u5f0f\uff08\u77ed\u5267\u3001\u6709\u58f0\u4e66\u3001\u5e73\u53f0\u6295\u7a3f\uff09\u8868\u793a\u201c\u90fd\u611f\u5174\u8da3\u201d\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u3001\u6025\u8feb\u7684\u8d5a\u94b1\u7126\u8651\u3002\u52a8\u673a\u6df7\u5408\u5174\u8da3\u4e0e\u5b9e\u7528\u4e3b\u4e49\uff0c**\u7eaf\u5ea6\u4e2d\u7b49**\u3002\n\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d\u7b49\u504f\u4f4e)**\n    *   **\u65f6\u95f4\u8d44\u6e90**\uff1a\u81ea\u79f0\u201c\u5728\u4e0a\u8bfe\u201d\uff0c\u53ef\u80fd\u4e3a\u5b66\u751f\u6216\u804c\u573a\u65b0\u4eba\uff0c\u6709\u89c4\u5f8b\u5b66\u4e60\u65f6\u95f4\uff08\u80fd\u53c2\u4e0e\u76f4\u64ad\u3001\u5b8c\u6210\u4f5c\u4e1a\uff09\uff0c\u4f46\u5177\u4f53\u53ef\u652f\u914d\u65f6\u95f4\u672a\u77e5\u3002\n    *   **\u8ba4\u77e5\u8d44\u6e90**\uff1a\u5177\u5907\u57fa\u7840\u5199\u4f5c\u5b9e\u8df5\u548cAI\u5de5\u5177\u4f7f\u7528\u7ecf\u9a8c\uff0c\u5b66\u4e60\u610f\u613f\u5f3a\uff0c\u80fd\u7406\u89e3\u5e76\u6267\u884c\u6559\u7ec3\u6307\u5bfc\uff08\u5982\u4fee\u6539\u4eba\u79f0\uff09\uff0c**\u5b66\u4e60\u9002\u5e94\u6027\u826f\u597d**\u3002\n    *   **\u7ecf\u6d4e\u8d44\u6e90**\uff1a\u672a\u77e5\u3002\u5df2\u652f\u4ed84380\u5143\u8bfe\u7a0b\u8d39\u7528\uff0c\u4f46\u672a\u63d0\u53ca\u652f\u4ed8\u538b\u529b\u6216\u8d44\u91d1\u6765\u6e90\u3002\n    *   **\u6280\u672f\u8d44\u6e90**\uff1a\u719f\u7ec3\u4f7f\u7528\u8c46\u5305\u3001Kimi\u7b49AI\u5de5\u5177\uff0c\u5177\u5907\u57fa\u7840\u64cd\u4f5c\u80fd\u529b\u3002\n\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u7b49\u504f\u9ad8)**\n    *   **\u4e92\u52a8\u914d\u5408\u5ea6**\uff1a\u9ad8\u3002\u79ef\u6781\u56de\u590d\u9500\u552e\uff0c\u6309\u65f6\u53c2\u4e0e\u76f4\u64ad\u3001\u63d0\u4ea4\u4f5c\u4e1a\uff0c\u63a5\u53d7\u70b9\u8bc4\u5e76\u63d0\u95ee\uff08\u201c\u6240\u4ee5\u6211\u8981\u600e\u4e48\u7ed9\u4e0e\u6307\u4ee4\u5462\u201d\uff09\u3002\n    *   **\u632b\u6298\u8010\u53d7\u529b**\uff1a\u5bf9\u5f53\u524d\u5199\u4f5c\u74f6\u9888\uff08\u4e0d\u4f1a\u586b\u8089\uff09\u6709\u8ba4\u77e5\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u70e6\u8e81\u6216\u653e\u5f03\uff0c\u613f\u610f\u8ddf\u968f\u6559\u5b66\u6b65\u9aa4\u5c1d\u8bd5\u6539\u8fdb\u3002\n    *   **\u4e3b\u52a8\u6027**\uff1a\u4e2d\u7b49\u3002\u80fd\u5b8c\u6210\u89c4\u5b9a\u52a8\u4f5c\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u8d85\u524d\u7684\u63a2\u7d22\u6216\u6df1\u5ea6\u8ffd\u95ee\u3002\u884c\u52a8\u591a\u5728\u9500\u552e\u5f15\u5bfc\u4e0b\u8fdb\u884c\u3002\n    *   **\u4fe1\u4efb\u5ea6**\uff1a\u5bf9\u9500\u552e\uff08\u5e08\u5144\uff09\u5efa\u7acb\u4e86\u4e00\u5b9a\u4fe1\u4efb\uff08\u201c\u540e\u9762\u591a\u591a\u6307\u6559\u201d\uff09\uff0c\u5bf9\u627f\u8bfa\u7684\u989d\u5916\u798f\u5229\uff08\u957f\u7bc7\u7f51\u6587\u8bfe\uff09\u6709\u6b63\u5411\u53cd\u9988\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5** \u2705 \u5df2\u652f\u4ed8\u3002\u7528\u6237\u63d0\u53ca\u201c4380\u201d\u5e76\u786e\u8ba4\u201c\u5df2\u62a5\u540d\u5b8c\u6210\u201d\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5** \u26a0\ufe0f **\u4fe1\u606f\u7f3a\u5931**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u6216\u4f34\u4fa3\u7684\u51b3\u7b56\u53c2\u4e0e\uff0c\u7528\u6237\u51b3\u7b56\u770b\u4f3c\u72ec\u7acb\u3002\n*   **\u6b65\u9aa41\uff1a\u9700\u6c42\u771f\u5b9e\u6027** \u2705 \u901a\u8fc7\u3002\u6709\u771f\u5b9e\u521b\u4f5c\u7ecf\u5386\u4e0e\u75db\u70b9\uff0c\u975e\u7eaf\u597d\u5947\u56f4\u89c2\u3002\n*   **\u6b65\u9aa42\uff1a\u8d44\u6e90\u5339\u914d\u5ea6** \u26a0\ufe0f **\u90e8\u5206\u5b58\u7591**\u3002\u5b66\u4e60\u610f\u613f\u548c\u65f6\u95f4\u5339\u914d\uff0c\u4f46**\u6301\u7eed\u6295\u5165\u7684\u6bc5\u529b\u4e0e\u6700\u7ec8\u53d8\u73b0\u6240\u9700\u7684\u4ea7\u80fd\u672a\u77e5**\u3002\n*   **\u6b65\u9aa43\uff1a\u51b3\u7b56\u72b6\u6001** \u2705 \u901a\u8fc7\u3002\u5df2\u5b8c\u6210\u652f\u4ed8\uff0c\u8fdb\u5165\u5b66\u5458\u72b6\u6001\u3002\n*   **\u6b65\u9aa44\uff1a\u884c\u52a8\u627f\u8bfa** \u2705 \u901a\u8fc7\u3002\u5df2\u5f00\u59cb\u4e0a\u8bfe\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u4e92\u52a8\u3002\n*   **\u5224\u5b9a\u7ed3\u679c\uff1aB\u7c7b\u7528\u6237 (\u5df2\u8f6c\u5316\u5b66\u5458)**\u3002\u9700\u6c42\u771f\u5b9e\uff0c\u5df2\u4ed8\u8d39\u5165\u5b66\uff0c\u914d\u5408\u5ea6\u9ad8\uff0c\u4f46\u957f\u671f\u575a\u6301\u529b\u548c\u7ed3\u679c\u8fbe\u6210\u5ea6\u9700\u89c2\u5bdf\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b\uff1aT4 \u6210\u957f\u63a2\u7d22\u578b**\n    *   **\u7279\u5f81**\uff1a\u6709\u660e\u786e\u7684\u5174\u8da3\u9886\u57df\uff08\u540c\u4eba\u6587\u521b\u4f5c\uff09\uff0c\u5904\u4e8e\u201c\u6709\u60f3\u6cd5\uff0c\u7f3a\u65b9\u6cd5\u201d\u7684\u63a2\u7d22\u9636\u6bb5\u3002\u5b66\u4e60\u7684\u4e3b\u8981\u9a71\u52a8\u529b\u662f\u89e3\u51b3\u5177\u4f53\u6280\u80fd\u74f6\u9888\uff08\u4ece\u5927\u7eb2\u5230\u6b63\u6587\uff09\uff0c\u540c\u65f6\u5bf9\u672a\u6765\u53d8\u73b0\u53ef\u80fd\u6027\u62b1\u6709\u5f00\u653e\u6001\u5ea6\u3002\u884c\u52a8\u529b\u5c1a\u53ef\uff0c\u5728\u6307\u5f15\u4e0b\u80fd\u8ddf\u8fdb\u3002\n    *   **\u504f\u79bb\u70b9**\uff1a\u672a\u8868\u73b0\u51faT4\u5178\u578b\u7684\u4fe1\u606f\u641c\u96c6\u72c2\u6216\u5e7f\u6cdb\u8bd5\u9519\u7279\u5f81\uff0c\u66f4\u504f\u5411\u4e8e\u8ddf\u968f\u73b0\u6709\u8bfe\u7a0b\u4f53\u7cfb\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4e2d\u4f4e)\n\u9010\u9879\u6392\u67e57\u5927\u6839\u56e0\uff1a\n1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u6838\u5fc3\u8bc9\u6c42\u662f\u201c\u5b66\u4f1a\u586b\u8089\u201d\uff0c\u82e5\u8bfe\u7a0b\u540e\u671f\u65e0\u6cd5\u5207\u5b9e\u89e3\u51b3\u6b64\u95ee\u9898\uff0c\u6216AI\u751f\u6210\u5185\u5bb9\u59cb\u7ec8\u4e0d\u6ee1\u610f\uff0c\u53ef\u80fd\u5f15\u53d1\u5931\u671b\u3002\n2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u4f4e\u98ce\u9669**\u3002\u652f\u4ed8\u8fc7\u7a0b\u987a\u7545\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u95ee\u9898\u3002\n3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u4e2d\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u80fd\u8ddf\u4e0a\u8282\u594f\uff0c\u4f46\u82e5\u5b66\u4e1a\u6216\u5de5\u4f5c\u53d8\u5fd9\uff0c\u53ef\u80fd\u96be\u4ee5\u6301\u7eed\u3002\n4.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u672a\u77e5\u98ce\u9669**\u3002**\u5173\u952e\u4fe1\u606f\u7f3a\u5931**\u3002\n5.  **\u5185\u5bb9\u4e0d\u5339\u914d**\uff1a**\u4f4e\u98ce\u9669**\u3002\u8bfe\u7a0b\u5185\u5bb9\uff08\u77ed\u6545\u4e8b\u3001\u77ed\u5267\uff09\u4e0e\u5176\u5174\u8da3\uff08\u540c\u4eba\uff09\u6709\u7ed3\u5408\u70b9\uff0c\u4e14\u7528\u6237\u8868\u793a\u201c\u90fd\u611f\u5174\u8da3\u201d\u3002\n6.  **\u670d\u52a1\u4f53\u9a8c\u5dee**\uff1a**\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u9500\u552e/\u6559\u7ec3\u670d\u52a1\u7ec6\u81f4\u3001\u54cd\u5e94\u53ca\u65f6\uff0c\u7528\u6237\u4f53\u9a8c\u6b63\u5411\u3002\n7.  **\u7ade\u54c1\u5bf9\u6bd4/\u8d1f\u9762\u4fe1\u606f**\uff1a**\u4f4e\u98ce\u9669**\u3002\u5f53\u524d\u672a\u8868\u73b0\u51fa\u6bd4\u8f83\u6216\u8d28\u7591\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u8fc7\u5ea6\u627f\u8bfa**\uff1a\u9500\u552e\u63d0\u53ca\u201c\u6295\u7a3f\u6210\u529f\u8d5a1-5\u4e07\u7a3f\u8d39\u201d\u3001\u201c\u5b66\u5458\u7a3f\u8d39\u6700\u9ad8\u8bb0\u5f55\u4e00\u672c\u7a3f\u5b5012\u4e07\u201d\uff0c\u867d\u6709\u4e2a\u6848\uff0c\u4f46\u53ef\u80fd\u5851\u9020\u4e0d\u5207\u5b9e\u9645\u7684\u9884\u671f\u3002**\u9700\u8b66\u60d5**\u3002\n*   **\u5236\u9020\u7a00\u7f3a\u4e0e\u7d27\u8feb\u611f**\uff1a\u4f7f\u7528\u201c\u76f4\u64ad\u95f4\u62bd\u5956\u201d\u3001\u201c\u5185\u90e8\u6e20\u9053\u7a00\u7f3a\u201d\u3001\u201c\u4eca\u665a\u5f00\u901a\u62a5\u540d\u201d\u7b49\u8bdd\u672f\uff0c\u5c5e\u5e38\u89c1\u9500\u552e\u7b56\u7565\uff0c\u672a\u53d1\u73b0\u8fdd\u89c4\u3002\n*   **\u670d\u52a1\u4e00\u81f4\u6027**\uff1a\u627f\u8bfa\u201c\u4e13\u5c5e\u5199\u4f5c\u6559\u7ec3\u201d\u3001\u201c\u4e09\u5e08\u6a21\u5f0f\u201d\uff0c\u9700\u5728\u4ea4\u4ed8\u9636\u6bb5\u4e25\u683c\u843d\u5b9e\uff0c\u907f\u514d\u843d\u5dee\u3002\n*   **\u603b\u4f53\u8bc4\u4ef7**\uff1a\u9500\u552e\u8fc7\u7a0b\u5b58\u5728\u4e00\u5b9a\u7684\u6536\u76ca\u6e32\u67d3\uff0c\u4f46\u672a\u53d1\u73b0\u865a\u5047\u3001\u6b3a\u8bc8\u6216\u5f3a\u8feb\u4ea4\u6613\u7b49**\u7ea2\u7ebf\u95ee\u9898**\u3002\u7528\u6237\u51b3\u7b56\u57fa\u4e8e\u81ea\u8eab\u5174\u8da3\u548c\u6280\u80fd\u63d0\u5347\u9700\u6c42\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6838\u5fc3\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u5f3a\u5316\u201c\u586b\u8089\u201d\u6280\u80fd\u4ea4\u4ed8**\uff1a\u8fd9\u662f\u8be5\u5b66\u5458\u7684\u6838\u5fc3\u75db\u70b9\u3002\u73ed\u4e3b\u4efb\u9700\u91cd\u70b9\u5173\u6ce8\u5176\u5728\u201c\u5927\u7eb2\u7ec6\u5316\u201d\u3001\u201c\u4eba\u7269\u5851\u9020\u201d\u3001\u201c\u60c5\u8282\u5c55\u5f00\u201d\u7b49\u6a21\u5757\u7684\u5b66\u4e60\u53cd\u9988\uff0c\u63d0\u4f9b\u9488\u5bf9\u6027\u8f85\u5bfc\uff0c\u8ba9\u5176\u5feb\u901f\u83b7\u5f97\u201c\u80fd\u5199\u4e0b\u53bb\u201d\u7684\u638c\u63a7\u611f\u3002\n    2.  **\u5efa\u7acb\u6df1\u5ea6\u4fe1\u4efb\u8fde\u63a5**\uff1a\u7528\u6237\u5bf9\u201c\u5e08\u5144\u201d\u5df2\u5efa\u7acb\u521d\u6b65\u4fe1\u4efb\u3002\u73ed\u4e3b\u4efb\u5e94\u5ef6\u7eed\u201c\u6559\u7ec3\u201d\u89d2\u8272\uff0c\u63d0\u4f9b\u771f\u8bda\u3001\u4e13\u4e1a\u7684\u5199\u4f5c\u6307\u5bfc\uff0c\u800c\u975e\u5355\u7eaf\u5ba2\u670d\uff0c\u5de9\u56fa\u4fe1\u4efb\u5173\u7cfb\u4ee5\u63d0\u5347\u5b8c\u8bfe\u7387\u548c\u7eed\u8d39\u53ef\u80fd\u6027\u3002\n    3.  **\u5f15\u5bfc\u8bbe\u5b9a\u5408\u7406\u9884\u671f**\uff1a\u5728\u9f13\u52b1\u7684\u540c\u65f6\uff0c\u6e29\u548c\u7ba1\u7406\u5176\u53d8\u73b0\u9884\u671f\u3002\u5f3a\u8c03\u4ece\u201c\u80fd\u5199\u5b8c\u4e00\u7bc7\u5b8c\u6574\u6545\u4e8b\u201d\u5230\u201c\u83b7\u5f97\u7a3f\u8d39\u201d\u9700\u8981\u8fc7\u7a0b\uff0c\u5f15\u5bfc\u5173\u6ce8\u6280\u80fd\u6210\u957f\u7684\u91cc\u7a0b\u7891\u3002\n    4.  **\u6316\u6398\u5e76\u94fe\u63a5\u5174\u8da3**\uff1a\u9f13\u52b1\u5176\u5c06\u8bfe\u7a0b\u6240\u5b66\u65b9\u6cd5\u5e94\u7528\u4e8e\u201c\u6e38\u620f\u540c\u4eba\u6587\u201d\u521b\u4f5c\uff0c\u5b8c\u6210\u4e00\u4e2a\u5c5e\u4e8e\u81ea\u5df1\u7684\u5b8c\u6574\u4f5c\u54c1\u3002\u5174\u8da3\u662f\u6301\u7eed\u5b66\u4e60\u7684\u6700\u4f73\u71c3\u6599\u3002\n    5.  **\u5bc6\u5207\u5173\u6ce8\u65f6\u95f4\u6295\u5165**\uff1a\u5b9a\u671f\u4e86\u89e3\u5176\u5b66\u4e60\u65f6\u95f4\u5b89\u6392\uff0c\u9884\u9632\u56e0\u65f6\u95f4\u4e0d\u8db3\u5bfc\u81f4\u7684\u6389\u961f\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**\uff1a\n    *   **\u6302\u8f7d\u4e50\u9ad8\u7ebf**\uff1a**\u77ed\u6545\u4e8b\u521b\u4f5c\u8425\uff08\u6838\u5fc3\uff09+ \u77ed\u5267\u6539\u7f16\u8fdb\u9636\u6a21\u5757**\u3002\u5176\u5174\u8da3\u70b9\uff08\u540c\u4eba\uff09\u66f4\u8d34\u8fd1\u77ed\u6545\u4e8b\u5f62\u6001\uff0c\u53ef\u5148\u4ece\u6b64\u5904\u83b7\u5f97\u6210\u5c31\u611f\uff0c\u518d\u5f15\u5bfc\u5411\u53d8\u73b0\u6f5c\u529b\u66f4\u5927\u7684\u77ed\u5267\u5267\u672c\u62d3\u5c55\u3002\n    *   **\u614e\u63a8\u4ea7\u54c1**\uff1a\u907f\u514d\u8fc7\u65e9\u63a8\u8350\u9ad8\u5f3a\u5ea6\u3001\u5546\u4e1a\u5bfc\u5411\u7684\u201c\u5de5\u4f5c\u5ba4\u62a2\u5355\u201d\u6216\u201c\u77ed\u5267\u5267\u672c\u901f\u6210\u201d\u7c7b\u9ad8\u538b\u4ea7\u54c1\uff0c\u4ee5\u514d\u5f15\u53d1\u7126\u8651\u6216\u632b\u8d25\u611f\u3002\n\n{\"core_type\": \"T4 \u6210\u957f\u63a2\u7d22\u578b\", \"risk_level\": \"\u4e2d\u4f4e\", \"refund_risk\": \"\u4e2d\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd\uff08\u80fd\u529b\u83b7\u5f97\u8ba4\u53ef\uff09\u4e0e\u81ea\u6211\u5b9e\u73b0\uff08\u521b\u4f5c\u8868\u8fbe\uff09\", \"target_product_line\": \"\u77ed\u6545\u4e8b\u521b\u4f5c\u8425\uff08\u6838\u5fc3\uff09+ \u77ed\u5267\u6539\u7f16\u8fdb\u9636\u6a21\u5757\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}";
