        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676991243 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-13 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6c90\u7efe\u83c0/\u7efe\u7efe\u73ed\u73ed\uff08\u5f20\u5a49\u94b0\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u6500\u767b\u8ba1\u5212\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u91d1\u989d\u6216\u7ecf\u6d4e\u538b\u529b\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u591a\u6b21\u56e0\u201c\u5f00\u8f66\u201d\u3001\u201c\u5bb6\u91cc\u6709\u4e8b\u201d\u3001\u201c\u665a\u4e0a\u6709\u70b9\u4e8b\u60c5\u201d\u8bf7\u5047\u6216\u8fdf\u5230\uff0c\u8868\u660e\u65f6\u95f4\u88ab\u5176\u4ed6\u4e8b\u52a1\u5207\u5272\uff0c\u975e\u56fa\u5b9a\u5927\u5757\u5b66\u4e60\u65f6\u95f4\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u4fe1\u606f\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u804a\u5929\u8bb0\u5f55\u4ee5\u5355\u5411\u901a\u77e5\u548c\u7528\u6237\u8bf7\u5047/\u7b80\u5355\u8be2\u95ee\u4e3a\u4e3b\uff0c\u7f3a\u4e4f\u5173\u4e8e\u7528\u6237\u80cc\u666f\u3001\u5b66\u4e60\u76ee\u6807\u3001\u7ecf\u6d4e\u72b6\u51b5\u3001\u5bb6\u5ead\u652f\u6301\u7b49\u5173\u952e\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u27a1\u4e2d\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u53c2\u4e0e\u4e86\u8bd5\u97f3\u62a5\u540d\u3001\u8bf7\u6c42\u683c\u5f0f\u8f6c\u6362\u7b49\u5b9e\u64cd\u52a8\u4f5c\uff0c\u8868\u660e\u6709\u53d8\u73b0\u6216\u63a5\u5355\u610f\u5411\u3002\u4f46\u672a\u8868\u73b0\u51fa\u6781\u901f\u53d8\u73b0\u7684\u8feb\u5207\u6027\uff0c\u4e5f\u672a\u8981\u6c42\u4fdd\u5e95\u627f\u8bfa\uff0c\u66f4\u591a\u662f\u8ddf\u968f\u8bfe\u7a0b\u8282\u594f\u5c1d\u8bd5\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u73ed\u73ed \u6211\u7684\u7532\u65b9\u76f4\u901a\u8f66\u7684\u97f3\u9891\u662f\u624b\u673a\u5f55\u7684 \u662fwav\u683c\u5f0f\u7684 \u53ef\u4ee5\u5e2e\u6211\u8f6c\u6210MP3\u683c\u5f0f\u7684\u5417\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u65e0\u4efb\u4f55\u4fe1\u606f\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u2b07\u4f4e** \u2014 \u591a\u6b21\u8bf7\u5047\uff08\u201c\u5f00\u8f66\u6765\u4e0d\u53ca\u56de\u53bb\u201d\u3001\u201c\u5bb6\u91cc\u6709\u4e8b\u201d\u3001\u201c\u665a\u4e0a\u6709\u70b9\u4e8b\u60c5\u201d\uff09\uff0c\u8868\u660e\u5176\u65f6\u95f4\u88ab\u751f\u6d3b/\u5de5\u4f5c\u4e25\u91cd\u6324\u5360\uff0c\u5b66\u4e60\u65f6\u95f4\u4e0d\u7a33\u5b9a\uff0c\u7cbe\u529b\u6295\u5165\u6709\u9650\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u65e0\u4efb\u4f55\u4fe1\u606f\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u7528\u6237\u9047\u5230\u95ee\u9898\uff08\u5982\u8fdb\u4f1a\u8bae\u665a\u3001\u62a5\u9519\u671f\u6570\u3001\u683c\u5f0f\u8f6c\u6362\uff09\u65f6\uff0c\u76f4\u63a5\u3001\u793c\u8c8c\u5730\u63d0\u51fa\u5177\u4f53\u8bf7\u6c42\u5e76\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u672a\u6d41\u9732\u62b1\u6028\u3001\u7126\u8651\u6216\u81ea\u6211\u5426\u5b9a\u60c5\u7eea\uff0c\u6c9f\u901a\u987a\u7545\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u73ed\u73ed \u6211\u8fdb\u4f1a\u8bae\u6709\u70b9\u665a \u8fd8\u80fd\u8ba9\u8001\u5e08\u70b9\u8bc4\u5417\u201d > \u201c\u8c22\u8c22\u73ed\u73ed \u6ca1\u4e8b\u7684 \u6211\u7b49\u6700\u540e\u5427\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u65f6\u95f4\u788e\u7247\u5316\u5bfc\u81f4\u7684\u793e\u7fa4\u53c2\u4e0e\u611f\u7f3a\u5931\u4e0e\u6280\u80fd\u6210\u957f\u7126\u8651**\u3002\u7528\u6237\u9891\u7e41\u56e0\u5ba2\u89c2\u4e8b\u52a1\u8bf7\u5047\uff0c\u4f46\u4ecd\u5728\u52aa\u529b\u8ddf\u4e0a\u8bfe\u7a0b\u8282\u594f\uff08\u8be2\u95ee\u70b9\u8bc4\u3001\u53c2\u4e0e\u8bd5\u97f3\uff09\uff0c\u8868\u660e\u5176\u6e34\u671b\u878d\u5165\u5b66\u4e60\u793e\u7fa4\u3001\u83b7\u5f97\u8ba4\u53ef\uff0c\u5e76\u62c5\u5fc3\u56e0\u65f6\u95f4\u95ee\u9898\u6389\u961f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u201d\u548c\u201c\u88ab\u5305\u5bb9\u201d\u7684\u5f52\u5c5e\u611f**\u3002\u9700\u8981\u8ba9\u4ed6\u611f\u5230\u5373\u4f7f\u65f6\u95f4\u4e0d\u89c4\u5f8b\uff0c\u4ed6\u7684\u52aa\u529b\u548c\u53c2\u4e0e\u4f9d\u7136\u88ab\u73ed\u7ea7\u548c\u8001\u5e08\u91cd\u89c6\uff0c\u907f\u514d\u56e0\u7f3a\u5e2d\u4ea7\u751f\u5b64\u7acb\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfea C1** \u7c7b (\u52a8\u673a\u4e2d\u7b49\uff0c\u8d44\u6e90\u5e95\u5ea7\u5b58\u5728\u660e\u663e\u77ed\u677f\uff0c\u4f46\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u6709\u8ddf\u8fdb\u610f\u613f) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T5 \u597d\u73a9\u5c1d\u9c9c / T4 \u641e\u94b1\u7ed3\u679c (\u503e\u5411\u6027)**\u3002\u5f53\u524d\u884c\u4e3a\u66f4\u63a5\u8fd1 **T5 \u597d\u73a9\u5c1d\u9c9c**\uff1a\u53c2\u4e0e\u6d3b\u52a8\u3001\u5c1d\u8bd5\u63a5\u5355\uff0c\u4f46\u6295\u5165\u6df1\u5ea6\u548c\u7a33\u5b9a\u6027\u4e0d\u8db3\uff0c\u66f4\u50cf\u5728\u201c\u4f53\u9a8c\u201d\u800c\u975e\u201c\u6b7b\u78d5\u201d\u3002\u82e5\u540e\u7eed\u53d8\u73b0\u8bc9\u6c42\u589e\u5f3a\uff0c\u53ef\u80fd\u5411T4\u8f6c\u5316\u3002 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u5bb6\u5ead\u53cd\u5bf9\u7b49\u6781\u7aef\u98ce\u9669\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e (\u4fe1\u606f\u4e0d\u8db3) | \u672a\u77e5\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | **\u65f6\u95f4\u51b2\u7a81\u5bfc\u81f4\u4f5c\u4e1a\u79ef\u538b\u3001\u76f4\u64ad\u8bfe\u9891\u7e41\u7f3a\u5e2d\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u3001\u767d\u82b1\u94b1\u201d\u7684\u632b\u8d25\u611f\uff0c\u6700\u7ec8\u653e\u5f03\u3002** |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u7528\u6237\u6c9f\u901a\u7406\u6027\uff0c\u672a\u8868\u73b0\u51fa\u60c5\u7eea\u5316\u6216\u73bb\u7483\u5fc3\u7279\u8d28\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u82e5\u5c1d\u8bd5\u51e0\u6b21\u8bd5\u97f3\u672a\u679c\uff0c\u53ef\u80fd\u8ba4\u4e3a\u201c\u5b66\u65e0\u6240\u7528\u201d\u800c\u5931\u53bb\u5174\u8da3\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u8bfe\u7a0b\u4e2d\u540e\u671f\uff08\u7b2c4-6\u5468\uff09**\u3002\u5f53\u8bfe\u7a0b\u96be\u5ea6\u548c\u4f5c\u4e1a\u91cf\u589e\u52a0\uff0c\u800c\u4ed6\u7684\u65f6\u95f4\u788e\u7247\u5316\u95ee\u9898\u6301\u7eed\uff0c\u65e0\u6cd5\u5b8c\u6210\u6838\u5fc3\u4efb\u52a1\u65f6\uff0c\u653e\u5f03\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u770b\u5230\u4f60\u5e73\u65f6\u633a\u5fd9\u7684\uff0c\u65f6\u95f4\u53ef\u80fd\u4e0d\u592a\u56fa\u5b9a\uff0c\u8fd9\u592a\u6b63\u5e38\u4e86\uff01\u54b1\u4eec\u8bfe\u7a0b\u6700\u5927\u7684\u597d\u5904\u5c31\u662f\u7075\u6d3b\uff0c\u76f4\u64ad\u80fd\u8ddf\u5c31\u8ddf\uff0c\u8ddf\u4e0d\u4e86\u770b\u56de\u653e\uff0c\u4f5c\u4e1a\u6309\u81ea\u5df1\u7684\u8282\u594f\u4ea4\u3002\u522b\u7ed9\u81ea\u5df1\u538b\u529b\uff0c\u53ea\u8981\u4f60\u4e00\u76f4\u5728\u53c2\u4e0e\u3001\u5728\u5c1d\u8bd5\uff0c\u5c31\u662f\u6700\u68d2\u7684\u8fdb\u6b65\u3002\u6709\u4efb\u4f55\u65f6\u95f4\u534f\u8c03\u4e0d\u8fc7\u6765\u7684\uff0c\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4e00\u8d77\u60f3\u529e\u6cd5\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5174\u8da3\u6e38\u4e50\u7ebf**\u3011\u3002\u964d\u4f4e\u786c\u6027\u4ea4\u4ed8\u538b\u529b\uff0c\u5f3a\u5316\u793e\u7fa4\u4e92\u52a8\u548c\u8f7b\u91cf\u7ea7\u6210\u5c31\u53cd\u9988\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u7075\u6d3b\u5b66\u4e60\u652f\u6301\u5305**\u3011\u3002\u91cd\u70b9\u63d0\u4f9b\uff1a1) \u6240\u6709\u76f4\u64ad\u8bfe\u7684\u9ad8\u6e05\u56de\u653e\u4e0e\u7cbe\u534e\u5207\u7247\uff1b2) \u4f5c\u4e1a\u63d0\u4ea4\u7684\u5f39\u6027\u622a\u6b62\u65f6\u95f4\uff08\u53ef\u9002\u5f53\u5bbd\u9650\uff09\uff1b3) \u9488\u5bf9\u5176\u201c\u8bd5\u97f3\u201d\u7b49\u5b9e\u64cd\u52a8\u4f5c\u7684\u5feb\u901f\u54cd\u5e94\u4e0e\u683c\u5f0f\u7b49\u6280\u672f\u652f\u6301\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u5168\u52e4\u201d\u3001\u201c\u5fc5\u987b\u6309\u65f6\u4ea4\u4f5c\u4e1a\u201d\u7b49\u6807\u51c6\u65bd\u538b\uff1b\u5728\u4ed6\u56e0\u6545\u7f3a\u5e2d\u540e\uff0c\u8fdb\u884c\u201c\u6279\u8bc4\u6559\u80b2\u201d\u6216\u5bf9\u6bd4\u5176\u4ed6\u5b66\u5458\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u5176\u65f6\u95f4\u6295\u5165\u672a\u7a33\u5b9a\u3001\u672a\u4ea7\u751f\u660e\u786e\u6b63\u53cd\u9988\uff08\u5982\u8bd5\u97f3\u6210\u529f\uff09\u524d\uff0c\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u4f1a\u5927\u5e45\u63d0\u9ad8\u5176\u201c\u6295\u5165\u4ea7\u51fa\u6bd4\u5931\u8861\u201d\u7684\u611f\u77e5\uff0c\u6781\u6613\u5f15\u53d1\u9000\u8d39\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u73ed\u73ed\u4f60\u597d \u6211\u4eca\u5929\u665a\u4e0a\u6709\u4e8b \u53ef\u80fd\u6765\u4e0d\u53ca\u53c2\u52a0\u4eca\u5929\u7684pia\u620f\u6d3b\u52a8 \u53ef\u4ee5\u8bf7\u4e2a\u5047\u5417\u201d\n2. > \u201c\u73ed\u73ed \u6211\u8fdb\u4f1a\u8bae\u6709\u70b9\u665a \u8fd8\u80fd\u8ba9\u8001\u5e08\u70b9\u8bc4\u5417\u201d\n3. > \u201c\u73ed\u73ed \u6211\u4eca\u5929\u665a\u4e0a\u7684\u5c0f\u7076\u8bfe\u8bf7\u4e2a\u5047 \u665a\u4e0a\u6709\u70b9\u4e8b\u60c5[\u8138\u7ea2]\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **[\u65f6\u95f4\u788e\u7247\u5316\u7684\u5c1d\u9c9c\u8005]**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **[\u5728\u4e0d\u7a33\u5b9a\u7684\u751f\u6d3b\u4e2d\u627e\u5230\u5f52\u5c5e\u611f\u548c\u8f7b\u91cf\u7ea7\u6210\u5c31\u611f]**\u3002\u9000\u5355\u51e0\u7387\u4e3a **[\u4e2d]**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **[\u63d0\u4f9b\u6781\u81f4\u7075\u6d3b\u7684\u5b66\u4e60\u8def\u5f84\u4e0e\u5305\u5bb9\u6027\u7684\u793e\u7fa4\u6c1b\u56f4\uff0c\u7edd\u4e0d\u65bd\u52a0\u65f6\u95f4\u538b\u529b]**\u3002\n\n```json\n{\"core_type\": \"T5 \u597d\u73a9\u5c1d\u9c9c\u578b\", \"maslow_need\": \"\u793e\u4ea4/\u5c0a\u91cd\u9700\u6c42\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf+\u7075\u6d3b\u5b66\u4e60\u652f\u6301\u5305\"}\n```";
