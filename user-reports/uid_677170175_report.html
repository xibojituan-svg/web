    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677170175 (\u6635\u79f0\uff1a\u5f90\u7d6e) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-11 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u4e45\u4e45\uff08\u9500\u552e/\u73ed\u4e3b\u4efb\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6500\u767b\u8ba1\u5212\u9ad8\u9636\u7248\uff08\u5df2\u652f\u4ed8\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u82b1\u5457\u5206\u671f**\uff08\u7528\u6237\u63d0\u53ca\u201c\u82b1\u5457\u5206\u671f\u624b\u7eed\u8d39\u201d\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u672a\u77e5\uff08\u804a\u5929\u8bb0\u5f55\u672a\u4f53\u73b0\uff0c\u4f46\u80fd\u53c2\u4e0e\u665a\u95f4\u76f4\u64ad\uff0c\u63a8\u6d4b\u6709\u665a\u95f4\u6216\u788e\u7247\u65f6\u95f4\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u672a\u77e5\uff08\u804a\u5929\u8bb0\u5f55\u672a\u4f53\u73b0\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e2d\u7b49\uff08\u6709\u5b66\u4e60\u4e92\u52a8\u548c\u652f\u4ed8\u884c\u4e3a\uff0c\u4f46\u7f3a\u4e4f\u4e2a\u4eba\u80cc\u666f\u3001\u804c\u4e1a\u3001\u5e74\u9f84\u7b49\u6df1\u5ea6\u4fe1\u606f\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06**\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u5174\u8da3\u9a71\u52a8\u4e3a\u4e3b\uff0c\u517c\u6709\u660e\u786e\u7684\u517c\u804c\u53d8\u73b0\u8bc9\u6c42\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u5174\u8da3\u662f\u6700\u597d\u7684\u8001\u5e08\uff0c\u6211\u662f\u771f\u7684\u89c9\u5f97\u6709\u610f\u601d\u201d\uff0c\u540c\u65f6\u4e5f\u5766\u8a00\u201c\u94b1\u5f53\u7136\u4e5f\u7f3a\u201d\u3002\u5176\u5b66\u4e60\u884c\u4e3a\uff08\u53c2\u4e0ePia\u620f\u3001\u5b8c\u6210\u4f5c\u4e1a\uff09\u79ef\u6781\uff0c\u4f46\u9762\u5bf9\u8bd5\u97f3\u8868\u73b0\u51fa\u660e\u663e\u7684\u4e0d\u81ea\u4fe1\u548c\u9000\u7f29\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5174\u8da3\u662f\u6700\u597d\u7684\u8001\u5e08\uff0c\u6211\u662f\u771f\u7684\u89c9\u5f97\u6709\u610f\u601d[\u6342\u8138]\u201d > \u201c\u94b1\u5f53\u7136\u4e5f\u7f3a[\u5472\u7259]\u201d > \u201c\u8bd5\u97f3\u90a3\u4e2a\u6682\u65f6\u6ca1\u81ea\u4fe1[\u6342\u8138]\u662f\u4e0d\u662f\u53ef\u4ee5\u4e0d\u53c2\u4e0e\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07**\u4f4e (1-2\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u4f7f\u7528\u82b1\u5457\u5206\u671f\u652f\u4ed8\u8bfe\u7a0b\u8d39\u7528\uff0c\u5e76\u5173\u6ce8\u624b\u7eed\u8d39\u95ee\u9898\uff0c\u8868\u660e\u8d44\u91d1\u5e76\u4e0d\u5bbd\u88d5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u53c2\u4e0e\u665a\u95f4\u76f4\u64ad\u548c\u5b8c\u6210\u4f5c\u4e1a\uff0c\u8868\u660e\u6709\u53ef\u652f\u914d\u7684\u788e\u7247\u65f6\u95f4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u672a\u77e5** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07**\u4f4e (1-2\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u9762\u5bf9\u8bd5\u97f3\u673a\u4f1a\u7b2c\u4e00\u53cd\u5e94\u662f\u201c\u6ca1\u81ea\u4fe1\u201d\u5e76\u76f4\u63a5\u9009\u62e9\u201c\u6682\u65f6\u4e0d\u53c2\u4e0e\u201d\uff0c\u9700\u8981\u9500\u552e\u53cd\u590d\u9f13\u52b1\u548c\u624b\u628a\u624b\u6307\u5bfc\u3002\u5bf9\u6280\u672f\u7ec6\u8282\uff08\u97f3\u8272\u6539\u53d8\uff09\u5b58\u5728\u754f\u96be\u60c5\u7eea\uff0c\u4f9d\u8d56\u5916\u90e8\u80af\u5b9a\uff08\u201c\u90a3\u5c31\u4fe1\u5fc3\u591a\u70b9\u4e86\u201d\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5e08\u59d0\uff0c\u8bd5\u97f3\u90a3\u4e2a\u6682\u65f6\u6ca1\u81ea\u4fe1[\u6342\u8138]\u662f\u4e0d\u662f\u53ef\u4ee5\u4e0d\u53c2\u4e0e\u201d > \u201c\u97f3\u8272\u4e0a\u4e0d\u77e5\u9053\u600e\u4e48\u6539\u53d8\u3002\u201d > \u201c\u90a3\u5c31\u4fe1\u5fc3\u591a\u70b9\u4e86\uff0c\u8c22\u8c22\u5e08\u59d0[\u7231\u5fc3][\u7231\u5fc3]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u5ea6\u7684\u4e0d\u81ea\u4fe1\u548c\u5bf9\u5931\u8d25\u7684\u6050\u60e7**\u3002\u5979\u5c06\u201c\u5e08\u59d0\u201d\u89c6\u4e3a\u6743\u5a01\u548c\u60c5\u611f\u652f\u67f1\uff0c\u901a\u8fc7\u201c\u5e08\u59d0\u201d\u7684\u80af\u5b9a\u6765\u83b7\u5f97\u5b89\u5168\u611f\u548c\u4ef7\u503c\u8ba4\u540c\u3002\u5979\u7684\u5b66\u4e60\u52a8\u529b\u5f88\u5927\u7a0b\u5ea6\u4e0a\u6e90\u4e8e\u88ab\u8ba4\u53ef\u3001\u88ab\u9f13\u52b1\u7684\u79ef\u6781\u53cd\u9988\uff0c\u800c\u975e\u7eaf\u7cb9\u7684\u6280\u672f\u8ffd\u6c42\u6216\u53d8\u73b0\u538b\u529b\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6301\u7eed\u3001\u5177\u4f53\u3001\u5938\u5f20\u7684\u80af\u5b9a\u4e0e\u9f13\u52b1**\uff0c\u4ee5\u53ca\u4e00\u79cd\u201c\u88ab\u5e08\u59d0\u7f69\u7740\u201d\u7684\u5b89\u5168\u611f\u3002\u5979\u9700\u8981\u7684\u662f\u4e00\u4e2a\u80fd\u4e0d\u65ad\u7ed9\u4e88\u5979\u6b63\u5411\u53cd\u9988\u3001\u5e2e\u5979\u62c6\u89e3\u56f0\u96be\u3001\u964d\u4f4e\u884c\u52a8\u95e8\u69db\u7684\u201c\u60c5\u611f\u6559\u7ec3\u201d\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u4e25\u91cd\u5185\u8017) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 **\u5b89\u5168\u672a\u89e6\u53d1** (\u4f46\u9700\u9ad8\u5ea6\u8b66\u60d5)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u7528\u6237\u5df2\u4f7f\u7528\u82b1\u5457\u5206\u671f\uff0c\u7b26\u5408**\u4ea4\u6613\u4fe1\u53f7\u786c\u62e6\u622a\u5c42**\u7684\u9884\u8b66\u6761\u4ef6\uff08\u4ed8\u6b3e\u8017\u65f6\u77ed+\u82b1\u5457\u5206\u671f\uff09\u3002\u867d\u7136\u804a\u5929\u4e2d\u672a\u8868\u73b0\u51fa\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\uff0c\u4f46\u7ed3\u5408\u5176\u4f4e\u5fc3\u7406\u5f39\u6027\uff0c\u5b58\u5728\u4eceT6\u9000\u5316\u4e3aT8-D\uff08\u7edd\u8def\u8d4c\u5f92\uff09\u7684\u6f5c\u5728\u98ce\u9669\u3002**\u5fc5\u987b\u6267\u884c48\u5c0f\u65f6\u6478\u5e95\u6838\u67e5**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4e2d | \u672a\u77e5\u5bb6\u5ead\u8d22\u52a1\u72b6\u51b5\uff0c\u82e5\u5206\u671f\u4ed8\u6b3e\u88ab\u5bb6\u4eba\u53d1\u73b0\u5e76\u53cd\u5bf9\uff0c\u53ef\u80fd\u5f15\u53d1\u9000\u8d39\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u4e00\u65e6\u8fdb\u5165\u6b63\u8bfe\uff0c\u4f5c\u4e1a\u96be\u5ea6\u63d0\u5347\u6216\u9996\u6b21\u8bd5\u97f3\u5931\u8d25\uff0c\u6781\u6613\u56e0\u201c\u5b66\u4e0d\u4f1a\u201d\u3001\u201c\u6ca1\u5929\u8d4b\u201d\u7684\u81ea\u5351\u611f\u800c\u77ac\u95f4\u5d29\u6e83\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u4efb\u4f55\u6280\u672f\u4e0a\u7684\u632b\u6298\uff08\u5982\u8f6f\u4ef6\u64cd\u4f5c\u3001\u97f3\u8272\u8c03\u6574\uff09\u3001\u6216\u611f\u89c9\u88ab\u8001\u5e08/\u540c\u5b66\u5ffd\u89c6\uff0c\u90fd\u53ef\u80fd\u89e6\u53d1\u5176\u201c\u6211\u4e0d\u884c\u201d\u7684\u5ff5\u5934\uff0c\u5bfc\u81f4\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u53d8\u73b0\u671f\u671b\u5b58\u5728\uff08\u201c\u80fd\u6323\u4e2a\u96f6\u82b1\u94b1\u81ea\u7136\u66f4\u597d\u201d\uff09\uff0c\u82e53-6\u4e2a\u6708\u5185\u65e0\u5b9e\u9645\u6536\u5165\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\uff0c\u4f46\u56e0\u5176\u5174\u8da3\u9a71\u52a8\uff0c\u98ce\u9669\u4f4e\u4e8e\u7eaf\u53d8\u73b0\u9a71\u52a8\u8005\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u6280\u672f\u96be\u5ea6\u521d\u663e\uff0c\u82e5\u7b2c\u4e00\u6b21\u72ec\u7acb\u5b8c\u6210\u4f5c\u4e1a\u6216\u8bd5\u97f3\u906d\u9047\u5dee\u8bc4\u6216\u77f3\u6c89\u5927\u6d77\uff0c\u9000\u8d39\u98ce\u9669\u6781\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u96ea\u96ea\uff0c\u606d\u559c\u4f60\u6b63\u5f0f\u52a0\u5165\uff01\u6211\u77e5\u9053\u4f60\u53ef\u80fd\u4f1a\u62c5\u5fc3\u81ea\u5df1\u505a\u4e0d\u597d\uff0c\u8fd9\u592a\u6b63\u5e38\u4e86\uff0c\u54b1\u4eec\u73ed\u5f88\u591a\u5927\u795e\u4e00\u5f00\u59cb\u90fd\u8fd9\u6837\u3002\u522b\u6015\uff0c\u54b1\u4eec\u4e0d\u8ddf\u522b\u4eba\u6bd4\uff0c\u5c31\u8ddf\u4f60\u81ea\u5df1\u6bd4\u3002\u6bcf\u6b21\u4f5c\u4e1a\u4f60\u53ea\u8981\u6bd4\u4e0a\u6b21\u591a\u6295\u5165\u4e00\u70b9\uff0c\u5c31\u662f\u5de8\u5927\u7684\u80dc\u5229\u3002\u6709\u4efb\u4f55\u5361\u4f4f\u7684\u5730\u65b9\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u5e2e\u4f60\u4e00\u8d77\u62c6\u89e3\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u6b65\u6765\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5174\u8da3\u966a\u4f34\u6210\u957f\u7ebf**\u3011\u3002**\u4e25\u7981**\u5c06\u5176\u63a8\u5411\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011\u7684\u9ad8\u538b\u73af\u5883\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u6ee1\u914d\u3010**\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\uff08\u7279\u79cdC\u6a21\u5757\uff09**\u3011\u3002\u521d\u671f\u4f5c\u4e1a\u8bbe\u8ba1\u9700**\u964d\u7ef4**\uff0c\u786e\u4fdd\u5176\u80fd\u8f7b\u677e\u5b8c\u6210\uff0c\u83b7\u5f97\u5373\u65f6\u6b63\u53cd\u9988\u3002\u6280\u672f\u6307\u5bfc\u9700**\u624b\u628a\u624b\u3001\u6309\u952e\u7ea7**\uff0c\u907f\u514d\u4f7f\u7528\u590d\u6742\u672f\u8bed\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u5728\u516c\u5f00\u573a\u5408\u6279\u8bc4\u6216\u4e0e\u5176\u4ed6\u5b66\u5458\u5bf9\u6bd4\u5979\u7684\u4f5c\u4e1a\u30022. \u5e03\u7f6e\u8d85\u51fa\u5176\u5f53\u524d\u80fd\u529b\u8303\u56f4\u7684\u201c\u6311\u6218\u4efb\u52a1\u201d\u30023. \u4f7f\u7528\u201c\u522b\u4eba\u90fd\u884c\u4f60\u600e\u4e48\u4e0d\u884c\u201d\u7b49\u6fc0\u5c06\u6cd5\u30024. **\u5728\u672a\u786e\u8ba4\u5176\u7ecf\u6d4e\u538b\u529b\u524d\uff0c\u8fdb\u884c\u4efb\u4f55\u5347\u5355\u63a8\u9500\u3002**\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5347\u5355**\u3002\u5fc5\u987b\u5148\u901a\u8fc748\u5c0f\u65f6\u6478\u5e95\uff08\u89c1\u5224\u5b9a\u6811\u7b2c\u4e00\u5c42-B\uff09\uff0c\u786e\u8ba4\u5176\u5206\u671f\u538b\u529b\u53ef\u63a7\u3001\u4e14\u5b66\u4e60\u8fdb\u5165\u7a33\u5b9a\u671f\uff08\u5982\u8fde\u7eed3\u5468\u4f5c\u4e1a\u8fbe\u6807\uff09\u540e\uff0c\u65b9\u53ef\u8003\u8651\u8f7b\u91cf\u7ea7\u9644\u52a0\u670d\u52a1\uff0c\u4e14\u5fc5\u987b\u91c7\u7528\u201c\u4e3a\u4f60\u91cf\u8eab\u5b9a\u5236\u3001\u5e2e\u4f60\u7701\u529b\u201d\u7684\u8bdd\u672f\uff0c\u800c\u975e\u201c\u5347\u7ea7\u6311\u6218\u201d\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5e08\u59d0\uff0c\u8bd5\u97f3\u90a3\u4e2a\u6682\u65f6\u6ca1\u81ea\u4fe1[\u6342\u8138]\u662f\u4e0d\u662f\u53ef\u4ee5\u4e0d\u53c2\u4e0e\u201d\n2. > \u201c\u97f3\u8272\u4e0a\u4e0d\u77e5\u9053\u600e\u4e48\u6539\u53d8\u3002\u201d\n3. > \u201c\u90a3\u5c31\u4fe1\u5fc3\u591a\u70b9\u4e86\uff0c\u8c22\u8c22\u5e08\u59d0[\u7231\u5fc3][\u7231\u5fc3]\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u88ab\u8ba4\u53ef\u3001\u88ab\u966a\u4f34\u7684\u5b89\u5168\u611f\uff08\u5f52\u5c5e\u4e0e\u5c0a\u91cd\u9700\u6c42\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u6ee1\u914d\u60c5\u7eea\u6258\u5e95\uff08\u7279\u79cdC\u6a21\u5757\uff09+ \u964d\u7ef4\u4efb\u52a1\u8bbe\u8ba1\uff08\u51cf\u538b\u7248A\u6a21\u5757\uff09\uff0c\u5e76\u572848\u5c0f\u65f6\u5185\u6478\u5e95\u5176\u5206\u671f\u4ed8\u6b3e\u7684\u771f\u5b9e\u538b\u529b\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u793e\u4ea4/\u5c0a\u91cd\", \"target_product_line\": \"\u5174\u8da3\u966a\u4f34\u6210\u957f\u7ebf+\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}\n```";
