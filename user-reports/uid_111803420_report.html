    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4f5c\u4e3a\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a111803420\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a111803420 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u914d\u97f3\u56e2\u961f-\u62db\u52df\u5b98-\u900d\u9065\u5e08\u59d0(\u5b8b\u6653\u6f2b) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u9a6c\u62c9\u96c5\u6709\u58f0\u4e3b\u64ad\u62db\u52df\u8bfe\u7a0b\uff08\u4ef7\u683c\u672a\u660e\u793a\uff0c\u4f46\u6d89\u53ca\u201c\u62a5\u540d\u201d\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u5b58\u5728\u501f\u8d37\u98ce\u9669\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u9ad8\u5bbd\u88d5**\uff08\u5e74\u524d\u8f9e\u804c\uff0c\u76ee\u524d\u5f85\u4e1a\uff0c\u65f6\u95f4\u81ea\u7531\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u7528\u6237\u4e3b\u52a8\u900f\u9732\u4e86\u5173\u952e\u80cc\u666f\u4fe1\u606f\uff0c\u4e92\u52a8\u79ef\u6781\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e**\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u6781\u901f\u53d8\u73b0\u7684\u7126\u8651\u3002\u5b66\u4e60\u610f\u613f\u5f3a\uff0c\u6709\u660e\u786e\u7684\u751f\u6d3b\u538b\u529b\u9a71\u52a8\uff08\u5e26\u5a03\u3001\u627e\u5de5\u4f5c\u96be\uff09\uff0c\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u83b7\u5f97\u6536\u5165\uff0c\u6539\u5584\u73b0\u72b6\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5176\u5b9e\u6211\u5c31\u662f\u5e74\u524d\u8f9e\u804c\u4e86\u561b\uff0c\u7136\u540e\u6700\u8fd1\u672c\u6765\u60f3\u627e\u5de5\u4f5c\u7684\uff0c\u4f46\u662f\u786e\u5b9e\u627e\u4e86\u51e0\u4efd\u513f\uff0c\u5c31\u662f\u770b\u4e86\u51e0\u4efd\u513f\u5de5\u4f5c\uff0c\u5c31\u662f\u5728\u65f6\u95f4\u4e0a\u5c31\u662f\u5e26\u4e0d\u5230\u5b69\u5b50\u3002...\u5982\u679c\u80fd\u591f\u53ef\u884c\u7684\u8bdd\uff0c\u6211\u5c31\u60f3\u597d\u597d\u7684\u628a\u8fd9\u4e2a\uff0c\u628a\u8fd9\u4e2a\u5c31\u662f\u505a\u8d77\u6765\uff0c\u770b\u770b\u80fd\u4e0d\u80fd\u6210\u529f\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b06\u9ad8 (7-8\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d (5-6\u5206)** \u2014 \u672a\u63d0\u53ca\u7ecf\u6d4e\u72b6\u51b5\uff0c\u4f46\u5904\u4e8e\u5f85\u4e1a\u72b6\u6001\uff0c\u53ef\u80fd\u5b58\u5728\u4e00\u5b9a\u7ecf\u6d4e\u538b\u529b\uff0c\u4f46\u65e0\u501f\u8d37\u4fe1\u53f7\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u9ad8 (7-8\u5206)** \u2014 \u5e74\u524d\u8f9e\u804c\uff0c\u76ee\u524d\u5f85\u4e1a\uff0c\u65f6\u95f4\u5145\u88d5\uff0c\u80fd\u6309\u65f6\u5b8c\u6210\u6240\u6709\u4f5c\u4e1a\u548c\u76f4\u64ad\u5b66\u4e60\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\uff0c\u4f46\u9700\u5173\u6ce8\u5e26\u5a03\u4e0e\u5b66\u4e60\u7684\u65f6\u95f4\u534f\u8c03\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8 (7-8\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u8bfb\u9519\u5b57\u7b49\u5c0f\u5931\u8bef\u80fd\u8f7b\u677e\u81ea\u5632\uff0c\u79ef\u6781\u8ddf\u8fdb\u5b66\u4e60\uff0c\u672a\u8868\u73b0\u51fa\u4efb\u4f55\u4f9d\u8d56\u6216\u6cae\u4e27\u60c5\u7eea\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u624d\u53d1\u73b0\u6211\u8bfb\u9519\u4e86\u4e00\u4e2a\u5b57[\u6342\u8138][\u6342\u8138]\u62e8\uff0c\u6ca1\u770b\u6e05\u695a\u201d\uff08\u8f7b\u677e\u81ea\u5632\uff0c\u65e0\u8d1f\u9762\u60c5\u7eea\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 (Safety Needs)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u56e0\u80b2\u513f\u5bfc\u81f4\u7684\u804c\u4e1a\u4e2d\u65ad\u4e0e\u7ecf\u6d4e\u4e0d\u5b89\u5168\u611f**\u3002\u5979\u8f9e\u804c\u540e\u627e\u5de5\u4f5c\uff0c\u53d1\u73b0\u65f6\u95f4\u4e0a\u65e0\u6cd5\u517c\u987e\u5e26\u5a03\uff0c\u9762\u4e34\u201c\u5e26\u5a03\u201d\u4e0e\u201c\u6536\u5165\u201d\u65e0\u6cd5\u4e24\u5168\u7684\u751f\u5b58\u56f0\u5883\uff0c\u6025\u9700\u4e00\u4efd\u80fd\u517c\u987e\u5bb6\u5ead\u3001\u65f6\u95f4\u81ea\u7531\u7684\u6536\u5165\u6765\u6e90\u6765\u83b7\u5f97\u751f\u6d3b\u4fdd\u969c\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u8fc7\u6765\u4eba\u201d\u7684\u5171\u60c5\u4e0e\u53ef\u5b9e\u73b0\u7684\u8def\u5f84\u5b89\u5168\u611f**\u3002\u9500\u552e\u201c\u900d\u9065\u5e08\u59d0\u201d\u4ee5\u540c\u6837\u5b9d\u5988\u8eab\u4efd\u7684\u6210\u529f\u7ecf\u5386\u8fdb\u884c\u793a\u8303\uff0c\u5e76\u63d0\u4f9b\u201c\u65f6\u95f4\u81ea\u7531\u3001\u624b\u673a\u6709\u7535\u5c31\u80fd\u5e72\u201d\u7684\u591a\u79cd\u53d8\u73b0\u5c97\u4f4d\uff0c\u7cbe\u51c6\u5730\u63d0\u4f9b\u4e86\u5979\u6700\u9700\u8981\u7684\u201c\u53ef\u884c\u6027\u201d\u4e0e\u201c\u5e0c\u671b\u201d\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u52a8\u673a\u4e2d\u3001\u8d44\u6e90\u9ad8\u3001\u5f39\u6027\u9ad8) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u8a00\u8bba\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4f4e** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u9700\u5173\u6ce8\u5176\u4f5c\u4e3a\u5b9d\u5988\uff0c\u82e5\u5b66\u4e60\u5360\u7528\u8fc7\u591a\u5e26\u5a03\u7cbe\u529b\uff0c\u53ef\u80fd\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u65f6\u95f4\u5145\u88d5\uff0c\u5b66\u4e60\u610f\u613f\u5f3a\uff0c\u8ddf\u8fdb\u5d29\u76d8\u98ce\u9669\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u8f7b\u677e\u5904\u7406\u5b66\u4e60\u4e2d\u7684\u5c0f\u9519\u8bef\uff0c\u60c5\u7eea\u7a33\u5b9a\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u5176\u6838\u5fc3\u9a71\u52a8\u662f\u201c\u5b89\u5168\u9700\u6c42\u201d\uff08\u627e\u4e00\u4efd\u80fd\u5e26\u5a03\u7684\u5de5\u4f5c\uff09\uff0c\u82e5\u5728\u627f\u8bfa\u7684\u5b66\u4e60\u5468\u671f\uff08\u59822-3\u4e2a\u6708\uff09\u5185\u672a\u80fd\u83b7\u5f97\u4efb\u4f55\u53d8\u73b0\u673a\u4f1a\u6216\u6b63\u5411\u53cd\u9988\uff0c\u53ef\u80fd\u56e0\u201c\u5e0c\u671b\u7834\u706d\u201d\u800c\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e60-90\u5929**\u3002\u82e5\u6b64\u65f6\u4ecd\u65e0\u4efb\u4f55\u63a5\u5355\u6216\u53d8\u73b0\u8ff9\u8c61\uff0c\u5176\u201c\u5b89\u5168\u9700\u6c42\u201d\u672a\u88ab\u6ee1\u8db3\uff0c\u9000\u8d39\u98ce\u9669\u5c06\u6025\u5267\u5347\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5e08\u59d0\uff0c\u770b\u5230\u4f60\u8bf4\u4e3a\u4e86\u5b69\u5b50\u8f9e\u804c\uff0c\u7279\u522b\u80fd\u7406\u89e3\u3002\u6211\u4e5f\u662f\u8fd9\u4e48\u8fc7\u6765\u7684\uff0c\u4e00\u8fb9\u5e26\u5a03\u4e00\u8fb9\u627e\u81ea\u5df1\u7684\u8def\u4e0d\u5bb9\u6613\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u6700\u5927\u7684\u597d\u5904\u5c31\u662f\u65f6\u95f4\u81ea\u7531\uff0c\u6b63\u597d\u80fd\u89e3\u51b3\u4f60\u7684\u96be\u9898\u3002\u4f60\u5e95\u5b50\u597d\u53c8\u8ba4\u771f\uff0c\u54b1\u4eec\u4e00\u6b65\u6b65\u6765\uff0c\u5148\u628a\u57fa\u7840\u6253\u624e\u5b9e\uff0c\u63a5\u5355\u7684\u4e8b\u5305\u5728\u6211\u8eab\u4e0a\uff0c\u80af\u5b9a\u8ba9\u4f60\u65e2\u80fd\u966a\u597d\u5b69\u5b50\uff0c\u53c8\u80fd\u6709\u4efd\u4e0d\u9519\u7684\u6536\u5165\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5979\u5177\u5907T2\u8001\u9ec4\u725b\u7684\u7279\u8d28\uff08\u8ba4\u771f\u3001\u6267\u884c\u529b\u5f3a\u3001\u6709\u6f5c\u529b\uff09\uff0c\u5e94\u63d0\u4f9b\u624e\u5b9e\u7684\u6280\u80fd\u8bad\u7ec3\u548c\u660e\u786e\u7684\u63a5\u5355\u8def\u5f84\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u201c\u5b89\u5168\u9700\u6c42\u201d\u548c\u5b9d\u5988\u8eab\u4efd\uff0c\u5efa\u8bae\u8865\u5145 **\u3010\u5b9d\u5988\u65f6\u95f4\u7ba1\u7406\u9526\u56ca\u3011** \u548c **\u3010\u65e9\u671f\u53d8\u73b0\u4fe1\u5fc3\u5305\u3011**\uff08\u5982\u7b80\u5355\u7684\u753b\u672c\u3001\u5bf9\u8f68\u7b49\u5165\u95e8\u7ea7\u6d3e\u5355\uff0c\u8ba9\u5979\u5c3d\u5feb\u83b7\u5f97\u6b63\u5411\u53cd\u9988\u548c\u5fae\u5c0f\u6536\u5165\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a**\u753b\u4e0d\u5207\u5b9e\u9645\u7684\u5927\u997c**\u3002\u907f\u514d\u8fc7\u5ea6\u627f\u8bfa\u201c\u6708\u5165\u8fc7\u4e07\u201d\u3001\u201c\u5feb\u901f\u66b4\u5bcc\u201d\uff0c\u5e94\u5f3a\u8c03\u201c\u65f6\u95f4\u81ea\u7531\u201d\u3001\u201c\u7a33\u5b9a\u589e\u957f\u201d\u3001\u201c\u9002\u5408\u5b9d\u5988\u201d\u7684\u52a1\u5b9e\u8def\u5f84\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u9700\u5efa\u7acb\u5728\u624e\u5b9e\u7684\u5b66\u4e60\u6210\u679c\u548c\u521d\u6b65\u53d8\u73b0\u57fa\u7840\u4e0a**\u3002\u5f53\u5979\u5b8c\u6210\u57fa\u7840\u8bfe\u7a0b\u5e76\u83b7\u5f97\u7b2c\u4e00\u7b14\u6536\u5165\u540e\uff0c\u53ef\u4ee5\u987a\u52bf\u63a8\u4ecb\u66f4\u9ad8\u7ea7\u7684\u8bfe\u7a0b\u6216\u8bbe\u5907\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5176\u5b9e\u6211\u5c31\u662f\u5e74\u524d\u8f9e\u804c\u4e86\u561b\uff0c\u7136\u540e\u6700\u8fd1\u672c\u6765\u60f3\u627e\u5de5\u4f5c\u7684\uff0c\u4f46\u662f\u786e\u5b9e\u627e\u4e86\u51e0\u4efd\u513f\uff0c\u5c31\u662f\u770b\u4e86\u51e0\u4efd\u513f\u5de5\u4f5c\uff0c\u5c31\u662f\u5728\u65f6\u95f4\u4e0a\u5c31\u662f\u5e26\u4e0d\u5230\u5b69\u5b50\u3002\u201d **(\u5b89\u5168\u9700\u6c42\u6838\u5fc3\u8bc1\u636e)**\n2. > \u201c\u6211\u624d\u53d1\u73b0\u6211\u8bfb\u9519\u4e86\u4e00\u4e2a\u5b57[\u6342\u8138][\u6342\u8138]\u62e8\uff0c\u6ca1\u770b\u6e05\u695a\u201d **(\u9ad8\u5fc3\u7406\u5f39\u6027\u8bc1\u636e)**\n3. > \u201c\u6211\u4e5f\u5f88\u671f\u5f85\u5728\u5e08\u59d0\u7684\u5e26\u9886\u4e0b\uff0c\u6211\u80fd\u591f\u6709\u6240\u6536\u5165\uff0c\u8fd9\u4e2a\u6211\u76f8\u4fe1\u6211\u7684\u6536\u5165\u4f1a\u5728\u5e08\u59d0\u7684\u5e26\u9886\u4e0b\u9010\u6b65\u63d0\u9ad8\u3002\u201d **(\u52a1\u5b9e\u3001\u4fe1\u4efb\u3001\u6709\u8010\u5fc3\u7684\u53d8\u73b0\u671f\u5f85)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\uff08\u4e00\u4efd\u80fd\u517c\u987e\u5e26\u5a03\u7684\u7a33\u5b9a\u6536\u5165\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u572860-90\u5929\u5185\u63d0\u4f9b\u771f\u5b9e\u7684\u3001\u54ea\u6015\u5fae\u5c0f\u7684\u53d8\u73b0\u673a\u4f1a\u6216\u6b63\u5411\u53cd\u9988\uff0c\u6ee1\u8db3\u5176\u201c\u5b89\u5168\u9700\u6c42\u201d\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\"}\n```";
