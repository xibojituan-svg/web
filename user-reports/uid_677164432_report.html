    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a (UID: 677164432)\n\n## \u4e00\u3001 \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u4e2d\u7b49\u504f\u4e0a**\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5b66\u4e60\u5174\u8da3\u548c\u884c\u52a8\u529b\uff08\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\u3001\u4e3b\u52a8\u8be2\u95ee\u8bd5\u97f3\uff09\uff0c\u5bf9\u201c\u5f55\u4e66\u3001\u753b\u672c\u3001\u5ba1\u542c\u201d\u7b49\u5177\u4f53\u5de5\u79cd\u611f\u5174\u8da3\uff0c\u663e\u793a\u5176\u76ee\u6807\u4e3a**\u6280\u80fd\u4e60\u5f97\u4e0e\u526f\u4e1a\u53d8\u73b0**\u3002\u4f46\u7f3a\u4e4f\u5bf9\u4e2a\u4eba\u957f\u671f\u804c\u4e1a\u89c4\u5212\u7684\u6df1\u5ea6\u63a2\u8ba8\uff0c\u52a8\u673a\u53ef\u80fd\u53d7\u77ed\u671f\u201c\u673a\u4f1a\u201d\u548c\u201c\u8d44\u6e90\u201d\u5438\u5f15\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u7528\u6237\u7684**\u804c\u4e1a\u3001\u6536\u5165\u3001\u53ef\u652f\u914d\u65f6\u95f4\u3001\u8bbe\u5907\u6761\u4ef6**\u7b49\u5173\u952e\u8d44\u6e90\u4fe1\u606f\u3002\u4ec5\u4ece\u884c\u4e3a\u63a8\u65ad\uff0c\u7528\u6237\u6709\u65f6\u95f4\u5b8c\u6210\u6bcf\u65e5\u5b66\u4e60\u4efb\u52a1\uff0c\u4f46\u5bf9\u4e13\u4e1a\u5f55\u97f3\u8bbe\u5907/\u73af\u5883\u65e0\u63d0\u53ca\uff0c\u8d44\u6e90\u5e95\u5ea7**\u5b58\u7591**\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u4e2d\u7b49**\u3002\u7528\u6237\u6c9f\u901a\u79ef\u6781\uff08\u201c\u597d\u5462\u597d\u5462\u201d\u3001\u201c\u597d\u5662\u201d\uff09\uff0c\u914d\u5408\u5ea6\u9ad8\uff0c\u80fd\u63a5\u53d7\u53cd\u9988\uff08\u201c\u6709\u7684\u6709\u7684\uff0c\u611f\u89c9\u5b8c\u5168\u4e0d\u4e00\u6837\u4e86\u201d\uff09\u3002\u9762\u5bf9\u5b66\u4e60\u96be\u70b9\uff08\u611f\u60c5\u628a\u63e1\uff09\u80fd\u63d0\u51fa\u56f0\u60d1\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u660e\u663e\u7684\u754f\u96be\u6216\u653e\u5f03\u60c5\u7eea\u3002\u6574\u4f53\u5448\u73b0**\u987a\u4ece\u3001\u914d\u5408\u3001\u6267\u884c\u529b\u5f3a**\u7684\u7279\u5f81\uff0c\u6297\u538b\u80fd\u529b\u672a\u77e5\u3002\n\n## \u4e8c\u3001 ABCD\u5224\u5b9a\u6811\u5206\u6790\n\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u4e8e4\u67088\u65e5\u652f\u4ed8\u4e862380\u5143\uff08\u9ad8\u9636\u73ed\uff09\u53ca400\u5143\uff08\u5176\u4ed6\u8bfe\u7a0b/\u670d\u52a1\uff09\uff0c\u5b8c\u6210\u62a5\u540d\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u4e2d\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u6216\u7b2c\u4e09\u65b9\u51b3\u7b56\u8005\u4fe1\u606f\uff0c**\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u4e3a\u72ec\u7acb\u652f\u4ed8\u51b3\u7b56**\u3002\u6b64\u4e3a**\u5173\u952e\u98ce\u9669\u76f2\u533a**\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u4e0e\u8d44\u6e90\u521d\u6b65\u5224\u65ad (A/B)**: \u52a8\u673a\u660e\u786e\uff08B\u7c7b\u7279\u5f81\uff09\uff0c\u4f46\u8d44\u6e90\u4fe1\u606f\u7f3a\u5931\u3002\u7ed3\u5408\u5176\u914d\u5408\u884c\u4e3a\uff0c\u6682\u5f52\u4e3a **B\u7c7b\uff08\u6709\u660e\u786e\u76ee\u6807\u4f46\u8d44\u6e90\u5f85\u6838\u5b9e\uff09**\u3002\n*   **\u6b65\u9aa42 - \u627f\u8bfa\u5ea6\u4e0e\u884c\u52a8\u529b (C/D)**: \u7528\u6237\u884c\u52a8\u529b\u5f3a\uff08C\u7c7b\u7279\u5f81\uff09\uff0c\u6309\u65f6\u5b8c\u6210\u6240\u6709\u4efb\u52a1\uff0c\u4e3b\u52a8\u8be2\u95ee\u8bd5\u97f3\u7ec6\u8282\uff0c\u627f\u8bfa\u5ea6\u9ad8\u3002\u5224\u5b9a\u4e3a **C\u7c7b\uff08\u9ad8\u627f\u8bfa\u884c\u52a8\u8005\uff09**\u3002\n*   **\u6700\u7ec8\u5224\u5b9a**: **B-C\u6df7\u5408\u578b**\u3002\u5177\u6709\u660e\u786e\u7684\u5b66\u4e60-\u53d8\u73b0\u52a8\u673a\u548c\u8f83\u5f3a\u7684\u6267\u884c\u914d\u5408\u5ea6\uff0c\u4f46\u5bb6\u5ead\u51b3\u7b56\u6743\u4e0e\u8d44\u6e90\u5e95\u5ea7\u4fe1\u606f\u7f3a\u5931\u6784\u6210\u98ce\u9669\u70b9\u3002\n\n## \u4e09\u3001 \u7528\u6237\u539f\u578b\u5339\u914d\n\n*   **\u5339\u914d\u539f\u578b**: **T3 \u52a1\u5b9e\u53d8\u73b0\u8005**\u3002\n    *   **\u4f9d\u636e**: \u6838\u5fc3\u9a71\u52a8\u529b\u4e3a\u201c\u5b66\u6280\u80fd\u3001\u63a5\u5355\u3001\u8d5a\u94b1\u201d\u3002\u5bf9\u201c\u5f55\u4e66\u3001\u753b\u672c\u3001\u5ba1\u542c\u201d\u7b49\u5177\u4f53\u5c97\u4f4d\u3001\u8bd5\u97f3\u6d41\u7a0b\u3001\u7248\u6743\u4e66\u8868\u73b0\u51fa\u6d53\u539a\u5174\u8da3\u3002\u5b66\u4e60\u884c\u4e3a\u56f4\u7ed5\u201c\u53d8\u73b0\u76f4\u64ad\u201d\u3001\u201c\u901a\u5173\u201d\u3001\u201c\u8003\u6838\u201d\u5c55\u5f00\uff0c\u52a1\u5b9e\u5bfc\u5411\u660e\u663e\u3002\u6c9f\u901a\u98ce\u683c\u52a1\u5b9e\u3001\u7b80\u6d01\uff0c\u5173\u6ce8\u64cd\u4f5c\u7ec6\u8282\uff08\u201c\u624b\u673a\u81ea\u5e26\u5f55\u97f3\u673a\u53ef\u4ee5\u7528\u5417\u201d\uff09\u3002\n\n## \u56db\u3001 \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n\n*   **\u603b\u4f53\u98ce\u9669**: **\u4e2d**\u3002\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**: **\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u201c\u5feb\u901f\u6323\u5230\u7b2c\u4e00\u6876\u91d1\u201d\u62b1\u6709\u671f\u5f85\u3002\u82e5\u540e\u7eed\u63a5\u5355\u4e0d\u987a\u6216\u6536\u5165\u4e0e\u5ba3\u4f20\u5dee\u8ddd\u5927\uff0c\u6613\u5f15\u53d1\u5931\u671b\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b/\u51b3\u7b56\u4e89\u8bae**: **\u9ad8\u98ce\u9669**\u3002**\u5bb6\u5ead\u51b3\u7b56\u6743\u672a\u77e5**\uff0c\u652f\u4ed8\u884c\u4e3a\u53ef\u80fd\u672a\u7ecf\u914d\u5076\u6216\u5bb6\u5ead\u4e3b\u8981\u6210\u5458\u540c\u610f\uff0c\u662f\u6700\u5927\u7684\u6f5c\u5728\u9000\u8d39\u89e6\u53d1\u70b9\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**: **\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u770b\u7528\u6237\u65f6\u95f4\u914d\u5408\u5ea6\u9ad8\u3002\n    4.  **\u5185\u5bb9/\u670d\u52a1\u4e0d\u7b26**: **\u4e2d\u4f4e\u98ce\u9669**\u3002\u9500\u552e\u8fc7\u7a0b\u5c55\u793a\u4e86\u5177\u4f53\u6559\u5b66\u3001\u70b9\u8bc4\u3001\u8d44\u6e90\uff08\u8bd5\u97f3\u3001\u7248\u6743\u4e66\uff09\uff0c\u4e0e\u7528\u6237\u5f53\u524d\u9700\u6c42\u5339\u914d\u5ea6\u8f83\u9ad8\u3002\n    5.  **\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa**: **\u4e2d\u98ce\u9669**\u3002\u9500\u552e\u8bdd\u672f\u5b58\u5728**\u201c\u770b\u597d\u4f60\u201d\u3001\u201c\u91cd\u70b9\u57f9\u517b\u201d\u3001\u201c\u5feb\u901f\u201d\u3001\u201c\u9ad8\u65f6\u85aa\u6848\u4f8b\u201d** \u7b49\u5f15\u5bfc\u6027\u8bed\u8a00\uff0c\u53ef\u80fd\u62d4\u9ad8\u7528\u6237\u9884\u671f\u3002\n    6.  **\u5b66\u4e60\u632b\u8d25\u611f**: **\u4e2d\u4f4e\u98ce\u9669**\u3002\u7528\u6237\u76ee\u524d\u5b66\u4e60\u53cd\u9988\u6b63\u5411\uff0c\u4f46\u82e5\u540e\u7eed\u8bfe\u7a0b\u96be\u5ea6\u9661\u589e\u6216\u53cd\u9988\u4e0d\u4f73\uff0c\u53ef\u80fd\u4ea7\u751f\u632b\u8d25\u3002\n    7.  **\u5e73\u53f0/\u5e08\u8d44\u98ce\u9669**: **\u4f4e\u98ce\u9669**\u3002\u6682\u672a\u4f53\u73b0\u3002\n\n## \u4e94\u3001 \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n\n*   **\u4e3b\u8981\u95ee\u9898**:\n    1.  **\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u9884\u671f\u7ba1\u7406**: \u9500\u552e\u591a\u6b21\u4f7f\u7528\u201c\u770b\u597d\u4f60\u201d\u3001\u201c\u53ef\u5851\u6027\u633a\u5f3a\u201d\u3001\u201c\u4e0b\u4e00\u4e2a\u4f18\u79c0\u4e3b\u64ad\u201d\u3001\u201c\u5feb\u901f\u6323\u5230\u7b2c\u4e00\u6876\u91d1\u201d\u3001\u201c\u9ad8\u65f6\u85aa\u6848\u4f8b\u201d\u7b49\u8bdd\u672f\uff0c**\u5b58\u5728\u5938\u5927\u6536\u76ca\u3001\u5f15\u5bfc\u9ad8\u9884\u671f\u7684\u98ce\u9669**\u3002\n    2.  **\u5236\u9020\u7a00\u7f3a\u4e0e\u7d27\u8feb\u611f**: \u4f7f\u7528\u201c\u6700\u540e\u4e00\u6b21\u8003\u6838\u201d\u3001\u201c\u6c47\u603b\u6700\u7ec8\u540d\u5355\u201d\u3001\u201c\u540d\u989d\u8981\u6ca1\u6709\u4e86\u201d\u3001\u201c\u73b0\u573a\u53d1\u4f18\u60e0\u5238\u201d\u7b49\u8bdd\u672f\uff0c\u7b26\u5408\u884c\u4e1a\u5e38\u89c1\u4fc3\u5355\u624b\u6cd5\uff0c\u4f46\u9700\u6ce8\u610f\u5c3a\u5ea6\u3002\n    3.  **\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5\u7f3a\u5931**: **\u4e25\u91cd\u7f3a\u5931**\u3002\u9500\u552e\u5168\u7a0b\u672a\u8be2\u95ee\u6216\u786e\u8ba4\u652f\u4ed8\u662f\u5426\u4e3a\u4e2a\u4eba\u72ec\u7acb\u51b3\u7b56\u6216\u5df2\u83b7\u5bb6\u5ead\u652f\u6301\uff0c\u8fd9\u662f\u91cd\u5927\u7684\u5408\u89c4\u4e0e\u98ce\u63a7\u6f0f\u6d1e\u3002\n*   **\u5408\u89c4\u70b9**: \u63d0\u4f9b\u4e86\u5177\u4f53\u7684\u4f5c\u4e1a\u70b9\u8bc4\u3001\u5b66\u4e60\u65b9\u6cd5\u6307\u5bfc\u3001\u8bd5\u97f3\u6e20\u9053\u3001\u7248\u6743\u4e66\u7b49\u5b9e\u8d28\u6027\u670d\u52a1\u5185\u5bb9\uff0c\u5e76\u975e\u7eaf\u5ffd\u60a0\u3002\n\n## \u516d\u3001 \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**: **\u5339\u914d**\u3002\u7528\u6237T3\u539f\u578b\u4e0e\u804c\u4e1a\u6280\u80fd\u53d8\u73b0\u7c7b\u4ea7\u54c1\u76ee\u6807\u7528\u6237\u9ad8\u5ea6\u543b\u5408\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **24\u5c0f\u65f6\u5185\u8fdb\u884c\u5bb6\u5ead\u77e5\u60c5\u786e\u8ba4\u4e0e\u9884\u671f\u6821\u6b63**\u3002\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**:\n    1.  **\u9996\u8981\u4efb\u52a1\uff08\u98ce\u9669\u7ba1\u63a7\uff09**: \u73ed\u4e3b\u4efb\u63a5\u624b\u540e\uff0c**\u5fc5\u987b\u572824\u5c0f\u65f6\u5185\u4ee5\u6e29\u548c\u65b9\u5f0f\u6838\u5b9e\u652f\u4ed8\u662f\u5426\u83b7\u5f97\u5bb6\u5ead\u652f\u6301**\uff08\u4f8b\u5982\uff1a\u201c\u4e3a\u4e86\u7ed9\u60a8\u63d0\u4f9b\u66f4\u957f\u671f\u7a33\u5b9a\u7684\u652f\u6301\uff0c\u60f3\u4e86\u89e3\u4e00\u4e0b\u60a8\u7684\u5b66\u4e60\u8ba1\u5212\u5bb6\u4eba\u662f\u5426\u4e5f\u4e86\u89e3\u5462\uff1f\u201d\uff09\u3002\u540c\u65f6\uff0c**\u6821\u6b63\u53d8\u73b0\u9884\u671f**\uff0c\u5f3a\u8c03\u6280\u80fd\u79ef\u7d2f\u5468\u671f\u3001\u6536\u5165\u7684\u4e0d\u786e\u5b9a\u6027\uff0c\u5c06\u201c\u5feb\u901f\u53d8\u73b0\u201d\u5f15\u5bfc\u81f3\u201c\u957f\u671f\u804c\u4e1a\u53d1\u5c55\u201d\u3002\n    2.  **\u670d\u52a1\u91cd\u70b9\uff08\u5de9\u56fa\u4fe1\u4efb\uff09**: \u5ef6\u7eed\u5176\u201c\u52a1\u5b9e\u201d\u7279\u70b9\uff0c\u63d0\u4f9b\u6e05\u6670\u7684**\u5b66\u4e60\u8def\u5f84\u56fe\u3001\u63a5\u5355\u6807\u51c6\u6d41\u7a0b\u3001\u6210\u529f\u5b66\u5458\u7684\u5e38\u6001\u6848\u4f8b\uff08\u975e\u6781\u7aef\u6848\u4f8b\uff09**\u3002\u5bf9\u5176\u4e3b\u52a8\u5c1d\u8bd5\u8bd5\u97f3\u7684\u884c\u4e3a\u7ed9\u4e88\u9f13\u52b1\u548c\u5177\u4f53\u6307\u5bfc\u3002\n    3.  **\u6301\u7eed\u89c2\u5bdf**: \u5bc6\u5207\u5173\u6ce8\u5176\u8fdb\u5165\u7cfb\u7edf\u8bfe\u540e\u7684**\u5b9e\u8df5\u53cd\u9988**\u3002\u82e5\u521d\u671f\u8bd5\u97f3\u672a\u4e2d\u6216\u63a5\u5355\u56f0\u96be\uff0c\u9700\u63d0\u524d\u4ecb\u5165\u8fdb\u884c\u5fc3\u7406\u758f\u5bfc\u548c\u65b9\u6cd5\u6307\u5bfc\uff0c\u9632\u6b62\u632b\u8d25\u611f\u7d2f\u79ef\u3002\n    4.  **\u6c9f\u901a\u98ce\u683c**: \u4fdd\u6301\u4e13\u4e1a\u3001\u52a1\u5b9e\u3001\u9f13\u52b1\u7684\u98ce\u683c\uff0c\u907f\u514d\u8fc7\u5ea6\u201c\u6253\u9e21\u8840\u201d\uff0c\u591a\u63d0\u4f9b\u201c\u5982\u4f55\u505a\u201d\u7684\u5177\u4f53\u65b9\u6848\u3002\n\n{\"core_type\": \"T3 \u52a1\u5b9e\u53d8\u73b0\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u5339\u914d\", \"action\": \"24h\u5185\u5bb6\u5ead\u77e5\u60c5\u786e\u8ba4\u4e0e\u9884\u671f\u6821\u6b63\"}";
