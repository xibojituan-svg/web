    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## \u4e00\u3001 \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49)**\n    *   **\u8868\u5c42\u52a8\u673a**: \u638c\u63e1\u6709\u58f0\u6f14\u64ad\u6280\u80fd\uff0c\u5bfb\u6c42\u517c\u804c/\u526f\u4e1a\u53d8\u73b0\u673a\u4f1a\uff08\u201c\u5148\u4ece\u5f55\u4e66\uff0c\u753b\u672c\uff0c\u5ba1\u542c\u5165\u624b\u201d\uff09\u3002\n    *   **\u6df1\u5c42\u52a8\u673a**: \u5b58\u5728\u5174\u8da3\u4e0e\u81ea\u6211\u63d0\u5347\u6210\u5206\uff08\u201c\u7ed9\u5b69\u5b50\u8bb2\u6545\u4e8b\u7684\u5e38\u6001\u201d\uff09\uff0c\u4f46**\u53d8\u73b0\u9a71\u52a8\u660e\u786e\u4e14\u6025\u8feb**\uff08\u591a\u6b21\u8be2\u95ee\u8bd5\u97f3\u3001\u8fdb\u5267\u7ec4\u65f6\u95f4\uff09\u3002\n    *   **\u4fe1\u53f7**: \u5bf9\u201c\u5feb\u901f\u6323\u5230\u7b2c\u4e00\u6876\u91d1\u201d\u3001\u201c\u53d8\u73b0\u8def\u5f84\u201d\u3001\u201c\u63a5\u5355\u201d\u7b49\u5173\u952e\u8bcd\u9ad8\u5ea6\u5173\u6ce8\u5e76\u79ef\u6781\u56de\u5e94\u3002\n\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d\u7b49\u504f\u4f4e)**\n    *   **\u65f6\u95f4/\u7cbe\u529b**: \u5728\u804c\u72b6\u6001\uff0c\u5229\u7528\u788e\u7247\u5316\u65f6\u95f4\u5b66\u4e60\uff08\u201c\u6211\u8fd9\u4f1a\u4e0a\u7740\u73ed\u5462\u201d\uff09\uff0c\u80fd\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\uff0c\u4f46\u5b66\u4e60\u65f6\u95f4\u6709\u9650\u3002\n    *   **\u6280\u80fd\u57fa\u7840**: \u7eaf\u5c0f\u767d\uff0c\u6709\u53d1\u97f3\u56f0\u6270\uff08\u201c\u524d\u9f3b\u97f3\u540e\u9f3b\u97f3...\u5206\u4e0d\u6e05\u695a\u201d\uff09\uff0c\u4f46\u6709\u5fa1\u59d0\u97f3\u6f5c\u8d28\u548c\u65b9\u8a00\u4f18\u52bf\uff08\u6f6e\u6c55\u8bdd\u3001\u7ca4\u8bed\uff09\u3002\n    *   **\u7ecf\u6d4e\u6295\u5165**: \u5df2\u652f\u4ed82380\u5143\u8bfe\u7a0b\u8d39\u7528\uff0c\u5c5e\u4e8e\u5c0f\u989d\u4ed8\u8d39\uff0c\u5bf9\u540e\u7eed\u53ef\u80fd\u7684\u5927\u989d\u6295\u5165**\u4fe1\u606f\u4e0d\u8db3**\u3002\n    *   **\u8bbe\u5907/\u73af\u5883**: \u4fe1\u606f\u4e0d\u8db3\uff0c\u4ec5\u63d0\u53ca\u7528\u624b\u673a\u5f55\u97f3\u3002\n\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u7b49\u504f\u9ad8)**\n    *   **\u632b\u6298\u8010\u53d7**: \u9762\u5bf9\u53d1\u97f3\u56f0\u96be\u6709\u81ea\u6211\u89c9\u5bdf\uff08\u201c\u58f0\u97f3\u6241\u6241\u7684\u201d\uff09\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u653e\u5f03\uff0c\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff08\u201c\u7b49\u628a\u58f0\u97f3\u7ec3\u51fa\u6765\u4e86\u518d\u8bd5\u97f3\uff1f\u201d\uff09\u3002\n    *   **\u575a\u6301\u6027**: \u5b66\u4e60\u914d\u5408\u5ea6\u9ad8\uff0c\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u89c2\u770b\u76f4\u64ad\u3001\u53c2\u4e0e\u4e92\u52a8\uff0c\u6001\u5ea6\u79ef\u6781\uff08\u201c\u6211\u4f1a\u597d\u597d\u5b66\u7684\u201d\uff09\u3002\n    *   **\u4f9d\u8d56\u503e\u5411**: \u5bf9\u9500\u552e\uff08\u5e08\u59d0\uff09\u6709\u8f83\u5f3a\u4fe1\u4efb\u548c\u4f9d\u8d56\uff08\u201c\u5e08\u59d0\u5e26\u6211\u98de\u201d\u3001\u201c\u5c31\u542c\u60a8\u7684\u201d\uff09\uff0c**\u51b3\u7b56\u6613\u53d7\u6743\u5a01\u5f15\u5bfc**\u3002\n    *   **\u4fe1\u5fc3\u6ce2\u52a8**: \u521d\u671f\u4e0d\u81ea\u4fe1\uff0c\u7ecf\u9500\u552e\u9f13\u52b1\u540e\u4fe1\u5fc3\u63d0\u5347\uff08\u201c\u6211\u73b0\u5728\u4e5f\u6709\u4fe1\u5fc3\u5566\u201d\uff09\u3002\n\n## \u4e8c\u3001 ABCD\u5224\u5b9a\u6811\u5206\u6790\n\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u5df2\u652f\u4ed82380\u5143\u62a5\u540d\u9ad8\u9636\u73ed\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u914d\u5076\u3001\u7236\u6bcd\u7b49\u5bb6\u5ead\u6210\u5458\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u4e3a\u72ec\u7acb\u51b3\u7b56\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u7eaf\u5ea6**: **B\u7c7b (\u529f\u5229\u9a71\u52a8\u578b)**\u3002\u53d8\u73b0\u8bc9\u6c42\u660e\u786e\uff0c\u662f\u6838\u5fc3\u9a71\u52a8\u529b\u3002\n*   **\u6b65\u9aa42 - \u8d44\u6e90\u5339\u914d**: **C\u7c7b (\u8d44\u6e90\u7d27\u5f20\u578b)**\u3002\u5728\u804c\u3001\u5c0f\u767d\u3001\u6709\u53d1\u97f3\u77ed\u677f\uff0c\u4e0e\u201c\u5feb\u901f\u53d8\u73b0\u201d\u9884\u671f\u5b58\u5728\u6f5c\u5728\u51b2\u7a81\u3002\n*   **\u6b65\u9aa43 - \u5fc3\u7406\u753b\u50cf**: **B\u7c7b (\u6613\u5f15\u5bfc\u578b)**\u3002\u4fe1\u4efb\u9500\u552e\uff0c\u914d\u5408\u5ea6\u9ad8\uff0c\u6613\u53d7\u627f\u8bfa\u548c\u9f13\u52b1\u5f71\u54cd\u3002\n*   **\u7efc\u5408\u5224\u5b9a**: **B-C\u578b\u7528\u6237**\u3002\u6838\u5fc3\u7279\u5f81\u4e3a**\u529f\u5229\u9a71\u52a8\u3001\u8d44\u6e90\u6709\u9650\u3001\u6613\u53d7\u5f15\u5bfc**\u3002\n\n## \u4e09\u3001 \u7528\u6237\u539f\u578b\u5339\u914d\n\n*   **\u5339\u914d\u539f\u578b: T4 \u529f\u5229\u5c1d\u9c9c\u8005**\n    *   **\u7279\u5f81\u543b\u5408**:\n        1.  **\u6838\u5fc3\u9a71\u52a8**: \u526f\u4e1a\u53d8\u73b0\uff0c\u5bf9\u201c\u7b2c\u4e00\u6876\u91d1\u201d\u3001\u201c\u63a5\u5355\u201d\u654f\u611f\u3002\n        2.  **\u884c\u52a8\u6a21\u5f0f**: \u5728\u9500\u552e\u9ad8\u5bc6\u5ea6\u9f13\u52b1\u548c\u8d44\u6e90\u627f\u8bfa\uff08\u7248\u6743\u4e66\u3001\u8fdb\u5267\u7ec4\uff09\u4e0b\u5feb\u901f\u5b8c\u6210\u8f6c\u5316\u3002\n        3.  **\u98ce\u9669\u504f\u597d**: \u613f\u610f\u4e3a\u201c\u673a\u4f1a\u201d\u652f\u4ed8\u5c0f\u989d\u5165\u95e8\u8d39\uff0c\u4f46\u5bf9\u884c\u4e1a\u957f\u671f\u6295\u5165\u548c\u96be\u5ea6**\u8ba4\u77e5\u53ef\u80fd\u4e0d\u8db3**\u3002\n        4.  **\u5173\u7cfb\u5efa\u7acb**: \u8fc5\u901f\u4e0e\u9500\u552e\u5efa\u7acb\u201c\u5e08\u5f92\u201d\u4fe1\u4efb\u5173\u7cfb\uff0c\u5bfb\u6c42\u957f\u671f\u5e26\u6559\u3002\n\n## \u56db\u3001 \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4e2d)\n\n\u5bf97\u79cd\u9000\u8d39\u6839\u56e0\u9010\u9879\u6392\u67e5\uff1a\n1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**: **\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u201c\u5feb\u901f\u53d8\u73b0\u201d\u62b1\u6709\u671f\u5f85\uff0c\u4f46\u5176\u53d1\u97f3\u57fa\u7840\u8584\u5f31\uff08\u5e7f\u4e1c\u53e3\u97f3\uff09\uff0c\u4e0e\u5e02\u573a\u63a5\u5355\u8981\u6c42\u6709\u5dee\u8ddd\uff0c**\u6781\u6613\u5728\u5b66\u4e60\u4e2d\u671f\u56e0\u8bd5\u97f3\u5c61\u6b21\u5931\u8d25\u800c\u4ea7\u751f\u5de8\u5927\u843d\u5dee\u611f**\u3002\n2.  **\u7ecf\u6d4e\u538b\u529b**: \u4fe1\u606f\u4e0d\u8db3\u3002\u5df2\u652f\u4ed82380\u5143\uff0c\u9700\u5173\u6ce8\u540e\u7eed\u662f\u5426\u6709\u5206\u671f\u6216\u52a0\u8d2d\u8ba1\u5212\u3002\n3.  **\u65f6\u95f4\u51b2\u7a81**: **\u4e2d\u98ce\u9669**\u3002\u5728\u804c\u5b66\u4e60\uff0c\u65f6\u95f4\u788e\u7247\u5316\uff0c\u4e0e\u9700\u8981\u6301\u7eed\u7ec3\u4e60\u7684\u6709\u58f0\u6280\u80fd\u57f9\u517b\u6a21\u5f0f\u53ef\u80fd\u5b58\u5728\u51b2\u7a81\u3002\n4.  **\u5bb6\u5ead\u53cd\u5bf9**: \u4fe1\u606f\u4e0d\u8db3\u3002\n5.  **\u7ade\u54c1\u6bd4\u8f83/\u8d1f\u9762\u4fe1\u606f**: \u4fe1\u606f\u4e0d\u8db3\u3002\n6.  **\u670d\u52a1\u4f53\u9a8c**: **\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u5bf9\u9500\u552e\u670d\u52a1\u975e\u5e38\u6ee1\u610f\uff0c\u5173\u7cfb\u878d\u6d3d\u3002\n7.  **\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa**: **\u4e2d\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u591a\u6b21\u4f7f\u7528\u201c\u5feb\u901f\u8d5a\u5230\u7b2c\u4e00\u6876\u91d1\u201d\u3001\u201c\u770b\u597d\u4f60\u201d\u3001\u201c\u5e26\u4f60\u5165\u884c\u201d\u3001\u201c\u8fdb\u5267\u7ec4\u201d\u7b49\u8bdd\u672f\uff0c**\u53ef\u80fd\u62d4\u9ad8\u4e86\u7528\u6237\u5bf9\u5b66\u4e60\u5468\u671f\u548c\u53d8\u73b0\u901f\u5ea6\u7684\u9884\u671f**\uff0c\u4e3a\u540e\u7eed\u6295\u8bc9\u57cb\u4e0b\u9690\u60a3\u3002\n\n## \u4e94\u3001 \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n\n*   **\u5408\u89c4\u70b9**:\n    *   \u9500\u552e\u63d0\u4f9b\u4e86\u5177\u4f53\u7ec3\u4e60\u6307\u5bfc\u3001\u4f5c\u4e1a\u70b9\u8bc4\uff0c\u5c5e\u4e8e\u6b63\u5e38\u6559\u5b66\u670d\u52a1\u8303\u7574\u3002\n    *   \u5f15\u5bfc\u7528\u6237\u5b8c\u6210\u76f4\u64ad\u3001\u4f5c\u4e1a\u7b49\u73af\u8282\u540e\u8f6c\u5316\uff0c\u6d41\u7a0b\u4e0a\u6709\u8ff9\u53ef\u5faa\u3002\n*   **\u98ce\u9669\u70b9**:\n    *   **\u3010\u8fc7\u5ea6\u627f\u8bfa\u98ce\u9669\u3011**\uff1a\u9500\u552e\u5f3a\u8c03\u201c\u5feb\u901f\u6323\u5230\u7b2c\u4e00\u6876\u91d1\u201d\u3001\u201c\u5e26\u4f60\u5165\u884c\u8ba9\u4f60\u58f0\u97f3\u5347\u503c\u201d\uff0c\u5e76\u627f\u8bfa\u201c\u7248\u6743\u4e66\u201d\u3001\u201c\u8fdb\u5267\u7ec4\u201d\uff0c\u53ef\u80fd\u8ba9\u7528\u6237\u4ea7\u751f\u201c\u62a5\u540d\u5373\u53ef\u63a5\u5355\u201d\u7684\u8bef\u89e3\u3002\n    *   **\u3010\u9884\u671f\u7ba1\u7406\u4e0d\u8db3\u3011**\uff1a\u672a\u5145\u5206\u5411\u7528\u6237\u63d0\u793a\u4ece\u96f6\u57fa\u7840\u5230\u53ef\u63a5\u5355\u7684\u5e02\u573a\u666e\u904d\u5468\u671f\u3001\u7ade\u4e89\u96be\u5ea6\u53ca\u6240\u9700\u7ec3\u4e60\u5f3a\u5ea6\uff0c\u5c24\u5176\u662f\u9488\u5bf9\u5176\u5b58\u5728\u7684\u53d1\u97f3\u77ed\u677f\u3002\n    *   **\u3010\u60c5\u611f\u6346\u7ed1\u3011**\uff1a\u9891\u7e41\u4f7f\u7528\u201c\u5e08\u59d0\u201d\u3001\u201c\u5a18\u5bb6\u4eba\u201d\u3001\u201c\u770b\u597d\u4f60\u201d\u3001\u201c\u5e26\u4f60\u98de\u201d\u7b49\u8bdd\u672f\uff0c\u5efa\u7acb\u8d85\u51fa\u552e\u540e\u670d\u52a1\u8303\u56f4\u7684\u60c5\u611f\u4f9d\u8d56\uff0c\u53ef\u80fd\u5f71\u54cd\u7528\u6237\u7406\u6027\u51b3\u7b56\u3002\n\n## \u516d\u3001 \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**: **\u504f\u5dee**\u3002\u7528\u6237\uff08T4\u529f\u5229\u5c1d\u9c9c\u8005\uff09\u7684\u201c\u5feb\u901f\u53d8\u73b0\u201d\u9884\u671f\u4e0e\u4ea7\u54c1\uff08\u9700\u8981\u957f\u671f\u7cfb\u7edf\u7ec3\u4e60\u7684\u6f14\u64ad\u6280\u80fd\u8bfe\u7a0b\uff09\u7684\u6838\u5fc3\u4ef7\u503c\u5b58\u5728\u5929\u7136\u5f20\u529b\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **\u9996\u5468\u91cd\u70b9\u6821\u6b63\u53d8\u73b0\u9884\u671f\uff0c\u5f3a\u5316\u57fa\u7840\u7ec3\u4e60**\n*   **\u5177\u4f53\u884c\u52a8\u6307\u5357**:\n    1.  **\u9884\u671f\u7ba1\u7406\uff08\u5173\u952e\uff09**: \u5165\u73ed\u9996\u5468\u5185\uff0c\u5fc5\u987b\u8fdb\u884c\u4e00\u5bf9\u4e00\u6c9f\u901a\uff0c**\u660e\u786e\u544a\u77e5**\u4ece\u57fa\u7840\u7ec3\u4e60\u5230\u8bd5\u97f3\u6210\u529f\u7684\u5e38\u89c4\u8def\u5f84\u3001\u65f6\u95f4\u5468\u671f\uff0c\u5e76\u59d4\u5a49\u6307\u51fa\u5176\u53d1\u97f3\u95ee\u9898\u9700\u8981\u4e13\u9879\u514b\u670d\uff0c\u964d\u4f4e\u5176\u4e0d\u5207\u5b9e\u9645\u7684\u201c\u901f\u6210\u201d\u5e7b\u60f3\u3002\n    2.  **\u4f18\u52bf\u9f13\u52b1**: \u80af\u5b9a\u5176\u5fa1\u59d0\u97f3\u6f5c\u8d28\u3001\u65b9\u8a00\u4f18\u52bf\u53ca\u5b66\u4e60\u79ef\u6781\u6027\uff0c\u5c06\u5176\u201c\u529f\u5229\u5fc3\u201d\u5f15\u5bfc\u81f3\u201c\u8bbe\u5b9a\u9636\u6bb5\u6027\u5c0f\u76ee\u6807\u201d\uff08\u5982\uff1a\u672c\u5468\u653b\u514b\u4e00\u4e2a\u53d1\u97f3\u96be\u70b9\uff09\u4e0a\uff0c\u7528\u53ef\u5b9e\u73b0\u7684\u8fdb\u6b65\u5efa\u7acb\u4fe1\u5fc3\u3002\n    3.  **\u8fc7\u7a0b\u5173\u6ce8**: \u5bc6\u5207\u5173\u6ce8\u5176\u524d\u671f\u8bd5\u97f3\u53cd\u9988\u3002\u82e5\u906d\u9047\u632b\u6298\uff0c\u9700\u53ca\u65f6\u4ecb\u5165\uff0c\u5f15\u5bfc\u5176\u5f52\u56e0\u4e8e\u201c\u6280\u80fd\u63d0\u5347\u7684\u6b63\u5e38\u8fc7\u7a0b\u201d\uff0c\u800c\u975e\u201c\u8bfe\u7a0b\u65e0\u6548\u201d\uff0c\u5e76\u63d0\u4f9b\u5177\u4f53\u6539\u8fdb\u65b9\u6cd5\u3002\n    4.  **\u98ce\u9669\u9884\u8b66**: \u8bb0\u5f55\u8be5\u7528\u6237\u4e3a\u201c\u9ad8\u9884\u671f\u7ba1\u7406\u201d\u91cd\u70b9\u5bf9\u8c61\uff0c\u5b9a\u671f\u68c0\u67e5\u5176\u5b66\u4e60\u8fdb\u5ea6\u4e0e\u5fc3\u7406\u72b6\u6001\uff0c\u9632\u8303\u56e0\u9884\u671f\u843d\u5dee\u5bfc\u81f4\u7684\u6d88\u6781\u6216\u6295\u8bc9\u60c5\u7eea\u3002\n\n{\"core_type\": \"T4 \u529f\u5229\u5c1d\u9c9c\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u9996\u5468\u91cd\u70b9\u6821\u6b63\u53d8\u73b0\u9884\u671f\"}";
