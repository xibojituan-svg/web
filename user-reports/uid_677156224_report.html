    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677156224\uff08\u6635\u79f0\uff1a\u83ab\u7d2b\u4e00\uff09\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677156224 / \u6635\u79f0\uff1a\u83ab\u7d2b\u4e00 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5434\u6e58\u5a1f (\u9500\u552e/\u73ed\u4e3b\u4efb) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u9ad8\u9636\u5b66\u4e60\uff084\u4e2a\u6708\u8bfe\u7a0b\uff09\uff0c\u4ef7\u683c7380\u5143 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff08\u5168\u6b3e/\u5206\u671f/\u501f\u8d37\uff09\uff0c\u65e0\u6cd5\u5224\u65ad\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u4e3a\u4f53\u5236\u5185\u4eba\u5458\uff0c\u767d\u5929\u6709\u788e\u7247\u5316\u65f6\u95f4\uff0c\u665a\u4e0a\u53ef\u5f55\u4e66\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u7528\u6237\u8868\u8fbe\u4e86\u660e\u786e\u7684\u52a8\u673a\u3001\u4e2a\u4eba\u60c5\u51b5\u3001\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e\uff0c\u4f46\u6df7\u6742\u4e86\u5174\u8da3\u4e0e\u60c5\u611f\u4ef7\u503c**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u517c\u804c\u201d\u3001\u201c\u6536\u5165\u4e5f\u5f88\u91cd\u8981\u201d\uff0c\u4f46\u540c\u65f6\u4e5f\u5f3a\u8c03\u201c\u6211\u559c\u6b22\u914d\u97f3 \u7b97\u662f\u4e00\u79cd\u7231\u597d\u201d\uff0c\u5e76\u6709\u4e00\u4e2a\u201c\u628a\u7ed9\u5b69\u5b50\u8bb2\u8fc7\u7684\u6bcf\u4e2a\u6545\u4e8b\u90fd\u5f55\u51fa\u6765\u201d\u7684\u6e29\u60c5\u613f\u671b\u3002\u52a8\u673a\u662f\u201c\u53d8\u73b0+\u5174\u8da3+\u60c5\u611f\u5bc4\u6258\u201d\u7684\u6df7\u5408\u4f53\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u517c\u804c...\u6211\u559c\u6b22\u914d\u97f3 \u7b97\u662f\u4e00\u79cd\u7231\u597d...\u5f53\u7136 \u6536\u5165\u4e5f\u5f88\u91cd\u8981...\u6700\u5927\u7684\u613f\u671b\u5c31\u662f\u53ef\u4ee5\u638c\u63e1\u591a\u79cd\u58f0\u7ebf \u81ea\u5df1\u80fd\u505a\u5230\u5b8c\u6574\u5f55\u4e00\u672c\u4e66...\u8981\u8bf4\u80fd\u591f\u5f97\u7740\u7684\u613f\u671b\u5c31\u662f\u628a\u7ed9\u5b69\u5b50\u8bb2\u8fc7\u7684\u6bcf\u4e2a\u6545\u4e8b\u90fd\u5f55\u51fa\u6765\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b06\u9ad8 (7-8\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d\u9ad8** \u2014 \u80fd\u652f\u4ed87380\u5143\u8bfe\u7a0b\uff0c\u4e14\u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\u3002\u4f53\u5236\u5185\u5de5\u4f5c\u901a\u5e38\u610f\u5473\u7740\u7a33\u5b9a\u7684\u73b0\u91d1\u6d41\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d\u9ad8** \u2014 \u4f53\u5236\u5185\u5de5\u4f5c\uff0c\u767d\u5929\u6709\u788e\u7247\u5316\u65f6\u95f4\uff0c\u665a\u4e0a\u6709\u7a7a\u95f2\u3002\u80fd\u6309\u65f6\u5b8c\u6210\u6253\u5361\u548c\u4f5c\u4e1a\uff0c\u6267\u884c\u529b\u5f3a\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\uff0c\u4f46\u7528\u6237\u4e3b\u52a8\u5c06\u5b66\u4e60\u4e0e\u966a\u4f34\u5b69\u5b50\uff08\u8bb2\u6545\u4e8b\u3001\u5f55\u6545\u4e8b\uff09\u7ed3\u5408\uff0c\u6697\u793a\u5bb6\u5ead\u73af\u5883\u81f3\u5c11\u4e0d\u6784\u6210\u963b\u788d\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8 (7-8\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u7528\u6237\u9047\u5230\u95ee\u9898\uff08\u8bd5\u97f3\u6ca1\u5f55\u597d\uff09\u4f1a\u4e3b\u52a8\u8be2\u95ee\u89e3\u51b3\u65b9\u6848\uff08\u201c\u53ef\u4ee5\u91cd\u65b0\u518d\u5f55\u4e00\u6b21\u5417\u201d\uff09\uff0c\u5728\u5f97\u5230\u80af\u5b9a\u7b54\u590d\u540e\u7acb\u5373\u884c\u52a8\uff08\u201c\u8fd8\u8981\u91cd\u65b0\u5f55\u201d\uff09\u3002\u5168\u7a0b\u65e0\u8d1f\u9762\u60c5\u7eea\u5ba3\u6cc4\uff0c\u5bf9\u9500\u552e\u7684\u6280\u672f\u6307\u5bfc\u53cd\u9988\u79ef\u6781\uff08\u201c\u597d\u7684\u5462\u201d\uff09\uff0c\u8868\u73b0\u51fa\u7a33\u5b9a\u7684\u5b66\u4e60\u5fc3\u6001\u548c\u6267\u884c\u529b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08...\u6211\u5c31\u662f\u8bd5\u4e00\u4e0b...\u7136\u540e\u6ca1\u5f55\u51e0\u53e5\u5c31\u63d0\u4ea4\u4e86...\u8fd9\u79cd\u60c5\u51b5\u53ef\u4ee5\u91cd\u65b0\u518d\u5f55\u4e00\u6b21\u5417\u201d > \u201c\u8fd8\u8981\u91cd\u65b0\u5f55\u201d > \u201c\u597d\u7684\u5462\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34\u4e0e\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e\u7684\u6df7\u5408\u4f53**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u9ad8\u8d28\u91cf\u4eb2\u5b50\u966a\u4f34\u7684\u6e34\u671b\u4e0e\u5de5\u4f5c\u5fd9\u788c\u7684\u73b0\u5b9e\u77db\u76fe**\u3002\u7528\u6237\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u914d\u97f3\uff0c\u5c06\u7ed9\u5b69\u5b50\u8bb2\u6545\u4e8b\u7684\u58f0\u97f3\u5f55\u4e0b\u6765\uff0c\u5f25\u8865\u56e0\u5de5\u4f5c\u5fd9\u800c\u65e0\u6cd5\u65f6\u523b\u966a\u4f34\u7684\u9057\u61be\uff0c\u8fd9\u662f\u4e00\u79cd\u60c5\u611f\u5bc4\u6258\u548c\u7231\u7684\u8868\u8fbe\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u4f60\u662f\u4e00\u4f4d\u52aa\u529b\u4e14\u6709\u7231\u7684\u6bcd\u4eb2/\u7236\u4eb2\u201d\u7684\u8eab\u4efd\u8ba4\u540c\u4e0e\u4ef7\u503c\u611f**\u3002\u80af\u5b9a\u5979\u5c06\u7231\u597d\u3001\u8d5a\u94b1\u4e0e\u6bcd\u7231/\u7236\u7231\u7ed3\u5408\u7684\u884c\u4e3a\uff0c\u8ba9\u5979\u611f\u5230\u8fd9\u4efd\u5b66\u4e60\u4e0d\u4ec5\u662f\u4e3a\u4e86\u8d5a\u94b1\uff0c\u66f4\u662f\u4e3a\u4e86\u5bb6\u5ead\u548c\u81ea\u6211\u7684\u53cc\u91cd\u63d0\u5347\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u6709\u5411 **\u6df7\u5408\u4f533\u53f7\uff1a\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b** \u8fdb\u5316\u6f5c\u529b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\u3002\u652f\u4ed8\u65b9\u5f0f\u672a\u77e5\uff0c\u9700\u540e\u7eed\u6838\u67e5\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4f4e** | \u672a\u63d0\u53ca\u5bb6\u5ead\u77db\u76fe\uff0c\u4e14\u5b66\u4e60\u52a8\u673a\u4e0e\u5bb6\u5ead\u60c5\u611f\u7ed1\u5b9a\uff0c\u662f\u6b63\u5411\u9a71\u52a8\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u65f6\u95f4\u5145\u88d5\uff0c\u6267\u884c\u529b\u5f3a\uff0c\u80fd\u8ddf\u4e0a\u8282\u594f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u65e0\u81ea\u5351\u3001\u62b1\u6028\u4fe1\u53f7\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | **\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u7528\u6237\u6709\u660e\u786e\u7684\u517c\u804c\u53d8\u73b0\u8bc9\u6c42\uff08\u201c\u6536\u5165\u4e5f\u5f88\u91cd\u8981\u201d\uff09\u3002\u82e5\u5b66\u4e60\u540e\u671f\u63a5\u5355\u4e0d\u987a\u5229\u6216\u6536\u5165\u672a\u8fbe\u9884\u671f\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-3\u4e2a\u6708\u540e\uff0c\u5f53\u6280\u80fd\u7ec3\u4e60\u8fdb\u5165\u5e73\u53f0\u671f\uff0c\u4f46\u63a5\u5355\u673a\u4f1a\u6216\u6536\u5165\u672a\u660e\u663e\u589e\u957f\u65f6\u3002**\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u83ab\u7d2b\u4e00\u540c\u5b66\u4f60\u597d\uff01\u770b\u5230\u4f60\u8bf4\u60f3\u7ed9\u5b69\u5b50\u5f55\u6545\u4e8b\uff0c\u771f\u7684\u7279\u522b\u611f\u52a8\u3002\u54b1\u4eec\u8fd9\u4e2a\u73ed\u91cc\u6709\u4e0d\u5c11\u50cf\u4f60\u4e00\u6837\u7684\u5b9d\u7238\u5b9d\u5988\uff0c\u5927\u5bb6\u805a\u5728\u4e00\u8d77\u4e0d\u53ea\u662f\u5b66\u6280\u80fd\uff0c\u66f4\u662f\u4e3a\u4e86\u7ed9\u5bb6\u4eba\u7559\u4e0b\u6e29\u6696\u7684\u58f0\u97f3\u793c\u7269\u3002\u4f60\u6267\u884c\u529b\u8fd9\u4e48\u5f3a\uff0c\u53c8\u6709\u7a33\u5b9a\u7684\u65f6\u95f4\uff0c\u76f8\u4fe1\u5f88\u5feb\u5c31\u80fd\u4e0a\u624b\u3002\u54b1\u4eec\u4e00\u6b65\u6b65\u6765\uff0c\u5148\u641e\u5b9a\u753b\u672c/\u7edf\u7b79\u8fd9\u4e9b\u80fd\u5feb\u901f\u89c1\u6536\u76ca\u7684\u2018\u659c\u6760\u2019\u5de5\u4f5c\uff0c\u665a\u4e0a\u518d\u7cbe\u8fdb\u6f14\u64ad\uff0c\u628a\u7231\u597d\u548c\u8d5a\u94b1\u90fd\u517c\u987e\u8d77\u6765\u3002\u6709\u4efb\u4f55\u9700\u8981\u534f\u8c03\u65f6\u95f4\u6216\u6280\u672f\u4e0a\u7684\u95ee\u9898\uff0c\u968f\u65f6\u627e\u6211\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176T2\u8001\u9ec4\u725b\u7279\u8d28\uff0c\u63d0\u4f9b\u624e\u5b9e\u7684\u6280\u80fd\u8bad\u7ec3\u548c\u660e\u786e\u7684\u63a5\u5355\u8def\u5f84\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u201c\u5f55\u6545\u4e8b\u7ed9\u5b69\u5b50\u542c\u201d\u7684\u60c5\u611f\u9700\u6c42\uff0c\u8865\u5145 **\u3010\u4eb2\u5b50\u6545\u4e8b\u4e13\u5c5e\u6f14\u7ece\u6280\u5de7\u5305\u3011** \u4f5c\u4e3a\u60c5\u611f\u589e\u503c\u670d\u52a1\u3002\u540c\u65f6\uff0c**\u5bc6\u5207\u5173\u6ce8\u5176\u662f\u5426\u51fa\u73b0\u4e3b\u52a8\u5e2e\u52a9\u540c\u5b66\u3001\u7edf\u7b79\u4e8b\u52a1\u7684\u884c\u4e3a**\uff0c\u4e00\u65e6\u51fa\u73b0\uff0c\u7acb\u5373\u542f\u52a8 **\u3010D\u6a21\u5757\uff1a\u9ec4\u888d\u52a0\u8eab\u63d0\u5e72\u6cd5\u3011**\uff0c\u8d4b\u4e88\u5176\u5c0f\u7ec4\u957f\u6216\u7b54\u7591\u5b98\u7b49\u89d2\u8272\uff0c\u6fc0\u53d1\u5176\u9886\u5bfc\u6f5c\u80fd\uff08\u5411\u6df7\u5408\u4f533\u53f7\u8fdb\u5316\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u5b9d\u5988/\u5b9d\u7238\u6ca1\u65f6\u95f4\u5b66\u201d\u7b49\u523b\u677f\u5370\u8c61\u53bb\u5b9a\u4e49\u5979\uff1b\u5728\u5979\u8868\u73b0\u51fa\u7ec4\u7ec7\u80fd\u529b\u65f6\uff0c\u7ee7\u7eed\u7528\u5bf9\u5f85\u666e\u901a\u5b66\u5458\u7684\u53e3\u543b\u4e0b\u8fbe\u6307\u4ee4\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u8fdb\u884c\u5927\u989d\u63a8\u4ecb\uff08\u5982\u9ad8\u9636\u8bbe\u5907\u3001\u79c1\u6559\u8bfe\uff09\uff0c\u4f46\u5fc5\u987b\u5efa\u7acb\u5728**\u5979\u5df2\u901a\u8fc7\u659c\u6760\u5de5\u4f5c\u83b7\u5f97\u7a33\u5b9a\u6536\u5165\u6216\u5c55\u73b0\u51fa\u6781\u5f3a\u6280\u672f\u94bb\u7814\u610f\u613f\u4e4b\u540e**\uff0c\u907f\u514d\u56e0\u201c\u77e5\u8bc6\u8fc7\u8f7d\u201d\u6216\u201c\u53d8\u73b0\u7126\u8651\u201d\u5f15\u53d1\u53cd\u611f\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u6211\u662f\u4f53\u5236\u5185\u7684\u4eba\u5458...\u767d\u5929\u6ca1\u4e8b\u7684\u65f6\u5019\u5c31\u4e0d\u592a\u5fd9**\u201d \u2014\u2014 **\u8d44\u6e90\u5e95\u5ea7\uff08\u65f6\u95f4\uff09\u5145\u88d5\u7684\u660e\u8bc1**\u3002\n2. > \u201c**\u8001\u5e08...\u6211\u5c31\u662f\u8bd5\u4e00\u4e0b...\u7136\u540e\u6ca1\u5f55\u51e0\u53e5\u5c31\u63d0\u4ea4\u4e86...\u8fd9\u79cd\u60c5\u51b5\u53ef\u4ee5\u91cd\u65b0\u518d\u5f55\u4e00\u6b21\u5417**\u201d \u2014\u2014 **\u5fc3\u7406\u5f39\u6027\u9ad8\u3001\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\u7684\u5178\u578b\u8868\u73b0\uff0c\u975e\u60c5\u7eea\u5316\u62b1\u6028**\u3002\n3. > \u201c**\u8981\u8bf4\u80fd\u591f\u5f97\u7740\u7684\u613f\u671b\u5c31\u662f\u628a\u7ed9\u5b69\u5b50\u8bb2\u8fc7\u7684\u6bcf\u4e2a\u6545\u4e8b\u90fd\u5f55\u51fa\u6765**\u201d \u2014\u2014 **\u6838\u5fc3\u52a8\u673a\u975e\u7eaf\u91d1\u94b1\u9a71\u52a8\uff0c\u8574\u542b\u6781\u5f3a\u7684\u60c5\u611f\u4e0e\u793e\u4ea4\u9700\u6c42**\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u6709\u8fdb\u5316\u6210 **\u3010\u6df7\u5408\u4f533\u53f7\uff08\u6743\u9650\u89c9\u9192\uff09\u3011** \u7684\u6f5c\u529b\u3002\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e00\u4efd\u80fd\u517c\u987e\u5bb6\u5ead\uff08\u5f55\u6545\u4e8b\u7ed9\u5b69\u5b50\uff09\u3001\u5b9e\u73b0\u81ea\u6211\u4ef7\u503c\uff08\u638c\u63e1\u6280\u80fd\uff09\u4e14\u80fd\u53d8\u73b0\u7684\u4f53\u9762\u517c\u804c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u4f46\u9700\u8b66\u60d5 **\u3010\u6536\u76ca\u843d\u5dee\u3011** \u98ce\u9669\u3002\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u65e9\u671f\u63d0\u4f9b\u6e05\u6670\u7684\u3001\u53ef\u5feb\u901f\u53d8\u73b0\u7684\u201c\u659c\u6760\u201d\u4efb\u52a1\u8def\u5f84\uff08\u5982\u753b\u672c\u3001\u7edf\u7b79\uff09\uff0c\u5efa\u7acb\u6b63\u53cd\u9988\uff1b\u540c\u65f6\u8d4b\u4e88\u5176\u201c\u597d\u5bb6\u957f/\u597d\u5b66\u5458\u201d\u7684\u8eab\u4efd\u8ba4\u540c\uff0c\u5e76\u89c2\u5bdf\u63d0\u62d4\u673a\u4f1a\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b (\u6df7\u5408\u4f533\u53f7\u6f5c\u529b\u80a1)\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u793e\u4ea4/\u5c0a\u91cd\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u4eb2\u5b50\u60c5\u611f\u589e\u503c\u5305\"}\n```";
