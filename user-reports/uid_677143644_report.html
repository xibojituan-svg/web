    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u4e0e\u98ce\u63a7\u8bca\u65ad\u62a5\u544a (UID: 677143644)\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u9ad8\u53d8\u73b0\u5bfc\u5411**\u3002\u7528\u6237\u6838\u5fc3\u9a71\u52a8\u529b\u660e\u786e\u4e3a\u201c\u591a\u62ff\u70b9\u7c73\u7c73\u201d\uff0c\u5bf9\u8bd5\u97f3\u8ba2\u5355\u3001\u4ef7\u683c\u3001\u5ba1\u6838\u7ed3\u679c\u3001\u8bc1\u4e66\u3001\u517c\u804c\u5de5\u79cd\u3001\u514d\u8d39\u8f6f\u4ef6\u7b49\u53d8\u73b0\u8def\u5f84\u9ad8\u5ea6\u5173\u6ce8\u3002\u5bf9\u201c\u6697\u53f7\u201d\u7b49\u975e\u76f4\u63a5\u53d8\u73b0\u73af\u8282\u8868\u793a\u8d28\u7591\uff0c\u5b66\u4e60\u884c\u4e3a\uff08\u542c\u8bfe\u3001\u6253\u5361\u3001\u4ea4\u4f5c\u4e1a\uff09\u670d\u52a1\u4e8e\u63a5\u5355\u53d8\u73b0\u76ee\u6807\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u7528\u6237\u5e74\u9f84\u3001\u804c\u4e1a\u3001\u5bb6\u5ead\u72b6\u51b5\u3001\u53ef\u6295\u5165\u65f6\u95f4\u3001\u8bbe\u5907\u6761\u4ef6\u7b49\u3002\u4ec5\u77e5\u7528\u6237\u6709\u517c\u804c\uff084\u67088\u65e5\u4e0a\u5348\uff09\uff0c\u4e14\u80fd\u53c2\u4e0e\u591a\u573a\u76f4\u64ad\u5e76\u5b8c\u6210\u4f5c\u4e1a\uff0c\u63a8\u6d4b\u6709\u4e00\u5b9a\u4e1a\u4f59\u65f6\u95f4\u3002**\u8d44\u6e90\u7ef4\u5ea6\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u4e2d\u7b49\u504f\u4e0b**\u3002\u7528\u6237\u8868\u73b0\u51fa\u8f83\u5f3a\u7684**\u5373\u65f6\u53cd\u9988\u6e34\u6c42**\uff08\u591a\u6b21\u8ffd\u95ee\u8bd5\u97f3\u7ed3\u679c\u3001\u8be2\u95ee\u901a\u5173\u72b6\u6001\uff09\uff0c\u5bf9\u81ea\u6211\u8868\u73b0\u6709\u7126\u8651\uff08\u201c\u5f20\u4e0d\u5f00\u5634\u201d\u3001\u201c\u54ac\u5b57\u513f\u4e25\u91cd\u201d\u3001\u201c\u5f55\u4e864\u904d\u8fd8\u662f\u4e0d\u6ee1\u610f\u201d\uff09\uff0c\u5bf9\u957f\u6bb5\u4efb\u52a1\u6709\u754f\u96be\u60c5\u7eea\u3002\u4f46\u5177\u5907\u57fa\u672c\u884c\u52a8\u529b\uff08\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\uff09\uff0c\u5728\u9500\u552e\u9f13\u52b1\u4e0b\u80fd\u575a\u6301\u5c1d\u8bd5\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 (\u652f\u4ed8\u6838\u67e5)**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u4e8e4\u67088\u65e5\u76f4\u64ad\u95f4\u9886\u53d6\u4f18\u60e0\u5238\uff0c\u4ee57380\u5143\u4ef7\u683c\u8d2d\u4e70\u4e86\u201c\u9ad8\u9636\u201d\u8bfe\u7a0b\uff08\u5e94\u4e3a\u7cbe\u82f1\u73ed\uff09\uff0c\u5e76\u5df2\u6dfb\u52a0\u73ed\u4e3b\u4efb\u3001\u8fdb\u7fa4\u3002\u652f\u4ed8\u884c\u4e3a\u5df2\u53d1\u751f\u3002\n*   **\u6b65\u9aa41.5 (\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5)**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u5168\u7a0b\u4e3a\u7528\u6237\u4e0e\u9500\u552e\u76841\u5bf91\u6c9f\u901a\uff0c\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u6210\u5458\u6216\u51b3\u7b56\u76f8\u5173\u4eba\u3002**\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u7f3a\u5931\uff0c\u5b58\u5728\u6f5c\u5728\u98ce\u9669**\u3002\n*   **\u6b65\u9aa42 (\u52a8\u673a-\u8d44\u6e90\u5339\u914d)**: **\u52a8\u673a\u660e\u786e\uff0c\u8d44\u6e90\u672a\u77e5**\u3002\u7528\u6237\u53d8\u73b0\u52a8\u673a\u5f3a\u70c8\uff0c\u4f46\u56e0\u5176\u8d44\u6e90\u5e95\u5ea7\uff08\u65f6\u95f4\u3001\u7cbe\u529b\u3001\u7ecf\u6d4e\u3001\u5bb6\u5ead\u652f\u6301\uff09\u4fe1\u606f\u5168\u65e0\uff0c\u65e0\u6cd5\u5224\u65ad\u5176\u80fd\u5426\u652f\u6491\u957f\u671f\u5b66\u4e60\u4e0e\u517c\u804c\u76ee\u6807\u3002**\u5339\u914d\u5ea6\u5b58\u7591**\u3002\n*   **\u6b65\u9aa43 (\u884c\u52a8\u4e00\u81f4\u6027)**: **\u9ad8**\u3002\u7528\u6237\u884c\u52a8\u4e0e\u53d8\u73b0\u52a8\u673a\u9ad8\u5ea6\u4e00\u81f4\uff1a\u79ef\u6781\u53c2\u4e0e\u76f4\u64ad\uff08\u5173\u6ce8\u85aa\u8d44\u3001\u5de5\u79cd\uff09\u3001\u4e3b\u52a8\u5b8c\u6210\u6240\u6709\u4f5c\u4e1a\uff08\u58f0\u97f3\u9274\u5b9a\u3001\u65c1\u767d\u3001\u89d2\u8272\u97f3\uff09\u3001\u591a\u6b21\u5c1d\u8bd5\u8bd5\u97f3\u8ba2\u5355\u3002\u5b66\u4e60\u884c\u4e3a\u662f\u53d8\u73b0\u671f\u671b\u7684\u76f4\u63a5\u6295\u5c04\u3002\n*   **\u6b65\u9aa44 (\u627f\u8bfa\u5ea6)**: **\u4e2d\u7b49**\u3002\u7528\u6237\u5b8c\u6210\u4e86\u4ece\u4f53\u9a8c\u5230\u4ed8\u8d39\u7684\u5173\u952e\u52a8\u4f5c\uff0c\u5e76\u5173\u6ce8\u540e\u7eed\u5f00\u73ed\u5b89\u6392\u3002\u4f46\u5176\u5bf9\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u7684\u56f0\u96be\uff08\u54ac\u5b57\u3001\u60c5\u7eea\u8868\u8fbe\uff09\u6709\u8f83\u660e\u663e\u7684\u754f\u96be\u548c\u7126\u8651\u60c5\u7eea\uff0c\u627f\u8bfa\u7684\u6301\u7eed\u6027\u53ef\u80fd\u53d7\u521d\u671f\u53d8\u73b0\u7ed3\u679c\uff08\u5982\u8bd5\u97f3\u672a\u901a\u8fc7\uff09\u7684\u8f83\u5927\u5f71\u54cd\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b: T5 \u529f\u5229\u901f\u6210\u8005**\u3002\n    *   **\u6838\u5fc3\u7279\u5f81**: \u76ee\u6807\u660e\u786e\u6307\u5411\u5feb\u901f\u53d8\u73b0\uff0c\u5bf9\u201c\u8fc7\u7a0b\u201d\u3001\u201c\u57fa\u7840\u201d\u7f3a\u4e4f\u8010\u5fc3\uff0c\u6e34\u671b\u7acb\u7aff\u89c1\u5f71\u7684\u56de\u62a5\uff08\u7c73\u7c73\u3001\u8bc1\u4e66\u3001\u8ba2\u5355\uff09\u3002\n    *   **\u8bc1\u636e**: \u53cd\u590d\u8ffd\u95ee\u8bd5\u97f3\u7ed3\u679c\u4e0e\u5ba1\u6838\u8fdb\u5ea6\uff1b\u5bf9\u201c\u6697\u53f7\u201d\u7b49\u975e\u76f4\u63a5\u4ea7\u51fa\u73af\u8282\u8868\u793a\u4e0d\u89e3\uff1b\u660e\u786e\u8868\u8fbe\u201c\u60f3\u591a\u62ff\u70b9\u7c73\u7c73\u201d\uff1b\u5bf9\u957f\u6587\u672c\u8bd5\u97f3\u611f\u5230\u538b\u529b\u5e76\u653e\u5f03\u63d0\u4ea4\uff1b\u5173\u6ce8\u201c\u514d\u8d39\u8f6f\u4ef6\u201d\u7b49\u5de5\u5177\uff1b\u5bf9\u201c\u8bc1\u4e66\u201d\u8868\u73b0\u51fa\u5174\u8da3\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669\u7b49\u7ea7: \u4e2d**\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**: **\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u53d8\u73b0\u901f\u5ea6\u671f\u671b\u9ad8\uff08\u201c\u591a\u62ff\u70b9\u7c73\u7c73\u201d\uff09\uff0c\u82e5\u6b63\u5f0f\u5f00\u8bfe\u540e\u63a5\u5355\u4e0d\u987a\u6216\u53cd\u9988\u5468\u671f\u957f\uff0c\u6781\u6613\u4ea7\u751f\u201c\u6ca1\u6548\u679c\u201d\u7684\u611f\u77e5\u3002\n    2.  **\u65f6\u95f4\u7cbe\u529b\u51b2\u7a81**: **\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u6709\u517c\u804c\uff0c\u65f6\u95f4\u53ef\u80fd\u7d27\u5f20\u3002\u82e5\u8bfe\u7a0b\u4efb\u52a1\u91cf\u4e0e\u517c\u804c/\u751f\u6d3b\u51b2\u7a81\uff0c\u53ef\u80fd\u653e\u5f03\u3002\n    3.  **\u7ecf\u6d4e\u538b\u529b**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u652f\u4ed87380\u5143\u8bfe\u7a0b\u6b3e\uff0c\u4f46\u672a\u900f\u9732\u7ecf\u6d4e\u72b6\u51b5\u4e0e\u652f\u4ed8\u538b\u529b\u3002\u9700\u540e\u7eed\u6838\u67e5\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9**: **\u4fe1\u606f\u4e0d\u8db3\u4f46\u4e3a\u5173\u952e\u96f7\u533a**\u3002**\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u5b8c\u5168\u7f3a\u5931**\uff0c\u662f\u6f5c\u5728\u7684\u9ad8\u98ce\u9669\u70b9\u3002\n    5.  **\u5185\u5bb9/\u670d\u52a1\u4e0d\u6ee1**: **\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u5bf9\u9500\u552e\u670d\u52a1\uff08\u79ef\u6781\u53cd\u9988\u3001\u9f13\u52b1\uff09\u548c\u8bfe\u7a0b\u5185\u5bb9\uff08\u53c2\u4e0e\u76f4\u64ad\u3001\u4ea4\u4f5c\u4e1a\uff09\u63a5\u53d7\u5ea6\u826f\u597d\u3002\n    6.  **\u9500\u552e\u627f\u8bfa\u5938\u5927**: **\u4e2d\u98ce\u9669**\u3002\u9500\u552e\u591a\u6b21\u4f7f\u7528\u201c\u76f4\u63a5\u8fdb\u5267\u7ec4\u201d\u3001\u201c\u6709\u5f88\u5927\u673a\u4f1a\u201d\u3001\u201c\u5feb\u4eba\u4e00\u6b65\u201d\u7b49\u8bdd\u672f\uff0c\u53ef\u80fd\u62ac\u5347\u7528\u6237\u9884\u671f\u3002**\u201c\u4f60\u7684\u6c34\u5e73\u6211\u89c9\u5f97\u662f\u6709\u53ef\u80fd\u76f4\u63a5\u8fdb\u5267\u7ec4\u7684\u201d\u6b64\u7c7b\u627f\u8bfa\u9700\u91cd\u70b9\u5173\u6ce8**\u3002\n    7.  **\u7ade\u54c1/\u66ff\u4ee3\u65b9\u6848**: **\u4f4e\u98ce\u9669**\u3002\u5f53\u524d\u672a\u8868\u73b0\u51fa\u6bd4\u8f83\u6216\u52a8\u6447\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u603b\u4f53\u57fa\u672c\u5408\u89c4\uff0c\u4f46\u5b58\u5728\u98ce\u9669\u8bdd\u672f**\u3002\n*   **\u5408\u89c4\u70b9**: \u9500\u552e\u6d41\u7a0b\u5b8c\u6574\uff08\u4f53\u9a8c\u8425-\u76f4\u64ad-\u8f6c\u5316\uff09\uff0c\u5f3a\u8c03\u4e86\u201c\u514d\u8d39\u4f53\u9a8c\u201d\u3001\u201c\u6ca1\u4eba\u50ac\u4f60\u62a5\u540d\u201d\uff0c\u4f5c\u4e1a\u53cd\u9988\u5177\u4f53\uff08\u5982\u91cd\u97f3\u3001\u505c\u987f\u6307\u5bfc\uff09\u3002\n*   **\u98ce\u9669\u70b9**:\n    1.  **\u8fc7\u5ea6\u627f\u8bfa\u503e\u5411**: \u5982\u201c\u6211\u89c9\u5f97\u4f60\u6709\u5f88\u5927\u673a\u4f1a\u53ef\u4ee5\u76f4\u63a5\u8fdb\u5267\u7ec4\u201d\u3001\u201c\u4f60\u7684\u6c34\u5e73\u6211\u89c9\u5f97\u662f\u6709\u53ef\u80fd\u76f4\u63a5\u8fdb\u5267\u7ec4\u7684\u201d\u3002\u6b64\u7c7b\u5bf9\u4e2a\u4eba\u63a5\u5355\u7ed3\u679c\u7684\u9884\u6d4b\u6027\u627f\u8bfa\uff0c\u6613\u5728\u672a\u5b9e\u73b0\u65f6\u5f15\u53d1\u4e89\u8bae\u3002\n    2.  **\u5bb6\u5ead\u77e5\u60c5\u6838\u67e5\u7f3a\u5931**: \u9500\u552e\u5168\u7a0b\u672a\u8be2\u95ee\u6216\u786e\u8ba4\u652f\u4ed8\u662f\u5426\u4e3a\u4e2a\u4eba\u72ec\u7acb\u51b3\u7b56\uff0c\u6216\u662f\u5426\u5df2\u4e0e\u5bb6\u4eba\u6c9f\u901a\u3002**\u6b64\u4e3a\u91cd\u5927\u5408\u89c4\u6f0f\u6d1e**\u3002\n    3.  **\u672a\u5145\u5206\u63d0\u793a\u98ce\u9669**: \u5bf9\u8bdd\u96c6\u4e2d\u4e8e\u673a\u4f1a\u4e0e\u9f13\u52b1\uff0c\u5bf9\u6709\u58f0\u884c\u4e1a\u517c\u804c\u7684\u7ade\u4e89\u5f3a\u5ea6\u3001\u6536\u5165\u4e0d\u786e\u5b9a\u6027\u3001\u957f\u671f\u7ec3\u4e60\u5fc5\u8981\u6027\u7b49\u98ce\u9669\u63d0\u793a\u4e0d\u8db3\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d**: **\u504f\u5dee**\u3002\u7528\u6237\u662f\u5178\u578b\u7684\u201c\u529f\u5229\u901f\u6210\u8005\u201d(T5)\uff0c\u8ffd\u6c42\u77ed\u671f\u53d8\u73b0\u3002\u800c\u58f0\u97f3\u57f9\u8bad\u4ea7\u54c1\u901a\u5e38\u9700\u8981\u957f\u671f\u7ec3\u4e60\u624d\u80fd\u8fbe\u5230\u63a5\u5355\u6c34\u5e73\uff0c\u5b58\u5728\u201c\u7528\u6237\u671f\u671b\u201d\u4e0e\u201c\u4ea7\u54c1\u4ea4\u4ed8\u5468\u671f\u201d\u7684**\u7ed3\u6784\u6027\u77db\u76fe**\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **24h\u5185\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\u5e76\u6821\u6b63\u53d8\u73b0\u9884\u671f**\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**:\n    1.  **\u7d27\u6025\u52a8\u4f5c (24\u5c0f\u65f6\u5185)**: \u6dfb\u52a0\u5fae\u4fe1\u540e\uff0c\u9996\u8981\u4efb\u52a1\u975e\u6b22\u8fce\uff0c\u800c\u662f**\u4ee5\u5173\u6000\u540d\u4e49\u8fdb\u884c\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\u3002\u4f8b\u5982\uff1a\u201c\u540c\u5b66\u597d\uff0c\u606d\u559c\u52a0\u5165\uff01\u4e3a\u4e86\u540e\u7eed\u670d\u52a1\u66f4\u8d34\u5fc3\uff0c\u65b9\u4fbf\u95ee\u4e00\u4e0b\uff0c\u60a8\u62a5\u540d\u5b66\u4e60\u7684\u4e8b\u60c5\u5bb6\u4eba\u662f\u5426\u77e5\u6653\u5e76\u652f\u6301\u5462\uff1f\u6211\u4eec\u6709\u4e9b\u5b66\u5458\u56e0\u4e3a\u65f6\u95f4\u5b89\u6392\u9700\u8981\u5bb6\u4eba\u914d\u5408\uff0c\u63d0\u524d\u6c9f\u901a\u597d\u80fd\u907f\u514d\u540e\u7eed\u9ebb\u70e6\u3002\u201d \u540c\u65f6\uff0c**\u5728\u9996\u6b21\u6c9f\u901a\u4e2d\u6e29\u548c\u6821\u6b63\u9884\u671f**\uff1a\u201c\u770b\u5230\u60a8\u5b66\u4e60\u5f88\u79ef\u6781\uff0c\u7279\u522b\u597d\uff01\u6709\u58f0\u884c\u4e1a\u5165\u95e8\u540e\uff0c\u4ece\u7a33\u5b9a\u63a5\u5355\u5230\u6709\u53ef\u89c2\u6536\u5165\uff0c\u901a\u5e38\u9700\u89813-6\u4e2a\u6708\u7684\u6301\u7eed\u5b66\u4e60\u548c\u5b9e\u8df5\u79ef\u7d2f\uff0c\u54b1\u4eec\u4e00\u8d77\u628a\u57fa\u7840\u6253\u7262\uff0c\u540e\u9762\u4f1a\u8d8a\u6765\u8d8a\u987a\u3002\u201d\n    2.  **\u77ed\u671f\u8ddf\u8fdb (\u9996\u5468)**: \u91cd\u70b9\u5173\u6ce8\u5176\u9996\u6b21\u6b63\u5f0f\u8bfe\u4f5c\u4e1a\u7684\u53cd\u9988\uff0c\u7ed9\u4e88\u5177\u4f53\u3001\u53ef\u6267\u884c\u7684\u6539\u8fdb\u5efa\u8bae\uff0c\u800c\u975e\u7a7a\u6cdb\u9f13\u52b1\u3002\u5f15\u5bfc\u5176\u5173\u6ce8\u201c\u6280\u80fd\u8fdb\u6b65\u201d\u800c\u975e\u5355\u7eaf\u201c\u8ba2\u5355\u7ed3\u679c\u201d\u3002\u660e\u786e\u544a\u77e5\u6b63\u5f0f\u8bfe\u7684\u7ec3\u4e60\u8282\u594f\u3001\u65f6\u95f4\u6295\u5165\u8981\u6c42\uff0c\u8bc4\u4f30\u5176\u65f6\u95f4\u5339\u914d\u5ea6\u3002\n    3.  **\u4e2d\u671f\u98ce\u63a7 (1\u4e2a\u6708\u5185)**: \u7559\u610f\u5176\u5bf9\u4e8e\u521d\u671f\u8bd5\u97f3\u673a\u4f1a\u7684\u53cd\u5e94\u3002\u82e5\u591a\u6b21\u672a\u4e2d\u9009\uff0c\u9700\u63d0\u524d\u4ecb\u5165\uff0c\u5f3a\u5316\u201c\u8fc7\u7a0b\u5b66\u4e60\u201d\u548c\u201c\u957f\u671f\u4e3b\u4e49\u201d\u89c2\u5ff5\uff0c\u63d0\u4f9b\u989d\u5916\u8f85\u5bfc\uff0c\u9632\u6b62\u4fe1\u5fc3\u5d29\u6e83\u3002**\u907f\u514d\u4f7f\u7528\u201c\u5f88\u5feb\u5c31\u80fd\u63a5\u5355\u201d\u7b49\u6a21\u7cca\u627f\u8bfa**\u3002\n    4.  **\u957f\u671f\u5173\u7cfb**: \u82e5\u7528\u6237\u80fd\u5ea6\u8fc7\u7126\u8651\u671f\u5e76\u575a\u6301\u7ec3\u4e60\uff0c\u53ef\u5c06\u5176\u8f6c\u5316\u4e3a\u201c\u5b66\u4e60\u8fdb\u5ea6\u6807\u5175\u201d\uff1b\u82e5\u5176\u56e0\u53d8\u73b0\u4e0d\u53ca\u9884\u671f\u800c\u5f3a\u70c8\u4e0d\u6ee1\uff0c\u9700\u542f\u52a8\u98ce\u9669\u9884\u6848\uff0c\u8003\u8651\u529d\u9000\u6216\u6362\u8bfe\u53ef\u80fd\u6027\u3002\n\n{\"core_type\": \"T5 \u529f\u5229\u901f\u6210\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"24h\u5185\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\u5e76\u6821\u6b63\u53d8\u73b0\u9884\u671f\"}";
