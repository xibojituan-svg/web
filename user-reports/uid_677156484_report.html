    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n> **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4e2d\u7f3a\u5931\u5173\u952e\u4fe1\u606f\uff0c\u5305\u62ec\uff1a**\u652f\u4ed8\u65b9\u5f0f\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u5177\u4f53\u7ecf\u6d4e\u72b6\u51b5\u3001\u8fc7\u5f80\u632b\u6298\u7ecf\u5386\u3001\u5bf9\u8bfe\u7a0b\u4ef7\u683c\u7684\u76f4\u63a5\u53cd\u9988**\u3002\u8bca\u65ad\u57fa\u4e8e\u6709\u9650\u7684\u884c\u4e3a\u548c\u4e92\u52a8\u6a21\u5f0f\uff0c\u5b58\u5728\u4e0d\u786e\u5b9a\u6027\u3002\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677156484 / \u6635\u79f0\uff1a\u5e73\u5b89\u4e00\u751f |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e-\u590f\u51b05(\u5b59\u8302\u6cc9) -> \u73ed\u4e3b\u4efb-\u9065\u8fdc\u4e0d\u8fdc(\u5f20\u6587\u9759) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u9ad8\u9636\u8bfe\u7a0b (\u4ef7\u683c7380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | [\u4fe1\u606f\u7f3a\u5931] |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | [\u9ad8\u5bbd\u88d5] (\u7528\u6237\u4e3a\u9000\u4f11\u72b6\u6001\uff0c\u65f6\u95f4\u81ea\u7531\u5ea6\u9ad8) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | [\u4fe1\u606f\u7f3a\u5931] |\n| **\u4fe1\u606f\u539a\u5ea6** | [\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09] |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a[\u6df7\u6742\u8bd5\u6c34(\u4e2d)] \u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6709\u58f0\u884c\u4e1a\u7684\u597d\u5947\u548c\u5c1d\u8bd5\u610f\u613f\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u3001\u5b64\u6ce8\u4e00\u63b7\u7684\u8d5a\u94b1\u6e34\u671b\u3002\u884c\u4e3a\u4e0a\u79ef\u6781\u914d\u5408\uff0c\u4f46\u66f4\u50cf\u662f\u5728\u63a2\u7d22\u4e00\u4e2a\u53ef\u80fd\u7684\u5174\u8da3\u6216\u517c\u804c\u65b9\u5411\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u90fd\u60f3\u5b66\u3002\u8001\u5e08\u201d (\u8868\u660e\u5174\u8da3\u5e7f\u6cdb\uff0c\u4f46\u76ee\u6807\u672a\u805a\u7126\u4e8e\u201c\u641e\u94b1\u201d)\uff1b\u5168\u7a0b\u914d\u5408\u5ea6\u9ad8\uff0c\u4f46\u672a\u4e3b\u52a8\u8ffd\u95ee\u6536\u76ca\u7ec6\u8282\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b06\u9ad8]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 \u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\uff0c\u4f46\u80fd\u8003\u86517380\u5143\u8bfe\u7a0b\uff0c\u521d\u6b65\u5224\u65ad\u6709\u4e00\u5b9a\u7ecf\u6d4e\u57fa\u7840\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u2b06\u9ad8] \u2014 \u7528\u6237\u4e3a\u201c\u91cd\u5e86\u3002\u9000\u4f11\u201d\u72b6\u6001\uff0c\u65f6\u95f4\u5145\u88d5\uff0c\u80fd\u5feb\u901f\u54cd\u5e94\u5e76\u5b8c\u6210\u5404\u9879\u4f5c\u4e1a\u548c\u76f4\u64ad\u9884\u7ea6\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 \u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u4fe1\u606f\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a[\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)] \u7528\u6237\u6c9f\u901a\u793c\u8c8c\u3001\u60c5\u7eea\u7a33\u5b9a\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u76f4\u64ad\u65e0\u58f0\uff09\u65f6\uff0c\u5e73\u9759\u53cd\u9988\u5e76\u7b49\u5f85\u89e3\u51b3\u3002\u4e3b\u52a8\u8bf7\u6c42\u5e2e\u52a9\uff08\u201c\u80fd\u9ebb\u70e6\u8001\u5e08\u5e2e\u6211\u591a\u542c\u4e00\u7bc7\u5417\uff1f\u201d\uff09\uff0c\u6001\u5ea6\u79ef\u6781\uff0c\u65e0\u62b1\u6028\u6216\u8d1f\u9762\u60c5\u7eea\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u53ea\u6709\u56fe\u50cf\u6ca1\u6709\u58f0\u97f3\u201d\uff1b> \u201c\u4ec0\u4e48\u90fd\u6ca1\u6709\u201d\uff1b> \u201c\u80fd\u9ebb\u70e6\u8001\u5e08\u5e2e\u6211\u591a\u542c\u4e00\u7bc7\u5417\uff1f\u8c22\u8c22\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u9000\u4f11\u540e\u53ef\u80fd\u9762\u4e34\u793e\u4f1a\u89d2\u8272\u7f3a\u5931\u3001\u751f\u6d3b\u8282\u594f\u53d8\u6162\u5e26\u6765\u7684\u7a7a\u865a\u611f\uff0c\u4ee5\u53ca\u5bfb\u6c42\u65b0\u793e\u4ea4\u5708\u5b50\u548c\u4ef7\u503c\u8ba4\u540c\u7684\u6e34\u671b\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u88ab\u770b\u89c1\u3001\u88ab\u9700\u8981\u3001\u88ab\u5c0a\u91cd\u7684\u793e\u7fa4\u5f52\u5c5e\u611f**\u3002\u901a\u8fc7\u201c\u8001\u5e08\u201d\u7684\u79f0\u547c\u3001\u53ca\u65f6\u7684\u4f5c\u4e1a\u53cd\u9988\u3001\u901a\u5173\u8bc1\u4e66\u3001\u4ee5\u53ca\u8fdb\u5165\u201c\u5267\u7ec4\u201d\u7684\u627f\u8bfa\uff0c\u6ee1\u8db3\u5176\u83b7\u5f97\u65b0\u8eab\u4efd\u8ba4\u540c\u548c\u7fa4\u4f53\u63a5\u7eb3\u7684\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | [\ud83d\udfe7B] \u7c7b (\u9ad8\u914d\u5408\u5ea6\u3001\u8d44\u6e90\u5e95\u5ea7\u826f\u597d\u3001\u52a8\u673a\u4e2d\u7b49\uff0c\u5c5e\u4e8e\u53ef\u57f9\u517b\u7684\u6f5c\u529b\u7528\u6237) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | [T5 \u597d\u73a9\u5c1d\u9c9c] (\u9000\u4f11\u4eba\u58eb\uff0c\u65f6\u95f4\u5145\u88d5\uff0c\u5c06\u5b66\u4e60\u6709\u58f0\u6f14\u64ad\u89c6\u4e3a\u63a2\u7d22\u65b0\u4e8b\u7269\u3001\u4e30\u5bcc\u9000\u4f11\u751f\u6d3b\u3001\u83b7\u53d6\u793e\u4ea4\u8fde\u63a5\u7684\u4e00\u79cd\u65b9\u5f0f\uff0c\u800c\u975e\u751f\u5b58\u538b\u529b\u4e0b\u7684\u201c\u641e\u94b1\u201d\u521a\u9700\u3002) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a[\u65e0]\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | [\u4f4e] | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u9000\u4f11\u4eba\u58eb\u81ea\u4e3b\u6743\u901a\u5e38\u8f83\u9ad8\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | [\u4f4e] | \u65f6\u95f4\u5145\u88d5\uff0c\u5b66\u4e60\u8282\u594f\u80fd\u8ddf\u4e0a\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | [\u6781\u4f4e] | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u6c9f\u901a\u793c\u8c8c\u5e73\u548c\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | [\u4e2d] | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u82e5\u62a5\u540d\u9ad8\u9636\u8bfe\u7a0b\u540e\uff0c\u53d1\u73b0\u63a5\u5355\u673a\u4f1a\u3001\u6536\u5165\u56de\u62a5\u4e0e\u9884\u671f\u4e0d\u7b26\uff08\u5c24\u5176\u662f\u201c\u597d\u73a9\u5c1d\u9c9c\u201d\u578b\u7528\u6237\u5bf9\u56de\u62a5\u7684\u8010\u5fc3\u6709\u9650\uff09\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a[\u5f00\u8bfe1\u4e2a\u6708\u540e] \u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u82e5\u672a\u83b7\u5f97\u9884\u671f\u7684\u201c\u88ab\u9700\u8981\u611f\u201d\uff08\u5982\u63a5\u5355\u673a\u4f1a\u5c11\uff09\u6216\u793e\u4ea4\u6ee1\u8db3\u611f\uff0c\u53ef\u80fd\u840c\u751f\u9000\u610f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5e73\u5b89\u4e00\u751f\u59d0\u59d0/\u5927\u54e5\uff0c\u770b\u5230\u60a8\u8fd9\u4e48\u79ef\u6781\u5730\u5b8c\u6210\u4e86\u6240\u6709\u4f53\u9a8c\u8bfe\u4efb\u52a1\uff0c\u771f\u7684\u7279\u522b\u4f69\u670d\u60a8\u8fd9\u80a1\u8ba4\u771f\u52b2\u513f\uff01\u54b1\u4eec\u73ed\u91cc\u6709\u597d\u51e0\u4f4d\u548c\u60a8\u4e00\u6837\u9000\u4f11\u540e\u5f00\u542f\u65b0\u65c5\u7a0b\u7684\u540c\u5b66\uff0c\u5927\u5bb6\u4e92\u76f8\u4ea4\u6d41\u7279\u522b\u70ed\u95f9\u3002\u63a5\u4e0b\u6765\u7684\u6b63\u5f0f\u8bfe\uff0c\u54b1\u4eec\u4e0d\u56fe\u5feb\uff0c\u5c31\u56fe\u4e2a\u5f00\u5fc3\u548c\u5145\u5b9e\uff0c\u6211\u4f1a\u966a\u7740\u60a8\u6162\u6162\u89e3\u9501\u65b0\u6280\u80fd\uff0c\u8ba9\u60a8\u7684\u58f0\u97f3\u88ab\u66f4\u591a\u4eba\u542c\u5230\u548c\u559c\u6b22\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a[ **\u3010\u5174\u8da3\u6e38\u4e50\u7ebf\u3011** ] \u6838\u5fc3\u662f\u7ef4\u6301\u5174\u8da3\u3001\u63d0\u4f9b\u5c55\u793a\u821e\u53f0\u548c\u793e\u7fa4\u4e92\u52a8\uff0c\u800c\u975e\u5f3a\u538b\u63a5\u5355KPI\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a[ **\u3010\u8f7b\u91cf\u793e\u4ea4\u5c55\u793a\u5305\u3011** ] \u4f8b\u5982\uff1a\u4f18\u5148\u63a8\u8350\u53c2\u4e0e\u73ed\u7ea7\u5185\u90e8\u5206\u4eab\u4f1a\u3001\u58f0\u97f3\u4f5c\u54c1\u5899\u5c55\u793a\u3001\u8f7b\u91cf\u7ea7\u516c\u76ca\u914d\u97f3\u6d3b\u52a8\u7b49\uff0c\u5f3a\u5316\u5176\u201c\u88ab\u770b\u89c1\u201d\u548c\u201c\u88ab\u9700\u8981\u201d\u7684\u4f53\u9a8c\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a[\u7edd\u4e0d\u5bf9T5\u7528\u6237\u8fc7\u5ea6\u6e32\u67d3\u201c\u66b4\u5bcc\u201d\u6848\u4f8b\u6216\u65bd\u52a0\u63a5\u5355\u538b\u529b\uff1b\u907f\u514d\u4f7f\u7528\u201c\u4f60\u5fc5\u987b\u201d\u3001\u201c\u4e00\u5b9a\u8981\u201d\u7b49\u547d\u4ee4\u5f0f\u53e3\u543b\u3002]\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a[\u4e25\u7981\u5347\u5355] \u5f53\u524d7380\u5143\u8bfe\u7a0b\u5df2\u5c5e\u9ad8\u9636\uff0c\u4e25\u7981\u518d\u63a8\u66f4\u9ad8\u4ef7\u4ea7\u54c1\u3002\u540e\u7eed\u670d\u52a1\u91cd\u70b9\u5728\u6fc0\u6d3b\u548c\u7559\u5b58\uff0c\u800c\u975e\u7ee7\u7eed\u4ed8\u8d39\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u91cd\u5e86\u3002\u9000\u4f11\u201d **(\u6838\u5fc3\u8eab\u4efd\u4e0e\u8d44\u6e90\u4fe1\u53f7)**\n2. > \u201c\u6211\u90fd\u60f3\u5b66\u3002\u8001\u5e08\u201d **(\u5174\u8da3\u9a71\u52a8\uff0c\u76ee\u6807\u6a21\u7cca)**\n3. > \u201c\u80fd\u9ebb\u70e6\u8001\u5e08\u5e2e\u6211\u591a\u542c\u4e00\u7bc7\u5417\uff1f\u8c22\u8c22\u201d **(\u79ef\u6781\u3001\u793c\u8c8c\u3001\u5bfb\u6c42\u4e92\u52a8\u4e0e\u8ba4\u53ef)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **[T5\u597d\u73a9\u5c1d\u9c9c\u578b\u9000\u4f11\u65cf]**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **[\u793e\u4ea4\u966a\u4f34\u4e0e\u5c0a\u91cd\u5f52\u5c5e]**\u3002\u9000\u5355\u51e0\u7387\u4e3a **[\u4e2d]**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **[\u6301\u7eed\u63d0\u4f9b\u793e\u7fa4\u4e92\u52a8\u3001\u4f5c\u54c1\u5c55\u793a\u673a\u4f1a\u7b49\u60c5\u7eea\u4ef7\u503c\uff0c\u5f31\u5316\u529f\u5229\u6027\u63a5\u5355\u538b\u529b]**\u3002\n\n```json\n{\"core_type\": \"T5 \u597d\u73a9\u5c1d\u9c9c\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u793e\u4ea4\u4e0e\u5c0a\u91cd\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf\"}\n```";
