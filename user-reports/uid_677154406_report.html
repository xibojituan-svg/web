    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n> **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4e3b\u8981\u4e3a\u8bad\u7ec3\u8425\u671f\u95f4\u9500\u552e\u8ddf\u8fdb\u4e0e\u8f6c\u5316\u8fc7\u7a0b\uff0c\u7f3a\u5931\u7528\u6237**\u652f\u4ed8\u65b9\u5f0f\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u4e2a\u4eba\u80cc\u666f\uff08\u804c\u4e1a\u3001\u6536\u5165\u3001\u5e74\u9f84\uff09\u3001\u8fc7\u5f80\u632b\u6298\u7ecf\u5386**\u7b49\u5173\u952e\u4fe1\u606f\uff0c\u5bfc\u81f4\u5bf9\u8d44\u6e90\u5e95\u5ea7\uff08\u8d44\u91d1\u3001\u5bb6\u5ead\u652f\u6301\uff09\u548c\u5fc3\u7406\u5f39\u6027\u7684\u5224\u65ad\u4e3b\u8981\u57fa\u4e8e\u6709\u9650\u7684\u884c\u4e3a\u548c\u6001\u5ea6\u63a8\u6d4b\u3002\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677154406 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e-\u5c0f\u7389(\u7eaa\u6587\u7389) / \u73ed\u4e3b\u4efb-\u9065\u8fdc\u4e0d\u8fdc(\u5f20\u6587\u9759) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u7cbe\u82f1\u7248\u00b7\u626c\u5e06\u8d77\u822a\u8bfe\u7a0b (\u4ef7\u683c\u672a\u77e5) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | [\u4fe1\u606f\u7f3a\u5931] |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | [\u4fe1\u606f\u7f3a\u5931] \u804a\u5929\u663e\u793a\u80fd\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\uff0c\u65f6\u95f4\u53ef\u63a7\u6027\u4e2d\u7b49\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | [\u4fe1\u606f\u7f3a\u5931] |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e2d\u7b49\u504f\u8584\uff08\u884c\u4e3a\u4fe1\u606f\u591a\uff0c\u6df1\u5c42\u80cc\u666f\u4fe1\u606f\u5c11\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5b66\u4e60\u548c\u5c1d\u8bd5\u610f\u613f\uff0c\u5bf9\u53d8\u73b0\u6e20\u9053\uff08\u65f6\u85aa\u3001\u5206\u6210\uff09\u6709\u5177\u4f53\u5174\u8da3\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u6781\u7aef\u7684\u3001\u8feb\u5207\u7684\u751f\u5b58\u6027\u641e\u94b1\u9700\u6c42\u3002\u52a8\u673a\u4e2d\u6df7\u6742\u4e86\u5174\u8da3\u63a2\u7d22\uff08\u201c\u503e\u5411\u4e8e\u77e5\u8bc6\u7c7b\u4e66\u7c4d\uff08\u6bd4\u5982\u5173\u4e8e\u4eba\u751f\u7684\u610f\u4e49\uff09\u201d\uff09\u548c\u53d8\u73b0\u53ef\u80fd\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u76ee\u524d\u5bf9\u8fd9\u4e09\u4e2a\u611f\u5174\u8da3\u201d\uff08\u6307\u6f14\u64ad\u3001\u540e\u671f\u7b49\u8d5b\u9053\uff09\uff0c\u4ee5\u53ca > \u201c\u503e\u5411\u4e8e\u77e5\u8bc6\u7c7b\u4e66\u7c4d\uff08\u6bd4\u5982\u5173\u4e8e\u4eba\u751f\u7684\u610f\u4e49\uff09\uff0c\u5176\u6b21\u662f\u513f\u7ae5\u7c7b\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 \u65e0\u6cd5\u5224\u65ad\u652f\u4ed8\u80fd\u529b\u4e0e\u538b\u529b\uff0c\u4f46\u6700\u7ec8\u5b8c\u6210\u4e86\u7f34\u8d39\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 \u80fd\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\uff08\u5305\u62ec\u5728\u5916\u7528\u8033\u673a\u542c\uff09\uff0c\u5bf9\u989d\u5916\u4efb\u52a1\uff08\u5982Pia\u620f\uff09\u4f1a\u56e0\u5ba2\u89c2\u539f\u56e0\uff08\u9f3b\u708e\uff09\u8bf4\u660e\u60c5\u51b5\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u65f6\u95f4\u89c4\u5212\u80fd\u529b\uff0c\u4f46\u975e\u5168\u5929\u5019\u7a7a\u95f2\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 \u65e0\u76f8\u5173\u4fe1\u606f\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u9700\u95f4\u6b47\u6027\u5b89\u629a\u3002\u7528\u6237\u80fd\u9075\u5b88\u89c4\u5219\u3001\u5b8c\u6210\u4efb\u52a1\uff0c\u5728\u9047\u5230\u56f0\u96be\uff08\u5982\u9f3b\u708e\uff09\u65f6\u4f1a\u4e3b\u52a8\u6c9f\u901a\u8bf4\u660e\uff0c\u6001\u5ea6\u79ef\u6781\uff08\u201c\u6211\u4f1a\u52aa\u529b\u5b66\u4e60\u7684\u201d\uff09\u3002\u672a\u8868\u73b0\u51fa\u6781\u7aef\u60c5\u7eea\u5316\u6216\u81ea\u5351\uff0c\u4f46\u4e5f\u672a\u5c55\u793a\u51fa\u6781\u5f3a\u7684\u81ea\u6211\u9a71\u52a8\u548c\u6297\u538b\u95ed\u73af\u80fd\u529b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u5c3d\u91cf\u54c8\uff0c\u6211\u8fd9\u4e24\u5929\u9f3b\u708e\uff0c\u4e00\u76f4\u6253\u55b7\u568f[\u7834\u6d95\u4e3a\u7b11]\u9f3b\u5b50\u90fd\u64e6\u80bf\u4e86\ud83d\ude23\u201d (\u4e3b\u52a8\u6c9f\u901a\u969c\u788d) \uff1b > \u201c\u8c22\u8c22\u5e08\u59d0\u7684\u9f13\u52b1\u548c\u65b9\u5411\u6307\u70b9[\u53ef\u601c][\u53ef\u601c]\u6211\u4f1a\u52aa\u529b\u5b66\u4e60\u7684\u201d (\u5bf9\u6b63\u5411\u53cd\u9988\u6709\u4f9d\u8d56)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u4e13\u4e1a\u8ba4\u53ef\u548c\u5708\u5c42\u5f52\u5c5e\u7684\u6e34\u671b\u3002\u7528\u6237\u5bf9\u201c\u77e5\u8bc6\u7c7b\u4e66\u7c4d\u201d\u7684\u5174\u8da3\u3001\u5bf9\u201c\u7cbe\u82f1\u7248\u201d\u8bfe\u7a0b\u7684\u9009\u62e9\u3001\u4ee5\u53ca\u79ef\u6781\u56de\u5e94\u9500\u552e\u201c\u4f18\u79c0\u201d\u3001\u201c\u6709\u5851\u9020\u6027\u201d\u7684\u8bc4\u4ef7\uff0c\u90fd\u6307\u5411\u5176\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u83b7\u5f97\u6280\u80fd\u63d0\u5347\uff0c\u8fdb\u800c\u8d62\u5f97\u5c0a\u91cd\u548c\u8fdb\u5165\u4e00\u4e2a\u201c\u4e13\u4e1a\u201d\u5708\u5c42\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u8eab\u4efd\u7684\u8ba4\u540c\u4e0e\u5708\u5c42\u51c6\u5165\u7684\u4eea\u5f0f\u611f**\u3002\u6301\u7eed\u7ed9\u4e88\u201c\u4f18\u79c0\u5b66\u5458\u201d\u3001\u201c\u5ae1\u7cfb\u6f14\u64ad\u5e08\u201d\u7b49\u6807\u7b7e\uff0c\u5e76\u63d0\u4f9b\u8fdb\u5165\u201c\u5267\u7ec4\u7fa4\u201d\u7b49\u4e13\u5c5e\u5708\u5b50\u7684\u673a\u4f1a\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 **B\u7c7b** (\u52a8\u673a\u4e2d\u7b49\u3001\u8d44\u6e90\u4e2d\u7b49\u3001\u914d\u5408\u5ea6\u9ad8\u3001\u98ce\u9669\u53ef\u63a7\u7684\u6f5c\u529b\u7528\u6237) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T3 \u6b7b\u78d5\u5b66\u9738\u578b** (\u504f\u5411) / **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u6df7\u5408)\u3002\u7528\u6237\u8868\u73b0\u51fa\u8f83\u5f3a\u7684\u89c4\u5219\u9075\u5faa\u6027\uff08\u6309\u65f6\u6253\u5361\u3001\u4ea4\u4f5c\u4e1a\uff09\u3001\u5bf9\u5b66\u4e60\u5185\u5bb9\u6709\u7b5b\u9009\uff08\u5174\u8da3\u5bfc\u5411\uff09\u3001\u5bf9\u6b63\u5411\u53cd\u9988\u6709\u79ef\u6781\u56de\u5e94\uff0c\u7b26\u5408T3\u7279\u5f81\uff1b\u540c\u65f6\u6001\u5ea6\u52a1\u5b9e\uff08\u201c\u5c31\u4e00\u6b65\u4e00\u6b65\u770b\u7740\u6765\u201d\uff09\uff0c\u4e5f\u5e26\u6709T2\u8272\u5f69\u3002 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | [\u4f4e] | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u7528\u6237\u51b3\u7b56\u8fc7\u7a0b\u72ec\u7acb\uff0c\u98ce\u9669\u6682\u4f30\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | [\u4e2d] | \u82e5\u6b63\u5f0f\u8bfe\u7a0b\u5f3a\u5ea6\u8fdc\u8d85\u8bad\u7ec3\u8425\uff0c\u6216\u4e0e\u4e3b\u4e1a\u65f6\u95f4\u51b2\u7a81\uff0c\u53ef\u80fd\u56e0\u65e0\u6cd5\u8ddf\u4e0a\u8fdb\u5ea6\u800c\u81ea\u8d23\u9000\u51fa\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | [\u4f4e] | \u7528\u6237\u6c9f\u901a\u987a\u7545\uff0c\u80fd\u8bf4\u660e\u5ba2\u89c2\u56f0\u96be\uff08\u5982\u9f3b\u708e\uff09\uff0c\u672a\u8868\u73b0\u51fa\u73bb\u7483\u5fc3\u7279\u8d28\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | [\u4e2d] | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u7528\u6237\u5bf9\u201c\u65f6\u85aa\u5355\u201d\u3001\u201c\u7248\u6743\u4e66\u201d\u7b49\u53d8\u73b0\u8def\u5f84\u6709\u660e\u786e\u671f\u5f85\u3002\u82e5\u5f00\u8bfe\u540e\u53d1\u73b0\u63a5\u5355\u95e8\u69db\u9ad8\u3001\u7ade\u4e89\u6fc0\u70c8\u6216\u521d\u671f\u6536\u76ca\u8fdc\u4f4e\u4e8e\u5ba3\u4f20\uff0c\u6613\u4ea7\u751f\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u8fdb\u5165\u6280\u80fd\u722c\u5761\u548c\u5b9e\u6218\u8bd5\u97f3\u9636\u6bb5\uff0c\u82e5\u5c61\u6b21\u8bd5\u97f3\u5931\u8d25\u6216\u63a5\u5355\u65e0\u95e8\uff0c\u6536\u76ca\u843d\u5dee\u611f\u5c06\u96c6\u4e2d\u7206\u53d1\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u674e\u723d\u540c\u5b66\uff0c\u606d\u559c\u4f60\u52a0\u5165\u2018\u626c\u5e06\u8d77\u822a\u2019\u7cbe\u82f1\u73ed\uff01\u8bad\u7ec3\u8425\u671f\u95f4\u4f60\u5c55\u73b0\u51fa\u7684\u8ba4\u771f\u548c\u609f\u6027\uff0c\u5e08\u59d0\u90fd\u770b\u5728\u773c\u91cc\u3002\u63a5\u4e0b\u6765\uff0c\u6211\u4eec\u4f1a\u4e00\u8d77\u4ece\u2018\u7231\u597d\u8005\u2019\u5411\u2018\u4e13\u4e1a\u6f14\u64ad\u5e08\u2019\u8fc8\u8fdb\u3002\u8fd9\u6761\u8def\u9700\u8981\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u4f46\u6bcf\u4efd\u4f5c\u4e1a\u3001\u6bcf\u6b21\u8bd5\u97f3\u90fd\u662f\u4f60\u4e13\u4e1a\u8eab\u4efd\u7684\u52cb\u7ae0\u3002\u522b\u6015\u6162\uff0c\u73ed\u73ed\u4f1a\u4e00\u76f4\u966a\u7740\u4f60\uff0c\u54b1\u4eec\u7a33\u624e\u7a33\u6253\uff0c\u628a\u5174\u8da3\u53d8\u6210\u5b9e\u5b9e\u5728\u5728\u7684\u80fd\u529b\u548c\u8ba4\u53ef\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u3002\u5339\u914d\u5176T3\u7279\u8d28\uff0c\u63d0\u4f9b\u6e05\u6670\u3001\u7ed3\u6784\u5316\u3001\u6709\u68af\u5ea6\u7684\u6280\u80fd\u8bad\u7ec3\u8def\u5f84\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u5c0a\u91cd\u4e0e\u5f52\u5c5e\u9700\u6c42\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010**\u5708\u5c42\u8eab\u4efd\u8d4b\u80fd\u5305**\u3011\uff1a\u5982\u201c\u7cbe\u82f1\u73ed\u4e13\u5c5e\u6807\u8bc6\u201d\u3001\u201c\u65e9\u671f\u5185\u6d4b\u5267\u7ec4\u4f53\u9a8c\u8d44\u683c\u201d\u3001\u201c\u4e0e\u8001\u5e08/\u524d\u8f88\u7684\u7ebf\u4e0a\u4ea4\u6d41\u4f1a\u540d\u989d\u201d\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u8fc7\u5ea6\u627f\u8bfa\u201c\u8f7b\u677e\u6708\u5165\u8fc7\u4e07\u201d\uff0c\u907f\u514d\u5f15\u53d1\u6536\u76ca\u843d\u5dee\u30022. \u5ffd\u89c6\u5176\u201c\u77e5\u8bc6\u7c7b\u201d\u5185\u5bb9\u504f\u597d\uff0c\u5f3a\u884c\u63a8\u8350\u4e0d\u611f\u5174\u8da3\u7684\u8a00\u60c5\u7c7b\u4e66\u5355\u30023. \u5728\u5176\u9047\u5230\u6280\u672f\u74f6\u9888\u65f6\uff0c\u53ea\u7ed9\u9e21\u6c64\u4e0d\u7ed9\u5177\u4f53\u89e3\u51b3\u65b9\u6848\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u8bfe\u7a0b\u521d\u671f\uff08\u524d\u4e24\u4e2a\u6708\uff09\u8fdb\u884c\u5927\u989d\u5347\u5355**\u3002\u53ef\u57fa\u4e8e\u5176\u5b66\u4e60\u8fdb\u5c55\u548c\u63a5\u5355\u6210\u679c\uff0c\u5728\u540e\u671f\u914c\u60c5\u63a8\u8350\u9ad8\u9636\u4e13\u9879\u8bfe\uff08\u5982\u9ad8\u7ea7\u89d2\u8272\u97f3\u3001\u540e\u671f\u5236\u4f5c\uff09\uff0c\u91d1\u989d\u9700\u8c28\u614e\u8bc4\u4f30\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u503e\u5411\u4e8e\u77e5\u8bc6\u7c7b\u4e66\u7c4d\uff08\u6bd4\u5982\u5173\u4e8e\u4eba\u751f\u7684\u610f\u4e49\uff09\uff0c\u5176\u6b21\u662f\u513f\u7ae5\u7c7b\u201d \u2014\u2014 **\u63ed\u793a\u6df1\u5c42\u5174\u8da3\u4e0e\u4ef7\u503c\u8ffd\u6c42\uff0c\u975e\u7eaf\u529f\u5229\u3002**\n2. > \u201c\u6211\u5c3d\u91cf\u54c8\uff0c\u6211\u8fd9\u4e24\u5929\u9f3b\u708e\uff0c\u4e00\u76f4\u6253\u55b7\u568f[\u7834\u6d95\u4e3a\u7b11]\u9f3b\u5b50\u90fd\u64e6\u80bf\u4e86\ud83d\ude23\u201d \u2014\u2014 **\u5c55\u793a\u6c9f\u901a\u610f\u613f\u4e0e\u9002\u5ea6\u793a\u5f31\uff0c\u975e\u60c5\u7eea\u5316\u5bf9\u6297\u3002**\n3. > \u201c\u5c31\u4e00\u6b65\u4e00\u6b65\u770b\u7740\u6765\u770b\u7740\u8d70[\u5472\u7259]\u201d \u2014\u2014 **\u4f53\u73b0\u52a1\u5b9e\u3001\u6e10\u8fdb\u7684\u5fc3\u6001\uff0c\u975e\u72c2\u70ed\u6216\u6d88\u6781\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T3\u6b7b\u78d5\u5b66\u9738\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4e0e\u5708\u5c42\u5f52\u5c5e\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u7b49\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7ba1\u7406\u6536\u76ca\u9884\u671f + \u5f3a\u5316\u5708\u5c42\u5f52\u5c5e\u611f\u4e0e\u9636\u6bb5\u6027\u6210\u5c31\u611f\u53cd\u9988\u3011**\u3002\n\n```json\n{\"core_type\": \"T3 \u6b7b\u78d5\u5b66\u9738\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u5f52\u5c5e\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5708\u5c42\u8eab\u4efd\u8d4b\u80fd\u5305\"}\n```";
        document.getElementById('content').innerHTML = marked.parse(markdownText);
