    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## \u4fe1\u606f\u5145\u8db3\u6027\u8bc4\u4f30\n\u4fe1\u606f\u5145\u8db3\uff0c\u53ef\u8fdb\u884c\u5206\u5c42\u5224\u65ad\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u4e2d\u7b49\u504f\u5de5\u5177\u578b**\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u201c\u53d8\u73b0\u201d\u548c\u201c\u63a5\u5355\u201d\u9700\u6c42\uff08\u201c\u5b66\u591a\u4e45\u53ef\u4ee5\u5f00\u59cb\u63a5\u5355\u201d\u3001\u201c\u8fd9\u4e9b\u89c6\u9891\u90fd\u662f\u653e\u5728\u81ea\u5df1\u8d26\u53f7\u4e0a\u8fd8\u662f\u5e73\u53f0\u4e0a\u7684\u201d\uff09\uff0c\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u83b7\u53d6\u526f\u4e1a\u6536\u5165\u3002\u5bf9\u201c\u6015\u5565\u90fd\u4e0d\u4f1a\u5e08\u59d0\u4e0d\u5e26\u6211\u201d\u7684\u62c5\u5fe7\uff0c\u663e\u793a\u5176\u5b66\u4e60\u52a8\u673a\u4e0e\u83b7\u53d6\u8d44\u6e90\u548c\u673a\u4f1a\u5f3a\u76f8\u5173\uff0c\u800c\u975e\u7eaf\u7cb9\u5174\u8da3\u63a2\u7d22\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u672a\u77e5/\u5f85\u63a2\u67e5**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u900f\u9732\u7528\u6237\u7684\u804c\u4e1a\u3001\u6559\u80b2\u80cc\u666f\u3001\u53ef\u7528\u65f6\u95f4\u3001\u8bbe\u5907\u6761\u4ef6\u3001\u7ecf\u6d4e\u72b6\u51b5\u7b49\u5173\u952e\u8d44\u6e90\u4fe1\u606f\u3002\u7528\u6237\u4ec5\u5bf9\u201c\u4e0d\u4f1a\u540e\u9762\u8fd8\u8981\u4e70\u8bfe\u7a0b\u5427\u201d\u8868\u793a\u8fc7\u5173\u5207\uff0c\u6697\u793a\u5bf9\u540e\u7eed\u6295\u5165\u53ef\u80fd\u654f\u611f\uff0c\u4f46\u4e0d\u8db3\u4ee5\u5224\u65ad\u5176\u771f\u5b9e\u8d44\u6e90\u6c34\u5e73\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u4e2d\u7b49\u504f\u987a\u4ece\u578b**\u3002\u7528\u6237\u4e92\u52a8\u6a21\u5f0f\u4ee5\u7b80\u77ed\u56de\u5e94\u4e3a\u4e3b\uff08\u201c\u55ef\u201d\u3001\u201c\u597d\u201d\u3001\u201c\u6b27\u201d\u3001\u201c\u6709\u5440\u201d\uff09\uff0c\u80fd\u8ddf\u968f\u9500\u552e\u8282\u594f\uff0c\u53c2\u4e0e\u76f4\u64ad\u3001\u63d0\u4ea4\u53e3\u4ee4\uff0c\u6700\u7ec8\u5b8c\u6210\u652f\u4ed8\u3002\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u914d\u5408\u5ea6\u4e0e\u4fe1\u4efb\u611f\uff0c\u4f46\u7f3a\u4e4f\u4e3b\u52a8\u63d0\u95ee\u548c\u6df1\u5ea6\u63a2\u8ba8\uff0c**\u4f9d\u8d56\u6027\u5f3a**\uff0c\u81ea\u4e3b\u51b3\u7b56\u4e0e\u6297\u538b\u80fd\u529b\u672a\u77e5\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 (\u652f\u4ed8\u6838\u67e5)**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u4e8e4\u670812\u65e521:52\u5b8c\u6210\u8bfe\u7a0b\u652f\u4ed8\uff08\u63d0\u53ca\u201c2980 3980\u201d\u4ef7\u683c\u6863\u4f4d\uff09\uff0c\u8fdb\u5165\u4ea4\u4ed8\u9636\u6bb5\u3002\n*   **\u6b65\u9aa41.5 (\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5)**: **\u4fe1\u606f\u7f3a\u5931**\u3002\u65e0\u4efb\u4f55\u5173\u4e8e\u5bb6\u5ead\u3001\u914d\u5076\u6216\u5171\u540c\u51b3\u7b56\u8005\u7684\u8ba8\u8bba\uff0c\u9ed8\u8ba4\u89c6\u4e3a\u4e2a\u4eba\u72ec\u7acb\u51b3\u7b56\u3002\n*   **\u6b65\u9aa42-4 (\u9700\u6c42-\u65b9\u6848\u5339\u914d)**: \u9500\u552e\u5168\u7a0b\u4ee5\u201c\u5feb\u901f\u63a5\u5355\u53d8\u73b0\u201d\uff08\u7b2c8\u5929\u5f00\u653e\u6743\u9650\uff09\u3001\u201c\u5de5\u4f5c\u5ba4\u7b7e\u7ea6\u201d\u3001\u201cMCN\u8d44\u6e90\u201d\u3001\u201c\u5546\u5355\u6e20\u9053\u201d\u4e3a\u6838\u5fc3\u5356\u70b9\uff0c\u7cbe\u51c6\u56de\u5e94\u7528\u6237\u7684\u201c\u63a5\u5355\u201d\u8bc9\u6c42\u3002\u7528\u6237\u4ece\u8be2\u95ee\u201c\u5b66\u591a\u4e45\u63a5\u5355\u201d\u5230\u6700\u7ec8\u652f\u4ed8\uff0c\u663e\u793a\u9500\u552e\u903b\u8f91\u5bf9\u5176\u6709\u6548\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**: **B\u7c7b\uff08\u65b9\u6848\u8ba4\u53ef\u578b\uff09**\u3002\u7528\u6237\u8ba4\u53ef\u9500\u552e\u63d0\u4f9b\u7684\u201c\u6280\u80fd\u5b66\u4e60+\u8d44\u6e90\u5bf9\u63a5\u201d\u53d8\u73b0\u8def\u5f84\uff0c\u5e76\u5b8c\u6210\u652f\u4ed8\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**: **T4 \u52a1\u5b9e\u6c42\u679c\u578b**\u3002\n    *   **\u6838\u5fc3\u7279\u5f81**: \u76ee\u6807\u660e\u786e\uff08\u8d5a\u94b1/\u63a5\u5355\uff09\uff0c\u5173\u6ce8\u6295\u5165\u4ea7\u51fa\u6bd4\u4e0e\u65f6\u95f4\u5468\u671f\uff08\u201c\u5b66\u591a\u4e45\u53ef\u4ee5\u5f00\u59cb\u63a5\u5355\u201d\uff09\uff0c\u5bf9\u672a\u6765\u7684\u989d\u5916\u6295\u5165\u6709\u8b66\u60d5\u6027\uff08\u201c\u4e0d\u4f1a\u540e\u9762\u8fd8\u8981\u4e70\u8bfe\u7a0b\u5427\u201d\uff09\u3002\u884c\u52a8\u4e0a\u914d\u5408\u6307\u4ee4\uff0c\u4f46\u9700\u8981\u6e05\u6670\u3001\u53ef\u9884\u671f\u7684\u7ed3\u679c\u5bfc\u5411\u8def\u5f84\u3002\n    *   **\u4e0d\u5339\u914d\u70b9**: \u975eT1\uff08\u65e0\u5f3a\u70c8\u7126\u8651\u6216\u751f\u5b58\u538b\u529b\u8868\u8fbe\uff09\uff0c\u975eT2\uff08\u672a\u8868\u73b0\u51fa\u6781\u5f3a\u81ea\u4e3b\u6027\u548c\u89c4\u5212\u6027\uff09\uff0c\u975eT3\uff08\u672a\u63d0\u53ca\u793e\u4ea4\u6216\u5708\u5b50\u9700\u6c42\uff09\uff0c\u975eT5/6/7/8\uff08\u65e0\u76f8\u5e94\u60c5\u7eea\u5316\u3001\u4f9d\u8d56\u6216\u70ab\u8000\u7279\u5f81\uff09\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669**: **\u4e2d\u7b49**\u3002\n*   **\u6839\u56e0\u6392\u67e5**:\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**: **\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u6838\u5fc3\u8bc9\u6c42\u662f\u201c\u63a5\u5355\u53d8\u73b0\u201d\u3002\u82e5\u5165\u5b66\u540e\u63a5\u5355\u95e8\u69db\u9ad8\u3001\u5468\u671f\u957f\u3001\u6536\u76ca\u4e0e\u5ba3\u4f20\u4e0d\u7b26\uff0c\u6781\u6613\u5f15\u53d1\u201c\u627f\u8bfa\u672a\u5151\u73b0\u201d\u4e89\u8bae\u3002\n    2.  **\u8bfe\u7a0b\u8d28\u91cf\u4e0d\u7b26**: \u4e2d\u98ce\u9669\u3002\u53d6\u51b3\u4e8e\u5b9e\u9645\u8bfe\u7a0b\u4e0e\u5ba3\u4f20\u7684\u201c\u5b9e\u64cd\u201d\u3001\u201c\u8d44\u6e90\u201d\u5339\u914d\u5ea6\u3002\n    3.  **\u7ecf\u6d4e\u538b\u529b**: \u672a\u77e5\u3002\u9700\u540e\u7eed\u63a2\u67e5\u3002\n    4.  **\u65f6\u95f4\u51b2\u7a81**: \u672a\u77e5\u3002\u9700\u540e\u7eed\u63a2\u67e5\u3002\n    5.  **\u5bb6\u5ead\u53cd\u5bf9**: \u4f4e\u98ce\u9669\u3002\u6682\u65e0\u4fe1\u53f7\u3002\n    6.  **\u7ade\u54c1\u5bf9\u6bd4/\u51b2\u52a8\u6d88\u8d39**: \u4f4e\u98ce\u9669\u3002\u7528\u6237\u51b3\u7b56\u57fa\u4e8e\u9500\u552e\u7684\u8d44\u6e90\u627f\u8bfa\uff0c\u975e\u4e34\u65f6\u51b2\u52a8\u3002\n    7.  **\u670d\u52a1\u4f53\u9a8c\u5dee**: **\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5df2\u8868\u73b0\u51fa\u5bf9\u201c\u5e08\u59d0\u201d\u7684\u4f9d\u8d56\uff08\u201c\u6015\u5565\u90fd\u4e0d\u4f1a\u5e08\u59d0\u4e0d\u5e26\u6211\u201d\uff09\uff0c\u82e5\u4ea4\u4ed8\u9636\u6bb5\u8f85\u5bfc\u4e0d\u5468\u3001\u53cd\u9988\u4e0d\u53ca\u65f6\uff0c\u6613\u4ea7\u751f\u88ab\u629b\u5f03\u611f\u4e0e\u6295\u8bc9\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u98ce\u9669\u70b9**:\n    1.  **\u8fc7\u5ea6\u627f\u8bfa\u98ce\u9669**: \u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u7b2c8\u5929\u5f00\u653e\u63a5\u5355\u6743\u9650\u201d\u3001\u201c\u6bd5\u4e1a\u76f4\u63a5\u7b7e\u7ea6MCN\u201d\u3001\u201c\u5de5\u4f5c\u5ba4\u8d44\u6e90\u6258\u4e3e\u201d\uff0c**\u5b58\u5728\u5c06\u201c\u673a\u4f1a\u201d\u63cf\u8ff0\u4e3a\u201c\u4fdd\u969c\u201d\u7684\u6a21\u7cca\u5730\u5e26**\uff0c\u53ef\u80fd\u62c9\u9ad8\u7528\u6237\u9884\u671f\u3002\n    2.  **\u5236\u9020\u7a00\u7f3a\u4e0e\u7d27\u8feb\u611f**: \u4f7f\u7528\u201c\u62fc\u624b\u901f\u201d\u3001\u201c\u4eca\u665a\u5f00\u653e\u5c11\u91cf\u540d\u989d\u201d\u3001\u201c\u4f18\u5148\u9009\u62e9\u73ed\u7ea7\u201d\u7b49\u8bdd\u672f\uff0c\u662f\u5e38\u89c1\u9500\u552e\u7b56\u7565\uff0c\u8bb0\u5f55\u4e2d\u672a\u89c1\u660e\u663e\u8fdd\u89c4\u3002\n    3.  **\u8d44\u8d28\u4e0e\u6210\u679c\u5c55\u793a**: \u9500\u552e\u5c55\u793a\u4e86\u201c\u5e73\u53f0\u6536\u76ca\u622a\u56fe\u201d\u3001\u201c\u5408\u4f5c\u5e73\u53f0\u5217\u8868\u201d\u3001\u201c\u5b66\u5458\u5546\u5355\u4f5c\u54c1\u201d\uff0c\u672a\u53d1\u73b0\u660e\u663e\u4f2a\u9020\u75d5\u8ff9\uff0c\u4f46\u9700\u6ce8\u610f\u5176\u4e2a\u4eba\u6210\u679c\u4e0d\u4ee3\u8868\u666e\u901a\u5b66\u5458\u5e73\u5747\u6c34\u5e73\u3002\n*   **\u7ed3\u8bba**: \u9500\u552e\u6d41\u7a0b\u5b58\u5728**\u8fc7\u5ea6\u627f\u8bfa\u503e\u5411**\uff0c\u4e3a\u540e\u7eed\u4ea4\u4ed8\u548c\u5ba2\u8bc9\u57cb\u4e0b\u9690\u60a3\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6838\u5fc3\u7b56\u7565**: **\u5f3a\u5316\u201c\u8def\u5f84\u53ef\u89c6\u5316\u201d\u4e0e\u201c\u5373\u65f6\u6b63\u53cd\u9988\u201d**\uff0c\u7ba1\u7406\u9884\u671f\uff0c\u5151\u73b0\u8d44\u6e90\u627f\u8bfa\u3002\n*   **\u884c\u52a8\u6307\u5357**:\n    1.  **\u9884\u671f\u7ba1\u7406\uff08\u5173\u952e\uff09**: \u5165\u5b66\u540e\u7acb\u5373\u6f84\u6e05\u201c\u63a5\u5355\u201d\u6807\u51c6\uff08\u5982\u4f5c\u4e1a\u5b8c\u6210\u5ea6\u3001\u6280\u80fd\u8003\u6838\uff09\u3001MCN\u7b7e\u7ea6\u6761\u4ef6\uff08\u5982\u6bd5\u4e1a\u4f5c\u54c1\u8d28\u91cf\u3001\u5546\u5355\u5b8c\u6210\u91cf\uff09\uff0c\u5c06\u201c\u673a\u4f1a\u201d\u8f6c\u5316\u4e3a\u6e05\u6670\u7684**\u9636\u6bb5\u6027\u76ee\u6807**\u3002\n    2.  **\u8d44\u6e90\u5bf9\u63a5**: \u4e25\u683c\u6309\u7167\u5ba3\u4f20\uff08\u5982\u7b2c8\u5929\uff09\u5f00\u653e\u63a5\u5355\u6e20\u9053\uff0c\u5e76\u63d0\u4f9b**\u4f4e\u95e8\u69db\u7684\u5165\u95e8\u7ea7\u5546\u5355**\uff0c\u8ba9\u7528\u6237\u5feb\u901f\u83b7\u5f97\u201c\u8d5a\u5230\u7b2c\u4e00\u7b14\u94b1\u201d\u7684\u4f53\u9a8c\uff0c\u5efa\u7acb\u4fe1\u4efb\u3002\n    3.  **\u5f3a\u5316\u5173\u7cfb**: \u7528\u6237\u5bf9\u201c\u5e08\u59d0\u201d\u6709\u4f9d\u8d56\uff0c\u73ed\u4e3b\u4efb\u5e94\u627f\u63a5\u6b64\u89d2\u8272\uff0c\u63d0\u4f9b\u53ca\u65f6\u3001\u5177\u4f53\u7684\u4f5c\u4e1a\u53cd\u9988\u548c\u9f13\u52b1\uff0c\u907f\u514d\u7528\u6237\u4ea7\u751f\u201c\u4ed8\u8d39\u540e\u65e0\u4eba\u7ba1\u201d\u7684\u843d\u5dee\u3002\n    4.  **\u98ce\u9669\u76d1\u63a7**: \u5bc6\u5207\u5173\u6ce8\u7528\u6237\u5b8c\u6210\u7b2c\u4e00\u4e2a\u5c0f\u76ee\u6807\uff08\u5982\u63a5\u5230\u7b2c\u4e00\u5355\uff09\u7684\u8fdb\u5ea6\u4e0e\u5fc3\u6001\uff0c\u82e5\u9047\u632b\uff0c\u53ca\u65f6\u4ecb\u5165\u8f85\u5bfc\uff0c\u9632\u6b62\u56e0\u521d
