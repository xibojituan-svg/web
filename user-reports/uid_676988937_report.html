    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u6cfd (UID: 676988937) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-04 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u96ea\u62fe\u67d2(\u9a6c\u51ac\u96ea) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66/AI\u77ed\u89c6\u9891\u7b49\u526f\u4e1a\u6280\u80fd\u57f9\u8bad\u8bfe\u7a0b (\u5177\u4f53\u8bfe\u7a0b\u540d\u79f0\u53ca\u4ef7\u683c\u672a\u77e5) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u5de5\u4f5c\u5236\u4e3a\u201c\u65e9\u5341\u665a\u4e5d\u70b9\u534a\uff0c\u901a\u52e4\u4e00\u4e24\u4e2a\u5c0f\u65f6\u201d\uff0c\u5468\u672b\u6709\u65f6\u95f4\uff0c\u4f46\u5de5\u4f5c\u65e5\u665a\u4e0a\u65f6\u95f4\u7d27\u5f20\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\uff0c\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u5b66\u4e60\u884c\u4e3a\u3001\u65f6\u95f4\u5b89\u6392\u3001\u804c\u4e1a\u4fe1\u606f\u660e\u786e\uff0c\u4f46\u7f3a\u4e4f\u652f\u4ed8\u3001\u5bb6\u5ead\u652f\u6301\u3001\u6df1\u5c42\u52a8\u673a\u7b49\u5173\u952e\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765**\u3002\u7528\u6237\u4e3b\u52a8\u63a2\u7d22\u8bfe\u7a0b\u5185\u5bb9\u3001\u79ef\u6781\u5b8c\u6210\u4f5c\u4e1a\u3001\u5c1d\u8bd5\u62a5\u540d\u5206\u6210\u4e66\u201c\u73a9\u73a9\u201d\uff0c\u5e76\u8868\u73b0\u51fa\u5bf9\u540e\u671f\u5236\u4f5c\u7b49\u6280\u80fd\u7684\u597d\u5947\uff08\u201c\u542c\u8d77\u6765\u597d\u50cf\u633a\u597d\u73a9\u7684\u201d\uff09\u3002\u672a\u63d0\u53ca\u4efb\u4f55\u77ed\u671f\u53d8\u73b0\u6216\u4fdd\u5e95\u627f\u8bfa\u8981\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u73b0\u9636\u6bb5\u662f\u4e0d\u662f\u62a5\u5206\u6210\u4e66\u5c31\u4e00\u70b9\u4e0d\u4f1a\u88ab\u9009\u4e2d...\u60f3\u62ff\u5206\u6210\u4e66\u5f53\u5f55\u97f3\u70b9\u8bc4\u7528\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\uff0c\u4f5c\u4e3a\u201c\u5b9e\u4e60\u751f\u201d\u6709\u6b63\u5e38\u5de5\u8d44\uff0c\u80fd\u8003\u8651\u8d2d\u4e70\u4e13\u4e1a\u8bbe\u5907\uff08\u5982MK4\u9ea6\u514b\u98ce\uff09\uff0c\u65e0\u660e\u663e\u8d44\u91d1\u77ed\u677f\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 **\u4e3b\u8981\u77ed\u677f**\u3002\u5de5\u4f5c\u7e41\u5fd9\uff08\u201c\u8d76\u9879\u76ee\u8fdb\u5ea6\u201d\uff09\uff0c\u5e38\u52a0\u73ed\uff0c\u901a\u52e4\u65f6\u95f4\u957f\u3002\u5b66\u4e60\u65f6\u95f4\u9ad8\u5ea6\u4f9d\u8d56\u5468\u672b\u548c\u788e\u7247\u5316\u62fc\u51d1\uff08\u201c\u5468\u672b\u505a\u5e94\u8be5\u6ca1\u95ee\u9898\u5427\u201d\u3001\u201c\u6211\u628a\u4e8b\u60c5\u90fd\u5468\u672b\u505a\u4e86\u201d\uff09\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\uff0c\u65e0\u6cd5\u5224\u65ad\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u3001\u64cd\u4f5c\u6b65\u9aa4\uff09\u4f1a\u4e3b\u52a8\u8be2\u95ee\u5e76\u5c1d\u8bd5\u89e3\u51b3\uff08\u201c\u88c5\u5b8c\u53ea\u4f1a\u70b9\u5f55\u97f3\u201d\u3001\u201c\u56de\u53bb\u518d\u56de\u987e\u4e00\u4e0b\u201d\uff09\u3002\u4e0e\u73ed\u73ed\u6c9f\u901a\u8f7b\u677e\u3001\u5e7d\u9ed8\uff0c\u65e0\u4efb\u4f55\u62b1\u6028\u6216\u60c5\u7eea\u5d29\u6e83\u8ff9\u8c61\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u9700\u8981\u73ed\u73ed\u624b\u628a\u624b\u6559\u201d (\u4ee5\u73a9\u7b11\u53e3\u543b\u63d0\u51fa\u9700\u6c42\uff0c\u800c\u975e\u62b1\u6028)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u4f5c\u4e3a\u201c\u5b9e\u4e60\u751f\u201d\uff0c\u5728\u804c\u573a\u4e2d\u53ef\u80fd\u5904\u4e8e\u88ab\u652f\u914d\u3001\u7f3a\u4e4f\u6210\u5c31\u611f\u7684\u201c\u725b\u9a6c\u201d\u72b6\u6001\uff08\u201c\u8001\u677f\u5e78\u798f\u4e86\u5458\u5de5\u725b\u9a6c\u4e86\u201d\uff09\u3002\u4ed6\u5bfb\u6c42\u5728\u526f\u4e1a\u9886\u57df\u83b7\u5f97**\u4e13\u4e1a\u6280\u80fd\u7684\u8ba4\u53ef**\u548c**\u4e2a\u4eba\u4ef7\u503c\u7684\u5b9e\u73b0**\uff0c\u4ee5\u5e73\u8861\u6216\u8d85\u8d8a\u4e3b\u4e1a\u7684\u5e73\u6de1\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u5c42\u9762\u7684\u80af\u5b9a\u4e0e\u8fdb\u9636\u6307\u5bfc**\u3002\u4ed6\u9700\u8981\u88ab\u5f53\u4f5c\u4e00\u4e2a\u201c\u6709\u6f5c\u529b\u7684\u4e13\u4e1a\u4eba\u58eb\u201d\u800c\u975e\u5c0f\u767d\u6765\u770b\u5f85\uff0c\u7ed9\u4e88\u786c\u6838\u7684\u6280\u672f\u652f\u6301\u548c\u6b63\u5411\u53cd\u9988\uff0c\u6ee1\u8db3\u5176\u8ffd\u6c42\u201c\u5389\u5bb3\u201d\u3001\u201c\u4e13\u4e1a\u201d\u7684\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u52a8\u673a\u7eaf\u5ea6\u9ad8\uff0c\u8d44\u6e90\u5e95\u5ea7\u4e2d\u7b49\uff0c\u5fc3\u7406\u5f39\u6027\u9ad8) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5ead\u51b2\u7a81\u8ff9\u8c61\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u672a\u663e\u793a\u98ce\u9669\u4fe1\u53f7\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u4e2d** | **\u4e3b\u8981\u98ce\u9669**\u3002\u56e0\u5de5\u4f5c\u7e41\u5fd9\uff08\u201c\u8d76\u9879\u76ee\u8fdb\u5ea6\u5b9e\u5728\u6ca1\u65f6\u95f4\u770b\u201d\uff09\u5bfc\u81f4\u8bfe\u7a0b\u4efb\u52a1\u79ef\u538b\uff0c\u4ea7\u751f\u6301\u7eed\u6027\u7684\u201c\u8ffd\u8d76\u201d\u538b\u529b\uff0c\u82e5\u957f\u671f\u65e0\u6cd5\u8ddf\u4e0a\u8fdb\u5ea6\uff0c\u53ef\u80fd\u56e0\u81ea\u8d23\u548c\u632b\u8d25\u611f\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u6c9f\u901a\u98ce\u683c\u8f7b\u677e\uff0c\u80fd\u81ea\u6211\u8c03\u4f83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u52a8\u673a\u4e3a\u80fd\u529b\u6210\u957f\u800c\u975e\u77ed\u671f\u53d8\u73b0\uff0c\u5bf9\u6536\u76ca\u9884\u671f\u7ba1\u7406\u8f83\u597d\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u8bfe\u7a0b\u4e2d\u540e\u671f\uff08\u7b2c4-6\u5468\uff09**\u3002\u5f53\u8bfe\u7a0b\u5185\u5bb9\u52a0\u6df1\u3001\u4f5c\u4e1a\u590d\u6742\u5ea6\u589e\u52a0\uff0c\u800c\u4ed6\u7684\u5de5\u4f5c\u65f6\u95f4\u51b2\u7a81\u65e0\u6cd5\u7f13\u89e3\u65f6\uff0c\u7d2f\u79ef\u7684\u5b66\u4e1a\u538b\u529b\u53ef\u80fd\u5bfc\u81f4\u5176\u56e0\u201c\u65f6\u95f4\u7cbe\u529b\u4e0d\u6d4e\u201d\u800c\u6084\u7136\u6389\u961f\u6216\u9000\u51fa\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6cfd\uff0c\u770b\u4f60\u5de5\u4f5c\u8282\u594f\u8fd9\u4e48\u6ee1\u8fd8\u575a\u6301\u5b66\u4e60\uff0c\u662f\u771f\u7231\u4e86\u3002\u54b1\u4eec\u8bfe\u7a0b\u6240\u6709\u76f4\u64ad\u90fd\u6709\u56de\u653e\uff0c\u4f5c\u4e1a\u4e5f\u7ed9\u4f60\u7559\u8db3\u4e86\u7f13\u51b2\u671f\uff08\u6bd4\u5982\u5468\u672b\uff09\u3002\u4f60\u7684\u76ee\u6807\u662f\u624e\u5b9e\u7ec3\u597d\u624b\u827a\uff0c\u4e0d\u7528\u8ddf\u522b\u4eba\u6bd4\u901f\u5ea6\u3002\u9047\u5230\u4efb\u4f55\u5361\u70b9\uff0c\u968f\u65f6@\u6211\uff0c\u6211\u7ed9\u4f60\u2018\u624b\u628a\u624b\u2019\u62c6\u89e3\uff0c\u4fdd\u8bc1\u4e0d\u8ba9\u4f60\u56e0\u4e3a\u65f6\u95f4\u95ee\u9898\u6389\u961f\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u91cd\u70b9\u63d0\u4f9bAU\u5904\u7406\u3001\u8bbe\u5907\u9009\u62e9\uff08\u5982MK4\uff09\u3001\u8bd5\u97f3\u8981\u70b9\u3001\u540e\u671f\u5236\u4f5c\u7b49\u786c\u6838\u6280\u80fd\u6307\u5bfc\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\u7684\u7279\u70b9\uff0c\u8865\u5145**\u3010\u65f6\u95f4\u7ba1\u7406\u8f85\u52a9\u5305\u3011**\uff08\u5982\uff1a\u5468\u672b\u5b66\u4e60\u4efb\u52a1\u5305\u3001\u901a\u52e4\u53ef\u542c\u7684\u97f3\u9891\u77e5\u8bc6\u70b9\u603b\u7ed3\u3001\u5173\u952e\u64cd\u4f5c\u5f55\u5c4f\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u8981\u7528\u201c\u5212\u6c34\u201d\u3001\u201c\u4e0d\u52aa\u529b\u201d\u7b49\u8a00\u8bed\u65bd\u538b**\u3002\u4ed6\u7684\u65f6\u95f4\u7d27\u5f20\u662f\u5ba2\u89c2\u4e8b\u5b9e\uff0c\u65bd\u538b\u4f1a\u5f15\u53d1\u62b5\u89e6\u3002\n    2. **\u7edd\u4e0d\u8981\u753b\u201c\u5feb\u901f\u66b4\u5bcc\u201d\u7684\u5927\u997c**\u3002\u4ed6\u7684\u9700\u6c42\u662f\u4e13\u4e1a\u6210\u957f\uff0c\u865a\u5047\u627f\u8bfa\u4f1a\u7834\u574f\u4fe1\u4efb\u3002\n    3. **\u907f\u514d\u5728\u975e\u5de5\u4f5c\u65f6\u95f4\u9891\u7e41\u50ac\u4fc3**\u3002\u5c0a\u91cd\u5176\u5de5\u4f5c\u8282\u594f\uff0c\u6c9f\u901a\u96c6\u4e2d\u5728\u5348\u4f11\u6216\u665a\u95f4\u5176\u4e3b\u52a8\u51fa\u73b0\u65f6\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u8c28\u614e\u63a8\u4ecb\u4e0e\u786c\u6838\u6280\u80fd\u6df1\u5ea6\u7ed1\u5b9a\u7684\u9ad8\u9636\u8bfe\u7a0b**\uff08\u5982\u540e\u671f\u7cbe\u4fee\u3001\u9ad8\u7ea7\u6f14\u64ad\u8bfe\uff09\u3002\u56e0\u5176\u52a8\u673a\u7eaf\u6b63\u4e14\u8ffd\u6c42\u4e13\u4e1a\uff0c\u5728\u5efa\u7acb\u8db3\u591f\u4fe1\u4efb\u548c\u770b\u5230\u5176\u8fdb\u6b65\u540e\uff0c\u6709\u9488\u5bf9\u6027\u7684\u5347\u5355\u662f\u53ef\u884c\u7684\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u73b0\u9636\u6bb5\u662f\u4e0d\u662f\u62a5\u5206\u6210\u4e66\u5c31\u4e00\u70b9\u4e0d\u4f1a\u88ab\u9009\u4e2d...\u60f3\u62ff\u5206\u6210\u4e66\u5f53\u5f55\u97f3\u70b9\u8bc4\u7528\u201d **(\u9ad8\u52a8\u673a\u7eaf\u5ea6\uff0c\u4e3a\u7ec3\u4e60\u800c\u6765)**\n2. > \u201c\u5de5\u4f5c\u65f6\u95f4\u65e9\u5341\u665a\u4e5d\u70b9\u534a\u901a\u52e4\u4e00\u4e24\u4e2a\u5c0f\u65f6...\u6211\u5e94\u8be5\u5c31\u5468\u672b\u6709\u70b9\u65f6\u95f4\u201d **(\u8d44\u6e90\u5e95\u5ea7\u6838\u5fc3\u77ed\u677f\uff1a\u65f6\u95f4)**\n3. > \u201c\u8001\u677f\u5e78\u798f\u4e86\u5458\u5de5\u725b\u9a6c\u4e86\u201d **(\u6df1\u5c42\u9700\u6c42\uff1a\u5bfb\u6c42\u4e3b\u4e1a\u5916\u7684\u4ef7\u503c\u8ba4\u53ef\u4e0e\u5c0a\u91cd)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2\u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u9ad8\u5ea6\u9002\u914d\u5176\u788e\u7247\u5316\u65f6\u95f4\u7684\u786c\u6838\u6280\u80fd\u652f\u6301\u4e0e\u7075\u6d3b\u7684\u4efb\u52a1\u7ba1\u7406\uff0c\u907f\u514d\u65f6\u95f4\u6324\u538b\u5bfc\u81f4\u7684\u5b66\u4e60\u5d29\u76d8**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"maslow_need\": \"\u5c0a\u91cd\u9700\u6c42/\u81ea\u6211\u5b9e\u73b0\", \"risk_level\": \"\u4e2d\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u65f6\u95f4\u7ba1\u7406\u8f85\u52a9\u5305\"}\n```";
