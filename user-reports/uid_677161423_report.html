    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n> **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4e3a\u4f53\u9a8c\u8425\u671f\u95f4\u9500\u552e\u8ddf\u8fdb\u8fc7\u7a0b\uff0c\u7f3a\u5931\u7528\u6237**\u652f\u4ed8\u80fd\u529b\u8be6\u60c5\u3001\u5bb6\u5ead\u80cc\u666f\u3001\u804c\u4e1a\u72b6\u6001\u3001\u5177\u4f53\u53ef\u7528\u65f6\u95f4**\u7b49\u5173\u952e\u4fe1\u606f\uff0c\u5bf9\u8d44\u6e90\u5e95\u5ea7\u548c\u5fc3\u7406\u5f39\u6027\u7684\u8bc4\u4f30\u5b58\u5728\u63a8\u6d4b\u6210\u5206\u3002\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677161423 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5e03\u4e01/\u516d\u6708\u6668\u516e(\u5218\u519b) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u9ad8\u9636\u73ed\uff08\u4e24\u4e2a\u6708\u7cfb\u7edf\u8bfe\uff0c\u4ef7\u683c2380\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u88ab\u8feb\u5206\u671f** (\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u8d44\u91d1\u4e0d\u591f\u201d\uff0c\u4ec5\u652f\u4ed8400\u5143\uff0c\u5e76\u8ba1\u5212\u201c\u4ee5\u540e\u6709\u94b1\u518d\u8865\u201d) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | [\u4fe1\u606f\u7f3a\u5931] \u4ece\u5bf9\u8bdd\u54cd\u5e94\u770b\uff0c\u80fd\u8ddf\u4e0a\u6bcf\u65e5\u5b66\u4e60\u4efb\u52a1\uff0c\u65f6\u95f4\u5b89\u6392\u5c1a\u53ef\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | [\u4fe1\u606f\u7f3a\u5931] \u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u4fe1\u606f\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** - \u7f3a\u4e4f\u4e2a\u4eba\u80cc\u666f\u3001\u7ecf\u6d4e\u72b6\u51b5\u3001\u5bb6\u5ead\u652f\u6301\u5ea6\u7b49\u5173\u952e\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34(\u4e2d) - \u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6709\u58f0\u884c\u4e1a\u7684\u5174\u8da3\u548c\u5b66\u4e60\u7684\u4e3b\u52a8\u6027\uff0c\u4f46**\u652f\u4ed8\u884c\u4e3a\u66b4\u9732\u5176\u7ecf\u6d4e\u538b\u529b**\uff0c\u641e\u94b1\u52a8\u673a\u4e0e\u5f53\u524d\u652f\u4ed8\u80fd\u529b\u5b58\u5728\u77db\u76fe\uff0c\u66f4\u50cf\u662f\u5728\u63a2\u7d22\u4e00\u4e2a\u53ef\u80fd\u7684\u526f\u4e1a\u65b9\u5411\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5f53\u7136\u60f3\uff0c\u6211\u4f1a\u52aa\u529b\u4e89\u53d6\u7684\u201d (\u5bf9\u5165\u884c\u8868\u6001)\uff1b> \u201c\u8d44\u91d1\u4e0d\u591f\uff0c\u4ee5\u540e\u6709\u94b1\u518d\u8865\u201d (\u652f\u4ed8\u65f6\u5766\u767d)\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u2b07\u4f4e** \u2014 \u660e\u786e\u8868\u793a\u201c\u8d44\u91d1\u4e0d\u591f\u201d\uff0c\u53ea\u80fd\u652f\u4ed8400\u5143\u5206\u671f\u6b3e\uff0c\u540e\u7eed\u8865\u6b3e\u80fd\u529b\u5b58\u7591\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u27a1\u4e2d** \u2014 \u80fd\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u89c2\u770b\u76f4\u64ad\u3001\u53c2\u4e0e\u4e92\u52a8\uff0c\u5b66\u4e60\u914d\u5408\u5ea6\u9ad8\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u4fe1\u606f\u7f3a\u5931]** \u2014 \u5b8c\u5168\u672a\u63d0\u53ca\uff0c\u65e0\u6cd5\u8bc4\u4f30\uff0c\u6309\u6700\u77ed\u677f\u539f\u5219\uff0c\u6b64\u7ef4\u5ea6\u4fe1\u606f\u7f3a\u5931\u6784\u6210\u91cd\u5927\u98ce\u9669\uff0c\u8bc4\u7ea7\u5411\u4e0b\u951a\u5b9a\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u9700\u95f4\u6b47\u6027\u5b89\u629a(\u4e2d) - \u7528\u6237\u6001\u5ea6\u79ef\u6781\u3001\u914d\u5408\uff0c\u80fd\u4e3b\u52a8\u63d0\u95ee\uff08\u5982\u95ee\u8bd5\u97f3\u7ec6\u8282\uff09\uff0c\u5e76\u63a5\u53d7\u6307\u5bfc\u3002\u672a\u8868\u73b0\u51fa\u6781\u7aef\u60c5\u7eea\uff0c\u4f46**\u652f\u4ed8\u65f6\u7684\u72b9\u8c6b\u548c\u5206\u671f\u884c\u4e3a**\u6697\u793a\u5176\u51b3\u7b56\u53ef\u80fd\u53d7\u7ecf\u6d4e\u538b\u529b\u5f71\u54cd\uff0c\u5b58\u5728\u6f5c\u5728\u8106\u5f31\u6027\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5e08\u59d0\u6211\u80fd\u95ee\u95ee\uff0c\u5982\u679c\u540e\u671f\u60f3\u88654\u4e2a\u6708\u7684\u8bdd\uff0c\u627e\u8c01\u53bb\u62a5\u540d\u5462\u201d (\u8868\u73b0\u51fa\u5bf9\u672a\u6765\u7684\u89c4\u5212\uff0c\u4f46\u524d\u63d0\u662f\u201c\u7b49\u94b1\u591f\u4e86\u201d)\uff1b> \u201c\u5e08\u59d0\uff0c\u4f60\u770b\u6211\u8fd9\u6837\u8bfb\u6709\u6548\u679c\u5417\u201d (\u4e3b\u52a8\u5bfb\u6c42\u53cd\u9988\uff0c\u6709\u4e0a\u8fdb\u5fc3)\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9**\u672a\u6765\u7ecf\u6d4e\u72b6\u51b5\u7684\u7126\u8651**\u548c**\u5bf9\u81ea\u8eab\u80fd\u529b\u80fd\u5426\u53d8\u73b0\u7684\u4e0d\u786e\u5b9a\u6027**\u3002\u4ed6\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u4e00\u9879\u6280\u80fd\u83b7\u5f97\u989d\u5916\u6536\u5165\u4fdd\u969c\uff0c\u4f46\u5f53\u524d\u7ecf\u6d4e\u80fd\u529b\u53c8\u9650\u5236\u4e86\u5176\u6295\u5165\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u786e\u5b9a\u6027\u201d\u548c\u201c\u5c0f\u6b65\u6b63\u53cd\u9988\u201d**\u3002\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u5b9e\u73b0\u7684\u77ed\u671f\u63a5\u5355\u8def\u5f84\uff0c\u7528\u5fae\u5c0f\u7684\u6210\u529f\uff08\u5982\u5b8c\u6210\u4f5c\u4e1a\u83b7\u5f97\u8868\u626c\u3001\u7406\u89e3\u4e00\u4e2a\u6280\u5de7\uff09\u4e0d\u65ad\u5f3a\u5316\u5176\u201c\u6211\u80fd\u884c\u201d\u3001\u201c\u8fd9\u6761\u8def\u8d70\u5f97\u901a\u201d\u7684\u4fe1\u5fc3\uff0c\u5bf9\u51b2\u5176\u56e0\u7ecf\u6d4e\u538b\u529b\u4ea7\u751f\u7684\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1** \u7c7b (\u52a8\u673a\u5c1a\u53ef\u4f46\u8d44\u6e90\u5e95\u5ea7\u8584\u5f31\uff0c\u652f\u4ed8\u80fd\u529b\u662f\u660e\u663e\u77ed\u677f) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u578b** (\u6838\u5fc3\u8bc9\u6c42\u662f\u53d8\u73b0\uff0c\u4f46\u53d7\u9650\u4e8e\u5f53\u524d\u8d44\u6e90\uff0c\u5904\u4e8e\u201c\u60f3\u641e\u94b1\u4f46\u672c\u94b1\u4e0d\u8db3\u201d\u7684\u8bd5\u63a2\u9636\u6bb5) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u867d\u7ecf\u6d4e\u7d27\u5f20\u5e76\u5206\u671f\u652f\u4ed8\uff0c\u4f46\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5ead\u51b2\u7a81\u7684\u76f4\u63a5\u8bc1\u636e\u3002**\u9700\u8b66\u60d5\u540e\u7eed\u56e0\u7ecf\u6d4e\u538b\u529b\u65e0\u6cd5\u7eed\u8d39\u6216\u4ea7\u751f\u6536\u76ca\u843d\u5dee\u800c\u5f15\u53d1\u7684\u9000\u8d39\u98ce\u9669\u3002**\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u7ecf\u6d4e\u7d27\u5f20\u53ef\u80fd\u6d89\u53ca\u5bb6\u5ead\u5f00\u652f\uff0c\u5b58\u5728\u9690\u7792\u6216\u4e8b\u540e\u88ab\u5bb6\u4eba\u53d1\u73b0\u7684\u98ce\u9669\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u76ee\u524d\u5b66\u4e60\u914d\u5408\u5ea6\u9ad8\uff0c\u65f6\u95f4\u7ba1\u7406\u5c1a\u53ef\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4e2d** | \u7ecf\u6d4e\u538b\u529b\u672c\u8eab\u662f\u60c5\u7eea\u538b\u529b\u6e90\uff0c\u82e5\u5b66\u4e60\u9047\u5230\u74f6\u9888\u6216\u77ed\u671f\u672a\u89c1\u5230\u6536\u76ca\uff0c\u53ef\u80fd\u53e0\u52a0\u7126\u8651\u5bfc\u81f4\u653e\u5f03\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u7528\u6237\u4e3a\u201c\u641e\u94b1\u201d\u800c\u6765\uff0c\u82e5\u5728\u8bfe\u7a0b\u4e2d\u671f\uff08\u59821-2\u4e2a\u6708\u540e\uff09\u53d1\u73b0\u63a5\u5355\u56f0\u96be\u3001\u6536\u76ca\u8fdc\u4f4e\u4e8e\u9884\u671f\u6216\u4e0e\u9500\u552e\u627f\u8bfa\u4e0d\u7b26\uff0c\u6781\u6613\u56e0\u201c\u6295\u5165\u4ea7\u51fa\u6bd4\u5931\u8861\u201d\u800c\u8981\u6c42\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c4-8\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u8bfe\u7a0b\u96be\u5ea6\u53ef\u80fd\u63d0\u5347\uff0c\u7528\u6237\u5bf9\u53d8\u73b0\u7684\u671f\u5f85\u8fbe\u5230\u9876\u5cf0\uff0c\u82e5\u672a\u80fd\u83b7\u5f97\u4efb\u4f55\u5b9e\u8d28\u6027\u7684\u63a5\u5355\u673a\u4f1a\u6216\u5fae\u5c0f\u6536\u76ca\uff0c\u9000\u8d39\u98ce\u9669\u6025\u5267\u5347\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u770b\u5230\u4f60\u5b66\u4e60\u8fd9\u4e48\u8ba4\u771f\uff0c\u6bcf\u4e00\u6b65\u90fd\u8ddf\u5f97\u5f88\u7d27\uff0c\u5e08\u59d0\u7279\u522b\u4e3a\u4f60\u9ad8\u5174\u3002\u54b1\u4eec\u4e0d\u7740\u6025\uff0c\u5148\u628a\u8fd9\u4e24\u4e2a\u6708\u7684\u2018\u57fa\u672c\u529f\u2019\u6253\u624e\u5b9e\u3002\u5f88\u591a\u5e08\u5144\u5e08\u59d0\u90fd\u662f\u4ece\u7b2c\u4e00\u672c\u7248\u6743\u4e66\u3001\u7b2c\u4e00\u4e2a\u5c0f\u5355\u5b50\u6162\u6162\u505a\u8d77\u6765\u7684\u3002\u6211\u4f1a\u5e2e\u4f60\u76ef\u7740\u9002\u5408\u65b0\u624b\u7684\u8bd5\u97f3\u673a\u4f1a\uff0c\u54b1\u4eec\u5148\u62ff\u4e0b\u7b2c\u4e00\u4e2a\u6210\u679c\uff0c\u5efa\u7acb\u4fe1\u5fc3\u6700\u91cd\u8981\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5feb\u901f\u63a5\u5355\u7ebf**\u3011\u3002\u6838\u5fc3\u662f\u63d0\u4f9b**\u4f4e\u95e8\u69db\u3001\u6613\u4e0a\u624b\u3001\u53cd\u9988\u5feb**\u7684\u5fae\u4efb\u52a1\u6216\u8bd5\u97f3\u673a\u4f1a\uff0c\u54ea\u6015\u5355\u4ef7\u4e0d\u9ad8\uff0c\u65e8\u5728\u5feb\u901f\u5efa\u7acb\u201c\u6211\u80fd\u8d5a\u94b1\u201d\u7684\u6b63\u5411\u5faa\u73af\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u7ecf\u6d4e\u7126\u8651\u548cT4\u539f\u578b\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a\u3010**\u7ecf\u6d4e\u578b\u5b66\u4e60\u652f\u6301\u5305**\u3011\uff08\u5982\u7075\u6d3b\u7684\u5b66\u4e60\u8ba1\u5212\u3001\u91cd\u70b9\u6280\u80fd\u62c6\u89e3\uff09\u548c\u3010**\u65e9\u671f\u53d8\u73b0\u5f15\u5bfc\u5305**\u3011\uff08\u660e\u786e\u544a\u77e5\u524d2\u4e2a\u6708\u53ef\u80fd\u7684\u5b66\u4e60\u6210\u679c\u548c\u63a5\u5355\u9884\u671f\uff0c\u7ba1\u7406\u5176\u671f\u671b\u503c\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u8fc7\u5ea6\u63cf\u7ed8\u201c\u8f7b\u677e\u6708\u5165\u8fc7\u4e07\u201d\u7684\u84dd\u56fe\uff1b\u5728\u5176\u8868\u8fbe\u7ecf\u6d4e\u538b\u529b\u65f6\uff0c\u5f3a\u884c\u63a8\u8350\u66f4\u6602\u8d35\u7684\u957f\u671f\u8bfe\u7a0b\uff08\u59824\u4e2a\u6708\u8bfe\u7a0b\uff09\uff1b\u5ffd\u89c6\u5176\u4f5c\u4e1a\u53cd\u9988\uff0c\u8ba9\u5176\u611f\u89c9\u6295\u5165\u6ca1\u6709\u8fdb\u6b65\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u7528\u6237\u7ecf\u6d4e\u72b6\u51b5\u672a\u6539\u5584\u524d\u8fdb\u884c\u5927\u989d\u5347\u5355\u63a8\u4ecb**\u3002\u53ef\u5173\u6ce8\u5176\u5b66\u4e60\u8fdb\u5c55\u548c\u5fae\u5c0f\u53d8\u73b0\u6210\u679c\uff0c\u5f85\u5176\u4fe1\u5fc3\u548c\u8d44\u91d1\u6709\u6240\u79ef\u7d2f\u540e\uff0c\u518d\u8c28\u614e\u63a2\u8ba8\u8fdb\u9636\u53ef\u80fd\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > **\u201c\u8d44\u91d1\u4e0d\u591f\uff0c\u4ee5\u540e\u6709\u94b1\u518d\u8865\u201d** (\u76f4\u63a5\u66b4\u9732\u652f\u4ed8\u80fd\u529b\u77ed\u677f\u548c\u5f53\u524d\u7ecf\u6d4e\u538b\u529b)\n2. > **\u201c\u5e08\u59d0\u6211\u80fd\u95ee\u95ee\uff0c\u5982\u679c\u540e\u671f\u60f3\u88654\u4e2a\u6708\u7684\u8bdd\uff0c\u627e\u8c01\u53bb\u62a5\u540d\u5462\u201d** (\u8868\u660e\u6709\u957f\u671f\u5b66\u4e60\u610f\u613f\uff0c\u4f46\u524d\u63d0\u662f\u201c\u7b49\u94b1\u591f\u4e86\u201d\uff0c\u613f\u671b\u4e0e\u73b0\u5b9e\u5b58\u5728\u77db\u76fe)\n3. > **\u201c\u603b\u4f53\u4e0b\u6765\u7ed9\u6211\u7684\u611f\u89c9\u5c31\u662f\u633a\u597d\u73a9\u7684\uff0c\u89d2\u8272\u626e\u6f14\u3002\u201d** (\u5b66\u4e60\u52a8\u673a\u4e2d\u5305\u542b\u5174\u8da3\u548c\u63a2\u7d22\u6210\u5206\uff0c\u5e76\u975e\u7eaf\u7cb9\u7684\u751f\u5b58\u538b\u529b\u9a71\u52a8)\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4\u641e\u94b1\u7ed3\u679c\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u7ecf\u6d4e\u4e0a\u7684\u5b89\u5168\u611f\u548c\u4fdd\u969c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5728\u8bfe\u7a0b\u65e9\u671f\u63d0\u4f9b\u660e\u786e\u7684\u3001\u53ef\u8fbe\u6210\u7684\u5fae\u5c0f\u53d8\u73b0\u673a\u4f1a\uff0c\u7528\u201c\u5c0f\u6210\u529f\u201d\u5582\u517b\u5176\u4fe1\u5fc3\uff0c\u4e25\u683c\u7ba1\u7406\u5176\u6536\u76ca\u9884\u671f\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf\"}\n```";
