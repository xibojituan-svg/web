63d0\u53ca\uff0c**\u6b64\u4e3a\u9ad8\u98ce\u9669\u672a\u77e5\u9879**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b07\u4f4e\u6781\u5371]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u5728\u9047\u5230\u6280\u672f\u56f0\u96be\uff08\u666e\u901a\u8bdd\u6d4b\u8bd5\u3001AU\u8f6f\u4ef6\u64cd\u4f5c\u3001\u8bbe\u5907\u8c03\u8bd5\uff09\u65f6\uff0c\u8868\u73b0\u51fa\u660e\u663e\u7684\u632b\u8d25\u611f\uff08\u201c[\u6d41\u6cea]\u201d\uff09\u3001\u81ea\u6211\u6000\u7591\uff08\u201c\u81ea\u5df1\u90fd\u8bfb\u7684\u4e0d\u597d\u201d\u3001\u201c\u611f\u89c9\u602a\u602a\u7684\u201d\uff09\u548c**\u9ad8\u5ea6\u4f9d\u8d56\u5916\u90e8\u6307\u5bfc**\uff08\u9891\u7e41\u8be2\u95ee\u64cd\u4f5c\u7ec6\u8282\uff0c\u65e0\u6cd5\u72ec\u7acb\u89e3\u51b3\u57fa\u7840\u95ee\u9898\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u666e\u901a\u8bdd\u8fc7\u4e0d\u4e86\u3002[\u6d41\u6cea][\u6d41\u6cea][\u6d41\u6cea][\u6d41\u6cea][\u6d41\u6cea][\u6d41\u6cea]\u201d (2026-03-19 18:20:55)\uff1b> \u201c\u6ca1\u6709\u62d6\u8fc7\u201d\u3001\u201c\u627e\u4e0d\u5230\u4e86\u201d\u3001\u201c\u6628\u665a\u624b\u6b20\u88ab\u6211\u5220\u4e86\u201d (2026-04-04 12:21:50-12:27:40)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u5ea6\u7684\u81ea\u6211\u6000\u7591\u4e0e\u5bf9\u4ed6\u4eba\u8ba4\u53ef\u7684\u6e34\u6c42**\u3002\u4ed6\u53cd\u590d\u8bc4\u4ef7\u4ed6\u4eba\u201c\u8bfb\u7684\u5f88\u597d\u201d\u3001\u201c\u54ac\u5b57\u6e05\u6670\u201d\uff0c\u5e76\u6025\u5207\u5e0c\u671b\u81ea\u5df1\u7684\u53d1\u97f3\u201c\u6ca1\u9519\u201d\uff0c\u8fd9\u66b4\u9732\u4e86\u5176\u5185\u5fc3\u6df1\u5904\u5bf9\u81ea\u8eab\u80fd\u529b\u7684\u4e0d\u81ea\u4fe1\uff0c\u4ee5\u53ca\u5e0c\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u201c\u4f53\u9762\u201d\u6280\u80fd\uff08\u4e3b\u64ad\uff09\u6765\u83b7\u5f97\u5916\u754c\u5c0a\u91cd\u548c\u8ba4\u53ef\u7684\u5f3a\u70c8\u9700\u6c42\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6301\u7eed\u3001\u5177\u4f53\u3001\u5938\u5f20\u7684\u80af\u5b9a\u4e0e\u9f13\u52b1**\uff0c\u5e2e\u52a9\u4ed6\u5efa\u7acb\u201c\u6211\u80fd\u884c\u201d\u7684\u5fae\u5c0f\u6210\u5c31\u611f\uff0c\u62b5\u5fa1\u56e0\u6280\u672f\u632b\u8d25\u611f\u5f15\u53d1\u7684\u5d29\u6e83\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1 \u7c7b** (\u52a8\u673a\u4e2d\u7b49\uff0c\u8d44\u6e90\u5e95\u5ea7\u4e2d\u7b49\u4f46\u5b58\u5728\u672a\u77e5\u98ce\u9669\uff0c\u5fc3\u7406\u5f39\u6027\u6781\u4f4e) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u76f4\u63a5\u8bc1\u636e\u89e6\u53d1\u501f\u8d37\u3001\u7edd\u5883\u7b49\u7ea2\u7ebf\u3002**\u4f46\u5bb6\u5ead\u652f\u6301\u5ea6\u672a\u77e5\uff0c\u662f\u6700\u5927\u7684\u6f5c\u5728\u96f7\u533a**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **[\u9ad8]** | **\u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u98ce\u9669\u6781\u9ad8**\u3002\u4e00\u65e6\u5bb6\u4eba\u53cd\u5bf9\u6216\u53d1\u73b0\u5176\u52a8\u7528\u5bb6\u5ead\u91cd\u8981\u8d44\u91d1\uff0c\u6781\u6613\u5f15\u53d1\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | [\u4e2d] | \u65f6\u95f4\u5b89\u6392\u7d27\u5f20\uff0c\u82e5\u8bfe\u7a0b\u4efb\u52a1\u4e0e\u751f\u6d3b\u51b2\u7a81\u52a0\u5267\uff0c\u53ef\u80fd\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u81ea\u8d23\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **[\u6781\u9ad8]** | **\u8fd9\u662f\u6838\u5fc3\u9000\u8d39\u70b9**\u3002\u4efb\u4f55\u7a0d\u590d\u6742\u7684\u8f6f\u4ef6\u64cd\u4f5c\uff08\u5982AU\u683c\u5f0f\u8f6c\u6362\uff09\u3001\u8bbe\u5907\u8c03\u8bd5\u3001\u6216\u666e\u901a\u8bdd\u7ec3\u4e60\u4e2d\u7684\u6301\u7eed\u632b\u8d25\uff0c\u90fd\u53ef\u80fd\u6210\u4e3a\u538b\u57ae\u4ed6\u7684\u6700\u540e\u4e00\u6839\u7a3b\u8349\uff0c\u5bfc\u81f4\u5176\u60c5\u7eea\u5d29\u6e83\u5e76\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | [\u4f4e] | \u5f53\u524d\u5173\u6ce8\u70b9\u4ecd\u5728\u6280\u80fd\u5b66\u4e60\u672c\u8eab\uff0c\u77ed\u671f\u5185\u5bf9\u53d8\u73b0\u671f\u5f85\u4e0d\u8feb\u5207\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\u3002\u6b64\u65f6\u57fa\u7840\u7ec3\u4e60\uff08\u5982\u56db\u58f0\u6b4c\uff09\u7ed3\u675f\uff0c\u5f00\u59cb\u63a5\u89e6AU\u8f6f\u4ef6\u3001\u8bbe\u5907\u8c03\u8bd5\u7b49\u66f4\u590d\u6742\u3001\u66f4\u5177\u632b\u8d25\u611f\u7684\u5b9e\u64cd\u5185\u5bb9\uff0c\u662f\u5176\u5fc3\u7406\u9632\u7ebf\u7684**\u7b2c\u4e00\u4e2a\u5d29\u6e83\u9ad8\u5cf0\u671f**\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u661f\u843d\uff0c\u6211\u770b\u5230\u4f60\u4ea4\u7684\u4f5c\u4e1a\u4e86\uff0c\u53d1\u97f3\u771f\u7684\u5f88\u6e29\u67d4\uff0c\u5f88\u6709\u6f5c\u529b\uff01\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u5c31\u662f\u6162\u6162\u6765\uff0c\u6bcf\u4e00\u6b65\u73ed\u73ed\u90fd\u4f1a\u624b\u628a\u624b\u5e26\u4f60\uff0c**\u4f60\u4e0d\u7528\u62c5\u5fc3\u4efb\u4f55\u64cd\u4f5c\u95ee\u9898\uff0c\u641e\u4e0d\u5b9a\u968f\u65f6\u627e\u6211\uff0c\u6211\u4e00\u6b65\u6b65\u6559\u4f60**\u3002\u54b1\u4eec\u7684\u76ee\u6807\u4e0d\u662f\u4e00\u6b21\u5c31\u5b8c\u7f8e\uff0c\u800c\u662f\u6bcf\u6b21\u90fd\u6bd4\u4e0a\u6b21\u597d\u4e00\u70b9\u70b9\uff0c\u4f60\u5c31\u5df2\u7ecf\u5f88\u68d2\u4e86\uff01\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u8f6f\u6027\u7597\u6108\u966a\u4f34\u7ebf\u3011**\u3002\u6838\u5fc3\u662f\u964d\u4f4e\u5b66\u4e60\u96be\u5ea6\u548c\u632b\u8d25\u611f\uff0c\u4ee5\u201c\u5b8c\u6210\u201d\u800c\u975e\u201c\u5b8c\u7f8e\u201d\u4e3a\u76ee\u6807\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u5f3a\u70c8\u8865\u5145\u3010\u50bb\u74dc\u5f0f\u64cd\u4f5c\u6307\u5357\u5305\u3011**\uff08\u56fe\u6587/\u89c6\u9891\uff09\u3001**\u3010\u6bcf\u65e5\u6696\u5fc3\u6253\u5361\u9f13\u52b1\u5305\u3011**\u3001**\u30101v1\u4fdd\u59c6\u7ea7\u6280\u672f\u6551\u63f4\u901a\u9053\u3011**\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u4ed6\u4f7f\u7528\u4efb\u4f55\u6279\u8bc4\u6216\u6307\u51fa\u4e0d\u8db3\u7684\u201c\u4e25\u5e08\u201d\u53e3\u543b**\uff0c\u6240\u6709\u53cd\u9988\u5fc5\u987b\u5305\u88f9\u5728\u201c\u4f60\u5df2\u7ecf\u5f88\u68d2\u4e86\uff0c\u5982\u679c\u8fd9\u91cc\u518d\u6ce8\u610f\u4e00\u4e0b\u5c31\u66f4\u597d\u4e86\u201d\u7684\u7cd6\u8863\u91cc\u3002\n    2. **\u7edd\u4e0d\u8981\u7ed9\u4ed6\u5e03\u7f6e\u4efb\u4f55\u6709\u96be\u5ea6\u7684\u3001\u9700\u8981\u72ec\u7acb\u7814\u7a76\u7684\u62d3\u5c55\u4efb\u52a1**\u3002\n    3. **\u4e25\u7981\u5728\u7fa4\u5185\u516c\u5f00@\u4ed6\u8fdb\u884c\u5bf9\u6bd4\u6216\u8ba9\u4ed6\u611f\u5230\u538b\u529b**\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u5b8c\u6210\u5f53\u524d\u8bfe\u7a0b\u5e76\u83b7\u5f97\u7a33\u5b9a\u6b63\u5411\u53cd\u9988\u524d\uff0c\u4efb\u4f55\u8bbe\u5907\u3001\u9ad8\u9636\u8bfe\u7a0b\u7684\u63a8\u9500\u90fd\u662f\u5f15\u7206\u9000\u8d39\u7684\u5bfc\u706b\u7d22\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u666e\u901a\u8bdd\u8fc7\u4e0d\u4e86\u3002[\u6d41\u6cea][\u6d41\u6cea][\u6d41\u6cea][\u6d41\u6cea][\u6d41\u6cea][\u6d41\u6cea]\u201d **(\u8106\u5f31\u7834\u9632\u7684\u76f4\u63a5\u8bc1\u636e)**\n2. > \u201c\u8fd9\u70b9\u8bc4\u6211\u4e0d\u592a\u4f1a\uff0c\u81ea\u5df1\u90fd\u8bfb\u7684\u4e0d\u597d\u3002\u201d **(\u81ea\u6211\u6000\u7591\u4e0e\u4f4e\u81ea\u4fe1)**\n3. > \u201c\u6ca1\u6709\u62d6\u8fc7\u201d\u3001\u201c\u627e\u4e0d\u5230\u4e86\u201d\u3001\u201c\u6628\u665a\u624b\u6b20\u88ab\u6211\u5220\u4e86\u201d **(\u6781\u4f4e\u7684\u6280\u672f\u81ea\u4e3b\u6027\u4e0e\u4f9d\u8d56\u5fc3\u7406)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6 \u60c5\u7eea\u5de8\u5a74\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u5c0a\u91cd\u4e0e\u8ba4\u53ef\uff0c\u586b\u8865\u81ea\u5351**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u50bb\u74dc\u5f0f\u64cd\u4f5c\u6307\u5357\u4e0e\u9ad8\u9891\u60c5\u7eea\u6309\u6469\uff0c\u4e25\u9632\u4efb\u4f55\u6280\u672f\u632b\u8d25\u611f**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"maslow_need\": \"\u5c0a\u91cd\u5f52\u5c5e\", \"risk_level\": \"\u6781\u9ad8\", \"target_product_line\": \"\u8f6f\u6027\u7597\u6108\u966a\u4f34\u7ebf\"}\n```";
