    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 166894234 (\u6635\u79f0\uff1a\u6768\u67f3) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e-\u4e3b\u64ad\u516d\u6708\u6668\u516e\uff08\u949f\u6a1f\u73b2\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66/\u914d\u97f3\u8bfe\u7a0b (\u5df2\u652f\u4ed8400\u5143\u5b9a\u91d1/\u62a5\u540d\u8d39) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e** (\u4ec5\u89c1\u652f\u4ed8400\u5143\uff0c\u672a\u63d0\u53ca\u8d44\u91d1\u6765\u6e90\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u501f\u8d37\u6216\u5206\u671f) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u7528\u6237\u81ea\u8ff0\u4e3a\u5c0f\u5b66\u6821\u957f\uff0c\u9700\u52a0\u73ed\uff0c\u5b66\u4e60\u65f6\u95f4\u9700\u4ece\u5de5\u4f5c\u4e2d\u6324\u51fa) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e** (\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u5ea6) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49** (\u6709\u804c\u4e1a\u3001\u5730\u57df\u3001\u5b66\u4e60\u884c\u4e3a\u3001\u60c5\u7eea\u53cd\u9988\uff0c\u4f46\u7f3a\u4e4f\u8d44\u91d1\u3001\u5bb6\u5ead\u3001\u6df1\u5c42\u52a8\u673a\u4fe1\u606f) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (\u8bc4\u5206\uff1a5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\uff08\u6309\u65f6\u542c\u8bfe\u3001\u4ea4\u4f5c\u4e1a\u3001\u53cd\u590d\u7ec3\u4e60\uff09\uff0c\u4f46\u6838\u5fc3\u9a71\u52a8\u4e2d\u6df7\u6742\u4e86\u201c\u53d8\u73b0\u201d\u4e0e\u201c\u5174\u8da3/\u81ea\u6211\u63d0\u5347\u201d\u3002\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u53d8\u73b0\u201d\u3001\u201c\u63a5\u5355\u201d\u3001\u201c\u7b2c\u4e00\u6876\u91d1\u201d\uff0c\u7528\u6237\u672a\u8868\u73b0\u51fa\u72c2\u70ed\u8ffd\u9010\uff0c\u4e5f\u672a\u660e\u786e\u62d2\u7edd\uff0c\u800c\u662f\u805a\u7126\u4e8e\u5177\u4f53\u6280\u80fd\u63d0\u5347\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u5b66\u59d0\uff0c\u8c22\u8c22\u60a8\u7684\u4f53\u8d34\u3002\u55ef\uff0c\u6211\u73b0\u5728\u5728\u5916\u9762\u5462\uff0c\u55ef\uff0c\u4f60\u53d1\u7684\u90a3\u4e2a\u6587\u5b57\u6211\u770b\u5f97\u61c2\uff0c\u55ef\uff0c\u5c31\u662f\u5e94\u8be5\u662f\u6211\u8fd9\u4e2a\u8bed\u611f\u6709\u95ee\u9898\uff0c\u55ef\u3002\u55ef\uff0c\u6216\u8005\u662f\u55ef\u8fd9\u4e48\u8bf4\u5427\uff0c\u53ef\u80fd\u6211\u611f\u89c9\u5230\u4e86\u8981\uff0c\u6bd4\u5982\u8bf4\u50cf\u4f60\u8bf4\u7684\u8981\u8bfb\u51fa\u9057\u61be\u7684\u3001\u5931\u843d\u7684\u3001\u8fd9\u6cae\u4e27\u7684\u8fd9\u4e9b\u611f\u89c9\uff0c\u4f46\u662f\u597d\u50cf\uff0c\u6211\u7684\u8bed\u6c14\u7684\uff0c\u53ef\u80fd\uff0c\u5c31\u662f\u6211\u611f\u89c9\u8981\u8fd9\u6837\u8bfb\uff0c\u4f46\u662f\u6211\u7684\u8bed\u6c14\u91cc\u9762\uff0c\u53ef\u80fd\u8fd9\u6837\u7684\u611f\u89c9\uff0c\u8fd8\u4e0d\u591f\u3002\u201d (\u5173\u6ce8\u6280\u80fd\u7ec6\u8282)\n  > \u201c\u8fd9\u901a\u540e\u8003\u6838\u540e\u662fL2\u5417\u201d (\u5173\u6ce8\u8bfe\u7a0b\u4f53\u7cfb\u548c\u8fdb\u9636\u8def\u5f84\uff0c\u6709\u89c4\u5212\u610f\u8bc6)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d (\u8bc4\u5206\uff1a5-6\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 **\u8d44\u91d1\u627f\u8f7d\u529b**\uff1a**[\u4e2d]** \u2014 \u5df2\u652f\u4ed8400\u5143\uff0c\u4f46\u672a\u900f\u9732\u66f4\u591a\u8d22\u52a1\u4fe1\u606f\u3002\u804c\u4e1a\u4e3a\u5c0f\u5b66\u6821\u957f\uff0c\u63a8\u6d4b\u6709\u7a33\u5b9a\u6536\u5165\uff0c\u4f46\u9700\u7ed3\u5408\u540e\u7eed\u652f\u4ed8\u884c\u4e3a\uff08\u5982\u662f\u5426\u5168\u6b3e\uff09\u8fdb\u4e00\u6b65\u5224\u65ad\u3002\n- \u23f1 **\u65f6\u95f4\u4e0e\u7cbe\u529b**\uff1a**[\u4f4e]** \u2014 **\u6838\u5fc3\u77ed\u677f**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u6211\u662f\u4e00\u4e2a\u5c0f\u5b66\u6821\u957f\uff0c\u5b66\u6821\u73b0\u6709\u5de5\u4f5c\u8981\u53bb\u52a0\u73ed\u201d\uff0c\u8868\u660e\u5176\u65f6\u95f4\u88ab\u672c\u804c\u5de5\u4f5c\u9ad8\u5ea6\u5360\u7528\uff0c\u5b66\u4e60\u65f6\u95f4\u9700\u201c\u788e\u7247\u5316\u62fc\u51d1\u201d\uff0c\u7cbe\u529b\u6709\u9650\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 **\u5bb6\u5ead\u652f\u6301\u5ea6**\uff1a**[\u672a\u77e5]** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8 (\u8bc4\u5206\uff1a7-8\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u7528\u6237\u5728\u9047\u5230\u6280\u672f\u74f6\u9888\uff08\u201c\u4e00\u904d\u4e0d\u5982\u4e00\u904d\u201d\uff09\u65f6\uff0c\u80fd\u6e05\u6670\u63cf\u8ff0\u95ee\u9898\uff0c\u4e3b\u52a8\u5bfb\u6c42\u539f\u56e0\uff08\u201c\u8fd9\u662f\u600e\u4e48\u56de\u4e8b\u201d\uff09\uff0c\u5e76\u5728\u5f97\u5230\u6307\u5bfc\u540e\u8868\u793a\u201c\u6211\u4f1a\u52aa\u529b\u7684\u201d\u3002\u9762\u5bf9\u9500\u552e\u5bc6\u96c6\u7684\u50ac\u4fc3\u8fdb\u5ea6\uff0c\u80fd\u793c\u8c8c\u56de\u5e94\u5e76\u534f\u8c03\u65f6\u95f4\uff08\u201c\u665a\u4e0a\u518d\u7422\u78e8\u4e00\u4e0b\u201d\uff09\u3002**\u65e0\u81ea\u5351\u3001\u5d29\u6e83\u3001\u653e\u5f03\u7b49\u8d1f\u9762\u60c5\u7eea\u4fe1\u53f7\uff0c\u8868\u73b0\u51fa\u826f\u597d\u7684\u81ea\u6211\u8c03\u8282\u548c\u95ee\u9898\u89e3\u51b3\u5bfc\u5411\u3002**\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6668\u66e6\u5e08\u59d0\uff0c\u8fd9\u4e2a\u4e1c\u897f\u6211\u5f55\u4e8610\u51e0\u904d\uff0c\u7136\u540e\u6211\u53d1\u73b0\uff0c\u54ce\uff0c\u4e00\u904d\u4e0d\u5982\u4e00\u904d\uff0c\u4e5f\u5c31\u662f\u521a\u521a\u5f00\u59cb\u90a3\u4e00\u904d\uff0c\u5230\u6700\u540e\u6211\u542c\u5b8c\u4e4b\u540e\uff0c\u6211\u6211\u611f\u89c9\u521a\u521a\u5f00\u59cb\u90a3\u4e00\u904d\u53cd\u800c\u6bd4\u540e\u9762\u5f55\u7684\u8981\u597d\u3002\u8fd9\u662f\u600e\u4e48\u56de\u4e8b\u201d (\u7406\u6027\u5206\u6790\u95ee\u9898\uff0c\u4e3b\u52a8\u6c42\u52a9)\n  > \u201c\u591a\u8c22\uff0c\u6211\u4f1a\u52aa\u529b\u7684[\u62f3\u5934][\u62f3\u5934][\u62f3\u5934]\u201d (\u79ef\u6781\u56de\u5e94\uff0c\u6709\u884c\u52a8\u51b3\u5fc3)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e\u4e0e\u81ea\u6211\u5b9e\u73b0**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u4e13\u4e1a\u80fd\u529b\u63d0\u5347\u7684\u6e34\u671b\u4e0e\u73b0\u6709\u74f6\u9888\u4e4b\u95f4\u7684\u77db\u76fe**\u3002\u4f5c\u4e3a\u6559\u80b2\u5de5\u4f5c\u8005\uff08\u5c0f\u5b66\u6821\u957f\uff09\uff0c\u4ed6\u5929\u7136\u5bf9\u201c\u6559\u5b66\u201d\u548c\u201c\u8868\u8fbe\u201d\u6709\u9ad8\u6807\u51c6\uff0c\u4f46\u5728\u65b0\u9886\u57df\uff08\u6709\u58f0\u6f14\u64ad\uff09\u9047\u5230\u6280\u672f\u74f6\u9888\u65f6\uff0c\u4ea7\u751f\u4e86\u201c\u77e5\u9053\u611f\u89c9\u4f46\u8868\u8fbe\u4e0d\u51fa\u201d\u7684\u7126\u8651\uff0c\u8fd9\u672c\u8d28\u662f**\u5bf9\u4e13\u4e1a\u8eab\u4efd\u548c\u80fd\u529b\u8de8\u8d8a\u7684\u5c0a\u91cd\u9700\u6c42**\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u6df1\u5ea6\u8ba4\u540c\u4e0e\u201c\u4ea6\u5e08\u4ea6\u53cb\u201d\u7684\u63d0\u643a\u611f**\u3002\u9500\u552e\u79f0\u201c\u6211\u770b\u597d\u7684\u4eba\u5e76\u4e0d\u591a\uff0c\u4f46\u4f60\u662f\u5176\u4e2d\u4e00\u4e2a\u201d\u3001\u201c\u4f60\u6bd4\u6211\u90a3\u65f6\u5019\u5f55\u7684\u597d\u591a\u4e86\u201d\uff0c\u8fd9\u79cd\u6765\u81ea\u201c\u884c\u4e1a\u524d\u8f88\u201d\u7684\u8ba4\u53ef\uff0c\u7cbe\u51c6\u51fb\u4e2d\u4e86\u4ed6\u5bf9\u4e13\u4e1a\u80fd\u529b\u63d0\u5347\u548c\u83b7\u5f97\u5708\u5c42\u5c0a\u91cd\u7684\u6e34\u671b\u3002\u540e\u7eed\u201c\u4ee5\u540e\u8fd8\u8981\u5b66\u59d0\u591a\u591a\u63d0\u643a\u201d\u7684\u4e92\u52a8\uff0c\u4e5f\u5370\u8bc1\u4e86\u4ed6\u5bf9\u5efa\u7acb\u4e13\u4e1a\u8fde\u63a5\uff08\u5f52\u5c5e\uff09\u548c\u83b7\u5f97\u6307\u5bfc\uff08\u5b9e\u73b0\uff09\u7684\u671f\u5f85\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u9ad8\u52a8\u673a\u7eaf\u5ea6\u3001\u9ad8\u5fc3\u7406\u5f39\u6027\u3001\u8d44\u6e90\u5e95\u5ea7\u4e2d\u7b49\u4f46\u65f6\u95f4\u77ed\u677f\u660e\u663e\uff0c\u884c\u4e3a\u6a21\u5f0f\u7b26\u5408T2\u7279\u5f81) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 **\u5b89\u5168\u672a\u89e6\u53d1**\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u3001\u5bb6\u5ead\u53cd\u5bf9\u7b49\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u804c\u4e1a\u7a33\u5b9a\uff0c\u5bb6\u5ead\u8d22\u52a1\u98ce\u9669\u8f83\u4f4e\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u4e2d** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u65f6\u95f4\u788e\u7247\u5316\u4e25\u91cd\uff08\u6821\u957f+\u52a0\u73ed\uff09\u3002\u82e5\u8bfe\u7a0b\u8282\u594f\u8fc7\u5feb\u3001\u4f5c\u4e1a\u91cf\u8fc7\u5927\uff0c\u6781\u6613\u56e0\u5de5\u4f5c\u6324\u538b\u5bfc\u81f4\u5b66\u4e60\u8fdb\u5ea6\u843d\u540e\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u632b\u8d25\u611f\u548c\u6127\u759a\u611f\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u7406\u6027\u9762\u5bf9\u95ee\u9898\u5e76\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u52a8\u673a\u4e2d\u201c\u81ea\u6211\u5b9e\u73b0\u201d\u6210\u5206\u8f83\u9ad8\uff0c\u5bf9\u201c\u5feb\u901f\u53d8\u73b0\u201d\u7684\u671f\u671b\u76f8\u5bf9\u7406\u6027\uff0c\u66f4\u5173\u6ce8\u6280\u80fd\u6210\u957f\u8def\u5f84\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-4\u5468\u540e**\u3002\u5f53\u6b63\u5f0f\u8bfe\u7a0b\u5f00\u59cb\uff0c\u5b66\u4e60\u4efb\u52a1\u52a0\u91cd\uff0c\u4e0e\u672c\u804c\u5de5\u4f5c\u51b2\u7a81\u52a0\u5267\u65f6\uff0c\u82e5\u7f3a\u4e4f\u7075\u6d3b\u7684\u65f6\u95f4\u5b89\u6392\u548c\u6709\u6548\u7684\u8fdb\u5ea6\u7ba1\u7406\u652f\u6301\uff0c\u6781\u6613\u56e0\u201c\u65f6\u95f4\u7834\u4ea7\u201d\u800c\u6d41\u5931\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6768\u67f3\u6821\u957f\uff0c\u60a8\u597d\uff01\u770b\u5230\u60a8\u5728\u6559\u80b2\u884c\u4e1a\u6df1\u8015\uff0c\u5bf9\u8868\u8fbe\u548c\u6559\u5b66\u4e00\u5b9a\u6709\u5f88\u6df1\u7684\u7406\u89e3\u3002\u6211\u4eec\u7684\u8bfe\u7a0b\u8bbe\u8ba1\u4f1a\u5145\u5206\u8003\u8651\u5230\u50cf\u60a8\u8fd9\u6837\u65f6\u95f4\u5b9d\u8d35\u7684\u4e13\u4e1a\u4eba\u58eb\uff0c\u63d0\u4f9b\u7075\u6d3b\u7684\u5b66\u4e60\u8def\u5f84\u548c\u91cd\u70b9\u63d0\u70bc\u3002\u60a8\u6709\u4efb\u4f55\u65f6\u95f4\u5b89\u6392\u4e0a\u7684\u56f0\u96be\uff0c\u968f\u65f6\u548c\u6211\u6c9f\u901a\uff0c\u6211\u4eec\u4e00\u8d77\u89c4\u5212\uff0c\u786e\u4fdd\u60a8\u5b66\u6709\u6240\u6210\uff0c\u4e0d\u589e\u52a0\u989d\u5916\u8d1f\u62c5\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176T2\u8001\u9ec4\u725b\u7279\u8d28\uff0c\u63d0\u4f9b\u624e\u5b9e\u3001\u6709\u6df1\u5ea6\u7684\u6280\u80fd\u8bad\u7ec3\u548c\u6e05\u6670\u7684\u8fdb\u9636\u8def\u5f84\uff08\u5982\u4ed6\u5173\u5fc3\u7684\u201cL2\u201d\uff09\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n  1.  **\u3010\u65f6\u95f4\u5f39\u6027\u652f\u6301\u5305\u3011**\uff1a\u9488\u5bf9\u5176\u201c\u65f6\u95f4\u788e\u7247\u5316\u201d\u77ed\u677f\uff0c\u63d0\u4f9b\u5f55\u64ad\u56de\u770b\u6709\u6548\u671f\u5ef6\u957f\u3001\u4f5c\u4e1a\u63d0\u4ea4\u5f39\u6027\u7a97\u53e3\u3001\u91cd\u70b9\u96be\u70b9\u6458\u8981\u7b49\u670d\u52a1\u3002\n  2.  **\u3010\u6df1\u5ea6\u6280\u672f\u70b9\u8bc4\u5305 (B\u6a21\u5757)\u3011**\uff1a\u63d0\u4f9b\u4e13\u5bb61v1\u7b54\u7591\u548c\u5201\u94bb\u70b9\u8bc4\uff0c\u6ee1\u8db3\u5176\u5bf9\u4e13\u4e1a\u7cbe\u8fdb\u7684\u6e34\u671b\u3002\u9500\u552e\u5df2\u5efa\u7acb\u826f\u597d\u4fe1\u4efb\uff0c\u53ef\u65e0\u7f1d\u8f6c\u4ea4\u3002\n  3.  **\u3010\u8f7b\u91cf\u793e\u4ea4\u8fde\u63a5\u5305 (C\u6a21\u5757)\u3011**\uff1a\u5c06\u5176\u5f15\u5165\u7531\u540c\u7c7b\u201c\u9ad8\u77e5/\u4e13\u4e1a\u4eba\u58eb\u201d\u7ec4\u6210\u7684\u5c0f\u5708\u5b50\uff0c\u6ee1\u8db3\u5176\u5c0a\u91cd\u4e0e\u5f52\u5c5e\u611f\u9700\u6c42\uff0c\u4f46\u907f\u514d\u8fc7\u5ea6\u95f2\u804a\u6d88\u8017\u5176\u65f6\u95f4\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n  1.  \u7528\u201c\u5b9d\u5988/\u5b66\u751f\u515a\u90fd\u80fd\u5b66\u4f1a\u201d\u7b49\u8bdd\u672f\u77ee\u5316\u5176\u4e13\u4e1a\u8eab\u4efd\u3002\n  2.  \u7528\u5bc6\u96c6\u3001\u6b7b\u677f\u7684\u6253\u5361\u5236\u5ea6\u538b\u8feb\u5176\u672c\u5c31\u7d27\u5f20\u7684\u65f6\u95f4\uff0c\u5bfc\u81f4\u5176\u56e0\u201c\u8fdd\u7ea6\u201d\u800c\u4ea7\u751f\u8d1f\u7f6a\u611f\u3002\n  3.  \u8fc7\u5ea6\u63a8\u9500\u201c\u5feb\u901f\u66b4\u5bcc\u201d\u6848\u4f8b\uff0c\u8fd9\u4e0e\u5176\u7a33\u5065\u3001\u8ffd\u6c42\u4e13\u4e1a\u7684\u5f62\u8c61\u4e0d\u7b26\uff0c\u53ef\u80fd\u5f15\u53d1\u53cd\u611f\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u9700\u4e0e\u6280\u80fd\u6210\u957f\u8def\u5f84\u5f3a\u5173\u8054**\u3002\u5347\u5355\u8bdd\u672f\u5e94\u56f4\u7ed5\u201c\u89e3\u51b3\u60a8\u5f53\u524d\u9047\u5230\u7684XX\u6280\u672f\u74f6\u9888\u201d\u3001\u201c\u8fbe\u5230\u4e13\u4e1a\u7ea7XX\u6c34\u5e73\uff08\u5982L2\u8ba4\u8bc1\uff09\u201d\u3001\u201c\u83b7\u5f97XX\u5e73\u53f0\u4f18\u5148\u63a8\u8350\u8d44\u683c\u201d\u7b49\u4e13\u4e1a\u4ef7\u503c\u5c55\u5f00\uff0c\u800c\u975e\u5355\u7eaf\u5f3a\u8c03\u201c\u8d5a\u66f4\u591a\u94b1\u201d\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > **\u201c\u6211\u662f\u4e00\u4e2a\u5c0f\u5b66\u6821\u957f\uff0c\u5b66\u6821\u73b0\u6709\u5de5\u4f5c\u8981\u53bb\u52a0\u73ed[\u6342\u8138]\u3002\u201d** \u2014\u2014 **\u8d44\u6e90\u5e95\u5ea7\u6838\u5fc3\u77ed\u677f\uff08\u65f6\u95f4\uff09\u7684\u94c1\u8bc1\u3002**\n2. > **\u201c\u6668\u66e6\u5e08\u59d0\uff0c\u8fd9\u4e2a\u4e1c\u897f\u6211\u5f55\u4e8610\u51e0\u904d\uff0c\u7136\u540e\u6211\u53d1\u73b0\uff0c\u54ce\uff0c\u4e00\u904d\u4e0d\u5982\u4e00\u904d...\u8fd9\u662f\u600e\u4e48\u56de\u4e8b\u201d** \u2014\u2014 **T2\u8001\u9ec4\u725b\u7279\u8d28\uff1a\u4e0d\u8f7b\u6613\u653e\u5f03\uff0c\u9047\u5230\u95ee\u9898\u7406\u6027\u5206\u6790\u5e76\u4e3b\u52a8\u6c42\u52a9\u3002**\n3. > **\u201c\u591a\u8c22\uff0c\u6211\u4f1a\u52aa\u529b\u7684[\u62f3\u5934][\u62f3\u5934][\u62f3\u5934]\u201d** \u2014\u2014 **\u9ad8\u5fc3\u7406\u5f39\u6027\u548c\u79ef\u6781\u884c\u52a8\u529b\u7684\u4f53\u73b0\u3002**\n4. > **\u201c\u8fd9\u901a\u540e\u8003\u6838\u540e\u662fL2\u5417\u201d** \u2014\u2014 **\u5173\u6ce8\u4f53\u7cfb\u4e0e\u8fdb\u9636\uff0c\u52a8\u673a\u4e2d\u5305\u542b\u660e\u786e\u7684\u201c\u81ea\u6211\u5b9e\u73b0\u201d\u4e0e\u89c4\u5212\u610f\u8bc6\u3002**\n5. > **\u201c\u4ee5\u540e\u8fd8\u8981\u5b66\u59d0\u591a\u591a\u63d0\u643a[\u8c03\u76ae][\u8c03\u76ae]\u201d** \u2014\u2014 **\u5bfb\u6c42\u4e13\u4e1a\u5708\u5c42\u7684\u5c0a\u91cd\u3001\u5f52\u5c5e\u4e0e\u63d0\u643a\uff0c\u5370\u8bc1\u9a6c\u65af\u6d1b\u7b2c\u56db\u5c42\u9700\u6c42\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u9886\u57df\u7684\u5c0a\u91cd\u4e0e\u80fd\u529b\u7a81\u7834\uff08\u81ea\u6211\u5b9e\u73b0\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c**\u6838\u5fc3\u98ce\u9669\u70b9\u5728\u4e8e\u201c\u65f6\u95f4\u788e\u7247\u5316\u201d\u5bfc\u81f4\u7684\u5b66\u4e60\u5d29\u76d8**\u3002\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u81f4\u5f39\u6027\u7684\u65f6\u95f4\u652f\u6301\u4e0e\u6e05\u6670\u7684\u4e13\u4e1a\u6210\u957f\u8def\u5f84\uff0c\u7528\u201c\u6df1\u5ea6\u6280\u672f\u6307\u5bfc+\u5708\u5c42\u8ba4\u53ef\u201d\u9501\u6b7b\u5176\u5fe0\u8bda\u5ea6\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u65f6\u95f4\u5f39\u6027\u652f\u6301\u5305 + \u6df1\u5ea6\u6280\u672f\u70b9\u8bc4\u5305\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u6cb3\u5357\"}\n```";
