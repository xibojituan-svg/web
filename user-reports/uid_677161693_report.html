    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u738b\u6d9b (UID: 677161693) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u98ce\u542c\u96e82(\u738b\u6656) / \u79cb\u4e91(\u4f55\u9a8f) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u5199\u4f5c\u8bfe\uff08\u65d7\u8230\u73ed\uff0c4380\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u9884\u7b97\u6709\u9650\uff084000\u51fa\u5934\u4e0d\u5728\u9884\u7b97\u5185\uff09\uff0c\u6700\u7ec8\u9009\u62e9\u65d7\u8230\u8bfe\uff084380\u5143\uff09\uff0c\u652f\u4ed8\u65b9\u5f0f\u672a\u77e5\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u672a\u77e5\uff08\u804a\u5929\u8bb0\u5f55\u672a\u4f53\u73b0\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u672a\u77e5\uff08\u804a\u5929\u8bb0\u5f55\u672a\u4f53\u73b0\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e2d\u7b49\uff08\u6709\u4e92\u52a8\uff0c\u4f46\u5173\u952e\u4fe1\u606f\u5982\u65f6\u95f4\u3001\u5bb6\u5ead\u652f\u6301\u5ea6\u7f3a\u5931\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u53d8\u73b0\u6e20\u9053\u800c\u6765\u3002\u5173\u6ce8\u6295\u7a3f\u6e20\u9053\u3001\u5546\u5355\u5206\u914d\u3001\u7a3f\u8d39\u5206\u6210\u3001\u5b9e\u540d\u5236\u5f71\u54cd\u7b49\u5b9e\u64cd\u7ec6\u8282\uff0c\u800c\u975e\u5355\u7eaf\u201c\u51e0\u5929\u8d5a\u94b1\u201d\u3002\u6709\u660e\u786e\u7684\u526f\u4e1a\u53d8\u73b0\u76ee\u7684\uff0c\u4f46\u4f34\u968f\u5bf9\u884c\u4e1a\u89c4\u5219\u548c\u81ea\u8eab\u6761\u4ef6\uff08\u4f53\u5236\u5185\u8eab\u4efd\uff09\u7684\u5ba1\u614e\u8bc4\u4f30\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u6295\u7a3f\u5fc5\u987b\u5b9e\u540d\u5236\u5417\uff1f\u6211\u770b\u6f14\u793a\u7684\u767e\u5ea6\u6295\u7a3f\u7231\u5e73\u53f0\u597d\u50cf\u8981\u4e0a\u4f20\u8eab\u4efd\u8bc1\uff0c\u4f53\u5236\u5185\u5de5\u4f5c\uff0c\u6709\u70b9\u4e0d\u65b9\u4fbf\u201d\n> \u201c\u9884\u7ea6\u6210\u529f\u540e\uff0c\u6709\u7a3f\u8d39\u4e86\uff0c\u8981\u7ed9\u4f60\u4eec\u5206\u6210\u5417\u201d\n> \u201c\u7a3f\u8d39\u6216\u8005\u5956\u91d1\u8981\u4ea4\u7a0e\u5417\u201d\n> \u201c\u4e3b\u8981\u662f\u63d0\u793a\u8bcd\u548c\u6295\u7a3f\u6e20\u9053\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u660e\u786e\u8868\u793a\u65d7\u8230\u8bfe\u201c4000\u51fa\u5934\u201d\u4e0d\u5728\u9884\u7b97\u5185\uff0c\u6700\u7ec8\u9009\u62e94380\u5143\u7684\u65d7\u8230\u8bfe\uff0c\u8868\u660e\u6709\u4e00\u5b9a\u652f\u4ed8\u80fd\u529b\u4f46\u975e\u5bbd\u88d5\uff0c\u5bf9\u4ef7\u683c\u654f\u611f\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u672a\u77e5** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff0c\u65e0\u6cd5\u5224\u65ad\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u672a\u77e5** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff0c\u65e0\u6cd5\u5224\u65ad\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9762\u5bf9\u9500\u552e\u5bc6\u96c6\u7684\u8f6c\u5316\u8bdd\u672f\u548c\u4f5c\u4e1a\u70b9\u8bc4\u4e2d\u7684\u64cd\u4f5c\u5931\u8bef\uff08\u63d0\u793a\u8bcd\u7528\u9519\uff09\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u4ec5\u7528\u201cOK\u201d\u3001\u201c\u61c2\u4e86\u201d\u3001\u201c\u597d\u7684\u201d\u56de\u5e94\uff0c\u65e0\u4efb\u4f55\u7126\u8651\u3001\u81ea\u6211\u6000\u7591\u6216\u4f9d\u8d56\u5b89\u629a\u7684\u4fe1\u53f7\u3002\u63d0\u95ee\u903b\u8f91\u6e05\u6670\uff0c\u805a\u7126\u4e8e\u89c4\u5219\u548c\u6d41\u7a0b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \uff08\u9500\u552e\u6307\u51fa\u4f5c\u4e1a\u9519\u8bef\u540e\uff09\u201c\u63d0\u793a\u8bcd\u597d\u50cf\u7c98\u8d34\u8f93\u9519\u4e86\u201d\n> \u201c\u61c2\u4e86\u201d\n> \u201c\u542c\u5b8c\u4eca\u665a\u7684\u8bfe\u518d\u51b3\u5b9a\u201d\n> \u201c\u6211\u5728\u8003\u8651\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42\uff08\u7126\u8651\u4fdd\u969c\uff09**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4f53\u5236\u5185\u8eab\u4efd\u5e26\u6765\u7684\u201c\u5b89\u5168\u7126\u8651\u201d**\u3002\u4ed6\u6700\u5927\u7684\u987e\u8651\u4e0d\u662f\u201c\u80fd\u4e0d\u80fd\u8d5a\u94b1\u201d\uff0c\u800c\u662f\u201c\u8d5a\u94b1\u4f1a\u4e0d\u4f1a\u5f71\u54cd\u6211\u7684\u4e3b\u4e1a/\u8eab\u4efd\u5b89\u5168\u201d\u3002\u5b9e\u540d\u5236\u6295\u7a3f\u3001\u7a3f\u8d39\u7a0e\u52a1\u95ee\u9898\u3001\u5199\u201c\u5947\u8469\u7f51\u6587\u201d\u88ab\u540c\u4e8b\u77e5\u9053\uff0c\u8fd9\u4e9b\u62c5\u5fe7\u90fd\u6307\u5411\u5176\u5bf9\u73b0\u6709\u804c\u4e1a\u7a33\u5b9a\u6027\u548c\u793e\u4f1a\u8bc4\u4ef7\u7684\u5f3a\u70c8\u4fdd\u62a4\u6b32\u3002\u4ed6\u7684\u6838\u5fc3\u8bc9\u6c42\u662f\u5728**\u7edd\u5bf9\u5b89\u5168\u3001\u4e0d\u5f71\u54cd\u73b0\u6709\u751f\u6d3b\u7684\u524d\u63d0\u4e0b\uff0c\u5f00\u8f9f\u4e00\u6761\u53ef\u63a7\u7684\u526f\u4e1a\u589e\u6536\u8def\u5f84**\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u5408\u89c4\u9632\u706b\u5899\u201d\u4e0e\u201c\u98ce\u9669\u9694\u79bb\u627f\u8bfa\u201d**\u3002\u9700\u8981\u63d0\u4f9b\u660e\u786e\u7684\u89e3\u51b3\u65b9\u6848\uff08\u5982\u7528\u5bb6\u4eba\u8eab\u4efd\u8bc1\u6295\u7a3f\u3001\u7a3f\u8d39\u7a0e\u540e\u7ed3\u7b97\u3001\u5199\u4f5c\u5185\u5bb9\u5408\u89c4\u6307\u5bfc\uff09\uff0c\u6253\u6d88\u5176\u5bf9\u526f\u4e1a\u5f71\u54cd\u4e3b\u4e1a\u7684\u987e\u8651\uff0c\u6784\u5efa\u4e00\u4e2a\u5b89\u5168\u3001\u53ef\u63a7\u7684\u53d8\u73b0\u73af\u5883\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u52a8\u673a\u9ad8\u3001\u5f39\u6027\u9ad8\u3001\u8d44\u6e90\u4e2d\uff0c\u52a1\u5b9e\u3001\u7a33\u5b9a\u3001\u5173\u6ce8\u89c4\u5219\u4e0e\u6d41\u7a0b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u8a00\u8bba\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u51b3\u7b56\u7406\u6027\uff0c\u5e94\u5df2\u8003\u8651\u5bb6\u5ead\u56e0\u7d20\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4e2d | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u82e5\u5f00\u8bfe\u540e\u53d1\u73b0\u65f6\u95f4\u7cbe\u529b\u65e0\u6cd5\u5339\u914d\u9ad8\u5f3a\u5ea6\u5b66\u4e60\u4e0e\u6295\u7a3f\u8981\u6c42\uff0c\u53ef\u80fd\u56e0\u201c\u65e0\u6cd5\u53d8\u73b0\u201d\u800c\u7406\u6027\u9000\u8d39\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u6280\u672f\u64cd\u4f5c\u5931\u8bef\u80fd\u5e73\u9759\u63a5\u53d7\u5e76\u4fee\u6b63\uff0c\u4e0d\u6613\u60c5\u7eea\u5316\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669\u70b9**\uff1a\u5bf9\u6e20\u9053\u548c\u53d8\u73b0\u89c4\u5219\u671f\u671b\u503c\u9ad8\u3002\u82e54\u4e2a\u6708\u5b66\u4e60\u540e\uff0c\u53d1\u73b0\u5546\u5355\u7ade\u4e89\u6fc0\u70c8\u3001\u6295\u7a3f\u901a\u8fc7\u7387\u4e0d\u53ca\u9884\u671f\u3001\u6216\u5b9e\u540d\u5236\u95ee\u9898\u65e0\u6cd5\u89e3\u51b3\uff0c\u53ef\u80fd\u56e0\u201c\u6295\u5165\u4ea7\u51fa\u6bd4\u4e0d\u7b26\u9884\u671f\u201d\u800c\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c3-4\u4e2a\u6708\uff08\u6bd5\u4e1a\u4f5c\u54c1\u6295\u7a3f\u671f\uff09**\u3002\u6b64\u65f6\u82e5\u63a5\u5355\u4e0d\u987a\u6216\u6295\u7a3f\u5c61\u6b21\u88ab\u62d2\uff0c\u5176\u201c\u5b89\u5168\u53d8\u73b0\u201d\u7684\u9884\u671f\u5c06\u4e25\u91cd\u53d7\u632b\uff0c\u89e6\u53d1\u7406\u6027\u9000\u8d39\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u738b\u6d9b\u540c\u5b66\uff0c\u6b22\u8fce\u52a0\u5165\uff01\u770b\u5230\u4f60\u4e4b\u524d\u5bf9\u6295\u7a3f\u6e20\u9053\u548c\u89c4\u5219\u95ee\u5f97\u5f88\u7ec6\uff0c\u4e00\u770b\u5c31\u662f\u505a\u4e8b\u975e\u5e38\u7a33\u59a5\u7684\u4eba\u3002\u54b1\u4eec\u8bfe\u7a0b\u6700\u5927\u7684\u4ef7\u503c\u5c31\u662f\u5e2e\u4f60\u628a\u2018\u5408\u89c4\u53d8\u73b0\u2019\u8fd9\u6761\u8def\u8dd1\u901a\uff0c\u65e0\u8bba\u662f\u7528\u5bb6\u4eba\u4fe1\u606f\u6295\u7a3f\u907f\u5acc\uff0c\u8fd8\u662f\u5bf9\u63a5\u7a33\u5b9a\u7684\u5185\u90e8\u6e20\u9053\uff0c\u90fd\u4f1a\u7ed9\u4f60\u5b89\u6392\u660e\u767d\u3002\u4f60\u53ea\u7ba1\u5b89\u5fc3\u5b66\u6280\u672f\uff0c\u5b89\u5168\u589e\u6536\u7684\u4e8b\u513f\u4ea4\u7ed9\u6211\u4eec\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176\u9ad8\u52a8\u673a\u548c\u9ad8\u5f39\u6027\uff0c\u63d0\u4f9b\u624e\u5b9e\u7684AI\u5199\u4f5c\u6280\u672f\u6559\u5b66\uff08A\u6a21\u5757\uff09\u548c\u7cbe\u51c6\u7684\u6295\u7a3f\u6e20\u9053\u3001\u5546\u5355\u5b9e\u6218\u6307\u5bfc\uff08B\u6a21\u5757\uff09\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u201c\u5b89\u5168\u9700\u6c42\u201d\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u5408\u89c4\u907f\u9669\u6307\u5357\u5305\u3011**\u3002\u5185\u5bb9\u5e94\u5305\u62ec\uff1a\u2460 \u591a\u8d26\u53f7/\u5bb6\u4eba\u8eab\u4efd\u6295\u7a3f\u64cd\u4f5cSOP\uff1b\u2461 \u4e0d\u540c\u5e73\u53f0\u7a3f\u8d39\u7ed3\u7b97\uff08\u7a0e\u524d/\u7a0e\u540e\uff09\u8bf4\u660e\uff1b\u2462 \u4f53\u5236\u5185\u4eba\u5458\u526f\u4e1a\u5185\u5bb9\u521b\u4f5c\u8fb9\u754c\u6307\u5357\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a**\u753b\u4e0d\u5207\u5b9e\u9645\u7684\u201c\u66b4\u5bcc\u201d\u5927\u997c**\u3002\u907f\u514d\u4f7f\u7528\u201c\u5b66\u5b8c\u9a6c\u4e0a\u6708\u5165\u8fc7\u4e07\u201d\u7b49\u8bdd\u672f\uff0c\u8fd9\u4e0e\u5176\u5ba1\u614e\u3001\u6c42\u7a33\u7684\u6027\u683c\u76f8\u6096\uff0c\u4f1a\u5f15\u53d1\u4e0d\u4fe1\u4efb\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u9700\u7ed1\u5b9a\u201c\u5b89\u5168\u627f\u8bfa\u201d**\u3002\u672a\u6765\u5411\u5176\u63a8\u4ecb\u9ad8\u9636\u8bfe\u7a0b\uff08\u5982\u77ed\u5267\u7f16\u5267\uff09\u65f6\uff0c\u5fc5\u987b\u5f3a\u8c03\u8bfe\u7a0b\u7684\u5408\u89c4\u6027\u548c\u6e20\u9053\u7684\u7a33\u5b9a\u6027\uff0c\u800c\u975e\u5355\u7eaf\u5f3a\u8c03\u9ad8\u6536\u76ca\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6295\u7a3f\u5fc5\u987b\u5b9e\u540d\u5236\u5417\uff1f\u6211\u770b\u6f14\u793a\u7684\u767e\u5ea6\u6295\u7a3f\u7231\u5e73\u53f0\u597d\u50cf\u8981\u4e0a\u4f20\u8eab\u4efd\u8bc1\uff0c\u4f53\u5236\u5185\u5de5\u4f5c\uff0c\u6709\u70b9\u4e0d\u65b9\u4fbf\u201d\n2. > \u201c\u5199\u5947\u8469\u7f51\u6587 \u62c5\u5fc3\u88ab\u4ee5\u540e\u88ab\u77e5\u9053 \u5f71\u54cd\u4e0d\u592a\u597d[\u5472\u7259]\u201d\n3. > \u201c\u4e3b\u8981\u662f\u63d0\u793a\u8bcd\u548c\u6295\u7a3f\u6e20\u9053\u201d\n4. > \u201c4\u4e2a\u6708\u4e4b\u540e\u5c31\u662f\u81ea\u5df1\u5199\u7a3f\u3001\u6539\u7a3f\u3001\u6295\u7a3f\u554a\uff0c\u6ca1\u6709\u4eba\u5e2e\u7740\u670d\u52a1\u4e86\u662f\u5427\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u7edd\u5bf9\u5b89\u5168\u7684\u524d\u63d0\u4e0b\uff0c\u5f00\u8f9f\u4e00\u6761\u7a33\u5b9a\u7684\u526f\u4e1a\u589e\u6536\u6e20\u9053\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u8be6\u5c3d\u7684\u201c\u5408\u89c4\u907f\u9669\u201d\u89e3\u51b3\u65b9\u6848\uff0c\u7ba1\u7406\u5176\u201c\u5b89\u5168\u53d8\u73b0\u201d\u7684\u9884\u671f\uff0c\u5e76\u786e\u4fdd\u6295\u7a3f\u6e20\u9053\u7684\u7a33\u5b9a\u4e0e\u900f\u660e\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u5408\u89c4\u907f\u9669\u6307\u5357\u5305\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u7537\", \"city\": \"\u672a\u77e5\"}\n```";
