    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | 677151105 (\u83f2) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u70ed\u70ed2(\u7eaa\u9e4f)\u3001\u53ef\u4e3d\u513f(\u5b54\u4ee4\u5a77) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u6f14\u64ad\u9ad8\u9636\u73ed\uff084+1\u4e2a\u6708\u8bfe\u7a0b\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u5145\u88d5\uff08\u76f4\u63a5\u652f\u4ed8\uff0c\u65e0\u5206\u671f/\u501f\u8d37\u8ff9\u8c61\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1\uff08\u5728\u804c\u72b6\u6001\uff0c\u4e0b\u73ed\u540e\u5b66\u4e60\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u7f3a\u5931\uff08\u672a\u63d0\u53ca\uff0c\u9700\u540e\u7eed\u6838\u67e5\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | \u9971\u6ee1 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e\uff0c\u4f46\u5bf9\u6280\u80fd\u672c\u8eab\uff08\u5982\u7ca4\u8bed\u3001\u82f1\u8bed\u3001\u6050\u6016\u60ac\u7591\u8d5b\u9053\uff09\u8868\u73b0\u51fa\u5174\u8da3\u548c\u63a2\u7d22\u6b32\uff0c\u5e76\u975e\u7eaf\u7cb9\u88ab\u77ed\u671f\u66b4\u5bcc\u627f\u8bfa\u9a71\u52a8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u753b\u672c\uff0c\u5ba1\u542c\uff0c\u5bf9\u8f68\u90fd\u53ef\u4ee5\uff0c\u5bf9\u77ed\u5267\uff0c\u6709\u58f0\u6f2b\u753b\u5f88\u611f\u5174\u8da3\u201d > \u201c\u6211\u6bd4\u8f83\u503e\u5411\u6f14\u64ad\uff0c\u4f46\u5e55\u540e\u5236\u4f5c\u4e5f\u53ef\u4ee5\uff0c\u56e0\u4e3a\u6211\u5589\u5499\u4e4b\u524d\u505a\u8001\u5e08\u7684\u65f6\u5019\uff0c\u7ecf\u5e38\u54bd\u708e\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 \u80fd\u76f4\u63a5\u652f\u4ed8\u9ad8\u9636\u73ed\u8d39\u7528\uff0c\u65e0\u7ecf\u6d4e\u538b\u529b\u8ff9\u8c61\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 \u5728\u804c\u72b6\u6001\uff0c\u5229\u7528\u4e0b\u73ed\u540e\u65f6\u95f4\u5b66\u4e60\uff0c\u80fd\u8ddf\u4e0a\u7d27\u51d1\u7684\u8282\u594f\uff0c\u4f46\u975e\u5168\u804c\u6295\u5165\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u672a\u77e5] \u2014 **\u5173\u952e\u4fe1\u606f\u7f3a\u5931**\uff0c\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff0c\u9700\u73ed\u4e3b\u4efb\u540e\u7eed\u91cd\u70b9\u6838\u67e5\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9762\u5bf9\u9500\u552e\u5bc6\u96c6\u7684\u4f5c\u4e1a\u548c\u76f4\u64ad\u5b89\u6392\uff0c\u80fd\u6e05\u6670\u6c9f\u901a\u65f6\u95f4\u5b89\u6392\uff08\u201c\u6211\u8981\u4e0a\u73ed\u4e86\uff0c\u4e0b\u73ed\u518d\u505a\u4f5c\u4e1a\u201d\uff09\uff0c\u5e76\u4e3b\u52a8\u7814\u7a76\u5b66\u4e60\u5185\u5bb9\uff08\u201c\u55ef\uff0c\u5728\u7814\u7a76\u9898\u76ee\u201d\uff09\uff0c\u672a\u8868\u73b0\u51fa\u4efb\u4f55\u8d1f\u9762\u60c5\u7eea\u6216\u4f9d\u8d56\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u597d\u7684\uff0c\u8c22\u8c22\u8001\u5e08\uff01\u201d (\u63a5\u53d7\u4e13\u4e1a\u70b9\u8bc4) > \u201c\u597d\u7684\uff0c\u56de\u53bb\u7814\u7a76\u7814\u7a76\u201d (\u4e3b\u52a8\u89c4\u5212)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u4ece\u6559\u5e08\u804c\u4e1a\u8f6c\u884c\u6216\u5bfb\u6c42\u526f\u4e1a\uff0c\u53ef\u80fd\u9762\u4e34\u804c\u4e1a\u8f6c\u578b\u7684\u81ea\u6211\u4ef7\u503c\u91cd\u4f30\uff0c\u5e0c\u671b\u901a\u8fc7\u638c\u63e1\u6709\u58f0\u6f14\u64ad\u8fd9\u4e00\u65b0\u6280\u80fd\uff0c\u83b7\u5f97\u65b0\u7684\u804c\u4e1a\u8eab\u4efd\u8ba4\u540c\u548c\u5916\u754c\uff08\u5305\u62ec\u6f5c\u5728\u7532\u65b9\uff09\u7684\u8ba4\u53ef\u4e0e\u5c0a\u91cd\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u8d44\u6e90\u5bf9\u63a5\u7684\u786e\u5b9a\u6027**\u3002\u80af\u5b9a\u5176\u8bed\u8a00\u5929\u8d4b\uff08\u7ca4\u8bed\u3001\u82f1\u8bed\uff09\u548c\u9009\u6750\u773c\u5149\uff08\u6050\u6016\u60ac\u7591\uff09\uff0c\u5e76\u63d0\u4f9b\u6e05\u6670\u7684\u3001\u53ef\u9884\u671f\u7684\u8fdb\u9636\u8def\u5f84\u548c\u63a5\u5355\u8d44\u6e90\uff0c\u6ee1\u8db3\u5176\u201c\u88ab\u4e13\u4e1a\u9886\u57df\u8ba4\u53ef\u201d\u7684\u5c0a\u91cd\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 B \u7c7b |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u7edd\u5883\u7b49\u8ff9\u8c61\u3002**\u4f46\u5bb6\u5ead\u652f\u6301\u5ea6\u672a\u77e5\uff0c\u662f\u6f5c\u5728\u98ce\u9669\u70b9**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | **\u5173\u952e\u672a\u77e5\u9879**\u3002\u82e5\u62a5\u540d\u4e3a\u5bb6\u5ead\u91cd\u5927\u652f\u51fa\u6216\u5bb6\u4eba\u53cd\u5bf9\uff0c\u98ce\u9669\u9aa4\u589e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u7528\u6237\u65f6\u95f4\u7ba1\u7406\u6e05\u6670\uff0c\u80fd\u4e3b\u52a8\u6c9f\u901a\uff0c\u81ea\u5f8b\u6027\u8f83\u5f3a\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u7814\u7a76\uff0c\u60c5\u7eea\u7a33\u5b9a\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u5bf9\u53d8\u73b0\u8def\u5f84\uff08\u753b\u672c\u3001\u5ba1\u542c\u3001\u6f14\u64ad\uff09\u6709\u660e\u786e\u5174\u8da3\u548c\u89c4\u5212\uff0c\u82e5\u521d\u671f\u63a5\u5355\u4e0d\u987a\u6216\u8d44\u6e90\u5bf9\u63a5\u4e0d\u53ca\u65f6\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\u3002\u6b64\u65f6\u5b66\u4e60\u8fdb\u5165\u5b9e\u64cd\u548c\u521d\u6b65\u63a5\u5355\u9636\u6bb5\uff0c\u82e5\u627f\u8bfa\u7684\u201c\u7b2c\u4e8c\u5468\u5b89\u6392\u8fdb\u7ec4\u201d\u7b49\u8d44\u6e90\u672a\u5151\u73b0\uff0c\u6216\u4f5c\u4e1a\u96be\u5ea6\u9661\u589e\u4f46\u53cd\u9988\u4e0d\u8db3\uff0c\u6613\u56e0\u201c\u5c0a\u91cd\u9700\u6c42\u201d\uff08\u88ab\u8ba4\u53ef\u3001\u6709\u7ed3\u679c\uff09\u672a\u6ee1\u8db3\u800c\u52a8\u6447\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u83f2\uff0c\u4f60\u597d\uff01\u770b\u4e86\u4f60\u7684\u5b66\u4e60\u8bb0\u5f55\uff0c\u975e\u5e38\u6b23\u8d4f\u4f60\u76ee\u6807\u660e\u786e\u3001\u6267\u884c\u529b\u5f3a\u7684\u7279\u8d28\u3002\u4f60\u63d0\u5230\u7684\u7ca4\u8bed\u3001\u82f1\u8bed\u4f18\u52bf\u548c\u6050\u6016\u60ac\u7591\u8d5b\u9053\u7684\u5174\u8da3\u70b9\uff0c\u90fd\u662f\u975e\u5e38\u5b9d\u8d35\u7684\u5dee\u5f02\u5316\u7ade\u4e89\u529b\u3002\u54b1\u4eec\u7684\u8bfe\u7a0b\u548c\u5267\u793e\u8d44\u6e90\u4f1a\u5168\u529b\u5e2e\u4f60\u628a\u8fd9\u4e9b\u4f18\u52bf\u5151\u73b0\u3002\u8fc7\u7a0b\u4e2d\u6709\u4efb\u4f55\u5173\u4e8e\u804c\u4e1a\u89c4\u5212\u6216\u8d44\u6e90\u5bf9\u63a5\u7684\u5177\u4f53\u95ee\u9898\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4eec\u4e00\u8d77\u6765\u62c6\u89e3\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** + **\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011**\u3002\u91cd\u70b9\u6ee1\u8db3\u5176\u6280\u80fd\u7cbe\u8fdb\u548c\u65e9\u671f\u7ed3\u679c\u9a8c\u8bc1\u7684\u9700\u6c42\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T2\u5b9e\u5e72\u578b\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u4e13\u5bb61v1\u6df1\u5ea6\u70b9\u8bc4\u5305\u3011** \u548c **\u3010\u771f\u5b9e\u6838\u5fc3\u6d3e\u5355\u4f18\u5148\u6743\u3011**\uff0c\u7528\u786c\u6838\u53cd\u9988\u548c\u5b9e\u6218\u673a\u4f1a\u6765\u5582\u517b\u5176\u5c0a\u91cd\u9700\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u53ea\u7ed9\u7a7a\u6d1e\u7684\u9f13\u52b1\uff0c\u4e0d\u7ed9\u5177\u4f53\u7684\u3001\u6709\u6311\u6218\u6027\u7684\u4e13\u4e1a\u53cd\u9988\u30022. \u62d6\u5ef6\u6216\u6a21\u7cca\u5316\u8d44\u6e90\u5bf9\u63a5\uff08\u5982\u8fdb\u5267\u793e\u3001\u8bd5\u97f3\uff09\u7684\u65f6\u95f4\u8868\u30023. \u7528\u5927\u91cf\u793e\u4ea4\u6216\u5a31\u4e50\u5185\u5bb9\u5e72\u6270\u5176\u5b66\u4e60\u8282\u594f\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002T2\u7528\u6237\u8ba4\u53ef\u4e13\u4e1a\u4ef7\u503c\u540e\uff0c\u5bf9\u9ad8\u9636\u8bfe\u7a0b\u3001\u79c1\u6559\u670d\u52a1\u7b49\u6709\u4ed8\u8d39\u6f5c\u529b\uff0c\u4f46\u63a8\u4ecb\u9700\u57fa\u4e8e\u5176\u5f53\u524d\u5b66\u4e60\u8fdb\u5c55\u548c\u660e\u786e\u7684\u4e0b\u9636\u6bb5\u76ee\u6807\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u753b\u672c\uff0c\u5ba1\u542c\uff0c\u5bf9\u8f68\u90fd\u53ef\u4ee5\uff0c\u5bf9\u77ed\u5267\uff0c\u6709\u58f0\u6f2b\u753b\u5f88\u611f\u5174\u8da3\u201d **(\u4f53\u73b0\u660e\u786e\u3001\u52a1\u5b9e\u7684\u53d8\u73b0\u5174\u8da3\u4e0e\u89c4\u5212)**\n2. > \u201c\u6211\u6bd4\u8f83\u503e\u5411\u6f14\u64ad\uff0c\u4f46\u5e55\u540e\u5236\u4f5c\u4e5f\u53ef\u4ee5\uff0c\u56e0\u4e3a\u6211\u5589\u5499\u4e4b\u524d\u505a\u8001\u5e08\u7684\u65f6\u5019\uff0c\u7ecf\u5e38\u54bd\u708e\u3002\u201d **(\u4f53\u73b0\u7406\u6027\u6743\u8861\u4e0e\u57fa\u4e8e\u81ea\u8eab\u6761\u4ef6\u7684\u52a1\u5b9e\u601d\u8003)**\n3. > \u201c\u597d\u7684\uff0c\u8c22\u8c22\u8001\u5e08\uff01\u201d & \u201c\u55ef\uff0c\u5728\u7814\u7a76\u9898\u76ee\u201d **(\u4f53\u73b0\u9ad8\u914d\u5408\u5ea6\u3001\u9ad8\u81ea\u4e3b\u6027\uff0c\u975e\u60c5\u7eea\u5316\u4f9d\u8d56)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2\u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u65b0\u9886\u57df\u7684\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u5c0a\u91cd**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u5151\u73b0\u201c\u5feb\u901f\u63a5\u5355\u201d\u627f\u8bfa\uff0c\u5e76\u63d0\u4f9b\u786c\u6838\u3001\u5177\u4f53\u7684\u4e13\u4e1a\u53cd\u9988\u4e0e\u8d44\u6e90\u5bf9\u63a5**\u3002\n\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5feb\u901f\u63a5\u5355\u7ebf\"}";
