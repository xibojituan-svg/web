    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a**\u9ad8**\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5b66\u4e60\u4e0e\u5b9e\u64cd\u610f\u56fe\uff0c\u4e3b\u52a8\u63d0\u95ee\u6280\u672f\u7ec6\u8282\uff08\u5982\u63d0\u793a\u8bcd\u3001\u8f6f\u4ef6\u4f7f\u7528\u3001\u7d20\u6750\u4fdd\u5b58\u3001Markdown\u683c\u5f0f\u5904\u7406\u3001\u7ec6\u7eb2\u8c03\u6574\uff09\uff0c\u5e76\u5c1d\u8bd5\u5c06\u6240\u5b66\u5e94\u7528\u4e8e\u5b9e\u9645\u521b\u4f5c\uff08\u5982\u751f\u6210\u7075\u611f\u3001\u5c1d\u8bd5\u6295\u7a3f\u3001\u8be2\u95ee\u81ea\u5a92\u4f53\u64cd\u4f5c\uff09\u3002\u5bf9\u201c\u53d8\u73b0\u201d\u6709\u660e\u786e\u671f\u5f85\uff08\u201c\u7528\u5fc3\u60f3\u505a\u597d\u201d\u3001\u201c\u62c5\u5fc3\u65e0\u7a77\u65e0\u5c3d\u6295\u5165\u201d\uff09\uff0c\u4f46\u52a8\u673a\u4ee5\u201c\u638c\u63e1\u6280\u80fd\u3001\u4ea7\u51fa\u4f5c\u54c1\u201d\u4e3a\u4e3b\u5bfc\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4e2d**\u3002\u5177\u5907\u57fa\u7840\u5b66\u4e60\u6761\u4ef6\uff08\u624b\u673a\u3001\u53ef\u64cd\u4f5cAI\u5de5\u5177\uff09\uff0c\u80fd\u6295\u5165\u65f6\u95f4\u8ddf\u8fdb\u8bfe\u7a0b\u3001\u5b8c\u6210\u4f5c\u4e1a\uff08\u5373\u4f7f\u5fd9\u4e5f\u4ea4\u201c\u767d\u5377\u201d\u5e76\u8865\u4ea4\uff09\u3002**\u652f\u4ed8\u80fd\u529b\u4e2d\u7b49**\uff0c\u80fd\u63a5\u53d7\u201c\u4e0d\u52302000\u5757\u94b1\u201d\u7684\u6539\u7a3f\u8bfe\u6295\u5165\uff0c\u4f46\u5bf9\u6301\u7eed\u4ed8\u8d39\u654f\u611f\uff0c\u62c5\u5fc3\u201c\u65e0\u7a77\u65e0\u5c3d\u201d\u7684\u8bfe\u7a0b\u3002\u5bb6\u5ead\u60c5\u51b5\u63d0\u53ca\u201c\u5b69\u5b50\u201d\uff0c\u63a8\u6d4b\u4e3a\u6709\u5bb6\u5ead\u8d23\u4efb\u7684\u6210\u5e74\u4eba\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a**\u4e2d\u9ad8**\u3002\u5b66\u4e60\u8fc7\u7a0b\u9047\u5230\u95ee\u9898\uff08AI\u8f93\u51fa\u6d6e\u5938\u3001\u7ec6\u7eb2\u77db\u76fe\u3001\u683c\u5f0f\u95ee\u9898\uff09\u80fd\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\u6216\u5411\u73ed\u73ed/\u540c\u5b66\u63d0\u95ee\uff0c\u8868\u73b0\u51fa**\u8f83\u5f3a\u7684\u89e3\u51b3\u95ee\u9898\u610f\u613f\u548c\u97e7\u6027**\u3002\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u6709\u57fa\u672c\u4fe1\u4efb\uff08\u201c\u57fa\u672c\u542c\u5f97\u61c2\u201d\uff09\uff0c\u4f46\u5bf9\u540e\u7eed\u8bfe\u7a0b\u7684\u53d8\u73b0\u627f\u8bfa\u5b58\u5728**\u7406\u6027\u6000\u7591\u548c\u8c28\u614e\u8bc4\u4f30**\uff08\u201c\u62c5\u5fc3\u5b66\u4e86\u6539\u7a3f\u8bfe\u53d1\u73b0\u8fd8\u662f\u4e0d\u884c\u8fd8\u8981\u5b66\u6210\u957f\u8bfe\u201d\uff09\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u5df2\u652f\u4ed8\u57fa\u7840\u73ed\uff08\u201c\u6628\u5929\u62a5\u73ed\u4e86\u201d\uff09\uff0c\u5e76\u4e8e4\u67088\u65e5\u7eed\u62a5\u4e86\u6539\u7a3f\u8bfe\uff08\u201c\u597d\u5427\uff0c\u5e08\u59d0\u62a5\u8bfe\u7684\u94fe\u63a5\u53d1\u6211\u4e00\u4e0b\u201d\uff09\u3002**\u652f\u4ed8\u884c\u4e3a\u5df2\u786e\u8ba4**\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u7528\u6237\u81ea\u4e3b\u51b3\u7b56\u7eed\u62a5\u6539\u7a3f\u8bfe\uff0c\u6c9f\u901a\u8fc7\u7a0b\u4e2d\u672a\u63d0\u53ca\u9700\u4e0e\u4ed6\u4eba\u5546\u8bae\uff0c\u8868\u73b0\u51fa**\u5b8c\u5168\u7684\u81ea\u4e3b\u51b3\u7b56\u6743**\u3002\n*   **\u6b65\u9aa41-4\u7efc\u5408\u5224\u5b9a**\uff1a\n    *   **A\uff08\u52a8\u673a\uff09**\uff1a\u5f3a\u3002\u5b66\u4e60\u884c\u4e3a\u4e3b\u52a8\u3001\u6301\u7eed\uff0c\u76ee\u6807\u660e\u786e\uff08\u638c\u63e1AI\u5199\u4f5c\u5e76\u8fc7\u7a3f\uff09\u3002\n    *   **B\uff08\u8d44\u6e90\uff09**\uff1a\u4e2d\u7b49\u3002\u6709\u65f6\u95f4\u3001\u57fa\u7840\u5de5\u5177\uff0c\u652f\u4ed8\u80fd\u529b\u5c1a\u53ef\u4f46\u6709\u9884\u7b97\u610f\u8bc6\u3002\n    *   **C\uff08\u4fe1\u4efb\uff09**\uff1a\u4e2d\u7b49\u504f\u9ad8\u3002\u5bf9\u5f53\u524d\u73ed\u73ed\uff08\u6c90\u8a00\uff09\u4fe1\u4efb\u5ea6\u8f83\u9ad8\uff08\u4e3b\u52a8\u591a\u6b21\u8bf7\u6559\uff09\uff0c\u4f46\u5bf9\u673a\u6784\u8bfe\u7a0b\u4f53\u7cfb\u7684\u957f\u671f\u627f\u8bfa\u5b58\u5728\u987e\u8651\u3002\n    *   **D\uff08\u884c\u52a8\uff09**\uff1a\u5f3a\u3002\u6301\u7eed\u8ddf\u8bfe\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u4e3b\u52a8\u5b9e\u64cd\u3001\u89e3\u51b3\u95ee\u9898\u3002\n    *   **\u5224\u5b9a\u7ed3\u679c**\uff1a**B+\u7c7b\u7528\u6237**\u3002\u9ad8\u52a8\u673a\u3001\u5f3a\u884c\u52a8\u529b\u3001\u8d44\u6e90\u5c1a\u53ef\uff0c\u4f46\u5bf9\u957f\u671f\u6295\u5165\u548c\u7ed3\u679c\u786e\u5b9a\u6027\u6709\u987e\u8651\uff0c\u9700\u7ed3\u679c\u9a8c\u8bc1\u548c\u9884\u671f\u7ba1\u7406\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n**T4 \u52a1\u5b9e\u63a2\u7d22\u8005**\u3002\u7279\u5f81\u9ad8\u5ea6\u543b\u5408\uff1a\n1.  **\u76ee\u6807\u9a71\u52a8**\uff1a\u660e\u786e\u6307\u5411\u201c\u8fc7\u7a3f\u201d\u3001\u201c\u505a\u597d\u4e8b\u60c5\u201d\uff0c\u800c\u975e\u5355\u7eaf\u5174\u8da3\u3002\n2.  **\u8fc7\u7a0b\u6295\u5165**\uff1a\u8ba4\u771f\u8ddf\u8fdb\u8bfe\u7a0b\u6bcf\u4e2a\u73af\u8282\uff08\u63d0\u793a\u8bcd\u3001\u7ec6\u7eb2\u3001\u4f5c\u4e1a\uff09\uff0c\u4e3b\u52a8\u89e3\u51b3\u6280\u672f\u95ee\u9898\u3002\n3.  **\u7ed3\u679c\u5bfc\u5411\u4e0e\u6210\u672c\u654f\u611f**\uff1a\u613f\u610f\u4e3a\u201c\u5408\u7406\u7684\u6295\u5165\u201d\u4ed8\u8d39\uff0c\u4f46**\u6781\u5ea6\u538c\u6076\u201c\u65e0\u7a77\u65e0\u5c3d\u201d\u7684\u8bfe\u7a0b\u63a8\u9500**\uff0c\u9700\u8981\u6e05\u6670\u7684\u8def\u5f84\u548c\u7ed3\u679c\u9884\u671f\u3002\n4.  **\u7406\u6027\u8bc4\u4f30**\uff1a\u5bf9AI\u80fd\u529b\u6709\u5ba2\u89c2\u8ba4\u77e5\uff08\u201c\u5f88\u806a\u660e\u4f46\u6709\u65f6\u6d6e\u5938\u201d\uff09\uff0c\u5bf9\u8bfe\u7a0b\u6548\u679c\u6301\u201c\u5b66\u4e86\u4f1a\u8fdb\u6b65\uff0c\u4f46\u4e0d\u4fdd\u8bc1\u8fc7\u7a3f\u201d\u7684\u52a1\u5b9e\u6001\u5ea6\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669**\uff1a**\u4f4e**\u3002\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5df2\u81ea\u884c\u5728\u756a\u8304\u53d1\u5e03\u4f5c\u54c1\u201c\u6548\u679c\u5f88\u4e00\u822c\u201d\uff0c\u82e5\u6539\u7a3f\u8bfe\u540e\u4ecd\u65e0\u6539\u5584\uff0c\u662f\u6838\u5fc3\u98ce\u9669\u70b9\u3002\n    2.  **\u627f\u8bfa\u672a\u5151\u73b0**\uff1a**\u4f4e\u98ce\u9669**\u3002\u9500\u552e\uff08\u6c90\u8a00\uff09\u6c9f\u901a\u76f8\u5bf9\u52a1\u5b9e\uff0c\u672a\u8fc7\u5ea6\u627f\u8bfa\uff08\u201c\u4e0d\u6562\u4fdd\u8bc1\u8bf4\u4f60\u4e00\u5b9a\u80fd\u600e\u4e48\u7740\u201d\uff09\u3002\n    3.  **\u8bfe\u7a0b\u8d28\u91cf\u5dee**\uff1a**\u4f4e\u98ce\u9669**\u3002\u7528\u6237\u53cd\u9988\u201c\u57fa\u672c\u542c\u5f97\u61c2\u201d\uff0c\u672a\u62b1\u6028\u8d28\u91cf\u3002\n    4.  **\u670d\u52a1\u4f53\u9a8c\u5dee**\uff1a**\u4f4e\u98ce\u9669**\u3002\u4e0e\u73ed\u73ed\u4e92\u52a8\u987a\u7545\uff0c\u5076\u6709\u56de\u590d\u5ef6\u8fdf\u4f46\u672a\u5f15\u53d1\u5f3a\u70c8\u4e0d\u6ee1\u3002\n    5.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u4f4e\u98ce\u9669**\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u5355\u6b21\u6295\u5165\u7684\u627f\u53d7\u529b\uff0c\u4f46\u9700\u8b66\u60d5\u540e\u7eed\u8bfe\u7a0b\u63a8\u9500\u53ef\u80fd\u5f15\u53d1\u7684\u53cd\u611f\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u4f4e\u98ce\u9669**\u3002\u51b3\u7b56\u81ea\u4e3b\u3002\n    7.  **\u7ade\u54c1\u6bd4\u8f83/\u51b2\u52a8\u540e\u6094**\uff1a**\u4f4e\u98ce\u9669**\u3002\u7528\u6237\u884c\u4e3a\u8fde\u8d2f\uff0c\u7eed\u62a5\u51b3\u7b56\u7ecf\u8fc7\u601d\u8003\uff08\u201c\u72b9\u8c6b\u7684\u70b9\u201d\u5728\u4e8e\u8def\u5f84\u662f\u5426\u65e0\u7a77\u5c3d\uff0c\u800c\u975e\u51b2\u52a8\uff09\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5408\u89c4\u60c5\u51b5**\uff1a\u57fa\u672c\u5408\u89c4\u3002\u9500\u552e\uff08\u6c90\u8a00\uff09\u5728\u7eed\u62a5\u6c9f\u901a\u4e2d\uff0c**\u672a\u505a\u51fa\u201c\u4fdd\u8fc7\u7a3f\u201d\u3001\u201c\u4fdd\u6536\u76ca\u201d\u7684\u7edd\u5bf9\u5316\u627f\u8bfa**\uff0c\u4f7f\u7528\u4e86\u201c\u5b66\u4e86\u4f1a\u8fdb\u6b65\u975e\u5e38\u5927\u201d\u3001\u201c\u524d\u9762\u6210\u529f\u7684\u4f8b\u5b50\u975e\u5e38\u591a\u201d\u7b49\u76f8\u5bf9\u5ba2\u89c2\u8868\u8ff0\u3002**\u4f46\u5b58\u5728\u98ce\u9669\u70b9**\uff1a\u5728\u7528\u6237\u8868\u8fbe\u5bf9\u201c\u65e0\u7a77\u65e0\u5c3d\u8bfe\u7a0b\u201d\u7684\u62c5\u5fe7\u65f6\uff0c\u56de\u5e94\u201c\u5199\u4f5c\u8fd9\u8fb9\u7684\u8bdd\u4e5f\u5c31\u4e00\u4e2a\u4e03\u5929\u73ed\uff0c\u518d\u52a0\u4e0a\u4e00\u4e2a\u6539\u7a3f\u8bfe\uff0c\u6ca1\u6709\u5176\u4ed6\u7684\u8bfe\u201d\u53ef\u80fd\u6784\u6210\u5bf9\u8bfe\u7a0b\u4f53\u7cfb\u7ec8\u70b9\u7684\u627f\u8bfa\uff0c\u9700\u540e\u7eed\u9a8c\u8bc1\u3002\n*   **\u4f26\u7406\u98ce\u9669**\uff1a**\u4f4e**\u3002\u6c9f\u901a\u4ee5\u89e3\u51b3\u7528\u6237\u5177\u4f53\u95ee\u9898\u4e3a\u4e3b\uff0c\u5173\u7cfb\u7ef4\u62a4\u6b63\u5e38\uff08\u8282\u65e5\u95ee\u5019\u3001\u5173\u5fc3\u5b69\u5b50\u75c5\u60c5\uff09\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d**\uff1a**\u5339\u914d**\u3002\u7528\u6237\u5df2\u4ece\u57fa\u7840\u73ed\u7eed\u62a5\u6539\u7a3f\u8bfe\uff0c\u8def\u5f84\u7b26\u5408\u5176\u201c\u638c\u63e1\u6280\u80fd\u3001\u5b9e\u73b0\u8fc7\u7a3f\u201d\u7684\u6838\u5fc3\u8bc9\u6c42\u3002\n*   **\u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u3010\u6838\u5fc3\u52a8\u4f5c\u3011\u5f3a\u5316\u7ed3\u679c\u4ea4\u4ed8\u4e0e\u8def\u5f84\u900f\u660e**\uff1a\u6539\u7a3f\u8bfe\u9636\u6bb5\uff0c**\u5fc5\u987b\u91cd\u70b9\u5173\u6ce8\u5176\u4f5c\u54c1\u6253\u78e8\u4e0e\u6295\u7a3f\u53cd\u9988**\u3002\u4e3b\u52a8\u63d0\u4f9b\u9488\u5bf9\u6027\u6307\u5bfc\uff0c\u5e2e\u52a9\u5176\u89e3\u51b3\u201c\u5224\u65adAI\u751f\u6210\u5185\u5bb9\u597d\u574f\u201d\u3001\u201c\u7ec6\u7eb2\u903b\u8f91\u8c03\u6574\u201d\u7b49\u5177\u4f53\u5361\u70b9\u3002\u660e\u786e\u544a\u77e5\u6539\u7a3f\u8bfe\u7ed3\u675f\u540e\u7684\u5b66\u4e60/\u652f\u6301\u8def\u5f84\uff0c**\u675c\u7edd\u8ba9\u5176\u4ea7\u751f\u201c\u8fd8\u6709\u4e0b\u4e00\u95e8\u8bfe\u7b49\u7740\u201d\u7684\u7591\u8651**\u3002\n    2.  **\u9884\u671f\u7ba1\u7406**\uff1a\u6301\u7eed\u5f3a\u5316\u201c\u5199\u4f5c\u9700\u7ec3\u4e60\u4e0e\u8fed\u4ee3\u201d\u7684\u8ba4\u77e5\uff0c\u7ba1\u7406\u5176\u5bf9\u201c\u5b66\u5b8c\u5373\u8fc7\u7a3f\u201d\u7684\u5355\u4e00\u7ed3\u679c\u9884\u671f\uff0c\u8f6c\u800c\u5173\u6ce8\u201c\u5199\u4f5c\u80fd\u529b\u4e0e\u8fc7\u7a3f\u7387\u7684\u63d0\u5347\u8fc7\u7a0b\u201d\u3002\n    3.  **\u6280\u672f\u652f\u6301**\uff1a\u6301\u7eed\u54cd\u5e94\u5bf9AI\u5de5\u5177\u4f7f\u7528\u3001\u683c\u5f0f\u5904\u7406\u7b49\u5b9e\u64cd\u95ee\u9898\u7684\u54a8\u8be2\uff0c\u5de9\u56fa\u5176\u5b66\u4e60\u4fe1\u5fc3\u3002\n    4.  **\u5173\u7cfb\u7ef4\u62a4**\uff1a\u4fdd\u6301\u5f53\u524d\u52a1\u5b9e\u3001\u89e3\u51b3\u95ee\u9898\u7684\u6c9f\u901a\u98ce\u683c\uff0c\u907f\u514d\u8fc7\u5ea6\u8425\u9500\u3002\n\n{\"core_type\": \"T4 \u52a1\u5b9e\u63a2\u7d22\u8005\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u5f3a\u5316\u6539\u7a3f\u7ed3\u679c\u4ea4\u4ed8\u4e0e\u8def\u5f84\u900f\u660e\"}";
