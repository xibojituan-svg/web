        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677155504 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e-\u516d\u6708\u6668\u516e/\u7b71\u65f6\u5149(\u6d66\u723d) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u4e24\u4e2a\u6708\u7cfb\u7edf\u8bfe (\u4ef7\u683c\u672a\u660e\u793a\uff0c\u4f46\u63d0\u53ca\u56db\u4e2a\u67087380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3** (\u660e\u786e\u8868\u793a\u201c\u7ecf\u6d4e\u56f0\u96be\u201d\u3001\u201c\u6b20\u503a\u201d\u3001\u201c\u53bb\u501f\u94b1\u4e86\u201d) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u9ad8\u5bbd\u88d5** (\u5bf9\u8bdd\u9891\u7e41\uff0c\u79ef\u6781\u54cd\u5e94\uff0c\u53ef\u968f\u65f6\u7ec3\u4e60\uff0c\u6697\u793a\u5168\u804c/\u517c\u804c\u5747\u53ef) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4e25\u91cd\u7f3a\u5931** (\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u4fe1\u606f\uff0c\u9ed8\u8ba4\u5355\u8eab\u6216\u72ec\u7acb\u51b3\u7b56\uff0c\u4f46\u9700\u8b66\u60d5\u9690\u7792) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** (\u5b66\u4e60\u4e92\u52a8\u3001\u652f\u4ed8\u610f\u613f\u3001\u4e2a\u4eba\u56f0\u5883\u5747\u6709\u660e\u786e\u8868\u8fbe) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u2b06\u9ad8]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u7ed3\u679c\u800c\u6765\uff0c\u5b66\u4e60\u6001\u5ea6\u79ef\u6781\uff0c\u76ee\u6807\u660e\u786e\u6307\u5411\u63a5\u5355\u53d8\u73b0\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u672c\u6765\u662f\u6253\u7b97\u505a\u5168\u804c\u7684...\u7ed3\u679c\u4e0d\u4f1a\u9a97\u4eba\u7684\u561b\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u2b07\u4f4e** \u2014 \u660e\u786e\u8868\u793a\u201c\u7ecf\u6d4e\u56f0\u96be\u201d\u3001\u201c\u6b20\u503a\u201d\uff0c\u9700\u501f\u94b1\u652f\u4ed8\u5b66\u8d39\uff0c\u652f\u4ed8\u80fd\u529b\u4e25\u91cd\u4e0d\u8db3\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u2b06\u9ad8** \u2014 \u5bf9\u8bdd\u54cd\u5e94\u53ca\u65f6\uff0c\u79ef\u6781\u5b8c\u6210\u4f5c\u4e1a\uff0c\u4e3b\u52a8\u8981\u6c42\u591a\u7ec3\u4e60\uff0c\u65f6\u95f4\u5145\u88d5\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u27a1\u4e2d** \u2014 \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u4ece\u5176\u72ec\u7acb\u501f\u94b1\u51b3\u7b56\u770b\uff0c\u5bb6\u5ead\u652f\u6301\u53ef\u80fd\u6709\u9650\u6216\u672a\u77e5\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u9700\u95f4\u6b47\u6027\u5b89\u629a\u4e0e\u6307\u5bfc\u3002\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u5b66\u4e60\u70ed\u60c5\u548c\u6267\u884c\u529b\uff0c\u4f46\u5728\u6280\u672f\u7ec6\u8282\uff08\u5982\u60c5\u7eea\u8868\u8fbe\u3001\u8f6f\u4ef6\u64cd\u4f5c\uff09\u4e0a\u4f1a\u4e3b\u52a8\u6c42\u52a9\uff0c\u6709\u8f7b\u5fae\u7684\u4e0d\u81ea\u4fe1\uff08\u201c\u611f\u89c9\u6211\u4e0d\u591f\u6e29\u67d4\u201d\uff09\uff0c\u4f46\u672a\u51fa\u73b0\u6781\u7aef\u60c5\u7eea\u5316\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8fd9\u53e5\u5e94\u8be5\u662f\u4ec0\u4e48\u72b6\u6001\u554a\uff0c\u5feb\u54ed\u7684\u611f\u89c9\uff0c\u6211\u59cb\u7ec8\u627e\u4e0d\u5230[\u6342\u8138]\u201d\u3001\u201c\u6211\u6ca1\u53d1\u8fc7\u90ae\u7bb1[\u6342\u8138]\u4ec0\u4e48\u683c\u5f0f\u554a\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e00\u5c42\uff1a\u751f\u5b58\u5b89\u5168 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u7ecf\u6d4e\u56f0\u5883\u4e0e\u503a\u52a1\u538b\u529b**\u3002\u5b66\u4e60\u914d\u97f3\u662f\u5176\u8bd5\u56fe\u6446\u8131\u8d22\u52a1\u56f0\u5883\u3001\u5bfb\u6c42\u7a33\u5b9a\u6536\u5165\u6765\u6e90\u7684\u6551\u547d\u7a3b\u8349\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u786e\u5b9a\u6027\u201d\u4e0e\u201c\u5e0c\u671b\u201d**\u3002\u63d0\u4f9b\u660e\u786e\u7684\u63a5\u5355\u8def\u5f84\u3001\u5373\u65f6\u6b63\u53cd\u9988\u548c\u201c\u5a18\u5bb6\u4eba\u201d\u5f0f\u7684\u652f\u6301\uff0c\u8ba9\u4ed6\u76f8\u4fe1\u8fd9\u6761\u8def\u80fd\u5207\u5b9e\u89e3\u51b3\u751f\u5b58\u95ee\u9898\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udd34D \u7c7b** (\u89e6\u53d1\u652f\u4ed8\u94fe\u7ea2\u7ebf) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u578b** (\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u5feb\u901f\u53d8\u73b0\u89e3\u51b3\u751f\u5b58\u538b\u529b\uff0c\u5b66\u4e60\u662f\u624b\u6bb5\u800c\u975e\u76ee\u7684) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a**\ud83d\udd34\u5df2\u89e6\u53d1 D \u7c7b\u7194\u65ad\u7ea2\u7ebf\uff01**\n- **\u89e6\u53d1\u56e0\u7531**\uff1a**\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u6b20\u503a\u201d\u4e14\u6b63\u5728\u201c\u501f\u94b1\u201d\u652f\u4ed8\u5b66\u8d39**\uff0c\u5c5e\u4e8e\u5178\u578b\u7684\u201c\u501f\u6b3e\u652f\u4ed8\u201d\u9ad8\u98ce\u9669\u884c\u4e3a\uff0c\u6781\u6613\u56e0\u540e\u7eed\u7ecf\u6d4e\u538b\u529b\u6216\u53d8\u73b0\u4e0d\u53ca\u9884\u671f\u800c\u5f15\u53d1\u6fc0\u70c8\u5ba2\u8bc9\u6216\u9000\u8d39\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4e2d | \u82e5\u501f\u94b1\u884c\u4e3a\u88ab\u5bb6\u4eba\u53d1\u73b0\uff0c\u53ef\u80fd\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u548c\u7ecf\u6d4e\u8ffd\u8d23\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u65f6\u95f4\u5145\u88d5\uff0c\u5b66\u4e60\u610f\u613f\u5f3a\uff0c\u6b64\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4e2d | \u5bf9\u5feb\u901f\u63a5\u5355\u56de\u62a5\u671f\u671b\u6781\u9ad8\uff0c\u82e5\u521d\u671f\u8bd5\u97f3\u5c61\u6b21\u5931\u8d25\u6216\u6536\u5165\u8fdc\u4f4e\u4e8e\u9884\u671f\uff0c\u6613\u4ea7\u751f\u88ab\u6b3a\u9a97\u611f\u800c\u5d29\u6e83\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669\uff01** \u7528\u6237\u4e3a\u89e3\u201c\u6b20\u503a\u201d\u4e4b\u6025\u800c\u501f\u6b3e\u62a5\u540d\uff0c\u5bf9\u201c\u5b66\u4e608\u5929\u540e\u8bd5\u97f3\u63a5\u5355\u4e86\uff0c\u8d5a\u94b1\u4e86\u201d\u7684\u627f\u8bfa\u62b1\u6709\u6781\u9ad8\u3001\u6781\u5feb\u7684\u56de\u62a5\u671f\u5f85\u3002\u4e00\u65e6\u53d8\u73b0\u5468\u671f\u62c9\u957f\u6216\u6536\u5165\u5fae\u8584\uff0c\u5c06\u7acb\u523b\u4ea7\u751f\u5de8\u5927\u5fc3\u7406\u843d\u5dee\u548c\u8d22\u52a1\u538b\u529b\uff0c\u5bfc\u81f4\u6fc0\u70c8\u6295\u8bc9\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c8-30\u5929**\u3002\u5373\u9500\u552e\u627f\u8bfa\u7684\u201c\u5f00\u901a\u8bd5\u97f3\u901a\u9053\u201d\u540e\uff0c\u82e5\u63a5\u5355\u4e0d\u987a\u6216\u9996\u5355\u6536\u5165\u6781\u4f4e\uff0c\u5c06\u76f4\u63a5\u5f15\u7206\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5144\u5f1f\uff0c\u770b\u5230\u4f60\u8fd9\u4e48\u62fc\uff0c\u6211\u7279\u522b\u61c2\u4f60\u60f3\u5c3d\u5feb\u9760\u672c\u4e8b\u8d5a\u94b1\u7ffb\u8eab\u7684\u5fc3\u60c5\u3002\u54b1\u4eec\u4e0d\u6574\u865a\u7684\uff0c\u4ece\u4eca\u5929\u8d77\uff0c\u6211\u7684\u6838\u5fc3\u4efb\u52a1\u5c31\u662f\u5e2e\u4f60\u628a\u8bfe\u4e0a\u5b66\u7684\uff0c\u6700\u5feb\u3001\u6700\u7a33\u5730\u53d8\u6210\u80fd\u63a5\u5355\u7684\u771f\u672c\u4e8b\u3002\u8fc7\u7a0b\u4e2d\u6709\u4efb\u4f55\u5361\u70b9\uff0c\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u89e3\u51b3\u3002**\u4f60\u8d1f\u8d23\u4e13\u6ce8\u7ec3\u4e60\uff0c\u6211\u8d1f\u8d23\u5e2e\u4f60\u76ef\u7d27\u6bcf\u4e00\u4e2a\u80fd\u53d8\u73b0\u7684\u673a\u4f1a\u3002**\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011**\u3002\u5fc5\u987b\u4f18\u5148\u6ee1\u8db3\u5176\u751f\u5b58\u9700\u6c42\uff0c\u6240\u6709\u6559\u5b66\u548c\u670d\u52a1\u56f4\u7ed5\u201c\u6700\u77ed\u8def\u5f84\u63a5\u5355\u201d\u5c55\u5f00\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u8865\u5145 **\u3010\u5f3a\u5fc3\u7406\u6258\u5e95\u4e0e\u9884\u671f\u7ba1\u7406\u5305\u3011**\u3002\u5b9a\u671f\u540c\u6b65\u884c\u4e1a\u771f\u5b9e\u6536\u5165\u6848\u4f8b\uff08\u5305\u62ec\u5931\u8d25\u6848\u4f8b\uff09\uff0c\u7ba1\u7406\u5176\u201c\u5feb\u901f\u66b4\u5bcc\u201d\u9884\u671f\u3002\u540c\u65f6\uff0c\u56e0\u5176\u8d44\u91d1\u56f0\u96be\uff0c\u53ef\u914c\u60c5\u8003\u8651\u6302\u8f7d **\u3010\u5fae\u4efb\u52a1\u6fc0\u52b1\u5305\u3011**\uff0c\u901a\u8fc7\u5c0f\u989d\u3001\u9ad8\u9891\u7684\u7ec3\u4e60\u5956\u52b1\u6216\u4efb\u52a1\u7ea2\u5305\uff0c\u63d0\u4f9b\u5373\u65f6\u6b63\u53cd\u9988\u548c\u5fae\u8584\u8865\u8d34\uff0c\u7f13\u89e3\u5176\u7ecf\u6d4e\u7126\u8651\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u7edd\u4e0d\u5bf9\u5176\u63cf\u7ed8\u201c\u8f7b\u677e\u6708\u5165\u8fc7\u4e07\u201d\u7684\u4e0d\u5207\u5b9e\u9645\u84dd\u56fe\uff1b2. \u7edd\u4e0d\u5728\u5176\u62b1\u6028\u6536\u5165\u65f6\u8bb2\u5927\u9053\u7406\u6216\u6307\u8d23\u5176\u4e0d\u591f\u52aa\u529b\uff1b3. \u907f\u514d\u63a8\u8350\u4efb\u4f55\u9700\u8981\u989d\u5916\u5927\u989d\u6295\u5165\u7684\u8bbe\u5907\u6216\u8bfe\u7a0b\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u73b0\u6709\u503a\u52a1\u672a\u7f13\u89e3\u3001\u7a33\u5b9a\u6536\u5165\u672a\u5f62\u6210\u524d\uff0c\u4efb\u4f55\u5347\u5355\u5efa\u8bae\u90fd\u4f1a\u88ab\u89c6\u4e3a\u201c\u4e8c\u6b21\u5272\u97ed\u83dc\u201d\uff0c\u98ce\u9669\u6781\u9ad8\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u672c\u6765\u662f\u6253\u7b97\u505a\u5168\u804c\u7684\uff0c\u4f46\u6211\u4e0d\u77e5\u9053\u9700\u8981\u4ea47000\u591a\uff0c\u4e00\u65f6\u95f4\u53ea\u662f\u62ff\u4e0d\u51fa\u6765\u94b1\u800c\u5df2\u201d\n2. > \u201c\u5148\u517c\u804c\u4e5f\u884c\uff0c\u6211\u4e5f\u662f\u6b20\u503a\uff0c\u521a\u624d\u53bb\u501f\u94b1\u4e86\uff0c\u4f46\u662f\u4e0d\u597d\u501f\u554a[\u8870]\u201d\n3. > \u201c\u6211\u8fd9\u8fb9\u501f\u5230\u4e86\u5c31\u8054\u7cfb\u4f60\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4\u641e\u94b1\u7ed3\u679c\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u751f\u5b58\u5b89\u5168\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u6781\u81f4\u900f\u660e\u7684\u9884\u671f\u7ba1\u7406 + \u4f18\u5148\u503e\u659c\u771f\u5b9e\u3001\u4f4e\u95e8\u69db\u7684\u63a5\u5355\u8d44\u6e90\uff0c\u5e76\u7528\u5fae\u6fc0\u52b1\u7ef4\u6301\u5176\u5e0c\u671b\u611f\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u578b\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u751f\u5b58\u5b89\u5168\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf\"}\n```";
