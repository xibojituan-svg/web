    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49)**\n    *   **\u53d8\u73b0\u9a71\u52a8\u660e\u786e**\uff1a\u660e\u786e\u8868\u8fbe\u201c\u51b2\u7740\u90a3\u4e2a\u798f\u5229\u5de5\u4f5c\u7fa4\u53bb\u7684\u201d\uff0c\u8ba4\u4e3a\u5e73\u53f0\u63d0\u4f9b\u201c\u8d44\u6e90\u4eba\u8109\u201d\u548c\u201c\u5de5\u4f5c\u673a\u4f1a\u201d\u662f\u6838\u5fc3\u4ef7\u503c\u3002\n    *   **\u5174\u8da3\u4e0e\u5b9e\u7528\u7ed3\u5408**\uff1a\u5bf9\u914d\u97f3\uff08\u5fa1\u59d0\u97f3\u3001\u89d2\u8272\u9002\u914d\uff09\u6709\u4e2a\u4eba\u5174\u8da3\u548c\u63a2\u7d22\uff0c\u4f46\u66f4\u503e\u5411\u4e8e\u201c\u5bb9\u6613\u89c1\u6210\u6548\u5e76\u4e14\u9a6c\u4e0a\u80fd\u8d5a\u94b1\u201d\u7684\u540e\u671f\u526a\u8f91\u6280\u80fd\u3002\n    *   **\u5b66\u4e60\u8def\u5f84\u7406\u6027**\uff1a\u57fa\u4e8e\u5bf9\u81ea\u8eab\u80fd\u529b\u7684\u8bc4\u4f30\uff08\u201c\u641e\u6f14\u64ad\u6211\u53ef\u80fd\u4e0d\u592a\u884c\uff0c\u4f46\u662f\u641e\u6280\u672f\u6211\u89c9\u5f97\u6211\u6ca1\u95ee\u9898\u201d\uff09\uff0c\u9009\u62e9\u66f4\u6613\u53d8\u73b0\u7684\u540e\u671f\u8bfe\u7a0b\uff0c\u4f53\u73b0\u5de5\u5177\u7406\u6027\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d\u7b49)**\n    *   **\u65f6\u95f4\u8d44\u6e90\u53d7\u9650**\uff1a\u5bf9\u8bdd\u4e2d\u591a\u6b21\u63d0\u53ca\u201c\u63a5\u5a03\u201d\u3001\u201c\u5a03\u7761\u89c9\u4e86\u201d\uff0c\u8868\u660e\u4e3a\u5b9d\u5988\u8eab\u4efd\uff0c\u5b66\u4e60\u65f6\u95f4\u5448\u788e\u7247\u5316\u3002\n    *   **\u8bbe\u5907\u4e0e\u57fa\u7840**\uff1a\u5df2\u8d2d\u4e70MK4\u8bbe\u5907\uff0c\u5177\u5907\u57fa\u7840\u7535\u8111\u64cd\u4f5c\u80fd\u529b\uff08\u4e3b\u52a8\u8be2\u95ee\u8f6f\u4ef6\u64cd\u4f5c\u7ec6\u8282\uff09\uff0c\u6280\u672f\u5b66\u4e60\u95e8\u69db\u4f4e\u3002\n    *   **\u652f\u4ed8\u80fd\u529b**\uff1a\u5df2\u652f\u4ed8\u524d\u671f\u8bfe\u7a0b\u8d39\u7528\uff0c\u5e76\u5bf92399\u5143\u7684\u540e\u671f\u8bfe\u7a0b\u5feb\u901f\u51b3\u7b56\u8d2d\u4e70\uff0c\u65e0\u4ef7\u683c\u654f\u611f\u8868\u73b0\uff0c\u7ecf\u6d4e\u538b\u529b\u611f\u77e5\u4e0d\u660e\u663e\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u9ad8)**\n    *   **\u4e3b\u52a8\u6027\u4e0e\u89e3\u51b3\u95ee\u9898\u80fd\u529b\u5f3a**\uff1a\u79ef\u6781\u63d0\u95ee\uff08\u8f6f\u4ef6\u64cd\u4f5c\u3001\u6c14\u606f\u7ec3\u4e60\uff09\u3001\u4e3b\u52a8\u7d22\u8981\u8d44\u6599\u3001\u5728\u7fa4\u5185\u4e92\u52a8\u4e92\u52a9\u3001\u80fd\u63a5\u53d7\u53cd\u9988\u5e76\u7acb\u5373\u8c03\u6574\u7ec3\u4e60\uff08\u5982\u201c\u4e27\u5931\u201d\u53d1\u97f3\uff09\u3002\n    *   **\u6297\u632b\u6298\u4e0e\u6210\u957f\u5fc3\u6001**\uff1a\u627f\u8ba4\u5f53\u524d\u4e0d\u8db3\uff08\u201c\u5f55\u7684\u4e5f\u5f88\u8d39\u52b2\u201d\uff09\uff0c\u4f46\u76f8\u4fe1\u901a\u8fc7\u7ec3\u4e60\u53ef\u4ee5\u63d0\u5347\uff08\u201c\u53ef\u80fd\u8981\u52305\u6708\u4efd\uff0c\u6211\u7684\u80fd\u529b\u624d\u6709\u2026\u6c34\u5e73\u201d\uff09\u3002\u5bf9\u5b66\u4e60\u96be\u70b9\uff08\u5e73\u7fd8\u820c\u3001\u6c14\u606f\uff09\u6709\u8ba4\u77e5\u5e76\u5bfb\u6c42\u89e3\u51b3\u65b9\u6cd5\u3002\n    *   **\u793e\u4ea4\u6d3b\u8dc3\u4e0e\u5229\u4ed6\u503e\u5411**\uff1a\u5728\u7fa4\u5185\u79ef\u6781\u4e92\u52a8\uff08\u70b9\u8bc4\u4ed6\u4eba\u4f5c\u4e1a\u3001\u5206\u4eab\u7ecf\u9a8c\u3001\u8ba8\u8bba\u751f\u6d3b\u8bdd\u9898\uff09\uff0c\u5e76\u8868\u8fbe\u5b66\u6210\u540e\u201c\u53ef\u4ee5\u7ed9\u73ed\u73ed\u514d\u8d39\u5e2e\u5fd9\u201d\u7684\u610f\u613f\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u5df2\u5b8c\u6210\u524d\u671f\u8bfe\u7a0b\u652f\u4ed8\uff0c\u5e76\u4e8e4\u67088\u65e5\u5b8c\u6210\u540e\u671f\u8fdb\u9636\u8bfe\uff0894\u671f\u5feb\u73ed\uff09\u652f\u4ed8\u3002**\u901a\u8fc7**\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u7528\u6237\u4e3a\u5b9d\u5988\uff0c\u804a\u5929\u8bb0\u5f55\u4e2d\u672a\u63d0\u53ca\u4e0e\u914d\u5076\u6216\u5bb6\u4eba\u5546\u8bae\u8d2d\u8bfe\u8fc7\u7a0b\uff0c\u51b3\u7b56\u8fc5\u901f\u4e14\u81ea\u4e3b\u3002**\u5b58\u5728\u5bb6\u5ead\u51b3\u7b56\u6743\u98ce\u9669**\uff0c\u9700\u8865\u5145\u6838\u67e5\u3002\n*   **\u6b65\u9aa41\uff1a\u52a8\u673a\u7eaf\u5ea6**\uff1aB\u7c7b\uff08\u6df7\u5408\u52a8\u673a\uff09\u3002\u4ee5\u660e\u786e\u7684\u804c\u4e1a\u53d8\u73b0\uff08\u540e\u671f\u5c31\u4e1a\uff09\u4e3a\u4e3b\u8981\u9a71\u52a8\uff0c\u517c\u5177\u4e2a\u4eba\u5174\u8da3\u63a2\u7d22\u3002\n*   **\u6b65\u9aa42\uff1a\u8d44\u6e90\u5e95\u5ea7**\uff1aB\u7c7b\uff08\u4e2d\u7b49\u8d44\u6e90\uff09\u3002\u5177\u5907\u57fa\u7840\u5b66\u4e60\u6761\u4ef6\uff08\u8bbe\u5907\u3001\u57fa\u7840\u80fd\u529b\uff09\uff0c\u4f46\u4e3b\u8981\u53d7\u9650\u4e8e**\u788e\u7247\u5316\u65f6\u95f4**\u3002\n*   **\u6b65\u9aa43\uff1a\u5fc3\u7406\u5f39\u6027**\uff1aA\u7c7b\uff08\u9ad8\u5f39\u6027\uff09\u3002\u5b66\u4e60\u6295\u5165\u5ea6\u9ad8\uff0c\u4e92\u52a8\u79ef\u6781\uff0c\u53cd\u9988\u63a5\u53d7\u5ea6\u597d\uff0c\u5177\u5907\u8f83\u5f3a\u7684\u81ea\u4e3b\u5b66\u4e60\u548c\u89e3\u51b3\u95ee\u9898\u80fd\u529b\u3002\n*   **\u7efc\u5408\u5224\u5b9a**\uff1a**A-B-B\u578b\u7528\u6237**\u3002\u9ad8\u5f39\u6027\u3001\u6df7\u5408\u52a8\u673a\u3001\u4e2d\u7b49\u8d44\u6e90\u3002\u6838\u5fc3\u7279\u5f81\u662f**\u7406\u6027\u52a1\u5b9e\u3001\u76ee\u6807\u660e\u786e\u3001\u5b66\u4e60\u80fd\u529b\u5f3a\u4f46\u65f6\u95f4\u53d7\u9650\u7684\u5b9d\u5988**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b\uff1aT4 \u7406\u6027\u52a1\u5b9e\u6d3e**\n    *   **\u6838\u5fc3\u7279\u5f81**\uff1a\u5c06\u5b66\u4e60\u89c6\u4e3a\u6295\u8d44\uff0c\u8ffd\u6c42\u660e\u786e\u7684\u6295\u5165\u4ea7\u51fa\u6bd4\u548c\u77ed\u671f\u6280\u80fd\u53d8\u73b0\u3002\u51b3\u7b56\u57fa\u4e8e\u5b9e\u7528\u4e3b\u4e49\u5206\u6790\uff08\u5982\u5bf9\u6bd4B\u7ad9\u5b66\u4e60\u4e0e\u5e73\u53f0\u8d44\u6e90\u7684\u5dee\u5f02\uff09\u3002\n    *   **\u884c\u4e3a\u5370\u8bc1**\uff1a\u660e\u786e\u8868\u8fbe\u62a5\u8bfe\u662f\u4e3a\u4e86\u201c\u5de5\u4f5c\u7fa4\u201d\u548c\u201c\u8d44\u6e90\u4eba\u8109\u201d\uff1b\u56e0\u201c\u5bb9\u6613\u89c1\u6210\u6548\u5e76\u4e14\u9a6c\u4e0a\u80fd\u8d5a\u94b1\u201d\u800c\u9009\u62e9\u540e\u671f\u8bfe\u7a0b\uff1b\u5bf9\u8bfe\u7a0b\u8282\u594f\u6709\u660e\u786e\u504f\u597d\uff08\u9009\u62e9\u5feb\u73ed\uff0c\u56e0\u542c\u6162\u8282\u594f\u8bfe\u201c\u7761\u7740\u4e86\u201d\uff09\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4e2d\u4f4e)\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a\u98ce\u9669**\u4f4e**\u3002\u7528\u6237\u5bf9\u5b66\u4e60\u6210\u6548\u6709\u7406\u6027\u8ba4\u77e5\uff08\u201c\u6f14\u64ad\u662f\u9700\u8981\u65f6\u95f4\u4e0d\u65ad\u7ec3\u4e60\u7684\u201d\uff09\uff0c\u4e14\u9009\u62e9\u4e86\u81ea\u8ba4\u66f4\u64c5\u957f\u7684\u6280\u672f\u65b9\u5411\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a\u98ce\u9669**\u4f4e**\u3002\u4e24\u6b21\u8d2d\u8bfe\u51b3\u7b56\u679c\u65ad\uff0c\u672a\u8868\u73b0\u51fa\u4ef7\u683c\u72b9\u8c6b\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a\u98ce\u9669**\u4e2d**\u3002**\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u5b9d\u5988\u8eab\u4efd\u5bfc\u81f4\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\uff0c\u957f\u671f\u575a\u6301\u53ef\u80fd\u9762\u4e34\u6311\u6218\u3002\n    4.  **\u5185\u5bb9/\u670d\u52a1\u4e0d\u6ee1**\uff1a\u98ce\u9669**\u4f4e**\u3002\u76ee\u524d\u4e92\u52a8\u79ef\u6781\uff0c\u5bf9\u73ed\u73ed\u670d\u52a1\u53cd\u9988\u53ca\u65f6\uff0c\u4e14\u4e3b\u52a8\u5bfb\u6c42\u5e2e\u52a9\u3002\n    5.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a\u98ce\u9669**\u4e2d**\u3002**\u5173\u952e\u672a\u77e5\u98ce\u9669**\u3002\u81ea\u4e3b\u51b3\u7b56\u8fc5\u901f\uff0c\u4f46\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\uff0c\u5b58\u5728\u6f5c\u5728\u9690\u60a3\u3002\n    6.  **\u88ab\u8bf1\u5bfc\u6d88\u8d39**\uff1a\u98ce\u9669**\u4f4e**\u3002\u9500\u552e\u8fc7\u7a0b\u672a\u89c1\u5938\u5927\u627f\u8bfa\uff0c\u7528\u6237\u51b3\u7b56\u57fa\u4e8e\u81ea\u8eab\u5206\u6790\uff08\u8d44\u6e90\u3001\u53d8\u73b0\u8def\u5f84\uff09\u3002\n    7.  **\u7ade\u54c1/\u66ff\u4ee3\u65b9\u6848**\uff1a\u98ce\u9669**\u4f4e**\u3002\u7528\u6237\u5df2\u660e\u786e\u8ba4\u77e5\u5e73\u53f0\u63d0\u4f9b\u7684\u201c\u8d44\u6e90\u4eba\u8109\u201d\u662f\u5176\u9009\u62e9\u7684\u5173\u952e\u5dee\u5f02\u70b9\u3002\n*   **\u7efc\u5408\u98ce\u9669\u7b49\u7ea7**\uff1a**\u4f4e**\u3002\u4e3b\u8981\u98ce\u9669\u96c6\u4e2d\u4e8e**\u65f6\u95f4\u53ef\u6301\u7eed\u6027**\u4e0e**\u5bb6\u5ead\u77e5\u60c5\u652f\u6301**\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u9500\u552e\u884c\u4e3a**\uff1a\u57fa\u672c\u5408\u89c4\u3002\u9500\u552e\u4e3b\u8981\u56de\u5e94\u9700\u6c42\uff0c\u5f3a\u8c03\u5de5\u4f5c\u7fa4\u8d44\u6e90\u4e0e\u5b66\u4e60\u4ef7\u503c\uff0c\u672a\u89c1\u8fc7\u5ea6\u627f\u8bfa\u6216\u5236\u9020\u7126\u8651\u3002\n*   **\u5173\u952e\u96f7\u533a**\uff1a\n    *   **\u3010\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5\u7f3a\u5931\u3011**\uff1a\u9500\u552e\u672a\u4e3b\u52a8\u8be2\u95ee\u6216\u786e\u8ba4\u201c\u5b9d\u5988\u201d\u5b66\u5458\u7684\u8d2d\u8bfe\u51b3\u7b56\u662f\u5426\u5df2\u83b7\u5f97\u5bb6\u5ead\u6210\u5458\uff08\u5c24\u5176\u662f\u914d\u5076\uff09\u77e5\u60c5\u6216\u652f\u6301\u3002\u8fd9\u662f\u9488\u5bf9\u5df2\u5a5a\u5df2\u80b2\u7528\u6237\u7684\u6838\u5fc3\u5408\u89c4\u98ce\u9669\u70b9\u3002\n    *   \u7528\u6237\u63d0\u53ca\u201c\u63a5\u5a03\u201d\u3001\u201c\u54c4\u5a03\u7761\u201d\u7b49\u5bb6\u5ead\u8d23\u4efb\u4fe1\u606f\uff0c\u9500\u552e\u672a\u8ddf\u8fdb\u786e\u8ba4\u5bb6\u5ead\u652f\u6301\u5ea6\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**\uff1a**\u5339\u914d**\u3002\u7528\u6237\u9009\u62e9\u7684\u201c\u540e\u671f\u5feb\u73ed\u201d\u4e0e\u5176\u201c\u6280\u672f\u53d8\u73b0\u5feb\u201d\u7684\u9700\u6c42\u9ad8\u5ea6\u5951\u5408\uff0c\u4e14\u5176\u7535\u8111\u64cd\u4f5c\u57fa\u7840\u826f\u597d\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**24\u5c0f\u65f6\u5185\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\u4e0e\u652f\u6301\u60c5\u51b5**\u3002\n*   **\u5177\u4f53\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9996\u8981\u4efb\u52a1\uff08\u98ce\u9669\u7ba1\u63a7\uff09**\uff1a\u73ed\u4e3b\u4efb\u9700\u572824\u5c0f\u65f6\u5185\uff0c\u4ee5\u5173\u6000\u53e3\u543b\u79c1\u804a\u7528\u6237\uff0c\u59d4\u5a49\u786e\u8ba4\u672c\u6b21\u62a5\u8bfe\u5bb6\u4eba\u662f\u5426\u77e5\u6653\u5e76\u652f\u6301\u3002\u4f8b\u5982\uff1a\u201c\u770b\u5230\u60a8\u5e73\u65f6\u8981\u7167\u987e\u5b9d\u5b9d\u5f88\u8f9b\u82e6\uff0c\u8fd8\u8fd9\u4e48\u52aa\u529b\u5b66\u4e60\uff0c\u771f\u4f69\u670d\uff01\u60a8\u62a5\u540e\u671f\u73ed\u7684\u4e8b\u60c5\uff0c\u5bb6\u91cc\u4eba\u90fd\u652f\u6301\u5427\uff1f\u8fd9\u6837\u60a8\u5b66\u4e60\u8d77\u6765\u4e5f\u66f4\u5b89\u5fc3~\u201d\n    2.  **\u670d\u52a1\u91cd\u70b9\uff08\u4ef7\u503c\u5f3a\u5316\uff09**\uff1a\n        *   **\u5373\u65f6\u53cd\u9988\u4e0e\u8d44\u6e90\u5bf9\u63a5**\uff1a\u5bf9\u5176\u6280\u672f\u7c7b\u95ee\u9898\uff08\u5982\u8f6f\u4ef6\u64cd\u4f5c\uff09\u7ed9\u4e88\u5feb\u901f\u3001\u4e13\u4e1a\u7684\u89e3\u7b54\uff0c\u5f3a\u5316\u5176\u201c\u9009\u5bf9\u8def\u201d\u7684\u8ba4\u77e5\u3002\n        *   **\u788e\u7247\u5316\u65f6\u95f4\u7ba1\u7406**\uff1a\u63d0\u4f9b\u9002\u5408\u5b9d\u5988\u7684\u65f6\u95f4\u7ba1\u7406\u5efa\u8bae\u548c\u5b66\u4e60\u8ba1\u5212\u6a21\u677f\uff0c\u5e2e\u52a9\u5176\u9ad8\u6548\u5229\u7528\u788e\u7247\u65f6\u95f4\u3002\n        *   **\u65e9\u671f\u6210\u5c31\u611f\u6253\u9020**\uff1a\u5728\u5176\u5b8c\u6210\u7b2c\u4e00\u4e2a\u540e\u671f\u5c0f\u4f5c\u54c1\uff08\u5982\u5bf9\u8f68\u3001\u964d\u566a\uff09\u65f6\uff0c\u7ed9\u4e88\u91cd\u70b9\u8868\u626c\uff0c\u5e76\u5f15\u5bfc\u5206\u4eab\uff0c\u5de9\u56fa\u5b66\u4e60\u4fe1\u5fc3\u3002\n        *   **\u4eba\u8109\u8d44\u6e90\u63d0\u524d\u6e17\u900f**\uff1a\u9002\u65f6\u4ecb\u7ecd\u5de5\u4f5c\u7fa4\u5185\u7684\u6210\u529f\u6848\u4f8b\u6216\u8d44\u6e90\u52a8\u6001\uff0c\u6301\u7eed\u5f3a\u5316\u5176\u62a5\u8bfe\u6838\u5fc3\u8bc9\u6c42\uff08\u8d44\u6e90\uff09\u7684\u4ef7\u503c\u3002\n    3.  **\u957f\u671f\u7ef4\u7cfb**\uff1a\u5c06\u5176\u53d1\u5c55\u4e3a\u73ed\u7ea7\u5185\u7684\u201c\u6280\u672f\u5c0f\u52a9\u624b\u201d\u6216\u79ef\u6781\u5206\u5b50\uff0c\u8d4b\u4e88\u5176\u4e00\u5b9a\u7684\u793e\u7fa4\u89d2\u8272\uff0c\u6ee1\u8db3\u5176\u793e\u4ea4\u4e0e\u5229\u4ed6\u9700\u6c42\uff0c\u589e\u5f3a\u5f52\u5c5e\u611f\u548c\u7c98\u6027\u3002\n\n{\"core_type\": \"T4 \u7406\u6027\u52a1\u5b9e\u6d3e\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"product_match\": \"\u5339\u914d\", \"action\": \"24h\u5185\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\"}";
