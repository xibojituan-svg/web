        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677156783 (\u6635\u79f0\uff1a\u4e4c\u9547\u5fc3\u6709\u6240\u5bbf) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e - \u9648\u96483(\u9648\u8273\u541b) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u9a6c\u62c9\u96c5\u6709\u58f0\u6f14\u64ad\u7cfb\u7edf\u8bfe (\u4ef7\u683c\uff1a7380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u76f4\u63a5\u56de\u590d\u4ef7\u683c\u201c7380\u201d\u5e76\u8fdb\u5165\u7f34\u8d39\u6d41\u7a0b\uff0c\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3002\u9700\u8b66\u60d5\u662f\u5426\u5b58\u5728\u5206\u671f\u6216\u501f\u6b3e\u9690\u60a3\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4e2d/\u9ad8**\u3002\u7528\u6237\u4e3a\u4e2a\u4f53\u6237\uff0c\u81ea\u8ff0\u201c\u4e3b\u4e1a\u538b\u529b\u5927\uff0c\u517c\u804c\u6ca1\u6709\u4ec0\u4e48\u5f71\u54cd\u201d\uff0c\u4e14\u201c\u6bcf\u5929\u534a\u5929\u65f6\u95f4\u6709\u7684\u201d\u3002\u65f6\u95f4\u76f8\u5bf9\u5bbd\u88d5\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u3001\u4f34\u4fa3\u4fe1\u606f\u3002\u6b64\u4e3a**\u9ad8\u98ce\u9669\u76f2\u533a**\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u6709\u5b66\u4e60\u4e92\u52a8\u4e0e\u76ee\u6807\u8868\u8fbe\uff0c\u4f46\u5173\u952e\u652f\u4ed8\u80fd\u529b\u3001\u5bb6\u5ead\u652f\u6301\u3001\u8fc7\u5f80\u632b\u6298\u7ecf\u5386\u7b49\u7ef4\u5ea6\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u660e\u786e\u4ee5\u201c\u8d5a\u94b1\u201d\u4e3a\u7b2c\u4e00\u76ee\u6807\uff0c\u4f46\u5bf9\u5b66\u4e60\u8fc7\u7a0b\u8868\u73b0\u51fa\u914d\u5408\u4e0e\u8010\u5fc3\uff0c\u672a\u8981\u6c42\u77ed\u671f\u66b4\u5bcc\u627f\u8bfa\uff0c\u613f\u610f\u6295\u5165\u65f6\u95f4\u7ec3\u4e60\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c**\u8d5a\u94b1**\u201d (\u5728\u767b\u8bb0\u4fe1\u606f\u4e2d\u586b\u5199)\uff1b> \u201c\u5f88\u597d\u54e6\uff0c\u60f3\u5b66\uff0c\u505a\u5f97\u597d\u7684\u8bdd\uff0c\u4e5f\u4f1a\u8003\u8651\u505a\u5168\u804c\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u4fe1\u606f\u7f3a\u5931]** \u2014 \u672a\u63d0\u53ca\u6536\u5165\u3001\u50a8\u84c4\u6216\u652f\u4ed8\u538b\u529b\u3002\u4e2a\u4f53\u6237\u8eab\u4efd\u73b0\u91d1\u6d41\u4e0d\u7a33\u5b9a\uff0c7380\u5143\u5b66\u8d39\u9700\u6838\u5b9e\u6765\u6e90\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**[\u4e2d/\u9ad8]** \u2014 \u4e2a\u4f53\u6237\uff0c\u4e3b\u4e1a\u538b\u529b\u5927\u4f46\u8868\u793a\u517c\u804c\u4e0d\u5f71\u54cd\uff0c\u4e14\u6709\u201c\u534a\u5929\u65f6\u95f4\u201d\u3002\u65f6\u95f4\u53ef\u63a7\u6027\u8f83\u597d\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u6781\u4f4e/\u4fe1\u606f\u7f3a\u5931]** \u2014 **\u5173\u952e\u98ce\u9669\u70b9**\u3002\u5168\u7a0b\u672a\u63d0\u53ca\u5bb6\u4eba\uff0c\u5b58\u5728\u201c\u9690\u7792\u5077\u62a5\u201d\u6216\u201c\u5355\u8eab\u72ec\u7acb\u201d\u4e24\u79cd\u53ef\u80fd\uff0c\u4f46\u65e0\u6cd5\u8bc1\u5b9e\u652f\u6301\u5ea6\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u89c6\u9891\u6253\u4e0d\u5f00\u3001\u5507\u98a4\u97f3\u3001\u6c14\u6ce1\u97f3\u4e0d\u4f1a\uff09\u4f1a\u4e3b\u52a8\u63d0\u95ee\u5e76\u5c1d\u8bd5\u89e3\u51b3\uff0c\u672a\u8868\u73b0\u51fa\u5d29\u6e83\u6216\u62b1\u6028\u3002\u63a5\u53d7\u6307\u5bfc\uff0c\u6001\u5ea6\u79ef\u6781\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u7b2c\u4e09\u9879\u7684\u5507\u98a4\u97f3\uff0c\u603b\u89c9\u5f97\u4e0d\u5bf9\u201d\uff1b> \u201c\u6c14\u6ce1\u97f3\u7b2c\u4e00\u5929\u4f1a\uff0c\u4e0d\u77e5\u9053\u600e\u4e48\u7684\uff0c\u6628\u5929\u5c31\u4e0d\u4f1a\u4e86\uff0c\u7136\u540e\u770b\u4e86\u89c6\u9891\u8fd8\u662f\u4e0d\u4f1a[\u6342\u8138]\u201d\uff1b\u9500\u552e\u53cd\u9988\uff1a\u201c\u770b\u5230\u4f60\u6bcf\u5929\u90fd\u8ba4\u771f\u4e0a\u8bfe\u3001\u79ef\u6781\u4ea4\u4f5c\u4e1a\uff0c\u771f\u7684\u7279\u522b\u68d2\uff01\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 (\u7126\u8651\u4fdd\u969c)** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a39\u5c81\u4e2a\u4f53\u6237\uff0c\u4e3b\u4e1a\u538b\u529b\u5927\uff0c\u5bfb\u6c42\u4e00\u4efd\u4e0d\u53d7\u5730\u70b9\u9650\u5236\u3001\u80fd\u5e26\u6765\u7a33\u5b9a\u73b0\u91d1\u6d41\u7684\u517c\u804c\u6536\u5165\uff0c\u4ee5\u62b5\u5fa1\u4e3b\u4e1a\u4e0d\u786e\u5b9a\u6027\u5e26\u6765\u7684**\u7ecf\u6d4e\u4e0d\u5b89\u5168\u611f**\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u4e0e\u8def\u5f84\u611f**\u3002\u63d0\u4f9b\u6e05\u6670\u7684\u201c\u65f6\u85aa\u4e66-\u5206\u6210\u4e66-\u5de5\u4f5c\u5ba4\u201d\u6210\u957f\u8def\u5f84\u3001\u5177\u4f53\u7684\u63a5\u5355\u8d44\u6e90\uff08\u5982\u5e08\u59d0\u7684\u5267\u7ec4\u7fa4\uff09\uff0c\u8ba9\u4ed6\u770b\u5230\u901a\u8fc7\u52aa\u529b\u53ef\u8fbe\u6210\u7684\u3001**\u53ef\u9884\u671f\u7684\u7ecf\u6d4e\u56de\u62a5**\uff0c\u4ece\u800c\u7f13\u89e3\u5176\u5bf9\u672a\u6765\u7684\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u52a8\u673a\u4e2d\u7b49\u3001\u8d44\u6e90\u5e95\u5ea7\u5b58\u5728\u5bb6\u5ead\u652f\u6301\u76f2\u533a\u3001\u5fc3\u7406\u5f39\u6027\u4e2d\u7b49) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u578b** (\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u660e\u786e\u7684\u517c\u804c\u53d8\u73b0\uff0c\u4f46\u5bf9\u5b66\u4e60\u8fc7\u7a0b\u6709\u57fa\u672c\u8010\u5fc3\uff0c\u613f\u610f\u9075\u5faa\u89c4\u5219) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u4f46\u5bb6\u5ead\u652f\u6301\u7ef4\u5ea6\u4e3a\u9ad8\u98ce\u9669\u76f2\u533a)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u7b49\u660e\u786e\u7ea2\u7ebf\uff0c\u4f46**\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u672a\u77e5\u662f\u91cd\u5927\u9690\u60a3**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| **\u5bb6\u5ead\u5e72\u9884\u578b** | **[\u9ad8]** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u82e5\u5b66\u8d39\u652f\u51fa\u672a\u83b7\u5bb6\u4eba\u652f\u6301\uff0c\u6216\u5f71\u54cd\u5bb6\u5ead\u5f00\u652f\uff0c\u6781\u6613\u5728\u5f00\u8bfe\u540e\u56e0\u5bb6\u5ead\u77db\u76fe\u5f15\u53d1\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | [\u4f4e] | \u65f6\u95f4\u76f8\u5bf9\u5145\u88d5\uff0c\u4e2a\u4f53\u6237\u65f6\u95f4\u81ea\u4e3b\u6027\u5f3a\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | [\u4f4e] | \u9047\u5230\u95ee\u9898\u4e3b\u52a8\u63d0\u95ee\uff0c\u5fc3\u6001\u8f83\u4e3a\u5e73\u7a33\uff0c\u672a\u8868\u73b0\u51fa\u73bb\u7483\u5fc3\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **[\u4e2d]** | \u4f5c\u4e3aT4\u641e\u94b1\u7ed3\u679c\u578b\uff0c\u82e5\u5728\u8bfe\u7a0b\u4e2d\u671f\uff08\u5982\u7b2c3-4\u5468\uff09\u672a\u770b\u5230\u660e\u786e\u7684\u63a5\u5355\u673a\u4f1a\u6216\u6536\u5165\u6848\u4f8b\uff0c\u53ef\u80fd\u56e0\u9884\u671f\u672a\u8fbe\u800c\u7126\u8651\u3001\u8d28\u7591\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u82e5\u672a\u83b7\u5f97\u5b9e\u9645\u63a5\u5355\u673a\u4f1a\u6216\u6536\u5165\uff0c\u4e14\u5bb6\u5ead\u53cd\u5bf9\u538b\u529b\u6d6e\u73b0\uff0c\u53cc\u91cd\u538b\u529b\u4e0b\u9000\u8d39\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cXX\u54e5/\u59d0\uff0c\u770b\u5230\u4f60\u8bad\u7ec3\u8425\u671f\u95f4\u7279\u522b\u8ba4\u771f\uff0c\u4f5c\u4e1a\u5b8c\u6210\u5f97\u53c8\u5feb\u53c8\u597d\uff0c\u5e08\u59d0\u90fd\u5938\u4f60\u6709\u6f5c\u529b\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u6700\u5927\u7684\u4ef7\u503c\uff0c\u5c31\u662f\u5e2e\u4f60\u628a\u2018\u58f0\u97f3\u8d5a\u94b1\u2019\u8fd9\u6761\u8def\u4ece\u2018\u53ef\u80fd\u2019\u53d8\u6210\u2018\u786e\u5b9a\u2019\u3002\u6211\u4f1a\u91cd\u70b9\u5e2e\u4f60\u5bf9\u63a5\u90a3\u4e9b**\u786e\u5b9a\u6709\u65f6\u85aa**\u7684\u5165\u95e8\u4e66\u5355\uff0c\u54b1\u4eec\u5148\u7a33\u624e\u7a33\u6253\u628a\u7b2c\u4e00\u7b14\u6536\u5165\u62ff\u5230\u624b\uff0c\u6709\u4e86\u6b63\u53cd\u9988\uff0c\u540e\u9762\u5347\u7ea7\u5206\u6210\u4e66\u3001\u751a\u81f3\u81ea\u5df1\u7ec4\u5c40\u5c31\u66f4\u6709\u5e95\u6c14\u4e86\u3002\u4f60\u8fd9\u8fb9\u65f6\u95f4\u5b89\u6392\u4e0a\uff0c\u5bb6\u91cc\u4eba\u90fd\u652f\u6301\u5427\uff1f\u54b1\u4eec\u4e00\u8d77\u628a\u8fd9\u4e8b\u5e72\u6210\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011**\u3002\u6838\u5fc3\u662f\u63d0\u4f9b\u660e\u786e\u7684\u3001\u4f4e\u95e8\u69db\u7684\u65f6\u85aa\u4e66\u5355\u548c\u8bd5\u97f3\u6307\u5bfc\uff0c\u5feb\u901f\u5efa\u7acb\u53d8\u73b0\u6b63\u53cd\u9988\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176T4\u641e\u94b1\u5c5e\u6027\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u786c\u6838\u5b9e\u5e72\u5305(B\u6a21\u5757)\u3011** \u4e2d\u7684 **\u201c\u771f\u5b9e\u6838\u5fc3\u6d3e\u5355\u201d** \u548c **\u201c1v1\u8bd5\u97f3\u6307\u5bfc\u201d**\uff0c\u7528\u5b9e\u9645\u8d44\u6e90\u5835\u4f4f\u5176\u201c\u591a\u4e45\u80fd\u8d5a\u94b1\u201d\u7684\u7126\u8651\u3002**\u8c28\u614e\u4f7f\u7528\u60c5\u7eea\u6309\u6469(C\u6a21\u5757)**\uff0c\u907f\u514d\u8ba9\u5176\u89c9\u5f97\u4e0d\u52a1\u5b9e\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u4ed6\u7a7a\u8c08\u5174\u8da3\u3001\u60c5\u6000\u3001\u957f\u8fdc\u68a6\u60f3**\uff0c\u6240\u6709\u6c9f\u901a\u56f4\u7ed5\u201c\u63a5\u5355\u8def\u5f84\u3001\u65f6\u85aa\u6807\u51c6\u3001\u6210\u529f\u6848\u4f8b\u201d\u5c55\u5f00\u3002\n    2. **\u4e25\u7981\u5728\u672a\u6838\u5b9e\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u524d\uff0c\u5f15\u5bfc\u5176\u8fdb\u884c\u4efb\u4f55\u5347\u5355\u6216\u989d\u5916\u6d88\u8d39**\u3002\n    3. \u907f\u514d\u7ed9\u5176\u8fc7\u4e8e\u590d\u6742\u3001\u77ed\u671f\u5185\u65e0\u6cd5\u53d8\u73b0\u7684\u201c\u70ab\u6280\u201d\u4efb\u52a1\uff0c\u589e\u52a0\u5176\u632b\u8d25\u611f\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5fc5\u987b\u5728\u5176\u901a\u8fc7\u521d\u671f\u63a5\u5355\u83b7\u5f97\u7a33\u5b9a\u6b63\u53cd\u9988\uff0c\u4e14**\u660e\u786e\u5bb6\u5ead\u652f\u6301\u65e0\u865e\u540e**\uff0c\u65b9\u53ef\u8003\u8651\u63a8\u8350\u8fdb\u9636\u8bfe\u7a0b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u8d5a\u94b1**\u201d (\u5728\u201c\u6765\u8bad\u7ec3\u8425\u60f3\u6536\u83b7\u4ec0\u4e48\uff1f\u201d\u95ee\u9898\u4e0b\u7684\u76f4\u63a5\u56de\u7b54)\n2. > \u201c\u4e3b\u4e1a\u538b\u529b\u5927\uff0c\u517c\u804c\u6ca1\u6709\u4ec0\u4e48\u5f71\u54cd\u201d / \u201c\u6bcf\u5929\u534a\u5929\u65f6\u95f4\u6709\u7684\u201d (\u8868\u660e\u5176\u517c\u804c\u52a8\u673a\u6e90\u4e8e\u4e3b\u4e1a\u538b\u529b\uff0c\u4e14\u6709\u65f6\u95f4\u8d44\u6e90)\n3. > \u201c\u5f88\u597d\u54e6\uff0c\u60f3\u5b66\uff0c\u505a\u5f97\u597d\u7684\u8bdd\uff0c\u4e5f\u4f1a\u8003\u8651\u505a\u5168\u804c\u201d (\u76ee\u6807\u660e\u786e\uff0c\u4f46\u6001\u5ea6\u76f8\u5bf9\u52a1\u5b9e\uff0c\u7559\u6709\u201c\u505a\u5f97\u597d\u201d\u7684\u524d\u63d0)\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4 \u641e\u94b1\u7ed3\u679c\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u62b5\u5fa1\u7ecf\u6d4e\u4e0d\u786e\u5b9a\u6027\u7684\u5b89\u5168\u9700\u6c42\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u504f\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5f00\u8425\u5373\u6838\u5b9e\u5bb6\u5ead\u652f\u6301\u5ea6\uff0c\u5e76\u5feb\u901f\u5bf9\u63a5\u771f\u5b9e\u65f6\u85aa\u4e66\u5355\u5efa\u7acb\u6b63\u53cd\u9988\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf+\u786c\u6838\u5b9e\u5e72\u5305\"}\n```";
