        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676984825 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-26 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u7efe\u7efe\u73ed\u73ed\uff08\u5f20\u5a49\u94b0\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3** |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u4f46\u7528\u6237\u63d0\u53ca\u201c\u4eca\u5929\u591c\u73ed\u201d\uff083\u670827\u65e5\uff09\uff0c\u8868\u660e\u5b58\u5728\u8f6e\u73ed\u6216\u975e\u56fa\u5b9a\u4f5c\u606f\uff0c\u65f6\u95f4\u53ef\u80fd\u4e3a\u788e\u7247\u5316\u62fc\u51d1\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u4e2d\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u5bf9\u8bdd\u4e3b\u8981\u56f4\u7ed5\u8bfe\u7a0b\u5b66\u4e60\u3001\u5c0f\u7ec4\u534f\u4f5c\u3001\u6280\u672f\u95ee\u9898\u5c55\u5f00\uff0c\u5173\u4e8e\u4e2a\u4eba\u80cc\u666f\u3001\u652f\u4ed8\u80fd\u529b\u3001\u5bb6\u5ead\u652f\u6301\u7b49\u5173\u952e\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931\uff0c\u9700\u8c28\u614e\u8bc4\u4f30\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u800c\u6765\u3002\u7528\u6237\u5173\u6ce8\u70b9\u9ad8\u5ea6\u805a\u7126\u4e8e\u6280\u80fd\u63d0\u5347\u3001\u56e2\u961f\u534f\u4f5c\u3001\u4f5c\u54c1\u6253\u78e8\u548c\u884c\u4e1a\u7406\u89e3\uff0c\u800c\u975e\u77ed\u671f\u53d8\u73b0\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u8fd8\u60f3\u8bd5\u8bd5\u753b\u672c\u5462\uff5e\u5b8c\u5de5\u4e86\u90fd[\u6342\u8138]\u201d > \u201c\u6211\u5728\u601d\u8003\u4e2a\u95ee\u9898\uff0c\u540e\u671f\u662f\u4e0d\u662f\u8d8a\u591a\u8d8a\u597d\uff0c\u8fc7\u591a\u662f\u4e0d\u662f\u628a\u753b\u9762\u56fa\u5b9a\u4e86\uff0c\u5265\u593a\u4e86\u542c\u4f17\u60f3\u8c61\u7684\u7a7a\u95f4\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u65e0\u652f\u4ed8\u65b9\u5f0f\u3001\u7ecf\u6d4e\u538b\u529b\u8ba8\u8bba\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u7528\u6237\u80fd\u79ef\u6781\u53c2\u4e0e\u5c0f\u7ec4\u6d3b\u52a8\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u4e3b\u52a8\u63d0\u95ee\uff0c\u4f46\u63d0\u53ca\u201c\u591c\u73ed\u201d\uff0c\u8868\u660e\u65f6\u95f4\u9700\u534f\u8c03\uff0c\u5e76\u975e\u5b8c\u5168\u5bbd\u88d5\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u8f6f\u4ef6\u6253\u4e0d\u5f00\uff09\u4e3b\u52a8\u8be2\u95ee\u5e76\u89e3\u51b3\uff1b\u5bf9\u5b66\u4e60\u96be\u70b9\uff08\u6587\u672c\u5206\u6790\uff09\u6709\u56f0\u60d1\u4f46\u6001\u5ea6\u79ef\u6781\uff1b\u80fd\u4e3b\u52a8\u9f13\u52b1\u3001\u5e2e\u52a9\u540c\u5b66\uff0c\u8868\u73b0\u51fa\u6781\u5f3a\u7684\u81ea\u4e3b\u6027\u548c\u56e2\u961f\u7cbe\u795e\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6446\u6b63\u5fc3\u6001\uff5e\u4e0d\u4e2d\u662f\u6b63\u5e38\uff0c\u4e2d\u4e86\u662f\u60ca\u559c\u554a\u201d > \u201c@\u5361\u5e03\u5947\u7f18\u2014\u91cd\u5e86\u2014\u5973\u64ad \u522b\u6c14\u9981\uff0c\u6211\u662f\u89c9\u5f97\u4f60\u7684\u5f88\u597d\u542c\u7684\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u4e13\u4e1a\u80fd\u529b\u7cbe\u8fdb\u7684\u6e34\u671b\uff0c\u4ee5\u53ca\u5728\u4e00\u4e2a\u6709\u5171\u540c\u76ee\u6807\u7684\u793e\u7fa4\u4e2d\u83b7\u5f97\u8ba4\u53ef\u3001\u5efa\u7acb\u5f71\u54cd\u529b\u7684\u9700\u6c42\u3002\u4ed6\u4eab\u53d7\u4f5c\u4e3a\u56e2\u961f\u6838\u5fc3\uff08\u201c\u8001\u5927\u201d\uff09\u7ec4\u7ec7\u534f\u8c03\u3001\u8f93\u51fa\u65b9\u6cd5\u8bba\uff08\u59824\u67088\u65e5\u63d0\u51fa\u7684\u6210\u7ec4\u6d41\u7a0b\uff09\u5e76\u5e2e\u52a9\u4ed6\u4eba\u7684\u8fc7\u7a0b\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u8d4b\u4e88\u5176\u201c\u5708\u5c42\u9886\u8896\u201d\u7684\u8eab\u4efd\u611f\u548c\u4e13\u4e1a\u4e0a\u7684\u6df1\u5ea6\u8ba4\u53ef**\u3002\u8ba9\u4ed6\u611f\u53d7\u5230\u81ea\u5df1\u662f\u793e\u7fa4\u4e2d\u4e0d\u53ef\u6216\u7f3a\u7684\u201c\u9ad8\u624b\u201d\u548c\u201c\u7ec4\u7ec7\u8005\u201d\uff0c\u5e76\u4e3a\u5176\u63d0\u4f9b\u66f4\u6df1\u5165\u7684\u884c\u4e1a\u8ba4\u77e5\u548c\u6280\u80fd\u5207\u78cb\u673a\u4f1a\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \u2b50A \u7c7b |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T1 \u5708\u517b\u9886\u8896\u578b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u5f53\u524d\u884c\u4e3a\u672a\u663e\u793a\u5bb6\u5ead\u963b\u529b\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5f3a\uff0c\u5b66\u4e60\u4e3b\u52a8\u6027\u9ad8\uff0c\u80fd\u9002\u5e94\u591c\u73ed\u8282\u594f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u6781\u9ad8\uff0c\u4e50\u4e8e\u52a9\u4eba\uff0c\u6297\u632b\u6298\u80fd\u529b\u5f3a\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u82e5\u957f\u671f\uff08\u5982\u8bfe\u7a0b\u7ed3\u675f\u540e\uff09\u65e0\u6cd5\u83b7\u5f97\u7b26\u5408\u5176\u9884\u671f\u7684\u3001\u80fd\u4f53\u73b0\u5176\u201c\u9886\u8896\u201d\u4ef7\u503c\u7684\u5b9e\u8df5\u673a\u4f1a\u6216\u8fdb\u9636\u901a\u9053\uff08\u5982\u9ad8\u8d28\u91cf\u9879\u76ee\u3001\u5185\u90e8\u63a8\u8350\u3001\u5708\u5c42\u8eab\u4efd\uff09\uff0c\u53ef\u80fd\u56e0\u6210\u5c31\u611f\u7f3a\u5931\u800c\u5931\u671b\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u8bfe\u7a0b\u4e2d\u540e\u671f\u81f3\u7ed3\u4e1a\u540e**\u3002\u5f53\u57fa\u7840\u6280\u80fd\u5b66\u4e60\u9636\u6bb5\u7ed3\u675f\uff0c\u82e5\u7f3a\u4e4f\u6709\u6311\u6218\u6027\u7684\u5b9e\u6218\u9879\u76ee\u6216\u9ad8\u9636\u5708\u5c42\u5165\u53e3\uff0c\u5176\u201c\u9886\u8896\u201d\u9700\u6c42\u65e0\u6cd5\u88ab\u6ee1\u8db3\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4fa0\u4e4b\u5927\u8005\uff08\u7528\u6237\u6635\u79f0\uff09\uff0c\u770b\u4e86\u4f60\u5728\u7fa4\u91cc\u7684\u53d1\u8a00\uff0c\u611f\u89c9\u4f60\u4e0d\u4ec5\u6709\u60f3\u6cd5\uff0c\u8fd8\u5f88\u4f1a\u5e26\u52a8\u56e2\u961f\u3002\u54b1\u4eec\u73ed\u6b63\u9700\u8981\u4f60\u8fd9\u6837\u6709\u9886\u5bfc\u529b\u7684\u540c\u5b66\uff0c\u540e\u7eed\u7684\u5b9e\u6218\u9879\u76ee\u548c\u5c0f\u7ec4\u6d3b\u52a8\uff0c\u671f\u5f85\u4f60\u591a\u5e26\u5e26\u8282\u594f\uff0c\u628a\u4f60\u7684\u7ecf\u9a8c\u5206\u4eab\u7ed9\u5927\u5bb6\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf**\u3011\u3002\u6838\u5fc3\u662f\u8d4b\u4e88\u5176\u201c\u5185\u90e8\u9886\u8896\u201d\u8eab\u4efd\uff0c\u63d0\u4f9b\u8d85\u51fa\u666e\u901a\u5b66\u5458\u7684\u53c2\u4e0e\u611f\u548c\u51b3\u7b56\u6743\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n    1.  **\u3010\u73ed\u59d4\u8d4b\u80fd\u4efb\u547d\u6743\u3011**\uff1a\u7b2c\u4e00\u65f6\u95f4\u4efb\u547d\u4e3a\u5c0f\u7ec4\u957f\u6216\u73ed\u59d4\uff0c\u8ba9\u5176\u8d1f\u8d23\u7ec4\u7ec7\u6d3b\u52a8\u3001\u5206\u4eab\u7ecf\u9a8c\u3002\n    2.  **\u3010\u5185\u90e8\u79c1\u8463\u4f1a/\u9ad8\u9636\u7814\u8ba8\u7fa4\u51c6\u5165\u3011**\uff1a\u9080\u8bf7\u8fdb\u5165\u53ea\u6709\u4f18\u79c0\u5b66\u5458\u6216\u201c\u9886\u8896\u201d\u578b\u5b66\u5458\u7684\u5708\u5b50\uff0c\u53c2\u4e0e\u66f4\u6df1\u5ea6\u7684\u5185\u5bb9\u8ba8\u8bba\u548c\u9879\u76ee\u9884\u89c8\u3002\n    3.  **\u3010\u4e13\u5bb61v1\u7b54\u7591\uff08\u5b9a\u5411\uff09\u3011**\uff1a\u9488\u5bf9\u4ed6\u63d0\u51fa\u7684\u4e13\u4e1a\u6df1\u5ea6\u95ee\u9898\uff08\u5982\u8bc4\u4e66\u98ce\u683c\u3001\u540e\u671f\u54f2\u5b66\uff09\uff0c\u5b89\u6392\u8d44\u6df1\u8001\u5e08\u8fdb\u884c\u9488\u5bf9\u6027\u89e3\u7b54\uff0c\u6ee1\u8db3\u5176\u94bb\u7814\u9700\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5c06\u5176\u89c6\u4e3a\u666e\u901a\u5b66\u5458\u8fdb\u884c\u6807\u51c6\u5316\u7ba1\u7406\u3002\u907f\u514d\u53ea\u7ed9\u5176\u5e03\u7f6e\u57fa\u7840\u4f5c\u4e1a\uff0c\u800c\u4e0d\u7ed9\u5176\u53d1\u6325\u7ec4\u7ec7\u3001\u6307\u5bfc\u80fd\u529b\u7684\u821e\u53f0\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u4ed6\u662f\u9ad8\u4ef7\u503c\u7528\u6237\uff0c\u5bf9\u6df1\u5ea6\u5185\u5bb9\u3001\u9ad8\u9636\u8bad\u7ec3\u8425\u3001\u7ebf\u4e0b\u6d3b\u52a8\uff08\u5982\u6e38\u5b66\u3001\u79c1\u8463\u4f1a\uff09\u6709\u5f3a\u4ed8\u8d39\u6f5c\u529b\u3002\u63a8\u4ecb\u65f6\u5e94\u5f3a\u8c03\u201c\u5708\u5c42\u5347\u7ea7\u201d\u3001\u201c\u9886\u8896\u8d4b\u80fd\u201d\u3001\u201c\u6df1\u5ea6\u8d44\u6e90\u94fe\u63a5\u201d\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u8bf4\u70b9\u81ea\u5df1\u7684\u60f3\u6cd5\uff0c\u5927\u5bb6\u6210\u7ec4\u4e4b\u540e\u30021\u3001\u5148\u786e\u5b9a\u7ec4\u5185\u6210\u5458\u58f0\u97f3\u7279\u70b9\uff1b2\u3001\u8f93\u51fa\u9898\u6750\uff0c\u6295\u7968\u786e\u5b9a\u9898\u6750\uff1b3\u3001\u5c11\u6253\u5b57\u8ba8\u8bba\uff0c\u591a\u5f00\u4f1a\u8bed\u97f3\u8ba8\u8bba\uff0c\u591apia\u51e0\u904d\uff0c\u7ec4\u5458\u4e92\u76f8\u70b9\u8bc4\uff0c\u7ea0\u6b63\u4e0d\u8db3\uff1b4\u3001\u5f55\u5e72\u97f3\uff0c\u5927\u5bb6\u5171\u540c\u5ba1\u542c\uff0c\u786e\u5b9a\u5e72\u97f3\uff1b5\u3001AA\u540e\u671f\u652f\u6301\u3002\u7ed3\u675f\uff01\u201d **(\u5c55\u73b0\u7ec4\u7ec7\u529b\u4e0e\u9886\u5bfc\u601d\u7ef4)**\n2. > \u201c@\u83b2\u5b50_Renko-\u5317\u4eac-\u5973\u64ad \u8001\u5927\uff0c\u54b1\u4eec\u7ec4\u5b9e\u6218\u540e\u9762\u600e\u4e48\u5b89\u6392\u7684\u554a\uff1f\u201d **(\u4e3b\u52a8\u627f\u62c5\u7ec4\u7ec7\u8005\u89d2\u8272\uff0c\u5173\u5fc3\u56e2\u961f\u8fdb\u5ea6)**\n3. > \u201c\u6211\u5728\u601d\u8003\u4e2a\u95ee\u9898\uff0c\u540e\u671f\u662f\u4e0d\u662f\u8d8a\u591a\u8d8a\u597d\uff0c\u8fc7\u591a\u662f\u4e0d\u662f\u628a\u753b\u9762\u56fa\u5b9a\u4e86\uff0c\u5265\u593a\u4e86\u542c\u4f17\u60f3\u8c61\u7684\u7a7a\u95f4\u201d **(\u8fdb\u884c\u8d85\u8d8a\u6280\u672f\u5c42\u9762\u7684\u884c\u4e1a\u54f2\u5b66\u601d\u8003\uff0c\u8ffd\u6c42\u81ea\u6211\u5b9e\u73b0)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T1 \u5708\u517b\u9886\u8896\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u4e13\u4e1a\u793e\u7fa4\u4e2d\u83b7\u5f97\u5c0a\u91cd\u3001\u5f71\u54cd\u529b\u4e0e\u81ea\u6211\u5b9e\u73b0\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u8d4b\u4e88\u5176\u201c\u5185\u90e8\u9886\u8896\u201d\u8eab\u4efd\uff0c\u63d0\u4f9b\u5708\u5c42\u7279\u6743\u4e0e\u9ad8\u9636\u6311\u6218\uff0c\u907f\u514d\u8ba9\u5176\u611f\u5230\u201c\u5927\u6750\u5c0f\u7528\u201d\u3011**\u3002\n\n```json\n{\"core_type\": \"T1 \u5708\u517b\u9886\u8896\u578b\", \"maslow_need\": \"\u7b2c\u56db\u5c42\u5c0a\u91cd\u9700\u6c42\u4e0e\u7b2c\u4e94\u5c42\u81ea\u6211\u5b9e\u73b0\", \"risk_level\": \"\u4f4e\", \"target_product_line\": \"\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\"}\n```";
        document.getElementById('content').innerHTML = marked.parse(markdownText);
