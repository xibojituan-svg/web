    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u4e0e\u98ce\u9669\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u7f3a\u4e4f\u652f\u4ed8\u4fe1\u606f\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u3001\u5177\u4f53\u8bfe\u7a0b\u4ea7\u54c1\u4fe1\u606f\u3001\u660e\u786e\u7684\u53d8\u73b0\u9884\u671f\u4e0e\u65f6\u95f4\u6295\u5165\u8ba1\u5212\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a**\u9ad8\u5174\u8da3\u63a2\u7d22\u578b**\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6709\u58f0\u4e66\u521b\u4f5c\u3001AI\u751f\u6210\u97f3\u4e50/\u97f3\u6548\u3001\u5c0f\u8bf4\u5199\u4f5c\u7684\u6d53\u539a\u5174\u8da3\u548c\u81ea\u53d1\u63a2\u7d22\u884c\u4e3a\uff08\u5982\u81ea\u5236\u9694\u97f3\u68da\u3001\u7814\u7a76\u7248\u6743\u3001\u5c1d\u8bd5AI\u751f\u6210\uff09\u3002\u5b66\u4e60\u52a8\u673a\u6e90\u4e8e\u5185\u5728\u521b\u4f5c\u6b32\u548c\u5a31\u4e50\uff0c\u800c\u975e\u660e\u786e\u3001\u529f\u5229\u7684\u53d8\u73b0\u76ee\u6807\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4e2d\u7b49\u504f\u4e0b**\u3002\u663e\u793a\u51fa\u4e00\u5b9a\u7684\u6280\u672f\u63a2\u7d22\u80fd\u529b\uff08\u4f7f\u7528AI\u5de5\u5177\u3001\u7814\u7a76\u97f3\u9891\u5904\u7406\uff09\u548c\u521b\u4f5c\u57fa\u7840\uff08\u5199\u4f5c\u3001\u5f55\u97f3\uff09\u3002\u4f46**\u7f3a\u4e4f\u660e\u786e\u7684\u53d8\u73b0\u6e20\u9053\u8ba4\u77e5**\uff08\u5bf9\u5546\u7528\u7248\u6743\u62c5\u5fe7\u3001\u5bf9\u6709\u58f0\u4e66\u5e73\u53f0\u89c4\u5219\u4e0d\u719f\uff09\uff0c\u4e14\u5bf9\u8bdd\u4e2d\u672a\u63d0\u53ca\u4efb\u4f55\u7ecf\u6d4e\u6295\u5165\u80fd\u529b\u6216\u8bbe\u5907\u9ad8\u7aef\u6027\uff0c\u8d44\u6e90\u66f4\u591a\u4f53\u73b0\u5728\u65f6\u95f4\u4e0e\u5174\u8da3\u6295\u5165\u4e0a\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a**\u8f83\u9ad8**\u3002\u6c9f\u901a\u98ce\u683c\u8f7b\u677e\u3001\u5e7d\u9ed8\u3001\u5bcc\u6709\u60f3\u8c61\u529b\uff08\u5982\u201c\u9759\u6084\u6084\u641e\u4e8b\u60c5\u201d\u3001\u201c\u5413\u6b7b\u4e00\u4e2a\u80c6\u5c0f\u7684\u201d\uff09\u3002\u80fd\u63a5\u53d7\u53cd\u9988\uff08\u5982\u8001\u5e08\u6307\u51fa\u6c14\u606f\u95ee\u9898\uff09\uff0c\u5e76\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\u3002\u867d\u6709\u77ed\u6682\u81ea\u6211\u6000\u7591\uff08\u201c\u60c5\u611f\u9694\u79bb\u201d\uff09\uff0c\u4f46\u80fd\u5feb\u901f\u8c03\u6574\u5e76\u5c1d\u8bd5\u65b0\u65b9\u6cd5\uff08\u201c\u5b66\u5b66\u53d1\u75af\u201d\uff09\uff0c\u6574\u4f53\u5fc3\u6001\u5f00\u653e\u3001\u6297\u538b\u6027\u8f83\u597d\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a**\u65e0\u6cd5\u5224\u65ad**\u3002\u8bb0\u5f55\u4e2d\u672a\u63d0\u53ca\u4efb\u4f55\u652f\u4ed8\u3001\u8ba2\u5355\u3001\u4ef7\u683c\u54a8\u8be2\u4fe1\u606f\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u65e0\u6cd5\u5224\u65ad**\u3002\u8bb0\u5f55\u4e2d\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u6216\u914d\u5076\u7684\u8ba8\u8bba\u3002\n*   **\u6b65\u9aa41-4\u5224\u5b9a**\uff1a\u57fa\u4e8e\u73b0\u6709\u4fe1\u606f\uff0c\u7528\u6237\u66f4\u63a5\u8fd1**B\u7c7b\uff08\u5174\u8da3\u63a2\u7d22\u8005\uff09**\u3002\u6838\u5fc3\u9a71\u52a8\u662f\u5174\u8da3\u4e0e\u521b\u4f5c\u4e50\u8da3\uff0c\u6709\u5b66\u4e60\u884c\u52a8\uff0c\u4f46\u7f3a\u4e4f\u660e\u786e\u7684\u804c\u4e1a\u5316\u6216\u5f3a\u53d8\u73b0\u5bfc\u5411\u7684\u76ee\u6807\u89c4\u5212\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n**T5 \u5174\u8da3\u63a2\u7d22\u578b\u521b\u4f5c\u8005**\n*   **\u7279\u5f81\u543b\u5408**\uff1a\u5bf9\u97f3\u9891\u5236\u4f5c\u3001\u5199\u4f5c\u3001AI\u5de5\u5177\u62b1\u6709\u5f3a\u70c8\u597d\u5947\u5fc3\uff0c\u4e50\u4e8e\u5c1d\u8bd5\u548c\u5206\u4eab\u3002\u5b66\u4e60\u8fc7\u7a0b\u672c\u8eab\u5373\u662f\u4e50\u8da3\u6765\u6e90\u3002\u53d8\u73b0\u8bc9\u6c42\u6a21\u7cca\uff0c\u66f4\u5173\u6ce8\u521b\u4f5c\u8fc7\u7a0b\u7684\u4f53\u9a8c\u548c\u6210\u679c\u7684\u72ec\u7279\u6027\uff08\u5982\u5bfb\u627e\u201c\u5fc3\u4eea\u7684\u80cc\u666f\u97f3\u4e50\u201d\uff09\u3002\n*   **\u504f\u5dee\u63d0\u793a**\uff1a\u672a\u8868\u73b0\u51faT4\uff08\u6280\u80fd\u53d8\u73b0\u8005\uff09\u5bf9\u5e02\u573a\u3001\u5355\u4ef7\u3001\u63a5\u5355\u6e20\u9053\u7684\u6025\u5207\u5173\u6ce8\uff1b\u4e5f\u672a\u8868\u73b0\u51faT6\uff08\u9ad8\u7126\u8651\u4ece\u4f17\u8005\uff09\u7684\u7126\u8651\u548c\u7ed3\u679c\u6bd4\u8f83\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\uff08\u98ce\u9669\u7b49\u7ea7\uff1a\u4f4e\uff09\n*   **\u6839\u56e01\uff08\u6548\u679c\u4e0d\u7b26\uff09**\uff1a**\u4f4e\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u5b66\u4e60\u6548\u679c\u6709\u5fc3\u7406\u51c6\u5907\uff08\u201c\u5404\u6709\u5404\u7684\u7406\u89e3\u201d\uff09\uff0c\u4e14\u66f4\u4eab\u53d7\u8fc7\u7a0b\u3002\n*   **\u6839\u56e02\uff08\u9884\u671f\u843d\u5dee\uff09**\uff1a**\u4e2d\u98ce\u9669**\u3002**\u9700\u8b66\u60d5**\u3002\u867d\u7136\u5f53\u524d\u65e0\u5f3a\u53d8\u73b0\u9884\u671f\uff0c\u4f46\u82e5\u8bfe\u7a0b\u5ba3\u4f20\u8fc7\u5ea6\u5f3a\u8c03\u201c\u901f\u6210\u201d\u3001\u201c\u9ad8\u85aa\u201d\uff0c\u53ef\u80fd\u5728\u672a\u6765\u5f15\u53d1\u201c\u5b66\u5b8c\u65e0\u6cd5\u63a5\u5355\u201d\u7684\u843d\u5dee\u611f\u3002\n*   **\u6839\u56e03\uff08\u670d\u52a1\u7f3a\u5931\uff09**\uff1a**\u4f4e\u98ce\u9669**\u3002\u7528\u6237\u4e0e\u9500\u552e/\u73ed\u73ed\u4e92\u52a8\u79ef\u6781\uff0c\u4e3b\u52a8\u63d0\u95ee\uff0c\u672a\u62b1\u6028\u670d\u52a1\u3002\n*   **\u6839\u56e04\uff08\u7ecf\u6d4e\u538b\u529b\uff09**\uff1a**\u65e0\u6cd5\u8bc4\u4f30**\u3002\u65e0\u652f\u4ed8\u4fe1\u606f\u3002\n*   **\u6839\u56e05\uff08\u5bb6\u5ead\u53cd\u5bf9\uff09**\uff1a**\u65e0\u6cd5\u8bc4\u4f30**\u3002\n*   **\u6839\u56e06\uff08\u65f6\u95f4\u51b2\u7a81\uff09**\uff1a**\u4f4e\u98ce\u9669**\u3002\u7528\u6237\u65f6\u95f4\u4f3c\u4e4e\u8f83\u4e3a\u81ea\u7531\uff08\u201c\u6ca1\u53bb\u4e0a\u73ed\u201d\uff09\uff0c\u4e14\u80fd\u6295\u5165\u65f6\u95f4\u521b\u4f5c\u3002\n*   **\u6839\u56e07\uff08\u5174\u8da3\u8f6c\u79fb\uff09**\uff1a**\u4e2d\u98ce\u9669**\u3002**\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u7528\u6237\u5174\u8da3\u5e7f\u6cdb\uff08\u6709\u58f0\u4e66\u3001\u97f3\u4e50\u3001\u5199\u4f5c\u3001\u77ed\u89c6\u9891\uff09\uff0c\u601d\u7ef4\u53d1\u6563\u5feb\uff08\u201c\u8131\u7f30\u7684\u91ce\u9a6c\u201d\uff09\uff0c\u6613\u88ab\u65b0\u4e8b\u7269\u5438\u5f15\uff0c\u5b58\u5728\u5b66\u4e60\u4e2d\u9014\u8f6c\u79fb\u5174\u8da3\u7684\u53ef\u80fd\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u8fc7\u5ea6\u627f\u8bfa**\uff1a\u9500\u552e\u5728\u7248\u6743\u98ce\u9669\u4e0a\u7ed9\u51fa\u4e86\u52a1\u5b9e\u5efa\u8bae\uff08\u201c\u4e0d\u8981\u505a\u97f3\u4e50\uff0c\u97f3\u6548\u8fd8\u53ef\u4ee5\u201d\uff09\uff0c\u672a\u53d1\u73b0\u5938\u5927AI\u751f\u6210\u65e0\u98ce\u9669\u6216\u627f\u8bfa\u4fdd\u5e95\u6536\u5165\u3002\n*   **\u7126\u8651\u8d29\u5356**\uff1a\u672a\u53d1\u73b0\u5229\u7528\u4fb5\u6743\u6848\u4f8b\u8fc7\u5ea6\u6050\u5413\u7528\u6237\u4ee5\u4fc3\u5355\u3002\n*   **\u4fe1\u606f\u900f\u660e**\uff1a\u8bb0\u5f55\u4e2d\u672a\u6d89\u53ca\u8bfe\u7a0b\u4ef7\u683c\u3001\u670d\u52a1\u7ec6\u5219\u7b49\u5173\u952e\u6d88\u8d39\u4fe1\u606f\uff0c**\u6b64\u90e8\u5206\u7f3a\u5931\uff0c\u65e0\u6cd5\u8bc4\u4f30**\u3002\n*   **\u603b\u4f53\u8bc4\u4ef7**\uff1a\u73b0\u6709\u5bf9\u8bdd\u7247\u6bb5\u4e2d\uff0c\u9500\u552e\u56de\u5e94\u8f83\u4e3a\u4e13\u4e1a\u548c\u8c28\u614e\uff0c\u672a\u53d1\u73b0\u660e\u663e\u4f26\u7406\u8fdd\u89c4\u3002\u4f46**\u56e0\u7f3a\u4e4f\u552e\u524d\u5173\u952e\u4fe1\u606f\u6c9f\u901a\u8bb0\u5f55\uff0c\u6574\u4f53\u5408\u89c4\u6027\u5b58\u7591**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d**\uff1a**\u504f\u5dee**\u3002\u7528\u6237\u662f\u5178\u578b\u7684\u5174\u8da3\u9a71\u52a8\u578b\u521b\u4f5c\u8005\uff0c\u4e0e\u5f3a\u8c03\u201c\u6280\u80fd\u53d8\u73b0\u201d\u3001\u201c\u5feb\u901f\u63a5\u5355\u201d\u7684\u804c\u4e1a\u6280\u80fd\u7c7b\u8bfe\u7a0b\u5b58\u5728\u76ee\u6807\u504f\u5dee\u3002\u66f4\u5339\u914d**\u521b\u4f5c\u8d4b\u80fd\u7c7b\u3001\u5174\u8da3\u793e\u7fa4\u7c7b**\u4ea7\u54c1\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**\u9996\u5468\u5f3a\u5316\u5174\u8da3\u94fe\u63a5\u4e0e\u521b\u4f5c\u6210\u5c31\u611f**\n    *   **\u884c\u52a8\u6307\u5357**\uff1a\n        1.  **\u5174\u8da3\u951a\u5b9a**\uff1a\u9996\u6b21\u6c9f\u901a\u91cd\u70b9\u4e86\u89e3\u5176\u521b\u4f5c\u504f\u597d\uff08\u60ac\u7591\u3001\u6050\u6016\u3001\u4eba\u6587\uff1f\uff09\uff0c\u5e76\u4e3a\u5176\u5339\u914d\u5408\u9002\u7684\u7ec3\u4e60\u7d20\u6750\u6216\u8f7b\u91cf\u7ea7\u521b\u4f5c\u9879\u76ee\uff08\u5982\u793e\u7fa4\u6709\u58f0\u5267\u5c0f\u89d2\u8272\uff09\uff0c\u5f3a\u5316\u201c\u5b66\u4ee5\u81f4\u8da3\u201d\u7684\u4f53\u9a8c\u3002\n        2.  **\u9884\u671f\u7ba1\u7406**\uff1a\u59d4\u5a49\u6f84\u6e05\u8bfe\u7a0b\u6838\u5fc3\u662f\u6280\u80fd\u6559\u5b66\uff0c\u53d8\u73b0\u53d6\u51b3\u4e8e\u4e2a\u4eba\u52aa\u529b\u3001\u5e02\u573a\u673a\u9047\u548c\u6301\u7eed\u521b\u4f5c\uff0c\u964d\u4f4e\u5176\u5bf9\u201c\u5b66\u5b8c\u5373\u53d8\u73b0\u201d\u7684\u4e0d\u5207\u5b9e\u9645\u671f\u671b\u3002\n        3.  **\u63d0\u4f9b\u5c55\u793a\u821e\u53f0**\uff1a\u9f13\u52b1\u5176\u5728\u793e\u7fa4\u5185\u5206\u4eabAI\u751f\u6210\u7684\u97f3\u4e50\u3001\u5199\u4f5c\u7247\u6bb5\u6216\u5f55\u97f3\u4f5c\u54c1\uff0c\u7ed9\u4e88\u79ef\u6781\u53cd\u9988\uff0c\u6ee1\u8db3\u5176\u5c55\u793a\u548c\u83b7\u5f97\u8ba4\u540c\u7684\u9700\u6c42\u3002\n        4.  **\u89c2\u5bdf\u5174\u8da3\u7a33\u5b9a\u6027**\uff1a\u5bc6\u5207\u5173\u6ce8\u5176\u5174\u8da3\u70b9\u662f\u5426\u5feb\u901f\u8f6c\u79fb\u3002\u82e5\u53d1\u73b0\u5176\u70ed\u60c5\u51cf\u9000\uff0c\u53ca\u65f6\u4ecb\u5165\uff0c\u5f15\u5bfc\u5176\u805a\u7126\u4e00\u4e2a\u7ec6\u5206\u65b9\u5411\u8fdb\u884c\u6df1\u5ea6\u5c1d\u8bd5\u3002\n\n{\"core_type\": \"T5 \u5174\u8da3\u63a2\u7d22\u578b\u521b\u4f5c\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4f4e\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u9996\u5468\u5f3a\u5316\u5174\u8da3\u94fe\u63a5\u4e0e\u521b\u4f5c\u6210\u5c31\u611f\"}";
