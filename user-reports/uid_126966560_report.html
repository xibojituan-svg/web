    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u7f3a\u4e4f\u652f\u4ed8\u4fe1\u606f\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u3001\u5177\u4f53\u8bfe\u7a0b\u4fe1\u606f\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u3001\u660e\u786e\u7684\u5b66\u4e60\u76ee\u6807\u4e0e\u53d8\u73b0\u9884\u671f\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a**\u9ad8\u60c5\u611f\u5bc4\u6258\uff0c\u4f4e\u53d8\u73b0\u9a71\u52a8**\u3002\u5b66\u4e60\u662f\u91cd\u8981\u7684\u7cbe\u795e\u652f\u67f1\uff08\u201c\u4ee5\u8bfb\u4e66\u4e3a\u652f\u6491\u201d\uff09\uff0c\u7528\u4e8e\u5bf9\u6297\u5b64\u72ec\u3001\u5bb6\u5ead\u538b\u529b\u4e0e\u5065\u5eb7\u56f0\u6270\u3002\u5bf9\u58f0\u97f3\u672c\u8eab\u6709\u70ed\u60c5\uff08\u201c\u8bfb\u4e66\u6709\u763e\u201d\uff09\uff0c\u4f46\u65e0\u660e\u786e\u804c\u4e1a\u6216\u53d8\u73b0\u8bc9\u6c42\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u65f6\u95f4\u7cbe\u529b\u4e25\u91cd\u4e0d\u8db3\uff0c\u5065\u5eb7\u8d44\u6e90\u9ad8\u5371**\u3002\u9700\u7167\u987e84\u5c81\u5931\u80fd\u8001\u4f34\uff0c\u81ea\u8eab\u6709\u4e25\u91cd\u5fc3\u7ede\u75db\u75c5\u53f2\uff08\u9700\u5e38\u5907\u901f\u6548\u6551\u5fc3\u4e38\uff09\uff0c\u8fd1\u671f\u9891\u7e41\u53d1\u4f5c\u3002**\u5bb6\u5ead\u652f\u6301\u7cfb\u7edf\u8584\u5f31**\uff08\u4e0e\u8001\u4f34\u5173\u7cfb\u7d27\u5f20\uff0c\u4e0d\u613f\u9ebb\u70e6\u5b50\u5973\uff09\u3002\u5b58\u5728\u7ecf\u6d4e\u538b\u529b\u6697\u793a\uff08\u201c\u4ed6\u662f\u4e2a\u7a77\u5149\u86cb\u201d\uff09\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a**\u9ad8\u81ea\u5c0a\u4e0e\u5f3a\u6c42\u5b8c\u7f8e\u503e\u5411\uff0c\u4f46\u73b0\u5b9e\u538b\u529b\u5df2\u8d85\u8f7d**\u3002\u81ea\u6211\u8981\u6c42\u6781\u9ad8\uff08\u201c\u8981\u5f3a\u7684\u4eba\uff0c\u4e0d\u8ddf\u4e0a\u8282\u594f\u53d7\u4e0d\u4e86\u201d\uff09\uff0c\u6e34\u671b\u8ba4\u53ef\uff08\u201c\u6211\u5f88\u4f18\u79c0\u201d\uff09\u3002\u4f46\u5728\u7167\u62a4\u538b\u529b\u4e0e\u5065\u5eb7\u5371\u673a\u4e0b\uff0c\u5df2\u51fa\u73b0**\u660e\u663e\u7684\u7126\u8651\u4e0e\u5d29\u6e83\u4fe1\u53f7**\uff08\u591a\u6b21\u56e0\u8eab\u4f53\u539f\u56e0\u63d0\u51fa\u9000\u5b66\uff09\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a**\u4fe1\u606f\u7f3a\u5931**\u3002\u65e0\u652f\u4ed8\u8bb0\u5f55\u3001\u652f\u4ed8\u4eba\u4fe1\u606f\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u7f3a\u5931**\u3002\u672a\u63d0\u53ca\u5b50\u5973\u6216\u914d\u5076\u5bf9\u5b66\u4e60\u3001\u6d88\u8d39\u7684\u6001\u5ea6\u3002\n*   **\u6b65\u9aa41-4\u5224\u5b9a**\uff1a\n    *   **\u52a8\u673a (A/B)**\uff1a\u4ecb\u4e8eA\uff08\u5174\u8da3/\u6210\u957f\uff09\u4e0eB\uff08\u60c5\u611f\u966a\u4f34/\u9003\u907f\u73b0\u5b9e\uff09\u4e4b\u95f4\uff0c\u66f4\u504f\u5411**B\u7c7b\uff08\u60c5\u611f\u5bc4\u6258\u578b\uff09**\u3002\n    *   **\u8d44\u6e90 (C/D)**\uff1a**\u660e\u786eD\u7c7b\uff08\u8d44\u6e90\u4e25\u91cd\u4e0d\u8db3\uff09**\u3002\u65f6\u95f4\u3001\u5065\u5eb7\u3001\u5bb6\u5ead\u652f\u6301\u5747\u4eae\u7ea2\u706f\u3002\n    *   **\u5fc3\u7406 (C/D)**\uff1a**\u660e\u786eD\u7c7b\uff08\u5fc3\u7406\u5f39\u6027\u6fd2\u4e34\u5d29\u6e83\uff09**\u3002\u9ad8\u538b\u529b\u4e0b\u5df2\u53cd\u590d\u51fa\u73b0\u9000\u5b66\u5ff5\u5934\u3002\n    *   **\u7efc\u5408\u5224\u5b9a**\uff1a**B-D-D**\u3002\u9ad8\u60c5\u611f\u9700\u6c42\u9a71\u52a8\uff0c\u4f46\u8d44\u6e90\u4e0e\u5fc3\u7406\u72b6\u6001\u5747\u5904\u4e8e\u9ad8\u5371\u4e0d\u5339\u914d\u72b6\u6001\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b\uff1aT5 \u60c5\u611f\u5bc4\u6258\u578b\u5b66\u5458**\u3002\n    *   **\u6838\u5fc3\u7279\u5f81**\uff1a\u5c06\u5b66\u4e60\u4f5c\u4e3a\u9003\u79bb\u73b0\u5b9e\u56f0\u5883\u3001\u5bfb\u6c42\u793e\u7fa4\u8ba4\u540c\u4e0e\u60c5\u611f\u652f\u6301\u7684\u7cbe\u795e\u5bc4\u6258\u3002\u5b66\u4e60\u884c\u4e3a\u672c\u8eab\u662f\u76ee\u7684\uff0c\u800c\u975e\u5b9e\u73b0\u5176\u4ed6\u76ee\u6807\u7684\u624b\u6bb5\u3002\n    *   **\u9ad8\u5ea6\u543b\u5408\u70b9**\uff1a\u5b66\u4e60\u662f\u7cbe\u795e\u652f\u6491\uff08\u201c\u4ee5\u8bfb\u4e66\u4e3a\u652f\u6491\u201d\uff09\u3001\u5728\u793e\u7fa4\u4e2d\u6781\u5ea6\u6d3b\u8dc3\uff08\u9891\u7e41\u95ee\u5019\u3001\u4e92\u52a8\uff09\u3001\u5bf9\u8001\u5e08\u6709\u5f3a\u70c8\u60c5\u611f\u4f9d\u8d56\uff08\u201c\u62b1\u7d27\u5927\u817f\u201d\uff09\u3001\u73b0\u5b9e\u751f\u6d3b\u538b\u529b\u5de8\u5927\uff08\u7167\u62a4\u3001\u5065\u5eb7\u3001\u5a5a\u59fb\u95ee\u9898\uff09\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\uff08\u6781\u9ad8\uff09\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a\u98ce\u9669\u4f4e\u3002\u7528\u6237\u66f4\u5728\u610f\u8fc7\u7a0b\u4e0e\u966a\u4f34\u3002\n    2.  **\u65f6\u95f4\u7cbe\u529b\u51b2\u7a81**\uff1a**\u98ce\u9669\u6781\u9ad8**\u3002**\u7167\u62a4\u538b\u529b\u4e0e\u7a81\u53d1\u5065\u5eb7\u5371\u673a\u662f\u4e3b\u8981\u9000\u8d39\u9a71\u52a8\u56e0\u7d20**\u3002\n    3.  **\u4ea7\u54c1\u670d\u52a1\u4e0d\u7b26**\uff1a\u98ce\u9669\u4e2d\u3002\u9500\u552e\u5df2\u53cd\u590d\u5f3a\u8c03\u65e0\u5f3a\u5236\u6253\u5361\u3001\u65e0\u8003\u6838\u3001\u53ef\u770b\u56de\u653e\uff0c\u4f46\u7528\u6237\u4ecd\u56e0\u201c\u8ddf\u4e0d\u4e0a\u8282\u594f\u201d\u611f\u5230\u538b\u529b\u3002\n    4.  **\u7ecf\u6d4e\u538b\u529b**\uff1a\u98ce\u9669\u4e2d\u3002\u6709\u7ecf\u6d4e\u538b\u529b\u6697\u793a\uff0c\u4f46\u975e\u5f53\u524d\u9996\u8981\u9000\u8d39\u7406\u7531\u3002\n    5.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u98ce\u9669\u9ad8**\u3002**\u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u7528\u6237\u5bb6\u5ead\u5904\u5883\u590d\u6742\uff0c\u662f\u6f5c\u5728\u91cd\u5927\u98ce\u9669\u70b9**\u3002\n    6.  **\u7ade\u54c1/\u66ff\u4ee3\u65b9\u6848**\uff1a\u98ce\u9669\u4f4e\u3002\n    7.  **\u91cd\u5927\u4eba\u751f\u53d8\u6545**\uff1a**\u98ce\u9669\u6781\u9ad8**\u3002**\u7528\u6237\u81ea\u8eab\u4e25\u91cd\u5fc3\u810f\u75c5\u53f2\u53ca\u6025\u6027\u53d1\u4f5c\u662f\u6700\u5927\u4e0d\u786e\u5b9a\u6027\u98ce\u9669**\uff0c\u53ef\u80fd\u76f4\u63a5\u5bfc\u81f4\u65e0\u6cd5\u7ee7\u7eed\u5b66\u4e60\u6216\u5f15\u53d1\u66f4\u4e25\u91cd\u540e\u679c\u3002\n*   **\u7efc\u5408\u98ce\u9669\u7b49\u7ea7**\uff1a**\u6781\u9ad8**\u3002\u5065\u5eb7\u98ce\u9669\u662f\u538b\u5012\u6027\u56e0\u7d20\uff0c\u53e0\u52a0\u5bb6\u5ead\u7167\u62a4\u538b\u529b\uff0c\u9000\u8d39\u53ef\u80fd\u6027\u6781\u5927\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u4f26\u7406\u7ea2\u7ebf**\uff1a\n    *   **\u3010\u5df2\u89e6\u53d1\u3011** \u7528\u6237\u5df2\u660e\u786e\u8868\u8fbe\u56e0\u5065\u5eb7\u539f\u56e0\uff08\u5fc3\u7ede\u75db\uff09\u8981\u6c42\u9000\u5b66\uff0c\u9500\u552e\u672a\u7b2c\u4e00\u65f6\u95f4\u54cd\u5e94\u9000\u8d39\u8bf7\u6c42\uff0c\u800c\u662f\u8bd5\u56fe\u5b89\u629a\u633d\u7559\uff08\u201c\u5148\u8fc7\u5b8c\u4eca\u5929\u201d\u3001\u201c\u770b\u770b\u6062\u590d\u6548\u679c\u201d\uff09\u3002**\u5728\u7528\u6237\u660e\u786e\u56e0\u8eab\u4f53\u5065\u5eb7\u95ee\u9898\u8981\u6c42\u9000\u51fa\u65f6\uff0c\u5e94\u4f18\u5148\u4fdd\u969c\u5176\u5065\u5eb7\u6743\u76ca\uff0c\u800c\u975e\u8bfe\u7a0b\u7559\u5b58**\u3002\n    *   **\u3010\u9ad8\u98ce\u9669\u3011** \u7528\u6237\u5904\u4e8e**\u9ad8\u9f84\u3001\u6709\u4e25\u91cd\u57fa\u7840\u75be\u75c5\u3001\u9700\u957f\u671f\u7167\u62a4\u4ed6\u4eba**\u7684\u72b6\u6001\uff0c\u7ee7\u7eed\u9ad8\u5f3a\u5ea6\u5b66\u4e60\uff08\u7528\u6237\u81ea\u8ff0\u201c\u54ac\u7259\u5207\u9f7f\u7684\u5b66\u4e60\u201d\u3001\u201c\u5ff5\u4e66\u5230\u51cc\u6668\u4e09\u70b9\u201d\uff09\u53ef\u80fd\u52a0\u5267\u5176\u5065\u5eb7\u98ce\u9669\u3002\u9500\u552e\u867d\u6709\u5173\u5fc3\uff08\u201c\u6ce8\u610f\u8eab\u4f53\u201d\uff09\uff0c\u4f46\u672a\u5145\u5206\u8bc4\u4f30\u5176\u53c2\u4e0e\u8bfe\u7a0b\u7684\u9002\u5b9c\u6027\u3002\n*   **\u9500\u552e\u5408\u89c4**\uff1a\u9500\u552e\u6c9f\u901a\u6001\u5ea6\u79ef\u6781\u3001\u63d0\u4f9b\u60c5\u611f\u652f\u6301\uff0c\u7b26\u5408\u670d\u52a1\u89c4\u8303\u3002\u4f46\u5728\u5904\u7406\u5065\u5eb7\u76f8\u5173\u7684\u9000\u8d39\u8bc9\u6c42\u65f6\uff0c\u6d41\u7a0b\u5b58\u5728\u7455\u75b5\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**\uff1a**\u4e25\u91cd\u9519\u914d**\u3002\u7528\u6237\u5f53\u524d\u7684\u751f\u547d\u72b6\u6001\uff08\u5065\u5eb7\u9ad8\u5371\u3001\u7167\u62a4\u538b\u529b\uff09\u4e0e\u9700\u8981\u6295\u5165\u4e00\u5b9a\u65f6\u95f4\u3001\u7cbe\u529b\u7684\u5b66\u4e60\u4ea7\u54c1\u4e25\u91cd\u4e0d\u5339\u914d\u3002\u8bfe\u7a0b\u5df2\u6210\u4e3a\u5176\u65b0\u7684\u538b\u529b\u6e90\u800c\u975e\u89e3\u538b\u65b9\u5f0f\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**\u7acb\u5373\u542f\u52a8\u5065\u5eb7\u4f18\u5148\u9000\u8d39\u6d41\u7a0b**\u3002\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u7d27\u6025\u4ecb\u5165**\uff1a\u7acb\u5373\u8054\u7cfb\u7528\u6237\uff0c\u9996\u8981\u5173\u5207\u5176\u5065\u5eb7\u72b6\u51b5\uff0c\u5f3a\u70c8\u5efa\u8bae\u5176\u5c31\u533b\u68c0\u67e5\uff0c\u5e76**\u660e\u786e\u652f\u6301\u5176\u56e0\u5065\u5eb7\u539f\u56e0\u6682\u505c\u6216\u9000\u51fa\u5b66\u4e60\u7684\u51b3\u5b9a**\u3002\n    2.  **\u7eff\u8272\u901a\u9053\u9000\u8d39**\uff1a\u4e3b\u52a8\u544a\u77e5\u5e76\u534f\u52a9\u529e\u7406\u9000\u8d39\u6d41\u7a0b\uff0c\u5f3a\u8c03\u201c\u5065\u5eb7\u7b2c\u4e00\u201d\uff0c\u6001\u5ea6\u6e29\u6696\u4f46\u7acb\u573a\u575a\u51b3\uff0c\u907f\u514d\u4efb\u4f55\u53ef\u80fd\u5f15\u53d1\u7528\u6237\u5185\u759a\u6216\u72b9\u8c6b\u7684\u633d\u7559\u8bdd\u672f\u3002\n    3.  **\u60c5\u611f\u5b89\u629a\u4e0e\u8f6c\u79fb**\uff1a\u80af\u5b9a\u5176\u5b66\u4e60\u70ed\u60c5\u4e0e\u4f18\u79c0\u54c1\u8d28\uff0c\u5efa\u8bae\u5176\u73b0\u9636\u6bb5\u4ee5\u4f11\u517b\u4e3a\u4e3b\uff0c\u53ef\u5c06\u5176\u5f15\u5bfc\u81f3\u66f4\u8f7b\u677e\u3001\u65e0\u538b\u529b\u7684\u514d\u8d39\u5185\u5bb9\u6216\u793e\u7fa4\uff0c\u7ef4\u6301\u60c5\u611f\u8fde\u63a5\uff0c\u4f46\u89e3\u9664\u5b66\u4e60\u4efb\u52a1\u538b\u529b\u3002\n    4.  **\u98ce\u9669\u62a5\u5907**\uff1a\u5c06\u6b64\u6848\u4f8b\u4f5c\u4e3a\u9ad8\u98ce\u9669\u6848\u4f8b\u5411\u4e0a\u7ea7\u53ca\u98ce\u63a7\u90e8\u95e8\u62a5\u5907\uff0c\u8bb0\u5f55\u7528\u6237\u5065\u5eb7\u53ca\u5bb6\u5ead\u60c5\u51b5\uff0c\u907f\u514d\u540e\u7eed\u7ea0\u7eb7\u3002\n    5.  **\u7edd\u5bf9\u7981\u6b62**\uff1a\u7981\u6b62\u4efb\u4f55\u5f62\u5f0f\u7684\u7eed\u8d39\u3001\u5347\u5355\u63a8\u8350\uff1b\u7981\u6b62\u9f13\u52b1\u5176\u201c\u575a\u6301\u201d\u3001\u201c\u514b\u670d\u56f0\u96be\u201d\u3002\n\n{\"core_type\": \"T5 \u60c5\u611f\u5bc4\u6258\u578b\u5b66\u5458\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"product_match\": \"\u9519\u914d\", \"action\": \"\u7acb\u5373\u542f\u52a8\u5065\u5eb7\u4f18\u5148\u9000\u8d39\u6d41\u7a0b\"}";
