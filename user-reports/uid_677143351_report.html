    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a (UID: 677143351)\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u4e2d\u7b49\u504f\u4e0a**\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6709\u58f0\u6f14\u64ad\u7684\u5174\u8da3\uff08\u201cPia\u620f\u597d\u597d\u73a9\u201d\uff09\uff0c\u5bf9\u5177\u4f53\u5de5\u79cd\uff08\u753b\u672c\u3001\u5ba1\u542c\uff09\u6709\u660e\u786e\u504f\u597d\uff0c\u5e76\u79ef\u6781\u5b8c\u6210\u4f5c\u4e1a\u3002\u4f46**\u53d8\u73b0\u9a71\u52a8**\u4fe1\u53f7\u540c\u6837\u663e\u8457\uff08\u5173\u6ce8\u201c\u624b\u673a\u80fd\u505a\u201d\u7684\u517c\u804c\u3001\u5bf9\u201c\u7b2c\u4e00\u6876\u91d1\u201d\u76f4\u64ad\u79ef\u6781\u56de\u5e94\uff09\uff0c\u5174\u8da3\u4e0e\u53d8\u73b0\u52a8\u673a\u6df7\u5408\uff0c\u7eaf\u5ea6\u4e00\u822c\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u4e2d\u7b49**\u3002\u7528\u6237\u62e5\u6709\u57fa\u7840\u5b66\u4e60\u8bbe\u5907\uff08\u624b\u673a\uff09\uff0c\u80fd\u6309\u65f6\u5b8c\u6210\u7ebf\u4e0a\u4efb\u52a1\u3002\u4f46\u804a\u5929\u8bb0\u5f55\u672a\u900f\u9732\u5176\u804c\u4e1a\u3001\u7a33\u5b9a\u6536\u5165\u3001\u5bb6\u5ead\u652f\u6301\u3001\u6bcf\u65e5\u53ef\u56fa\u5b9a\u6295\u5165\u7684\u5b66\u4e60\u65f6\u95f4\u7b49\u5173\u952e\u8d44\u6e90\u4fe1\u606f\uff0c**\u4fe1\u606f\u4e0d\u8db3**\u3002\u4ec5\u63d0\u53ca\u201c\u6015\u5435\u5230\u670b\u53cb\u7761\u89c9\u201d\uff0c\u6697\u793a\u53ef\u80fd\u4e3a\u5408\u79df\u6216\u5bbf\u820d\u73af\u5883\uff0c**\u5f55\u97f3\u7269\u7406\u6761\u4ef6\u5b58\u5728\u6f5c\u5728\u9650\u5236**\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u4e2d\u7b49**\u3002\u7528\u6237\u914d\u5408\u5ea6\u9ad8\uff0c\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\uff08\u201c\u6536\u5230\u201d\u3001\u201c\u597d\u7684\u201d\uff09\uff0c\u5bf9\u9500\u552e\u9f13\u52b1\u6709\u6b63\u5411\u53cd\u9988\uff08\u201c\u6211\u4f1a\u52aa\u529b\u7684\u201d\uff09\u3002\u80fd\u63a5\u53d7\u53cd\u9988\uff08\u627f\u8ba4\u81ea\u5df1\u201c\u5ff5\u7684\u6de1\u6de1\u7684\u201d\uff09\u3002\u4f46\u7f3a\u4e4f\u4e3b\u52a8\u63d0\u95ee\u548c\u6df1\u5ea6\u4ea4\u6d41\uff0c\u884c\u4e3a\u8f83\u4e3a\u88ab\u52a8\uff0c\u6297\u538b\u80fd\u529b\u4e0e\u957f\u671f\u575a\u6301\u7684\u97e7\u6027\u672a\u77e5\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u6267\u884c\n\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u4e8e4\u67088\u65e5\u652f\u4ed82380\u5143\uff08\u201c2380\u652f\u4ed8\u5b9d\u201d\uff09\uff0c\u5b8c\u6210\u62a5\u540d\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u3001\u914d\u5076\u6216\u5171\u540c\u51b3\u7b56\u8005\u7684\u4fe1\u606f\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u4e3a\u4e2a\u4eba\u72ec\u7acb\u51b3\u7b56\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u4e0e\u8d44\u6e90\u521d\u7b5b (A/B)**: \u52a8\u673a\u6df7\u5408\uff08\u5174\u8da3+\u53d8\u73b0\uff09\uff0c\u8d44\u6e90\u60c5\u51b5\u4e0d\u660e\uff0c\u4f46\u5df2\u652f\u4ed8\u3002\u6682\u5f52\u4e3a **B\u7c7b\uff08\u9700\u89c2\u5bdf\uff09**\u3002\n*   **\u6b65\u9aa42 - \u627f\u8bfa\u5ea6\u4e0e\u884c\u52a8\u529b (C/D)**: \u7528\u6237\u884c\u52a8\u529b\u5c1a\u53ef\uff08\u6309\u65f6\u4ea4\u4f5c\u4e1a\u3001\u53c2\u52a0\u6d3b\u52a8\uff09\uff0c\u5bf9\u9500\u552e\u5f15\u5bfc\u7684\u201c\u901a\u5173\u201d\u3001\u201c\u5165\u884c\u201d\u8def\u5f84\u8868\u73b0\u51fa\u8ddf\u968f\u610f\u613f\uff08\u201c\u5e0c\u671b\u80fd\u52aa\u529b\u8ddf\u968f\u5e08\u59d0\u7684\u811a\u6b65\u201d\uff09\u3002\u627f\u8bfa\u5ea6\u57fa\u4e8e\u77ed\u671f\u8bad\u7ec3\u8425\u4e92\u52a8\u5efa\u7acb\uff0c\u5bf9\u957f\u671f\u7cfb\u7edf\u5b66\u4e60\u7684\u627f\u8bfa\u5f85\u89c2\u5bdf\u3002\u5224\u5b9a\u4e3a **C\u7c7b\uff08\u6613\u5f15\u5bfc\u8ddf\u968f\u8005\uff09**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n\n*   **\u5339\u914d\u539f\u578b: T5 \u52a1\u5b9e\u63a2\u7d22\u8005**\u3002\n    *   **\u4f9d\u636e**: \u52a8\u673a\u6df7\u5408\uff08\u5174\u8da3\u4e0e\u8d5a\u94b1\u517c\u987e\uff09\uff0c\u5bf9\u5177\u4f53\u3001\u53ef\u64cd\u4f5c\u3001\u4f4e\u95e8\u69db\u7684\u53d8\u73b0\u65b9\u5f0f\uff08\u753b\u672c\u3001\u5ba1\u542c\uff09\u8868\u73b0\u51fa\u660e\u786e\u5174\u8da3\u3002\u884c\u4e3a\u4e0a\u8ddf\u968f\u9500\u552e\u6307\u5f15\uff0c\u5b8c\u6210\u89c4\u5b9a\u52a8\u4f5c\uff0c\u5bfb\u6c42\u786e\u5b9a\u6027\u7684\u8def\u5f84\uff08\u201c\u624b\u673a\u80fd\u505a\u201d\uff09\u3002\u7f3a\u4e4f\u5f3a\u70c8\u7684\u81ea\u6211\u8868\u8fbe\u6216\u827a\u672f\u8ffd\u6c42\u9a71\u52a8\uff0c\u4e5f\u672a\u89c1\u6781\u9ad8\u7684\u7126\u8651\u6216\u6295\u673a\u5fc3\u6001\uff0c\u7b26\u5408T5\u7279\u5f81\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n\n*   **\u603b\u4f53\u98ce\u9669\u7b49\u7ea7: \u4e2d**\n*   **\u9010\u9879\u6392\u67e5**:\n    1.  **\u9884\u671f\u7ba1\u7406\u504f\u5dee**: **\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u5feb\u901f\u6323\u5230\u7b2c\u4e00\u6876\u91d1\u201d\u3001\u201c\u5165\u9a7b\u5e73\u53f0\u63a5\u5355\u201d\u3001\u201c\u7248\u6743\u4e66\u201d\u3001\u201c\u8fdb\u5267\u7ec4\u201d\uff0c\u53ef\u80fd\u5851\u9020\u4e86**\u77ed\u671f\u5185\u5373\u53ef\u8f7b\u677e\u53d8\u73b0\u7684\u9884\u671f**\u3002\u4e0e\u540e\u7eed\u7cfb\u7edf\u5b66\u4e60\u7684\u957f\u671f\u6027\u3001\u6280\u80fd\u6253\u78e8\u7684\u8270\u82e6\u6027\u6613\u4ea7\u751f\u843d\u5dee\u3002\n    2.  **\u6548\u679c\u611f\u77e5\u6ede\u540e**: **\u4e2d\u98ce\u9669**\u3002\u6f14\u64ad\u6280\u80fd\u63d0\u5347\u9700\u8981\u65f6\u95f4\uff0c\u82e5\u521d\u671f\u8bd5\u97f3\u5c61\u6b21\u5931\u8d25\u6216\u63a5\u5355\u4e0d\u987a\uff0c\u6613\u4ea7\u751f\u632b\u8d25\u611f\u3002\n    3.  **\u8d44\u6e90\u652f\u6301\u4e0d\u8db3**: **\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5f55\u97f3\u73af\u5883\u53ef\u80fd\u53d7\u9650\uff08\u6015\u5435\u5230\u670b\u53cb\uff09\uff0c\u4e14\u672a\u63d0\u53ca\u662f\u5426\u6709\u4e13\u4e1a\u8bbe\u5907\u6295\u5165\u8ba1\u5212\u3002**\u7269\u7406\u6761\u4ef6\u53ef\u80fd\u6210\u4e3a\u5b9e\u64cd\u74f6\u9888**\u3002\n    4.  **\u5bb6\u5ead\u51b3\u7b56\u51b2\u7a81**: **\u4fe1\u606f\u4e0d\u8db3\uff0c\u9700\u6838\u67e5**\u3002\n    5.  **\u4ea7\u54c1\u9002\u914d\u9519\u4f4d**: **\u4f4e\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u8bfe\u7a0b\u5185\u5bb9\uff08\u65c1\u767d\u3001\u89d2\u8272\u97f3\uff09\u6709\u53c2\u4e0e\u548c\u53cd\u9988\uff0c\u6682\u672a\u53d1\u73b0\u660e\u663e\u4e0d\u9002\u914d\u3002\n    6.  **\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa**: **\u4e2d\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u5b58\u5728**\u8fc7\u5ea6\u6e32\u67d3\u201c\u8d44\u6e90\u201d\u3001\u201c\u5e26\u98de\u201d\u503e\u5411**\uff08\u201c\u6211\u5e26\u4f60\u201d\u3001\u201c\u8ba9\u4f60\u58f0\u97f3\u5347\u503c\u201d\u3001\u201c\u6b63\u6101\u7740\u5b89\u6392\u5341\u51e0\u672c\u65b0\u624b\u4e66\u7684\u62db\u52df\u201d\uff09\uff0c\u53ef\u80fd\u8ba9\u7528\u6237\u5bf9\u5e73\u53f0\u8d44\u6e90\u548c\u4e2a\u4eba\u6276\u6301\u4ea7\u751f\u4e0d\u5207\u5b9e\u9645\u7684\u671f\u5f85\u3002\n    7.  **\u4f26\u7406\u4e0e\u5408\u89c4\u98ce\u9669**: \u89c1\u7b2c5\u90e8\u5206\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n\n*   **\u4e3b\u8981\u96f7\u533a**:\n    *   **\u3010\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u6a21\u7cca\u5316\u6536\u76ca\u3011**\uff1a\u9500\u552e\u4f7f\u7528\u201c\u5feb\u901f\u6323\u5230\u7b2c\u4e00\u6876\u91d1\u201d\u3001\u201c\u5e26\u4f60\u5165\u884c\u201d\u3001\u201c\u8ba9\u4f60\u58f0\u97f3\u5347\u503c\u201d\u3001\u201c\u7a33\u5b9a\u6536\u5165\u8fdb\u8d26\u201d\u7b49\u8bdd\u672f\uff0c**\u53ef\u80fd\u6a21\u7cca\u4e86\u6280\u80fd\u5b66\u4e60\u3001\u4e2a\u4eba\u52aa\u529b\u4e0e\u6700\u7ec8\u6536\u5165\u4e4b\u95f4\u7684\u56e0\u679c\u5173\u7cfb\uff0c\u5b58\u5728\u8bf1\u5bfc\u6027\u5ba3\u4f20\u5acc\u7591**\u3002\n    *   **\u3010\u8425\u9020\u7a00\u7f3a\u4e0e\u7d27\u8feb\u611f\u3011**\uff1a\u9891\u7e41\u4f7f\u7528\u201c\u6700\u540e\u4e00\u5929\u201d\u3001\u201c\u622a\u6b62\u65f6\u95f4\u201d\u3001\u201c\u540d\u989d\u5df2\u5360\u4e0b\u201d\u3001\u201c\u73b0\u573a\u53d1\u4f18\u60e0\u5238\u201d\u7b49\u8bdd\u672f\uff0c\u5c5e\u4e8e\u9ad8\u538b\u4fc3\u5355\u5e38\u89c1\u624b\u6bb5\u3002\n    *   **\u3010\u60c5\u611f\u6346\u7ed1\u3011**\uff1a\u4f7f\u7528\u201c\u5a18\u5bb6\u4eba\u201d\u3001\u201c\u4fe1\u4efb\u6211\u201d\u3001\u201c\u600e\u6562\u8f9c\u8d1f\u201d\u7b49\u8bdd\u672f\u5efa\u7acb\u60c5\u611f\u7ebd\u5e26\uff0c\u53ef\u80fd\u5f71\u54cd\u7528\u6237\u7406\u6027\u51b3\u7b56\u3002\n*   **\u5408\u89c4\u6027**: \u6d41\u7a0b\u4e0a\u5b8c\u6210\u4e86\u4f5c\u4e1a\u3001\u6253\u5361\u3001\u901a\u5173\u3001\u652f\u4ed8\u7b49\u73af\u8282\uff0c\u4f46**\u5728\u5ba3\u4f20\u8bdd\u672f\u4e0a\u5df2\u89e6\u53ca\u5408\u89c4\u7ea2\u7ebf\u8fb9\u7f18**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**: **\u5339\u914d**\u3002\u7528\u6237\u5bf9\u6709\u58f0\u884c\u4e1a\u6709\u57fa\u7840\u5174\u8da3\u548c\u63a2\u7d22\u610f\u613f\uff0cT5\u539f\u578b\u9002\u5408\u901a\u8fc7\u7cfb\u7edf\u8bfe\u7a0b\u5efa\u7acb\u6280\u80fd\u4f53\u7cfb\uff0c\u9010\u6b65\u5bf9\u63a5\u53d8\u73b0\u6e20\u9053\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **\u9996\u5468\u91cd\u70b9\u6821\u6b63\u6536\u76ca\u9884\u671f\u4e0e\u5b66\u4e60\u89c4\u5212**\n*   **\u5177\u4f53\u884c\u52a8\u6307\u5357**:\n    1.  **\u9884\u671f\u7ba1\u7406\uff08\u5173\u952e\uff09**: \u9996\u6b21\u8054\u7cfb\u5fc5\u987b\u6e05\u6670\u8bf4\u660e\uff1a\u2460 \u6709\u58f0\u884c\u4e1a\u6536\u5165\u4e0e\u6280\u80fd\u3001\u6295\u5165\u65f6\u95f4\u6b63\u76f8\u5173\uff0c\u975e\u201c\u5feb\u94b1\u201d\u884c\u4e1a\uff1b\u2461 \u7cfb\u7edf\u8bfe\u7a0b\u662f\u6253\u57fa\u7840\uff0c\u6bd5\u4e1a\u540e\u4ecd\u9700\u6301\u7eed\u7ec3\u4e60\u4e0e\u8bd5\u97f3\uff1b\u2462 \u89e3\u91ca\u201c\u7248\u6743\u4e66\u201d\u7684\u6027\u8d28\uff08\u7ec3\u4e60\u7d20\u6750\u6216\u4f4e\u95e8\u69db\u5165\u95e8\u4e66\uff09\uff0c**\u964d\u4f4e\u5176\u5bf9\u201c\u7acb\u5373\u53d8\u73b0\u201d\u7684\u5e7b\u60f3**\u3002\n    2.  **\u5b66\u4e60\u6761\u4ef6\u6478\u5e95**: \u7acb\u5373\u4e86\u89e3\u7528\u6237\u7684**\u6bcf\u65e5\u53ef\u56fa\u5b9a\u5b66\u4e60\u65f6\u6bb5\u3001\u5f55\u97f3\u73af\u5883\u3001\u8bbe\u5907\u60c5\u51b5**\u3002\u82e5\u6761\u4ef6\u6709\u9650\uff0c\u65e9\u671f\u5f15\u5bfc\u5176\u4fa7\u91cd\u201c\u753b\u672c\u3001\u5ba1\u542c\u201d\u7b49\u5bf9\u5f55\u97f3\u73af\u5883\u8981\u6c42\u4f4e\u7684\u6280\u80fd\u65b9\u5411\uff0c\u5e76\u7ed9\u51fa\u8bbe\u5907\u5347\u7ea7\u7684\u52a1\u5b9e\u5efa\u8bae\u3002\n    3.  **\u5efa\u7acb\u7406\u6027\u76ee\u6807**: \u5e2e\u52a9\u7528\u6237\u8bbe\u5b9a\u4ee5\u201c\u6280\u80fd\u901a\u5173\u201d\u548c\u201c\u5b8c\u6210\u7b2c\u4e00\u4e2a\u4f5c\u54c1\u201d\u4e3a\u6838\u5fc3\u7684\u77ed\u671f\u5b66\u4e60\u76ee\u6807\uff0c\u800c\u975e\u201c\u8d5a\u53d6XXX\u5143\u201d\u3002\n    4.  **\u5bb6\u5ead\u77e5\u60c5\u6838\u67e5**: \u5728\u5408\u9002\u65f6\u673a\uff0c\u4ee5\u5173\u6000\u53e3\u543b\u8be2\u95ee\u8bfe\u7a0b\u5b66\u4e60\u662f\u5426\u9700\u4e0e\u5bb6\u4eba\u6c9f\u901a\u65f6\u95f4\u5b89\u6392\uff0c**\u95f4\u63a5\u6838\u5b9e\u662f\u5426\u4e3a\u4e2a\u4eba\u72ec\u7acb\u51b3\u7b56**\u3002\n    5.  **\u6301\u7eed\u5173\u6ce8\u53cd\u9988**: \u5bc6\u5207\u7559\u610f\u7528\u6237\u5728\u5b66\u4e60\u5b9e\u64cd\u73af\u8282\uff08\u7279\u522b\u662f\u9700\u8981\u5b89\u9759\u5f55\u97f3\u65f6\uff09\u7684\u53cd\u9988\uff0c\u53ca\u65f6\u63d0\u4f9b\u66ff\u4ee3\u65b9\u6848\u6216\u9f13\u52b1\uff0c\u9632\u6b62\u56e0\u6761\u4ef6\u9650\u5236\u5bfc\u81f4\u65e9\u671f\u5f03\u5b66\u3002\n\n{\"core_type\": \"T5 \u52a1\u5b9e\u63a2\u7d22\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u9996\u5468\u91cd\u70b9\u6821\u6b63\u6536\u76ca\u9884\u671f\"}";
