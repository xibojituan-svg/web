        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677159682 / \u6635\u79f0: \u7e41\u661f\u70b9\u70b9 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u516d\u6708\u6668\u516e(\u90ed\u5cb1\u5b97) -> \u6728\u6728\u897f(\u90ed\u5cb1\u5b97) -> \u53ef\u4e3d\u513f(\u5b54\u4ee4\u5a77) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bad\u7ec3\u8425 (\u4ef7\u683c\u672a\u5728\u8bb0\u5f55\u4e2d\u660e\u786e\uff0c\u4f46\u63d0\u53ca\u201c\u62a5\u540d\u6210\u529f\u201d\uff0c\u63a8\u65ad\u4e3a\u4ed8\u8d39\u8bfe\u7a0b) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | [\u4fe1\u606f\u7f3a\u5931] |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | [\u4fe1\u606f\u7f3a\u5931] |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | [\u4fe1\u606f\u7f3a\u5931] |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** |\n\n> **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4e3a\u4f53\u9a8c\u8bfe\u53ca\u8f6c\u5316\u671f\u6c9f\u901a\uff0c\u4e25\u91cd\u7f3a\u4e4f\u5173\u4e8e\u7528\u6237\u652f\u4ed8\u80fd\u529b\u3001\u8d44\u91d1\u6765\u6e90\u3001\u5bb6\u5ead\u652f\u6301\u5ea6\u3001\u6bcf\u65e5\u53ef\u652f\u914d\u65f6\u95f4\u7b49\u5173\u952e\u51b3\u7b56\u4fe1\u606f\u3002\u6240\u6709\u5224\u65ad\u57fa\u4e8e\u6709\u9650\u7684\u5b66\u4e60\u4e92\u52a8\u884c\u4e3a\uff0c\u5b58\u5728\u8f83\u9ad8\u63a8\u65ad\u98ce\u9669\u3002\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6709\u58f0\u884c\u4e1a\u7684\u5174\u8da3\u548c\u5b66\u4e60\u610f\u613f\uff0c\u4f46\u672a\u5f3a\u70c8\u8868\u8fbe\u660e\u786e\u7684\u3001\u8feb\u5207\u7684\u8d5a\u94b1\u76ee\u6807\u6216\u7ecf\u6d4e\u538b\u529b\u3002\u52a8\u673a\u6df7\u6742\u4e86\u5174\u8da3\u63a2\u7d22\u3001\u6280\u80fd\u63d0\u5347\u548c\u6f5c\u5728\u517c\u804c\u53ef\u80fd\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u76ee\u524d\u8fd8\u5728\u5b66\u4e60\u4e2d\u4e0d\u77e5\u9053\u80fd\u4e0d\u80fd\u628a\u5b83\u505a\u7cbe\u505a\u597d\uff0c\u4f46\u6211\u52aa\u529b\u8d76\u4e0a\u5927\u5bb6\u7684\u6b65\u4f10\uff0c\u5411\u6668\u516e\u5b66\u59d0\u770b\u9f50\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 \u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u652f\u4ed8\u3001\u5206\u671f\u3001\u7ecf\u6d4e\u72b6\u51b5\u4fe1\u606f\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 \u7528\u6237\u80fd\u8fde\u7eed\u591a\u65e5\u5b8c\u6210\u6668\u7ec3\u3001\u5f55\u64ad\u8bfe\u3001\u76f4\u64ad\u8bfe\u3001\u4f5c\u4e1a\uff0c\u5e76\u6309\u65f6\u63d0\u4ea4\uff0c\u663e\u793a\u51fa\u8f83\u597d\u7684\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u548c\u5b66\u4e60\u6295\u5165\u5ea6\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 \u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u80cc\u666f\u6216\u652f\u6301\u60c5\u51b5\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u7528\u6237\u9762\u5bf9\u5b66\u4e60\u96be\u5ea6\uff08\u201c\u611f\u89c9\u597d\u96be\u5dee\u4e86\u5341\u4e07\u516b\u5343\u91cc\u4e00\u6837\u201d\uff09\u65f6\uff0c\u6001\u5ea6\u79ef\u6781\uff0c\u4e3b\u52a8\u611f\u8c22\u6307\u5bfc\uff0c\u5e76\u6309\u65f6\u5b8c\u6210\u6311\u6218\u6027\u4efb\u52a1\uff0c\u672a\u8868\u73b0\u51fa\u4efb\u4f55\u8d1f\u9762\u60c5\u7eea\u6216\u4f9d\u8d56\u5b89\u629a\u7684\u8ff9\u8c61\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8c22\u8c22\uff0c\u6668\u516e\u5b66\u59d0\u7684\u5b9d\u8d35\u7684\u70b9\u62e8...\u4f46\u6211\u52aa\u529b\u8d76\u4e0a\u5927\u5bb6\u7684\u6b65\u4f10\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u81ea\u8eab\u80fd\u529b\u7684\u4e0d\u786e\u5b9a\u611f\u4e0e\u5bf9\u4e13\u4e1a\u5708\u5c42\u7684\u5411\u5f80\u3002\u7528\u6237\u53cd\u590d\u8868\u8fbe\u201c\u4e0d\u77e5\u9053\u80fd\u4e0d\u80fd\u505a\u7cbe\u505a\u597d\u201d\u3001\u201c\u5411\u5b66\u59d0\u770b\u9f50\u201d\uff0c\u5176\u6838\u5fc3\u75db\u70b9\u662f\u6e34\u671b\u83b7\u5f97\u4e00\u9879\u80fd\u5e26\u6765\u793e\u4f1a\u8ba4\u53ef\u548c\u5708\u5c42\u5f52\u5c5e\u611f\u7684\u4e13\u4e1a\u6280\u80fd\uff0c\u4ee5\u63d0\u5347\u81ea\u6211\u4ef7\u503c\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6301\u7eed\u7684\u3001\u5177\u4f53\u7684\u6b63\u5411\u53cd\u9988\u4e0e\u201c\u88ab\u9009\u4e2d\u201d\u7684\u4f18\u8d8a\u611f**\u3002\u9500\u552e\u201c\u6211\u770b\u597d\u4f60\u201d\u3001\u201c\u4f60\u662f\u5176\u4e2d\u4e00\u4e2a\u201d\u3001\u201c\u540d\u989d\u5360\u4e0b\u201d\u7b49\u8bdd\u672f\u7cbe\u51c6\u547d\u4e2d\u4e86\u5176\u6e34\u671b\u88ab\u8ba4\u53ef\u3001\u88ab\u7eb3\u5165\u4e13\u4e1a\u5708\u5c42\u7684\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u57fa\u4e8e\u73b0\u6709\u79ef\u6781\u884c\u4e3a\u6a21\u5f0f\u63a8\u65ad) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T3 \u6b7b\u78d5\u5b66\u9738\u578b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | [\u4fe1\u606f\u7f3a\u5931] | [\u4fe1\u606f\u7f3a\u5931] |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u6b63\u5f0f\u5f00\u8bfe\u540e\uff0c\u8bfe\u7a0b\u96be\u5ea6\u548c\u7ec3\u4e60\u91cf\u9661\u589e\uff0c\u82e5\u5176\u201c\u52aa\u529b\u8ddf\u4e0a\u201d\u7684\u5fc3\u6001\u65e0\u6cd5\u5e94\u5bf9\u5b9e\u9645\u7684\u5b66\u4e60\u5f3a\u5ea6\u548c\u67af\u71e5\u7684\u91cd\u590d\u7ec3\u4e60\uff0c\u53ef\u80fd\u56e0\u201c\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\u201d\u800c\u81ea\u8d23\u9000\u51fa\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u76ee\u524d\u8868\u73b0\u51fa\u8f83\u9ad8\u7684\u5fc3\u7406\u5f39\u6027\u548c\u5b66\u4e60\u97e7\u6027\uff0c\u4f46\u9700\u8b66\u60d5\u5728\u72ec\u7acb\u5b8c\u6210\u590d\u6742\u4f5c\u4e1a\u6216\u9996\u6b21\u8bd5\u97f3\u5931\u8d25\u65f6\uff0c\u4fe1\u5fc3\u53d7\u632b\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u9500\u552e\u5df2\u94fa\u57ab\u201c80-150/\u5c0f\u65f6\u201d\u3001\u201c1W\u5de6\u53f3\u201d\u7684\u6536\u76ca\u9884\u671f\u3002\u82e5\u7528\u6237\u5b66\u4e60\u4e00\u6bb5\u65f6\u95f4\u540e\uff0c\u53d1\u73b0\u63a5\u5355\u95e8\u69db\u9ad8\u3001\u7ade\u4e89\u6fc0\u70c8\u3001\u5b9e\u9645\u6536\u76ca\u8fdc\u4f4e\u4e8e\u9884\u671f\u6216\u5468\u671f\u6f2b\u957f\uff0c\u53ef\u80fd\u4ea7\u751f\u5de8\u5927\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u6b63\u5f0f\u8bfe\u7a0b\u96be\u5ea6\u548c\u4f5c\u4e1a\u91cf\u589e\u52a0\uff0c\u82e5\u7b2c\u4e00\u6b21\u8bd5\u97f3\u5931\u8d25\u6216\u53d1\u73b0\u201c\u8d5a\u94b1\u201d\u5e76\u4e0d\u5982\u60f3\u8c61\u4e2d\u5bb9\u6613\uff0c\u632b\u8d25\u611f\u548c\u6536\u76ca\u7126\u8651\u4f1a\u96c6\u4e2d\u7206\u53d1\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u7e41\u661f\u70b9\u70b9\uff0c\u6211\u662f\u4f60\u7684\u73ed\u4e3b\u4efbXX\u3002\u6668\u516e\u5b66\u59d0\u7279\u522b\u8ddf\u6211\u63d0\u8fc7\uff0c\u4f60\u662f\u5979\u975e\u5e38\u770b\u597d\u7684\u3001\u6709\u6f5c\u529b\u7684\u5b66\u5458\uff0c\u5b66\u4e60\u6001\u5ea6\u7279\u522b\u8ba4\u771f\u3002\u63a5\u4e0b\u6765\u7684\u7cfb\u7edf\u8bfe\uff0c\u6211\u4eec\u4f1a\u4ece\u2018\u7231\u597d\u8005\u2019\u5411\u2018\u51c6\u4e13\u4e1a\u8005\u2019\u5347\u7ea7\uff0c\u8fc7\u7a0b\u4e2d\u80af\u5b9a\u4f1a\u9047\u5230\u74f6\u9888\uff0c\u8fd9\u975e\u5e38\u6b63\u5e38\u3002\u522b\u62c5\u5fc3\uff0c\u6211\u4f1a\u50cf\u6668\u516e\u5b66\u59d0\u4e00\u6837\uff0c\u7ed9\u4f60\u6700\u5177\u4f53\u7684\u53cd\u9988\u3002\u6211\u4eec\u7684\u76ee\u6807\u4e0d\u662f\u2018\u901f\u6210\u2019\uff0c\u800c\u662f\u4e00\u6b65\u6b65\u8ba9\u4f60\u771f\u6b63\u5177\u5907\u88ab\u5e02\u573a\u8ba4\u53ef\u7684\u4e13\u4e1a\u80fd\u529b\uff0c\u7a33\u7a33\u5730\u8d70\u8fdb\u8fd9\u4e2a\u5708\u5b50\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011\u3002\u5339\u914d\u5176\u201c\u6b7b\u78d5\u5b66\u9738\u201d\u7279\u8d28\uff0c\u63d0\u4f9b\u6e05\u6670\u3001\u6709\u6311\u6218\u6027\u7684\u6280\u80fd\u8fdb\u9636\u8def\u5f84\u548c\u660e\u786e\u7684\u91cc\u7a0b\u7891\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011+\u3010\u5c0f\u8303\u56f4\u6807\u6746\u5b66\u5458\u5708\u3011\u3002\u7ed9\u4e88\u5176\u6df1\u5ea6\u94bb\u7814\u548c\u63d0\u95ee\u7684\u4e13\u5c5e\u901a\u9053\uff0c\u5e76\u5c06\u5176\u7eb3\u5165\u4e00\u4e2a\u7531\u4f18\u79c0\u5b66\u5458\u7ec4\u6210\u7684\u5c0f\u5708\u5b50\uff0c\u6ee1\u8db3\u5176\u5f52\u5c5e\u611f\u548c\u88ab\u8ba4\u53ef\u7684\u9700\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u8fc7\u5ea6\u627f\u8bfa\u201c\u5feb\u901f\u66b4\u5bcc\u201d\uff0c\u7834\u574f\u5176\u957f\u671f\u5b66\u4e60\u7684\u5fc3\u6001\u30022. \u7ed9\u4e88\u6a21\u7cca\u3001\u6577\u884d\u7684\u53cd\u9988\uff0c\u8fd9\u4f1a\u6467\u6bc1\u5176\u5efa\u7acb\u8d77\u7684\u4fe1\u4efb\u548c\u4fe1\u5fc3\u30023. \u5c06\u5176\u4e0e\u66f4\u6fc0\u8fdb\u3001\u66f4\u7ed3\u679c\u5bfc\u5411\u7684\u5b66\u5458\uff08\u5982T4\uff09\u8fdb\u884c\u5bf9\u6bd4\u65bd\u538b\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u521d\u671f\u8fdb\u884c\u5927\u989d\u5347\u5355**\u3002\u5e94\u5148\u901a\u8fc7\u5c0f\u5355\uff08\u5982\u9ad8\u7ea7\u6280\u5de7\u6a21\u5757\u3001\u4e13\u5c5e\u7ec3\u4e60\u518c\u7b49\uff09\u6d4b\u8bd5\u5176\u4ed8\u8d39\u610f\u613f\u548c\u5b66\u4e60\u6df1\u5ea6\uff0c\u5efa\u7acb\u66f4\u5f3a\u4fe1\u4efb\u540e\uff0c\u518d\u6839\u636e\u5176\u5b66\u4e60\u6210\u679c\u548c\u804c\u4e1a\u89c4\u5212\u63a8\u8350\u8fdb\u9636\u8bfe\u7a0b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u76ee\u524d\u8fd8\u5728\u5b66\u4e60\u4e2d\u4e0d\u77e5\u9053\u80fd\u4e0d\u80fd\u628a\u5b83\u505a\u7cbe\u505a\u597d\uff0c\u4f46\u6211\u52aa\u529b\u8d76\u4e0a\u5927\u5bb6\u7684\u6b65\u4f10\uff0c\u5411\u6668\u516e\u5b66\u59d0\u770b\u9f50\u201d\n2. > \u201c\u867d\u7136\u53ea\u6709\u77ed\u6682\u4e24\u5929\u4f46\u5b66\u4e86\u5f88\u591a\u4ece\u672a\u63a5\u89e6\u7684\u77e5\u8bc6\u76f2\u533a...\u73b0\u5728\u611f\u89c9\u597d\u96be\u5dee\u4e86\u5341\u4e07\u516b\u5343\u91cc\u4e00\u6837\uff0c\u8981\u6ce8\u5165\u5f88\u591a\u4e1c\u897f\u5728\u6587\u5b57\u91cc\u9762\u4f7f\u5b83\u9c9c\u6d3b\u7684\u52a8\u8d77\u6765\uff0c\u4f60\u4eec\u6bcf\u4e00\u4f4d\u4e3b\u64ad\u4eba\u90fd\u597d\u5389\u5bb3\ud83d\udc4d\ud83c\udffb\u201d\n3. > \u201c\u597d\u7684\uff0c\u65f6\u523b\u51c6\u5907\u7740\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T3 \u6b7b\u78d5\u5b66\u9738\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u5c0a\u91cd\u4e0e\u5708\u5c42\u5f52\u5c5e**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u6301\u7eed\u3001\u5177\u4f53\u3001\u9ad8\u9891\u7684\u6b63\u5411\u53cd\u9988\uff0c\u5e76\u5c06\u5176\u7eb3\u5165\u201c\u4f18\u79c0\u5b66\u5458\u201d\u5c0f\u5708\u5b50\uff0c\u7528\u5f52\u5c5e\u611f\u5bf9\u6297\u5b66\u4e60\u5026\u6020\u671f**\u3002\n\n```json\n{\"core_type\": \"T3 \u6b7b\u78d5\u5b66\u9738\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u5f52\u5c5e\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\"}\n```";
