    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID 405147535 (\u6843\u66e6\u68a6) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u900d\u9065\u7c7d\u83f2(\u9b4f\u73ca)\u3001\u79cb\u7c73\u679c(\u767d\u82b3) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u5177\u4f53\u4ef7\u683c\u672a\u77e5\uff0c\u9500\u552e\u63d0\u53ca\u201c\u4e00\u4e2a\u6708300\u591a\u5757\u94b1\u201d\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u63d0\u53ca\u201c\u8fd9\u6b21\u4e0a\u4e86\u51e0\u4e2a\u6708\u7684\u73ed\uff0c\u7136\u540e\u4e4b\u524d\u7684\u9965\u8352\u4e5f\u5dee\u4e0d\u591a\u4e86\u201d\uff0c\u6697\u793a\u7ecf\u6d4e\u72b6\u51b5\u521a\u6709\u6539\u5584\uff0c\u4f46\u672a\u660e\u786e\u652f\u4ed8\u65b9\u5f0f\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u63d0\u5230\u201c\u6211\u65f6\u95f4\u7ebf\u4e0d\u592a\u56fa\u5b9a\u201d\uff0c\u4e14\u80fd\u51cc\u6668\u4ea4\u4f5c\u4e1a\uff0c\u8868\u660e\u65f6\u95f4\u4e0d\u89c4\u5f8b\u4f46\u80fd\u6324\u51fa\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u52a8\u673a\u548c\u90e8\u5206\u8d44\u6e90\u4fe1\u606f\u660e\u786e\uff0c\u4f46\u652f\u4ed8\u7ec6\u8282\u3001\u5bb6\u5ead\u652f\u6301\u3001\u5b8c\u6574\u5fc3\u7406\u5f39\u6027\u8bc1\u636e\u94fe\u7f3a\u5931\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06**\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u53d8\u73b0\u53cc\u91cd\u9a71\u52a8\u800c\u6765\u3002\u65e2\u6709\u5bf9\u6280\u80fd\u63d0\u5347\u7684\u5174\u8da3\uff08\u201c\u633a\u611f\u5174\u8da3\u7684\u201d\uff09\uff0c\u53c8\u6709\u660e\u786e\u7684\u3001\u52a1\u5b9e\u7684\u53d8\u73b0\u8bc9\u6c42\uff08\u201c\u521a\u8fdb\u53bb\u5c31\u80fd\u5f00\u59cb\u63a5\u5355\u4e48\u201d\u3001\u201c\u53ef\u4ee5\u8fb9\u5b66\u4e60\uff0c\u8fb9\u505a\u8d77\u6765\u201d\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u800c\u4e14\u7c7d\u83f2\u8001\u5e08\u4e0d\u662f\u8bf4\u54b1\u8fd9\u6b21\u5c31\u662f\u521a\u8fdb\u53bb\u5c31\u80fd\u5f00\u59cb\u63a5\u5355\u4e48\u201d > \u201c\u5f55\u97f3\u7684\u4e0d\u6210\u719f\uff0c\u53ef\u4ee5\u5148\u4e0d\u63a5\uff0c\u4f46\u662f\u6211\u53ef\u4ee5\u5148\u753b\u672c\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1**\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u521a\u5de5\u4f5c\u51e0\u4e2a\u6708\u8fd8\u5b8c\u201c\u9965\u8352\u201d\uff0c\u7ecf\u6d4e\u72b6\u51b5\u6539\u5584\u4f46\u975e\u5bbd\u88d5\uff0c\u5bf9\u201c\u4e00\u4e2a\u6708300\u591a\u5757\u94b1\u201d\u7684\u652f\u51fa\u654f\u611f\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u65f6\u95f4\u4e0d\u56fa\u5b9a\uff08\u201c\u65f6\u95f4\u7ebf\u4e0d\u592a\u56fa\u5b9a\u201d\uff09\uff0c\u4f46\u80fd\u5229\u7528\u788e\u7247\u5316\u65f6\u95f4\uff08\u51cc\u6668\uff09\u5b8c\u6210\u5b66\u4e60\u4efb\u52a1\uff0c\u5177\u5907\u575a\u6301\u5b66\u4e60\u7684\u57fa\u672c\u6761\u4ef6\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07**\u4f4e\u6781\u5371**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56**\u3002\u9762\u5bf9\u4f5c\u4e1a\u63d0\u4ea4\u5931\u8bef\uff08\u9519\u53d1\u65e7\u5f55\u97f3\uff09\u548c\u9500\u552e\u6307\u51fa\u95ee\u9898\uff08\u201c\u7cca\u5f04\u6211\u201d\uff09\u65f6\uff0c\u4ec5\u4ee5\u201c\u597d\u7684\u597d\u7684\u201d\u3001\u201c\u597d\u5427\u201d\u7b80\u5355\u56de\u5e94\uff0c\u672a\u8868\u73b0\u51fa\u4e3b\u52a8\u89e3\u91ca\u6216\u79ef\u6781\u8c03\u6574\u7684\u610f\u613f\uff0c\u663e\u793a\u51fa**\u670d\u4ece\u4e0e\u56de\u907f**\u503e\u5411\u3002\u5bf9\u9500\u552e\uff08\u5e08\u59d0\uff09\u8868\u73b0\u51fa\u9ad8\u5ea6\u4f9d\u8d56\u548c\u4fe1\u4efb\uff08\u201c\u59a5\u4e86\u59a5\u4e86\uff0c\u5c31\u76f8\u4fe1\u5e08\u59d0\u201d\uff09\uff0c\u7f3a\u4e4f\u72ec\u7acb\u89e3\u51b3\u95ee\u9898\u7684\u4fe1\u5fc3\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u597d\u5427\u201d (\u5728\u88ab\u6307\u51fa\u9519\u8fc7\u70b9\u8bc4\u548c\u63d0\u4ea4\u9519\u8bef\u4f5c\u4e1a\u540e) > \u201c\u59a5\u4e86\u59a5\u4e86\uff0c\u5c31\u76f8\u4fe1\u5e08\u59d0\uff0c\u8ddf\u7740\u5e08\u59d0\u6709\u8089\u5403\uff0c\u6df7\u7684\u4e0d\u884c\u4e5f\u80fd\u559d\u53e3\u6c64\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u7ecf\u6d4e\u5b89\u5168\u7126\u8651\u4e0e\u804c\u4e1a\u53d1\u5c55\u8ff7\u832b**\u3002\u7528\u6237\u660e\u786e\u63d0\u5230\u201c\u4e4b\u524d\u6ca1\u94b1\u201d\u3001\u201c\u4e4b\u524d\u7684\u9965\u8352\u4e5f\u5dee\u4e0d\u591a\u4e86\u201d\u3001\u201c\u4e3b\u4e1a\u76ee\u524d\u6765\u8bf4...\u89c4\u5212\u8fd8\u4e0d\u662f\u5f88\u6e05\u6670\u201d\uff0c\u8868\u660e\u5176\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u5bfb\u6c42\u4e00\u4efd\u80fd\u5e26\u6765\u7a33\u5b9a\u6536\u5165\u7684\u526f\u4e1a\uff0c\u4ee5\u62b5\u5fa1\u672a\u6765\u7684\u4e0d\u786e\u5b9a\u6027\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u63d0\u4f9b\u4e00\u6761\u6e05\u6670\u3001\u53ef\u4f9d\u8d56\u3001\u6709\u4fdd\u969c\u7684\u53d8\u73b0\u8def\u5f84\u548c\u201c\u88ab\u5e26\u9886\u201d\u7684\u5b89\u5168\u611f**\u3002\u9500\u552e\u201c\u5e08\u59d0\u201d\u7684\u89d2\u8272\uff08\u201c\u6211\u5e26\u4f60\u201d\u3001\u201c\u5e08\u59d0\u770b\u597d\u4f60\u201d\u3001\u201c\u4ee5\u540e\u5c31\u662f\u6211\u7684\u4eba\u4e86\u201d\uff09\u5b8c\u7f8e\u5951\u5408\u4e86\u7528\u6237\u5bf9\u201c\u5f15\u8def\u4eba\u201d\u548c\u201c\u8d44\u6e90\u9760\u5c71\u201d\u7684\u6e34\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u4e25\u91cd\u5185\u8017) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u7b49D\u7c7b\u7ea2\u7ebf\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4e2d | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7ecf\u6d4e\u521a\u6539\u5584\uff0c\u82e5\u6709\u5927\u989d\u652f\u51fa\u53ef\u80fd\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u65f6\u95f4\u4e0d\u56fa\u5b9a\uff0c\u4e00\u65e6\u4e3b\u4e1a\u6216\u751f\u6d3b\u538b\u529b\u589e\u5927\uff0c\u6781\u6613\u56e0\u201c\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\u201d\u800c\u4ea7\u751f\u81ea\u8d23\u3001\u7126\u8651\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u5fc3\u7406\u5f39\u6027\u6781\u4f4e\uff0c\u5bf9\u201c\u5e08\u59d0\u201d\u4f9d\u8d56\u6781\u5f3a\u3002\u4e00\u65e6\u9047\u5230\u6280\u672f\u96be\u70b9\uff08\u5982\u8f6f\u4ef6\u64cd\u4f5c\u3001\u8bd5\u97f3\u5931\u8d25\uff09\u3001\u6216\u611f\u89c9\u88ab\u201c\u5e08\u59d0\u201d\u51b7\u843d/\u6279\u8bc4\uff0c\u6781\u6613\u4ea7\u751f\u201c\u6211\u592a\u7b28\u4e86\u201d\u3001\u201c\u5b66\u4e0d\u4f1a\u201d\u7684\u5d29\u6e83\u60c5\u7eea\uff0c\u89e6\u53d1\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u5bf9\u201c\u5f00\u5b66\u7b2c\u516b\u5929\u63a5\u5355\u201d\u62b1\u6709\u671f\u5f85\uff0c\u82e5\u521d\u671f\u63a5\u5355\u4e0d\u987a\u6216\u6536\u76ca\u4e0d\u53ca\u9884\u671f\uff0c\u4f1a\u4ea7\u751f\u5f3a\u70c8\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u4f5c\u4e1a\u96be\u5ea6\u63d0\u5347\uff0c\u82e5\u7b2c\u4e00\u6b21\u8bd5\u97f3\u5931\u8d25\u6216\u611f\u89c9\u8fdb\u6b65\u7f13\u6162\uff0c\u7ed3\u5408\u5176\u4f4e\u5fc3\u7406\u5f39\u6027\uff0c\u9000\u8d39\u98ce\u9669\u6781\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u66e6\u68a6\uff0c\u770b\u5230\u4f60\u51cc\u6668\u8fd8\u5728\u4ea4\u4f5c\u4e1a\uff0c\u771f\u7684\u7279\u522b\u8ba4\u771f\uff01\u54b1\u4eec\u4e0d\u7740\u6025\uff0c\u6709\u58f0\u8fd9\u6761\u8def\u5e08\u59d0\u4f1a\u4e00\u6b65\u4e00\u6b65\u966a\u7740\u4f60\u8d70\u3002\u524d\u671f\u54b1\u4eec\u5148\u628a\u57fa\u7840\u6253\u7262\uff0c\u63a5\u5355\u662f\u6c34\u5230\u6e20\u6210\u7684\u4e8b\u3002\u8fc7\u7a0b\u4e2d\u6709\u4efb\u4f55\u5361\u58f3\u3001\u89c9\u5f97\u96be\u4e86\uff0c\u968f\u65f6\u627e\u6211\uff0c\u5343\u4e07\u522b\u81ea\u5df1\u618b\u7740\u3002\u54b1\u4eec\u7684\u76ee\u6807\u4e0d\u662f\u2018\u5feb\u2019\uff0c\u800c\u662f\u2018\u7a33\u2019\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u56e0\u5176\u6709\u660e\u786e\u7684\u53d8\u73b0\u8bc9\u6c42\uff0c\u9700\u63d0\u4f9b\u6e05\u6670\u7684\u6280\u80fd\u6210\u957f\u8def\u5f84\u548c\u63a5\u5355\u673a\u4f1a\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u5f3a\u70c8\u8865\u5145\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u9488\u5bf9\u5176T6\uff08\u60c5\u7eea\u5de8\u5a74\uff09\u7279\u8d28\uff0c\u9700\u8981\u9ad8\u6d53\u5ea6\u7684\u60c5\u611f\u652f\u6301\u548c\u9f13\u52b1\u3002\u540c\u65f6\uff0c\u56e0\u5176\u65f6\u95f4\u788e\u7247\u5316\uff0c\u9700\u63d0\u4f9b**\u65f6\u95f4\u53ef\u6f02\u79fb\u7684\u673a\u5236\u515c\u5e95**\uff08\u5982\u5f55\u64ad\u56de\u770b\u3001\u4f5c\u4e1a\u63d0\u4ea4\u5f39\u6027\u671f\u9650\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u7528\u4e25\u5389\u6216\u6279\u8bc4\u7684\u53e3\u543b\u70b9\u8bc4\u4f5c\u4e1a**\uff0c\u5fc5\u987b\u4ee5\u9f13\u52b1\u4e3a\u4e3b\uff0c\u5148\u5938\u518d\u5efa\u8bae\u30022. **\u5728\u521d\u671f\u7ed9\u4e88\u8fc7\u9ad8\u3001\u8fc7\u5feb\u7684\u63a5\u5355\u538b\u529b**\uff0c\u9700\u7ba1\u7406\u5176\u201c\u5feb\u901f\u53d8\u73b0\u201d\u9884\u671f\u30023. **\u5728\u5176\u9047\u5230\u56f0\u96be\u65f6\u8ba9\u5176\u201c\u81ea\u5df1\u5148\u7814\u7a76\u4e00\u4e0b\u201d**\uff0c\u5fc5\u987b\u7b2c\u4e00\u65f6\u95f4\u63d0\u4f9b\u201c\u6309\u952e\u7ea7\u201d\u6307\u5bfc\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u57fa\u7840\u6280\u80fd\u672a\u7a33\u56fa\u3001\u9996\u6b21\u63a5\u5355\u672a\u6210\u529f\u524d\u8fdb\u884c\u4efb\u4f55\u5927\u989d\u5347\u5355\u63a8\u4ecb**\u3002\u53ef\u8003\u8651\u5c0f\u989d\u3001\u4f4e\u95e8\u69db\u7684\u201c\u753b\u672c\u201d\u3001\u201c\u5ba1\u542c\u201d\u7b49\u659c\u6760\u6280\u80fd\u5305\u4f5c\u4e3a\u8fc7\u6e21\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u800c\u4e14\u7c7d\u83f2\u8001\u5e08\u4e0d\u662f\u8bf4\u54b1\u8fd9\u6b21\u5c31\u662f\u521a\u8fdb\u53bb\u5c31\u80fd\u5f00\u59cb\u63a5\u5355\u4e48**\u201d \u2014\u2014 **\u9ad8\u7eaf\u5ea6\u53d8\u73b0\u52a8\u673a+\u5bf9\u6743\u5a01\u7684\u4f9d\u8d56**\u3002\n2. > \u201c**\u6211\u65f6\u95f4\u7ebf\u4e0d\u592a\u56fa\u5b9a...\u4eca\u5929\u6bd4\u8f83\u852b\u513f\u5427\u3002**\u201d \u2014\u2014 **\u8d44\u6e90\u5e95\u5ea7\uff08\u65f6\u95f4\uff09\u77ed\u677f+\u60c5\u7eea\u72b6\u6001\u4e0d\u7a33\u5b9a**\u3002\n3. > \u201c**\u597d\u5427**\u201d (\u9500\u552e\u6307\u51fa\u5176\u4f5c\u4e1a\u9519\u8bef\u540e) \u2014\u2014 **\u4f4e\u5fc3\u7406\u5f39\u6027\uff0c\u9047\u632b\u8868\u73b0\u4e3a\u987a\u4ece\u4e0e\u56de\u907f\uff0c\u800c\u975e\u79ef\u6781\u89e3\u51b3**\u3002\n4. > \u201c**\u59a5\u4e86\u59a5\u4e86\uff0c\u5c31\u76f8\u4fe1\u5e08\u59d0\uff0c\u8ddf\u7740\u5e08\u59d0\u6709\u8089\u5403\uff0c\u6df7\u7684\u4e0d\u884c\u4e5f\u80fd\u559d\u53e3\u6c64**\u201d \u2014\u2014 **\u5c06\u4e2a\u4eba\u6210\u529f\u5b8c\u5168\u5bc4\u6258\u4e8e\u5916\u90e8\u201c\u5f15\u8def\u4eba\u201d\uff0c\u7f3a\u4e4f\u81ea\u6211\u6548\u80fd\u611f\uff0c\u662f\u5178\u578b\u7684T6\u4f9d\u8d56\u5fc3\u6001**\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7ecf\u6d4e\u5b89\u5168\u4e0e\u804c\u4e1a\u4fdd\u969c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u81f4\u7684\u60c5\u611f\u6258\u5e95\u4e0e\u201c\u6309\u952e\u7ea7\u201d\u6307\u5bfc\uff0c\u4e25\u9632\u5176\u5728\u5b66\u4e60\u521d\u671f\u56e0\u632b\u8d25\u611f\u800c\u5d29\u6e83\u653e\u5f03\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u6e56\u5317\u7701\u54b8\u5b81\u5e02\"}\n```";
