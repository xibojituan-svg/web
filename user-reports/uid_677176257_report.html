    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677176257 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u70ed\u70ed2(\u7eaa\u9e4f) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b (\u5df2\u652f\u4ed83980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3** (\u652f\u4ed8\u65b9\u5f0f\u4e3a\u652f\u4ed8\u5b9d\uff0c\u672a\u63d0\u53ca\u8d44\u91d1\u6765\u6e90\u6216\u538b\u529b) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u76ee\u524d\u6bcf\u59291-2\u5c0f\u65f6\u53ef\u4ee5\u5728\u6f14\u64ad\u5de5\u4f5c\u7684\u517c\u804c\u4e0a\u201d) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3** (\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u4fe1\u606f\uff0c\u9700\u8b66\u60d5\u6f5c\u5728\u98ce\u9669) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** (\u7f3a\u4e4f\u8d44\u91d1\u6765\u6e90\u3001\u5bb6\u5ead\u72b6\u51b5\u3001\u804c\u4e1a\u80cc\u666f\u3001\u8fc7\u5f80\u7ecf\u5386\u7b49\u5173\u952e\u4fe1\u606f) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u53d8\u73b0\u8def\u5f84\u7684\u6e05\u6670\u89c4\u5212\uff08\u659c\u6760->\u65f6\u85aa\u4e66->\u5206\u6210\u4e66\uff09\uff0c\u5e76\u4e3b\u52a8\u8be2\u95ee\u7a0e\u52a1\u7ec6\u8282\uff0c\u663e\u793a\u51fa\u52a1\u5b9e\u7684\u641e\u94b1\u610f\u613f\u3002\u4f46\u5168\u7a0b\u672a\u8868\u73b0\u51fa\u6781\u5ea6\u7684\u7ecf\u6d4e\u7126\u8651\u6216\u201c\u51e0\u5929\u5185\u63d0\u73b0\u201d\u7684\u6025\u8feb\u611f\uff0c\u66f4\u50cf\u662f\u5728\u63a2\u7d22\u4e00\u4e2a\u53ef\u884c\u7684\u526f\u4e1a\u8def\u5f84\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u7406\u89e3\u3002\u5148\u505a\u659c\u6760\uff08\u5bf9\u8f68/\u5e72\u97f3\uff09\u3001\u518d\u65f6\u85aa\u4e66\u3001\u518d\u5206\u6210\u4e66\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 \u80fd\u652f\u4ed83980\u5143\u8bfe\u7a0b\u8d39\uff0c\u4f46\u672a\u900f\u9732\u66f4\u591a\u7ecf\u6d4e\u72b6\u51b5\uff0c\u65e0\u6cd5\u5224\u65ad\u5176\u8d44\u91d1\u5145\u88d5\u5ea6\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4f4e] \u2014 **\u6700\u77ed\u7684\u677f**\u3002\u660e\u786e\u8868\u793a\u6bcf\u5929\u4ec51-2\u5c0f\u65f6\u53ef\u7528\u4e8e\u517c\u804c\uff0c\u65f6\u95f4\u8d44\u6e90\u9ad8\u5ea6\u7d27\u5f20\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 \u5b8c\u5168\u672a\u63d0\u53ca\uff0c\u662f\u6f5c\u5728\u98ce\u9669\u70b9\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u9700\u95f4\u6b47\u6027\u5b89\u629a\u3002\u7528\u6237\u6c9f\u901a\u793c\u8c8c\u3001\u914d\u5408\u5ea6\u9ad8\uff08\u201c\u597d\u7684\uff0c\u8c22\u8c22\u201d\u3001\u201c\u660e\u767d\u4e86\u201d\uff09\uff0c\u80fd\u4e3b\u52a8\u5904\u7406\u6280\u672f\u95ee\u9898\uff08\u6ce8\u9500\u591a\u4f59\u8d26\u53f7\uff09\u3002\u4f46\u5728\u9ad8\u94c1\u4fe1\u53f7\u5dee\u7b49\u5916\u90e8\u5e72\u6270\u4e0b\uff0c\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u88ab\u52a8\u548c\u7b49\u5f85\u5f15\u5bfc\uff08\u201c\u4fe1\u53f7\u592a\u5dee\u4e86\u201d\u3001\u201c\u7a0d\u7b49\u4e00\u4e0b\u201d\uff09\uff0c\u7f3a\u4e4f\u6781\u5ea6\u4e3b\u52a8\u6216\u6781\u5ea6\u8106\u5f31\u7684\u6781\u7aef\u8868\u73b0\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08\uff0c\u4e00\u4f1a\u513f\u7533\u8bf7\u56de\u653e\u54c8\u201d\uff08\u5728\u4fe1\u53f7\u4e2d\u65ad\u540e\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u800c\u975e\u62b1\u6028\u6216\u653e\u5f03\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9**\u672a\u6765\u6536\u5165\u7a33\u5b9a\u6027\u4e0e\u804c\u4e1a\u53d1\u5c55\u8def\u5f84\u7684\u7126\u8651**\u3002\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u4e00\u9879\u53ef\u79ef\u7d2f\u3001\u6709\u4e0a\u5347\u7a7a\u95f4\uff08\u201c\u8d8a\u8001\u8d8a\u503c\u94b1\u201d\uff09\u7684\u6280\u80fd\uff0c\u83b7\u5f97\u4e00\u4efd\u4e0d\u53d7\u65f6\u95f4\u5730\u70b9\u4e25\u683c\u9650\u5236\u7684\u526f\u4e1a\u4fdd\u969c\uff0c\u4ee5\u62b5\u5fa1\u672a\u6765\u4e0d\u786e\u5b9a\u6027\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6e05\u6670\u7684\u8def\u5f84\u89c4\u5212\u4e0e\u201c\u786e\u5b9a\u6027\u201d\u627f\u8bfa**\u3002\u4ed6\u9700\u8981\u88ab\u660e\u786e\u544a\u77e5\u201c\u7b2c\u4e00\u6b65\u505a\u4ec0\u4e48\u3001\u7b2c\u4e8c\u6b65\u505a\u4ec0\u4e48\u3001\u591a\u4e45\u80fd\u6709\u7ed3\u679c\u201d\uff0c\u4ee5\u7f13\u89e3\u5176\u5bf9\u6295\u5165\uff08\u65f6\u95f4\u3001\u91d1\u94b1\uff09\u80fd\u5426\u4ea7\u751f\u56de\u62a5\u7684\u6df1\u5c42\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 **B\u7c7b** (\u52a8\u673a\u660e\u786e\u4f46\u8d44\u6e90\u6709\u9650\uff0c\u9700\u7cbe\u7ec6\u8fd0\u8425) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u578b** (\u6838\u5fc3\u8bc9\u6c42\u662f\u6e05\u6670\u7684\u53d8\u73b0\u8def\u5f84\u548c\u7ed3\u679c\u4fdd\u969c\uff0c\u5bf9\u5174\u8da3\u3001\u5708\u5c42\u7b49\u8f6f\u6027\u4ef7\u503c\u4e0d\u654f\u611f) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a[\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5c5e\u51b2\u7a81\u7b49\u7ea2\u7ebf\u4fe1\u606f]\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | **\u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u9700\u8b66\u60d5**\u3002\u56e0\u5b8c\u5168\u672a\u63d0\u53ca\u5bb6\u5ead\uff0c\u5b58\u5728\u201c\u9690\u7792\u5077\u62a5\u201d\u7684\u53ef\u80fd\uff0c\u4e00\u65e6\u88ab\u5bb6\u4eba\u53d1\u73b0\u53ef\u80fd\u5f15\u53d1\u51b2\u7a81\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u65f6\u95f4\u4e25\u91cd\u4e0d\u8db3**\u3002\u6bcf\u5929\u4ec51-2\u5c0f\u65f6\uff0c\u6781\u6613\u56e0\u5de5\u4f5c/\u751f\u6d3b\u7e41\u5fd9\u5bfc\u81f4\u4f5c\u4e1a\u79ef\u538b\u3001\u76f4\u64ad\u8ddf\u4e0d\u4e0a\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6-\u81ea\u8d23-\u653e\u5f03\u201d\u7684\u6076\u6027\u5faa\u73af\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u7528\u6237\u8868\u73b0\u7406\u6027\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u6682\u65e0\u5de8\u5a74\u503e\u5411\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u5bf9\u53d8\u73b0\u8def\u5f84\u6709\u660e\u786e\u9884\u671f\uff08\u659c\u6760->\u65f6\u85aa->\u5206\u6210\uff09\u3002\u82e5\u201c\u659c\u6760\u201d\u5c97\u4f4d\uff08\u5bf9\u8f68/\u5e72\u97f3\uff09\u5728\u627f\u8bfa\u65f6\u95f4\u5185\uff08\u5982\u7b2c\u516b\u5929\uff09\u65e0\u6cd5\u63a5\u5355\u6216\u6536\u5165\u6781\u4f4e\uff0c\u6613\u4ea7\u751f\u88ab\u6b3a\u9a97\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c2-3\u5468**\u3002\u5f53\u6b63\u5f0f\u8bfe\u7a0b\u4f5c\u4e1a\u91cf\u589e\u52a0\uff0c\u4e0e\u6bcf\u65e51-2\u5c0f\u65f6\u7684\u65f6\u95f4\u9884\u7b97\u4ea7\u751f\u4e25\u91cd\u51b2\u7a81\u65f6\uff1b\u6216\u5f53\u201c\u5feb\u901f\u63a5\u5355\u201d\u627f\u8bfa\u672a\u80fd\u5151\u73b0\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u738b\u660e\u519b\u540c\u5b66\u4f60\u597d\uff0c\u770b\u5230\u4f60\u4e3a\u81ea\u5df1\u89c4\u5212\u4e86\u6e05\u6670\u7684\u2018\u659c\u6760-\u65f6\u85aa-\u5206\u6210\u2019\u4e09\u6b65\u8d70\u8def\u5f84\uff0c\u975e\u5e38\u52a1\u5b9e\u3002\u54b1\u4eec\u8bfe\u7a0b\u8bbe\u8ba1\u5c31\u662f\u4e3a\u50cf\u4f60\u8fd9\u6837\u65f6\u95f4\u5b9d\u8d35\u7684\u540c\u5b66\u51c6\u5907\u7684\uff0c**\u6bcf\u5468\u6838\u5fc3\u4efb\u52a1\u5c311-2\u9879\uff0c\u805a\u7126\u5728\u80fd\u7acb\u523b\u4ea7\u751f\u6536\u76ca\u7684\u6280\u80fd\u70b9\u4e0a**\u3002\u6211\u4f1a\u5e2e\u4f60\u76ef\u7d27\u2018\u7b2c\u516b\u5929\u63a5\u5355\u2019\u8fd9\u4e2a\u91cc\u7a0b\u7891\uff0c\u54b1\u4eec\u4e00\u8d77\u7528\u6700\u5c0f\u65f6\u95f4\u6210\u672c\uff0c\u5148\u62ff\u4e0b\u7b2c\u4e00\u4e2a\u7ed3\u679c\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5feb\u901f\u63a5\u5355\u7ebf**\u3011\u3002\u5fc5\u987b\u4f18\u5148\u786e\u4fdd\u5176\u5bf9\u201c\u659c\u6760\u201d\u5c97\u4f4d\uff08\u5bf9\u8f68\u3001\u5e72\u97f3\uff09\u7684\u63a5\u5355\u901a\u9053\u7545\u901a\uff0c\u5feb\u901f\u83b7\u5f97\u6b63\u53cd\u9988\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\u7279\u70b9\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010**\u65f6\u95f4\u7ba1\u7406\u5305**\u3011\uff08\u5982\uff1a\u6bcf\u5468\u4efb\u52a1\u6e05\u5355\u300115\u5206\u949f\u5fae\u7ec3\u4e60\u6307\u5357\u3001\u53ef\u500d\u901f\u56de\u653e\u7684\u91cd\u70b9\u5207\u7247\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7ed9\u4ed6\u5e03\u7f6e\u8017\u65f6\u5197\u957f\u3001\u4e0e\u76f4\u63a5\u53d8\u73b0\u5173\u8054\u5f31\u7684\u201c\u5174\u8da3\u4f5c\u4e1a\u201d\uff1b\u4e0d\u8981\u7528\u201c\u60c5\u6000\u201d\u3001\u201c\u68a6\u60f3\u201d\u3001\u201c\u5708\u5b50\u201d\u7b49\u865a\u7684\u6982\u5ff5\u8fdb\u884c\u6c9f\u901a\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u672a\u5b8c\u6210\u7b2c\u4e00\u9636\u6bb5\u201c\u659c\u6760\u201d\u53d8\u73b0\u3001\u4e14\u65f6\u95f4\u8d44\u6e90\u672a\u6539\u5584\u524d\uff0c\u4efb\u4f55\u5347\u5355\u5efa\u8bae\u90fd\u4f1a\u52a0\u5267\u5176\u7126\u8651\u548c\u6000\u7591\uff0c\u6781\u6613\u5f15\u53d1\u5d29\u76d8\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5148\u548c\u8001\u5e08\u6c9f\u901a\u4e00\u4e0b\u6211\u7684\u65f6\u95f4\uff0c**\u76ee\u524d\u6bcf\u59291-2\u5c0f\u65f6**\u53ef\u4ee5\u5728\u6f14\u64ad\u5de5\u4f5c\u7684\u517c\u804c\u4e0a\u201d (**\u8d44\u6e90\u5e95\u5ea7\u7684\u81f4\u547d\u77ed\u677f**)\n2. > \u201c\u7406\u89e3\u3002**\u5148\u505a\u659c\u6760\uff08\u5bf9\u8f68/\u5e72\u97f3\uff09\u3001\u518d\u65f6\u85aa\u4e66\u3001\u518d\u5206\u6210\u4e66\u3002**\u201d (**\u641e\u94b1\u7eaf\u5ea6\u7684\u8def\u5f84\u8bc1\u660e**)\n3. > \u201c**\u7a0e\u7684\u95ee\u9898\u53ef\u4ee5\u8bb2\u89e3\u4e00\u4e0b\u5417**\u201d (**\u52a1\u5b9e\u3001\u5173\u6ce8\u843d\u5730\u7ec6\u8282\u7684\u641e\u94b1\u578b\u601d\u7ef4**)\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4\u641e\u94b1\u7ed3\u679c\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\uff08\u7126\u8651\u4fdd\u969c\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u504f\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u4e25\u683c\u5b88\u62a4\u201c\u7b2c\u516b\u5929\u63a5\u5355\u201d\u627f\u8bfa\uff0c\u5e76\u63d0\u4f9b\u6781\u81f4\u9897\u7c92\u5316\u7684\u65f6\u95f4\u7ba1\u7406\u652f\u6301\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf\"}\n```";
