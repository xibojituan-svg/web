    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u7f3a\u652f\u4ed8\u80fd\u529b\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u3001\u5177\u4f53\u804c\u4e1a\u89c4\u5212\u7b49\u5173\u952e\u7ef4\u5ea6\u4fe1\u606f\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u4e2d\u7b49\u504f\u4e0a**\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u201c\u5168\u804c\u201d\u53d1\u5c55\u610f\u613f\uff0c\u5e76\u63d0\u53ca\u201c\u62e9\u4e00\u4e8b\uff0c\u7ec8\u4e00\u751f\u201d\uff0c\u663e\u793a\u51fa\u5bf9\u914d\u97f3\u7684\u5174\u8da3\u548c\u957f\u671f\u6295\u5165\u7684\u610f\u613f\u3002\u52a8\u673a\u517c\u5177\u5174\u8da3\uff08\u201c\u559c\u6b22\u914d\u97f3\u201d\uff09\u4e0e\u804c\u4e1a\u8f6c\u578b\uff08\u5f85\u4e1a\u72b6\u6001\u5bfb\u6c42\u5168\u804c\uff09\u53cc\u91cd\u9a71\u52a8\uff0c\u4f46\u53d8\u73b0\u6025\u8feb\u6027\u672a\u660e\u786e\u91cf\u5316\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u4ec5\u77e5\u7528\u6237\u4e3a\u201c\u5f85\u4e1a\u72b6\u6001\u201d\uff0c\u65f6\u95f4\u5145\u88d5\u3002**\u5173\u952e\u7f3a\u5931**\uff1a\u7ecf\u6d4e\u6765\u6e90\u3001\u50a8\u84c4\u60c5\u51b5\u3001\u53ef\u6295\u5165\u8d44\u91d1\u3001\u8bbe\u5907\u6761\u4ef6\u3001\u8fc7\u5f80\u76f8\u5173\u7ecf\u9a8c\u3002\u5f85\u4e1a\u72b6\u6001\u672c\u8eab\u662f**\u9ad8\u98ce\u9669\u4fe1\u53f7**\uff0c\u6697\u793a\u8d22\u52a1\u7a33\u5b9a\u6027\u53ef\u80fd\u4e0d\u8db3\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u8f83\u9ad8**\u3002\u7528\u6237\u914d\u5408\u5ea6\u9ad8\uff08\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u52a0\u76f4\u64ad\uff09\u3001\u4e3b\u52a8\u590d\u76d8\uff08\u201c\u91cd\u65b0\u7ec3\u4e60\u201d\uff09\u3001\u6709\u6210\u957f\u578b\u601d\u7ef4\uff08\u201c\u5728\u9519\u8bef\u4e2d\u8c03\u6574\u81ea\u6211\u201d\uff09\u3001\u5bf9\u5b66\u4e60\u6709\u79ef\u6781\u53cd\u9988\u3002\u6297\u538b\u6027\u4e0e\u632b\u6298\u8010\u53d7\u5ea6\u5f85\u89c2\u5bdf\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40 \u652f\u4ed8\u6838\u67e5**: **\u672a\u89e6\u53d1**\u3002\u8bb0\u5f55\u4e2d\u65e0\u4efb\u4f55\u5173\u4e8e\u4ef7\u683c\u3001\u652f\u4ed8\u65b9\u5f0f\u3001\u8ba2\u5355\u72b6\u6001\u7684\u8ba8\u8bba\u3002\n*   **\u6b65\u9aa41.5 \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u672a\u89e6\u53d1**\u3002\u65e0\u4efb\u4f55\u6d89\u53ca\u914d\u5076\u3001\u7236\u6bcd\u7b49\u5bb6\u5ead\u6210\u5458\u7684\u8ba8\u8bba\uff0c\u7528\u6237\u51b3\u7b56\u770b\u4f3c\u72ec\u7acb\u3002\n*   **\u6b65\u9aa41 \u52a8\u673a\u7eaf\u5ea6 (M)**: **B\u7c7b (\u4e2d\u7b49)**\u3002\u5174\u8da3\u4e0e\u804c\u4e1a\u8bc9\u6c42\u660e\u786e\uff0c\u4f46\u7f3a\u4e4f\u5177\u4f53\u3001\u53ef\u91cf\u5316\u7684\u76ee\u6807\uff08\u5982\u671f\u671b\u6536\u5165\u3001\u8fbe\u6210\u65f6\u9650\uff09\u3002\n*   **\u6b65\u9aa42 \u8d44\u6e90\u5e95\u5ea7 (R)**: **\u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u5f52\u4e3aC\u7c7b (\u4f4e)**\u3002\u5f85\u4e1a\u72b6\u6001\u662f\u663e\u8457\u98ce\u9669\u70b9\uff0c\u8d22\u52a1\u80fd\u529b\u5b58\u7591\u3002\n*   **\u6b65\u9aa43 \u5fc3\u7406\u5f39\u6027 (E)**: **A\u7c7b (\u9ad8)**\u3002\u5f53\u524d\u8868\u73b0\u79ef\u6781\u3001\u4e3b\u52a8\u3001\u6709\u97e7\u6027\u3002\n*   **\u7efc\u5408\u5224\u5b9a**: **B-C\u578b (\u52a8\u673a\u5c1a\u53ef\u4f46\u8d44\u6e90\u5b58\u7591\u578b)**\u3002\u7528\u6237\u6709\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b\uff0c\u4f46\u8d22\u52a1\u5e95\u5ea7\u662f\u6700\u5927\u4e0d\u786e\u5b9a\u6027\u56e0\u7d20\uff0c\u53ef\u80fd\u6210\u4e3a\u8f6c\u5316\u7684\u6838\u5fc3\u969c\u788d\u6216\u9000\u8d39\u98ce\u9669\u70b9\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b: T4 \u52a1\u5b9e\u63a2\u7d22\u8005**\u3002\u7279\u5f81\uff1a\u5904\u4e8e\u804c\u4e1a\u7a7a\u7a97\u671f\u6216\u8f6c\u578b\u671f\uff0c\u6709\u660e\u786e\u5b66\u4e60\u65b0\u6280\u80fd\u4ee5\u8c0b\u751f\u7684\u9700\u6c42\uff0c\u884c\u52a8\u914d\u5408\u5ea6\u9ad8\uff0c\u4f46\u5bf9\u6295\u5165\u4ea7\u51fa\u6bd4\u654f\u611f\uff0c\u51b3\u7b56\u7406\u6027\u3002\u7528\u6237\u201c\u5f85\u4e1a\u72b6\u6001\u201d\u5bfb\u6c42\u201c\u5168\u804c\u201d\u53d1\u5c55\uff0c\u7b26\u5408T4\u6838\u5fc3\u7279\u5f81\u3002\n*   **\u6b21\u5339\u914d\u539f\u578b: T2 \u5174\u8da3\u9a71\u52a8\u8005**\u3002\u5bf9\u914d\u97f3\u6709\u660e\u786e\u5174\u8da3\uff08\u201c\u6211\u559c\u6b22\u914d\u97f3\u201d\uff09\uff0c\u5e76\u613f\u610f\u6295\u5165\u65f6\u95f4\u7ec3\u4e60\uff0c\u4f46T4\u7684\u751f\u5b58\u538b\u529b\u52a8\u673a\u66f4\u4e3b\u5bfc\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u98ce\u9669\u7b49\u7ea7\uff1a\u4e2d)\n*   **\u6839\u56e01 (\u6548\u679c\u4e0d\u53ca\u9884\u671f)**: **\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u201c\u5168\u804c\u201d\u6709\u8f83\u9ad8\u671f\u5f85\uff0c\u82e5\u5b66\u4e60\u540e\u53d8\u73b0\u8def\u5f84\u4e0d\u6e05\u6670\u6216\u6536\u5165\u8fdc\u4f4e\u4e8e\u9884\u671f\uff0c\u6613\u5f15\u53d1\u6295\u8bc9\u3002\n*   **\u6839\u56e02 (\u7ecf\u6d4e\u538b\u529b)**: **\u9ad8\u98ce\u9669**\u3002**\u5f85\u4e1a\u72b6\u6001\u662f\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u82e5\u65e0\u7a33\u5b9a\u7ecf\u6d4e\u6765\u6e90\uff0c\u4efb\u4f55\u5927\u989d\u6d88\u8d39\u90fd\u53ef\u80fd\u540e\u7eed\u5f15\u53d1\u8d22\u52a1\u538b\u529b\uff0c\u5bfc\u81f4\u9000\u8d39\u3002\n*   **\u6839\u56e03 (\u65f6\u95f4\u51b2\u7a81)**: **\u4f4e\u98ce\u9669**\u3002\u7528\u6237\u65f6\u95f4\u5145\u88d5\uff0c\u914d\u5408\u5ea6\u9ad8\u3002\n*   **\u6839\u56e04 (\u5bb6\u5ead\u53cd\u5bf9)**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\uff0c\u4f46\u72ec\u7acb\u51b3\u7b56\u8ff9\u8c61\u660e\u663e\uff0c\u98ce\u9669\u6682\u4f30\u4e3a\u4f4e\u3002\n*   **\u6839\u56e05 (\u8bfe\u7a0b\u8d28\u91cf)**: **\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u5bf9\u6559\u5b66\u53cd\u9988\u6b63\u9762\u3002\n*   **\u6839\u56e06 (\u9500\u552e\u8bef\u5bfc)**: **\u4e2d\u98ce\u9669**\u3002\u9500\u552e\u8bdd\u672f\u4e2d\u5b58\u5728\u201c\u73b0\u573a\u4ea4\u97f3\u7ed9\u7532\u65b9\u201d\u3001\u201c\u5e26\u7740\u4f60\u641e\u6709\u58f0\u201d\u3001\u201c\u5bf9\u63a5\u4e13\u5c5e\u5267\u7ec4\u8d44\u6e90\u201d\u7b49**\u627f\u8bfa\u6027\u3001\u7ed3\u679c\u6027\u5f15\u5bfc**\uff0c\u82e5\u540e\u7eed\u65e0\u6cd5\u5151\u73b0\uff0c\u6781\u6613\u5f15\u53d1\u4e89\u8bae\u3002\n*   **\u6839\u56e07 (\u5e73\u53f0\u4f53\u9a8c)**: **\u4f4e\u98ce\u9669**\u3002\u65e0\u8d1f\u9762\u53cd\u9988\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u26a0\ufe0f \u5408\u89c4\u96f7\u533a**:\n    1.  **\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u7ed3\u679c\u4fdd\u8bc1**: \u9500\u552e\u591a\u6b21\u4f7f\u7528\u201c\u73b0\u573a\u4ea4\u97f3\u7ed9\u7532\u65b9\u201d\u3001\u201c\u5e26\u7740\u4f60\u641e\u6709\u58f0\u201d\u3001\u201c\u5bf9\u63a5\u4e13\u5c5e\u5267\u7ec4\u8d44\u6e90+\u5e73\u53f0\u8d44\u6e90\u201d\u7b49\u8bdd\u672f\uff0c**\u6d89\u5acc\u6697\u793a\u6216\u627f\u8bfa\u5c31\u4e1a\u3001\u63a5\u5355\u7ed3\u679c**\uff0c\u8fdd\u53cd\u6559\u80b2\u670d\u52a1\u5e7f\u544a\u89c4\u8303\u3002\n    2.  **\u5236\u9020\u7a00\u7f3a\u4e0e\u7126\u8651**: \u201c\u6ca1\u6709\u56de\u653e\u201d\u3001\u201c\u9519\u8fc7\u5c31\u6ca1\u6709\u201d\u3001\u201c\u9650\u65f6\u798f\u5229\u201d\u3001\u201c\u6700\u540e\u4e00\u573a\u201d\u7b49\u8bdd\u672f\u9891\u7e41\u4f7f\u7528\uff0c\u5c5e\u4e8e\u9ad8\u538b\u8feb\u5f0f\u8425\u9500\u3002\n    3.  **\u8eab\u4efd\u6a21\u7cca**: \u9500\u552e\u4ee5\u201c\u53d1\u8d22\u8001\u5e08\u201d\u3001\u201c\u5b66\u59d0\u201d\u3001\u201c\u73ed\u73ed\u201d\u591a\u91cd\u8eab\u4efd\u51fa\u73b0\uff0c\u5e76\u4ee5\u201c\u6211\u7684\u5de5\u4f5c\u5ba4\u201d\u81ea\u5c45\uff0c**\u6a21\u7cca\u4e86\u5e73\u53f0\u9500\u552e\u4e0e\u4e2a\u4eba/\u5de5\u4f5c\u5ba4\u7684\u754c\u9650**\uff0c\u6613\u8ba9\u7528\u6237\u4ea7\u751f\u6df7\u6dc6\u3002\n*   **\u4f26\u7406\u9632\u7ebf**: \u6574\u4f53\u8bdd\u672f\u4ee5\u201c\u641e\u94b1\u201d\u3001\u201c\u8131\u79bb\u4f4e\u7ea7\u82e6\u201d\u3001\u201c\u9760\u8fd1\u5bcc\u4eba\u201d\u4e3a\u4ef7\u503c\u5f15\u5bfc\uff0c\u529f\u5229\u6027\u8f83\u5f3a\uff0c\u4f46\u5bf9\u5904\u4e8e\u5f85\u4e1a\u72b6\u6001\u7684\u7528\u6237\u53ef\u80fd\u4ea7\u751f\u8f83\u5f3a\u5438\u5f15\u529b\u3002\u9700\u8b66\u60d5\u5229\u7528\u7528\u6237\u7126\u8651\u8fdb\u884c\u4e0d\u5f53\u9500\u552e\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**: **\u504f\u5dee**\u3002\u7528\u6237\u76ee\u6807\u4e3a\u201c\u5168\u804c\u201d\uff0c\u4e14\u5f85\u4e1a\u72b6\u6001\u5bf9\u5feb\u901f\u53d8\u73b0\u53ef\u80fd\u6709\u5f3a\u9700\u6c42\u3002\u6807\u51c6\u8bfe\u7a0b\u82e5\u65e0\u6cd5\u63d0\u4f9b\u6e05\u6670\u3001\u5feb\u6377\u7684\u53d8\u73b0\u8def\u5f84\u6216\u5b9e\u4e60\u673a\u4f1a\uff0c\u6613\u5bfc\u81f4\u671f\u671b\u843d\u5dee\u3002\u9700\u5339\u914d\u6709\u660e\u786e\u5b9e\u4e60\u3001\u63a5\u5355\u673a\u5236\u6216\u5c31\u4e1a\u8f85\u5bfc\u7684\u9ad8\u9636\u4ea7\u54c1\uff0c\u6216\u660e\u786e\u544a\u77e5\u6807\u51c6\u8bfe\u7a0b\u4e0e\u201c\u5168\u804c\u201d\u76ee\u6807\u4e4b\u95f4\u7684\u5dee\u8ddd\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **\u652f\u4ed8\u80fd\u529b\u4e0e\u5b66\u4e60\u76ee\u6807\u6df1\u5ea6\u6838\u5b9e**\n*   **\u5177\u4f53\u884c\u52a8\u6307\u5357**:\n    1.  **\u9996\u8981\u52a8\u4f5c**: \u5728\u63a8\u6b63\u5f0f\u8bfe\u7a0b\u524d\uff0c**\u5fc5\u987b\u79c1\u4e0b\u3001\u59d4\u5a49\u5730\u6838\u5b9e\u7528\u6237\u7684\u7ecf\u6d4e\u72b6\u51b5\u4e0e\u652f\u4ed8\u89c4\u5212**\u3002\u4f8b\u5982\uff1a\u201c\u770b\u5230\u4f60\u975e\u5e38\u8ba4\u771f\uff0c\u76ee\u6807\u4e5f\u5f88\u660e\u786e\u3002\u4e3a\u4e86\u5e2e\u4f60\u89c4\u5212\u66f4\u6e05\u6670\u7684\u8def\u5f84\uff0c\u60f3\u4e86\u89e3\u4e00\u4e0b\u4f60\u76ee\u524d\u5bf9\u5b66\u4e60\u6295\u5165\u7684\u9884\u7b97\u5927\u6982\u5728\u4ec0\u4e48\u8303\u56f4\uff1f\u8fd9\u90e8\u5206\u8d39\u7528\u662f\u9700\u8981\u81ea\u5df1\u627f\u62c5\u8fd8\u662f\u548c\u5bb6\u4eba\u4e00\u8d77\u89c4\u5212\uff1f\u201d\u3002\n    2.  **\u9884\u671f\u7ba1\u7406**: \u5fc5\u987b\u660e\u786e\u544a\u77e5\uff1aA) \u6210\u4e3a\u5168\u804c\u914d\u97f3\u6f14\u5458\u9700\u8981\u957f\u671f\u7cfb\u7edf\u8bad\u7ec3\u548c\u5e02\u573a\u7ade\u4e89\uff1bB) \u8bfe\u7a0b\u63d0\u4f9b\u7684\u662f\u6280\u80fd\u6559\u5b66\u548c\u8d44\u6e90\u5bf9\u63a5\u673a\u4f1a\uff0c**\u4e0d\u4fdd\u8bc1\u5c31\u4e1a\u548c\u6536\u5165**\uff1bC) \u6f84\u6e05\u9500\u552e\u8bdd\u672f\u4e2d\u201c\u5de5\u4f5c\u5ba4\u201d\u3001\u201c\u8d44\u6e90\u201d\u7684\u5177\u4f53\u542b\u4e49\uff08\u662f\u5e73\u53f0\u8d44\u6e90\u8fd8\u662f\u4e2a\u4eba\u6e20\u9053\uff09\u3002\n    3.  **\u98ce\u9669\u9884\u8b66**: \u82e5\u7528\u6237\u7ecf\u6d4e\u80fd\u529b\u660e\u663e\u4e0d\u8db3\uff0c\u5e94**\u53cb\u597d\u529d\u9000**\u6216\u5f15\u5bfc\u5176\u9009\u62e9\u66f4\u57fa\u7840\u7684\u514d\u8d39/\u4f4e\u4ef7\u8bfe\u7a0b\uff0c\u907f\u514d\u540e\u7eed\u56e0\u7ecf\u6d4e\u538b\u529b\u9000\u8d39\u3002\n    4.  **\u6301\u7eed\u5173\u6ce8**: \u5373\u4f7f\u8f6c\u5316\uff0c\u9996\u6708\u9700\u91cd\u70b9\u8ddf\u8fdb\u5176\u5b66\u4e60\u8fdb\u5c55\u4e0e\u5fc3\u7406\u72b6\u6001\uff0c\u5f3a\u5316\u57fa\u7840\u7ec3\u4e60\uff0c\u907f\u514d\u56e0\u521d\u671f\u63a5\u5355\u4e0d\u987a\u800c\u4ea7\u751f\u5de8\u5927\u5931\u843d\u611f\u3002\n\n{\"core_type\": \"T4 \u52a1\u5b9e\u63a2\u7d22\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u652f\u4ed8\u80fd\u529b\u4e0e\u5b66\u4e60\u76ee\u6807\u6df1\u5ea6\u6838\u5b9e\"}";
