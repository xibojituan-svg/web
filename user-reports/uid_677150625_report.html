    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677150625 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-06 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u653e\u98de\u7684\u5927\u773c\u775b(\u5f20\u57f9\u6e05) / \u6d1b\u5947\u6eaa\u5802(\u5f20\u723d) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u7cfb\u7edf\u8bfe (7380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u5145\u88d5 (\u5df2\u652f\u4ed87380\u5143\uff0c\u4ec5\u8be2\u95ee\u4f18\u60e0\uff0c\u672a\u63d0\u53ca\u8d44\u91d1\u538b\u529b) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u9ad8\u5bbd\u88d5 (\u6709\u672c\u804c\u5de5\u4f5c\uff0c\u4f46\u80fd\u957f\u65f6\u95f4\u53c2\u4e0e\u76f4\u64ad\u3001\u5b8c\u6210\u4f5c\u4e1a\uff0c\u65f6\u95f4\u5b89\u6392\u7075\u6d3b) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u5355\u8eab\u72ec\u7acb (\u5bf9\u8bdd\u4e2d\u672a\u63d0\u53ca\u5bb6\u5ead\uff0c\u8be2\u95ee\u201c\u5bb6\u4eba\u80fd\u5426\u5171\u7528\u8d26\u53f7\u201d\uff0c\u6697\u793a\u72ec\u7acb\u51b3\u7b56) |\n| **\u4fe1\u606f\u539a\u5ea6** | \u9971\u6ee1 (\u7528\u6237\u4e92\u52a8\u79ef\u6781\uff0c\u63d0\u4f9b\u4e86\u5927\u91cf\u5173\u4e8e\u52a8\u673a\u3001\u9884\u671f\u3001\u5b66\u4e60\u884c\u4e3a\u7684\u4fe1\u53f7) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u957f\u671f\u53d1\u5c55\u800c\u6765\uff0c\u5173\u6ce8\u6280\u80fd\u672c\u8eab\u3001\u5b66\u4e60\u8def\u5f84\u3001\u6295\u5165\u4ea7\u51fa\u6bd4\uff0c\u800c\u975e\u77ed\u671f\u53d8\u73b0\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> 1. \u201c\u9664\u4e86\u6536\u5165\uff0c\u8fd9\u4e2a\u5de5\u4f5c\u53ef\u4ee5\u957f\u671f\u505a\u4e0b\u53bb\uff0c\u4e0d\u5b58\u5728\u6cd5\u5b9a\u9000\u4f11\u5e74\u9f84\u7684\u754c\u9650\u201d\n> 2. \u201c\u8ba4\u53ef\u77e5\u8bc6\u4ed8\u8d39\uff0c\u4f46\u4e5f\u4f1a\u8003\u8651\u5b66\u8d39\u4ef7\u683c\u4ee5\u53ca\u53c2\u52a0\u4e86\u8bfe\u7a0b\u540e\u7684\u6295\u5165\u4ea7\u51fa\u6bd4\uff0c\u6bd4\u5982\u591a\u4e45\u53ef\u4ee5\u628a\u5b66\u8d39\u8d5a\u56de\u6765\u201d\n> 3. \u591a\u6b21\u8be2\u95ee\u8bfe\u7a0b\u7ec6\u8282\u3001\u8001\u5e08\u8d44\u8d28\u3001\u5b66\u4e60\u5b89\u6392\uff0c\u800c\u975e\u76f4\u63a5\u95ee\u201c\u80fd\u8d5a\u591a\u5c11\u94b1\u201d\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b06\u9ad8\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u9ad8** \u2014 \u5df2\u652f\u4ed87380\u5143\u5168\u6b3e\uff0c\u4ec5\u793c\u8c8c\u6027\u8be2\u95ee\u4f18\u60e0\uff0c\u65e0\u4efb\u4f55\u8d44\u91d1\u7d27\u5f20\u8868\u8ff0\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u9ad8** \u2014 \u6709\u672c\u804c\u5de5\u4f5c\u4f46\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5f3a\uff0c\u80fd\u8fde\u7eed\u6570\u65e5\u957f\u65f6\u95f4\u53c2\u4e0e\u76f4\u64ad\u3001\u4e3b\u52a8\u5b8c\u6210\u4f5c\u4e1a\u3001\u79ef\u6781\u63d0\u95ee\u3002\u80fd\u8bc6\u522b\u5e76\u6307\u51fa\u670d\u52a1\u6d41\u7a0b\u4e2d\u7684\u6df7\u4e71\uff08\u5982\u4e0d\u540c\u4eba\u767b\u5f55\u5fae\u4fe1\u53f7\u3001\u53e3\u4ee4\u6df7\u4e71\uff09\uff0c\u903b\u8f91\u6e05\u6670\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u9ad8** \u2014 \u5bf9\u8bdd\u4e2d\u672a\u51fa\u73b0\u5bb6\u5ead\u963b\u529b\u4fe1\u53f7\uff0c\u4e14\u4e3b\u52a8\u8be2\u95ee\u201c\u5bb6\u4eba\u80fd\u5426\u4e00\u8d77\u5b66\u4e60/\u63a5\u5355\u201d\uff0c\u6697\u793a\u5bb6\u5ead\u73af\u5883\u652f\u6301\u6216\u81f3\u5c11\u77e5\u60c5\u3002\n- **\u5e95\u5ea7\u53d6\u77ed\u677f**\uff1a**\u9ad8**\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9762\u5bf9\u670d\u52a1\u6df7\u4e71\uff08\u53e3\u4ee4\u95ee\u9898\u3001\u5fae\u4fe1\u53f7\u591a\u4eba\u767b\u5f55\u3001\u8d60\u4e66\u4e0d\u5339\u914d\uff09\u65f6\uff0c\u4fdd\u6301\u51b7\u9759\u3001\u7406\u6027\u8ffd\u95ee\u3001\u63d0\u51fa\u5efa\u8bbe\u6027\u610f\u89c1\uff08\u201c\u5b66\u7ba1\u670d\u52a1\u7684\u5ba2\u6237\u4f53\u9a8c\u611f\u9700\u8981\u63d0\u5347\u54e6\u201d\uff09\uff0c\u800c\u975e\u60c5\u7eea\u5d29\u6e83\u6216\u6307\u8d23\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> 1. \u201c\u4eba\u592a\u591a\uff0c\u641e\u6df7\u4e86\u5427[\u7834\u6d95\u4e3a\u7b11]\u201d (\u9762\u5bf9\u9519\u8bef\u63d0\u9192\u65f6\u7684\u53cd\u5e94)\n> 2. \u201c\u4f60\u4eec\u8fd9\u4e2a\u5fae\u4fe1\u53f7\u662f\u4e0d\u662f\u4e0d\u540c\u7684\u4eba\u5728\u767b\u5f55\u4f7f\u7528\uff0c\u600e\u4e48\u8bf4\u8bdd\u524d\u8a00\u4e0d\u642d\u540e\u8bed\u7684[\u8138\u7ea2]\u201d (\u53d1\u73b0\u95ee\u9898\u5e76\u7406\u6027\u6307\u51fa)\n> 3. \u201c\u5b66\u7ba1\u670d\u52a1\u7684\u5ba2\u6237\u4f53\u9a8c\u611f\u9700\u8981\u63d0\u5347\u54e6\u201d (\u63d0\u51fa\u6539\u8fdb\u5efa\u8bae\uff0c\u800c\u975e\u62b1\u6028)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 (\u6e34\u671b\u6210\u5c31\u3001\u8ba4\u53ef\u4e0e\u72ec\u7acb\u4ef7\u503c)\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9**\u957f\u671f\u804c\u4e1a\u4ef7\u503c**\u548c**\u4e2a\u4eba\u80fd\u529b\u6210\u957f**\u7684\u8ffd\u6c42\uff0c\u8fdc\u8d85\u5bf9\u5373\u65f6\u73b0\u91d1\u56de\u62a5\u7684\u6e34\u671b\u3002\u4ed6\u9700\u8981\u8bc1\u660e\u81ea\u5df1\u9009\u62e9\u7684\u6b63\u786e\u6027\uff0c\u5e76\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u6280\u80fd\u83b7\u5f97\u793e\u4f1a\u8ba4\u53ef\u548c\u72ec\u7acb\u7684\u4e8b\u4e1a\u8eab\u4efd\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u6e05\u6670\u7684\u6210\u957f\u8def\u5f84\u56fe**\u3002\u4ed6\u9700\u8981\u88ab\u5f53\u4f5c\u4e00\u4e2a\u7406\u667a\u7684\u3001\u6709\u89c4\u5212\u7684\u6210\u5e74\u4eba\u6765\u5bf9\u5f85\uff0c\u9700\u8981\u770b\u5230\u7cfb\u7edf\u6027\u7684\u8fdb\u6b65\u548c\u672a\u6765\u53ef\u80fd\u6027\uff0c\u800c\u975e\u7b80\u5355\u7684\u60c5\u7eea\u5b89\u629a\u6216\u53d8\u73b0\u627f\u8bfa\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 **B\u7c7b (\u6210\u957f\u6295\u8d44\u578b)** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u578b** (\u504f\u7406\u6027\u7248) / **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u5bb6\u5ead\u652f\u6301\u5ea6\u9ad8\uff0c\u51b3\u7b56\u72ec\u7acb\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u65f6\u95f4\u7cbe\u529b\u5145\u6c9b\uff0c\u5b66\u4e60\u610f\u613f\u5f3a\uff0c\u81ea\u5f8b\u6027\u597d\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4e2d** | **\u5bf9\u670d\u52a1\u6d41\u7a0b\u7684\u4e13\u4e1a\u6027\u548c\u4e00\u81f4\u6027\u8981\u6c42\u6781\u9ad8**\u3002\u5f53\u524d\u9500\u552e/\u73ed\u4e3b\u4efb\u7aef\u7684\u6df7\u4e71\uff08\u591a\u4eba\u767b\u5f55\u3001\u4fe1\u606f\u4e0d\u4e00\u81f4\uff09\u5df2\u5f15\u53d1\u5176\u8d28\u7591\u3002\u82e5\u6b63\u5f0f\u5f00\u8bfe\u540e\uff0c\u8bfe\u7a0b\u4ea4\u4ed8\u3001\u5e08\u8d44\u3001\u670d\u52a1\u51fa\u73b0\u7c7b\u4f3c\u201c\u4e0d\u4e13\u4e1a\u201d\u6216\u201c\u627f\u8bfa\u4e0d\u7b26\u201d\u7684\u60c5\u51b5\uff0c\u6781\u6613\u5f15\u53d1\u5176\u7406\u6027\u4f46\u575a\u51b3\u7684\u9000\u8d39\u8bc9\u6c42\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u867d\u4e0d\u8ffd\u6c42\u77ed\u671f\u66b4\u5bcc\uff0c\u4f46\u5bf9\u201c\u6295\u5165\u4ea7\u51fa\u6bd4\u201d\u6709\u660e\u786e\u8ba1\u7b97\u548c\u9884\u671f\u3002\u82e5\u5b66\u4e60\u4e00\u6bb5\u65f6\u95f4\u540e\uff08\u59823-6\u4e2a\u6708\uff09\uff0c\u53d1\u73b0\u6280\u80fd\u6210\u957f\u7f13\u6162\u6216\u63a5\u5355\u673a\u4f1a\u8fdc\u4f4e\u4e8e\u5ba3\u4f20\uff0c\u53ef\u80fd\u56e0\u201c\u4ef7\u503c\u672a\u8fbe\u9884\u671f\u201d\u800c\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c1\u4e2a\u6708**\u3002\u5f53\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u8fdb\u5165\u67af\u71e5\u7ec3\u4e60\u671f\uff0c\u82e5\u540c\u65f6\u906d\u9047\u670d\u52a1\u7455\u75b5\u6216\u53d1\u73b0\u6210\u957f\u901f\u5ea6\u4e0d\u53ca\u9884\u671f\uff0c\u7406\u6027\u8ba1\u7b97\u4f1a\u9a71\u4f7f\u5176\u679c\u65ad\u6b62\u635f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u540c\u5b66\u4f60\u597d\uff0c\u770b\u5230\u4f60\u5728\u62db\u52df\u671f\u5c31\u5c55\u73b0\u4e86\u5f88\u5f3a\u7684\u89c4\u5212\u80fd\u529b\u548c\u5b66\u4e60\u4e3b\u52a8\u6027\uff0c\u975e\u5e38\u6b23\u8d4f\u3002\u54b1\u4eec\u7684\u8bfe\u7a0b\u4f53\u7cfb\u6b63\u662f\u4e3a\u50cf\u4f60\u8fd9\u6837\u5e0c\u671b**\u7cfb\u7edf\u63d0\u5347\u3001\u957f\u671f\u53d1\u5c55**\u7684\u540c\u5b66\u8bbe\u8ba1\u7684\u3002\u63a5\u4e0b\u6765\u6211\u4f1a\u4e3a\u4f60\u68b3\u7406\u6e05\u6670\u7684\u5b66\u4e60\u5730\u56fe\u548c\u6bcf\u4e2a\u9636\u6bb5\u7684\u91cc\u7a0b\u7891\uff0c\u54b1\u4eec\u4e00\u8d77\u7a33\u624e\u7a33\u6253\uff0c\u628a\u771f\u672c\u4e8b\u5b66\u5230\u624b\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u91cd\u70b9\u5bf9\u63a5\u7cfb\u7edf\u8bfe\u7a0b\u3001\u8fdb\u9636\u6280\u5de7\u8bfe\u3001\u5bfc\u6f14\u5e26\u6559\u9879\u76ee\u3002\u907f\u514d\u8fc7\u5ea6\u8425\u9500\u201c\u5feb\u94b1\u201d\u6848\u4f8b\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176T4\uff08\u7406\u6027\u641e\u94b1\uff09\u7279\u8d28\uff0c\u8865\u5145 **\u3010\u900f\u660e\u6210\u957f\u8def\u5f84\u56fe\u3011** \u548c **\u3010\u63a5\u5355\u8d44\u6e90\u5bf9\u63a5\u901a\u9053\u3011**\uff1b\u9488\u5bf9\u5176T2\uff08\u4f4e\u8c03\u5b9e\u5e72\uff09\u6f5c\u8d28\uff0c\u53ef\u9080\u8bf7\u53c2\u4e0e **\u3010\u9879\u76ee\u5236\u5b9e\u6218\u5c0f\u7ec4\u3011**\uff0c\u7ed9\u4e88\u5b9e\u64cd\u548c\u8ba4\u53ef\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u5b9d\u5988\u9006\u88ad\u201d\u3001\u201c\u6708\u5165\u8fc7\u4e07\u201d\u7b49\u60c5\u611fPUA\u8bdd\u672f\uff1b\u63d0\u4f9b\u6a21\u7cca\u3001\u4e0d\u4e00\u81f4\u7684\u4fe1\u606f\uff1b\u8f7b\u89c6\u5176\u5bf9\u6d41\u7a0b\u548c\u4e13\u4e1a\u6027\u7684\u8d28\u7591\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u57fa\u7840\u6280\u80fd\u672a\u5de9\u56fa\u524d\u63a8\u8350\u9ad8\u4ef7\u201c\u66b4\u5bcc\u201d\u7c7b\u5347\u5355\u8bfe\u7a0b**\u3002\u53ef\u57fa\u4e8e\u5176\u5df2\u5c55\u73b0\u7684\u6280\u80fd\u8fdb\u6b65\u548c\u9879\u76ee\u53c2\u4e0e\u5ea6\uff0c\u5728\u4e2d\u671f\uff08\u59823\u4e2a\u6708\u540e\uff09\u63a8\u8350\u66f4\u5782\u76f4\u7684**\u9ad8\u9636\u6280\u80fd\u6a21\u5757\u6216\u8d44\u6e90\u5305**\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u9664\u4e86\u6536\u5165\uff0c\u8fd9\u4e2a\u5de5\u4f5c\u53ef\u4ee5\u957f\u671f\u505a\u4e0b\u53bb\uff0c\u4e0d\u5b58\u5728\u6cd5\u5b9a\u9000\u4f11\u5e74\u9f84\u7684\u754c\u9650\u201d\n2. > \u201c\u8ba4\u53ef\u77e5\u8bc6\u4ed8\u8d39\uff0c\u4f46\u4e5f\u4f1a\u8003\u8651\u5b66\u8d39\u4ef7\u683c\u4ee5\u53ca\u53c2\u52a0\u4e86\u8bfe\u7a0b\u540e\u7684\u6295\u5165\u4ea7\u51fa\u6bd4\uff0c\u6bd4\u5982\u591a\u4e45\u53ef\u4ee5\u628a\u5b66\u8d39\u8d5a\u56de\u6765\u201d\n3. > \u201c\u4f60\u4eec\u8fd9\u4e2a\u5fae\u4fe1\u53f7\u662f\u4e0d\u662f\u4e0d\u540c\u7684\u4eba\u5728\u767b\u5f55\u4f7f\u7528\uff0c\u600e\u4e48\u8bf4\u8bdd\u524d\u8a00\u4e0d\u642d\u540e\u8bed\u7684[\u8138\u7ea2]\u201d \u4e0e \u201c\u5b66\u7ba1\u670d\u52a1\u7684\u5ba2\u6237\u4f53\u9a8c\u611f\u9700\u8981\u63d0\u5347\u54e6\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010\u7406\u6027\u641e\u94b1\u5b9e\u5e72\u5bb6\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u4e0e\u53ef\u9a8c\u8bc1\u7684\u957f\u671f\u804c\u4e1a\u4ef7\u503c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u81f4\u4e13\u4e1a\u3001\u900f\u660e\u3001\u4e00\u81f4\u7684\u670d\u52a1\u4ea4\u4ed8\uff0c\u7528\u6e05\u6670\u7684\u6210\u957f\u8def\u5f84\u548c\u9636\u6bb5\u6027\u6210\u679c\u6ee1\u8db3\u5176\u201c\u6295\u5165\u4ea7\u51fa\u6bd4\u201d\u9884\u671f\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u578b (\u504f\u7406\u6027)\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u7b2c\u56db\u5c42\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u900f\u660e\u6210\u957f\u8def\u5f84\u56fe\"}\n```";
