    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677164448\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677164448 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5c0f\u9177(\u6881\u723d) / \u51ac\u51ac\u8001\u5e08\u3010\u5f20\u9707\u8001\u5e08\u5f92\u5f1f\u3011(\u6881\u723d) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u5f20\u9707\u8001\u5e08\u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u4ef7\u683c\u672a\u77e5\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u5206\u671f\u6216\u501f\u8d37\u60c5\u51b5\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u7528\u6237\u80fd\u8ddf\u4e0a\u8bfe\u7a0b\u8282\u594f\u3001\u53c2\u4e0e\u76f4\u64ad\u3001\u5b8c\u6210\u4f5c\u4e1a\uff0c\u8868\u660e\u6709**\u788e\u7247\u5316\u62fc\u51d1**\u7684\u5b66\u4e60\u65f6\u95f4\uff0c\u4f46\u672a\u660e\u786e\u804c\u4e1a\u6216\u65f6\u95f4\u5b89\u6392\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u7528\u6237\u884c\u4e3a\uff08\u4f5c\u4e1a\u3001\u4e92\u52a8\uff09\u4fe1\u53f7\u660e\u786e\uff0c\u4f46\u5173\u952e\u80cc\u666f\u4fe1\u606f\uff08\u652f\u4ed8\u3001\u65f6\u95f4\u3001\u5bb6\u5ead\uff09\u7f3a\u5931\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e\uff0c\u4f46\u5fc3\u6001\u52a1\u5b9e\uff0c\u5173\u6ce8\u8def\u5f84\u53ef\u884c\u6027**\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u201c\u4ee5\u540e\u5e0c\u671b\u5148\u4ece\u5e55\u540e\u505a\u8d77\uff0c\u753b\u672c\uff0c\u5ba1\u542c\uff0c\u5bf9\u8f68\u90fd\u53ef\u4ee5\uff0c\u7136\u540e\u65f6\u85aa\u4e66\u548c\u5546\u914d\u90fd\u53ef\u4ee5\u5c1d\u8bd5\u4e00\u4e0b\u201d\uff0c\u5e76\u591a\u6b21\u8be2\u95ee\u8bbe\u5907\u6210\u672c\u7b49\u73b0\u5b9e\u95ee\u9898\uff0c\u8868\u660e\u5176\u6838\u5fc3\u9a71\u52a8\u529b\u662f**\u5b89\u5168\u9700\u6c42**\u5c42\u9762\u7684\u517c\u804c\u589e\u6536\uff0c\u800c\u975e\u7eaf\u7cb9\u7684\u201c\u51e0\u5929\u66b4\u5bcc\u201d\u5e7b\u60f3\u6216\u81ea\u6211\u5b9e\u73b0\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4ee5\u540e\u5e0c\u671b\u5148\u4ece\u5e55\u540e\u505a\u8d77\uff0c\u753b\u672c\uff0c\u5ba1\u542c\uff0c\u5bf9\u8f68\u90fd\u53ef\u4ee5\uff0c\u7136\u540e\u65f6\u85aa\u4e66\u548c\u5546\u914d\u90fd\u53ef\u4ee5\u5c1d\u8bd5\u4e00\u4e0b[\u65fa\u67f4]\u201d > \u201c\u53ef\u4ee5\u505a\u957f\u671f\u7684\u8bdd\u5f53\u7136\u597d\u4e86\u201d > \u201c\u60a8\u8bf4\u7684\u5f00\u8bfe8\u5929\u540e\u5c31\u80fd\u63a5\u5355\u4e86\uff0c\u90a3\u5230\u65f6\u5019\u662f\u4e0d\u5c31\u5f97\u4e70\u8bbe\u5907\u554a\uff0c\u6709\u7528\u624b\u673a\u80fd\u63a5\u7684\u5355\u561b[\u53d1\u5446]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u7528\u6237\u53cd\u590d\u8be2\u95ee\u8bbe\u5907\u6210\u672c\uff08\u201c\u9884\u7b97\u6709\u9650\u554a\u201d\uff09\uff0c\u5bf9\u6295\u5165\u654f\u611f\uff0c\u8868\u660e\u8d44\u91d1\u975e\u5145\u88d5\u72b6\u6001\uff0c\u4f46\u672a\u5230\u501f\u8d37\u5730\u6b65\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\u4e92\u52a8\uff08\u201c\u6765\u5566\u6765\u5566\uff0c\u521a\u521a\u5728\u5f00\u8f66\u201d\uff09\uff0c\u8868\u660e\u6709\u53ef\u5229\u7528\u7684\u788e\u7247\u65f6\u95f4\uff0c\u4f46\u975e\u5b8c\u5168\u81ea\u7531\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u672a\u77e5** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8 (7-8\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u7528\u6237\u4e3b\u52a8\u3001\u79ef\u6781\u5730\u8ddf\u8fdb\u5b66\u4e60\uff08\u4e3b\u52a8\u8981\u56de\u653e\u3001\u6309\u65f6\u6253\u5361\uff09\uff0c\u9762\u5bf9\u9500\u552e\u5173\u4e8e\u53d8\u73b0\u8def\u5f84\u7684\u5bc6\u96c6\u4fe1\u606f\u8f93\u51fa\uff0c\u80fd\u6e05\u6670\u3001\u6709\u6761\u7406\u5730\u8868\u8fbe\u81ea\u5df1\u7684\u89c4\u5212\uff08\u4ece\u5e55\u540e\u5230\u53f0\u524d\uff09\uff0c\u672a\u51fa\u73b0\u4efb\u4f55\u81ea\u6211\u6000\u7591\u3001\u7126\u8651\u6216\u4f9d\u8d56\u5b89\u629a\u7684\u4fe1\u53f7\u3002\u8868\u73b0\u51fa\u8f83\u5f3a\u7684\u76ee\u6807\u611f\u548c\u6267\u884c\u529b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u597d\u7684\uff0c\u8c22\u8c22\u5e08\u59d0\u201d > \u201c\u5fc5\u987b\u80fd\u201d > \u201c\u662f\u7684\u662f\u7684\uff0c\u6709\u4e2a\u597d\u7684\u5f15\u8def\u4eba\u592a\u91cd\u8981\u5566\u201d > \u201c\u5176\u5b9e\u90fd\u60f3\u8bd5\u8bd5\uff0c\u4f46\u662f\u65f6\u95f4\u6709\u9650\uff0c\u5148\u4ece\u7b80\u5355\u7684\u505a\u8d77\u5427\uff0c\u54c8\u54c8\u54c8\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42\uff08\u7126\u8651\u4fdd\u969c\uff09**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9**\u6295\u5165\u4ea7\u51fa\u6bd4\u4e0d\u786e\u5b9a\u6027\u7684\u7126\u8651**\u3002\u7528\u6237\u4e0d\u6392\u65a5\u5b66\u4e60\uff0c\u4f46\u975e\u5e38\u5173\u5fc3\u201c\u591a\u4e45\u80fd\u63a5\u5355\u201d\u3001\u201c\u8bbe\u5907\u6210\u672c\u9ad8\u4e0d\u9ad8\u201d\u3001\u201c\u624b\u673a\u80fd\u4e0d\u80fd\u505a\u201d\u7b49\u73b0\u5b9e\u95ee\u9898\uff0c\u6838\u5fc3\u662f\u5bfb\u6c42\u4e00\u4efd**\u786e\u5b9a\u3001\u53ef\u63a7\u3001\u4f4e\u98ce\u9669\u7684\u517c\u804c\u589e\u6536\u8def\u5f84**\uff0c\u4ee5\u589e\u52a0\u7ecf\u6d4e\u5b89\u5168\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u843d\u5730\u7684\u53d8\u73b0\u8def\u5f84\u56fe\u548c\u201c\u57ab\u811a\u77f3\u201d\u5f0f\u7684\u5b89\u5168\u611f**\u3002\u7528\u201c\u4ece\u753b\u672c/\u5ba1\u542c\u7b49\u5e55\u540e\u5de5\u4f5c\u5165\u624b\u201d\u7684\u4f4e\u95e8\u69db\u65b9\u6848\uff0c\u4ee5\u53ca\u201c\u65b0\u624b\u533a\u5355\u5b50\u4e0d\u8981\u6c42\u8bbe\u5907\u201d\u7684\u627f\u8bfa\uff0c\u6d88\u9664\u5176\u5bf9\u4e8e\u9ad8\u6295\u5165\u3001\u9ad8\u98ce\u9669\u7684\u6050\u60e7\uff0c\u5efa\u7acb\u201c\u4e00\u6b65\u6b65\u6765\uff0c\u7a33\u624e\u7a33\u6253\u201d\u7684\u4fe1\u5fc3\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u52a8\u673a\u4e2d\u3001\u5f39\u6027\u9ad8\u3001\u8d44\u6e90\u4e2d\uff0c\u52a1\u5b9e\u80af\u5e72\uff0c\u6267\u884c\u529b\u5f3a) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u8a00\u8bba\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u8868\u73b0\u7406\u6027\uff0c\u975e\u51b2\u52a8\u6d88\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u7528\u6237\u5b66\u4e60\u8282\u594f\u7a33\u5b9a\uff0c\u4e3b\u52a8\u6027\u5f3a\uff0c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u53ef\u89c1\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u672a\u8868\u73b0\u51fa\u60c5\u7eea\u4f9d\u8d56\u6216\u73bb\u7483\u5fc3\u8ff9\u8c61\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u4e2d** | **\u8fd9\u662f\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u5982\u679c\u5f00\u8bfe8\u5929\u540e\u672a\u80fd\u63a5\u89e6\u5230\u7b26\u5408\u5176\u201c\u4ece\u7b80\u5355\u5e55\u540e\u5de5\u4f5c\u5165\u624b\u201d\u9884\u671f\u7684\u63a5\u5355\u673a\u4f1a\uff0c\u6216\u53d1\u73b0\u5b9e\u9645\u8bbe\u5907/\u65f6\u95f4\u6210\u672c\u8fdc\u8d85\u9884\u671f\uff0c\u53ef\u80fd\u56e0\u201c\u627f\u8bfa\u672a\u5151\u73b0\u201d\u800c\u4ea7\u751f\u5f3a\u70c8\u843d\u5dee\u611f\uff0c\u8fdb\u800c\u8981\u6c42\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c2-4\u5468**\u3002\u6b64\u65f6\u7528\u6237\u6280\u80fd\u521d\u6b65\u5f62\u6210\uff0c\u5bf9\u53d8\u73b0\u7684\u671f\u671b\u503c\u8fbe\u5230\u9876\u5cf0\u3002\u82e5\u6b64\u65f6\u5e73\u53f0\u63d0\u4f9b\u7684\u201c\u65b0\u624b\u5355\u201d\u95e8\u69db\u8fc7\u9ad8\u3001\u7ade\u4e89\u6fc0\u70c8\u6216\u4e0e\u5ba3\u4f20\u4e0d\u7b26\uff0c\u6781\u6613\u89e6\u53d1\u9000\u8d39\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u770b\u5230\u4f60\u89c4\u5212\u5f97\u5f88\u6e05\u6670\uff0c\u4ece\u5e55\u540e\u5de5\u4f5c\u5207\u5165\uff0c\u8fd9\u4e2a\u601d\u8def\u975e\u5e38\u7a33\u3002\u54b1\u4eec\u8bfe\u7a0b\u5c31\u662f\u4e3a\u4f60\u8fd9\u79cd\u52a1\u5b9e\u6d3e\u8bbe\u8ba1\u7684\uff0c\u524d\u671f\u4f1a\u91cd\u70b9\u5e26\u4f60\u719f\u6089\u753b\u672c\u3001\u5ba1\u542c\u8fd9\u4e9b\u2018\u786c\u901a\u8d27\u2019\u6280\u80fd\uff0c\u786e\u4fdd\u4f60\u5b66\u5b8c\u5c31\u80fd\u6478\u5230\u95e8\u69db\u3002\u8bbe\u5907\u7684\u4e8b\u5b8c\u5168\u4e0d\u7528\u62c5\u5fc3\uff0c\u54b1\u4eec\u6709\u5f88\u591a\u4f4e\u6210\u672c\u89e3\u51b3\u65b9\u6848\uff0c\u6211\u4f1a\u4e00\u6b65\u6b65\u5e26\u4f60\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176\u52a1\u5b9e\u3001\u8ffd\u6c42\u7a33\u5b9a\u53d8\u73b0\u7684\u9700\u6c42\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T2\u8001\u9ec4\u725b\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145**\u3010B\u6a21\u5757(\u6ee1\u914d)\uff1a\u786c\u6838\u624b\u827a\u6c60\u3011**\u3002\u5373\uff1a\u63d0\u4f9b\u7cbe\u786e\u7684\u6d3e\u5355\u6307\u5bfc\uff08\u5c24\u5176\u662f\u753b\u672c\u3001\u5ba1\u542c\u7c7b\u5e55\u540e\u5355\uff09\u3001\u9ad8\u8d28\u91cf\u76841v1\u4f5c\u4e1a\u70b9\u8bc4\u3001\u6e05\u6670\u7684\u6280\u80fd\u8fdb\u9636\u8def\u5f84\u56fe\u3002**\u5207\u5fcc\u8fc7\u65e9\u63a8\u9500\u9ad8\u4ef7\u8bbe\u5907\u6216\u9ad8\u9636\u8bfe\u7a0b**\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u753b\u4e0d\u5207\u5b9e\u9645\u7684\u5927\u997c**\uff08\u5982\u201c\u5b66\u5b8c\u7acb\u523b\u6708\u5165\u8fc7\u4e07\u201d\uff09\u30022. **\u5ffd\u89c6\u5176\u201c\u4ece\u7b80\u5355\u505a\u8d77\u201d\u7684\u8bc9\u6c42**\uff0c\u5f3a\u884c\u63a8\u9ad8\u96be\u5ea6\u7684\u89d2\u8272\u97f3\u5355\u30023. **\u7528\u201c\u4f5b\u7cfb\u201d\u3001\u201c\u968f\u7f18\u201d\u7b49\u8bdd\u8bed\u6d88\u89e3\u5176\u76ee\u6807\u611f**\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u524d\u671f\u4e25\u7981\u5927\u989d\u63a8\u4ecb**\u3002\u53ef\u8003\u8651\u5728\u7528\u6237\u6210\u529f\u63a5\u5230\u7b2c\u4e00\u5355\u5e76\u5efa\u7acb\u4fe1\u4efb\u540e\uff0c\u6839\u636e\u5176\u5b9e\u9645\u53d1\u5c55\u9700\u6c42\uff0c\u63a8\u8350**500\u5143\u4ee5\u5185**\u7684\u5fae\u5347\u5355\uff08\u5982\u7279\u5b9a\u58f0\u7ebf\u7cbe\u4fee\u8bfe\uff09\u3002\u8bbe\u5907\u63a8\u8350\u9700\u4e25\u683c\u9075\u5faa\u201c\u4e30\u4fed\u7531\u4eba\u3001\u6309\u9700\u5347\u7ea7\u201d\u539f\u5219\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u4ee5\u540e\u5e0c\u671b\u5148\u4ece\u5e55\u540e\u505a\u8d77\uff0c\u753b\u672c\uff0c\u5ba1\u542c\uff0c\u5bf9\u8f68\u90fd\u53ef\u4ee5\uff0c\u7136\u540e\u65f6\u85aa\u4e66\u548c\u5546\u914d\u90fd\u53ef\u4ee5\u5c1d\u8bd5\u4e00\u4e0b[\u65fa\u67f4]\u201d **\u2014\u2014 \u6e05\u6670\u7684\u3001\u5206\u9636\u6bb5\u7684\u52a1\u5b9e\u53d8\u73b0\u89c4\u5212\u3002**\n2. > \u201c\u60a8\u8bf4\u7684\u5f00\u8bfe8\u5929\u540e\u5c31\u80fd\u63a5\u5355\u4e86\uff0c\u90a3\u5230\u65f6\u5019\u662f\u4e0d\u5c31\u5f97\u4e70\u8bbe\u5907\u554a\uff0c\u6709\u7528\u624b\u673a\u80fd\u63a5\u7684\u5355\u561b[\u53d1\u5446]\u201d **\u2014\u2014 \u5bf9\u6295\u5165\u6210\u672c\u548c\u8def\u5f84\u53ef\u884c\u6027\u7684\u9ad8\u5ea6\u5173\u6ce8\u3002**\n3. > \u201c\u5176\u5b9e\u90fd\u60f3\u8bd5\u8bd5\uff0c\u4f46\u662f\u65f6\u95f4\u6709\u9650\uff0c\u5148\u4ece\u7b80\u5355\u7684\u505a\u8d77\u5427\uff0c\u54c8\u54c8\u54c8\u201d **\u2014\u2014 \u81ea\u6211\u8ba4\u77e5\u6e05\u6670\uff0c\u76ee\u6807\u660e\u786e\uff0c\u884c\u52a8\u529b\u5bfc\u5411\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u9700\u6c42\u2014\u2014\u5bfb\u6c42\u4e00\u4efd\u786e\u5b9a\u3001\u4f4e\u98ce\u9669\u7684\u517c\u804c\u589e\u6536\u8def\u5f84\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u4e25\u683c\u7ba1\u7406\u5176\u6536\u76ca\u9884\u671f\uff0c\u63d0\u4f9b\u6e05\u6670\u3001\u4f4e\u95e8\u69db\u7684\u201c\u57ab\u811a\u77f3\u201d\u5f0f\u63a5\u5355\u8def\u5f84\uff0c\u5e76\u786e\u4fdd\u524d\u671f\u627f\u8bfa\u7684\u201c\u65b0\u624b\u5355\u201d\u8d44\u6e90\u771f\u5b9e\u53ef\u89e6\u8fbe\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
