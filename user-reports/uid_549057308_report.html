        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 549057308 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-28 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u8bed\u6c50nana(\u5218\u4f1f\u5a1c)\u3001\u9152\u4e66\u68a6\u58f0(\u674e\u661f\u5b87)\u3001\u58a8\u7fbd\u4e39\u54e5(\u5218\u4e39)\u3001\u5f7c\u5cb8\u70df\u82b1\u706b(\u81e7\u52c7) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u77ed\u5267\u521b\u4f5c\u8425\uff08\u5df2\u7ed3\u8425\uff09\uff0c\u610f\u5411\u62a5\u540dL3\u8fdb\u9636\u8bfe\u7a0b |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u8bb0\u5f55\u4e2d\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u65e0\u6cd5\u5224\u65ad\u8d44\u91d1\u538b\u529b\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u8bb0\u5f55\u4e2d\u672a\u63d0\u53ca\u5de5\u4f5c/\u751f\u6d3b\u72b6\u6001\uff0c\u65e0\u6cd5\u5224\u65ad\u65f6\u95f4\u5145\u88d5\u5ea6\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u8bb0\u5f55\u4e2d\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u6709\u5b66\u4e60\u884c\u4e3a\u3001\u4e92\u52a8\u548c\u660e\u786e\u5347\u5355\u610f\u5411\uff0c\u4f46\u7f3a\u4e4f\u4e2a\u4eba\u80cc\u666f\u3001\u7ecf\u6d4e\u72b6\u51b5\u3001\u5bb6\u5ead\u652f\u6301\u7b49\u5173\u952e\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **[\u2b06\u9ad8]**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u6210\u957f\u4e0e\u6280\u80fd\u7cbe\u8fdb\u800c\u6765\uff0c\u5173\u6ce8\u6280\u672f\u7ec6\u8282\u4e0e\u5b9e\u64cd\u5e94\u7528\uff0c\u5b66\u4e60\u884c\u4e3a\u79ef\u6781\uff0c\u6709\u660e\u786e\u7684\u6210\u679c\u8f93\u51fa\u548c\u53d8\u73b0\u5c1d\u8bd5\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u5e08\u59d0\u5206\u4eab\u7684\u90fd\u662f\u5e72\u8d27\uff0c\u8fd9\u6b21\u628a\u6574\u4e2aAI\u5199\u6f2b\u5267\u7684\u6d41\u7a0b\u90fd\u8d70\u4e86\u4e00\u904d\uff0c\u611f\u89c9\u6bd4\u4e0a\u6b21\u66f4\u52a0\u719f\u7ec3\uff0c\u4e5f\u66f4\u52a0\u81ea\u4fe1\u3002\u5206\u4eab\u7684\u5185\u5bb9\u5b9e\u7528\u6027\u5f88\u5f3a\uff0c\u5bf9\u6211\u975e\u5e38\u6709\u7528\u3002\u201d\n  > \u201c\u5927\u5927\uff0c\u6211\u63a5\u7684\u5546\u5355\uff0c\u505a\u4e86\uff0c\u5e2e\u6211\u770b\u770b\u63d0\u63d0\u610f\u89c1\u201d\n  > \u201c\u73ed\u73ed\uff0c\u7ed9\u6211L3\u62a5\u8bfe\u7684\u4f18\u60e0\u5377\uff0c\u6211\u8981\u62a5\u540d\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **[\u27a1\u4e2d]**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u4e3b\u52a8\u8981\u6c42L3\u8bfe\u7a0b\u4f18\u60e0\u5238\uff0c\u8868\u660e\u6709\u4ed8\u8d39\u610f\u613f\u4f46\u5173\u6ce8\u6210\u672c\uff0c\u672a\u63d0\u53ca\u501f\u8d37\u6216\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\uff08\u201c\u90fd\u6309\u65f6\u4ea4\u4e86\u7684\u201d\uff09\u3001\u53c2\u4e0e\u76f4\u64ad\u3001\u4e3b\u52a8\u63d0\u95ee\uff0c\u8868\u660e\u6709\u7a33\u5b9a\u7684\u5b66\u4e60\u6295\u5165\u65f6\u95f4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u672a\u77e5** \u2014 \u8bb0\u5f55\u4e2d\u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **[\u2b06\u9ad8]**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u5982\u526a\u6620\u5361\u70b9\u529f\u80fd\uff09\u80fd\u4e3b\u52a8\u63d0\u95ee\u5e76\u5feb\u901f\u89e3\u51b3\uff0c\u5b66\u4e60\u8fc7\u7a0b\u79ef\u6781\u6b63\u5411\uff0c\u65e0\u4efb\u4f55\u8d1f\u9762\u60c5\u7eea\u6216\u4f9d\u8d56\u73ed\u4e3b\u4efb\u5b89\u629a\u7684\u8ff9\u8c61\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u70b9\u4e86\uff0c\u4ed6\u53ea\u662f\u6dfb\u52a0\u6807\u8bb0...\u597d...\u6709\u4e86\uff0c\u8c22\u8c22\u201d\uff08\u5feb\u901f\u89e3\u51b3\u95ee\u9898\uff09\n  > \u201c\u611f\u8c22\u73ed\u73ed\u548c\u5e08\u59d0\uff0c\u5e26\u7740\u6211\u4eec\u52aa\u529b\u524d\u884c\uff01\u201d\uff08\u79ef\u6781\u611f\u6069\uff09\n  > \u201c\u4e00\u76f4\u5728\u52a0\u6cb9\u575a\u6301\u5e72\uff01\u201d\uff08\u6301\u7eed\u884c\u52a8\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9**\u4e13\u4e1a\u80fd\u529b\u7cbe\u8fdb\u548c\u521b\u4f5c\u4ef7\u503c\u5b9e\u73b0**\u7684\u6e34\u671b\u3002\u4ed6\u4e0d\u4ec5\u5b66\u4e60\uff0c\u8fd8\u4e3b\u52a8\u63a5\u5546\u5355\u5b9e\u8df5\uff0c\u5e76\u5bfb\u6c42\u53cd\u9988\uff0c\u8ffd\u6c42\u4ece\u201c\u4f1a\u201d\u5230\u201c\u7cbe\u201d\u7684\u7a81\u7834\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u8ba4\u53ef\u4e0e\u66f4\u9ad8\u9636\u7684\u6210\u957f\u8def\u5f84\u6307\u5f15**\u3002\u4ed6\u9700\u8981\u88ab\u5f53\u4f5c\u4e00\u4e2a\u6709\u6f5c\u529b\u7684\u201c\u51c6\u4e13\u4e1a\u4eba\u58eb\u201d\u5bf9\u5f85\uff0c\u63d0\u4f9b\u6df1\u5ea6\u6280\u672f\u6307\u5bfc\u548c\u66f4\u5e7f\u9614\u7684\u5546\u4e1a\u673a\u4f1a\u5bf9\u63a5\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe2 B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u5411 **\u6df7\u5408\u4f533\u53f7\uff1a\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b** \u8fdb\u5316\u4e2d) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u96f6\u4e92\u52a8\u7b49\u5371\u9669\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u8868\u73b0\u72ec\u7acb\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u5b66\u4e60\u884c\u4e3a\u7a33\u5b9a\uff0c\u6309\u65f6\u4ea4\u4f5c\u4e1a\uff0c\u8ddf\u8fdb\u80fd\u529b\u5f3a\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u65e0\u60c5\u7eea\u5d29\u6e83\u8ff9\u8c61\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u82e5\u540e\u7eedL3\u8bfe\u7a0b\u65e0\u6cd5\u6ee1\u8db3\u5176\u6df1\u5ea6\u7cbe\u8fdb\u9700\u6c42\uff0c\u6216\u63a5\u5355\u53d8\u73b0\u8def\u5f84\u4e0d\u6e05\u6670\uff0c\u53ef\u80fd\u4ea7\u751f\u4ef7\u503c\u6000\u7591\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e1-2\u4e2a\u6708**\u3002\u82e5\u8fdb\u9636\u8bfe\u7a0b\u5185\u5bb9\u6df1\u5ea6\u4e0d\u8db3\u3001\u7f3a\u4e4f\u6709\u6548\u5b9e\u6218\u6307\u5bfc\u6216\u63a5\u5355\u673a\u4f1a\uff0c\u5176\u81ea\u6211\u5b9e\u73b0\u7684\u671f\u671b\u53ef\u80fd\u843d\u7a7a\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u770b\u5230\u4f60\u5728\u4e0a\u4e00\u671f\u8bfe\u7a0b\u91cc\u4e0d\u4ec5\u5b66\u5f97\u624e\u5b9e\uff0c\u8fd8\u4e3b\u52a8\u63a5\u5546\u5355\u5b9e\u8df5\uff0c\u8fd9\u4efd\u884c\u52a8\u529b\u592a\u68d2\u4e86\uff01L3\u8bfe\u7a0b\u5c31\u662f\u4e3a\u4f60\u8fd9\u6837\u5df2\u7ecf\u2018\u4e0a\u9053\u2019\u3001\u60f3\u5f80\u2018\u4e13\u4e1a\u7ea7\u2019\u7a81\u7834\u7684\u540c\u5b66\u51c6\u5907\u7684\u3002\u6211\u4eec\u4f1a\u805a\u7126\u66f4\u6df1\u7684\u5267\u672c\u62c6\u89e3\u548c\u5546\u4e1a\u53d8\u73b0\u8def\u5f84\uff0c\u671f\u5f85\u4f60\u6210\u4e3a\u73ed\u91cc\u7684\u6280\u672f\u6807\u6746\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176\u9ad8\u52a8\u673a\u548c\u8ffd\u6c42\u81ea\u6211\u5b9e\u73b0\u7684\u9700\u6c42\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T2\u5411\u6df7\u5408\u4f533\u53f7\u8fdb\u5316\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010D\u6a21\u5757\uff1a\u8eab\u4efd\u4e0e\u6743\u529b\u5149\u73af\u6c60\u3011**\u3002\u5728\u5176\u6280\u80fd\u8fbe\u6807\u540e\uff0c\u8fc5\u901f\u8d4b\u4e88\u201c\u5c0f\u7ec4\u957f\u201d\u3001\u201c\u4f5c\u4e1a\u8bc4\u5ba1\u5b98\u201d\u6216\u201c\u65b0\u4eba\u8f85\u5bfc\u5458\u201d\u7b49\u89d2\u8272\uff0c\u5229\u7528\u5176\u82e6\u5e72\u5e95\u76d8\u56fa\u5316\u4e3a\u751f\u6001\u5efa\u8bbe\u8005\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u5c0f\u767d\u201d\u3001\u201c\u840c\u65b0\u201d\u7b49\u77ee\u5316\u8bcd\u6c47\u79f0\u547c\u4ed6\uff1b\u7528\u60c5\u611f\u9e21\u6c64\u4ee3\u66ff\u4e13\u4e1a\u6307\u5bfc\uff1b\u5ffd\u89c6\u5176\u4e3b\u52a8\u63d0\u51fa\u7684\u6280\u672f\u95ee\u9898\u6216\u5546\u4e1a\u5b9e\u8df5\u9700\u6c42\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5176\u5df2\u4e3b\u52a8\u8981\u6c42\u5347\u5355L3\uff0c\u662f\u5178\u578b\u7684\u9ad8\u590d\u8d2d\u6f5c\u529b\u7528\u6237\uff0c\u5e94\u63d0\u4f9b\u6e05\u6670\u7684\u8fdb\u9636\u8def\u5f84\u548c\u9ad8\u4ef7\u503c\u8bfe\u7a0b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5e08\u59d0\u5206\u4eab\u7684\u90fd\u662f\u5e72\u8d27\uff0c\u8fd9\u6b21\u628a\u6574\u4e2aAI\u5199\u6f2b\u5267\u7684\u6d41\u7a0b\u90fd\u8d70\u4e86\u4e00\u904d\uff0c\u611f\u89c9\u6bd4\u4e0a\u6b21\u66f4\u52a0\u719f\u7ec3\uff0c\u4e5f\u66f4\u52a0\u81ea\u4fe1\u3002\u5206\u4eab\u7684\u5185\u5bb9\u5b9e\u7528\u6027\u5f88\u5f3a\uff0c\u5bf9\u6211\u975e\u5e38\u6709\u7528\u3002\u201d **\uff08\u9ad8\u52a8\u673a\u7eaf\u5ea6\uff0c\u8ffd\u6c42\u7cbe\u8fdb\uff09**\n2. > \u201c\u5927\u5927\uff0c\u6211\u63a5\u7684\u5546\u5355\uff0c\u505a\u4e86\uff0c\u5e2e\u6211\u770b\u770b\u63d0\u63d0\u610f\u89c1\u201d **\uff08\u884c\u52a8\u529b\u5f3a\uff0c\u5df2\u8fdb\u5165\u5b9e\u8df5\u548c\u5bfb\u6c42\u4e13\u4e1a\u53cd\u9988\u9636\u6bb5\uff09**\n3. > \u201c\u73ed\u73ed\uff0c\u7ed9\u6211L3\u62a5\u8bfe\u7684\u4f18\u60e0\u5377\uff0c\u6211\u8981\u62a5\u540d\u201d **\uff08\u660e\u786e\u5347\u5355\u610f\u5411\uff0c\u9ad8\u590d\u8d2d\u6f5c\u529b\uff0c\u5173\u6ce8\u6210\u672c\u4f46\u610f\u613f\u575a\u5b9a\uff09**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\uff08\u5411\u6df7\u5408\u4f533\u53f7\u8fdb\u5316\uff09\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u81ea\u6211\u5b9e\u73b0\u4e0e\u4e13\u4e1a\u7cbe\u8fdb\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6df1\u5ea6B\u6a21\u5757\uff08\u786c\u6838\u624b\u827a\uff09\u652f\u6301\uff0c\u5e76\u9002\u65f6\u8d4b\u4e88D\u6a21\u5757\uff08\u8eab\u4efd\u6743\u529b\uff09\u8fdb\u884c\u201c\u9ec4\u888d\u52a0\u8eab\u201d\u63d0\u5e72\uff0c\u5c06\u5176\u8f6c\u5316\u4e3a\u73ed\u7ea7\u751f\u6001\u7684\u5171\u5efa\u8005\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b (\u5411\u6df7\u5408\u4f533\u53f7\u8fdb\u5316)\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + D\u6a21\u5757(\u8eab\u4efd\u8d4b\u6743)\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
