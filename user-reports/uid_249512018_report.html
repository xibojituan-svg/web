    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n- **\u52a8\u673a\u7eaf\u5ea6**\uff1a\u4e2d\u7b49\u504f\u5b9e\u7528\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u526f\u4e1a\u589e\u6536\u9700\u6c42\uff08\u201c\u4e00\u5929\u561b\u4e0d\u8981\u591a\uff0c\u6709\u4e2a200~300\u5c31\u884c\u4e86\u201d\uff09\uff0c\u5bf9\u201c\u5b66\u95e8\u6280\u672f\u201d\u6709\u8ba4\u53ef\uff0c\u4f46**\u5bf9\u201c\u98ce\u53e3\u201d\u3001\u201c\u884c\u4e1a\u524d\u666f\u201d\u7b49\u5b8f\u5927\u53d9\u4e8b\u53cd\u5e94\u5e73\u6de1**\u3002\u6838\u5fc3\u9a71\u52a8\u529b\u662f**\u5b89\u5168\u9700\u6c42\u4e0b\u7684\u8865\u5145\u6536\u5165**\uff0c\u975e\u81ea\u6211\u5b9e\u73b0\u6216\u5174\u8da3\u63a2\u7d22\u3002\n- **\u8d44\u6e90\u5e95\u5ea7**\uff1a\u8f83\u4f4e\u3002\u7528\u6237\u81ea\u8ff0\u201c\u53ea\u6709\u624b\u673a\uff0c\u7535\u8111\u4e0d\u4f1a\u7528\uff0c\u5e73\u677f\u4e5f\u6ca1\u4e70\u8fc7\u201d\uff0c\u4e14\u201c\u767d\u5929\u6ca1\u65f6\u95f4\u201d\uff0c\u4ec5\u665a\u4e0a9-12\u70b9\u6709\u7a7a\u3002**\u8bbe\u5907\u4e0e\u65f6\u95f4\u8d44\u6e90\u53cc\u91cd\u53d7\u9650**\uff0c\u5b66\u4e60\u57fa\u7840\u53ef\u80fd\u8584\u5f31\uff08\u201c\u5e74\u7eaa\u4e5f\u5927\u4e86\u201d\uff09\u3002\n- **\u5fc3\u7406\u5f39\u6027**\uff1a\u4f4e\u3002**\u6709\u663e\u8457\u88ab\u9a97\u521b\u4f24**\uff08\u201c\u5728\u6296\u97f3\u4e0a\u88ab\u9a97\u4e86\u5dee\u4e0d\u591a\u4e2430000\u201d\uff09\uff0c\u5bf9\u9000\u8d39\u653f\u7b56\u6781\u5ea6\u654f\u611f\uff0c\u53cd\u590d\u786e\u8ba4\u3002\u8868\u73b0\u51fa**\u4f9d\u8d56\u578b\u51b3\u7b56**\uff08\u201c\u51b2\u4f60\u8fd9\u8bf4\u7684\u8bdd\u2026\u6211\u5c31\u89c9\u5f97\u600e\u4e48\u62a5\u90fd\u884c\u201d\uff09\uff0c\u6613\u53d7\u9500\u552e\u4e2a\u4eba\u627f\u8bfa\u5f71\u54cd\uff0c\u4f46\u5b66\u4e60\u884c\u52a8\u529b\u5f31\uff08\u591a\u6b21\u672a\u6309\u65f6\u542c\u8bfe\u3001\u4ea4\u4f5c\u4e1a\uff09\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n- **\u6b65\u9aa40\uff08\u652f\u4ed8\u6838\u67e5\uff09**\uff1a\u5df2\u652f\u4ed83980\u5143\uff0c\u652f\u4ed8\u5b8c\u6210\u3002\n- **\u6b65\u9aa41.5\uff08\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5\uff09**\uff1a\u7528\u6237\u63d0\u53ca\u201c\u7b49\u4e00\u4e0b\u518d\u8ddf\u6211\u5bb6\u4eba\u8bf4\uff0c\u628a\u8fd9\u4e2a\u53d1\u7ed9\u4ed6\u770b\u4e00\u4e0b\uff0c\u8ba9\u4ed6\u7ed9\u201d\uff0c\u8868\u660e**\u5b58\u5728\u5bb6\u5ead\u5171\u540c\u51b3\u7b56\u6216\u8d44\u91d1\u5ba1\u6279\u73af\u8282**\uff0c\u975e\u5b8c\u5168\u81ea\u4e3b\u652f\u4ed8\u3002\n- **\u6b65\u9aa4A\uff08\u9700\u6c42-\u65b9\u6848\u5339\u914d\u5ea6\uff09**\uff1a\u4e2d\u4f4e\u3002\u7528\u6237\u9700\u6c42\uff08\u7a33\u5b9a\u526f\u4e1a\u6708\u51653-6k\uff09\u4e0e\u8bfe\u7a0b\u627f\u8bfa\uff08\u5feb\u901f\u63a5\u5355\u3001\u9ad8\u6536\u76ca\uff09\u8868\u9762\u5339\u914d\uff0c\u4f46**\u7528\u6237\u8d44\u6e90\u6761\u4ef6\uff08\u4ec5\u624b\u673a\u3001\u591c\u95f4\u6709\u9650\u65f6\u95f4\uff09\u4e0e\u9ad8\u4ea7\u51fa\u8981\u6c42\u5b58\u5728\u6f5c\u5728\u51b2\u7a81**\u3002\n- **\u6b65\u9aa4B\uff08\u652f\u4ed8\u80fd\u529b\u4e0e\u610f\u613f\uff09**\uff1a\u652f\u4ed8\u610f\u613f\u53d7\u9500\u552e\u4e2a\u4eba\u4fe1\u4efb\u9a71\u52a8\u5f3a\u70c8\uff08\u201c\u4fe1\u4efb\u624d\u4f1a\u8fdb\u6765\u201d\uff09\uff0c\u4f46\u652f\u4ed8\u80fd\u529b/\u51b3\u7b56\u53d7\u5bb6\u5ead\u5f71\u54cd\uff0c**\u5b58\u5728\u540e\u7eed\u5bb6\u5ead\u8d28\u7591\u98ce\u9669**\u3002\n- **\u6b65\u9aa4C\uff08\u5b66\u4e60\u9002\u5e94\u6027\uff09**\uff1a\u4f4e\u3002\u5b66\u4e60\u884c\u52a8\u6ede\u540e\uff08\u8865\u770b\u56de\u653e\u3001\u4f5c\u4e1a\u672a\u4ea4\uff09\uff0c\u5df2\u663e\u9732\u754f\u96be\u60c5\u7eea\uff08\u201c\u6015\u2026\u803d\u8bef\u4f60\u4eec\u8981\u7ecf\u5e38\u53eb\u4f60\u4eec\u966a\u8dd1\u201d\uff09\uff0c**\u8bbe\u5907\u4e0e\u65f6\u95f4\u9650\u5236\u5c06\u4e25\u91cd\u5236\u7ea6\u540e\u7eed\u5b9e\u64cd**\u3002\n- **\u6b65\u9aa4D\uff08\u6210\u679c\u9884\u671f\u7ba1\u7406\uff09**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u9884\u671f\u52a1\u5b9e\uff08\u65e5\u5165200-300\uff09\uff0c\u4f46\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa\u201c\u7b2c\u516b\u5929\u5f00\u901a\u6240\u6709\u8d44\u6e90\u6e20\u9053\u201d\u3001\u201c\u8fb9\u5b66\u4e60\u8fb9\u63a5\u5355\u201d\uff0c\u6781\u6613\u5f15\u53d1**\u9884\u671f\u843d\u5dee**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n**T7 \u8c28\u614e\u8ddf\u4ece\u578b**\u3002\n- **\u6838\u5fc3\u7279\u5f81**\uff1a\u51b3\u7b56\u4f9d\u8d56\u6743\u5a01/\u4e2a\u4eba\u4fe1\u4efb\uff08\u201c\u51b2\u4f60\u8fd9\u8bf4\u7684\u8bdd\u201d\uff09\uff0c\u6709\u53d7\u9a97\u53f2\u5bfc\u81f4\u8b66\u60d5\u6027\u9ad8\uff0c\u9700\u6c42\u52a1\u5b9e\uff08\u6c42\u7a33\u3001\u6c42\u4fdd\u969c\uff09\uff0c\u8d44\u6e90\u6709\u9650\uff0c\u884c\u52a8\u529b\u504f\u88ab\u52a8\u3002\n- **\u8865\u5145\u8bf4\u660e**\uff1a\u517c\u5177\u90e8\u5206T8\uff08\u8d44\u6e90\u532e\u4e4f\u578b\uff09\u7279\u5f81\uff08\u8bbe\u5907\u3001\u65f6\u95f4\u532e\u4e4f\uff09\uff0c\u4f46**\u6838\u5fc3\u9a71\u52a8\u662f\u5b89\u5168\u9700\u6c42\u4e0b\u7684\u4fe1\u4efb\u8ddf\u968f**\uff0c\u800c\u975e\u5355\u7eaf\u8d44\u6e90\u95ee\u9898\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\uff08\u98ce\u9669\u7b49\u7ea7\uff1a\u9ad8\uff09\n- **\u6839\u56e01\uff08\u9884\u671f\u843d\u5dee\uff09**\uff1a**\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u627f\u8bfa\u201c\u7b2c\u516b\u5929\u5f00\u901a\u8d44\u6e90\u6e20\u9053\u201d\u3001\u201c\u8fb9\u5b66\u8fb9\u8d5a\u201d\uff0c\u4e0e\u7528\u6237\u8bbe\u5907\u3001\u65f6\u95f4\u9650\u5236\u53ef\u80fd\u4ea7\u751f\u7684\u5b66\u4e60\u8fdb\u5ea6\u6162\u3001\u63a5\u5355\u56f0\u96be\u5b58\u5728\u5de8\u5927\u843d\u5dee\u3002\n- **\u6839\u56e02\uff08\u5b66\u4e60\u6548\u679c\u5dee\uff09**\uff1a**\u9ad8\u98ce\u9669**\u3002\u4ec5\u4f7f\u7528\u624b\u673a\u3001\u591c\u95f4\u5b66\u4e60\u3001\u57fa\u7840\u53ef\u80fd\u8584\u5f31\uff0c\u5b9e\u64cd\u7c7b\u8bfe\u7a0b\u5b8c\u8bfe\u7387\u4e0e\u6280\u80fd\u638c\u63e1\u5ea6\u582a\u5fe7\u3002\n- **\u6839\u56e03\uff08\u7ecf\u6d4e\u538b\u529b\uff09**\uff1a\u4e2d\u98ce\u9669\u3002\u7528\u6237\u6709\u4e3b\u4e1a\u5de5\u8d44\u5c1a\u53ef\uff0c\u4f463980\u5143\u652f\u51fa\u4ecd\u9700\u4e0e\u5bb6\u4eba\u6c9f\u901a\uff0c**\u5b58\u5728\u5bb6\u5ead\u8d22\u52a1\u5f02\u8bae\u53ef\u80fd**\u3002\n- **\u6839\u56e04\uff08\u793e\u4ea4\u5b64\u7acb\uff09**\uff1a\u4f4e\u98ce\u9669\u3002\u9500\u552e\u5df2\u5efa\u7acb\u8f83\u5f3a\u4e2a\u4eba\u4fe1\u4efb\uff0c\u627f\u8bfa\u201c\u62c9\u8fdb\u5de5\u4f5c\u5ba4\u201d\uff0c\u77ed\u671f\u793e\u4ea4\u98ce\u9669\u4f4e\u3002\n- **\u6839\u56e05\uff08\u8bfe\u7a0b\u8d28\u91cf\uff09**\uff1a\u4e2d\u98ce\u9669\u3002\u82e5\u540e\u7eed\u8bfe\u7a0b\u4ea4\u4ed8\uff08\u5e08\u8d44\u3001\u8f85\u5bfc\uff09\u4e0e\u9500\u552e\u627f\u8bfa\u7684\u201c\u4e09\u4f4d\u8001\u5e08\u201d\u3001\u201c\u5de5\u4f5c\u5ba4\u8d44\u6e90\u201d\u4e0d\u7b26\uff0c\u6613\u5f15\u53d1\u6295\u8bc9\u3002\n- **\u6839\u56e06\uff08\u9500\u552e\u8bef\u5bfc\uff09**\uff1a**\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u5f53\u5929\u7533\u8bf7\u5f53\u5929\u9000\u201d\u3001\u201c\u625312315\u201d\uff0c**\u8fc7\u5ea6\u627f\u8bfa\u9000\u8d39\u4fbf\u6377\u6027**\uff0c\u53ef\u80fd\u57cb\u4e0b\u7ea0\u7eb7\u9690\u60a3\u3002\n- **\u6839\u56e07\uff08\u5bb6\u5ead\u53cd\u5bf9\uff09**\uff1a**\u4e2d\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5df2\u63d0\u53ca\u9700\u4e0e\u5bb6\u4eba\u6c9f\u901a\uff0c**\u5bb6\u5ead\u51b3\u7b56\u73af\u8282\u662f\u6f5c\u5728\u9000\u8d39\u89e6\u53d1\u70b9**\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n- **\u2705 \u5408\u89c4\u70b9**\uff1a\u9500\u552e\u660e\u786e\u4e86\u9000\u8d39\u653f\u7b56\uff08\u672a\u5b66\u5168\u989d\u9000\uff0c\u5df2\u5b66\u90e8\u5206\u9000\u672a\u5b66\u90e8\u5206\uff09\u3002\n- **\u26a0\ufe0f \u98ce\u9669\u70b9**\uff1a\n    1. **\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u6346\u7ed1\u9500\u552e**\uff1a\u5c06\u8bfe\u7a0b\u62a5\u540d\u4e0e\u201c\u52a0\u5165\u5de5\u4f5c\u5ba4\u201d\u3001\u201c\u8d44\u6e90\u5bf9\u63a5\u201d\u5f3a\u7ed1\u5b9a\uff0c\u6697\u793a\u62a5\u540d\u5373\u53ef\u83b7\u5f97\u5185\u90e8\u5de5\u4f5c\u673a\u4f1a\uff0c\u53ef\u80fd\u6784\u6210**\u865a\u5047\u6216\u8bef\u5bfc\u6027\u5ba3\u4f20**\u3002\n    2. **\u5229\u7528\u4fe1\u4efb\u4e0e\u521b\u4f24**\uff1a\u9488\u5bf9\u7528\u6237\u53d7\u9a97\u7ecf\u5386\uff0c\u8fc7\u5ea6\u5f3a\u8c03\u4e2a\u4eba\u4fe1\u8a89\uff08\u201c\u5de5\u4f5c\u5ba4\u91cc\u4e00\u95f9\uff0c\u6211\u53e3\u7891\u2026\u8981\u4e0d\u8981\u4e86\u201d\uff09\u548c\u5e73\u53f0\u80cc\u66f8\uff0c**\u53ef\u80fd\u5229\u7528\u7528\u6237\u8106\u5f31\u5fc3\u7406\u4fc3\u6210\u4ea4\u6613**\u3002\n    3. **\u9000\u8d39\u627f\u8bfa\u8fc7\u4e8e\u7edd\u5bf9**\uff1a\u201c\u5f53\u5929\u7533\u8bf7\u5f53\u5929\u9000\u201d\u5728\u5b9e\u9645\u8fd0\u8425\u4e2d\u96be\u4ee5\u4fdd\u8bc1\uff0c**\u5b58\u5728\u627f\u8bfa\u65e0\u6cd5\u5151\u73b0\u7684\u98ce\u9669**\u3002\n    4. **\u672a\u5145\u5206\u8bc4\u4f30\u7528\u6237\u6761\u4ef6**\uff1a\u5df2\u77e5\u7528\u6237\u4ec5\u624b\u673a\u3001\u591c\u95f4\u5b66\u4e60\uff0c\u4ecd\u5f15\u5bfc\u5176\u62a5\u540d\u5bf9\u8bbe\u5907\u3001\u65f6\u95f4\u6709\u4e00\u5b9a\u8981\u6c42\u7684\u5b9e\u64cd\u8bfe\u7a0b\uff0c**\u672a\u5c65\u884c\u9002\u5f53\u6027\u63a8\u8350\u4e49\u52a1**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n- **\u6838\u5fc3\u7b56\u7565**\uff1a**\u5f3a\u5316\u4fe1\u4efb\u7ef4\u62a4\uff0c\u6781\u81f4\u964d\u4f4e\u9884\u671f\uff0c\u63d0\u4f9b\u8d85\u9884\u671f\u652f\u6301**\u3002\n- **\u5177\u4f53\u884c\u52a8**\uff1a\n    1. **\u7834\u51b0\u4e0e\u4fe1\u4efb\u52a0\u56fa**\uff1a\u73ed\u4e3b\u4efb\u9996\u8054\u7cfb\u987b\u63d0\u53ca\u201c\u5e84\u5468\u5e08\u5144\u7279\u522b\u5173\u7167\u201d\uff0c\u5ef6\u7eed\u4fe1\u4efb\u94fe\u6761\u3002\u660e\u786e\u81ea\u8eab\u4e0e\u201c\u5e08\u5144\u201d\u7684\u534f\u4f5c\u5173\u7cfb\u3002\n    2. **\u9884\u671f\u7ba1\u7406\u524d\u7f6e**\uff1a\u9996\u6b21\u6c9f\u901a\u5373\u6e29\u548c\u8bf4\u660e\uff1a\u2460 \u5b66\u4e60\u6548\u679c\u4e0e\u6295\u5165\u65f6\u95f4\u3001\u7ec3\u4e60\u5ea6\u6b63\u76f8\u5173\uff1b\u2461 \u521d\u671f\u63a5\u5355\u591a\u4e3a\u5c0f\u989d\u3001\u7ec3\u624b\uff0c\u9010\u6b65\u63d0\u5347\uff1b\u2462 \u624b\u673a\u53ef\u64cd\u4f5c\uff0c\u4f46\u90e8\u5206\u590d\u6742\u529f\u80fd\u6548\u7387\u53ef\u80fd\u53d7\u5f71\u54cd\u3002**\u52a1\u5fc5\u7559\u4e0b\u6587\u5b57\u8bb0\u5f55**\u3002\n    3. **\u8d85\u9884\u671f\u652f\u6301**\uff1a\n        - **\u8bbe\u5907\u652f\u6301**\uff1a\u8be2\u95ee\u662f\u5426\u9700\u8981\u624b\u673a\u64cd\u4f5c\u4e13\u5c5e\u6307\u5f15\u6216\u7b80\u5316\u6d41\u7a0b\u3002\n        - **\u65f6\u95f4\u9002\u914d**\uff1a\u4e3b\u52a8\u63d0\u4f9b\u76f4\u64ad\u56de\u653e\uff08\u5373\u4f7f\u58f0\u79f0\u65e0\u56de\u653e\uff09\u3001\u5f55\u64ad\u91cd\u70b9\u7247\u6bb5\uff0c\u9002\u5e94\u5176\u591c\u95f4\u5b66\u4e60\u6a21\u5f0f\u3002\n        - **\u5c0f\u6b65\u6b63\u53cd\u9988**\uff1a\u5bf9\u5176\u4efb\u4f55\u4f5c\u4e1a\u63d0\u4ea4\u7ed9\u4e88\u79ef\u6781\u3001\u5177\u4f53\u7684\u70b9\u8bc4\uff0c\u54ea\u6015\u8d28\u91cf\u4e00\u822c\uff0c\u91cd\u70b9\u9f13\u52b1\u201c\u5b8c\u6210\u201d\u884c\u4e3a\u3002\n    4. **\u5bb6\u5ead\u98ce\u9669\u7f13\u51b2**\uff1a\u53ef\u51c6\u5907\u4e00\u4efd\u7b80\u660e\u7684\u8bfe\u7a0b\u4ef7\u503c\u4e0e\u4fdd\u969c\u8bf4\u660e\uff08\u542b\u9000\u8d39\u653f\u7b56\uff09\uff0c\u4f9b\u7528\u6237\u5411\u5bb6\u4eba\u89e3\u91ca\u3002\n    5. **\u98ce\u9669\u76d1\u63a7**\uff1a\u91cd\u70b9\u6807\u8bb0\u3002\u5173\u6ce8\u5176\u524d\u4e24\u5468\u4f5c\u4e1a\u63d0\u4ea4\u60c5\u51b5\u3001\u591c\u95f4\u4e0a\u7ebf\u9891\u7387\u3002\u4e00\u65e6\u51fa\u73b0\u8fde\u7eed\u7f3a\u52e4\u6216\u6d88\u6781\u53cd\u9988\uff0c\u7acb\u5373\u542f\u52a8\u5173\u6000\u4ecb\u5165\uff0c**\u4f18\u5148\u89e3\u51b3\u5176\u5177\u4f53\u56f0\u96be\uff08\u5982\u67d0\u4e2a\u6b65\u9aa4\u4e0d\u4f1a\uff09\uff0c\u800c\u975e\u5355\u7eaf\u50ac\u4fc3**\u3002\n- **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**\uff1a\u8be5\u7528\u6237\u4e0d\u9002\u5408\u63a8\u8350\u66f4\u9ad8\u9636\u6216\u786c\u4ef6\u8981\u6c42\u9ad8\u7684\u8bfe\u7a0b\u3002\u82e5\u540e\u7eed\u6709**\u8f7b\u91cf\u5316\u3001\u788e\u7247\u5316\u3001\u5f3a\u7ed3\u679c\u5bfc\u5411\uff08\u5982\u5feb\u901f\u751f\u6210\u7b80\u5355\u89c6\u9891\u6a21\u677f\uff09\u7684\u77ed\u671f\u8bad\u7ec3\u8425\u6216\u5de5\u5177\u7c7b\u4ea7\u54c1**\uff0c\u53ef\u4f18\u5148\u5339\u914d\uff0c\u7528\u4e8e\u7ef4\u6301\u5176\u5b66\u4e60\u4fe1\u5fc3\u4e0e\u53c2\u4e0e\u611f\u3002\n\n{\"core_type\": \"T7 \u8c28\u614e\u8ddf\u4ece\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u8f7b\u91cf\u5316\u3001\u788e\u7247\u5316\u3001\u5f3a\u7ed3\u679c\u5bfc\u5411\u7684\u77ed\u671f\u5b9e\u64cd\u8bfe\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}";
