    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677154513 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u62db\u52df\u5b98-\u6668\u516e\u5e08\u59d0(\u9a6c\u6dd1\u6770) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u7cfb\u7edf\u8bfe\u7a0b\uff08\u9ad8\u9636\u73ed\uff0c\u4ef7\u683c2380\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u5145\u88d5\uff08\u76f4\u63a5\u652f\u4ed82380\u5143\uff0c\u65e0\u5206\u671f\u3001\u501f\u8d37\u8ff9\u8c61\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1\uff08\u7528\u6237\u80fd\u6309\u65f6\u5b8c\u6210\u6668\u7ec3\u3001\u76f4\u64ad\u8bfe\u3001\u4f5c\u4e1a\uff0c\u4f46\u9700\u201c\u4e00\u4f1a\u65f6\u95f4\u7a7a\u51fa\u6765\u201d\uff0c\u8868\u660e\u65f6\u95f4\u9700\u534f\u8c03\uff0c\u975e\u5168\u5929\u5019\u7a7a\u95f2\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u7f3a\u5931\uff08\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u60c5\u51b5\uff0c**\u9700\u91cd\u70b9\u6838\u67e5**\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e2d\u7b49\uff08\u5b66\u4e60\u4e92\u52a8\u79ef\u6781\uff0c\u4f46\u5173\u952e\u5bb6\u5ead\u80cc\u666f\u3001\u804c\u4e1a\u3001\u8d22\u52a1\u72b6\u51b5\u7f3a\u5931\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e\uff0c\u4f46\u8ba4\u53ef\u5b66\u4e60\u8fc7\u7a0b\u4e0e\u957f\u671f\u53d1\u5c55\uff0c\u77ed\u671f\u9884\u671f\uff08\u51e0\u5929\u8bad\u7ec3\u8425\uff09\u4e0e\u957f\u671f\u89c4\u5212\uff08\u201c\u957f\u671f\u53d1\u5c55\u201d\uff09\u5e76\u5b58\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u611f\u89c9\u53ef\u4ee5\u7ee7\u7eed\u5b66\u4e60\uff0c\u957f\u671f\u53d1\u5c55\uff0c\u4e3b\u8981\u5c31\u662f\u53d8\u73b0\u6323\u94b1\u561b[\u5472\u7259]\u201d > \u201c\u597d\u7684\u3002\u4e00\u5b9a\u52a0\u6cb9\u597d\u597d\u5e72\uff0c\u641e\u94b1\uff01\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 \u80fd\u76f4\u63a5\u652f\u4ed82380\u5143\u8bfe\u7a0b\uff0c\u65e0\u7ecf\u6d4e\u538b\u529b\u8ff9\u8c61\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u6536\u5165\u6c34\u5e73\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 \u80fd\u8ddf\u4e0a\u5bc6\u96c6\u7684\u8bad\u7ec3\u8425\u8282\u594f\uff08\u6668\u7ec3\u3001\u76f4\u64ad\u3001\u4f5c\u4e1a\u3001Pia\u620f\uff09\uff0c\u4f46\u65f6\u95f4\u9700\u201c\u7a7a\u51fa\u6765\u201d\uff0c\u8868\u660e\u975e\u5b8c\u5168\u81ea\u7531\uff0c\u9700\u5e73\u8861\u5176\u4ed6\u4e8b\u52a1\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 **\u5173\u952e\u4fe1\u606f\u7f3a\u5931\uff0c\u98ce\u9669\u672a\u77e5**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u76f8\u5173\u8bdd\u9898\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9762\u5bf9\u9500\u552e\u7684\u5177\u4f53\u6307\u5bfc\uff08\u5982\u5bf9\u8c61\u611f\u3001\u89d2\u8272\u97f3\u6280\u5de7\uff09\u80fd\u79ef\u6781\u63a5\u53d7\u5e76\u5c1d\u8bd5\uff08\u201c\u597d\u7684\uff0c\u8c22\u8c22\u5e08\u59d0\u6559\u6211\u5c0f\u6280\u5de7\uff0c\u7b49\u56de\u53bb\u81ea\u5df1\u518d\u8bd5\u8bd5\u201d\uff09\uff0c\u53c2\u4e0ePia\u620f\u4e92\u52a8\u79ef\u6781\uff0c\u672a\u8868\u73b0\u51fa\u4efb\u4f55\u754f\u96be\u3001\u62b1\u6028\u6216\u4f9d\u8d56\u60c5\u7eea\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5e08\u5144\u4e5f\u5f88\u5389\u5bb3\uff0c\u597d\u591a\u597d\u591a\u79cd\u58f0\u7ebf\u201d (\u8868\u73b0\u51fa\u6b23\u8d4f\u4e0e\u5b66\u4e60\u5fc3\u6001) > \u201c\u597d\u7684\u5462\uff0c\u5e08\u5144\u90a3\u8fb9\u521a\u521a\u7ed3\u675f\u4e86\uff0c\u5927\u5bb6\u4e00\u8d77\u5b66\u5f88\u6709\u610f\u601d[\u5472\u7259]\u201d (\u8868\u73b0\u51fa\u79ef\u6781\u7684\u793e\u7fa4\u878d\u5165\u611f)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u65b0\u6280\u80fd\uff08\u6709\u58f0\u6f14\u64ad\uff09\u83b7\u5f97\u793e\u4f1a\u8ba4\u53ef\u3001\u4e13\u4e1a\u80af\u5b9a\u53ca\u7a33\u5b9a\u7684\u526f\u4e1a\u6536\u5165\uff0c\u4ece\u800c\u63d0\u5347\u4e2a\u4eba\u4ef7\u503c\u611f\u548c\u81ea\u4fe1\u5fc3\u3002\u9500\u552e\u6301\u7eed\u7684\u201c\u770b\u597d\u4f60\u201d\u3001\u201c\u4f18\u79c0\u5b66\u5458\u201d\u7b49\u6807\u7b7e\u8d77\u5230\u4e86\u5173\u952e\u6fc0\u52b1\u4f5c\u7528\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6301\u7eed\u7684\u3001\u5177\u4f53\u7684\u4e13\u4e1a\u80af\u5b9a\u4e0e\u201c\u88ab\u9009\u4e2d\u201d\u7684\u5f52\u5c5e\u611f**\u3002\u5c06\u4ed6\u6807\u8bb0\u4e3a\u201c\u6709\u6f5c\u529b\u8005\u201d\uff0c\u7ed9\u4e88\u4e13\u5c5e\u8d44\u6e90\uff08\u5982\u9884\u7559\u7248\u6743\u4e66\u540d\u989d\uff09\uff0c\u6ee1\u8db3\u5176\u88ab\u5c0a\u91cd\u548c\u878d\u5165\u4e13\u4e1a\u5708\u5b50\u7684\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 B\u7c7b (\u52a8\u673a\u4e2d\u7b49\u3001\u8d44\u6e90\u4e2d\u7b49\u3001\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u5c5e\u4e8e\u53ef\u57f9\u517b\u7684\u6f5c\u529b\u7528\u6237) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u884c\u52a8\u529b\u5f3a\uff0c\u6309\u65f6\u5b8c\u6210\u6240\u6709\u4efb\u52a1\uff1b\u5173\u6ce8\u5177\u4f53\u6280\u5de7\u201c\u5c0f\u6280\u5de7\u201d\uff1b\u76ee\u6807\u660e\u786e\u4e3a\u201c\u641e\u94b1\u201d\u4f46\u613f\u610f\u6295\u5165\u5b66\u4e60\uff1b\u5bf9\u793e\u7fa4\u6d3b\u52a8\u201cPia\u620f\u201d\u6709\u79ef\u6781\u53cd\u9988\uff0c\u4eab\u53d7\u5171\u540c\u5b66\u4e60\u7684\u6c1b\u56f4\u3002) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5ead\u51b2\u7a81\u8ff9\u8c61\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | **\u3010\u5173\u952e\u672a\u77e5\u98ce\u9669\u3011** \u56e0\u5bb6\u5ead\u80cc\u666f\u4fe1\u606f\u5b8c\u5168\u7f3a\u5931\uff0c\u82e5\u5b58\u5728\u5bb6\u4eba\u53cd\u5bf9\u6216\u9690\u7792\u6d88\u8d39\uff0c\u98ce\u9669\u9aa4\u589e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u5df2\u8bc1\u660e\u80fd\u8ddf\u4e0a\u8bad\u7ec3\u8425\u9ad8\u5f3a\u5ea6\u8282\u594f\uff0c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5c1a\u53ef\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u5b66\u4e60\uff0c\u79ef\u6781\u53cd\u9988\uff0c\u65e0\u73bb\u7483\u5fc3\u8868\u73b0\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u6838\u5fc3\u52a8\u673a\u5305\u542b\u201c\u53d8\u73b0\u6323\u94b1\u201d\uff0c\u82e5\u6b63\u5f0f\u5f00\u8bfe\u540e\u77ed\u671f\u5185\uff08\u59821-2\u4e2a\u6708\uff09\u672a\u83b7\u5f97\u4efb\u4f55\u63a5\u5355\u673a\u4f1a\u6216\u6b63\u5411\u53cd\u9988\uff0c\u53ef\u80fd\u4ea7\u751f\u7126\u8651\u548c\u6000\u7591\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u6b63\u5f0f\u5f00\u8bfe\u540e\u7b2c4-8\u5468\uff08\u201c\u6b7b\u4ea1\u8c37\u201d\u9636\u6bb5\uff09**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u7ec3\u4e60\u8fdb\u5165\u5e73\u53f0\u671f\uff0c\u82e5\u8fdf\u8fdf\u4e0d\u89c1\u201c\u53d8\u73b0\u201d\u82d7\u5934\uff0c\u4e14\u7f3a\u4e4f\u6301\u7eed\u7684\u6b63\u5411\u6fc0\u52b1\uff0c\u9000\u8d39\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c**[\u7528\u6237\u6635\u79f0]\uff0c\u606d\u559c\u4f60\u6b63\u5f0f\u52a0\u5165\uff01\u8bad\u7ec3\u8425\u671f\u95f4\u4f60\u7684\u8e0f\u5b9e\u548c\u8fdb\u6b65\u5e08\u59d0\u90fd\u770b\u5728\u773c\u91cc\uff0c\u7279\u522b\u628a\u4f60\u5217\u4e3a\u54b1\u4eec\u73ed\u7684\u2018\u6f5c\u529b\u5b9e\u5e72\u6d3e\u2019\u3002\u6b63\u5f0f\u8bfe\u8282\u594f\u4f1a\u66f4\u7cfb\u7edf\uff0c\u4e5f\u4f1a\u63a5\u89e6\u5230\u771f\u5b9e\u7684\u8bd5\u97f3\u5355\uff0c\u4f60\u7684\u76ee\u6807\u5f88\u660e\u786e\uff0c\u54b1\u4eec\u5c31\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u628a\u786c\u529f\u592b\u7ec3\u5230\u4f4d\uff0c\u63a5\u5355\u662f\u6c34\u5230\u6e20\u6210\u7684\u4e8b\u3002\u6709\u4efb\u4f55\u5361\u70b9\uff0c\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u653b\u514b\u3002\u201d**\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u3002\u5339\u914d\u5176T2\u5b9e\u5e72\u7279\u8d28\uff0c\u63d0\u4f9b\u6e05\u6670\u7684\u6280\u80fd\u8fdb\u9636\u8def\u5f84\u548c\u5b9e\u64cd\u4efb\u52a1\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\uff08\u8f7b\u91cf\uff09**\u3011\u3002\u56e0\u5176\u4eab\u53d7\u793e\u7fa4\u6c1b\u56f4\uff08\u201c\u5927\u5bb6\u4e00\u8d77\u5b66\u5f88\u6709\u610f\u601d\u201d\uff09\uff0c\u53ef\u9002\u65f6\u8d4b\u4e88\u5c0f\u7ec4\u957f\u3001\u4f5c\u4e1a\u70b9\u8bc4\u5b98\u7b49\u89d2\u8272\uff0c\u589e\u5f3a\u5f52\u5c5e\u611f\u548c\u8d23\u4efb\u611f\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u53ea\u753b\u5927\u997c\u4e0d\u8c08\u5177\u4f53\u7ec3\u4e60**\u3002\u907f\u514d\u7a7a\u8c08\u201c\u5f88\u5feb\u8d5a\u94b1\u201d\uff0c\u8981\u63d0\u4f9b\u660e\u786e\u7684\u7ec3\u4e60\u65b9\u6cd5\u548c\u77ed\u671f\u53ef\u8fbe\u6210\u7684\u6280\u80fd\u91cc\u7a0b\u7891\u30022. **\u5ffd\u89c6\u5176\u5bb6\u5ead\u80cc\u666f\u6838\u67e5**\u3002\u73ed\u4e3b\u4efb\u9700\u5728\u9996\u6b21\u6c9f\u901a\u4e2d\uff0c\u4ee5\u95f2\u804a\u65b9\u5f0f\u81ea\u7136\u4e86\u89e3\u5176\u5b66\u4e60\u65f6\u95f4\u5b89\u6392\u662f\u5426\u4e0e\u5bb6\u5ead\u8d23\u4efb\u51b2\u7a81\uff0c\u662f\u5426\u5df2\u4e0e\u5bb6\u4eba\u6c9f\u901a\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u8fdb\u884c\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u9700\u5efa\u7acb\u5728\u624e\u5b9e\u7684\u5b66\u4e60\u6210\u679c\u548c\u660e\u786e\u7684\u8fdb\u9636\u8def\u5f84\u4e0a**\u3002\u4f8b\u5982\uff0c\u5728\u5176\u5b8c\u6210\u57fa\u7840\u8bfe\u7a0b\u5e76\u6709\u6210\u529f\u8bd5\u97f3\u540e\uff0c\u63a8\u8350\u66f4\u9ad8\u7ea7\u7684\u4e13\u7cbe\u8bad\u7ec3\u8425\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u611f\u89c9\u53ef\u4ee5\u7ee7\u7eed\u5b66\u4e60\uff0c\u957f\u671f\u53d1\u5c55\uff0c\u4e3b\u8981\u5c31\u662f\u53d8\u73b0\u6323\u94b1\u561b[\u5472\u7259]\u201d **(\u52a8\u673a\u4e0e\u9700\u6c42\u7684\u6838\u5fc3\u8868\u8fbe)**\n2. > \u201c\u597d\u7684\uff0c\u8c22\u8c22\u5e08\u59d0\u6559\u6211\u5c0f\u6280\u5de7\uff0c\u7b49\u56de\u53bb\u81ea\u5df1\u518d\u8bd5\u8bd5\u201d **(\u5b9e\u5e72\u578b\u5b66\u4e60\u6001\u5ea6\u7684\u4f53\u73b0)**\n3. > \u201c\u597d\u7684\u5462\uff0c\u5e08\u5144\u90a3\u8fb9\u521a\u521a\u7ed3\u675f\u4e86\uff0c\u5927\u5bb6\u4e00\u8d77\u5b66\u5f88\u6709\u610f\u601d[\u5472\u7259]\u201d **(\u793e\u4ea4\u5f52\u5c5e\u9700\u6c42\u7684\u6d41\u9732)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u3001\u8ba4\u53ef\u53ca\u901a\u8fc7\u6280\u80fd\u5b9e\u73b0\u7a33\u5b9a\u526f\u4e1a\u6536\u5165\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5728\u5f00\u8bfe\u540e4-8\u5468\u201c\u6b7b\u4ea1\u8c37\u201d\u671f\u95f4\uff0c\u63d0\u4f9b\u6301\u7eed\u3001\u5177\u4f53\u7684\u6280\u80fd\u6b63\u53cd\u9988\u548c\u8f7b\u91cf\u7ea7\u7684\u63a5\u5355\u5b9e\u8df5\u673a\u4f1a\uff0c\u5e76\u52a1\u5fc5\u79c1\u4e0b\u6838\u67e5\u5bb6\u5ead\u652f\u6301\u5ea6\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u5f52\u5c5e\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5708\u5c42\u5408\u4f19\u4eba\u7ebf(\u8f7b\u91cf)\"}\n```";
        document.getElementById('content').innerHTML = marked.parse(markdownText);
