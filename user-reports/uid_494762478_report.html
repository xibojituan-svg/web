        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 494762478 (\u6635\u79f0\uff1adyy\u5c0f\u8033\u6735) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-02-20 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u8d1d\u5854beata(\u8d75\u8d1d\u797a) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | L2\u8bfe\u7a0b\u5df2\u6bd5\u4e1a\uff0c\u610f\u5411L3\u8bfe\u7a0b\uff0c\u5e76\u5173\u6ce8\u73ed\u73ed/\u966a\u8dd1\u5b98\u5c97\u4f4d |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u8d44\u91d1\u6765\u6e90\u3001\u5206\u671f\u6216\u501f\u8d37\u4fe1\u606f\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5de5\u4f5c\u5236\u5ea6\u3001\u5bb6\u5ead\u7167\u62a4\u8d1f\u62c5\u6216\u5177\u4f53\u65f6\u95f4\u5b89\u6392\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u7f3a\u4e4f\u8d44\u91d1\u3001\u65f6\u95f4\u3001\u5bb6\u5ead\u652f\u6301\u7b49\u5173\u952e\u51b3\u7b56\u4fe1\u606f\uff0c\u4ec5\u80fd\u57fa\u4e8e\u5b66\u4e60\u884c\u4e3a\u4e0e\u52a8\u673a\u8fdb\u884c\u6709\u9650\u5206\u6790\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u957f\u671f\u53d1\u5c55\u800c\u6765\uff0c\u5174\u8da3\u9a71\u52a8\uff0c\u5173\u6ce8\u6280\u80fd\u63d0\u5347\u4e0e\u804c\u4e1a\u8def\u5f84\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u73b0\u5728\u8fd8\u6ca1\u6709\u5b9a\u4e0b\u4e00\u671f\u7684L3\u4ec0\u4e48\u65f6\u5019\u5f00\u8bfe\u662f\u5427\u201d\n> \u201c\u8fd8\u662f\u73b0\u5728\u5b89\u5b89\u7a33\u7a33\u7684 \u628aL2\u7684\u57fa\u672c\u529f\u7ec3\u597d \u7b49\u5230\u5b66\u5b8cL3 \u518d\u53bb\u8bd5\u5355\u6bd4\u8f83\u597d\u5462\u201d\n> \u201c\u6211\u60f3\u7740 \u8fd9\u6bb5\u65f6\u95f4\u591a\u8bd5\u8bd5\u5546\u5355\uff0c\u5230\u65f6\u5019\u53bb\u9762\u8bd5\u73ed\u73ed\u4e5f\u80fd\u6709\u5757\u6572\u95e8\u7816[\u5077\u7b11]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u65e0\u652f\u4ed8\u4fe1\u606f\uff0c\u65e0\u6cd5\u5224\u65ad\u3002**\u5047\u8bbe\u4e3a\u4e2d\u7b49**\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u6309\u65f6\u5b8c\u6210L2\u8bfe\u7a0b\u4f5c\u4e1a\uff0c\u4e3b\u52a8\u8be2\u95eeL3\u5f00\u8bfe\u65f6\u95f4\uff0c\u5e76\u5c1d\u8bd5\u5546\u5355\uff0c\u8868\u660e\u6709\u6301\u7eed\u5b66\u4e60\u65f6\u95f4\u3002\u4f46\u672a\u63d0\u53ca\u5177\u4f53\u5de5\u4f5c/\u751f\u6d3b\u5b89\u6392\uff0c\u5b58\u5728\u4e0d\u786e\u5b9a\u6027\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\u3002**\u5047\u8bbe\u4e3a\u4e2d\u7b49**\u3002\n- **\u5e95\u5ea7\u53d6\u77ed\u677f**\uff1a**\u4e2d** (\u56e0\u5173\u952e\u4fe1\u606f\u7f3a\u5931\uff0c\u57fa\u4e8e\u73b0\u6709\u884c\u4e3a\u63a8\u65ad\u4e3a\u4e2d\u7b49\uff0c\u4f46\u9700\u8b66\u60d5\u6f5c\u5728\u77ed\u677f)\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\uff0c\u79ef\u6781\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u5fc3\u6001\u5e73\u7a33\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u7ec8\u5ba1\u6ca1\u8fc7 \u6700\u540e\u4e00\u8282\u8f85\u5bfc\u8bfe\u95ee\u4e86\u5927\u5927 \u5927\u5927\u8bf4\u6362\u4e2a\u97f3\u4e50\u518d\u8bd5\u8bd5\u201d\n> \u201c\u563f\u563f \u518d\u7ee7\u7eed\u52a0\u6cb9\u5427\u201d\n> (\u9762\u5bf9\u73ed\u73ed\u9762\u8bd5\u672a\u83b7\u901a\u77e5) \u201c\u54e6\uff0c\u884c\u5427\uff0c\u6ca1\u4e8b\uff0c\u90a3\u5c31\u7b49\u4e0b\u6b21\u5427\u3002\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42** (\u6e34\u671b\u6210\u5c31\u3001\u8ba4\u53ef\u3001\u5efa\u7acb\u4e8b\u4e1a)\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u6e34\u671b\u901a\u8fc7\u6280\u80fd\u63d0\u5347\u83b7\u5f97\u804c\u4e1a\u8eab\u4efd\uff08\u73ed\u73ed/\u966a\u8dd1\u5b98\uff09\u4e0e\u793e\u4f1a\u8ba4\u53ef\uff0c\u8bc1\u660e\u81ea\u8eab\u4ef7\u503c\uff0c\u5b9e\u73b0\u4ece\u5b66\u5458\u5230\u201c\u8001\u5e08\u201d\u6216\u201c\u4e13\u4e1a\u4eba\u58eb\u201d\u7684\u8f6c\u53d8\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u8ba4\u53ef\u4e0e\u804c\u4e1a\u8def\u5f84\u6307\u5f15**\u3002\u80af\u5b9a\u5176\u6280\u672f\u6f5c\u529b\uff0c\u63d0\u4f9b\u6e05\u6670\u7684\u5185\u90e8\u6210\u957f\u8def\u5f84\uff08\u5982\u4ece\u5b66\u5458\u5230\u966a\u8dd1\u5b98/\u73ed\u73ed\uff09\uff0c\u6ee1\u8db3\u5176\u201c\u88ab\u770b\u89c1\u201d\u548c\u201c\u88ab\u9700\u8981\u201d\u7684\u5c0a\u91cd\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 **B\u7c7b (\u6210\u957f\u6295\u8d44\u578b)** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u4e3b\u52a8\u5b8c\u6210\u4f5c\u4e1a\u3001\u5206\u4eab\u8d44\u6599\u3001\u9ed8\u9ed8\u5c1d\u8bd5\u5546\u5355\u3001\u5bfb\u6c42\u5185\u90e8\u53d1\u5c55\u673a\u4f1a) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4f4e** | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u7528\u6237\u884c\u4e3a\u72ec\u7acb\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u5df2\u5b8c\u6210L2\u8bfe\u7a0b\uff0c\u5b66\u4e60\u884c\u4e3a\u79ef\u6781\uff0c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5c1a\u53ef\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u632b\u80fd\u81ea\u6211\u8c03\u6574\uff0c\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | **\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u82e5L3\u8bfe\u7a0b\u6216\u5e94\u8058\u73ed\u73ed/\u966a\u8dd1\u5b98\u7684\u7ed3\u679c\u8fdc\u4f4e\u4e8e\u9884\u671f\uff08\u5982\u6280\u80fd\u65e0\u63d0\u5347\u3001\u5e94\u8058\u5931\u8d25\uff09\uff0c\u53ef\u80fd\u4ea7\u751f\u4ef7\u503c\u8d28\u7591\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1aL3\u8bfe\u7a0b\u4e2d\u671f\u81f3\u7ed3\u4e1a\u540e\uff0c\u6216\u73ed\u73ed/\u966a\u8dd1\u5b98\u5e94\u8058\u7ed3\u679c\u516c\u5e03\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5c0f\u8033\u6735\uff0c\u770b\u5230\u4f60L2\u5b66\u5f97\u8fd9\u4e48\u624e\u5b9e\uff0c\u8fd8\u4e3b\u52a8\u5c1d\u8bd5\u5546\u5355\uff0c\u771f\u7684\u5f88\u6709\u6f5c\u529b\u3002L3\u4e0d\u4ec5\u662f\u6280\u80fd\u7684\u6df1\u5316\uff0c\u66f4\u662f\u4e3a\u4f60\u6253\u5f00\u2018\u4ece\u5b66\u5458\u5230\u521b\u4f5c\u8005/\u5bfc\u5e08\u2019\u8fd9\u6247\u95e8\u7684\u94a5\u5319\u3002\u54b1\u4eec\u4e00\u8d77\uff0c\u4e0d\u4ec5\u628a\u6280\u672f\u7ec3\u786c\uff0c\u66f4\u628a\u8fd9\u6761\u8def\u8d70\u5bbd\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011+\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf**\u3011\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176T2\u5b9e\u5e72\u578b\u4e0e\u5c0a\u91cd\u9700\u6c42\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a\u3010**\u5185\u90e8\u6210\u957f\u8def\u5f84\u6307\u5f15\u5305**\u3011\uff08\u5305\u542b\u966a\u8dd1\u5b98/\u73ed\u73ed\u5e94\u8058\u7ecf\u9a8c\u5206\u4eab\u3001\u5185\u90e8\u9879\u76ee\u53c2\u4e0e\u673a\u4f1a\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u5b9d\u5988\u7126\u8651\u201d\u3001\u201c\u5feb\u901f\u66b4\u5bcc\u201d\u7b49\u4e0b\u6c89\u8bdd\u672f\u8fdb\u884c\u6c9f\u901a\u3002\u907f\u514d\u8fc7\u5ea6\u627f\u8bfaL3\u540e\u201c\u4e00\u5b9a\u80fd\u201d\u6210\u4e3a\u73ed\u73ed\u6216\u8d5a\u5927\u94b1\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u63a8\u4ecbL3\u8bfe\u7a0b\uff0c\u4f46\u9700\u57fa\u4e8e\u5176\u6280\u80fd\u63d0\u5347\u548c\u804c\u4e1a\u53d1\u5c55\u9700\u6c42\uff0c\u800c\u975e\u53d8\u73b0\u627f\u8bfa\u3002\u4e25\u7981\u5728\u672a\u660e\u786e\u5176\u65f6\u95f4\u4e0e\u8d44\u91d1\u5e95\u5ea7\u524d\uff0c\u76f2\u76ee\u5347\u5355\u9ad8\u4ef7\u4ea7\u54c1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u8fd8\u662f\u73b0\u5728\u5b89\u5b89\u7a33\u7a33\u7684 \u628aL2\u7684\u57fa\u672c\u529f\u7ec3\u597d \u7b49\u5230\u5b66\u5b8cL3 \u518d\u53bb\u8bd5\u5355\u6bd4\u8f83\u597d\u5462\u201d\n2. > \u201c\u6211\u60f3\u7740 \u8fd9\u6bb5\u65f6\u95f4\u591a\u8bd5\u8bd5\u5546\u5355\uff0c\u5230\u65f6\u5019\u53bb\u9762\u8bd5\u73ed\u73ed\u4e5f\u80fd\u6709\u5757\u6572\u95e8\u7816[\u5077\u7b11]\u201d\n3. > \u201c\u73ed\u73ed \u6211\u6628\u5929\u665a\u4e0a\u7761\u4e0d\u7740 \u521a\u597d\u770b\u5230\u4f60\u53d1\u670b\u53cb\u5708 \u5c31\u770b\u4e86\u4e0b\u4f60\u5f97\u670b\u53cb\u5708 \u54c7 \u6211\u89c9\u5f97\u4f60\u597d\u68d2\u554a \u6bcf\u5929\u90a3\u4e48\u8f9b\u82e6\u8fd8\u90a3\u4e48\u9633\u5149\u6b63\u80fd\u91cf\uff0c\u770b\u4e86\u4f60\u7684\u670b\u53cb\u5708\u6709\u88ab\u9f13\u52b1\u5230\u8981\u597d\u597d\u52a0\u6cb9\u70ed\u7231\u751f\u6d3b[\u5077\u7b11]\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2\u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u5c0a\u91cd\u4e0e\u804c\u4e1a\u8eab\u4efd\u8ba4\u540c**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4f4e**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u6e05\u6670\u7684\u5185\u90e8\u6210\u957f\u8def\u5f84\u4e0e\u6301\u7eed\u7684\u6210\u5c31\u611f\u53cd\u9988\uff0c\u907f\u514d\u201c\u52aa\u529b\u65e0\u679c\u201d\u7684\u4ef7\u503c\u611f\u5d29\u584c**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"maslow_need\": \"\u7b2c\u56db\u5c42\u5c0a\u91cd\u9700\u6c42\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5708\u5c42\u5408\u4f19\u4eba\u7ebf+\u5185\u90e8\u6210\u957f\u8def\u5f84\u6307\u5f15\u5305\"}\n```";
