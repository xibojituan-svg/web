        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677157182 (\u6635\u79f0\uff1a\u667a\u79c0) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e\uff1a\u4e3b\u64ad\u516d\u6708\u6668\u516e\uff08\u5218\u8d85\u4f1f\uff09\uff1b\u73ed\u4e3b\u4efb\uff1a\u9065\u8fdc\u4e0d\u8fdc\uff08\u5f20\u6587\u9759\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6500\u767b\u8ba1\u5212\u7cfb\u7edf\u8bfe\uff08\u4ef7\u683c\u672a\u660e\u793a\uff0c\u4f46\u63d0\u53ca\u201c400\u201d\uff0c\u7591\u4e3a\u5b9a\u91d1\u6216\u90e8\u5206\u6b3e\u9879\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **[\u4fe1\u606f\u7f3a\u5931]** \u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u8d44\u91d1\u6765\u6e90\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** \u2014 \u9700\u5728\u201c\u5c0f\u5b69\u53bb\u4e0a\u5b66\u540e\u201d\u3001\u201c\u665a\u4e0a\u5c0f\u5b69\u90fd\u56de\u6765\u592a\u5435\u524d\u201d\u3001\u201c\u8f85\u5bfc\u4f5c\u4e1a\u95f4\u9699\u201d\u6324\u65f6\u95f4\u5b66\u4e60\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **[\u4fe1\u606f\u7f3a\u5931]** \u672a\u63d0\u53ca\u914d\u5076\u6216\u5bb6\u4eba\u6001\u5ea6\uff0c\u4f46\u7528\u6237\u4e3a\u5b9d\u5988\uff0c\u5bb6\u5ead\u4e8b\u52a1\u5360\u7528\u5927\u91cf\u7cbe\u529b\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49** \u2014 \u5b66\u4e60\u884c\u4e3a\u3001\u65f6\u95f4\u5b89\u6392\u3001\u5b66\u4e60\u6001\u5ea6\u4fe1\u606f\u9971\u6ee1\uff1b\u4f46**\u5173\u952e\u652f\u4ed8\u80fd\u529b\u3001\u5bb6\u5ead\u652f\u6301\u5ea6\u3001\u6df1\u5c42\u52a8\u673a\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\uff0c\u964d\u7ea7\u7f6e\u4fe1\u5ea6\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6709\u58f0\u884c\u4e1a\u53d8\u73b0\u7684\u5174\u8da3\uff08\u201c\u5bf9\u5f55\u4e66\uff0c\u753b\u672c\uff0c\u5ba1\u542c\u6bd4\u8f83\u611f\u5174\u8da3\u201d\uff09\uff0c\u4f46\u540c\u65f6\u4e5f\u6d41\u9732\u51fa\u5bf9\u6280\u80fd\u672c\u8eab\uff08\u201c\u767e\u53d8\u58f0\u97f3\u201d\u3001\u201c\u77e5\u6027\u4f18\u96c5\u7684\u4e2d\u5e74\u5973\u7684\u58f0\u97f3\u201d\uff09\u7684\u5174\u8da3\u548c\u4eab\u53d7\u5b66\u4e60\u8fc7\u7a0b\uff08\u201cPIA\u620f\u770b\u5b8c\u4e86\uff0c\u633a\u6709\u610f\u601d\u7684\u201d\uff09\u3002\u52a8\u673a\u662f\u201c\u641e\u94b1\u201d\u4e0e\u201c\u5174\u8da3/\u81ea\u6211\u63d0\u5347\u201d\u7684\u6df7\u5408\u4f53\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5bf9\u5f55\u4e66\uff0c\u753b\u672c\uff0c\u5ba1\u542c\u6bd4\u8f83\u611f\u5174\u8da3\u201d & \u201c\u6211\u5565\u65f6\u5019\u80fd\u5b66\u5230\u8ddf\u4f60\u4eec\u4e00\u6837\u767e\u53d8\u58f0\u97f3\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u4fe1\u606f\u7f3a\u5931]** \u2014 \u65e0\u4efb\u4f55\u5173\u4e8e\u6536\u5165\u3001\u50a8\u84c4\u3001\u652f\u4ed8\u538b\u529b\u7684\u8ba8\u8bba\u3002**\u6b64\u4e3a\u6700\u5927\u98ce\u9669\u76f2\u533a\u3002**\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e** \u2014 \u6838\u5fc3\u77ed\u677f\u3002\u7528\u6237\u662f\u5b9d\u5988\uff0c\u5b66\u4e60\u65f6\u95f4\u5b8c\u5168\u53d6\u51b3\u4e8e\u5b69\u5b50\u4f5c\u606f\uff08\u201c\u5c0f\u5b69\u53bb\u4e0a\u5b66\u4e86\u2026\u5c0f\u5b69\u5728\u5bb6\u7684\u8bdd\u4f30\u8ba1\u5c31\u6bd4\u8f83\u5435\u201d\u3001\u201c\u665a\u4e0a\u4e00\u822c\u65f6\u95f4\u6bd4\u8f83\u7d27\u201d\u3001\u201c\u5728\u7ed9\u5c0f\u5b69\u8f85\u5bfc\u4f5c\u4e1a\u201d\uff09\uff0c\u5c5e\u4e8e\u5178\u578b\u7684**\u788e\u7247\u5316\u62fc\u51d1**\u6a21\u5f0f\uff0c\u6301\u7eed\u3001\u6574\u5757\u7684\u5b66\u4e60\u65f6\u95f4\u96be\u4ee5\u4fdd\u969c\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u4fe1\u606f\u7f3a\u5931]** \u2014 \u672a\u63d0\u53ca\u5bb6\u4eba\u662f\u5426\u652f\u6301\u5176\u6295\u5165\u65f6\u95f4\u3001\u91d1\u94b1\u5b66\u4e60\u3002\u9274\u4e8e\u5176\u5bb6\u5ead\u89d2\u8272\uff0c**\u5b58\u5728\u9690\u6027\u5bb6\u5ead\u5e72\u9884\u98ce\u9669**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u56f0\u96be\uff08\u201c\u6c14\u606f\u63d0\u4e0d\u4e0a\u53bb\u201d\uff09\u3001\u81ea\u6211\u6000\u7591\uff08\u201c\u4ece\u89c9\u5f97\u542c\u81ea\u5df1\u7684\u58f0\u97f3\u5f88\u96be\u542c\u201d\uff09\u65f6\uff0c\u6001\u5ea6\u79ef\u6781\uff0c\u80fd\u7406\u6027\u5206\u6790\uff08\u201c\u5148\u505a\u597d\u4e00\u4ef6\u4e8b\u518d\u53bb\u505a\u53e6\u5916\u4e00\u4ef6\u4e8b\u201d\u3001\u201c\u5148\u628a\u5730\u57fa\u6253\u597d\u201d\uff09\uff0c\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u5e76\u79ef\u6781\u63a5\u53d7\u53cd\u9988\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u786e\u5b9e\u662f\u8fd9\u6837\u7684\u201d & \u201c\u5148\u628a\u6c14\u606f\u7ec3\u597d\uff0c\u8fd8\u6709\u5c31\u662f\u91cd\u97f3\u90e8\u5206\u5b66\u597d\u201d & \u201c\u6211\u81ea\u5df1\u89c9\u5f97\u6c14\u606f\u63d0\u4e0d\u4e0a\u53bb\u3002\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4f5c\u4e3a\u5168\u804c/\u517c\u804c\u5b9d\u5988\uff0c\u5728\u5bb6\u5ead\u89d2\u8272\u4e4b\u5916\uff0c\u6e34\u671b\u83b7\u5f97\u793e\u4f1a\u8eab\u4efd\u8ba4\u540c\u3001\u4ef7\u503c\u611f\u4ee5\u53ca\u4e00\u4e2a\u5c5e\u4e8e\u81ea\u5df1\u7684\u201c\u6210\u957f\u5708\u5c42\u201d**\u3002\u5979\u7684\u5b66\u4e60\u884c\u4e3a\u4e0d\u4ec5\u662f\u6280\u80fd\u83b7\u53d6\uff0c\u66f4\u662f\u4e00\u79cd\u201c\u81ea\u6211\u8bc1\u660e\u201d\u548c\u5bfb\u627e\u201c\u540c\u8def\u4eba\u201d\u7684\u8fc7\u7a0b\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u3001\u88ab\u8ba4\u53ef\u3001\u88ab\u5bc4\u4e88\u539a\u671b\u201d\u7684\u5708\u5c42\u5f52\u5c5e\u611f**\u3002\u9500\u552e\u201c\u6211\u770b\u597d\u4f60\u201d\u3001\u201c\u4f60\u662f\u6211\u5e26\u5165\u884c\u7684\u5a18\u5bb6\u4eba\u201d\u7b49\u8bdd\u672f\u7cbe\u51c6\u51fb\u4e2d\u4e86\u6b64\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1 \u7c7b** \u2014 \u52a8\u673a\u4e2d\u7b49\uff0c\u8d44\u6e90\u5e95\u5ea7\uff08\u65f6\u95f4\uff09\u5b58\u5728\u660e\u663e\u77ed\u677f\uff0c\u4f46\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u5b66\u4e60\u6001\u5ea6\u597d\u3002\u5c5e\u4e8e**\u9700\u91cd\u70b9\u6276\u6301\u4e0e\u98ce\u9669\u76d1\u63a7\u7684\u6f5c\u529b\u7528\u6237**\u3002 |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** \u2014 \u4e0d\u5f20\u626c\uff0c\u8e0f\u5b9e\u5b8c\u6210\u4f5c\u4e1a\uff0c\u4e3b\u52a8\u53cd\u9988\u95ee\u9898\uff0c\u8ffd\u6c42\u7a33\u6b65\u8fdb\u6b65\uff08\u201c\u5148\u505a\u597d\u4e00\u4ef6\u4e8b\u518d\u53bb\u505a\u53e6\u5916\u4e00\u4ef6\u4e8b\u201d\uff09\uff0c\u5bf9\u4e13\u4e1a\u6307\u5bfc\u63a5\u53d7\u5ea6\u9ad8\u3002 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u7b49\u6781\u7aef\u60c5\u51b5\u3002**\u4f46\u5bb6\u5ead\u65f6\u95f4\u51b2\u7a81\u662f\u6f5c\u5728\u7684\u538b\u529b\u6e90\u3002**\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u56e0\u5b66\u4e60\u6324\u5360\u5bb6\u5ead\u65f6\u95f4\uff08\u5982\u8f85\u5bfc\u5b69\u5b50\u3001\u5bb6\u52a1\uff09\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\uff0c\u88ab\u8feb\u4e2d\u65ad\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u56e0\u5b69\u5b50\u751f\u75c5\u3001\u5f00\u5b66\u3001\u5bb6\u5ead\u4e8b\u52a1\u7b49\u5bfc\u81f4\u5b66\u4e60\u8ba1\u5212\u5b8c\u5168\u88ab\u6253\u4e71\uff0c\u4f5c\u4e1a\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u632b\u8d25\u611f\u548c\u6127\u759a\u611f\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u56f0\u96be\u7834\u9632\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u8fdb\u5165\u5b9e\u6218\u63a5\u5355\u9636\u6bb5\u540e\uff0c\u53d1\u73b0\u788e\u7247\u5316\u65f6\u95f4\u65e0\u6cd5\u6ee1\u8db3\u5f55\u5236\u8981\u6c42\uff0c\u6216\u521d\u671f\u6536\u76ca\u4e0e\u65f6\u95f4\u6295\u5165\u4e0d\u6210\u6b63\u6bd4\uff0c\u4ea7\u751f\u843d\u5dee\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\u3002\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u6b63\u5f0f\u8bfe\u7a0b\u4f5c\u4e1a\u91cf\u589e\u52a0\uff0c\u4e0e\u5bb6\u5ead\u65f6\u95f4\u7684\u51b2\u7a81\u52a0\u5267\uff0c\u662f\u653e\u5f03\u7684\u9ad8\u5cf0\u671f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u667a\u79c0\u4f60\u597d\uff01\u770b\u5230\u8bad\u7ec3\u8425\u671f\u95f4\u4f60\u7279\u522b\u8ba4\u771f\uff0c\u5728\u5e26\u5a03\u95f4\u9699\u8fd8\u575a\u6301\u6668\u7ec3\u3001\u4ea4\u4f5c\u4e1a\uff0c\u771f\u7684\u7279\u522b\u4f69\u670d\u3002\u54b1\u4eec\u73ed\u5f88\u591a\u5b9d\u5988\u540c\u5b66\uff0c\u5927\u5bb6\u65f6\u95f4\u90fd\u50cf\u2018\u6d77\u7ef5\u91cc\u7684\u6c34\u2019\u3002\u6b63\u5f0f\u8bfe\u5f00\u59cb\u540e\uff0c\u73ed\u73ed\u4f1a\u91cd\u70b9\u5173\u6ce8\u5927\u5bb6\u7684\u65f6\u95f4\u89c4\u5212\uff0c\u5982\u679c\u6709\u54ea\u5929\u88ab\u5b69\u5b50\u2018\u7ed1\u4f4f\u2019\u4e86\uff0c\u5343\u4e07\u522b\u7126\u8651\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4eec\u4e00\u8d77\u8c03\u6574\u8282\u594f\u3002\u8bb0\u4f4f\uff0c\u54b1\u4eec\u6bd4\u7684\u662f\u2018\u6301\u7eed\u2019\uff0c\u4e0d\u662f\u2018\u901f\u5ea6\u2019\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72+\u7075\u6d3b\u966a\u4f34\u7ebf**\u3011\u3002\u4ee5\u638c\u63e1\u6838\u5fc3\u6f14\u64ad\u6280\u80fd\u3001\u8fbe\u6210\u63a5\u5355\u4e3a\u76ee\u6807\uff0c\u4f46\u5fc5\u987b\u642d\u914d\u6781\u5f3a\u7684\u65f6\u95f4\u7075\u6d3b\u6027\u652f\u6301\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u8865\u5145\u3010**\u5b9d\u5988\u65f6\u95f4\u7ba1\u7406\u9526\u56ca\u5305**\u3011\uff08\u5982\uff1a\u77ed\u97f3\u9891\u7ec3\u4e60\u6a21\u5757\u3001\u53ef\u968f\u65f6\u4e2d\u65ad/\u7eed\u542c\u7684\u8bfe\u7a0b\u5207\u7247\u3001\u975e\u5b9e\u65f6\u793e\u7fa4\u7b54\u7591\uff09\u3001\u3010**\u540c\u9891\u5b9d\u5988\u4e92\u52a9\u5708**\u3011\uff08\u7ec4\u5efa\u5c0f\u7fa4\uff0c\u5206\u4eab\u201c\u5077\u65f6\u95f4\u201d\u5b66\u4e60\u5fc3\u5f97\uff0c\u63d0\u4f9b\u60c5\u7eea\u652f\u6301\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u522b\u4eba\u4e00\u5929\u7ec33\u5c0f\u65f6\u4f60\u600e\u4e48\u4e0d\u884c\u201d\u6765\u65bd\u538b\uff1b\u5728\u665a\u4e0a\u5b69\u5b50\u4f11\u606f\u540e\u7684\u9ec4\u91d1\u65f6\u95f4\u5b89\u6392\u5f3a\u5236\u6027\u7684\u5b9e\u65f6\u76f4\u64ad\u6d3b\u52a8\uff1b\u5ffd\u89c6\u5176\u56e0\u5bb6\u5ead\u4e8b\u52a1\u5bfc\u81f4\u7684\u77ed\u6682\u201c\u5931\u8054\u201d\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u8bfe\u7a0b\u521d\u671f\u8fdb\u884c\u4efb\u4f55\u5927\u989d\u5347\u5355**\u3002\u53ef\u89c2\u5bdf\u51762\u4e2a\u6708\u7cfb\u7edf\u8bfe\u7684\u5b66\u4e60\u5b8c\u6210\u5ea6\u548c\u65f6\u95f4\u7ba1\u7406\u60c5\u51b5\u540e\uff0c\u518d\u8c28\u614e\u8bc4\u4f30\u662f\u5426\u63a8\u8350\u9ad8\u9636\u8bfe\u7a0b\u3002\u4f18\u5148\u63a8\u8350**\u5c0f\u989d\u3001\u7075\u6d3b\u7684\u4e13\u9879\u6280\u80fd\u5305\u6216\u7248\u6743\u4e66\u8d44\u6e90\u5305**\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u56e0\u4e3a\u65e9\u4e0a\u5c0f\u5b69\u53bb\u4e0a\u5b66\u4e86\uff0c\u6240\u4ee5\u8bf4\u5c31\u6709\u65f6\u95f4\u53bb\u7ec3\uff0c\uff0c\u5c0f\u5b69\u5728\u5bb6\u7684\u8bdd\u4f30\u8ba1\u5c31\u6bd4\u8f83\u5435\uff0c\u7136\u540e\u5c31\u6ca1\u90a3\u4e48\u591a\u65f6\u95f4\u3002\u201d\n2. > \u201c\u65e2\u7136\u60f3\u505a\u4e00\u4ef6\u4e8b\u5c31\u5f97\u7528\u5fc3\u53bb\u505a\u201d\n3. > \u201c\u5148\u505a\u597d\u4e00\u4ef6\u4e8b\u518d\u53bb\u505a\u53e6\u5916\u4e00\u4ef6\u4e8b\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2\u4f4e\u8c03\u5b9e\u5e72\u578b\u5b9d\u5988\u5b66\u5458**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u5728\u5bb6\u5ead\u89d2\u8272\u5916\u83b7\u5f97\u793e\u4f1a\u8ba4\u540c\u4e0e\u5708\u5c42\u5f52\u5c5e**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d\u504f\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u6781\u81f4\u7075\u6d3b\u7684\u65f6\u95f4\u89e3\u51b3\u65b9\u6848\u4e0e\u5b9d\u5988\u5708\u5c42\u7684\u60c5\u611f\u652f\u6491**\uff0c\u4e25\u9632\u201c\u65f6\u95f4\u6324\u538b\u201d\u5bfc\u81f4\u7684\u5d29\u76d8\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u5f52\u5c5e\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72+\u7075\u6d3b\u966a\u4f34\u7ebf\"}\n```";
