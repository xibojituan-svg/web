    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49)**\n    *   **\u6c42\u77e5\u63a2\u7d22**\uff1a\u5bf9AI\u751f\u56fe\u3001\u63d0\u793a\u8bcd\u7f16\u8f91\u3001\u77ed\u5267\u5236\u4f5c\u8868\u73b0\u51fa\u660e\u786e\u5174\u8da3\uff0c\u4e3b\u52a8\u63d0\u95ee\u6280\u672f\u7ec6\u8282\uff08\u201c\u63d0\u793a\u8bcd\u53ef\u4ee5\u81ea\u5df1\u7f16\u8f91\u4f18\u5316\u662f\u5417\uff1f\u201d\uff09\u3002\n    *   **\u526f\u4e1a\u53d8\u73b0**\uff1a\u660e\u786e\u8868\u793a\u517c\u804c\u76ee\u7684\uff0c\u5bf9\u201c\u77ed\u5267\u201d\u53d8\u73b0\u65b9\u5411\u8868\u8fbe\u5174\u8da3\uff0c\u5173\u6ce8\u201c\u6536\u8d39\u8d35\u5417\uff1f\u201d\u3001\u201c\u5546\u5355\u4ef7\u683c\u201d\uff0c\u6709\u660e\u786e\u7684\u6295\u8d44\u56de\u62a5\u9884\u671f\u3002\n    *   **\u98ce\u9669\u4fe1\u53f7**\uff1a\u52a8\u673a\u4e2d\u201c\u526f\u4e1a\u53d8\u73b0\u201d\u6743\u91cd\u8f83\u9ad8\uff0c\u5bf9\u8bfe\u7a0b\u4ef7\u683c\u654f\u611f\uff0c\u5b58\u5728**\u5c06\u5b66\u4e60\u6210\u679c\u4e0e\u77ed\u671f\u6536\u5165\u76f4\u63a5\u6302\u94a9\u7684\u6f5c\u5728\u9ad8\u671f\u5f85**\u3002\n\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d\u7b49)**\n    *   **\u804c\u4e1a\u8eab\u4efd**\uff1a\u81ea\u79f0\u201c\u6559\u5e08\u201d\uff0c\u6709\u7a33\u5b9a\u4e3b\u4e1a\uff0c\u5177\u5907\u57fa\u672c\u7684\u5b66\u4e60\u80fd\u529b\u548c\u65f6\u95f4\u89c4\u5212\u80fd\u529b\uff08\u201c\u5728\u5f00\u4f1a\u201d\u540e\u80fd\u534f\u8c03\u65f6\u95f4\uff09\u3002\n    *   **\u5b66\u4e60\u6295\u5165**\uff1a\u80fd\u6309\u65f6\u53c2\u4e0e\u76f4\u64ad\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u63a5\u53d7\u70b9\u8bc4\uff0c\u4e92\u52a8\u79ef\u6781\uff0c\u7b26\u5408\u201c\u597d\u5b66\u751f\u201d\u884c\u4e3a\u6a21\u5f0f\u3002\n    *   **\u4fe1\u606f\u7f3a\u53e3**\uff1a\u672a\u900f\u9732\u5177\u4f53\u7ecf\u6d4e\u72b6\u51b5\u3001\u53ef\u652f\u914d\u5b66\u4e60\u65f6\u95f4\u3001\u8bbe\u5907\u6761\u4ef6\u7b49\u786c\u6027\u8d44\u6e90\u4fe1\u606f\u3002\n\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u7b49\u504f\u9ad8)**\n    *   **\u4e92\u52a8\u4f9d\u4ece\u6027\u9ad8**\uff1a\u5168\u7a0b\u79ef\u6781\u56de\u5e94\u9500\u552e\uff0c\u4f7f\u7528\u201c\u597d\u561e\u201d\u3001\u201c\u611f\u8c22\u201d\u3001\u201c\u6536\u83b7\u6ee1\u6ee1\u201d\u7b49\u6b63\u9762\u53cd\u9988\uff0c\u914d\u5408\u5ea6\u9ad8\u3002\n    *   **\u632b\u6298\u5bb9\u5fcd\u5ea6\u521d\u663e**\uff1a\u5bf9AI\u751f\u56fe\u7ed3\u679c\u4e0e\u9884\u671f\u4e0d\u7b26\uff08\u201c\u56fe\u7247\u548c\u60f3\u8c61\u4e2d\u7684\u4e0d\u4e00\u6837\u201d\uff09\u8868\u793a\u7406\u89e3\uff0c\u672a\u8868\u73b0\u51fa\u660e\u663e\u632b\u8d25\u6216\u62b1\u6028\u3002\n    *   **\u51b3\u7b56\u72ec\u7acb\u6027\u5b58\u7591**\uff1a\u5728\u9500\u552e\u5bc6\u96c6\u7684\u201c\u53d8\u73b0\u524d\u666f\u201d\u548c\u201c\u8d44\u6e90\u6276\u6301\u201d\u8bdd\u672f\u4e0b\u5b8c\u6210\u8f6c\u5316\uff0c**\u7f3a\u4e4f\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u3001\u5e08\u8d44\u3001\u5408\u540c\u6761\u6b3e\u7684\u4e3b\u52a8\u6c42\u8bc1**\uff0c\u51b3\u7b56\u53ef\u80fd\u53d7\u6c1b\u56f4\u63a8\u52a8\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u5df2\u652f\u4ed8\uff0c\u8d2d\u4e703.5\u4e2a\u6708\u8bfe\u7a0b\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u672a\u63d0\u53ca\u914d\u5076\u6216\u5bb6\u5ead\u610f\u89c1\uff0c\u57fa\u4e8e\u4e2a\u4eba\u804c\u4e1a\uff08\u6559\u5e08\uff09\u4e0e\u517c\u804c\u9700\u6c42\u51b3\u7b56\uff0c\u53ef\u521d\u6b65\u5224\u65ad\u4e3a\u72ec\u7acb\u51b3\u7b56\u8005\u3002\n*   **\u6b65\u9aa41-4\u5224\u5b9a**\uff1a\n    *   **A (\u8ba4\u77e5\u5c42-\u77e5\u9053\u8981\u5b66)**\uff1a\u660e\u786e\uff0c\u4e86\u89e3AI\u77ed\u89c6\u9891/\u77ed\u5267\u4e3a\u5b66\u4e60\u76ee\u6807\u3002\n    *   **B (\u4ef7\u503c\u5c42-\u8ba4\u53ef\u503c\u5f97\u5b66)**\uff1a\u4e2d\u7b49\u8ba4\u53ef\u3002\u8ba4\u53ef\u8bfe\u7a0b\u4ef7\u503c\uff08\u201c\u8001\u5e08\u8bb2\u7684\u975e\u5e38\u597d\u201d\uff09\uff0c\u4f46\u5bf9\u4ef7\u683c\u654f\u611f\uff0c\u4ef7\u503c\u5224\u65ad\u53ef\u80fd\u8f83\u591a\u4f9d\u8d56\u9500\u552e\u63cf\u7ed8\u7684\u201c\u5546\u5355\u201d\u3001\u201c\u53d8\u73b0\u201d\u524d\u666f\u3002\n    *   **C (\u51b3\u7b56\u5c42-\u51b3\u5b9a\u73b0\u5728\u5b66)**\uff1a\u5df2\u51b3\u7b56\u5e76\u652f\u4ed8\u3002\n    *   **D (\u884c\u52a8\u5c42-\u575a\u6301\u5b66\u5b8c)**\uff1a**\u5f85\u89c2\u5bdf\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u884c\u4e3a\u6a21\u5f0f\u9ad8\u5ea6\u4f9d\u8d56\u5916\u90e8\u5f15\u5bfc\uff08\u9500\u552e\u3001\u73ed\u73ed\uff09\uff0c\u5185\u5728\u9a71\u52a8\u529b\u4e2d\u201c\u53d8\u73b0\u7126\u8651\u201d\u6216\u201c\u526f\u4e1a\u521a\u9700\u201d\u7684\u5f3a\u5ea6\u672a\u7ecf\u9a8c\u8bc1\uff0c\u5728\u9047\u5230\u5b66\u4e60\u96be\u70b9\u6216\u53d8\u73b0\u6210\u679c\u5ef6\u8fdf\u65f6\uff0c**\u575a\u6301\u5ea6\u5b58\u7591**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n**T5 \u52a1\u5b9e\u8fdb\u53d6\u578b**\n*   **\u6838\u5fc3\u7279\u5f81**\uff1a\u76ee\u6807\u660e\u786e\uff08\u517c\u804c\u53d8\u73b0\uff09\uff0c\u884c\u52a8\u529b\u5f3a\uff08\u8ddf\u8fdb\u8bad\u7ec3\u8425\uff09\uff0c\u5c0a\u91cd\u6743\u5a01\uff08\u6559\u5e08\u804c\u4e1a\u53ef\u80fd\u5e26\u6765\u7684\u4e60\u60ef\uff09\uff0c\u5bf9\u7cfb\u7edf\u6027\u3001\u627f\u8bfa\u6027\u7684\u56de\u62a5\uff08\u5982\u5546\u5355\u6e20\u9053\uff09\u6709\u9700\u6c42\u3002\n*   **\u543b\u5408\u70b9**\uff1a\u4f5c\u4e3a\u6559\u5e08\uff0c\u4e60\u60ef\u7ed3\u6784\u5316\u5b66\u4e60\uff1b\u5173\u6ce8\u5b9e\u64cd\u4e0e\u7ed3\u679c\uff08\u77ed\u5267\uff09\uff1b\u5bf9\u201c\u5e73\u53f0\u8d44\u6e90\u201d\u3001\u201c\u5de5\u4f5c\u5ba4\u201d\u7b49\u4f53\u7cfb\u5316\u652f\u6301\u8868\u73b0\u51fa\u5174\u8da3\u3002\n*   **\u504f\u79bb\u70b9**\uff1a\u76f8\u8f83\u4e8e\u5178\u578b\u7684T5\uff0c\u5176\u5bf9\u4e8e\u201c\u4ef7\u683c\u201d\u7684\u654f\u611f\u548c\u76f8\u5bf9\u8f83\u5feb\u7684\u51b3\u7b56\u8fc7\u7a0b\uff0c\u5939\u6742\u4e86\u90e8\u5206T7\uff08\u7126\u8651\u5bfb\u89c5\u578b\uff09\u7684\u7279\u5f81\uff0c\u5373\u88ab\u201c\u53d8\u73b0\u673a\u9047\u201d\u548c\u201c\u8d44\u6e90\u7a00\u7f3a\u6027\u201d\u8bdd\u672f\u6240\u5f71\u54cd\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\uff08\u4e2d\uff09\n\u9010\u9879\u6392\u67e57\u79cd\u6839\u56e0\uff1a\n1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f (\u9ad8\u98ce\u9669)**\uff1a**\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u7528\u6237\u5bf9\u201c\u77ed\u5267\u201d\u53d8\u73b0\u62b1\u6709\u671f\u5f85\uff0c\u4e14\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa\u201c\u7b2c\u4e8c\u5468\u63a5\u5355\u201d\u3001\u201c\u5546\u5355\u4ef7\u683c\u201d\u3002\u82e5\u5b66\u4e60\u66f2\u7ebf\u9661\u5ced\u6216\u53d8\u73b0\u5468\u671f\u957f\uff0c\u6781\u6613\u5f15\u53d1\u201c\u6548\u679c\u4e0d\u7b26\u201d\u6295\u8bc9\u3002\n2.  **\u7ecf\u6d4e\u538b\u529b (\u4f4e\u98ce\u9669)**\uff1a\u672a\u63d0\u53ca\u7ecf\u6d4e\u56f0\u96be\uff0c\u4f46\u6709\u4ef7\u683c\u654f\u611f\u8868\u73b0\u3002\n3.  **\u65f6\u95f4\u51b2\u7a81 (\u4e2d\u98ce\u9669)**\uff1a\u6559\u5e08\u804c\u4e1a\u53ef\u80fd\u6709\u56fa\u5b9a\u95f2\u6687\uff0c\u4f46\u82e5\u8bfe\u7a0b\u5f3a\u5ea6\u5927\u6216\u9700\u6301\u7eed\u6295\u5165\uff0c\u53ef\u80fd\u4ea7\u751f\u51b2\u7a81\u3002\n4.  **\u5185\u5bb9\u8d28\u91cf\u4e0d\u6ee1 (\u4e2d\u98ce\u9669)**\uff1a\u76ee\u524d\u5bf9\u8bfe\u7a0b\u8bc4\u4ef7\u79ef\u6781\uff0c\u4f46\u82e5\u6b63\u5f0f\u8bfe\u5185\u5bb9\u4e0e\u8bad\u7ec3\u8425\u4f53\u9a8c\u6216\u9500\u552e\u627f\u8bfa\u6709\u843d\u5dee\uff0c\u98ce\u9669\u5c06\u5347\u9ad8\u3002\n5.  **\u670d\u52a1\u4f53\u9a8c\u5dee (\u4f4e\u98ce\u9669)**\uff1a\u76ee\u524d\u9500\u552e\u670d\u52a1\u4f53\u9a8c\u826f\u597d\u3002\n6.  **\u5bb6\u5ead\u53cd\u5bf9 (\u4f4e\u98ce\u9669)**\uff1a\u6682\u672a\u4f53\u73b0\u3002\n7.  **\u7ade\u54c1\u8f6c\u79fb (\u4f4e\u98ce\u9669)**\uff1a\u76ee\u524d\u7528\u6237\u7c98\u6027\u8f83\u9ad8\uff0c\u4f46\u82e5\u53d1\u73b0\u66f4\u4f18\u6027\u4ef7\u6bd4\u8bfe\u7a0b\uff0c\u5b58\u5728\u8f6c\u79fb\u53ef\u80fd\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5408\u89c4\u98ce\u9669**\uff1a\n    *   **\u8fc7\u5ea6\u627f\u8bfa**\uff1a\u9500\u552e\u591a\u6b21\u63d0\u53ca\u201c\u7b2c\u4e8c\u5468\u5f00\u901a\u63a5\u5355\u6743\u9650\u201d\u3001\u201c\u521d\u9636\u89c6\u9891\u5546\u535580-300/\u6bcf\u5206\u949f\u201d\u3001\u201c\u52a0\u5165\u5de5\u4f5c\u5ba4\u5171\u4eab\u6240\u6709\u8d44\u6e90\u201d\uff0c**\u5b58\u5728\u5938\u5927\u6536\u76ca\u3001\u6a21\u7cca\u5b9e\u73b0\u6761\u4ef6\u7684\u98ce\u9669**\uff0c\u662f\u4e3b\u8981\u5408\u89c4\u96f7\u533a\u3002\n    *   **\u5236\u9020\u7a00\u7f3a\u4e0e\u7d27\u8feb\u611f**\uff1a\u4f7f\u7528\u201c\u5185\u90e8\u5c0f\u7076\u8bfe\u201d\u3001\u201c\u5e73\u53f0\u8d44\u6e90\u53ea\u514d\u8d39\u63d0\u4f9b\u7ed9\u5185\u90e8\u5b66\u5458\u201d\u3001\u201c\u5238\u8981\u62a2\u201d\u7b49\u8bdd\u672f\uff0c\u7b26\u5408\u884c\u4e1a\u5e38\u89c1\u624b\u6cd5\uff0c\u4f46\u9700\u6ce8\u610f\u5c3a\u5ea6\u3002\n    *   **\u8eab\u4efd\u6a21\u7cca**\uff1a\u9500\u552e\u4ee5\u201c\u5e08\u59d0\u201d\u3001\u201c\u73ed\u73ed\u201d\u81ea\u79f0\uff0c\u6df7\u6dc6\u4e86\u9500\u552e\u4e0e\u6559\u5b66\u670d\u52a1\u89d2\u8272\u3002\n*   **\u4f26\u7406\u9632\u7ebf**\uff1a\u9500\u552e\u8fc7\u7a0b\u5229\u7528\u4e86\u7528\u6237\u5bf9\u201c\u526f\u4e1a\u589e\u6536\u201d\u7684\u8feb\u5207\u9700\u6c42\u548c\u5bf9\u201c\u6559\u5e08\u201d\u8eab\u4efd\u7684\u4fe1\u4efb\uff0c\u4f46\u5c1a\u672a\u53d1\u73b0\u6b3a\u8bc8\u3001\u6050\u5413\u7b49\u7ea2\u7ebf\u884c\u4e3a\u3002**\u5173\u952e\u5728\u4e8e\u540e\u7eed\u627f\u8bfa\u7684\u5151\u73b0**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6838\u5fc3\u7b56\u7565**\uff1a**\u5f3a\u5316\u4ef7\u503c\u5185\u5316\uff0c\u7ba1\u7406\u53d8\u73b0\u9884\u671f\uff0c\u63d0\u4f9b\u5373\u65f6\u6b63\u53cd\u9988\u3002**\n*   **\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9884\u671f\u7ba1\u7406**\uff1a\u73ed\u4e3b\u4efb\u9996\u6b21\u6c9f\u901a\u9700\u660e\u786e\u5b66\u4e60\u8def\u5f84\uff0c\u5f3a\u8c03\u6280\u80fd\u79ef\u7d2f\u5468\u671f\uff0c\u5c06\u201c\u63a5\u5355\u201d\u5b9a\u4f4d\u4e3a\u5b66\u4e60\u6210\u679c\u7684\u201c\u5e94\u7528\u573a\u666f\u201d\u4e4b\u4e00\uff0c\u800c\u975e\u201c\u5b66\u4e60\u4fdd\u8bc1\u201d\u3002\n    2.  **\u5373\u65f6\u6fc0\u52b1**\uff1a\u5145\u5206\u5229\u7528\u5176\u201c\u597d\u5b66\u751f\u201d\u7279\u8d28\uff0c\u5bf9\u5176\u4f5c\u4e1a\u3001\u4e92\u52a8\u7ed9\u4e88\u53ca\u65f6\u3001\u5177\u4f53\u7684\u8868\u626c\uff0c\u5f3a\u5316\u5176\u201c\u6536\u83b7\u611f\u201d\u3002\n    3.  **\u793e\u4ea4\u7ed1\u5b9a**\uff1a\u5c06\u5176\u5f15\u5165\u5b66\u4e60\u5c0f\u7ec4\u6216\u201c\u5e08\u5f92\u5236\u201d\uff0c\u5229\u7528\u5176\u6559\u5e08\u8eab\u4efd\uff0c\u9f13\u52b1\u5176\u5206\u4eab\u6216\u5e2e\u52a9\u4ed6\u4eba\uff0c\u63d0\u5347\u5f52\u5c5e\u611f\u4e0e\u8d23\u4efb\u611f\u3002\n    4.  **\u8def\u5f84\u53ef\u89c6\u5316**\uff1a\u4e3a\u5176\u62c6\u89e3\u201c\u77ed\u5267\u5236\u4f5c\u201d\u4ece\u5206\u955c\u3001\u63d0\u793a\u8bcd\u5230\u6210\u7247\u7684\u9636\u6bb5\u6027\u76ee\u6807\uff0c\u8ba9\u8fdb\u6b65\u53ef\u611f\u77e5\u3002\n    5.  **\u98ce\u9669\u9884\u8b66**\uff1a\u5173\u6ce8\u5176\u9996\u6b21\u9047\u5230\u5b66\u4e60\u74f6\u9888\u6216\u5546\u5355\u5c1d\u8bd5\u53d7\u632b\u65f6\u7684\u60c5\u7eea\u53cd\u9988\uff0c\u63d0\u524d\u4ecb\u5165\u758f\u5bfc\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**\uff1a\n    *   **\u6302\u8f7d\u4e50\u9ad8\u7ebf**\uff1a**\u201c\u6280\u80fd\u8ba4\u8bc1+\u63a5\u5355\u901a\u9053\u201d\u7ec4\u5408**\u3002\u4f18\u5148\u5f15\u5bfc\u5b8c\u6210\u6838\u5fc3\u6280\u80fd\u6a21\u5757\u5b66\u4e60\u5e76\u83b7\u5f97\u8ba4\u8bc1\uff0c\u518d\u9010\u6b65\u5f15\u5165\u5e73\u53f0\u5546\u5355\u6c60\uff08\u4ece\u7b80\u5355\u5236\u56fe\u4efb\u52a1\u5f00\u59cb\uff09\uff0c\u8ba9\u201c\u53d8\u73b0\u201d\u4f53\u9a8c\u4e0e\u6280\u80fd\u6210\u957f\u7d27\u5bc6\u6302\u94a9\uff0c\u907f\u514d\u843d\u5dee\u3002\n    *   **\u614e\u63a8\u4ea7\u54c1**\uff1a\u907f\u514d\u76f4\u63a5\u63a8\u9500\u9ad8\u5355\u4ef7\u201c\u4fdd\u6536\u5165\u201d\u6216\u201c\u72ec\u5bb6\u8d44\u6e90\u201d\u5957\u9910\uff0c\u6613\u5f15\u53d1\u540e\u7eed\u7ea0\u7eb7\u3002\n\n{\"core_type\": \"T5 \u52a1\u5b9e\u8fdb\u53d6\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u6210\u5c31\uff08\u804c\u4e1a\u53d1\u5c55/\u526f\u4e1a\u8ba4\u53ef\uff09\", \"target_product_line\": \"\u6280\u80fd\u8ba4\u8bc1+\u63a5\u5355\u901a\u9053\u7ec4\u5408\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}";
