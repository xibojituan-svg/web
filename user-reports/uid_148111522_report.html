    <script>
        const markdownText = "\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e\u3002\u7f3a\u4e4f\u652f\u4ed8\u4fe1\u606f\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u3001\u660e\u786e\u5b66\u4e60\u76ee\u6807\u3001\u4e2a\u4eba\u80cc\u666f\u53ca\u8d44\u6e90\u60c5\u51b5\u3002\n\n# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u4e3b\u8981\u4e3a\u73ed\u7ea7\u7ba1\u7406/\u52a9\u6559\u7c7b\u53d1\u8a00\uff0c\u65e0\u4e2a\u4eba\u5b66\u4e60\u76ee\u6807\u3001\u804c\u4e1a\u89c4\u5212\u6216\u5174\u8da3\u8868\u8fbe\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u65e0\u65f6\u95f4\u3001\u8bbe\u5907\u3001\u7ecf\u6d4e\u72b6\u51b5\u3001\u8fc7\u5f80\u7ecf\u9a8c\u7b49\u4fe1\u606f\u3002\u53d1\u8a00\u663e\u793a\u719f\u6089\u8bfe\u7a0b\u6d41\u7a0b\u548c\u5de5\u5177\uff08AU\u3001\u97f3\u526a\u3001MK4\uff09\uff0c\u53ef\u80fd\u5177\u5907\u4e00\u5b9a\u6280\u672f\u57fa\u7840\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u4e92\u52a8\u98ce\u683c\u79ef\u6781\u3001\u5e7d\u9ed8\uff0c\u80fd\u5904\u7406\u540c\u5b66\u95ee\u9898\uff0c\u4f46\u65e0\u9762\u5bf9\u632b\u6298\u3001\u538b\u529b\u6216\u8d1f\u9762\u53cd\u9988\u7684\u76f4\u63a5\u8868\u73b0\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u6267\u884c\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**\uff1a**\u4fe1\u606f\u7f3a\u5931**\u3002\u65e0\u652f\u4ed8\u8bb0\u5f55\u6216\u63d0\u53ca\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u7f3a\u5931**\u3002\u65e0\u5bb6\u5ead\u76f8\u5173\u8ba8\u8bba\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u7eaf\u5ea6\u5224\u65ad**\uff1a\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65adA/B\u7c7b\u3002\n*   **\u6b65\u9aa42 - \u8d44\u6e90\u5e95\u5ea7\u5224\u65ad**\uff1a\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65adC/D\u7c7b\u3002\n*   **\u6b65\u9aa43 - \u5fc3\u7406\u5f39\u6027\u5224\u65ad**\uff1a\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad\u3002\n*   **\u7efc\u5408\u5224\u5b9a**\uff1a**\u4fe1\u606f\u4e25\u91cd\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5b8c\u6210ABCD\u5206\u7c7b\u3002**\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u7cbe\u786e\u5339\u914d**\u3002\n*   **\u503e\u5411\u6027\u63a8\u6d4b**\uff1a\u53d1\u8a00\u5185\u5bb9\u9ad8\u5ea6\u96c6\u4e2d\u4e8e\u73ed\u7ea7\u4e8b\u52a1\u534f\u8c03\u3001\u4f5c\u4e1a/\u70b9\u8bc4\u63d0\u9192\u3001\u6280\u672f\u7b54\u7591\uff0c**\u6781\u53ef\u80fd\u4e3a\u73ed\u7ea7\u52a9\u6559\u3001\u73ed\u957f\u6216\u9ad8\u5ea6\u6d3b\u8dc3\u7684\u5b66\u5458\u5fd7\u613f\u8005**\uff0c\u800c\u975e\u5178\u578b\u4ed8\u8d39\u5b66\u5458\u3002\u884c\u4e3a\u6a21\u5f0f\u63a5\u8fd1**T7 \u793e\u7fa4\u4f9d\u8d56\u8005\uff08\u7ec4\u7ec7\u8005\u53d8\u4f53\uff09** \u6216 **T8 \u8d44\u6e90\u63a2\u7d22\u8005**\uff0c\u4f46\u7f3a\u4e4f\u5176\u6838\u5fc3\u7684\u201c\u4f9d\u8d56\u201d\u6216\u201c\u63a2\u7d22\u201d\u52a8\u673a\u8bc1\u636e\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u6574\u4f53\u98ce\u9669**\uff1a**\u6781\u4f4e**\uff08\u57fa\u4e8e\u5176\u626e\u6f14\u7684\u201c\u670d\u52a1\u8005\u201d\u89d2\u8272\uff09\u3002\n*   **\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a\u65e0\u4e2a\u4eba\u6548\u679c\u8bc9\u6c42\u3002\n    2.  **\u65f6\u95f4\u7cbe\u529b\u51b2\u7a81**\uff1a\u672a\u89c1\u62b1\u6028\uff0c\u53cd\u800c\u6295\u5165\u5927\u91cf\u65f6\u95f4\u7ba1\u7406\u793e\u7fa4\u3002\n    3.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u4fe1\u606f\u7f3a\u5931**\u3002\n    4.  **\u4ea7\u54c1\u670d\u52a1\u4e0d\u7b26**\uff1a\u65e0\u6295\u8bc9\uff0c\u4e14\u534f\u52a9\u89e3\u51b3\u4ed6\u4eba\u95ee\u9898\u3002\n    5.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u4fe1\u606f\u7f3a\u5931**\u3002\n    6.  **\u7ade\u54c1\u5bf9\u6bd4/\u8d1f\u9762\u8206\u60c5**\uff1a\u65e0\u8ff9
