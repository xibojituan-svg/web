    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u848b\u5fae (UID: 676578230) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-02-03 \u81f3 2026-02-14 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u8001\u5b8b\u5c0f\u53cb(\u5b8b\u6d9b)\u3001\u5c0f\u5976\u6a58\u5440(\u90ed\u5c11\u5a55)\u3001\u8bed\u7b5d\u73ed\u73ed/\u8bed\u7b5d\u513f(\u675c\u82b3) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6500\u767b\u8ba1\u5212\u8fdb\u9636\u7248\u8bfe\u7a0b |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u63a8\u6d4b\u4e3a\u5168\u6b3e\u6216\u5e38\u89c4\u5206\u671f\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u9891\u7e41\u63d0\u53ca\u5e74\u5e95\u5fd9\u3001\u51fa\u5dee\u3001\u50ac\u6b3e\u3001\u5e94\u916c\uff0c\u9700\u201c\u75af\u72c2\u8865\u8bfe\u201d\uff0c\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\u4e14\u4e0d\u53ef\u63a7\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\uff0c\u5b58\u5728\u98ce\u9669\u76f2\u533a\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u5bf9\u8bdd\u5185\u5bb9\u6df1\u5165\uff0c\u6d89\u53ca\u6280\u672f\u63a2\u8ba8\u3001\u4f5c\u4e1a\u63d0\u4ea4\u3001\u60c5\u611f\u4e92\u52a8\uff0c\u4fe1\u606f\u7ef4\u5ea6\u4e30\u5bcc\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u4e13\u4e1a\u7cbe\u8fdb\u800c\u6765\uff0c\u5173\u6ce8\u6280\u672f\u7ec6\u8282\u4e0e\u4f5c\u54c1\u8d28\u91cf\uff0c\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u6709\u6df1\u5ea6\u601d\u8003\u548c\u63a2\u7d22\u6b32\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u8bb0\u5f97\u591a\u4eba\u53e0\u58f0\u7528\u8fd9\u4e2a\u5440\u201d\u3001\u201c\u6211\u8bd5\u8bd5\u54c8\u73ed\u73ed\uff01\u6211\u7406\u89e3\u4f60\u8bf4\u7684\uff0c\u6211\u73b0\u5728\u5c31\u662f\u4e09\u4e2a\u4eba\u8bf4\u7684\u8981\u505a\u5f02\u53e3\u540c\u58f0\u201d\u3001\u201c\u8ba9\u6211\u7814\u7a76\u4e0b\uff0c\u7814\u7a76\u4e0d\u51fa\u6765\uff0c\u6211\u4f1a\u627e\u4f60\u8ba4\u8f93\u7684\u3002\u5148\u4e0d\u6002\uff0c\u5b9e\u5728\u4e0d\u884c\u8be5\u8ba4\u5c31\u5f97\u8ba4\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u5df2\u8d2d\u4e70\u8fdb\u9636\u8bfe\u7a0b\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\uff0c\u4f46\u672a\u5c55\u793a\u9ad8\u6d88\u8d39\u80fd\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 **\u6838\u5fc3\u77ed\u677f**\u3002\u5de5\u4f5c\u7e41\u5fd9\uff08\u5e74\u5e95\u50ac\u6b3e\u3001\u51fa\u5dee\uff09\uff0c\u9891\u7e41\u8bf7\u5047\u3001\u8865\u8bfe\uff0c\u5b66\u4e60\u65f6\u95f4\u88ab\u4e25\u91cd\u6324\u538b\uff0c\u4f46\u4ecd\u5728\u52aa\u529b\u575a\u6301\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\uff0c\u9700\u8b66\u60d5\u6f5c\u5728\u98ce\u9669\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9047\u5230\u6280\u672f\u96be\u9898\uff08\u5982\u5f02\u53e3\u540c\u58f0\u3001\u6ce2\u5f62\u7ebf\uff09\u4e3b\u52a8\u7814\u7a76\u3001\u8bf7\u6559\uff0c\u867d\u6709\u201c\u5185\u8017\u201d\u81ea\u5632\uff0c\u4f46\u884c\u52a8\u79ef\u6781\uff0c\u4e0d\u62b1\u6028\u4e0d\u653e\u5f03\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8ba9\u6211\u7814\u7a76\u4e0b\uff0c\u7814\u7a76\u4e0d\u51fa\u6765\uff0c\u6211\u4f1a\u627e\u4f60\u8ba4\u8f93\u7684\u3002\u5148\u4e0d\u6002\uff0c\u5b9e\u5728\u4e0d\u884c\u8be5\u8ba4\u5c31\u5f97\u8ba4\u201d\u3001\u201c\u627f\u63a5\u4e86\u5c31\u8981\u505a\u5b8c\u3002\u8ddf\u8f9b\u82e6\u4e0d\u642d\u8fb9\u54c8\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42 / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u9ad8\u5f3a\u5ea6\u3001\u7a0b\u5f0f\u5316\u5de5\u4f5c\uff08\u201c\u5929\u5929\u548c\u4eba\u6253\u4ea4\u9053\uff0c\u75b2\u4e86\u201d\uff09\u5e26\u6765\u7684\u60c5\u611f\u758f\u79bb\u4e0e\u4ef7\u503c\u611f\u7f3a\u5931\u3002\u4ed6\u6e34\u671b\u5728**\u6709\u5171\u540c\u76ee\u6807\u7684\u793e\u7fa4\u4e2d\u83b7\u5f97\u6df1\u5ea6\u8fde\u63a5\u3001\u88ab\u770b\u89c1\u3001\u88ab\u8ba4\u53ef**\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u8d4b\u4e88\u5176\u201c\u9760\u8c31\u961f\u53cb\u201d\u4e0e\u201c\u6280\u672f\u6f5c\u529b\u80a1\u201d\u7684\u8eab\u4efd\u8ba4\u540c**\u3002\u63d0\u4f9b\u9ad8\u8d28\u91cf\u7684\u793e\u7fa4\u5f52\u5c5e\u611f\u3001\u6280\u672f\u5c42\u9762\u7684\u6df1\u5ea6\u8ba4\u53ef\uff0c\u5e76\u5728\u4ed6\u56e0\u5de5\u4f5c\u7e41\u5fd9\u6389\u961f\u65f6\u7ed9\u4e88\u5305\u5bb9\u548c\u9f13\u52b1\uff0c\u8ba9\u4ed6\u611f\u53d7\u5230\u201c\u88ab\u9700\u8981\u201d\u548c\u201c\u88ab\u5c0a\u91cd\u201d\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u52a8\u673a\u7eaf\u5ea6\u9ad8\uff0c\u4f46\u65f6\u95f4\u8d44\u6e90\u5b58\u5728\u77ed\u677f\uff0c\u9700\u91cd\u70b9\u7ef4\u62a4) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u6838\u5fc3\u7279\u5f81\uff1a\u91cd\u611f\u60c5\u3001\u6709\u8d23\u4efb\u5fc3\u3001\u6280\u672f\u94bb\u7814\u3001\u4e0d\u5f20\u626c\u4f46\u6e34\u671b\u88ab\u770b\u89c1) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u7edd\u5883\u7b49\u5371\u9669\u4fe1\u53f7\u3002**\u4f46\u5bb6\u5ead\u652f\u6301\u5ea6\u672a\u77e5\uff0c\u9700\u5728\u540e\u7eed\u670d\u52a1\u4e2d\u6e29\u548c\u63a2\u67e5\u3002**\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u672a\u63d0\u53ca\u5bb6\u5ead\uff0c\u4f46\u4fe1\u606f\u7f3a\u5931\uff0c\u9700\u4fdd\u6301\u89c2\u5bdf\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u4e2d** | **\u5de5\u4f5c\u7e41\u5fd9\u5bfc\u81f4\u8bfe\u7a0b\u4e25\u91cd\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u8865\u4e0d\u5b8c\u201d\u7684\u7126\u8651\u548c\u81ea\u8d23\uff0c\u6700\u7ec8\u53ef\u80fd\u56e0\u201c\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\u201d\u800c\u653e\u5f03\u3002** |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u5230\u95ee\u9898\u503e\u5411\u4e8e\u89e3\u51b3\u800c\u975e\u62b1\u6028\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u5f53\u524d\u5173\u6ce8\u70b9\u5728\u4e8e\u6280\u672f\u7cbe\u8fdb\u548c\u793e\u7fa4\u53c2\u4e0e\uff0c\u800c\u975e\u77ed\u671f\u53d8\u73b0\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-4\u5468**\u3002\u6b64\u65f6\u8bfe\u7a0b\u96be\u5ea6\u548c\u4f5c\u4e1a\u91cf\u589e\u52a0\uff0c\u82e5\u5176\u5de5\u4f5c\u6301\u7eed\u7e41\u5fd9\uff0c\u6781\u6613\u56e0\u201c\u65f6\u95f4\u7cbe\u529b\u4e25\u91cd\u4e0d\u5339\u914d\u201d\u800c\u4ea7\u751f\u5f3a\u70c8\u7684\u632b\u8d25\u611f\u548c\u653e\u5f03\u5ff5\u5934\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u848b\u5fae\uff0c\u770b\u5230\u4f60\u5de5\u4f5c\u8fd9\u4e48\u5fd9\u8fd8\u575a\u6301\u5b66\u4e60\u548c\u5b8c\u6210\u5c0f\u7ec4\u4efb\u52a1\uff0c\u771f\u7684\u5f88\u4f69\u670d\u4f60\u7684\u8d23\u4efb\u5fc3\u548c\u884c\u52a8\u529b\u3002\u54b1\u4eec\u8fd9\u4e2a\u73ed\u5c31\u9700\u8981\u4f60\u8fd9\u6837\u9760\u8c31\u7684\u2018\u6280\u672f\u62c5\u5f53\u2019\u3002\u522b\u62c5\u5fc3\u8fdb\u5ea6\uff0c\u54b1\u4eec\u7684\u8bfe\u7a0b\u56de\u653e\u968f\u65f6\u80fd\u770b\uff0c\u5c0f\u7ec4\u4efb\u52a1\u4e5f\u8bb2\u7a76\u56e2\u961f\u534f\u4f5c\uff0c\u4f60\u6709\u7a7a\u7684\u65f6\u5019\u6df1\u5ea6\u53c2\u4e0e\uff0c\u5fd9\u7684\u65f6\u5019\u6253\u4e2a\u62db\u547c\uff0c\u54b1\u4eec\u4e00\u8d77\u628a\u4f5c\u54c1\u6253\u78e8\u597d\u3002\u4f60\u53ef\u662f\u54b1\u4eec\u7ec4\u7684\u2018\u5b9a\u6d77\u795e\u9488\u2019\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u3002\u5339\u914d\u5176\u94bb\u7814\u6280\u672f\u7684\u9700\u6c42\uff0c\u63d0\u4f9b\u6df1\u5ea6\u5185\u5bb9\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u5f39\u6027\u65f6\u95f4\u652f\u6301\u5305**\u3011\u3002\u660e\u786e\u544a\u77e5\u8865\u8bfe\u673a\u5236\u3001\u4f5c\u4e1a\u5f39\u6027\u63d0\u4ea4\u653f\u7b56\uff0c\u51cf\u8f7b\u5176\u65f6\u95f4\u7126\u8651\u3002\u3010**\u793e\u7fa4\u4ef7\u503c\u8d4b\u80fd\u5305**\u3011\u3002\u53ef\u8003\u8651\u8d4b\u4e88\u5176\u5c0f\u7ec4\u957f\u6216\u201c\u6280\u672f\u987e\u95ee\u201d\u7b49\u975e\u6b63\u5f0f\u89d2\u8272\uff0c\u589e\u5f3a\u5176\u5f52\u5c5e\u611f\u548c\u88ab\u5c0a\u91cd\u611f\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u7528\u50f5\u5316\u7684\u8003\u52e4\u548c\u622a\u6b62\u65e5\u671f\u65bd\u538b**\u30022. \u5ffd\u89c6\u5176\u56e0\u5de5\u4f5c\u4ea7\u751f\u7684\u8bf7\u5047\u548c\u5ef6\u8fdf\uff0c\u51b7\u6f20\u56de\u590d\u30023. \u53ea\u8fdb\u884c\u6cdb\u6cdb\u7684\u8868\u626c\uff0c\u4e0d\u5bf9\u5176\u5177\u4f53\u7684\u6280\u672f\u8fdb\u6b65\u548c\u8d1f\u8d23\u6001\u5ea6\u7ed9\u4e88**\u6709\u6df1\u5ea6\u7684\u8ba4\u53ef**\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u63a8\u4ecb\u4e0e**\u6280\u672f\u6df1\u5ea6\u63d0\u5347\u6216\u9ad8\u9636\u793e\u7fa4\u8eab\u4efd\uff08\u5982\u79c1\u8463\u4f1a\uff09** \u76f8\u5173\u7684\u8bfe\u7a0b\uff0c\u4e25\u7981\u63a8\u9500\u201c\u5feb\u901f\u53d8\u73b0\u201d\u7c7b\u8bfe\u7a0b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5e73\u65f6\u751f\u6d3b\u4e2d\u5929\u5929\u548c\u4eba\u6253\u4ea4\u9053\uff0c\u75b2\u4e86\u3002\u53ea\u60f3\u51e0\u4e2a\u8001\u670b\u53cb\u4e00\u8d77\u5c31\u89c9\u5f97\u633a\u597d\u201d\n2. > \u201c\u8ba9\u6211\u7814\u7a76\u4e0b\uff0c\u7814\u7a76\u4e0d\u51fa\u6765\uff0c\u6211\u4f1a\u627e\u4f60\u8ba4\u8f93\u7684\u3002\u5148\u4e0d\u6002\uff0c\u5b9e\u5728\u4e0d\u884c\u8be5\u8ba4\u5c31\u5f97\u8ba4\u201d\n3. > \u201c\u627f\u63a5\u4e86\u5c31\u8981\u505a\u5b8c\u3002\u8ddf\u8f9b\u82e6\u4e0d\u642d\u8fb9\u54c8\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u5728\u75b2\u60eb\u7684\u793e\u4ea4\u5de5\u4f5c\u4e2d\uff0c\u627e\u5230\u4e00\u4e2a\u80fd\u83b7\u5f97\u6280\u672f\u8ba4\u53ef\u548c\u6df1\u5ea6\u8fde\u63a5\u7684\u201c\u9760\u8c31\u201d\u793e\u7fa4**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u5f39\u6027\u7684\u65f6\u95f4\u652f\u6301+\u8d4b\u4e88\u5176\u793e\u7fa4\u6838\u5fc3\u6210\u5458\u7684\u8eab\u4efd\u4ef7\u503c\u611f**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u793e\u4ea4/\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5f39\u6027\u65f6\u95f4\u652f\u6301\u5305+\u793e\u7fa4\u4ef7\u503c\u8d4b\u80fd\u5305\"}\n```";
