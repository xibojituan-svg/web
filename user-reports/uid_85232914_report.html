        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u7a0b\u5c0f\u8d24 (UID: 85232914) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-02-07 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u68a6\u5c0f\u51bd(\u5415\u4e91\u948a)\u3001\u706b\u5c0f\u7089(\u5f20\u5a1c)\u3001\u4e91\u5fa1\u4e36(\u5085\u5b50\u8015)\u3001\u8d1d\u5854beata(\u8d75\u8d1d\u797a) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u5df2\u8d2d\u77ed\u89c6\u9891\u8bfe\uff08L2\u9636\u6bb5\uff09\u3001\u77ed\u5267\u8bfe\u3001\u6f2b\u5267L3\u8bfe\u7a0b\uff08\u5df2\u62a5\u540d\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u4fe1\u606f\u4e0d\u8db3\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u8d44\u91d1\u6765\u6e90\u6216\u4ef7\u683c\u654f\u611f\u5ea6\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u591a\u6b21\u63d0\u53ca\u201c\u5355\u4f4d\u5fd9\u6b7b\u201d\u3001\u201c\u5206\u8eab\u4e4f\u672f\u201d\u3001\u201c\u6ca1\u65f6\u95f4\u5199\u201d\uff0c\u8868\u660e\u65f6\u95f4\u88ab\u4e3b\u4e1a\u4e25\u91cd\u6324\u538b\uff0c\u5b66\u4e60\u65f6\u95f4\u9700\u201c\u62bd\u7a7a\u634b\u4e00\u634b\u201d\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u4fe1\u606f\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u5173\u952e\u4fe1\u606f\u5982\u8d44\u91d1\u6765\u6e90\u3001\u5bb6\u5ead\u652f\u6301\u3001\u4e3b\u4e1a\u8be6\u60c5\u3001\u6536\u5165\u72b6\u51b5\u3001\u5e74\u9f84\u7b49\u5747\u7f3a\u5931\uff0c\u5224\u65ad\u4e3b\u8981\u57fa\u4e8e\u6709\u9650\u7684\u5b66\u4e60\u884c\u4e3a\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u80fd\u529b\u6210\u957f\u4e0e\u53d8\u73b0\u7ed3\u679c\u6df7\u5408\u9a71\u52a8\u3002\u7528\u6237\u6301\u7eed\u5c1d\u8bd5\u6295\u7a3f\u7b7e\u7ea6\uff08\u201c\u6295\u4e86\u756a\u8304\u201d\u3001\u201c\u7ec8\u5ba1\u6ca1\u8fc7\u201d\uff09\uff0c\u5173\u6ce8\u53d8\u73b0\u8def\u5f84\uff0c\u4f46\u540c\u65f6\u4e5f\u8868\u73b0\u51fa\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u672c\u8eab\u7684\u5174\u8da3\u548c\u94bb\u7814\uff08\u8be2\u95ee\u5177\u4f53\u4fee\u6539\u5efa\u8bae\u3001\u611f\u8c22\u8001\u5e08\u8bb2\u8bfe\u6df1\u5165\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u5c31\u4ee5\u524d\u57fa\u7840\u73ed\u7684\u7684\u65f6\u5019\u5199\u4e86\u4e09\u7bc7\uff0c\u4e09\u65b9\u6ca1\u8fc7\uff0c\u6295\u4e86\u756a\u8304\u201d\n> \u201c\u5927\u5927\uff0c\u6211\u60f3\u95ee\u4e0b\uff0c\u521a\u521a\u7684\u7a3f\u5b50\uff0c\u6709\u54ea\u51e0\u4e2a\u90e8\u5206\u6bd4\u8f83\u6587\u827a\u8303\u8bcd\uff0c\u7136\u540e\u7528\u54ea\u79cd\u63a5\u5730\u6c14\u7684\u8bcd\u4ee3\u66ff\uff0c\u80fd\u5e2e\u6211\u505a\u4e2a\u793a\u8303\u561b\uff1f\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u65e0\u4efb\u4f55\u5173\u4e8e\u652f\u4ed8\u80fd\u529b\u3001\u4ef7\u683c\u654f\u611f\u5ea6\u7684\u8ba8\u8bba\u3002**\u98ce\u9669\uff1a\u4fe1\u606f\u9ed1\u6d1e**\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u2b07\u4f4e** \u2014 \u7528\u6237\u591a\u6b21\u660e\u786e\u8868\u793a\u201c\u4e00\u76f4\u6ca1\u65f6\u95f4\u5199\u201d\u3001\u201c\u90fd\u5728\u505a\u77ed\u89c6\u9891\u2026\u201d\u3001\u201c\u5206\u8eab\u4e4f\u672f\u201d\u3001\u201c\u5355\u4f4d\u5fd9\u6b7b\u201d\u3002\u4e3b\u4e1a\uff08\u77ed\u89c6\u9891\u76f8\u5173\u5de5\u4f5c\uff1f\uff09\u5df2\u5360\u7528\u5927\u91cf\u7cbe\u529b\uff0c\u5bfc\u81f4\u8bfe\u7a0b\u5b66\u4e60\uff08\u77ed\u5267\u8bfe\uff09\u88ab\u6401\u7f6e\u3002\u8fd9\u662f\u6700\u660e\u663e\u7684\u77ed\u677f\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u65e0\u76f8\u5173\u4fe1\u606f\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u6295\u7a3f\u5931\u8d25\uff08\u201c\u7ec8\u5ba1\u5e94\u8be5\u6ca1\u8fc7\u201d\uff09\uff0c\u7528\u6237\u672a\u8868\u73b0\u51fa\u5d29\u6e83\u6216\u62b1\u6028\uff0c\u800c\u662f\u5e73\u9759\u63a5\u53d7\u5e76\u8ba1\u5212\u201c\u518d\u6295\u4e00\u6b21\u5427\u201d\u3002\u4e3b\u52a8\u5bfb\u6c42\u5177\u4f53\u4fee\u6539\u5efa\u8bae\uff0c\u884c\u4e3a\u6307\u5411\u89e3\u51b3\u95ee\u9898\u800c\u975e\u60c5\u7eea\u5ba3\u6cc4\u3002\u4e0e\u73ed\u4e3b\u4efb\u4e92\u52a8\u793c\u8c8c\u3001\u79ef\u6781\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u7ec8\u5ba1\u5e94\u8be5\u6ca1\u8fc7\uff0c\u4e00\u76f4\u6ca1\u4fe1\u606f[\u6342\u8138]\u201d\n> \u201c\u6295\u4e86\u4e24\u6b21\u4e86\uff0c\u7b2c\u4e00\u6b21\u521d\u5ba1\u6ca1\u8fc7\uff0c\u8fd9\u6b21\u521d\u5ba1\u8fc7\u4e86\uff0c\u7ec8\u5ba1\u6ca1\u8fc7\uff0c\u518d\u6295\u4e00\u6b21\u5427[\u6342\u8138][\u6342\u8138]\u201d\n> \u201c\u611f\u8c22\u58a8\u5927\u7684\u9f13\u52b1\u548c\u6253\u6c14\u201d\u3001\u201c\u8bb2\u8bfe\u5f88\u6df1\u5165\uff0c\u4e5f\u6709\u62d3\u5c55\uff0c\u80fd\u591f\u5b66\u5230\u5f88\u591a\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 (\u6e34\u671b\u6210\u5c31\u4e0e\u8ba4\u53ef)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5728\u77ed\u89c6\u9891/\u77ed\u5267\u521b\u4f5c\u9886\u57df\u5bfb\u6c42\u4e13\u4e1a\u8ba4\u53ef\u548c\u804c\u4e1a\u7a81\u7834\u3002\u4ed6\u6295\u5165\u65f6\u95f4\u5b66\u4e60\u3001\u53cd\u590d\u6295\u7a3f\uff0c\u6838\u5fc3\u8bc9\u6c42\u662f\u201c\u4f5c\u54c1\u88ab\u5e02\u573a/\u5e73\u53f0\u8ba4\u53ef\u201d\uff08\u8fc7\u5ba1\u3001\u7b7e\u7ea6\uff09\uff0c\u4ee5\u6b64\u8bc1\u660e\u81ea\u5df1\u7684\u80fd\u529b\u548c\u4ef7\u503c\uff0c\u83b7\u5f97\u804c\u4e1a\u6210\u5c31\u611f\u548c\u5c0a\u91cd\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u5c42\u9762\u7684\u6df1\u5ea6\u8ba4\u53ef\u4e0e\u5177\u4f53\u6307\u5bfc**\u3002\u4ed6\u4e0d\u9700\u8981\u6cdb\u6cdb\u7684\u5b89\u6170\uff0c\u800c\u662f\u9700\u8981\u50cf\u201c\u58a8\u5927\u201d\u8fd9\u6837\u7684\u4e13\u4e1a\u4eba\u58eb\u7ed9\u4e88\u5177\u4f53\u3001\u6df1\u5165\u7684\u4fee\u6539\u5efa\u8bae\u548c\u9f13\u52b1\uff08\u201c\u5f97\u529b\u5f1f\u5b50\u201d\u3001\u201c\u4eb2\u70b9\u57f9\u517b\u201d\uff09\uff0c\u8fd9\u80fd\u6781\u5927\u6ee1\u8db3\u5176\u5c0a\u91cd\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b (\u6210\u957f\u6295\u8d44\u578b)** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u578b (\u6df7\u5408 T2 \u4f4e\u8c03\u5b9e\u5e72\u7279\u8d28)** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u5bb6\u5ead\u53cd\u5bf9\u3001\u751f\u5b58\u5371\u673a\u7b49\u7ea2\u7ebf\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u5f53\u524d\u65e0\u8ff9\u8c61\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u4e2d\u9ad8** | **\u8fd9\u662f\u6700\u5927\u98ce\u9669\u70b9\u3002** \u4e3b\u4e1a\u7e41\u5fd9\u5bfc\u81f4\u8bfe\u7a0b\u79ef\u538b\uff08\u201c\u77ed\u5267\u8bfe\u8bf4\u5b9e\u8bdd\u57fa\u672c\u6ca1\u600e\u4e48\u8ba4\u771f\u5b66\u201d\uff09\uff0c\u82e5\u540e\u7eedL3\u8bfe\u7a0b\u5f3a\u5ea6\u66f4\u5927\uff0c\u53ef\u80fd\u56e0\u65f6\u95f4\u7cbe\u529b\u65e0\u6cd5\u517c\u987e\u800c\u4ea7\u751f\u201c\u94b1\u767d\u82b1\u4e86\u201d\u7684\u632b\u8d25\u611f\u548c\u9000\u8d39\u51b2\u52a8\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u4e0d\u6613\u56e0\u5b66\u4e60\u632b\u6298\u7834\u9632\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u6301\u7eed\u6295\u7a3f\u4f46\u672a\u6210\u529f\uff08\u201c\u4e09\u65b9\u6ca1\u8fc7\u201d\u3001\u201c\u7ec8\u5ba1\u6ca1\u8fc7\u201d\uff09\uff0c\u82e5\u957f\u671f\u65e0\u6cd5\u83b7\u5f97\u6b63\u53cd\u9988\uff08\u7b7e\u7ea6\u3001\u53d8\u73b0\uff09\uff0c\u53ef\u80fd\u8d28\u7591\u8bfe\u7a0b\u4ef7\u503c\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-4\u5468\u540e**\u3002\u5f53L3\u8bfe\u7a0b\u8fdb\u5165\u5b9e\u6218\u9ad8\u5f3a\u5ea6\u9636\u6bb5\uff0c\u4e0e\u4e3b\u4e1a\u65f6\u95f4\u51b2\u7a81\u52a0\u5267\uff0c\u4f5c\u4e1a\u5f00\u59cb\u5927\u91cf\u79ef\u538b\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5c0f\u8d24\uff0c\u770b\u5230\u4f60L2\u9636\u6bb5\u5728\u5fd9\u788c\u4e2d\u4f9d\u7136\u575a\u6301\u521b\u4f5c\u548c\u6295\u7a3f\uff0c\u8fd9\u4efd\u6267\u7740\u975e\u5e38\u96be\u5f97\u3002L3\u7684\u8282\u594f\u4f1a\u66f4\u7d27\u51d1\uff0c\u5185\u5bb9\u4e5f\u66f4\u786c\u6838\u3002\u6211\u77e5\u9053\u4f60\u4e3b\u4e1a\u5f88\u5fd9\uff0c\u54b1\u4eec\u4e0d\u8ffd\u6c42\u901f\u5ea6\uff0c\u8ffd\u6c42\u6bcf\u4e00\u6b65\u7684\u624e\u5b9e\u548c\u7a81\u7834\u3002\u65f6\u95f4\u7ba1\u7406\u4e0a\u6211\u4eec\u53ef\u4ee5\u4e00\u8d77\u89c4\u5212\uff0c\u91cd\u70b9\u662f\u786e\u4fdd\u4f60\u6295\u5165\u7684\u6bcf\u4e00\u5206\u949f\uff0c\u90fd\u80fd\u7528\u5728\u89e3\u51b3\u4f60\u6700\u5173\u5fc3\u7684\u2018\u5982\u4f55\u8ba9\u4f5c\u54c1\u8fc7\u7a3f\u2019\u8fd9\u4e2a\u6838\u5fc3\u95ee\u9898\u4e0a\u3002\u4f60\u662f\u58a8\u5927\u770b\u597d\u7684\u5b66\u5458\uff0c\u4f60\u7684\u6f5c\u529b\u6211\u4eec\u90fd\u6709\u76ee\u5171\u7779\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u4ed6\u9700\u8981\u7684\u662f\u80fd\u76f4\u63a5\u63d0\u5347\u8fc7\u7a3f\u7387\u3001\u89e3\u51b3\u5177\u4f53\u521b\u4f5c\u96be\u9898\u7684\u786c\u6838\u5185\u5bb9\uff0c\u800c\u975e\u5174\u8da3\u542f\u8499\u6216\u793e\u7fa4\u793e\u4ea4\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176**\u65f6\u95f4\u788e\u7247\u5316**\u7684\u77ed\u677f\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u9ad8\u6548\u65f6\u95f4\u89c4\u5212\u4e0e\u788e\u7247\u5316\u5b66\u4e60\u5305\u3011** \u6216 **\u3010\u91cd\u70b9\u96be\u70b9\u7cbe\u8bb2\u56de\u653e\u5305\u3011**\u3002\u9488\u5bf9\u5176**\u5c0a\u91cd\u9700\u6c42**\uff0c\u53ef\u8865\u5145 **\u3010\u5bfc\u5e081v1\u4f5c\u54c1\u8bca\u65ad\u7279\u6743\uff08\u9650\u91cf\uff09\u3011**\uff0c\u63d0\u4f9b\u6df1\u5ea6\u8ba4\u53ef\u548c\u6307\u5bfc\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u522b\u4eba\u90fd\u884c\u4f60\u600e\u4e48\u4e0d\u884c\u201d\u7684\u8bdd\u672f\u65bd\u538b\uff1b\u5ffd\u89c6\u5176\u65f6\u95f4\u7d27\u5f20\u7684\u5ba2\u89c2\u60c5\u51b5\uff0c\u5f3a\u6c42\u540c\u6b65\u5b8c\u6210\u6240\u6709\u4f5c\u4e1a\uff1b\u53ea\u7ed9\u9e21\u6c64\u4e0d\u7ed9\u5177\u4f53\u89e3\u51b3\u65b9\u6848\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u5728\u786e\u8ba4\u5176\u80fd\u5e73\u8861\u597dL3\u8bfe\u7a0b\u4e0e\u4e3b\u4e1a\u4e4b\u524d\uff0c**\u4e25\u7981\u4efb\u4f55\u5347\u5355**\u3002\u5f53\u524d\u6838\u5fc3\u662f\u670d\u52a1\u597d\u5df2\u8d2d\u8bfe\u7a0b\uff0c\u786e\u4fdd\u5b8c\u8bfe\u7387\u548c\u6b63\u53cd\u9988\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u4e00\u76f4\u6ca1\u65f6\u95f4\u5199[\u6342\u8138][\u6342\u8138][\u6342\u8138]\u90fd\u5728\u505a\u77ed\u89c6\u9891\u2026**\u201d \u2014\u2014 **\u8d44\u6e90\u5e95\u5ea7\uff08\u65f6\u95f4\uff09\u77ed\u677f\u7684\u6838\u5fc3\u8bc1\u636e**\n2. > \u201c**\u77ed\u5267\u8bfe\u8bf4\u5b9e\u8bdd\u57fa\u672c\u6ca1\u600e\u4e48\u8ba4\u771f\u5b66\uff0c\u7b49\u6bd5\u4e1a\u4e86\uff0c\u6211\u8981\u8ba4\u771f\u56de\u770b**\u201d \u2014\u2014 **\u65f6\u95f4\u51b2\u7a81\u5bfc\u81f4\u8bfe\u7a0b\u79ef\u538b\uff0c\u5b58\u5728\u5d29\u76d8\u98ce\u9669**\n3. > \u201c**\u7ec8\u5ba1\u5e94\u8be5\u6ca1\u8fc7\uff0c\u4e00\u76f4\u6ca1\u4fe1\u606f[\u6342\u8138]...\u518d\u6295\u4e00\u6b21\u5427**\u201d \u2014\u2014 **\u9ad8\u5fc3\u7406\u5f39\u6027\uff08\u4e0d\u6c14\u9981\uff09\u4e0e\u641e\u94b1\u7ed3\u679c\u578b\uff08T4\uff09\u52a8\u673a\u7684\u6df7\u5408\u4f53\u73b0**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4\u641e\u94b1\u7ed3\u679c\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u6210\u5c31\uff08\u5c0a\u91cd\u9700\u6c42\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5e2e\u52a9\u5176\u8fdb\u884c\u9ad8\u6548\u65f6\u95f4\u89c4\u5212\uff0c\u805a\u7126\u6838\u5fc3\u8fc7\u7a3f\u6280\u80fd\u63d0\u5347\uff0c\u5e76\u63d0\u4f9b\u6df1\u5ea6\u4e13\u4e1a\u8ba4\u53ef\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u578b\", \"maslow_need\": \"\u7b2c\u56db\u5c42\u5c0a\u91cd\u9700\u6c42\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u9ad8\u6548\u65f6\u95f4\u89c4\u5212\u8f85\u52a9\u5305\"}\n```";
