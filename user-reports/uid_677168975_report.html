    <script>
        const markdownText = "# AI\u5199\u4f5c\u8bfe\u5b66\u5458\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n## \u4fe1\u606f\u5145\u8db3\u6027\u8bc4\u4f30\n\u4fe1\u606f\u5145\u8db3\uff0c\u53ef\u8fdb\u884c\u5b8c\u6574\u5206\u6790\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49\u504f\u9ad8)**\n    *   **\u8868\u5c42\u52a8\u673a**\uff1a\u5b66\u4e60AI\u5199\u4f5c\u6280\u5de7\uff0c\u89e3\u51b3\u5f53\u524d\u4f7f\u7528AI\u5de5\u5177\uff08\u661f\u6708\u3001\u767d\u68a6\uff09\u5199\u4f5c\u65f6\u201c\u5927\u7eb2\u7ec6\u7eb2\u6709\u504f\u5dee\u3001\u6765\u56de\u4fee\u6539\u6548\u7387\u4f4e\u201d\u7684\u5177\u4f53\u75db\u70b9\u3002\n    *   **\u6df1\u5c42\u52a8\u673a**\uff1a**\u5bfb\u6c42\u804c\u4e1a\u8f6c\u578b\u4e0e\u6536\u5165\u6765\u6e90**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u516c\u53f8\u5012\u95ed\u4e86\uff0c\u51c6\u5907\u53ef\u4ee5\u7684\u8bdd\u5c31\u5168\u804c\u770b\u770b\u201d\uff0c\u5c06AI\u5199\u4f5c\u89c6\u4e3a\u6f5c\u5728\u7684**\u5168\u804c\u8c0b\u751f\u624b\u6bb5**\u3002\u5174\u8da3\uff08\u770b\u5c0f\u8bf4\u5341\u51e0\u5e74\uff09\u4e0e\u751f\u5b58\u9700\u6c42\u7ed3\u5408\u3002\n    *   **\u4fe1\u53f7\u5f3a\u5ea6**\uff1a\u4e3b\u52a8\u8be2\u95ee\u8bfe\u7a0b\u7ec6\u8282\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u5173\u6ce8\u6295\u7a3f\u6e20\u9053\uff0c\u884c\u52a8\u529b\u5f3a\uff0c\u76ee\u6807\u660e\u786e\u3002\n\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d\u7b49\u504f\u4f4e)**\n    *   **\u7ecf\u6d4e\u8d44\u6e90**\uff1a\u652f\u4ed8\u4e864380\u5143\u65d7\u8230\u73ed\u8d39\u7528\uff0c\u5177\u5907\u6570\u5343\u5143\u7ea7\u522b\u7684\u6559\u80b2\u652f\u4ed8\u80fd\u529b\u3002\u4f46\u7ed3\u5408\u201c\u516c\u53f8\u5012\u95ed\u201d\u7684\u80cc\u666f\uff0c**\u73b0\u91d1\u6d41\u53ef\u80fd\u7d27\u5f20\uff0c\u5bf9\u6295\u8d44\u56de\u62a5\u7684\u671f\u5f85\u548c\u538b\u529b\u8f83\u9ad8**\u3002\n    *   **\u65f6\u95f4\u8d44\u6e90**\uff1a\u8ba1\u5212\u5168\u804c\u6295\u5165\uff0c\u65f6\u95f4\u8d44\u6e90\u770b\u4f3c\u5145\u6c9b\uff0c\u4f46\u9700\u8b66\u60d5\u56e0\u65e0\u7a33\u5b9a\u6536\u5165\u6765\u6e90\u5bfc\u81f4\u7684**\u5b66\u4e60\u7126\u8651\u548c\u6025\u4e8e\u6c42\u6210\u5fc3\u6001**\u3002\n    *   **\u8ba4\u77e5/\u6280\u80fd\u8d44\u6e90**\uff1a\u6709\u957f\u671f\u9605\u8bfb\u4e60\u60ef\uff08\u5c0f\u8bf4\u5341\u51e0\u5e74\uff09\uff0c\u6709\u57fa\u7840\u5199\u4f5c\u7ecf\u9a8c\uff08\u5199\u8fc7\u4e03\u516b\u4e07\u5b57\uff09\uff0c\u5df2\u521d\u6b65\u4f7f\u7528AI\u5de5\u5177\u3002\u5177\u5907\u4e00\u5b9a\u7684\u5b66\u4e60\u57fa\u7840\u548c\u7406\u89e3\u80fd\u529b\u3002\n\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u7b49)**\n    *   **\u4e3b\u52a8\u6027**\uff1a\u9ad8\u3002\u4e3b\u52a8\u63d0\u95ee\uff08\u4e0a\u8bfe\u65b9\u5f0f\u3001\u65f6\u95f4\u3001\u6295\u7a3f\u5e73\u53f0\uff09\u3001\u63d0\u4ea4\u4f5c\u4e1a\u3001\u8ddf\u8fdb\u5151\u6362\u7801\u95ee\u9898\u3002\n    *   **\u8010\u632b\u6027**\uff1a**\u672a\u77e5**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u4f53\u73b0\u9762\u5bf9\u56f0\u96be\u6216\u6279\u8bc4\u65f6\u7684\u53cd\u5e94\u3002\u4f46\u7528\u6237\u66fe\u56e0AI\u8f93\u51fa\u504f\u5dee\u3001\u4fee\u6539\u4f4e\u6548\u800c\u5bfb\u6c42\u5b66\u4e60\uff0c\u6697\u793a\u5bf9\u8fc7\u7a0b\u4e2d\u7684\u632b\u6298\u6709\u4e00\u5b9a\u8ba4\u77e5\u3002\n    *   **\u4f9d\u8d56\u6027**\uff1a\u4e2d\u7b49\u3002\u80fd\u72ec\u7acb\u5b8c\u6210\u4f5c\u4e1a\uff0c\u4f46\u5728\u8def\u5f84\u89c4\u5212\uff08\u201c\u53d1\u5728\u54ea\u91cc\u6bd4\u8f83\u597d\u201d\uff09\u548c\u5de5\u5177\u4f7f\u7528\u4e0a\u8868\u73b0\u51fa\u5bf9\u6307\u5bfc\u7684\u9700\u6c42\u3002\u6210\u4ea4\u540e\u8868\u8fbe\u201c\u4ee5\u540e\u8bf7\u591a\u5173\u7167\u201d\uff0c\u6709\u5bfb\u6c42\u6301\u7eed\u652f\u6301\u7684\u503e\u5411\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u5df2\u652f\u4ed84380\u5143\u65d7\u8230\u73ed\u8d39\u7528\uff0c**\u652f\u4ed8\u5b8c\u6210**\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u804a\u5929\u8bb0\u5f55\u4e2d\u672a\u63d0\u53ca\u914d\u5076\u3001\u7236\u6bcd\u7b49\u5bb6\u5ead\u6210\u5458\uff0c\u51b3\u7b56\u8fc7\u7a0b\u72ec\u7acb\uff0c\u8868\u73b0\u4e3a**\u4e2a\u4eba\u51b3\u7b56**\u3002\n*   **\u6838\u5fc3\u5224\u5b9a**\uff1a\n    *   **\u52a8\u673a\u660e\u786e**\uff08B+\uff09\uff1a\u4e3a\u804c\u4e1a\u8f6c\u578b\u800c\u5b66\u4e60\uff0c\u89e3\u51b3\u5177\u4f53\u6280\u80fd\u75db\u70b9\u3002\n    *   **\u652f\u4ed8\u5b8c\u6210**\uff08A\uff09\uff1a\u5df2\u4ed8\u8d39\u3002\n    *   **\u8d44\u6e90\u4e0e\u98ce\u9669**\uff1a\u5f53\u524d\u5904\u4e8e\u5931\u4e1a\u72b6\u6001\uff0c\u5c06\u8bfe\u7a0b\u89c6\u4e3a\u5168\u804c\u51fa\u8def\uff0c**\u5c5e\u4e8e\u201c\u80cc\u6c34\u4e00\u6218\u201d\u578b\u5b66\u5458**\u3002\u5b66\u4e60\u52a8\u529b\u5f3a\uff0c\u4f46\u7ecf\u6d4e\u538b\u529b\u548c\u6210\u679c\u7126\u8651\u5e76\u5b58\u3002\n    *   **\u5224\u5b9a\u7ed3\u679c**\uff1a**B+\u7c7b\u7528\u6237\uff08\u9ad8\u6f5c\u529b\u9ad8\u538b\u529b\u578b\uff09**\u3002\u5df2\u4ed8\u8d39\uff0c\u52a8\u673a\u5f3a\u70c8\uff0c\u4f46\u751f\u5b58\u538b\u529b\u5927\uff0c\u5bf9\u7ed3\u679c\u671f\u5f85\u9ad8\uff0c\u9700\u91cd\u70b9\u7ef4\u62a4\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b\uff1aT4 \u52a1\u5b9e\u594b\u6597\u8005**\n    *   **\u6838\u5fc3\u7279\u5f81**\uff1a\u76ee\u6807\u660e\u786e\uff0c\u4e3a\u6539\u5584\u751f\u5b58\u72b6\u51b5\u6216\u804c\u4e1a\u53d1\u5c55\u800c\u5b66\u4e60\u3002\u6ce8\u91cd\u5b9e\u7528\u6027\u548c\u7ed3\u679c\uff0c\u884c\u52a8\u529b\u5f3a\u3002\n    *   **\u543b\u5408\u70b9**\uff1a\n        1.  \u76f4\u63a5\u8868\u8fbe\u201c\u516c\u53f8\u5012\u95ed\uff0c\u51c6\u5907\u5168\u804c\u770b\u770b\u201d\uff0c\u5b66\u4e60\u76ee\u7684\u4e0e\u751f\u8ba1\u5f3a\u76f8\u5173\u3002\n        2.  \u5173\u6ce8\u5b9e\u64cd\u7ec6\u8282\uff08\u4e0a\u8bfe\u65b9\u5f0f\u3001\u6295\u7a3f\u5e73\u53f0\u3001\u8bfe\u7a0b\u5dee\u5f02\uff09\u3002\n        3.  \u4e3b\u52a8\u5b8c\u6210\u4f5c\u4e1a\u5e76\u5bfb\u6c42\u53cd\u9988\u3002\n        4.  \u652f\u4ed8\u51b3\u7b56\u7406\u6027\uff0c\u5bf9\u6bd4\u4e86\u57fa\u7840\u73ed\u4e0e\u65d7\u8230\u73ed\u4ef7\u683c\uff08\u201c\u591a\u5b66\u4e00\u4e2a\u77ed\u5267\uff0c\u5dee\u8fd9\u4e48\u591a\uff1f\u201d\uff09\u3002\n    *   **\u504f\u79bb\u70b9**\uff1a\u672a\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u529f\u5229\u6027\u7b97\u8ba1\u6216\u8ba8\u4ef7\u8fd8\u4ef7\uff0c\u66f4\u4fa7\u91cd\u4e8e\u6280\u80fd\u83b7\u53d6\u548c\u5165\u884c\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669\u7b49\u7ea7\uff1a\u4e2d**\n    *   **\u9ad8\u671f\u5f85\u843d\u7a7a\u98ce\u9669 (\u4e3b\u8981\u98ce\u9669)**\uff1a\u7528\u6237\u89c6\u6b64\u4e3a\u5168\u804c\u51fa\u8def\uff0c\u5bf9\u201c\u5b66\u5b8c\u5373\u80fd\u53d8\u73b0\u201d\u6709\u6781\u9ad8\u671f\u5f85\u3002\u82e5\u5b66\u4e60\u4e2d\u671f\u9047\u5230\u74f6\u9888\u6216\u6295\u7a3f\u521d\u671f\u6536\u76ca\u4e0d\u53ca\u9884\u671f\uff0c**\u6781\u6613\u4ea7\u751f\u201c\u88ab\u9a97\u201d\u611f\uff0c\u5f15\u53d1\u9000\u8d39\u6295\u8bc9**\u3002\n    *   **\u6548\u679c\u7126\u8651\u98ce\u9669**\uff1a\u5df2\u6709\u5199\u4f5c\u7ecf\u9a8c\uff0c\u5bf9AI\u5de5\u5177\u7684\u4e0d\u5b8c\u7f8e\u6709\u8ba4\u77e5\uff0c\u82e5\u8bfe\u7a0b\u672a\u80fd\u663e\u8457\u89e3\u51b3\u5176\u201c\u6548\u7387\u4f4e\u3001\u504f\u5dee\u5927\u201d\u7684\u6838\u5fc3\u75db\u70b9\uff0c\u53ef\u80fd\u8d28\u7591\u8bfe\u7a0b\u4ef7\u503c\u3002\n    *   **\u4ea4\u4ed8\u611f\u77e5\u98ce\u9669**\uff1a\u7528\u6237\u5173\u6ce8\u201c\u8d44\u6e90\u201d\uff08\u5de5\u4f5c\u5ba4\u3001\u6295\u7a3f\u6e20\u9053\uff09\uff0c\u82e5\u627f\u8bfa\u7684\u201c\u8d44\u6e90\u6276\u6301\u201d\u3001\u201c\u989d\u5916\u57f9\u8bad\u201d\u611f\u77e5\u4e0d\u5f3a\uff0c\u53ef\u80fd\u8ba4\u4e3a\u627f\u8bfa\u672a\u5151\u73b0\u3002\n    *   **\u9002\u5e94\u6027\u98ce\u9669**\uff1a\u4ece\u6709\u516c\u53f8\u5de5\u4f5c\u7684\u72b6\u6001\u8f6c\u4e3a\u81ea\u7531\u804c\u4e1a/\u5168\u804c\u521b\u4f5c\uff0c\u9700\u8981\u9002\u5e94\u65b0\u7684\u5de5\u4f5c\u6a21\u5f0f\u548c\u6536\u5165\u4e0d\u786e\u5b9a\u6027\uff0c\u8fc7\u7a0b\u4e2d\u53ef\u80fd\u4ea7\u751f\u52a8\u6447\u3002\n    *   **\u4f4e\u98ce\u9669\u9879**\uff1a\u7ecf\u6d4e\u80fd\u529b\uff08\u5df2\u4ed8\u6b3e\uff09\u3001\u51b3\u7b56\u7ea0\u7eb7\uff08\u4e2a\u4eba\u51b3\u7b56\uff09\u3001\u5065\u5eb7\u95ee\u9898\u3001\u4f26\u7406\u95ee\u9898\u5728\u8bb0\u5f55\u4e2d\u672a\u4f53\u73b0\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u9500\u552e\u8bdd\u672f**\uff1a\u5b58\u5728\u4e00\u5b9a\u7a0b\u5ea6\u7684**\u6536\u76ca\u5f15\u5bfc\u4e0e\u524d\u666f\u63cf\u7ed8**\uff08\u5982\u201c\u7761\u540e\u6536\u76ca\u201d\u3001\u201c\u4e00\u6b21\u5236\u4f5c\u957f\u671f\u6536\u76ca\u201d\u3001\u201c\u6536\u76ca\u5feb\u4e94\u5343\u201d\uff09\uff0c\u4f46\u672a\u53d1\u73b0\u660e\u786e\u3001\u5177\u4f53\u7684\u4fdd\u6536\u5165\u627f\u8bfa\u3002\n*   **\u8d44\u6e90\u627f\u8bfa**\uff1a\u9500\u552e\u63d0\u53ca\u201c\u6709\u81ea\u5df1\u7684\u5de5\u4f5c\u5ba4\uff0c\u4f60\u52a0\u5165\u8fdb\u6765\u540e\uff0c\u6240\u6709\u7684\u8d44\u6e90\u90fd\u5171\u4eab\u7ed9\u4f60\uff0c\u800c\u4e14\u8fd8\u7ed9\u4f60\u989d\u5916\u7684\u57f9\u8bad\u201d\uff0c**\u6b64\u5c5e\u5916\u90e8\u8d44\u6e90\u627f\u8bfa\uff0c\u9700\u540e\u7eed\u73ed\u4e3b\u4efb\u8ddf\u8fdb\u843d\u5b9e\uff0c\u5426\u5219\u6613\u5f15\u53d1\u7ea0\u7eb7**\u3002\n*   **\u538b\u529b\u903c\u5355**\uff1a\u672a\u5728\u8bb0\u5f55\u4e2d\u53d1\u73b0\u660e\u663e\u7684\u9650\u65f6\u6298\u6263\u3001\u540d\u989d\u7d27\u5f20\u7b49\u9ad8\u538b\u903c\u5355\u8bdd\u672f\uff0c\u6210\u4ea4\u8fc7\u7a0b\u76f8\u5bf9\u5e73\u987a\u3002\n*   **\u603b\u4f53\u8bc4\u4ef7**\uff1a\u9500\u552e\u6d41\u7a0b\u57fa\u672c\u5408\u89c4\uff0c\u4f46**\u5bf9\u201c\u8d44\u6e90\u6276\u6301\u201d\u7684\u627f\u8bfa\u9700\u5728\u670d\u52a1\u671f\u4e88\u4ee5\u660e\u786e\u548c\u843d\u5b9e**\uff0c\u8fd9\u662f\u6f5c\u5728\u7684\u5ba2\u8bc9\u70b9\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6838\u5fc3\u7b56\u7565**\uff1a**\u201c\u964d\u4f4e\u9884\u671f\uff0c\u592f\u5b9e\u8fc7\u7a0b\uff0c\u53ca\u65f6\u53cd\u9988\uff0c\u5c55\u793a\u8def\u5f84\u201d**\u3002\u91cd\u70b9\u7ba1\u7406\u5176\u201c\u6025\u4e8e\u53d8\u73b0\u201d\u7684\u7126\u8651\uff0c\u5c06\u5176\u6ce8\u610f\u529b\u5f15\u5bfc\u5230\u6280\u80fd\u79ef\u7d2f\u548c\u6d41\u7a0b\u638c\u63e1\u4e0a\u3002\n*   **\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u5f00\u8425\u6df1\u5ea6\u6c9f\u901a**\uff1a\u7acb\u5373\u8fdb\u884c\u4e00\u5bf9\u4e00\u6c9f\u901a\uff0c\u6df1\u5165\u4e86\u89e3\u5176\u8fc7\u5f80\u5199\u4f5c\u7ecf\u9a8c\u3001\u5168\u804c\u6295\u5165\u8ba1\u5212\u3001\u7ecf\u6d4e\u9884\u671f\u3002**\u5766\u8bda\u544a\u77e5\u884c\u4e1a\u5e73\u5747\u53d8\u73b0\u5468\u671f\u548c\u6536\u5165\u6ce2\u52a8\u6027**\uff0c\u5efa\u7acb\u5408\u7406\u9884\u671f\u3002\n    2.  **\u5f3a\u5316\u8fc7\u7a0b\u6fc0\u52b1**\uff1a\u9488\u5bf9\u5176\u201c\u52a1\u5b9e\u201d\u7279\u70b9\uff0c\u591a\u7ed9\u4e88\u5176\u4f5c\u4e1a\u3001\u4e60\u4f5c\u7684\u5177\u4f53\u3001\u6b63\u5411\u53cd\u9988\uff0c\u5f3a\u8c03\u5176\u76f8\u5bf9\u4e8e\u5176\u4ed6\u65b0\u624b\u7684\u4f18\u52bf\uff08\u6709\u7ecf\u9a8c\u3001\u6709\u57fa\u7840\uff09\uff0c\u5efa\u7acb\u5b66\u4e60\u4fe1\u5fc3\u3002\n    3.  **\u8d44\u6e90\u5bf9\u63a5\u53ef\u89c6\u5316**\uff1a\u5c3d\u5feb\u5c06\u5176\u5f15\u5165\u9500\u552e\u627f\u8bfa\u7684\u201c\u5de5\u4f5c\u5ba4\u65b0\u624b\u6751\u201d\uff0c\u5e76\u660e\u786e\u8d44\u6e90\u5bf9\u63a5\u4eba\u3001\u6295\u7a3f\u6e20\u9053\u7684\u51c6\u5165\u6807\u51c6\u548c\u6d41\u7a0b\uff0c\u8ba9\u201c\u8d44\u6e90\u6276\u6301\u201d\u4ece\u627f\u8bfa\u53d8\u4e3a\u53ef\u611f\u77e5\u7684\u670d\u52a1\u3002\n    4.  **\u98ce\u9669\u9884\u8b66\u4e0e\u652f\u6301**\uff1a\u63d0\u524d\u9884\u8b66\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u53ef\u80fd\u9047\u5230\u7684\u74f6\u9888\uff08\u5982\u521b\u610f\u67af\u7aed\u3001\u6295\u7a3f\u88ab\u62d2\uff09\uff0c\u5e76\u544a\u77e5\u73ed\u4e3b\u4efb\u548c\u8f85\u5bfc\u8001\u5e08\u7684\u652f\u6301\u65b9\u6848\uff0c\u4f20\u9012\u201c\u4f60\u4e0d\u662f\u4e00\u4e2a\u4eba\u5728\u6218\u6597\u201d\u7684\u4fe1\u53f7\u3002\n    5.  **\u804c\u4e1a\u5316\u5f15\u5bfc**\uff1a\u5c06\u5176\u201c\u5168\u804c\u201d\u610f\u613f\u5f15\u5bfc\u4e3a\u201c\u4ee5\u4e13\u4e1a\u521b\u4f5c\u8005\u6807\u51c6\u8981\u6c42\u81ea\u5df1\u201d\uff0c\u5f3a\u8c03\u6301\u7eed\u5b66\u4e60\u3001\u79ef\u7d2f\u4f5c\u54c1\u96c6\u7684\u91cd\u8981\u6027\uff0c\u800c\u4e0d\u4ec5\u4ec5\u662f\u5355\u7bc7\u7a3f\u8d39\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**\uff1a\n    *   \u7528\u6237\u5df2\u9009\u62e9**\u65d7\u8230\u73ed\uff08\u77ed\u6587+\u77ed\u5267\u5267\u672c\uff09**\uff0c\u7b26\u5408\u5176\u5e0c\u671b\u5168\u9762\u5165\u884c\u3001\u62d3\u5bbd\u53d8\u73b0\u6e20\u9053\u7684\u9700\u6c42\u3002\n    *   \u540e\u7eed\u53ef\u91cd\u70b9\u5173\u6ce8\u5176\u5728**\u77ed\u5267\u5267\u672c**\u65b9\u5411\u7684\u5b66\u4e60\u8fdb\u5c55\uff0c\u56e0\u5176\u53d8\u73b0\u60f3\u8c61\u7a7a\u95f4\u66f4\u5927\uff0c\u53ef\u80fd\u66f4\u5951\u5408\u5176\u5168\u804c\u53d1\u5c55\u7684\u76ee\u6807\u3002\n    *   \u53ef\u63a8\u8350\u4e0e**\u6709\u58f0\u4e66\u6539\u7f16\u3001\u591a\u5e73\u53f0\u5206\u53d1**\u76f8\u5173\u7684\u8fdb\u9636\u5185\u5bb9\u6216\u8d44\u6e90\uff0c\u6ee1\u8db3\u5176\u201c\u4e00\u7a3f\u591a\u5403\u201d\u7684\u5174\u8da3\u70b9\u3002\n\n{\"core_type\": \"T4 \u52a1\u5b9e\u594b\u6597\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u751f\u5b58/\u5c0a\u91cd\", \"target_product_line\": \"AI\u5199\u4f5c\u65d7\u8230\u73ed\uff08\u77ed\u6587+\u77ed\u5267\uff09\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}";
