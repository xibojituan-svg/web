    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n> **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4e2d\u7f3a\u5931\u5173\u4e8e**\u652f\u4ed8\u80fd\u529b\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u5177\u4f53\u5de5\u4f5c\u4e0e\u65f6\u95f4\u5b89\u6392**\u7684\u5173\u952e\u4fe1\u606f\uff0c\u5bfc\u81f4\u5bf9\u8d44\u6e90\u5e95\u5ea7\u3001\u652f\u4ed8\u94fe\u3001\u5bb6\u5ead\u652f\u6301\u5ea6\u7684\u5224\u65ad\u5b58\u5728\u63a8\u6d4b\u6210\u5206\u3002\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 62632625 / \u6635\u79f0\uff1a\u5927\u98de |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u82b1\u6c14\u88ad\u4eba6/\u7c7d\u83f2(\u5b8b\u6653\u78ca) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u7cbe\u82f1\u7248\u8bfe\u7a0b\uff08\u5177\u4f53\u4ef7\u683c\u672a\u77e5\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u7f3a\u5931**\u3002\u63a8\u6d4b\u4e3a\u5168\u6b3e\u5145\u88d5\uff08\u57fa\u4e8e\u4e00\u7ea7\u6ce8\u518c\u5efa\u7b51\u5e08\u804c\u4e1a\u80cc\u666f\uff09\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u7f3a\u5931**\u3002\u81ea\u79f0\u201c\u4e0a\u73ed\u65cf\u201d\uff0c\u540e\u900f\u9732\u4e3a\u4e00\u7ea7\u6ce8\u518c\u5efa\u7b51\u5e08\uff0c\u76ee\u524d\u201c\u4e0d\u50cf\u4e4b\u524d\u90a3\u4e48\u5fd9\u4e86\uff0c\u6709\u65f6\u95f4\u201d\u3002\u63a8\u6d4b\u4e3a**\u788e\u7247\u5316\u62fc\u51d1**\uff08\u5229\u7528\u4e1a\u4f59\u65f6\u95f4\uff09\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\u3002\u672a\u63d0\u53ca\u5bb6\u5ead\uff0c\u4f46\u63d0\u5230\u201c\u7ed9\u5bb6\u91cc\u5c0f\u670b\u53cb\u8bfb\u6545\u4e8b\u201d\uff0c\u63a8\u6d4b\u4e3a**\u5df2\u5a5a\u5df2\u80b2**\uff0c\u4f46\u652f\u6301\u5ea6\u672a\u77e5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u6709\u804c\u4e1a\u3001\u5e74\u9f84\u3001\u52a8\u673a\u7b49\u5173\u952e\u4fe1\u606f\uff0c\u4f46\u7f3a\u4e4f\u8d22\u52a1\u4e0e\u5bb6\u5ead\u51b3\u7b56\u7ec6\u8282\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u660e\u786e\u8868\u793a\u201c\u517c\u804c\u5427\u201d\uff0c\u4f46\u540e\u7eed\u5f3a\u8c03\u201c\u4e0d\u592a\u60f3\u4e00\u5f00\u59cb\u5c31\u62b1\u6709\u5f3a\u70c8\u7684\u529f\u5229\u503e\u5411\uff0c\u80fd\u6539\u53d8\u81ea\u5df1\u5176\u5b9e\u662f\u6700\u80fd\u8ba9\u81ea\u5df1\u5f00\u5fc3\u7684\u201d\uff0c\u5c06**\u81ea\u6211\u63d0\u5347\u4e0e\u5174\u8da3\u63a2\u7d22**\u7f6e\u4e8e\u77ed\u671f\u53d8\u73b0\u4e4b\u4e0a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u4e5f\u6df1\u6df1\u77e5\u9053\uff0c\u8fd9\u4e9b\u5de5\u4f5c\u6ca1\u90a3\u4e48\u7b80\u5355...\u6211\u7684\u521d\u8877\u662f\u770b\u770b\u6709\u6ca1\u6709\u65b9\u6cd5\u7ea0\u6b63\u6216\u8005\u63d0\u5347\u81ea\u5df1\u7684\u53d1\u97f3\u65b9\u6cd5\uff0c\u8fd8\u6709\u6f14\u64ad\u6280\u80fd\u8fd9\u4e9b\uff0c\u81f3\u4e8e\u8d5a\u4e0d\u8d5a\u94b1\uff0c\u6211\u8fd8\u662f\u505a\u597d\u672c\u804c\u5de5\u4f5c\u597d\u4e00\u4e9b\uff0c\u54c8\u54c8\u54c8\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b06\u9ad8]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u63a8\u6d4b\u9ad8]** \u2014 \u4e00\u7ea7\u6ce8\u518c\u5efa\u7b51\u5e08\uff0c\u5c5e\u4e8e\u9ad8\u51c0\u503c\u804c\u4e1a\uff0c\u5177\u5907\u4e3a\u5174\u8da3\u4ed8\u8d39\u7684\u5f3a\u7ecf\u6d4e\u57fa\u7840\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**[\u63a8\u6d4b\u4e2d]** \u2014 \u81ea\u79f0\u201c\u4e0d\u50cf\u4e4b\u524d\u90a3\u4e48\u5fd9\u4e86\uff0c\u6709\u65f6\u95f4\u201d\uff0c\u80fd\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u89c2\u770b\u76f4\u64ad\uff0c\u4f46\u9700\u5916\u51fa\u5904\u7406\u4e8b\u52a1\uff0c\u65f6\u95f4\u975e\u5b8c\u5168\u81ea\u7531\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u4fe1\u606f\u7f3a\u5931]** \u2014 \u63d0\u53ca\u201c\u7ed9\u5bb6\u91cc\u5c0f\u670b\u53cb\u8bfb\u6545\u4e8b\u201d\uff0c\u63a8\u65ad\u6709\u5bb6\u5ead\uff0c\u4f46\u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\u3002**\u6b64\u4e3a\u6f5c\u5728\u98ce\u9669\u70b9**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9762\u5bf9\u5b66\u4e60\u8d44\u6599\u96be\u5ea6\uff08\u201c\u6709\u70b9\u6253\u51fb\u6211\u7684\u5b66\u4e60\u70ed\u60c5\u201d\uff09\u80fd\u81ea\u6211\u8c03\u4f83\uff08\u201c\u6211\u53ef\u4fe1\u4e86\u201d\uff09\uff0c\u63a5\u53d7\u201c\u8111\u5b50\u4f1a\u4e86\uff0c\u5634\u8ddf\u4e0d\u4e0a\u201d\u7684\u73b0\u5b9e\uff0c\u5e76\u4e3b\u52a8\u53cd\u601d\u201c\u6587\u672c\u5206\u6790\u80fd\u529b\u201d\u7684\u4e0d\u8db3\uff0c\u8868\u73b0\u51fa\u6210\u719f\u7684\u81ea\u6211\u8ba4\u77e5\u548c\u8c03\u8282\u80fd\u529b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8fd9\u4e2a\u5b66\u4e60\u8d44\u6599\u6709\u70b9\u6253\u51fb\u6211\u7684\u5b66\u4e60\u70ed\u60c5[\u88c2\u5f00]\u201d \uff08\u9500\u552e\u5b89\u629a\u540e\uff09> \u201c\u6211\u53ef\u4fe1\u4e86[\u6342\u8138]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e2d\u5e74\u804c\u4e1a\u5026\u6020\u4e0e\u5355\u4e00\u6280\u80fd\u7126\u8651**\u3002\u4f5c\u4e3a42\u5c81\u7684\u4e00\u7ea7\u6ce8\u518c\u5efa\u7b51\u5e08\uff0c\u4ed6\u611f\u5230\u201c\u4e00\u76f4\u4ece\u4e8b\u4e00\u4e2a\u804c\u4e1a\u5c82\u4e0d\u662f\u6709\u70b9\u4e8f\u201d\uff0c\u6e34\u671b\u63a2\u7d22\u65b0\u9886\u57df\u3001\u83b7\u5f97\u65b0\u6280\u80fd\uff0c\u5b9e\u73b0\u4eba\u751f\u5bbd\u5ea6\u7684\u62d3\u5c55\u548c\u81ea\u6211\u4ef7\u503c\u7684\u518d\u786e\u8ba4\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u201d\u7684\u5c0a\u91cd\u4e0e\u201c\u53ef\u80fd\u6027\u201d\u7684\u8d4b\u80fd**\u3002\u80af\u5b9a\u4ed6\u4f5c\u4e3a\u9ad8\u77e5\u4eba\u58eb\u8de8\u754c\u63a2\u7d22\u7684\u52c7\u6c14\uff0c\u4e3a\u4ed6\u6784\u5efa\u4e00\u4e2a\u201c\u58f0\u97f3\u827a\u672f\u5bb6\u201d\u6216\u201c\u751f\u6d3b\u7f8e\u5b66\u5bb6\u201d\u7684\u65b0\u8eab\u4efd\u8ba4\u540c\uff0c\u8ba9\u4ed6\u611f\u53d7\u5230\u5b66\u4e60\u5e26\u6765\u7684\u4e0d\u4ec5\u662f\u6280\u80fd\uff0c\u66f4\u662f\u751f\u6d3b\u54c1\u8d28\u548c\u751f\u547d\u4e30\u5bcc\u5ea6\u7684\u63d0\u5347\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B** \u7c7b \uff08\u9ad8\u4ef7\u503c\u3001\u9ad8\u81ea\u4e3b\u6027\u3001\u76ee\u6807\u6e05\u6670\u7684\u6f5c\u529b\u7528\u6237\uff09 |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** \uff08\u9ad8\u77e5\u3001\u52a1\u5b9e\u3001\u76ee\u6807\u660e\u786e\u3001\u5b66\u4e60\u9a71\u52a8\u529b\u6e90\u4e8e\u5185\u5728\u6210\u957f\u800c\u975e\u5916\u90e8\u538b\u529b\uff09 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4f4e** | \u5bb6\u5ead\u7ecf\u6d4e\u57fa\u7840\u597d\uff0c\u4f46\u9700\u786e\u8ba4\u5bb6\u4eba\u662f\u5426\u652f\u6301\u5176\u6295\u5165\u65f6\u95f4\u5b66\u4e60\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u81ea\u5f8b\u6027\u5f3a\uff0c\u80fd\u4e3b\u52a8\u5b8c\u6210\u4f5c\u4e1a\uff0c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u4f73\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u7406\u6027\u770b\u5f85\u5b66\u4e60\u66f2\u7ebf\uff0c\u81ea\u6211\u8c03\u8282\u80fd\u529b\u5f3a\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u82e5\u8bfe\u7a0b\u5185\u5bb9\u6df1\u5ea6\u3001\u4e13\u4e1a\u6027\u4e0d\u8db3\uff0c\u6216\u65e0\u6cd5\u6ee1\u8db3\u5176\u201c\u81ea\u6211\u63d0\u5347\u201d\u7684\u9ad8\u9636\u9700\u6c42\uff0c\u53ef\u80fd\u56e0\u201c\u5b66\u4e0d\u5230\u4e1c\u897f\u201d\u800c\u611f\u5230\u5931\u671b\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe1\u4e2a\u6708\u540e**\u3002\u5f53\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u82e5\u8bfe\u7a0b\u65e0\u6cd5\u63d0\u4f9b\u6301\u7eed\u7684\u8ba4\u77e5\u6311\u6218\u548c\u6df1\u5ea6\u5185\u5bb9\uff0c\u53ef\u80fd\u56e0\u201c\u5b66\u4e60\u4ef7\u503c\u611f\u4e0d\u8db3\u201d\u800c\u6d41\u5931\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5927\u98de\u8001\u5e08\u597d\uff0c\u770b\u5230\u60a8\u662f\u4e00\u7ea7\u6ce8\u518c\u5efa\u7b51\u5e08\uff0c\u7279\u522b\u4f69\u670d\u3002\u6211\u4eec\u8fd9\u4e2a\u8bfe\u7a0b\u91cc\uff0c\u6709\u5f88\u591a\u50cf\u60a8\u4e00\u6837\u5728\u5404\u884c\u5404\u4e1a\u505a\u5230\u9876\u5c16\uff0c\u53c8\u6765\u63a2\u7d22\u58f0\u97f3\u53ef\u80fd\u6027\u7684\u540c\u5b66\u3002\u63a5\u4e0b\u6765\u7684\u5b66\u4e60\uff0c\u4e0d\u4ec5\u662f\u6280\u5de7\uff0c\u66f4\u662f\u4e00\u573a\u5173\u4e8e\u2018\u8868\u8fbe\u2019\u548c\u2018\u53ef\u80fd\u6027\u2019\u7684\u6df1\u5ea6\u63a2\u7d22\uff0c\u671f\u5f85\u548c\u60a8\u4e00\u8d77\uff0c\u628a\u4e13\u4e1a\u9886\u57df\u7684\u4e25\u8c28\u548c\u5ba1\u7f8e\uff0c\u5e26\u5230\u58f0\u97f3\u521b\u4f5c\u91cc\u6765\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72+\u5174\u8da3\u63a2\u7d22\u53cc\u8f68\u7ebf**\u3011\u3002\u65e2\u8981\u63d0\u4f9b\u624e\u5b9e\u7684\u6f14\u64ad\u6280\u5de7\u8bad\u7ec3\uff08\u6ee1\u8db3\u5176\u201c\u7ea0\u6b63\u53d1\u97f3\u3001\u63d0\u5347\u6280\u80fd\u201d\u7684\u521d\u8877\uff09\uff0c\u4e5f\u8981\u8fde\u63a5\u9ad8\u9636\u7684\u5ba1\u7f8e\u8d4f\u6790\u3001\u6587\u672c\u6df1\u5ea6\u89e3\u8bfb\u7b49\u5185\u5bb9\uff08\u6ee1\u8db3\u5176\u81ea\u6211\u5b9e\u73b0\u9700\u6c42\uff09\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T2\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a\u3010**\u9ad8\u77e5\u5708\u5c42\u4ea4\u6d41\u5305**\u3011\uff08\u5982\u4e13\u5c5e\u7684\u884c\u4e1a\u5927\u5496\u5206\u4eab\u3001\u9ad8\u8d28\u91cf\u5b66\u5458\u4f5c\u54c1\u4e92\u8bc4\u4f1a\uff09\uff1b\u3010**\u6df1\u5ea6\u5185\u5bb9\u62d3\u5c55\u5305**\u3011\uff08\u5982\u7ecf\u5178\u6587\u5b66\u4f5c\u54c1\u6f14\u64ad\u89e3\u6790\u3001\u58f0\u97f3\u7f8e\u5b66\u7406\u8bba\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u5b9d\u5988\u517c\u804c\u6708\u5165\u8fc7\u4e07\u201d\u7b49\u4f4e\u9636\u8bdd\u672f\u523a\u6fc0\uff1b\u4e0d\u8981\u8fc7\u5ea6\u5f3a\u8c03\u201c\u7b80\u5355\u901f\u6210\u201d\uff0c\u8fd9\u4f1a\u88ab\u4ed6\u89c6\u4e3a\u4e0d\u4e13\u4e1a\uff1b\u907f\u514d\u7fa4\u5185\u4f4e\u8d28\u91cf\u704c\u6c34\u6253\u6270\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u4f46\u63a8\u4ecb\u903b\u8f91\u5fc5\u987b\u662f\u201c\u6df1\u5ea6\u201d\u3001\u201c\u4e13\u4e1a\u201d\u3001\u201c\u7cfb\u7edf\u5316\u201d\u3001\u201c\u8d44\u6e90\u94fe\u63a5\u201d\uff0c\u800c\u975e\u201c\u53d8\u73b0\u5feb\u201d\u3002\u53ef\u63a8\u8350\u5927\u5e08\u73ed\u3001\u9ad8\u9636\u5de5\u4f5c\u574a\u7b49\u4ea7\u54c1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u800c\u4e1442\u5c81\u4e86\uff0c\u4eba\u751f\u8fc7\u534a\u3002\u6211\u76f8\u4fe1\u5355\u4e00\u6280\u80fd\u5f88\u96be\u8986\u76d6\u6574\u4e2a\u4eba\u751f\uff0c\u800c\u4e14\u4eba\u6d3b\u4e00\u4e16\u8349\u6728\u4e00\u79cb\uff0c\u4e00\u76f4\u4ece\u4e8b\u4e00\u4e2a\u804c\u4e1a\u5c82\u4e0d\u662f\u6709\u70b9\u4e8f\u201d\n2. > \u201c\u6211\u7684\u521d\u8877\u662f\u770b\u770b\u6709\u6ca1\u6709\u65b9\u6cd5\u7ea0\u6b63\u6216\u8005\u63d0\u5347\u81ea\u5df1\u7684\u53d1\u97f3\u65b9\u6cd5\uff0c\u8fd8\u6709\u6f14\u64ad\u6280\u80fd\u8fd9\u4e9b\uff0c\u81f3\u4e8e\u8d5a\u4e0d\u8d5a\u94b1\uff0c\u6211\u8fd8\u662f\u505a\u597d\u672c\u804c\u5de5\u4f5c\u597d\u4e00\u4e9b\uff0c\u54c8\u54c8\u54c8\u201d\n3. > \u201c\u6211\u5176\u5b9e\u4e0d\u592a\u60f3\u4e00\u5f00\u59cb\u5c31\u62b1\u6709\u5f3a\u70c8\u7684\u529f\u5229\u503e\u5411\uff0c\u80fd\u6539\u53d8\u81ea\u5df1\u5176\u5b9e\u662f\u6700\u80fd\u8ba9\u81ea\u5df1\u5f00\u5fc3\u7684\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2\u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u81ea\u6211\u5b9e\u73b0\u4e0e\u5bf9\u6297\u804c\u4e1a\u5026\u6020**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4f4e**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u8d85\u8d8a\u529f\u5229\u4e3b\u4e49\u7684\u6df1\u5ea6\u5b66\u4e60\u4ef7\u503c\u4e0e\u9ad8\u77e5\u5708\u5c42\u8ba4\u540c\u611f**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72+\u5174\u8da3\u63a2\u7d22\u53cc\u8f68\u7ebf\"}\n```";
