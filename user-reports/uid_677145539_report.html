    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## \u4fe1\u606f\u5145\u8db3\u6027\u8bc4\u4f30\n\u4fe1\u606f\u5145\u8db3\u3002\u804a\u5929\u8bb0\u5f55\u8986\u76d6\u4e86\u4ece\u5f00\u8425\u524d\u73ed\u4f1a\u5230\u8003\u6838\u901a\u8fc7\u3001\u652f\u4ed8\u5b8c\u6210\u7684\u5168\u6d41\u7a0b\uff0c\u80fd\u63d0\u53d6\u5173\u952e\u4e09\u8f74\u4fe1\u53f7\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u9ad8)**\n    *   **\u8868\u5c42**: \u5bf9\u201c\u4eba\u6587\u793e\u79d1\u3001\u4eb2\u5b50\u513f\u7ae5\u201d\u8d5b\u9053\u660e\u786e\u8868\u793a\u5174\u8da3\uff0c\u4e3b\u52a8\u8be2\u95ee\u201c\u65c1\u767d\u6587\u8003\u6838\u4f5c\u4e1a\u201d\uff0c\u5e76\u63d0\u4ea4\u8bd5\u97f3\u3002\u8868\u73b0\u51fa\u5bf9\u6280\u80fd\u5b66\u4e60\u548c\u5185\u5bb9\u521b\u4f5c\u7684\u597d\u5947\u4e0e\u5c1d\u8bd5\u610f\u613f\u3002\n    *   **\u6df1\u5c42**: \u6838\u5fc3\u9a71\u52a8\u529b\u4e3a**\u526f\u4e1a\u53d8\u73b0**\u3002\u5bf9\u201c\u65f6\u85aa\u201d\u3001\u201c\u53d8\u73b0\u8def\u5f84\u201d\u3001\u201c\u63a5\u5355\u8d44\u6e90\u201d\u3001\u201c\u659c\u6760\u5c97\u4f4d\uff08\u753b\u672c\u3001\u5bf9\u8f68\u3001\u5ba1\u542c\u7b49\uff09\u201d\u3001\u201c\u52a9\u5b66\u91d1\u201d\u7b49\u5173\u952e\u8bcd\u9ad8\u5ea6\u5173\u6ce8\u5e76\u79ef\u6781\u4e92\u52a8\u3002\u7528\u6237\u539f\u578b\u504f\u5411\u201c\u5bfb\u6c42\u526f\u4e1a\u673a\u4f1a\u7684\u5b9e\u7528\u4e3b\u4e49\u8005\u201d\u3002\n    *   **\u98ce\u9669\u4fe1\u53f7**: \u672a\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u5185\u5728\u5174\u8da3\uff08\u5982\u58f0\u97f3\u827a\u672f\u70ed\u7231\u3001\u81ea\u6211\u8868\u8fbe\uff09\uff0c\u52a8\u673a\u4e0e\u201c\u5feb\u901f\u63a5\u5355\u8d5a\u94b1\u201d\u5f3a\u7ed1\u5b9a\u3002\n\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d\u7b49)**\n    *   **\u65f6\u95f4/\u7cbe\u529b**: \u914d\u5408\u5ea6\u9ad8\uff0c\u80fd\u5b8c\u6210\u65e9\u529f\u3001\u6253\u5361\u3001\u770b\u56de\u653e\u7b49\u4efb\u52a1\u3002\u66fe\u56e0\u201c\u51fa\u53bb\u5403\u996d\u201d\u9519\u8fc7\u76f4\u64ad\uff0c\u4f46\u4e3b\u52a8\u8981\u6c42\u5f55\u64ad\uff0c\u663e\u793a\u65f6\u95f4\u5b89\u6392\u76f8\u5bf9\u7075\u6d3b\uff0c\u4f46\u975e\u5168\u804c\u6295\u5165\u72b6\u6001\u3002\n    *   **\u6280\u80fd/\u5929\u8d4b**: \u58f0\u97f3\u88ab\u8bc4\u4ef7\u4e3a\u201c\u53ef\u5851\u6027\u6bd4\u8f83\u5f3a\u201d\uff0c\u638c\u63e1**\u7ca4\u8bed\u3001\u97e9\u8bed\u3001\u82f1\u8bed**\u591a\u8bed\u8a00\u6280\u80fd\uff0c\u662f\u663e\u8457\u52a0\u5206\u9879\u548c\u5dee\u5f02\u5316\u4f18\u52bf\u3002\u5bf9\u6280\u5de7\u8bb2\u89e3\uff08\u5982\u91cd\u97f3\uff09\u80fd\u7406\u89e3\u5e76\u8868\u793a\u7ec3\u4e60\u3002\n    *   **\u8bbe\u5907/\u73af\u5883**: \u63d0\u53ca\u201c\u624b\u673a\u574f\u4e86\u521a\u6362\u4e86\u8bbe\u5907\u201d\uff0c\u8868\u660e\u76ee\u524d\u4f9d\u8d56\u624b\u673a\u7b49\u57fa\u7840\u8bbe\u5907\uff0c\u7b26\u5408\u201c\u4e00\u90e8\u624b\u673a\u5c31\u53ef\u4ee5\u201d\u7684\u5165\u95e8\u5efa\u8bae\uff0c\u6682\u65e0\u4e13\u4e1a\u8bbe\u5907\u6295\u5165\u3002\n    *   **\u7ecf\u6d4e**: \u5df2\u652f\u4ed8\u8bfe\u7a0b\u8d39\u7528\uff08\u201c\u52a9\u5b66\u91d1\u4e8c\u7ef4\u7801\u201d\u73af\u8282\uff09\uff0c\u5177\u5907\u57fa\u7840\u6d88\u8d39\u80fd\u529b\uff0c\u4f46\u5bf9\u9ad8\u989d\u8bbe\u5907\u6295\u5165\u53ef\u80fd\u8c28\u614e\u3002\n\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u9ad8)**\n    *   **\u575a\u6301\u6027**: \u9ad8\u3002\u5168\u7a0b\u8ddf\u8fdb\u6240\u6709\u5b66\u4e60\u4efb\u52a1\uff08\u65e9\u529f\u3001\u76f4\u64ad\u3001\u6253\u5361\u3001\u4f5c\u4e1a\uff09\uff0c\u4e3b\u52a8\u63d0\u95ee\uff08\u5982\u201c\u5982\u4f55\u9884\u7ea6\u76f4\u64ad\u201d\uff09\uff0c\u6307\u4ee4\u670d\u4ece\u6027\u597d\u3002\n    *   **\u632b\u6298\u5bb9\u5fcd\u5ea6**: \u672a\u77e5\u3002\u8bb0\u5f55\u4e2d\u672a\u906d\u9047\u660e\u663e\u632b\u6298\u6216\u8d1f\u9762\u53cd\u9988\uff0c\u9500\u552e\u4ee5\u9f13\u52b1\u4e3a\u4e3b\u3002\u9700\u89c2\u5bdf\u5176\u5728\u6536\u5230\u4e25\u5389\u6279\u8bc4\u6216\u8bd5\u97f3\u5931\u8d25\u65f6\u7684\u53cd\u5e94\u3002\n    *   **\u4e92\u52a8\u6a21\u5f0f**: **\u914d\u5408\u578b**\u3002\u56de\u590d\u7b80\u6d01\u3001\u793c\u8c8c\uff08\u201c\u6536\u5230\u201d\u3001\u201c\u8c22\u8c22\u201d\u3001\u201c\u597d\u6ef4\u201d\uff09\uff0c\u80fd\u5b8c\u6210\u9500\u552e\u8981\u6c42\u7684\u793e\u7fa4\u52a8\u4f5c\uff08\u590d\u5236\u6253\u5361\u8bed\uff09\uff0c\u4f46\u81ea\u6211\u8868\u8fbe\u8f83\u5c11\uff0c\u6df1\u5ea6\u4ea4\u6d41\u6709\u9650\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u5df2\u626b\u63cf\u201c\u52a9\u5b66\u91d1\u4e8c\u7ef4\u7801\u201d\u5b8c\u6210\u652f\u4ed8\uff0c\u5e76\u6dfb\u52a0\u73ed\u4e3b\u4efb\uff0c\u8fdb\u5165\u4ea4\u4ed8\u9636\u6bb5\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u8bb0\u5f55\u4e2d\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u6210\u5458\u6216\u9700\u5546\u8bae\u7684\u8ff9\u8c61\uff0c\u8868\u73b0\u4e3a\u4e2a\u4eba\u72ec\u7acb\u51b3\u7b56\u3002**\u9700\u73ed\u4e3b\u4efb\u540e\u7eed\u6838\u5b9e**\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u7eaf\u5ea6**: B\u7c7b\uff08\u6df7\u5408\u52a8\u673a\uff09\u3002\u4ee5\u526f\u4e1a\u53d8\u73b0\u4e3a\u4e3b\uff0c\u9644\u5e26\u6280\u80fd\u5b66\u4e60\u5174\u8da3\u3002\n*   **\u6b65\u9aa42 - \u8d44\u6e90\u5e95\u5ea7**: B\u7c7b\uff08\u8d44\u6e90\u9002\u4e2d\uff09\u3002\u6709\u65f6\u95f4\u3001\u57fa\u7840\u652f\u4ed8\u80fd\u529b\u3001\u591a\u8bed\u8a00\u5929\u8d4b\u4f18\u52bf\uff0c\u4f46\u8bbe\u5907\u666e\u901a\uff0c\u975e\u5168\u804c\u72b6\u6001\u3002\n*   **\u6b65\u9aa43 - \u5fc3\u7406\u5f39\u6027**: A\u7c7b\uff08\u9ad8\u5f39\u6027\uff09\u3002\u5b66\u4e60\u914d\u5408\u5ea6\u9ad8\uff0c\u6267\u884c\u529b\u5f3a\u3002\n*   **\u7efc\u5408\u5224\u5b9a**: **B-B-A\u578b\u7528\u6237**\u3002\u9ad8\u914d\u5408\u3001\u6709\u660e\u786e\u53d8\u73b0\u76ee\u6807\u7684\u526f\u4e1a\u5bfb\u6c42\u8005\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n**T4 \u52a1\u5b9e\u526f\u4e1a\u63a2\u7d22\u8005**\n*   **\u6838\u5fc3\u7279\u5f81**: \u76ee\u6807\u660e\u786e\uff08\u8d5a\u94b1\uff09\uff0c\u6267\u884c\u529b\u5f3a\uff0c\u5bf9\u201c\u80fd\u505a\u4ec0\u4e48\u5c97\u4f4d\u201d\u3001\u201c\u5982\u4f55\u63a5\u5355\u201d\u7b49\u53d8\u73b0\u8def\u5f84\u5173\u6ce8\u5ea6\u8fdc\u9ad8\u4e8e\u7eaf\u7cb9\u7684\u827a\u672f\u8ffd\u6c42\u3002\u5177\u5907\u591a\u8bed\u8a00\u6280\u80fd\uff0c\u6709\u5dee\u5f02\u5316\u7ade\u4e89\u6f5c\u529b\u3002\n*   **\u5339\u914d\u5ea6**: \u9ad8\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4e2d\u4f4e)\n*   **\u6839\u56e01 - \u9884\u671f\u843d\u5dee (\u4e2d\u98ce\u9669)**: \u9500\u552e\u8fc7\u5ea6\u5f3a\u8c03\u201c\u65f6\u85aa\u201d\u3001\u201c\u63a5\u5355\u201d\u3001\u201c\u53d8\u73b0\u201d\uff0c\u53ef\u80fd\u62ac\u9ad8\u4e86\u7528\u6237\u5bf9**\u77ed\u671f\u6536\u5165**\u548c**\u63a5\u5355\u96be\u5ea6**\u7684\u9884\u671f\u3002**\u9700\u91cd\u70b9\u7ba1\u7406**\u3002\n*   **\u6839\u56e02 - \u6548\u679c\u4e0d\u7b26 (\u4f4e\u98ce\u9669)**: \u7528\u6237\u5df2\u901a\u8fc7\u8003\u6838\u5e76\u83b7\u5f97\u6b63\u9762\u53cd\u9988\uff0c\u521d\u671f\u4f53\u9a8c\u826f\u597d\u3002\n*   **\u6839\u56e03 - \u7ecf\u6d4e\u538b\u529b (\u4f4e\u98ce\u9669)**: \u5df2\u652f\u4ed8\uff0c\u672a\u8868\u73b0\u51fa\u538b\u529b\u3002\n*   **\u6839\u56e04 - \u65f6\u95f4\u51b2\u7a81 (\u4f4e\u98ce\u9669)**: \u80fd\u7075\u6d3b\u5b89\u6392\u65f6\u95f4\u770b\u56de\u653e\uff0c\u51b2\u7a81\u98ce\u9669\u4f4e\u3002\n*   **\u6839\u56e05 - \u5bb6\u5ead\u53cd\u5bf9 (\u672a\u77e5\u98ce\u9669)**: **\u51b3\u7b56\u6743\u4fe1\u606f\u7f3a\u5931\uff0c\u4e3a\u6f5c\u5728\u98ce\u9669\u70b9**\u3002\n*   **\u6839\u56e06 - \u4f53\u9a8c\u4e0d\u4f73 (\u4f4e\u98ce\u9669)**: \u670d\u52a1\u54cd\u5e94\u53ca\u65f6\uff0c\u4e92\u52a8\u987a\u7545\u3002\n*   **\u6839\u56e07 - \u7ade\u54c1\u8f6c\u79fb (\u4f4e\u98ce\u9669)**: \u5f53\u524d\u6295\u5165\u5ea6\u548c\u6ee1\u610f\u5ea6\u8f83\u9ad8\u3002\n*   **\u7efc\u5408\u98ce\u9669\u7b49\u7ea7**: **\u4f4e**\u3002\u4e3b\u8981\u98ce\u9669\u96c6\u4e2d\u4e8e**\u53d8\u73b0\u9884\u671f\u7ba1\u7406**\u548c**\u5bb6\u5ead\u77e5\u60c5\u6838\u67e5**\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u8fc7\u5ea6\u627f\u8bfa**: \u9500\u552e\u591a\u6b21\u4f7f\u7528\u201c\u7ad9\u5728\u5de8\u4eba\u7684\u80a9\u8180\u4e0a\u6500\u767b\u201d\u3001\u201c\u590d\u523b\u8ba9\u4f60\u8d85\u8d8a\u201d\u3001\u201c\u5c11\u8d70\u5f2f\u8def\u201d\u7b49\u8bdd\u672f\uff0c\u6709**\u6697\u793a\u201c\u901f\u6210\u201d\u548c\u201c\u786e\u4fdd\u6210\u529f\u201d\u7684\u503e\u5411**\uff0c\u5c5e\u4e8e**\u9ec4\u8272\u9884\u8b66**\u533a\u3002\n*   **\u7126\u8651\u8d29\u5356**: \u4e00\u822c\u3002\u4e3b\u8981\u4f7f\u7528\u201c\u89e3\u9501\u6743\u9650\u201d\u3001\u201c\u4e0d\u8981\u9519\u8fc7\u201d\u3001\u201c\u52a1\u5fc5\u91cd\u89c6\u201d\u7b49\u7d27\u8feb\u6027\u8bdd\u672f\uff0c\u7a0b\u5ea6\u5728\u53ef\u63a5\u53d7\u8303\u56f4\u5185\u3002\n*   **\u4fe1\u606f\u900f\u660e**: \u57fa\u672c\u5408\u89c4\u3002\u6e05\u6670\u8bf4\u660e\u4e86\u8003\u6838\u3001\u6253\u5361\u3001\u89e3\u9501\u8d44\u6e90\u7b49\u89c4\u5219\u3002\n*   **\u4ef7\u683c\u4e0e\u4ef7\u503c\u4f20\u9012**: \u4f7f\u7528\u4e86\u201c\u52a9\u5b66\u91d1\u201d\u8868\u8ff0\uff0c\u9700\u786e\u8ba4\u662f\u5426\u4e3a\u5b98\u65b9\u7edf\u4e00\u6d3b\u52a8\uff0c\u907f\u514d\u201c\u865a\u6784\u4f18\u60e0\u201d\u5acc\u7591\u3002\n*   **\u603b\u4f53\u8bc4\u4ef7**: \u9500\u552e\u6d41\u7a0b\u5b8c\u6574\uff0c\u4e92\u52a8\u79ef\u6781\uff0c\u4f46\u5b58\u5728**\u8f7b\u5ea6\u8fc7\u5ea6\u627f\u8bfa\u503e\u5411**\uff0c\u9700\u5728\u540e\u7eed\u670d\u52a1\u4e2d\u6821\u6b63\u9884\u671f\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d**: **\u5339\u914d**\u3002\u7528\u6237\u7684\u591a\u8bed\u8a00\u6280\u80fd\u548c\u52a1\u5b9e\u76ee\u6807\uff0c\u4e0e\u559c\u9a6c\u62c9\u96c5\u7684\u6709\u58f0\u4e66\u5236\u4f5c\u3001\u591a\u8bed\u79cd\u5185\u5bb9\u3001\u4ee5\u53ca\u753b\u672c/\u5bf9\u8f68/\u5ba1\u542c\u7b49\u201c\u659c\u6760\u5c97\u4f4d\u201d\u5339\u914d\u5ea6\u9ad8\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **\u9996\u5468\u91cd\u70b9\u6821\u6b63\u53d8\u73b0\u9884\u671f\uff0c\u540c\u6b65\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5**\u3002\n*   **\u5177\u4f53\u884c\u52a8\u6307\u5357**:\n    1.  **\u9884\u671f\u7ba1\u7406\uff08\u5173\u952e\uff09**: \u9996\u6b21\u6c9f\u901a\u9700\u660e\u786e\u5f3a\u8c03\u201c\u6280\u80fd\u6210\u957f\u5468\u671f\u201d\u548c\u201c\u63a5\u5355\u7ade\u4e89\u73b0\u5b9e\u201d\uff0c\u7528\u6210\u529f\u6848\u4f8b\u7684**\u65f6\u95f4\u7ebf**\u548c**\u52aa\u529b\u8fc7\u7a0b**\u66ff\u4ee3\u5355\u7eaf\u7684\u7ed3\u679c\u6e32\u67d3\u3002\u5f15\u5bfc\u5176\u5c06\u591a\u8bed\u8a00\u6280\u80fd\u4f5c\u4e3a\u957f\u671f\u4f18\u52bf\u6765\u89c4\u5212\u3002\n    2.  **\u5bb6\u5ead\u6838\u67e5**: 24\u5c0f\u65f6\u5185\u4ee5\u201c\u5b66\u4e60\u8ba1\u5212\u786e\u8ba4\u201d\u6216\u201c\u8d44\u6599\u5bc4\u9001\u201d\u4e3a\u7531\uff0c\u6e29\u548c\u6838\u5b9e\u662f\u5426\u4e3a\u4e2a\u4eba\u51b3\u7b56\uff0c\u5bb6\u5ead\u662f\u5426\u77e5\u60c5\u652f\u6301\u3002\n    3.  **\u4f18\u52bf\u8d4b\u80fd**: \u8fc5\u901f\u4e3a\u5176\u94fe\u63a5**\u591a\u8bed\u79cd\u5185\u5bb9**\u6216**\u56fd\u9645\u9879\u76ee**\u7684\u8bd5\u97f3\u673a\u4f1a\uff08\u54ea\u6015\u662f\u5c0f\u5355\uff09\uff0c\u8ba9\u5176\u5728\u65e9\u671f\u611f\u53d7\u5230\u6280\u80fd\u5dee\u5f02\u5316\u7684\u4ef7\u503c\uff0c\u5f3a\u5316\u4fe1\u5fc3\u548c\u7c98\u6027\u3002\n    4.  **\u8def\u5f84\u89c4\u5212**: \u57fa\u4e8e\u5176\u5174\u8da3\uff08\u4eba\u6587\u793e\u79d1\u3001\u4eb2\u5b50\uff09\u548c\u5df2\u5173\u6ce8\u7684\u201c\u753b\u672c\u3001\u5bf9\u8f68\u201d\u7b49\u5c97\u4f4d\uff0c\u63d0\u4f9b\u6e05\u6670\u7684\u5b66\u4e60-\u5b9e\u8df5\u8def\u5f84\u56fe\uff0c\u5c06\u5b8f\u5927\u7684\u201c\u53d8\u73b0\u201d\u76ee\u6807\u5206\u89e3\u4e3a\u53ef\u6267\u884c\u7684\u9636\u6bb5\u6027\u4efb\u52a1\u3002\n    5.  **\u5e38\u89c4\u670d\u52a1**: \u4fdd\u6301\u73b0\u6709\u54cd\u5e94\u901f\u5ea6\u548c\u9f13\u52b1\u98ce\u683c\uff0c\u4f5c\u4e1a\u53cd\u9988\u9700\u5728\u9f13\u52b1\u4e2d\u690d\u5165\u5177\u4f53\u6539\u8fdb\u70b9\uff0c\u63a8\u52a8\u5176\u4ece\u201c\u5b8c\u6210\u4efb\u52a1\u201d\u5411\u201c\u63d0\u5347\u6280\u827a\u201d subtly \u8f6c\u53d8\u3002\n\n{\"core_type\": \"T4 \u52a1\u5b9e\u526f\u4e1a\u63a2\u7d22\u8005\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u6821\u6b63\u53d8\u73b0\u9884\u671f\u5e76\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\"}";
