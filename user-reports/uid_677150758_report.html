        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677150758 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5b98\u65b9\u62db\u52df\u5b98-\u6696\u6696(\u5f20\u5e86\u6587) \u2192 \u73ed\u4e3b\u4efb-\u6d1b\u5947\u6eaa\u5802(\u5f20\u723d) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b (3980\u5143\uff0c2\u4e2a\u6708\u671f) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3** (\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u8d44\u91d1\u6765\u6e90) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u5b66\u751f\u8eab\u4efd\uff0c\u9700\u517c\u987e\u5b66\u6821\u8bfe\u7a0b) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3** (\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931** (\u5173\u952e\u7ef4\u5ea6\u5982\u652f\u4ed8\u3001\u5bb6\u5ead\u3001\u6536\u5165\u3001\u8fc7\u5f80\u7ecf\u5386\u5747\u672a\u63d0\u53ca\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b07\u4f4e\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u7eaf\u4e3a\u51e0\u5929\u5185\u63d0\u73b0\u4fdd\u5e95\u800c\u6765(\u4f4e\u6781\u5371)**\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u201c\u56e0\u4e3a\u786e\u5b9e\u5f88\u7740\u6025\u8d5a\u94b1\u201d\uff0c\u4e14\u5bf9\u201c\u7b2c\u516b\u5929\u53ef\u4ee5\u63a5\u5355\u5417\u201d\u3001\u201c\u65f6\u85aa\u5927\u6982\u80fd\u8fbe\u5230\u591a\u5c11\u201d\u7b49\u53d8\u73b0\u8def\u5f84\u548c\u901f\u5ea6\u9ad8\u5ea6\u5173\u6ce8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u56e0\u4e3a\u786e\u5b9e\u5f88\u7740\u6025\u8d5a\u94b1\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u8d44\u91d1\u6765\u6e90\u3001\u6536\u5165\u72b6\u51b5\u3002**\u98ce\u9669\u672a\u77e5**\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u5b66\u751f\u8eab\u4efd\uff0c\u65f6\u95f4\u76f8\u5bf9\u81ea\u7531\u4f46\u9700\u517c\u987e\u5b66\u6821\u8bfe\u7a0b\uff0c\u5b58\u5728\u65f6\u95f4\u51b2\u7a81\uff08\u201c\u6211\u5b66\u6821\u6709\u8bfe\u201d\uff09\u3002\u5bf9\u201c\u65e0\u58f0\u540e\u671f\u201d\u611f\u5174\u8da3\uff0c\u56e0\u5176\u201c\u53ef\u4ee5\u7528\u7535\u8111\u64cd\u4f5c\u201d\uff0c\u663e\u793a\u5176\u80fd\u6839\u636e\u81ea\u8eab\u6761\u4ef6\uff08\u65f6\u95f4\u788e\u7247\u5316\uff09\u9009\u62e9\u9002\u914d\u7684\u5b66\u4e60/\u5de5\u4f5c\u65b9\u5f0f\uff0c\u5177\u5907\u4e00\u5b9a\u7684\u89c4\u5212\u80fd\u529b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u4fe1\u606f\uff0c**\u5b58\u5728\u9ad8\u98ce\u9669\u76f2\u533a**\u3002\n- **\u5e95\u5ea7\u53d6\u77ed\u677f**\uff1a**\u4e2d** (\u56e0\u8d44\u91d1\u548c\u5bb6\u5ead\u7ef4\u5ea6\u4fe1\u606f\u7f3a\u5931\uff0c\u65e0\u6cd5\u5224\u65ad\u4e3a\u201c\u9ad8\u201d\uff1b\u65f6\u95f4\u7cbe\u529b\u7ef4\u5ea6\u4e3a\u201c\u4e2d\u201d\uff0c\u6545\u6574\u4f53\u8bc4\u7ea7\u53d6\u201c\u4e2d\u201d\uff0c\u4f46\u9700\u9ad8\u5ea6\u8b66\u60d5\u672a\u77e5\u98ce\u9669)\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u5728\u672a\u6536\u5230\u4f5c\u4e1a\u70b9\u8bc4\u65f6\uff0c\u4e3b\u52a8\u3001\u91cd\u590d\u5730\u8ffd\u95ee\u201c\u60a8\u597d\uff0c\u6ca1\u6709\u8fdb\u884c\u70b9\u8bc4\u201d\uff0c\u8868\u73b0\u51fa\u5bf9\u5373\u65f6\u53cd\u9988\u548c\u5916\u90e8\u8ba4\u53ef\u7684\u5f3a\u70c8\u4f9d\u8d56\u3002\u5bf9\u53d8\u73b0\u8def\u5f84\u7684\u6025\u5207\u8be2\u95ee\u4e5f\u663e\u793a\u51fa\u5bf9\u786e\u5b9a\u6027\u7684\u9ad8\u9700\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u60a8\u597d\uff0c\u6ca1\u6709\u8fdb\u884c\u70b9\u8bc4\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u4f5c\u4e3a\u5b66\u751f\uff0c\u5bf9**\u672a\u6765\u7ecf\u6d4e\u72ec\u7acb\u548c\u804c\u4e1a\u4fdd\u969c\u7684\u6df1\u5c42\u7126\u8651**\u3002\u5176\u201c\u7740\u6025\u8d5a\u94b1\u201d\u7684\u8868\u8c61\u4e0b\uff0c\u662f\u5e0c\u671b\u901a\u8fc7\u5feb\u901f\u638c\u63e1\u4e00\u9879\u6280\u80fd\u6765\u83b7\u5f97\u5b89\u5168\u611f\u548c\u5bf9\u672a\u6765\u7684\u638c\u63a7\u611f\uff0c\u4ee5\u5e94\u5bf9\u5373\u5c06\u6b65\u5165\u793e\u4f1a\u7684\u4e0d\u786e\u5b9a\u6027\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u7684\u8def\u5f84\u89c4\u5212\u548c\u5373\u65f6\u3001\u5177\u4f53\u7684\u6b63\u5411\u53cd\u9988**\u3002\u4ed6\u9700\u8981\u88ab\u6e05\u6670\u5730\u544a\u77e5\u201c\u7b2c\u4e00\u6b65\u505a\u4ec0\u4e48\u3001\u7b2c\u4e8c\u6b65\u505a\u4ec0\u4e48\u201d\uff0c\u5e76\u4e14\u6bcf\u4e00\u6b65\u90fd\u80fd\u5f97\u5230\u786e\u8ba4\u548c\u9f13\u52b1\uff0c\u4ee5\u7f13\u89e3\u5176\u56e0\u4e0d\u786e\u5b9a\u6027\u800c\u4ea7\u751f\u7684\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b (\u51b2\u52a8\u98ce\u9669\u578b)** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u4f9d\u8d56\u5916\u90e8\u53cd\u9988\uff0c\u60c5\u7eea\u6613\u6ce2\u52a8\uff0c\u5bf9\u786e\u5b9a\u6027\u8981\u6c42\u9ad8) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u804a\u5929\u8bb0\u5f55\u672a\u663e\u793a\u501f\u8d37\u3001\u5bb6\u5ead\u53cd\u5bf9\u7b49\u7194\u65ad\u7ea2\u7ebf)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a/\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u9ad8** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u82e5\u652f\u4ed8\u884c\u4e3a\u9690\u7792\u5bb6\u4eba\u6216\u4f7f\u7528\u975e\u5e38\u89c4\u8d44\u91d1\uff08\u5982\u751f\u6d3b\u8d39\u3001\u501f\u6b3e\uff09\uff0c\u4e00\u65e6\u88ab\u5bb6\u4eba\u53d1\u73b0\uff0c\u9000\u8d39\u98ce\u9669\u6781\u9ad8\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u5b66\u751f\u5b66\u4e1a\u538b\u529b\u4e0e\u8bfe\u7a0b\u65f6\u95f4\u51b2\u7a81\uff0c\u5bfc\u81f4\u4f5c\u4e1a\u79ef\u538b\u3001\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\uff0c\u4ea7\u751f\u632b\u8d25\u611f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u4e00\u65e6\u5b66\u4e60\u9047\u5230\u6280\u672f\u56f0\u96be\uff08\u5982\u8f6f\u4ef6\u64cd\u4f5c\uff09\u3001\u6216\u63a5\u5355\u53d8\u73b0\u901f\u5ea6\u8fdc\u4f4e\u4e8e\u9884\u671f\uff08\u201c\u7b2c\u516b\u5929\u63a5\u5355\u201d\u4f46\u65e0\u5b9e\u9645\u6536\u5165\uff09\u3001\u6216\u672a\u5f97\u5230\u53ca\u65f6\u70b9\u8bc4\u53cd\u9988\uff0c\u6781\u6613\u56e0\u81ea\u5c0a\u5fc3\u53d7\u632b\u548c\u7126\u8651\u800c\u60c5\u7eea\u5d29\u6e83\uff0c\u8981\u6c42\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u6781\u9ad8** | \u5bf9\u201c\u7740\u6025\u8d5a\u94b1\u201d\u548c\u201c\u65f6\u85aa\u201d\u62b1\u6709\u6781\u9ad8\u3001\u4e0d\u5207\u5b9e\u9645\u7684\u77ed\u671f\u671f\u671b\u3002\u5f53\u53d1\u73b0\u5b66\u4e60\u66f2\u7ebf\u957f\u3001\u53d8\u73b0\u95e8\u69db\u9ad8\u65f6\uff0c\u4f1a\u7acb\u523b\u611f\u5230\u88ab\u6b3a\u9a97\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c8-14\u5929**\u3002\u6b64\u65f6\u201c\u7b2c\u516b\u5929\u5f00\u901a\u8bd5\u97f3\u6e20\u9053\u201d\u7684\u627f\u8bfa\u53ef\u80fd\u65e0\u6cd5\u5151\u73b0\u4e3a\u5b9e\u9645\u6536\u5165\uff0c\u4e14\u8bfe\u7a0b\u96be\u5ea6\u63d0\u5347\uff0c\u53cc\u91cd\u538b\u529b\u4e0b\u6781\u6613\u5f15\u7206\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u540c\u5b66\u4f60\u597d\uff01\u770b\u5230\u4f60\u5b66\u4e60\u5f88\u79ef\u6781\uff0c\u4f5c\u4e1a\u4e5f\u5b8c\u6210\u5f97\u5f88\u8ba4\u771f\uff0c\u7279\u522b\u68d2\uff01\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u7a0b\u662f\u2018\u6280\u80fd\u7b51\u57fa+\u5b9e\u6218\u63a5\u5355\u2019\u4e24\u6b65\u8d70\u3002**\u7b2c\u4e00\u6b65**\u54b1\u4eec\u5148\u7a33\u624e\u7a33\u6253\u628a\u57fa\u672c\u529f\u7ec3\u597d\uff0c\u6211\u4f1a\u7ed9\u4f60\u8be6\u7ec6\u7684\u6bcf\u65e5\u5b66\u4e60\u8ba1\u5212\u548c\u5373\u65f6\u53cd\u9988\uff1b**\u7b2c\u4e8c\u6b65**\uff0c\u5927\u6982\u5728\u7b2cX\u5468\uff0c\u6211\u4f1a\u624b\u628a\u624b\u5e26\u4f60\u8d70\u4e00\u904d\u5b8c\u6574\u7684\u8bd5\u97f3\u6d41\u7a0b\u3002\u522b\u62c5\u5fc3\u8fdb\u5ea6\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u6bcf\u5b8c\u6210\u4e00\u4e2a\u5c0f\u76ee\u6807\u6211\u90fd\u4f1a\u544a\u8bc9\u4f60\u2018\u505a\u5f97\u5bf9\u2019\uff0c\u8fd9\u6837\u4f60\u5fc3\u91cc\u5c31\u6709\u5e95\u4e86\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011** (\u5fc5\u987b\u642d\u914d\u5f3a\u9884\u671f\u7ba1\u7406)\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u8865\u5145\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u5305\u542b\uff1a1) **\u65e5\u6e05\u65e5\u7ed3\u5f0f\u53cd\u9988**\uff1a\u5bf9\u5176\u63d0\u4ea4\u7684\u6bcf\u9879\u4f5c\u4e1a\u5fc5\u987b\u572824\u5c0f\u65f6\u5185\u7ed9\u4e88\u5177\u4f53\u3001\u79ef\u6781\u7684\u70b9\u8bc4\u30022) **\u5fae\u76ee\u6807\u62c6\u89e3**\uff1a\u5c06\u5927\u4efb\u52a1\u62c6\u89e3\u4e3a\u4ee5\u201c\u5929\u201d\u4e3a\u5355\u4f4d\u7684\u3001\u53ef\u8fbe\u6210\u7684\u5c0f\u4efb\u52a1\uff0c\u5e76\u6bcf\u65e5\u786e\u8ba4\u5b8c\u6210\u60c5\u51b5\u30023) **\u5fc3\u7406\u6309\u6469\u8bdd\u672f\u5e93**\uff1a\u9488\u5bf9\u5176\u201c\u7740\u6025\u201d\u548c\u201c\u6c42\u8ba4\u53ef\u201d\u7684\u5fc3\u6001\uff0c\u51c6\u5907\u5b89\u629a\u8bdd\u672f\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1) \u627f\u8bfa\u5177\u4f53\u53d8\u73b0\u91d1\u989d\u548c\u65f6\u95f4\uff08\u5982\u201c\u5b66\u5b8c\u4fdd\u5e95\u6708\u5165X\u5343\u201d\uff09\u30022) \u5728\u5176\u7126\u8651\u8be2\u95ee\u65f6\u4f7f\u7528\u6a21\u7cca\u8bdd\u672f\uff08\u5982\u201c\u597d\u597d\u5b66\u5c31\u884c\u201d\uff09\uff0c\u5fc5\u987b\u7ed9\u51fa\u5177\u4f53\u3001\u53ef\u6267\u884c\u7684\u4e0b\u4e00\u6b65\u52a8\u4f5c\u30023) \u5ef6\u8fdf\u6216\u5ffd\u7565\u5176\u4f5c\u4e1a\u53cd\u9988\u8bf7\u6c42\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u5b8c\u6210\u5f53\u524d\u8bfe\u7a0b\u5e76\u6709\u7a33\u5b9a\u4ea7\u51fa\uff08\u5982\u6210\u529f\u8bd5\u97f31-2\u6b21\uff09\u524d\uff0c\u7981\u6b62\u63a8\u8350\u4efb\u4f55\u9ad8\u9636\u8bfe\u7a0b\u6216\u9644\u52a0\u670d\u52a1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u56e0\u4e3a\u786e\u5b9e\u5f88\u7740\u6025\u8d5a\u94b1\u201d\n2. > \u201c\u65f6\u85aa\u5927\u6982\u80fd\u8fbe\u5230\u591a\u5c11\u554a\u201d\n3. > \u201c\u60a8\u597d\uff0c\u6ca1\u6709\u8fdb\u884c\u70b9\u8bc4\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6\u60c5\u7eea\u5de8\u5a74\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\uff08\u7ecf\u6d4e\u4fdd\u969c\u4e0e\u804c\u4e1a\u5b89\u5168\u611f\uff09**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u6781\u5ea6\u786e\u5b9a\u6027\u7684\u5b66\u4e60\u8def\u5f84\u4e0e\u5373\u65f6\u3001\u9ad8\u9891\u7684\u6b63\u5411\u53cd\u9988\uff0c\u4e25\u9632\u6536\u76ca\u627f\u8bfa\u843d\u7a7a**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"maslow_need\": \"\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\", \"risk_level\": \"\u6781\u9ad8\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf + \u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\"}\n```";
