    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n> **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4e3b\u8981\u56f4\u7ed5\u4f53\u9a8c\u8425\u5b66\u4e60\u4e0e\u8f6c\u5316\u8fc7\u7a0b\uff0c\u7f3a\u5931\u5173\u4e8e\u7528\u6237**\u652f\u4ed8\u65b9\u5f0f\u3001\u5bb6\u5ead\u8d22\u52a1\u72b6\u51b5\u3001\u5177\u4f53\u804c\u4e1a\u4e0e\u4f5c\u606f\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386**\u7b49\u5173\u952e\u4fe1\u606f\uff0c\u5bfc\u81f4\u5bf9\u8d44\u6e90\u5e95\u5ea7\uff08\u7279\u522b\u662f\u8d44\u91d1\u627f\u8f7d\u529b\uff09\u548c\u5fc3\u7406\u5f39\u6027\u7684\u5224\u65ad\u5b58\u5728\u63a8\u6d4b\u6210\u5206\u3002\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 83270821 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u653e\u98de\u7684\u5927\u773c\u775b(\u5f20\u57f9\u6e05) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u4e24\u4e2a\u6708\u7cbe\u82f1\u7248\u8bfe\u7a0b (\u4ef7\u683c\u672a\u660e\u793a\uff0c\u63a8\u6d4b\u4e3a3980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **[\u4fe1\u606f\u7f3a\u5931]** |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u9700\u52a0\u73ed\uff0c\u5b66\u4e60\u9700\u89c1\u7f1d\u63d2\u9488) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **[\u4fe1\u606f\u7f3a\u5931]** |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5e76\u5173\u5fc3\u201c\u80fd\u83b7\u5f97\u6536\u5165\u5417\uff1f\u201d\uff0c\u4f46\u540c\u65f6\u4e5f\u63d0\u53ca\u201c\u957f\u957f\u89c1\u8bc6\uff0c\u62d3\u5bbd\u4e00\u4e0b\u4eba\u8109\u201d\uff0c\u52a8\u673a\u4e2d\u6df7\u6742\u4e86\u5174\u8da3\u63a2\u7d22\u548c\u793e\u4ea4\u9700\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u60f3\u8d5a\u94b1\uff0c\u6700\u597d\u518d\u80fd\u6539\u53d8\u4e00\u4e0b\u201d\uff1b > \u201c\u6211\u5c31\u662f\u89c9\u5f97\u80fd\u957f\u957f\u89c1\u8bc6\uff0c\u62d3\u5bbd\u4e00\u4e0b\u4eba\u8109\uff0c\u8fd8\u80fd\u6323\u94b1\u624d\u4e86\u89e3\u7684\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u4fe1\u606f\u7f3a\u5931]** \u2014 \u7528\u6237\u8868\u793a\u201c\u957f\u671f\u7684\u73b0\u9636\u6bb5\u786e\u5b9e\u8fd8\u6709\u538b\u529b\u201d\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u7ecf\u6d4e\u72b6\u51b5\uff0c\u5b58\u5728\u4e0d\u786e\u5b9a\u6027\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e** \u2014 \u660e\u786e\u8868\u793a\u201c\u6211\u8fd8\u5728\u52a0\u73ed\u201d\uff0c\u5b66\u4e60\u65f6\u95f4\u9700\u201c\u7b49\u4f1a\u6211\u5c31\u770b\u7740\u5b8c\u6210\u201d\uff0c\u5c5e\u4e8e\u5178\u578b\u7684\u788e\u7247\u5316\u65f6\u95f4\u62fc\u51d1\u578b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u4fe1\u606f\u7f3a\u5931]** \u2014 \u65e0\u4efb\u4f55\u63d0\u53ca\uff0c\u65e0\u6cd5\u5224\u65ad\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b07\u4f4e\u6781\u5371]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u7528\u6237\u591a\u6b21\u4f7f\u7528\u201c[\u6342\u8138]\u201d\u8868\u60c5\uff0c\u5bf9\u6280\u672f\u7ec6\u8282\uff08\u5982\u89c6\u9891\u8fdb\u5ea6\u6761\u3001\u6587\u672c\u683c\u5f0f\uff09\u654f\u611f\u4e14\u6613\u4ea7\u751f\u81ea\u6211\u6000\u7591\uff0c\u5728\u9500\u552e\u8be2\u95ee\u5b66\u4e60\u611f\u53d7\u65f6\u76f4\u63a5\u56de\u7b54\u201c\u4e0d\u662f\u5f88\u597d\u201d\uff0c\u5e76\u6d41\u9732\u51fa\u201c\u5982\u679c\u6211\u80fd\u529b\u4e0d\u884c\u7684\u8bdd\u5c31\u4e0d\u5f3a\u6c42\u4e86\u201d\u7684\u9000\u7f29\u5fc3\u6001\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4e0d\u662f\u5f88\u597d\u201d\uff1b > \u201c\u6ca1\u5173\u7cfb\uff0c\u8fc7\u4e0d\u4e86\u7684\u8bdd\u4e86\u89e3\u5230\u4f60\u4eec\u8fd9\u4e48\u5389\u5bb3\u7684\u4eba\u4e5f\u5f88\u597d\u5566\u201d\uff1b > \u201c\u8fd9\u6b21\u8981\u662f\u518d\u548c\u4e0a\u6b21\u90a3\u6837\uff0c\u6211\u771f\u5c31[\u6342\u8138]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c / \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u81ea\u8eab\u80fd\u529b\u6781\u5ea6\u4e0d\u81ea\u4fe1\uff0c\u5bb3\u6015\u6295\u5165\u540e\u518d\u6b21\u5931\u8d25**\u3002\u4ed6\u63d0\u5230\u201c\u8fd9\u6b21\u8981\u662f\u518d\u548c\u4e0a\u6b21\u90a3\u6837\uff0c\u6211\u771f\u5c31[\u6342\u8138]\u201d\uff0c\u6697\u793a\u6709\u5931\u8d25\u7ecf\u5386\uff0c\u5bfc\u81f4\u5176\u51b3\u7b56\u6838\u5fc3\u662f\u89c4\u907f\u98ce\u9669\u3001\u5bfb\u6c42\u5b89\u5168\u611f\uff0c\u800c\u975e\u8ffd\u6c42\u9ad8\u6536\u76ca\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6301\u7eed\u3001\u5177\u4f53\u7684\u80af\u5b9a\u4e0e\u9f13\u52b1\uff0c\u4ee5\u53ca\u201c\u5931\u8d25\u8c41\u514d\u201d\u7684\u5b89\u5168\u627f\u8bfa**\u3002\u4ed6\u9700\u8981\u88ab\u53cd\u590d\u544a\u77e5\u201c\u4f60\u53ef\u4ee5\u201d\uff0c\u5e76\u9700\u8981\u4e00\u4e2a\u201c\u5373\u4f7f\u6700\u5dee\u4e5f\u80fd\u4fdd\u5e95\u201d\u7684\u660e\u786e\u9884\u671f\u6765\u5bf9\u51b2\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1** \u7c7b (\u52a8\u673a\u4e2d\u7b49\u4f46\u8d44\u6e90\u4e0e\u5fc3\u7406\u5f39\u6027\u53cc\u4f4e\uff0c\u9700\u5f3a\u6276\u6301) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u4f9d\u8d56\u6027\u5f3a\uff0c\u6613\u56e0\u6280\u672f\u7ec6\u8282\u6216\u81ea\u6211\u6000\u7591\u800c\u9000\u7f29\uff0c\u9700\u8981\u9ad8\u9891\u60c5\u7eea\u5b89\u629a) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u8bc1\u636e\u8868\u660e\u5b58\u5728\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5c5e\u6fc0\u70c8\u53cd\u5bf9\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4e2d | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u82e5\u652f\u4ed8\u6709\u538b\u529b\u6216\u9690\u7792\u5bb6\u4eba\uff0c\u98ce\u9669\u5b58\u5728\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u52a0\u73ed\u5bfc\u81f4\u65e0\u6cd5\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u6216\u89c2\u770b\u76f4\u64ad\uff0c\u79ef\u7d2f\u632b\u8d25\u611f\u540e\u653e\u5f03\u3002** |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u9996\u6b21\u72ec\u7acb\u5b8c\u6210\u8bd5\u97f3\u6216\u4f5c\u4e1a\u65f6\uff0c\u56e0\u8f6f\u4ef6\u64cd\u4f5c\u3001\u6587\u672c\u7406\u89e3\u56f0\u96be\u6216\u81ea\u6211\u611f\u89c9\u201c\u5f55\u5f97\u4e0d\u597d\u201d\u800c\u81ea\u5c0a\u5fc3\u53d7\u632b\uff0c\u76f4\u63a5\u6446\u70c2\u3002** |\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c\u4e00\u5468\uff0c\u9996\u6b21\u63d0\u4ea4\u6b63\u5f0f\u4f5c\u4e1a\u6216\u72ec\u7acb\u8bd5\u97f3\u4efb\u52a1\u65f6\u3002**\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5e08\u5144/\u5e08\u59d0\uff0c\u6211\u770b\u5230\u4f60\u62a5\u540d\u65f6\u63d0\u5230\u2018\u6015\u548c\u4e0a\u6b21\u4e00\u6837\u2019\uff0c\u7279\u522b\u7406\u89e3\u8fd9\u79cd\u62c5\u5fc3\u3002\u54b1\u4eec\u8fd9\u6b21\u4e0d\u8ddf\u522b\u4eba\u6bd4\uff0c\u5c31\u8ddf\u4f60\u81ea\u5df1\u6bd4\u3002\u6211\u7ed9\u4f60\u5b9a\u4e2a\u5c0f\u76ee\u6807\uff0c\u54ea\u6015\u6bcf\u5929\u53ea\u7ec310\u5206\u949f\uff0c\u53ea\u8981\u6bd4\u6628\u5929\u597d\u4e00\u70b9\uff0c\u54b1\u4eec\u5c31\u8d62\u4e86\u3002\u6709\u4efb\u4f55\u5361\u4f4f\u7684\u5730\u65b9\uff0c\u54ea\u6015\u89c9\u5f97\u95ee\u9898\u518d\u5c0f\uff0c\u968f\u65f6\u6233\u6211\uff0c\u6211\u5e2e\u4f60\u4e00\u8d77\u770b\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf**\u3011\u3002\u6838\u5fc3\u76ee\u6807\u662f\u5efa\u7acb\u4fe1\u5fc3\u3001\u5b8c\u6210\u5b66\u4e60\u95ed\u73af\uff0c\u800c\u975e\u5feb\u901f\u63a5\u5355\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n    1.  **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\uff1a\u73ed\u4e3b\u4efb\u9700\u9ad8\u9891\u3001\u5177\u4f53\u5730\u8868\u626c\u5176\u4efb\u4f55\u5fae\u5c0f\u8fdb\u6b65\uff08\u5982\u201c\u4eca\u5929\u6c14\u606f\u7a33\u4e86\u4e00\u70b9\u201d\uff09\u3002\n    2.  **\u3010\u6781\u7b80\u4efb\u52a1\u62c6\u89e3\u5305\u3011**\uff1a\u5c06\u590d\u6742\u4f5c\u4e1a\u62c6\u89e3\u6210\u201c\u7b2c\u4e00\u6b65\u3001\u7b2c\u4e8c\u6b65\u201d\u7684\u50bb\u74dc\u5f0f\u6307\u5f15\u3002\n    3.  **\u3010\u6280\u672f\u515c\u5e95\u5305\u3011**\uff1a\u63d0\u4f9b\u6e05\u6670\u7684\u8f6f\u4ef6\u5b89\u88c5\u3001\u64cd\u4f5c\u56fe\u6587/\u89c6\u9891\u6307\u5357\uff0c\u5e76\u627f\u8bfa\u201c\u641e\u4e0d\u5b9a\u968f\u65f6\u627e\u6211\u201d\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u7edd\u4e0d\u5bf9\u4ed6\u65bd\u538b\u6216\u8fdb\u884c\u6a2a\u5411\u6bd4\u8f83\uff08\u5982\u201c\u522b\u4eba\u90fd\u4ea4\u4e86\u201d\uff09\u30022. \u7edd\u4e0d\u5728\u4ed6\u8868\u8fbe\u56f0\u96be\u65f6\u53ea\u8bf4\u201c\u591a\u7ec3\u7ec3\u201d\u7b49\u7a7a\u8bdd\u30023. \u7edd\u4e0d\u5728\u521d\u671f\u5c31\u5f3a\u8c03\u9ad8\u96be\u5ea6\u63a5\u5355\u548c\u9ad8\u6536\u5165\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728C1\u9636\u6bb5\uff0c\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u53ef\u80fd\u89e6\u53d1\u5176\u201c\u88ab\u5272\u97ed\u83dc\u201d\u7684\u6050\u60e7\uff0c\u5bfc\u81f4\u5d29\u76d8\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u8fd9\u6b21\u8981\u662f\u518d\u548c\u4e0a\u6b21\u90a3\u6837\uff0c\u6211\u771f\u5c31[\u6342\u8138]\u201d\n2. > \u201c\u6ca1\u5173\u7cfb\uff0c\u8fc7\u4e0d\u4e86\u7684\u8bdd\u4e86\u89e3\u5230\u4f60\u4eec\u8fd9\u4e48\u5389\u5bb3\u7684\u4eba\u4e5f\u5f88\u597d\u5566\u201d\n3. > \u201c\u5982\u679c\u6211\u80fd\u529b\u4e0d\u884c\u7684\u8bdd\u5c31\u4e0d\u5f3a\u6c42\u4e86[\u6342\u8138]\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6\u60c5\u7eea\u5de8\u5a74\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u5b89\u5168\u4e0e\u966a\u4f34\uff08\u5bb3\u6015\u518d\u6b21\u5931\u8d25\uff09**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u73ed\u4e3b\u4efb\u63d0\u4f9b\u9ad8\u9891\u3001\u5177\u4f53\u3001\u5145\u6ee1\u9f13\u52b1\u7684\u201c\u624b\u628a\u624b\u201d\u5f0f\u966a\u5b66\uff0c\u5e76\u964d\u4f4e\u5176\u521d\u671f\u4efb\u52a1\u96be\u5ea6\u4e0e\u5fc3\u7406\u9884\u671f**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168/\u793e\u4ea4\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
