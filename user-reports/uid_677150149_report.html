    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u4e0e\u98ce\u63a7\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a**\u4e2d\u7b49**\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6709\u58f0\u6f14\u64ad\u7684\u5174\u8da3\u548c\u5c1d\u8bd5\u610f\u613f\uff08\u201c\u563f\u563f\uff0c\u8fd9\u4e9b\u659c\u6760\u5c97\u4f4d\u6211\u90fd\u5c1d\u8bd5\u4e00\u4e0b\uff0c\u627e\u5230\u81ea\u5df1\u9002\u5408\u7684\u201d\uff09\uff0c\u5e76\u4e3b\u52a8\u53c2\u4e0e\u8bd5\u97f3\u3001\u8ba8\u8bba\u97f3\u8272\u3002\u4f46\u6838\u5fc3\u9a71\u52a8\u529b\u504f\u5411**\u517c\u804c\u53d8\u73b0**\uff08\u201c\u6211\u60f3\u63a5\u5355\uff0c\u6211\u60f3\u8986\u76d6\u6389\u5b66\u8d39\u201d\uff09\uff0c\u5174\u8da3\u4e0e\u529f\u5229\u76ee\u7684\u5e76\u5b58\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4e2d\u7b49\u504f\u5f31**\u3002\u7528\u6237\u6709\u672c\u804c\u5de5\u4f5c\uff08\u201c\u6bd5\u7adf\u6211\u8fd8\u6709\u672c\u4e13\u4e1a\u5de5\u4f5c\u548c\u8bc1\u4e66\u8981\u8003\u201d\uff09\uff0c\u5177\u5907\u57fa\u7840\u5b66\u4e60\u65f6\u95f4\u3002\u4f46**\u7ecf\u6d4e\u538b\u529b\u663e\u8457**\uff08\u201c\u545c\u545c\u545c\uff0c\u80fd\u5206\u671f\u561b\u201d\u3001\u201c\u7b97\u4e86\uff0c\u4e0d\u60f3\u8d1f\u503a\u201d\u3001\u201c\u52c9\u5f3a\u591f\u5427\uff0c\u6211\u8981\u5403\u771f\u571f\u4e86\u201d\uff09\uff0c\u652f\u4ed8\u5b66\u8d39\u540e\u7ecf\u6d4e\u7f13\u51b2\u7a7a\u95f4\u6781\u5c0f\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a**\u4e2d\u7b49**\u3002\u7528\u6237\u4e92\u52a8\u79ef\u6781\uff0c\u80fd\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\u3001\u4e3b\u52a8\u63d0\u95ee\u3002\u4f46\u8868\u73b0\u51fa**\u660e\u663e\u7684\u9009\u62e9\u56f0\u96be\u548c\u8f7b\u5fae\u7126\u8651**\uff08\u201c\u6709\u70b9\u9009\u62e9\u56f0\u96be\u201d\u3001\u201c\u7d27\u5f20\ud83d\ude16\u201d\u3001\u201c\u6211\u5bb6\u91cc\u4eba\u62c5\u5fc3\u6211\u9047\u5230\u9a97\u5b50\u4e86\uff0c\u56e0\u4e3a\u6211\u5bb9\u6613\u53d7\u9a97\u201d\uff09\uff0c\u5bf9\u64cd\u4f5c\u7ec6\u8282\uff08\u5982APP\u4f7f\u7528\u3001\u683c\u5f0f\uff09\u6709\u4f9d\u8d56\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a**\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u6700\u7ec8\u5b8c\u6210\u9ad8\u9636\u8bfe\u7a0b\u652f\u4ed8\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u914d\u5076\u3001\u7236\u6bcd\u7b49\u5bb6\u5ead\u6210\u5458\u7684\u660e\u786e\u610f\u89c1\u3002\u4ec5\u63d0\u53ca\u201c\u5bb6\u91cc\u4eba\u62c5\u5fc3\u6211\u9047\u5230\u9a97\u5b50\u201d\uff0c\u4f46\u672a\u663e\u793a\u5176\u51b3\u7b56\u53d7\u5bb6\u5ead\u5236\u7ea6\u3002**\u89c6\u4e3a\u72ec\u7acb\u51b3\u7b56\uff0c\u4f46\u5bb6\u5ead\u652f\u6301\u5ea6\u5b58\u7591\u3002**\n*   **\u6b65\u9aa42-4\uff1a\u7efc\u5408\u5224\u5b9a**\uff1a\n    *   **\u652f\u4ed8\u80fd\u529b\u4e0e\u610f\u613f**\uff1a\u652f\u4ed8\u8fc7\u7a0b\u72b9\u8c6b\u3001\u7ecf\u6d4e\u538b\u529b\u5927\uff0c\u4f46\u6700\u7ec8\u5b8c\u6210\u652f\u4ed8\uff0c\u663e\u793a\u610f\u613f\u5f3a\u70c8\u4f46\u80fd\u529b\u7d27\u7ef7\u3002\n    *   **\u5b66\u4e60\u914d\u5408\u5ea6**\uff1a\u9ad8\u3002\u5168\u7a0b\u8ddf\u8fdb\u76f4\u64ad\u3001\u63d0\u4ea4\u4f5c\u4e1a\u3001\u53c2\u4e0e\u4e92\u52a8\u3001\u4e3b\u52a8\u8bd5\u97f3\u3002\n    *   **\u76ee\u6807\u6e05\u6670\u5ea6**\uff1a\u4e2d\u7b49\u3002\u6709\u5174\u8da3\u65b9\u5411\uff08\u65e0CP\u5973\u9891\uff09\uff0c\u4f46\u53d8\u73b0\u9884\u671f\u6a21\u7cca\u4e14\u6025\u5207\u3002\n    *   **\u5224\u5b9a\u7ed3\u679c**\uff1a**B\u7c7b\uff08\u9ad8\u610f\u613f-\u7d27\u8d44\u6e90\u578b\uff09**\u3002\u7528\u6237\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b\u5f3a\uff0c\u4f46\u7ecf\u6d4e\u8d44\u6e90\u8584\u5f31\uff0c\u5bf9\u6295\u8d44\u56de\u62a5\u6709\u6025\u5207\u671f\u5f85\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b\uff1aT4 \u8d44\u6e90\u7d27\u7ef7\u7684\u52a1\u5b9e\u63a2\u7d22\u8005**\u3002\n    *   \u7279\u5f81\u543b\u5408\uff1a\u6709\u660e\u786e\u7684\u517c\u804c\u589e\u6536\u76ee\u6807\uff0c\u884c\u52a8\u914d\u5408\u5ea6\u9ad8\uff0c\u4f46\u7ecf\u6d4e\u57fa\u7840\u8584\u5f31\uff0c\u652f\u4ed8\u540e\u538b\u529b\u611f\u5916\u663e\uff08\u201c\u5403\u771f\u571f\u201d\uff09\uff0c\u5bf9\u56de\u672c\u5468\u671f\u7684\u7126\u8651\u6f5c\u85cf\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\uff08\u6781\u9ad8\uff09\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u4e0d\u53ca\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u201c\u8986\u76d6\u5b66\u8d39\u201d\u6709\u6025\u5207\u3001\u5177\u4f53\u7684\u53d8\u73b0\u671f\u5f85\uff0c\u4e0e\u6709\u58f0\u884c\u4e1a\u6210\u957f\u5468\u671f\u53ef\u80fd\u4ea7\u751f\u4e25\u91cd\u51b2\u7a81\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u6781\u9ad8\u98ce\u9669**\u3002**\u652f\u4ed8\u540e\u7ecf\u6d4e\u72b6\u51b5\u7d27\u7ef7**\uff0c\u662f\u672a\u6765\u56e0\u4efb\u4f55\u5916\u90e8\u7ecf\u6d4e\u53d8\u52a8\uff08\u5982\u4e3b\u4e1a\u6536\u5165\u6ce2\u52a8\u3001\u610f\u5916\u652f\u51fa\uff09\u5f15\u53d1\u9000\u8d39\u7684\u6838\u5fc3\u96f7\u533a\u3002\n    3.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u4e2d\u98ce\u9669**\u3002\u5df2\u63d0\u53ca\u5bb6\u4eba\u62c5\u5fc3\u53d7\u9a97\uff0c\u867d\u672a\u76f4\u63a5\u53cd\u5bf9\uff0c\u4f46**\u7f3a\u4e4f\u5bb6\u5ead\u652f\u6301**\uff0c\u5728\u9047\u5230\u5b66\u4e60\u56f0\u96be\u6216\u53d8\u73b0\u5ef6\u8fdf\u65f6\uff0c\u5bb6\u5ead\u538b\u529b\u53ef\u80fd\u6210\u4e3a\u9000\u8d39\u5bfc\u706b\u7d22\u3002\n    4.  **\u5b66\u4e60\u96be\u5ea6**\uff1a\u4f4e\u98ce\u9669\u3002\u7528\u6237\u76ee\u524d\u53c2\u4e0e\u5ea6\u3001\u5b8c\u6210\u5ea6\u826f\u597d\uff0c\u4e14\u8868\u73b0\u51fa\u5174\u8da3\u3002\n    5.  **\u65f6\u95f4\u51b2\u7a81**\uff1a\u4f4e\u98ce\u9669\u3002\u7528\u6237\u80fd\u534f\u8c03\u65f6\u95f4\u53c2\u4e0e\u76f4\u64ad\u548c\u7ec3\u4e60\u3002\n    6.  **\u9500\u552e\u627f\u8bfa\u4e0d\u7b26**\uff1a\u4e2d\u98ce\u9669\u3002\u9500\u552e\u5f3a\u8c03\u201c\u517c\u804c\u201d\u3001\u201c\u53d8\u73b0\u201d\u3001\u201c\u63a5\u5355\u201d\uff0c\u53ef\u80fd\u5f3a\u5316\u4e86\u7528\u6237\u4e0d\u5207\u5b9e\u9645\u7684\u77ed\u671f\u6536\u76ca\u9884\u671f\u3002\n    7.  **\u670d\u52a1\u4f53\u9a8c**\uff1a\u4f4e\u98ce\u9669\u3002\u76ee\u524d\u4e92\u52a8\u6b63\u5e38\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u98ce\u9669\u70b9**\uff1a\n    *   **\u8fc7\u5ea6\u627f\u8bfa\u98ce\u9669**\uff1a\u9500\u552e\u591a\u6b21\u4f7f\u7528\u201c\u517c\u804c\u201d\u3001\u201c\u53d8\u73b0\u201d\u3001\u201c\u63a5\u5355\u201d\u3001\u201c\u85aa\u8d44\u8ba1\u7b97\u201d\u7b49\u8bcd\u6c47\uff0c\u53ef\u80fd**\u5938\u5927\u77ed\u671f\u6536\u76ca**\uff0c\u672a\u5145\u5206\u63d0\u793a\u884c\u4e1a\u6210\u957f\u5468\u671f\u548c\u4e0d\u786e\u5b9a\u6027\u3002\n    *   **\u538b\u529b\u903c\u5355**\uff1a\u5728\u7528\u6237\u660e\u786e\u7ecf\u6d4e\u56f0\u96be\u65f6\uff0c\u9500\u552e\u4f7f\u7528\u201c\u5238\u5feb\u6ca1\u4e86\u201d\u3001\u201c\u5df2\u7ecf\u5728\u50ac\u6211\u8981\u5238\u4e86\u201d\u7b49\u8bdd\u672f**\u5236\u9020\u7a00\u7f3a\u611f**\uff0c\u53ef\u80fd\u52a0\u91cd\u7528\u6237\u975e\u7406\u6027\u51b3\u7b56\u3002\n    *   **\u77e5\u60c5\u540c\u610f**\uff1a\u6d41\u7a0b\u5408\u89c4\uff0c\u4f46\u7528\u6237\u201c\u5bb9\u6613\u53d7\u9a97\u201d\u7684\u81ea\u8ff0\u63d0\u793a\uff0c\u9700\u989d\u5916\u786e\u4fdd\u5176\u5bf9\u8bfe\u7a0b\u6027\u8d28\u3001\u670d\u52a1\u5185\u5bb9\u3001\u53d8\u73b0\u96be\u5ea6\u7684\u7406\u89e3\u662f\u5145\u5206\u7684\u3002\n*   **\u5408\u89c4\u6027**\uff1a\u57fa\u672c\u6d41\u7a0b\u5408\u89c4\uff0c\u4f46**\u5728\u98ce\u9669\u63d0\u793a\u548c\u9884\u671f\u7ba1\u7406\u4e0a\u5b58\u5728\u4e0d\u8db3**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d**\uff1a**\u504f\u5dee**\u3002\u7528\u6237\u201c\u517c\u804c\u5feb\u901f\u8986\u76d6\u5b66\u8d39\u201d\u7684\u8bc9\u6c42\u4e0e\u201c\u9ad8\u9636\u4e13\u4e1a\u8def\u7ebf\u201d\u4ea7\u54c1\u6240\u9700\u7684\u957f\u671f\u6295\u5165\u548c\u7f13\u6162\u56de\u62a5\u7279\u6027\u5b58\u5728\u6839\u672c\u77db\u76fe\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**24\u5c0f\u65f6\u5185\u542f\u52a8\u9884\u671f\u7ba1\u7406\u4e0e\u8d22\u52a1\u5173\u6000**\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u7d27\u6025\u9884\u671f\u6821\u6b63\uff08\u9996\u5468\u6838\u5fc3\uff09**\uff1a\u5fc5\u987b\u5728\u4e00\u5bf9\u4e00\u6c9f\u901a\u4e2d\uff0c**\u660e\u786e\u3001\u5177\u4f53\u3001\u91cf\u5316\u5730\u6f84\u6e05**\uff1a\u2460 \u6709\u58f0\u517c\u804c\u7684\u5e73\u5747\u6210\u957f\u5468\u671f\uff08\u5982\uff1a3-6\u4e2a\u6708\u5165\u95e8\uff0c1\u5e74\u4ee5\u4e0a\u53ef\u80fd\u7a33\u5b9a\u63a5\u5355\uff09\uff1b\u2461 \u521d\u671f\u5355\u91cf\u3001\u5355\u4ef7\u7684\u4e0d\u786e\u5b9a\u6027\uff1b\u2462 \u201c\u8986\u76d6\u5b66\u8d39\u201d\u9700\u8981\u7684\u65f6\u95f4\u4e0e\u52aa\u529b\u7a0b\u5ea6\u3002**\u7ba1\u7406\u5176\u201c\u5feb\u901f\u56de\u672c\u201d\u7684\u5e7b\u60f3**\u3002\n    2.  **\u5f3a\u5316\u60c5\u611f\u652f\u6301\u4e0e\u98ce\u9669\u7f13\u51b2**\uff1a\u627f\u8ba4\u5176\u652f\u4ed8\u51b3\u5b9a\u7684\u52c7\u6c14\uff0c\u8868\u8fbe\u5bf9\u5176\u7ecf\u6d4e\u538b\u529b\u7684\u7406\u89e3\u3002\u5efa\u7acb\u9ad8\u9891\u3001\u6e29\u6696\u7684\u8054\u7cfb\uff0c\u5728\u5176\u8868\u8fbe\u7ecf\u6d4e\u7126\u8651\u65f6\uff08\u5982\u201c\u5403\u571f\u201d\uff09\uff0c\u63d0\u4f9b\u60c5\u611f\u652f\u6301\u800c\u975e\u5355\u7eaf\u9f13\u52b1\u63a5\u5355\u3002\n    3.  **\u805a\u7126\u5174\u8da3\u4e0e\u5fae\u5c0f\u6b63\u53cd\u9988**\uff1a\u5f15\u5bfc\u5176\u5173\u6ce8\u6f14\u64ad\u672c\u8eab\u7684\u4e50\u8da3\u548c\u6280\u80fd\u63d0\u5347\uff08\u5982\u5979\u63d0\u5230\u7684\u201c\u66f4\u6709\u611f\u89c9\u201d\uff09\uff0c\u800c\u975e\u5355\u7eaf\u5173\u6ce8\u53d8\u73b0\u3002\u4e3a\u5176\u521b\u9020\u65e9\u671f\u3001\u4f4e\u95e8\u69db\u7684\u6210\u5c31\u611f\u4f53\u9a8c\uff08\u5982\u4f5c\u54c1\u88ab\u8868\u626c\uff09\u3002\n    4.  **\u5bb6\u5ead\u5173\u7cfb\u8bd5\u63a2**\uff1a\u4ee5\u5173\u6000\u65b9\u5f0f\uff0c\u6e29\u548c\u4e86\u89e3\u5bb6\u4eba\u5bf9\u5176\u5b66\u4e60\u7684\u6001\u5ea6\uff0c\u4e89\u53d6\u6210\u4e3a\u76df\u53cb\uff0c\u6216\u81f3\u5c11\u907f\u514d\u6210\u4e3a\u53cd\u5bf9\u8005\u3002\n    5.  **\u8fdb\u5ea6\u900f\u660e\u5316**\uff1a\u6e05\u6670\u544a\u77e5\u5b66\u4e60\u8def\u5f84\u3001\u6bcf\u4e2a\u9636\u6bb5\u7684\u4ea7\u51fa\u548c\u76ee\u6807\uff0c\u51cf\u5c11\u56e0\u4e0d\u786e\u5b9a\u6027\u4ea7\u751f\u7684\u7126\u8651\u3002\n\n{\"core_type\": \"T4 \u8d44\u6e90\u7d27\u7ef7\u7684\u52a1\u5b9e\u63a2\u7d22\u8005\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"product_match\": \"\u504f\u5dee\", \"action\": \"24\u5c0f\u65f6\u5185\u542f\u52a8\u9884\u671f\u7ba1\u7406\u4e0e\u8d22\u52a1\u5173\u6000\"}";
