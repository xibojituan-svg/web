    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a**\u6df7\u5408\u578b**\u3002\u5174\u8da3\u9a71\u52a8\uff08\u201c\u5174\u8da3\u7231\u597d\u201d\uff09\u3001\u6280\u80fd\u63d0\u5347\uff08\u201c\u638c\u63e1\u65c1\u767d\u8282\u594f\u201d\u3001\u201c\u5bfc\u6f14\u601d\u7ef4\u201d\uff09\u4e0e\u53d8\u73b0\u671f\u671b\uff08\u201c\u8d5a\u70b9\u5c0f\u7c73\u7c73\u201d\uff09\u5e76\u5b58\u3002\u4e3b\u52a8\u5206\u4eab\u8003\u8bc1\u7ecf\u9a8c\u3001\u5e2e\u52a9\u65b0\u540c\u5b66\uff0c\u5b66\u4e60\u5185\u9a71\u529b\u5f3a\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4e2d\u7b49**\u3002\u5177\u5907\u57fa\u7840\u8bbe\u5907\uff08\u58f0\u5361\u3001AU\u8f6f\u4ef6\uff09\uff0c\u4f46\u73af\u5883\u6709\u77ed\u677f\uff08\u81ea\u8ff0\u623f\u6df78.5\uff0c\u5f71\u54cd\u8bd5\u97f3\uff09\u3002\u6709\u65f6\u95f4\u6295\u5165\uff08\u4e2d\u5348\u62bd\u7a7a\u8003\u8bd5\u3001\u8ddf\u8fdb\u8bfe\u7a0b\uff09\uff0c\u652f\u4ed8\u4e86474\u5143\u97f3\u526a\u9644\u52a0\u670d\u52a1\uff0c\u6d88\u8d39\u51b3\u7b56\u679c\u65ad\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a**\u9ad8**\u3002\u9762\u5bf9\u8bd5\u97f3\u201c8\u6b21\u672a\u8fc7\u201d\u80fd\u81ea\u6211\u8c03\u4f83\u201c\u91cd\u62fe\u4fe1\u5fc3\u201d\uff1b\u9047\u5230\u6280\u672f\u95ee\u9898\uff08AU\u5d29\u76d8\uff09\u80fd\u4e3b\u52a8\u6392\u67e5\u89e3\u51b3\uff08\u91cd\u542f\u3001\u91cd\u63d2\uff09\uff1b\u5728\u793e\u7fa4\u4e2d\u79ef\u6781\u3001\u4e92\u52a9\uff08\u4e3b\u52a8\u89e3\u7b54\u65b0\u540c\u5b66\u95ee\u9898\uff09\uff0c\u60c5\u7eea\u7a33\u5b9a\u4e14\u4e50\u89c2\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u5df2\u652f\u4ed8\u8fdb\u9636\u8bfe\u7a0b\u5b66\u8d39\uff08\u53ef\u8fdb\u73ed\uff09\uff0c\u5e76\u989d\u5916\u652f\u4ed8474\u5143\u97f3\u526a\u670d\u52a1\u8d39\u3002**\u652f\u4ed8\u5b8c\u6210**\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u914d\u5076\u3001\u7236\u6bcd\u7b49\u5bb6\u5ead\u5176\u4ed6\u6210\u5458\u610f\u89c1\u3002\u7528\u6237\u51b3\u7b56\u72ec\u7acb\uff0c\u63d0\u53ca\u201c\u5a03\u5f88\u5c0f\u5c31\u5f00\u901a\u4e86\u201d\u8d26\u53f7\uff0c\u6697\u793a\u5176\u4e3a\u5bb6\u957f\u8eab\u4efd\uff0c\u81ea\u4e3b\u51b3\u7b56\u6743\u9ad8\u3002**\u51b3\u7b56\u6743\u6e05\u6670**\u3002\n*   **\u7efc\u5408\u5224\u5b9a**\uff1a\n    *   **A (\u9ad8\u610f\u613f\u9ad8\u884c\u52a8)**\uff1a\u5b66\u4e60\u884c\u52a8\u9ad8\u5ea6\u914d\u5408\uff08\u8ddf\u8bfe\u3001\u505a\u4f5c\u4e1a\u3001\u53c2\u4e0e\u6d3b\u52a8\uff09\uff0c\u4e3b\u52a8\u4ed8\u8d39\u52a0\u8d2d\uff0c\u793e\u7fa4\u6d3b\u8dc3\u4e14\u4e50\u4e8e\u52a9\u4eba\u3002**\u7b26\u5408A\u7c7b\u7279\u5f81**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **T3 \u52a1\u5b9e\u8fdb\u53d6\u8005**\uff1a\u6838\u5fc3\u7279\u5f81\u9ad8\u5ea6\u543b\u5408\u3002\u5b66\u4e60\u76ee\u6807\u660e\u786e\uff08\u5174\u8da3+\u53d8\u73b0\uff09\uff0c\u884c\u52a8\u529b\u5f3a\uff08\u8003\u8bc1\u3001\u53ca\u65f6\u8fdb\u73ed\u3001\u89e3\u51b3\u95ee\u9898\uff09\uff0c\u4e50\u4e8e\u5b9e\u8df5\u5e76\u6295\u8d44\uff08\u8d2d\u4e70\u97f3\u526a\uff09\uff0c\u5728\u793e\u7fa4\u4e2d\u626e\u6f14\u201c\u52a9\u6559\u201d\u89d2\u8272\uff0c\u79ef\u6781\u4e92\u52a8\u4e0e\u5206\u4eab\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u98ce\u9669\u7b49\u7ea7\uff1a\u4f4e**\n*   **\u6839\u56e0\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a\u4e2d\u98ce\u9669\u3002\u7528\u6237\u5df2\u6709\u8bd5\u97f3\u5931\u8d25\u7ecf\u5386\uff088\u6b21\u672a\u8fc7\uff09\uff0c\u4f46\u5f52\u56e0\u4e8e\u81ea\u8eab\uff08\u623f\u6df7\u3001\u666e\u901a\u8bdd\uff09\uff0c\u5e76\u79ef\u6781\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c**\u98ce\u9669\u53ef\u63a7**\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a\u4f4e\u98ce\u9669\u3002\u5df2\u4e3a\u8bfe\u7a0b\u53ca\u9644\u52a0\u670d\u52a1\u4ed8\u8d39\uff0c\u51b3\u7b56\u679c\u65ad\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u56f0\u96be\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a\u4f4e\u98ce\u9669\u3002\u80fd\u5229\u7528\u5348\u4f11\u7b49\u65f6\u95f4\u5b66\u4e60\uff0c\u4e3b\u52a8\u534f\u8c03\u65f6\u95f4\uff08\u201c\u8bbe\u7f6e\u95f9\u949f\u201d\uff09\uff0c\u53c2\u4e0e\u5ea6\u9ad8\u3002\n    4.  **\u8bfe\u7a0b\u8d28\u91cf\u8d28\u7591**\uff1a\u4f4e\u98ce\u9669\u3002\u5bf9\u8bfe\u7a0b\u5185\u5bb9\uff08\u201c\u7cbe\u82f1\u73ed\u73ed\u6559\u5f97\u633a\u591a\u7684\u201d\uff09\u548c\u8001\u5e08\u6301\u6b63\u9762\u8bc4\u4ef7\u3002\n    5.  **\u9500\u552e\u627f\u8bfa\u672a\u5151\u73b0**\uff1a\u4f4e\u98ce\u9669\u3002\u8bb0\u5f55\u4e2d\u65e0\u8fc7\u5ea6\u627f\u8bfa\u8ff9\u8c61\uff0c\u7528\u6237\u4e3a\u4e3b\u52a8\u52a0\u8d2d\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a\u4f4e\u98ce\u9669\u3002\u5bb6\u5ead\u51b3\u7b56\u6743\u6e05\u6670\uff0c\u672a\u89c1\u53cd\u5bf9\u4fe1\u53f7\u3002\n    7.  **\u5e73\u53f0/\u670d\u52a1\u4f53\u9a8c**\uff1a\u4f4e\u98ce\u9669\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\u80fd\u81ea\u884c\u89e3\u51b3\uff0c\u4e0e\u73ed\u4e3b\u4efb\u6c9f\u901a\u987a\u7545\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u65e0\u91cd\u5927\u8fdd\u89c4**\u3002\u9500\u552e\u6c9f\u901a\u4ee5\u670d\u52a1\u3001\u63d0\u9192\u3001\u77e5\u8bc6\u5206\u4eab\u4e3a\u4e3b\uff0c\u65e0\u80c1\u8feb\u6216\u865a\u5047\u627f\u8bfa\u3002\n*   **\u6f5c\u5728\u5173\u6ce8\u70b9**\uff1a\u9644\u52a0\u670d\u52a1\uff08\u97f3\u526a\uff09\u9500\u552e\u6d41\u7a0b\u5408\u89c4\uff0c\u7528\u6237\u4e3b\u52a8\u8be2\u4ef7\u5e76\u652f\u4ed8\uff0c**\u4f46\u9700\u786e\u4fdd\u540e\u7eed\u670d\u52a1\uff0848\u5c0f\u65f6\u5185\u5f00\u901a\uff09\u53ca\u65f6\u4ea4\u4ed8**\uff0c\u907f\u514d\u56e0\u4f53\u9a8c\u4e0d\u4f73\u5f15\u53d1\u6295\u8bc9\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d**\uff1a**\u5339\u914d**\u3002\u7528\u6237\u5b66\u4e60\u8def\u5f84\u6e05\u6670\uff08\u57fa\u7840\u8bfe\u2192\u8fdb\u9636\u8bfe\u2192\u52a0\u8d2d\u97f3\u526a\uff09\uff0c\u4e0e\u4ea7\u54c1\u8fdb\u9636\u8bbe\u8ba1\u543b\u5408\u3002\n*   **\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9996\u91cd\u4ef7\u503c\u6df1\u5316**\uff1a\u80af\u5b9a\u5176\u5b66\u4e60\u70ed\u60c5\u4e0e\u52a9\u4eba\u884c\u4e3a\uff0c\u5c06\u5176\u53d1\u5c55\u4e3a\u793e\u7fa4\u201c\u6b63\u80fd\u91cf\u8282\u70b9\u201d\u6216\u5c0f\u7ec4\u957f\u3002\n    2.  **\u63d0\u4f9b\u7cbe\u51c6\u652f\u6301**\uff1a\u9488\u5bf9\u5176\u201c\u623f\u6df7\u201d\u3001\u201c\u666e\u901a\u8bdd\u201d\u75db\u70b9\uff0c\u63d0\u4f9b\u5177\u4f53\u73af\u5883\u6539\u5584\u5efa\u8bae\u6216\u7ec3\u4e60\u65b9\u6cd5\uff0c\u5e2e\u52a9\u5176\u5efa\u7acb\u201c\u95ee\u9898\u53ef\u89e3\u51b3\u201d\u7684\u4fe1\u5fc3\u3002\n    3.  **\u5173\u6ce8\u53d8\u73b0\u8fdb\u5c55**\uff1a\u5728\u5176\u8bd5\u97f3\u6216\u63a5\u5355\u8fc7\u7a0b\u4e2d\u63d0\u4f9b\u5fc5\u8981\u6307\u5bfc\uff0c**\u7ba1\u7406\u5176\u53d8\u73b0\u9884\u671f**\uff0c\u5f3a\u8c03\u957f\u671f\u79ef\u7d2f\uff0c\u907f\u514d\u56e0\u77ed\u671f\u518d\u6b21\u53d7\u632b\u800c\u52a8\u6447\u3002\n    4.  **\u786e\u4fdd\u9644\u52a0\u670d\u52a1\u4f53\u9a8c**\uff1a\u8ddf\u8fdb\u97f3\u526a\u5f00\u901a\u4e0e\u4f7f\u7528\u60c5\u51b5\uff0c\u53ca\u65f6\u89e3\u7b54\u95ee\u9898\uff0c\u5151\u73b0\u670d\u52a1\u627f\u8bfa\u3002\n\n{\"core_type\": \"T3 \u52a1\u5b9e\u8fdb\u53d6\u8005\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u80af\u5b9a\u70ed\u60c5\uff0c\u63d0\u4f9b\u7cbe\u51c6\u964d\u566a\u6307\u5bfc\"}";
