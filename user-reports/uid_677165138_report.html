        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677165138 (\u6635\u79f0\uff1a\u5b89\u5168\u7740\u9646) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5c0f\u5f90\u52a9\u65591(\u5f90\u4e91\u6d9b)\u3001\u9065\u8fdc\u4e0d\u8fdc(\u5f20\u6587\u9759) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u526f\u4e1a\u8bad\u7ec3\u8425 -> 7380\u5143\u9ad8\u9636\u7248\u7cfb\u7edf\u8bfe |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u76f4\u63a5\u62a5\u51fa\u4ef7\u683c\u201c7380\u201d\uff0c\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u81ea\u8ff0\u201c\u6bcf\u5929\u96f6\u788e\u53ef\u4ee5\u7528\u4e8e\u5b66\u4e60\u548c\u517c\u804c\u7684\u65f6\u95f4\uff1a4-6\u5c0f\u65f6\u201d\uff0c\u4f46\u672a\u8bf4\u660e\u4e3b\u4e1a\u60c5\u51b5\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u6709\u660e\u786e\u7684\u5b66\u4e60\u76ee\u6807\u548c\u65f6\u95f4\u6295\u5165\u610f\u613f\uff0c\u4f46\u7f3a\u4e4f\u8d44\u91d1\u3001\u5bb6\u5ead\u3001\u6297\u538b\u6027\u7b49\u6df1\u5ea6\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u2b06\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u660e\u786e\u4ee5\u201c\u8d5a\u7c73\u201d\u4e3a\u9996\u8981\u76ee\u6807\uff0c\u884c\u52a8\u529b\u5f3a\uff08\u6309\u65f6\u5b8c\u6210\u6240\u6709\u4f5c\u4e1a\u548c\u76f4\u64ad\u6253\u5361\uff09\uff0c\u5bf9\u53d8\u73b0\u8def\u5f84\uff08\u5feb\u901f\u6536\u5165\u3001\u957f\u671f\u6536\u5165\u3001\u659c\u6760\u6536\u5165\uff09\u8868\u73b0\u51fa\u660e\u786e\u5174\u8da3\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u3010\u8bad\u7ec3\u8425\u6700\u60f3\u6536\u83b7\u4ec0\u4e48\uff1f\u8d5a\u7c73/\u5174\u8da3\u3011\uff1a\u8d5a\u7c73\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u8d44\u91d1\u6765\u6e90\u6216\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u81ea\u79f0\u201c\u81ea\u7531\u201d\u804c\u4e1a\uff0c\u6bcf\u5929\u67094-6\u5c0f\u65f6\u788e\u7247\u5316\u65f6\u95f4\u7528\u4e8e\u5b66\u4e60\u548c\u517c\u804c\u3002\u5177\u5907\u57fa\u672c\u5b66\u4e60\u6761\u4ef6\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u27a1\u4e2d**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a(\u4e2d)**\u3002\u7528\u6237\u80fd\u6309\u65f6\u5b8c\u6210\u6240\u6709\u8003\u6838\u4efb\u52a1\uff0c\u5bf9\u9500\u552e/\u73ed\u4e3b\u4efb\u7684\u9f13\u52b1\u548c\u5f15\u5bfc\uff08\u201c\u770b\u597d\u4f60\u201d\u3001\u201c\u5e26\u4f60\u98de\u201d\uff09\u6709\u79ef\u6781\u56de\u5e94\uff0c\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u914d\u5408\u5ea6\u548c\u670d\u4ece\u6027\u3002\u672a\u8868\u73b0\u51fa\u6781\u7aef\u81ea\u5351\u6216\u81ea\u6211\u5426\u5b9a\uff0c\u4f46\u4e5f\u672a\u5c55\u793a\u51fa\u6781\u5f3a\u7684\u81ea\u6211\u9a71\u52a8\u6216\u6297\u538b\u80fd\u529b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6c42\u5e26\u98de\u201d\uff1b\u5bf9\u9500\u552e\u201c\u770b\u597d\u4f60\u201d\u3001\u201c\u5e26\u4f60\u8d77\u98de\u201d\u7684\u9f13\u52b1\u79ef\u6781\u56de\u5e94\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9**\u7ecf\u6d4e\u4fdd\u969c\u548c\u804c\u4e1a\u7a33\u5b9a\u6027\u7684\u7126\u8651**\u3002\u4f5c\u4e3a\u201c\u81ea\u7531\u804c\u4e1a\u8005\u201d\uff0c\u5176\u6838\u5fc3\u8bc9\u6c42\u662f\u901a\u8fc7\u6709\u58f0\u526f\u4e1a\u83b7\u5f97\u4e00\u4efd\u7a33\u5b9a\u3001\u53ef\u89c2\u7684\u6536\u5165\uff0c\u4ee5\u589e\u5f3a\u4e2a\u4eba\u7ecf\u6d4e\u5b89\u5168\u611f\u548c\u804c\u4e1a\u81ea\u4e3b\u6027\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u9009\u4e2d\u201d\u7684\u786e\u5b9a\u611f\u548c\u201c\u6709\u8def\u5f84\u201d\u7684\u5b89\u5168\u611f**\u3002\u9500\u552e\u53cd\u590d\u5f3a\u8c03\u201c\u770b\u597d\u4f60\u201d\u3001\u201c\u6211\u7684\u773c\u5149\u4e0d\u9519\u201d\u3001\u201c\u4ee5\u540e\u5c31\u662f\u6211\u7684\u4eba\u4e86\u201d\u3001\u201c\u5b66\u59d0\u6709\u81ea\u5df1\u7684\u5de5\u4f5c\u5ba4\u201d\uff0c\u6b63\u662f\u7528\u201c\u5708\u5185\u4eba\u201d\u7684\u8eab\u4efd\u548c\u8d44\u6e90\u627f\u8bfa\uff0c\u6ee1\u8db3\u5176\u5bf9\u672a\u6765\u6536\u5165\u4fdd\u969c\u7684\u6df1\u5c42\u6e34\u671b\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u52a8\u673a\u9ad8\u3001\u8d44\u6e90\u4e2d\u3001\u5f39\u6027\u4e2d\uff0c\u52a1\u5b9e\u80af\u5e72\uff0c\u8ffd\u6c42\u7a33\u5b9a\u53d8\u73b0) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u4f5c\u4e3a\u81ea\u7531\u804c\u4e1a\u8005\uff0c\u5bb6\u5ead\u8d22\u52a1\u5e72\u9884\u98ce\u9669\u76f8\u5bf9\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u82e5\u540e\u7eed\u7cfb\u7edf\u8bfe\u5f3a\u5ea6\u8d85\u51fa\u5176\u201c4-6\u5c0f\u65f6\u201d\u7684\u9884\u671f\uff0c\u6216\u63a5\u5355\u53d8\u73b0\u5468\u671f\u957f\u4e8e\u9884\u671f\uff0c\u53ef\u80fd\u5bfc\u81f4\u56e0\u201c\u65f6\u95f4\u6295\u5165\u4ea7\u51fa\u6bd4\u5931\u8861\u201d\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u76ee\u524d\u8868\u73b0\u7a33\u5b9a\uff0c\u914d\u5408\u5ea6\u9ad8\uff0c\u65e0\u660e\u663e\u60c5\u7eea\u5d29\u6e83\u4fe1\u53f7\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u5176\u201c\u8d5a\u7c73\u201d\u52a8\u673a\u660e\u786e\uff0c\u82e5\u5728\u627f\u8bfa\u7684\u201c\u65b0\u624b\u671f\u201d\u5185\uff08\u59821-3\u4e2a\u6708\uff09\u672a\u80fd\u83b7\u5f97\u5b9e\u8d28\u6027\u6536\u5165\uff08\u54ea\u6015\u662f\u5c0f\u989d\uff09\uff0c\u6781\u6613\u56e0\u201c\u9884\u671f\u843d\u7a7a\u201d\u800c\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-3\u4e2a\u6708**\u3002\u6b64\u65f6\u57fa\u7840\u6280\u80fd\u5b66\u4e60\u9636\u6bb5\u7ed3\u675f\uff0c\u8fdb\u5165\u5b9e\u6218\u63a5\u5355\u671f\u3002\u82e5\u63a5\u5355\u4e0d\u987a\u5229\u6216\u6536\u5165\u8fdc\u4f4e\u4e8e\u9500\u552e\u63cf\u7ed8\u7684\u201c\u65f6\u85aa\u4e66\u201d\u6c34\u5e73\uff0c\u9000\u8d39\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5b89\u5168\u7740\u9646\u540c\u5b66\uff0c\u770b\u5230\u4f60\u8bad\u7ec3\u8425\u671f\u95f4\u6bcf\u4e00\u6b65\u90fd\u8e29\u5f97\u7279\u522b\u624e\u5b9e\uff0c\u4f5c\u4e1a\u5b8c\u6210\u5f97\u53c8\u5feb\u53c8\u597d\uff0c\u8fd9\u79cd\u2018\u7a33\u624e\u7a33\u6253\u2019\u7684\u98ce\u683c\u6b63\u662f\u6211\u4eec\u5de5\u4f5c\u5ba4\u6700\u770b\u91cd\u7684\u3002\u63a5\u4e0b\u6765\u7cfb\u7edf\u8bfe\uff0c\u54b1\u4eec\u7684\u76ee\u6807\u5f88\u660e\u786e\uff1a**\u7528\u6700\u77ed\u8def\u5f84\u5e2e\u4f60\u628a\u2018\u58f0\u97f3\u2019\u53d8\u6210\u2018\u58f0\u8d22\u2019**\u3002\u6211\u4f1a\u628a\u9002\u5408\u65b0\u624b\u7684\u3001\u80fd\u5feb\u901f\u4e0a\u624b\u7684\u4e66\u5355\u4f18\u5148\u5339\u914d\u7ed9\u4f60\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u628a\u53d8\u73b0\u7684\u8def\u8d70\u5b9e\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176\u201c\u8d5a\u7c73\u201d\u7684\u9ad8\u7eaf\u5ea6\u52a8\u673a\u548c\u7a33\u5b9a\u80af\u5e72\u7684\u7279\u70b9\uff0c\u63d0\u4f9b\u624e\u5b9e\u7684\u6280\u80fd\u57f9\u8bad\u548c\u660e\u786e\u7684\u63a5\u5355\u8def\u5f84\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T2\u8001\u9ec4\u725b\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010B\u6a21\u5757\uff1a\u786c\u6838\u624b\u827a\u6c60\u3011**\uff0c\u5373\u63d0\u4f9b\u4e13\u5bb61v1\u7b54\u7591\u3001\u771f\u5b9e\u6d3e\u5355\u5b9e\u6218\u548c\u7cbe\u51c6\u7684\u8bd5\u97f3\u6307\u5bfc\u3002**\u5207\u5fcc\u8fc7\u65e9\u5f15\u5165\u8fc7\u4e8e\u590d\u6742\u7684\u4ea4\u53c9\u9500\u552e\uff08\u5982\u9ad8\u9636\u540e\u671f\u8bfe\uff09**\uff0c\u907f\u514d\u9020\u6210\u77e5\u8bc6\u8fc7\u8f7d\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u753b\u4e0d\u5207\u5b9e\u9645\u7684\u5927\u997c**\u3002\u907f\u514d\u8fc7\u5ea6\u6e32\u67d3\u201c\u6708\u5165\u8fc7\u4e07\u5f88\u7b80\u5355\u201d\uff0c\u5e94\u5f3a\u8c03\u201c\u4ece\u65f6\u85aa\u4e66\u8d77\u6b65\uff0c\u7a33\u5b9a\u79ef\u7d2f\u201d\u30022. **\u5ffd\u89c6\u5176\u65f6\u95f4\u89c4\u5212**\u3002\u9700\u5b9a\u671f\u786e\u8ba4\u5176\u201c4-6\u5c0f\u65f6\u201d\u5b66\u4e60\u65f6\u95f4\u662f\u5426\u53ef\u6301\u7eed\uff0c\u907f\u514d\u56e0\u65f6\u95f4\u6324\u538b\u5bfc\u81f4\u5d29\u76d8\u30023. **\u7528\u60c5\u611f\u7ed1\u67b6\u4ee3\u66ff\u5b9e\u9645\u652f\u6301**\u3002T2\u9700\u8981\u7684\u662f\u201c\u65b9\u6cd5\u201d\u548c\u201c\u673a\u4f1a\u201d\uff0c\u800c\u975e\u5355\u7eaf\u7684\u201c\u52a0\u6cb9\u201d\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u5728**\u5176\u901a\u8fc7\u7cfb\u7edf\u8bfe\u63a5\u5230\u7b2c\u4e00\u5355\u5e76\u83b7\u5f97\u6b63\u5411\u53cd\u9988\u4e4b\u524d**\uff0c\u4e25\u7981\u63a8\u4ecb\u4efb\u4f55\u9ad8\u9636\u3001\u9ad8\u5ba2\u5355\u7684\u9644\u52a0\u8bfe\u7a0b\uff08\u5982\u9ad8\u7ea7\u540e\u671f\u3001\u8bbe\u5907\u8bfe\uff09\u3002\u53ef\u8003\u8651\u5728\u5176\u7a33\u5b9a\u63a5\u5355\u540e\uff0c\u63a8\u8350**500\u5143\u4ee5\u5185\u7684\u5fae\u5347\u5355**\uff08\u5982\u7279\u5b9a\u58f0\u7ebf\u7cbe\u4fee\u5c0f\u8bfe\uff09\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u3010\u8bad\u7ec3\u8425\u6700\u60f3\u6536\u83b7\u4ec0\u4e48\uff1f\u8d5a\u7c73/\u5174\u8da3\u3011\uff1a\u8d5a\u7c73\u201d\n2. > \u201c\u3010\u6211\u7684\u804c\u4e1a\u3011\uff1a\u81ea\u7531\u201d\n3. > \u201c\u6c42\u5e26\u98de\u201d\n4. > \u201c\u597d\u7684\u8c22\u8c22\u8001\u5e08\u201d (\u5bf9\u7ec6\u81f4\u70b9\u8bc4\u7684\u793c\u8c8c\u56de\u5e94\uff0c\u4f53\u73b0\u670d\u4ece\u6027\u4e0e\u914d\u5408\u5ea6)\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7ecf\u6d4e\u5b89\u5168\u4e0e\u804c\u4e1a\u81ea\u4e3b\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5728\u627f\u8bfa\u7684\u53d8\u73b0\u5468\u671f\u5185\uff082-3\u4e2a\u6708\uff09\u63d0\u4f9b\u771f\u5b9e\u3001\u53ef\u843d\u5730\u7684\u63a5\u5355\u673a\u4f1a\u4e0e\u6307\u5bfc\uff0c\u4e25\u9632\u201c\u9884\u671f\u843d\u7a7a\u201d\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\"}\n```";
