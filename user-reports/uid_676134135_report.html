        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676134135 (\u6635\u79f0\uff1a\u9f99\u54e5) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e/\u52a9\u6559\uff1a\u7eb8\u7cca\u7684\u6bcd\u8001\u864e~\u5b98\u65b9\u52a9\u6559(\u6e38\u8302)\uff1b\u73ed\u4e3b\u4efb\uff1a\u79cb\u4e91(\u4f55\u9a8f) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u5199\u4f5c\u8bfe\uff08\u65d7\u8230\u73ed\uff0c\u4ef7\u683c\u672a\u77e5\uff0c\u652f\u6301\u82b1\u5457/\u4fe1\u7528\u5361\u5206\u671f\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u7528\u5361\u5468\u8f6c** (\u660e\u786e\u8be2\u95ee\u5e76\u9009\u62e9\u5206\u671f\u4ed8\u6b3e) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u6709\u672c\u804c\u5de5\u4f5c\uff0c\u8ba1\u5212\u5229\u7528\u788e\u7247\u5316\u65f6\u95f4\u5168\u804c\u5199\u4f5c) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** (\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u4fe1\u606f\uff0c\u9700\u8b66\u60d5\u9690\u7792\u98ce\u9669) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** (\u5173\u952e\u4fe1\u606f\u5982\u804c\u4e1a\u3001\u6536\u5165\u3001\u5bb6\u5ead\u72b6\u51b5\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u7ec6\u8282\u5747\u7f3a\u5931) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u6709\u660e\u786e\u7684\u641e\u94b1\u8bc9\u6c42\uff0c\u4f46\u88ab\u8fc7\u5f80\u201c\u8e29\u5751\u201d\u7ecf\u5386\u6240\u56f0\u6270\uff0c\u4fe1\u5fc3\u4e0d\u8db3\uff0c\u52a8\u673a\u4e2d\u6df7\u6742\u7740\u8bd5\u63a2\u3001\u6000\u7591\u548c\u5bfb\u6c42\u4fdd\u969c\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4e0d\u77e5\u9053\uff0c\u6211\u73b0\u5728\u5728\u610f\u7684\u662f\u5b66\u8d39\u8d35\u4e0d\u8d35\uff0c\u5230\u5e95\u80fd\u4e0d\u80fd\u6323\u5230\u94b1\u201d\uff1b > \u201c\u82b1\u4e86\u4e0d\u5c11\u7684\u94b1\uff0c\u5b66\u4e86\u4e0d\u5c11\u7684\u8bfe\uff0c\u843d\u5730\u4e0d\u4e86\uff0c\u6709\u70b9\u9000\u7f29\u80c6\u602f\u4e86\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u652f\u4ed8\u65b9\u5f0f\u4e3a\u4fe1\u7528\u5361/\u82b1\u5457\u5206\u671f\uff0c\u8868\u660e\u4e00\u6b21\u6027\u652f\u4ed8\u538b\u529b\u5927\uff0c\u8d44\u91d1\u627f\u8f7d\u529b\u6709\u9650\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u6709\u672c\u804c\u5de5\u4f5c\uff0c\u4f46\u8868\u793a\u201c\u60f3\u5168\u804c\u201d\uff0c\u5e76\u613f\u610f\u5229\u7528\u201c\u788e\u7247\u5316\u65f6\u95f4\u201d\uff0c\u5177\u5907\u4e00\u5b9a\u7684\u65f6\u95f4\u89c4\u5212\u610f\u613f\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u804a\u5929\u8bb0\u5f55\u5b8c\u5168\u672a\u63d0\u53ca\u5bb6\u5ead\uff0c\u6b64\u9879\u4e3a**\u91cd\u5927\u98ce\u9669\u76f2\u533a**\uff0c\u9ed8\u8ba4\u8bc4\u7ea7\u4e3a\u4f4e\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b07\u4f4e\u6781\u5371]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u8fc7\u5f80\u591a\u6b21\u4ed8\u8d39\u5b66\u4e60\u5931\u8d25\u7684\u7ecf\u5386\u5df2\u5f62\u6210\u5fc3\u7406\u521b\u4f24\uff0c\u8868\u73b0\u4e3a\u201c\u9000\u7f29\u80c6\u602f\u201d\u3002\u5bf9\u65b0\u8bfe\u7a0b\u62b1\u6709\u6781\u9ad8\u671f\u671b\uff08\u201c\u5230\u5e95\u80fd\u4e0d\u80fd\u6323\u5230\u94b1\u201d\uff09\uff0c\u4f46\u5185\u5fc3\u6781\u5ea6\u8106\u5f31\uff0c\u4e00\u65e6\u521d\u671f\u5b66\u4e60\u9047\u632b\u6216\u6536\u76ca\u4e0d\u53ca\u9884\u671f\uff0c\u6781\u6613\u4ea7\u751f\u201c\u53c8\u88ab\u9a97\u4e86\u201d\u7684\u5d29\u6e83\u60c5\u7eea\uff0c\u4f9d\u8d56\u5916\u90e8\uff08\u9500\u552e/\u73ed\u4e3b\u4efb\uff09\u7684\u5f3a\u529b\u5b89\u629a\u548c\u627f\u8bfa\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u82b1\u4e86\u4e0d\u5c11\u7684\u94b1\uff0c\u5b66\u4e86\u4e0d\u5c11\u7684\u8bfe\uff0c\u843d\u5730\u4e0d\u4e86\uff0c\u6709\u70b9\u9000\u7f29\u80c6\u602f\u4e86\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u56e0\u591a\u6b21\u77e5\u8bc6\u4ed8\u8d39\u201c\u8e29\u5751\u201d\u5931\u8d25\u800c\u4ea7\u751f\u7684\u5f3a\u70c8\u81ea\u6211\u6000\u7591\u548c\u8d22\u52a1\u7126\u8651\uff0c\u672c\u8d28\u662f\u5bfb\u6c42\u4e00\u4efd\u201c\u8fd9\u6b21\u4e00\u5b9a\u80fd\u6210\u201d\u7684\u786e\u5b9a\u6027\u4fdd\u969c\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u9632\u62a4\u76fe\u5f0f\u7684\u5b89\u5168\u627f\u8bfa\u4e0e\u5f3a\u966a\u4f34**\u3002\u4ed6\u9700\u8981\u7684\u4e0d\u4ec5\u662f\u6280\u80fd\uff0c\u66f4\u662f\u4e00\u4e2a\u80fd\u4e3a\u4ed6\u8fc7\u5f80\u201c\u5931\u8d25\u201d\u4e70\u5355\u3001\u627f\u8bfa\u201c\u8fd9\u6b21\u4e0d\u4e00\u6837\u201d\u5e76\u5168\u7a0b\u624b\u628a\u624b\u5e26\u4ed6\u62ff\u5230\u7ed3\u679c\u7684\u201c\u4fdd\u59c6\u5f0f\u201d\u5bfc\u5e08\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2** \u7c7b (\u9ad8\u7126\u8651\u3001\u4f4e\u5f39\u6027\u3001\u8d44\u6e90\u5403\u7d27\u7684\u201c\u60ca\u5f13\u4e4b\u9e1f\u201d) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74** (\u6838\u5fc3\u7279\u5f81\uff1a\u56e0\u8fc7\u5f80\u632b\u8d25\u800c\u6781\u5ea6\u8106\u5f31\uff0c\u9700\u8981\u6301\u7eed\u7684\u60c5\u7eea\u5b89\u629a\u548c\u7ed3\u679c\u4fdd\u8bc1\uff0c\u6297\u538b\u80fd\u529b\u6781\u5dee) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u867d\u4f7f\u7528\u5206\u671f\u652f\u4ed8\uff0c\u4f46\u672a\u53d1\u73b0\u660e\u786e\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5ead\u51b2\u7a81\u8bc1\u636e\u3002**\u4f46\u5bb6\u5ead\u652f\u6301\u5ea6\u4fe1\u606f\u7f3a\u5931\u662f\u91cd\u5927\u9690\u60a3**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u82e5\u5b66\u8d39\u652f\u51fa\u5f71\u54cd\u5bb6\u5ead\u5f00\u652f\u4e14\u4e3a\u9690\u7792\u72b6\u6001\uff0c\u98ce\u9669\u9aa4\u589e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u672c\u804c\u5de5\u4f5c\u53ef\u80fd\u6324\u538b\u5b66\u4e60\u65f6\u95f4\uff0c\u5bfc\u81f4\u4f5c\u4e1a\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u7126\u8651\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u8f6f\u4ef6\u64cd\u4f5c\u5361\u58f3\u3001\u7b2c\u4e00\u6b21\u6295\u7a3f\u88ab\u62d2\u3001\u770b\u5230\u5176\u4ed6\u540c\u5b66\u8fdb\u6b65\u66f4\u5feb\u65f6\uff0c\u6781\u6613\u56e0\u81ea\u5c0a\u5fc3\u53d7\u632b\u800c\u7206\u53d1\uff0c\u5f52\u56e0\u4e8e\u201c\u8bfe\u7a0b\u6ca1\u7528/\u88ab\u9a97\u201d\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | \u5bf9\u201c\u5b66\u4e60\u671f\u95f4\u56de\u672c\u201d\u62b1\u6709\u4e0d\u5207\u5b9e\u9645\u7684\u671f\u5f85\uff0c\u82e5\u5f00\u8bfe1-2\u6708\u5185\u65e0\u4efb\u4f55\u53d8\u73b0\uff0c\u4f1a\u7acb\u523b\u8d28\u7591\u627f\u8bfa\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u4f5c\u4e1a\u96be\u5ea6\u548c\u91cf\u7ea7\u63d0\u5347\uff0c\u82e5\u7b2c\u4e00\u6b21\u5c1d\u8bd5\u6295\u7a3f\u6216\u63a5\u5355\u5931\u8d25\uff0c\u5c06\u76f4\u63a5\u89e6\u53d1\u5176\u201c\u5386\u53f2\u521b\u4f24\u201d\uff0c\u5f15\u53d1\u5267\u70c8\u9000\u8d39\u8bc9\u6c42\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u9f99\u54e5\uff0c\u6211\u770b\u4e86\u4f60\u7684\u8bb0\u5f55\uff0c\u7279\u522b\u7406\u89e3\u4f60\u4e4b\u524d\u2018\u8e29\u5751\u2019\u7684\u90a3\u79cd\u65e0\u529b\u611f\u3002\u8fd9\u6b21\u4e0d\u4e00\u6837\uff0c\u6211\u4e0d\u662f\u6765\u7ed9\u4f60\u753b\u997c\u7684\uff0c\u6211\u662f\u6765\u7ed9\u4f60\u5f53\u2018\u9632\u5751\u76fe\u724c\u2019\u548c\u2018\u62d0\u6756\u2019\u7684\u3002\u54b1\u4eec\u4e0d\u8ddf\u522b\u4eba\u6bd4\uff0c\u5c31\u8ddf\u4f60\u81ea\u5df1\u6bd4\u3002\u6bcf\u4e00\u6b65\u600e\u4e48\u8d70\uff0c\u5361\u4f4f\u4e86\u600e\u4e48\u89e3\u51b3\uff0c\u6323\u5230\u7b2c\u4e00\u7b14\u94b1\u4e4b\u524d\u6240\u6709\u538b\u529b\u6211\u5e2e\u4f60\u625b\u7740\u3002\u4f60\u4fe1\u6211\u4e00\u6b21\uff0c\u4e5f\u4fe1\u4f60\u81ea\u5df1\u4e00\u6b21\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5feb\u901f\u63a5\u5355\u7ebf**\u3011\u3002\u5fc5\u987b\u4f18\u5148\u8ba9\u5176\u770b\u5230\u201c\u94b1\u201d\u666f\uff0c\u54ea\u6015\u662f\u5fae\u5c0f\u6536\u76ca\uff08\u5982\u63d0\u5230\u7684\u201c\u7cbe\u4fee\u5546\u5355\u201d\uff09\uff0c\u5efa\u7acb\u6b63\u5411\u53cd\u9988\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011** \u5fc5\u987b\u6302\u8f7d\uff01\u5305\u542b\uff1a1\uff09\u4e13\u5c5e\u201c\u6811\u6d1e\u201d\u65f6\u95f4\uff0c\u5b9a\u671f\u4e00\u5bf9\u4e00\u60c5\u7eea\u758f\u5bfc\uff1b2\uff09\u62c6\u89e3\u5230\u6781\u7ec6\u7684\u6b65\u9aa4\u5316\u64cd\u4f5c\u6307\u5357\uff08\u9632\u8f6f\u4ef6\u64cd\u4f5c\u7834\u9632\uff09\uff1b3\uff09\u4f18\u5148\u5206\u914d\u4f4e\u96be\u5ea6\u3001\u9ad8\u8fc7\u7a3f\u7387\u7684\u201c\u65b0\u624b\u6751\u201d\u5546\u5355\uff0c\u54ea\u6015\u5355\u4ef7\u4f4e\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1\uff09\u7edd\u4e0d\u5bf9\u4ed6\u8bb2\u5927\u9053\u7406\u6216\u704c\u9e21\u6c64\uff1b2\uff09\u7edd\u4e0d\u5728\u73ed\u7ea7\u7fa4\u516c\u5f00\u6279\u8bc4\u6216\u5bf9\u6bd4\u5176\u8fdb\u5ea6\uff1b3\uff09\u7edd\u4e0d\u627f\u8bfa\u201c\u4fdd\u5e95\u6536\u5165\u201d\uff0c\u4f46\u5fc5\u987b\u627f\u8bfa\u201c\u624b\u628a\u624b\u6559\u5230\u51fa\u5355\u201d\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5347\u5355**\u3002\u5f53\u524d\u8bfe\u7a0b\u662f\u5176\u4fe1\u4efb\u7684\u6700\u540e\u4e00\u640f\uff0c\u4efb\u4f55\u9644\u52a0\u6d88\u8d39\u90fd\u4f1a\u88ab\u89c6\u4e3a\u201c\u65b0\u4e00\u8f6e\u5272\u97ed\u83dc\u201d\uff0c\u76f4\u63a5\u5f15\u7206\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u4e0d\u77e5\u9053\uff0c\u6211\u73b0\u5728\u5728\u610f\u7684\u662f\u5b66\u8d39\u8d35\u4e0d\u8d35\uff0c\u5230\u5e95\u80fd\u4e0d\u80fd\u6323\u5230\u94b1\u201d\n2. > \u201c\u82b1\u4e86\u4e0d\u5c11\u7684\u94b1\uff0c\u5b66\u4e86\u4e0d\u5c11\u7684\u8bfe\uff0c\u843d\u5730\u4e0d\u4e86\uff0c\u6709\u70b9\u9000\u7f29\u80c6\u602f\u4e86\u201d\n3. > \u201c\u5206\u671f\u5728\u54ea\u91cc\u9009\u4e86\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6\u60c5\u7eea\u5de8\u5a74**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u7126\u8651\u4fdd\u969c\uff08\u5b89\u5168\u9700\u6c42\uff09**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u201c\u7597\u6108\u5f0f\u201d\u5f3a\u966a\u4f34\u4e0e\u524d\u7f6e\u5206\u914d\u5fae\u5c0f\u6b63\u53cd\u9988\u4efb\u52a1\uff0c\u4e25\u9632\u5176\u56e0\u521d\u671f\u632b\u6298\u800c\u5fc3\u7406\u5d29\u76d8**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf+\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\"}\n```";
