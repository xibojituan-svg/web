    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n> **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4e3a\u5df2\u8d2d\u8bfe\u540e\u7684\u5b66\u4e60\u8ddf\u8fdb\u7247\u6bb5\uff0c\u7f3a\u5931\u5173\u952e\u51b3\u7b56\u4fe1\u606f\u3002**\u652f\u4ed8\u94fe\u52d8\u6d4b\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u521d\u59cb\u8d2d\u4e70\u52a8\u673a\u3001\u7ecf\u6d4e\u72b6\u51b5\u3001\u804c\u4e1a\u80cc\u666f**\u7b49\u7ef4\u5ea6\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931\uff0c\u5bfc\u81f4\u5206\u5c42\u5224\u65ad\u5b58\u5728\u63a8\u6d4b\u6027\u3002\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 107388252 (\u6635\u79f0\uff1a\u964c\u516e) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-30 \u81f3 2026-01-31 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5b50\u6e05\u82d2-\u5b98\u65b9\u52a9\u6559-\u7c7d\u83f2\u56e2\u961f(\u8c22\u6167) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | **\u4fe1\u606f\u7f3a\u5931** (\u63a8\u6d4b\u4e3a\u6709\u58f0\u6f14\u64ad\u76f8\u5173\u8bfe\u7a0b) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u7f3a\u5931** |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u9700\u5728\u7236\u6bcd\u7761\u7740\u540e\u3001\u8eb2\u8f66\u91cc\u3001\u8bad\u5a03\u95f4\u9699\u5b66\u4e60) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u9690\u7792\u5077\u62a5** (\u9700\u8eb2\u5230\u8f66\u91cc\u542c\u8bfe\uff0c\u6015\u7236\u6bcd\u53d1\u73b0\u4ee5\u4e3a\u201c\u4e2d\u90aa\u201d) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u8868\u8fbe\u4e86\u5bf9\u6709\u58f0\u884c\u4e1a\u524d\u666f\u7684\u770b\u597d\uff08\u201c\u6211\u77e5\u9053\u6709\u58f0\u4e66\u4ee5\u540e\u4e00\u5b9a\u4f1a\u5728\u5e02\u573a\u4e0a\u7acb\u8db3\u201d\uff09\uff0c\u4f46\u5f53\u524d\u804a\u5929\u4e2d\u66f4\u7a81\u51fa\u7684\u662f**\u5b66\u4e60\u8fc7\u7a0b\u5e26\u6765\u7684\u60c5\u7eea\u91ca\u653e\u548c\u4e50\u8da3**\uff08\u201c\u6f14\u723d\u4e86\u201d\u3001\u201c\u6211\u611f\u89c9\u597d\u597d\u73a9\u201d\uff09\u3002\u8d5a\u94b1\u52a8\u673a\u5b58\u5728\uff0c\u4f46\u88ab\u5174\u8da3\u548c\u60c5\u611f\u6ee1\u8db3\u611f\u51b2\u6de1\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u611f\u89c9\u597d\u597d\u73a9[\u61a8\u7b11] \u4ee3\u5165\u89d2\u8272\u91ca\u653e\u60c5\u7eea\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u4fe1\u606f\u7f3a\u5931]** \u2014 \u65e0\u4efb\u4f55\u7ecf\u6d4e\u72b6\u51b5\u63cf\u8ff0\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**[\u2b07\u4f4e]** \u2014 \u5b66\u4e60\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\uff0c\u9700\u5728\u6df1\u591c\u3001\u8eb2\u8f66\u91cc\u3001\u907f\u5f00\u5bb6\u4eba\u65f6\u8fdb\u884c\uff0c**\u7269\u7406\u65f6\u95f4\u4e25\u91cd\u53d7\u9650**\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u2b07\u4f4e\u6781\u5371]** \u2014 **\u9690\u7792\u5b66\u4e60**\uff08\u201c\u6211\u81ea\u5df1\u8eb2\u8f66\u91cc\u542c\u7684[\u7834\u6d95\u4e3a\u7b11] \u4e0d\u7136\u7238\u5988\u975e\u5f97\u7ed9\u6211\u9a71\u9b54\u4e0d\u884c\u201d\uff09\uff0c\u5bb6\u5ead\u73af\u5883\u4e0d\u652f\u6301\uff0c\u6784\u6210\u6f5c\u5728\u9000\u8d39\u98ce\u9669\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u7528\u6237\u60c5\u7eea\u7a33\u5b9a\u3001\u5e7d\u9ed8\uff0c\u80fd\u4e3b\u52a8\u5b8c\u6210\u4f5c\u4e1a\u3001\u79ef\u6781\u4e92\u52a8\uff0c\u5e76\u4ece\u5b66\u4e60\u4e2d\u83b7\u53d6\u6b63\u5411\u60c5\u7eea\u4ef7\u503c\u3002\u9762\u5bf9\u90bb\u5c45\u5bb6\u66b4\u7b49\u5916\u90e8\u538b\u529b\u4e8b\u4ef6\uff0c\u867d\u6709\u60c5\u7eea\u6ce2\u52a8\u4f46\u80fd\u81ea\u6211\u8c03\u8282\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8981\u5b66\u5c31\u597d\u597d\u5b66 \u8981\u4e48\u5c31\u4e0d\u8981\u5b66 \u60f3\u5b66\u8fd8\u6015\u4e22\u8138\u7684 \u5c31\u4e0d\u9002\u5408\u5b66\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u73b0\u5b9e\u751f\u6d3b\u7f3a\u4e4f\u9ad8\u8d28\u91cf\u7684\u793e\u4ea4\u4e92\u52a8\u4e0e\u60c5\u7eea\u51fa\u53e3**\u3002\u804a\u5929\u4e2d\u900f\u9732\u51fa\u5bf9\u90bb\u5c45\u592b\u59bb\u4e89\u5435\u7684\u8fc7\u5ea6\u5173\u6ce8\u548c\u65e0\u5948\uff0c\u4ee5\u53ca\u901a\u8fc7\u6709\u58f0\u6f14\u64ad\u201c\u4ee3\u5165\u89d2\u8272\u91ca\u653e\u60c5\u7eea\u201d\u83b7\u5f97\u5f3a\u70c8\u6ee1\u8db3\u611f\uff0c\u8868\u660e\u5176\u73b0\u5b9e\u793e\u4ea4\u5708\u53ef\u80fd\u72ed\u7a84\u6216\u8d28\u91cf\u4e0d\u9ad8\uff0c**\u8bfe\u7a0b\u5b66\u4e60\u6210\u4e3a\u4e86\u5979\u91cd\u8981\u7684\u60c5\u611f\u5bc4\u6258\u548c\u793e\u4ea4\u66ff\u4ee3**\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u88ab\u770b\u89c1\u3001\u88ab\u8ba4\u53ef\u3001\u88ab\u504f\u7231\u7684\u201c\u5708\u5185\u4eba\u201d\u5f52\u5c5e\u611f**\u3002\u5979\u5bf9\u8001\u5e08\u7684\u201c\u5ba0\u6211\u201d\u3001\u201c\u62a4\u728a\u5b50\u201d\u5f0f\u5173\u6ce8\u975e\u5e38\u53d7\u7528\uff0c\u6e34\u671b\u5728\u5b66\u4e60\u548c\u4e92\u52a8\u4e2d\u83b7\u5f97\u72ec\u4e00\u65e0\u4e8c\u7684\u91cd\u89c6\u548c\u60c5\u611f\u8fde\u63a5\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1 \u7c7b** (\u52a8\u673a\u4e2d\u7b49\uff0c\u8d44\u6e90\u5e95\u5ea7\u5b58\u5728\u660e\u663e\u77ed\u677f\uff08\u65f6\u95f4\u3001\u5bb6\u5ead\u652f\u6301\uff09\uff0c\u4f46\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u5b66\u4e60\u610f\u613f\u5f3a) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T5 \u597d\u73a9\u5c1d\u9c9c\u578b** (\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u201c\u597d\u73a9\u201d\u3001\u201c\u91ca\u653e\u60c5\u7eea\u201d\u3001\u201c\u88ab\u8001\u5e08\u5ba0\u7231\u201d\uff0c\u5bf9\u5b66\u4e60\u8fc7\u7a0b\u672c\u8eab\u7684\u4e50\u8da3\u548c\u60c5\u611f\u4f53\u9a8c\u7684\u8ffd\u6c42\uff0c\u8fdc\u5927\u4e8e\u5bf9\u5373\u65f6\u53d8\u73b0\u7684\u6e34\u671b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u7b49\u7ea2\u7ebf\u3002\u4f46**\u5bb6\u5ead\u9690\u7792**\u662f\u6f5c\u5728\u98ce\u9669\u70b9\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| **\u5bb6\u5ead\u5e72\u9884\u578b** | **[\u9ad8]** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u56e0\u8eb2\u8f66\u91cc\u5b66\u4e60\u88ab\u5bb6\u4eba\u53d1\u73b0\u5e76\u5f3a\u70c8\u53cd\u5bf9\uff0c\u6216\u5bb6\u4eba\u5bf9\u5176\u201c\u4e0d\u52a1\u6b63\u4e1a\u201d\u7684\u6307\u8d23\u5347\u7ea7\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **[\u4e2d]** | \u56e0\u5bb6\u5ead\u4e8b\u52a1\uff08\u5982\u7167\u987e\u5b69\u5b50\u3001\u7236\u6bcd\u5e72\u9884\uff09\u6324\u538b\u6389\u6240\u6709\u788e\u7247\u65f6\u95f4\uff0c\u5bfc\u81f4\u8bfe\u7a0b\u79ef\u538b\u4ea7\u751f\u7126\u8651\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **[\u4f4e]** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e0d\u6613\u56e0\u5b66\u4e60\u632b\u6298\u7834\u9632\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **[\u4f4e]** | \u5f53\u524d\u9636\u6bb5\u66f4\u770b\u91cd\u60c5\u611f\u4f53\u9a8c\u548c\u8fc7\u7a0b\u4e50\u8da3\uff0c\u5bf9\u77ed\u671f\u6536\u76ca\u671f\u5f85\u4e0d\u9ad8\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e1-2\u5468**\u3002\u5f53\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u5bb6\u5ead\u538b\u529b\u4e0e\u6301\u7eed\u7684\u65f6\u95f4\u6295\u5165\u4ea7\u751f\u77db\u76fe\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u964c\u516e\uff0c\u6211\u7279\u522b\u7406\u89e3\u4f60\u627e\u65f6\u95f4\u5b66\u4e60\u7684\u4e0d\u5bb9\u6613\uff0c\u50cf\u2018\u8eb2\u8f66\u91cc\u4e0a\u8bfe\u2019\u8fd9\u79cd\u64cd\u4f5c\uff0c\u4e00\u770b\u5c31\u662f\u771f\u5fc3\u70ed\u7231\u7684\u4eba\u624d\u4f1a\u5e72\u7684\u2018\u50bb\u4e8b\u2019\u3002\u54b1\u4eec\u8fd9\u4e2a\u73ed\uff0c\u5c31\u662f\u7ed9\u4f60\u51c6\u5907\u7684\u2018\u60c5\u7eea\u6811\u6d1e\u2019\u548c\u2018\u79d8\u5bc6\u57fa\u5730\u2019\uff0c\u5728\u8fd9\u91cc\u4f60\u53ef\u4ee5\u5b8c\u5168\u505a\u81ea\u5df1\uff0c\u91ca\u653e\u6240\u6709\u538b\u529b\u3002\u6211\u4f1a\u4e00\u76f4\u5728\u8fd9\u513f\uff0c\u50cf\u4eca\u665a\u4e00\u6837\uff0c\u7ed9\u4f60\u6700\u7528\u5fc3\u7684\u53cd\u9988\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5174\u8da3\u6e38\u4e50\u7ebf**\u3011\u3002\u6838\u5fc3\u662f\u7ef4\u6301\u5176\u201c\u597d\u73a9\u201d\u3001\u201c\u91ca\u653e\u201d\u7684\u4f53\u9a8c\uff0c\u5c06\u5b66\u4e60\u6e38\u620f\u5316\u3001\u793e\u4ea4\u5316\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u60c5\u611f\u5171\u9e23\u966a\u4f34\u5305**\u3011\u3002\u589e\u52a0\u73ed\u4e3b\u4efb1v1\u60c5\u611f\u5173\u6000\u9891\u7387\uff0c\u5efa\u7acb\u201c\u95fa\u871c\u201d\u5f0f\u4fe1\u4efb\uff1b\u63a8\u8350\u52a0\u5165\u4ee5\u5174\u8da3\u548c\u60c5\u611f\u4ea4\u6d41\u4e3a\u4e3b\u7684**\u8f7b\u91cf\u7ea7\u5b66\u5458\u793e\u7fa4**\uff0c\u6ee1\u8db3\u5176\u793e\u4ea4\u5f52\u5c5e\u611f\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7edd\u4e0d\u8981\u8fc7\u65e9\u3001\u8fc7\u91cd\u5730\u65bd\u52a0\u201c\u63a5\u5355\u53d8\u73b0\u201d\u538b\u529b\uff0c\u8fd9\u4f1a\u7834\u574f\u5176\u201c\u597d\u73a9\u201d\u7684\u6838\u5fc3\u4f53\u9a8c\u3002\u907f\u514d\u5c06\u5176\u5f53\u4f5c\u201c\u641e\u94b1\u673a\u5668\u201d\u6765\u6c9f\u901a\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5f53\u524d\u9636\u6bb5\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u53ef\u80fd\u6253\u7834\u5176\u8106\u5f31\u7684\u201c\u5174\u8da3-\u9690\u7792\u201d\u5e73\u8861\uff0c\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u5bfc\u81f4\u9000\u8d39\u3002\u5e94\u5148\u7a33\u56fa\u5176\u5b66\u4e60\u4e60\u60ef\u548c\u60c5\u611f\u8fde\u63a5\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u81ea\u5df1\u8eb2\u8f66\u91cc\u542c\u7684[\u7834\u6d95\u4e3a\u7b11] \u4e0d\u7136\u7238\u5988\u975e\u5f97\u7ed9\u6211\u9a71\u9b54\u4e0d\u884c\u201d\n2. > \u201c\u6211\u611f\u89c9\u597d\u597d\u73a9[\u61a8\u7b11] \u4ee3\u5165\u89d2\u8272\u91ca\u653e\u60c5\u7eea\u201d\n3. > \u201c\u7231\u4f60\u7231\u4f60   \u592a\u5ba0\u6211\u4e86 [\u73ab\u7470]\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T5\u597d\u73a9\u5c1d\u9c9c\u578b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u793e\u4ea4\u966a\u4f34\u4e0e\u60c5\u611f\u91ca\u653e\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5f3a\u5316\u60c5\u611f\u966a\u4f34\uff0c\u5f31\u5316\u529f\u5229\u538b\u529b\uff0c\u5e2e\u52a9\u5176\u5e73\u8861\u5bb6\u5ead\u77e5\u60c5\u98ce\u9669\u3011**\u3002\n\n```json\n{\"core_type\": \"T5 \u597d\u73a9\u5c1d\u9c9c\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u793e\u4ea4/\u5c0a\u91cd\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf\"}\n```";
