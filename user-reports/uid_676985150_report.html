    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u6800\u5b50 (UID: 676985150) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-06 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6653\u6653(\u9ec4\u6653\u8339) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u5199\u4f5c\u8bfe\u7a0b (\u5df2\u8d2d)\u3001AIGC\u77ed\u89c6\u9891\u5b9e\u6218\u8bfe (\u610f\u5411\uff0c3980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u8d44\u91d1\u6765\u6e90\u6216\u7ecf\u6d4e\u538b\u529b\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4e2d/\u9ad8**\u3002\u7528\u6237\u80fd\u6309\u65f6\u4e0a\u8bfe\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u4e92\u52a8\uff0c\u5e76\u63d0\u53ca\u56e0\u7167\u987e\u624b\u672f\u7684\u5ac2\u5b50\u800c\u8bf7\u5047\uff0c\u8868\u660e\u6709\u76f8\u5bf9\u81ea\u4e3b\u7684\u65f6\u95f4\u5b89\u6392\u80fd\u529b\uff0c\u4f46\u9700\u517c\u987e\u5bb6\u5ead\u4e8b\u52a1\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u804a\u5929\u8bb0\u5f55\u8986\u76d6\u4e86\u4ece\u5f00\u8425\u5230\u5b66\u4e60\u3001\u4f5c\u4e1a\u3001\u95ee\u9898\u89e3\u51b3\u3001\u590d\u8d2d\u610f\u5411\u7684\u5168\u8fc7\u7a0b\uff0c\u4fe1\u606f\u5145\u5206\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u5173\u6ce8\u6280\u80fd\u638c\u63e1\u4e0e\u5b9e\u8df5\uff0c\u4e3b\u52a8\u63a2\u7d22\uff0c\u4e0d\u6025\u4e8e\u53d8\u73b0\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6ca1\u6709 \u6211\u6839\u636e\u5927\u5496\u8001\u5e08\u8bb2\u7684\u8bfe\u4e00\u6b65\u4e00\u6b65\u5728\u64cd\u4f5c\u3002\u56e0\u4e3a\u6211\u89c9\u5f97\u7406\u8bba\u518d\u597d\u90fd\u4e0d\u5982\u5b9e\u8df5\u201d > \u201c\u4e5f\u8981\u81ea\u5df1\u6478\u7d22\uff0c\u5370\u8c61\u624d\u6df1\u523b\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u7ecf\u6d4e\u72b6\u51b5\uff0c\u4f46\u80fd\u4e3b\u52a8\u54a8\u8be2\u5e76\u610f\u5411\u8d2d\u4e703980\u5143\u7684\u8fdb\u9636\u8bfe\u7a0b\uff0c\u521d\u6b65\u5224\u65ad\u6709\u4e00\u5b9a\u652f\u4ed8\u80fd\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u575a\u6301\u5b66\u4e60\u3001\u5b8c\u6210\u4f5c\u4e1a\uff0c\u4f46\u9700\u8bf7\u5047\u7167\u987e\u5bb6\u4eba\uff0c\u8868\u660e\u65f6\u95f4\u5e76\u975e\u5b8c\u5168\u81ea\u7531\uff0c\u9700\u5728\u5bb6\u5ead\u8d23\u4efb\u4e0e\u5b66\u4e60\u95f4\u5e73\u8861\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\u3002\u7167\u987e\u5ac2\u5b50\u8868\u660e\u6709\u5bb6\u5ead\u8d23\u4efb\u611f\uff0c\u4f46\u672a\u900f\u9732\u5b66\u4e60\u662f\u5426\u83b7\u5f97\u6838\u5fc3\u5bb6\u5ead\u6210\u5458\u652f\u6301\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u9047\u5230\u6280\u672f\u95ee\u9898\uff08AI\u8f93\u51fa\u903b\u8f91\u6df7\u4e71\u3001\u8f6f\u4ef6bug\uff09\u65f6\uff0c\u8868\u73b0\u4e3a**\u4e3b\u52a8\u6c42\u89e3\u3001\u81ea\u6211\u8c03\u6574\u3001\u79ef\u6781\u5c1d\u8bd5**\uff0c\u800c\u975e\u62b1\u6028\u6216\u653e\u5f03\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u73ed\u73ed\uff0cai\u5199\u7684\u6587\u7ae0\u91cc\u9762\u4e9b\u4e8b\u60c5\u53d1\u751f\u7684\u65f6\u95f4\u70b9\u6df7\u4e71\u8981\u600e\u4e48\u89e3\u51b3\u554a\uff0c\u8fd8\u6709\u4e00\u4e9b\u903b\u8f91\u7684\u95ee\u9898\u201d > \u201c\u8c22\u8c22\u73ed\u73ed\uff0c\u6211\u4ece\u7ec6\u7eb2\u5165\u624b \u5199\u51fa\u6765\u7684\u5c31\u597d\u5f88\u591a\u4e86\u201d > \u201c\u6211\u7528\u4e86\u4e24\u4e2a\uff0c\u8f93\u51fa\u7684\u5185\u5bb9\u90fd\u4e0d\u597d\u201d > \u201c\u91cd\u5f00\u4e86\u4e5f\u4e0d\u884c\uff0c\u7136\u540e\u6211\u5c31\u7528\u7684deepseek\u5199\u7684\uff0c\u7136\u540e\u4eca\u5929\u597d\u4e86[\u7834\u6d95\u4e3a\u7b11]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u81ea\u6211\u80fd\u529b\u63d0\u5347\u6709\u8f83\u9ad8\u8981\u6c42\uff0c\u5728\u4f5c\u4e1a\u4ea7\u51fa\u4e0d\u7406\u60f3\u65f6\uff08\u201c\u6211\u7684\u90fd\u6ca1\u773c\u770b\u201d\uff09\u4f1a\u611f\u5230\u632b\u8d25\uff0c\u4f46**\u4e0d\u56e0\u6b64\u5426\u5b9a\u81ea\u5df1\uff0c\u800c\u662f\u8f6c\u5316\u4e3a\u66f4\u79ef\u6781\u7684\u884c\u52a8**\u3002\u5176\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u83b7\u5f97\u6280\u80fd\u8ba4\u53ef\u4e0e\u81ea\u6211\u7a81\u7834\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u5176\u52aa\u529b\u3001\u94bb\u7814\u7cbe\u795e\u548c\u9636\u6bb5\u6027\u6210\u679c\u7684\u53ca\u65f6\u3001\u5177\u4f53\u3001\u771f\u8bda\u7684\u80af\u5b9a**\uff0c\u6ee1\u8db3\u5176\u88ab\u5c0a\u91cd\u548c\u5b9e\u73b0\u81ea\u6211\u6f5c\u80fd\u7684\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\u2b50A \u7c7b** (\u9ad8\u52a8\u673a\u3001\u9ad8\u5f39\u6027\u3001\u8d44\u6e90\u5e95\u5ea7\u65e0\u660e\u663e\u77ed\u677f) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T3 \u6b7b\u78d5\u5b66\u9738\u578b** (\u5173\u6ce8\u6838\u5fc3\u539f\u7406\uff0c\u4e3b\u52a8\u5b9e\u8df5\uff0c\u9047\u5230\u95ee\u9898\u79ef\u6781\u6c42\u89e3\uff0c\u8ffd\u6c42\u6280\u80fd\u7cbe\u8fdb) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4f4e** | \u804a\u5929\u4e2d\u672a\u4f53\u73b0\u5bb6\u5ead\u963b\u529b\uff0c\u4e14\u7528\u6237\u80fd\u81ea\u4e3b\u5b89\u6392\u65f6\u95f4\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u5b66\u4e60\u6001\u5ea6\u79ef\u6781\uff0c\u80fd\u4e3b\u52a8\u514b\u670d\u65f6\u95f4\u51b2\u7a81\uff08\u5982\u8bf7\u5047\u770b\u56de\u653e\uff09\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u5c06\u56f0\u96be\u89c6\u4e3a\u5f85\u89e3\u51b3\u7684\u95ee\u9898\u800c\u975e\u60c5\u7eea\u5d29\u6e83\u70b9\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4f4e** | \u52a8\u673a\u4e3a\u80fd\u529b\u6210\u957f\u800c\u975e\u77ed\u671f\u53d8\u73b0\uff0c\u5bf9\u201c\u8d5a\u94b1\u201d\u7684\u5373\u65f6\u6027\u8981\u6c42\u4f4e\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u65e0\u660e\u663e\u9ad8\u98ce\u9669\u7a97\u53e3**\u3002\u82e5\u5b58\u5728\u98ce\u9669\uff0c\u53ef\u80fd\u51fa\u73b0\u5728**\u8bfe\u7a0b\u4e2d\u540e\u671f**\uff0c\u5f53\u6280\u80fd\u63d0\u5347\u8fdb\u5165\u74f6\u9888\u671f\uff0c\u82e5\u957f\u65f6\u95f4\u65e0\u6cd5\u83b7\u5f97\u7a81\u7834\u6027\u8fdb\u5c55\uff0c\u53ef\u80fd\u4ea7\u751f\u81ea\u6211\u6000\u7591\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6800\u5b50\uff0c\u770b\u5230\u4f60\u4e4b\u524d\u5b66\u4e60AI\u5199\u4f5c\u65f6\u90a3\u80a1\u94bb\u7814\u52b2\u513f\uff0c\u4ece\u7ec6\u7eb2\u5165\u624b\u89e3\u51b3\u903b\u8f91\u95ee\u9898\uff0c\u8fd8\u81ea\u5df1\u5c1d\u8bd5\u4e0d\u540cAI\u5de5\u5177\uff0c\u771f\u7684\u7279\u522b\u68d2\uff01\u8fd9\u6b21AIGC\u8bfe\u7a0b\u5bf9\u4f60\u6765\u8bf4\uff0c\u5c31\u662f\u628a\u4f60\u90a3\u80a1\u2018\u6b7b\u78d5\u2019\u7cbe\u795e\u4ece\u6587\u5b57\u5ef6\u4f38\u5230\u89c6\u9891\u9886\u57df\uff0c\u76f8\u4fe1\u4f60\u4e00\u5b9a\u80fd\u73a9\u51fa\u66f4\u591a\u65b0\u82b1\u6837\u3002\u8fc7\u7a0b\u4e2d\u6709\u4efb\u4f55\u6280\u672f\u96be\u9898\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4eec\u4e00\u8d77\u653b\u514b\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u3002\u5339\u914d\u5176T3\u5b66\u9738\u7279\u8d28\uff0c\u63d0\u4f9b\u6df1\u5ea6\u3001\u7cfb\u7edf\u7684\u6280\u80fd\u8bad\u7ec3\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743**\u3011\u3002\u4e3a\u5176\u5f00\u653e\u66f4\u591a\u4e0e\u4e13\u5bb6/\u966a\u8dd1\u5b98\u6df1\u5ea6\u4ea4\u6d41\u7684\u673a\u4f1a\uff0c\u89e3\u7b54\u5176\u5173\u4e8eAI\u539f\u7406\u3001\u63d0\u793a\u8bcd\u5de5\u7a0b\u7b49\u6df1\u5c42\u95ee\u9898\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u7528\u201c\u8f7b\u677e\u8d5a\u94b1\u201d\u7684\u8bdd\u672f\u53bb\u8425\u9500\u4ed6\uff0c\u8fd9\u4e0e\u5176\u8ffd\u6c42\u80fd\u529b\u7684\u5185\u9a71\u529b\u4e0d\u7b26\u30022. \u63d0\u4f9b\u8fc7\u4e8e\u7b80\u5355\u6216\u5a31\u4e50\u5316\u7684\u5185\u5bb9\uff0c\u8fd9\u4f1a\u88ab\u89c6\u4e3a\u6d6a\u8d39\u65f6\u95f4\u30023. \u5ffd\u89c6\u6216\u6577\u884d\u5176\u63d0\u51fa\u7684\u6280\u672f\u6027\u95ee\u9898\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5176\u5df2\u8868\u73b0\u51fa\u660e\u786e\u7684\u590d\u8d2d\u610f\u5411\uff08\u4e3b\u52a8\u8be2\u95eeAIGC\u8bfe\u7a0b\uff09\uff0c\u662f\u4f18\u8d28\u7684\u9ad8\u9636\u8bfe\u7a0b\u6f5c\u5728\u5ba2\u6237\u3002\u5347\u5355\u903b\u8f91\u5e94\u56f4\u7ed5\u201c\u6280\u80fd\u62d3\u5c55\u201d\u548c\u201c\u80fd\u529b\u8fdb\u9636\u201d\uff0c\u800c\u975e\u201c\u53d8\u73b0\u52a0\u901f\u201d\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6ca1\u6709 \u6211\u6839\u636e\u5927\u5496\u8001\u5e08\u8bb2\u7684\u8bfe\u4e00\u6b65\u4e00\u6b65\u5728\u64cd\u4f5c\u3002\u56e0\u4e3a\u6211\u89c9\u5f97\u7406\u8bba\u518d\u597d\u90fd\u4e0d\u5982\u5b9e\u8df5\u201d\n2. > \u201c\u4e5f\u8981\u81ea\u5df1\u6478\u7d22\uff0c\u5370\u8c61\u624d\u6df1\u523b\u201d\n3. > \u201c\u73ed\u73ed\uff0cai\u5199\u7684\u6587\u7ae0\u91cc\u9762\u4e9b\u4e8b\u60c5\u53d1\u751f\u7684\u65f6\u95f4\u70b9\u6df7\u4e71\u8981\u600e\u4e48\u89e3\u51b3\u554a\uff0c\u8fd8\u6709\u4e00\u4e9b\u903b\u8f91\u7684\u95ee\u9898\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T3\u6b7b\u78d5\u5b66\u9738\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u4f4e**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u6df1\u5ea6\u7684\u6280\u672f\u652f\u6301\u548c\u5bf9\u5176\u94bb\u7814\u7cbe\u795e\u7684\u6301\u7eed\u80af\u5b9a**\u3002\n\n```json\n{\"core_type\": \"T3 \u6b7b\u78d5\u5b66\u9738\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\"}\n```";
