        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677163009 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u68a6\u5883/\u6d69\u8bda\uff08\u674e\u4e50\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u7cbe\u82f1\u7248\uff0c3980\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u9700\u6838\u67e5\u662f\u5426\u4e3a\u82b1\u5457\u5206\u671f\u7b49\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1\uff08\u6709\u5b9e\u4f53\u5e97\u94fa\uff0c\u9700\u517c\u987e\u5ba2\u6237\uff0c\u76f4\u64ad\u8bfe\u4f1a\u56e0\u5ba2\u6237\u8fdb\u51fa\u800c\u4e2d\u65ad\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\uff08\u5b66\u4e60\u884c\u4e3a\u4e0e\u4e92\u52a8\u4fe1\u606f\u9971\u6ee1\uff0c\u4f46\u5173\u952e\u652f\u4ed8\u4e0e\u5bb6\u5ead\u4fe1\u606f\u7f3a\u5931\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u2b07\u4f4e**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u7eaf\u4e3a\u51e0\u5929\u5185\u63d0\u73b0\u4fdd\u5e95\u800c\u6765(\u4f4e\u6781\u5371)**\u3002\u7528\u6237\u6838\u5fc3\u8bc9\u6c42\u9ad8\u5ea6\u805a\u7126\u4e8e\u201c\u53d8\u73b0\u600e\u4e48\u53d8\u201d\uff0c\u5bf9\u5b66\u4e60\u8fc7\u7a0b\u672c\u8eab\uff08\u5982\u6280\u672f\u539f\u7406\u3001\u60c5\u611f\u8868\u8fbe\uff09\u7684\u6df1\u5ea6\u8ffd\u95ee\u6781\u5c11\u3002\u5176\u5b66\u4e60\u884c\u4e3a\uff08\u4ea4\u4f5c\u4e1a\u3001\u542c\u76f4\u64ad\uff09\u66f4\u50cf\u662f\u4e3a\u4e86\u83b7\u53d6\u201c\u53d8\u73b0\u95e8\u7968\u201d\u800c\u5b8c\u6210\u7684\u5fc5\u8981\u6b65\u9aa4\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u53d8\u73b0\u600e\u4e48\u53d8\u554a[\u5472\u7259][\u5472\u7259]\u662f\u4e0d\u662f\u9700\u8981\u8003\u8bc1\u554a\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u7ecf\u8425\u5b9e\u4f53\u5e97\u94fa\uff0c\u6709\u57fa\u672c\u6d88\u8d39\u80fd\u529b\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u8d22\u52a1\u72b6\u51b5\u3002**\u9700\u8b66\u60d5\u652f\u4ed8\u65b9\u5f0f\u662f\u5426\u4e3a\u501f\u8d37**\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u6709\u4e3b\u4e1a\uff08\u5b9e\u4f53\u5e97\uff09\uff0c\u65f6\u95f4\u788e\u7247\u5316\uff0c\u80fd\u5229\u7528\u665a\u4e0a\u548c\u788e\u7247\u65f6\u95f4\u5b66\u4e60\u3001\u4ea4\u4f5c\u4e1a\uff0c\u4f46\u65e0\u6cd5\u4fdd\u8bc1\u5168\u7a0b\u4e13\u6ce8\uff08\u76f4\u64ad\u4f1a\u4e2d\u65ad\uff09\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u9500\u552e\u7684\u4e13\u4e1a\u6307\u5bfc\uff08\u5982\u6c14\u606f\u3001\u5bf9\u8c61\u611f\uff09\u80fd\u79ef\u6781\u63a5\u53d7\u5e76\u5b9e\u8df5\uff08\u201c\u53cd\u590d\u542c\u4e86\u4e09\u904d\u201d\uff09\uff0c\u5bf9\u201c\u5b9e\u4f53\u96be\u505a\u201d\u7684\u73b0\u5b9e\u538b\u529b\u6709\u6e05\u6670\u8ba4\u77e5\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u62b1\u6028\u6216\u4f9d\u8d56\u5b89\u629a\uff0c\u800c\u662f\u5bfb\u6c42\u65b0\u51fa\u8def\uff08\u201c\u8fd1\u4e24\u5e74\u5b9e\u4f53\u5f88\u96be...\u66f4\u96be\u201d\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8fd1\u4e24\u5e74\u5b9e\u4f53\u5f88\u96be\uff0c\u7279\u522b\u8ddf\u5efa\u7b51\u6253\u4ea4\u9053\u7684\u66f4\u96be[\u88c2\u5f00][\u88c2\u5f00][\u88c2\u5f00]\u201d \uff08\u9648\u8ff0\u4e8b\u5b9e\uff0c\u800c\u975e\u60c5\u7eea\u5ba3\u6cc4\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 (Safety Needs)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e3b\u4e1a\uff08\u5b9e\u4f53\u5e97\uff09\u6536\u5165\u4e0d\u7a33\u5b9a\u5e26\u6765\u7684\u7ecf\u6d4e\u7126\u8651**\u3002\u7528\u6237\u8eab\u5904\u4e0e\u5efa\u7b51\u76f8\u5173\u7684\u5b9e\u4f53\u884c\u4e1a\uff0c\u76f4\u8a00\u201c\u8fd1\u4e24\u5e74\u5b9e\u4f53\u5f88\u96be\u201d\uff0c\u5176\u5b66\u4e60\u6709\u58f0\u6f14\u64ad\u7684\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u5bfb\u627e\u4e00\u6761\u53ef\u9760\u7684**\u517c\u804c\u589e\u6536\u8def\u5f84**\uff0c\u4ee5\u5bf9\u51b2\u4e3b\u4e1a\u98ce\u9669\uff0c\u4fdd\u969c\u7ecf\u6d4e\u5b89\u5168\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u4fe1\u3001\u4f4e\u98ce\u9669\u7684\u53d8\u73b0\u8def\u5f84\u4e0e\u5b89\u5168\u611f**\u3002\u4ed6\u4e0d\u9700\u8981\u865a\u5e7b\u7684\u66b4\u5bcc\u627f\u8bfa\uff0c\u800c\u662f\u9700\u8981\u4e00\u4efd\u201c\u6280\u591a\u4e0d\u538b\u8eab\uff0c\u591a\u52b3\u591a\u5f97\u201d\u7684\u8e0f\u5b9e\u611f\uff0c\u4ee5\u53ca\u4e00\u4e2a\u80fd\u62b5\u5fa1\u4e3b\u4e1a\u6ce2\u52a8\u7684\u201c\u5b89\u5168\u57ab\u201d\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2 \u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u8bba** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u501f\u8d37\u3001\u5a01\u80c1\u7b49\u6781\u7aef\u4fe1\u53f7\u3002**\u4f46\u652f\u4ed8\u65b9\u5f0f\u672a\u77e5\uff0c\u9700\u7d27\u6025\u6838\u67e5**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u56e0\u5176\u4e3a\u517c\u804c\u4e14\u81ea\u6709\u5e97\u94fa\uff0c\u5bb6\u5ead\u5e72\u9884\u98ce\u9669\u76f8\u5bf9\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u4e3b\u4e1a\u7e41\u5fd9\u5bfc\u81f4\u5b66\u4e60\u65f6\u95f4\u88ab\u6324\u538b\uff0c\u65e0\u6cd5\u8ddf\u4e0a\u8bfe\u7a0b\u8282\u594f\uff0c\u4ea7\u751f\u201c\u94b1\u767d\u82b1\u4e86\u201d\u7684\u7126\u8651\u3002** |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u63a5\u53d7\u6307\u5bfc\u5e76\u81ea\u6211\u8c03\u6574\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u632b\u6298\u5d29\u6e83\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u6781\u9ad8** | **\u8fd9\u662f\u6700\u5927\u98ce\u9669\u70b9\u3002** \u82e5\u5728\u627f\u8bfa\u5468\u671f\u5185\uff08\u59821-3\u4e2a\u6708\uff09\u672a\u83b7\u5f97\u4efb\u4f55\u5b9e\u8d28\u6027\u7684\u517c\u804c\u6536\u5165\uff08\u54ea\u6015\u662f\u5c0f\u989d\uff09\uff0c\u5176\u201c\u5b89\u5168\u9700\u6c42\u201d\u672a\u88ab\u6ee1\u8db3\uff0c\u5c06\u6781\u5927\u6982\u7387\u89e6\u53d1\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c60-90\u5929**\u3002\u82e5\u6b64\u65f6\u4ecd\u672a\u83b7\u5f97\u4efb\u4f55\u8bd5\u97f3\u901a\u8fc7\u6216\u5fae\u5c0f\u6536\u76ca\uff0c\u5176\u57fa\u4e8e\u201c\u641e\u94b1\u201d\u7684\u7eaf\u7cb9\u52a8\u673a\u5c06\u8f6c\u5316\u4e3a\u5f3a\u70c8\u7684\u5931\u671b\u4e0e\u9000\u8d39\u8bc9\u6c42\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u770b\u5230\u4f60\u8bf4\u5b9e\u4f53\u884c\u4e1a\u8fd9\u4e24\u5e74\u4e0d\u5bb9\u6613\uff0c\u7279\u522b\u7406\u89e3\u3002\u54b1\u4eec\u5b66\u8fd9\u4e2a\uff0c\u4e0d\u56fe\u4e00\u591c\u66b4\u5bcc\uff0c\u5c31\u662f\u7ed9\u81ea\u5df1\u591a\u94fa\u4e00\u6761\u8def\uff0c\u591a\u4e00\u4efd\u6536\u5165\u4fdd\u969c\u3002\u6211\u4f1a\u5e2e\u4f60\u628a\u63a5\u5355\u7684\u8def\u5f84\u62c6\u89e3\u5f97\u6e05\u6e05\u695a\u695a\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u7a33\u624e\u7a33\u6253\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011**\u3002\u6838\u5fc3\u662f**\u7f29\u77ed\u4ece\u5b66\u4e60\u5230\u7b2c\u4e00\u7b14\u6536\u5165\u7684\u8def\u5f84**\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u8865\u5145 **\u3010\u7cbe\u786e\u6d3e\u5355\u62e6\u622aB\u6a21\u5757\u3011**\u3002\u73ed\u4e3b\u4efb\u9700\u4e25\u683c\u7b5b\u9009\u5e76\u63a8\u9001\u4e0e\u5176\u97f3\u8272\u3001\u6c34\u5e73\u5339\u914d\u7684\u771f\u5b9e\u3001\u4f4e\u95e8\u69db\u8bd5\u97f3\u5355\uff0c\u786e\u4fdd\u5176\u65e9\u671f\u6210\u529f\u7387\uff0c\u5efa\u7acb\u4fe1\u5fc3\u3002**\u4e25\u7981\u753b\u5927\u997c**\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u7528\u201c\u6708\u5165\u8fc7\u4e07\u201d\u3001\u201c\u8f7b\u677e\u526f\u4e1a\u201d\u7b49\u8bdd\u672f\u8fc7\u5ea6\u523a\u6fc0\u5176\u53d8\u73b0\u9884\u671f\uff1b2. \u5728\u5176\u65f6\u95f4\u51b2\u7a81\u65f6\u65bd\u52a0\u8fc7\u5927\u7684\u8003\u52e4\u6216\u4f5c\u4e1a\u538b\u529b\uff1b3. \u63a8\u8350\u9700\u8981\u5927\u91cf\u65f6\u95f4\u6295\u5165\u6216\u9ad8\u96be\u5ea6\u6280\u672f\u7684\u590d\u6742\u5c97\u4f4d\uff08\u5982\u540e\u671f\u3001\u7edf\u7b79\uff09\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u672a\u4ea7\u751f\u4efb\u4f55\u5b9e\u9645\u6536\u76ca\u524d\u8fdb\u884c\u5927\u989d\u5347\u5355\u63a8\u4ecb**\u3002\u53ef\u8003\u8651\u5728\u5176\u6210\u529f\u63a5\u5230\u7b2c\u4e00\u5355\u540e\uff0c\u63a8\u8350500\u5143\u4ee5\u5185\u7684\u5fae\u5347\u5355\uff08\u5982\u7279\u5b9a\u58f0\u7ebf\u8bad\u7ec3\u5305\uff09\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u53d8\u73b0\u600e\u4e48\u53d8\u554a[\u5472\u7259][\u5472\u7259]\u662f\u4e0d\u662f\u9700\u8981\u8003\u8bc1\u554a\u201d \u2014\u2014 **\u52a8\u673a\u7eaf\u5ea6\u7684\u76f4\u63a5\u8bc1\u636e\uff0c\u6838\u5fc3\u8bc9\u6c42\u662f\u201c\u53d8\u73b0\u201d**\u3002\n2. > \u201c\u8fd1\u4e24\u5e74\u5b9e\u4f53\u5f88\u96be\uff0c\u7279\u522b\u8ddf\u5efa\u7b51\u6253\u4ea4\u9053\u7684\u66f4\u96be[\u88c2\u5f00][\u88c2\u5f00][\u88c2\u5f00]\u201d \u2014\u2014 **\u5b89\u5168\u9700\u6c42\uff08\u7ecf\u6d4e\u4fdd\u969c\uff09\u7684\u6df1\u5c42\u9a71\u52a8**\u3002\n3. > \u201c\u6211\u90fd\u611f\u5174\u8da3[\u5472\u7259][\u5472\u7259]\u4f46\u662f\u505a\u4eba\u4e0d\u80fd\u592a\u8d2a\u5fc3\uff0c\u4e00\u6b65\u4e00\u6b65\u6765\uff0c\u4ece\u6700\u7b80\u5355\u7684\u505a\u8d77\u201d \u2014\u2014 **\u8868\u73b0\u51fa\u52a1\u5b9e\u3001\u5206\u6b65\u8d70\u7684\u7406\u6027\u6001\u5ea6\uff0c\u4f46\u6838\u5fc3\u4ecd\u662f\u201c\u505a\u201d\u4e86\u80fd\u5426\u201c\u53d8\u73b0\u201d**\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4 \u641e\u94b1\u7ed3\u679c\u8bba\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7ecf\u6d4e\u5b89\u5168\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5728\u5176\u5b66\u4e60\u65e9\u671f\uff0860-90\u5929\u5185\uff09\u63d0\u4f9b\u771f\u5b9e\u3001\u5339\u914d\u7684\u4f4e\u95e8\u69db\u8bd5\u97f3\u673a\u4f1a\uff0c\u786e\u4fdd\u5176\u83b7\u5f97\u7b2c\u4e00\u7b14\u5fae\u5c0f\u6536\u5165\uff0c\u5efa\u7acb\u201c\u8def\u5f84\u53ef\u884c\u201d\u7684\u5b89\u5168\u611f\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u8bba\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf\"}\n```";
