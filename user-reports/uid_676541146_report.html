    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u7f3a\u5931\u5173\u952e\u4fe1\u606f\uff1a\u652f\u4ed8\u8bb0\u5f55\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u5177\u4f53\u804c\u4e1a/\u6536\u5165\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u3001\u660e\u786e\u5b66\u4e60\u76ee\u6807\u4e0e\u9884\u671f\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49)**\n    *   **\u8868\u5c42\u4fe1\u53f7**: \u4e3b\u52a8\u7533\u8bf7\u5c0f\u52a9\u624b\u3001\u79ef\u6781\u5b8c\u6210\u4f5c\u4e1a\u3001\u4e3b\u52a8\u7d22\u8981\u4eff\u5199\u63d0\u793a\u8bcd\u7b49\u5b66\u4e60\u8d44\u6599\u3001\u8be2\u95ee\u89c6\u9891\u8bfe\u4fe1\u606f\u3001\u4e3b\u52a8\u63d0\u4ea4\u4f5c\u4e1a\u8bf7\u6c42\u70b9\u8bc4\u3002\n    *   **\u6df1\u5c42\u4fe1\u53f7**: \u5b66\u4e60\u8fc7\u7a0b\u4e2d\u9047\u5230\u660e\u663e\u56f0\u96be\uff08\u4eff\u5199\u504f\u79bb\u3001AI\u5473\u91cd\uff09\uff0c\u53cd\u590d\u6c42\u52a9\uff0c\u8868\u73b0\u51fa**\u6280\u80fd\u63d0\u5347**\u548c**\u53d8\u73b0**\u7684\u52a1\u5b9e\u9700\u6c42\u3002\u5bf9\u89c6\u9891\u8bfe\u7684\u5174\u8da3\u6e90\u4e8e\u201c\u540e\u671f\u505a\u5355\u5b50\u5bb9\u6613\u4e00\u70b9\u201d\uff0c\u663e\u793a**\u529f\u5229\u6027\u5b66\u4e60**\u503e\u5411\u3002\u4f46\u672a\u6e05\u6670\u8868\u8fbe\u957f\u671f\u804c\u4e1a\u89c4\u5212\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4fe1\u606f\u4e0d\u8db3)**\n    *   **\u65f6\u95f4\u8d44\u6e90**: \u5728\u804c\u72b6\u6001\uff08\u201c\u4e0a\u5348\u8fd8\u8981\u4e0a\u73ed\u201d\uff09\uff0c\u4f46\u80fd\u5229\u7528\u665a\u4e0a\u548c\u788e\u7247\u65f6\u95f4\u5b66\u4e60\u3001\u770b\u56de\u653e\uff0c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5c1a\u53ef\u3002\n    *   **\u7ecf\u6d4e\u8d44\u6e90**: \u672a\u63d0\u53ca\u3002\u5bf9\u5956\u91d1\u6570\u989d\u8868\u793a\u5174\u8da3\uff08\u201c\u5956\u91d1\u633a\u8bf1\u4eba\u7684\u201d\uff09\uff0c\u4f46\u672a\u900f\u9732\u7ecf\u6d4e\u538b\u529b\u6216\u652f\u4ed8\u80fd\u529b\u3002\n    *   **\u8ba4\u77e5\u8d44\u6e90**: \u5177\u5907\u57fa\u7840\u5b66\u4e60\u80fd\u529b\uff08\u80fd\u5b8c\u6210\u627e\u5b57\u6e38\u620f\uff09\uff0c\u4f46AI\u5199\u4f5c\u6280\u80fd\u5904\u4e8e**\u5165\u95e8\u6323\u624e\u671f**\uff0c\u5bf9\u6838\u5fc3\u6280\u5de7\uff08\u5982\u4eff\u5199\u3001\u53bbAI\u5473\uff09\u638c\u63e1\u56f0\u96be\uff0c\u4f9d\u8d56\u5916\u90e8\u6307\u5bfc\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u7b49\u504f\u9ad8)**\n    *   **\u575a\u6301\u6027**: \u826f\u597d\u3002\u5c3d\u7ba1\u9047\u5230\u56f0\u96be\uff08\u201c\u7814\u7a76\u4e0d\u51fa\u6765\u4e86\u201d\uff09\uff0c\u4ecd\u6301\u7eed\u63d0\u4ea4\u4f5c\u4e1a\u3001\u4e3b\u52a8\u5bfb\u6c42\u201c\u5c0f\u7076\u8bfe\u201d\uff0c\u672a\u8868\u8fbe\u653e\u5f03\u3002\n    *   **\u632b\u6298\u53cd\u5e94**: \u9762\u5bf9\u4eff\u5199\u5931\u8d25\u548c\u53cd\u9988\uff08\u201cAI\u5473\u8fd9\u4e48\u91cd\u201d\uff09\u65f6\uff0c\u8868\u73b0\u4e3a\u201c\u5c34\u5c2c\u201d\u3001\u201c\u59d4\u5c48\u201d\u4f46\u80fd\u63a5\u53d7\u5e76\u5c1d\u8bd5\u4fee\u6539\uff0c\u672a\u51fa\u73b0\u653b\u51fb\u6027\u6216\u5f7b\u5e95\u5426\u5b9a\u3002\n    *   **\u4e3b\u52a8\u6027**: \u8f83\u9ad8\u3002\u4e3b\u52a8\u63d0\u95ee\u3001\u7533\u8bf7\u89d2\u8272\u3001\u50ac\u8981\u8d44\u6599\u3001\u89c4\u5212\u4e0b\u4e00\u9636\u6bb5\u8bfe\u7a0b\uff08\u89c6\u9891\u8bfe\uff09\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u65e0\u6cd5\u5224\u65ad**\u3002\u8bb0\u5f55\u4e2d\u65e0\u652f\u4ed8\u884c\u4e3a\u3001\u4ef7\u683c\u8ba8\u8bba\u6216\u4f18\u60e0\u63d0\u53ca\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u65e0\u6cd5\u5224\u65ad**\u3002\u4ec5\u63d0\u53ca\u201c\u5bb6\u91cc\u4e8b\u60c5\u8fd8\u6ca1\u6709\u5904\u7406\u5b8c\u201d\uff0c\u672a\u6d89\u53ca\u914d\u5076\u3001\u7236\u6bcd\u7b49\u51b3\u7b56\u76f8\u5173\u65b9\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u7eaf\u5ea6**: **B\u7c7b (\u529f\u5229\u9a71\u52a8\u578b)**\u3002\u6838\u5fc3\u8bc9\u6c42\u660e\u786e\u4e3a\u638c\u63e1\u6280\u80fd\u4ee5\u63a5\u5355\u3001\u83b7\u5956\u53d8\u73b0\uff0c\u5b66\u4e60\u884c\u4e3a\u56f4\u7ed5\u5b9e\u7528\u5de5\u5177\uff08\u63d0\u793a\u8bcd\u3001\u8f6f\u4ef6\uff09\u5c55\u5f00\u3002\n*   **\u6b65\u9aa42 - \u8d44\u6e90\u5e95\u5ea7**: **\u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u5f52\u4e3aC\u7c7b**\u3002\u6709\u65f6\u95f4\u6295\u5165\u610f\u613f\uff0c\u4f46\u7ecf\u6d4e\u80fd\u529b\u548c\u5bb6\u5ead\u652f\u6301\u672a\u77e5\uff0c\u4e14\u5f53\u524d\u6280\u80fd\u6c34\u5e73\uff08AI\u5199\u4f5c\uff09\u4e0e\u53d8\u73b0\u76ee\u6807\u5b58\u5728**\u663e\u8457\u5dee\u8ddd**\u3002\n*   **\u6b65\u9aa43 - \u5fc3\u7406\u5f39\u6027**: **B\u7c7b (\u97e7\u6027\u5c1a\u53ef\u578b)**\u3002\u80fd\u627f\u53d7\u5b66\u4e60\u66f2\u7ebf\u521d\u671f\u7684\u632b\u6298\uff0c\u5e76\u6301\u7eed\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u6001\u5ea6\u79ef\u6781\u3002\n*   **\u7efc\u5408\u5224\u5b9a**: **B-C\u578b\u7528\u6237**\u3002\u6709\u660e\u786e\u7684\u5b66\u4e60\u548c\u53d8\u73b0\u52a8\u673a\uff0c\u5177\u5907\u4e00\u5b9a\u7684\u575a\u6301\u6027\uff0c\u4f46**\u6280\u80fd\u57fa\u7840\u8584\u5f31**\uff0c\u4e14**\u8d44\u6e90\u5e95\u5ea7\uff08\u5c24\u5176\u662f\u6280\u80fd\u57fa\u7840\uff09\u5b58\u5728\u77ed\u677f**\uff0c\u53d8\u73b0\u8def\u5f84\u4e0d\u6e05\u6670\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **T5 \u52a1\u5b9e\u53d8\u73b0\u8005**\u3002\u6700\u5339\u914d\u3002\u7279\u5f81\uff1a\u5b66\u4e60\u76ee\u7684\u76f4\u63a5\u6307\u5411\u201c\u505a\u5355\u5b50\u201d\u3001\u201c\u5956\u91d1\u201d\uff0c\u5bf9\u8bfe\u7a0b\u7684\u5de5\u5177\u5c5e\u6027\uff08\u4eff\u5199\u63d0\u793a\u8bcd\u3001\u89c6\u9891\u8bfe\u8f85\u52a9PS\uff09\u5173\u6ce8\u5ea6\u9ad8\uff0c\u5b66\u4e60\u884c\u4e3a\u52a1\u5b9e\uff0c\u4f46\u6280\u80fd\u5904\u4e8e\u521d\u7ea7\u9636\u6bb5\uff0c\u5bf9\u8fbe\u6210\u76ee\u6807\u7684\u8def\u5f84\u611f\u5230\u8ff7\u832b\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4e2d)\n\u9010\u9879\u6392\u67e5\uff1a\n1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**: **\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5df2\u8868\u73b0\u51fa\u201c\u4eff\u4e0d\u4e86\u4e00\u70b9\u201d\u3001\u201cAI\u5473\u91cd\u201d\u7b49\u6280\u80fd\u638c\u63e1\u56f0\u96be\uff0c\u82e5\u7ed3\u4e1a\u65f6\u4ecd\u65e0\u6cd5\u4ea7\u51fa\u5408\u683c\u4f5c\u54c1\u6216\u63a5\u5355\uff0c\u6781\u6613\u5f15\u53d1\u201c\u5b66\u4e0d\u4f1a\u201d\u6295\u8bc9\u3002\n2.  **\u670d\u52a1\u4f53\u9a8c\u5dee**: **\u4f4e\u98ce\u9669**\u3002\u7528\u6237\u4e0e\u73ed\u73ed\u4e92\u52a8\u826f\u597d\uff0c\u591a\u6b21\u83b7\u5f97\u53ca\u65f6\u54cd\u5e94\uff08\u5982\u5c0f\u7076\u8bfe\u3001\u8d44\u6599\u63d0\u4f9b\uff09\uff0c\u672a\u62b1\u6028\u670d\u52a1\u3002\n3.  **\u7ecf\u6d4e\u538b\u529b**: **\u65e0\u6cd5\u5224\u65ad**\u3002\n4.  **\u5bb6\u5ead\u53cd\u5bf9**: **\u65e0\u6cd5\u5224\u65ad**\u3002\n5.  **\u7ade\u54c1\u6bd4\u8f83/\u51b2\u52a8\u6d88\u8d39**: **\u4f4e\u98ce\u9669**\u3002\u7528\u6237\u8868\u73b0\u51fa\u6301\u7eed\u5b66\u4e60\u610f\u613f\uff0c\u5e76\u4e3b\u52a8\u8003\u8651\u7eed\u62a5\u89c6\u9891\u8bfe\uff0c\u975e\u51b2\u52a8\u51b3\u7b56\u3002\n6.  **\u4f26\u7406\u4e89\u8bae**: **\u4f4e\u98ce\u9669**\u3002\u65e0\u975e\u7406\u6027\u627f\u8bfa\u8bb0\u5f55\u3002\n7.  **\u91cd\u5927\u751f\u6d3b\u53d8\u6545**: **\u65e0\u6cd5\u5224\u65ad**\u3002\u63d0\u53ca\u201c\u5bb6\u91cc\u4e8b\u60c5\u201d\uff0c\u9700\u5173\u6ce8\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u9500\u552e\u884c\u4e3a**: \u5b58\u5728**\u9ad8\u98ce\u9669\u884c\u4e3a**\u3002\u9500\u552e\u591a\u6b21\u4f7f\u7528\u201c\u9006\u88ad\u6545\u4e8b+\u50ac\u8bfe/\u50ac\u4f5c\u4e1a\u201d\u7684\u8bdd\u672f\u6a21\u677f\uff08\u5982\u4e5e\u4e10\u9006\u88ad\u3001\u660e\u661f\u9006\u88ad\u3001\u4ed9\u5e1d\u9006\u88ad\uff09\uff0c**\u6d89\u5acc\u5229\u7528\u60c5\u611f\u5171\u9e23\u8fdb\u884c\u673a\u68b0\u6027\u4fc3\u6d3b**\uff0c\u5185\u5bb9\u4e0e\u8bfe\u7a0b\u5b9e\u8d28\u5173\u8054\u5f31\u3002\n*   **\u627f\u8bfa\u4e0e\u8bf1\u5bfc**: \u672a\u53d1\u73b0\u5938\u5927\u6536\u76ca\u627f\u8bfa\u3002\u4f46\u63d0\u53ca\u201c\u5165\u56f4\u4e86\u5c31\u5f88\u725b\uff0c\u51fa\u53bb\u505a\u5546\u5355\u90fd\u62a2\u4f60\u201d\u3001\u201c\u90fd\u5e26\u56e2\u961f\u5566\u201d\u7b49\u6848\u4f8b\uff0c**\u5b58\u5728\u6f5c\u5728\u7684\u6210\u529f\u5b66\u6697\u793a**\u3002\n*   **\u5bb6\u5ead\u77e5\u60c5**: **\u672a\u6838\u67e5**\uff0c\u5b58\u5728\u98ce\u9669\u3002\n*   **\u8fc7\u5ea6\u8425\u9500**: \u5728\u7528\u6237\u8868\u8fbe\u201c\u5bb6\u91cc\u4e8b\u60c5\u8fd8\u6ca1\u6709\u5904\u7406\u5b8c\u201d\u540e\uff0c\u4ecd\u8ffd\u95ee\u201c\u89c6\u9891\u8bfe\u4f60\u73b0\u5728\u62a5\u540d\u5417\uff1f\u201d\uff0c**\u5b58\u5728\u4e0d\u5408\u65f6\u5b9c\u7684\u903c\u5355\u503e\u5411**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u884c\u52a8\u6307\u5357**: **\u9996\u5468\u91cd\u70b9\u6280\u80fd\u6821\u51c6\uff0c\u63d0\u4f9b\u6e05\u6670\u53d8\u73b0\u8def\u5f84\u56fe**\u3002\u73ed\u4e3b\u4efb\u9700\u7acb\u5373\u4ecb\u5165\uff1a\n    1.  **\u6280\u80fd\u8bca\u65ad\u4e0e\u5f3a\u5316**: \u9488\u5bf9\u5176\u4eff\u5199\u3001\u53bbAI\u5473\u7684\u6838\u5fc3\u75db\u70b9\uff0c\u63d0\u4f9b**\u4e00\u5bf9\u4e00\u3001\u624b\u628a\u624b\u7684\u6848\u4f8b\u62c6\u89e3\u4e0e\u4fee\u6539\u6307\u5bfc**\uff0c\u800c\u975e\u4ec5\u63d0\u4f9b\u6a21\u677f\u3002\n    2.  **\u9884\u671f\u7ba1\u7406**: \u660e\u786e\u544a\u77e5\u4ece\u5f53\u524d\u6c34\u5e73\u5230\u7a33\u5b9a\u63a5\u5355\u6240\u9700\u7684**\u65f6\u95f4\u3001\u7ec3\u4e60\u91cf\u53ca\u53ef\u80fd\u7684\u4e2d\u4ecb\u5e73\u53f0**\uff0c\u964d\u4f4e\u5176\u4e0d\u5207\u5b9e\u9645\u7684\u53d8\u73b0\u9884\u671f\u3002\n    3.  **\u8def\u5f84\u89c4\u5212**: \u5e2e\u52a9\u5176\u5236\u5b9a\u5206\u9636\u6bb5\u5b66\u4e60\u76ee\u6807\uff08\u5982\u5148\u5b8c\u62101\u7bc7\u5408\u683c\u6295\u7a3f\uff09\uff0c\u800c\u975e\u76f4\u63a5\u7784\u51c6\u201c\u83b7\u5956\u201d\u3001\u201c\u5e26\u56e2\u961f\u201d\u3002\n    4.  **\u5bb6\u5ead\u60c5\u51b5\u5173\u6ce8**: \u6e29\u548c\u8be2\u95ee\u201c\u5bb6\u91cc\u4e8b\u60c5\u201d\u662f\u5426\u4f1a\u5f71\u54cd\u5b66\u4e60\uff0c\u8868\u8fbe\u652f\u6301\u3002\n*   **\u4ea7\u54c1\u5339\u914d**: **\u5339\u914d**\u3002\u5f53\u524d\u77ed\u6545\u4e8bAI\u8bfe\u7b26\u5408\u5176\u5165\u95e8\u9700\u6c42\u3002\u89c6\u9891\u8bfe\u4e0e\u5176\u201c\u5b66\u4e60PS\u201d\u3001\u201c\u505a\u6f2b\u5267\u201d\u7684\u5174\u8da3\u70b9\u5339\u914d\uff0c\u4f46\u9700\u8bc4\u4f30\u5176\u65f6\u95f4\u4e0e\u6280\u80fd\u57fa\u7840\u662f\u5426\u8db3\u4ee5\u652f\u6491\u540c\u65f6\u5b66\u4e60\u4e24\u95e8\u8bfe\u3002\n\n{\"core_type\": \"T5 \u52a1\u5b9e\u53d8\u73b0\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u9996\u5468\u91cd\u70b9\u6280\u80fd\u6821\u51c6\u4e0e\u53d8\u73b0\u9884\u671f\u7ba1\u7406\"}";
