        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677182391 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5b50\u6708\u8001\u5e08\uff08\u9a6c\u8389\uff09\u30011051\u9526\u9ca4\uff08\u9a6c\u8389\uff09\u3001\u5143\u82f1\u73ed\u73ed\uff08\u8303\u57f9\u5a1c\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u77ed\u89c6\u9891\u7cfb\u7edf\u8bfe\uff083980\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u672a\u77e5\u3002\u7528\u6237\u63d0\u53ca\u201c\u53bb\u5077\u5b69\u5b50\u7684\u538b\u5c81\u94b1\u53bb\u201d\uff0c**\u7591\u4f3c\u5b58\u5728\u5bb6\u5ead\u8d44\u91d1\u632a\u7528\u6216\u652f\u4ed8\u538b\u529b**\uff0c\u9700\u8b66\u60d5\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u672a\u77e5\u3002\u4f46\u7528\u6237\u80fd\u53c2\u4e0e\u76f4\u64ad\u3001\u5b8c\u6210\u4f5c\u4e1a\uff0c\u65f6\u95f4\u5b89\u6392\u76f8\u5bf9\u81ea\u7531\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u7591\u4f3c\u9690\u7792\u5077\u62a5**\u3002\u7528\u6237\u539f\u8bdd\u201c\u5b69\u4ed6\u5988\u5e26\u7740\u5b69\u5b50\u51fa\u53bb\u73a9\u53bb \u6211\u53bb\u5077\u5b69\u5b50\u7684\u538b\u5c81\u94b1\u53bb\u201d\uff0c\u8868\u660e\u5bb6\u5ead\u5185\u90e8\u53ef\u80fd\u4e0d\u77e5\u60c5\u6216\u5b58\u5728\u53cd\u5bf9\u98ce\u9669\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u6709\u5b66\u4e60\u884c\u4e3a\u3001\u5174\u8da3\u8868\u8fbe\u548c\u4ef7\u683c\u8bd5\u63a2\uff0c\u4f46\u7f3a\u4e4f\u660e\u786e\u7684\u4e2a\u4eba\u80cc\u666f\u3001\u804c\u4e1a\u3001\u65f6\u95f4\u7b49\u6df1\u5ea6\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u2b06\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u8ffd\u6c42\u81ea\u6211\u5b9e\u73b0\u4e0e\u6280\u80fd\u7cbe\u8fdb\uff0c\u800c\u975e\u77ed\u671f\u66b4\u5bcc\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u505a\u52a8\u6f2b\u662f\u6211\u7684\u7406\u60f3\u201d\n  > \u201c\u5176\u5b9e\u6211\u73b0\u5728\u8fd8\u6709\u4e00\u4e2a\u6bd4\u8f83\u62c5\u5fc3\u7684\u95ee\u9898 \u5c31\u662f\u966a\u8dd1\u7684\u95ee\u9898...\u8981\u662f\u8bfe\u7a0b\u7ed3\u675f\u5c31\u4e0d\u7ba1\u4e86 \u81ea\u5df1\u4e00\u4e2a\u4eba\u95ed\u95e8\u9020\u8f66\uff0c\u4f30\u8ba1\u4f1a\u5f88\u96be\u53d7\u201d\n  > \u201c\u62e5\u62b1AI\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u8003\u86513980\u5143\u8bfe\u7a0b\uff0c\u4f46\u4e3b\u52a8\u8be2\u95ee\u4f18\u60e0\u7a7a\u95f4\uff0c\u5e76\u5f00\u73a9\u7b11\u7528\u201c\u5b69\u5b50\u538b\u5c81\u94b1\u201d\uff0c\u8868\u660e\u8d44\u91d1\u5e76\u975e\u6781\u5ea6\u5145\u88d5\uff0c\u6709\u6210\u672c\u8003\u91cf\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u8ddf\u4e0a\u8bfe\u7a0b\u8282\u594f\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u4e92\u52a8\uff0c\u8868\u660e\u6709\u53ef\u652f\u914d\u7684\u5b66\u4e60\u65f6\u95f4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4f4e** \u2014 **\u5bb6\u5ead\u907f\u96f7\u9488\u98ce\u9669\u9ad8**\u3002\u7528\u6237\u201c\u5077\u538b\u5c81\u94b1\u201d\u7684\u8a00\u8bba\u662f\u660e\u786e\u7684\u98ce\u9669\u4fe1\u53f7\uff0c\u8868\u660e\u5bb6\u5ead\u5185\u90e8\u53ef\u80fd\u5b58\u5728\u53cd\u5bf9\u6216\u4e0d\u652f\u6301\uff0c\u8fd9\u662f\u8d44\u6e90\u5e95\u5ea7\u7684\u6700\u5927\u77ed\u677f\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\uff0c\u5177\u5907\u5e7d\u9ed8\u611f\u4e0e\u81ea\u5632\u80fd\u529b\uff0c\u80fd\u4e3b\u52a8\u63d0\u95ee\u5e76\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u521a\u521a\u6253\u5f00\u4e00\u770b\u8fd8\u5728\u6392\u961f[\u6342\u8138] \u5373\u68a6\u5c31\u8fd9\u4e48\u706b\u561b\u201d\n  > \u201c\u6211\u4e4b\u524d\u505a\u8fc7\u7535\u5546\uff0c\u522b\u62ff\u5238\u538b\u6211[\u673a\u667a]\u201d\n  > \u201c\u6709\u6ca1\u6709\u90aa\u4fee\u8f6f\u4ef6\u53ef\u7528\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u201c\u95ed\u95e8\u9020\u8f66\u201d\u7684\u6050\u60e7\u548c\u5bf9\u6301\u7eed\u6210\u957f\u3001\u6709\u4eba\u966a\u4f34\u6307\u5bfc\u7684\u5f3a\u70c8\u9700\u6c42\u3002\u4ed6\u5bb3\u6015\u6280\u80fd\u8fed\u4ee3\u540e\u65e0\u4eba\u5f15\u9886\uff0c\u6e34\u671b\u878d\u5165\u4e00\u4e2a\u80fd\u63d0\u4f9b\u6301\u7eed\u652f\u6301\u548c\u8d44\u6e90\u7684\u5708\u5b50\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u5708\u5185\u4eba\u201d\u7684\u5f52\u5c5e\u611f\u4e0e\u201c\u88ab\u770b\u89c1\u201d\u7684\u4e13\u4e1a\u8ba4\u540c**\u3002\u8ba9\u4ed6\u611f\u89c9\u81ea\u5df1\u4e0d\u4ec5\u662f\u5b66\u5458\uff0c\u66f4\u662f\u672a\u6765AI\u521b\u4f5c\u5708\u7684\u4e00\u4efd\u5b50\uff0c\u6709\u524d\u8f88\uff08\u5b66\u59d0\uff09\u5e26\u8def\uff0c\u6709\u5e73\u53f0\u548c\u5de5\u4f5c\u5ba4\u8d44\u6e90\u652f\u6491\uff0c\u80fd\u5b9e\u73b0\u201c\u505a\u52a8\u6f2b\u201d\u7684\u7406\u60f3\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T3 \u6b7b\u78d5\u6781\u5ba2\u6d3e** (\u9ad8\u590d\u8d2d\u6f5c\u529b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\u3002\u4f46**\u5bb6\u5ead\u8d44\u91d1\u632a\u7528\u98ce\u9669**\u9700\u5728\u540e\u7eed\u670d\u52a1\u4e2d\u5bc6\u5207\u5173\u6ce8\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\uff1a\u62a5\u540d\u8d44\u91d1\u6765\u6e90\u4e8e\u201c\u5077\u5b69\u5b50\u7684\u538b\u5c81\u94b1\u201d\uff0c\u4e00\u65e6\u88ab\u5bb6\u4eba\u53d1\u73b0\u6216\u5bb6\u5ead\u77db\u76fe\u6fc0\u5316\uff0c\u6781\u6613\u5f15\u53d1\u5f3a\u5236\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u5b66\u4e60\u610f\u613f\u5f3a\uff0c\u65f6\u95f4\u5b89\u6392\u5c1a\u53ef\uff0c\u4e3b\u52a8\u8ddf\u8fdb\u5b66\u4e60\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u5e7d\u9ed8\u5e94\u5bf9\u6280\u672f\u95ee\u9898\uff08\u5982\u6392\u961f\uff09\uff0c\u4e0d\u6613\u56e0\u64cd\u4f5c\u632b\u6298\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u5bf9\u201c\u966a\u8dd1\u201d\u548c\u957f\u671f\u652f\u6301\u6709\u9ad8\u671f\u5f85\u3002\u82e5\u7ed3\u4e1a\u540e\u611f\u89c9\u88ab\u201c\u629b\u5f03\u201d\uff0c\u6216\u63a5\u5355\u8d44\u6e90\u4e0e\u9884\u671f\u4e0d\u7b26\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e1-2\u4e2a\u6708\u5185**\u3002\u6b64\u65f6\u5bb6\u5ead\u77db\u76fe\u53ef\u80fd\u7206\u53d1\uff0c\u6216\u5176\u5bf9\u201c\u6301\u7eed\u652f\u6301\u201d\u7684\u671f\u5f85\u82e5\u672a\u6ee1\u8db3\uff0c\u53ef\u80fd\u89e6\u53d1\u9000\u8d39\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5b66\u957f\u597d\uff01\u770b\u5230\u4f60\u8bf4\u2018\u505a\u52a8\u6f2b\u662f\u6211\u7684\u7406\u60f3\u2019\uff0c\u771f\u7684\u5f88\u6709\u5171\u9e23\u3002\u54b1\u4eec\u8fd9\u4e2a\u5708\u5b50\u6700\u6015\u7684\u5c31\u662f\u5b66\u5b8c\u6ca1\u4eba\u5e26\uff0c\u81ea\u5df1\u6478\u7d22\u6389\u961f\u3002\u4f60\u653e\u5fc3\uff0c\u8fdb\u4e86\u54b1\u4eec\u73ed\u548c\u5de5\u4f5c\u5ba4\uff0c\u4f60\u5c31\u662f\u2018\u81ea\u5df1\u4eba\u2019\u4e86\u3002\u4e0d\u4ec5\u6709\u7cfb\u7edf\u7684\u8bfe\uff0c\u540e\u7eed\u7684AI\u5de5\u5177\u8fed\u4ee3\u3001\u65b0\u7684\u5546\u5355\u6e20\u9053\uff0c\u6211\u4eec\u90fd\u4f1a\u5728\u5708\u5b50\u91cc\u7b2c\u4e00\u65f6\u95f4\u540c\u6b65\u3002\u4f60\u4e0d\u662f\u4e00\u4e2a\u4eba\u5728\u6218\u6597\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** + **\u3010\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\u3011**\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T3\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a**\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011**\u3001**\u3010\u5de5\u4f5c\u5ba4\u5185\u90e8\u8d44\u6e90\u4f18\u5148\u4f53\u9a8c\u6743\u3011**\u3002\u53ef\u9002\u65f6\u5f15\u5165**\u3010\u540e\u7aef\u5927\u725b1v1\u70b9\u8bc4\u3011**\uff08B\u6a21\u5757\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u5ffd\u89c6\u5176\u5bb6\u5ead\u98ce\u9669**\uff0c\u5728\u6c9f\u901a\u4e2d\u907f\u514d\u63d0\u53ca\u201c\u5bb6\u4eba\u662f\u5426\u652f\u6301\u201d\u7b49\u53ef\u80fd\u5f15\u53d1\u8b66\u60d5\u7684\u8bdd\u9898\u30022. **\u7528\u4f4e\u9636\u3001\u54c4\u5c0f\u5b69\u7684\u8bdd\u672f**\u5bf9\u5f85\u4ed6\uff0c\u4ed6\u9700\u8981\u7684\u662f\u4e13\u4e1a\u8ba4\u540c\u548c\u5708\u5185\u4eba\u5e73\u7b49\u5bf9\u8bdd\u30023. **\u5728\u6280\u672f\u95ee\u9898\u4e0a\u7ed9\u6a21\u7cca\u7b54\u6848**\uff0c\u4ed6\u9700\u8981\u6e05\u6670\u3001\u5e95\u5c42\u7684\u539f\u7406\u89e3\u7b54\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u4ed6\u5bf9\u6df1\u5ea6\u6280\u672f\u548c\u8d44\u6e90\u6709\u6e34\u6c42\uff0c\u662f\u9ad8\u4ef7\u79c1\u6559\u8bfe\u3001\u786c\u4ef6\u8bbe\u5907\u3001\u9ad8\u9636\u5de5\u4f5c\u6d41\u8bfe\u7a0b\u7684\u6838\u5fc3\u6f5c\u5728\u5ba2\u6237\u3002\u4f46\u63a8\u4ecb\u65f6\u5fc5\u987b\u7d27\u6263\u201c\u89e3\u51b3\u95ed\u95e8\u9020\u8f66\u7126\u8651\u201d\u548c\u201c\u5b9e\u73b0\u52a8\u6f2b\u7406\u60f3\u201d\u8fd9\u4e24\u4e2a\u70b9\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u505a\u52a8\u6f2b\u662f\u6211\u7684\u7406\u60f3\u201d\n2. > \u201c\u5176\u5b9e\u6211\u73b0\u5728\u8fd8\u6709\u4e00\u4e2a\u6bd4\u8f83\u62c5\u5fc3\u7684\u95ee\u9898 \u5c31\u662f\u966a\u8dd1\u7684\u95ee\u9898...\u8981\u662f\u8bfe\u7a0b\u7ed3\u675f\u5c31\u4e0d\u7ba1\u4e86 \u81ea\u5df1\u4e00\u4e2a\u4eba\u95ed\u95e8\u9020\u8f66\uff0c\u4f30\u8ba1\u4f1a\u5f88\u96be\u53d7\u201d\n3. > \u201c\u6211\u4e4b\u524d\u505a\u8fc7\u7535\u5546\uff0c\u522b\u62ff\u5238\u538b\u6211[\u673a\u667a]\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T3 \u6b7b\u78d5\u6781\u5ba2\u6d3e\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u81ea\u6211\u5b9e\u73b0\u4e0e\u5708\u5c42\u5f52\u5c5e\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c**\u6838\u5fc3\u98ce\u9669\u6765\u81ea\u5bb6\u5ead\u8d44\u91d1\u632a\u7528**\u3002\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5f3a\u5316\u201c\u5708\u5185\u4eba\u201d\u8eab\u4efd\u8ba4\u540c\uff0c\u63d0\u4f9b\u6301\u7eed\u7684\u6280\u672f\u8fdb\u9636\u4e0e\u8d44\u6e90\u652f\u6301\uff0c\u540c\u65f6\u907f\u514d\u89e6\u53d1\u5bb6\u5ead\u77db\u76fe\u3011**\u3002\n\n```json\n{\"core_type\": \"T3 \u6b7b\u78d5\u6781\u5ba2\u6d3e\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u7537\", \"city\": \"\u672a\u77e5\"}\n```";
