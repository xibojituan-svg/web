    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4ee5\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\u7684\u8eab\u4efd\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677159531 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u68a6\u5883/\u679c\u5b501 (\u90d1\u5b87) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u4e3b\u64ad\u8bfe\u7a0b (3980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3** (\u5c1d\u8bd5\u82b1\u5457\u5206\u671f\u5931\u8d25\uff0c\u6700\u7ec8\u4f7f\u7528\u652f\u4ed8\u5b9d\u5bf9\u516c\u8d26\u6237\u652f\u4ed8\uff0c\u4f46\u652f\u4ed8\u8fc7\u7a0b\u663e\u793a\u8d44\u91d1\u7d27\u5f20) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u7528\u6237\u8be2\u95ee\u201c\u4e13\u4e1a\u8bfe\u6709\u56de\u653e\u53ef\u4ee5\u770b\u5417\uff1f\u6211\u7684\u65f6\u95f4\u4e0d\u81ea\u7531\u201d) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u672a\u77e5** (\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** (\u5b66\u4e60\u4e92\u52a8\u3001\u6280\u672f\u63d0\u95ee\u3001\u652f\u4ed8\u884c\u4e3a\u3001\u987e\u8651\u8868\u8fbe\u5747\u6709\u4f53\u73b0) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34(\u4e2d)**\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\uff08\u6309\u65f6\u4ea4\u4f5c\u4e1a\u3001\u63d0\u95ee\uff09\uff0c\u4f46\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u53d8\u73b0\uff0c\u4e14\u5bf9\u53d8\u73b0\u8def\u5f84\u548c\u6295\u5165\u56de\u62a5\u6bd4\u6709\u5f3a\u70c8\u7684\u4e0d\u786e\u5b9a\u6027\u548c\u7126\u8651\u611f\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u8001\u5e08\u4e0d\u62a5\u540d\u6b63\u5f0f\u8bfe\u5c31\u4e0d\u80fd\u548c\u4f60\u4e00\u8d77\u5f55\u4e86\u5427\uff1f\u201d\n> \u201c\u62a5\u540d\u8d39\u7528\u4e00\u5b9a\u5f88\u8d35\u5427\uff1f\u201d\n> \u201c\u8001\u5e08\u5f55\u7684\u771f\u68d2[\u5f3a]\u5509\uff0c\u4f46\u662f\u6211\u89c9\u5f97\u81ea\u5df1\u7684\u8bd5\u97f3\u8001\u662f\u901a\u4e0d\u8fc7\uff0c\u4e5f\u5c31\u4e0d\u53ef\u80fd\u63a5\u5355\uff0c\u4e5f\u5c31\u8d5a\u4e0d\u4e86\u94b1\u4e86\u201d\n> \u201c\u8001\u5e08\u4e0d\u5f55\u4e66\uff0c\u53ea\u505a\u753b\u672c\u7684\u8bdd\uff0c\u4e00\u4e2a\u6708\u80fd\u6709\u591a\u5c11\u94b1\uff1f\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 **\u8d44\u91d1\u627f\u8f7d\u529b**\uff1a**\u4f4e** \u2014 \u5c1d\u8bd5\u82b1\u5457\u5206\u671f\u5931\u8d25\uff0c\u660e\u786e\u8868\u793a\u201c\u6ca1\u6709\u5176\u4ed6\u94b1\u201d\uff0c\u652f\u4ed83980\u5143\u8bfe\u7a0b\u8d39\u5b58\u5728\u660e\u663e\u538b\u529b\u3002\n- \u23f1 **\u65f6\u95f4\u4e0e\u7cbe\u529b**\uff1a**\u4e2d\u4f4e** \u2014 \u4e3b\u52a8\u5b66\u4e60\uff0c\u80fd\u6309\u65f6\u63d0\u4ea4\u4f5c\u4e1a\uff0c\u4f46\u660e\u786e\u8868\u793a\u201c\u65f6\u95f4\u4e0d\u81ea\u7531\u201d\uff0c\u4f9d\u8d56\u8bfe\u7a0b\u56de\u653e\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 **\u5bb6\u5ead\u652f\u6301\u5ea6**\uff1a**\u672a\u77e5** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff0c\u4f46\u57fa\u4e8e\u8d44\u91d1\u538b\u529b\u548c\u65f6\u95f4\u4e0d\u81ea\u7531\uff0c\u63a8\u6d4b\u652f\u6301\u5ea6\u4e0d\u9ad8\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b07\u4f4e\u6781\u5371]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u7528\u6237\u9891\u7e41\u81ea\u6211\u5426\u5b9a\uff08\u201c\u6211\u6709\u70b9\u513f\u7b28\u201d\u3001\u201c\u6211\u89c9\u5f97\u81ea\u5df1\u7684\u8bd5\u97f3\u8001\u662f\u901a\u4e0d\u8fc7\u201d\uff09\uff0c\u5bf9\u6280\u672f\u7ec6\u8282\uff08\u8bbe\u5907\u3001\u63a5\u5355\uff09\u8868\u73b0\u51fa\u6301\u7eed\u7684\u7126\u8651\u548c\u6000\u7591\uff0c\u9700\u8981\u9500\u552e\u53cd\u590d\u5b89\u629a\u548c\u627f\u8bfa\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u6211\u6709\u70b9\u513f\u7b28\uff0c\u611f\u89c9\u753b\u672c\u8fd8\u53ef\u4ee5\u8bd5\u8bd5\u3002[\u6342\u8138]\u201d\n> \u201c\u8fd8\u6709\u5f88\u591a\u5355\u5b50\u90fd\u662f\u8981\u6c42\u97f3\u8d28\u597d\u7684\u4e0d\u4e70\u8bbe\u5907\u53ea\u7528\u624b\u673a\u7684\u8bdd\u662f\u4e0d\u53ef\u80fd\u8fbe\u5230\u8981\u6c42\u7684\uff0c\u8fd9\u6837\u4e5f\u4e0d\u53ef\u80fd\u63a5\u5355\u5440\u3002\u201d\n> \u201c\u540e\u7eed\u8001\u5e08\u4eec\u80af\u5b9a\u4f1a\u8ba9\u6211\u4eec\u4e70\u8bbe\u5907\uff0c\u4f46\u662f\u6211\u4e0d\u60f3\u4e70\u3002\u4f46\u662f\u4e0d\u4e70\u7684\u8bdd\u5462\u53c8\u80af\u5b9a\u63a5\u4e0d\u5230\u5355[\u5bb3\u7f9e]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u672a\u6765\u7684\u6781\u5ea6\u4e0d\u5b89\u5168\u611f\u4e0e\u81ea\u6211\u4ef7\u503c\u6000\u7591**\u3002\u7528\u6237\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u6709\u58f0\u4e66\u83b7\u5f97\u4e00\u4efd\u7a33\u5b9a\u7684\u517c\u804c\u6536\u5165\uff0c\u4ee5\u7f13\u89e3\u7ecf\u6d4e\u538b\u529b\uff08\u5b89\u5168\u9700\u6c42\uff09\uff0c\u4f46\u8fc7\u7a0b\u4e2d\u4e0d\u65ad\u88ab\u201c\u80fd\u529b\u4e0d\u8db3\u201d\u3001\u201c\u8bbe\u5907\u95e8\u69db\u201d\u3001\u201c\u63a5\u5355\u56f0\u96be\u201d\u7b49\u60f3\u8c61\u51fa\u6765\u7684\u969c\u788d\u6240\u56f0\u6270\uff0c\u9677\u5165\u201c\u60f3\u6539\u53d8-\u6015\u5931\u8d25\u201d\u7684\u5faa\u73af\u7126\u8651\u4e2d\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u9632\u62a4\u76fe\u5f0f\u7684\u5b89\u5168\u611f\u4e0e\u6301\u7eed\u7684\u6b63\u5411\u80af\u5b9a**\u3002\u9700\u8981\u4e0d\u65ad\u62c6\u89e3\u5176\u6050\u60e7\uff08\u5982\u201c\u624b\u673a\u4e5f\u80fd\u5f55\u201d\u3001\u201c\u753b\u672c\u4e5f\u80fd\u8d5a\u94b1\u201d\uff09\uff0c\u5e76\u7528\u5177\u4f53\u6848\u4f8b\u548c\u6b65\u9aa4\u5316\u7684\u627f\u8bfa\uff08\u5982\u201c\u5e26\u4f60\u5f00\u901a\u6e20\u9053\u201d\uff09\u6765\u6784\u5efa\u4e00\u6761\u201c\u53ef\u5b9e\u73b0\u7684\u8def\u5f84\u201d\uff0c\u6d88\u9664\u5176\u201c\u5b66\u4e86\u4e5f\u767d\u5b66\u201d\u7684\u6050\u614c\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74** (\u4e25\u91cd\u5185\u8017\u578b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u7528\u6237\u867d\u8d44\u91d1\u7d27\u5f20\uff0c\u4f46\u672a\u63d0\u53ca\u501f\u8d37\uff0c\u4e14\u6700\u7ec8\u5b8c\u6210\u652f\u4ed8\uff0c\u672a\u51fa\u73b0\u6781\u7aef\u5a01\u80c1\u8a00\u8bba)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u4e0d\u9002\u7528\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u652f\u4ed8\u884c\u4e3a\u53ef\u80fd\u672a\u4e0e\u5bb6\u4eba\u5145\u5206\u6c9f\u901a\uff0c\u540e\u7eed\u82e5\u5b66\u4e60\u6295\u5165\u65f6\u95f4\u4e0e\u5bb6\u5ead\u8d23\u4efb\u51b2\u7a81\uff0c\u6216\u5bb6\u4eba\u53d1\u73b0\u5176\u6295\u5165\u91d1\u94b1\u5374\u672a\u5feb\u901f\u53d8\u73b0\uff0c\u53ef\u80fd\u5f15\u53d1\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | \u7528\u6237\u81ea\u8ff0\u201c\u65f6\u95f4\u4e0d\u81ea\u7531\u201d\uff0c\u82e5\u8bfe\u7a0b\u8282\u594f\u7d27\u51d1\u3001\u4f5c\u4e1a\u91cf\u5927\uff0c\u6781\u6613\u56e0\u65e0\u6cd5\u8ddf\u4e0a\u8fdb\u5ea6\u800c\u4ea7\u751f\u201c\u6389\u961f\u6050\u614c\u201d\uff0c\u53e0\u52a0\u5176\u81ea\u5351\u5fc3\u7406\uff0c\u5bfc\u81f4\u81ea\u6211\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | **\u8fd9\u662f\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u4efb\u4f55\u4e00\u6b21\u8bd5\u97f3\u5931\u8d25\u3001\u4f5c\u4e1a\u88ab\u6279\u8bc4\u3001\u6216\u53d1\u73b0\u63a5\u5355\u5e76\u975e\u60f3\u8c61\u4e2d\u5bb9\u6613\uff0c\u90fd\u53ef\u80fd\u89e6\u53d1\u5176\u201c\u6211\u592a\u7b28\u4e86\u201d\u3001\u201c\u679c\u7136\u4e0d\u884c\u201d\u7684\u5d29\u6e83\u5ff5\u5934\uff0c\u8fdb\u800c\u8981\u6c42\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | \u5bf9\u201c\u753b\u672c\u4e00\u4e2a\u6708\u80fd\u8d5a\u591a\u5c11\u201d\u6709\u5177\u4f53\u671f\u5f85\u3002\u82e5\u5b66\u4e60\u4e00\u6bb5\u65f6\u95f4\u540e\uff08\u59821-2\u4e2a\u6708\uff09\u4ecd\u65e0\u4efb\u4f55\u53d8\u73b0\u8ff9\u8c61\u6216\u6536\u5165\u8fdc\u4f4e\u4e8e\u9884\u671f\uff0c\u4f1a\u7acb\u523b\u8d28\u7591\u8bfe\u7a0b\u4ef7\u503c\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u5b66\u4e60\u96be\u5ea6\u63d0\u5347\uff0c\u7b2c\u4e00\u6b21\u72ec\u7acb\u8bd5\u97f3\u6216\u63a5\u5355\u4efb\u52a1\u53ef\u80fd\u906d\u9047\u632b\u6298\uff0c\u662f\u5176\u5fc3\u7406\u9632\u7ebf\u6700\u8106\u5f31\u7684\u65f6\u671f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5a1f\u5a1c\uff0c\u770b\u5230\u4f60\u63d0\u4ea4\u7684\u4f5c\u4e1a\u4e86\uff0c\u7279\u522b\u8ba4\u771f\uff01\u54b1\u4eec\u4e0d\u8ddf\u522b\u4eba\u6bd4\u901f\u5ea6\uff0c\u5c31\u6309\u7167\u4f60\u81ea\u5df1\u7684\u8282\u594f\u6765\u3002\u4f60\u62c5\u5fc3\u7684\u8bbe\u5907\u3001\u63a5\u5355\u8fd9\u4e9b\u95ee\u9898\uff0c\u73ed\u73ed\u90fd\u8bb0\u7740\u5462\uff0c\u54b1\u4eec\u8bfe\u7a0b\u91cc\u4f1a\u4e00\u6b65\u6b65\u5e26\u4f60\u89e3\u51b3\u3002\u8bb0\u4f4f\uff0c\u4f60\u6bcf\u5b8c\u6210\u4e00\u6b21\u7ec3\u4e60\uff0c\u90fd\u662f\u5728\u4e3a\u81ea\u5df1\u94fa\u8def\uff0c\u73ed\u73ed\u4f1a\u4e00\u76f4\u966a\u7740\u4f60\uff0c\u54b1\u4eec\u7a33\u7a33\u5730\u8d70\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf**\u3011\u3002\u6838\u5fc3\u76ee\u6807\u662f\u5efa\u7acb\u5b89\u5168\u611f\uff0c\u800c\u975e\u65bd\u52a0\u538b\u529b\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n    1.  **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305 (\u6ee1\u914dC\u6a21\u5757)\u3011**\uff1a\u73ed\u4e3b\u4efb\u9700\u9ad8\u9891\u6b21\u7ed9\u4e88\u201c\u6781\u5938\u5f20\u7684\u8d5e\u7f8e\u201d\uff0c\u54ea\u6015\u662f\u5c0f\u8fdb\u6b65\u4e5f\u8981\u653e\u5927\u8868\u626c\u3002\u79c1\u804a\u6c9f\u901a\u9700\u5145\u6ee1\u8010\u5fc3\u4e0e\u5171\u60c5\uff0c\u62ff\u8d70\u5176\u81ea\u6211\u65bd\u52a0\u7684\u96be\u9898\u3002\n    2.  **\u3010\u964d\u7ef4\u5b9e\u64cd\u4fdd\u969c\u5305 (\u51cf\u538b\u7248A\u6a21\u5757)\u3011**\uff1a\u4efb\u52a1\u6307\u4ee4\u5fc5\u987b\u6781\u5176\u6e05\u6670\u3001\u6b65\u9aa4\u5316\u3002\u5bf9\u4e8e\u8f6f\u4ef6\u64cd\u4f5c\u3001\u4f5c\u4e1a\u63d0\u4ea4\u7b49\u6d41\u7a0b\uff0c\u63d0\u4f9b\u201c\u4e00\u952e\u5f0f\u201d\u6307\u5f15\u6216\u4ee3\u529e\u652f\u6301\uff0c\u907f\u514d\u5176\u56e0\u64cd\u4f5c\u56f0\u60d1\u800c\u5d29\u6e83\u3002\n    3.  **\u3010\u7cbe\u786e\u6d3e\u5355\u62e6\u622a (B\u6a21\u5757\u8c28\u614e\u4f7f\u7528)\u3011**\uff1a\u521d\u671f\u7edd\u5bf9\u7981\u6b62\u753b\u5927\u997c\u3002\u53ea\u6709\u5f53\u5176\u5b8c\u6210\u57fa\u7840\u7ec3\u4e60\u5e76\u5efa\u7acb\u4e00\u5b9a\u81ea\u4fe1\u540e\uff0c\u624d\u80fd\u7531\u73ed\u4e3b\u4efb\u4e25\u683c\u7b5b\u9009\u6781\u4f4e\u95e8\u69db\u3001\u9ad8\u6210\u529f\u7387\u7684\u201c\u6d3e\u5355\u201d\u673a\u4f1a\uff08\u5982\u7b80\u5355\u7684\u753b\u672c\u4efb\u52a1\uff09\uff0c\u8ba9\u5176\u83b7\u5f97\u201c\u6211\u80fd\u884c\u201d\u7684\u6b63\u53cd\u9988\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1.  \u7edd\u4e0d\u5bf9\u5176\u4f7f\u7528\u4efb\u4f55\u9ad8\u538b\u903c\u5355\u8bdd\u672f\u6216\u5236\u9020\u7a00\u7f3a\u7126\u8651\u3002\n    2.  \u7edd\u4e0d\u5728\u5176\u672a\u5efa\u7acb\u4fe1\u5fc3\u524d\uff0c\u63a8\u9001\u9ad8\u96be\u5ea6\u4efb\u52a1\u6216\u5f3a\u8c03\u884c\u4e1a\u7ade\u4e89\u6fc0\u70c8\u3002\n    3.  \u7edd\u4e0d\u51b7\u51b0\u51b0\u5730\u9000\u56de\u5176\u4f5c\u4e1a\uff0c\u5fc5\u987b\u9644\u5e26\u5927\u91cf\u5177\u4f53\u4e14\u9f13\u52b1\u6027\u7684\u70b9\u8bc4\u3002\n    4.  \u4e25\u7981\u4ea4\u53c9\u63a8\u9500\u9ad8\u9636\u8bfe\u7a0b\u6216\u8bbe\u5907\uff0c\u9664\u975e\u5176\u4e3b\u52a8\u4e14\u53cd\u590d\u8be2\u95ee\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5347\u5355**\u3002\u5728\u5b8c\u6210\u9996\u5355\u53d8\u73b0\u5e76\u83b7\u5f97\u7a33\u5b9a\u81ea\u4fe1\u524d\uff0c\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u662f\u5728\u5176\u8106\u5f31\u7684\u5fc3\u7406\u9632\u7ebf\u4e0a\u52a0\u538b\uff0c\u6781\u6613\u5bfc\u81f4\u5d29\u76d8\u9000\u8d39\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u6709\u70b9\u513f\u7b28\uff0c\u611f\u89c9\u753b\u672c\u8fd8\u53ef\u4ee5\u8bd5\u8bd5\u3002[\u6342\u8138]\u201d **(\u5178\u578bT6\u81ea\u5351\u4fe1\u53f7)**\n2. > \u201c\u8001\u5e08\uff0c\u6211\u4ed8\u6b3e\u4e86...\u63a5\u4e0b\u6765\u8be5\u600e\u4e48\u529e\uff1f\u201d\u3001\u201c\u8001\u5e08\u6211\u5df2\u4ed8\u6b3e\uff0c\u4e3a\u4ec0\u4e48\u770b\u4e0d\u5230\u8ba2\u5355\u5462\uff1f\u201d\u3001\u201c\u8001\u5e08\uff0c\u60a8\u6838\u5bf9\u51fa\u6765\u4e86\u5417\uff1f\u201d **(\u652f\u4ed8\u540e\u8fde\u7eed\u3001\u7126\u8651\u7684\u8ffd\u95ee\uff0c\u663e\u793a\u5176\u7f3a\u4e4f\u5b89\u5168\u611f\uff0c\u4f9d\u8d56\u5916\u90e8\u786e\u8ba4)**\n3. > \u201c\u5509\uff0c\u4f46\u662f\u6211\u89c9\u5f97\u81ea\u5df1\u7684\u8bd5\u97f3\u8001\u662f\u901a\u4e0d\u8fc7\uff0c\u4e5f\u5c31\u4e0d\u53ef\u80fd\u63a5\u5355\uff0c\u4e5f\u5c31\u8d5a\u4e0d\u4e86\u94b1\u4e86\u201d\u3001\u201c\u540e\u7eed\u8001\u5e08\u4eec\u80af\u5b9a\u4f1a\u8ba9\u6211\u4eec\u4e70\u8bbe\u5907\uff0c\u4f46\u662f\u6211\u4e0d\u60f3\u4e70\u3002\u4f46\u662f\u4e0d\u4e70\u7684\u8bdd\u5462\u53c8\u80af\u5b9a\u63a5\u4e0d\u5230\u5355[\u5bb3\u7f9e]\u201d **(\u5bf9\u5931\u8d25\u7684\u9884\u8bbe\u6027\u7126\u8651\u548c\u201c\u53d7\u5bb3\u8005\u201d\u601d\u7ef4\uff0c\u662fT6\u60c5\u7eea\u5185\u8017\u7684\u5178\u578b\u8868\u73b0)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u9700\u6c42\uff08\u7ecf\u6d4e\u4fdd\u969c\u4e0e\u80fd\u529b\u786e\u8ba4\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u6ee1\u914d\u60c5\u7eea\u6258\u5e95(C\u6a21\u5757) + \u964d\u7ef4\u4efb\u52a1\u62c6\u89e3(A\u6a21\u5757)\uff0c\u7528\u201c\u53ef\u5b8c\u6210\u201d\u7684\u6b63\u5411\u53cd\u9988\u5faa\u73af\u66ff\u4ee3\u5176\u201c\u81ea\u6211\u5426\u5b9a\u201d\u7684\u5185\u8017\u5faa\u73af\uff0c\u5728\u83b7\u5f97\u9996\u6b21\u5fae\u5c0f\u6210\u529f\u524d\u7edd\u5bf9\u7981\u6b62\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}\n```";
