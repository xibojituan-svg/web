    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4ee5\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\u7684\u8eab\u4efd\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u63d0\u4f9b\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a676502078 (\u6635\u79f0\uff1a\u5e78\u5e78) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-02-25 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u78a7\u7476\u516e(\u6768\u78a7\u7476)\u3001\u7389\u7389\u4e09\u6dfc(\u66fe\u73b0\u4e3d) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66/AI\u914d\u97f3\u76f8\u5173\u8bfe\u7a0b\uff08\u5177\u4f53\u8bfe\u7a0b\u540d\u79f0\u53ca\u4ef7\u683c\u672a\u77e5\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u5206\u671f\u6216\u501f\u8d37\u4fe1\u606f\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u660e\u786e\u63d0\u53ca\u5de5\u4f5c\u6027\u8d28\u6216\u65f6\u95f4\u5b89\u6392\uff0c\u4f46\u4ece\u5176\u9891\u7e41\u3001\u53ca\u65f6\u7684\u7fa4\u5185\u4e92\u52a8\u548c\u4e3b\u52a8\u627f\u62c5\u5267\u7ec4\u7edf\u7b79\u5de5\u4f5c\u6765\u770b\uff0c**\u65f6\u95f4\u76f8\u5bf9\u5145\u88d5**\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u8bb0\u5f55\u4e86\u8bfe\u7a0b\u4e2d\u540e\u671f\u7684\u5b66\u4e60\u3001\u4f5c\u4e1a\u3001\u5267\u7ec4\u534f\u4f5c\u884c\u4e3a\uff0c\u4f46\u7f3a\u4e4f\u62a5\u540d\u52a8\u673a\u3001\u4e2a\u4eba\u80cc\u666f\u3001\u7ecf\u6d4e\u72b6\u51b5\u7b49\u5173\u952e\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u2b06\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u4e3a\u80fd\u529b\u4e0e\u53c2\u4e0e\u611f\u800c\u6765**\u3002\u7528\u6237\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u5b66\u4e60\u9a71\u52a8\u548c\u793e\u533a\u5efa\u8bbe\u610f\u613f\uff0c\u800c\u975e\u77ed\u671f\u53d8\u73b0\u7126\u8651\u3002\u4e3b\u52a8\u94bb\u7814\u6280\u672f\u7ec6\u8282\uff08\u63d2\u4ef6\u3001\u6587\u4ef6\u683c\u5f0f\uff09\uff0c\u79ef\u6781\u53c2\u4e0e\u5e76\u4e3b\u5bfc\u5267\u7ec4\u7edf\u7b79\u5de5\u4f5c\uff0c\u4eab\u53d7\u201c\u5efa\u8bbe\u8005\u201d\u89d2\u8272\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u662f\u5148\u5bfc\u51fa\u591a\u8f68\u6587\u4ef6\u683c\u5f0f\u6539\u6210MP3 \u5728\u4fdd\u5b58\u5de5\u7a0b\u6587\u4ef6 \u7136\u540e\u6240\u6709\u7684\u5728\u4e00\u8d77\u538b\u7f29\u201d\uff08\u4e3b\u52a8\u68b3\u7406\u5e76\u786e\u8ba4\u6280\u672f\u6d41\u7a0b\uff09\n  > \u201c\u6211\u4ee5\u540e\u8fd8\u80fd\u6765\u9a9a\u6270\u73ed\u73ed\u5417[\u82e6\u6da9][\u82e6\u6da9]\u201d\uff08\u7ed3\u8425\u540e\u4ecd\u5e0c\u671b\u4fdd\u6301\u8054\u7cfb\uff0c\u4f53\u73b0\u60c5\u611f\u4e0e\u6280\u80fd\u53cc\u91cd\u6295\u5165\uff09\n  > \u201c\u90a3\u6211\u8981\u8ddf\u7483\u97f3\u53bb\u50ac\u4eba\u4e86\u201d\u3001\u201c\u65c1\u767d\u6ca1\u6709\u5f55\u5f00\u5934\u96c6\u6570\u8865\u4e00\u4e0b\u201d\uff08\u4e3b\u52a8\u627f\u62c5\u5267\u7ec4\u7ba1\u7406\u804c\u8d23\uff0c\u5177\u5907\u9886\u5bfc\u529b\uff09\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u8bbe\u5907\u8d2d\u4e70\u3001\u8bfe\u7a0b\u8d39\u7528\u538b\u529b\u3002\u4f46\u7528\u6237\u63d0\u5230\u201c**\u56e0\u4e3a\u6211\u6ca1\u4e70\u8bbe\u5907**\u201d\uff0c\u8868\u660e\u8bbe\u5907\u6761\u4ef6\u53ef\u80fd\u4e3a\u77ed\u677f\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u2b06\u9ad8**\u3002\u7528\u6237\u80fd\u9891\u7e41\u3001\u53ca\u65f6\u5730\u5728\u7fa4\u5185\u4e92\u52a8\u3001\u89e3\u7b54\u95ee\u9898\u3001\u50ac\u4fc3\u8fdb\u5ea6\uff0c\u751a\u81f3\u5728\u975e\u5de5\u4f5c\u65f6\u95f4\uff08\u59824\u670811\u65e5\u665a\uff09\u4ecd\u5728\u5904\u7406\u5267\u7ec4\u4e8b\u52a1\uff0c\u8868\u660e\u6709\u5145\u8db3\u4e14\u7075\u6d3b\u7684\u65f6\u95f4\u6295\u5165\u5b66\u4e60\u4e0e\u793e\u7fa4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3**\u3002\u9762\u5bf9\u6280\u672f\u95ee\u9898\uff08\u5982\u63d2\u4ef6\u3001\u6587\u4ef6\u683c\u5f0f\u3001\u4e0b\u8f7d\u95ee\u9898\uff09\u65f6\uff0c\u80fd\u6e05\u6670\u63cf\u8ff0\u95ee\u9898\u3001\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u5e76\u5728\u5f97\u5230\u89e3\u7b54\u540e\u7acb\u5373\u6267\u884c\u3002\u5728\u5267\u7ec4\u7edf\u7b79\u4e2d\u9047\u5230\u6210\u5458\u5931\u8bef\uff08\u5982\u672a\u5f55\u5f00\u5934\u3001\u6253\u6807\u9519\u8bef\uff09\u65f6\uff0c\u80fd\u51b7\u9759\u6307\u51fa\u95ee\u9898\u3001\u63d0\u4f9b\u89e3\u51b3\u65b9\u6848\uff08\u201c\u8865\u8fd9\u4e00\u53e5\u5c31\u53ef\u4ee5\u4e86\u201d\uff09\uff0c\u5e76\u4e3b\u52a8\u627f\u62c5\u8865\u6551\u5de5\u4f5c\uff08\u201c\u6211\u5df2\u7ecf\u6539\u5b8c\u4e86\u4e0d\u7528\u8fd4\u4e86\u201d\uff09\uff0c\u8868\u73b0\u51fa\u6781\u5f3a\u7684\u89e3\u51b3\u95ee\u9898\u80fd\u529b\u548c\u6297\u538b\u6027\uff0c**\u5b8c\u5168\u4e0d\u9700\u8981\u60c5\u7eea\u5b89\u629a**\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u73ed\u73ed\u6211\u7684\u6f9c\u97f3\u6536\u7eb3\u9700\u8981\u9a8c\u8bc1\u7801\u201d\uff08\u9047\u5230\u95ee\u9898\uff0c\u76f4\u63a5\u3001\u6e05\u6670\u5730\u6c42\u52a9\uff09\n  > \u201c\u8fd9\u91cc\u53ef\u4ee5\u76f4\u63a5\u767b\u5f55 \u4e0d\u662f\u975e\u8981\u4e0b\u8f7d\u624d\u80fd\u7528\u201d\uff08\u4e3b\u52a8\u5206\u4eab\u89e3\u51b3\u65b9\u6848\uff0c\u5e2e\u52a9\u4ed6\u4eba\uff09\n  > \u201c\u5982\u679c\u65f6\u95f4\u4e0a\u6709\u6765\u4e0d\u53ca\u7684\u8bdd\u5c3d\u65e9\u8bf4\u54e6\u201d\uff08\u5728\u7edf\u7b79\u5de5\u4f5c\u4e2d\uff0c\u63d0\u524d\u9884\u8b66\uff0c\u7ba1\u7406\u98ce\u9669\uff0c\u800c\u975e\u60c5\u7eea\u5316\u62b1\u6028\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 & \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u4e13\u4e1a\u80fd\u529b\u7684\u8ba4\u53ef\u4e0e\u5728\u793e\u7fa4\u4e2d\u83b7\u5f97\u6743\u5a01\u5730\u4f4d\u7684\u6e34\u671b**\u3002\u5979\u5e76\u975e\u4e3a\u751f\u5b58\u7126\u8651\u800c\u6765\uff0c\u800c\u662f\u8ffd\u6c42\u5728\u6280\u80fd\u4e0a\u83b7\u5f97\u7cbe\u8fdb\uff0c\u5e76\u5728\u5b66\u4e60\u793e\u7fa4\u4e2d\u901a\u8fc7\u5e2e\u52a9\u4ed6\u4eba\u3001\u7edf\u7b79\u9879\u76ee\u6765\u83b7\u5f97\u5c0a\u91cd\u548c\u5f71\u54cd\u529b\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u8d4b\u4e88\u5176\u201c\u7f16\u5916\u73ed\u4e3b\u4efb\u201d\u6216\u201c\u9879\u76ee\u8d1f\u8d23\u4eba\u201d\u7684\u6b63\u5f0f\u8eab\u4efd\u4e0e\u6743\u529b**\u3002\u7ed9\u4e88\u5979\u516c\u5f00\u7684\u8ba4\u53ef\u3001\u6388\u6743\uff0c\u8ba9\u5979\u5728\u5e2e\u52a9\u540c\u5b66\u3001\u7ba1\u7406\u5267\u7ec4\u7684\u8fc7\u7a0b\u4e2d\u83b7\u5f97\u6781\u5927\u7684\u6210\u5c31\u611f\u548c\u5f52\u5c5e\u611f\uff0c\u6ee1\u8db3\u5176\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\u7684\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\u2b50A \u7c7b** (\u9ad8\u4ef7\u503c\u9886\u8896\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T1-A \u5bfc\u6f14\u578b\u9886\u8896** (\u8fdb\u5316\u4e2d\u7684\u6df7\u5408\u4f533\u53f7\uff1a\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 **\u5b89\u5168\u672a\u89e6\u53d1**\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u3001\u96f6\u4e92\u52a8\u7b49\u5371\u9669\u4fe1\u53f7\u3002\n\n**\u3010\u5224\u5b9a\u6811\u63a8\u6f14\u8fc7\u7a0b\u3011**\uff1a\n1.  **\u524d\u7f6e\u9694\u7206\u7b5b**\uff1a\u52a8\u673a\u7eaf\u5ea6\u975e0\uff0c\u8d44\u6e90\u5e95\u5ea7\u975e\u8d1f\u503c\uff0c\u65e0T8-D\u6216T0\u4fe1\u53f7\u3002**\u901a\u8fc7**\u3002\n2.  **\u4ea4\u6613\u4fe1\u53f7\u786c\u62e6\u622a\u5c42**\uff1a\u65e0\u652f\u4ed8\u6570\u636e\uff0c\u65e0\u6cd5\u5224\u65ad\u3002**\u8df3\u8fc7**\u3002\n3.  **\u52a8\u673a\u7eaf\u5ea6 \u2265 5\u5206**\uff0c\u8fdb\u5165**\u4e2d\u9ad8\u52a8\u673a\u7cbe\u5206**\u901a\u9053\u3002\n4.  **\u5fc3\u7406\u5f39\u6027 \u2265 7\u5206**\uff0c\u8fdb\u5165**\u9ad8\u5f39\u6027\u901a\u9053**\u3002\n5.  **\u7fa4\u5185\u51fa\u73b0\u4e3b\u52a8\u7edf\u7b79\u884c\u4e3a**\uff08\u6392\u671f\u3001\u50ac\u8fdb\u5ea6\u3001\u7ea0\u6b63\u9519\u8bef\u3001\u5206\u914d\u4efb\u52a1\uff09\uff0c\u4e14\u7edf\u7b79\u65b9\u5411\u4ee5\u201c\u5206\u955c/\u6392\u73ed/\u53d1\u6559\u6750\u6587\u4ef6/\u6539\u6d41\u7a0b\u5efa\u8bae\u201d\u4e3a\u4e3b\u3002**\u7b26\u5408 T1-A \u5bfc\u6f14\u578b\u9886\u8896 \u89e6\u53d1\u6761\u4ef6**\u3002\n6.  **\u540c\u65f6\u7b26\u5408\u6df7\u5408\u4f533\u53f7\uff08\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b\uff09\u8fdb\u5316\u7279\u5f81**\uff1a\u521d\u671f\uff08\u8bb0\u5f55\u65e9\u671f\uff09\u8868\u73b0\u4e3a\u8ba4\u771f\u5b8c\u6210\u4f5c\u4e1a\u3001\u63d0\u95ee\u6280\u672f\u7ec6\u8282\u7684T2\u8001\u9ec4\u725b\u7279\u8d28\uff1b\u540e\u671f\uff08\u5267\u7ec4\u9636\u6bb5\uff09**\u6280\u80fd\u7a81\u7834\u5173\u952e\u95e8\u69db\u540e\uff0c\u4f53\u5185\u7684\u201c\u638c\u63a7\u6b32\u201d\u5168\u9762\u82cf\u9192**\uff0c\u4e3b\u52a8\u627f\u62c5\u7edf\u7b79\u5de5\u4f5c\uff0c\u4f7f\u7528\u547d\u4ee4\u5f0f\u8bed\u6c14\u53d1\u8a00\u3002**\u5224\u5b9a\u4e3a\u6df7\u5408\u4f533\u53f7\u8fdb\u5316\u5b8c\u6210\u5f62\u6001**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4f4e** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u4ee5\u5176\u9ad8\u81ea\u4e3b\u6027\u548c\u9886\u5bfc\u529b\u5224\u65ad\uff0c\u5bb6\u5ead\u5e72\u9884\u53ef\u80fd\u6027\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u6781\u4f4e** | \u65f6\u95f4\u5145\u88d5\uff0c\u5b66\u4e60\u4e3b\u52a8\u6027\u5f3a\uff0c\u6280\u672f\u95ee\u9898\u80fd\u81ea\u884c\u6d88\u5316\u6216\u6c42\u52a9\u89e3\u51b3\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u6781\u9ad8\uff0c\u9047\u4e8b\u51b7\u9759\u89e3\u51b3\uff0c\u65e0\u60c5\u7eea\u5d29\u6e83\u8ff9\u8c61\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4f4e** | \u5176\u6838\u5fc3\u9a71\u52a8\u662f\u80fd\u529b\u6210\u957f\u548c\u793e\u7fa4\u53c2\u4e0e\u611f\uff0c\u800c\u975e\u77ed\u671f\u53d8\u73b0\uff0c\u5bf9\u201c\u63a5\u5355\u8d5a\u94b1\u201d\u7684\u6025\u8feb\u6027\u4f4e\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u51e0\u4e4e\u65e0\u98ce\u9669**\u3002\u552f\u4e00\u53ef\u80fd\u7684\u201c\u5d29\u76d8\u70b9\u201d\u5728\u4e8e**\u73ed\u4e3b\u4efb\u672a\u80fd\u8bc6\u522b\u5e76\u6ee1\u8db3\u5176\u5c0a\u91cd\u4e0e\u6743\u529b\u9700\u6c42**\u3002\u5982\u679c\u6301\u7eed\u5c06\u5176\u5f53\u4f5c\u666e\u901a\u5b66\u5458\u5bf9\u5f85\uff0c\u5ffd\u89c6\u5176\u8d21\u732e\uff0c\u4e0d\u7ed9\u4e88\u76f8\u5e94\u8eab\u4efd\u8ba4\u53ef\uff0c\u53ef\u80fd\u5bfc\u81f4\u5176\u6210\u5c31\u611f\u53d7\u632b\uff0c\u70ed\u60c5\u6d88\u9000\uff0c\u8fdb\u800c\u6c89\u9ed8\u6216\u6d41\u5931\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5e78\u5e78\uff0c\u6211\u770b\u4f60\u4f5c\u4e1a\u4ea4\u5f97\u5f88\u8ba4\u771f\uff0c\u95ee\u9898\u4e5f\u95ee\u5f97\u5f88\u5230\u4f4d\u3002\u54b1\u4eec\u73ed\u540e\u671f\u4f1a\u6709\u5b9e\u6218\u5267\u7ec4\u9879\u76ee\uff0c\u7279\u522b\u9700\u8981\u50cf\u4f60\u8fd9\u6837\u7ec6\u5fc3\u53c8\u6709\u8d23\u4efb\u5fc3\u7684\u540c\u5b66\u6765\u5e2e\u5fd9\u7edf\u7b79\u3002\u5230\u65f6\u5019\u53ef\u80fd\u8981\u591a\u8f9b\u82e6\u4f60\uff0c\u5e26\u7740\u5927\u5bb6\u4e00\u8d77\u628a\u4f5c\u54c1\u6253\u78e8\u597d\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** + **\u3010\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\u3011**\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u6302\u8f7d\u3010D\u6a21\u5757\uff1a\u8eab\u4efd\u4e0e\u6743\u529b\u5149\u73af\u6c60\u3011**\u3002\u6b63\u5f0f\u4efb\u547d\u5176\u4e3a\u201c\u5267\u7ec4\u7edf\u7b79\u5b98\u201d\u3001\u201c\u5c0f\u7ec4\u957f\u201d\u6216\u201c\u73ed\u957f\u52a9\u7406\u201d\uff0c\u7ed9\u4e88\u5176\u5728\u7fa4\u5185\u53d1\u5e03\u901a\u77e5\u3001\u7edf\u8ba1\u8fdb\u5ea6\u3001\u7ec4\u7ec7\u6392\u7ec3\u7684\u5b98\u65b9\u6743\u9650\u3002\u540c\u65f6\u63d0\u4f9b**B\u6a21\u5757\uff08\u786c\u6838\u624b\u827a\u6c60\uff09**\u7684\u6df1\u5ea6\u6280\u672f\u7b54\u7591\u652f\u6301\uff0c\u6ee1\u8db3\u5176\u94bb\u7814\u9700\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5c06\u5176\u5f53\u4f5c\u666e\u901a\u5b66\u5458\u8fdb\u884c\u201c\u586b\u9e2d\u5f0f\u201d\u6559\u5b66\u6216\u673a\u68b0\u50ac\u4f5c\u4e1a\u3002\u7981\u6b62\u7528\u5c45\u9ad8\u4e34\u4e0b\u7684\u5e08\u957f\u53e3\u543b\u4e0e\u5176\u6c9f\u901a\u3002**\u7edd\u4e0d\u53ef\u65e0\u89c6\u6216\u5426\u5b9a\u5176\u4e3b\u52a8\u63d0\u51fa\u7684\u6d41\u7a0b\u6539\u8fdb\u5efa\u8bae\u6216\u7edf\u7b79\u5b89\u6392**\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u9488\u5bf9\u5176\u6280\u672f\u94bb\u7814\u548c\u9886\u5bfc\u529b\u7279\u8d28\uff0c\u53ef\u63a8\u8350\u9ad8\u9636\u7684\u5bfc\u6f14\u8bfe\u3001\u540e\u671f\u5236\u4f5c\u79c1\u6559\u8bfe\u3001\u9879\u76ee\u7ba1\u7406\u7c7b\u8bfe\u7a0b\u3002\u63a8\u4ecb\u8bdd\u672f\u5e94\u4fa7\u91cd\u4e8e\u201c\u8d4b\u80fd\u201d\uff08\u201c\u5b66\u4e86\u8fd9\u95e8\u8bfe\uff0c\u4f60\u80fd\u66f4\u597d\u5730\u5e26\u9886\u56e2\u961f\u3001\u505a\u51fa\u66f4\u4e13\u4e1a\u7684\u4f5c\u54c1\u201d\uff09\uff0c\u800c\u975e\u201c\u53d8\u73b0\u201d\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u90a3\u6211\u8981\u8ddf\u7483\u97f3\u53bb\u50ac\u4eba\u4e86**\u201d \u2014\u2014 **\u4e3b\u52a8\u627f\u62c5\u7ba1\u7406\u8d23\u4efb\uff0c\u662f\u9886\u5bfc\u884c\u4e3a\u7684\u76f4\u63a5\u4f53\u73b0\u3002**\n2. > \u201c**\u65c1\u767d\u6ca1\u6709\u5f55\u5f00\u5934\u96c6\u6570\u8865\u4e00\u4e0b**\u201d\u3001\u201c**\u4f6036\u96c6\u5f00\u5934\u662f\u5355\u58f0\u9053**\u201d\u3001\u201c**\u4f60\u7684\u6253\u6807\u65b9\u5f0f\u9519\u4e86**\u201d \u2014\u2014 **\u4ee5\u7ba1\u7406\u8005\u89c6\u89d2\u53d1\u73b0\u95ee\u9898\u3001\u6307\u51fa\u9519\u8bef\u3001\u63d0\u51fa\u660e\u786e\u8981\u6c42\uff0c\u5177\u5907\u76d1\u7763\u548c\u6307\u5bfc\u80fd\u529b\u3002**\n3. > \u201c**\u6211\u4ee5\u540e\u8fd8\u80fd\u6765\u9a9a\u6270\u73ed\u73ed\u5417[\u82e6\u6da9][\u82e6\u6da9]**\u201d \u2014\u2014 **\u5728\u5b8c\u6210\u8bfe\u7a0b\u540e\u4ecd\u5e0c\u671b\u4fdd\u6301\u6df1\u5ea6\u8fde\u63a5\uff0c\u8868\u660e\u5176\u6295\u5165\u7684\u4e0d\u4ec5\u662f\u5b66\u4e60\uff0c\u66f4\u662f\u5bf9\u793e\u7fa4\u548c\u5173\u7cfb\u7684\u60c5\u611f\u8ba4\u540c\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T1-A\u5bfc\u6f14\u578b\u9886\u8896\uff08\u6df7\u5408\u4f533\u53f7\uff1a\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b\uff09\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7acb\u5373\u6388\u4e88\u5176\u5b98\u65b9\u7ba1\u7406\u8eab\u4efd\u4e0e\u6743\u9650\uff08D\u6a21\u5757\uff09\uff0c\u5c06\u5176\u8f6c\u5316\u4e3a\u514d\u8d39\u7684\u201c\u7f16\u5916\u73ed\u4e3b\u4efb\u201d\u548c\u751f\u6001\u5efa\u8bbe\u8005\u3011**\u3002\n\n```json\n{\"core_type\": \"T1-A \u5bfc\u6f14\u578b\u9886\u8896 (\u6df7\u5408\u4f533\u53f7\uff1a\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b)\", \"risk_level\": \"\u6781\u4f4e\", \"refund_risk\": \"\u6781\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u5708\u5c42\u5408\u4f19\u4eba\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u5973\", \"city\": \"\u6c5f\u82cf\"}\n```";
