        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | 444618376 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5b89\u742a(\u738b\u5b89\u742a) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u9ad8\u9636\u73ed (2380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u5145\u88d5 (\u76f4\u63a5\u652f\u4ed82380\uff0c\u65e0\u5206\u671f/\u501f\u6b3e\u8ff9\u8c61) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u4e2d (\u788e\u7247\u5316\u62fc\u51d1\uff0c\u80fd\u5b8c\u6210\u4f5c\u4e1a\u548c\u76f4\u64ad\uff0c\u4f46\u9700\u5904\u7406\u5916\u90e8\u4e8b\u52a1) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u7f3a\u5931 (\u804a\u5929\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u60c5\u51b5) |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e2d\u7b49 (\u5b66\u4e60\u4e92\u52a8\u79ef\u6781\uff0c\u4f46\u5173\u952e\u5bb6\u5ead\u3001\u804c\u4e1a\u80cc\u666f\u4fe1\u606f\u7f3a\u5931) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u5173\u6ce8\u5177\u4f53\u6280\u80fd\u63d0\u5347\uff0c\u5bf9\u53d8\u73b0\u6709\u671f\u5f85\u4f46\u65e0\u6025\u8feb\u4fdd\u5e95\u8981\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5f55\u4e66\u7684\u8bdd\uff0c\u6211\u4e5f\u60f3\u52aa\u529b\u8bd5\u8bd5\uff0c\u4f46\u662f\u4fe1\u5fc3\u4e0d\u591f\u3002\u753b\u672c\u548c\u5ba1\u542c\u6211\u90fd\u53ef\u4ee5\uff0c\u5e73\u65f6\u6709\u4e8b\u6ca1\u4e8b\uff0c\u90fd\u559c\u6b22\u542c\u5c0f\u8bf4\uff0c\u8fd9\u4e24\u4e2a\u5de5\u4f5c\u90fd\u5f88\u9002\u5408\u6211...\u6211\u6ca1\u6709\u4efb\u4f55\u7ecf\u9a8c\u548c\u4eba\u8109\uff0c\u90fd\u542c\u5e08\u59d0\u7684\uff0c\u60a8\u89c9\u5f97\u54ea\u91cc\u9002\u5408\u6211\u90fd\u613f\u610f\u8bd5\u4e00\u8bd5[\u53ef\u601c]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d\u9ad8** \u2014 \u80fd\u76f4\u63a5\u652f\u4ed82380\u5143\u8bfe\u7a0b\uff0c\u65e0\u660e\u663e\u8d44\u91d1\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u5b8c\u6210\u6bcf\u65e5\u5b66\u4e60\u4efb\u52a1\u548c\u4f5c\u4e1a\uff0c\u4f46\u8868\u793a\u201c\u5728\u5916\u9762\u6709\u70b9\u5435\u201d\uff0c\u4e14\u66fe\u56e0\u611f\u5192\u5f71\u54cd\u72b6\u6001\uff0c\u65f6\u95f4\u7cbe\u529b\u975e\u5b8c\u5168\u81ea\u7531\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u4fe1\u606f\uff0c**\u6b64\u4e3a\u91cd\u5927\u98ce\u9669\u76f2\u533a**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56\uff0c\u81ea\u6211\u6548\u80fd\u611f\u6781\u4f4e\uff0c\u4e25\u91cd\u4f9d\u8d56\u5916\u90e8\u80af\u5b9a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08\uff0c\u6211\u5c31\u4e0d\u6295\u4e86\uff0c\u4e00\u70b9\u7ecf\u9a8c\u90fd\u6ca1\u6709\u201d\uff1b> \u201c\u8ddf\u7740\u5e08\u59d0\u8bfb\u5c31\u6709\u611f\u89c9\uff0c\u4f46\u662f\u91cd\u65b0\u62ff\u5230\u4e00\u7bc7\u6587\u7684\u8bdd\uff0c\u81ea\u5df1\u5c31\u4e0d\u77e5\u9053\u600e\u4e48\u5904\u7406\u4e86\u201d\uff1b> \u201c\u8c22\u8c22\u5e08\u59d0\u7684\u6307\u5bfc\uff0c\u6211\u4f1a\u52aa\u529b\u7684[\u53ef\u601c]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u5ea6\u7684\u4e0d\u81ea\u4fe1\u548c\u81ea\u6211\u6000\u7591**\u3002\u5979\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u6280\u80fd\uff08\u6709\u58f0\u6f14\u64ad\uff09\u6765\u8bc1\u660e\u81ea\u5df1\u7684\u4ef7\u503c\uff0c\u83b7\u5f97\u4ed6\u4eba\u7684\u8ba4\u53ef\u548c\u5c0a\u91cd\uff0c\u4ece\u800c\u5efa\u7acb\u81ea\u4fe1\u548c\u5f52\u5c5e\u611f\u3002\u8d5a\u94b1\u662f\u624b\u6bb5\uff0c\u800c\u975e\u6838\u5fc3\u76ee\u7684\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6301\u7eed\u3001\u5177\u4f53\u3001\u9ad8\u9891\u7684\u80af\u5b9a\u4e0e\u9f13\u52b1**\uff0c\u6784\u5efa\u4e00\u4e2a\u201c\u88ab\u770b\u89c1\u3001\u88ab\u8ba4\u53ef\u3001\u88ab\u9700\u8981\u201d\u7684\u5b89\u5168\u73af\u5883\uff0c\u5e2e\u52a9\u5979\u5efa\u7acb\u201c\u6211\u80fd\u884c\u201d\u7684\u81ea\u6211\u8ba4\u77e5\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfea **C1** \u7c7b (\u9ad8\u52a8\u673a\u4f46\u5fc3\u7406\u5f39\u6027\u6781\u4f4e\uff0c\u9700\u91cd\u70b9\u60c5\u7eea\u6258\u5e95) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u65e0\u501f\u8d37\u3001\u7edd\u5883\u8ff9\u8c61)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u4e0d\u9002\u7528\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | **\u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u98ce\u9669\u672a\u77e5**\u3002\u82e5\u5bb6\u4eba\u4e0d\u77e5\u60c5\u6216\u53cd\u5bf9\uff0c\u6781\u6613\u6210\u4e3a\u9000\u8d39\u5bfc\u706b\u7d22\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u56e0\u611f\u5192\u3001\u5916\u90e8\u4e8b\u52a1\u7b49\u4e2d\u65ad\u5b66\u4e60\u8282\u594f\uff0c\u4ea7\u751f\u81ea\u8d23\u548c\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u7126\u8651\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u7b2c\u4e00\u6b21\u72ec\u7acb\u8bd5\u97f3\u5931\u8d25\u3001\u6536\u5230\u8d1f\u9762\u53cd\u9988\u3001\u6216\u5bf9\u6bd4\u5176\u4ed6\u540c\u5b66\u8fdb\u6b65\u66f4\u5feb\u65f6\uff0c\u4f1a\u56e0\u201c\u6211\u592a\u7b28\u4e86\u201d\u7684\u81ea\u5351\u611f\u800c\u77ac\u95f4\u5d29\u6e83\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4f4e** | \u77ed\u671f\u5185\u5bf9\u53d8\u73b0\u671f\u5f85\u4e0d\u9ad8\uff0c\u66f4\u5173\u6ce8\u5b66\u4e60\u8fc7\u7a0b\u548c\u4e2a\u4eba\u6210\u957f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-3\u5468**\u3002\u5f53\u8bfe\u7a0b\u8fdb\u5165\u9700\u8981\u72ec\u7acb\u5b8c\u6210\u7a0d\u6709\u96be\u5ea6\u7684\u4f5c\u4e1a\u6216\u9996\u6b21\u8bd5\u97f3\u65f6\uff0c\u4e00\u65e6\u53d7\u632b\uff0c\u6781\u6613\u89e6\u53d1\u201c\u6211\u4e0d\u884c\u201d\u7684\u81ea\u6211\u5426\u5b9a\uff0c\u5bfc\u81f4\u9000\u8d39\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4eb2\u7231\u7684\uff0c\u6b22\u8fce\u4f60\uff01\u5b89\u742a\u5e08\u59d0\u7279\u522b\u8ddf\u6211\u63d0\u8fc7\u4f60\uff0c\u8bf4\u4f60\u7279\u522b\u8ba4\u771f\uff0c\u8bed\u611f\u5e95\u5b50\u4e5f\u5f88\u597d\u3002\u54b1\u4eec\u8fd9\u4e2a\u73ed\u5c31\u662f\u4e00\u8d77\u4ece\u96f6\u5f00\u59cb\u6210\u957f\u7684\u2018\u5b89\u5168\u5c4b\u2019\uff0c\u6ca1\u6709\u6bd4\u8f83\uff0c\u53ea\u6709\u8fdb\u6b65\u3002\u4f60\u7684\u6bcf\u4e00\u6b21\u5f55\u97f3\uff0c\u65e0\u8bba\u597d\u574f\uff0c\u90fd\u662f\u52c7\u6562\u7684\u5c1d\u8bd5\uff0c\u6211\u90fd\u4f1a\u8ba4\u771f\u542c\uff0c\u5e76\u544a\u8bc9\u4f60\u54ea\u91cc\u505a\u5f97\u7279\u522b\u68d2\u3002\u8bb0\u4f4f\uff0c\u5728\u8fd9\u91cc\uff0c\u4f60\u6c38\u8fdc\u4e0d\u662f\u4e00\u4e2a\u4eba\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5174\u8da3\u6e38\u4e50\u7ebf**\u3011\u3002\u9996\u8981\u76ee\u6807\u662f\u8ba9\u5979\u5728\u8f7b\u677e\u3001\u65e0\u538b\u529b\u7684\u6c1b\u56f4\u4e2d\u5efa\u7acb\u5174\u8da3\u548c\u81ea\u4fe1\uff0c\u800c\u975e\u5f3a\u63a8\u786c\u6838\u6280\u80fd\u6216\u5feb\u901f\u63a5\u5355\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u5f3a\u70c8\u8865\u5145\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u5305\u62ec\uff1a\u6bcf\u65e5\u201c\u5c0f\u6210\u5c31\u201d\u6253\u5361\u9f13\u52b1\u3001\u4e13\u5c5e\u201c\u5938\u5938\u201d\u70b9\u8bc4\u6a21\u677f\u3001\u7b80\u5316\u7248\u4f5c\u4e1a\u9009\u9879\uff08\u5982\u201c\u53ea\u9700\u5f55\u4e00\u53e5\u4f60\u6700\u6709\u611f\u89c9\u7684\u8bdd\u201d\uff09\u3001\u907f\u514d\u5728\u516c\u5f00\u7fa4\u8fdb\u884c\u6a2a\u5411\u6bd4\u8f83\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u5979\u4f7f\u7528\u6fc0\u5c06\u6cd5\u6216\u65bd\u52a0\u540c\u4f34\u538b\u529b**\uff08\u5982\u201c\u522b\u4eba\u90fd\u4ea4\u4e86\u4f60\u600e\u4e48\u8fd8\u6ca1\u4ea4\u201d\uff09\u3002\n    2. **\u7edd\u4e0d\u7ed9\u4e88\u6a21\u7cca\u6216\u8fc7\u4e8e\u4e25\u82db\u7684\u8d1f\u9762\u70b9\u8bc4**\u3002\u6240\u6709\u53cd\u9988\u5fc5\u987b\u5148\u80af\u5b9a\u518d\u4ee5\u201c\u53ef\u4ee5\u8bd5\u8bd5\u8fd9\u6837\u4f1a\u4e0d\u4f1a\u66f4\u597d\u201d\u7684\u65b9\u5f0f\u63d0\u51fa\u5efa\u8bae\u3002\n    3. **\u7edd\u4e0d\u5728\u521d\u671f\u50ac\u4fc3\u5979\u53c2\u4e0e\u9ad8\u96be\u5ea6\u7684\u8bd5\u97f3\u6216\u7ade\u4e89\u6027\u6d3b\u52a8**\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5347\u5355**\u3002\u5728\u5efa\u7acb\u7a33\u56fa\u81ea\u4fe1\u548c\u5b8c\u6210\u57fa\u7840\u8bfe\u7a0b\u524d\uff0c\u4efb\u4f55\u9644\u52a0\u9500\u552e\u884c\u4e3a\u90fd\u4f1a\u88ab\u89c6\u4e3a\u538b\u529b\u6e90\uff0c\u6781\u6613\u5bfc\u81f4\u5d29\u76d8\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u8001\u5e08\uff0c\u6211\u5c31\u4e0d\u6295\u4e86\uff0c\u4e00\u70b9\u7ecf\u9a8c\u90fd\u6ca1\u6709\u201d \u2014 **\u5178\u578b\u7684\u80fd\u529b\u5426\u5b9a\u4e0e\u9000\u7f29**\n2. > \u201c\u8ddf\u7740\u5e08\u59d0\u8bfb\u5c31\u6709\u611f\u89c9\uff0c\u4f46\u662f\u91cd\u65b0\u62ff\u5230\u4e00\u7bc7\u6587\u7684\u8bdd\uff0c\u81ea\u5df1\u5c31\u4e0d\u77e5\u9053\u600e\u4e48\u5904\u7406\u4e86\u201d \u2014 **\u6781\u5ea6\u4f9d\u8d56\u5916\u90e8\u5f15\u5bfc\uff0c\u7f3a\u4e4f\u81ea\u4e3b\u6027**\n3. > \u201c\u6211\u6ca1\u6709\u4efb\u4f55\u7ecf\u9a8c\u548c\u4eba\u8109\uff0c\u90fd\u542c\u5e08\u59d0\u7684\uff0c\u60a8\u89c9\u5f97\u54ea\u91cc\u9002\u5408\u6211\u90fd\u613f\u610f\u8bd5\u4e00\u8bd5[\u53ef\u601c]\u201d \u2014 **\u5c06\u51b3\u7b56\u6743\u5b8c\u5168\u5916\u5305\uff0c\u5bfb\u6c42\u6743\u5a01\u8ba4\u53ef\u4e0e\u5e87\u62a4**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6 \u60c5\u7eea\u5de8\u5a74\u578b**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u5c0a\u91cd\u4e0e\u8ba4\u53ef\uff0c\u5efa\u7acb\u81ea\u4fe1**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u6781\u81f4\u7684\u60c5\u611f\u652f\u6301\u4e0e\u5b89\u5168\u611f\uff0c\u7528\u201c\u7597\u6108\u966a\u4f34\u201d\u66ff\u4ee3\u201c\u6280\u80fd\u8003\u6838\u201d**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"maslow_need\": \"\u5c0a\u91cd\u5f52\u5c5e\", \"risk_level\": \"\u6781\u9ad8\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf+\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\"}\n```";
