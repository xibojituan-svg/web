    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u9ed8\u9ed8 (UID: 677161173) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u738b\u6708\u79c0 (\u9500\u552e/\u52a9\u6559) -> \u5b54\u4ee4\u5a77 (\u73ed\u4e3b\u4efb\u53ef\u4e50) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u6f14\u64ad\u9ad8\u9636\u8bfe\u7a0b (\u5df2\u62a5\u540d\u6210\u529f) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3** (\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u91d1\u989d\u3001\u8d44\u91d1\u6765\u6e90) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u9700\u517c\u987e\u5de5\u4f5c\u3001\u4e2d\u5348\u9700\u7ed9\u5b69\u5b50\u505a\u996d) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3** (\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u60c5\u51b5) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49** (\u4e92\u52a8\u79ef\u6781\uff0c\u4f46\u5173\u952e\u51b3\u7b56\u4fe1\u606f\u7f3a\u5931) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u5174\u8da3\u9a71\u52a8\u4e3a\u4e3b\uff0c\u517c\u6709\u53d8\u73b0\u671f\u5f85\uff0c\u672a\u8868\u73b0\u51fa\u6781\u901f\u53d8\u73b0\u6216\u5f3a\u5236\u4fdd\u5e95\u8981\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u559c\u6b22\u6bd4\u8f83\u6709\u78c1\u6027\u4e00\u4e9b\u7684\u5973\u4f4e\u97f3\uff0c\u6216\u662f\u5973\u4e2d\u97f3\uff0c\u5e73\u65f6\u4e0d\u600e\u4e48\u770b\u5f71\u89c6\u5267\uff0c\u559c\u6b22\u770b\u4eba\u751f\u9886\u609f\u4e00\u7c7b\u7684\u4e66\u7c4d\uff0c\u6709\u65f6\u4e5f\u4f1a\u5728\u5feb\u624b\u7684\u4e00\u4e9b\u89c6\u9891\u91cc\u6717\u8bf5\u4e9b\u5c0f\u6587\u7ae0\uff0c\u8bd7\u8bcd\u4e4b\u7c7b\u7684\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u4fe1\u606f\u4e0d\u8db3]** \u2014 \u672a\u63d0\u53ca\u4efb\u4f55\u652f\u4ed8\u538b\u529b\u6216\u8d44\u91d1\u72b6\u51b5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**[\u4e2d]** \u2014 \u6709\u5168\u804c\u5de5\u4f5c\uff0c\u4e2d\u5348\u9700\u7167\u987e\u5bb6\u5ead\uff08\u201c\u6211\u8981\u7ed9\u5b69\u5b50\u505a\u996d\u201d\uff09\uff0c\u4f46\u80fd\u6324\u51fa\u65f6\u95f4\u53c2\u4e0e\u76f4\u64ad\u3001\u5b8c\u6210\u4f5c\u4e1a\uff0c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5c1a\u53ef\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u4fe1\u606f\u4e0d\u8db3]** \u2014 \u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\uff0c\u662f\u6f5c\u5728\u98ce\u9669\u70b9\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u4e0d\u4f1a\u8f6cMP3\u683c\u5f0f\uff09\u4e3b\u52a8\u6c42\u52a9\uff0c\u83b7\u5f97\u5e2e\u52a9\u540e\u793c\u8c8c\u611f\u8c22\u5e76\u7ee7\u7eed\u5c1d\u8bd5\u3002\u63a5\u53d7\u4e13\u4e1a\u70b9\u8bc4\u540e\uff0c\u6001\u5ea6\u79ef\u6781\uff0c\u613f\u610f\u6539\u8fdb\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08\uff0c\u6211\u5f55\u5b8c\u90a3\u4e2a\u65c1\u767d\uff0c\u53ef\u662f\u6211\u6211\u4e0d\u4f1a\u8f6cM P\u4e09\u683c\u5f0f\uff0c\u548b\u529e\u5440\uff1f\u201d\uff1b> \u201c\u597d\u7684\uff0c\u8c22\u8c22\u8001\u5e08\u7684\u70b9\u8bc4\uff0c\u6211\u518d\u91cd\u65b0\u8bd5\u8bd5[\u62b1\u62f3][\u62b1\u62f3]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5728\u5feb\u8282\u594f\u7684\u5de5\u4f5c\u548c\u5bb6\u5ead\u751f\u6d3b\u4e2d\uff0c\u5bfb\u6c42\u4e00\u4e2a\u80fd\u53d1\u6325\u4e2a\u4eba\u58f0\u97f3\u7279\u957f\u3001\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u3001\u5e76\u53ef\u80fd\u5b9e\u73b0\u81ea\u6211\u4ef7\u503c\uff08\u4ece\u6717\u8bf5\u7231\u597d\u5230\u4e13\u4e1a\u6f14\u64ad\uff09\u7684\u201c\u7cbe\u795e\u81ea\u7559\u5730\u201d\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u6210\u957f\u8def\u5f84\u7684\u6e05\u6670\u6307\u5f15**\u3002\u8ba9\u5979\u611f\u53d7\u5230\u81ea\u5df1\u7684\u58f0\u97f3\u7279\u8d28\u88ab\u770b\u89c1\u3001\u88ab\u6b23\u8d4f\uff0c\u5e76\u901a\u8fc7\u7cfb\u7edf\u5b66\u4e60\u83b7\u5f97\u5b9e\u5b9e\u5728\u5728\u7684\u8fdb\u6b65\u548c\u8eab\u4efd\u8ba4\u540c\uff08\u4ece\u7231\u597d\u8005\u5230\u201c\u4e3b\u64ad\u201d\uff09\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u52a8\u673a\u4e2d\u7b49\u3001\u8d44\u6e90\u4e2d\u7b49\u3001\u5f39\u6027\u9ad8\uff0c\u6709\u660e\u786e\u5174\u8da3\u548c\u884c\u52a8\u529b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u884c\u52a8\u529b\u5f3a\uff0c\u6309\u65f6\u5b8c\u6210\u6240\u6709\u4efb\u52a1\uff0c\u79ef\u6781\u4e92\u52a8\uff0c\u5173\u6ce8\u6280\u80fd\u63d0\u5347\u672c\u8eab\uff0c\u5bf9\u53d8\u73b0\u6e20\u9053\u4e5f\u8868\u73b0\u51fa\u5173\u6ce8\u4f46\u975e\u552f\u4e00\u76ee\u7684) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | **\u4fe1\u606f\u7f3a\u5931\uff0c\u9700\u91cd\u70b9\u6392\u67e5**\u3002\u82e5\u62a5\u540d\u8d39\u7528\u672a\u4e0e\u5bb6\u4eba\u6c9f\u901a\u6216\u5360\u7528\u5bb6\u5ead\u91cd\u8981\u5f00\u652f\uff0c\u53ef\u80fd\u5f15\u53d1\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u7528\u6237\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5c1a\u53ef\uff0c\u4e14\u4e3b\u52a8\u6027\u5f3a\uff0c\u4f46\u56e0\u9700\u517c\u987e\u5de5\u4f5c\u4e0e\u80b2\u513f\uff0c**\u5728\u8bfe\u7a0b\u540e\u671f\u4f5c\u4e1a\u91cf\u52a0\u5927\u6216\u76f4\u64ad\u65f6\u95f4\u51b2\u7a81\u65f6\uff0c\u53ef\u80fd\u51fa\u73b0\u65f6\u95f4\u6324\u5151\u538b\u529b**\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u4e50\u4e8e\u63a5\u53d7\u53cd\u9988\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u5bf9\u53d8\u73b0\u6e20\u9053\u6709\u5173\u6ce8\uff08\u8ba4\u771f\u542c\u76f8\u5173\u76f4\u64ad\uff09\uff0c\u82e5\u5b66\u4e60\u4e2d\u671f\uff08\u5982\u7b2c3-4\u5468\uff09\u53d1\u73b0\u63a5\u5355\u95e8\u69db\u9ad8\u6216\u6536\u76ca\u4e0e\u9884\u671f\u4e0d\u7b26\uff0c\u53ef\u80fd\u4ea7\u751f\u5931\u671b\u60c5\u7eea\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c3-4\u5468\uff08\u6b7b\u4ea1\u8c37\u9636\u6bb5\uff09**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u4f5c\u4e1a\u96be\u5ea6\u548c\u91cf\u7ea7\u4e0a\u5347\uff0c\u82e5\u540c\u65f6\u9762\u4e34\u5bb6\u5ead\u65f6\u95f4\u51b2\u7a81\u6216\u672a\u83b7\u5f97\u9884\u671f\u4e2d\u7684\u8bd5\u97f3\u673a\u4f1a\uff0c\u632b\u8d25\u611f\u548c\u7126\u8651\u611f\u53ef\u80fd\u53e0\u52a0\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u9ed8\u9ed8\u4f60\u597d\uff0c\u6211\u662f\u73ed\u73ed\u53ef\u4e50\u3002\u770b\u4e86\u4f60\u7684\u58f0\u97f3\u9274\u5b9a\u548c\u4f5c\u4e1a\uff0c\u4f60\u7684\u5fa1\u59d0\u97f3\u8272\u5f88\u6709\u8d28\u611f\uff0c\u5bf9\u6587\u672c\u4e5f\u6709\u81ea\u5df1\u7684\u7406\u89e3\uff0c\u662f\u5757\u597d\u6599\u5b50\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u5c31\u662f\u5e2e\u4f60\u628a\u7231\u597d\u6253\u78e8\u6210\u4e13\u4e1a\u6280\u80fd\u7684\u3002\u6211\u77e5\u9053\u4f60\u5e73\u65f6\u8981\u5de5\u4f5c\u8fd8\u8981\u987e\u5bb6\uff0c\u65f6\u95f4\u5b9d\u8d35\uff0c\u54b1\u4eec\u4e0d\u641e\u865a\u7684\uff0c\u6211\u4f1a\u5e2e\u4f60\u89c4\u5212\u6700\u6709\u6548\u7387\u7684\u5b66\u4e60\u8def\u5f84\uff0c\u8ba9\u4f60\u6bcf\u82b1\u4e00\u5206\u949f\u90fd\u6709\u5b9e\u5b9e\u5728\u5728\u7684\u8fdb\u6b65\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** (\u5339\u914dT2\u5b9e\u5e72\u578b\u9700\u6c42\uff0c\u63d0\u4f9b\u624e\u5b9e\u7684\u6280\u80fd\u8bad\u7ec3\u548c\u660e\u786e\u7684\u8fdb\u9636\u8def\u5f84)\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u788e\u7247\u5316\u65f6\u95f4\uff0c\u8865\u5145 **\u3010\u9ad8\u6548\u5b66\u4e60\u89c4\u5212\u5305\u3011** (\u63d0\u4f9b\u6bcf\u5468\u5b66\u4e60\u91cd\u70b9\u65f6\u95f4\u8868\u5efa\u8bae)\uff1b\u9488\u5bf9\u5176\u5c0a\u91cd\u9700\u6c42\uff0c\u8865\u5145 **\u3010\u9636\u6bb5\u6027\u6210\u679c\u8ba4\u53ef\u5305\u3011** (\u5982\u4f18\u79c0\u4f5c\u4e1a\u5c55\u793a\u3001\u8fdb\u9636\u52cb\u7ae0)\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u8fc7\u5ea6\u753b\u997c\uff0c\u627f\u8bfa\u77ed\u671f\u5185\u8f7b\u677e\u8d5a\u5927\u94b1\u30022. \u5e03\u7f6e\u5927\u91cf\u65e0\u6cd5\u5728\u788e\u7247\u65f6\u95f4\u5b8c\u6210\u7684\u3001\u5197\u957f\u7684\u76f4\u64ad\u4f5c\u4e1a\u30023. \u5ffd\u89c6\u5176\u5bb6\u5ead\u89d2\u8272\uff0c\u5728\u6838\u5fc3\u5bb6\u5ead\u65f6\u95f4\uff08\u5982\u665a\u9910\u3001\u7761\u524d\uff09\u9891\u7e41\u6253\u6270\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u8fdb\u884c\u7406\u6027\u5347\u5355\u63a8\u4ecb**\u3002\u56e0\u5176\u5b66\u4e60\u52a8\u673a\u7eaf\u6b63\u4e14\u6709\u884c\u52a8\u529b\uff0c\u5728\u8bc1\u660e\u8bfe\u7a0b\u4ef7\u503c\u3001\u5c55\u793a\u660e\u786e\u8fdb\u9636\u8def\u5f84\u540e\uff0c\u53ef\u63a8\u8350\u9ad8\u9636\u6216\u4e13\u9879\u8bfe\u7a0b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u559c\u6b22\u6bd4\u8f83\u6709\u78c1\u6027\u4e00\u4e9b\u7684\u5973\u4f4e\u97f3\uff0c\u6216\u662f\u5973\u4e2d\u97f3\uff0c\u5e73\u65f6\u4e0d\u600e\u4e48\u770b\u5f71\u89c6\u5267\uff0c\u559c\u6b22\u770b\u4eba\u751f\u9886\u609f\u4e00\u7c7b\u7684\u4e66\u7c4d\uff0c\u6709\u65f6\u4e5f\u4f1a\u5728\u5feb\u624b\u7684\u4e00\u4e9b\u89c6\u9891\u91cc\u6717\u8bf5\u4e9b\u5c0f\u6587\u7ae0\uff0c\u8bd7\u8bcd\u4e4b\u7c7b\u7684\u201d **(\u5174\u8da3\u9a71\u52a8\u4e0e\u81ea\u6211\u8868\u8fbe\u6b32)**\n2. > \u201c\u6211\u8981\u7ed9\u5b69\u5b50\u505a\u996d\u201d **(\u5bb6\u5ead\u8d23\u4efb\u4e0e\u65f6\u95f4\u9650\u5236\u7684\u771f\u5b9e\u66b4\u9732)**\n3. > \u201c\u597d\u7684\uff0c\u8c22\u8c22\u8001\u5e08\u7684\u70b9\u8bc4\uff0c\u6211\u518d\u91cd\u65b0\u8bd5\u8bd5\u201d **(\u9ad8\u5fc3\u7406\u5f39\u6027\u4e0e\u5b9e\u5e72\u7cbe\u795e\u7684\u76f4\u63a5\u4f53\u73b0)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2\u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d\u7b49**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u6e05\u6670\u7684\u6280\u80fd\u6210\u957f\u5730\u56fe\u4e0e\u9ad8\u6548\u7684\u65f6\u95f4\u89c4\u5212\u652f\u6301\uff0c\u5e76\u8c28\u614e\u7ba1\u7406\u5176\u53d8\u73b0\u9884\u671f**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\"}\n```";
