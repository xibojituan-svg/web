    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n## \u4e00\u3001 \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49)**\n    *   **\u8868\u5c42\u52a8\u673a**\uff1a\u5b66\u4e60AI\u5199\u4f5c\u6280\u80fd\uff0c\u5b9e\u73b0\u526f\u4e1a\u53d8\u73b0\uff08\u201c\u53d8\u73b0\u80fd\u529b\u5f88\u5f3a\u7684\u6545\u4e8b\u201d\u3001\u201c\u6295\u7a3f\u201d\u3001\u201c\u63a5\u5355\u8d44\u6e90\u201d\uff09\u3002\n    *   **\u6df1\u5c42\u52a8\u673a**\uff1a\u5bf9\u8bfe\u7a0b\u5185\u5bb9\uff08\u201c\u5929\u9f99\u516b\u90e8\u7ed3\u6784\u6cd5\u201d\uff09\u548c\u8d60\u54c1\uff08\u201c\u8d60\u54c1\u8bfe\u8fd8\u633a\u8d35\u201d\u3001\u201c\u597d\u591a\u8d60\u54c1\u201d\uff09\u8868\u73b0\u51fa\u5174\u8da3\uff0c**\u5b58\u5728\u201c\u8585\u7f8a\u6bdb\u201d\u6216\u8ffd\u6c42\u8d44\u6e90\u5360\u6709\u7684\u53ef\u80fd**\u3002\u5bf9\u201c\u5b66\u591a\u4e45\u624d\u80fd\u72ec\u7acb\u5199\u51fa\u4e00\u7bc7\u8fc7\u7a3f\u6587\u201d\u7684\u63d0\u95ee\uff0c\u663e\u793a\u5bf9\u5b66\u4e60\u6295\u5165\u4ea7\u51fa\u6bd4\u7684\u73b0\u5b9e\u8003\u91cf\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4fe1\u606f\u4e0d\u8db3)**\n    *   **\u652f\u4ed8\u80fd\u529b**\uff1a\u4e3b\u52a8\u8be2\u95ee\u5b66\u8d39\uff08\u201c\u5b66\u8d39\u662f\u591a\u5c11\u5440\uff1f\u201d\uff09\uff0c\u5e76\u63d0\u53ca\u201c\u4e3b\u6253\u770b\u94b1\u5305\u201d\uff0c\u8868\u660e\u4ef7\u683c\u654f\u611f\u3002\u6700\u7ec8\u652f\u4ed84380\u5143\uff08\u5206\u671f\uff09\uff0c\u663e\u793a\u5177\u5907\u4e00\u5b9a\u652f\u4ed8\u80fd\u529b\uff0c\u4f46\u975e\u9ad8\u51c0\u503c\u3002\n    *   **\u65f6\u95f4/\u7cbe\u529b**\uff1a\u4fe1\u606f\u4e0d\u8db3\u3002\u4ec5\u6709\u4e00\u6b21\u63d0\u53ca\u201c\u592a\u56f0\u4e86\uff0c\u6211\u5148\u7761\u89c9\u4e86\u201d\uff0c\u65e0\u6cd5\u5224\u65ad\u5176\u65f6\u95f4\u5145\u88d5\u5ea6\u4e0e\u5b66\u4e60\u7cbe\u529b\u3002\n    *   **\u5bb6\u5ead\u51b3\u7b56\u6743**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u6216\u4ed6\u4eba\u610f\u89c1\uff0c\u51b3\u7b56\u8fc7\u7a0b\u72ec\u7acb\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u7b49)**\n    *   **\u4e92\u52a8\u6027**\uff1a\u826f\u597d\u3002\u80fd\u53ca\u65f6\u56de\u590d\uff0c\u914d\u5408\u5b8c\u6210\u4f5c\u4e1a\u3001\u9886\u53d6\u798f\u5229\u7b49\u52a8\u4f5c\uff0c\u4f7f\u7528\u8868\u60c5\u5305\uff0c\u4e92\u52a8\u6c1b\u56f4\u8f7b\u677e\u3002\n    *   **\u6297\u538b\u4e0e\u575a\u6301\u6027**\uff1a\u5bf9\u4f5c\u4e1a\u53cd\u9988\uff08\u201c\u611f\u89c9\u4e0d\u662f\u5f88\u5438\u5f15\u6211\u201d\uff09\u80fd\u5766\u8bda\u8868\u8fbe\uff0c\u672a\u8868\u73b0\u51fa\u660e\u663e\u632b\u8d25\u6216\u653e\u5f03\u3002\u4f46\u5b66\u4e60\u97e7\u6027\u672a\u77e5\u3002\n    *   **\u51b3\u7b56\u6a21\u5f0f**\uff1a\u6613\u53d7\u5373\u65f6\u6fc0\u52b1\u5f71\u54cd\uff08\u201c\u542c\u7684\u6211\u597d\u5fc3\u52a8\u201d\u3001\u201c\u597d\u591a\u8d60\u54c1\u201d\uff09\uff0c\u51b3\u7b56\u8fc7\u7a0b\u76f8\u5bf9\u611f\u6027\uff0c**\u5b58\u5728\u51b2\u52a8\u6d88\u8d39\u7279\u5f81**\u3002\n\n## \u4e8c\u3001 ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a**\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u6700\u7ec8\u652f\u4ed84380\u5143\u62a5\u540d\u56db\u4e2a\u6708\u8bfe\u7a0b\uff08\u201c\u65d7\u8230\u73ed-AI\u77ed\u6545\u4e8b\u77ed\u5267\u5199\u4f5c\u8bfe\u201d\uff09\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u9ed8\u8ba4\u72ec\u7acb\u51b3\u7b56**\u3002\u5168\u7a0b\u4e3a\u4e2a\u4eba\u4e0e\u9500\u552e\u6c9f\u901a\uff0c\u65e0\u4ed6\u4eba\u4ecb\u5165\u8ff9\u8c61\u3002\n*   **\u6b65\u9aa41\uff1a\u52a8\u673a\u4e0e\u8d44\u6e90\u521d\u6b65\u5224\u65ad**\uff1a\u52a8\u673a\u660e\u786e\uff08\u5b66\u4e60+\u53d8\u73b0\uff09\uff0c\u652f\u4ed8\u80fd\u529b\u4e2d\u7b49\uff0c\u4e92\u52a8\u79ef\u6781\u3002**\u521d\u6b65\u503e\u5411B\u7c7b\uff08\u6f5c\u529b\u7528\u6237\uff09**\u3002\n*   **\u6b65\u9aa42\uff1a\u627f\u8bfa\u4e0e\u884c\u52a8\u4e00\u81f4\u6027**\uff1a\u7528\u6237\u5b8c\u6210\u4e86\u4f53\u9a8c\u8bfe\u4f5c\u4e1a\uff0c\u9886\u53d6\u798f\u5229\uff0c\u5e76\u6700\u7ec8\u5b8c\u6210\u4ed8\u8d39\u8f6c\u5316\uff0c\u884c\u52a8\u4e0e\u627f\u8bfa\u4e00\u81f4\u3002\n*   **\u6b65\u9aa43\uff1a\u98ce\u9669\u4e0e\u4ef7\u503c\u7efc\u5408\u8bc4\u4f30**\uff1a**\u98ce\u9669\u70b9**\u5728\u4e8e\u52a8\u673a\u4e2d\u201c\u8d44\u6e90\u5360\u6709\u201d\u503e\u5411\u660e\u663e\uff0c\u5bf9\u8d60\u54c1\u4ef7\u503c\u654f\u611f\uff08\u201c\u8d60\u54c1\u8bfe\u8fd8\u633a\u8d35\u201d\uff09\uff0c\u53ef\u80fd\u5f71\u54cd\u5bf9\u6838\u5fc3\u8bfe\u7a0b\u4ef7\u503c\u7684\u957f\u671f\u8ba4\u540c\u3002**\u4ef7\u503c\u70b9**\u5728\u4e8e\u7528\u6237\u6709\u660e\u786e\u5b66\u4e60\u76ee\u6807\uff0c\u4e14\u5df2\u4ed8\u8d39\u3002\n*   **\u6b65\u9aa44\uff1a\u6700\u7ec8\u5206\u5c42\u5224\u5b9a**\uff1a**B\u7c7b\u7528\u6237\uff08\u6f5c\u529b\u4ed8\u8d39\u7528\u6237\uff09**\u3002\u5df2\u5b8c\u6210\u8f6c\u5316\uff0c\u4f46\u5b58\u5728\u56e0\u5bf9\u6838\u5fc3\u4ef7\u503c\u8ba4\u77e5\u4e0d\u8db3\u6216\u671f\u5f85\u9519\u914d\u800c\u5f15\u53d1\u7684\u6f5c\u5728\u98ce\u9669\u3002\n\n## \u4e09\u3001 \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b\uff1aT4 \u7cbe\u660e\u52a1\u5b9e\u578b**\n    *   **\u7279\u5f81**\uff1a\u5173\u6ce8\u6295\u5165\u4ea7\u51fa\u6bd4\uff08\u201c\u5b66\u591a\u4e45\u624d\u80fd\u8fc7\u7a3f\u201d\uff09\u3001\u4ef7\u683c\u654f\u611f\uff08\u95ee\u5b66\u8d39\u3001\u770b\u94b1\u5305\uff09\u3001\u5bf9\u8d60\u54c1\u548c\u989d\u5916\u798f\u5229\u8868\u73b0\u51fa\u9ad8\u5ea6\u5174\u8da3\uff08\u201c\u597d\u591a\u8d60\u54c1\u201d\uff09\u3002\u51b3\u7b56\u53d7\u201c\u5360\u4fbf\u5b9c\u201d\u5fc3\u7406\u548c\u5373\u65f6\u6536\u76ca\u5ba3\u4f20\u5f71\u54cd\u8f83\u5927\u3002\n    *   **\u504f\u79bb\u70b9**\uff1a\u4e92\u52a8\u4e2d\u5e26\u6709T2\uff08\u597d\u5947\u5c1d\u9c9c\u578b\uff09\u7684\u8f7b\u677e\u611f\uff0c\u4f46\u6838\u5fc3\u51b3\u7b56\u903b\u8f91\u66f4\u8d34\u8fd1T4\u7684\u52a1\u5b9e\u8ba1\u7b97\u3002\n\n## \u56db\u3001 \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4e2d)\n1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u201c\u4e00\u4e2a\u6708\u540e\u8fc7\u7a3f\u201d\u6709\u660e\u786e\u671f\u5f85\uff0c\u82e5\u5b66\u4e60\u8fdb\u5c55\u6216\u6295\u7a3f\u7ed3\u679c\u4e0d\u53ca\u9884\u671f\uff0c\u6613\u5f15\u53d1\u4e0d\u6ee1\u3002\n2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u63d0\u53ca\u201c\u770b\u94b1\u5305\u201d\uff0c\u5e76\u4f7f\u7528\u5206\u671f\u652f\u4ed8\uff0c\u9700\u5173\u6ce8\u5176\u540e\u7eed\u6301\u7eed\u652f\u4ed8\u80fd\u529b\u4e0e\u8bfe\u7a0b\u4ef7\u503c\u7684\u5e73\u8861\u611f\u77e5\u3002\n3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\n4.  **\u5185\u5bb9/\u670d\u52a1\u4e0d\u7b26**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u201c\u8d60\u54c1\u201d\u6570\u91cf\u548c\u4ef7\u503c\u5173\u6ce8\u5ea6\u9ad8\uff0c**\u53ef\u80fd\u5c06\u8bfe\u7a0b\u4ef7\u503c\u4e0e\u8d60\u54c1\u4ef7\u503c\u6346\u7ed1**\u3002\u82e5\u540e\u7eed\u670d\u52a1\uff08\u5982\u966a\u8dd1\u3001\u6295\u7a3f\u8d44\u6e90\uff09\u4f53\u9a8c\u4e0d\u4f73\uff0c\u6216\u8d60\u54c1\u4ef7\u503c\u611f\u4e0b\u964d\uff0c\u6613\u4ea7\u751f\u201c\u4e0d\u503c\u201d\u611f\u3002\n5.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\n6.  **\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa**\uff1a**\u4e2d\u98ce\u9669**\u3002\u9500\u552e\u5f3a\u8c03\u4e86\u201c\u5185\u90e8\u6e20\u9053\u201d\u3001\u201c90%\u8fc7\u7a3f\u201d\u3001\u201c\u4e00\u4e2a\u6708\u540e\u201d\u7b49\uff0c\u53ef\u80fd\u62ac\u9ad8\u4e86\u7528\u6237\u9884\u671f\u3002**\u9700\u6838\u5bf9\u9500\u552e\u8bdd\u672f\u662f\u5426\u5b58\u5728\u7edd\u5bf9\u5316\u627f\u8bfa**\u3002\n7.  **\u5e73\u53f0/\u5e08\u8d44\u98ce\u9669**\uff1a**\u4f4e\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u5e08\u8d44\uff08\u201c\u8d3a\u7fd4\u3001\u674e\u987f\u201d\uff09\u672a\u8868\u8d28\u7591\u3002\n\n## \u4e94\u3001 \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5408\u89c4\u70b9**\uff1a\u9500\u552e\u8fc7\u7a0b\u6709\u4e92\u52a8\uff0c\u63d0\u4f9b\u4e86\u8bfe\u7a0b\u4ecb\u7ecd\u94fe\u63a5\uff0c\u63d0\u53ca\u4e86\u4e0d\u540c\u73ed\u578b\u4e0e\u4ef7\u683c\u3002\n*   **\u98ce\u9669\u70b9**\uff1a\n    1.  **\u8fc7\u5ea6\u627f\u8bfa**\uff1a\u9500\u552e\u63d0\u53ca\u201c90%\u4ee5\u4e0a\u7684\u5b66\u5458\u90fd\u80fd\u591f\u6295\u7a3f\u6210\u529f\u201d\u3001\u201c\u5185\u90e8\u63a8\u8350\u7801\u2026\u81ea\u5df1\u4eba\u201d\u7b49\uff0c**\u53ef\u80fd\u6784\u6210\u5bf9\u7ed3\u679c\u7684\u4e0d\u5f53\u4fdd\u8bc1\u548c\u6e20\u9053\u7279\u6b8a\u6027\u7684\u5938\u5927\u5ba3\u4f20**\u3002\n    2.  **\u5229\u7528\u8d60\u54c1\u4fc3\u9500**\uff1a\u5927\u91cf\u5f3a\u8c03\u8d60\u54c1\uff08\u201c\u4ef7\u503c4999\u7684\u957f\u7bc7\u7f51\u6587\u8bfe\u62bd\u5956\u201d\u3001\u201c\u597d\u591a\u8d60\u54c1\u201d\uff09\u53ef\u80fd**\u8f6c\u79fb\u7528\u6237\u5bf9\u4e3b\u8bfe\u7a0b\u4ef7\u503c\u7684\u6838\u5fc3\u5173\u6ce8**\uff0c\u8bf1\u5bfc\u51b2\u52a8\u6d88\u8d39\u3002\n    3.  **\u4ef7\u683c\u5bf9\u6bd4**\uff1a\u9500\u552e\u63d0\u53ca\u201c\u5b66\u8d39\u6bd4\u4f60\u6628\u5929\u8ddf\u6211\u8981\u7684\u90a3\u4e2a\u8d60\u54c1\u4fbf\u5b9c\u201d\uff0c**\u5b58\u5728\u4e0d\u5f53\u4ef7\u683c\u5bf9\u6bd4\u548c\u8d2c\u4f4e\u8d60\u54c1\u4ef7\u503c\u4ee5\u70d8\u6258\u4e3b\u8bfe\u4f18\u60e0\u7684\u8bdd\u672f\u5acc\u7591**\u3002\n\n## \u516d\u3001 \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6838\u5fc3\u7b56\u7565**\uff1a**\u5f3a\u5316\u4ef7\u503c\u8ba4\u540c\uff0c\u7ba1\u7406\u9884\u671f\uff0c\u63d0\u4f9b\u5373\u65f6\u6b63\u53cd\u9988**\u3002\u91cd\u70b9\u5728\u4e8e\u5c06\u5176\u5bf9\u201c\u8d60\u54c1/\u8d44\u6e90\u201d\u7684\u5173\u6ce8\uff0c\u5f15\u5bfc\u81f3\u5bf9\u201c\u6838\u5fc3\u6280\u80fd\u4e0e\u8fc7\u7a0b\u6210\u957f\u201d\u7684\u8ba4\u53ef\u3002\n*   **\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u7834\u51b0\u671f**\uff1a\u5feb\u901f\u8054\u7cfb\uff0c\u786e\u8ba4\u5206\u671f\u652f\u4ed8\u72b6\u6001\u3002\u6c9f\u901a\u4e2d**\u660e\u786e\u5b66\u4e60\u8def\u5f84\u4e0e\u91cc\u7a0b\u7891**\uff0c\u5f3a\u8c03\u201c\u4e00\u4e2a\u6708\u201d\u662f\u5f00\u59cb\u6295\u7a3f\u5c1d\u8bd5\u7684\u8d77\u70b9\uff0c\u800c\u975e\u4fdd\u8bc1\u6210\u529f\u7684\u8282\u70b9\u3002\n    2.  **\u5b66\u4e60\u671f**\uff1a\n        *   **\u9ad8\u9891\u8f7b\u91cf\u4e92\u52a8**\uff1a\u5bf9\u5176\u4f5c\u4e1a\u7ed9\u4e88\u5177\u4f53\u3001\u53ca\u65f6\u7684\u70b9\u8bc4\uff0c\u5c24\u5176\u5173\u6ce8\u5176\u201c\u611f\u89c9\u4e0d\u5438\u5f15\u4eba\u201d\u7684\u75db\u70b9\uff0c\u63d0\u4f9b\u53ef\u64cd\u4f5c\u7684\u4fee\u6539\u5efa\u8bae\u3002\n        *   **\u4ef7\u503c\u53ef\u89c6\u5316**\uff1a\u5b9a\u671f\u5206\u4eab\u4e0e\u5176\u5b66\u4e60\u9636\u6bb5\u5339\u914d\u7684\u3001\u771f\u5b9e\u7684\u5b66\u5458\u8fc7\u7a3f\u6848\u4f8b\uff08\u975e\u6781\u7aef\u6848\u4f8b\uff09\uff0c\u5c55\u793a\u8fdb\u6b65\u8fc7\u7a0b\u800c\u975e\u4ec5\u5c55\u793a\u7ed3\u679c\u3002\n        *   **\u8d44\u6e90\u6709\u5e8f\u4ea4\u4ed8**\uff1a\u5c06\u4e30\u5bcc\u7684\u8d60\u54c1\u8d44\u6e90\u4f5c\u4e3a\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u7684\u5956\u52b1\u6216\u8f85\u52a9\u5de5\u5177\u5206\u9636\u6bb5\u53d1\u653e\uff0c\u907f\u514d\u4e00\u6b21\u6027\u7ed9\u4e88\u9020\u6210\u4fe1\u606f\u8fc7\u8f7d\u6216\u4ef7\u503c\u7a00\u91ca\u3002\n    3.  **\u6295\u7a3f\u671f**\uff1a\u63d0\u524d\u6c9f\u901a\u5404\u5e73\u53f0\u8fc7\u7a3f\u6807\u51c6\u4e0e\u5468\u671f\uff0c\u5f15\u5bfc\u5176\u5c06\u9996\u6b21\u6295\u7a3f\u89c6\u4e3a\u5b66\u4e60\u5b9e\u8df5\uff0c\u964d\u4f4e\u7ed3\u679c\u9884\u671f\u3002\u79ef\u6781\u534f\u52a9\u5176\u5904\u7406\u6295\u7a3f\u53cd\u9988\uff0c\u65e0\u8bba\u8fc7\u5426\uff0c\u5747\u8fdb\u884c\u590d\u76d8\u6307\u5bfc\u3002\n    4.  **\u98ce\u9669\u76d1\u63a7**\uff1a\u5bc6\u5207\u5173\u6ce8\u5176\u5bf9\u4e8e\u201c\u8d60\u54c1\u4ef7\u503c\u201d\u3001\u201c\u6295\u7a3f\u901f\u5ea6\u201d\u7684\u8a00\u8bba\uff0c\u4e00\u65e6\u51fa\u73b0\u8d1f\u9762\u60c5\u7eea\uff0c\u7acb\u5373\u4ecb\u5165\uff0c\u91cd\u7533\u8bfe\u7a0b\u6838\u5fc3\u4ef7\u503c\u4e0e\u957f\u671f\u5b66\u4e60\u7406\u5ff5\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**\uff1a\u7528\u6237\u5df2\u62a5\u540d**\u65d7\u8230\u73ed\uff08\u77ed\u6545\u4e8b+\u77ed\u5267\uff09**\uff0c\u5339\u914d\u6b63\u786e\u3002\u73ed\u4e3b\u4efb\u9700\u91cd\u70b9\u5f15\u5bfc\u5176\u5229\u7528\u597d\u201c\u966a\u8dd1\u5b98\u6539\u7a3f\u201d\u548c\u201c\u76f4\u64ad\u70b9\u8bc4\u201d\u670d\u52a1\uff0c\u8fd9\u662f\u5151\u73b0\u9500\u552e\u627f\u8bfa\u3001\u63d0\u5347\u5176\u83b7\u5f97\u611f\u7684\u5173\u952e\u3002\n\n{\"core_type\": \"T4 \u7cbe\u660e\u52a1\u5b9e\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\uff08\u80fd\u529b\u63d0\u5347\uff09/\u81ea\u6211\u5b9e\u73b0\uff08\u53d8\u73b0\uff09\", \"target_product_line\": \"AI\u5199\u4f5c\u8bad\u7ec3\u8425\uff08\u65d7\u8230\u73ed\uff09\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}";
