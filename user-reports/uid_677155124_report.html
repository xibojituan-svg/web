        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4f5c\u4e3a\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677155124\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677155124 (YoYo.bert) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e-\u6797\u56093(\u8463\u71d5) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b (7380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u8d44\u91d1\u6765\u6e90\u6216\u5bb6\u5ead\u7ecf\u6d4e\u72b6\u51b5\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u672a\u63d0\u53ca\u804c\u4e1a\u3001\u4f5c\u606f\u6216\u65f6\u95f4\u5b89\u6392\u3002\u4ec5\u6709\u4e00\u6b21\u63d0\u53ca\u201c\u5f55\u4e00\u6761\uff0c\u627e\u611f\u89c9\u90fd\u627e\u55662\u4e2a\u5c0f\u65f6\u201d\uff0c\u8868\u660e\u6709\u8fde\u7eed2\u5c0f\u65f6\u4ee5\u4e0a\u7684\u4e13\u6ce8\u65f6\u95f4\uff0c\u4f46\u65e0\u6cd5\u5224\u65ad\u662f\u5e38\u6001\u8fd8\u662f\u7279\u4f8b\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u4fe1\u606f\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u7528\u6237\u884c\u4e3a\uff08\u5b66\u4e60\u3001\u4e92\u52a8\u3001\u652f\u4ed8\uff09\u4fe1\u606f\u5145\u8db3\uff0c\u4f46\u5173\u952e\u80cc\u666f\u4fe1\u606f\uff08\u65f6\u95f4\u3001\u8d44\u91d1\u3001\u5bb6\u5ead\uff09\u4e25\u91cd\u7f3a\u5931\uff0c\u9700\u540e\u7eed\u8865\u5145\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **[\u2b06\u9ad8]**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u4e13\u4e1a\u6210\u957f\u800c\u6765\u3002\u7528\u6237\u5173\u6ce8\u70b9\u59cb\u7ec8\u5728\u201c\u5f55\u4e66\u201d\u3001\u201c\u627e\u611f\u89c9\u201d\u3001\u201c\u4e13\u4e1a\u8f85\u5bfc\u201d\u4e0a\uff0c\u5bf9\u53d8\u73b0\u7684\u8ffd\u95ee\u4e3a0\u6b21\u3002\u8868\u73b0\u51fa\u5bf9\u6f14\u64ad\u6280\u672f\u672c\u8eab\u7684\u6d53\u539a\u5174\u8da3\u548c\u94bb\u7814\u7cbe\u795e\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n    > \u201c\u5bf9\u4e13\u4e1a\u7684\u8f85\u5bfc\u90fd\u611f\u5174\u8da3\u201d\n    > \u201c\u542c\u55662.9\u4e07\u5c0f\u65f6\u7684\u4e66\u5566[\u6342\u8138][\u6342\u8138]\uff0c\u770b\u6709\u6ca1\u6709\u611f\u89c9\u201d\n    > \u201c\u5f55\u4e00\u6761\uff0c\u627e\u611f\u89c9\u90fd\u627e\u55662\u4e2a\u5c0f\u65f6\uff0c\u4e0d\u5bb9\u6613\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **[\u27a1\u4e2d]**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u4e2d]** \u2014 \u8bc1\u636e\u4e0d\u8db3\u3002\u80fd\u652f\u4ed87380\u5143\u8bfe\u7a0b\uff0c\u4f46\u672a\u900f\u9732\u652f\u4ed8\u65b9\u5f0f\u6216\u8d44\u91d1\u6765\u6e90\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u8f7b\u677e\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**[\u4e2d]** \u2014 \u80fd\u5b8c\u6210\u6240\u6709\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\u3001\u5e76\u6295\u51652\u5c0f\u65f6\u6253\u78e8\u4e00\u6761\u5f55\u97f3\uff0c\u8868\u660e\u6709\u6301\u7eed\u7684\u5b66\u4e60\u65f6\u95f4\u3002\u4f46\u672a\u900f\u9732\u5177\u4f53\u804c\u4e1a\u6216\u65f6\u95f4\u81ea\u7531\u5ea6\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u4e2d]** \u2014 \u8bc1\u636e\u4e0d\u8db3\u3002\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u4fe1\u606f\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **[\u2b06\u9ad8]**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9762\u5bf9\u201c\u5f55\u97f3\u88ab\u5e72\u6270\u201d\u7b49\u5c0f\u632b\u6298\uff0c\u4ec5\u5ba2\u89c2\u9648\u8ff0\u201c\u88ab\u4eba\u5435\u5c31\u4e71\u8282\u594f\u201d\uff0c\u65e0\u62b1\u6028\u6216\u6c42\u52a9\u3002\u4e3b\u52a8\u6295\u5165\u5927\u91cf\u65f6\u95f4\u201c\u627e\u611f\u89c9\u201d\uff0c\u8868\u73b0\u51fa\u6781\u5f3a\u7684\u8010\u5fc3\u548c\u81ea\u9a71\u529b\u3002\u5bf9\u9500\u552e/\u8001\u5e08\u7684\u9f13\u52b1\u548c\u6307\u5bfc\uff0c\u5747\u4ee5\u201c\u8c22\u8c22\u201d\u56de\u5e94\uff0c\u60c5\u7eea\u7a33\u5b9a\u3001\u72ec\u7acb\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n    > \u201c\u5f55\u97f3\u8fd8\u662f\u8981\u6709\u5b89\u9759\u7684\u73af\u5883\uff0c\u521a\u521a\u627e\u5230\u70b9\u611f\u89c9\uff0c\u88ab\u4eba\u5435\u5c31\u4e71\u8282\u594f[\u6342\u8138][\u6342\u8138]\u201d\n    > \u201c\u5f55\u4e00\u6761\uff0c\u627e\u611f\u89c9\u90fd\u627e\u55662\u4e2a\u5c0f\u65f6\uff0c\u4e0d\u5bb9\u6613\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**[ \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u201c\u4e13\u4e1a\u611f\u201d\u548c\u201c\u611f\u89c9\u201d\u7684\u6781\u81f4\u8ffd\u6c42\u3002\u4ed6\u542c\u4e662.9\u4e07\u5c0f\u65f6\uff0c\u6295\u51652\u5c0f\u65f6\u53ea\u4e3a\u201c\u627e\u611f\u89c9\u201d\uff0c\u8868\u660e\u5176\u6838\u5fc3\u9a71\u52a8\u529b\u5e76\u975e\u91d1\u94b1\uff0c\u800c\u662f\u6e34\u671b\u5c06\u957f\u671f\u79ef\u7d2f\u7684\u201c\u542c\u611f\u201d\u8f6c\u5316\u4e3a\u81ea\u8eab\u201c\u6f14\u64ad\u80fd\u529b\u201d\u7684\u6210\u5c31\u611f\uff0c\u5b9e\u73b0\u4ece\u201c\u542c\u4f17\u201d\u5230\u201c\u521b\u4f5c\u8005\u201d\u7684\u8eab\u4efd\u8dc3\u8fc1\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u5c42\u9762\u7684\u6df1\u5ea6\u8ba4\u53ef\u4e0e\u5171\u9e23**\u3002\u4ed6\u9700\u8981\u88ab\u5f53\u4f5c\u4e00\u4e2a\u201c\u6709\u6f5c\u529b\u7684\u540c\u884c\u201d\u800c\u975e\u201c\u5c0f\u767d\u5b66\u5458\u201d\u6765\u5bf9\u5f85\u3002\u80af\u5b9a\u4ed6\u7684\u609f\u6027\u3001\u52aa\u529b\u548c\u5bf9\u4e13\u4e1a\u7684\u6267\u7740\uff0c\u63d0\u4f9b\u80fd\u8ba9\u4ed6\u201c\u611f\u89c9\u5bf9\u4e86\u201d\u7684\u7cbe\u51c6\u6280\u672f\u6307\u5bfc\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe2 B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T3 \u6b7b\u78d5\u6781\u5ba2\u6d3e** (\u9ad8\u590d\u8d2d\u6f5c\u529b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u3001\u5bb6\u5ead\u53cd\u5bf9\u7b49\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u52a8\u673a\u7eaf\u7cb9\u3001\u884c\u4e3a\u72ec\u7acb\uff0c\u5bb6\u5ead\u5e72\u9884\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u7528\u6237\u5b66\u4e60\u4e3b\u52a8\u6027\u5f3a\uff0c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u770b\u4f3c\u4e0d\u9519\uff0c\u56e0\u8ddf\u4e0d\u4e0a\u800c\u5d29\u76d8\u7684\u98ce\u9669\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u632b\u80fd\u81ea\u6211\u6d88\u5316\uff0c\u4e0d\u5c5e\u4e8e\u60c5\u7eea\u4f9d\u8d56\u578b\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u867d\u7136\u5f53\u524d\u52a8\u673a\u7eaf\u7cb9\uff0c\u4f46\u82e5\u957f\u671f\uff08\u59823-6\u4e2a\u6708\uff09\u65e0\u6cd5\u83b7\u5f97\u7b26\u5408\u5176\u4e13\u4e1a\u9884\u671f\u7684\u63a5\u5355\u673a\u4f1a\u6216\u80fd\u529b\u63d0\u5347\u53cd\u9988\uff0c\u53ef\u80fd\u56e0\u201c\u6295\u5165\u4ea7\u51fa\u6bd4\u201d\u5931\u8861\u800c\u4ea7\u751f\u5931\u671b\u60c5\u7eea\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe\u540e\u7684**\u7b2c3-6\u4e2a\u6708**\u3002\u5f53\u65b0\u9c9c\u611f\u548c\u81ea\u6211\u9a71\u52a8\u6d88\u8017\u6b86\u5c3d\uff0c\u82e5\u4ecd\u672a\u770b\u5230\u7b26\u5408\u5176\u201c\u4e13\u4e1a\u8ffd\u6c42\u201d\u7684\u5b9e\u8d28\u6027\u6210\u679c\uff08\u5982\u63a5\u5230\u6709\u6311\u6218\u6027\u7684\u89d2\u8272\u3001\u83b7\u5f97\u6df1\u5ea6\u6280\u672f\u7a81\u7834\uff09\uff0c\u5931\u671b\u60c5\u7eea\u53ef\u80fd\u7d2f\u79ef\u5e76\u5f15\u53d1\u9000\u8d39\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cYoYo\uff0c\u770b\u5230\u4f602.9\u4e07\u5c0f\u65f6\u7684\u542c\u4e66\u91cf\u548c\u5bf9\u2018\u611f\u89c9\u2019\u7684\u6267\u7740\uff0c\u5c31\u77e5\u9053\u4f60\u4e0d\u662f\u6765\u73a9\u7968\u7684\u3002\u54b1\u4eec\u8fd9\u4e2a\u73ed\u91cc\u6709\u4e0d\u5c11\u50cf\u4f60\u4e00\u6837\u5bf9\u4e13\u4e1a\u6709\u8ffd\u6c42\u7684\u2018\u58f0\u4f18\u6781\u5ba2\u2019\uff0c\u4ee5\u540e\u591a\u4ea4\u6d41\u3002\u4f60\u7684\u9752\u53d4\u97f3\u5e95\u5b50\u975e\u5e38\u597d\uff0c\u63a5\u4e0b\u6765\u6211\u4eec\u4e00\u8d77\u6b7b\u78d5\u7ec6\u8282\uff0c\u628a\u4f60\u7684\u2018\u542c\u611f\u2019\u53d8\u6210\u2018\u6f14\u64ad\u611f\u2019\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5fc5\u987b\u5339\u914d\u5176\u8ffd\u6c42\u4e13\u4e1a\u7cbe\u8fdb\u7684\u6838\u5fc3\u9700\u6c42\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T3\u5f3a\u70c8\u5efa\u8bae\u8865\u5145**\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011**\uff08B\u6a21\u5757\uff09\uff0c\u5e76\u9002\u65f6\u5f15\u5165**\u3010\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\u3011**\uff08D\u6a21\u5757\uff09\u7684\u6f5c\u529b\u3002\u907f\u514d\u7528\u8fc7\u4e8e\u5a31\u4e50\u5316\u6216\u60c5\u611f\u5316\u7684\u5185\u5bb9\u6253\u6270\u4ed6\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u51e0\u5929\u80fd\u8d5a\u94b1\u201d\u3001\u201c\u5b9d\u5988\u4e5f\u80fd\u8f7b\u677e\u5b66\u4f1a\u201d\u7b49\u4f4e\u9636\u8bdd\u672f\u4e0e\u5176\u6c9f\u901a\uff1b\u7528\u5927\u91cf\u65e0\u610f\u4e49\u7684\u793e\u4ea4\u95f2\u804a\u6216\u5938\u5f20\u7684\u201c\u5b9d\u5b9d\u597d\u68d2\u201d\u5f0f\u8d5e\u7f8e\u586b\u5145\u4e92\u52a8\uff1b\u5728\u5176\u94bb\u7814\u6280\u672f\u65f6\uff0c\u7528\u8fc7\u4e8e\u7b80\u5355\u6216\u6577\u884d\u7684\u7b54\u6848\u56de\u5e94\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5f53\u5176\u6280\u672f\u8fbe\u5230\u4e00\u5b9a\u6c34\u5e73\u540e\uff0c\u53ef\u4ee5\u63a8\u4ecb\u9ad8\u9636\u7684\u540e\u671f\u5236\u4f5c\u79c1\u6559\u8bfe\u3001\u4e13\u4e1a\u8bbe\u5907\u9009\u8d2d\u6307\u5bfc\u3001\u6216\u53c2\u4e0e\u66f4\u9ad8\u7ea7\u522b\u7684\u9879\u76ee\u5b9e\u6218\uff08\u5982\u53c2\u4e0e\u6709\u58f0\u5267\u5236\u4f5c\uff09\u3002\u56e0\u4e3a\u4ed6\u4e3a\u4e13\u4e1a\u4ed8\u8d39\u7684\u610f\u613f\u6781\u5f3a\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5bf9\u4e13\u4e1a\u7684\u8f85\u5bfc\u90fd\u611f\u5174\u8da3\u201d \u2014\u2014 **\u52a8\u673a\u7eaf\u7cb9\u6027\u7684\u76f4\u63a5\u8bc1\u660e\uff0c\u4e0d\u5c40\u9650\u4e8e\u53d8\u73b0\u3002**\n2. > \u201c\u542c\u55662.9\u4e07\u5c0f\u65f6\u7684\u4e66\u5566[\u6342\u8138][\u6342\u8138]\uff0c\u770b\u6709\u6ca1\u6709\u611f\u89c9\u201d \u2014\u2014 **\u5c55\u73b0\u6df1\u539a\u7684\u5174\u8da3\u79ef\u7d2f\u548c\u6781\u5ba2\u5f0f\u7684\u94bb\u7814\u7cbe\u795e\u3002**\n3. > \u201c\u5f55\u4e00\u6761\uff0c\u627e\u611f\u89c9\u90fd\u627e\u55662\u4e2a\u5c0f\u65f6\uff0c\u4e0d\u5bb9\u6613\u201d \u2014\u2014 **\u9ad8\u5fc3\u7406\u5f39\u6027\u548c\u5bf9\u4e13\u4e1a\u201c\u611f\u89c9\u201d\u6781\u81f4\u8ffd\u6c42\u7684\u4f53\u73b0\uff0c\u80fd\u5fcd\u53d7\u67af\u71e5\uff0c\u81ea\u6211\u9a71\u52a8\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T3 \u6b7b\u78d5\u6781\u5ba2\u6d3e\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u81ea\u6211\u5b9e\u73b0\u4e0e\u4e13\u4e1a\u7cbe\u8fdb\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u4f46\u5b58\u5728**\u4e2d\u671f\u6536\u76ca\u843d\u5dee\u98ce\u9669**\u3002\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u6301\u7eed\u63d0\u4f9b\u6709\u6df1\u5ea6\u7684\u6280\u672f\u6307\u5bfc\u548c\u7b26\u5408\u5176\u4e13\u4e1a\u9884\u671f\u7684\u5b9e\u6218\u673a\u4f1a\u3011**\u3002\n\n```json\n{\"core_type\": \"T3 \u6b7b\u78d5\u6781\u5ba2\u6d3e\", \"maslow_need\": \"\u81ea\u6211\u5b9e\u73b0\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u6781\u5ba2\u6df1\u7814\u5305\"}\n```";
