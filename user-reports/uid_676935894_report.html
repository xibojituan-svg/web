    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u5426\u6781 (UID: 676935894) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-01 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u76f8\u4f34\u73ed\u73ed(\u96f7\u743c\u743c) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u6f14\u64ad\u8bfe\u7a0b (\u5df2\u8d2d)\uff0c\u540e\u671f\u73ed (\u610f\u5411\u4e2d) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u4fe1\u606f\u4e0d\u8db3\u3002\u7528\u6237\u5df2\u8d2d\u8bfe\uff0c\u5e76\u4e3b\u52a8\u54a8\u8be2\u540e\u671f\u73ed\uff0c\u652f\u4ed8\u80fd\u529b\u63a8\u6d4b\u4e3a\u3010\u5168\u6b3e\u5145\u88d5\u3011\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u4fe1\u606f\u4e0d\u8db3\u3002\u804a\u5929\u8bb0\u5f55\u663e\u793a\u5176\u80fd\u6295\u5165\u5927\u91cf\u65f6\u95f4\u8fdb\u884c\u6587\u672c\u4fee\u6539\u3001\u5f55\u97f3\u3001\u540e\u671f\u5236\u4f5c\uff0c\u5e76\u7ec4\u7ec7\u817e\u8baf\u4f1a\u8bae\uff0c\u65f6\u95f4\u3010\u9ad8\u5bbd\u88d5\u3011\u53ef\u80fd\u6027\u5927\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u4e0d\u8db3\u3002\u4ec5\u63d0\u53ca\u201c\u6211\u5988\u89c9\u5f97\u6211\u4eba\u683c\u5206\u88c2\u4e86\u5929\u5929\u81ea\u8a00\u81ea\u8bed\uff0c\u5dee\u70b9\u7ed9\u6211\u9001\u5230\u533b\u9662\u53bb\u201d\uff0c\u8868\u660e\u5bb6\u4eba\u77e5\u6653\u5176\u7231\u597d\uff0c\u4f46\u672a\u63d0\u53ca\u5bf9\u62a5\u8bfe\u6001\u5ea6\uff0c\u6682\u5b9a\u4e3a\u3010\u5df2\u62a5\u5907\u5e76\u652f\u6301\u3011\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | \u9971\u6ee1 (\u5927\u91cf\u5173\u4e8e\u8bfe\u7a0b\u5185\u5bb9\u3001\u6280\u672f\u7ec6\u8282\u3001\u56e2\u961f\u534f\u4f5c\u7684\u6df1\u5ea6\u4ea4\u6d41) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u800c\u6765\u3002\u7528\u6237\u6df1\u5ea6\u6295\u5165\u8bfe\u7a0b\u9879\u76ee\uff0c\u5173\u6ce8\u6587\u672c\u6253\u78e8\u3001\u89d2\u8272\u5851\u9020\u3001\u5f55\u97f3\u6280\u5de7\u3001\u540e\u671f\u5236\u4f5c\u7b49\u786c\u6838\u6280\u80fd\uff0c\u4e3b\u52a8\u5206\u4eab\u8d44\u6e90\u3001\u5e2e\u52a9\u540c\u5b66\u89e3\u51b3\u95ee\u9898\uff0c\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u4e13\u4e1a\u7cbe\u8fdb\u548c\u5174\u8da3\u9a71\u52a8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201cai\u4eba\u7269\u5206\u6790\u7684\u597d\u597d\u201d\uff1b> \u201c\u6211\u8fd8\u6ca1\u4e0b\u597d\u201d\uff1b> \u201c\u6211\u5efa\u8bae\u4f60\u8fd8\u662f\u627e\u4e00\u4e0b\u662f\u4e0d\u662f\u8bbe\u5907\u8fd8\u662f\u73af\u5883\u7684\u539f\u56e0\uff0c\u56e0\u4e3a\u53d1\u51fa\u6765\u7684\u90fd\u662f\u6ca1\u6709\u4fee\u97f3\u7684\u201d\uff1b> \u201c\u6211\u8fd8\u7528\u8fd9\u4e2a\u5e2e\u4f60\u53bb\u53e3\u6c34\u97f3\u4e86\u201d\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b06\u9ad8\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a\u4e2d\u9ad8 \u2014 \u5df2\u8d2d\u8bfe\uff0c\u5e76\u4e3b\u52a8\u54a8\u8be2\u4e0b\u4e00\u9636\u6bb5\u8bfe\u7a0b\uff08\u540e\u671f\u73ed\uff09\uff0c\u65e0\u4efb\u4f55\u5173\u4e8e\u4ef7\u683c\u3001\u5206\u671f\u7684\u8ba8\u8bba\uff0c\u8d44\u91d1\u538b\u529b\u4e0d\u660e\u663e\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a\u9ad8 \u2014 \u8fde\u7eed\u591a\u65e5\u9ad8\u5f3a\u5ea6\u6295\u5165\u5c0f\u7ec4\u9879\u76ee\uff0c\u8fdb\u884c\u6587\u672c\u4fee\u6539\u3001\u5f55\u97f3\u3001\u540e\u671f\u526a\u8f91\u3001\u7ec4\u7ec7\u4f1a\u8bae\u3001\u6280\u672f\u7b54\u7591\uff0c\u5c55\u73b0\u51fa\u6781\u5f3a\u7684\u6295\u5165\u5ea6\u548c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a\u4e2d \u2014 \u5bb6\u4eba\u77e5\u6653\u5176\u7231\u597d\uff08\u867d\u66fe\u8bef\u89e3\uff09\uff0c\u672a\u63d0\u53ca\u53cd\u5bf9\u62a5\u8bfe\uff0c\u4f46\u652f\u6301\u5ea6\u8bc1\u636e\u4e0d\u5145\u5206\u3002\u77ed\u677f\u5728\u6b64\uff0c\u4f46\u672a\u6784\u6210\u4e25\u91cd\u963b\u529b\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9762\u5bf9\u590d\u6742\u7684\u9879\u76ee\u534f\u4f5c\u3001\u6280\u672f\u95ee\u9898\uff08\u97f3\u9891\u95ee\u9898\u3001\u8f6f\u4ef6\u5b89\u88c5\uff09\u3001\u65f6\u95f4\u538b\u529b\uff08\u6587\u672c\u8d85\u65f6\uff09\uff0c\u59cb\u7ec8\u4fdd\u6301\u79ef\u6781\u89e3\u51b3\u95ee\u9898\u7684\u6001\u5ea6\uff0c\u4e3b\u52a8\u63d0\u4f9b\u89e3\u51b3\u65b9\u6848\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u4e50\u4e8e\u52a9\u4eba\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u95ee\u9898\u5f88\u5927...\u6293\u7d27\u65f6\u95f4\u627e\u6280\u672f\u8001\u5e08\u770b\u4e00\u770b\u5427\u201d\uff1b> \u201c\u72b6\u6001\u4e0d\u597d\u600e\u4e48\u914d\u4e5f\u6ca1\u7528\u7684\u201d\uff1b> \u201c\u8fd9\u4e2a\u53ef\u4ee5\u5148\u5f85\u5b9a\uff0c\u5b9e\u5728\u4e0d\u884c\u7684\u8bdd\uff0c\u5c31\u5220\u8fd9\u4e2a\u201d\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u6e34\u671b\u5728\u4e13\u4e1a\u9886\u57df\u83b7\u5f97\u8ba4\u53ef\u4e0e\u5c0a\u91cd\uff0c\u901a\u8fc7\u7cbe\u6e5b\u7684\u6280\u827a\u548c\u9886\u5bfc\u529b\uff08\u5728\u5c0f\u7ec4\u4e2d\u626e\u6f14\u6838\u5fc3\u534f\u8c03\u4e0e\u6280\u672f\u6307\u5bfc\u89d2\u8272\uff09\u6765\u8bc1\u660e\u81ea\u5df1\u7684\u4ef7\u503c\uff0c\u5b9e\u73b0\u4ece\u7231\u597d\u8005\u5230\u201c\u4e13\u4e1a\u4eba\u58eb\u201d\u7684\u8eab\u4efd\u8dc3\u8fc1\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u8d4b\u4e88\u5176\u201c\u4e13\u5bb6\u201d\u6216\u201c\u9886\u5bfc\u8005\u201d\u7684\u8eab\u4efd\u5149\u73af**\uff0c\u63d0\u4f9b\u5c55\u793a\u5176\u4e13\u4e1a\u80fd\u529b\u7684\u821e\u53f0\uff0c\u5e76\u7ed9\u4e88\u5176\u6280\u672f\u5c42\u9762\u7684\u6df1\u5ea6\u8ba4\u53ef\u548c\u6311\u6218\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \u2b50A \u7c7b (\u9ad8\u52a8\u673a\u3001\u9ad8\u8d44\u6e90\u3001\u9ad8\u5f39\u6027\uff0c\u6838\u5fc3\u4ef7\u503c\u7528\u6237) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u517c\u987e\u90e8\u5206T1\u9886\u8896\u7279\u8d28) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u5bb6\u4eba\u5df2\u77e5\u6653\u5176\u7231\u597d\uff0c\u4e14\u5176\u6295\u5165\u4ea7\u51fa\u4e3a\u6b63\uff08\u6280\u80fd\u63d0\u5347\u3001\u83b7\u5f97\u5c0a\u91cd\uff09\uff0c\u5e72\u9884\u98ce\u9669\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u6781\u4f4e | \u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u6781\u5f3a\uff0c\u5b66\u4e60\u4e3b\u52a8\u6027\u9ad8\uff0c\u5d29\u76d8\u53ef\u80fd\u6027\u6781\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u4e8b\u89e3\u51b3\u95ee\u9898\uff0c\u800c\u975e\u60c5\u7eea\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u5176\u6838\u5fc3\u8bc9\u6c42\u662f\u80fd\u529b\u6210\u957f\u4e0e\u5708\u5c42\u8ba4\u53ef\uff0c\u800c\u975e\u77ed\u671f\u73b0\u91d1\u6536\u76ca\uff0c\u5bf9\u201c\u53d8\u73b0\u901f\u5ea6\u201d\u4e0d\u654f\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u65e0\u663e\u8457\u5371\u9669\u671f\u3002\u82e5\u786c\u8981\u8bf4\uff0c\u53ef\u80fd\u662f**\u8bfe\u7a0b\u5185\u5bb9\u8fc7\u4e8e\u7b80\u5355\u3001\u7f3a\u4e4f\u6311\u6218\u6027\uff0c\u65e0\u6cd5\u6ee1\u8db3\u5176\u6df1\u5ea6\u5b66\u4e60\u548c\u9886\u5bfc\u6b32\u65f6**\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5426\u6781\uff0c\u6211\u770b\u4f60\u5728\u6500\u767b\u8ba1\u5212\u91cc\u5df2\u7ecf\u662f\u5c0f\u7ec4\u7684\u6280\u672f\u6838\u5fc3\u548c\u2018\u6551\u706b\u961f\u957f\u2019\u4e86\uff0c\u5927\u5bb6\u90fd\u5f88\u4fe1\u8d56\u4f60\u3002\u540e\u671f\u7684\u8bfe\u7a0b\u4f1a\u66f4\u786c\u6838\uff0c\u6709\u5f88\u591a\u50cfRX10\u63d2\u4ef6\u6df1\u5ea6\u5e94\u7528\u3001\u590d\u6742\u573a\u666f\u642d\u5efa\u8fd9\u6837\u7684\u6311\u6218\uff0c\u6211\u89c9\u5f97\u7279\u522b\u9002\u5408\u4f60\u8fd9\u79cd\u559c\u6b22\u94bb\u7814\u548c\u5e26\u9886\u56e2\u961f\u7684\u4eba\u3002\u671f\u5f85\u4f60\u5728\u8fd9\u91cc\u7ee7\u7eed\u53d1\u6325\u4f60\u7684\u4e13\u5bb6\u5f71\u54cd\u529b\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011+ \u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf**\u3011\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743**\u3011\uff08\u5141\u8bb8\u5176\u5411\u8bb2\u5e08\u63d0\u51fa\u9ad8\u96be\u5ea6\u6280\u672f\u95ee\u9898\uff09\u3001\u3010**\u73ed\u59d4/\u5c0f\u7ec4\u957f\u4efb\u547d**\u3011\uff08\u8d4b\u4e88\u5176\u7ec4\u7ec7\u7ba1\u7406\u804c\u8d23\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5c06\u5176\u89c6\u4e3a\u666e\u901a\u5b66\u5458\u8fdb\u884c\u201c\u4fdd\u59c6\u5f0f\u201d\u7ba1\u7406\uff1b\u7ed9\u4ed6\u5e03\u7f6e\u8fc7\u4e8e\u7b80\u5355\u3001\u91cd\u590d\u6027\u7684\u4f5c\u4e1a\uff1b\u5ffd\u89c6\u6216\u8f7b\u89c6\u4ed6\u63d0\u51fa\u7684\u6280\u672f\u5efa\u8bae\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u4ed6\u662f\u9ad8\u590d\u8d2d\u6f5c\u529b\u7528\u6237\uff0c\u5bf9\u540e\u671f\u73ed\u5df2\u6709\u660e\u786e\u610f\u5411\uff0c\u53ef\u63a8\u8350\u66f4\u9ad8\u7ea7\u522b\u7684\u201c\u5927\u5e08\u73ed\u201d\u3001\u201c\u79c1\u8463\u4f1a\u201d\u7b49\u5177\u6709\u8eab\u4efd\u8ba4\u540c\u548c\u6df1\u5ea6\u94fe\u63a5\u7684\u4ea7\u54c1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u5efa\u8bae\u4f60\u8fd8\u662f\u627e\u4e00\u4e0b\u662f\u4e0d\u662f\u8bbe\u5907\u8fd8\u662f\u73af\u5883\u7684\u539f\u56e0\uff0c\u56e0\u4e3a\u53d1\u51fa\u6765\u7684\u90fd\u662f\u6ca1\u6709\u4fee\u97f3\u7684\u201d **(\u4e3b\u52a8\u5e2e\u52a9\u540c\u5b66\uff0c\u6280\u672f\u6307\u5bfc\u503e\u5411)**\n2. > \u201c\u6211\u8fd8\u7528\u8fd9\u4e2a\u5e2e\u4f60\u53bb\u53e3\u6c34\u97f3\u4e86\u201d **(\u6280\u672f\u94bb\u7814\u4e0e\u5206\u4eab\u7cbe\u795e)**\n3. > \u201c\u72b6\u6001\u4e0d\u597d\u600e\u4e48\u914d\u4e5f\u6ca1\u7528\u7684\u201d **(\u7406\u6027\u3001\u52a1\u5b9e\uff0c\u8ffd\u6c42\u4e13\u4e1a\u6548\u679c\u800c\u975e\u6577\u884d\u4e86\u4e8b)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2\u4f4e\u8c03\u5b9e\u5e72\u578b\uff08\u517c\u9886\u8896\u6f5c\u8d28\uff09\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4e0e\u5b9e\u73b0\u81ea\u6211\u4ef7\u503c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u8d4b\u4e88\u5176\u4e13\u5bb6\u8eab\u4efd\u4e0e\u6311\u6218\u6027\u4efb\u52a1\uff0c\u6ee1\u8db3\u5176\u9886\u5bfc\u4e0e\u7cbe\u8fdb\u9700\u6c42\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"risk_level\": \"\u6781\u4f4e\", \"refund_risk\": \"\u6781\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\"}\n```";
