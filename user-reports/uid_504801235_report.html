        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 504801235 (\u6635\u79f0\uff1a\u6587\u5316\u5b9a/\u540c\u9891\u4e4b\u5149) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-01 \u81f3 2026-03-05 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5c0f\u767d\u73ed\u4e3b\u4efb(\u590f\u70dc)\u3001\u6c99\u59dc1(\u59da\u6021\u537f)\u3001\u5f71\u5b503(\u6842\u82f1) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u5f20\u9707\u8001\u5e08\u6709\u58f0\u6f14\u64ad\u8bad\u7ec3\u8425\uff08\u7cbe\u82f1\u7248\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u9500\u552e\u591a\u6b21\u63d0\u53ca\u201c\u8d44\u91d1\u7d27\u5f20\u53ef\u7528\u82b1\u5457/\u4fe1\u7528\u5361\u201d\uff0c\u4f46\u7528\u6237\u672a\u56de\u5e94\uff0c\u65e0\u6cd5\u5224\u65ad\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u7528\u6237\u80fd\u53c2\u4e0e\u65e9\u529f\u3001\u73ed\u4f1a\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u804c\u4e1a\u6216\u65f6\u95f4\u5b89\u6392\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u4fe1\u606f\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u7528\u6237\u53d1\u8a00\u6781\u5c11\uff0c\u591a\u4e3a\u88ab\u52a8\u56de\u5e94\u548c\u64cd\u4f5c\u6027\u95ee\u9898\uff0c\u65e0\u6cd5\u6709\u6548\u5224\u65ad\u5176\u6df1\u5c42\u52a8\u673a\u3001\u8d44\u6e90\u72b6\u51b5\u53ca\u5bb6\u5ead\u652f\u6301\u5ea6\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u52a8\u673a\u6df7\u6742\uff0c\u65e2\u6709\u5bf9\u6280\u80fd\u5b66\u4e60\u7684\u5174\u8da3\uff08\u65e9\u529f\u6709\u611f\u89c9\uff09\uff0c\u4e5f\u660e\u663e\u53d7\u5230\u9500\u552e\u201c\u7b2c\u4e8c\u5468\u5373\u53ef\u8bd5\u97f3\u53d8\u73b0\u201d\u3001\u201c\u5de5\u4f5c\u5ba4\u8d44\u6e90\u201d\u3001\u201c\u65f6\u85aa\u7ffb\u500d\u201d\u7b49\u627f\u8bfa\u5438\u5f15\u3002\u672a\u8868\u73b0\u51fa\u6781\u901f\u53d8\u73b0\u7684\u8feb\u5207\u6027\uff0c\u4f46\u4e5f\u672a\u5c55\u73b0\u51fa\u7eaf\u7cb9\u4e3a\u80fd\u529b\u800c\u6765\u7684\u957f\u671f\u4e3b\u4e49\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4e00\u5929\u6bd4\u4e00\u5929\u6709\u611f\u89c9\u4e86\uff0c\u8fd9\u79cd\u611f\u89c9\u7279\u522b\u597d\uff01\u201d (\u5174\u8da3\u4fe1\u53f7) > \u9500\u552e\uff1a\u201c\u7b2c\u4e8c\u5468\u5c31\u53ef\u4ee5\u5f00\u901a\u8bd5\u97f3\u63a5\u4e66\u6743\u9650\uff0c\u4e0d\u9700\u8981\u7b49\u5230\u6bd5\u4e1a\uff0c\u5165\u5b66\u671f\u95f4\u5c31\u53ef\u4ee5\uff01\u201d (\u7528\u6237\u672a\u53cd\u9a73\uff0c\u9ed8\u8ba4\u63a5\u53d7\u53d8\u73b0\u627f\u8bfa)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2753\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u8bc4\u7ea7]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u4fe1\u606f\u7f3a\u5931]** \u2014 \u9500\u552e\u591a\u6b21\u8bd5\u63a2\u8d44\u91d1\u95ee\u9898\uff08\u201c\u60f3\u5b66\u4e60\u8d44\u91d1\u7d27\u5f20\u56de\u590d\uff1a1\u201d\uff09\uff0c\u7528\u6237\u672a\u56de\u5e94\uff0c\u65e0\u6cd5\u5224\u65ad\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**[\u4fe1\u606f\u7f3a\u5931]** \u2014 \u7528\u6237\u80fd\u5b8c\u6210\u65e9\u529f\u3001\u770b\u56de\u653e\uff0c\u4f46\u672a\u900f\u9732\u5de5\u4f5c\u6027\u8d28\u6216\u65f6\u95f4\u5b89\u6392\uff0c\u65e0\u6cd5\u5224\u65ad\u5176\u5b66\u4e60\u53ef\u6301\u7eed\u6027\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u4fe1\u606f\u7f3a\u5931]** \u2014 \u804a\u5929\u8bb0\u5f55\u4e2d\u5b8c\u5168\u672a\u63d0\u53ca\u5bb6\u5ead\uff0c\u662f**\u91cd\u5927\u98ce\u9669\u76f2\u533a**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u627eUID\u3001\u627e\u56de\u653e\uff09\u4f1a\u4e3b\u52a8\u63d0\u95ee\u5e76\u5bfb\u6c42\u89e3\u51b3\uff0c\u5177\u5907\u57fa\u7840\u7684\u95ee\u9898\u89e3\u51b3\u80fd\u529b\u3002\u4f46\u4fe1\u606f\u8fc7\u5c11\uff0c\u65e0\u6cd5\u5224\u65ad\u5176\u5728\u5b66\u4e60\u6838\u5fc3\u96be\u70b9\uff08\u5982\u53d1\u58f0\u6280\u5de7\u3001\u8bd5\u97f3\u5931\u8d25\uff09\u65f6\u7684\u6297\u538b\u8868\u73b0\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08\uff0c\u65e9\u6668\u7684\u76f4\u64ad\u56de\u653e\u8bf4\u4ece\u559c\u64ad\u5c0f\u7a0b\u5e8f\u91cc\u8fb9\u53ef\u4ee5\u8fdb\uff0c\u53ef\u662f\u6211\u5728\u5c0f\u7a0b\u5e8f\u91cc\u8fb9\u600e\u4e48\u627e\u4e0d\u5230\u561e\uff1f\u201d (\u9047\u5230\u95ee\u9898\u4e3b\u52a8\u6c42\u89e3) > \u201c\u820c\u8ddf\u8fb9\u6709\u4e2a\u70ae\uff0c\u75db\u5ff5\u7684\u53e3\u6c34\u90fd\u51fa\u6765\u4e86\uff01[\u6342\u8138]\u201d (\u8f7b\u5fae\u62b1\u6028\uff0c\u4f46\u672a\u5347\u7ea7\u4e3a\u60c5\u7eea\u5d29\u6e83)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c / \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5b58\u5728\u611f\u4f4e\uff0c\u7f3a\u4e4f\u660e\u786e\u76ee\u6807\u548c\u8def\u5f84**\u3002\u7528\u6237\u53d1\u8a00\u88ab\u52a8\uff0c\u66f4\u50cf\u4e00\u4e2a\u201c\u8ddf\u968f\u8005\u201d\uff0c\u9700\u8981\u88ab\u5f15\u5bfc\u548c\u89c4\u5212\u3002\u5176\u9700\u6c42\u6df7\u6742\u4e86\u201c\u5bfb\u6c42\u4e00\u4efd\u526f\u4e1a\u4fdd\u969c\u201d\uff08\u5b89\u5168\u9700\u6c42\uff09\u548c\u201c\u5728\u793e\u7fa4\u4e2d\u83b7\u5f97\u8ba4\u53ef\u4e0e\u5f52\u5c5e\u201d\uff08\u793e\u4ea4\u9700\u6c42\uff09\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u660e\u786e\u7684\u8def\u5f84\u89c4\u5212\u4e0e\u6301\u7eed\u7684\u201c\u88ab\u770b\u89c1\u201d\u611f**\u3002\u4ed6\u9700\u8981\u88ab\u6e05\u6670\u5730\u544a\u77e5\u201c\u4e0b\u4e00\u6b65\u8be5\u505a\u4ec0\u4e48\u201d\uff0c\u5e76\u5728\u5b8c\u6210\u6bcf\u4e00\u6b65\uff08\u5982\u627e\u5230UID\u3001\u5b8c\u6210\u65e9\u529f\uff09\u65f6\u5f97\u5230\u53ca\u65f6\u3001\u5177\u4f53\u7684\u80af\u5b9a\uff0c\u4ee5\u5efa\u7acb\u4fe1\u5fc3\u548c\u5f52\u5c5e\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfea C1 \u7c7b** (\u4fe1\u606f\u4e25\u91cd\u4e0d\u8db3\uff0c\u4f46\u672a\u89e6\u53d1D\u7c7b\u7ea2\u7ebf\uff0c\u6682\u5f52\u5165\u89c2\u5bdf\u533a) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **\u3010\u4fe1\u606f\u4e0d\u8db3\uff0c\u503e\u5411 T5 \u597d\u73a9\u5c1d\u9c9c\u578b \u6216 T8 \u6f5c\u6c34\u5403\u74dc\u578b\u3011**\u3002\u7528\u6237\u884c\u4e3a\u66f4\u50cf\u4e00\u4e2a\u201c\u5b89\u9759\u7684\u53c2\u4e0e\u8005\u201d\uff0c\u7f3a\u4e4fT4\u7684\u6025\u5207\u641e\u94b1\u8bc9\u6c42\uff0c\u4e5f\u7f3a\u4e4fT2/T3\u7684\u94bb\u7814\u7cbe\u795e\u3002\u66f4\u53ef\u80fd\u5904\u4e8e\u201c\u5148\u770b\u770b\uff0c\u8ddf\u7740\u5b66\u5b66\u201d\u7684\u72b6\u6001\u3002 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u57fa\u4e8e\u73b0\u6709\u4fe1\u606f)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u7b49\u660e\u786e\u4fe1\u53f7\uff0c\u4f46**\u5bb6\u5ead\u652f\u6301\u5ea6\u4e0e\u652f\u4ed8\u80fd\u529b\u4fe1\u606f\u5b8c\u5168\u7f3a\u5931\uff0c\u662f\u6f5c\u5728\u96f7\u533a**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | **\u4fe1\u606f\u9ed1\u6d1e**\u3002\u82e5\u62a5\u540d\u8d44\u91d1\u6765\u6e90\u4e8e\u5bb6\u5ead\u50a8\u84c4\u6216\u501f\u8d37\uff0c\u4e14\u5bb6\u4eba\u4e0d\u77e5\u60c5\uff0c\u98ce\u9669\u6781\u9ad8\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u82e5\u5176\u771f\u5b9e\u5de5\u4f5c\u65f6\u95f4\u4e0e\u8bfe\u7a0b\u76f4\u64ad\u3001\u4f5c\u4e1a\u63d0\u4ea4\u65f6\u95f4\u51b2\u7a81\uff0c\u53ef\u80fd\u56e0\u79ef\u538b\u4efb\u52a1\u4ea7\u751f\u7126\u8651\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u76ee\u524d\u770b\u60c5\u7eea\u8f83\u7a33\u5b9a\uff0c\u4f46\u82e5\u5728\u5b9e\u64cd\u73af\u8282\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u3001\u8bd5\u97f3\u5931\u8d25\uff09\u8fde\u7eed\u53d7\u632b\uff0c\u53ef\u80fd\u56e0\u632b\u8d25\u611f\u653e\u5f03\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | \u9500\u552e\u8fc7\u5ea6\u627f\u8bfa\u201c\u7b2c\u4e8c\u5468\u53d8\u73b0\u201d\u3001\u201c\u65f6\u85aa\u7ffb\u500d\u201d\u3002\u4e00\u65e6\u7528\u6237\u6295\u5165\u5b66\u4e60\u540e\uff0c\u53d1\u73b0\u53d8\u73b0\u96be\u5ea6\u8fdc\u8d85\u9884\u671f\uff0c\u6781\u6613\u5728**\u5f00\u8bfe2-4\u5468**\u7684\u201c\u6b7b\u4ea1\u8c37\u201d\u9636\u6bb5\u56e0\u6536\u76ca\u843d\u5dee\u800c\u66b4\u6012\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\u3002\u6b64\u65f6\u201c\u5feb\u901f\u63a5\u5355\u201d\u627f\u8bfa\u672a\u5151\u73b0\uff0c\u5b66\u4e60\u8fdb\u5165\u67af\u71e5\u57fa\u672c\u529f\u9636\u6bb5\uff0c\u53cc\u91cd\u843d\u5dee\u4e0b\u9000\u8d39\u98ce\u9669\u6700\u5927\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u540c\u9891\u5927\u54e5/\u6587\u5316\u5b9a\uff0c\u770b\u5230\u4f60\u6bcf\u5929\u575a\u6301\u65e9\u529f\uff0c\u7279\u522b\u4e3a\u4f60\u9ad8\u5174\uff01\u54b1\u4eec\u4e0d\u7740\u6025\uff0c\u6709\u58f0\u8fd9\u6761\u8def\uff0c\u5e08\u59d0/\u73ed\u73ed\u4f1a\u7ed9\u4f60\u89c4\u5212\u5f97\u660e\u660e\u767d\u767d\u3002\u4f60\u53ea\u9700\u8981\u8ddf\u7740\u8282\u594f\uff0c\u6bcf\u4e00\u6b65\u8d70\u7a33\uff0c\u7ed3\u679c\u81ea\u7136\u6c34\u5230\u6e20\u6210\u3002\u6709\u4efb\u4f55\u4e0d\u6e05\u695a\u7684\uff0c\u968f\u65f6\u95ee\u6211\uff0c\u6211\u90fd\u5728\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5174\u8da3\u6e38\u4e50\u7ebf**\u3011\u3002\u4f18\u5148\u5efa\u7acb\u5b66\u4e60\u4e60\u60ef\u548c\u793e\u7fa4\u5f52\u5c5e\u611f\uff0c\u6de1\u5316\u77ed\u671f\u53d8\u73b0\u538b\u529b\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u201c\u8ddf\u968f\u8005\u201d\u7279\u6027\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010**\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305 (\u6a21\u5757C)**\u3011\uff0c\u5373\u6bcf\u65e5\u6253\u5361\u9f13\u52b1\u3001\u4f5c\u4e1a\u5b8c\u6210\u5373\u5938\u3001\u964d\u4f4e\u4efb\u52a1\u96be\u5ea6\u3002**\u6682\u4e0d\u5f00\u653e\u3010\u786c\u6838\u624b\u827a\u6c60 (\u6a21\u5757B)**\u3011\u4e2d\u7684\u9ad8\u96be\u5ea6\u4efb\u52a1\u548c\u4e25\u82db\u70b9\u8bc4\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u4ed6\u8fc7\u5ea6\u627f\u8bfa\u53d8\u73b0\u901f\u5ea6\u548c\u91d1\u989d**\u3002\u9500\u552e\u8bdd\u672f\u4e2d\u7684\u201c\u7b2c\u4e8c\u5468\u53d8\u73b0\u201d\u3001\u201c\u65f6\u85aa\u7ffb\u500d\u201d\u5fc5\u987b\u7531\u73ed\u4e3b\u4efb\u5728\u670d\u52a1\u4e2d\u4e3b\u52a8\u8fdb\u884c\u201c\u9884\u671f\u7ba1\u7406\u201d\uff0c\u544a\u77e5\u771f\u5b9e\u884c\u4e1a\u60c5\u51b5\u3002\n    2. **\u7edd\u4e0d\u7ed9\u4ed6\u5e03\u7f6e\u8fc7\u96be\u3001\u8017\u65f6\u7684\u4f5c\u4e1a**\u3002\u5e94\u4ee5\u201c\u5b8c\u6210\u5373\u80dc\u5229\u201d\u4e3a\u6807\u51c6\uff0c\u4fdd\u62a4\u5176\u8106\u5f31\u7684\u6210\u5c31\u611f\u3002\n    3. **\u7edd\u4e0d\u5728\u672a\u4e86\u89e3\u5176\u5bb6\u5ead\u548c\u8d22\u52a1\u60c5\u51b5\u524d\uff0c\u5f15\u5bfc\u5176\u8fdb\u884c\u4efb\u4f55\u5206\u671f\u6216\u501f\u8d37\u652f\u4ed8**\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u5b8c\u5168\u6478\u6e05\u5176\u8d44\u6e90\u5e95\u5ea7\uff08\u7279\u522b\u662f\u5bb6\u5ead\u548c\u8d44\u91d1\u60c5\u51b5\uff09\u524d\uff0c\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u662f\u5f15\u7206\u9000\u8d39\u7684\u5bfc\u706b\u7d22\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u4e00\u5929\u6bd4\u4e00\u5929\u6709\u611f\u89c9\u4e86\uff0c\u8fd9\u79cd\u611f\u89c9\u7279\u522b\u597d\uff01\u201d **(\u4ec5\u6709\u7684\u79ef\u6781\u53cd\u9988\uff0c\u8bc1\u660e\u5176\u6709\u5185\u5728\u5174\u8da3\u9a71\u52a8)**\n2. > \u201c\u8001\u5e08\uff0c\u65e9\u6668\u7684\u76f4\u64ad\u56de\u653e\u8bf4\u4ece\u559c\u64ad\u5c0f\u7a0b\u5e8f\u91cc\u8fb9\u53ef\u4ee5\u8fdb\uff0c\u53ef\u662f\u6211\u5728\u5c0f\u7a0b\u5e8f\u91cc\u8fb9\u600e\u4e48\u627e\u4e0d\u5230\u561e\uff1f\u201d **(\u5178\u578b\u7684\u6280\u672f\u4f9d\u8d56\u578b\u7528\u6237\uff0c\u9700\u8981\u624b\u628a\u624b\u6307\u5bfc)**\n3. > \u201c\u820c\u8ddf\u8fb9\u6709\u4e2a\u70ae\uff0c\u75db\u5ff5\u7684\u53e3\u6c34\u90fd\u51fa\u6765\u4e86\uff01[\u6342\u8138]\u201d **(\u8f7b\u5fae\u62b1\u6028\uff0c\u60c5\u7eea\u8868\u8fbe\u76f4\u63a5\u4f46\u672a\u5931\u63a7\uff0c\u9700\u89c2\u5bdf\u540e\u7eed\u6297\u538b\u6027)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010\u4fe1\u606f\u4e0d\u8db3\u7684\u88ab\u52a8\u8ddf\u968f\u8005\u3011**\uff0c\u503e\u5411T5/T8\u539f\u578b\u3002\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u660e\u786e\u7684\u8def\u5f84\u548c\u793e\u7fa4\u5f52\u5c5e\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u504f\u9ad8\u3011**\uff0c**\u5bb6\u5ead\u4e0e\u652f\u4ed8\u4fe1\u606f\u9ed1\u6d1e\u662f\u6700\u5927\u98ce\u9669**\u3002\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u6302\u8f7d\u5174\u8da3\u6e38\u4e50\u7ebf+\u60c5\u7eea\u4fdd\u59c6\u5305\uff0c\u4e25\u683c\u7ba1\u7406\u53d8\u73b0\u9884\u671f\uff0c\u4e25\u7981\u5347\u5355\u3011**\u3002\n\n```json\n{\"core_type\": \"\u4fe1\u606f\u4e0d\u8db3\uff0c\u503e\u5411 T5 \u597d\u73a9\u5c1d\u9c9c\u578b/T8 \u6f5c\u6c34\u5403\u74dc\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\u504f\u9ad8\", \"maslow_need\": \"\u5b89\u5168/\u793e\u4ea4\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf + \u7597\u6108\u966a\u4f34\u8f85\u52a9\u5305\"}\n```";
