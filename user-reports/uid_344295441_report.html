        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 344295441 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5fae\u98ce\u5f90\u67656(\u5f90\u5c0f\u6d01) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u5df2\u652f\u4ed8\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u652f\u4ed8\u65b9\u5f0f\u672a\u77e5\uff0c\u65e0\u5206\u671f/\u501f\u8d37\u4fe1\u53f7\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u4ec5\u77e5\u81ea\u7531\u804c\u4e1a\uff0c\u65f6\u95f4\u81ea\u7531\u5ea6\u672a\u77e5\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3** |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** - \u7528\u6237\u4e3b\u52a8\u53d1\u8a00\u6781\u5c11\uff0c\u591a\u4e3a\u88ab\u52a8\u5e94\u7b54\uff0c\u5173\u952e\u7ef4\u5ea6\uff08\u652f\u4ed8\u3001\u65f6\u95f4\u3001\u5bb6\u5ead\u3001\u6df1\u5c42\u52a8\u673a\uff09\u4fe1\u606f\u532e\u4e4f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b07\u4f4e\n- **\u7279\u5f81\u901f\u5199**\uff1a\u7eaf\u4e3a\u51e0\u5929\u5185\u63d0\u73b0\u4fdd\u5e95\u800c\u6765(\u4f4e\u6781\u5371)\u3002\u7528\u6237\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u3001\u6280\u672f\u7ec6\u8282\u3001\u5b66\u4e60\u8def\u5f84\u65e0\u4efb\u4f55\u4e3b\u52a8\u8be2\u95ee\uff0c\u552f\u4e00\u660e\u786e\u8868\u8fbe\u7684\u76ee\u7684\u662f\u201c\u526f\u4e1a\u201d\uff08\u5feb\u901f\u53d8\u73b0\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c6-\u526f\u4e1a\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u5df2\u652f\u4ed8\u8bfe\u7a0b\u8d39\u7528\uff0c\u4f46\u652f\u4ed8\u65b9\u5f0f\u672a\u77e5\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u5b58\u5728\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u81ea\u7531\u804c\u4e1a\u8005\uff0c\u7406\u8bba\u4e0a\u65f6\u95f4\u8f83\u81ea\u7531\uff0c\u4f46\u672a\u63d0\u53ca\u5177\u4f53\u65f6\u95f4\u5b89\u6392\u548c\u7cbe\u529b\u6295\u5165\u610f\u613f\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u5b58\u5728\u6f5c\u5728\u98ce\u9669**\u3002\u7528\u6237\u4e92\u52a8\u6781\u5176\u88ab\u52a8\uff08\u4ec5\u56de\u590d\u201c\u597d\u201d\u3001\u201c\u55ef\u201d\u3001\u201c\u4e0b\u8f7d\u4e86\u201d\uff09\uff0c\u7f3a\u4e4f\u4e3b\u52a8\u63a2\u7d22\u548c\u63d0\u95ee\u7684\u610f\u613f\u3002\u8fd9\u79cd\u6781\u5ea6\u6c89\u9ed8\u548c\u88ab\u52a8\uff0c\u53ef\u80fd\u9884\u793a\u7740**\u4f4e\u4e3b\u52a8\u6027\u3001\u9ad8\u4f9d\u8d56\u3001\u9047\u632b\u6613\u653e\u5f03**\u7684\u503e\u5411\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u5168\u7a0b\u5bf9\u8bdd\u4e2d\uff0c\u7528\u6237\u4e3b\u52a8\u53d1\u8a00\u4ec55\u6b21\uff0c\u5747\u4e3a\u7b80\u77ed\u5e94\u7b54\uff0c\u65e0\u4efb\u4f55\u60c5\u7eea\u8868\u8fbe\u6216\u6df1\u5ea6\u4e92\u52a8\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42\uff08\u7126\u8651\u4fdd\u969c\uff09**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e2d\u5e74\uff0852\u5c81\uff09\u81ea\u7531\u804c\u4e1a\u8005\u7684\u6536\u5165\u4e0d\u7a33\u5b9a\u7126\u8651**\u3002\u9009\u62e9\u201c\u526f\u4e1a\u201d\u7684\u76f4\u63a5\u9a71\u52a8\u529b\u662f\u5bfb\u6c42\u4e00\u4efd\u989d\u5916\u7684\u3001\u53ef\u9884\u671f\u7684\u7ecf\u6d4e\u4fdd\u969c\uff0c\u4ee5\u5bf9\u6297\u672a\u6765\u4e0d\u786e\u5b9a\u6027\u5e26\u6765\u7684\u751f\u5b58\u538b\u529b\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u4e0e\u5b89\u5168\u611f**\u3002\u4ed6\u9700\u8981\u6e05\u6670\u7684\u8def\u5f84\u544a\u8bc9\u4ed6\u201c\u6309\u90e8\u5c31\u73ed\u5c31\u80fd\u6709\u7ed3\u679c\u201d\uff0c\u800c\u975e\u865a\u65e0\u7f25\u7f08\u7684\u201c\u68a6\u60f3\u201d\u3002\u9700\u8981\u63d0\u4f9b\u660e\u786e\u7684\u63a5\u5355\u6d41\u7a0b\u3001\u7a33\u5b9a\u7684\u6d3e\u5355\u9884\u671f\u548c\u201c\u9632\u9a97\u201d\u5f0f\u7684\u627f\u8bfa\u4fdd\u969c\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u8bba** (\u52a8\u673a\u4f4e\u3001\u8d44\u6e90\u4e2d\u3001\u5f39\u6027\u672a\u77e5\u4f46\u503e\u5411\u4f4e) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u7b49\u4fe1\u53f7\u3002\u4f46\u56e0\u5176\u4e3a**\u9ad8\u98ce\u9669T4\u7528\u6237**\uff0c\u9700\u4e25\u9632\u56e0\u53d8\u73b0\u9884\u671f\u843d\u7a7a\u800c\u6ed1\u5411T8-D\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f4652\u5c81\u81ea\u7531\u804c\u4e1a\u8005\u5bb6\u5ead\u5e72\u9884\u98ce\u9669\u76f8\u5bf9\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u81ea\u7531\u804c\u4e1a\u53ef\u80fd\u610f\u5473\u7740\u65f6\u95f4\u4e0d\u89c4\u5f8b\u6216\u9879\u76ee\u5236\u7e41\u5fd9**\uff0c\u4e00\u65e6\u5f00\u8bfe\u540e\u56e0\u201c\u5fd9\u201d\u800c\u8ddf\u4e0d\u4e0a\u76f4\u64ad\u3001\u79ef\u538b\u4f5c\u4e1a\uff0c\u6781\u6613\u4ea7\u751f\u201c\u767d\u82b1\u94b1\u201d\u7684\u632b\u8d25\u611f\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4e2d** | \u5176\u88ab\u52a8\u3001\u6c89\u9ed8\u7684\u4e92\u52a8\u6a21\u5f0f\uff0c\u6697\u793a\u4e86**\u4f4e\u4e3b\u52a8\u6027\u548c\u9ad8\u4f9d\u8d56\u6027**\u3002\u4e00\u65e6\u9047\u5230\u8f6f\u4ef6\u5b89\u88c5\u3001\u4f5c\u4e1a\u63d0\u4ea4\u7b49\u64cd\u4f5c\u95e8\u69db\uff0c\u82e5\u65e0\u4eba\u201c\u624b\u628a\u624b\u201d\u6307\u5bfc\uff0c\u6781\u6613\u56e0\u201c\u5b66\u4e0d\u4f1a\u201d\u800c\u81ea\u5c0a\u5fc3\u53d7\u632b\uff0c\u9ed8\u9ed8\u653e\u5f03\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u6781\u9ad8** | **\u8fd9\u662f\u6700\u5927\u96f7\u533a**\u3002\u7528\u6237\u76ee\u6807\u660e\u786e\u4e3a\u201c\u526f\u4e1a\u201d\uff08\u5feb\u901f\u53d8\u73b0\uff09\u3002\u82e5\u5f00\u8bfe\u540e1-2\u5468\u5185\u672a\u611f\u53d7\u5230\u660e\u786e\u7684\u201c\u63a5\u5355\u8def\u5f84\u201d\u6216\u201c\u8d5a\u94b1\u5e0c\u671b\u201d\uff0c\u6216\u53d1\u73b0\u5b66\u4e60\u96be\u5ea6\u8fdc\u8d85\u9884\u671f\uff0c\u4f1a\u7acb\u523b\u8ba4\u4e3a\u201c\u88ab\u9a97\u201d\uff0c\u89e6\u53d1\u5f3a\u70c8\u9000\u8d39\u8bc9\u6c42\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c7-14\u5929**\u3002\u5f53\u7b2c\u4e00\u8f6e\u4f5c\u4e1a\u6216\u8bd5\u97f3\u6311\u6218\u6765\u4e34\uff0c\u82e5\u4ed6\u611f\u5230\u56f0\u96be\u4e14\u672a\u770b\u5230\u53d8\u73b0\u82d7\u5934\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cX\u5927\u54e5\uff0c\u770b\u5230\u60a8\u8d44\u6599\u662f\u81ea\u7531\u804c\u4e1a\uff0c\u65f6\u95f4\u4e0a\u5e94\u8be5\u80fd\u81ea\u5df1\u5b89\u6392\uff0c\u8fd9\u7279\u522b\u597d\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\uff0c\u4e0d\u641e\u865a\u7684\uff0c\u5c31\u662f\u4e00\u6b65\u6b65\u6559\u4f60\u600e\u4e48\u628a\u58f0\u97f3\u53d8\u6210\u94b1\u3002\u7b2c\u4e00\u5468\u6211\u5148\u5e26\u60a8\u8d70\u901a\u6574\u4e2a\u63a5\u5355\u6d41\u7a0b\uff0c\u60a8\u5148\u770b\u5230\u2018\u8def\u2019\u662f\u600e\u4e48\u8d70\u7684\uff0c\u5fc3\u91cc\u6709\u5e95\u4e86\uff0c\u54b1\u4eec\u518d\u7a33\u624e\u7a33\u6253\u7ec3\u5185\u529f\u3002\u6709\u4efb\u4f55\u64cd\u4f5c\u4e0a\u7684\u5361\u58f3\uff0c\u60a8\u968f\u65f6\u558a\u6211\uff0c\u6211\u8fdc\u7a0b\u5e2e\u60a8\u5f04\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5feb\u901f\u63a5\u5355\u7ebf**\u3011\u5fc5\u987b\u4f18\u5148\uff01\u6de1\u5316\u201c\u827a\u672f\u4fee\u517b\u201d\uff0c\u5f3a\u5316\u201c\u63a5\u5355SOP\u201d\u3001\u201c\u5e73\u53f0\u89c4\u5219\u201d\u3001\u201c\u8bd5\u97f3\u6280\u5de7\u201d\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u6f5c\u5728\u7684**\u64cd\u4f5c\u6050\u614c**\uff0c\u5fc5\u987b\u8865\u5145\u3010**\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\uff08\u7279\u79cdC\uff09**\u3011\uff0c\u521d\u671f\u63d0\u4f9b\u201c\u6309\u952e\u7ea7\u201d\u6307\u5bfc\u3002\u9488\u5bf9\u5176**\u53d8\u73b0\u7126\u8651**\uff0c\u5fc5\u987b\u8865\u5145\u3010**\u7cbe\u786e\u6d3e\u5355\u62e6\u622a\uff08B\u6a21\u5757\uff09**\u3011\uff0c\u65e9\u671f\u63d0\u4f9b\u771f\u5b9e\u3001\u4f4e\u95e8\u69db\u7684\u8bd5\u97f3\u673a\u4f1a\uff0c\u54ea\u6015\u5355\u4ef7\u4f4e\uff0c\u91cd\u5728\u5efa\u7acb\u201c\u6211\u80fd\u8d5a\u94b1\u201d\u7684\u4fe1\u5fc3\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5bf9\u4ed6\u5927\u8c08\u201c\u58f0\u97f3\u827a\u672f\u201d\u3001\u201c\u60c5\u6000\u68a6\u60f3\u201d\uff1b\u5e03\u7f6e\u8fc7\u4e8e\u590d\u6742\u3001\u8131\u79bb\u63a5\u5355\u573a\u666f\u7684\u4f5c\u4e1a\uff1b\u5728\u4ed6\u63d0\u95ee\u65f6\u53d1\u957f\u7bc7\u5927\u8bba\u7684\u6559\u7a0b\u94fe\u63a5\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u9996\u6b21\u63a5\u5355\u6210\u529f\u524d\u8fdb\u884c\u4efb\u4f55\u5347\u5355\u63a8\u4ecb**\u3002\u4ed6\u7684\u4fe1\u4efb\u5efa\u7acb\u5728\u201c\u89c1\u5230\u94b1\u201d\u4e4b\u540e\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c6-\u526f\u4e1a\u201d\n2. > \u5168\u7a0b\u4e92\u52a8\u4ec5\u4e3a\u201c\u597d\u201d\u3001\u201c\u55ef\u201d\u3001\u201c\u4e0b\u8f7d\u4e86\u201d\u7b49\u6781\u7b80\u5e94\u7b54\uff0c\u65e0\u4efb\u4f55\u5173\u4e8e\u5b66\u4e60\u5185\u5bb9\u3001\u4e2a\u4eba\u5174\u8da3\u7684\u4e3b\u52a8\u8868\u8fbe\u3002\n3. > \u9500\u552e\u591a\u6b21\u5f15\u5bfc\uff08\u95ee\u662f\u5426\u542c\u8bfe\u3001\u63d0\u9192\u76f4\u64ad\uff09\uff0c\u7528\u6237\u5747\u65e0\u53cd\u9988\uff0c\u4ec5\u5728\u6700\u540e\u652f\u4ed8\u73af\u8282\u548c\u9009\u4e66\u73af\u8282\u6709\u56de\u5e94\uff0c\u884c\u4e3a\u6a21\u5f0f\u9ad8\u5ea6\u6307\u5411\u201c\u7ed3\u679c\u5bfc\u5411\u201d\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4 \u641e\u94b1\u7ed3\u679c\u8bba\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u9700\u6c42\uff08\u7ecf\u6d4e\u4fdd\u969c\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5f00\u8bfe\u7b2c\u4e00\u5468\u5185\uff0c\u5fc5\u987b\u8ba9\u4ed6\u5b8c\u6210\u4e00\u6b21\u771f\u5b9e\u7684\u3001\u54ea\u6015\u5fae\u5c0f\u7684\u201c\u53d8\u73b0\u52a8\u4f5c\u201d\uff08\u5982\u901a\u8fc7\u4e00\u6b21\u8bd5\u97f3\u6216\u62ff\u5230\u4e00\u4e2a\u660e\u786e\u62a5\u4ef7\uff09\uff0c\u7528\u786e\u5b9a\u6027\u5bf9\u6297\u7126\u8651\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u8bba\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf+\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
