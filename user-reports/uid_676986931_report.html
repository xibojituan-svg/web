        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676986931 (\u6635\u79f0\uff1a\u7136\u7136/\u5189\u5189) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-11 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u4e03\u6708\u4f73\u97f3(\u5468\u5c0f\u797a) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u6500\u767b\u8ba1\u5212\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u63d0\u53ca\u201c\u62a5\u540d\u770b\u5230\u5206\u671f\u201d\uff0c\u4f46\u672a\u660e\u786e\u652f\u4ed8\u65b9\u5f0f\u4e0e\u8d44\u91d1\u6765\u6e90\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u591a\u6b21\u63d0\u53ca\u201c\u5e94\u4ed8\u8003\u8bd5\u201d\u3001\u201c\u6f14\u51fa\u4efb\u52a1\u6bd4\u8f83\u591a\u201d\u3001\u201c\u6700\u8fd1\u7279\u522b\u5fd9\u201d\uff0c\u5b66\u4e60\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\u4e14\u4e0d\u7a33\u5b9a\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u4e92\u52a8\u9891\u7e41\uff0c\u5b66\u4e60\u884c\u4e3a\u4e0e\u56f0\u60d1\u7ec6\u8282\u5145\u5206\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6280\u80fd\u5b66\u4e60\u7684\u5174\u8da3\u548c\u6295\u5165\uff0c\u4f46\u672a\u660e\u786e\u8868\u8fbe\u5f3a\u70c8\u7684\u53d8\u73b0\u8bc9\u6c42\u6216\u65f6\u95f4\u9884\u671f\u3002\u5176\u52a8\u673a\u66f4\u504f\u5411\u4e8e\u201c\u5b66\u4e60\u65b0\u6280\u80fd\u201d\u548c\u201c\u8ddf\u4e0a\u8bfe\u7a0b\u201d\uff0c\u800c\u975e\u201c\u5feb\u901f\u8d5a\u94b1\u201d\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08\uff0c\u8fd9\u6bb5\u65f6\u95f4\u786e\u5b9e\u592a\u5fd9\u4e86\uff0c\u5bf9\u4e0d\u8d77\uff0c\u8f9c\u8d1f\u4e86\u4f60\u4e00\u4e2a\u661f\u671f\u7684\u5e0c\u671b[\u73ab\u7470][\u73ab\u7470][\u73ab\u7470]\u201d (\u4f53\u73b0\u5bf9\u5b66\u4e60\u7684\u6127\u759a\u611f\uff0c\u800c\u975e\u5bf9\u672a\u8d5a\u94b1\u7684\u7126\u8651)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 \u5df2\u8d2d\u4e70\u8bfe\u7a0b\u53caMK4\u8bbe\u5907\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\uff0c\u4f46\u652f\u4ed8\u65b9\u5f0f\u4e0d\u660e\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4f4e] \u2014 **\u6838\u5fc3\u77ed\u677f**\u3002\u53cd\u590d\u5f3a\u8c03\u201c\u5e94\u4ed8\u8003\u8bd5\u201d\u3001\u201c\u6f14\u51fa\u4efb\u52a1\u91cd\u201d\u3001\u201c\u6700\u8fd1\u7279\u522b\u5fd9\u201d\uff0c\u5bfc\u81f4\u8bfe\u7a0b\u8ddf\u4e0d\u4e0a\u3001\u4f5c\u4e1a\u62d6\u5ef6\uff08\u201c\u5168\u73ed\u53ea\u6709\u4f60\u4e00\u4e2a\u4eba\u6ca1\u6709\u4ea4\u4f5c\u4e1a\u4e86\u201d\uff09\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u4e0d\u8db3] \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b07\u4f4e\u6781\u5371]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u9762\u5bf9\u6280\u672f\u64cd\u4f5c\uff08\u8fdb\u65e9\u529f\u3001\u4e0a\u4f20\u6587\u4ef6\u3001\u6253\u6807\u7b7e\u3001\u627e\u56de\u653e\uff09\u7b49\u5fae\u5c0f\u632b\u6298\u65f6\uff0c\u8868\u73b0\u51fa\u9ad8\u5ea6\u4f9d\u8d56\u548c\u9891\u7e41\u6c42\u52a9\uff0c\u7f3a\u4e4f\u72ec\u7acb\u89e3\u51b3\u95ee\u9898\u7684\u80fd\u529b\u548c\u8010\u5fc3\u3002\u60c5\u7eea\u4e0a\u6613\u4ea7\u751f\u201c\u843d\u961f\u201d\u7684\u7126\u8651\u548c\u81ea\u6211\u5426\u5b9a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u843d\u961f\u4e86\uff0c\u6709\u8c01\u6307\u70b9\u4e00\u4e0b[\u8c03\u76ae]\u201d > \u201c\u7535\u8111\u597d\u4e45\u6ca1\u6709\u7528\u4e86\uff0c\u4eca\u5929\u653e\u5047\uff0c\u6211\u5c31\u7684\u524d\u9762\u6ca1\u6709\u505a\u7684\u5de5\u4f5c\uff0c\u6709\u70b9\u61f5[\u6d41\u6cea]\u201d > \u201c\u8001\u5e08\uff0c\u4e0d\u8981\u4e22\u4e0b\u6211\u5440[\u5408\u5341]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34\u4e0e\u5f52\u5c5e\u611f** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u5ea6\u5bb3\u6015\u88ab\u7fa4\u4f53\u629b\u5f03\u7684\u5b64\u72ec\u611f\u548c\u843d\u540e\u4e8e\u4ed6\u4eba\u7684\u7126\u8651**\u3002\u7528\u6237\u7684\u6838\u5fc3\u75db\u70b9\u4e0d\u662f\u6280\u80fd\u672c\u8eab\uff0c\u800c\u662f\u5728\u5b66\u4e60\u793e\u7fa4\u4e2d\u201c\u6389\u961f\u201d\u5e26\u6765\u7684\u6050\u614c\u3002\u5979\u9700\u8981\u88ab\u770b\u89c1\u3001\u88ab\u63a5\u7eb3\u3001\u88ab\u624b\u628a\u624b\u5e26\u9886\uff0c\u4ee5\u786e\u8ba4\u81ea\u5df1\u5c5e\u4e8e\u8fd9\u4e2a\u96c6\u4f53\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u65e0\u6761\u4ef6\u7684\u63a5\u7eb3\u3001\u8010\u5fc3\u7684\u966a\u4f34\u548c\u201c\u4f60\u4e0d\u4f1a\u88ab\u4e22\u4e0b\u201d\u7684\u5b89\u5168\u627f\u8bfa**\u3002\u9700\u8981\u6301\u7eed\u7ed9\u4e88\u201c\u4f60\u5f88\u91cd\u8981\u201d\u3001\u201c\u6211\u4eec\u7b49\u4f60\u201d\u7684\u60c5\u7eea\u5b89\u629a\uff0c\u62b5\u6d88\u5176\u56e0\u5fd9\u788c\u843d\u8bfe\u800c\u4ea7\u751f\u7684\u81ea\u6211\u6000\u7591\u548c\u5b64\u7acb\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1 \u7c7b** (\u52a8\u673a\u5c1a\u53ef\u4f46\u8d44\u6e90/\u5fc3\u7406\u77ed\u677f\u660e\u663e\uff0c\u9700\u9ad8\u5f3a\u5ea6\u652f\u6301) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u5178\u578b\u7279\u5f81\uff1a\u6280\u672f\u64cd\u4f5c\u9891\u7e41\u5361\u58f3\u3001\u60c5\u7eea\u4f9d\u8d56\u5f3a\u3001\u5bb3\u6015\u88ab\u629b\u5f03\u3001\u9700\u8981\u6301\u7eed\u5b89\u629a) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5c5e\u5f3a\u70c8\u53cd\u5bf9\u8bc1\u636e\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u672a\u53d1\u73b0\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u56e0\u201c\u6f14\u51fa/\u8003\u8bd5\u201d\u7b49\u5ba2\u89c2\u5fd9\u788c\uff0c\u8bfe\u7a0b\u6301\u7eed\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u6c38\u8fdc\u8ddf\u4e0d\u4e0a\u201d\u7684\u7edd\u671b\u611f\uff0c\u6700\u7ec8\u56e0\u538b\u529b\u8fc7\u5927\u800c\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | **\u6700\u9ad8\u98ce\u9669**\u3002\u4efb\u4f55\u7a0d\u590d\u6742\u7684\u64cd\u4f5c\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u3001\u6587\u4ef6\u4e0a\u4f20\u3001\u4f5c\u4e1a\u63d0\u4ea4\uff09\u90fd\u53ef\u80fd\u6210\u4e3a\u538b\u57ae\u9a86\u9a7c\u7684\u6700\u540e\u4e00\u6839\u7a3b\u8349\uff0c\u5f15\u53d1\u201c\u6211\u592a\u7b28\u4e86\uff0c\u5b66\u4e0d\u4f1a\u201d\u7684\u5d29\u6e83\u6027\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u5f53\u524d\u804a\u5929\u672a\u805a\u7126\u53d8\u73b0\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468\uff08\u5373\u5f53\u524d\u9636\u6bb5\uff09**\u3002\u6b64\u65f6\u4f5c\u4e1a\u96be\u5ea6\u548c\u64cd\u4f5c\u590d\u6742\u5ea6\u589e\u52a0\uff0c\u7528\u6237\u56e0\u5fd9\u788c\u843d\u4e0b\u7684\u8bfe\u7a0b\u8d8a\u591a\uff0c\u632b\u8d25\u611f\u7d2f\u79ef\u8d8a\u5feb\uff0c\u6781\u6613\u5728\u67d0\u4e2a\u5177\u4f53\u64cd\u4f5c\u5361\u58f3\u65f6\uff08\u5982\u201c\u5f55\u97f3\u6587\u4ef6\u4f20\u4e0d\u4e0a\u53bb\u201d\uff09\u7a81\u7136\u7206\u53d1\u9000\u8d39\u60c5\u7eea\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> **\u201c\u7136\u7136\uff0c\u770b\u5230\u4f60\u8bf4\u6700\u8fd1\u7279\u522b\u5fd9\uff0c\u771f\u7684\u8f9b\u82e6\u4e86\u3002\u522b\u62c5\u5fc3\u2018\u843d\u961f\u2019\uff0c\u54b1\u4eec\u8fd9\u4e2a\u73ed\u6ca1\u6709\u6dd8\u6c70\u5236\uff0c\u4f60\u7684\u4f4d\u7f6e\u6c38\u8fdc\u5728\u8fd9\u91cc\u3002\u5fd9\u7684\u65f6\u5019\u5148\u987e\u597d\u751f\u6d3b\uff0c\u6709\u7a7a\u4e86\u968f\u65f6\u56de\u6765\uff0c\u73ed\u73ed\u548c\u540c\u5b66\u4eec\u90fd\u4f1a\u7b49\u4f60\uff0c\u4e00\u6b65\u4e00\u6b65\u5e26\u4f60\u8ddf\u4e0a\u3002\u4f60\u6c38\u8fdc\u4e0d\u662f\u4e00\u4e2a\u4eba\u3002\u201d**\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf**\u3011\u3002\u6838\u5fc3\u76ee\u6807\u662f\u7ef4\u6301\u5176\u5b66\u4e60\u4fe1\u5fc3\u548c\u793e\u7fa4\u5f52\u5c5e\u611f\uff0c\u800c\u975e\u6280\u80fd\u786c\u6838\u7a81\u7834\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u6ee1\u914d **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u5305\u62ec\uff1a1\uff09\u64cd\u4f5c\u6b65\u9aa4\u7684\u6781\u7b80\u5316\u56fe\u6587/\u89c6\u9891\u6307\u5f15\uff08\u4e00\u6b65\u4e00\u56fe\uff09\uff1b2\uff09\u5b9a\u671f\u79c1\u4fe1\u5173\u6000\uff0c\u4e0d\u95ee\u8fdb\u5ea6\u53ea\u95ee\u72b6\u6001\uff1b3\uff09\u5bf9\u5176\u4efb\u4f55\u5fae\u5c0f\u5b8c\u6210\uff08\u5982\u6210\u529f\u63d0\u4ea4\u4e00\u6b21\u4f5c\u4e1a\uff09\u8fdb\u884c\u5938\u5f20\u8868\u626c\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u5176\u4f7f\u7528\u201c\u5168\u73ed\u53ea\u6709\u4f60\u6ca1\u4ea4\u201d\u7b49\u5bf9\u6bd4\u65bd\u538b\u8bdd\u672f**\uff0c\u8fd9\u4f1a\u76f4\u63a5\u51fb\u7a7f\u5176\u5fc3\u7406\u9632\u7ebf\u3002\n    2. **\u7edd\u4e0d\u7ed9\u5176\u5b89\u6392\u9700\u8981\u72ec\u7acb\u94bb\u7814\u7684\u590d\u6742\u4efb\u52a1\u6216\u9ad8\u96be\u5ea6\u4f5c\u4e1a**\u3002\n    3. **\u7edd\u4e0d\u5728\u5176\u62b1\u6028\u201c\u5fd9\u201d\u548c\u201c\u61f5\u201d\u65f6\u8bb2\u5927\u9053\u7406\u6216\u5f3a\u8c03\u8bfe\u7a0b\u4ef7\u503c**\uff0c\u53ea\u9700\u5171\u60c5\u548c\u63d0\u4f9b\u7b80\u5316\u65b9\u6848\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u5f53\u524d\u5fc3\u7406\u5f39\u6027\u548c\u65f6\u95f4\u8d44\u6e90\u53cc\u4f4e\u7684\u60c5\u51b5\u4e0b\uff0c\u4efb\u4f55\u5347\u5355\u5c1d\u8bd5\u90fd\u4f1a\u88ab\u89c6\u4e3a\u5de8\u5927\u538b\u529b\u6e90\uff0c\u6781\u6613\u5bfc\u81f4\u5d29\u76d8\u9000\u8d39\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u843d\u961f\u4e86\uff0c\u6709\u8c01\u6307\u70b9\u4e00\u4e0b[\u8c03\u76ae]\u201d\n2. > \u201c\u7535\u8111\u597d\u4e45\u6ca1\u6709\u7528\u4e86\uff0c\u4eca\u5929\u653e\u5047\uff0c\u6211\u5c31\u7684\u524d\u9762\u6ca1\u6709\u505a\u7684\u5de5\u4f5c\uff0c\u6709\u70b9\u61f5[\u6d41\u6cea]\u201d\n3. > \u201c\u8001\u5e08\uff0c\u4e0d\u8981\u4e22\u4e0b\u6211\u5440[\u5408\u5341]\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u793e\u7fa4\u5f52\u5c5e\u4e0e\u4e0d\u88ab\u629b\u5f03\u7684\u5b89\u5168\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u50bb\u74dc\u5f0f\u64cd\u4f5c\u6307\u5f15 + \u9ad8\u9891\u60c5\u7eea\u5b89\u629a\uff0c\u4e25\u7981\u4efb\u4f55\u5f62\u5f0f\u7684\u65bd\u538b\u548c\u5bf9\u6bd4\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"maslow_need\": \"\u793e\u4ea4\u9700\u6c42\", \"risk_level\": \"\u6781\u9ad8\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
