        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 163510133 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-11 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u4e03\u6708\u4f73\u97f3(\u5468\u5c0f\u797a) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u63a8\u6d4b\u4e3a\u201c\u6500\u767b\u8ba1\u5212\u201d\uff09\uff0c\u610f\u5411\u526a\u8f91\u8bfe |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u91d1\u989d\u6216\u7ecf\u6d4e\u538b\u529b\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u4e3a\u4f4f\u5bb6\u62a4\u5de5/\u4fdd\u59c6\uff08\u201c\u5728\u96c7\u4e3b\u5bb6\u201d\uff09\uff0c\u4e00\u5468\u4ec5\u4f11\u4e24\u5929\uff0c\u5de5\u4f5c\u671f\u95f4\u65e0\u6cd5\u4f7f\u7528\u5f55\u97f3\u8bbe\u5907\uff0c\u4f46\u53ef\u5229\u7528\u5de5\u4f5c\u95f4\u9699\u8fdb\u884c\u526a\u8f91\u5b66\u4e60\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u5df2\u62a5\u5907\u5e76\u652f\u6301**\u3002\u5973\u513f\uff08\u201c\u59d1\u5a18\u201d\uff09\u5728\u534f\u52a9\u5176\u89e3\u51b3\u7535\u8111\u95ee\u9898\uff0c\u8868\u660e\u5bb6\u4eba\u77e5\u60c5\u5e76\u652f\u6301\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u804a\u5929\u8bb0\u5f55\u8be6\u7ec6\uff0c\u5c55\u73b0\u4e86\u7528\u6237\u7684\u5b66\u4e60\u884c\u4e3a\u3001\u4e92\u52a8\u6a21\u5f0f\u3001\u65f6\u95f4\u9650\u5236\u548c\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u5b66\u4e60\u5174\u8da3\u548c\u7cbe\u8fdb\u6280\u80fd\u7684\u610f\u613f\uff0c\u4e3b\u52a8\u8865\u8bfe\u3001\u79ef\u6781\u4e92\u52a8\u3001\u4e50\u4e8e\u52a9\u4eba\u3002\u867d\u63d0\u53ca\u201c\u60f3\u5b66\u526a\u8f91\u201d\u53ef\u80fd\u9690\u542b\u53d8\u73b0\u76ee\u7684\uff0c\u4f46\u5f53\u524d\u4e3b\u5bfc\u52a8\u673a\u662f**\u80fd\u529b\u63d0\u5347\u548c\u793e\u7fa4\u5f52\u5c5e**\uff0c\u800c\u975e\u77ed\u671f\u66b4\u5bcc\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6536\u542c\u4e86\u60a8\u7684\u6765\u4fe1\u8ba9\u6211\u8fd9\u4e00\u5929\u4e2d\u53c8\u5982\u540c\u6253\u4e86\u9e21\u8840\uff0c\u5174\u594b\u7684\u4e0d\u5f97\u4e86...\u8ba9\u6211\u8fd9\u4e2a\u5feb\u5373\u5c06\u8fdb\u5165\u8001\u5e74\u7684\u90a3\u4e2a\u5b66\u5b66\u751f\uff0c\u55ef\uff0c\u53c8\u71c3\u8d77\u4e86\u4e00\u4e2a\u5c31\u662f\u5b66\u4e60\u7684\u90a3\u4e2a\u5b66\u4e60\u4e4b\u706b\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 \u6709\u80fd\u529b\u8d2d\u4e70\u8bfe\u7a0b\uff0c\u5e76\u8ba1\u5212/\u5df2\u8d2d\u4e70\u7535\u8111\u8bbe\u5907\u3002\u672a\u8868\u73b0\u51fa\u7ecf\u6d4e\u62ee\u636e\uff0c\u4f46\u9700\u5973\u513f\u534f\u52a9\u8d2d\u4e70\u7535\u8111\uff0c\u53ef\u80fd\u7ecf\u6d4e\u5e76\u975e\u5341\u5206\u5bbd\u88d5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4f4e] \u2014 **\u6838\u5fc3\u77ed\u677f**\u3002\u4f5c\u4e3a\u4f4f\u5bb6\u62a4\u5de5\uff0c\u4e00\u5468\u4ec5\u4f11\u4e24\u5929\uff0c\u5de5\u4f5c\u671f\u95f4\u73af\u5883\u53d7\u9650\uff08\u201c\u4e0d\u65b9\u4fbf\u7528\u58f0\u5361\u548c\u9ea6\u201d\uff09\uff0c\u5b66\u4e60\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\u4e14\u56fa\u5b9a\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u9ad8] \u2014 \u5973\u513f\u79ef\u6781\u534f\u52a9\u89e3\u51b3\u6280\u672f\u95ee\u9898\uff08\u7535\u8111\u914d\u7f6e\uff09\uff0c\u5bb6\u5ead\u652f\u6301\u7f51\u7edc\u7a33\u56fa\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u7535\u8111\u914d\u7f6e\u4f4e\u3001\u559c\u9a6c\u62c9\u96c5\u8d26\u53f7\u6df7\u4e71\uff09\u4e3b\u52a8\u3001\u8010\u5fc3\u3001\u6709\u6761\u7406\u5730\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u65e0\u62b1\u6028\u3002\u5728\u793e\u7fa4\u4e2d\u4e50\u4e8e\u52a9\u4eba\uff0c\u5fc3\u6001\u79ef\u6781\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u7684\u73b0\u5728\u5df2\u7ecf\u8fd9\u6837\u4e86\uff0c\u8fd8\u80fd\u6539\u5230\u54b1\u4eec\u7684\u6b63\u8f68\u4e0a\u6765\u5417\uff1f...\u8c22\u8c22\u73ed\u73ed\uff0c\u6211\u4ee5\u4e3a\u8fd9\u4e2a\u8d26\u53f7\u8981\u5e9f\u6389\u4e86\u5462[\u6342\u8138]\u4ee5\u524d\u4e0d\u4f1a\u5f04\uff0c\u5c31\u4e71\u5f04\u7684\u201d (\u9762\u5bf9\u95ee\u9898\uff0c\u5e7d\u9ed8\u5316\u89e3\uff0c\u79ef\u6781\u6c42\u89e3)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42** \u4e0e **\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e2d\u5e74/\u51c6\u8001\u5e74\u9636\u6bb5\u7684\u4ef7\u503c\u611f\u7f3a\u5931\u4e0e\u793e\u4ea4\u9694\u79bb**\u3002\u4f5c\u4e3a\u4f4f\u5bb6\u62a4\u5de5\uff0c\u5de5\u4f5c\u73af\u5883\u5c01\u95ed\uff0c\u793e\u4ea4\u5708\u72ed\u7a84\u3002\u5b66\u4e60\u6709\u58f0\u6f14\u64ad\u662f\u5176\u91cd\u5efa\u793e\u4f1a\u8fde\u63a5\u3001\u83b7\u5f97\u540c\u9f84\u4eba\u8ba4\u53ef\u3001\u8bc1\u660e\u81ea\u8eab\u4ef7\u503c\uff08\u201c\u5feb\u5373\u5c06\u8fdb\u5165\u8001\u5e74\u7684\u5b66\u751f\u201d\uff09\u7684\u91cd\u8981\u9014\u5f84\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u793e\u7fa4\u5f52\u5c5e\u611f\u4e0e\u4e13\u4e1a\u4e0a\u7684\u5c0a\u91cd\u8ba4\u53ef**\u3002\u4ed6\u9700\u8981\u5728\u4e00\u4e2a\u6709\u5171\u540c\u76ee\u6807\u7684\u96c6\u4f53\u4e2d\u88ab\u770b\u89c1\u3001\u88ab\u9700\u8981\uff08\u5982\u70b9\u8bc4\u4ed6\u4eba\uff09\uff0c\u5e76\u901a\u8fc7\u638c\u63e1\u4e13\u4e1a\u6280\u80fd\u83b7\u5f97\u81ea\u6211\u80af\u5b9a\u548c\u4ed6\u4eba\u5c0a\u91cd\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u52a8\u673a\u4e2d\u7b49\uff0c\u8d44\u6e90\u6709\u77ed\u677f\u4f46\u5bb6\u5ead\u652f\u6301\u5f3a\uff0c\u5fc3\u7406\u5f39\u6027\u9ad8) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u6838\u5fc3\u7279\u5f81\uff1a\u4e0d\u5f20\u626c\uff0c\u9ed8\u9ed8\u52aa\u529b\uff0c\u79ef\u6781\u53c2\u4e0e\u793e\u7fa4\u4e92\u52a9\uff0c\u8ffd\u6c42\u786c\u6838\u6280\u80fd\u7684\u7cbe\u8fdb\u4e0e\u80af\u5b9a) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5ead\u53cd\u5bf9\u8ff9\u8c61\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u5bb6\u4eba\u652f\u6301\u5ea6\u9ad8\uff0c\u98ce\u9669\u4f4e\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u4e2d** | **\u6838\u5fc3\u98ce\u9669**\u3002\u56e0\u5de5\u4f5c\u6027\u8d28\uff08\u62a4\u5de5\uff09\u5bfc\u81f4\u65f6\u95f4\u6781\u5ea6\u4e0d\u81ea\u7531\uff0c\u65e0\u6cd5\u8ddf\u4e0a\u76f4\u64ad\u8bfe\u6216\u96c6\u4e2d\u5f55\u97f3\u3002\u82e5\u8bfe\u7a0b\u8282\u594f\u4e0e\u4ed6\u7684\u201c\u4e24\u5929\u4f11\u606f\u201d\u6a21\u5f0f\u4e25\u91cd\u51b2\u7a81\uff0c\u53ef\u80fd\u56e0\u79ef\u538b\u4f5c\u4e1a\u4ea7\u751f\u7126\u8651\uff0c\u6700\u7ec8\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u632b\u6298\u7834\u9632\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u5f53\u524d\u52a8\u673a\u4ee5\u5b66\u4e60\u548c\u793e\u4ea4\u4e3a\u4e3b\uff0c\u5bf9\u77ed\u671f\u53d8\u73b0\u671f\u671b\u4e0d\u9ad8\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u8bfe\u7a0b\u8fdb\u5165\u4e2d\u540e\u671f\uff08\u7ea6\u7b2c4-6\u5468\uff09**\u3002\u5f53\u4f5c\u4e1a\u96be\u5ea6\u548c\u91cf\u7ea7\u63d0\u5347\uff0c\u9700\u8981\u66f4\u591a\u6574\u5757\u65f6\u95f4\u8fdb\u884c\u5f55\u97f3\u548c\u590d\u6742\u540e\u671f\u65f6\uff0c\u5176\u201c\u4e24\u5929\u96c6\u4e2d\u5236\u201d\u7684\u5b66\u4e60\u6a21\u5f0f\u53ef\u80fd\u5d29\u6e83\uff0c\u4ea7\u751f\u5f3a\u70c8\u7684\u632b\u8d25\u611f\u548c\u65e0\u529b\u611f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cXX\u59d0/\u54e5\uff0c\u770b\u5230\u60a8\u7279\u522b\u70ed\u5fc3\u5730\u5728\u7fa4\u91cc\u5e2e\u52a9\u540c\u5b66\uff0c\u70b9\u8bc4\u4e5f\u5f88\u4e13\u4e1a\uff0c\u771f\u662f\u54b1\u4eec\u73ed\u7684\u5b9d\u85cf\u5b66\u5458\uff01\u6211\u77e5\u9053\u60a8\u5de5\u4f5c\u7279\u6b8a\uff0c\u65f6\u95f4\u6bd4\u8f83\u5b9d\u8d35\u3002\u522b\u62c5\u5fc3\uff0c\u54b1\u4eec\u8bfe\u7a0b\u6240\u6709\u5185\u5bb9\u90fd\u6709\u56de\u653e\uff0c\u4f5c\u4e1a\u63d0\u4ea4\u4e5f\u6709\u7075\u6d3b\u5468\u671f\u3002\u60a8\u5c31\u6309\u7167\u81ea\u5df1\u7684\u8282\u594f\uff0c\u5229\u7528\u597d\u4f11\u606f\u65e5\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u7a33\u7a33\u5730\u5b66\u3002\u6709\u4efb\u4f55\u65f6\u95f4\u5b89\u6392\u4e0a\u7684\u56f0\u96be\uff0c\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4e00\u8d77\u60f3\u529e\u6cd5\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u3002\u5339\u914d\u5176T2\u539f\u578b\uff0c\u63d0\u4f9b\u624e\u5b9e\u7684\u6280\u80fd\u8bad\u7ec3\u548c\u660e\u786e\u7684\u8fdb\u9636\u8def\u5f84\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u77ed\u677f\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010**\u65f6\u95f4\u5f39\u6027\u9002\u914d\u5305**\u3011\uff08\u5982\uff1a\u5ef6\u957f\u4f5c\u4e1a\u63d0\u4ea4\u7a97\u53e3\u3001\u63d0\u4f9b\u788e\u7247\u5316\u5b66\u4e60\u6307\u5357\u3001\u91cd\u70b9\u76f4\u64ad\u8bfe\u5355\u72ec\u63d0\u9192\u5e76\u5f3a\u8c03\u56de\u653e\u4ef7\u503c\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u6240\u6709\u4eba\u90fd\u5fc5\u987b\u8ddf\u4e0a\u76f4\u64ad\u201d\u7684\u96c6\u4f53\u538b\u529b\u65bd\u538b\u3002\u4e0d\u8981\u56e0\u5176\u5076\u5c14\u9519\u8fc7\u76f4\u64ad\u6216\u63d0\u4ea4\u7a0d\u665a\u800c\u6279\u8bc4\uff0c\u907f\u514d\u89e6\u53d1\u5176\u201c\u6389\u961f\u201d\u7126\u8651\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u57fa\u4e8e\u5176\u5b66\u4e60\u70ed\u60c5\u548c\u638c\u63e1\u7a0b\u5ea6\uff0c\u5728\u8bfe\u7a0b\u4e2d\u540e\u671f\u63a8\u8350**\u526a\u8f91\u8bfe**\u7b49\u6280\u80fd\u5ef6\u4f38\u8bfe\u7a0b\uff0c\u4f46\u9700\u660e\u786e\u544a\u77e5\u8bfe\u7a0b\u65f6\u95f4\u8981\u6c42\uff0c\u786e\u4fdd\u5176\u80fd\u534f\u8c03\u3002\u4e25\u7981\u63a8\u8350\u9700\u8981\u5927\u91cf\u5b9e\u65f6\u5728\u7ebf\u6216\u9ad8\u5f3a\u5ea6\u627f\u8bfa\u7684\u9ad8\u9636\u4ea7\u54c1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u4e00\u5468\u4f11\u4e24\u5929\uff0c\u7528\u8bbe\u5907\u5f55\u97f3\u5c31\u5f97\u5c31\u5f97\u96c6\u4e2d\u5728\u8fd9\u4e24\u5929\u5f55\u3002\u526a\u8f91\u65f6\u7528\u4e0d\u4e0a\u58f0\u5361\u548c\u9ea6\uff0c\u6211\u5c31\u4e0d\u7528\u5e26\u7740\u8bbe\u5907\uff0c\u5de5\u4f5c\u7a7a\u95f2\u65f6\u4e5f\u80fd\u7528\u7535\u8111\u526a\u8f91\uff0c\u8fd9\u6837\u5c31\u4e0d\u803d\u8bef\u4e8b\u3002\u56e0\u4e3a\u5728\u96c7\u4e3b\u5bb6\u4e5f\u4e0d\u65b9\u4fbf\u5e26\u7740\u8bbe\u5907\u3002\u201d **(\u8d44\u6e90\u5e95\u5ea7\u6838\u5fc3\u77ed\u677f\uff1a\u65f6\u95f4\u9ad8\u5ea6\u53d7\u9650)**\n2. > \u201c\u6536\u542c\u4e86\u60a8\u7684\u6765\u4fe1\u8ba9\u6211\u8fd9\u4e00\u5929\u4e2d\u53c8\u5982\u540c\u6253\u4e86\u9e21\u8840\uff0c\u5174\u594b\u7684\u4e0d\u5f97\u4e86...\u8ba9\u6211\u8fd9\u4e2a\u5feb\u5373\u5c06\u8fdb\u5165\u8001\u5e74\u7684\u90a3\u4e2a\u5b66\u5b66\u751f\uff0c\u55ef\uff0c\u53c8\u71c3\u8d77\u4e86\u4e00\u4e2a\u5c31\u662f\u5b66\u4e60\u7684\u90a3\u4e2a\u5b66\u4e60\u4e4b\u706b\u3002\u201d **(\u9ad8\u5fc3\u7406\u5f39\u6027\u4e0e\u6df1\u5c42\u793e\u4ea4/\u5c0a\u91cd\u9700\u6c42)**\n3. > \u201c@\u9189\u6795\u6668\u66e6-\u6cb3\u5357-\u7537\u64ad \u8bfb\u7684\u771f\u597d\uff0c\u5410\u5b57\u6e05\u6670[\u5f3a][\u5f3a][\u5f3a]\u6211\u542c\u5230\u4f60\u7684\u809a\u5b50\u5728\u558a\u2018\u6211\u997f\u4e86\uff0c\u8981\u5403\u996d\u2019[\u5472\u7259]\u201d **(\u79ef\u6781\u793e\u7fa4\u4e92\u52a8\uff0cT2\u4f4e\u8c03\u5b9e\u5e72\u578b\u5178\u578b\u884c\u4e3a)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u5728\u793e\u7fa4\u4e2d\u83b7\u5f97\u5c0a\u91cd\u4e0e\u4ef7\u503c\u91cd\u71c3**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u4e3a\u5176\u91cf\u8eab\u5b9a\u5236\u201c\u65f6\u95f4\u5f39\u6027\u5b66\u4e60\u65b9\u6848\u201d\uff0c\u7edd\u4e0d\u7528\u7edf\u4e00\u8282\u594f\u65bd\u538b\uff0c\u5e76\u6301\u7eed\u7ed9\u4e88\u5176\u201c\u6280\u672f\u9aa8\u5e72\u201d\u822c\u7684\u793e\u7fa4\u8ba4\u53ef**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u793e\u4ea4\u4e0e\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u65f6\u95f4\u5f39\u6027\u9002\u914d\u5305\"}\n```";
