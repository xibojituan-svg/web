    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v3.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u63d0\u4f9b\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u6c34\u58a8\u68ee\u6cfd / \u90b1\u7fe0\u4eea (UID: 676958792) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-03 \u81f3 2026-03-23 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u4e66\u4e2d\u8ff7(\u5434\u534e)\u3001\u6c90\u6a59(\u6a0a\u7855) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad/\u914d\u97f3\u8bfe\u7a0b (\u7cbe\u82f19\u671f) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u4ef7\u683c\u3001\u8d44\u91d1\u6765\u6e90\u7b49\u5173\u952e\u4fe1\u606f\uff0c\u65e0\u6cd5\u5224\u65ad\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u4e3a\u5b9d\u5988\uff08\u63d0\u53ca\u4e24\u4e2a\u5973\u513f\uff09\uff0c\u5b66\u4e60\u6d3b\u52a8\u7a7f\u63d2\u4e8e\u80b2\u513f\u4e0e\u5bb6\u52a1\u4e2d\uff0c\u4f46\u8868\u73b0\u51fa\u6781\u5f3a\u7684\u89c4\u5212\u4e0e\u6267\u884c\u80fd\u529b\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u5df2\u62a5\u5907\u5e76\u652f\u6301**\u3002\u660e\u786e\u63d0\u53ca\u8001\u516c\u5e2e\u5fd9\u642d\u7537\u58f0\uff0c\u5973\u513f\u53c2\u4e0e\u5f55\u97f3\uff0c\u5bb6\u5ead\u6c1b\u56f4\u652f\u6301\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u8bb0\u5f55\u8be6\u5c3d\uff0c\u5c55\u73b0\u4e86\u7528\u6237\u7684\u5b66\u4e60\u884c\u4e3a\u3001\u4e92\u52a8\u3001\u6280\u672f\u63a2\u7d22\u4e0e\u5bb6\u5ead\u80cc\u666f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06**\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u5b66\u4e60\u884c\u4e3a\u7eaf\u7cb9\uff0c\u5173\u6ce8\u6280\u80fd\u7cbe\u8fdb\u4e0e\u81ea\u6211\u8868\u8fbe\uff0c\u65e0\u4efb\u4f55\u77ed\u671f\u53d8\u73b0\u538b\u529b\u4fe1\u53f7\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n    > \u201c\u5e08\u54e5\u7ed9\u6211\u5efa\u8bae\u4e86...\u6539\u4e86\u4e0b\u201d\uff08\u79ef\u6781\u63a5\u53d7\u53cd\u9988\u5e76\u8fed\u4ee3\uff09\n    > \u201c\u6211\u5f55\u4e86\u7b2c8\u904d\u624d\u6ee1\u610f\u201d\uff08\u8ffd\u6c42\u5b8c\u7f8e\uff0c\u81ea\u6211\u8981\u6c42\u9ad8\uff09\n    > \u201c\u5e74\u5c11\u65f6\u559c\u6b22\u5199\u6563\u6587\uff0c\u5c0f\u8bf4\uff0c\u73b0\u5728\u559c\u6b22\u5199\u5199\u8bd7\u8bcd\u201d\uff08\u5185\u5728\u521b\u4f5c\u4e0e\u8868\u8fbe\u9a71\u52a8\uff09\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b06**\u9ad8**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u7ecf\u6d4e\u538b\u529b\u3001\u652f\u4ed8\u56f0\u96be\u6216\u501f\u8d37\u8bcd\u6c47\u3002\u80fd\u4e3b\u52a8\u8003\u8651\u8d2d\u4e70\u4e13\u4e1a\u8bbe\u5907\uff08\u867d\u88ab\u529d\u963b\uff09\uff0c\u6697\u793a\u6709\u4e00\u5b9a\u7ecf\u6d4e\u57fa\u7840\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u7528\u6237\u4e3a\u5b9d\u5988\uff0c\u65f6\u95f4\u5448\u788e\u7247\u5316\uff08\u201c\u6b63\u662f\u5175\u8352\u9a6c\u4e71\u7684\u5e74\u7eaa\u201d\uff09\u3002\u4f46**\u7cbe\u529b\u7ef4\u5ea6\u6781\u9ad8**\uff1a\u80fd\u6df1\u591c\u5b66\u4e60\u3001\u4e3b\u52a8\u642d\u5efa\u5f55\u97f3\u68da\u3001\u8be6\u7ec6\u505a\u7b14\u8bb0\u3001\u53cd\u590d\u6253\u78e8\u4f5c\u54c1\uff0c\u5c55\u73b0\u51fa\u6781\u5f3a\u7684\u5b66\u4e60\u5185\u9a71\u529b\u548c\u6267\u884c\u529b\u3002**\u53d6\u77ed\u677f\u201c\u65f6\u95f4\u201d\u4e3a\u4e2d\u3002**\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u9ad8** \u2014 \u8001\u516c\u534f\u52a9\u642d\u7537\u58f0\uff0c\u5973\u513f\u53c2\u4e0e\u5f55\u97f3\u5e76\u4ee5\u6b64\u4e3a\u4eb2\u5b50\u6d3b\u52a8\uff0c\u5bb6\u5ead\u73af\u5883\u9ad8\u5ea6\u652f\u6301\u3002\n- **\u5e95\u5ea7\u53d6\u77ed\u677f**\uff1a**\u4e2d** (\u65f6\u95f4\u7ef4\u5ea6\u4e3a\u77ed\u677f)\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06**\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08AU\u5b89\u88c5\u3001\u8bbe\u5907\u8c03\u8bd5\u3001\u5f55\u97f3\u68da\u642d\u5efa\uff09\u4e3b\u52a8\u7814\u7a76\u3001\u5c1d\u8bd5\u89e3\u51b3\uff0c\u5e76\u4e50\u4e8e\u5206\u4eab\u7ecf\u9a8c\u5e2e\u52a9\u540c\u5b66\u3002\u60c5\u7eea\u7a33\u5b9a\uff0c\u79ef\u6781\u6b63\u5411\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n    > \u201c\u6e05\u7406\u5b8c\u7a7a\u51fa\u5feb7\u4e2aG\u5566\uff0c\u6e05\u723d[\u5472\u7259]\u201d\uff08\u9762\u5bf9\u95ee\u9898\u79ef\u6781\u89e3\u51b3\uff0c\u5fc3\u6001\u4e50\u89c2\uff09\n    > \u201c\u53ef\u4ee5\u767e\u5ea6\u4e0b\uff1aau\u600e\u4e48\u5bfc\u51famp3\u683c\u5f0f\uff1f\u201d\uff08\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\u5e76\u6307\u5bfc\u4ed6\u4eba\uff09\n    > \u201c\u6728\u5f97\u611f\u60c5\u4e5f\u4e0d\u884c\uff0c\u592a\u5f3a\u4e5f\u4e0d\u884c\uff0c\u96be\u5c31\u96be\u5728\u8fd9[\u61a8\u7b11]\u201d\uff08\u7406\u6027\u5206\u6790\u5b66\u4e60\u96be\u70b9\uff0c\u5fc3\u6001\u5e73\u548c\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9**\u81ea\u6211\u8868\u8fbe\u4e0e\u521b\u9020\u529b\u5b9e\u73b0**\u7684\u6df1\u5c42\u6e34\u671b\u3002\u5979\u5e76\u975e\u56e0\u7ecf\u6d4e\u7126\u8651\u800c\u6765\uff0c\u800c\u662f\u6e90\u4e8e\u65e9\u5e74\u5bf9\u6587\u5b66\u521b\u4f5c\uff08\u6563\u6587\u3001\u5c0f\u8bf4\u3001\u8bd7\u8bcd\uff09\u7684\u70ed\u7231\uff0c\u5e0c\u671b\u5c06\u58f0\u97f3\u4f5c\u4e3a\u65b0\u7684\u827a\u672f\u8868\u8fbe\u5a92\u4ecb\uff0c\u5b9e\u73b0\u672a\u7adf\u7684\u521b\u4f5c\u68a6\u60f3\uff0c\u5e76\u5728\u6b64\u8fc7\u7a0b\u4e2d\u83b7\u5f97\u7cbe\u8fdb\u4e0e\u6210\u957f\u7684\u6ee1\u8db3\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u6df1\u5ea6\u8ba4\u53ef\u4e0e\u521b\u4f5c\u4e0a\u7684\u5171\u9e23**\u3002\u5979\u9700\u8981\u88ab\u770b\u89c1\u5728\u6280\u672f\u7ec6\u8282\u4e0a\u7684\u94bb\u7814\uff08\u5982\u5f55\u97f3\u68da\u642d\u5efa\u3001\u58f0\u97f3\u6ce2\u5f62\u8c03\u6574\uff09\uff0c\u4ee5\u53ca\u5bf9\u5979\u6587\u5b66\u7d20\u517b\u548c\u521b\u4f5c\u6f5c\u529b\u7684\u6b23\u8d4f\u3002\u63d0\u4f9b\u8fdb\u9636\u7684\u521b\u4f5c\u6307\u5bfc\u3001\u4e0e\u5fd7\u540c\u9053\u5408\u8005\u4ea4\u6d41\u7684\u5e73\u53f0\uff0c\u6ee1\u8db3\u5176\u201c\u827a\u672f\u5bb6\u201d\u8eab\u4efd\u8ba4\u540c\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \u2b50 **A\u7c7b (\u4ef7\u503c\u5171\u521b\u578b)** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T3 \u6b7b\u78d5\u5b66\u9738\u578b** (\u517c\u987e **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** \u7279\u8d28) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 **\u5b89\u5168\u672a\u89e6\u53d1**\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u4efb\u4f55D\u7c7b\u7194\u65ad\u4fe1\u53f7\uff08\u65e0\u7ecf\u6d4e\u5371\u673a\u3001\u5bb6\u5ead\u53cd\u5bf9\u3001\u5065\u5eb7\u95ee\u9898\u3001\u65f6\u95f4\u7edd\u5bf9\u7834\u4ea7\u7b49\uff09\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u6781\u4f4e** | \u5bb6\u5ead\u9ad8\u5ea6\u652f\u6301\uff0c\u65e0\u98ce\u9669\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u65f6\u95f4\u867d\u788e\u7247\u5316\uff0c\u4f46\u7528\u6237\u81ea\u5f8b\u6027\u4e0e\u89c4\u5212\u80fd\u529b\u6781\u5f3a\uff0c\u80fd\u9ad8\u6548\u5229\u7528\u65f6\u95f4\u3002\u98ce\u9669\u5728\u4e8e\u957f\u671f\u9ad8\u8d1f\u8377\u53ef\u80fd\u5bfc\u81f4\u75b2\u60eb\uff0c\u9700\u5173\u6ce8\u5176\u53ef\u6301\u7eed\u6027\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u89e3\u51b3\u95ee\u9898\u5bfc\u5411\uff0c\u6297\u538b\u80fd\u529b\u5f3a\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u6781\u4f4e** | \u52a8\u673a\u7eaf\u7cb9\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\uff0c\u65e0\u77ed\u671f\u53d8\u73b0\u9884\u671f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u65e0\u660e\u663e\u98ce\u9669\u65f6\u95f4\u7a97**\u3002\u6f5c\u5728\u98ce\u9669\u70b9\u5728\u4e8e\u8bfe\u7a0b\u540e\u671f\u82e5\u5185\u5bb9\u6df1\u5ea6\u4e0d\u8db3\u3001\u7f3a\u4e4f\u6311\u6218\u6027\u6216\u53cd\u9988\u4e0d\u591f\u4e13\u4e1a\uff0c\u53ef\u80fd\u65e0\u6cd5\u6ee1\u8db3\u5176\u9ad8\u9636\u6c42\u77e5\u6b32\uff0c\u5bfc\u81f4\u5174\u8da3\u8870\u51cf\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u7fe0\u4eea\uff0c\u770b\u4e86\u4f60\u7684\u7b14\u8bb0\u548c\u5f55\u97f3\uff0c\u80fd\u611f\u53d7\u5230\u4f60\u5bf9\u58f0\u97f3\u827a\u672f\u7684\u8ba4\u771f\u548c\u70ed\u7231\uff0c\u8fd9\u975e\u5e38\u96be\u5f97\u3002\u54b1\u4eec\u8fd9\u4e2a\u73ed\u91cc\u6709\u4f60\u8fd9\u6837\u65e2\u6709\u6587\u5b66\u5e95\u8574\u53c8\u80af\u94bb\u7814\u6280\u672f\u7684\u540c\u5b66\uff0c\u662f\u6574\u4e2a\u73ed\u7ea7\u7684\u5e78\u8fd0\u3002\u63a5\u4e0b\u6765\u7684\u5b66\u4e60\uff0c\u6211\u4f1a\u91cd\u70b9\u5173\u6ce8\u4f60\u5728\u6587\u672c\u7406\u89e3\u548c\u58f0\u97f3\u5851\u9020\u4e0a\u7684\u6df1\u5ea6\u9700\u6c42\uff0c\u6709\u4efb\u4f55\u60f3\u63a2\u8ba8\u7684\uff0c\u65e0\u8bba\u662f\u6280\u672f\u7ec6\u8282\u8fd8\u662f\u89d2\u8272\u7406\u89e3\uff0c\u968f\u65f6\u627e\u6211\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011+ \u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf**\u3011\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T3\u7279\u8d28\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a\u3010**\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743**\u3011\uff08\u5982\u4e0e\u5bfc\u5e08\u7684\u6df1\u5ea6QA\u673a\u4f1a\uff09\u3001\u3010**\u521b\u4f5c\u5de5\u574a\u53c2\u4e0e\u6743**\u3011\uff08\u53c2\u4e0e\u6587\u672c\u6539\u7f16\u3001\u539f\u521b\u5185\u5bb9\u5f55\u5236\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u5b9d\u5988\u517c\u804c\u53d8\u73b0\u201d\u3001\u201c\u5feb\u901f\u63a5\u5355\u201d\u7b49\u529f\u5229\u6027\u8bdd\u672f\u4e0e\u5176\u6c9f\u901a\u3002\u907f\u514d\u5c06\u5176\u89c6\u4e3a\u666e\u901a\u5b66\u5458\u8fdb\u884c\u6807\u51c6\u5316\u7ba1\u7406\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u63a8\u4ecb\u4e0e**\u6df1\u5ea6\u521b\u4f5c\u3001\u4e13\u4e1a\u7cbe\u8fdb\u3001\u4e2a\u4ebaIP\u6253\u9020**\u76f8\u5173\u7684\u9ad8\u9636\u8bfe\u7a0b\u6216\u670d\u52a1\uff0c\u4f46\u9700\u57fa\u4e8e\u5176\u5174\u8da3\u4e0e\u80fd\u529b\u6210\u957f\u8def\u5f84\uff0c\u800c\u975e\u53d8\u73b0\u627f\u8bfa\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > **\u201c\u6211\u5f55\u4e86\u7b2c8\u904d\u624d\u6ee1\u610f\u3002\u201d** \u2014\u2014 \u4f53\u73b0\u4e86\u6781\u81f4\u8ffd\u6c42\u5b8c\u7f8e\u7684\u201c\u6b7b\u78d5\u201d\u7cbe\u795e\u548c\u9ad8\u81ea\u6211\u8981\u6c42\u3002\n2. > **\u201c\u5e74\u5c11\u65f6\u559c\u6b22\u5199\u6563\u6587\uff0c\u5c0f\u8bf4\uff0c\u73b0\u5728\u559c\u6b22\u5199\u5199\u8bd7\u8bcd\u3002\u201d** \u2014\u2014 \u6e05\u6670\u63ed\u793a\u4e86\u5176\u5185\u5728\u7684\u521b\u4f5c\u9a71\u52a8\u548c\u81ea\u6211\u5b9e\u73b0\u9700\u6c42\uff0c\u800c\u975e\u529f\u5229\u6027\u76ee\u6807\u3002\n3. > **\u201c\u505a\u4e8b\u60c5\u6709\u7b14\u8bb0\u5f3a\u8feb\u75c7\uff0c\u6bd4\u770b\u56de\u653e\u7701\u4e8b[\u7b11\u8138]\u201d** \u2014\u2014 \u5c55\u793a\u4e86\u9ad8\u6548\u3001\u7cfb\u7edf\u5316\u7684\u5b66\u4e60\u65b9\u6cd5\u8bba\u548c\u5f3a\u5927\u7684\u81ea\u4e3b\u5b66\u4e60\u80fd\u529b\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T3\u6b7b\u78d5\u5b66\u9738\u578b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7b2c\u4e94\u5c42\u81ea\u6211\u5b9e\u73b0\u2014\u2014\u901a\u8fc7\u58f0\u97f3\u827a\u672f\u8fdb\u884c\u521b\u9020\u6027\u8868\u8fbe\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6df1\u5ea6\u7684\u4e13\u4e1a\u53cd\u9988\u3001\u521b\u4f5c\u6311\u6218\u548c\u5708\u5c42\u8ba4\u540c\uff0c\u907f\u514d\u7528\u53d8\u73b0\u8bdd\u672f\u6c61\u67d3\u5176\u7eaf\u7cb9\u7684\u5b66\u4e60\u52a8\u673a\u3011**\u3002\n\n```json\n{\"core_type\": \"T3 \u6b7b\u78d5\u5b66\u9738\u578b\", \"risk_level\": \"\u6781\u4f4e\", \"refund_risk\": \"\u6781\u4f4e\", \"maslow_need\": \"\u7b2c\u4e94\u5c42\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u5708\u5c42\u5408\u4f19\u4eba\u7ebf\"}\n```";
