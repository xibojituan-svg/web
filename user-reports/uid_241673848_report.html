    <script>
        const markdownText = "\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e\u3002\u7f3a\u4e4f\u652f\u4ed8\u4fe1\u606f\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u5177\u4f53\u8d44\u6e90\u72b6\u51b5\u3001\u660e\u786e\u5b66\u4e60\u76ee\u6807\u53ca\u8fc7\u5f80\u5b66\u4e60\u6295\u5165\u6df1\u5ea6\u7b49\u5173\u952e\u7ef4\u5ea6\u4fe1\u606f\u3002\n\n# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u4e0e\u98ce\u63a7\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a\u4e2d\u7b49\u3002\u6709\u6301\u7eed\u5b66\u4e60\u610f\u613f\uff08\u8be2\u95ee\u5ef6\u671f\u3001\u56de\u7089\u3001\u65b0\u8bfe\u7a0b\uff09\uff0c\u4f46\u76ee\u6807\u6a21\u7cca\uff08\u201c\u8fd8\u6ca1\u5b66\u597d\u201d\u3001\u201c\u5565\u4e5f\u6ca1\u5b66\u597d\u201d\uff09\uff0c\u5b58\u5728\u7126\u8651\uff08\u201c\u8d76\u4e0d\u4e0aAI\u53d8\u5316\u201d\u3001\u201c\u53c8\u9519\u8fc7\u4e86\u7ea2\u5229\u671f\u201d\uff09\u548c\u4ece\u4f17\uff08\u5173\u6ce8\u4ed6\u4eba\u6848\u4f8b\uff09\u503e\u5411\u3002**\u53d8\u73b0\u52a8\u673a\u4e0d\u660e\u786e**\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u4ec5\u77e5\u6709\u4ed8\u8d39\u80fd\u529b\uff08\u5df2\u8d2d\u591a\u95e8\u8bfe\uff09\uff0c\u4f46\u65f6\u95f4\u6295\u5165\uff08\u201c\u4e24\u5802\u8bfe\u6324\u5728\u4e00\u5757\u201d\uff09\u3001\u804c\u4e1a\u80cc\u666f\u3001\u6280\u80fd\u57fa\u7840\u672a\u77e5\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a\u4e2d\u4f4e\u3002\u8868\u73b0\u51fa**\u5b66\u4e60\u632b\u8d25\u611f**\uff08\u201c\u89c9\u5f97\u81ea\u5df1\u5199\u7684\u90fd\u4e0d\u597d\u201d\u3001\u201c\u53bbAI\u5473\u603b\u662f\u5931\u8d25\u201d\uff09\u3001**\u6280\u672f\u7126\u8651**\uff08\u201cAI\u5df2\u7ecf\u8d85\u8d8a\u6211\u4eec\u201d\uff09\u3001\u4f9d\u8d56\u5916\u90e8\u6307\u5bfc\uff08\u53cd\u590d\u8be2\u95ee\u4f5c\u4e1a\u3001\u5ef6\u671f\u3001\u73ed\u4e3b\u4efb\u6027\u522b\uff09\u3002\u6709\u4e00\u5b9a\u575a\u6301\u6027\uff08\u6301\u7eed\u63d0\u95ee\u3001\u8003\u8651\u56de\u7089\uff09\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u7528\u6237\u5df2\u4e3aAI\u89c6\u9891\u526a\u8f91\u8bfe\u4ed8\u8d39\uff082026-04-08\uff09\uff0c\u5e76\u63d0\u53ca\u5df2\u8d2d\u4e70\u201c3\u4e2a\u73ed\u201d\u3002**\u652f\u4ed8\u884c\u4e3a\u5df2\u53d1\u751f**\uff0c\u4f46\u652f\u4ed8\u51b3\u7b56\u8fc7\u7a0b\u3001\u8d44\u91d1\u6765\u6e90\u4e0d\u660e\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u5b8c\u5168\u7f3a\u5931**\u3002\u65e0\u4efb\u4f55\u5bb6\u5ead\u3001\u4f34\u4fa3\u6216\u7ecf\u6d4e\u5171\u540c\u51b3\u7b56\u8005\u63d0\u53ca\u3002\n*   **\u6b65\u9aa41-4\u5224\u5b9a**\uff1a\u52a8\u673a\u4e0d\u7eaf\uff08\u7126\u8651\u9a71\u52a8\u3001\u76ee\u6807\u6a21\u7cca\uff09\uff0c\u8d44\u6e90\u90e8\u5206\u53ef\u89c1\uff08\u6709\u8d44\u91d1\uff09\uff0c\u5fc3\u7406\u5f39\u6027\u504f\u5f31\u3002**\u503e\u5411\u5224\u5b9a\u4e3aC\u7c7b\uff08\u6613\u7126\u8651\u3001\u6613\u53d7\u632b\u7684\u666e\u901a\u5b66\u5458\uff09**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n**T6 \u9ad8\u7126\u8651\u4ece\u4f17\u8005**\u3002\u7279\u5f81\u9ad8\u5ea6\u543b\u5408\uff1a\u6301\u7eed\u5173\u6ce8\u4ed6\u4eba\u8fdb\u5ea6\uff08\u201c\u9053\u6b8b\u9633\u4e3a\u4ec0\u4e48\u5c31\u884c\u201d\uff09\u3001\u5bf9\u6280\u672f\u8fed\u4ee3\u7126\u8651\u3001\u5b66\u4e60\u76ee\u6807\u8ddf\u968f\u8bfe\u7a0b\u800c\u975e\u81ea\u6211\u89c4\u5212\u3001\u6613\u4ea7\u751f\u201c\u9519\u8fc7\u7ea2\u5229\u201d\u7684\u5931\u843d\u611f\u3001\u5bf9\u4f5c\u4e1a\u548c\u89c4\u5219\u6709\u4f9d\u8d56\u548c\u56f0\u60d1\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u98ce\u9669\u7b49\u7ea7**\uff1a**\u4e2d**\u3002\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5df2\u5bf9\u6539\u7a3f\u8bfe\u6548\u679c\u4e0d\u6ee1\uff08\u201c\u8fd8\u6ca1\u5b66\u597d\u201d\uff09\uff0c\u4e14\u81ea\u6211\u8bc4\u4ef7\u4f4e\uff0c\u82e5\u65b0\u8bfe\u7a0b\u4ecd\u65e0\u83b7\u5f97\u611f\uff0c\u6781\u6613\u5f15\u53d1\u9000\u8d39\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a\u4fe1\u606f\u4e0d\u8db3\uff0c\u5f85\u6838\u67e5\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u4e2d\u98ce\u9669**\u3002\u66fe\u63d0\u53ca\u201c\u4e24\u5802\u8bfe\u6324\u5728\u4e00\u5757\u201d\uff0c\u9700\u5173\u6ce8\u5176\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u3002\n    4.  **\u5185\u5bb9\u4e0d\u5339\u914d**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u76ee\u6807\u6a21\u7cca\uff0c\u6613\u4ea7\u751f\u201c\u8bfe\u7a0b\u4e0d\u662f\u6211\u60f3\u8981\u7684\u201d\u611f\u77e5\u3002\n    5.  **\u670d\u52a1\u4f53\u9a8c**\uff1a**\u4f4e\u98ce\u9669**\u3002\u4e0e\u9500\u552e/\u73ed\u73ed\u4e92\u52a8\u57fa\u672c\u6b63\u5e38\uff0c\u4f46\u6709\u7279\u6b8a\u8981\u6c42\uff08\u6307\u5b9a\u5973\u6027\u73ed\u4e3b\u4efb\uff09\u3002\n    6.  **\u7ade\u54c1/\u8d1f\u9762\u4fe1\u606f**\uff1a\u5f53\u524d\u65e0\u4fe1\u53f7\u3002\n    7.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u4fe1\u606f\u7f3a\u5931\uff0c\u4e3a\u91cd\u5927\u98ce\u9669\u76f2\u533a**\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u65e0\u8fc7\u5ea6\u627f\u8bfa\u8bc1\u636e**\uff1a\u9500\u552e\u56de\u590d\u591a\u4e3a\u4e8b\u52a1\u6027\uff08\u89e3\u91ca\u89c4\u5219\u3001\u63d0\u4f9b\u4fe1\u606f\uff09\uff0c\u672a\u53d1\u73b0\u5938\u5927\u627f\u8bfa\u3002\n*   **\u5b58\u5728\u98ce\u9669\u70b9**\uff1a\u7528\u6237\u652f\u4ed8\u540e\u63d0\u51fa\u201c\u5973\u6027\u73ed\u4e3b\u4efb\u201d\u8981\u6c42\uff0c\u9700**\u786e\u4fdd\u670d\u52a1\u627f\u8bfa\u53ef\u5b9e\u73b0**\uff0c\u907f\u514d\u56e0\u65e0\u6cd5\u6ee1\u8db3\u4e2a\u6027\u5316\u8981\u6c42\u5f15\u53d1\u6295\u8bc9\u3002\n*   **\u7528\u6237\u8ba4\u77e5\u98ce\u9669**\uff1a\u7528\u6237\u5b58\u5728\u201c**\u6280\u672f\u901f\u6210\u5e7b\u60f3**\u201d\uff08\u201c\u5feb\u901f\u53d8\u73b0\u201d\uff09\u4e0e\u201c**AI\u66ff\u4ee3\u7126\u8651**\u201d\uff0c\u9500\u552e\u672a\u8fdb\u884c\u8bef\u5bfc\u6027\u5b89\u629a\uff0c\u4f46\u540e\u7eed\u6559\u5b66\u9700\u7ba1\u7406\u9884\u671f\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**\uff1a**\u504f\u5dee**\u3002\u7528\u6237\u5904\u4e8e\u7126\u8651\u3001\u8ff7\u832b\u72b6\u6001\uff0c\u76f2\u76ee\u62a5\u8bfe\uff08\u201c\u9009\u4e86\u6700\u665a\u7684\u4e00\u4e2a\u73ed\u201d\uff09\uff0c\u5b66\u4e60\u8def\u5f84\u4e0d\u6e05\u6670\uff0c\u4e0e\u9700\u8981\u5f3a\u81ea\u9a71\u3001\u76ee\u6807\u660e\u786e\u7684\u9ad8\u9636\u8bfe\u7a0b\uff08\u5982AI\u89c6\u9891\u8bfe\uff09\u5b58\u5728\u6f5c\u5728\u9519\u914d\u3002\n*   **\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**\u9996\u5468\u91cd\u70b9\u6821\u6b63\u9884\u671f\u4e0e\u5efa\u7acb\u4fe1\u5fc3**\n*   **\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u5f00\u842524h\u5185\u4e00\u5bf9\u4e00\u6c9f\u901a**\uff1a\u660e\u786e\u5176\u5b66\u4e60\u5177\u4f53\u76ee\u6807\uff08\u60f3\u7528AI\u89c6\u9891\u505a\u4ec0\u4e48\uff1f\uff09\uff0c**\u7ba1\u7406\u53d8\u73b0\u9884\u671f**\uff0c\u5f3a\u8c03\u5b66\u4e60\u66f2\u7ebf\u548c\u7ec3\u4e60\u91cd\u8981\u6027\u3002\n    2.  **\u5f3a\u5316\u8fc7\u7a0b\u6fc0\u52b1**\uff1a\u5bf9\u5176\u63d0\u4ea4\u7684\u4f5c\u4e1a\u3001\u4e92\u52a8\u7ed9\u4e88\u53ca\u65f6\u3001\u5177\u4f53\u7684\u79ef\u6781\u53cd\u9988\uff0c\u5bf9\u6297\u5176\u201c\u81ea\u6211\u8bc4\u4ef7\u4f4e\u201d\u7684\u503e\u5411\u3002\n    3.  **\u63d0\u4f9b\u6e05\u6670\u8def\u5f84**\uff1a\u4e3a\u5176\u62c6\u89e3\u5b66\u4e60\u9636\u6bb5\u548c\u91cc\u7a0b\u7891\uff0c\u51cf\u5c11\u8ff7\u832b\u611f\u3002\n    4.  **\u98ce\u9669\u524d\u7f6e\u6c9f\u901a**\uff1a\u6e29\u548c\u63a2\u8be2\u5176\u5b66\u4e60\u65f6\u95f4\u5b89\u6392\uff0c\u5e76**\u52a1\u5fc5\u4fa7\u9762\u4e86\u89e3\u8bfe\u7a0b\u4ed8\u8d39\u662f\u5426\u4e3a\u4e2a\u4eba\u72ec\u7acb\u51b3\u7b56**\u3002\n    5.  **\u6ee1\u8db3\u5408\u7406\u8981\u6c42**\uff1a\u534f\u8c03\u5b89\u6392\u5973\u6027\u73ed\u4e3b\u4efb\uff0c\u5151\u73b0\u627f\u8bfa\u3002\n\n{\"core_type\": \"T6 \u9ad8\u7126\u8651\u4ece\u4f17\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u9996\u5468\u6821\u6b63\u9884\u671f\u4e0e\u5efa\u7acb\u4fe1\u5fc3\"}";
