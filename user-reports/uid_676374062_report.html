    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a676374062\uff08\u6635\u79f0\uff1a\u534a\u7a97\u660e\u6708\uff09\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\uff0c\u5e76\u8f93\u51fa\u5b8c\u6574\u7684\u8bca\u65ad\u62a5\u544a\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a676374062 / \u6635\u79f0\uff1a\u534a\u7a97\u660e\u6708 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-02-25 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u7389\u7389\u4e09\u6dfc\uff08\u66fe\u73b0\u4e3d\uff09\u3001\u7ea2\u8c46\u5305\uff08\u5f20\u96ea\uff09\u3001\u7434\u7d2b\u6db5\uff08\u4faf\u6c76\u59a4\uff09\u3001\u542c\u6df1\u3001\u4e39\u516e\u73ed\u73ed\uff08\u9a6c\u4e39\u4e39\uff09\u3001\u82b1\u5f00\u65e0\u58f0\uff08\u738b\u5fd7\u5a1f\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u5199\u4f5c\u7f16\u8f91\u6539\u7a3f\u8bfe\u3001\u6709\u58f0\u6f14\u64ad\u8fdb\u9636\u8bfe\u3001\u77ed\u6545\u4e8b\u77ed\u5267\u5199\u4f5c\u8bfe\uff08\u5df2\u5ef6\u671f\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u5728\u804c\u72b6\u6001\uff08\u9700\u590d\u5de5\u5f00\u4f1a\u3001\u51fa\u5dee\uff09\uff0c\u540c\u65f6\u662f**\u4e2d\u8003\u8003\u751f\u5bb6\u957f**\uff0c\u65f6\u95f4\u88ab\u5de5\u4f5c\u4e0e\u80b2\u513f\u9ad8\u5ea6\u6324\u538b\uff0c\u5b66\u4e60\u65f6\u95f4\u9700\u201c\u6324\u201d\u51fa\u6765\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u5ead\u6001\u5ea6\uff0c\u4f46\u4ece\u201c\u513f\u5b50\u4e34\u8fd1\u4e2d\u8003\u201d\u7b49\u8868\u8ff0\u770b\uff0c\u5bb6\u5ead\u8d23\u4efb\u91cd\uff0c\u53ef\u80fd\u652f\u6301\u5176\u5b66\u4e60\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u804a\u5929\u8bb0\u5f55\u5c55\u73b0\u4e86\u7528\u6237\u7684\u5b66\u4e60\u884c\u4e3a\u3001\u65f6\u95f4\u51b2\u7a81\u3001\u4e92\u52a8\u98ce\u683c\u53ca\u591a\u91cd\u4efb\u52a1\u538b\u529b\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34(\u4e2d)**\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b\uff08\u4ea4\u4f5c\u4e1a\u3001\u8fdb\u5267\u7ec4\u3001\u7ea61\u5bf91\uff09\uff0c\u4f46\u6838\u5fc3\u9a71\u52a8\u529b\u5e76\u975e\u6781\u901f\u53d8\u73b0\uff0c\u800c\u662f**\u6280\u80fd\u63d0\u5347\u4e0e\u81ea\u6211\u5b9e\u73b0**\u3002\u4e3b\u52a8\u5ef6\u671f\u8bfe\u7a0b\u4ee5\u907f\u514d\u201c\u5b66\u4e0d\u8fc7\u6765\u201d\uff0c\u8bf4\u660e\u5176\u66f4\u770b\u91cd\u5b66\u4e60\u8d28\u91cf\u800c\u975e\u77ed\u671f\u53d8\u73b0\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u62b1\u6b49\uff0c\u9a74\u5927\uff0c\u6709\u4e8b\u63d0\u524d\u79bb\u5f00\u4f1a\u8bae\u5ba4\u4e86\uff01\u60a8\u7684\u6bcf\u4e00\u6b21\u70b9\u8bc4\uff0c\u9488\u9488\u89c1\u8840\uff0c\u53e5\u53e5\u89c1\u5e95\u3002\u611f\u8c22\u60a8\u4ece\u4e0d\u7559\u4f59\u5730\u6233\u7834\uff0c\u4e0d\u80af\u5ba2\u6c14\u7684\u90a3\u4efd\u771f\uff01\u53d7\u76ca\u532a\u6d45\uff01\u201d\uff08\u4f53\u73b0\u5bf9\u4e13\u4e1a\u6210\u957f\u7684\u73cd\u89c6\uff09\n> \u201c\u6211\u8ba1\u5212\u5f00\u8bfe\u65f6\u95f4\u5728\u4e94\u6708\u4e0a\u65ec\uff0c\u56e0\u4e3a\u76ee\u524d\u8fd8\u6709AI\u77ed\u6545\u4e8b\u6539\u7a3f\u8bfe\u548c\u6f14\u64ad\u8fdb\u9636\u8bfe\u6b63\u5728\u5b66\u4e60\u4e2d\uff0c**\u5b66\u4e0d\u8fc7\u6765**\uff0c\u7b49\u8fd9\u4e24\u95e8\u8bfe\u7a0b\u7ed3\u8425\u540e\u518d\u5b66\u4e60AI\u77ed\u5267\u5199\u4f5c\u8bfe\u3002\u201d\uff08\u4f53\u73b0\u5bf9\u5b66\u4e60\u8d28\u91cf\u7684\u7406\u6027\u89c4\u5212\uff0c\u800c\u975e\u76f2\u76ee\u8ffd\u8bfe\uff09\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u540c\u65f6\u62a5\u540d\u591a\u95e8\u8bfe\u7a0b\uff08AI\u5199\u4f5c\u3001\u6709\u58f0\u8fdb\u9636\u3001\u77ed\u5267\u5199\u4f5c\uff09\uff0c\u5177\u5907\u4e00\u5b9a\u4ed8\u8d39\u80fd\u529b\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u7ecf\u6d4e\u72b6\u51b5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e** \u2014 **\u6700\u77ed\u77ed\u677f**\u3002\u5728\u804c+\u4e2d\u8003\u5bb6\u957f\u53cc\u91cd\u8eab\u4efd\uff0c\u65f6\u95f4\u88ab\u4e25\u91cd\u5207\u5272\u3002\u51fa\u5dee\u3001\u5f00\u4f1a\u3001\u966a\u5b69\u5b50\u4e0a\u8bfe\u9891\u7e41\u6253\u65ad\u5b66\u4e60\u8fdb\u7a0b\uff0c\u5bfc\u81f4\u4f5c\u4e1a\u9700\u8865\u4ea4\u3001\u9519\u8fc7\u70b9\u8bc4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4e2d** \u2014 \u4ece\u201c\u53bb\u5d3d\u7684\u5b66\u6821\u503c\u65e5\u201d\u7b49\u8868\u8ff0\u770b\uff0c\u5bb6\u5ead\u4e8b\u52a1\u9700\u4eb2\u529b\u4eb2\u4e3a\uff0c\u652f\u6301\u5ea6\u53ef\u80fd\u6709\u9650\uff0c\u4f46\u672a\u6784\u6210\u660e\u786e\u53cd\u5bf9\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u65f6\u95f4\u51b2\u7a81\uff08\u9519\u8fc7\u70b9\u8bc4\u3001\u4f5c\u4e1a\u5ef6\u671f\uff09\u65f6\uff0c\u6001\u5ea6\u79ef\u6781\u3001\u4e3b\u52a8\u6c9f\u901a\u3001\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff08\u7533\u8bf7\u8865\u4ea4\u3001\u7ea61\u5bf91\uff09\u3002\u9047\u5230\u95ee\u9898\uff08\u5982\u8fdb\u5267\u7ec4\u4e0d\u6e05\u695a\u72b6\u51b5\uff09\u4f1a\u4e3b\u52a8\u8be2\u95ee\u3001\u786e\u8ba4\uff0c\u800c\u975e\u62b1\u6028\u6216\u653e\u5f03\u3002\u5bf9\u4e25\u5389\u70b9\u8bc4\u6301\u6b63\u9762\u63a5\u7eb3\u6001\u5ea6\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u73ed\u73ed\uff0c\u4f5c\u4e1a\u5f55\u4e86\uff0c\u8fd8\u6ca1\u63d0\u4ea4\u3002\u201d -> \u201c\u5df2\u63d0\u4ea4\uff0c\u8f9b\u82e6\u4e86\u73ed\u73ed\u201d\uff08\u4e3b\u52a8\u6c47\u62a5\u8fdb\u5ea6\uff0c\u793c\u8c8c\uff09\n> \u201c\u5e08\u59d0\uff0c\u6211\u4f5c\u4e1a\u8fd8\u6ca1\u63d0\u4ea4\uff0c\u80fd\u5e2e\u6211\u5f00\u901a\u4e00\u4e0b\u8865\u4ea4\u901a\u9053\u5417\uff1f\u201d\uff08\u9047\u56f0\u96be\u4e3b\u52a8\u6c42\u52a9\uff0c\u800c\u975e\u81ea\u6211\u5426\u5b9a\uff09\n> \u201c\u7b2c\u4e00\u6b21\u8fdb\u5267\u7ec4\uff0c\u8fd8\u6ca1\u641e\u6e05\u695a\u72b6\u51b5\u201d\uff08\u5766\u8bda\u81ea\u8eab\u4e0d\u8db3\uff0c\u79ef\u6781\u5bfb\u6c42 clarification\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e** \u4e0e **\u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0** \u7684\u6df7\u5408\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u65f6\u95f4\u6781\u5ea6\u7a00\u7f3a\u4e0b\u7684\u201c\u6389\u961f\u6050\u614c\u201d\u4e0e\u201c\u5b8c\u7f8e\u4e3b\u4e49\u7126\u8651\u201d**\u3002\u5979\u6e34\u671b\u5728\u591a\u91cd\u793e\u4f1a\u89d2\u8272\uff08\u5458\u5de5\u3001\u6bcd\u4eb2\uff09\u4e4b\u5916\uff0c\u4ecd\u80fd\u4fdd\u6301\u5b66\u4e60\u8005\u7684\u8eab\u4efd\u5e76\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\uff0c\u5bb3\u6015\u56e0\u65f6\u95f4\u4e0d\u8db3\u800c\u843d\u540e\u6216\u8868\u73b0\u4e0d\u4f73\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u201d\u7684\u5c0a\u91cd\u611f\u4e0e\u201c\u9ad8\u6548\u6210\u957f\u201d\u7684\u638c\u63a7\u611f**\u3002\u5979\u4e0d\u9700\u8981\u60c5\u611f\u4fdd\u59c6\uff0c\u4f46\u9700\u8981\u88ab\u8ba4\u53ef\u5176\u52aa\u529b\u4e0e\u6f5c\u529b\uff1b\u5979\u9700\u8981\u9ad8\u5ea6\u7075\u6d3b\u3001\u9897\u7c92\u5ea6\u6e05\u6670\u7684\u65f6\u95f4\u7ba1\u7406\u652f\u6301\uff0c\u4ee5\u7f13\u89e3\u5176\u201c\u5b66\u4e0d\u8fc7\u6765\u201d\u7684\u7126\u8651\uff0c\u8ba9\u5979\u611f\u89c9\u5373\u4f7f\u65f6\u95f4\u788e\u7247\u5316\uff0c\u4e5f\u80fd\u7a33\u6b65\u524d\u8fdb\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u8fdb\u5316\u524d\u4f53\uff0c\u6709\u5411 **\u6df7\u5408\u4f533\u53f7\uff1a\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b** \u53d1\u5c55\u7684\u6f5c\u529b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u5bb6\u5ead\uff08\u5c24\u5176\u662f\u5b69\u5b50\u4e2d\u8003\uff09\u662f\u5176\u65f6\u95f4\u538b\u529b\u7684\u4e3b\u8981\u6765\u6e90\uff0c\u4f46\u4e5f\u662f\u5176\u8d23\u4efb\u6240\u5728\uff0c\u672a\u663e\u793a\u53cd\u5bf9\u5b66\u4e60\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u4e2d** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u56e0\u5de5\u4f5c\u3001\u80b2\u513f\u5bfc\u81f4\u8bfe\u7a0b\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u5b66\u4e0d\u8fc7\u6765\u201d\u7684\u5931\u63a7\u611f\u548c\u6127\u759a\u611f\uff0c\u6700\u7ec8\u53ef\u80fd\u56e0\u538b\u529b\u8fc7\u5927\u800c\u653e\u5f03\u3002\u8bc1\u636e\uff1a\u4e3b\u52a8\u7533\u8bf7\u8bfe\u7a0b\u5ef6\u671f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u4e8b\u4e3b\u52a8\u6c9f\u901a\u89e3\u51b3\uff0c\u65e0\u81ea\u5351\u3001\u5d29\u6e83\u8ff9\u8c61\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u52a8\u673a\u66f4\u504f\u5411\u81ea\u6211\u5b9e\u73b0\u800c\u975e\u5feb\u901f\u53d8\u73b0\uff0c\u5bf9\u77ed\u671f\u6536\u76ca\u671f\u5f85\u503c\u76f8\u5bf9\u7406\u6027\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-4\u5468\uff0c\u591a\u91cd\u4f5c\u4e1a\u622a\u6b62\u65e5\u671f\u53e0\u52a0\u3001\u4e14\u5bb6\u5ead/\u5de5\u4f5c\u51fa\u73b0\u7a81\u53d1\u72b6\u51b5\u65f6**\u3002\u4f8b\u5982\uff0c\u5b69\u5b50\u4e2d\u8003\u51b2\u523a\u671f\u4e0e\u8bfe\u7a0b\u9879\u76ee\u622a\u6b62\u671f\u91cd\u5408\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u534a\u7a97\u660e\u6708\u4f60\u597d\uff0c\u770b\u5230\u4f60\u540c\u65f6\u5e73\u8861\u5de5\u4f5c\u3001\u5bb6\u5ead\u548c\u5b66\u4e60\uff0c\u771f\u7684\u5f88\u4f69\u670d\u4f60\u7684\u884c\u52a8\u529b\u3002\u54b1\u4eec\u8fd9\u4e2a\u73ed\u5f88\u591a\u540c\u5b66\u90fd\u662f\u2018\u65f6\u95f4\u7ba1\u7406\u5927\u5e08\u2019\uff0c\u6211\u4f1a\u628a\u6bcf\u5468\u7684\u6838\u5fc3\u4efb\u52a1\u548c\u5f39\u6027\u65f6\u95f4\u70b9\u90fd\u68b3\u7406\u6e05\u695a\u53d1\u4f60\uff0c\u54b1\u4eec\u4e0d\u6c42\u5feb\uff0c\u4f46\u6c42\u6bcf\u4e00\u6b65\u90fd\u624e\u5b9e\u3002\u6709\u4efb\u4f55\u65f6\u95f4\u51b2\u7a81\uff0c\u63d0\u524d\u8ddf\u6211\u8bf4\uff0c\u54b1\u4eec\u4e00\u8d77\u8c03\u6574\u8ba1\u5212\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176T2\u8001\u9ec4\u725b\u7279\u8d28\uff0c\u63d0\u4f9b\u6e05\u6670\u3001\u6709\u6df1\u5ea6\u7684\u5b66\u4e60\u8def\u5f84\u548c\u5b9e\u6218\u4efb\u52a1\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n    1.  **\u3010\u5f39\u6027\u65f6\u95f4\u7ba1\u7406\u5305\u3011**\uff1a\u63d0\u4f9b\u6e05\u6670\u7684\u201c\u6bcf\u5468\u5b66\u4e60\u5730\u56fe\u201d\uff0c\u660e\u786e\u6838\u5fc3\u4efb\u52a1\u4e0e\u53ef\u9009\u4efb\u52a1\uff0c\u5141\u8bb8\u5176\u6839\u636e\u81ea\u8eab\u65f6\u95f4\u7075\u6d3b\u8c03\u6574\u8fdb\u5ea6\u3002\n    2.  **\u3010\u6743\u9650\u89c9\u9192\u89c2\u5bdf\u5305\u3011**\uff1a\u89c2\u5bdf\u5176\u5728\u5267\u7ec4\u4e2d\u7684\u8868\u73b0\uff0c\u82e5\u51fa\u73b0\u4e3b\u52a8\u534f\u8c03\u3001\u5e2e\u52a9\u4ed6\u4eba\u7684\u884c\u4e3a\uff08\u5982\u5df2\u6709\u5173\u5fc3\u5176\u4ed6\u7ec4\u5458\u8fdb\u5ea6\u7684\u8ff9\u8c61\uff09\uff0c**\u7acb\u5373\u542f\u52a8\u201c\u9ec4\u888d\u52a0\u8eab\u63d0\u5e72\u6cd5\u201d**\uff0c\u8d4b\u4e88\u5176\u5c0f\u7ec4\u957f\u6216\u201c\u8fdb\u5ea6\u63d0\u9192\u5b98\u201d\u7b49\u89d2\u8272\uff0c\u5c06\u5176\u56fa\u5316\u4e3a\u751f\u6001\u5efa\u8bbe\u8005\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u6700\u540e\u671f\u9650\u201d\u3001\u201c\u6240\u6709\u4eba\u90fd\u5728\u7b49\u4f60\u201d\u7b49\u8bdd\u672f\u65bd\u538b\u3002\u7981\u6b62\u56e0\u5176\u5076\u5c14\u7684\u5ef6\u8fdf\u800c\u8fdb\u884c\u201c\u7eaa\u5f8b\u6279\u8bc4\u201d\uff0c\u8fd9\u6781\u6613\u89e6\u53d1\u5176\u201c\u6389\u961f\u6050\u614c\u201d\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u5728\u5176\u5f53\u524d\u8bfe\u7a0b\u672a\u7a33\u5b9a\u5b8c\u6210\u524d\uff0c**\u4e25\u7981\u4ea4\u53c9\u63a8\u9500\u65b0\u8bfe\u7a0b**\u3002\u5347\u5355\u9700\u5728\u5176\u660e\u786e\u8868\u8fbe\u201c\u5f53\u524d\u8bfe\u7a0b\u6e38\u5203\u6709\u4f59\u201d\u6216\u201c\u6709\u660e\u786e\u65b0\u65b9\u5411\u9700\u6c42\u201d\u65f6\uff0c\u57fa\u4e8e\u5176\u65f6\u95f4\u53ef\u884c\u6027\u8c28\u614e\u63a8\u8fdb\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u6211\u8ba1\u5212\u5f00\u8bfe\u65f6\u95f4\u5728\u4e94\u6708\u4e0a\u65ec\uff0c\u56e0\u4e3a\u76ee\u524d\u8fd8\u6709AI\u77ed\u6545\u4e8b\u6539\u7a3f\u8bfe\u548c\u6f14\u64ad\u8fdb\u9636\u8bfe\u6b63\u5728\u5b66\u4e60\u4e2d\uff0c\u5b66\u4e0d\u8fc7\u6765**\uff0c\u7b49\u8fd9\u4e24\u95e8\u8bfe\u7a0b\u7ed3\u8425\u540e\u518d\u5b66\u4e60AI\u77ed\u5267\u5199\u4f5c\u8bfe\u3002\u201d (**\u7406\u6027\u89c4\u5212\uff0c\u538c\u6076\u8fc7\u8f7d**)\n2. > \u201c\u62b1\u6b49\uff0c\u9a74\u5927\uff0c\u6709\u4e8b\u63d0\u524d\u79bb\u5f00\u4f1a\u8bae\u5ba4\u4e86\uff01**\u60a8\u7684\u6bcf\u4e00\u6b21\u70b9\u8bc4\uff0c\u9488\u9488\u89c1\u8840\uff0c\u53e5\u53e5\u89c1\u5e95\u3002\u611f\u8c22\u60a8\u4ece\u4e0d\u7559\u4f59\u5730\u6233\u7834\uff0c\u4e0d\u80af\u5ba2\u6c14\u7684\u90a3\u4efd\u771f\uff01\u53d7\u76ca\u532a\u6d45\uff01**\u201d (**\u8ffd\u6c42\u4e13\u4e1a\u6210\u957f\uff0c\u73cd\u89c6\u4e25\u5389\u53cd\u9988**)\n3. > \u201c**\u7b2c\u4e00\u6b21\u8fdb\u5267\u7ec4\uff0c\u8fd8\u6ca1\u641e\u6e05\u695a\u72b6\u51b5**\u201d -> \u201c@\u6f2b\u6f2b\u957f\u5b81\u2005\u957f\u5b81\u662f\u5f5531-32\u7684\u65c1\u767d\u5417\uff1f\u201d -> \u201c\u6211\u5728\u6587\u4ef6\u5939\u91cc\u6ca1\u770b\u5230\u4f60\u5f55\u7684\u97f3\u3002\u201d (**\u9047\u4e8b\u4e0d\u614c\uff0c\u4e3b\u52a8\u6c9f\u901a\uff0c\u6709\u521d\u6b65\u7684\u534f\u8c03\u548c\u8ddf\u8fdb\u610f\u8bc6**)\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\uff08\u5411\u6df7\u5408\u4f533\u53f7\u8fdb\u5316\u4e2d\uff09\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u65f6\u95f4\u7a00\u7f3a\u4e2d\u7ef4\u6301\u4e13\u4e1a\u6210\u957f\uff0c\u83b7\u5f97\u5c0a\u91cd\u4e0e\u638c\u63a7\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u5f39\u6027\u65f6\u95f4\u7ba1\u7406\u652f\u6301\uff0c\u5e76\u9002\u65f6\u8d4b\u4e88\u5176\u7ec4\u7ec7\u89d2\u8272\uff0c\u5c06\u5176\u4ece\u201c\u5b66\u4e60\u8005\u201d\u8f6c\u5316\u4e3a\u201c\u5171\u5efa\u8005\u201d\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b (\u6df7\u5408\u4f533\u53f7\u8fdb\u5316\u524d\u4f53)\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u5f39\u6027\u65f6\u95f4\u7ba1\u7406\u5305 + \u6743\u9650\u89c9\u9192\u89c2\u5bdf\u5305\", \"age\": \"35-45\u5c81\uff08\u57fa\u4e8e\u5b69\u5b50\u4e2d\u8003\u63a8\u65ad\uff09\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}\n```";
