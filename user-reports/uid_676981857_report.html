    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u5fc3\u601d\u6843\u5b50 (UID: 676981857) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-04 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u8292\u679c\u6843\u5fc36(\u738b\u5a1c)\u3001\u8d85\u4eba\u73ed\u73ed/\u6897\u54e5(\u803f\u4e1a\u4e1c) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6500\u767b\u8ba1\u5212\u7cbe\u82f1\u7248\u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u7528\u5361\u5468\u8f6c / \u501f\u6b3e\u9690\u60a3** (\u7528\u6237\u63d0\u53ca\u201c\u559c\u64ad\u7684\u5b66\u8d39\u624d\u6e05\u5b8c\u201d\uff0c\u8868\u660e\u5b66\u8d39\u662f\u901a\u8fc7\u5206\u671f\u6216\u501f\u8d37\u65b9\u5f0f\u652f\u4ed8\uff0c\u521a\u8fd8\u6e05) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u7528\u6237\u591a\u6b21\u5728\u767d\u5929\u4e0a\u73ed\u65f6\u95f4\u6c9f\u901a\uff0c\u8868\u660e\u6709\u5168\u804c\u5de5\u4f5c\uff0c\u5b66\u4e60\u65f6\u95f4\u9700\u6324\u5360) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u9690\u7792\u5077\u62a5** (\u7528\u6237\u63d0\u53ca\u201c\u5bb6\u91cc\u6709\u4e2a\u5c0f\u9738\u738b\u8fc7\u5e74\u628a\u6211\u7535\u8111\u7ed9\u6ce1\u6c34\u4e86\u201d\uff0c\u6697\u793a\u5bb6\u5ead\u73af\u5883\u4e0d\u652f\u6301\uff0c\u4e14\u6709\u5b69\u5b50\u5e72\u6270\uff1b\u672a\u63d0\u53ca\u5bb6\u4eba\u652f\u6301) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** (\u4e92\u52a8\u9891\u7e41\uff0c\u4e3b\u52a8\u63d0\u95ee\uff0c\u79ef\u6781\u53c2\u4e0e\u793e\u7fa4) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u5bf9\u53d8\u73b0\u6709\u671f\u5f85\uff08\u8be2\u95ee\u63a5\u5355\u3001\u7b49\u7ea7\u63d0\u5347\uff09\uff0c\u4f46\u540c\u65f6\u4e5f\u8868\u73b0\u51fa\u5bf9\u4e13\u4e1a\u6280\u5de7\uff08\u53d1\u97f3\u3001\u8bbe\u5907\u3001\u65c1\u767d\u89d2\u8272\u8f6c\u6362\uff09\u7684\u6d53\u539a\u5174\u8da3\u548c\u94bb\u7814\u7cbe\u795e\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u73ed\u73ed\u6211\u7684\u97f3\u8d28\u662f\u4ec0\u4e48\u6837\u7684\uff0c\u9002\u5408\u4ec0\u4e48\u8d5b\u9053\uff0c\u9664\u4e86\u8d44\u91d1\u7684\u95ee\u9898\u8fd8\u6709\u5bb6\u91cc\u6709\u4e2a\u5c0f\u9738\u738b\u8fc7\u5e74\u628a\u6211\u7535\u8111\u7ed9\u6ce1\u6c34\u4e86\uff0c\u540e\u9762\u8fd8\u80fd\u4e70\u5417\uff1f\u201d > \u201c\u600e\u4e48\u53ef\u4ee5\u52a0\u5feb\u4e00\u70b9\uff08\u5347\u7ea7\uff09\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u5b66\u8d39\u521a\u8fd8\u6e05\uff0c\u7535\u8111\u5df2\u7528\u4e03\u5e74\uff0c\u8003\u8651\u5347\u7ea7\u5185\u5b58\u548c\u8bbe\u5907\u65f6\u8868\u73b0\u51fa\u660e\u663e\u7684\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u6709\u5168\u804c\u5de5\u4f5c\uff08\u201c\u4e0a\u73ed\u4e2d\u201d\uff09\uff0c\u4f46\u80fd\u5229\u7528\u788e\u7247\u65f6\u95f4\u5b66\u4e60\u3001\u4e92\u52a8\uff0c\u5b66\u4e60\u610f\u613f\u5f3a\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u6781\u4f4e** \u2014 **\u6838\u5fc3\u77ed\u677f**\u3002\u5bb6\u5ead\u73af\u5883\u4e0d\u652f\u6301\uff08\u5b69\u5b50\u7834\u574f\u7535\u8111\uff09\uff0c\u65e0\u72ec\u7acb\u7a7a\u95f4\uff08\u201c\u603b\u88ab\u6253\u65ad\u201d\uff09\uff0c\u4e14\u652f\u4ed8\u5b66\u8d39\u53ef\u80fd\u672a\u83b7\u5bb6\u4eba\u5b8c\u5168\u77e5\u60c5/\u652f\u6301\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a**\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u7535\u8111\u3001\u8f6f\u4ef6\u3001\u58f0\u97f3\uff09\u4f1a\u4e3b\u52a8\u6c42\u52a9\u5e76\u5c1d\u8bd5\u89e3\u51b3\uff08\u91cd\u542f\u624b\u673a\u3001\u5347\u7ea7\u5185\u5b58\uff09\uff0c\u4f46\u5728\u5b66\u4e60\u96be\u70b9\uff08\u5e7f\u4e1c\u4eba\u5b66\u62fc\u97f3\uff09\u548c\u8eab\u4f53\u4e0d\u9002\uff08\u5589\u5499\u75db\uff09\u65f6\u4f1a\u8868\u8fbe\u6cae\u4e27\u548c\u56f0\u96be\u3002**\u672a\u51fa\u73b0\u6781\u7aef\u60c5\u7eea\u5d29\u6e83\u6216\u653e\u5f03\u8a00\u8bba**\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u592a\u96be\u4e86\uff0c\u4e24\u8fb9\u90fd\u5f88\u96be\u90fd\u5f55\u4e86\u6210\u5343\u4e0a\u767e\u6b21\uff0c\u6211\u8ba4\u771f\u7684\u65f6\u5019\u4e0d\u7ed9\u8fc7\uff0c\u4e0d\u8ba4\u771f\u5c31\u7ed9\u8fc7\u4e86[\u5c34\u5c2c]\u201d > \u201c\u5e7f\u4e1c\u4eba\u7ec3\u666e\u901a\u8bdd\u592a\u96be\u4e86\u4e0d\u5938\u5f20\u7ec3\u97f3\u4e0d\u51c6\uff0c\u4e00\u653e\u677e\u97f3\u5c31\u4e0d\u51c6\u3002\u6211\u592a\u96be\u4e86\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u56e0\u5730\u57df\uff08\u5e7f\u4e1c\uff09\u548c\u5bb6\u5ead\u73af\u5883\uff08\u5b69\u5b50\u5e72\u6270\u3001\u7ecf\u6d4e\u4e0d\u5bbd\u88d5\uff09\u5e26\u6765\u7684\u4e0d\u81ea\u4fe1\u4e0e\u5bfb\u6c42\u8ba4\u53ef**\u3002\u5979\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u201c\u597d\u542c\u201d\u7684\u6280\u80fd\uff08\u6709\u58f0\u6f14\u64ad\uff09\uff0c\u83b7\u5f97\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\uff08\u9891\u7e41\u70b9\u8bc4\u4ed6\u4eba\uff0c\u4e5f\u6e34\u671b\u88ab\u70b9\u8bc4\uff09\uff0c\u878d\u5165\u4e00\u4e2a\u201c\u58f0\u97f3\u597d\u542c\u201d\u7684\u793e\u7fa4\uff0c\u4ece\u800c\u83b7\u5f97\u5c0a\u91cd\u548c\u4ef7\u503c\u611f\uff0c\u5f25\u8865\u73b0\u5b9e\u4e2d\u7684\u65e0\u529b\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u5938\u5956\u80af\u5b9a\u4e0e\u201c\u88ab\u770b\u89c1\u201d\u7684\u5f52\u5c5e\u611f**\u3002\u5979\u9700\u8981\u88ab\u8ba4\u53ef\u4e3a\u201c\u6709\u6f5c\u529b\u201d\u3001\u201c\u58f0\u97f3\u6e29\u6696\u201d\u3001\u201c\u5b66\u4e60\u52aa\u529b\u201d\uff0c\u5e76\u5728\u793e\u7fa4\u4e92\u52a8\u4e2d\u83b7\u5f97\u5b58\u5728\u611f\u548c\u5bfc\u5e08\u822c\u7684\u6743\u5a01\u611f\uff08\u901a\u8fc7\u70b9\u8bc4\u4ed6\u4eba\uff09\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1** \u7c7b (\u52a8\u673a\u5c1a\u53ef\u4f46\u8d44\u6e90\u5e95\u5ea7\u5b58\u5728\u4e25\u91cd\u77ed\u677f\uff0c\u9700\u91cd\u70b9\u6276\u6301\u4e0e\u98ce\u9669\u76d1\u63a7) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u5177\u6709\u5411T2/T3\u53d1\u5c55\u7684\u6f5c\u529b\uff0c\u4f46\u5f53\u524d**\u60c5\u7eea\u4f9d\u8d56\u548c\u8d44\u6e90\u77ed\u677f\u7279\u5f81\u66f4\u663e\u8457**\uff1a\u6e34\u671b\u8ba4\u53ef\u3001\u6613\u56e0\u56f0\u96be\u6cae\u4e27\u3001\u5bb6\u5ead\u652f\u6301\u7f3a\u5931\u3001\u7ecf\u6d4e\u538b\u529b\u5927) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 **\u5b89\u5168\u672a\u89e6\u53d1** (\u867d\u7ecf\u6d4e\u538b\u529b\u5927\uff0c\u4f46\u672a\u8fbe\u501f\u8d37\u7edd\u5883\uff1b\u867d\u5bb6\u5ead\u4e0d\u652f\u6301\uff0c\u4f46\u672a\u63d0\u53ca\u6fc0\u70c8\u51b2\u7a81)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a/\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| **\u5bb6\u5ead\u5e72\u9884\u578b** | **\u9ad8** | \u5bb6\u4eba\u53d1\u73b0\u5176\u7ee7\u7eed\u6295\u5165\uff08\u5982\u8d2d\u4e70\u8bbe\u5907\uff09\u6216\u5360\u7528\u5bb6\u5ead\u65f6\u95f4/\u7a7a\u95f4\uff0c\u5f15\u53d1\u77db\u76fe\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u4e2d** | \u5de5\u4f5c\u7e41\u5fd9+\u5bb6\u5ead\u7410\u4e8b\uff08\u5b69\u5b50\u5e72\u6270\uff09\u5bfc\u81f4\u65e0\u6cd5\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\uff0c\u79ef\u7d2f\u632b\u8d25\u611f\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u4e2d** | \u7ec3\u4e60\u9047\u5230\u74f6\u9888\uff08\u5982\u524d\u540e\u9f3b\u97f3\uff09\u3001\u8bbe\u5907\u95ee\u9898\u53cd\u590d\u51fa\u73b0\u3001\u6216\u8eab\u4f53\u4e0d\u9002\uff08\u5589\u5499\u75db\uff09\u65f6\uff0c\u4ea7\u751f\u201c\u6211\u592a\u96be\u4e86\u201d\u7684\u65e0\u529b\u611f\uff0c\u82e5\u5f97\u4e0d\u5230\u53ca\u65f6\u758f\u5bfc\u53ef\u80fd\u653e\u5f03\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u4f4e** | \u77ed\u671f\u5185\u5bf9\u53d8\u73b0\u671f\u5f85\u4e0d\u9ad8\uff0c\u66f4\u5173\u6ce8\u6280\u80fd\u63d0\u5347\u548c\u793e\u7fa4\u4e92\u52a8\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-4\u5468**\u3002\u6b64\u65f6\u5b66\u4e60\u96be\u5ea6\u589e\u52a0\uff08\u5982AU\u8f6f\u4ef6\u3001\u89d2\u8272\u97f3\uff09\uff0c\u4f5c\u4e1a\u538b\u529b\u589e\u5927\uff0c\u82e5\u540c\u65f6\u906d\u9047\u5bb6\u5ead\u963b\u529b\u6216\u8bbe\u5907\u95ee\u9898\uff0c\u6781\u6613\u56e0\u201c\u65f6\u95f4\u7cbe\u529b\u65e0\u6cd5\u517c\u987e\u201d\u548c\u201c\u632b\u8d25\u611f\u7d2f\u79ef\u201d\u800c\u9000\u8d39\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6843\u5b50\uff0c\u770b\u5230\u4f60\u5728\u7fa4\u91cc\u90a3\u4e48\u7528\u5fc3\u5730\u70b9\u8bc4\u540c\u5b66\uff0c\u771f\u7684\u5f88\u6709\u5f53\u5bfc\u5e08\u7684\u6f5c\u8d28\uff01\u54b1\u4eec\u5e7f\u4e1c\u540c\u5b66\u5b66\u666e\u901a\u8bdd\u786e\u5b9e\u8981\u514b\u670d\u66f4\u591a\uff0c\u4f46\u4f60\u7684\u2018\u6e29\u5fa1\u97f3\u2019\u5e95\u5b50\u7279\u522b\u68d2\u3002\u522b\u62c5\u5fc3\u8fdb\u5ea6\uff0c\u73ed\u73ed\u4f1a\u966a\u4f60\u4e00\u8d77\uff0c\u628a\u6bcf\u4e2a\u96be\u70b9\u62c6\u89e3\u6210\u5c0f\u76ee\u6807\u3002\u8bb0\u4f4f\uff0c\u5728\u8fd9\u91cc\uff0c\u4f60\u7684\u6bcf\u4e00\u6b21\u53d1\u58f0\u548c\u8fdb\u6b65\u90fd\u4f1a\u88ab\u770b\u89c1\u3001\u88ab\u80af\u5b9a\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5174\u8da3\u6e38\u4e50\u7ebf**\u3011\u4e3a\u4e3b\uff0c\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u4e3a\u8f85\u3002\u4f18\u5148\u4fdd\u969c\u5176\u5b66\u4e60\u4e50\u8da3\u548c\u793e\u7fa4\u53c2\u4e0e\u611f\uff0c\u5728\u5efa\u7acb\u81ea\u4fe1\u540e\uff0c\u7a7f\u63d2\u786c\u6838\u6280\u5de7\u6307\u5bfc\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u9488\u5bf9\u5176\u60c5\u7eea\u6613\u6ce2\u52a8\u548c\u5bb6\u5ead\u652f\u6301\u7f3a\u5931\u7684\u7279\u70b9\uff0c\u63d0\u4f9b\u9ad8\u9891\u3001\u4e2a\u6027\u5316\u7684\u60c5\u7eea\u5b89\u629a\u548c\u9f13\u52b1\u3002**\u8c28\u614e\u63d0\u4f9b\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011**\uff0c\u4ec5\u5728\u786e\u8ba4\u5176\u72b6\u6001\u7a33\u5b9a\u65f6\u7ed9\u4e88\uff0c\u907f\u514d\u589e\u52a0\u5176\u7126\u8651\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u5176\u65bd\u52a0\u8fc7\u91cd\u7684\u4f5c\u4e1a\u538b\u529b\u548c\u53d8\u73b0\u50ac\u4fc3**\u3002\u907f\u514d\u8bf4\u201c\u522b\u4eba\u90fd\u4e8c\u7ea7\u4e86\u4f60\u600e\u4e48\u8fd8\u4e00\u7ea7\u201d\u3002\n    2. **\u7edd\u4e0d\u5ffd\u89c6\u5176\u5173\u4e8e\u8bbe\u5907\u3001\u5bb6\u5ead\u5e72\u6270\u7b49\u5b9e\u9645\u56f0\u96be\u7684\u503e\u8bc9**\uff0c\u5fc5\u987b\u7ed9\u4e88\u5177\u4f53\u3001\u53ef\u64cd\u4f5c\u7684\u89e3\u51b3\u65b9\u6848\u6216\u60c5\u611f\u5171\u9e23\u3002\n    3. **\u7edd\u4e0d\u5728\u5176\u8868\u8fbe\u201c\u592a\u96be\u4e86\u201d\u65f6\u53ea\u56de\u590d\u201c\u52a0\u6cb9\u201d\uff0c\u9700\u62c6\u89e3\u6b65\u9aa4\uff0c\u964d\u4f4e\u9884\u671f**\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u5bb6\u5ead\u652f\u6301\u95ee\u9898\u89e3\u51b3\u3001\u7ecf\u6d4e\u72b6\u51b5\u6539\u5584\u524d\uff0c\u4efb\u4f55\u5173\u4e8e\u9ad8\u4ef7\u8bbe\u5907\u6216\u8fdb\u9636\u8bfe\u7a0b\u7684\u63a8\u8350\u90fd\u53ef\u80fd\u6210\u4e3a\u538b\u57ae\u9a86\u9a7c\u7684\u6700\u540e\u4e00\u6839\u7a3b\u8349\uff0c\u89e6\u53d1\u5bb6\u5ead\u77db\u76fe\u578b\u9000\u8d39\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u73ed\u73ed\u6211\u7684\u97f3\u8d28\u662f\u4ec0\u4e48\u6837\u7684\uff0c\u9002\u5408\u4ec0\u4e48\u8d5b\u9053\uff0c**\u9664\u4e86\u8d44\u91d1\u7684\u95ee\u9898\u8fd8\u6709\u5bb6\u91cc\u6709\u4e2a\u5c0f\u9738\u738b\u8fc7\u5e74\u628a\u6211\u7535\u8111\u7ed9\u6ce1\u6c34\u4e86\uff0c\u540e\u9762\u8fd8\u80fd\u4e70\u5417\uff1f\u653e\u54ea\u6709\u4e0d\u5b89\u5168\uff0c\u4e5f\u6ca1\u6709\u72ec\u7acb\u7684\u7a7a\u95f4\u7ed9\u6211\u603b\u88ab\u6253\u65ad**\u201d\n2. > \u201c\u5e7f\u4e1c\u4eba\u7ec3\u666e\u901a\u8bdd\u592a\u96be\u4e86\u4e0d\u5938\u5f20\u7ec3\u97f3\u4e0d\u51c6\uff0c\u4e00\u653e\u677e\u97f3\u5c31\u4e0d\u51c6\u3002**\u6211\u592a\u96be\u4e86**\u201d\n3. > \u201c\u559c\u64ad\u7684\u5b66\u8d39\u624d\u6e05\u5b8c\u3002\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u4e0e\u793e\u7fa4\u5f52\u5c5e\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u504f\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u81f4\u7684\u60c5\u611f\u966a\u4f34\u4e0e\u80af\u5b9a\uff0c\u7edd\u53e3\u4e0d\u63d0\u5347\u5355\uff0c\u5e76\u5e2e\u52a9\u5176\u5316\u89e3\u5bb6\u5ead\u4e0e\u65f6\u95f4\u7684\u73b0\u5b9e\u963b\u529b\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"maslow_need\": \"\u7b2c\u56db\u5c42\u5c0a\u91cd\u9700\u6c42\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\u504f\u9ad8\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf + \u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\"}\n```";
