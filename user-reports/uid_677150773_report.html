        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677150773 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5b98\u65b9\u62db\u52df\u5b98-\u6696\u6696(\u5f20\u5e86\u6587) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u9ad8\u9636\u73ed (7380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad** (\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u8d44\u91d1\u6765\u6e90) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad** (\u4ec5\u77e5\u201c\u7a7a\u95f2\u65f6\u95f4\u8f83\u591a\u201d\u3001\u201c\u4f11\u606f\u65e5\u4e00\u4e2a\u4eba\u5728\u5bb6\u201d) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad** (\u672a\u63d0\u53ca\u5bb6\u5ead\u72b6\u51b5) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** (\u5173\u952e\u4e09\u8f74\u4fe1\u606f\u5982\u652f\u4ed8\u65b9\u5f0f\u3001\u5bb6\u5ead\u652f\u6301\u3001\u5177\u4f53\u65f6\u95f4\u5b89\u6392\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u7b49\u5747\u672a\u63d0\u53ca) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u27a1\u4e2d\n- **\u7279\u5f81\u901f\u5199**\uff1a\u80fd\u529b\u63d0\u5347\u4e0e\u517c\u804c\u53d8\u73b0\u6df7\u5408\u9a71\u52a8\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u5355\u7eaf\u60f3\u5728\u4e1a\u4f59\u65f6\u95f4\u627e\u70b9\u4e8b\u505a\uff0c\u8d5a\u70b9\u732b\u7cae\u94b1\u201d\uff0c\u671f\u671b\u6536\u5165\u5728\u201c\u4e24\u4e09\u5343\u201d\uff0c\u5c5e\u4e8e\u77ed\u671f\u53d8\u73b0\u9884\u671f\uff081-3\u4e2a\u6708\uff09\u3002\u4f46\u540c\u65f6\uff0c\u7528\u6237\u4e3b\u52a8\u5206\u6790\u81ea\u8eab\u5728\u201c\u91cd\u97f3\u548c\u65ad\u53e5\u201d\u4e0a\u7684\u4e0d\u8db3\uff0c\u8868\u73b0\u51fa\u5bf9\u6280\u80fd\u63d0\u5347\u7684\u5174\u8da3\u548c\u81ea\u7701\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5355\u7eaf\u60f3\u5728\u4e1a\u4f59\u65f6\u95f4\u627e\u70b9\u4e8b\u505a\uff0c\u8d5a\u70b9\u732b\u7cae\u94b1\u201d > \u201c\u76ee\u524d\u5bf9\u5e94\u8fd9\u4e00\u884c\u7684\u671f\u671b\u6536\u5165\u5728\u4e24\u4e09\u5343\u201d > \u201c\u76ee\u524d\u611f\u89c9\u627e\u91cd\u97f3\u548c\u65ad\u53e5\u4e0a\u9762\u6bd4\u8f83\u6b20\u7f3a\uff0c\u58f0\u8c03\u548c\u8bed\u901f\u8c03\u6574\u4e0a\u4e5f\u6709\u6b20\u7f3a\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e (\u4fe1\u606f\u4e0d\u8db3\uff0c\u57fa\u4e8e\u6709\u9650\u4fe1\u606f\u63a8\u65ad\u4e3a\u201c\u4e2d\u201d)\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u6536\u5165\u7a33\u5b9a\u6027\u3001\u8d1f\u503a\u60c5\u51b5\u3002\u4ec5\u77e5\u6708\u6536\u51656000\u5143\uff0c\u4f46\u65e0\u6cd5\u5224\u65ad\u8bfe\u7a0b\u8d39\u7528\u5360\u5176\u6536\u5165\u6bd4\u4f8b\u53ca\u652f\u4ed8\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u7528\u6237\u4e3a\u533b\u7597\u5668\u68b0QA\u5de5\u7a0b\u5e08\uff0c\u53e6\u6709\u5b66\u79d1\u8f85\u5bfc\u517c\u804c\uff0c\u8868\u660e\u5177\u5907\u4e00\u5b9a\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u3002\u81ea\u79f0\u201c\u7a7a\u95f2\u65f6\u95f4\u5c31\u6bd4\u8f83\u591a\u201d\u3001\u201c\u4f11\u606f\u65e5\u4e00\u4e2a\u4eba\u5728\u5bb6\u201d\uff0c\u6709\u53ef\u5229\u7528\u7684\u788e\u7247\u5316\u65f6\u95f4\u3002\u4f46\u5177\u4f53\u5de5\u4f5c\u5236\u5ea6\uff08\u662f\u5426\u5012\u73ed\uff09\u672a\u77e5\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u5b8c\u5168\u672a\u63d0\u53ca\u5bb6\u5ead\u72b6\u51b5\uff0c\u662f**\u91cd\u5927\u98ce\u9669\u9690\u60a3**\u3002\n- **\u5e95\u5ea7\u53d6\u77ed\u677f**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u7531\u4e8e\u8d44\u91d1\u548c\u5bb6\u5ead\u652f\u6301\u4e24\u4e2a\u5173\u952e\u7ef4\u5ea6\u4fe1\u606f\u7f3a\u5931\uff0c\u65e0\u6cd5\u51c6\u786e\u8bc4\u7ea7\u3002**\u57fa\u4e8e\u73b0\u6709\u4fe1\u606f\uff0c\u6682\u63a8\u65ad\u4e3a\u201c\u4e2d\u201d\uff0c\u4f46\u7f6e\u4fe1\u5ea6\u6781\u4f4e\u3002**\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u7528\u6237\u80fd\u51b7\u9759\u3001\u5177\u4f53\u5730\u5206\u6790\u81ea\u8eab\u6280\u80fd\u77ed\u677f\uff08\u91cd\u97f3\u3001\u65ad\u53e5\u3001\u8bed\u901f\uff09\uff0c\u5e76\u4e3b\u52a8\u544a\u77e5\u201c\u5177\u4f53\u5185\u5bb9\u6211\u4f1a\u5728\u5728\u4e0b\u73ed\u540e\u56de\u590d\u8001\u5e08\u201d\uff0c\u8868\u73b0\u51fa\u826f\u597d\u7684\u8ba1\u5212\u6027\u548c\u72ec\u7acb\u6027\u3002\u5728\u6574\u4e2a\u5bf9\u8bdd\u4e2d\uff0c\u60c5\u7eea\u5e73\u7a33\uff0c\u65e0\u7126\u8651\u3001\u50ac\u4fc3\u6216\u4f9d\u8d56\u8868\u73b0\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u76ee\u524d\u611f\u89c9\u627e\u91cd\u97f3\u548c\u65ad\u53e5\u4e0a\u9762\u6bd4\u8f83\u6b20\u7f3a\uff0c\u58f0\u8c03\u548c\u8bed\u901f\u8c03\u6574\u4e0a\u4e5f\u6709\u6b20\u7f3a\uff0c\u4ee5\u524d\u6211\u5728\u8bf4\u8bfe\u7684\u65f6\u5019\u8bed\u901f\u5c31\u662f\u504f\u5feb\u7684\u201d > \u201c\u5177\u4f53\u5185\u5bb9\u6211\u4f1a\u5728\u5728\u4e0b\u73ed\u540e\u56de\u590d\u8001\u5e08\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 (\u6e34\u671b\u8ba4\u53ef\u4e0e\u8bc1\u660e)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u81ea\u8eab\u4e13\u4e1a\u80fd\u529b\uff08QA\u5de5\u7a0b\u5e08+\u5b66\u79d1\u8f85\u5bfc\uff09\u7684\u81ea\u4fe1\uff0c\u4e0e\u5728\u65b0\u9886\u57df\uff08\u6709\u58f0\u6f14\u64ad\uff09\u6280\u80fd\u4e0d\u8db3\u4e4b\u95f4\u7684\u843d\u5dee\u611f**\u3002\u4ed6\u5e0c\u671b\u901a\u8fc7\u638c\u63e1\u65b0\u6280\u80fd\uff0c\u5728\u4e1a\u4f59\u65f6\u95f4\u83b7\u5f97\u4e00\u4efd\u4f53\u9762\u7684\u989d\u5916\u6536\u5165\u548c\u81ea\u6211\u4ef7\u503c\u8bc1\u660e\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u5176\u73b0\u6709\u4e13\u4e1a\u80cc\u666f\uff08\u5de5\u7a0b\u5e08\u7684\u903b\u8f91\u6027\u3001\u8f85\u5bfc\u8001\u5e08\u7684\u8868\u8fbe\u57fa\u7840\uff09\u7684\u80af\u5b9a\uff0c\u4ee5\u53ca\u5bf9\u5176\u5728\u65b0\u9886\u57df\u5b66\u4e60\u6f5c\u529b\u7684\u7cbe\u51c6\u8ba4\u53ef**\u3002\u907f\u514dPUA\u8bdd\u672f\uff0c\u5f3a\u8c03\u201c\u4f60\u7684\u57fa\u7840\u5f88\u597d\uff0c\u53ea\u662f\u9700\u8981\u65b9\u6cd5\u70b9\u62e8\u201d\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b (\u6210\u957f\u6295\u8d44\u578b)** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u578b** (\u517c\u987eT2\u4f4e\u8c03\u5b9e\u5e72\u578b\u7279\u5f81) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u751f\u5b58\u5371\u673a\u3001\u5bb6\u5ead\u53cd\u5bf9\u7b49\u7194\u65ad\u4fe1\u53f7\u3002**\u4f46\u5bb6\u5ead\u51b3\u7b56\u6743\u672a\u77e5\u662f\u91cd\u5927\u9690\u60a3\u3002**\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| **\u5bb6\u5ead\u5e72\u9884\u578b** | **\u9ad8** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u804a\u5929\u8bb0\u5f55\u5b8c\u5168\u672a\u63d0\u53ca\u5bb6\u5ead\uff0c\u5b58\u5728\u201c\u80cc\u7740\u4f34\u4fa3\u5077\u5077\u62a5\u540d\u201d\u6216\u5bb6\u4eba\u4e0d\u77e5\u60c5\u7684\u6781\u9ad8\u98ce\u9669\u3002\u4e00\u65e6\u88ab\u5bb6\u4eba\u53d1\u73b0\u5e76\u53cd\u5bf9\uff0c\u6781\u6613\u5f15\u53d1\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4e2d | \u867d\u7136\u81ea\u79f0\u7a7a\u95f2\u65f6\u95f4\u591a\uff0c\u4f46QA\u5de5\u7a0b\u5e08+\u8f85\u5bfc\u8001\u5e08\u53cc\u91cd\u8eab\u4efd\uff0c\u5b9e\u9645\u53ef\u6295\u5165\u5b66\u4e60\u7684**\u6574\u5757\u3001\u9ad8\u8d28\u91cf\u65f6\u95f4**\u53ef\u80fd\u4e0d\u8db3\u3002\u82e5\u8bfe\u7a0b\u5f3a\u5ea6\u5927\uff0c\u6613\u56e0\u65f6\u95f4\u51b2\u7a81\u4ea7\u751f\u79ef\u538b\u548c\u632b\u8d25\u611f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u7406\u6027\u5206\u6790\u95ee\u9898\uff0c\u5d29\u6e83\u98ce\u9669\u4f4e\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u671f\u671b\u6708\u5165\u201c\u4e24\u4e09\u5343\u201d\u7684\u201c\u732b\u7cae\u94b1\u201d\uff0c\u5c5e\u4e8e\u5408\u7406\u8303\u56f4\u3002\u4f46\u82e5**\u5f00\u8bfe\u540e\u53d1\u73b0\u63a5\u5355\u95e8\u69db\u9ad8\u3001\u53d8\u73b0\u5468\u671f\u957f**\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u6b63\u5f0f\u8bfe\u4f5c\u4e1a\u96be\u5ea6\u548c\u91cf\u7ea7\u63d0\u5347\uff0c\u82e5\u540c\u65f6\u906d\u9047\u65f6\u95f4\u51b2\u7a81\u6216\u5bb6\u4eba\u8d28\u7591\uff0c\u98ce\u9669\u96c6\u4e2d\u7206\u53d1\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6d41\u6708\u957f\u6b4c\u540c\u5b66\u4f60\u597d\uff0c\u770b\u5230\u4f60\u7684\u81ea\u6211\u4ecb\u7ecd\u662f\u2018I\u4eba\u2019\uff0c\u4f46\u53c8\u662fQA\u5de5\u7a0b\u5e08\u548c\u8f85\u5bfc\u8001\u5e08\uff0c\u611f\u89c9\u4f60\u662f\u4e2a\u903b\u8f91\u6e05\u6670\u3001\u5584\u4e8e\u6df1\u5ea6\u601d\u8003\u7684\u884c\u52a8\u6d3e\u3002\u4f60\u7684\u4e13\u4e1a\u80cc\u666f\u5728\u7406\u89e3\u6587\u672c\u548c\u628a\u63a7\u8282\u594f\u4e0a\u5176\u5b9e\u6709\u5929\u7136\u4f18\u52bf\u3002\u54b1\u4eec\u4e0d\u6025\u7740\u63a5\u5927\u5355\uff0c\u5148\u628a\u2018\u91cd\u97f3\u548c\u65ad\u53e5\u2019\u8fd9\u4e9b\u5c0f\u5173\u5361\u4e00\u4e2a\u4e2a\u624e\u5b9e\u7a81\u7834\uff0c\u628a\u4f60\u7684\u6280\u672f\u4f18\u52bf\u8f6c\u5316\u6210\u6709\u58f0\u4f18\u52bf\u3002\u6709\u4efb\u4f55\u5b66\u4e60\u8ba1\u5212\u548c\u65f6\u95f4\u5b89\u6392\u4e0a\u7684\u56f0\u60d1\uff0c\u968f\u65f6\u548c\u6211\u6c9f\u901a\uff0c\u6211\u4eec\u4e00\u8d77\u89c4\u5212\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176T4\u641e\u94b1\u7ed3\u679c\u578b\u548c\u5de5\u7a0b\u5e08\u80cc\u666f\uff0c\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u91cf\u5316\u7684\u6280\u80fd\u8fdb\u9636\u8def\u5f84\u548c\u63a5\u5355\u6307\u5f15\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176**\u5bb6\u5ead\u652f\u6301\u4fe1\u606f\u7f3a\u5931**\u7684\u9ad8\u98ce\u9669\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u5bb6\u5ead\u77e5\u60c5\u6c9f\u901a\u8f85\u52a9\u5305\u3011**\uff0c\u7531\u73ed\u4e3b\u4efb\u5728\u5f00\u8bfe\u4e00\u5468\u5185\u4ee5\u201c\u5b66\u4e60\u8ba1\u5212\u540c\u6b65\u201d\u4e3a\u7531\uff0c\u5f15\u5bfc\u5176\u4e0e\u5bb6\u4eba\u6c9f\u901a\uff0c\u83b7\u53d6\u652f\u6301\u6216\u63d0\u524d\u9884\u8b66\u98ce\u9669\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u8fc7\u5ea6\u6e32\u67d3\u201c\u8f7b\u677e\u6708\u5165\u8fc7\u4e07\u201d\uff0c\u7834\u574f\u5176\u201c\u8d5a\u732b\u7cae\u94b1\u201d\u7684\u5408\u7406\u9884\u671f\u30022. \u5ffd\u7565\u5176\u201cI\u4eba\u201d\u5c5e\u6027\uff0c\u5f3a\u884c\u62c9\u5165\u9ad8\u5f3a\u5ea6\u793e\u4ea4\u6d3b\u52a8\u30023. **\u5728\u672a\u786e\u8ba4\u5bb6\u5ead\u652f\u6301\u524d\uff0c\u76f2\u76ee\u9f13\u52b1\u5176\u6295\u5165\u5927\u91cf\u65f6\u95f4\u548c\u91d1\u94b1\u8fdb\u884c\u5347\u5355\u3002**\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u5f00\u8bfe\u7b2c\u4e00\u4e2a\u6708\u5185\u8fdb\u884c\u4efb\u4f55\u5347\u5355\u52a8\u4f5c**\u3002\u5fc5\u987b\u5148\u5b8c\u6210\u201c\u5bb6\u5ead\u77e5\u60c5\u6743\u201d\u6838\u67e5\u548c\u521d\u671f\u5b66\u4e60\u9002\u5e94\u6027\u8bc4\u4f30\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u5355\u7eaf\u60f3\u5728\u4e1a\u4f59\u65f6\u95f4\u627e\u70b9\u4e8b\u505a\uff0c\u8d5a\u70b9\u732b\u7cae\u94b1**\u201d \u2014\u2014 \u5b9a\u4e49\u52a8\u673a\uff08\u517c\u804c\u53d8\u73b0+\u5174\u8da3\u63a2\u7d22\uff09\n2. > \u201c**\u76ee\u524d\u611f\u89c9\u627e\u91cd\u97f3\u548c\u65ad\u53e5\u4e0a\u9762\u6bd4\u8f83\u6b20\u7f3a\uff0c\u58f0\u8c03\u548c\u8bed\u901f\u8c03\u6574\u4e0a\u4e5f\u6709\u6b20\u7f3a**\u201d \u2014\u2014 \u5c55\u73b0\u9ad8\u5fc3\u7406\u5f39\u6027\uff08\u81ea\u6211\u5f52\u56e0\u3001\u5177\u4f53\u5206\u6790\uff09\n3. > \u201c**\u6211\u662f\u533b\u7597\u5668\u68b0QA\u5de5\u7a0b\u5e08\uff0c\u7a7a\u95f2\u65f6\u95f4\u4f1a\u53bb\u505a\u5b66\u79d1\u8f85\u5bfc\u8001\u5e08**\u201d \u2014\u2014 \u63ed\u793a\u804c\u4e1a\u80cc\u666f\uff08\u903b\u8f91\u6027\u5f3a\u3001\u6709\u8868\u8fbe\u57fa\u7840\uff09\u548c\u6f5c\u5728\u7684\u65f6\u95f4\u7ba1\u7406\u6311\u6218\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4\u641e\u94b1\u7ed3\u679c\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u4e0e\u4ef7\u503c\u8bc1\u660e\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u504f\u9ad8\u3011**\uff0c**\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f \u3010\u5f00\u8bfe\u4e00\u5468\u5185\u5fc5\u987b\u5b8c\u6210\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u5bb6\u5ead\u77e5\u60c5\u6c9f\u901a\u8f85\u52a9\u5305\"}\n```";
