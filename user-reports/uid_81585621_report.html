    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u5c0f\u5341\u4e00 (UID: 81585621) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-02-09 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5341\u4e03(\u90d1\u6676\u6676) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u5199\u4f5c\u57fa\u7840\u77ed\u6545\u4e8b\u8bfe\u7a0b (\u63a8\u6d4b) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u7f3a\u5931** (\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u65e0\u6cd5\u5224\u65ad) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u6781\u4f4e** (\u957f\u671f\u52a0\u73ed\u3001\u5e26\u5a03\u3001\u751f\u75c5\uff0c\u6301\u7eed\u7f3a\u5e2d\u76f4\u64ad\u4e0e\u8bfe\u7a0b\u5b66\u4e60) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** (\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** (\u5173\u952e\u4fe1\u606f\u5982\u652f\u4ed8\u65b9\u5f0f\u3001\u5bb6\u5ead\u652f\u6301\u3001\u5177\u4f53\u804c\u4e1a\u4e0e\u6536\u5165\u3001\u5b66\u4e60\u76ee\u6807\u5747\u672a\u63d0\u53ca) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u52a8\u673a\u6df7\u6742\uff0c\u65e2\u6709\u53d8\u73b0\u671f\u5f85\uff08\u63d0\u53ca\u201c\u6bdb\u6bdb\u201d\u6536\u76ca\uff09\uff0c\u4e5f\u6709\u6280\u80fd\u63d0\u5347\u9700\u6c42\uff08\u8be2\u95ee\u6295\u7a3f\u6d41\u7a0b\uff09\uff0c\u4f46\u7f3a\u4e4f\u660e\u786e\u3001\u5f3a\u70c8\u7684\u77ed\u671f\u53d8\u73b0\u538b\u529b\u6216\u957f\u671f\u7cbe\u8fdb\u89c4\u5212\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8fd9\u4e2a\u6211\u9009\u7b2c\u51e0\u671f\u5462\uff1f\u56e0\u4e3a\u6211\u73b0\u5728\u90a3\u4e2a\u8fd8\u6ca1\u4e0a\uff0c\u8fd8\u6ca1\u4e0a\u5462\uff0c\u5c31\u662f\u90a3\u4e2a\u4f5c\u4e1a\u5185\u5bb9\u3002\u201d (\u5bf9\u5347\u5355\u8bfe\u7a0b\u6709\u521d\u6b65\u5174\u8da3\uff0c\u4f46\u53d7\u9650\u4e8e\u5f53\u524d\u8fdb\u5ea6)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 \u80fd\u8003\u86511880\u5143\u7684\u6539\u7a3f\u8bfe\u5347\u5355\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u56f0\u96be\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[**\u6781\u4f4e**] \u2014 **\u6838\u5fc3\u77ed\u677f**\u3002\u4ece\u8fc7\u5e74\uff082\u6708\uff09\u52304\u6708\uff0c\u6301\u7eed\u56e0\u201c\u54b3\u55fd\u201d\u3001\u201c\u52a0\u73ed\u201d\u3001\u201c\u5e26\u5a03\u201d\u65e0\u6cd5\u5b66\u4e60\u3001\u770b\u76f4\u64ad\u3001\u5b8c\u6210\u4f5c\u4e1a\u3002\u7269\u7406\u65f6\u95f4\u88ab\u4e25\u91cd\u6324\u5360\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[**\u4fe1\u606f\u7f3a\u5931**] \u2014 \u672a\u63d0\u53ca\uff0c\u4f46\u5e26\u5a03\u4efb\u52a1\u53ef\u80fd\u6697\u793a\u5bb6\u5ead\u65f6\u95f4\u5206\u914d\u7d27\u5f20\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u6001\u5ea6\u79ef\u6781\u3001\u914d\u5408\uff0c\u5bf9\u73ed\u4e3b\u4efb\u7684\u50ac\u4fc3\u548c\u5e2e\u52a9\u8868\u793a\u611f\u8c22\uff08\u4f7f\u7528[\u73ab\u7470][\u5472\u7259]\u7b49\u8868\u60c5\uff09\u3002\u9047\u5230\u56f0\u96be\uff08\u751f\u75c5\u3001\u5fd9\uff09\u65f6\u9009\u62e9\u5ef6\u671f\u800c\u975e\u62b1\u6028\u6216\u653e\u5f03\uff0c\u4f46\u9700\u8981\u73ed\u4e3b\u4efb\u7684\u6301\u7eed\u63d0\u9192\u548c\u7b80\u5316\u4efb\u52a1\u7684\u5e2e\u52a9\uff08\u5982\u8bf7\u6c42\u5f55\u5c4f\u6559\u7a0b\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u90fd\u8fd8\u6ca1\u5b66\u8fc7\u8bfe\u73ed\u73ed[\u7834\u6d95\u4e3a\u7b11]\u201d (\u9762\u5bf9\u50ac\u4f5c\u4e1a\uff0c\u4ee5\u81ea\u5632\u65b9\u5f0f\u5766\u8bda\u8fdb\u5ea6\u843d\u540e\uff0c\u672a\u8868\u73b0\u51fa\u5bf9\u6297\u6216\u7126\u8651)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42 (\u5f52\u5c5e\u611f\u4e0e\u8fde\u63a5)** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u65f6\u95f4\u6781\u5ea6\u7a00\u7f3a\u4e0b\u7684\u201c\u88ab\u843d\u4e0b\u201d\u7684\u7126\u8651\u4e0e\u5b64\u72ec\u611f**\u3002\u5979\u8eab\u5904\u201c\u52a0\u73ed+\u5e26\u5a03+\u751f\u75c5\u201d\u7684\u591a\u91cd\u538b\u529b\u4e2d\uff0c\u6e34\u671b\u8ddf\u4e0a\u793e\u7fa4\u8282\u594f\u3001\u83b7\u5f97\u8ba4\u53ef\uff0c\u4f46\u73b0\u5b9e\u6761\u4ef6\u4e0d\u5141\u8bb8\uff0c\u56e0\u6b64\u8868\u73b0\u51fa\u5bf9\u73ed\u4e3b\u4efb\u5173\u6000\u7684\u4f9d\u8d56\u548c\u201c\u6c42\u6559\u7a0b\u201d\u7684\u88ab\u52a8\u6c42\u52a9\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u201d\u4e0e\u201c\u88ab\u4f53\u8c05\u201d\u7684\u966a\u4f34\u611f**\u3002\u5728\u5979\u56e0\u5ba2\u89c2\u539f\u56e0\u65e0\u6cd5\u8ddf\u4e0a\u65f6\uff0c\u7ed9\u4e88\u7406\u89e3\u800c\u975e\u538b\u529b\uff0c\u63d0\u4f9b\u201c\u50bb\u74dc\u5f0f\u201d\u7684\u89e3\u51b3\u65b9\u6848\uff08\u5982\u5f55\u5c4f\uff09\uff0c\u8ba9\u5979\u611f\u5230\u81ea\u5df1\u4ecd\u662f\u96c6\u4f53\u7684\u4e00\u5458\uff0c\u6ca1\u6709\u88ab\u629b\u5f03\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfea C1 \u7c7b** (\u6709\u5b66\u4e60\u610f\u613f\u4f46\u8d44\u6e90\u4e25\u91cd\u4e0d\u8db3\uff0c\u9700\u7b80\u5316\u8def\u5f84\u4e0e\u60c5\u7eea\u652f\u6301) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u8f7b\u5ea6\u7248)\u3002\u6838\u5fc3\u7279\u5f81\uff1a**\u9ad8\u60c5\u7eea\u4f9d\u8d56\u3001\u4f4e\u884c\u52a8\u80fd\u91cf\u3001\u6613\u56e0\u5ba2\u89c2\u56f0\u96be\u505c\u6ede**\u3002\u5979\u9700\u8981\u6301\u7eed\u7684\u5916\u90e8\u9f13\u52b1\u548c\u6781\u7b80\u5316\u7684\u4efb\u52a1\u6307\u5f15\uff0c\u800c\u975e\u786c\u6838\u6311\u6218\u3002 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1] (\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5ead\u6781\u7aef\u53cd\u5bf9\u7b49\u4fe1\u53f7)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a[\u4e0d\u9002\u7528]\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | [\u4f4e] | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u5e26\u5a03\u538b\u529b\u53ef\u80fd\u8f6c\u5316\u4e3a\u65f6\u95f4\u51b2\u7a81\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **[\u9ad8]** | **\u8fd9\u662f\u6700\u5927\u98ce\u9669\uff01** \u957f\u671f\u56e0\u201c\u5fd9/\u75c5\u201d\u65e0\u6cd5\u5b66\u4e60\uff0c\u4f5c\u4e1a\u79ef\u538b\u4ea7\u751f\u6301\u7eed\u8d1f\u7f6a\u611f\uff0c\u6700\u7ec8\u53ef\u80fd\u56e0\u201c\u8ddf\u4e0d\u4e0a\u3001\u5b66\u4e0d\u5b8c\u201d\u800c\u653e\u5f03\u5e76\u5bfb\u6c42\u9000\u8d39\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | [\u4e2d] | \u82e5\u5728\u751f\u75c5\u3001\u75b2\u60eb\u65f6\u88ab\u5f3a\u786c\u50ac\u4fc3\u6216\u65bd\u52a0\u201c\u843d\u540e\u201d\u7684\u538b\u529b\uff0c\u53ef\u80fd\u60c5\u7eea\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | [\u4f4e] | \u5f53\u524d\u5c1a\u672a\u8fdb\u5165\u53d8\u73b0\u5b9e\u64cd\u9636\u6bb5\uff0c\u4e14\u52a8\u673a\u975e\u7eaf\u77ed\u671f\u641e\u94b1\uff0c\u77ed\u671f\u6536\u76ca\u843d\u5dee\u98ce\u9669\u8f83\u4f4e\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u8bfe\u7a0b\u4e2d\u540e\u671f (\u7b2c4-6\u5468)**\u3002\u5f53\u57fa\u7840\u4f5c\u4e1a\u79ef\u538b\u8fc7\u591a\uff0c\u770b\u5230\u540c\u671f\u5b66\u5458\u5f00\u59cb\u6295\u7a3f\u3001\u63a5\u5355\uff0c\u800c\u81ea\u5df1\u4ecd\u5361\u5728\u7b2c\u4e00\u6b65\u65f6\uff0c\u632b\u8d25\u611f\u548c\u65e0\u529b\u611f\u5c06\u8fbe\u5230\u9876\u5cf0\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u5979\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u5979\u8bf4......\u201d**\n> \u201c\u5c0f\u5341\u4e00\uff0c\u770b\u5230\u4f60\u53c8\u8981\u5de5\u4f5c\u53c8\u8981\u5e26\u5a03\uff0c\u771f\u7684\u7279\u522b\u4e0d\u5bb9\u6613\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u6700\u5927\u7684\u597d\u5904\u5c31\u662f**\u968f\u65f6\u80fd\u5b66\u3001\u968f\u65f6\u80fd\u505c**\uff0c\u5b8c\u5168\u8ddf\u7740\u4f60\u7684\u8282\u594f\u6765\u3002\u4f60\u4e0d\u7528\u62c5\u5fc3\u843d\u4e0b\uff0c\u6bcf\u6b21\u6211\u7ed9\u4f60\u53d1\u7684\u90fd\u662f\u2018\u6700\u5c0f\u53ef\u884c\u4efb\u52a1\u5305\u2019\uff0c\u51e0\u5206\u949f\u5c31\u80fd\u641e\u5b9a\u3002\u54b1\u4eec\u7684\u76ee\u6807\u4e0d\u662f\u8d76\u8fdb\u5ea6\uff0c\u800c\u662f**\u6bcf\u5b8c\u6210\u4e00\u5c0f\u6b65\uff0c\u90fd\u7ed9\u81ea\u5df1\u70b9\u4e2a\u8d5e**\u3002\u6709\u4efb\u4f55\u5361\u4f4f\u7684\u5730\u65b9\uff0c\u968f\u65f6\u558a\u6211\uff0c\u6211\u5e2e\u4f60\u62c6\u6210\u2018\u5a74\u513f\u6b65\u2019\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\u3011**\u3002\u6838\u5fc3\u662f\u964d\u4f4e\u5b66\u4e60\u8d1f\u8377\u548c\u60c5\u7eea\u538b\u529b\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u6302\u8f7d **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u63d0\u4f9b\uff1a1) \u8d85\u8be6\u7ec6\u5f55\u5c4f\u8ddf\u505a\u6559\u7a0b\uff1b2) \u5141\u8bb8\u4f5c\u4e1a\u201c\u6253\u5361\u5f0f\u201d\u7b80\u5316\u63d0\u4ea4\uff08\u5982\u53ea\u4ea4\u5f00\u5934\uff09\uff1b3) \u5b9a\u671f\u53d1\u9001\u201c\u4f60\u5df2\u7ecf\u5f88\u68d2\u4e86\u201d\u7b49\u9f13\u52b1\u8bdd\u672f\uff1b4) **\u4e25\u7981**\u5728\u7fa4\u5185\u516c\u5f00\u8868\u626c\u8fdb\u5ea6\u5feb\u7684\u5b66\u5458\u523a\u6fc0\u5979\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u8981**\u7528\u201c\u522b\u4eba\u90fd\u4ea4\u4e86\u201d\u3001\u201c\u4f60\u518d\u4e0d\u5b66\u5c31\u665a\u4e86\u201d\u7b49\u8bdd\u672f\u65bd\u538b\u3002\n    2. **\u7edd\u4e0d\u8981**\u7ed9\u5979\u5e03\u7f6e\u9700\u8981\u5927\u5757\u65f6\u95f4\uff08\u8d85\u8fc730\u5206\u949f\uff09\u7684\u590d\u6742\u4efb\u52a1\u3002\n    3. **\u7edd\u4e0d\u8981**\u5728\u5979\u8868\u793a\u201c\u5fd9/\u75c5\u201d\u65f6\uff0c\u4ecd\u5f3a\u884c\u63a8\u9500\u76f4\u64ad\u8bfe\u6216\u5347\u5355\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u73b0\u6709\u8bfe\u7a0b\u672a\u5b8c\u6210\u3001\u65f6\u95f4\u95ee\u9898\u672a\u89e3\u51b3\u524d\uff0c\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u4f1a\u52a0\u5267\u5979\u7684\u7126\u8651\u548c\u8d1f\u7f6a\u611f\uff0c\u6781\u6613\u5f15\u53d1\u9000\u8d39\u3002\u672c\u6b21\u6539\u7a3f\u8bfe\u54a8\u8be2\u5e94\u51b7\u5374\u5904\u7406\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u90fd\u8fd8\u6ca1\u5b66\u8fc7\u8bfe\u73ed\u73ed[\u7834\u6d95\u4e3a\u7b11]\u201d **(\u5178\u578bT6\u81ea\u5632\u5f0f\u6c42\u52a9\uff0c\u66b4\u9732\u8fdb\u5ea6\u4e25\u91cd\u6ede\u540e\u4e0e\u65e0\u529b\u611f)**\n2. > \u201c\u53ef\u4ee5\u76f4\u63a5\u5e2e\u6211\u5f55\u4e2a\u89c6\u9891\u5417\u73ed\u73ed\uff1f\u90a3\u4e2a\u4e00\u952e\u6210\u6587\u7684[\u5472\u7259][\u5472\u7259]\u201d **(\u9ad8\u4f9d\u8d56\u3001\u6c42\u7b80\u5316\uff0c\u884c\u52a8\u80fd\u91cf\u4f4e)**\n3. > \u201c\u5e26\u5a03\u5462\u73ed\u73ed[\u7834\u6d95\u4e3a\u7b11]\u201d & \u201c\u5728\u52a0\u73ed\u201d **(\u8d44\u6e90\u5e95\u5ea7\u201c\u65f6\u95f4\u4e0e\u7cbe\u529b\u201d\u677f\u6781\u77ed\u7684\u6838\u5fc3\u8bc1\u636e)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u578b (\u65f6\u95f4\u8d2b\u56f0\u7248)\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5f52\u5c5e\u611f\u4e0e\u4e0d\u88ab\u629b\u5f03\u3011**(\u9a6c\u65af\u6d1b\u7b2c\u4e09\u5c42)\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5207\u6362\u81f3\u201c\u7597\u6108\u966a\u4f34\u201d\u6a21\u5f0f\uff0c\u63d0\u4f9b\u50bb\u74dc\u5f0f\u4efb\u52a1\u5305\u4e0e\u65e0\u538b\u529b\u60c5\u7eea\u652f\u6301\uff0c\u5f7b\u5e95\u505c\u6b62\u65bd\u538b\u4e0e\u5347\u5355\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u793e\u4ea4\u9700\u6c42\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
