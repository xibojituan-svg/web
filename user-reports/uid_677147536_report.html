        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677147536 (Sprite Eva) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u62db\u52df\u5b98\uff08\u66f9\u6d01\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6500\u767b\u8ba1\u5212\u9ad8\u9636\u7248 (\u56db\u4e2a\u6708\u7cfb\u7edf\u8bfe) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u652f\u4ed8\u65b9\u5f0f\u3001\u91d1\u989d\u3001\u5206\u671f\u6216\u8d44\u91d1\u6765\u6e90\u3002\u65e0\u6cd5\u5224\u65ad\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u63d0\u53ca\u201c\u8d81\u7740\u5c0f\u670b\u53cb\u6d17\u6fa1\u7684\u95f4\u9699\u5f55\u7684\u201d\uff0c\u8868\u660e\u662f\u5b9d\u5988\uff0c\u9700\u7167\u987e\u5b69\u5b50\uff0c\u5b66\u4e60\u65f6\u95f4\u88ab\u4e25\u91cd\u788e\u7247\u5316\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\u3002\u672a\u63d0\u53ca\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u7f3a\u5931\u652f\u4ed8\u3001\u5bb6\u5ead\u652f\u6301\u3001\u5de5\u4f5c/\u6536\u5165\u72b6\u51b5\u3001\u6bcf\u65e5\u56fa\u5b9a\u53ef\u7528\u65f6\u95f4\u7b49\u5173\u952e\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u27a1\u4e2d\n- **\u7279\u5f81\u901f\u5199**\uff1a\u5174\u8da3\u9a71\u52a8\u4e0e\u53d8\u73b0\u671f\u5f85\u6df7\u5408\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u4e86\u5bf9\u6709\u58f0\u6f14\u64ad\u7684\u5174\u8da3\uff08\u559c\u6b22\u60ac\u7591\u5c0f\u8bf4\u3001\u7ed9\u5b69\u5b50\u8bb2\u6545\u4e8b\uff09\uff0c\u5e76\u5e0c\u671b\u5c06\u5176\u53d1\u5c55\u4e3a\u4e00\u4efd\u80fd\u517c\u987e\u5bb6\u5ead\u7684\u526f\u4e1a\uff0c\u4f46\u5bf9\u201c\u591a\u4e45\u80fd\u8d5a\u94b1\u201d\u7b49\u53d8\u73b0\u7ec6\u8282\u672a\u4e3b\u52a8\u8ffd\u95ee\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u4e2a\u4eba\u6bd4\u8f83\u559c\u6b22\u7684\u5c31\u662f\u60ac\u7591\u5c0f\u8bf4\uff0c\u7136\u540e\u5e73\u5e38\u5728\u5bb6\u91cc\u5c31\u662f\u7ecf\u5e38\u7ed9\u5c0f\u670b\u53cb\u8bb2\u4e00\u4e9b\u7ae5\u8bdd\u6545\u4e8b\u90a3\u4e9b...\u518d\u4e00\u4e2a\u4e5f\u60f3\u5c31\u662f\u8bf4\uff0c\u628a\u4e00\u4e9b\u5173\u4e8e\u5c31\u662f\u7ae5\u8bdd\u6545\u4e8b\u65b9\u9762\u7684\uff0c\u7136\u540e\u7ecf\u5e38\u53ef\u4ee5\u653e\u7ed9\u5c0f\u670b\u53cb\u542c...\u6211\u5c31\u662f\u60f3\u6709\u4e00\u4efd\u8fd9\u6837\u7684\u5de5\u4f5c\uff01\u53ef\u4ee5\u517c\u987e\u5bb6\u5ead\u7684\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u65e0\u6cd5\u8bc4\u7ea7** \u2014 \u804a\u5929\u8bb0\u5f55\u5b8c\u5168\u672a\u63d0\u53ca\u4efb\u4f55\u7ecf\u6d4e\u72b6\u51b5\u3001\u652f\u4ed8\u80fd\u529b\u6216\u4ef7\u683c\u654f\u611f\u5ea6\u3002\u6b64\u4e3a\u91cd\u5927\u98ce\u9669\u76f2\u533a\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e** \u2014 \u8bc1\u636e\uff1a\u201c\u8d81\u7740\u5c0f\u670b\u53cb\u6d17\u6fa1\u7684\u95f4\u9699\u5f55\u7684\u201d\u3002\u660e\u786e\u4e3a\u5b9d\u5988\u8eab\u4efd\uff0c\u5b66\u4e60\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\u4e14\u4e0d\u53ef\u63a7\uff0c\u5c5e\u4e8e\u5178\u578b\u201c\u5e26\u5a74\u5e7c\u513f\u5b9d\u5988\u76843\u5c0f\u65f6 \u2260 \u6807\u51c6\u4e0a\u73ed\u65cf\u76843\u5c0f\u65f6\u201d\u9677\u9631\u3002\u7cbe\u529b\u88ab\u80b2\u513f\u5927\u91cf\u5360\u7528\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u65e0\u6cd5\u8bc4\u7ea7** \u2014 \u672a\u63d0\u53ca\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\u3002\u6b64\u4e3a\u9ad8\u98ce\u9669\u672a\u77e5\u9879\u3002\n- **\u5e95\u5ea7\u53d6\u77ed\u677f**\uff1a**\u4f4e**\u3002\u65f6\u95f4\u7ef4\u5ea6\u5df2\u786e\u8ba4\u4e3a\u4f4e\uff0c\u4e14\u8d44\u91d1\u3001\u5bb6\u5ead\u652f\u6301\u4e24\u5927\u5173\u952e\u7ef4\u5ea6\u4fe1\u606f\u7f3a\u5931\uff0c\u6309\u6700\u4fdd\u5b88\u539f\u5219\uff0c\u5e95\u5ea7\u8bc4\u7ea7\u4e3a**\u4f4e**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u7528\u6237\u591a\u6b21\u8868\u8fbe\u4e0d\u81ea\u4fe1\u548c\u7d27\u5f20\uff0c\u9700\u8981\u5916\u90e8\u6301\u7eed\u80af\u5b9a\uff0c\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u5982\u7422\u78e8\u91cd\u97f3\uff09\u4f1a\u9677\u5165\u957f\u65f6\u95f4\u7ea0\u7ed3\uff0c\u4f9d\u8d56\u9500\u552e\u7684\u5177\u4f53\u6307\u5bfc\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u53ef\u80fd\u6211\u8981\u662f\u7528\u90a3\u4e2a\u8ddf\u5c0f\u670b\u53cb\u8bb2\u6545\u4e8b\u7684\u90a3\u79cd\u8bed\u6c14\u4f1a\u66f4\u597d...\u4f46\u662f\u6211\u5c31\u662f\u4e0d\u77e5\u9053\u6211\u8fd9\u4e2a\u58f0\u97f3\u5230\u5e95\u5408\u4e0d\u5408\u9002\u3002\u201d > \u201c\u6536\u5230\uff0c\u8fd8\u662f\u6bd4\u8f83\u7d27\u5f20\uff01\u201d > \u201c\u4eca\u5929\u4e0b\u5348\u8fd8\u4e00\u76f4\u5728\u90a3\u91cc\u7422\u78e8\u90a3\u4e2a\u51ed\u8bc1\u548c\u91cd\u70b9\u8fd9\u4e2a\u4e8b\u60c5\uff0c\u4e00\u76f4\u90fd\u8fd8\u6ca1\u7422\u78e8\u660e\u3002\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c** \u4e0e **\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e** \u6df7\u5408\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u8eab\u4efd\u7126\u8651\u4e0e\u4ef7\u503c\u611f\u7f3a\u5931**\u3002\u4f5c\u4e3a\u5b9d\u5988\uff0c\u5e0c\u671b\u5728\u5bb6\u5ead\u89d2\u8272\u4e4b\u5916\u627e\u5230\u4e00\u4efd\u80fd\u517c\u987e\u5b69\u5b50\u3001\u53c8\u80fd\u8bc1\u660e\u81ea\u6211\u4ef7\u503c\u3001\u83b7\u5f97\u7ecf\u6d4e\u72ec\u7acb\u611f\u7684\u4e8b\u4e1a\u3002\u6df1\u5c42\u6050\u60e7\u662f\u201c\u4e0e\u793e\u4f1a\u8131\u8282\u201d\u548c\u201c\u81ea\u6211\u4ef7\u503c\u88ab\u5ffd\u89c6\u201d\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u80af\u5b9a\u4e0e\u201c\u88ab\u770b\u89c1\u201d**\u3002\u5979\u9700\u8981\u6301\u7eed\u3001\u5177\u4f53\u7684\u6b63\u9762\u53cd\u9988\u6765\u5bf9\u6297\u201c\u6211\u4e0d\u884c\u201d\u7684\u81ea\u6211\u6000\u7591\uff0c\u540c\u65f6\u9700\u8981\u4e00\u4e2a\u6e05\u6670\u7684\u3001\u80fd\u517c\u987e\u5bb6\u5ead\u7684\u201c\u6210\u957f\u5988\u5988\u201d\u4eba\u8bbe\u8def\u5f84\uff0c\u6765\u6ee1\u8db3\u5176\u5c0a\u91cd\u4e0e\u5f52\u5c5e\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5 C2\u7c7b\uff08\u51b2\u52a8\u98ce\u9669\u578b\uff09** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u660e\u786e\u501f\u8d37\u3001\u751f\u5b58\u5371\u673a\u3001\u5bb6\u5ead\u6fc0\u70c8\u53cd\u5bf9\u7b49D\u7c7b\u7194\u65ad\u4fe1\u53f7\u3002**\u4f46\u8d44\u91d1\u4e0e\u5bb6\u5ead\u652f\u6301\u4fe1\u606f\u5b8c\u5168\u7f3a\u5931\uff0c\u5b58\u5728\u6f5c\u5728D\u7c7b\u98ce\u9669\u3002**\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u9ad8** | \u5bb6\u4eba\u4e0d\u77e5\u60c5\uff0c\u62a5\u540d\u540e\u56e0\u8d39\u7528\u6216\u65f6\u95f4\u5360\u7528\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u6781\u9ad8** | \u5e26\u5a03\u7cbe\u529b\u8017\u5c3d\uff0c\u65e0\u6cd5\u8ddf\u4e0a\u76f4\u64ad\u8bfe\u548c\u4f5c\u4e1a\u8282\u594f\uff0c\u4ea7\u751f\u5f3a\u70c8\u632b\u8d25\u611f\u548c\u81ea\u8d23\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | \u7b2c\u4e00\u6b21\u72ec\u7acb\u5b8c\u6210\u590d\u6742\u4f5c\u4e1a\uff08\u5982\u540e\u671f\u3001\u5bf9\u8f68\uff09\u53d7\u632b\uff0c\u6216\u8bd5\u97f3\u591a\u6b21\u5931\u8d25\uff0c\u81ea\u5c0a\u5fc3\u4e25\u91cd\u53d7\u635f\uff0c\u76f4\u63a5\u653e\u5f03\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u5b66\u4e601-2\u4e2a\u6708\u540e\uff0c\u53d1\u73b0\u63a5\u5355\u8fdc\u4e0d\u5982\u9500\u552e\u63cf\u8ff0\u7684\u201c\u7b2c\u4e8c\u5468\u5373\u53ef\u8bd5\u97f3\u201d\u90a3\u4e48\u5bb9\u6613\uff0c\u4ea7\u751f\u201c\u88ab\u9a97\u201d\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-3\u5468\u540e**\u3002\u5f53\u8bfe\u7a0b\u96be\u5ea6\u63d0\u5347\u3001\u4f5c\u4e1a\u91cf\u589e\u52a0\uff0c\u4e0e\u5e26\u5a03\u7684\u788e\u7247\u5316\u65f6\u95f4\u4ea7\u751f\u4e0d\u53ef\u8c03\u548c\u7684\u51b2\u7a81\u65f6\uff0c\u60c5\u7eea\u5d29\u6e83\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cEva\u5988\u5988\u4f60\u597d\uff01\u770b\u5230\u4f60\u4e3a\u4e86\u517c\u987e\u5b9d\u5b9d\u548c\u5174\u8da3\u8fd9\u4e48\u52aa\u529b\uff0c\u771f\u7684\u7279\u522b\u4f69\u670d\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u5f88\u591a\u5b9d\u5988\u540c\u5b66\uff0c\u5927\u5bb6\u6700\u61c2\u65f6\u95f4\u88ab\u5207\u788e\u7684\u8f9b\u82e6\u4e86\u3002\u522b\u62c5\u5fc3\u8ddf\u4e0d\u4e0a\uff0c\u6211\u4eec\u7684\u5b66\u4e60\u8282\u594f\u5c31\u662f\u4e3a\u2018\u5988\u5988\u65f6\u95f4\u2019\u8bbe\u8ba1\u7684\uff0c\u5b8c\u6210\u6bd4\u5b8c\u7f8e\u66f4\u91cd\u8981\u3002\u4f60\u4e4b\u524d\u7ed9\u5b69\u5b50\u8bb2\u6545\u4e8b\u7684\u7ecf\u9a8c\u5c31\u662f\u6700\u68d2\u7684\u8d77\u70b9\uff0c\u6211\u4eec\u4e00\u8d77\u628a\u5b83\u53d8\u6210\u4f60\u7684\u95ea\u5149\u70b9\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\u3011** + **\u3010\u5174\u8da3\u6e38\u4e50\u7ebf\u3011**\u3002\u9996\u8981\u76ee\u6807\u662f\u5efa\u7acb\u5b66\u4e60\u4fe1\u5fc3\u548c\u793e\u7fa4\u5f52\u5c5e\u611f\uff0c\u800c\u975e\u5f3a\u63a8\u53d8\u73b0\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n    1.  **\u3010\u5b9d\u5988\u65f6\u95f4\u7ba1\u7406\u8f7b\u91cf\u5305\u3011**\uff1a\u63d0\u4f9b\u788e\u7247\u5316\u5b66\u4e60\u6307\u5357\u3001\u97f3\u9891\u8bfe\u7a0b\u968f\u65f6\u542c\u3001\u7075\u6d3b\u4ea4\u4f5c\u4e1a\u673a\u5236\u3002\n    2.  **\u3010\u5f3a\u53cd\u9988\u6fc0\u52b1\u5305\u3011**\uff1a\u73ed\u4e3b\u4efb\u9700\u5bf9\u5176\u6bcf\u4e00\u6b21\u4f5c\u4e1a\u3001\u54ea\u6015\u662f\u5c0f\u8fdb\u6b65\uff0c\u7ed9\u4e88\u5177\u4f53\u3001\u5938\u5f20\u7684\u6b63\u9762\u8bc4\u4ef7\u3002\n    3.  **\u3010\u793e\u7fa4\u5988\u5988\u56e2\u3011**\uff1a\u5c06\u5176\u5f15\u5165\u540c\u671f\u5b9d\u5988\u5b66\u5458\u5c0f\u7ec4\uff0c\u5f62\u6210\u4e92\u52a9\u6c1b\u56f4\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1.  \u7edd\u4e0d\u5bf9\u5979\u4f7f\u7528\u201c\u522b\u4eba\u90fd\u884c\u4f60\u600e\u4e48\u4e0d\u884c\u201d\u7684\u5bf9\u6bd4\u8bdd\u672f\u3002\n    2.  \u7edd\u4e0d\u5728\u5979\u8868\u8fbe\u201c\u6ca1\u65f6\u95f4\u201d\u65f6\u65bd\u538b\uff0c\u5e94\u5171\u60c5\u5e76\u63d0\u4f9b\u66ff\u4ee3\u65b9\u6848\u3002\n    3.  \u4e25\u7981\u5728\u5f00\u8bfe\u521d\u671f\u8fc7\u5ea6\u5f3a\u8c03\u63a5\u5355\u53d8\u73b0\uff0c\u907f\u514d\u5236\u9020\u7126\u8651\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u5b8c\u6210\u5f53\u524d\u8bfe\u7a0b\u5e76\u6709\u7a33\u5b9a\u4ea7\u51fa\u524d\uff0c\u7981\u6b62\u63a8\u8350\u4efb\u4f55\u9ad8\u9636\u6216\u9644\u52a0\u8bfe\u7a0b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u4e2a\u4eba\u6bd4\u8f83\u559c\u6b22\u7684\u5c31\u662f\u60ac\u7591\u5c0f\u8bf4\uff0c\u7136\u540e\u5e73\u5e38\u5728\u5bb6\u91cc\u5c31\u662f\u7ecf\u5e38\u7ed9\u5c0f\u670b\u53cb\u8bb2\u4e00\u4e9b\u7ae5\u8bdd\u6545\u4e8b\u90a3\u4e9b...\u518d\u4e00\u4e2a\u4e5f\u60f3\u5c31\u662f\u8bf4\uff0c\u628a\u4e00\u4e9b\u5173\u4e8e\u5c31\u662f\u7ae5\u8bdd\u6545\u4e8b\u65b9\u9762\u7684\uff0c\u7136\u540e\u7ecf\u5e38\u53ef\u4ee5\u653e\u7ed9\u5c0f\u670b\u53cb\u542c\u3002\u201d\n2. > \u201c\u4f46\u662f\u6211\u5c31\u662f\u4e0d\u77e5\u9053\u6211\u8fd9\u4e2a\u58f0\u97f3\u5230\u5e95\u5408\u4e0d\u5408\u9002\u3002\u201d \n3. > \u201c\u6628\u5929\u665a\u4e0a\u662f\u8d81\u7740\u5c0f\u670b\u53cb\u6d17\u6fa1\u7684\u95f4\u9699\u5f55\u7684\uff0c\u786e\u5b9e\u5f55\u5f97\u6025\u4e86\u70b9\uff01[\u7834\u6d95\u4e3a\u7b11]\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6\u60c5\u7eea\u5de8\u5a74\u578b\u5b9d\u5988**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u5728\u5bb6\u5ead\u8d23\u4efb\u4e2d\u5bfb\u627e\u81ea\u6211\u4ef7\u503c\u4e0e\u5b89\u5168\u611f\uff08\u5c0a\u91cd+\u5b89\u5168\u9700\u6c42\uff09**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u6781\u81f4\u7684\u60c5\u611f\u966a\u4f34\u3001\u788e\u7247\u5316\u5b66\u4e60\u652f\u6301\u3001\u4ee5\u53ca\u5c06\u201c\u5988\u5988\u201d\u8eab\u4efd\u8f6c\u5316\u4e3a\u5b66\u4e60\u4f18\u52bf\u800c\u975e\u969c\u788d**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\u4e0e\u7b2c\u56db\u5c42\u5c0a\u91cd\u9700\u6c42\u6df7\u5408\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf+\u5174\u8da3\u6e38\u4e50\u7ebf\"}\n```";
