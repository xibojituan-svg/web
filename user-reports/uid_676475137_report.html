    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4ec5\u4e3a\u8bfe\u7a0b\u4ea4\u4ed8\u8fc7\u7a0b\u4e2d\u7684\u6280\u672f\u7b54\u7591\u7247\u6bb5\uff0c\u4e25\u91cd\u7f3a\u5931\u4ee5\u4e0b\u5173\u952e\u4fe1\u606f\uff1a**\u652f\u4ed8\u65b9\u5f0f\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u5b66\u4e60\u52a8\u673a\u3001\u804c\u4e1a\u80cc\u666f\u3001\u6536\u5165\u72b6\u51b5\u3001\u8d2d\u4e70\u8bfe\u7a0b\u7684\u5177\u4f53\u540d\u79f0\u4e0e\u4ef7\u683c\u3001\u5bf9\u672a\u6765\u7684\u5177\u4f53\u671f\u671b**\u3002\u672c\u6b21\u8bca\u65ad\u4e3b\u8981\u57fa\u4e8e\u7528\u6237\u5728\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u7684\u884c\u4e3a\u6a21\u5f0f\u4e0e\u60c5\u7eea\u53cd\u5e94\u3002\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676475137 (\u6635\u79f0\uff1a\u672a\u4f53\u73b0) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-04 \u81f3 2026-03-19 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u4fde\u5927\u6f02\u4eae(\u4fde\u5e06)\u3001\u8bd7\u797a\u5eb7\u5eb7(\u5eb7\u8679)\u3001\u6f2b\u6f2b\u53e8\u53e8(\u76d6\u6d2a\u6f2b) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | **[\u4fe1\u606f\u7f3a\u5931]** (\u63a8\u6d4b\u4e3a\u6709\u58f0\u4e66/\u914d\u97f3\u76f8\u5173\u8bfe\u7a0b\uff0c\u5df2\u8fdb\u5165\u7b2c\u4e94\u3001\u516d\u5468\u5b66\u4e60) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **[\u4fe1\u606f\u7f3a\u5931]** |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **[\u4fe1\u606f\u7f3a\u5931]** (\u4ece\u9891\u7e41\u767d\u5929\u6c9f\u901a\u770b\uff0c\u6709\u4e00\u5b9a\u81ea\u7531\u652f\u914d\u65f6\u95f4) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **[\u4fe1\u606f\u7f3a\u5931]** |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u52a8\u673a\u6df7\u6742\uff0c\u65e2\u6709\u5b66\u4e60\u6280\u80fd\uff08\u4ea4\u4f5c\u4e1a\u3001\u7ec3\u4e60\uff09\u7684\u610f\u613f\uff0c\u53c8\u8868\u73b0\u51fa\u5bf9\u6280\u672f\u64cd\u4f5c\u56f0\u96be\u7684\u6781\u5927\u7126\u8651\u548c\u4f9d\u8d56\u3002**\u641e\u94b1\u76ee\u7684\u4e0d\u660e\u786e\uff0c\u66f4\u50cf\u662f\u201c\u4e3a\u5b66\u4e60\u800c\u5b66\u4e60\u201d\u6216\u5174\u8da3\u63a2\u7d22\u3002**\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u9ebb\u70e6\u8001\u5e08\u7ed9\u6279\u6539\u4e00\u4e0b\uff0c\u8c22\u8c22\u201d\uff1b\u201c\u62c5\u5fc3\u81ea\u5df1\u58f0\u97f3\u8868\u73b0\u529b\u4e0d\u591f\u597d\uff0c\u8fd8\u60f3\u591a\u5b66\u4e00\u4e9b\u201d\uff1b\u201c\u52a0\u4e2a\u76d8\u90fd\u628a\u6211\u52a0\u61f5\u4e86\uff0c\u7535\u8111\u53c8\u4e0d\u542c\u4f7f\u5524\u4e86[\u7834\u6d95\u4e3a\u7b11]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 \u65e0\u76f8\u5173\u4fe1\u606f\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 \u80fd\u575a\u6301\u4ea4\u4f5c\u4e1a\uff0c\u767d\u5929\u6709\u8f83\u591a\u65f6\u95f4\u6c9f\u901a\uff0c\u4f46\u5b66\u4e60\u6548\u7387\u53d7\u6280\u672f\u95ee\u9898\u4e25\u91cd\u62d6\u7d2f\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 \u65e0\u76f8\u5173\u4fe1\u606f\u3002\n- **\ud83d\udcbb \u6570\u5b57\u5de5\u5177\u80fd\u529b\uff1a[\u6781\u4f4e]** \u2014 **\u8fd9\u662f\u6700\u77ed\u4e14\u81f4\u547d\u7684\u77ed\u677f\u3002** \u7528\u6237\u5bf9\u7535\u8111\u57fa\u7840\u64cd\u4f5c\uff08\u8f6f\u4ef6\u5b89\u88c5\u3001\u5378\u8f7d\u3001\u6587\u4ef6\u7ba1\u7406\u3001\u683c\u5f0f\u8f6c\u6362\u3001\u786c\u4ef6\u8bc6\u522b\uff09\u5b58\u5728\u5de8\u5927\u969c\u788d\uff0c\u9891\u7e41\u56e0\u6280\u672f\u95ee\u9898\u5361\u58f3\u3001\u5d29\u6e83\uff0c\u4e25\u91cd\u4f9d\u8d56\u73ed\u4e3b\u4efb\u7684\u201c\u624b\u628a\u624b\u201d\u6307\u5bfc\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b07\u4f4e\u6781\u5371]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u9762\u5bf9\u6280\u672f\u95ee\u9898\u6781\u6613\u4ea7\u751f\u632b\u8d25\u611f\uff08\u201c\u6211\u771f\u7684\u5d29\u6e83\u4e86\u201d\uff09\uff0c\u9700\u8981\u73ed\u4e3b\u4efb\u53cd\u590d\u3001\u5177\u4f53\u3001\u751a\u81f3\u4fdd\u59c6\u5f0f\u7684\u6307\u5bfc\u3002\u60c5\u7eea\u5916\u9732\u660e\u663e\uff0c\u81ea\u6211\u6548\u80fd\u611f\u6781\u4f4e\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u9a6c\u5361\u4e39\u4e39\uff0c\u5e2e\u6211\u770b\u4e00\u4e0b\uff0c\u8fd9\u662f\u5565\u60c5\u51b5\u5440\uff0c\u6211\u771f\u7684\u5d29\u6e83\u4e86\u3002\u201d\uff1b\u201c\u6211\u62c5\u5fc3\u53c8\u5c11\u70b9\u5565[\u7834\u6d95\u4e3a\u7b11]\u5982\u679c\u4e0d\u5bf9\u6211\u518d\u4e0b\u4e00\u904d\u201d\uff1b\u201c\u6211\u8fd9\u4e0d\u662f\u628a\u5b83\u90a3\u4e2a\u52a0\u4e86\u4e2a\u786c\u76d8\uff0c\u6211\u4e0d\u77e5\u9053\u4e0b\u6ca1\u4e0b\u4e0a\u3002\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 / \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e25\u91cd\u7684\u6570\u5b57\u65f6\u4ee3\u8131\u8282\u4e0e\u6280\u80fd\u7126\u8651**\u3002\u5176\u6838\u5fc3\u75db\u82e6\u5e76\u975e\u6765\u81ea\u884c\u4e1a\u7ade\u4e89\uff0c\u800c\u662f\u6765\u81ea\u65e0\u6cd5\u9a7e\u9a6d\u5b66\u4e60\u5de5\u5177\u672c\u8eab\uff0c\u8fd9\u5bfc\u81f4\u5f3a\u70c8\u7684\u65e0\u80fd\u611f\u548c\u5bf9\u6743\u5a01\uff08\u73ed\u4e3b\u4efb\uff09\u7684\u6df1\u5ea6\u4f9d\u8d56\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4fdd\u59c6\u5f0f\u7684\u3001\u4e0d\u538c\u5176\u70e6\u7684\u201c\u6280\u672f\u5b89\u5168\u611f\u201d\u4e0e\u201c\u88ab\u63a5\u7eb3\u611f\u201d**\u3002\u4ed6\u9700\u8981\u88ab\u660e\u786e\u544a\u77e5\u201c\u8fd9\u5f88\u6b63\u5e38\uff0c\u6211\u4e00\u6b65\u6b65\u6559\u4f60\u201d\uff0c\u800c\u4e0d\u662f\u88ab\u53cd\u95ee\u201c\u73ed\u4f1a\u4f60\u662f\u4e0d\u662f\u6ca1\u542c\u201d\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2 \u7c7b** (\u52a8\u673a\u4e2d\u7b49\u4f46\u80fd\u529b\u5e95\u5ea7\u6781\u4f4e\uff0c\u5b58\u5728\u9ad8\u5d29\u76d8\u98ce\u9669) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u5178\u578b\u7279\u5f81\uff1a\u6280\u672f\u5c0f\u767d\u3001\u60c5\u7eea\u6613\u5d29\u6e83\u3001\u6781\u5ea6\u4f9d\u8d56\u5916\u90e8\u6307\u5bfc\u3001\u81ea\u6211\u9a71\u52a8\u529b\u5f31) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1] (\u804a\u5929\u8bb0\u5f55\u672a\u663e\u793a\u501f\u8d37\u3001\u7edd\u5883\u7b49\u6781\u7aef\u60c5\u51b5)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a[\u672a\u89e6\u53d1]\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | [\u4f4e] | \u4fe1\u606f\u7f3a\u5931\uff0c\u6682\u65e0\u6cd5\u5224\u65ad\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **[\u6781\u9ad8]** | **\u56e0\u6280\u672f\u95ee\u9898\uff08\u8f6f\u4ef6\u5b89\u88c5\u3001\u4f5c\u4e1a\u63d0\u4ea4\u3001\u8bbe\u5907\u6545\u969c\uff09\u79ef\u538b\u8fc7\u591a\uff0c\u4ea7\u751f\u201c\u6211\u5b66\u4e0d\u4f1a\u201d\u7684\u7edd\u671b\u611f\uff0c\u6700\u7ec8\u653e\u5f03\u3002** |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **[\u9ad8]** | **\u73ed\u4e3b\u4efb\u4e00\u6b21\u4e0d\u8010\u70e6\u7684\u56de\u590d\uff08\u5982\u201c\u4f60\u8981\u6c14\u6b7b\u6211\u6211\u7684\u73ed\u4f1a\u4f60\u662f\u4e00\u70b9\u6ca1\u542c\u201d\uff09\u3001\u6216\u8fde\u7eed\u51e0\u6b21\u95ee\u9898\u5f97\u4e0d\u5230\u89e3\u51b3\uff0c\u81ea\u5c0a\u5fc3\u53d7\u632b\uff0c\u76f4\u63a5\u60c5\u7eea\u6027\u9000\u8d39\u3002** |\n| \u6536\u76ca\u843d\u5dee\u578b | [\u4e2d] | \u5982\u679c\u8bfe\u7a0b\u5ba3\u4f20\u8fc7\u5ea6\u5f3a\u8c03\u201c\u5feb\u901f\u63a5\u5355\u201d\uff0c\u800c\u4ed6\u8fde\u57fa\u7840\u8f6f\u4ef6\u64cd\u4f5c\u90fd\u56f0\u96be\uff0c\u4f1a\u4ea7\u751f\u88ab\u6b3a\u9a97\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u6bcf\u4e00\u6b21\u5e03\u7f6e\u65b0\u8f6f\u4ef6\u64cd\u4f5c\u6216\u590d\u6742\u4f5c\u4e1a\u540e\u768424-48\u5c0f\u65f6\u5185**\u3002\u4f8b\u5982\uff0c\u8981\u6c42\u5b89\u88c5\u65b0\u63d2\u4ef6\u3001\u4f7f\u7528\u65b0\u529f\u80fd\u3001\u63d0\u4ea4\u5927\u578b\u5de5\u7a0b\u6587\u4ef6\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> **\u201c\u4eb2\u7231\u7684\uff0c\u770b\u5230\u4f60\u5b66\u4e60\u8fd9\u4e48\u8ba4\u771f\uff0c\u7279\u522b\u68d2\uff01\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u7a0b\u4f1a\u7528\u5230\u4e00\u4e9b\u8f6f\u4ef6\uff0c\u522b\u62c5\u5fc3\uff0c\u64cd\u4f5c\u90fd\u662f\u719f\u80fd\u751f\u5de7\u7684\u3002\u4f60\u8bb0\u4f4f\uff0c\u6709\u4efb\u4f55\u5361\u4f4f\u7684\u5730\u65b9\uff0c\u968f\u65f6\u622a\u56fe\u6216\u5f55\u5c4f\u53d1\u6211\uff0c\u6211\u4fdd\u8bc1\u7ed9\u4f60\u2018\u63b0\u5f00\u4e86\u63c9\u788e\u4e86\u2019\u8bb2\u660e\u767d\u3002\u54b1\u4eec\u4e0d\u6015\u6162\uff0c\u5c31\u6015\u505c\uff0c\u4f60\u6bcf\u89e3\u51b3\u4e00\u4e2a\u5c0f\u95ee\u9898\uff0c\u90fd\u662f\u5de8\u5927\u7684\u8fdb\u6b65\uff01\u201d**\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5174\u8da3\u6e38\u4e50\u7ebf\u3011** (\u9996\u8981\u76ee\u6807\u662f\u7ef4\u6301\u5b66\u4e60\u5174\u8da3\u548c\u6210\u5c31\u611f\uff0c\u800c\u975e\u65bd\u52a0\u63a5\u5355\u538b\u529b)\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011** (\u5fc5\u987b\u5305\u542b\uff1a1\u5bf91\u6280\u672f\u4fdd\u59c6\u670d\u52a1\u3001\u6781\u7b80\u56fe\u6587/\u89c6\u9891\u64cd\u4f5c\u6307\u5357\u3001\u5b9a\u671f\u5fc3\u7406\u6309\u6469\u8bdd\u672f) + **\u3010\u6781\u7b80\u5de5\u5177\u5305\u3011** (\u63d0\u4f9b\u4e00\u952e\u5b89\u88c5\u811a\u672c\u3001\u50bb\u74dc\u5f0f\u6a21\u677f)\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u7edd\u4e0d\u5bf9\u5176\u4f7f\u7528\u4efb\u4f55\u53cd\u95ee\u6216\u8d23\u5907\u8bed\u6c14**\uff08\u5982\u201c\u4f60\u662f\u4e0d\u662f\u6ca1\u542c\u8bfe\u201d\uff09\u30022. \u7edd\u4e0d\u7ed9\u5176\u5e03\u7f6e\u9700\u8981\u590d\u6742\u7535\u8111\u77e5\u8bc6\u7684\u62d3\u5c55\u4efb\u52a1\u30023. \u907f\u514d\u5728\u7fa4\u5185\u516c\u5f00@\u4ed6\u89e3\u51b3\u57fa\u7840\u95ee\u9898\uff0c\u4fdd\u62a4\u5176\u81ea\u5c0a\u5fc3\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u57fa\u7840\u64cd\u4f5c\u80fd\u529b\u672a\u5efa\u7acb\u524d\uff0c\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u4f1a\u52a0\u5267\u5176\u7126\u8651\u548c\u5d29\u76d8\u98ce\u9669\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u9a6c\u5361\u4e39\u4e39\uff0c\u5e2e\u6211\u770b\u4e00\u4e0b\uff0c\u8fd9\u662f\u5565\u60c5\u51b5\u5440\uff0c\u6211\u771f\u7684\u5d29\u6e83\u4e86\u3002**\u201d\n2. > \u201c**\u52a0\u4e2a\u76d8\u90fd\u628a\u6211\u52a0\u61f5\u4e86\uff0c\u7535\u8111\u53c8\u4e0d\u542c\u4f7f\u5524\u4e86[\u7834\u6d95\u4e3a\u7b11]**\u201d\n3. > \u201c**\u4f60\u8981\u6c14\u6b7b\u6211\u6211\u7684\u73ed\u4f1a\u4f60\u662f\u4e00\u70b9\u6ca1\u542c\u3002**\u201d (\u9500\u552e\u539f\u8bdd\uff0c\u6b64\u53e5\u53cd\u5411\u5370\u8bc1\u4e86\u7528\u6237\u7684\u4f4e\u5b66\u4e60\u6548\u80fd\u4e0e\u9ad8\u4f9d\u8d56\u5ea6)\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6\u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u6280\u672f\u5b89\u5168\u611f\u4e0e\u5b66\u4e60\u966a\u4f34\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u4e0d\u538c\u5176\u70e6\u7684\u3001\u4fdd\u59c6\u7ea7\u7684\u6280\u672f\u652f\u6301\u4e0e\u60c5\u7eea\u5b89\u629a\uff0c\u5c06\u5176\u5b66\u4e60\u8def\u5f84\u62c6\u89e3\u4e3a\u6700\u5c0f\u53ef\u6267\u884c\u6b65\u9aa4\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u793e\u4ea4\u966a\u4f34\u4e0e\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf+\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\"}\n```";
