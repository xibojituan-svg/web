    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n## \u4fe1\u606f\u5145\u8db3\u6027\u8bc4\u4f30\n\u4fe1\u606f\u5145\u8db3\u3002\u7528\u6237\u5b8c\u6210\u4e86\u4ece\u5f15\u6d41\u3001\u4f53\u9a8c\u8bfe\u5230\u6700\u7ec8\u8f6c\u5316\u7684\u5b8c\u6574\u8def\u5f84\uff0c\u5173\u952e\u51b3\u7b56\u4fe1\u606f\uff08\u5982\u652f\u4ed8\u884c\u4e3a\u3001\u5bf9\u4ef7\u683c\u7684\u5173\u6ce8\u3001\u5b66\u4e60\u884c\u4e3a\uff09\u5747\u6709\u4f53\u73b0\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (B-)**\uff1a**\u5de5\u5177\u9a71\u52a8\u578b**\u3002\u7528\u6237\u4e3b\u8981\u52a8\u673a\u662f\u5b66\u4e60AI\u6280\u80fd\u4ee5\u53d1\u5c55\u526f\u4e1a/\u517c\u804c\u8d5a\u94b1\uff08\u201c\u4e3b\u8981\u662f\u5148\u770b\u770b\u201d\u3001\u201c\u5bf9\u8fd9\u4e2a\u76ee\u524d\u4e0d\u600e\u4e48\u4e86\u89e3\u201d\uff09\u3002\u52a8\u673a\u660e\u786e\u3001\u52a1\u5b9e\uff0c\u4f46\u6df1\u5ea6\u548c\u70ed\u60c5\u4e0d\u8db3\uff0c\u5c5e\u4e8e\u5178\u578b\u7684\u201c\u8bd5\u8bd5\u770b\uff0c\u80fd\u8d5a\u94b1\u5c31\u5e72\u201d\u7684\u5b9e\u7528\u4e3b\u4e49\u5fc3\u6001\u3002**\u7f3a\u4e4f\u5f3a\u70c8\u7684\u5185\u5728\u5174\u8da3\u6216\u521b\u4f5c\u6fc0\u60c5**\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (C+)**\uff1a**\u57fa\u7840\u5165\u95e8\u7ea7**\u3002\u7528\u6237\u80fd\u5b8c\u6210\u57fa\u7840\u4f5c\u4e1a\uff0c\u4f7f\u7528\u514d\u8d39AI\u5de5\u5177\uff08\u5982\u5373\u68a6\u3001\u8c46\u5305\uff09\uff0c\u4f46\u5bf9\u4ed8\u8d39\u4f1a\u5458\u654f\u611f\uff08\u201c\u5373\u68a6\u9700\u8981\u4f1a\u5458\u201d\uff09\u3002\u8868\u660e\u5176**\u53ef\u652f\u914d\u5b66\u4e60\u8d44\u91d1\u6709\u9650\uff0c\u503e\u5411\u4e8e\u4f4e\u6210\u672c\u8bd5\u9519**\u3002\u65f6\u95f4\u8d44\u6e90\u65b9\u9762\uff0c\u80fd\u53c2\u4e0e\u76f4\u64ad\uff0c\u4f46\u66fe\u56e0\u201c\u6709\u4e8b\u201d\u5f71\u54cd\u4f5c\u4e1a\u63d0\u4ea4\uff0c\u663e\u793a\u65f6\u95f4\u5b89\u6392\u6709\u4e00\u5b9a\u5f39\u6027\u4f46\u975e\u7edd\u5bf9\u5145\u88d5\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (B-)**\uff1a**\u8ddf\u968f\u578b/\u88ab\u52a8\u9002\u5e94\u578b**\u3002\u7528\u6237\u5168\u7a0b\u6c9f\u901a\u793c\u8c8c\u3001\u914d\u5408\u5ea6\u9ad8\uff08\u201c\u597d\u7684\u201d\u3001\u201c\u8c22\u8c22\u201d\u3001\u201c\ud83d\udc4c\u201d\u3001\u201c\u53c2\u52a0\u201d\u3001\u201c\u8fdb\u6765\u4e86\u201d\uff09\uff0c\u80fd\u6309\u9500\u552e\u6307\u5f15\u884c\u52a8\uff08\u56de\u590d\u53e3\u4ee4\u3001\u63d0\u4ea4\u4f5c\u4e1a\u3001\u8fdb\u5165\u76f4\u64ad\uff09\u3002\u9762\u5bf9\u5b66\u4e60\u6311\u6218\uff08\u5982\u5de5\u5177\u9650\u5236\u3001\u751f\u6210\u6548\u679c\u4e0d\u7406\u60f3\uff09\u65f6\uff0c\u672a\u8868\u73b0\u51fa\u660e\u663e\u7684\u632b\u8d25\u6216\u8d28\u7591\uff0c**\u4f9d\u8d56\u5916\u90e8\u5f15\u5bfc\u548c\u73b0\u6210\u89e3\u51b3\u65b9\u6848\uff08\u5982\u63d0\u793a\u8bcd\u3001\u5de5\u4f5c\u6d41\uff09**\u3002\u6297\u538b\u80fd\u529b\u672a\u77e5\uff0c\u4f46\u987a\u4ece\u6027\u9ad8\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a**\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u4e8e4\u670812\u65e5\u665a\u95f4\u63d0\u53ca\u4ef7\u683c\u201c2980\u201d\u5e76\u201c\u4e0b\u5355\u4e86\u201d\uff0c\u5b8c\u6210\u8f6c\u5316\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u9ed8\u8ba4\u4e3a\u72ec\u7acb\u51b3\u7b56**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u914d\u5076\u3001\u7236\u6bcd\u7b49\u5bb6\u5ead\u51b3\u7b56\u8005\uff0c\u7528\u6237\u884c\u4e3a\u8868\u73b0\u4e3a\u4e2a\u4eba\u51b3\u7b56\u3002\n*   **\u6b65\u9aa41-4\u5224\u5b9a**\uff1a\n    *   **A\u8f74 (\u652f\u4ed8\u80fd\u529b\u4e0e\u610f\u613f)**\uff1a**A2 (\u8c28\u614e\u652f\u4ed8\u578b)**\u3002\u7528\u6237\u5bf9\u4ef7\u683c\u654f\u611f\uff08\u5355\u72ec\u63d0\u53ca\u201c2980\u201d\uff09\uff0c\u4e14\u5bf9\u5de5\u5177\u4f1a\u5458\u8d39\u6709\u987e\u8651\u3002\u652f\u4ed8\u884c\u4e3a\u53d1\u751f\u5728\u5bc6\u96c6\u7684\u53d8\u73b0\u627f\u8bfa\u548c\u7a00\u7f3a\u6027\u8425\u9500\uff08\u201c\u62a2\u5360\u540d\u989d\u201d\u3001\u201c\u798f\u5229\u201d\uff09\u540e\uff0c\u5c5e\u4e8e**\u5728\u5f3a\u70c8\u5916\u90e8\u6fc0\u52b1\u4e0b\u7684\u51b3\u7b56**\uff0c\u800c\u975e\u57fa\u4e8e\u5145\u88d5\u9884\u7b97\u7684\u8f7b\u677e\u652f\u4ed8\u3002\n    *   **B\u8f74 (\u5b66\u4e60\u6267\u884c\u529b)**\uff1a**B2 (\u4f9d\u8d56\u5f15\u5bfc\u578b)**\u3002\u7528\u6237\u80fd\u5b8c\u6210\u57fa\u672c\u8ddf\u8fdb\u884c\u52a8\uff08\u542c\u8bfe\u3001\u4ea4\u4f5c\u4e1a\uff09\uff0c\u4f46\u4e3b\u52a8\u6027\u5f31\uff0c\u4f9d\u8d56\u9500\u552e\u6b65\u6b65\u63a8\u52a8\u3002\u66fe\u56e0\u201c\u6709\u4e8b\u201d\u5ef6\u8fdf\u4f5c\u4e1a\uff0c\u663e\u793a\u6267\u884c\u529b\u53d7\u751f\u6d3b\u4e8b\u52a1\u5f71\u54cd\uff0c**\u9700\u8981\u8f83\u5f3a\u7684\u5916\u90e8\u7763\u4fc3\u548c\u7ed3\u6784\u5316\u5b89\u6392**\u3002\n    *   **C\u8f74 (\u76ee\u6807\u6e05\u6670\u5ea6)**\uff1a**C1 (\u673a\u4f1a\u63a2\u7d22\u578b)**\u3002\u76ee\u6807\u660e\u786e\u4e3a\u201c\u8d5a\u94b1\u201d\u3001\u201c\u517c\u804c\u526f\u4e1a\u201d\uff0c\u4f46\u5bf9\u5177\u4f53\u8def\u5f84\uff08\u5982\u505a\u4f55\u79cd\u5185\u5bb9\u3001\u8fbe\u5230\u4f55\u79cd\u6536\u5165\uff09\u8ba4\u77e5\u6a21\u7cca\uff0c\u9700\u8981\u5e73\u53f0\u548c\u8001\u5e08\u63d0\u4f9b\u73b0\u6210\u6e20\u9053\u548c\u6a21\u5f0f\u3002\n    *   **D\u8f74 (\u5fc3\u7406\u9884\u671f\u7ba1\u7406)**\uff1a**D2 (\u7ed3\u679c\u5bfc\u5411\u6613\u7126\u8651\u578b)**\u3002\u7528\u6237\u5bf9\u201c\u53d8\u73b0\u201d\u3001\u201c\u63a5\u5355\u201d\u7b49\u7ed3\u679c\u9ad8\u5ea6\u5173\u6ce8\u3002\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa\u201c\u6700\u5feb\u62ff\u5230\u7ed3\u679c\u201d\u3001\u201c\u8fb9\u5b66\u4e60\u8fb9\u63a5\u5355\u201d\uff0c\u6781\u6613**\u62c9\u9ad8\u5176\u77ed\u671f\u6536\u76ca\u9884\u671f**\u3002\u4e00\u65e6\u5b9e\u64cd\u96be\u5ea6\u6216\u53d8\u73b0\u5468\u671f\u8d85\u51fa\u9884\u671f\uff0c\u6613\u4ea7\u751f\u843d\u5dee\u548c\u7126\u8651\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n**T4 \u52a1\u5b9e\u8ddf\u98ce\u578b**\n*   **\u6838\u5fc3\u7279\u5f81**\uff1a\u88ab\u98ce\u53e3\u548c\u201c\u8d5a\u94b1\u201d\u673a\u4f1a\u5438\u5f15\uff0c\u52a8\u673a\u52a1\u5b9e\uff08\u8c0b\u751f/\u589e\u6536\uff09\uff0c\u5b66\u4e60\u884c\u4e3a\u88ab\u52a8\u8ddf\u968f\uff0c\u4f9d\u8d56\u5916\u90e8\u63d0\u4f9b\u7684\u201c\u6377\u5f84\u201d\uff08\u73b0\u6210\u63d0\u793a\u8bcd\u3001\u6e20\u9053\uff09\uff0c\u5bf9\u4ef7\u683c\u654f\u611f\uff0c\u5fc3\u7406\u5f39\u6027\u4e00\u822c\u3002\n*   **\u5339\u914d\u5ea6**\uff1a\u9ad8\u3002\u7528\u6237\u884c\u4e3a\u5b8c\u5168\u7b26\u5408\uff1a\u4e3a\u201c\u517c\u804c\u526f\u4e1a\u201d\u800c\u6765\uff0c\u5173\u6ce8\u53d8\u73b0\u6e20\u9053\uff0c\u914d\u5408\u5ea6\u9ad8\u4f46\u7f3a\u4e4f\u4e3b\u52a8\u63a2\u7d22\uff0c\u5bf9\u6210\u672c\uff08\u8bfe\u7a0b\u8d39\u3001\u5de5\u5177\u4f1a\u5458\uff09\u654f\u611f\uff0c\u6613\u53d7\u9500\u552e\u627f\u8bfa\u5f71\u54cd\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669\u7b49\u7ea7\uff1a\u4e2d**\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u4e0d\u53ca\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa\u201c\u5165\u5b66\u7b2c\u4e00\u5468\u540e\u5c31\u53ef\u4ee5\u5f00\u901a\u8d44\u6e90\u6e20\u9053\uff0c\u8fb9\u5b66\u4e60\u8fb9\u63a5\u5355\u8fb9\u5b9e\u6218\u201d\u3001\u201c\u6700\u5feb\u62ff\u5230\u7ed3\u679c\u201d\u3002\u7528\u6237\u9884\u671f\u5df2\u88ab\u663e\u8457\u62c9\u9ad8\uff0c\u4e0e\u5b9e\u9645\u5b66\u4e60\u66f2\u7ebf\u548c\u63a5\u5355\u96be\u5ea6\u6781\u6613\u4ea7\u751f\u5de8\u5927\u843d\u5dee\uff0c\u662f**\u6700\u4e3b\u8981\u7684\u9000\u8d39\u8bf1\u56e0**\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u4ef7\u683c\u548c\u5de5\u5177\u6210\u672c\u654f\u611f\uff0c\u8868\u660e2980\u5143\u5bf9\u5176\u5e76\u975e\u96f6\u538b\u529b\u3002\u82e5\u77ed\u671f\u5185\u672a\u89c1\u6536\u76ca\uff0c\u53ef\u80fd\u52a0\u5267\u7ecf\u6d4e\u540e\u6094\u60c5\u7eea\u3002\n    3.  **\u5b66\u4e60\u96be\u5ea6**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u867d\u914d\u5408\uff0c\u4f46\u8868\u73b0\u51fa\u5bf9\u6280\u672f\u7ec6\u8282\u7684\u4f9d\u8d56\uff08\u9700\u73b0\u6210\u63d0\u793a\u8bcd\uff09\u3002\u8fdb\u5165\u6b63\u5f0f\u8bfe\u7a0b\u540e\u82e5\u5b9e\u64cd\u590d\u6742\u5ea6\u63d0\u5347\uff0c\u53ef\u80fd\u4ea7\u751f\u754f\u96be\u60c5\u7eea\u3002\n    4.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u80fd\u8ddf\u8fdb\u76f4\u64ad\uff0c\u867d\u6709\u4e8b\u52a1\u5f71\u54cd\u4f46\u53ef\u534f\u8c03\u3002\n    5.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u5b9a\u4f4e\u98ce\u9669**\u3002\n    6.  **\u9500\u552e\u8bef\u5bfc**\uff1a**\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u5b58\u5728**\u5938\u5927\u5ba3\u4f20\u548c\u8fc7\u5ea6\u627f\u8bfa**\uff08\u5982\u201c\u4e00\u5468\u63a5\u5355\u201d\u3001\u201c\u786e\u4fdd\u7ed3\u679c\u201d\uff09\uff0c\u5e76\u5229\u7528\u201c\u5de5\u4f5c\u5ba4\u62db\u65b0\u201d\u3001\u201c\u7a00\u7f3a\u540d\u989d\u201d\u5236\u9020\u7d27\u8feb\u611f\uff0c**\u5df2\u89e6\u53ca\u5408\u89c4\u7ea2\u7ebf**\u3002\u8fd9\u662f\u5f15\u53d1\u5ba2\u8bc9\u7684\u6838\u5fc3\u9690\u60a3\u3002\n    7.  **\u4ea7\u54c1\u4e0d\u7b26**\uff1a**\u4e2d\u98ce\u9669**\u3002\u82e5\u6b63\u5f0f\u8bfe\u7a0b\u5185\u5bb9\u4e0e\u4f53\u9a8c\u8bfe\u63cf\u8ff0\u7684\u201c\u7b80\u5355\u201d\u3001\u201c\u590d\u5236\u7c98\u8d34\u201d\u611f\u5dee\u8ddd\u8fc7\u5927\uff0c\u7528\u6237\u53ef\u80fd\u8ba4\u4e3a\u4ea7\u54c1\u4e0e\u5ba3\u4f20\u4e0d\u7b26\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\ud83d\udea8 \u91cd\u5927\u8fdd\u89c4**\uff1a\n    *   **\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u865a\u5047\u5ba3\u4f20**\uff1a\u9500\u552e\u591a\u6b21\u627f\u8bfa\u201c\u8fb9\u5b66\u4e60\u8fb9\u63a5\u5355\u201d\u3001\u201c\u6700\u5feb\u62ff\u5230\u7ed3\u679c\u201d\u3001\u201c\u786e\u4fdd\u6536\u5165\u201d\uff0c\u5c06\u5b66\u4e60\u7ed3\u679c\u4e0e\u786e\u5b9a\u6027\u7ecf\u6d4e\u6536\u76ca\u76f4\u63a5\u6302\u94a9\uff0c**\u4e25\u91cd\u8fdd\u53cd\u6559\u80b2\u4ea7\u54c1\u5ba3\u4f20\u89c4\u8303**\u3002\n    *   **\u5236\u9020\u7a00\u7f3a\u4e0e\u7d27\u8feb\u611f**\uff1a\u201c\u62a2\u5360\u540d\u989d\u201d\u3001\u201c\u6700\u540e\u4e00\u8282\u201d\u3001\u201c\u5b9a\u5411\u6d3e\u5355\u201d\u7b49\u8bdd\u672f\uff0c\u5229\u7528\u4eba\u6027\u5f31\u70b9\u8fdb\u884c\u903c\u5355\u3002\n    *   **\u8eab\u4efd\u6a21\u7cca\u4e0e\u5229\u76ca\u6346\u7ed1**\uff1a\u4ee5\u201c\u5de5\u4f5c\u5ba4\u62db\u65b0\u201d\u3001\u201c\u62c9\u4f60\u8fdb\u5de5\u4f5c\u5ba4\u201d\u4e3a\u8bf1\u9975\uff0c\u5c06\u6559\u5b66\u4e0e\u4e2a\u4eba\u5de5\u4f5c\u5ba4\u62db\u52df\u6df7\u6dc6\uff0c\u5b58\u5728**\u5c06\u516c\u53f8\u6d41\u91cf\u5bfc\u5411\u4e2a\u4eba\u4e1a\u52a1\u7684\u5acc\u7591**\u3002\n*   **\u5408\u89c4\u98ce\u9669**\uff1a**\u6781\u9ad8**\u3002\u5f53\u524d\u9500\u552e\u8bdd\u672f\u5df2\u6784\u6210\u7cfb\u7edf\u6027\u8bef\u5bfc\uff0c\u6781\u6613\u5f15\u53d1\u6279\u91cf\u9000\u8d39\u53ca\u76d1\u7ba1\u6295\u8bc9\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u6838\u5fc3\u7b56\u7565**\uff1a**\u9884\u671f\u7ba1\u7406 + \u5f3a\u966a\u4f34 + \u5fae\u5c0f\u6b63\u53cd\u9988**\n*   **\u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u7d27\u6025\u9884\u671f\u964d\u6e29**\uff1a\u9996\u6b21\u8054\u7cfb\u5fc5\u987b\u8fdb\u884c\u201c\u9884\u671f\u6821\u51c6\u201d\uff0c\u660e\u786e\u8bf4\u660e\u5b66\u4e60\u66f2\u7ebf\u3001\u53d8\u73b0\u5468\u671f\u7684\u4e0d\u786e\u5b9a\u6027\uff0c\u5f3a\u8c03\u6280\u80fd\u79ef\u7d2f\u4e3a\u5148\uff0c\u5f31\u5316\u201c\u5feb\u901f\u8d5a\u94b1\u201d\u8bdd\u672f\u3002\n    2.  **\u5f3a\u5316\u8fc7\u7a0b\u6fc0\u52b1**\uff1a\u5bf9\u5176\u6bcf\u4e00\u6b21\u4f5c\u4e1a\u5b8c\u6210\u3001\u5de5\u5177\u4f7f\u7528\u8fdb\u6b65\u7ed9\u4e88\u53ca\u65f6\u3001\u5177\u4f53\u7684\u8868\u626c\uff0c\u5efa\u7acb\u201c\u5b66\u4e60-\u83b7\u5f97\u8ba4\u53ef\u201d\u7684\u77ed\u671f\u53cd\u9988\u56de\u8def\uff0c\u66ff\u4ee3\u5176\u5bf9\u201c\u8d5a\u94b1\u201d\u7684\u5355\u4e00\u671f\u5f85\u3002\n    3.  **\u63d0\u4f9b\u6e05\u6670\u8def\u5f84**\uff1a\u4e3a\u5176\u89c4\u5212\u660e\u786e\u3001\u7ec6\u5206\u7684\u5b66\u4e60\u91cc\u7a0b\u7891\uff08\u5982\uff1a\u7b2c\u4e00\u5468\u638c\u63e1\u751f\u56fe\uff0c\u7b2c\u4e8c\u5468\u5b8c\u6210\u9996\u4e2a\u77ed\u7247\u526a\u8f91\uff09\uff0c\u5e76\u5b9a\u671f\u540c\u6b65\u8fdb\u5ea6\uff0c\u589e\u52a0\u53ef\u63a7\u611f\u3002\n    4.  **\u8c28\u614e\u5bf9\u63a5\u201c\u8d44\u6e90\u201d**\uff1a\u5207\u52ff\u5728\u65e9\u671f\u8fc7\u5ea6\u6e32\u67d3\u63a5\u5355\u6e20\u9053\u3002\u5e94\u5148\u8bc4\u4f30\u5176\u4f5c\u54c1\u8d28\u91cf\uff0c\u518d\u5c0f\u8303\u56f4\u3001\u4f4e\u95e8\u69db\u5730\u5f15\u5165\u5b9e\u6218\u4efb\u52a1\uff08\u5982\u5185\u90e8\u7ec3\u4e60\u5355\uff09\uff0c\u907f\u514d\u56e0\u80fd\u529b\u4e0d\u8db3\u63a5\u5355\u5931\u8d25\u800c\u5d29\u6e83\u3002\n    5.  **\u5efa\u7acb\u60c5\u611f\u8d26\u6237**\uff1a\u5229\u7528\u5176\u914d\u5408\u5ea6\u9ad8\u7684\u7279\u70b9\uff0c\u5efa\u7acb\u7a33\u5b9a\u3001\u652f\u6301\u6027\u7684\u6c9f\u901a\u5173\u7cfb\uff0c\u6210\u4e3a\u5176\u9047\u5230\u56f0\u96be\u65f6\u7684\u7b2c\u4e00\u6c42\u52a9\u5bf9\u8c61\uff0c\u9884\u9632\u5176\u56e0\u632b\u8d25\u76f4\u63a5\u8d70\u5411\u6295\u8bc9\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**\uff1a\n    *   **\u6302\u8f7d\u4e50\u9ad8\u7ebf**\uff1a\u4f18\u5148\u63a8\u8350**\u6807\u51c6\u5316\u3001\u8def\u5f84\u6e05\u6670\u3001\u793e\u533a\u6c1b\u56f4\u597d**\u7684\u5165\u95e8\u7ea7\u5b9e\u6218\u8425\u6216\u8f7b\u91cf\u7ea7\u9879\u76ee\u5236\u8bfe\u7a0b\u3002\u907f\u514d\u63a8\u8350\u9700\u8981\u9ad8\u5ea6\u81ea\u4e3b\u521b\u4f5c\u6216\u957f\u671f\u6295\u5165\u7684\u9ad8\u9636\u8bfe\u7a0b\u3002\n    *   **\u4ea7\u54c1\u4ea4\u4ed8\u5173\u952e**\uff1a\u8bfe\u7a0b\u5fc5\u987b\u63d0\u4f9b\u5927\u91cf**\u6a21\u677f\u5316\u3001\u53ef\u590d\u7528\u7684\u7d20\u6750\u3001\u63d0\u793a\u8bcd\u548c\u5de5\u4f5c\u6d41**\uff0c\u964d\u4f4e\u5176\u521b\u4f5c\u95e8\u69db\uff0c\u5feb\u901f\u83b7\u5f97\u201c\u6211\u80fd\u505a\u51fa\u6765\u201d\u7684\u6210\u5c31\u611f\u3002\u540c\u65f6\uff0c\u9700\u914d\u5957**\u5f3a\u73ed\u4e3b\u4efb\u7763\u5bfc**\u548c**\u9636\u6bb5\u6027\u7684\u793e\u7fa4\u5206\u4eab**\uff08\u5982\u201c\u672c\u5468\u4f18\u79c0\u4f5c\u4e1a\u201d\uff09\uff0c\u6ee1\u8db3\u5176\u8ddf\u968f\u548c\u83b7\u5f97\u8ba4\u53ef\u7684\u9700\u6c42\u3002\n\n{\"core_type\": \"T4 \u52a1\u5b9e\u8ddf\u98ce\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168/\u5c0a\u91cd\", \"target_product_line\": \"\u6807\u51c6\u5316\u3001\u5f3a\u5f15\u5bfc\u3001\u6a21\u677f\u5316\u7d20\u6750\u4e30\u5bcc\u7684\u5165\u95e8\u5b9e\u6218\u8425\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}";
