        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677155958 (\u6635\u79f0\uff1a\u767e\u4e8b\u96f7\u78a7) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e-\u661f\u9e7f1(\u5218\u7acb\u541b)\u3001\u73ed\u4e3b\u4efb-\u53ef\u4e3d\u513f(\u5b54\u4ee4\u5a77) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bad\u7ec3\u8425 \u2192 \u6500\u767b\u8ba1\u5212\u7cfb\u7edf\u8bfe (2380\u5143\uff0c\u4e24\u4e2a\u6708) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u5b66\u751f\u8eab\u4efd\uff0c\u8d44\u91d1\u538b\u529b\u5927**\u3002\u6700\u7ec8\u9009\u62e9\u4e24\u4e2a\u6708\u77ed\u671f\u8bfe\u7a0b\uff0c\u5b58\u5728\u5206\u671f\u6216\u4f7f\u7528\u751f\u6d3b\u8d39\u7684\u53ef\u80fd\u6027\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u4e3a\u5b66\u751f\uff0c\u9700\u517c\u987e\u4e0a\u8bfe\u3001\u5065\u8eab\uff0c\u5b66\u4e60\u65f6\u95f4\u9700\u89c1\u7f1d\u63d2\u9488\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u5b66\u4e60\u4e92\u52a8\u79ef\u6781\uff0c\u4f46\u5173\u952e\u51b3\u7b56\u4fe1\u606f\uff08\u5982\u8d44\u91d1\u6765\u6e90\u3001\u5bb6\u5ead\u6001\u5ea6\uff09\u7f3a\u5931\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e\uff0c\u4f46\u4f34\u968f\u5174\u8da3\u4e0e\u6210\u957f\u9a71\u52a8**\u3002\u7528\u6237\u79ef\u6781\u53c2\u4e0e\u5b66\u4e60\u3001\u63d0\u4ea4\u4f5c\u4e1a\u3001\u4e3b\u52a8\u8bd5\u97f3\uff0c\u8868\u73b0\u51fa\u5bf9\u6280\u80fd\u672c\u8eab\u7684\u63a2\u7d22\u6b32\u3002\u4f46\u6700\u7ec8\u51b3\u7b56\uff08\u9009\u62e9\u4e24\u4e2a\u6708\u77ed\u671f\u8bfe\uff09\u548c\u9500\u552e\u6301\u7eed\u5f3a\u8c03\u7684\u201c\u53d8\u73b0\u201d\u3001\u201c\u63a5\u5355\u201d\u3001\u201c\u7b2c\u4e00\u6876\u91d1\u201d\u5747\u6307\u5411\u660e\u786e\u7684\u77ed\u671f\u6536\u76ca\u671f\u671b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5f55\u4e66\u548c\u5ba1\u542c\u3001\u540e\u671f\u201d\uff08\u5bf9\u5177\u4f53\u5de5\u79cd\u611f\u5174\u8da3\uff09\uff1b> \u201c\u54ce\uff0c\u6211\u8fd8\u662f\u5b66\u751f...\u8fd8\u662f\u8003\u8651\u4e00\u4e0b\u201d\uff08\u4ef7\u683c\u654f\u611f\uff0c\u51b3\u7b56\u53d7\u7ecf\u6d4e\u6761\u4ef6\u5236\u7ea6\uff09\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u660e\u786e\u8868\u793a\u201c\u6211\u8fd8\u662f\u5b66\u751f\u201d\uff0c\u5bf92380\u5143\u8bfe\u7a0b\u8868\u73b0\u51fa\u72b9\u8c6b\u548c\u538b\u529b\uff0c\u6700\u7ec8\u9009\u62e9\u66f4\u77ed\u671f\u7684\u8bfe\u7a0b\u65b9\u6848\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u4f5c\u4e3a\u5b66\u751f\uff0c\u65f6\u95f4\u76f8\u5bf9\u53ef\u63a7\u4f46\u9700\u5206\u914d\u3002\u80fd\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u52a0\u76f4\u64ad\u3001\u5065\u8eab\uff0c\u663e\u793a\u6709\u788e\u7247\u5316\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u672a\u63d0\u53ca\uff0c\u65e0\u6cd5\u8bc4\u4f30\u3002\u6b64\u4e3a\u6f5c\u5728\u98ce\u9669\u70b9\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u9500\u552e\u672a\u53ca\u65f6\u56de\u590d\u76f4\u64ad\u94fe\u63a5\u65f6\uff0c\u867d\u6709\u50ac\u4fc3\uff08\u201c\u5feb\u53d1\u554a\u59d0[\u82e6\u6da9]\u201d\uff09\uff0c\u4f46\u5f97\u77e5\u539f\u56e0\u540e\uff08\u201c\u54e6\u54e6\u54e6\u54e6\u539f\u6765\u5982\u6b64\u201d\uff09\u8fc5\u901f\u7406\u89e3\uff0c\u672a\u8868\u73b0\u51fa\u62b1\u6028\u6216\u60c5\u7eea\u5d29\u6e83\u3002\u5168\u7a0b\u6c9f\u901a\u79ef\u6781\u3001\u914d\u5408\u5ea6\u9ad8\uff0c\u5bf9\u5b66\u4e60\u53cd\u9988\u63a5\u53d7\u826f\u597d\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u597d\u7684\u59d0\uff0c\u8c22\u8c22\u70b9\u8bc4\uff0c\u53d7\u6559\u4e86\u201d\uff08\u79ef\u6781\u63a5\u53d7\u53cd\u9988\uff09\uff1b> \u201c\u6ca1\u4e8b\u59d0\uff0c\u96d5\u523b\u81ea\u5df1\u4ec0\u4e48\u65f6\u5019\u90fd\u4e0d\u665a\u201d\uff08\u8868\u73b0\u51fa\u79ef\u6781\u5fc3\u6001\u548c\u957f\u671f\u4e3b\u4e49\u503e\u5411\uff09\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u7ecf\u6d4e\u4e0d\u72ec\u7acb\u5e26\u6765\u7684\u4e0d\u5b89\u5168\u611f\u4e0e\u4ef7\u503c\u7126\u8651**\u3002\u4f5c\u4e3a\u5b66\u751f\uff0c\u4ed6\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u6280\u80fd\uff08\u6709\u58f0\u6f14\u64ad\uff09\u83b7\u5f97\u7ecf\u6d4e\u6765\u6e90\u548c\u672a\u6765\u804c\u4e1a\u4fdd\u969c\uff08\u5b89\u5168\u9700\u6c42\uff09\uff0c\u540c\u65f6\u5e0c\u671b\u83b7\u5f97\u8ba4\u53ef\u3001\u8bc1\u660e\u81ea\u5df1\u7684\u80fd\u529b\uff08\u5c0a\u91cd\u9700\u6c42\uff09\u3002\u9500\u552e\u201c\u770b\u597d\u4f60\u201d\u3001\u201c\u6709\u5851\u9020\u6027\u201d\u7684\u80af\u5b9a\uff0c\u7cbe\u51c6\u51fb\u4e2d\u4e86\u4ed6\u5bf9\u201c\u88ab\u8ba4\u53ef\u201d\u7684\u6e34\u671b\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u201d\u7684\u6210\u5c31\u611f\u4e0e\u201c\u6709\u8def\u5f84\u201d\u7684\u786e\u5b9a\u6027**\u3002\u6301\u7eed\u7ed9\u4e88\u5176\u4f5c\u4e1a\u8fdb\u6b65\u7684\u5177\u4f53\u80af\u5b9a\uff0c\u5e76\u4e3a\u5176\u89c4\u5212\u6e05\u6670\u3001\u53ef\u5b9e\u73b0\u7684\u77ed\u671f\u63a5\u5355\u8def\u5f84\uff0c\u7f13\u89e3\u5176\u5bf9\u6295\u5165\u80fd\u5426\u4ea7\u51fa\u7684\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u578b** (\u6df7\u5408T3\u7279\u5f81) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u7b49D\u7c7b\u7ea2\u7ebf\u3002\u4f46**\u5b66\u751f\u8eab\u4efd\u548c\u8d44\u91d1\u538b\u529b\u662f\u9ec4\u706f\u9884\u8b66\u4fe1\u53f7**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u82e5\u62a5\u540d\u52a8\u7528\u5927\u989d\u751f\u6d3b\u8d39\u6216\u9690\u7792\u5bb6\u4eba\uff0c\u540e\u7eed\u53ef\u80fd\u56e0\u5bb6\u5ead\u538b\u529b\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u5b66\u4e60\u6001\u5ea6\u79ef\u6781\uff0c\u65f6\u95f4\u7ba1\u7406\u5c1a\u53ef\uff0c\u4f46\u9700\u8b66\u60d5\u5b66\u4e1a\u4e0e\u526f\u4e1a\u65f6\u95f4\u51b2\u7a81\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u632b\u6298\u7834\u9632\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u4f5c\u4e3a\u201c\u641e\u94b1\u7ed3\u679c\u578b\u201d\u7528\u6237\uff0c\u82e5\u5728\u77ed\u671f\u8bfe\u7a0b\uff082\u4e2a\u6708\uff09\u7ed3\u675f\u540e\uff0c\u63a5\u5355\u6210\u679c\u8fdc\u4f4e\u4e8e\u9884\u671f\uff08\u5982\u8bd5\u97f3\u5c61\u6b21\u4e0d\u4e2d\u3001\u65e0\u5b9e\u9645\u6536\u5165\uff09\uff0c\u6781\u6613\u56e0\u201c\u6295\u5165\u4ea7\u51fa\u6bd4\u5931\u8861\u201d\u800c\u4ea7\u751f\u5f3a\u70c8\u843d\u5dee\u611f\u5e76\u9000\u8d39/\u6295\u8bc9\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u8bfe\u7a0b\u7ed3\u675f\u540e1\u4e2a\u6708\u5185**\u3002\u82e5\u6b64\u65f6\u63a5\u5355\u5c1d\u8bd5\u5c61\u5c61\u53d7\u632b\uff0c\u4e14\u7f3a\u4e4f\u6301\u7eed\u7684\u6b63\u5411\u53cd\u9988\u548c\u8d44\u6e90\u652f\u6301\uff0c\u9000\u8d39\u98ce\u9669\u6025\u5267\u5347\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u96f7\u78a7\u540c\u5b66\uff0c\u770b\u5230\u4f60\u8bad\u7ec3\u8425\u671f\u95f4\u7279\u522b\u79ef\u6781\uff0c\u4f5c\u4e1a\u548c\u8bd5\u97f3\u90fd\u5b8c\u6210\u5f97\u5f88\u68d2\uff0c\u7edd\u5bf9\u662f\u54b1\u4eec\u73ed\u7684\u6f5c\u529b\u80a1\uff01\u4f60\u662f\u5b66\u751f\uff0c\u65f6\u95f4\u5b9d\u8d35\uff0c\u54b1\u4eec\u4e0d\u641e\u865a\u7684\u3002\u8fd9\u4e24\u4e2a\u6708\uff0c\u6211\u7684\u4efb\u52a1\u5c31\u662f\u5e2e\u4f60\u628a\u2018\u58f0\u97f3\u53d8\u73b0\u2019\u8fd9\u6761\u8def\u8dd1\u901a\u7b2c\u4e00\u4e2a\u5c0f\u95ed\u73af\u3002\u54b1\u4eec\u5b9a\u4e2a\u5c0f\u76ee\u6807\uff1a\u7ed3\u8bfe\u524d\uff0c\u81f3\u5c11\u6210\u529f\u8bd5\u97f31-2\u4e2a\u5c0f\u5355\uff0c\u628a\u6d41\u7a0b\u8d70\u4e00\u904d\uff0c\u8d5a\u5230\u7b2c\u4e00\u7b14\u2018\u5b9e\u6218\u7ecf\u9a8c\u2019\u3002\u6709\u4efb\u4f55\u5361\u70b9\uff0c\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u62c6\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011\u3002\u6838\u5fc3\u662f\u7f29\u77ed\u5b66\u4e60\u5230\u53d8\u73b0\u7684\u8def\u5f84\uff0c\u63d0\u4f9b\u660e\u786e\u7684\u3001\u9636\u68af\u5f0f\u7684\u63a5\u5355\u4efb\u52a1\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n    1.  **\u3010\u65b0\u624b\u4fdd\u62a4\u671f\u8d44\u6e90\u5305\u3011**\uff1a\u4f18\u5148\u5206\u914d1-2\u672c\u786e\u4fdd\u6301\u6709\u7387\u7684\u65b0\u624b\u7248\u6743\u4e66\u6216\u7b80\u5355\u5ba1\u542c\u4efb\u52a1\uff0c\u786e\u4fdd\u5176\u65e9\u671f\u80fd\u83b7\u5f97\u6b63\u53cd\u9988\u3002\n    2.  **\u3010\u8f7b\u91cf\u7ea7\u786c\u6838\u6c60(B\u6a21\u5757)\u63a5\u5165\u3011**\uff1a\u9488\u5bf9\u5176T3\uff08\u6b7b\u78d5\u5b66\u9738\uff09\u6df7\u5408\u7279\u8d28\uff0c\u63d0\u4f9b1-2\u6b21\u9488\u5bf9\u8bd5\u97f3\u4f5c\u54c1\u7684\u6df1\u5ea61v1\u70b9\u8bc4\uff0c\u6ee1\u8db3\u5176\u7cbe\u8fdb\u6280\u672f\u7684\u9700\u6c42\u3002\n    3.  **\u3010\u540c\u4f34\u538b\u529b\u9694\u79bb\u7f69\u3011**\uff1a\u907f\u514d\u5728\u7fa4\u5185\u8fc7\u5ea6\u6e32\u67d3\u201c\u5927\u795e\u201d\u5feb\u901f\u6210\u529f\u6848\u4f8b\uff0c\u9632\u6b62\u5176\u4ea7\u751f\u7126\u8651\u548c\u6bd4\u8f83\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1.  \u7edd\u4e0d\u5bf9\u5176\u63cf\u7ed8\u201c\u6708\u5165\u8fc7\u4e07\u201d\u7b49\u4e0d\u5207\u5b9e\u9645\u7684\u8fdc\u671f\u5927\u997c\uff0c\u6240\u6709\u627f\u8bfa\u9700\u57fa\u4e8e\u5176\u5b66\u751f\u8eab\u4efd\u548c\u77ed\u671f\u8bfe\u7a0b\u8bbe\u5b9a\u3002\n    2.  \u7edd\u4e0d\u5ffd\u89c6\u5176\u201c\u7ecf\u6d4e\u538b\u529b\u201d\u4fe1\u53f7\uff0c\u907f\u514d\u63a8\u8350\u4efb\u4f55\u989d\u5916\u4ed8\u8d39\u5347\u5355\u6216\u9ad8\u4ef7\u8bbe\u5907\u3002\n    3.  \u7edd\u4e0d\u56e0\u5176\u8868\u73b0\u79ef\u6781\u5c31\u8fc7\u5ea6\u538b\u69a8\u5176\u65f6\u95f4\uff0c\u9700\u5c0a\u91cd\u5176\u5b66\u751f\u4e3b\u4e1a\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u672c\u6b21\u8bfe\u7a0b\u5468\u671f\u5185\u8fdb\u884c\u4efb\u4f55\u5347\u5355**\u3002\u53ef\u4e8e\u8bfe\u7a0b\u672b\u671f\uff0c\u6839\u636e\u5176\u5b9e\u9645\u63a5\u5355\u6210\u679c\u548c\u5b66\u4e60\u53cd\u9988\uff0c\u8c28\u614e\u8bc4\u4f30\u662f\u5426\u63a8\u8350\u66f4\u957f\u671f\u7684\u8fdb\u9636\u8bfe\u7a0b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u5f55\u4e66\u548c\u5ba1\u542c\u3001\u540e\u671f**\u201d \u2014\u2014 \u5173\u6ce8\u5177\u4f53\u53ef\u53d8\u73b0\u7684\u5de5\u79cd\uff0c\u76ee\u7684\u660e\u786e\u3002\n2. > \u201c**\u54ce\uff0c\u6211\u8fd8\u662f\u5b66\u751f**\u201d \u2014\u2014 \u6838\u5fc3\u8d44\u6e90\u77ed\u677f\uff08\u8d44\u91d1\uff09\u548c\u81ea\u6211\u8eab\u4efd\u8ba4\u77e5\u7684\u66b4\u9732\u3002\n3. > \u201c**\u6ca1\u4e8b\u59d0\uff0c\u96d5\u523b\u81ea\u5df1\u4ec0\u4e48\u65f6\u5019\u90fd\u4e0d\u665a**\u201d \u2014\u2014 \u5c55\u73b0\u79ef\u6781\u5fc3\u6001\u548c\u957f\u671f\u89c6\u89d2\uff0c\u5fc3\u7406\u5f39\u6027\u4f73\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4\u641e\u94b1\u7ed3\u679c\u578b\uff08\u5b66\u751f\u7248\uff09\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7ecf\u6d4e\u5b89\u5168\u4e0e\u80fd\u529b\u8ba4\u53ef\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u504f\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5728\u77ed\u671f\u8bfe\u7a0b\u5185\uff0c\u52a1\u5fc5\u534f\u52a9\u5176\u5b8c\u6210\u81f3\u5c11\u4e00\u6b21\u6210\u529f\u7684\u3001\u6709\u5fae\u5c0f\u6536\u76ca\u7684\u5b9e\u6218\u63a5\u5355\uff0c\u5efa\u7acb\u6b63\u53cd\u9988\u95ed\u73af\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u578b\", \"maslow_need\": \"\u5b89\u5168\u4e0e\u5c0a\u91cd\u9700\u6c42\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u9ad8\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf+\u65b0\u624b\u4fdd\u62a4\u8d44\u6e90\u5305\"}\n```";
