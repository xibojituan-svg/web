    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4f5c\u4e3a\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 471425321 (\u6635\u79f0\uff1a\u6e05\u6ce0) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-11 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e\uff1a\u871c\u963f\u91524(\u674e\u4f1f)\uff1b\u73ed\u4e3b\u4efb\uff1a\u79cb\u7c73\u679c(\u767d\u82b3) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u7cfb\u7edf\u8bfe (\u6700\u7ec8\u652f\u4ed83980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3** (\u81ea\u8ff0\u5bb6\u5ead\u7ecf\u6d4e\u56f0\u96be\uff0c\u5b66\u8d39\u76f8\u5f53\u4e8e\u5bb6\u4eba\u4e00\u4e2a\u900f\u6790\u7597\u7a0b\u7684\u8d39\u7528) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u4ece\u4e8b\u9152\u5e97\u7ba1\u7406\uff0c\u4e0b\u5348\u65f6\u95f4\u8f83\u5145\u88d5\uff0c\u4f46\u9700\u7167\u987e\u75c5\u4eba) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3** (\u672a\u63d0\u53ca\u5bb6\u5ead\u5bf9\u62a5\u540d\u7684\u6001\u5ea6) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** (\u7528\u6237\u4e3b\u52a8\u900f\u9732\u4e86\u5927\u91cf\u4e2a\u4eba\u80cc\u666f\u4e0e\u5fc3\u7406\u72b6\u6001) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\uff0c\u6709\u660e\u786e\u7684\u526f\u4e1a\u53d8\u73b0\u610f\u613f\uff0c\u4f46\u5939\u6742\u7740\u5f3a\u70c8\u7684\u81ea\u6211\u5b9e\u73b0\u4e0e\u793e\u4ea4\u5f52\u5c5e\u9700\u6c42\uff0c\u5e76\u975e\u7eaf\u7cb9\u7684\u201c\u51e0\u5929\u63d0\u73b0\u201d\u5fc3\u6001\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6709\u7684\u201d\uff08\u56de\u7b54\u662f\u5426\u6709\u5165\u884c\u6253\u7b97\uff09\uff1b> \u201c\u6211\u53ef\u80fd\u53ea\u80fd\u505a\u4e2a\u517c\u804c\uff0c\u751f\u6d3b\u4e2d\u6709\u5b9e\u4f53\u548c\u75c5\u4eba\u7b49\u8981\u4e8b\u9700\u8981\u7167\u987e\u2026\u201d\uff1b> \u201c\u6211\u4e5f\u4e89\u53d6\u65e9\u65e5\u8fbe\u5230[\u73ab\u7470]\u201d\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u660e\u786e\u8868\u793a\u201c\u8d2b\u7a77\u4f7f\u6211\u6cea\u6d41\u6ee1\u9762\u201d\uff0c3980\u5143\u5b66\u8d39\u76f8\u5f53\u4e8e\u5bb6\u4eba\u4e00\u4e2a\u900f\u6790\u7597\u7a0b\u7684\u8d39\u7528\uff0c\u7ecf\u6d4e\u538b\u529b\u6781\u5927\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u4ece\u4e8b\u9152\u5e97\u7ba1\u7406\uff0c\u4e0b\u5348\u65f6\u95f4\u8f83\u5145\u88d5\uff0c\u80fd\u65e9\u8d77\u6253\u5361\uff0c\u4f46\u9700\u8981\u7167\u987e\u75c5\u4eba\uff0c\u7cbe\u529b\u53ef\u80fd\u88ab\u5206\u6563\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\uff0c\u4f46\u5bb6\u5ead\u6709\u75c5\u4eba\u9700\u7167\u987e\uff0c\u53ef\u80fd\u4e0d\u652f\u6301\u6216\u65e0\u529b\u652f\u6301\u5176\u989d\u5916\u652f\u51fa\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b07\u4f4e\u6781\u5371**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56**\u3002\u8868\u73b0\u51fa\u5b8c\u7f8e\u4e3b\u4e49\u3001\u5f3a\u8feb\u75c7\u503e\u5411\uff0c\u56e0\u8eab\u4f53\u6b8b\u75be\uff08\u8111\u90e8\u53d7\u521b\u5bfc\u81f4\u53f3\u773c\u5931\u660e\uff09\u6709\u5f3a\u70c8\u7684\u81ea\u6211\u6000\u7591\u548c\u4e0d\u81ea\u4fe1\uff0c\u6781\u5ea6\u9700\u8981\u5916\u90e8\u80af\u5b9a\u548c\u60c5\u611f\u652f\u6301\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4e3b\u8981\u662f\u6211\u6709\u70b9\u5b8c\u7f8e\u4e3b\u4e49\u548c\u5f3a\u8feb\u75c7[\u6342\u8138]\uff0c\u56f0\u6270\u6211\u597d\u4e45\u4e86\u201d\uff1b> \u201c\u6709\u70b9\u4e0d\u597d\u610f\u601d\u5206\u4eab\u5230\u7fa4\u91cc[\u7834\u6d95\u4e3a\u7b11]\u201d\uff1b> \u201c\u4e0d\u77e5\u9053\u8fd9\u80fd\u4e0d\u80fd\u8bf4\u554a\u2026\u6211\u6709\u70b9\u5c0f\u6b8b\u75be\uff0c\u4e3b\u8981\u662f\u8111\u90e8\u53d7\u521b\u5bfc\u81f4\u53f3\u773c\u5931\u660e\uff0c\u8fd9\u6bb5\u65f6\u95f4\u53ef\u80fd\u4f1a\u7ed9\u7c73\u679c\u8001\u5e08\u6dfb\u9ebb\u70e6\u4e86\u3002\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34\u4e0e\u5f52\u5c5e\u611f**\uff0c\u5e76\u5f3a\u70c8\u6e34\u671b**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u4e0e\u81ea\u6211\u4ef7\u503c\u5b9e\u73b0**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u56e0\u8eab\u4f53\u6b8b\u75be\u548c\u5bb6\u5ead\u7ecf\u6d4e\u538b\u529b\u5bfc\u81f4\u7684\u6df1\u5ea6\u81ea\u5351\u4e0e\u4e0d\u5b89\u5168\u611f\uff0c\u6e34\u671b\u901a\u8fc7\u5b66\u4e60\u548c\u793e\u7fa4\u878d\u5165\uff0c\u8bc1\u660e\u81ea\u8eab\u4ef7\u503c\uff0c\u83b7\u5f97\u5c0a\u91cd\u4e0e\u5f52\u5c5e\uff0c\u4ece\u800c\u5bf9\u6297\u73b0\u5b9e\u56f0\u5883\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u80af\u5b9a\u3001\u65e0\u6761\u4ef6\u7684\u63a5\u7eb3\u4e0e\u201c\u88ab\u9700\u8981\u201d\u7684\u5f52\u5c5e\u611f**\u3002\u4ed6\u9700\u8981\u7684\u4e0d\u4ec5\u662f\u6280\u80fd\uff0c\u66f4\u662f\u4e00\u4e2a\u80fd\u8ba9\u4ed6\u611f\u5230\u5b89\u5168\u3001\u88ab\u8ba4\u53ef\u3001\u6709\u4ef7\u503c\u7684\u201c\u7ebf\u4e0a\u5bb6\u5ead\u201d\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u4e25\u91cd\u5185\u8017) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 **\u5b89\u5168\u672a\u89e6\u53d1** (\u4f46\u5df2\u5904\u4e8eT8-D\u7edd\u8def\u8d4c\u5f92\u7684\u8fb9\u7f18)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u7528\u6237\u867d\u81ea\u8ff0\u7ecf\u6d4e\u56f0\u96be\uff0c\u4f46\u672a\u63d0\u53ca\u501f\u8d37\u62a5\u540d\uff0c\u4e14\u6700\u7ec8\u5b8c\u6210\u652f\u4ed8\u3002\u7136\u800c\uff0c\u5176**\u8d44\u6e90\u5e95\u5ea7\u4f4e\uff08\u7ecf\u6d4e\u538b\u529b\u5927\uff09+ \u5fc3\u7406\u5f39\u6027\u6781\u4f4e\uff08\u81ea\u5351\u3001\u5b8c\u7f8e\u4e3b\u4e49\uff09** \u7684\u7ec4\u5408\uff0c\u662f\u6781\u9ad8\u5371\u7684\u9000\u8d39\u98ce\u9669\u4fe1\u53f7\uff0c\u5fc5\u987b\u542f\u52a8C2\u7ea7\u4e25\u5bc6\u98ce\u63a7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u9ad8** | \u5b66\u8d39\u652f\u51fa\u53ef\u80fd\u5f15\u53d1\u5bb6\u5ead\u5185\u90e8\u77db\u76fe\uff0c\u5c24\u5176\u662f\u4e0e\u5bb6\u4eba\u533b\u7597\u8d39\u7528\u4ea7\u751f\u51b2\u7a81\u65f6\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u56e0\u7167\u987e\u75c5\u4eba\u6216\u81ea\u8eab\u5065\u5eb7\u95ee\u9898\u5bfc\u81f4\u5b66\u4e60\u8fdb\u5ea6\u843d\u540e\uff0c\u4ea7\u751f\u201c\u62d6\u7d2f\u5927\u5bb6\u201d\u7684\u6127\u759a\u611f\u800c\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | **\u8fd9\u662f\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u4e00\u65e6\u4f5c\u4e1a\u88ab\u4e25\u5389\u70b9\u8bc4\u3001\u8f6f\u4ef6\u64cd\u4f5c\u9047\u5230\u56f0\u96be\u3001\u6216\u611f\u89c9\u81ea\u5df1\u201c\u592a\u7b28\u201d\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\uff0c\u5176\u5b8c\u7f8e\u4e3b\u4e49\u548c\u81ea\u5351\u5fc3\u7406\u4f1a\u77ac\u95f4\u5d29\u6e83\uff0c\u89e6\u53d1\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u5bf9\u201c\u7b2c\u516b\u5929\u5f00\u901a\u63a5\u5355\u6e20\u9053\u201d\u62b1\u6709\u4e0d\u5207\u5b9e\u9645\u7684\u5feb\u901f\u53d8\u73b0\u5e7b\u60f3\uff0c\u82e5\u77ed\u671f\u5185\u65e0\u6536\u5165\uff0c\u4f1a\u52a0\u5267\u5176\u7ecf\u6d4e\u7126\u8651\u548c\u81ea\u8d23\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c1-2\u5468**\u3002\u6b64\u65f6\u5c06\u9762\u4e34\u7b2c\u4e00\u6b21\u6b63\u5f0f\u4f5c\u4e1a\u63d0\u4ea4\u548c\u70b9\u8bc4\uff0c\u6280\u672f\u96be\u70b9\u548c\u540c\u4f34\u5bf9\u6bd4\u4f1a\u6781\u5927\u51b2\u51fb\u5176\u81ea\u4fe1\u5fc3\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6e05\u6ce0\u4f60\u597d\u5440\uff01\u770b\u5230\u4f60\u90a3\u4e48\u8ba4\u771f\u53c8\u65e9\u65e9\u8d77\u6765\u6253\u5361\uff0c\u771f\u7684\u88ab\u4f60\u7684\u70ed\u7231\u6253\u52a8\u4e86\u3002\u54b1\u4eec\u8fd9\u4e2a\u73ed\u5c31\u50cf\u4e00\u4e2a\u5927\u5bb6\u5ead\uff0c\u5927\u5bb6\u4e92\u76f8\u6276\u6301\u7740\u5f80\u524d\u8d70\u3002\u4f60\u5343\u4e07\u522b\u6709\u538b\u529b\uff0c\u6709\u4ec0\u4e48\u64cd\u4f5c\u4e0a\u7684\u3001\u5fc3\u7406\u4e0a\u7684\u5c0f\u574e\u513f\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u5c31\u662f\u4f60\u7684\u2018\u7ebf\u4e0a\u62d0\u6756\u2019\u3002\u54b1\u4eec\u4e0d\u8ffd\u6c42\u4e00\u6b65\u5b8c\u7f8e\uff0c\u4eab\u53d7\u6bcf\u5929\u8fdb\u6b65\u4e00\u70b9\u70b9\u7684\u5c0f\u786e\u5e78\u5c31\u597d\uff5e\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\u3011**\u3002\u6838\u5fc3\u76ee\u6807\u662f\u5efa\u7acb\u5b89\u5168\u611f\u548c\u5f52\u5c5e\u611f\uff0c\u6280\u80fd\u63d0\u5347\u6b21\u4e4b\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u6ee1\u914d\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u5305\u542b\uff1a\u2460\u6bcf\u65e5\u79c1\u804a\u7b7e\u5230\u9f13\u52b1\uff1b\u2461\u4f5c\u4e1a\u70b9\u8bc4\u4ee5\u201c\u53d1\u73b0\u95ea\u5149\u70b9\u201d\u4e3a\u4e3b\uff0c\u6280\u672f\u6307\u5bfc\u9700\u5305\u88f9\u5728\u5927\u91cf\u8d5e\u7f8e\u4e2d\uff1b\u2462\u5728\u7fa4\u5185\u521b\u9020\u673a\u4f1a\u8ba9\u4ed6\u5e2e\u52a9\u4ed6\u4eba\uff08\u5982\u6574\u7406\u8d44\u6599\uff09\uff0c\u8d4b\u4e88\u5176\u201c\u88ab\u9700\u8981\u201d\u7684\u4ef7\u503c\u611f\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u7edd\u4e0d\u5bf9\u5176\u4f7f\u7528\u4efb\u4f55\u4e25\u5389\u6216\u5426\u5b9a\u6027\u70b9\u8bc4**\uff0c\u9700\u5c06\u6279\u8bc4\u8f6c\u5316\u4e3a\u201c\u53ef\u4ee5\u66f4\u597d\u7684\u65b9\u5411\u201d\u30022. **\u7981\u6b62\u5728\u7fa4\u5185\u516c\u5f00\u6bd4\u8f83**\u5176\u4e0e\u5176\u4ed6\u5b66\u5458\u7684\u8fdb\u5ea6\u6216\u6c34\u5e73\u30023. **\u7981\u6b62\u5728\u521d\u671f\u63d0\u53ca\u4efb\u4f55\u201c\u63a5\u5355\u8d5a\u94b1\u201d\u7684\u538b\u529b**\uff0c\u9700\u6de1\u5316\u53d8\u73b0\uff0c\u5f3a\u8c03\u6210\u957f\u4e0e\u793e\u7fa4\u4ef7\u503c\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5347\u5355**\u3002\u5728\u53ef\u89c1\u7684\u672a\u6765\uff08\u81f3\u5c113\u4e2a\u6708\u5185\uff09\uff0c\u7981\u6b62\u5bf9\u5176\u63a8\u9500\u4efb\u4f55\u9ad8\u9636\u8bfe\u7a0b\u3001\u8bbe\u5907\u6216\u670d\u52a1\u3002\u9996\u8981\u4efb\u52a1\u662f\u7a33\u4f4f\u5176\u60c5\u7eea\uff0c\u9632\u6b62\u56e0\u7ecf\u6d4e\u538b\u529b\u53e0\u52a0\u5b66\u4e60\u632b\u6298\u800c\u5d29\u76d8\u9000\u8d39\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u8d2b\u7a77\u4f7f\u6211\u6cea\u6d41\u6ee1\u9762\uff0c\u6211\u73b0\u9636\u6bb5\u53c2\u52a0\u4e0d\u4e86\u4e86\u2026\u8fd9\u4e9b\u94b1\u591f\u6211\u5bb6\u4eba\u4e00\u4e2a\u900f\u6790\u7597\u7a0b\u7684\u94b1\u4e86\u2026\u5bb6\u5ead\u60c5\u51b5\u4e5f\u590d\u6742\uff0c\u6211\u53c8\u8fd9\u4e2a\u8eab\u4f53**\u201d\n2. > \u201c**\u4e3b\u8981\u662f\u6211\u6709\u70b9\u5b8c\u7f8e\u4e3b\u4e49\u548c\u5f3a\u8feb\u75c7[\u6342\u8138]\uff0c\u56f0\u6270\u6211\u597d\u4e45\u4e86**\u201d\n3. > \u201c**\u4e0d\u77e5\u9053\u8fd9\u80fd\u4e0d\u80fd\u8bf4\u554a\u2026\u6211\u6709\u70b9\u5c0f\u6b8b\u75be\uff0c\u4e3b\u8981\u662f\u8111\u90e8\u53d7\u521b\u5bfc\u81f4\u53f3\u773c\u5931\u660e\uff0c\u8fd9\u6bb5\u65f6\u95f4\u53ef\u80fd\u4f1a\u7ed9\u7c73\u679c\u8001\u5e08\u6dfb\u9ebb\u70e6\u4e86\u3002**\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u3001\u5f52\u5c5e\u4e0e\u4ef7\u503c\u8ba4\u540c\uff0c\u4ee5\u5bf9\u6297\u73b0\u5b9e\u4e2d\u7684\u81ea\u5351\u4e0e\u7ecf\u6d4e\u538b\u529b\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u542f\u52a8\u6ee1\u914d\u60c5\u7eea\u6258\u5e95\uff08C\u6a21\u5757\uff09\uff0c\u7528\u6781\u81f4\u9f13\u52b1\u4e0e\u5b89\u5168\u611f\u6784\u5efa\u201c\u7ebf\u4e0a\u907f\u98ce\u6e2f\u201d\uff0c\u7edd\u5bf9\u7981\u6b62\u65bd\u52a0\u4efb\u4f55\u5b66\u4e1a\u6216\u53d8\u73b0\u538b\u529b\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u793e\u4ea4/\u5c0a\u91cd\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u65e0\u9521\"}\n```";
