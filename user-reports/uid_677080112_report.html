    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u7f3a\u4e4f\u7528\u6237\u5e74\u9f84\u3001\u804c\u4e1a\u3001\u5bb6\u5ead\u7ed3\u6784\u3001\u6536\u5165\u6c34\u5e73\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u3001\u5177\u4f53\u652f\u4ed8\u80fd\u529b\u7b49\u5173\u952e\u80cc\u666f\u4fe1\u606f\u3002\u7528\u6237\u539f\u578b\u5224\u65ad\u4e3b\u8981\u57fa\u4e8e\u4ea4\u4e92\u884c\u4e3a\u6a21\u5f0f\u63a8\u65ad\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4f4e-\u4e2d)**\uff1a\n    *   **\u8868\u5c42**\uff1a\u660e\u786e\u8868\u8fbe\u5b66\u4e60\u610f\u613f\uff08\u201c\u60f3\u62a5\u540d\u201d\uff09\uff0c\u5173\u6ce8\u63a5\u5355\u6d41\u7a0b\u3001\u8bbe\u5907\u8981\u6c42\u3001\u8bfe\u7a0b\u65f6\u957f\uff0c\u6709\u201c\u62c5\u5fc3\u8d5a\u4e0d\u5230\u94b1\u201d\u7684\u987e\u8651\u3002\u8868\u660e\u5176\u6709\u901a\u8fc7\u5b66\u4e60\u6280\u80fd\u589e\u52a0\u6536\u5165\u7684\u76f4\u63a5\u52a8\u673a\u3002\n    *   **\u6df1\u5c42**\uff1a\u591a\u6b21\u8be2\u95ee\u64cd\u4f5c\u7ec6\u8282\uff08\u201c\u6574\u4e2a\u7a0b\u5e8f\u6211\u8fd8\u8499\u80e7\u201d\uff09\u3001\u5bf9\u7f51\u7edc\u652f\u4ed8\u4e0d\u719f\u6089\u3001\u62c5\u5fc3\u8bc8\u9a97\u3001\u9700\u8981\u5bb6\u4eba\u534f\u52a9\u8f6c\u8d26\u3002**\u6838\u5fc3\u52a8\u673a\u53ef\u80fd\u5305\u542b\u793e\u4ea4\u8fde\u63a5\uff08\u201c\u53ef\u4ee5\u4e00\u76f4\u8ddf\u7740\u68a6\u5883\u8001\u5e08\u505a\u5417\uff1f\u201d\uff09\u3001\u5bfb\u6c42\u966a\u4f34\u6307\u5bfc\u4ee5\u5bf9\u6297\u6570\u5b57\u65f6\u4ee3\u7684\u5b64\u7acb\u611f\uff0c\u4ee5\u53ca\u901a\u8fc7\u201c\u5b66\u4e60\u201d\u8fd9\u4e00\u884c\u4e3a\u672c\u8eab\u83b7\u5f97\u4ef7\u503c\u611f\u548c\u5b89\u5168\u611f\uff0c\u800c\u4e0d\u4ec5\u4ec5\u662f\u6280\u80fd\u53d8\u73b0\u3002**\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u6781\u4f4e)**\uff1a\n    *   **\u7ecf\u6d4e\u8d44\u6e90**\uff1a\u652f\u4ed83980\u5143\u8bfe\u7a0b\u8d39\u5b58\u5728\u660e\u663e\u56f0\u96be\u3002\u5fae\u4fe1\u4f59\u989d\u4e0d\u8db3\uff0c\u65e0\u6cd5\u72ec\u7acb\u64cd\u4f5c\u5206\u671f\uff08\u65e0\u4fe1\u7528\u5361/\u82b1\u5457\uff09\uff0c\u9700\u4f9d\u8d56\u5bb6\u4eba\u8f6c\u8d26\uff0c\u4e14\u8fc7\u7a0b\u7e41\u7410\uff08\u201c\u8981\u7b49\u5bb6\u4eba\u56de\u6765\u624d\u5e2e\u8f6c\u5fae\u4fe1\u4e0a\u201d\uff09\u3002**\u7ecf\u6d4e\u7f13\u51b2\u80fd\u529b\u6781\u5f31\uff0c\u8bfe\u7a0b\u8d39\u7528\u53ef\u80fd\u6784\u6210\u5176\u91cd\u5927\u5f00\u652f\u3002**\n    *   **\u6570\u5b57\u7d20\u517b**\uff1a**\u6781\u4f4e**\u3002\u8868\u73b0\u4e3a\uff1a\u4e0d\u719f\u6089\u7f51\u7edc\u652f\u4ed8\u6d41\u7a0b\u3001\u62c5\u5fc3\u8bc8\u9a97\u3001\u4e0d\u4f1a\u4f7f\u7528\u7535\u8111\uff08\u201c\u7535\u8111\u6709\u4f46\u4e0d\u4f1a\u7528\u201d\uff09\u3001\u64cd\u4f5c\u5fae\u4fe1\u529f\u80fd\uff08\u5982\u622a\u56fe\u3001\u6dfb\u52a0\u597d\u53cb\uff09\u5b58\u5728\u969c\u788d\u3001\u542c\u8bfe\u53d7\u7f51\u7edc\u548c\u64cd\u4f5c\u5f71\u54cd\uff08\u201c\u8fdb\u4e0d\u53bb\u201d\u3001\u201c\u58f0\u97f3\u592a\u5c0f\u201d\uff09\u3002\n    *   **\u65f6\u95f4/\u7cbe\u529b**\uff1a\u81ea\u79f0\u201c\u8001\u5e74\u4eba\u201d\uff0c\u6697\u793a\u53ef\u80fd\u6709\u8f83\u591a\u7a7a\u95f2\u65f6\u95f4\uff0c\u4f46\u5b66\u4e60\u65b0\u4e8b\u7269\uff08\u5c24\u5176\u662f\u6570\u5b57\u6280\u80fd\uff09\u7684\u8ba4\u77e5\u8d1f\u8377\u548c\u64cd\u4f5c\u95e8\u69db\u5f88\u9ad8\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u4f4e)**\uff1a\n    *   **\u51b3\u7b56\u72b9\u8c6b**\uff1a\u4ece\u201c\u6bcf\u5929\u575a\u6301\u81ea\u7ec3\u201d\u5230\u8be2\u95ee\u4ef7\u683c\u3001\u62c5\u5fc3\u64cd\u4f5c\u3001\u53cd\u590d\u786e\u8ba4\u6d41\u7a0b\uff0c\u51b3\u7b56\u5468\u671f\u957f\uff0c\u8868\u73b0\u51fa\u9ad8\u8c28\u614e\u548c\u4f4e\u81ea\u4fe1\u3002\n    *   **\u98ce\u9669\u538c\u6076**\uff1a\u5bf9\u652f\u4ed8\u5b89\u5168\u3001\u8bfe\u7a0b\u6709\u6548\u6027\uff08\u201c\u518d\u4e5f\u8054\u7cfb\u4e0d\u4e0a\u8001\u5e08\u201d\uff09\u3001\u63a5\u5355\u53ef\u884c\u6027\u5b58\u5728\u591a\u91cd\u62c5\u5fe7\u3002**\u5bf9\u4e0d\u786e\u5b9a\u6027\u7684\u5bb9\u5fcd\u5ea6\u6781\u4f4e\u3002**\n    *   **\u4f9d\u8d56\u6027\u9ad8**\uff1a\u6280\u672f\u64cd\u4f5c\u4f9d\u8d56\u9500\u552e\u6307\u5bfc\uff0c\u652f\u4ed8\u4f9d\u8d56\u5bb6\u4eba\uff0c\u5b66\u4e60\u8fc7\u7a0b\u5e0c\u671b\u6709\u8001\u5e08\u6301\u7eed\u5e26\u9886\uff08\u201c\u53ef\u4ee5\u4e00\u76f4\u8ddf\u7740\u68a6\u5883\u8001\u5e08\u505a\u5417\uff1f\u201d\uff09\u3002\u81ea\u4e3b\u89e3\u51b3\u95ee\u9898\u548c\u5e94\u5bf9\u632b\u6298\u7684\u80fd\u529b\u9884\u671f\u8f83\u5f31\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a**\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u4e8e4\u67088\u65e5\u5b8c\u62103980\u5143\u652f\u4ed8\u3002\u4f46\u652f\u4ed8\u8fc7\u7a0b\u66b4\u9732\u5176\u7ecf\u6d4e\u8d44\u6e90\u7d27\u5f20\u4e0e\u6570\u5b57\u64cd\u4f5c\u969c\u788d\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u90e8\u5206\u4f9d\u8d56\u5bb6\u5ead**\u3002\u652f\u4ed8\u9700\u5bb6\u4eba\u534f\u52a9\u64cd\u4f5c\uff0c\u4e14\u4e3b\u52a8\u8981\u6c42\u53d1\u7968\u201c\u514d\u5bb6\u4eba\u5b89\u5fc3\u201d\uff0c\u8868\u660e\u5bb6\u5ead\u6210\u5458\u7684\u77e5\u6653\u4e0e\u652f\u6301\u662f\u5176\u51b3\u7b56\u7684\u91cd\u8981\u8003\u91cf\uff0c\u4f46\u975e\u5b8c\u5168\u51b3\u7b56\u8005\u3002\n*   **\u6b65\u9aa41-4\u5224\u5b9a**\uff1a\n    *   **A\u8f74\uff08\u652f\u4ed8\u80fd\u529b\uff09**\uff1a\u5f31\u3002\u867d\u5b8c\u6210\u652f\u4ed8\uff0c\u4f46\u8fc7\u7a0b\u8270\u96be\uff0c\u663e\u793a\u5176\u7ecf\u6d4e\u8d44\u6e90\u8584\u5f31\uff0c\u5c5e\u4e8e**\u652f\u4ed8\u654f\u611f\u578b**\u3002\n    *   **B\u8f74\uff08\u5b66\u4e60\u6548\u80fd\uff09**\uff1a\u6781\u5f31\u3002\u6570\u5b57\u7d20\u517b\u6781\u4f4e\uff0c\u63a5\u53d7\u65b0\u4fe1\u606f\u6162\uff08\u201c\u63a5\u53d7\u7406\u89e3\u80fd\u529b\u5dee\u201d\uff09\uff0c\u5bf9\u590d\u6742\u64cd\u4f5c\u6d41\u7a0b\u611f\u5230\u56f0\u60d1\uff0c**\u5b66\u4e60\u9002\u5e94\u6027\u98ce\u9669\u6781\u9ad8**\u3002\n    *   **C\u8f74\uff08\u76ee\u6807\u7406\u6027\uff09**\uff1a\u4e2d\u4f4e\u3002\u6709\u53d8\u73b0\u671f\u671b\uff0c\u4f46\u66f4\u5173\u6ce8\u8fc7\u7a0b\u7684\u5b89\u5168\u611f\u4e0e\u966a\u4f34\uff08\u201c\u8981\u5fc3\u91cc\u6709\u5e95\u624d\u52a0\u5165\u201d\uff09\uff0c\u76ee\u6807\u6a21\u7cca\u4e14\u6613\u53d7\u632b\u3002\n    *   **D\u8f74\uff08\u884c\u52a8\u81ea\u4e3b\uff09**\uff1a\u6781\u5f31\u3002\u9ad8\u5ea6\u4f9d\u8d56\u5916\u90e8\u6307\u5bfc\uff0c\u5728\u64cd\u4f5c\u5c42\u9762\u51e0\u4e4e\u65e0\u81ea\u4e3b\u80fd\u529b\u3002\n*   **\u7efc\u5408\u5224\u5b9a**\uff1a**B-\u578b\u7528\u6237 (\u4f4e\u6548\u80fd\u654f\u611f\u578b)**\u3002\u6838\u5fc3\u7279\u5f81\u4e3a**\u6781\u4f4e\u7684\u5b66\u4e60\u57fa\u7840\u4e0e\u64cd\u4f5c\u80fd\u529b**\uff0c\u4f34\u968f\u7ecf\u6d4e\u654f\u611f\u548c\u5bf9\u5b89\u5168\u611f\u7684\u5f3a\u70c8\u9700\u6c42\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b\uff1aT4 \u4f4e\u6548\u80fd\u63a2\u7d22\u8005**\u3002\n    *   **\u9ad8\u5ea6\u543b\u5408\u70b9**\uff1a\u6570\u5b57\u9e3f\u6c9f\u660e\u663e\u3001\u5b66\u4e60\u57fa\u7840\u8584\u5f31\u3001\u64cd\u4f5c\u5b66\u4e60\u6bcf\u4e00\u6b65\u90fd\u9700\u5f15\u5bfc\u3001\u5bf9\u201c\u88ab\u629b\u5f03\u201d\uff08\u8054\u7cfb\u4e0d\u4e0a\u8001\u5e08\uff09\u6709\u6df1\u5ea6\u7126\u8651\u3001\u652f\u4ed8\u80fd\u529b\u6709\u9650\u3002\n    *   **\u504f\u5dee\u70b9**\uff1a\u7528\u6237\u8868\u73b0\u51fa\u6bd4\u5178\u578bT4\u66f4\u5f3a\u70c8\u7684\u53d8\u73b0\u671f\u671b\uff0c\u4f46\u7ed3\u5408\u5176\u8d44\u6e90\u5e95\u5ea7\u770b\uff0c\u6b64\u671f\u671b\u66f4\u53ef\u80fd\u662f\u4e00\u79cd\u5bf9\u201c\u7ecf\u6d4e\u81ea\u4e3b\u201d\u7684\u5411\u5f80\uff0c\u800c\u975e\u5207\u5b9e\u53ef\u884c\u7684\u8ba1\u5212\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4e2d-\u9ad8)\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u5176\u6570\u5b57\u64cd\u4f5c\u80fd\u529b\u662f\u63a5\u5355\u53d8\u73b0\u7684**\u5de8\u5927\u786c\u6027\u969c\u788d**\uff0c\u5f88\u53ef\u80fd\u65e0\u6cd5\u5b8c\u6210\u8bfe\u7a0b\u4efb\u52a1\u6216\u63a5\u5355\u64cd\u4f5c\uff0c\u6781\u6613\u4ea7\u751f\u201c\u5b66\u4e0d\u4f1a\u201d\u7684\u632b\u8d25\u611f\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u9ad8\u98ce\u9669**\u30023980\u5143\u5bf9\u5176\u6784\u6210\u663e\u8457\u7ecf\u6d4e\u8d1f\u62c5\uff0c\u652f\u4ed8\u8fc7\u7a0b\u5df2\u4f53\u73b0\u538b\u529b\u3002\u5b66\u4e60\u82e5\u9047\u632b\uff0c\u7ecf\u6d4e\u538b\u529b\u5c06\u52a0\u5267\u9000\u8d39\u610f\u613f\u3002\n    3.  **\u670d\u52a1\u4f53\u9a8c**\uff1a**\u4e2d\u98ce\u9669**\u3002\u5bf9\u6301\u7eed\u6027\u6307\u5bfc\u8981\u6c42\u9ad8\uff08\u201c\u53ef\u4ee5\u4e00\u76f4\u8ddf\u7740\u2026\u505a\u5417\uff1f\u201d\uff09\uff0c\u82e5\u73ed\u4e3b\u4efb\u54cd\u5e94\u4e0d\u53ca\u65f6\u6216\u672a\u80fd\u63d0\u4f9b\u201c\u624b\u628a\u624b\u201d\u7ea7\u6307\u5bfc\uff0c\u6613\u4ea7\u751f\u88ab\u5ffd\u89c6\u611f\u3002\n    4.  **\u8bfe\u7a0b\u5339\u914d**\uff1a**\u9ad8\u98ce\u9669**\u3002\u73b0\u6709\u8bfe\u7a0b\u4f53\u7cfb\uff08\u542b\u76f4\u64ad\u3001\u5f55\u64ad\u3001\u63a5\u5355\u5e73\u53f0\uff09\u5bf9\u5176\u5f53\u524d\u7684\u6570\u5b57\u64cd\u4f5c\u6c34\u5e73\u800c\u8a00**\u4e25\u91cd\u9519\u914d**\uff0c\u5b66\u4e60\u8def\u5f84\u5b58\u5728\u5de8\u5927\u65ad\u5c42\u3002\n    5.  **\u51b3\u7b56\u975e\u7406\u6027/\u51b2\u52a8**\uff1a\u4f4e\u98ce\u9669\u3002\u51b3\u7b56\u7f13\u6162\u4e14\u8c28\u614e\uff0c\u975e\u51b2\u52a8\u6d88\u8d39\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u4e2d\u98ce\u9669**\u3002\u5bb6\u4eba\u867d\u534f\u52a9\u652f\u4ed8\uff0c\u4f46\u82e5\u5b66\u4e60\u65e0\u8fdb\u5c55\u6216\u4ea7\u751f\u989d\u5916\u8d39\u7528\uff08\u5982\u8bbe\u5907\uff09\uff0c\u53ef\u80fd\u5f15\u53d1\u5bb6\u5ead\u5185\u90e8\u53cd\u5bf9\u3002\n    7.  **\u7ade\u54c1/\u653f\u7b56**\uff1a\u4f4e\u98ce\u9669\u3002\u672a\u63d0\u53ca\u3002\n*   **\u7efc\u5408\u98ce\u9669\u7b49\u7ea7**\uff1a**\u9ad8**\u3002\u98ce\u9669\u96c6\u4e2d\u4e8e\u201c\u80fd\u529b-\u8bfe\u7a0b\u201d\u9519\u914d\u5bfc\u81f4\u7684\u5b66\u4e1a\u632b\u8d25\uff0c\u8fdb\u800c\u89e6\u53d1\u7ecf\u6d4e\u538b\u529b\u4e0b\u7684\u9000\u8d39\u8bc9\u6c42\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u9500\u552e\u884c\u4e3a**\uff1a\n    *   **\u5408\u89c4\u70b9**\uff1a\u8bf4\u660e\u4e86\u9000\u8d39\u653f\u7b56\uff08\u201c\u6ca1\u5b66\u5b8c\u2026\u5269\u4e0b\u7684\u9000\u7ed9\u4f60\u201d\uff09\u3001\u53ef\u5f00\u53d1\u7968\u3001\u8bfe\u7a0b\u5185\u5bb9\uff0842\u8282\u5f55\u64ad\u7b49\uff09\u3002\n    *   **\u98ce\u9669\u70b9**\uff1a\n        *   **\u8fc7\u5ea6\u7b80\u5316\u63a5\u5355\u95e8\u69db**\uff1a\u591a\u6b21\u5f3a\u8c03\u201c\u4e00\u90e8\u624b\u673a\u5c31\u53ef\u4ee5\u201d\u3001\u201c\u5148\u4ece\u7b80\u5355\u7684\u505a\u8d77\u6765\u201d\uff0c**\u5f31\u5316\u4e86\u6709\u58f0\u6f14\u64ad\u5bf9\u8bbe\u5907\u3001\u73af\u5883\u3001\u6280\u80fd\u7684\u5ba2\u89c2\u8981\u6c42**\uff0c\u53ef\u80fd\u8ba9\u7528\u6237\u4ea7\u751f\u4e0d\u5207\u5b9e\u9645\u7684\u9884\u671f\u3002\n        *   **\u5229\u7528\u7a00\u7f3a\u6027\u8bdd\u672f**\uff1a\u201c\u6700\u540e1\u6b21\u62db\u52df\u201d\u3001\u201c\u8bfe\u7a0b\u5c31\u4e0a\u5b8c\u7ed3\u8bfe\u4e86\u201d\u3001\u201c\u8fd9\u4e2a\u6708\u4e2d\u65ec\u5c31\u505c\u6b62\u62db\u751f\u4e86\u201d\uff0c\u53ef\u80fd\u5bf9\u72b9\u8c6b\u578b\u7528\u6237\u9020\u6210\u4e0d\u5f53\u538b\u529b\u3002\n        *   **\u5bf9\u7528\u6237\u80fd\u529b\u8bc4\u4f30\u7f3a\u5931**\uff1a\u5728\u5df2\u77e5\u7528\u6237\u4e3a\u201c\u8001\u5e74\u4eba\u201d\u3001\u201c\u7f51\u7edc\u4e0d\u662f\u5341\u5206\u4e86\u89e3\u201d\u3001\u201c\u7535\u8111\u4e0d\u4f1a\u7528\u201d\u7684\u60c5\u51b5\u4e0b\uff0c**\u672a\u5bf9\u5176\u80fd\u5426\u8ddf\u4e0a\u8bfe\u7a0b\u8282\u594f\u548c\u5b8c\u6210\u64cd\u4f5c\u8fdb\u884c\u4efb\u4f55\u98ce\u9669\u63d0\u793a\u6216\u8bc4\u4f30**\uff0c\u5b58\u5728\u9500\u552e\u5bfc\u5411\u5927\u4e8e\u7528\u6237\u9002\u914d\u7684\u95ee\u9898\u3002\n*   **\u4f26\u7406\u9632\u7ebf**\uff1a\u9500\u552e\u8fc7\u7a0b\u5728\u201c\u77e5\u60c5\u540c\u610f\u201d\u5c42\u9762\u5b58\u5728\u7455\u75b5\uff0c\u7528\u6237\u5bf9\u8bfe\u7a0b\u7684\u771f\u5b9e\u96be\u5ea6\u548c\u81ea\u8eab\u9700\u514b\u670d\u7684\u969c\u788d\u8ba4\u77e5\u4e0d\u8db3\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**\uff1a**\u4e25\u91cd\u9519\u914d**\u3002\u6807\u51c6\u5316\u7684\u6709\u58f0\u6f14\u64ad\u53d8\u73b0\u8bfe\u7a0b\u6781\u4e0d\u9002\u5408\u8be5\u7528\u6237\u5f53\u524d\u9636\u6bb5\u3002\u5176\u9996\u8981\u9700\u6c42\u662f**\u6570\u5b57\u626b\u76f2\u548c\u5efa\u7acb\u5b66\u4e60\u81ea\u4fe1**\uff0c\u800c\u975e\u76f4\u63a5\u6280\u80fd\u53d8\u73b0\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**24\u5c0f\u65f6\u5185\u542f\u52a8\u9ad8\u5173\u6000\u4ecb\u5165\u4e0e\u9884\u671f\u6821\u6b63**\u3002\n*   **\u5177\u4f53\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9996\u5468\u6838\u5fc3\u4efb\u52a1\uff1a\u5efa\u7acb\u4fe1\u4efb\u4e0e\u80fd\u529b\u6478\u5e95**\u3002\u73ed\u4e3b\u4efb\u9700\u4e3b\u52a8\u8fdb\u884c\u4e00\u5bf9\u4e00\u89c6\u9891\u6216\u957f\u65f6\u95f4\u8bed\u97f3\u901a\u8bdd\uff0c\u624b\u628a\u624b\u6307\u5bfc\u5176\u4f7f\u7528\u5b66\u4e60\u5e73\u53f0\uff0c\u8bc4\u4f30\u5176\u771f\u5b9e\u64cd\u4f5c\u6c34\u5e73\u3002\u6c9f\u901a\u91cd\u70b9\u5728\u4e8e\u8868\u8fbe\u652f\u6301\uff0c\u800c\u975e\u50ac\u4fc3\u5b66\u4e60\u3002\n    2.  **\u5927\u5e45\u964d\u4f4e\u77ed\u671f\u9884\u671f**\uff1a\u5fc5\u987b\u660e\u786e\u544a\u77e5\uff0c\u524d\u671f\u91cd\u70b9\u5728\u4e8e\u201c\u5b66\u4f1a\u5982\u4f55\u4e0a\u8bfe\u3001\u4ea4\u4f5c\u4e1a\u201d\uff0c\u800c\u975e\u63a5\u5355\u3002**\u6821\u6b63\u201c\u5feb\u901f\u53d8\u73b0\u201d\u9884\u671f**\uff0c\u5c06\u5176\u5b66\u4e60\u76ee\u6807\u8c03\u6574\u4e3a\u201c\u719f\u6089\u6d41\u7a0b\uff0c\u5b8c\u6210\u7b2c\u4e00\u8282\u8bfe\u201d\u3002\n    3.  **\u63d0\u4f9b\u8d85\u5e38\u89c4\u652f\u6301**\uff1a\u4e3a\u5176\u5efa\u7acb\u4e13\u5c5e\u7684\u201c\u6162\u901f\u652f\u6301\u901a\u9053\u201d\uff0c\u5982\u7b80\u5316\u7248\u56fe\u6587\u6307\u5f15\u3001\u5f55\u5236\u64cd\u4f5c\u5c0f\u89c6\u9891\u3001\u5141\u8bb8\u5176\u901a\u8fc7\u6700\u4fbf\u6377\u7684\u65b9\u5f0f\uff08\u5982\u7535\u8bdd\uff09\u63d0\u95ee\u3002**\u5bb9\u5fcd\u5176\u7f13\u6162\u7684\u5b66\u4e60\u8fdb\u5ea6**\u3002\n    4.  **\u5bb6\u5ead\u534f\u540c**\uff1a\u5728\u83b7\u5f97\u7528\u6237\u540c\u610f\u540e\uff0c\u53ef\u5c1d\u8bd5\u4e0e\u534f\u52a9\u5176\u652f\u4ed8\u7684\u5bb6\u4eba\u5efa\u7acb\u8054\u7cfb\uff0c\u8bf4\u660e\u5b66\u4e60\u8ba1\u5212\u548c\u652f\u6301\u65b9\u6848\uff0c\u4e89\u53d6\u5bb6\u5ead\u7684\u7406\u89e3\u4e0e\u914d\u5408\u3002\n    5.  **\u98ce\u9669\u9884\u6848**\uff1a\u5bc6\u5207\u89c2\u5bdf\u5176\u524d\u4e24\u5468\u7684\u5b66\u4e60\u72b6\u6001\u3002\u82e5\u51fa\u73b0\u65e0\u6cd5\u514b\u670d\u7684\u64cd\u4f5c\u969c\u788d\u6216\u5f3a\u70c8\u632b\u8d25\u60c5\u7eea\uff0c\u5e94\u4e3b\u52a8\u542f\u52a8**\u7eff\u8272\u529d\u9000\u6216\u8f6c\u8bfe\u673a\u5236**\uff0c\u63a8\u8350\u5176\u5148\u5b66\u4e60\u66f4\u57fa\u7840\u7684\u624b\u673a\u5e94\u7528\u6216\u5174\u8da3\u7c7b\u8bfe\u7a0b\uff0c\u907f\u514d\u786c\u6027\u63a8\u8fdb\u5bfc\u81f4\u6295\u8bc9\u3002\n\n{\"core_type\": \"T4 \u4f4e\u6548\u80fd\u63a2\u7d22\u8005\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"product_match\": \"\u9519\u914d\", \"action\": \"24\u5c0f\u65f6\u5185\u542f\u52a8\u9ad8\u5173\u6000\u4ecb\u5165\u4e0e\u9884\u671f\u6821\u6b63\"}";
