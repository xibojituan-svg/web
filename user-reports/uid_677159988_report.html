    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u5c0f\u7897555 (UID: 677159988) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u84dd\u96ea\uff08\u9ad8\u7ea2\u6885\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u6f14\u64ad\u9ad8\u9636\u8bfe\u7a0b (\u5df2\u652f\u4ed8) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u91d1\u989d\u6216\u8d44\u91d1\u6765\u6e90\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u5b58\u5728\u501f\u8d37\u3001\u5206\u671f\u7b49\u9690\u60a3\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u7528\u6237\u80fd\u53ca\u65f6\u54cd\u5e94\u5e76\u5b8c\u6210\u4f5c\u4e1a\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u804c\u4e1a\u3001\u4f5c\u606f\u6216\u5bb6\u5ead\u8d23\u4efb\uff0c\u65e0\u6cd5\u8bc4\u4f30\u65f6\u95f4\u4e0e\u7cbe\u529b\u7684\u53ef\u6301\u7eed\u6027\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u4fe1\u606f\uff0c\u5bb6\u5ead\u51b3\u7b56\u6743\u672a\u77e5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u804a\u5929\u8bb0\u5f55\u4e3b\u8981\u4e3a\u9500\u552e\u5f15\u5bfc\u4e0b\u7684\u4efb\u52a1\u54cd\u5e94\u4e0e\u8bfe\u7a0b\u4e92\u52a8\uff0c\u7f3a\u4e4f\u5173\u4e8e\u7528\u6237\u80cc\u666f\u3001\u7ecf\u6d4e\u72b6\u51b5\u3001\u5b66\u4e60\u76ee\u6807\u3001\u5bb6\u5ead\u73af\u5883\u7684\u6df1\u5ea6\u4ea4\u6d41\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e\uff0c\u4f46\u5bf9\u5b66\u4e60\u5185\u5bb9\u548c\u6280\u80fd\u63d0\u5347\u4e5f\u8868\u73b0\u51fa\u79ef\u6781\u5174\u8da3\uff0c\u672a\u8981\u6c42\u77ed\u671f\u4fdd\u5e95\u627f\u8bfa\uff0c\u6001\u5ea6\u5f00\u653e\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08\u6211\u90fd\u53ef\u4ee5\u5b66 \u90fd\u53ef\u4ee5\u505a\u201d\uff1b> \u201c\u867d\u7136\u5bf9\u8f68\u6ca1\u5b66\u8fc7 \u4f46\u6211\u4f1a\u7528\u526a\u6620\u201d\uff1b> \u201c\u6ca1\u9519 \u6211\u6700\u8fd1\u4e5f\u662f\u7a81\u7136\u5f00\u609f \u6211\u4e5f\u5728\u5b66\u526a\u8f91ai\u8fd9\u4e9b \u53d1\u73b0\u7b2c\u4e00\u6b65\u662f\u6700\u91cd\u8981\u7684\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u8bc4\u7ea7**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u5df2\u652f\u4ed8\u9ad8\u9636\u8bfe\u7a0b\uff0c\u4f46\u8d44\u91d1\u6765\u6e90\u3001\u652f\u4ed8\u538b\u529b\u672a\u77e5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u80fd\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\uff0c\u4f46\u957f\u671f\u5b66\u4e60\u65f6\u95f4\u4fdd\u969c\u672a\u77e5\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u5b8c\u5168\u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u8868\u73b0\u51fa\u79ef\u6781\u3001\u4e3b\u52a8\u7684\u5b66\u4e60\u6001\u5ea6\uff0c\u9047\u5230\u95ee\u9898\uff08\u5982\u8f6f\u4ef6\u64cd\u4f5c\u3001\u6587\u672c\u7406\u89e3\uff09\u80fd\u81ea\u884c\u5c1d\u8bd5\u5e76\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u672a\u51fa\u73b0\u8d1f\u9762\u60c5\u7eea\u6216\u4f9d\u8d56\u5b89\u629a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6bd4\u60f3\u8c61\u7684\u6709\u96be\u5ea6[\u5077\u7b11]\u201d\uff1b> \u201c\u5c31\u662f\u9700\u8981\u901a\u8bfb\u4e86\u89e3\u4e00\u4e0b\u4eba\u7269\u5173\u7cfb\u201d\uff1b> \u201c\u6211\u8bd5\u8bd5\u770b\u201d\uff1b> \u201c\u8001\u5e08\uff01\uff01\uff01\u6211\u9519\u4e86 \u6211\u672c\u6765\u70b9\u5f00\u60f3\u770b\u770b\u6587\u672c\uff0c\u7ed3\u679c\u4e94\u5206\u949f\u54af\u5623\u5c31\u7ed3\u675f\u4e86\uff0c\u6211\u5c31\u5ff5\u4e86\u4e00\u6bb5[\u6342\u8138]\u201d (\u4ee5\u8f7b\u677e\u3001\u81ea\u5632\u65b9\u5f0f\u9762\u5bf9\u5c0f\u5931\u8bef)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 (Esteem Needs)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u81ea\u8eab\u80fd\u529b\uff08\u55d3\u97f3\uff09\u5b58\u5728\u4e0d\u81ea\u4fe1\uff08\u201c\u6211\u7684\u55d3\u97f3\u542c\u7740\u5c31\u7279\u522b\u8584\u201d\uff09\uff0c\u4f46\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u65b0\u6280\u80fd\uff08\u6709\u58f0\u3001\u526a\u8f91\u3001AI\uff09\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u548c\u81ea\u6211\u4ef7\u503c\u63d0\u5347\uff0c\u5bfb\u6c42\u201c\u5f00\u609f\u201d\u548c\u8fdb\u6b65\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u8d4b\u80fd**\u3002\u901a\u8fc7\u5177\u4f53\u3001\u4e13\u4e1a\u7684\u70b9\u8bc4\uff08\u5982\u201c\u5fa1\u59d0\u97f3\u201d\u5b9a\u4f4d\u3001\u8d5b\u9053\u89c4\u5212\uff09\u548c\u63d0\u4f9b\u5b9e\u8df5\u673a\u4f1a\uff08\u8bd5\u97f3\u3001\u7248\u6743\u4e66\uff09\uff0c\u6ee1\u8db3\u5176\u83b7\u5f97\u6280\u80fd\u8ba4\u53ef\u3001\u5efa\u7acb\u4e13\u4e1a\u81ea\u4fe1\u7684\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u7cbe\u786e\u5224\u5b9a**\u3002\u52a8\u673a\u7eaf\u5ea6\u4e2d\u7b49\uff0c\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4f46\u8d44\u6e90\u5e95\u5ea7\uff08\u5c24\u5176\u662f\u5bb6\u5ead\u652f\u6301\uff09\u5b8c\u5168\u672a\u77e5\uff0c\u65e0\u6cd5\u901a\u8fc7\u5224\u5b9a\u6811\u5b8c\u6210\u6700\u7ec8\u5206\u6d41\u3002 |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **\u503e\u5411 T2 \u4f4e\u8c03\u5b9e\u5e72\u578b**\u3002\u8868\u73b0\u51fa\u79ef\u6781\u5b66\u4e60\u3001\u4e3b\u52a8\u5c1d\u8bd5\u3001\u4e0d\u60e7\u56f0\u96be\u7684\u7279\u8d28\uff0c\u5173\u6ce8\u6280\u80fd\u672c\u8eab\u548c\u5b9e\u64cd\u673a\u4f1a\uff08\u201c\u53ef\u4ee5\u5e72\u54c8\u54c8\u201d\uff09\uff0c\u7b26\u5408\u5b9e\u5e72\u578b\u7279\u5f81\u3002 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u57fa\u4e8e\u73b0\u6709\u4fe1\u606f)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5ead\u5f3a\u70c8\u53cd\u5bf9\u7b49\u7ea2\u7ebf\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d (\u4fe1\u606f\u7f3a\u5931\uff0c\u9700\u8b66\u60d5)** | \u804a\u5929\u8bb0\u5f55\u5b8c\u5168\u672a\u63d0\u53ca\u5bb6\u5ead\uff0c\u5b58\u5728\u9690\u7792\u6216\u5bb6\u4eba\u4e0d\u77e5\u60c5\u7684\u98ce\u9669\u3002\u4e00\u65e6\u5bb6\u4eba\u53cd\u5bf9\uff0c\u53ef\u80fd\u6210\u4e3a\u4e3b\u8981\u9000\u8d39\u539f\u56e0\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u7528\u6237\u5b66\u4e60\u914d\u5408\u5ea6\u9ad8\uff0c\u80fd\u4e3b\u52a8\u5b8c\u6210\u4f5c\u4e1a\uff0c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u521d\u6b65\u9a8c\u8bc1\u826f\u597d\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u8f7b\u677e\u9762\u5bf9\u5c0f\u632b\u6298\uff0c\u81ea\u6211\u8c03\u8282\u80fd\u529b\u5f3a\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u7528\u6237\u5bf9\u201c\u53d8\u73b0\u201d\u3001\u201c\u517c\u804c\u201d\u6709\u660e\u786e\u671f\u5f85\uff08\u201c\u90fd\u53ef\u4ee5\u505a\u201d\uff09\uff0c\u82e5\u5b66\u4e60\u4e2d\u671f\u672a\u83b7\u5f97\u9884\u671f\u6536\u76ca\uff08\u5982\u8bd5\u97f3\u5931\u8d25\u3001\u65e0\u5355\u53ef\u63a5\uff09\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c3-4\u5468\uff08\u9996\u6b21\u5b9e\u8df5\u6210\u679c\u671f\uff09**\u3002\u5f53\u7528\u6237\u5f00\u59cb\u5c1d\u8bd5\u63a5\u5355\u6216\u53c2\u4e0e\u9879\u76ee\uff0c\u82e5\u8fde\u7eed\u53d7\u632b\u6216\u6536\u76ca\u8fdc\u4f4e\u4e8e\u9884\u671f\uff0c\u7ed3\u5408\u53ef\u80fd\u7684\u5bb6\u5ead\u538b\u529b\uff0c\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5c0f\u7897\uff0c\u770b\u5230\u4f60\u63d0\u524d\u5b8c\u6210\u4f5c\u4e1a\u3001\u4e3b\u52a8\u5c1d\u8bd5\u8bd5\u97f3\u5355\uff0c\u8fd9\u80a1\u2018\u5148\u8d77\u98de\u518d\u8c03\u6574\u59ff\u52bf\u2019\u7684\u52b2\u5934\u592a\u68d2\u4e86\uff01\u4f60\u7684\u5fa1\u59d0\u97f3\u5e95\u5b50\u5f88\u597d\uff0c\u54b1\u4eec\u9ad8\u9636\u8bfe\u5c31\u662f\u5e2e\u4f60\u628a\u2018\u53ef\u4ee5\u5e72\u2019\u53d8\u6210\u2018\u5e72\u5f97\u6f02\u4eae\u2019\u3002\u8fc7\u7a0b\u4e2d\u6709\u4efb\u4f55\u6280\u672f\u96be\u9898\uff0c\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u641e\u5b9a\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u91cd\u70b9\u5339\u914d\u5b9e\u64cd\u4efb\u52a1\u3001\u4e13\u4e1a\u70b9\u8bc4\u548c\u65e9\u671f\u8bd5\u97f3\u673a\u4f1a\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u6f5c\u5728\u7684\u5c0a\u91cd\u9700\u6c42\uff0c\u8865\u5145**\u3010\u5708\u5c42\u8ba4\u53ef\u8f85\u52a9\u5305\u3011**\uff0c\u5982\u9080\u8bf7\u5176\u5206\u4eab\u5b66\u4e60\u5fc3\u5f97\u3001\u5728\u73ed\u7ea7\u5185\u7ed9\u4e88\u201c\u6280\u672f\u8fbe\u4eba\u201d\u7b49\u975e\u6b63\u5f0f\u5934\u8854\uff0c\u589e\u5f3a\u5176\u6210\u5c31\u611f\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u5ffd\u89c6\u5bb6\u5ead\u80cc\u666f\u63a2\u67e5**\uff1a\u73ed\u4e3b\u4efb\u9700\u5728\u9996\u6b21\u6df1\u5ea6\u6c9f\u901a\u4e2d\uff0c\u4ee5\u5173\u5fc3\u53e3\u543b\u81ea\u7136\u4e86\u89e3\u5176\u5b66\u4e60\u662f\u5426\u83b7\u5f97\u5bb6\u4eba\u652f\u6301\u30022. **\u53ea\u753b\u53d8\u73b0\u5927\u997c**\uff1a\u907f\u514d\u8fc7\u5ea6\u627f\u8bfa\u77ed\u671f\u9ad8\u6536\u76ca\uff0c\u5e94\u5f3a\u8c03\u6280\u80fd\u79ef\u7d2f\u548c\u957f\u671f\u53d1\u5c55\u30023. **\u7ed9\u4e88\u6a21\u7cca\u3001\u6577\u884d\u7684\u53cd\u9988**\uff1a\u5979\u7684\u8fdb\u6b65\u9700\u8981\u5177\u4f53\u3001\u4e13\u4e1a\u7684\u8ba4\u53ef\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u8c28\u614e\u63a8\u4ecb\u9ad8\u9636\u5b9e\u8df5\u6216\u4e13\u9879\u63d0\u5347\u8bfe\u7a0b**\u3002\u56e0\u5176\u5df2\u8868\u73b0\u51fa\u6301\u7eed\u5b66\u4e60\u610f\u613f\uff08\u5b66\u526a\u8f91\u3001AI\uff09\uff0c\u5728\u73b0\u6709\u8bfe\u7a0b\u53d6\u5f97\u9636\u6bb5\u6027\u6210\u679c\u540e\uff0c\u53ef\u57fa\u4e8e\u5176\u5177\u4f53\u77ed\u677f\u63a8\u8350\u9488\u5bf9\u6027\u4ea7\u54c1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u8001\u5e08\u6211\u90fd\u53ef\u4ee5\u5b66 \u90fd\u53ef\u4ee5\u505a\u201d\n2. > \u201c\u867d\u7136\u5bf9\u8f68\u6ca1\u5b66\u8fc7 \u4f46\u6211\u4f1a\u7528\u526a\u6620\u201d\n3. > \u201c\u6ca1\u9519 \u6211\u6700\u8fd1\u4e5f\u662f\u7a81\u7136\u5f00\u609f \u6211\u4e5f\u5728\u5b66\u526a\u8f91ai\u8fd9\u4e9b \u53d1\u73b0\u7b2c\u4e00\u6b65\u662f\u6700\u91cd\u8981\u7684\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u5c0a\u91cd\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c**\u5bb6\u5ead\u652f\u6301\u5ea6\u662f\u6700\u5927\u98ce\u9669\u53d8\u91cf**\u3002\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5728\u63d0\u4f9b\u786c\u6838\u6280\u80fd\u6307\u5bfc\u7684\u540c\u65f6\uff0c\u5de7\u5999\u63a2\u67e5\u5e76\u5de9\u56fa\u5176\u5bb6\u5ead\u652f\u6301\u9632\u7ebf\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"maslow_need\": \"\u5c0a\u91cd\u9700\u6c42\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5708\u5c42\u8ba4\u53ef\u8f85\u52a9\u5305\"}\n```";
