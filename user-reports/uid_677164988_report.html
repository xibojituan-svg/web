    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4f5c\u4e3a\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677164988 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6709\u58f0\u5c0f\u4ed81(\u4ed8\u5927\u96e8) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b (7380\u5143\u9ad8\u9636\u73ed) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u5206\u671f\u60c5\u51b5\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u6709\u201c\u5728\u5916\u9762\u201d\u7684\u8868\u8ff0\uff0c\u4f46\u672a\u660e\u786e\u804c\u4e1a\u3001\u4f5c\u606f\u3002\u53ef\u63a8\u65ad\u4e3a\u6709\u788e\u7247\u5316\u65f6\u95f4\uff0c\u80fd\u5b8c\u6210\u4f5c\u4e1a\u548c\u542c\u8bfe\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u4e92\u52a8\u79ef\u6781\uff0c\u4f46\u7f3a\u4e4f\u5173\u952e\u80cc\u666f\u4fe1\u606f\uff08\u652f\u4ed8\u3001\u5bb6\u5ead\u3001\u804c\u4e1a\uff09\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u5174\u8da3\u9a71\u52a8\u4e3a\u4e3b\uff0c\u517c\u6709\u517c\u804c\u53d8\u73b0\u671f\u5f85\u3002\u5bf9\u914d\u97f3\u884c\u4e1a\u6709\u57fa\u7840\u5174\u8da3\uff08\u542c\u5e7f\u64ad\u5267\uff09\uff0c\u5b66\u4e60\u6001\u5ea6\u8ba4\u771f\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u6781\u901f\u53d8\u73b0\u7684\u72c2\u70ed\u6216\u5bf9\u5e95\u5c42\u6280\u672f\u7684\u6df1\u5ea6\u94bb\u7814\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u76ee\u524d\u662f\u60f3\u5148\u4ece\u517c\u804c\u505a\u8d77\uff0c\u56e0\u4e3a\u6ca1\u6709\u7ecf\u9a8c\uff0c\u7136\u540e\u914d\u97f3\u5176\u5b9e\u4e5f\u7b97\u6211\u6bd4\u8f83\u611f\u5174\u8da3\u7684\u4e00\u884c\uff0c\u5f88\u4f69\u670d\u80fd\u7528\u4e0d\u540c\u60c5\u611f\u548c\u58f0\u7ebf\u6f14\u7ece\u89d2\u8272\u7684\u4eba\u201d\n  > \u201c\u90fd\u633a\u611f\u5174\u8da3\u7684\uff0c\u53ea\u662f\u50cf\u7edf\u7b79\u3001\u540e\u671f\u3001\u7f8e\u5de5\u7684\u8bdd\u53ef\u80fd\u6211\u73b0\u5728\u8fd8\u80fd\u529b\u4e0d\u591f\u9700\u8981\u518d\u5b66\u4e60\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u65e0\u6cd5\u5224\u65ad\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u89c2\u770b\u5f55\u64ad\u8bfe\u3001\u53c2\u52a0\u76f4\u64ad\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u5168\u5929\u5019\u81ea\u7531\u65f6\u95f4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u65e0\u6cd5\u5224\u65ad\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u80fd\u4e3b\u52a8\u66b4\u9732\u95ee\u9898\uff08\u7d27\u5f20\u3001\u6c14\u606f\u4e0d\u7a33\u3001\u53e3\u6c34\u97f3\uff09\uff0c\u5bfb\u6c42\u5177\u4f53\u89e3\u51b3\u65b9\u6848\uff0c\u800c\u975e\u60c5\u7eea\u5ba3\u6cc4\u3002\u5728\u5f97\u5230\u9f13\u52b1\u540e\u80fd\u79ef\u6781\u56de\u5e94\uff0c\u8868\u73b0\u51fa\u8f83\u597d\u7684\u81ea\u6211\u8c03\u8282\u80fd\u529b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u611f\u89c9\u5f55\u8fd8\u662f\u6bd4\u8f83\u5bb9\u6613\u7d27\u5f20\u6240\u4ee5\u6c14\u606f\u4e0d\u7a33\u5b9a\u4e5f\u4e0d\u5b9e\u201d\n  > \u201c\u8001\u5e08\uff0c\u60f3\u95ee\u4e0b\u6211\u5f55\u5236\u7684\u65c1\u767d\u58f0\u97f3\u5927\u5c0f\u548c\u4f4d\u7f6e\u5408\u9002\u5417\uff0c\u7136\u540e\u56e0\u4e3a\u662f\u665a\u4e0a\u5f55\u7684\uff0c\u4e0d\u77e5\u9053\u58f0\u97f3\u4f1a\u4e0d\u4f1a\u6709\u70b9\u54d1\uff0c\u6211\u6709\u70b9\u5206\u8fa8\u4e0d\u51fa\u6765\u201d\n  > \u201c\u8001\u5e08\uff0c\u60f3\u95ee\u4e00\u4e0b\u5f55\u97f3\u5f55\u4e45\u4e86\u5bb9\u6613\u6709\u53e3\u6c34\u7cca\u97f3\u4e86\u8981\u600e\u4e48\u8c03\u6574\u554a\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42 (\u5f52\u5c5e\u611f) \u4e0e \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 (\u88ab\u8ba4\u53ef)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u81ea\u8eab\u80fd\u529b\u7684\u4e0d\u786e\u5b9a\u611f\uff08\u201c\u6211\u5bf9\u81ea\u5df1\u662f\u5426\u9002\u5408\u5e72\u8fd9\u884c\u4e0d\u592a\u786e\u5b9a\u201d\uff09\uff0c\u6e34\u671b\u83b7\u5f97\u4e13\u4e1a\u6307\u5bfc\u548c\u5708\u5c42\u5f52\u5c5e\uff08\u201c\u73b0\u5728\u7ec8\u4e8e\u53ef\u4ee5\u6b63\u5f0f\u558a\u58f0\u5b66\u59d0\u597d\u4e86[\u6d41\u6cea]\u201d\uff09\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u5708\u5c42\u63a5\u7eb3\u611f**\u3002\u901a\u8fc7\u7ec6\u81f4\u7684\u70b9\u8bc4\u3001\u5177\u4f53\u7684\u5efa\u8bae\u548c\u201c\u5b66\u59d0\u201d\u7684\u8eab\u4efd\u8ba4\u540c\uff0c\u6ee1\u8db3\u5176\u88ab\u4e13\u4e1a\u793e\u7fa4\u63a5\u7eb3\u548c\u5c0a\u91cd\u7684\u9700\u6c42\uff0c\u4ece\u800c\u5efa\u7acb\u4fe1\u4efb\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u6709\u5411\u6df7\u5408\u4f533\u53f7\u3010\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b\u3011\u8fdb\u5316\u7684\u6f5c\u529b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n**\u3010\u5224\u5b9a\u6811\u63a8\u6f14\u3011**\uff1a\n1.  **\u652f\u4ed8\u6838\u67e5**\uff1a\u65e0\u6570\u636e\uff0c\u8df3\u8fc7\u3002\n2.  **\u4e09\u8f74\u8bc4\u5206**\uff1a\u52a8\u673a\u7eaf\u5ea6(5-6\u5206)\uff0c\u8d44\u6e90\u5e95\u5ea7(5-6\u5206)\uff0c\u5fc3\u7406\u5f39\u6027(5-6\u5206)\u3002\n3.  **\u5224\u5b9a\u6811\u5339\u914d**\uff1a\u8fdb\u5165**\u7b2c\u4e09\u5c42-\u5206\u652fC\uff1a\u4e2d\u7b49\u5f39\u6027\u901a\u9053**\u3002\u52a8\u673a\u7eaf\u5ea6\u22655\uff0c\u4f5c\u4e1a\u63d0\u4ea4\u7387\u9ad8\uff0c\u65e0\u9ad8\u9891\u793e\u4ea4\u53d1\u8a00\uff0c\u65e0\u660e\u786e\u53d8\u73b0\u8ffd\u95ee\uff0c\u53d1\u8a00\u5185\u5bb9\u805a\u7126\u4e8e\u6280\u672f\u7ec6\u8282\uff08\u6c14\u606f\u3001\u53e3\u6c34\u97f3\u3001\u58f0\u97f3\u72b6\u6001\uff09\u3002\u7b26\u5408 **\u201c\u6c89\u9ed8\u9ad8\u8d44\u6e90\u89c2\u671b\u578b\u201d** \u573a\u666f\uff0c\u4f46\u8d44\u6e90\u5e95\u5ea7\u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u4e0d\u5f52\u5165A\u7c7b\u3002\u7b26\u5408 **\u201c\u52a8\u673a\u7eaf\u5ea6\u22657 AND \u4f5c\u4e1a\u63d0\u4ea4\u7387\u226580%\u201d** \u573a\u666f\uff0c\u5224\u5b9a\u4e3a **T2 \u4f4e\u8c03\u8001\u9ec4\u725b**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u8868\u73b0\u72ec\u7acb\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4e2d | \u5982\u679c\u540e\u7eed\u8bfe\u7a0b\u96be\u5ea6\u9661\u589e\uff0c\u6216\u517c\u804c\u65f6\u95f4\u88ab\u6324\u538b\uff0c\u53ef\u80fd\u56e0\u65e0\u6cd5\u8ddf\u4e0a\u8fdb\u5ea6\u800c\u4ea7\u751f\u632b\u8d25\u611f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u4e2d\u7b49\uff0c\u80fd\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u975e\u60c5\u7eea\u5316\u4f9d\u8d56\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | **\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u5982\u679c\u5b66\u4e60\u4e00\u6bb5\u65f6\u95f4\u540e\uff08\u59821-2\u4e2a\u6708\uff09\u4ecd\u672a\u83b7\u5f97\u4efb\u4f55\u6b63\u5411\u53cd\u9988\uff08\u5982\u8bd5\u97f3\u901a\u8fc7\u3001\u5c0f\u989d\u6536\u5165\uff09\uff0c\u5174\u8da3\u9a71\u52a8\u7684\u70ed\u60c5\u53ef\u80fd\u6d88\u9000\uff0c\u4ea7\u751f\u201c\u5b66\u800c\u65e0\u7528\u201d\u7684\u9000\u8d39\u5ff5\u5934\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c4-8\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u82e5\u6280\u80fd\u63d0\u5347\u7f13\u6162\u4e14\u65e0\u53d8\u73b0\u8ff9\u8c61\uff0c\u5bb9\u6613\u4ea7\u751f\u653e\u5f03\u60f3\u6cd5\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5a1f\u5a1c\uff0c\u6211\u770b\u4f60\u5b66\u4e60\u7279\u522b\u8ba4\u771f\uff0c\u4ea4\u4f5c\u4e1a\u4e5f\u51c6\u65f6\uff0c\u95ee\u7684\u95ee\u9898\u90fd\u5f88\u5728\u70b9\u5b50\u4e0a\u3002\u54b1\u4eec\u8fd9\u4e2a\u73ed\u5c31\u9700\u8981\u4f60\u8fd9\u6837\u8e0f\u5b9e\u80af\u5b66\u7684\u540c\u5b66\u3002\u522b\u62c5\u5fc3\u9002\u4e0d\u9002\u5408\uff0c\u4f60\u7684\u58f0\u97f3\u6761\u4ef6\u548c\u5b66\u4e60\u6001\u5ea6\u5df2\u7ecf\u8d85\u8fc7\u5f88\u591a\u65b0\u4eba\u4e86\u3002\u63a5\u4e0b\u6765\u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u6211\u4f1a\u76ef\u7740\u4f60\u7684\u8fdb\u5ea6\uff0c\u6709\u4efb\u4f55\u5361\u70b9\u968f\u65f6\u627e\u6211\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176\u8ba4\u771f\u3001\u6c42\u7a33\u3001\u5173\u6ce8\u6280\u672f\u7ec6\u8282\u7684\u7279\u8d28\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T2\u7279\u8d28\uff0c\u8865\u5145 **\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011**\uff08B\u6a21\u5757\uff09\uff0c\u53ca\u65f6\u89e3\u7b54\u5176\u5173\u4e8e\u6c14\u606f\u3001\u53e3\u6c34\u97f3\u7b49\u5177\u4f53\u6280\u672f\u95ee\u9898\u3002\u5f53\u5176\u8868\u73b0\u51fa\u5e2e\u52a9\u4ed6\u4eba\u6216\u7ec4\u7ec7\u6d3b\u52a8\u7684\u82d7\u5934\u65f6\uff0c\u7acb\u5373\u542f\u52a8 **\u3010\u9ec4\u888d\u52a0\u8eab\u63d0\u5e72\u6cd5\u3011**\uff08D\u6a21\u5757\uff09\uff0c\u8d4b\u4e88\u5176\u5c0f\u7ec4\u957f\u7b49\u89d2\u8272\uff0c\u6fc0\u53d1\u5176\u8d23\u4efb\u611f\u548c\u5f52\u5c5e\u611f\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u51e0\u5929\u5c31\u80fd\u8d5a\u94b1\u201d\u7684\u8bdd\u672f\u8fc7\u5ea6\u523a\u6fc0\u5176\u53d8\u73b0\u9884\u671f\uff1b\u5728\u5176\u672a\u4e3b\u52a8\u6c42\u52a9\u65f6\uff0c\u8fdb\u884c\u8fc7\u5ea6\u5bc6\u96c6\u7684\u60c5\u611f\u8f70\u70b8\uff08C\u6a21\u5757\u6ee1\u914d\uff09\uff0c\u8fd9\u4f1a\u8ba9\u52a1\u5b9e\u7684T2\u611f\u5230\u4e0d\u9002\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u8fdb\u884c\u5927\u989d\u8bfe\u7a0b\u63a8\u4ecb\uff0c\u4f46\u5fc5\u987b\u5efa\u7acb\u5728**\u5176\u6280\u80fd\u6709\u660e\u663e\u63d0\u5347\u5e76\u83b7\u5f97\u6b63\u5411\u53cd\u9988\uff08\u5982\u8bd5\u97f3\u901a\u8fc7\uff09\u4e4b\u540e**\u3002\u5207\u5fcc\u5728\u57fa\u7840\u4e0d\u7262\u65f6\u4ea4\u53c9\u63a8\u9500\u9ad8\u9636\u8bfe\uff0c\u907f\u514d\u89e6\u53d1\u201c\u77e5\u8bc6\u8fc7\u8f7d\u6050\u614c\u201d\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u76ee\u524d\u662f\u60f3\u5148\u4ece\u517c\u804c\u505a\u8d77\uff0c\u56e0\u4e3a\u6ca1\u6709\u7ecf\u9a8c\uff0c\u7136\u540e\u914d\u97f3\u5176\u5b9e\u4e5f\u7b97\u6211\u6bd4\u8f83\u611f\u5174\u8da3\u7684\u4e00\u884c\uff0c\u5f88\u4f69\u670d\u80fd\u7528\u4e0d\u540c\u60c5\u611f\u548c\u58f0\u7ebf\u6f14\u7ece\u89d2\u8272\u7684\u4eba\u201d\n2. > \u201c\u611f\u89c9\u5f55\u8fd8\u662f\u6bd4\u8f83\u5bb9\u6613\u7d27\u5f20\u6240\u4ee5\u6c14\u606f\u4e0d\u7a33\u5b9a\u4e5f\u4e0d\u5b9e\u201d\n3. > \u201c\u8001\u5e08\uff0c\u60f3\u95ee\u4e00\u4e0b\u5f55\u97f3\u5f55\u4e45\u4e86\u5bb9\u6613\u6709\u53e3\u6c34\u7cca\u97f3\u4e86\u8981\u600e\u4e48\u8c03\u6574\u554a\u201d\n4. > \u201c\u54c7\uff0c\u8c22\u8c22\u5b66\u59d0\uff0c\u73b0\u5728\u7ec8\u4e8e\u53ef\u4ee5\u6b63\u5f0f\u558a\u58f0\u5b66\u59d0\u597d\u4e86[\u6d41\u6cea]\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u5708\u5c42\u5f52\u5c5e\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u7a33\u5b9a\u3001\u5177\u4f53\u7684\u6280\u672f\u53cd\u9988\uff0c\u5e76\u5728\u5176\u6280\u80fd\u8fbe\u6807\u540e\u53ca\u65f6\u8d4b\u4e88\u201c\u5b66\u59d0/\u7ec4\u957f\u201d\u7b49\u8eab\u4efd\u8ba4\u540c\uff0c\u5f15\u5bfc\u5176\u5411\u6df7\u5408\u4f533\u53f7\uff08\u6743\u9650\u89c9\u9192\uff09\u8fdb\u5316\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u5f52\u5c5e\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\"}\n```";
