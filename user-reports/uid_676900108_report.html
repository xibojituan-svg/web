    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u7f3a\u4e4f\u652f\u4ed8\u8bb0\u5f55\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u3001\u6df1\u5c42\u5b66\u4e60\u52a8\u673a\u3001\u5177\u4f53\u8d44\u6e90\u72b6\u51b5\uff08\u65f6\u95f4/\u7ecf\u6d4e\uff09\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u3001\u5bf9\u53d8\u73b0\u7684\u660e\u786e\u671f\u671b\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a\u4e2d\u7b49\u3002\u8868\u73b0\u51fa\u5bf9\u8bfe\u7a0b\u5185\u5bb9\uff08AI\u5de5\u5177\u3001\u6545\u4e8b\u62c6\u89e3\u3001\u4f5c\u4e1a\u8981\u6c42\uff09\u7684**\u6280\u672f\u6027\u5173\u6ce8**\u548c**\u6d41\u7a0b\u786e\u8ba4**\uff0c\u6709\u5b8c\u6210\u4efb\u52a1\u3001\u8ddf\u4e0a\u8fdb\u5ea6\u7684\u610f\u613f\uff08\u201c\u65e9\u70b9\u5427\uff0c\u7701\u7684\u5fd8\u4e86\u201d\uff09\u3002\u4f46\u672a\u89c1\u5f3a\u70c8\u7684\u5185\u5728\u521b\u4f5c\u70ed\u60c5\u3001\u804c\u4e1a\u8f6c\u578b\u7126\u8651\u6216\u660e\u786e\u7684\u53d8\u73b0\u76ee\u6807\u3002\u52a8\u673a\u504f\u5411**\u4efb\u52a1\u5b8c\u6210\u578b**\u548c**\u5de5\u5177\u638c\u63e1\u578b**\uff0c\u800c\u975e\u5f3a\u70c8\u7684\u6210\u5c31\u9a71\u52a8\u6216\u7126\u8651\u9a71\u52a8\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a\u4fe1\u606f\u4e0d\u8db3\u3002**\u65f6\u95f4\u8d44\u6e90**\uff1a\u53ef\u8c03\u914d\u65f6\u95f4\u4e2d\u7b49\uff0c\u80fd\u53c2\u4e0e\u76f4\u64ad\u548c\u5b8c\u6210\u4f5c\u4e1a\uff0c\u4f46\u9700\u63d0\u524d\u534f\u8c03\uff08\u201c\u6211\u6709\u4e9b\u4e8b\u60c5\u8981\u6839\u636e\u8fd9\u4e2a\u8bfe\u8868\u63d0\u524d\u5b89\u6392\u4e0b\u201d\uff09\u3002**\u7ecf\u6d4e\u8d44\u6e90**\uff1a\u672a\u77e5\u3002**\u8ba4\u77e5\u8d44\u6e90**\uff1a\u5177\u5907\u57fa\u7840\u5b66\u4e60\u80fd\u529b\uff0c\u80fd\u7406\u89e3\u64cd\u4f5c\u6307\u4ee4\uff0c\u4f46\u5bf9\u62bd\u8c61\u6982\u5ff5\uff08\u5982\u7d20\u6750\u5e93\u672c\u8d28\uff09\u9700\u8981\u8fdb\u4e00\u6b65\u89e3\u91ca\u3002**\u6280\u672f\u8d44\u6e90**\uff1a\u719f\u6089AI\u5de5\u5177\uff08\u8c46\u5305\u3001Kimi\uff09\uff0c\u5177\u5907\u57fa\u7840\u64cd\u4f5c\u80fd\u529b\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a\u4e2d\u7b49\u504f\u9ad8\u3002**\u89c4\u5219\u9075\u5faa\u8005**\uff0c\u9891\u7e41\u786e\u8ba4\u6d41\u7a0b\u7ec6\u8282\uff08\u4e0a\u8bfe\u65f6\u95f4\u3001\u4f5c\u4e1a\u683c\u5f0f\u3001\u622a\u6b62\u65e5\u671f\u3001\u4efb\u52a1\u6e05\u5355\uff09\u3002\u9047\u5230\u56f0\u60d1\uff08\u5982\u4f5c\u4e1a\u8981\u6c42\u4e0d\u660e\u786e\uff09\u4f1a\u4e3b\u52a8\u63d0\u95ee\u3002\u5bf9AI\u8f85\u52a9\u7684\u4f9d\u8d56\u4e0e\u81ea\u6211\u80fd\u529b\u6709\u8ba4\u77e5\uff08\u201c\u4ed6\u603b\u7ed3\u7684\u6bd4\u6211\u597d\uff0c\u6211\u53ea\u80fd\u8bfb\u51fa\u4e00\u534a\u201d\uff09\uff0c\u5e76\u5bfb\u6c42\u5e73\u8861\u65b9\u6cd5\u3002**\u60c5\u7eea\u7a33\u5b9a**\uff0c\u6c9f\u901a\u8bed\u6c14\u5e73\u548c\u3001\u914d\u5408\u3002**\u98ce\u9669\u70b9**\uff1a\u5bf9\u4e0d\u786e\u5b9a\u6027\u548c\u6a21\u7cca\u6307\u4ee4\u5bb9\u5fcd\u5ea6\u8f83\u4f4e\uff0c\u9700\u8981\u6e05\u6670\u7684\u7ed3\u6784\u548c\u9884\u671f\u7ba1\u7406\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 \u652f\u4ed8\u6838\u67e5**\uff1a**\u65e0\u6cd5\u5224\u65ad**\u3002\u8bb0\u5f55\u4e2d\u65e0\u652f\u4ed8\u884c\u4e3a\u3001\u4ef7\u683c\u8ba8\u8bba\u6216\u4f18\u60e0\u8be2\u95ee\u3002\n*   **\u6b65\u9aa41.5 \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u65e0\u6cd5\u5224\u65ad**\u3002\u8bb0\u5f55\u4e2d\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u6210\u5458\u6216\u51b3\u7b56\u8fc7\u7a0b\u3002\n*   **\u6b65\u9aa41 \u52a8\u673a\u7eaf\u5ea6**\uff1aB\u7c7b\uff08\u4e2d\u7b49\u52a8\u673a\uff09\u3002\u6709\u5b66\u4e60\u884c\u4e3a\uff0c\u4f46\u76ee\u6807\u611f\u4e0d\u5f3a\u70c8\uff0c\u504f\u5411\u4e8e\u201c\u5b8c\u6210\u4efb\u52a1\u201d\u548c\u201c\u638c\u63e1\u8bfe\u7a0b\u89c4\u5b9a\u5185\u5bb9\u201d\u3002\n*   **\u6b65\u9aa42 \u8d44\u6e90\u5e95\u5ea7**\uff1aC\u7c7b\uff08\u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u5f52\u4e3a\u4e2d\u7b49\uff09\u3002\u65f6\u95f4\u53ef\u8c03\u914d\uff0c\u6280\u672f\u57fa\u7840\u5c1a\u53ef\uff0c\u4f46\u5173\u952e\u7ecf\u6d4e\u4fe1\u606f\u7f3a\u5931\u3002\n*   **\u6b65\u9aa43 \u5fc3\u7406\u5f39\u6027**\uff1aB\u7c7b\uff08\u4e2d\u7b49\u504f\u4e0a\uff09\u3002\u9002\u5e94\u6027\u826f\u597d\uff0c\u9075\u5b88\u89c4\u5219\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u4f46\u4f9d\u8d56\u660e\u786e\u6307\u5f15\u3002\n*   **\u7efc\u5408\u5224\u5b9a**\uff1a**B2C\u578b\uff08\u4e2d\u7b49\u52a8\u673a-\u8d44\u6e90\u5f85\u5b9a-\u89c4\u5219\u9002\u5e94\u8005\uff09**\u3002\u7528\u6237\u5904\u4e8e\u201c\u8ddf\u968f\u8005\u201d\u72b6\u6001\uff0c\u80fd\u5b8c\u6210\u8bfe\u7a0b\u52a8\u4f5c\uff0c\u4f46\u7f3a\u4e4f\u81ea\u9a71\u7684\u6df1\u5ea6\u63a2\u7d22\u548c\u660e\u786e\u7684\u7ed3\u679c\u9884\u671f\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**\uff1a**T4 \u8c28\u614e\u8ddf\u968f\u8005**\u3002\n    *   **\u7279\u5f81\u543b\u5408**\uff1a\u9ad8\u5ea6\u5173\u6ce8\u6d41\u7a0b\u6b63\u786e\u6027\uff08\u4f5c\u4e1a\u683c\u5f0f\u3001\u4e0a\u8bfe\u65f6\u95f4\u3001\u4efb\u52a1\u6e05\u5355\uff09\uff1b\u5bf9\u6a21\u7cca\u6307\u4ee4\u611f\u5230\u4e0d\u5b89\u5e76\u4e3b\u52a8\u6f84\u6e05\uff1b\u4f9d\u8d56\u5916\u90e8\u7ed3\u6784\uff08\u8bfe\u7a0b\u5b89\u6392\u3001\u6a21\u677f\uff09\uff1b\u5b66\u4e60\u884c\u4e3a\u4ee5\u201c\u5b8c\u6210\u4efb\u52a1\u201d\u548c\u201c\u7b26\u5408\u8981\u6c42\u201d\u4e3a\u5bfc\u5411\uff1b\u5bf9AI\u5de5\u5177\u6301\u5b9e\u7528\u6001\u5ea6\uff0c\u4f46\u5173\u6ce8\u81ea\u8eab\u4e0eAI\u7684\u5dee\u8ddd\u3002\n    *   **\u504f\u5dee\u8bf4\u660e**\uff1a\u672a\u8868\u73b0\u51faT4\u53ef\u80fd\u4f34\u968f\u7684\u660e\u663e\u7126\u8651\u6216\u4fe1\u5fc3\u4e0d\u8db3\uff0c\u66f4\u591a\u662f\u51fa\u4e8e\u5bf9\u89c4\u5219\u548c\u6548\u7387\u7684\u8ffd\u6c42\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669**\uff1a**\u4f4e**\u3002\n*   **\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a\u4e2d\u4f4e\u98ce\u9669\u3002\u7528\u6237\u5bf9AI\u8f85\u52a9\u5199\u4f5c\u6709\u521d\u6b65\u8ba4\u77e5\uff08\u201c\u53ea\u80fd\u8bfb\u51fa\u4e00\u534a\u201d\uff09\uff0c\u82e5\u540e\u671f\u5bf9\u201c\u81ea\u6211\u63d0\u5347\u201d\u6548\u679c\u611f\u77e5\u5f31\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u3002**\u9700\u5173\u6ce8\u5176\u4ece\u201c\u5de5\u5177\u4f7f\u7528\u201d\u5230\u201c\u80fd\u529b\u5185\u5316\u201d\u7684\u5f15\u5bfc**\u3002\n    2.  **\u670d\u52a1\u4e0e\u627f\u8bfa\u4e0d\u7b26**\uff1a\u4f4e\u98ce\u9669\u3002\u7528\u6237\u9891\u7e41\u786e\u8ba4\u670d\u52a1\u7ec6\u8282\uff08\u8bfe\u8868\u3001\u4f5c\u4e1a\u91cf\uff09\uff0c\u9500\u552e\u56de\u5e94\u53ca\u65f6\u51c6\u786e\uff0c\u672a\u53d1\u73b0\u627f\u8bfa\u5938\u5927\u3002\n    3.  **\u65f6\u95f4\u7cbe\u529b\u51b2\u7a81**\uff1a\u4f4e\u98ce\u9669\u3002\u7528\u6237\u4f1a\u63d0\u524d\u534f\u8c03\u65f6\u95f4\uff0c\u5e76\u4e3b\u52a8\u8bf7\u5047\uff0c\u663e\u793a\u5176\u6709\u89c4\u5212\u80fd\u529b\u3002\n    4.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u65e0\u6cd5\u8bc4\u4f30**\u3002\u5173\u952e\u7f3a\u5931\u4fe1\u606f\u3002\n    5.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u65e0\u6cd5\u8bc4\u4f30**\u3002\u5173\u952e\u7f3a\u5931\u4fe1\u606f\u3002\n    6.  **\u8bfe\u7a0b\u5185\u5bb9\u4e0d\u9002**\uff1a\u4f4e\u98ce\u9669\u3002\u7528\u6237\u5bf9\u8bfe\u7a0b\u5185\u5bb9\uff08\u5982\u60ac\u7591\u9898\u6750\uff09\u6709\u5c1d\u8bd5\u610f\u613f\uff0c\u5e76\u786e\u8ba4\u662f\u5426\u5f71\u54cd\u540e\u7eed\uff0c\u8868\u73b0\u51fa\u9002\u5e94\u6027\u3002\n    7.  **\u5e73\u53f0/\u4f53\u9a8c\u95ee\u9898**\uff1a\u4f4e\u98ce\u9669\u3002\u7528\u6237\u5c31\u64cd\u4f5c\u95ee\u9898\uff08UID\u586b\u5199\u3001\u94fe\u63a5\u5206\u4eab\uff09\u8fdb\u884c\u8fc7\u8be2\u95ee\uff0c\u95ee\u9898\u5df2\u89e3\u51b3\uff0c\u672a\u5347\u7ea7\u4e3a\u6295\u8bc9\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u9500\u552e\u884c\u4e3a**\uff1a\u57fa\u672c\u5408\u89c4\u3002\u9500\u552e\uff08\u8584\u8377\uff09\u56de\u5e94\u53ca\u65f6\u3001\u51c6\u786e\uff0c\u4ee5\u89e3\u7b54\u64cd\u4f5c\u548c\u8bfe\u7a0b\u5b89\u6392\u95ee\u9898\u4e3a\u4e3b\uff0c\u672a\u53d1\u73b0\u8fc7\u5ea6\u627f\u8bfa\u3001\u5236\u9020\u7126\u8651\u6216\u8bf1\u5bfc\u6d88\u8d39\u7684\u8a00\u8bba\u3002\n*   **\u4e3b\u8981\u98ce\u9669**\uff1a**\u4fe1\u606f\u7f3a\u5931**\u3002\u65e0\u6cd5\u5224\u65ad\u9500\u552e\u524d\u7aef\u662f\u5426\u5b58\u5728\u5938\u5927\u5ba3\u4f20\u6216\u672a\u5145\u5206\u544a\u77e5\u8bfe\u7a0b\u5f3a\u5ea6\uff0c\u5bfc\u81f4\u7528\u6237\u5f53\u524d\u52a8\u673a\u7eaf\u5ea6\u4e0d\u9ad8\u3002**\u9700\u7531\u73ed\u4e3b\u4efb\u5728\u670d\u52a1\u671f\u521d\u8fdb\u884c\u52a8\u673a\u6821\u51c6\u548c\u9884\u671f\u7ba1\u7406**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**\uff1a**\u5339\u914d**\u3002\u7528\u6237\u9700\u8981\u7ed3\u6784\u6e05\u6670\u3001\u6709\u6a21\u677f\u3001\u6709\u660e\u786e\u89c4\u5219\u7684\u8bfe\u7a0b\u4ea7\u54c1\uff0c\u5f53\u524d\u8bfe\u7a0b\u6a21\u5f0f\uff08\u6a21\u677f\u5316\u4f5c\u4e1a\u3001\u56fa\u5b9a\u8bfe\u8868\uff09\u4e0e\u5176\u9700\u6c42\u5339\u914d\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**\u9996\u5468\u8fdb\u884c\u4e00\u5bf9\u4e00\u5b66\u4e60\u89c4\u5212\u4e0e\u9884\u671f\u5bf9\u9f50**\u3002\n*   **\u5177\u4f53\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9884\u671f\u7ba1\u7406**\uff1a\u5728\u5f00\u8425\u6216\u9996\u6b21\u6df1\u5ea6\u6c9f\u901a\u4e2d\uff0c\u660e\u786e\u544a\u77e5\u8bfe\u7a0b\u6838\u5fc3\u662f\u201c**\u65b9\u6cd5\u8bba+\u5de5\u5177**\u201d\u7684\u7ed3\u5408\uff0c\u5f3a\u8c03\u201c**\u523b\u610f\u7ec3\u4e60**\u201d\u548c\u201c**\u4ece\u6a21\u4eff\u5230\u5185\u5316**\u201d\u7684\u8fc7\u7a0b\uff0c\u964d\u4f4e\u5176\u5bf9\u201c\u901f\u6210\u201d\u6216\u201c\u7eafAI\u4ee3\u52b3\u201d\u7684\u4e0d\u5207\u5b9e\u9645\u671f\u671b\u3002\n    2.  **\u7ed3\u6784\u5316\u652f\u6301**\uff1a\u4e3a\u5176\u63d0\u4f9b\u66f4\u6e05\u6670\u7684**\u6bcf\u5468\u5b66\u4e60\u6d41\u7a0b\u56fe**\u6216**\u6e05\u5355**\uff0c\u660e\u786e\u6bcf\u4e2a\u73af\u8282\u7684\u76ee\u6807\u548c\u4ea7\u51fa\u3002\u5bf9\u5176\u5173\u4e8e\u4f5c\u4e1a\u3001\u8bfe\u8868\u7684\u7591\u95ee\u7ed9\u4e88**\u524d\u7f6e\u6027\u3001\u4e66\u9762\u5316**\u7684\u8bf4\u660e\u3002\n    3.  **\u80fd\u529b\u5efa\u8bbe**\uff1a\u5728\u70b9\u8bc4\u6216\u6c9f\u901a\u4e2d\uff0c**\u91cd\u70b9\u8868\u626c\u5176\u4e3b\u52a8\u63d0\u95ee\u3001\u63d0\u524d\u89c4\u5212\u3001\u9075\u5b88\u89c4\u5219**\u7684\u884c\u4e3a\u3002\u5f15\u5bfc\u5176\u5173\u6ce8\u201cAI\u62c6\u89e3\u540e\uff0c\u6211\u81ea\u5df1\u5b66\u5230\u4e86\u4ec0\u4e48\u65b0\u89d2\u5ea6\u201d\uff0c\u800c\u4e0d\u4ec5\u4ec5\u662f\u201c\u6211\u662f\u5426\u5b8c\u6210\u4e86\u4f5c\u4e1a\u201d\u3002\n    4.  **\u98ce\u9669\u76d1\u63a7**\uff1a\u5728\u540e\u7eed\u6c9f\u901a\u4e2d\uff0c**\u6e29\u548c\u63a2\u8be2\u5176\u5b66\u4e60\u521d\u8877\u548c\u5bf9\u8bfe\u7a0b\u7684\u671f\u671b**\uff0c\u8865\u5145\u52a8\u673a\u4fe1\u606f\u3002\u89c2\u5bdf\u5176\u5b8c\u6210\u4f5c\u4e1a\u662f\u51fa\u4e8e\u201c\u5174\u8da3\u63a2\u7d22\u201d\u8fd8\u662f\u201c\u4efb\u52a1\u538b\u529b\u201d\u3002\n\n{\"core_type\": \"T4 \u8c28\u614e\u8ddf\u968f\u8005\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u9996\u5468\u8fdb\u884c\u4e00\u5bf9\u4e00\u5b66\u4e60\u89c4\u5212\u4e0e\u9884\u671f\u5bf9\u9f50\"}";
