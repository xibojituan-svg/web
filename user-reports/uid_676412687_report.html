    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u58a8\u67d3\u58f0\u7ebf (UID: 676412687) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-29 \u81f3 2026-03-16 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | ava\u738b\u4e00\u60c5(\u738b\u971e)\u3001\u9759\u8bed\u6263\u5fc3\u5f26(\u5f20\u9759)\u3001\u8336\u5c71(\u7530\u59dd)\u3001\u8fdc\u5c71\u5ff5(\u674e\u658c) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8fdb\u9636\u73ed\u3001\u540e\u671f\u73ed\u3001\u526a\u8f91\u5e08\u8bc1 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u63a8\u6d4b\u4e3a\u5168\u6b3e\u5145\u88d5\uff08\u5df2\u8d2d\u591a\u95e8\u8bfe\u7a0b\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1\uff08\u9700\u5e26\u5a03\uff0c\u591a\u95e8\u8bfe\u7a0b\u51b2\u7a81\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u672a\u63d0\u53ca\u5bb6\u5ead\u6001\u5ea6 |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e2d\u7b49\uff08\u5b66\u4e60\u8fc7\u7a0b\u8bb0\u5f55\u591a\uff0c\u4f46\u5bb6\u5ead\u3001\u8d22\u52a1\u3001\u6df1\u5c42\u52a8\u673a\u4fe1\u606f\u7f3a\u5931\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u5173\u6ce8\u6280\u80fd\u638c\u63e1\u4e0e\u793e\u7fa4\u4e92\u52a8\uff0c\u65e0\u77ed\u671f\u53d8\u73b0\u538b\u529b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u666e\u901a\u8bdd\u4e0d\u6807\u51c6\u54e6\uff0c\u9700\u8981\u591a\u7ec3\uff0c\u5e0c\u671b\u6709\u4eba\u76d1\u7763[\u5077\u7b11]\u201d > \u201c\u73ed\u73ed\uff0c\u5c0f\u52a9\u624b\u9700\u8981\u505a\u4ec0\u4e48\u5440\uff1f\u60a8\u770b\u6211\u53ef\u4ee5\u5417\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a\u4e2d \u2014 \u5df2\u8d2d\u4e70\u6709\u58f0\u8fdb\u9636\u3001\u540e\u671f\u3001\u526a\u8f91\u5e08\u8bc1\u7b49\u591a\u95e8\u8bfe\u7a0b\uff0c\u6d88\u8d39\u610f\u613f\u5f3a\uff0c\u4f46\u672a\u63d0\u53ca\u5177\u4f53\u8d22\u52a1\u72b6\u51b5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a\u4f4e \u2014 **\u6838\u5fc3\u77ed\u677f**\u3002\u9700\u5e26\u5a03\uff0c\u540c\u65f6\u4e0a\u4e24\u95e8\u8bfe\uff08\u8fdb\u9636\u4e0e\u540e\u671f\uff09\u5373\u611f\u201c\u987e\u4e0d\u8fc7\u6765\u201d\u3001\u201c\u5b66\u7684\u90fd\u4e0d\u8e0f\u5b9e\u201d\uff0c\u4e3b\u52a8\u7533\u8bf7\u5ef6\u671f\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a\u4e2d \u2014 \u4fe1\u606f\u4e0d\u8db3\uff0c\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\uff0c\u4f46\u5e26\u5a03\u8d23\u4efb\u8868\u660e\u5bb6\u5ead\u89d2\u8272\u5360\u7528\u5927\u91cf\u7cbe\u529b\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u5f55\u97f3\u97f3\u91cf\u3001\u8f6f\u4ef6\u64cd\u4f5c\uff09\u4f1a\u4e3b\u52a8\u3001\u53cd\u590d\u8be2\u95ee\u89e3\u51b3\u65b9\u6cd5\uff0c\u4e0d\u62b1\u6028\u3002\u5b66\u4e60\u538b\u529b\u5927\u65f6\uff0c\u9009\u62e9\u4e3b\u52a8\u6c9f\u901a\u3001\u8c03\u6574\u8ba1\u5212\uff08\u5ef6\u671f\uff09\uff0c\u800c\u975e\u653e\u5f03\u6216\u60c5\u7eea\u5d29\u6e83\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u611f\u89c9\u6211\u8ddf\u4e0d\u4e0a\u4e86\uff0c\u6211\u60f3\u5148\u4e0a\u5b8c\u540e\u671f\u518d\u4e0a\u8fdb\u9636\uff0c\u4ee5\u540e\u8fd8\u53ef\u4ee5\u5b89\u6392\u5230\u60a8\u7684\u73ed\u5417\u201d > \u201c\u6211\u666e\u901a\u8bdd\u4e0d\u6807\u51c6\u54e6\uff0c\u9700\u8981\u591a\u7ec3\uff0c\u5e0c\u671b\u6709\u4eba\u76d1\u7763[\u5077\u7b11]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u5f52\u5c5e / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u8ba4\u53ef ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u666e\u901a\u8bdd\u4e0d\u6807\u51c6\u5e26\u6765\u7684\u4e0d\u81ea\u4fe1\uff0c\u4ee5\u53ca\u56e0\u5bb6\u5ead\u8d23\u4efb\uff08\u5e26\u5a03\uff09\u5bfc\u81f4\u65f6\u95f4\u7cbe\u529b\u788e\u7247\u5316\uff0c\u96be\u4ee5\u8ddf\u4e0a\u9ad8\u5f3a\u5ea6\u5b66\u4e60\u8282\u594f\u7684\u7126\u8651\u3002\u5979\u6e34\u671b\u5728\u793e\u7fa4\u4e2d\u627e\u5230\u5f52\u5c5e\u611f\u548c\u4ef7\u503c\u8ba4\u540c\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5728\u793e\u7fa4\u4e2d\u7684\u89d2\u8272\u8d4b\u4e88\u4e0e\u4ef7\u503c\u80af\u5b9a**\u3002\u8ba9\u5979\u5728\u201c\u88ab\u9700\u8981\u201d\uff08\u5982\u62c5\u4efb\u5c0f\u52a9\u624b\uff09\u548c\u201c\u88ab\u770b\u89c1\u201d\uff08\u4f5c\u4e1a\u88ab\u70b9\u8bc4\u3001\u8003\u8bd5\u901a\u8fc7\u88ab\u795d\u8d3a\uff09\u4e2d\u83b7\u5f97\u5c0a\u91cd\u4e0e\u5f52\u5c5e\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 B \u7c7b |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T5 \u597d\u73a9\u5c1d\u9c9c\u578b** (\u517c\u5177\u90e8\u5206T2\u5b9e\u5e72\u7279\u8d28) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5c5e\u5927\u5435\u7b49\u8ff9\u8c61\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u5e26\u5a03\u8d23\u4efb\u53ef\u80fd\u56e0\u7a81\u53d1\u60c5\u51b5\u6324\u538b\u5b66\u4e60\u65f6\u95f4\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u591a\u7ebf\u7a0b\u5b66\u4e60\uff08\u5e26\u5a03+\u591a\u95e8\u8bfe\u7a0b\uff09\u5bfc\u81f4\u7cbe\u529b\u5206\u6563\u3001\u8bfe\u7a0b\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u632b\u8d25\u611f\u548c\u7126\u8651\uff0c\u8fdb\u800c\u840c\u751f\u9000\u610f\u6216\u8981\u6c42\u5ef6\u671f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u5230\u95ee\u9898\u4e3b\u52a8\u6c42\u89e3\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u56f0\u96be\u7834\u9632\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u52a8\u673a\u4e3a\u5b66\u4e60\u548c\u5174\u8da3\uff0c\u975e\u77ed\u671f\u53d8\u73b0\uff0c\u5bf9\u6536\u76ca\u843d\u5dee\u4e0d\u654f\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c3-4\u5468**\u3002\u6b64\u65f6\u8bfe\u7a0b\u96be\u5ea6\u548c\u4f5c\u4e1a\u91cf\u589e\u52a0\uff0c\u591a\u95e8\u8bfe\u7a0b\u65f6\u95f4\u51b2\u7a81\u95ee\u9898\u51f8\u663e\uff0c\u6613\u4ea7\u751f\u201c\u987e\u4e0d\u8fc7\u6765\u201d\u7684\u5d29\u6e83\u611f\uff0c\u5982\u672c\u6b21\u8bb0\u5f55\u4e2d\u7533\u8bf7\u5ef6\u671f\u7684\u8282\u70b9\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u58a8\u67d3\uff0c\u770b\u5230\u4f60\u4e3b\u52a8\u7533\u8bf7\u505a\u5c0f\u52a9\u624b\uff0c\u771f\u7684\u592a\u68d2\u4e86\uff01\u54b1\u4eec\u73ed\u5c31\u9700\u8981\u4f60\u8fd9\u6837\u70ed\u5fc3\u7684\u540c\u5b66\u3002\u5e26\u5a03\u5df2\u7ecf\u5f88\u8f9b\u82e6\u4e86\uff0c\u8fd8\u8fd9\u4e48\u79ef\u6781\u5b66\u4e60\uff0c\u7279\u522b\u4f69\u670d\u4f60\u3002\u54b1\u4eec\u4e0d\u8ffd\u6c42\u901f\u5ea6\uff0c\u6309\u4f60\u81ea\u5df1\u7684\u8282\u594f\u6765\uff0c\u6709\u4efb\u4f55\u65f6\u95f4\u5b89\u6392\u4e0a\u7684\u56f0\u96be\u968f\u65f6\u8ddf\u6211\u8bf4\uff0c\u6211\u4eec\u4e00\u8d77\u8c03\u6574\u3002\u4f60\u7684\u8ba4\u771f\u548c\u70ed\u5fc3\uff0c\u5c31\u662f\u73ed\u91cc\u6700\u5b9d\u8d35\u7684\u8d22\u5bcc\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5174\u8da3\u6e38\u4e50\u7ebf**\u3011\u3002\u964d\u4f4e\u786c\u6838\u6280\u80fd\u538b\u529b\uff0c\u5f3a\u5316\u793e\u7fa4\u4e92\u52a8\u548c\u89d2\u8272\u626e\u6f14\u7684\u4e50\u8da3\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305**\u3011\u3002\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\u3001\u6613\u7126\u8651\u7684\u7279\u70b9\uff0c\u63d0\u4f9b\u7075\u6d3b\u7684\u5b66\u4e60\u8ba1\u5212\u5efa\u8bae\u548c\u60c5\u7eea\u5b89\u629a\u3002\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\uff08\u8f7b\u91cf\uff09**\u3011\u3002\u8d4b\u4e88\u5176\u73ed\u59d4\u3001\u5c0f\u52a9\u624b\u7b49\u89d2\u8272\uff0c\u6ee1\u8db3\u5176\u793e\u4ea4\u4e0e\u5c0a\u91cd\u9700\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7ed9\u5979\u540c\u65f6\u5b89\u6392\u591a\u95e8\u9ad8\u5f3a\u5ea6\u7684\u786c\u6838\u8bfe\u7a0b\uff08\u5982\u8fdb\u9636+\u540e\u671f\uff09\uff0c\u6216\u65bd\u52a0\u201c\u5fc5\u987b\u5feb\u901f\u63a5\u5355\u53d8\u73b0\u201d\u7684\u538b\u529b\u3002\u907f\u514d\u8ba9\u5979\u56e0\u65f6\u95f4\u51b2\u7a81\u4ea7\u751f\u6301\u7eed\u7126\u8651\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u8fdb\u884c**500\u5143\u4ee5\u5185\u5fae\u5347**\uff08\u5982\u97f3\u6548\u5305\u3001\u5c0f\u5de5\u5177\uff09\uff0c\u8c28\u614e\u63a8\u4ecb\u5927\u989d\u9ad8\u9636\u8bfe\u7a0b\uff0c\u9664\u975e\u80fd\u660e\u786e\u89e3\u51b3\u5176\u65f6\u95f4\u51b2\u7a81\u95ee\u9898\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u611f\u89c9\u6211\u8ddf\u4e0d\u4e0a\u4e86\uff0c\u6211\u60f3\u5148\u4e0a\u5b8c\u540e\u671f\u518d\u4e0a\u8fdb\u9636\uff0c\u4ee5\u540e\u8fd8\u53ef\u4ee5\u5b89\u6392\u5230\u60a8\u7684\u73ed\u5417\u201d\n2. > \u201c\u73ed\u73ed\uff0c\u5c0f\u52a9\u624b\u9700\u8981\u505a\u4ec0\u4e48\u5440\uff1f\u60a8\u770b\u6211\u53ef\u4ee5\u5417\u201d\n3. > \u201c\u6211\u666e\u901a\u8bdd\u4e0d\u6807\u51c6\u54e6\uff0c\u9700\u8981\u591a\u7ec3\uff0c\u5e0c\u671b\u6709\u4eba\u76d1\u7763[\u5077\u7b11]\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T5\u597d\u73a9\u5c1d\u9c9c\u578b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u793e\u7fa4\u4e2d\u83b7\u5f97\u5f52\u5c5e\u611f\u4e0e\u5c0a\u91cd\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u907f\u514d\u8bfe\u7a0b\u8d85\u8f7d\uff0c\u8d4b\u4e88\u5176\u793e\u7fa4\u89d2\u8272\uff0c\u63d0\u4f9b\u7075\u6d3b\u7684\u5b66\u4e60\u8def\u5f84\u548c\u60c5\u7eea\u652f\u6301\u3011**\u3002\n\n```json\n{\"core_type\": \"T5 \u597d\u73a9\u5c1d\u9c9c\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u793e\u4ea4/\u5c0a\u91cd\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf+\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
