        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677150964 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6696\u6696\uff08\u6768\u68a6\u5b87\uff09\u3001\u6d1b\u5947\u6eaa\u5802\uff08\u5f20\u723d\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u9ad8\u9636\u73ed\uff084\u4e2a\u6708\u7cfb\u7edf\u8bfe\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u652f\u4ed8\u65b9\u5f0f\u3001\u4ef7\u683c\u3001\u5206\u671f\u6216\u8d44\u91d1\u6765\u6e90\u3002\u65e0\u6cd5\u5224\u65ad\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u672a\u63d0\u53ca\u5de5\u4f5c\u3001\u5bb6\u5ead\u3001\u4f5c\u606f\u3002\u4ec5\u663e\u793a\u7528\u6237\u80fd\u8ddf\u4e0a\u76f4\u64ad\u548c\u4f5c\u4e1a\u8282\u594f\uff0c\u4f46\u65e0\u6cd5\u8bc4\u4f30\u5176\u957f\u671f\u3001\u7a33\u5b9a\u7684\u5b66\u4e60\u65f6\u95f4\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u80cc\u666f\u3001\u914d\u5076\u3001\u5b50\u5973\u6216\u5bb6\u4eba\u6001\u5ea6\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u804a\u5929\u8bb0\u5f55\u96c6\u4e2d\u4e8e\u8bfe\u7a0b\u5185\u5bb9\u3001\u4f5c\u4e1a\u53cd\u9988\u548c\u53d8\u73b0\u5f15\u5bfc\uff0c**\u5b8c\u5168\u7f3a\u5931\u4e09\u8f74\u6838\u5fc3\u5224\u65ad\u6240\u9700\u7684\u8d44\u91d1\u3001\u65f6\u95f4\u3001\u5bb6\u5ead\u652f\u6301\u7b49\u5173\u952e\u4fe1\u606f**\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b07\u4f4e\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u53d8\u73b0\u5bfc\u5411\u660e\u786e\uff0c\u5bf9\u5b66\u4e60\u8fc7\u7a0b\u548c\u80fd\u529b\u6210\u957f\u5174\u8da3\u4e00\u822c\uff0c\u6781\u5ea6\u5173\u6ce8\u201c\u591a\u4e45\u80fd\u8d5a\u94b1\u201d\u3001\u201c\u6ca1\u8003\u8fc7\u600e\u4e48\u529e\u201d\u7b49\u786e\u5b9a\u6027\u7ed3\u679c\u3002**\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6700\u91cd\u8981\u7684\u662f\u6ca1\u8003\u8fc7\u600e\u4e48\u529e\u201d\n  > \u201c\u4ed8\u8d39\u8fd9\u70b9\u6ca1\u4ec0\u4e48\u8bf4\u7684...\u6211\u770b\u4e2d\u7684\u662f\u540e\u9762\u6323\u94b1\u7684\u540e\u7eed\uff0c\u80fd\u4e0d\u80fd\u6323\u5230\u94b1\uff0c\u90fd\u662f\u6210\u5e74\u4eba\u4e86\uff0c\u5927\u5bb6\u5173\u6ce8\u7684\u80af\u5b9a\u662f\u8fd9\u4e2a\u4e86\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2753 \u65e0\u6cd5\u8bc4\u7ea7\uff08\u4fe1\u606f\u7f3a\u5931\uff09\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u65e0\u4efb\u4f55\u652f\u4ed8\u3001\u6536\u5165\u3001\u7ecf\u6d4e\u72b6\u51b5\u4fe1\u606f\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u65e0\u5de5\u4f5c\u3001\u5bb6\u5ead\u3001\u4f5c\u606f\u4fe1\u606f\u3002\u4ec5\u80fd\u770b\u51fa\u4f53\u9a8c\u8425\u671f\u95f4\u80fd\u8ddf\u4e0a\u8282\u594f\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u65e0\u4efb\u4f55\u63d0\u53ca\u3002\n- **\u5e95\u5ea7\u53d6\u77ed\u677f**\uff1a**\u65e0\u6cd5\u8bc4\u7ea7**\u3002\u8d44\u91d1\u3001\u65f6\u95f4\u3001\u5bb6\u5ead\u4e09\u5927\u7ef4\u5ea6\u4fe1\u606f\u5168\u90e8\u7f3a\u5931\uff0c\u65e0\u6cd5\u8fdb\u884c\u6709\u6548\u8bc4\u4f30\uff0c**\u98ce\u9669\u6781\u9ad8**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u9996\u6b21\u63a5\u89e6\u5373\u8868\u73b0\u51fa\u5bf9\u5931\u8d25\u7684\u5f3a\u70c8\u6050\u60e7\u548c\u5bf9\u5916\u90e8\u8ba4\u8bc1\uff08\u8bc1\u4e66\uff09\u7684\u9ad8\u5ea6\u4f9d\u8d56\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6700\u91cd\u8981\u7684\u662f\u6ca1\u8003\u8fc7\u600e\u4e48\u529e\u201d\n  > \u201c\u5bf9\u54ea\u4e2a\u611f\u5174\u8da3\uff0c\u6211\u771f\u4e0d\u77e5\u9053\uff0c\u611f\u89c9\u4ec0\u4e48\u90fd\u4e0d\u61c2\u7684\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u81ea\u8eab\u80fd\u529b\u6781\u5ea6\u4e0d\u81ea\u4fe1\uff0c\u5bf9\u672a\u6765\u6536\u5165\u6765\u6e90\u611f\u5230\u7126\u8651\uff0c\u5e0c\u671b\u901a\u8fc7\u4e00\u4e2a\u201c\u8bc1\u4e66\u201d\u6216\u201c\u4fdd\u8bc1\u201d\u6765\u83b7\u5f97\u786e\u5b9a\u6027\u7684\u804c\u4e1a\u4fdd\u969c\u548c\u6536\u5165\u5b89\u5168\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u9632\u62a4\u76fe\u5f0f\u7684\u9000\u8d39\u901a\u9053\u4e0e\u6781\u5ea6\u8c28\u614e\u7684\u9884\u671f\u7ba1\u7406**\u3002\u907f\u514d\u4efb\u4f55\u201c\u5305\u8fc7\u201d\u3001\u201c\u5305\u8d5a\u201d\u7684\u627f\u8bfa\uff0c\u5f3a\u8c03\u6280\u80fd\u79ef\u7d2f\u7684\u957f\u671f\u6027\uff0c\u5e76\u660e\u786e\u544a\u77e5\u5b66\u4e60\u4e0e\u53d8\u73b0\u4e4b\u95f4\u7684\u4e0d\u786e\u5b9a\u6027\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5 C2\u7c7b\uff08\u51b2\u52a8\u98ce\u9669\u578b\uff09** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5ead\u4e89\u5435\u7b49\u76f4\u63a5\u7194\u65ad\u8bc1\u636e\u3002**\u4f46\u56e0\u5173\u952e\u4fe1\u606f\uff08\u8d44\u91d1\u3001\u5bb6\u5ead\uff09\u7f3a\u5931\uff0c\u65e0\u6cd5\u5b8c\u5168\u6392\u9664D\u7c7b\u98ce\u9669\u3002**\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u9ad8** | **\u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u98ce\u9669\u6781\u9ad8**\u3002\u82e5\u62a5\u540d\u8d44\u91d1\u6765\u6e90\u4e8e\u5bb6\u5ead\u5171\u540c\u8d22\u4ea7\u6216\u9690\u7792\u5bb6\u4eba\uff0c\u6781\u6613\u5f15\u53d1\u51b2\u7a81\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u82e5\u540e\u7eed\u6b63\u5f0f\u8bfe\u7a0b\u5f3a\u5ea6\u52a0\u5927\uff0c\u5176\u201c\u4ec0\u4e48\u90fd\u4e0d\u61c2\u201d\u7684\u81ea\u5351\u611f\u53ef\u80fd\u8f6c\u5316\u4e3a\u201c\u5b66\u4e0d\u4f1a\u201d\u7684\u632b\u8d25\u611f\uff0c\u5bfc\u81f4\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u5bf9\u201c\u8003\u4e0d\u8fc7\u201d\u7684\u6050\u60e7\u662f\u5176\u6700\u5927\u5fc3\u7ed3\u3002\u4e00\u65e6\u5728\u8003\u6838\u3001\u4f5c\u4e1a\u6216\u521d\u671f\u63a5\u5355\u4e2d\u53d7\u632b\uff0c\u6781\u6613\u60c5\u7eea\u5d29\u6e83\uff0c\u5f52\u548e\u4e8e\u5e73\u53f0\u201c\u9a97\u4eba\u201d\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u6781\u9ad8** | \u5176\u6838\u5fc3\u52a8\u673a\u662f\u201c\u6323\u94b1\u540e\u7eed\u201d\u3002\u4e00\u65e6\u53d1\u73b0\u5b66\u4e60\u5468\u671f\u957f\u3001\u53d8\u73b0\u6162\u3001\u6216\u521d\u671f\u8bd5\u97f3\u4e0d\u4e2d\uff0c\u4f1a\u7acb\u523b\u4ea7\u751f\u201c\u88ab\u9a97\u201d\u611f\uff0c\u8981\u6c42\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\u3002\u5f53\u7b2c\u4e00\u6b21\u6b63\u5f0f\u8003\u6838\u6765\u4e34\u6216\u7b2c\u4e00\u6b21\u8bd5\u97f3\u5931\u8d25\u65f6\uff0c\u5176\u201c\u8003\u4e0d\u8fc7\u600e\u4e48\u529e\u201d\u7684\u7126\u8651\u5c06\u96c6\u4e2d\u7206\u53d1\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u590f\u5929\u540c\u5b66\uff0c\u770b\u5230\u4f60\u5728\u4f53\u9a8c\u8425\u975e\u5e38\u8ba4\u771f\u5730\u5b8c\u6210\u4e86\u6bcf\u4e00\u6b21\u4f5c\u4e1a\uff0c\u8fd9\u79cd\u6001\u5ea6\u7279\u522b\u68d2\uff01\u54b1\u4eec\u8fd9\u4e2a\u884c\u4e1a\uff0c\u5c31\u50cf\u5b66\u5f00\u8f66\uff0c\u62ff\u5230\u9a7e\u7167\u53ea\u662f\u5f00\u59cb\uff0c\u771f\u6b63\u7684\u2018\u8001\u53f8\u673a\u2019\u90fd\u662f\u5728\u8def\u4e0a\u7ec3\u51fa\u6765\u7684\u3002\u54b1\u4eec\u7684\u8bfe\u7a0b\u5c31\u662f\u5e2e\u4f60\u628a\u2018\u8f66\u2019\u5f00\u7a33\uff0c\u4f46\u2018\u4e0a\u8def\u2019\u540e\u7684\u8def\u51b5\u548c\u6536\u5165\uff0c\u786e\u5b9e\u9700\u8981\u65f6\u95f4\u548c\u7ecf\u9a8c\u7684\u79ef\u7d2f\u3002\u522b\u6015\u2018\u8003\u4e0d\u8fc7\u2019\uff0c\u54b1\u4eec\u7684\u76ee\u6807\u4e0d\u662f\u4e00\u6b21\u8003\u8bd5\uff0c\u800c\u662f\u8ba9\u4f60\u771f\u6b63\u638c\u63e1\u80fd\u6301\u7eed\u8d5a\u94b1\u7684\u672c\u4e8b\u3002\u8fc7\u7a0b\u4e2d\u6709\u4efb\u4f55\u5361\u70b9\uff0c\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u89e3\u51b3\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\u3011** + **\u3010\u5feb\u901f\u63a5\u5355\u7ebf\uff08\u8f7b\u91cf\u7ea7\uff09\u3011**\u3002\u5fc5\u987b\u4f18\u5148\u89e3\u51b3\u5176\u60c5\u7eea\u4f9d\u8d56\u548c\u81ea\u4fe1\u5fc3\u95ee\u9898\uff0c\u518d\u8c28\u614e\u5bf9\u63a5\u4f4e\u95e8\u69db\u3001\u6613\u4e0a\u624b\u7684\u8bd5\u97f3\u8d44\u6e90\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u6302\u8f7d\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u5b89\u6392\u4e13\u5c5e\u5b66\u4f34\u6216\u5fc3\u7406\u652f\u6301\u578b\u73ed\u59d4\uff0c\u9ad8\u9891\u8fdb\u884c\u60c5\u7eea\u5b89\u629a\u548c\u5fae\u5c0f\u8fdb\u6b65\u7684\u6b63\u5411\u6fc0\u52b1\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. \u7edd\u4e0d\u5bf9\u5176\u4f7f\u7528\u201c\u5b66\u5b8c\u7acb\u523b\u63a5\u5355\u201d\u3001\u201c\u6708\u5165\u8fc7\u4e07\u201d\u7b49\u53d8\u73b0\u627f\u8bfa\u8bdd\u672f\u3002\n    2. \u7edd\u4e0d\u5728\u5176\u9996\u6b21\u53d7\u632b\uff08\u5982\u8bd5\u97f3\u5931\u8d25\uff09\u65f6\u8fdb\u884c\u6279\u8bc4\u6216\u5bf9\u6bd4\uff0c\u5fc5\u987b\u7b2c\u4e00\u65f6\u95f4\u8fdb\u884c\u5fc3\u7406\u758f\u5bfc\u3002\n    3. \u7edd\u4e0d\u5bf9\u5176\u9690\u7792\u5b66\u4e60\u96be\u5ea6\u548c\u53d8\u73b0\u5468\u671f\uff0c\u5fc5\u987b\u53cd\u590d\u8fdb\u884c\u9884\u671f\u7ba1\u7406\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5f62\u5f0f\u7684\u5347\u5355**\u3002\u5728\u5b8c\u6210\u5f53\u524d\u8bfe\u7a0b\u5e76\u5efa\u7acb\u7a33\u5b9a\u5fc3\u6001\u524d\uff0c\u7981\u6b62\u63a8\u8350\u4efb\u4f55\u9ad8\u9636\u6216\u9644\u52a0\u4ea7\u54c1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > **\u201c\u6700\u91cd\u8981\u7684\u662f\u6ca1\u8003\u8fc7\u600e\u4e48\u529e\u201d** \u2014\u2014 \u4f4e\u5fc3\u7406\u5f39\u6027\u3001\u5bf9\u786e\u5b9a\u6027\u6781\u5ea6\u4f9d\u8d56\u7684\u6838\u5fc3\u8bc1\u636e\u3002\n2. > **\u201c\u4ed8\u8d39\u8fd9\u70b9\u6ca1\u4ec0\u4e48\u8bf4\u7684...\u6211\u770b\u4e2d\u7684\u662f\u540e\u9762\u6323\u94b1\u7684\u540e\u7eed\uff0c\u80fd\u4e0d\u80fd\u6323\u5230\u94b1\uff0c\u90fd\u662f\u6210\u5e74\u4eba\u4e86\uff0c\u5927\u5bb6\u5173\u6ce8\u7684\u80af\u5b9a\u662f\u8fd9\u4e2a\u4e86\u201d** \u2014\u2014 \u4f4e\u52a8\u673a\u7eaf\u5ea6\uff08\u7eaf\u53d8\u73b0\u5bfc\u5411\uff09\u7684\u6838\u5fc3\u8bc1\u636e\u3002\n3. > **\u201c\u5bf9\u54ea\u4e2a\u611f\u5174\u8da3\uff0c\u6211\u771f\u4e0d\u77e5\u9053\uff0c\u611f\u89c9\u4ec0\u4e48\u90fd\u4e0d\u61c2\u7684\u201d** \u2014\u2014 \u81ea\u6211\u8ba4\u77e5\u6a21\u7cca\u3001\u7f3a\u4e4f\u5185\u5728\u9a71\u52a8\u3001\u4f9d\u8d56\u5916\u90e8\u6307\u5f15\u7684\u8bc1\u636e\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6\u60c5\u7eea\u5de8\u5a74\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u901a\u8fc7\u4e00\u4e2a\u5916\u90e8\u8ba4\u8bc1\uff08\u8bc1\u4e66/\u63a5\u5355\uff09\u6765\u83b7\u5f97\u7ecf\u6d4e\u5b89\u5168\u611f**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u5165\u5b66\u7b2c\u4e00\u5468\u8fdb\u884c\u5f3a\u9884\u671f\u7ba1\u7406 + \u914d\u5907\u5fc3\u7406\u7597\u6108\u578b\u5b66\u4f34 + \u5efa\u7acb\u5feb\u901f\u60c5\u7eea\u54cd\u5e94\u901a\u9053**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"maslow_need\": \"\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\", \"risk_level\": \"\u6781\u9ad8\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
        document.getElementById('content').innerHTML = marked.parse(markdownText);
