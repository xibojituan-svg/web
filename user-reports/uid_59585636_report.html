        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 59585636 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-26 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u8d22\u732b\u2014AI\u5199\u4f5c\u6559\u7ec3(\u5f20\u6676)\u3001\u79cb\u6c344(\u5f20\u6676)\u3001\u82b1\u751f\u73ed\u73ed(\u5218\u654f)\u3001\u6735\u6735(\u6768\u5e06) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u5199\u4f5c\u65d7\u8230\u73ed\uff08\u5df2\u8d2d\uff09\u3001\u6539\u7a3f\u8bfe\uff08\u5df2\u8d2d\uff0c1880\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u5145\u88d5\uff08\u5df2\u8d2d\u4e24\u95e8\u8bfe\u7a0b\uff0c\u672a\u63d0\u53ca\u652f\u4ed8\u538b\u529b\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1\uff08\u9700\u517c\u987e\u5de5\u4f5c\u3001\u5bb6\u5ead\u3001\u5b69\u5b50\u5347\u5b66\uff0c\u65f6\u95f4\u7d27\u5f20\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u5df2\u62a5\u5907\u5e76\u652f\u6301\uff08\u5bb6\u5ead\u60c5\u51b5\u5728\u804a\u5929\u4e2d\u81ea\u7136\u63d0\u53ca\uff0c\u65e0\u9690\u7792\u8ff9\u8c61\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | \u9971\u6ee1 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u800c\u6765(\u9ad8)\u3002\u7528\u6237\u5173\u6ce8\u8bfe\u7a0b\u5185\u5bb9\u3001\u5b66\u4e60\u8fc7\u7a0b\u3001\u6280\u80fd\u63d0\u5347\uff08\u5982\u914d\u97f3\u3001\u5199\u4f5c\uff09\uff0c\u5e76\u4e3b\u52a8\u521b\u4f5c\u5267\u672c\u3002\u867d\u6709\u53d8\u73b0\u671f\u5f85\uff08\u201c\u6211\u8981\u7206\u6b3e\u201d\uff09\uff0c\u4f46\u672a\u8981\u6c42\u77ed\u671f\u4fdd\u5e95\u627f\u8bfa\uff0c\u4e14\u5bf9\u957f\u7bc7\u5199\u4f5c\u6709\u201c\u68a6\u60f3\u201d\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5509\uff0c\u6bcf\u4e2a\u5199\u6587\u7684\u90fd\u6709\u60f3\u5199\u957f\u7bc7\u7684\u68a6\u60f3\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u9ad8** \u2014 \u5df2\u8fde\u7eed\u8d2d\u4e70AI\u5199\u4f5c\u65d7\u8230\u73ed\u548c\u6539\u7a3f\u8bfe\uff0c\u672a\u63d0\u53ca\u4efb\u4f55\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u7528\u6237\u660e\u786e\u8868\u793a\u201c4\u6708\u4efd\uff0c5\u6708\u4efd\u90fd\u597d\u5fd9\u554a\uff0c\u6709\u597d\u51e0\u4e2a\u57f9\u8bad\u201d\uff0c\u4e14\u56e0\u5b69\u5b50\u201c\u5c0f\u5347\u521d\u548c\u5e7c\u5347\u5c0f\u201d\u9700\u8981\u6295\u5165\u5927\u91cf\u7cbe\u529b\uff0c\u751a\u81f3\u56e0\u6b64\u5f71\u54cd\u4f5c\u4e1a\u5b8c\u6210\u3002\u8fd9\u662f\u660e\u663e\u7684\u8d44\u6e90\u77ed\u677f\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u9ad8** \u2014 \u81ea\u7136\u63d0\u53ca\u5bb6\u5ead\u548c\u5b69\u5b50\uff0c\u65e0\u53cd\u5bf9\u6216\u9690\u7792\u8ff9\u8c61\uff0c\u5bb6\u5ead\u662f\u751f\u6d3b\u91cd\u5fc3\u7684\u4e00\u90e8\u5206\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9047\u5230\u8bfe\u7a0b\u7cfb\u7edf\u95ee\u9898\uff08\u201c\u7a7a\u7a7a\u8361\u8361\u201d\uff09\u3001\u5b66\u4e60\u56f0\u96be\uff08\u201c\u5939\u4e0d\u8d77\u6765\u201d\uff09\u3001\u65f6\u95f4\u51b2\u7a81\uff08\u201c\u4f5c\u4e1a\u505a\u4e0d\u5b8c\u201d\uff09\u65f6\uff0c\u6001\u5ea6\u79ef\u6781\uff0c\u4e3b\u52a8\u6c42\u52a9\u6216\u81ea\u6211\u8c03\u4f83\uff0c\u65e0\u62b1\u6028\u3001\u6307\u8d23\u6216\u653e\u5f03\u503e\u5411\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u60f3\u8ba9\u81ea\u5df1\u8bf4\u8bdd\u4e0d\u8981\u5939\u3002\u3002\u3002\u3002\u597d\u96be\u554a[\u88c2\u5f00]...\u6211\u53bb\u5b66\u5531\u6b4c\u5c31\u662f\u4e3a\u4e86\u6539\u6389\u8fd9\u4e2a\u95ee\u9898\u3002\u3002\u3002\u3002\u201d (\u9762\u5bf9\u56f0\u96be\uff0c\u4e3b\u52a8\u5bfb\u6c42\u5176\u4ed6\u89e3\u51b3\u65b9\u6848)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e2d\u5e74\u6bcd\u4eb2\u5728\u591a\u91cd\u793e\u4f1a\u89d2\u8272\uff08\u804c\u573a\u3001\u5bb6\u5ead\u4e3b\u5987\u3001\u5bb6\u957f\uff09\u6324\u538b\u4e0b\u7684\u81ea\u6211\u4ef7\u503c\u611f\u7f3a\u5931**\u3002\u5979\u5e0c\u671b\u901a\u8fc7\u5199\u4f5c\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\uff08\u201c\u7206\u6b3e\u201d\uff09\u3001\u5efa\u7acb\u72ec\u7acb\u4e8e\u5bb6\u5ead\u7684\u8eab\u4efd\u8ba4\u540c\u3001\u5e76\u5b9e\u73b0\u4e2a\u4eba\u68a6\u60f3\uff08\u5199\u957f\u7bc7\uff09\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u770b\u89c1\u201d\u4e0e\u201c\u80af\u5b9a\u201d**\u3002\u80af\u5b9a\u5979\u4f5c\u4e3a\u201c\u521b\u4f5c\u8005\u201d\u548c\u201c\u5b66\u4e60\u8005\u201d\u7684\u8eab\u4efd\uff0c\u800c\u4e0d\u4ec5\u4ec5\u662f\u201c\u5988\u5988\u201d\u6216\u201c\u5458\u5de5\u201d\u3002\u63d0\u4f9b\u4e00\u79cd\u201c\u540c\u9053\u4e2d\u4eba\u201d\u7684\u793e\u7fa4\u5f52\u5c5e\u611f\uff0c\u8ba9\u5979\u611f\u5230\u81ea\u5df1\u7684\u52aa\u529b\u548c\u624d\u534e\u88ab\u770b\u89c1\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 **B\u7c7b** (\u52a8\u673a\u7eaf\u5ea6\u9ad8\uff0c\u8d44\u6e90\u5e95\u5ea7\u56e0\u65f6\u95f4\u53d7\u9650\u4e3a\u4e2d\uff0c\u6574\u4f53\u4e3a\u9ad8\u4ef7\u503c\u6f5c\u529b\u7528\u6237) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u5173\u6ce8\u6280\u80fd\u672c\u8eab\uff0c\u79ef\u6781\u5b8c\u6210\u4f5c\u4e1a\uff0c\u4e3b\u52a8\u521b\u4f5c\uff0c\u4e0d\u5f20\u626c\u4f46\u6301\u7eed\u6295\u5165) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u5bb6\u5ead\u77e5\u60c5\u4e14\u652f\u6301\uff0c\u5b69\u5b50\u5347\u5b66\u662f\u77ed\u671f\u538b\u529b\u6e90\uff0c\u975e\u957f\u671f\u53cd\u5bf9\u56e0\u7d20\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u56e0\u5de5\u4f5c\u3001\u5bb6\u5ead\uff08\u5b69\u5b50\u5347\u5b66\u5b63\uff09\u7b49\u591a\u91cd\u4e8b\u52a1\u6324\u538b\uff0c\u5bfc\u81f4\u65e0\u6cd5\u8ddf\u4e0a\u8bfe\u7a0b\u8282\u594f\uff0c\u4ea7\u751f\u201c\u82b1\u4e86\u94b1\u5374\u6ca1\u65f6\u95f4\u5b66\u201d\u7684\u6127\u759a\u548c\u7126\u8651\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u5230\u95ee\u9898\u503e\u5411\u4e8e\u89e3\u51b3\u800c\u975e\u62b1\u6028\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u52a8\u673a\u66f4\u504f\u5411\u80fd\u529b\u6210\u957f\u548c\u81ea\u6211\u5b9e\u73b0\uff0c\u5bf9\u77ed\u671f\u53d8\u73b0\u7684\u6267\u5ff5\u4e0d\u6df1\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7684\u524d\u4e24\u5468\uff0c\u4ee5\u53ca\u4efb\u4f55\u4e0e\u5b69\u5b50\u5347\u5b66\u5173\u952e\u671f\uff08\u59824-6\u6708\uff09\u91cd\u53e0\u7684\u8bfe\u7a0b\u9636\u6bb5**\u3002\u6b64\u65f6\u65f6\u95f4\u51b2\u7a81\u6700\u4e25\u91cd\uff0c\u5bb9\u6613\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u4ea7\u751f\u632b\u8d25\u611f\u5e76\u840c\u751f\u9000\u610f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5377\u5377\u5988\u5988/\u540c\u5b66\uff0c\u770b\u5230\u4f60\u53c8\u8981\u5fd9\u5de5\u4f5c\u53c8\u8981\u64cd\u5fc3\u4e24\u4e2a\u5b9d\u8d1d\u5347\u5b66\uff0c\u8fd8\u80fd\u575a\u6301\u4e3a\u81ea\u5df1\u7684\u5199\u4f5c\u68a6\u60f3\u7559\u51fa\u65f6\u95f4\uff0c\u771f\u7684\u592a\u4e86\u4e0d\u8d77\u4e86\uff01\u54b1\u4eec\u8fd9\u671f\u8bfe\u4e0d\u8d76\u8fdb\u5ea6\uff0c\u4f60\u7684\u8282\u594f\u5c31\u662f\u8bfe\u7a0b\u7684\u8282\u594f\u3002\u5fd9\u5b69\u5b50\u7684\u65f6\u5019\u5b89\u5fc3\u53bb\u5fd9\uff0c\u843d\u4e0b\u7684\u5185\u5bb9\u968f\u65f6\u627e\u6211\u8865\uff0c\u4f60\u7684\u5267\u672c\u548c\u68a6\u60f3\uff0c\u6211\u4eec\u4e00\u8d77\u6765\u5b88\u62a4\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** + **\u3010\u5174\u8da3\u5ef6\u5c55\u7ebf\u3011**\u3002\u63d0\u4f9b\u624e\u5b9e\u7684\u5199\u4f5c\u6280\u5de7\u548c\u6539\u7a3f\u53cd\u9988\uff08B\u6a21\u5757\uff09\uff0c\u540c\u65f6\u7528\u201c\u957f\u7bc7\u68a6\u60f3\u201d\u548c\u521b\u610f\u5199\u4f5c\uff08\u5982\u5979\u5df2\u521b\u4f5c\u7684\u300a\u609f\u7a7a\u8d85\u5e02\u300b\u5267\u672c\uff09\u4f5c\u4e3a\u5174\u8da3\u951a\u70b9\uff0c\u7ef4\u6301\u957f\u671f\u70ed\u60c5\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\u7684\u7279\u70b9\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u5f39\u6027\u5b66\u4e60\u652f\u6301\u5305\u3011**\uff08\u5982\uff1a\u8bfe\u7a0b\u6c38\u4e45\u56de\u653e\u3001\u91cd\u70b9\u5185\u5bb9\u5207\u7247\u3001\u5f02\u6b65\u4f5c\u4e1a\u6279\u6539\u901a\u9053\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u522b\u4eba\u90fd\u4ea4\u4f5c\u4e1a\u4e86\u201d\u7b49\u8bdd\u672f\u5236\u9020\u7126\u8651\uff1b\u5728\u5979\u660e\u786e\u8868\u793a\u65f6\u95f4\u7d27\u5f20\u65f6\uff0c\u4ecd\u50ac\u4fc3\u5176\u8ddf\u4e0a\u76f4\u64ad\u6216\u5bc6\u96c6\u4efb\u52a1\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u9700\u7cbe\u51c6\u5339\u914d\u5176\u65f6\u95f4\u7a97\u53e3**\u3002\u5347\u5355\u524d\u5fc5\u987b\u786e\u8ba4\u5176\u5bb6\u5ead\u4e8b\u52a1\uff08\u5982\u5b69\u5b50\u5347\u5b66\uff09\u5df2\u544a\u4e00\u6bb5\u843d\uff0c\u5e76\u63d0\u4f9b\u660e\u786e\u7684\u3001\u53ef\u7075\u6d3b\u5b89\u6392\u7684\u5b66\u4e60\u8ba1\u5212\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u5230\u73b0\u5728\u4e00\u4e2a\u5267\u672c\u8fd8\u6ca1\u5199\u5b8c\u5462\uff0c\u55ef\uff0c\u6709\u70b9\u513f\u6cae\u4e27[\u6342\u8138]\u201d **(\u900f\u9732\u52aa\u529b\u4f46\u53d7\u9650\u4e8e\u65f6\u95f4\u7684\u771f\u5b9e\u72b6\u6001)**\n2. > \u201c\u4eca\u5e74\u6211\u4eec\u5bb6\u4e24\u4e2a\u5d3d\u8981\u5c0f\u5347\u521d\u548c\u5e7c\u5347\u5c0f\uff0c\u4f1a\u6bd4\u8f83\u5fd9\u3002\u6211\u524d\u4e24\u5929\u4f5c\u4e1a\u505a\u4e0d\u5b8c\uff0c\u5c31\u662f\u56e0\u4e3a\u5728\u8fde\u591c\u7ed9\u4ed6\u4eec\u6539\u7b80\u5386\u3002\u201d **(\u6e05\u6670\u66b4\u9732\u8d44\u6e90\u5e95\u5ea7\u4e2d\u7684\u65f6\u95f4\u77ed\u677f)**\n3. > \u201c\u5509\uff0c\u6bcf\u4e2a\u5199\u6587\u7684\u90fd\u6709\u60f3\u5199\u957f\u7bc7\u7684\u68a6\u60f3\u201d **(\u63ed\u793a\u6df1\u5c42\u52a8\u673a\u662f\u81ea\u6211\u5b9e\u73b0\u4e0e\u5c0a\u91cd\uff0c\u800c\u975e\u5355\u7eaf\u5feb\u94b1)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u4e0e\u81ea\u6211\u4ef7\u503c\u8ba4\u540c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u5ea6\u7075\u6d3b\u3001\u975e\u540c\u6b65\u7684\u5b66\u4e60\u652f\u6301\uff0c\u7f13\u89e3\u5176\u56e0\u5bb6\u5ead\u4e8b\u52a1\u5bfc\u81f4\u7684\u65f6\u95f4\u7126\u8651\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5f39\u6027\u5b66\u4e60\u652f\u6301\u5305\"}\n```";
