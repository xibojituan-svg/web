    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677171164\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\uff0c\u5e76\u8f93\u51fa\u7ed3\u6784\u5316\u8bca\u65ad\u62a5\u544a\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677171164 (\u6635\u79f0\uff1a\u661f\u661f) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u516d\u6708\u6668\u516e(\u5218\u519b) / \u5e03\u4e01(\u5218\u519b) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u64ad\u6500\u767b\u8ba1\u5212\u7cfb\u7edf\u8bfe (\u4ef7\u683c\uff1a2380\u5143\uff0c\u6709\u4f18\u60e0) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u4ec5\u663e\u793a\u201c\u5df2\u4ed8\u6b3e\u201d\uff0c\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3002\u9700\u6838\u67e5\u662f\u5426\u4e3a\u82b1\u5457/\u5206\u671f\u4ed8\u6b3e\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u4ece\u804a\u5929\u8bb0\u5f55\u770b\uff0c\u7528\u6237\u80fd\u53ca\u65f6\u54cd\u5e94\u5e76\u5b8c\u6210\u4f5c\u4e1a\uff0c\u65f6\u95f4\u5b89\u6392\u8f83\u89c4\u5f8b\uff0c\u4f46\u672a\u900f\u9732\u804c\u4e1a\u6216\u5177\u4f53\u4f5c\u606f\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u4fe1\u606f\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u6709\u5b66\u4e60\u884c\u4e3a\u3001\u4e92\u52a8\u548c\u4ed8\u8d39\u52a8\u4f5c\uff0c\u4f46\u7f3a\u4e4f\u4e2a\u4eba\u80cc\u666f\u3001\u6df1\u5c42\u52a8\u673a\u548c\u6297\u538b\u6027\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **[\u2b06\u9ad8]**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u800c\u6765\uff0c\u5b66\u4e60\u610f\u613f\u660e\u786e\uff0c\u5173\u6ce8\u884c\u4e1a\u4e86\u89e3\u4e0e\u6280\u80fd\u63d0\u5347\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u5e08\u59d0\u597d\uff0c\u76f4\u64ad\u8bfe\u6536\u83b7\u5f88\u591a\uff0c\u5bf9\u8fd9\u4e2a\u884c\u4e1a\u6709\u4e86\u70b9\u521d\u6b65\u7684\u4e86\u89e3\uff0c\u6211\u60f3\u5728\u8fd9\u4e2a\u884c\u4e1a\u52aa\u529b\u5b66\u4e60\u4e00\u4e0b\u3002\u201d\n> \u201c\u597d\u7684\uff0c\u8c22\u8c22\u8001\u5e08\u7684\u7ec6\u81f4\u70b9\u8bc4\uff0c\u63a5\u4e0b\u6765\u6211\u4f1a\u8ddf\u7740\u8001\u5e08\u597d\u597d\u52aa\u529b\u5b66\u4e60\u7684[\u7231\u5fc3]\u201d\n> \u201cyes\u201d (\u5728\u9500\u552e\u95ee\u201c\u51c6\u5907\u597d\u6b63\u5f0f\u8fdb\u5165\u6709\u58f0\u884c\u4e1a\u4e86\u561b\uff1f\u201d\u65f6\u56de\u7b54)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **[\u27a1\u4e2d]**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u652f\u4ed82380\u5143\u8bfe\u7a0b\uff0c\u4f46\u672a\u900f\u9732\u8d44\u91d1\u6765\u6e90\uff0c\u9700\u8b66\u60d5\u5206\u671f\u4ed8\u6b3e\u98ce\u9669\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u8ddf\u76f4\u64ad\u3001\u53c2\u4e0ePia\u620f\uff0c\u663e\u793a\u6709\u89c4\u5f8b\u7684\u5b66\u4e60\u65f6\u95f4\uff0c\u4f46\u672a\u8bf4\u660e\u662f\u788e\u7247\u5316\u8fd8\u662f\u6574\u5757\u65f6\u95f4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u672a\u77e5** \u2014 \u65e0\u4fe1\u606f\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **[\u27a1\u4e2d]**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a**\u3002\u7528\u6237\u8868\u73b0\u51fa\u826f\u597d\u7684\u670d\u4ece\u6027\u548c\u914d\u5408\u5ea6\uff0c\u5bf9\u9500\u552e/\u73ed\u4e3b\u4efb\u7684\u9f13\u52b1\u548c\u6307\u5bfc\u79ef\u6781\u56de\u5e94\uff0c\u672a\u89c1\u8d1f\u9762\u60c5\u7eea\u6216\u81ea\u6211\u6000\u7591\u3002\u4f46\u5c1a\u672a\u7ecf\u5386\u91cd\u5927\u632b\u6298\uff0c\u5f39\u6027\u672a\u7ecf\u8fc7\u8003\u9a8c\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u5e08\u59d0\uff0c\u4e0b\u9762\u662f\u6211\u8ddf\u8bfb\u7684\u7ae5\u8bdd\u6545\u4e8b\uff0c\u624b\u673a\u5f55\u97f3\u673a\u5f55\u7684\u3002\u201d (\u4e3b\u52a8\u63d0\u4ea4\u989d\u5916\u7ec3\u4e60)\n> \u201c\u597d\u7684\uff0c\u8c22\u8c22\u5e08\u59d0[\u73ab\u7470]\u201d (\u5bf9\u5404\u9879\u6307\u4ee4\u5747\u793c\u8c8c\u3001\u53ca\u65f6\u56de\u5e94)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u5f52\u5c5e\u4e0e\u5c0a\u91cd\u9700\u6c42 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u8fdb\u5165\u65b0\u884c\u4e1a\uff08\u6709\u58f0\uff09\u7684\u964c\u751f\u611f\u4e0e\u4e0d\u786e\u5b9a\u6027\uff0c\u9700\u8981\u88ab\u201c\u5e26\u9886\u201d\u548c\u201c\u8ba4\u53ef\u201d\u7684\u5b89\u5168\u611f\u3002\u7528\u6237\u5bf9\u201c\u5e08\u59d0\u201d\u7684\u79f0\u547c\u548c\u4f9d\u8d56\uff0c\u663e\u793a\u51fa\u5bf9\u6743\u5a01/\u524d\u8f88\u5f15\u5bfc\u7684\u6e34\u671b\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u597d\u201d\u7684\u4e13\u5c5e\u611f\u4e0e\u201c\u88ab\u5e26\u9886\u201d\u7684\u8def\u5f84\u6e05\u6670\u611f**\u3002\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u6211\u770b\u597d\u4f60\u201d\u3001\u201c\u4f60\u662f\u6211\u5e26\u5165\u884c\u7684\u5a18\u5bb6\u4eba\u201d\uff0c\u7cbe\u51c6\u51fb\u4e2d\u4e86\u7528\u6237\u5bf9\u5f52\u5c5e\u611f\u548c\u88ab\u5c0a\u91cd\u7684\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u8fdb\u5316\u524d\u4f53\uff0c\u6709\u5411\u6df7\u5408\u4f533\u53f7\u3010\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b\u3011\u53d1\u5c55\u7684\u6f5c\u529b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n**\u3010\u5224\u5b9a\u6811\u63a8\u6f14\u8fc7\u7a0b\u3011**\n1.  **\u652f\u4ed8\u6838\u67e5 (\u6b65\u9aa40)**\uff1a\u8bb0\u5f55\u663e\u793a\u201c\u5df2\u4ed8\u6b3e\u201d\uff0c\u4f46\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3002**\u6b64\u4e3a\u5173\u952e\u4fe1\u606f\u7f3a\u53e3**\uff0c\u9700\u73ed\u4e3b\u4efb\u5728\u540e\u7eed\u670d\u52a1\u4e2d\u7acb\u5373\u6478\u5e95\uff0c\u6392\u9664\u82b1\u5457\u5206\u671f\u22656\u671f\u7b49C2\u98ce\u9669\u3002\n2.  **\u4e09\u8f74\u8bc4\u5206**\uff1a\n    *   \u52a8\u673a\u7eaf\u5ea6\uff1a7-8\u5206\uff08\u5173\u6ce8\u884c\u4e1a\u3001\u4e3b\u52a8\u5b66\u4e60\u3001\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\uff09\u3002\n    *   \u8d44\u6e90\u5e95\u5ea7\uff1a5-6\u5206\uff08\u65f6\u95f4\u89c4\u5f8b\uff0c\u4f46\u8d44\u91d1\u548c\u5bb6\u5ead\u4fe1\u606f\u672a\u77e5\uff09\u3002\n    *   \u5fc3\u7406\u5f39\u6027\uff1a5-6\u5206\uff08\u914d\u5408\u5ea6\u9ad8\uff0c\u60c5\u7eea\u7a33\u5b9a\uff09\u3002\n3.  **\u5224\u5b9a\u6811\u5339\u914d**\uff1a\n    *   \u52a8\u673a\u7eaf\u5ea6\u22655\u5206\uff0c\u8fdb\u5165\u201c\u4e2d\u9ad8\u52a8\u673a\u7cbe\u5206\u201d\u5c42\u3002\n    *   \u5fc3\u7406\u5f39\u60275-6\u5206\uff0c\u8fdb\u5165\u201c\u4e2d\u7b49\u5f39\u6027\u901a\u9053\u201d\u3002\n    *   \u5339\u914d\u5206\u652f\uff1a`IF \u52a8\u673a\u7eaf\u5ea6 \u2265 7 AND \u4f5c\u4e1a\u63d0\u4ea4\u7387 \u2265 80%:` \u2192 **\u5224\u5b9a\uff1aT2 \u4f4e\u8c03\u8001\u9ec4\u725b**\u3002\n    *   \u7528\u6237\u7b26\u5408\u6b64\u5206\u652f\uff1a\u52a8\u673a\u660e\u786e\uff0c\u4f5c\u4e1a\u5b8c\u6210\u53ca\u65f6\uff08\u65c1\u767d\u3001\u89d2\u8272\u97f3\u3001\u8ddf\u8bfb\u7ec3\u4e60\u5747\u6309\u65f6\u63d0\u4ea4\uff09\uff0c\u5b66\u4e60\u72b6\u6001\u7a33\u5b9a\u3002\n    *   **\u6301\u7eed\u76d1\u63a7**\uff1a\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6307\u4ee4\u7684\u9ad8\u5ea6\u670d\u4ece\u548c\u6267\u884c\u529b\uff0c\u662f\u5178\u578b\u7684T2\u7279\u5f81\u3002\u9700\u89c2\u5bdf\u540e\u7eed\u662f\u5426\u51fa\u73b0\u4e3b\u52a8\u5e2e\u52a9\u4ed6\u4eba\u3001\u7edf\u7b79\u4e8b\u52a1\u7b49\u884c\u4e3a\uff0c\u4ee5\u5224\u65ad\u662f\u5426\u5411**\u6df7\u5408\u4f533\u53f7\uff08\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b\uff09** \u8fdb\u5316\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u76ee\u524d\u65e0\u4fe1\u606f\uff0c\u4f46\u9700\u5728\u540e\u7eed\u670d\u52a1\u4e2d\u786e\u8ba4\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4e2d | \u5982\u679c\u6b63\u5f0f\u5f00\u8bfe\u540e\u8bfe\u4e1a\u538b\u529b\u7a81\u7136\u589e\u5927\uff0c\u6216\u7528\u6237\u4e2a\u4eba\u65f6\u95f4\u51fa\u73b0\u53d8\u6545\uff08\u5982\u52a0\u73ed\u3001\u5bb6\u5ead\u4e8b\u52a1\uff09\uff0c\u53ef\u80fd\u5bfc\u81f4\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\u800c\u4ea7\u751f\u7126\u8651\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u76ee\u524d\u8868\u73b0\u7a33\u5b9a\uff0c\u4f46\u9700\u9632\u8303\u5728\u7b2c\u4e00\u6b21\u8bd5\u97f3\u5931\u8d25\u6216\u6536\u5230\u4e25\u5389\u6279\u8bc4\u65f6\u5fc3\u6001\u6ce2\u52a8\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | **\u8fd9\u662f\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u7528\u6237\u52a8\u673a\u7eaf\u5ea6\u9ad8\uff0c\u5bf9\u201c\u5165\u884c\u201d\u3001\u201c\u63a5\u5355\u201d\u6709\u671f\u5f85\u3002\u82e5\u5728\u627f\u8bfa\u671f\u5185\uff08\u5982\u9500\u552e\u6697\u793a\u7684\u201c\u5b66\u4e60\u671f\u95f4\u201d\uff09\u672a\u83b7\u5f97\u4efb\u4f55\u5b9e\u8d28\u6027\u7684\u63a5\u5355\u673a\u4f1a\u6216\u6b63\u5411\u53cd\u9988\uff0c\u53ef\u80fd\u4ea7\u751f\u201c\u88ab\u9a97\u201d\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e1-2\u4e2a\u6708**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u82e5\u6280\u80fd\u63d0\u5347\u7f13\u6162\u4e14\u672a\u89c1\u53d8\u73b0\u66d9\u5149\uff0c\u5bb9\u6613\u4ea7\u751f\u6000\u7591\u548c\u653e\u5f03\u5ff5\u5934\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u661f\u661f\u4f60\u597d\uff0c\u6211\u662f\u4f60\u7684\u73ed\u4e3b\u4efbXX\u3002\u5e08\u59d0\uff08\u9500\u552e\uff09\u7279\u610f\u8ddf\u6211\u4ea4\u4ee3\u4e86\uff0c\u8bf4\u4f60\u5b66\u4e60\u7279\u522b\u8ba4\u771f\uff0c\u4f5c\u4e1a\u5b8c\u6210\u5f97\u53c8\u5feb\u53c8\u597d\uff0c\u662f\u54b1\u4eec\u8fd9\u6279\u5b66\u5458\u91cc\u6700\u8e0f\u5b9e\u7684\u82d7\u5b50\u3002\u63a5\u4e0b\u6765\u56db\u4e2a\u6708\uff0c\u6211\u4f1a\u50cf\u5e08\u59d0\u4e00\u6837\u966a\u7740\u4f60\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u628a\u57fa\u7840\u6253\u7262\u3002\u6709\u4efb\u4f55\u95ee\u9898\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u89e3\u51b3\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011\u3002\u5339\u914d\u5176T2\u7279\u8d28\uff0c\u63d0\u4f9b\u624e\u5b9e\u7684\u6280\u80fd\u8bad\u7ec3\u548c\u6e05\u6670\u7684\u8fdb\u9636\u8def\u5f84\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n    1.  **\u3010\u7cbe\u51c6\u6d3e\u5355\u4e0e\u53cd\u9988\u5305 (B\u6a21\u5757)\u3011**\uff1a\u5c3d\u65e9\uff08\u5728\u5b66\u4e60\u4e2d\u671f\uff09\u63d0\u4f9b\u771f\u5b9e\u3001\u5339\u914d\u5176\u80fd\u529b\u7684\u8bd5\u97f3\u673a\u4f1a\uff0c\u5e76\u7ed9\u4e88\u8be6\u7ec6\u3001\u5efa\u8bbe\u6027\u7684\u53cd\u9988\u3002\u5373\u4f7f\u4e0d\u4e2d\uff0c\u4e5f\u8981\u8bf4\u660e\u539f\u56e0\u548c\u63d0\u5347\u65b9\u5411\uff0c\u6ee1\u8db3\u5176\u201c\u88ab\u5e26\u9886\u201d\u548c\u201c\u770b\u5f97\u5230\u8fdb\u6b65\u201d\u7684\u9700\u6c42\u3002\n    2.  **\u3010\u8f7b\u5ea6\u8ba4\u53ef\u4e0e\u5f52\u5c5e\u611f\u5305 (C\u6a21\u5757)\u3011**\uff1a\u5728\u7fa4\u5185\u516c\u5f00\u8868\u626c\u5176\u4f5c\u4e1a\u5b8c\u6210\u5ea6\u548c\u8fdb\u6b65\uff0c\u8d4b\u4e88\u5176\u201c\u4f18\u79c0\u5b66\u5458\u699c\u6837\u201d\u7684\u8f7b\u5fae\u8eab\u4efd\u8ba4\u540c\u3002\u53ef\u9080\u8bf7\u5176\u5206\u4eab\u5b66\u4e60\u5fc3\u5f97\uff0c\u6ee1\u8db3\u5176\u5c0a\u91cd\u9700\u6c42\u3002\n    3.  **\u3010\u89c2\u5bdf\u4e0e\u6743\u9650\u8bd5\u63a2\u5305 (D\u6a21\u5757)\u3011**\uff1a\u89c2\u5bdf\u5176\u662f\u5426\u6709\u5e2e\u52a9\u540c\u5b66\u7684\u610f\u613f\u3002\u53ef\u5728\u5b66\u4e60\u4e2d\u540e\u671f\uff0c\u8bd5\u63a2\u6027\u8d4b\u4e88\u5176\u5c0f\u7ec4\u957f\u3001\u4f5c\u4e1a\u7edf\u8ba1\u5458\u7b49\u8f7b\u5ea6\u7ba1\u7406\u804c\u8d23\uff0c\u6d4b\u8bd5\u5176\u662f\u5426\u5177\u5907\u5411**\u6df7\u5408\u4f533\u53f7\uff08\u6743\u9650\u89c9\u9192\uff09** \u8fdb\u5316\u7684\u6f5c\u529b\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1.  \u753b\u4e0d\u5207\u5b9e\u9645\u7684\u5927\u997c\uff08\u5982\u201c\u5b66\u5b8c\u7acb\u523b\u6708\u5165\u8fc7\u4e07\u201d\uff09\u3002\n    2.  \u5728\u5176\u672a\u4e3b\u52a8\u6c42\u52a9\u65f6\uff0c\u8fc7\u5ea6\u4f7f\u7528\u201c\u60c5\u7eea\u5de8\u5a74\u201d\u5f0f\u7684\u5b89\u629a\uff08\u6ee1\u914dC\u6a21\u5757\uff09\uff0c\u8fd9\u4f1a\u8ba9\u52a1\u5b9e\u7684T2\u611f\u5230\u4e0d\u9002\u3002\n    3.  \u5ffd\u89c6\u5176\u652f\u4ed8\u65b9\u5f0f\u3002**\u5fc5\u987b\u7b2c\u4e00\u65f6\u95f4\u79c1\u804a\u6478\u5e95**\uff0c\u786e\u8ba4\u662f\u5426\u4e3a\u5065\u5eb7\u652f\u4ed8\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u9700\u5efa\u7acb\u5728\u624e\u5b9e\u7684\u5b66\u4e60\u6210\u679c\u548c\u4fe1\u4efb\u57fa\u7840\u4e0a**\u3002\u5f53\u5176\u6280\u80fd\u6709\u660e\u663e\u63d0\u5347\u5e76\u4ea7\u751f\u81ea\u4fe1\u540e\uff0c\u53ef\u987a\u52bf\u63a8\u8350\u9ad8\u9636\u8bbe\u5907\u3001\u540e\u671f\u8bfe\u7a0b\u6216\u79c1\u6559\u670d\u52a1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5e08\u59d0\u597d\uff0c\u76f4\u64ad\u8bfe\u6536\u83b7\u5f88\u591a\uff0c\u5bf9\u8fd9\u4e2a\u884c\u4e1a\u6709\u4e86\u70b9\u521d\u6b65\u7684\u4e86\u89e3\uff0c\u6211\u60f3\u5728\u8fd9\u4e2a\u884c\u4e1a\u52aa\u529b\u5b66\u4e60\u4e00\u4e0b\u3002\u201d **(\u52a8\u673a\u7eaf\u5ea6\u8bc1\u660e)**\n2. > \u201c\u5e08\u59d0\uff0c\u4e0b\u9762\u662f\u6211\u8ddf\u8bfb\u7684\u7ae5\u8bdd\u6545\u4e8b\uff0c\u624b\u673a\u5f55\u97f3\u673a\u5f55\u7684\u3002\u201d **(\u6267\u884c\u529b\u4e0e\u670d\u4ece\u6027\u8bc1\u660e)**\n3. > \u201c\u597d\u7684\uff0c\u8c22\u8c22\u8001\u5e08\u7684\u7ec6\u81f4\u70b9\u8bc4\uff0c\u63a5\u4e0b\u6765\u6211\u4f1a\u8ddf\u7740\u8001\u5e08\u597d\u597d\u52aa\u529b\u5b66\u4e60\u7684[\u7231\u5fc3]\u201d **(\u5c0a\u91cd\u9700\u6c42\u4e0e\u6b63\u5411\u53cd\u9988\u4f9d\u8d56\u8bc1\u660e)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u88ab\u8ba4\u53ef\u3001\u88ab\u6e05\u6670\u5e26\u9886\u7684\u5f52\u5c5e\u4e0e\u5c0a\u91cd\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u4e3b\u8981\u98ce\u9669\u5728\u4e8e **\u3010\u6536\u76ca\u671f\u5f85\u843d\u7a7a\u3011**\u3002\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6e05\u6670\u7684\u8fdb\u9636\u8def\u5f84\u3001\u53ca\u65f6\u7684\u5b9e\u64cd\u53cd\u9988\uff0c\u5e76\u8c28\u614e\u8bd5\u63a2\u5176\u9886\u5bfc\u6f5c\u529b\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u793e\u4ea4\u4e0e\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u7cbe\u51c6\u6d3e\u5355\u53cd\u9988\u5305 + \u8f7b\u5ea6\u8ba4\u53ef\u5305\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
