    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n> **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4e3a\u77ed\u671f\u5f15\u6d41\u8f6c\u5316\u8fc7\u7a0b\uff0c\u4e25\u91cd\u7f3a\u5931\u7528\u6237\u4e2a\u4eba\u80cc\u666f\u3001\u5bb6\u5ead\u72b6\u51b5\u3001\u652f\u4ed8\u80fd\u529b\u3001\u65f6\u95f4\u5b89\u6392\u7b49\u5173\u952e\u4fe1\u606f\uff0c\u65e0\u6cd5\u8fdb\u884c\u5b8c\u6574\u7684ABCD\u5224\u5b9a\u6811\uff08\u6b65\u9aa40\u652f\u4ed8\u6838\u67e5\u3001\u6b65\u9aa41.5\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5\uff09\u53ca\u8d44\u6e90\u5e95\u5ea7\u6df1\u5ea6\u8bc4\u4f30\u3002\u4ee5\u4e0b\u5206\u6790\u57fa\u4e8e\u6709\u9650\u7684\u884c\u4e3a\u548c\u60c5\u7eea\u4fe1\u53f7\u3002\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677174400 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u8d1d\u8d1d(\u5218\u4f73\u7a57) -> \u516d\u6708\u6668\u516e(\u9648\u5a1c) -> \u53ef\u4e3d\u513f(\u5b54\u4ee4\u5a77) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6500\u767b\u8ba1\u5212\u7cfb\u7edf\u8bfe (\u4ef7\u683c\u672a\u660e\u786e\u63d0\u53ca\uff0c\u4f46\u7528\u6237\u63d0\u53ca\u201c2380\u201d\u3001\u201c\u4e24\u4e2a\u6708\u7684\u201d) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | [\u4fe1\u606f\u7f3a\u5931] |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | [\u4fe1\u606f\u7f3a\u5931] (\u4ec5\u77e5\u4e3a\u201c\u673a\u5173\u4e8b\u4e1a\u5355\u4f4d\u201d\u5458\u5de5\uff0c\u767d\u5929\u9700\u4e0a\u73ed) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | [\u4fe1\u606f\u7f3a\u5931] |\n| **\u4fe1\u606f\u539a\u5ea6** | [\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09] |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u5bf9\u53d8\u73b0\u6e20\u9053\uff08\u201c\u8eab\u517c\u6570\u804c\u201d\u3001\u201c\u65f6\u85aa150\u201d\uff09\u8868\u73b0\u51fa\u5174\u8da3\uff0c\u4f46\u6838\u5fc3\u9a71\u52a8\u529b\u4e2d\u6df7\u6742\u4e86\u5bf9\u81ea\u6211\u58f0\u97f3\u6761\u4ef6\uff08\u201c\u58f0\u97f3\u4e0d\u597d\u542c\u201d\u3001\u201c\u9f3b\u97f3\u592a\u91cd\u201d\uff09\u7684\u5f3a\u70c8\u4e0d\u81ea\u4fe1\u548c\u5bfb\u6c42\u5916\u754c\u80af\u5b9a\u7684\u9700\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u58f0\u97f3\u4e0d\u597d\u542c\u201d\u3001\u201c\u9f3b\u97f3\u592a\u91cd\u611f\u89c9\u201d\u3001\u201c\u6211\u90fd28\u4e86\uff0c\u611f\u89c9\u58f0\u97f3\u50cf\u4e2a\u5b69\u5b50\u5462\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931\uff0c\u65e0\u6cd5\u8bc4\u7ea7]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 \u672a\u63d0\u53ca\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 \u4ec5\u77e5\u4e3a\u5728\u804c\u72b6\u6001\uff0c\u5177\u4f53\u53ef\u652f\u914d\u65f6\u95f4\u672a\u77e5\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b07\u4f4e\u6781\u5371]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56\u3002\u7528\u6237\u5728\u5b66\u4e60\u521d\u671f\u5373\u53cd\u590d\u8868\u8fbe\u5bf9\u81ea\u8eab\u58f0\u97f3\u6761\u4ef6\u7684\u8d1f\u9762\u8bc4\u4ef7\uff0c\u8868\u73b0\u51fa**\u5f3a\u70c8\u7684\u81ea\u6211\u5426\u5b9a\u548c\u4f4e\u81ea\u5c0a**\u3002\u9762\u5bf9\u8bd5\u97f3\u4efb\u52a1\uff08\u201c\u8001\u662f\u8bfb\u9519\u5462\u201d\uff09\u65f6\uff0c\u7528\u201c[\u88c2\u5f00]\u201d\u8868\u60c5\u8868\u8fbe\u632b\u8d25\u611f\u3002\u5176\u5b66\u4e60\u52a8\u529b\u9ad8\u5ea6\u4f9d\u8d56\u9500\u552e\uff08\u201c\u5e08\u59d0\u201d\uff09\u7684\u5373\u65f6\u9f13\u52b1\u548c\u80af\u5b9a\uff08\u201c\u4f60\u8fdb\u6b65\u8fd8\u633a\u660e\u663e\u7684\uff0c\u8ba9\u6211\u5c0f\u60ca\u559c\u4e86\u4e00\u628a\u201d\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u58f0\u97f3\u4e0d\u597d\u542c\u201d\u3001\u201c\u9f3b\u97f3\u592a\u91cd\u611f\u89c9\u201d\u3001\u201c\u6211\u90fd28\u4e86\uff0c\u611f\u89c9\u58f0\u97f3\u50cf\u4e2a\u5b69\u5b50\u5462\u201d\u3001\u201c\u8001\u662f\u8bfb\u9519\u5462[\u88c2\u5f00]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u4e0e\u5f52\u5c5e\u9700\u6c42 / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u81ea\u8eab\u58f0\u97f3\u548c\u5e74\u9f84\uff0828\u5c81\uff09\u7684\u6df1\u5ea6\u81ea\u5351\u4e0e\u4e0d\u63a5\u7eb3\uff0c\u6e34\u671b\u901a\u8fc7\u5916\u90e8\u8ba4\u53ef\uff08\u9500\u552e/\u8001\u5e08\u7684\u5938\u5956\u3001\u8fdb\u5165\u201c\u4e8c\u8f6e\u8003\u6838\u7fa4\u201d\u3001\u83b7\u5f97\u201c\u7248\u6743\u4e66\u201d\uff09\u6765\u8bc1\u660e\u81ea\u5df1\u7684\u4ef7\u503c\uff0c\u83b7\u5f97\u5f52\u5c5e\u611f\u548c\u5c0a\u91cd\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6301\u7eed\u3001\u5177\u4f53\u3001\u9ad8\u9891\u7684\u79ef\u6781\u53cd\u9988\u4e0e\u60c5\u611f\u652f\u6301**\uff0c\u5145\u5f53\u5176\u201c\u5fc3\u7406\u6559\u7ec3\u201d\u548c\u201c\u5938\u5938\u56e2\u201d\uff0c\u5e2e\u52a9\u5176\u5efa\u7acb\u81ea\u4fe1\uff0c\u62b5\u5fa1\u56e0\u81ea\u6211\u6000\u7591\u800c\u4ea7\u751f\u7684\u9000\u7f29\u60c5\u7eea\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **[\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u5b9a]** (\u56e0\u7f3a\u5931\u652f\u4ed8\u3001\u5bb6\u5ead\u7b49\u5173\u952e\u4fe1\u606f\uff0c\u65e0\u6cd5\u6267\u884c\u5b8c\u6574\u5224\u5b9a\u6811) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **[T6 \u60c5\u7eea\u5de8\u5a74\u578b]** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1] (\u57fa\u4e8e\u73b0\u6709\u4fe1\u606f\uff0c\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u7b49\u7ea2\u7ebf)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a/\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | [\u4fe1\u606f\u7f3a\u5931] | [\u4fe1\u606f\u7f3a\u5931] |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | [\u4e2d] | \u56e0\u673a\u5173\u4e8b\u4e1a\u5355\u4f4d\u5de5\u4f5c\u7e41\u5fd9\uff0c\u65e0\u6cd5\u8ddf\u4e0a\u76f4\u64ad\u6216\u4f5c\u4e1a\u8282\u594f\uff0c\u4ea7\u751f\u79ef\u538b\u548c\u7126\u8651\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **[\u9ad8]** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u6b63\u5f0f\u5f00\u8bfe\u540e\uff0c\u4e00\u65e6\u4f5c\u4e1a\u96be\u5ea6\u63d0\u5347\u6216\u8bd5\u97f3\u5931\u8d25\uff0c\u5176\u8106\u5f31\u7684\u81ea\u5c0a\u5fc3\u6781\u6613\u53d7\u632b\uff0c\u4ea7\u751f\u201c\u6211\u4e0d\u884c\u201d\u3001\u201c\u88ab\u9a97\u4e86\u201d\u7684\u6781\u7aef\u60c5\u7eea\uff0c\u8fdb\u800c\u8981\u6c42\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | [\u4e2d] | \u5bf9\u201c\u65f6\u85aa150\u201d\u7b49\u5ba3\u4f20\u62b1\u6709\u671f\u5f85\uff0c\u82e5\u77ed\u671f\u5185\u65e0\u6cd5\u83b7\u5f97\u5b9e\u9645\u6536\u76ca\u6216\u63a5\u5355\u53d7\u632b\uff0c\u4f1a\u4ea7\u751f\u5f3a\u70c8\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c1-2\u5468\uff0c\u9996\u6b21\u63d0\u4ea4\u6709\u96be\u5ea6\u7684\u89d2\u8272\u97f3\u4f5c\u4e1a\u6216\u9996\u6b21\u8bd5\u97f3\u5931\u8d25\u540e**\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4eb2\u7231\u7684\uff0c\u6211\u770b\u4e86\u4f60\u8bad\u7ec3\u8425\u7684\u5f55\u97f3\uff0c\u4f60\u7684\u58f0\u97f3\u5176\u5b9e\u5f88\u6709\u7279\u8272\uff0c\u5e26\u70b9\u2018\u5c11\u5e74\u611f\u2019\u5728\u6709\u4e9b\u89d2\u8272\u91cc\u662f\u7a00\u7f3a\u4f18\u52bf\uff01\u54b1\u4eec\u4e0d\u8ddf\u522b\u4eba\u6bd4\uff0c\u5c31\u8ddf\u6628\u5929\u7684\u81ea\u5df1\u6bd4\u3002\u63a5\u4e0b\u6765\u7684\u5b66\u4e60\uff0c\u6211\u4f1a\u4e00\u76f4\u966a\u7740\u4f60\uff0c\u6709\u4efb\u4f55\u5361\u70b9\u3001\u4efb\u4f55\u81ea\u6211\u6000\u7591\uff0c\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u62c6\u89e3\u3002\u8bb0\u4f4f\uff0c\u5728\u8fd9\u91cc\uff0c\u8fdb\u6b65\u6bd4\u5b8c\u7f8e\u91cd\u8981\u4e00\u4e07\u500d\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf**\u3011\u3002\u4e3b\u7ebf\u4efb\u52a1\u662f\u5efa\u7acb\u81ea\u4fe1\u548c\u5b8c\u6210\u611f\uff0c\u800c\u975e\u5f3a\u538b\u63a5\u5355\u7ed3\u679c\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n    1.  **\u3010\u9ad8\u9891\u5fae\u6b63\u53cd\u9988\u5305\u3011**\uff1a\u4f5c\u4e1a\u70b9\u8bc4\u5fc5\u987b\u5177\u4f53\u5230\u7ec6\u8282\u5938\u5956\uff08\u5982\u201c\u8fd9\u53e5\u7684\u505c\u987f\u5f88\u6709\u5473\u9053\u201d\uff09\uff0c\u5e76\u5b9a\u671f\uff08\u5982\u6bcf3\u5929\uff09\u7ed9\u4e88\u201c\u8fdb\u6b65\u91cc\u7a0b\u7891\u201d\u5f0f\u9f13\u52b1\u3002\n    2.  **\u3010\u4f4e\u538b\u529b\u8bd5\u6c34\u5305\u3011**\uff1a\u521d\u671f\u53ea\u63d0\u4f9b\u6781\u7b80\u5355\u3001\u65e0\u7ade\u4e89\u7684\u201c\u4f53\u9a8c\u5355\u201d\uff0c\u8ba9\u5176\u5148\u83b7\u5f97\u201c\u6211\u5b8c\u6210\u4e86\u201d\u7684\u6210\u5c31\u611f\uff0c\u800c\u975e\u201c\u6211\u5931\u8d25\u4e86\u201d\u7684\u632b\u8d25\u611f\u3002\n    3.  **\u3010\u540c\u9891\u793e\u7fa4\u94fe\u63a5\u5305\u3011**\uff1a\u5c06\u5176\u5f15\u5165\u7531\u540c\u6837\u4e0d\u81ea\u4fe1\u4f46\u6e29\u548c\u7684\u5b66\u5458\u7ec4\u6210\u7684\u5c0f\u7ec4\uff0c\u63d0\u4f9b\u5b89\u5168\u7684\u793e\u4ea4\u5f52\u5c5e\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1.  \u7edd\u4e0d\u5728\u516c\u5f00\u573a\u5408\u6216\u7fa4\u5185\u6279\u8bc4\u5176\u4f5c\u4e1a\uff0c\u6240\u6709\u6307\u5bfc\u5fc5\u987b\u79c1\u804a\u4e14\u5148\u626c\u540e\u6291\u3002\n    2.  \u7edd\u4e0d\u5c06\u5176\u4e0e\u8fdb\u6b65\u5feb\u3001\u58f0\u97f3\u6761\u4ef6\u597d\u7684\u5b66\u5458\u505a\u5bf9\u6bd4\u3002\n    3.  \u7edd\u4e0d\u5728\u5176\u60c5\u7eea\u4f4e\u843d\u65f6\u50ac\u4fc3\u4f5c\u4e1a\u6216\u63a8\u9500\u5347\u5355\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5f62\u5f0f\u7684\u5347\u5355**\u3002\u5728\u5efa\u7acb\u7a33\u56fa\u81ea\u4fe1\u548c\u5b8c\u6210\u81f3\u5c11\u4e00\u4e2a\u6b63\u5faa\u73af\uff08\u5b66\u4e60-\u5fae\u6210\u529f-\u83b7\u5f97\u8ba4\u53ef\uff09\u4e4b\u524d\uff0c\u4efb\u4f55\u4ed8\u8d39\u52a8\u4f5c\u90fd\u53ef\u80fd\u89e6\u53d1\u5176\u201c\u88ab\u5272\u97ed\u83dc\u201d\u7684\u9632\u5fa1\u5fc3\u7406\uff0c\u5bfc\u81f4\u5d29\u76d8\u9000\u8d39\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u58f0\u97f3\u4e0d\u597d\u542c\u201d\n2. > \u201c\u9f3b\u97f3\u592a\u91cd\u611f\u89c9\u201d\n3. > \u201c\u6211\u90fd28\u4e86\uff0c\u611f\u89c9\u58f0\u97f3\u50cf\u4e2a\u5b69\u5b50\u5462\u201d\n4. > \u201c\u8001\u662f\u8bfb\u9519\u5462[\u88c2\u5f00]\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **[T6\u60c5\u7eea\u5de8\u5a74\u578b]**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **[\u83b7\u5f97\u5c0a\u91cd\u4e0e\u5f52\u5c5e\u611f\uff0c\u6cbb\u6108\u58f0\u97f3\u81ea\u5351]**\u3002\u9000\u5355\u51e0\u7387\u4e3a **[\u9ad8]**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **[\u63d0\u4f9b\u6781\u81f4\u7684\u60c5\u611f\u652f\u6301\u4e0e\u9ad8\u9891\u6b63\u53cd\u9988\uff0c\u4e25\u7981\u65bd\u52a0\u538b\u529b\u548c\u63a8\u9500]**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u5f52\u5c5e\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
