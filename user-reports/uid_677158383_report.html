9669\u6781\u5ea6\u654f\u611f\uff0c\u9700\u8981\u5916\u90e8\u5f3a\u70c8\u5b89\u629a\u548c\u4fdd\u8bc1\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08\uff0c\u4e0d\u8981\u7b11\u6211\u554a\uff0c\u6211\u81ea\u5df1\u90fd\u60f3\u7b11\uff0c\u5f55\u7740\u4e0d\u597d[\u6342\u8138]\u201d > \u201c\u8fd8\u597d\u8001\u5e08\uff0c\u6ca1\u6709\u8fbe\u5230\u81ea\u5df1\u7684\u9884\u671f\u201d > \u201c\u5e08\u59d0\uff0c\u600e\u4e48\u4fdd\u8bc1\u53ef\u4ee5\u9000\u6b3e\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u672a\u6765\u7684**\u7ecf\u6d4e\u5b89\u5168**\u548c**\u4e2a\u4eba\u4ef7\u503c\u5b9e\u73b0**\u611f\u5230\u7126\u8651\uff0c\u5bb3\u6015\u88ab\u793e\u4f1a\u6dd8\u6c70\uff08\u201c\u73b0\u5728\u793e\u4f1a\u5404\u884c\u53d1\u5c55\u592a\u5377\u4e86\u201d\uff09\uff0c\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u65b0\u6280\u80fd\u83b7\u5f97\u4e00\u4efd\u786e\u5b9a\u7684\u3001\u6709\u5c0a\u4e25\u7684\u6536\u5165\u4fdd\u969c\uff0c\u4ee5\u5bf9\u6297\u4e0d\u786e\u5b9a\u6027\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u7684\u627f\u8bfa\u4e0e\u5b89\u5168\u611f**\u3002\u9700\u8981\u53cd\u590d\u3001\u5177\u4f53\u5730\u8bc1\u660e\u201c\u8fd9\u6761\u8def\u53ef\u884c\u201d\u3001\u201c\u4f60\u80fd\u5b66\u4f1a\u201d\u3001\u201c\u94b1\u80fd\u8d5a\u5230\u201d\uff0c\u5e76\u63d0\u4f9b\u660e\u786e\u7684\u3001\u4f4e\u98ce\u9669\u7684\u8def\u5f84\uff08\u59827\u5929\u9000\u6b3e\u3001\u7248\u6743\u4e66\u4fdd\u969c\uff09\u6765\u6d88\u9664\u5176\u4e0d\u5b89\u5168\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | [\ud83d\udfeaC1] \u7c7b (\u9ad8\u610f\u5411\u4f46\u6709\u660e\u663e\u987e\u8651\u7684\u8c28\u614e\u578b\u7528\u6237) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | [T6 \u60c5\u7eea\u5de8\u5a74] (\u9ad8\u654f\u611f\u3001\u4f4e\u81ea\u4fe1\u3001\u9700\u5f3a\u60c5\u7eea\u5b89\u629a\u4e0e\u786e\u5b9a\u6027\u4fdd\u8bc1) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a[\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u7b49\u6781\u7aef\u60c5\u51b5\uff0c\u4f46\u9700\u8b66\u60d5\u5176\u56e0\u9884\u671f\u843d\u5dee\u5bfc\u81f4\u7684\u60c5\u7eea\u5d29\u6e83\u3002]\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | [\u4e2d] | [\u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u82e5\u652f\u4ed8\u672a\u4e0e\u5bb6\u4eba\u6c9f\u901a\uff0c\u98ce\u9669\u4e3a\u4e2d] |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | [\u9ad8] | [**\u4f5c\u4e1a\u96be\u5ea6\u9661\u589e\u6216\u521d\u671f\u8bd5\u97f3\u5931\u8d25\uff0c\u5bfc\u81f4\u5176\u201c\u672a\u8fbe\u9884\u671f\u201d\u7684\u632b\u8d25\u611f\u7206\u53d1**] |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | [\u6781\u9ad8] | [**\u6838\u5fc3\u98ce\u9669**\uff1a\u8f6f\u4ef6\u5b89\u88c5\u95ee\u9898\u3001\u4f5c\u4e1a\u88ab\u6279\u8bc4\u3001\u63a5\u5355\u4e0d\u987a\u5229\u7b49\u4efb\u4f55\u5fae\u5c0f\u632b\u6298\u90fd\u53ef\u80fd\u89e6\u53d1\u5176\u201c\u6211\u4e0d\u884c\u201d\u3001\u201c\u88ab\u9a97\u4e86\u201d\u7684\u8d1f\u9762\u60c5\u7eea\u5faa\u73af\u3002] |\n| \u6536\u76ca\u843d\u5dee\u578b | [\u9ad8] | [\u5b66\u4e601-2\u5468\u540e\uff0c\u53d1\u73b0\u8d5a\u94b1\u5e76\u975e\u5ba3\u4f20\u822c\u5bb9\u6613\u5feb\u901f\uff0c\u6216\u5bf9\u7248\u6743\u4e66\u6536\u76ca\u6a21\u5f0f\u5931\u671b\u3002] |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a[**\u5f00\u8bfe\u540e\u7b2c3-7\u5929**]\uff1a\u9996\u6b21\u6b63\u5f0f\u4f5c\u4e1a\u63d0\u4ea4\u540e\u6536\u5230\u975e\u6ee1\u5206\u8bc4\u4ef7\u65f6\uff1b\u6216\u9996\u6b21\u5c1d\u8bd5\u63a5\u5355/\u4f7f\u7528\u7248\u6743\u4e66\u53d7\u632b\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u742a\u742a\u5988\u5988\u4f60\u597d\u5440\uff01\u6211\u662f\u4f60\u7684\u73ed\u4e3b\u4efb\u9065\u8fdc\u3002\u770b\u5230\u4f60\u7ed9\u81ea\u5df1\u5b9a\u7684\u2018\u6bcf\u67083000\u2019\u76ee\u6807\uff0c\u611f\u89c9\u4f60\u662f\u4e2a\u7279\u522b\u52a1\u5b9e\u3001\u5bf9\u81ea\u5df1\u6709\u8981\u6c42\u7684\u4eba\u3002\u54b1\u4eec\u4e0d\u7740\u6025\uff0c\u7b2c\u4e00\u6b65\u4e0d\u662f\u2018\u8d5a\u5230\u94b1\u2019\uff0c\u800c\u662f\u2018\u7a33\u7a33\u5730\u8d70\u597d\u2019\u3002\u6211\u5df2\u7ecf\u628a\u4f60\u7684\u5b66\u4e60\u8def\u5f84\u89c4\u5212\u597d\u4e86\uff0c**\u524d\u4e24\u5468\u54b1\u4eec\u5c31\u4e13\u5fc3\u6253\u597d\u57fa\u7840\uff0c\u50cf\u642d\u79ef\u6728\u4e00\u6837\uff0c\u4e00\u5757\u4e00\u5757\u6765\uff0c\u6709\u4efb\u4f55\u4e00\u70b9\u5361\u4f4f\u6216\u8005\u89c9\u5f97\u2018\u6211\u600e\u4e48\u8fd9\u4e48\u7b28\u2019\u7684\u65f6\u5019\uff0c\u968f\u65f6\u558a\u6211\uff0c\u6211\u79d2\u56de\u3002\u54b1\u4eec\u7684\u76ee\u6807\u4e0d\u662f\u2018\u4e0d\u72af\u9519\u2019\uff0c\u800c\u662f\u2018\u6bcf\u9519\u4e00\u6b21\u5c31\u5f3a\u5927\u4e00\u70b9\u2019\uff0c\u6211\u966a\u4f60\u4e00\u8d77\u3002\u201d**\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a[ **\u3010\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\u3011** ]\uff1a\u6838\u5fc3\u662f\u5efa\u7acb\u5b89\u5168\u611f\u548c\u5fae\u5c0f\u6b63\u53cd\u9988\u5faa\u73af\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a[ **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011** (\u5fc5\u9009)\uff1a1v1\u9ad8\u9891\u60c5\u7eea\u5b89\u629a\uff1b**\u3010\u6781\u7b80\u4efb\u52a1\u62c6\u89e3\u5305\u3011**\uff1a\u5c06\u5927\u4efb\u52a1\u62c6\u89e3\u4e3a\u201c5\u5206\u949f\u53ef\u5b8c\u6210\u201d\u7684\u5fae\u6b65\u9aa4\uff1b**\u3010\u65e9\u671f\u6210\u5c31\u5fbd\u7ae0\u5305\u3011**\uff1a\u5b8c\u6210\u7b80\u5355\u4efb\u52a1\u5373\u7ed9\u4e88\u53ef\u89c6\u5316\u5956\u52b1\u3002]\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a[1. \u7edd\u4e0d\u5bf9\u5176\u4f7f\u7528\u4efb\u4f55\u5426\u5b9a\u6216\u6bd4\u8f83\u6027\u8bed\u8a00\uff08\u5982\u201c\u522b\u4eba\u90fd\u884c\u4f60\u600e\u4e48\u4e0d\u884c\u201d\uff09\u30022. \u7edd\u4e0d\u4e00\u6b21\u6027\u5e03\u7f6e\u9ad8\u96be\u5ea6\u4f5c\u4e1a\u30023. \u7edd\u4e0d\u5728\u521d\u671f\u8fc7\u5ea6\u6e32\u67d3\u201c\u5feb\u901f\u66b4\u5bcc\u201d\u6848\u4f8b\uff0c\u5e94\u5f3a\u8c03\u201c\u7a33\u6b65\u589e\u957f\u201d\u3002]\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a[**\u4e25\u7981\u5347\u5355**]\uff1a\u5728\u5b8c\u6210\u9996\u9636\u6bb5\u5b66\u4e60\u5e76\u83b7\u5f97\u7a33\u5b9a\u6b63\u53cd\u9988\u524d\uff0c\u7981\u6b62\u4efb\u4f55\u5f62\u5f0f\u7684\u5347\u5355\u6216\u9644\u52a0\u4ea7\u54c1\u63a8\u8350\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5e08\u59d0\uff0c\u8bf4\u771f\u8bdd\uff0c\u6211\u6015\u4f60\u4eec\u662f\u9a97\u5b50[\u6342\u8138][\u6342\u8138]\u201d\n2. > \u201c\u8001\u5e08\uff0c\u4e0d\u8981\u7b11\u6211\u554a\uff0c\u6211\u81ea\u5df1\u90fd\u60f3\u7b11\uff0c\u5f55\u7740\u4e0d\u597d[\u6342\u8138]\u201d\n3. > \u201c\u6211\u611f\u89c9\u6bcf\u4e00\u4e2a\u4eba\u80fd\u6765\u5230\u4e16\u754c\u4e0a\uff0c\u5fc5\u7136\u5e26\u7740\u4f7f\u547d\u548c\u4ef7\u503c\u7684\uff01\u6240\u4ee5\u4e0d\u60f3\u8f9c\u8d1f\u5f80\u540e\u7684\u4eba\u751f\u751f\u6daf\u3002\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **[T6 \u60c5\u7eea\u5de8\u5a74]**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **[\u5bf9\u6297\u7126\u8651\uff0c\u83b7\u5f97\u7ecf\u6d4e\u4e0e\u4ef7\u503c\u7684\u53cc\u91cd\u5b89\u5168\u4fdd\u969c]**\u3002\u9000\u5355\u51e0\u7387\u4e3a **[\u6781\u9ad8]**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **[\u73ed\u4e3b\u4efb\u63d0\u4f9b\u9ad8\u9891\u3001\u5177\u4f53\u3001\u5145\u6ee1\u9f13\u52b1\u7684\u201c\u60c5\u7eea\u515c\u5e95\u201d\u670d\u52a1\uff0c\u5e76\u4e25\u683c\u63a7\u5236\u5b66\u4e60\u4efb\u52a1\u7684\u96be\u5ea6\u68af\u5ea6\uff0c\u786e\u4fdd\u65e9\u671f\u6210\u529f\u4f53\u9a8c]**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
