    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4f5c\u4e3a\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a676830287 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u4e3b\u64ad\u68a6\u5883(\u8fb9\u51e4\u946b) / \u5fa1\u7476\u59d0\u59d03(\u8fb9\u51e4\u946b) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u9ad8\u9636\u5b66\u4e60\u56db\u4e2a\u6708\u8bfe\u7a0b\uff087380\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u88ab\u8feb\u5206\u671f**\uff08\u7528\u6237\u4e3b\u52a8\u8be2\u95ee\u5206\u671f\u65b9\u5f0f\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u7528\u6237\u63d0\u53ca\u201c\u591c\u73ed\u8fd8\u6ca1\u4e0b\u73ed\u201d\uff0c\u8868\u660e\u5de5\u4f5c\u5236\u7279\u6b8a\uff0c\u65f6\u95f4\u4e0d\u81ea\u7531\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\uff08\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u7528\u6237\u6709\u660e\u786e\u4e92\u52a8\u3001\u4f5c\u4e1a\u63d0\u4ea4\u548c\u4ed8\u8d39\u610f\u5411\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34(\u4e2d)**\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5b66\u4e60\u548c\u63a5\u5355\u610f\u613f\uff08\u201c\u6211\u8981\u5f55\u4e66\u201d\uff09\uff0c\u5e76\u79ef\u6781\u5b8c\u6210\u4f5c\u4e1a\uff0c\u4f46\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u517c\u804c\u53d8\u73b0\uff08\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u517c\u804c\u201d\u3001\u201c\u591a\u52b3\u591a\u5f97\u201d\u3001\u201c\u6536\u76ca\u201d\uff09\uff0c\u672a\u89c1\u5bf9\u6280\u672f\u539f\u7406\u7684\u6df1\u5ea6\u8ffd\u95ee\u6216\u81ea\u6211\u5b9e\u73b0\u7684\u8868\u8fbe\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u8981\u5f55\u4e66\u201d\uff08\u76f4\u63a5\u8868\u8fbe\u63a5\u5355\u610f\u56fe\uff09\uff1b\u7528\u6237\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u5e76\u4e3b\u52a8\u63d0\u4ea4\uff0c\u4f46\u672a\u6df1\u5165\u63a2\u8ba8\u6280\u672f\u7ec6\u8282\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e (3-4\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u7528\u6237\u5bf97380\u5143\u8bfe\u7a0b\u4e3b\u52a8\u8be2\u95ee\u5206\u671f\u4ed8\u6b3e\uff0c\u8868\u660e\u4e00\u6b21\u6027\u652f\u4ed8\u5b58\u5728\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e** \u2014 \u7528\u6237\u660e\u786e\u8868\u793a\u201c\u591c\u73ed\u8fd8\u6ca1\u4e0b\u73ed\u201d\uff0c\u8868\u660e\u5de5\u4f5c\u5236\u7279\u6b8a\uff08\u53ef\u80fd\u662f\u4e09\u73ed\u5012\uff09\uff0c\u5b66\u4e60\u65f6\u95f4\u88ab\u4e25\u91cd\u6324\u538b\uff0c\u5c5e\u4e8e**\u65f6\u95f4\u6781\u901f\u67af\u7aed**\u578b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff0c\u65e0\u6cd5\u5224\u65ad\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a(\u4e2d)**\u3002\u7528\u6237\u80fd\u6309\u65f6\u5b8c\u6210\u4efb\u52a1\uff0c\u9762\u5bf9\u9500\u552e\u50ac\u4fc3\u65f6\u80fd\u5e73\u548c\u56de\u5e94\uff08\u201c\u6709\u7684\uff0c\u6709\u7684\uff0c\u8981\u665a\u4e00\u70b9\u70b9\u201d\uff09\uff0c\u672a\u8868\u73b0\u51fa\u5d29\u6e83\u6216\u6781\u5ea6\u4f9d\u8d56\u3002\u4f46\u5728\u9ad8\u5f3a\u5ea6\u9500\u552e\u5f15\u5bfc\u548c\u5bc6\u96c6\u4efb\u52a1\u4e0b\uff0c\u5176\u5fc3\u7406\u72b6\u6001\u5c1a\u5c5e\u7a33\u5b9a\uff0c\u672a\u89c1\u9ad8\u5f39\u6027\u7279\u8d28\uff08\u5982\u4e3b\u52a8\u7edf\u7b79\u3001\u6280\u672f\u94bb\u7814\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u7b2c\u4e00\u6b21\u6211\u81ea\u5df1\u4e0d\u6ee1\u610f\uff0c\u91cd\u5f55\u4e86\u4e00\u6b21\uff0c\u8bf7\u8001\u5e08\u6279\u8bc4\u6307\u6b63\uff01\u201d\uff08\u8868\u73b0\u51fa\u81ea\u6211\u8981\u6c42\u548c\u5bf9\u53cd\u9988\u7684\u63a5\u7eb3\uff0c\u672a\u56e0\u4e0d\u6ee1\u610f\u800c\u653e\u5f03\uff09\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 (Safety Needs)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u7ecf\u6d4e\u5b89\u5168\u4e0e\u804c\u4e1a\u4fdd\u969c\u7684\u7126\u8651**\u3002\u7528\u6237\u5904\u4e8e\u201c\u591c\u73ed\u201d\u5de5\u4f5c\u72b6\u6001\uff0c\u65f6\u95f4\u4e0d\u81ea\u7531\uff0c\u5e0c\u671b\u901a\u8fc7\u6709\u58f0\u4e66\u517c\u804c\u83b7\u5f97\u989d\u5916\u6536\u5165\uff0c\u6539\u5584\u7ecf\u6d4e\u72b6\u51b5\u6216\u5bfb\u6c42\u66f4\u7075\u6d3b\u7684\u804c\u4e1a\u53ef\u80fd\u3002\u5176\u6838\u5fc3\u75db\u70b9\u662f\u201c\u589e\u52a0\u6536\u5165\u6765\u6e90\u201d\u4ee5\u62b5\u5fa1\u98ce\u9669\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u4e0e\u8def\u5f84\u5b89\u5168\u611f**\u3002\u4e3a\u4ed6\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u6267\u884c\u7684\u517c\u804c\u53d8\u73b0\u8def\u5f84\u56fe\uff0c\u7528\u201c\u591a\u52b3\u591a\u5f97\u201d\u3001\u201c\u6709\u4e66\u53ef\u5f55\u201d\u7684\u786e\u5b9a\u6027\u627f\u8bfa\uff0c\u7f13\u89e3\u5176\u5bf9\u672a\u6765\u4e0d\u786e\u5b9a\u6027\u7684\u7126\u8651\u3002\u907f\u514d\u753b\u4e0d\u5207\u5b9e\u9645\u7684\u5927\u997c\uff0c\u5f3a\u8c03\u8e0f\u5b9e\u79ef\u7d2f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2 \u7c7b**\uff08\u98ce\u9669\u7ba1\u63a7\u578b\uff09 |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u8bba**\uff08\u53d8\u73b0\u9a71\u52a8\u578b\uff09 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u7528\u6237\u867d\u8be2\u95ee\u5206\u671f\uff0c\u4f46\u672a\u63d0\u53ca\u501f\u8d37\uff08\u5982\u82b1\u5457/\u501f\u5457\uff09\uff0c\u4e5f\u672a\u51fa\u73b0\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\uff0c\u6682\u672a\u89e6\u53caT8-D\u7ea2\u7ebf\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u82e5\u5206\u671f\u4ed8\u6b3e\u88ab\u5bb6\u4eba\u53d1\u73b0\u5e76\u53cd\u5bf9\uff0c\u53ef\u80fd\u5f15\u53d1\u7ea0\u7eb7\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u591c\u73ed\u5de5\u4f5c\u5236\u5bfc\u81f4\u65e0\u6cd5\u8ddf\u4e0a\u76f4\u64ad\u8bfe\u8282\u594f\uff0c\u4f5c\u4e1a\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u94b1\u82b1\u4e86\u5374\u6ca1\u65f6\u95f4\u5b66\u201d\u7684\u632b\u8d25\u611f\u548c\u81ea\u8d23\u60c5\u7eea\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u76ee\u524d\u8868\u73b0\u7a33\u5b9a\uff0c\u4f46\u82e5\u56e0\u65f6\u95f4\u95ee\u9898\u5bfc\u81f4\u4f5c\u4e1a\u9891\u7e41\u88ab\u50ac\u6216\u8d28\u91cf\u4e0d\u4f73\uff0c\u53ef\u80fd\u4ea7\u751f\u201c\u6211\u592a\u7b28/\u6ca1\u65f6\u95f4\u201d\u7684\u81ea\u6211\u6000\u7591\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u5bf9\u201c\u591a\u52b3\u591a\u5f97\u201d\u62b1\u6709\u671f\u5f85\uff0c\u4f46\u5982\u679c\u63a5\u5355\u4e0d\u987a\u6216\u521d\u671f\u6536\u76ca\u8fdc\u4f4e\u4e8e\u9884\u671f\uff08\u9500\u552e\u63d0\u53ca\u201c\u7b2c\u4e00\u672c\u4e66\u6536\u76ca\u6bd4\u8f83\u5c11\u201d\uff09\uff0c\u6781\u6613\u56e0\u201c\u88ab\u9a97\u201d\u611f\u800c\u66b4\u6012\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\u3002\u6b64\u65f6\u5b66\u4e60\u4efb\u52a1\u52a0\u91cd\uff0c\u591c\u73ed\u4e0e\u5b66\u4e60\u65f6\u95f4\u51b2\u7a81\u52a0\u5267\uff0c\u82e5\u540c\u65f6\u63a5\u5355\u5c1d\u8bd5\u53d7\u632b\u6216\u6536\u76ca\u4e0d\u4f73\uff0c\u9000\u8d39\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u770b\u5230\u4f60\u4e4b\u524d\u4e0a\u591c\u73ed\u8fd8\u575a\u6301\u5b66\u4e60\u4ea4\u4f5c\u4e1a\uff0c\u771f\u7684\u5f88\u4f69\u670d\u4f60\u7684\u6bc5\u529b\uff01\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u5f88\u591a\u5185\u5bb9\u6709\u56de\u653e\uff0c\u4f5c\u4e1a\u63d0\u4ea4\u65f6\u95f4\u4e5f\u76f8\u5bf9\u7075\u6d3b\uff0c\u5c31\u662f\u8003\u8651\u5230\u5927\u5bb6\u65f6\u95f4\u4e0d\u56fa\u5b9a\u3002\u4f60\u6309\u81ea\u5df1\u7684\u8282\u594f\u6765\uff0c\u91cd\u70b9\u662f\u5b66\u61c2\u3001\u7ec3\u4f1a\uff0c\u63a5\u5355\u8d5a\u94b1\u4e0d\u6025\u5728\u8fd9\u4e00\u65f6\uff0c\u628a\u57fa\u7840\u6253\u7262\u4e86\uff0c\u540e\u9762\u673a\u4f1a\u591a\u7684\u662f\u3002\u6709\u4efb\u4f55\u65f6\u95f4\u5b89\u6392\u4e0a\u7684\u56f0\u96be\uff0c\u968f\u65f6\u627e\u6211\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011**\u3002\u6838\u5fc3\u6ee1\u8db3\u5176\u5b89\u5168\u9700\u6c42\uff0c\u5feb\u901f\u5efa\u7acb\u201c\u5b66\u4e60-\u5b9e\u8df5-\u6536\u76ca\u201d\u7684\u6b63\u5411\u5faa\u73af\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\u7279\u70b9\uff0c\u5fc5\u987b\u8865\u5145**\u3010\u65f6\u95f4\u7ba1\u7406\u8f85\u52a9\u5305\u3011**\uff08\u5982\u63d0\u4f9b\u91cd\u70b9\u77e5\u8bc6\u5207\u7247\u3001\u5f55\u64ad\u8bfe\u7cbe\u534e\u6458\u8981\uff09\uff1b\u9488\u5bf9\u5176\u6536\u76ca\u7126\u8651\uff0c\u8865\u5145**\u3010\u7cbe\u786e\u6d3e\u5355\u62e6\u622aB\u6a21\u5757\u3011**\uff08\u4e25\u63a7\u9884\u671f\uff0c\u53ea\u63a8\u8350\u5339\u914d\u5176\u5f53\u524d\u6c34\u5e73\u3001\u6210\u529f\u7387\u9ad8\u7684\u8bd5\u97f3\u5355\uff0c\u907f\u514d\u76f2\u76ee\u5c1d\u8bd5\u6253\u51fb\u4fe1\u5fc3\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u7528\u201c\u5b66\u5b8c\u9a6c\u4e0a\u6708\u5165\u8fc7\u4e07\u201d\u7b49\u8bdd\u672f\u523a\u6fc0\u5176\u66b4\u5bcc\u5e7b\u60f3\uff1b2. \u56e0\u5176\u591c\u73ed\u9519\u8fc7\u76f4\u64ad\u6216\u63d0\u4ea4\u4f5c\u4e1a\u7a0d\u665a\u800c\u65bd\u52a0\u538b\u529b\uff1b3. \u5728\u5176\u672a\u6253\u597d\u57fa\u7840\u65f6\uff0c\u76f2\u76ee\u9f13\u52b1\u5176\u6311\u6218\u9ad8\u96be\u5ea6\u3001\u9ad8\u62a5\u916c\u7684\u5355\u5b50\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u7528\u6237\u901a\u8fc7\u73b0\u6709\u8bfe\u7a0b\u5b9e\u73b0\u7a33\u5b9a\u517c\u804c\u6536\u5165\u3001\u65f6\u95f4\u5b89\u6392\u66f4\u4ece\u5bb9\u4e4b\u524d\uff0c\u7981\u6b62\u4efb\u4f55\u4ea4\u53c9\u63a8\u9500\u6216\u5347\u5355\u884c\u4e3a\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > **\u201c\u6709\u7684\uff0c\u6709\u7684\uff0c\u8981\u665a\u4e00\u70b9\u70b9\uff0c\u591c\u73ed\u8fd8\u6ca1\u4e0b\u73ed\u201d** \u2014\u2014 **\u8d44\u6e90\u5e95\u5ea7\u77ed\u677f\uff08\u65f6\u95f4\uff09\u7684\u94c1\u8bc1**\u3002\n2. > **\u201c\u6211\u8981\u5f55\u4e66\u201d** \u2014\u2014 **\u52a8\u673a\u7eaf\u5ea6\uff08\u53d8\u73b0\u9a71\u52a8\uff09\u7684\u76f4\u63a5\u8868\u8fbe**\u3002\n3. > **\u201c\u6211\u60f3\u8981\u5206\u671f\uff0c\u600e\u4e48\u5206\u5440\uff1f\u201d** \u2014\u2014 **\u8d44\u6e90\u5e95\u5ea7\u77ed\u677f\uff08\u8d44\u91d1\uff09\u548cC2\u98ce\u9669\u7b49\u7ea7\u7684\u76f4\u63a5\u4fe1\u53f7**\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4 \u641e\u94b1\u7ed3\u679c\u8bba\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7ecf\u6d4e\u5b89\u5168\u4e0e\u804c\u4e1a\u4fdd\u969c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u7075\u6d3b\u5b66\u4e60\u8def\u5f84 + \u4e25\u63a7\u63a5\u5355\u9884\u671f + \u7edd\u5bf9\u7981\u6b62\u524d\u671f\u5347\u5355\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u8bba\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf\"}\n```";
