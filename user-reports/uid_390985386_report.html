    <script>
        const markdownText = "\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e\u3002\u7f3a\u4e4f\u7528\u6237\u804c\u4e1a\u3001\u5e74\u9f84\u3001\u6536\u5165\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u3001\u652f\u4ed8\u80fd\u529b\u7b49\u5173\u952e\u4fe1\u606f\u3002\n\n# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a\u4e2d\u7b49\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u201c\u5feb\u901f\u8d5a\u94b1\u201d\u7684\u660e\u663e\u5174\u8da3\uff08\u201c\u672a\u6765\u53ef\u671f\u201d\u3001\u201cAI\u6211\u6765\u4e86\u201d\uff09\uff0c\u5bf9\u9500\u552e\u5c55\u793a\u7684\u53d8\u73b0\u6848\u4f8b\uff083000+\u30012500\u5143\u7b49\uff09\u6709\u53cd\u5e94\u3002\u4f46\u52a8\u673a\u504f\u5411\u77ed\u671f\u529f\u5229\uff0c\u5bf9\u6280\u80fd\u63d0\u5347\u3001\u804c\u4e1a\u8f6c\u578b\u7b49\u6df1\u5c42\u5b66\u4e60\u76ee\u6807\u672a\u8868\u9732\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u672a\u77e5**\u3002\u65e0\u804c\u4e1a\u3001\u6536\u5165\u3001\u53ef\u652f\u914d\u65f6\u95f4\u3001\u8bbe\u5907\u7b49\u4fe1\u606f\u3002\u4ec5\u77e5\u7528\u6237\u540d\u4e3a\u201c\u5468\u5fd7\u5f3a\u201d\uff0c\u53ef\u80fd\u4e3a\u7537\u6027\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a\u4e2d\u7b49\u504f\u9ad8\u3002\u80fd\u5b8c\u6210\u4f5c\u4e1a\uff08\u751f\u56fe\u3001\u751f\u89c6\u9891\uff09\uff0c\u5e76\u7ed9\u4e88\u201c\u53ef\u4ee5\u201d\u3001\u201cOK\u201d\u3001\u201c[\u5f3a]\u201d\u7b49\u79ef\u6781\u4f46\u7b80\u77ed\u7684\u53cd\u9988\uff0c\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u914d\u5408\u5ea6\u4e0e\u6267\u884c\u529b\u3002\u5bf9\u9500\u552e\u5bc6\u96c6\u7684\u53d8\u73b0\u5f15\u5bfc\u672a\u8868\u73b0\u51fa\u53cd\u611f\u6216\u8d28\u7591\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u672a\u53d1\u751f\u652f\u4ed8\u884c\u4e3a\u3002\u7528\u6237\u4ec5\u91cd\u590d\u201c2980\u201d\u4ef7\u683c\uff0c\u4f46\u672a\u786e\u8ba4\u62a5\u540d\u6216\u652f\u4ed8\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u7f3a\u5931**\u3002\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u4e3a\u72ec\u7acb\u51b3\u7b56\u8005\u3002\n*   **\u6b65\u9aa41-4\u5224\u5b9a**\uff1a\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5b8c\u6210\u5b8c\u6574ABCD\u5224\u5b9a\u3002\u5f53\u524d\u5904\u4e8e\u201cB\u7c7b\uff08\u57f9\u80b2\u671f\uff09\u201d\u53ef\u80fd\u6027\u8f83\u9ad8\uff0c\u7528\u6237\u5bf9\u53d8\u73b0\u611f\u5174\u8da3\u5e76\u53c2\u4e0e\u4f53\u9a8c\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u660e\u786e\u7684\u4ed8\u8d39\u610f\u5411\u6216\u51b3\u7b56\u4fe1\u53f7\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**\uff1a**T3 \u529f\u5229\u6295\u673a\u8005**\u3002\u6838\u5fc3\u7279\u5f81\u543b\u5408\uff1a\u5bf9\u201c\u5feb\u901f\u8d5a\u94b1\u201d\u3001\u201c\u7ea2\u5229\u673a\u4f1a\u201d\u654f\u611f\uff0c\u5173\u6ce8\u5177\u4f53\u6536\u76ca\u6848\u4f8b\uff08\u59823000+\u30012500\u5143\uff09\uff0c\u884c\u52a8\u4ee5\u77ed\u671f\u53d8\u73b0\u4e3a\u5bfc\u5411\u3002\u5b66\u4e60\u884c\u4e3a\u8868\u73b0\u4e3a\u5b8c\u6210\u6307\u5b9a\u4efb\u52a1\uff0c\u4f46\u5bf9\u6280\u80fd\u6df1\u5ea6\u3001\u884c\u4e1a\u8ba4\u77e5\u5174\u8da3\u672a\u663e\u3002\n*   **\u6b21\u9009\u539f\u578b**\uff1aT2 \u7126\u8651\u8fdb\u53d6\u8005\uff08\u53ef\u80fd\u6027\u8f83\u4f4e\uff0c\u56e0\u672a\u8868\u9732\u804c\u4e1a\u7126\u8651\u6216\u660e\u786e\u8f6c\u578b\u9700\u6c42\uff09\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669**\uff1a**\u4e2d**\u3002T3\u539f\u578b\u7528\u6237\u5bf9\u201c\u5feb\u901f\u8d5a\u94b1\u201d\u671f\u671b\u6781\u9ad8\uff0c\u6613\u56e0\u73b0\u5b9e\u6536\u76ca\u4e0d\u53ca\u9884\u671f\u5f15\u53d1\u6295\u8bc9\u3002\n*   **\u6839\u56e0\u6392\u67e5**\uff1a\n    *   **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u6838\u5fc3\u8bc9\u6c42\u662f\u5feb\u901f\u53d8\u73b0\uff0c\u82e5\u5b66\u4e60\u540e\u63a5\u5355\u56f0\u96be\u6216\u6536\u76ca\u5fae\u8584\uff0c\u9000\u8d39\u98ce\u9669\u6781\u9ad8\u3002\n    *   **\u627f\u8bfa\u672a\u5151\u73b0**\uff1a**\u4e2d\u98ce\u9669**\u3002\u9500\u552e\u9891\u7e41\u63d0\u53ca\u201c\u5185\u90e8\u5546\u5355\u201d\u3001\u201c\u5feb\u901f\u8d5a\u94b1\u201d\u3001\u201c\u5de5\u4f5c\u5ba4\u201d\u7b49\uff0c\u82e5\u6b63\u5f0f\u8bfe\u65e0\u6cd5\u5151\u73b0\u76f8\u5173\u8d44\u6e90\u6216\u901a\u9053\uff0c\u6613\u5f15\u53d1\u4e89\u8bae\u3002\n    *   **\u7ecf\u6d4e\u538b\u529b/\u51b2\u52a8\u6d88\u8d39**\uff1a\u672a\u77e5\u3002\n    *   **\u8bfe\u7a0b\u8d28\u91cf/\u670d\u52a1\u4e0d\u7b26**\uff1a\u4f4e\u98ce\u9669\u3002\u76ee\u524d\u5bf9\u670d\u52a1\u53cd\u9988\u79ef\u6781\u3002\n    *   **\u5b66\u4e60\u969c\u788d/\u65f6\u95f4\u51b2\u7a81**\uff1a\u4f4e\u98ce\u9669\u3002\u76ee\u524d\u80fd\u8ddf\u4e0a\u8282\u594f\u3002\n    *   **\u5bb6\u5ead\u53cd\u5bf9**\uff1a\u672a\u77e5\u3002\n    *   **\u7ade\u54c1\u6bd4\u8f83/\u9700\u6c42\u53d8\u5316**\uff1a\u4f4e\u98ce\u9669\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5408\u89c4\u95ee\u9898**\uff1a\n    1.  **\u8fc7\u5ea6\u627f\u8bfa\u98ce\u9669**\uff1a\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u5feb\u901f\u8d5a\u94b1\u201d\u3001\u201c\u7ea2\u5229\u673a\u4f1a\u201d\u3001\u201c\u52a0\u5165\u5de5\u4f5c\u5ba4\u201d\uff0c\u53ef\u80fd\u8425\u9020\u4e0d\u5207\u5b9e\u9645\u7684\u6536\u5165\u9884\u671f\u3002\n    2.  **\u5236\u9020\u7a00\u7f3a\u4e0e\u7d27\u8feb\u611f**\uff1a\u201c\u6dd8\u6c70\u5904\u7406\u201d\u3001\u201c\u4eca\u665a\u5f00\u901a\u5165\u5b66\u901a\u9053\u201d\u3001\u201c\u975e\u5e38\u91cd\u8981\u201d\u7b49\u8bdd\u672f\u9891\u7e41\uff0c\u53ef\u80fd\u8bf1\u5bfc\u51b2\u52a8\u51b3\u7b56\u3002\n    3.  **\u8eab\u4efd\u6a21\u7cca**\uff1a\u9500\u552e\u81ea\u79f0\u201c\u5e08\u5144\u201d\u3001\u201c\u6bb5\u8001\u5e08\u201d\u3001\u201c\u5b98\u65b9\u52a9\u6559\u201d\uff0c\u89d2\u8272\u6df7\u6dc6\uff0c\u53ef\u80fd\u5f71\u54cd\u7528\u6237\u5bf9\u670d\u52a1\u6027\u8d28\u7684\u5224\u65ad\u3002\n*   **\u4f26\u7406\u9632\u7ebf**\uff1a\u9500\u552e\u7b56\u7565\u96c6\u4e2d\u4e8e\u201c\u53d8\u73b0\u201d\u5438\u5f15\uff0c\u5bf9\u6280\u80fd\u57f9\u517b\u3001\u884c\u4e1a\u8ba4\u77e5\u3001\u957f\u671f\u804c\u4e1a\u53d1\u5c55\u5f15\u5bfc\u4e0d\u8db3\uff0c**\u5b58\u5728\u5c06\u6559\u80b2\u4ea7\u54c1\u8fc7\u5ea6\u5305\u88c5\u4e3a\u201c\u521b\u5bcc\u5de5\u5177\u201d\u7684\u503e\u5411**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6838\u5fc3\u7b56\u7565**\uff1a**\u7ba1\u7406\u9884\u671f\uff0c\u592f\u5b9e\u4ef7\u503c\uff0c\u63d0\u4f9b\u771f\u5b9e\u8def\u5f84**\u3002\n*   **\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9884\u671f\u7ba1\u7406**\uff1a\u7acb\u5373\u4ecb\u5165\uff0c\u660e\u786e\u544a\u77e5AI\u77ed\u89c6\u9891\u53d8\u73b0\u9700\u8981\u65f6\u95f4\u79ef\u7d2f\u6280\u80fd\u3001\u4f5c\u54c1\u548c\u6e20\u9053\uff0c\u6de1\u5316\u201c\u901f\u6210\u201d\u5370\u8c61\u3002\u5206\u4eab\u666e\u901a\u5b66\u5458\u7684\u771f\u5b9e\u6210\u957f\u5468\u671f\u4e0e\u6536\u5165\u6848\u4f8b\uff08\u9700\u5305\u542b\u521d\u671f\u56f0\u96be\uff09\u3002\n    2.  **\u4ef7\u503c\u8f6c\u6362**\uff1a\u5c06\u6c9f\u901a\u91cd\u70b9\u4ece\u201c\u8d5a\u591a\u5c11\u94b1\u201d\u8f6c\u5411\u201c\u638c\u63e1\u4ec0\u4e48\u6280\u80fd\u53ef\u4ee5\u63a5\u4ec0\u4e48\u7c7b\u578b\u7684\u5355\u201d\uff0c\u5c55\u793a\u6280\u80fd\u63d0\u5347\u4e0e\u4f5c\u54c1\u8d28\u91cf\u7684\u5173\u7cfb\u3002\n    3.  **\u63d0\u4f9b\u8def\u5f84**\uff1a\u6e05\u6670\u8bf4\u660e\u6b63\u5f0f\u8bfe\u540e\u7684\u63a5\u5355\u652f\u6301\u6d41\u7a0b\uff08\u5982\u5185\u90e8\u5546\u5355\u6c60\u5982\u4f55\u8fdb\u5165\u3001\u7b5b\u9009\u6807\u51c6\u3001\u5bfc\u5e08\u6307\u5bfc\u673a\u5236\uff09\uff0c\u800c\u975e\u7a7a\u6cdb\u627f\u8bfa\u8d44\u6e90\u3002\n    4.  **\u6df1\u5ea6\u6316\u6398**\uff1a\u5c3d\u5feb\u901a\u8fc71v1\u6c9f\u901a\u4e86\u89e3\u7528\u6237\u804c\u4e1a\u3001\u7a7a\u95f2\u65f6\u95f4\u3001\u73b0\u6709\u6280\u80fd\uff0c\u8bc4\u4f30\u5176\u6295\u5165\u53ef\u884c\u6027\uff0c\u5e76\u4e86\u89e3\u5176\u5bb6\u5ead\u662f\u5426\u652f\u6301\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**\uff1a\n    *   \u82e5\u7528\u6237\u652f\u4ed8\u80fd\u529b\u4e00\u822c\u6216\u65f6\u95f4\u6709\u9650\uff1a**\u8c28\u614e\u63a8\u8fdb**\uff0c\u4f18\u5148\u63a8\u8350\u5355\u4ef7\u8f83\u4f4e\u3001\u5468\u671f\u8f83\u77ed\u7684\u201c\u8f7b\u91cf\u7ea7\u5b9e\u6218\u5305\u201d\u6216\u201c\u5546\u5355\u4e13\u9879\u8bad\u7ec3\u8425\u201d\uff0c\u964d\u4f4e\u5176\u8bd5\u9519\u6210\u672c\u548c\u5fc3\u7406\u9884\u671f\u3002\n    *   \u82e5\u7528\u6237\u652f\u4ed8\u80fd\u529b\u5c1a\u53ef\u4e14\u65f6\u95f4\u8f83\u5145\u88d5\uff1a\u53ef\u5339\u914d**\u6807\u51c6\u5b9e\u6218\u8425**\uff0c\u4f46\u5fc5\u987b\u5f3a\u5316\u201c\u6280\u80fd\u5b66\u4e60-\u4f5c\u54c1\u79ef\u7d2f-\u6e20\u9053\u5bf9\u63a5\u201d\u7684\u5168\u6d41\u7a0b\u8f85\u5bfc\u8bf4\u660e\uff0c\u5e76\u660e\u786e\u5404\u9636\u6bb5\u7684\u9884\u671f\u6210\u679c\u3002\n\n{\"core_type\": \"T3 \u529f\u5229\u6295\u673a\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168/\u5c0a\u91cd\", \"target_product_line\": \"\u9700\u8fdb\u4e00\u6b65\u8bc4\u4f30\uff0c\u503e\u5411\u8f7b\u91cf\u7ea7\u5b9e\u6218\u5305\u6216\u6807\u51c6\u5b9e\u6218\u8425\uff08\u9700\u5f3a\u9884\u671f\u7ba1\u7406\uff09\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u7537\uff08\u63a8\u6d4b\uff09\", \"city\": \"\u672a\u77e5\"}";
