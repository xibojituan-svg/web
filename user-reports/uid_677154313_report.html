    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n> **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4e3b\u8981\u96c6\u4e2d\u5728\u4f53\u9a8c\u8425\u540e\u671f\u8f6c\u5316\u9636\u6bb5\uff0c\u7f3a\u4e4f\u5bf9\u7528\u6237**\u804c\u4e1a\u80cc\u666f\u3001\u5bb6\u5ead\u7ed3\u6784\u3001\u65e5\u5e38\u4f5c\u606f\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386**\u7b49\u5173\u952e\u4fe1\u606f\u7684\u6df1\u5ea6\u6316\u6398\u3002\u652f\u4ed8\u65b9\u5f0f\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u7b49\u6838\u5fc3\u4fe1\u606f\u4ec5\u9760\u7528\u6237\u5355\u65b9\u9762\u63d0\u53ca\uff0c\u9700\u73ed\u4e3b\u4efb\u540e\u7eed\u6838\u5b9e\u3002\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u97e9\u8389\u5a1c (UID: 677154313) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e - \u5c0f\u7389(\u7eaa\u6587\u7389) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u64ad\u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b (\u7cbe\u82f1\u7248\uff0c\u4ef7\u683c3980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u7528\u5361\u5206\u671f** (\u7528\u6237\u591a\u6b21\u5f3a\u8c03\u201c\u5237\u4fe1\u7528\u5361\u201d\u3001\u201c\u5206\u671f12\u671f\u201d) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u767d\u5929\u6709\u5ba2\u6237\u3001\u770b\u623f\u7b49\u4e8b\u52a1\uff0c\u4f46\u8868\u793a\u201c\u524d\u4e00\u4e2a\u6708\u53ef\u4ee5\u5168\u804c\u201d) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** (\u672a\u63d0\u53ca\uff0c\u9700\u8b66\u60d5\u9690\u7792\u98ce\u9669) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49** (\u52a8\u673a\u4e0e\u8d44\u91d1\u538b\u529b\u4fe1\u606f\u8f83\u9971\u6ee1\uff0c\u5bb6\u5ead\u4e0e\u804c\u4e1a\u80cc\u666f\u7f3a\u5931) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34(\u4e2d)**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u4e3b\u8981\u8ddf\u7740\u5e08\u59d0\u8d5a\u94b1\u201d\u3001\u201c\u6211\u76ee\u7684\u5c31\u662f\u60f3\u6323\u94b1\u201d\uff0c\u641e\u94b1\u52a8\u673a\u5f3a\u70c8\u3002\u4f46\u540c\u65f6\uff0c\u5979\u5bf9\u201c\u77ed\u5267\u63a8\u5e7f\u201d\u7b49\u7b80\u5355\u5feb\u94b1\u9879\u76ee\u4e5f\u8868\u73b0\u51fa\u6d53\u539a\u5174\u8da3\uff0c\u5b58\u5728\u201c\u54ea\u4e2a\u7b80\u5355\u3001\u56de\u672c\u5feb\u5c31\u505a\u54ea\u4e2a\u201d\u7684\u6295\u673a\u548c\u6447\u6446\u5fc3\u6001\uff0c\u52a8\u673a\u7eaf\u5ea6\u88ab\u5206\u6563\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4e3b\u8981\u8ddf\u7740\u5e08\u59d0\u8d5a\u94b1\u201d > \u201c\u6211\u76ee\u7684\u5c31\u662f\u60f3\u6323\u94b1\u201d > \u201c\u90a3\u4e2a\u7b80\u5355\uff0c\u4f60\u4eec\u8fd9\u4e2a\u590d\u6742\u201d > \u201c\u5927\u4e0d\u4e86\u4e0d\u6323\u94b1\uff0c\u56de\u672c\u4e5f\u5feb\uff0c\u5927\u4e0d\u4e86\u6d6a\u8d39\u4e00\u4e2a\u6708\u65f6\u95f4\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u53cd\u590d\u5f3a\u8c03\u201c\u592a\u8d35\u4e86\u201d\u3001\u201c\u6ca1\u94b1\u201d\u3001\u201c\u5237\u4fe1\u7528\u5361\u201d\u3001\u201c\u5206\u671f\u201d\uff0c\u5bf93980\u5143\u5b66\u8d39\u611f\u5230\u5de8\u5927\u538b\u529b\uff0c**\u8d44\u91d1\u627f\u8f7d\u529b\u5df2\u89e6\u53ca\u7ea2\u7ebf**\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u8868\u793a\u201c\u524d\u4e00\u4e2a\u6708\u53ef\u4ee5\u5168\u804c\u201d\uff0c\u767d\u5929\u867d\u6709\u4e8b\u52a1\u4f46\u665a\u4e0a\u53ef\u5b66\u4e60\uff0c\u65f6\u95f4\u6709\u4e00\u5b9a\u4fdd\u969c\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u4fe1\u606f\uff0c**\u9700\u9ad8\u5ea6\u8b66\u60d5\u9690\u7792\u6216\u53cd\u5bf9\u98ce\u9669**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b07\u4f4e\u6781\u5371]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a(\u4e2d) \u504f\u5411\u6781\u5371**\u3002\u7528\u6237\u8868\u73b0\u51fa\u8f83\u5f3a\u7684**\u7ed3\u679c\u5bfc\u5411\u548c\u8ba1\u7b97\u5fc3\u6001**\uff08\u53cd\u590d\u8ba1\u7b97\u56de\u672c\u5468\u671f\u3001\u5bf9\u6bd4\u9879\u76ee\uff09\uff0c\u5bf9\u590d\u6742\u6027\u548c\u56f0\u96be\uff08\u201c\u8d39\u55d3\u5b50\u201d\u3001\u201c\u590d\u6742\u201d\uff09\u6709\u754f\u96be\u60c5\u7eea\u3002\u5f53\u9500\u552e\u65e0\u6cd5\u6ee1\u8db3\u5176\u964d\u4ef7\u8981\u6c42\u65f6\uff0c\u8868\u73b0\u51fa\u72b9\u8c6b\u548c\u52a8\u6447\u3002\u867d\u672a\u60c5\u7eea\u5d29\u6e83\uff0c\u4f46**\u6297\u538b\u6027\u5f31\uff0c\u6613\u56e0\u77ed\u671f\u65e0\u6536\u76ca\u6216\u9047\u5230\u6280\u672f\u56f0\u96be\u800c\u653e\u5f03**\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4f60\u4eec\u8fd9\u4e2a\u8fd8\u8d39\u55d3\u5b50\u5462\u201d > \u201c\u90a3\u4e2a\u7b80\u5355\uff0c\u4f60\u4eec\u8fd9\u4e2a\u590d\u6742\u201d > \u201c\u591a\u957f\u65f6\u95f4\u56de\u672c\u554a\u201d > \u201c\u4f60\u63a8\u8350\u6211\u7cbe\u82f1\u7684\u201d (\u53cd\u590d\u5bfb\u6c42\u5916\u90e8\u786e\u8ba4\uff0c\u7f3a\u4e4f\u4e3b\u89c1)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e00\u5c42\uff1a\u751f\u5b58\u5b89\u5168** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u7ecf\u6d4e\u72b6\u51b5\u7684\u6df1\u5ea6\u7126\u8651\u548c\u4e0d\u5b89\u5168\u611f**\u3002\u7528\u6237\u5bf9\u201c\u5237\u4fe1\u7528\u5361\u201d\u652f\u4ed8\u5b66\u8d39\u7684\u53cd\u590d\u5f3a\u8c03\uff0c\u4ee5\u53ca\u5bf9\u201c\u56de\u672c\u901f\u5ea6\u201d\u7684\u6781\u81f4\u5173\u6ce8\uff0c\u66b4\u9732\u51fa\u5176\u5f53\u524d\u7ecf\u6d4e\u538b\u529b\u5de8\u5927\uff0c\u4efb\u4f55\u6295\u8d44\u90fd\u5fc5\u987b\u5728\u6781\u77ed\u65f6\u95f4\u5185\u770b\u5230\u73b0\u91d1\u56de\u62a5\uff0c\u5426\u5219\u5c06\u52a0\u5267\u5176\u751f\u5b58\u7126\u8651\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u786e\u5b9a\u6027\u7684\u8d5a\u94b1\u8def\u5f84\u201d\u548c\u201c\u4f4e\u6210\u672c\u8bd5\u9519\u7684\u5b89\u5168\u611f\u201d**\u3002\u5979\u9700\u8981\u7684\u4e0d\u662f\u753b\u5927\u997c\uff0c\u800c\u662f\u4e00\u4e2a\u6e05\u6670\u3001\u53ef\u9884\u671f\u3001\u98ce\u9669\u53ef\u63a7\u7684\u201c\u4fdd\u5e95\u201d\u65b9\u6848\uff0c\u4ee5\u7f13\u89e3\u5176\u56e0\u7ecf\u6d4e\u538b\u529b\u4ea7\u751f\u7684\u6050\u614c\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2** \u7c7b (\u52a8\u673a\u4e0d\u7eaf+\u8d44\u6e90\u5e95\u5ea7\u8106\u5f31+\u5fc3\u7406\u5f39\u6027\u5dee) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u578b (\u504f\u6295\u673a\u7248)** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 **\u5b89\u5168\u672a\u89e6\u53d1** (\u4f46\u5df2\u4e34\u8fd1\u7ea2\u7ebf)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u7528\u6237\u660e\u786e\u4f7f\u7528**\u4fe1\u7528\u5361\u5206\u671f**\u652f\u4ed8\u5b66\u8d39\uff0c\u4e14\u53cd\u590d\u8868\u8fbe\u7ecf\u6d4e\u538b\u529b\uff0c\u5df2\u7b26\u5408\u201c\u88ab\u8feb\u5206\u671f\u201d\u7279\u5f81\u3002\u867d\u672a\u63d0\u53ca\u501f\u6b3e\uff0c\u4f46\u8d44\u91d1\u94fe\u6781\u5176\u8106\u5f31\uff0c**\u4e00\u65e6\u77ed\u671f\u65e0\u6cd5\u53d8\u73b0\uff0c\u6781\u6613\u5f15\u53d1\u503a\u52a1\u7126\u8651\u548c\u9000\u8d39\u51b2\u7a81**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u7ecf\u6d4e\u538b\u529b\u5927\uff0c\u82e5\u4e3a\u9690\u7792\u5bb6\u4eba\u62a5\u540d\uff0c\u98ce\u9669\u9aa4\u589e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u867d\u8868\u793a\u6709\u65f6\u95f4\uff0c\u4f46\u5176\u201c\u8ba1\u7b97\u56de\u672c\u201d\u7684\u6025\u5207\u5fc3\u6001\uff0c\u82e5\u5f00\u8bfe\u540e\u53d1\u73b0\u9700\u8981\u957f\u671f\u7ec3\u4e60\u800c\u975e\u7acb\u5373\u63a5\u5355\uff0c\u6613\u56e0\u201c\u6d6a\u8d39\u65f6\u95f4\u201d\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u5bf9\u5b66\u4e60\u96be\u5ea6(\u201c\u590d\u6742\u201d\u3001\u201c\u8d39\u55d3\u5b50\u201d)\u5df2\u6709\u987e\u8651\uff0c\u4e00\u65e6\u5728\u5b9e\u64cd\u4e2d\u9047\u5230\u8f6f\u4ef6\u95ee\u9898\u3001\u8bd5\u97f3\u5931\u8d25\u3001\u6216\u5bf9\u6bd4\u5176\u4ed6\u201c\u7b80\u5355\u201d\u9879\u76ee\u53d7\u632b\uff0c\u6781\u6613\u81ea\u5c0a\u5fc3\u53d7\u632b\uff0c\u5f52\u548e\u4e8e\u8bfe\u7a0b\u65e0\u6548\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u6781\u9ad8** | **\u6700\u6838\u5fc3\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u201c\u4e00\u4e2a\u6708\u56de\u672c\u201d\u3001\u201c\u517c\u804c\u6708\u51652000\u201d\u62b1\u6709\u660e\u786e\u4e14\u6025\u5207\u7684\u671f\u671b\u3002\u82e5\u5f00\u8bfe\u540e1-2\u5468\u5185\u65e0\u6cd5\u770b\u5230\u660e\u786e\u53d8\u73b0\u8def\u5f84\u6216\u63a5\u5230\u7b2c\u4e00\u5355\uff0c**\u9000\u8d39\u6295\u8bc9\u6982\u7387\u6781\u9ad8**\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\u3002\u5373\u7b2c\u4e00\u8f6e\u6b63\u5f0f\u5b66\u4e60\u7ed3\u675f\uff0c\u5f00\u59cb\u5c1d\u8bd5\u8bd5\u97f3\u4f46\u53ef\u80fd\u906d\u9047\u5931\u8d25\u6216\u7b49\u5f85\u671f\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u8389\u5a1c\uff0c\u770b\u5230\u4f60\u62a5\u540d\u4e86\uff0c\u7279\u522b\u7406\u89e3\u4f60\u60f3\u5c3d\u5feb\u901a\u8fc7\u58f0\u97f3\u6539\u53d8\u73b0\u72b6\u7684\u5fc3\u60c5\u3002\u54b1\u4eec\u4e0d\u8ddf\u522b\u4eba\u6bd4\u901f\u5ea6\uff0c\u5c31\u8e0f\u8e0f\u5b9e\u5b9e\u628a\u6bcf\u4e00\u6b65\u8d70\u7a33\u3002\u6211\u5df2\u7ecf\u8ddf\u8f85\u5bfc\u8001\u5e08\u6253\u8fc7\u62db\u547c\uff0c\u524d\u4e24\u5468\u4f1a\u91cd\u70b9\u5e26\u4f60\u8fc7\u8bbe\u5907\u5173\u548c\u57fa\u7840\u5f55\u5236\uff0c\u786e\u4fdd\u4f60\u80fd**\u5148\u63a5\u4e00\u4e24\u4e2a\u5c0f\u5355\u5b50\u627e\u5230\u611f\u89c9\u548c\u4fe1\u5fc3**\u3002\u54b1\u4eec\u7684\u76ee\u6807\u5f88\u5b9e\u5728\uff1a**\u5148\u5b89\u5168\u5730\u628a\u5b66\u8d39\u8d5a\u56de\u6765**\uff0c\u518d\u56fe\u53d1\u5c55\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011** (\u6838\u5fc3\u8bc9\u6c42\u662f\u5feb\u901f\u89c1\u94b1\uff0c\u5fc5\u987b\u4f18\u5148\u6ee1\u8db3)\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n    1.  **\u3010\u6781\u7b80\u8bbe\u5907\u4e0e\u8f6f\u4ef6\u4e0a\u624b\u5305\u3011**\uff1a\u9488\u5bf9\u5176\u201c\u6015\u590d\u6742\u201d\u7684\u5fc3\u7406\uff0c\u63d0\u4f9b\u4fdd\u59c6\u7ea7\u56fe\u6587/\u89c6\u9891\u6559\u7a0b\uff0c\u964d\u4f4e\u6280\u672f\u95e8\u69db\u3002\n    2.  **\u3010\u4fdd\u5e95\u8bd5\u97f3\u673a\u4f1a\u5305\u3011**\uff1a\u627f\u8bfa\u5728\u5b66\u5b8c\u57fa\u7840\u6a21\u5757\u540e\uff0c\u63d0\u4f9b1-2\u4e2a\u4f4e\u95e8\u69db\u3001\u9ad8\u901a\u8fc7\u7387\u7684\u8bd5\u97f3\u673a\u4f1a\uff08\u5982\u513f\u7ae5\u8bfb\u7269\u7247\u6bb5\uff09\uff0c**\u65e0\u8bba\u91d1\u989d\u5927\u5c0f\uff0c\u52a1\u5fc5\u8ba9\u5176\u5b8c\u6210\u201c\u63a5\u5355-\u6536\u6b3e\u201d\u95ed\u73af**\u3002\n    3.  **\u3010\u5fc3\u7406\u6309\u6469\u4e0e\u8fdb\u5ea6\u53ef\u89c6\u5316\u5305\u3011**\uff1a\u5b9a\u671f\u53cd\u9988\u5176\u5fae\u5c0f\u8fdb\u6b65\uff08\u5982\u201c\u4eca\u5929\u6c14\u606f\u7a33\u4e86\u201d\uff09\uff0c\u5e76\u7528\u56fe\u8868\u5c55\u793a\u5176\u201c\u8ddd\u79bb\u63a5\u7b2c\u4e00\u5355\u8fd8\u5dee\u51e0\u6b65\u201d\uff0c\u7ed9\u4e88\u786e\u5b9a\u6027\u548c\u638c\u63a7\u611f\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1.  \u7edd\u4e0d\u5bf9\u5176\u63cf\u7ed8\u957f\u671f\u4e3b\u4e49\u84dd\u56fe\u6216\u884c\u4e1a\u8fdc\u666f\u3002\n    2.  \u7edd\u4e0d\u5728\u5176\u672a\u5b8c\u6210\u201c\u63a5\u5355\u95ed\u73af\u201d\u524d\uff0c\u63a8\u8350\u4efb\u4f55\u9700\u8981\u989d\u5916\u6295\u5165\uff08\u65f6\u95f4\u3001\u91d1\u94b1\uff09\u7684\u52a0\u9910\u5185\u5bb9\u6216\u5347\u9636\u8bfe\u7a0b\u3002\n    3.  \u907f\u514d\u4f7f\u7528\u201c\u575a\u6301\u201d\u3001\u201c\u70ed\u7231\u201d\u7b49\u9700\u8981\u60c5\u6000\u652f\u6491\u7684\u8bcd\u6c47\uff0c\u5168\u90e8\u66ff\u6362\u4e3a\u201c\u6b65\u9aa4\u201d\u3001\u201c\u65b9\u6cd5\u201d\u3001\u201c\u56de\u62a5\u201d\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u5b8c\u6210\u81f3\u5c112-3\u6b21\u6210\u529f\u63a5\u5355\u5e76\u6536\u5230\u6b3e\u9879\u524d\uff0c\u7981\u6b62\u63d0\u53ca\u4efb\u4f55\u9ad8\u9636\u8bfe\u7a0b\u6216\u9644\u52a0\u670d\u52a1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u4e3b\u8981\u8ddf\u7740\u5e08\u59d0\u8d5a\u94b1**\u201d\n2. > \u201c**\u6211\u90fd\u662f\u5237\u7684\u4fe1\u7528\u5361\uff0c\u592a\u8d35\u4e86**\u201d & \u201c**\u5982\u679c2580\u6211\u5c31\u5237\u4fe1\u7528\u5361\u8bd5\u8bd5**\u201d\n3. > \u201c**\u90a3\u4e2a\u7b80\u5355\uff0c\u4f60\u4eec\u8fd9\u4e2a\u590d\u6742**\u201d & \u201c**\u90a3\u4e2a\u6709\u5408\u540c\uff0c\u7b2c\u56db\u5929\u5c31\u80fd\u6709\u6536\u76ca**\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T4\u641e\u94b1\u7ed3\u679c\u578b\uff08\u8d44\u91d1\u8106\u5f31\u7248\uff09**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u751f\u5b58\u5b89\u5168\uff08\u5feb\u901f\u73b0\u91d1\u56de\u8840\uff09**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u5728\u5f00\u8bfe\u4e00\u4e2a\u6708\u5185\uff0c\u7528\u201c\u4fdd\u59c6\u5f0f\u5b9e\u64cd\u6307\u5bfc+\u4fdd\u5e95\u8bd5\u97f3\u673a\u4f1a\u201d\u5f3a\u884c\u52a9\u5176\u5b8c\u6210\u201c\u63a5\u5355-\u6536\u6b3e\u201d\u95ed\u73af\uff0c\u54ea\u6015\u91d1\u989d\u5f88\u5c0f**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u751f\u5b58\u5b89\u5168\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf\"}\n```";
