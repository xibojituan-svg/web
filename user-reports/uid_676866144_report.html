    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4ee5\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\u7684\u8eab\u4efd\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u63d0\u4f9b\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676866144 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-29 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6587\u68ee\u5de6\uff08AI\u5199\u4f5c\u6559\u7ec3/\u7f16\u5267\uff09\u3001\u5609\u76c8\u73ed\u73ed\u3001\u5c01\u5bd2\u6f47\u5189 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u5199\u4f5c\u77ed\u6545\u4e8b\u57fa\u7840\u73ed\uff08\u63a8\u6d4b\u4e3a\u4f53\u9a8c\u8425\u6216\u6b63\u4ef7\u8bfe\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3** |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u591a\u6b21\u63d0\u53ca\u52a0\u73ed\u3001\u9001\u5916\u5356\u9014\u4e2d\u6784\u601d\uff0c\u65f6\u95f4\u4e0d\u56fa\u5b9a\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3** |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u5b66\u4e60\u884c\u4e3a\u3001\u4e92\u52a8\u3001\u6295\u7a3f\u5c1d\u8bd5\u5747\u6709\u8bb0\u5f55\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u6709\u660e\u786e\u7684\u53d8\u73b0\u5c1d\u8bd5\u884c\u4e3a\uff08\u5411\u4e5d\u5dde\u5e73\u53f0\u6295\u7a3f\uff09\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u201c\u51e0\u5929\u5185\u5fc5\u987b\u8d5a\u94b1\u201d\u7684\u6781\u7aef\u7126\u8651\u3002\u52a8\u673a\u662f\u201c\u517c\u804c\u53d8\u73b0\u201d\u4e0e\u201c\u6280\u80fd\u5b66\u4e60\u201d\u7684\u6df7\u5408\u4f53\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8bf7\u95ee\u4e00\u4e0b\u8001\u5e08\u521a\u521a\u6536\u5230\u4e5d\u5dde\u7684\u901a\u77e5\uff0c\u8bd5\u7a3f\u7ed3\u679c\u662f\u2018\u4e0d\u6536\u975e\u5b8c\u672c\u2019\uff0c\u662f\u4e0d\u662f\u4ee5\u540e\u6295\u7a3f\u8981\u6295\u5b8c\u7ed3\u7684\u5c0f\u8bf4\uff1f\u201d > \u201c\u597d\u7684\uff0c\u6211\u4e3b\u8981\u60f3\u8bd5\u4e00\u8bd5\uff0c\u4ed6\u4e3b\u8981\u6ca1\u6807\u6ce8\u7bc7\u5e45\uff0c\u6211\u4ee5\u4e3a\u53ef\u4ee5\u5199\u4e2d\u7bc7\uff0c\u6807\u6ce8\u4e8625\u65e5\u53ef\u4ee5\u5b8c\u7ed3\uff0c\u7b49\u6625\u8282\u5728\u5bb6\u6784\u601d\u5b8c\u6574\u7248\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u7ecf\u6d4e\u72b6\u51b5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u2b07\u4f4e (3-4\u5206)** \u2014 \u6838\u5fc3\u77ed\u677f\u3002\u591a\u6b21\u56e0\u52a0\u73ed\u5f71\u54cd\u5b66\u4e60\uff08\u201c\u4eca\u665a\u6211\u53ef\u80fd\u52a0\u73ed\u665a\u4e00\u4e9b\u201d\u3001\u201c\u8fd9\u5468\u90fd\u5728\u52a0\u73ed\u201d\uff09\uff0c\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\uff0c\u751a\u81f3\u201c\u5728\u9001\u5916\u5356\u7684\u9014\u4e2d\u201d\u6784\u601d\u6545\u4e8b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8 (7-8\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u6295\u7a3f\u88ab\u62d2\uff08\u201c\u4e0d\u6536\u975e\u5b8c\u672c\u201d\uff09\u3001\u65f6\u95f4\u7d27\u5f20\uff08\u591a\u6b21\u52a0\u73ed\uff09\u7b49\u632b\u6298\uff0c\u672a\u8868\u73b0\u51fa\u4efb\u4f55\u60c5\u7eea\u5d29\u6e83\u6216\u5411\u73ed\u4e3b\u4efb\u5bfb\u6c42\u60c5\u611f\u5b89\u6170\u3002\u4e3b\u52a8\u8be2\u95ee\u89e3\u51b3\u65b9\u6848\uff0c\u8c03\u6574\u7b56\u7565\uff08\u201c\u7b49\u6625\u8282\u5728\u5bb6\u6784\u601d\u5b8c\u6574\u7248\u201d\uff09\uff0c\u5e76\u6301\u7eed\u8ddf\u8fdb\u5b66\u4e60\u4efb\u52a1\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u597d\u7684\uff0c\u6211\u4e3b\u8981\u60f3\u8bd5\u4e00\u8bd5...\u7b49\u6625\u8282\u5728\u5bb6\u6784\u601d\u5b8c\u6574\u7248\u3002[\u7834\u6d95\u4e3a\u7b11]\u201d \uff08\u7528\u8868\u60c5\u5316\u89e3\u632b\u6298\uff0c\u5e76\u89c4\u5212\u4e0b\u4e00\u6b65\uff09> \u201c\u73ed\u73ed\uff0c\u8fd9\u5468\u90fd\u5728\u52a0\u73ed\uff0c\u6587\u7ae0\u8fd8\u6ca1\u5199\u5b8c\uff0c\u53ef\u4ee5\u5148\u4ea4\u6a21\u677f\u7b49\u8fc7\u51e0\u5929\u518d\u4ea4\u4f5c\u4e1a\u4e48\uff1f\u201d \uff08\u9762\u5bf9\u65f6\u95f4\u538b\u529b\uff0c\u4e3b\u52a8\u63d0\u51fa\u89e3\u51b3\u65b9\u6848\uff0c\u800c\u975e\u62b1\u6028\u6216\u653e\u5f03\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 / \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u65f6\u95f4\u6781\u5ea6\u532e\u4e4f\u5bfc\u81f4\u7684\u804c\u4e1a\u4e0d\u5b89\u5168\u611f**\u3002\u7528\u6237\u4ece\u4e8b\u9ad8\u5f3a\u5ea6\u3001\u4e0d\u7a33\u5b9a\u7684\u5de5\u4f5c\uff08\u9001\u5916\u5356\u3001\u9891\u7e41\u52a0\u73ed\uff09\uff0c\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u5199\u4f5c\u6280\u80fd\u83b7\u5f97\u4e00\u4efd\u66f4\u7a33\u5b9a\u3001\u66f4\u6709\u524d\u666f\u7684\u517c\u804c\u6216\u5168\u804c\u6536\u5165\uff0c\u4ee5\u6784\u5efa\u7ecf\u6d4e\u4e0a\u7684\u201c\u5b89\u5168\u57ab\u201d\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u201d\u7684\u5c0a\u91cd\u4e0e\u201c\u8def\u5f84\u6e05\u6670\u201d\u7684\u786e\u5b9a\u6027**\u3002\u4ed6\u4e0d\u9700\u8981\u60c5\u611f\u4fdd\u59c6\uff0c\u4f46\u9700\u8981\u88ab\u8ba4\u53ef\u5176\u52aa\u529b\uff08\u5373\u4f7f\u65f6\u95f4\u6709\u9650\uff09\uff0c\u5e76\u9700\u8981\u4e00\u4e2a\u660e\u786e\u3001\u9ad8\u6548\u3001\u80fd\u9002\u914d\u5176\u788e\u7247\u5316\u65f6\u95f4\u7684\u53d8\u73b0\u8def\u5f84\u56fe\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u8fdb\u5316\u524d\u4f53\uff0c\u6709\u5411\u6df7\u5408\u4f533\u53f7\u3010\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b\u3011\u53d1\u5c55\u7684\u6f5c\u529b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u96f6\u4e92\u52a8\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u884c\u4e3a\u72ec\u7acb\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u4e2d** | **\u8fd9\u662f\u6700\u5927\u98ce\u9669\u70b9\u3002** \u56e0\u5de5\u4f5c\uff08\u9001\u5916\u5356\u3001\u52a0\u73ed\uff09\u5bfc\u81f4\u65f6\u95f4\u6301\u7eed\u88ab\u6324\u538b\uff0c\u65e0\u6cd5\u8ddf\u4e0a\u8bfe\u7a0b\u8fdb\u5ea6\u548c\u4f5c\u4e1a\u8981\u6c42\uff0c\u4ea7\u751f\u201c\u82b1\u4e86\u94b1\u5374\u6ca1\u65f6\u95f4\u5b66\u201d\u7684\u6127\u759a\u611f\u548c\u632b\u8d25\u611f\uff0c\u6700\u7ec8\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u81ea\u6211\u8c03\u8282\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u5df2\u5f00\u59cb\u5c1d\u8bd5\u6295\u7a3f\uff0c\u5bf9\u53d8\u73b0\u5468\u671f\u6709\u521d\u6b65\u8ba4\u77e5\uff0c\u672a\u8868\u73b0\u51fa\u4e0d\u5207\u5b9e\u9645\u7684\u66b4\u5bcc\u5e7b\u60f3\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u8bfe\u7a0b\u4e2d\u540e\u671f\uff08\u7b2c4-6\u5468\uff09**\uff0c\u5f53\u4f5c\u4e1a\u96be\u5ea6\u548c\u9891\u7387\u589e\u52a0\uff0c\u800c\u5176\u5de5\u4f5c\u65f6\u95f4\u51b2\u7a81\u65e0\u6cd5\u8c03\u548c\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u770b\u5230\u4f60\u7ecf\u5e38\u5728\u5fd9\u788c\u4e2d\u62bd\u7a7a\u5b66\u4e60\uff0c\u771f\u7684\u5f88\u4f69\u670d\u4f60\u7684\u6bc5\u529b\u3002\u54b1\u4eec\u7684\u8bfe\u7a0b\u8bbe\u8ba1\u8003\u8651\u5230\u4e86\u5927\u5bb6\u65f6\u95f4\u4e0d\u56fa\u5b9a\uff0c\u6240\u6709\u76f4\u64ad\u90fd\u6709\u56de\u653e\uff0c\u4f5c\u4e1a\u4e5f\u6709\u7075\u6d3b\u63d0\u4ea4\u7684\u673a\u5236\u3002\u4f60\u7684\u76ee\u6807\u662f\u5b9e\u5b9e\u5728\u5728\u7684\uff0c\u54b1\u4eec\u5c31\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u628a\u788e\u7247\u65f6\u95f4\u9ad8\u6548\u5229\u7528\u8d77\u6765\uff0c\u6211\u5e2e\u4f60\u76ef\u7740\u5173\u952e\u8282\u70b9\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176\u52a1\u5b9e\u3001\u8ffd\u6c42\u6280\u80fd\u843d\u5730\u7684\u7279\u8d28\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176**\u65f6\u95f4\u788e\u7247\u5316**\u7684\u77ed\u677f\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u7075\u6d3b\u5b66\u4e60\u8def\u5f84\u5305\u3011** \u4e0e **\u3010\u7cbe\u51c6\u6d3e\u5355/\u6295\u7a3f\u6307\u5bfc\u5305\u3011**\u3002\u524d\u8005\u63d0\u4f9b\u5f55\u64ad\u5207\u7247\u3001\u4efb\u52a1\u6e05\u5355\uff0c\u540e\u8005\u76f4\u63a5\u5bf9\u63a5\u5176\u53d8\u73b0\u9700\u6c42\uff0c\u7f29\u77ed\u201c\u5b66\u4e60-\u4ea7\u51fa\u201d\u8def\u5f84\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u522b\u4eba\u90fd\u5b8c\u6210\u4e86\u4f60\u600e\u4e48\u8fd8\u6ca1\u4ea4\u201d\u8fd9\u7c7b\u8bdd\u672f\u65bd\u538b\u3002\u7981\u6b62\u5ffd\u89c6\u5176\u65f6\u95f4\u56f0\u5883\uff0c\u5f3a\u884c\u8981\u6c42\u540c\u6b65\u76f4\u64ad\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u5fc5\u987b\u7ed1\u5b9a\u201c\u65f6\u95f4\u89e3\u51b3\u65b9\u6848\u201d**\u3002\u5728\u63a8\u8350\u8fdb\u9636\u73ed\uff08\u5982\u7f16\u8f91\u6539\u7a3f\u8bfe\uff09\u65f6\uff0c\u5fc5\u987b\u5f3a\u8c03\u8bfe\u7a0b\u5982\u4f55\u5e2e\u52a9\u4ed6\u201c\u66f4\u9ad8\u6548\u5730\u5229\u7528\u6709\u9650\u65f6\u95f4\u4ea7\u51fa\u5408\u683c\u7a3f\u4ef6\u201d\uff0c\u800c\u975e\u5355\u7eaf\u6e32\u67d3\u524d\u666f\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u73ed\u73ed\uff0c\u4eca\u665a\u6211\u53ef\u80fd\u52a0\u73ed\u665a\u4e00\u4e9b\uff0c\u53ef\u4ee5\u542c\u4e0d\u4e86\u4f5c\u4e1a\u70b9\u8bc4\u8bfe\u4e86\uff0c\u53ef\u4ee5\u5c06\u8001\u5e08\u70b9\u8bc4\u7684\u65b9\u5f0f\u6539\u6539\u4e48\uff1f\u201d **(\u4e3b\u52a8\u6c9f\u901a\u65f6\u95f4\u51b2\u7a81\uff0c\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848)**\n2. > \u201c\u597d\u7684\uff0c\u6211\u4e3b\u8981\u60f3\u8bd5\u4e00\u8bd5\uff0c\u4ed6\u4e3b\u8981\u6ca1\u6807\u6ce8\u7bc7\u5e45\uff0c\u6211\u4ee5\u4e3a\u53ef\u4ee5\u5199\u4e2d\u7bc7\uff0c\u6807\u6ce8\u4e8625\u65e5\u53ef\u4ee5\u5b8c\u7ed3\uff0c\u7b49\u6625\u8282\u5728\u5bb6\u6784\u601d\u5b8c\u6574\u7248\u3002[\u7834\u6d95\u4e3a\u7b11]\u201d **(\u6295\u7a3f\u53d7\u632b\u540e\u5feb\u901f\u8c03\u6574\uff0c\u5e76\u89c4\u5212\u4e0b\u4e00\u6b65\uff0c\u60c5\u7eea\u7a33\u5b9a)**\n3. > \u201c\u73ed\u73ed\uff0c\u8fd9\u5468\u90fd\u5728\u52a0\u73ed\uff0c\u6587\u7ae0\u8fd8\u6ca1\u5199\u5b8c\uff0c\u53ef\u4ee5\u5148\u4ea4\u6a21\u677f\u7b49\u8fc7\u51e0\u5929\u518d\u4ea4\u4f5c\u4e1a\u4e48\uff1f\u201d **(\u518d\u6b21\u56e0\u5de5\u4f5c\u5f71\u54cd\u8fdb\u5ea6\uff0c\u4f46\u6001\u5ea6\u79ef\u6781\uff0c\u5bfb\u6c42\u901a\u878d\u800c\u975e\u653e\u5f03)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5229\u7528\u788e\u7247\u65f6\u95f4\u638c\u63e1\u4e00\u95e8\u80fd\u5e26\u6765\u5b89\u5168\u611f\u7684\u786c\u6280\u80fd\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u81f4\u7075\u6d3b\u7684\u65f6\u95f4\u89e3\u51b3\u65b9\u6848\u548c\u6e05\u6670\u7684\u77ed\u671f\u53d8\u73b0\u8def\u5f84\uff0c\u7edd\u4e0d\u7528\u7eaa\u5f8b\u6346\u7ed1\u65bd\u538b\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168/\u793e\u4ea4\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u7075\u6d3b\u5b66\u4e60\u8def\u5f84\u5305\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
