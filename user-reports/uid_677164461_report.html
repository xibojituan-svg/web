    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID 677164461 (C\u00e9stbon) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u7c7d\u83f2(\u675c\u4e9a\u7537) \u2192 \u73ed\u4e3b\u4efb-\u5b89\u7ae5\u58f0(\u5218\u7d20\u82f1) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b (\u4ef7\u683c\u672a\u660e\u786e\u63d0\u53ca\uff0c\u4f46\u63d0\u53ca\u201c\u52a9\u5b66\u91d1\u4f18\u60e0\u5238\u201d\u53ca\u201c7380\u201d\u4ef7\u683c\u951a\u70b9) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u5206\u671f\u6216\u501f\u8d37\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u81ea\u8ff0\u4e3a\u5b9d\u5988\uff0c\u65f6\u95f4\u788e\u7247\u5316\uff0c\u9700\u54c4\u5c0f\u5b69\u7761\u89c9\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u6709\u660e\u786e\u8eab\u4efd\uff08\u5b9d\u5988\uff09\u3001\u65f6\u95f4\u72b6\u6001\u548c\u53d8\u73b0\u610f\u613f\uff0c\u4f46\u7f3a\u4e4f\u8d44\u91d1\u3001\u5bb6\u5ead\u652f\u6301\u7b49\u5173\u952e\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u2b07\u4f4e**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u7eaf\u4e3a\u51e0\u5929\u5185\u63d0\u73b0\u4fdd\u5e95\u800c\u6765(\u4f4e\u6781\u5371)**\u3002\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u3001\u6280\u672f\u539f\u7406\u65e0\u4efb\u4f55\u8ffd\u95ee\uff0c\u552f\u4e00\u4e3b\u52a8\u8868\u8fbe\u7684\u8bc9\u6c42\u662f\u201c\u80fd\u8d5a\u5230\u7c73\u6211\u5c31\u559c\u6b22\u201d\uff0c\u53d8\u73b0\u76ee\u7684\u6781\u5176\u660e\u786e\u4e14\u6025\u8feb\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u80fd\u8d5a\u5230\u7c73\u6211\u5c31\u559c\u6b22\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u2b07\u4f4e** \u2014 \u201c\u6211\u662f\u5b9d\u5988\uff0c\u65f6\u95f4\u5f88\u788e\u7247\uff0c\u56e0\u4e3a\u8981\u54c4\u5c0f\u5b69\u7761\u89c9\u201d\u3002\u8fd9\u662f\u5178\u578b\u7684**\u65f6\u95f4\u6781\u901f\u67af\u7aed**\u4fe1\u53f7\uff0c\u5b66\u4e60\u65f6\u95f4\u4e25\u91cd\u53d7\u9650\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u27a1\u4e2d**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a(\u4e2d)**\u3002\u5728\u9519\u8fc7\u8bd5\u620f\u76f4\u64ad\u540e\u8868\u8fbe\u4e86\u201c\u9519\u8fc7\u5b9e\u5c5e\u65e0\u5948\ud83d\ude2e\u200d\ud83d\udca8\u201d\uff0c\u5e26\u6709\u6cae\u4e27\u60c5\u7eea\uff0c\u4f46\u80fd\u8fc5\u901f\u63a5\u53d7\u5b89\u629a\u5e76\u5b89\u6392\u540e\u7eed\u4efb\u52a1\uff08\u201c\u660e\u5929\u53d1\u60a8\u201d\uff09\uff0c\u672a\u51fa\u73b0\u5d29\u6e83\u6216\u653e\u5f03\u4fe1\u53f7\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08 \u4eca\u5929\u7684\u8bd5\u620f\u6211\u8d76\u4e0d\u4e0a\u4e86 \u8fd8\u6709\u4e0b\u6b21\u5417[\u5927\u54ed]\u201d \u2192 \u201c\u597d\u7684\u8001\u5e08 \u9519\u8fc7\u5b9e\u5c5e\u65e0\u5948\ud83d\ude2e\u200d\ud83d\udca8\u201d \u2192 \u201c\u6536\u5230 \u660e\u5929\u53d1\u60a8\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u4f5c\u4e3a\u5b9d\u5988\uff0c\u9762\u4e34**\u65f6\u95f4\u88ab\u80b2\u513f\u4e25\u91cd\u6324\u538b**\u7684\u751f\u5b58\u538b\u529b\uff0c\u5bf9\u901a\u8fc7\u517c\u804c\u5feb\u901f\u83b7\u5f97\u7ecf\u6d4e\u56de\u62a5\u4ee5\u7f13\u89e3\u5bb6\u5ead\u6216\u4e2a\u4eba\u8d22\u52a1\u7126\u8651\u6709\u6781\u9ad8\u671f\u5f85\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u89c1\u7f1d\u63d2\u9488\u4e5f\u80fd\u8d5a\u94b1\u201d\u7684\u5b89\u5168\u611f\u4e0e\u786e\u5b9a\u6027**\u3002\u9700\u8981\u5c06\u8bfe\u7a0b\u5305\u88c5\u4e3a\u4e00\u79cd\u4f4e\u95e8\u69db\u3001\u9ad8\u786e\u5b9a\u6027\u7684\u201c\u5bb6\u5ead\u6536\u5165\u4fdd\u969c\u65b9\u6848\u201d\uff0c\u800c\u975e\u5174\u8da3\u6216\u6280\u80fd\u63d0\u5347\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u8bba** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u7b49\u4fe1\u53f7\u3002\u4f46**\u52a8\u673a\u7eaf\u5ea6\u4f4e\uff08\u53d8\u73b0\u6025\u8feb\uff09**\u4e0e**\u8d44\u6e90\u5e95\u5ea7\u4f4e\uff08\u65f6\u95f4\u788e\u7247\uff09**\u7684\u7ec4\u5408\uff0c\u4f7f\u5176\u5904\u4e8e\u9ad8\u98ce\u9669\u8fb9\u7f18\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u82e5\u4e3a\u9690\u7792\u5bb6\u4eba\u62a5\u540d\uff0c\u540e\u7eed\u65f6\u95f4\u6295\u5165\u53ef\u80fd\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u5b9d\u5988\u8eab\u4efd\u5bfc\u81f4\u65f6\u95f4\u6781\u5ea6\u4e0d\u53ef\u63a7\uff0c\u4e00\u65e6\u8bfe\u7a0b\u8282\u594f\u4e0e\u80b2\u513f\u51b2\u7a81\uff0c\u6781\u6613\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u81ea\u8d23\u5e76\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4e2d** | \u82e5\u521d\u671f\u8bd5\u97f3\u591a\u6b21\u5931\u8d25\uff0c\u5176\u201c\u5feb\u901f\u8d5a\u94b1\u201d\u7684\u671f\u671b\u843d\u7a7a\uff0c\u53ef\u80fd\u56e0\u632b\u8d25\u611f\u800c\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u6781\u9ad8** | **\u3010\u6700\u9ad8\u98ce\u9669\u3011** \u5bf9\u201c\u4e24\u5929\u5185\u5c1d\u8bd5\u63a5\u5355\u201d\u7684\u9500\u552e\u8bdd\u672f\u62b1\u6709\u5e7b\u60f3\u3002\u82e5\u5f00\u8bfe\u540e\u53d1\u73b0\u63a5\u5355\u8fdc\u975e\u6613\u4e8b\uff0c\u6536\u76ca\u9884\u671f\u4e25\u91cd\u4e0d\u7b26\uff0c\u5c06\u7acb\u5373\u89e6\u53d1\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\u3002\u5f53\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u8bfe\u7a0b\u96be\u5ea6\u589e\u52a0\u3001\u4f5c\u4e1a\u91cf\u4e0a\u5347\uff0c\u4f46\u63a5\u5355\u53d8\u73b0\u4ecd\u9065\u9065\u65e0\u671f\u65f6\uff0c\u662f\u9000\u8d39\u610f\u613f\u7684\u96c6\u4e2d\u7206\u53d1\u70b9\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cC\u00e9stbon\u5988\u5988\u4f60\u597d\u5440\uff01\u7279\u522b\u7406\u89e3\u54b1\u4eec\u5f53\u5988\u7684\uff0c\u65f6\u95f4\u90fd\u662f\u6324\u51fa\u6765\u7684\uff0c\u7279\u522b\u4e0d\u5bb9\u6613\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u5c31\u662f\u4e3a\u5b9d\u5988\u4eec\u8bbe\u8ba1\u7684\uff0c\u6240\u6709\u4efb\u52a1\u90fd\u80fd\u2018\u89c1\u7f1d\u63d2\u9488\u2019\u5b8c\u6210\uff0c\u7edd\u4e0d\u7ed9\u4f60\u589e\u52a0\u8d1f\u62c5\u3002\u54b1\u4eec\u4e0d\u56fe\u5feb\uff0c\u5c31\u56fe\u7a33\uff0c\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\u628a\u6280\u80fd\u7ec3\u624e\u5b9e\uff0c\u63a5\u5355\u8d5a\u94b1\u662f\u6c34\u5230\u6e20\u6210\u7684\u4e8b\u3002\u6709\u4efb\u4f55\u65f6\u95f4\u4e0a\u7684\u56f0\u96be\uff0c\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u60f3\u529e\u6cd5\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011** (\u4f46\u5fc5\u987b\u8fdb\u884c**\u9006\u5411\u9884\u671f\u7ba1\u7406**)\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u5f3a\u5236\u6302\u8f7d **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011** \u4ee5\u5e94\u5bf9\u5176\u56e0\u65f6\u95f4\u538b\u529b\u4ea7\u751f\u7684\u7126\u8651\u3002\u540c\u65f6\uff0c\u56e0\u5176\u65f6\u95f4\u788e\u7247\uff0c\u5e94\u63d0\u4f9b **\u3010\u79fb\u52a8\u7aef\u4f18\u5148\u5b66\u4e60\u5305\u3011**\uff08\u624b\u673a\u5f55\u97f3\u3001\u77ed\u65f6\u7ec3\u4e60\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a**\u7edd\u4e0d\u5bf9\u5176\u63cf\u7ed8\u201c\u901f\u6210\u66b4\u5bcc\u201d\u7684\u84dd\u56fe\uff1b\u7981\u6b62\u7528\u201c\u6700\u540e\u540d\u989d\u201d\u3001\u201c\u9650\u65f6\u4f18\u60e0\u201d\u7b49\u8bdd\u672f\u65bd\u538b\uff1b\u907f\u514d\u5e03\u7f6e\u9700\u8981\u5927\u5757\u8fde\u7eed\u65f6\u95f4\u624d\u80fd\u5b8c\u6210\u7684\u590d\u6742\u4f5c\u4e1a\u3002**\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u5728\u9996\u6b21\u63a5\u5355\u6210\u529f\u524d\uff0c\u4e25\u7981\u4efb\u4f55\u5927\u989d\u5347\u5355\u63a8\u4ecb\u3002** \u53ef\u8003\u8651500\u5143\u4ee5\u5185\u7684\u5fae\u5347\u5355\uff08\u5982\u8bbe\u5907\u63a8\u8350\u3001\u8f7b\u91cf\u7ec3\u4e60\u518c\uff09\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u662f\u5b9d\u5988\uff0c\u65f6\u95f4\u5f88\u788e\u7247\uff0c\u56e0\u4e3a\u8981\u54c4\u5c0f\u5b69\u7761\u89c9\u201d\n2. > \u201c\u80fd\u8d5a\u5230\u7c73\u6211\u5c31\u559c\u6b22\u201d\n3. > \u201c\u8001\u5e08 \u4eca\u5929\u7684\u8bd5\u620f\u6211\u8d76\u4e0d\u4e0a\u4e86 \u8fd8\u6709\u4e0b\u6b21\u5417[\u5927\u54ed]\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4 \u641e\u94b1\u7ed3\u679c\u8bba\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\uff08\u7ecf\u6d4e\u4fdd\u969c\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u4e25\u683c\u6267\u884c\u9006\u5411\u9884\u671f\u7ba1\u7406 + \u63d0\u4f9b\u6781\u81f4\u5f39\u6027\u7684\u65f6\u95f4\u5b89\u6392\u4e0e\u60c5\u7eea\u6258\u5e95\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u8bba\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf\uff08\u9700\u6302\u8f7d\u7597\u6108\u966a\u5b66\u5305\uff09\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u5973\", \"city\": \"\u9547\u6c5f\"}\n```";
