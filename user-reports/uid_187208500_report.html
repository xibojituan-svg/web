        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 187208500 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-28 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6c90\u7efe\u83c0(\u5f20\u5a49\u94b0) / \u552e\u540e\u5c0f\u742a |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u7cbe\u82f1\u73ed\uff08\u5df2\u8d2d\uff09\uff0c\u8003\u8651\u540e\u671f\u526a\u8f91\u8bfe\uff08\u6682\u7f13\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u63a8\u6d4b\u4e3a\u5168\u6b3e\u6216\u4fe1\u7528\u5361\u5468\u8f6c |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1\uff08\u767d\u5929\u4e0a\u73ed\uff0c\u665a\u4e0a\u5b66\u4e60\uff0c\u9700\u517c\u987e\u5b69\u5b50\u4e2d\u8003\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u63a8\u6d4b\u5df2\u62a5\u5907\u5e76\u652f\u6301 |\n| **\u4fe1\u606f\u539a\u5ea6** | \u9971\u6ee1 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u800c\u6765(\u9ad8)\u3002\u7528\u6237\u5173\u6ce8\u6280\u672f\u7ec6\u8282\uff08AU\u4f7f\u7528\u3001\u5bf9\u8f68\u3001\u97f3\u6548\u5305\uff09\u3001\u79ef\u6781\u53c2\u4e0e\u5267\u7ec4\u5b9e\u8df5\u3001\u4e3b\u52a8\u4e3a\u4ed6\u4eba\u7b54\u7591\uff0c\u8868\u73b0\u51fa\u5bf9\u6280\u80fd\u672c\u8eab\u7684\u8ffd\u6c42\u548c\u56e2\u961f\u534f\u4f5c\u610f\u613f\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u83b2\u5b50\uff0c\u6211\u8d76\u7d27\u7ec3\u7ec3\uff0c\u55ef\uff0c\u5230\u65f6\u5019\u8fd8\u80fd\u7ed9\u4f60\u642d\u628a\u624b\u513f\u201d > \u201c\u6211\u81ea\u5df1\u611f\u89c9\u8bfb\u6587\u672c\u5f88\u91cd\uff0c\u6ca1\u6709\u5bf9\u8bdd\u611f\u201d > \u201c\u8bb0\u5f97\u53d1\u56de\u653e\uff0c\u6211\u5f97\u542c\u542c\u5bf9\u8f68\u54ea\u513f\u4e0d\u884c\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a\u4e2d \u2014 \u6709\u80fd\u529b\u8d2d\u4e70\u8bfe\u7a0b\uff0c\u4f46\u4f1a\u8003\u8651\u6027\u4ef7\u6bd4\uff08\u201c\u6211\u611f\u89c9\u6211\u4e0d\u7528\u518d\u5b66\u540e\u671f\u4e86\uff0c\u7ed9\u6211\u7701\u4e86\u4e00\u7b14\u94b1\u201d\uff09\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a\u4e2d \u2014 \u767d\u5929\u4e0a\u73ed\uff0c\u665a\u4e0a\u5b66\u4e60\uff0c\u5b69\u5b50\u4e2d\u8003\u5728\u5373\uff0c\u65f6\u95f4\u9ad8\u5ea6\u7d27\u5f20\u4e14\u788e\u7247\u5316\uff08\u201c\u5b69\u5b50\u8981\u4e2d\u8003\uff0c\u6211\u767d\u5929\u4e0a\u73ed\uff0c\u665a\u4e0a\u5b66\u4e60\uff0c\u987e\u4e0d\u4e0a\u4ed6\u201d\uff09\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a\u4e2d \u2014 \u5bb6\u5ead\u8d23\u4efb\u91cd\uff08\u5b69\u5b50\u4e2d\u8003\uff09\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u5f3a\u70c8\u53cd\u5bf9\uff0c\u7528\u6237\u4e3b\u52a8\u9009\u62e9\u4e3a\u5bb6\u5ead\u8d23\u4efb\u8ba9\u6e21\u5b66\u4e60\u65f6\u95f4\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9047\u5230\u6280\u672f\u56f0\u96be\uff08AU\u5b89\u88c5\u3001\u5bf9\u8f68\uff09\u65f6\uff0c\u4e3b\u52a8\u5c1d\u8bd5\u3001\u5bfb\u6c42\u5e2e\u52a9\uff0c\u5e76\u4fdd\u6301\u79ef\u6781\u5fc3\u6001\uff08\u201c\u5173\u5173\u96be\u8fc7\u5173\u5173\u8fc7\uff0c\u65e9\u665a\u5f97\u6765\u201d\uff09\u3002\u867d\u6709\u77ed\u6682\u81ea\u6211\u6000\u7591\uff08\u201c\u8d8a\u6765\u8d8a\u6ca1\u6709\u4fe1\u5fc3\u4e86\u201d\uff09\uff0c\u4f46\u80fd\u8fc5\u901f\u8c03\u6574\uff0c\u7ee7\u7eed\u63a8\u8fdb\u4efb\u52a1\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5173\u5173\u96be\u8fc7\u5173\u5173\u8fc7\uff0c\u65e9\u665a\u5f97\u6765\u201d > \u201c\u95e8\u9053\u53ef\u771f\u4e0d\u5c11\uff0c\u8d8a\u6765\u8d8a\u6ca1\u6709\u4fe1\u5fc3\u4e86\u201d > \u201c\u6211\u5feb\u7b11\u8db4\u4e86\u201d\uff08\u9762\u5bf9\u56f0\u96be\u65f6\u7684\u4e50\u89c2\u8c03\u4f83\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5728\u627f\u62c5\u591a\u91cd\u793e\u4f1a\u89d2\u8272\uff08\u5458\u5de5\u3001\u5bb6\u957f\uff09\u7684\u538b\u529b\u4e0b\uff0c\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u65b0\u6280\u80fd\uff0c\u83b7\u5f97\u4e2a\u4eba\u4ef7\u503c\u7684\u786e\u8ba4\u548c\u56e2\u961f\u7684\u8ba4\u53ef\uff0c\u5b9e\u73b0\u81ea\u6211\u7a81\u7834\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u8d4b\u4e88\u5176\u201c\u56e2\u961f\u6838\u5fc3\u8d21\u732e\u8005\u201d\u7684\u8eab\u4efd\u8ba4\u540c**\u3002\u80af\u5b9a\u5979\u7684\u6280\u672f\u94bb\u7814\u7cbe\u795e\u3001\u56e2\u961f\u534f\u4f5c\u80fd\u529b\u548c\u8d23\u4efb\u5fc3\uff0c\u8ba9\u5979\u611f\u53d7\u5230\u81ea\u5df1\u4e0d\u4ec5\u662f\u5b66\u5458\uff0c\u66f4\u662f\u9879\u76ee\u4e0d\u53ef\u6216\u7f3a\u7684\u5efa\u8bbe\u8005\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe2 **A\u7c7b** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T1-A \u5bfc\u6f14\u578b\u9886\u8896**\uff08\u8fdb\u5316\u4e2d\uff09 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u4fe1\u53f7\uff0c\u5bb6\u5ead\u8d23\u4efb\u91cd\u4f46\u672a\u6784\u6210\u53cd\u5bf9\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u5b69\u5b50\u4e2d\u8003\u662f\u5f53\u524d\u9996\u8981\u4efb\u52a1\uff0c\u4f46\u7528\u6237\u5df2\u4e3b\u52a8\u7ba1\u7406\u9884\u671f\uff08\u9000\u51fa\u5267\u7ec4\u3001\u6682\u7f13\u540e\u671f\u8bfe\uff09\uff0c\u98ce\u9669\u53ef\u63a7\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4e2d | **\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u65f6\u95f4\u6781\u5ea6\u788e\u7247\u5316\uff0c\u82e5\u8bfe\u7a0b\u4efb\u52a1\u4e0e\u5bb6\u5ead/\u5de5\u4f5c\u51b2\u7a81\u52a0\u5267\uff0c\u53ef\u80fd\u5bfc\u81f4\u65e0\u6cd5\u8ddf\u8fdb\u800c\u4ea7\u751f\u81ea\u8d23\u3001\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u81ea\u6211\u8c03\u8282\uff0c\u6280\u672f\u95ee\u9898\u4f1a\u4e3b\u52a8\u6c42\u52a9\u800c\u975e\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u52a8\u673a\u4e3a\u6280\u80fd\u6210\u957f\u548c\u56e2\u961f\u53c2\u4e0e\uff0c\u800c\u975e\u77ed\u671f\u53d8\u73b0\uff0c\u5bf9\u6536\u76ca\u671f\u5f85\u7406\u6027\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5b69\u5b50\u4e2d\u8003\u524d\u540e\uff08\u7ea650\u5929\u5185\uff09**\u3002\u6b64\u65f6\u5bb6\u5ead\u538b\u529b\u5cf0\u503c\uff0c\u82e5\u8bfe\u7a0b\u4efb\u52a1\u672a\u7075\u6d3b\u8c03\u6574\uff0c\u6781\u6613\u56e0\u65f6\u95f4\u51b2\u7a81\u5bfc\u81f4\u201c\u65e0\u6cd5\u5b8c\u6210\u4f5c\u4e1a\u201d\u7684\u7d2f\u79ef\u6027\u632b\u8d25\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u8774\u8776\u96e8\uff0c\u770b\u5230\u4f60\u5728\u5267\u7ec4\u91cc\u53c8\u5f53\u62fc\u547d\u4e09\u90ce\u53c8\u5e2e\u5927\u5bb6\u770b\u5bf9\u8f68\uff0c\u771f\u7684\u592a\u9760\u8c31\u4e86\uff01\u54b1\u4eec\u8fd9\u4e2a\u56e2\u961f\u6709\u4f60\u8fd9\u6837\u7684\u6838\u5fc3\u6210\u5458\u662f\u798f\u6c14\u3002\u77e5\u9053\u4f60\u6700\u8fd1\u5bb6\u91cc\u4e8b\u591a\uff08\u5b69\u5b50\u4e2d\u8003\uff09\uff0c\u65f6\u95f4\u7d27\uff0c**\u5343\u4e07\u522b\u6709\u538b\u529b**\u3002\u54b1\u4eec\u7684\u5b66\u4e60\u8282\u594f\u4f60\u5b8c\u5168\u81ea\u5df1\u638c\u63a7\uff0c\u6709\u4efb\u4f55\u9700\u8981\u534f\u8c03\u7684\u76f4\u63a5\u558a\u6211\uff0c\u6211\u7684\u4efb\u52a1\u5c31\u662f\u7ed9\u4f60\u5f53\u597d\u540e\u52e4\uff0c\u786e\u4fdd\u4f60\u65e2\u80fd\u987e\u597d\u5bb6\u91cc\uff0c\u4e5f\u80fd\u5728\u8fd9\u7247\u81ea\u7559\u5730\u91cc\u73a9\u5f97\u5f00\u5fc3\u3001\u6709\u6536\u83b7\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf**\u3011\u3002\u5979\u5df2\u5c55\u73b0\u51faT1-A\uff08\u5bfc\u6f14\u578b\uff09\u7684\u6f5c\u8d28\uff0c\u5e94\u5c06\u5176\u89c6\u4e3a\u73ed\u7ea7\u751f\u6001\u7684\u5171\u5efa\u8005\uff0c\u800c\u975e\u666e\u901a\u5b66\u5458\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\uff08B\u6a21\u5757\uff09**\u3011+ **\u3010D\u6a21\u5757\uff1a\u7edf\u7b79\u6743\u529b\u4e0b\u653e\u3011**\u3002\u8d4b\u4e88\u5176\u5c0f\u7ec4\u957f\u3001\u4f5c\u4e1a\u7edf\u8ba1\u5458\u3001\u65b0\u624b\u7b54\u7591\u5b98\u7b49\u975e\u6b63\u5f0f\u5934\u8854\uff0c\u5c06\u90e8\u5206\u6559\u52a1\u534f\u8c03\u5de5\u4f5c\u4ea4\u7ed9\u5979\uff0c\u6ee1\u8db3\u5176\u201c\u88ab\u9700\u8981\u201d\u548c\u201c\u638c\u63a7\u6b32\u201d\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u6700\u540e\u540d\u989d\u201d\u3001\u201c\u5012\u8ba1\u65f6\u201d\u7b49\u8bdd\u672f\u5bf9\u5176\u65bd\u52a0\u62a5\u8bfe\u538b\u529b\uff1b\u5728\u5979\u56e0\u5bb6\u5ead\u4e8b\u52a1\u6682\u7f13\u5b66\u4e60\u65f6\uff0c\u8868\u73b0\u51fa\u4efb\u4f55\u5931\u671b\u6216\u50ac\u4fc3\u7684\u60c5\u7eea\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u5176\u5b69\u5b50\u4e2d\u8003\u7ed3\u675f\u524d\u8fdb\u884c\u4efb\u4f55\u5347\u5355\u63a8\u9500**\uff08\u5982\u540e\u671f\u8bfe\uff09\u3002\u5f53\u524d\u9636\u6bb5\u53ea\u63d0\u4f9b\u652f\u6301\uff0c\u5f85\u5176\u65f6\u95f4\u5bbd\u88d5\u540e\uff0c\u57fa\u4e8e\u5176\u6280\u672f\u5174\u8da3\uff08\u5982\u5bf9AU\u3001\u97f3\u6548\u7684\u94bb\u7814\uff09\u81ea\u7136\u5f15\u5bfc\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u83b2\u5b50\uff0c\u6211\u8d76\u7d27\u7ec3\u7ec3\uff0c\u55ef\uff0c\u5230\u65f6\u5019\u8fd8\u80fd\u7ed9\u4f60\u642d\u628a\u624b\u513f\u201d **\uff08\u56e2\u961f\u534f\u4f5c\u4e0e\u8d21\u732e\u610f\u613f\uff09**\n2. > \u201c\u5173\u5173\u96be\u8fc7\u5173\u5173\u8fc7\uff0c\u65e9\u665a\u5f97\u6765\u201d **\uff08\u9ad8\u5fc3\u7406\u5f39\u6027\uff0c\u9762\u5bf9\u56f0\u96be\u79ef\u6781\uff09**\n3. > \u201c\u526a\u8f91\u8bfe\u6211\u5148\u4e0d\u62a5\u4e86\uff0c\u56e0\u4e3a\u5b69\u5b50\u8981\u4e2d\u8003\uff0c\u6211\u767d\u5929\u4e0a\u73ed\uff0c\u665a\u4e0a\u5b66\u4e60\uff0c\u987e\u4e0d\u4e0a\u4ed6\uff0c\u5148\u8fc7\u51e0\u4e2a\u6708\u518d\u8bf4\u5427\u201d **\uff08\u7406\u6027\u6743\u8861\uff0c\u5bb6\u5ead\u8d23\u4efb\u4f18\u5148\uff0c\u975e\u51b2\u52a8\u51b3\u7b56\uff09**\n4. > \u201c@\u516c\u4e3b\u8d74\u5c71\u6d77\u2005\u4f60\u60f3\u591a\u4e86\uff0c\u540e\u671f\u7528\u8f6f\u4ef6\uff0c\u63d2\u4ef6\uff0c\u4f60\u8981\u628a\u5b83\u4f60\u8981\u628a\u5b83\u5b89\u5230\u516c\u53f8\u7684\u7535\u8111\u4e0a\uff0c\u8fd8\u662f\u4f60\u81ea\u5df1\u5e26\u7740\u4f60\u7684\u7535\u8111\u53bb\u4e0a\u73ed\u554a\u201d **\uff08\u903b\u8f91\u6e05\u6670\uff0c\u80fd\u4e3b\u52a8\u4e3a\u4ed6\u4eba\u63d0\u4f9b\u52a1\u5b9e\u5efa\u8bae\uff0c\u9886\u8896\u6f5c\u8d28\uff09**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T1-A \u5bfc\u6f14\u578b\u9886\u8896\uff08\u8fdb\u5316\u4e2d\uff09\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u591a\u91cd\u89d2\u8272\u538b\u529b\u4e0b\uff0c\u901a\u8fc7\u6280\u80fd\u7cbe\u8fdb\u548c\u56e2\u961f\u8d21\u732e\u83b7\u5f97\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u4f46\u5b58\u5728\u56e0**\u65f6\u95f4\u51b2\u7a81**\u5bfc\u81f4\u8ddf\u8fdb\u56f0\u96be\u7684\u4e2d\u5ea6\u98ce\u9669\u3002\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u8d4b\u4e88\u5176\u201c\u56e2\u961f\u6838\u5fc3\u201d\u8eab\u4efd\uff0c\u63d0\u4f9b\u6781\u5ea6\u7075\u6d3b\u7684\u65f6\u95f4\u652f\u6301\uff0c\u4e2d\u8003\u524d\u7edd\u4e0d\u63a8\u9500\u3011**\u3002\n\n```json\n{\"core_type\": \"T1-A \u5bfc\u6f14\u578b\u9886\u8896\uff08\u8fdb\u5316\u4e2d\uff09\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd\u9700\u6c42/\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\", \"age\": \"\u672a\u77e5\uff08\u63a8\u6d4b\u4e3a30-45\u5c81\u5bb6\u957f\uff09\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}\n```";
