    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4e2d\u7f3a\u4e4f\u5173\u4e8e\u7528\u6237**\u652f\u4ed8\u80fd\u529b\uff08\u8d44\u91d1\u6765\u6e90\uff09\u3001\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u3001\u8fc7\u5f80\u632b\u6298\u5e94\u5bf9\u65b9\u5f0f**\u7684\u5173\u952e\u4fe1\u606f\uff0c\u5bfc\u81f4\u5bf9\u8d44\u6e90\u5e95\u5ea7\u548c\u5fc3\u7406\u5f39\u6027\u7684\u5224\u65ad\u5b58\u5728\u63a8\u6d4b\u6210\u5206\uff0c\u5bf9\u9000\u8d39\u98ce\u9669\u7684\u8bc4\u4f30\u9700\u8c28\u614e\u3002\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u9f50\u5929\u50b2\u9738 (UID: 677152322) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-06 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u8881\u9759\u9759 (\u6c89\u9ed8/\u8881\u6765\u662f\u4f601) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad5\u5929\u4f53\u9a8c\u8425 (\u610f\u5411\u9ad8\u9636\u6b63\u4ef7\u8bfe) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u7f3a\u5931** (\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u8d44\u91d1\u6765\u6e90) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u9ad8\u5bbd\u88d5** (\u7528\u6237\u201c\u76ee\u524d\u5f85\u4e1a\u201d\uff0c\u80fd\u9891\u7e41\u3001\u53ca\u65f6\u54cd\u5e94\u9500\u552e\uff0c\u5b8c\u6210\u591a\u9879\u4f5c\u4e1a\u548c\u76f4\u64ad\u5b66\u4e60) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** (\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u4fe1\u606f) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49** (\u4e92\u52a8\u79ef\u6781\uff0c\u4f46\u5173\u952e\u98ce\u9669\u4fe1\u606f\u7f3a\u5931) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e\uff0c\u4f46\u4f34\u968f\u5174\u8da3\u840c\u82bd**\u3002\u7528\u6237\u88ab\u201c\u517c\u804c\u201d\u3001\u201c\u8bd5\u97f3\u63a5\u5355\u201d\u3001\u201c\u62a5\u916c\u201d\u7b49\u5173\u952e\u8bcd\u5438\u5f15\uff0c\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u77ed\u671f\u53d8\u73b0\u9884\u671f\u3002\u540c\u65f6\uff0c\u5728\u9500\u552e\u5f15\u5bfc\u4e0b\uff0c\u5bf9\u201c\u89d2\u8272\u5851\u9020\u201d\u3001\u201c\u58f0\u97f3\u7279\u8d28\u201d\u7b49\u6280\u80fd\u672c\u8eab\u4ea7\u751f\u4e86\u5174\u8da3\uff08\u201c\u8fd9\u4e2a\u804c\u4e1a\u592a\u6709\u8da3\u4e86\u201d\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5165\u95e8\u6709\u58f0\u201d (\u56de\u5e94\u9500\u552e\u5173\u4e8e\u517c\u804c\u7684\u5f15\u5bfc)\uff1b> \u201c\u8fd9\u4e2a\u804c\u4e1a\u592a\u6709\u8da3\u4e86\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u5f85\u4e1a\u72b6\u6001\uff0c\u4f46\u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\u6216\u652f\u4ed8\u56f0\u96be\u3002**\u9700\u8b66\u60d5**\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u2b06\u9ad8** \u2014 \u5f85\u4e1a\u72b6\u6001\uff0c\u65f6\u95f4\u5145\u88d5\uff0c\u80fd\u8fc5\u901f\u5b8c\u6210\u65e9\u529f\u3001\u4f5c\u4e1a\u3001\u89c2\u770b\u76f4\u64ad\uff0c\u4e92\u52a8\u9891\u7e41\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u5b8c\u5168\u672a\u63d0\u53ca\uff0c\u662f**\u91cd\u5927\u98ce\u9669\u672a\u77e5\u9879**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u27a1\u4e2d**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a\u4e0e\u5f15\u5bfc**\u3002\u7528\u6237\u5168\u7a0b\u914d\u5408\u5ea6\u9ad8\uff0c\u79ef\u6781\u56de\u5e94\uff0c\u672a\u8868\u73b0\u51fa\u8d1f\u9762\u60c5\u7eea\u6216\u9000\u7f29\u3002\u4f46\u7f3a\u4e4f\u9762\u5bf9\u771f\u5b9e\u56f0\u96be\uff08\u5982\u8bd5\u97f3\u5931\u8d25\u3001\u8f6f\u4ef6\u64cd\u4f5c\u95ee\u9898\uff09\u65f6\u7684\u53cd\u5e94\u8bb0\u5f55\uff0c\u5f39\u6027\u672a\u77e5\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5fc5\u987b\u8ddf\u5e08\u59d0\u597d\u597d\u5b66\u4e60\u201d (\u8868\u73b0\u51fa\u4f9d\u8d56\u6027\u548c\u8ddf\u968f\u610f\u613f)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5f85\u4e1a\u72b6\u6001\u4e0b\u7684\u804c\u4e1a\u4e0e\u6536\u5165\u7126\u8651**\u3002\u7528\u6237\u4e3b\u52a8\u8868\u660e\u201c\u76ee\u524d\u5f85\u4e1a\u201d\uff0c\u5176\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u901a\u8fc7\u58f0\u97f3\u517c\u804c\u83b7\u5f97\u4e00\u4efd**\u7a33\u5b9a\u7684\u6536\u5165\u6765\u6e90\u548c\u804c\u4e1a\u5b89\u5168\u611f**\uff0c\u4ee5\u5e94\u5bf9\u65e0\u4e1a\u72b6\u6001\u4e0b\u7684\u7ecf\u6d4e\u4e0e\u5fc3\u7406\u538b\u529b\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u201d\u7684\u80af\u5b9a\u4e0e\u201c\u6709\u8def\u5f84\u201d\u7684\u5e0c\u671b**\u3002\u9500\u552e\u4e0d\u65ad\u7ed9\u4e88\u201c\u58f0\u97f3\u6761\u4ef6\u5f88\u68d2\u201d\u3001\u201c\u6709\u673a\u4f1a\u76f4\u63a5\u8fdb\u5267\u7ec4\u201d\u7b49\u6b63\u5411\u53cd\u9988\uff0c\u6070\u597d\u6ee1\u8db3\u4e86\u7528\u6237\u5bf9\u81ea\u8eab\u4ef7\u503c\u88ab\u8ba4\u53ef\u3001\u5bf9\u672a\u6765\u6709\u660e\u786e\u51fa\u8def\u7684\u6e34\u671b\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u52a8\u673a\u4e2d\u7b49\uff0c\u8d44\u6e90\u5e95\u5ea7\u4e2d\u7b49\u4f46\u65f6\u95f4\u5145\u88d5\uff0c\u5fc3\u7406\u5f39\u6027\u4e2d\u7b49\uff0c\u5c5e\u4e8e\u53ef\u8f6c\u5316\u4f46\u6709\u98ce\u9669\u7684\u7528\u6237) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u578b** (\u6838\u5fc3\u8bc9\u6c42\u662f\u5feb\u901f\u53d8\u73b0\u89e3\u51b3\u5f85\u4e1a\u7126\u8651\uff0c\u4f46\u5bf9\u6280\u80fd\u5b66\u4e60\u672c\u8eab\u5f00\u59cb\u4ea7\u751f\u5174\u8da3\uff0c\u5904\u4e8e\u201c\u641e\u94b1\u201d\u5411\u201c\u5b9e\u5e72\u201d\u8fc7\u6e21\u7684\u8fb9\u7f18) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u804a\u5929\u8bb0\u5f55\u4e2d\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5ead\u5f3a\u70c8\u53cd\u5bf9\u7b49\u7ea2\u7ebf)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | **\u3010\u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u9700\u8b66\u60d5\u3011** \u82e5\u62a5\u540d\u52a8\u7528\u5bb6\u5ead\u50a8\u84c4\u6216\u5bb6\u4eba\u53cd\u5bf9\uff0c\u98ce\u9669\u9aa4\u589e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u65f6\u95f4\u5145\u88d5\uff0c\u5b66\u4e60\u610f\u613f\u5f3a\uff0c\u5d29\u76d8\u53ef\u80fd\u6027\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4e2d** | \u82e5\u6b63\u5f0f\u5b66\u4e60\u540e\uff0c\u906d\u9047\u591a\u6b21\u8bd5\u97f3\u5931\u8d25\u6216\u590d\u6742\u8f6f\u4ef6\u64cd\u4f5c\u632b\u6298\uff0c\u53ef\u80fd\u56e0\u201c\u6295\u5165\u65e0\u679c\u201d\u800c\u4fe1\u5fc3\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u5bf9\u201c\u51e0\u5929\u5185\u5c1d\u8bd5\u5b9e\u6218\u63a5\u5355\u201d\u3001\u201c20-150\u6bcf\u5c0f\u65f6\u201d\u62b1\u6709\u9ad8\u671f\u5f85\u3002\u4e00\u65e6\u4ed8\u8d39\u540e\u77ed\u671f\u5185\u65e0\u6cd5\u63a5\u5355\u6216\u5355\u4ef7\u6781\u4f4e\uff0c\u6781\u6613\u56e0\u9884\u671f\u843d\u5dee\u4ea7\u751f\u5f3a\u70c8\u9000\u8d39\u51b2\u52a8\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468 (\u6b7b\u4ea1\u8c37)**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u82e5\u63a5\u5355\u4e0d\u987a\u6216\u4f5c\u4e1a\u96be\u5ea6\u9661\u589e\uff0c\u6536\u76ca\u7126\u8651\u5c06\u8fbe\u5230\u9876\u5cf0\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u9f50\u5929\u50b2\u9738\u540c\u5b66\uff0c\u770b\u5230\u4f60\u5f85\u4e1a\u671f\u95f4\u8fd8\u8fd9\u4e48\u79ef\u6781\u5b66\u4e60\u65b0\u6280\u80fd\uff0c\u771f\u7684\u7279\u522b\u6709\u884c\u52a8\u529b\uff01\u54b1\u4eec\u8fd9\u4e2a\u8bfe\uff0c\u5c31\u662f\u5e2e\u4f60\u628a\u2018\u6709\u8da3\u2019\u53d8\u6210\u2018\u6709\u7ed3\u679c\u2019\u3002\u524d\u671f\u54b1\u4eec\u7a33\u624e\u7a33\u6253\u7ec3\u597d\u57fa\u672c\u529f\uff0c**\u6211\u4f1a\u5e2e\u4f60\u76ef\u7740\u9002\u5408\u4f60\u97f3\u8272\u7684\u5355\u5b50**\uff0c\u54b1\u4eec\u7684\u76ee\u6807\u4e0d\u662f\u2018\u5feb\u2019\uff0c\u800c\u662f\u2018\u7a33\u2019\u548c\u2018\u6301\u7eed\u2019\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011** (\u6838\u5fc3\u6ee1\u8db3\u5176\u5b89\u5168\u9700\u6c42) + **\u3010\u5174\u8da3\u6e38\u4e50\u7ebf\u3011** (\u8f85\u52a9\u57f9\u517b\u957f\u671f\u5174\u8da3\uff0c\u964d\u4f4e\u7eaf\u529f\u5229\u5fc3\u6001)\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T4\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u786c\u6838\u6d3e\u5355\u62e6\u622a\u5305\u3011**\uff1a\u5728\u5f00\u8425\u521d\u671f\uff0c**\u52a1\u5fc5\u5b89\u63921-2\u4e2a\u771f\u5b9e\u3001\u4f4e\u95e8\u69db\u3001\u6709\u53cd\u9988\u7684\u8bd5\u97f3\u673a\u4f1a**\uff08\u54ea\u6015\u5355\u4ef7\u4f4e\uff09\uff0c\u7528\u4e8e\u5efa\u7acb\u201c\u5b66\u4e60-\u63a5\u5355\u201d\u7684\u6b63\u5411\u5faa\u73af\uff0c\u7a33\u4f4f\u5176\u5fc3\u6001\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u6301\u7eed\u753b\u201c\u8f7b\u677e\u6708\u5165\u8fc7\u4e07\u201d\u7684\u5927\u997c\uff0c\u800c\u4e0d\u7ed9\u5177\u4f53\u8def\u5f84\u548c\u521d\u671f\u5c0f\u7ed3\u679c\u30022. \u53ea\u8bb2\u9ad8\u6df1\u6280\u5de7\uff0c\u4e0d\u8054\u7cfb\u5b9e\u9645\u53d8\u73b0\u53ef\u80fd\u30023. \u5ffd\u89c6\u5176\u5f85\u4e1a\u72b6\u6001\u4e0b\u7684\u7126\u8651\uff0c\u53ea\u8c08\u5174\u8da3\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u5fc5\u987b\u4e0e\u660e\u786e\u7684\u3001\u9636\u68af\u5f0f\u7684\u63a5\u5355\u8def\u5f84\u7ed1\u5b9a**\u3002\u4f8b\u5982\uff1a\u201c\u5b66\u5b8c\u8fd9\u4e2a\u6a21\u5757\uff0c\u4f60\u5c31\u80fd\u63a5XX\u7c7b\u578b\u7684\u5355\uff0c\u5747\u4ef7\u5728XX\u5143\u201d\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5317\u4eac\uff0c\u76ee\u524d\u5f85\u4e1a\u201d **(\u5b89\u5168\u9700\u6c42\u4e0e\u53d8\u73b0\u52a8\u673a\u7684\u76f4\u63a5\u8bc1\u636e)**\n2. > \u201c\u8fd9\u4e2a\u804c\u4e1a\u592a\u6709\u8da3\u4e86\u201d **(\u5174\u8da3\u840c\u82bd\uff0c\u52a8\u673a\u7eaf\u5ea6\u6709\u63d0\u5347\u6f5c\u529b)**\n3. > \u201c\u5fc5\u987b\u8ddf\u5e08\u59d0\u597d\u597d\u5b66\u4e60\u201d **(\u5b58\u5728\u4f9d\u8d56\u5fc3\u7406\uff0c\u9700\u8981\u5f15\u5bfc\u800c\u975e\u653e\u517b)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4\u641e\u94b1\u7ed3\u679c\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\uff08\u804c\u4e1a\u4e0e\u6536\u5165\u4fdd\u969c\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u504f\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5728\u5f00\u8425\u521d\u671f\u63d0\u4f9b1-2\u4e2a\u771f\u5b9e\u3001\u4f4e\u95e8\u69db\u7684\u8bd5\u97f3\u673a\u4f1a\uff0c\u5efa\u7acb\u201c\u5b66\u4e60-\u6709\u7ed3\u679c\u201d\u7684\u5373\u65f6\u6b63\u53cd\u9988\uff0c\u4e25\u9632\u6536\u76ca\u843d\u5dee\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u578b\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\u504f\u9ad8\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf+\u5174\u8da3\u6e38\u4e50\u7ebf\"}\n```";
