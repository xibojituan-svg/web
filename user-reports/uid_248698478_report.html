        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 248698478 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-06 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u656c\u94a67(\u656c\u94a6)\u3001\u8881\u6765\u662f\u4f601(\u8881\u9759\u9759) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u5199\u4f5c\u8bfe (\u57fa\u7840\u73ed2880\u5143\uff0c\u65d7\u8230\u73ed4380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3** (\u7528\u6237\u8868\u793a\u201c\u660e\u5929\u4e0b\u5348\u6c47\u6b3e\u201d\uff0c\u9500\u552e\u591a\u6b21\u8be2\u95ee\u82b1\u5457/\u4fe1\u7528\u5361\u652f\u4ed8\u65b9\u5f0f\uff0c\u7528\u6237\u672a\u6b63\u9762\u56de\u5e94\uff0c\u7591\u4f3c\u9700\u7b79\u63aa\u8d44\u91d1) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u7528\u6237\u63d0\u53ca\u201c\u4eca\u5929\u6709\u70b9\u5fd9\uff0c\u4f5c\u4e1a\u8fd8\u6ca1\u5b8c\u6210\u5462\u201d\uff0c\u5b66\u4e60\u65f6\u95f4\u9700\u6324\u5360) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** (\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff0c\u9700\u91cd\u70b9\u6838\u67e5) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** (\u7528\u6237\u4e3b\u52a8\u53d1\u8a00\u6781\u5c11\uff0c\u591a\u4e3a\u88ab\u52a8\u56de\u5e94\uff0c\u5173\u952e\u4fe1\u606f\u5982\u804c\u4e1a\u3001\u5bb6\u5ead\u3001\u5177\u4f53\u7ecf\u6d4e\u72b6\u51b5\u3001\u5b66\u4e60\u76ee\u6807\u5747\u672a\u900f\u9732) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b07\u4f4e\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u7eaf\u4e3a\u51e0\u5929\u5185\u63d0\u73b0\u4fdd\u5e95\u800c\u6765(\u4f4e\u6781\u5371)**\u3002\u7528\u6237\u5168\u7a0b\u672a\u8868\u8fbe\u5bf9AI\u5199\u4f5c\u672c\u8eab\u7684\u5174\u8da3\u6216\u80fd\u529b\u6210\u957f\u7684\u6e34\u671b\uff0c\u552f\u4e00\u4e3b\u52a8\u63d0\u95ee\u805a\u7126\u4e8e\u201c\u591a\u5c11\u94b1\u201d\u3001\u201c\u540e\u7eed\u60f3\u5347\u53e6\u4e00\u4e2a\u73ed\u662f\u8865\u5dee\u4ef7\u4e48\uff1f\u5dee\u4ef7\u8865\u591a\u5c11\uff1f\u201d\uff0c\u8868\u73b0\u51fa\u5bf9\u4ef7\u683c\u548c\u201c\u5347\u7ea7\u201d\u8def\u5f84\u7684\u6781\u5ea6\u654f\u611f\uff0c\u6838\u5fc3\u52a8\u673a\u662f\u5feb\u901f\u3001\u4f4e\u95e8\u69db\u53d8\u73b0\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u591a\u5c11\u94b1\uff1f\u201d > \u201c\u540e\u7eed\u60f3\u5347\u53e6\u4e00\u4e2a\u73ed\u662f\u8865\u5dee\u4ef7\u4e48\uff1f\u5dee\u4ef7\u8865\u591a\u5c11\uff1f\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u9500\u552e\u53cd\u590d\u5f3a\u8c03\u652f\u6301\u82b1\u5457\u3001\u4fe1\u7528\u5361\uff0c\u5e76\u63d0\u53ca\u201c\u5982\u679c\u8d44\u91d1\u538b\u529b\u5f88\u5927\uff0c\u5c31\u5148\u62a5\u57fa\u7840\u73ed\u201d\uff0c\u7528\u6237\u6700\u7ec8\u4ed8\u6b3e\u65b9\u5f0f\u4e3a\u201c\u6c47\u6b3e\u201d\uff0c\u4e14\u8fc7\u7a0b\u72b9\u8c6b\uff0c\u8868\u660e2880\u5143\u5b66\u8d39\u5bf9\u5176\u6784\u6210\u663e\u8457\u7ecf\u6d4e\u538b\u529b\uff0c\u652f\u4ed8\u80fd\u529b\u8106\u5f31\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d\u4f4e** \u2014 \u7528\u6237\u8868\u793a\u201c\u4eca\u5929\u6709\u70b9\u5fd9\uff0c\u4f5c\u4e1a\u8fd8\u6ca1\u5b8c\u6210\u5462\u201d\uff0c\u4e14\u5bf9\u76f4\u64ad\u8bfe\u53c2\u4e0e\u5ea6\u4e0d\u9ad8\uff08\u4e24\u6b21\u53cd\u6620\u8fdb\u4e0d\u53bb/\u53ea\u80fd\u770b\u56de\u653e\uff09\uff0c\u663e\u793a\u5176\u53ef\u7528\u4e8e\u5b66\u4e60\u7684**\u6574\u5757\u65f6\u95f4\u548c\u7cbe\u529b\u6709\u9650**\uff0c\u4f9d\u8d56\u788e\u7247\u5316\u5b66\u4e60\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u804a\u5929\u8bb0\u5f55\u5b8c\u5168\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\uff0c**\u8fd9\u662f\u6781\u9ad8\u98ce\u9669\u4fe1\u53f7**\u3002\u9500\u552e\u66fe\u4e3e\u4f8b\u201c\u80cc\u7740\u5bb6\u4eba\u53bb\u62a5\u7684\u201d\u5b66\u5458\uff0c\u53ef\u80fd\u6697\u793a\u6216\u8bd5\u63a2\uff0c\u4f46\u7528\u6237\u672a\u56de\u5e94\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u7528\u6237\u4ec5\u6709\u7684\u4e24\u6b21\u81ea\u6211\u8868\u8fbe\u5747\u6307\u5411\u8d1f\u9762\u81ea\u6211\u8bc4\u4ef7\uff1a\u201c\u73b0\u5728\u5b66\u4e60\u80fd\u529b\u6709\u4e9b\u5f31\u201d\u3001\u201c\u4f5c\u4e1a\u8fd8\u6ca1\u5b8c\u6210\u5462[\u5c34\u5c2c]\u201d\uff0c\u8868\u73b0\u51fa**\u5f3a\u70c8\u7684\u81ea\u6211\u6000\u7591\u548c\u4f4e\u6548\u80fd\u611f**\u3002\u9762\u5bf9\u521d\u671f\u6280\u672f\u95ee\u9898\uff08\u8fdb\u4e0d\u53bb\u76f4\u64ad\uff09\u672a\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\uff0c\u800c\u662f\u88ab\u52a8\u7b49\u5f85\u3002\u8fd9\u662f\u5178\u578b\u7684**\u4f4e\u5fc3\u7406\u5f39\u6027**\u548c**\u9ad8\u60c5\u7eea\u4f9d\u8d56**\u524d\u5146\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5148\u542c\u5b8c\u4eca\u5929\u7684\u8bfe\u518d\u8bf4\uff0c\u73b0\u5728\u5b66\u4e60\u80fd\u529b\u6709\u4e9b\u5f31\u201d > \u201c\u55ef\uff0c\u4eca\u5929\u6709\u70b9\u5fd9\uff0c\u4f5c\u4e1a\u8fd8\u6ca1\u5b8c\u6210\u5462[\u5c34\u5c2c]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u4e3b\u4e1a\u6536\u5165\u4e0d\u7a33\u5b9a\u6216\u4e0d\u8db3\u7684\u6df1\u5ea6\u7126\u8651\uff0c\u4ee5\u53ca\u5bf9\u81ea\u8eab\u5b66\u4e60\u80fd\u529b\u548c\u672a\u6765\u7ade\u4e89\u529b\u7684\u4e0d\u81ea\u4fe1**\u3002\u4ed6\u5bfb\u6c42\u7684\u5e76\u975e\u5174\u8da3\u6216\u6210\u5c31\uff0c\u800c\u662f\u4e00\u4e2a\u80fd\u5feb\u901f\u5e26\u6765\u73b0\u91d1\u6d41\u5165\u3001\u62b5\u5fa1\u751f\u6d3b\u98ce\u9669\u7684\u201c\u5b89\u5168\u57ab\u201d\u3002\u9500\u552e\u201c\u4e3b\u4e1a+\u526f\u4e1a=\u4e0d\u6015\u5931\u4e1a\uff01\u201d\u7684\u8bdd\u672f\u7cbe\u51c6\u51fb\u4e2d\u5176\u75db\u70b9\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u521d\u671f\u6781\u81f4\u7684\u201c\u88ab\u63a5\u7eb3\u201d\u4e0e\u201c\u88ab\u80af\u5b9a\u201d\u5b89\u5168\u611f\uff0c\u4ee5\u53ca\u6e05\u6670\u3001\u65e0\u538b\u529b\u7684\u5fae\u5c0f\u6b63\u53cd\u9988\u5faa\u73af**\u3002\u4ed6\u9700\u8981\u88ab\u53cd\u590d\u544a\u77e5\u201c\u4f60\u53ef\u4ee5\u201d\u3001\u201c\u5f88\u7b80\u5355\u201d\uff0c\u5e76\u5728\u6700\u521d\u9636\u6bb5\u907f\u514d\u4efb\u4f55\u53ef\u80fd\u5f3a\u5316\u5176\u201c\u6211\u80fd\u529b\u5f31\u201d\u8ba4\u77e5\u7684\u6311\u6218\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2 \u7c7b** (\u52a8\u673a\u7eaf\u5ea6\u4f4e\u3001\u8d44\u6e90\u5e95\u5ea7\u5b58\u5728\u660e\u663e\u77ed\u677f\u3001\u5fc3\u7406\u5f39\u6027\u6781\u4f4e) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u4f4e\u81ea\u4fe1\u3001\u9ad8\u4f9d\u8d56\u3001\u56de\u907f\u56f0\u96be\u3001\u6838\u5fc3\u8bc9\u6c42\u662f\u60c5\u7eea\u5b89\u629a\u4e0e\u7edd\u5bf9\u5b89\u5168) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u4f46\u5904\u4e8e\u8fb9\u7f18\uff0c\u56e0\u652f\u4ed8\u65b9\u5f0f\u5b58\u7591\u4e14\u5bb6\u5ead\u652f\u6301\u5ea6\u672a\u77e5)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u660e\u786e\u89e6\u53d1\u501f\u8d37\u7ea2\u7ebf\uff0c\u4f46**\u8d44\u91d1\u538b\u529b\u5927**\u548c**\u5bb6\u5ead\u652f\u6301\u5ea6\u672a\u77e5**\u662f\u4e24\u5927\u9ad8\u5371\u5f15\u4fe1\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u9ad8** | \u5bb6\u5ead\u4e0d\u77e5\u60c5\u6216\u53cd\u5bf9\uff0c\u4e00\u65e6\u53d1\u73b0\u8fd9\u7b14\u201c\u4e0d\u5fc5\u8981\u201d\u7684\u5f00\u9500\uff0c\u6781\u6613\u5f15\u53d1\u5f3a\u70c8\u5e72\u9884\u5e76\u8981\u6c42\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | \u5de5\u4f5c/\u751f\u6d3b\u4e00\u5fd9\uff0c\u65e0\u6cd5\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\uff0c\u4ea7\u751f\u201c\u6211\u8ddf\u4e0d\u4e0a\u201d\u3001\u201c\u6211\u592a\u7b28\u201d\u7684\u7d2f\u79ef\u6027\u632b\u8d25\u611f\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u9996\u6b21\u63d0\u4ea4\u4f5c\u4e1a\u540e\u82e5\u5f97\u5230\u975e\u5168\u76d8\u80af\u5b9a\u7684\u53cd\u9988\uff0c\u6216\u9047\u5230\u8f6f\u4ef6\u5b89\u88c5\u3001\u6307\u4ee4\u7406\u89e3\u7b49\u4efb\u4f55\u5fae\u5c0f\u6280\u672f\u969c\u788d\uff0c\u90fd\u53ef\u80fd\u6210\u4e3a\u5176\u201c\u6211\u4e0d\u884c\u201d\u7684\u8bc1\u660e\uff0c\u76f4\u63a5\u89e6\u53d1\u9000\u8d39\u3002** |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | \u5f00\u8bfe1-2\u5468\u5185\u82e5\u672a\u611f\u53d7\u5230\u201c\u5feb\u901f\u53d8\u73b0\u201d\u7684\u82d7\u5934\uff08\u5982\u63a5\u5230\u5fae\u5c0f\u5546\u5355\uff09\uff0c\u4f1a\u5bf9\u9500\u552e\u627f\u8bfa\u4ea7\u751f\u5de8\u5927\u6000\u7591\u5e76\u6295\u8bc9\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c\u4e00\u5468\u81f3\u7b2c\u4e8c\u5468**\u3002\u9996\u6b21\u6b63\u5f0f\u4f5c\u4e1a\u63d0\u4ea4\u4e0e\u53cd\u9988\u671f\u3001\u9996\u6b21\u611f\u53d7\u5230\u5b66\u4e60\u4e0e\u5b9e\u9645\u53d8\u73b0\u7684\u8ddd\u79bb\u671f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c[\u7528\u6237\u6635\u79f0]\uff0c\u6b22\u8fce\u52a0\u5165\uff01\u7279\u522b\u7406\u89e3\u54b1\u4eec\u5e73\u65f6\u5fd9\uff0c\u8fd8\u8981\u62bd\u7a7a\u5b66\u4e60\u65b0\u4e1c\u897f\u7684\u4e0d\u5bb9\u6613\u3002\u54b1\u4eec\u8fd9\u4e2a\u73ed\u4e0d\u5377\u8fdb\u5ea6\uff0c\u4e0d\u6bd4\u8f83\uff0c\u4f60\u7684\u6bcf\u4e00\u6b65\u90fd\u503c\u5f97\u9f13\u638c\u3002\u8bb0\u4f4f\uff0c\u5728\u8fd9\u91cc\u6ca1\u6709\u2018\u5b66\u4e0d\u4f1a\u2019\uff0c\u53ea\u6709\u2018\u6211\u4eec\u4e00\u8d77\u6162\u6162\u641e\u5b9a\u2019\u3002\u6709\u4efb\u4f55\u4e00\u4e01\u70b9\u5361\u4f4f\u7684\u5730\u65b9\uff0c\u54ea\u6015\u662f\u4e00\u4e2a\u6309\u94ae\u627e\u4e0d\u5230\uff0c\u968f\u65f6\u558a\u6211\uff0c\u6211\u79d2\u56de\u3002\u54b1\u4eec\u7684\u9996\u8981\u4efb\u52a1\u4e0d\u662f\u6210\u4e3a\u5927\u5e08\uff0c\u800c\u662f\u5148\u8f7b\u677e\u5730\u73a9\u8d77\u6765\uff0c\u8d5a\u70b9\u5c0f\u5f00\u5fc3\u548c\u5c0f\u96f6\u82b1\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\u3011**\u3002\u6838\u5fc3\u76ee\u6807\u662f\u7ef4\u6301\u5176\u5b66\u4e60\u60c5\u7eea\u7a33\u5b9a\uff0c\u907f\u514d\u632b\u8d25\u611f\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u5f3a\u5236\u6302\u8f7d **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u5305\u62ec\uff1a\u6bcf\u65e5\u201c\u5fae\u5c0f\u6210\u5c31\u201d\u6253\u5361\uff08\u5982\uff1a\u4eca\u5929\u6253\u5f00\u4e86AI\u5de5\u5177\uff09\u3001\u73ed\u4e3b\u4efb\u201c\u65e0\u8111\u5938\u201d\u8bdd\u672f\u5e93\uff08\u9488\u5bf9\u4efb\u4f55\u5fae\u5c0f\u63d0\u4ea4\uff09\u3001\u7b80\u5316\u5230\u6781\u81f4\u7684\u201c\u4e00\u53e5\u8bdd\u4f5c\u4e1a\u201d\u66ff\u4ee3\u590d\u6742\u4efb\u52a1\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u4ed6\u4f7f\u7528\u4efb\u4f55\u6279\u8bc4\u6216\u6307\u51fa\u4e0d\u8db3\u7684\u70b9\u8bc4**\uff0c\u6240\u6709\u53cd\u9988\u5fc5\u987b\u5305\u88f9\u5728\u201c\u4f60\u5df2\u7ecf\u5f88\u68d2\u4e86\uff0c\u5982\u679c\u8fd9\u91cc\u7a0d\u5fae\u2026\u2026\u5c31\u66f4\u5b8c\u7f8e\u4e86\u201d\u7684\u7cd6\u8863\u91cc\u3002\n    2. **\u7edd\u4e0d\u5728\u524d\u4e24\u5468\u5e03\u7f6e\u4efb\u4f55\u6709\u96be\u5ea6\u7684\u3001\u9700\u8981\u72ec\u7acb\u521b\u4f5c\u7684\u4f5c\u4e1a**\uff0c\u5168\u90e8\u63d0\u4f9b\u201c\u590d\u5236-\u7c98\u8d34-\u5fae\u8c03\u201d\u7684\u50bb\u74dc\u5f0f\u6a21\u677f\u3002\n    3. **\u7edd\u53e3\u4e0d\u63d0\u201c\u5b66\u9738\u201d\u3001\u201c\u4f18\u79c0\u5b66\u5458\u6848\u4f8b\u201d**\uff0c\u907f\u514d\u5176\u8fdb\u884c\u4e0d\u5229\u6bd4\u8f83\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u57fa\u7840\u73ed\u7ed3\u4e1a\u4e14\u5176\u6709\u660e\u663e\u6b63\u53cd\u9988\uff08\u5982\u6536\u5230\u7b2c\u4e00\u7b14\u5fae\u5c0f\u6536\u76ca\u6216\u6301\u7eed\u6253\u5361\uff09\u4e4b\u524d\uff0c\u4e25\u7981\u63d0\u53ca\u65d7\u8230\u73ed\u3001\u4efb\u4f55\u9ad8\u9636\u8bfe\u7a0b\u6216\u5927\u989d\u6d88\u8d39\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5148\u542c\u5b8c\u4eca\u5929\u7684\u8bfe\u518d\u8bf4\uff0c**\u73b0\u5728\u5b66\u4e60\u80fd\u529b\u6709\u4e9b\u5f31**\u201d\n2. > \u201c\u55ef\uff0c**\u4eca\u5929\u6709\u70b9\u5fd9\uff0c\u4f5c\u4e1a\u8fd8\u6ca1\u5b8c\u6210\u5462[\u5c34\u5c2c]**\u201d\n3. > \u201c\u591a\u5c11\u94b1\uff1f\u201d\u3001\u201c\u540e\u7eed\u60f3\u5347\u53e6\u4e00\u4e2a\u73ed\u662f\u8865\u5dee\u4ef7\u4e48\uff1f\u5dee\u4ef7\u8865\u591a\u5c11\uff1f\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u62b5\u5fa1\u7ecf\u6d4e\u4e0e\u80fd\u529b\u7126\u8651\u7684\u5b89\u5168\u4fdd\u969c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7528\u201c\u7597\u6108\u966a\u4f34\u7ebf\u201d\u5168\u7a0b\u6258\u5e95\uff0c\u63d0\u4f9b\u65e0\u538b\u529b\u3001\u9ad8\u80af\u5b9a\u7684\u50bb\u74dc\u5f0f\u5b66\u4e60\u8def\u5f84\uff0c\u4e25\u9632\u4efb\u4f55\u632b\u6298\u611f\u4ea7\u751f\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
