    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d-\u9ad8)**: \u660e\u786e\u7ecf\u6d4e\u538b\u529b\u9a71\u52a8\uff08\u201c\u5de5\u8d44\u53d1\u4e0d\u51fa\u6765\uff0c\u538b\u529b\u4e5f\u5927\u201d\uff09\uff0c\u5bfb\u6c42\u517c\u804c\u8865\u8d34\u5bb6\u7528\u3002\u5bf9AI\u5199\u4f5c\u53d8\u73b0\u8def\u5f84\u6709\u521d\u6b65\u5174\u8da3\u548c\u63a2\u7d22\u884c\u4e3a\uff08\u5b8c\u6210\u4f5c\u4e1a\u3001\u63d0\u95ee\u6da6\u8272\uff09\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u521b\u4f5c\u70ed\u60c5\u6216\u804c\u4e1a\u8f6c\u578b\u51b3\u5fc3\uff0c\u66f4\u591a\u662f\u751f\u5b58\u538b\u529b\u4e0b\u7684\u52a1\u5b9e\u5c1d\u8bd5\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4f4e)**: \u7ecf\u6d4e\u72b6\u51b5\u7d27\u5f20\uff08\u6570\u6708\u672a\u53d1\u5de5\u8d44\uff09\uff0c\u9700\u4f7f\u7528\u5206\u671f\u652f\u4ed84380\u5143\u8bfe\u7a0b\u3002\u65f6\u95f4\u8d44\u6e90\u53d7\u9650\uff08\u5de5\u4f5c\u6709\u4e2d\u73ed\uff0c\u9700\u534f\u8c03\u4e0a\u8bfe\uff09\u3002**\u652f\u4ed8\u80fd\u529b\u662f\u663e\u8457\u77ed\u677f**\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d)**: \u6c9f\u901a\u6001\u5ea6\u79ef\u6781\u3001\u793c\u8c8c\uff0c\u80fd\u914d\u5408\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\u3002\u9762\u5bf9\u7ecf\u6d4e\u538b\u529b\u672a\u8868\u73b0\u51fa\u6781\u7aef\u7126\u8651\u6216\u62b1\u6028\uff0c\u4f46\u51b3\u7b56\u7565\u663e\u88ab\u52a8\uff0c\u5bf9\u5206\u671f\u7ec6\u8282\uff08\u5229\u606f\uff09\u654f\u611f\u3002\u6709\u4e00\u5b9a\u5b66\u4e60\u97e7\u6027\uff0c\u4f46\u6297\u98ce\u9669\u80fd\u529b\u5f31\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u901a\u8fc7\u82b1\u5457\u5206\u671f\u652f\u4ed8\u4e864380\u5143\u8bfe\u7a0b\u8d39\u7528\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: \u672a\u63d0\u53ca\u914d\u5076\u6216\u5bb6\u5ead\u5176\u4ed6\u6210\u5458\uff0c\u4fe1\u606f\u4e0d\u8db3\u3002\u4f46\u4ece\u5176\u201c\u8865\u8d34\u5bb6\u7528\u201d\u7684\u8868\u8ff0\u53ca\u72ec\u7acb\u5b8c\u6210\u652f\u4ed8\u51b3\u7b56\u770b\uff0c**\u521d\u6b65\u5224\u65ad\u4e3a\u4e2a\u4eba\u4e3b\u8981\u51b3\u7b56\u8005**\u3002\n*   **\u6b65\u9aa41 - \u9700\u6c42\u771f\u5b9e\u6027**: \u771f\u5b9e\u3002\u5b58\u5728\u660e\u786e\u7684\u8d22\u52a1\u538b\u529b\u4e0e\u589e\u6536\u9700\u6c42\u3002\n*   **\u6b65\u9aa42 - \u652f\u4ed8\u80fd\u529b**: **\u5f31**\u3002\u4f9d\u8d56\u5206\u671f\uff0c\u4e14\u5bf9\u5206\u671f\u5229\u606f\u654f\u611f\uff0c\u8868\u660e\u7ecf\u6d4e\u7f13\u51b2\u7a7a\u95f4\u6781\u5c0f\u3002\n*   **\u6b65\u9aa43 - \u51b3\u7b56\u81ea\u4e3b\u6027**: \u4e2d\u3002\u867d\u6709\u9500\u552e\u5f15\u5bfc\uff0c\u4f46\u7528\u6237\u4e3b\u52a8\u8be2\u95ee\u4ef7\u683c\u3001\u5206\u671f\u7ec6\u8282\uff0c\u5e76\u6700\u7ec8\u5b8c\u6210\u652f\u4ed8\uff0c\u5177\u5907\u57fa\u672c\u51b3\u7b56\u6d41\u7a0b\u3002\n*   **\u6b65\u9aa44 - \u884c\u52a8\u529b\u4e0e\u914d\u5408\u5ea6**: \u4e2d\u9ad8\u3002\u80fd\u6309\u65f6\u53c2\u4e0e\u4e92\u52a8\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u89c2\u770b\u76f4\u64ad\uff0c\u914d\u5408\u5ea6\u826f\u597d\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**: **C\u7c7b\u7528\u6237 (\u9700\u6c42\u771f\u5b9e\u4f46\u652f\u4ed8\u80fd\u529b\u5f31)**\u3002\u6838\u5fc3\u77db\u76fe\u5728\u4e8e**\u5f3a\u70c8\u7684\u7ecf\u6d4e\u6539\u5584\u52a8\u673a\u4e0e\u8106\u5f31\u7684\u8d22\u52a1\u5e95\u5ea7\u4e4b\u95f4\u7684\u5de8\u5927\u843d\u5dee**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n**T7 \u751f\u5b58\u7126\u8651\u578b**\n*   **\u6838\u5fc3\u7279\u5f81**: \u88ab\u73b0\u5b9e\u7ecf\u6d4e\u538b\u529b\uff08\u5de5\u8d44\u62d6\u6b20\uff09\u9a71\u52a8\uff0c\u5b66\u4e60\u76ee\u6807\u76f4\u63a5\u6307\u5411\u201c\u8d5a\u94b1\u8865\u8d34\u5bb6\u7528\u201d\uff0c\u5bf9\u6295\u5165\u56de\u62a5\u5468\u671f\u548c\u786e\u5b9a\u6027\u6709\u9ad8\u671f\u5f85\u3002\n*   **\u884c\u4e3a\u5370\u8bc1**: \u591a\u6b21\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\uff1b\u9009\u62e9\u66f4\u9ad8\u4ef7\u76844380\u8bfe\u7a0b\uff08\u53ef\u80fd\u8ba4\u4e3a\u5305\u542b\u77ed\u5267\u5267\u672c\u66f4\u5177\u53d8\u73b0\u6f5c\u529b\uff09\uff1b\u652f\u4ed8\u540e\u7acb\u5373\u8be2\u95ee\u6295\u7a3f\u901a\u9053\uff0c\u8868\u73b0\u51fa\u5bf9\u5feb\u901f\u53d8\u73b0\u7684\u6025\u5207\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4e2d-\u9ad8)\n*   **\u6839\u56e01 - \u6548\u679c\u672a\u8fbe\u9884\u671f (\u9ad8\u98ce\u9669)**: \u7528\u6237\u5bf9\u201c\u8d5a\u94b1\u201d\u6709\u6025\u5207\u3001\u5177\u4f53\u7684\u671f\u5f85\u3002\u82e5\u5b66\u4e60\u540e\u672a\u80fd\u5feb\u901f\u83b7\u5f97\u53ef\u89c2\u6536\u5165\uff08\u5c24\u5176\u662f\u8003\u8651\u5230\u5176\u7ecf\u6d4e\u538b\u529b\uff09\uff0c\u6781\u6613\u4ea7\u751f\u201c\u88ab\u9a97\u201d\u611f\uff0c\u5f15\u53d1\u6295\u8bc9\u3002\n*   **\u6839\u56e02 - \u8d44\u91d1\u538b\u529b (\u9ad8\u98ce\u9669)**: **\u5df2\u4f7f\u7528\u5206\u671f\u4ed8\u6b3e**\u3002\u82e5\u540e\u7eed\u4e3b\u4e1a\u6536\u5165\u6301\u7eed\u4e0d\u7a33\u5b9a\uff0c\u5206\u671f\u8fd8\u6b3e\u5c06\u6210\u4e3a\u6c89\u91cd\u8d1f\u62c5\uff0c\u53ef\u80fd\u89e6\u53d1\u201c\u51b2\u52a8\u6d88\u8d39\u540e\u6094\u201d\u800c\u8981\u6c42\u9000\u8d39\u3002\n*   **\u6839\u56e03 - \u65f6\u95f4\u51b2\u7a81 (\u4e2d\u98ce\u9669)**: \u7528\u6237\u5de5\u4f5c\u6709\u4e2d\u73ed\uff0c\u65f6\u95f4\u4e0d\u56fa\u5b9a\u3002\u6b63\u5f0f\u8bfe\u8bfe\u4e1a\u82e5\u4e0e\u5de5\u4f5c\u65f6\u95f4\u51b2\u7a81\uff0c\u53ef\u80fd\u5bfc\u81f4\u65e0\u6cd5\u8ddf\u8fdb\uff0c\u4ea7\u751f\u632b\u8d25\u611f\u3002\n*   **\u6839\u56e04 - \u8bfe\u7a0b\u96be\u5ea6 (\u4e2d\u98ce\u9669)**: \u7528\u6237\u5df2\u610f\u8bc6\u5230\u201c\u8981\u4e0b\u529f\u592b\u201d\uff0c\u82e5\u5b9e\u64cd\u4e2d\u9047\u5230\u74f6\u9888\uff0c\u5728\u7126\u8651\u5fc3\u6001\u4e0b\u5bb9\u6613\u653e\u5f03\u3002\n*   **\u6839\u56e05 - \u9500\u552e\u627f\u8bfa**: \u9500\u552e\u627f\u8bfa\u201c\u6709\u9002\u5408\u7684\u8d44\u6e90\u7ed9\u4f60\u4ecb\u7ecd\u201d\uff0c\u5e76\u63d0\u53ca\u201c\u4fdd\u62a4\u201d\uff08\u53ef\u9000\u8d39\uff09\u3002**\u6b64\u627f\u8bfa\u82e5\u672a\u5151\u73b0\uff0c\u5c06\u6210\u4e3a\u9000\u8d39\u76f4\u63a5\u5bfc\u706b\u7d22**\u3002\n*   **\u6839\u56e06 & 7 (\u670d\u52a1\u4e0e\u5e73\u53f0)**: \u76ee\u524d\u65e0\u4fe1\u53f7\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u98ce\u9669\u70b9**:\n    1.  **\u8fc7\u5ea6\u627f\u8bfa\u98ce\u9669**: \u9500\u552e\u5f3a\u8c03\u201c\u5b66\u5458\u5b66\u4e60\u671f\u95f4\u8d5a\u56de\u5b66\u8d39\u201d\u3001\u201c\u77ed\u5267\u6536\u7a3f\u975e\u5e38\u503c\u5f97\u201d\uff0c\u53ef\u80fd\u8425\u9020\u4e86\u4e0d\u5207\u5b9e\u9645\u7684\u6536\u5165\u9884\u671f\u3002\n    2.  **\u5411\u8106\u5f31\u4eba\u7fa4\u9500\u552e**: **\u5411\u5df2\u660e\u786e\u8868\u660e\u201c\u51e0\u4e2a\u6708\u6ca1\u53d1\u5de5\u8d44\u201d\u7684\u7528\u6237\u63a8\u9500\u56db\u5343\u4f59\u5143\u8bfe\u7a0b\u5e76\u5f15\u5bfc\u5206\u671f\uff0c\u5b58\u5728\u91cd\u5927\u4f26\u7406\u98ce\u9669**\u3002\u5c3d\u7ba1\u7528\u6237\u81ea\u4e3b\u51b3\u7b56\uff0c\u4f46\u9500\u552e\u672a\u5bf9\u5176\u8d22\u52a1\u98ce\u9669\u8fdb\u884c\u4efb\u4f55\u63d0\u793a\u6216\u7f13\u51b2\u5efa\u8bae\u3002\n    3.  **\u9000\u8d39\u627f\u8bfa\u6a21\u7cca**: \u9500\u552e\u63d0\u53ca\u201c\u8fc7\u7a0b\u4e2d\u968f\u65f6\u53ef\u4ee5\u63d0\u4ea4\u9000\u8d39\u7533\u8bf7\u201d\uff0c\u4f46\u672a\u8bf4\u660e\u5177\u4f53\u89c4\u5219\uff0c\u53ef\u80fd\u57cb\u4e0b\u7ea0\u7eb7\u9690\u60a3\u3002\n*   **\u5408\u89c4\u6027**: \u9500\u552e\u6d41\u7a0b\u5b8c\u6574\uff0c\u672a\u53d1\u73b0\u8fdd\u89c4\u8bdd\u672f\u3002\u4f46**\u5728\u7528\u6237\u8d22\u52a1\u8106\u5f31\u6027\u8bc6\u522b\u4e0e\u98ce\u9669\u544a\u77e5\u65b9\u9762\u5b58\u5728\u660e\u663e\u7f3a\u5931**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6838\u5fc3\u7b56\u7565**: **\u201c\u4fdd\u751f\u5b58\u3001\u7a33\u9884\u671f\u3001\u9632\u5d29\u584c\u201d**\u3002\u9996\u8981\u76ee\u6807\u662f\u907f\u514d\u7528\u6237\u56e0\u7ecf\u6d4e\u538b\u529b\u6216\u671f\u671b\u843d\u7a7a\u800c\u5d29\u6e83\u9000\u8d39\u3002\n*   **\u884c\u52a8\u6307\u5357**:\n    1.  **\u7d27\u6025\u5efa\u6863\u4e0e\u98ce\u9669\u6807\u8bb0**: \u7acb\u5373\u5c06\u8be5\u5b66\u5458\u6807\u8bb0\u4e3a**\u9ad8\u8d22\u52a1\u98ce\u9669\u3001\u9ad8\u9000\u8d39\u98ce\u9669\u7528\u6237**\u3002\u73ed\u4e3b\u4efb\u9700\u7b2c\u4e00\u65f6\u95f4\u5efa\u7acb\u6df1\u5ea6\u6c9f\u901a\uff0c\u4e86\u89e3\u5176\u5177\u4f53\u7ecf\u6d4e\u72b6\u51b5\u4e0e\u65f6\u95f4\u5b89\u6392\u3002\n    2.  **\u7ba1\u7406\u53d8\u73b0\u9884\u671f**: \u660e\u786e\u544a\u77e5AI\u5199\u4f5c\u53d8\u73b0\u9700\u8981\u65f6\u95f4\u79ef\u7d2f\u4e0e\u6301\u7eed\u7ec3\u4e60\uff0c\u521d\u671f\u6536\u5165\u53ef\u80fd\u5fae\u8584\u3002**\u5207\u5fcc\u9f13\u5439\u201c\u5feb\u94b1\u201d\u6848\u4f8b**\uff0c\u53ef\u5206\u4eab\u201c\u4ece\u517c\u804c\u8d77\u6b65\u3001\u9010\u6b65\u63d0\u5347\u201d\u7684\u666e\u901a\u5b66\u5458\u8def\u5f84\u3002\n    3.  **\u63d0\u4f9b\u5373\u65f6\u4ef7\u503c\u4e0e\u5fae\u5c0f\u6b63\u53cd\u9988**: \u5728\u8bfe\u7a0b\u521d\u671f\uff0c\u5c3d\u53ef\u80fd\u63d0\u4f9b\u80fd\u5feb\u901f\u4e0a\u624b\u3001\u83b7\u5f97\u5fae\u5c0f\u6210\u5c31\u611f\uff08\u5982\u5b8c\u6210\u4e00\u7bc7\u5b8c\u6574\u77ed\u6587\u3001\u83b7\u5f97\u4e00\u6b21\u4f5c\u4e1a\u597d\u8bc4\uff09\u7684\u4efb\u52a1\uff0c\u5e2e\u52a9\u5176\u5efa\u7acb\u4fe1\u5fc3\uff0c\u5bf9\u51b2\u7ecf\u6d4e\u7126\u8651\u3002\n    4.  **\u5f3a\u5316\u60c5\u611f\u652f\u6301\u4e0e\u8d44\u6e90\u94fe\u63a5**: \u73ed\u4e3b\u4efb\u9700\u626e\u6f14\u201c\u652f\u6301\u8005\u201d\u89d2\u8272\uff0c\u5b9a\u671f\u5173\u6000\uff0c\u503e\u542c\u5176\u538b\u529b\u3002**\u52a1\u5fc5\u5151\u73b0\u9500\u552e\u627f\u8bfa\u7684\u8d44\u6e90\u4ecb\u7ecd**\uff0c\u5373\u4f7f\u662f\u5c0f\u5546\u5355\u6216\u4f4e\u95e8\u69db\u6295\u7a3f\u673a\u4f1a\uff0c\u4e5f\u80fd\u6781\u5927\u589e\u5f3a\u4fe1\u4efb\u3002\n    5.  **\u7075\u6d3b\u5b66\u4e60\u652f\u6301**: \u4e3b\u52a8\u4e3a\u5176\u89c4\u5212\u7075\u6d3b\u7684\u5b66\u4e60\u65f6\u95f4\uff0c\u63d0\u4f9b\u5f55\u64ad\u3001\u8d44\u6599\u8865\u53d1\u7b49\u652f\u6301\uff0c\u964d\u4f4e\u5176\u56e0\u5de5\u4f5c\u51b2\u7a81\u5bfc\u81f4\u7684\u6389\u961f\u98ce\u9669\u3002\n    6.  **\u5bc6\u5207\u5173\u6ce8\u8fd8\u6b3e\u538b\u529b**: \u7559\u610f\u5176\u662f\u5426\u63d0\u53ca\u8fd8\u6b3e\u56f0\u96be\u3002\u5982\u6709\u8ff9\u8c61\uff0c\u5e94\u4e3b\u52a8\u6c9f\u901a\uff0c\u63a2\u8ba8\u89e3\u51b3\u65b9\u6848\uff08\u5982\u5b66\u4e60\u8ba1\u5212\u8c03\u6574\uff09\uff0c\u907f\u514d\u5176\u56e0\u8fd8\u6b3e\u538b\u529b\u76f4\u63a5\u653e\u5f03\u5b66\u4e60\u5e76\u5f3a\u70c8\u8981\u6c42\u9000\u8d39\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**:\n    *   \u8be5\u7528\u6237\u5df2\u62a5\u540d4380\u5143\u8bfe\u7a0b\uff08\u542b\u77ed\u5267\uff09\uff0c**\u65e0\u9700\u8c03\u6574\u4ea7\u54c1\u7ebf**\u3002\n    *   \u91cd\u70b9\u5728\u4e8e**\u5f3a\u5316\u8be5\u8bfe\u7a0b\u4f53\u7cfb\u4e2d\u201c\u5b9e\u6218\u3001\u6295\u7a3f\u3001\u8d44\u6e90\u5bf9\u63a5\u201d\u6a21\u5757\u7684\u4ea4\u4ed8**\uff0c\u8ba9\u5176\u5c3d\u5feb\u770b\u5230\u201c\u8def\u5f84\u201d\u800c\u4e0d\u4ec5\u662f\u201c\u77e5\u8bc6\u201d\u3002\n    *   \u53ef\u8003\u8651\u5728\u5e38\u89c4\u8bfe\u7a0b\u5916\uff0c**\u5b9a\u5411\u63a8\u9001\u4e00\u4e9b\u4f4e\u95e8\u69db\u7684\u5f81\u6587\u6d3b\u52a8\u6216\u5185\u90e8\u5546\u5355**\uff08\u5373\u4f7f\u7a3f\u8d39\u4e0d\u9ad8\uff09\uff0c\u4e3a\u5176\u521b\u9020\u65e9\u671f\u53d8\u73b0\u673a\u4f1a\uff0c\u8fd9\u662f\u7ef4\u7cfb\u5176\u5b66\u4e60\u52a8\u529b\u7684\u5173\u952e\u3002\n\n---\n{\"core_type\": \"T7 \u751f\u5b58\u7126\u8651\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168/\u751f\u5b58\", \"target_product_line\": \"\u5df2\u8d2dAI\u5199\u4f5c\u5168\u94fe\u8def\u8bfe\uff08\u542b\u77ed\u5267\uff09\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}";
