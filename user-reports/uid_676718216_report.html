        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v4.1.3)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676718216 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-02-06 \u81f3 2026-04-13 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u77b3\u77b3(\u8c37\u6d77\u9759) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u5df2\u8d2d\uff09\u3001AI\u97f3\u526a\u8bfe\u7a0b\uff08\u5df2\u8d2d\uff09\u3001\u8fd0\u8425\u8bfe\u7a0b\uff08\u610f\u5411\u8d2d\u4e70\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u5206\u671f\u6216\u501f\u8d37\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u591a\u6b21\u63d0\u53ca\u201c\u5728\u5916\u9762\u201d\u3001\u201c\u51fa\u6765\u5e72\u6d3b\u201d\u3001\u201c\u505a\u725b\u9a6c\u201d\uff0c\u663e\u793a\u65f6\u95f4\u4e0d\u56fa\u5b9a\uff0c\u9700\u6324\u65f6\u95f4\u5b66\u4e60\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u804a\u5929\u8bb0\u5f55\u8be6\u7ec6\uff0c\u80fd\u6e05\u6670\u5224\u65ad\u7528\u6237\u884c\u4e3a\u6a21\u5f0f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u6709\u660e\u786e\u7684\u53d8\u73b0\u8bc9\u6c42\uff08\u201c\u6211\u8fd8\u5f97\u6323\u5b66\u8d39\u201d\u3001\u201c\u5e94\u8058\u559c\u64ad\u201d\uff09\uff0c\u4f46\u540c\u65f6\u4e5f\u8868\u73b0\u51fa\u5bf9\u6280\u80fd\u5b66\u4e60\u672c\u8eab\u7684\u6295\u5165\u548c\u5174\u8da3\uff08\u79ef\u6781\u53c2\u4e0e\u8bbe\u5907\u8c03\u8bd5\u3001\u5173\u5fc3\u8bfe\u7a0b\u5185\u5bb9\uff09\u3002\u52a8\u673a\u662f\u201c\u53d8\u73b0+\u5b66\u4e60\u201d\u7684\u6df7\u5408\u4f53\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u5c31\u662f\u4e0b\u4e00\u671f\u7684\u62a5\u540d\u65f6\u95f4\u622a\u6b62\u5230\u4ec0\u4e48\u5440\uff1f\u6211\u8fd8\u5f97\u6323\u5b66\u8d39\uff0c\u6211\u73b0\u5728\u3002\u201d\n  > \u201c\u8981\u662f\u5e94\u8058\u559c\u64ad\u7684\u8bdd\uff0c\u6709\u5e74\u9f84\u9650\u5236\u5427\uff1f\u6211\u6015\u6211\u8fd9\u4e2a\u5728\u5b66\u4e60\u5b8c\u5dee\u4e0d\u591a\uff0c\u7136\u540e\u5c31\u662f\u5e74\u9f84\u53c8\u4e0d\u7b26\u5408\u8981\u6c42\u4e86\u3002\u201d\n  > \u201c\u73ed\u73ed\u90a3\u4e2a\u8fd0\u8425\u8bfe\u600e\u4e48\u62a5\u540d\uff1f\u6211\u62a5\u4e0b\u4e2a\u6708\u7684\u8bfe\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e (3-4\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 **\u8d44\u91d1\u627f\u8f7d\u529b**\uff1a**\u4e2d** \u2014 \u6709\u80fd\u529b\u8d2d\u4e70\u82f9\u679c\u7535\u8111\uff08\u201c\u4e0d\u5230\u4e24\u5e74\u7684\u6c34\u679c\u672c\u201d\uff09\u3001\u4e13\u4e1a\u8bbe\u5907\uff0c\u5e76\u6301\u7eed\u4ed8\u8d39\u8d2d\u4e70\u8bfe\u7a0b\uff08\u6709\u58f0\u3001AI\u97f3\u526a\u3001\u8fd0\u8425\u8bfe\uff09\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u7ecf\u6d4e\u57fa\u7840\u3002\n- \u23f1 **\u65f6\u95f4\u4e0e\u7cbe\u529b**\uff1a**\u4f4e** \u2014 \u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\uff0c\u9700\u201c\u505a\u725b\u9a6c\u201d\u6324\u51fa\u65f6\u95f4\u5b66\u4e60\uff0c\u4e14\u8bbe\u5907\u8c03\u8bd5\u5360\u7528\u4e86\u5927\u91cf\u7cbe\u529b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 **\u5bb6\u5ead\u652f\u6301\u5ea6**\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n- **\u7269\u7406\u786c\u4ef6\u4e0e\u8ba4\u77e5\u57fa\u5efa**\uff1a**\u6781\u4f4e** \u2014 **\u6838\u5fc3\u77ed\u677f**\u3002\u7528\u6237\u9762\u4e34\u4e25\u91cd\u7684**\u6570\u5b57\u9e3f\u6c9f**\u548c**\u8bbe\u5907\u517c\u5bb9\u6027\u95ee\u9898**\uff1a\n  1.  **\u6570\u5b57\u64cd\u4f5c\u6050\u614c**\uff1a\u4e0d\u4f1a\u5b89\u88c5AU\u3001\u627e\u4e0d\u5230\u559c\u9a6cUID\u3001\u4e0d\u4f1a\u521b\u5efa\u817e\u8baf\u4f1a\u8bae\u3001\u627e\u4e0d\u5230\u7b7e\u5230\u5165\u53e3\u3001\u64cd\u4f5cAU\u754c\u9762\u56f0\u96be\u3002\n  2.  **\u8bbe\u5907\u517c\u5bb9\u56f0\u5883**\uff1a\u82f9\u679c\u7535\u8111\uff08\u8f83\u65b0\u7248\u672c\uff09\u5bfc\u81f4AU\u3001\u865a\u62df\u673a\u3001\u63d2\u4ef6\uff08\u80a5\u6ce2\u3001RX\uff09\u5b89\u88c5\u6781\u5ea6\u56f0\u96be\uff0c\u53cd\u590d\u6c42\u52a9\uff0c\u751a\u81f3\u9700\u8981\u5b69\u5b50\u5e2e\u5fd9\u3001\u4e0a\u6dd8\u5b9d\u627e\u5ba2\u670d\u89e3\u51b3\u3002\n  3.  **\u6280\u672f\u4f9d\u8d56**\uff1a\u4ece\u5b89\u88c5\u3001\u8bbe\u7f6e\u5230\u57fa\u7840\u64cd\u4f5c\uff0c\u6bcf\u4e00\u6b65\u90fd\u9ad8\u5ea6\u4f9d\u8d56\u5916\u90e8\u5e2e\u52a9\uff08\u73ed\u4e3b\u4efb\u3001\u5ba2\u670d\u3001\u5b69\u5b50\uff09\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8 (7-8\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3**\u3002\u9762\u5bf9\u8fde\u7eed\u6570\u5929\u7684\u8bbe\u5907\u8c03\u8bd5\u5931\u8d25\u3001\u8f6f\u4ef6\u4e0d\u517c\u5bb9\u7b49\u5de8\u5927\u632b\u6298\uff0c\u7528\u6237\u6ca1\u6709\u5d29\u6e83\u3001\u62b1\u6028\u6216\u653e\u5f03\uff0c\u800c\u662f\u6301\u7eed\u3001\u8010\u5fc3\u5730\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff08\u627e\u73ed\u4e3b\u4efb\u3001\u627e\u6dd8\u5b9d\u5ba2\u670d\u3001\u8ba9\u5b69\u5b50\u5e2e\u5fd9\uff09\uff0c\u5e76\u4fdd\u6301\u79ef\u6781\u7684\u5b66\u4e60\u6001\u5ea6\uff08\u201c\u6162\u6162\u5f04\u201d\u3001\u201c\u6211\u77e5\u9053\u8f7b\u91cd\u7f13\u6025\u201d\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u8c03\u8bbe\u5907\u76f4\u64ad\u8bfe\u6ca1\u542c\u5b8c \u8bbe\u5907\u8c03\u8bd5\u4e86\u4e24\u5929\u201d\n  > \u201c\u8d39\u8001\u52b2\u4e86\u201d\n  > \u201c\u6211\u6ca1\u6709\u803d\u8bef\u90a3\u4e2a\u8bfe\u7a0b\uff0c\u5c31\u662f\u552f\u4e00\u7684\u5c31\u662f\u5f55\u97f3\uff0c\u5c31\u662f\u505a\u4e0d\u4e86...\u4f46\u662f\u6211\u8be5\u5b8c\u6210\u7684\u65f6\u5019\u4e5f\u5b8c\u6210...\u6211\u8fd8\u662f\u6309\u7167\u8fdb\u5ea6\u6162\u6162\u6765\u5427\u201d\n  > \u201c\u653e\u5fc3\u5566 \u6211\u77e5\u9053\u8f7b\u91cd\u7f13\u6025 \u4e0d\u8fc7\u662f\u5f55\u4e0d\u4e86\u5408\u683c\u7684\u97f3\u9891 \u8c22\u8c22\u73ed\u73ed\u6307\u70b9\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42\uff08\u7126\u8651\u4fdd\u969c\uff09** \u4e0e **\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42\uff08\u5f52\u5c5e\u611f\uff09** \u5e76\u5b58\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6280\u672f\u6050\u60e7\u4e0e\u65f6\u4ee3\u8131\u8282\u7126\u8651**\u3002\u7528\u6237\u62e5\u6709\u8f83\u597d\u7684\u7ecf\u6d4e\u6761\u4ef6\uff08\u82f9\u679c\u7535\u8111\uff09\uff0c\u4f46\u88ab\u6280\u672f\u95e8\u69db\uff08\u82f9\u679c\u7cfb\u7edf\u517c\u5bb9\u6027\u3001\u8f6f\u4ef6\u64cd\u4f5c\uff09\u4e25\u91cd\u5361\u4f4f\uff0c\u4ea7\u751f\u4e86\u201c\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\u201d\u3001\u201c\u5b66\u4e0d\u4f1a\u201d\u7684\u6df1\u5c42\u6050\u60e7\u3002\u540c\u65f6\uff0c\u5979\u6e34\u671b\u878d\u5165\u96c6\u4f53\uff08\u5728\u7fa4\u5185\u79ef\u6781\u4e92\u52a8\u3001\u9f13\u52b1\u540c\u5b66\uff09\uff0c\u5bfb\u6c42\u7ebf\u4e0a\u793e\u7fa4\u7684\u5f52\u5c5e\u611f\u4ee5\u5bf9\u6297\u5b66\u4e60\u4e2d\u7684\u5b64\u72ec\u548c\u65e0\u52a9\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u6400\u6276\u8fc7\u9a6c\u8def\u201d\u7684\u5b89\u5168\u611f\u4e0e\u201c\u7ebf\u4e0a\u8001\u4e61\u4f1a\u201d\u7684\u6e29\u6696**\u3002\u5979\u4e0d\u9700\u8981\u9ad8\u9ad8\u5728\u4e0a\u7684\u6280\u672f\u6307\u5bfc\uff0c\u9700\u8981\u7684\u662f\u624b\u628a\u624b\u7684\u7269\u7406\u4ee3\u529e\u548c\u60c5\u611f\u4e0a\u7684\u63a5\u7eb3\u4e0e\u9f13\u52b1\uff0c\u8ba9\u5979\u611f\u89c9\u81ea\u5df1\u4e0d\u662f\u4e00\u4e2a\u4eba\u5728\u6218\u6597\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1\u7c7b** (\u5174\u8da3\u6d88\u8d39\u578b\uff0c\u4f46\u9700\u91cd\u70b9\u62a4\u822a) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **\u6df7\u5408\u4f535\u53f7\uff1a\u6570\u5b57\u6df1\u6d77\u5b64\u5c9b\u8131\u56f0\u8005 (T6 + T9)** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u672a\u63d0\u53ca\u5bb6\u5ead\u77db\u76fe\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u56e0\u6301\u7eed\u7684\u6280\u672f\u5361\u70b9\uff08\u82f9\u679c\u7535\u8111\u517c\u5bb9\u6027\u3001\u8f6f\u4ef6\u64cd\u4f5c\uff09\u65e0\u6cd5\u5b8c\u6210\u4f5c\u4e1a\uff0c\u4ea7\u751f\u201c\u6211\u592a\u7b28\u4e86/\u5b66\u4e0d\u4f1a\u201d\u7684\u7d2f\u79ef\u6027\u632b\u8d25\u611f\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u4e2d** | \u867d\u7136\u5f39\u6027\u9ad8\uff0c\u4f46\u957f\u671f\u7684\u6280\u672f\u56f0\u5883\u53ef\u80fd\u5728\u67d0\u6b21\u65b0\u7684\u590d\u6742\u64cd\u4f5c\uff08\u5982\u865a\u62df\u673a\u3001\u63d2\u4ef6\u5b89\u88c5\uff09\u5931\u8d25\u540e\uff0c\u53e0\u52a0\u65f6\u95f4\u538b\u529b\uff0c\u5f15\u53d1\u60c5\u7eea\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u5982\u679c\u6295\u5165\u5927\u91cf\u65f6\u95f4\u7cbe\u529b\u540e\uff0c\u77ed\u671f\u5185\u770b\u4e0d\u5230\u53d8\u73b0\u5e0c\u671b\uff08\u5982\u8bd5\u97f3\u4e0d\u4e2d\uff09\uff0c\u53ef\u80fd\u4ea7\u751fROI\u7126\u8651\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\uff0c\u5f53\u57fa\u7840\u64cd\u4f5c\uff08AU\u5f55\u97f3\u3001\u5bfc\u51fa\uff09\u53cd\u590d\u5931\u8d25\uff0c\u4e14\u7b2c\u4e00\u6b21\u5c0f\u7ec4\u4f5c\u4e1a\u6216\u8bd5\u97f3\u56e0\u6280\u672f\u539f\u56e0\u53d7\u632b\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u59d0\uff0c\u770b\u5230\u60a8\u4e3a\u8c03\u8bd5\u8bbe\u5907\u82b1\u4e86\u8fd9\u4e48\u591a\u5fc3\u601d\uff0c\u771f\u7684\u7279\u522b\u4f69\u670d\u60a8\u7684\u8010\u5fc3\u548c\u575a\u6301\u3002\u82f9\u679c\u7cfb\u7edf\u786e\u5b9e\u6bd4\u8f83\u7279\u6b8a\uff0c\u5f88\u591a\u5b66\u5458\u90fd\u5361\u5728\u8fd9\u513f\u3002\u60a8\u522b\u6025\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u6b65\u6765\uff0c\u6211\u5e2e\u60a8\u8fdc\u7a0b\u5f04\uff0c\u5f04\u4e0d\u597d\u6211\u627e\u6280\u672f\u8001\u5e08\u652f\u63f4\u3002**\u60a8\u5148\u4fdd\u8bc1\u80fd\u8ddf\u4e0a\u76f4\u64ad\u8bfe\uff0c\u4f5c\u4e1a\u4ea4\u5e72\u97f3\u5c31\u884c\uff0c\u540e\u671f\u5904\u7406\u6211\u5e2e\u60a8\u60f3\u529e\u6cd5\u3002** \u54b1\u4e0d\u8ddf\u522b\u4eba\u6bd4\u901f\u5ea6\uff0c\u60a8\u8fd9\u5b66\u4e60\u52b2\u5934\u5df2\u7ecf\u662f\u699c\u6837\u4e86\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u9002\u8001\u9632\u8131\u8282\u4f34\u98de\u8425 (\u4ea7\u54c1\u7ebfC)\u3011**\u3002\u6838\u5fc3\u662f\u63d0\u4f9b\u5168\u966a\u4f34\u3001\u4fdd\u59c6\u7ea7\u670d\u52a1\uff0c\u8de8\u8d8a\u6570\u5b57\u9e3f\u6c9f\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n  1.  **\u3010\u6838\u5f39\u7ea7\u7279\u79cdA(\u8fdc\u7a0b\u7269\u7406\u4ee3\u529e)\u3011**\uff1a\u5fc5\u987b\u4e3b\u52a8\u3001\u9891\u7e41\u4f7f\u7528ToDesk\u7b49\u5de5\u5177\u8fdb\u884c\u8fdc\u7a0b\u534f\u52a9\uff0c\u89e3\u51b3AU\u5b89\u88c5\u3001\u8bbe\u7f6e\u3001\u865a\u62df\u673a\u7b49\u95ee\u9898\u3002\u653e\u5f03\u6559\u539f\u7406\uff0c\u76f4\u63a5\u201c\u4e00\u952e\u5305\u529e\u201d\u3002\n  2.  **\u3010\u6ee1\u914d\u7279\u79cdC(\u51cc\u6668\u60c5\u7eea\u6258\u5e95)\u3011**\uff1a\u7ed9\u4e88\u6781\u9ad8\u5bc6\u5ea6\u7684\u60c5\u611f\u652f\u6301\u548c\u9f13\u52b1\uff0c\u7528\u201c\u7ebf\u4e0a\u8001\u4e61\u4f1a\u201d\u7684\u6e29\u6696\u5316\u89e3\u5176\u6280\u672f\u7126\u8651\u3002\u516c\u5f00\u8868\u626c\u5176\u575a\u6301\u7cbe\u795e\u3002\n  3.  **\u3010\u81ea\u884c\u8f66\u6548\u5e94\u8f6c\u5316\u8bdd\u672f\u3011**\uff1a\u5f53\u7528\u6237\u56e0\u6280\u672f\u5361\u987f\u60f3\u653e\u5f03\u65f6\uff0c\u4f7f\u7528\u201c\u6280\u80fd\u5c31\u50cf\u5b66\u81ea\u884c\u8f66\uff0c\u5b66\u4f1a\u4e86\u5c31\u4e00\u8f88\u5b50\u4e0d\u4f1a\u5fd8\uff0c\u60a8\u73b0\u5728\u514b\u670d\u7684\u6bcf\u4e2a\u574e\u513f\u90fd\u662f\u672a\u6765\u968f\u65f6\u80fd\u7528\u7684\u8d44\u4ea7\u201d\u6765\u964d\u4f4e\u5176\u5fc3\u7406\u538b\u529b\u3002\n- **\u6838\u5fc3\u8bdd\u672f\u7b56\u7565**\uff1a\u5e94\u7528 **\u201c\u9738\u603b\u5f0f\u4e00\u952e\u5305\u529e\u4ee3\u7406\u201d** \u4e0e **\u201c\u7980\u8d4b\u5938\u8d5e\u6cd5\u201d**\u3002\u4f8b\u5982\uff1a\u201c\u60a8\u8fd9\u82f9\u679c\u672c\u662f\u6700\u65b0\u6b3e\uff0c\u6027\u80fd\u597d\uff0c\u4e00\u65e6\u8c03\u597d\u4e86\u6548\u679c\u6bd4\u666e\u901a\u7535\u8111\u5f3a\u591a\u4e86\uff0c\u8fd9\u5c31\u662f\u60a8\u7684\u4f18\u52bf\u3002\u8c03\u8bbe\u5907\u8fd9\u4e9b\u6742\u4e8b\u4ea4\u7ed9\u6211\uff0c\u60a8\u4e13\u6ce8\u7ec3\u597d\u58f0\u97f3\u5c31\u884c\u3002\u201d\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n  1.  \u7ed9\u5979\u53d1\u56fe\u6587\u6559\u7a0b\u6216\u8ba9\u5979\u201c\u81ea\u5df1\u7814\u7a76\u4e00\u4e0b\u201d\u3002\n  2.  \u7528\u201c\u522b\u4eba\u90fd\u4f1a\u4e86\u4f60\u600e\u4e48\u8fd8\u4e0d\u4f1a\u201d\u4e4b\u7c7b\u7684\u8a00\u8bed\u65bd\u538b\u3002\n  3.  \u5728\u5979\u5361\u5728\u6280\u672f\u95ee\u9898\u65f6\uff0c\u50ac\u4fc3\u5979\u4ea4\u590d\u6742\u4f5c\u4e1a\u3002\n  4.  \u5ffd\u89c6\u5979\u5728\u7fa4\u5185\u7684\u793e\u4ea4\u4e92\u52a8\u548c\u52a9\u4eba\u884c\u4e3a\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u5fc5\u987b\u5728\u89e3\u51b3\u5176\u57fa\u7840\u6280\u672f\u5361\u70b9\u3001\u5efa\u7acb\u7edd\u5bf9\u4fe1\u4efb\u4e4b\u540e**\u3002\u5979\u6709\u80fd\u529b\u4e14\u6709\u610f\u613f\u4ed8\u8d39\uff08\u5df2\u62a5\u591a\u95e8\u8bfe\uff09\uff0c\u4f46\u5fc5\u987b\u5728\u5b89\u5168\u611f\u5145\u8db3\u7684\u524d\u63d0\u4e0b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u7684\u7535\u8111\u8fd8\u6ca1\u6709\u5b89\u88c5AU \u73ed\u73ed\u7ed9\u7684\u5b89\u88c5\u94fe\u63a5\u6b65\u9aa4\u4e0d\u4e00\u6837\u201d\u3001\u201c\u8bbe\u5907\u597d\u7ec4\u88c5\u7684 \u6ca1\u6709Au\u4e5f\u6ca1\u6cd5\u8c03\u8bd5\u554a\u201d \u2014 **\u6570\u5b57\u9e3f\u6c9f\u4e0e\u786c\u4ef6\u4f9d\u8d56\u7684\u5178\u578b\u4fe1\u53f7**\u3002\n2. > \u201c\u8d39\u8001\u52b2\u4e86\u201d\u3001\u201c\u6211\u7684\u662f\u521a\u4e70\u4e00\u5e74\u591a\u7684\u82f9\u679c\u7535\u8111...\u8fd9\u5468\u7684\u4f5c\u4e1a\u7528Au\u4f30\u8ba1\u4e0d\u884c \u8c03\u597d\u4e86\u4e0d\u80fd\u8bf4\u660e\u4f1a\u7528\u4e86[\u6342\u8138]\u201d \u2014 **\u9762\u5bf9\u9ad8\u6280\u672f\u95e8\u69db\u7684\u65e0\u5948\u4e0e\u81ea\u5632\uff0c\u4f46\u672a\u653e\u5f03**\u3002\n3. > \u201c@\u968f \u2764\u6cb3\u5317\u7701\u5510\u5c71\uff0c\u5973\u64ad\u2005\u4f60\u771f\u7684\u5f88\u68d2\u4e86 \u6211\u4f5c\u4e1a\u4e5f\u6ca1\u4ea4\u5462\u201d\u3001\u201c\u8c22\u8c22 \u6709\u4f60\u771f\u597d \u6211\u90fd\u4e0d\u597d\u610f\u601d\u4e0d\u52aa\u529b[\u73ab\u7470]\u201d \u2014 **\u9ad8\u793e\u4ea4\u9700\u6c42\uff0c\u5728\u793e\u7fa4\u4e2d\u5bfb\u6c42\u5f52\u5c5e\u4e0e\u4e92\u52a9\uff0c\u5f39\u6027\u9ad8**\u3002\n4. > \u201c\u6211\u6ca1\u6709\u803d\u8bef\u90a3\u4e2a\u8bfe\u7a0b\uff0c\u5c31\u662f\u552f\u4e00\u7684\u5c31\u662f\u5f55\u97f3\uff0c\u5c31\u662f\u505a\u4e0d\u4e86...\u4f46\u662f\u6211\u8be5\u5b8c\u6210\u7684\u65f6\u5019\u4e5f\u5b8c\u6210...\u6211\u8fd8\u662f\u6309\u7167\u8fdb\u5ea6\u6162\u6162\u6765\u5427\u201d \u2014 **\u6e05\u6670\u7684\u81ea\u6211\u8ba4\u77e5\u3001\u76ee\u6807\u5bfc\u5411\u548c\u9ad8\u5fc3\u7406\u5f39\u6027\u7684\u96c6\u4e2d\u4f53\u73b0**\u3002\n5. > \u201c\u73ed\u73ed\u90a3\u4e2a\u8fd0\u8425\u8bfe\u600e\u4e48\u62a5\u540d\uff1f\u6211\u62a5\u4e0b\u4e2a\u6708\u7684\u8bfe\u201d\u3001\u201c\u6709\u62a5\u540d\u7684\u5417\uff1f\u53ef\u4ee5\u7ec4\u4e2a\u56e2\u5417\uff1f\u201d \u2014 **\u4e2d\u7eaf\u5ea6\u52a8\u673a\uff08\u53d8\u73b0+\u5b66\u4e60\uff09\u548c\u6301\u7eed\u4ed8\u8d39\u610f\u613f\u7684\u8bc1\u660e**\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010\u6df7\u5408\u4f535\u53f7\uff1a\u6570\u5b57\u6df1\u6d77\u5b64\u5c9b\u8131\u56f0\u8005\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u8de8\u8d8a\u6570\u5b57\u9e3f\u6c9f\u7684\u5b89\u5168\u611f\u3011\u548c\u3010\u7ebf\u4e0a\u793e\u7fa4\u7684\u5f52\u5c5e\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u6838\u5f39\u7ea7\u8fdc\u7a0b\u7269\u7406\u4ee3\u529e + \u6ee1\u914d\u60c5\u7eea\u6258\u5e95\uff0c\u7528\u201c\u9738\u603b\u5f0f\u5305\u529e\u201d\u89e3\u51b3\u6240\u6709\u6280\u672f\u5361\u70b9\uff0c\u5c06\u5979\u7262\u7262\u9501\u5b9a\u5728\u201c\u88ab\u7167\u987e\u201d\u7684\u6e29\u6696\u4f53\u9a8c\u4e2d\u3011**\u3002\n\n```json\n{\"core_type\": \"\u6df7\u5408\u4f535\u53f7\uff1a\u6570\u5b57\u6df1\u6d77\u5b64\u5c9b\u8131\u56f0\u8005 (T6+T9)\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\uff08\u7126\u8651\u4fdd\u969c\uff09+ \u793e\u4ea4\u9700\u6c42\uff08\u5f52\u5c5e\u611f\uff09\", \"target_product_line\": \"\u9002\u8001\u9632\u8131\u8282\u4f34\u98de\u8425 (\u4ea7\u54c1\u7ebfC)\"}\n```";
