    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u65fa\u4ed4\u5c0f\u9992\u5934. (UID: 677182221) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u51ac\u51ac\u8001\u5e087(\u8463\u590f\u6676) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bad\u7ec3\u8425 (\u4ef7\u683c\u672a\u77e5) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u4ec5\u63d0\u53ca\u201c\u5fae\u4fe1\u4ed8\u4e0d\u4e86\u6b3e\u201d\uff0c\u9700\u7528\u652f\u4ed8\u5b9d\u6216\u6362\u5fae\u4fe1\u652f\u4ed8\uff0c\u672a\u63d0\u53ca\u8d44\u91d1\u6765\u6e90\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u9ad8\u5bbd\u88d5**\u3002\u7528\u6237\u81ea\u8ff0\u4e3a\u201c\u65e0\u4e1a\u7684\u519c\u6751\u5b9d\u5988\u201d\uff0c\u4e14\u201c\u6211\u6709\u65f6\u95f4\u201d\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u7528\u6237\u8868\u8fbe\u4e86\u660e\u786e\u7684\u5b66\u4e60\u52a8\u673a\u3001\u65f6\u95f4\u72b6\u51b5\u3001\u5174\u8da3\u65b9\u5411\u548c\u62c5\u5fe7\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u2b06\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u4e3a\u80fd\u529b\u800c\u6765(\u9ad8)**\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u4e86\u201c\u60f3\u591a\u8d5a\u94b1\u201d\u7684\u53d8\u73b0\u76ee\u7684\uff0c\u4f46\u5e76\u975e\u201c\u51e0\u5929\u5185\u63d0\u73b0\u201d\u7684\u6781\u7aef\u5e7b\u60f3\uff0c\u800c\u662f\u613f\u610f\u4ece\u201c\u753b\u672c\u201d\u7b49\u57fa\u7840\u5de5\u4f5c\u5f00\u59cb\uff0c\u5e76\u5e0c\u671b\u6700\u7ec8\u5b9e\u73b0\u201c\u591a\u8d5a\u94b1\u201d\u7684\u957f\u671f\u76ee\u6807\u3002\u52a8\u673a\u517c\u5177\u73b0\u5b9e\u6027\u4e0e\u89c4\u5212\u6027\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4e1c\u4e1c\u8001\u5e08\u597d\uff0c\u8fd9\u51e0\u5929\u7684\u5b66\u4e60\u6211\u90fd\u5728\u8ba4\u771f\u542c\uff0c\u542c\u5230\u4eca\u5929\u4e3a\u6b62\uff0c\u6211\u89c9\u5f97\u6211\u5c31\u60f3\u591a\u8d5a\u94b1\uff0c\u6211\u662f\u4e00\u4e2a\u65e0\u4e1a\u7684\u55ef\u519c\u6751\u5b9d\u5988\uff0c\u4f46\u662f\u6211\u6709\u4fe1\u5fc3\u8ddf\u7740\u8001\u5e08\u4e00\u8d77\u5b66\u4e60\uff0c\u6211\u521a\u5f00\u59cb\u80af\u5b9a\u662f\u60f3\u505a\u55ef\u5feb\u901f\u6536\u5165\uff0c\u4f46\u662f\u6211\u6700\u7ec8\u8fd8\u7684\u60f3\u6cd5\u8fd8\u662f\u60f3\u591a\u8d5a\u94b1\uff0c\u56e0\u4e3a\u6211\u6709\u65f6\u95f4\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u652f\u4ed8\u65f6\u9047\u5230\u969c\u788d\uff08\u5fae\u4fe1\u4e0d\u5e38\u7528\uff09\uff0c\u9700\u6362\u5fae\u4fe1\u6216\u652f\u4ed8\u5b9d\uff0c\u672a\u63d0\u53ca\u501f\u8d37\uff0c\u4f46\u53ef\u80fd\u8d44\u91d1\u4e0d\u5bbd\u88d5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u9ad8** \u2014 \u201c\u65e0\u4e1a\u7684\u519c\u6751\u5b9d\u5988\u201d\uff0c\u660e\u786e\u8868\u793a\u201c\u6211\u6709\u65f6\u95f4\u201d\uff0c\u65f6\u95f4\u8d44\u6e90\u5145\u88d5\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\uff0c\u9700\u540e\u7eed\u6838\u67e5\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b07\u4f4e\u6781\u5371**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u5728\u83b7\u5f97\u6b63\u9762\u8bc4\u4ef7\uff08\u201c\u58f0\u97f3\u5e95\u5b50\u4e0d\u9519\u201d\u3001\u201c\u4f18\u79c0\u5b66\u5458\u201d\uff09\u540e\uff0c\u4f9d\u7136\u8868\u8fbe\u51fa\u5f3a\u70c8\u7684\u81ea\u6211\u6000\u7591\u548c\u62c5\u5fe7\uff0c\u9700\u8981\u5916\u90e8\u6301\u7eed\u80af\u5b9a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5c31\u662f\u62c5\u5fc3\u81ea\u5df1\u5b66\u4e0d\u597d\uff0c\u5b66\u4e0d\u4f1a\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u4f5c\u4e3a\u201c\u65e0\u4e1a\u7684\u519c\u6751\u5b9d\u5988\u201d\uff0c\u9762\u4e34\u7ecf\u6d4e\u6765\u6e90\u7684**\u751f\u5b58\u538b\u529b**\u548c\u5bf9\u672a\u6765\u4e0d\u786e\u5b9a\u6027\u7684**\u804c\u4e1a\u4fdd\u969c\u7126\u8651**\u3002\u5b66\u4e60\u6280\u80fd\u7684\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u83b7\u53d6\u7a33\u5b9a\u6536\u5165\uff0c\u4fdd\u969c\u5bb6\u5ead\u7ecf\u6d4e\u5b89\u5168\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u9632\u62a4\u76fe\u5f0f\u7684\u5b89\u5168\u611f\u4e0e\u8def\u5f84\u786e\u5b9a\u6027**\u3002\u9700\u8981\u660e\u786e\u544a\u8bc9\u5979\u201c\u4f60\u80fd\u884c\u201d\uff0c\u5e76\u63d0\u4f9b\u4e00\u6761\u6e05\u6670\u3001\u53ef\u9884\u671f\u3001\u4ece\u6613\u5230\u96be\u7684\u53d8\u73b0\u8def\u5f84\uff08\u5982\u4ece\u753b\u672c\u5f00\u59cb\uff09\uff0c\u6d88\u9664\u5176\u5bf9\u201c\u5b66\u4e0d\u4f1a\u201d\u548c\u201c\u8d5a\u4e0d\u5230\u94b1\u201d\u7684\u6050\u60e7\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2** \u7c7b (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74** (\u6df7\u5408\u4f532\u53f7\uff1a\u5e95\u5c42\u7bdd\u706b\u53d6\u6696\u8005 = T4 + T7 \u7684\u6f5c\u5728\u8fdb\u5316\u65b9\u5411) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u501f\u8d37\u6216\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u4f5c\u4e3a\u5b9d\u5988\uff0c\u82e5\u5bb6\u4eba\u53cd\u5bf9\u6216\u5bb6\u5ead\u5f00\u652f\u7d27\u5f20\uff0c\u53ef\u80fd\u5f15\u53d1\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u65f6\u95f4\u5145\u88d5\uff0c\u4e3b\u8981\u98ce\u9669\u5728\u4e8e\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u7684\u632b\u8d25\u611f\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u4e00\u65e6\u5728\u5b9e\u64cd\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u3001\u9996\u6b21\u8bd5\u97f3\u5931\u8d25\uff09\u4e2d\u9047\u5230\u632b\u6298\uff0c\u6781\u6613\u56e0\u201c\u6211\u592a\u7b28\u4e86\u201d\u7684\u81ea\u6211\u5426\u5b9a\u800c\u77ac\u95f4\u653e\u5f03\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | \u5bf9\u201c\u5feb\u901f\u6536\u5165\u201d\u6709\u671f\u5f85\uff0c\u82e5\u77ed\u671f\u5185\uff08\u59821-2\u4e2a\u6708\uff09\u770b\u4e0d\u5230\u4efb\u4f55\u53d8\u73b0\u5e0c\u671b\u6216\u8def\u5f84\uff0c\u4f1a\u4ea7\u751f\u5f3a\u70c8\u88ab\u6b3a\u9a97\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c1-2\u5468\uff0c\u9996\u6b21\u72ec\u7acb\u5b8c\u6210\u590d\u6742\u4f5c\u4e1a\u6216\u5c1d\u8bd5\u63a5\u5355\u5931\u8d25\u65f6**\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u65fa\u4ed4\u5988\u5988\uff0c\u770b\u5230\u4f60\u8bf4\u2018\u6709\u4fe1\u5fc3\u8ddf\u7740\u8001\u5e08\u5b66\u2019\uff0c\u6211\u7279\u522b\u611f\u52a8\u3002\u5f88\u591a\u5b9d\u5988\u521a\u5f00\u59cb\u90fd\u548c\u4f60\u4e00\u6837\uff0c\u4f1a\u62c5\u5fc3\u81ea\u5df1\u5b66\u4e0d\u4f1a\u3002\u8bf7\u653e\u5fc3\uff0c\u54b1\u4eec\u7684\u8bfe\u7a0b\u5c31\u662f\u4e3a0\u57fa\u7840\u7684\u5b9d\u5988\u8bbe\u8ba1\u7684\uff0c\u6bcf\u4e00\u6b65\u90fd\u6709\u8001\u5e08\u624b\u628a\u624b\u5e26\u3002\u4f60\u4e0d\u9700\u8981\u548c\u522b\u4eba\u6bd4\uff0c\u53ea\u9700\u8981\u6bd4\u6628\u5929\u7684\u81ea\u5df1\u8fdb\u6b65\u4e00\u70b9\u70b9\u3002\u4f60\u7684\u2018\u6709\u65f6\u95f4\u2019\u5c31\u662f\u6700\u5927\u7684\u4f18\u52bf\uff0c\u54b1\u4eec\u6162\u6162\u6765\uff0c\u5148\u4ece\u6700\u7b80\u5355\u7684\u753b\u672c\u5f00\u59cb\uff0c\u7a33\u7a33\u5730\u8d5a\u5230\u7b2c\u4e00\u7b14\u94b1\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** (\u4ea7\u54c1\u7ebfA)\u3002\u6ee1\u8db3\u5176\u201c\u591a\u8d5a\u94b1\u201d\u7684\u6838\u5fc3\u5b89\u5168\u9700\u6c42\uff0c\u4f46\u5fc5\u987b\u642d\u914d\u9ad8\u5f3a\u5ea6\u60c5\u7eea\u652f\u6301\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305 (\u6ee1\u914dC\u6a21\u5757)\u3011** + **\u3010\u7cbe\u786e\u6d3e\u5355\u62e6\u622a (B\u6a21\u5757)\u3011**\u3002\u5fc5\u987b\u7528\u6781\u81f4\u7684\u60c5\u7eea\u6258\u5e95\uff08C\uff09\u6765\u5bf9\u51b2\u5176\u4f4e\u5fc3\u7406\u5f39\u6027\uff0c\u540c\u65f6\u7528\u6e05\u6670\u3001\u53ef\u8fbe\u6210\u7684\u521d\u671f\u5c0f\u4efb\u52a1\uff08\u5982\u753b\u672c\uff09\u5efa\u7acb\u4fe1\u5fc3\uff0c\u4e25\u9632\u56e0\u671f\u671b\u8fc7\u9ad8\u800c\u5d29\u76d8\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5728\u5979\u8868\u8fbe\u201c\u62c5\u5fc3\u5b66\u4e0d\u4f1a\u201d\u65f6\uff0c\u7528\u201c\u522b\u4eba\u90fd\u80fd\u884c\u4e3a\u4ec0\u4e48\u4f60\u4e0d\u884c\u201d\u6216\u5355\u7eaf\u7684\u6280\u672f\u8bdd\u672f\u56de\u5e94\u3002\u7981\u6b62\u5728\u5979\u9996\u6b21\u53d7\u632b\u65f6\u5e03\u7f6e\u9ad8\u96be\u5ea6\u4f5c\u4e1a\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u57fa\u7840\u6280\u80fd\u672a\u5de9\u56fa\u3001\u672a\u83b7\u5f97\u9996\u6b21\u6210\u529f\u4f53\u9a8c\u524d\u8fdb\u884c\u4efb\u4f55\u5347\u5355\u63a8\u9500**\u3002\u4f18\u5148\u786e\u4fdd\u5176\u5728\u201c\u753b\u672c\u201d\u7b49\u4f4e\u95e8\u69db\u4efb\u52a1\u4e0a\u83b7\u5f97\u6b63\u53cd\u9988\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5c31\u662f\u62c5\u5fc3\u81ea\u5df1\u5b66\u4e0d\u597d\uff0c\u5b66\u4e0d\u4f1a\u201d\n2. > \u201c\u6211\u662f\u4e00\u4e2a\u65e0\u4e1a\u7684\u55ef\u519c\u6751\u5b9d\u5988\uff0c\u4f46\u662f\u6211\u6709\u4fe1\u5fc3\u8ddf\u7740\u8001\u5e08\u4e00\u8d77\u5b66\u4e60\uff0c\u6211\u521a\u5f00\u59cb\u80af\u5b9a\u662f\u60f3\u505a\u55ef\u5feb\u901f\u6536\u5165\uff0c\u4f46\u662f\u6211\u6700\u7ec8\u8fd8\u7684\u60f3\u6cd5\u8fd8\u662f\u60f3\u591a\u8d5a\u94b1\uff0c\u56e0\u4e3a\u6211\u6709\u65f6\u95f4\u3002\u201d\n3. > \u201c\u6211\u89c9\u5f97\u6211\u5bf9\u753b\u672c\u8fd9\u4e2a\u804c\u4e1a\u633a\u611f\u5174\u8da3\u7684\uff0c\u6211\u5bf9\u5ba1\u542c\u4e0d\u600e\u4e48\u611f\u5174\u8da3\uff0c\u6211\u53ef\u4ee5\u8bd5\u7740\u521a\u5f00\u59cb\u6211\u53ef\u4ee5\u8bd5\u7740\u6162\u6162\u53bb\u505a\u8fd9\u4e2a\u7684\u3002\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6\u60c5\u7eea\u5de8\u5a74\u578b\uff08\u5e95\u5c42\u7bdd\u706b\u53d6\u6696\u8005\u6f5c\u8d28\uff09\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7ecf\u6d4e\u5b89\u5168\u4e0e\u804c\u4e1a\u4fdd\u969c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7528\u6ee1\u914dC\u6a21\u5757\uff08\u6781\u81f4\u60c5\u7eea\u6258\u5e95\uff09\u7ed3\u5408\u6e05\u6670\u3001\u4f4e\u95e8\u69db\u7684\u53d8\u73b0\u7b2c\u4e00\u6b65\uff08\u5982\u753b\u672c\uff09\uff0c\u5efa\u7acb\u521d\u671f\u6210\u529f\u4f53\u9a8c\uff0c\u4e25\u9632\u56e0\u632b\u8d25\u611f\u5bfc\u81f4\u7684\u77ac\u95f4\u5d29\u6e83\u9000\u8d39\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b (\u6df7\u5408\u4f532\u53f7\u6f5c\u8d28)\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\", \"age\": \"\u672a\u77e5\uff08\u5b9d\u5988\uff09\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\uff08\u519c\u6751\uff09\"}\n```";
