    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## \u4e00\u3001 \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**\n    *   **\u8868\u5c42\u52a8\u673a**\uff1a\u5b66\u4e60\u914d\u97f3\u6280\u80fd\u3001\u83b7\u53d6\u6709\u58f0\u4e66\u5f55\u5236\u673a\u4f1a\u3001\u5bfb\u6c42\u53d8\u73b0\u9014\u5f84\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b\uff08\u5b8c\u6210\u4f5c\u4e1a\u3001\u770b\u56de\u653e\u3001\u4e3b\u52a8\u7ec3\u4e60\uff09\u3002\n    *   **\u6df1\u5c42\u52a8\u673a**\uff1a**\u5904\u4e8e\u4eba\u751f\u4f4e\u8c37\uff08\u521a\u79bb\u5a5a\u3001\u6709\u5916\u503a\uff09\uff0c\u5bfb\u6c42\u7ecf\u6d4e\u72ec\u7acb\u4e0e\u60c5\u611f\u5bc4\u6258**\u3002\u7528\u6237\u5c06\u5b66\u4e60\u89c6\u4e3a\u6539\u53d8\u73b0\u72b6\u3001\u5b9e\u73b0\u81ea\u6211\u4ef7\u503c\u7684\u91cd\u8981\u9014\u5f84\uff0c\u60c5\u611f\u4f9d\u8d56\u6027\u5f3a\u3002\n    *   **\u7eaf\u5ea6\u5224\u65ad**\uff1a**\u6df7\u5408\u578b\u52a8\u673a**\u3002\u65e2\u6709\u660e\u786e\u7684\u6280\u80fd\u5b66\u4e60\u4e0e\u53d8\u73b0\u9700\u6c42\uff08\u5de5\u5177\u6027\uff09\uff0c\u4e5f\u5305\u542b\u5f3a\u70c8\u7684\u60c5\u7eea\u7597\u6108\u4e0e\u751f\u6d3b\u91cd\u5efa\u8bc9\u6c42\uff08\u60c5\u611f\u6027\uff09\u3002\u540e\u8005\u5360\u6bd4\u9ad8\uff0c**\u52a8\u673a\u7eaf\u5ea6\u4e2d\u7b49\u504f\u4f4e**\uff0c\u6613\u53d7\u60c5\u7eea\u6ce2\u52a8\u5f71\u54cd\u3002\n\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**\n    *   **\u7ecf\u6d4e\u8d44\u6e90**\uff1a**\u660e\u786e\u8868\u793a\u7ecf\u6d4e\u56f0\u96be**\uff08\u201c\u62a5\u540d\u8d39\u5408\u7406\uff0c\u4f46\u5bf9\u73b0\u5728\u7684\u6211\u6765\u8bf4\u662f\u7b14\u5de8\u6b3e\u201d\uff09\uff0c\u652f\u4ed8\u80fd\u529b\u5f31\uff0c\u5c5e\u4e8e**\u4f4e\u8d44\u6e90\u5e95\u5ea7**\u3002\n    *   **\u65f6\u95f4\u8d44\u6e90**\uff1a\u6709\u65f6\u95f4\u5b8c\u6210\u6bcf\u65e5\u5b66\u4e60\u4efb\u52a1\uff08\u770b\u56de\u653e\u3001\u4ea4\u4f5c\u4e1a\u3001\u542c\u76f4\u64ad\uff09\uff0c\u663e\u793a\u6709**\u4e00\u5b9a\u7684\u53ef\u652f\u914d\u65f6\u95f4**\u3002\n    *   **\u8ba4\u77e5/\u6280\u80fd\u8d44\u6e90**\uff1a\u96f6\u57fa\u7840\u5165\u95e8\uff08\u201c\u4e13\u4e1a\u8bcd\u770b\u4e0d\u61c2\u201d\uff09\uff0c\u4f46\u5b66\u4e60\u6001\u5ea6\u8ba4\u771f\uff0c\u80fd\u63a5\u53d7\u6307\u5bfc\u5e76\u5c1d\u8bd5\u7ec3\u4e60\uff0c\u5177\u5907**\u57fa\u7840\u5b66\u4e60\u80fd\u529b**\u3002\n    *   **\u793e\u4f1a\u652f\u6301**\uff1a**\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u7f3a\u5931**\u3002\u5f53\u524d\u5904\u4e8e\u79bb\u5a5a\u540e\u72b6\u6001\uff0c\u793e\u4f1a\u652f\u6301\u7f51\u7edc\u60c5\u51b5\u4e0d\u660e\u3002\n\n*   **\u5fc3\u7406\u5f39\u6027 (E)**\n    *   **\u884c\u52a8\u529b**\uff1a**\u9ad8**\u3002\u80fd\u7d27\u8ddf\u9500\u552e\u8282\u594f\uff0c\u6309\u65f6\u5b8c\u6210\u6253\u5361\u3001\u4f5c\u4e1a\u3001\u89c2\u770b\u76f4\u64ad\u7b49\u4efb\u52a1\uff0c\u6267\u884c\u529b\u5f3a\u3002\n    *   **\u6297\u632b\u529b**\uff1a**\u4e2d\u7b49\u504f\u4f4e**\u3002\u5bb9\u6613\u56e0\u5bf9\u6bd4\u4ea7\u751f\u81ea\u6211\u6000\u7591\uff08\u201c\u542c\u4e86\u559c\u9a6c\u62c9\u96c5\u7684\u5c0f\u8bf4\u540e\u6211\u5bf9\u81ea\u5df1\u771f\u7684\u6ca1\u4fe1\u5fc3\u201d\u3001\u201c\u611f\u89c9\u5dee\u592a\u591a\u4e86\u201d\uff09\uff0c\u9700\u8981\u5916\u90e8\uff08\u9500\u552e\uff09\u7684\u6301\u7eed\u9f13\u52b1\u548c\u80af\u5b9a\u6765\u7ef4\u6301\u4fe1\u5fc3\u3002\n    *   **\u81ea\u4e3b\u6027**\uff1a**\u4e2d\u7b49**\u3002\u80fd\u4e3b\u52a8\u7ec3\u4e60\u5e76\u53cd\u9988\u95ee\u9898\uff0c\u4f46\u5728\u5173\u952e\u51b3\u7b56\uff08\u5982\u9009\u4e66\uff09\u4e0a\u8868\u73b0\u51fa\u8f83\u5f3a\u7684\u4f9d\u8d56\u503e\u5411\uff08\u201c\u8bf7\u5e08\u59d0\u2026\u5e2e\u6211\u9009\u4e00\u672c\u201d\uff09\u3002\n    *   **\u76ee\u6807\u6e05\u6670\u5ea6**\uff1a**\u4e2d\u7b49**\u3002\u6709\u201c\u63d0\u9ad8\u81ea\u5df1\u6210\u4e3a\u4e13\u4e1a\u7684\u4eba\u201d\u7684\u6a21\u7cca\u76ee\u6807\uff0c\u4f46\u5bf9\u884c\u4e1a\u8ba4\u77e5\u3001\u5b66\u4e60\u8def\u5f84\u3001\u53d8\u73b0\u96be\u5ea6\u7f3a\u4e4f\u6e05\u6670\u4e86\u89e3\uff0c\u6613\u88ab\u9500\u552e\u63cf\u7ed8\u7684\u84dd\u56fe\u5438\u5f15\u3002\n\n## \u4e8c\u3001 ABCD\u5224\u5b9a\u6811\u5206\u6790\n\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u6ca1\u94b1\u201d\uff0c\u652f\u4ed8\u80fd\u529b\u5f31\uff0c**\u652f\u4ed8\u610f\u613f\u4e0e\u652f\u4ed8\u80fd\u529b\u5b58\u5728\u4e25\u91cd\u77db\u76fe**\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u7f3a\u5931**\u3002\u7528\u6237\u521a\u79bb\u5a5a\uff0c\u7ecf\u6d4e\u72b6\u51b5\u72ec\u7acb\uff0c\u4f46\u51b3\u7b56\u662f\u5426\u5b8c\u5168\u81ea\u4e3b\u3001\u662f\u5426\u6709\u5176\u4ed6\u503a\u52a1\u538b\u529b\u6216\u629a\u517b\u8d23\u4efb\u672a\u77e5\u3002\n*   **\u6b65\u9aa41\uff1a\u52a8\u673a\u7eaf\u5ea6 (M)**\uff1a**M- (\u4e2d\u7b49\u504f\u4f4e)**\u3002\u6df7\u5408\u52a8\u673a\uff0c\u60c5\u611f\u7597\u6108\u4e0e\u7ecf\u6d4e\u538b\u529b\u9a71\u52a8\u660e\u663e\uff0c\u5de5\u5177\u6027\u5b66\u4e60\u76ee\u6807\u6613\u88ab\u60c5\u7eea\u5e72\u6270\u3002\n*   **\u6b65\u9aa42\uff1a\u8d44\u6e90\u5e95\u5ea7 (R)**\uff1a**R- (\u4f4e)**\u3002\u7ecf\u6d4e\u8d44\u6e90\u532e\u4e4f\u662f\u6838\u5fc3\u77ed\u677f\u3002\n*   **\u6b65\u9aa43\uff1a\u5fc3\u7406\u5f39\u6027 (E)**\uff1a**E+ (\u4e2d\u7b49\u504f\u9ad8)**\u3002\u884c\u52a8\u529b\u5f3a\uff0c\u914d\u5408\u5ea6\u9ad8\uff0c\u4f46\u4fe1\u5fc3\u4e0d\u8db3\uff0c\u4f9d\u8d56\u5916\u90e8\u6fc0\u52b1\u3002\n*   **\u7efc\u5408\u5224\u5b9a**\uff1a**B-\u578b (\u52a8\u673a\u5b58\u7591-\u8d44\u6e90\u532e\u4e4f\u578b)**\u3002\u7528\u6237\u6709\u8f83\u5f3a\u7684\u884c\u52a8\u610f\u613f\u548c\u60c5\u611f\u6295\u5165\uff0c\u4f46\u6838\u5fc3\u652f\u4ed8\u80fd\u529b\u7f3a\u5931\uff0c\u4e14\u5b66\u4e60\u52a8\u673a\u4e2d\u63ba\u6742\u5927\u91cf\u60c5\u7eea\u7597\u6108\u9700\u6c42\uff0c**\u4ed8\u8d39\u8f6c\u5316\u98ce\u9669\u6781\u9ad8\uff0c\u540e\u7eed\u670d\u52a1\u538b\u529b\u4e0e\u9000\u8d39\u98ce\u9669\u5de8\u5927**\u3002\n\n## \u4e09\u3001 \u7528\u6237\u539f\u578b\u5339\u914d\n\n*   **\u5339\u914d\u539f\u578b**\uff1a**T4 \u60c5\u611f\u5bc4\u6258\u578b\u5b66\u4e60\u8005** \u4e0e **T7 \u7ecf\u6d4e\u62ee\u636e\u7684\u5c1d\u8bd5\u8005** \u7684\u6df7\u5408\u4f53\u3002\n*   **\u6838\u5fc3\u7279\u5f81**\uff1a\n    1.  **T4\u7279\u5f81**\uff1a\u5c06\u5b66\u4e60\u8fc7\u7a0b\u4f5c\u4e3a\u60c5\u611f\u5bc4\u6258\u548c\u83b7\u5f97\u8ba4\u540c\u7684\u9014\u5f84\uff08\u611f\u8c22\u9500\u552e\u966a\u4f34\uff09\uff0c\u5bf9\u201c\u88ab\u770b\u597d\u201d\u3001\u201c\u88ab\u9f13\u52b1\u201d\u6709\u5f3a\u70c8\u9700\u6c42\u3002\n    2.  **T7\u7279\u5f81**\uff1a\u7ecf\u6d4e\u72b6\u51b5\u7a98\u8feb\uff0c\u5c06\u8bfe\u7a0b\u89c6\u4e3a\u201c\u6551\u547d\u7a3b\u8349\u201d\uff0c\u5bf9\u5feb\u901f\u53d8\u73b0\u62b1\u6709\u6781\u9ad8\u4e14\u4e0d\u5207\u5b9e\u9645\u7684\u671f\u671b\uff0c\u652f\u4ed8\u80fd\u529b\u8106\u5f31\u3002\n*   **\u6700\u7ec8\u5224\u5b9a**\uff1a**T7 \u7ecf\u6d4e\u62ee\u636e\u7684\u5c1d\u8bd5\u8005 (\u504f\u60c5\u611f\u4f9d\u8d56\u4e9a\u578b)**\u3002\u7ecf\u6d4e\u538b\u529b\u662f\u6839\u672c\u5236\u7ea6\uff0c\u60c5\u611f\u4f9d\u8d56\u662f\u663e\u8457\u7279\u5f81\u3002\n\n## \u56db\u3001 \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u6781\u9ad8)\n\n| \u9000\u8d39\u6839\u56e0 | \u98ce\u9669\u7b49\u7ea7 | \u8bc1\u636e\u4e0e\u8bf4\u660e |\n| :--- | :--- | :--- |\n| **1. \u6548\u679c\u672a\u8fbe\u9884\u671f** | **\u9ad8** | \u7528\u6237\u5df2\u8868\u73b0\u51fa\u4e0e\u4e13\u4e1a\u4f5c\u54c1\u7684\u5bf9\u6bd4\u7126\u8651\uff0c\u5bf9\u81ea\u8eab\u8fdb\u6b65\u901f\u5ea6\u6709\u8f83\u9ad8\u671f\u5f85\u3002\u82e5\u6b63\u5f0f\u8bfe\u7a0b\u540e\u65e0\u6cd5\u5feb\u901f\u63a5\u5355\u6216\u53d8\u73b0\uff0c\u6781\u6613\u4ea7\u751f\u201c\u6ca1\u6548\u679c\u201d\u7684\u8ba4\u77e5\u3002 |\n| **2. \u7ecf\u6d4e\u538b\u529b\u53cd\u566c** | **\u6781\u9ad8** | **\u3010\u5173\u952e\u96f7\u533a\u3011** \u7528\u6237\u5df2\u660e\u786e\u8868\u8fbe\u7ecf\u6d4e\u56f0\u96be\u3002\u4efb\u4f55\u540e\u7eed\u7684\u6d88\u8d39\uff08\u5982\u8bbe\u5907\u3001\u8fdb\u9636\u8bfe\uff09\u6216\u53d8\u73b0\u5ef6\u8fdf\uff0c\u90fd\u53ef\u80fd\u76f4\u63a5\u89e6\u53d1\u56e0\u201c\u65e0\u529b\u627f\u62c5\u201d\u800c\u8981\u6c42\u9000\u8d39\u3002 |\n| **3. \u88ab\u8bf1\u5bfc/\u5938\u5927\u5ba3\u4f20** | **\u4e2d** | \u9500\u552e\u8fc7\u7a0b\u4e2d\u5b58\u5728\u201c\u770b\u597d\u4f60\u201d\u3001\u201c\u7ed9\u4f60\u5360\u540d\u989d\u201d\u3001\u201c\u5feb\u901f\u6323\u5230\u7b2c\u4e00\u6876\u91d1\u201d\u7b49\u627f\u8bfa\u6027\u8bdd\u672f\u3002\u82e5\u7528\u6237\u4ed8\u8d39\u540e\u672a\u611f\u53d7\u5230\u540c\u7b49\u7a0b\u5ea6\u7684\u201c\u7279\u6b8a\u5173\u7167\u201d\u6216\u5feb\u901f\u53d8\u73b0\u8def\u5f84\uff0c\u53ef\u80fd\u4ea7\u751f\u88ab\u6b3a\u9a97\u611f\u3002 |\n| **4. \u8bfe\u7a0b\u8d28\u91cf\u4e0d\u7b26** | **\u4e2d** | \u76ee\u524d\u5904\u4e8e\u4f53\u9a8c\u671f\uff0c\u7528\u6237\u53cd\u9988\u79ef\u6781\u3002\u98ce\u9669\u5728\u4e8e\u6b63\u5f0f\u8bfe\u7a0b\u5185\u5bb9\u82e5\u4e0e\u4f53\u9a8c\u8bfe\u843d\u5dee\u5927\uff0c\u6216\u6559\u5b66\u670d\u52a1\u964d\u7ea7\uff0c\u53ef\u80fd\u5f15\u53d1\u4e0d\u6ee1\u3002 |\n| **5. \u5bb6\u5ead/\u5916\u90e8\u53cd\u5bf9** | **\u4fe1\u606f\u4e0d\u8db3** | \u5bb6\u5ead\u51b3\u7b56\u6743\u672a\u77e5\uff0c\u4f46\u79bb\u5a5a\u72b6\u6001\u53ef\u80fd\u610f\u5473\u7740\u51b3\u7b56\u81ea\u4e3b\u3002\u9700\u5173\u6ce8\u662f\u5426\u6709\u5176\u4ed6\u503a\u6743\u4eba\u65bd\u538b\u3002 |\n| **6. \u5b66\u4e60\u65f6\u95f4\u51b2\u7a81** | **\u4f4e** | \u76ee\u524d\u65f6\u95f4\u914d\u5408\u5ea6\u826f\u597d\uff0c\u4f46\u82e5\u5f00\u59cb\u5bfb\u627e\u5168\u804c\u5de5\u4f5c\u6216\u5904\u7406\u79bb\u5a5a\u4e8b\u5b9c\uff0c\u65f6\u95f4\u53ef\u80fd\u88ab\u6324\u538b\u3002 |\n| **7. \u4e2a\u4eba\u5065\u5eb7/\u5fc3\u7406** | **\u9ad8** | **\u3010\u5173\u952e\u96f7\u533a\u3011** \u201c\u4eba\u751f\u4f4e\u8c37\u671f\u201d\u3001\u201c\u79bb\u5a5a\u7b2c\u56db\u5929\u201d\u8868\u660e\u7528\u6237\u5904\u4e8e**\u5fc3\u7406\u8106\u5f31\u671f**\u3002\u60c5\u7eea\u6ce2\u52a8\u5927\uff0c\u51b3\u7b56\u53ef\u80fd\u975e\u7406\u6027\uff0c\u4e14\u6613\u5c06\u5b66\u4e60\u632b\u6298\u4e0e\u4eba\u751f\u632b\u6298\u5173\u8054\uff0c\u653e\u5f03\u53ef\u80fd\u6027\u9ad8\u3002 |\n\n*   **\u7efc\u5408\u9000\u8d39\u98ce\u9669\u7b49\u7ea7**\uff1a**\u6781\u9ad8**\u3002\u7ecf\u6d4e\u538b\u529b\u4e0e\u5fc3\u7406\u8106\u5f31\u53cc\u91cd\u9ad8\u538b\uff0c\u4efb\u4f55\u5b66\u4e60\u632b\u6298\u6216\u53d8\u73b0\u5ef6\u8fdf\u90fd\u53ef\u80fd\u6210\u4e3a\u9000\u8d39\u5bfc\u706b\u7d22\u3002\n\n## \u4e94\u3001 \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n\n1.  **\u8fc7\u5ea6\u627f\u8bfa\u98ce\u9669**\uff1a\u9500\u552e\u4f7f\u7528\u4e86\u201c\u770b\u597d\u4f60\u201d\u3001\u201c\u7ed9\u4f60\u6311\u4e86\u4e00\u672c\u7248\u6743\u4e66\u201d\u3001\u201c\u5b89\u6392\u5b66\u4e60\u5927\u793c\u5305\u201d\u7b49\u4e2a\u6027\u5316\u627f\u8bfa\uff0c\u53ef\u80fd\u8425\u9020\u4e86\u4e0d\u5207\u5b9e\u9645\u7684\u9884\u671f\u3002**\u9700\u786e\u4fdd\u540e\u7eed\u8d44\u6e90\u5206\u914d\u4e0e\u627f\u8bfa\u5339\u914d**\u3002\n2.  **\u5229\u7528\u8106\u5f31\u5fc3\u7406**\uff1a\u5728\u7528\u6237\u900f\u9732\u79bb\u5a5a\u3001\u8d1f\u503a\u7b49\u8106\u5f31\u4fe1\u606f\u540e\uff0c\u9500\u552e\u7ee7\u7eed\u63a8\u8fdb\u201c\u62a5\u540d\u901a\u9053\u201d\u3001\u201c\u798f\u5229\u53d1\u653e\u201d\uff0c\u867d\u6709\u5173\u6000\u8bdd\u672f\uff0c\u4f46**\u5b58\u5728\u5229\u7528\u5176\u60c5\u611f\u4f9d\u8d56\u548c\u6539\u53d8\u73b0\u72b6\u7684\u8feb\u5207\u5fc3\u7406\u4fc3\u6210\u4ea4\u6613\u7684\u4f26\u7406\u98ce\u9669**\u3002\n3.  **\u652f\u4ed8\u80fd\u529b\u8bc4\u4f30\u7f3a\u5931**\uff1a\u5728\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u6ca1\u94b1\u201d\u540e\uff0c\u9500\u552e\u672a\u6df1\u5165\u8bc4\u4f30\u5176\u771f\u5b9e\u7ecf\u6d4e\u72b6\u51b5\u548c\u8fd8\u6b3e\u80fd\u529b\uff0c\u4ecd\u4ee5\u201c\u7248\u6743\u4e66\u201d\u7b49\u798f\u5229\u8fdb\u884c\u8bf1\u5bfc\uff0c**\u672a\u5c65\u884c\u5bf9\u6d88\u8d39\u8005\u507f\u4ed8\u80fd\u529b\u7684\u5ba1\u614e\u6838\u67e5\u4e49\u52a1**\u3002\n4.  **\u77e5\u60c5\u540c\u610f**\uff1a\u6d41\u7a0b\u4e0a\u7528\u6237\u5b8c\u6210\u4e86\u6253\u5361\u3001\u9886\u4e66\u7b49\u52a8\u4f5c\uff0c\u4f46\u5bf9\u957f\u671f\u8bfe\u7a0b\u7684\u8d39\u7528\u3001\u5f3a\u5ea6\u3001\u53d8\u73b0\u6982\u7387\u7b49\u5173\u952e\u4fe1\u606f\uff0c\u5728\u804a\u5929\u8bb0\u5f55\u4e2d\u672a\u89c1\u7cfb\u7edf\u8bf4\u660e\u3002\n\n## \u516d\u3001 \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**\uff1a**\u4e25\u91cd\u9519\u914d**\u3002\u7528\u6237\u5f53\u524d\u7684\u7ecf\u6d4e\u72b6\u51b5\u548c\u5fc3\u7406\u72b6\u6001\uff0c\u5b8c\u5168\u4e0d\u9002\u5408\u63a8\u8350\u4efb\u4f55\u9700\u8981\u9884\u4ed8\u9ad8\u989d\u5b66\u8d39\u7684\u8bfe\u7a0b\u3002\u5176\u6838\u5fc3\u9700\u6c42\u662f\u4f4e\u6210\u672c\u7684\u60c5\u611f\u652f\u6301\u3001\u6280\u80fd\u5165\u95e8\u548c\u53ef\u80fd\u7684\u7075\u6d3b\u517c\u804c\u673a\u4f1a\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**\u7d27\u6025\u542f\u52a8\u98ce\u9669\u5e72\u9884\uff0c\u8fdb\u884c\u652f\u4ed8\u80fd\u529b\u4e0e\u5b66\u4e60\u9884\u671f\u4e8c\u6b21\u6821\u51c6**\u3002\n\n*   **\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u7acb\u5373\u98ce\u9669\u9884\u8b66**\uff1a\u5c06\u8be5\u5b66\u5458\u6807\u8bb0\u4e3a\u201c\u6781\u9ad8\u98ce\u9669-\u7ecf\u6d4e\u8106\u5f31\u578b\u201d\uff0c\u901a\u77e5\u73ed\u4e3b\u4efb\u53ca\u98ce\u63a7\u90e8\u95e8\u3002\n    2.  **\u652f\u4ed8\u80fd\u529b\u590d\u6838**\uff1a\u73ed\u4e3b\u4efb\u9700\u572824\u5c0f\u65f6\u5185\uff0c\u4ee5\u5173\u6000\u4e3a\u7531\uff0c\u6e29\u548c\u4f46\u76f4\u63a5\u5730\u4e86\u89e3\u5176\u5f53\u524d\u5177\u4f53\u7ecf\u6d4e\u72b6\u51b5\u3001\u6536\u5165\u6765\u6e90\u3001\u8d1f\u503a\u8be6\u60c5\u53ca\u629a\u517b\u8d23\u4efb\uff0c**\u8bc4\u4f30\u5176\u627f\u53d7\u5b66\u8d39\u800c\u4e0d\u5f71\u54cd\u57fa\u672c\u751f\u6d3b\u7684\u53ef\u80fd\u6027**\u3002\n    3.  **\u9884\u671f\u7ba1\u7406**\uff1a\u5fc5\u987b\u8fdb\u884c\u201c\u9884\u671f\u6821\u6b63\u201d\u8c08\u8bdd\u3002\u660e\u786e\u544a\u77e5\uff1aA) \u6709\u58f0\u884c\u4e1a\u53d8\u73b0\u5468\u671f\u957f\u3001\u6210\u529f\u7387\u975e100%\uff1bB) \u524d\u671f\u6295\u5165\u5305\u62ec\u65f6\u95f4\u3001\u53ef\u80fd\u7684\u57fa\u7840\u8bbe\u5907\uff1bC) \u8bfe\u7a0b\u4e3b\u8981\u63d0\u4f9b\u6280\u80fd\uff0c\u4e0d\u4fdd\u8bc1\u5c31\u4e1a\u3002**\u964d\u4f4e\u5176\u201c\u6551\u547d\u7a3b\u8349\u201d\u5f0f\u7684\u4e0d\u5207\u5b9e\u9645\u671f\u671b**\u3002\n    4.  **\u4f26\u7406\u529d\u9000\u5efa\u8bae**\uff1a\u57fa\u4e8e\u590d\u6838\u7ed3\u679c\uff0c\u82e5\u786e\u8ba4\u5176\u7ecf\u6d4e\u538b\u529b\u5de8\u5927\uff0c**\u5e94\u4f18\u5148\u5efa\u8bae\u5176\u6682\u7f13\u62a5\u540d\uff0c\u63a8\u8350\u514d\u8d39/\u4f4e\u6210\u672c\u5b66\u4e60\u8d44\u6e90**\uff0c\u5e76\u8868\u660e\u201c\u5f85\u7ecf\u6d4e\u72b6\u51b5\u7a33\u5b9a\u540e\u518d\u6765\u5b66\u4e60\u6548\u679c\u66f4\u4f73\u201d\u7684\u7acb\u573a\u3002\u8fd9\u65e2\u662f\u98ce\u9669\u63a7\u5236\uff0c\u4e5f\u662f\u4f01\u4e1a\u793e\u4f1a\u8d23\u4efb\u3002\n    5.  **\u60c5\u611f\u652f\u6301\u8f6c\u4ecb**\uff1a\u8868\u8fbe\u7406\u89e3\u4e0e\u5173\u6000\uff0c\u4f46**\u907f\u514d\u5c06\u8bfe\u7a0b\u9500\u552e\u4e0e\u60c5\u611f\u7597\u6108\u8fc7\u5ea6\u7ed1\u5b9a**\u3002\u53ef\u5efa\u8bae\u5176\u5bfb\u6c42\u4e13\u4e1a\u5fc3\u7406\u54a8\u8be2\u6216\u516c\u76ca\u652f\u6301\u56e2\u4f53\u3002\n    6.  **\u82e5\u4ecd\u575a\u6301\u62a5\u540d**\uff1a\u5fc5\u987b\u8fdb\u884c**\u5f3a\u786e\u8ba4**\uff0c\u5f55\u5236\u89c6\u9891\u6216\u7b7e\u7f72\u4e66\u9762\u544a\u77e5\u4e66\uff0c\u660e\u786e\u5176\u5df2\u77e5\u6653\u98ce\u9669\u3001\u7ecf\u6d4e\u72b6\u51b5\u53ca\u8bfe\u7a0b\u6761\u6b3e\u3002\u540e\u7eed\u670d\u52a1\u9700\u6295\u5165\u6781\u9ad8\u60c5\u611f\u7ef4\u62a4\u6210\u672c\uff0c\u5e76\u505a\u597d\u968f\u65f6\u5904\u7406\u9000\u8d39\u7533\u8bf7\u7684\u51c6\u5907\u3002\n\n{\"core_type\": \"T7 \u7ecf\u6d4e\u62ee\u636e\u7684\u5c1d\u8bd5\u8005 (\u504f\u60c5\u611f\u4f9d\u8d56)\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"product_match\": \"\u9519\u914d\", \"action\": \"\u7d27\u6025\u652f\u4ed8\u80fd\u529b\u590d\u6838\u4e0e\u9884\u671f\u6821\u6b63\"}";
