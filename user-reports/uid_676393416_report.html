    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u9ad8)**: \u5b66\u4e60\u76ee\u6807\u660e\u786e\u3001\u884c\u52a8\u529b\u5f3a\u3002\u79ef\u6781\u53c2\u4e0e\u5c0f\u7ec4\u5408\u4f5c\uff08\u62c5\u4efb\u5c0f\u7ec4\u957f\uff09\u3001\u8ba4\u771f\u63d0\u4ea4\u6709\u58f0\u4e4b\u591c\u53c2\u8d5b\u4f5c\u54c1\u3001\u53cd\u590d\u4fee\u6539\u6253\u78e8\u3001\u4e3b\u52a8\u8be2\u95ee\u8003\u8bd5\u548c\u73ed\u4f1a\u4fe1\u606f\u3001\u4e3b\u52a8\u5145\u503c\u97f3\u526a\u5de5\u5177\u3002\u8868\u73b0\u51fa\u5f3a\u70c8\u7684**\u6280\u80fd\u63d0\u5347\u548c\u6210\u679c\u5bfc\u5411**\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d\u7b49)**: \u5177\u5907\u57fa\u7840\u5b66\u4e60\u6761\u4ef6\uff08\u6709\u7535\u8111\uff09\uff0c\u5df2\u8d2d\u4e70\u8bbe\u5907\uff08\u201c\u7b2c\u4e00\u6b21\u7528\u8bbe\u5907\u8bd5\u97f3\u201d\uff09\uff0c\u5e76\u613f\u610f\u4e3a\u5b66\u4e60\u5de5\u5177\u4ed8\u8d39\uff08\u4e3b\u52a8\u7533\u8bf7\u5f00\u901a\u97f3\u526a\u5236\u4f5c\u7ec4\u5e76\u5145\u503c\uff09\u3002\u65f6\u95f4\u6295\u5165\u5ea6\u9ad8\uff08\u5b66\u4e60\u65f6\u957f\u201c\u65ad\u5d16\u7b2c\u4e00\u201d\uff0c\u5f55\u64ad\u8bfe\u53cd\u590d\u89c2\u770b\uff09\u3002\u4f46\u73af\u5883\u9700\u4f18\u5316\uff08\u63d0\u53ca\u5f55\u97f3\u73af\u5883\u5e03\u7f6e\uff0c\u5982\u201c\u80cc\u9762\u6709\u70b9\u7a7a\u201d\uff0c\u8d2d\u4e70\u4f38\u7f29\u6746\u642d\u5e18\u5b50\uff09\u3002**\u65e0\u660e\u663e\u7ecf\u6d4e\u538b\u529b\u4fe1\u53f7**\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u9ad8)**: \u79ef\u6781\u4e3b\u52a8\uff0c\u4e50\u4e8e\u534f\u4f5c\uff08\u5728\u7fa4\u5185\u9891\u7e41\u4e92\u52a8\u3001\u5f81\u6c42\u610f\u89c1\u3001\u606d\u559c\u4ed6\u4eba\uff09\u3002\u9762\u5bf9\u95ee\u9898\uff08\u5982\u63d0\u4ea4\u5931\u8d25\u3001\u73af\u5883\u5e03\u7f6e\uff09\u80fd\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u60c5\u7eea\u7a33\u5b9a\u4e50\u89c2\u3002\u6709\u8d23\u4efb\u5fc3\uff08\u201c\u751f\u6015\u56e0\u4e3a\u6211\u803d\u8bef\u4e8b\u201d\uff09\uff0c\u6297\u538b\u80fd\u529b\u8f83\u597d\uff08\u201c\u7d27\u5f20\u6b7b\u6211\u4e86\u2026\u592a\u523a\u6fc0\u4e86\u201d\u4f46\u80fd\u5b8c\u6210\uff09\u3002**\u5b66\u4e60\u5185\u9a71\u529b\u548c\u793e\u7fa4\u878d\u5165\u5ea6\u5747\u9ad8**\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40 \u652f\u4ed8\u6838\u67e5**: \u5df2\u652f\u4ed8\u3002\u7528\u6237\u4e3b\u52a8\u7533\u8bf7\u5f00\u901a\u5e76\u5145\u503c\u97f3\u526a\u5236\u4f5c\u7ec4\uff08474\u5143\uff09\uff0c\u8868\u660e\u5df2\u8fdb\u5165\u4ed8\u8d39\u5b66\u4e60\u9636\u6bb5\u3002\n*   **\u6b65\u9aa41.5 \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u914d\u5076\u6216\u5bb6\u4eba\u5bf9\u5b66\u4e60\u3001\u65f6\u95f4\u6295\u5165\u53ca\u6d88\u8d39\u7684\u6001\u5ea6\u3002\u4ec5\u63d0\u53ca\u201c\u6211\u770b\u5b8c\u4e0a\u73ed\u540e\u6211\u8001\u516c\u770b\u201d\uff0c\u6697\u793a\u5bb6\u4eba\u77e5\u6653\u4f46\u4e0d\u4ee3\u8868\u652f\u6301\u51b3\u7b56\u3002**\u9700\u6838\u5b9e\u5bb6\u5ead\u652f\u6301\u5ea6**\u3002\n*   **\u6b65\u9aa42-4 \u7efc\u5408\u5224\u5b9a**: \u52a8\u673a\u5f3a\u3001\u8d44\u6e90\u53ef\u652f\u6491\u3001\u884c\u52a8\u529b\u4f73\u3001\u793e\u7fa4\u53c2\u4e0e\u6df1\u3002\u5c5e\u4e8e**\u9ad8\u6295\u5165\u3001\u9ad8\u53c2\u4e0e\u3001\u660e\u786e\u76ee\u6807**\u7684\u7528\u6237\u3002\u5224\u5b9a\u4e3a **B\u7c7b\uff08\u9ad8\u6f5c\u529b\u7a33\u5b9a\u578b\uff09**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n**T3 \u81ea\u5f8b\u5b9e\u8df5\u5bb6**\n*   **\u6838\u5fc3\u7279\u5f81**: \u76ee\u6807\u6e05\u6670\u3001\u6267\u884c\u529b\u5f3a\u3001\u9075\u5faa\u4f53\u7cfb\u3001\u91cd\u89c6\u5b9e\u64cd\u4e0e\u6210\u679c\u3002\n*   **\u5339\u914d\u4f9d\u636e**: \u4e25\u683c\u8ddf\u8fdb\u8bfe\u7a0b\u4e0e\u4f5c\u4e1a\uff08\u5b66\u4e60\u65f6\u957f\u7b2c\u4e00\uff09\u3001\u79ef\u6781\u53c2\u4e0e\u6240\u6709\u6d3b\u52a8\uff08\u6bd4\u8d5b\u3001\u8003\u8bd5\u3001\u73ed\u4f1a\uff09\u3001\u4e3b\u52a8\u4e3a\u5b66\u4e60\u6548\u679c\u6295\u8d44\uff08\u8bbe\u5907\u3001\u97f3\u526a\uff09\u3001\u5728\u793e\u7fa4\u4e2d\u626e\u6f14\u534f\u4f5c\u4e0e\u63a8\u52a8\u89d2\u8272\uff08\u5c0f\u7ec4\u957f\uff09\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4f4e)\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**: \u98ce\u9669\u4f4e\u3002\u7528\u6237\u5df2\u83b7\u5f97\u6b63\u5411\u53cd\u9988\uff08\u8bd5\u97f3\u8fc7\u521d\u5ba1\uff09\uff0c\u4e14\u5b66\u4e60\u884c\u4e3a\u9ad8\u5ea6\u81ea\u5f8b\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**: \u98ce\u9669\u4f4e\u3002\u4e3b\u52a8\u8fdb\u884c\u8bfe\u7a0b\u5916\u6d88\u8d39\uff08\u97f3\u526a\uff09\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u56f0\u96be\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**: \u98ce\u9669\u4f4e\u3002\u867d\u63d0\u53ca\u201c\u8bfe\u51b2\u7a81\u4e86\u201d\uff0c\u4f46\u6574\u4f53\u65f6\u95f4\u5b89\u6392\u7d27\u51d1\uff0c\u79ef\u6781\u6295\u5165\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9**: **\u98ce\u9669\u672a\u77e5\uff0c\u9700\u5173\u6ce8**\u3002\u7f3a\u4e4f\u5bb6\u5ead\u51b3\u7b56\u5c42\u660e\u786e\u652f\u6301\u4fe1\u606f\u3002\n    5.  **\u9500\u552e\u627f\u8bfa\u4e0d\u7b26**: \u98ce\u9669\u4f4e\u3002\u8bb0\u5f55\u4e2d\u4e3b\u8981\u4e3a\u5b66\u4e60\u652f\u6301\uff0c\u65e0\u8fc7\u5ea6\u627f\u8bfa\u8ff9\u8c61\u3002\n    6.  **\u670d\u52a1\u8d28\u91cf**: \u98ce\u9669\u4f4e\u3002\u7528\u6237\u4e0e\u73ed\u73ed\u4e92\u52a8\u987a\u7545\uff0c\u95ee\u9898\u80fd\u5f97\u5230\u89e3\u51b3\u3002\n    7.  **\u5e73\u53f0/\u4ea7\u54c1\u4f53\u9a8c**: \u98ce\u9669\u4f4e\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u63d0\u4ea4\u7cfb\u7edf\uff09\u80fd\u8010\u5fc3\u914d\u5408\u89e3\u51b3\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u65e0\u91cd\u5927\u8fdd\u89c4**\u3002\u9500\u552e\uff08\u73ed\u73ed\uff09\u56de\u590d\u4ee5\u5b66\u4e60\u652f\u6301\u3001\u95ee\u9898\u89e3\u7b54\u3001\u6d3b\u52a8\u901a\u77e5\u4e3a\u4e3b\uff0c\u672a\u53d1\u73b0\u5938\u5927\u6536\u76ca\u3001\u627f\u8bfa\u4fdd\u5e95\u6536\u5165\u7b49\u8fdd\u89c4\u8bdd\u672f\u3002\n*   **\u6f5c\u5728\u98ce\u9669\u70b9**: \u7528\u6237\u4e3b\u52a8\u63d0\u53ca\u201c\u5b66\u4e60\u65f6\u957f\u516b\u767e\u591a\u5c0f\u65f6\u201d\uff0c**\u9700\u8b66\u60d5\u5176\u53ef\u80fd\u56e0\u8fc7\u5ea6\u6295\u5165\u800c\u4ea7\u751f\u8eab\u5fc3\u75b2\u60eb\u6216\u5bf9\u5b66\u4e60\u6548\u679c\u6709\u8fc7\u9ad8\u3001\u4e0d\u5207\u5b9e\u9645\u7684\u671f\u5f85**\u3002\u73ed\u73ed\u9700\u5f15\u5bfc\u5065\u5eb7\u5b66\u4e60\u8282\u594f\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d**: **\u9ad8\u5ea6\u5339\u914d**\u3002\u7528\u6237\u6df1\u5ea6\u53c2\u4e0e\u8bfe\u7a0b\u4f53\u7cfb\uff0c\u5e76\u4e3b\u52a8\u8d2d\u4e70\u589e\u503c\u5de5\u5177\uff08\u97f3\u526a\uff09\uff0c\u4e0e\u4ea7\u54c1\u63d0\u4f9b\u7684\u5b66\u4e60\u8def\u5f84\u5951\u5408\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **\u5f3a\u5316\u652f\u6301\uff0c\u9884\u9632\u5026\u6020\uff0c\u6838\u5b9e\u5bb6\u5ead\u652f\u6301**\u3002\n*   **\u5177\u4f53\u884c\u52a8\u5efa\u8bae**:\n    1.  **\u8ba4\u53ef\u4e0e\u6fc0\u52b1**: \u516c\u5f00\u8ba4\u53ef\u5176\u5b66\u4e60\u70ed\u60c5\u548c\u6210\u679c\uff08\u5982\u8fc7\u521d\u5ba1\uff09\uff0c\u5c06\u5176\u6811\u7acb\u4e3a\u73ed\u7ea7\u699c\u6837\u3002\n    2.  **\u5065\u5eb7\u5f15\u5bfc**: \u79c1\u4e0b\u6c9f\u901a\uff0c\u8d5e\u8d4f\u5176\u6295\u5165\u7684\u540c\u65f6\uff0c\u63d0\u9192\u6ce8\u610f\u52b3\u9038\u7ed3\u5408\uff0c\u907f\u514d\u56e0\u8fc7\u5ea6\u5b66\u4e60\u5bfc\u81f4\u5026\u6020\u3002\u8be2\u95ee\u5176\u5b66\u4e60\u8282\u594f\u662f\u5426\u53ef\u6301\u7eed\u3002\n    3.  **\u5bb6\u5ead\u77e5\u60c5\u6838\u67e5**: \u4ee5\u5173\u6000\u65b9\u5f0f\uff0c**\u59d4\u5a49\u4e86\u89e3\u5bb6\u4eba\u5bf9\u5176\u5b66\u4e60\u65f6\u95f4\u6295\u5165\u53ca\u6d88\u8d39\u7684\u770b\u6cd5**\uff0c\u786e\u4fdd\u5b66\u4e60\u73af\u5883\u7a33\u5b9a\u3002\u4f8b\u5982\uff1a\u201c\u770b\u5230\u60a8\u5b66\u4e60\u8fd9\u4e48\u6295\u5165\uff0c\u5bb6\u4eba\u4e00\u5b9a\u4e5f\u5f88\u652f\u6301\u5427\uff1f\u201d\n    4.  **\u63d0\u4f9b\u8fdb\u9636\u8def\u5f84**: \u57fa\u4e8e\u5176\u201c\u5b9e\u8df5\u5bb6\u201d\u7279\u8d28\uff0c\u63d0\u4f9b\u66f4\u5177\u4f53\u7684\u8fdb\u9636\u6307\u5bfc\u3001\u6bd4\u8d5b\u673a\u4f1a\u6216\u5185\u90e8\u8d44\u6e90\u94fe\u63a5\uff0c\u6ee1\u8db3\u5176\u6210\u957f\u9700\u6c42\u3002\n    5.  **\u5e38\u89c4\u670d\u52a1**: \u4fdd\u6301\u73b0\u6709\u7684\u54cd\u5e94\u901f\u5ea6\u548c\u95ee\u9898\u89e3\u51b3\u652f\u6301\u3002\n\n{\"core_type\": \"T3 \u81ea\u5f8b\u5b9e\u8df5\u5bb6\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u8ba4\u53ef\u6fc0\u52b1\uff0c\u9884\u9632\u5026\u6020\uff0c\u6838\u67e5\u5bb6\u5ead\u652f\u6301\"}";
