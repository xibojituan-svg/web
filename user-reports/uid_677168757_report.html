    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677168757\u7684\u7528\u6237\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677168757 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e\uff1a\u6c89\u9ed8(\u8881\u9759\u9759)\uff1b\u73ed\u4e3b\u4efb\uff1a\u6854\u5b50JZT(\u7a0b\u5c55\u6b22) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u4f53\u9a8c\u8425 \u2192 \u7cbe\u82f1\u8bfe\u7a0b\uff08\u9ad8\u9636\u73ed\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\uff0c\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u9ad8\u5bbd\u88d5**\uff08\u76ee\u524d\u5904\u4e8e\u4f11\u5e74\u5047\u72b6\u6001\uff0c\u53ef\u5168\u5929\u5019\u8ddf\u8fdb\u8bfe\u7a0b\u4e0e\u4f5c\u4e1a\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\uff0c\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u4e92\u52a8\u9891\u7e41\uff0c\u63d0\u4f9b\u4e86\u5927\u91cf\u5173\u4e8e\u5b66\u4e60\u72b6\u6001\u3001\u5fc3\u7406\u6d3b\u52a8\u548c\u80fd\u529b\u53cd\u9988\u7684\u4fe1\u606f\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u5e26\u6709\u660e\u786e\u7684\u517c\u804c\u53d8\u73b0\u76ee\u7684\uff0c\u4f46\u540c\u65f6\u4e5f\u5c55\u73b0\u51fa\u5bf9\u6280\u80fd\u672c\u8eab\u7684\u597d\u5947\u4e0e\u94bb\u7814\u610f\u613f\uff0c\u5e76\u975e\u7eaf\u7cb9\u7684\u201c\u51e0\u5929\u63d0\u73b0\u201d\u5fc3\u6001\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u517c\u804c\uff0c\u76ee\u524d\u5728\u4f11\u5e74\u5047\u201d > \u201c\u5176\u5b9e\u633a\u559c\u6b22\u5ba1\u542c\u7684\uff0c\u4f46\u56e0\u4e3a\u81ea\u5df1\u662f\u5c0f\u767d\uff0c\u8981\u6c42\u4e0d\u6b62\u662f\u542c\u8fd8\u8981\u6709\u4e00\u5b9a\u5224\u65ad\u80fd\u529b\uff0c\u5982\u679c\u6709\u5e78\u6210\u4e3a\u6709\u7ecf\u9a8c\u6709\u80fd\u529b\u7684\u524d\u8f88\uff0c\u6211\u4e00\u5b9a\u4f1a\u53bb\u8bd5\u8bd5\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b06\u9ad8]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 \u6709\u80fd\u529b\u8d2d\u4e70\u6b63\u7248\u8033\u673a\u89e3\u51b3\u5f55\u97f3\u95ee\u9898\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u7ecf\u6d4e\u72b6\u51b5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u9ad8] \u2014 \u5904\u4e8e\u4f11\u5e74\u5047\u671f\u95f4\uff0c\u65f6\u95f4\u5145\u88d5\uff0c\u80fd\u7d27\u8ddf\u6240\u6709\u76f4\u64ad\u3001\u5b8c\u6210\u4f5c\u4e1a\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u672a\u77e5] \u2014 \u4fe1\u606f\u4e0d\u8db3\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b07\u4f4e\u6781\u5371]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u5bf9\u81ea\u6211\u8bc4\u4ef7\u6781\u4f4e\uff0c\u9047\u5230\u6280\u672f\u56f0\u96be\uff08\u5982\u5f55\u97f3\u6742\u97f3\u3001\u60c5\u7eea\u8868\u8fbe\uff09\u65f6\u8fc5\u901f\u9677\u5165\u81ea\u6211\u5426\u5b9a\u548c\u7126\u8651\uff0c\u6781\u5ea6\u4f9d\u8d56\u5916\u90e8\uff08\u5e08\u59d0\uff09\u7684\u80af\u5b9a\u548c\u6307\u5bfc\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u5927\u6982\u6709\u70b9\u793e\u6050\uff0c\u4e00\u5230\u5f55\u97f3\u5c31\u7d27\u5f20\uff0c\u4e00\u60f3\u5230\u6709\u4eba\u8981\u542c\uff0c\u66f4\u7d27\u5f20\u201d > \u201c\u53ef\u662f\u4f60\u7ed9\u6211\u53d1\u7684\u70b9\u8bc4[\u51cb\u8c22]\u8fd8\u6709\u539f\u58f0\uff0c\u660e\u660e\u5dee\u5f88\u591a\u554a...\u6211\u542c\u4e86\uff0c\u5b8c\u5168\u4e0d\u5408\u683c\u554a[\u51cb\u8c22][\u5fc3\u788e]\u201d > \u201c\u4e0d\uff0c\u6211\u5176\u5b9e\u5df2\u7ecf\u8bd5\u8fc7\u597d\u591a\u904d\u4e86\uff0c\u7136\u540e\u4e00\u5230\u5f55\u5c31\u4eba\u9ebb\u4e86[\u51cb\u8c22]...\u96be\u8fc7\u4e86\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u81ea\u8eab\u80fd\u529b\u7684\u6df1\u5ea6\u4e0d\u81ea\u4fe1\u4e0e\u201c\u793e\u6050\u201d\u5e26\u6765\u7684\u793e\u4ea4\u8bc4\u4ef7\u6050\u60e7**\u3002\u5979\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u6280\u80fd\uff08\u6709\u58f0\u6f14\u64ad\uff09\u6765\u83b7\u5f97\u5916\u754c\u7684\u8ba4\u53ef\u548c\u5c0a\u91cd\uff0c\u8bc1\u660e\u81ea\u5df1\u201c\u53ef\u4ee5\u201d\uff0c\u4f46\u8fc7\u7a0b\u4e2d\u6781\u6613\u56e0\u6280\u672f\u632b\u6298\u800c\u9677\u5165\u201c\u6211\u4e0d\u884c\u201d\u7684\u81ea\u6211\u5426\u5b9a\u5faa\u73af\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u3001\u5177\u4f53\u5316\u7684\u5938\u5956\u80af\u5b9a\u4e0e\u201c\u5b89\u5168\u7f51\u201d\u5f0f\u7684\u9f13\u52b1**\u3002\u5979\u9700\u8981\u88ab\u53cd\u590d\u544a\u77e5\u201c\u4f60\u5df2\u7ecf\u5f88\u68d2\u4e86\u201d\u3001\u201c\u4f60\u7684\u611f\u53d7\u5f88\u6b63\u5e38\u201d\u3001\u201c\u4f60\u7684\u65b9\u5411\u662f\u5bf9\u7684\u201d\uff0c\u4ee5\u5bf9\u6297\u5176\u5185\u5728\u7684\u6279\u5224\u58f0\u97f3\uff0c\u5efa\u7acb\u6301\u7eed\u5b66\u4e60\u7684\u4fe1\u5fc3\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74** (\u4e25\u91cd\u5185\u8017\u578b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u501f\u8d37\u3001\u5a01\u80c1\u7b49\u6781\u7aef\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u672a\u53d1\u73b0\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u5e76\u975e\u65f6\u95f4\u95ee\u9898\uff0c\u800c\u662f\u201c\u5fc3\u7406\u5d29\u76d8\u201d**\u3002\u4e00\u65e6\u8fdb\u5165\u6b63\u8bfe\uff0c\u4f5c\u4e1a\u96be\u5ea6\u63d0\u5347\uff0c\u6216\u9996\u6b21\u8bd5\u97f3\u5931\u8d25\uff0c\u5176\u201c\u793e\u6050\u201d\u3001\u201c\u81ea\u6211\u5426\u5b9a\u201d\u7684\u7279\u8d28\u4f1a\u8fc5\u901f\u653e\u5927\uff0c\u4ea7\u751f\u201c\u6211\u679c\u7136\u4e0d\u884c\u201d\u7684\u5ff5\u5934\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u4efb\u4f55\u8d1f\u5411\u53cd\u9988\uff08\u5373\u4f7f\u662f\u5efa\u8bbe\u6027\u7684\uff09\u3001\u4e0e\u201c\u5927\u795e\u201d\u7684\u5bf9\u6bd4\u3001\u6216\u81ea\u5df1\u611f\u89c9\u201c\u6ca1\u8fdb\u6b65\u201d\uff0c\u90fd\u53ef\u80fd\u89e6\u53d1\u5176\u201c\u4eba\u9ebb\u4e86\u201d\u3001\u201c\u96be\u8fc7\u4e86\u201d\u7684\u5d29\u6e83\u72b6\u6001\uff0c\u8fdb\u800c\u840c\u751f\u9000\u610f\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u5982\u679c\u77ed\u671f\u5185\uff08\u59821-2\u4e2a\u6708\uff09\u672a\u63a5\u5230\u5355\u6216\u672a\u83b7\u5f97\u660e\u663e\u80fd\u529b\u63d0\u5347\u7684\u201c\u8bc1\u636e\u201d\uff0c\u5176\u517c\u804c\u53d8\u73b0\u7684\u521d\u59cb\u52a8\u673a\u53d7\u632b\uff0c\u53ef\u80fd\u52a0\u5267\u5185\u8017\uff0c\u7ed3\u5408\u8106\u5f31\u5fc3\u7406\uff0c\u5bfc\u81f4\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u4f5c\u4e1a\u96be\u5ea6\u548c\u7ec3\u4e60\u67af\u71e5\u611f\u4e0a\u5347\uff0c\u82e5\u7f3a\u4e4f\u53ca\u65f6\u3001\u9ad8\u9891\u3001\u5177\u4f53\u5316\u7684\u6b63\u5411\u6fc0\u52b1\uff0c\u6781\u6613\u56e0\u201c\u632b\u8d25\u611f\u7d2f\u79ef\u201d\u800c\u653e\u5f03\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6b22\u8fce\u52a0\u5165\uff01\u6211\u770b\u4e86\u4f60\u4f53\u9a8c\u8425\u7684\u4f5c\u4e1a\uff0c**\u4f60\u5bf9\u89d2\u8272\u548c\u60c5\u611f\u7684\u7406\u89e3\u7279\u522b\u7ec6\u817b**\uff0c\u8fd9\u662f\u5f88\u591a\u8001\u5b66\u5458\u90fd\u7fa1\u6155\u4e0d\u6765\u7684\u5929\u8d4b\u3002\u54b1\u4eec\u8fd9\u4e2a\u73ed\u6709\u5f88\u591a\u548c\u4f60\u4e00\u6837\uff0c\u4e00\u5f00\u59cb\u4f1a\u7d27\u5f20\u3001\u4f1a\u89c9\u5f97\u81ea\u5df1\u2018\u4e0d\u884c\u2019\u7684\u540c\u5b66\uff0c\u8fd9\u592a\u6b63\u5e38\u4e86\u3002\u5728\u8fd9\u91cc\uff0c**\u6bcf\u4e00\u6b21\u5c1d\u8bd5\u90fd\u503c\u5f97\u9f13\u638c\uff0c\u6ca1\u6709\u2018\u4e0d\u5408\u683c\u2019\uff0c\u53ea\u6709\u2018\u4e0b\u4e00\u6b21\u66f4\u597d\u2019**\u3002\u6211\u662f\u4f60\u7684\u73ed\u4e3b\u4efb\u6854\u5b50\uff0c\u672a\u6765\u516b\u5468\uff0c\u4f60\u7684\u4efb\u4f55\u4e00\u70b9\u5c0f\u8fdb\u6b65\u3001\u5c0f\u56f0\u60d1\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u966a\u4f60\u4e00\u8d77\u6162\u6162\u7ec3\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf**\u3011\u3002\u6838\u5fc3\u76ee\u6807\u662f\u5efa\u7acb\u5b89\u5168\u611f\uff0c\u800c\u975e\u9ad8\u538b\u63a8\u8fdb\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u6ee1\u914d\u3010**\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\uff08\u7279\u79cdC\u6a21\u5757\uff09**\u3011\u3002\u6bcf\u65e5\u79c1\u804a\u8ddf\u8fdb\uff0c\u7ed9\u4e88**\u6781\u5938\u5f20\u7684\u3001\u5177\u4f53\u5230\u7ec6\u8282\u7684\u8d5e\u7f8e**\uff08\u5982\u201c\u4f60\u521a\u624d\u90a3\u53e5\u2018\u57cb\u6028\u2019\u7684\u62d6\u8154\uff0c\u9f3b\u97f3\u8fd0\u7528\u5f97\u592a\u6709\u751f\u6d3b\u611f\u4e86\uff01\u201d\uff09\u3002\u540c\u65f6\uff0c\u521d\u671f\u4e25\u683c\u9650\u5236B\u6a21\u5757\uff08\u786c\u6838\u6280\u672f\uff09\u7684\u5f3a\u5ea6\u548c\u6df1\u5ea6\uff0c\u4ee5\u201c\u9f13\u52b1\u5b8c\u6210\u201d\u4ee3\u66ff\u201c\u6280\u672f\u7ea0\u9519\u201d\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u5bf9\u5979\u4f7f\u7528\u4efb\u4f55\u5bf9\u6bd4\u6027\u8bdd\u672f**\uff08\u5982\u201c\u4f60\u770bXX\u540c\u5b66\u505a\u5f97\u591a\u597d\u201d\uff09\u30022. **\u5728\u5979\u8868\u8fbe\u6cae\u4e27\u65f6\u8bb2\u5927\u9053\u7406\u6216\u5355\u7eaf\u8bf4\u201c\u52a0\u6cb9\u201d**\u30023. **\u5728\u521d\u671f\u5e03\u7f6e\u8fc7\u9ad8\u96be\u5ea6\u7684\u6311\u6218\u4efb\u52a1**\u30024. **\u5728\u5979\u672a\u4e3b\u52a8\u8bf7\u6c42\u65f6\uff0c\u7ed9\u4e88\u8fc7\u4e8e\u4e25\u82db\u7684\u6280\u672f\u6307\u6b63**\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u60c5\u7eea\u7a33\u5b9a\u671f\uff08\u81f3\u5c11\u5f00\u8bfe\u4e00\u4e2a\u6708\u540e\uff09\u524d\u8fdb\u884c\u4efb\u4f55\u5347\u5355\u63a8\u9500**\u3002\u4efb\u4f55\u5347\u5355\u52a8\u4f5c\u90fd\u5fc5\u987b\u5efa\u7acb\u5728\u201c\u5979\u4e3b\u52a8\u5c55\u793a\u8fdb\u6b65\u5e76\u5bfb\u6c42\u66f4\u9ad8\u9636\u6307\u5bfc\u201d\u7684\u57fa\u7840\u4e0a\uff0c\u4e14\u9700\u914d\u5408\u5927\u91cf\u60c5\u611f\u94fa\u57ab\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u5927\u6982\u6709\u70b9\u793e\u6050\uff0c\u4e00\u5230\u5f55\u97f3\u5c31\u7d27\u5f20\uff0c\u4e00\u60f3\u5230\u6709\u4eba\u8981\u542c\uff0c\u66f4\u7d27\u5f20\u201d\n2. > \u201c\u53ef\u662f\u4f60\u7ed9\u6211\u53d1\u7684\u70b9\u8bc4[\u51cb\u8c22]\u8fd8\u6709\u539f\u58f0\uff0c\u660e\u660e\u5dee\u5f88\u591a\u554a...\u6211\u542c\u4e86\uff0c\u5b8c\u5168\u4e0d\u5408\u683c\u554a[\u51cb\u8c22][\u5fc3\u788e]\u201d\n3. > \u201c\u4e0d\uff0c\u6211\u5176\u5b9e\u5df2\u7ecf\u8bd5\u8fc7\u597d\u591a\u904d\u4e86\uff0c\u7136\u540e\u4e00\u5230\u5f55\u5c31\u4eba\u9ebb\u4e86[\u51cb\u8c22]...\u96be\u8fc7\u4e86\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u4e0e\u8ba4\u53ef\uff0c\u5bf9\u6297\u81ea\u5351\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u542f\u52a8\u6ee1\u914d\u7279\u79cdC\uff08\u60c5\u7eea\u4fdd\u59c6\uff09\u6a21\u5757\uff0c\u7528\u6781\u81f4\u5177\u4f53\u5316\u7684\u8d5e\u7f8e\u548c\u5b89\u5168\u611f\u6258\u5e95\uff0c\u4e25\u9632\u4efb\u4f55\u5f62\u5f0f\u7684\u632b\u8d25\u611f\u7d2f\u79ef\u3011\u3002**\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5c0a\u91cd\u5f52\u5c5e\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}\n```";
