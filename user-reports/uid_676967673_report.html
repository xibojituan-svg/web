        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u9ed8-\u5e7f\u5dde-\u5973\u64ad (UID: 676967673) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-07 \u81f3 2026-03-15 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5c0f\u767d\u73ed\u4e3b\u4efb/\u7206\u8354\u767d (\u590f\u70dc) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u7cbe\u82f16S\u6210\u957f\u73ed (\u5df2\u8d2d\uff0c\u5e76\u5b8c\u6210\u4e8c\u7ea7\u5347\u7ea7) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u8d44\u91d1\u6765\u6e90\u6216\u5bb6\u5ead\u7ecf\u6d4e\u538b\u529b\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u5468\u4e2d\u4f4f\u51fa\u79df\u5c4b\uff0c\u5468\u672b\u5076\u5c14\u56de\u5bb6\uff0c\u901a\u52e4\u8def\u4e0a\u3001\u4e0b\u73ed\u540e\u3001\u6478\u9c7c\u65f6\u95f4\u5b66\u4e60\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\uff0c\u4ec5\u63d0\u53ca\u5468\u672b\u56de\u5bb6\u4e0e\u7236\u6bcd\u4ea4\u6d41\uff0c\u4f46\u672a\u8bf4\u660e\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\u5176\u5b66\u4e60\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u804a\u5929\u8bb0\u5f55\u8be6\u7ec6\u5c55\u793a\u4e86\u5b66\u4e60\u8fc7\u7a0b\u3001\u73af\u5883\u3001\u8bbe\u5907\u3001\u5fc3\u7406\u72b6\u6001\u53ca\u5177\u4f53\u6280\u672f\u95ee\u9898\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u2b07\u4f4e**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34\uff0c\u4f46\u5f53\u524d\u9636\u6bb5\u4ee5\u5174\u8da3\u63a2\u7d22\u548c\u6280\u80fd\u7cbe\u8fdb\u4e3a\u4e3b\uff0c\u53d8\u73b0\u8bc9\u6c42\u6a21\u7cca\u4e14\u975e\u77ed\u671f\u5f3a\u9a71\u52a8\u3002** \u804a\u5929\u4e2d\u672a\u63d0\u53ca\u4efb\u4f55\u5173\u4e8e\u201c\u8d5a\u94b1\u201d\u3001\u201c\u53d8\u73b0\u201d\u3001\u201c\u63a5\u5355\u6536\u5165\u201d\u7684\u660e\u786e\u8bc9\u6c42\u6216\u65f6\u95f4\u9884\u671f\u3002\u5176\u6838\u5fc3\u5173\u6ce8\u70b9\u5728\u4e8e\u201c\u7ec3\u597d\u201d\u3001\u201c\u5f55\u597d\u201d\u3001\u201c\u89e3\u51b3\u95ee\u9898\u201d\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u54ce\u5440\uff0c\u5fc3\u585e[\u76b1\u7709]\u201d (\u56e0\u53e3\u6c34\u97f3\u95ee\u9898\u56f0\u6270)\uff1b> \u201c\u6211\u90a3\u4e2a\u624d1\u5206\u949f15\u79d2\u201d (\u5173\u6ce8\u4efb\u52a1\u5b8c\u6210\u5ea6\u800c\u975e\u6536\u76ca)\uff1b> \u201c\u5f55\u5b8c\u4e86\uff0c\u4e0d\u7528Au\u6211\u90fd\u80fd\u627e\u51fa\u4e00\u5806\u95ee\u9898\uff1a\u54ac\u5b57\u4e0d\u6e05\u3001\u4e0d\u4f1a\u7528\u6c14\u3001\u53e3\u6c34\u97f3\u3001\u55b7\u9ea6\u201d (\u805a\u7126\u4e8e\u81ea\u8eab\u6280\u80fd\u7f3a\u9677)\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\uff0c\u613f\u610f\u4e3a\u5b66\u4e60\u6295\u5165\uff08\u8003\u8651\u8d2d\u4e70\u5f55\u97f3\u68da\u3001\u684c\u5b50\uff09\uff0c\u4f46\u9009\u62e9\u5148\u4ece\u4f4e\u6210\u672c\u65b9\u6848\uff08\u81ea\u5236\u68da\uff09\u5f00\u59cb\uff0c\u6d88\u8d39\u7406\u6027\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u6709\u56fa\u5b9a\u5de5\u4f5c\uff0c\u5b66\u4e60\u65f6\u95f4\u9760\u901a\u52e4\u3001\u4e0b\u73ed\u540e\u3001\u5468\u672b\u201c\u62fc\u51d1\u201d\u3002\u80fd\u575a\u6301\u65e9\u529f\u3001\u4ea4\u4f5c\u4e1a\uff0c\u4f46\u5b58\u5728\u201c\u6478\u9c7c\u542c\u8bfe\u201d\u5bfc\u81f4\u6548\u679c\u4e0d\u4f73\u7684\u60c5\u51b5\u3002**\u65f6\u95f4\u788e\u7247\u5316\u662f\u4e3b\u8981\u77ed\u677f**\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e** \u2014 \u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\uff0c\u5468\u672b\u56de\u5bb6\u4f46\u672a\u8bf4\u660e\u662f\u5426\u652f\u6301\u5b66\u4e60\u3002\u6b64\u4e3a\u6f5c\u5728\u98ce\u9669\u70b9\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b07\u4f4e\u6781\u5371**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u9047\u5230\u5fae\u5c0f\u6280\u672f\u95ee\u9898\uff08\u53e3\u6c34\u97f3\u3001\u73af\u5883\u566a\u97f3\u3001\u8f6f\u4ef6\u64cd\u4f5c\uff09\u65f6\uff0c\u8868\u73b0\u51fa\u663e\u8457\u7684\u7126\u8651\u3001\u81ea\u6211\u6000\u7591\u548c\u53cd\u590d\u7ea0\u7ed3\u3002\u9700\u8981\u73ed\u4e3b\u4efb\u9891\u7e41\u3001\u7ec6\u81f4\u7684\u5b89\u629a\u548c\u5177\u4f53\u6307\u5bfc\uff0c\u60c5\u7eea\u6781\u6613\u53d7\u632b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u611f\u89c9\u8bf4\u8bdd\uff0c\u8bf4\u8bdd\u6b63\u5e38\u8bf4\u8bdd\uff0c\u4ed6\u53cd\u800c\u597d\u50cf\u4e0d\u592a\u62ac\u5f97\u8d77\u6765\u3002\u201d (\u521d\u671f\u81ea\u6211\u5426\u5b9a)\uff1b> \u201c\u54ce\u5440\uff0c\u5fc3\u585e[\u76b1\u7709]\u201d (\u56e0\u53e3\u6c34\u97f3\u95ee\u9898\u76f4\u63a5\u60c5\u7eea\u4f4e\u843d)\uff1b> \u201c\u6591\u6591\uff0c\u8fd9\u662f\u6211\u73b0\u5728\u51fa\u79df\u623f\u7684\u8fd9\u6837\u7684\u4e00\u4e2a\u73af\u5883...\u611f\u89c9\u6211\u8fd9\u6839\u672c\u5c31\u4e0d\u9002\u5408\u5f55\u97f3\u5462\u3002\u201d (\u73af\u5883\u95ee\u9898\u76f4\u63a5\u5f15\u53d1\u201c\u4e0d\u9002\u5408\u201d\u7684\u5168\u9762\u5426\u5b9a)\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42 (\u5f52\u5c5e\u611f\u4e0e\u8fde\u63a5) \u4e0e \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 (\u80fd\u529b\u8ba4\u53ef)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u5ea6\u7684\u4e0d\u81ea\u4fe1\u4e0e\u5bf9\u201c\u4e13\u4e1a\u201d\u8ba4\u53ef\u7684\u6e34\u6c42**\u3002\u5979\u901a\u8fc7\u53cd\u590d\u786e\u8ba4\u7ec6\u8282\uff08\u73af\u5883\u3001\u8bbe\u5907\u3001\u53e3\u6c34\u97f3\uff09\u3001\u5bfb\u6c42\u73ed\u4e3b\u4efb\u80af\u5b9a\u3001\u5728\u7fa4\u5185\u79ef\u6781\u4e92\u52a8\uff08\u5938\u5956\u4ed6\u4eba\u3001\u62b1\u56e2\u53d6\u6696\uff09\uff0c\u6765\u5bfb\u6c42\u4e00\u79cd\u201c\u88ab\u63a5\u7eb3\u8fdb\u4e13\u4e1a\u5708\u5b50\u201d\u7684\u5f52\u5c5e\u611f\u548c\u201c\u6211\u80fd\u505a\u597d\u201d\u7684\u80fd\u529b\u8ba4\u53ef\u3002\u5979\u7684\u7126\u8651\u66f4\u591a\u6e90\u4e8e\u5bb3\u6015\u81ea\u5df1\u201c\u4e0d\u591f\u683c\u201d\uff0c\u800c\u975e\u201c\u8d5a\u4e0d\u5230\u94b1\u201d\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u3001\u5177\u4f53\u7684\u80af\u5b9a\u4e0e\u966a\u4f34**\u3002\u5979\u9700\u8981\u88ab\u53cd\u590d\u544a\u77e5\u201c\u4f60\u7684\u95ee\u9898\u5f88\u6b63\u5e38\u201d\u3001\u201c\u4f60\u7684\u8fdb\u6b65\u5f88\u660e\u663e\u201d\u3001\u201c\u4f60\u8fd9\u6837\u505a\u662f\u5bf9\u7684\u201d\uff0c\u6765\u5bf9\u6297\u5176\u5185\u5728\u7684\u81ea\u6211\u5426\u5b9a\u3002\u540c\u65f6\uff0c\u9700\u8981\u8425\u9020\u201c\u6211\u4eec\u5728\u4e00\u8d77\u5b66\u4e60\u201d\u7684\u793e\u7fa4\u966a\u4f34\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1** \u7c7b (\u9ad8\u610f\u613f\uff0c\u4f46\u8d44\u6e90\u6216\u5fc3\u7406\u5b58\u5728\u660e\u663e\u77ed\u677f\uff0c\u9700\u91cd\u70b9\u6276\u6301) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u6838\u5fc3\u7279\u5f81\uff1a\u9ad8\u654f\u611f\u3001\u4f4e\u81ea\u4fe1\u3001\u5f3a\u4f9d\u8d56\u3001\u6613\u56e0\u6280\u672f\u7ec6\u8282\u7834\u9632) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u6c42\u751f\u3001\u5bb6\u4eba\u6781\u7aef\u53cd\u5bf9\u7b49D\u7c7b\u7ea2\u7ebf\u4fe1\u53f7\u3002**\u4f46\u5bb6\u5ead\u652f\u6301\u5ea6\u672a\u77e5\u662f\u6f5c\u5728\u98ce\u9669**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u82e5\u540e\u7eed\u5bb6\u4eba\u53d1\u73b0\u5176\u6295\u5165\u65f6\u95f4\u91d1\u94b1\u5e76\u53cd\u5bf9\uff0c\u53ef\u80fd\u6210\u4e3a\u5bfc\u706b\u7d22\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u4e3b\u8981\u98ce\u9669**\u3002\u5de5\u4f5c\u7e41\u5fd9+\u65f6\u95f4\u788e\u7247\u5316\uff0c\u4e00\u65e6\u4f5c\u4e1a\u96be\u5ea6\u63d0\u5347\u6216\u751f\u6d3b\u7a81\u53d1\u72b6\u51b5\uff0c\u6781\u6613\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u7d2f\u79ef\u6027\u7126\u8651\u548c\u81ea\u8d23\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u4efb\u4f55\u4e00\u4e2a\u6280\u672f\u96be\u9898\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u5931\u8d25\u3001\u964d\u566a\u5904\u7406\u4e0d\u597d\u3001\u8bd5\u97f3\u591a\u6b21\u4e0d\u901a\u8fc7\uff09\u90fd\u53ef\u80fd\u6210\u4e3a\u5176\u201c\u6211\u679c\u7136\u4e0d\u884c\u201d\u7684\u8bc1\u660e\uff0c\u5bfc\u81f4\u77ac\u95f4\u5d29\u6e83\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4f4e** | \u5f53\u524d\u672a\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u77ed\u671f\u53d8\u73b0\u8bc9\u6c42\uff0c\u4f46\u82e5\u957f\u671f\u65e0\u6b63\u5411\u53cd\u9988\uff08\u5982\u8bd5\u97f3\u65e0\u679c\uff09\uff0c\u53ef\u80fd\u8f6c\u5316\u4e3a\u5bf9\u81ea\u8eab\u80fd\u529b\u7684\u5426\u5b9a\uff0c\u95f4\u63a5\u5f15\u53d1\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-3\u5468\uff0c\u9996\u6b21\u72ec\u7acb\u5b8c\u6210\u590d\u6742\u4f5c\u4e1a\uff08\u5982\u5b8c\u6574\u89d2\u8272\u97f3\u5f55\u5236+\u540e\u671f\uff09\u65f6**\u3002\u6b64\u65f6\u6280\u672f\u96be\u70b9\u96c6\u4e2d\u7206\u53d1\uff0c\u5176\u632b\u8d25\u611f\u5c06\u8fbe\u5230\u5cf0\u503c\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u9ed8\u9ed8\uff0c\u770b\u5230\u4f60\u4ea4\u7684\u4f5c\u4e1a\u548c\u63d0\u7684\u8fd9\u4e48\u591a\u7ec6\u8282\u95ee\u9898\uff0c\u6211\u7279\u522b\u611f\u52a8\u3002\u4f60\u77e5\u9053\u5417\uff1f\u80fd\u53d1\u73b0\u95ee\u9898\u662f\u6210\u4e3a\u9ad8\u624b\u7684**\u7b2c\u4e00\u6b65**\uff0c\u73ed\u91cc\u5f88\u591a\u540c\u5b66\u8fd8\u505c\u7559\u5728\u2018\u611f\u89c9\u4e0d\u5bf9\u4f46\u8bf4\u4e0d\u51fa\u6765\u2019\u7684\u9636\u6bb5\uff0c\u4f60\u5df2\u7ecf\u8fdc\u8fdc\u9886\u5148\u4e86\u3002\u54b1\u4eec\u4e0d\u8ffd\u6c42\u4e00\u6b65\u5b8c\u7f8e\uff0c\u5c31\u50cf\u5065\u8eab\uff0c\u627e\u5230\u53d1\u529b\u611f\u5c31\u662f\u80dc\u5229\uff01\u540e\u9762\u6709\u4efb\u4f55\u5361\u70b9\uff0c\u968f\u65f6@\u6211\uff0c\u6211\u4eec\u4e00\u4e2a\u4e2a\u62c6\u89e3\uff0c\u6211\u966a\u4f60\u641e\u5b9a\u5b83\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5174\u8da3\u6e38\u4e50\u7ebf\u3011**\u3002\u5f31\u5316\u63a5\u5355\u53d8\u73b0\u538b\u529b\uff0c\u5f3a\u5316\u201c\u73a9\u58f0\u97f3\u201d\u3001\u201c\u63a2\u7d22\u53ef\u80fd\u6027\u201d\u3001\u201c\u5728\u793e\u7fa4\u4e2d\u627e\u5230\u540c\u597d\u201d\u7684\u4f53\u9a8c\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u5f3a\u70c8\u8865\u5145\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u5305\u62ec\uff1a1\uff09\u6bcf\u65e5\u201c\u5fae\u5c0f\u8fdb\u6b65\u201d\u6253\u5361\u9f13\u52b1\uff1b2\uff09\u9488\u5bf9\u5176\u5177\u4f53\u95ee\u9898\uff08\u5982\u53e3\u6c34\u97f3\uff09\u7684\u201c\u50bb\u74dc\u5f0f\u201d\u5206\u6b65\u89e3\u51b3\u65b9\u6848\u56fe\u6587/\u89c6\u9891\uff1b3\uff09\u5c06\u5176\u6811\u7acb\u4e3a\u201c\u7ec6\u5fc3\u53d1\u73b0\u8005\u201d\u7684\u793e\u7fa4\u699c\u6837\uff08\u975e\u6280\u672f\u699c\u6837\uff09\uff0c\u6ee1\u8db3\u5176\u5c0a\u91cd\u9700\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9T6\u65bd\u538b\u6216\u8fdb\u884c\u6a2a\u5411\u6bd4\u8f83**\u3002\u5982\u201c\u4f60\u770bXX\u540c\u5b66\u5df2\u7ecf\u63a5\u5355\u4e86\u201d\u3002\n    2. **\u7edd\u4e0d\u7ed9T6\u5e03\u7f6e\u8d85\u51fa\u5176\u5f53\u524d\u80fd\u529b\u534a\u6b65\u4ee5\u4e0a\u7684\u786c\u6838\u4efb\u52a1**\u3002\u6240\u6709\u4efb\u52a1\u5fc5\u987b\u62c6\u89e3\u5230\u201c\u50bb\u74dc\u5f0f\u201d\u53ef\u6267\u884c\u3002\n    3. **\u7edd\u4e0d\u5728\u5176\u62b1\u6028\u65f6\u8bb2\u5927\u9053\u7406\u6216\u7ed9\u901a\u7528\u89e3\u51b3\u65b9\u6848**\u3002\u5fc5\u987b\u5148\u5171\u60c5\uff0c\u518d\u7ed9**\u6781\u5176\u5177\u4f53**\u7684\u4e0b\u4e00\u6b65\u64cd\u4f5c\u6307\u4ee4\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u5f53\u524d\u5fc3\u7406\u5f39\u6027\u672a\u5f97\u5230\u663e\u8457\u6539\u5584\u524d\uff0c\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u662f\u5728\u5176\u8106\u5f31\u7684\u81ea\u4fe1\u4e0a\u589e\u52a0\u8d1f\u62c5\uff0c\u6781\u6613\u5f15\u53d1\u5d29\u6e83\u9000\u8d39\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u611f\u89c9\u8bf4\u8bdd\uff0c\u8bf4\u8bdd\u6b63\u5e38\u8bf4\u8bdd\uff0c\u4ed6\u53cd\u800c\u597d\u50cf\u4e0d\u592a\u62ac\u5f97\u8d77\u6765\u3002\u201d **(\u521d\u671f\u7684\u81ea\u6211\u5426\u5b9a\u4e0e\u4e0d\u81ea\u4fe1)**\n2. > \u201c\u54ce\u5440\uff0c\u5fc3\u585e[\u76b1\u7709]\u201d **(\u5fae\u5c0f\u6280\u672f\u95ee\u9898\u5f15\u53d1\u7684\u76f4\u63a5\u60c5\u7eea\u4f4e\u843d)**\n3. > \u201c\u6591\u6591\uff0c\u8fd9\u662f\u6211\u73b0\u5728\u51fa\u79df\u623f\u7684\u8fd9\u6837\u7684\u4e00\u4e2a\u73af\u5883\uff0c\u6211\u672c\u6765\u89c9\u5f97\u597d\u50cf\u8fd8\u53ef\u4ee5\uff0c\u4f46\u662f\u4eca\u5929\u542c\u4e86\u4f60\u8fd9\u4e2a\u8bfe\uff0c\u611f\u89c9\u6211\u8fd9\u6839\u672c\u5c31\u4e0d\u9002\u5408\u5f55\u97f3\u5462\u3002\u201d **(\u5c06\u5916\u90e8\u73af\u5883\u95ee\u9898\u76f4\u63a5\u5f52\u56e0\u4e3a\u81ea\u8eab\u201c\u4e0d\u9002\u5408\u201d\uff0c\u5178\u578b\u7684\u707e\u96be\u5316\u601d\u7ef4\u548c\u4f4e\u5fc3\u7406\u5f39\u6027)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u793e\u7fa4\u5f52\u5c5e\u4e0e\u80fd\u529b\u8ba4\u53ef\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u81f4\u5177\u4f53\u5316\u7684\u80af\u5b9a\u4e0e\u966a\u4f34\uff0c\u5265\u79bb\u4e00\u5207\u589e\u52a0\u5176\u632b\u8d25\u611f\u7684\u4efb\u52a1\u548c\u6bd4\u8f83\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u793e\u4ea4\u4e0e\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf+\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\"}\n```";
