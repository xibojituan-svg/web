    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4ee5\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\u7684\u8eab\u4efd\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677158041 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u68a6\u5883\uff08\u674e\u5029\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u9ad8\u9636\u8bfe\uff08\u4ef7\u683c\uff1a7380\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad**\uff08\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad**\uff08\u672a\u900f\u9732\u804c\u4e1a\u3001\u4f5c\u606f\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad**\uff08\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** - \u7f3a\u5c11\u652f\u4ed8\u65b9\u5f0f\u3001\u804c\u4e1a\u80cc\u666f\u3001\u5bb6\u5ead\u652f\u6301\u5ea6\u3001\u5b66\u4e60\u65f6\u95f4\u7b49\u5173\u952e\u4fe1\u606f\uff0c\u5224\u65ad\u4e3b\u8981\u57fa\u4e8e\u6709\u9650\u7684\u5b66\u4e60\u884c\u4e3a\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06**\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u6210\u957f\u800c\u6765\uff0c\u5173\u6ce8\u6280\u80fd\u63d0\u5347\uff0c\u6709\u660e\u786e\u7684\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b\uff0c\u800c\u975e\u5355\u7eaf\u8ffd\u95ee\u201c\u51e0\u5929\u80fd\u8d5a\u94b1\u201d\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5bf9\u81ea\u5df1\u6709\u7528\u77e5\u8bc6\u548c\u6280\u5de7\uff0c\u6211\u8ba4\u53ef\u5176\u4ef7\u503c\u89c2\u201d\uff1b > \u201c\u6211\u8981\u6539\u53d8\u201d\uff1b > \u201c\u8fd8\u8bf7\u5e08\u59d0\u591a\u591a\u70b9\u8bc4\uff0c\u6307\u6559\u201d\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1**\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u652f\u4ed87380\u5143\u8bfe\u7a0b\uff0c\u4f46\u672a\u900f\u9732\u8d44\u91d1\u6765\u6e90\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u5bbd\u88d5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u6309\u65f6\u5b8c\u6210\u65e9\u529f\u3001\u542c\u8bfe\u3001\u63d0\u4ea4\u4f5c\u4e1a\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u65f6\u95f4\u5b89\u6392\uff0c\u63a8\u6d4b\u4e3a\u788e\u7247\u5316\u65f6\u95f4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07**\u4f4e\u6781\u5371**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u9047\u5230\u6280\u672f\u56f0\u96be\u65f6\uff0c\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u8ff7\u832b\u3001\u81ea\u6211\u6000\u7591\u548c\u4f9d\u8d56\u5916\u90e8\u6307\u5bfc\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u611f\u89c9\u4e0d\u592a\u7406\u60f3[\u6342\u8138]\u201d\uff1b > \u201c\u73b0\u5728\u8fd8\u662f\u4e00\u7247\u8ff7\u832b\uff0c\u4e0d\u61c2\u201d\uff1b > \u201c\u4e00\u76f4\u5728\u8bfb\u6587\u641e[\u6342\u8138]\u201d\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c** ] \u4e0e [ **\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e** ] \u5e76\u5b58\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u81ea\u8eab\u80fd\u529b\u7684\u4e0d\u81ea\u4fe1\u4e0e\u7126\u8651**\u3002\u4ed6\u6e34\u671b\u901a\u8fc7\u5b66\u4e60\u83b7\u5f97\u4e00\u9879\u80fd\u5e26\u6765\u5b89\u5168\u611f\u7684\u6280\u80fd\uff08\u7b2c\u4e8c\u5c42\uff09\uff0c\u540c\u65f6\u6781\u5ea6\u9700\u8981\u6765\u81ea\u201c\u5e08\u59d0\u201d\uff08\u6743\u5a01\uff09\u7684\u80af\u5b9a\u548c\u6307\u5bfc\uff0c\u4ee5\u83b7\u5f97\u5728\u793e\u7fa4\u4e2d\u7684\u8ba4\u53ef\u548c\u5f52\u5c5e\u611f\uff08\u7b2c\u56db\u5c42\uff09\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u9632\u62a4\u76fe\u5f0f\u201d\u7684\u80af\u5b9a\u4e0e\u201c\u6309\u952e\u7ea7\u201d\u7684\u7cbe\u51c6\u6307\u5bfc**\u3002\u5728\u4ed6\u81ea\u6211\u6000\u7591\u65f6\u7ed9\u4e88\u5938\u5f20\u7684\u8d5e\u7f8e\u548c\u201c\u4f60\u80fd\u884c\u201d\u7684\u4fe1\u5ff5\u652f\u6491\uff0c\u540c\u65f6\u63d0\u4f9b\u6781\u5176\u5177\u4f53\u3001\u624b\u628a\u624b\u7684\u64cd\u4f5c\u6307\u5bfc\uff0c\u5e2e\u4ed6\u8de8\u8d8a\u6bcf\u4e00\u4e2a\u5fae\u5c0f\u7684\u6280\u672f\u969c\u788d\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4f4e** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u672a\u53d1\u73b0\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u82e5\u540e\u7eed\u8bfe\u7a0b\u96be\u5ea6\u9661\u589e\uff0c\u6216\u4f5c\u4e1a\u8981\u6c42\u53d8\u9ad8\uff0c\u5176\u201c\u8ff7\u832b\u201d\u548c\u201c\u4e0d\u7406\u60f3\u201d\u7684\u60c5\u7eea\u53ef\u80fd\u7d2f\u79ef\uff0c\u5bfc\u81f4\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u4e00\u65e6\u9047\u5230\u6280\u672f\u96be\u9898\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u3001\u590d\u6742\u540e\u671f\uff09\uff0c\u6216\u8fde\u7eed\u51e0\u6b21\u8bd5\u97f3\u5931\u8d25\u3001\u4f5c\u4e1a\u672a\u83b7\u597d\u8bc4\uff0c\u6781\u6613\u89e6\u53d1\u201c\u6211\u592a\u7b28\u4e86\u201d\u7684\u81ea\u5351\u5d29\u6e83\uff0c\u8fdb\u800c\u4ea7\u751f\u9000\u8d39\u5ff5\u5934\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u5982\u679c\u5b66\u4e60\u4e00\u6bb5\u65f6\u95f4\u540e\uff08\u59821-2\u4e2a\u6708\uff09\u4ecd\u672a\u83b7\u5f97\u4efb\u4f55\u6b63\u53cd\u9988\uff08\u5982\u63a5\u5230\u7b2c\u4e00\u5355\u3001\u83b7\u5f97\u663e\u8457\u8fdb\u6b65\u8ba4\u53ef\uff09\uff0c\u53ef\u80fd\u4f1a\u8d28\u7591\u8bfe\u7a0b\u4ef7\u503c\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\uff0c\u5f53\u57fa\u7840\u70ed\u60c5\u8017\u5c3d\uff0c\u8fdb\u5165\u6280\u80fd\u63d0\u5347\u74f6\u9888\u671f\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5e08\u5f1f/\u5e08\u59b9\uff0c\u770b\u5230\u4f60\u4ea4\u4f5c\u4e1a\u8fd9\u4e48\u79ef\u6781\uff0c\u5e08\u59d0\u7279\u522b\u611f\u52a8\uff01\u54b1\u4eec\u8fd9\u4e2a\u9636\u6bb5\u6709\u8ff7\u832b\u3001\u89c9\u5f97\u2018\u4e0d\u7406\u60f3\u2019\u592a\u6b63\u5e38\u4e86\uff0c\u6211\u521a\u5f00\u59cb\u5b66\u7684\u65f6\u5019\u8fd8\u4e0d\u5982\u4f60\u5462\u3002\u522b\u6015\uff0c\u4ee5\u540e\u6bcf\u4e00\u4e2a\u5361\u70b9\uff0c\u4f60\u968f\u65f6\u627e\u6211\uff0c\u6211\u4e00\u6b65\u4e00\u6b65\u5e26\u4f60\u62c6\u89e3\u8fc7\u53bb\u3002\u54b1\u4eec\u4e0d\u8ddf\u522b\u4eba\u6bd4\uff0c\u5c31\u8ddf\u6628\u5929\u7684\u81ea\u5df1\u6bd4\uff0c\u4f60\u6bcf\u4e00\u70b9\u8fdb\u6b65\u6211\u90fd\u770b\u5728\u773c\u91cc\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011- \u56e0\u4e3a\u4ed6\u6709\u660e\u786e\u7684\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u5f3a\u70c8\u8865\u5145\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u9488\u5bf9T6\u60c5\u7eea\u5de8\u5a74\uff0c\u6838\u5fc3\u662f**A(\u50bb\u74dc\u7248) + C(\u6ee1\u914d\u5168\u5f00)**\u3002\u62ff\u8d70\u96be\u9898\uff0c\u4e88\u4ee5\u6781\u5938\u5f20\u7684\u8d5e\u7f8e\u3002\u5177\u4f53\u5305\u62ec\uff1a\n    1.  **\u6309\u952e\u7ea7\u6307\u5bfc**\uff1a\u6240\u6709\u64cd\u4f5c\u6307\u4ee4\u5fc5\u987b\u62c6\u89e3\u5230\u201c\u70b9\u51fb\u54ea\u91cc\u3001\u8f93\u5165\u4ec0\u4e48\u201d\u7684\u7a0b\u5ea6\uff0c\u675c\u7edd\u201c\u4f60\u81ea\u5df1\u7814\u7a76\u4e00\u4e0b\u201d\u3002\n    2.  **\u9ad8\u9891\u60c5\u7eea\u6309\u6469**\uff1a\u4f5c\u4e1a\u70b9\u8bc4\u5fc5\u987b\u4ee5\u201c\u5148\u5938\u540e\u5fae\u8c03\u201d\u4e3a\u94c1\u5f8b\uff0c\u4e14\u5938\u5956\u8981\u5177\u4f53\u3001\u5938\u5f20\uff08\u5982\u201c\u4f60\u8fd9\u4e2a\u6c14\u53e3\u5904\u7406\u5f97\u592a\u6709\u5929\u8d4b\u4e86\uff01\u201d\uff09\u3002\n    3.  **\u8fdb\u5ea6\u53ef\u89c6\u5316**\uff1a\u4e3a\u4ed6\u5efa\u7acb\u4e13\u5c5e\u7684\u201c\u8fdb\u6b65\u91cc\u7a0b\u7891\u201d\uff0c\u6bcf\u5b8c\u6210\u4e00\u4e2a\u5c0f\u4efb\u52a1\u5c31\u7ed9\u4e88\u660e\u786e\u5956\u52b1\uff08\u5982\u7535\u5b50\u52cb\u7ae0\u3001\u53e3\u5934\u5728\u7fa4\u5185\u8868\u626c\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5728\u4ed6\u8868\u8fbe\u201c\u8ff7\u832b\u201d\u3001\u201c\u4e0d\u7406\u60f3\u201d\u65f6\uff0c\u7528\u201c\u5927\u5bb6\u90fd\u8fd9\u6837\uff0c\u591a\u7ec3\u7ec3\u5c31\u597d\u201d\u6577\u884d\uff1b\u4e0d\u8981\u5728\u4ed6\u9762\u524d\u8fc7\u5ea6\u5938\u5956\u5176\u4ed6\u8fdb\u6b65\u795e\u901f\u7684\u5b66\u5458\uff0c\u4ee5\u514d\u52a0\u5267\u5176\u81ea\u5351\u611f\uff1b**\u7981\u6b62\u4ea4\u53c9\u63a8\u9500\u9ad8\u9636\u8bfe\u7a0b**\uff0c\u907f\u514d\u77e5\u8bc6\u8fc7\u8f7d\u5f15\u53d1\u6050\u614c\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u60c5\u7eea\u7a33\u5b9a\u3001\u6280\u672f\u6709\u660e\u663e\u8fdb\u6b65\u5e76\u83b7\u5f97\u5145\u5206\u81ea\u4fe1\u524d\uff0c\u7981\u6b62\u4efb\u4f55\u5f62\u5f0f\u7684\u5347\u5355\u6216\u4ea4\u53c9\u9500\u552e\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u611f\u89c9\u4e0d\u592a\u7406\u60f3[\u6342\u8138]\u201d - **\u5178\u578bT6\u60c5\u7eea\u4f4e\u843d\u4fe1\u53f7**\n2. > \u201c\u73b0\u5728\u8fd8\u662f\u4e00\u7247\u8ff7\u832b\uff0c\u4e0d\u61c2\u201d - **\u6280\u672f\u6027\u65e0\u52a9\u4e0e\u4f9d\u8d56\u6307\u5bfc\u7684\u660e\u786e\u8868\u8fbe**\n3. > \u201c\u4e00\u76f4\u5728\u8bfb\u6587\u641e[\u6342\u8138]\u201d - **\u52aa\u529b\u4f46\u4f34\u968f\u81ea\u6211\u8c03\u4f83\u5f0f\u5426\u5b9a\uff0c\u5fc3\u7406\u5f39\u6027\u4f4e**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5b89\u5168\u611f\u4e0e\u5916\u90e8\u8ba4\u53ef\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u201c\u50bb\u74dc\u7248\u201d\u64cd\u4f5c\u6307\u5357 + \u6ee1\u914d\u7684\u60c5\u7eea\u8d5e\u7f8e\u4e0e\u966a\u4f34\uff0c\u4e25\u9632\u5176\u5728\u6280\u80fd\u74f6\u9888\u671f\u5d29\u6e83\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168/\u5c0a\u91cd\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\"}\n```";
