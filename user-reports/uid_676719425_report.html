    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID: 676719425\uff08\u6e05\u5b81\uff09\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676719425 (\u6e05\u5b81) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-21 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u81fb\u7684\u9e4f\u5462(\u803f\u81fb) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8fdb\u9636\u8bfe + \u8fd0\u8425\u8bfe + \u97f3\u526a\u5de5\u5177 + MK4\u58f0\u5361 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u5168\u6b3e\u5145\u88d5**\uff08\u4e3b\u52a8\u8d2d\u4e70MK4\u58f0\u5361\u3001\u8fde\u62a5\u8fd0\u8425\u8bfe\uff0c\u65e0\u8d44\u91d1\u538b\u529b\u4fe1\u53f7\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u9ad8\u5bbd\u88d5**\uff08\u5df2\u4e0d\u4e0a\u73ed\uff0c\u6709\u56fa\u5b9a\u65f6\u95f4\u7ec3\u4e60\u666e\u62c9\u63d0/\u745c\u4f3d\uff0c\u5b66\u4e60\u65f6\u95f4\u81ea\u7531\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u5355\u8eab\u72ec\u7acb**\uff08\u804a\u5929\u4e2d\u4ec5\u63d0\u53ca\u201c\u5bf9\u8c61\u201d\uff0c\u65e0\u5bb6\u5ead\u5e72\u9884\u4fe1\u53f7\uff0c\u51b3\u7b56\u81ea\u4e3b\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u2b06\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u7cbe\u8fdb\u800c\u6765\uff0c\u4eab\u53d7\u5b66\u4e60\u8fc7\u7a0b\uff0c\u5bf9\u8d5b\u9053\u6709\u660e\u786e\u5174\u8da3\uff08\u53e4\u98ce\u8a00\u60c5\u3001\u513f\u7ae5\uff09\uff0c\u800c\u975e\u77ed\u671f\u53d8\u73b0\u9a71\u52a8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u73ed\u73ed\uff0c\u6211\u7684\u684c\u5b50\u524d\u52a0\u88c5\u7a97\u5e18\u4e86...\u53c8\u4e70\u4e86\u4e2a\u67e0\u6aac\u6d77\u76d0\u7684\u513f\u7ae5\u5e10\u7bf7\uff0c\u82b1\u4e8620\u591a\u3002\u201d (\u4e3b\u52a8\u4f18\u5316\u5f55\u97f3\u73af\u5883)\n  > \u201c\u5f88\u559c\u6b22\uff08\u53e4\u98ce\u8a00\u60c5\u8d5b\u9053\uff09\u3002\u201d (\u5174\u8da3\u9a71\u52a8)\n  > \u201c\u8fd0\u8425\u6211\u4e5f\u60f3\u62a5...\u90a3\u6211\u5c31\u8fde\u62a5\u5427\u3002\u201d (\u4e3b\u52a8\u5bfb\u6c42\u6280\u80fd\u62d3\u5c55\uff0c\u4e3a\u957f\u671f\u53d1\u5c55\u6295\u8d44)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b06\u9ad8**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u9ad8** \u2014 \u4e3b\u52a8\u8d2d\u4e70MK4\u4e13\u4e1a\u58f0\u5361\u3001\u8fde\u62a5\u8fd0\u8425\u8bfe\uff0c\u6d88\u8d39\u51b3\u7b56\u679c\u65ad\uff0c\u65e0\u8d44\u91d1\u538b\u529b\u4fe1\u53f7\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u9ad8** \u2014 \u5df2\u4e0d\u4e0a\u73ed\uff0c\u65f6\u95f4\u81ea\u7531\uff0c\u80fd\u6295\u5165\u65f6\u95f4\u7ec3\u4e60\u3001\u5f55\u97f3\u3001\u53c2\u4e0e\u8bfe\u7a0b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4e2d\u9ad8** \u2014 \u5bf9\u8c61\u5e2e\u52a9\u627e\u5230\u65e7\u8bbe\u5907\uff0c\u65e0\u53cd\u5bf9\u4fe1\u53f7\uff0c\u73af\u5883\u652f\u6301\u826f\u597d\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\uff0c\u79ef\u6781\u89e3\u51b3\u95ee\u9898\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u4e50\u4e8e\u63a5\u53d7\u53cd\u9988\u5e76\u6539\u8fdb\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u7684\u88c5\u5907\u592a\u4e0d\u4e13\u4e1a\u4e86\uff0c\u5c31\u4e0d\u5f80\u7fa4\u91cc\u53d1\u4e86\u54c8\u3002\u201d (\u6709\u81ea\u77e5\u4e4b\u660e\uff0c\u4f46\u65e0\u81ea\u5351\u60c5\u7eea)\n  > \u201c\u5df2\u770b\u56de\u653e\uff0c\u8c22\u8c22\u73ed\u73ed\u6307\u70b9[\u73ab\u7470]\u6211\u660e\u5929\u4e89\u53d6\u518d\u5f55\u4e00\u904d[\u52a0\u6cb9]\u201d (\u6b63\u9762\u63a5\u53d7\u4e13\u4e1a\u53cd\u9988\uff0c\u884c\u52a8\u529b\u5f3a)\n  > \u201c\u8c22\u8c22\u73ed\u73ed\u9f13\u52b1\uff0c\u6211\u8fd8\u5f97\u597d\u597d\u5b66\u7ec3\uff0c\u6211\u89c9\u5f97\u6211\u5927\u60c5\u7eea\u7c7b\u7684\u6211\u8868\u73b0\u4e0d\u51fa\u6765\uff0c\u6c14\u606f\u4e5f\u4e0d\u591f\u7528\u201d (\u80fd\u5ba2\u89c2\u5206\u6790\u81ea\u8eab\u4e0d\u8db3\uff0c\u5fc3\u6001\u79ef\u6781)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 & \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u4e13\u4e1a\u80fd\u529b\u7684\u8ffd\u6c42\u548c\u8ba4\u53ef\uff0c\u5e0c\u671b\u83b7\u5f97\u6280\u672f\u7cbe\u8fdb\u548c\u5708\u5c42\u5185\u7684\u4e13\u4e1a\u8eab\u4efd\u8ba4\u540c\u3002\u5979\u5e76\u975e\u4e3a\u751f\u5b58\u7126\u8651\u800c\u6765\uff0c\u800c\u662f\u4e3a\u4e86\u201c\u53d8\u5f97\u66f4\u597d\u201d\uff0c\u83b7\u5f97\u5c0a\u91cd\u548c\u5b9e\u73b0\u4e2a\u4eba\u4ef7\u503c\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u8d4b\u80fd**\uff0c\u4ee5\u53ca\u5c06\u5979\u89c6\u4e3a\u201c\u6f5c\u529b\u80a1\u201d\u7684\u91cd\u89c6\u611f\u3002\u63d0\u4f9b\u6e05\u6670\u7684\u6210\u957f\u8def\u5f84\u548c\u8d44\u6e90\u652f\u6301\uff0c\u8ba9\u5979\u611f\u53d7\u5230\u88ab\u4e13\u4e1a\u4f53\u7cfb\u63a5\u7eb3\u548c\u57f9\u517b\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe2 A\u7c7b** (\u9ad8\u4ef7\u503c\u9886\u8896\u578b/\u6838\u5fc3\u7a33\u5b9a\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u8fdb\u5316\u524d\u4f53) \u2192 **\u6df7\u5408\u4f533\u53f7\uff1a\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b** |\n\n**\u5224\u5b9a\u6811\u63a8\u6f14**\uff1a\n1.  **\u4e09\u8f74\u8bc4\u5206**\uff1a\u52a8\u673a\u7eaf\u5ea6(7-8\u5206)\u3001\u8d44\u6e90\u5e95\u5ea7(8-9\u5206)\u3001\u5fc3\u7406\u5f39\u6027(7-8\u5206)\u3002\u52a8\u673a\u9ad8\u3001\u8d44\u6e90\u9ad8\u3001\u5f39\u6027\u9ad8\u3002\n2.  **\u5224\u5b9a\u6811\u8def\u5f84**\uff1a\n    *   \u52a8\u673a\u22655\u5206\uff0c\u8fdb\u5165\u7b2c\u4e09\u5c42\uff08\u4e2d\u9ad8\u52a8\u673a\u7cbe\u5206\uff09\u3002\n    *   \u5fc3\u7406\u5f39\u6027\u22657\u5206\uff0c\u8fdb\u5165\u5206\u652fA\uff08\u9ad8\u5f39\u6027\u901a\u9053\uff09\u3002\n    *   \u7528\u6237\u8868\u73b0\u51fa**\u4e3b\u52a8\u7edf\u7b79\u884c\u4e3a**\uff08\u201c\u8fd9\u5468\u51483\u73ed\uff0c\u4e0b\u5468\u51484\u73ed\u201d\u3001\u201c\u8fd8\u67093\u4e2a\u5230\u54b1\u73ed\u201d\u3001\u201c\u6d77\u76d0\u5230\u4f60\u4e86\u201d\uff09\uff0c\u5e76\u5728\u7fa4\u5185\u79ef\u6781\u4e92\u52a8\u3001\u9f13\u52b1\u4ed6\u4eba\uff08\u201c\u5bf9\u554a\uff01\u90fd\u597d\u68d2\u201d\uff09\u3002\n    *   \u7edf\u7b79\u65b9\u5411\u504f\u5411\u4e8e**\u6392\u73ed\u3001\u8fdb\u5ea6\u63d0\u9192\u3001\u56e2\u961f\u534f\u4f5c**\uff0c\u7b26\u5408 **T1-A \u5bfc\u6f14\u578b\u9886\u8896** \u7684\u521d\u671f\u7279\u5f81\u3002\n    *   \u4f46\u540c\u65f6\uff0c\u7528\u6237\u4e5f\u8868\u73b0\u51fa **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** \u7684\u7279\u8d28\uff1a\u8ba4\u771f\u5b8c\u6210\u4f5c\u4e1a\u3001\u4e3b\u52a8\u8bf7\u6559\u6280\u672f\u95ee\u9898\uff08Au\u7248\u672c\u3001\u58f0\u5361\u8bbe\u7f6e\uff09\u3001\u79ef\u6781\u4f18\u5316\u8bbe\u5907\u3002\n    *   \u7efc\u5408\u5224\u65ad\uff0c\u7528\u6237\u6b63\u5904\u4e8e\u4ece **T2\uff08\u82e6\u884c\u5e95\u76d8\uff09** \u5411 **T1-A\uff08\u7edf\u5e05\u57fa\u56e0\uff09** \u8fdb\u5316\u7684\u5173\u952e\u8282\u70b9\uff0c\u5373 **\u6df7\u5408\u4f533\u53f7\uff1a\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b**\u3002\u5979\u5df2\u5177\u5907\u624e\u5b9e\u7684\u6280\u80fd\u57fa\u7840\u548c\u7a33\u5b9a\u7684\u5b66\u4e60\u5fc3\u6001\uff0c\u5e76\u5f00\u59cb\u5c55\u9732\u7ec4\u7ec7\u3001\u534f\u8c03\u7684\u610f\u613f\u548c\u80fd\u529b\u3002\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u8a00\u8bba\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4f4e** | \u5bb6\u5ead\u652f\u6301\u5ea6\u9ad8\uff0c\u51b3\u7b56\u72ec\u7acb\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u6781\u4f4e** | \u65f6\u95f4\u5145\u88d5\uff0c\u5b66\u4e60\u610f\u613f\u5f3a\uff0c\u81ea\u5f8b\u6027\u597d\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u7406\u6027\u9762\u5bf9\u4e0d\u8db3\u5e76\u79ef\u6781\u6539\u8fdb\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u82e5\u5728\u6295\u5165\u5927\u91cf\u65f6\u95f4\u3001\u91d1\u94b1\uff08\u8bbe\u5907\u3001\u8bfe\u7a0b\uff09\u540e\uff0c\u957f\u65f6\u95f4\u65e0\u6cd5\u83b7\u5f97\u9884\u671f\u7684\u6280\u80fd\u63d0\u5347\u6216\u63a5\u5355\u673a\u4f1a\uff0c\u53ef\u80fd\u4ea7\u751f\u4ef7\u503c\u6000\u7591\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe3-6\u4e2a\u6708\u540e**\u3002\u82e5\u6b64\u65f6\u6280\u80fd\u8fdb\u5165\u5e73\u53f0\u671f\uff0c\u4e14\u63a5\u5355/\u53d8\u73b0\u8def\u5f84\u4e0d\u6e05\u6670\uff0c\u53ef\u80fd\u56e0\u201c\u6295\u5165\u4ea7\u51fa\u6bd4\u201d\u7126\u8651\u800c\u52a8\u6447\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6e05\u5b81\uff0c\u770b\u5230\u4f60\u5728\u7fa4\u91cc\u4e0d\u4ec5\u81ea\u5df1\u5b66\u5f97\u597d\uff0c\u8fd8\u4e3b\u52a8\u5e2e\u5927\u5bb6\u534f\u8c03\u8fdb\u5ea6\uff0c\u771f\u7684\u5f88\u6709\u5fc3\u3002\u54b1\u4eec\u73ed\u5c31\u9700\u8981\u4f60\u8fd9\u6837\u65e2\u6709\u5b9e\u529b\u53c8\u6709\u8d23\u4efb\u611f\u7684\u540c\u5b66\u3002\u540e\u7eed\u73ed\u7ea7\u91cc\u7684\u4e00\u4e9b\u534f\u8c03\u548c\u7ec4\u7ec7\u5de5\u4f5c\uff0c\u53ef\u80fd\u8981\u591a\u62dc\u6258\u4f60\u5e2e\u5fd9\u4e86\uff0c\u6211\u4eec\u4e00\u8d77\u628a\u5b66\u4e60\u6c1b\u56f4\u641e\u8d77\u6765\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** + **\u3010\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\u3011**\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n    1.  **\u3010D\u6a21\u5757\uff1a\u8eab\u4efd\u4e0e\u6743\u529b\u5149\u73af\u6c60\u3011**\uff1a\u8fc5\u901f\u6267\u884c **\u201c\u9ec4\u888d\u52a0\u8eab\u63d0\u5e72\u6cd5\u201d**\u3002\u4efb\u547d\u5176\u4e3a\u5c0f\u7ec4\u957f\u3001\u4f5c\u4e1a\u7edf\u8ba1\u5b98\u6216\u6d3b\u52a8\u534f\u8c03\u4eba\uff0c\u8d4b\u4e88\u5176\u5b98\u65b9\u8ba4\u53ef\u7684\u201c\u4ee3\u7406\u5175\u56e2\u53f8\u4ee4\u201d\u8eab\u4efd\u3002\n    2.  **\u3010B\u6a21\u5757\uff1a\u786c\u6838\u624b\u827a\u6c60\u3011**\uff1a\u63d0\u4f9b\u4e13\u5bb61v1\u6df1\u5ea6\u70b9\u8bc4\uff0c\u6d3e\u53d1\u6709\u6311\u6218\u6027\u7684\u8bd5\u97f3\u6216\u5b9e\u6218\u4efb\u52a1\uff0c\u6ee1\u8db3\u5176\u6280\u672f\u7cbe\u8fdb\u9700\u6c42\u3002\n    3.  **\u3010A\u6a21\u5757\uff1a\u57fa\u7840\u4fdd\u969c\u6c60\u3011**\uff1a\u6807\u51c6\u8bfe\u7a0b\u5185\u5bb9\u7167\u5e38\u63d0\u4f9b\uff0c\u4f5c\u4e3a\u5176\u77e5\u8bc6\u4f53\u7cfb\u7684\u57fa\u77f3\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7ee7\u7eed\u7528\u5bf9\u5f85\u666e\u901a\u5b66\u5458\u7684\u201c\u5e08\u751f\u201d\u53e3\u543b\u8fdb\u884c\u7ba1\u7406\u3002\u7981\u6b62\u5ffd\u89c6\u6216\u5426\u5b9a\u5176\u4e3b\u52a8\u8d21\u732e\u7684\u7ec4\u7ec7\u884c\u4e3a\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5176\u5b66\u4e60\u8def\u5f84\u6e05\u6670\uff08\u5df2\u8fde\u62a5\u8fd0\u8425\u8bfe\uff09\uff0c\u5bf9\u9ad8\u9636\u6280\u672f\u3001\u79c1\u6559\u8bfe\u3001\u66f4\u4e13\u4e1a\u8bbe\u5907\u6709\u6f5c\u5728\u9700\u6c42\u3002\u63a8\u4ecb\u65f6\u5e94\u4ee5\u201c\u8d4b\u80fd\u201d\u548c\u201c\u6548\u7387\u63d0\u5347\u201d\u4e3a\u5207\u5165\u70b9\uff0c\u800c\u975e\u5355\u7eaf\u9500\u552e\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1.  > \u201c\u8fd9\u5468\u51483\u73ed\uff0c\u4e0b\u5468\u51484\u73ed\u201d\u3001\u201c\u8fd8\u67093\u4e2a\u5230\u54b1\u73ed\u201d\u3001\u201c\u6d77\u76d0\u5230\u4f60\u4e86\u201d **(\u4e3b\u52a8\u7edf\u7b79\u3001\u534f\u8c03\u7684\u9886\u8896\u6f5c\u8d28)**\n2.  > \u201c\u73ed\u73ed\uff0c\u6211\u7684\u684c\u5b50\u524d\u52a0\u88c5\u7a97\u5e18\u4e86\u201d\u3001\u201c\u6211\u4e70\u4e86\u4e2a\u5438\u97f3\u7684...\u53c8\u4e70\u4e86\u4e2a\u67e0\u6aac\u6d77\u76d0\u7684\u513f\u7ae5\u5e10\u7bf7\u201d **(\u4e3b\u52a8\u4f18\u5316\u73af\u5883\uff0c\u8ffd\u6c42\u4e13\u4e1a\uff0c\u8d44\u6e90\u6295\u5165\u5ea6\u9ad8)**\n3.  > \u201c\u5df2\u770b\u56de\u653e\uff0c\u8c22\u8c22\u73ed\u73ed\u6307\u70b9[\u73ab\u7470]\u6211\u660e\u5929\u4e89\u53d6\u518d\u5f55\u4e00\u904d[\u52a0\u6cb9]\u201d **(\u9ad8\u5fc3\u7406\u5f39\u6027\uff0c\u6b63\u9762\u63a5\u53d7\u53cd\u9988\uff0c\u884c\u52a8\u529b\u5f3a)**\n4.  > \u201c\u8fd0\u8425\u6211\u4e5f\u60f3\u62a5\uff0c\u6709\u51e0\u4e2a\u73ed\uff1f\u201d\u3001\u201c\u90a3\u6211\u5c31\u8fde\u62a5\u5427\u201d **(\u5b66\u4e60\u9a71\u52a8\u529b\u5f3a\uff0c\u4e3a\u957f\u671f\u53d1\u5c55\u6295\u8d44\uff0c\u975e\u77ed\u671f\u53d8\u73b0\u601d\u7ef4)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010\u6df7\u5408\u4f533\u53f7\uff1a\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7acb\u5373\u8d4b\u4e88\u5176\u7ec4\u7ec7\u8eab\u4efd\u4e0e\u6743\u529b\uff08D\u6a21\u5757\uff09\uff0c\u5c06\u5176\u4ece\u201c\u5b66\u4e60\u8005\u201d\u8f6c\u5316\u4e3a\u201c\u5171\u5efa\u8005\u201d\uff09\u3011**\u3002\n\n```json\n{\"core_type\": \"\u6df7\u5408\u4f533\u53f7\uff1a\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b (T2\u5411T1-A\u8fdb\u5316)\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u5708\u5c42\u5408\u4f19\u4eba\u7ebf\"}\n```";
