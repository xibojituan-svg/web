    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677154853 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6696\u6696\uff08\u5b59\u4f1f\uff09\u3001\u82b8\u71994\uff08\u5b59\u4f1f\uff09\u3001\u6d1b\u5947\u6eaa\u5802\uff08\u5f20\u723d\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u57f9\u8bad\u9ad8\u9636\u73ed\uff08\u5177\u4f53\u4ef7\u683c\u672a\u660e\u793a\uff0c\u4f46\u63d0\u53ca\u201c\u51e0k\u201d\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3**\uff08\u7528\u6237\u81ea\u8ff0\u201c\u5de5\u8d44\u672c\u8eab\u4e0d\u9ad8\u800c\u4e14\u8fd8\u8981\u8865\u8d34\u4e00\u4e0b\u5bb6\u91cc\u8fd8\u6709\u4e00\u4e2a\u8f66\u8f66\u9700\u8981\u517b\uff0c\u8c46\u5305\u95ee\u4e86\u4e00\u4e0b\u9700\u8981\u51e0k\u53ef\u80fd\u786e\u5b9e\u662f\u5bf9\u6211\u6765\u8bf4\u77ed\u65f6\u95f4\u5185\u8fbe\u4e0d\u5230\u7684\u201d\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u7528\u6237\u591a\u6b21\u8868\u793a\u201c\u6211\u5728\u4e0a\u73ed\u6ca1\u529e\u6cd5\u770b\u76f4\u64ad\u201d\uff0c\u9700\u8c03\u4f11\u624d\u80fd\u770b\u76f4\u64ad\uff0c\u8868\u660e\u5de5\u4f5c\u65e5\u767d\u5929\u65e0\u6574\u5757\u65f6\u95f4\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\uff08\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\uff0c\u9700\u8b66\u60d5\u9690\u7792\u98ce\u9669\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u7528\u6237\u8868\u8fbe\u6e05\u6670\uff0c\u4e92\u52a8\u79ef\u6781\uff0c\u4fe1\u606f\u5145\u5206\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b07\u4f4e\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u7eaf\u4e3a\u51e0\u5929\u5185\u63d0\u73b0\u4fdd\u5e95\u800c\u6765(\u4f4e\u6781\u5371)**\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u7ecf\u6d4e\u538b\u529b\uff0c\u5bf9\u201c\u4e0d\u62a5\u8bfe\u80fd\u5426\u8d5a\u94b1\u201d\u6781\u5ea6\u7126\u8651\uff0c\u53d8\u73b0\u9884\u671f\u6025\u8feb\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u90a3\u6211\u6ca1\u62a5\u540e\u9762\u7684\u8bfe\u7a0b\u6211\u662f\u4e0d\u662f\u5c31\u6ca1\u529e\u6cd5\u9760\u6709\u58f0\u8fd9\u4e2a\u884c\u4e1a\u8d5a\u94b1\u5566\u201d\n> \u201c\u5de5\u8d44\u672c\u8eab\u4e0d\u9ad8\u800c\u4e14\u8fd8\u8981\u8865\u8d34\u4e00\u4e0b\u5bb6\u91cc\u8fd8\u6709\u4e00\u4e2a\u8f66\u8f66\u9700\u8981\u517b\uff0c\u8c46\u5305\u95ee\u4e86\u4e00\u4e0b\u9700\u8981\u51e0k\u53ef\u80fd\u786e\u5b9e\u662f\u5bf9\u6211\u6765\u8bf4\u77ed\u65f6\u95f4\u5185\u8fbe\u4e0d\u5230\u7684\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u7528\u6237\u660e\u786e\u8868\u793a\u5de5\u8d44\u4e0d\u9ad8\u3001\u9700\u8865\u8d34\u5bb6\u7528\u3001\u517b\u8f66\uff0c\u4e14\u201c\u51e0k\u201d\u5b66\u8d39\u77ed\u671f\u5185\u65e0\u6cd5\u627f\u62c5\uff0c\u5b58\u5728**\u501f\u6b3e\u62a5\u540d**\u7684\u6781\u9ad8\u98ce\u9669\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e** \u2014 \u7528\u6237\u591a\u6b21\u5f3a\u8c03\u201c\u6211\u5728\u4e0a\u73ed\u6ca1\u529e\u6cd5\u770b\u76f4\u64ad\u201d\uff0c\u9700\u8981\u201c\u8c03\u4f11\u201d\u624d\u80fd\u53c2\u4e0e\u5173\u952e\u76f4\u64ad\u3002\u8868\u660e\u5de5\u4f5c\u5236\u4e25\u91cd\u6324\u538b\u5b66\u4e60\u65f6\u95f4\uff0c**\u771f\u5b9e\u53ef\u7528\u65f6\u95f4\u4e25\u91cd\u4e0d\u8db3**\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\uff0c\u4f46\u7ed3\u5408\u5176\u7ecf\u6d4e\u538b\u529b\uff0c**\u5bb6\u4eba\u4e0d\u77e5\u60c5\u6216\u53cd\u5bf9\u7684\u98ce\u9669\u6781\u9ad8**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u9762\u5bf9\u65e0\u6cd5\u770b\u76f4\u64ad\u3001\u627e\u4e0d\u5230\u4f5c\u4e1a\u5165\u53e3\u7b49\u5fae\u5c0f\u969c\u788d\uff0c\u53cd\u590d\u4f7f\u7528\u201c[\u60ca\u6050]\u201d\u3001\u201c[\u6d41\u6cea]\u201d\u7b49\u8868\u60c5\uff0c\u8868\u73b0\u51fa**\u9ad8\u5ea6\u7126\u8651\u3001\u6781\u5ea6\u4f9d\u8d56\u5916\u90e8\u6307\u5bfc\u3001\u6297\u538b\u80fd\u529b\u6781\u5f31**\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u6211\u6ca1\u770b\u5230\u54ea\u91cc\u53ef\u4ee5\u53d1\u90a3\u4e2a\u89d2\u8272\u6f14\u7ece\u7684\u97f3\u9891[\u60ca\u6050]\u201d\n> \u201c\u660e\u5929\u4e2d\u5348\u6211\u4e0d\u80fd\u770b\u76f4\u64ad\u600e\u4e48\u529e[\u6d41\u6cea]\u201d\n> \u201c\u662f\u6211\u6628\u5929\u53d1\u8fc7\u7684\u90a3\u4e00\u6bb5\u5417\u201d\u3001\u201c\u662f\u8fd9\u4e2a\u5417\u201d\uff08\u5bf9\u7b80\u5355\u4efb\u52a1\u53cd\u590d\u786e\u8ba4\uff0c\u7f3a\u4e4f\u72ec\u7acb\u63a2\u7d22\u80fd\u529b\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u7ecf\u6d4e\u5b89\u5168\u611f\u4e25\u91cd\u7f3a\u5931**\u3002\u7528\u6237\u9762\u4e34\u201c\u5de5\u8d44\u4e0d\u9ad8+\u8865\u8d34\u5bb6\u7528+\u517b\u8f66\u201d\u7684\u591a\u91cd\u7ecf\u6d4e\u538b\u529b\uff0c\u5e0c\u671b\u901a\u8fc7\u526f\u4e1a\u5feb\u901f\u83b7\u5f97\u6536\u5165\u4fdd\u969c\uff0c\u4ee5\u7f13\u89e3\u751f\u5b58\u7126\u8651\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u9632\u62a4\u76fe\u5f0f\u7684\u9000\u8d39\u901a\u9053\u4e0e\u6781\u4f4e\u7684\u53d8\u73b0\u9884\u671f\u7ba1\u7406**\u3002\u7edd\u4e0d\u80fd\u523a\u6fc0\u5176\u201c\u5feb\u901f\u8d5a\u94b1\u201d\u7684\u5e7b\u60f3\uff0c\u800c\u5e94\u5f3a\u8c03\u6280\u80fd\u5b66\u4e60\u7684\u957f\u671f\u6027\uff0c\u5e76\u4e3a\u5176\u53ef\u80fd\u7684\u5931\u8d25\u63d0\u4f9b\u65e0\u538b\u529b\u7684\u9000\u51fa\u8def\u5f84\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udd34 D\u7c7b\uff08\u9ad8\u5371\u7194\u65ad\u578b\uff09** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **\u9000\u8d39\u578b\uff08\u4ea7\u54c1\u9519\u914d\u578b\uff09** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a**\ud83d\udd34\u5df2\u89e6\u53d1 D \u7c7b\u7194\u65ad\u7ea2\u7ebf\uff01**\n- **\u89e6\u53d1\u56e0\u7531**\uff1a**\u7ecf\u6d4e\u7ea2\u7ebf**\u3002\u7528\u6237\u660e\u786e\u8868\u8ff0\u7ecf\u6d4e\u56f0\u96be\uff08\u5de5\u8d44\u4f4e\u3001\u9700\u8865\u8d34\u5bb6\u7528\u3001\u517b\u8f66\uff09\uff0c\u4e14\u5b66\u8d39\u201c\u51e0k\u201d\u77ed\u671f\u5185\u65e0\u6cd5\u627f\u62c5\uff0c\u5b58\u5728\u6781\u9ad8\u6982\u7387\u7684**\u501f\u8d37\u652f\u4ed8**\u98ce\u9669\u3002\u7b26\u5408\u201c\u660e\u786e\u8868\u8ff0\u8d1f\u503a\u4e14\u5df2\u5b58\u5728\u507f\u8fd8\u56f0\u96be\u201d\u7684\u7194\u65ad\u6761\u4ef6\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u9ad8** | \u5b66\u8d39\u6765\u6e90\u4e0d\u660e\u6216\u4e3a\u501f\u6b3e\uff0c\u4e00\u65e6\u88ab\u5bb6\u4eba\u53d1\u73b0\u6216\u81ea\u8eab\u7ecf\u6d4e\u538b\u529b\u52a0\u5267\uff0c\u5fc5\u7136\u5f15\u53d1\u5f3a\u70c8\u9000\u8d39\u8bc9\u6c42\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u6781\u9ad8** | \u5de5\u4f5c\u5236\u5bfc\u81f4\u65e0\u6cd5\u6309\u65f6\u53c2\u4e0e\u76f4\u64ad\u548c\u5b8c\u6210\u4f5c\u4e1a\uff0c\u5b66\u4e60\u8fdb\u5ea6\u4e25\u91cd\u6ede\u540e\uff0c\u4ea7\u751f\u201c\u5b66\u4e0d\u4f1a/\u6ca1\u65f6\u95f4\u5b66\u201d\u7684\u632b\u8d25\u611f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | \u9762\u5bf9\u8f6f\u4ef6\u64cd\u4f5c\u3001\u4f5c\u4e1a\u63d0\u4ea4\u7b49\u4efb\u4f55\u5fae\u5c0f\u6280\u672f\u969c\u788d\uff0c\u6781\u6613\u60c5\u7eea\u5d29\u6e83\uff0c\u5f52\u548e\u4e8e\u8bfe\u7a0b\u6216\u5e73\u53f0\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u6781\u9ad8** | \u62b1\u7740\u201c\u62a5\u8bfe=\u7acb\u523b\u8d5a\u94b1\u201d\u7684\u5e7b\u60f3\u62a5\u540d\uff0c\u4e00\u65e6\u53d1\u73b0\u5b66\u4e60\u5468\u671f\u957f\u3001\u53d8\u73b0\u6162\uff0c\u4f1a\u7acb\u523b\u611f\u5230\u88ab\u6b3a\u9a97\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c\u4e00\u5468**\u3002\u5f53\u7528\u6237\u53d1\u73b0\u9700\u8981\u6295\u5165\u5927\u91cf\u65f6\u95f4\u7cbe\u529b\uff0c\u4e14\u65e0\u6cd5\u7acb\u523b\u63a5\u5355\u53d8\u73b0\u65f6\uff0c\u9000\u8d39\u60c5\u7eea\u5c06\u96c6\u4e2d\u7206\u53d1\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u540c\u5b66\u4f60\u597d\uff0c\u770b\u5230\u4f60\u4e3a\u4e86\u5b66\u4e60\u7279\u610f\u8c03\u4f11\uff0c\u8fd9\u4efd\u8ba4\u771f\u7279\u522b\u6253\u52a8\u6211\u3002\u54b1\u4eec\u8fd9\u4e2a\u884c\u4e1a\u5c31\u50cf\u5b66\u5f00\u8f66\uff0c\u5f97\u5148\u7a33\u7a33\u5730\u628a\u6280\u672f\u7ec3\u597d\uff0c\u624d\u80fd\u5b89\u5168\u4e0a\u8def\u3002\u524d\u671f\u54b1\u4eec\u4e0d\u6025\u7740\u63a5\u5355\uff0c\u5148\u628a\u57fa\u7840\u6253\u7262\uff0c\u6bcf\u4e00\u6b65\u90fd\u8d70\u8e0f\u5b9e\u3002\u8fc7\u7a0b\u4e2d\u6709\u4efb\u4f55\u5361\u4f4f\u7684\u5730\u65b9\uff0c\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u89e3\u51b3\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u575a\u51b3\u529d\u9000\u7ebf\u3011**\u3002\u6b64\u7528\u6237\u4e3a\u5178\u578bD\u7c7b\uff0c**\u4e25\u7981**\u63a8\u8350\u4efb\u4f55\u4ed8\u8d39\u8bfe\u7a0b\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u82e5\u7528\u6237\u575a\u6301\uff0c\u53ef\u5f15\u5bfc\u81f3**\u3010\u514d\u8d39\u4f53\u9a8c/\u6781\u4f4e\u4ef7\u5165\u95e8\u5305\u3011**\uff0c\u5e76\u5fc5\u987b\u540c\u6b65\u5efa\u7acb**\u30107\u5929\u65e0\u7406\u7531\u7eff\u8272\u9000\u8d39\u901a\u9053\u3011**\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a**\u7edd\u4e0d\u5bf9\u5176\u505a\u51fa\u4efb\u4f55\u53d8\u73b0\u627f\u8bfa\u6216\u6536\u76ca\u6697\u793a**\uff1b**\u7edd\u4e0d\u5141\u8bb8\u5347\u5355\u6216\u5927\u989d\u63a8\u4ecb**\uff1b**\u7edd\u4e0d\u7528\u201c\u5b9d\u5988\u9006\u88ad\u201d\u3001\u201c\u5feb\u901f\u8d5a\u94b1\u201d\u7b49\u8bdd\u672f\u523a\u6fc0**\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u82e5\u5df2\u6210\u4ea4\uff0c**\u5fc5\u987b\u542f\u52a8\u529d\u9000\u548c\u9000\u8d39\u6d41\u7a0b**\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5de5\u8d44\u672c\u8eab\u4e0d\u9ad8\u800c\u4e14\u8fd8\u8981\u8865\u8d34\u4e00\u4e0b\u5bb6\u91cc\u8fd8\u6709\u4e00\u4e2a\u8f66\u8f66\u9700\u8981\u517b\uff0c\u8c46\u5305\u95ee\u4e86\u4e00\u4e0b\u9700\u8981\u51e0k\u53ef\u80fd\u786e\u5b9e\u662f\u5bf9\u6211\u6765\u8bf4\u77ed\u65f6\u95f4\u5185\u8fbe\u4e0d\u5230\u7684\u201d\n2. > \u201c\u6211\u5728\u4e0a\u73ed\u6ca1\u529e\u6cd5\u770b\u76f4\u64ad[\u6487\u5634]\u201d\n3. > \u201c\u6211\u6ca1\u770b\u5230\u54ea\u91cc\u53ef\u4ee5\u53d1\u90a3\u4e2a\u89d2\u8272\u6f14\u7ece\u7684\u97f3\u9891[\u60ca\u6050]\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u9000\u8d39\u578b\uff08\u4ea7\u54c1\u9519\u914d\u578b\uff09**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\uff08\u7ecf\u6d4e\u4fdd\u969c\uff09**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u7acb\u5373\u542f\u52a8\u529d\u9000\u4e0e\u7eff\u8272\u9000\u8d39\u901a\u9053\uff0c\u575a\u51b3\u4e0d\u6536\u5355**\u3002\n\n```json\n{\"core_type\": \"\u9000\u8d39\u578b\uff08\u4ea7\u54c1\u9519\u914d\u578b\uff09\", \"maslow_need\": \"\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"target_product_line\": \"\u575a\u51b3\u529d\u9000\u7ebf\"}\n```";
