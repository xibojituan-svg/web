        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676934501 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-03 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u552e\u540e-\u795d\u6625 / \u76f8\u4f34\u4e0e\u58f0(\u96f7\u743c\u743c) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | se2200\u5957\u88c5 (\u8bbe\u5907+\u8d60\u8bfe) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad** |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad** |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad** |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** - \u804a\u5929\u8bb0\u5f55\u4ec5\u4e3a\u8bbe\u5907\u552e\u540e\u4e0e\u5c0f\u7ec4\u534f\u4f5c\u7247\u6bb5\uff0c\u7f3a\u5931\u5173\u952e\u652f\u4ed8\u3001\u5bb6\u5ead\u3001\u804c\u4e1a\u3001\u65f6\u95f4\u3001\u5b66\u4e60\u52a8\u673a\u7b49\u6838\u5fc3\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34(\u4e2d)\u3002\u804a\u5929\u4e2d\u672a\u89c1\u660e\u786e\u7684\u201c\u5feb\u901f\u53d8\u73b0\u201d\u8bc9\u6c42\uff0c\u66f4\u591a\u8868\u73b0\u4e3a\u5bf9\u6709\u58f0\u6f14\u64ad\u6280\u672f\u7ec6\u8282\u7684\u94bb\u7814\u3001\u56e2\u961f\u534f\u4f5c\u7684\u70ed\u60c5\u548c\u5bf9\u4f5c\u54c1\u8d28\u91cf\u7684\u8ffd\u6c42\uff0c\u5e26\u6709\u5174\u8da3\u9a71\u52a8\u548c\u6280\u80fd\u63d0\u5347\u8272\u5f69\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u54b1\u4eec\u628a\u8fd9\u6b21\u7684\u6709\u58f0\u4e4b\u591c\u6587\u672c\u4eb2\u5386\u505a\u597d\uff0c\u540e\u9762\u6b63\u5f0f\u5f55\u4e66\u540e\uff0c\u4f1a\u5f97\u5fc3\u5e94\u624b\u4e0d\u5c11\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 \u4e3a\u6ee1\u8db3\u8bbe\u5907\u8981\u6c42\uff08Win10\u7cfb\u7edf\uff09\uff0c\u51b3\u5b9a\u201c\u91cd\u65b0\u88c5\u4e00\u53f0\u201d\u7535\u8111\uff0c\u884c\u52a8\u529b\u5f3a\uff0c\u672a\u89c1\u8d44\u91d1\u538b\u529b\u8868\u8ff0\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 \u80fd\u6295\u5165\u5927\u91cf\u65f6\u95f4\u7ec4\u7ec7\u5c0f\u7ec4\u6d3b\u52a8\u3001\u6307\u5bfc\u7ec4\u5458\u3001\u53cd\u590d\u4fee\u6539\u4f5c\u54c1\u81f3\u6df1\u591c\uff08\u201c\u5230\u5bb6\u52a0\u73ed\u505a\u51fa\u6765\u201d\uff09\uff0c\u65f6\u95f4\u6295\u5165\u5ea6\u9ad8\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u5bb6\u5ead\u5173\u7cfb\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9762\u5bf9\u8bbe\u5907\u517c\u5bb9\u95ee\u9898\u3001\u7ec4\u5458\u8fdb\u5ea6\u4e0d\u4e00\u3001\u4f5c\u54c1\u53cd\u590d\u4fee\u6539\u7b49\u6311\u6218\uff0c\u59cb\u7ec8\u4ee5\u89e3\u51b3\u95ee\u9898\u4e3a\u5bfc\u5411\uff0c\u4e3b\u52a8\u534f\u8c03\u3001\u63d0\u4f9b\u6280\u672f\u6307\u5bfc\u3001\u9f13\u52b1\u540c\u4f34\uff0c\u60c5\u7eea\u7a33\u5b9a\u4e14\u5bcc\u6709\u9886\u5bfc\u529b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5f53\u4e0b\u9636\u6bb5\uff0c\u53d1\u73b0\u7684\u95ee\u9898\u8d8a\u591a\u8d8a\u597d\u201d\uff1b > \u201c\u6ca1\u6709\u6ca1\u6709\uff0c\u8fd8\u67094\u5929\u65f6\u95f4\uff0c\u6765\u5f97\u53ca\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5728\u4e13\u4e1a\u9886\u57df\uff08\u6709\u58f0\u6f14\u64ad\uff09\u5bfb\u6c42**\u5708\u5c42\u5185\u7684\u6743\u5a01\u8ba4\u53ef\u4e0e\u4ef7\u503c\u5b9e\u73b0**\u3002\u4ed6\u901a\u8fc7\u7ec4\u7ec7\u56e2\u961f\u3001\u6307\u5bfc\u4ed6\u4eba\u3001\u8ffd\u6c42\u4f5c\u54c1\u5b8c\u7f8e\u6765\u83b7\u5f97\u5c0a\u91cd\u548c\u6210\u5c31\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u8d4b\u4e88\u5176\u201c\u56e2\u961f\u9886\u8896\u201d\u6216\u201c\u6280\u672f\u5bfc\u5e08\u201d\u7684\u8eab\u4efd\u8ba4\u540c**\uff0c\u63d0\u4f9b\u80fd\u8ba9\u4ed6\u65bd\u5c55\u7ec4\u7ec7\u624d\u80fd\u548c\u5206\u4eab\u7ecf\u9a8c\u7684\u5e73\u53f0\uff0c\u6ee1\u8db3\u5176\u88ab\u9700\u8981\u3001\u88ab\u5c0a\u91cd\u7684\u6df1\u5c42\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u7cbe\u786e\u5224\u5b9a\u3002\u57fa\u4e8e\u73b0\u6709\u884c\u4e3a\u6a21\u5f0f\uff0c\u503e\u5411 \ud83d\udfe7B \u7c7b** (\u6709\u660e\u786e\u5b66\u4e60\u76ee\u6807\u3001\u9ad8\u6295\u5165\u3001\u5f3a\u81ea\u9a71\uff0c\u4f46\u6838\u5fc3\u52a8\u673a\u548c\u5bb6\u5ead\u652f\u6301\u4fe1\u606f\u7f3a\u5931)\u3002 |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **[T1 \u5708\u517b\u9886\u8896]** (\u9ad8\u7f6e\u4fe1\u5ea6\u503e\u5411)\u3002\u8868\u73b0\u51fa\u6781\u5f3a\u7684\u7ec4\u7ec7\u534f\u8c03\u80fd\u529b\u3001\u6280\u672f\u94bb\u7814\u7cbe\u795e\u3001\u4e50\u4e8e\u52a9\u4eba\uff08\u201c\u5047\u5982\u5b9e\u5728\u4e0d\u884c\uff0c\u6211\u7ed9\u4f60\u4eec\u5f04\u201d\uff09\u3001\u8ffd\u6c42\u5b8c\u7f8e\uff08\u6536\u96c650\u6761\u5916\u90e8\u610f\u89c1\uff09\uff0c\u662f\u5929\u7136\u7684\u56e2\u961f\u6838\u5fc3\u4e0e\u610f\u89c1\u9886\u8896\u3002 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a[\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5ead\u51b2\u7a81\u7b49\u7ea2\u7ebf\u4fe1\u606f]\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | [\u4f4e] | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u4ee5\u5176\u72ec\u7acb\u89e3\u51b3\u95ee\u9898\u7684\u98ce\u683c\u770b\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | [\u4f4e] | \u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5f3a\uff0c\u5b66\u4e60\u70ed\u60c5\u9ad8\uff0c\u4e3b\u52a8\u514b\u670d\u8bbe\u5907\u969c\u788d\uff08\u91cd\u88c5\u7535\u8111\uff09\uff0c\u5d29\u76d8\u98ce\u9669\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | [\u6781\u4f4e] | \u5fc3\u7406\u5f39\u6027\u6781\u9ad8\uff0c\u662f\u95ee\u9898\u7684\u89e3\u51b3\u8005\u800c\u975e\u62b1\u6028\u8005\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | [\u4e2d] | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u82e5\u8bfe\u7a0b\u6216\u5e73\u53f0\u65e0\u6cd5\u6ee1\u8db3\u5176\u201c\u6280\u672f\u7cbe\u8fdb\u201d\u548c\u201c\u5e26\u9886\u56e2\u961f/\u83b7\u5f97\u8ba4\u53ef\u201d\u7684\u6df1\u5c42\u9700\u6c42\uff0c\u53ef\u80fd\u56e0\u201c\u5b66\u4e0d\u5230\u4e1c\u897f\u201d\u6216\u201c\u6ca1\u6709\u65bd\u5c55\u821e\u53f0\u201d\u800c\u4ea7\u751f\u4ef7\u503c\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe\u4e2d\u671f\uff08\u7ea61-2\u4e2a\u6708\u540e\uff09\uff0c\u5f53\u57fa\u7840\u6280\u80fd\u638c\u63e1\u540e\uff0c\u82e5\u8bfe\u7a0b\u6df1\u5ea6\u6216\u793e\u7fa4\u4e92\u52a8\u65e0\u6cd5\u6ee1\u8db3\u5176\u9886\u5bfc\u529b\u4e0e\u6df1\u5ea6\u94bb\u7814\u7684\u6e34\u671b\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6587\u9f99\uff0c\u770b\u4e86\u4f60\u5728\u5c0f\u7ec4\u91cc\u7684\u7edf\u7b79\u548c\u6307\u5bfc\uff0c\u975e\u5e38\u6709\u9886\u8896\u98ce\u8303\u3002\u54b1\u4eec\u73ed\u6b63\u9700\u8981\u4f60\u8fd9\u6837\u65e2\u6709\u70ed\u60c5\u53c8\u61c2\u6280\u672f\u7684\u2018\u5b9a\u6d77\u795e\u9488\u2019\u3002\u540e\u7eed\u7684\u5b9e\u6218\u9879\u76ee\u548c\u73ed\u59d4\u5de5\u4f5c\uff0c\u671f\u5f85\u4f60\u80fd\u5e26\u7740\u5927\u5bb6\u4e00\u8d77\u73a9\u51fa\u66f4\u9ad8\u6c34\u5e73\u3002\u6709\u4efb\u4f55\u5173\u4e8e\u6280\u672f\u6df1\u94bb\u6216\u56e2\u961f\u534f\u4f5c\u7684\u60f3\u6cd5\uff0c\u968f\u65f6\u627e\u6211\u804a\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf**\u3011\u3002\u8d4b\u4e88\u5176\u201c\u73ed\u957f\u201d\u3001\u201c\u6280\u672f\u987e\u95ee\u201d\u6216\u201c\u9879\u76ee\u7ec4\u957f\u201d\u7b49\u89d2\u8272\uff0c\u63d0\u4f9b\u7ec4\u7ec7\u5c0f\u578b\u6bd4\u8d5b\u3001\u5e26\u9886\u65b0\u4eba\u3001\u53c2\u4e0e\u5185\u5bb9\u5171\u521b\u7684\u673a\u4f1a\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T1\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a\u3010**\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743**\u3011\uff08\u4e0e\u5bfc\u5e08\u6df1\u5ea6\u4ea4\u6d41\u6280\u672f\uff09\u3001\u3010**\u9879\u76ee\u5b9e\u6218\u9886\u5bfc\u529b\u5305**\u3011\uff08\u63d0\u4f9b\u5c0f\u578b\u9879\u76ee\u8ba9\u5176\u8d1f\u8d23\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5c06\u5176\u89c6\u4e3a\u666e\u901a\u5b66\u5458\u8fdb\u884c\u201c\u586b\u9e2d\u5f0f\u201d\u7ba1\u7406\uff1b\u5ffd\u89c6\u5176\u63d0\u51fa\u7684\u6280\u672f\u5efa\u8bae\u6216\u56e2\u961f\u7ba1\u7406\u5efa\u8bae\uff1b\u53ea\u7ed9\u4efb\u52a1\u4e0d\u7ed9\u201c\u540d\u5206\u201d\uff08\u5982\u5c0f\u7ec4\u957f\u5934\u8854\uff09\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u5927\u989d\u63a8\u4ecb\u3002\u5176\u9700\u6c42\u5728\u4e8e\u66f4\u6df1\u5ea6\u7684\u6280\u672f\u8bfe\u7a0b\u3001\u66f4\u9ad8\u7ea7\u7684\u8bbe\u5907\u3001\u6216\u80fd\u4f53\u73b0\u5176\u9886\u5bfc\u4ef7\u503c\u7684\u201c\u5408\u4f19\u4eba\u201d\u6027\u8d28\u4ea7\u54c1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u54b1\u4eec\u7ec4\u91cc\uff0c\u662f\u6bcf\u4e2a\u4eba\u90fd\u8981\u628a\u524d\u4e2d\u540e\u671f\u7684\u4e3b\u5de5\u8ddf\u659c\u6760\uff0c\u90fd\u505a\u4e00\u904d\u3002\u4e1a\u52a1\u7684\u719f\u7ec3\u7a0b\u5ea6\u5f88\u91cd\u8981\u3002\u201d\n2. > \u201c\u6211\u628a\u505a\u597d\u7684\u8fd9\u4e2a\u540e\u671f\u6210\u54c1\u53d1\u5230\u6211\u4eec\u5355\u4f4d\u7fa4\u91cc\uff0c\u63d0\u51fa\u4e86\u5927\u698250\u6761\u610f\u89c1\u3002\u5149\u54b1\u4eec\u81ea\u55e8\u4e0d\u884c\uff0c\u5f97\u8ba9\u542c\u4f17\u68c0\u9a8c\u3002\u201d\n3. > \u201c\u5047\u5982\u5b9e\u5728\u4e0d\u884c\uff0c\u6211\u7ed9\u4f60\u4eec\u5f04\u3002\u4f46\u662f\u4e0d\u77e5\u9053\uff0c\u8fd9\u4e2a\u5408\u4e0d\u5408\u89c4\u3002\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **[T1 \u5708\u517b\u9886\u8896]**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **[\u83b7\u5f97\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0]**\u3002\u9000\u5355\u51e0\u7387\u4e3a **[\u4f4e]**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **[\u8d4b\u4e88\u5176\u7ec4\u7ec7\u8005\u89d2\u8272\uff0c\u6ee1\u8db3\u5176\u9886\u5bfc\u6b32\u4e0e\u6280\u672f\u94bb\u7814\u9700\u6c42\uff0c\u907f\u514d\u8ba9\u5176\u611f\u5230\u201c\u5927\u6750\u5c0f\u7528\u201d]**\u3002\n\n```json\n{\"core_type\": \"T1 \u5708\u517b\u9886\u8896\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\"}\n```";
