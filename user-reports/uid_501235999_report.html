    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 501235999 (\u6635\u79f0\uff1a\u6768\u826f\u798f) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-08 \u81f3 2026-04-01 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5929\u96ea\u68a6\u513f(\u8d75\u4e3d\u5a1c) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u57f9\u8bad\u8bfe\u7a0b (\u5df2\u8d2d\u8bfe\uff0c\u5e76\u989d\u5916\u8d2d\u4e703999\u5143\u8bbe\u5907) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u5168\u6b3e\u5145\u88d5** (\u80fd\u5feb\u901f\u652f\u4ed8\u8fd14000\u5143\u8bbe\u5907\u6b3e\uff0c\u65e0\u5206\u671f/\u501f\u6b3e\u8ff9\u8c61) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u9ad8\u5bbd\u88d5** (\u53ef\u9891\u7e41\u5728\u767d\u5929\u6c9f\u901a\u3001\u53c2\u52a0\u53bf\u66f2\u827a\u5bb6\u534f\u4f1a\u6d3b\u52a8\uff0c\u65f6\u95f4\u81ea\u4e3b\u6027\u5f3a) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u5355\u8eab\u72ec\u7acb / \u5df2\u62a5\u5907\u5e76\u652f\u6301** (\u65e0\u5bb6\u5ead\u963b\u529b\u8ff9\u8c61\uff0c\u51b3\u7b56\u72ec\u7acb) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** (\u4e92\u52a8\u9891\u7e41\uff0c\u5b66\u4e60\u8fc7\u7a0b\u3001\u8bbe\u5907\u8c03\u8bd5\u3001\u793e\u4ea4\u53c2\u4e0e\u5747\u6709\u8be6\u7ec6\u8bb0\u5f55) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34\u578b**\u3002\u7528\u6237\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b\uff0c\u4f46\u6838\u5fc3\u9a71\u52a8\u529b\u6df7\u6742\u4e86\u5174\u8da3\u63a2\u7d22\u3001\u793e\u4ea4\u5f52\u5c5e\u4e0e\u6f5c\u5728\u7684\u53d8\u73b0\u671f\u671b\u3002\u4ed6\u79ef\u6781\u5b66\u4e60\u3001\u8d2d\u4e70\u8bbe\u5907\u3001\u53c2\u4e0e\u793e\u7fa4\uff0c\u4f46\u5e76\u672a\u5728\u5bf9\u8bdd\u4e2d\u76f4\u63a5\u3001\u6025\u5207\u5730\u8ffd\u95ee\u201c\u591a\u4e45\u80fd\u8d5a\u94b1\u201d\u6216\u8981\u6c42\u4fdd\u5e95\u627f\u8bfa\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u57fa\u7840\u4e0d\u7262\uff08\u666e\u901a\u8bdd\uff09\u5730\u52a8\u5c71\u6447\u201d (\u5173\u6ce8\u80fd\u529b\u57fa\u7840) > \u201c\u6709\u8d85\u6367\u7684\u73ed\u73ed[\u5f3a][\u5f3a][\u73ab\u7470][\u73ab\u7470]\u4e00\u8d77\u5b8c\u6210\u6709\u58f0\u68a6\u201d (\u5174\u8da3\u4e0e\u793e\u7fa4\u9a71\u52a8)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u9ad8** \u2014 \u80fd\u8f7b\u677e\u652f\u4ed83999\u5143\u8bbe\u5907\u6b3e\uff0c\u65e0\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u9ad8** \u2014 \u65f6\u95f4\u5145\u88d5\uff0c\u5b66\u4e60\u6295\u5165\u5ea6\u9ad8\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u9ad8** \u2014 \u65e0\u5bb6\u5ead\u963b\u529b\u4fe1\u53f7\u3002\n- **\u26a0\ufe0f \u6700\u77ed\u677f\uff1a\u6570\u5b57\u64cd\u4f5c\u80fd\u529b** \u2014 **\u6781\u4f4e**\u3002\u7528\u6237\u53cd\u590d\u5f3a\u8c03\u81ea\u5df1\u662f\u201c\u5c0f\u767d\u201d\uff0c\u5728A+\u6743\u9650\u6ce8\u518c\u3001\u559c\u64ad\u5b66\u5802\u64cd\u4f5c\u3001AU\u8f6f\u4ef6\u4f7f\u7528\u3001\u8bbe\u5907\u8fde\u63a5\u8c03\u8bd5\u7b49**\u57fa\u7840\u6570\u5b57\u64cd\u4f5c\u4e0a\u5b58\u5728\u5de8\u5927\u969c\u788d**\uff0c\u591a\u6b21\u9700\u8981\u5916\u90e8\u5e2e\u52a9\uff08\u8bf7\u5f53\u5730\u7535\u8111\u5e08\u5085\u3001\u8fdc\u7a0b\u534f\u52a9\uff09\uff0c\u4e14\u5b66\u4e60\u66f2\u7ebf\u9661\u5ced\uff0c\u60c5\u7eea\u6613\u53d7\u632b\u3002**\u6b64\u77ed\u677f\u5c06\u4e25\u91cd\u5236\u7ea6\u5176\u5b66\u4e60\u8fdb\u5ea6\u548c\u6210\u679c\u4ea4\u4ed8\uff0c\u662f\u8d44\u6e90\u5e95\u5ea7\u7684\u6700\u5927\u98ce\u9669\u70b9\u3002**\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b07\u4f4e\u6781\u5371**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u9762\u5bf9\u6280\u672f\u64cd\u4f5c\u56f0\u96be\u65f6\uff0c\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u65e0\u52a9\u611f\u3001\u81ea\u5351\uff08\u201c\u6211\u4e0d\u662f\u795e\u7ae5\u201d\uff09\u3001\u4f9d\u8d56\u5916\u90e8\u6307\u5bfc\uff0c\u5e76\u4f34\u6709\u8f7b\u5fae\u62b1\u6028\uff08\u201c\u4e3a\u4ec0\u4e48\u4e0d\u56de\u590d\uff1f\u201d\uff09\u3002\u867d\u7136\u6700\u7ec8\u80fd\u5b8c\u6210\uff0c\u4f46\u8fc7\u7a0b\u5145\u6ee1\u60c5\u7eea\u6ce2\u52a8\uff0c\u9700\u8981\u5927\u91cf\u624b\u628a\u624b\u6307\u5bfc\u548c\u60c5\u7eea\u5b89\u629a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u771f\u7684\u6ca1\u62db\u4e86\u201d > \u201c\u60a8\u8fd9\u4e48\u5feb\u64cd\u4f5c\uff0c\u6211\u53ef\u4e0d\u662f\u795e\u7ae5\uff0c\u66f4\u975e\u662f\u8c61\u60a8\u8fd9\u6837\u7684\u4e13\u4e1a\u4eba\u5594\u201d > \u201c\u6073\u8bf7\u628a\u4ece\u6253\u5f00au-\u5f00\u59cb\u5f55\u5236-\u7ed3\u675f-\u5bfc\u51fa-\u4fdd\u5b58\u7684\u6587\u5b57\u7a0b\u5e8f\u548c\u89c6\u9891\u53d1\u6211\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42 (\u5f52\u5c5e\u611f) & \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 (\u88ab\u8ba4\u53ef)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5728\u6570\u5b57\u65f6\u4ee3\u7684\u6280\u80fd\u7126\u8651\u4e0e\u8eab\u4efd\u843d\u5dee**\u3002\u4f5c\u4e3a\u4e00\u4f4d\u53ef\u80fd\u6709\u4e00\u5b9a\u793e\u4f1a\u9605\u5386\uff08\u53c2\u4e0e\u53bf\u66f2\u827a\u5bb6\u534f\u4f1a\uff09\u7684\u6210\u5e74\u4eba\uff0c\u5374\u5728\u57fa\u7840\u7684\u7535\u8111\u3001\u8f6f\u4ef6\u64cd\u4f5c\u4e0a\u5c61\u5c61\u53d7\u632b\uff0c\u4ea7\u751f\u4e86\u5f3a\u70c8\u7684\u201c\u7b28\u62d9\u611f\u201d\u548c\u201c\u843d\u540e\u611f\u201d\u3002\u4ed6\u6e34\u671b\u901a\u8fc7\u5b66\u4e60\u65b0\u6280\u80fd\uff08\u6709\u58f0\u6f14\u64ad\uff09\u878d\u5165\u4e00\u4e2a\u65b0\u7684\u3001\u6709\u6d3b\u529b\u7684\u793e\u7fa4\uff08\u73ed\u7ea7\uff09\uff0c\u83b7\u5f97\u540c\u4f34\u548c\u8001\u5e08\u7684\u8ba4\u53ef\uff0c\u4ece\u800c\u91cd\u5efa\u81ea\u4fe1\u548c\u793e\u4ea4\u4ef7\u503c\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u8010\u5fc3\u3001\u9f13\u52b1\u4e0e\u201c\u88ab\u770b\u89c1\u201d\u7684\u6210\u5c31\u611f**\u3002\u4ed6\u9700\u8981\u88ab\u6e29\u67d4\u5730\u5bf9\u5f85\uff0c\u6bcf\u4e00\u4e2a\u5fae\u5c0f\u7684\u8fdb\u6b65\u90fd\u9700\u8981\u88ab\u653e\u5927\u548c\u8868\u626c\uff0c\u4ee5\u62b5\u6d88\u4ed6\u5728\u6280\u672f\u64cd\u4f5c\u4e0a\u7684\u632b\u8d25\u611f\uff0c\u7ef4\u6301\u5176\u5b66\u4e60\u70ed\u60c5\u548c\u793e\u7fa4\u5f52\u5c5e\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1 \u7c7b** (\u52a8\u673a\u4e2d\u7b49\uff0c\u8d44\u6e90\u5e95\u5ea7\u56e0\u6280\u672f\u77ed\u677f\u6781\u4f4e\uff0c\u5fc3\u7406\u5f39\u6027\u6781\u4f4e) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u6838\u5fc3\u7279\u5f81\uff1a\u6280\u672f\u81ea\u5351\u3001\u6781\u5ea6\u4f9d\u8d56\u3001\u9700\u8981\u9ad8\u9891\u60c5\u7eea\u4ef7\u503c\u704c\u6e89) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u65e0\u501f\u8d37\u3001\u751f\u5b58\u5371\u673a\u3001\u5bb6\u5ead\u5267\u70c8\u53cd\u5bf9\u7b49\u7ea2\u7ebf)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a/\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u5bb6\u5ead\u652f\u6301\u5ea6\u9ad8\uff0c\u65e0\u6b64\u98ce\u9669\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u6280\u672f\u64cd\u4f5c\u8fde\u7eed\u5361\u58f3\uff0c\u4ea7\u751f\u201c\u6211\u6839\u672c\u5b66\u4e0d\u4f1a\u201d\u7684\u7edd\u671b\u611f**\u3002\u4f8b\u5982\uff1aAU\u5b89\u88c5\u5931\u8d25\u3001\u4f5c\u4e1a\u65e0\u6cd5\u4e0a\u4f20\u3001\u8bbe\u5907\u8c03\u8bd5\u65e0\u679c\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u73ed\u4e3b\u4efb\u6216\u540c\u5b66\u7684\u4e0d\u8010\u70e6\u3001\u50ac\u4fc3\u6216\u201c\u4f60\u600e\u4e48\u8fd9\u90fd\u4e0d\u4f1a\u201d\u7684\u6f5c\u5728\u6001\u5ea6**\u3002\u4e00\u6b21\u8d1f\u9762\u53cd\u9988\u6216\u5ffd\u89c6\u5176\u6c42\u52a9\uff0c\u53ef\u80fd\u76f4\u63a5\u5bfc\u81f4\u5176\u81ea\u5c0a\u5fc3\u5d29\u6e83\uff0c\u653e\u5f03\u5b66\u4e60\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u5f53\u5b66\u4e60\u8fdb\u884c\u5230\u4e2d\u671f\uff0c\u53d1\u73b0\u63a5\u5355\u3001\u53d8\u73b0\u8fdc\u6bd4\u81ea\u5df1\u60f3\u8c61\u7684\u590d\u6742\u548c\u9700\u8981\u6280\u672f\u65f6\uff0c\u4f1a\u4ea7\u751f\u843d\u5dee\u3002\u4f46\u76ee\u524d\u88ab\u793e\u4ea4\u548c\u9f13\u52b1\u9700\u6c42\u6682\u65f6\u63a9\u76d6\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c3-4\u5468\uff0c\u9996\u6b21\u8981\u6c42\u4f7f\u7528\u4e13\u4e1a\u8bbe\u5907\uff08AU\uff09\u5b8c\u6210\u5e76\u63d0\u4ea4\u4f5c\u4e1a\u65f6**\u3002\u6b64\u65f6\u6280\u672f\u95e8\u69db\u6700\u9ad8\uff0c\u632b\u8d25\u611f\u6700\u5f3a\uff0c\u662f\u9000\u8d39\u98ce\u9669\u5cf0\u503c\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6768\u5927\u54e5/\u8001\u5e08\uff0c\u770b\u5230\u60a8\u8fd9\u4e48\u79ef\u6781\u5730\u5b66\u4e60\uff0c\u8fd8\u4e13\u95e8\u914d\u5907\u4e86\u4e13\u4e1a\u8bbe\u5907\uff0c\u8fd9\u4efd\u8ba4\u771f\u52b2\u513f\u592a\u8ba9\u4eba\u4f69\u670d\u4e86\uff01\u54b1\u4eec\u8fd9\u4e2a\u73ed\u5f88\u591a\u4f19\u4f34\u90fd\u662f\u4ece\u5c0f\u767d\u5f00\u59cb\u7684\uff0c\u60a8\u6709\u4efb\u4f55\u64cd\u4f5c\u4e0a\u7684\u95ee\u9898\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4e00\u6b65\u6b65\u5e26\u60a8\u8d70\u3002\u54b1\u4eec\u4e0d\u8ddf\u522b\u4eba\u6bd4\u901f\u5ea6\uff0c\u5c31\u6bd4\u8c01\u66f4\u4eab\u53d7\u8fd9\u4e2a\u8fc7\u7a0b\uff0c\u6bcf\u4e00\u6b65\u8d70\u7a33\u4e86\u5c31\u662f\u80dc\u5229\uff01\u60a8\u7684\u58f0\u97f3\u6761\u4ef6\u5f88\u597d\uff0c\u5148\u628a\u57fa\u7840\u6253\u7262\uff0c\u540e\u9762\u4f1a\u8d8a\u6765\u8d8a\u987a\u7684\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5174\u8da3\u6e38\u4e50\u7ebf\u3011** (\u6838\u5fc3\u662f\u7ef4\u6301\u5174\u8da3\u548c\u793e\u7fa4\u5f52\u5c5e\uff0c\u6de1\u5316\u77ed\u671f\u53d8\u73b0\u538b\u529b)\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011** (\u5fc5\u987b\u6ee1\u914d\uff01\u5305\u542b\uff1a1v1\u8d85\u8010\u5fc3\u56fe\u6587/\u89c6\u9891\u624b\u628a\u624b\u6559\u7a0b\u3001\u6bcf\u65e5\u6253\u5361\u9f13\u52b1\u3001\u4f5c\u4e1a\u70b9\u8bc4\u4ee5\u5938\u8d5e\u6001\u5ea6\u548c\u8fdb\u6b65\u4e3a\u4e3b\uff0c\u4e25\u7981\u6279\u8bc4\u6280\u672f\u7ec6\u8282)\u3001**\u3010\u6781\u7b80\u64cd\u4f5c\u5de5\u5177\u5305\u3011** (\u63d0\u4f9b\u6700\u50bb\u74dc\u7684\u4e00\u952e\u5f0f\u5f55\u97f3/\u4e0a\u4f20\u63d2\u4ef6\u6216\u66ff\u4ee3\u65b9\u6848)\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9T6\u4f7f\u7528\u4efb\u4f55\u50ac\u4fc3\u3001\u53cd\u95ee\u6216\u9690\u542b\u8d23\u5907\u7684\u8bed\u6c14** (\u5982\uff1a\u201c\u4f60\u4e0d\u662f\u6709\u7535\u8111\u7684\u561b\u201d\u3001\u201c\u544a\u8bc9\u4f60\u592a\u591a\uff0c\u4f60\u5bb9\u6613\u6df7\u4e71\u201d \u2013 \u73b0\u6709\u5bf9\u8bdd\u4e2d\u9500\u552e\u5df2\u51fa\u73b0\u6b64\u7c7b\u98ce\u9669\u70b9)\u3002\n    2. **\u7edd\u4e0d\u7ed9T6\u5e03\u7f6e\u9700\u8981\u590d\u6742\u8f6f\u4ef6\u64cd\u4f5c\u7684\u201c\u786c\u6838\u201d\u4efb\u52a1**\uff0c\u521d\u671f\u5e94\u5141\u8bb8\u5176\u7528\u624b\u673a\u5b8c\u6210\u4f5c\u4e1a\u3002\n    3. **\u7edd\u4e0d\u5728\u73ed\u7fa4\u516c\u5f00\u5bf9\u6bd4\u6216\u6307\u51fa\u5176\u6280\u672f\u64cd\u4f5c\u7684\u843d\u540e**\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u5f53\u524d\u6280\u672f\u81ea\u5351\u672a\u7f13\u89e3\u3001\u60c5\u7eea\u4f9d\u8d56\u6781\u5f3a\u7684\u60c5\u51b5\u4e0b\uff0c\u4efb\u4f55\u5347\u5355\u5efa\u8bae\u90fd\u4f1a\u88ab\u89c6\u4e3a\u538b\u529b\u6e90\uff0c\u6781\u6613\u5f15\u53d1\u5d29\u6e83\u548c\u9000\u8d39\u3002\u5e94\u5148\u7a33\u5b9a\u5b8c\u6210\u5f53\u524d\u8bfe\u7a0b\uff0c\u5efa\u7acb\u5145\u5206\u4fe1\u4efb\u548c\u6210\u5c31\u611f\u540e\uff0c\u518d\u89c2\u5bdf\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u8fd9\u4e2a\u8bbe\u5907\u4ece\u6765\u6ca1\u63a5\u89e6\u8fc7\uff0c\u786e\u5b9e\u7684\uff0c\u8fd9\u6837\u5feb\u7684\u901f\u5ea6\u6211\u662f\u6ca1\u529e\u6cd5\u628a\u5b83\u8bb0\u4f4f\u7684\uff0c\u5bf9\u4e0d\u8d77\u3002\u201d\n2. > \u201c\u6211\u771f\u7684\u6ca1\u62db\u4e86\u201d\n3. > \u201c\u60a8\u8fd9\u4e48\u5feb\u64cd\u4f5c\uff0c\u6211\u53ef\u4e0d\u662f\u795e\u7ae5\uff0c\u66f4\u975e\u662f\u8c61\u60a8\u8fd9\u6837\u7684\u4e13\u4e1a\u4eba\u5594\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6 \u60c5\u7eea\u5de8\u5a74\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u5728\u6570\u5b57\u6280\u80fd\u7126\u8651\u4e2d\u5bfb\u627e\u793e\u7fa4\u5f52\u5c5e\u4e0e\u5c0a\u91cd\u8ba4\u53ef**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u6781\u81f4\u8010\u5fc3\u7684\u201c\u624b\u628a\u624b\u201d\u6559\u5b66\u548c\u6d2a\u6c34\u822c\u7684\u60c5\u7eea\u9f13\u52b1\uff0c\u5c4f\u853d\u4e00\u5207\u6280\u672f\u632b\u8d25\u611f**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u793e\u4ea4\u4e0e\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf+\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\"}\n```";
