    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u4e0e\u98ce\u63a7\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u7f3a\u5931\u5173\u952e\u4fe1\u606f\uff1a\u652f\u4ed8\u8bb0\u5f55\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u3001\u7528\u6237\u4e2a\u4eba\u80cc\u666f\uff08\u5e74\u9f84/\u804c\u4e1a/\u6536\u5165\uff09\u3001\u660e\u786e\u7684\u5b66\u4e60\u76ee\u6807\u4e0e\u9884\u671f\u3001\u5bf9\u8bfe\u7a0b\u4ef7\u683c\u7684\u654f\u611f\u5ea6\u3001\u5bf9\u8fdb\u9636\u8bfe\u7684\u610f\u5411\u3002\n\n---\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49\u504f\u9ad8)**\n    *   **\u5f3a\u5b9e\u8df5\u9a71\u52a8**\uff1a\u9ad8\u9891\u7ec4\u7ec7/\u53c2\u4e0e\u8bd5\u97f3\u3001\u7ec4\u961f\u3001\u5ba1\u542c\uff0c\u4e3b\u52a8\u5bfb\u6c42\u5408\u4f5c\uff0c\u884c\u52a8\u529b\u5f3a\u3002\n    *   **\u5185\u5728\u5174\u8da3**\uff1a\u8868\u8fbe\u201c\u70ed\u7231\u538b\u5012\u4e00\u5207\u201d\u3001\u201c\u5bf9\u4e8e\u559c\u6b22\u7684\u4e8b\uff0c\u82b1\u65f6\u95f4\u505a\u662f\u4e00\u79cd\u4eab\u53d7\u201d\uff0c\u663e\u793a\u51fa\u975e\u529f\u5229\u6027\u6295\u5165\u3002\n    *   **\u6210\u957f\u5bfc\u5411**\uff1a\u79ef\u6781\u5bfb\u6c42\u53cd\u9988\uff08\u201c\u8bf7\u73ed\u73ed\u5e2e\u6211\u7ed9\u610f\u89c1\u201d\uff09\uff0c\u63a5\u53d7\u6279\u8bc4\u5e76\u91cd\u5f55\uff0c\u5173\u6ce8\u6280\u80fd\u63d0\u5347\uff08\u201c\u591a\u7ec3\u591a\u611f\u89c9\u201d\u3001\u201c\u6478\u7d22\u7740\uff0c\u9010\u6e10\u4f53\u4f1a\u7740\u201d\uff09\u3002\n    *   **\u4fe1\u606f\u7f3a\u53e3**\uff1a\u672a\u63d0\u53ca\u660e\u786e\u7684\u804c\u4e1a\u8f6c\u578b\u3001\u526f\u4e1a\u53d8\u73b0\u7b49\u529f\u5229\u6027\u76ee\u6807\u3002\n\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d\u7b49)**\n    *   **\u65f6\u95f4\u8d44\u6e90\u5145\u6c9b**\uff1a\u80fd\u9891\u7e41\u5728\u665a\u95f4\u53ca\u5047\u671f\u6295\u5165\u5927\u91cf\u65f6\u95f4\u8fdb\u884c\u7ec3\u4e60\u3001\u5408\u4f5c\u4e0e\u4f1a\u8bae\uff0c\u663e\u793a\u65f6\u95f4\u652f\u914d\u5ea6\u9ad8\u3002\n    *   **\u793e\u4ea4\u4e0e\u7ec4\u7ec7\u8d44\u6e90**\uff1a\u5177\u5907\u8f83\u5f3a\u7684\u793e\u7fa4\u94fe\u63a5\u4e0e\u7ec4\u7ec7\u534f\u8c03\u80fd\u529b\uff08\u4e3b\u52a8\u7ec4\u961f\u3001\u5206\u914d\u89d2\u8272\u3001\u5236\u5b9a\u8ba1\u5212\uff09\u3002\n    *   **\u5b66\u4e60\u5de5\u5177**\uff1a\u63d0\u53ca\u4f7f\u7528AU\u3001\u5173\u6ce8\u97f3\u6548\u7d20\u6750\u5b58\u50a8\uff08\u7f51\u76d8/\u786c\u76d8\uff09\uff0c\u5177\u5907\u57fa\u7840\u5b66\u4e60\u6761\u4ef6\u3002\n    *   **\u4fe1\u606f\u7f3a\u53e3**\uff1a**\u7ecf\u6d4e\u72b6\u51b5\u672a\u77e5**\uff0c\u5bf9\u8bbe\u5907\u6295\u8d44\uff08\u5982\u79fb\u52a8\u786c\u76d8\uff09\u7684\u6001\u5ea6\u672a\u660e\u786e\uff1b**\u5bb6\u5ead\u652f\u6301\u5ea6\u672a\u77e5**\u3002\n\n*   **\u5fc3\u7406\u5f39\u6027 (\u9ad8)**\n    *   **\u9ad8\u8010\u632b\u6027**\uff1a\u8bd5\u97f3\u201c\u5f85\u5b9a\u201d\u540e\u4e3b\u52a8\u8981\u6c42\u91cd\u5f55\u5e76\u6700\u7ec8\u201c\u521d\u5ba1\u901a\u8fc7\u201d\uff0c\u80fd\u63a5\u53d7\u201c\u60c5\u611f\u7ed9\u592a\u591a\u201d\u3001\u201c\u54ac\u5b57\u592a\u72e0\u201d\u7b49\u6279\u8bc4\u5e76\u8c03\u6574\u3002\n    *   **\u79ef\u6781\u5f52\u56e0**\uff1a\u5c06\u56f0\u96be\u89c6\u4e3a\u201c\u4e0a\u5761\u8def\u201d\uff0c\u5c06\u53cd\u9988\u89c6\u4e3a\u201c\u5c0f\u7a81\u7834\uff0c\u66f4\u6709\u4fe1\u5fc3\u4e86\u201d\u3002\n    *   **\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898**\uff1a\u9047\u5230\u95ee\u9898\uff08\u5982\u7ec4\u961f\u3001\u8bbe\u5907\u3001\u4f1a\u8bae\uff09\u4e3b\u52a8\u534f\u8c03\u3001\u5bfb\u627e\u66ff\u4ee3\u65b9\u6848\u3002\n    *   **\u793e\u7fa4\u4e92\u52a9\u503e\u5411**\uff1a\u9891\u7e41\u4f7f\u7528\u201c[\u62b1\u62f3][\u73ab\u7470][\u62e5\u62b1]\u201d\u7b49\u7b26\u53f7\uff0c\u9f13\u52b1\u540c\u4f34\uff08\u201c\u5403\u4e00\u5811\u957f\u4e00\u667a\u201d\uff09\uff0c\u56e2\u961f\u5408\u4f5c\u610f\u613f\u5f3a\u70c8\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5** - **\u65e0\u6cd5\u5224\u65ad**\u3002\u8bb0\u5f55\u4e2d\u65e0\u652f\u4ed8\u884c\u4e3a\u3001\u4ef7\u683c\u8ba8\u8bba\u6216\u4f18\u60e0\u8be2\u95ee\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5** - **\u65e0\u6cd5\u5224\u65ad**\u3002\u8bb0\u5f55\u4e2d\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u6210\u5458\u6216\u51b3\u7b56\u8ba8\u8bba\u3002\n*   **\u6b65\u9aa42\uff1a\u52a8\u673a\u7eaf\u5ea6\u5224\u5b9a** - **B\u7c7b (\u5174\u8da3\u5b9e\u8df5\u578b)**\u3002\u884c\u4e3a\u9ad8\u5ea6\u56f4\u7ed5\u6280\u80fd\u7ec3\u4e60\u4e0e\u793e\u7fa4\u5408\u4f5c\uff0c\u5185\u5728\u9a71\u52a8\u660e\u663e\uff0c\u4f46\u957f\u671f\u53d8\u73b0\u52a8\u673a\u4e0d\u660e\u3002\n*   **\u6b65\u9aa43\uff1a\u8d44\u6e90\u5e95\u5ea7\u5224\u5b9a** - **B\u7c7b (\u65f6\u95f4\u5145\u88d5\u578b)**\u3002\u65f6\u95f4\u6295\u5165\u5ea6\u9ad8\uff0c\u793e\u4ea4\u8d44\u6e90\u4e30\u5bcc\uff0c\u4f46\u8d22\u52a1\u8d44\u6e90\u672a\u4f53\u73b0\u3002\n*   **\u6b65\u9aa44\uff1a\u5fc3\u7406\u5f39\u6027\u5224\u5b9a** - **A\u7c7b (\u9ad8\u97e7\u6027\u6210\u957f\u578b)**\u3002\u6297\u538b\u3001\u4e3b\u52a8\u3001\u4e50\u89c2\uff0c\u5177\u5907\u6301\u7eed\u5b66\u4e60\u7684\u5fc3\u667a\u6a21\u5f0f\u3002\n*   **\u7efc\u5408\u5224\u5b9a**\uff1a**B-A\u578b\u7528\u6237**\u3002\u9ad8\u6295\u5165\u3001\u9ad8\u5f39\u6027\u3001\u4ee5\u5b9e\u8df5\u548c\u5174\u8da3\u4e3a\u6838\u5fc3\u9a71\u52a8\uff0c\u4f46\u7ecf\u6d4e\u57fa\u7840\u548c\u957f\u671f\u76ee\u6807\u6e05\u6670\u5ea6\u5b58\u7591\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b\uff1aT3 \u5b9e\u8df5\u63a2\u7d22\u8005**\n    *   **\u6838\u5fc3\u7279\u5f81**\uff1a\u5b66\u4e60\u8fc7\u7a0b\u5373\u76ee\u6807\uff0c\u4eab\u53d7\u6280\u80fd\u7cbe\u8fdb\u4e0e\u793e\u7fa4\u534f\u4f5c\u7684\u4e50\u8da3\uff0c\u5c06\u8bfe\u7a0b\u4f5c\u4e3a\u6c89\u6d78\u5f0f\u201c\u5174\u8da3\u5de5\u4f5c\u574a\u201d\u3002\n    *   **\u884c\u4e3a\u543b\u5408**\uff1a\u4e3b\u5bfc\u9879\u76ee\u5236\u5408\u4f5c\uff08\u7ec4\u961f\u3001\u5206\u5de5\u3001\u5ba1\u542c\u3001\u6392\u671f\uff09\uff0c\u79ef\u6781\u53cd\u9988\u95ed\u73af\uff0c\u4e50\u4e8e\u52a9\u4eba\uff0c\u5bf9\u7ed3\u679c\uff08\u5982\u901a\u8fc7\uff09\u6709\u6210\u5c31\u611f\u4f46\u66f4\u4eab\u53d7\u8fc7\u7a0b\u3002\n    *   **\u98ce\u9669\u504f\u79bb**\uff1a\u672a\u8868\u73b0\u51faT3\u5e38\u89c1\u7684\u201c\u8f7b\u5ea6\u6d88\u8d39\u4e3b\u4e49\u201d\uff08\u70ed\u8877\u8d2d\u4e70\u5468\u8fb9\u8bfe\u7a0b/\u8bbe\u5907\uff09\uff0c\u66f4\u504f\u5411\u8d44\u6e90\u6574\u5408\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4e2d\u4f4e)\n*   **\u6839\u56e01 - \u6548\u679c\u4e0d\u53ca\u9884\u671f**\uff1a**\u4f4e\u98ce\u9669**\u3002\u7528\u6237\u5df2\u83b7\u5f97\u201c\u521d\u5ba1\u901a\u8fc7\u201d\u7684\u6b63\u5411\u53cd\u9988\uff0c\u4e14\u81ea\u6211\u8ba4\u77e5\u6e05\u6670\uff08\u201c\u60c5\u611f\u7ed9\u592a\u591a\u201d\uff09\uff0c\u5bf9\u5b66\u4e60\u66f2\u7ebf\u6709\u5fc3\u7406\u51c6\u5907\u3002\n*   **\u6839\u56e02 - \u7ecf\u6d4e\u538b\u529b**\uff1a**\u4e2d\u98ce\u9669**\u3002**\u5173\u952e\u4fe1\u606f\u7f3a\u5931**\u3002\u65e0\u6cd5\u5224\u65ad\u8bfe\u7a0b\u8d39\u7528\u662f\u5426\u6784\u6210\u8d1f\u62c5\uff0c\u9700\u8b66\u60d5\u540e\u7eed\u7eed\u8d39\uff08\u5982\u52a8\u6001\u6f2b\u3001\u89c6\u9891\u8bfe\uff09\u65f6\u7684\u652f\u4ed8\u80fd\u529b\u3002\n*   **\u6839\u56e03 - \u65f6\u95f4\u51b2\u7a81**\uff1a**\u4f4e\u98ce\u9669**\u3002\u5f53\u524d\u65f6\u95f4\u6295\u5165\u5ea6\u9ad8\uff0c\u4e14\u80fd\u81ea\u4e3b\u534f\u8c03\u3002\n*   **\u6839\u56e04 - \u5185\u5bb9\u4e0d\u5339\u914d**\uff1a**\u4f4e\u98ce\u9669**\u3002\u7528\u6237\u6df1\u5ea6\u53c2\u4e0e\u8bfe\u7a0b\u8bbe\u8ba1\u7684\u5b9e\u8df5\u73af\u8282\uff08\u8bd5\u97f3\u3001\u6709\u58f0\u4e4b\u591c\uff09\uff0c\u5339\u914d\u5ea6\u9ad8\u3002\n*   **\u6839\u56e05 - \u670d\u52a1\u4f53\u9a8c**\uff1a**\u4f4e\u98ce\u9669**\u3002\u4e0e\u73ed\u4e3b\u4efb\u4e92\u52a8\u9891\u7e41\u3001\u6b63\u5411\uff0c\u80fd\u83b7\u5f97\u5177\u4f53\u6307\u5bfc\u3002\n*   **\u6839\u56e06 - \u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u4e2d\u98ce\u9669**\u3002**\u5173\u952e\u4fe1\u606f\u7f3a\u5931**\u3002\u957f\u65f6\u95f4\u6295\u5165\u53ef\u80fd\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\uff0c\u9700\u6838\u67e5\u3002\n*   **\u6839\u56e07 - \u7ade\u54c1\u8f6c\u79fb**\uff1a**\u4f4e\u98ce\u9669**\u3002\u7528\u6237\u9ad8\u5ea6\u5d4c\u5165\u5f53\u524d\u73ed\u7ea7\u793e\u7fa4\uff0c\u8f6c\u79fb\u6210\u672c\u9ad8\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u65e0\u8fc7\u5ea6\u627f\u8bfa\u8ff9\u8c61**\uff1a\u9500\u552e\u53cd\u9988\u96c6\u4e2d\u4e8e\u5177\u4f53\u6f14\u64ad\u6280\u5de7\u6307\u5bfc\uff08\u201c\u54ac\u5b57\u592a\u72e0\u4e86\uff0c\u7a0d\u5fae\u518d\u677e\u5f1b\u4e00\u70b9\u201d\uff09\uff0c\u672a\u53d1\u73b0\u201c\u4fdd\u8fc7\u201d\u3001\u201c\u9ad8\u85aa\u201d\u7b49\u627f\u8bfa\u3002\n*   **\u65e0\u5236\u9020\u7126\u8651**\uff1a\u9500\u552e\u6c9f\u901a\u4ee5\u9f13\u52b1\u548c\u5177\u4f53\u5efa\u8bae\u4e3a\u4e3b\uff08\u201c\u4f60\u672c\u6765\u5c31\u95ee\u9898\u4e0d\u5927\u201d\uff09\u3002\n*   **\u6f5c\u5728\u98ce\u9669\u70b9**\uff1a\n    1.  **\u5bb6\u5ead\u77e5\u60c5\u98ce\u9669**\uff1a\u7528\u6237\u6295\u5165\u65f6\u95f4\u6781\u591a\uff08\u5e38\u81f3\u6df1\u591c\uff09\uff0c**\u5b58\u5728\u5bb6\u5ead\u4e0d\u77e5\u60c5\u6216\u53cd\u5bf9\u7684\u53ef\u80fd**\uff0c\u6b64\u4e3a\u91cd\u5927\u6f5c\u5728\u98ce\u9669\u3002\n    2.  **\u8fde\u5e26\u9500\u552e\u98ce\u9669**\uff1a\u7528\u6237\u4e3b\u52a8\u54a8\u8be2\u201c\u4f84\u513f\u201d\u7684\u201c\u540e\u671f\u8425\u201d\u3001\u201c\u89c6\u9891\u5236\u4f5c\u201d\u3001\u201c\u52a8\u6001\u6f2b\u201d\u8bfe\u7a0b\uff0c**\u9700\u4e25\u683c\u533a\u5206\u6210\u4eba\u7528\u6237\u4e0e\u4eb2\u5c5e\u7684\u62a5\u540d\uff0c\u907f\u514d\u6df7\u6dc6\u9500\u552e\u4e3b\u4f53\uff0c\u5f15\u53d1\u7ea0\u7eb7**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d**\uff1a**\u5339\u914d**\u3002\u7528\u6237\u884c\u4e3a\u4e0e\u8bfe\u7a0b\u8bbe\u8ba1\u7684\u5b9e\u8df5\u3001\u793e\u7fa4\u5c5e\u6027\u9ad8\u5ea6\u5951\u5408\uff0c\u662f\u7406\u60f3\u7684\u6d3b\u8dc3\u7528\u6237\u548c\u793e\u7fa4\u8282\u70b9\u3002\n*   **\u6838\u5fc3\u52a8\u4f5c**\uff1a**\u6838\u67e5\u5bb6\u5ead\u652f\u6301\u5ea6\u4e0e\u652f\u4ed8\u51b3\u7b56\u8005**\n*   **\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9996\u8981\u4efb\u52a1\uff0824\u5c0f\u65f6\u5185\uff09**\uff1a\u4ee5\u5173\u5fc3\u65f6\u95f4\u5b89\u6392\u4e3a\u7531\uff0c\u79c1\u804a\u59d4\u5a49\u6838\u67e5**\u5b66\u4e60\u65f6\u95f4\u6295\u5165\u662f\u5426\u83b7\u5f97\u5bb6\u5ead\u652f\u6301**\uff0c\u4ee5\u53ca**\u8bfe\u7a0b\u8d39\u7528\u7684\u652f\u4ed8\u8005\u662f\u5426\u4e3a\u672c\u4eba\u4e14\u65e0\u7ecf\u6d4e\u538b\u529b**\u3002\u4f8b\u5982\uff1a\u201c\u770b\u60a8\u7ecf\u5e38\u548c\u5927\u5bb6\u94bb\u7814\u5230\u5f88\u665a\uff0c\u5bb6\u4eba\u4f1a\u4e0d\u4f1a\u6709\u610f\u89c1\u5440\uff1f/ \u54b1\u4eec\u8bfe\u7a0b\u540e\u7eed\u8fd8\u6709\u8fdb\u9636\u5185\u5bb9\uff0c\u60a8\u4e2a\u4eba\u89c4\u5212\u4e0a\uff0c\u7ecf\u6d4e\u548c\u65f6\u95f4\u65b9\u9762\u90fdOK\u5417\uff1f\u201d\n    2.  **\u4ef7\u503c\u5f3a\u5316**\uff1a\u5c06\u5176\u6811\u7acb\u4e3a\u201c\u56e2\u961f\u9886\u8896\u201d\u3001\u201c\u5b9e\u8df5\u699c\u6837\u201d\uff0c\u9080\u8bf7\u5176\u5206\u4eab\u7ec4\u961f\u3001\u5ba1\u542c\u7ecf\u9a8c\uff0c\u8d4b\u4e88\u793e\u7fa4\u8363\u8a89\u611f\uff0c\u5de9\u56fa\u7559\u5b58\u3002\n    3.  **\u9700\u6c42\u6316\u6398\u4e0e\u5408\u89c4\u8f6c\u5316**\uff1a\u9488\u5bf9\u5176\u4f84\u513f\u7684\u8bfe\u7a0b\u54a8\u8be2\uff0c**\u5fc5\u987b\u660e\u786e\u544a\u77e5\u9700\u4ee5\u5176\u4f84\u513f\u672c\u4eba\u4e3a\u9500\u552e\u5bf9\u8c61\uff0c\u8fdb\u884c\u72ec\u7acb\u54a8\u8be2\u4e0e\u7b7e\u7ea6**\uff0c\u907f\u514d\u6df7\u5408\u7f34\u8d39\u3002\u53ef\u9080\u8bf7\u5176\u4f84\u513f\u53c2\u52a0\u4f53\u9a8c\u8bfe\u3002\n    4.  **\u8fdb\u9636\u8bfe\u94fa\u57ab**\uff1a\u57fa\u4e8e\u5176\u201c\u52a8\u6001\u6f2b\u201d\u5174\u8da3\uff0c\u53ef\u5206\u4eab\u884c\u4e1a\u6848\u4f8b\uff0c\u4f46**\u91cd\u70b9\u5f15\u5bfc\u5176\u601d\u8003\u4e2a\u4eba\u6280\u80fd\u63d0\u5347\u8def\u5f84**\uff0c\u800c\u975e\u76f4\u63a5\u627f\u8bfa\u5c31\u4e1a\u7ed3\u679c\u3002\n    5.  **\u5e38\u89c4\u670d\u52a1**\uff1a\u7ee7\u7eed\u4fdd\u6301\u73b0\u6709\u7684\u4e13\u4e1a\u3001\u7ec6\u81f4\u7684\u53cd\u9988\u98ce\u683c\uff0c\u6ee1\u8db3\u5176\u6280\u672f\u6307\u5bfc\u9700\u6c42\u3002\n\n{\"core_type\": \"T3 \u5b9e\u8df5\u63a2\u7d22\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\u4f4e\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u6838\u67e5\u5bb6\u5ead\u652f\u6301\u4e0e\u652f\u4ed8\u80fd\u529b\"}";
