        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676936705 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-03 \u81f3 2026-03-17 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u76f8\u4f34\u73ed\u73ed(\u96f7\u743c\u743c) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u5177\u4f53\u4ef7\u683c\u672a\u77e5\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u91d1\u989d\u6216\u7ecf\u6d4e\u538b\u529b\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u591a\u6b21\u56e0\u201c\u5728\u5916\u9762\u5403\u996d\u201d\u3001\u201c\u6709\u4e8b\u201d\u3001\u201c\u8981\u51fa\u95e8\u201d\u7b49\u65e0\u6cd5\u5b8c\u6574\u53c2\u4e0e\u76f4\u64ad\uff0c\u4f9d\u8d56\u56de\u653e\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u5bf9\u8bdd\u56f4\u7ed5\u8bfe\u7a0b\u5b66\u4e60\u3001\u4f5c\u4e1a\u3001\u8bd5\u97f3\u3001\u8bbe\u5907\u8d2d\u4e70\u7b49\u5177\u4f53\u7ec6\u8282\u5c55\u5f00\uff0c\u4e92\u52a8\u9891\u7e41\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u800c\u6765\u3002\u5173\u6ce8\u6280\u80fd\u63d0\u5347\u3001\u8bfe\u7a0b\u7ec6\u8282\u3001\u6280\u672f\u64cd\u4f5c\uff0c\u5bf9\u53d8\u73b0\u5468\u671f\u65e0\u6025\u5207\u8981\u6c42\uff0c\u5bf9\u201c\u5b81\u7f3a\u6bcb\u6ee5\u201d\u7684\u7532\u65b9\u6807\u51c6\u8868\u793a\u8ba4\u540c\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u4ee5\u4e3a\u8981\u76f4\u63a5\u4e0a\u5c97\uff0c\u6015\u803d\u8bef\u4eba\u5bb6\u7684\u4e66\u4e0a\u67b6\u5f71\u54cd\u542c\u4f17\u7684\u542c\u611f[\u53d1\u6296]\u201d > \u201c\u65c1\u767d\u5230\u5e95\u662f\u8981\u60c5\u7eea\u8fd8\u662f\u4e0d\u8981[\u6342\u8138]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b06\u9ad8\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d\u9ad8** \u2014 \u4e3b\u52a8\u54a8\u8be2\u4e13\u4e1a\u5f55\u97f3\u8bbe\u5907\uff08\u6d89\u53ca\u6570\u5343\u5143\u6295\u5165\uff09\uff0c\u5e76\u8ba1\u5212\u53bb\u4e1c\u4eac\u5b9e\u4f53\u5e97\u8bd5\u97f3\uff0c\u672a\u8868\u73b0\u51fa\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u65f6\u95f4\u788e\u7247\u5316\uff0c\u4f46\u80fd\u575a\u6301\u5b66\u4e60\u3001\u5b8c\u6210\u4f5c\u4e1a\u81f3\u6df1\u591c\uff08\u201c\u5f55\u52302\u70b9\u591a\u201d\uff09\uff0c\u5b66\u4e60\u610f\u613f\u5f3a\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\uff0c\u6682\u65e0\u6cd5\u8bc4\u4f30\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u27a1\u4e2d\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u9700\u95f4\u6b47\u6027\u5b89\u629a\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u4e0a\u4f20\u683c\u5f0f\u9519\u8bef\uff09\u80fd\u81ea\u884c\u5c1d\u8bd5\u89e3\u51b3\uff0c\u4f46\u9762\u5bf9\u5ba1\u542c\u53cd\u9988\u65f6\u4f1a\u4ea7\u751f\u660e\u663e\u7126\u8651\u548c\u81ea\u6211\u6000\u7591\uff0c\u9700\u8981\u73ed\u4e3b\u4efb\u7684\u80af\u5b9a\u548c\u758f\u5bfc\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u73ed\u73ed\uff0c\u6211\u662f\u4e0d\u662f\u6ca1\u6551\u4e86\u2026\u2026[\u82e6\u6da9]\u201d > \u201c\u5ba1\u542c\u5f97\u53cd\u9988\uff0c\u8ba9\u6211\u6709\u4e9b\u7126\u8651\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u81ea\u8eab\u80fd\u529b\u7684\u4e0d\u81ea\u4fe1\u548c\u201c\u4e0d\u591f\u597d\u201d\u7684\u6050\u60e7\u3002\u5979\u5bb3\u6015\u201c\u803d\u8bef\u201d\u7532\u65b9\uff0c\u62c5\u5fc3\u81ea\u5df1\u7684\u8868\u73b0\u8fbe\u4e0d\u5230\u4e13\u4e1a\u6807\u51c6\uff08\u201c\u5b81\u7f3a\u6bcb\u6ee5\u201d\uff09\uff0c\u5ba1\u542c\u53cd\u9988\u4f1a\u76f4\u63a5\u5f15\u53d1\u7126\u8651\u3002\u5176\u6838\u5fc3\u75db\u70b9\u662f**\u6e34\u671b\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u548c\u5c0a\u91cd**\uff0c\u800c\u975e\u5355\u7eaf\u53d8\u73b0\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u5c42\u9762\u7684\u80af\u5b9a\u4e0e\u9f13\u52b1**\u3002\u5728\u5979\u56e0\u6280\u672f\u7ec6\u8282\u6216\u53cd\u9988\u800c\u7126\u8651\u65f6\uff0c\u63d0\u4f9b\u5177\u4f53\u7684\u3001\u6709\u4f9d\u636e\u7684\u8ba4\u53ef\uff08\u5982\u201c\u975e\u5e38\u597d\u201d\u3001\u201c\u6211\u770b\u4eba\u5f88\u51c6\u7684\u201d\uff09\uff0c\u5e2e\u52a9\u5979\u5efa\u7acb\u201c\u6211\u80fd\u884c\u201d\u7684\u4e13\u4e1a\u81ea\u4fe1\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 **B\u7c7b** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T3 \u6b7b\u78d5\u5b66\u9738\u578b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u672a\u63d0\u53ca\u5bb6\u5ead\u963b\u529b\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4e2d | \u65f6\u95f4\u5b89\u6392\u51b2\u7a81\u591a\uff0c\u82e5\u8bfe\u7a0b\u8282\u594f\u8fc7\u5feb\u6216\u4f5c\u4e1a\u538b\u529b\u6301\u7eed\u589e\u5927\uff0c\u53ef\u80fd\u5bfc\u81f4\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u79ef\u7d2f\u632b\u8d25\u611f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4e2d\u9ad8** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u5bf9\u8d1f\u9762\u53cd\u9988\uff08\u5982\u5ba1\u542c\u610f\u89c1\uff09\u8fc7\u5ea6\u654f\u611f\uff0c\u6613\u9677\u5165\u201c\u6211\u662f\u4e0d\u662f\u6ca1\u6551\u4e86\u201d\u7684\u81ea\u6211\u5426\u5b9a\u5faa\u73af\u3002\u82e5\u8fde\u7eed\u51e0\u6b21\u8bd5\u97f3\u5931\u8d25\u6216\u6536\u5230\u4e25\u5389\u6279\u8bc4\uff0c\u53ef\u80fd\u56e0\u81ea\u5c0a\u5fc3\u53d7\u632b\u800c\u653e\u5f03\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u5f53\u524d\u5173\u6ce8\u70b9\u5728\u4e8e\u6280\u80fd\u7cbe\u8fdb\u800c\u975e\u5feb\u901f\u53d8\u73b0\uff0c\u77ed\u671f\u5185\u5bf9\u6536\u76ca\u671f\u5f85\u4e0d\u9ad8\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c3-4\u5468\uff08\u5b66\u4e60\u6df1\u5165\u671f\uff09\u53ca\u6bcf\u6b21\u8bd5\u97f3\u53cd\u9988\u540e**\u3002\u5f53\u8bfe\u7a0b\u96be\u5ea6\u63d0\u5347\u3001\u4e13\u4e1a\u8981\u6c42\u53d8\u9ad8\uff0c\u800c\u5979\u4ed8\u51fa\u52aa\u529b\u540e\u4ecd\u672a\u83b7\u5f97\u7406\u60f3\u53cd\u9988\u65f6\uff0c\u662f\u60c5\u7eea\u5d29\u6e83\u7684\u9ad8\u53d1\u671f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4f60\u7684\u8ba4\u771f\u548c\u5bf9\u81ea\u5df1\u9ad8\u8981\u6c42\u7684\u6001\u5ea6\uff0c\u662f\u6210\u4e3a\u4f18\u79c0\u6f14\u64ad\u8005\u6700\u5b9d\u8d35\u7684\u54c1\u8d28\u3002\u6211\u4eec\u7684\u8bfe\u7a0b\u5c31\u662f\u4e3a\u4f60\u8fd9\u6837\u60f3\u628a\u4e8b\u60c5\u505a\u597d\u7684\u4eba\u8bbe\u8ba1\u7684\u3002\u8fc7\u7a0b\u4e2d\u5982\u679c\u9047\u5230\u5361\u70b9\u6216\u8005\u5bf9\u81ea\u5df1\u7684\u8868\u73b0\u6709\u7591\u8651\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4eec\u4e00\u8d77\u62c6\u89e3\u95ee\u9898\u3002\u8bb0\u4f4f\uff0c\u6bcf\u4e00\u6b65\u7684\u2018\u4e0d\u591f\u597d\u2019\uff0c\u90fd\u662f\u901a\u5f80\u2018\u7279\u522b\u597d\u2019\u7684\u5fc5\u7ecf\u4e4b\u8def\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T3\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a\u3010**\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743**\u3011\uff08\u5141\u8bb8\u5176\u5c31\u6280\u672f\u7ec6\u8282\uff0c\u5982\u65c1\u767d\u60c5\u7eea\u5904\u7406\u3001AU\u8f6f\u4ef6\u4f7f\u7528\u7b49\uff0c\u8fdb\u884c\u6df1\u5ea6\u63d0\u95ee\uff09\uff1b\u5e76\u8f7b\u5ea6\u6302\u8f7d\u3010**\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305**\u3011\uff0c\u5728\u5176\u7126\u8651\u65f6\u63d0\u4f9b\u60c5\u7eea\u5b89\u629a\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u5728\u5979\u7126\u8651\u65f6\u53ea\u8bf4\u201c\u653e\u8f7b\u677e\u201d\u4e4b\u7c7b\u7684\u7a7a\u8bdd\uff0c\u5fc5\u987b\u7ed9\u4e88**\u5177\u4f53\u7684\u6280\u672f\u80af\u5b9a\u6216\u89e3\u51b3\u65b9\u6848**\u30022. \u5728\u5979\u94bb\u7814\u6280\u672f\u7ec6\u8282\u65f6\uff0c\u7528\u201c\u522b\u60f3\u592a\u591a\u201d\u6765\u6577\u884d\uff0c\u5e94\u80af\u5b9a\u5176\u94bb\u7814\u7cbe\u795e\u5e76\u5f15\u5bfc\u81f3\u6b63\u786e\u8def\u5f84\u30023. \u8fc7\u5ea6\u753b\u201c\u5feb\u901f\u63a5\u5355\u201d\u7684\u5927\u997c\uff0c\u8fd9\u4e0d\u7b26\u5408\u5979\u5f53\u524d\u8ffd\u6c42\u4e13\u4e1a\u8ba4\u53ef\u7684\u6838\u5fc3\u9700\u6c42\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5979\u5bf9\u4e13\u4e1a\u8bbe\u5907\u5df2\u6709\u5174\u8da3\uff0c\u4e14\u8ffd\u6c42\u7cbe\u8fdb\uff0c\u662f**\u9ad8\u9636\u8bbe\u5907\u8bfe\u3001\u7cbe\u8fdb\u8bad\u7ec3\u8425**\u7684\u4f18\u8d28\u6f5c\u5728\u5ba2\u6237\u3002\u63a8\u4ecb\u65f6\u5e94\u5f3a\u8c03\u8bbe\u5907/\u8bfe\u7a0b\u5bf9**\u63d0\u5347\u4e13\u4e1a\u5ea6\u3001\u83b7\u5f97\u7532\u65b9\u8ba4\u53ef**\u7684\u4ef7\u503c\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u4ee5\u4e3a\u8981\u76f4\u63a5\u4e0a\u5c97\uff0c\u6015\u803d\u8bef\u4eba\u5bb6\u7684\u4e66\u4e0a\u67b6\u5f71\u54cd\u542c\u4f17\u7684\u542c\u611f[\u53d1\u6296]\u201d\n2. > \u201c\u65c1\u767d\u5230\u5e95\u662f\u8981\u60c5\u7eea\u8fd8\u662f\u4e0d\u8981[\u6342\u8138]\u201d\n3. > \u201c\u73ed\u73ed\uff0c\u6211\u662f\u4e0d\u662f\u6ca1\u6551\u4e86\u2026\u2026[\u82e6\u6da9] \u5ba1\u542c\u5f97\u53cd\u9988\uff0c\u8ba9\u6211\u6709\u4e9b\u7126\u8651\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T3\u6b7b\u78d5\u5b66\u9738\u578b**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4e0e\u8ba4\u53ef**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u5728\u5979\u56e0\u4e13\u4e1a\u53cd\u9988\u7126\u8651\u65f6\uff0c\u63d0\u4f9b\u5177\u4f53\u7684\u6280\u672f\u80af\u5b9a\u548c\u89e3\u51b3\u65b9\u6848\uff0c\u7ef4\u62a4\u5176\u4e13\u4e1a\u81ea\u4fe1**\u3002\n\n{\"core_type\": \"T3 \u6b7b\u78d5\u5b66\u9738\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\"}";
