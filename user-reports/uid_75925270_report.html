    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a75925270 (\u6635\u79f0\uff1a\u82b1\u5fc3\u601d) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e - \u6155\u5915\u8bed1(\u5f20\u8c28\u5e06) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u9ad8\u9636\u8bfe\u7a0b |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3** (\u5b69\u5b50\u660f\u8ff7\uff0c\u533b\u7597\u8d39\u7528\u5927\uff0c\u7ecf\u6d4e\u538b\u529b\u6781\u5927) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u76ee\u524d\u5c0f\u6708\u5b50\u671f\u95f4\u53ef\u62bd\u51fa\u65f6\u95f4\uff0c\u540e\u671f\u9700\u7167\u987e\u5b69\u5b50\uff0c\u65f6\u95f4\u5c06\u6781\u5ea6\u7d27\u5f20) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3** (\u672a\u63d0\u53ca\u914d\u5076\u6216\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\uff0c\u4f46\u5b69\u5b50\u60c5\u51b5\u4e3a\u5bb6\u5ead\u6838\u5fc3\u538b\u529b\u6e90) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** (\u7528\u6237\u4e3b\u52a8\u66b4\u9732\u4e86\u6838\u5fc3\u56f0\u5883\u3001\u5b66\u4e60\u610f\u613f\u3001\u6280\u672f\u56f0\u60d1\u4e0e\u65f6\u95f4\u62c5\u5fe7) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u2b07\u4f4e (3-4\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u7eaf\u4e3a\u51e0\u5929\u5185\u63d0\u73b0\u4fdd\u5e95\u800c\u6765(\u4f4e\u6781\u5371)**\u3002\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u5b69\u5b50\u660f\u8ff7\u5e26\u6765\u7684\u5de8\u5927\u7ecf\u6d4e\u538b\u529b\uff0c\u5e0c\u671b\u5229\u7528\u201c\u7a7a\u95f2\u65f6\u95f4\u201d\u5feb\u901f\u53d8\u73b0\u3002\u867d\u6709\u5b66\u4e60\u5174\u8da3\uff08\u60f3\u7ed9\u5b69\u5b50\u8bb2\u6545\u4e8b\uff09\uff0c\u4f46\u751f\u5b58\u7126\u8651\u662f\u538b\u5012\u6027\u7684\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u73b0\u5728\u5c0f\u5b69\u51fa\u610f\u5916\u8fd8\u5728\u660f\u8ff7\uff0c\u5728\u5bb6\u548c\u533b\u9662\u4e24\u8fb9\u8dd1\uff0c\u9700\u8981\u8d39\u7528\u4e5f\u5927\uff0c\u5c31\u60f3\u5229\u7528\u7a7a\u95f2\u65f6\u95f4\u6765\u505a\u505a\u517c\u804c\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e (1-2\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u6781\u4f4e** \u2014 \u5b69\u5b50\u660f\u8ff7\u6cbb\u7597\uff0c\u533b\u7597\u8d39\u7528\u5de8\u5927\uff0c\u660e\u786e\u8868\u793a\u201c\u82b1\u8d39\u4e5f\u633a\u5927\u7684\u201d\u3002\u62a5\u540d\u8d39\u7528\uff083000+\uff09\u5bf9\u5176\u6784\u6210\u663e\u8457\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u6781\u4f4e** \u2014 \u76ee\u524d\u5904\u4e8e\u201c\u5c0f\u6708\u5b50\u201d\u671f\u95f4\uff0c\u662f\u552f\u4e00\u80fd\u8ddf\u4e0a\u7684\u65f6\u95f4\u7a97\u53e3\u3002\u540e\u671f\u9700\u7167\u987e\u660f\u8ff7\u5b69\u5b50\uff0c\u65f6\u95f4\u5c06**\u6781\u901f\u67af\u7aed**\uff0c\u5c5e\u4e8e\u201c24h\u5168\u5929\u5019\u62a4\u5de5\u201d\u7ea7\u522b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u672a\u77e5** \u2014 \u672a\u63d0\u53ca\u914d\u5076\u6216\u5176\u4ed6\u5bb6\u5ead\u6210\u5458\u652f\u6301\uff0c\u5bb6\u5ead\u538b\u529b\u96c6\u4e2d\u4e8e\u7528\u6237\u4e00\u4eba\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b07\u4f4e\u6781\u5371 (1-2\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u9762\u5bf9\u8bd5\u97f3\u5355\u7684\u590d\u6742\u8981\u6c42\uff08\u591a\u89d2\u8272\u3001\u6280\u672f\u53c2\u6570\uff09\u8868\u73b0\u51fa\u660e\u663e\u7684\u754f\u96be\u548c\u6df7\u4e71\u60c5\u7eea\uff08\u201c\u611f\u89c9\u597d\u5bb3\u6015\u201d\u3001\u201c\u6211\u4f1a\u5f88\u4e71\u201d\uff09\u3002\u9700\u8981\u9500\u552e\u53cd\u590d\u5b89\u629a\u548c\u7b80\u5316\u6307\u4ee4\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4f46\u662f\u4eca\u5929\u770b\u5230\u8001\u5e08\u53d1\u7684\u5355\u5b50\u89c9\u5f97\u633a\u96be\u7684\uff0c\u8f6c\u6362\u597d\u51e0\u4e2a\u89d2\u8272\uff0c\u6211\u4f1a\u5f88\u4e71\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 (\u7126\u8651\u4fdd\u969c)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u56e0\u5b69\u5b50\u7a81\u53d1\u91cd\u75c5\u9677\u5165\u751f\u5b58\u5371\u673a\uff0c\u6025\u9700\u7ecf\u6d4e\u6765\u6e90\u4ee5\u4fdd\u969c\u533b\u7597\u548c\u5bb6\u5ead\u57fa\u672c\u5b89\u5168\u3002** \u5b66\u4e60\u914d\u97f3\u662f\u5176\u5728\u7edd\u5883\u4e2d\u8bd5\u56fe\u6293\u4f4f\u7684\u4e00\u6839\u7a3b\u8349\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u9632\u62a4\u76fe\u5f0f\u7684\u5b89\u5168\u611f\u4e0e\u6781\u81f4\u7684\u60c5\u7eea\u6258\u5e95\u3002** \u5979\u9700\u8981\u7684\u4e0d\u662f\u753b\u997c\uff0c\u800c\u662f\u5728\u5de8\u5927\u538b\u529b\u4e0b\u7684\u4e00\u4e1d\u5598\u606f\u548c\u201c\u88ab\u7406\u89e3\u3001\u88ab\u6258\u4f4f\u201d\u7684\u611f\u89c9\u3002\u9500\u552e\u6700\u540e\u9636\u6bb5\u7684\u201c\u9006\u5411\u9884\u671f\u7ba1\u7406\u201d\uff08\u544a\u77e5\u975e\u5feb\u94b1\uff09\u662f\u6b63\u786e\u4e14\u5173\u952e\u7684\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udd34 D\u7c7b** (\u89e6\u53d1T8-D\u7edd\u8def\u8d4c\u5f92\u7ea2\u7ebf\uff0c\u5fc5\u987b\u9694\u79bb) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T8-D \u7edd\u8def\u8d4c\u5f92** (\u590d\u5408\u7edd\u671b\u578b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a**\ud83d\udd34\u5df2\u89e6\u53d1 D \u7c7b\u7194\u65ad\u7ea2\u7ebf\uff01**\n- **\u89e6\u53d1\u56e0\u7531**\uff1a**\u8d44\u6e90\u5e95\u5ea7\u5d29\u584c\u7ea7 (\u5b69\u5b50\u660f\u8ff7+\u533b\u7597\u91cd\u8d1f) + \u52a8\u673a\u7eaf\u5ea6\u6781\u4f4e (\u4e3a\u77ed\u671f\u53d8\u73b0\u89e3\u71c3\u7709\u4e4b\u6025) + \u5fc3\u7406\u5f39\u6027\u6781\u4f4e (\u6613\u754f\u96be)**\u3002\u5b8c\u5168\u7b26\u5408T8-D\u201c\u590d\u5408\u7edd\u671b\u201d\u89e6\u53d1\u6761\u4ef6\u3002\u9500\u552e\u5df2\u8fdb\u884c\u9006\u5411\u9884\u671f\u7ba1\u7406\uff0c\u4f46\u7528\u6237\u4ecd\u8868\u793a\u201c\u8d5a\u94b1\u4e5f\u662f\u8981\u7684\u201d\uff0c\u98ce\u9669\u6781\u9ad8\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u9ad8** | \u82e5\u5bb6\u4eba\u5f97\u77e5\u5176\u5728\u5c0f\u6708\u5b50\u671f\u95f4\u82b1\u94b1\u5b66\u4e60\uff0c\u53ef\u80fd\u5f15\u53d1\u5f3a\u70c8\u53cd\u5bf9\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u6781\u9ad8** | \u5b69\u5b50\u75c5\u60c5\u53d8\u5316\u6216\u9700\u8981\u5168\u5929\u5019\u966a\u62a4\u65f6\uff0c\u5b66\u4e60\u65f6\u95f4\u5f52\u96f6\uff0c\u79ef\u538b\u7684\u8bfe\u7a0b\u548c\u4f5c\u4e1a\u4f1a\u5e26\u6765\u5de8\u5927\u81ea\u8d23\u548c\u632b\u8d25\u611f\uff0c\u76f4\u63a5\u5bfc\u81f4\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u9ad8** | \u6280\u672f\u5b66\u4e60\u7a0d\u6709\u632b\u6298\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u5931\u8d25\u3001\u4f5c\u4e1a\u88ab\u62d2\uff09\uff0c\u7ed3\u5408\u5176\u73b0\u5b9e\u538b\u529b\uff0c\u6781\u6613\u4ea7\u751f\u201c\u6211\u4ec0\u4e48\u90fd\u505a\u4e0d\u597d\u201d\u7684\u5d29\u6e83\u60c5\u7eea\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u4e00\u65e6\u53d1\u73b0\u5b66\u4e60\u65e0\u6cd5\u5728\u77ed\u671f\u5185\uff081-2\u4e2a\u6708\uff09\u5e26\u6765\u53ef\u89c2\u6536\u5165\u4ee5\u7f13\u89e3\u533b\u7597\u8d39\u7528\u538b\u529b\uff0c\u9000\u8d39\u8bc9\u6c42\u5c06\u6781\u5176\u5f3a\u70c8\u4e14\u60c5\u7eea\u5316\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u5b66\u4e60\u96be\u5ea6\u589e\u52a0\uff0c\u73b0\u5b9e\u538b\u529b\u6301\u7eed\uff0c\u82e5\u63a5\u5355\u65e0\u671b\uff0c\u9000\u8d39\u98ce\u9669\u5c06\u96c6\u4e2d\u7206\u53d1\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u82b1\u5fc3\u601d\uff0c\u6211\u77e5\u9053\u4f60\u73b0\u5728\u6700\u9700\u8981\u7684\u662f\u80fd\u5e2e\u4e0a\u5bb6\u91cc\u3002\u5b66\u4e60\u7684\u4e8b\uff0c\u54b1\u4eec\u4e0d\u6025\uff0c\u4f60\u9996\u8981\u4efb\u52a1\u662f\u7167\u987e\u597d\u81ea\u5df1\u548c\u5b9d\u5b9d\u3002\u8bfe\u7a0b\u6c38\u8fdc\u5728\u8fd9\u91cc\uff0c\u7b49\u4f60\u4ec0\u4e48\u65f6\u5019\u5598\u53e3\u6c14\uff0c\u54ea\u6015\u6bcf\u5929\u53ea\u542c10\u5206\u949f\uff0c\u90fd\u662f\u8fdb\u6b65\u3002\u6709\u4efb\u4f55\u56f0\u96be\uff0c\u968f\u65f6\u8ddf\u6211\u8bf4\uff0c\u6211\u4eec\u4e00\u8d77\u60f3\u529e\u6cd5\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\u3011**\u3002**\u7edd\u5bf9\u7981\u6b62**\u63a8\u9ad8\u5ba2\u5355\u786c\u6838\u8bfe\u3002\u5e94\u5f15\u5bfc\u81f3\u4ea7\u54c1\u7ebfC\uff08\u9002\u8001\u4f34\u98de\u8425\uff09\u7684\u8f7b\u91cf\u3001\u9ad8\u60c5\u7eea\u4ef7\u503c\u5185\u5bb9\uff0c\u5982\u201c\u4e3a\u5b69\u5b50\u5f55\u5236\u4e13\u5c5e\u6545\u4e8b\u201d\u7b49\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305 (\u6ee1\u914dC\u6a21\u5757)\u3011** + **\u3010\u964d\u7ef4\u7269\u7406\u4ee3\u529e (\u7279\u79cdA\u6a21\u5757)\u3011**\u3002\u63d0\u4f9b\u5168\u5929\u5019\u60c5\u7eea\u5b89\u629a\uff0c\u5e76\u5bf9\u5176\u6280\u672f\u64cd\u4f5c\u8fdb\u884c\u4e00\u952e\u5f0f\u8fdc\u7a0b\u534f\u52a9\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u5176\u4f7f\u7528\u4efb\u4f55\u201c\u5feb\u901f\u53d8\u73b0\u201d\u3001\u201c\u8f7b\u677e\u63a5\u5355\u201d\u7684\u8bdd\u672f**\uff0c\u9500\u552e\u5df2\u505a\u7684\u9006\u5411\u7ba1\u7406\u5fc5\u987b\u575a\u6301\u3002\n    2. **\u7edd\u4e0d\u5bf9\u5176\u5e03\u7f6e\u9ad8\u96be\u5ea6\u4f5c\u4e1a\u6216\u65bd\u52a0\u4efb\u4f55\u8003\u52e4\u538b\u529b**\u3002\n    3. **\u7981\u6b62\u4ea4\u53c9\u63a8\u9500\u4efb\u4f55\u9ad8\u9636\u8bfe\u7a0b\u6216\u786c\u4ef6\u8bbe\u5907**\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u7528\u6237\u5bb6\u5ead\u5371\u673a\u89e3\u9664\u3001\u5fc3\u6001\u7a33\u5b9a\u524d\uff0c\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u662f\u5f15\u7206\u9000\u8d39\u7684\u5bfc\u706b\u7d22\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u73b0\u5728\u5c0f\u5b69\u51fa\u610f\u5916\u8fd8\u5728\u660f\u8ff7\uff0c\u5728\u5bb6\u548c\u533b\u9662\u4e24\u8fb9\u8dd1\uff0c\u9700\u8981\u8d39\u7528\u4e5f\u5927\uff0c\u5c31\u60f3\u5229\u7528\u7a7a\u95f2\u65f6\u95f4\u6765\u505a\u505a\u517c\u804c\u201d\n2. > \u201c\u5e0c\u671b\u5427\uff0c\u8d5a\u94b1\u4e5f\u662f\u8981\u7684\uff0c\u5c31\u60f3\u53ef\u4ee5\u90fd\u517c\u987e\uff0c\u5979\u73b0\u5728\u82b1\u8d39\u4e5f\u633a\u5927\u7684\uff0c\u53cd\u6b63\u5c31\u662f\u5148\u5b66\u5427\uff0c\u5b66\u4e86\u603b\u6ca1\u574f\u5904\uff0c\u770b\u770b\u80fd\u4e0d\u80fd\u575a\u6301\u4e0b\u6765\u201d\n3. > \u201c\u4f46\u662f\u4eca\u5929\u770b\u5230\u8001\u5e08\u53d1\u7684\u5355\u5b50\u89c9\u5f97\u633a\u96be\u7684\uff0c\u8f6c\u6362\u597d\u51e0\u4e2a\u89d2\u8272\uff0c\u6211\u4f1a\u5f88\u4e71\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T8-D \u7edd\u8def\u8d4c\u5f92\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u9700\u6c42\uff08\u7ecf\u6d4e\u4fdd\u969c\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u542f\u52a8\u5371\u673a\u5904\u7f6e\u534f\u8bae\uff0c\u6267\u884c\u6218\u7565\u6027\u62d2\u552e\u6216\u53d6\u5f97\u6781\u7aef\u660e\u786e\u7684\u201c\u77e5\u60c5\u540c\u610f\u201d\u540e\u65b9\u53ef\u8c28\u614e\u4ea4\u4ed8\uff0c\u5e76\u5339\u914d\u6ee1\u914d\u60c5\u7eea\u6258\u5e95\u4e0e\u964d\u7ef4\u4ee3\u529e\u670d\u52a1\u3011**\u3002\n\n```json\n{\"core_type\": \"T8-D \u7edd\u8def\u8d4c\u5f92\u578b\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\uff08\u4e25\u7981\u786c\u6838\u641e\u94b1\u8425\uff09\", \"age\": \"\u672a\u77e5\uff08\u63a8\u6d4b\u4e3a30-45\u5c81\u5b9d\u5988\uff09\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}\n```";
