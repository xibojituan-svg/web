    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a**\u4e2d\u7b49\u504f\u5de5\u5177\u6027**\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5b66\u4e60\u548c\u5b9e\u64cd\u610f\u613f\uff08\u201c\u6709\u7684\u201d\u3001\u201c\u80af\u5b9a\u662f\u62a5\u7684\u201d\uff09\uff0c\u4e3b\u52a8\u63d0\u95ee\u6280\u672f\u7ec6\u8282\uff08\u4eba\u7269\u4f4d\u7f6e\u3001\u98ce\u683c\u8c03\u6574\uff09\uff0c\u5e76\u5c1d\u8bd5\u5b8c\u6210\u4f5c\u4e1a\u3002\u4f46\u5176\u6838\u5fc3\u9a71\u52a8\u529b\u4e3a**\u526f\u4e1a\u53d8\u73b0**\uff08\u201c\u80fd\u6323\u94b1\u90fd\u611f\u5174\u8da3\u201d\uff09\uff0c\u4e14\u5f53\u524d\u5904\u4e8e\u804c\u4e1a\u7a7a\u7a97\u671f\uff08\u8003\u516c\u672a\u679c\uff09\uff0c\u5b66\u4e60\u52a8\u673a\u4e0e\u89e3\u51b3\u7ecf\u6d4e\u538b\u529b\u3001\u5bfb\u6c42\u804c\u4e1a\u66ff\u4ee3\u8def\u5f84\u9ad8\u5ea6\u7ed1\u5b9a\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4e2d\u7b49**\u3002\u62e5\u6709**\u8f83\u5145\u88d5\u7684\u65f6\u95f4**\uff08\u201c\u65f6\u95f4\u76ee\u524d\u6bd4\u8f83\u5145\u88d5\u201d\uff09\uff0c\u5177\u5907\u4e00\u5b9a\u7684**\u5b66\u4e60\u57fa\u7840\u4e0e\u6267\u884c\u529b**\uff08\u80fd\u5b8c\u6210\u4f5c\u4e1a\u5e76\u4e3b\u52a8\u5c1d\u8bd5\u590d\u6742\u63d0\u793a\u8bcd\uff09\u3002\u4f46**\u7ecf\u6d4e\u72b6\u51b5\u4e0d\u660e**\uff08\u672a\u900f\u9732\u652f\u4ed8\u80fd\u529b\u4e0e\u8d44\u91d1\u6765\u6e90\uff09\uff0c\u4e14**\u793e\u4f1a\u652f\u6301\u7cfb\u7edf\u8584\u5f31**\uff08\u201c\u5f00\u5c55\u65b0\u793e\u4ea4 \u6709\u70b9\u75db\u82e6\u201d\uff09\uff0c\u53ef\u80fd\u5f71\u54cd\u5176\u957f\u671f\u575a\u6301\u4e0e\u6297\u98ce\u9669\u80fd\u529b\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a**\u4e2d\u7b49\u504f\u4f4e**\u3002\u7528\u6237\u8868\u73b0\u51fa**\u4e00\u5b9a\u7684\u632b\u8d25\u8010\u53d7\u5ea6**\uff08\u8003\u516c\u5931\u8d25\u4e00\u5e74\u534a\u4ecd\u575a\u6301\uff09\uff0c\u5e76\u613f\u610f\u5c1d\u8bd5\u65b0\u65b9\u5411\u3002\u4f46\u5b58\u5728**\u660e\u663e\u7684\u6280\u672f\u7126\u8651\u4e0e\u81ea\u6211\u6000\u7591**\uff08\u201c\u6280\u672f\u8fd8\u6ca1\u90a3\u4e48\u597d\u201d\u3001\u201c\u4e2a\u4eba\u6027\u683c\u95ee\u9898\u201d\uff09\uff0c\u5bf9\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u7684\u7ec6\u8282\u504f\u5dee\uff08\u201c\u89c6\u9891\u51fa\u6765\u987a\u5e8f\u5c31\u5f88\u522b\u626d\u201d\uff09\u8f83\u4e3a\u5728\u610f\uff0c\u663e\u793a\u51fa**\u5b8c\u7f8e\u4e3b\u4e49\u503e\u5411\u548c\u8f83\u4f4e\u7684\u5bb9\u9519\u7387**\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**\uff1a**\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u4e8e4\u67088\u65e5\u4e3b\u52a8\u8981\u6c42\u62a5\u73ed\uff08\u201c\u59d0 \u90a3\u4e2a\u73ed\u5e2e\u6211\u62a5\u4e00\u4e0b\u5427\u201d\uff09\uff0c\u5e76\u5b8c\u6210\u4e86\u626b\u7801\u652f\u4ed8\u6d41\u7a0b\uff0c\u9500\u552e\u786e\u8ba4\u52a0\u5165\u6b63\u5f0f\u8425\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u6216\u7b2c\u4e09\u65b9\u51b3\u7b56\u8005\u4fe1\u606f\uff0c\u7528\u6237\u5168\u7a0b\u4ee5\u72ec\u7acb\u4e2a\u4f53\u8eab\u4efd\u6c9f\u901a\u4e0e\u51b3\u7b56\u3002**\u9700\u73ed\u4e3b\u4efb\u540e\u7eed\u8865\u5145\u6838\u67e5**\u3002\n*   **\u6b65\u9aa41-4 \u7efc\u5408\u5224\u5b9a**\uff1a\n    *   **A (\u8ba4\u77e5\u4e0e\u9700\u6c42)**\uff1a\u660e\u786e\u3002\u8ba4\u77e5\u5230AI\u6280\u80fd\u7684\u4ef7\u503c\uff0c\u9700\u6c42\u660e\u786e\u4e3a\u5b66\u4e60\u6280\u80fd\u5e76\u53d8\u73b0\u3002\n    *   **B (\u652f\u4ed8\u80fd\u529b)**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u5df2\u652f\u4ed8\uff0c\u4f46\u652f\u4ed8\u65b9\u5f0f\u3001\u8d44\u91d1\u6765\u6e90\u3001\u662f\u5426\u52a8\u7528\u50a8\u84c4\u6216\u501f\u8d37\u672a\u77e5\u3002\n    *   **C (\u51b3\u7b56\u81ea\u4e3b)**\uff1a\u9ad8\u3002\u51b3\u7b56\u8fc7\u7a0b\u72ec\u7acb\u3001\u5feb\u901f\uff0c\u4ece\u8be2\u95ee\u540d\u989d\u5230\u652f\u4ed8\u4ec5\u95f4\u9694\u7ea615\u5c0f\u65f6\u3002\n    *   **D (\u884c\u52a8\u914d\u5408)**\uff1a\u4e2d\u7b49\u3002\u80fd\u5b8c\u6210\u4f5c\u4e1a\u5e76\u63d0\u95ee\uff0c\u4f46\u5b58\u5728\u6280\u672f\u56f0\u60d1\u548c\u793e\u4ea4\u56de\u907f\u503e\u5411\u3002\n    *   **\u5224\u5b9a\u7ed3\u679c**\uff1a**B\u7c7b\u7528\u6237\uff08\u652f\u4ed8\u7528\u6237\uff09**\uff0c\u4f46B\u8f74\uff08\u652f\u4ed8\u80fd\u529b\uff09\u4fe1\u606f\u4e0d\u5168\uff0c\u9700\u8b66\u60d5\u5176\u652f\u4ed8\u53ef\u80fd\u6e90\u4e8e**\u7126\u8651\u9a71\u52a8\u7684\u975e\u7406\u6027\u6d88\u8d39**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**\uff1a**T5 \u529f\u5229\u63a2\u7d22\u8005**\n    *   **\u6838\u5fc3\u7279\u5f81**\uff1a\u76ee\u6807\u660e\u786e\uff08\u53d8\u73b0\uff09\uff0c\u884c\u52a8\u529b\u5c1a\u53ef\uff0c\u5904\u4e8e\u804c\u4e1a\u8f6c\u578b\u6216\u7a7a\u7a97\u671f\uff0c\u5c06\u8bfe\u7a0b\u89c6\u4e3a\u89e3\u51b3\u73b0\u5b9e\u95ee\u9898\u7684\u201c\u5de5\u5177\u201d\u6216\u201c\u6551\u547d\u7a3b\u8349\u201d\u3002\n    *   **\u543b\u5408\u70b9**\uff1a\u5317\u6f028\u5e74\u540e\u56de\u4e61\u8003\u516c\u672a\u679c\uff0c\u5bfb\u6c42\u526f\u4e1a\u51fa\u8def\uff1b\u76f4\u8a00\u201c\u80fd\u6323\u94b1\u90fd\u611f\u5174\u8da3\u201d\uff1b\u5b66\u4e60\u884c\u4e3a\u56f4\u7ed5\u5177\u4f53\u95ee\u9898\uff08\u751f\u56fe\u7ec6\u8282\uff09\u548c\u53d8\u73b0\u8def\u5f84\u5c55\u5f00\u3002\n    *   **\u504f\u5dee\u70b9**\uff1a\u76f8\u6bd4\u5178\u578bT5\uff0c\u5176\u6280\u672f\u5c1d\u8bd5\u66f4\u6df1\u5165\uff08\u5c1d\u8bd5\u590d\u6742\u63d0\u793a\u8bcd\uff09\uff0c\u663e\u793a\u51fa\u4e00\u5b9a\u7684\u5185\u5728\u5174\u8da3\uff0c\u4f46\u6838\u5fc3\u9a71\u52a8\u529b\u672a\u53d8\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u98ce\u9669\u7b49\u7ea7**\uff1a**\u4e2d**\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u4e0d\u53ca\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u6280\u672f\u7ec6\u8282\u654f\u611f\uff08\u201c\u5206\u955c\u2026\u987a\u5e8f\u522b\u626d\u201d\uff09\uff0c\u5df2\u8868\u73b0\u51fa\u64cd\u4f5c\u7ed3\u679c\u4e0e\u9884\u671f\u4e0d\u7b26\u7684\u56f0\u60d1\u3002\u82e5\u540e\u7eed\u5b66\u4e60\u65e0\u6cd5\u5feb\u901f\u89e3\u51b3\u5176\u5177\u4f53\u95ee\u9898\u6216\u5b9e\u73b0\u5176**\u9ad8\u53d8\u73b0\u9884\u671f**\uff0c\u6781\u6613\u5f15\u53d1\u5931\u671b\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5904\u4e8e\u65e0\u4e3b\u4e1a\u6536\u5165\u7684\u8003\u516c\u7a7a\u7a97\u671f\uff0c\u7ecf\u6d4e\u6765\u6e90\u4e0d\u660e\u3002\u82e5\u540e\u7eed\u8bfe\u7a0b\u6295\u5165\uff08\u65f6\u95f4\u3001\u7cbe\u529b\uff09\u4e0e\u53d8\u73b0\u56de\u62a5\u4e0d\u5339\u914d\uff0c\u53ef\u80fd\u56e0\u7ecf\u6d4e\u538b\u529b\u89e6\u53d1\u9000\u8d39\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u4f4e\u98ce\u9669**\u3002\u5f53\u524d\u65f6\u95f4\u5145\u88d5\u3002\n    4.  **\u5185\u5bb9\u4e0d\u7b26**\uff1a**\u4f4e\u98ce\u9669**\u3002\u5df2\u4f53\u9a8c\u516c\u5f00\u8bfe\u5e76\u4e3b\u52a8\u4ed8\u8d39\uff0c\u5bf9\u5185\u5bb9\u6709\u57fa\u672c\u8ba4\u77e5\u3002\n    5.  **\u670d\u52a1\u4f53\u9a8c**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u9500\u552e\uff08\u201c\u59d0\u201d\uff09\u5df2\u4ea7\u751f\u4f9d\u8d56\u548c\u4fe1\u4efb\uff08\u201c\u4ee5\u540e\u95ee\u9898\u8fd8\u53ef\u4ee5\u95ee\u4f60\u5462\u4e48\u201d\uff09\u3002**\u4ea4\u63a5\u7ed9\u6b63\u5f0f\u73ed\u4e3b\u4efb\u540e\uff0c\u82e5\u670d\u52a1\u8854\u63a5\u4e0d\u7545\u6216\u652f\u6301\u4e0d\u5230\u4f4d\uff0c\u4f1a\u653e\u5927\u5176\u5b64\u7acb\u611f**\uff08\u201c\u5f00\u5c55\u65b0\u793e\u4ea4 \u6709\u70b9\u75db\u82e6\u201d\uff09\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u9700\u6838\u67e5**\u3002\n    7.  **\u7ade\u54c1/\u653f\u7b56**\uff1a**\u4f4e\u98ce\u9669**\u3002\u6682\u65e0\u8ff9\u8c61\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5408\u89c4\u60c5\u51b5**\uff1a**\u57fa\u672c\u5408\u89c4\uff0c\u5b58\u5728\u6a21\u7cca\u5730\u5e26**\u3002\n    *   **\u98ce\u9669\u70b9**\uff1a\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u5546\u5355\u201d\uff0880-300\u5143/\u5206\u949f\uff09\u3001\u201c\u5feb\u901f\u6536\u76ca\u201d\u3001\u201c\u7b2c\u4e8c\u5468\u5373\u5f00\u901a\u63a5\u5355\u6743\u9650\u201d\uff0c\u53ef\u80fd**\u8fc7\u5ea6\u627f\u8bfa\u53d8\u73b0\u901f\u5ea6\u548c\u6536\u76ca**\uff0c\u62ac\u9ad8\u4e86\u7528\u6237\u9884\u671f\u3002\n    *   **\u4f26\u7406\u8b66\u793a**\uff1a\u5229\u7528\u7528\u6237\u201c\u8003\u516c\u5931\u8d25\u201d\u7684\u7126\u8651\u72b6\u6001\u8fdb\u884c\u8f6c\u5316\uff08\u201c\u6323\u7684\u94b1\u771f\u7684\u4e0d\u5982\u5e72\u8fd9\u4e2a\u591a\u201d\uff09\uff0c\u867d\u672a\u8fdd\u89c4\uff0c\u4f46\u5b58\u5728**\u5229\u7528\u8106\u5f31\u5fc3\u7406**\u7684\u5acc\u7591\u3002\n    *   **\u672a\u53d1\u73b0**\u865a\u5047\u5ba3\u4f20\u3001\u6b3a\u8bc8\u4ed8\u6b3e\u7b49\u7ea2\u7ebf\u95ee\u9898\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**\uff1a**\u5339\u914d**\u3002\u7528\u6237\u6709\u660e\u786e\u5b66\u4e60\u610f\u613f\u548c\u5b9e\u64cd\u884c\u4e3a\uff0c\u8bfe\u7a0b\u5185\u5bb9\u4e0e\u5176\u9700\u6c42\uff08AI\u751f\u56fe\u3001\u89c6\u9891\u3001\u53d8\u73b0\uff09\u5951\u5408\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**\u9996\u5468\u91cd\u70b9\u6821\u6b63\u53d8\u73b0\u9884\u671f\uff0c\u5efa\u7acb\u6df1\u5ea6\u4fe1\u4efb**\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9884\u671f\u7ba1\u7406**\uff1a**\u5165\u5b6624\u5c0f\u65f6\u5185**\uff0c\u5fc5\u987b\u8fdb\u884c\u4e00\u5bf9\u4e00\u6c9f\u901a\uff0c\u660e\u786e\u544a\u77e5\uff1a\u2460\u6280\u80fd\u638c\u63e1\u9700\u8981\u7ec3\u4e60\u5468\u671f\uff1b\u2461\u5546\u5355\u63a5\u5355\u6709\u95e8\u69db\u548c\u7ade\u4e89\uff0c\u6536\u76ca\u56e0\u4eba\u800c\u5f02\uff1b\u2462\u5b66\u4e60\u524d\u671f\u4ee5\u6253\u57fa\u7840\u4e3a\u4e3b\uff0c**\u964d\u4f4e\u5176\u201c\u5feb\u901f\u66b4\u5bcc\u201d\u7684\u5e7b\u60f3**\u3002\n    2.  **\u60c5\u611f\u951a\u5b9a**\uff1a\u4e3b\u52a8\u627f\u63a5\u524d\u7aef\u9500\u552e\u5efa\u7acb\u7684\u4fe1\u4efb\u5173\u7cfb\u3002\u5f3a\u8c03\u201c\u59d0\u5df2\u7ecf\u628a\u4f60\u7684\u60c5\u51b5\u548c\u95ee\u9898\u8be6\u7ec6\u4ea4\u63a5\u7ed9\u6211\uff0c\u6211\u4f1a\u6301\u7eed\u8ddf\u8fdb\u201d\uff0c**\u7f13\u89e3\u5176\u201c\u65b0\u793e\u4ea4\u75db\u82e6\u201d**\u3002\n    3.  **\u95ee\u9898\u54cd\u5e94**\uff1a\u5bf9\u5176\u63d0\u51fa\u7684\u6280\u672f\u7ec6\u8282\u95ee\u9898\uff08\u5982\u5206\u955c\u903b\u8f91\u3001\u63d0\u793a\u8bcd\u63a7\u5236\uff09\u7ed9\u4e88**\u53ca\u65f6\u3001\u5177\u4f53\u3001\u9f13\u52b1\u6027\u7684\u53cd\u9988**\uff0c\u907f\u514d\u8ba9\u5176\u9677\u5165\u201c\u81ea\u5df1\u6280\u672f\u5dee\u201d\u7684\u632b\u8d25\u611f\u4e2d\u3002\n    4.  **\u8def\u5f84\u89c4\u5212**\uff1a\u7ed3\u5408\u5176\u201c\u517c\u804c\u201d\u3001\u201c\u65f6\u95f4\u5145\u88d5\u201d\u7684\u7279\u70b9\uff0c\u5e2e\u52a9\u5236\u5b9a**\u6e10\u8fdb\u5f0f\u3001\u53ef\u8fbe\u6210**\u7684\u5b66\u4e60\u4e0e\u63a5\u5355\u5c0f\u76ee\u6807\uff0c\u7528\u9636\u6bb5\u6027\u6b63\u53cd\u9988\u7ef4\u6301\u52a8\u529b\u3002\n    5.  **\u5bb6\u5ead\u77e5\u60c5\u6838\u67e5**\uff1a\u5728\u5efa\u7acb\u4fe1\u4efb\u540e\uff0c\u4ee5\u5173\u6000\u53e3\u543b**\u59d4\u5a49\u4e86\u89e3\u5176\u652f\u4ed8\u6765\u6e90\u53ca\u5bb6\u5ead\u662f\u5426\u77e5\u60c5**\uff0c\u9632\u8303\u6f5c\u5728\u7684\u5bb6\u5ead\u53cd\u5bf9\u98ce\u9669\u3002\n\n{\"core_type\": \"T5 \u529f\u5229\u63a2\u7d22\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u9996\u5468\u91cd\u70b9\u6821\u6b63\u53d8\u73b0\u9884\u671f\"}";
