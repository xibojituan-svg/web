    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u7f3a\u4e4f\u7528\u6237\u5e74\u9f84\u3001\u804c\u4e1a\u3001\u6536\u5165\u3001\u5bb6\u5ead\u51b3\u7b56\u7ed3\u6784\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u7b49\u5173\u952e\u80cc\u666f\u4fe1\u606f\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a\u4e2d\u7b49\u3002\u660e\u786e\u8868\u793a\u201c\u517c\u804c\u53d8\u73b0\u201d\uff08\u56de\u590d\u6570\u5b571\uff09\uff0c\u5bf9\u201c\u540e\u671f\u4ed8\u8d39\u5b66\u4e60\u8bfe\u7a0b\u201d\u4e3b\u52a8\u8be2\u95ee\uff0c\u5bf9\u201c\u5e84\u5468\u8001\u5e08\u201d\u6709\u504f\u597d\u3002\u4f46\u52a8\u673a\u4e2d\u201c\u53d8\u73b0\u201d\u4e0e\u201c\u5b66\u4e60\u201d\u6df7\u5408\uff0c**\u5bf9\u53d8\u73b0\u8def\u5f84\u548c\u6301\u7eed\u6027\uff08\u5982\u201c\u8bfe\u7a0b\u7ed3\u675f\u8fc7\u540e\u5c31\u6ca1\u6709\u6d3e\u5355\u4e86\u554a\u201d\uff09\u5b58\u5728\u7591\u8651**\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a\u672a\u77e5\u3002\u65e0\u804c\u4e1a\u3001\u6536\u5165\u3001\u65f6\u95f4\u6295\u5165\u4fe1\u606f\u3002\u652f\u4ed83980\u5143\u65e0\u963b\u529b\uff0c\u4f46\u65e0\u6cd5\u5224\u65ad\u5176\u7ecf\u6d4e\u627f\u53d7\u529b\u3002\u5bf9\u201c\u7eaf\u5c0f\u767d\u201d\u6709\u6e05\u6670\u8ba4\u77e5\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a\u4e2d\u7b49\u504f\u9ad8\u3002\u6c9f\u901a\u914d\u5408\u5ea6\u9ad8\uff0c\u6309\u65f6\u4e0a\u8bfe\u3001\u63d0\u4ea4\u4f5c\u4e1a\u3001\u79ef\u6781\u4e92\u52a8\u3002\u5bf9\u9500\u552e\u63a8\u8350\u7684\u201c\u4e09\u4e2a\u534a\u6708\u201d\u8bfe\u7a0b\u63a5\u53d7\u8f83\u5feb\uff0c\u4f46**\u5728\u652f\u4ed8\u524d\u5bf9\u9000\u8d39\u653f\u7b56\u3001\u6d3e\u5355\u6301\u7eed\u6027\u8fdb\u884c\u4e86\u5173\u952e\u786e\u8ba4**\uff0c\u663e\u793a\u4e00\u5b9a\u7684\u8c28\u614e\u548c\u7406\u6027\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u5df2\u652f\u4ed83980\u5143\uff083.5\u4e2a\u6708\u5b9e\u6218\u73ed\uff09\uff0c\u652f\u4ed8\u5b8c\u6210\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u4fe1\u606f\u7f3a\u5931\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u5bb6\u5ead\u6216\u4ed6\u4eba\u610f\u89c1\uff0c\u8868\u73b0\u4e3a\u72ec\u7acb\u51b3\u7b56\u3002\n*   **\u6b65\u9aa41-4\u7efc\u5408\u5224\u5b9a**\uff1a\n    *   **A (\u652f\u4ed8\u80fd\u529b)**\uff1a\u652f\u4ed8\u884c\u4e3a\u5b8c\u6210\uff0c\u4f46\u8d44\u6e90\u5e95\u5ea7\u4fe1\u606f\u7f3a\u5931\uff0c\u65e0\u6cd5\u51c6\u786e\u5206\u7ea7\u3002\n    *   **B (\u51b3\u7b56\u81ea\u4e3b\u6027)**\uff1a\u51b3\u7b56\u6d41\u7a0b\u72ec\u7acb\uff0c\u4e3b\u52a8\u8be2\u95ee\u5e76\u786e\u8ba4\u5173\u952e\u6761\u6b3e\u540e\u652f\u4ed8\uff0c\u81ea\u4e3b\u6027\u9ad8\u3002\n    *   **C (\u5b66\u4e60\u914d\u5408\u5ea6)**\uff1a\u9ad8\u3002\u5168\u7a0b\u914d\u5408\u6559\u5b66\u5b89\u6392\uff0c\u54cd\u5e94\u53ca\u65f6\u3002\n    *   **D (\u76ee\u6807\u6e05\u6670\u5ea6)**\uff1a\u4e2d\u7b49\u3002\u76ee\u6807\u4e3a\u517c\u804c\u53d8\u73b0\uff0c\u4f46\u5bf9\u5b66\u4e60\u8def\u5f84\u548c\u7ed3\u679c\u5b58\u5728\u4f9d\u8d56\u5fc3\u7406\uff08\u201c\u6709\u4e13\u4e1a\u8001\u5e08\u5e26\u7684\u8bdd\u4e5f\u66f4\u653e\u5fc3\u201d\uff09\uff0c\u4e14\u5bf9\u53d8\u73b0\u7684\u957f\u671f\u6027\u548c\u7a33\u5b9a\u6027\u6709\u7591\u8651\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n**T5 \u8c28\u614e\u8ddf\u968f\u8005**\u3002\u6838\u5fc3\u7279\u5f81\uff1a\u5bf9\u6743\u5a01\uff08\u8001\u5e08\uff09\u6709\u4e00\u5b9a\u4fe1\u4efb\u548c\u504f\u597d\uff0c\u51b3\u7b56\u524d\u4f1a\u8fdb\u884c\u5173\u952e\u98ce\u9669\u70b9\uff08\u9000\u8d39\u3001\u670d\u52a1\u6301\u7eed\u6027\uff09\u7684\u786e\u8ba4\uff0c\u4f46\u6574\u4f53\u4e0a\u4ecd\u503e\u5411\u4e8e\u8ddf\u968f\u9500\u552e\u5f15\u5bfc\u548c\u793e\u7fa4\u6c1b\u56f4\uff08\u201c\u6211\u8981\u8fdb\u6751\u201d\uff09\u3002\u5b66\u4e60\u884c\u52a8\u529b\u5c1a\u53ef\uff0c\u4f46\u5185\u5728\u76ee\u6807\u611f\u548c\u6297\u98ce\u9669\u80fd\u529b\u5f85\u89c2\u5bdf\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u98ce\u9669\u7b49\u7ea7\uff1a\u4e2d**\n*   **\u6839\u56e0\u6392\u67e5**\uff1a\n    *   **\u9884\u671f\u7ba1\u7406\u504f\u5dee (\u9ad8\u98ce\u9669)**\uff1a\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u7b2c\u4e8c\u5468\u5f00\u901a\u63a5\u5355\u6743\u9650\u201d\u3001\u201c\u957f\u671f\u90fd\u6709\u6d3e\u5355\u201d\u3001\u201c\u8fb9\u5b66\u4e60\u8fb9\u5b9e\u6218\u201d\uff0c\u53ef\u80fd\u5851\u9020\u4e86\u201c\u5feb\u901f\u3001\u7a33\u5b9a\u53d8\u73b0\u201d\u7684**\u8fc7\u9ad8\u9884\u671f**\u3002\u7528\u6237\u5df2\u8868\u73b0\u51fa\u5bf9\u201c\u6d3e\u5355\u6301\u7eed\u6027\u201d\u7684\u62c5\u5fe7\uff0c\u82e5\u540e\u671f\u63a5\u5355\u673a\u4f1a\u6216\u6536\u5165\u672a\u8fbe\u9884\u671f\uff0c\u9000\u8d39\u98ce\u9669\u663e\u8457\u3002\n    *   **\u6548\u679c\u843d\u5dee (\u4e2d\u98ce\u9669)**\uff1a\u7528\u6237\u81ea\u8ba4\u201c\u7eaf\u5c0f\u767d\u201d\uff0c\u82e5\u8bfe\u7a0b\u96be\u5ea6\u6216\u5b9e\u64cd\u95e8\u69db\u8d85\u51fa\u5176\u9002\u5e94\u80fd\u529b\uff0c\u6613\u4ea7\u751f\u632b\u8d25\u611f\u3002\n    *   **\u670d\u52a1\u611f\u77e5\u65ad\u5c42 (\u4f4e\u98ce\u9669)**\uff1a\u9500\u552e\u627f\u8bfa\u201c\u5e08\u59d0\u4e5f\u4f1a\u4e00\u76f4\u5e26\u7740\u4f60\u201d\uff0c\u9700\u5173\u6ce8\u8f6c\u4ea4\u73ed\u4e3b\u4efb\u540e\u7684\u670d\u52a1\u8854\u63a5\u662f\u5426\u5e73\u6ed1\u3002\n    *   **\u8d44\u91d1\u538b\u529b\u3001\u5bb6\u5ead\u53cd\u5bf9\u3001\u7ade\u54c1\u6bd4\u8f83\u3001\u4f26\u7406\u95ee\u9898**\uff1a\u5f53\u524d\u4fe1\u606f\u672a\u89c1\u660e\u663e\u4fe1\u53f7\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u57fa\u672c\u5408\u89c4**\uff1a\u9500\u552e\u6d41\u7a0b\u5b8c\u6574\uff0c\u7528\u6237\u4e3b\u52a8\u8be2\u95ee\u540e\u544a\u77e5\u4ef7\u683c\u4e0e\u8bfe\u7a0b\u5dee\u5f02\u3002\n*   **\u98ce\u9669\u70b9**\uff1a\n    1.  **\u8fc7\u5ea6\u627f\u8bfa\u98ce\u9669**\uff1a\u9500\u552e\u5173\u4e8e\u201c\u8d44\u6e90\u201d\u3001\u201c\u6d3e\u5355\u201d\u3001\u201c\u6536\u76ca\u201d\u7684\u63cf\u8ff0\uff08\u5982\u201c\u5355\u6761\u89c6\u9891\u6536\u76ca\u8fbe800-1500\u5143\u201d\uff09\u5b58\u5728**\u5938\u5927\u6216\u6a21\u7cca\u5316\u503e\u5411**\uff0c\u53ef\u80fd\u6784\u6210\u4e8b\u5b9e\u4e0a\u7684\u8fc7\u5ea6\u627f\u8bfa\u3002\n    2.  **\u9000\u8d39\u653f\u7b56\u544a\u77e5**\uff1a\u4ec5\u5728\u7528\u6237\u4e3b\u52a8\u8be2\u95ee\uff08\u201c\u5e84\u5468\u8001\u5e08\u8bf4\u540e\u9762\u5982\u679c\u89c9\u5f97\u4e0d\u9002\u5408\u4e5f\u53ef\u4ee5\u6309\u6bd4\u4f8b\u9000\u8d39\u561b\u201d\uff09\u540e\u624d\u4e88\u4ee5\u80af\u5b9a\u56de\u590d\uff0c\u4e14\u672a\u4e3b\u52a8\u3001\u6e05\u6670\u8bf4\u660e\u9000\u8d39\u7684\u5177\u4f53\u6761\u6b3e\u3001\u6bd4\u4f8b\u548c\u6761\u4ef6\uff0c**\u5b58\u5728\u544a\u77e5\u4e0d\u5145\u5206\u98ce\u9669**\u3002\n    3.  **\u5236\u9020\u7a00\u7f3a\u6027**\uff1a\u201c\u4eca\u665a\u5c31\u4e09\u4e2a\u540d\u989d\u63d0\u524d\u5b89\u6392\u201d\u5c5e\u4e8e\u5e38\u89c1\u4fc3\u5355\u8bdd\u672f\uff0c\u9700\u6ce8\u610f\u5c3a\u5ea6\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**\uff1a**\u5339\u914d**\u3002\u7528\u6237\u9009\u62e9\u4e86\u66f4\u5168\u9762\u76843.5\u4e2a\u6708\u5b9e\u6218\u73ed\uff0c\u4e0e\u5176\u201c\u7eaf\u5c0f\u767d\u201d\u60f3\u7cfb\u7edf\u5b66\u4e60\u3001\u83b7\u53d6\u8d44\u6e90\u7684\u8bc9\u6c42\u8868\u9762\u5339\u914d\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**\u9996\u5468\u91cd\u70b9\u6821\u6b63\u53d8\u73b0\u9884\u671f\u4e0e\u5b66\u4e60\u8def\u5f84**\u3002\n*   **\u8be6\u7ec6\u884c\u52a8\u5efa\u8bae**\uff1a\n    1.  **\u9884\u671f\u7ba1\u7406**\uff1a\u5728\u670d\u52a1\u542f\u52a8\u521d\u671f\uff0c\u5fc5\u987b\u6e05\u6670\u3001\u4e66\u9762\u5316\u6c9f\u901a\uff1a\u2460 \u63a5\u5355\u6743\u9650\u5f00\u901a\u4e0d\u7b49\u4e8e\u7acb\u5373\u6709\u7a33\u5b9a\u6536\u5165\uff1b\u2461 \u6536\u5165\u6c34\u5e73\u53d6\u51b3\u4e8e\u4e2a\u4eba\u6280\u80fd\u638c\u63e1\u7a0b\u5ea6\u3001\u6295\u5165\u65f6\u95f4\u53ca\u5e02\u573a\u56e0\u7d20\uff1b\u2462 \u201c\u6d3e\u5355\u201d\u662f\u673a\u4f1a\u63d0\u4f9b\uff0c\u975e\u4fdd\u8bc1\u6027\u6536\u5165\u3002\n    2.  **\u5b66\u4e60\u652f\u6301**\uff1a\u9274\u4e8e\u5176\u201c\u7eaf\u5c0f\u767d\u201d\u8eab\u4efd\uff0c\u9996\u5468\u9700\u52a0\u5f3a\u4e00\u5bf9\u4e00\u8f85\u5bfc\uff0c\u53ca\u65f6\u53cd\u9988\uff0c\u5efa\u7acb\u5b66\u4e60\u4fe1\u5fc3\uff0c\u907f\u514d\u65e9\u671f\u632b\u8d25\u3002\n    3.  **\u98ce\u9669\u76d1\u63a7**\uff1a\u5bc6\u5207\u5173\u6ce8\u5176\u5b66\u4e60\u8fdb\u5ea6\u4e0e\u7b2c\u4e00\u6b21\u63a5\u89e6\u201c\u63a5\u5355\u5e7f\u573a\u201d\u6216\u5546\u5355\u4efb\u52a1\u65f6\u7684\u53cd\u9988\uff0c\u53ca\u65f6\u758f\u5bfc\u53ef\u80fd\u4ea7\u751f\u7684\u5fc3\u7406\u843d\u5dee\u3002\n    4.  **\u5173\u7cfb\u8854\u63a5**\uff1a\u73ed\u4e3b\u4efb\u5e94\u4e3b\u52a8\u627f\u63a5\u9500\u552e\u201c\u5e08\u59d0\u201d\u7684\u89d2\u8272\u627f\u8bfa\uff0c\u786e\u4fdd\u670d\u52a1\u8fde\u8d2f\u6027\uff0c\u907f\u514d\u7528\u6237\u4ea7\u751f\u88ab\u201c\u8f6c\u624b\u201d\u7684\u5931\u843d\u611f\u3002\n\n{\"core_type\": \"T5 \u8c28\u614e\u8ddf\u968f\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u9996\u5468\u91cd\u70b9\u6821\u6b63\u53d8\u73b0\u9884\u671f\u4e0e\u5b66\u4e60\u8def\u5f84\"}";
