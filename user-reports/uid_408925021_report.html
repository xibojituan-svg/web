        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 408925021 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u4e3b\u64ad\u516d\u6708\u6668\u516e(\u9648\u5c0f\u4e91) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u5f55\u64ad\u8bfe\u7a0b (\u4ef7\u683c\uff1a2380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u5145\u88d5 (\u4f53\u5236\u5185\u5de5\u4f5c\uff0c\u6536\u5165\u7a33\u5b9a) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1 (\u4f53\u5236\u5185\u9886\u5bfc\u5e72\u90e8\uff0c\u5de5\u4f5c\u5fd9\uff0c\u5229\u7528\u4e0b\u73ed\u540e\u65f6\u95f4) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u7f3a\u5931 (\u672a\u63d0\u53ca\u5bb6\u5ead\u6001\u5ea6\uff0c\u9700\u8b66\u60d5) |\n| **\u4fe1\u606f\u539a\u5ea6** | \u9971\u6ee1 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u517c\u804c\u53d8\u73b0\u662f\u201c\u987a\u4fbf\u201d\u7684\u9526\u4e0a\u6dfb\u82b1\uff0c\u5bf9\u4e13\u4e1a\u7cbe\u8fdb\u6709\u660e\u786e\u8bc9\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u662f\u5728\u4f53\u5236\u5185\u5de5\u4f5c\u7684\u4e00\u540d\u9886\u5bfc\u5e72\u90e8...\u60f3\u7740\u9664\u4e86\u5de5\u4f5c\uff0c\u4e5f\u5e94\u8be5\u57f9\u517b\u4e00\u70b9\u81ea\u5df1\u7684\u5174\u8da3\u7231\u597d\uff0c\u5982\u679c\u80fd\u987a\u4fbf\u517c\u804c\u6323\u70b9\u96f6\u82b1\u94b1\uff0c\u4e5f\u662f\u4e0d\u9519\u7684\u4e8b\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b06\u9ad8\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a\u9ad8 \u2014 \u4f53\u5236\u5185\u7a33\u5b9a\u5de5\u4f5c\uff0c2380\u5143\u8bfe\u7a0b\u8d39\u7528\u65e0\u538b\u529b\uff0c\u975e\u501f\u8d37\u6216\u5f71\u54cd\u751f\u6d3b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a\u4e2d \u2014 \u5de5\u4f5c\u7e41\u5fd9\uff0c\u4f46\u80fd\u5229\u7528\u788e\u7247\u65f6\u95f4\uff08\u665a\u4e0a\u3001\u5348\u4f11\uff09\u5b8c\u6210\u4f5c\u4e1a\u548c\u76f4\u64ad\u5b66\u4e60\uff0c\u6267\u884c\u529b\u5f3a\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a\u672a\u77e5 \u2014 **\u5173\u952e\u4fe1\u606f\u7f3a\u5931**\u3002\u672a\u63d0\u53ca\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\uff0c\u6784\u6210\u6f5c\u5728\u98ce\u9669\u70b9\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9047\u5230\u56f0\u96be\uff08\u5982\u53e3\u6c34\u97f3\u3001\u6587\u672c\u4e0d\u5408\u9002\uff09\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u5fc3\u6001\u79ef\u6781\uff0c\u80fd\u63a5\u53d7\u201c\u61f5\u61c2\u201d\u7684\u5b66\u4e60\u9636\u6bb5\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5230\u76ee\u524d\u4e3a\u6b62\uff0c\u8fd8\u6ca1\u6709\u653e\u5f03\u7684\u60f3\u6cd5\uff0c\u5b66\u5230\u7684\u4e1c\u897f\u61f5\u61f5\u61c2\u61c2\uff0c\u50cf\u662f\u61c2\u4e86\u4f1a\u4e86\uff0c\u53ef\u53c8\u7528\u4e0d\u5230\u81ea\u5df1\u7684\u58f0\u97f3\u4e0a...\u6211\u8fd8\u662f\u9700\u8981\u597d\u597d\u5b66\u4e60\u5982\u4f55\u63a7\u5236\u548c\u4fee\u9970\u81ea\u5df1\u7684\u58f0\u97f3\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5728\u4f53\u5236\u5185\u4e25\u8083\u3001\u56fa\u5b9a\u7684\u5de5\u4f5c\u73af\u5883\u4e2d\uff0c\u5bfb\u6c42\u4e2a\u4eba\u4ef7\u503c\u7684\u65b0\u8868\u8fbe\u548c\u8eab\u4efd\u8ba4\u540c\u7684\u5ef6\u4f38\u3002\u5e0c\u671b\u901a\u8fc7\u201c\u88ab\u5f88\u591a\u4eba\u542c\u201d\u83b7\u5f97\u7cbe\u795e\u6ee1\u8db3\u548c\u5916\u754c\u8ba4\u53ef\uff0c\u800c\u4e0d\u4ec5\u4ec5\u662f\u91d1\u94b1\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u5708\u5c42\u8eab\u4efd\u7684\u8d4b\u4e88**\u3002\u8ba9\u4ed6\u611f\u53d7\u5230\u4ece\u201c\u4f53\u5236\u5185\u9886\u5bfc\u201d\u5230\u201c\u6709\u58f0\u6f14\u64ad\u8005\u201d\u7684\u8de8\u754c\u6210\u529f\uff0c\u83b7\u5f97\u65b0\u7684\u5c0a\u91cd\u4e0e\u6210\u5c31\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \u2b50A \u7c7b (\u9ad8\u52a8\u673a\u3001\u9ad8\u8d44\u6e90\u3001\u9ad8\u5f39\u6027\uff0c\u4f18\u8d28\u7528\u6237) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T1 \u5708\u517b\u9886\u8896\u578b** (\u4f53\u5236\u5185\u9886\u5bfc\u8eab\u4efd\uff0c\u6709\u7ec4\u7ec7\u548c\u7ba1\u7406\u7ecf\u9a8c\uff0c\u5bfb\u6c42\u65b0\u9886\u57df\u7684\u201c\u51fa\u98ce\u5934\u201d\u548c\u8bdd\u8bed\u6743) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4e2d | **\u4fe1\u606f\u7f3a\u5931\uff0c\u9700\u6838\u67e5**\u3002\u82e5\u5bb6\u4eba\u4e0d\u77e5\u60c5\u6216\u53cd\u5bf9\u5176\u201c\u4e0d\u52a1\u6b63\u4e1a\u201d\uff0c\u53ef\u80fd\u6210\u4e3a\u9000\u8d39\u5bfc\u706b\u7d22\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u5de5\u4f5c\u7e41\u5fd9\u53ef\u80fd\u5bfc\u81f4\u5b66\u4e60\u8fdb\u5ea6\u6ede\u540e\uff0c\u4f46\u7528\u6237\u81ea\u5f8b\u6027\u5f3a\uff0c\u98ce\u9669\u53ef\u63a7\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u6b63\u89c6\u5b66\u4e60\u521d\u671f\u7684\u56f0\u96be\uff0c\u4e3b\u52a8\u6c42\u89e3\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u867d\u4e0d\u6025\u4e8e\u53d8\u73b0\uff0c\u4f46\u82e5\u957f\u671f\uff08\u59823-6\u4e2a\u6708\uff09\u63a5\u4e0d\u5230\u5355\u6216\u53cd\u9988\u4e0d\u4f73\uff0c\u53ef\u80fd\u8d28\u7591\u8bfe\u7a0b\u4ef7\u503c\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe\u540e\u7b2c4-8\u5468\uff08\u201c\u6b7b\u4ea1\u8c37\u201d\u9636\u6bb5\uff09\u3002\u5f53\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u7ec3\u4e60\u8fdb\u5165\u5e73\u53f0\u671f\uff0c\u82e5\u7f3a\u4e4f\u5373\u65f6\u6b63\u53cd\u9988\uff08\u5982\u8bd5\u97f3\u65e0\u679c\u3001\u4f5c\u4e1a\u5f97\u4e0d\u5230\u9ad8\u7ea7\u522b\u8ba4\u53ef\uff09\uff0c\u53ef\u80fd\u4ea7\u751f\u4ef7\u503c\u6000\u7591\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cX\u5c40/\u9886\u5bfc\uff08\u53ef\u5c0a\u79f0\uff09\uff0c\u6b22\u8fce\u52a0\u5165\uff01\u4ee5\u60a8\u7684\u5de5\u4f5c\u7ecf\u9a8c\u548c\u5b66\u4e60\u80fd\u529b\uff0c\u5728\u8fd9\u4e2a\u65b0\u9886\u57df\u5f88\u5feb\u5c31\u80fd\u6210\u4e3a\u2018\u73ed\u957f\u2019\u7ea7\u7684\u4eba\u7269\u3002\u54b1\u4eec\u8fd9\u6709\u4e0d\u5c11\u50cf\u60a8\u4e00\u6837\u5bfb\u6c42\u7a81\u7834\u7684\u4f19\u4f34\uff0c\u671f\u5f85\u60a8\u4e0d\u5149\u81ea\u5df1\u5b66\u6709\u6240\u6210\uff0c\u4e5f\u80fd\u5e26\u7740\u5927\u5bb6\u4e00\u8d77\u8fdb\u6b65\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf**\u3011\u3002\u91cd\u70b9\u4e0d\u5728\u4e8e\u57fa\u7840\u6559\u5b66\uff0c\u800c\u5728\u4e8e\u63d0\u4f9b\u201c\u5185\u90e8\u79c1\u8463\u4f1a\u201d\u3001\u73ed\u59d4\u4efb\u547d\u3001\u4f18\u5148\u5165\u9a7b\u64ad\u5ba2\u540d\u5355\u7b49\u8eab\u4efd\u6743\u76ca\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u5305**\u3011\u3002\u63d0\u4f9b1v1\u4e13\u5bb6\u7b54\u7591\u548c\u771f\u5b9e\u6838\u5fc3\u6d3e\u5355\u673a\u4f1a\uff0c\u6ee1\u8db3\u5176\u7cbe\u8fdb\u6280\u672f\u7684\u9700\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5c06\u5176\u5f53\u4f5c\u666e\u901a\u5b66\u5458\u8fdb\u884c\u201c\u4fdd\u59c6\u5f0f\u201d\u7ba1\u7406\u6216\u8fc7\u5ea6\u5b89\u629a\u3002\u907f\u514d\u4f7f\u7528\u201c\u5b9d\u5b9d\u201d\u3001\u201c\u5b9d\u5b50\u201d\u7b49\u79f0\u547c\uff0c\u4fdd\u6301\u4e13\u4e1a\u3001\u5c0a\u91cd\u7684\u6c9f\u901a\u59ff\u6001\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb\u9ad8\u9636\u8bfe\u7a0b\u6216\u79c1\u8463\u4f1a\u4f1a\u5458**\u3002\u4ed6\u7684\u652f\u4ed8\u80fd\u529b\u548c\u5bf9\u201c\u8eab\u4efd\u201d\u7684\u8ffd\u6c42\uff0c\u4f7f\u5176\u6210\u4e3a\u9ad8\u5ba2\u5355\u4ef7\u4ea7\u54c1\u7684\u7406\u60f3\u76ee\u6807\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u662f\u5728\u4f53\u5236\u5185\u5de5\u4f5c\u7684\u4e00\u540d\u9886\u5bfc\u5e72\u90e8\uff0c\u5e73\u65f6\u5de5\u4f5c\u6bd4\u8f83\u5fd9\uff0c\u4eba\u4e5f\u6bd4\u8f83\u4e25\u8083\uff0c\u6211\u4eca\u5e7441\u5c81\u4e86\uff0c\u60f3\u7740\u9664\u4e86\u5de5\u4f5c\uff0c\u4e5f\u5e94\u8be5\u57f9\u517b\u4e00\u70b9\u81ea\u5df1\u7684\u5174\u8da3\u7231\u597d\uff0c\u5982\u679c\u80fd\u987a\u4fbf\u517c\u804c\u6323\u70b9\u96f6\u82b1\u94b1\uff0c\u4e5f\u662f\u4e0d\u9519\u7684\u4e8b\u201d\n2. > \u201c\u5e73\u65f6\u603b\u6709\u4eba\u8bf4\u6211\u58f0\u97f3\u597d\u542c\uff0c\u6211\u4e5f\u4e0d\u77e5\u9053\u597d\u542c\u4e0d\u597d\u542c\uff0c\u5c31\u60f3\u7740\u8bd5\u4e00\u4e0b\u770b\u770b\uff0c\u5982\u679c\u80fd\u6709\u5f88\u591a\u4eba\u613f\u610f\u542c\u6211\u7684\u58f0\u97f3\uff0c\u6211\u60f3\u4e5f\u662f\u4e00\u4ef6\u5f88\u5e78\u798f\u7684\u4e8b\u513f\u5427\uff1f\u201d\n3. > \u201c\u76ee\u524d\u4f30\u8ba1\u53ea\u80fd\u5b66\u4e60\u753b\u672c\u548c\u5ba1\u542c\uff0c\u4f46\u662f\u6211\u7684\u7ec8\u6781\u76ee\u6807\u80af\u5b9a\u662f\u5f55\u4e66\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T1 \u5708\u517b\u9886\u8896\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u8de8\u754c\u65b0\u9886\u57df\u7684\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u8d4b\u4e88\u5176\u73ed\u59d4/\u9886\u8896\u8eab\u4efd\uff0c\u5e76\u63d0\u4f9b\u786c\u6838\u6280\u672f\u6307\u5bfc\u4e0e\u9ad8\u9636\u5708\u5c42\u8d44\u6e90\u3011**\u3002\n\n```json\n{\"core_type\": \"T1 \u5708\u517b\u9886\u8896\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u5708\u5c42\u5408\u4f19\u4eba\u7ebf+\u786c\u6838\u5b9e\u5e72\u5305\"}\n```";
