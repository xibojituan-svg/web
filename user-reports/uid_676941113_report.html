    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n- **\u52a8\u673a\u7eaf\u5ea6**\uff1a\u4e2d\u7b49\u504f\u5de5\u5177\u6027\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u201c\u60f3\u5f00\u542f\u53d8\u73b0\u517c\u804c\u6216\u5168\u804c\u201d\uff0c\u5bf9\u201c\u753b\u672c\u201d\u3001\u201c\u5f55\u4e66\u201d\u7b49\u5177\u4f53\u5de5\u79cd\u548c\u63a5\u5355\u6d41\u7a0b\u53cd\u590d\u8be2\u95ee\uff0c\u5173\u6ce8\u201c\u89c4\u5b9a\u591a\u5c11\u65f6\u95f4\u5b8c\u6210\u201d\u3001\u201c\u662f\u5426\u8981\u62a5\u540d\u540e\u63a5\u5355\u201d\uff0c\u6838\u5fc3\u9a71\u52a8\u529b\u662f**\u5feb\u901f\u83b7\u5f97\u517c\u804c\u6536\u5165**\u3002\u5bf9\u5b66\u4e60\u672c\u8eab\uff08\u5982\u6280\u5de7\u3001\u620f\u611f\uff09\u7684\u4e3b\u52a8\u63a2\u8ba8\u8f83\u5c11\u3002\n- **\u8d44\u6e90\u5e95\u5ea7**\uff1a\u8f83\u4f4e\u3002\u7528\u6237\u81ea\u8ff0\u201c\u6bcf\u5929\u96f6\u788e\u53ef\u4ee5\u7528\u4e8e\u5b66\u4e60\u548c\u517c\u804c\u7684\u65f6\u95f4\uff1a\uff1f1\u5c0f\u65f6\u201d\uff0c\u4e14\u5de5\u4f5c\u6027\u8d28\u9700\u201c\u4e0a\u591c\u73ed\u201d\uff0c\u65f6\u95f4\u788e\u7247\u5316\u4e14\u4e0d\u56fa\u5b9a\u3002\u8bbe\u5907\u65b9\u9762\u53cd\u590d\u786e\u8ba4\u201c\u53ea\u6709\u624b\u673a\u5c31\u53ef\u4ee5\u4e86\u5427\u201d\u3001\u201c\u4e0d\u9700\u8981\u4e70\u4ec0\u4e48\u5176\u4ed6\u88c5\u5907\u201d\uff0c\u663e\u793a\u51fa\u5bf9\u989d\u5916\u6295\u5165\uff08\u65f6\u95f4\u3001\u91d1\u94b1\u3001\u8bbe\u5907\uff09\u7684**\u9ad8\u5ea6\u654f\u611f\u548c\u8d44\u6e90\u9650\u5236**\u3002\n- **\u5fc3\u7406\u5f39\u6027**\uff1a\u4e2d\u7b49\u504f\u4f4e\u3002\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u8c28\u614e\u548c\u98ce\u9669\u89c4\u907f\uff08\u201c\u4e0d\u8981\u78b0\u5230\u9a97\u5b50\u5c31\u884c\u201d\u3001\u201c\u4e0d\u8981\u540e\u671f\u6709\u592a\u591a\u7684\u6536\u8d39\u9879\u76ee\u201d\uff09\uff0c\u5bf9\u627f\u8bfa\u7684\u5151\u73b0\uff08\u5982\u659c\u6760\u5de5\u4f5c\uff09\u4f1a\u4e3b\u52a8\u8ddf\u8fdb\u786e\u8ba4\u3002\u9762\u5bf9\u5b66\u4e60\u6311\u6218\uff08\u5982\u666e\u901a\u8bdd\u7ec3\u4e60\uff09\u65f6\uff0c\u6709\u8f7b\u5fae\u7684\u754f\u96be\u60c5\u7eea\uff08\u201c\u8fd9\u4e2a\u592a\u65b9\u8a00\u4e86\u5427\u201d\u3001\u201c\u6211\u8bf4\u4e0d\u6765\u201d\uff09\uff0c\u4f46\u672a\u76f4\u63a5\u653e\u5f03\uff0c\u4ecd\u5728\u53c2\u4e0e\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n- **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u5df2\u652f\u4ed83980\u5143\u8bfe\u7a0b\u8d39\u7528\uff0c\u652f\u4ed8\u884c\u4e3a\u53d1\u751f\u5728\u8bad\u7ec3\u8425\u672b\u671f\uff0c\u7ecf\u8fc7\u591a\u8f6e\u4e92\u52a8\u548c\u7b54\u7591\u540e\u3002\n- **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u804a\u5929\u8bb0\u5f55\u4e2d\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u6210\u5458\u6216\u9700\u4e0e\u4ed6\u4eba\u5546\u8bae\uff0c\u51b3\u7b56\u8868\u73b0\u4e3a\u4e2a\u4eba\u72ec\u7acb\u884c\u4e3a\u3002**\u53ef\u5224\u5b9a\u4e3a\u4e2a\u4eba\u51b3\u7b56**\u3002\n- **\u6b65\u9aa4A\uff08\u52a8\u673a-\u8d44\u6e90\uff09**\uff1a\u52a8\u673a\u660e\u786e\uff08\u53d8\u73b0\uff09\uff0c\u4f46\u8d44\u6e90\uff08\u65f6\u95f4\u3001\u8bbe\u5907\uff09\u57fa\u7840\u8584\u5f31\u3002\u5c5e\u4e8e **\u201c\u9ad8\u52a8\u673a-\u4f4e\u8d44\u6e90\u201d** \u8c61\u9650\u3002\n- **\u6b65\u9aa4B\uff08\u627f\u8bfa\u5ea6\uff09**\uff1a\u7528\u6237\u5b8c\u6210\u4e86\u8bad\u7ec3\u8425\u6240\u6709\u4f5c\u4e1a\u548c\u8003\u6838\uff0c\u5e76\u6700\u7ec8\u4ed8\u8d39\uff0c\u884c\u52a8\u4e0a\u8868\u73b0\u51fa\u4e00\u5b9a\u627f\u8bfa\u3002\u4f46\u5bf9\u540e\u7eed\u5b66\u4e60\u7684\u6301\u7eed\u6027\uff08\u5982\u6253\u5361\u8981\u6c42\u3001\u65f6\u95f4\u5b89\u6392\uff09\u5b58\u5728\u7591\u8651\u3002\n- **\u6b65\u9aa4C\uff08\u8ba4\u77e5\u5339\u914d\uff09**\uff1a\u5b58\u5728**\u663e\u8457\u504f\u5dee**\u3002\u7528\u6237\u8ba4\u77e5\u805a\u7126\u4e8e\u201c\u63a5\u5355\u8d5a\u94b1\u201d\uff08\u753b\u672c\u3001\u5f55\u4e66\uff09\uff0c\u5bf9\u6210\u4e3a\u201c\u4e13\u4e1a\u6f14\u64ad\u8005\u201d\u6240\u9700\u7684\u957f\u5468\u671f\u6280\u80fd\u79ef\u7d2f\u3001\u7ec3\u4e60\u6295\u5165\u8ba4\u77e5\u4e0d\u8db3\u3002\u9500\u552e\u524d\u671f\u5f3a\u8c03\u201c\u53d8\u73b0\u6e20\u9053\u201d\uff0c\u540e\u671f\u8f6c\u4e3a\u5f3a\u8c03\u201c\u5b66\u4e60\u201d\u548c\u201c\u4e0d\u8981\u6025\u4e8e\u6c42\u6210\u201d\uff0c\u4f46\u7528\u6237\u6838\u5fc3\u5173\u5207\u70b9\u672a\u53d8\u3002\n- **\u6b65\u9aa4D\uff08\u51b3\u7b56\u6a21\u5f0f\uff09**\uff1a\u51b3\u7b56\u504f\u7406\u6027\u3001\u8c28\u614e\u3002\u53cd\u590d\u8be2\u95ee\u5b9e\u64cd\u7ec6\u8282\uff08\u8bbe\u5907\u3001\u65f6\u95f4\u3001\u63a5\u5355\u6761\u4ef6\uff09\u3001\u786e\u8ba4\u514d\u8d39\u548c\u6536\u8d39\u8fb9\u754c\uff0c\u5728\u5f97\u5230\u591a\u9879\u4fdd\u8bc1\uff08\u624b\u673a\u5373\u53ef\u3001\u65e0\u989d\u5916\u6536\u8d39\uff09\u540e\u624d\u5b8c\u6210\u652f\u4ed8\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n**T7 \u52a1\u5b9e\u53d8\u73b0\u8005**\u3002\n- **\u6838\u5fc3\u7279\u5f81**\uff1a\u4ee5\u660e\u786e\u7684\u517c\u804c/\u526f\u4e1a\u6536\u5165\u4e3a\u76ee\u6807\uff0c\u5bf9\u6295\u5165\u4ea7\u51fa\u6bd4\u654f\u611f\uff0c\u5173\u6ce8\u5b66\u4e60\u5e26\u6765\u7684\u76f4\u63a5\u53d8\u73b0\u53ef\u80fd\u6027\u548c\u8def\u5f84\u3002\u5b66\u4e60\u662f\u624b\u6bb5\uff0c\u53d8\u73b0\u662f\u76ee\u7684\u3002\n- **\u5339\u914d\u4f9d\u636e**\uff1a\u7528\u6237\u6240\u6709\u63d0\u95ee\u5747\u56f4\u7ed5\u201c\u5982\u4f55\u505a\u201d\u3001\u201c\u4f55\u65f6\u80fd\u63a5\u5355\u201d\u3001\u201c\u9700\u8981\u4ec0\u4e48\u6761\u4ef6\u201d\uff0c\u5bf9\u884c\u4e1a\u524d\u666f\u3001\u4e2a\u4eba\u6210\u957f\u7b49\u5b8f\u5927\u53d9\u4e8b\u65e0\u5174\u8da3\u3002\u7b26\u5408T7\u201c\u5f3a\u5de5\u5177\u5bfc\u5411\u3001\u5f31\u5174\u8da3\u9a71\u52a8\u201d\u7684\u7279\u5f81\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\uff08\u98ce\u9669\u7b49\u7ea7\uff1a\u4e2d\uff09\n- **\u6839\u56e01 - \u9884\u671f\u4e0d\u7b26\uff08\u9ad8\u98ce\u9669\uff09**\uff1a\u7528\u6237\u4ed8\u8d39\u7684\u6838\u5fc3\u9884\u671f\u662f\u83b7\u5f97\u201c\u659c\u6760\u5de5\u4f5c\u201d\uff08\u5982\u753b\u672c\uff09\u673a\u4f1a\u4ee5\u5feb\u901f\u53d8\u73b0\u3002**\u9500\u552e\u627f\u8bfa\u201c\u753b\u672c\u4efb\u52a1\u4e00\u822c\u4f1a\u6839\u636e\u9879\u76ee\u8282\u594f\u7ed9\u5230\u5408\u7406\u5468\u671f\u201d\u53ca\u201c\u8fd9\u7c7b\u5b9e\u8df5\u673a\u4f1a\uff0c\u786e\u5b9e\u9700\u8981\u62a5\u540d\u7cfb\u7edf\u8bfe\u5e76\u5b8c\u6210\u5bf9\u5e94\u5b66\u4e60\u4efb\u52a1\u540e\u624d\u80fd\u53c2\u4e0e\u201d\uff0c\u4f46\u73ed\u4e3b\u4efb\uff08\u51b0\u7f8e\u5f0f\uff09\u8868\u793a\u201c\u4e0d\u6e05\u695a\u201d\u3002** \u8fd9\u662f\u6700\u6838\u5fc3\u7684\u9000\u8d39\u98ce\u9669\u70b9\u3002\n- **\u6839\u56e02 - \u6548\u679c\u7126\u8651\uff08\u4e2d\u98ce\u9669\uff09**\uff1a\u7528\u6237\u5df2\u8868\u73b0\u51fa\u5bf9\u5b66\u4e60\u96be\u5ea6\u7684\u62c5\u5fe7\uff08\u666e\u901a\u8bdd\uff09\uff0c\u82e5\u540e\u7eed\u8bfe\u7a0b\u96be\u5ea6\u63d0\u5347\u6216\u53d8\u73b0\u8def\u5f84\u4e0d\u660e\u786e\uff0c\u6613\u4ea7\u751f\u7126\u8651\u3002\n- **\u6839\u56e03 - \u8d44\u6e90\u4e0d\u8db3\uff08\u4e2d\u98ce\u9669\uff09**\uff1a\u7528\u6237\u65f6\u95f4\u788e\u7247\u5316\uff0c\u53ef\u80fd\u96be\u4ee5\u8ddf\u4e0a\u7cfb\u7edf\u8bfe\u8282\u594f\uff0c\u5bfc\u81f4\u5b66\u4e60\u632b\u8d25\u3002\n- **\u6839\u56e04 - \u793e\u4ea4\u538b\u529b/\u4ece\u4f17\uff08\u4f4e\u98ce\u9669\uff09**\uff1a\u672a\u4f53\u73b0\u3002\n- **\u6839\u56e05 - \u51b3\u7b56\u975e\u81ea\u4e3b\uff08\u4f4e\u98ce\u9669\uff09**\uff1a\u51b3\u7b56\u4e3a\u4e2a\u4eba\u505a\u51fa\u3002\n- **\u6839\u56e06 - \u7ecf\u6d4e\u538b\u529b\uff08\u4f4e\u98ce\u9669\uff09**\uff1a\u672a\u76f4\u63a5\u4f53\u73b0\uff0c\u4f46\u5bf9\u989d\u5916\u8bbe\u5907\u6295\u5165\u654f\u611f\u3002\n- **\u6839\u56e07 - \u670d\u52a1\u4f53\u9a8c\uff08\u4f4e\u98ce\u9669\uff09**\uff1a\u76ee\u524d\u6c9f\u901a\u987a\u7545\uff0c\u4f46\u5b58\u5728\u9500\u552e\u4e0e\u73ed\u4e3b\u4efb\u4fe1\u606f\u4e0d\u4e00\u81f4\u7684\u9690\u60a3\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n- **\u5938\u5927\u627f\u8bfa**\uff1a\u9500\u552e\u5728\u8f6c\u5316\u671f\u5bf9\u201c\u753b\u672c\u201d\u7b49\u659c\u6760\u5de5\u4f5c\u7684\u53ef\u83b7\u5f97\u6027\u505a\u4e86**\u6a21\u7cca\u4f46\u5177\u6709\u5f15\u5bfc\u6027\u7684\u627f\u8bfa**\uff08\u201c\u753b\u672c\u4efb\u52a1\u4e00\u822c\u4f1a\u6839\u636e\u9879\u76ee\u8282\u594f\u7ed9\u5230\u5408\u7406\u5468\u671f\u201d\uff09\uff0c\u53ef\u80fd\u8ba9\u7528\u6237\u4ea7\u751f\u201c\u62a5\u540d\u5373\u53ef\u63a5\u5355\u201d\u7684\u8bef\u89e3\u3002**\u6b64\u4e3a\u5173\u952e\u96f7\u533a**\u3002\n- **\u538b\u529b\u903c\u5355**\uff1a\u4f7f\u7528\u201c\u4f18\u60e0\u5238\u4eca\u5929\u5230\u671f\u201d\u3001\u201c\u6700\u665a12\u70b9\u201d\u7b49\u9650\u65f6\u7b56\u7565\uff0c\u4f46\u672a\u53d1\u73b0\u6781\u7aef\u65bd\u538b\u3002\n- **\u98ce\u9669\u63d0\u793a**\uff1a\u9500\u552e\u5728\u4ed8\u6b3e\u524d\u5bf9\u201c\u53ea\u6709\u4e00\u4e2a\u5165\u884c\u7cfb\u7edf\u8bfe\u7684\u62a5\u540d\u8d39\u201d\u3001\u201c\u5176\u4ed6\u4e0d\u9700\u8981\u201d\u7b49\u8d39\u7528\u95ee\u9898\u505a\u4e86\u6f84\u6e05\uff0c\u5408\u89c4\u3002\u4f46\u5bf9\u5b66\u4e60\u96be\u5ea6\u3001\u53d8\u73b0\u5468\u671f\u3001\u63a5\u5355\u7ade\u4e89\u7b49\u98ce\u9669\u63d0\u793a\u4e0d\u8db3\u3002\n- **\u4fe1\u606f\u4e00\u81f4\u6027**\uff1a**\u9500\u552e\u4e0e\u73ed\u4e3b\u4efb\u5bf9\u201c\u753b\u672c\u5de5\u4f5c\u201d\u5b89\u6392\u7684\u8bf4\u6cd5\u5b58\u5728\u77db\u76fe**\uff0c\u53ef\u80fd\u5f15\u53d1\u7528\u6237\u88ab\u6b3a\u9a97\u611f\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n- **\u4ea7\u54c1\u5339\u914d\u5ea6**\uff1a**\u504f\u5dee**\u3002\u7528\u6237\u662f\u5178\u578b\u7684\u201c\u5feb\u53d8\u73b0\u201d\u8bc9\u6c42\uff0c\u4f46\u4ea7\u54c1\u662f\u201c\u91cd\u5b66\u4e60\u201d\u7684\u7cfb\u7edf\u8bfe\uff0c\u4e24\u8005\u5b58\u5728\u6839\u672c\u77db\u76fe\u3002\u7528\u6237\u5e0c\u671b\u7684\u662f\u201c\u4efb\u52a1\u5e73\u53f0\u201d\uff0c\u800c\u975e\u201c\u57f9\u8bad\u8bfe\u7a0b\u201d\u3002\n- **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**24\u5c0f\u65f6\u5185\u6f84\u6e05\u659c\u6760\u5de5\u4f5c\u8def\u5f84\u4e0e\u89c4\u5219**\u3002\n- **\u5177\u4f53\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u7acb\u5373\u5e72\u9884**\uff1a\u4e3b\u52a8\u8054\u7cfb\u7528\u6237\uff0c\u6b63\u9762\u56de\u5e94\u5173\u4e8e\u201c\u753b\u672c\u5de5\u4f5c\u201d\u7684\u7591\u95ee\u3002\u660e\u786e\u544a\u77e5\uff1aA) \u8be5\u7c7b\u5b9e\u8df5\u673a\u4f1a\u7684\u83b7\u53d6\u6761\u4ef6\uff08\u5982\u9700\u901a\u8fc7\u7279\u5b9a\u8003\u6838\u3001\u8fbe\u5230\u4e00\u5b9a\u5b66\u4e60\u9636\u6bb5\u3001\u9879\u76ee\u65b9\u9700\u6c42\u5339\u914d\u7b49\uff09\uff1bB) \u5e76\u975e\u62a5\u540d\u5373\u53ef\u83b7\u5f97\uff1bC) \u73ed\u4e3b\u4efb\u53ef\u63d0\u4f9b\u7684\u5b98\u65b9\u8d44\u6e90\u5bf9\u63a5\u6e20\u9053\uff08\u5982\u5c0f\u7a0b\u5e8f\u8bd5\u97f3\uff09\u4e0e\u652f\u6301\u65b9\u5f0f\u3002**\u4fee\u590d\u4fe1\u606f\u5dee\uff0c\u7ba1\u7406\u9884\u671f**\u3002\n    2.  **\u76ee\u6807\u6821\u6b63**\uff1a\u5728\u9996\u6b21\u6df1\u5ea6\u6c9f\u901a\u4e2d\uff0c\u5c06\u7528\u6237\u76ee\u6807\u4ece\u201c\u5feb\u901f\u63a5\u5355\u201d\u5f15\u5bfc\u81f3\u201c\u5148\u592f\u5b9e\u57fa\u7840\uff0c\u83b7\u5f97\u63a5\u5355\u80fd\u529b\u201d\u3002\u7ed3\u5408\u5176\u201c\u753b\u672c\u201d\u5174\u8da3\uff0c\u53ef\u5f3a\u8c03\u540e\u671f\u8bfe\u7a0b\u7684\u76f8\u5173\u6027\uff0c\u5c06\u5b66\u4e60\u4e0e\u8fdc\u671f\u53d8\u73b0\u66f4\u7d27\u5bc6\u5730\u6302\u94a9\u3002\n    3.  **\u5b66\u4e60\u652f\u6301**\uff1a\u9274\u4e8e\u5176\u65f6\u95f4\u788e\u7247\u5316\uff0c\u63d0\u4f9b\u7075\u6d3b\u7684\u5b66\u4e60\u8ba1\u5212\u5efa\u8bae\uff0c\u5f3a\u8c03\u5f55\u64ad\u8bfe\u548c\u56de\u653e\u7684\u4ef7\u503c\u3002\u5bf9\u5176\u201c\u666e\u901a\u8bdd\u201d\u7b49\u5177\u4f53\u56f0\u96be\u7ed9\u4e88\u53ca\u65f6\u3001\u5177\u4f53\u7684\u53cd\u9988\u548c\u9f13\u52b1\uff0c\u9632\u6b62\u65e9\u671f\u632b\u8d25\u3002\n    4.  **\u98ce\u9669\u76d1\u63a7**\uff1a\u5c06\u8be5\u7528\u6237\u6807\u8bb0\u4e3a\u201c\u9ad8\u9884\u671f\u7ba1\u7406\u201d\u91cd\u70b9\u5bf9\u8c61\u3002\u5bc6\u5207\u5173\u6ce8\u5176\u5bf9\u4e8e\u201c\u5b9e\u8df5\u673a\u4f1a\u201d\u548c\u201c\u53d8\u73b0\u8fdb\u5ea6\u201d\u7684\u540e\u7eed\u63d0\u95ee\uff0c\u4efb\u4f55\u6a21\u7cca\u56de\u5e94\u90fd\u53ef\u80fd\u5347\u7ea7\u4e3a\u6295\u8bc9\u3002\n\n{\"core_type\": \"T7 \u52a1\u5b9e\u53d8\u73b0\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"24\u5c0f\u65f6\u5185\u6f84\u6e05\u659c\u6760\u5de5\u4f5c\u8def\u5f84\u4e0e\u89c4\u5219\"}";
