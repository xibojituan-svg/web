    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676983219 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-25 \u81f3 2026-04-03 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u4e03\u6708\u4f73\u97f3(\u5468\u5c0f\u797a) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b (\u5df2\u8d2d\uff0c\u5177\u4f53\u4ef7\u683c\u672a\u77e5) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u5145\u88d5 (\u4e3b\u52a8\u8d2d\u4e70MK4\u8bbe\u5907\uff0c\u65e0\u8d44\u91d1\u538b\u529b\u8ff9\u8c61) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1 (\u4e0a\u73ed\u65cf\uff0c\u5229\u7528\u901a\u52e4\u3001\u5348\u4f11\u3001\u665a\u4e0a\u65f6\u95f4\u5b66\u4e60) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u5df2\u62a5\u5907\u5e76\u652f\u6301 (\u63d0\u53ca\u5bb6\u5ead\u3001\u5a5a\u59fb\uff0c\u65e0\u9690\u7792\u8ff9\u8c61) |\n| **\u4fe1\u606f\u539a\u5ea6** | \u9971\u6ee1 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u5173\u6ce8\u53d1\u97f3\u6280\u5de7\u3001\u60c5\u7eea\u8868\u8fbe\u3001\u8bbe\u5907\u4f7f\u7528\u7b49\u4e13\u4e1a\u7ec6\u8282\uff0c\u5bf9\u201c\u591a\u4e45\u80fd\u8d5a\u94b1\u201d\u65e0\u4efb\u4f55\u63d0\u53ca\u3002\u5b66\u4e60\u8fc7\u7a0b\u672c\u8eab\u5e26\u6765\u4e50\u8da3\u548c\u6ee1\u8db3\u611f\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u89c9\u5f97\u7528\u8bbe\u5907\u5f55\u97f3\u6bd4\u7528\u624b\u673a\u5f55\u97f3\u597d\u73a9\u513f\uff0c\u56e0\u4e3a\u542c\u5f97\u5230\u81ea\u5df1\u7684\u90a3\u4e2a\u58f0\u97f3\u8fd8\u86ee\u6709\u8da3\u7684\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b06\u9ad8\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a\u9ad8 \u2014 \u4e3b\u52a8\u54a8\u8be2\u5e76\u8d2d\u4e70MK4\u4e13\u4e1a\u8bbe\u5907\uff0c\u672a\u8868\u73b0\u51fa\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a\u4e2d \u2014 \u6709\u5168\u804c\u5de5\u4f5c\uff0c\u4f46\u80fd\u5229\u7528\u901a\u52e4\u3001\u5348\u4f11\u3001\u665a\u4e0a\u7b49\u788e\u7247\u65f6\u95f4\u575a\u6301\u5b66\u4e60\u3001\u7ec3\u4e60\u3001\u70b9\u8bc4\u540c\u5b66\uff0c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5f3a\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a\u9ad8 \u2014 \u804a\u5929\u4e2d\u6d41\u9732\u51fa\u5bf9\u5a5a\u59fb\u548c\u5bb6\u5ead\u7684\u77e5\u8db3\u4e0e\u5e78\u798f\u611f\uff0c\u5bb6\u5ead\u73af\u5883\u7a33\u5b9a\u652f\u6301\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9047\u5230\u53d1\u97f3\u96be\u9898\uff08\u524d\u540e\u9f3b\u97f3\u6df7\u6dc6\uff09\u4f1a\u4e3b\u52a8\u94bb\u7814\u3001\u8bf7\u6559\uff0c\u5e76\u5728\u5f97\u5230\u80af\u5b9a\u540e\uff08\u201c\u597d\u5f00\u5fc3\u201d\uff09\u8fc5\u901f\u6062\u590d\u4fe1\u5fc3\u3002\u80fd\u8fdb\u884c\u6df1\u5ea6\u81ea\u6211\u53cd\u601d\uff08\u5982\u5bf9\u58f0\u97f3\u3001\u5de5\u4f5c\u72b6\u6001\u7684\u601d\u8003\uff09\uff0c\u60c5\u7eea\u7a33\u5b9a\u4e14\u79ef\u6781\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u597d\u5f00\u5fc3\uff0c\u6211\u8fd96\u4e2a\u8bcd\u513f\u5df2\u7ecf\u628a\u6211\u6574\u4e86\u4e24\u5929\u4e86\uff0c\u2026\u73ed\u73ed\u8bf4\u6211\u53d1\u97f3\u662f\u5bf9\u7684\uff0c\u54ce\u5440\u6211\u6211\u7684\u8fd9\u4e2a\u5fc3\u5c31\u653e\u4e0b\u6765\u4e86\u3002\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bfb\u6c42\u4e13\u4e1a\u80fd\u529b\u7684\u7cbe\u8fdb\u4e0e\u81ea\u6211\u4ef7\u503c\u7684\u786e\u8ba4\u3002\u5979\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u201c\u624b\u827a\u201d\uff08\u6f14\u64ad\uff09\u6765\u83b7\u5f97\u4e13\u4e1a\u4e0a\u7684\u8ba4\u53ef\uff08\u201c\u53d1\u97f3\u5f88\u51c6\u786e\u201d\uff09\uff0c\u5e76\u5728\u6b64\u8fc7\u7a0b\u4e2d\u5b9e\u73b0\u4e2a\u4eba\u6210\u957f\u3001\u83b7\u5f97\u5185\u5fc3\u5e73\u9759\u4e0e\u5e78\u798f\u611f\uff08\u201c\u6574\u4e2a\u4eba\u5c31\u5e73\u548c\u4e86\u5f88\u591a\u201d\uff09\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u6df1\u5ea6\u80af\u5b9a\u4e0e\u6210\u957f\u966a\u4f34**\u3002\u5979\u9700\u8981\u88ab\u770b\u89c1\u5728\u6280\u672f\u7ec6\u8282\u4e0a\u7684\u52aa\u529b\u4e0e\u8fdb\u6b65\uff0c\u5e76\u6e34\u671b\u878d\u5165\u4e00\u4e2a\u79ef\u6781\u3001\u4e92\u52a9\u7684\u5b66\u4e60\u793e\u7fa4\uff08\u4e3b\u52a8\u70b9\u8bc4\u540c\u5b66\uff09\uff0c\u4ece\u4e2d\u83b7\u5f97\u5f52\u5c5e\u611f\u4e0e\u5c0a\u91cd\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \u2b50A \u7c7b |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T3 \u6b7b\u78d5\u5b66\u9738\u578b** (\u517c\u987e T2 \u4f4e\u8c03\u5b9e\u5e72\u7279\u8d28) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u5bb6\u5ead\u5173\u7cfb\u548c\u8c10\uff0c\u65e0\u98ce\u9669\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5f3a\uff0c\u80fd\u575a\u6301\u5b66\u4e60\u3002\u98ce\u9669\u70b9\u5728\u4e8e\u82e5\u5de5\u4f5c\u7a81\u7136\u6781\u5ea6\u7e41\u5fd9\uff0c\u53ef\u80fd\u6324\u538b\u5b66\u4e60\u65f6\u95f4\uff0c\u4f46\u7528\u6237\u4f1a\u4e3b\u52a8\u6c9f\u901a\uff08\u5982\u544a\u77e5\u751f\u75c5\uff09\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u5230\u95ee\u9898\u4e3b\u52a8\u6c42\u89e3\uff0c\u6297\u538b\u6027\u5f3a\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u6781\u4f4e | \u52a8\u673a\u7eaf\u5ea6\u9ad8\uff0c\u975e\u4e3a\u77ed\u671f\u53d8\u73b0\u800c\u6765\uff0c\u5173\u6ce8\u70b9\u5728\u4e8e\u80fd\u529b\u6210\u957f\u672c\u8eab\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u65e0\u660e\u663e\u5d29\u76d8\u65f6\u95f4\u7a97\u3002\u6f5c\u5728\u98ce\u9669\u5728\u4e8e **\u8bfe\u7a0b\u4e2d\u540e\u671f\u8fdb\u5165\u9ad8\u9636\u5b9e\u6218\uff08\u5982\u8bd5\u97f3\u7ade\u6807\uff09\u65f6\uff0c\u82e5\u591a\u6b21\u5931\u8d25\u53ef\u80fd\u4ea7\u751f\u81ea\u6211\u6000\u7591**\uff0c\u9700\u73ed\u4e3b\u4efb\u53ca\u65f6\u7ed9\u4e88\u6280\u672f\u6307\u5bfc\u548c\u4fe1\u5fc3\u652f\u6301\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u59d0\uff0c\u770b\u4e86\u60a8\u7684\u7ec3\u4e60\u548c\u601d\u8003\uff0c\u80fd\u611f\u89c9\u5230\u60a8\u5bf9\u58f0\u97f3\u827a\u672f\u7684\u8ffd\u6c42\u975e\u5e38\u7eaf\u7cb9\u548c\u8ba4\u771f\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u7a0b\uff0c\u5c31\u662f\u4e3a\u60a8\u8fd9\u6837\u613f\u610f\u94bb\u7814\u7ec6\u8282\u3001\u4eab\u53d7\u8fdb\u6b65\u8fc7\u7a0b\u7684\u4eba\u51c6\u5907\u7684\u3002\u63a5\u4e0b\u6765\u6211\u4eec\u4f1a\u9047\u5230\u5f88\u591a\u786c\u6838\u7684\u6280\u5de7\u548c\u6311\u6218\uff0c\u6211\u4f1a\u4e00\u76f4\u5728\u8fd9\u91cc\uff0c\u966a\u60a8\u4e00\u8d77\u628a\u6bcf\u4e2a\u53d1\u97f3\u3001\u6bcf\u5904\u60c5\u7eea\u90fd\u2018\u6b7b\u78d5\u2019\u5230\u4f4d\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u3002\u5979\u7684\u6838\u5fc3\u9700\u6c42\u662f\u7cbe\u8fdb\u6280\u827a\uff0c\u5e94\u63d0\u4f9b\u5145\u8db3\u7684\u9ad8\u9636\u6280\u5de7\u8bb2\u89e3\u3001\u6df1\u5ea6\u4f5c\u4e1a\u70b9\u8bc4\u548c\u5b9e\u6218\u6307\u5bfc\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743**\u3011\u3002\u9f13\u52b1\u5e76\u4f18\u5148\u89e3\u7b54\u5979\u5728\u53d1\u97f3\u3001\u8bbe\u5907\u3001\u6f14\u64ad\u6280\u5de7\u4e0a\u7684\u6df1\u5ea6\u95ee\u9898\u3002\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\uff08\u8f7b\u91cf\uff09**\u3011\u3002\u9080\u8bf7\u5979\u62c5\u4efb\u5c0f\u7ec4\u957f\u6216\u79ef\u6781\u5b66\u5458\u4ee3\u8868\uff0c\u53d1\u6325\u5176\u4e50\u4e8e\u52a9\u4eba\u3001\u70b9\u8bc4\u540c\u5b66\u7684\u7279\u957f\uff0c\u6ee1\u8db3\u5176\u5c0a\u91cd\u4e0e\u5f52\u5c5e\u9700\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u5feb\u901f\u53d8\u73b0\u201d\u3001\u201c\u8f7b\u677e\u63a5\u5355\u201d\u7b49\u8bdd\u672f\u53bb\u201c\u6fc0\u52b1\u201d\u5979\uff0c\u8fd9\u4f1a\u88ab\u89c6\u4e3a\u5bf9\u5979\u5b66\u4e60\u521d\u8877\u7684\u8d2c\u4f4e\u3002\u4e0d\u8981\u7ed9\u5979\u5e03\u7f6e\u8fc7\u4e8e\u7b80\u5355\u3001\u91cd\u590d\u6027\u7684\u4efb\u52a1\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u63a8\u4ecb\u9ad8\u9636\u7684**\u4e13\u9879\u7cbe\u8fdb\u8bad\u7ec3\u8425**\uff08\u5982\u89d2\u8272\u97f3\u7279\u8bad\u3001\u540e\u671f\u5236\u4f5c\u7b49\uff09\uff0c\u5339\u914d\u5176\u201c\u6b7b\u78d5\u201d\u7279\u8d28\u3002\u907f\u514d\u63a8\u9500\u4e0e\u6838\u5fc3\u6280\u80fd\u63d0\u5347\u65e0\u5173\u7684\u5468\u8fb9\u4ea7\u54c1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u73ed\u73ed\uff0c\u6211\u5176\u5b9e\u901a\u8fc7\u5b66\u4e60\uff0c\u55ef\uff0c\u6211\u89c9\u5f97\uff0c\u6211\u5c31\u542c\uff0c\u542c\u8001\u5e08\u2026\u5c31\u662f\u8001\u5e08\u7684\u8fd9\u4e9b\u53d1\u97f3\u7684\u65f6\u5019\uff0c\u6211\u89c9\u5f97\u4ed6\u4eec\u8bfb\u7684\u597d\u542c\uff0c\u58f0\u97f3\u8bfb\u7684\u597d\u542c\uff0c\u6709\u6709\u4e00\u4e2a\u70b9\uff0c\u6211\u89c9\u5f97\u4ed6\u4eec\u5c31\u662f\u53d1\u97f3\u5f88\u51c6\u786e\uff0c\u7279\u522b\u51c6\u786e\u2026\u201d\n2. > \u201c\u597d\u5f00\u5fc3\uff0c\u6211\u8fd96\u4e2a\u8bcd\u513f\u5df2\u7ecf\u628a\u6211\u6574\u4e86\u4e24\u5929\u4e86\uff0c\u2026\u73ed\u73ed\u8bf4\u6211\u53d1\u97f3\u662f\u5bf9\u7684\uff0c\u54ce\u5440\u6211\u6211\u7684\u8fd9\u4e2a\u5fc3\u5c31\u653e\u4e0b\u6765\u4e86\u3002\u201d\n3. > \u201c\u6211\u4e0d\u7fa1\u6155\u90a3\u4e9b\u5c31\u662f\u7ecf\u6d4e\u72ec\u7acb\uff0c\u975e\u5e38\u5c31\u662f\u6709\u80fd\u529b\uff0c\u7136\u540e\u522b\u4eba\u5b9e\u9645\u610f\u4e49\u4e0a\u793e\u4f1a\u610f\u4e49\u4e0a\u90a3\u79cd\u6210\u529f\u7684\u5973\u5973\u4eba\uff0c\u6211\u89c9\u5f97\u6211\u5c31\u5f88\u77e5\u8db3\uff0c\u5bb6\u5ead\uff0c\u5b69\u5b50\u8fd9\u79cd\u4f53\u9a8c\u6211\u5c31\u5f88\u77e5\u8db3\uff0c\u518d\u52a0\u4e0a\u54ce\u5466\uff0c\u6211\u60f3\u6211\u53ef\u4ee5\u9009\u62e9\u505a\u81ea\u5df1\u60f3\u505a\u7684\u4e8b\u60c5\uff0c\u6211\u89c9\u5f97\u5c31\u591f\u4e86\u3002\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T3 \u6b7b\u78d5\u5b66\u9738\u578b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u7cbe\u8fdb\u4e0e\u81ea\u6211\u5b9e\u73b0\u7684\u5c0a\u91cd\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6df1\u5ea6\u7684\u4e13\u4e1a\u5185\u5bb9\u53cd\u9988\u4e0e\u6210\u957f\u8def\u5f84\u6307\u5f15\uff0c\u5e76\u8d4b\u4e88\u5176\u4e00\u5b9a\u7684\u793e\u7fa4\u89d2\u8272\u6ee1\u8db3\u5f52\u5c5e\u9700\u6c42\u3011**\u3002\n\n```json\n{\"core_type\": \"T3 \u6b7b\u78d5\u5b66\u9738\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd/\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\"}\n```";
