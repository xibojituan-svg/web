    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n> **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4e3b\u8981\u4e3a\u4f53\u9a8c\u8bfe\u671f\u95f4\u4e0e\u9500\u552e\u7684\u4e92\u52a8\uff0c\u7f3a\u4e4f\u5173\u4e8e**\u652f\u4ed8\u80fd\u529b\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u771f\u5b9e\u53ef\u7528\u65f6\u95f4\u3001\u8fc7\u5f80\u7ecf\u5386**\u7b49\u5173\u952e\u80cc\u666f\u4fe1\u606f\u3002\u4ee5\u4e0b\u5206\u6790\u57fa\u4e8e\u6709\u9650\u7684\u884c\u4e3a\u548c\u8bed\u8a00\u6a21\u5f0f\u63a8\u65ad\u3002\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 445771908 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u96e8\u6850/\u521d\u6674(\u6c64\u529b)\u3001\u79cb\u4e91(\u4f55\u9a8f) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u64adAI\u77ed\u6545\u4e8b\u5199\u4f5c\u8bfe\uff08\u65d7\u8230\u73ed\uff094380\u5143 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | [\u4fe1\u606f\u7f3a\u5931] |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | [\u4fe1\u606f\u7f3a\u5931] (\u804a\u5929\u4e2d\u63d0\u53ca\u6563\u6b65\u3001\u7172\u6c64\uff0c\u663e\u793a\u6709\u95f2\u6687\uff0c\u4f46\u5177\u4f53\u65f6\u957f\u672a\u77e5) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | [\u4fe1\u606f\u7f3a\u5931] |\n| **\u4fe1\u606f\u539a\u5ea6** | [\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09] |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a[\u6df7\u6742\u8bd5\u6c34(\u4e2d)] \u7528\u6237\u660e\u786e\u8868\u793a\u201c\u54b1\u6765\u8fd9\u91cc\u662f\u8981\u5b66\u4f1a\u8d5a\u94b1\u7684\u201d\uff0c\u5bf9\u6e20\u9053\u91cd\u8981\u6027\u6709\u8ba4\u77e5\uff08\u201c\u6ca1\u6709\u6e20\u9053\u5f88\u96be\u6210\u529f\u7684\u201d\uff09\uff0c\u4f46\u540c\u65f6\u4e5f\u8868\u73b0\u51fa\u5bf9\u5199\u4f5c\u6280\u5de7\u3001AI\u5de5\u5177\u672c\u8eab\u7684\u597d\u5947\u4e0e\u94bb\u7814\u5174\u8da3\uff0c\u52a8\u673a\u662f\u201c\u8d5a\u94b1\u201d\u4e0e\u201c\u5b66\u4e60/\u5174\u8da3\u201d\u7684\u6df7\u5408\u4f53\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6843\u5341\u516d\u8001\u5e08\u8bf4\u4e86\uff0c\u54b1\u6765\u8fd9\u91cc\u662f\u8981\u5b66\u4f1a\u8d5a\u94b1\u7684\u201d & \u201c\u83dc\u9e1f\u9636\u6bb5\uff0c\u5148\u638c\u63e1\u7a0b\u5e8f\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 \u672a\u63d0\u53ca\u652f\u4ed8\u538b\u529b\u6216\u7ecf\u6d4e\u72b6\u51b5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 \u7528\u6237\u80fd\u6309\u65f6\u5b8c\u6210\u4f53\u9a8c\u8bfe\u4f5c\u4e1a\uff0c\u5e76\u4e3b\u52a8\u4fee\u6539\u3001\u63d0\u95ee\uff0c\u663e\u793a\u6709\u5b66\u4e60\u65f6\u95f4\u3002\u4f46\u672a\u900f\u9732\u5de5\u4f5c/\u5bb6\u5ead\u65f6\u95f4\u5360\u7528\u60c5\u51b5\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 \u5b8c\u5168\u672a\u63d0\u53ca\u5bb6\u5ead\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a[\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)] \u7528\u6237\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u65e0\u6cd5\u590d\u5236\u7c98\u8d34\uff09\u65f6\uff0c\u4e3b\u52a8\u5c1d\u8bd5\u91cd\u542f\u8bbe\u5907\uff0c\u5e76\u8ba1\u5212\u201c\u5348\u996d\u540e\u518d\u8bd5\u8bd5\u201d\u3002\u9762\u5bf9\u5b66\u4e60\u538b\u529b\uff0c\u80fd\u81ea\u6211\u8c03\u8282\uff08\u201c\u6015\u7ed9\u81ea\u5df1\u592a\u5927\u7684\u538b\u529b\u2026\u538b\u529b\u4e0d\u662f\u8001\u5e08\u7ed9\u7684\uff0c\u662f\u81ea\u5df1\u7ed9\u81ea\u5df1\u7684\u201d\uff09\uff0c\u8868\u73b0\u51fa\u8f83\u5f3a\u7684\u81ea\u6211\u8ba4\u77e5\u548c\u60c5\u7eea\u7ba1\u7406\u80fd\u529b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5927\u95ee\u9898\u6ca1\u6709\uff0c\u5c0f\u95ee\u9898\u662f\u6709\u4e9b\u7684\u3002\u5148\u81ea\u5df1\u9886\u4f1a\u9886\u4f1a\u201d & \u201c\u538b\u529b\u4e0d\u662f\u8001\u5e08\u7ed9\u7684\uff0c\u662f\u81ea\u5df1\u7ed9\u81ea\u5df1\u7684\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u81ea\u8eab\u5728\u65b0\u9886\u57df\uff08AI\u5199\u4f5c\uff09\u80fd\u529b\u7684\u4e0d\u786e\u5b9a\u611f\uff08\u201c\u83dc\u9e1f\u9636\u6bb5\u201d\u3001\u201c\u4e0d\u77e5\u9053\u80fd\u5b66\u5f97\u600e\u4e48\u6837\u201d\uff09\uff0c\u6e34\u671b\u901a\u8fc7\u8ddf\u968f\u201c\u5927\u5496\u201d\u548c\u201c\u5e73\u53f0\u201d\u83b7\u5f97**\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u5708\u5c42\u5f52\u5c5e**\uff0c\u4ece\u800c\u6d88\u9664\u8fd9\u79cd\u4e0d\u786e\u5b9a\u6027\uff0c\u83b7\u5f97\u4ef7\u503c\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u201d\u7684\u80af\u5b9a\u4e0e\u201c\u88ab\u5f15\u9886\u201d\u7684\u5b89\u5168\u611f**\u3002\u9700\u8981\u4e0d\u65ad\u5f3a\u5316\u5176\u201c\u597d\u5b66\u751f\u201d\u3001\u201c\u609f\u6027\u9ad8\u201d\u7684\u6807\u7b7e\uff0c\u5e76\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u6267\u884c\u7684\u8def\u5f84\uff0c\u8ba9\u4ed6\u611f\u89c9\u81ea\u5df1\u662f\u201c\u6b63\u786e\u9053\u8def\u201d\u4e0a\u88ab\u6b63\u786e\u5f15\u5bfc\u7684\u4e00\u5458\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | [\ud83d\udfe7B] \u7c7b (\u52a8\u673a\u660e\u786e\u3001\u6267\u884c\u529b\u5c1a\u53ef\u3001\u60c5\u7eea\u7a33\u5b9a\uff0c\u4f46\u5173\u952e\u8d44\u6e90\u4fe1\u606f\u7f3a\u5931\uff0c\u9700\u8fdb\u4e00\u6b65\u89c2\u5bdf) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | [T3 \u6b7b\u78d5\u5b66\u9738] (\u8868\u73b0\u51fa\u94bb\u7814\u7ec6\u8282\u3001\u4e3b\u52a8\u601d\u8003\u3001\u8ffd\u6c42\u65b9\u6cd5\u8bba\u548c\u5e95\u5c42\u903b\u8f91\u7684\u503e\u5411\uff0c\u5982\u8ba8\u8bba\u201c\u5929\u9f99\u516b\u90e8\u76ee\u6807\u8bbe\u5b9a\u201d\u3001\u201cAI\u91cf\u5316\u6545\u4e8b\u201d\uff0c\u5e76\u81ea\u6211\u5b9a\u4f4d\u4e3a\u201c\u83dc\u9e1f\u201d\u5bfb\u6c42\u7cfb\u7edf\u5b66\u4e60) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a[\u65e0]\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | [\u4f4e] | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u7528\u6237\u8868\u73b0\u72ec\u7acb\uff0c\u98ce\u9669\u6682\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | [\u4e2d] | **\u6280\u672f\u64cd\u4f5c\u95e8\u69db**\u662f\u663e\u6027\u98ce\u9669\u3002\u5df2\u51fa\u73b0\u590d\u5236\u7c98\u8d34\u95ee\u9898\uff0c\u82e5\u540e\u7eed\u8bfe\u7a0b\u6d89\u53ca\u66f4\u590d\u6742\u5de5\u5177\uff0c\u53ef\u80fd\u56e0\u632b\u8d25\u611f\u79ef\u7d2f\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | [\u4f4e] | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u81ea\u6211\u8c03\u8282\uff0c\u98ce\u9669\u4f4e\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | [\u4e2d] | \u5bf9\u201c\u6e20\u9053\u201d\u548c\u201c\u7ed3\u679c\u201d\u6709\u9ad8\u671f\u5f85\uff08\u201c\u5408\u4f5c\u5171\u8d62\u662f\u4e00\u822c\u4eba\u6210\u529f\u7684\u6377\u5f84\u201d\uff09\u3002\u82e5\u5f00\u8bfe\u540e\u53d1\u73b0\u6295\u7a3f\u53d8\u73b0\u8def\u5f84\u6f2b\u957f\u6216\u7ade\u4e89\u6fc0\u70c8\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe\u540e\u7b2c1-2\u5468\uff0c\u5f53\u9762\u4e34\u7b2c\u4e00\u4e2a\u5b9e\u8d28\u6027\u6280\u672f\u64cd\u4f5c\u56f0\u96be\u6216\u7b2c\u4e00\u6b21\u6295\u7a3f\u53cd\u9988\u4e0d\u7406\u60f3\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u770b\u5230\u4f60\u5728\u4f53\u9a8c\u8bfe\u671f\u95f4\u5bf9\u2018\u5929\u9f99\u516b\u90e8\u7ed3\u6784\u2019\u548c\u2018\u8bed\u8a00\u98ce\u683c\u2019\u7684\u601d\u8003\u975e\u5e38\u6df1\u5165\uff0c\u8fd9\u5b8c\u5168\u662f\u4e00\u4e2a\u4f18\u79c0\u521b\u4f5c\u8005\u7684\u6f5c\u8d28\u3002\u54b1\u4eec\u6b63\u5f0f\u8bfe\u5c31\u662f\u4e3a\u4f60\u8fd9\u6837\u613f\u610f\u94bb\u7814\u7684\u2018\u597d\u5b66\u751f\u2019\u51c6\u5907\u7684\uff0c\u6bcf\u4e00\u6b65\u90fd\u6709\u6e05\u6670\u7684\u2018\u7a0b\u5e8f\u2019\u548c\u2018\u6a21\u677f\u2019\uff0c\u4f60\u53ea\u7ba1\u8ddf\u7740\u8d70\uff0c\u6280\u672f\u548c\u6e20\u9053\u7684\u4e8b\u4ea4\u7ed9\u6211\u4eec\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011\u3002\u5339\u914d\u5176T3\u6b7b\u78d5\u5b66\u9738\u7279\u8d28\uff0c\u63d0\u4f9b\u7cfb\u7edf\u5316\u3001\u6709\u6df1\u5ea6\u7684\u6280\u5de7\u6559\u5b66\u548c\u6e05\u6670\u7684\u8fdb\u9636\u8def\u5f84\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5f3a\u70c8\u5efa\u8bae\u8865\u5145**\u3010\u6280\u672f\u62a4\u822a\u5305\u3011**\uff08\u63d0\u4f9b\u6e05\u6670\u7684\u8f6f\u4ef6\u64cd\u4f5c\u6307\u5357\u3001\u5e38\u89c1\u95ee\u9898QA\u3001\u4f18\u5148\u6280\u672f\u652f\u6301\u901a\u9053\uff09\uff0c\u4ee5\u9884\u9632\u5176\u56e0\u64cd\u4f5c\u95ee\u9898\u53d7\u632b\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u53ea\u7ed9\u9e21\u6c64\u4e0d\u7ed9\u65b9\u6cd5\uff1b\u5ffd\u89c6\u5176\u63d0\u51fa\u7684\u5177\u4f53\u6280\u672f\u6216\u7406\u8bba\u95ee\u9898\uff1b\u7528\u201c\u5f88\u7b80\u5355\u201d\u6577\u884d\u5176\u9047\u5230\u7684\u56f0\u96be\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5f53\u524d\u7528\u6237\u5904\u4e8e\u8c28\u614e\u8bd5\u6c34\u671f\uff0c\u4e14\u5df2\u8d2d\u4e70\u65d7\u8230\u73ed\uff0c\u9996\u8981\u4efb\u52a1\u662f\u5efa\u7acb\u4fe1\u4efb\u3001\u4ea4\u4ed8\u4ef7\u503c\u3001\u7a33\u5b9a\u5b66\u4e60\uff0c\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u53ef\u80fd\u7834\u574f\u5176\u5b89\u5168\u611f\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u83dc\u9e1f\u9636\u6bb5\uff0c\u5148\u638c\u63e1\u7a0b\u5e8f\uff0c\u8981\u660e\u767d\u9700\u8981\u505a\u4ec0\u4e48\u548c\u600e\u4e48\u505a\u201d\n2. > \u201c\u6ca1\u6709\u6e20\u9053\u5f88\u96be\u6210\u529f\u7684\uff0c\u51e0\u4e4e\u4e5d\u6b7b\u4e00\u751f\u2026\u8ddf\u7740\u5927\u5496\u53bb\u505a\uff0c\u518d\u6162\u4e5f\u662f\u5728\u6b63\u786e\u7684\u8def\u4e0a\u201d\n3. > \u201c\u538b\u529b\u4e0d\u662f\u8001\u5e08\u7ed9\u7684\uff0c\u662f\u81ea\u5df1\u7ed9\u81ea\u5df1\u7684\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **[T3\u6b7b\u78d5\u5b66\u9738\u578b]**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **[\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u5708\u5c42\u5f52\u5c5e\u611f]**\u3002\u9000\u5355\u51e0\u7387\u4e3a **[\u4e2d]**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **[\u63d0\u4f9b\u6781\u81f4\u6e05\u6670\u7684\u5b66\u4e60\u8def\u5f84\u4e0e\u53ca\u65f6\u7684\u6280\u672f\u652f\u6301\uff0c\u6ee1\u8db3\u5176\u201c\u7a0b\u5e8f\u5316\u201d\u5b66\u4e60\u9700\u6c42]**\u3002\n\n{\"core_type\": \"T3 \u6b7b\u78d5\u5b66\u9738\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u5f52\u5c5e\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u6280\u672f\u62a4\u822a\u5305\"}";
