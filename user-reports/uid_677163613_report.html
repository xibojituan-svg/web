        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677163613\u7684\u7528\u6237\u8fdb\u884c\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677163613 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e-\u68a6\u5883\uff08\u674e\u4e50\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u62a5\u540d2\u4e2a\u6708\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u4ec5\u63d0\u53ca\u201c\u94b1\u4e0d\u591f\u201d\uff0c\u672a\u8bf4\u660e\u652f\u4ed8\u65b9\u5f0f\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u4ec5\u63d0\u53ca\u201c\u517c\u804c\u5e72\u7684\u597d\u7684\u8bdd\u5168\u804c\u4e5f\u884c\u201d\uff0c\u672a\u660e\u786e\u65f6\u95f4\u5b89\u6392\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\uff08\u6709\u5b66\u4e60\u884c\u4e3a\u4e0e\u53cd\u9988\uff0c\u4f46\u5173\u952e\u652f\u4ed8\u3001\u65f6\u95f4\u3001\u5bb6\u5ead\u4fe1\u606f\u7f3a\u5931\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06**\u9ad8** (7-8\u5206)\n- **\u7279\u5f81\u901f u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u5b58\u5728\u6280\u672f\u81ea\u5351\u4e0e\u4f9d\u8d56\u6307\u5bfc\u503e\u5411**\u3002\u591a\u6b21\u8868\u8fbe\u201c\u627e\u4e0d\u5230\u90a3\u4e2a\u611f\u89c9\uff0c\u65b9\u6cd5\u4e0d\u4f1a\u201d\u3001\u201c\u8bed\u901f\u548c\u4eba\u7269\u8bed\u6c14\u8fd8\u4e0d\u592a\u884c\u201d\uff0c\u5728\u9047\u5230\u6280\u672f\u74f6\u9888\u65f6\u8868\u73b0\u51fa\u660e\u663e\u7684\u81ea\u6211\u6000\u7591\u548c\u5bfb\u6c42\u5916\u90e8\u6307\u5bfc\u7684\u4f9d\u8d56\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5c31\u662f\u8bfb\u4e66\u8fd8\u662f\u6ca1\u63d0\u5347\u201d > \u201c\u627e\u4e0d\u5230\u90a3\u4e2a\u611f\u89c9\uff0c\u65b9\u6cd5\u4e0d\u4f1a\u201d > \u201c\u5f55\u4e66\u60f3\u505a\uff0c\u5c31\u6015\u8fbe\u8fbe\u4e0d\u5230\u4f60\u4eec\u7684\u8981\u6c42\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42\uff08\u5f52\u5c5e\u611f\uff09\u4e0e\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42\uff08\u80fd\u529b\u8ba4\u53ef\uff09\u7684\u6df7\u5408**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u81ea\u8eab\u80fd\u529b\u7684\u4e0d\u81ea\u4fe1**\u3002\u4ed6\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u6280\u80fd\uff08\u6709\u58f0\u6f14\u64ad\uff09\u6765\u83b7\u5f97\u793e\u4f1a\u8eab\u4efd\u8ba4\u540c\u548c\u5c0a\u91cd\uff0c\u4f46\u521d\u671f\u5b66\u4e60\u4e2d\u7684\u632b\u8d25\u611f\uff08\u201c\u6ca1\u63d0\u5347\u201d\u3001\u201c\u627e\u4e0d\u5230\u611f\u89c9\u201d\uff09\u8ba9\u4ed6\u4ea7\u751f\u4e86\u81ea\u6211\u6000\u7591\uff0c\u6025\u9700\u5916\u90e8\u80af\u5b9a\u6765\u5efa\u7acb\u4fe1\u5fc3\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u4f60\u662f\u6709\u6f5c\u529b\u7684\uff0c\u6211\u770b\u597d\u4f60\u201d\u7684\u6301\u7eed\u80af\u5b9a\u4e0e\u201c\u624b\u628a\u624b\u201d\u7684\u5b9e\u64cd\u6307\u5bfc**\u3002\u4ed6\u9700\u8981\u88ab\u770b\u89c1\u3001\u88ab\u8ba4\u53ef\uff0c\u5e76\u901a\u8fc7\u5177\u4f53\u7684\u3001\u53ef\u6267\u884c\u7684\u6b65\u9aa4\u6307\u5bfc\u6765\u8de8\u8d8a\u201c\u4e0d\u4f1a\u201d\u5230\u201c\u4f1a\u201d\u7684\u5fc3\u7406\u9e3f\u6c9f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74** (\u4e25\u91cd\u5185\u8017\u578b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u7b49\u4fe1\u53f7\u3002\u4f46\u9700\u8b66\u60d5\u56e0\u6301\u7eed\u6280\u672f\u632b\u8d25\u611f\u53e0\u52a0\u7ecf\u6d4e\u538b\u529b\uff08\u201c\u94b1\u4e0d\u591f\u201d\uff09\u800c\u5411T8-D\uff08\u7edd\u8def\u8d4c\u5f92\uff09\u9000\u5316\u7684\u98ce\u9669\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u65e0\u6cd5\u5224\u65ad |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u82e5\u540e\u7eed\u8bfe\u7a0b\u65f6\u95f4\u4e0e\u5de5\u4f5c/\u751f\u6d3b\u51b2\u7a81\uff0c\u5bfc\u81f4\u65e0\u6cd5\u8ddf\u4e0a\u8fdb\u5ea6\uff0c\u53ef\u80fd\u56e0\u81ea\u8d23\u548c\u538b\u529b\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u4e00\u65e6\u8fde\u7eed\u51e0\u6b21\u8bd5\u97f3\u5931\u8d25\u6216\u4f5c\u4e1a\u88ab\u4e25\u5389\u6279\u8bc4\uff0c\u6781\u6613\u89e6\u53d1\u201c\u6211\u592a\u7b28\u4e86\u5b66\u4e0d\u4f1a\u201d\u7684\u81ea\u6211\u5426\u5b9a\uff0c\u8fdb\u800c\u4ea7\u751f\u9000\u8d39\u5ff5\u5934\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u5982\u679c\u5b66\u4e601-2\u4e2a\u6708\u540e\u4ecd\u611f\u89c9\u201c\u6ca1\u63d0\u5347\u201d\u6216\u63a5\u5355\u65e0\u671b\uff0c\u53ef\u80fd\u56e0\u6295\u5165\u4ea7\u51fa\u6bd4\u5931\u8861\u800c\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\uff0c\u5f53\u6280\u672f\u7ec3\u4e60\u8fdb\u5165\u74f6\u9888\u671f\uff0c\u4f5c\u4e1a\u96be\u5ea6\u63d0\u5347\uff0c\u82e5\u8fde\u7eed\u53d7\u632b\u4e14\u672a\u5f97\u5230\u53ca\u65f6\u7684\u60c5\u7eea\u5b89\u629a\u548c\u6709\u6548\u6307\u5bfc\uff0c\u6781\u6613\u5d29\u6e83\u9000\u8d39\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u540c\u5b66\uff0c\u6211\u770b\u5230\u4f60\u4e4b\u524d\u7684\u5b66\u4e60\u975e\u5e38\u8ba4\u771f\uff0c\u63d0\u4ea4\u4f5c\u4e1a\u4e5f\u5f88\u53ca\u65f6\uff0c\u8fd9\u4efd\u575a\u6301\u7279\u522b\u68d2\uff01\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u5c31\u662f\u4e00\u6b65\u6b65\u6765\u7684\uff0c**\u522b\u6015\u2018\u627e\u4e0d\u5230\u611f\u89c9\u2019\uff0c\u8fd9\u79cd\u611f\u89c9\u6211\u4eec\u6bcf\u4e2a\u4eba\u4e00\u5f00\u59cb\u90fd\u6ca1\u6709\uff0c\u662f\u7ec3\u51fa\u6765\u7684**\u3002\u6211\u4f1a\u5e26\u7740\u4f60\uff0c\u4ece\u6700\u57fa\u7840\u7684\u5f00\u59cb\uff0c\u6bcf\u5b8c\u6210\u4e00\u4e2a\u5c0f\u76ee\u6807\uff0c\u4f60\u90fd\u4f1a\u53d1\u73b0\u81ea\u5df1\u53c8\u8fdb\u6b65\u4e86\u4e00\u70b9\u3002\u6709\u4efb\u4f55\u5361\u4f4f\u7684\u5730\u65b9\uff0c\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u89e3\u51b3\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\uff08\u6ee1\u8db3\u5176\u5b66\u6280\u80fd\u7684\u6838\u5fc3\u8bc9\u6c42\uff09\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u5f3a\u70c8\u8865\u5145\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u9488\u5bf9\u5176\u4f4e\u5fc3\u7406\u5f39\u6027\uff0c\u9700\u8981\u9ad8\u6d53\u5ea6\u7684C\u6a21\u5757\uff08\u60c5\u7eea\u4fdd\u59c6\uff09\u8fdb\u884c\u6258\u5e95\u3002\u540c\u65f6\uff0cB\u6a21\u5757\uff08\u786c\u6838\u624b\u827a\uff09\u7684\u6307\u5bfc\u5fc5\u987b\u62c6\u89e3\u5f97\u6781\u5176\u7ec6\u81f4\u3001\u6b65\u9aa4\u5316\uff0c\u907f\u514d\u4f7f\u7528\u62bd\u8c61\u672f\u8bed\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5728\u4ed6\u8868\u8fbe\u201c\u4e0d\u4f1a\u201d\u3001\u201c\u4e0d\u884c\u201d\u65f6\uff0c\u53ea\u7528\u201c\u52a0\u6cb9\u201d\u3001\u201c\u591a\u7ec3\u7ec3\u201d\u7b49\u7a7a\u6cdb\u9f13\u52b1\u3002\u7981\u6b62\u5728\u4ed6\u672a\u5efa\u7acb\u4fe1\u5fc3\u524d\uff0c\u5e03\u7f6e\u8fc7\u9ad8\u96be\u5ea6\u7684\u4f5c\u4e1a\u6216\u8fdb\u884c\u516c\u5f00\u7684\u3001\u4e25\u5389\u7684\u6279\u8bc4\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u57fa\u7840\u6280\u80fd\u672a\u7a33\u5b9a\u3001\u81ea\u4fe1\u5fc3\u672a\u5efa\u7acb\u524d\u8fdb\u884c\u4efb\u4f55\u5347\u5355\u63a8\u9500**\u3002\u9996\u8981\u4efb\u52a1\u662f\u5e2e\u52a9\u4ed6\u83b7\u5f97\u201c\u6211\u80fd\u884c\u201d\u7684\u6b63\u5411\u53cd\u9988\u3002\u53ef\u8003\u8651\u5c0f\u989d\u3001\u4f4e\u95e8\u69db\u7684\u9644\u52a0\u670d\u52a1\uff08\u5982\u4e00\u6b21\u4e13\u5c5e\u70b9\u8bc4\uff09\uff0c\u4f46\u7edd\u4e0d\u80fd\u63a8\u9ad8\u4ef7\u8bfe\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u5c31\u662f\u8bfb\u4e66\u8fd8\u662f\u6ca1\u63d0\u5347**\u201d\n2. > \u201c**\u627e\u4e0d\u5230\u90a3\u4e2a\u611f\u89c9\uff0c\u65b9\u6cd5\u4e0d\u4f1a**\u201d\n3. > \u201c**\u5f55\u4e66\u60f3\u505a\uff0c\u5c31\u6015\u8fbe\u8fbe\u4e0d\u5230\u4f60\u4eec\u7684\u8981\u6c42**\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u80fd\u529b\u8ba4\u53ef\u4e0e\u5f52\u5c5e\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u201c\u624b\u628a\u624b\u201d\u7684\u7ec6\u81f4\u6307\u5bfc + \u9ad8\u9891\u7684\u201c\u5177\u4f53\u5316\u201d\u9f13\u52b1\uff0c\u4e25\u9632\u6280\u672f\u632b\u8d25\u611f\u7d2f\u79ef\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u793e\u4ea4\u9700\u6c42\u6df7\u5408\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\"}\n```";
