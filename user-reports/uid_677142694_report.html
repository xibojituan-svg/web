    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## \u4fe1\u606f\u5145\u8db3\u5ea6\u8bc4\u4f30\n\u4fe1\u606f\u5145\u8db3\uff0c\u53ef\u8fdb\u884c\u5206\u5c42\u5224\u65ad\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u4e2d\u4f4e**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u76ee\u524d\u662f\u60f3\u517c\u804c\u201d\uff0c\u76ee\u6807\u4e3a\u517c\u804c\u53d8\u73b0\u3002\u5bf9\u884c\u4e1a\u89c4\u5219\uff08\u5982\u7248\u6743\uff09\u6709\u521d\u6b65\u4e86\u89e3\u5e76\u4e3b\u52a8\u8be2\u95ee\uff08\u201c\u559c\u9a6c\u4e0a\u9762\u7684\u6240\u6709\u6587\u672c\u5f55\u97f3\uff0c\u90fd\u5fc5\u987b\u662f\u8981\u6709\u6388\u6743\u624d\u53ef\u4ee5\u4e0a\u4f20\u662f\u5417\u201d\uff09\uff0c\u663e\u793a\u51fa\u4e00\u5b9a\u7684\u6c42\u77e5\u6b32\u548c\u5408\u89c4\u610f\u8bc6\u3002\u4f46**\u53d8\u73b0\u9884\u671f**\u672a\u88ab\u76f4\u63a5\u91cf\u5316\u6216\u6311\u6218\uff0c\u52a8\u673a\u505c\u7559\u5728\u201c\u60f3\u517c\u804c\u201d\u7684\u6a21\u7cca\u9636\u6bb5\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u4e2d\u4f4e**\u3002\u7528\u6237\u5bf9\u8bbe\u5907\u6295\u5165\u654f\u611f\uff08\u201c\u9700\u8981\u4e70\u4ec0\u4e48\u8bbe\u5907\u5417\u201d\uff09\uff0c\u5728\u9500\u552e\u63a8\u83504\u4e2a\u6708\u8bfe\u7a0b\u65f6\u56e0\u201c\u8d39\u7528\u76ee\u524d\u5bf9\u6211\u6709\u70b9\u9ad8\u201d\u800c\u9009\u62e92\u4e2a\u6708\u8bfe\u7a0b\uff0c**\u652f\u4ed8\u80fd\u529b\u6709\u9650**\uff0c\u5bf9\u4ef7\u683c\u654f\u611f\u3002\u65f6\u95f4\u8d44\u6e90\u65b9\u9762\uff0c\u80fd\u5b8c\u6210\u6bcf\u65e5\u4f5c\u4e1a\u548c\u76f4\u64ad\u6253\u5361\uff0c\u914d\u5408\u5ea6\u8f83\u9ad8\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u4e2d\u9ad8**\u3002\u7528\u6237\u5b66\u4e60\u884c\u4e3a**\u914d\u5408\u5ea6\u9ad8**\uff0c\u80fd\u6309\u65f6\u5b8c\u6210\u6240\u6709\u4efb\u52a1\uff08\u6668\u7ec3\u3001\u542c\u8bfe\u3001\u4f5c\u4e1a\u3001\u76f4\u64ad\u6253\u5361\uff09\u3002\u80fd\u4e3b\u52a8\u53cd\u9988\u5b66\u4e60\u4e2d\u7684\u5177\u4f53\u95ee\u9898\uff08\u201c\u4e2d\u95f4\u4f1a\u6709\u660e\u663e\u7684\u53e3\u6c34\u97f3\u201d\uff09\uff0c\u5e76\u8be2\u95ee\u64cd\u4f5c\u7ec6\u8282\uff08\u201c\u65c1\u767d\u662f\u4e0d\u9700\u8981\u7684\u5427\uff1f\u201d\uff09\uff0c\u8868\u73b0\u51fa**\u4e3b\u52a8\u6027\u548c\u6267\u884c\u529b**\u3002\u9762\u5bf9\u9500\u552e\u7684\u538b\u529b\u8bdd\u672f\uff08\u5982\u201c\u6700\u540e\u4e00\u6b21\u5f55\u97f3\u8003\u6838\u201d\u3001\u201c\u73b0\u573a\u53d1\u4f18\u60e0\u5238\u201d\uff09\u672a\u8868\u73b0\u51fa\u7126\u8651\u6216\u6297\u62d2\uff0c\u60c5\u7eea\u7a33\u5b9a\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u6267\u884c\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u5df2\u5b8c\u6210\u62a5\u540d\u5e76\u652f\u4ed82\u4e2a\u6708\u8bfe\u7a0b\u8d39\u7528\uff0c\u8ba2\u5355\u7f16\u53f7\u5df2\u63d0\u4f9b\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u5bb6\u5ead\u6216\u914d\u5076\u610f\u89c1\uff0c\u7528\u6237\u51b3\u7b56\u8868\u73b0\u4e3a\u4e2a\u4eba\u884c\u4e3a\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u7eaf\u5ea6\u5224\u65ad**: **B\u7c7b\uff08\u529f\u5229\u9a71\u52a8\u578b\uff09**\u3002\u6838\u5fc3\u8bc9\u6c42\u662f\u517c\u804c\u8d5a\u94b1\uff0c\u5bf9\u5b66\u4e60\u5185\u5bb9\u6709\u914d\u5408\u4f46\u672a\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u5185\u5728\u5174\u8da3\u6216\u957f\u671f\u804c\u4e1a\u89c4\u5212\u3002\n*   **\u6b65\u9aa42 - \u8d44\u6e90\u5e95\u5ea7\u5224\u65ad**: **C\u7c7b\uff08\u8d44\u6e90\u7ea6\u675f\u578b\uff09**\u3002\u652f\u4ed8\u80fd\u529b\u6709\u9650\uff08\u9009\u62e9\u4f4e\u4ef7\u8bfe\u7a0b\u3001\u5173\u6ce8\u8bbe\u5907\u6210\u672c\uff09\uff0c\u4f46\u65f6\u95f4\u8d44\u6e90\u5c1a\u53ef\u3002\n*   **\u6b65\u9aa43 - \u5fc3\u7406\u5f39\u6027\u5224\u65ad**: **B\u7c7b\uff08\u7a33\u5b9a\u914d\u5408\u578b\uff09**\u3002\u6267\u884c\u529b\u5f3a\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u80fd\u6309\u6307\u5f15\u884c\u52a8\u3002\n*   **\u7efc\u5408\u5224\u5b9a**: **B-C-B\u578b\u7528\u6237**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n**T7 \u52a1\u5b9e\u63a2\u7d22\u8005**\u3002\u7528\u6237\u76ee\u6807\u660e\u786e\uff08\u517c\u804c\uff09\uff0c\u884c\u52a8\u529b\u5f3a\uff08\u5b8c\u6210\u6240\u6709\u4efb\u52a1\uff09\uff0c\u5bf9\u4ef7\u683c\u654f\u611f\uff0c\u5173\u6ce8\u6295\u5165\u4ea7\u51fa\u6bd4\uff08\u8be2\u95ee\u8bbe\u5907\u3001\u9009\u62e9\u77ed\u5468\u671f\u8bfe\u7a0b\uff09\u3002\u5b66\u4e60\u6001\u5ea6\u8ba4\u771f\u4f46\u52a8\u673a\u504f\u5411\u77ed\u671f\u53d8\u73b0\uff0c\u5c5e\u4e8e**\u9ad8\u914d\u5408\u3001\u4f4e\u9884\u7b97\u3001\u76ee\u6807\u5bfc\u5411**\u7684\u5b9e\u7528\u4e3b\u4e49\u8005\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u98ce\u9669\u7b49\u7ea7**: **\u4e2d**\n*   **\u6839\u56e0\u6392\u67e5**:\n    1.  **\u9884\u671f\u7ba1\u7406\u4e0d\u5f53**: **\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u5927\u91cf\u4f7f\u7528\u201c\u65f6\u85aa90-300\u201d\u3001\u201c\u788e\u7247\u65f6\u95f4\u5f55\u4e66\uff0c\u7efc\u5408\u6536\u5165\u5927\u6982\u57281W\u5de6\u53f3\u201d\u3001\u201c\u5feb\u901f\u6323\u5230\u6709\u58f0\u7b2c\u4e00\u6876\u91d1\u201d\u7b49\u8bdd\u672f\uff0c\u4f46\u672a\u4e0e\u7528\u6237\u786e\u8ba4\u5176\u5177\u4f53\u9884\u671f\u6216\u6f84\u6e05\u8fbe\u6210\u6761\u4ef6\uff0c**\u6781\u6613\u5f15\u53d1\u201c\u53d8\u73b0\u4e0d\u53ca\u9884\u671f\u201d\u7684\u9000\u8d39**\u3002\n    2.  **\u4ea7\u54c1\u9519\u914d**: **\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u4e3a\u517c\u804c\u63a2\u7d22\uff0c\u9009\u62e9\u4e862\u4e2a\u6708\u8bfe\u7a0b\u3002\u82e5\u8bfe\u7a0b\u5185\u5bb9\u5f3a\u5ea6\u6216\u53d8\u73b0\u8def\u5f84\u4e0e\u201c\u517c\u804c\u201d\u7684\u7075\u6d3b\u5ea6\u3001\u4f4e\u6295\u5165\u9884\u671f\u4e0d\u7b26\uff0c\u53ef\u80fd\u4ea7\u751f\u9519\u914d\u611f\u3002\n    3.  **\u7ecf\u6d4e\u538b\u529b**: **\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5df2\u8868\u73b0\u51fa\u4ef7\u683c\u654f\u611f\uff0c\u82e5\u540e\u7eed\u5b66\u4e60\u9700\u8981\u989d\u5916\u6295\u5165\uff08\u5982\u8bbe\u5907\u3001\u65f6\u95f4\uff09\uff0c\u53ef\u80fd\u56e0\u7ecf\u6d4e\u538b\u529b\u653e\u5f03\u6216\u6295\u8bc9\u3002\n    4.  **\u5b66\u4e60\u6548\u679c\u7126\u8651**: **\u4f4e\u98ce\u9669**\u3002\u7528\u6237\u4e3b\u52a8\u53cd\u9988\u95ee\u9898\u5e76\u5bfb\u6c42\u89e3\u7b54\uff0c\u76ee\u524d\u5fc3\u6001\u79ef\u6781\uff0c\u4f46\u82e5\u540e\u671f\u8fdb\u6b65\u7f13\u6162\u6216\u63a5\u5355\u4e0d\u987a\uff0c\u53ef\u80fd\u4ea7\u751f\u7126\u8651\u3002\n    5.  **\u9500\u552e\u8bef\u5bfc**: **\u4e2d\u98ce\u9669**\u3002\u9500\u552e\u5b58\u5728**\u8fc7\u5ea6\u627f\u8bfa\u503e\u5411**\uff08\u5982\u201c\u540d\u989d\u5df2\u7ecf\u5360\u4e0b\u4e86\u201d\u3001\u201c\u5e26\u4f60\u8fdb\u5267\u7ec4\u7fa4\u201d\uff09\uff0c\u82e5\u540e\u7eed\u8d44\u6e90\u672a\u5151\u73b0\uff0c\u6613\u5f15\u53d1\u6295\u8bc9\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\n    7.  **\u7ade\u54c1\u5bf9\u6bd4/\u8d1f\u9762\u4fe1\u606f**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u91cd\u5927\u96f7\u533a**:\n    *   **\u3010\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u53d8\u73b0\u8bf1\u5bfc\u3011**\uff1a\u9500\u552e\u9891\u7e41\u4f7f\u7528\u9ad8\u6536\u5165\u6848\u4f8b\uff08\u201c\u524d\u5e74\u521a\u5165\u884c\uff0c\u5e72\u4e863\u4e2a\u6708\u540e\u8f6c\u5168\u804c\u4e86\u201d\u3001\u201c\u7efc\u5408\u6536\u51651W\u5de6\u53f3\u201d\uff09\u548c\u7d27\u8feb\u6027\u8bdd\u672f\uff08\u201c\u6700\u540e\u4e00\u6b21\u5f55\u97f3\u8003\u6838\u201d\u3001\u201c\u73b0\u573a\u53d1\u4f18\u60e0\u5238\u201d\uff09\uff0c**\u6d89\u5acc\u5938\u5927\u5ba3\u4f20\u548c\u5236\u9020\u7126\u8651**\uff0c\u662f\u4e3b\u8981\u5408\u89c4\u98ce\u9669\u70b9\u3002\n    *   **\u3010\u9884\u671f\u7ba1\u7406\u7f3a\u5931\u3011**\uff1a\u5168\u7a0b\u672a\u4e0e\u7528\u6237\u7406\u6027\u63a2\u8ba8\u517c\u804c\u6709\u58f0\u4e66\u6f14\u64ad\u7684\u5e02\u573a\u73b0\u72b6\u3001\u6536\u5165\u5468\u671f\u3001\u6295\u5165\u8981\u6c42\uff0c**\u672a\u8fdb\u884c\u98ce\u9669\u63d0\u793a**\u3002\n*   **\u5408\u89c4\u7455\u75b5**:\n    *   \u9500\u552e\u8fc7\u7a0b\u5b58\u5728\u660e\u663e\u7684\u201c\u8bad\u7ec3\u8425-\u76f4\u64ad-\u8f6c\u5316\u201dSOP\u6d41\u7a0b\uff0c\u5229\u7528\u6253\u5361\u3001\u5956\u52b1\u3001\u793e\u7fa4\u8fdb\u9636\uff08\u201c\u4e8c\u8f6e\u8003\u6838\u7fa4\u201d\uff09\u7b49\u673a\u5236\u8425\u9020\u6c1b\u56f4\u5e76\u65bd\u52a0\u538b\u529b\u3002\n    *   \u7528\u6237\u8be2\u95ee\u8bbe\u5907\u65f6\uff0c\u9500\u552e\u56de\u7b54\u201c\u5e73\u53f0\u4e0d\u4f1a\u5f3a\u5236\u8bbe\u5907\u8d2d\u4e70\u201d\uff0c\u6b64\u8bf4\u6cd5**\u89c4\u907f\u4e86\u4e13\u4e1a\u5f55\u97f3\u5bf9\u8bbe\u5907\u6709\u57fa\u672c\u8981\u6c42\u7684\u4e8b\u5b9e**\uff0c\u53ef\u80fd\u4e3a\u540e\u7eed\u7ea0\u7eb7\u57cb\u4e0b\u9690\u60a3\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**: **\u504f\u5dee**\u3002\u7528\u6237\u52a8\u673a\uff08\u517c\u804c\u53d8\u73b0\uff09\u4e0e\u4ea7\u54c1\u53ef\u80fd\u627f\u8bfa\u7684\u8def\u5f84\uff08\u7cfb\u7edf\u5b66\u4e60\u3001\u957f\u671f\u6295\u5165\uff09\u5b58\u5728\u6f5c\u5728\u504f\u5dee\u30022\u4e2a\u6708\u8bfe\u7a0b\u5468\u671f\u8f83\u77ed\uff0c\u4e0e\u201c\u4ece\u96f6\u5230\u63a5\u5355\u201d\u7684\u5ba2\u89c2\u5b66\u4e60\u89c4\u5f8b\u53ef\u80fd\u4e0d\u5339\u914d\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **\u9996\u5468\u91cd\u70b9\u6821\u6b63\u53d8\u73b0\u9884\u671f\u4e0e\u5b66\u4e60\u89c4\u5212**\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**:\n    1.  **\u9884\u671f\u7ba1\u7406\uff08\u5173\u952e\uff09**: \u5165\u5b6624\u5c0f\u65f6\u5185\uff0c\u5fc5\u987b\u8fdb\u884c\u4e00\u5bf9\u4e00\u6c9f\u901a\uff0c**\u660e\u786e\u91cf\u5316\u5b66\u4e60\u76ee\u6807**\u3002\u8be2\u95ee\u7528\u6237\u5bf9\u201c\u517c\u804c\u201d\u7684\u5177\u4f53\u5b9a\u4e49\uff08\u6bcf\u5468\u6295\u5165\u65f6\u95f4\u3001\u671f\u671b\u6708\u6536\u5165\uff09\uff0c\u5e76\u57fa\u4e8e\u884c\u4e1a\u73b0\u72b6\u7ed9\u51fa\u5ba2\u89c2\u3001\u9636\u68af\u5316\u7684\u53d8\u73b0\u8def\u5f84\u56fe\uff08\u5982\uff1a3\u4e2a\u6708\u57fa\u7840\u5b66\u4e60\uff0c6\u4e2a\u6708\u540e\u53ef\u80fd\u63a5\u7b80\u5355\u65c1\u767d\u5355\uff09\u3002**\u660e\u786e\u544a\u77e5\u524d\u671f\u4ee5\u5b66\u4e60\u6253\u78e8\u4e3a\u4e3b\uff0c\u53d8\u73b0\u9700\u8981\u8fc7\u7a0b\u548c\u79ef\u7d2f**\u3002\n    2.  **\u5b66\u4e60\u89c4\u5212**: \u6839\u636e\u5176\u9009\u62e9\u76842\u4e2a\u6708\u8bfe\u7a0b\uff0c\u5e2e\u52a9\u5236\u5b9a\u6e05\u6670\u7684\u3001\u4ee5\u638c\u63e1\u6838\u5fc3\u6280\u80fd\u4e3a\u5bfc\u5411\u7684\u5b66\u4e60\u8ba1\u5212\uff0c\u5f3a\u8c03\u57fa\u7840\u7684\u91cd\u8981\u6027\uff0c\u964d\u4f4e\u5176\u5bf9\u201c\u5feb\u901f\u63a5\u5355\u201d\u7684\u6025\u5207\u671f\u5f85\u3002\n    3.  **\u8d44\u6e90\u5bf9\u63a5**: \u8c28\u614e\u7ba1\u7406\u5176\u5bf9\u201c\u5267\u7ec4\u7fa4\u201d\u3001\u201c\u7248\u6743\u4e66\u201d\u7684\u9884\u671f\u3002\u660e\u786e\u8bf4\u660e\u8fd9\u4e9b\u8d44\u6e90\u7684\u6027\u8d28\u548c\u83b7\u53d6\u95e8\u69db\uff0c\u907f\u514d\u8ba9\u5176\u4ea7\u751f\u201c\u62a5\u540d\u5373\u80fd\u63a5\u5355\u201d\u7684\u8bef\u89e3\u3002\n    4.  **\u6301\u7eed\u5173\u6ce8**: \u5bc6\u5207\u5173\u6ce8\u5176\u524d\u671f\u5b66\u4e60\u53cd\u9988\uff0c\u5c24\u5176\u662f\u9047\u5230\u96be\u70b9\u65f6\u7684\u60c5\u7eea\u53d8\u5316\u3002\u56e0\u5176\u652f\u4ed8\u80fd\u529b\u6709\u9650\uff0c\u9700\u907f\u514d\u63a8\u8350\u4efb\u4f55\u989d\u5916\u7684\u4ed8\u8d39\u9879\u76ee\uff08\u5982\u8bbe\u5907\u3001\u52a0\u8d2d\u8bfe\uff09\u3002\n    5.  **\u98ce\u9669\u5907\u6848**: \u5c06\u8be5\u5b66\u5458\u6807\u8bb0\u4e3a\u201c\u9ad8\u9884\u671f\u7ba1\u7406\u9700\u6c42\u201d\u7528\u6237\uff0c\u8bb0\u5f55\u9500\u552e\u73af\u8282\u7684\u8fc7\u5ea6\u627f\u8bfa\u8bdd\u672f\uff0c\u4ee5\u5907\u540e\u7eed\u5ba2\u8bc9\u5904\u7406\u3002\n\n{\"core_type\": \"T7 \u52a1\u5b9e\u63a2\u7d22\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u9996\u5468\u91cd\u70b9\u6821\u6b63\u53d8\u73b0\u9884\u671f\"}";
