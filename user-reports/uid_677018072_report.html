    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677018072 (\u6635\u79f0\uff1a\u5c0f\u9896) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e - \u300e\u96e8\u6850\u300f/\u521d\u6674(\u6c64\u529b) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u5199\u4f5c\u966a\u8dd1\u8425 (\u65d7\u8230\u73ed4380\u5143 / \u57fa\u7840\u73ed2880\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u672a\u77e5** (\u9500\u552e\u591a\u6b21\u63d0\u53ca\u652f\u6301\u82b1\u5457/\u4fe1\u7528\u5361\uff0c\u4f46\u7528\u6237\u672a\u900f\u9732\u652f\u4ed8\u65b9\u5f0f) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u7528\u6237\u5728\u770b\u56de\u653e\u65f6\u201c\u7761\u7740\u4e86\u201d\uff0c\u6697\u793a\u5b66\u4e60\u65f6\u95f4\u53ef\u80fd\u4e0d\u89c4\u5f8b) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u672a\u77e5** (\u672a\u63d0\u53ca) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** (\u7f3a\u4e4f\u5e74\u9f84\u3001\u804c\u4e1a\u3001\u5bb6\u5ead\u72b6\u51b5\u3001\u8fc7\u5f80\u7ecf\u9a8c\u7b49\u5173\u952e\u80cc\u666f\u4fe1\u606f) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u2b07\u4f4e**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u7eaf\u4e3a\u51e0\u5929\u5185\u63d0\u73b0\u4fdd\u5e95\u800c\u6765(\u4f4e\u6781\u5371)**\u3002\u6838\u5fc3\u5173\u6ce8\u70b9\u9ad8\u5ea6\u805a\u7126\u4e8e\u201c\u53d8\u73b0\u901f\u5ea6\u201d\u3001\u201c\u901a\u8fc7\u7387\u201d\u3001\u201c\u6ca1\u4eba\u4e70\u600e\u4e48\u529e\u201d\uff0c\u5bf9\u6280\u80fd\u6210\u957f\u3001\u521b\u4f5c\u672c\u8eab\u5174\u8da3\u6781\u4f4e\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u5047\u5982\u6ca1\u6709\u4eba\u4e70\u6211\u5199\u7684\u5267\u672c\u662f\u4e0d\u662f\u4e00\u4e2a\u6708\u5c31\u51e0\u767e\u51e0\u5343\u7684\u6536\u5165\u5440\u201d\n> \u201c\u611f\u89c9\u8981\u8d5a\u94b1\u8fd8\u662f\u8981\u5199\u77ed\u5267\uff0c\u4f46\u662f\u5c31\u6015\u77ed\u5267\u6ca1\u6709\u4eba\u4e70\u201d\n> \u201c\u77ed\u5267\u7684\u901a\u8fc7\u7387\u662f\u591a\u5c11\u554a\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u5bf9\u4ef7\u683c\u654f\u611f\uff08\u53cd\u590d\u8be2\u95ee\u4e0d\u540c\u8bfe\u7a0b\u5305\uff09\uff0c\u4f46\u672a\u63d0\u53ca\u501f\u8d37\u538b\u529b\uff0c\u9500\u552e\u63a8\u8350\u82b1\u5457\u5206\u671f\u65f6\u672a\u660e\u786e\u62d2\u7edd\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u6709\u5b66\u4e60\u610f\u613f\uff08\u770b\u56de\u653e\uff09\uff0c\u4f46\u7cbe\u529b\u6709\u9650\uff08\u770b\u56de\u653e\u7761\u7740\uff09\uff0c\u6697\u793a\u65f6\u95f4\u53ef\u80fd\u4e0d\u5145\u88d5\u6216\u7cbe\u529b\u6613\u5206\u6563\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u672a\u77e5** \u2014 \u672a\u63d0\u53ca\uff0c\u4fe1\u606f\u7f3a\u5931\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b07\u4f4e\u6781\u5371**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u81ea\u6211\u6000\u7591\uff08\u201c\u6015\u6ca1\u4eba\u4e70\u201d\u3001\u201c\u6015\u9ebb\u70e6\u8001\u5e08\u201d\uff09\uff0c\u5bf9\u672a\u6765\u7684\u4e0d\u786e\u5b9a\u6027\u5145\u6ee1\u7126\u8651\uff0c\u6781\u5ea6\u9700\u8981\u5916\u90e8\uff08\u5e73\u53f0\u3001\u8001\u5e08\uff09\u7684\u515c\u5e95\u627f\u8bfa\u6765\u83b7\u5f97\u5b89\u5168\u611f\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u6211\u8981\u662f\u5199\u7684\u591a\u966a\u8dd1\u8001\u5e08\u4f1a\u4e0d\u4f1a\u5acc\u9ebb\u70e6\u201d\n> \u201c\u611f\u89c9\u8981\u8d5a\u94b1\u8fd8\u662f\u8981\u5199\u77ed\u5267\uff0c\u4f46\u662f\u5c31\u6015\u77ed\u5267\u6ca1\u6709\u4eba\u4e70\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u526f\u4e1a\u53d8\u73b0\u7684\u6781\u5ea6\u6e34\u671b\u4e0e\u5bf9\u81ea\u8eab\u80fd\u529b\u3001\u5e02\u573a\u4e0d\u786e\u5b9a\u6027\u7684\u6df1\u5ea6\u6050\u60e7\u5e76\u5b58\u3002\u4ed6\u5bb3\u6015\u6295\u5165\uff08\u65f6\u95f4\u3001\u91d1\u94b1\uff09\u540e\u6ca1\u6709\u56de\u62a5\uff0c\u672c\u8d28\u662f**\u5bf9\u7ecf\u6d4e\u5b89\u5168\u611f\u7684\u7126\u8651**\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u7684\u627f\u8bfa\u4e0e\u201c\u88ab\u6258\u5e95\u201d\u7684\u5b89\u5168\u611f**\u3002\u4ed6\u9700\u8981\u660e\u786e\u7684\u201c\u4fdd\u8fc7\u201d\u901a\u9053\u3001\u8001\u5e08\u201c\u4e0d\u5acc\u9ebb\u70e6\u201d\u7684\u4fdd\u8bc1\uff0c\u4ee5\u53ca\u201c\u5e73\u53f0\u4f1a\u5e2e\u4f60\u201d\u7684\u5f3a\u4f9d\u8d56\u5173\u7cfb\uff0c\u6765\u5bf9\u51b2\u4ed6\u5185\u5fc3\u7684\u98ce\u9669\u6050\u60e7\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2** \u7c7b (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u8bba** (\u52a8\u673a\u7eaf\u5ea6\u4f4e\uff0c\u8d44\u6e90\u5e95\u5ea7\u4e2d\uff0c\u5fc3\u7406\u5f39\u6027\u4f4e) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u672a\u53d1\u73b0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u8a00\u8bba)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a/\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4e2d | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u82e5\u4e3a\u7792\u62a5\uff0c\u540e\u7eed\u538b\u529b\u53ef\u80fd\u663e\u73b0\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | \u65f6\u95f4\u7cbe\u529b\u6709\u9650\uff0c\u4e00\u65e6\u8bfe\u7a0b\u8282\u594f\u7d27\u51d1\u6216\u4f5c\u4e1a\u96be\u5ea6\u63d0\u5347\uff0c\u6781\u6613\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u81ea\u8d23\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | \u6838\u5fc3\u98ce\u9669\uff01\u4e00\u65e6\u6295\u7a3f\u88ab\u62d2\u3001\u6216\u611f\u89c9\u8001\u5e08\u6307\u5bfc\u4e0d\u591f\u201c\u8d34\u8eab\u201d\uff0c\u4f1a\u7acb\u523b\u4ea7\u751f\u201c\u88ab\u9a97\u4e86\u201d\u3001\u201c\u5b66\u4e0d\u4f1a\u201d\u7684\u5d29\u6e83\u611f\uff0c\u89e6\u53d1\u9000\u8d39\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u6781\u9ad8** | **\u6700\u6838\u5fc3\u98ce\u9669\uff01** \u5bf9\u201c\u4e00\u4e2a\u6708\u5185\u53d8\u73b0\u201d\u62b1\u6709\u5e7b\u60f3\u3002\u82e5\u5b66\u4e601-2\u4e2a\u6708\u540e\u672a\u80fd\u63a5\u5355\u6216\u6536\u5165\u8fdc\u4f4e\u4e8e\u9884\u671f\uff0c\u4f1a\u7acb\u523b\u66b4\u6012\u8981\u6c42\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c4-8\u5468**\u3002\u6b64\u65f6\u5df2\u8fc7\u65b0\u624b\u871c\u6708\u671f\uff0c\u5f00\u59cb\u63a5\u89e6\u771f\u5b9e\u6295\u7a3f\uff0c\u4e00\u65e6\u906d\u9047\u7b2c\u4e00\u6b21\u62d2\u7a3f\u6216\u63a5\u5355\u4e0d\u987a\uff0c\u9000\u8d39\u98ce\u9669\u5c06\u6025\u5267\u98d9\u5347\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5c0f\u9896\u4f60\u597d\uff0c\u6211\u662f\u4f60\u7684\u73ed\u4e3b\u4efbXX\u3002\u6211\u770b\u4e86\u4f60\u7684\u6c9f\u901a\u8bb0\u5f55\uff0c\u77e5\u9053\u4f60\u6700\u5173\u5fc3\u7684\u662f\u2018\u5199\u4e86\u80fd\u4e0d\u80fd\u5356\u51fa\u53bb\u2019\u3002\u4f60\u653e\u5fc3\uff0c\u54b1\u4eec\u8bfe\u7a0b\u6700\u5927\u7684\u4ef7\u503c\u5c31\u662f\u2018\u6295\u7a3f\u901a\u9053\u2019\u548c\u2018\u4e00\u5bf9\u4e00\u966a\u8dd1\u6539\u7a3f\u2019\u3002**\u6211\u7684\u4efb\u52a1\u5c31\u662f\u76ef\u7740\u4f60\uff0c\u76f4\u5230\u4f60\u7684\u7a3f\u5b50\u8fc7\u7a3f\u4e3a\u6b62\u3002** \u8fc7\u7a0b\u4e2d\u6709\u4efb\u4f55\u5361\u58f3\u3001\u89c9\u5f97\u9ebb\u70e6\uff0c\u968f\u65f6\u627e\u6211\uff0c\u8fd9\u5c31\u662f\u6211\u7684\u5de5\u4f5c\u3002\u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u628a\u2018\u6015\u6ca1\u4eba\u4e70\u2019\u53d8\u6210\u2018\u4e0b\u4e00\u5355\u5356\u591a\u5c11\u2019\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011**\u3002\u5fc5\u987b\u5c06\u201c\u53d8\u73b0\u201d\u4f5c\u4e3a\u552f\u4e00\u6838\u5fc3\u76ee\u6807\uff0c\u6240\u6709\u6559\u5b66\u56f4\u7ed5\u201c\u5982\u4f55\u5199\u51fa\u80fd\u8fc7\u7a3f\u3001\u80fd\u5356\u94b1\u7684\u6545\u4e8b\u201d\u5c55\u5f00\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T4\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a**\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011** + **\u3010\u7cbe\u786e\u6d3e\u5355\u62e6\u622a\u3011**\u3002\u73ed\u4e3b\u4efb\u9700\u9ad8\u98911v1\u8ddf\u8fdb\uff0c\u7ed9\u4e88\u5938\u5f20\u9f13\u52b1\uff0c\u5e76\u4e25\u683c\u7ba1\u7406\u5176\u6536\u76ca\u9884\u671f\uff0c\u53cd\u590d\u5f3a\u8c03\u201c\u79ef\u7d2f\u8fc7\u7a0b\u201d\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7edd\u4e0d\u5bf9\u5176\u63cf\u7ed8\u201c\u901f\u6210\u66b4\u5bcc\u201d\u7684\u84dd\u56fe\uff1b\u7edd\u4e0d\u5728\u5176\u672a\u5b8c\u6210\u57fa\u7840\u7ec3\u4e60\u65f6\u5c31\u9f13\u52b1\u6295\u7a3f\uff1b\u7edd\u4e0d\u5bf9\u5176\u4f7f\u7528\u4efb\u4f55\u6279\u8bc4\u6216\u5426\u5b9a\u6027\u8bed\u8a00\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u57fa\u7840\u73ed\u5b66\u4e60\u671f\u95f4\u8fdb\u884c\u4efb\u4f55\u5347\u5355\u63a8\u9500**\u3002\u5fc5\u987b\u5728\u5176\u6210\u529f\u83b7\u5f97\u7b2c\u4e00\u7b14\u5c0f\u989d\u6536\u5165\u3001\u5efa\u7acb\u521d\u6b65\u4fe1\u5fc3\u540e\uff0c\u518d\u8c28\u614e\u63a2\u8ba8\u8fdb\u9636\u53ef\u80fd\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u5047\u5982\u6ca1\u6709\u4eba\u4e70\u6211\u5199\u7684\u5267\u672c\u662f\u4e0d\u662f\u4e00\u4e2a\u6708\u5c31\u51e0\u767e\u51e0\u5343\u7684\u6536\u5165\u5440**\u201d \u2014\u2014 \u6838\u5fc3\u7126\u8651\uff1a\u6295\u5165\u4ea7\u51fa\u6bd4\uff0c\u6050\u60e7\u4f4e\u6536\u76ca\u3002\n2. > \u201c**\u611f\u89c9\u8981\u8d5a\u94b1\u8fd8\u662f\u8981\u5199\u77ed\u5267\uff0c\u4f46\u662f\u5c31\u6015\u77ed\u5267\u6ca1\u6709\u4eba\u4e70**\u201d \u2014\u2014 \u65e2\u60f3\u8d5a\u5feb\u94b1\uff0c\u53c8\u6781\u5ea6\u7f3a\u4e4f\u81ea\u4fe1\u548c\u5b89\u5168\u611f\u3002\n3. > \u201c**\u6211\u8981\u662f\u5199\u7684\u591a\u966a\u8dd1\u8001\u5e08\u4f1a\u4e0d\u4f1a\u5acc\u9ebb\u70e6**\u201d \u2014\u2014 \u5178\u578b\u4f4e\u5fc3\u7406\u5f39\u6027\u8868\u73b0\uff0c\u5bb3\u6015\u88ab\u5426\u5b9a\u3001\u88ab\u5acc\u5f03\uff0c\u9700\u8981\u65e0\u9650\u5ea6\u7684\u5305\u5bb9\u548c\u4fdd\u8bc1\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4 \u641e\u94b1\u7ed3\u679c\u8bba\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7ecf\u6d4e\u5b89\u5168\u4fdd\u969c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u73ed\u4e3b\u4efb\u9ad8\u98911v1\u60c5\u7eea\u6258\u5e95 + \u4e25\u683c\u7ba1\u7406\u53d8\u73b0\u9884\u671f\uff0c\u7528\u201c\u6295\u7a3f\u901a\u9053\u201d\u548c\u201c\u966a\u8dd1\u6539\u7a3f\u201d\u4f5c\u4e3a\u5b89\u5168\u627f\u8bfa\u7684\u6838\u5fc3\u5356\u70b9\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u8bba\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}\n```";
