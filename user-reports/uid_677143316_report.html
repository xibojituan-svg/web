    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## \u4e00\u3001 \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u4e2d\u9ad8**\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5174\u8da3\u9a71\u52a8\u4e0e\u526f\u4e1a\u63a2\u7d22\u52a8\u673a\u3002\u57fa\u4e8e\u8fc7\u5f80\u4e3b\u6301/\u9886\u8bf5\u7ecf\u9a8c\uff0c\u5bf9\u6709\u58f0\u6f14\u64ad\u201c\u4e0d\u6392\u65a5\u201d\u4e14\u201c\u559c\u6b22\u201d\uff0c\u613f\u610f\u6295\u5165\u65f6\u95f4\u7cbe\u529b\u3002\u4e3b\u52a8\u8be2\u95ee\u82f1\u8bed\u8bd5\u97f3\u673a\u4f1a\uff0c\u663e\u793a\u6280\u80fd\u8fc1\u79fb\u610f\u613f\u3002**\u4f46**\uff0c\u6838\u5fc3\u52a8\u673a\u504f\u5411\u201c\u5174\u8da3\u53d1\u5c55\u201d\u548c\u201c\u7075\u6d3b\u63a5\u6d3b\u201d\uff0c\u5bf9\u53d8\u73b0\u7684\u6025\u8feb\u6027\u3001\u786e\u5b9a\u6027\u8981\u6c42\u672a\u51f8\u663e\uff0c\u5b58\u5728\u201c\u8bd5\u8bd5\u770b\u201d\u7684\u63a2\u7d22\u5fc3\u6001\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u4e2d\u9ad8**\u3002\u7528\u6237\u62e5\u6709\u7a33\u5b9a\u4e3b\u4e1a\uff08\u4e8b\u4e1a\u5355\u4f4d\uff09\uff0c\u5df2\u5a5a\uff08\u4e0b\u6708\u7ed3\u5a5a\uff09\uff0c\u7ecf\u6d4e\u57fa\u7840\u4e0e\u65f6\u95f4\u7a33\u5b9a\u6027\u8f83\u597d\u3002\u5177\u5907\u82f1\u8bed\u4e13\u4e1a\u80cc\u666f\u53ca\u6d77\u5916\u7ecf\u5386\uff0c\u4e3a\u5dee\u5f02\u5316\u7ade\u4e89\u529b\u3002\u6709\u745c\u4f3d\u9986\u521b\u4e1a\u7ecf\u5386\uff0c\u663e\u793a\u4e00\u5b9a\u7684\u9879\u76ee\u6267\u884c\u4e0e\u81ea\u4e3b\u5b66\u4e60\u80fd\u529b\u3002**\u5173\u952e\u4fe1\u606f\u7f3a\u5931**\uff1a\u5177\u4f53\u4ed8\u8d39\u80fd\u529b\uff08\u6536\u5165\u6c34\u5e73\uff09\u3001\u6bcf\u65e5\u53ef\u7a33\u5b9a\u6295\u5165\u7684\u5b66\u4e60/\u7ec3\u4e60\u65f6\u957f\u672a\u660e\u786e\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u9ad8**\u3002\u5b66\u4e60\u6001\u5ea6\u79ef\u6781\u3001\u914d\u5408\u5ea6\u9ad8\u3002\u4e3b\u52a8\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0ePia\u620f\u3001\u5bfb\u6c42\u53cd\u9988\uff08\u201c\u5e2e\u6211\u770b\u770b\u201d\uff09\u3002\u80fd\u63a5\u53d7\u5efa\u8bbe\u6027\u6279\u8bc4\u5e76\u8c03\u6574\uff08\u201c\u6211\u518d\u7ec6\u7ec6\u770b\u770b\u611f\u53d7\u4e00\u4e0b\u201d\uff09\u3002\u81ea\u6211\u8c03\u8282\u80fd\u529b\u597d\uff08\u7531\u7126\u8651\u6a21\u4eff\u8f6c\u5411\u63a5\u7eb3\u81ea\u7136\u58f0\u97f3\uff09\u3002\u5bf9\u5b66\u4e60\u8fc7\u7a0b\u672c\u8eab\u8868\u73b0\u51fa\u4eab\u53d7\uff08\u201c\u633a\u597d\u73a9\u513f\u201d\uff09\u3002\n\n## \u4e8c\u3001 ABCD\u5224\u5b9a\u6811\u5206\u6790\n\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u4e8e2026-04-08 14:04:01 \u63d0\u53ca\u4ef7\u683c\u201c2380\u201d\uff0c\u5e76\u5728\u540e\u7eed\u5b8c\u6210\u62a5\u540d\u3001\u63d0\u4f9bUID\u3001\u9886\u53d6\u7248\u6743\u4e66\uff0c\u8868\u660e\u5df2\u5b8c\u6210\u8bfe\u7a0b\u8d2d\u4e70\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u98ce\u9669\u8f83\u4f4e**\u3002\u7528\u6237\u4e3b\u52a8\u63d0\u53ca\u201c\u4e0b\u4e2a\u6708\u7ed3\u5a5a\u201d\u53ca\u201c\u6211\u8001\u516c\u8bf4\u4f60\u5c31\u7528\u4f60\u81ea\u5df1\u7684\u6700\u81ea\u7136\u7684\u201d\uff0c\u6697\u793a\u4f34\u4fa3\u77e5\u60c5\u4e14\u6301\u652f\u6301\u6001\u5ea6\u3002\u672a\u63d0\u53ca\u5176\u4ed6\u5bb6\u5ead\u6210\u5458\u53cd\u5bf9\u610f\u89c1\u3002**\u4f46\u4ecd\u9700\u786e\u8ba4**\u5927\u989d\u652f\u51fa\uff082380\u5143\uff09\u662f\u5426\u5df2\u83b7\u5f97\u914d\u5076\u5b8c\u5168\u77e5\u60c5\u540c\u610f\u3002\n*   **\u6700\u7ec8\u5224\u5b9a**: **B\u7c7b\u7528\u6237 (\u7a33\u5065\u63a2\u7d22\u8005)**\u3002\u52a8\u673a\u6e90\u4e8e\u5174\u8da3\u4e0e\u6280\u80fd\u62d3\u5c55\uff0c\u975e\u751f\u5b58\u538b\u529b\u6216\u6295\u673a\u66b4\u5bcc\u3002\u8d44\u6e90\u5e95\u5ea7\u7a33\u56fa\uff0c\u80fd\u627f\u53d7\u8bd5\u9519\u6210\u672c\u3002\u5fc3\u7406\u5f39\u6027\u5f3a\uff0c\u6ce8\u91cd\u5b66\u4e60\u8fc7\u7a0b\u4e0e\u81ea\u6211\u6210\u957f\u3002\u7b26\u5408B\u7c7b\u201c\u6709\u7a33\u5b9a\u4fdd\u969c\uff0c\u5bfb\u6c42\u4ef7\u503c\u5ef6\u4f38\u201d\u7684\u7279\u5f81\u3002\n\n## \u4e09\u3001 \u7528\u6237\u539f\u578b\u5339\u914d\n\n*   **\u5339\u914d\u539f\u578b**: **T3 \u5174\u8da3\u9a71\u52a8\u7684\u526f\u4e1a\u63a2\u7d22\u8005**\u3002\n    *   **\u4f9d\u636e**: \u4e3b\u4e1a\u7a33\u5b9a\uff08\u4e8b\u4e1a\u5355\u4f4d\uff09\uff0c\u5bfb\u6c42\u57fa\u4e8e\u5174\u8da3\uff08\u6709\u58f0\uff09\u548c\u65e2\u6709\u4f18\u52bf\uff08\u58f0\u97f3\u3001\u82f1\u8bed\uff09\u7684\u7075\u6d3b\u526f\u4e1a\u3002\u5b66\u4e60\u8fc7\u7a0b\u6109\u60a6\u9a71\u52a8\uff0c\u5bf9\u53d8\u73b0\u6709\u671f\u5f85\u4f46\u975e\u552f\u4e00\u76ee\u6807\u3002\u884c\u52a8\u529b\u5f3a\uff0c\u4e50\u4e8e\u5c1d\u8bd5\uff08\u5f55\u591a\u79cd\u8bd5\u97f3\u3001\u53c2\u4e0ePia\u620f\uff09\u3002\n\n## \u56db\u3001 \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u98ce\u9669\u7b49\u7ea7\uff1a\u4f4e)\n\n\u9010\u9879\u6392\u67e57\u79cd\u9000\u8d39\u6839\u56e0\uff1a\n1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**: \u98ce\u9669**\u4f4e**\u3002\u7528\u6237\u5bf9\u5b66\u4e60\u672c\u8eab\u6709\u83b7\u5f97\u611f\uff0c\u9500\u552e\u53cd\u9988\u6b63\u9762\uff0c\u5efa\u7acb\u4e86\u201c\u8fdb\u6b65\u201d\u8ba4\u77e5\u3002\u4f46\u9700\u5173\u6ce8\u957f\u671f\u201c\u63a5\u5355\u53d8\u73b0\u201d\u9884\u671f\u7ba1\u7406\u3002\n2.  **\u7ecf\u6d4e\u538b\u529b**: \u98ce\u9669**\u4f4e**\u3002\u6709\u4e8b\u4e1a\u5355\u4f4d\u7a33\u5b9a\u6536\u5165\uff0c\u63d0\u53ca\u76842380\u5143\u5bf9\u5176\u6784\u6210\u91cd\u5927\u7ecf\u6d4e\u538b\u529b\u7684\u53ef\u80fd\u6027\u8f83\u4f4e\u3002\n3.  **\u65f6\u95f4\u51b2\u7a81**: \u98ce\u9669**\u4e2d\u4f4e**\u3002\u7528\u6237\u9700\u5e73\u8861\u4e3b\u4e1a\u3001\u65b0\u5a5a\u4e0e\u5b66\u4e60\uff0c\u4f46\u5df2\u5c55\u793a\u51fa\u89c4\u5212\u80fd\u529b\uff08\u534f\u8c03\u4e2d\u5348\u529e\u4e8b\u4e0e\u542c\u8bfe\uff09\u3002\u9700\u5173\u6ce8\u5165\u804c\u540e\u7cfb\u7edf\u8bfe\u7a0b\u7684\u65f6\u95f4\u8981\u6c42\u3002\n4.  **\u5bb6\u5ead\u53cd\u5bf9**: \u98ce\u9669**\u4f4e**\u3002\u73b0\u6709\u4fe1\u606f\u663e\u793a\u914d\u5076\u652f\u6301\u3002\n5.  **\u9500\u552e\u8bef\u5bfc**: \u98ce\u9669**\u4f4e**\u3002\u9500\u552e\u6c9f\u901a\u4e2d\u5f3a\u8c03\u4e86\u201c\u788e\u7247\u5316\u65f6\u95f4\u201d\u3001\u201c\u517c\u804c\u201d\uff0c\u672a\u53d1\u73b0\u5938\u5927\u627f\u8bfa\u3002\u4f46\u5b58\u5728**\u6f5c\u5728\u96f7\u533a**\uff1a\u9500\u552e\u63d0\u53ca\u201c\u770b\u597d\u4f60\u201d\u3001\u201c\u7ed9\u4f60\u6311\u4e86\u4e00\u672c\u7248\u6743\u4e66\u201d\u3001\u201c\u5e26\u4f60\u5165\u884c\u201d\u7b49\u4e2a\u4eba\u5316\u627f\u8bfa\uff0c\u53ef\u80fd\u62c9\u9ad8\u7528\u6237\u5bf9\u4e2a\u6027\u5316\u6276\u6301\u7684\u9884\u671f\u3002\n6.  **\u4ea7\u54c1\u4e0d\u7b26**: \u98ce\u9669**\u4f4e**\u3002\u7528\u6237\u5bf9\u8bfe\u7a0b\u5185\u5bb9\uff08\u65c1\u767d\u3001\u89d2\u8272\u97f3\u3001Pia\u620f\uff09\u79ef\u6781\u53c2\u4e0e\u5e76\u8ba4\u53ef\u3002\n7.  **\u7ade\u54c1\u6bd4\u8f83/\u51b2\u52a8\u6d88\u8d39**: \u98ce\u9669**\u4f4e**\u3002\u7528\u6237\u51b3\u7b56\u57fa\u4e8e\u51e0\u5929\u4f53\u9a8c\u4e0e\u5174\u8da3\uff0c\u975e\u77ac\u65f6\u51b2\u52a8\u3002\n\n## \u4e94\u3001 \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n\n*   **\u57fa\u672c\u5408\u89c4**: \u9500\u552e\u6d41\u7a0b\u5b8c\u6574\uff0c\u5305\u542b\u4f53\u9a8c\u3001\u4f5c\u4e1a\u3001\u53cd\u9988\u3001\u8f6c\u5316\u73af\u8282\u3002\u672a\u53d1\u73b0\u660e\u663e\u4ef7\u683c\u6b3a\u8bc8\u6216\u5f3a\u5236\u6d88\u8d39\u3002\n*   **\u6f5c\u5728\u98ce\u9669\u70b9**:\n    1.  **\u9884\u671f\u7ba1\u7406**: \u9500\u552e\u591a\u6b21\u4f7f\u7528\u201c\u5e26\u4f60\u201d\u3001\u201c\u5a18\u5bb6\u4eba\u201d\u3001\u201c\u770b\u597d\u4f60\u201d\u7b49\u60c5\u611f\u7ed1\u5b9a\u4e0e\u4e2a\u4eba\u627f\u8bfa\u8bdd\u672f\uff0c**\u53ef\u80fd\u6a21\u7cca\u5e73\u53f0\u6807\u51c6\u5316\u670d\u52a1\u7684\u8fb9\u754c**\uff0c\u6613\u5728\u540e\u671f\u670d\u52a1\u4e2d\u5f15\u53d1\u201c\u627f\u8bfa\u672a\u5151\u73b0\u201d\u7684\u611f\u77e5\u3002\n    2.  **\u7a00\u7f3a\u6027\u8425\u9020**: \u201c\u540d\u989d\u5df2\u5360\u4e0b\u201d\u3001\u201c\u73b0\u573a\u53d1\u4f18\u60e0\u5238\u201d\u7b49\u5c5e\u4e8e\u5e38\u89c4\u8425\u9500\u624b\u6bb5\uff0c\u672a\u89c1\u8fdd\u89c4\u3002\n    3.  **\u5bb6\u5ead\u77e5\u60c5**: \u867d\u7528\u6237\u63d0\u53ca\u914d\u5076\uff0c\u4f46\u9500\u552e\u672a\u4e3b\u52a8\u8be2\u95ee\u6216\u786e\u8ba4\u5927\u989d\u652f\u51fa\u7684\u5bb6\u5ead\u77e5\u60c5\u540c\u610f\u60c5\u51b5\uff0c**\u5b58\u5728\u6d41\u7a0b\u7455\u75b5**\u3002\n\n## \u516d\u3001 \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**: **\u5339\u914d**\u3002\u7528\u6237\u5174\u8da3\u3001\u57fa\u7840\u3001\u5b66\u4e60\u6001\u5ea6\u4e0e\u6709\u58f0\u6f14\u64ad\u7cfb\u7edf\u8bfe\u5339\u914d\u5ea6\u9ad8\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **\u9996\u5468\u5f3a\u5316\u9884\u671f\u7ba1\u7406\u4e0e\u5b66\u4e60\u89c4\u5212**\n*   **\u5177\u4f53\u884c\u52a8\u6307\u5357**:\n    1.  **\u9884\u671f\u6821\u6b63 (\u5173\u952e)**: \u9996\u5468\u5185\u4e3b\u52a8\u6c9f\u901a\uff0c\u795d\u8d3a\u5165\u5b66\uff0c\u5e76**\u6e29\u548c\u3001\u660e\u786e\u5730\u6821\u6b63\u53d8\u73b0\u9884\u671f**\u3002\u5f3a\u8c03\u201c\u6280\u80fd\u79ef\u7d2f-\u4f5c\u54c1\u79ef\u7d2f-\u673a\u4f1a\u83b7\u53d6\u201d\u7684\u884c\u4e1a\u89c4\u5f8b\uff0c\u5c06\u9500\u552e\u9636\u6bb5\u201c\u5e26\u4f60\u201d\u7684\u611f\u6027\u627f\u8bfa\uff0c\u8f6c\u5316\u4e3a\u201c\u5e73\u53f0\u8d44\u6e90+\u4e2a\u4eba\u52aa\u529b+\u73ed\u4e3b\u4efb\u8f85\u5bfc\u201d\u7684\u7406\u6027\u5408\u4f5c\u6846\u67b6\u3002\n    2.  **\u65f6\u95f4\u89c4\u5212**: \u534f\u52a9\u5176\u57fa\u4e8e\u4e8b\u4e1a\u5355\u4f4d\u5de5\u4f5c\u8282\u594f\uff0c\u5236\u5b9a\u5207\u5b9e\u53ef\u884c\u7684\u6bcf\u5468\u5b66\u4e60\u4e0e\u7ec3\u4e60\u8ba1\u5212\uff0c\u9884\u9632\u56e0\u65f6\u95f4\u51b2\u7a81\u5bfc\u81f4\u6389\u961f\u3002\n    3.  **\u4f18\u52bf\u6fc0\u6d3b**: \u6807\u6ce8\u5176\u201c\u82f1\u8bed\u4e13\u4e1a\u201d\u53ca\u201c\u5fa1\u59d0\u97f3\u201d\u7279\u8d28\uff0c\u5728\u540e\u7eed\u5b66\u4e60\u6216\u6d3b\u52a8\u4e2d\u63a8\u8350\u76f8\u5173\u8bd5\u97f3\u673a\u4f1a\u6216\u4e13\u9898\u5185\u5bb9\uff0c\u589e\u5f3a\u5176\u81ea\u6211\u6548\u80fd\u611f\u3002\n    4.  **\u5173\u7cfb\u5efa\u7acb**: \u5ef6\u7eed\u5176\u4e0e\u201c\u5e08\u59d0\u201d\u7684\u826f\u597d\u4e92\u52a8\u57fa\u7840\uff0c\u4ee5\u4e13\u4e1a\u3001\u652f\u6301\u7684\u59ff\u6001\u5efa\u7acb\u4fe1\u4efb\uff0c\u6210\u4e3a\u5176\u5728\u7cfb\u7edf\u5b66\u4e60\u9636\u6bb5\u7684\u4e3b\u8981\u652f\u6301\u8282\u70b9\u3002\n    5.  **\u98ce\u9669\u76d1\u6d4b**: \u9ed8\u9ed8\u89c2\u5bdf\u5176\u5728\u65b0\u5a5a\u751f\u6d3b\u4e0e\u5b66\u4e60\u6295\u5165\u95f4\u7684\u5e73\u8861\u60c5\u51b5\uff0c\u5982\u6709\u65f6\u95f4\u7d27\u5f20\u8ff9\u8c61\uff0c\u53ca\u65f6\u4ecb\u5165\u63d0\u4f9b\u7075\u6d3b\u6027\u5efa\u8bae\u3002\n\n{\"core_type\": \"T3 \u5174\u8da3\u9a71\u52a8\u7684\u526f\u4e1a\u63a2\u7d22\u8005\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u9996\u5468\u6821\u6b63\u53d8\u73b0\u9884\u671f\u4e0e\u89c4\u5212\"}";
        document.getElementById('content').innerHTML = marked.parse(markdownText);
