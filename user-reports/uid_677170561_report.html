    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677170561\u7684\u7528\u6237\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677170561 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u7b71\u6590\u5440~\u5b98\u65b9\u62db\u52df\u5b98(\u90d1\u5143\u535a) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u9a6c\u62c9\u96c5\u6709\u58f0\u6f14\u64ad\u9ad8\u9636\u8bfe\u7a0b (7380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3 (\u5fae\u7c92\u8d37)** |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1 (\u9700\u505a\u996d\u3001\u7167\u987e\u5bb6\u5ead) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u672a\u77e5 (\u4fe1\u606f\u7f3a\u5931)** |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e2d\u7b49 (\u7528\u6237\u4e3b\u52a8\u8868\u8fbe\u8f83\u5c11\uff0c\u4f46\u5173\u952e\u4fe1\u53f7\u660e\u786e) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b07\u4f4e\n- **\u7279\u5f81\u901f\u5199**\uff1a\u7eaf\u4e3a\u51e0\u5929\u5185\u63d0\u73b0\u4fdd\u5e95\u800c\u6765(\u4f4e\u6781\u5371)\u3002\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u201c\u8d5a\u94b1\u201d\u548c\u201c\u5e73\u8861\u5bb6\u5ead\u201d\uff0c\u5bf9\u6280\u80fd\u672c\u8eab\u5174\u8da3\u5ea6\u4f4e\uff0c\u6781\u5ea6\u5173\u6ce8\u53d8\u73b0\u901f\u5ea6\u548c\u8fd8\u6b3e\u538b\u529b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5c31\u662f\u60f3\u8d5a\u94b1\uff01\u4e0a\u73ed\u53c8\u4e0d\u80fd\u7167\u987e\u5230\u5bb6\u5ead\uff01\u201d > \u201c\u62c5\u5fc3\u5206\u671f\u4ed8\u6b3e\u5230\u8fd8\u6b3e\u65e5\u6ca1\u6536\u5165\u6ca1\u6cd5\u8fd8\u94b1[\u5c34\u5c2c]\u201d > \u201c\u5e0c\u671b\u53ef\u4ee5\u5feb\u70b9\u8d5a\u94b1\uff0c\u6ca1\u6709\u6b20\u8fc7\u522b\u4eba\u8fd9\u4e48\u591a\u94b1\u5f88\u62c5\u5fc3\uff01\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e\u6781\u5371** \u2014 \u62a5\u540d\u8d39\u7528\u9700\u901a\u8fc7\u5fae\u7c92\u8d37\u501f\u6b3e\uff0c\u5b58\u5728\u660e\u786e\u7684\u8fd8\u6b3e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e** \u2014 \u9700\u517c\u987e\u5bb6\u5ead\uff08\u505a\u996d\u3001\u7167\u987e\u5b69\u5b50\uff09\uff0c\u5468\u672b\u65f6\u95f4\u7d27\u5f20\uff0c\u5b66\u4e60\u65f6\u95f4\u5448\u788e\u7247\u5316\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u672a\u77e5** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff0c\u4f46\u201c\u4e0a\u73ed\u4e0d\u80fd\u7167\u987e\u5bb6\u5ead\u201d\u7684\u8868\u8ff0\u6697\u793a\u5bb6\u5ead\u8d23\u4efb\u91cd\uff0c\u53ef\u80fd\u7f3a\u4e4f\u652f\u6301\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)\u3002\u9762\u5bf9\u7b80\u5355\u7684\u6280\u672f\u64cd\u4f5c\uff08\u5982\u4e0b\u8f7d\u7248\u6743\u4e66\uff09\u8868\u73b0\u51fa\u201c\u5b8c\u5168\u4e0d\u4f1a\u201d\u7684\u6050\u614c\u548c\u4f9d\u8d56\uff1b\u5bf9\u672a\u6765\u7684\u8fd8\u6b3e\u538b\u529b\u8868\u73b0\u51fa\u9ad8\u5ea6\u7126\u8651\u548c\u81ea\u6211\u6000\u7591\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u771f\u7684\u5b8c\u5168\u4e0d\u4f1a\u201d > \u201c\u6559\u6559\u6211[\u6342\u8138]\u201d > \u201c\u7b2c\u4e00\u6b21\u82b1\u8fd9\u4e48\u591a\u94b1\u505a\u8fd9\u6837\u7684\u4e8b[\u6342\u8138]\u201d > \u201c\u597d\u62c5\u5fc3\u8fd8\u4e0d\u8d77[\u5c34\u5c2c]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 (\u7126\u8651\u4fdd\u969c)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u7ecf\u6d4e\u5b89\u5168\u611f\u7684\u6781\u5ea6\u532e\u4e4f**\u3002\u4f5c\u4e3a\u5168\u804c\u5bb6\u5ead\u4e3b\u5987\u4e0e\u793e\u4f1a\u8131\u8282\u540e\uff0c\u5bf9\u81ea\u8eab\u4ef7\u503c\u548c\u7ecf\u6d4e\u72ec\u7acb\u80fd\u529b\u4ea7\u751f\u4e25\u91cd\u6000\u7591\uff0c\u5e0c\u671b\u901a\u8fc7\u5feb\u901f\u53d8\u73b0\u6765\u62b5\u5fa1\u201c\u8fd8\u4e0d\u8d77\u503a\u201d\u7684\u751f\u5b58\u7126\u8651\uff0c\u5e76\u5bfb\u6c42\u201c\u80fd\u7167\u987e\u5bb6\u5ead\u201d\u7684\u804c\u4e1a\u5b89\u5168\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u9632\u62a4\u76fe\u5f0f\u7684\u5b89\u5168\u611f\u4e0e\u786e\u5b9a\u6027**\u3002\u9700\u8981\u660e\u786e\u3001\u53ef\u9884\u671f\u7684\u53d8\u73b0\u8def\u5f84\uff08\u54ea\u6015\u662f\u5c0f\u989d\u3001\u6e10\u8fdb\u5f0f\u7684\uff09\u6765\u5bf9\u51b2\u5176\u501f\u8d37\u538b\u529b\u5e26\u6765\u7684\u6050\u614c\uff0c\u5e76\u63d0\u4f9b\u201c\u624b\u628a\u624b\u201d\u7ea7\u7684\u64cd\u4f5c\u6307\u5bfc\u6765\u6d88\u9664\u5176\u6280\u672f\u81ea\u5351\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udd34 D\u7c7b** (\u89e6\u53d1T8-D\u7edd\u8def\u8d4c\u5f92\u9694\u7206\u534f\u8bae) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T8-D \u7edd\u8def\u8d4c\u5f92 (\u5f00\u5c40\u9694\u7206)** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a**\ud83d\udd34\u5df2\u89e6\u53d1 D \u7c7b\u7194\u65ad\u7ea2\u7ebf\uff01**\n- **\u89e6\u53d1\u56e0\u7531**\uff1a**\u590d\u5408\u4fe1\u53f7\u89e6\u53d1**\uff1a1) **\u7f51\u8d37\u786e\u8ba4**\uff1a\u660e\u786e\u4f7f\u7528\u5fae\u7c92\u8d37\u501f\u6b3e\u62a5\u540d\u30022) **\u4fdd\u5e95\u5e7b\u60f3\u4e0e\u6781\u7aef\u7126\u8651**\uff1a\u53cd\u590d\u8868\u8fbe\u201c\u62c5\u5fc3\u8fd8\u4e0d\u8d77\u94b1\u201d\u3001\u201c\u5e0c\u671b\u5feb\u70b9\u8d5a\u94b1\u201d\u30023) **\u8d44\u6e90\u5e95\u5ea7\u5d29\u584c\u7ea7**\uff1a\u8d44\u91d1\u77ed\u677f\u4e3a\u8d1f\u503c\uff08\u501f\u8d37\uff09\uff0c\u4e14\u5fc3\u7406\u5f39\u6027\u6781\u4f4e\u3002\u7b26\u5408**T8-D\u7edd\u8def\u8d4c\u5f92**\u7684\u5168\u90e8\u89e6\u53d1\u6761\u4ef6\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u9ad8 | **\u4fe1\u606f\u7f3a\u5931\u4f46\u98ce\u9669\u6781\u9ad8**\u3002\u82e5\u5bb6\u4eba\uff08\u5c24\u5176\u662f\u914d\u5076\uff09\u53d1\u73b0\u5176\u501f\u8d37\u62a5\u540d\uff0c\u6781\u6613\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u5e76\u5f3a\u5236\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u9ad8 | \u788e\u7247\u5316\u65f6\u95f4+\u6280\u672f\u64cd\u4f5c\u6050\u614c\uff08\u5982\u4e0b\u8f7d\u4e66\u7c4d\uff09\uff0c\u6781\u6613\u56e0\u8ddf\u4e0d\u4e0a\u5b66\u4e60\u8fdb\u5ea6\u800c\u81ea\u8d23\u3001\u5d29\u6e83\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u9ad8 | \u4efb\u4f55\u6280\u672f\u969c\u788d\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u3001\u4f5c\u4e1a\u63d0\u4ea4\u5931\u8d25\uff09\u6216\u7b2c\u4e00\u5355\u53d8\u73b0\u5ef6\u8fdf\uff0c\u90fd\u53ef\u80fd\u76f4\u63a5\u89e6\u53d1\u5176\u201c\u8fd8\u4e0d\u8d77\u503a\u201d\u7684\u7126\u8651\uff0c\u5bfc\u81f4\u60c5\u7eea\u5d29\u6e83\u548c\u9000\u8d39\u8981\u6c42\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u6781\u9ad8 | \u5bf9\u201c\u7b2c\u4e8c\u5468\u5f00\u901a\u63a5\u5355\u6743\u9650\u201d\u62b1\u6709\u4e0d\u5207\u5b9e\u9645\u7684\u671f\u5f85\u3002\u82e5\u5b66\u4e601-2\u4e2a\u6708\u540e\u4ecd\u672a\u83b7\u5f97\u53ef\u89c2\u6536\u5165\uff0c\u5de8\u5927\u7684\u5fc3\u7406\u843d\u5dee\u5c06\u76f4\u63a5\u8f6c\u5316\u4e3a\u5ba2\u8bc9\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u5b66\u4e60\u96be\u5ea6\u589e\u52a0\uff0c\u82e5\u63a5\u5355\u53d8\u73b0\u672a\u8fbe\u9884\u671f\uff0c\u5176\u501f\u8d37\u538b\u529b\u5c06\u8f6c\u5316\u4e3a\u5bf9\u5e73\u53f0\u7684\u6124\u6012\u548c\u6307\u8d23\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> **\u3010\u4ea4\u5e95\u724c\u5f0f\u5b89\u629a + \u8bbe\u5b9a\u6700\u4f4e\u9884\u671f\u3011**\uff1a\u201c\u7a0b\u7a0b\uff0c\u6211\u770b\u5230\u4f60\u4e3a\u4e86\u5b66\u4e60\u4e0b\u4e86\u5f88\u5927\u51b3\u5fc3\uff0c\u4e5f\u611f\u53d7\u5230\u4e86\u4f60\u7684\u538b\u529b\u3002\u54b1\u4eec\u5148\u4e0d\u6025\u7740\u60f3\u2018\u591a\u4e45\u80fd\u8d5a\u56de\u5b66\u8d39\u2019\uff0c\u90a3\u6837\u592a\u7126\u8651\u4e86\u3002\u6211\u5e26\u4f60\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u5148\u628a\u57fa\u7840\u6253\u7262\u3002**\u6211\u8ddf\u4f60\u4ea4\u4e2a\u5e95\uff0c\u6709\u58f0\u8fd9\u884c\u80fd\u8d5a\u94b1\uff0c\u4f46\u9700\u8981\u65f6\u95f4\u548c\u7ec3\u4e60\u79ef\u7d2f**\u3002\u54b1\u4eec\u5148\u5b9a\u4e2a\u5c0f\u76ee\u6807\uff0c\u6bd4\u5982\u7b2c\u4e00\u4e2a\u6708\u80fd\u72ec\u7acb\u5b8c\u6210\u4e00\u4e2a\u5b8c\u6574\u7684\u4f5c\u54c1\uff0c\u4f60\u770b\u884c\u5417\uff1f\u6709\u4efb\u4f55\u64cd\u4f5c\u4e0a\u7684\u95ee\u9898\uff0c\u968f\u65f6\u558a\u6211\uff0c\u6211\u624b\u628a\u624b\u6559\u4f60\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** (\u56e0\u5176\u660e\u786e\u53d8\u73b0\u8bc9\u6c42\uff0c\u4f46\u5fc5\u987b**\u964d\u7ef4\u6267\u884c**)\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u5f3a\u5236\u6302\u8f7d **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305 (\u6ee1\u914d\u7279\u79cdC)\u3011** + **\u3010\u964d\u7ef4\u7269\u7406\u4ee3\u529e\u5305 (\u7279\u79cdA)**\u3011\u3002\u7528\u6781\u81f4\u7684\u60c5\u611f\u6258\u5e95\u548c\u64cd\u4f5c\u4ee3\u52b3\uff0c\u9632\u6b62\u5176\u56e0\u6280\u672f\u6050\u614c\u548c\u7126\u8651\u800c\u5d29\u76d8\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u5176\u4f7f\u7528\u4efb\u4f55\u201c\u5feb\u901f\u8d5a\u94b1\u201d\u3001\u201c\u8f7b\u677e\u53d8\u73b0\u201d\u7684\u8bdd\u672f**\uff0c\u8fd9\u7b49\u4e8e\u70b9\u71c3\u70b8\u836f\u6876\u3002\n    2. **\u7981\u6b62\u5e03\u7f6e\u9ad8\u96be\u5ea6\u6216\u9700\u8981\u590d\u6742\u8f6f\u4ef6\u64cd\u4f5c\u7684\u4f5c\u4e1a**\uff0c\u521d\u671f\u4f5c\u4e1a\u5fc5\u987b\u624b\u673a\u53ef\u5b8c\u6210\u3001\u6b65\u9aa4\u6781\u7b80\u3002\n    3. **\u7981\u6b62\u5728\u672a\u5efa\u7acb\u5145\u5206\u4fe1\u4efb\u524d\uff0c\u8fdb\u884c\u4efb\u4f55\u5f62\u5f0f\u7684\u5347\u5355\u6216\u4ea4\u53c9\u9500\u552e**\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5347\u5355**\u3002\u5728\u786e\u8ba4\u5176\u5df2\u7a33\u5b9a\u5b66\u4e60\u81f3\u5c113\u4e2a\u6708\uff0c\u4e14\u4ea7\u751f\u7b2c\u4e00\u7b14\u771f\u5b9e\u6536\u5165\u3001\u60c5\u7eea\u8d8b\u4e8e\u7a33\u5b9a\u524d\uff0c\u7981\u6b62\u63a8\u8350\u4efb\u4f55\u989d\u5916\u4ed8\u8d39\u9879\u76ee\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u5c31\u662f\u60f3\u8d5a\u94b1\uff01\u4e0a\u73ed\u53c8\u4e0d\u80fd\u7167\u987e\u5230\u5bb6\u5ead\uff01**\u201d **(\u52a8\u673a\u7eaf\u5ea6\u4f4e\uff0c\u751f\u5b58\u538b\u529b\u9a71\u52a8)**\n2. > \u201c**\u62c5\u5fc3\u5206\u671f\u4ed8\u6b3e\u5230\u8fd8\u6b3e\u65e5\u6ca1\u6536\u5165\u6ca1\u6cd5\u8fd8\u94b1[\u5c34\u5c2c]**\u201d **-> \u201c\u501f\u4e86\u5fae\u7c92\u8d37[\u5c34\u5c2c]\u201d** **(\u8d44\u6e90\u5e95\u5ea7\u5d29\u584c\uff0c\u501f\u8d37\u62a5\u540d)**\n3. > \u201c**\u597d\u62c5\u5fc3\u8fd8\u4e0d\u8d77[\u5c34\u5c2c]**\u201d **-> \u201c\u53ef\u662f\u76ee\u524d\u6211\u9664\u4e86\u60a8\u7684\u5fae\u4fe1\u53f7\u6ca1\u6709\u522b\u7684\u8054\u7cfb\u65b9\u5f0f\uff0c\u5982\u679c\u505a\u4e0d\u597d\u6211\u80fd\u9000\u8d39\u5417\uff1f\u201d** **(\u5fc3\u7406\u5f39\u6027\u6781\u4f4e\uff0c\u7126\u8651\u8f6c\u5316\u4e3a\u9000\u8d39\u8bd5\u63a2)**\n4. > \u201c**\u771f\u7684\u5b8c\u5168\u4e0d\u4f1a**\u201d **-> \u201c\u6559\u6559\u6211[\u6342\u8138]\u201d** **(\u6570\u5b57\u64cd\u4f5c\u6050\u614c\uff0c\u4f9d\u8d56\u6027\u5f3a)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T8-D \u7edd\u8def\u8d4c\u5f92\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u9700\u6c42\uff08\u7ecf\u6d4e\u4fdd\u969c\u4e0e\u804c\u4e1a\u51fa\u8def\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7acb\u5373\u542f\u52a8T8-D\u5371\u673a\u5904\u7f6e\u534f\u8bae\uff0c\u8fdb\u884c\u201c\u6218\u7565\u6027\u62d2\u552e\u201d\u6216\u53d6\u5f97\u201c\u77e5\u60c5\u540c\u610f\u201d\u5e76\u5168\u7a0b\u6781\u81f4\u6258\u5e95\uff0c\u4e25\u9632\u4efb\u4f55\u9884\u671f\u7ba1\u7406\u5931\u8bef\u3011**\u3002\n\n```json\n{\"core_type\": \"T8-D \u7edd\u8def\u8d4c\u5f92\u578b\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf (\u5f3a\u5236\u964d\u7ef4+\u6ee1\u914d\u7597\u6108)\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}\n```";
