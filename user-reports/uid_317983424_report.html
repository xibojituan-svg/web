        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a317983424\u7684\u7528\u6237\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a317983424 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-02-08 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u65e0\u6781(\u9ec4\u7956\u6cb3) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u77ed\u89c6\u9891/\u6f2b\u5267\u76f8\u5173\u8bfe\u7a0b |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff08\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff08\u672a\u660e\u786e\u63d0\u53ca\u4f5c\u606f\uff0c\u4f46\u63d0\u53ca\u201c\u8d76\u5176\u4ed6\u79d1\u76ee\u7684\u4f5c\u4e1a\u201d\uff0c\u63a8\u6d4b\u4e3a\u788e\u7247\u5316\u62fc\u51d1\u65f6\u95f4\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e** |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\uff08\u6709\u660e\u786e\u5b66\u4e60\u884c\u4e3a\u3001\u4f5c\u4e1a\u63d0\u4ea4\u3001\u63a5\u5355\u610f\u5411\uff0c\u4f46\u7f3a\u4e4f\u5bb6\u5ead\u3001\u8d44\u91d1\u3001\u5de5\u4f5c\u7b49\u80cc\u666f\u4fe1\u606f\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34(\u4e2d)**\u3002\u7528\u6237\u6709\u660e\u786e\u7684\u53d8\u73b0\u9a71\u52a8\uff08\u201c\u9760\u5e73\u53f0\u6323\u94b1\uff0c\u4e0d\u7528\u518d\u6253\u5de5\u770b\u4eba\u8138\u8272\u201d\uff09\uff0c\u4f46\u540c\u65f6\u4e5f\u8868\u73b0\u51fa\u5bf9\u6280\u672f\u672c\u8eab\u7684\u597d\u5947\u548c\u94bb\u7814\uff08\u4e3b\u52a8\u5c1d\u8bd5AI Agent\u3001\u8ffd\u95ee\u5de5\u4f5c\u6d41\u3001\u5173\u6ce8\u6548\u7387\uff09\uff0c\u5e76\u975e\u7eaf\u7cb9\u7684\u201c\u51e0\u5929\u63d0\u73b0\u201d\u5fc3\u6001\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5f97\u505a\u5230\u5c06\u6765\u9760\u63a5\u5355\u6323\u94b1\uff0c\u4e0d\u7528\u518d\u6253\u5de5\u770b\u4eba\u8138\u8272\u201d > \u201c\u5173\u952e\u662f\u6211\u4f30\u8ba1\u5f97\u5151\u6362\u66f4\u591a\u79ef\u5206\u201d > \u201c\u5148\u7ec3\u7ec3\u624b\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[**\u4e2d**] \u2014 \u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\uff0c\u4f46\u5173\u6ce8\u201c\u5151\u6362\u79ef\u5206\u201d\u7b49\u6210\u672c\u7ec6\u8282\uff0c\u63a8\u6d4b\u8d44\u91d1\u975e\u6781\u5ea6\u5145\u88d5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[**\u4e2d**] \u2014 \u80fd\u6309\u65f6\u63d0\u4ea4\u4f5c\u4e1a\u3001\u4e3b\u52a8\u52a0\u7ec3\uff0c\u4f46\u540c\u65f6\u4e5f\u62a5\u4e86\u201c\u5f88\u591a\u201d\u5176\u4ed6\u526f\u4e1a\u8bfe\uff0c\u65f6\u95f4\u88ab\u591a\u4efb\u52a1\u5206\u5272\uff0c\u5c5e\u4e8e**\u788e\u7247\u5316\u62fc\u51d1**\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[**\u672a\u77e5**] \u2014 \u4fe1\u606f\u7f3a\u5931\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a[**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**]\u3002\u9762\u5bf9\u73ed\u4e3b\u4efb\u7684\u4e25\u5389\u6279\u8bc4\uff08\u4f5c\u4e1a\u683c\u5f0f\u95ee\u9898\u3001\u8fd0\u955c\u4e0d\u4e13\u4e1a\uff09\uff0c\u7528\u6237\u53cd\u5e94\u662f\u201c\u4e00\u6b65\u4e00\u6b65\u6765\u5427\u201d\u3001\u201c\u5148\u7ec3\u7ec3\u624b\u201d\u3001\u201c\u6211\u5f04\u597d\u4e86\u201d\uff0c\u5e76\u4e3b\u52a8\u5bfb\u6c42\u6539\u8fdb\u6e05\u5355\uff08\u201c\u5217\u51fa\u6765\u54ea\u4e9b\u8981\u6539\u8fdb\u201d\uff09\u3002**\u6ca1\u6709\u51fa\u73b0\u60c5\u7eea\u5d29\u6e83\u3001\u81ea\u6211\u5426\u5b9a\u6216\u4f9d\u8d56\u5b89\u629a\u7684\u8ff9\u8c61**\uff0c\u8868\u73b0\u51fa\u52a1\u5b9e\u3001\u89e3\u51b3\u95ee\u9898\u5bfc\u5411\u7684\u5fc3\u6001\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u90fd\u8fd9\u6837\u4e86\u8fd8\u4e0d\u884c\u7684\u8bdd\u6211\u4e5f\u6ca1\u8f99\u4e86[\u6d41\u6cea]\u201d \uff08\u6b64\u5904\u6d41\u6cea\u8868\u60c5\u66f4\u504f\u5411\u4e8e\u81ea\u5632\u800c\u975e\u5d29\u6e83\uff09> \u201c\u4e00\u6b65\u4e00\u6b65\u6765\u5427\u201d > \u201c\u660e\u5929\u52b3\u70e6\u60a8\u5e2e\u6211\u54b1\u4eec\u4e00\u8d77\u5199\u4e00\u5f20\u8868\uff0c\u5217\u51fa\u6765\u54ea\u4e9b\u8981\u6539\u8fdb\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u201c\u770b\u4eba\u8138\u8272\u201d\u6253\u5de5\u72b6\u6001\u7684\u4e0d\u6ee1\uff0c\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u786c\u6280\u80fd\u83b7\u5f97\u7ecf\u6d4e\u72ec\u7acb\u548c\u804c\u4e1a\u5c0a\u4e25\uff0c\u6446\u8131\u88ab\u652f\u914d\u7684\u5730\u4f4d\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u8d4b\u80fd**\u3002\u4ed6\u4e0d\u9700\u8981\u60c5\u611f\u9e21\u6c64\uff0c\u9700\u8981\u7684\u662f\u80fd\u5e2e\u4ed6\u66f4\u5feb\u3001\u66f4\u4e13\u4e1a\u5730\u201c\u63a5\u5355\u6323\u94b1\u201d\u7684\u786c\u6838\u6307\u5bfc\uff0c\u4ee5\u53ca\u5bf9\u4ed6\u201c\u9ad8\u6548\u201d\u3001\u201c\u52aa\u529b\u201d\u7279\u8d28\u7684\u8ba4\u53ef\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u9ad8\u52a8\u673a\u3001\u9ad8\u6267\u884c\u529b\u3001\u52a1\u5b9e\u3001\u6297\u538b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a[\u65e0]\n\n**\u3010\u5224\u5b9a\u6811\u8def\u5f84\u590d\u76d8\u3011**\uff1a\n1.  **\u4e09\u8f74\u8bc4\u5206**\uff1a\u52a8\u673a\u7eaf\u5ea6(5-6\u5206\uff0c\u4e2d)\u3001\u8d44\u6e90\u5e95\u5ea7(5-6\u5206\uff0c\u4e2d)\u3001\u5fc3\u7406\u5f39\u6027(7-8\u5206\uff0c\u9ad8)\u3002\n2.  **\u6267\u884c\u5224\u5b9a\u6811**\uff1a\n    *   **\u6b65\u9aa40\u652f\u4ed8\u6838\u67e5**\uff1a\u65e0\u6570\u636e\uff0c\u8df3\u8fc7\u3002\n    *   **\u6b65\u9aa41.5\u5bb6\u5ead\u51b3\u7b56\u6743**\uff1a\u65e0\u6570\u636e\uff0c\u8df3\u8fc7\u3002\n    *   **\u7b2c\u4e00\u5c42\u9694\u7206\u7b5b**\uff1a\u672a\u89e6\u53d1\u3002\n    *   **\u7b2c\u4e09\u5c42\u4e2d\u9ad8\u52a8\u673a\u7cbe\u5206 -> \u5206\u652fA\u9ad8\u5f39\u6027\u901a\u9053**\uff1a\u7528\u6237\u672a\u8868\u73b0\u51fa\u4e3b\u52a8\u7edf\u7b79\u884c\u4e3a\uff08\u975eT1\uff09\uff0c\u6280\u672f\u8ffd\u95ee\u6df1\u5ea6\u4e00\u822c\uff08\u975eT3\uff09\uff0c\u793e\u4ea4\u53d1\u8a00\u5360\u6bd4\u4e0d\u9ad8\uff08\u975eT7\uff09\u3002**\u547d\u4e2d\u9ed8\u8ba4\u5f52\u7c7b**\uff1a\u2192 **T2 \u4f4e\u8c03\u8001\u9ec4\u725b**\u3002\n3.  **ABCD\u6620\u5c04**\uff1aT2 \u2192 **B\u7c7b**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u76ee\u6807\u660e\u786e\uff0c\u5bb6\u5ead\u5e72\u9884\u53ef\u80fd\u6027\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u6838\u5fc3\u98ce\u9669\u70b9**\uff1a\u7528\u6237\u540c\u65f6\u62a5\u4e86\u201c\u5f88\u591a\u201d\u5176\u4ed6\u526f\u4e1a\u8bfe\uff0c\u65f6\u95f4\u788e\u7247\u5316\u3002\u82e5\u8bfe\u7a0b\u4efb\u52a1\u91cf\u8fc7\u5927\uff0c\u6216\u4e0e\u5176\u4ed6\u8bfe\u7a0b\u65f6\u95f4\u51b2\u7a81\uff0c\u53ef\u80fd\u5bfc\u81f4\u79ef\u538b\u3001\u7126\u8651\uff0c\u6700\u7ec8\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u627f\u53d7\u6279\u8bc4\u5e76\u4e3b\u52a8\u6539\u8fdb\uff0c\u7834\u9632\u98ce\u9669\u4f4e\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u7528\u6237\u6709\u5f3a\u70c8\u53d8\u73b0\u671f\u671b\u3002\u82e5\u5728\u9884\u671f\u65f6\u95f4\u5185\uff08\u59822-3\u4e2a\u6708\uff09\u672a\u80fd\u83b7\u5f97\u4efb\u4f55\u63a5\u5355\u673a\u4f1a\u6216\u6b63\u5411\u53cd\u9988\uff0c\u53ef\u80fd\u56e0\u201c\u6295\u5165\u65e0\u4ea7\u51fa\u201d\u800c\u4ea7\u751f\u9000\u8d39\u5ff5\u5934\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c8-12\u5468**\u3002\u6b64\u65f6\u57fa\u7840\u8bfe\u7a0b\u7ed3\u675f\uff0c\u8fdb\u5165\u5b9e\u6218/\u63a5\u5355\u9636\u6bb5\u3002\u82e5\u7528\u6237\u6295\u5165\u5927\u91cf\u65f6\u95f4\u5374\u8fdf\u8fdf\u65e0\u6cd5\u83b7\u5f97\u5546\u4e1a\u9a8c\u8bc1\uff08\u63a5\u5355/\u901a\u8fc7\u8bd5\u7a3f\uff09\uff0c\u6536\u76ca\u843d\u5dee\u611f\u5c06\u8fbe\u5230\u5cf0\u503c\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u770b\u5230\u4f60\u62a5\u4e86\u4e0d\u5c11\u8bfe\uff0c\u65f6\u95f4\u7ba1\u7406\u662f\u4e2a\u6311\u6218\u3002\u54b1\u4eec\u8fd9\u95e8\u8bfe\u7684\u6838\u5fc3\u662f\u2018\u7ec3\u51fa\u80fd\u8d5a\u94b1\u7684\u771f\u672c\u4e8b\u2019\uff0c\u6211\u4f1a\u91cd\u70b9\u5173\u6ce8\u4f60\u7684\u4f5c\u4e1a\u8d28\u91cf\u548c\u63a5\u5355\u8def\u5f84\u3002\u4f60\u6548\u7387\u9ad8\u3001\u80af\u94bb\u7814\uff0c\u8fd9\u662f\u6700\u5927\u7684\u4f18\u52bf\u3002\u54b1\u4eec\u5b9a\u4e2a\u76ee\u6807\uff1aX\u5468\u5185\u505a\u51fa\u7b2c\u4e00\u4e2a\u80fd\u62ff\u53bb\u8bd5\u7a3f\u7684\u4f5c\u54c1\uff0c\u6211\u5e2e\u4f60\u76ef\u7740\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\uff08B\u6a21\u5757\uff09**\u3011+ **\u9636\u6bb5\u6027\u63a5\u5355\u5b9e\u6218\u6307\u5f15\uff08B\u6a21\u5757\uff09**\u3002\u4ed6\u9700\u8981\u7684\u662f\u7cbe\u51c6\u7684\u6280\u672f\u6307\u5bfc\u548c\u771f\u5b9e\u7684\u5546\u4e1a\u673a\u4f1a\u901a\u9053\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u60c5\u611f\u966a\u4f34\u201d\u3001\u201c\u95f2\u804a\u516b\u5366\u201d\u7b49\u65b9\u5f0f\u8fc7\u5ea6\u6253\u6270\u3002\u907f\u514d\u5c06\u5176\u8bef\u5224\u4e3aT7\uff08\u6b7b\u5fe0\u7c89\uff09\u800c\u63d0\u4f9b\u8fc7\u591aC\u6a21\u5757\uff08\u60c5\u7eea\u4fdd\u59c6\uff09\uff0c\u8fd9\u4f1a\u88ab\u4ed6\u89c6\u4e3a\u6d6a\u8d39\u65f6\u95f4\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u8fdb\u884c**\u5927\u989d\u63a8\u4ecb**\uff0c\u4f46\u5fc5\u987b\u4e0e\u201c\u63d0\u5347\u63a5\u5355\u6210\u529f\u7387/\u5355\u4ef7\u201d\u5f3a\u76f8\u5173\u3002\u4f8b\u5982\uff0c\u63a8\u8350\u9ad8\u7ea7\u7684AI\u5de5\u5177\u8bfe\u3001\u5546\u4e1a\u63a5\u5355\u79c1\u6559\u8bfe\u7b49\u3002\u5207\u5fcc\u63a8\u9500\u7eaf\u5174\u8da3\u5a31\u4e50\u7c7b\u8bfe\u7a0b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5f97\u505a\u5230\u5c06\u6765\u9760\u63a5\u5355\u6323\u94b1\uff0c\u4e0d\u7528\u518d\u6253\u5de5\u770b\u4eba\u8138\u8272\u201d\n2. > \u201c\u5173\u952e\u662f\u4e0d\u80fd\u5e26\u7740\u4efb\u52a1\u8fc7\u5e74\u201d\u3001\u201c\u8fd9\u6bb5\u65f6\u95f4\u5f97\u628a\u4ee5\u524d\u548c\u5176\u5b83\u526f\u4e1a\u8bfe\u4e1a\u90fd\u8fc7\u4e00\u904d\u201d\n3. > \uff08\u88ab\u6279\u8bc4\u4f5c\u4e1a\u540e\uff09\u201c\u660e\u5929\u52b3\u70e6\u60a8\u5e2e\u6211\u54b1\u4eec\u4e00\u8d77\u5199\u4e00\u5f20\u8868\uff0c\u5217\u51fa\u6765\u54ea\u4e9b\u8981\u6539\u8fdb\uff0c\u7528\u4ec0\u4e48\u65b9\u6cd5\uff0c\u5982\u4f55\u7f29\u77ed\u65f6\u95f4\u5565\u7684\u201d\n4. > \u201c\u8c22\u8c22\u60a8\uff0c\u6211\u901a\u8fc7\u521d\u5ba1\u4e86\u201d\u3001\u201c\u73b0\u5728\u600e\u4e48\u529e\uff0c\u4ed6\u4eec\u4f1a\u600e\u4e48\u8054\u7cfb\u6211\uff0c\u6211\u53c8\u8be5\u505a\u90a3\u4e9b\u51c6\u5907\uff1f\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u4e0e\u7ecf\u6d4e\u72ec\u7acb\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6e05\u6670\u7684\u63a5\u5355\u8def\u5f84\u548c\u53ca\u65f6\u7684\u5546\u4e1a\u7ed3\u679c\u53cd\u9988\uff0c\u907f\u514d\u56e0\u591a\u4efb\u52a1\u5e76\u884c\u5bfc\u81f4\u7684\u5b66\u4e60\u79ef\u538b\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
