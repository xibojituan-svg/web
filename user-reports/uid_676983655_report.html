    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.3\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a676983655\uff08\u6635\u79f0\uff1a\u7ea2\u4e00\uff09\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v4.1.3)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a676983655 / \u6635\u79f0\uff1a\u7ea2\u4e00 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-12 \u81f3 2026-04-13 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e - \u5305\u5b503(\u674e\u4e50\u9633) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u5199\u4f5c\u8bfe\uff084380\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u7528\u5361\u5468\u8f6c**\uff08\u7528\u6237\u63d0\u53ca\u201c\u8fd9\u4e2a\u5361\u9501\u5b9a\u4e86\uff0c\u4e0d\u80fd\u652f\u4ed8\u201d\uff0c\u5e76\u4f7f\u7528\u4e86\u53e6\u4e00\u4e2a\u624b\u673a\u53f7\u4ed8\u6b3e\uff0c\u8868\u660e\u5b58\u5728\u652f\u4ed8\u5de5\u5177\u5207\u6362\u548c\u53ef\u80fd\u7684\u8d44\u91d1\u5468\u8f6c\u884c\u4e3a\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u7528\u6237\u80fd\u53ca\u65f6\u54cd\u5e94\u6d88\u606f\u3001\u5b8c\u6210\u4f5c\u4e1a\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u804c\u4e1a\u6216\u65f6\u95f4\u5b89\u6392\uff0c\u63a8\u65ad\u4e3a\u6709\u4e00\u5b9a\u81ea\u7531\u5ea6\u7684\u788e\u7247\u5316\u65f6\u95f4\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\uff08\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u5bb6\u5ead\u652f\u6301\u5ea6\u4fe1\u606f\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u804a\u5929\u8bb0\u5f55\u8be6\u7ec6\uff0c\u5305\u542b\u5b66\u4e60\u4e92\u52a8\u3001\u60c5\u611f\u4ea4\u6d41\u3001\u88ab\u9a97\u7ecf\u5386\u3001\u652f\u4ed8\u8fc7\u7a0b\u7b49\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u2b06\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u53d8\u73b0\u53cc\u91cd\u9a71\u52a8\u800c\u6765\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u611f\u89c9\u53ef\u4ee5\u5b66\u5230\u771f\u4e1c\u897f\uff0c\u8fd8\u6709\u6548\u7387\u201d\uff0c\u5bf9AI\u6539\u7a3f\u53d8\u73b0\uff08\u7cbe\u4fee\u5546\u5355\uff09\u8868\u73b0\u51fa\u5174\u8da3\uff08\u201c\u6709\u5440\u201d\uff09\uff0c\u5e76\u4e3b\u52a8\u63d0\u4ea4\u4f5c\u4e1a\u3002\u52a8\u673a\u517c\u5177\u6280\u80fd\u63d0\u5347\u548c\u52a1\u5b9e\u53d8\u73b0\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8fd9\u4e24\u5929\u4f53\u9a8c\u6bd4\u8f83\u597d\uff0c\u611f\u89c9\u53ef\u4ee5\u5b66\u5230\u771f\u4e1c\u897f\uff0c\u8fd8\u6709\u6548\u7387\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u652f\u4ed84380\u5143\u8bfe\u7a0b\uff0c\u4f46\u652f\u4ed8\u8fc7\u7a0b\u51fa\u73b0\u201c\u5361\u9501\u5b9a\u201d\uff0c\u9700\u5207\u6362\u652f\u4ed8\u65b9\u5f0f\uff0c\u8868\u660e\u8d44\u91d1\u5e76\u975e\u6781\u5ea6\u5bbd\u88d5\uff0c\u5b58\u5728\u5468\u8f6c\u8ff9\u8c61\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u8ddf\u4e0a\u8bfe\u7a0b\u8282\u594f\uff0c\u53ca\u65f6\u5b8c\u6210\u4f5c\u4e1a\u5e76\u4e92\u52a8\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u5168\u5929\u5019\u6295\u5165\u7684\u72b6\u6001\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u7528\u6237\u662f**\u7070\u4ea7\u53d7\u5bb3\u8005\u4e9a\u79cd**\u7684\u5178\u578b\u4ee3\u8868\uff0c\u66fe\u56e0\u8bef\u5165\u865a\u5047AI\u8bfe\u88ab\u9a97\u3002\u4f46\u9762\u5bf9\u632b\u6298\u65f6\uff0c\u5979\u8868\u73b0\u51fa\u6781\u5f3a\u7684\u97e7\u6027\u548c\u89e3\u51b3\u95ee\u9898\u7684\u80fd\u529b\uff1a\u4e3b\u52a8\u62a5\u8b66\u3001\u66f4\u6362\u8eab\u4efd\u8bc1\u548c\u94f6\u884c\u5361\u3001\u5411\u9500\u552e\u5bfb\u6c42\u7ef4\u6743\u5efa\u8bae\uff0c\u5e76\u7406\u6027\u5206\u6790\u201c\u6ca1\u6709\u53cd\u5e94\u8fc7\u6765\u7684\u4eba\uff0c\u4f30\u8ba1\u4ee5\u540e\u635f\u5931\u8fd8\u5927\u201d\u3002\u88ab\u9a97\u540e\u60c5\u7eea\u7a33\u5b9a\uff0c\u672a\u8fc1\u6012\u4e8e\u5f53\u524d\u5e73\u53f0\uff0c\u53cd\u800c\u56e0\u9500\u552e\uff08\u5305\u5b50\uff09\u7684\u771f\u8bda\u5e2e\u52a9\u548c\u8865\u507f\uff08\u8d60\u9001\u5168\u7cfbAI\u8bfe\u7a0b\u798f\u5229\uff09\u800c\u5efa\u7acb\u6781\u9ad8\u4fe1\u4efb\uff0c\u5e76\u6700\u7ec8\u4ed8\u8d39\u3002\u6574\u4e2a\u8fc7\u7a0b\u5c55\u73b0\u4e86\u6210\u719f\u7684\u5371\u673a\u5904\u7406\u80fd\u529b\u548c\u60c5\u7eea\u6062\u590d\u529b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4f60\u4e0d\u8981\u96be\u53d7\u4e86\u54c8\uff0c\u8fd9\u4e9b\u4eba\u662f\u9632\u4e0d\u80dc\u9632...\u6211\u4eec\u62a5\u8b66\u7684\u6709\u53cd\u5e94\u4e86...\u4eca\u5929\u5c31\u662f\u5fd9\u7740\u53bb\u7535\u4fe1\uff0c\u628a\u624b\u673a\u7279\u522b\u52a0\u5bc6\uff0c\u8eab\u4efd\u8bc1\u6302\u5931\u6362\u65b0\uff0c\u660e\u5929\u53bb\u94f6\u884c\u6362\u5361\uff0c\u6015\u9a97\u5b50\u505a\u574f\u4e8b\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42** \u4e0e **\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u7ebf\u4e0a\u4ea4\u6613\u73af\u5883\u7f3a\u4e4f\u5b89\u5168\u611f\uff0c\u6781\u5ea6\u6e34\u671b\u88ab\u771f\u8bda\u5bf9\u5f85\u548c\u83b7\u5f97\u4fdd\u969c**\u3002\u4f5c\u4e3a\u201c\u7070\u4ea7\u53d7\u5bb3\u8005\u4e9a\u79cd\u201d\uff0c\u5979\u66fe\u88ab\u865a\u5047\u5ba3\u4f20\u6b3a\u9a97\uff0c\u5bf9\u884c\u4e1a\u4e71\u8c61\u6709\u5207\u80a4\u4e4b\u75db\u3002\u5979\u7684\u6838\u5fc3\u75db\u70b9\u4e0d\u4ec5\u662f\u5b66\u6280\u80fd\u8d5a\u94b1\uff0c\u66f4\u662f**\u627e\u5230\u4e00\u4e2a\u53ef\u4fe1\u8d56\u3001\u6709\u62c5\u5f53\u3001\u80fd\u63d0\u4f9b\u5b89\u5168\u611f\u7684\u5e73\u53f0\u548c\u201c\u5bfc\u5e08\u201d**\uff0c\u4ee5\u5f25\u8865\u4e4b\u524d\u88ab\u9a97\u5e26\u6765\u7684\u521b\u4f24\u548c\u4e0d\u4fe1\u4efb\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u771f\u8bda\u3001\u900f\u660e\u4e0e\u201c\u4fdd\u62a4\u8005\u201d\u59ff\u6001**\u3002\u9500\u552e\u5305\u5b50\u901a\u8fc7\u5206\u4eab\u81ea\u8eab\u7ecf\u5386\uff08\u8d22\u52a1\u56f0\u5883\u3001AI\u5199\u4f5c\u6536\u5165\uff09\u3001\u63d0\u4f9b\u4e13\u4e1a\u7ef4\u6743\u6307\u5bfc\u3001\u5e76\u4e3b\u52a8\u7533\u8bf7\u8d85\u51fa\u5e38\u89c4\u7684\u8bfe\u7a0b\u798f\u5229\u4f5c\u4e3a\u8865\u507f\uff0c\u6210\u529f\u626e\u6f14\u4e86\u201c\u6b63\u76f4\u5584\u826f\u7684\u5f15\u8def\u4eba\u201d\u89d2\u8272\u3002\u7528\u6237\u9700\u8981\u7684\u4e0d\u662f\u753b\u997c\uff0c\u800c\u662f**\u91cd\u5efa\u4fe1\u4efb\u7684\u5b89\u5168\u7f51**\u548c**\u88ab\u7279\u6b8a\u5bf9\u5f85\u7684\u5c0a\u91cd\u611f**\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T7 \u72c2\u70ed\u6b7b\u5fe0\u7c89 (\u7070\u4ea7\u53d7\u5bb3\u8005\u4e9a\u79cd\u53d8\u4f53)** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u7528\u6237\u867d\u66fe\u53d7\u9a97\uff0c\u4f46\u5f53\u524d\u60c5\u7eea\u7a33\u5b9a\u3001\u652f\u4ed8\u884c\u4e3a\u7406\u6027\uff08\u975e\u501f\u8d37\uff09\uff0c\u4e14\u5bf9\u5e73\u53f0\u5efa\u7acb\u4fe1\u4efb\uff0c\u672a\u89e6\u53caT8-D\u7edd\u8def\u8d4c\u5f92\u7ea2\u7ebf\u3002\n\n**\u5224\u5b9a\u6811\u8def\u5f84\u63a8\u6f14**\uff1a\n1.  **\u652f\u4ed8\u6838\u67e5**\uff1a\u7528\u6237\u652f\u4ed8\u8fc7\u7a0b\u6709\u5361\u987f\uff08\u5361\u9501\u5b9a\uff09\uff0c\u4f46\u672a\u4f7f\u7528\u82b1\u5457/\u501f\u5457\u7b49\u9ad8\u98ce\u9669\u5206\u671f\uff0c\u4e0d\u89e6\u53d1\u4ea4\u6613\u4fe1\u53f7\u786c\u62e6\u622a\u3002\n2.  **\u4e09\u8f74\u8bc4\u5206**\uff1a\n    *   \u52a8\u673a\u7eaf\u5ea6\uff1a**\u9ad8 (7-8\u5206)**\u3002\u5173\u6ce8\u201c\u771f\u4e1c\u897f\u201d\u548c\u201c\u6548\u7387\u201d\uff0c\u5bf9\u53d8\u73b0\u673a\u4f1a\uff08\u7cbe\u4fee\u5546\u5355\uff09\u6709\u5174\u8da3\u3002\n    *   \u8d44\u6e90\u5e95\u5ea7\uff1a**\u4e2d (5-6\u5206)**\u3002\u8d44\u91d1\u3001\u65f6\u95f4\u5747\u5904\u4e8e\u4e2d\u7b49\u6c34\u5e73\u3002\n    *   \u5fc3\u7406\u5f39\u6027\uff1a**\u9ad8 (7-8\u5206)**\u3002\u88ab\u9a97\u540e\u5904\u7406\u51b7\u9759\u3001\u7406\u6027\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u5e76\u5feb\u901f\u91cd\u5efa\u4fe1\u4efb\u3002\n3.  **\u5224\u5b9a\u6811\u5206\u6d41**\uff1a\u52a8\u673a\u7eaf\u5ea6\u22655\u5206\uff0c\u5fc3\u7406\u5f39\u6027\u22657\u5206\uff0c\u8fdb\u5165**\u9ad8\u5f39\u6027\u901a\u9053**\u3002\u7528\u6237\u672a\u8868\u73b0\u51faT1\u7684\u7edf\u7b79\u884c\u4e3a\u6216T3\u7684\u6df1\u5ea6\u6280\u672f\u8ffd\u95ee\u3002\u5176\u6838\u5fc3\u884c\u4e3a\u662f**\u9ad8\u9891\u4e92\u52a8\u3001\u8868\u8fbe\u611f\u6069\u3001\u5efa\u7acb\u5f3a\u60c5\u611f\u8fde\u63a5**\uff08\u201c\u592a\u592a\u592a\u8c22\u8c22\u4f60\u5566\uff0c\u611f\u52a8\uff0c\u611f\u8c22\u611f\u6069\u201d\u3001\u201c\u4f60\u8fd9\u4e2a\u6b63\u76f4\u5584\u826f\u7684\u4eba\uff0c\u4e00\u5b9a\u6709\u5f88\u591a\u670b\u53cb\u201d\uff09\uff0c\u5e76\u56e0\u9500\u552e\u7684\u7279\u6b8a\u8865\u507f\uff08\u5168\u7cfb\u8bfe\u7a0b\u798f\u5229\uff09\u800c\u4ea7\u751f\u6781\u9ad8\u5fe0\u8bda\u5ea6\u3002\u8fd9\u5b8c\u7f8e\u5339\u914d**T7 \u72c2\u70ed\u6b7b\u5fe0\u7c89**\u7684\u6838\u5fc3\u7279\u5f81\uff1a\u9ad8\u60c5\u611f\u9ecf\u6027\u3001\u9ad8\u63a8\u8350\u610f\u613f\u3002\u540c\u65f6\uff0c\u5176\u201c\u88ab\u9a97\u53d7\u5bb3\u8005\u201d\u80cc\u666f\u7b26\u5408 **T4-\u7070\u4ea7\u4e9a\u79cd** \u7684\u201c\u5148\u5378\u9632\uff0c\u518d\u91cd\u5efa\u201d\u5fc3\u7406\u753b\u50cf\uff0c\u4f46\u5f53\u524d\u5df2\u6210\u529f\u91cd\u5efa\u4fe1\u4efb\uff0c\u5e76\u8f6c\u5316\u4e3a\u9ad8\u5fe0\u8bda\u5ea6\u7528\u6237\u3002\n4.  **\u6700\u7ec8\u5b9a\u4f4d**\uff1a**T7 \u72c2\u70ed\u6b7b\u5fe0\u7c89 (\u7070\u4ea7\u53d7\u5bb3\u8005\u4e9a\u79cd\u53d8\u4f53)**\u3002\u8fd9\u662f\u4e00\u4e2a\u7ecf\u5386\u4e86\u201c\u4e0d\u4fe1\u4efb\u2192\u88ab\u771f\u8bda\u6253\u52a8\u2192\u5efa\u7acb\u5f3a\u4fe1\u4efb\u4e0e\u60c5\u611f\u7ed1\u5b9a\u201d\u7279\u6b8a\u8def\u5f84\u7684T7\u7528\u6237\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u7528\u6237\u72ec\u7acb\u5904\u7406\u88ab\u9a97\u4e8b\u5b9c\uff0c\u663e\u793a\u8f83\u5f3a\u81ea\u4e3b\u6027\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u7528\u6237\u5b66\u4e60\u610f\u613f\u5f3a\uff0c\u80fd\u8ddf\u4e0a\u8282\u594f\uff0c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5c1a\u53ef\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4e2d** | **\u6838\u5fc3\u98ce\u9669\u70b9**\uff1a\u5982\u679c\u540e\u7eed\u670d\u52a1\uff08\u5982\u6d3e\u5355\u3001\u6539\u7a3f\u6307\u5bfc\uff09\u51fa\u73b0\u4efb\u4f55\u201c\u4e0d\u900f\u660e\u201d\u3001\u201c\u6577\u884d\u201d\u6216\u201c\u865a\u5047\u627f\u8bfa\u201d\u8ff9\u8c61\uff0c\u4f1a\u7acb\u523b\u89e6\u53d1\u5176\u201c\u4e8c\u6b21\u53d7\u9a97\u201d\u7684\u521b\u4f24\u8bb0\u5fc6\uff0c\u4fe1\u4efb\u5d29\u584c\u901f\u5ea6\u6781\u5feb\uff0c\u9000\u8d39\u6001\u5ea6\u4f1a\u975e\u5e38\u575a\u51b3\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u7528\u6237\u5bf9\u201c\u5b66\u5230\u771f\u4e1c\u897f\u201d\u548c\u53d8\u73b0\uff08\u7cbe\u4fee\u5546\u5355\uff09\u6709\u660e\u786e\u671f\u5f85\u3002\u82e5\u8bfe\u7a0b\u5185\u5bb9\u6216\u6d3e\u5355\u673a\u4f1a\u4e0e\u9500\u552e\u627f\u8bfa\uff08\u5305\u5b50\u63d0\u53ca\u7684\u201c\u5de5\u4f5c\u5ba4\u8d44\u6e90\u201d\u3001\u201c\u989d\u5916\u57f9\u8bad\u201d\uff09\u5dee\u8ddd\u8fc7\u5927\uff0c\u4f1a\u4ea7\u751f\u843d\u5dee\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u8fdb\u5165\u5b9e\u6218\u548c\u53d8\u73b0\u671f\u5f85\u5151\u73b0\u671f\u3002\u82e5\u627f\u8bfa\u7684\u201c\u989d\u5916\u8d44\u6e90\u201d\u672a\u843d\u5b9e\uff0c\u6216\u7b2c\u4e00\u6b21\u5c1d\u8bd5\u6295\u7a3f/\u63a5\u5355\u906d\u9047\u632b\u6298\u4e14\u672a\u5f97\u5230\u6709\u6548\u652f\u6301\uff0c\u4fe1\u4efb\u5371\u673a\u5c06\u7206\u53d1\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u7ea2\u4e00\u59d0\uff0c\u5305\u5b50\u5e08\u59d0\u7279\u610f\u8ddf\u6211\u4ea4\u4ee3\u4e86\u60a8\u7684\u60c5\u51b5\u3002\u60a8\u653e\u5fc3\uff0c\u5728\u6211\u4eec\u8fd9\u513f\uff0c\u6709\u4efb\u4f55\u4e0d\u6e05\u695a\u3001\u4e0d\u786e\u5b9a\u7684\u5730\u65b9\uff0c\u60a8\u968f\u65f6\u95ee\u6211\uff0c\u54b1\u4eec\u6709\u4e00\u8bf4\u4e00\u3002\u60a8\u4e4b\u524d\u5403\u8fc7\u4e8f\uff0c\u6211\u4eec\u66f4\u5f97\u628a\u4e8b\u513f\u505a\u5728\u660e\u9762\u4e0a\uff0c\u8ba9\u60a8\u5b66\u5f97\u8e0f\u5b9e\u3001\u653e\u5fc3\u3002\u60a8\u4e0d\u662f\u4e00\u4e2a\u4eba\u5728\u5b66\uff0c\u540e\u9762\u6709\u6211\u4eec\u6574\u4e2a\u56e2\u961f\u7ed9\u60a8\u6258\u5e95\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u7528\u6237\u52a8\u673a\u660e\u786e\uff0c\u9700\u7528\u624e\u5b9e\u7684\u5185\u5bb9\u548c\u771f\u5b9e\u7684\u53d8\u73b0\u8def\u5f84\u627f\u63a5\u5176\u201c\u5b66\u5230\u771f\u4e1c\u897f\u201d\u7684\u671f\u5f85\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176T7\u6b7b\u5fe0\u7c89\u7279\u8d28\uff0c\u5fc5\u987b\u9644\u52a0 **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\uff08\u7279\u79cdC\u6a21\u5757\uff09\u3011**\u3002\u7528\u6781\u9ad8\u7684\u60c5\u611f\u6d53\u5ea6\u548c\u201c\u81ea\u5df1\u4eba\u201d\u59ff\u6001\u7ef4\u62a4\u4fe1\u4efb\u3002\u540c\u65f6\uff0c\u9488\u5bf9\u5176\u7070\u4ea7\u53d7\u5bb3\u8005\u80cc\u666f\uff0c\u5e94\u7528 **\u3010\u5148\u5378\u9632\uff0c\u518d\u91cd\u5efa\u3011\u7b56\u7565**\uff0c\u6301\u7eed\u7528\u4e13\u4e1a\u548c\u900f\u660e\u5de9\u56fa\u4fe1\u4efb\u3002\n- **\u6838\u5fc3\u8bdd\u672f\u7b56\u7565**\uff1a**\u524d\u540e\u53f0\u53cc\u8f68\u8f6c\u8bca\u5236 + \u964d\u7ef4\u4e13\u4e1a\u963b\u65ad**\u3002\u73ed\u4e3b\u4efb\uff08\u601d\u601d\uff09\u9700\u5ef6\u7eed\u5305\u5b50\u5efa\u7acb\u7684\u201c\u6b63\u76f4\u3001\u771f\u8bda\u3001\u53ef\u9760\u201d\u4eba\u8bbe\uff0c\u7528\u9ad8\u60c5\u611f\u4e92\u52a8\uff08\u7279\u79cdC\uff09\u7ef4\u6301\u4fe1\u4efb\uff1b\u9047\u5230\u4e13\u4e1a\u95ee\u9898\uff0c\u6beb\u4e0d\u72b9\u8c6b\u5730\u547c\u53eb\u540e\u7aef\u4e13\u5bb6\uff08B\u6a21\u5757\uff09\u63d0\u4f9b\u624e\u5b9e\u89e3\u7b54\uff1b\u82e5\u7528\u6237\u63d0\u53ca\u5916\u90e8\u8bf1\u60d1\u6216\u7591\u8651\uff0c\u76f4\u63a5\u7528\u4e13\u4e1a\u4e8b\u5b9e\u548c\u5e73\u53f0\u6848\u4f8b\u8fdb\u884c\u201c\u964d\u7ef4\u4e13\u4e1a\u963b\u65ad\u201d\uff0c\u5de9\u56fa\u5176\u9009\u62e9\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u505a\u51fa\u65e0\u6cd5\u5151\u73b0\u7684\u627f\u8bfa**\uff08\u5c24\u5176\u662f\u5173\u4e8e\u6d3e\u5355\u6570\u91cf\u3001\u6536\u5165\u4fdd\u969c\uff09\u30022. **\u5728\u670d\u52a1\u4e2d\u51fa\u73b0\u4efb\u4f55\u4e0d\u900f\u660e\u6216\u6577\u884d**\uff08\u5982\u4f5c\u4e1a\u70b9\u8bc4\u6a21\u677f\u5316\u3001\u95ee\u9898\u56de\u590d\u5ef6\u8fdf\uff09\u30023. **\u7528\u9500\u552e\u8bdd\u672f\u65bd\u538b**\uff08\u5979\u5df2\u5efa\u7acb\u4fe1\u4efb\uff0c\u53cd\u611f\u5957\u8def\uff09\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u5fc5\u987b\u57fa\u4e8e\u771f\u5b9e\u4ef7\u503c**\u3002\u56e0\u5176\u5df2\u83b7\u5f97\u5168\u7cfbAI\u8bfe\u7a0b\u798f\u5229\uff0c\u5347\u5355\u9700\u5efa\u7acb\u5728\u5df2\u5f00\u653e\u8bfe\u7a0b\u7684\u771f\u5b9e\u4f53\u9a8c\u548c\u6210\u679c\u57fa\u7840\u4e0a\uff0c\u7528\u201c\u4e3a\u60a8\u91cf\u8eab\u5b9a\u5236\u8fdb\u9636\u8def\u5f84\u201d\u53d6\u4ee3\u201c\u9650\u65f6\u4f18\u60e0\u201d\u8bdd\u672f\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u4f60\u4e0d\u8981\u96be\u53d7\u4e86\u54c8\uff0c\u8fd9\u4e9b\u4eba\u662f\u9632\u4e0d\u80dc\u9632\u3002\u4ee5\u540e\u5982\u679c\u53ef\u4ee5\uff0c\u4f60\u548c\u5176\u4ed6\u8001\u5e08\u4eec\u5c31\u8bbe\u7f6e\u7fa4\u91cc\u7981\u8a00\uff0c\u4e0d\u8ba9\u53d1\u4e1c\u897f\uff0c\u56e0\u4e3a\u9a97\u5b50\u73b0\u5728\u592a\u7316\u72c2\u4e86\u3002\u201d **\u2014\u2014 \u5c55\u73b0\u9ad8\u5fc3\u7406\u5f39\u6027\uff1a\u88ab\u9a97\u540e\u53cd\u800c\u5b89\u6170\u9500\u552e\uff0c\u5e76\u7ed9\u51fa\u9632\u8303\u5efa\u8bae\u3002**\n2. > \u201c\u54c7 \u6211\u90fd\u4e0d\u6562\u76f8\u4fe1\u81ea\u5df1\u7684\u773c\u775b\uff0c\u592a\u592a\u592a\u8c22\u8c22\u4f60\u5566\uff0c\u611f\u52a8\uff0c\u611f\u8c22\u611f\u6069[\u5408\u5341][\u5408\u5341][\u5408\u5341]\u201d **\u2014\u2014 \u5c55\u73b0T7\u7279\u8d28\uff1a\u56e0\u8d85\u51fa\u9884\u671f\u7684\u8865\u507f\uff08\u5168\u7cfb\u8bfe\u7a0b\u798f\u5229\uff09\u4ea7\u751f\u5f3a\u70c8\u60c5\u611f\u56de\u62a5\u548c\u5fe0\u8bda\u5ea6\u3002**\n3. > \u201c\u8fd9\u4e24\u5929\u4f53\u9a8c\u6bd4\u8f83\u597d\uff0c\u611f\u89c9\u53ef\u4ee5\u5b66\u5230\u771f\u4e1c\u897f\uff0c\u8fd8\u6709\u6548\u7387\u201d **\u2014\u2014 \u5c55\u73b0\u9ad8\u52a8\u673a\u7eaf\u5ea6\uff1a\u4e3a\u201c\u771f\u4e1c\u897f\u201d\u548c\u201c\u6548\u7387\u201d\uff08\u6280\u80fd+\u53d8\u73b0\uff09\u4ed8\u8d39\uff0c\u800c\u975e\u5355\u7eaf\u88ab\u7126\u8651\u9a71\u52a8\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T7\u72c2\u70ed\u6b7b\u5fe0\u7c89\uff08\u7070\u4ea7\u53d7\u5bb3\u8005\u4e9a\u79cd\uff09\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u9700\u6c42\uff08\u91cd\u5efa\u4fe1\u4efb\uff09\u4e0e\u793e\u4ea4\u9700\u6c42\uff08\u83b7\u5f97\u771f\u8bda\u5173\u7cfb\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7528\u6781\u81f4\u900f\u660e\u548c\u201c\u81ea\u5df1\u4eba\u201d\u59ff\u6001\u7ef4\u62a4\u4fe1\u4efb\uff0c\u4e25\u9632\u4efb\u4f55\u201c\u4e8c\u6b21\u53d7\u9a97\u201d\u611f\u77e5\uff0c\u5e76\u624e\u5b9e\u5151\u73b0\u5173\u4e8e\u201c\u771f\u4e1c\u897f\u201d\u548c\u8d44\u6e90\u7684\u627f\u8bfa\u3011**\u3002\n\n```json\n{\"core_type\": \"T7 \u72c2\u70ed\u6b7b\u5fe0\u7c89 (\u7070\u4ea7\u53d7\u5bb3\u8005\u4e9a\u79cd\u53d8\u4f53)\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\u3001\u793e\u4ea4\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\"}\n```";
