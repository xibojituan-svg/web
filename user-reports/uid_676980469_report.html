        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u674e\u674e\u679c\u7855 (UID: 676980469) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-29 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u8d85\u4eba\u6897\u54e5(\u803f\u4e1a\u4e1c)\u3001\u51ac\u51ac\u8001\u5e08(\u8463\u590f\u6676) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u5f20\u9707\u6709\u58f0\u914d\u97f3\u8bad\u7ec3\u8425\uff08\u514d\u8d39\u5f15\u6d41\u8bfe\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u4ed8\u8d39\uff0c\u5904\u4e8e\u514d\u8d39\u8bad\u7ec3\u8425\u9636\u6bb5\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u8eab\u4efd\u4e3a\u201c\u4e0a\u73ed\u52a0\u5b9d\u5988\u201d\uff0c\u9700\u517c\u987e\u5de5\u4f5c\u4e0e\u5bb6\u5ead\uff0c\u5b66\u4e60\u65f6\u95f4\u9700\u89c1\u7f1d\u63d2\u9488\uff08\u5982\u201c\u521a\u4e0b\u8bfe\u201d\u3001\u201c\u4e0b\u73ed\u540e\u201d\uff09\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\uff0c\u98ce\u9669\u672a\u77e5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u4e92\u52a8\u79ef\u6781\uff0c\u63d0\u4f9b\u4e86\u8f83\u591a\u5b66\u4e60\u884c\u4e3a\u4e0e\u53cd\u9988\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u53c2\u52a0\u8bad\u7ec3\u8425\u7684\u76ee\u7684\u662f\u201c\u58f0\u97f3\u7f8e\u5316\u201d\u548c\u201c\u4e0a\u73ed\u52a0\u5b9d\u5988\u201d\u589e\u52a0\u526f\u4e1a\u6536\u5165\uff0c\u7b26\u5408\u517c\u804c\u53d8\u73b0\u76ee\u7684\u3002\u4f46\u804a\u5929\u4e2d\u66f4\u805a\u7126\u4e8e\u5177\u4f53\u5b66\u4e60\u8fc7\u7a0b\uff08\u8f6f\u4ef6\u64cd\u4f5c\u3001\u53d1\u97f3\u7ec3\u4e60\u3001\u4f5c\u4e1a\u4e92\u8bc4\uff09\uff0c\u5bf9\u201c\u591a\u4e45\u80fd\u8d5a\u94b1\u201d\u7b49\u6781\u901f\u53d8\u73b0\u95ee\u9898\u672a\u8868\u73b0\u51fa\u5f3a\u70c8\u8ffd\u95ee\uff0c\u6001\u5ea6\u79ef\u6781\u4f46\u9884\u671f\u4e0d\u660e\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u58f0\u97f3\u7f8e\u5316\uff0c\u4e0a\u73ed\u52a0\u5b9d\u5988\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4fe1\u606f\u4e0d\u8db3] \u2014 \u672a\u63d0\u53ca\u8d22\u52a1\u72b6\u51b5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 \u8eab\u4efd\u4e3a\u201c\u4e0a\u73ed\u52a0\u5b9d\u5988\u201d\uff0c\u65f6\u95f4\u88ab\u5de5\u4f5c\u548c\u80b2\u513f\u9ad8\u5ea6\u5206\u5272\uff0c\u5b66\u4e60\u9700\u201c\u5b9a\u95f9\u949f\u201d\u63d0\u9192\uff0c\u5b58\u5728\u201c\u4e00\u5fd9\u5c31\u5fd8\u4e86\u201d\u7684\u60c5\u51b5\uff0c\u4f46\u4ecd\u5728\u52aa\u529b\u6324\u65f6\u95f4\u5b8c\u6210\u4f5c\u4e1a\u548c\u4e92\u52a8\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u4e0d\u8db3] \u2014 \u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u60c5\u51b5\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u5728\u9047\u5230AU\u8f6f\u4ef6\u65e0\u58f0\u3001\u5f55\u4e0d\u4e0a\u7684\u6280\u672f\u95ee\u9898\u65f6\uff0c\u80fd\u8010\u5fc3\u8ddf\u968f\u9500\u552e\u6307\u5bfc\u4e00\u6b65\u6b65\u6392\u67e5\uff0c\u6700\u7ec8\u89e3\u51b3\u95ee\u9898\uff0c\u5e76\u793c\u8c8c\u81f4\u8c22\u3002\u5728\u793e\u7fa4\u4e2d\u4e3b\u52a8\u3001\u7ec6\u81f4\u5730\u70b9\u8bc4\u4ed6\u4eba\u4f5c\u4e1a\uff0c\u5c55\u73b0\u51fa\u4e50\u4e8e\u52a9\u4eba\u548c\u79ef\u6781\u878d\u5165\u793e\u7fa4\u7684\u7279\u8d28\uff0c\u65e0\u4efb\u4f55\u62b1\u6028\u6216\u8d1f\u9762\u60c5\u7eea\u6d41\u9732\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u73ed\u73ed\uff0c\u53ef\u4ee5\u5566[\u5472\u7259] \u8c22\u8c22[\u73ab\u7470]\u201d (\u89e3\u51b3\u95ee\u9898\u540e)\uff1b> \u201c\u55ef\uff0c\u8c22\u8c22\u5317\u6781\u661f\u8001\u5e08\u7684\u70b9\u8bc4\u3002\u55ef\uff0c\u6211\u5f55\u5b8c\u4e4b\u540e\u4e5f\u6ca1\u6709\u542c\uff0c\u55ef\uff0c\u70b9\u8bc4\u7684\u975e\u5e38\u5230\u4f4d\u3002...\u6211\u4ee5\u540e\u4f1a\u6539\u6b63\u7684\uff0c\u8c22\u8c22\u3002\u201d (\u63a5\u53d7\u53cd\u9988\u540e)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u4f5c\u4e3a\u201c\u4e0a\u73ed\u52a0\u5b9d\u5988\u201d\uff0c\u5176\u4e2a\u4eba\u4ef7\u503c\u53ef\u80fd\u88ab\u65e5\u5e38\u7410\u788e\u548c\u5de5\u4f5c\u6240\u6df9\u6ca1\uff0c\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u201c\u624b\u827a\u201d\uff08\u58f0\u97f3\u7f8e\u5316\uff09\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u548c\u793e\u7fa4\u5f52\u5c5e\u611f\uff0c\u4ece\u800c\u63d0\u5347\u81ea\u6211\u4ef7\u503c\u611f\u548c\u81ea\u4fe1\u5fc3\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u793e\u7fa4\u5185\u7684\u8eab\u4efd\u8ba4\u540c**\u3002\u5979\u9700\u8981\u88ab\u770b\u89c1\u3001\u88ab\u8ba4\u53ef\u4e3a\u4e00\u4e2a\u201c\u6709\u6f5c\u529b\u201d\u3001\u201c\u4f18\u79c0\u201d\u7684\u5b66\u5458\uff0c\u800c\u4e0d\u4ec5\u4ec5\u662f\u4e00\u4e2a\u5b9d\u5988\u6216\u666e\u901a\u804c\u5458\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u79ef\u6781\u5b66\u4e60\u8005\uff0c\u6709\u660e\u786e\u76ee\u6807\u4f46\u8d44\u6e90\u53d7\u9650\uff0c\u9700\u5f15\u5bfc) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u9700\u8b66\u60d5**\u3002\u4f5c\u4e3a\u5b9d\u5988\uff0c\u82e5\u5bb6\u4eba\u53cd\u5bf9\u5176\u6295\u5165\u65f6\u95f4\u5b66\u4e60\u6216\u8d2d\u4e70\u8bfe\u7a0b\uff0c\u53ef\u80fd\u6210\u4e3a\u6f5c\u5728\u98ce\u9669\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u65f6\u95f4\u51b2\u7a81\u5bfc\u81f4\u79ef\u538b**\u3002\u5de5\u4f5c\u4e0e\u80b2\u513f\u5bfc\u81f4\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\uff0c\u4e00\u65e6\u4efb\u52a1\u79ef\u538b\uff0c\u53ef\u80fd\u56e0\u65e0\u6cd5\u8ddf\u4e0a\u8fdb\u5ea6\u800c\u4ea7\u751f\u7126\u8651\u548c\u653e\u5f03\u5ff5\u5934\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u5230\u6280\u672f\u95ee\u9898\u80fd\u8010\u5fc3\u89e3\u51b3\uff0c\u63a5\u53d7\u6279\u8bc4\u6001\u5ea6\u7aef\u6b63\uff0c\u4e0d\u6613\u56e0\u5b66\u4e60\u632b\u6298\u800c\u60c5\u7eea\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u5bf9\u526f\u4e1a\u589e\u6536\u6709\u671f\u5f85\uff0c\u82e5\u8bad\u7ec3\u8425\u540e\u671f\u65e0\u6cd5\u63d0\u4f9b\u6e05\u6670\u7684\u8fdb\u9636\u8def\u5f84\u6216\u8bd5\u97f3\u673a\u4f1a\uff0c\u53ef\u80fd\u56e0\u201c\u770b\u4e0d\u5230\u7ed3\u679c\u201d\u800c\u6d41\u5931\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-3\u5468\u540e**\u3002\u5f53\u514d\u8d39\u8bad\u7ec3\u8425\u7ed3\u675f\uff0c\u9762\u4e34\u662f\u5426\u4ed8\u8d39\u5347\u9636\u7684\u51b3\u7b56\u65f6\uff0c\u82e5\u65f6\u95f4\u538b\u529b\u4e0e\u9884\u671f\u6536\u76ca\u4e0d\u5339\u914d\u7684\u77db\u76fe\u51f8\u663e\uff0c\u53ef\u80fd\u653e\u5f03\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u679c\u7855\uff0c\u770b\u5230\u4f60\u53c8\u662f\u4e0a\u73ed\u53c8\u662f\u5e26\u5a03\uff0c\u8fd8\u80fd\u8fd9\u4e48\u8ba4\u771f\u6253\u78e8\u4f5c\u4e1a\u3001\u5e2e\u52a9\u540c\u5b66\uff0c\u771f\u7684\u7279\u522b\u4f69\u670d\uff01\u54b1\u4eec\u8fd9\u4e2a\u73ed\u5c31\u9700\u8981\u4f60\u8fd9\u6837\u65e2\u8e0f\u5b9e\u53c8\u70ed\u5fc3\u7684\u2018\u5927\u5e08\u59d0\u2019\u3002\u522b\u62c5\u5fc3\u65f6\u95f4\u788e\uff0c\u5f88\u591a\u5b9d\u5988\u540c\u5b66\u90fd\u662f\u5229\u7528\u7761\u524d\u3001\u901a\u52e4\u8fd9\u4e9b\u788e\u7247\u65f6\u95f4\u7ec3\u51fa\u6765\u7684\uff0c\u6211\u4f1a\u5e2e\u4f60\u628a\u5b66\u4e60\u4efb\u52a1\u62c6\u89e3\u5230\u6700\u5c0f\u5355\u5143\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u7a33\u7a33\u5730\u8fdb\u6b65\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u3002\u5339\u914d\u5176T2\u4f4e\u8c03\u5b9e\u5e72\u7684\u539f\u578b\uff0c\u63d0\u4f9b\u624e\u5b9e\u7684\u6280\u5de7\u8bad\u7ec3\u548c\u660e\u786e\u7684\u8fdb\u9636\u8def\u5f84\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u65f6\u95f4\u7ba1\u7406\u8f85\u52a9\u5305**\u3011\uff08\u63d0\u4f9b\u788e\u7247\u5316\u5b66\u4e60\u8ba1\u5212\u8868\u3001\u91cd\u70b9\u5185\u5bb9\u6458\u8981\uff09\uff1b\u3010**\u793e\u7fa4\u8d4b\u80fd\u5305**\u3011\uff08\u8d4b\u4e88\u5176\u201c\u70b9\u8bc4\u5b98\u201d\u3001\u201c\u5c0f\u7ec4\u957f\u201d\u7b49\u89d2\u8272\uff0c\u6ee1\u8db3\u5176\u5c0a\u91cd\u4e0e\u5f52\u5c5e\u9700\u6c42\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u5ffd\u89c6\u5979\u7684\u65f6\u95f4\u56f0\u5883**\uff0c\u5e03\u7f6e\u9700\u8981\u5927\u5757\u8fde\u7eed\u65f6\u95f4\u624d\u80fd\u5b8c\u6210\u7684\u4efb\u52a1\u30022. **\u53ea\u7ed9\u6cdb\u6cdb\u7684\u5938\u5956**\uff0c\u9700\u8981\u7ed9\u51fa\u5177\u4f53\u3001\u6709\u5efa\u8bbe\u6027\u7684\u4e13\u4e1a\u53cd\u9988\u30023. **\u8fc7\u5ea6\u627f\u8bfa\u77ed\u671f\u53d8\u73b0**\uff0c\u907f\u514d\u5f15\u53d1\u6536\u76ca\u843d\u5dee\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u63a8\u4ecb\u4e0e\u5176\u5b9e\u8df5\u65f6\u95f4\u5339\u914d\u7684**\u4e2d\u9636\u8bfe\u7a0b**\uff08\u5982\u5468\u672b\u76f4\u64ad\u8bfe\u3001\u5c0f\u73ed\u8f85\u5bfc\uff09\uff0c\u4e25\u7981\u63a8\u9500\u9700\u8981\u5927\u91cf\u6574\u5757\u65f6\u95f4\u7684\u9ad8\u5f3a\u5ea6\u96c6\u8bad\u8425\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u58f0\u97f3\u7f8e\u5316\uff0c\u4e0a\u73ed\u52a0\u5b9d\u5988\u201d **(\u6838\u5fc3\u52a8\u673a\u4e0e\u8d44\u6e90\u73b0\u72b6)**\n2. > \u201c\u73ed\u73ed\uff0c\u53ef\u4ee5\u5566[\u5472\u7259] \u8c22\u8c22[\u73ab\u7470]\u201d **(\u9ad8\u5fc3\u7406\u5f39\u6027\u4e0e\u89e3\u51b3\u95ee\u9898\u80fd\u529b)**\n3. > \u201c\u55ef\uff0c\u5c0f\u5200\u521a\u624d\u542c\u5b8c\u4e86\u4f60\u7684\u8bfb\u7684\u5185\u5bb9\uff0c\u55ef\uff0c\u6211\u89c9\u5f97\u8bfb\u7684\u5f88\u597d\uff0c\u55ef\uff0c\u5c31\u4e24\u4e2a\u53d1\u97f3\u5c31\u662f\u4e00\u4e2a\u662fp p o p\uff0c\u55ef\uff0c\u7b2c\u4e8c\u4e2a\u5c31\u662f\u9f3b\u5b50\u90a3\u4e2a\u9f3b\u662f\u4e8c\u58f0\u9633\u7684\u9f3b\u5b50\uff0c\u5176\u4ed6\u7684\u90fd\u5f88\u597d\u3002\u201d **(\u8ba4\u771f\u3001\u7ec6\u81f4\u3001\u4e50\u4e8e\u52a9\u4eba\u7684\u793e\u7fa4\u884c\u4e3a\uff0c\u4f53\u73b0\u5c0a\u91cd\u4e0e\u5f52\u5c5e\u9700\u6c42)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2\u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u793e\u7fa4\u5f52\u5c5e\u611f\uff08\u5c0a\u91cd\u9700\u6c42\uff09**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u7cbe\u51c6\u7684\u788e\u7247\u5316\u5b66\u4e60\u652f\u6301+\u8d4b\u4e88\u5176\u793e\u7fa4\u6838\u5fc3\u89d2\u8272\uff08\u5982\u70b9\u8bc4\u5b98\uff09\u4ee5\u5f3a\u5316\u5176\u4ef7\u503c\u611f**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"maslow_need\": \"\u7b2c\u56db\u5c42\u5c0a\u91cd\u9700\u6c42\", \"risk_level\": \"\u4e2d\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u65f6\u95f4\u7ba1\u7406\u8f85\u52a9\u5305+\u793e\u7fa4\u8d4b\u80fd\u5305\"}\n```";
