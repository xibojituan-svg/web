    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u79be\u6849\u665a\u661f / \u7a7a\u75d5\u304b (UID: 676980441) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-04 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u4e03\u6708\u4f73\u97f3(\u5468\u5c0f\u797a)\u3001\u4e3b\u64ad\u516d\u6708\u6668\u516e(\u949f\u6a1f\u73b2) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u63a8\u6d4b\u4e3a\u201c\u6500\u767b\u8ba1\u5212\u201d\u7b49\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad** |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad** |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad** |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49\u504f\u4e0a**\uff08\u5b66\u4e60\u4e92\u52a8\u79ef\u6781\uff0c\u4f46\u5173\u952e\u4e09\u8f74\u4fe1\u606f\u7f3a\u5931\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34\u578b**\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u201c\u804c\u4e1a\u89c4\u5212\u8ff7\u832b\u671f\u201d\uff0c\u5e76\u8be2\u95ee\u884c\u4e1a\u6536\u5165\uff0c\u6709\u517c\u804c\u53d8\u73b0\u7684\u660e\u786e\u76ee\u7684\u3002\u4f46\u540c\u65f6\uff0c\u7528\u6237\u79ef\u6781\u53c2\u4e0e\u5b66\u4e60\u3001\u70b9\u8bc4\uff0c\u5173\u6ce8\u6280\u80fd\u63d0\u5347\uff08\u5982\u53d1\u97f3\u3001\u57fa\u8c03\uff09\uff0c\u5e76\u975e\u7eaf\u7cb9\u8ffd\u6c42\u6781\u901f\u53d8\u73b0\uff0c\u5bf9\u5b66\u4e60\u672c\u8eab\u6709\u6295\u5165\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u73ed\u73ed\uff0c\u60f3\u95ee\u4e00\u4e0b\u884c\u4e1a\u5185\u53c2\u4e0e\u591a\u5de5\u79cd\u5de5\u4f5c\u7684\u5927\u6982\u6708\u6536\u5165\u80fd\u591a\u5c11\u5462\uff0c\u6bd4\u5982\u521d\u5165\u884c\u7684\u80fd\u6709\u591a\u5c11\u5462\uff0c\u6210\u719f\u7a33\u5b9a\u671f\u7684\u591a\u5c11\u5462\uff0c\u73b0\u5728\u5c31\u662f\u4e00\u4e9b\u96f6\u6563\u7684\u6982\u5ff5\u3002\u201d > \u201c\u56e0\u4e3a\u73b0\u5728\u5904\u4e8e\u4e00\u4e2a\u804c\u4e1a\u89c4\u5212\u8ff7\u832b\u671f[\u7834\u6d95\u4e3a\u7b11]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad** \u2014 \u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u7528\u6237\u80fd\u9891\u7e41\u53c2\u4e0e\u7fa4\u5185\u4e92\u52a8\u3001\u70b9\u8bc4\u540c\u5b66\u4f5c\u4e1a\u3001\u8ddf\u8fdb\u8bfe\u7a0b\u548c\u8c03\u8bd5\u8bbe\u5907\uff0c\u663e\u793a\u51fa\u6709\u8f83\u4e3a\u89c4\u5f8b\u548c\u53ef\u652f\u914d\u7684\u5b66\u4e60\u65f6\u95f4\u3002\u4f46\u672a\u900f\u9732\u5177\u4f53\u804c\u4e1a\u548c\u4f5c\u606f\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad** \u2014 \u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u76f8\u5173\u4fe1\u606f\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u6280\u672f\u95ee\u9898\uff08\u8bbe\u5907\u8c03\u8bd5\u3001\u8f6f\u4ef6\u5b89\u88c5\uff09\u4e3b\u52a8\u8be2\u95ee\u5e76\u89e3\u51b3\uff1b\u80fd\u63a5\u53d7\u540c\u5b66\u548c\u73ed\u73ed\u7684\u53cd\u9988\u5e76\u79ef\u6781\u8c03\u6574\uff1b\u5b66\u4e60\u6001\u5ea6\u79ef\u6781\uff0c\u81ea\u6211\u9f13\u52b1\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u73ed\u73ed\uff0c\u7535\u8111\u4e0a\u6ca1\u6709\u591a\u4f59\u7684USB\u53e3\uff0c\u662f\u4e0d\u662f\u8981\u4e70\u4e00\u4e2aUSB\u7684\u6269\u5c55\u575e\u201d \uff08\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff09> \u201c\u597d\u6ef4\uff0c\u8c22\u8c22\u73ed\u73ed\u7684\u6307\u5bfc\u8bc4\u4ef7\uff0c\u66f4\u6709\u4fe1\u5fc3\u4e86\u201d \uff08\u79ef\u6781\u53cd\u9988\uff09> \u201c\u6bcf\u5929\u8fdb\u6b65\u4e00\u70b9\u70b9\ud83d\udcaa\u201d \uff08\u81ea\u6211\u6fc0\u52b1\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u5f53\u524d\u804c\u4e1a\u7684\u5026\u6020\u4e0e\u4ef7\u503c\u611f\u7f3a\u5931**\uff08\u201c\u73b0\u5728\u5e72\u7684\u5fc3\u7d2f\u201d\uff09\uff0c\u5e0c\u671b\u901a\u8fc7\u638c\u63e1\u65b0\u6280\u80fd\uff0c\u83b7\u5f97\u65b0\u7684\u804c\u4e1a\u53ef\u80fd\u6027\u548c\u793e\u4f1a\u8ba4\u53ef\uff0c\u4ece\u800c\u91cd\u5efa\u81ea\u4fe1\u548c\u5c0a\u91cd\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u8fdb\u9636\u8def\u5f84\u7684\u6e05\u6670\u6307\u5f15**\u3002\u5979\u9700\u8981\u88ab\u770b\u89c1\u201c\u6709\u80fd\u529b\u201d\uff0c\u5e76\u76f8\u4fe1\u901a\u8fc7\u52aa\u529b\u53ef\u4ee5\u6539\u53d8\u73b0\u72b6\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** \uff08\u52a8\u673a\u4e2d\u7b49\uff0c\u8d44\u6e90\u4e2d\u7b49\uff0c\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u6709\u660e\u786e\u5b66\u4e60\u884c\u4e3a\uff09 |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5ead\u53cd\u5bf9\u7b49\u5371\u9669\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4f4e** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u5f53\u524d\u4e92\u52a8\u672a\u663e\u793a\u5bb6\u5ead\u963b\u529b\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u82e5\u540e\u7eed\u5de5\u4f5c/\u751f\u6d3b\u7a81\u7136\u7e41\u5fd9\uff0c\u5bfc\u81f4\u65e0\u6cd5\u8ddf\u4e0a\u8bfe\u7a0b\u8282\u594f\uff0c\u53ef\u80fd\u4ea7\u751f\u7126\u8651\u548c\u653e\u5f03\u5ff5\u5934\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u4e0d\u6613\u56e0\u5b66\u4e60\u632b\u6298\u800c\u60c5\u7eea\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u7528\u6237\u6709\u660e\u786e\u7684\u6536\u5165\u9884\u671f\u8be2\u95ee\u3002\u82e5\u5b66\u4e60\u4e2d\u671f\uff08\u59824-6\u5468\uff09\u53d1\u73b0\u63a5\u5355\u56f0\u96be\u6216\u6536\u5165\u4e0e\u9884\u671f\u4e0d\u7b26\uff0c\u53ef\u80fd\u4ea7\u751f\u5931\u671b\u60c5\u7eea\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c4-6\u5468\uff08\u201c\u6b7b\u4ea1\u8c37\u201d\u9636\u6bb5\uff09**\u3002\u5f53\u57fa\u7840\u8bfe\u7a0b\u7ed3\u675f\uff0c\u8fdb\u5165\u5b9e\u6218/\u8bd5\u97f3\u9636\u6bb5\uff0c\u82e5\u591a\u6b21\u8bd5\u97f3\u5931\u8d25\u6216\u63a5\u5355\u65e0\u679c\uff0c\u5bb9\u6613\u56e0\u201c\u6536\u76ca\u843d\u5dee\u201d\u800c\u4ea7\u751f\u52a8\u6447\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u79be\u6849\u665a\u661f\uff0c\u770b\u5230\u4f60\u5728\u7fa4\u91cc\u7ed9\u540c\u5b66\u4eec\u7684\u70b9\u8bc4\u975e\u5e38\u4e13\u4e1a\u3001\u7ec6\u81f4\uff0c\u80fd\u611f\u89c9\u5230\u4f60\u5bf9\u58f0\u97f3\u7684\u654f\u611f\u5ea6\u548c\u8ba4\u771f\u52b2\u513f\uff0c\u8fd9\u662f\u6210\u4e3a\u4f18\u79c0\u6f14\u64ad\u8005\u7684\u5b9d\u8d35\u7279\u8d28\u3002\u522b\u62c5\u5fc3\u804c\u4e1a\u8ff7\u832b\u671f\uff0c\u5f88\u591a\u540c\u5b66\u90fd\u662f\u4ece\u8fd9\u91cc\u627e\u5230\u4e86\u65b0\u7684\u65b9\u5411\u548c\u81ea\u4fe1\u3002\u54b1\u4eec\u4e00\u6b65\u6b65\u6765\uff0c\u5148\u628a\u57fa\u672c\u529f\u6253\u624e\u5b9e\uff0c\u4f60\u7684\u2018\u51b7\u5fa1\u2019\u97f3\u8272\u5f88\u6709\u5e02\u573a\uff0c\u73ed\u73ed\u4f1a\u5e2e\u4f60\u627e\u5230\u6700\u9002\u5408\u4f60\u7684\u8d5b\u9053\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743**\u3011\uff08\u9488\u5bf9\u5176\u94bb\u7814\u7ec6\u8282\u7684\u7279\u70b9\uff09\u3001\u3010**\u7cbe\u51c6\u6d3e\u5355/\u8bd5\u97f3\u6307\u5bfc\u5305**\u3011\uff08\u4e2d\u671f\u91cd\u70b9\uff0c\u6ee1\u8db3\u5176\u53d8\u73b0\u671f\u5f85\uff0c\u7ba1\u7406\u9884\u671f\uff09\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u53ea\u753b\u5927\u997c\u4e0d\u8c08\u56f0\u96be**\u3002\u9700\u660e\u786e\u544a\u77e5\u884c\u4e1a\u6536\u5165\u65b9\u5dee\u5927\uff0c\u524d\u671f\u9700\u8981\u79ef\u7d2f\u30022. **\u5ffd\u89c6\u5979\u7684\u4e13\u4e1a\u53cd\u9988**\u3002\u5979\u5177\u5907\u4e00\u5b9a\u7684\u9274\u8d4f\u548c\u6307\u5bfc\u80fd\u529b\uff0c\u9700\u8981\u7ed9\u4e88\u5176\u610f\u89c1\u8db3\u591f\u7684\u5c0a\u91cd\u548c\u56de\u5e94\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002T2\u7528\u6237\u6709\u6f5c\u529b\u6210\u4e3a\u9ad8\u4ef7\u503c\u7528\u6237\uff0c\u5728\u8bc1\u660e\u5b66\u4e60\u6210\u679c\u548c\u5efa\u7acb\u4fe1\u4efb\u540e\uff0c\u53ef\u63a8\u8350\u9ad8\u9636\u8bfe\u7a0b\u6216\u79c1\u6559\u670d\u52a1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u73ed\u73ed\uff0c\u60f3\u95ee\u4e00\u4e0b\u884c\u4e1a\u5185\u53c2\u4e0e\u591a\u5de5\u79cd\u5de5\u4f5c\u7684\u5927\u6982\u6708\u6536\u5165\u80fd\u591a\u5c11\u5462\uff0c\u6bd4\u5982\u521d\u5165\u884c\u7684\u80fd\u6709\u591a\u5c11\u5462\uff0c\u6210\u719f\u7a33\u5b9a\u671f\u7684\u591a\u5c11\u5462\uff0c\u73b0\u5728\u5c31\u662f\u4e00\u4e9b\u96f6\u6563\u7684\u6982\u5ff5\u3002\u201d **\uff08\u52a8\u673a\u4e2d\uff1a\u5173\u6ce8\u53d8\u73b0\uff0c\u4f46\u6709\u7406\u6027\u89c4\u5212\uff09**\n2. > \u201c@\u4e8e\u5c0f\u540c\u5b66\u5440 \u5c71\u4e1c \u5973\u64ad\u2026 \u53d1\u73b0\u4e86\u51e0\u4e2a\u95ee\u9898\uff0c\u7b2c\u4e00\u4e2a\u95ee\u9898\u662f\u9001\u6c14\u97f3\u4e0d\u662f\u987a\u6c14\u97f3\uff0c\u5e73\u7fd8\u820c\u7684\u95ee\u9898\u3002\u7b2c\u4e8c\u4e2a\u662f\u8e72\u81c0\u4e0d\u662f\u9505\u81c0\u3002\u7b2c\u4e09\u4e2a\u95ee\u9898\u662f\u814a\u6708\u82e6\u70ed\u4e0d\u662f\u9177\u70ed\uff0c\u5e94\u8be5\u662f\u770b\u9519\u5b57\u4e86\u3002\u7b2c\u56db\u4e2a\u95ee\u9898\u662f\u89e3\u503a\u623f\u4e2d\uff0c\u5e94\u8be5\u662f\u89e3\u5728\u623f\u4e2d\uff0c\u4e5f\u662f\u5e73\u7fd8\u820c\u3002\u7b2c\u4e94\u4e2a\u662f\u9002\u5f53\u4e0d\u662f\u9002\u5f53\uff0c\u55ef\uff0c\u5176\u4ed6\u7684\u6ca1\u6709\u4ec0\u4e48\u95ee\u9898\u4e86\uff0c\u55ef\uff0c\u7ee7\u7eed\u52a0\u6cb9\u3002\u201d **\uff08\u884c\u4e3a\u9ad8\uff1a\u79ef\u6781\u53c2\u4e0e\uff0c\u5c55\u73b0\u4e13\u4e1a\u6f5c\u529b\u548c\u5b9e\u5e72\u7cbe\u795e\uff09**\n3. > \u201c\u56e0\u4e3a\u73b0\u5728\u5904\u4e8e\u4e00\u4e2a\u804c\u4e1a\u89c4\u5212\u8ff7\u832b\u671f[\u7834\u6d95\u4e3a\u7b11]\u201d **\uff08\u9700\u6c42\u951a\u70b9\uff1a\u5bfb\u6c42\u5c0a\u91cd\u4e0e\u65b0\u7684\u804c\u4e1a\u4ef7\u503c\uff09**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2\u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u804c\u4e1a\u5c0a\u91cd\u4e0e\u4ef7\u503c\u91cd\u5851**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u57284-6\u5468\u201c\u6b7b\u4ea1\u8c37\u201d\u9636\u6bb5\uff0c\u63d0\u4f9b\u7cbe\u51c6\u7684\u8bd5\u97f3\u6307\u5bfc\u548c\u771f\u5b9e\u7684\u884c\u4e1a\u6848\u4f8b\uff0c\u7ba1\u7406\u5176\u6536\u76ca\u9884\u671f\uff0c\u540c\u65f6\u6301\u7eed\u7ed9\u4e88\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743+\u7cbe\u51c6\u6d3e\u5355\u6307\u5bfc\u5305\"}\n```";
