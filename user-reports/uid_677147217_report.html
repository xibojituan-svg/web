    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u4e0e\u98ce\u63a7\u62a5\u544a (UID: 677147217)\n\n## \u4e00\u3001 \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n\n*   **\u52a8\u673a\u7eaf\u5ea6 (Motive Purity): \u4e2d\u7b49**\n    *   **\u8868\u5c42\u52a8\u673a:** \u660e\u786e\u4e14\u5f3a\u70c8\u3002\u7528\u6237\u9762\u4e34\u201c\u9a6c\u4e0a\u5931\u4e1a\u201d\u7684\u751f\u5b58\u538b\u529b\uff0c\u5bfb\u6c42\u526f\u4e1a\u53d8\u73b0\uff08\u6296\u97f3\u5feb\u624b\u505a\u89c6\u9891\u5e26\u5e26\u8d27\uff09\uff0c\u52a8\u673a\u76f4\u63a5\u3001\u73b0\u5b9e\u3002\n    *   **\u6df1\u5c42\u52a8\u673a:** \u5b58\u5728**\u81ea\u6211\u6548\u80fd\u611f\u4f4e**\u4e0e**\u9003\u907f\u503e\u5411**\u3002\u7528\u6237\u591a\u6b21\u8868\u8fbe\u201c\u5bf9\u81ea\u5df1\u6ca1\u5565\u81ea\u4fe1\u201d\u3001\u201c\u4e0d\u662f\u4e3b\u52a8\u578b\u4eba\u683c\u201d\u3001\u201c\u62c5\u5fc3\u81ea\u5df1\u505a\u4e0d\u597d\u201d\u3001\u201c\u8111\u5b50\u5c31\u53d8\u590d\u6742\u4e86\u201d\u3001\u201c\u9009\u62e9\u56f0\u96be\u75c7\u201d\u3002\u5176\u5b66\u4e60\u52a8\u673a\u4e2d\u6df7\u5408\u4e86\u201c\u5bfb\u6c42\u5916\u90e8\u6307\u4ee4\u4e0e\u4f9d\u8d56\u201d\uff08\u201c\u522b\u8ba9\u6211\u52a8\u8111\u5b50\u201d\uff09\u4ee5\u89c4\u907f\u81ea\u4e3b\u51b3\u7b56\u7126\u8651\u7684\u6210\u5206\u3002\n    *   **\u7ed3\u8bba:** \u52a8\u673a\u6e90\u4e8e\u751f\u5b58\u538b\u529b\uff0c\u4f46\u5b66\u4e60\u9a71\u52a8\u529b\u6613\u53d7\u632b\u8d25\u611f\u548c\u4f4e\u81ea\u6211\u8bc4\u4ef7\u5f71\u54cd\uff0c**\u7a33\u5b9a\u6027\u5b58\u7591**\u3002\n\n*   **\u8d44\u6e90\u5e95\u5ea7 (Resource Base): \u8584\u5f31**\n    *   **\u7ecf\u6d4e\u8d44\u6e90:** \u7d27\u5f20\u3002\u7528\u6237\u900f\u9732\u201c\u6708\u5e95\u5931\u4e1a\uff0c\u5fc3\u6ca1\u5e95\u201d\uff0c\u4e14\u5bf9\u5b66\u8d39\u654f\u611f\uff08\u201c\u6211\u6015\u88ab\u5b66\u8d39\u529d\u9000\u201d\uff09\uff0c\u66fe\u56e0\u8d44\u91d1\u7d27\u5f20\u653e\u5f03\u5176\u4ed6\u8bfe\u7a0b\u3002\u652f\u4ed8\u80fd\u529b\u5904\u4e8e\u4e34\u754c\u70b9\u3002\n    *   **\u65f6\u95f4\u8d44\u6e90:** \u517c\u804c\u5b66\u4e60\uff0c\u81ea\u8ff0\u201c\u5de5\u4f5c\u7d2f\u7684\u6ca1\u65f6\u95f4\u201d\uff0c\u4f46\u627f\u8bfa\u53ef\u6ee1\u8db3\u201c\u4e00\u592930\u5206\u949f\u201d\u7684\u5b98\u65b9\u8981\u6c42\u3002\n    *   **\u8ba4\u77e5/\u6280\u80fd\u8d44\u6e90:** \u57fa\u7840\u8584\u5f31\u3002\u81ea\u79f0\u201c\u5c0f\u767d\u201d\uff0c\u5c1d\u8bd5\u5236\u4f5c\u89c6\u9891\u4f46\u6548\u679c\u201c\u8f6f\u8db4\u8db4\u7684\u201d\u3001\u201c\u4e0d\u6d41\u7545\u201d\u3002\u6709\u77ed\u6682\u914d\u97f3\u5b66\u4e60\u7ecf\u5386\u4f46\u5df2\u4e2d\u65ad\u3002**\u6ce8\u610f\u529b\u4e0d\u96c6\u4e2d\u3001\u6613\u8dd1\u504f**\u662f\u5176\u663e\u8457\u7684\u5b66\u4e60\u969c\u788d\u3002\n    *   **\u793e\u4f1a\u652f\u6301:** \u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\uff0c\u5bf9\u8bdd\u4e2d\u4ec5\u4e0e\u9500\u552e\u4e92\u52a8\uff0c\u663e\u793a\u5176\u51b3\u7b56\u53ef\u80fd\u4e3a\u4e2a\u4eba\u884c\u4e3a\u3002\n\n*   **\u5fc3\u7406\u5f39\u6027 (Psychological Resilience): \u4f4e**\n    *   **\u6297\u632b\u6298\u80fd\u529b:** **\u6781\u4f4e**\u3002\u7528\u6237\u6709\u660e\u786e\u7684**\u8bd5\u9519\u521b\u4f24\u53f2**\uff1a\u8fd1\u671f\u5728\u540c\u7c7b\u8bfe\u7a0b\u4e0a\u201c\u8bd5\u95194500\u4e86\uff0c\u4e00\u70b9\u6ca1\u5b66\u5230\u4e1c\u897f\uff0c\u4e5f\u4e0d\u7ba1\u6211\u4e86\u201d\uff0c\u5e76\u56e0\u672a\u7eed\u8d39\u9ad8\u4ef7\u8bfe\u7a0b\u800c\u88ab\u201c\u667e\u7740\u201d\u3002\u6b64\u7ecf\u5386\u5df2\u5f62\u6210**\u4ed8\u8d39\u540e\u5373\u88ab\u629b\u5f03\u7684\u9884\u671f**\u3002\n    *   **\u60c5\u7eea\u72b6\u6001:** **\u9ad8\u7126\u8651\u3001\u4f4e\u81ea\u4fe1\u3001\u4f34\u6709\u6291\u90c1\u503e\u5411**\u3002\u81ea\u8ff0\u201c\u7126\u8651\uff0c\u8d1f\u9762\u504f\u591a\u201d\u3001\u201c\u6291\u90c1\u51e0\u5e74\u201d\u3001\u201c\u73b0\u5728\u4e5f\u6709\u9893\u7684\u5fc3\u91cc\u201d\u3001\u201c\u65f6\u5e38\u81ea\u5351\u201d\u3002\u5c5e\u4e8e**\u9ad8\u60c5\u7eea\u8d1f\u8377**\u4e2a\u4f53\u3002\n    *   **\u5f52\u56e0\u6a21\u5f0f:** \u503e\u5411\u4e8e\u5916\u90e8\u5f52\u56e0\u548c\u88ab\u52a8\u670d\u4ece\uff08\u201c\u516b\u96f6\u540e\u6709\u4e00\u6279\u8c8c\u4f3c\u662f\u670d\u4ece\u578b\u4eba\u683c\u201d\u3001\u201c\u6ca1\u6709\u601d\u60f3\u7684\u5de5\u5177\u4eba\u201d\uff09\uff0c\u7f3a\u4e4f\u5185\u63a7\u611f\u548c\u575a\u6301\u6027\u3002\n    *   **\u884c\u52a8\u6a21\u5f0f:** \u8868\u73b0\u4e3a\u201c\u670d\u4ece-\u6000\u7591\u201d\u5faa\u73af\uff1a\u53e3\u5934\u7b54\u5e94\u6267\u884c\uff08\u201c\u8ba9\u5e72\u5565\u5e72\u5565\u201d\uff09\uff0c\u4f46\u968f\u5373\u9677\u5165\u5bf9\u81ea\u6211\u80fd\u529b\u548c\u8bfe\u7a0b\u6548\u679c\u7684\u6df1\u5ea6\u6000\u7591\uff08\u201c\u603b\u89c9\u5f97\u5dee\u70b9\u4ec0\u4e48\u201d\u3001\u201c\u6211\u6015\u6211\u4e0d\u884c\u201d\uff09\u3002\n\n## \u4e8c\u3001 ABCD\u5224\u5b9a\u6811\u5206\u6790\n\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5:** **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u9009\u62e9\u4e86\u201c\u4e09\u4e2a\u534a\u6708\u7684\u201d\u8bfe\u7a0b\uff0c\u9500\u552e\u5f15\u5bfc\u652f\u4ed8\u5e76\u6dfb\u52a0\u73ed\u4e3b\u4efb\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5:** **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u6216\u914d\u5076\u610f\u89c1\uff0c\u7528\u6237\u4ee5\u201c\u6211\u201d\u81ea\u79f0\u51b3\u7b56\uff0c\u521d\u6b65\u5224\u65ad\u4e3a**\u4e2a\u4eba\u51b3\u7b56**\u3002**\u9700\u73ed\u4e3b\u4efb\u5728\u670d\u52a1\u542f\u52a8\u65f6\u7d27\u6025\u6838\u5b9e**\uff0c\u786e\u8ba4\u662f\u5426\u4e3a\u5bb6\u5ead\u5171\u540c\u51b3\u7b56\u53ca\u77e5\u60c5\uff0c\u907f\u514d\u540e\u7eed\u5bb6\u5ead\u7ea0\u7eb7\u3002\n*   **\u6b65\u9aa42 - \u52a8\u673a\u4e0e\u8d44\u6e90\u5224\u5b9a (A/B\u8f74):**\n    *   \u52a8\u673a\u660e\u786e\uff08\u5931\u4e1a\u538b\u529b/\u53d8\u73b0\uff09\u4f46\u7eaf\u5ea6\u4e2d\u7b49\uff08\u6df7\u5408\u9003\u907f\u4e0e\u4f9d\u8d56\uff09\u3002\n    *   \u8d44\u6e90\u5e95\u5ea7\u8584\u5f31\uff08\u7ecf\u6d4e\u7d27\u5f20\u3001\u6280\u80fd\u5c0f\u767d\u3001\u6ce8\u610f\u529b\u969c\u788d\uff09\u3002\n    *   \u5224\u5b9a\u4e3a **B\u578b\uff08\u52a8\u673a\u660e\u786e-\u8d44\u6e90\u4e0d\u8db3\uff09**\u3002\n*   **\u6b65\u9aa43 - \u5fc3\u7406\u5f39\u6027\u4e0e\u98ce\u9669\u5224\u5b9a (C/D\u8f74):**\n    *   \u5fc3\u7406\u5f39\u6027\u4f4e\uff0c\u6709\u663e\u8457\u8bd5\u9519\u521b\u4f24\u3001\u9ad8\u7126\u8651\u3001\u4f4e\u81ea\u6211\u6548\u80fd\u611f\u3002\n    *   \u5c5e\u4e8e**\u9ad8\u98ce\u9669\u6613\u632b\u8d25**\u7fa4\u4f53\u3002\n    *   \u7ed3\u5408B\u578b\uff0c\u6700\u7ec8\u5224\u5b9a\u4e3a **D\u7c7b\uff08\u52a8\u673a\u660e\u786e-\u8d44\u6e90\u4e0d\u8db3-\u5fc3\u7406\u5f39\u6027\u4f4e\uff09**\u3002**\u8fd9\u662f\u9000\u8d39\u4e0e\u6295\u8bc9\u7684\u6700\u9ad8\u98ce\u9669\u7c7b\u522b\u4e4b\u4e00**\u3002\n\n## \u4e09\u3001 \u7528\u6237\u539f\u578b\u5339\u914d\n\n*   **\u5339\u914d\u539f\u578b: T7 \u521b\u4f24\u540e\u56de\u907f\u8005**\n    *   **\u6838\u5fc3\u7279\u5f81:** \u56e0\u8fc7\u5f80\u5b66\u4e60/\u4ed8\u8d39\u5931\u8d25\u7ecf\u5386\uff08\u8bd5\u95194500\u5143\u65e0\u679c\uff09\u800c\u4ea7\u751f\u521b\u4f24\u540e\u5e94\u6fc0\uff0c\u5bf9\u518d\u6b21\u4ed8\u8d39\u5b66\u4e60\u62b1\u6709\u9ad8\u5ea6\u8b66\u60d5\u548c\u60b2\u89c2\u9884\u671f\uff08\u201c\u611f\u89c9\u50cf\u5de5\u4f5c\u5ba4\u7ed9\u9001\u94b1\u201d\uff09\u3002\n    *   **\u884c\u4e3a\u6a21\u5f0f:** \u6e34\u671b\u6539\u53d8\uff08\u56e0\u5931\u4e1a\u538b\u529b\uff09\uff0c\u4f46\u884c\u52a8\u4e0a\u72b9\u8c6b\u3001\u53cd\u590d\u81ea\u6211\u5426\u5b9a\uff0c\u9700\u8981\u6781\u5f3a\u7684\u5916\u90e8\u80af\u5b9a\u548c\u624b\u628a\u624b\u6307\u5bfc\uff08\u201c\u4e00\u5bf9\u4e00\u966a\u8dd1\u6bd4\u8f83\u9002\u5408\u4f60\u201d\uff09\u3002\n    *   **\u60c5\u7eea\u5e95\u8272:** \u9ad8\u7126\u8651\u3001\u4f4e\u81ea\u4fe1\u3001\u4e60\u5f97\u6027\u65e0\u52a9\u3002\n    *   **\u4e0eT4\uff08\u4f4e\u81ea\u4fe1\u63a2\u7d22\u8005\uff09\u7684\u533a\u522b:** T7\u6709\u660e\u786e\u7684\u3001\u8fd1\u671f\u53d1\u751f\u7684\u3001\u91d1\u94b1\u635f\u5931\u7684\u201c\u521b\u4f24\u4e8b\u4ef6\u201d\uff0c\u5176\u4e0d\u4fe1\u4efb\u611f\u548c\u6050\u60e7\u611f\u66f4\u5177\u4f53\u3001\u66f4\u5f3a\u70c8\u3002\n\n## \u56db\u3001 \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u6781\u9ad8)\n\n\u9010\u9879\u6392\u67e5\u9000\u8d39\u6839\u56e0\uff0c\u98ce\u9669\u6781\u9ad8\u56e0\u7d20\u5982\u4e0b\uff1a\n\n1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f:** **\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u81ea\u8eab\u80fd\u529b\u6781\u5ea6\u4e0d\u81ea\u4fe1\uff0c\u4e14\u6ce8\u610f\u529b\u6613\u5206\u6563\uff0c\u5b66\u4e60\u8fc7\u7a0b\u6781\u6613\u9047\u5230\u632b\u6298\u3002\u82e5\u521d\u671f\u4f5c\u54c1\u6548\u679c\u4e0d\u4f73\uff08\u5982\u5176\u81ea\u8bc4\u201c\u8f6f\u8db4\u8db4\u201d\uff09\uff0c\u4f1a\u8fc5\u901f\u5370\u8bc1\u5176\u8d1f\u9762\u9884\u671f\uff0c\u5bfc\u81f4\u653e\u5f03\u3002\n2.  **\u7ecf\u6d4e\u538b\u529b:** **\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5904\u4e8e\u5931\u4e1a\u8fb9\u7f18\uff0c\u5bf9\u5b66\u8d39\u654f\u611f\u3002\u4efb\u4f55\u989d\u5916\u7684\u7ecf\u6d4e\u6ce2\u52a8\u6216\u5bf9\u8bfe\u7a0b\u4ef7\u503c\u7684\u6000\u7591\u90fd\u53ef\u80fd\u76f4\u63a5\u89e6\u53d1\u9000\u8d39\u8bc9\u6c42\u3002\n3.  **\u8bfe\u7a0b/\u670d\u52a1\u4e0d\u7b26:** **\u4e2d\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u627f\u8bfa\u201c\u4e00\u5bf9\u4e00\u966a\u8dd1\u201d\u3001\u201c\u5b9a\u5411\u6d3e\u5355\u8df3\u8fc7\u8bd5\u7a3f\u201d\uff0c\u7528\u6237\u5bf9\u6b64\u62b1\u6709\u9ad8\u671f\u5f85\u3002**\u82e5\u4ea4\u4ed8\u9636\u6bb5\u51fa\u73b0\u966a\u8dd1\u4e0d\u53ca\u65f6\u3001\u6d3e\u5355\u673a\u4f1a\u5c11\u6216\u96be\u5ea6\u5927\u7b49\u60c5\u51b5\uff0c\u5c06\u7acb\u5373\u5f15\u53d1\u201c\u5386\u53f2\u91cd\u6f14\u201d\uff08\u88ab\u667e\u7740\uff09\u7684\u6050\u60e7\u548c\u5f3a\u70c8\u4e0d\u6ee1\u3002**\n4.  **\u5b66\u4e60\u969c\u788d:** **\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u81ea\u8ff0\u201c\u6ce8\u610f\u529b\u8fd9\u51e0\u5e74\u7279\u522b\u4e0d\u96c6\u4e2d\uff0c\u975e\u5e38\u5bb9\u6613\u8dd1\u504f\u201d\uff0c\u8fd9\u662f\u6301\u7eed\u5b66\u4e60\u7684\u5de8\u5927\u969c\u788d\uff0c\u6781\u6613\u5bfc\u81f4\u5176\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\u3002\n5.  **\u5bb6\u5ead\u53cd\u5bf9:** **\u5f85\u6838\u67e5\u9ad8\u98ce\u9669**\u3002\u76ee\u524d\u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u9274\u4e8e\u5176\u7ecf\u6d4e\u72b6\u51b5\u548c\u51b3\u7b56\u6a21\u5f0f\uff0c\u5bb6\u5ead\u4e0d\u77e5\u60c5\u6216\u53cd\u5bf9\u7684\u53ef\u80fd\u6027\u4e0d\u80fd\u6392\u9664\u3002\n6.  **\u7ade\u54c1/\u8d1f\u9762\u4fe1\u606f:** \u4e2d\u98ce\u9669\u3002\u7528\u6237\u6709\u88ab\u5176\u4ed6\u673a\u6784\u201c\u629b\u5f03\u201d\u7684\u7ecf\u5386\uff0c\u5bb9\u6613\u5728\u9047\u5230\u56f0\u96be\u65f6\u641c\u7d22\u5bf9\u6bd4\uff0c\u5f3a\u5316\u8d1f\u9762\u8ba4\u77e5\u3002\n7.  **\u91cd\u5927\u751f\u6d3b\u53d8\u6545:** \u9ad8\u98ce\u9669\u3002**\u201c\u6708\u5e95\u5931\u4e1a\u201d\u662f\u5373\u5c06\u53d1\u751f\u7684\u91cd\u5927\u53d8\u6545**\uff0c\u53ef\u80fd\u5f7b\u5e95\u6539\u53d8\u5176\u65f6\u95f4\u3001\u7cbe\u529b\u548c\u7ecf\u6d4e\u72b6\u51b5\uff0c\u76f4\u63a5\u5bfc\u81f4\u5b66\u4e60\u4e2d\u65ad\u3002\n\n## \u4e94\u3001 \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n\n*   **\u9500\u552e\u884c\u4e3a\u603b\u4f53\u5408\u89c4\uff0c\u4f46\u5b58\u5728\u98ce\u9669\u70b9:**\n    *   \u2705 \u672a\u53d1\u73b0\u5938\u5927\u6536\u76ca\u627f\u8bfa\uff08\u4e3b\u8981\u5f3a\u8c03\u5e73\u53f0\u8d44\u6e90\u4e0e\u63a5\u5355\u65b9\u5f0f\uff09\u3002\n    *   \u2705 \u5b66\u8d39\u62a5\u4ef7\u6e05\u6670\uff08\u201c\u5c0f\u51e0\u5343\u201d\u3001\u201c\u4e0d\u52304000\u201d\uff09\u3002\n    *   \u26a0\ufe0f **\u3010\u6f5c\u5728\u98ce\u9669\u70b9\u3011**\uff1a\u9500\u552e\u9488\u5bf9\u7528\u6237\u201c\u7f3a\u4e4f\u81ea\u4fe1\u201d\u3001\u201c\u9700\u8981\u4e00\u5bf9\u4e00\u201d\u7684\u75db\u70b9\uff0c\u5f3a\u8c03\u4e86\u201c\u4e00\u5bf9\u4e00\u966a\u8dd1\u201d\u548c\u201c\u8df3\u8fc7\u8bd5\u7a3f\u76f4\u63a5\u6d3e\u5355\u201d\u4f5c\u4e3a\u6838\u5fc3\u4ef7\u503c\u70b9\u3002\u8fd9**\u6781\u5927\u62ac\u9ad8\u4e86\u7528\u6237\u671f\u5f85**\u3002\u82e5\u540e\u7eed\u6807\u51c6\u670d\u52a1\u65e0\u6cd5\u6ee1\u8db3\u8fd9\u79cd\u9ad8\u5f3a\u5ea6\u3001\u9ad8\u6210\u529f\u7387\u7684\u4e2a\u6027\u5316\u9884\u671f\uff0c\u6781\u6613\u5f15\u53d1\u4e89\u8bae\u3002\n    *   \u26a0\ufe0f **\u3010\u5173\u952e\u96f7\u533a\u3011**\uff1a\u9500\u552e\u5df2\u77e5\u7528\u6237\u6709**\u8fd1\u671f\u4ed8\u8d39\u5931\u8d25\u521b\u4f24**\uff08\u88ab\u9a974500\u5143\uff09\u548c**\u5373\u5c06\u5931\u4e1a**\u7684\u7ecf\u6d4e\u538b\u529b\uff0c\u4ecd\u4e3b\u8981\u7528\u201c\u5438\u5f15\u529b\u6cd5\u5219\u201d\u3001\u201c\u4e8b\u5728\u4eba\u4e3a\u201d\u7b49\u8bdd\u672f\u9f13\u52b1\uff0c**\u672a\u5bf9\u5176\u5fc3\u7406\u72b6\u6001\u548c\u7ecf\u6d4e\u627f\u53d7\u529b\u8fdb\u884c\u5145\u5206\u7684\u98ce\u9669\u63d0\u793a\u4e0e\u9884\u671f\u7ba1\u7406**\u3002\u8fd9\u4e0d\u7b26\u5408\u5bf9\u9ad8\u98ce\u9669\u7528\u6237\u7684\u5ba1\u614e\u9500\u552e\u539f\u5219\u3002\n\n## \u516d\u3001 \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6: \u504f\u5dee**\n    *   \u6807\u51c6\u5316\u7684AI\u77ed\u89c6\u9891\u8bfe\u7a0b\u4e0e\u7528\u6237\u6240\u9700\u7684**\u9ad8\u5f3a\u5ea6\u5fc3\u7406\u652f\u6301\u3001\u624b\u628a\u624b\u5b9e\u64cd\u5e26\u9886\u3001\u5373\u65f6\u6b63\u53cd\u9988**\u7684\u9700\u6c42\u5b58\u5728\u504f\u5dee\u3002\u7528\u6237\u672c\u8d28\u9700\u8981\u7684\u662f\u201c\u5fc3\u7406\u91cd\u5efa+\u6280\u80fd\u6559\u5b66\u201d\u7684\u590d\u5408\u578b\u670d\u52a1\u3002\n\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c (\u9ec4\u91d124-72\u5c0f\u65f6):**\n    *   **1. \u7d27\u6025\u5efa\u7acb\u4fe1\u4efb\u4e0e\u5b89\u5168\u611f:** \u9996\u901a\u7535\u8bdd\u6216\u6df1\u5ea6\u6c9f\u901a\uff0c\u6838\u5fc3\u4e0d\u662f\u50ac\u4f5c\u4e1a\uff0c\u800c\u662f**\u5171\u60c5\u5176\u8fc7\u5f80\u521b\u4f24**\uff08\u201c\u4e86\u89e3\u5230\u60a8\u4e4b\u524d\u6709\u8fc7\u4e0d\u592a\u597d\u7684\u5b66\u4e60\u7ecf\u5386\uff0c\u8fd9\u6b21\u6211\u4eec\u4f1a\u7279\u522b\u5173\u6ce8\u60a8\u7684\u5b66\u4e60\u611f\u53d7\u201d\uff09\uff0c\u5e76\u6e05\u6670\u8bf4\u660e\u672c\u8bfe\u7a0b\u7684\u670d\u52a1\u6d41\u7a0b\u3001\u966a\u8dd1\u5f62\u5f0f\u3001\u6c42\u52a9\u6e20\u9053\uff0c**\u6253\u7834\u5176\u201c\u4ed8\u8d39\u540e\u5373\u88ab\u629b\u5f03\u201d\u7684\u6050\u60e7\u9884\u671f**\u3002\n    *   **2. \u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\u6743:** \u59d4\u5a49\u8be2\u95ee\u8bfe\u7a0b\u4ed8\u8d39\u662f\u5426\u4e0e\u5bb6\u4eba\u5546\u91cf\u8fc7\uff0c\u786e\u4fdd\u51b3\u7b56\u77e5\u60c5\uff0c\u9632\u8303\u5bb6\u5ead\u77db\u76fe\u5f15\u53d1\u7684\u9000\u8d39\u3002\n    *   **3. \u5927\u5e45\u964d\u4f4e\u521d\u59cb\u9884\u671f\u4e0e\u96be\u5ea6:** \u660e\u786e\u544a\u77e5\u5b66\u4e60\u521d\u671f\u4f1a\u9047\u5230\u7684\u56f0\u96be\uff08\u5982\u8f6f\u4ef6\u64cd\u4f5c\u3001\u751f\u6210\u6548\u679c\u4e0d\u7a33\u5b9a\uff09\uff0c\u5e76\u5c06\u5176**\u6b63\u5e38\u5316**\u3002\u4e3a\u5176\u8bbe\u5b9a\u201c\u5fae\u5c0f\u6210\u529f\u201d\u76ee\u6807\uff08\u5982\uff1a\u7b2c\u4e00\u5468\u53ea\u719f\u7ec3\u5b8c\u62103\u6b21\u751f\u56fe\uff09\uff0c\u786e\u4fdd\u5176\u83b7\u5f97\u5b8c\u6210\u611f\u548c\u63a7\u5236\u611f\u3002\n    *   **4. \u9ad8\u9891\u3001\u79ef\u6781\u7684\u5177\u4f53\u53cd\u9988:** \u5bf9\u5176\u4efb\u4f55\u5fae\u5c0f\u63d0\u4ea4\u548c\u8fdb\u6b65\u7ed9\u4e88**\u5177\u4f53\u3001\u5938\u5f20\u7684\u8868\u626c**\uff08\u5982\u201c\u8fd9\u4e2a\u6307\u4ee4\u8bcd\u7528\u5f97\u5f88\u51c6\u786e\uff01\u201d\u201c\u60a8\u63d0\u4ea4\u5f97\u5f88\u53ca\u65f6\uff01\u201d\uff09\uff0c\u5bf9\u6297\u5176\u201c\u81ea\u5351\u201d\u548c\u201c\u8d1f\u9762\u201d\u601d\u7ef4\u3002\n    *   **5. \u91cd\u70b9\u5173\u6ce8\u6ce8\u610f\u529b\u95ee\u9898:** \u5efa\u8bae\u5176\u4f7f\u7528\u756a\u8304\u5de5\u4f5c\u6cd5\u7b49\u5de5\u5177\uff0c\u5c06\u5b66\u4e60\u4efb\u52a1\u62c6\u89e3\u4e3a15\u5206\u949f\u4e00\u4e2a\u7684\u6a21\u5757\uff0c\u5e76\u63d0\u4f9b\u6e05\u6670\u7684\u4efb\u52a1\u6e05\u5355\u3002\n    *   **\u3010\u6301\u7eed\u98ce\u63a7\u3011**: \u5bc6\u5207\u5173\u6ce8\u5176\u4f5c\u4e1a\u63d0\u4ea4\u9891\u7387\u548c\u60c5\u7eea\u8a00\u8bba\u3002\u4e00\u65e6\u51fa\u73b0\u62d6\u5ef6\u3001\u6d88\u6781\u53d1\u8a00\uff08\u5982\u201c\u6211\u53c8\u4e0d\u884c\u4e86\u201d\uff09\uff0c\u9700\u7acb\u5373\u4e3b\u52a8\u4ecb\u5165\uff0c\u63d0\u4f9b\u652f\u6301\uff0c\u800c\u975e\u7b49\u5f85\u5176\u6c42\u52a9\u3002\n\n{\"core_type\": \"T7 \u521b\u4f24\u540e\u56de\u907f\u8005\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u7d27\u6025\u5171\u60c5\u521b\u4f24\uff0c\u91cd\u5efa\u4fe1\u4efb\u4e0e\u5b89\u5168\u611f\"}";
        document.getElementById('content').innerHTML = marked.parse(markdownText);
