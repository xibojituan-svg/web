    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677157322 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5b8b\u68a67(\u5b5f\u5a49\u83b9) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u9a6c\u62c9\u96c5\u6709\u58f0\u6f14\u64ad\u4f53\u9a8c\u8425/\u62db\u52df |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u672a\u6d89\u53ca\u652f\u4ed8\u73af\u8282 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u9ad8\u5bbd\u88d5\uff08\u9000\u4f11\uff0c\u6bcf\u65e5\u53ef\u5b89\u63923\u5c0f\u65f6\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u672a\u63d0\u53ca |\n| **\u4fe1\u606f\u539a\u5ea6** | \u9971\u6ee1 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e\uff0c\u4f46\u6709\u4e00\u5b9a\u5b66\u4e60\u57fa\u7840\u548c\u5174\u8da3\u652f\u6491\uff0c\u5e76\u975e\u7eaf\u201c\u51e0\u5929\u63d0\u73b0\u201d\u7684\u6781\u7aef\u53d8\u73b0\u9a71\u52a8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6765\u8fd9\u91cc\u7684\u76ee\u7684\u662f\u4ec0\u4e48\u5462\uff1f\u7528\u7a7a\u95f2\u65f6\u95f4\u8d5a\u94b1\u201d > \u201c\u6211\u6bd4\u8f83\u559c\u6b22\u8fd9\u884c\u7684\uff0c\u5373\u559c\u6b22\u53c8\u53ef\u4ee5\u8d5a\u94b1\uff0c\u4f55\u4e50\u800c\u4e0d\u4e3a\u5462\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b06\u9ad8]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4fe1\u606f\u4e0d\u8db3] \u2014 \u672a\u63d0\u53ca\uff0c\u4f46\u9000\u4f11\u72b6\u6001\u901a\u5e38\u6709\u7a33\u5b9a\u6536\u5165\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u9ad8] \u2014 \u9000\u4f11\uff0c\u660e\u786e\u8868\u793a\u201c\u6bcf\u5929\u53ef\u4ee5\u67093\u5c0f\u65f6\u7684\u65f6\u95f4\u5f55\u4e66\u201d\uff0c\u65f6\u95f4\u6781\u5ea6\u81ea\u7531\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u4e0d\u8db3] \u2014 \u672a\u63d0\u53ca\uff0c\u4f46\u8868\u793a\u201c\u5176\u5b83\u90fd\u6ca1\u6709\u95ee\u9898\u201d\uff0c\u521d\u6b65\u5224\u65ad\u65e0\u963b\u788d\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9762\u5bf9\u65b0\u6311\u6218\uff08\u6050\u6016\u60ac\u7591\u7c7b\uff09\u867d\u6709\u5fd0\u5fd1\uff0c\u4f46\u80fd\u4e3b\u52a8\u5c1d\u8bd5\u5e76\u5bfb\u6c42\u4e13\u4e1a\u53cd\u9988\uff0c\u65e0\u81ea\u5351\u6216\u4f9d\u8d56\u4fe1\u53f7\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08\uff0c\u6211\u4e5f\u662f\u7b2c\u4e00\u6b21\u8bfb\u6050\u6016\u60ac\u7591\u7c7b\u7684\u4e66\uff0c\u60f3\u6311\u6218\u4e00\u4e0b\u81ea\u5df1\uff0c\u4e0d\u77e5\u9053\u884c\u4e0d\u884c\uff0c\u5f88\u5fd0\u5fd1\u3002...\u6211\u73b0\u5728\u7684\u6c34\u5e73\u8fd8\u4e0d\u591f\uff0c\u8fd8\u9700\u4e0d\u65ad\u7684\u52aa\u529b\uff01\u8001\u5e08\uff0c\u4f60\u80fd\u8bc4\u4ef7\u4e00\u4e0b\u6211\u8bfb\u7684\u6587\u672c\u5417\uff1f\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u9000\u4f11\u540e\u5bfb\u6c42\u793e\u4f1a\u4ef7\u503c\u8ba4\u540c\u4e0e\u4e2a\u4eba\u6f5c\u80fd\u518d\u5f00\u53d1\uff0c\u6e34\u671b\u901a\u8fc7\u65b0\u6280\u80fd\u83b7\u5f97\u5c0a\u91cd\u548c\u6210\u5c31\u611f\uff0c\u800c\u4e0d\u4ec5\u4ec5\u662f\u91d1\u94b1\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u201c\u88ab\u9700\u8981\u201d\u7684\u6210\u5c31\u611f**\u3002\u5c06\u5979\u89c6\u4e3a\u6709\u6f5c\u529b\u7684\u201c\u51c6\u4e13\u4e1a\u4eba\u58eb\u201d\uff0c\u7ed9\u4e88\u6280\u672f\u4e0a\u7684\u6df1\u5ea6\u70b9\u8bc4\u548c\u672a\u6765\u5728\u201c\u5267\u7ec4\u201d\u4e2d\u7684\u89d2\u8272\u671f\u5f85\uff0c\u6ee1\u8db3\u5176\u88ab\u5c0a\u91cd\u548c\u81ea\u6211\u5b9e\u73b0\u7684\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe2 **A\u7c7b** (\u9ad8\u4ef7\u503c\u9886\u8896\u578b/\u6838\u5fc3\u7a33\u5b9a\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u9ad8\u52a8\u673a\u3001\u9ad8\u8d44\u6e90\u3001\u9ad8\u5f39\u6027\uff0c\u7a33\u5b9a\u6267\u884c\u8005) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u8a00\u8bba\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u9000\u4f11\u72b6\u6001\u5bb6\u5ead\u5e72\u9884\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u6781\u4f4e | \u65f6\u95f4\u5145\u88d5\uff0c\u5b66\u4e60\u610f\u613f\u5f3a\uff0c\u5d29\u76d8\u98ce\u9669\u6781\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u5bfb\u6c42\u6311\u6218\u548c\u53cd\u9988\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u632b\u6298\u7834\u9632\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u5bf9\u201c\u7528\u7a7a\u95f2\u65f6\u95f4\u8d5a\u94b1\u201d\u6709\u671f\u5f85\uff0c\u82e5\u957f\u671f\u65e0\u6cd5\u83b7\u5f97\u8bd5\u97f3\u901a\u8fc7\u6216\u63a5\u5355\u673a\u4f1a\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe\u540e1-2\u4e2a\u6708\uff0c\u82e5\u591a\u6b21\u8bd5\u97f3\u5931\u8d25\u4e14\u7f3a\u4e4f\u6b63\u5411\u53cd\u9988\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cX\u59d0/\u8001\u5e08\uff0c\u770b\u5230\u60a8\u6709\u4e30\u5bcc\u7684\u5b66\u4e60\u7ecf\u5386\u548c\u4f5c\u54c1\uff0c\u771f\u7684\u975e\u5e38\u96be\u5f97\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bad\u7ec3\u8425\u5c31\u662f\u9700\u8981\u60a8\u8fd9\u6837\u6709\u57fa\u7840\u3001\u6709\u70ed\u60c5\u7684\u524d\u8f88\u6765\u4e00\u8d77\u2018\u73a9\u2019\u51fa\u597d\u4f5c\u54c1\u3002\u60a8\u653e\u5fc3\uff0c\u6211\u4f1a\u628a\u6700\u6838\u5fc3\u7684\u5b9e\u6218\u6280\u5de7\u548c\u8d44\u6e90\u5bf9\u63a5\u7ed9\u60a8\uff0c\u54b1\u4eec\u7684\u76ee\u6807\u4e0d\u662f\u2018\u5b66\u2019\uff0c\u800c\u662f\u2018\u505a\u51fa\u80fd\u4e0a\u67b6\u3001\u80fd\u8d5a\u94b1\u7684\u7cbe\u54c1\u2019\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011+\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011\u3002\u56e0\u5176\u6709\u5b66\u4e60\u57fa\u7840\uff08\u68a8\u82b1\u58f0\u97f3\u7814\u4fee\u9662\u5b66\u4e60\u4e00\u5e74\u591a\uff09\uff0c\u53ef\u63d0\u4f9b\u66f4\u6df1\u5ea6\u7684\u6280\u672f\u6307\u5bfc\u548c\u6d3e\u5355\u673a\u4f1a\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5c06\u5979\u5f53\u4f5c\u201c\u5c0f\u767d\u201d\u6216\u201c\u8001\u5e74\u4eba\u201d\u8fdb\u884c\u8fc7\u5ea6\u5475\u62a4\u5f0f\u6559\u5b66\uff1b\u907f\u514d\u4f7f\u7528\u201c\u60a8\u5e74\u7eaa\u5927\u4e86\u6162\u6162\u6765\u201d\u7b49\u77ee\u5316\u6027\u8bed\u8a00\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u63a8\u4ecb\u9ad8\u9636\u8bfe\u7a0b\uff0c\u4f46**\u91cd\u70b9\u5e94\u653e\u5728\u6280\u672f\u63d0\u5347\u548c\u5b9e\u6218\u8d44\u6e90\u5bf9\u63a5\u4e0a**\uff0c\u800c\u975e\u5355\u7eaf\u8d29\u5356\u7126\u8651\u3002\u5979\u4e3a\u4ef7\u503c\u4e70\u5355\uff0c\u4e0d\u4e3a\u7126\u8651\u4e70\u5355\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6765\u8fd9\u91cc\u7684\u76ee\u7684\u662f\u4ec0\u4e48\u5462\uff1f\u7528\u7a7a\u95f2\u65f6\u95f4\u8d5a\u94b1\u201d\n2. > \u201c\u6211\u5df2\u5728\u559c\u9a6c\u62c9\u96c5\u91cc\u64ad\u4e86\u4e00\u90e8\u5c0f\u8bf4\uff0c\u7b97\u662f\u5904\u5973\u4f5c\u5427\uff0c\u6211\u5728\u68a8\u82b1\u58f0\u97f3\u7814\u4fee\u9662\u5df2\u5b66\u4e86\u4e00\u5e74\u591a\u4e86\uff0c\u73b0\u5728\u5728\u5b66\u914d\u97f3\u3002\u201d\n3. > \u201c\u8001\u5e08\uff0c\u6211\u4e5f\u662f\u7b2c\u4e00\u6b21\u8bfb\u6050\u6016\u60ac\u7591\u7c7b\u7684\u4e66\uff0c\u60f3\u6311\u6218\u4e00\u4e0b\u81ea\u5df1\uff0c\u4e0d\u77e5\u9053\u884c\u4e0d\u884c\uff0c\u5f88\u5fd0\u5fd1\u3002...\u6211\u73b0\u5728\u7684\u6c34\u5e73\u8fd8\u4e0d\u591f\uff0c\u8fd8\u9700\u4e0d\u65ad\u7684\u52aa\u529b\uff01\u8001\u5e08\uff0c\u4f60\u80fd\u8bc4\u4ef7\u4e00\u4e0b\u6211\u8bfb\u7684\u6587\u672c\u5417\uff1f\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7ed9\u4e88\u4e13\u4e1a\u8ba4\u53ef\u3001\u63d0\u4f9b\u660e\u786e\u8fdb\u9636\u8def\u5f84\u548c\u5b9e\u6218\u63a5\u5355\u673a\u4f1a\uff0c\u907f\u514d\u5c06\u5176\u201c\u5c0f\u767d\u5316\u201d\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd/\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5feb\u901f\u63a5\u5355\u7ebf\"}\n```";
