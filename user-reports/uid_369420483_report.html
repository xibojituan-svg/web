        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 369420483 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-02-16 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u559c\u64ad\u7acb\u7acb\u3001\u559c\u64ad\u7490\u7490\u3001\u59b9\u5c0f\u753b(\u5e9e\u6d77\u82b1)\u3001\u552f\u58f9\u73ed\u73ed/\u771f\u4eba(\u4efb\u5ce5) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u77ed\u89c6\u9891AI\u8bfe\u7a0b\uff08\u4ef7\u683c\u672a\u660e\u786e\uff0c\u63d0\u53ca\u201c2980\u201d\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u4f46\u7528\u6237\u5bf9\u4ef7\u683c\u654f\u611f\uff08\u201c\u53c8\u662f2980[\u6342\u8138]\u6211\u6682\u65f6\u4e0d\u4e70\u201d\uff09\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5177\u4f53\u804c\u4e1a\u6216\u65f6\u95f4\u5b89\u6392\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u6709\u6280\u672f\u8ba8\u8bba\u548c\u62a5\u540d\u610f\u5411\uff0c\u4f46\u7f3a\u4e4f\u4e2a\u4eba\u80cc\u666f\u3001\u8d44\u6e90\u3001\u6df1\u5c42\u52a8\u673a\u7b49\u5173\u952e\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9AI\u5de5\u5177\uff08\u5199\u4f5c\u3001\u89c6\u9891\u751f\u6210\uff09\u7684\u6d53\u539a\u5174\u8da3\u548c\u63a2\u7d22\u6b32\uff0c\u4e3b\u52a8\u5206\u4eab\u5de5\u5177\uff0c\u5e76\u53c2\u4e0e\u6280\u672f\u8ba8\u8bba\u3002\u867d\u6709\u53d8\u73b0\u671f\u671b\uff08\u201c\u6211\u662f\u4e0d\u666e\u901a\u7684\u6ca1\u6cd5\u53d8\u73b0\u7684\u975e\u51e1\u4eba\u201d\uff09\uff0c\u4f46\u5e76\u975e\u6781\u7aef\u3001\u6025\u8feb\u7684\u53d8\u73b0\u9a71\u52a8\uff0c\u66f4\u591a\u662f\u5174\u8da3\u9a71\u52a8\u4e0b\u7684\u5c1d\u8bd5\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u7ed9\u5927\u5bb6\u5206\u4eab\u4e00\u4e2a\u597d\u7528\u7684\u5199\u4f5c\u5de5\u5177\uff0c\u6574\u7406\u6587\u672c\u5185\u5bb9\u8bbe\u8ba1\u5206\u955c\u5185\u5bb9\u5de5\u5177...\u201d > \u201c\u6211\u662f\u4e0d\u666e\u901a\u7684\u6ca1\u6cd5\u53d8\u73b0\u7684\u975e\u51e1\u4eba\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u5bf9\u8bfe\u7a0b\u4ef7\u683c\uff082980\uff09\u654f\u611f\uff0c\u8868\u793a\u201c\u6682\u65f6\u4e0d\u4e70\u201d\uff0c\u4e14\u63d0\u53ca\u201c\u6211\u6ca1\u90a3\u4e48\u591a\u4f1a\u5458\u201d\uff0c\u663e\u793a\u6d88\u8d39\u8f83\u4e3a\u8c28\u614e\uff0c\u975e\u9ad8\u6d88\u8d39\u529b\u4eba\u7fa4\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u7528\u6237\u4e92\u52a8\u98ce\u683c\u8f7b\u677e\u3001\u5e7d\u9ed8\uff08\u5927\u91cf\u4f7f\u7528[\u65fa\u67f4][\u7834\u6d95\u4e3a\u7b11]\uff09\uff0c\u9762\u5bf9\u5de5\u5177\u6392\u961f\u5ef6\u8fdf\uff08\u201c\u5feb12\u5c0f\u65f6\u4e86\u201d\uff09\u65f6\u60c5\u7eea\u7a33\u5b9a\uff0c\u80fd\u4e3b\u52a8\u5bfb\u6c42\u66ff\u4ee3\u65b9\u6848\u5e76\u8c03\u4f83\u81ea\u5df1\u3002\u65e0\u4efb\u4f55\u81ea\u5351\u3001\u7126\u8651\u6216\u4f9d\u8d56\u5b89\u629a\u7684\u4fe1\u53f7\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4e0a\u5468\u4e00\u53d1\u7684\uff0c\u65e9\u6fc0\u52a8\u8fc7\u4e86[\u65fa\u67f4][\u65fa\u67f4][\u65fa\u67f4]\u201d > \u201c\u6211\u662f\u4e0d\u666e\u901a\u7684\u6ca1\u6cd5\u53d8\u73b0\u7684\u975e\u51e1\u4eba[\u65fa\u67f4]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42 / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5728\u6280\u672f\u63a2\u7d22\u548c\u793e\u7fa4\u4e92\u52a8\u4e2d\u5bfb\u6c42\u8ba4\u540c\u4e0e\u4e50\u8da3\uff0c\u800c\u975e\u7eaf\u7cb9\u7684\u751f\u5b58\u538b\u529b\u6216\u53d8\u73b0\u7126\u8651\u3002\u5176\u201c\u65e0\u6cd5\u53d8\u73b0\u7684\u975e\u51e1\u4eba\u201d\u7684\u81ea\u5632\uff0c\u9690\u542b\u4e86\u5bf9\u81ea\u8eab\u72ec\u7279\u6027\u88ab\u770b\u89c1\u3001\u88ab\u8ba4\u53ef\u7684\u6e34\u671b\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u63d0\u4f9b\u4e00\u4e2a\u6709\u5171\u540c\u8bed\u8a00\u3001\u80fd\u73a9\u5230\u4e00\u8d77\u7684\u201c\u6280\u672f\u540c\u597d\u5708\u201d**\u3002\u8ba9\u4ed6\u611f\u5230\u81ea\u5df1\u662f\u201c\u5708\u5185\u4eba\u201d\uff0c\u4ed6\u7684\u5206\u4eab\u548c\u63a2\u7d22\u6709\u4ef7\u503c\uff0c\u5e76\u80fd\u5728\u6b64\u83b7\u5f97\u4e50\u8da3\u548c\u6210\u5c31\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1** \u7c7b |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T5 \u597d\u73a9\u5c1d\u9c9c\u8005** (\u5174\u8da3\u9a71\u52a8\uff0c\u4f4e\u538b\u529b\uff0c\u9ad8\u793e\u4ea4\u4e92\u52a8\u610f\u613f) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u96f6\u4e92\u52a8\u7b49\u5371\u9669\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u57fa\u4e8e\u5176\u72ec\u7acb\u4e92\u52a8\u98ce\u683c\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4e2d | \u5982\u679c\u8bfe\u7a0b\u5185\u5bb9\u67af\u71e5\u3001\u7f3a\u4e4f\u4e92\u52a8\u4e50\u8da3\uff0c\u6216\u793e\u7fa4\u6c1b\u56f4\u6c89\u95f7\uff0c\u4ed6\u53ef\u80fd\u56e0\u201c\u4e0d\u597d\u73a9\u201d\u800c\u6d41\u5931\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u632b\u6298\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u5982\u679c\u8bfe\u7a0b\u8fc7\u5ea6\u627f\u8bfa\u201c\u5feb\u901f\u53d8\u73b0\u201d\u800c\u5b9e\u9645\u65e0\u6cd5\u6ee1\u8db3\uff0c\u53ef\u80fd\u56e0\u9884\u671f\u843d\u5dee\u800c\u9000\u8d39\u3002\u4f46\u5176\u4e3b\u8981\u9a71\u52a8\u662f\u5174\u8da3\uff0c\u98ce\u9669\u4f4e\u4e8e\u7eaf\u53d8\u73b0\u9a71\u52a8\u8005\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe\u540e1-2\u5468\uff0c\u82e5\u8bfe\u7a0b\u5185\u5bb9\u6216\u793e\u7fa4\u6c1b\u56f4\u65e0\u6cd5\u6301\u7eed\u63d0\u4f9b\u65b0\u9c9c\u611f\u548c\u4e92\u52a8\u4e50\u8da3\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u563f\uff0c\u770b\u5230\u4f60\u5206\u4eab\u7684Loomi\u5de5\u5177\u4e86\uff0c\u4e00\u770b\u5c31\u662f\u4f1a\u73a9\u7684\uff01\u54b1\u4eec\u73ed\u5c31\u7f3a\u4f60\u8fd9\u6837\u7231\u6298\u817e\u3001\u80fd\u53d1\u73b0\u597d\u4e1c\u897f\u7684\u540c\u5b66\u3002\u4ee5\u540e\u6709\u5565\u65b0\u73a9\u5177\u3001\u65b0\u73a9\u6cd5\uff0c\u968f\u65f6\u5728\u7fa4\u91cc\u7529\u94fe\u63a5\uff0c\u5e26\u7740\u5927\u5bb6\u4e00\u8d77\u73a9\u8d77\u6765\uff01\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5174\u8da3\u6e38\u4e50\u7ebf**\u3011\u3002\u4e3b\u6253\u8f7b\u677e\u3001\u6709\u8da3\u3001\u80fd\u5feb\u901f\u4ea7\u51fa\u201c\u597d\u73a9\u201d\u6210\u679c\u7684\u8f7b\u91cf\u5185\u5bb9\uff0c\u907f\u514d\u6c89\u91cd\u67af\u71e5\u7684\u7406\u8bba\u6559\u5b66\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u793e\u7fa4\u6c1b\u56f4\u7ec4\u7279\u6743**\u3011\u3002\u9f13\u52b1\u4ed6\u5728\u7fa4\u5185\u53d1\u8d77\u8bdd\u9898\u3001\u
