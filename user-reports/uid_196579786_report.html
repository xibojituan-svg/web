    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 196579786 (\u6635\u79f0\uff1a\u4e1c\u7bf1\u843d) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u68a6\u5883/\u6797\u56093 (\u8463\u71d5) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b (\u9ad8\u9636\u73ed) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u65e0\u6cd5\u5224\u65ad\u8d44\u91d1\u538b\u529b\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u5ba1\u8ba1\u5de5\u4f5c\uff0c\u665a\u4e0a\u5e38\u52a0\u73ed\uff0c\u53ea\u80fd\u5229\u7528\u5348\u4f11\u3001\u901a\u52e4\u540e\u7b49\u788e\u7247\u65f6\u95f4\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u6709\u660e\u786e\u804c\u4e1a\u3001\u5b66\u4e60\u884c\u4e3a\u3001\u5174\u8da3\u504f\u597d\uff0c\u4f46\u7f3a\u4e4f\u652f\u4ed8\u3001\u5bb6\u5ead\u3001\u6df1\u5c42\u52a8\u673a\u7b49\u5173\u952e\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34(\u4e2d)**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u76ee\u7684\u662f\u201c\u517c\u804c\u201d\uff0c\u5bf9\u53d8\u73b0\u673a\u4f1a\uff08\u8bd5\u97f3\u5355\uff09\u6709\u79ef\u6781\u56de\u5e94\u3002\u4f46\u540c\u65f6\uff0c\u5979\u8868\u73b0\u51fa\u5bf9\u201c\u7ea0\u6b63\u53d1\u97f3\u201d\u7684\u5174\u8da3\uff0c\u4eab\u53d7\u9605\u8bfb\u672c\u8eab\uff08\u201c\u6211\u633a\u559c\u6b22\u8bfb\u4e66\u201d\uff09\uff0c\u5e76\u8ba4\u771f\u5b8c\u6210\u4f5c\u4e1a\u3001\u5bfb\u6c42\u6280\u672f\u70b9\u8bc4\u3002\u52a8\u673a\u662f\u201c\u53d8\u73b0+\u5174\u8da3\u201d\u7684\u6df7\u5408\u4f53\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6765\u8fd9\u91cc\u7684\u76ee\u7684\u662f\u7f8e\u5316\u58f0\u97f3\u8fd8\u662f\u517c\u804c\u526f\u4e1a\uff1f\u517c\u804c\u201d > \u201c\u6211\u633a\u559c\u6b22\u8bfb\u4e66\u201d > \u201c\u8001\u5e08\uff0c\u6211\u662f\u4e0d\u662f\u7684\u5148\u628a\u6587\u7ae0\u8bfb\u719f\u4e86\uff0c\u624d\u80fd\u66f4\u987a\u7545\u548c\u6709\u611f\u60c5\uff1f\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u5ba1\u8ba1\u804c\u4e1a\u901a\u5e38\u6536\u5165\u7a33\u5b9a\uff0c\u4f46\u672a\u63d0\u53ca\u652f\u4ed8\u80fd\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u2b07\u4f4e** \u2014 \u5ba1\u8ba1\u5de5\u4f5c\u7e41\u5fd9\uff0c\u665a\u4e0a\u5e38\u52a0\u73ed\uff0c\u5b66\u4e60\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\uff0c\u4f9d\u8d56\u5348\u4f11\u548c\u4e0b\u73ed\u540e\u3002\u8fd9\u662f\u6700\u660e\u663e\u7684\u77ed\u677f\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8 (7-8\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u65f6\u95f4\u538b\u529b\uff08\u52a0\u73ed\uff09\u548c\u73af\u5883\u9650\u5236\uff08\u529e\u516c\u73af\u5883\u590d\u6742\uff09\uff0c\u5979\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff08\u201c\u6211\u4e2d\u5348\u627e\u4e2a\u5730\u65b9\u5f04\u4e0b\u201d\uff09\uff0c\u800c\u975e\u62b1\u6028\u6216\u653e\u5f03\u3002\u4e3b\u52a8\u63d0\u95ee\u6280\u672f\u95ee\u9898\uff0c\u5bf9\u70b9\u8bc4\u53cd\u9988\u79ef\u6781\u63a5\u53d7\u5e76\u611f\u8c22\uff0c\u8868\u73b0\u51fa\u826f\u597d\u7684\u5b66\u4e60\u5fc3\u6001\u548c\u6267\u884c\u529b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08\uff0c\u6211\u6700\u5fd9\uff0c\u665a\u4e0a\u8981\u52a0\u73ed\uff0c\u6211\u53ef\u4ee5\u53c2\u52a0\u4e0b\u4e00\u671f\u5417\uff1f\u201d > \u201c\u6709\uff0c\u6211\u4e2d\u5348\u627e\u4e2a\u5730\u65b9\u5f04\u4e0b\u201d > \u201c\u55ef\u55ef\uff0c\u597d\u7684\uff0c\u6211\u7b49\u4e0b\u8bd5\u8bd5\uff0c\u8c22\u8c22\u8001\u5e08\u7cbe\u5f69\u70b9\u8bc4\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42 / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u804c\u4e1a\u5026\u6020\u4e0e\u81ea\u6211\u4ef7\u503c\u63a2\u7d22**\u3002\u5ba1\u8ba1\u5de5\u4f5c\uff08\u5e38\u52a0\u73ed\u3001\u73af\u5883\u590d\u6742\uff09\u53ef\u80fd\u5e26\u6765\u538b\u529b\u548c\u91cd\u590d\u611f\uff0c\u5979\u5bfb\u6c42\u4e00\u4e2a\u80fd\u53d1\u6325\u58f0\u97f3\u4f18\u52bf\u3001\u83b7\u5f97\u5373\u65f6\u6b63\u53cd\u9988\uff08\u8001\u5e08\u5938\u5956\u201c\u58f0\u97f3\u6761\u4ef6\u975e\u5e38\u597d\u201d\uff09\u3001\u5e76\u53ef\u80fd\u5e26\u6765\u989d\u5916\u6210\u5c31\u611f\u548c\u6536\u5165\u7684\u201c\u7b2c\u4e8c\u8eab\u4efd\u201d\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u5708\u5c42\u5f52\u5c5e\u611f**\u3002\u5979\u9700\u8981\u88ab\u770b\u89c1\u3001\u88ab\u80af\u5b9a\uff08\u201c\u4f60\u5f88\u6709\u609f\u6027\u201d\uff09\uff0c\u5e76\u6e34\u671b\u8fdb\u5165\u4e00\u4e2a\u80fd\u8ba9\u5979\u201c\u653e\u5f00\u201d\u548c\u201c\u8fdb\u6b65\u201d\u7684\u3001\u6709\u5171\u540c\u7231\u597d\u7684\u793e\u7fa4\uff08\u5982\u5267\u7ec4\uff09\uff0c\u4ee5\u5bf9\u6297\u65e5\u5e38\u5de5\u4f5c\u7684\u67af\u71e5\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u8fdb\u5316\u524d\u4f53\uff0c\u6709\u5411\u6df7\u5408\u4f533\u53f7\u3010\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b\u3011\u53d1\u5c55\u7684\u6f5c\u529b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u804c\u4e1a\u5973\u6027\u901a\u5e38\u6709\u81ea\u4e3b\u6743\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u5ba1\u8ba1\u5de5\u4f5c\u7e41\u5fd9\uff0c\u82e5\u8bfe\u7a0b\u5f3a\u5ea6\u4e0e\u5de5\u4f5c\u65f6\u95f4\u6301\u7eed\u51b2\u7a81\uff0c\u5bfc\u81f4\u4f5c\u4e1a\u79ef\u538b\u3001\u65e0\u6cd5\u53c2\u4e0e\u76f4\u64ad\uff0c\u53ef\u80fd\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u4ea7\u751f\u81ea\u8d23\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u632b\u6298\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u82e5\u5728\u6295\u5165\u65f6\u95f4\u540e\uff0c\u957f\u671f\u65e0\u6cd5\u83b7\u5f97\u8bd5\u97f3\u6210\u529f\u6216\u53d8\u73b0\u53cd\u9988\uff0c\u53ef\u80fd\u56e0\u201c\u6295\u5165\u4ea7\u51fa\u6bd4\u5931\u8861\u201d\u800c\u52a8\u6447\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\u3002\u5f53\u5de5\u4f5c\u8fdb\u5165\u5fd9\u5b63\uff0c\u5b66\u4e60\u4efb\u52a1\u6301\u7eed\u79ef\u538b\uff0c\u800c\u53d8\u73b0\u8def\u5f84\u5c1a\u4e0d\u660e\u6717\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u5979\u8bf4......\u201d**\n> \u201c\u4e1c\u7bf1\u843d\uff0c\u770b\u5230\u4f60\u5ba1\u8ba1\u5de5\u4f5c\u8fd9\u4e48\u5fd9\u8fd8\u575a\u6301\u5b66\u4e60\uff0c\u771f\u7684\u5f88\u4f69\u670d\u4f60\u7684\u884c\u52a8\u529b\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u7a0b\u5c31\u662f\u4e3a\u50cf\u4f60\u8fd9\u6837\u65f6\u95f4\u5b9d\u8d35\u7684\u804c\u573a\u4eba\u8bbe\u8ba1\u7684\uff0c**\u8282\u594f\u548c\u4efb\u52a1\u90fd\u53ef\u4ee5\u7075\u6d3b\u8c03\u6574**\u3002\u4f60\u4e0d\u7528\u6709\u2018\u5fc5\u987b\u8ddf\u4e0a\u76f4\u64ad\u2019\u7684\u538b\u529b\uff0c\u6838\u5fc3\u662f\u638c\u63e1\u65b9\u6cd5\uff0c\u5229\u7528\u788e\u7247\u65f6\u95f4\u7ec3\u4e60\u3002\u6709\u4efb\u4f55\u65f6\u95f4\u51b2\u7a81\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4eec\u4e00\u8d77\u89c4\u5212\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5979\u7684\u5b66\u4e60\u6001\u5ea6\u548c\u6267\u884c\u529b\u9002\u5408\u7cfb\u7edf\u5316\u3001\u6709\u6df1\u5ea6\u7684\u5185\u5bb9\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T2\u8001\u9ec4\u725b\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010B\u6a21\u5757(\u6ee1\u914d)\uff1a\u786c\u6838\u624b\u827a\u6c60\u3011**\uff0c\u5373\u63d0\u4f9b\u9ad8\u8d28\u91cf\u7684\u6280\u672f\u70b9\u8bc4\u3001\u6d3e\u53d1\u6709\u6311\u6218\u6027\u7684\u5b9e\u64cd\u4efb\u52a1\u3002\u540c\u65f6\uff0c\u89c2\u5bdf\u5176\u662f\u5426\u6709\u7ec4\u7ec7\u6f5c\u529b\uff0c\u4e3a\u672a\u6765\u53ef\u80fd\u7684 **\u3010D\u6a21\u5757\uff1a\u9ec4\u888d\u52a0\u8eab\u63d0\u5e72\u3011** \u505a\u51c6\u5907\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u6240\u6709\u4eba\u90fd\u5fc5\u987b\u8ddf\u76f4\u64ad\u201d\u7684\u96c6\u4f53\u8bdd\u672f\u65bd\u538b\uff1b\u5728\u5979\u56e0\u5de5\u4f5c\u5ef6\u8bef\u65f6\u8868\u73b0\u51fa\u4e0d\u8010\u70e6\u6216\u8d23\u5907\uff1b\u5728\u5979\u6280\u672f\u7cbe\u8fdb\u540e\u4ecd\u7528\u5bf9\u5f85\u65b0\u624b\u7684\u53e3\u543b\u6c9f\u901a\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u8fdb\u884c\u5927\u989d\u63a8\u4ecb\uff08\u5982\u9ad8\u9636\u8bfe\u3001\u8bbe\u5907\uff09\uff0c\u4f46\u5fc5\u987b\u5efa\u7acb\u5728**\u5979\u5df2\u53d6\u5f97\u660e\u786e\u5b66\u4e60\u6210\u679c\uff08\u5982\u6210\u529f\u8bd5\u97f3\uff09\u5e76\u4e3b\u52a8\u8be2\u95ee\u8fdb\u9636\u8def\u5f84\u4e4b\u540e**\u3002\u907f\u514d\u5728\u5979\u65f6\u95f4\u6700\u7d27\u5f20\u65f6\u63a8\u9500\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u8001\u5e08\uff0c\u6211\u6700\u5fd9\uff0c\u665a\u4e0a\u8981\u52a0\u73ed\uff0c\u6211\u53ef\u4ee5\u53c2\u52a0\u4e0b\u4e00\u671f\u5417\uff1f\u201d **(\u8d44\u6e90\u5e95\u5ea7\u77ed\u677f\uff1a\u65f6\u95f4\u788e\u7247\u5316)**\n2. > \u201c\u6765\u8fd9\u91cc\u7684\u76ee\u7684\u662f\u7f8e\u5316\u58f0\u97f3\u8fd8\u662f\u517c\u804c\u526f\u4e1a\uff1f\u517c\u804c\u201d **(\u52a8\u673a\uff1a\u517c\u804c\u53d8\u73b0+\u5174\u8da3\u6df7\u5408)**\n3. > \u201c\u55ef\uff0c\u8305\u585e\u987f\u5f00\uff0c\u5f55\u5236\u7a81\u7136\u80fd\u653e\u5f00\u4e86\u201d **(\u5fc3\u7406\u5f39\u6027\u9ad8\uff1a\u79ef\u6781\u5438\u6536\u53cd\u9988\uff0c\u83b7\u5f97\u6210\u957f\u6b63\u53cd\u9988)**\n4. > \u201c\u6211\u633a\u559c\u6b22\u8bfb\u4e66\u201d **(\u6df1\u5c42\u5174\u8da3\u9a71\u52a8\uff0c\u975e\u7eaf\u529f\u5229)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u7e41\u5fd9\u5de5\u4f5c\u4e2d\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u65b0\u7684\u793e\u4ea4\u5708\u5c42\u5f52\u5c5e\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u9ad8\u5ea6\u7075\u6d3b\u7684\u65f6\u95f4\u5b89\u6392\u652f\u6301\u4e0e\u9ad8\u8d28\u91cf\u7684\u6280\u672f\u53cd\u9988\uff0c\u4e25\u9632\u201c\u65f6\u95f4\u51b2\u7a81\u5bfc\u81f4\u7684\u79ef\u538b\u6027\u5d29\u6e83\u201d\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b\", \"maslow_need\": \"\u793e\u4ea4/\u5c0a\u91cd\u9700\u6c42\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\"}\n```";
