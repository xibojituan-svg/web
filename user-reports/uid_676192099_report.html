    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a676192099\uff08\u6635\u79f0\uff1a\u8584\u8377\u7cd6\uff09\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a676192099 / \u6635\u79f0\uff1a\u8584\u8377\u7cd6 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-12 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u552f\u58f9\u73ed\u73ed\uff08\u4efb\u5ce5\uff09\u3001\u60a0\u60a0\u5341\u4e00\u6708\uff08\u9ad8\u8273\uff09\u3001\u7af9\u9752\u6311\u6708\uff08\u9a6c\u5efa\u5a1c\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u6f2b\u5267\u7279\u8bad\u8425\uff08L3\u8bfe\u7a0b\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u660e\u786e\u63d0\u53ca\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\uff08\u6709\u5b66\u4e60\u4e92\u52a8\uff0c\u4f46\u5173\u952e\u4e09\u8f74\u4fe1\u606f\u5982\u8d44\u91d1\u3001\u65f6\u95f4\u3001\u5bb6\u5ead\u80cc\u666f\u7f3a\u5931\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06**\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u4e3a\u80fd\u529b\u4e0e\u6210\u957f\u800c\u6765**\u3002\u5173\u6ce8\u8bfe\u7a0b\u5185\u5bb9\u3001\u5b66\u4e60\u89c4\u5219\u3001\u6280\u672f\u8fed\u4ee3\uff0c\u5bf9\u53d8\u73b0\u7684\u8ffd\u95ee\u662f\u52a1\u5b9e\u4e14\u7406\u6027\u7684\uff0c\u800c\u975e\u6025\u529f\u8fd1\u5229\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u8fd9AI\u8fed\u4ee3\u8fd9\u4e48\u5feb\uff0c\u6765\u5f97\u53ca\u6559\u5417\uff0c\u201d (\u5173\u6ce8\u8bfe\u7a0b\u5185\u5bb9\u4e0e\u65f6\u6548\u6027)\n  > \u201c@\u9ed1\u767d\uff08\u95ed\u5173\u4e2d\uff09\u2005\u5927\u5927\uff0c\u54b1\u4eec\u7fa4\u91cc\u6709\u4eba\u9009\u4e2d\u7684\u4e66\uff0c\u5176\u4ed6\u4eba\u5c31\u4e0d\u80fd\u505a\u4e86\u5bf9\u5417\u201d (\u5173\u6ce8\u5b66\u4e60\u89c4\u5219\u4e0e\u516c\u5e73\u6027)\n  > \u201c\u6211\u7684\u8fd8\u6ca1\u5f00\u59cb\u505a\u5462\uff0c\u6296\u97f3\u4e0a\u5c31\u5237\u5230\u81f3\u5c11\u4e24\u4e2a\u7248\u672c\u4e86\uff0c\u6211\u8fd8\u505a\u5417[\u6487\u5634]\u201d (\u5173\u6ce8\u5e02\u573a\u7ade\u4e89\u4e0e\u81ea\u8eab\u5b9e\u8df5\u4ef7\u503c)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1**\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u4e3b\u52a8\u8be2\u95ee\u4f18\u60e0\uff0c\u5bf9\u4ef7\u683c\u654f\u611f\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u501f\u8d37\u6216\u6781\u7aef\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u6309\u65f6\u63a5\u6536\u4fe1\u606f\u3001\u63d0\u95ee\u3001\u5173\u6ce8\u56de\u653e\uff0c\u8868\u660e\u6709\u7a33\u5b9a\u7684\u5b66\u4e60\u6295\u5165\u65f6\u95f4\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u65f6\u95f4\u5b89\u6392\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u672a\u77e5** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06**\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3**\u3002\u9047\u5230\u95ee\u9898\uff08\u5982\u56fe\u7247\u98ce\u683c\u4e0d\u7b26\u3001\u62c5\u5fc3\u7ade\u4e89\uff09\u4f1a\u4e3b\u52a8\u63d0\u95ee\u5bfb\u6c42\u786e\u8ba4\uff0c\u5f97\u5230\u89e3\u7b54\u540e\u80fd\u8fc5\u901f\u8c03\u6574\uff08\u201c\u597d\u7684\uff0c\u660e\u767d\u4e86\u201d\u3001\u201c\u90a3\u6211\u6362\u4e00\u5f20\u201d\uff09\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u65e0\u62b1\u6028\u6216\u5d29\u6e83\u8ff9\u8c61\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u5199\u5b9e\u98ce\u7684\uff0c\u8fd9\u4e2a\u7b97\u5d29\u4e86\u5417\u201d\u3001\u201c\u6211\u60f3\u653e\u5728\u4f5c\u4e1a\u91cc\u201d (\u9047\u5230\u4e0d\u786e\u5b9a\uff0c\u4e3b\u52a8\u6c42\u8bc1)\n  > \u201c\u6211\u8fd9\u6c34\u5e73\u8fd8\u4f20\u6388\u4ec0\u4e48\u7ecf\u9a8c\u554a\uff0c\u8fc7\u53bb\u5149\u542c\u8001\u5e08\u8bb2\u8bfe\u884c\u4e0d\u884c[\u5077\u7b11]\u201d (\u6709\u81ea\u8c26\uff0c\u4f46\u5fc3\u6001\u8f7b\u677e\uff0c\u4e50\u4e8e\u53c2\u4e0e)\n  > \u201c\u6211\u6015\u6211\u88ab\u5377\u6b7b\u201d[\u6487\u5634] (\u867d\u6709\u538b\u529b\u611f\u77e5\uff0c\u4f46\u4ee5\u8c03\u4f83\u65b9\u5f0f\u8868\u8fbe\uff0c\u5e76\u5bfb\u6c42\u786e\u8ba4)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u81ea\u8eab\u80fd\u529b\u5728\u7ade\u4e89\u73af\u5883\u4e2d\u7684\u4ef7\u503c\u4e0d\u786e\u5b9a**\u3002\u5979\u62c5\u5fc3\u81ea\u5df1\u7684\u4f5c\u54c1\u5728\u6296\u97f3\u4e0a\u5df2\u6709\u591a\u4e2a\u7248\u672c\uff0c\u5bb3\u6015\u201c\u88ab\u5377\u6b7b\u201d\uff0c\u8fd9\u66b4\u9732\u4e86\u5979\u6e34\u671b\u83b7\u5f97\u8ba4\u53ef\u3001\u5728\u793e\u7fa4\u548c\u5e02\u573a\u4e2d\u786e\u7acb\u81ea\u8eab\u72ec\u7279\u4ef7\u503c\u7684\u6df1\u5c42\u9700\u6c42\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u63d0\u4f9b\u660e\u786e\u7684\u6210\u957f\u8def\u5f84\u548c\u201c\u88ab\u770b\u89c1\u201d\u7684\u821e\u53f0**\u3002\u5979\u9700\u8981\u7684\u4e0d\u53ea\u662f\u6280\u80fd\uff0c\u66f4\u662f\u901a\u8fc7\u6280\u80fd\u83b7\u5f97\u5728\u793e\u7fa4\u5185\u7684\u5c0a\u91cd\u548c\u72ec\u7279\u8eab\u4efd\u8ba4\u540c\uff0c\u8bc1\u660e\u81ea\u5df1\u201c\u5b66\u6709\u6240\u503c\u201d\u3001\u201c\u4e0e\u4f17\u4e0d\u540c\u201d\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u8fdb\u5316\u524d\u4f53\uff0c\u6709\u5411\u6df7\u5408\u4f533\u53f7\u3010\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b\u3011\u53d1\u5c55\u7684\u6f5c\u529b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u8a00\u8bba\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u65e0\u6cd5\u5224\u65ad\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u5b66\u4e60\u6001\u5ea6\u79ef\u6781\uff0c\u80fd\u4e3b\u52a8\u63d0\u95ee\u548c\u8c03\u6574\uff0c\u5d29\u76d8\u98ce\u9669\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u632b\u80fd\u4e3b\u52a8\u6c42\u89e3\uff0c\u975e\u60c5\u7eea\u5316\u4eba\u683c\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | **\u6838\u5fc3\u98ce\u9669\u70b9**\uff1a\u5982\u679c\u5b66\u4e60\u540e\u957f\u65f6\u95f4\u65e0\u6cd5\u83b7\u5f97\u63a5\u5355\u673a\u4f1a\uff0c\u6216\u5728\u7ade\u4e89\u4e2d\u611f\u89c9\u201c\u5b66\u800c\u65e0\u7528\u201d\uff0c\u53ef\u80fd\u56e0\u4ef7\u503c\u611f\u843d\u7a7a\u800c\u52a8\u6447\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u4e2d\u540e\u671f\uff08\u7ea6\u7b2c4-6\u5468\uff09**\u3002\u5f53\u6280\u80fd\u5b66\u4e60\u8fdb\u5165\u5b9e\u8df5\u548c\u63a5\u5355\u7ade\u4e89\u9636\u6bb5\uff0c\u82e5\u5176\u4f5c\u54c1\u53cd\u9988\u4e0d\u4f73\u6216\u63a5\u5355\u56f0\u96be\uff0c\u5c0a\u91cd\u9700\u6c42\u672a\u6ee1\u8db3\u7684\u5931\u843d\u611f\u53ef\u80fd\u96c6\u4e2d\u7206\u53d1\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u8584\u8377\u7cd6\uff0c\u770b\u5230\u4f60\u4e4b\u524d\u5f88\u5173\u6ce8\u8bfe\u7a0b\u80fd\u4e0d\u80fd\u8ddf\u4e0aAI\u8fed\u4ee3\uff0c\u8fd8\u6709\u4f5c\u54c1\u7ade\u4e89\u7684\u95ee\u9898\uff0c\u6211\u89c9\u5f97\u4f60\u662f\u4e2a\u7279\u522b\u6709\u8fdc\u89c1\u548c\u60f3\u6cd5\u7684\u5b66\u5458\u3002\u54b1\u4eec\u8fd9\u4e2a\u8425\u4e0d\u5149\u6559\u5de5\u5177\uff0c\u66f4\u4f1a\u5e26\u4f60\u627e\u5230\u5c5e\u4e8e\u4f60\u81ea\u5df1\u7684\u2018\u4e0d\u53ef\u66ff\u4ee3\u6027\u2019\uff0c\u8ba9\u4f60\u5728\u5377\u6d77\u91cc\u4e5f\u80fd\u7a33\u7a33\u7ad9\u4f4f\u811a\u3002\u6709\u4efb\u4f55\u5173\u4e8e\u65b9\u5411\u548c\u7ade\u4e89\u7684\u95ee\u9898\uff0c\u968f\u65f6\u627e\u6211\u804a\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** + **\u3010\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\u3011** \u53cc\u7ebf\u5e76\u884c\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176T2\u7279\u8d28\u53ca\u5411T1\u8fdb\u5316\u7684\u6f5c\u529b\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010D\u6a21\u5757\uff1a\u8eab\u4efd\u4e0e\u6743\u529b\u5149\u73af\u6c60\u3011**\u3002\u5728\u5176\u6280\u80fd\u8fbe\u6807\u540e\uff0c\u8fc5\u901f\u8d4b\u4e88\u5176\u5c0f\u7ec4\u957f\u3001\u4f5c\u4e1a\u70b9\u8bc4\u5b98\u7b49\u89d2\u8272\uff0c\u6ee1\u8db3\u5176\u5c0a\u91cd\u4e0e\u5f52\u5c5e\u9700\u6c42\uff0c\u5e76\u5c06\u5176\u56fa\u5316\u4e3a\u751f\u6001\u5efa\u8bbe\u8005\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5c06\u5176\u89c6\u4e3a\u666e\u901a\u5b66\u5458\u8fdb\u884c\u673a\u68b0\u5316\u7ba1\u7406\u3002**\u7981\u6b62\u5ffd\u89c6\u5176\u4e3b\u52a8\u63d0\u95ee\u548c\u89c4\u5219\u786e\u8ba4\u7684\u9700\u6c42**\uff0c\u8fd9\u4f1a\u5f71\u54cd\u5176\u4ef7\u503c\u611f\u548c\u638c\u63a7\u611f\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u8fdb\u884c**\u5927\u989d\u63a8\u4ecb**\u3002\u56e0\u5176\u52a8\u673a\u7eaf\u6b63\u3001\u5b66\u4e60\u7a33\u5b9a\uff0c\u662fL3\u53ca\u4ee5\u4e0a\u9ad8\u9636\u8bfe\u7a0b\u548c\u79c1\u6559\u670d\u52a1\u7684\u4f18\u8d28\u6f5c\u5728\u5ba2\u6237\u3002\u63a8\u4ecb\u65f6\u9700\u4fa7\u91cd\u201c\u63d0\u5347\u7ade\u4e89\u529b\u201d\u3001\u201c\u6253\u9020\u4e2a\u4eba\u54c1\u724c\u201d\u7b49\u4ef7\u503c\u70b9\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u8fd9AI\u8fed\u4ee3\u8fd9\u4e48\u5feb\uff0c\u6765\u5f97\u53ca\u6559\u5417\uff0c\u201d **(\u6c42\u77e5\u6b32\u4e0e\u8fdc\u89c1)**\n2. > \u201c\u6211\u7684\u8fd8\u6ca1\u5f00\u59cb\u505a\u5462\uff0c\u6296\u97f3\u4e0a\u5c31\u5237\u5230\u81f3\u5c11\u4e24\u4e2a\u7248\u672c\u4e86\uff0c\u6211\u8fd8\u505a\u5417[\u6487\u5634]\u201d\u3001\u201c\u6211\u6015\u6211\u88ab\u5377\u6b7b\u201d **(\u7ade\u4e89\u610f\u8bc6\u4e0e\u4ef7\u503c\u7126\u8651\uff0c\u662f\u5c0a\u91cd\u9700\u6c42\u7684\u76f4\u63a5\u4f53\u73b0)**\n3. > \u201c@\u9ed1\u767d\uff08\u95ed\u5173\u4e2d\uff09\u2005\u5927\u5927\uff0c\u54b1\u4eec\u7fa4\u91cc\u6709\u4eba\u9009\u4e2d\u7684\u4e66\uff0c\u5176\u4ed6\u4eba\u5c31\u4e0d\u80fd\u505a\u4e86\u5bf9\u5417\u201d **(\u9075\u5b88\u89c4\u5219\u5e76\u79ef\u6781\u786e\u8ba4\uff0c\u5178\u578b\u7684\u201c\u8001\u9ec4\u725b\u201d\u5f0f\u4e25\u8c28)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\uff08\u5411T1\u8fdb\u5316\u4e2d\uff09\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u5b66\u4e60\u548c\u7ade\u4e89\u4e2d\u8bc1\u660e\u81ea\u5df1\u7684\u72ec\u7279\u4ef7\u503c\uff0c\u83b7\u5f97\u5c0a\u91cd\u4e0e\u5f52\u5c5e\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u53ca\u65f6\u56de\u5e94\u5176\u6280\u672f/\u89c4\u5219\u7591\u95ee\uff0c\u5e76\u5728\u5176\u80fd\u529b\u8fbe\u6807\u540e\u8fc5\u901f\u201c\u9ec4\u888d\u52a0\u8eab\u201d\uff0c\u8d4b\u4e88\u5176\u793e\u7fa4\u7ba1\u7406\u6216\u8f85\u52a9\u6559\u5b66\u7684\u8eab\u4efd\u4e0e\u6743\u9650\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u5f52\u5c5e\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
