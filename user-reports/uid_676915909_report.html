        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676915909 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-02-25 \u81f3 2026-04-07 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6e29\u534a\u4ed9 (\u5f6d\u5c14\u9526) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u77ed\u89c6\u9891/\u6709\u58f0\u4e66\u76f8\u5173\u8bfe\u7a0b\uff08\u4ece\u5bf9\u8bdd\u63a8\u65ad\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad** |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u591a\u6b21\u63d0\u53ca\u52a0\u73ed\u3001\u71ac\u591c\u3001\u51cc\u66682\u70b9\u8d77\u3001\u5f00\u8f66\u957f\u9014\u51fa\u5dee\uff0c\u65f6\u95f4\u9ad8\u5ea6\u7d27\u5f20\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad** |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u5b66\u4e60\u8fc7\u7a0b\u3001\u6280\u672f\u7ec6\u8282\u3001\u56e2\u961f\u534f\u4f5c\u3001\u4e2a\u4eba\u72b6\u6001\u5747\u6709\u5145\u5206\u66b4\u9732\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06**\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u5173\u6ce8\u6280\u672f\u5b9e\u73b0\u3001\u56e2\u961f\u534f\u4f5c\u4e0e\u4f5c\u54c1\u8d28\u91cf\uff0c\u65e0\u4efb\u4f55\u77ed\u671f\u53d8\u73b0\u6216\u4fdd\u5e95\u627f\u8bfa\u8981\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u53ea\u662f\u4e0d\u60f3\u88ab\u5e74\u8f7b\u4eba\u843d\u4e0b\u800c\u5df2\u3002\u201d\uff1b> \u201c\u6211\u4e3b\u8981\u60f3\u770b\u770b\u600e\u4e48\u8bbe\u7f6e\u98de\u4e66\uff0c\u63d0\u4ea4\u4f5c\u4e1a\u90a3\u6bb5\u513f\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07**\u4f4e**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u8bc4\u7ea7** \u2014 \u672a\u63d0\u53ca\u7ecf\u6d4e\u72b6\u51b5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u2b07\u4f4e** \u2014 \u591a\u6b21\u66b4\u9732\u65f6\u95f4\u6781\u5ea6\u7d27\u5f20\uff1a\u201c\u52a0\u73ed\uff0c\u521a\u7ed3\u675f\u201d\u3001\u201c4\u70b9\u591a\u624d\u7761\uff0c\u4e00\u65e9\u592b\u5b50\u5c31\u7ed9\u653e\u70b8\u5f39\u201d\u3001\u201c\u5f00\u8f66\u4ece\u676d\u5dde\u53bb\u4e50\u5c71\u201d\u3001\u201c\u5598\u4e0d\u4e0a\u6765\u6c14\u201d\u3002\u7cbe\u529b\u88ab\u5de5\u4f5c\u4e25\u91cd\u6324\u538b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u8bc4\u7ea7** \u2014 \u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06**\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\uff0c\u9047\u5230\u6280\u672f\u96be\u9898\uff08\u5982AI\u751f\u6210\u753b\u9762\u5d29\u3001\u8f6f\u4ef6\u8fde\u63a5\u5931\u8d25\uff09\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\u3001\u4e0e\u540c\u5b66\u8ba8\u8bba\uff0c\u65e0\u62b1\u6028\u6216\u653e\u5f03\u8a00\u8bba\uff0c\u60c5\u7eea\u7a33\u5b9a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8fd9\u5468\u7684\u4f5c\u4e1a\u62bd\u5361\u62bd\u54ed\u4e86\u3002\u62bd\u51fa\u6765\u7684\u603b\u662f\u8ddf\u81ea\u5df1\u60f3\u8c61\u5dee\u5f88\u8fdc\u3002\u201d (\u4ee5\u81ea\u5632\u53e3\u543b\u9648\u8ff0\u56f0\u96be\uff0c\u800c\u975e\u62b1\u6028)\uff1b> \u201c\u4e0a\u5468\u4f5c\u4e1a5\u79d2\u89c6\u9891\u7528\u4e866\u4e2a\u5c0f\u65f6\u3002[\u6342\u8138]\u201d (\u9648\u8ff0\u4e8b\u5b9e\uff0c\u63a5\u53d7\u5b66\u4e60\u66f2\u7ebf)\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u4e2d\u5e74\u5371\u673a\u4e0e\u6280\u80fd\u7126\u8651\u300277\u5e74\u751f\u4eba\uff0c\u62c5\u5fc3\u88ab\u65f6\u4ee3\u548c\u5e74\u8f7b\u4eba\u843d\u4e0b\uff0c\u5e0c\u671b\u901a\u8fc7\u638c\u63e1\u65b0\u6280\u80fd\uff08AI\uff09\u6765\u8bc1\u660e\u81ea\u5df1\u7684\u4ef7\u503c\uff0c\u83b7\u5f97\u540c\u8f88\uff08\u540c\u5b66\uff09\u548c\u793e\u7fa4\uff08\u73ed\u7ea7\uff09\u7684\u8ba4\u53ef\u4e0e\u5c0a\u91cd\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5728\u793e\u7fa4\u4e2d\u83b7\u5f97\u201c\u6280\u672f\u9aa8\u5e72\u201d\u3001\u201c\u9760\u8c31\u961f\u53cb\u201d\u7684\u8eab\u4efd\u8ba4\u53ef**\u3002\u4ed6\u9700\u8981\u88ab\u770b\u89c1\u5176\u52aa\u529b\u3001\u6280\u672f\u94bb\u7814\u548c\u4e50\u4e8e\u52a9\u4eba\u7684\u4ef7\u503c\uff0c\u4ece\u800c\u62b5\u6d88\u56e0\u5e74\u9f84\u548c\u5fd9\u788c\u4ea7\u751f\u7684\u81ea\u6211\u6000\u7591\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u9ad8\u52a8\u673a\uff0c\u4f46\u8d44\u6e90\u5e95\u5ea7\u5b58\u5728\u660e\u663e\u77ed\u677f\u2014\u2014\u65f6\u95f4\u7cbe\u529b\u4e25\u91cd\u4e0d\u8db3) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4f4e** | \u672a\u63d0\u53ca\u5bb6\u5ead\uff0c\u98ce\u9669\u672a\u77e5\u4f46\u975e\u9996\u8981\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\uff1a\u5de5\u4f5c\u4e0e\u51fa\u5dee\u5bfc\u81f4\u65f6\u95f4\u88ab\u6781\u5ea6\u538b\u7f29\uff0c\u65e0\u6cd5\u8ddf\u4e0a\u8bfe\u7a0b\u8282\u594f\u548c\u4f5c\u4e1a\uff0c\u4ea7\u751f\u6301\u7eed\u6027\u7684\u201c\u6389\u961f\u201d\u7126\u8651\u548c\u81ea\u8d23\uff0c\u6700\u7ec8\u56e0\u65e0\u6cd5\u5b8c\u6210\u5b66\u4e60\u95ed\u73af\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u6280\u672f\u95ee\u9898\u81ea\u884c\u6d88\u5316\u6216\u6c42\u52a9\uff0c\u975e\u60c5\u7eea\u5316\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4f4e** | \u52a8\u673a\u975e\u77ed\u671f\u53d8\u73b0\uff0c\u66f4\u5173\u6ce8\u5b66\u4e60\u8fc7\u7a0b\u548c\u80fd\u529b\u63d0\u5347\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u8bfe\u7a0b\u4e2d\u540e\u671f\uff08\u7b2c3-5\u5468\uff09**\u3002\u5f53\u8bfe\u7a0b\u96be\u5ea6\u589e\u52a0\u3001\u56e2\u961f\u6bd4\u8d5b\u538b\u529b\uff08\u5982\u5965\u65af\u5361\u6bd4\u8d5b\uff09\u4e0e\u4e2a\u4eba\u7e41\u5fd9\u671f\uff08\u5982\u51fa\u5dee\uff09\u53e0\u52a0\u65f6\uff0c\u6781\u6613\u56e0\u201c\u65f6\u95f4\u5b8c\u5168\u65e0\u6cd5\u534f\u8c03\u201d\u800c\u5d29\u76d8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5c71\u91ce\u5927\u54e5\uff0c\u770b\u60a8\u804a\u5929\u5c31\u77e5\u9053\u662f\u505a\u4e8b\u7279\u522b\u8ba4\u771f\u9760\u8c31\u7684\u4eba\u3002\u54b1\u4eec\u8bfe\u7a0b\u8282\u594f\u786e\u5b9e\u4e0d\u6162\uff0c\u4f46\u60a8\u5343\u4e07\u522b\u6709\u2018\u4f5c\u4e1a\u5fc5\u987b\u5b8c\u7f8e\u2019\u7684\u538b\u529b\u3002\u60a8\u65f6\u95f4\u5b9d\u8d35\uff0c\u54b1\u4eec\u5c31\u6293\u6838\u5fc3\u6280\u80fd\u70b9\u7a81\u7834\uff0c\u6bd4\u5982\u8fd9\u5468\u7684\u2018\u5b9a\u5986\u7167\u751f\u6210\u2019\u641e\u900f\u4e86\u5c31\u662f\u80dc\u5229\u3002\u56e2\u961f\u4f5c\u4e1a\u60a8\u8d1f\u8d23\u628a\u63a7\u5927\u65b9\u5411\u548c\u6280\u672f\u6307\u5bfc\u5c31\u884c\uff0c\u5177\u4f53\u6267\u884c\u7684\u7410\u4e8b\u8ba9\u961f\u53cb\u591a\u5206\u62c5\u3002\u60a8\u53ef\u662f\u54b1\u4eec\u7ec4\u7684\u5b9a\u6d77\u795e\u9488\uff0c\u6709\u60a8\u5728\uff0c\u5927\u5bb6\u5fc3\u91cc\u90fd\u8e0f\u5b9e\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** (\u5339\u914d\u5176T2\u5b9e\u5e72\u5c5e\u6027\uff0c\u63d0\u4f9b\u6df1\u5ea6\u6280\u672f\u6307\u5bfc)\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u3010\u5f39\u6027\u65f6\u95f4\u7ba1\u7406\u5305\u3011** (\u5141\u8bb8\u7075\u6d3b\u8865\u4ea4\u3001\u63d0\u4f9b\u5173\u952e\u8282\u70b9\u5f55\u64ad\u7cbe\u534e\u6458\u8981)\uff1b**\u3010\u56e2\u961f\u534f\u4f5c\u8d4b\u80fd\u5305\u3011** (\u660e\u786e\u5176\u5728\u5c0f\u7ec4\u4e2d\u7684\u201c\u6280\u672f\u987e\u95ee\u201d\u89d2\u8272\uff0c\u51cf\u5c11\u5176\u6267\u884c\u6027\u7410\u4e8b)\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u6240\u6709\u4eba\u90fd\u5fc5\u987b\u6309\u65f6\u4ea4\u4f5c\u4e1a\u201d\u7684\u96c6\u4f53\u538b\u529b\u65bd\u538b\uff1b\u7ed9\u4ed6\u5206\u914d\u9700\u8981\u5927\u91cf\u8fde\u7eed\u6574\u5757\u65f6\u95f4\u7684\u7410\u788e\u4efb\u52a1\uff1b\u5ffd\u89c6\u4ed6\u5728\u56e2\u961f\u4e2d\u7684\u8d21\u732e\u548c\u6280\u672f\u4ef7\u503c\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u8bfe\u7a0b\u4e2d\u671f\u56e0\u5176\u8868\u73b0\u51fa\u8272\u800c\u76f2\u76ee\u5347\u5355\u5927\u8bfe**\u3002\u5fc5\u987b\u5148\u89e3\u51b3\u5176\u65f6\u95f4\u74f6\u9888\u95ee\u9898\uff0c\u6216\u63a8\u8350\u6781\u8f7b\u91cf\u3001\u53ef\u5f02\u6b65\u5b8c\u6210\u7684\u9ad8\u9636\u5fae\u8bfe\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u53ea\u662f\u4e0d\u60f3\u88ab\u5e74\u8f7b\u4eba\u843d\u4e0b\u800c\u5df2\u3002\u201d\n2. > \u201c\u592b\u5b50\uff0c\u6211\u5012\u662f\u6709\u5fc3\u505a\u4f60\u8bf4\u7684\u5730\u72f1\u7ea7\u7684\u4e8b\u60c5\uff0c\u5c31\u662f\u611f\u89c9\u6709\u70b9\u513f\u529b\u4e0d\u4ece\u5fc3\uff0c\u53c8\u662f\u4f5c\u4e1a\uff0c\u53c8\u662f\u6bd4\u8d5b\uff0c\u611f\u89c9\u5df2\u7ecf\u5598\u4e0d\u4e0a\u6765\u6c14\u4e86\u3002\u201d\n3. > \u201c\u5927\u4f19\u513f\uff0c\u5b9e\u5728\u662f\u773c\u775b\u7741\u4e0d\u5f00\u4e86\uff0c\u65e9\u66682\u70b9\u8d77\u7684\uff0c\u4e00\u76f4\u5230\u73b0\u5728\uff0c\u660e\u65e97\u70b9\u51fa\u53d1\uff0c\u5f00\u8f66\u4ece\u676d\u5dde\u53bb\u4e50\u5c71\u3002[\u6342\u8138]\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2\u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u5c0a\u91cd\u4e0e\u4ef7\u503c\u786e\u8ba4\uff08\u5bf9\u6297\u4e2d\u5e74\u6280\u80fd\u7126\u8651\uff09**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u8d4b\u4e88\u5176\u56e2\u961f\u6280\u672f\u6838\u5fc3\u8eab\u4efd\uff0c\u5e76\u4e3a\u5176\u63d0\u4f9b\u6781\u81f4\u7684\u201c\u65f6\u95f4\u5f39\u6027\u201d\u670d\u52a1\uff0c\u8c41\u514d\u5176\u7410\u788e\u6267\u884c\u538b\u529b**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"maslow_need\": \"\u5c0a\u91cd\u9700\u6c42\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5f39\u6027\u65f6\u95f4\u7ba1\u7406\u5305\"}\n```";
