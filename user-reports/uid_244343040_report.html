    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u4e91\u8212 (UID: 244343040) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-16 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u4e03\u6708\u4f73\u97f3(\u5468\u5c0f\u797a) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66/\u914d\u97f3\u57f9\u8bad\u8bfe\u7a0b (\u5df2\u8d2d\u4e70\u8bbe\u5907) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u4e2d\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u91d1\u989d\u6216\u7ecf\u6d4e\u538b\u529b\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u9ad8\u5bbd\u88d5**\u3002\u7528\u6237\u591a\u6b21\u8868\u793a\u201c\u5168\u5929\u6709\u65f6\u95f4\u201d\uff0c\u80fd\u9891\u7e41\u5728\u767d\u5929\u4e92\u52a8\u3001\u5b66\u4e60\u3001\u8c03\u8bd5\u8bbe\u5907\uff0c\u65f6\u95f4\u81ea\u7531\u5ea6\u6781\u9ad8\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u4e2d\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u6210\u5458\u6216\u5bb6\u5ead\u652f\u6301/\u53cd\u5bf9\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u5b66\u4e60\u8fc7\u7a0b\u3001\u8bbe\u5907\u8d2d\u4e70\u3001\u4e92\u52a8\u7ec6\u8282\u4e30\u5bcc\uff0c\u4f46\u5173\u952e\u7684\u5bb6\u5ead\u4e0e\u7ecf\u6d4e\u4fe1\u606f\u7f3a\u5931\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u5174\u8da3\u9a71\u52a8\u4e0e\u517c\u804c\u53d8\u73b0\u76ee\u7684\u6df7\u6742\u3002\u79ef\u6781\u53c2\u4e0e\u5b66\u4e60\u3001\u4e92\u52a8\u3001\u62a2\u4e66\uff0c\u8868\u73b0\u51fa\u5bf9\u6280\u80fd\u672c\u8eab\u7684\u5174\u8da3\u548c\u6295\u5165\uff0c\u4f46\u540c\u65f6\u4e5f\u5173\u6ce8\u201c\u4e66\u5355\u5206\u6210\u201d\u3001\u201c\u62a2\u4e66\u201d\u7b49\u53d8\u73b0\u673a\u4f1a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4e66\u5355\u66f4\u65b0\u4e86\uff0c\u6709\u65f6\u95f4\u7684\u53bb\u770b\u770b\uff0c\u53bb\u7785\u7785\uff0c\u53bb\u6311\u6311\u6361\u6361\uff0c\u627e\u4e2a\u8f7b\u677e\u70b9\u7684\uff0c\u4e0d\u90a3\u4e48\u7ed5\u53e3\u96be\u61c2\u7684\u3002\u201d (\u5173\u6ce8\u4efb\u52a1\u9009\u62e9) > \u201c\u54b1\u4eec\u7684\u4e66\u5355\u53ef\u80fd\u4e0d\u4e00\u6837\uff0c\u6211\u7684\u8fd8\u6709\u597d\u591a20%\u5206\u6210\u7684\uff0c\u201d (\u5173\u6ce8\u6536\u76ca)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u4e3b\u52a8\u8d2d\u4e70\u8bfe\u7a0b\u914d\u5957\u8bbe\u5907\uff08MK4\u58f0\u5361\u3001\u7535\u8111\uff09\uff0c\u5e76\u54a8\u8be2\u66f4\u6362\u578b\u53f7\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u6d88\u8d39\u80fd\u529b\uff0c\u4f46\u672a\u900f\u9732\u8d44\u91d1\u6765\u6e90\u6216\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u9ad8** \u2014 \u65f6\u95f4\u975e\u5e38\u5145\u88d5\uff0c\u80fd\u5168\u5929\u5019\u54cd\u5e94\u3001\u5b66\u4e60\u3001\u8c03\u8bd5\u8bbe\u5907\uff0c\u5b66\u4e60\u6295\u5165\u5ea6\u9ad8\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u4fe1\u606f\uff0c\u65e0\u6cd5\u5224\u65ad\u652f\u6301\u6216\u963b\u529b\u3002**\u6b64\u4e3a\u5173\u952e\u98ce\u9669\u7f3a\u53e3**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b07\u4f4e\u6781\u5371**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u5982\u7535\u8111\u64cd\u4f5c\u3001AU\u8f6f\u4ef6\u4f7f\u7528\uff09\u65f6\uff0c\u8868\u73b0\u51fa\u6781\u5f3a\u7684\u65e0\u52a9\u611f\u548c\u4f9d\u8d56\u611f\uff0c\u9700\u8981\u73ed\u4e3b\u4efb\u624b\u628a\u624b\u4ece\u96f6\u6559\u5b66\uff08\u5982\u6559\u5982\u4f55\u6253\u5f00\u6d4f\u89c8\u5668\u3001\u4e0b\u8f7d\u5fae\u4fe1\u3001\u590d\u5236\u7c98\u8d34\uff09\u3002\u9762\u5bf9\u7f51\u7edc\u8d1f\u9762\u4fe1\u606f\u65f6\uff0c\u60c5\u7eea\u6ce2\u52a8\u5927\uff0c\u4ea7\u751f\u201c\u5fc3\u614c\u614c\u201d\u7684\u6050\u614c\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u73ed\u73ed\uff0c\u6211\u4e70\u4e86\u7535\u8111\u4e0d\u4f1a\u7528\u554a\uff0c\u521b\u5efa\u4e2a\u8d26\u6237\uff0c\u534a\u5929\u6ca1\u6574\u660e\u767d\uff0c@\u952e\u600e\u4e48\u51fa\u6765\u554a\uff0c\u6211\u70b9\u4e00\u4e0b\u4ed6\u5c31\u662f2\uff0c\u600e\u4e48\u8f6c\u6362\ud83d\ude22\ud83d\ude22(\uff61\u2022\u0301\ufe3f\u2022\u0300\uff61)\u201d (\u6280\u672f\u632b\u8d25\u611f) > \u201c\u73ed\u73ed\uff0c\u4eca\u5929\u65e9\u4e0a\u5237\u89c6\u9891\uff0c\u5168\u662f\u5b66\u914d\u97f3\u88ab\u5272\u97ed\u83dc\u7684\uff0c\u770b\u7684\u6211\u5fc3\u614c\u614c\ud83d\ude30\ud83d\ude30\ud83d\ude30\u201d (\u5916\u90e8\u4fe1\u606f\u6613\u611f)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u5ea6\u7684\u6280\u672f\u4e0d\u81ea\u4fe1\u4e0e\u793e\u4ea4\u5b64\u7acb\u611f**\u3002\u4ed6\u4e0d\u4ec5\u662f\u201c\u7535\u8111\u5c0f\u767d\u201d\uff0c\u66f4\u662f\u201c\u6570\u5b57\u79fb\u6c11\u201d\u4e2d\u7684\u5f31\u52bf\u7fa4\u4f53\uff0c\u6bcf\u4e00\u6b65\u64cd\u4f5c\u90fd\u5145\u6ee1\u632b\u8d25\u3002\u540c\u65f6\uff0c\u4ed6\u5728\u793e\u7fa4\u4e2d\u79ef\u6781\u70b9\u8bc4\u4ed6\u4eba\uff08\u201c\u8bfb\u7684\u5f88\u597d\uff0c\u7ee7\u7eed\u52a0\u6cb9\uff01\u201d\uff09\uff0c\u6e34\u671b\u83b7\u5f97\u8fde\u63a5\u4e0e\u8ba4\u53ef\uff0c\u5bb3\u6015\u88ab\u201c\u5272\u97ed\u83dc\u201d\u629b\u5f03\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4fdd\u59c6\u7ea7\u7684\u8010\u5fc3\u966a\u4f34\u4e0e\u5373\u65f6\u80af\u5b9a\u7684\u5b89\u5168\u611f**\u3002\u4ed6\u9700\u8981\u7684\u4e0d\u662f\u9ad8\u6df1\u6280\u5de7\uff0c\u800c\u662f\u201c\u88ab\u770b\u89c1\u201d\u3001\u201c\u88ab\u624b\u628a\u624b\u6559\u4f1a\u201d\u4ee5\u53ca\u201c\u88ab\u4fdd\u8bc1\u4e0d\u4f1a\u6389\u961f\u201d\u7684\u5f3a\u60c5\u611f\u652f\u6301\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1 \u7c7b** (\u9ad8\u4e92\u52a8\u3001\u9ad8\u4f9d\u8d56\u3001\u4f4e\u6280\u672f\u57fa\u7840\uff0c\u9700\u5f3a\u60c5\u611f\u652f\u6301) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u501f\u8d37\u3001\u7edd\u5883\u7b49\u76f4\u63a5\u8bc1\u636e\uff0c\u4f46**\u5bb6\u5ead\u652f\u6301\u5ea6\u672a\u77e5\u662f\u91cd\u5927\u9690\u60a3**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u4fe1\u606f\u7f3a\u5931\u3002\u82e5\u5bb6\u4eba\u53cd\u5bf9\u5176\u6295\u5165\u65f6\u95f4\u91d1\u94b1\uff0c\u98ce\u9669\u9aa4\u589e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u6781\u9ad8**\u3002\u6280\u672f\u95e8\u69db\uff08AU\u64cd\u4f5c\u3001\u8bbe\u5907\u8c03\u8bd5\uff09\u662f\u5176\u6700\u5927\u969c\u788d\u3002\u4e00\u65e6\u8fde\u7eed\u51e0\u6b21\u4f5c\u4e1a\u56e0\u6280\u672f\u95ee\u9898\u65e0\u6cd5\u5b8c\u6210\uff0c\u7d2f\u79ef\u7684\u632b\u8d25\u611f\u5c06\u76f4\u63a5\u5bfc\u81f4\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u6781\u9ad8**\u3002\u6838\u5fc3\u98ce\u9669\u70b9\u3002\u4efb\u4f55\u7a0d\u590d\u6742\u7684\u64cd\u4f5c\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u3001\u6587\u4ef6\u5bfc\u51fa\uff09\u3001\u4efb\u4f55\u8d1f\u9762\u53cd\u9988\uff08\u5982\u8bd5\u97f3\u672a\u8fc7\uff09\u3001\u751a\u81f3\u770b\u5230\u5176\u4ed6\u540c\u5b66\u8fdb\u6b65\u66f4\u5feb\uff0c\u90fd\u53ef\u80fd\u5f15\u53d1\u201c\u6211\u592a\u7b28\u4e86\u201d\u7684\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u77ed\u671f\u5185\u82e5\u65e0\u6cd5\u53c2\u4e0e\u201c\u62a2\u4e66\u201d\u6216\u770b\u5230\u53d8\u73b0\u5e0c\u671b\uff0c\u53ef\u80fd\u52a0\u5267\u7126\u8651\uff0c\u4f46\u5f53\u524d\u5174\u8da3\u9a71\u52a8\u4ecd\u5360\u4e3b\u5bfc\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-3\u5468\uff0c\u9996\u6b21\u72ec\u7acb\u5b8c\u6210AU\u4f5c\u4e1a\u53ca\u63d0\u4ea4\u8bd5\u97f3\u65f6**\u3002\u6b64\u65f6\u6280\u672f\u96be\u5ea6\u9661\u589e\uff0c\u632b\u8d25\u611f\u6700\u5f3a\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> **\u201c\u4e91\u8212\u5927\u54e5/\u59d0\uff0c\u770b\u5230\u60a8\u8fd9\u4e48\u79ef\u6781\u51c6\u5907\u8bbe\u5907\u548c\u5b66\u4e60\uff0c\u771f\u7684\u7279\u522b\u4f69\u670d\u60a8\u7684\u884c\u52a8\u529b\uff01\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u554a\uff0c\u5c31\u662f\u5e26\u7740\u5927\u5bb6\u4ece\u96f6\u5f00\u59cb\uff0c\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\u3002\u60a8\u653e\u5fc3\uff0c\u6709\u4efb\u4f55\u5730\u65b9\u5361\u4f4f\u4e86\uff0c\u54ea\u6015\u662f\u6700\u5c0f\u7684\u95ee\u9898\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4fdd\u8bc1\u7ed9\u60a8\u8bb2\u660e\u767d\u3002\u54b1\u4eec\u4e0d\u8ddf\u522b\u4eba\u6bd4\u901f\u5ea6\uff0c\u5c31\u6bd4\u8c01\u575a\u6301\u5f97\u4e45\uff0c\u6211\u966a\u7740\u60a8\u3002\u201d**\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5174\u8da3\u6e38\u4e50\u7ebf\u3011** + **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u6838\u5fc3\u76ee\u6807\u662f\u7ef4\u6301\u5174\u8da3\u3001\u964d\u4f4e\u632b\u8d25\u611f\u3001\u5efa\u7acb\u5b8c\u6210\u4efb\u52a1\u7684\u4fe1\u5fc3\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u6302\u8f7d **\u30101v1\u4fdd\u59c6\u7ea7\u6280\u672f\u62a4\u822a\u5305\u3011**\uff08\u975e\u539f\u7406\u6027\u7b54\u7591\uff0c\u800c\u662f\u64cd\u4f5c\u4ee3\u52b3\u6216\u6781\u7b80\u6b65\u9aa4\u6559\u5b66\uff09\u3002\u53ef\u8f7b\u91cf\u642d\u914d **\u3010\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\u3011** \u4e2d\u7684\u201c\u73ed\u59d4\u201d\u6216\u201c\u70b9\u8bc4\u5b98\u201d\u8eab\u4efd\uff0c\u7ed9\u4e88\u5176\u793e\u4ea4\u5c0a\u91cd\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9T6\u8bb2\u5927\u9053\u7406\u6216\u6279\u8bc4**\u3002\u53cd\u9988\u5fc5\u987b\u5305\u88f9\u5728\u201c\u9f13\u52b1-\u5177\u4f53\u5c0f\u5efa\u8bae-\u9f13\u52b1\u201d\u7684\u4e09\u660e\u6cbb\u7ed3\u6784\u4e2d\u3002\n    2. **\u7edd\u4e0d\u7ed9T6\u5e03\u7f6e\u8d85\u51fa\u5176\u5f53\u524d\u80fd\u529b\u534a\u6b65\u7684\u590d\u6742\u4efb\u52a1**\u3002\u4f5c\u4e1a\u62c6\u89e3\u5230\u201c\u70b9\u51fb\u54ea\u4e2a\u6309\u94ae\u201d\u7684\u7c92\u5ea6\u3002\n    3. **\u7edd\u4e0d\u5728\u7fa4\u5185\u516c\u5f00\u6bd4\u8f83\u6216\u8868\u626c\u5176\u4ed6\u5b66\u5458\u8fdb\u5ea6\u8fc7\u5feb**\uff0c\u907f\u514d\u89e6\u53d1\u5176\u81ea\u5351\u5fc3\u7406\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u5f53\u524d\u9636\u6bb5\uff0c\u4efb\u4f55\u9644\u52a0\u8bfe\u7a0b\u6216\u9ad8\u9636\u4ea7\u54c1\u7684\u63a8\u9500\u90fd\u4f1a\u88ab\u89c6\u4e3a\u538b\u529b\u6e90\uff0c\u6781\u5927\u53ef\u80fd\u5f15\u53d1\u9000\u8d39\u3002\u5fc5\u987b\u5148\u5e2e\u52a9\u5176\u7a33\u5b9a\u5b8c\u6210\u5f53\u524d\u8bfe\u7a0b\uff0c\u5efa\u7acb\u57fa\u672c\u81ea\u4fe1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u73ed\u73ed\uff0c\u6211\u4e70\u4e86\u7535\u8111\u4e0d\u4f1a\u7528\u554a\uff0c\u521b\u5efa\u4e2a\u8d26\u6237\uff0c\u534a\u5929\u6ca1\u6574\u660e\u767d\uff0c@\u952e\u600e\u4e48\u51fa\u6765\u554a\uff0c\u6211\u70b9\u4e00\u4e0b\u4ed6\u5c31\u662f2\uff0c\u600e\u4e48\u8f6c\u6362\ud83d\ude22\ud83d\ude22(\uff61\u2022\u0301\ufe3f\u2022\u0300\uff61)\u201d\n2. > \u201c\u73ed\u73ed\uff0c\u4eca\u5929\u65e9\u4e0a\u5237\u89c6\u9891\uff0c\u5168\u662f\u5b66\u914d\u97f3\u88ab\u5272\u97ed\u83dc\u7684\uff0c\u770b\u7684\u6211\u5fc3\u614c\u614c\ud83d\ude30\ud83d\ude30\ud83d\ude30\u201d\n3. > \u201c\u6211\u600e\u4e48\u5f80\u4e0a\u6ed1\u52a8\u9875\u9762\u201d / \u201c\u600e\u4e48\u590d\u5236\u201d / \u201c\u6211\u8fd8\u6ca1\u4e70\u9f20\u6807\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6\u60c5\u7eea\u5de8\u5a74\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u793e\u4ea4\u966a\u4f34\u4e0e\u6280\u672f\u5b89\u5168\u611f**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u4fdd\u59c6\u7ea7\u3001\u96f6\u632b\u8d25\u611f\u7684\u64cd\u4f5c\u6307\u5bfc\u4e0e\u9ad8\u9891\u60c5\u611f\u80af\u5b9a**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u793e\u4ea4/\u5c0a\u91cd\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf+\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305+1v1\u4fdd\u59c6\u7ea7\u6280\u672f\u62a4\u822a\u5305\"}\n```";
