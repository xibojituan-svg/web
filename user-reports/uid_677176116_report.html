    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677176116\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677176116 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6668\u516e\u5e08\u59d0(\u8096\u96ef\u99a8) / \u851a\u84dd(\u8096\u96ef\u99a8) / \u5bb8\u7852(\u5eb7\u53cc\u660e) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u4e3b\u64ad\u8bad\u7ec3\u8425 (\u4ef7\u683c\uff1a2380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u4fe1\u606f\u4e0d\u8db3\u3002\u7528\u6237\u4e3b\u52a8\u8be2\u95ee\u5b66\u8d39\u5e76\u652f\u4ed8\uff0c\u672a\u63d0\u53ca\u8d44\u91d1\u6765\u6e90\uff0c**\u9700\u8b66\u60d5C2\u7c7b\u98ce\u9669**\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1\u3002\u7528\u6237\u591a\u6b21\u8868\u793a\u201c\u6b63\u5728\u5de5\u4f5c\u4e2d\u201d\u3001\u201c\u4eba\u5728\u5916\u9762\u201d\uff0c\u5b66\u4e60\u65f6\u95f4\u9700\u4ece\u5de5\u4f5c\u4e2d\u6324\u51fa\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u4e0d\u8db3\u3002\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e2d\u7b49\u3002\u6709\u5b66\u4e60\u884c\u4e3a\u3001\u60c5\u7eea\u53cd\u9988\u548c\u4e92\u52a8\uff0c\u4f46\u7f3a\u4e4f\u6df1\u5ea6\u80cc\u666f\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u5bf9\u8bfe\u7a0b\u5185\u5bb9\uff08\u5982Pia\u620f\uff09\u8868\u73b0\u51fa\u5174\u8da3\u548c\u4e50\u8da3\uff0c\u4f46\u4e5f\u5173\u6ce8\u53d8\u73b0\u65b9\u5f0f\u548c\u5b66\u8d39\uff0c\u52a8\u673a\u5728\u5174\u8da3\u63a2\u7d22\u4e0e\u517c\u804c\u53d8\u73b0\u4e4b\u95f4\u6447\u6446\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u54c8\u54c8\uff0c\u86ee\u597d\u73a9\u7684\u201d\u3001\u201c\u770b\u4ed6\u4eec\u641e\u4e0a\u4e86\u201d\uff08\u5174\u8da3\u9a71\u52a8\uff09\uff1b> \u201c\u5176\u5b9e\u6211\u60f3\u77e5\u9053\u540e\u9762\u7684\u5b66\u4e60\u7684\u5b66\u8d39\u662f\u591a\u5c11\uff0c\u6211\u597d\u505a\u4e2a\u51c6\u5907\u201d\uff08\u73b0\u5b9e\u8003\u91cf\uff09\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 \u80fd\u652f\u4ed82380\u5143\u5b66\u8d39\uff0c\u4f46\u4e3b\u52a8\u8be2\u95ee\u4ef7\u683c\u201c\u505a\u51c6\u5907\u201d\uff0c\u672a\u8868\u73b0\u51fa\u5145\u88d5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 \u6709\u5de5\u4f5c\uff0c\u5b66\u4e60\u65f6\u95f4\u788e\u7247\u5316\uff08\u201c\u6b63\u5728\u5de5\u4f5c\u4e2d\u201d\u3001\u201c\u4eba\u5728\u5916\u9762\u201d\uff09\uff0c\u4f46\u80fd\u575a\u6301\u5b8c\u6210\u4f5c\u4e1a\u548c\u53c2\u4e0e\u6d3b\u52a8\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u672a\u77e5] \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9047\u5230\u632b\u6298\uff08\u5982\u5f55\u97f3\u6548\u679c\u4e0d\u4f73\u3001\u64cd\u4f5c\u5931\u8bef\uff09\u65f6\uff0c\u80fd\u4e3b\u52a8\u53cd\u601d\u3001\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u65e0\u9700\u8fc7\u5ea6\u5b89\u629a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u770b\u4e86\u4eca\u5929\u65e9\u4e0a\u7684\u90a3\u4e9b\u89c6\u9891\uff0c\u53d1\u73b0\u6628\u665a\u5f55\u7684\u592a\u5dee\u52b2\u4e86\uff0c\u60f3\u91cd\u5f55\u6765\u7684\uff0c\u4f46\u662f\u4eba\u5728\u5916\u9762\uff0c\u4e0d\u591f\u5b89\u9759\uff0c\u8fd9\u7ed9\u6211\u61ca\u607c\u7684\u201d\uff08\u81ea\u6211\u53cd\u601d\u5e76\u5bfb\u6c42\u6539\u8fdb\uff09\uff1b> \u201c\u6211\u70b9\u9519\u4e86\uff0c\u7b49\u6211\u91cd\u5f55\u201d\uff08\u64cd\u4f5c\u5931\u8bef\u540e\u7acb\u5373\u91c7\u53d6\u8865\u6551\u884c\u52a8\uff0c\u65e0\u5d29\u6e83\u8ff9\u8c61\uff09\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5728\u7e41\u5fd9\u5de5\u4f5c\u4e4b\u4f59\uff0c\u5bfb\u6c42\u4e00\u4e2a\u6709\u8da3\u3001\u6709\u6210\u5c31\u611f\u3001\u80fd\u83b7\u5f97\u5373\u65f6\u6b63\u53cd\u9988\u7684\u793e\u4ea4\u5708\u5b50\u548c\u7cbe\u795e\u5bc4\u6258\u3002\u5bf9\u201c\u597d\u73a9\u201d\u3001\u201c\u6709\u610f\u601d\u201d\u7684Pia\u620f\u6d3b\u52a8\u53cd\u5e94\u79ef\u6781\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u63d0\u4f9b\u201c\u6e38\u620f\u5316\u201d\u7684\u6210\u5c31\u611f\u548c\u793e\u7fa4\u5f52\u5c5e\u611f**\u3002\u8ba9\u4ed6\u611f\u89c9\u5b66\u4e60\u4e0d\u662f\u8d1f\u62c5\uff0c\u800c\u662f\u4e00\u4e2a\u80fd\u653e\u677e\u3001\u793e\u4ea4\u3001\u5e76\u83b7\u5f97\u8ba4\u53ef\uff08\u5982\u4f5c\u4e1a\u88ab\u5938\uff09\u7684\u201c\u7ebf\u4e0a\u6e38\u4e50\u573a\u201d\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1\u7c7b** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T5 \u597d\u73a9\u5c1d\u9c9c\u8005 (\u5174\u8da3\u805a\u7126\u53d8\u4f53)** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a[\u65e0]\n\n**\u5224\u5b9a\u6811\u8def\u5f84\u63a8\u6f14**\uff1a\n1.  **\u652f\u4ed8\u6838\u67e5**\uff1a\u672a\u53d1\u73b0\u82b1\u5457\u5206\u671f\u22656\u671f\u7b49\u9ad8\u98ce\u9669\u652f\u4ed8\u4fe1\u53f7\u3002\n2.  **\u4e09\u8f74\u8bc4\u5206**\uff1a\u52a8\u673a\u7eaf\u5ea6(5-6\u5206)\uff0c\u8d44\u6e90\u5e95\u5ea7(5-6\u5206)\uff0c\u5fc3\u7406\u5f39\u6027(7-8\u5206)\u3002\n3.  **\u5224\u5b9a\u6811\u5339\u914d**\uff1a\u52a8\u673a\u7eaf\u5ea65-6\u5206\uff0c\u8d44\u6e90\u5e95\u5ea75-7\u5206\uff0c\u65e0\u660e\u786e\u53d8\u73b0\u8ffd\u95ee\uff0c\u53d1\u8a00\u5185\u5bb9\u805a\u7126\u4e8e\u201c\u597d\u73a9\u201d\u3001\u201c\u6709\u610f\u601d\u201d\u7b49\u5174\u8da3\u70b9\u3002**\u547d\u4e2d\u3010\u4e2d\u7b49\u5f39\u6027\u901a\u9053\u3011\u65b0\u589e\u573a\u666f1\uff1a\u5174\u8da3\u805a\u7126\u578b\u89c2\u671b\u8005**\u3002\n4.  **\u539f\u578b\u5339\u914d**\uff1aT5 \u597d\u73a9\u5c1d\u9c9c\u8005\uff08\u5174\u8da3\u805a\u7126\u53d8\u4f53\uff09\u3002\n5.  **ABCD\u6620\u5c04**\uff1aT5 \u2192 C1\u7c7b\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u6709\u5de5\u4f5c\uff0c\u7ecf\u6d4e\u76f8\u5bf9\u72ec\u7acb\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u5de5\u4f5c\u7e41\u5fd9\u5bfc\u81f4\u5b66\u4e60\u8fdb\u5ea6\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u632b\u8d25\u611f\u3002** |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u632b\u80fd\u81ea\u6211\u8c03\u6574\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u82e5\u540e\u7eed\u8bfe\u7a0b\u8fc7\u4e8e\u67af\u71e5\u3001\u538b\u529b\u5927\uff0c\u6216\u53d8\u73b0\u8def\u5f84\u6a21\u7cca\uff0c\u4e0e\u201c\u597d\u73a9\u201d\u7684\u521d\u8877\u4ea7\u751f\u843d\u5dee\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe2-4\u5468\u540e\uff0c\u5f53\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u8bfe\u7a0b\u96be\u5ea6\u548c\u4f5c\u4e1a\u91cf\u589e\u52a0\uff0c\u4e0e\u5de5\u4f5c\u51b2\u7a81\u52a0\u5267\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6b22\u8fce\u52a0\u5165\uff01\u54b1\u4eec\u8fd9\u513f\u4e0d\u5149\u5b66\u6280\u80fd\uff0c\u66f4\u662f\u4e2a\u2018\u58f0\u97f3\u6e38\u4e50\u573a\u2019\u3002\u6628\u5929\u770b\u4f60\u5728Pia\u620f\u73a9\u5f97\u633a\u5f00\u5fc3\uff0c\u4ee5\u540e\u8fd9\u79cd\u6d3b\u52a8\u6bcf\u5468\u90fd\u6709\u3002\u5de5\u4f5c\u5fd9\u6ca1\u5173\u7cfb\uff0c\u6709\u7a7a\u5c31\u6765\u2018\u73a9\u2019\u4e00\u4f1a\u513f\uff0c\u653e\u677e\u4e0b\uff0c\u987a\u4fbf\u628a\u6280\u80fd\u70b9\u4e86\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010\u5174\u8da3\u6e38\u4e50\u7ebf\u3011\u3002\u91cd\u70b9\u5305\u88c5\u8bfe\u7a0b\u7684\u8da3\u5473\u6027\u3001\u793e\u7fa4\u4e92\u52a8\uff08\u5982Pia\u620f\u3001\u58f0\u7ebf\u6a21\u4eff\u6311\u6218\uff09\uff0c\u5f31\u5316\u201c\u82e6\u4fee\u201d\u548c\u201c\u5feb\u901f\u53d8\u73b0\u201d\u538b\u529b\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010\u8f7b\u91cf\u793e\u4ea4\u6fc0\u52b1\u5305\u3011\u3002\u6388\u4e88\u5176\u201c\u6c1b\u56f4\u7ec4\u201d\u975e\u6b63\u5f0f\u8eab\u4efd\uff0c\u9f13\u52b1\u5728\u7fa4\u5185\u5206\u4eab\u597d\u73a9\u7684\u58f0\u97f3\u4f5c\u54c1\u3001\u5e26\u52a8\u4e92\u52a8\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u6700\u540e\u540d\u989d\u201d\u3001\u201c\u5012\u8ba1\u65f6\u201d\u3001\u201c\u4e0d\u5b66\u5c31\u843d\u540e\u201d\u7b49\u9ad8\u538b\u8bdd\u672f\u903c\u5355\uff1b\u5e03\u7f6e\u5927\u91cf\u67af\u71e5\u3001\u8017\u65f6\u7684\u786c\u6838\u4f5c\u4e1a\uff1b\u5ffd\u89c6\u5176\u201c\u597d\u73a9\u201d\u7684\u53cd\u9988\uff0c\u5f3a\u884c\u704c\u8f93\u53d8\u73b0\u7126\u8651\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u521d\u671f\u8fdb\u884c\u5927\u989d\u5347\u5355\u63a8\u9500**\u3002\u53ef\u5c1d\u8bd5\u63a8\u8350\u4f4e\u5ba2\u5355\u4ef7\u3001\u9ad8\u60c5\u7eea\u4ef7\u503c\u7684\u5468\u8fb9\u4ea7\u54c1\uff08\u5982\u58f0\u97f3\u76f2\u76d2\u3001\u8da3\u5473\u58f0\u7ebf\u8bfe\uff09\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u54c8\u54c8\uff0c\u86ee\u597d\u73a9\u7684\u201d\u3001\u201c\u770b\u4ed6\u4eec\u641e\u4e0a\u4e86\u201d \u2014\u2014 **\u5174\u8da3\u9a71\u52a8\u6838\u5fc3\u8bc1\u636e**\n2. > \u201c\u770b\u4e86\u4eca\u5929\u65e9\u4e0a\u7684\u90a3\u4e9b\u89c6\u9891\uff0c\u53d1\u73b0\u6628\u665a\u5f55\u7684\u592a\u5dee\u52b2\u4e86\uff0c\u60f3\u91cd\u5f55\u6765\u7684\uff0c\u4f46\u662f\u4eba\u5728\u5916\u9762\uff0c\u4e0d\u591f\u5b89\u9759\u201d \u2014\u2014 **\u9ad8\u5fc3\u7406\u5f39\u6027\uff0c\u9047\u632b\u4e3b\u52a8\u6c42\u53d8**\n3. > \u201c\u5176\u5b9e\u6211\u60f3\u77e5\u9053\u540e\u9762\u7684\u5b66\u4e60\u7684\u5b66\u8d39\u662f\u591a\u5c11\uff0c\u6211\u597d\u505a\u4e2a\u51c6\u5907\u201d \u2014\u2014 **\u7406\u6027\u3001\u6709\u8ba1\u5212\uff0c\u975e\u51b2\u52a8\u6d88\u8d39**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T5\u597d\u73a9\u5c1d\u9c9c\u8005\uff08\u5174\u8da3\u805a\u7126\u53d8\u4f53\uff09\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u67af\u71e5\u5de5\u4f5c\u5916\u627e\u4e00\u4e2a\u6709\u8da3\u3001\u6709\u6210\u5c31\u611f\u7684\u7ebf\u4e0a\u793e\u4ea4\u6e38\u4e50\u573a\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u4fdd\u6301\u8bfe\u7a0b\u8da3\u5473\u6027\u4e0e\u4f4e\u538b\u529b\uff0c\u5c06\u5176\u8f6c\u5316\u4e3a\u793e\u7fa4\u201c\u6c1b\u56f4\u7ec4\u201d\uff0c\u7528\u6e38\u620f\u5316\u6210\u5c31\u611f\u548c\u5f52\u5c5e\u611f\u9501\u4f4f\u7559\u5b58\u3011**\u3002\n\n```json\n{\"core_type\": \"T5 \u597d\u73a9\u5c1d\u9c9c\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u793e\u4ea4/\u5c0a\u91cd\", \"target_product_line\":
