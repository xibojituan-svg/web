    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4e3b\u8981\u4e3a\u9500\u552e\u5355\u5411\u5f15\u5bfc\u4e0e\u7528\u6237\u7b80\u5355\u56de\u5e94\uff0c\u7f3a\u4e4f\u7528\u6237\u4e3b\u52a8\u8868\u8fbe\u6df1\u5c42\u52a8\u673a\u3001\u60c5\u7eea\u72b6\u6001\u3001\u5bb6\u5ead\u80cc\u666f\u3001\u652f\u4ed8\u65b9\u5f0f\u53ca\u8be6\u7ec6\u8d44\u6e90\u72b6\u51b5\u7684\u4fe1\u606f\uff0c\u5224\u65ad\u4e3b\u8981\u57fa\u4e8e\u884c\u4e3a\u6a21\u5f0f\u63a8\u65ad\u3002\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677171291 (\u6635\u79f0: \u7476\u7476\ud83c\udf3c) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9759\u5fc31(\u5218\u83ca) / \u7c7d\u83f2(\u5218\u83ca) / \u6854\u5b50JZT(\u7a0b\u5c55\u6b22) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u9ad8\u9636\u8bfe\u7a0b (7380\u5143\uff0c\u4f7f\u7528\u52a9\u5b66\u91d1\u4f18\u60e0\u5238\u540e) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u7f3a\u5931** (\u672a\u77e5\u662f\u5426\u5168\u6b3e/\u5206\u671f/\u501f\u8d37) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u81ea\u7531\u804c\u4e1a\uff0c\u4ec5\u665a\u4e0a6\u70b9\u540e\u6709\u65f6\u95f4\uff0c\u767d\u5929\u65e0\u6cd5\u53c2\u4e0e) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** (\u7528\u6237\u4e3b\u52a8\u8868\u8fbe\u6781\u5c11\uff0c\u591a\u4e3a\u4efb\u52a1\u5b8c\u6210\u786e\u8ba4) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u517c\u804c\u53d8\u73b0\u610f\u613f\uff08\u201c\u6211\u90fd\u60f3\u5c1d\u8bd5\u4e00\u4e0b\u201d\u591a\u79cd\u517c\u804c\u5de5\u79cd\uff09\uff0c\u5e76\u6309\u65f6\u5b8c\u6210\u6240\u6709\u4f5c\u4e1a\u548c\u76f4\u64ad\u4efb\u52a1\uff0c\u5b66\u4e60\u884c\u52a8\u529b\u5f3a\u3002\u4f46\u672a\u8868\u73b0\u51fa\u5bf9\u6280\u672f\u539f\u7406\u7684\u6df1\u5ea6\u8ffd\u95ee\u6216\u7eaf\u7cb9\u7684\u81ea\u6211\u5b9e\u73b0\u9a71\u52a8\uff0c\u52a8\u673a\u66f4\u504f\u5411\u4e8e\u201c\u5c1d\u8bd5\u63a5\u5355\u8d5a\u94b1\u201d\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u90fd\u60f3\u5c1d\u8bd5\u4e00\u4e0b\u201d (\u5bf9\u591a\u79cd\u517c\u804c\u5de5\u79cd\u7684\u5174\u8da3)\uff1b> \u201c\u517c\u804c\u5de5\u79cd\uff1a\u753b\u672c \u5ba1\u542c \u5bf9\u8f68 \u5e72\u97f3\u5904\u7406 \u540e\u671f \u77ed\u5267\u914d\u97f3 \u5c0f\u8bf4\u5f15\u6d41 TTS \u9879\u76ee\uff1a AI \u4eba\u58f0\u91c7\u96c6\u201d (\u5bf9\u53d8\u73b0\u8def\u5f84\u7684\u5e7f\u6cdb\u5173\u6ce8)\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u672a\u77e5\u652f\u4ed8\u65b9\u5f0f\uff0c\u65e0\u6cd5\u5224\u65ad\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u2b07\u4f4e (3-4\u5206)** \u2014 \u660e\u786e\u8868\u793a\u201c\u767d\u5929\u6ca1\u65f6\u95f4\uff0c\u53ea\u6709\u665a\u4e0a\u4e94\u70b9\u591a\u4e4b\u540e\u6709\u65f6\u95f4\u201d\uff0c\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\uff0c\u5c5e\u4e8e\u5178\u578b\u7684\u4e0a\u73ed\u65cf/\u81ea\u7531\u804c\u4e1a\u8005\u665a\u95f4\u5b66\u4e60\u6a21\u5f0f\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u672a\u77e5\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8 (7-8\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u7528\u6237\u5168\u7a0b\u60c5\u7eea\u7a33\u5b9a\uff0c\u79ef\u6781\u5b8c\u6210\u4efb\u52a1\uff0c\u9762\u5bf9\u65b0\u4efb\u52a1\uff08\u8bd5\u97f3\u3001\u8bd5\u620f\uff09\u867d\u6709\u7d27\u5f20\uff08\u201c\u6211\u7d27\u5f20[\u6342\u8138]\u201d\uff09\u4f46\u80fd\u8fc5\u901f\u8c03\u6574\u5e76\u53c2\u4e0e\u3002\u672a\u51fa\u73b0\u4efb\u4f55\u6cae\u4e27\u3001\u81ea\u6211\u6000\u7591\u6216\u4f9d\u8d56\u5b89\u629a\u7684\u4fe1\u53f7\uff0c\u8868\u73b0\u51fa\u826f\u597d\u7684\u6267\u884c\u529b\u548c\u9002\u5e94\u6027\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u597d\u7684\u201d\u3001\u201c\u597d\u6ef4[\u563f\u54c8]\u201d\u3001\u201c\u597d\u561e\u201d (\u79ef\u6781\u56de\u5e94)\uff1b> \u201c\u6211\u7d27\u5f20[\u6342\u8138]\u201d (\u77ed\u6682\u60c5\u7eea\u8868\u8fbe\u540e\u8fc5\u901f\u884c\u52a8)\uff1b> \u6309\u65f6\u5b8c\u6210\u6240\u6709\u6253\u5361\u3001\u4f5c\u4e1a\u3001\u76f4\u64ad\u53c2\u4e0e\uff0c\u884c\u52a8\u529b\u5f3a\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 (\u7126\u8651\u4fdd\u969c)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9**\u7ecf\u6d4e\u6536\u5165\u7a33\u5b9a\u6027**\u7684\u6f5c\u5728\u7126\u8651\u3002\u4f5c\u4e3a\u81ea\u7531\u804c\u4e1a\u8005\uff0c\u5176\u65f6\u95f4\u5b89\u6392\uff08\u4ec5\u665a\u4e0a\u6709\u7a7a\uff09\u6697\u793a\u5176\u767d\u5929\u53ef\u80fd\u6709\u5176\u4ed6\u4e0d\u7a33\u5b9a\u7684\u5de5\u4f5c\u6216\u4e8b\u52a1\uff0c\u5bf9\u901a\u8fc7\u517c\u804c\u589e\u52a0\u6536\u5165\u3001\u4fdd\u969c\u751f\u6d3b\u6709\u660e\u786e\u9700\u6c42\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u4e0e\u8def\u5f84\u611f**\u3002\u63d0\u4f9b\u6e05\u6670\u7684\u517c\u804c\u63a5\u5355\u8def\u5f84\u3001\u53ca\u65f6\u7684\u4f5c\u4e1a\u53cd\u9988\uff08\u201c\u901a\u5173\u201d\u3001\u201c\u901a\u8fc7\u7ec8\u5ba1\u201d\uff09\u3001\u4ee5\u53ca\u201c\u5feb\u4eba\u4e00\u6b65\u201d\u7684\u5b9e\u6218\u673a\u4f1a\uff08\u8bd5\u97f3\u3001\u8bd5\u620f\uff09\uff0c\u6ee1\u8db3\u5176\u5bf9\u201c\u901a\u8fc7\u5b66\u4e60\u83b7\u5f97\u7a33\u5b9a\u526f\u4e1a\u6536\u5165\u201d\u7684\u5b89\u5168\u611f\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u95f7\u58f0\u5e72\u786c\u6838\u6d3b\u6c42\u80af\u5b9a) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n**\u5224\u5b9a\u6811\u8def\u5f84\u63a8\u6f14**\uff1a\n1.  **\u52a8\u673a\u7eaf\u5ea6(5-6\u5206) + \u8d44\u6e90\u5e95\u5ea7(3-4\u5206) + \u5fc3\u7406\u5f39\u6027(7-8\u5206)** \u8fdb\u5165\u3010\u7b2c\u4e09\u5c42\uff1a\u4e2d\u9ad8\u52a8\u673a\u7cbe\u5206\u3011\u3002\n2.  \u5fc3\u7406\u5f39\u6027\u22657\u5206\uff0c\u8fdb\u5165\u3010\u5206\u652fA\uff1a\u9ad8\u5f39\u6027\u901a\u9053\u3011\u3002\n3.  \u7528\u6237\u672a\u8868\u73b0\u51fa\u4e3b\u52a8\u7edf\u7b79\u884c\u4e3a(T1)\u3001\u6df1\u5ea6\u6280\u672f\u8ffd\u95ee(T3)\u6216\u9ad8\u9891\u975e\u5b66\u4e60\u793e\u4ea4(T7)\u3002\n4.  **\u547d\u4e2d\u515c\u5e95\u903b\u8f91**\uff1a\u2192 **\ud83d\udfe2 \u5224\u5b9a\uff1aT2 \u4f4e\u8c03\u8001\u9ec4\u725b**\u3002\u7528\u6237\u6309\u65f6\u3001\u9ad8\u8d28\u91cf\u5b8c\u6210\u6240\u6709\u6307\u5b9a\u4efb\u52a1\uff08\u6253\u5361\u3001\u4f5c\u4e1a\u3001\u76f4\u64ad\u3001\u8bd5\u97f3\uff09\uff0c\u884c\u52a8\u529b\u5f3a\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u662f\u5178\u578b\u7684\u6267\u884c\u529b\u5f3a\u3001\u8ffd\u6c42\u80af\u5b9a\u7684\u5b9e\u5e72\u578b\u5b66\u5458\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e (\u4fe1\u606f\u7f3a\u5931) | \u672a\u77e5\uff0c\u9700\u540e\u7eed\u8865\u5145\u4fe1\u606f\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u65f6\u95f4\u51b2\u7a81\u5bfc\u81f4\u5b66\u4e60\u79ef\u538b**\u3002\u5176\u201c\u4ec5\u665a\u4e0a\u6709\u65f6\u95f4\u201d\u7684\u788e\u7247\u5316\u6a21\u5f0f\uff0c\u82e5\u8bfe\u7a0b\u540e\u671f\u76f4\u64ad\u6216\u4f5c\u4e1a\u5bc6\u96c6\u5728\u767d\u5929\uff0c\u53ef\u80fd\u5bfc\u81f4\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\u4ea7\u751f\u7126\u8651\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u77ed\u671f\u5185\u56e0\u6280\u672f\u632b\u6298\u5d29\u6e83\u7684\u53ef\u80fd\u6027\u4f4e\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | **\u63a5\u5355\u53d8\u73b0\u5468\u671f\u8fc7\u957f\u6216\u673a\u4f1a\u6e3a\u832b**\u3002\u7528\u6237\u5bf9\u591a\u79cd\u201c\u517c\u804c\u5de5\u79cd\u201d\u8868\u73b0\u51fa\u5174\u8da3\uff0c\u82e5\u5728\u627f\u8bfa\u671f\u5185\uff08\u5982\u201c\u51e0\u5929\u5c31\u53ef\u4ee5\u5c1d\u8bd5\u5f00\u59cb\u5b9e\u6218\u63a5\u5355\u201d\uff09\u672a\u83b7\u5f97\u5b9e\u8d28\u6027\u7684\u8bd5\u97f3\u901a\u8fc7\u6216\u5fae\u5c0f\u6536\u76ca\uff0c\u53ef\u80fd\u56e0\u9884\u671f\u843d\u5dee\u800c\u4ea7\u751f\u52a8\u6447\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-4\u5468\u540e**\u3002\u5f53\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u82e5\u4ecd\u672a\u83b7\u5f97\u4efb\u4f55\u6b63\u5411\u53cd\u9988\uff08\u5982\u8bd5\u97f3\u901a\u8fc7\u3001\u5c0f\u989d\u62a5\u916c\uff09\u6216\u611f\u89c9\u5b66\u4e60\u5185\u5bb9\u4e0e\u53d8\u73b0\u627f\u8bfa\u8131\u8282\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u7476\u7476\uff0c\u770b\u5230\u4f60\u4f53\u9a8c\u8425\u671f\u95f4\u6bcf\u4e00\u9879\u4efb\u52a1\u90fd\u5b8c\u6210\u5f97\u7279\u522b\u624e\u5b9e\uff0c\u665a\u4e0a\u90a3\u4e48\u665a\u8fd8\u5728\u4ea4\u4f5c\u4e1a\uff0c\u8fd9\u4efd\u8ba4\u771f\u52b2\u513f\u592a\u68d2\u4e86\uff01\u54b1\u4eec\u6b63\u5f0f\u8bfe\u4f1a\u5ef6\u7eed\u2018\u89c1\u7f1d\u63d2\u9488\u2019\u7684\u6a21\u5f0f\uff0c\u6240\u6709\u76f4\u64ad\u90fd\u6709\u56de\u653e\uff0c\u91cd\u70b9\u4efb\u52a1\u6211\u4e5f\u4f1a\u5728\u665a\u4e0a\u4f60\u65b9\u4fbf\u7684\u65f6\u95f4\u70b9\u63d0\u9192\u3002\u4f60\u7684\u76ee\u6807\u5f88\u660e\u786e\uff08\u5c1d\u8bd5\u5404\u79cd\u517c\u804c\uff09\uff0c\u6211\u4f1a\u5e2e\u4f60\u76ef\u7740\u9002\u5408\u4f60\u7684\u8bd5\u97f3\u673a\u4f1a\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u628a\u53d8\u73b0\u8def\u5f84\u8d70\u7a33\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176T2\u8001\u9ec4\u725b\u7279\u8d28\uff0c\u63d0\u4f9b\u7cfb\u7edf\u3001\u624e\u5b9e\u7684\u6280\u80fd\u8bad\u7ec3\u548c\u660e\u786e\u7684\u8fdb\u9636\u8def\u5f84\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\u7684\u7279\u70b9\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145**\u3010\u7075\u6d3b\u65f6\u95f4\u4fdd\u969c\u5305\u3011**\uff08\u6240\u6709\u91cd\u8981\u5185\u5bb9\u63d0\u4f9b\u6e05\u6670\u56de\u653e+\u5173\u952e\u8282\u70b9\u665a\u95f4\u63d0\u9192\uff09\u3002\u9488\u5bf9\u5176\u53d8\u73b0\u8bc9\u6c42\uff0c\u53ef\u9002\u65f6\u5f15\u5165**\u3010\u7cbe\u51c6\u6d3e\u5355\u5b9e\u6218\u5305\u3011**\uff08B\u6a21\u5757\uff09\uff0c\u63d0\u4f9b\u771f\u5b9e\u3001\u5339\u914d\u5176\u97f3\u8272\uff08\u5c11\u5973\u97f3\uff09\u7684\u8bd5\u97f3\u673a\u4f1a\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5ffd\u89c6\u5176\u65f6\u95f4\u9650\u5236\uff0c\u5728\u767d\u5929\u9891\u7e41@\u6216\u50ac\u4fc3\uff1b\u7ed9\u51fa\u6a21\u7cca\u3001\u65e0\u6cd5\u5151\u73b0\u7684\u201c\u5feb\u901f\u66b4\u5bcc\u201d\u627f\u8bfa\uff1b\u5728\u5176\u5b8c\u6210\u9ad8\u8d28\u91cf\u4f5c\u4e1a\u540e\u4ec5\u7ed9\u4e88\u6577\u884d\u7684\u201c\u6a21\u677f\u5f0f\u201d\u8868\u626c\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002T2\u7528\u6237\u662f\u9ad8\u590d\u8d2d\u6f5c\u529b\u80a1\uff0c\u5728\u5176\u6280\u80fd\u8fbe\u6807\u3001\u83b7\u5f97\u521d\u6b65\u6b63\u53cd\u9988\uff08\u5982\u63a5\u5230\u7b2c\u4e00\u5355\uff09\u540e\uff0c\u53ef\u4ee5\u987a\u7406\u6210\u7ae0\u5730\u63a8\u4ecb\u540e\u671f\u5236\u4f5c\u3001\u8bbe\u5907\u5347\u7ea7\u7b49\u9ad8\u9636\u8bfe\u7a0b\u6216\u670d\u52a1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u81ea\u7531\u804c\u4e1a \u6bcf\u5929\u665a\u4e0a\u516d\u70b9\u4e4b\u540e\u201d **(\u8d44\u6e90\u5e95\u5ea7\u77ed\u677f\uff1a\u65f6\u95f4\u788e\u7247\u5316)**\n2. > \u201c\u6211\u90fd\u60f3\u5c1d\u8bd5\u4e00\u4e0b\u201d **(\u52a8\u673a\u7eaf\u5ea6\uff1a\u660e\u786e\u7684\u517c\u804c\u53d8\u73b0\u63a2\u7d22\u6b32)**\n3. > \u201c\u65e9\u529f\u5df2\u5b8c\u6210\u57fa\u672c\u529f\u7ec3\u4e60\u201d\u3001\u201c\u827e\u5b9d\u826f\u201d\u3001\u201c\u738b\u660e\u519b\u201d\u3001\u201c\u6b66\u5411\u5f64\u201d **(\u5fc3\u7406\u5f39\u6027\u4e0e\u6267\u884c\u529b\uff1a\u7a33\u5b9a\u3001\u6309\u65f6\u5b8c\u6210\u6240\u6709\u6253\u5361\u548c\u4f5c\u4e1a\uff0c\u884c\u52a8\u529b\u5f3a)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u7a33\u5b9a\u7684\u517c\u804c\u6536\u5165\u4fdd\u969c\uff08\u5b89\u5168\u9700\u6c42\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u5b9e\u73b0\u7684\u53d8\u73b0\u8def\u5f84\u4e0e\u65f6\u95f4\u53cb\u597d\u7684\u5b66\u4e60\u652f\u6301\uff0c\u4e25\u9632\u201c\u63a5\u5355\u65e0\u671b\u201d\u7684\u9884\u671f\u843d\u5dee\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u7075\u6d3b\u65f6\u95f4\u4fdd\u969c\u5305+\u7cbe\u51c6\u6d3e\u5355\u5b9e\u6218\u5305\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}\n```";
