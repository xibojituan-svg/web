c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5728\u5e38\u89c4\u5de5\u4f5c\u4e4b\u5916\uff0c\u5bfb\u6c42\u4e00\u4e2a\u80fd\u83b7\u5f97\u5373\u65f6\u6b63\u53cd\u9988\u3001\u6709\u793e\u7fa4\u4e92\u52a8\u3001\u5e76\u80fd\u5c55\u73b0\u4e2a\u4eba\u72ec\u7279\u4ef7\u503c\uff08\u201c\u9752\u53d4\u97f3\u201d\uff09\u7684\u65b0\u8eab\u4efd\u548c\u65b0\u5708\u5b50\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5708\u5c42\u8ba4\u540c\u4e0e\u4ef7\u503c\u80af\u5b9a**\u3002\u8ba9\u4ed6\u611f\u53d7\u5230\u81ea\u5df1\u662f\u201c\u88ab\u9009\u4e2d\u7684\u4f18\u79c0\u5b66\u5458\u201d\uff0c\u5728\u793e\u7fa4\u5408\u4f5c\uff08PIA\u620f\uff09\u4e2d\u83b7\u5f97\u6210\u5c31\u611f\uff0c\u5e76\u901a\u8fc7\u201c\u4e13\u5c5e\u8d44\u6e90\u201d\u3001\u201c\u5185\u884c\u201d\u7b49\u6807\u7b7e\u6ee1\u8db3\u5176\u5c0a\u91cd\u4e0e\u5f52\u5c5e\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u7cbe\u786e\u5224\u5b9a**\u3002\u57fa\u4e8e\u73b0\u6709\u79ef\u6781\u4e92\u52a8\uff0c\u503e\u5411 **\ud83d\udfe7B\u7c7b**\uff08\u6709\u6f5c\u529b\u3001\u914d\u5408\u5ea6\u9ad8\uff0c\u4f46\u5173\u952e\u51b3\u7b56\u4fe1\u606f\u7f3a\u5931\uff09\u3002 |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **[T5 \u597d\u73a9\u5c1d\u9c9c]** \u4e0e **[T4 \u641e\u94b1\u7ed3\u679c]** \u7684\u6df7\u5408\u4f53\uff0c\u66f4\u504f\u5411 **T5**\u3002\u4eab\u53d7\u5b66\u4e60\u3001\u4e92\u52a8\u8fc7\u7a0b\uff0c\u5bf9\u53d8\u73b0\u6709\u5174\u8da3\u4f46\u975e\u552f\u4e00\u9a71\u52a8\u529b\u3002 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a[\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5ead\u51b2\u7a81\u7b49\u7ea2\u7ebf\u4fe1\u53f7]\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | [\u4f4e] | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u8868\u73b0\u72ec\u7acb\uff0c\u98ce\u9669\u6682\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | [\u4e2d] | **\u5de5\u4f5c\u7e41\u5fd9\u5bfc\u81f4\u5b66\u4e60\u8fdb\u5ea6\u79ef\u538b**\u3002\u767d\u5929\u6709\u5168\u804c\u5de5\u4f5c\uff0c\u82e5\u8bfe\u7a0b\u5f3a\u5ea6\u6301\u7eed\u52a0\u5927\uff0c\u53ef\u80fd\u56e0\u65f6\u95f4\u51b2\u7a81\u4ea7\u751f\u7126\u8651\u548c\u632b\u8d25\u611f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | [\u6781\u4f4e] | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff08\u5982\u7528\u5973\u53cb\u7167\u7247\u627e\u5bf9\u8c61\u611f\uff09\uff0c\u975e\u73bb\u7483\u5fc3\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | [\u4e2d] | \u5bf9\u201c\u8fb9\u5b66\u8fb9\u8d5a\u201d\u6709\u671f\u5f85\uff0c\u82e5\u8fdb\u5165\u7cfb\u7edf\u8bfe\u540e\u53d1\u73b0\u63a5\u5355\u95e8\u69db\u6216\u6536\u76ca\u5468\u671f\u8fdc\u8d85\u9884\u671f\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-4\u5468\u540e**\u3002\u5f53\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u7cfb\u7edf\u8bfe\u4f5c\u4e1a\u96be\u5ea6\u548c\u5f3a\u5ea6\u63d0\u5347\uff0c\u4e0e\u5de5\u4f5c\u65f6\u95f4\u51b2\u7a81\u52a0\u5267\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5e08\u5144/\u59d0\uff0c\u770b\u5230\u4f60\u8bad\u7ec3\u8425\u91cc\u7528\u5bb6\u4e61\u8bdd\u914d\u6cd5\u6d77\u90a3\u6bb5\uff0c\u592a\u6709\u521b\u610f\u4e86\uff01\u54b1\u4eec\u7cfb\u7edf\u8bfe\u91cc\u5c31\u6709\u5f88\u591a\u8fd9\u6837\u597d\u73a9\u53c8\u80fd\u5b9e\u6218\u7684PIA\u620f\u73af\u8282\uff0c\u4f60\u7684\u2018\u9752\u53d4\u97f3\u2019\u5728\u89d2\u8272\u620f\u91cc\u7279\u522b\u6709\u5e02\u573a\u3002\u77e5\u9053\u4f60\u5de5\u4f5c\u5fd9\uff0c\u54b1\u4eec\u8282\u594f\u53ef\u4ee5\u7075\u6d3b\u8c03\u6574\uff0c\u6838\u5fc3\u662f\u5e26\u4f60\u73a9\u7740\u5c31\u628a\u94b1\u8d5a\u4e86\uff0c\u8fd8\u80fd\u8ba4\u8bc6\u4e00\u7fa4\u5fd7\u540c\u9053\u5408\u7684\u670b\u53cb\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5174\u8da3\u6e38\u4e50\u7ebf**\u3011\u3002\u4ee5\u793e\u7fa4\u4e92\u52a8\uff08PIA\u620f\u3001\u5267\u7ec4\u5408\u4f5c\uff09\u3001\u89d2\u8272\u626e\u6f14\u3001\u58f0\u97f3\u5b9e\u9a8c\u4e3a\u6838\u5fc3\u9a71\u52a8\u529b\uff0c\u5c06\u53d8\u73b0\u5305\u88c5\u4e3a\u6e38\u620f\u901a\u5173\u5956\u52b1\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u5de5\u4f5c\u65f6\u95f4\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010**\u788e\u7247\u65f6\u95f4\u5b66\u4e60\u5305**\u3011\uff08\u5982\u77ed\u97f3\u9891\u8ddf\u7ec3\u300115\u5206\u949f\u5fae\u8bfe\uff09\u548c\u3010**\u7075\u6d3b\u63a5\u5355\u6307\u5f15\u5305**\u3011\uff08\u660e\u786e\u54ea\u4e9b\u5c97\u4f4d/\u4efb\u52a1\u9002\u5408\u5229\u7528\u788e\u7247\u65f6\u95f4\u5b8c\u6210\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7edd\u4e0d\u8981\u7528\u201c\u82e6\u5927\u4ec7\u6df1\u201d\u3001\u201c\u5fc5\u987b\u6bcf\u5929\u6295\u5165X\u5c0f\u65f6\u201d\u7684\u7126\u8651\u8bdd\u672f\u65bd\u538b\u3002\u907f\u514d\u5c06\u5176\u5f53\u4f5c\u7eaf\u201c\u641e\u94b1\u673a\u5668\u201d\u5bf9\u5f85\uff0c\u5ffd\u89c6\u5176\u793e\u4ea4\u548c\u5a31\u4e50\u9700\u6c42\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u521d\u671f\u5927\u989d\u5347\u5355**\u3002\u53ef\u57fa\u4e8e\u5176\u5174\u8da3\u70b9\uff08\u5982\u5bf9\u67d0\u4e2a\u914d\u97f3\u7c7b\u578b\u7279\u522b\u70ed\u8877\uff09\u63a8\u8350500\u5143\u4ee5\u5185\u7684\u5fae\u8bfe\u6216\u4e13\u9898\u8bad\u7ec3\u8425\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u8fd9\u51e0\u4e2a\u90fd\u60f3\u5b66\uff0c\u8fb9\u5b66\u8fb9\u8d5a\uff0c\u8fb9\u8d5a\u8fb9\u5b66[\u5472\u7259][\u5472\u7259][\u5472\u7259]\u201d \n2. > \u201c\u54c8\u54c8\uff0c\u6211\u628a\u6211\u5973\u670b\u53cb\u7684\u7167\u7247\u653e\u5728\u684c\u5b50\u4e0a\uff0c\u6bd4\u73a9\u5076\u7ba1\u7528[\u6342\u8138][\u6342\u8138][\u6342\u8138]\u201d \n3. > \u201c\u611f\u89c9\u548c\u540c\u5b66\u4eec\u4e00\u8d77\u5408\u4f5c\u633a\u6109\u5feb\u7684\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **[T5\u597d\u73a9\u5c1d\u9c9c\u578b]**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **[\u793e\u4ea4\u5f52\u5c5e\u4e0e\u4ef7\u503c\u8ba4\u540c]**\u3002\u9000\u5355\u51e0\u7387\u4e3a **[\u4e2d]**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **[\u4fdd\u6301\u5b66\u4e60\u8fc7\u7a0b\u7684\u8da3\u5473\u6027\u4e0e\u793e\u7fa4\u4e92\u52a8\uff0c\u63d0\u4f9b\u7075\u6d3b\u7684\u65f6\u95f4\u89e3\u51b3\u65b9\u6848\uff0c\u7ba1\u7406\u5176\u6536\u76ca\u9884\u671f]**\u3002\n\n```json\n{\"core_type\": \"T5 \u597d\u73a9\u5c1d\u9c9c\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u793e\u4ea4/\u5c0a\u91cd\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf\"}\n```";
