    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u804a\u5929\u8bb0\u5f55\u4e3b\u8981\u53cd\u6620\u7528\u6237\u5728\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u7684\u4e92\u52a8\u4e0e\u95ee\u9898\uff0c\u7f3a\u4e4f\u5173\u4e8e**\u652f\u4ed8\u51b3\u7b56\u8fc7\u7a0b\u3001\u5bb6\u5ead\u80cc\u666f\u3001\u7ecf\u6d4e\u72b6\u51b5\u3001\u5b66\u4e60\u76ee\u6807\u660e\u786e\u6027\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386**\u7b49\u5173\u952e\u7ef4\u5ea6\u7684\u4fe1\u606f\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a**\u4e2d\u7b49**\u3002\u7528\u6237\u8868\u73b0\u51fa\u8f83\u5f3a\u7684\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b\uff08\u4e3b\u52a8\u63d0\u95ee\u3001\u4ea4\u4f5c\u4e1a\u3001\u53c2\u4e0e\u4e92\u8bc4\uff09\uff0c\u6838\u5fc3\u8bc9\u6c42\u662f\u89e3\u51b3\u5177\u4f53\u6280\u80fd\u95ee\u9898\uff08\u53e3\u6c34\u97f3\u3001\u5e73\u7fd8\u820c\u3001\u8bd5\u97f3\u4e0d\u8fc7\uff09\u4ee5\u63d0\u5347\u63a5\u5355\u6210\u529f\u7387\u3002\u4f46\u52a8\u673a\u4e2d**\u53d8\u73b0\u7126\u8651**\uff08\u201c\u8fc7\u4e0d\u4e86\u7ec8\u5ba1\u201d\u3001\u201c\u4e0d\u88ab\u7532\u65b9\u5f85\u89c1\u201d\uff09\u548c**\u6280\u672f\u5de5\u5177\u4f9d\u8d56**\uff08\u5bfb\u6c42\u8bbe\u5907/\u8f6f\u4ef6\u89e3\u51b3\u65b9\u6848\uff09\u6210\u5206\u8f83\u9ad8\uff0c\u5b58\u5728\u5c06\u5b66\u4e60\u6548\u679c\u5916\u5f52\u56e0\u7684\u503e\u5411\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u4ece\u5bf9\u8bdd\u4e2d\u53ef\u63a8\u65ad\u7528\u6237\u62e5\u6709\u5f55\u97f3\u8bbe\u5907\uff08\u827e\u80af\u58f0\u5361\uff09\uff0c\u6709\u56fa\u5b9a\u5de5\u4f5c\uff08\u201c\u767d\u5929\u4e0a\u73ed\u201d\uff09\uff0c\u5177\u5907\u57fa\u672c\u7684\u5b66\u4e60\u65f6\u95f4\uff08\u665a\u4e0a/\u5468\u672b\uff09\u3002\u4f46**\u7ecf\u6d4e\u6295\u5165\u80fd\u529b\u3001\u53ef\u652f\u914d\u5b66\u4e60\u65f6\u95f4\u603b\u91cf\u3001\u5bb6\u5ead\u652f\u6301\u5ea6**\u7b49\u5173\u952e\u8d44\u6e90\u4fe1\u606f\u7f3a\u5931\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a**\u4e2d\u7b49\u504f\u4e0b**\u3002\u7528\u6237\u5b66\u4e60\u6001\u5ea6\u79ef\u6781\uff0c\u80fd\u63a5\u53d7\u76f4\u63a5\u53cd\u9988\uff08\u201c\u76f4\u63a5\uff01\u201d\uff09\uff0c\u5e76\u53c2\u4e0e\u793e\u7fa4\u4e92\u52a8\u3002\u4f46**\u663e\u9732\u51fa\u660e\u663e\u7684\u632b\u8d25\u611f\u4e0e\u81ea\u6211\u6000\u7591**\uff08\u201c\u6211\u5c31\u8fd9\u4e48\u4e0d\u88ab\u7532\u65b9\u5927\u5927\u5f85\u89c1\u5417\u201d\u3001\u201c\u96be\u9053\u662f\u751f\u7406\u7f3a\u9677\u5417\u201d\uff09\uff0c\u5bf9\u81ea\u8eab\u95ee\u9898\uff08\u53e3\u6c34\u97f3\u3001\u5e73\u7fd8\u820c\uff09\u5b58\u5728**\u8fc7\u5ea6\u5173\u6ce8\u548c\u7126\u8651**\uff0c\u4e14\u5c06\u95ee\u9898\u90e8\u5206\u5f52\u56e0\u4e8e\u5916\u90e8\uff08\u8bbe\u5907\u3001\u8f6f\u4ef6\u3001\u751f\u7406\uff09\uff0c**\u6297\u538b\u80fd\u529b\u548c\u6210\u957f\u578b\u601d\u7ef4\u6709\u5f85\u89c2\u5bdf**\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u8bb0\u5f55\u4e2d\u65e0\u652f\u4ed8\u76f8\u5173\u4fe1\u606f\uff0c**\u65e0\u6cd5\u5224\u65ad**\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u8bb0\u5f55\u4e2d\u65e0\u5bb6\u5ead\u51b3\u7b56\u76f8\u5173\u4fe1\u606f\uff0c**\u65e0\u6cd5\u5224\u65ad**\u3002\n*   **\u6b65\u9aa41-4\u5224\u5b9a**\uff1a\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5b8c\u6210\u5b8c\u6574ABCD\u5206\u7c7b\u3002\u4ec5\u4ece\u73b0\u6709\u4e92\u52a8\u770b\uff0c\u7528\u6237\u5c5e\u4e8e**\u5df2\u4ed8\u8d39\u3001\u6b63\u5728\u670d\u52a1\u671f\u5185\u7684\u5b66\u5458**\uff0c\u5904\u4e8e**\u5b66\u4e60\u4e0e\u95ee\u9898\u66b4\u9732\u9636\u6bb5**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b\uff1aT5 \u6280\u672f\u7126\u8651\u578b\u5b9e\u5e72\u8005**\u3002\n    *   **\u4f9d\u636e**\uff1a\u7528\u6237\u6838\u5fc3\u5173\u6ce8\u70b9\u805a\u7126\u4e8e**\u5177\u4f53\u6280\u672f\u96be\u9898\u7684\u89e3\u51b3**\uff08\u53e3\u6c34\u97f3\u3001\u5e73\u7fd8\u820c\u3001\u673a\u67b6\u8bbe\u7f6e\u3001\u540e\u671f\u53c2\u6570\uff09\uff0c\u5e76\u79ef\u6781\u5bfb\u6c42\u65b9\u6cd5\uff08\u63d0\u95ee\u3001\u5c1d\u8bd5\u4e0d\u540c\u8f6f\u4ef6\uff09\u3002\u540c\u65f6\u4f34\u968f\u660e\u663e\u7684**\u6210\u679c\u7126\u8651**\uff08\u8bd5\u97f3\u5c61\u6b21\u4e0d\u8fc7\uff09\uff0c\u60c5\u7eea\u6613\u53d7\u632b\u8d25\u5f71\u54cd\u3002\u884c\u4e3a\u4e0a\u8868\u73b0\u4e3a\u201c\u5b9e\u5e72\u201d\uff08\u4ea4\u4f5c\u4e1a\u3001\u4e92\u8bc4\uff09\uff0c\u4f46\u5fc3\u6001\u4e0a\u5bb9\u6613\u9677\u5165\u5bf9\u5355\u4e00\u6280\u672f\u7ec6\u8282\u7684\u7ea0\u7ed3\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669\u7b49\u7ea7\uff1a\u4e2d**\u3002\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5df2\u591a\u6b21\u8bd5\u97f3\u672a\u8fc7\uff0c\u4e14\u5bf9\u81ea\u8eab\u95ee\u9898\u611f\u5230\u56f0\u60d1\u548c\u632b\u8d25\uff0c\u82e5\u8bfe\u7a0b\u7ed3\u675f\u540e\u63a5\u5355\u4ecd\u65e0\u8fdb\u5c55\uff0c\u6781\u6613\u5f15\u53d1\u6548\u679c\u4e89\u8bae\u3002\n    2.  **\u627f\u8bfa\u672a\u5151\u73b0**\uff1a\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u8bc4\u4f30\u3002\n    3.  **\u670d\u52a1\u4f53\u9a8c\u5dee**\uff1a**\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u4e0e\u73ed\u4e3b\u4efb\uff08\u9500\u552e\uff09\u4e92\u52a8\u826f\u597d\uff0c\u53cd\u9988\u53ca\u65f6\uff0c\u7528\u6237\u8868\u8fbe\u611f\u8c22\uff08\u201c\u60a8\u771f\u662f\u4e2a\u5b9d\u85cf\u201d\uff09\u3002\n    4.  **\u7ecf\u6d4e\u538b\u529b/\u51b3\u7b56\u53d8\u5316**\uff1a\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u8bc4\u4f30\u3002\n    5.  **\u4ea7\u54c1\u9519\u914d**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u9700\u6c42\u975e\u5e38\u5177\u4f53\uff08\u89e3\u51b3\u53e3\u6c34\u97f3\u3001\u5e73\u7fd8\u820c\uff09\uff0c\u82e5\u8bfe\u7a0b\u5185\u5bb9\u88ab\u5176\u611f\u77e5\u4e3a\u65e0\u6cd5\u76f4\u63a5\u89e3\u51b3\u8fd9\u4e9b\u201c\u75db\u70b9\u201d\uff0c\u53ef\u80fd\u4ea7\u751f\u9519\u914d\u611f\u3002\n    6.  **\u4f26\u7406\u51b2\u7a81**\uff1a**\u4f4e\u98ce\u9669**\u3002\u65e0\u975e\u7406\u6027\u627f\u8bfa\u8ff9\u8c61\u3002\n    7.  **\u4ece\u4f17/\u51b2\u52a8\u540e\u6094**\uff1a\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u8bc4\u4f30\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u672a\u53d1\u73b0**\u9500\u552e\u5b58\u5728\u8fc7\u5ea6\u627f\u8bfa\u3001\u8d2c\u635f\u7ade\u54c1\u3001\u5236\u9020\u7126\u8651\u7b49\u8fdd\u89c4\u884c\u4e3a\u3002\u73ed\u4e3b\u4efb\u7684\u53cd\u9988\u4e13\u4e1a\u3001\u5177\u4f53\uff08\u5982\u70b9\u8bc4\u8282\u594f\u3001\u60c5\u7eea\u3001\u62c9\u97f3\u95ee\u9898\uff09\uff0c\u5e76\u63d0\u4f9b\u4e86\u5b9e\u7528\u5efa\u8bae\uff08\u5f55\u97f3\u524d\u5403\u82f9\u679c\u3001\u5fc3\u6001\u8c03\u6574\uff09\u3002\n*   **\u6f5c\u5728\u98ce\u9669\u70b9**\uff1a\u73ed\u4e3b\u4efb\u63d0\u53ca\u201c\u4f60\u4e2d\u4e66\u662f\u65e9\u665a\u7684\u4e8b\u513f\u201d\uff0c\u867d\u4e3a\u9f13\u52b1\uff0c\u4f46\u9700\u6ce8\u610f\u907f\u514d\u8ba9\u7528\u6237\u4ea7\u751f**\u786e\u5b9a\u6027\u7684\u53d8\u73b0\u9884\u671f**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**\uff1a**\u504f\u5dee**\u3002\u7528\u6237\u6025\u9700\u89e3\u51b3\u7684\u662f**\u7279\u5b9a\u53d1\u97f3\u95ee\u9898\uff08\u53e3\u6c34\u97f3\u3001\u5e73\u7fd8\u820c\uff09\u548c\u8bd5\u97f3\u6280\u5de7**\uff0c\u9700\u8bc4\u4f30\u5f53\u524d\u8bfe\u7a0b\u5185\u5bb9\u4e2d\u9488\u5bf9\u6027\u7684**\u7ea0\u97f3\u8bad\u7ec3\u3001\u8bd5\u97f3\u7b56\u7565\u3001\u7532\u65b9\u5ba1\u542c\u6807\u51c6\u89e3\u6790**\u7b49\u6a21\u5757\u662f\u5426\u8db3\u591f\u5f3a\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**\u9488\u5bf9\u6027\u63d0\u4f9b\u53d1\u97f3\u95ee\u9898\u89e3\u51b3\u65b9\u6848\u4e0e\u8bd5\u97f3\u8f85\u5bfc**\u3002\n*   **\u5177\u4f53\u884c\u52a8\u5efa\u8bae**\uff1a\n    1.  **\u95ee\u9898\u805a\u7126\u4e0e\u62c6\u89e3**\uff1a\u4e0e\u7528\u6237\u6df1\u5ea6\u6c9f\u901a\uff0c\u5c06\u5176\u201c\u8fc7\u4e0d\u4e86\u7ec8\u5ba1\u201d\u7684\u6a21\u7cca\u7126\u8651\uff0c\u62c6\u89e3\u4e3a\u53ef\u6267\u884c\u3001\u53ef\u6539\u8fdb\u7684\u5177\u4f53\u6280\u672f\u70b9\uff08\u5982\uff1a\u5e73\u7fd8\u820c\u4e13\u9879\u7ec3\u4e60\u6e05\u5355\u3001\u9488\u5bf9\u53e3\u6c34\u97f3\u7684\u6c14\u606f\u63a7\u5236\u7ec3\u4e60\u3001\u8bd5\u97f3\u4f5c\u54c1\u8282\u594f\u4e0e\u60c5\u7eea\u5206\u6790\u6a21\u677f\uff09\u3002\n    2.  **\u63d0\u4f9b\u4e13\u9879\u8d44\u6e90**\uff1a\u63a8\u8350\u6216\u63d0\u4f9b\u9488\u5bf9\u4e1c\u5317\u65b9\u8a00\u533a\u5e73\u7fd8\u820c\u7ea0\u6b63\u3001\u53e3\u6c34\u97f3\u63a7\u5236\u7684**\u4e13\u9879\u8bad\u7ec3\u6750\u6599\u6216\u5fae\u8bfe**\uff0c\u5b89\u63921v1\u7684**\u7ea0\u97f3\u6307\u5bfc**\u3002\n    3.  **\u6821\u6b63\u9884\u671f\uff0c\u5f3a\u5316\u8fc7\u7a0b**\uff1a\u660e\u786e\u544a\u77e5\u53d1\u97f3\u4e60\u60ef\u6539\u53d8\u9700\u8981\u6301\u7eed\u7ec3\u4e60\uff0c\u80af\u5b9a\u5176\u5f53\u524d\u52aa\u529b\uff08\u4ea4\u4f5c\u4e1a\u3001\u4e92\u8bc4\uff09\uff0c\u5f15\u5bfc\u5176\u5173\u6ce8**\u81ea\u8eab\u8fdb\u6b65\u7684\u91cc\u7a0b\u7891**\uff08\u5982\u67d0\u6bb5\u7ed5\u53e3\u4ee4\u8bfb\u987a\u3001\u67d0\u7c7b\u60c5\u7eea\u628a\u63e1\u66f4\u51c6\uff09\uff0c\u800c\u975e\u4ec5\u4ec5\u805a\u7126\u201c\u4e2d\u4e66\u201d\u7ed3\u679c\u3002\n    4.  **\u5efa\u7acb\u6210\u529f\u6848\u4f8b\u8fde\u63a5**\uff1a\u5206\u4eab\u6709\u7c7b\u4f3c\u95ee\u9898\uff08\u5982\u65b9\u8a00\u3001\u53e3\u6c34\u97f3\uff09\u5e76\u901a\u8fc7\u7ec3\u4e60\u6539\u5584\u540e\u6210\u529f\u63a5\u5355\u7684\u5b66\u5458\u6848\u4f8b\uff0c\u589e\u5f3a\u5176\u4fe1\u5fc3\u3002\n    5.  **\u98ce\u9669\u76d1\u63a7**\uff1a\u6301\u7eed\u5173\u6ce8\u5176\u8bd5\u97f3\u7ed3\u679c\u548c\u60c5\u7eea\u6ce2\u52a8\u3002\u82e5\u957f\u671f\u65e0\u79ef\u6781\u53cd\u9988\uff0c**\u63d0\u524d\u4ecb\u5165**\uff0c\u8fdb\u884c\u5b66\u4e60\u590d\u76d8\u548c\u8ba1\u5212\u8c03\u6574\uff0c\u907f\u514d\u8d1f\u9762\u60c5\u7eea\u7d2f\u79ef\u5bfc\u81f4\u9000\u8d39\u3002\n\n{\"core_type\": \"T5 \u6280\u672f\u7126\u8651\u578b\u5b9e\u5e72\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u9488\u5bf9\u6027\u63d0\u4f9b\u53d1\u97f3\u95ee\u9898\u89e3\u51b3\u65b9\u6848\u4e0e\u8bd5\u97f3\u8f85\u5bfc\"}";
