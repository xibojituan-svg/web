    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u4e0e\u98ce\u63a7\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u7f3a\u4e4f\u7528\u6237\u652f\u4ed8\u4fe1\u606f\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u3001\u8fc7\u5f80\u804c\u4e1a/\u6536\u5165/\u65f6\u95f4\u8d44\u6e90\u4fe1\u606f\u3001\u660e\u786e\u7684\u5b66\u4e60\u52a8\u673a\u9648\u8ff0\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4f4e-\u4e2d\u4fe1\u53f7)**\n    *   **\u6b63\u5411\u4fe1\u53f7**\uff1a\u4e3b\u52a8\u7ec3\u4e60\u3001\u63d0\u4ea4\u4f5c\u4e1a\u3001\u8be2\u95ee\u6280\u5de7\uff08\u201c\u5ff5\u7684\u611f\u89c9\u201d\u3001\u201c\u5bf9\u8c61\u611f\u201d\u3001\u201c\u6c14\u606f\u4e0d\u591f\u201d\uff09\uff0c\u8868\u73b0\u51fa\u5bf9\u6280\u80fd\u63d0\u5347\u7684\u5174\u8da3\u548c\u884c\u52a8\u529b\u3002\u5bf9\u9500\u552e\u9f13\u52b1\u6709\u79ef\u6781\u53cd\u9988\uff08\u201c\u5f88\u5e78\u8fd0\u54e6\uff0c\u60f3\u505a\u4e00\u4ef6\u4e8b\u7684\u65f6\u5019\u80fd\u78b0\u5230\u5f88\u597d\u7684\u5b66\u59d0\u201d\uff09\u3002\n    *   **\u8d1f\u5411\u4fe1\u53f7/\u6a21\u7cca\u70b9**\uff1a\u672a\u660e\u786e\u8868\u8fbe\u5b66\u4e60\u76ee\u7684\uff08\u5174\u8da3\u3001\u526f\u4e1a\u3001\u8f6c\u884c\uff1f\uff09\u3002\u5bf9\u53d8\u73b0\u3001\u63a5\u5355\u7b49\u9500\u552e\u5f15\u5bfc\uff08\u201c\u8eab\u517c\u6570\u804c\u201d\u3001\u201c\u7b2c\u4e00\u6876\u91d1\u201d\uff09\u6709\u56de\u5e94\u4f46\u672a\u8868\u73b0\u72c2\u70ed\u3002**\u52a8\u673a\u66f4\u504f\u5411\u5174\u8da3\u63a2\u7d22\u548c\u6280\u80fd\u5b66\u4e60\uff0c\u53d8\u73b0\u52a8\u673a\u88ab\u9500\u552e\u5f15\u5bfc\u4f46\u672a\u663e\u6027\u5f3a\u70c8**\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931)**\n    *   **\u65f6\u95f4\u8d44\u6e90**\uff1a\u7528\u6237\u8868\u793a\u201c\u665a\u4e0a\u65f6\u95f4\u6bd4\u8f83\u591a\u201d\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u53ef\u652f\u914d\u65f6\u95f4\u3002\n    *   **\u8d22\u52a1\u8d44\u6e90**\uff1a**\u5173\u952e\u7f3a\u5931**\u3002\u652f\u4ed82380\u5143\u7684\u8fc7\u7a0b\u65e0\u963b\u529b\u63cf\u8ff0\uff0c\u4f46\u65e0\u6cd5\u5224\u65ad\u5176\u7ecf\u6d4e\u627f\u53d7\u529b\u4e0e\u8bfe\u7a0b\u4ef7\u683c\u7684\u5339\u914d\u5ea6\u3002\n    *   **\u8bbe\u5907/\u73af\u5883\u8d44\u6e90**\uff1a\u672a\u63d0\u53ca\uff0c\u4fe1\u606f\u7f3a\u5931\u3002\n    *   **\u7ecf\u9a8c\u8d44\u6e90**\uff1a\u65b0\u624b\uff0c\u5904\u4e8e\u201c\u521d\u770b\u6709\u5ff5\u7a3f\u611f\u201d\u3001\u201c\u6c14\u606f\u4e0d\u591f\u201d\u7684\u521d\u5b66\u9636\u6bb5\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d-\u9ad8\u4fe1\u53f7)**\n    *   **\u97e7\u6027**\uff1a\u79ef\u6781\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\u3001\u63a5\u53d7\u70b9\u8bc4\u5e76\u5c1d\u8bd5\u6539\u8fdb\uff08\u201c\u6211\u518d\u8bd5\u8bd5\u611f\u89c9\u4e00\u4e0b\u201d\uff09\u3002\u9762\u5bf9\u56f0\u96be\uff08\u6c14\u606f\u4e0d\u8db3\uff09\u6709\u8ba4\u77e5\u5e76\u6301\u7eed\u7ec3\u4e60\u3002\n    *   **\u670d\u4ece\u6027/\u4fe1\u4efb\u611f**\uff1a\u9ad8\u3002\u5168\u7a0b\u914d\u5408\u9500\u552e\u8282\u594f\uff0c\u6309\u65f6\u5b8c\u6210\u5404\u9879\u4efb\u52a1\uff08\u6668\u7ec3\u3001\u542c\u8bfe\u3001\u4f5c\u4e1a\u3001\u76f4\u64ad\uff09\uff0c\u5bf9\u9500\u552e\u201c\u5e26\u4f60\u5165\u884c\u201d\u7684\u627f\u8bfa\u8868\u793a\u4fe1\u4efb\u548c\u611f\u8c22\u3002\n    *   **\u81ea\u4e3b\u6027**\uff1a\u4e2d\u7b49\u3002\u4f1a\u4e3b\u52a8\u53cd\u9988\u7ec3\u4e60\u611f\u53d7\uff0c\u4f46\u51b3\u7b56\u4e0a\u9ad8\u5ea6\u8ddf\u968f\u9500\u552e\u5f15\u5bfc\uff08\u4ece\u5b66\u4e60\u5230\u62a5\u540d\uff09\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u7528\u6237\u5df2\u652f\u4ed82380\u5143\uff08\u201c\u662f\u8fd9\u4e2a\u5417\u201d\u5e76\u622a\u56fe\uff09\uff0c**\u5df2\u5b8c\u6210\u652f\u4ed8**\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u7f3a\u5931**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u6216\u914d\u5076\u610f\u89c1\u3002\n*   **\u6b65\u9aa41\uff1a\u52a8\u673a\u7eaf\u5ea6**\uff1a**B\u7c7b\uff08\u4e2d\u7b49\uff09**\u3002\u6709\u5b66\u4e60\u884c\u52a8\u548c\u5174\u8da3\uff0c\u4f46\u6df1\u5c42\u52a8\u673a\uff08\u5c24\u5176\u662f\u53d8\u73b0\u9884\u671f\uff09\u4e0d\u6e05\u6670\uff0c\u6613\u53d7\u5916\u90e8\u5f15\u5bfc\u3002\n*   **\u6b65\u9aa42\uff1a\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u5f52\u4e3aC\u7c7b\uff08\u98ce\u9669\u4e0d\u786e\u5b9a\uff09**\u3002\u6709\u65f6\u95f4\uff0c\u4f46\u8d22\u52a1\u57fa\u7840\u3001\u5bb6\u5ead\u652f\u6301\u672a\u77e5\uff0c\u5b58\u5728\u98ce\u9669\u76f2\u533a\u3002\n*   **\u6b65\u9aa43\uff1a\u5fc3\u7406\u5f39\u6027**\uff1a**A\u7c7b\uff08\u9ad8\uff09**\u3002\u914d\u5408\u5ea6\u9ad8\uff0c\u5b66\u4e60\u6001\u5ea6\u79ef\u6781\uff0c\u6297\u632b\u610f\u613f\u53ef\u89c1\u3002\n*   **\u7efc\u5408\u5224\u5b9a**\uff1a**B-C-A\u578b\u7528\u6237**\u3002\u9ad8\u914d\u5408\u3001\u6709\u884c\u52a8\u529b\uff0c\u4f46\u52a8\u673a\u9700\u6f84\u6e05\uff0c\u8d44\u6e90\u5e95\u5ea7\u5b58\u5728\u91cd\u5927\u4fe1\u606f\u7f3a\u53e3\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b\uff1aT3 \u52e4\u594b\u8ddf\u968f\u7740**\u3002\n    *   \u6838\u5fc3\u7279\u5f81\uff1a\u6267\u884c\u529b\u5f3a\uff0c\u670d\u4ece\u5f15\u5bfc\uff0c\u79ef\u6781\u5b8c\u6210\u6307\u5b9a\u4efb\u52a1\uff0c\u5bfb\u6c42\u660e\u786e\u6307\u5bfc\u548c\u6b63\u5411\u53cd\u9988\u3002\n    *   \u8868\u73b0\uff1a\u5168\u7a0b\u7d27\u8ddf\u9500\u552e\u5e03\u7f6e\u7684\u201c\u6668\u7ec3-\u542c\u8bfe-\u4f5c\u4e1a-\u76f4\u64ad\u201d\u95ed\u73af\uff0c\u5bf9\u201c\u5b66\u59d0\u201d\u7684\u9f13\u52b1\u548c\u6307\u5bfc\u6709\u5f3a\u70c8\u6b63\u53cd\u9988\uff08\u201c\u8c22\u8c22\u5b66\u59d0\u9f13\u52b1\u201d\u3001\u201c\u597d\u6ef4\u597d\u6ef4\u201d\uff09\u3002\n    *   **\u504f\u5dee\u63d0\u793a**\uff1a\u7f3a\u4e4fT3\u901a\u5e38\u4f34\u968f\u7684\u660e\u786e\u76ee\u6807\uff08\u5982\u201c\u8d5a\u5916\u5feb\u8865\u8d34\u5bb6\u7528\u201d\uff09\uff0c\u52a8\u673a\u66f4\u504f\u6a21\u7cca\u7684\u5174\u8da3\u63a2\u7d22\uff0c\u9700\u8b66\u60d5\u540e\u7eed\u52a8\u529b\u8870\u51cf\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4e2d)\n\u9010\u9879\u6392\u67e57\u5927\u6839\u56e0\uff1a\n1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u81ea\u8eab\u95ee\u9898\uff08\u5ff5\u7a3f\u611f\u3001\u6c14\u606f\uff09\u6709\u8ba4\u77e5\uff0c\u82e5\u540e\u7eed\u5b66\u4e60\u65e0\u6cd5\u660e\u663e\u6539\u5584\uff0c\u6613\u4ea7\u751f\u843d\u5dee\u3002\n2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u9ad8\u98ce\u9669**\u3002**\u5173\u952e\u4fe1\u606f\u7f3a\u5931**\u3002\u652f\u4ed8\u8fc7\u7a0b\u987a\u7545\u4e0d\u4ee3\u8868\u65e0\u538b\u529b\uff0c\u9700\u8b66\u60d5\u5bb6\u5ead\u53cd\u5bf9\u6216\u9690\u6027\u8d1f\u503a\u3002\n3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u663e\u793a\u665a\u4e0a\u6709\u65f6\u95f4\uff0c\u914d\u5408\u5ea6\u9ad8\u3002\n4.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u9ad8\u98ce\u9669**\u3002**\u4fe1\u606f\u5b8c\u5168\u7f3a\u5931**\uff0c\u662f\u6700\u5927\u98ce\u9669\u70b9\u3002\n5.  **\u9500\u552e\u8bef\u5bfc**\uff1a**\u4e2d\u98ce\u9669**\u3002\u9500\u552e\u5b58\u5728**\u8fc7\u5ea6\u627f\u8bfa\u503e\u5411**\uff08\u201c\u5e26\u4f60\u5165\u884c\u201d\u3001\u201c\u6211\u5f80\u671f\u5b66\u751f...\u65f6\u85aa\u4e00\u6b65\u6b65\u6765\u201d\u3001\u201c\u7ed9\u4f60\u6311\u4e86\u4e00\u672c\u7248\u6743\u4e66\u540d\u989d\u5df2\u5360\u4e0b\u201d\uff09\uff0c\u53ef\u80fd\u62d4\u9ad8\u7528\u6237\u53d8\u73b0\u9884\u671f\u3002**\u6b64\u4e3a\u5173\u952e\u96f7\u533a**\u3002\n6.  **\u5185\u5bb9\u8d28\u91cf\u4e0d\u6ee1**\uff1a**\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u548c\u70b9\u8bc4\u53cd\u9988\u79ef\u6781\u3002\n7.  **\u670d\u52a1\u4f53\u9a8c\u4e0d\u4f73**\uff1a**\u4f4e\u98ce\u9669**\u3002\u4e0e\u9500\u552e\u4e92\u52a8\u826f\u597d\uff0c\u5173\u7cfb\u878d\u6d3d\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5408\u89c4\u95ee\u9898**\uff1a\n    *   **\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u6a21\u7cca\u5316\u6536\u76ca**\uff1a\u9500\u552e\u591a\u6b21\u63d0\u53ca\u201c\u5feb\u901f\u6323\u5230\u7b2c\u4e00\u6876\u91d1\u201d\u3001\u201c20+\u591a\u79cd\u8d5a\u94b1\u5c97\u4f4d\u201d\u3001\u201c\u65f6\u85aa90-500\u201d\u7b49\uff0c\u53ef\u80fd\u6784\u6210\u5bf9\u884c\u4e1a\u6536\u5165\u6c34\u5e73\u7684**\u5938\u5927\u6216\u6a21\u7cca\u63cf\u8ff0**\uff0c\u672a\u5145\u5206\u5f3a\u8c03\u4e2a\u4eba\u52aa\u529b\u3001\u5929\u8d4b\u548c\u5e02\u573a\u7ade\u4e89\u7684\u4e0d\u786e\u5b9a\u6027\u3002\n    *   **\u8425\u9020\u7a00\u7f3a\u4e0e\u7d27\u8feb\u611f**\uff1a\u4f7f\u7528\u201c\u6700\u540e\u4e00\u6b21\u8003\u6838\u201d\u3001\u201c\u660e\u5929\u6c47\u603b\u540d\u5355\u201d\u3001\u201c\u540d\u989d\u5df2\u5360\u4e0b\u201d\u3001\u201c\u73b0\u573a\u53d1\u4f18\u60e0\u5238\u201d\u7b49\u8bdd\u672f\uff0c\u7b26\u5408\u9500\u552e\u8282\u594f\uff0c\u4f46\u9700\u6ce8\u610f\u8fb9\u754c\u3002\n    *   **\u60c5\u611f\u7ed1\u5b9a**\uff1a\u4f7f\u7528\u201c\u5a18\u5bb6\u4eba\u201d\u3001\u201c\u770b\u597d\u4f60\u201d\u3001\u201c\u5e26\u4f60\u201d\u7b49\u8bdd\u672f\u5efa\u7acb\u4fe1\u4efb\uff0c\u5c5e\u5e38\u89c1\u7b56\u7565\uff0c\u4f46\u9700\u540e\u7eed\u670d\u52a1\u627f\u63a5\u3002\n*   **\u4f26\u7406\u9632\u7ebf**\uff1a\u672a\u53d1\u73b0\u6076\u610f\u6b3a\u9a97\u3001\u4f2a\u9020\u8d44\u8d28\u7b49\u7ea2\u7ebf\u95ee\u9898\u3002\u4f46**\u5b58\u5728\u62d4\u9ad8\u9884\u671f\u3001\u5f31\u5316\u5b66\u4e60\u96be\u5ea6\u7684\u98ce\u9669**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**\uff1a**\u5339\u914d**\u3002\u7528\u6237\u6709\u5b66\u4e60\u884c\u52a8\u529b\uff0c\u9002\u5408\u9700\u8981\u8ddf\u7ec3\u3001\u53cd\u9988\u7684\u7cfb\u7edf\u8bfe\u7a0b\u3002\u4f46\u9700\u5173\u6ce8\u5176\u6a21\u7cca\u52a8\u673a\u4e0e\u8bfe\u7a0b\u53d8\u73b0\u5bfc\u5411\u7684\u957f\u671f\u5951\u5408\u5ea6\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**24h\u5185\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\u4e0e\u652f\u4ed8\u80fd\u529b**\n*   **\u5177\u4f53\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9996\u8981\u98ce\u63a7**\uff1a\u73ed\u4e3b\u4efb\u9996\u8054\u5fc5\u987b\u6e29\u548c\u63a2\u8be2\u652f\u4ed8\u51b3\u7b56\u8fc7\u7a0b\uff08\u201c\u548c\u5bb6\u4eba\u5546\u91cf\u8fc7\u5417\uff1f\u201d\u3001\u201c\u8fd9\u7b14\u5b66\u8d39\u5bf9\u60a8\u6765\u8bf4\u538b\u529b\u5927\u5417\uff1f\u201d\uff09\uff0c**\u8865\u5168\u5bb6\u5ead\u51b3\u7b56\u6743\u4e0e\u8d22\u52a1\u5b89\u5168\u4fe1\u606f**\u3002\n    2.  **\u52a8\u673a\u6f84\u6e05\u4e0e\u9884\u671f\u7ba1\u7406**\uff1a\u5728\u9996\u6b21\u5b66\u4e60\u89c4\u5212\u6c9f\u901a\u4e2d\uff0c\u5f15\u5bfc\u7528\u6237\u660e\u786e\u5b66\u4e60\u521d\u5fc3\uff08\u5174\u8da3/\u526f\u4e1a/\u804c\u4e1a\uff1f\uff09\uff0c\u5e76**\u6821\u6b63\u53d8\u73b0\u9884\u671f**\uff0c\u5f3a\u8c03\u6280\u80fd\u79ef\u7d2f\u5468\u671f\u548c\u884c\u4e1a\u73b0\u5b9e\uff0c\u5c06\u9500\u552e\u7aef\u7684\u201c\u673a\u4f1a\u63cf\u8ff0\u201d\u8f6c\u5316\u4e3a\u5b66\u4e60\u7aef\u7684\u201c\u80fd\u529b\u5efa\u8bbe\u8def\u5f84\u201d\u3002\n    3.  **\u5f3a\u5316\u6b63\u5411\u53cd\u9988**\uff1a\u8be5\u7528\u6237\u5bf9\u9f13\u52b1\u654f\u611f\uff0c\u73ed\u4e3b\u4efb\u5e94\u5ef6\u7eed\u201c\u5b66\u59d0\u201d\u7684\u9f13\u52b1\u98ce\u683c\uff0c\u53ca\u65f6\u8ba4\u53ef\u5176\u4f5c\u4e1a\u548c\u8fdb\u6b65\uff0c\u5de9\u56fa\u5176\u5b66\u4e60\u4e60\u60ef\u3002\n    4.  **\u6301\u7eed\u89c2\u5bdf**\uff1a\u5bc6\u5207\u5173\u6ce8\u7528\u6237\u8fdb\u5165\u7cfb\u7edf\u8bfe\u540e\u7684\u4f5c\u4e1a\u5b8c\u6210\u8d28\u91cf\u4e0e\u79ef\u6781\u6027\u53d8\u5316\uff0c\u9632\u8303\u56e0\u52a8\u673a\u4e0d\u7eaf\u6216\u9884\u671f\u843d\u5dee\u5bfc\u81f4\u7684\u52a8\u529b\u8870\u51cf\u3002\n\n{\"core_type\": \"T3 \u52e4\u594b\u8ddf\u968f\u7740\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u5339\u914d\", \"action\": \"24h\u5185\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\u4e0e\u652f\u4ed8\u80fd\u529b\"}";
