    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n## \u4fe1\u606f\u4e0d\u8db3\u58f0\u660e\n\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e\u3002\u7f3a\u5931\u5173\u952e\u4fe1\u606f\uff1a**\u652f\u4ed8\u91d1\u989d\u3001\u5177\u4f53\u4ea7\u54c1\u540d\u79f0\u3001\u7528\u6237\u804c\u4e1a\u4e0e\u6536\u5165\u8be6\u60c5\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u660e\u786e\u4fe1\u53f7**\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49)**\n    *   **\u8868\u5c42**\uff1a\u5bf9AI\u5199\u4f5c\u3001\u77ed\u5267/\u5c0f\u8bf4\u521b\u4f5c\u6709\u804c\u4e1a\u5174\u8da3\uff08\u4e3b\u4e1a\u5ba3\u4f20\u7247\uff0c\u670b\u53cb\u60f3\u505a\u6f2b\u5267\uff09\uff0c\u5bfb\u6c42\u6280\u80fd\u63d0\u5347\u4e0e\u53d8\u73b0\u53ef\u80fd\u3002\n    *   **\u6df1\u5c42**\uff1a**\u5b58\u5728\u5bf9\u9500\u552e\u4e2a\u4eba\uff08\u963f\u5200\uff09\u7684\u5f3a\u70c8\u597d\u611f\u4e0e\u60c5\u611f\u8054\u7ed3**\uff08\u591a\u6b21\u79f0\u8d5e\u3001\u8be2\u95ee\u79c1\u4eba\u8054\u7cfb\u65b9\u5f0f\u3001\u8868\u8fbe\u201c\u559c\u6b22\u963f\u5200\u201d\uff09\uff0c**\u51b3\u7b56\u4e2d\u201c\u4eba\u201d\u7684\u56e0\u7d20\u53ef\u80fd\u8d85\u8fc7\u201c\u8bfe\u7a0b\u5185\u5bb9\u201d\u672c\u8eab**\u3002\u5bf9\u201c\u8e29\u8fc7\u5751\u201d\u6709\u63d0\u53ca\uff0c\u6709\u4e00\u5b9a\u8b66\u60d5\u6027\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u672a\u77e5/\u4e2d\u7b49\u504f\u4f4e)**\n    *   **\u7ecf\u6d4e**\uff1a\u4e3b\u52a8\u8be2\u95ee\u5206\u671f\uff08\u82b1\u5457\uff09\uff0c**\u6697\u793a\u4e00\u6b21\u6027\u652f\u4ed8\u80fd\u529b\u53ef\u80fd\u6709\u9650**\u3002\u5bf9\u4ef7\u683c\u654f\u611f\uff0c\u5c1d\u8bd5\u8bae\u4ef7\uff08\u201c\u5185\u90e8\u4ef7\u201d\uff09\u3002\n    *   **\u65f6\u95f4**\uff1a\u80fd\u5b8c\u6210\u8bad\u7ec3\u8425\u4f5c\u4e1a\u3001\u8ddf\u5b8c\u5168\u7a0b\u76f4\u64ad\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u53ef\u652f\u914d\u65f6\u95f4\u3002\n    *   **\u80fd\u529b**\uff1a\u4e3b\u4e1a\u4e3a\u5ba3\u4f20\u7247\u521b\u4f5c\uff0c\u5177\u5907\u4e00\u5b9a\u5185\u5bb9\u521b\u4f5c\u57fa\u7840\u3002\u5bf9AI\u5de5\u5177\uff08\u5982DeepSeek\uff09\u6709\u5e94\u7528\u610f\u8bc6\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u7b49)**\n    *   **\u97e7\u6027**\uff1a\u80fd\u575a\u6301\u5b8c\u6210\u8bad\u7ec3\u8425\u4efb\u52a1\uff0c\u5bf9\u5b66\u4e60\u6709\u57fa\u672c\u8010\u5fc3\u3002\n    *   **\u98ce\u9669\u610f\u8bc6**\uff1a\u4e3b\u52a8\u8be2\u95ee\u9000\u8d39\u653f\u7b56\uff08\u201c\u4e2d\u9014\u89c9\u5f97\u8bfe\u7a0b\u6ca1\u6709\u60f3\u8c61\u4e2d\u597d\u53ef\u4ee5\u9000\u4e00\u90e8\u5206\u6b3e\u662f\u5427\u201d\uff09\uff0c**\u663e\u793a\u5176\u5bf9\u4ea4\u4ed8\u7ed3\u679c\u6709\u9884\u8bbe\u671f\u5f85\uff0c\u4e14\u5bf9\u98ce\u9669\u6709\u9632\u8303\u610f\u8bc6**\u3002\n    *   **\u81ea\u4e3b\u6027**\uff1a\u5bf9\u8bfe\u7a0b\u5185\u5bb9\uff08\u957f\u6587\u5c0f\u8bf4\u8bfe\uff09\u6709\u4e3b\u52a8\u8be2\u95ee\u548c\u5174\u8da3\u63a2\u7d22\uff0c\u975e\u5b8c\u5168\u88ab\u52a8\u63a5\u53d7\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u5df2\u652f\u4ed8\uff08\u201c\u652f\u4ed8\u6210\u529f\u5566\u201d\uff09\uff0c\u4f46\u91d1\u989d\u672a\u77e5\u3002\u652f\u4ed8\u65b9\u5f0f\u4e3a\u82b1\u5457\u5206\u671f\uff0c**\u8d22\u52a1\u538b\u529b\u4fe1\u53f7**\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u65e0\u660e\u786e\u5bb6\u5ead\u89d2\u8272\u6216\u9700\u4e0e\u4ed6\u4eba\u5546\u91cf\u7684\u8868\u8ff0\uff0c**\u6682\u89c6\u4e3a\u72ec\u7acb\u51b3\u7b56**\uff0c\u4f46\u7f6e\u4fe1\u5ea6\u4e0d\u8db3\u3002\n*   **\u6b65\u9aa41-4\u5224\u5b9a**\uff1a\n    *   \u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5b66\u4e60\u610f\u5411\u548c\u8bfe\u7a0b\u5185\u5bb9\u63a2\u7d22\uff08A\u7c7b\u7279\u5f81\uff09\u3002\n    *   \u4f46\u5bf9\u4ef7\u683c\u654f\u611f\u3001\u5173\u6ce8\u9000\u8d39\u653f\u7b56\uff0c\u4e14**\u652f\u4ed8\u4f9d\u8d56\u5206\u671f**\uff0c\u5b58\u5728\u8d44\u6e90\u7ea6\u675f\uff08B/C\u7c7b\u7279\u5f81\uff09\u3002\n    *   **\u6838\u5fc3\u77db\u76fe**\uff1a\u52a8\u673a\u4e2d\u63ba\u6742\u4e86\u5bf9\u9500\u552e\u4eba\u5458\u7684\u4e2a\u4eba\u60c5\u611f\u4f9d\u8d56\uff0c\u800c\u975e\u7eaf\u7cb9\u5bf9\u8bfe\u7a0b\u4ef7\u503c\u7684\u8ba4\u53ef\u3002\n    *   **\u5224\u5b9a\u7ed3\u679c**\uff1a**B\u7c7b\uff08\u6447\u6446\u578b-\u8d44\u6e90\u654f\u611f\u578b\uff09**\u3002\u7528\u6237\u6709\u9700\u6c42\uff0c\u4f46\u51b3\u7b56\u53d7\u4ef7\u683c\u548c\u60c5\u611f\u53cc\u91cd\u56e0\u7d20\u5f71\u54cd\uff0c\u4e14\u652f\u4ed8\u80fd\u529b\u5b58\u7591\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**\uff1a**T4 \u7cbe\u660e\u52a1\u5b9e\u578b** \u4e0e **T7 \u5173\u7cfb\u4f9d\u8d56\u578b** \u6df7\u5408\u7279\u5f81\u3002\n    *   **T4\u7279\u5f81**\uff1a\u5173\u6ce8\u53d8\u73b0\u8def\u5f84\u3001\u8be2\u95ee\u8bfe\u7a0b\u7ec6\u8282\uff08\u5468\u671f\u3001\u8bfe\u65f6\uff09\u3001\u7d22\u8981\u989d\u5916\u798f\u5229\uff08\u201c\u8585\u7f8a\u6bdb\u201d\uff09\u3001\u660e\u786e\u8be2\u95ee\u9000\u8d39\u653f\u7b56\uff0c\u4f53\u73b0\u7cbe\u6253\u7ec6\u7b97\u4e0e\u98ce\u9669\u63a7\u5236\u3002\n    *   **T7\u7279\u5f81**\uff1a**\u4e0e\u9500\u552e\u5efa\u7acb\u8d85\u8d8a\u5546\u4e1a\u5173\u7cfb\u7684\u60c5\u611f\u4e92\u52a8**\uff08\u5938\u8d5e\u8010\u5fc3\u3001\u8be2\u95ee\u5e74\u9f84\u3001\u8981\u79c1\u4eba\u53f7\u3001\u8868\u8fbe\u559c\u6b22\uff09\uff0c\u51b3\u7b56\u53ef\u80fd\u9ad8\u5ea6\u4f9d\u8d56\u4e0e\u201c\u963f\u5200\u201d\u7684\u4e2a\u4eba\u4fe1\u4efb\u5173\u7cfb\u3002\n*   **\u6700\u7ec8\u5224\u5b9a**\uff1a**\u504fT7\u5173\u7cfb\u4f9d\u8d56\u578b**\u3002\u56e0\u60c5\u611f\u8054\u7ed3\u5728\u5bf9\u8bdd\u4e2d\u5360\u636e\u663e\u8457\u5730\u4f4d\uff0c\u4e14\u53ef\u80fd\u6210\u4e3a\u5176\u514b\u670d\u4ef7\u683c\u654f\u611f\u3001\u5b8c\u6210\u652f\u4ed8\u7684\u5173\u952e\u52a8\u56e0\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u98ce\u9669\u7b49\u7ea7**\uff1a**\u4e2d\u504f\u9ad8**\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u201c\u8e29\u5751\u201d\u6709\u8bb0\u5fc6\uff0c\u5bf9\u7ed3\u679c\u6709\u671f\u5f85\u3002\u82e5\u540e\u7eed\u8bfe\u7a0b\u6216\u53d8\u73b0\u7ed3\u679c\u4e0d\u53ca\u9500\u552e\uff08\u963f\u5200\uff09\u5851\u9020\u7684\u9884\u671f\u6216\u627f\u8bfa\uff0c\u6781\u6613\u5f15\u53d1\u5931\u671b\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u4e2d\u98ce\u9669**\u3002\u4f7f\u7528\u82b1\u5457\u5206\u671f\uff0c\u7ecf\u6d4e\u7f13\u51b2\u7a7a\u95f4\u5c0f\uff0c\u4efb\u4f55\u751f\u6d3b\u53d8\u52a8\u90fd\u53ef\u80fd\u5f15\u53d1\u9000\u8d39\u8bc9\u6c42\u3002\n    3.  **\u60c5\u611f\u8054\u7ed3\u65ad\u88c2**\uff1a**\u9ad8\u98ce\u9669**\u3002**\u8fd9\u662f\u672c\u6848\u4f8b\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u7528\u6237\u56e0\u201c\u963f\u5200\u201d\u800c\u62a5\u540d\uff0c\u4f46\u5f00\u8425\u540e\u5bf9\u63a5\u73ed\u4e3b\u4efb\u66f4\u6362\u4e3a\u201c\u601d\u601d\u201d\u3002\u82e5\u60c5\u611f\u8854\u63a5\u4e0d\u5f53\uff0c\u7528\u6237\u53ef\u80fd\u4ea7\u751f\u201c\u88ab\u629b\u5f03\u611f\u201d\uff0c\u4ee5\u201c\u8bfe\u7a0b\u4e0d\u597d\u201d\u4e3a\u501f\u53e3\u8981\u6c42\u9000\u8d39\u3002\n    4.  **\u65f6\u95f4\u51b2\u7a81**\uff1a\u4f4e\u98ce\u9669\u3002\u76ee\u524d\u65f6\u95f4\u6295\u5165\u5ea6\u5c1a\u53ef\u3002\n    5.  **\u5185\u5bb9\u8d28\u91cf**\uff1a\u4e2d\u98ce\u9669\u3002\u53d6\u51b3\u4e8e\u5b9e\u9645\u8bfe\u7a0b\u4ea4\u4ed8\u4e0e\u5ba3\u4f20\u7684\u5339\u914d\u5ea6\u3002\n    6.  **\u9500\u552e\u627f\u8bfa\u672a\u5151\u73b0**\uff1a**\u4e2d\u98ce\u9669**\u3002\u9500\u552e\u627f\u8bfa\u201c\u957f\u7bc7\u5199\u4f5c\u8bfe\u641e\u5b9a\u201d\u3001\u201c4999\u4ea4\u7ed9\u6211\u201d\u3001\u201c\u5de5\u4f5c\u5ba4\u8d44\u6e90\u201d\uff0c\u82e5\u540e\u7eed\u672a\u6e05\u6670\u5151\u73b0\uff0c\u4f1a\u6210\u6295\u8bc9\u7406\u7531\u3002\n    7.  **\u5e73\u53f0\u4f53\u9a8c**\uff1a\u4f4e\u98ce\u9669\u3002\u5df2\u51fa\u73b0\u201c\u5151\u6362\u7801\u65e0\u6548\u201d\u7684\u521d\u671f\u4f53\u9a8c\u95ee\u9898\uff0c\u4f46\u88ab\u53ca\u65f6\u54cd\u5e94\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u9500\u552e\u884c\u4e3a**\uff1a\n    *   **\u5408\u89c4\u70b9**\uff1a\u8bf4\u660e\u4e86\u5b66\u4e60\u9700\u8981\u4ed8\u51fa\u3001\u975e\u8eba\u5e73\uff0c\u63d0\u53ca\u4e86\u9000\u8d39\u653f\u7b56\u3002\n    *   **\u98ce\u9669\u70b9**\uff1a\n        1.  **\u8fc7\u5ea6\u60c5\u611f\u6295\u5165**\uff1a\u9500\u552e\uff08\u963f\u5200\uff09\u4e0e\u7528\u6237\u8fdb\u884c\u4e86\u5927\u91cf\u79c1\u4eba\u5316\u3001\u975e\u8bfe\u7a0b\u76f8\u5173\u7684\u804a\u5929\uff08\u5e74\u9f84\u3001\u804c\u4e1a\u3001\u5938\u8d5e\uff09\uff0c**\u6a21\u7cca\u4e86\u5546\u4e1a\u670d\u52a1\u8fb9\u754c**\u3002\n        2.  **\u627f\u8bfa\u6a21\u7cca**\uff1a\u201c\u957f\u7bc7\u5199\u4f5c\u8bfe\u6211\u53ef\u4ee5\u5e2e\u4f60\u641e\u5b9a\u201d\u3001\u201c4999\u4ea4\u7ed9\u6211\u201d\u3001\u201c\u6240\u6709\u8d44\u6e90\u90fd\u5171\u4eab\u201d\uff0c**\u5b58\u5728\u627f\u8bfa\u8fc7\u5ea6\u4e14\u4e0d\u5177\u4f53\u7684\u98ce\u9669**\u3002\n        3.  **\u201c\u5de5\u4f5c\u5ba4\u201d\u5f15\u5bfc**\uff1a\u63d0\u53ca\u4e2a\u4eba\u5de5\u4f5c\u5ba4\u548c\u989d\u5916\u8d44\u6e90\uff0c**\u5b58\u5728\u5c06\u516c\u53f8\u7528\u6237\u5bfc\u5411\u79c1\u4eba\u6e20\u9053\u7684\u6f5c\u5728\u98ce\u9669**\u3002\n*   **\u4f26\u7406\u8b66\u793a**\uff1a**\u9500\u552e\u5229\u7528\u4e2a\u4eba\u9b45\u529b\u4fc3\u6210\u4ea4\u6613\uff0c\u5efa\u7acb\u4e86\u4e0d\u7a33\u5b9a\u7684\u60c5\u611f\u951a\u70b9\uff0c\u4e3a\u540e\u7eed\u670d\u52a1\u57cb\u4e0b\u91cd\u5927\u9690\u60a3**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6838\u5fc3\u7b56\u7565**\uff1a**\u5e73\u7a33\u627f\u63a5\u60c5\u611f\u4f9d\u8d56\uff0c\u5feb\u901f\u5efa\u7acb\u4e13\u4e1a\u4fe1\u4efb\uff0c\u5f3a\u5316\u8bfe\u7a0b\u4ef7\u503c\u611f\u77e5\u3002**\n*   **\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u65e0\u7f1d\u4ea4\u63a5**\uff1a\u73ed\u4e3b\u4efb\u201c\u601d\u601d\u201d\u9700\u7b2c\u4e00\u65f6\u95f4\u4e3b\u52a8\u8054\u7cfb\uff0c**\u660e\u786e\u544a\u77e5\u201c\u963f\u5200\u5e08\u59d0\u5df2\u5c06\u60a8\u7684\u60c5\u51b5\u8be6\u7ec6\u8f6c\u544a\u6211\uff0c\u6211\u4f1a\u63a5\u529b\u670d\u52a1\u201d**\uff0c\u4f20\u9012\u5ef6\u7eed\u6027\u3002\n    2.  **\u60c5\u611f\u951a\u5b9a\u8f6c\u79fb**\uff1a\u521d\u671f\u6c9f\u901a\u53ef\u9002\u5ea6\u63d0\u53ca\u201c\u963f\u5200\u5e08\u59d0\u4e5f\u5f88\u5173\u5fc3\u4f60\u7684\u5b66\u4e60\u8fdb\u5c55\u201d\uff0c\u4f46\u8fc5\u901f\u5c06\u91cd\u70b9\u8f6c\u5411\u201c\u6211\u4f5c\u4e3a\u4f60\u7684\u73ed\u4e3b\u4efb\uff0c\u5c06\u5982\u4f55\u5177\u4f53\u5e2e\u52a9\u4f60\u5b66\u4e60\u3001\u6539\u7a3f\u3001\u5bf9\u63a5\u8d44\u6e90\u201d\u3002\n    3.  **\u5f3a\u5316\u4ef7\u503c\u4ea4\u4ed8**\uff1a\u5bc6\u5207\u5173\u6ce8\u5176\u4f5c\u4e1a\u4e0e\u4e92\u52a8\uff0c\u7ed9\u4e88**\u5177\u4f53\u3001\u7ec6\u81f4\u3001\u8d85\u51fa\u9884\u671f\u7684\u70b9\u8bc4\u4e0e\u9f13\u52b1**\uff0c\u7528\u4e13\u4e1a\u80fd\u529b\u66ff\u4ee3\u60c5\u611f\u4f9d\u8d56\u3002\n    4.  **\u7ba1\u7406\u9884\u671f**\uff1a\u6e05\u6670\u8bf4\u660e\u8bfe\u7a0b\u80fd\u5e26\u6765\u7684\u5177\u4f53\u6280\u80fd\u3001\u6295\u7a3f\u6e20\u9053\uff0c\u907f\u514d\u5938\u5927\u6536\u76ca\u3002\u5bf9\u5176\u5173\u6ce8\u7684\u201c\u957f\u6587\u5c0f\u8bf4\u8bfe\u201d\u7b49\u798f\u5229\uff0c\u9700\u660e\u786e\u5151\u73b0\u89c4\u5219\u548c\u65f6\u95f4\u3002\n    5.  **\u98ce\u9669\u76d1\u63a7**\uff1a\u5c06\u5176\u5217\u4e3a\u91cd\u70b9\u5173\u6000\u5bf9\u8c61\uff0c\u5b9a\u671f\u79c1\u804a\u4e86\u89e3\u5b66\u4e60\u611f\u53d7\uff0c\u5c24\u5176\u5173\u6ce8\u5f00\u8425\u521d\u671f\u53ca\u9500\u552e\u627f\u8bfa\u798f\u5229\u5151\u73b0\u65f6\u7684\u60c5\u7eea\u53d8\u5316\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**\uff1a\n    *   \u7528\u6237\u5df2\u62a5\u540d\u201c\u65d7\u8230\u73ed\u201d\uff08\u542b\u77ed\u6545\u4e8b+\u77ed\u5267\uff09\u3002\n    *   **\u540e\u7eed\u6302\u8f7d**\uff1a\u53ef\u89c2\u5bdf\u5176\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u7684\u5174\u8da3\u504f\u5411\uff08\u77ed\u6545\u4e8b/\u77ed\u5267/\u957f\u6587\uff09\uff0c\u5728\u8bfe\u7a0b\u540e\u671f\u63a8\u8350**\u8fdb\u9636\u7684\u5782\u76f4\u54c1\u7c7b\u8bad\u7ec3\u8425\uff08\u5982\u7206\u6b3e\u77ed\u5267\u7f16\u5267\u8425\u3001\u957f\u7bc7\u7f51\u6587\u5b75\u5316\u8425\uff09**\uff0c\u4f46\u9700\u57fa\u4e8e\u5176\u5b66\u4e60\u6210\u679c\u548c\u660e\u786e\u610f\u5411\uff0c\u907f\u514d\u8fc7\u5ea6\u63a8\u9500\u3002\n\n{\"core_type\": \"T7 \u5173\u7cfb\u4f9d\u8d56\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\u504f\u9ad8\", \"maslow_need\": \"\u5f52\u5c5e\u4e0e\u7231/\u5c0a\u91cd\", \"target_product_line\": \"AI\u5199\u4f5c\u65d7\u8230\u73ed\uff08\u5df2\u62a5\uff09\uff0c\u540e\u7eed\u53ef\u89c2\u5bdf\u6302\u8f7d\u5782\u76f4\u8fdb\u9636\u8425\", \"age\": \"32\u5c81\uff081992\u5e74\uff09\", \"gender\": \"\u7537\", \"city\": \"\u672a\u77e5\uff08\u63d0\u53ca\u82cf\u5dde\u7fa4\u53cb\uff0c\u4f46\u672c\u4eba\u672a\u660e\u786e\uff09\"}";
