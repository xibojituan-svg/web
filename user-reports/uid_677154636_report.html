    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677154636 (\u6635\u79f0\uff1a\u65f6\u5149) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-06 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6728\u69ff9(\u5218\u7f8e) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u77ed\u89c6\u9891\u8bfe\u7a0b (\u610f\u5411\u4ef7\u683c\uff1a3980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3** (\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u6709\u5de5\u4f5c\uff0c\u665a\u4e0a\u6709\u996d\u5c40\uff0c\u9700\u517c\u987eMBA\u8bba\u6587) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3** (\u672a\u63d0\u53ca) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** (\u7528\u6237\u4e3b\u52a8\u900f\u9732\u4e86\u804c\u4e1a\u3001\u5b66\u5386\u3001\u5b66\u4e60\u52a8\u673a\u3001\u672a\u6765\u89c4\u5212\u7b49\u5173\u952e\u4fe1\u606f) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **[\u2b06\u9ad8]**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u957f\u8fdc\u53d1\u5c55\u800c\u6765\uff0c\u6709\u6e05\u6670\u7684\u81ea\u6211\u89c4\u5212\uff0c\u4e0d\u8ffd\u6c42\u77ed\u671f\u66b4\u5bcc\u3002\u52a8\u673a\u517c\u5177\u201c\u5b89\u5168\u9700\u6c42\u201d\uff08\u9632\u5931\u4e1a\uff09\u4e0e\u201c\u81ea\u6211\u5b9e\u73b0\u201d\uff08\u63a2\u7d22\u65b0\u6280\u80fd\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n    > \u201c\u6211\u662f\u60f3\u627e\u4e2a\u526f\u4e1a\u7559\u4e2a\u540e\u624b\uff0c\u73b0\u5728\u5de5\u4f5c\u7684\u884c\u4e1a\u662f\u5915\u9633\u884c\u4e1a\u4e2d\u7684\u5915\u9633\u884c\u4e1a\uff0c\u867d\u7136\u662f\u56fd\u4f01\uff0c\u4f46\u672a\u6765\u4e5f\u6709\u5931\u4e1a\u7684\u98ce\u9669\u201d\n    > \u201c\u77ed\u671f\u5185\u6211\u91cd\u70b9\u662f\u505a\u8d26\u53f7\uff0c\u5982\u679c\u8d26\u53f7\u7684\u5185\u5bb9\u6570\u636e\u8fbe\u5230\u9884\u671f\uff0c\u540e\u7eed\u4f1a\u5411\u77ed\u5267\u548c\u5546\u5355\u65b9\u5411\u53d1\u5c55\u201d\n    > \u201c\u6211\u672a\u6765\u7684\u8ba1\u5212\u662f\u5148\u81ea\u5df1\u505a\u7740\u8bd5\u8bd5\u770b\uff0c\u770b\u770b\u81ea\u5df1\u662f\u4e0d\u662f\u90a3\u5757\u513f\u6599\u513f\uff0c\u5982\u679c\u505a\u7684\u8fd8\u884c\u5c31\u8003\u8651\u53d8\u73b0\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **[\u27a1\u4e2d]**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u4e2d]** \u2014 \u80fd\u8003\u86513980\u5143\u8bfe\u7a0b\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\uff0c\u4f46MBA\u5728\u8bfb\u53ef\u80fd\u6709\u4e00\u5b9a\u652f\u51fa\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**[\u4e2d]** \u2014 \u6709\u5168\u804c\u5de5\u4f5c\uff08\u56fd\u4f01\uff09\uff0c\u540c\u65f6\u653b\u8bfbMBA\uff08\u5373\u5c06\u7b54\u8fa9\uff09\uff0c\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\uff0c\u9700\u201c\u6478\u9c7c\u201d\u5b66\u4e60\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u4fe1\u606f\u4e0d\u8db3]** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **[\u2b06\u9ad8]**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u6c9f\u901a\u7406\u6027\u3001\u76ee\u6807\u660e\u786e\uff0c\u80fd\u6e05\u6670\u8868\u8fbe\u81ea\u5df1\u7684\u65f6\u95f4\u5b89\u6392\u548c\u89c4\u5212\uff0c\u672a\u8868\u73b0\u51fa\u4efb\u4f55\u7126\u8651\u3001\u81ea\u5351\u6216\u4f9d\u8d56\u60c5\u7eea\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n    > \u201c\u53d1\u7ed9\u6211\u5c31\u884c\uff0c\u6682\u65f6\u63a5\u4e0d\u4e86\u7535\u8bdd\u201d (\u76f4\u63a5\u3001\u9ad8\u6548)\n    > \u201c\u7ea6\u7684\u662f\u5565\u8bfe\u7a0b\uff0c\u521a\u63a5\u4e86\u4e2a\u7535\u8bdd\uff0c\u56de\u6765\u770b\u5230\u6709\u4e2a\u9884\u7ea6\u94fe\u63a5\u5c31\u70b9\u4e86[\u6342\u8138]\u201d (\u5766\u8bda\u6c9f\u901a)\n    > \u201c\u6211\u770b\u5427\uff0c\u665a\u4e0a\u662f\u4e2a\u7c7b\u4f3c\u996d\u5c40\u7684\u6d3b\u52a8[\u6342\u8138]\u201d (\u4e3b\u52a8\u8bf4\u660e\u60c5\u51b5\uff0c\u4e0d\u627e\u501f\u53e3)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**[ \u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 ]** \u4e0e **[ \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]** \u7684\u590d\u5408\u4f53\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u73b0\u6709\u804c\u4e1a\uff08\u5915\u9633\u884c\u4e1a\u56fd\u4f01\uff09\u672a\u6765\u7a33\u5b9a\u6027\u7684\u6df1\u5c42\u7126\u8651\uff0c\u5bb3\u6015\u88ab\u65f6\u4ee3\u6dd8\u6c70\uff0c\u9700\u8981\u4e00\u4efd\u80fd\u62b5\u5fa1\u98ce\u9669\u7684\u201c\u540e\u624b\u201d\u548c\u65b0\u7684\u80fd\u529b\u589e\u957f\u70b9\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u4e13\u4e1a\u8def\u5f84\u89c4\u5212\u5e08\u201d\u4e0e\u201c\u9760\u8c31\u7684\u526f\u4e1a\u4f19\u4f34\u201d**\u3002\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u6267\u884c\u7684\u6280\u80fd\u6210\u957f\u8def\u5f84\u548c\u8d44\u6e90\u5bf9\u63a5\uff0c\u6ee1\u8db3\u5176\u201c\u5b89\u5168\u4e0a\u5cb8\u201d\u548c\u201c\u81ea\u6211\u7cbe\u8fdb\u201d\u7684\u53cc\u91cd\u9700\u6c42\uff0c\u800c\u975e\u7b80\u5355\u7684\u60c5\u7eea\u5b89\u629a\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u9ad8\u52a8\u673a\u3001\u4e2d\u7b49\u8d44\u6e90\u3001\u9ad8\u5f39\u6027) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u8a00\u8bba\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u672a\u63d0\u53ca\u5bb6\u5ead\uff0c\u98ce\u9669\u672a\u77e5\u4f46\u4e0d\u9ad8\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **MBA\u8bba\u6587\u7b54\u8fa9\uff085\u6708\u4e2d\u65ec\uff09\u4e0e\u8bfe\u7a0b\u5b66\u4e60\u65f6\u95f4\u51b2\u7a81\uff0c\u53ef\u80fd\u5bfc\u81f4\u524d\u671f\u65e0\u6cd5\u8ddf\u4e0a\u8fdb\u5ea6\uff0c\u4ea7\u751f\u79ef\u538b\u548c\u632b\u8d25\u611f\u3002** |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u7406\u6027\u52a1\u5b9e\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u95ee\u9898\u60c5\u7eea\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u5bf9\u53d8\u73b0\u5468\u671f\u6709\u7406\u6027\u8ba4\u77e5\uff08\u201c\u5148\u505a\u8d26\u53f7\u770b\u6570\u636e\u201d\uff09\uff0c\u975e\u6025\u529f\u8fd1\u5229\u578b\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u81f35\u6708\u4e2d\u65ec\u8bba\u6587\u7b54\u8fa9\u7ed3\u675f\u524d**\u3002\u6b64\u671f\u95f4\u82e5\u8bfe\u7a0b\u4efb\u52a1\u91cf\u4e0e\u5176\u5b66\u4e1a\u51b2\u7a81\uff0c\u4e14\u672a\u5f97\u5230\u59a5\u5584\u7684\u65f6\u95f4\u5b89\u6392\u652f\u6301\uff0c\u53ef\u80fd\u56e0\u201c\u65e0\u6cd5\u517c\u987e\u201d\u800c\u4ea7\u751f\u9000\u610f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u65f6\u5149\u540c\u5b66\u4f60\u597d\uff0c\u770b\u5230\u4f60\u6b63\u5728\u51c6\u5907MBA\u7b54\u8fa9\uff0c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u4e00\u6d41\u3002\u54b1\u4eec\u7684\u8bfe\u7a0b\u8bbe\u8ba1\u672c\u8eab\u5c31\u8003\u8651\u4e86\u5728\u804c\u5b66\u4e60\u7684\u8282\u594f\uff0c\u6709\u56de\u653e\u548c\u7075\u6d3b\u7684\u4f5c\u4e1a\u63d0\u4ea4\u65f6\u95f4\u3002\u6211\u4f1a\u6839\u636e\u4f60\u7684\u65f6\u95f4\u8868\uff0c\u5e2e\u4f60\u89c4\u5212\u4e00\u4e2a\u2018\u8bba\u6587\u51b2\u523a\u671f\u7279\u4f9b\u2019\u5b66\u4e60\u8ba1\u5212\uff0c\u786e\u4fdd\u4f60\u7b54\u8fa9\u3001\u5b66\u4e60\u4e24\u4e0d\u8bef\u3002\u54b1\u4eec\u7684\u76ee\u6807\u662f\u7a33\u624e\u7a33\u6253\uff0c\u6784\u5efa\u957f\u671f\u7ade\u4e89\u529b\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** (\u4ea7\u54c1\u7ebfA)\u3002\u5339\u914d\u5176\u9ad8\u52a8\u673a\u548c\u7406\u6027\u89c4\u5212\uff0c\u63d0\u4f9b\u624e\u5b9e\u7684\u6280\u80fd\u6559\u5b66\u548c\u6e05\u6670\u7684\u8fdb\u9636\u8def\u5f84\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\u7684\u7279\u70b9\uff0c\u8865\u5145 **\u3010\u7075\u6d3b\u5b66\u4e60\u652f\u6301\u5305\u3011**\uff08\u5982\u91cd\u70b9\u77e5\u8bc6\u5207\u7247\u3001\u53ef\u5ef6\u8fdf\u7684\u4f5c\u4e1a\u6279\u6539\u7a97\u53e3\uff09\u3002\u9488\u5bf9\u5176\u957f\u8fdc\u89c4\u5212\uff0c\u53ef\u9002\u65f6\u5f15\u5165 **\u3010\u8d44\u6e90\u5bf9\u63a5\u4e0e\u9879\u76ee\u5b9e\u6218\u5305\u3011**\uff08B\u6a21\u5757\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u6700\u540e\u540d\u989d\u201d\u3001\u201c\u9650\u65f6\u4f18\u60e0\u201d\u7b49\u5236\u9020\u7126\u8651\u7684\u8bdd\u672f\u903c\u5355\uff1b\u5728\u5176\u8bba\u6587\u7b54\u8fa9\u671f\u95f4\u65bd\u52a0\u8fc7\u91cd\u7684\u5b66\u4e60\u538b\u529b\u6216\u9891\u7e41\u50ac\u4fc3\uff1b\u5c06\u5176\u5f53\u4f5c\u201c\u5c0f\u767d\u201d\u8fdb\u884c\u8fc7\u5ea6\u57fa\u7840\u7684\u6559\u5b66\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u56e0\u5176\u76ee\u6807\u660e\u786e\u3001\u51b3\u7b56\u7406\u6027\uff0c\u5728\u8bc1\u660e\u8bfe\u7a0b\u4ef7\u503c\u540e\uff0c\u53ef\u4ee5\u63a8\u8350\u66f4\u9ad8\u9636\u7684\u8bfe\u7a0b\u6216\u670d\u52a1\u5305\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u662f\u60f3\u627e\u4e2a\u526f\u4e1a\u7559\u4e2a\u540e\u624b\uff0c\u73b0\u5728\u5de5\u4f5c\u7684\u884c\u4e1a\u662f\u5915\u9633\u884c\u4e1a\u4e2d\u7684\u5915\u9633\u884c\u4e1a\uff0c\u867d\u7136\u662f\u56fd\u4f01\uff0c\u4f46\u672a\u6765\u4e5f\u6709\u5931\u4e1a\u7684\u98ce\u9669\u201d\n2. > \u201c\u77ed\u671f\u5185\u6211\u91cd\u70b9\u662f\u505a\u8d26\u53f7\uff0c\u5982\u679c\u8d26\u53f7\u7684\u5185\u5bb9\u6570\u636e\u8fbe\u5230\u9884\u671f\uff0c\u540e\u7eed\u4f1a\u5411\u77ed\u5267\u548c\u5546\u5355\u65b9\u5411\u53d1\u5c55\u201d\n3. > \u201c\u6211\u672a\u6765\u7684\u8ba1\u5212\u662f\u5148\u81ea\u5df1\u505a\u7740\u8bd5\u8bd5\u770b\uff0c\u770b\u770b\u81ea\u5df1\u662f\u4e0d\u662f\u90a3\u5757\u513f\u6599\u513f\uff0c\u5982\u679c\u505a\u7684\u8fd8\u884c\u5c31\u8003\u8651\u53d8\u73b0\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u62b5\u5fa1\u804c\u4e1a\u98ce\u9669\u7684\u5b89\u5168\u611f\u4e0e\u5b9e\u73b0\u6280\u80fd\u7a81\u7834\u7684\u81ea\u6211\u4ef7\u503c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u9ad8\u5ea6\u7075\u6d3b\u3001\u5c0a\u91cd\u5176\u65f6\u95f4\u89c4\u5212\u7684\u5b66\u4e60\u65b9\u6848\uff0c\u5e76\u626e\u6f14\u4e13\u4e1a\u7684\u201c\u526f\u4e1a\u89c4\u5212\u5e08\u201d\u89d2\u8272\uff0c\u5e2e\u52a9\u5176\u5e73\u7a33\u5ea6\u8fc75\u6708\u4e2d\u65ec\u7684\u8bba\u6587\u7b54\u8fa9\u51b2\u7a81\u671f\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\uff08\u4ea7\u54c1\u7ebfA\uff09\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
