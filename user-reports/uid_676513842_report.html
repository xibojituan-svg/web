        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676513842 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-11 \u81f3 2026-03-07 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u559c\u64ad\u963f\u7d2b |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u672a\u660e\u786e\u8d2d\u4e70\u3002\u9500\u552e\u63a8\u9001\u4e86\u591a\u4e2a\u4f4e\u4ef7/\u514d\u8d39\u5f15\u6d41\u8bfe\uff08AI\u81ea\u5a92\u4f53\u53d8\u73b0\u7b51\u5c40\u842539.9\u5143\u3001AI\u6f2b\u5267\u7279\u8bad9.9\u5143\u3001\u5404\u7c7b\u914d\u97f3/\u5199\u4f5c\u4f53\u9a8c\u8bfe\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u65e0\u4efb\u4f55\u652f\u4ed8\u884c\u4e3a\u6216\u652f\u4ed8\u80fd\u529b\u8ba8\u8bba\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u65e0\u4efb\u4f55\u65f6\u95f4\u3001\u5de5\u4f5c\u3001\u751f\u6d3b\u72b6\u6001\u63cf\u8ff0\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u65e0\u4efb\u4f55\u5bb6\u5ead\u5173\u7cfb\u6216\u51b3\u7b56\u80cc\u666f\u63d0\u53ca\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u7528\u6237\u4ec5\u57282026-02-17\u56de\u590d\u201c\u5728\u5417\u201d\uff0c\u5176\u4f59\u5747\u4e3a\u9500\u552e\u5355\u5411\u63a8\u9001\u3002\u65e0\u6cd5\u83b7\u53d6\u7528\u6237\u4efb\u4f55\u4e3b\u52a8\u8868\u8fbe\u7684\u9700\u6c42\u3001\u80cc\u666f\u3001\u8d44\u6e90\u6216\u60c5\u7eea\u4fe1\u53f7\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u2753\u65e0\u6cd5\u8bc4\u7ea7]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u7528\u6237\u672a\u8868\u8fbe\u4efb\u4f55\u5b66\u4e60\u6216\u53d8\u73b0\u52a8\u673a\u3002\u9500\u552e\u8bdd\u672f\u4ee5\u201c\u65f6\u85aa200/300/900\u5143\u201d\u3001\u201c\u5feb\u901f\u53d8\u73b0\u201d\u3001\u201c\u62a2\u5360\u84dd\u6d77\u201d\u7b49\u5f3a\u7ed3\u679c\u627f\u8bfa\u4e3a\u4e3b\uff0c\u4f46\u65e0\u6cd5\u5224\u65ad\u7528\u6237\u662f\u5426\u88ab\u5438\u5f15\u6216\u771f\u5b9e\u9700\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> *\u7528\u6237\u65e0\u76f8\u5173\u8868\u8fbe\u3002*\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2753\u65e0\u6cd5\u8bc4\u7ea7]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u65e0\u6cd5\u8bc4\u7ea7] \u2014 \u65e0\u4fe1\u606f\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u65e0\u6cd5\u8bc4\u7ea7] \u2014 \u65e0\u4fe1\u606f\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u65e0\u6cd5\u8bc4\u7ea7] \u2014 \u65e0\u4fe1\u606f\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2753\u65e0\u6cd5\u8bc4\u7ea7]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u7528\u6237\u672a\u8868\u8fbe\u4efb\u4f55\u60c5\u7eea\u3001\u632b\u6298\u6216\u4f9d\u8d56\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> *\u7528\u6237\u65e0\u76f8\u5173\u8868\u8fbe\u3002*\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u65e0\u6cd5\u5b9a\u4f4d** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad**\u3002\u4ec5\u6709\u4e00\u6b21\u201c\u5728\u5417\u201d\u7684\u4e92\u52a8\uff0c\u65e0\u6cd5\u63a8\u65ad\u5176\u6df1\u5c42\u9700\u6c42\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad**\u3002\u5f53\u524d\u9636\u6bb5\u9700\u901a\u8fc7\u6709\u6548\u7834\u51b0\uff0c\u6fc0\u53d1\u5176\u8868\u8fbe\u6b32\uff0c\u624d\u80fd\u5b9a\u4f4d\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **[\u26a0\ufe0f \u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u5b9a]** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **[\u26a0\ufe0f \u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u5f52\u4e3a T8 \u6f5c\u6c34\u5403\u74dc\u578b]** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1] (\u57fa\u4e8e\u73b0\u6709\u4fe1\u606f\uff0c\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u7b49\u7ea2\u7ebf)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | [\u65e0\u6cd5\u8bc4\u4f30] | \u4fe1\u606f\u7f3a\u5931 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | [\u65e0\u6cd5\u8bc4\u4f30] | \u4fe1\u606f\u7f3a\u5931 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | [\u65e0\u6cd5\u8bc4\u4f30] | \u4fe1\u606f\u7f3a\u5931 |\n| \u6536\u76ca\u843d\u5dee\u578b | **[\u9ad8]** | **\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa\u201c\u65f6\u85aa900\u201d\u3001\u201c\u84dd\u6d77\u66b4\u5229\u201d\uff0c\u82e5\u7528\u6237\u56e0\u6b64\u4ed8\u8d39\uff0c\u5f00\u8bfe\u540e\u53d1\u73b0\u65e0\u6cd5\u5feb\u901f\u8fbe\u5230\u9884\u671f\uff0c\u6781\u6613\u56e0\u201c\u6536\u76ca\u843d\u5dee\u201d\u66b4\u6012\u9000\u8d39\u3002** |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u82e5\u5176\u56e0\u9ad8\u6536\u76ca\u627f\u8bfa\u4ed8\u8d39\uff0c\u5219\u5f00\u8bfe\u540e\u7b2c\u4e00\u5468\uff08\u53d1\u73b0\u65e0\u6cd5\u7acb\u5373\u63a5\u5355\u53d8\u73b0\u65f6\uff09\u4e3a\u6781\u9ad8\u5371\u671f\u3002**\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> **\uff08\u56e0\u4fe1\u606f\u7f3a\u5931\uff0c\u91c7\u7528\u6700\u5b89\u5168\u7684\u901a\u7528\u7834\u51b0\u8bdd\u672f\uff09**\n> \u201c\u770b\u5230\u60a8\u4e4b\u524d\u5173\u6ce8\u8fc7\u6211\u4eec\u7684AI\u548c\u914d\u97f3\u8bfe\u7a0b\uff0c\u4e00\u76f4\u6ca1\u673a\u4f1a\u6df1\u5165\u804a\u804a\u3002\u4eca\u5929\u4e3b\u8981\u662f\u60f3\u8ba4\u8bc6\u4e00\u4e0b\uff0c\u629b\u5f00\u6240\u6709\u8bfe\u7a0b\u548c\u53d8\u73b0\uff0c\u60a8\u6700\u8fd1\u662f\u5bf9\u54ea\u4e2a\u65b9\u5411\u66f4\u611f\u5174\u8da3\u4e00\u4e9b\u5462\uff1f\u6216\u8005\u751f\u6d3b\u4e2d\u6709\u4ec0\u4e48\u60f3\u7528\u65b0\u6280\u80fd\u53bb\u5b9e\u73b0\u7684\u5c0f\u76ee\u6807\u5417\uff1f\u968f\u4fbf\u804a\u804a\u5c31\u597d~\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a **[\u5174\u8da3\u63a2\u6d4b\u7ebf]**\u3002\u5728\u672a\u660e\u786e\u5176\u771f\u5b9e\u9700\u6c42\u524d\uff0c**\u4e25\u7981\u76f4\u63a5\u63a8\u9001\u9ad8\u5355\u4ef7\u8bfe\u7a0b\u6216\u505a\u51fa\u6536\u76ca\u627f\u8bfa**\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a \u65e0\u3002\u9996\u8981\u4efb\u52a1\u662f\u5b8c\u6210\u7528\u6237\u753b\u50cf\u8865\u5168\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7ee7\u7eed\u5355\u5411\u8f70\u70b8\u9ad8\u6536\u76ca\u5e7f\u544a**\u3002\u8fd9\u53ea\u4f1a\u5f3a\u5316\u5176\u201c\u5feb\u901f\u66b4\u5bcc\u201d\u7684\u9519\u8bef\u9884\u671f\uff0c\u4e3a\u540e\u7eed\u4ea4\u4ed8\u57cb\u4e0b\u5de8\u96f7\u3002\n    2. \u5728\u672a\u4e86\u89e3\u5176\u8d44\u6e90\u5e95\u5ea7\uff08\u65f6\u95f4\u3001\u8d44\u91d1\u3001\u5bb6\u5ead\uff09\u524d\uff0c\u63a8\u8350\u4efb\u4f55\u4ed8\u8d39\u8bfe\u7a0b\u3002\n    3. \u4f7f\u7528\u201c\u4fdd\u5e95\u201d\u3001\u201c\u8f7b\u677e\u8d5a\u201d\u7b49\u8bcd\u6c47\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5f53\u524d\u9636\u6bb5\u6838\u5fc3\u4efb\u52a1\u662f\u201c\u4fe1\u606f\u6536\u96c6\u201d\u4e0e\u201c\u4fe1\u4efb\u5efa\u7acb\u201d\uff0c\u800c\u975e\u8f6c\u5316\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > *\u3010\u7528\u6237\u3011: \u201c\u5728\u5417\u201d* \n2. > *\u3010\u9500\u552e - \u559c\u64ad\u963f\u7d2b\u3011: \u201c\ud83d\udcb0\u65f6\u85aa200\u7684\u5546\u5355\uff0c\u4f60\u8fd8\u5728\u72b9\u8c6b\u5417\uff1f\u201d*\n3. > *\u3010\u9500\u552e - \u559c\u64ad\u963f\u7d2b\u3011: \u201c\u5feb\uff01\u53d1\u73b0\u4e2a\u521a\u5192\u5934\u7684\u8d5a\u94b1\u673a\u4f1a\uff0c\u8d81\u8fd8\u6ca1\u706b\u8d77\u6765\u4f60\u771f\u5f97\u770b\u770b\uff01\ud83d\udd25\u201d*\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010\u4fe1\u606f\u9ed1\u6d1e\u578b\u6f5c\u5728T8\u3011**\uff0c\u9500\u552e\u5355\u5411\u63a8\u9001\u4e86\u5927\u91cf\u9ad8\u6536\u76ca\u627f\u8bfa\uff0c\u4f46\u7528\u6237\u51e0\u4e4e\u96f6\u53cd\u9988\u3002**\u9000\u5355\u51e0\u7387\u4e3a\u3010\u672a\u77e5\u4f46\u9690\u6027\u98ce\u9669\u6781\u9ad8\u3011**\uff0c\u56e0\u5176\u53ef\u80fd\u88ab\u5e7f\u544a\u5438\u5f15\u800c\u6765\uff0c\u6000\u6709\u4e0d\u5207\u5b9e\u9645\u7684\u53d8\u73b0\u9884\u671f\u3002\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7acb\u5373\u505c\u6b62\u5e7f\u544a\u8f70\u70b8\uff0c\u8f6c\u5411\u5f00\u653e\u5f0f\u3001\u4f4e\u538b\u529b\u7684\u4e00\u5bf9\u4e00\u6c9f\u901a\uff0c\u9996\u8981\u76ee\u6807\u662f\u8865\u5168\u7528\u6237\u753b\u50cf\u7684\u4e09\u8f74\u4fe1\u606f\u3011**\u3002\n\n```json\n{\"core_type\": \"\u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u5f52T8\u6f5c\u6c34\u5403\u74dc\u578b\", \"maslow_need\": \"\u65e0\u6cd5\u5b9a\u4f4d\", \"risk_level\": \"\u9ad8\", \"target_product_line\": \"\u5174\u8da3\u63a2\u6d4b\u7ebf\"}\n```";
