        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676191088 (\u6635\u79f0\uff1a\u83f2\u83f2\u5728\u559c\u64ad) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-15 \u81f3 2026-01-18 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5929\u5c71\u73ed\u73ed (\u80e1\u5efa\u534e)\u3001\u6211\u7231\u62db\u732b\u9017\u72d7 (\u4efb\u6d01) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u4fe1\u606f\u7f3a\u5931\uff08\u804a\u5929\u8bb0\u5f55\u4e3a\u8bfe\u7a0b\u4ea4\u4ed8\u4e2d\u540e\u671f\u9636\u6bb5\uff0c\u672a\u63d0\u53ca\u5177\u4f53\u8bfe\u7a0b\u4e0e\u4ef7\u683c\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u7f3a\u5931** |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u9ad8\u5bbd\u88d5**\uff08\u201c\u6211\u76ee\u524d\u65f6\u95f4\u8fd8\u662f\u5bcc\u88d5\u7684\u3002\u6bd5\u7adf\u4e0d\u7528\u4e0a\u73ed\u201d\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\uff08\u7f3a\u5931\u652f\u4ed8\u80fd\u529b\u3001\u5bb6\u5ead\u652f\u6301\u3001\u521d\u59cb\u62a5\u540d\u52a8\u673a\u7b49\u5173\u952e\u4fe1\u606f\uff0c\u4ec5\u80fd\u89c2\u5bdf\u5176\u5728\u5b66\u72b6\u6001\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34(\u4e2d)\u3002\u7528\u6237\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u5b66\u4e60\u4e0e\u5b9e\u8df5\u70ed\u60c5\uff0c\u4e3b\u52a8\u627f\u62c5\u591a\u4e2a\u5267\u7ec4\u7684\u540e\u671f\u3001\u5ba1\u542c\u3001\u5bf9\u8f68\u4efb\u52a1\uff0c\u5e76\u63d0\u53ca\u201c\u7b49\u8d5a\u4e86\u94b1\uff0c\u6211\u8981\u4e70\u4e00\u53f0\u8d85\u5f3a\u7535\u8111\u201d\uff0c\u663e\u793a\u51fa\u5c06\u6280\u80fd\u53d8\u73b0\u7684\u671f\u5f85\u3002\u4f46\u804a\u5929\u4e2d\u672a\u76f4\u63a5\u3001\u5f3a\u70c8\u5730\u8868\u8fbe\u201c\u5feb\u901f\u8d5a\u94b1\u201d\u7684\u6025\u8feb\u6027\uff0c\u66f4\u591a\u6c89\u6d78\u5728\u6280\u80fd\u7cbe\u8fdb\u548c\u9879\u76ee\u534f\u4f5c\u7684\u4e50\u8da3\u4e2d\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u7b49\u8d5a\u4e86\u94b1\uff0c\u6211\u8981\u4e70\u4e00\u53f0\u8d85\u5f3a\u7535\u8111\u3002\u8fd9\u592a\u803d\u8bef\u65f6\u95f4\u4e86\u3002[\u6342\u8138]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b06\u9ad8]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\u6216\u652f\u4ed8\u7ec6\u8282\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u2b06\u9ad8** \u2014 \u660e\u786e\u8868\u793a\u201c\u4e0d\u7528\u4e0a\u73ed\u201d\uff0c\u65f6\u95f4\u5bcc\u88d5\uff0c\u80fd\u4e3b\u52a8\u89c4\u5212\u5e76\u8d85\u524d\u5b8c\u6210\u5b66\u4e60\u4efb\u52a1\uff0c\u751a\u81f3\u4e3b\u52a8\u8981\u6c42\u66f4\u591a\u4efb\u52a1\uff08\u201c\u591a\u7ed9\u6211\u4e24\u96c6\u4e5f\u884c\u7684\u201d\uff09\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u4ec5\u63d0\u53ca\u513f\u5b50\u5728\u5bb6\u4f1a\u5f71\u54cd\u5de5\u4f5c\uff0c\u4f46\u672a\u8868\u660e\u5bb6\u4eba\u5bf9\u5b66\u4e60\u7684\u6001\u5ea6\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9762\u5bf9\u8f6f\u4ef6\u65e0\u58f0\u3001\u6587\u4ef6\u8bef\u5b58\u3001\u7535\u8111\u6b7b\u673a\u3001\u4efb\u52a1\u6df7\u4e71\u7b49\u5177\u4f53\u56f0\u96be\u65f6\uff0c\u4ee5\u5410\u69fd\u548c\u81ea\u5632\uff08\u201c\u6492\u6577\u6577\u7684\u201d\u3001\u201c\u5446\u840c\u201d\uff09\u4e3a\u4e3b\uff0c\u80fd\u5feb\u901f\u8c03\u6574\u7b56\u7565\u3001\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u65e0\u62b1\u6028\u6216\u4f9d\u8d56\u4ed6\u4eba\u5b89\u629a\u7684\u8ff9\u8c61\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u628a\u6240\u6709\u8fdb\u7a0b\u5168\u5173\u4e86\uff0c\u5e94\u7528\u4e5f\u5168\u5173\u4e86\u3002\u7136\u540e\u77ac\u95f4\u5c31\u89e3\u538b\u597d\u4e86[\u56e7]\u5dee\u70b9\u88ab\u8fd9\u73a9\u610f\u529d\u9000\u3002\u8981\u662f\u89e3\u538b\u4e00\u4e2a\u5b50\u6587\u4ef6\u90fd\u8981\u51e0\u4e2a\u5c0f\u65f6\u90a3\u6211\u5c31\u75af\u4e86[\u51b7\u6c57]\u62a2\u6551\u56de\u6765\u4e86\u3002\u73b0\u5728\u5f00\u59cb\u53ea\u80fd\u5355\u7ebf\u64cd\u4f5c\u4e86\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u81ea\u6211\u4ef7\u503c\u611f\u4e0e\u4e13\u4e1a\u80fd\u529b\u8ba4\u53ef\u7684\u5f3a\u70c8\u6e34\u6c42**\u3002\u5979\u901a\u8fc7\u4e3b\u52a8\u627f\u62c5\u6838\u5fc3\u4efb\u52a1\uff08\u540e\u671f\u3001\u5ba1\u542c\uff09\u3001\u5e2e\u52a9\u540c\u5b66\u3001\u8ffd\u6c42\u6548\u7387\uff08\u201c\u611f\u89c9\u81ea\u5df1\u73b0\u5728\u5f3a\u7684\u53ef\u6015\u201d\uff09\u3001\u4ee5\u53ca\u5bf9\u201c\u4e0d\u52a8\u8111\u5b50\u201d\u540c\u5b66\u7684\u9119\u5937\uff0c\u6765\u6784\u5efa\u81ea\u5df1\u5728\u5b66\u4e60\u793e\u7fa4\u4e2d\u7684\u201c\u9ad8\u624b\u201d\u8eab\u4efd\u548c\u5b58\u5728\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u8d4b\u4e88\u5176\u201c\u6838\u5fc3\u9aa8\u5e72\u201d\u6216\u201c\u4e13\u5bb6\u201d\u7684\u8eab\u4efd\u8ba4\u540c**\uff0c\u63d0\u4f9b\u66f4\u5177\u6311\u6218\u6027\u7684\u4efb\u52a1\u3001\u6280\u672f\u6307\u5bfc\u6743\u3001\u4ee5\u53ca\u5728\u793e\u7fa4\u4e2d\u516c\u5f00\u7684\u8ba4\u53ef\u4e0e\u8868\u626c\uff0c\u6ee1\u8db3\u5176\u88ab\u5c0a\u91cd\u548c\u5b9e\u73b0\u4e13\u4e1a\u62b1\u8d1f\u7684\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** \uff08\u9ad8\u8d44\u6e90\u5e95\u5ea7\u4e0e\u5fc3\u7406\u5f39\u6027\uff0c\u52a8\u673a\u7eaf\u5ea6\u4e2d\u7b49\u4f46\u5b66\u4e60\u884c\u4e3a\u9ad8\u5ea6\u6295\u5165\uff0c\u662f\u4f18\u8d28\u6f5c\u529b\u7528\u6237\uff09 |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T3 \u6b7b\u78d5\u5b66\u9738\u578b** \uff08\u6838\u5fc3\u7279\u5f81\uff1a\u4eab\u53d7\u5b66\u4e60\u4e0e\u7cbe\u8fdb\u8fc7\u7a0b\u672c\u8eab\uff0c\u8ffd\u6c42\u6280\u672f\u5b8c\u7f8e\u4e0e\u6548\u7387\uff0c\u81ea\u5f8b\u6027\u5f3a\uff0c\u5728\u793e\u7fa4\u4e2d\u626e\u6f14\u201c\u4f18\u7b49\u751f\u201d\u89d2\u8272\uff0c\u4e50\u4e8e\u52a9\u4eba\u5e76\u4ece\u4e2d\u83b7\u5f97\u6210\u5c31\u611f\u3002\uff09 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4f4e** | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u5f53\u524d\u9ad8\u6295\u5165\u72b6\u6001\u53ca\u201c\u4e0d\u7528\u4e0a\u73ed\u201d\u6697\u793a\u5bb6\u5ead\u963b\u529b\u53ef\u80fd\u8f83\u5c0f\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u65f6\u95f4\u5145\u88d5\uff0c\u81ea\u5f8b\u6027\u5f3a\uff0c\u4e3b\u52a8\u89c4\u5212\uff0c\u5d29\u76d8\u98ce\u9669\u6781\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u89e3\u51b3\u95ee\u9898\u5bfc\u5411\uff0c\u9047\u632b\u81ea\u5632\u800c\u975e\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u5bf9\u201c\u8d5a\u94b1\u6362\u7535\u8111\u201d\u6709\u671f\u5f85\uff0c\u82e5\u957f\u671f\u65e0\u5b9e\u8df5\u53d8\u73b0\u673a\u4f1a\u6216\u6e20\u9053\uff0c\u53ef\u80fd\u4ea7\u751f\u4ef7\u503c\u6000\u7591\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u8bfe\u7a0b\u7ed3\u675f\u540e1-3\u4e2a\u6708**\u3002\u82e5\u5b66\u6210\u540e\u65e0\u6cd5\u83b7\u5f97\u7b26\u5408\u5176\u9884\u671f\u7684\u5b9e\u8df5\u673a\u4f1a\u3001\u9879\u76ee\u63a8\u8350\u6216\u53d8\u73b0\u8def\u5f84\uff0c\u5176\u201c\u81ea\u6211\u5b9e\u73b0\u201d\u9700\u6c42\u53d7\u632b\uff0c\u53ef\u80fd\u5f15\u53d1\u5931\u671b\u60c5\u7eea\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u83f2\u83f2\uff0c\u770b\u4e86\u4f60\u7684\u5b66\u4e60\u8fdb\u5ea6\u548c\u5728\u5404\u5267\u7ec4\u7684\u6d3b\u8dc3\u8868\u73b0\uff0c\u73ed\u73ed\u89c9\u5f97\u4f60\u5df2\u7ecf\u662f\u54b1\u4eec\u73ed\u7684\u2018\u6280\u672f\u62c5\u5f53\u2019\u4e86\u3002\u540e\u7eed\u6709\u4e9b\u9ad8\u96be\u5ea6\u7684\u540e\u671f\u7edf\u7b79\u6216\u5ba1\u542c\u4efb\u52a1\uff0c\u6211\u7b2c\u4e00\u4e2a\u60f3\u5230\u7684\u5c31\u662f\u4f60\uff0c\u671f\u5f85\u4f60\u5e26\u7740\u5927\u5bb6\u4e00\u8d77\u98de\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011/\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf**\u3011\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T3\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a\u3010**\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743**\u3011\uff08\u5982\u4e0e\u8bb2\u5e081V1\u6280\u672f\u7b54\u7591\uff09\u3001\u3010**\u9879\u76ee\u5b9e\u6218\u5148\u950b\u5305**\u3011\uff08\u4f18\u5148\u83b7\u5f97\u5546\u4e1a\u6216\u9ad8\u96be\u5ea6\u5185\u90e8\u9879\u76ee\u5b9e\u8df5\u673a\u4f1a\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5c06\u5176\u89c6\u4e3a\u666e\u901a\u5b66\u5458\u8fdb\u884c\u673a\u68b0\u5316\u7fa4\u7ba1\u7406\uff1b\u7ed9\u5979\u5e03\u7f6e\u91cd\u590d\u6027\u3001\u65e0\u6311\u6218\u6027\u7684\u7b80\u5355\u4efb\u52a1\uff1b\u5ffd\u89c6\u5979\u5728\u6280\u672f\u8ba8\u8bba\u4e2d\u7684\u8d21\u732e\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u53ef\u5411\u5176\u63a8\u8350\u9ad8\u9636\u7684\u201c\u5927\u5e08\u73ed\u201d\u3001\u201c\u9879\u76ee\u5b9e\u6218\u8425\u201d\u6216\u201c\u5408\u4f19\u4eba\u8ba1\u5212\u201d\uff0c\u6ee1\u8db3\u5176\u5411\u4e13\u5bb6\u548c\u9886\u5bfc\u8005\u53d1\u5c55\u7684\u6df1\u5c42\u9700\u6c42\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u611f\u89c9\u81ea\u5df1\u73b0\u5728\u5f3a\u7684\u53ef\u6015\u54c8\u54c8\u54c8\u54c8\u54c8\u54c8\u201d\n2. > \u201c\u6211\u76ee\u524d\u65f6\u95f4\u8fd8\u662f\u5bcc\u88d5\u7684\u3002\u6bd5\u7adf\u4e0d\u7528\u4e0a\u73ed\u201d\n3. > \u201c\u90fd\u517b\u6210\u4e86\u4e0d\u52a8\u8111\u5b50\u7684\u4e60\u60ef...\u65e9\u665a\u88ab\u6dd8\u6c70\u4e86\u201d\uff08\u4f53\u73b0\u5bf9\u4e13\u4e1a\u6027\u7684\u9ad8\u8981\u6c42\u53ca\u4f18\u8d8a\u611f\uff09\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T3\u6b7b\u78d5\u5b66\u9738\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4f4e**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u6301\u7eed\u63d0\u4f9b\u6709\u6311\u6218\u6027\u7684\u4efb\u52a1\u548c\u201c\u6280\u672f\u6838\u5fc3\u201d\u7684\u8eab\u4efd\u8ba4\u53ef\uff0c\u5e76\u94fa\u57ab\u6e05\u6670\u7684\u8fdb\u9636\u53d8\u73b0\u8def\u5f84**\u3002\n\n```json\n{\"core_type\": \"T3 \u6b7b\u78d5\u5b66\u9738\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf/\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\"}\n```";
