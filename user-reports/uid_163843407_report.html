    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a163843407\uff08\u6635\u79f0\uff1a\u4f59\u4f73\uff09\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 163843407 / \u6635\u79f0\uff1a\u4f59\u4f73 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6e05\u626c(\u65b9\u4e91) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u77ed\u89c6\u9891\u526f\u4e1a\u57f9\u8bad\uff08\u610f\u5411\u4ef7\u683c\uff1a2980\u5143/2\u4e2a\u6708 \u6216 3980\u5143/3.5\u4e2a\u6708\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3**\uff08\u4e3b\u52a8\u8be2\u95ee\u5206\u671f\uff0c\u9500\u552e\u5efa\u8bae\u4f7f\u7528\u82b1\u5457/\u4fe1\u7528\u5361\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff088\u70b9\u540e\u4e0b\u73ed\uff0c\u901a\u52e4\u8def\u4e0a\u5b66\u4e60\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u672a\u77e5**\uff08\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u7528\u6237\u8868\u8fbe\u4e86\u660e\u786e\u7684\u5b66\u4e60\u52a8\u673a\u3001\u65f6\u95f4\u9650\u5236\u3001\u7ecf\u6d4e\u987e\u8651\u53ca\u5bf9\u672a\u6765\u7684\u89c4\u5212\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u5b66\u4e60\u76ee\u7684\u201c\u90fd\u6709\u201d\uff08\u5b66\u6280\u80fd+\u53d8\u73b0\uff09\uff0c\u4f46\u53d8\u73b0\u8bc9\u6c42\u975e\u5e38\u52a1\u5b9e\uff0c\u5173\u6ce8\u201c\u591a\u4e45\u80fd\u770b\u5230\u6548\u679c\u201d\u3001\u201c\u662f\u5426\u6709\u7a33\u5b9a\u63a5\u5355\u6e20\u9053\u201d\uff0c\u800c\u975e\u5e7b\u60f3\u77ed\u671f\u66b4\u5bcc\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u6bcf\u5929\u5982\u679c\u8bf4\u5b66\u4e60\u4e24\u4e2a\u5c0f\u65f6\uff0c\u6211\u5b66\u4e60\u8fdb\u5ea6\u5982\u679c\u6ca1\u6709\u90a3\u4e48\u597d\u7684\u8bdd\uff0c\u591a\u957f\u65f6\u95f4\u80fd\u770b\u5230\u4e00\u5b9a\u7684\u6548\u679c\u5462\u201d > \u201c\u6211\u6bd4\u8f83\u62c5\u5fc3\u7684\u5c31\u662f\uff0c\u6211\u540e\u671f\u5c31\u662f\u5982\u679c\u8bf4\u662f\u771f\u7684\u53bb\u505a\uff0c\u5c31\u662f\u6ca1\u6709\u8db3\u591f\u7684\u5355\u5b50\u53ef\u4ee5\u7ed9\u6211\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u4e3b\u52a8\u8be2\u95ee\u4ef7\u683c\uff0c\u5e76\u62c5\u5fc3\u201c\u5b66\u8d39\u592a\u8d35\u7684\u8bdd\uff0c\u6211\u4e0d\u4e00\u5b9a\u80fd\u8d1f\u62c5\u5f97\u8d77\u201d\uff0c\u4e14\u8be2\u95ee\u5206\u671f\u4ed8\u6b3e\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e** \u2014 \u660e\u786e\u8868\u793a\u201c\u6709\u65f6\u5019\u62118\u70b9\u8fc7\u624d\u4e0b\u73ed\u201d\uff0c\u5b66\u4e60\u65f6\u95f4\u9700\u5728\u901a\u52e4\uff08\u5730\u94c1\uff09\u548c\u4e0b\u73ed\u540e\u6324\u51fa\u6765\uff0c\u5c5e\u4e8e\u5178\u578b\u7684\u788e\u7247\u5316\u65f6\u95f4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u672a\u77e5** \u2014 \u4fe1\u606f\u7f3a\u5931\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u27a1\u4e2d**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a**\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u76f4\u64ad\u5361\u987f\uff09\u4f1a\u4e3b\u52a8\u53cd\u9988\u5e76\u5c1d\u8bd5\u89e3\u51b3\uff08\u9000\u51fa\u91cd\u8fdb\uff09\uff0c\u672a\u8868\u73b0\u51fa\u5d29\u6e83\u6216\u62b1\u6028\u3002\u5bf9\u672a\u6765\u6709\u62c5\u5fe7\uff0c\u4f46\u4ee5\u7406\u6027\u63d0\u95ee\u65b9\u5f0f\u5bfb\u6c42\u786e\u8ba4\uff0c\u800c\u975e\u60c5\u7eea\u5316\u5ba3\u6cc4\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u53ef\u80fd\u662f\u5728\u5730\u94c1\u91cc\u201d > \u201c\u5361\u4f4f\u4e86\u201d > \u201c\u9000\u51fa\u597d\u51e0\u6b21\u201d > \u201c\u80fd\u770b\u5230\u5f39\u5e55\u5728\u5237\u5c4f\uff0c\u4f46\u662f\u6ca1\u6709\u58f0\u97f3\uff0c\u7136\u540e\u89c6\u9891\u4e5f\u662f\u9ed1\u7684\u201d > \u201c\u55ef\u55ef\uff0c\u53ea\u6709\u8fd9\u6837\u4e86\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u4e3b\u4e1a\uff08\u5f53\u524d\u5de5\u4f5c\uff09\u672a\u6765\u7684\u4e0d\u5b89\u5168\u611f\uff0c\u4ee5\u53ca\u5bf9\u526f\u4e1a\u80fd\u5426\u6210\u529f\u3001\u80fd\u5426\u63d0\u4f9b\u7a33\u5b9a\u6536\u5165\u7684\u6df1\u5ea6\u7126\u8651\u3002\u4ed6\u9700\u8981\u7684\u662f\u4e00\u4e2a\u53ef\u9a8c\u8bc1\u3001\u6709\u4fdd\u969c\u7684\u201c\u7b2c\u4e8c\u6536\u5165\u7ba1\u9053\u201d\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u4e0e\u8def\u5f84\u611f**\u3002\u63d0\u4f9b\u6e05\u6670\u7684\u6210\u957f\u8def\u5f84\u3001\u53ef\u9884\u671f\u7684\u63a5\u5355\u65f6\u95f4\u3001\u4ee5\u53ca\u6709\u4fdd\u969c\u7684\u53d8\u73b0\u6e20\u9053\uff0c\u6bd4\u4efb\u4f55\u9f13\u52b1\u90fd\u91cd\u8981\u3002\u9700\u8981\u6210\u4e3a\u4ed6\u201c\u526f\u4e1a\u89c4\u5212\u5e08\u201d\u7684\u89d2\u8272\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u8bba** (\u52a1\u5b9e\u53d8\u73b0\u9a71\u52a8\u578b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 **\u5b89\u5168\u672a\u89e6\u53d1** (\u4f46\u9700\u9ad8\u5ea6\u8b66\u60d5)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u7528\u6237\u5df2\u8868\u73b0\u51fa\u7ecf\u6d4e\u538b\u529b\uff08\u62c5\u5fc3\u5b66\u8d39\u3001\u8be2\u95ee\u5206\u671f\uff09\uff0c\u4f46\u5c1a\u672a\u89e6\u53ca\u501f\u8d37\u62a5\u540d\u6216\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\u3002**\u9700\u5728\u8f6c\u5316\u524d\u8fdb\u884c\u4e25\u683c\u7684\u9884\u671f\u7ba1\u7406\u548c\u652f\u4ed8\u65b9\u5f0f\u6478\u5e95\uff0c\u4e25\u9632\u5176\u56e0\u7ecf\u6d4e\u538b\u529b\u6216\u53d8\u73b0\u671f\u671b\u843d\u7a7a\u800c\u9000\u8d39\u3002**\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u7ecf\u6d4e\u538b\u529b\u53ef\u80fd\u610f\u5473\u7740\u5bb6\u5ead\u8d22\u52a1\u7d27\u5f20\uff0c\u82e5\u4e3a\u9690\u7792\u62a5\u540d\uff0c\u98ce\u9669\u8f83\u9ad8\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u5176\u201c8\u70b9\u540e\u4e0b\u73ed\u201d\u7684\u788e\u7247\u5316\u65f6\u95f4\u4e0e\u56fa\u5b9a\u76f4\u64ad\u8bfe\uff08\u665a8\u70b9\uff09\u5b58\u5728\u51b2\u7a81\uff0c\u6781\u6613\u56e0\u5de5\u4f5c\u7e41\u5fd9\u3001\u901a\u52e4\u52b3\u7d2f\u5bfc\u81f4\u8bfe\u7a0b\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u3001\u5b66\u4e0d\u4f1a\u201d\u7684\u632b\u8d25\u611f\u548c\u81ea\u8d23\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u4ece\u5e94\u5bf9\u76f4\u64ad\u5361\u987f\u7684\u8868\u73b0\u770b\uff0c\u7528\u6237\u5fc3\u7406\u5f39\u6027\u5c1a\u53ef\uff0c\u975e\u60c5\u7eea\u5de8\u5a74\u7c7b\u578b\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u7528\u6237\u5bf9\u53d8\u73b0\u6e20\u9053\u548c\u5355\u91cf\u4fdd\u969c\u6781\u4e3a\u5173\u6ce8\uff08\u53cd\u590d\u786e\u8ba4\uff09\u3002\u82e5\u5b66\u4e60\u540e\u65e0\u6cd5\u5728\u9884\u671f\u65f6\u95f4\u5185\uff08\u4ed6\u8be2\u95ee\u4e86\u201c\u591a\u957f\u65f6\u95f4\u80fd\u770b\u5230\u4e00\u5b9a\u7684\u6548\u679c\u201d\uff09\u83b7\u5f97\u63a5\u5355\u673a\u4f1a\u6216\u6536\u5165\uff0c\u5c06\u76f4\u63a5\u89e6\u53d1\u201c\u865a\u5047\u5ba3\u4f20\u201d\u611f\u77e5\uff0c\u5bfc\u81f4\u5f3a\u70c8\u9000\u8d39\u8bc9\u6c42\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u5b66\u4e60\u96be\u5ea6\u589e\u52a0\uff0c\u82e5\u65f6\u95f4\u51b2\u7a81\u5bfc\u81f4\u8bfe\u7a0b\u79ef\u538b\uff0c\u4e14\u672a\u770b\u5230\u4efb\u4f55\u53d8\u73b0\u5e0c\u671b\uff0c\u9000\u8d39\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4f59\u4f73\u540c\u5b66\uff0c\u770b\u5230\u4f60\u7ecf\u5e38\u4e0b\u73ed\u6bd4\u8f83\u665a\u8fd8\u575a\u6301\u5b66\u4e60\uff0c\u771f\u7684\u5f88\u4f69\u670d\u4f60\u7684\u884c\u52a8\u529b\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u8003\u8651\u5230\u5927\u5bb6\u65f6\u95f4\u4e0d\u4e00\uff0c\u6240\u6709\u76f4\u64ad\u90fd\u6709\u56de\u653e\uff0c\u4f5c\u4e1a\u63d0\u4ea4\u65f6\u95f4\u4e5f\u5f88\u7075\u6d3b\u3002**\u4f60\u7684\u6838\u5fc3\u76ee\u6807\u5f88\u6e05\u6670\u2014\u2014\u5b66\u6280\u80fd\u3001\u63a5\u5355\u5b50\u3002** \u6211\u7684\u4efb\u52a1\u5c31\u662f\u5e2e\u4f60\u628a\u8fd9\u6761\u8def\u634b\u987a\uff0c\u4ece\u7b2c\u4e00\u4efd\u4f5c\u4e1a\u5230\u7b2c\u4e00\u7b14\u6536\u5165\uff0c\u54b1\u4eec\u4e00\u6b65\u6b65\u7a33\u624e\u7a33\u6253\u3002\u8fc7\u7a0b\u4e2d\u6709\u4efb\u4f55\u65f6\u95f4\u5b89\u6392\u6216\u64cd\u4f5c\u4e0a\u7684\u56f0\u96be\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4eec\u4e00\u8d77\u89e3\u51b3\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** (T4\u7528\u6237\u9700\u8981\u770b\u5230\u660e\u786e\u7684\u6280\u80fd\u6210\u957f\u548c\u53d8\u73b0\u8def\u5f84)\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n    1.  **\u3010\u65f6\u95f4\u5f39\u6027\u4fdd\u969c\u5305\u3011**\uff1a\u5fc5\u987b\u660e\u786e\u544a\u77e5\u6240\u6709\u76f4\u64ad\u6709\u56de\u653e\uff0c\u5e76\u63d0\u4f9b\u6e05\u6670\u7684\u8865\u8bfe/\u590d\u4e60\u8def\u5f84\uff0c\u7f13\u89e3\u5176\u65f6\u95f4\u7126\u8651\u3002\n    2.  **\u3010\u63a5\u5355\u8def\u5f84\u53ef\u89c6\u5316\u5305\u3011**\uff1a\u63d0\u524d\u5c55\u793a\u5f80\u671f\u5b66\u5458\u4ece0\u5230\u63a5\u5355\u7684\u6848\u4f8b\u3001\u63a5\u5355\u7fa4\u622a\u56fe\u3001\u62a5\u4ef7\u5355\u7b49\uff0c\u5f3a\u5316\u5176\u201c\u6709\u8def\u53ef\u8d70\u201d\u7684\u4fe1\u5fc3\u3002\n    3.  **\u3010\u8f7b\u91cfC\u6a21\u5757\uff08\u9002\u5ea6\u9f13\u52b1\uff09\u3011**\uff1a\u5728\u5176\u5b8c\u6210\u4f5c\u4e1a\u3001\u514b\u670d\u65f6\u95f4\u56f0\u96be\u65f6\u7ed9\u4e88\u53ca\u65f6\u3001\u5177\u4f53\u7684\u80af\u5b9a\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1.  \u7edd\u4e0d\u5bf9\u5176\u4f7f\u7528\u201c\u8f7b\u677e\u6708\u5165\u8fc7\u4e07\u201d\u3001\u201c\u901f\u6210\u201d\u7b49\u5938\u5f20\u8bdd\u672f\uff0c\u4f1a\u62d4\u9ad8\u5176\u4e0d\u5207\u5b9e\u9645\u7684\u671f\u671b\u3002\n    2.  \u7edd\u4e0d\u5728\u5176\u62b1\u6028\u65f6\u95f4\u7d27\u5f20\u65f6\uff0c\u7528\u201c\u522b\u4eba\u90fd\u80fd\u8ddf\u4e0a\u201d\u65bd\u538b\u3002\n    3.  \u7edd\u4e0d\u5728\u5176\u8be2\u95ee\u53d8\u73b0\u65f6\u7ed9\u51fa\u6a21\u7cca\u627f\u8bfa\uff0c\u5fc5\u987b\u63d0\u4f9b\u5177\u4f53\u6848\u4f8b\u548c\u9636\u68af\u76ee\u6807\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u57fa\u7840\u6280\u80fd\u672a\u638c\u63e1\u3001\u672a\u4ea7\u751f\u4efb\u4f55\u6b63\u53cd\u9988\uff08\u5982\u63a5\u5230\u7b2c\u4e00\u5355\u5c0f\u5355\uff09\u524d\uff0c\u8fdb\u884c\u4efb\u4f55\u5927\u989d\u5347\u5355\u63a8\u4ecb\u3002** \u53ef\u8003\u8651500\u5143\u4ee5\u5185\u7684\u5fae\u5347\u5355\uff08\u5982\u7d20\u6750\u5305\u3001\u63d0\u793a\u8bcd\u5e93\uff09\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u6bcf\u5929\u5982\u679c\u8bf4\u5b66\u4e60\u4e24\u4e2a\u5c0f\u65f6\uff0c\u6211\u5b66\u4e60\u8fdb\u5ea6\u5982\u679c\u6ca1\u6709\u90a3\u4e48\u597d\u7684\u8bdd\uff0c\u591a\u957f\u65f6\u95f4\u80fd\u770b\u5230\u4e00\u5b9a\u7684\u6548\u679c\u5462\u201d\n2. > \u201c\u56e0\u4e3a\u6211\u73b0\u5728\u7684\u8bdd\u8fd8\u5728\u4e0a\u73ed\u561b\uff0c\u90a3\u8fd9\u4e2a\u7684\u8bdd\u6211\u8fd8\u4e0d\u77e5\u9053\u672a\u6765\u524d\u666f\u600e\u4e48\u6837\uff0c\u8fd8\u662f\u8981\u628a\u6211\u672c\u6765\u7684\u5de5\u4f5c\u505a\u597d\u201d\n3. > \u201c\u6211\u6bd4\u8f83\u62c5\u5fc3\u7684\u5c31\u662f\uff0c\u6211\u540e\u671f\u5c31\u662f\u5982\u679c\u8bf4\u662f\u771f\u7684\u53bb\u505a\uff0c\u5c31\u662f\u6ca1\u6709\u8db3\u591f\u7684\u5355\u5b50\u53ef\u4ee5\u7ed9\u6211\u201d\n4. > \u201c\u5982\u679c\u8bf4\u540e\u671f\u505a\u5230\u5c31\u662f\u5b66\u5230\u5df2\u7ecf\u6bd5\u4e1a\u4e86\uff0c\u6211\u80fd\u591f\u6210\u5c31\u662f\u81ea\u5df1\u80fd\u591f\u5355\u72ec\u7684\u53bb\u5b8c\u6210\u4e00\u4e9b\u5185\u5bb9\u7684\u8bdd\uff0c\u6709\u6ca1\u6709\u673a\u4f1a\u8fdb\u5230\u4e00\u4e9b\u6bd4\u8f83\u597d\u7684\u5de5\u4f5c\u5ba4\u5462\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4 \u641e\u94b1\u7ed3\u679c\u8bba\uff08\u52a1\u5b9e\u7126\u8651\u578b\uff09\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42\uff08\u804c\u4e1a\u4e0e\u6536\u5165\u4fdd\u969c\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u5ea6\u6e05\u6670\u7684\u53d8\u73b0\u8def\u5f84\u56fe + \u6781\u81f4\u5f39\u6027\u7684\u65f6\u95f4\u5b89\u6392\uff0c\u7ba1\u7406\u5176\u201c\u6295\u5165\u5fc5\u6709\u786e\u5b9a\u56de\u62a5\u201d\u7684\u9884\u671f\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u8bba\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u65f6\u95f4\u5f39\u6027\u4fdd\u969c\u5305+\u63a5\u5355\u8def\u5f84\u53ef\u89c6\u5316\u5305\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
