    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u804a\u5929\u8bb0\u5f55\u4e3b\u8981\u4e3a\u5355\u5411\u8bfe\u7a0b\u901a\u77e5\u4e0e\u7b80\u5355\u4e92\u52a8\uff0c\u7f3a\u4e4f\u5173\u4e8e\u7528\u6237**\u652f\u4ed8\u60c5\u51b5\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u3001\u5177\u4f53\u804c\u4e1a/\u6536\u5165\u3001\u8be6\u7ec6\u5b66\u4e60\u76ee\u6807\u4e0e\u53d8\u73b0\u671f\u671b**\u7684\u5173\u952e\u4fe1\u606f\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d)**\n    *   **\u79ef\u6781\u4fe1\u53f7**: \u4e3b\u52a8\u8be2\u95ee\u957f\u7bc7\u5199\u4f5c\u5efa\u8bae\u3001AI\u5efa\u4eba\u7269\u6863\u6848\u5e93\uff0c\u8868\u73b0\u51fa\u5bf9\u5199\u4f5c\u6280\u80fd\u63d0\u5347\u7684\u5177\u4f53\u5174\u8da3\u3002\u4e3b\u52a8\u7533\u8bf7\u201c\u5947\u8ff9\u5c0f\u8bf4\u5bb6\u201d\u5e76\u7b7e\u7ea6\u6210\u529f\uff0c\u6709\u884c\u52a8\u529b\u3002\n    *   **\u6d88\u6781\u4fe1\u53f7**: \u5b66\u4e60\u52a8\u673a\u53d7\u201c\u52a0\u73ed\u4e25\u91cd\u201d\u3001\u201c\u56fd\u4f01\u5185\u63a7\u68c0\u67e5\u201d\u7b49\u5916\u90e8\u538b\u529b\u9a71\u52a8\uff0c\u5bfb\u6c42\u201c\u804c\u4e1a\u80fd\u6551\u6211\u201d\u7684\u51fa\u8def\uff0c**\u5b58\u5728\u5c06\u8bfe\u7a0b\u89c6\u4e3a\u201c\u6551\u547d\u7a3b\u8349\u201d\u7684\u6f5c\u5728\u98ce\u9669**\u3002\u5b66\u4e60\u8fdb\u7a0b\u5e38\u88ab\u5de5\u4f5c\u6253\u65ad\uff0c\u6301\u7eed\u6027\u5b58\u7591\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d)**\n    *   **\u65f6\u95f4\u8d44\u6e90 (\u7d27\u5f20)**: \u591a\u6b21\u63d0\u53ca\u201c\u52a0\u73ed\u592a\u4e25\u91cd\u201d\u3001\u201c\u6765\u4e0d\u53ca\u542c\u8bfe\u201d\u3001\u201c\u521a\u5fd9\u5b8c\u201d\uff0c\u663e\u793a\u5de5\u4f5c\u7e41\u5fd9\uff0c\u53ef\u7528\u4e8e\u6df1\u5ea6\u5b66\u4e60\u7684\u65f6\u95f4\u788e\u7247\u5316\u4e14\u4e0d\u7a33\u5b9a\u3002\n    *   **\u7ecf\u6d4e\u8d44\u6e90 (\u63a8\u6d4b\u7a33\u5b9a)**: \u56fd\u4f01\u80cc\u666f\uff0c\u63a8\u6d4b\u6536\u5165\u7a33\u5b9a\uff0c\u80fd\u8d1f\u62c5\u8bfe\u7a0b\u8d39\u7528\uff0c\u4f46\u672a\u660e\u786e\u63d0\u53ca\u3002\n    *   **\u8ba4\u77e5\u8d44\u6e90 (\u4e2d\u7b49)**: \u80fd\u8ddf\u4e0a\u8bfe\u7a0b\u8282\u594f\uff0c\u5b8c\u6210\u4f5c\u4e1a\u5e76\u7b7e\u7ea6\uff0c\u5177\u5907\u57fa\u672c\u5b66\u4e60\u80fd\u529b\u3002\u4f46\u5bf9AI\u5de5\u5177\uff08\u5982\u4eba\u7269\u6863\u6848\u5e93\uff09\u7684\u6df1\u5ea6\u5e94\u7528\u6709\u8fdb\u4e00\u6b65\u9700\u6c42\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u4f4e)**\n    *   **\u97e7\u6027 (\u4e2d\u7b49)**: \u5c3d\u7ba1\u5de5\u4f5c\u7e41\u5fd9\uff0c\u4ecd\u8868\u793a\u201c\u4e89\u53d6\u542c\u56de\u653e\uff0c\u4f5c\u4e1a\u4e89\u53d6\u4e0d\u62c9\u201d\uff0c\u5e76\u5728\u6df1\u591c\u8865\u4f5c\u4e1a\uff0c\u6709\u4e00\u5b9a\u575a\u6301\u5ea6\u3002\n    *   **\u538b\u529b\u5e94\u5bf9 (\u504f\u5f31)**: \u9891\u7e41\u4f7f\u7528\u201c[\u6342\u8138]\u201d\u8868\u60c5\uff0c\u900f\u9732\u51fa\u5bf9\u65f6\u95f4\u7d27\u5f20\u3001\u4efb\u52a1\u79ef\u538b\u7684\u7126\u8651\u548c\u65e0\u529b\u611f\u3002\u5c06\u8bfe\u7a0b\u5b66\u4e60\u89c6\u4e3a\u7f13\u89e3\u5de5\u4f5c\u538b\u529b\u7684\u66ff\u4ee3\u65b9\u6848\uff0c**\u6297\u538b\u80fd\u529b\u4e0e\u60c5\u7eea\u7ba1\u7406\u662f\u6f5c\u5728\u98ce\u9669\u70b9**\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5** - **\u4fe1\u606f\u7f3a\u5931**\u3002\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u884c\u4e3a\u3001\u91d1\u989d\u3001\u65b9\u5f0f\u3002\u9700\u6838\u67e5\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5** - **\u4fe1\u606f\u7f3a\u5931**\u3002\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u6216\u914d\u5076\u4fe1\u606f\uff0c\u51b3\u7b56\u6743\u4e0d\u660e\u3002\n*   **\u6b65\u9aa41\uff1a\u52a8\u673a\u4e0e\u8d44\u6e90** - **B\u7c7b (\u52a8\u673a\u660e\u786e\u4f46\u8d44\u6e90\u53d7\u9650)**\u3002\u6709\u660e\u786e\u5b66\u4e60\u610f\u5411\uff08\u957f\u7bc7\u5199\u4f5c\u3001\u7b7e\u7ea6\uff09\u548c\u884c\u52a8\uff0c\u4f46\u65f6\u95f4\u8d44\u6e90\u4e25\u91cd\u53d7\u9650\uff0c\u5b66\u4e60\u8fde\u7eed\u6027\u5dee\u3002\n*   **\u6b65\u9aa42\uff1a\u627f\u8bfa\u4e0e\u884c\u52a8** - **B2\u7c7b (\u9ad8\u610f\u613f\uff0c\u4f4e\u884c\u52a8\u4e00\u81f4\u6027)**\u3002\u610f\u613f\u5f3a\u70c8\uff08\u4e3b\u52a8\u63d0\u95ee\u3001\u7533\u8bf7\u7b7e\u7ea6\uff09\uff0c\u4f46\u884c\u52a8\u53d7\u5de5\u4f5c\u4e25\u91cd\u5e72\u6270\uff0c\u8bfe\u7a0b\u53c2\u4e0e\u88ab\u52a8\uff08\u5e38\u9700\u8865\u56de\u653e\uff09\uff0c\u4f9d\u8d56\u73ed\u4e3b\u4efb\u63d0\u9192\u3002\n*   **\u6b65\u9aa43\uff1a\u6210\u679c\u4e0e\u53cd\u9988** - **B\u7c7b (\u6709\u521d\u6b65\u6210\u679c\uff0c\u4f46\u6df1\u5ea6\u4e0d\u8db3)**\u3002\u6210\u529f\u7b7e\u7ea6\u201c\u5947\u8ff9\u5c0f\u8bf4\u5bb6\u201d\u662f\u79ef\u6781\u6210\u679c\uff0c\u4f46\u7528\u6237\u81ea\u8bc4\u201c\u6587\u7ae0\u6709\u786c\u4f24\uff0c\u4e0d\u597d\u770b\u201d\uff0c\u4e14\u4e3b\u52a8\u7533\u8bf7\u8bfe\u7a0b\u5ef6\u671f\uff0c\u8868\u660e\u5f53\u524d\u5b66\u4e60\u6210\u679c\u672a\u8fbe\u81ea\u8eab\u9884\u671f\uff0c\u5b66\u4e60\u6df1\u5ea6\u548c\u719f\u7ec3\u5ea6\u6709\u5f85\u52a0\u5f3a\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **T5 \u65f6\u95f4\u8d2b\u56f0\u7684\u52a1\u5b9e\u63a2\u7d22\u8005**\u3002\u6838\u5fc3\u7279\u5f81\u9ad8\u5ea6\u543b\u5408\uff1a**\u5728\u804c\u3001\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\u3001\u5b66\u4e60\u76ee\u6807\u52a1\u5b9e\uff08\u5b66\u6280\u80fd\u3001\u7b7e\u7ea6\uff09\u3001\u5b66\u4e60\u8fc7\u7a0b\u5e38\u88ab\u5de5\u4f5c\u6253\u65ad\u3001\u5bf9\u5b66\u4e60\u652f\u6301\uff08\u5982\u56de\u653e\u3001\u7b54\u7591\uff09\u6709\u5f3a\u4f9d\u8d56**\u3002\u5176\u56fd\u4f01\u80cc\u666f\u548c\u5bfb\u6c42\u804c\u4e1a\u51fa\u8def\u7684\u52a8\u673a\uff0c\u4e5f\u7b26\u5408\u8be5\u539f\u578b\u5e38\u89c1\u7684\u201c\u5bfb\u6c42\u7b2c\u4e8c\u66f2\u7ebf\u201d\u7684\u5fc3\u7406\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4e2d)\n*   **\u6839\u56e01 - \u9884\u671f\u7ba1\u7406\u5931\u8861 (\u4e2d\u9ad8\u98ce\u9669)**: \u7528\u6237\u671f\u671b\u8bfe\u7a0b\u80fd\u6210\u4e3a\u201c\u6551\u201d\u5176\u8131\u79bb\u9ad8\u538b\u5de5\u4f5c\u7684\u201c\u804c\u4e1a\u201d\uff0c**\u5b58\u5728\u5bf9\u8bfe\u7a0b\u53d8\u73b0\u901f\u5ea6\u4e0e\u6548\u679c\u7684\u8fc7\u9ad8\u3001\u8fc7\u5feb\u671f\u5f85**\u3002\u82e5\u540e\u7eed\u65e0\u6cd5\u5e73\u8861\u5de5\u4f5c\u4e0e\u5b66\u4e60\uff0c\u6216\u53d8\u73b0\u4e0d\u53ca\u9884\u671f\uff0c\u6613\u4ea7\u751f\u843d\u5dee\u3002\n*   **\u6839\u56e02 - \u65f6\u95f4\u7cbe\u529b\u67af\u7aed (\u9ad8\u98ce\u9669)**: **\u5de5\u4f5c\u5df2\u4e25\u91cd\u6324\u5360\u5b66\u4e60\u65f6\u95f4**\uff0c\u662f\u5f53\u524d\u6700\u7a81\u51fa\u7684\u77db\u76fe\u3002\u957f\u671f\u75b2\u52b3\u4f5c\u6218\u53ef\u80fd\u5bfc\u81f4\u6700\u7ec8\u653e\u5f03\u3002\n*   **\u6839\u56e03 - \u6548\u679c\u611f\u77e5\u6ede\u540e (\u4e2d\u98ce\u9669)**: \u5df2\u7b7e\u7ea6\u6709\u6b63\u53cd\u9988\uff0c\u4f46\u7528\u6237\u81ea\u8bc4\u6587\u7ae0\u8d28\u91cf\u4e0d\u9ad8\uff0c\u82e5\u540e\u7eed\u63d0\u5347\u7f13\u6162\uff0c\u53ef\u80fd\u5f71\u54cd\u4fe1\u5fc3\u3002\n*   **\u6839\u56e04 - \u652f\u6301\u611f\u77e5\u4e0d\u8db3 (\u4f4e\u98ce\u9669)**: \u4e0e\u73ed\u4e3b\u4efb\u6c9f\u901a\u987a\u7545\uff0c\u56de\u590d\u53ca\u65f6\uff0c\u652f\u6301\u611f\u77e5\u5c1a\u53ef\u3002\n*   **\u6839\u56e05 - \u4ea7\u54c1\u9519\u914d (\u4f4e\u98ce\u9669)**: \u7528\u6237\u76ee\u6807\uff08\u957f\u7bc7\u5199\u4f5c\uff09\u4e0e\u8bfe\u7a0b\u65b9\u5411\uff08AI\u5199\u4f5c/\u77ed\u5267\uff09\u57fa\u672c\u5339\u914d\uff0c\u4e14\u5df2\u7533\u8bf7\u4e0b\u4e00\u9636\u6bb5\u8bfe\u7a0b\uff08\u5267\u672c\u8bfe\uff09\uff0c\u5339\u914d\u5ea6\u5c1a\u53ef\u3002\n*   **\u6839\u56e06 - \u7ecf\u6d4e\u538b\u529b (\u4f4e\u98ce\u9669)**: \u672a\u63d0\u53ca\u7ecf\u6d4e\u56f0\u96be\u3002\n*   **\u6839\u56e07 - \u5bb6\u5ead\u963b\u529b (\u4fe1\u606f\u7f3a\u5931)**: \u65e0\u6cd5\u5224\u65ad\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u57fa\u672c\u5408\u89c4**: \u9500\u552e/\u73ed\u4e3b\u4efb\u884c\u4e3a\u4ee5\u8bfe\u7a0b\u901a\u77e5\u3001\u5b66\u4e60\u7763\u4fc3\u3001\u95ee\u9898\u89e3\u7b54\u4e3a\u4e3b\uff0c\u672a\u53d1\u73b0\u5938\u5927\u627f\u8bfa\u3001\u903c\u5355\u7b49\u8fdd\u89c4\u8bdd\u672f\u3002\n*   **\u98ce\u9669\u70b9**: \u5bf9\u7528\u6237\u201c\u804c\u4e1a\u80fd\u6551\u6211\u5c31\u597d\u4e86\u201d\u7684\u7126\u8651\u8868\u8ff0\uff0c\u672a\u8fdb\u884c\u5145\u5206\u7684**\u9884\u671f\u964d\u6e29\u4e0e\u98ce\u9669\u63d0\u793a**\uff0c\u53ef\u80fd\u57cb\u4e0b\u540e\u7eed\u7ea0\u7eb7\u9690\u60a3\u3002\u5e94\u5f15\u5bfc\u7528\u6237\u5efa\u7acb\u201c\u6280\u80fd\u79ef\u7d2f\u9700\u65f6\u95f4\u201d\u3001\u201c\u4e0e\u4e3b\u4e1a\u7ed3\u5408\u201d\u7684\u5408\u7406\u9884\u671f\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d**: **\u5339\u914d**\u3002\u7528\u6237\u76ee\u6807\uff08\u5199\u4f5c\u63d0\u5347\u3001\u7b7e\u7ea6\uff09\u4e0e\u8bfe\u7a0b\u8def\u5f84\uff08AI\u5199\u4f5c\u2192\u5267\u672c/\u77ed\u5267\uff09\u4e00\u81f4\uff0c\u4e14\u5df2\u8fdb\u5165\u4e0b\u4e00\u9636\u6bb5\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**:\n    1.  **\u9996\u8981\u52a8\u4f5c\uff08\u98ce\u9669\u7ba1\u63a7\uff09**: **\u7acb\u5373\u8fdb\u884c\u4e00\u5bf9\u4e00\u6df1\u5ea6\u6c9f\u901a**\uff0c\u6838\u5fc3\u662f **\u201c\u6821\u6b63\u9884\u671f\uff0c\u89c4\u5212\u8282\u594f\u201d** \u3002\u660e\u786e\u544a\u77e5\u6280\u80fd\u53d8\u73b0\u7684\u957f\u671f\u6027\uff0c\u5e2e\u52a9\u5176\u5236\u5b9a\u4e0e\u5de5\u4f5c\u8282\u594f\u5339\u914d\u7684\u3001**\u6781\u5ea6\u7075\u6d3b**\u7684\u5b66\u4e60\u8ba1\u5212\uff08\u5982\u4ee5\u201c\u5468\u201d\u751a\u81f3\u201c\u53cc\u5468\u201d\u4e3a\u5355\u4f4d\uff09\uff0c\u964d\u4f4e\u5176\u56e0\u65f6\u95f4\u51b2\u7a81\u4ea7\u751f\u7684\u7126\u8651\u548c\u653e\u5f03\u98ce\u9669\u3002\n    2.  **\u670d\u52a1\u4fa7\u91cd**: \u63d0\u4f9b**\u9ad8\u5ea6\u7ed3\u6784\u5316\u7684\u56de\u653e\u5b66\u4e60\u8def\u5f84**\u548c**\u788e\u7247\u5316\u5b66\u4e60\u5de5\u5177\u5305**\uff08\u59825\u5206\u949f\u6280\u5de7\u77ed\u89c6\u9891\u3001\u6587\u6863\u6a21\u677f\uff09\uff0c\u9002\u5e94\u5176\u65f6\u95f4\u7279\u70b9\u3002\u5f3a\u5316\u201c\u7b7e\u7ea6\u6210\u529f\u201d\u7684\u6b63\u5411\u6fc0\u52b1\uff0c\u5de9\u56fa\u5176\u4fe1\u5fc3\u3002\n    3.  **\u9884\u8b66\u673a\u5236**: \u6807\u8bb0\u4e3a\u201c\u65f6\u95f4\u654f\u611f\u578b\u7528\u6237\u201d\uff0c\u5bc6\u5207\u5173\u6ce8\u5176\u4f5c\u4e1a\u63d0\u4ea4\u9891\u7387\u548c\u4e92\u52a8\u6d3b\u8dc3\u5ea6\u4e0b\u6ed1\u60c5\u51b5\uff0c\u4e00\u65e6\u51fa\u73b0\u8fde\u7eed\u7f3a\u5e2d\uff0c\u9700\u4e3b\u52a8\u4ecb\u5165\u4e86\u89e3\u5de5\u4f5c\u538b\u529b\u60c5\u51b5\uff0c\u63d0\u4f9b\u5fc3\u7406\u652f\u6301\u6216\u5b66\u4e60\u65b9\u6848\u8c03\u6574\u5efa\u8bae\u3002\n\n{\"core_type\": \"T5 \u65f6\u95f4\u8d2b\u56f0\u7684\u52a1\u5b9e\u63a2\u7d22\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u7acb\u5373\u6c9f\u901a\u6821\u6b63\u9884\u671f\u4e0e\u8282\u594f\"}";
