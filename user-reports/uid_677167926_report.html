    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u963f\u7fbd (UID: 677167926) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5b98\u65b9\u62db\u52df\u5b98\uff0d\u7af9\u5b50(\u9ad8\u7af9\u7c89)\u3001\u7bf1\u4eba1\u3001\u6854\u5b50JZT(\u7a0b\u5c55\u6b22) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u9ad8\u9636\u8bfe\u7a0b (\u5df2\u4ed8\u8d39) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u5145\u88d5 (\u672a\u63d0\u53ca\u5206\u671f\u6216\u501f\u6b3e) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1 (\u6bcf\u59291-2\u5c0f\u65f6) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u672a\u77e5 (\u4fe1\u606f\u7f3a\u5931) |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e2d\u7b49 (\u6709\u57fa\u7840\u4fe1\u606f\uff0c\u4f46\u6df1\u5ea6\u4e92\u52a8\u8f83\u5c11) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u517c\u5177\u53d8\u73b0\u671f\u671b\uff0c\u4f46\u975e\u6025\u529f\u8fd1\u5229\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5b66\u4e60\u76ee\u6807:\u5174\u8da3+\u8d5a\u94b1\u201d\uff1b> \u201c\u73b0\u9636\u6bb5\u53ef\u80fd\u503e\u5411\u4e8e\u7eaa\u5f55\u7247\u65c1\u767d\uff0c\u7b49\u5230\u6280\u5de7\u719f\u7ec3\u540e\u518d\u8fdb\u5165\u89d2\u8272\u914d\u97f3\u53ef\u80fd\u6bd4\u8f83\u9002\u5408\u6211\u201d\uff1b> \u201c\u90fd\u8bd5\u8bd5\uff0c\u4e5f\u4e0d\u4f1a\u7f3a\u80f3\u818a\u5c11\u817f\u201d\u3002 \u7528\u6237\u660e\u786e\u8868\u8fbe\u4e86\u201c\u5174\u8da3+\u8d5a\u94b1\u201d\u7684\u53cc\u91cd\u76ee\u6807\uff0c\u4e14\u5bf9\u5b66\u4e60\u8def\u5f84\u6709\u6e05\u6670\u89c4\u5212\uff08\u5148\u65c1\u767d\u540e\u89d2\u8272\uff09\uff0c\u663e\u793a\u51fa\u7406\u6027\u3001\u52a1\u5b9e\u7684\u957f\u671f\u4e3b\u4e49\u5b66\u4e60\u5fc3\u6001\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u76f4\u63a5\u652f\u4ed8\u9ad8\u9636\u8bfe\u7a0b\u8d39\u7528\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u533b\u7597\u884c\u4e1a\uff0c\u6bcf\u5929\u4ec5\u67091-2\u5c0f\u65f6\u7a7a\u95f2\u65f6\u95f4\uff0c\u5de5\u4f5c\u7e41\u5fd9\uff08\u201c\u5de5\u4f5c\u6bd4\u8f83\u5fd9\u201d\uff09\uff0c\u4f5c\u4e1a\u9700\u4e0b\u73ed\u540e\u5b8c\u6210\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u672a\u77e5** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\uff0c\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u5fc3\u6001\u79ef\u6781\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u6b63\u53d1\u6101\u5462\u201d\uff1b> \u201c\u6211\u63e3\u6469\u4e00\u4e0b\u518d\u5f55\u201d\u3002 \u9762\u5bf9\u6709\u96be\u5ea6\u7684\u4f5c\u4e1a\uff08\u60ac\u7591\u6587\u672c\uff09\uff0c\u7528\u6237\u8868\u8fbe\u7684\u662f\u201c\u53d1\u6101\u201d\u800c\u975e\u201c\u653e\u5f03\u201d\uff0c\u5e76\u4e3b\u52a8\u8868\u793a\u9700\u8981\u201c\u63e3\u6469\u201d\uff0c\u5c55\u73b0\u51fa\u9762\u5bf9\u6311\u6218\u65f6\u4e3b\u52a8\u601d\u8003\u3001\u5bfb\u6c42\u7a81\u7834\u7684\u79ef\u6781\u5fc3\u6001\uff0c\u65e0\u4efb\u4f55\u81ea\u5351\u6216\u4f9d\u8d56\u60c5\u7eea\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u4e13\u4e1a\u80fd\u529b\u63d0\u5347\u548c\u804c\u4e1a\u5316\u53d1\u5c55\u7684\u6e34\u671b\u3002\u5979\u5e0c\u671b\u4ece\u201c\u5174\u8da3\u201d\u51fa\u53d1\uff0c\u901a\u8fc7\u7cfb\u7edf\u5b66\u4e60\uff0c\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\uff08\u5982\u9002\u5408\u7684\u8d5b\u9053\u3001\u8bc1\u4e66\uff09\uff0c\u5e76\u6700\u7ec8\u5b9e\u73b0\u6280\u80fd\u53d8\u73b0\uff0c\u83b7\u5f97\u804c\u4e1a\u8eab\u4efd\u4e0a\u7684\u5c0a\u91cd\u4e0e\u81ea\u6211\u4ef7\u503c\u5b9e\u73b0\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u7cbe\u51c6\u80af\u5b9a\u4e0e\u8def\u5f84\u89c4\u5212**\u3002\u5979\u9700\u8981\u88ab\u8ba4\u53ef\u4e3a\u201c\u6709\u6f5c\u529b\u3001\u6709\u57fa\u7840\u201d\u7684\u5b66\u5458\uff0c\u5e76\u5f97\u5230\u6e05\u6670\u7684\u3001\u7b26\u5408\u5979\u5f53\u524d\u80fd\u529b\u9636\u6bb5\uff08\u5982\u5148\u65c1\u767d\u540e\u89d2\u8272\uff09\u7684\u4e13\u4e1a\u53d1\u5c55\u6307\u5f15\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 **B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u5411\u6df7\u5408\u4f533\u53f7\u3010\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b\u3011\u8fdb\u5316\u524d\u4f53) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u7f3a\u5931\uff0c\u6682\u65e0\u6cd5\u5224\u65ad\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u533b\u7597\u884c\u4e1a\u5de5\u4f5c\u7e41\u5fd9\uff0c\u6bcf\u5929\u4ec51-2\u5c0f\u65f6\u5b66\u4e60\u65f6\u95f4\u3002\u82e5\u8bfe\u7a0b\u4efb\u52a1\u8fc7\u91cd\u6216\u65f6\u95f4\u5b89\u6392\u51b2\u7a81\uff0c\u53ef\u80fd\u56e0\u65e0\u6cd5\u8ddf\u4e0a\u8fdb\u5ea6\u800c\u4ea7\u751f\u7126\u8651\u3001\u81ea\u8d23\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u632b\u6298\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u52a8\u673a\u7eaf\u5ea6\u8f83\u9ad8\uff0c\u5bf9\u5b66\u4e60\u5468\u671f\u6709\u7406\u6027\u8ba4\u77e5\uff08\u201c\u6280\u5de7\u719f\u7ec3\u540e\u201d\uff09\uff0c\u77ed\u671f\u5185\u672a\u8868\u73b0\u51fa\u6025\u8feb\u53d8\u73b0\u7126\u8651\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe2-4\u5468\uff0c\u5f53\u7cfb\u7edf\u8bfe\u7a0b\u4f5c\u4e1a\u91cf\u52a0\u5927\uff0c\u4e0e\u672c\u804c\u5de5\u4f5c\u4ea7\u751f\u65f6\u95f4\u51b2\u7a81\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u5979\u8bf4......\u201d**\n> \u201c\u963f\u7fbd\uff0c\u770b\u5230\u4f60\u533b\u7597\u5de5\u4f5c\u8fd9\u4e48\u5fd9\u8fd8\u80fd\u575a\u6301\u5b66\u4e60\uff0c\u771f\u7684\u5f88\u4f69\u670d\u4f60\u7684\u81ea\u5f8b\u3002\u54b1\u4eec\u7cfb\u7edf\u8bfe\u4f1a\u5faa\u5e8f\u6e10\u8fdb\uff0c\u6211\u4f1a\u6839\u636e\u4f60\u7684\u65f6\u95f4\u5e2e\u4f60\u89c4\u5212\u597d\u6bcf\u5468\u91cd\u70b9\uff0c\u786e\u4fdd\u4f60\u6bcf\u4e00\u6b65\u90fd\u8d70\u5f97\u624e\u5b9e\uff0c\u4e0d\u5f71\u54cd\u4f11\u606f\u3002\u4f60\u6709\u4efb\u4f55\u65f6\u95f4\u4e0a\u7684\u8c03\u6574\u9700\u6c42\uff0c\u968f\u65f6\u8ddf\u6211\u6c9f\u901a\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** (\u4ea7\u54c1\u7ebfA)\u3002\u5339\u914d\u5176\u9ad8\u52a8\u673a\u7eaf\u5ea6\u548c\u5bf9\u4e13\u4e1a\u7cbe\u8fdb\u7684\u8ffd\u6c42\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\u7684\u7279\u70b9\uff0c\u8865\u5145 **\u3010\u65f6\u95f4\u5f39\u6027\u652f\u6301\u5305\u3011**\uff08\u5982\u63d0\u4f9b\u5f55\u64ad\u8bfe\u91cd\u70b9\u5207\u7247\u3001\u5141\u8bb8\u4f5c\u4e1a\u5f39\u6027\u63d0\u4ea4\uff09\u3002\u540c\u65f6\uff0c\u56e0\u5176\u8868\u73b0\u51fa\u4eceT2\u5411T1-A\uff08\u7edf\u7b79\u578b\uff09\u8fdb\u5316\u7684\u6f5c\u8d28\uff08\u4e3b\u52a8\u8be2\u95ee\u8bfe\u7a0b\u5b89\u6392\u3001\u89c4\u5212\u5b66\u4e60\u8def\u5f84\uff09\uff0c\u53ef\u89c2\u5bdf\u5e76\u9002\u65f6\u8d4b\u4e88 **\u3010\u8f7b\u5ea6\u6559\u52a1\u8f85\u52a9\u6743\u9650\u3011**\uff08\u5982\u5c0f\u7ec4\u957f\u3001\u4f5c\u4e1a\u6536\u96c6\u5458\uff09\uff0c\u6fc0\u53d1\u5176\u9886\u5bfc\u529b\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u6700\u540e\u540d\u989d\u201d\u3001\u201c\u9650\u65f6\u903c\u5355\u201d\u7b49\u9ad8\u538b\u8bdd\u672f\u63a8\u9500\u540e\u7eed\u8bfe\u7a0b\u3002\u907f\u514d\u5e03\u7f6e\u8fc7\u91cf\u3001\u65f6\u95f4\u50f5\u5316\u7684\u4f5c\u4e1a\uff0c\u5bfc\u81f4\u5176\u56e0\u5de5\u4f5c\u51b2\u7a81\u4ea7\u751f\u632b\u8d25\u611f\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u9700\u5339\u914d\u5176\u5b66\u4e60\u9636\u6bb5**\u3002\u5728\u5176\u57fa\u7840\u6280\u80fd\u624e\u5b9e\u540e\uff0c\u53ef\u63a8\u8350\u540e\u671f\u5236\u4f5c\u3001\u8bbe\u5907\u5347\u7ea7\u7b49\u9ad8\u9636\u8bfe\u7a0b\uff0c\u4f46\u5fc5\u987b\u57fa\u4e8e\u5176\u201c\u5148\u65c1\u767d\u540e\u89d2\u8272\u201d\u7684\u89c4\u5212\uff0c\u63d0\u4f9b\u6e05\u6670\u7684\u8fdb\u9636\u8def\u5f84\u56fe\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5b66\u4e60\u76ee\u6807:\u5174\u8da3+\u8d5a\u94b1\u201d\n2. > \u201c\u73b0\u9636\u6bb5\u53ef\u80fd\u503e\u5411\u4e8e\u7eaa\u5f55\u7247\u65c1\u767d\uff0c\u7b49\u5230\u6280\u5de7\u719f\u7ec3\u540e\u518d\u8fdb\u5165\u89d2\u8272\u914d\u97f3\u53ef\u80fd\u6bd4\u8f83\u9002\u5408\u6211\u201d\n3. > \u201c\u6211\u6b63\u53d1\u6101\u5462\u201d / \u201c\u6211\u63e3\u6469\u4e00\u4e0b\u518d\u5f55\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u6709\u5411 **\u3010\u6df7\u5408\u4f533\u53f7\uff08\u6743\u9650\u89c9\u9192\uff09\u3011** \u8fdb\u5316\u7684\u6f5c\u529b\u3002\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6e05\u6670\u3001\u5f39\u6027\u7684\u5b66\u4e60\u8def\u5f84\uff0c\u5e76\u8d4b\u4e88\u9002\u5ea6\u7684\u73ed\u7ea7\u7ba1\u7406\u6743\u9650\uff0c\u6ee1\u8db3\u5176\u6f5c\u5728\u7684\u9886\u5bfc\u4e0e\u89c4\u5212\u6b32\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd\u9700\u6c42/\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\uff08\u4ea7\u54c1\u7ebfA\uff09\", \"age\": \"34\u5c81\", \"gender\": \"\u5973\", \"city\": \"\u5e7f\u5dde\"}\n```";
