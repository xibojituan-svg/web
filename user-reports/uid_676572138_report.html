        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n> **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4e3b\u8981\u4e3a\u8bfe\u7a0b\u4ea4\u4ed8\u671f\u7684\u670d\u52a1\u6c9f\u901a\uff0c\u4e25\u91cd\u7f3a\u4e4f**\u652f\u4ed8\u65b9\u5f0f\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u4e2a\u4eba\u80cc\u666f\u3001\u521d\u59cb\u8d2d\u4e70\u52a8\u673a\u3001\u5b66\u4e60\u76ee\u6807\u4e0e\u671f\u671b\u6536\u76ca**\u7b49\u5173\u952e\u4fe1\u606f\uff0c\u65e0\u6cd5\u8fdb\u884c\u6709\u6548\u7684\u4e09\u8f74\u8bc4\u7ea7\u548cABCD\u5224\u5b9a\u3002\u4ee5\u4e0b\u5206\u6790\u57fa\u4e8e\u6709\u9650\u7684\u670d\u52a1\u671f\u884c\u4e3a\u63a8\u6d4b\uff0c\u4ec5\u4f9b\u53c2\u8003\u3002\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676572138 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-15 \u81f3 2026-03-02 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6c90\u8a00(\u674e\u6625\u5170) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u77ed\u89c6\u9891\u5b9e\u6218\u516c\u5f00\u8bfe\u3001\u65d7\u8230\u73ed\u3001\u77ed\u5267\u8bfe\uff08\u63a8\u6d4b\u4e3a\u7cfb\u5217\u8bfe\u7a0b\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931** |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931** |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931** |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d] (\u63a8\u6d4b)\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002 578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u57fa\u4e8e\u6709\u9650\u4fe1\u606f\uff0c\u65e0\u6cd5\u8fdb\u884c\u6df1\u5c42\u5b9a\u4f4d\u3002\u7528\u6237\u884c\u4e3a\u66f4\u504f\u5411\u4e8e\u5b8c\u6210\u65e2\u5b9a\u5b66\u4e60\u4efb\u52a1\uff0c\u6df1\u5c42\u9700\u6c42\uff08\u793e\u4ea4\u3001\u5c0a\u91cd\u3001\u81ea\u6211\u5b9e\u73b0\uff09\u672a\u66b4\u9732\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**[ \u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u951a\u5b9a ]**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u65e0\u660e\u663e\u8f6f\u808b\u66b4\u9732\u3002\u8868\u73b0\u4e3a\u4e00\u4e2a\u914d\u5408\u5ea6\u9ad8\u7684\u201c\u597d\u5b66\u751f\u201d\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u53ef\u80fd\u662f\u201c\u88ab\u770b\u89c1\u201d\u7684\u5f52\u5c5e\u611f\u6216\u201c\u88ab\u5f15\u5bfc\u201d\u7684\u5b89\u5168\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **[ \u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u5b9a ]** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **[ \u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u5f52T8 \u6f5c\u6c34\u5403\u74dc\u578b ]** (\u57fa\u4e8e\u5176\u88ab\u52a8\u8ddf\u968f\u3001\u4f4e\u4e92\u52a8\u3001\u65e0\u5f3a\u70c8\u8bc9\u6c42\u7684\u7279\u5f81) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1] (\u57fa\u4e8e\u73b0\u6709\u4fe1\u606f\uff0c\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u7b49\u7ea2\u7ebf\u4fe1\u53f7)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a/\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4fe1\u606f\u7f3a\u5931** | **\u4fe1\u606f\u7f3a\u5931** |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u8bfe\u7a0b\u8282\u594f\u8fc7\u5feb\u6216\u65f6\u95f4\u51b2\u7a81\uff0c\u5bfc\u81f4\u4f5c\u4e1a\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u632b\u8d25\u611f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u7528\u6237\u60c5\u7eea\u7a33\u5b9a\uff0c\u6c9f\u901a\u793c\u8c8c\uff0c\u77ed\u671f\u5185\u7834\u9632\u98ce\u9669\u4f4e\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u8bfe\u7a0b\u7ed3\u675f\u540e\u82e5\u672a\u83b7\u5f97\u9884\u671f\u7684\u6280\u80fd\u63d0\u5347\u6216\u63a5\u5355\u673a\u4f1a\uff0c\u53ef\u80fd\u56e0\u201c\u65e0\u7ed3\u679c\u201d\u800c\u5931\u671b\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u8bfe\u7a0b\u4e2d\u540e\u671f\uff08\u7b2c4-6\u5468\uff09\uff0c\u4f5c\u4e1a\u96be\u5ea6\u548c\u6570\u91cf\u589e\u52a0\u65f6\uff1b\u6216\u8bfe\u7a0b\u521a\u7ed3\u675f\uff0c\u53d1\u73b0\u201c\u5b66\u5b8c\u65e0\u7528\u201d\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5b9d\u513f\uff0c\u770b\u4f60\u4e4b\u524d\u4e0a\u8bfe\u7279\u522b\u8ba4\u771f\uff0c\u4f5c\u4e1a\u4e5f\u8ddf\u5f97\u7d27\uff0c\u662f\u54b1\u4eec\u73ed\u7684\u6a21\u8303\u5b66\u5458\u4e86\uff01\u65b0\u9636\u6bb5\u8bfe\u7a0b\u8282\u594f\u4f1a\u5feb\u4e00\u4e9b\uff0c\u4f46\u522b\u62c5\u5fc3\uff0c\u6709\u4efb\u4f55\u5361\u70b9\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u62c6\u89e3\uff0c\u7a33\u7a33\u62ff\u4e0b\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5174\u8da3\u6e38\u4e50\u7ebf\u3011** (\u56e0\u5176\u52a8\u673a\u4e0d\u660e\u786e\uff0c\u5148\u4ee5\u57f9\u517b\u5174\u8da3\u548c\u5b8c\u6210\u5b66\u4e60\u4f53\u9a8c\u4e3a\u4e3b\uff0c\u907f\u514d\u8fc7\u65e9\u65bd\u52a0\u53d8\u73b0\u538b\u529b)\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u201c\u597d\u5b66\u751f\u201d\u7279\u8d28\uff0c\u53ef\u8865\u5145**\u3010\u6210\u5c31\u6fc0\u52b1\u5305\u3011** (\u5982\u4f5c\u4e1a\u4f18\u79c0\u699c\u5355\u3001\u5b66\u4e60\u8fdb\u5ea6\u52cb\u7ae0)\uff0c\u5f3a\u5316\u5176\u6b63\u5411\u5b66\u4e60\u53cd\u9988\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7edd\u4e0d\u5bf9\u5176\u8fdb\u884c\u9ad8\u538b\u9500\u552e\u6216\u5938\u5927\u77ed\u671f\u6536\u76ca\u627f\u8bfa\uff1b\u907f\u514d\u56e0\u5176\u201c\u597d\u8bf4\u8bdd\u201d\u800c\u5ffd\u7565\u6df1\u5ea6\u9700\u6c42\u6316\u6398\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u5b9a\u3010\u4e25\u7981\u5347\u5355\u3011**\uff0c\u76f4\u81f3\u901a\u8fc7\u6df1\u5ea6\u6c9f\u901a\u660e\u786e\u5176\u771f\u5b9e\u52a8\u673a\u548c\u652f\u4ed8\u80fd\u529b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u73ed\u73ed\uff016\u73ed\u70b9\u8bc4\u662f\u4e0d\u662f\u8fd8\u662f\u5468\u65e5\u5468\u4e8c\u5440\u201d (\u4f53\u73b0\u5bf9\u8bfe\u7a0b\u89c4\u5219\u7684\u5173\u6ce8\u548c\u8ddf\u8fdb\u610f\u613f)\n2. > \u201c\u63d0\u4ea4\u4f5c\u4e1a\u7684\u65f6\u5019\u6ca1\u6709\u5468\u4e8c\u7684\u9009\u9879\u4e86[\u82e6\u6da9]\u201d (\u9047\u5230\u64cd\u4f5c\u95ee\u9898\u4e3b\u52a8\u53cd\u9988\uff0c\u4f46\u60c5\u7eea\u5e73\u548c)\n3. > \u201c\u54e6\u54e6\u597d\u5427\u201d (\u9762\u5bf9\u5b89\u6392\u53d8\u52a8\uff0c\u5feb\u901f\u63a5\u53d7\uff0c\u65e0\u62b1\u6028)\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T8 \u6f5c\u6c34\u5403\u74dc\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u4fe1\u606f\u4e0d\u8db3\uff0c\u7591\u4f3c\u57fa\u7840\u5f52\u5c5e\u6216\u6210\u957f\u9700\u6c42\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u4fdd\u6301\u7a33\u5b9a\u3001\u6e05\u6670\u7684\u670d\u52a1\u8282\u594f\uff0c\u53ca\u65f6\u54cd\u5e94\u5176\u64cd\u4f5c\u7591\u95ee\uff0c\u907f\u514d\u5176\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u6216\u201c\u65e0\u6536\u83b7\u201d\u800c\u6c89\u9ed8\u6d41\u5931\u3011**\u3002\n\n```json\n{\"core_type\": \"T8 \u6f5c\u6c34\u5403\u74dc\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u4fe1\u606f\u4e0d\u8db3\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf\"}\n```";
