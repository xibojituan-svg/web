    <script>
        const markdownText = "# \u7528\u6237\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u804a\u5929\u8bb0\u5f55\u4e3b\u8981\u4e3a\u4f53\u9a8c\u8425\u521d\u671f\u4e92\u52a8\uff0c\u7f3a\u4e4f\u6df1\u5ea6\u9700\u6c42\u6316\u6398\u3001\u652f\u4ed8\u51b3\u7b56\u8fc7\u7a0b\u3001\u5bb6\u5ead\u80cc\u666f\u3001\u5177\u4f53\u804c\u4e1a\u4e0e\u6536\u5165\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u7b49\u5173\u952e\u4fe1\u606f\u3002\u65e0\u6cd5\u6267\u884c\u5b8c\u6574\u7684ABCD\u5224\u5b9a\u6811\uff08\u7f3a\u652f\u4ed8\u6838\u67e5\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5\uff09\uff0c\u7528\u6237\u539f\u578b\u5339\u914d\u4e0e\u98ce\u9669\u8bc4\u4f30\u57fa\u4e8e\u6709\u9650\u4fe1\u606f\u63a8\u65ad\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a**\u4e2d\u7b49\u504f\u5b9e\u7528**\u3002\u7528\u6237\u4e3a37\u5c81\u521b\u4e1a\u8005\uff0c\u81ea\u8ff0\u7528AI\u505a\u201c\u5e97\u91cc\u7684\u6d3b\u52a8\u5ba3\u4f20\u548c\u6587\u6848\u201d\uff0c\u8868\u660e\u6709\u660e\u786e\u7684\u5546\u4e1a\u5e94\u7528\u573a\u666f\uff08\u4e3b\u4e1a\u8d4b\u80fd\uff09\u3002\u5bf9\u8bfe\u7a0b\u5185\u5bb9\uff08ComfyUI, SD\uff09\u6709\u4e3b\u52a8\u8be2\u95ee\uff0c\u663e\u793a\u5de5\u5177\u5b66\u4e60\u610f\u56fe\u3002\u4f46\u591a\u6b21\u63d0\u53ca\u201c\u65f6\u95f4\u7cbe\u529b\u662f\u95ee\u9898\u201d\u3001\u201c\u5e97\u91cc\u6700\u5fd9\u201d\uff0c**\u52a8\u673a\u4e2d\u6df7\u6742\u5bf9\u65f6\u95f4\u6295\u5165\u7684\u987e\u8651**\uff0c\u53ef\u80fd\u5f71\u54cd\u957f\u671f\u575a\u6301\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4e2d\u7b49**\u3002\u521b\u4e1a\u8005\u8eab\u4efd\u6697\u793a\u6709\u4e00\u5b9a\u81ea\u4e3b\u65f6\u95f4\u548c\u7ecf\u6d4e\u57fa\u7840\uff08\u53ef\u627f\u62c53980\u5143\u8bfe\u7a0b\uff09\u3002\u5177\u5907\u57fa\u7840AI\u5de5\u5177\u4f7f\u7528\u7ecf\u9a8c\uff08DS\u3001\u8c46\u5305\u7b49\uff09\uff0c\u6709\u521d\u6b65\u5b9e\u64cd\u80fd\u529b\uff08\u5b8c\u6210\u4f5c\u4e1a\u5e76\u83b7\u597d\u8bc4\uff09\u3002\u4f46**\u6bcf\u65e5\u4ec51\u5c0f\u65f6**\u5b66\u4e60\u65f6\u95f4\u6295\u5165\u81ea\u8ff0\uff0c\u662f\u663e\u8457\u8d44\u6e90\u77ed\u677f\u3002\u672a\u63d0\u53ca\u56e2\u961f\u3001\u8bbe\u5907\u7b49\u6df1\u5c42\u8d44\u6e90\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a**\u4e2d\u7b49\u504f\u7a33\u5b9a**\u3002\u6c9f\u901a\u6001\u5ea6\u79ef\u6781\u3001\u914d\u5408\uff08\u56de\u590d\u95ee\u9898\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u4e92\u52a8\uff09\u3002\u5bf9\u65f6\u95f4\u51b2\u7a81\uff08\u76f4\u64ad\u4e0e\u5f00\u5e97\u65f6\u95f4\u51b2\u7a81\uff09\u63d0\u51fa\u52a1\u5b9e\u95ee\u9898\uff08\u201c\u6709\u56de\u653e\u4e48\u201d\uff09\uff0c\u5e76\u5728\u5f97\u5230\u201c\u5c1d\u8bd5\u7533\u8bf7\u201d\u7b54\u590d\u540e\u8868\u793a\u7406\u89e3\u4e0e\u611f\u8c22\uff0c**\u672a\u8868\u73b0\u51fa\u62b1\u6028\u6216\u5f3a\u5bf9\u6297**\u3002\u7528\u201c\u4ec5\u4f9b\u5a31\u4e50\u54c8[\u7834\u6d95\u4e3a\u7b11]\u201d\u56de\u5e94\u4f5c\u4e1a\uff0c\u5fc3\u6001\u8f83\u4e3a\u653e\u677e\uff0c\u4f46\u53ef\u80fd\u9690\u542b\u5bf9\u6210\u679c\u8981\u6c42\u4e0d\u9ad8\u6216\u4fe1\u5fc3\u4e0d\u8db3\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\uff08\u90e8\u5206\u6267\u884c\uff09\n*   **\u6b65\u9aa40\uff08\u652f\u4ed8\u6838\u67e5\uff09**\uff1a**\u65e0\u6cd5\u6838\u67e5**\u3002\u8bb0\u5f55\u672b\u7aef\u7528\u6237\u63d0\u53ca\u201c3980\u201d\u5e76\u6536\u5230\u9500\u552e\u201c\u6536\u5230\u201d\u56de\u590d\uff0c\u4f46\u65e0\u660e\u786e\u652f\u4ed8\u6210\u529f\u622a\u56fe\u6216\u786e\u8ba4\uff0c**\u652f\u4ed8\u72b6\u6001\u672a\u77e5**\u3002\n*   **\u6b65\u9aa41.5\uff08\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5\uff09**\uff1a**\u65e0\u6cd5\u6838\u67e5**\u3002\u65e0\u4efb\u4f55\u5173\u4e8e\u914d\u5076\u3001\u5bb6\u4eba\u610f\u89c1\u6216\u5171\u540c\u51b3\u7b56\u7684\u4fe1\u606f\u3002\n*   **\u6b65\u9aa41\uff08\u9700\u6c42\u4e0e\u75db\u70b9\uff09**\uff1a**B\u7c7b\uff08\u6280\u80fd\u63d0\u5347\u578b\uff09\u7279\u5f81\u660e\u663e**\u3002\u75db\u70b9\u660e\u786e\uff1a\u521b\u4e1a\u5e97\u4e3b\u9700\u5229\u7528AI\u63d0\u5347\u8425\u9500\u6548\u7387\uff08\u5ba3\u4f20\u3001\u6587\u6848\uff09\u3002\u9700\u6c42\u5177\u4f53\uff1a\u60f3\u201c\u6df1\u5ea6\u5b66\u4e00\u4e0b\u201dComfyUI\u3001SD\u7b49\u5de5\u5177\u3002\u5c5e\u4e8e\u5178\u578b\u7684\u201c\u73b0\u6709\u4e1a\u52a1+\u65b0\u6280\u80fd\u8d4b\u80fd\u201d\u6a21\u5f0f\u3002\n*   **\u6b65\u9aa42\uff08\u652f\u4ed8\u80fd\u529b\u4e0e\u610f\u613f\uff09**\uff1a**\u652f\u4ed8\u610f\u613f\u53ef\u89c1**\uff08\u5df2\u8fdb\u5165\u62a5\u4ef7\u73af\u8282\uff09\uff0c**\u652f\u4ed8\u80fd\u529b\u5f85\u786e\u8ba4**\uff08\u521b\u4e1a\u8005\u6536\u5165\u72b6\u51b5\u672a\u77e5\uff09\u3002\n*   **\u6b65\u9aa43/4\uff08\u51b3\u7b56\u5468\u671f\u4e0e\u884c\u52a8\u529b\uff09**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u8bb0\u5f55\u622a\u6b62\u4e8e\u62a5\u4ef7\u73af\u8282\uff0c\u672a\u89c2\u5bdf\u5230\u660e\u663e\u7684\u51b3\u7b56\u72b9\u8c6b\u6216\u50ac\u4fc3\u4fe1\u53f7\u3002\u7528\u6237\u884c\u52a8\u529b\u5c1a\u53ef\uff08\u6309\u65f6\u56de\u590d\u3001\u5b8c\u6210\u4f5c\u4e1a\uff09\u3002\n\n## 3. \u5339\u914d\u7528\u6237\u539f\u578b\n*   **\u6700\u5339\u914d\uff1aT4 \u52a1\u5b9e\u8fdb\u53d6\u578b**\u3002\u5178\u578b\u7279\u5f81\uff1a\u5728\u804c/\u521b\u4e1a\u8005\uff0c\u5b66\u4e60\u76ee\u7684\u660e\u786e\uff08\u63d0\u5347\u4e3b\u4e1a\u6548\u7387\uff09\uff0c\u5173\u6ce8\u5de5\u5177\u5b9e\u64cd\u4e0e\u7ed3\u679c\uff0c\u65f6\u95f4\u5b9d\u8d35\u3002\u7528\u6237\u72b6\u6001\u9ad8\u5ea6\u543b\u5408\u3002\n*   **\u6b21\u5339\u914d\uff1aT7 \u8c28\u614e\u89c2\u671b\u578b**\u3002\u7279\u5f81\uff1a\u5bf9\u6295\u5165\u4ea7\u51fa\u6bd4\u654f\u611f\uff0c\u4f1a\u53cd\u590d\u786e\u8ba4\u7ec6\u8282\uff08\u5982\u56de\u653e\uff09\u3002\u7528\u6237\u591a\u6b21\u8be2\u95ee\u56de\u653e\u3001\u5173\u6ce8\u65f6\u95f4\u6295\u5165\uff0c\u5e26\u6709\u4e00\u5b9a\u89c2\u671b\u8272\u5f69\uff0c\u4f46\u8fdb\u53d6\u5fc3\u66f4\u5f3a\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\uff08\u4e2d\uff09\n\u57fa\u4e8e\u6709\u9650\u4fe1\u606f\u9010\u9879\u6392\u67e5\uff1a\n1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u76ee\u6807\u5177\u4f53\uff08\u5e97\u91cc\u5ba3\u4f20\uff09\uff0c\u82e5\u8bfe\u7a0b\u65e0\u6cd5\u5feb\u901f\u5e94\u7528\u4e8e\u5176\u4e1a\u52a1\u573a\u666f\uff0c\u6613\u4ea7\u751f\u843d\u5dee\u3002\n2.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u9ad8\u98ce\u9669**\u3002**\u7528\u6237\u5df2\u660e\u786e\u8868\u793a\u201c\u65f6\u95f4\u521a\u597d\u662f\u6211\u5e97\u91cc\u6700\u5fd9\u7684\u65f6\u5019\u201d**\uff0c\u4e14\u6bcf\u65e5\u4ec51\u5c0f\u65f6\u5b66\u4e60\u65f6\u95f4\u3002\u76f4\u64ad\u8bfe\u65e0\u56de\u653e\uff08\u6216\u56de\u653e\u96be\u7533\u8bf7\uff09\u4e0e\u6b64\u4e25\u91cd\u51b2\u7a81\uff0c\u662f\u6700\u5927\u7684\u6f5c\u5728\u9000\u8d39\u89e6\u53d1\u70b9\u3002\n3.  **\u5185\u5bb9\u4e0d\u7b26**\uff1a\u4f4e\u98ce\u9669\u3002\u7528\u6237\u5df2\u4e86\u89e3\u8bfe\u7a0b\u6559CU\u548cSD\uff0c\u5185\u5bb9\u9884\u671f\u5339\u914d\u3002\n4.  **\u670d\u52a1\u4f53\u9a8c**\uff1a\u4f4e\u98ce\u9669\u3002\u76ee\u524d\u9500\u552e\u670d\u52a1\u54cd\u5e94\u53ca\u65f6\uff0c\u5173\u7cfb\u826f\u597d\u3002\n5.  **\u7ecf\u6d4e\u538b\u529b**\uff1a\u672a\u77e5\u98ce\u9669\u3002\u521b\u4e1a\u8005\u6536\u5165\u6ce2\u52a8\u6027\u672a\u77e5\u3002\n6.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a\u672a\u77e5\u98ce\u9669\u3002\n7.  **\u7ade\u54c1\u6bd4\u8f83/\u51b2\u52a8\u6d88\u8d39**\uff1a\u4f4e\u98ce\u9669\u3002\u7528\u6237\u6709\u4e3b\u52a8\u4e86\u89e3\u884c\u4e3a\uff0c\u975e\u7eaf\u51b2\u52a8\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u57fa\u672c\u5408\u89c4**\uff1a\u9500\u552e\u8fc7\u7a0b\u4ee5\u4ecb\u7ecd\u8bfe\u7a0b\u3001\u8d44\u6e90\u3001\u53d8\u73b0\u524d\u666f\u4e3a\u4e3b\uff0c\u672a\u53d1\u73b0\u660e\u663e\u5938\u5927\u627f\u8bfa\u6216\u6050\u5413\u3002\n*   **\u6f5c\u5728\u98ce\u9669\u70b9**\uff1a\n    *   **\u201c\u65e0\u56de\u653e\u201d\u7b56\u7565\u4e0e\u7528\u6237\u65f6\u95f4\u51b2\u7a81**\uff1a\u9500\u552e\u4ec5\u627f\u8bfa\u201c\u5c1d\u8bd5\u5355\u72ec\u7533\u8bf7\u201d\uff0c\u672a\u6839\u672c\u89e3\u51b3\u7528\u6237\u6838\u5fc3\u75db\u70b9\uff0c\u53ef\u80fd\u6784\u6210**\u9690\u6027\u65bd\u538b**\uff0c\u5b58\u5728\u4f26\u7406\u4e89\u8bae\u3002\n    *   **\u5de5\u4f5c\u5ba4\u8d44\u6e90\u8bf1\u5bfc**\uff1a\u5f3a\u8c03\u201c\u5185\u90e8\u5de5\u4f5c\u5ba4\u201d\u3001\u201c\u72ec\u5bb6\u8d44\u6e90\u201d\u3001\u201c\u5546\u5355\u901a\u9053\u201d\uff0c\u53ef\u80fd\u8425\u9020\u7a00\u7f3a\u611f\u548c\u793e\u7fa4\u5f52\u5c5e\u611f\u8fdb\u884c\u4fc3\u5355\uff0c\u9700\u6ce8\u610f\u662f\u5426\u8fc7\u5ea6\u627f\u8bfa\u8d44\u6e90\u4e0e\u6536\u76ca\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6838\u5fc3\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9996\u8981\u89e3\u51b3\u65f6\u95f4\u51b2\u7a81**\uff1a\u73ed\u4e3b\u4efb\u5fc5\u987b\u4e3b\u52a8\u3001\u660e\u786e\u5730\u4e3a\u5176\u89e3\u51b3\u76f4\u64ad\u56de\u653e\u95ee\u9898\uff0c\u6216\u63d0\u4f9b\u5b8c\u6574\u5f55\u64ad\u8d44\u6e90\u3002\u8fd9\u662f\u7ef4\u7cfb\u8be5\u7528\u6237\u3001\u964d\u4f4e\u9000\u8d39\u98ce\u9669\u7684\u5173\u952e\u3002\n    2.  **\u5f3a\u5316\u201c\u4e3b\u4e1a\u8d4b\u80fd\u201d\u94fe\u63a5**\uff1a\u6c9f\u901a\u4e2d\u6301\u7eed\u5c06\u5176\u5b66\u4e60\u5185\u5bb9\uff08\u5982AI\u751f\u56fe\u3001\u77ed\u89c6\u9891\uff09\u4e0e\u5176\u201c\u5e97\u94fa\u6d3b\u52a8\u5ba3\u4f20\u201d\u573a\u666f\u7ed3\u5408\uff0c\u5e03\u7f6e\u4e0e\u5176\u884c\u4e1a\u76f8\u5173\u7684\u5b9e\u6218\u4f5c\u4e1a\uff0c\u8ba9\u5176\u5feb\u901f\u611f\u53d7\u5230\u5b66\u4ee5\u81f4\u7528\u3002\n    3.  **\u7ba1\u7406\u9884\u671f\uff0c\u805a\u7126\u77ed\u671f\u6210\u679c**\uff1a\u907f\u514d\u8fc7\u5ea6\u6e32\u67d3\u201c\u9ad8\u989d\u5546\u5355\u201d\uff0c\u8f6c\u800c\u5f3a\u8c03\u201c\u63d0\u5347\u5e97\u94fa\u5ba3\u4f20\u7269\u6599\u6548\u7387\u4e0e\u8d28\u91cf\u201d\u7b49\u8fd1\u671f\u53ef\u8fbe\u6210\u76ee\u6807\u3002\u80af\u5b9a\u5176\u4f5c\u4e1a\u4e2d\u7684\u201c\u70ed\u70b9\u601d\u7ef4\u201d\u3002\n    4.  **\u63d0\u4f9b\u7075\u6d3b\u5b66\u4e60\u8def\u5f84**\uff1a\u9274\u4e8e\u5176\u6bcf\u65e5\u4ec51\u5c0f\u65f6\uff0c\u9700\u5e2e\u52a9\u5176\u89c4\u5212\u788e\u7247\u5316\u5b66\u4e60\u65b9\u6848\uff0c\u5f3a\u8c03\u7cfb\u7edf\u8bfe\u4e2d\u7684\u5f55\u64ad\u90e8\u5206\u53ef\u81ea\u7531\u5b89\u6392\u65f6\u95f4\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**\uff1a\n    *   **\u6302\u8f7d\u4e50\u9ad8\u7ebf**\uff1a\u4f18\u5148\u63a8\u8350 **\u201c\u6280\u80fd\u5e94\u7528\u4e50\u9ad8\u7ebf\u201d**\uff0c\u4fa7\u91cd\u5de5\u5177\u5b9e\u64cd\u3001\u6848\u4f8b\u62c6\u89e3\u3001\u4e0e\u7535\u5546/\u672c\u5730\u751f\u6d3b\u573a\u666f\u7ed3\u5408\u7684\u6a21\u5757\u3002\n    *   **\u614e\u63a8\u4e50\u9ad8\u7ebf**\uff1a\u907f\u514d\u8fc7\u65e9\u5f3a\u63a8\u201c\u5546\u4e1a\u53d8\u73b0\u4e50\u9ad8\u7ebf\u201d\uff08\u5982\u5bc6\u96c6\u5546\u5355\u8bad\u7ec3\u8425\uff09\uff0c\u4ee5\u514d\u52a0\u91cd\u5176\u65f6\u95f4\u7126\u8651\u6216\u4ea7\u751f\u4e0d\u5207\u5b9e\u9645\u7684\u6536\u76ca\u9884\u671f\u3002\n\n{\"core_type\": \"T4 \u52a1\u5b9e\u8fdb\u53d6\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\uff08\u80fd\u529b\u63d0\u5347/\u4e1a\u52a1\u53d1\u5c55\uff09\", \"target_product_line\": \"\u6280\u80fd\u5e94\u7528\u4e50\u9ad8\u7ebf\", \"age\": \"37\u5c81\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}";
