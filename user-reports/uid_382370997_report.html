        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u60dc\u5e0c (UID: 382370997) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-10 \u81f3 2026-03-20 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u76ae\u86cb\u4e0d\u5410\u76ae(\u5468\u598d) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u7cbe\u82f1\u8bfe\uff08\u5df2\u8d2d\uff09\uff0c\u9ad8\u9636\u8bfe\uff08\u5df2\u62a5\uff09\uff0cMK4\u8bbe\u5907\uff08\u5df2\u8d2d\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u5168\u6b3e\u5145\u88d5**\uff08\u6709\u80fd\u529b\u8d2d\u4e70\u6570\u5343\u5143\u8bbe\u5907\uff0c\u672a\u63d0\u53ca\u8d44\u91d1\u538b\u529b\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u4e0a\u73ed\u65cf\uff0c\u5229\u7528\u5348\u4f11\u3001\u4e0b\u73ed\u540e\u65f6\u95f4\uff0c\u5766\u8a00\u201c\u5de5\u4f5c\u5f00\u59cb\u5fd9\u8d77\u6765\u4e86\u201d\u3001\u201c\u6295\u5165\u65f6\u95f4\u5f00\u59cb\u5c11\u4e86\u201d\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\uff08\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u4eba\u4fe1\u606f\uff0c\u65e0\u6cd5\u5224\u65ad\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u5b66\u4e60\u4e92\u52a8\u3001\u8bbe\u5907\u8d2d\u4e70\u3001\u65f6\u95f4\u7126\u8651\u7b49\u5173\u952e\u4fe1\u606f\u5145\u8db3\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u6709\u660e\u786e\u7684\u53d8\u73b0\u671f\u5f85\uff08\u5173\u5fc3\u8d5b\u9053\u3001\u8bbe\u5907\u9009\u62e9\uff09\uff0c\u4f46\u540c\u6837\u5173\u6ce8\u6280\u80fd\u672c\u8eab\uff08\u53d1\u97f3\u3001\u9891\u8c31\u3001\u60c5\u7eea\uff09\uff0c\u4e14\u5bf9\u5b66\u4e60\u8fc7\u7a0b\u6709\u8010\u5fc3\uff0c\u613f\u610f\u201c\u57fa\u7840\u4e0d\u7262\u5730\u52a8\u5c71\u6447\u201d\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u73ed\u73ed \u6211\u8fd8\u4e0d\u6e05\u695a\u81ea\u5df1\u6700\u7ec8\u80fd\u4e0d\u80fd\u5b66\u597d \u4e5f\u4e0d\u592a\u6e05\u695a\u6700\u7ec8\u80fd\u9009\u5565\u8d5b\u9053 \u4e0d\u77e5\u9053\u81ea\u5df1\u8981\u4e0d\u8981\u4e70\u8bbe\u5907[\u6342\u8138]\u201d > \u201c\u57fa\u7840\u4e0d\u7262\u5730\u52a8\u5c71\u6447 \u6211\u60f3\u7740\u7cbe\u82f1\u8bfe\u6211\u8981\u662f\u6ca1\u8ddf\u4e0a\u8bfe\u7a0b\u7684\u8bdd \u5c31\u5148\u8bfe\u4e0b\u770b\u56de\u653e\u591a\u5b66\u5b66 \u5b66\u5f97\u5dee\u4e0d\u9519\u4e86\u518d\u8fdb\u5165\u9ad8\u9636\u8bfe\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u2b06\u9ad8]** \u2014 \u5df2\u8d2d\u4e70\u8bfe\u7a0b\u53ca\u6570\u5343\u5143\u4e13\u4e1a\u8bbe\u5907\uff0c\u672a\u8868\u73b0\u51fa\u4efb\u4f55\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**[\u2b07\u4f4e]** \u2014 **\u6838\u5fc3\u77ed\u677f**\u3002\u591a\u6b21\u63d0\u53ca\u5de5\u4f5c\u5fd9\u3001\u65f6\u95f4\u5c11\u3001\u8bfe\u7a0b\u843d\u4e0b\u3001\u7126\u8651\u8ddf\u4e0d\u4e0a\u3002\u5178\u578b\u4e0a\u73ed\u65cf\uff0c\u5b66\u4e60\u65f6\u95f4\u9700\u201c\u6324\u201d\u548c\u201c\u62fc\u51d1\u201d\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u4fe1\u606f\u7f3a\u5931]** \u2014 \u804a\u5929\u8bb0\u5f55\u5b8c\u5168\u672a\u63d0\u53ca\uff0c\u65e0\u6cd5\u5224\u65ad\uff0c\u9700\u540e\u7eed\u63a2\u67e5\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b07\u4f4e\u6781\u5371]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u9891\u8c31\u3001\u7f3a\u9891\uff09\u4f1a\u53cd\u590d\u8ffd\u95ee\u7ec6\u8282\uff0c\u8868\u73b0\u51fa\u5bf9\u201c\u6b63\u786e\u6027\u201d\u7684\u8fc7\u5ea6\u7126\u8651\u3002**\u6700\u663e\u8457\u4fe1\u53f7**\uff1a\u5728\u8bfe\u7a0b\u538b\u529b\u4e0b\uff0c\u9891\u7e41\u8868\u8fbe\u201c\u597d\u6015\u81ea\u5df1\u6ca1\u65f6\u95f4\u5b66 \u8ddf\u4e0d\u4e0a\u201d\u3001\u201c\u786e\u5b9e\u6709\u70b9\u538b\u529b\u5927 \u6709\u70b9\u7126\u8651\u4e86\u201d\uff0c\u5e76\u4e3b\u52a8\u5bfb\u6c42\u73ed\u4e3b\u4efb\u7684\u5b89\u629a\u548c\u89e3\u51b3\u65b9\u6848\uff08\u5ef6\u671f\u8bfe\u7a0b\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u611f\u89c9\u540c\u5b66\u4eec\u90fd\u80fd\u8ddf\u4e0a\u65e9\u529f\u7ec3\u4e60\u5565\u7684 \u6211\u4e0a\u5468\u7684\u8bfe\u8fd8\u6709\u843d\u4e0b\u7684\u5462[\u6342\u8138][\u6342\u8138]\u201d > \u201c\u597d\u6015\u81ea\u5df1\u6ca1\u65f6\u95f4\u5b66 \u8ddf\u4e0d\u4e0a\u201d > \u201c\u786e\u5b9e\u6709\u70b9\u538b\u529b\u5927 \u6709\u70b9\u7126\u8651\u4e86[\u6342\u8138]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u201c\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\u201d\u548c\u201c\u843d\u540e\u4e8e\u4ed6\u4eba\u201d\u7684\u6df1\u5ea6\u6050\u60e7**\u3002\u5979\u7684\u7126\u8651\u5e76\u975e\u6e90\u4e8e\u751f\u5b58\u538b\u529b\uff0c\u800c\u662f\u6e90\u4e8e\u5728\u96c6\u4f53\u5b66\u4e60\u73af\u5883\u4e2d\uff0c\u56e0\u65f6\u95f4\u4e0d\u8db3\u5bfc\u81f4\u7684\u201c\u6389\u961f\u201d\u98ce\u9669\uff0c\u8fd9\u5a01\u80c1\u5230\u4e86\u5979\u7684**\u5b89\u5168\u611f\u548c\u81ea\u6211\u4ef7\u503c\u786e\u8ba4**\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6301\u7eed\u3001\u5177\u4f53\u3001\u53ef\u6267\u884c\u7684\u201c\u8fdb\u5ea6\u4fdd\u969c\u201d\u4e0e\u201c\u60c5\u7eea\u515c\u5e95\u201d**\u3002\u5979\u9700\u8981\u88ab\u660e\u786e\u544a\u77e5\u201c\u843d\u540e\u4e86\u4e5f\u6ca1\u5173\u7cfb\uff0c\u6709\u89e3\u51b3\u65b9\u6848\u201d\uff0c\u5e76\u5f97\u5230\u73ed\u4e3b\u4efb\u65e0\u6761\u4ef6\u7684\u63a5\u7eb3\u548c\u9f13\u52b1\uff0c\u4ee5\u7f13\u89e3\u5176\u56e0\u6bd4\u8f83\u800c\u4ea7\u751f\u7684\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1 \u7c7b** (\u52a8\u673a\u4e2d\u7b49\uff0c\u8d44\u6e90\u5e95\u5ea7\u5b58\u5728\u660e\u663e\u77ed\u677f\uff0c\u5fc3\u7406\u5f39\u6027\u6781\u4f4e) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u6838\u5fc3\u7279\u5f81\uff1a\u9ad8\u7126\u8651\u3001\u4f4e\u81ea\u4fe1\u3001\u5f3a\u4f9d\u8d56\u3001\u6613\u56e0\u8fdb\u5ea6\u538b\u529b\u800c\u5d29\u6e83) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u65e0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5c5e\u53cd\u5bf9\u7b49\u8ff9\u8c61)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e (\u4fe1\u606f\u7f3a\u5931) | \u672a\u77e5\uff0c\u9700\u63a2\u67e5\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u4e00\u65e6\u5de5\u4f5c\u66f4\u5fd9\u6216\u8bfe\u7a0b\u96be\u5ea6\u9661\u589e\uff0c\u5176\u201c\u6324\u65f6\u95f4\u201d\u6a21\u5f0f\u5d29\u6e83\uff0c\u7d2f\u79ef\u7684\u843d\u540e\u548c\u81ea\u8d23\u60c5\u7eea\u4f1a\u77ac\u95f4\u5f15\u7206\u9000\u8d39\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u9ad8** | \u5728\u72ec\u7acb\u5b8c\u6210\u6280\u672f\u64cd\u4f5c\uff08\u5982\u8bbe\u5907\u8c03\u8bd5\u3001\u8f6f\u4ef6\u4f7f\u7528\uff09\u6216\u6536\u5230\u4e0d\u591f\u201c\u5177\u4f53\u201d\u7684\u4f5c\u4e1a\u70b9\u8bc4\u65f6\uff0c\u5bb9\u6613\u56e0\u201c\u5b66\u4e0d\u4f1a\u201d\u3001\u201c\u641e\u4e0d\u5b9a\u201d\u800c\u81ea\u5c0a\u5fc3\u53d7\u632b\uff0c\u4ea7\u751f\u653e\u5f03\u5ff5\u5934\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u82e5\u5728\u4e2d\u671f\uff08\u5982\u7b2c4-6\u5468\uff09\u4ecd\u672a\u611f\u53d7\u5230\u660e\u663e\u6280\u80fd\u63d0\u5347\u6216\u63a5\u5230\u8bd5\u97f3\u673a\u4f1a\uff0c\u4f1a\u52a0\u5267\u5176\u201c\u6d6a\u8d39\u65f6\u95f4\u201d\u7684\u7126\u8651\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c3-4\u5468**\u3002\u6b64\u65f6\u8bfe\u7a0b\u5185\u5bb9\u52a0\u6df1\uff0c\u4f5c\u4e1a\u8981\u6c42\u63d0\u9ad8\uff0c\u800c\u5979\u56e0\u5de5\u4f5c\u7e41\u5fd9\u53ef\u80fd\u5df2\u7d2f\u79ef\u591a\u8282\u8bfe\u7a0b\u672a\u5b66\uff0c\u632b\u8d25\u611f\u8fbe\u5230\u9876\u5cf0\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> **\u201c\u60dc\u5e0c\uff0c\u770b\u5230\u4f60\u4e3a\u5b66\u4e60\u6295\u5165\u4e86\u8fd9\u4e48\u591a\uff0c\u771f\u7684\u7279\u522b\u68d2\uff01\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u7a0b\u8bbe\u8ba1\u5c31\u662f\u4e3a\u4e0a\u73ed\u65cf\u51c6\u5907\u7684\uff0c**\u8fdb\u5ea6\u5b8c\u5168\u4e2a\u6027\u5316**\u3002\u4f60\u4e0d\u7528\u62c5\u5fc3\u843d\u4e0b\uff0c\u6211\u4eec\u7684\u8bfe\u7a0b\u662f\u6c38\u4e45\u56de\u653e\uff0c\u73ed\u73ed\u6211\u4e5f\u4f1a\u4e00\u76f4\u966a\u7740\u4f60\uff0c\u6839\u636e\u4f60\u7684\u65f6\u95f4\u8282\u594f\u6765\u8c03\u6574\u5b66\u4e60\u8ba1\u5212\u3002\u54b1\u4eec\u4e0d\u8ddf\u522b\u4eba\u6bd4\uff0c\u53ea\u8ddf\u6628\u5929\u7684\u81ea\u5df1\u6bd4\uff0c\u54ea\u6015\u6bcf\u5929\u53ea\u8fdb\u6b65\u4e00\u70b9\u70b9\uff0c\u5c31\u662f\u80dc\u5229\uff01\u201d**\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf**\u3011\u3002\u6838\u5fc3\u76ee\u6807\u662f\u964d\u4f4e\u5176\u5b66\u4e60\u538b\u529b\uff0c\u7ef4\u6301\u5b66\u4e60\u4fe1\u5fc3\u548c\u7c98\u6027\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u5f3a\u70c8\u8865\u5145\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u5305\u62ec\uff1a1\uff09\u4e2a\u6027\u5316\u8fdb\u5ea6\u89c4\u5212\u8868\uff08\u975e\u5f3a\u5236\uff09\uff1b2\uff09\u7b80\u5316\u7248\u4f5c\u4e1a\u9009\u9879\uff08\u5982\u201c\u5b8c\u621050%\u5373\u53ef\u83b7\u5f97\u70b9\u8bc4\u201d\uff09\uff1b3\uff09\u9ad8\u9891\u3001\u5177\u4f53\u5316\u7684\u9f13\u52b1\u8bdd\u672f\uff08\u9488\u5bf9\u5176\u6bcf\u4e00\u4e2a\u5fae\u5c0f\u8fdb\u6b65\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5728\u7fa4\u5185\u516c\u5f00\u8868\u626c\u5176\u4ed6\u5b66\u5458\u7684\u8fdb\u5ea6\u6216\u4f5c\u4e1a\u5b8c\u6210\u60c5\u51b5**\uff0c\u907f\u514d\u5f15\u53d1\u5176\u6bd4\u8f83\u7126\u8651\u3002\n    2. **\u7edd\u4e0d\u5e03\u7f6e\u590d\u6742\u3001\u8017\u65f6\u7684\u786c\u6838\u6280\u672f\u4efb\u52a1**\uff08\u5982\u590d\u6742\u7684AU\u540e\u671f\uff09\uff0c\u9664\u975e\u5979\u4e3b\u52a8\u8981\u6c42\u4e14\u63d0\u4f9b\u624b\u628a\u624b\u6307\u5bfc\u3002\n    3. **\u7edd\u4e0d\u5bf9\u5176\u4f7f\u7528\u4efb\u4f55\u65bd\u538b\u6216\u6fc0\u5c06\u6cd5\u8bdd\u672f**\uff08\u5982\u201c\u522b\u4eba\u90fd\u5b8c\u6210\u4e86\u4f60\u600e\u4e48\u8fd8\u6ca1\u4ea4\u201d\uff09\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5347\u5355**\u3002\u5728\u5b8c\u6210\u5f53\u524d\u8bfe\u7a0b\u5e76\u83b7\u5f97\u7a33\u5b9a\u3001\u79ef\u6781\u7684\u60c5\u7eea\u53cd\u9988\u524d\uff0c\u4efb\u4f55\u65b0\u7684\u8bfe\u7a0b\u63a8\u8350\u90fd\u4f1a\u52a0\u5267\u5176\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u7126\u8651\uff0c\u6781\u6613\u5bfc\u81f4\u5168\u7ebf\u5d29\u76d8\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u597d\u6015\u81ea\u5df1\u6ca1\u65f6\u95f4\u5b66 \u8ddf\u4e0d\u4e0a\u201d\n2. > \u201c\u786e\u5b9e\u6709\u70b9\u538b\u529b\u5927 \u6709\u70b9\u7126\u8651\u4e86[\u6342\u8138]\u201d\n3. > \u201c\u611f\u89c9\u540c\u5b66\u4eec\u90fd\u80fd\u8ddf\u4e0a\u65e9\u529f\u7ec3\u4e60\u5565\u7684 \u6211\u4e0a\u5468\u7684\u8bfe\u8fd8\u6709\u843d\u4e0b\u7684\u5462[\u6342\u8138][\u6342\u8138]\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u4e0e\u4fdd\u969c\uff08\u907f\u514d\u6389\u961f\u548c\u5931\u8d25\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u5ea6\u67d4\u6027\u7684\u5b66\u4e60\u8fdb\u5ea6\u89c4\u5212\u548c\u5bc6\u96c6\u7684\u60c5\u7eea\u4ef7\u503c\u704c\u6ce8\uff0c\u5265\u79bb\u4e00\u5207\u7ade\u4e89\u548c\u538b\u529b\u6e90\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"maslow_need\": \"\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\", \"risk_level\": \"\u9ad8\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
