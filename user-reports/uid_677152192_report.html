    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4ee5\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\u7684\u8eab\u4efd\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID: 677152192\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677152192 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-06 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6709\u58f0\u5c0f\u6e146(\u4e8e\u53cc\u53cc) / \u5b98\u65b9\u52a9\u6559-\u68a6\u5883(\u4e8e\u53cc\u53cc) / \u4e00\u975e(\u5434\u4e00\u975e) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u5b98\u65b9\u62db\u52df\u8bad\u7ec3\u8425\uff08\u5df2\u62a5\u540d\u9ad8\u9636\u73ed\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\uff0c\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u4e0e\u91d1\u989d\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u5b58\u5728\u501f\u8d37\u9690\u60a3\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u4e3a\u5f85\u4ea7\u5b55\u5987\uff08\u201c\u53ea\u6709\u51e0\u5929\u5c31\u5feb\u751f\u5b9d\u5b9d\u4e86\u201d\uff09\uff0c\u672a\u67651-2\u4e2a\u6708\u5c06\u8fdb\u5165\u4ea7\u8925\u671f\uff0c\u65f6\u95f4\u6781\u5ea6\u788e\u7247\u5316\u4e14\u7cbe\u529b\u53d7\u9650\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\uff0c\u4f46\u5b55\u671f\u53ca\u4ea7\u540e\u51b3\u7b56\u53ef\u80fd\u53d7\u5bb6\u5ead\u5f71\u54cd\uff0c\u5b58\u5728\u6f5c\u5728\u98ce\u9669\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u6709\u660e\u786e\u76ee\u7684\u548c\u8eab\u4efd\u4fe1\u606f\uff0c\u4f46\u7f3a\u4e4f\u6df1\u5ea6\u4e92\u52a8\u4e0e\u60c5\u7eea\u8868\u8fbe\uff0c\u5bf9\u5173\u952e\u51b3\u7b56\u70b9\uff08\u5982\u8d39\u7528\u3001\u6536\u76ca\uff09\u7684\u8ffd\u95ee\u4e0d\u591f\u6df1\u5165\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34(\u4e2d)**\u3002\u660e\u786e\u8868\u8fbe\u201c\u5b66\u4e60\u8d5a\u94b1\u201d\u7684\u53d8\u73b0\u76ee\u7684\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u201c\u51e0\u5929\u5185\u5fc5\u987b\u53d8\u73b0\u201d\u7684\u6781\u7aef\u7126\u8651\u3002\u5728\u9500\u552e\u5f15\u5bfc\u4e0b\uff0c\u5bf9\u201c\u5f55\u4e66\u201d\u3001\u201c\u753b\u672c\u201d\u7b49\u5177\u4f53\u5de5\u4f5c\u5185\u5bb9\u8868\u73b0\u51fa\u5174\u8da3\uff0c\u52a8\u673a\u4e2d\u6df7\u6742\u4e86\u63a2\u7d22\u548c\u5b9e\u9645\u6536\u76ca\u7684\u8003\u91cf\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6765\u8fd9\u91cc\u7684\u76ee\u7684\u662f\u4ec0\u4e48\u5462\uff1f\u5b66\u4e60\u8d5a\u94b1\u201d > \u201c\u5fc5\u987b\u52a0\u5165\u5b98\u65b9\u5e73\u53f0\u624d\u53ef\u4ee5\u5f55\u4e66\u662f\u4e0d\u8001\u5e08\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[**\u4fe1\u606f\u4e0d\u8db3**] \u2014 \u672a\u63d0\u53ca\u8d22\u52a1\u72b6\u51b5\uff0c\u4f46\u4f5c\u4e3a\u5f85\u4ea7\u5b55\u5987\uff0c\u672a\u6765\u4e00\u6bb5\u65f6\u95f4\u5bb6\u5ead\u6536\u5165\u53ef\u80fd\u4e3b\u8981\u4f9d\u8d56\u4f34\u4fa3\uff0c\u8d44\u91d1\u538b\u529b\u53ef\u80fd\u589e\u5927\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[**\u2b07\u4f4e**] \u2014 **\u6838\u5fc3\u77ed\u677f**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u53ea\u6709\u51e0\u5929\u5c31\u5feb\u751f\u5b9d\u5b9d\u4e86\u201d\uff0c\u5e76\u62c5\u5fc3\u201c\u5750\u6708\u5b50\u7684\u65f6\u5019\u4e0a\u4e0d\u4e86\u8bfe\u201d\u3002\u4ea7\u8925\u671f\u53ca\u65b0\u751f\u513f\u7167\u6599\u5c06\u4e25\u91cd\u6324\u5360\u5176\u5b66\u4e60\u65f6\u95f4\u548c\u7cbe\u529b\uff0c\u5c5e\u4e8e\u5178\u578b\u7684\u201c\u65f6\u95f4\u6781\u901f\u67af\u7aed\u201d\u573a\u666f\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[**\u4fe1\u606f\u4e0d\u8db3**] \u2014 \u672a\u63d0\u53ca\uff0c\u4f46\u5b55\u671f\u53ca\u4ea7\u540e\u72b6\u6001\u5bf9\u5bb6\u5ead\u652f\u6301\u5ea6\u8981\u6c42\u6781\u9ad8\uff0c\u662f\u6f5c\u5728\u98ce\u9669\u70b9\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a(\u4e2d)**\u3002\u7528\u6237\u5168\u7a0b\u914d\u5408\u5ea6\u9ad8\uff08\u6309\u65f6\u6253\u5361\u3001\u56de\u590d\u201c\u597d\u7684\u201d\uff09\uff0c\u672a\u8868\u73b0\u51fa\u660e\u663e\u7684\u81ea\u5351\u6216\u5d29\u6e83\u4fe1\u53f7\u3002\u4f46\u5728\u9762\u4e34\u201c\u62a5\u540d\u201d\u8fd9\u4e00\u91cd\u5927\u51b3\u7b56\u65f6\uff0c\u8868\u73b0\u51fa\u660e\u663e\u7684\u72b9\u8c6b\u548c\u4f9d\u8d56\u9500\u552e\u5f15\u5bfc\uff08\u201c\u5728\u72b9\u8c6b\u8981\u4e0d\u8981\u62a5\u540d[\u6342\u8138]\u201d\uff09\uff0c\u9700\u8981\u5916\u90e8\u63a8\u52a8\u548c reassurance\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5728\u72b9\u8c6b\u8981\u4e0d\u8981\u62a5\u540d[\u6342\u8138]\u201d > \u201c\u56e0\u4e3a\u6211\u53ea\u6709\u51e0\u5929\u5c31\u5feb\u751f\u5b9d\u5b9d\u4e86\uff0c\u6240\u4ee5\u6709\u70b9\u7ea0\u7ed3\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u672a\u6765\u6536\u5165\u4e0d\u786e\u5b9a\u6027\u7684\u7126\u8651\u4e0e\u8eab\u4efd\u8f6c\u6362\u671f\u7684\u804c\u4e1a\u7a7a\u7a97\u5371\u673a**\u3002\u4f5c\u4e3a\u5373\u5c06\u751f\u4ea7\u7684\u81ea\u7531\u804c\u4e1a\u8005\uff0c\u5979\u9762\u4e34\u6536\u5165\u4e2d\u65ad\u548c\u804c\u4e1a\u8eab\u4efd\u6a21\u7cca\u7684\u53cc\u91cd\u538b\u529b\uff0c\u5e0c\u671b\u901a\u8fc7\u4e00\u9879\u201c\u65f6\u95f4\u81ea\u7531\u201d\u7684\u526f\u4e1a\u6280\u80fd\uff0c\u4e3a\u4ea7\u540e\u751f\u6d3b\u5efa\u7acb\u4e00\u4efd\u7ecf\u6d4e\u5b89\u5168\u611f\u548c\u804c\u4e1a\u4fdd\u969c\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u53ef\u5b9e\u73b0\u7684\u786e\u5b9a\u6027\u201d\u4e0e\u201c\u88ab\u7406\u89e3\u7684\u5305\u5bb9\u611f\u201d**\u3002\u9700\u8981\u660e\u786e\u544a\u8bc9\u5979\u5b66\u4e60\u8def\u5f84\u3001\u6536\u76ca\u5468\u671f\uff0c\u5e76\u9488\u5bf9\u5176\u7279\u6b8a\u65f6\u671f\uff08\u5750\u6708\u5b50\uff09\u63d0\u4f9b\u7075\u6d3b\u7684\u5b66\u4e60\u65b9\u6848\uff08\u5982\u5ef6\u671f\uff09\uff0c\u6d88\u9664\u5176\u5bf9\u201c\u65e0\u6cd5\u8ddf\u4e0a\u201d\u7684\u6050\u60e7\uff0c\u63d0\u4f9b\u4e00\u79cd\u201c\u5373\u4fbf\u5728\u7279\u6b8a\u65f6\u671f\uff0c\u4e5f\u6709\u8def\u53ef\u8d70\u201d\u7684\u5b89\u5168\u627f\u8bfa\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2 \u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u8bba** (\u4e9a\u79cd\uff1a**\u5bb6\u5ead\u91cd\u8d1f\u62fc\u547d\u578b** - \u5b55\u671f/\u4ea7\u540e\u7279\u6b8a\u9636\u6bb5) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u7b49D\u7c7b\u7ea2\u7ebf\u4fe1\u53f7\u3002**\u4f46\u9700\u9ad8\u5ea6\u8b66\u60d5\u5176\u4ea7\u540e\u56e0\u65f6\u95f4\u7cbe\u529b\u5d29\u6e83\u800c\u5f15\u53d1\u7684\u9000\u8d39\u98ce\u9669\u3002**\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u4ea7\u540e\u5bb6\u4eba\uff08\u5c24\u5176\u662f\u4f34\u4fa3\uff09\u56e0\u80b2\u513f\u538b\u529b\u6216\u4e0d\u7406\u89e3\u800c\u53cd\u5bf9\u5176\u6295\u5165\u65f6\u95f4\u5b66\u4e60\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u65b0\u751f\u513f\u51fa\u751f\u540e\uff0c\u7761\u7720\u5265\u593a\u3001\u8eab\u4f53\u6062\u590d\u3001\u54fa\u4e73\u7b49\u73b0\u5b9e\u538b\u529b\u5c06\u4f7f\u5176\u5b8c\u5168\u65e0\u6cd5\u8ddf\u4e0a\u8bfe\u7a0b\u8282\u594f\u548c\u4f5c\u4e1a\u8981\u6c42\uff0c\u4ea7\u751f\u5f3a\u70c8\u7684\u632b\u8d25\u611f\u548c\u201c\u94b1\u767d\u82b1\u4e86\u201d\u7684\u5ff5\u5934\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u76ee\u524d\u672a\u8868\u73b0\u51fa\u60c5\u7eea\u5de8\u5a74\u7279\u8d28\uff0c\u4f46\u4ea7\u540e\u6fc0\u7d20\u6ce2\u52a8\u53ef\u80fd\u653e\u5927\u60c5\u7eea\u95ee\u9898\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | \u5bf9\u201c\u5b66\u4e60\u7b2c8\u5929\u5f00\u901a\u63a5\u5355\u201d\u62b1\u6709\u8fc7\u9ad8\u671f\u671b\uff0c\u82e5\u5b9e\u9645\u63a5\u5355\u65f6\u95f4\u8fdc\u8d85\u9884\u671f\u6216\u521d\u671f\u6536\u76ca\u6781\u4f4e\uff0c\u6613\u4ea7\u751f\u88ab\u6b3a\u9a97\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u4ea7\u540e\u7b2c1\u4e2a\u6708\uff08\u5750\u6708\u5b50\u671f\u95f4\uff09\u81f3\u7b2c3\u4e2a\u6708**\u3002\u6b64\u9636\u6bb5\u662f\u751f\u7406\u5fc3\u7406\u538b\u529b\u5cf0\u503c\uff0c\u4e5f\u662f\u8bfe\u7a0b\u8ddf\u4e0d\u4e0a\u7684\u96c6\u4e2d\u7206\u53d1\u671f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4eb2\u7231\u7684\uff0c\u9996\u5148\u606d\u559c\u4f60\u5373\u5c06\u8fce\u6765\u65b0\u751f\u547d\uff01\u7279\u522b\u7406\u89e3\u4f60\u73b0\u5728\u65e2\u671f\u5f85\u53c8\u6709\u70b9\u7126\u8651\u7684\u5fc3\u60c5\uff0c\u60f3\u4e3a\u5b9d\u5b9d\u548c\u81ea\u5df1\u591a\u4e00\u4efd\u4fdd\u969c\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u7a0b\u6700\u5927\u7684\u597d\u5904\u5c31\u662f\u2018\u65f6\u95f4\u81ea\u7531\u2019\uff0c**\u6240\u6709\u76f4\u64ad\u90fd\u6709\u56de\u653e\uff0c\u4f5c\u4e1a\u6ca1\u6709\u786c\u6027\u622a\u6b62\u65e5\u671f**\u3002\u6211\u4eec\u5df2\u7ecf\u4e3a\u4f60\u5907\u6ce8\u4e86\u2018\u5b55\u4ea7\u7279\u6b8a\u5173\u6000\u901a\u9053\u2019\uff0c\u5750\u6708\u5b50\u671f\u95f4\u4ee5\u4f11\u517b\u4e3a\u4e3b\uff0c\u5076\u5c14\u542c\u542c\u8bfe\u5c31\u884c\uff0c\u5b8c\u5168\u4e0d\u7528\u62c5\u5fc3\u843d\u4e0b\u3002\u7b49\u4f60\u8eab\u4f53\u6062\u590d\u4e86\uff0c\u6211\u4eec\u518d\u4e00\u8d77\u53d1\u529b\uff0c\u7a33\u7a33\u5730\u628a\u8fd9\u4efd\u6280\u80fd\u53d8\u6210\u4f60\u7684\u5c0f\u91d1\u5e93\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5feb\u901f\u63a5\u5355\u7ebf** (\u964d\u7ef4\u7248)\u3011\u3002\u6838\u5fc3\u76ee\u6807\u4e0d\u662f\u6210\u4e3a\u9876\u5c16\u6f14\u64ad\u5e08\uff0c\u800c\u662f\u5feb\u901f\u638c\u63e1\u201c\u753b\u672c\u201d\u3001\u201c\u5bf9\u8f68\u201d\u7b49\u95e8\u69db\u8f83\u4f4e\u3001\u80fd\u5feb\u901f\u4ea7\u751f\u5fae\u5c0f\u6536\u76ca\u7684\u5c97\u4f4d\u6280\u80fd\uff0c\u5efa\u7acb\u201c\u6211\u80fd\u8d5a\u94b1\u201d\u7684\u6b63\u53cd\u9988\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n    1.  **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305 (\u7279\u79cdC\u6a21\u5757)\u3011**\uff1a\u73ed\u4e3b\u4efb\u9700\u626e\u6f14\u201c\u77e5\u5fc3\u59d0\u59d0\u201d\u89d2\u8272\uff0c\u5b9a\u671f\u5173\u5fc3\u5176\u8eab\u4f53\u548c\u60c5\u7eea\u72b6\u6001\uff0c\u800c\u975e\u5355\u7eaf\u50ac\u4f5c\u4e1a\u3002\n    2.  **\u3010\u5ef6\u671f\u4e0e\u788e\u7247\u5316\u5b66\u4e60\u7279\u6743 (\u964d\u7ef4A\u6a21\u5757)\u3011**\uff1a\u660e\u786e\u544a\u77e5\u5e76\u6267\u884c\u201c\u505c\u8bfe-\u590d\u8bfe\u201d\u673a\u5236\uff0c\u5141\u8bb8\u5176\u6309\u81ea\u8eab\u8282\u594f\u5b66\u4e60\u3002\n    3.  **\u3010\u7cbe\u786e\u6d3e\u5355\u62e6\u622a (B\u6a21\u5757)\u3011**\uff1a\u907f\u514d\u7ed9\u5176\u8fc7\u9ad8\u96be\u5ea6\u7684\u8bd5\u97f3\u4efb\u52a1\uff0c\u4f18\u5148\u63a8\u9001\u201c\u753b\u672c\u201d\u7c7b\u7b80\u5355\u3001\u8017\u65f6\u4e0d\u957f\u7684\u5b9e\u6218\u673a\u4f1a\uff0c\u54ea\u6015\u5355\u4ef7\u4f4e\uff0c\u91cd\u5728\u5efa\u7acb\u4fe1\u5fc3\u548c\u5b8c\u6210\u95ed\u73af\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1.  \u7528\u201c\u6700\u540e\u540d\u989d\u201d\u3001\u201c\u9650\u65f6\u4f18\u60e0\u201d\u7b49\u8bdd\u672f\u5bf9\u5176\u65bd\u52a0\u9ad8\u538b\u903c\u5355\u3002\n    2.  \u5728\u5176\u4ea7\u540e\u521d\u671f\u50ac\u4fc3\u4f5c\u4e1a\u6216\u65bd\u52a0\u4efb\u4f55\u5b66\u4e60\u538b\u529b\u3002\n    3.  \u63cf\u7ed8\u4e0d\u5207\u5b9e\u9645\u7684\u201c\u66b4\u5bcc\u201d\u84dd\u56fe\uff0c\u5fc5\u987b\u8fdb\u884c**\u9006\u5411\u9884\u671f\u7ba1\u7406**\uff0c\u660e\u786e\u544a\u77e5\u6280\u80fd\u79ef\u7d2f\u548c\u63a5\u5355\u7684\u5408\u7406\u5468\u671f\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5347\u5355**\u3002\u5728\u786e\u8ba4\u5176\u5df2\u5b8c\u5168\u9002\u5e94\u6bcd\u4eb2\u89d2\u8272\u5e76\u80fd\u7a33\u5b9a\u5206\u914d\u5b66\u4e60\u65f6\u95f4\u4e4b\u524d\uff0c\u7981\u6b62\u63a8\u8350\u4efb\u4f55\u9ad8\u9636\u3001\u9ad8\u4ef7\u7684\u8bfe\u7a0b\u6216\u8bbe\u5907\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6765\u8fd9\u91cc\u7684\u76ee\u7684\u662f\u4ec0\u4e48\u5462\uff1f**\u5b66\u4e60\u8d5a\u94b1**\u201d\n2. > \u201c\u5728\u72b9\u8c6b\u8981\u4e0d\u8981\u62a5\u540d[\u6342\u8138]\u201d\n3. > \u201c\u56e0\u4e3a\u6211\u53ea\u6709\u51e0\u5929\u5c31\u5feb\u751f\u5b9d\u5b9d\u4e86\uff0c\u6240\u4ee5\u6709\u70b9\u7ea0\u7ed3\u201d -> \u201c\u6211\u662f\u7ea0\u7ed3\u5750\u6708\u5b50\u7684\u65f6\u5019\u4e0a\u4e0d\u4e86\u8bfe\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4 \u641e\u94b1\u7ed3\u679c\u8bba (\u5bb6\u5ead\u91cd\u8d1f\u62fc\u547d\u578b)\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u4ea7\u8925\u671f\u53ca\u672a\u6765\u7684\u7ecf\u6d4e\u5b89\u5168\u4fdd\u969c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u542f\u52a8\u201c\u5b55\u4ea7\u7279\u6b8a\u901a\u9053\u201d\uff0c\u63d0\u4f9b\u7edd\u5bf9\u7075\u6d3b\u7684\u5ef6\u671f\u4e0e\u788e\u7247\u5316\u5b66\u4e60\u65b9\u6848\uff0c\u5e76\u8fdb\u884c\u5f7b\u5e95\u7684\u9006\u5411\u6536\u76ca\u9884\u671f\u7ba1\u7406\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u8bba\u578b (\u5bb6\u5ead\u91cd\u8d1f\u62fc\u547d\u578b)\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf (\u964d\u7ef4\u7248) + \u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
