    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u7f3a\u4e4f\u652f\u4ed8\u91d1\u989d\u3001\u7528\u6237\u5e74\u9f84/\u804c\u4e1a\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u7b49\u5173\u952e\u4fe1\u606f\u3002\n\n---\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u4e2d\u7b49\u504f\u9ad8**\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6709\u58f0\u884c\u4e1a\u7684\u771f\u5b9e\u5174\u8da3\uff08\u201c\u5f88\u559c\u6b22\u201d\u3001\u201c\u5e0c\u671b\u4ee5\u540e\u80fd\u5c06\u8fd9\u4e2a\u884c\u4e1a\u53d8\u6210\u6211\u7684\u4e3b\u4e1a\u201d\uff09\uff0c\u5e76\u4e3b\u52a8\u6295\u5165\u7ec3\u4e60\u3001\u5173\u6ce8\u6280\u5de7\u63d0\u5347\uff08\u5982\u60c5\u7eea\u8868\u8fbe\u3001\u6c14\u606f\uff09\u3002\u4f46\u52a8\u673a\u4e2d**\u53d8\u73b0\u671f\u671b**\u4e0e**\u5174\u8da3\u63a2\u7d22**\u5e76\u5b58\uff0c\u5bf9\u201c\u753b\u672c\u201d\u7b49\u975e\u914d\u97f3\u5c97\u4f4d\u4e5f\u6709\u5173\u6ce8\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u4e2d\u7b49**\u3002\u5177\u5907\u57fa\u7840\u5b66\u4e60\u8bbe\u5907\uff08\u7b14\u8bb0\u672c\u7535\u8111\u3001iPad\u3001\u65b0\u9ea6\u514b\u98ce\uff09\uff0c\u6709\u53ef\u6295\u5165\u7684**\u65f6\u95f4**\uff08\u575a\u6301\u6253\u5361\u3001\u53c2\u4e0e\u76f4\u64ad\uff09\u3002**\u7ecf\u6d4e\u8d44\u6e90\u5b58\u7591**\uff1a\u63d0\u53ca\u201c\u4ece\u6211\u5f1f\u5f1f\u90a3\u5148\u632a\u4e86\u4e00\u4e9b\u201d\uff0c\u6697\u793a\u652f\u4ed8\u538b\u529b\u6216\u8d44\u91d1\u975e\u81ea\u6709\uff0c\u9700\u8b66\u60d5\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u4e2d\u7b49**\u3002\u5b66\u4e60\u6001\u5ea6\u79ef\u6781\uff0c\u80fd\u575a\u6301\u5b8c\u6210\u4f5c\u4e1a\u3001\u4e3b\u52a8\u5bfb\u6c42\u53cd\u9988\u3002\u4f46**\u81ea\u6211\u6548\u80fd\u611f\u4e0d\u7a33\u5b9a**\uff1a\u5bf9\u81ea\u8eab\u55d3\u97f3\u6761\u4ef6\u6709\u987e\u8651\uff08\u201c\u55d3\u97f3\u6709\u70b9\u54d1\u201d\uff09\uff0c\u5bf9\u5b66\u4e60\u6548\u679c\uff08\u201c\u611f\u89c9\u6253\u5206\u8001\u5e08\u597d\u50cf\u662f\u4e3a\u4e86\u9f13\u52b1\u6211\u201d\uff09\u548c\u672a\u6765\u5c31\u4e1a\uff08\u201c\u5bf9\u5b66\u4e60\u540e\u7684\u5c31\u4e1a\u72b6\u51b5\u4e5f\u4e0d\u592a\u4e86\u89e3\u201d\uff09\u5b58\u5728\u7591\u8651\uff0c\u4f9d\u8d56\u5916\u90e8\u80af\u5b9a\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40 \u652f\u4ed8\u6838\u67e5**: **\u5df2\u652f\u4ed8**\uff08\u7528\u6237\u63d0\u4f9b\u4e86\u8ba2\u5355\u7f16\u53f7\uff09\u3002\u4f46\u8d44\u91d1\u6765\u6e90\u4e3a\u201c\u4ece\u5f1f\u5f1f\u90a3\u632a\u4e86\u4e00\u4e9b\u201d\uff0c**\u5bb6\u5ead\u51b3\u7b56\u6743\u4e0e\u652f\u4ed8\u80fd\u529b\u5b58\u7591**\u3002\n*   **\u6b65\u9aa41.5 \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u7f3a\u5931**\u3002\u672a\u63d0\u53ca\u914d\u5076/\u7236\u6bcd\u7b49\u5173\u952e\u51b3\u7b56\u4eba\uff0c\u4f46\u201c\u632a\u94b1\u201d\u884c\u4e3a\u6697\u793a\u53ef\u80fd\u5b58\u5728**\u5bb6\u5ead\u7ecf\u6d4e\u4f9d\u8d56\u6216\u9700\u9690\u7792\u6d88\u8d39**\uff0c\u5c5e**\u9ad8\u98ce\u9669\u4fe1\u53f7**\u3002\n*   **\u6b65\u9aa41 \u52a8\u673a\u7eaf\u5ea6**: M\u22653\u3002\u7528\u6237\u6709\u660e\u786e\u5174\u8da3\u548c\u957f\u671f\u804c\u4e1a\u613f\u666f\u3002\n*   **\u6b65\u9aa42 \u8d44\u6e90\u5e95\u5ea7**: R\u22652\u3002\u5177\u5907\u57fa\u7840\u5b66\u4e60\u6761\u4ef6\u4e0e\u65f6\u95f4\u3002\n*   **\u6b65\u9aa43 \u5fc3\u7406\u5f39\u6027**: E\u22652\u3002\u6709\u884c\u52a8\u529b\uff0c\u4f46\u81ea\u6211\u6000\u7591\u660e\u663e\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**: **B\u7c7b\uff08\u6f5c\u529b\u578b\uff09\u7528\u6237**\u3002\u5174\u8da3\u9a71\u52a8\uff0c\u5177\u5907\u57fa\u7840\u8d44\u6e90\uff0c\u4f46\u5fc3\u7406\u5f39\u6027\u4e00\u822c\u4e14**\u5bb6\u5ead\u8d22\u52a1\u652f\u6301\u5b58\u7591**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**: **T4 \u5174\u8da3\u63a2\u7d22\u8005**\u3002\n    *   **\u4f9d\u636e**: \u6838\u5fc3\u9a71\u52a8\u4e3a\u5174\u8da3\u4e0e\u804c\u4e1a\u8f6c\u578b\u53ef\u80fd\uff08\u201c\u53d8\u6210\u6211\u7684\u4e3b\u4e1a\u201d\uff09\uff0c\u4e3b\u52a8\u5b66\u4e60\u3001\u63d0\u95ee\uff08\u8be2\u95ee\u4e0d\u540c\u8bfe\u7a0b\u533a\u522b\uff09\uff0c\u5bf9\u884c\u4e1a\u6709\u63a2\u7d22\u6b32\u3002\u540c\u65f6\u517c\u5177**T7 \u7ecf\u6d4e\u538b\u529b\u5bfb\u6c42\u8005**\u7684\u90e8\u5206\u7279\u5f81\uff08\u5173\u6ce8\u201c\u753b\u672c\u201d\u7b49\u5feb\u901f\u53d8\u73b0\u5c97\u4f4d\u3001\u632a\u94b1\u652f\u4ed8\uff09\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u98ce\u9669\u7b49\u7ea7**: **\u4e2d\u504f\u9ad8**\u3002\n*   **\u6839\u56e0\u6392\u67e5**:\n    1.  **\u9884\u671f\u7ba1\u7406\u4e0d\u5f53**: \u9500\u552e\u8fc7\u5ea6\u5f3a\u8c03\u201c\u753b\u672c\u63a5\u5355\u201d\u3001\u201c\u526f\u4e1a\u53d8\u73b0\u201d\uff0c\u53ef\u80fd\u62ac\u9ad8\u4e86\u7528\u6237\u5bf9**\u77ed\u671f\u6536\u5165**\u7684\u9884\u671f\u3002\u7528\u6237\u5df2\u8868\u8fbe\u201c\u65e9\u70b9\u63a5\u4e00\u4e9b\u753b\u672c\u7684\u5de5\u4f5c\u201d\u7684\u671f\u671b\u3002\n    2.  **\u6548\u679c\u611f\u77e5\u843d\u5dee**: \u7528\u6237\u5bf9\u81ea\u8eab\u80fd\u529b\uff08\u55d3\u97f3\u3001\u60c5\u7eea\u8868\u8fbe\uff09\u6709\u987e\u8651\uff0c\u82e5\u540e\u7eed\u5b66\u4e60\u8fdb\u5c55\u7f13\u6162\uff0c\u6613\u4ea7\u751f\u201c\u5b66\u4e0d\u4f1a\u201d\u7684\u632b\u6298\u611f\u3002\n    3.  **\u652f\u4ed8\u538b\u529b**: **\u3010\u5173\u952e\u96f7\u533a\u3011** \u201c\u4ece\u5f1f\u5f1f\u90a3\u632a\u94b1\u201d\u652f\u4ed8\uff0c\u5c5e\u4e8e**\u8d44\u91d1\u632a\u7528\u6216\u501f\u8d37\u652f\u4ed8**\uff0c\u662f\u6781\u9ad8\u7684\u9000\u8d39\u98ce\u9669\u70b9\u3002\u4e00\u65e6\u5bb6\u5ead\u77e5\u6653\u6216\u4e2a\u4eba\u7ecf\u6d4e\u7d27\u5f20\uff0c\u9000\u8d39\u538b\u529b\u6781\u5927\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9**: \u652f\u4ed8\u884c\u4e3a\u53ef\u80fd\u672a\u83b7\u5bb6\u5ead\u652f\u6301\uff0c\u5b58\u5728\u540e\u7eed\u88ab\u8981\u6c42\u9000\u8d39\u7684\u98ce\u9669\u3002\n    5.  **\u8bfe\u7a0b\u5339\u914d\u5ea6**: \u7528\u6237\u7ea0\u7ed3\u201c\u7cbe\u82f1\u201d\u4e0e\u201c\u9ad8\u9636\u201d\u8bfe\u7a0b\u7684\u9009\u62e9\uff0c\u9500\u552e\u5df2\u4ecb\u5165\u7535\u8bdd\u6c9f\u901a\uff0c\u82e5\u8bfe\u7a0b\u4ea4\u4ed8\u4e0e\u9884\u671f\u4e0d\u7b26\u53ef\u80fd\u5f15\u53d1\u4e0d\u6ee1\u3002\n    6.  **\u9500\u552e\u8bef\u5bfc**: \u8bb0\u5f55\u4e2d\u9500\u552e\u627f\u8bfa\u201c\u5e2e\u4f60\u4e89\u53d6\u201d\u753b\u672c\u5de5\u4f5c\uff0c\u5b58\u5728**\u8fc7\u5ea6\u627f\u8bfa\u63a5\u5355\u8d44\u6e90**\u7684\u98ce\u9669\u3002\n    7.  **\u670d\u52a1\u4f53\u9a8c**: \u76ee\u524d\u670d\u52a1\u54cd\u5e94\u53ca\u65f6\uff0c\u98ce\u9669\u8f83\u4f4e\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u3010\u5408\u89c4\u95ee\u9898\u3011**:\n    1.  **\u8fc7\u5ea6\u627f\u8bfa\u63a5\u5355**: \u9500\u552e\u63d0\u53ca\u201c\u5e2e\u4f60\u4e89\u53d6\u65e9\u70b9\u63a5\u4e00\u4e9b\u753b\u672c\u7684\u5de5\u4f5c\u201d\uff0c\u6a21\u7cca\u4e86\u201c\u673a\u4f1a\u201d\u4e0e\u201c\u4fdd\u969c\u201d\u7684\u754c\u9650\uff0c**\u6d89\u5acc\u8fc7\u5ea6\u627f\u8bfa\u5c31\u4e1a\u7ed3\u679c**\u3002\n    2.  **\u672a\u5145\u5206\u63d0\u793a\u98ce\u9669**: \u672a\u89c1\u9500\u552e\u5bf9\u201c\u55d3\u97f3\u6761\u4ef6\u9650\u5236\u201d\u3001\u201c\u5b66\u4e60\u66f2\u7ebf\u957f\u201d\u3001\u201c\u517c\u804c\u6536\u5165\u4e0d\u786e\u5b9a\u6027\u201d\u7b49\u8fdb\u884c\u5145\u5206\u98ce\u9669\u544a\u77e5\u3002\n    3.  **\u652f\u4ed8\u80fd\u529b\u5ba1\u6838\u7f3a\u5931**: \u5bf9\u7528\u6237\u201c\u632a\u94b1\u201d\u652f\u4ed8\u7684\u884c\u4e3a\u672a\u8fdb\u884c\u4efb\u4f55\u98ce\u9669\u8be2\u95ee\u6216\u529d\u963b\uff0c**\u672a\u5c65\u884c\u5bf9\u6d88\u8d39\u8005\u7ecf\u6d4e\u72b6\u51b5\u7684\u5ba1\u614e\u6ce8\u610f\u4e49\u52a1**\u3002\n*   **\u4f26\u7406\u9632\u7ebf**: \u9500\u552e\u5229\u7528\u7528\u6237\u5174\u8da3\u548c\u53d8\u73b0\u6e34\u671b\u4fc3\u6210\u8f6c\u5316\uff0c\u5728**\u77e5\u60c5\u540c\u610f**\uff08\u5b66\u4e60\u96be\u5ea6\u3001\u53d8\u73b0\u5468\u671f\uff09\u548c**\u516c\u5e73\u4ea4\u6613**\uff08\u8bc4\u4f30\u652f\u4ed8\u5408\u7406\u6027\uff09\u65b9\u9762\u5b58\u5728\u9690\u60a3\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d**: **\u504f\u5dee**\u3002\u7528\u6237\u5174\u8da3\u5728\u914d\u97f3\uff0c\u4f46\u652f\u4ed8\u538b\u529b\u548c\u53d8\u73b0\u7126\u8651\u4f7f\u5176\u66f4\u5173\u6ce8\u201c\u753b\u672c\u201d\u7b49\u8f85\u52a9\u5c97\u4f4d\u3002\u9700\u8b66\u60d5\u5176\u201c\u4e3b\u4e1a\u201d\u68a6\u60f3\u4e0e\u8bfe\u7a0b\u5b9e\u9645\u57f9\u517b\u8def\u5f84\u53ef\u80fd\u5b58\u5728\u7684\u843d\u5dee\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **24h\u5185\u542f\u52a8\u5bb6\u5ead\u77e5\u60c5\u4e0e\u652f\u4ed8\u80fd\u529b\u6838\u67e5**\u3002\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**:\n    1.  **\u7d27\u6025\u98ce\u63a7**: \u7acb\u5373\u8054\u7cfb\u7528\u6237\uff0c\u4ee5\u201c\u5b8c\u5584\u5b66\u5458\u4fe1\u606f\u3001\u63d0\u4f9b\u4e2a\u6027\u5316\u670d\u52a1\u201d\u4e3a\u7531\uff0c\u6e29\u548c\u63a2\u8be2**\u672c\u6b21\u8d2d\u8bfe\u7684\u5bb6\u5ead\u77e5\u60c5\u60c5\u51b5\u3001\u4e2a\u4eba\u7ecf\u6d4e\u72b6\u51b5\u53ca\u8fd8\u6b3e\u8ba1\u5212**\u3002\u8bc4\u4f30\u662f\u5426\u4e3a\u201c\u501f\u8d37\u5b66\u201d\u3002\n    2.  **\u9884\u671f\u6821\u6b63**: \u9996\u5468\u5185\u5fc5\u987b\u8fdb\u884c\u4e00\u5bf9\u4e00\u6c9f\u901a\uff0c\u660e\u786e\uff1a\n        *   \u55d3\u97f3\u6761\u4ef6\u53ef\u901a\u8fc7\u8bad\u7ec3\u6539\u5584\uff0c\u4f46\u5468\u671f\u8f83\u957f\u3002\n        *   \u201c\u753b\u672c\u201d\u7b49\u5c97\u4f4d\u6709\u5355\uff0c\u4f46\u6536\u5165\u4e0d\u7a33\u5b9a\u4e14\u7ade\u4e89\u6fc0\u70c8\u3002\n        *   \u4ece\u5b66\u4e60\u5230\u7a33\u5b9a\u63a5\u5355\u7684**\u5408\u7406\u65f6\u95f4\u9884\u671f**\uff08\u59823-6\u4e2a\u6708\u4ee5\u4e0a\uff09\u3002\n    3.  **\u5f3a\u5316\u652f\u6301**: \u9488\u5bf9\u5176\u201c\u81ea\u6211\u6000\u7591\u201d\u70b9\uff0c\u5728\u521d\u671f\u7ed9\u4e88\u66f4\u5bc6\u96c6\u7684**\u6b63\u5411\u6280\u5de7\u53cd\u9988**\uff0c\u5e2e\u52a9\u5176\u5efa\u7acb\u201c\u5fae\u5c0f\u8fdb\u6b65\u201d\u7684\u6210\u5c31\u611f\uff0c\u7a33\u56fa\u5b66\u4e60\u52a8\u529b\u3002\n    4.  **\u8bb0\u5f55\u62a5\u5907**: \u5c06\u201c\u632a\u94b1\u652f\u4ed8\u201d\u53ca\u6c9f\u901a\u8fc7\u7a0b\u8be6\u7ec6\u8bb0\u5f55\uff0c\u540c\u6b65\u98ce\u63a7\u90e8\u95e8\uff0c\u6807\u8bb0\u4e3a**\u91cd\u70b9\u89c2\u5bdf\u7528\u6237**\u3002\n\n{\"core_type\": \"T4 \u5174\u8da3\u63a2\u7d22\u8005 (\u517c\u6709T7\u7279\u5f81)\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\u504f\u9ad8\", \"product_match\": \"\u504f\u5dee\", \"action\": \"24h\u5185\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\u4e0e\u652f\u4ed8\u80fd\u529b\"}";
