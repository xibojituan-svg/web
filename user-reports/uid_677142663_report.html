    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u7f3a\u4e4f\u7528\u6237\u5e74\u9f84\u3001\u804c\u4e1a\u3001\u5bb6\u5ead\u7ed3\u6784\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u3001\u652f\u4ed8\u8d44\u91d1\u6765\u6e90\uff08\u501f\u6b3e\u5bf9\u8c61\u5173\u7cfb\uff09\u7b49\u5173\u952e\u80cc\u666f\u4fe1\u606f\uff0c\u5f71\u54cd\u5bf9\u8d44\u6e90\u5e95\u5ea7\u548c\u5fc3\u7406\u5f39\u6027\u7684\u7cbe\u786e\u8bc4\u4f30\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a\u4e2d\u7b49\u504f\u9ad8\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u201c\u7f3a\u94b1\uff0c\u60f3\u505a\u517c\u804c\u201d\u7684\u53d8\u73b0\u52a8\u673a\uff0c\u5e76\u4ed8\u8bf8\u884c\u52a8\uff08\u501f\u94b1\u62a5\u540d\uff09\u3002\u540c\u65f6\u8868\u73b0\u51fa\u5bf9\u914d\u97f3\u5b66\u4e60\u7684\u5174\u8da3\u548c\u6295\u5165\uff08\u53cd\u590d\u5f55\u97f3\u3001\u5bfb\u6c42\u53cd\u9988\uff09\uff0c\u4f46**\u7ecf\u6d4e\u538b\u529b\u662f\u6838\u5fc3\u9a71\u52a8\u529b**\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u6781\u4f4e**\u3002\u7528\u6237\u591a\u6b21\u76f4\u8a00\u201c\u8fde4000\u5757\u94b1\u90fd\u6ca1\u6709\u201d\u3001\u201c\u7f3a\u94b1\u201d\u3001\u201c\u94b1\u662f\u501f\u7684\u201d\uff0c\u9700\u501f\u6b3e\u652f\u4ed8\u5b66\u8d39\u3002\u652f\u4ed8\u8fc7\u7a0b\u56f0\u96be\uff0c\u82b1\u5457\u989d\u5ea6\u4e0d\u8db3\u3002**\u7ecf\u6d4e\u8d44\u6e90\u4e25\u91cd\u532e\u4e4f**\u662f\u6838\u5fc3\u7279\u5f81\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a\u4e2d\u7b49\u504f\u4f4e\u3002\u9762\u5bf9\u6280\u672f\u56f0\u96be\uff08\u5f55\u97f3\u5361\u987f\uff09\u6709\u632b\u8d25\u611f\uff08\u201c\u6211\u597d\u751f\u6c14\u54df\u201d\uff09\uff0c\u4f46\u4ecd\u5728\u9500\u552e\u9f13\u52b1\u4e0b\u575a\u6301\u5b8c\u6210\u3002\u5728\u652f\u4ed8\u73af\u8282\u8868\u73b0\u51fa\u7126\u8651\u3001\u72b9\u8c6b\u548c\u538b\u529b\uff08\u201c\u6211\u5f97\u53bb\u7b79\u70b9\u94b1\u201d\u3001\u201c\u501f\u94b1\u7684\u4eba\u8bf4\u4e24\u5929\u8fd8\u5979\u201d\uff09\uff0c\u51b3\u7b56\u8fc7\u7a0b\u53d7\u8d44\u91d1\u538b\u529b\u4e3b\u5bfc\uff0c\u4f46\u6700\u7ec8\u4ecd\u8bbe\u6cd5\u5b8c\u6210\u652f\u4ed8\uff0c\u663e\u793a\u4e00\u5b9a\u7684\u884c\u52a8\u529b\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**\uff1a\u5df2\u652f\u4ed8\u3002\u652f\u4ed8\u8fc7\u7a0b\u5f02\u5e38\u8270\u96be\uff0c\u6d89\u53ca\u501f\u6b3e\u548c\u5bf9\u516c\u8d26\u6237\u5206\u7b14\u652f\u4ed8\uff084380+3000\uff09\uff0c\u5b58\u5728\u540e\u7eed\u9000\u6b3e\uff083400\uff09\u6d41\u7a0b\u3002**\u652f\u4ed8\u80fd\u529b\u4e0e\u8bfe\u7a0b\u4ef7\u683c\u4e25\u91cd\u4e0d\u5339\u914d**\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u4fe1\u606f\u4e0d\u8db3\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u914d\u5076\u3001\u7236\u6bcd\u7b49\u5bb6\u5ead\u6210\u5458\uff0c\u51b3\u7b56\u770b\u4f3c\u4e2a\u4eba\u5b8c\u6210\u3002\u4f46\u9274\u4e8e\u5176\u7ecf\u6d4e\u72b6\u51b5\uff0c**\u9700\u8b66\u60d5\u5176\u501f\u6b3e\u884c\u4e3a\u662f\u5426\u83b7\u5f97\u5bb6\u5ead\u652f\u6301\u6216\u77e5\u60c5**\u3002\n*   **\u6b65\u9aa41-4 \u5224\u5b9a**\uff1a\n    *   **\u52a8\u673a**\uff1aB\u7c7b\uff08\u6280\u80fd\u53d8\u73b0\uff09\u3002\u6838\u5fc3\u8bc9\u6c42\u660e\u786e\u4e3a\u517c\u804c\u8d5a\u94b1\u3002\n    *   **\u8d44\u6e90**\uff1aD\u7c7b\uff08\u8d44\u6e90\u532e\u4e4f\uff09\u3002\u7ecf\u6d4e\u8d44\u6e90\u5904\u4e8e\u5371\u9669\u6c34\u5e73\u3002\n    *   **\u5fc3\u7406**\uff1aC\u7c7b\uff08\u538b\u529b\u9a71\u52a8\u578b\uff09\u3002\u5728\u751f\u5b58\u538b\u529b\u4e0b\u51b3\u7b56\uff0c\u7126\u8651\u611f\u660e\u663e\u3002\n    *   **\u7efc\u5408\u5224\u5b9a**\uff1a**B-D-C\u578b**\u3002\u9ad8\u53d8\u73b0\u52a8\u673a\u4e0e\u6781\u4f4e\u7ecf\u6d4e\u8d44\u6e90\u7684\u77db\u76fe\u4f53\uff0c\u51b3\u7b56\u53d7\u77ed\u671f\u8d22\u52a1\u538b\u529b\u9a71\u52a8\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**\uff1a**T7 \u751f\u5b58\u538b\u529b\u53d8\u73b0\u8005**\u3002\n    *   \u6838\u5fc3\u7279\u5f81\uff1a\u7ecf\u6d4e\u7a98\u8feb\uff0c\u5c06\u8bfe\u7a0b\u89c6\u4e3a\u201c\u6551\u547d\u7a3b\u8349\u201d\uff0c\u5bf9\u5feb\u901f\u53d8\u73b0\u6709\u6781\u9ad8\u4e14\u8feb\u5207\u7684\u671f\u671b\u3002\n    *   \u884c\u4e3a\u5370\u8bc1\uff1a\u76f4\u8a00\u7f3a\u94b1\u3001\u501f\u94b1\u62a5\u540d\u3001\u5173\u6ce8\u201c\u5c3d\u5feb\u8d5a\u94b1\u201d\u3001\u5bf9\u4ef7\u683c\u548c\u9000\u6b3e\u6781\u5176\u654f\u611f\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669**\uff1a**\u9ad8**\u3002\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u201c\u5b66\u5b8c\u63a5\u5355\u201d\u6709\u6025\u5207\u3001\u5177\u4f53\u7684\u91d1\u94b1\u56de\u62a5\u9884\u671f\uff0c\u4e0e\u884c\u4e1a\u73b0\u5b9e\u548c\u6210\u957f\u5468\u671f\u6781\u6613\u4ea7\u751f\u843d\u5dee\u3002\n    2.  **\u7ecf\u6d4e\u72b6\u51b5\u7a81\u53d8**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5df2\u5904\u4e8e\u201c\u501f\u94b1\u5b66\u4e60\u201d\u7684\u8d22\u52a1\u7d27\u7ef7\u72b6\u6001\uff0c\u4efb\u4f55\u989d\u5916\u652f\u51fa\u6216\u6536\u5165\u5ef6\u8fdf\u90fd\u53ef\u80fd\u89e6\u53d1\u652f\u4ed8\u5371\u673a\u548c\u9000\u8d39\u8bc9\u6c42\u3002\n    3.  **\u9500\u552e\u627f\u8bfa\u4e0d\u7b26**\uff1a\u4e2d\u98ce\u9669\u3002\u9500\u552e\u627f\u8bfa\u4e86\u201c\u63a5\u5355\u8d44\u6e90\u201d\u3001\u201c\u7248\u6743\u4e66\u201d\u3001\u201c\u6211\u5e26\u60a8\u201d\u7b49\uff0c\u82e5\u540e\u7eed\u8d44\u6e90\u5339\u914d\u6216\u6276\u6301\u672a\u8fbe\u7528\u6237\u9884\u671f\uff0c\u6613\u5f15\u53d1\u4e89\u8bae\u3002\n    4.  **\u5b66\u4e60\u96be\u5ea6\u8fc7\u9ad8**\uff1a\u4e2d\u98ce\u9669\u3002\u7528\u6237\u867d\u8ba4\u771f\uff0c\u4f46\u521d\u59cb\u5f55\u97f3\u9047\u5230\u6280\u672f\u632b\u6298\u5df2\u663e\u70e6\u8e81\uff0c\u957f\u671f\u5b66\u4e60\u9047\u5230\u74f6\u9888\u65f6\uff0c\u7ed3\u5408\u7ecf\u6d4e\u538b\u529b\uff0c\u53ef\u80fd\u8fc5\u901f\u653e\u5f03\u3002\n    5.  **\u65f6\u95f4\u65e0\u6cd5\u4fdd\u969c**\uff1a\u4fe1\u606f\u4e0d\u8db3\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u4e2d\u9ad8\u98ce\u9669**\u3002**\u501f\u6b3e\u884c\u4e3a\u53ef\u80fd\u672a\u83b7\u5bb6\u5ead\u652f\u6301**\uff0c\u4e00\u65e6\u5bb6\u5ead\u77e5\u6653\u6216\u65bd\u538b\uff0c\u9000\u8d39\u53ef\u80fd\u6027\u6fc0\u589e\u3002\n    7.  **\u7ade\u54c1/\u8d1f\u9762\u4fe1\u606f**\uff1a\u4e2d\u98ce\u9669\u3002\u7528\u6237\u5904\u4e8e\u7ecf\u6d4e\u654f\u611f\u671f\uff0c\u6613\u53d7\u201c\u914d\u97f3\u9a97\u5c40\u201d\u7b49\u8d1f\u9762\u4fe1\u606f\u5f71\u54cd\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\n    *   **\u8fc7\u5ea6\u627f\u8bfa\u98ce\u9669**\uff1a\u9500\u552e\u591a\u6b21\u4f7f\u7528\u201c\u6211\u5e26\u4f60\u201d\u3001\u201c\u8ba9\u4f60\u58f0\u97f3\u5347\u503c\u201d\u3001\u201c\u7a33\u5b9a\u6536\u5165\u201d\u7b49\u8bdd\u672f\uff0c\u53ef\u80fd\u8425\u9020\u4e86\u4e0d\u5207\u5b9e\u9645\u7684\u9884\u671f\u3002\n    *   **\u8bf1\u5bfc\u501f\u8d37\u98ce\u9669**\uff1a\u5728\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u7f3a\u94b1\u201d\u3001\u201c\u501f\u94b1\u201d\u7684\u60c5\u51b5\u4e0b\uff0c\u9500\u552e\u4ecd\u63a8\u52a8\u5176\u5b8c\u6210\u652f\u4ed8\uff08\u5305\u62ec\u5efa\u8bae\u8865\u6b3e\u65b9\u6848\uff09\uff0c**\u672a\u5145\u5206\u8b66\u793a\u501f\u8d37\u5b66\u4e60\u98ce\u9669\uff0c\u5b58\u5728\u4f26\u7406\u7455\u75b5**\u3002\n    *   **\u652f\u4ed8\u6d41\u7a0b\u6df7\u4e71**\uff1a\u6d89\u53ca\u5bf9\u516c\u652f\u4ed8\u3001\u5206\u7b14\u4ed8\u6b3e\u3001\u9000\u6b3e\u518d\u5f00\u901a\u7b49\u590d\u6742\u64cd\u4f5c\uff0c\u6613\u5f15\u53d1\u540e\u7eed\u7ea0\u7eb7\u3002\n*   **\u5408\u89c4\u6027**\uff1a\u6d41\u7a0b\u4e0a\u5b8c\u6210\u4e86\u9500\u552e\u52a8\u4f5c\uff0c\u4f46**\u5728\u7528\u6237\u7ecf\u6d4e\u627f\u53d7\u529b\u8bc4\u4f30\u548c\u98ce\u9669\u544a\u77e5\u65b9\u9762\u5b58\u5728\u660e\u663e\u7f3a\u5931**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d**\uff1a**\u9519\u914d**\u3002\u7528\u6237\u5f53\u524d\u6781\u4f4e\u7684\u7ecf\u6d4e\u627f\u53d7\u529b\u4e0e\u8bfe\u7a0b\u4ef7\u683c\uff08\u5373\u4f7f\u4f18\u60e0\u540e\uff09\u4e25\u91cd\u4e0d\u5339\u914d\uff0c\u5176\u751f\u5b58\u538b\u529b\u9a71\u52a8\u7684\u5b66\u4e60\u72b6\u6001\u96be\u4ee5\u652f\u6491\u957f\u671f\u3001\u7cfb\u7edf\u7684\u5b66\u4e60\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**24\u5c0f\u65f6\u5185\u542f\u52a8\u8d22\u52a1\u98ce\u9669\u9884\u8b66\u4e0e\u9884\u671f\u7ba1\u7406**\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u7d27\u6025\u4ecb\u5165\uff0824h\u5185\uff09**\uff1a\u73ed\u4e3b\u4efb\u9700\u7b2c\u4e00\u65f6\u95f4\u8054\u7cfb\u7528\u6237\uff0c**\u4ee5\u5173\u6000\u65b9\u5f0f\u6838\u5b9e\u5176\u501f\u6b3e\u60c5\u51b5\u3001\u8fd8\u6b3e\u8ba1\u5212\u53ca\u5bb6\u5ead\u77e5\u60c5\u72b6\u51b5**\u3002\u6b64\u6b65\u9aa4\u4e3a\u98ce\u63a7\u6838\u5fc3\u3002\n    2.  **\u5f3a\u5316\u9884\u671f\u7ba1\u7406**\uff1a\u5fc5\u987b\u6e05\u6670\u3001\u53cd\u590d\u5730\u6c9f\u901a\uff1a\u2460\u6709\u58f0\u884c\u4e1a\u53d8\u73b0\u5468\u671f\uff08\u975e\u5feb\u901f\uff09\uff1b\u2461\u524d\u671f\u6536\u5165\u7684\u4e0d\u786e\u5b9a\u6027\uff1b\u2462\u5b66\u4e60\u9700\u8981\u65f6\u95f4\u6295\u5165\u3002**\u964d\u4f4e\u5176\u201c\u6551\u547d\u7a3b\u8349\u201d\u5f0f\u7684\u4e0d\u5207\u5b9e\u9645\u671f\u671b**\u3002\n    3.  **\u63d0\u4f9b\u5fc3\u7406\u652f\u6301**\uff1a\u627f\u8ba4\u5176\u52aa\u529b\u548c\u51b3\u5fc3\uff0c\u4f46\u5f15\u5bfc\u5176\u5c06\u5b66\u4e60\u76ee\u6807\u4ece\u201c\u7acb\u5373\u8d5a\u94b1\u201d\u90e8\u5206\u8f6c\u79fb\u5230\u201c\u6280\u80fd\u79ef\u7d2f\u201d\u548c\u201c\u957f\u671f\u53d1\u5c55\u201d\u4e0a\uff0c\u7f13\u89e3\u7126\u8651\u3002\n    4.  **\u5bc6\u5207\u76d1\u63a7\u5b66\u4e60\u72b6\u6001**\uff1a\u9996\u6708\u4e3a\u91cd\u70b9\u89c2\u5bdf\u671f\uff0c\u5173\u6ce8\u5176\u51fa\u52e4\u3001\u4f5c\u4e1a\u5b8c\u6210\u8d28\u91cf\u53ca\u60c5\u7eea\u53d8\u5316\u3002\u4e00\u65e6\u51fa\u73b0\u61c8\u6020\u6216\u62b1\u6028\u82d7\u5934\uff0c\u7acb\u5373\u52a0\u5f3a\u6c9f\u901a\u3002\n    5.  **\u8d44\u6e90\u503e\u659c\u8c28\u614e**\uff1a\u53ef\u9002\u5f53\u63d0\u4f9b\u4e00\u4e9b\u5165\u95e8\u7ea7\u3001\u6613\u4e0a\u624b\u7684\u8bd5\u97f3\u673a\u4f1a\u4ee5\u589e\u5f3a\u4fe1\u5fc3\uff0c\u4f46**\u5207\u5fcc\u8fc7\u5ea6\u627f\u8bfa\u201c\u4fdd\u8fc7\u201d\u6216\u201c\u4fdd\u5e95\u6536\u5165\u201d**\uff0c\u907f\u514d\u540e\u7eed\u7ea0\u7eb7\u3002\n    6.  **\u9884\u6848\u51c6\u5907**\uff1a\u505a\u597d\u7528\u6237\u53ef\u80fd\u56e0\u7ecf\u6d4e\u538b\u529b\u4e2d\u9014\u63d0\u51fa\u9000\u8d39\u7684\u9884\u6848\uff0c\u719f\u6089\u516c\u53f8\u76f8\u5173\u9000\u8d39\u653f\u7b56\uff0c\u51c6\u5907\u5408\u89c4\u3001\u4eba\u6027\u5316\u7684\u6c9f\u901a\u65b9\u6848\u3002\n\n{\"core_type\": \"T7 \u751f\u5b58\u538b\u529b\u53d8\u73b0\u8005\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"product_match\": \"\u9519\u914d\", \"action\": \"24\u5c0f\u65f6\u5185\u542f\u52a8\u8d22\u52a1\u98ce\u9669\u9884\u8b66\u4e0e\u9884\u671f\u7ba1\u7406\"}";
