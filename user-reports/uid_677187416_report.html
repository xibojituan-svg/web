    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (Motive Purity)**: **\u4e2d\u4f4e**\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u526f\u4e1a\u53d8\u73b0\u9700\u6c42\uff08\u201c\u5927\u6982\u6211\u4eec\u80fd\u8d5a\u94b1\u7684\u5468\u671f\u8981\u591a\u4e45\u554a\u201d\uff09\uff0c\u5c5e\u4e8e\u529f\u5229\u6027\u5b66\u4e60\u52a8\u673a\u3002\u5bf9\u8bfe\u7a0b\u5185\u5bb9\uff08\u5982\u201c\u5929\u9f99\u516b\u90e8\u201d\u7ed3\u6784\uff09\u6709\u57fa\u7840\u4e92\u52a8\uff0c\u4f46\u672a\u89c1\u5bf9\u5199\u4f5c\u672c\u8eab\u6709\u5f3a\u70c8\u5174\u8da3\u6216\u957f\u671f\u804c\u4e1a\u89c4\u5212\u7684\u6df1\u5ea6\u8868\u8fbe\u3002\u52a8\u673a\u504f\u5411\u201c\u5feb\u901f\u8d5a\u94b1\u201d\uff0c\u800c\u975e\u201c\u6280\u80fd\u7cbe\u8fdb\u201d\u6216\u201c\u5174\u8da3\u53d1\u5c55\u201d\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (Resource Base)**: **\u4e2d**\u3002\u7528\u6237\u6709\u5168\u804c\u5de5\u4f5c\uff08\u201c\u6211\u767d\u5929\u6ca1\u65f6\u95f4\uff0c\u4e0a\u73ed\u201d\uff09\uff0c\u8868\u660e\u6709\u7a33\u5b9a\u7684\u57fa\u7840\u6536\u5165\u6765\u6e90\u3002\u80fd\u6295\u5165\u665a\u4e0a\u65f6\u95f4\u5b66\u4e60\uff08\u201c\u665a\u4e0a\u516b\u70b9\u8fd8\u8bb2\u4e0d\u201d\uff09\uff0c\u5177\u5907\u4e00\u5b9a\u7684**\u65f6\u95f4\u8d44\u6e90**\u3002\u5bf9AI\u5de5\u5177\uff08\u8c46\u5305\u3001Kimi\uff09\u6709\u521d\u6b65\u4e86\u89e3\u548c\u4f7f\u7528\uff0c\u5177\u5907\u57fa\u7840**\u6570\u5b57\u7d20\u517b**\u3002\u4f46\u672a\u900f\u9732\u7ecf\u6d4e\u72b6\u51b5\u3001\u6559\u80b2\u80cc\u666f\u7b49\u6df1\u5ea6\u8d44\u6e90\u4fe1\u606f\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (Psychological Resilience)**: **\u4e2d\u9ad8**\u3002\u7528\u6237\u914d\u5408\u5ea6\u8f83\u9ad8\uff0c\u80fd\u6309\u65f6\u5b8c\u6210\u9884\u7ea6\u3001\u542c\u8bfe\u3001\u4ea4\u4f5c\u4e1a\u7b49\u6307\u4ee4\u6027\u52a8\u4f5c\uff08\u201c\u9884\u7ea6\u597d\u4e86\u201d\u3001\u201c\u5df2\u7ecf\u8fdb\u4e86\u201d\u3001\u201c\u70b9\u51fb\u94fe\u63a5\u67e5\u770b\u548c Kimi \u7684\u5bf9\u8bdd\u201d\uff09\u3002\u9762\u5bf9\u9500\u552e\u50ac\u4fc3\uff08\u5982\u50ac\u4f5c\u4e1a\uff09\u65f6\uff0c\u56de\u5e94\u5e73\u548c\uff08\u201c\u6211\u767d\u5929\u6ca1\u65f6\u95f4\uff0c\u4e0a\u73ed\u201d\uff09\uff0c\u672a\u8868\u73b0\u51fa\u660e\u663e\u62b5\u89e6\u6216\u7126\u8651\u3002\u5728\u51b3\u7b56\u65f6\u80fd\u8fdb\u884c\u7406\u6027\u8be2\u95ee\uff08\u5468\u671f\u3001\u73ed\u578b\u533a\u522b\uff09\uff0c**\u51b3\u7b56\u8fc7\u7a0b\u76f8\u5bf9\u51b7\u9759**\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u5df2\u7ecf\u62a5\u540d\u4e86\u201d\uff0c\u5e76\u8be2\u95ee\u4e864380\u7684\u4ef7\u683c\uff0c\u8868\u660e\u5df2\u5b8c\u6210\u652f\u4ed8\u52a8\u4f5c\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u6216\u914d\u5076\u7684\u8ba8\u8bba\uff0c\u51b3\u7b56\u7531\u7528\u6237\u72ec\u7acb\u505a\u51fa\u3002\n*   **\u6b65\u9aa41 - \u9700\u6c42\u7d27\u8feb\u6027**: **\u4e2d**\u3002\u7528\u6237\u6709\u660e\u786e\u7684\u526f\u4e1a\u589e\u6536\u9700\u6c42\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u201c\u6551\u547d\u7a3b\u8349\u201d\u5f0f\u7684\u6781\u5ea6\u7d27\u8feb\u611f\u3002\n*   **\u6b65\u9aa42 - \u652f\u4ed8\u80fd\u529b**: **\u4e2d**\u3002\u80fd\u652f\u4ed84380\u5143\u8bfe\u7a0b\u8d39\u7528\uff0c\u63a8\u6d4b\u5177\u5907\u4e00\u5b9a\u652f\u4ed8\u80fd\u529b\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u7ecf\u6d4e\u538b\u529b\u3002\n*   **\u6b65\u9aa43 - \u51b3\u7b56\u81ea\u4e3b\u6027**: **\u9ad8**\u3002\u7528\u6237\u81ea\u4e3b\u63d0\u95ee\u3001\u5bf9\u6bd4\u73ed\u578b\uff08\u201c\u65d7\u8230\u548c\u57fa\u7840\u662f\u540c\u6b65\u8fdb\u884c\u201d\uff09\uff0c\u5e76\u6700\u7ec8\u81ea\u4e3b\u51b3\u5b9a\u62a5\u540d\uff0c\u51b3\u7b56\u8fc7\u7a0b\u72ec\u7acb\u3002\n*   **\u6b65\u9aa44 - \u884c\u52a8\u914d\u5408\u5ea6**: **\u9ad8**\u3002\u5168\u7a0b\u914d\u5408\u9500\u552e\u6d41\u7a0b\uff0c\u5b8c\u6210\u9884\u7ea6\u3001\u542c\u8bfe\u3001\u4ea4\u4f5c\u4e1a\u3001\u9886\u5956\u52b1\u7b49\u52a8\u4f5c\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**: **B\u7c7b\u7528\u6237 (\u9ad8\u610f\u5411\u6210\u4ea4\u578b)**\u3002\u7528\u6237\u5df2\u5b8c\u6210\u652f\u4ed8\uff0c\u914d\u5408\u5ea6\u9ad8\uff0c\u6709\u660e\u786e\u53d8\u73b0\u76ee\u6807\uff0c\u5c5e\u4e8e\u5df2\u8f6c\u5316\u7684\u6838\u5fc3\u7528\u6237\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b: T5 \u529f\u5229\u8fdb\u53d6\u578b**\u3002\n    *   **\u6838\u5fc3\u7279\u5f81**: \u76ee\u6807\u660e\u786e\uff08\u526f\u4e1a\u53d8\u73b0\uff09\u3001\u884c\u52a8\u529b\u5f3a\uff08\u914d\u5408\u6d41\u7a0b\uff09\u3001\u51b3\u7b56\u7406\u6027\uff08\u8be2\u95ee\u5468\u671f\u4e0e\u73ed\u578b\u5dee\u5f02\uff09\u3001\u5bf9\u6295\u8d44\u56de\u62a5\u7387\u654f\u611f\uff08\u5173\u6ce8\u8d5a\u94b1\u5468\u671f\uff09\u3002\n    *   **\u543b\u5408\u70b9**: \u7528\u6237\u6240\u6709\u4e92\u52a8\u5747\u56f4\u7ed5\u201c\u5b66\u4e60-\u53d8\u73b0\u201d\u8def\u5f84\u5c55\u5f00\uff0c\u5bf9\u201c\u5546\u5355\u201d\u3001\u201c\u6295\u7a3f\u201d\u3001\u201c\u6536\u76ca\u201d\u7b49\u5173\u952e\u8bcd\u6709\u56de\u5e94\uff0c\u5bf9\u8bfe\u7a0b\u672c\u8eab\u7684\u201c\u6559\u5b66\u4ef7\u503c\u201d\u5173\u6ce8\u5ea6\u4f4e\u4e8e\u5bf9\u201c\u53d8\u73b0\u8def\u5f84\u201d\u7684\u5173\u6ce8\u5ea6\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u98ce\u9669\u7b49\u7ea7: \u4e2d)\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u6548\u679c\u4e0d\u53ca\u9884\u671f**: **\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u627f\u8bfa\u201c\u4e00\u4e2a\u6708\u5c31\u53ef\u4ee5\u4e86\uff0c\u5feb\u4e00\u70b9\u4e24\u4e2a\u661f\u671f\u201d\u53d8\u73b0\uff0c\u5e76\u63d0\u4f9b\u4e86\u201c4999\u957f\u7bc7\u5c0f\u8bf4\u8d44\u6e90\u201d\u7b49\u8bf1\u9975\u3002**\u82e5\u7528\u6237\u6295\u5165\u65f6\u95f4\u540e\u672a\u80fd\u5feb\u901f\u83b7\u5f97\u627f\u8bfa\u7684\u6536\u76ca\uff0c\u6781\u6613\u5f15\u53d1\u9000\u8d39\u6295\u8bc9\u3002**\n    2.  **\u8bfe\u7a0b\u8d28\u91cf\u4e0d\u7b26**: \u4e2d\u98ce\u9669\u3002\u7528\u6237\u5df2\u5bdf\u89c9\u516c\u5f00\u8bfe\u542b\u63a8\u5e7f\u6027\u8d28\uff08\u201c\u62a5\u540d\u540e\u76ee\u524d\u8bb2\u7684\u5c31\u6ca1\u6709\u5fc5\u8981\u542c\u4e86\u5427\u3002\u6211\u770b\u90fd\u662f\u63a8\u5e7f\u54e6\u201d\uff09\uff0c\u5bf9\u6b63\u5f0f\u8bfe\u8d28\u91cf\u62b1\u6709\u8f83\u9ad8\u671f\u5f85\u3002\n    3.  **\u7ecf\u6d4e\u538b\u529b\u7a81\u53d8**: \u4fe1\u606f\u4e0d\u8db3\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9**: \u4fe1\u606f\u4e0d\u8db3\u3002\n    5.  **\u65f6\u95f4\u65e0\u6cd5\u4fdd\u969c**: **\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u8868\u660e\u201c\u767d\u5929\u6ca1\u65f6\u95f4\uff0c\u4e0a\u73ed\u201d\uff0c\u4f9d\u8d56\u665a\u4e0a\u5b66\u4e60\u3002\u82e5\u5de5\u4f5c\u751f\u6d3b\u51fa\u73b0\u6ce2\u52a8\uff0c\u53ef\u80fd\u65e0\u6cd5\u575a\u6301\u3002\n    6.  **\u88ab\u8bf1\u5bfc\u6d88\u8d39**: **\u4e2d\u98ce\u9669**\u3002\u9500\u552e\u4f7f\u7528\u4e86\u201c\u5546\u5355\u201d\u3001\u201c\u5185\u90e8\u8d44\u6e90\u201d\u3001\u201c\u4e13\u5c5e\u63a8\u8350\u7801\u201d\u3001\u201c\u966a\u8dd1\u5b98\u7ee9\u6548\u7ed1\u5b9a\u201d\u7b49\u8bdd\u672f\u8fdb\u884c\u4fc3\u5355\uff0c\u5b58\u5728\u4e00\u5b9a\u8bf1\u5bfc\u6027\u3002\n    7.  **\u670d\u52a1\u4f53\u9a8c\u5dee**: \u4f4e\u98ce\u9669\u3002\u76ee\u524d\u9500\u552e\u8ddf\u8fdb\u53ca\u65f6\uff0c\u7528\u6237\u4f53\u9a8c\u5c1a\u53ef\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u26a0\ufe0f \u98ce\u9669\u70b9**:\n    *   **\u8fc7\u5ea6\u627f\u8bfa**: \u9500\u552e\u660e\u786e\u627f\u8bfa\u201c\u4e00\u4e2a\u6708\u201d\u3001\u201c\u4e24\u4e2a\u661f\u671f\u201d\u53d8\u73b0\u5468\u671f\uff0c\u5e76\u6697\u793a\u63d0\u4f9b\u201c\u5546\u5355\u201d\u4fdd\u969c\uff0c**\u6d89\u5acc\u5938\u5927\u5ba3\u4f20\u548c\u6548\u679c\u627f\u8bfa**\u3002\n    *   **\u5236\u9020\u7a00\u7f3a\u4e0e\u7d27\u8feb**: \u4f7f\u7528\u201c\u540d\u989d\u4e0d\u591a\u201d\u3001\u201c\u5185\u90e8\u63a8\u8350\u7801\u201d\u3001\u201c\u4e13\u5c5e\u201d\u7b49\u8bcd\u6c47\u3002\n    *   **\u5229\u7528\u4ece\u4f17\u4e0e\u6743\u5a01**: \u9891\u7e41\u5c55\u793a\u201c\u5b66\u5458\u559c\u62a5\u201d\u3001\u201c\u8001\u5e08\u80cc\u666f\u201d\u3002\n*   **\u5408\u89c4\u6027**: \u9500\u552e\u6d41\u7a0b\u5b58\u5728**\u9ad8\u538b\u4fc3\u5355\u548c\u8fc7\u5ea6\u627f\u8bfa\u7684\u5acc\u7591**\uff0c\u5df2\u89e6\u53ca\u5408\u89c4\u7ea2\u7ebf\u3002\u9700\u91cd\u70b9\u5173\u6ce8\u540e\u7eed\u670d\u52a1\u4ea4\u4ed8\u662f\u5426\u4e0e\u627f\u8bfa\u5339\u914d\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6838\u5fc3\u7b56\u7565**: **\u5f3a\u5316\u4ef7\u503c\u4ea4\u4ed8\uff0c\u7ba1\u7406\u6536\u76ca\u9884\u671f\uff0c\u63d0\u4f9b\u5373\u65f6\u6b63\u53cd\u9988\u3002**\n*   **\u884c\u52a8\u6307\u5357**:\n    1.  **\u9884\u671f\u7ba1\u7406\uff08\u9996\u8981\u4efb\u52a1\uff09**: \u5f00\u8425\u540e\u7acb\u5373\u4e0e\u7528\u6237\u6c9f\u901a\uff0c\u5c06\u201c\u5feb\u901f\u53d8\u73b0\u201d\u9884\u671f\u8f6c\u5316\u4e3a\u201c\u5206\u9636\u6bb5\u76ee\u6807\u201d\uff08\u5982\uff1a\u7b2c\u4e00\u6708\u638c\u63e1\u65b9\u6cd5\u5b8c\u6210\u9996\u7a3f\uff0c\u7b2c\u4e8c\u6708\u5c1d\u8bd5\u6295\u7a3f\uff09\u3002\u660e\u786e\u544a\u77e5\u5199\u4f5c\u53d8\u73b0\u7684\u6ce2\u52a8\u6027\u548c\u9700\u8981\u6301\u7eed\u7ec3\u4e60\u3002\n    2.  **\u63d0\u4f9b\u5373\u65f6\u6210\u5c31\u611f**: \u9488\u5bf9T5\u7528\u6237\uff0c\u5728\u5176\u5b8c\u6210\u4f5c\u4e1a\u540e\uff0c\u9664\u5e38\u89c4\u70b9\u8bc4\u5916\uff0c\u53ef\u9644\u5e26\u201c\u6b64\u6bb5\u843d\u5df2\u8fbe\u5230XX\u5e73\u53f0\u8fc7\u7a3f\u57fa\u7840\u6c34\u5e73\u201d\u7b49\u5177\u4f53\u3001\u79ef\u6781\u7684\u53cd\u9988\u3002\u5c3d\u65e9\u5f15\u5bfc\u5176\u5b8c\u6210\u4e00\u6b21\u5fae\u5c0f\u4f46\u5b8c\u6574\u7684\u201c\u521b\u4f5c-\u63d0\u4ea4\u201d\u95ed\u73af\u3002\n    3.  **\u5546\u5355\u8d44\u6e90\u900f\u660e\u5316**: \u4e3b\u52a8\u3001\u6e05\u6670\u5730\u8bf4\u660e\u5546\u5355\u7684\u53d1\u5e03\u673a\u5236\u3001\u96be\u5ea6\u5206\u7ea7\u3001\u7ed3\u7b97\u6d41\u7a0b\uff0c\u907f\u514d\u8ba9\u5176\u4ea7\u751f\u201c\u62a5\u540d\u5373\u6d3e\u5355\u201d\u7684\u8bef\u89e3\u3002\u53ef\u5148\u63d0\u4f9b\u4e00\u4e9b\u4f4e\u95e8\u69db\u7684\u7ec3\u624b\u4efb\u52a1\u3002\n    4.  **\u5f3a\u5316\u5173\u7cfb\u7ed1\u5b9a**: \u7528\u6237\u5bf9\u9500\u552e\uff08\u7075\u7075\uff09\u5df2\u5efa\u7acb\u4fe1\u4efb\uff08\u201c\u5c31\u627e\u60a8 \u5c31\u53ef\u4ee5\u561b\u201d\uff09\u3002\u73ed\u4e3b\u4efb\u5e94\u627f\u63a5\u6b64\u4fe1\u4efb\uff0c\u4fdd\u6301\u9ad8\u54cd\u5e94\u5ea6\uff0c\u6210\u4e3a\u5176\u89e3\u51b3\u95ee\u9898\u7684\u7b2c\u4e00\u63a5\u53e3\u3002\n    5.  **\u5173\u6ce8\u65f6\u95f4\u6295\u5165**: \u5b9a\u671f\u4e86\u89e3\u5176\u665a\u95f4\u5b66\u4e60\u65f6\u95f4\u5b89\u6392\uff0c\u63d0\u4f9b\u788e\u7247\u5316\u5b66\u4e60\u5efa\u8bae\uff0c\u9632\u6b62\u56e0\u65f6\u95f4\u51b2\u7a81\u800c\u6389\u961f\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**: \u7528\u6237\u5df2\u62a5\u540d\uff0c\u9700\u91cd\u70b9**\u786e\u4fdd\u201c\u77ed\u6545\u4e8b+\u77ed\u5267\u5267\u672c\u201d\u65d7\u8230\u7248\u8bfe\u7a0b**\u7684\u4ea4\u4ed8\u8d28\u91cf\u3002\u5176\u529f\u5229\u6027\u5f3a\uff0c\u8bfe\u7a0b\u8bbe\u8ba1\u9700\u7a81\u51fa\u201c\u5b9e\u6218\u3001\u6295\u7a3f\u3001\u6539\u7a3f\u3001\u6e20\u9053\u201d\u6a21\u5757\uff0c\u5f31\u5316\u7406\u8bba\u90e8\u5206\u3002\u53ef\u5411\u5176\u63a8\u8350\u540e\u7eed\u7684\u201c**\u7206\u6b3e\u5267\u672c\u62c6\u89e3\u8bad\u7ec3\u8425**\u201d\u6216\u201c**\u5e73\u53f0\u6295\u7a3f\u6df1\u5ea6\u966a\u8dd1\u8425**\u201d\u4f5c\u4e3a\u5347\u5355\u65b9\u5411\u3002\n\n{\"core_type\": \"T5 \u529f\u5229\u8fdb\u53d6\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\uff08\u80fd\u529b\u8ba4\u53ef\uff09/ \u81ea\u6211\u5b9e\u73b0\uff08\u8d22\u52a1\u63d0\u5347\uff09\", \"target_product
