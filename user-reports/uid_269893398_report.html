        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a269893398\u7684\u7528\u6237\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 269893398 (\u6635\u79f0\uff1a\u8bfa\u65af\u7c73\u5c14) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-20 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u7af9\u9752\u68a6(\u5218\u5229)\u3001\u6167\u9ee0\u73ed\u73ed/\u81fb\u81f3\u6167\u9ee0(\u6c88\u81fb\u6167) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AIGC\u5168\u80fd\u89c6\u9891\u521b\u4f5c\u8425\u3001L3\u8bfe\u7a0b\uff08\u5df2\u8d2d\u4e70\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\uff0c\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3002\u4f46\u4e3b\u52a8\u54a8\u8be2\u5e76\u8d2d\u4e70L3\u8bfe\u7a0b\uff0c\u63a8\u6d4b\u4e3a\u5168\u6b3e\u6216\u4fe1\u7528\u5361\uff0c\u65e0\u501f\u8d37\u4fe1\u53f7\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u4e3b\u8981\u5728\u5355\u4f4d\uff08\u8054\u60f3\u53f0\u5f0f\u673a\uff09\u548c\u5bb6\u4e2d\uff08\u82f9\u679c\u7b14\u8bb0\u672c\uff09\u5b66\u4e60\uff0c\u51fa\u5dee\u671f\u95f4\u4f5c\u4e1a\u53d7\u5f71\u54cd\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\uff0c\u672a\u63d0\u53ca\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u6709\u660e\u786e\u7684\u5b66\u4e60\u884c\u4e3a\u3001\u6280\u672f\u95ee 898\uff08\u65e0\u6cd5\u5728\u7f51\u9875\u8f93\u5165\u6587\u5b57\uff09\uff0c\u5bfc\u81f4\u5b66\u4e60\u53d7\u963b\uff0c\u4f46\u80fd\u901a\u8fc7\u5355\u4f4d\u7535\u8111\u89e3\u51b3\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8 (7-8\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3**\u3002\u9047\u5230\u6280\u672f\u96be\u9898\uff08\u82f9\u679c\u7535\u8111\u65e0\u6cd5\u8f93\u5165\uff09\u65f6\uff0c\u4e3b\u52a8\u4e0a\u7f51\u641c\u7d22\u3001\u8be2\u95ee\u516c\u4f17\u53f7\u3001\u4e0e\u73ed\u73ed\u63a2\u8ba8\u539f\u56e0\uff0c\u5e76\u81ea\u884c\u63d0\u51fa\u89e3\u51b3\u65b9\u6848\uff08\u201c\u4e0d\u6210\u660e\u5929\u8fd8\u662f\u5728\u5355\u4f4d\u505a\u201d\uff09\uff0c**\u65e0\u4efb\u4f55\u62b1\u6028\u3001\u5d29\u6e83\u6216\u653e\u5f03\u60c5\u7eea**\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u5173\u6ce8\u4e86\u516c\u4f17\u53f7\uff0c\u95ee\u4e86\uff0c\u770b\u600e\u4e48\u89e3\u7b54\u3002\u6ca1\u4e8b\u513f\uff0c\u4e0d\u6210\u660e\u5929\u8fd8\u662f\u5728\u5355\u4f4d\u505a\u201d\n  > \u201c\u597d\u7684\uff0c\u8c22\u8c22\u73ed\u73ed\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u6280\u672f\u6548\u7387\u7684\u8ffd\u6c42\u548c\u5bf9\u77e5\u8bc6\u6df1\u5ea6\u7684\u6e34\u671b\u3002\u4ed6\u9047\u5230\u95ee\u9898\u4e0d\u662f\u9000\u7f29\uff0c\u800c\u662f\u79ef\u6781\u5bfb\u6c42\u6700\u4f18\u89e3\uff08\u7528\u7535\u8111\u66f4\u5feb\u66f4\u7701\u79ef\u5206\uff09\uff0c\u5e76\u4e3b\u52a8\u5bfb\u6c42\u8fdb\u9636\uff08L3\u8bfe\u7a0b\uff09\uff0c\u8fd9\u8868\u660e\u4ed6\u8ffd\u6c42\u7684\u662f**\u80fd\u529b\u7cbe\u8fdb\u548c\u6f5c\u80fd\u53d1\u6325**\uff0c\u800c\u975e\u7b80\u5355\u7684\u751f\u5b58\u6216\u793e\u4ea4\u9700\u6c42\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u8ba4\u53ef\u4e0e\u6df1\u5ea6\u6280\u672f\u6307\u5bfc**\u3002\u4ed6\u4e0d\u9700\u8981\u9e21\u6c64\u5f0f\u5b89\u629a\uff0c\u9700\u8981\u7684\u662f\u80fd\u89e3\u51b3\u4ed6\u6280\u672f\u74f6\u9888\u3001\u5f15\u9886\u4ed6\u8d70\u5411\u66f4\u9ad8\u9636\u7684\u201c\u4e13\u5bb6\u7ea7\u201d\u652f\u6301\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe2 B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T3 \u6b7b\u78d5\u6781\u5ba2\u6d3e** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u65e0\u6781\u7aef\u8a00\u8bba\u3001\u65e0\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u672a\u63d0\u53ca\u5bb6\u5ead\uff0c\u98ce\u9669\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u6280\u672f\u969c\u788d\u6301\u7eed\u65e0\u6cd5\u89e3\u51b3\uff08\u5982\u82f9\u679c\u7535\u8111\u517c\u5bb9\u6027\u95ee\u9898\uff09\uff0c\u6216\u5de5\u4f5c/\u51fa\u5dee\u5bfc\u81f4\u5b66\u4e60\u4e25\u91cd\u4e2d\u65ad\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\u201d\u7684\u632b\u8d25\u611f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u4e8b\u51b7\u9759\u89e3\u51b3\uff0c\u65e0\u60c5\u7eea\u5316\u4fe1\u53f7\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u52a8\u673a\u4e3a\u81ea\u6211\u5b9e\u73b0\u548c\u6280\u672f\u7cbe\u8fdb\uff0c\u800c\u975e\u77ed\u671f\u53d8\u73b0\uff0c\u5bf9\u201c\u63a5\u5355\u8d5a\u94b1\u201d\u7684\u5373\u65f6\u6027\u8981\u6c42\u4e0d\u9ad8\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u521d\u671f\uff081-2\u5468\uff09\u9047\u5230\u6301\u7eed\u7684\u6280\u672f\u969c\u788d\u65f6**\uff0c\u6216**\u51fa\u5dee\u7b49\u4e0d\u53ef\u6297\u529b\u5bfc\u81f4\u4f5c\u4e1a\u4e25\u91cd\u79ef\u538b\u65f6**\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u8bfa\u65af\u7c73\u5c14\u540c\u5b66\u4f60\u597d\uff0c\u770b\u5230\u4f60\u4e4b\u524d\u5b66\u4e60\u5f88\u8ba4\u771f\uff0c\u8fd8\u4f1a\u4e3b\u52a8\u7814\u7a76\u5de5\u5177\u6548\u7387\uff08\u7535\u8111\u51fa\u56fe\u5feb\u7701\u79ef\u5206\uff09\uff0c\u4e00\u770b\u5c31\u662f\u7231\u94bb\u7814\u7684\u3002\u54b1\u4eecL3\u8bfe\u7a0b\u6280\u672f\u6df1\u5ea6\u4f1a\u66f4\u9ad8\uff0c\u8fc7\u7a0b\u4e2d\u9047\u5230\u4efb\u4f55\u6280\u672f\u5361\u70b9\uff0c\u968f\u65f6@\u6211\uff0c\u6211\u5e2e\u4f60\u76f4\u63a5\u5bf9\u63a5\u6280\u672f\u8001\u5e08\u5feb\u901f\u89e3\u51b3\uff0c\u4fdd\u8bc1\u4f60\u7684\u5b66\u4e60\u6548\u7387\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176T3\u6781\u5ba2\u5c5e\u6027\uff0c\u63d0\u4f9b\u6df1\u5ea6\u3001\u7cfb\u7edf\u7684\u6280\u672f\u5185\u5bb9\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u8865\u5145\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011\uff08B\u6a21\u5757\uff09**\u3002\u5efa\u7acb\u4e0e\u540e\u7aef\u6280\u672f\u4e13\u5bb6\uff08\u5982\u65e0\u6781\u5927\u5927\uff09\u7684\u76f4\u63a5\u7b54\u7591\u901a\u9053\uff0c\u6ee1\u8db3\u5176\u6df1\u5ea6\u6280\u672f\u8ffd\u95ee\u9700\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u51e0\u5929\u80fd\u8d5a\u94b1\u201d\u7684\u8bdd\u672f\u53bb\u523a\u6fc0\u4ed6\uff1b\u5728\u4ed6\u9047\u5230\u6280\u672f\u95ee\u9898\u65f6\uff0c\u53ea\u7ed9\u201c\u91cd\u542f\u8bd5\u8bd5\u201d\u8fd9\u7c7b\u6577\u884d\u56de\u7b54\uff1b\u7528\u60c5\u611f\u9e21\u6c64\u4ee3\u66ff\u6280\u672f\u89e3\u51b3\u65b9\u6848\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u4ed6\u5df2\u8868\u73b0\u51fa\u660e\u786e\u7684\u5347\u5355\u610f\u5411\uff08\u4e3b\u52a8\u8be2\u95eeL3\uff09\uff0c\u4e14\u52a8\u673a\u7eaf\u6b63\uff0c\u662f**\u9ad8\u9636\u8bfe\u7a0b\u548c\u786c\u4ef6\u8bbe\u5907\u4ea4\u53c9\u9500\u552e**\u7684\u7edd\u4f73\u76ee\u6807\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u7535\u8111agent\u51fa\u56fe\u6bd4\u8f83\u5feb\uff0c\u4e5f\u7701\u79ef\u5206\uff0c\u6211\u60f3\u7528\u7535\u8111\u597d\u505a\u4e00\u70b9\u201d **\uff08\u52a8\u673a\u7eaf\u5ea6\uff1a\u8ffd\u6c42\u6548\u7387\u4e0e\u6280\u672f\u4f18\u5316\uff09**\n2. > \u201c\u6211\u5173\u6ce8\u4e86\u516c\u4f17\u53f7\uff0c\u95ee\u4e86\uff0c\u770b\u600e\u4e48\u89e3\u7b54\u3002\u6ca1\u4e8b\u513f\uff0c\u4e0d\u6210\u660e\u5929\u8fd8\u662f\u5728\u5355\u4f4d\u505a\u201d **\uff08\u5fc3\u7406\u5f39\u6027\uff1a\u9047\u632b\u51b7\u9759\uff0c\u591a\u8def\u5f84\u89e3\u51b3\u95ee\u9898\uff09**\n3. > \u201c\u73ed\u73ed\uff0cL3\u7684\u8bfe\u6709\u4ecb\u7ecd\u5417\uff1f\u8d39\u7528\u4ec0\u4e48\u7684\u201d **\uff08\u81ea\u6211\u5b9e\u73b0\u9700\u6c42\uff1a\u4e3b\u52a8\u5bfb\u6c42\u77e5\u8bc6\u8fdb\u9636\uff09**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T3 \u6b7b\u78d5\u6781\u5ba2\u6d3e\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u81ea\u6211\u5b9e\u73b0\u4e0e\u6280\u672f\u7cbe\u8fdb\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u9ad8\u6548\u3001\u4e13\u4e1a\u7684\u6280\u672f\u652f\u6301\u901a\u9053\uff0c\u89e3\u51b3\u5176\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u7684\u6548\u7387\u5361\u70b9\u3011**\u3002\n\n```json\n{\"core_type\": \"T3 \u6b7b\u78d5\u6781\u5ba2\u6d3e\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
