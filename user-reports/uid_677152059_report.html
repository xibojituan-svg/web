    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49)**: \u8868\u73b0\u51fa\u660e\u786e\u7684\u5b66\u4e60\u610f\u613f\uff08\u201cYes\u201d\u786e\u8ba4\u5165\u884c\uff0c\u8be2\u95ee\u5b66\u4e60\u65f6\u95f4\u5b89\u6392\u3001\u4f5c\u4e1a\u6253\u5361\u3001\u8fdb\u5267\u7ec4\u65f6\u95f4\uff09\uff0c\u5bf9\u53d8\u73b0\u8def\u5f84\uff08\u63a5\u5355\u3001\u8fdb\u5267\u7ec4\uff09\u6709\u6301\u7eed\u5173\u6ce8\u3002\u4f46\u52a8\u673a\u4e2d**\u53d8\u73b0\u671f\u5f85**\u4e0e**\u6280\u80fd\u6210\u957f**\u4ea4\u7ec7\uff0c\u5bf9\u201c\u7528\u624b\u673a\u5f55\u80fd\u8bd5\u97f3\u6210\u529f\u5417\uff1f\u201d\u7b49\u5b9e\u64cd\u7ec6\u8282\u7684\u8ffd\u95ee\uff0c\u663e\u793a\u5176\u5bf9\u6295\u5165\u4ea7\u51fa\u6bd4\u7684\u73b0\u5b9e\u8003\u91cf\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d\u4f4e)**: **\u652f\u4ed8\u80fd\u529b\u5b58\u7591**\u3002\u591a\u6b21\u8be2\u95ee\u5206\u671f\u3001\u9000\u6b3e\u91cd\u4ed8\uff08\u201c\u80fd\u5148\u62a5\u4e24\u4e2a\u6708\u7684\uff0c\u518d\u5347\u7ea74\u4e2a\u6708\u7684\u5417\u201d\u3001\u201c\u6211\u90a3\u4e2a\u60f3\u5206\u671f\uff0c\u80fd\u9000\u56de\u91cd\u65b0\u5f04\u5417\uff1f\u201d\uff09\uff0c\u6700\u7ec8\u9009\u62e9\u5206\u4e24\u65e5\u4ed8\u6b3e\uff08\u201c\u4eca\u5929\u5148\u4ed81000\uff0c\u660e\u5929\u4ed8\u5269\u4e0b\u7684\u201d\uff09\uff0c\u8868\u660e\u5176**\u73b0\u91d1\u6d41\u7d27\u5f20**\uff0c\u652f\u4ed8\u51b3\u7b56\u8c28\u614e\u3002\u65f6\u95f4\u8d44\u6e90\u4e3a\u201c\u53ea\u6709\u4e2d\u5348\u548c\u665a\u4e0a\u201d\uff0c\u5c5e\u4e8e\u517c\u804c\u5b66\u4e60\u6a21\u5f0f\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u7b49)**: \u6c9f\u901a\u914d\u5408\u5ea6\u8f83\u9ad8\uff0c\u80fd\u6309\u65f6\u5b8c\u6210\u8bad\u7ec3\u8425\u4efb\u52a1\uff08\u201c\u63d0\u4ea4\u5b8c\u6210\u201d\uff09\uff0c\u5bf9\u9500\u552e\u5f15\u5bfc\uff08\u5982\u201cYes\u201d\u56de\u5e94\u3001\u9886\u53d6\u7248\u6743\u4e66\uff09\u54cd\u5e94\u79ef\u6781\u3002\u4f46\u5728**\u73ed\u7ea7\u5b89\u6392\u53d8\u66f4**\uff08\u4ece4\u67089\u65e5\u73ed\u8c03\u6574\u81f34\u670816\u65e5\u73ed\uff09\u548c**\u8d60\u8bfe\u53d1\u653e\u5ef6\u8fdf**\u65f6\u8868\u73b0\u51fa\u8f7b\u5fae\u7126\u8651\uff08\u53cd\u590d\u786e\u8ba4\u201c\u4ec0\u4e48\u65f6\u5019\u80fd\u8fdb\u60a8\u7684\u5267\u7ec4\u554a\uff1f\u201d\u3001\u201c\u8fd8\u662f\u6ca1\u6709\u5462\uff1f\u201d\uff09\uff0c\u4f46\u6700\u7ec8\u80fd\u63a5\u53d7\u5b89\u6392\uff08\u201c\u884c\u5427\u201d\uff09\uff0c\u672a\u51fa\u73b0\u6fc0\u70c8\u60c5\u7eea\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u5b8c\u6210\u4e862980\u5143\u8bfe\u7a0b\u652f\u4ed8\uff0c\u8fc7\u7a0b\u5b58\u5728\u6ce2\u6298\uff08\u9000\u6b3e\u91cd\u4ed8\u3001\u5206\u4e24\u65e5\u652f\u4ed8\uff09\uff0c\u4f46\u6700\u7ec8\u5b8c\u6210\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u6216\u914d\u5076\u7684\u8ba8\u8bba\uff0c\u51b3\u7b56\u770b\u4f3c\u7531\u7528\u6237\u72ec\u7acb\u5b8c\u6210\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u7eaf\u5ea6 (B\u7c7b)**: \u52a8\u673a\u660e\u786e\u4f46\u6df7\u5408\uff0c\u65e2\u6709\u6280\u80fd\u63d0\u5347\u610f\u613f\uff0c\u4e5f\u6709\u660e\u786e\u7684\u53d8\u73b0\u671f\u5f85\uff0c\u5c5e\u4e8e\u201c\u804c\u4e1a\u63a2\u7d22/\u526f\u4e1a\u521b\u6536\u201d\u578b\u3002\n*   **\u6b65\u9aa42 - \u8d44\u6e90\u5e95\u5ea7 (C\u7c7b)**: \u652f\u4ed8\u8fc7\u7a0b\u663e\u9732\u51fa\u660e\u663e\u7684**\u8d44\u91d1\u538b\u529b**\uff0c\u5bf9\u4ef7\u683c\u654f\u611f\uff0c\u9009\u62e9\u77ed\u671f\u8bfe\u7a0b\uff0c\u7b26\u5408\u201c\u8d44\u6e90\u6709\u9650\u578b\u201d\u7279\u5f81\u3002\n*   **\u6b65\u9aa43 - \u5fc3\u7406\u5f39\u6027 (B\u7c7b)**: \u5b66\u4e60\u884c\u4e3a\u914d\u5408\uff0c\u80fd\u63a5\u53d7\u8ba1\u5212\u8c03\u6574\uff0c\u4f46\u4f1a\u6301\u7eed\u8ffd\u95ee\u7ec6\u8282\u4ee5\u5bfb\u6c42\u786e\u5b9a\u6027\uff0c\u5f39\u6027\u5c1a\u53ef\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**: **B-C\u578b\u7528\u6237**\u3002\u6709\u660e\u786e\u5b66\u4e60\u4e0e\u53d8\u73b0\u52a8\u673a\uff0c\u4f46\u652f\u4ed8\u80fd\u529b\u662f\u660e\u663e\u77ed\u677f\uff0c\u5bf9\u56de\u62a5\u5468\u671f\u548c\u6295\u5165\u6210\u672c\u654f\u611f\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b: T5 \u7cbe\u6253\u7ec6\u7b97\u52a1\u5b9e\u8005**\u3002\n    *   **\u4f9d\u636e**: 1) **\u4ef7\u683c\u654f\u611f**: \u53cd\u590d\u786e\u8ba4\u8d39\u7528\u3001\u5206\u671f\u3001\u8d60\u54c1\uff08\u8d60\u8bfe\u3001\u7248\u6743\u4e66\uff09\u30022) **\u52a1\u5b9e\u6c42\u8bc1**: \u591a\u6b21\u8ffd\u95ee\u8bbe\u5907\u8981\u6c42\u3001\u63a5\u5355\u53ef\u884c\u6027\u3001\u7248\u6743\u4e66\u4f7f\u7528\u65b9\u5f0f\uff08\u201c\u559c\u64ad\u4e0a\u80fd\u770b\u5230\u5417\uff1f\u201d\uff09\u30023) **\u6709\u9650\u6295\u5165**: \u5148\u9009\u62e92\u4e2a\u6708\u8bfe\u7a0b\uff0c\u5e76\u5173\u6ce8\u65f6\u95f4\u6295\u5165\uff08\u201c\u53ea\u6709\u4e2d\u5348\u548c\u665a\u4e0a\u6709\u65f6\u95f4\uff0c\u80fd\u5b66\u597d\u5417\uff1f\u201d\uff09\u30024) **\u76ee\u6807\u5bfc\u5411**: \u5173\u6ce8\u70b9\u59cb\u7ec8\u56f4\u7ed5\u201c\u8fdb\u5267\u7ec4\u201d\u3001\u201c\u63a5\u5355\u201d\u7b49\u5177\u4f53\u4ea7\u51fa\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4e2d)\n\u9010\u9879\u6392\u67e57\u79cd\u9000\u8d39\u6839\u56e0\uff1a\n1.  **\u6548\u679c\u4e0d\u53ca\u9884\u671f (\u4e2d\u9ad8\u98ce\u9669)**: \u7528\u6237\u5bf9\u201c\u7528\u624b\u673a\u5f55\u80fd\u8bd5\u97f3\u6210\u529f\u201d\u5b58\u7591\uff0c\u8868\u660e\u5176\u5bf9\u5b66\u4e60\u6548\u679c\u4e0e\u53d8\u73b0\u7ed3\u679c\u7684\u5173\u8054\u6027\u6709**\u9ad8\u671f\u5f85**\u3002\u82e5\u521d\u671f\u8bd5\u97f3\u4e0d\u987a\u5229\uff0c\u6613\u4ea7\u751f\u201c\u88ab\u9a97\u201d\u611f\u3002\n2.  **\u7ecf\u6d4e\u538b\u529b (\u9ad8\u98ce\u9669)**: **\u652f\u4ed8\u8fc7\u7a0b\u5df2\u66b4\u9732\u7ecf\u6d4e\u7d27\u5f20**\u3002\u8fd9\u662f\u6700\u6838\u5fc3\u7684\u9000\u8d39\u98ce\u9669\u70b9\uff0c\u4efb\u4f55\u5916\u90e8\u7ecf\u6d4e\u6ce2\u52a8\u90fd\u53ef\u80fd\u89e6\u53d1\u5176\u9000\u8d39\u3002\n3.  **\u65f6\u95f4\u51b2\u7a81 (\u4e2d\u98ce\u9669)**: \u81ea\u8ff0\u4ec5\u6709\u4e1a\u4f59\u65f6\u95f4\u5b66\u4e60\uff0c\u82e5\u5de5\u4f5c\u6216\u751f\u6d3b\u7e41\u5fd9\uff0c\u53ef\u80fd\u65e0\u6cd5\u8ddf\u4e0a\u8fdb\u5ea6\u3002\n4.  **\u5bb6\u5ead\u53cd\u5bf9 (\u4fe1\u606f\u4e0d\u8db3)**: \u672a\u63d0\u53ca\uff0c\u4f46\u9274\u4e8e\u5176\u72ec\u7acb\u51b3\u7b56\u8868\u8c61\uff0c\u98ce\u9669\u6682\u4f30\u4e3a\u4f4e\u3002\n5.  **\u9500\u552e\u627f\u8bfa\u672a\u5151\u73b0 (\u4e2d\u98ce\u9669)**: \u5bf9\u201c\u8fdb\u5267\u7ec4\u201d\u3001\u201c\u7248\u6743\u4e66\u201d\u3001\u201c\u8d60\u8bfe\u201d\u7b49\u627f\u8bfa\u975e\u5e38\u5173\u6ce8\u4e14\u53cd\u590d\u786e\u8ba4\u3002**\u9500\u552e\u5df2\u505a\u51fa\u201c\u5e26\u4f60\u201d\u3001\u201c\u8fdb\u5267\u7ec4\u201d\u7b49\u4e2a\u6027\u5316\u627f\u8bfa**\uff0c\u82e5\u540e\u7eed\u672a\u5151\u73b0\uff0c\u6781\u6613\u5f15\u53d1\u6295\u8bc9\u3002\n6.  **\u4ea7\u54c1\u4f53\u9a8c\u5dee (\u4e2d\u98ce\u9669)**: \u5bf9\u73ed\u7ea7\u8c03\u6574\u3001\u8d60\u8bfe\u53d1\u653e\u5ef6\u8fdf\u5df2\u8868\u73b0\u51fa\u5173\u6ce8\uff0c\u5bf9\u670d\u52a1\u54cd\u5e94\u6548\u7387\u6709\u8981\u6c42\u3002\n7.  **\u7ade\u54c1\u6bd4\u8f83/\u51b2\u52a8\u540e\u6094 (\u4f4e\u98ce\u9669)**: \u7528\u6237\u884c\u4e3a\u66f4\u504f\u5411\u52a1\u5b9e\u6c42\u8bc1\uff0c\u975e\u51b2\u52a8\u6d88\u8d39\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u98ce\u9669\u70b9**:\n    1.  **\u8fc7\u5ea6\u627f\u8bfa**: \u9500\u552e\u591a\u6b21\u4f7f\u7528\u201c\u6211\u5e26\u4f60\u201d\u3001\u201c\u8ba9\u4f60\u58f0\u97f3\u5347\u503c\u201d\u3001\u201c\u5b89\u6392\u5341\u51e0\u672c\u65b0\u624b\u4e66\u201d\u7b49\u8bdd\u672f\uff0c**\u5b58\u5728\u6a21\u7cca\u7684\u6210\u679c\u627f\u8bfa\u98ce\u9669**\u3002\n    2.  **\u5236\u9020\u7a00\u7f3a\u4e0e\u7d27\u8feb**: \u4f7f\u7528\u201c\u540d\u989d\u8981\u6ca1\u6709\u4e86\u201d\u3001\u201c\u798f\u5229\u5b66\u59d0\u90fd\u7ed9\u4f60\u51c6\u5907\u597d\u4e86\u201d\u7b49\u8bdd\u672f\uff0c\u7b26\u5408\u884c\u4e1a\u5e38\u89c1\u4fc3\u5355\u624b\u6cd5\uff0c\u4f46\u672a\u53d1\u73b0\u660e\u663e\u8fdd\u89c4\u3002\n    3.  **\u652f\u4ed8\u5f15\u5bfc**: \u5728\u7528\u6237\u63d0\u51fa\u5206\u671f\u9700\u6c42\u65f6\uff0c\u9500\u552e\u5f15\u5bfc\u5176\u201c\u4ed8\u4e00\u90e8\u5206\u4fdd\u7559\u540d\u989d\u201d\uff0c\u5e76\u64cd\u4f5c\u4e86\u9000\u6b3e\u91cd\u4ed8\u6d41\u7a0b\u3002\u6b64\u8fc7\u7a0b**\u589e\u52a0\u4e86\u7528\u6237\u7684\u652f\u4ed8\u590d\u6742\u5ea6**\uff0c\u4f46\u672a\u53d1\u73b0\u5f3a\u5236\u6216\u6b3a\u8bc8\u3002\n*   **\u603b\u4f53\u8bc4\u4ef7**: \u9500\u552e\u6d41\u7a0b\u5b58\u5728**\u8f7b\u5ea6\u8fc7\u5ea6\u627f\u8bfa**\u503e\u5411\uff0c\u4f46\u672a\u89e6\u53ca\u6838\u5fc3\u4f26\u7406\u7ea2\u7ebf\uff08\u5982\u62c5\u4fdd\u6536\u5165\uff09\u3002\u4e3b\u8981\u98ce\u9669\u5728\u4e8e\u4e3a\u7528\u6237\u690d\u5165\u4e86\u8f83\u9ad8\u7684\u53d8\u73b0\u9884\u671f\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6 (\u504f\u5dee)**: \u7528\u6237\u4e3a**\u4ef7\u683c\u654f\u611f\u3001\u671f\u5f85\u5feb\u901f\u53d8\u73b0\u7684\u517c\u804c\u5b66\u4e60\u8005**\uff0c\u4e0e\u9700\u8981\u957f\u671f\u6295\u5165\u3001\u6280\u80fd\u6253\u78e8\u5468\u671f\u8f83\u957f\u7684\u6709\u58f0\u6f14\u64ad\u9ad8\u9636\u8bfe\u7a0b\u5b58\u5728\u4e00\u5b9a\u504f\u5dee\u3002\u5176\u66f4\u9002\u5408\u77ed\u671f\u3001\u5f3a\u5b9e\u64cd\u3001\u5feb\u53cd\u9988\u7684\u5165\u95e8\u6216\u63a5\u5355\u5bfc\u5411\u4ea7\u54c1\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **\u9996\u5468\u91cd\u70b9\u7ba1\u7406\u53d8\u73b0\u9884\u671f\uff0c\u5f3a\u5316\u8fc7\u7a0b\u6fc0\u52b1**\u3002\n*   **\u5177\u4f53\u884c\u52a8\u5efa\u8bae**:\n    1.  **\u9884\u671f\u7ba1\u7406**: \u5f00\u8425\u5373\u660e\u786e\u5b66\u4e60\u66f2\u7ebf\uff0c\u5f3a\u8c03\u201c\u624b\u673a\u5f55\u5236\u201d\u5728\u521d\u671f\u7684\u5c40\u9650\u6027\uff0c\u5c06\u201c\u63a5\u5355\u201d\u76ee\u6807\u62c6\u89e3\u4e3a\u201c\u5b8c\u6210\u9ad8\u8d28\u91cf\u4f5c\u4e1a-\u83b7\u5f97\u8bd5\u97f3\u8d44\u683c-\u79ef\u7d2f\u4f5c\u54c1\u201d\u7684\u9636\u6bb5\u6027\u8fc7\u7a0b\uff0c**\u964d\u4f4e\u5176\u4e0d\u5207\u5b9e\u9645\u7684\u901f\u6210\u5e7b\u60f3**\u3002\n    2.  **\u8d22\u52a1\u5173\u6000**: \u907f\u514d\u5728\u670d\u52a1\u4e2d\u63d0\u53ca\u989d\u5916\u6d88\u8d39\uff08\u5982\u8bbe\u5907\u5347\u7ea7\uff09\uff0c\u51cf\u8f7b\u5176\u7ecf\u6d4e\u538b\u529b\u611f\u77e5\u3002\n    3.  **\u5373\u65f6\u53cd\u9988**: \u5bf9\u5176\u63d0\u4ea4\u7684\u4f5c\u4e1a\uff08\u5982\u6253\u5361\u6587\u672c\uff09\u7ed9\u4e88**\u5177\u4f53\u3001\u53ca\u65f6\u7684\u6b63\u9762\u70b9\u8bc4**\uff0c\u5f3a\u5316\u5176\u201c\u6bcf\u4e00\u6b65\u90fd\u6709\u6536\u83b7\u201d\u7684\u611f\u89c9\uff0c\u62b5\u6d88\u5bf9\u8fdc\u671f\u7ed3\u679c\u7684\u7126\u8651\u3002\n    4.  **\u627f\u8bfa\u8ffd\u8e2a**: \u4e3b\u52a8\u8ddf\u8fdb\u5e76\u5151\u73b0\u9500\u552e\u627f\u8bfa\u7684\u201c\u7248\u6743\u4e66\u201d\u9886\u53d6\u4e0e\u4f7f\u7528\u6307\u5bfc\uff0c\u5efa\u7acb\u4fe1\u4efb\u3002\n    5.  **\u98ce\u9669\u76d1\u63a7**: \u5c06\u5176\u5217\u4e3a**\u91cd\u70b9\u89c2\u5bdf\u5bf9\u8c61**\uff0c\u5173\u6ce8\u5176\u524d\u671f\u4f5c\u4e1a\u5b8c\u6210\u60c5\u51b5\u548c\u60c5\u7eea\u53cd\u9988\uff0c\u4e00\u65e6\u51fa\u73b0\u61c8\u6020\u6216\u62b1\u6028\u82d7\u5934\uff0c\u9700\u7acb\u5373\u4ecb\u5165\u6c9f\u901a\u3002\n\n{\"core_type\": \"T5 \u7cbe\u6253\u7ec6\u7b97\u52a1\u5b9e\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u9996\u5468\u91cd\u70b9\u7ba1\u7406\u53d8\u73b0\u9884\u671f\"}";
