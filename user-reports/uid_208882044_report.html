01d\n  > \u201c\u6211\u5199\u7684\u592a\u6162\u4e86[\u7834\u6d95\u4e3a\u7b11]\u5c31\u7ed9\u4f60\u8bf4\uff01\u89c9\u5f97\u81ea\u5df1\u8111\u5b50\u8ddf\u4e0d\u4e0a\uff0c\u624b\u4e5f\u8ddf\u4e0d\u4e0a\u201d\n  > \u201c\u6211\u756a\u8304\u7b7e\u4e86\u5f88\u591a\u7bc7\u4f46\u662f\u6211\u6ca1\u767b\u8bb0\u6211\u5c31\u60f3\u7740\u5356\u4e2a\u94b1\u4e86\u518d\u767b\u8bb0[\u6342\u8138]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b06\u9ad8\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u9ad8** \u2014 \u5df2\u8fde\u7eed\u8d2d\u4e70\u77ed\u6545\u4e8b\u3001AIGC\u3001\u6539\u7a3f\u8bfe\u7b49\u591a\u95e8\u8bfe\u7a0b\uff0c\u5e76\u8d2d\u4e70AI\u7ed8\u753b\u5de5\u5177\uff08\u5373\u68a6\uff09\u4f1a\u5458\uff0c\u65e0\u8d44\u91d1\u538b\u529b\u4fe1\u53f7\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u9ad8** \u2014 \u80fd\u9ad8\u9891\u53c2\u4e0e\u7fa4\u804a\u3001\u4e3b\u52a8\u521b\u4f5c\u5267\u672c\u3001\u79ef\u6781\u6295\u7a3f\u3001\u7814\u7a76AI\u5de5\u5177\uff0c\u65f6\u95f4\u652f\u914d\u5ea6\u9ad8\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\uff0c\u4f46\u9ad8\u65f6\u95f4\u81ea\u7531\u5ea6\u4fa7\u9762\u53cd\u6620\u652f\u6301\u5ea6\u826f\u597d\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\uff0c\u5fc3\u6001\u79ef\u6781\uff0c\u80fd\u4e3b\u52a8\u8c03\u6574\u7b56\u7565\uff0c\u65e0\u9700\u5916\u90e8\u5b89\u629a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u8fd8\u662f\u5f97\u5b8c\u6210\u5927\u4e8e\u5b8c\u7f8e\u201d\uff08\u9762\u5bf9\u521b\u4f5c\u901f\u5ea6\u6162\u7684\u81ea\u6211\u8c03\u8282\uff09\n  > \u201c\u6211\u90a3\u5929\u770b\u4e86\u5218\u6148\u6b23\u53e4\u65e9\u7684\u79d1\u5e7b\u5c0f\u8bf4\u300a\u4e61\u6751\u6559\u5e08\u300b\u4e5f\u5f88\u9707\u64bc\u3002\u8fd8\u662f\u8981\u5fc3\u6000\u5927\u7231\u201d\uff08\u4ece\u4f18\u79c0\u4f5c\u54c1\u4e2d\u6c72\u53d6\u80fd\u91cf\uff09\n  > \u201c\u5927\u5bb6\u4e0d\u8981\u653e\u5f03\u5440\uff0c\u575a\u6301\u624d\u4f1a\u6709\u7ed3\u679c\uff0c\u5feb\u5feb\u8865\u4f5c\u4e1a\u5566\u201d\uff08\u4e3b\u52a8\u9f13\u52b1\u4ed6\u4eba\uff0c\u5c55\u73b0\u9886\u5bfc\u529b\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u521b\u4f5c\u80fd\u529b\u7cbe\u8fdb\u7684\u6e34\u671b\u4e0e\u5bf9\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u7126\u8651\u5e76\u5b58\u3002\u5979\u5df2\u5177\u5907\u53d8\u73b0\u6e20\u9053\uff08\u7532\u65b9\u8054\u7cfb\uff09\uff0c\u4f46\u6838\u5fc3\u9a71\u52a8\u529b\u662f**\u8ffd\u6c42\u521b\u4f5c\u80fd\u529b\u7684\u7a81\u7834\u3001\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u3001\u5728\u793e\u7fa4\u4e2d\u5efa\u7acb\u5f71\u54cd\u529b**\uff0c\u800c\u975e\u5355\u7eaf\u77ed\u671f\u53d8\u73b0\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u6df1\u5ea6\u8ba4\u540c\u4e0e\u8d4b\u80fd**\uff0c\u4ee5\u53ca**\u5728\u793e\u7fa4\u4e2d\u8d4b\u4e88\u5176\u201c\u9886\u8896\u201d\u6216\u201c\u6838\u5fc3\u8d21\u732e\u8005\u201d\u7684\u8eab\u4efd\u8ba4\u540c**\uff0c\u6ee1\u8db3\u5176\u81ea\u6211\u5b9e\u73b0\u4e0e\u5c0a\u91cd\u7684\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe2 A\u7c7b** (\u9ad8\u4ef7\u503c\u9886\u8896\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T1-A \u5bfc\u6f14\u578b\u9886\u8896** (\u6838\u5fc3\u5229\u6da6) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u672a\u63d0\u53ca\u5bb6\u5ead\uff0c\u4e14\u7ecf\u6d4e\u72ec\u7acb\uff0c\u98ce\u9669\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u65f6\u95f4\u5145\u88d5\uff0c\u5b66\u4e60\u70ed\u60c5\u9ad8\uff0c\u8ddf\u8fdb\u80fd\u529b\u5f3a\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u632b\u80fd\u81ea\u6211\u8c03\u8282\u5e76\u9f13\u52b1\u4ed6\u4eba\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | **\u6838\u5fc3\u98ce\u9669\u70b9**\uff1a\u82e5\u957f\u671f\u6295\u7a3f\u65e0\u679c\u6216\u7532\u65b9\u5408\u4f5c\u672a\u843d\u5730\uff0c\u53ef\u80fd\u4ea7\u751f\u4ef7\u503c\u6000\u7591\u3002\u9700\u7528\u201c\u8fc7\u7a0b\u8ba4\u53ef\u201d\u5bf9\u51b2\u201c\u7ed3\u679c\u7126\u8651\u201d\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u8bfe\u7a0b\u7ed3\u675f\u540e3-6\u4e2a\u6708\uff0c\u82e5\u6301\u7eed\u6295\u7a3f\u65e0\u6b63\u5411\u53cd\u9988\u4e14\u7f3a\u4e4f\u65b0\u7684\u6210\u957f\u523a\u6fc0\u70b9\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u770b\u5230\u4f60\u5728\u7fa4\u91cc\u4e0d\u4ec5\u81ea\u5df1\u5b66\u5f97\u5e26\u52b2\uff0c\u8fd8\u603b\u5e26\u7740\u5927\u5bb6\u4e00\u8d77\u5f80\u524d\u51b2\uff0c\u8fd9\u80a1\u52b2\u513f\u592a\u68d2\u4e86\uff01\u54b1\u4eec\u8fd9\u4e2a\u73ed\u4ee5\u540e\u5c31\u9760\u4f60\u8fd9\u6837\u7684\u2018\u9886\u5934\u7f8a\u2019\u4e86\u3002\u6709\u4efb\u4f55\u60f3\u6cd5\u6216\u8005\u9700\u8981\u534f\u8c03\u8d44\u6e90\u7684\uff0c\u968f\u65f6\u8ddf\u6211\u63d0\uff0c\u6211\u5168\u529b\u652f\u6301\u4f60\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** + **\u3010\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\u3011**\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T1-A\uff0c\u5fc5\u987b\u8865\u5145 **\u3010\u7edf\u7b79\u6743\u529b\u4e0b\u653e\u5305\u3011** \u4e0e **\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011**\u3002\u53ef\u9080\u8bf7\u5176\u62c5\u4efb\u5c0f\u7ec4\u957f\u3001\u4f5c\u4e1a\u7edf\u8ba1\u5b98\u6216\u56f4\u8bfb\u4f1a\u4e3b\u6301\u4eba\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u5c0f\u767d\u201d\u3001\u201c\u65b0\u624b\u201d\u7b49\u8bcd\u6c47\u77ee\u5316\u5979\uff1b\u7528\u673a\u68b0\u7684\u7fa4\u53d1\u8bdd\u672f\u4e0e\u5979\u6c9f\u901a\uff1b\u5728\u5979\u7ec4\u7ec7\u6d3b\u52a8\u6216\u63d0\u51fa\u5efa\u8bae\u65f6\u6cfc\u51b7\u6c34\u6216\u8d8a\u6743\u5e72\u6d89\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5979\u5177\u5907\u9ad8\u590d\u8d2d\u6f5c\u529b\uff08\u5df2\u8d2d\u591a\u95e8\u8bfe\uff09\uff0c\u53ef\u57fa\u4e8e\u5176\u5174\u8da3\uff08\u5982AI\u89c6\u9891\u5236\u4f5c\u3001\u5267\u672c\u7cbe\u4fee\uff09\u63a8\u8350\u9ad8\u9636\u3001\u9ad8\u5ba2\u5355\u7684\u79c1\u6559\u8bfe\u6216\u9879\u76ee\u5236\u5b9e\u6218\u8425\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5927\u5bb6\u4e0d\u8981\u653e\u5f03\u5440\uff0c\u575a\u6301\u624d\u4f1a\u6709\u7ed3\u679c\uff0c\u5feb\u5feb\u8865\u4f5c\u4e1a\u5566\u201d **(\u4e3b\u52a8\u627f\u62c5\u7ba1\u7406\u3001\u9f13\u52b1\u89d2\u8272)**\n2. > \u201c\u4eca\u5929\u6709\u4e2a\u7532\u65b9\u8054\u7cfb\u6211\uff0c\u8981\u5927\u91cf\u6536AIGC\u7684\u5267\u672c\u201d **(\u5df2\u6709\u53d8\u73b0\u6e20\u9053\uff0c\u52a8\u673a\u8d85\u8d8a\u77ed\u671f\u641e\u94b1)**\n3. > \u201c\u73ed\u73ed\u6211\u53bb\u62a5\u540d\u4e86\u90a3\u4e2a\u77ed\u6545\u4e8b\u73ed\u73ed\u7684\u62db\u8058[\u5077\u7b11]\u662f\u4e0d\u662f\u6709\u5185\u63a8\u5565\u7684\u201d **(\u6df1\u5ea6\u8ba4\u540c\u793e\u7fa4\uff0c\u6709\u6210\u4e3a\u201c\u81ea\u5df1\u4eba\u201d\u7684\u5f52\u5c5e\u4e0e\u6743\u529b\u8bc9\u6c42)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T1-A \u5bfc\u6f14\u578b\u9886\u8896\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u81ea\u6211\u5b9e\u73b0\u4e0e\u5c0a\u91cd\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u8d4b\u4e88\u5176\u5b98\u65b9\u8ba4\u53ef\u7684\u7edf\u7b79\u6743\u4e0e\u8bdd\u8bed\u6743\uff0c\u8ba9\u5979\u6210\u4e3a\u73ed\u7ea7\u751f\u6001\u7684\u5efa\u8bbe\u8005\u4e0e\u7ef4\u62a4\u8005\u3011**\u3002\n\n```json\n{\"core_type\": \"T1-A \u5bfc\u6f14\u578b\u9886\u8896\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\"}\n```";
