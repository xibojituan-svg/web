        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676933158 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-02-18 \u81f3 2026-03-02 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u674e\u4ead\u6bc5 (\u5e08\u59d0/\u62db\u52df\u5b98)\u3001\u96f7\u743c\u743c (\u73ed\u73ed) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6500\u767b\u8ba1\u5212 (\u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u4fe1\u606f\u4e0d\u8db3\uff0c**\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u91d1\u989d\u6216\u7ecf\u6d4e\u538b\u529b\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u4e3a\u5b9d\u5988\uff0c\u9700\u63a5\u9001\u5b69\u5b50\u3001\u5904\u7406\u5bb6\u5ead\u4e8b\u52a1\uff08\u5a46\u5a46\u751f\u75c5\uff09\uff0c\u6709\u5168\u804c\u6216\u517c\u804c\u5de5\u4f5c\uff08\u63d0\u53ca\u201c\u65e9\u73ed\u201d\uff09\uff0c\u4e14\u8eab\u5904\u6d77\u5916\u6709\u65f6\u5dee\uff08\u4e0e\u56fd\u5185\u76f8\u5dee16\u5c0f\u65f6\uff09\u3002\u65f6\u95f4\u88ab\u9ad8\u5ea6\u5206\u5272\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u672a\u660e\u786e\u63d0\u53ca\u5bb6\u4eba\uff08\u7279\u522b\u662f\u914d\u5076\uff09\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\u3002\u4ec5\u63d0\u53ca\u201c\u5a46\u5a46\u53d1\u75c5\u201d\u9700\u5e2e\u5fd9\uff0c\u6697\u793a\u5bb6\u5ead\u8d23\u4efb\u91cd\uff0c\u4f46\u672a\u89e6\u53ca\u6838\u5fc3\u51b3\u7b56\u652f\u6301\u5ea6\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u5b66\u4e60\u884c\u4e3a\u4e0e\u5fc3\u6001\u8bb0\u5f55\u9971\u6ee1\uff0c\u4f46\u5173\u952e\u7684\u5bb6\u5ead\u652f\u6301\u4e0e\u652f\u4ed8\u4fe1\u606f\u7f3a\u5931\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06**\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u957f\u671f\u6210\u957f\u800c\u6765\u3002\u5173\u6ce8\u53d1\u97f3\u3001\u6c14\u606f\u3001\u620f\u611f\u7b49\u4e13\u4e1a\u6280\u80fd\u6253\u78e8\uff0c\u4e3b\u52a8\u52a0\u7ec3\uff0c\u76ee\u6807\u660e\u786e\u4e3a\u201c\u957f\u671f\u505a\u4e0b\u53bb\u201d\u3001\u201c\u6162\u6162\u8d70\u7a33\u201d\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u60f3\u957f\u671f\u505a\u4e0b\u53bb\uff0c\u54ea\u6015\u6ca1\u6709\u5f88\u51fa\u5f69\u7684\u6210\u7ee9\uff0c\u4e5f\u60f3\u50cf\u4f60\u4e00\u6837\u6162\u6162\u8d70\u7a33\uff0c\u8e0f\u8e0f\u5b9e\u5b9e\u7684\u8d70\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1**\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u672a\u63d0\u53ca\u7ecf\u6d4e\u72b6\u51b5\uff0c\u4f46\u4e3b\u52a8\u8be2\u95ee\u4e13\u4e1a\u5f55\u97f3\u8bbe\u5907\uff0c\u6697\u793a\u6709\u4e00\u5b9a\u7ecf\u6d4e\u57fa\u7840\u6216\u89c4\u5212\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d**\u3002\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\uff08\u5b9d\u5988\u3001\u5de5\u4f5c\u3001\u65f6\u5dee\uff09\uff0c\u4f46**\u6267\u884c\u529b\u6781\u5f3a**\uff0c\u80fd\u5229\u7528\u65e9\u8d77\u3001\u9001\u5b69\u5b50\u95f4\u9699\u7b49\u65f6\u95f4\u575a\u6301\u7ec3\u4e60\u6253\u5361\u3002\u7cbe\u529b\u88ab\u5bb6\u5ead\u4e8b\u52a1\u5206\u6563\uff08\u5a46\u5a46\u751f\u75c5\u3001\u82b1\u7c89\u8fc7\u654f\uff09\uff0c\u4f46\u5b66\u4e60\u610f\u613f\u575a\u5b9a\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u5bb6\u5ead\u8d23\u4efb\u91cd\uff08\u5b69\u5b50\u3001\u5a46\u5a46\uff09\uff0c\u662f\u65f6\u95f4\u7cbe\u529b\u7684\u4e3b\u8981\u6d88\u8017\u9879\uff0c\u4f46\u672a\u63d0\u53ca\u6838\u5fc3\u51b3\u7b56\u8005\uff08\u5982\u914d\u5076\uff09\u7684\u6001\u5ea6\uff0c\u6784\u6210\u6f5c\u5728\u98ce\u9669\u70b9\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06**\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9047\u5230AI\u7ec3\u529f\u623f\u6253\u51fb\u3001\u6280\u672f\u95ee\u9898\uff08\u8fdb\u4e0d\u53bb\u76f4\u64ad\u3001\u8d26\u53f7\u7ed1\u5b9a\uff09\u65f6\uff0c\u80fd\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\u3001\u81ea\u6211\u8c03\u4f83\uff08\u201c\u8d22\u795e\u7237\u5835\u5728\u8def\u4e0a\u4e86\u201d\uff09\uff0c\u5e76\u5feb\u901f\u8c03\u6574\u7b56\u7565\uff0c\u805a\u7126\u4e8e\u53ef\u63a7\u7684\u57fa\u672c\u529f\u7ec3\u4e60\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u7ec3\u529f\u623f\u7684\u96be\u5ea6\u633a\u5927\u7684\uff0c\u4ee5\u4e3a\u8bfb\u5bf9\u4e86\u7ed3\u679c\u2026\u2026\u4e00\u8a00\u96be\u5c3d\u554a[\u6342\u8138][\u6342\u8138]\u201d \uff08\u53d1\u73b0\u95ee\u9898\uff09 > \u201c\u90a3\u6211\u5c31\u5148\u4e0d\u7ec3\u4e86...\u6211\u73b0\u5728\u4e3b\u8981\u5c31\u662f\u7ec3\u90a3\u4e2a\u56db\u58f0\u6b4c...\u201d\uff08\u4e3b\u52a8\u8c03\u6574\uff0c\u805a\u7126\u53ef\u63a7\u9879\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 (\u8ffd\u6c42\u6210\u5c31\u3001\u81ea\u4fe1\u3001\u81ea\u6211\u4ef7\u503c)** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u4f5c\u4e3a\u8eab\u5904\u6d77\u5916\u7684\u5b9d\u5988\uff0c\u5728\u591a\u91cd\u89d2\u8272\uff08\u6bcd\u4eb2\u3001\u59bb\u5b50\u3001\u53ef\u80fd\u7684\u5de5\u4f5c\u8005\uff09\u6324\u538b\u4e0b\uff0c**\u6e34\u671b\u62e5\u6709\u4e00\u4efd\u80fd\u8bc1\u660e\u81ea\u5df1\u80fd\u529b\u3001\u83b7\u5f97\u5916\u754c\u8ba4\u53ef\u7684\u4e2a\u4eba\u4e8b\u4e1a\u6216\u6280\u80fd**\uff0c\u4ee5\u5efa\u7acb\u72ec\u7acb\u7684\u8eab\u4efd\u8ba4\u540c\u548c\u4ef7\u503c\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u6210\u957f\u966a\u4f34**\u3002\u5979\u9700\u8981\u88ab\u770b\u89c1\u201c\u52aa\u529b\u201d\u548c\u201c\u8fdb\u6b65\u201d\uff0c\u9700\u8981\u5bfc\u5e08\uff08\u5e08\u59d0/\u73ed\u73ed\uff09\u7684\u6743\u5a01\u80af\u5b9a\u6765\u5f3a\u5316\u5176\u201c\u8d70\u5728\u6b63\u786e\u9053\u8def\u4e0a\u201d\u7684\u4fe1\u5fc3\uff0c\u4ece\u800c\u5bf9\u6297\u65e5\u5e38\u7410\u788e\u5e26\u6765\u7684\u4ef7\u503c\u611f\u7a00\u91ca\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u9ad8\u52a8\u673a\u3001\u4e2d\u7b49\u8d44\u6e90\u3001\u9ad8\u5f39\u6027\uff0c\u662f\u6838\u5fc3\u670d\u52a1\u4e0e\u6f5c\u5728\u590d\u8d2d\u5bf9\u8c61) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u884c\u52a8\u529b\u5f3a\uff0c\u5173\u6ce8\u786c\u6838\u6280\u80fd\u63d0\u5347\uff0c\u4e0d\u5f20\u626c\u4f46\u6e34\u671b\u88ab\u4e13\u4e1a\u8ba4\u53ef\uff0c\u9075\u5faa\u6307\u5bfc) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5ead\u5927\u5435\u7b49\u5371\u9669\u4fe1\u53f7\u3002\u4f46**\u5bb6\u5ead\u652f\u6301\u5ea6\u4fe1\u606f\u7f3a\u5931**\uff0c\u9700\u5728\u540e\u7eed\u670d\u52a1\u4e2d\u6e29\u548c\u63a2\u67e5\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | **\u5173\u952e\u98ce\u9669\u70b9**\uff1a\u4fe1\u606f\u7f3a\u5931\u3002\u82e5\u5b66\u4e60\u6295\u5165\uff08\u65f6\u95f4\u3001\u53ef\u80fd\u540e\u7eed\u7684\u8bbe\u5907\u6295\u5165\uff09\u4e0e\u5bb6\u5ead\u8d23\u4efb\uff08\u80b2\u513f\u3001\u7167\u987e\u8001\u4eba\uff09\u4ea7\u751f\u4e25\u91cd\u51b2\u7a81\uff0c\u4e14\u5bb6\u4eba\u4e0d\u77e5\u60c5\u6216\u4e0d\u652f\u6301\uff0c\u53ef\u80fd\u5f15\u53d1\u5185\u90e8\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u7528\u6237\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u6781\u5f3a\uff0c\u80fd\u5229\u7528\u788e\u7247\u65f6\u95f4\u575a\u6301\u3002\u4e3b\u8981\u98ce\u9669\u5728\u4e8e**\u65f6\u5dee\u5bfc\u81f4\u7684\u76f4\u64ad\u8bfe\u53c2\u4e0e\u969c\u788d**\uff0c\u4f46\u7528\u6237\u5df2\u4e3b\u52a8\u9002\u5e94\u770b\u56de\u653e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u632b\u80fd\u81ea\u6211\u8c03\u6574\u5e76\u5bfb\u627e\u89e3\u51b3\u65b9\u6848\uff08\u5982\u653e\u5f03AI\u7ec3\u529f\u623f\uff0c\u56de\u5f52\u57fa\u7840\u7ec3\u4e60\uff09\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4f4e** | \u52a8\u673a\u7eaf\u5ea6\u9ad8\uff0c\u5173\u6ce8\u957f\u671f\u6210\u957f\u800c\u975e\u77ed\u671f\u53d8\u73b0\uff0c\u5bf9\u201c\u51fa\u5f69\u6210\u7ee9\u201d\u6709\u7406\u6027\u9884\u671f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u8bfe\u7a0b\u4e2d\u671f\uff08\u7b2c3-5\u5468\uff09**\u3002\u5f53\u8bfe\u7a0b\u96be\u5ea6\u63d0\u5347\u3001\u4f5c\u4e1a\u590d\u6742\u5ea6\u589e\u52a0\u65f6\uff0c\u5176\u788e\u7247\u5316\u65f6\u95f4\u53ef\u80fd\u65e0\u6cd5\u652f\u6491\u6df1\u5ea6\u7ec3\u4e60\uff0c\u82e5\u540c\u65f6\u906d\u9047\u5bb6\u5ead\u4e8b\u52a1\u9ad8\u5cf0\uff08\u5982\u5b69\u5b50\u751f\u75c5\uff09\uff0c\u53ef\u80fd\u4ea7\u751f\u6301\u7eed\u6027\u7684\u7126\u8651\u4e0e\u632b\u8d25\u611f\uff0c\u7d2f\u79ef\u5230\u4e34\u754c\u70b9\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5e08\u59d0\u770b\u5230\u4f60\u5373\u4f7f\u5728\u6d77\u5916\u5e26\u5a03\u3001\u4e0a\u73ed\u8fd9\u4e48\u5fd9\u7684\u60c5\u51b5\u4e0b\uff0c\u8fd8\u80fd\u6bcf\u5929\u96f7\u6253\u4e0d\u52a8\u5730\u65e9\u8d77\u7ec3\u529f\u3001\u505a\u7b14\u8bb0\uff0c\u8fd9\u4efd\u575a\u6301\u548c\u884c\u52a8\u529b\u771f\u7684\u592a\u8ba9\u4eba\u4f69\u670d\u4e86\uff01\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u5c31\u662f\u4e3a\u4f60\u8fd9\u6837\u60f3\u8e0f\u5b9e\u5b66\u672c\u4e8b\u7684\u4eba\u8bbe\u8ba1\u7684\u3002\u522b\u62c5\u5fc3\u65f6\u5dee\u548c\u5fd9\uff0c\u4f60\u7684\u6bcf\u4e00\u4efd\u7ec3\u4e60\u548c\u95ee\u9898\uff0c\u6211\u4eec\u90fd\u4f1a\u8ba4\u771f\u5bf9\u5f85\u3002\u4f60\u7684\u76ee\u6807\u4e0d\u662f\u2018\u901f\u6210\u2019\uff0c\u800c\u662f\u2018\u8d70\u7a33\u2019\uff0c\u6211\u4eec\u966a\u4f60\u4e00\u8d77\uff0c\u6bcf\u4e00\u6b65\u90fd\u7b97\u6570\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176T2\u5b9e\u5e72\u7279\u8d28\uff0c\u63d0\u4f9b\u6e05\u6670\u3001\u7cfb\u7edf\u7684\u6280\u80fd\u8fdb\u9636\u8def\u5f84\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u788e\u7247\u5316\u65f6\u95f4\u548c\u9ad8\u6267\u884c\u529b\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u5f02\u6b65\u6df1\u5ea6\u53cd\u9988\u5305\u3011**\uff08\u5982\u9488\u5bf9\u5176\u63d0\u4ea4\u7684\u5f55\u97f3\uff0c\u63d0\u4f9b\u8be6\u7ec6\u7684\u6587\u5b57/\u8bed\u97f3\u5206\u6bb5\u70b9\u8bc4\uff0c\u800c\u975e\u4ec5\u76f4\u64ad\u7b54\u7591\uff09\u3002\u53ef\u914c\u60c5\u8f7b\u91cf\u642d\u914d **\u3010\u5708\u5c42\u8ba4\u53ef\u5305\u3011**\uff08\u5982\u5c06\u5176\u4f18\u79c0\u4f5c\u4e1a\u6216\u5b66\u4e60\u6001\u5ea6\u4f5c\u4e3a\u6848\u4f8b\u5728\u73ed\u7ea7\u5185\u533f\u540d\u8868\u626c\uff09\uff0c\u6ee1\u8db3\u5176\u5c0a\u91cd\u9700\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u5ffd\u89c6\u5979\u7684\u65f6\u95f4\u7279\u6b8a\u6027**\uff1a\u5f3a\u5236\u8981\u6c42\u8ddf\u76f4\u64ad\uff0c\u6216\u5728\u5979\u660e\u786e\u8868\u8fbe\u65f6\u5dee\u56f0\u96be\u540e\u4ecd\u4e0d\u63d0\u4f9b\u56de\u653e\u89e3\u51b3\u65b9\u6848\u3002\n    2. **\u7ed9\u4e88\u6a21\u7cca\u3001\u6577\u884d\u7684\u53cd\u9988**\uff1a\u5979\u7684\u52aa\u529b\u9700\u8981\u88ab\u201c\u770b\u89c1\u201d\u548c\u201c\u7cbe\u51c6\u6307\u5bfc\u201d\uff0c\u6577\u884d\u7684\u201c\u5f88\u68d2\u201d\u4f1a\u8ba9\u5979\u6000\u7591\u6210\u957f\u7684\u6709\u6548\u6027\u3002\n    3. **\u8fc7\u65e9\u3001\u8fc7\u5ea6\u63a8\u9500\u9ad8\u4ef7\u8bbe\u5907\u6216\u5347\u9636\u8bfe\u7a0b**\uff1a\u5979\u4e3b\u52a8\u8be2\u95ee\u8bbe\u5907\u662f\u79ef\u6781\u4fe1\u53f7\uff0c\u4f46\u5e94\u5f15\u5bfc\u5176\u201c\u5148\u7528\u73b0\u6709\u8bbe\u5907\u5b66\u597d\u57fa\u7840\u201d\uff0c\u5728\u53d6\u5f97\u9636\u6bb5\u6027\u6210\u679c\u540e\u518d\u7406\u6027\u5efa\u8bae\uff0c\u907f\u514d\u4ea7\u751f\u7ecf\u6d4e\u538b\u529b\u6216\u88ab\u63a8\u9500\u611f\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u8bfe\u7a0b\u524d\u534a\u6bb5\u8fdb\u884c\u5927\u989d\u5347\u5355**\u3002\u53ef\u5728\u8bfe\u7a0b\u4e2d\u540e\u671f\uff0c\u5f53\u5176\u6280\u80fd\u6709\u660e\u663e\u63d0\u5347\u3001\u5e76\u518d\u6b21\u4e3b\u52a8\u8be2\u95ee\u65f6\uff0c\u8c28\u614e\u63a8\u8350\u4e0e\u5f53\u524d\u6280\u80fd\u8854\u63a5\u7684**500\u5143\u4ee5\u5185\u5fae\u5347**\u4ea7\u54c1\u6216\u5b9e\u7528\u5de5\u5177\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u60f3\u957f\u671f\u505a\u4e0b\u53bb\uff0c\u54ea\u6015\u6ca1\u6709\u5f88\u51fa\u5f69\u7684\u6210\u7ee9\uff0c\u4e5f\u60f3\u50cf\u4f60\u4e00\u6837\u6162\u6162\u8d70\u7a33\uff0c\u8e0f\u8e0f\u5b9e\u5b9e\u7684\u8d70\u3002\u201d **(\u9ad8\u52a8\u673a\u7eaf\u5ea6\uff0c\u5c0a\u91cd\u9700\u6c42)**\n2. > \u201c\u6211\u6628\u665a\u7ec3\u4e60\u4f60\u7ed9\u6211\u7684\u7ec3\u4e60\uff0c\u4eca\u5929\u518d\u591a\u8bfb\u4e00\u4e0b[\u5472\u7259]\u201d & \u201c\u65e9\u529f\u7ec3\u4e60\u6709\u65f6\u95f4\u6211\u5c31\u7ec3\uff0c\u5c31\u5f53\u505a\u9762\u90e8\u745c\u4f3d\u201d **(\u9ad8\u884c\u52a8\u529b\uff0c\u5c06\u5b66\u4e60\u878d\u5165\u751f\u6d3b)**\n3. > \u201c\u7ec3\u529f\u623f\u7684\u96be\u5ea6\u633a\u5927\u7684...\u90a3\u6211\u5c31\u5148\u4e0d\u7ec3\u4e86\uff0c\u56e0\u4e3a\u6211\u611f\u89c9\u5230\u6211\u53d1\u97f3\u597d\u50cf\u633a\u51c6\u7684\uff0c\u4f46\u662f\u90a3\u91cc\u8001\u5e08\u8bf4\u6211\u4e0d\u51c6...\u6211\u73b0\u5728\u4e3b\u8981\u5c31\u662f\u7ec3\u90a3\u4e2a\u56db\u58f0\u6b4c...\u201d **(\u9ad8\u5fc3\u7406\u5f39\u6027\uff0c\u9047\u632b\u5feb\u901f\u8c03\u6574\uff0c\u805a\u7126\u53ef\u63a7\u9879)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2\u4f4e\u8c03\u5b9e\u5e72\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u5efa\u7acb\u81ea\u6211\u4ef7\u503c\uff08\u5c0a\u91cd\u9700\u6c42\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u7cbe\u51c6\u3001\u6df1\u5ea6\u7684\u5f02\u6b65\u6280\u80fd\u53cd\u9988\uff0c\u5e76\u5bf9\u5176\u201c\u52aa\u529b\u201d\u7ed9\u4e88\u6781\u9ad8\u9891\u7387\u7684\u6743\u5a01\u8ba4\u53ef\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5f02\u6b65\u6df1\u5ea6\u53cd\u9988\u5305\"}\n```";
