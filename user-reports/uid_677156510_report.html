    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677156510\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677156510 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5b98\u65b9\u62db\u52df\u5b98\u3010\u5b66\u751f\u52ff\u6dfb\u52a0\u3011(\u5434\u6e58\u5a1f) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u9ad8\u9636\u5b66\u4e60\uff08\u56db\u4e2a\u6708\u7cfb\u7edf\u8bfe\uff09\uff0c\u4ef7\u683c\u672a\u660e\u793a\uff0c\u4f46\u5305\u542b\u7248\u6743\u4e66\u3001\u6280\u672f\u6307\u5bfc\u8bfe\u3001\u653f\u7b56\u8865\u8d34\u7b49\u6743\u76ca |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u5206\u671f\u6216\u5168\u6b3e\u3002\u9700\u8b66\u60d5\u201c\u79d2\u4ed8+\u957f\u5206\u671f\u201d\u7684C2\u98ce\u9669\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u6709\u672c\u804c\u5de5\u4f5c\uff08\u201c\u6211\u73b0\u5728\u867d\u7136\u6709\u5de5\u4f5c\u201d\uff09\uff0c\u5b66\u4e60\u65f6\u95f4\u9700\u4ece\u5de5\u4f5c\u4e4b\u4f59\u6324\u51fa\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u4e92\u52a8\u79ef\u6781\uff0c\u4f46\u5173\u952e\u4fe1\u606f\uff08\u652f\u4ed8\u80fd\u529b\u3001\u5bb6\u5ead\u652f\u6301\u3001\u6df1\u5c42\u52a8\u673a\uff09\u6709\u7f3a\u5931\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u2b06\u9ad8 (7\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u4e3a\u80fd\u529b\u4e0e\u81ea\u6211\u5b9e\u73b0\u800c\u6765**\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u4e86\u201c\u5728\u6709\u58f0\u884c\u4e1a\u53d1\u5149\u53d1\u70ed\u201d\u7684\u613f\u666f\uff0c\u5e76\u5e26\u6709\u201c\u6210\u4e3a\u767e\u4e07\u5bcc\u7fc1\u201d\u7684\u68a6\u60f3\u9a71\u52a8\u3002\u8fd9\u8d85\u8d8a\u4e86\u5355\u7eaf\u7684\u77ed\u671f\u53d8\u73b0\u8bc9\u6c42\uff0c\u6307\u5411\u4e86\u81ea\u6211\u5b9e\u73b0\u548c\u5c0a\u91cd\u9700\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u60f3\u5982\u679c\u53ef\u4ee5\u6211\u60f3\u5728\u6709\u58f0\u884c\u4e1a\u53d1\u5149\u53d1\u70ed\uff0c\u6210\u4e3a\u767e\u4e07\u5bcc\u7fc1\uff0c\u54c8~\u6211\u8981\u52a0\u6cb9\u4e86\uff0c\u5148\u5439\u4e2a\u725b\uff01\u201d\n  > \u201c\u671f\u5f85\u671f\u5f85\uff01\u6fc0\u52a8\u6fc0\u52a8\uff01\u201d\uff08\u5bf9\u5b66\u4e60\u8d44\u6e90\u8868\u73b0\u51fa\u5f3a\u70c8\u70ed\u60c5\uff09\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d (5\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u5df2\u8d2d\u4e70\u9ad8\u9636\u8bfe\u7a0b\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u652f\u4ed8\u80fd\u529b\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u6765\u6e90\uff0c**\u5b58\u5728C2\u98ce\u9669\u76f2\u533a**\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u6709\u5168\u804c\u5de5\u4f5c\uff0c\u4f46\u80fd\u6309\u65f6\u5b8c\u6210\u6668\u7ec3\u3001\u542c\u8bfe\u3001\u4ea4\u4f5c\u4e1a\uff0c\u663e\u793a\u6709\u8f83\u5f3a\u7684\u81ea\u5f8b\u6027\u548c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\uff0c\u9700\u540e\u7eed\u89c2\u5bdf\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8 (7\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u9500\u552e\u5bc6\u96c6\u7684\u8bfe\u7a0b\u63a8\u9500\u548c\u4efb\u52a1\u50ac\u4fc3\uff08\u5982\u8865\u8bfe\u3001\u53d1\u53e3\u4ee4\uff09\uff0c\u7528\u6237\u59cb\u7ec8\u4fdd\u6301\u793c\u8c8c\u3001\u79ef\u6781\u56de\u5e94\uff08\u201c\u77e5\u4e86\u201d\u3001\u201c\u8c22\u8c22\u5e08\u59d0\u201d\u3001\u201c\u6211\u4f1a\u52a0\u6cb9\u7684\u201d\uff09\uff0c\u6ca1\u6709\u8868\u73b0\u51fa\u4efb\u4f55\u7126\u8651\u3001\u62b1\u6028\u6216\u4f9d\u8d56\u60c5\u7eea\u3002\u6297\u538b\u6027\u5f3a\uff0c\u60c5\u7eea\u7a33\u5b9a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u5f88\u5bf9\u4e0d\u8d77\uff0c\u5e08\u59d0\uff0c\u6211\u8fd8\u5728\u8865\u8bfe\uff0c\u4f5c\u4e1a\u6211\u5c3d\u91cf\u65e9\u70b9\u4ea4\u201d\uff08\u9762\u5bf9\u50ac\u4fc3\uff0c\u4e3b\u52a8\u6c9f\u901a\uff0c\u627f\u62c5\u8d23\u4efb\uff09\n  > \u201c\u5e08\u59d0\u8bb2\u7684\u771f\u597d\uff0c\u5f55\u4e86\u70b9\u5c4f\u60a8\u4e0d\u4ecb\u610f\u5427\uff1f\u201d\uff08\u4e3b\u52a8\u5b66\u4e60\uff0c\u79ef\u6781\u4e92\u52a8\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 & \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u201c\u88ab\u8ba4\u53ef\u201d\u548c\u201c\u5b9e\u73b0\u66f4\u9ad8\u4ef7\u503c\u201d\u7684\u6e34\u671b\u3002\u4ed6\u4e0d\u4ec5\u60f3\u8d5a\u94b1\uff0c\u66f4\u5e0c\u671b\u201c\u53d1\u5149\u53d1\u70ed\u201d\uff0c\u83b7\u5f97\u884c\u4e1a\u5185\u7684\u6210\u5c31\u611f\u548c\u8eab\u4efd\u8ba4\u540c\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u63d0\u4f9b\u201c\u6f5c\u529b\u80a1\u201d\u7684\u4e13\u5c5e\u8ba4\u540c\u611f\u548c\u6e05\u6670\u7684\u201c\u6210\u957f\u8def\u5f84\u56fe\u201d**\u3002\u8ba9\u4ed6\u611f\u53d7\u5230\u81ea\u5df1\u662f\u201c\u88ab\u9009\u4e2d\u7684\u201d\u3001\u201c\u6709\u5929\u8d4b\u7684\u201d\uff0c\u5e76\u4e3a\u4ed6\u63cf\u7ed8\u4ece\u65b0\u624b\u5230\u201c\u767e\u4e07\u5bcc\u7fc1\u201d\u4e3b\u64ad\u7684\u6e05\u6670\u8fdb\u9636\u84dd\u56fe\uff0c\u6ee1\u8db3\u5176\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\u7684\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u9ad8\u52a8\u673a\u3001\u9ad8\u5f39\u6027\u3001\u8d44\u6e90\u4e2d\uff0c\u7a33\u5b9a\u6267\u884c\uff0c\u6709\u6f5c\u529b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u60c5\u7eea\u7a33\u5b9a\u3001\u6709\u5de5\u4f5c\uff0c\u5bb6\u5ead\u7a81\u53d1\u5e72\u9884\u6982\u7387\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u56e0\u672c\u804c\u5de5\u4f5c\u7e41\u5fd9\uff0c\u82e5\u8bfe\u7a0b\u4efb\u52a1\u91cf\u8fc7\u5927\u3001\u76f4\u64ad\u65f6\u95f4\u51b2\u7a81\uff0c\u53ef\u80fd\u5bfc\u81f4\u5b66\u4e60\u8fdb\u5ea6\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u7126\u8651\uff0c\u6700\u7ec8\u56e0\u81ea\u8d23\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u632b\u6298\u6216\u6279\u8bc4\u800c\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u7528\u6237\u6709\u201c\u767e\u4e07\u5bcc\u7fc1\u201d\u7684\u957f\u671f\u68a6\u60f3\uff0c\u4f46\u82e5\u5728\u521d\u671f\uff08\u59823-6\u4e2a\u6708\u5185\uff09\u63a5\u5355\u673a\u4f1a\u6e3a\u832b\u6216\u6536\u5165\u6781\u4f4e\uff0c\u53ef\u80fd\u4ea7\u751f\u5de8\u5927\u5fc3\u7406\u843d\u5dee\uff0c\u8d28\u7591\u8bfe\u7a0b\u4ef7\u503c\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-3\u4e2a\u6708**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u82e5\u6280\u80fd\u63d0\u5347\u8fdb\u5165\u74f6\u9888\u671f\u4e14\u672a\u83b7\u5f97\u5b9e\u8d28\u6027\u53d8\u73b0\u53cd\u9988\uff0c\u53e0\u52a0\u5de5\u4f5c\u7e41\u5fd9\uff0c\u6700\u5bb9\u6613\u4ea7\u751f\u201c\u6295\u5165\u4ea7\u51fa\u6bd4\u5931\u8861\u201d\u7684\u9000\u8d39\u5ff5\u5934\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u770b\u5230\u4f60\u4e3a\u4e86\u68a6\u60f3\u8fd9\u4e48\u62fc\uff0c\u5728\u5de5\u4f5c\u4e4b\u4f59\u8fd8\u80fd\u575a\u6301\u5b66\u4e60\uff0c\u771f\u7684\u5f88\u4f69\u670d\u3002\u4f60\u662f\u6211\u4eec\u73ed\u5e95\u5b50\u597d\u53c8\u80af\u5e72\u7684\u2018\u6f5c\u529b\u80a1\u2019\uff0c\u63a5\u4e0b\u6765\u7684\u8def\u6211\u966a\u4f60\u4e00\u8d77\u8d70\u7a33\u3002\u54b1\u4eec\u4e0d\u56fe\u5feb\uff0c\u56fe\u7684\u662f\u6bcf\u4e00\u6b65\u90fd\u624e\u5b9e\uff0c\u6700\u7ec8\u5728\u8fd9\u4e2a\u884c\u4e1a\u91cc\u771f\u6b63\u2018\u53d1\u5149\u53d1\u70ed\u2019\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176\u9ad8\u52a8\u673a\u548c\u8ffd\u6c42\u7cbe\u8fdb\u7684\u5fc3\u6001\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n  1.  **\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743 (B\u6a21\u5757)\u3011**\uff1a\u63d0\u4f9b\u66f4\u6df1\u5ea6\u7684\u6280\u672f\u70b9\u8bc4\u548c\u7b54\u7591\uff0c\u6ee1\u8db3\u5176\u7cbe\u8fdb\u9700\u6c42\u3002\n  2.  **\u3010\u9636\u6bb5\u6027\u6210\u957f\u5730\u56fe (D\u6a21\u5757\u840c\u82bd)\u3011**\uff1a\u4e3a\u5176\u7ed8\u5236\u6e05\u6670\u7684\u6280\u80fd\u8fdb\u9636\u548c\u63a5\u5355\u91cc\u7a0b\u7891\uff0c\u5b9a\u671f\u53cd\u9988\u8fdb\u6b65\uff0c\u5f3a\u5316\u5176\u201c\u88ab\u9009\u4e2d\u201d\u7684\u8ba4\u540c\u611f\u3002\n  3.  **\u3010\u65f6\u95f4\u7ba1\u7406\u9526\u56ca (A\u6a21\u5757\u589e\u5f3a)\u3011**\uff1a\u4e3b\u52a8\u63d0\u4f9b\u7075\u6d3b\u5b66\u4e60\u65b9\u6848\uff08\u5982\u5f55\u64ad\u91cd\u70b9\u6807\u8bb0\u3001\u788e\u7247\u65f6\u95f4\u5b66\u4e60\u5efa\u8bae\uff09\uff0c\u9884\u9632\u201c\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u201d\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n  1.  \u7528\u201c\u6700\u540e\u540d\u989d\u201d\u3001\u201c\u9650\u65f6\u4f18\u60e0\u201d\u7b49\u8bdd\u672f\u5bf9\u5176\u8fdb\u884c\u9ad8\u538b\u903c\u5355\uff0c\u8fd9\u4f1a\u7834\u574f\u5176\u201c\u7a33\u6b65\u6210\u957f\u201d\u7684\u9884\u671f\u3002\n  2.  \u5ffd\u89c6\u5176\u65f6\u95f4\u9650\u5236\uff0c\u5b89\u6392\u8fc7\u591a\u5f3a\u5236\u540c\u6b65\u7684\u76f4\u64ad\u6216\u7d27\u6025\u4efb\u52a1\u3002\n  3.  \u5728\u5176\u9047\u5230\u74f6\u9888\u65f6\u53ea\u7ed9\u9e21\u6c64\uff0c\u4e0d\u7ed9\u5177\u4f53\u3001\u53ef\u64cd\u4f5c\u7684\u6280\u672f\u89e3\u51b3\u65b9\u6848\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5176\u9ad8\u52a8\u673a\u548c\u652f\u4ed8\u80fd\u529b\uff08\u5df2\u8d2d\u9ad8\u9636\u8bfe\uff09\u663e\u793a\u6709\u9ad8\u590d\u8d2d\u6f5c\u529b\uff0c\u53ef\u9002\u65f6\u63a8\u8350\u66f4\u9ad8\u7ea7\u7684\u79c1\u6559\u8bfe\u3001\u8bbe\u5907\u6307\u5bfc\u7b49\uff0c\u4f46\u9700\u5efa\u7acb\u5728\u5df2\u6709\u663e\u8457\u8fdb\u6b65\u548c\u4fe1\u4efb\u57fa\u7840\u4e0a\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > **\u201c\u6211\u60f3\u5982\u679c\u53ef\u4ee5\u6211\u60f3\u5728\u6709\u58f0\u884c\u4e1a\u53d1\u5149\u53d1\u70ed\uff0c\u6210\u4e3a\u767e\u4e07\u5bcc\u7fc1\uff0c\u54c8~\u6211\u8981\u52a0\u6cb9\u4e86\uff0c\u5148\u5439\u4e2a\u725b\uff01\u201d** \u2014\u2014 **\u9ad8\u7eaf\u5ea6\u52a8\u673a\uff08\u81ea\u6211\u5b9e\u73b0\uff09\u7684\u6838\u5fc3\u8bc1\u660e**\u3002\n2. > **\u201c\u5f88\u5bf9\u4e0d\u8d77\uff0c\u5e08\u59d0\uff0c\u6211\u8fd8\u5728\u8865\u8bfe\uff0c\u4f5c\u4e1a\u6211\u5c3d\u91cf\u65e9\u70b9\u4ea4\u201d** \u2014\u2014 **\u9ad8\u5fc3\u7406\u5f39\u6027\u7684\u8bc1\u660e**\u3002\u9762\u5bf9\u538b\u529b\uff0c\u4e3b\u52a8\u6c9f\u901a\u800c\u975e\u62b1\u6028\u6216\u9003\u907f\u3002\n3. > **\u201c\u5e08\u59d0\u8bb2\u7684\u771f\u597d\uff0c\u5f55\u4e86\u70b9\u5c4f\u60a8\u4e0d\u4ecb\u610f\u5427\uff1f\u201d** \u2014\u2014 **\u79ef\u6781\u5b66\u4e60\u6001\u5ea6\u548c\u5c0a\u91cd\u9700\u6c42\u7684\u4f53\u73b0**\uff0c\u4e3b\u52a8\u5bfb\u6c42\u6df1\u5ea6\u5438\u6536\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6e05\u6670\u7684\u6210\u957f\u8def\u5f84\u56fe + \u7075\u6d3b\u7684\u65f6\u95f4\u7ba1\u7406\u652f\u6301\uff0c\u4e25\u9632\u201c\u6536\u76ca\u843d\u5dee\u201d\u548c\u201c\u8fdb\u5ea6\u79ef\u538b\u201d\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\"}\n```";
