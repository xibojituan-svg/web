        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676979266 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u516d\u6708\u6668\u516e3(\u5218\u4e9a\u5a1f) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bad\u7ec3\u8425 (\u4ef7\u683c\uff1a2380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u5df2\u652f\u4ed82380\u5143\uff0c\u4f46\u652f\u4ed8\u65b9\u5f0f\uff08\u5168\u6b3e/\u5206\u671f/\u501f\u6b3e\uff09\u672a\u77e5\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u63d0\u53ca\u201c\u5e73\u65f6\u5de5\u4f5c\u5fd9\u201d\uff0c\u4f46\u672a\u8bf4\u660e\u5177\u4f53\u5de5\u4f5c\u6027\u8d28\u4e0e\u65f6\u95f4\u5b89\u6392\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u7528\u6237\u4e3b\u52a8\u8868\u8fbe\u6781\u5c11\uff0c\u591a\u4e3a\u9500\u552e\u5355\u65b9\u9762\u63a8\u52a8\u4e0e\u7528\u6237\u7b80\u77ed\u56de\u5e94\uff0c\u7f3a\u4e4f\u5173\u4e8e\u4e2a\u4eba\u80cc\u666f\u3001\u8d22\u52a1\u72b6\u51b5\u3001\u5b66\u4e60\u9884\u671f\u3001\u5bb6\u5ead\u652f\u6301\u7b49\u5173\u952e\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u5b66\u4e60\u7684\u914d\u5408\u4e0e\u5174\u8da3\uff08\u201c\u6709\uff0c\u4e2d\u5348\u5b66\u4e60\u4e86\u4e00\u4e0b\uff0c\u4e0b\u5348\u8bf4\u8bdd\u90fd\u4e0d\u592a\u4e00\u6837\u4e86\u201d\uff09\uff0c\u5e76\u5173\u6ce8\u201c\u5e73\u65f6\u5de5\u4f5c\u5fd9\u53ef\u4ee5\u8fdb\u884c\u5417\u201d\uff0c\u8868\u660e\u5176\u6709\u517c\u804c\u53d8\u73b0\u7684\u52a1\u5b9e\u76ee\u7684\u3002\u4f46\u672a\u8868\u73b0\u51fa\u5bf9\u201c\u51e0\u5929\u5185\u63d0\u73b0\u201d\u7684\u6781\u7aef\u8981\u6c42\uff0c\u4e5f\u672a\u4e3b\u52a8\u8ffd\u95ee\u6536\u76ca\u627f\u8bfa\uff0c\u52a8\u673a\u4ecb\u4e8e\u5174\u8da3\u5c1d\u8bd5\u4e0e\u517c\u804c\u589e\u6536\u4e4b\u95f4\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5e73\u65f6\u5de5\u4f5c\u5fd9\u53ef\u4ee5\u8fdb\u884c\u5417\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 \u5df2\u652f\u4ed82380\u5143\u8bfe\u7a0b\u8d39\uff0c\u672a\u8868\u73b0\u51fa\u7ecf\u6d4e\u538b\u529b\uff0c\u4f46\u652f\u4ed8\u65b9\u5f0f\u672a\u77e5\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u4e3a\u501f\u8d37\u6216\u5f71\u54cd\u751f\u6d3b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 \u7528\u6237\u660e\u786e\u8868\u793a\u201c\u5e73\u65f6\u5de5\u4f5c\u5fd9\u201d\uff0c\u6697\u793a\u65f6\u95f4\u53ef\u80fd\u4e3a\u788e\u7247\u5316\u62fc\u51d1\u72b6\u6001\uff0c\u662f\u6f5c\u5728\u77ed\u677f\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u4e0d\u8db3] \u2014 \u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u4fe1\u606f\uff0c\u65e0\u6cd5\u8bc4\u4f30\uff0c\u6309\u4e2d\u6027\u5904\u7406\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u5728\u6574\u4e2a\u9ad8\u5f3a\u5ea6\u3001\u5feb\u8282\u594f\u7684\u4f53\u9a8c\u8425\u4e2d\uff0c\u7528\u6237\u5168\u7a0b\u914d\u5408\uff0c\u6309\u65f6\u5b8c\u6210\u6240\u6709\u4efb\u52a1\uff08\u6668\u7ec3\u3001\u5f55\u64ad\u8bfe\u3001\u76f4\u64ad\u3001\u4f5c\u4e1a\u3001Pia\u620f\uff09\uff0c\u5bf9\u9500\u552e\u63d0\u51fa\u7684\u5efa\u8bae\uff08\u5982\u201c\u5bf9\u8c61\u611f\u201d\u6280\u5de7\uff09\u80fd\u5feb\u901f\u7406\u89e3\u5e76\u5e94\u7528\uff08\u201c\u55ef\u55ef\ud83d\ude0a\u660e\u767d\u4e86\u201d\uff09\u3002\u9762\u5bf9\u9500\u552e\u5bc6\u96c6\u7684\u50ac\u4fc3\u548c\u4efb\u52a1\u5b89\u6392\uff0c\u672a\u8868\u73b0\u51fa\u4efb\u4f55\u62b1\u6028\u3001\u7126\u8651\u6216\u754f\u96be\u60c5\u7eea\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u6267\u884c\u529b\u5f3a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u55ef\u55ef\ud83d\ude0a\u660e\u767d\u4e86\u201d \uff1b > \u201c\u597d\u7684\uff0c\u597d\u7684\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u73b0\u6709\u5de5\u4f5c\u6216\u6536\u5165\u7684\u4e0d\u5b89\u5168\u611f**\u3002\u7528\u6237\u7684\u6838\u5fc3\u5173\u5207\u662f\u201c\u5e73\u65f6\u5de5\u4f5c\u5fd9\u53ef\u4ee5\u8fdb\u884c\u5417\u201d\uff0c\u8fd9\u900f\u9732\u51fa\u5176\u5e0c\u671b\u5728\u7e41\u5fd9\u4e3b\u4e1a\u4e4b\u5916\uff0c\u5f00\u8f9f\u4e00\u6761\u7a33\u5b9a\u3001\u53ef\u884c\u7684\u526f\u4e1a\u8def\u5f84\uff0c\u4ee5\u589e\u52a0\u6536\u5165\u3001\u62b5\u5fa1\u98ce\u9669\uff0c\u83b7\u5f97\u7ecf\u6d4e\u4e0a\u7684\u5b89\u5168\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u4e0e\u8def\u5f84\u611f**\u3002\u4e3a\u4ed6\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u6267\u884c\u3001\u80fd\u9002\u914d\u5176\u201c\u5fd9\u201d\u72b6\u6001\u7684\u526f\u4e1a\u6210\u957f\u8def\u5f84\uff0c\u8ba9\u4ed6\u770b\u5230\u201c\u5fd9\u91cc\u5077\u95f2\u4e5f\u80fd\u505a\u6210\u201d\u7684\u5e0c\u671b\u548c\u5177\u4f53\u6b65\u9aa4\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u72ec\u7acb\u51b3\u7b56\u611f\u5f3a\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u7528\u6237\u201c\u5de5\u4f5c\u5fd9\u201d\uff0c\u82e5\u6b63\u8bfe\u5f00\u59cb\u540e\uff0c\u5b66\u4e60\u4efb\u52a1\u91cf\u4e0e\u5de5\u4f5c\u51b2\u7a81\uff0c\u5bfc\u81f4\u65e0\u6cd5\u8ddf\u4e0a\u8fdb\u5ea6\uff0c\u53ef\u80fd\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u6216\u201c\u6ca1\u65f6\u95f4\u201d\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u7528\u6237\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u914d\u5408\u5ea6\u597d\uff0c\u4e0d\u6613\u56e0\u5b66\u4e60\u632b\u6298\u800c\u60c5\u7eea\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u7528\u6237\u6709\u660e\u786e\u7684\u517c\u804c\u53d8\u73b0\u9884\u671f\u3002\u82e5\u5b66\u4e60\u4e00\u6bb5\u65f6\u95f4\u540e\uff08\u59821-2\u4e2a\u6708\uff09\u4ecd\u672a\u83b7\u5f97\u4efb\u4f55\u5b9e\u8d28\u6027\u7684\u63a5\u5355\u673a\u4f1a\u6216\u5fae\u5c0f\u6536\u76ca\uff0c\u53ef\u80fd\u56e0\u201c\u6295\u5165\u4ea7\u51fa\u6bd4\u4e0d\u7b26\u9884\u671f\u201d\u800c\u52a8\u6447\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c3-4\u5468\uff08\u6b7b\u4ea1\u8c37\uff09**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u5b66\u4e60\u96be\u5ea6\u548c\u4efb\u52a1\u91cf\u53ef\u80fd\u589e\u52a0\uff0c\u82e5\u5de5\u4f5c\u7e41\u5fd9\u5bfc\u81f4\u65e0\u6cd5\u5b8c\u6210\u4f5c\u4e1a\uff0c\u6216\u8fdf\u8fdf\u672a\u89c1\u4efb\u4f55\u53d8\u73b0\u82d7\u5934\uff0c\u9000\u8d39\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5e08\u5144/\u5e08\u59d0\uff0c\u770b\u5230\u4f60\u4f53\u9a8c\u8425\u671f\u95f4\u6267\u884c\u529b\u8d85\u5f3a\uff0c\u5b66\u5f97\u4e5f\u5f88\u5feb\uff0c\u7279\u522b\u68d2\uff01\u54b1\u4eec\u6b63\u5f0f\u8bfe\u8282\u594f\u4f1a\u66f4\u6709\u89c4\u5212\uff0c\u77e5\u9053\u4f60\u5de5\u4f5c\u5fd9\uff0c\u6211\u4f1a\u5e2e\u4f60\u628a\u4efb\u52a1\u62c6\u89e3\u6210\u2018\u6bcf\u65e515\u5206\u949f\u2019\u5c31\u80fd\u5b8c\u6210\u7684\u6a21\u5757\uff0c\u786e\u4fdd\u4f60\u518d\u5fd9\u4e5f\u80fd\u7a33\u7a33\u8ddf\u4e0a\uff0c\u4e00\u6b65\u6b65\u62ff\u5230\u7ed3\u679c\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u788e\u7247\u65f6\u95f4\u7ba1\u7406\u5305**\u3011\u3002\u4e3a\u5176\u5b9a\u5236\u201c\u5fae\u4efb\u52a1\u201d\u5b66\u4e60\u8ba1\u5212\uff0c\u5c06\u5927\u4efb\u52a1\u62c6\u89e3\u4e3a\u5de5\u4f5c\u95f4\u9699\u53ef\u5b8c\u6210\u7684\u7ec3\u4e60\u3002\u9488\u5bf9\u5176\u53d8\u73b0\u9700\u6c42\uff0c\u53ef\u9002\u65f6\u8865\u5145\u3010**\u65b0\u624b\u63a5\u5355\u8d44\u6e90\u5305**\u3011\uff0c\u63d0\u4f9b\u660e\u786e\u7684\u3001\u4f4e\u95e8\u69db\u7684\u8bd5\u97f3\u673a\u4f1a\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u8981\u7528\u201c\u753b\u5927\u997c\u201d\u7684\u65b9\u5f0f\u627f\u8bfa\u77ed\u671f\u9ad8\u6536\u76ca**\uff0c\u907f\u514d\u62c9\u9ad8\u5176\u4e0d\u5207\u5b9e\u9645\u7684\u9884\u671f\u3002\n    2. **\u7edd\u4e0d\u8981\u5e03\u7f6e\u65e0\u6cd5\u5728\u788e\u7247\u65f6\u95f4\u5b8c\u6210\u7684\u3001\u8017\u65f6\u8fc7\u957f\u7684\u590d\u6742\u4f5c\u4e1a**\uff0c\u589e\u52a0\u5176\u65f6\u95f4\u538b\u529b\u3002\n    3. **\u7edd\u4e0d\u8981\u5ffd\u89c6\u5176\u201c\u5fd9\u201d\u7684\u8bc9\u6c42**\uff0c\u9700\u4e3b\u52a8\u6c9f\u901a\uff0c\u8c03\u6574\u5b66\u4e60\u8282\u594f\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u9700\u5efa\u7acb\u5728\u660e\u786e\u6210\u679c\u548c\u8def\u5f84\u57fa\u7840\u4e0a**\u3002\u5f53\u4ed6\u5b8c\u6210\u57fa\u7840\u8bfe\u7a0b\u5e76\u53d6\u5f97\u521d\u6b65\u6210\u679c\uff08\u5982\u6210\u529f\u8bd5\u97f3\uff09\u540e\uff0c\u53ef\u63a8\u4ecb\u66f4\u9ad8\u7ea7\u7684\u4e13\u9879\u6280\u80fd\u8bfe\u6216\u8d44\u6e90\u5bf9\u63a5\u670d\u52a1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6709\uff0c\u4e2d\u5348\u5b66\u4e60\u4e86\u4e00\u4e0b\uff0c\u4e0b\u5348\u8bf4\u8bdd\u90fd\u4e0d\u592a\u4e00\u6837\u4e86[\u5077\u7b11]\u201d **\u2014\u2014 \u8bc1\u660e\u5176\u6709\u5b66\u4e60\u5174\u8da3\u548c\u6b63\u5411\u53cd\u9988\uff0c\u975e\u7eaf\u6295\u673a\u8005\u3002**\n2. > \u201c\u5e73\u65f6\u5de5\u4f5c\u5fd9\u53ef\u4ee5\u8fdb\u884c\u5417\u201d **\u2014\u2014 \u66b4\u9732\u6838\u5fc3\u8bc9\u6c42\uff1a\u5728\u6709\u9650\u65f6\u95f4\u5185\u5bfb\u6c42\u53ef\u884c\u7684\u526f\u4e1a\u8def\u5f84\uff0c\u5c5e\u4e8e\u5b89\u5168/\u4fdd\u969c\u9700\u6c42\u3002**\n3. > \u201c\u597d\u7684\u597d\u7684\u8c22\u8c22\u5e08\u59d0\u201d / \u201c\u55ef\u55ef\ud83d\ude0a\u660e\u767d\u4e86\u201d **\u2014\u2014 \u8bc1\u660e\u5176\u914d\u5408\u5ea6\u9ad8\u3001\u6267\u884c\u529b\u5f3a\u3001\u5fc3\u7406\u5f39\u6027\u597d\uff0c\u662f\u5178\u578b\u7684\u5b9e\u5e72\u578b\u5b66\u4e60\u8005\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2\u4f4e\u8c03\u5b9e\u5e72\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\uff08\u7ecf\u6d4e\u4fdd\u969c\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u4e3a\u5176\u91cf\u8eab\u5b9a\u5236\u201c\u788e\u7247\u65f6\u95f4\u5b66\u4e60\u65b9\u6848\u201d\uff0c\u5e76\u5c3d\u65e9\u63d0\u4f9b\u660e\u786e\u7684\u3001\u4f4e\u95e8\u69db\u7684\u53d8\u73b0\u8def\u5f84\u548c\u5fae\u5c0f\u6b63\u53cd\u9988\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u788e\u7247\u65f6\u95f4\u7ba1\u7406\u5305\"}\n```";
