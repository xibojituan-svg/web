    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a**\u53d8\u73b0\u9a71\u52a8\u4e3a\u4e3b**\u3002\u7528\u6237\u591a\u6b21\u8be2\u95ee\u201c\u753b\u672c\u7684\u5de5\u4f5c\u201d\u3001\u201c\u8bd5\u97f3\u201d\u3001\u201c\u63a5\u5355\u201d\uff0c\u5bf9\u517c\u804c\u53d8\u73b0\u8def\u5f84\u8868\u73b0\u51fa\u660e\u786e\u5174\u8da3\u3002\u540c\u65f6\u5b58\u5728\u4e00\u5b9a\u7684\u5174\u8da3\u63a2\u7d22\u6210\u5206\uff08\u8ba8\u8bba\u738b\u660e\u519b\u8001\u5e08\u4f5c\u54c1\uff09\uff0c\u4f46\u6838\u5fc3\u8bc9\u6c42\u6e05\u6670\u6307\u5411\u7ecf\u6d4e\u56de\u62a5\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u7ecf\u6d4e\u8d44\u6e90\u7d27\u5f20**\u3002\u660e\u786e\u8868\u793a\u201c\u4e0d\u591f\u94b1\u201d\uff0c\u8be2\u95ee\u5206\u671f\u4ed8\u6b3e\uff0c\u5e76\u63d0\u53ca\u201c\u53bb\u5411\u4eba\u5f04\u94b1\u201d\uff0c\u663e\u793a\u652f\u4ed8\u80fd\u529b\u6709\u9650\uff0c\u53ef\u80fd\u5904\u4e8e\u7ecf\u6d4e\u538b\u529b\u72b6\u6001\u3002\u6280\u672f\u64cd\u4f5c\u80fd\u529b\u4e00\u822c\uff0c\u591a\u6b21\u8be2\u95ee\u5c0f\u7a0b\u5e8f\u3001\u94fe\u63a5\u3001\u4e0a\u4f20\u65b9\u6cd5\uff0c\u5b58\u5728\u64cd\u4f5c\u969c\u788d\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a**\u4e2d\u7b49\u504f\u4f4e\uff0c\u5b58\u5728\u632b\u8d25\u611f\u4e0e\u4f9d\u8d56\u6027**\u3002\u7528\u6237\u4e3b\u52a8\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\uff0c\u914d\u5408\u5ea6\u5c1a\u53ef\u3002\u4f46\u53cd\u590d\u63d0\u53ca\u81ea\u8eab\u201c\u8bfb\u6587\u7ae0\u5361\u987f\u201d\u7684\u7f3a\u70b9\uff0c\u5e76\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6cd5\uff0c\u663e\u793a\u51fa\u5bf9\u81ea\u8eab\u80fd\u529b\u7684\u4e0d\u81ea\u4fe1\u548c\u7126\u8651\u3002\u5bf9\u9500\u552e/\u73ed\u4e3b\u4efb\u7684\u6307\u5f15\u4f9d\u8d56\u8f83\u5f3a\uff0c\u9047\u5230\u64cd\u4f5c\u95ee\u9898\u4e60\u60ef\u6027\u6c42\u52a9\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a**\u672a\u652f\u4ed8**\u3002\u7528\u6237\u5904\u4e8e\u4f53\u9a8c\u8425\u672b\u671f\uff0c\u9500\u552e\u5df2\u5f15\u5bfc\u81f3\u4ed8\u8d39\u8f6c\u5316\u73af\u8282\uff0c\u7528\u6237\u56e0\u8d44\u91d1\u95ee\u9898\uff08\u201c\u4e0d\u591f\u94b1\u201d\uff09\u5361\u4f4f\uff0c\u5c1d\u8bd5\u534f\u5546\u5206\u671f\u672a\u679c\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u6216\u7b2c\u4e09\u65b9\u51b3\u7b56\u8005\u4fe1\u606f\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u4e3a\u72ec\u7acb\u51b3\u7b56\u3002\n*   **ABCD\u5224\u5b9a**\uff1a**B\u7c7b\uff08\u610f\u5411-\u8d44\u6e90\u9519\u914d\u578b\uff09**\u3002\u7528\u6237\u6709\u660e\u786e\u7684\u517c\u804c\u53d8\u73b0\u610f\u5411\uff08A\u7c7b\u52a8\u673a\uff09\uff0c\u4f46**\u652f\u4ed8\u80fd\u529b\u660e\u663e\u4e0d\u8db3**\uff0c\u4e14\u64cd\u4f5c\u5b66\u4e60\u5b58\u5728\u4e00\u5b9a\u969c\u788d\uff0c\u8d44\u6e90\u5e95\u5ea7\u8584\u5f31\uff0c\u65e0\u6cd5\u652f\u6491\u5176\u53d8\u73b0\u671f\u671b\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**\uff1a**T7 \u7ecf\u6d4e\u62ee\u636e\u7684\u53d8\u73b0\u5bfb\u6c42\u8005**\n    *   **\u6838\u5fc3\u7279\u5f81**\uff1a\u5f3a\u70c8\u7684\u517c\u804c/\u526f\u4e1a\u8d5a\u94b1\u52a8\u673a\uff0c\u4f46\u5bf9\u8bfe\u7a0b\u4ef7\u683c\u654f\u611f\uff0c\u652f\u4ed8\u80fd\u529b\u662f\u6700\u5927\u74f6\u9888\u3002\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u6613\u56e0\u7ecf\u6d4e\u538b\u529b\u4ea7\u751f\u7126\u8651\uff0c\u5bf9\u201c\u5feb\u901f\u63a5\u5355\u201d\u627f\u8bfa\u62b1\u6709\u9ad8\u671f\u5f85\u3002\n    *   **\u672c\u7528\u6237\u543b\u5408\u70b9**\uff1a\u660e\u786e\u8be2\u95ee\u753b\u672c\u5de5\u4f5c\u3001\u8bd5\u97f3\u3001\u63a5\u5355\uff1b\u76f4\u63a5\u8868\u8fbe\u8d44\u91d1\u4e0d\u8db3\u5e76\u5c1d\u8bd5\u5206\u671f\uff1b\u5bf9\u64cd\u4f5c\u6d41\u7a0b\u4e0d\u719f\u6089\uff0c\u5b58\u5728\u5b66\u4e60\u95e8\u69db\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u98ce\u9669\u7b49\u7ea7**\uff1a**\u9ad8**\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u201c\u514b\u670d\u5361\u987f\u201d\u3001\u201c\u5feb\u901f\u63a5\u5355\u201d\u62b1\u6709\u9ad8\u671f\u5f85\uff0c\u4f46\u81ea\u8eab\u57fa\u7840\u8f83\u5f31\uff0c\u82e5\u6b63\u4ef7\u8bfe\u65e0\u6cd5\u5feb\u901f\u89e3\u51b3\u5176\u75db\u70b9\u6216\u5b9e\u73b0\u5176\u53d8\u73b0\u9884\u671f\uff0c\u6781\u6613\u5f15\u53d1\u5931\u671b\u3002\n    2.  **\u8d44\u91d1\u538b\u529b**\uff1a**\u6781\u9ad8\u98ce\u9669**\u3002**\u7528\u6237\u5df2\u660e\u786e\u8868\u793a\u7ecf\u6d4e\u7d27\u5f20**\uff0c\u751a\u81f3\u9700\u8981\u501f\u94b1\u3002\u8fd9\u662f\u6700\u6838\u5fc3\u7684\u9000\u8d39\u89e6\u53d1\u70b9\uff0c\u540e\u7eed\u4efb\u4f55\u7ecf\u6d4e\u6ce2\u52a8\u90fd\u53ef\u80fd\u76f4\u63a5\u5bfc\u81f4\u8981\u6c42\u9000\u8d39\u3002\n    3.  **\u9500\u552e\u627f\u8bfa\u5938\u5927**\uff1a**\u4e2d\u98ce\u9669**\u3002\u9500\u552e\u63d0\u53ca\u201c\u76f4\u63a5\u8fdb\u5267\u7ec4\u201d\u3001\u201c\u4e13\u5c5e\u5956\u52b1\u201d\u3001\u201c\u52a9\u5b66\u91d1\u4f18\u60e0\u5238\u201d\u7b49\uff0c\u53ef\u80fd\u62d4\u9ad8\u7528\u6237\u9884\u671f\u3002\u8bb0\u5f55\u4e2d\u672a\u53d1\u73b0\u6781\u7aef\u5938\u5927\uff0c\u4f46\u5b58\u5728\u8bf1\u5bfc\u6027\u8bdd\u672f\u3002\n    4.  **\u8bfe\u7a0b\u8d28\u91cf/\u670d\u52a1\u4e0d\u7b26**\uff1a**\u4e2d\u98ce\u9669**\u3002\u4f53\u9a8c\u8425\u671f\u95f4\u5373\u51fa\u73b0\u201c\u65e0\u6cd5\u8fdb\u7fa4\u201d\u3001\u201c\u94fe\u63a5\u65e0\u6548\u201d\u7b49\u6280\u672f\u95ee\u9898\uff0c\u82e5\u6b63\u4ef7\u8bfe\u670d\u52a1\u8854\u63a5\u4e0d\u7545\uff0c\u4f1a\u52a0\u5267\u4e0d\u6ee1\u3002\n    5.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\n    6.  **\u7ade\u54c1\u6bd4\u8f83/\u51b2\u52a8\u6d88\u8d39\u540e\u6094**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5904\u4e8e\u7ecf\u6d4e\u62ee\u636e\u72b6\u6001\uff0c\u4ed8\u8d39\u51b3\u7b56\u53ef\u80fd\u4e0d\u7406\u6027\uff0c\u4e8b\u540e\u51b7\u9759\u6216\u5bf9\u6bd4\u5176\u4ed6\u4f4e\u4ef7/\u514d\u8d39\u8d44\u6e90\u540e\u53ef\u80fd\u540e\u6094\u3002\n    7.  **\u5b66\u4e60\u65f6\u95f4/\u7cbe\u529b\u4e0d\u8db3**\uff1a**\u4f4e\u98ce\u9669**\u3002\u7528\u6237\u4f53\u9a8c\u8425\u671f\u95f4\u914d\u5408\u5ea6\u8f83\u9ad8\uff0c\u80fd\u5b8c\u6210\u4f5c\u4e1a\u548c\u53c2\u4e0e\u76f4\u64ad\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u4e3b\u8981\u96f7\u533a**\uff1a\n    *   **\u3010\u652f\u4ed8\u80fd\u529b\u5ffd\u89c6\u3011**\uff1a\u5728\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u4e0d\u591f\u94b1\u201d\u3001\u201c\u5206\u4e24\u671f\u4ed8\u201d\u540e\uff0c\u9500\u552e\u4ecd\u6301\u7eed\u5f15\u5bfc\u652f\u4ed8\uff08\u201c\u8f6c\u591f\u622a\u56fe\u53d1\u7ed9\u6211\u201d\uff09\uff0c**\u672a\u5145\u5206\u8bc4\u4f30\u7528\u6237\u7ecf\u6d4e\u627f\u53d7\u80fd\u529b**\uff0c\u5b58\u5728\u8bf1\u5bfc\u8d85\u8d1f\u8377\u6d88\u8d39\u7684\u98ce\u9669\u3002\n    *   **\u3010\u8fc7\u5ea6\u627f\u8bfa\u98ce\u9669\u3011**\uff1a\u4f7f\u7528\u201c\u76f4\u63a5\u8fdb\u5267\u7ec4\u201d\u3001\u201c\u8dd1\u901a\u517c\u804c\u8def\u5f84\u201d\u7b49\u8bdd\u672f\uff0c\u53ef\u80fd\u8ba9\u7ecf\u6d4e\u62ee\u636e\u7684\u7528\u6237\u5bf9\u6295\u5165\u56de\u62a5\u4ea7\u751f\u4e0d\u5207\u5b9e\u9645\u7684\u5e7b\u60f3\u3002\n    *   **\u3010\u670d\u52a1\u8854\u63a5\u95ee\u9898\u3011**\uff1a\u4f53\u9a8c\u8425\u671f\u95f4\u201c\u65e0\u6cd5\u8fdb\u7fa4\u201d\u95ee\u9898\u53cd\u590d\u51fa\u73b0\uff0c\u5f71\u54cd\u7528\u6237\u4f53\u9a8c\u548c\u4fe1\u4efb\u5efa\u7acb\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d**\uff1a**\u9519\u914d**\u3002\u7528\u6237\u5f3a\u70c8\u7684\u53d8\u73b0\u9700\u6c42\u4e0e\u8584\u5f31\u7684\u7ecf\u6d4e\u57fa\u7840\u3001\u4e2d\u7b49\u504f\u4e0b\u7684\u5b66\u4e60\u81ea\u4fe1\u5f62\u6210\u77db\u76fe\u3002\u5f53\u524d\u9ad8\u4ef7\u6b63\u4ef7\u8bfe\u4e0e\u5176\u652f\u4ed8\u80fd\u529b\u548c\u98ce\u9669\u627f\u53d7\u529b\u4e25\u91cd\u4e0d\u5339\u914d\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**\u542f\u52a8\u652f\u4ed8\u80fd\u529b\u590d\u6838\u4e0e\u98ce\u9669\u544a\u77e5**\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9996\u8981\u52a8\u4f5c\uff0824\u5c0f\u65f6\u5185\uff09**\uff1a\u73ed\u4e3b\u4efb\u63a5\u624b\u540e\uff0c**\u5fc5\u987b\u9996\u5148\u8fdb\u884c\u652f\u4ed8\u80fd\u529b\u4e0e\u5b66\u4e60\u52a8\u673a\u7684\u6df1\u5ea6\u590d\u6838**\u3002\u4e0d\u5e94\u76f4\u63a5\u50ac\u4fc3\u7f34\u8d39\uff0c\u800c\u5e94\u6e29\u548c\u63a2\u8be2\u5176\u7ecf\u6d4e\u72b6\u51b5\u3001\u5b66\u4e60\u65f6\u95f4\u3001\u4ee5\u53ca\u5bf9\u201c\u514b\u670d\u5361\u987f\u201d\u548c\u201c\u517c\u804c\u6536\u5165\u201d\u7684\u5177\u4f53\u9884\u671f\u3002**\u660e\u786e\u544a\u77e5\u5b66\u4e60\u5468\u671f\u3001\u53d8\u73b0\u7684\u4e0d\u786e\u5b9a\u6027\u53ca\u65f6\u95f4\u6210\u672c**\uff0c\u7ba1\u7406\u5176\u9884\u671f\u3002\n    2.  **\u98ce\u9669\u7ba1\u63a7**\uff1a**\u5f3a\u70c8\u5efa\u8bae\u542f\u52a8\u201c\u53cb\u597d\u529d\u9000\u201d\u6216\u5f15\u5bfc\u81f3\u66f4\u4f4e\u5355\u4ef7\u3001\u66f4\u8f7b\u91cf\u5316\u7684\u5165\u95e8\u4ea7\u54c1\uff08\u5982\u6709\uff09**\u3002\u82e5\u7528\u6237\u575a\u6301\u62a5\u540d\uff0c\u5fc5\u987b\u8fdb\u884c**\u5f3a\u98ce\u9669\u63d0\u793a**\uff0c\u660e\u786e\u544a\u77e5\u5206\u671f\u4ed8\u6b3e\uff08\u5982\u4f7f\u7528\uff09\u7684\u8fd8\u6b3e\u8d23\u4efb\uff0c\u5e76\u4e66\u9762\u786e\u8ba4\uff08\u5982\u804a\u5929\u8bb0\u5f55\uff09\u5176\u5df2\u77e5\u6653\u5b66\u4e60\u6548\u679c\u56e0\u4eba\u800c\u5f02\u3001\u517c\u804c\u6536\u5165\u65e0\u6cd5\u4fdd\u8bc1\u3002\n    3.  **\u670d\u52a1\u5f3a\u5316**\uff1a\u786e\u4fdd\u7528\u6237\u987a\u5229\u8fdb\u5165\u73ed\u7ea7\u7fa4\uff0c\u63d0\u4f9b\u6e05\u6670\u7684\u64cd\u4f5c\u6307\u5f15\u3002\u521d\u671f\u91cd\u70b9\u5173\u6ce8\u5176\u201c\u5361\u987f\u201d\u95ee\u9898\u7684\u6539\u5584\uff0c\u7ed9\u4e88\u53ca\u65f6\u3001\u5177\u4f53\u7684\u53cd\u9988\uff0c\u5efa\u7acb\u4fe1\u4efb\uff0c\u7f13\u89e3\u5176\u7126\u8651\u3002\n    4.  **\u957f\u671f\u5173\u6ce8**\uff1a\u5c06\u8be5\u5b66\u5458\u6807\u8bb0\u4e3a\u201c\u9ad8\u8d22\u52a1\u98ce\u9669-\u9ad8\u671f\u5f85\u201d\u7528\u6237\uff0c\u5bc6\u5207\u8ddf\u8e2a\u5176\u5b66\u4e60\u8fdb\u5ea6\u4e0e\u60c5\u7eea\u53d8\u5316\uff0c\u63d0\u524d\u9884\u9632\u56e0\u8fdb\u6b65\u7f13\u6162\u6216\u7ecf\u6d4e\u538b\u529b\u5bfc\u81f4\u7684\u9000\u8d39\u503e\u5411\u3002\n\n{\"core_type\": \"T7 \u7ecf\u6d4e\u62ee\u636e\u7684\u53d8\u73b0\u5bfb\u6c42\u8005\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"product_match\": \"\u9519\u914d\", \"action\": \"\u542f\u52a8\u652f\u4ed8\u80fd\u529b\u590d\u6838\u4e0e\u98ce\u9669\u544a\u77e5\"}";
