    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u5b59\u7ea2 (UID: 677162683) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5f20\u4e3d\u7231 (\u9752\u6728) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u9ad8\u9636\u8bfe\u7a0b (\u5df2\u652f\u4ed8) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3** (\u652f\u4ed8\u65b9\u5f0f\u672a\u77e5\uff0c\u672a\u63d0\u53ca\u8d44\u91d1\u538b\u529b\u6216\u501f\u8d37) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u9ad8\u5bbd\u88d5** (\u5b66\u6821\u540e\u52e4\u804c\u4e1a\uff0c\u81ea\u8ff0\u6bcf\u5929\u53ef\u6295\u51653\u5c0f\u65f6\u4ee5\u4e0a) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3** (\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49** (\u4e92\u52a8\u79ef\u6781\uff0c\u4f46\u5173\u952e\u5bb6\u5ead\u3001\u8d22\u52a1\u4fe1\u606f\u7f3a\u5931) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u5174\u8da3\u9a71\u52a8\u4e0e\u53d8\u73b0\u671f\u5f85\u6df7\u6742**\u3002\u7528\u6237\u5bf9\u58f0\u97f3\u89d2\u8272\uff08\u9752\u53d4\u97f3\uff09\u6709\u660e\u663e\u5174\u8da3\u548c\u8ba4\u540c\uff0c\u4e3b\u52a8\u5b66\u4e60\uff0c\u4f46\u4e5f\u5173\u6ce8\u53d8\u73b0\u76f4\u64ad\u3001\u63a5\u5355\u4fe1\u606f\uff0c\u5bf9\u201c\u6dd8\u6c70\u7b5b\u9009\u201d\u673a\u5236\u654f\u611f\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8fd9\u4e9b\u89d2\u8272\u6211\u90fd\u6bd4\u8f83\u559c\u6b22\uff0c\u6211\u4e5f\u89c9\u5f97\u81ea\u5df1\u7684\u58f0\u97f3\u504f\u5411\u4e8e\u8fd9\u7c7b\u89d2\u8272\uff0c\u4f46\u8fd8\u662f\u8981\u901a\u8fc7\u5b66\u4e60\u53bb\u78e8\u7ec3\u4e00\u4e0b\u3002\u201d > \u201c\u5728\u54ea\u9884\u7ea6\uff1f\u201d (\u9488\u5bf9\u53d8\u73b0\u76f4\u64ad)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b06\u9ad8**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u5df2\u652f\u4ed8\u9ad8\u9636\u8bfe\u7a0b\uff0c\u672a\u8868\u9732\u8d44\u91d1\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u9ad8** \u2014 \u201c\u5b66\u6821\u540e\u52e4\u201d\u804c\u4e1a\uff0c\u89c4\u5f8b\u6027\u5f3a\uff0c\u81ea\u8ff0\u201c\u6bcf\u5929\u80fd\u5728\u6709\u58f0\u4e0a\u9762\u6295\u5165\u591a\u5c11\u65f6\u95f4\uff1a3\u5c0f\u65f6\u4ee5\u4e0a\u201d\uff0c\u4e14\u80fd\u6309\u65f6\u5b8c\u6210\u65e9\u529f\u3001\u76f4\u64ad\u3001\u4f5c\u4e1a\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\uff0c**\u6b64\u4e3a\u5173\u952e\u98ce\u9669\u7f3a\u53e3**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u6536\u4e0d\u5230\u9a8c\u8bc1\u7801\uff09\u80fd\u81ea\u884c\u89e3\u51b3\uff1b\u9762\u5bf9\u9500\u552e\u201c\u6dd8\u6c70\u201d\u65bd\u538b\uff0c\u53cd\u5e94\u662f\u79ef\u6781\u8ddf\u8fdb\uff08\u8be2\u95ee\u9884\u7ea6\uff09\uff1b\u6536\u5230\u4e13\u4e1a\u70b9\u8bc4\u540e\u53cd\u9988\u79ef\u6781\uff08\u201c\u6211\u4f1a\u52aa\u529b\u7684\u201d\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u53ef\u4ee5\u4e86\u201d (\u89e3\u51b3\u9a8c\u8bc1\u7801\u95ee\u9898\u540e) > \u201c\u6211\u4f1a\u52aa\u529b\u7684\u201d (\u6536\u5230\u70b9\u8bc4\u540e)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 (\u8ffd\u6c42\u6210\u5c31\u3001\u8ba4\u53ef\u3001\u4e13\u4e1a\u8eab\u4efd)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u81ea\u8eab\u58f0\u97f3\u7279\u8d28\uff08\u9752\u53d4\u97f3\uff09\u6709\u8ba4\u540c\uff0c\u4f46\u6e34\u671b\u901a\u8fc7\u4e13\u4e1a\u8bad\u7ec3\u83b7\u5f97\u201c\u5b98\u65b9\u201d\u8ba4\u53ef\u548c\u66f4\u5e7f\u6cdb\u7684\u793e\u4f1a\u89d2\u8272\u4ef7\u503c**\u300256\u5c81\uff0c\u5b66\u6821\u540e\u52e4\u804c\u4e1a\uff0c\u53ef\u80fd\u5904\u4e8e\u804c\u4e1a\u672b\u671f\u6216\u5bfb\u6c42\u65b0\u7684\u793e\u4f1a\u89d2\u8272\u4e0e\u6210\u5c31\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u8d4b\u4e88\u5176\u201c\u4e13\u4e1a\u6f14\u64ad\u8005\u201d\u7684\u8eab\u4efd\u8ba4\u540c\u548c\u5708\u5c42\u5f52\u5c5e\u611f**\u3002\u901a\u8fc7\u201c\u4f18\u79c0\u5b66\u5458\u201d\u3001\u201c\u901a\u5173\u201d\u3001\u201c\u7532\u65b9\u8bd5\u97f3\u201d\u7b49\u6807\u7b7e\uff0c\u6ee1\u8db3\u5176\u88ab\u5c0a\u91cd\u548c\u88ab\u770b\u89c1\u7684\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u9ad8\u52a8\u673a\u7eaf\u5ea6\u4e0e\u8d44\u6e90\u5e95\u5ea7\uff0c\u4f46\u53d8\u73b0\u671f\u5f85\u9700\u7ba1\u7406) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u76ee\u6807\u6e05\u6670\u3001\u884c\u52a8\u529b\u5f3a\u3001\u5173\u6ce8\u6280\u80fd\u672c\u8eab\uff0c\u5bf9\u53d8\u73b0\u8def\u5f84\u6709\u52a1\u5b9e\u671f\u5f85) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** (\u4fe1\u606f\u7f3a\u5931\uff0c\u9700\u6392\u67e5) | \u5173\u952e\u98ce\u9669\u70b9\uff01\u9700\u786e\u8ba4\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u652f\u6301\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u65f6\u95f4\u5145\u88d5\uff0c\u804c\u4e1a\u89c4\u5f8b\uff0c\u5b66\u4e60\u6267\u884c\u529b\u5f3a\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u5230\u95ee\u9898\u4e3b\u52a8\u89e3\u51b3\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u5bf9\u53d8\u73b0\u6709\u671f\u5f85\uff0c\u82e5\u521d\u671f\u63a5\u5355\u4e0d\u987a\u6216\u6536\u76ca\u4e0e\u5ba3\u4f20\u4e0d\u7b26\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c3-4\u5468 (\u6b7b\u4ea1\u8c37)**\u3002\u5f53\u57fa\u7840\u6280\u80fd\u5b66\u4e60\u8fdb\u5165\u5e73\u53f0\u671f\uff0c\u800c\u53d8\u73b0\u63a5\u5355\u5c1a\u672a\u6709\u660e\u663e\u6210\u679c\u65f6\uff0c\u6613\u4ea7\u751f\u201c\u5b66\u800c\u65e0\u7528\u201d\u7684\u7126\u8651\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5b59\u7ea2\u5927\u54e5\uff0c\u770b\u5230\u60a8\u5bf9\u9752\u53d4\u97f3\u7684\u7406\u89e3\u548c\u6295\u5165\uff0c\u771f\u7684\u7279\u522b\u6709\u5171\u9e23\u3002\u60a8\u8fd9\u4e2a\u58f0\u97f3\u6761\u4ef6\u52a0\u4e0a\u8fd9\u4efd\u8e0f\u5b9e\u5b66\u4e60\u7684\u52b2\u5934\uff0c\u5728\u6211\u4eec\u793e\u7fa4\u91cc\u5c31\u662f\u2018\u4f4e\u8c03\u9ad8\u624b\u2019\u7684\u5178\u578b\u3002\u54b1\u4eec\u4e0d\u56fe\u5feb\uff0c\u628a\u5e95\u5b50\u6253\u624e\u5b9e\uff0c\u540e\u9762\u65e0\u8bba\u662f\u63a5\u4e66\u8fd8\u662f\u5851\u9020\u89d2\u8272\uff0c\u90fd\u4f1a\u7279\u522b\u7a33\u3002\u6709\u4efb\u4f55\u6280\u672f\u4e0a\u7684\u95ee\u9898\uff0c\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u628a\u5b83\u5543\u4e0b\u6765\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** (\u6838\u5fc3\u5339\u914dT2\u539f\u578b)\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u5c0a\u91cd\u9700\u6c42\uff0c\u53ef\u8865\u5145 **\u3010\u5708\u5c42\u8eab\u4efd\u8d4b\u80fd\u5305\u3011** (\u5982\uff1a\u9080\u8bf7\u8fdb\u5165\u201c\u7cbe\u82f1\u5b66\u5458\u201d\u5c0f\u7fa4\uff0c\u8d4b\u4e88\u201c\u58f0\u97f3\u54c1\u9274\u5b98\u201d\u7b49\u865a\u62df\u5934\u8854\uff0c\u5b9a\u671f\u5c55\u793a\u5176\u4f18\u79c0\u4f5c\u4e1a\u4f5c\u4e3a\u8303\u4f8b)\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u53ea\u753b\u5927\u997c\u4e0d\u8c08\u56f0\u96be**\u3002\u9700\u660e\u786e\u544a\u77e5\u53d8\u73b0\u9700\u8981\u65f6\u95f4\u79ef\u7d2f\u548c\u6301\u7eed\u7ec3\u4e60\u30022. **\u5ffd\u89c6\u5176\u4e13\u4e1a\u6027\u8bc9\u6c42**\u3002\u907f\u514d\u7528\u8fc7\u4e8e\u201c\u5a31\u4e50\u5316\u201d\u6216\u201c\u54c4\u5c0f\u5b69\u201d\u7684\u65b9\u5f0f\u6c9f\u901a\u30023. **\u5728\u5bb6\u5ead\u652f\u6301\u5ea6\u672a\u77e5\u7684\u60c5\u51b5\u4e0b\uff0c\u76f2\u76ee\u9f13\u52b1\u5176\u6295\u5165\u8fc7\u591a\u91d1\u94b1\u6216\u65f6\u95f4**\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u9700\u5efa\u7acb\u5728\u624e\u5b9e\u7684\u5b66\u4e60\u6210\u679c\u548c\u660e\u786e\u7684\u804c\u4e1a\u89c4\u5212\u57fa\u7840\u4e0a**\u3002\u4ed6\u662f\u9ad8\u6f5c\u529b\u590d\u8d2d\u7528\u6237(T2\u5411T1/T7\u8f6c\u5316)\uff0c\u4f46\u53cd\u611f\u7eaf\u9500\u552e\u8bdd\u672f\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u8fd9\u4e9b\u89d2\u8272\u6211\u90fd\u6bd4\u8f83\u559c\u6b22\uff0c\u6211\u4e5f\u89c9\u5f97\u81ea\u5df1\u7684\u58f0\u97f3\u504f\u5411\u4e8e\u8fd9\u7c7b\u89d2\u8272\uff0c\u4f46\u8fd8\u662f\u8981\u901a\u8fc7\u5b66\u4e60\u53bb\u78e8\u7ec3\u4e00\u4e0b\u3002\u201d **(\u5174\u8da3\u9a71\u52a8+\u52a1\u5b9e\u6001\u5ea6)**\n2. > \u201c\u6bcf\u5929\u80fd\u5728\u6709\u58f0\u4e0a\u9762\u6295\u5165\u591a\u5c11\u65f6\u95f4\uff1a3\u5c0f\u65f6\u4ee5\u4e0a\u201d **(\u8d44\u6e90\u5e95\u5ea7\u624e\u5b9e)**\n3. > \u201c\u6211\u4f1a\u52aa\u529b\u7684\u201d **(\u9ad8\u5fc3\u7406\u5f39\u6027\uff0c\u79ef\u6781\u5e94\u5bf9\u53cd\u9988)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u5c0a\u91cd\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7ed9\u4e88\u624e\u5b9e\u7684\u6280\u80fd\u6307\u5bfc\u3001\u660e\u786e\u7684\u8fdb\u9636\u8def\u5f84\uff0c\u5e76\u5c3d\u5feb\u786e\u8ba4\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"maslow_need\": \"\u7b2c\u56db\u5c42\u5c0a\u91cd\u9700\u6c42\", \"risk_level\": \"\u4e2d\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5708\u5c42\u8eab\u4efd\u8d4b\u80fd\u5305\"}\n```";
