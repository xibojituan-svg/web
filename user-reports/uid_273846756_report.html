        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 273846756 (\u6635\u79f0\uff1a\u963f\u72f8\u68a6\u900d\u9065) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-02-04 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u837c\u863c\u5996\u5996(\u4e8e\u53cc) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b + \u540e\u671f\u526a\u8f91\u8bfe (2399\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u5b58\u5728\u501f\u6b3e\u9690\u60a3**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u6211\u6700\u8fd1\u4e5f\u6ca1\u6709\u5de5\u4f5c\uff0c\u6ca1\u6709\u6536\u5165\u6765\u6e90\u201d\uff0c\u201c\u6211\u5728\u8fd9\u5757\u6295\u5165\u7684\u94b1\u6709\u70b9\u591a\u4e86\uff0c\u60f3\u63a7\u5236\u4e00\u4e0b\u6210\u672c\u4e86\uff0c\u5df2\u7ecf\u8d85\u51fa\u539f\u6765\u7684\u9884\u7b97\u4e86\u201d\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u9ad8\u5bbd\u88d5**\u3002\u7528\u6237\u5904\u4e8e\u65e0\u4e1a\u72b6\u6001\uff0c\u80fd\u9891\u7e41\u53c2\u4e0e\u8bfe\u7a0b\u3001\u7fa4\u804a\u4e92\u52a8\u3001\u6df1\u591c\u5f55\u97f3\uff0c\u65f6\u95f4\u81ea\u7531\u5ea6\u6781\u9ad8\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\uff0c\u65e0\u6cd5\u5224\u65ad\u652f\u6301\u6216\u53cd\u5bf9\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u4e92\u52a8\u9891\u7e41\uff0c\u884c\u4e3a\u4e0e\u5fc3\u7406\u72b6\u6001\u5747\u6709\u5145\u5206\u4f53\u73b0\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u5173\u6ce8\u6280\u80fd\u63d0\u5347\u3001\u58f0\u97f3\u9002\u914d\u5ea6\u3001\u540e\u671f\u62d3\u5c55\uff0c\u5bf9\u53d8\u73b0\u6709\u4e00\u5b9a\u671f\u5f85\u4f46\u65e0\u6025\u8feb\u8981\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u7684\u58f0\u97f3\u6bd4\u8f83\u9002\u5408\u90a3\u4e00\u7c7b\u7684\u4e66\u5462\uff1f\u201d > \u201c\u6211\u4e5f\u60f3\u62d3\u5c55\u4e00\u4e0b\u540e\u671f\u7684\u4e1c\u897f\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u7528\u6237\u660e\u786e\u8868\u793a\u201c\u6700\u8fd1\u4e5f\u6ca1\u6709\u5de5\u4f5c\uff0c\u6ca1\u6709\u6536\u5165\u6765\u6e90\u201d\uff0c\u4e14\u62a5\u540d\u540e\u671f\u8bfe\u65f6\u56e0\u201c\u8d85\u51fa\u539f\u6765\u7684\u9884\u7b97\u201d\u800c\u72b9\u8c6b\u3002\u8d44\u91d1\u94fe\u7d27\u5f20\uff0c\u5b58\u5728**\u501f\u8d37\u62a5\u540d\u98ce\u9669**\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u9ad8** \u2014 \u65e0\u4e1a\u72b6\u6001\uff0c\u65f6\u95f4\u5145\u88d5\uff0c\u79ef\u6781\u53c2\u4e0e\u8bfe\u7a0b\u3001\u7fa4\u804a\u3001\u5f55\u97f3\u7ec3\u4e60\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u672a\u63d0\u53ca\uff0c\u65e0\u6cd5\u8bc4\u4f30\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u27a1\u4e2d\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u9700\u95f4\u6b47\u6027\u5b89\u629a\u3002\u8868\u73b0\u51fa\u5b66\u4e60\u70ed\u60c5\u548c\u79ef\u6781\u4e92\u52a8\uff0c\u4f46\u5728\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u5982\u5f55\u97f3\u73af\u5883\u3001\u97f3\u9891\u6ce2\u5f62\u5f02\u5e38\uff09\u65f6\u4f1a\u4e3b\u52a8\u6c42\u52a9\uff0c\u5e76\u5728\u7ec3\u4e60\u53d7\u632b\u65f6\uff08\u201c\u8d8a\u5f55\u8d8a\u6ca1\u4fe1\u5fc3\u4e86\u201d\uff09\u4f1a\u6d41\u9732\u8d1f\u9762\u60c5\u7eea\uff0c\u4f46\u672a\u653e\u5f03\uff0c\u800c\u662f\u9009\u62e9\u6682\u505c\u8c03\u6574\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8d8a\u5f55\u8d8a\u6ca1\u4fe1\u5fc3\u4e86[\u6342\u8138][\u6342\u8138]\u201d > \u201c\u6211\u65c1\u8fb9\u6c34\u5e73\u5df2\u7ecf\u9000\u6b65\u4e86\uff0c\u6015\u7ed9\u5927\u5bb6\u62d6\u540e\u817f\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u56e0\u5931\u4e1a\u5bfc\u81f4\u7684\u81ea\u6211\u4ef7\u503c\u611f\u7f3a\u5931\u4e0e\u793e\u4ea4\u5b64\u7acb**\u3002\u4ed6\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u65b0\u6280\u80fd\u3001\u878d\u5165\u793e\u7fa4\uff08\u79ef\u6781\u4e92\u52a8\u3001\u53c2\u4e0e\u5c0f\u7ec4\uff09\u3001\u83b7\u5f97\u4ed6\u4eba\u8ba4\u53ef\uff08\u8be2\u95ee\u58f0\u97f3\u9002\u914d\u5ea6\u3001\u62c5\u5fc3\u62d6\u540e\u817f\uff09\u6765\u91cd\u5efa\u81ea\u4fe1\u548c\u83b7\u53d6\u793e\u4f1a\u5c0a\u91cd\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u793e\u7fa4\u5f52\u5c5e\u611f\u4e0e\u9636\u6bb5\u6027\u6210\u5c31\u8ba4\u53ef**\u3002\u8ba9\u4ed6\u611f\u5230\u88ab\u9700\u8981\uff08\u5982\u88ab\u9080\u8bf7\u52a0\u5165\u5c0f\u7ec4\uff09\u3001\u88ab\u770b\u89c1\uff08\u5bf9\u5176\u58f0\u97f3\u7684\u79ef\u6781\u53cd\u9988\uff09\u3001\u5728\u96c6\u4f53\u4e2d\u62e5\u6709\u4f4d\u7f6e\uff0c\u4ece\u800c\u62b5\u6d88\u5931\u4e1a\u5e26\u6765\u7684\u65e0\u4ef7\u503c\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udd34 D\u7c7b** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u9ad8\u52a8\u673a\u3001\u4f4e\u8d44\u6e90\u3001\u4e2d\u5f39\u6027\uff0c\u6838\u5fc3\u9700\u6c42\u4e3a\u60c5\u611f\u652f\u6301\u4e0e\u5f52\u5c5e\u611f) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\ud83d\udd34**\u5df2\u89e6\u53d1 D \u7c7b\u7194\u65ad\u7ea2\u7ebf\uff01**\n- **\u89e6\u53d1\u56e0\u7531**\uff1a**\u7528\u6237\u5904\u4e8e\u65e0\u6536\u5165\u72b6\u6001\uff0c\u4e14\u5df2\u660e\u786e\u8868\u793a\u5b66\u4e60\u6295\u5165\u201c\u8d85\u51fa\u539f\u6765\u7684\u9884\u7b97\u201d**\u3002\u8fd9\u662f\u5178\u578b\u7684\u201c\u5f71\u54cd\u57fa\u672c\u751f\u6d3b\u5f00\u652f\u201d\u7684\u8d22\u52a1\u98ce\u9669\u4fe1\u53f7\uff0c\u6781\u6613\u56e0\u540e\u7eed\u4efb\u4f55\u7ecf\u6d4e\u538b\u529b\u6216\u5b66\u4e60\u632b\u6298\u800c\u5f15\u53d1\u9000\u8d39\u6295\u8bc9\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4e2d | \u82e5\u5bb6\u4eba\u53d1\u73b0\u5176\u65e0\u6536\u5165\u72b6\u6001\u4e0b\u6301\u7eed\u6295\u5165\u5b66\u4e60\u8d39\u7528\uff0c\u53ef\u80fd\u5f15\u53d1\u5f3a\u70c8\u53cd\u5bf9\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u65f6\u95f4\u5145\u88d5\uff0c\u5b66\u4e60\u8ddf\u8fdb\u5ea6\u9ad8\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u9ad8** | \u5728\u6280\u80fd\u7ec3\u4e60\u4e2d\u53cd\u590d\u53d7\u632b\uff08\u5982\u201c\u8d8a\u5f55\u8d8a\u6ca1\u4fe1\u5fc3\u201d\uff09\uff0c\u82e5\u5f97\u4e0d\u5230\u53ca\u65f6\u3001\u6e29\u6696\u7684\u9f13\u52b1\u548c\u7b80\u5316\u6307\u5bfc\uff0c\u6781\u6613\u56e0\u81ea\u6211\u5426\u5b9a\u800c\u653e\u5f03\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u867d\u7136\u5f53\u524d\u672a\u5f3a\u6c42\u53d8\u73b0\uff0c\u4f46\u82e5\u957f\u671f\uff08\u5982\u8bfe\u7a0b\u7ed3\u675f\u540e3-6\u4e2a\u6708\uff09\u65e0\u4efb\u4f55\u6b63\u5411\u53cd\u9988\u6216\u5fae\u5c0f\u6536\u76ca\uff0c\u53e0\u52a0\u7ecf\u6d4e\u538b\u529b\uff0c\u5931\u671b\u60c5\u7eea\u4f1a\u7d2f\u79ef\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c4-6\u5468\uff08\u6280\u80fd\u8fdb\u9636\u671f\uff09\u53ca\u6bd5\u4e1a\u540e\u76841-2\u4e2a\u6708\uff08\u53d8\u73b0\u7a7a\u7a97\u671f\uff09**\u3002\u524d\u8005\u662f\u6280\u672f\u96be\u70b9\u96c6\u4e2d\u3001\u81ea\u6211\u6000\u7591\u9ad8\u53d1\u671f\uff1b\u540e\u8005\u662f\u671f\u5f85\u4e0e\u73b0\u5b9e\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u7684\u65f6\u671f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u963f\u72f8\uff0c\u770b\u5230\u4f60\u5728\u7fa4\u91cc\u7279\u522b\u6d3b\u8dc3\uff0c\u4e5f\u4e50\u4e8e\u5e2e\u52a9\u5176\u4ed6\u540c\u5b66\uff0c\u771f\u7684\u5f88\u6709\u2018\u5927\u5e08\u5144\u2019\u7684\u98ce\u8303\uff01\u54b1\u4eec\u8fd9\u4e2a\u73ed\u56e0\u4e3a\u6709\u4f60\u8fd9\u6837\u70ed\u5fc3\u7684\u540c\u5b66\uff0c\u6c1b\u56f4\u7279\u522b\u597d\u3002\u5b66\u4e60\u8def\u4e0a\u522b\u6015\u9047\u5230\u574e\u513f\uff0c\u4f60\u80cc\u540e\u6709\u6211\u4eec\u6574\u4e2a\u73ed\uff0c\u8fd8\u6709\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u6162\u6162\u78e8\u3002\u4f60\u4ed8\u51fa\u7684\u6bcf\u4e00\u5206\u52aa\u529b\uff0c\u6211\u4eec\u90fd\u770b\u5f97\u89c1\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5174\u8da3\u6e38\u4e50\u7ebf\u3011**\u3002\u5f31\u5316\u201c\u5feb\u901f\u53d8\u73b0\u201d\u538b\u529b\uff0c\u5f3a\u5316\u201c\u6280\u80fd\u63a2\u7d22\u3001\u793e\u7fa4\u5171\u5efa\u3001\u58f0\u97f3\u73a9\u51fa\u82b1\u6837\u201d\u7684\u8da3\u5473\u6027\u548c\u5f52\u5c5e\u611f\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u914d\u7f6e\u4e13\u5c5e\u7684\u201c\u9f13\u52b1\u578b\u201d\u5b66\u957f/\u5b66\u59d0\u6216\u73ed\u4e3b\u4efb\uff0c\u5728\u5176\u6d41\u9732\u632b\u8d25\u611f\u65f6\u7b2c\u4e00\u65f6\u95f4\u7ed9\u4e88\u60c5\u611f\u652f\u6301\u548c\u7b80\u5316\u4efb\u52a1\u6307\u5f15\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u5176\u65bd\u52a0\u201c\u63a5\u5355KPI\u201d\u6216\u201c\u53d8\u73b0\u901f\u5ea6\u201d\u538b\u529b**\u3002\n    2. **\u7edd\u4e0d\u5728\u5176\u8868\u8fbe\u201c\u6ca1\u4fe1\u5fc3\u201d\u65f6\uff0c\u53ea\u7ed9\u786c\u6838\u6280\u672f\u6307\u5bfc\u800c\u4e0d\u7ed9\u60c5\u611f\u80af\u5b9a**\u3002\n    3. **\u8c28\u614e\u63a8\u8350\u4efb\u4f55\u9700\u8981\u989d\u5916\u5927\u989d\u4ed8\u8d39\u7684\u5347\u5355\u8bfe\u7a0b**\uff0c\u9664\u975e\u80fd\u660e\u786e\u5176\u7ecf\u6d4e\u72b6\u51b5\u5df2\u597d\u8f6c\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u786e\u8ba4\u5176\u6709\u7a33\u5b9a\u6536\u5165\u6765\u6e90\u524d\uff0c\u7981\u6b62\u63a8\u8350\u4efb\u4f55\u9ad8\u5355\u4ef7\u8bfe\u7a0b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u6700\u8fd1\u4e5f\u6ca1\u6709\u5de5\u4f5c\uff0c\u6ca1\u6709\u6536\u5165\u6765\u6e90\uff0c\u8fd9\u5757\uff0c\u6211\u5148\u7b49\u7b49\u5427\uff01\u201d **(D\u7c7b\u7ea2\u7ebf\uff1a\u65e0\u6536\u5165\u72b6\u6001\u4e0b\u8d85\u9884\u7b97\u5b66\u4e60)**\n2. > \u201c\u8d8a\u5f55\u8d8a\u6ca1\u4fe1\u5fc3\u4e86[\u6342\u8138][\u6342\u8138]\u201d **(T6\u60c5\u7eea\u5de8\u5a74\u5178\u578b\u7279\u5f81\uff1a\u6613\u53d7\u632b\uff0c\u9700\u60c5\u611f\u652f\u6301)**\n3. > \u201c\u6211\u65c1\u8fb9\u6c34\u5e73\u5df2\u7ecf\u9000\u6b65\u4e86\uff0c\u6015\u7ed9\u5927\u5bb6\u62d6\u540e\u817f\u201d **(\u7b2c\u56db\u5c42\u5c0a\u91cd\u9700\u6c42\uff1a\u6e34\u671b\u88ab\u8ba4\u53ef\uff0c\u5bb3\u6015\u88ab\u7fa4\u4f53\u6392\u65a5)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6 \u60c5\u7eea\u5de8\u5a74\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u5728\u5931\u4e1a\u540e\u901a\u8fc7\u6280\u80fd\u5b66\u4e60\u548c\u793e\u7fa4\u878d\u5165\u91cd\u83b7\u5c0a\u91cd\u4e0e\u5f52\u5c5e\u611f**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u9ad8\u9891\u60c5\u611f\u4ef7\u503c\u4e0e\u793e\u7fa4\u5f52\u5c5e\u611f\uff0c\u575a\u51b3\u907f\u514d\u65bd\u52a0\u53d8\u73b0\u538b\u529b\u548c\u8fdb\u884c\u5927\u989d\u5347\u5355**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5c0a\u91cd\u5f52\u5c5e\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf+\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\"}\n```";
