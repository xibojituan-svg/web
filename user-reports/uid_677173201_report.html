        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID 677173201 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u516d\u6708\u6668\u516e\uff08\u914d\u97f3\uff09\u3010\u672a\u6210\u5e74\u52ff\u52a0\u3011(\u6768\u8389\u6587) / \u7c73\u7c92\u9017\u90171(\u6768\u8389\u6587) / \u79cb\u7c73\u679c(\u767d\u82b3) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u9ad8\u9636\u73ed\uff08\u6500\u767b\u8ba1\u5212\uff09\uff0c\u4ef7\u683c2380\u5143 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u652f\u4ed8\uff08\u201c\u6211\u4ed8\u6b3e\u4e86\u201d\uff09\uff0c\u65e0\u5206\u671f/\u501f\u8d37\u4fe1\u53f7 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u672a\u77e5\u3002\u7528\u6237\u8be2\u95ee\u201c\u6bcf\u5929\u5fc5\u987b\u81f3\u5c11\u4e00\u4e2a\u5c0f\u65f6\u5f55\u4e66\u65f6\u95f4\u5417\uff1f\u201d\uff0c\u9500\u552e\u56de\u590d\u201c\u4e0d\u662f\uff0c\u4f60\u6709\u65f6\u95f4\u5c31\u5f55\uff0c\u6ca1\u65f6\u95f4\u5c31\u5fd9\u4f60\u7684\u201d\uff0c\u8868\u660e\u65f6\u95f4\u53ef\u80fd\u788e\u7247\u5316\uff0c\u4f46\u5177\u4f53\u65f6\u957f\u672a\u77e5\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u672a\u77e5\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u7528\u6237\u53d1\u8a00\u6781\u5c11\uff08\u4ec58\u6761\uff09\uff0c\u7edd\u5927\u90e8\u5206\u4e3a\u9500\u552e\u5355\u5411\u8f93\u51fa\uff0c\u65e0\u6cd5\u5224\u65ad\u5176\u771f\u5b9e\u80cc\u666f\u3001\u52a8\u673a\u3001\u8d44\u6e90\u4e0e\u5fc3\u7406\u72b6\u6001\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u7528\u6237\u660e\u786e\u8868\u8fbe\u4e86\u517c\u804c\u53d8\u73b0\u7684\u52a1\u5b9e\u8bc9\u6c42\uff08\u201c\u5e0c\u671b\u6211\u53ef\u4ee5\u6709\u81ea\u5df1\u7684\u5c0f\u91d1\u5e93\u201d\uff09\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u6781\u901f\u53d8\u73b0\u7684\u72c2\u70ed\u6216\u5bf9\u6280\u80fd\u672c\u8eab\u7684\u6df1\u5ea6\u8ffd\u95ee\u3002\u5c5e\u4e8e\u5178\u578b\u7684\u517c\u804c\u53d8\u73b0\u76ee\u7684\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5e0c\u671b\u6211\u53ef\u4ee5\u6709\u81ea\u5df1\u7684\u5c0f\u91d1\u5e93\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d] (\u4fe1\u606f\u4e0d\u8db3\uff0c\u77ed\u677f\u672a\u77e5)\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 \u80fd\u5168\u6b3e\u652f\u4ed82380\u5143\u8bfe\u7a0b\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\u6216\u501f\u8d37\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u672a\u77e5] \u2014 \u4ec5\u8be2\u95ee\u6bcf\u65e5\u6700\u4f4e\u65f6\u95f4\u8981\u6c42\uff0c\u672a\u900f\u9732\u5177\u4f53\u804c\u4e1a\u6216\u65f6\u95f4\u5b89\u6392\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u672a\u77e5] \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d] (\u4fe1\u606f\u4e0d\u8db3\uff0c\u503e\u5411\u6027\u5224\u65ad)\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u7528\u6237\u5bf9\u9500\u552e\u7684\u4e13\u4e1a\u6307\u5bfc\uff08\u5982\u201c\u6211\u8bfb\u7684\u592a\u751f\u786c\u4e86\u201d\uff09\u80fd\u8fdb\u884c\u81ea\u6211\u53cd\u601d\u5e76\u63a5\u53d7\u5efa\u8bae\uff08\u201c\u55ef\u55ef\uff0c\u975e\u5e38\u597d\u201d\uff09\uff0c\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u5b66\u4e60\u610f\u613f\u548c\u63a5\u53d7\u5ea6\u3002\u672a\u51fa\u73b0\u5d29\u6e83\u3001\u653e\u5f03\u6216\u8fc7\u5ea6\u4f9d\u8d56\u5b89\u629a\u7684\u4fe1\u53f7\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u8bfb\u7684\u592a\u751f\u786c\u4e86\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u5efa\u7acb\u201c\u5c0f\u91d1\u5e93\u201d\u7684\u6e34\u671b\uff0c\u900f\u9732\u51fa\u5bf9\u7ecf\u6d4e\u5b89\u5168\u611f\u7684\u6f5c\u5728\u7126\u8651\u3002\u5e0c\u671b\u901a\u8fc7\u517c\u804c\u6280\u80fd\u589e\u52a0\u6536\u5165\uff0c\u5bfb\u6c42\u4e00\u4efd\u7a33\u5b9a\u7684\u526f\u4e1a\u4fdd\u969c\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u4e0e\u5b89\u5168\u611f**\u3002\u9700\u8981\u660e\u786e\u7684\u5b66\u4e60\u8def\u5f84\u3001\u53ef\u9884\u671f\u7684\u53d8\u73b0\u5468\u671f\uff08\u5982\u201c\u7b2c\u516b\u5929\u5f00\u901a\u63a5\u5355\u5c0f\u7a0b\u5e8f\u201d\uff09\u4ee5\u53ca\u7a33\u5b9a\u7684\u8d44\u6e90\u6276\u6301\uff08\u5982\u7248\u6743\u4e66\uff09\uff0c\u6765\u5bf9\u51b2\u5176\u5bf9\u672a\u6765\u7684\u4e0d\u786e\u5b9a\u6027\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1\u7c7b** (\u5174\u8da3\u6d88\u8d39\u578b\uff0c\u4f46\u4fe1\u606f\u4e0d\u8db3\uff0c\u9700\u89c2\u5bdf) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T5 \u597d\u73a9\u5c1d\u9c9c\u8005** (\u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u5b9a) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u6700\u53ef\u80fd\u7684\u98ce\u9669\u70b9**\u3002\u7528\u6237\u65f6\u95f4\u5b89\u6392\u672a\u77e5\uff0c\u82e5\u5b9e\u9645\u65f6\u95f4\u4e0e\u627f\u8bfa\u7684\u201c\u6709\u65f6\u95f4\u5c31\u5f55\u201d\u4e0d\u7b26\uff0c\u6216\u56e0\u5de5\u4f5c/\u751f\u6d3b\u7e41\u5fd9\u5bfc\u81f4\u65e0\u6cd5\u8ddf\u4e0a\u8bfe\u7a0b\u8fdb\u5ea6\uff0c\u6613\u4ea7\u751f\u79ef\u538b\u548c\u81ea\u8d23\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u76ee\u524d\u8868\u73b0\u51fa\u63a5\u53d7\u5efa\u8bae\u7684\u5e73\u548c\u5fc3\u6001\uff0c\u4f46\u4fe1\u606f\u4e0d\u8db3\uff0c\u9700\u89c2\u5bdf\u540e\u7eed\u9047\u5230\u6280\u672f\u96be\u9898\u65f6\u7684\u53cd\u5e94\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u7528\u6237\u5bf9\u53d8\u73b0\u6709\u660e\u786e\u671f\u5f85\uff08\u201c\u5c0f\u91d1\u5e93\u201d\uff09\u3002\u82e5\u5f00\u8bfe\u7b2c\u516b\u5929\u540e\u63a5\u5355\u4e0d\u987a\u5229\uff0c\u6216\u65f6\u85aa\u8fdc\u4f4e\u4e8e\u9884\u671f\uff08\u9500\u552e\u63d0\u53caAI\u6d4b\u8bd5\u201c\u4ec5\u505a\u53c2\u8003\u201d\uff09\uff0c\u53ef\u80fd\u56e0\u6536\u76ca\u843d\u5dee\u800c\u4ea7\u751f\u9000\u8d39\u5ff5\u5934\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u8bfe\u7a0b\u96be\u5ea6\u548c\u4f5c\u4e1a\u91cf\u53ef\u80fd\u589e\u52a0\uff0c\u82e5\u540c\u65f6\u63a5\u5355\u53d7\u632b\u6216\u65f6\u95f4\u65e0\u6cd5\u4fdd\u8bc1\uff0c\u9000\u8d39\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u770b\u5230\u4f60\u62a5\u540d\u65f6\u63d0\u5230\u60f3\u5efa\u7acb\u81ea\u5df1\u7684\u2018\u5c0f\u91d1\u5e93\u2019\uff0c\u8fd9\u4efd\u4e3a\u81ea\u5df1\u4e89\u53d6\u66f4\u591a\u5b89\u5168\u611f\u7684\u60f3\u6cd5\u7279\u522b\u68d2\uff01\u54b1\u4eec\u7684\u8bfe\u7a0b\u8bbe\u8ba1\u5c31\u662f\u5e2e\u4f60\u4e00\u6b65\u6b65\u7a33\u624e\u7a33\u6253\uff0c\u628a\u5174\u8da3\u53d8\u6210\u5b9e\u5b9e\u5728\u5728\u7684\u6536\u76ca\u3002\u524d\u671f\u54b1\u4eec\u4e0d\u8d2a\u591a\uff0c\u5148\u641e\u5b9a\u4e00\u4e2a\u80fd\u7a33\u5b9a\u4ea7\u51fa\u7684\u5c0f\u6280\u80fd\uff0c\u6bd4\u5982\u65c1\u767d\u6216\u8005\u5bf9\u8f68\uff0c\u8ba9\u4f60\u5148\u6709\u2018\u8d5a\u5230\u2019\u7684\u8e0f\u5b9e\u611f\u3002\u6709\u4efb\u4f55\u65f6\u95f4\u5b89\u6392\u4e0a\u7684\u56f0\u96be\uff0c\u968f\u65f6\u8ddf\u6211\u8bf4\uff0c\u6211\u4eec\u4e00\u8d77\u8c03\u6574\u8ba1\u5212\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011\u3002\u7d27\u6263\u5176\u201c\u5c0f\u91d1\u5e93\u201d\u8bc9\u6c42\uff0c\u524d\u671f\u91cd\u70b9\u5f15\u5bfc\u81f3\u95e8\u69db\u8f83\u4f4e\u3001\u53d8\u73b0\u8def\u5f84\u6e05\u6670\u7684\u5c97\u4f4d\uff08\u5982\u5bf9\u8f68\u3001\u5ba1\u542c\u3001\u7b80\u5355\u65c1\u767d\uff09\uff0c\u5feb\u901f\u5efa\u7acb\u6b63\u53cd\u9988\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u53ef\u80fd\u788e\u7247\u5316\u7684\u7279\u70b9\uff0c\u8865\u5145\u3010\u7075\u6d3b\u5b66\u4e60\u5305\u3011\uff0c\u63d0\u4f9b\u53ef\u56de\u770b\u7684\u5f55\u64ad\u7cbe\u534e\u8bfe\u548c\u788e\u7247\u5316\u7ec3\u4e60\u4efb\u52a1\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u8fc7\u5ea6\u627f\u8bfa\u201c\u8f7b\u677e\u6708\u5165\u8fc7\u4e07\u201d\u6216\u77ed\u671f\u5185\u66b4\u5bcc\u3002\u5fc5\u987b\u660e\u786e\u544a\u77e5\u6280\u80fd\u79ef\u7d2f\u548c\u63a5\u5355\u7ade\u4e89\u7684\u73b0\u5b9e\u60c5\u51b5\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u5728\u7528\u6237\u672a\u7a33\u5b9a\u63a5\u5355\u5e76\u83b7\u5f97\u6b63\u5411\u6536\u76ca\u53cd\u9988\u524d\uff0c**\u4e25\u7981**\u63a8\u4ecb\u66f4\u9ad8\u9636\u3001\u66f4\u9ad8\u4ef7\u7684\u8bfe\u7a0b\uff08\u5982\u540e\u671f\u5236\u4f5c\u3001\u8bbe\u5907\u5347\u7ea7\u8bfe\uff09\u3002\u5347\u5355\u9700\u5efa\u7acb\u5728\u201c\u5df2\u8d5a\u56de\u5b66\u8d39\u201d\u6216\u201c\u6280\u80fd\u660e\u663e\u9047\u5230\u74f6\u9888\u201d\u7684\u57fa\u7840\u4e0a\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5e0c\u671b\u6211\u53ef\u4ee5\u6709\u81ea\u5df1\u7684\u5c0f\u91d1\u5e93\u201d **(\u6838\u5fc3\u52a8\u673a\uff1a\u5b89\u5168\u9700\u6c42)**\n2. > \u201c\u6211\u8bfb\u7684\u592a\u751f\u786c\u4e86\u201d **(\u5b66\u4e60\u6001\u5ea6\uff1a\u613f\u610f\u53cd\u601d\uff0c\u63a5\u53d7\u6307\u5bfc)**\n3. > \u201c\u6bcf\u5929\u5fc5\u987b\u81f3\u5c11\u4e00\u4e2a\u5c0f\u65f6\u5f55\u4e66\u65f6\u95f4\u5417\uff1f\u201d **(\u8d44\u6e90\u7591\u8651\uff1a\u5bf9\u65f6\u95f4\u6295\u5165\u6709\u987e\u8651)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T5 \u597d\u73a9\u5c1d\u9c9c\u8005\uff08\u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u5b9a\uff09\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7ecf\u6d4e\u5b89\u5168\u611f\uff08\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7ba1\u7406\u6536\u76ca\u9884\u671f + \u63d0\u4f9b\u7075\u6d3b\u7684\u5b66\u4e60\u65f6\u95f4\u65b9\u6848\u3011**\u3002\n\n```json\n{\"core_type\": \"T5 \u597d\u73a9\u5c1d\u9c9c\u8005 (\u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u5b9a)\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf + \u7075\u6d3b\u5b66\u4e60\u5305\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
