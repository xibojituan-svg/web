    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID: 676632356\uff08\u6635\u79f0\uff1a\u7a33\u4e00\u624b\uff09\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676632356 (\u7a33\u4e00\u624b) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-01 \u81f3 2026-03-13 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u665e\u665e(\u6c6a\u5b5f\u71c3) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u77ed\u89c6\u9891\u8bfe\u7a0b\uff08\u63a8\u6d4b\u4e3aAI\u89c6\u9891\u5236\u4f5c\u76f8\u5173\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3** |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3** |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3** |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** (\u6280\u672f\u8ba8\u8bba\u6df1\u5165\uff0c\u5b66\u4e60\u884c\u4e3a\u660e\u786e) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u2b06\u9ad8]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u6280\u672f\u7cbe\u8fdb\u800c\u6765\uff0c\u8ffd\u6c42\u4e13\u4e1a\u6df1\u5ea6\u4e0e\u6548\u7387\u63d0\u5347\uff0c\u4eab\u53d7\u6280\u672f\u94bb\u7814\u4e0e\u884c\u4e1a\u6d1e\u5bdf\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u5c31\u559c\u6b22\u9ad8\u624b\uff0c\u4e0d\u7136\u5b66\u4e0d\u5230\u4e1c\u897f\u201d\n  > \u201c\u6211\u8fde\u4f5c\u4e1a\u90fd\u5f53\u5546\u5355\u505a\u7684\u201d\n  > \u201c\u6ca1\u4efb\u52a1\u61d2\u5f97\u7ec3\u624b\uff0c\u4e0d\u7ec3\u624b\u8109\u786e\u5b9e\u4f1a\u751f\u758f\uff0c\u662f\u6bd4\u8d5b\uff0c\u505a\u4f5c\u54c1\u662f\u8fdb\u6b65\u6700\u5feb\u7684\uff0c\u4f1a\u6bd4\u8f83\u8ba4\u771f\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b06\u9ad8]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u9ad8] \u2014 \u8ba8\u8bba\u4ed8\u8d39\u8f6f\u4ef6\uff08Lovart\u3001Pro\u7248\uff09\u3001\u663e\u5361\u914d\u7f6e\uff088-12G\uff09\uff0c\u5bf9\u884c\u4e1a\u4ed8\u8d39\u5de5\u5177\u6210\u672c\u6709\u6e05\u6670\u8ba4\u77e5\uff0c\u65e0\u8d44\u91d1\u538b\u529b\u4fe1\u53f7\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u9ad8] \u2014 \u80fd\u6df1\u5ea6\u53c2\u4e0e\u7fa4\u5185\u6280\u672f\u8ba8\u8bba\u3001\u6309\u65f6\u8ddf\u8fdb\u8bfe\u7a0b\u3001\u4e3b\u52a8\u63d0\u4ea4\u4f5c\u54c1\u5e76\u5bfb\u6c42\u4e13\u5bb6\u70b9\u8bc4\uff0c\u5b66\u4e60\u6295\u5165\u5ea6\u9ad8\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4e2d] \u2014 **\u4fe1\u606f\u4e0d\u8db3**\uff0c\u672a\u63d0\u53ca\u5bb6\u5ead\u56e0\u7d20\uff0c\u4f46\u9ad8\u65f6\u95f4\u4e0e\u8d44\u91d1\u6295\u5165\u4fa7\u9762\u53cd\u6620\u652f\u6301\u5ea6\u4e0d\u4f4e\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\uff0c\u5177\u5907\u6781\u5f3a\u7684\u884c\u4e1a\u6d1e\u5bdf\u4e0e\u81ea\u6211\u8c03\u6574\u80fd\u529b\uff0c\u4ee5\u6280\u672f\u89c6\u89d2\u770b\u5f85\u6311\u6218\uff0c\u65e0\u60c5\u7eea\u5316\u62b1\u6028\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u5f88\u591a\u516c\u53f8\u5de5\u4f5c\u6d41\u7684\u5410\u8840\uff0c\u672c\u6765\u53ef\u4ee5\u6df7\u4e2a\u51e0\u5e74\u7684\uff0c\u7ed3\u679c\u4e00\u4e0b\u5b50\u54c8\u54c8\u201d\uff08\u4ee5\u8c03\u4f83\u5fc3\u6001\u770b\u5f85\u6280\u672f\u8fed\u4ee3\u5e26\u6765\u7684\u884c\u4e1a\u51b2\u51fb\uff09\n  > \u201c\u8bf4\u767d\u4e862.0\u5982\u679c\u65f6\u95f4\u77ed\uff0c\u771f\u7684\u5b66\u4e0d\u5b66\u51fa\u8def\u4e0d\u592a\u5927\u54c8\u54c8\u201d\uff08\u7406\u6027\u5206\u6790\u5b66\u4e60\u4ef7\u503c\uff0c\u800c\u975e\u62b1\u6028\u6216\u7126\u8651\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u6280\u672f\u5feb\u901f\u8fed\u4ee3\u7684**\u77e5\u8bc6\u7126\u8651**\u4e0e**\u6280\u672f\u62a4\u57ce\u6cb3\u88ab\u524a\u5e73\u7684\u5371\u673a\u611f**\u3002\u4ed6\u62c5\u5fc3AI\u5de5\u5177\uff08\u5982SD2.0\uff09\u7684\u666e\u53ca\u4f1a\u62b9\u5e73\u4e13\u4e1a\u95e8\u69db\uff0c\u4f7f\u81ea\u5df1\u7684\u6280\u80fd\u4ef7\u503c\u8d2c\u503c\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u8ba4\u540c\u4e0e\u6df1\u5ea6\u8fde\u63a5**\u3002\u4ed6\u9700\u8981\u88ab\u8ba4\u53ef\u4e3a\u201c\u61c2\u884c\u7684\u4eba\u201d\uff0c\u6e34\u671b\u4e0e\u201c\u9876\u7ea7\u6280\u672f\u6d41\u201d\u5bf9\u8bdd\uff0c\u83b7\u5f97\u8d85\u8d8a\u666e\u901a\u5b66\u5458\u7684\u6df1\u5ea6\u6280\u672f\u6307\u5bfc\u548c\u884c\u4e1a\u524d\u6cbf\u4fe1\u606f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe2 A\u7c7b** (\u9ad8\u4ef7\u503c\u9886\u8896/\u6280\u672f\u6838\u5fc3\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T3 \u6b7b\u78d5\u6781\u5ba2\u6d3e** (\u6280\u672f\u6d01\u7656\uff0c\u8ffd\u6c42\u5e95\u5c42\u539f\u7406\u4e0e\u6548\u7387) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u8a00\u8bba\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u672a\u63d0\u53ca\u5bb6\u5ead\u56e0\u7d20\uff0c\u4e14\u4e3a\u81ea\u6211\u9a71\u52a8\u578b\u5b66\u4e60\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u65f6\u95f4\u4e0e\u7cbe\u529b\u5145\u6c9b\uff0c\u5b66\u4e60\u81ea\u5f8b\u6027\u5f3a\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u6781\u9ad8\uff0c\u4ee5\u6280\u672f\u89c6\u89d2\u770b\u5f85\u95ee\u9898\uff0c\u65e0\u60c5\u7eea\u5316\u8ff9\u8c61\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | **\u6838\u5fc3\u98ce\u9669\u70b9**\uff1a\u5982\u679c\u8bfe\u7a0b\u5185\u5bb9\u6df1\u5ea6\u4e0d\u8db3\u3001\u966a\u8dd1\u8001\u5e08\u6280\u672f\u4e0d\u591f\u201c\u786c\u6838\u201d\uff0c\u6216\u5546\u5355\u6e20\u9053\u8d28\u91cf/\u6280\u672f\u6307\u5bfc\u65e0\u6cd5\u6ee1\u8db3\u5176\u201c\u5b66\u4e1c\u897f\u201d\u7684\u671f\u671b\uff0c\u53ef\u80fd\u56e0\u201c\u5b66\u4e0d\u5230\u4e1c\u897f\u201d\u800c\u5931\u671b\u9000\u51fa\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe\u4e2d\u671f\uff08\u7ea6\u7b2c3-4\u5468\uff09\uff0c\u5f53\u5176\u5b8c\u6210\u57fa\u7840\u5b66\u4e60\u540e\uff0c\u82e5\u53d1\u73b0\u8bfe\u7a0b\u5185\u5bb9\u6216\u8001\u5e08\u6c34\u5e73\u65e0\u6cd5\u6ee1\u8db3\u5176\u6df1\u5ea6\u63a2\u7d22\u9700\u6c42\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4e00\u624b\u5144\uff0c\u770b\u4f60\u804a\u7684\u8fd9\u4e9b\uff08SD2.0\u3001Lovart\u3001\u5de5\u4f5c\u6d41\uff09\uff0c\u7edd\u5bf9\u662f\u884c\u5bb6\u3002\u54b1\u4eec\u8fd9\u8bfe\u91cc\u85cf\u4e86\u4e0d\u5c11\u786c\u6838\u7684\u2018\u79c1\u8d27\u2019\u548c\u5b9e\u6218\u8e29\u5751\u7ecf\u9a8c\uff0c\u5c24\u5176\u9002\u5408\u50cf\u4f60\u8fd9\u6837\u60f3\u6df1\u6316\u6548\u7387\u4e0a\u9650\u7684\u3002\u4ee5\u540e\u6280\u672f\u4e0a\u7684\u96be\u9898\uff0c\u968f\u65f6@\u6211\uff0c\u6211\u5e2e\u4f60\u76f4\u63a5\u5bf9\u63a5\u966a\u8dd1\u5927\u5927\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u5fc5\u987b\u5339\u914d\u5176\u6280\u672f\u8ffd\u6c42\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743**\u3011+\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf**\u3011\u3002\u8d4b\u4e88\u5176\u4e0e\u540e\u7aef\u6280\u672f\u4e13\u5bb6\uff08\u966a\u8dd1\u5927\u5927\uff09\u76f4\u63a5\u5bf9\u8bdd\u7684\u7eff\u8272\u901a\u9053\uff0c\u5e76\u9080\u8bf7\u5176\u8fdb\u5165\u9ad8\u9636\u5b66\u5458/\u63a5\u5355\u9ad8\u624b\u7684\u5c0f\u5708\u5b50\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u5bf9\u5f85\u5c0f\u767d\u7684\u8bdd\u672f\u4e0e\u4ed6\u6c9f\u901a\uff1b\u63d0\u4f9b\u80a4\u6d45\u3001\u4e0d\u75db\u4e0d\u75d2\u7684\u70b9\u8bc4\uff1b\u963b\u6b62\u4ed6\u94bb\u7814\u5e95\u5c42\u539f\u7406\u6216\u5c1d\u8bd5\u65b0\u5de5\u5177\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u63a8\u4ecb\u9ad8\u9636\u3001\u6df1\u5ea6\u3001\u79c1\u5bc6\u7684\u6280\u672f\u7814\u8ba8\u7c7b\u8bfe\u7a0b\u6216\u670d\u52a1\uff0c**\u4e25\u7981**\u63a8\u9500\u4f4e\u9636\u3001\u91cd\u590d\u6216\u7eaf\u5a31\u4e50\u5411\u4ea7\u54c1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > **\u201c\u6211\u5c31\u559c\u6b22\u9ad8\u624b\uff0c\u4e0d\u7136\u5b66\u4e0d\u5230\u4e1c\u897f\u201d** \u2014\u2014 \u76f4\u63a5\u8868\u660e\u5176\u5b66\u4e60\u9a71\u52a8\u529b\u662f\u8ffd\u6c42\u9876\u5c16\u6280\u672f\uff0c\u800c\u975e\u6cdb\u6cdb\u4e86\u89e3\u3002\n2. > **\u201c\u6211\u8fde\u4f5c\u4e1a\u90fd\u5f53\u5546\u5355\u505a\u7684\u201d** \u2014\u2014 \u4f53\u73b0\u5176\u6781\u9ad8\u7684\u81ea\u6211\u8981\u6c42\u548c\u5b9e\u6218\u5bfc\u5411\uff0c\u5c06\u7ec3\u4e60\u7b49\u540c\u4e8e\u4ef7\u503c\u4ea7\u51fa\u3002\n3. > **\u201c\u6ca1\u4efb\u52a1\u61d2\u5f97\u7ec3\u624b...\u662f\u6bd4\u8d5b\uff0c\u505a\u4f5c\u54c1\u662f\u8fdb\u6b65\u6700\u5feb\u7684\u201d** \u2014\u2014 \u63ed\u793a\u4e86\u5176\u201c\u4ee5\u8d5b\u4ee3\u7ec3\u201d\u7684\u6781\u5ba2\u601d\u7ef4\uff0c\u6e34\u671b\u901a\u8fc7\u9ad8\u96be\u5ea6\u6311\u6218\u5b9e\u73b0\u6280\u672f\u7a81\u7834\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T3 \u6b7b\u78d5\u6781\u5ba2\u6d3e\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728AI\u6280\u672f\u5feb\u901f\u8fed\u4ee3\u4e2d\uff0c\u5efa\u7acb\u5e76\u5de9\u56fa\u81ea\u5df1\u7684\u4e13\u4e1a\u6df1\u5ea6\u4e0e\u6280\u672f\u62a4\u57ce\u6cb3\uff0c\u5b9e\u73b0\u81ea\u6211\u8d85\u8d8a\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u4f46\u5b58\u5728\u56e0\u8bfe\u7a0b/\u8001\u5e08\u6280\u672f\u6df1\u5ea6\u4e0d\u8db3\u800c\u5931\u671b\u7684\u4e2d\u5ea6\u98ce\u9669\u3002\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u76f4\u8fbe\u540e\u7aef\u4e13\u5bb6\u7684\u6280\u672f\u5bf9\u8bdd\u901a\u9053\uff0c\u5e76\u8d4b\u4e88\u5176\u201c\u5708\u5185\u4eba\u201d\u7684\u8eab\u4efd\u8ba4\u540c\u3011**\u3002\n\n```json\n{\"core_type\": \"T3 \u6b7b\u78d5\u6781\u5ba2\u6d3e\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743+\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u7537\", \"city\": \"\u672a\u77e5\"}\n```";
