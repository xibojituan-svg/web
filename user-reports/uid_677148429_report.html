        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677148429 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-06 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6854\u68545(\u6768\u5a1f) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b (7380\u5143\u9ad8\u9636\u73ed) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u652f\u4ed8\u5f02\u5e38**\uff1a\u7528\u6237\u58f0\u79f0\u201c\u4ea4\u9519\u4e86\uff0c\u4ea4\u4e86\u4e24\u4e2a\u7684\u5b66\u8d39\u201d\uff0c\u4e3a3980\u5143\u548c7380\u5143\u4e24\u7b14\u3002\u652f\u4ed8\u65b9\u5f0f\u672a\u77e5\uff0c\u4f46\u5b58\u5728\u51b2\u52a8\u652f\u4ed8\u548c\u64cd\u4f5c\u5931\u8bef\u98ce\u9669\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff1a\u7528\u6237\u591a\u6b21\u5728\u4e0a\u73ed\u65f6\u95f4\uff08\u201c\u8fd9\u4f1a\u8fd8\u5728\u52aa\u529b\u642c\u7816\u4e2d\u201d\uff09\u548c\u6df1\u591c\uff08\u51cc\u66681\u70b9\uff09\u56de\u590d\u6d88\u606f\uff0c\u8868\u660e\u65f6\u95f4\u4e0d\u56fa\u5b9a\uff0c\u4f9d\u8d56\u788e\u7247\u5316\u65f6\u95f4\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\uff1a\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\uff0c\u65e0\u6cd5\u5224\u65ad\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\uff1a\u804a\u5929\u8bb0\u5f55\u4e3b\u8981\u7531\u9500\u552e\u5355\u65b9\u9762\u63a8\u9001\u548c\u50ac\u4fc3\u6784\u6210\uff0c\u7528\u6237\u4e3b\u52a8\u8868\u8fbe\u6781\u5c11\uff0c\u4e14\u96c6\u4e2d\u5728\u5b66\u4e60\u53cd\u9988\u548c\u7b80\u5355\u5e94\u7b54\u3002**\u5173\u952e\u4fe1\u606f\u5982\u5e74\u9f84\u3001\u804c\u4e1a\u3001\u6536\u5165\u3001\u5bb6\u5ead\u72b6\u51b5\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\uff08\u9664\u4e00\u6b21\u88ab\u9a97\u7ecf\u5386\uff09\u5747\u7f3a\u5931**\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b07\u4f4e\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u7eaf\u4e3a\u51e0\u5929\u5185\u63d0\u73b0\u4fdd\u5e95\u800c\u6765(\u4f4e\u6781\u5371)**\u3002\u7528\u6237\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u5feb\u901f\u53d8\u73b0\u4ee5\u5f25\u8865\u8fc7\u5f80\u635f\u5931\uff08\u88ab\u9a97\u94b1\uff09\uff0c\u5bf9\u5b66\u4e60\u5185\u5bb9\u672c\u8eab\u5174\u8da3\u4e00\u822c\uff0c\u5bf9\u201c\u517c\u804c\u201d\u3001\u201c\u63a5\u5355\u201d\u3001\u201c\u8d5a\u94b1\u201d\u7b49\u8bcd\u6c47\u9ad8\u5ea6\u654f\u611f\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n    > \u201c\u4e4b\u524d\u4e5f\u5728\u7f51\u4e0a\u62a5\u4e86\u4e2a\u7ed8\u753b\u7684\u73ed\u540e\u9762\u56e0\u4e3a\u4e2a\u4eba\u539f\u56e0\u505c\u8bfe\u4e86\uff0c\u7ed3\u679c\u540e\u9762\u4e0d\u77e5\u9053\u4ec0\u4e48\u539f\u56e0\u4e2a\u4eba\u4fe1\u606f\u88ab\u8bc8\u9a97\u7684\u641e\u5230\u4e86\uff0c\u7136\u540e\u8fd8\u88ab\u9a97\u4e86\u4e0d\u5c11\u94b1[\u6487\u5634]\u6240\u4ee5\u5176\u5b9e\u6709\u70b9\u4e0d\u592a\u6562\u8fc8\u51fa\u8fd9\u4e00\u6b65\u7684\u201d\n    > \u201c\u6211\u89c9\u5f97\u53ef\u4ee5\u5c1d\u8bd5\u6df1\u8015\u4e00\u4e0b\u201d (\u5728\u9500\u552e\u5f3a\u8c03\u201c\u63a5\u5355\u8d5a\u94b1\u201d\u540e\u56de\u5e94)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u7528\u6237\u6709\u201c\u88ab\u9a97\u4e86\u4e0d\u5c11\u94b1\u201d\u7684\u7ecf\u5386\uff0c\u8868\u660e\u5176\u8d22\u52a1\u6297\u98ce\u9669\u80fd\u529b\u5f31\uff0c\u4e14\u5b58\u5728\u51b2\u52a8\u652f\u4ed8\uff08\u4ea4\u9519\u5b66\u8d39\uff09\uff0c\u8d44\u91d1\u72b6\u51b5\u5b58\u7591\u3002\u652f\u4ed8\u6765\u6e90\u672a\u77e5\uff0c\u4f46\u7ed3\u5408\u88ab\u9a97\u7ecf\u5386\u548c\u4f4e\u52a8\u673a\uff0c\u8d44\u91d1\u7ef4\u5ea6\u98ce\u9669\u9ad8\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e** \u2014 \u7528\u6237\u591a\u6b21\u8868\u793a\u5728\u4e0a\u73ed\uff08\u201c\u8fd9\u4f1a\u8fd8\u5728\u4e0a\u73ed\uff0c\u641e\u4e0d\u4e86\u201d\u3001\u201c\u8fd8\u5728\u52aa\u529b\u642c\u7816\u4e2d\u201d\uff09\uff0c\u56de\u590d\u6d88\u606f\u65f6\u95f4\u788e\u7247\u5316\uff08\u767d\u5929\u3001\u6df1\u591c\uff09\uff0c\u8868\u660e\u5176\u53ef\u7528\u5b66\u4e60\u65f6\u95f4\u7d27\u5f20\u4e14\u4e0d\u56fa\u5b9a\uff0c\u96be\u4ee5\u4fdd\u8bc1\u7cfb\u7edf\u5b66\u4e60\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u672a\u63d0\u53ca\uff0c\u6309\u6700\u8c28\u614e\u539f\u5219\uff0c\u89c6\u4e3a\u6f5c\u5728\u98ce\u9669\u70b9\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u7528\u6237\u4e3b\u52a8\u66b4\u9732\u91cd\u5927\u521b\u4f24\uff08\u88ab\u9a97\u94b1\uff09\uff0c\u5e76\u56e0\u6b64\u4ea7\u751f\u201c\u4e0d\u592a\u6562\u8fc8\u51fa\u8fd9\u4e00\u6b65\u201d\u7684\u6050\u60e7\u5fc3\u7406\uff0c\u663e\u793a\u51fa**\u6781\u4f4e\u7684\u5fc3\u7406\u9632\u7ebf\u548c\u5bf9\u5916\u90e8\u98ce\u9669\u7684\u6781\u5ea6\u654f\u611f**\u3002\u5176\u5b66\u4e60\u52a8\u529b\u5efa\u7acb\u5728\u201c\u5f25\u8865\u635f\u5931\u201d\u548c\u201c\u5feb\u901f\u5b89\u5168\u53d8\u73b0\u201d\u7684\u8106\u5f31\u57fa\u7840\u4e0a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n    > \u201c\u4e4b\u524d\u4e5f\u5728\u7f51\u4e0a\u62a5\u4e86\u4e2a\u7ed8\u753b\u7684\u73ed...\u88ab\u9a97\u4e86\u4e0d\u5c11\u94b1[\u6487\u5634]\u6240\u4ee5\u5176\u5b9e\u6709\u70b9\u4e0d\u592a\u6562\u8fc8\u51fa\u8fd9\u4e00\u6b65\u7684\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c (\u5b89\u5168\u9700\u6c42)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u56e0\u8fc7\u5f80\u91cd\u5927\u8d22\u52a1\u635f\u5931\uff08\u88ab\u9a97\uff09\u800c\u4ea7\u751f\u7684\u5f3a\u70c8\u4e0d\u5b89\u5168\u611f\u4e0e\u7126\u8651**\u3002\u4ed6\u5bfb\u6c42\u7684\u4e0d\u662f\u5174\u8da3\u6216\u6210\u957f\uff0c\u800c\u662f\u4e00\u4e2a\u201c\u7edd\u5bf9\u5b89\u5168\u201d\u3001\u201c\u80fd\u5feb\u901f\u56de\u8840\u201d\u7684\u4fdd\u969c\uff0c\u4ee5\u4fee\u590d\u53d7\u635f\u7684\u7ecf\u6d4e\u548c\u5fc3\u7406\u5b89\u5168\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u7edd\u5bf9\u7684\u5b89\u5168\u611f\u4e0e\u98ce\u9669\u515c\u5e95\u627f\u8bfa**\u3002\u4efb\u4f55\u5173\u4e8e\u201c\u4e0d\u786e\u5b9a\u6027\u201d\u3001\u201c\u53ef\u80fd\u5931\u8d25\u201d\u3001\u201c\u9700\u8981\u957f\u671f\u6295\u5165\u201d\u7684\u6697\u793a\uff0c\u90fd\u4f1a\u76f4\u63a5\u89e6\u53d1\u5176\u56e0\u88ab\u9a97\u800c\u4ea7\u751f\u7684\u521b\u4f24\u540e\u5e94\u6fc0\u53cd\u5e94\uff0c\u5bfc\u81f4\u5d29\u6e83\u6216\u9000\u8d39\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udd34 D\u7c7b (\u9ad8\u5371\u7194\u65ad\u578b)** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **\u9000\u8d39\u578b (\u4ea7\u54c1\u9519\u914d\u578b)** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\ud83d\udd34 **\u5df2\u89e6\u53d1 D \u7c7b\u7194\u65ad\u7ea2\u7ebf\uff01**\n- **\u89e6\u53d1\u56e0\u7531**\uff1a**\u7ecf\u6d4e\u7ea2\u7ebf + \u5fc3\u7406\u7ea2\u7ebf**\u3002\u7528\u6237\u660e\u786e\u63d0\u53ca\u201c\u88ab\u9a97\u4e86\u4e0d\u5c11\u94b1\u201d\uff0c\u5904\u4e8e\u8d22\u52a1\u53d7\u635f\u548c\u5fc3\u7406\u521b\u4f24\u540e\u7684\u8106\u5f31\u671f\u3002\u5176\u652f\u4ed8\u884c\u4e3a\uff08\u4ea4\u9519\u5b66\u8d39\uff09\u663e\u793a\u51fa\u51b2\u52a8\u548c\u975e\u7406\u6027\uff0c\u7b26\u5408\u201c\u5e95\u5c42\u5d29\u584c\u201d\u548c\u201c\u51b2\u52a8\u8d2d\u4e70\u60c5\u5883\u201d\u7684\u4f26\u7406\u9632\u7ebf\u3002\u5176\u6838\u5fc3\u9700\u6c42\u662f\u201c\u5b89\u5168\u201d\uff0c\u4f46\u4ea7\u54c1\uff08\u6709\u58f0\u526f\u4e1a\uff09\u65e0\u6cd5\u63d0\u4f9b\u5176\u6240\u9700\u7684\u201c\u7edd\u5bf9\u4fdd\u969c\u201d\uff0c\u6781\u6613\u56e0\u6536\u76ca\u4e0d\u53ca\u9884\u671f\u6216\u4efb\u4f55\u632b\u6298\u800c\u5f15\u7206\u5ba2\u8bc9\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4e2d | \u82e5\u5bb6\u4eba\u53d1\u73b0\u5176\u518d\u6b21\u201c\u6295\u8d44\u201d\u5b66\u4e60\uff0c\u4e14\u8d44\u91d1\u7d27\u5f20\uff0c\u6781\u6613\u5f15\u53d1\u51b2\u7a81\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u6781\u9ad8** | \u5176\u788e\u7247\u5316\u5de5\u4f5c\u65f6\u95f4\u4e0e\u8bfe\u7a0b\u8981\u6c42\u7684\u56fa\u5b9a\u76f4\u64ad\u3001\u4f5c\u4e1a\u63d0\u4ea4\u4e25\u91cd\u51b2\u7a81\uff0c\u4e00\u65e6\u79ef\u538b\u4f5c\u4e1a\u6216\u9519\u8fc7\u5173\u952e\u76f4\u64ad\uff0c\u81ea\u8d23\u548c\u7126\u8651\u4f1a\u8fc5\u901f\u8f6c\u5316\u4e3a\u5bf9\u5e73\u53f0\u7684\u6124\u6012\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u4efb\u4f55\u5b66\u4e60\u4e0a\u7684\u5c0f\u56f0\u96be\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u3001\u5f55\u97f3\u6548\u679c\u4e0d\u4f73\uff09\u3001\u63a5\u5355\u4e0d\u987a\u5229\u3001\u6216\u611f\u89c9\u5230\u201c\u53c8\u88ab\u9a97\u4e86\u201d\uff08\u4e0e\u9ad8\u53d8\u73b0\u9884\u671f\u4e0d\u7b26\uff09\uff0c\u90fd\u4f1a\u76f4\u63a5\u89e6\u53d1\u5176\u201c\u88ab\u9a97\u201d\u521b\u4f24\uff0c\u5bfc\u81f4\u60c5\u7eea\u5d29\u6e83\u548c\u6fc0\u70c8\u6295\u8bc9\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u6781\u9ad8** | \u5176\u62a5\u540d\u6838\u5fc3\u52a8\u673a\u662f\u5feb\u901f\u53d8\u73b0\u5f25\u8865\u635f\u5931\u3002\u4e00\u65e6\u53d1\u73b0\u201c\u6709\u58f0\u4e66\u5f55\u5236\u201d\u5e76\u975e\u201c\u5feb\u901f\u63d0\u6b3e\u673a\u201d\uff0c\u9700\u8981\u957f\u671f\u7ec3\u4e60\u4e14\u6536\u76ca\u4e0d\u7a33\u5b9a\uff0c\u843d\u5dee\u611f\u4f1a\u77ac\u95f4\u5f15\u7206\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c1-2\u5468**\u3002\u5f53\u7b2c\u4e00\u6b21\u4f5c\u4e1a\u9047\u5230\u56f0\u96be\uff0c\u6216\u7b2c\u4e00\u6b21\u5c1d\u8bd5\u63a5\u5355\u5931\u8d25\u65f6\uff0c\u5176\u8106\u5f31\u7684\u201c\u5b89\u5168\u91cd\u5efa\u201d\u5e7b\u60f3\u4f1a\u8fc5\u901f\u7834\u706d\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u540c\u5b66\u4f60\u597d\uff0c\u770b\u5230\u4f60\u7684\u5b66\u4e60\u8bb0\u5f55\u975e\u5e38\u8ba4\u771f\uff0c\u4e5f\u4e86\u89e3\u5230\u4f60\u8fc7\u53bb\u6709\u4e00\u4e9b\u4e0d\u592a\u6109\u5feb\u7684\u7ecf\u5386\u3002\u8bf7\u653e\u5fc3\uff0c\u6211\u4eec\u8fd9\u91cc\u4e0d\u641e\u2018\u4e00\u591c\u66b4\u5bcc\u2019\u7684\u627f\u8bfa\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u5148\u628a\u57fa\u7840\u6253\u7262\u3002\u6709\u4efb\u4f55\u62c5\u5fc3\u6216\u8005\u89c9\u5f97\u8ddf\u4e0d\u4e0a\uff0c\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u5546\u91cf\u8c03\u6574\u8282\u594f\u3002**\u5b66\u4e60\u662f\u4e3a\u4e86\u8ba9\u81ea\u5df1\u66f4\u5f3a\u5927\uff0c\u800c\u4e0d\u662f\u4e3a\u4e86\u586b\u8865\u8fc7\u53bb\u7684\u5751**\uff0c\u522b\u7ed9\u81ea\u5df1\u592a\u5927\u538b\u529b\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u98ce\u9669\u9694\u79bb\u4f53\u9a8c\u7ebf\u3011**\u3002**\u4e25\u7981\u76f4\u63a5\u63a8\u9ad8\u9636\u8bfe**\u3002\u5e94\u5f15\u5bfc\u81f3**98-398\u5143\u7684\u6781\u8f7b\u91cf\u5165\u95e8\u4f53\u9a8c\u5305**\uff0c\u6838\u5fc3\u662f\u201c\u4f4e\u51b3\u7b56\u6210\u672c + \u9ad8\u60c5\u7eea\u4ef7\u503c\u966a\u4f34\u201d\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u5f3a\u5236\u6302\u8f7d **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u73ed\u4e3b\u4efb\u9700\u9ad8\u9891\u3001\u4f4e\u538b\u529b\u5730\u8fdb\u884c\u5fc3\u7406\u5b89\u629a\uff0c\u91cd\u70b9\u5f3a\u8c03\u201c\u8fc7\u7a0b\u6210\u957f\u201d\u800c\u975e\u201c\u7ed3\u679c\u53d8\u73b0\u201d\uff0c\u5e76**\u660e\u786e\u8bbe\u7acb\u6781\u4f4e\u7684\u9884\u671f**\uff08\u5982\u201c\u5148\u5b8c\u6210\u4e00\u6b21\u5b8c\u6574\u5f55\u97f3\u201d\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1.  \u7edd\u53e3\u4e0d\u63d0\u201c\u8d5a\u94b1\u201d\u3001\u201c\u517c\u804c\u201d\u3001\u201c\u6708\u5165\u8fc7\u4e07\u201d\u7b49\u8bcd\u6c47\u3002\n    2.  \u7edd\u4e0d\u50ac\u4fc3\u4f5c\u4e1a\u548c\u76f4\u64ad\u51fa\u52e4\uff0c\u6539\u4e3a\u201c\u968f\u65f6\u53ef\u4ee5\u8865\u770b\uff0c\u6309\u4f60\u7684\u8282\u594f\u6765\u201d\u3002\n    3.  \u7edd\u4e0d\u4e0e\u5176\u4ed6\u5b66\u5458\u8fdb\u884c\u6536\u76ca\u5bf9\u6bd4\u3002\n    4.  \u7981\u6b62\u4efb\u4f55\u5347\u5355\u884c\u4e3a\uff0c\u5305\u62ec\u6697\u793a\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u82e5\u5df2\u652f\u4ed8\u9ad8\u9636\u8bfe\u7a0b\u8d39\u7528\uff0c\u5e94**\u4e3b\u52a8\u542f\u52a8\u7eff\u8272\u9000\u8d39\u901a\u9053**\uff0c\u5efa\u8bae\u5176\u964d\u7ea7\u81f3\u4f53\u9a8c\u5305\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > **\u201c\u4e4b\u524d\u4e5f\u5728\u7f51\u4e0a\u62a5\u4e86\u4e2a\u7ed8\u753b\u7684\u73ed\u540e\u9762\u56e0\u4e3a\u4e2a\u4eba\u539f\u56e0\u505c\u8bfe\u4e86\uff0c\u7ed3\u679c\u540e\u9762\u4e0d\u77e5\u9053\u4ec0\u4e48\u539f\u56e0\u4e2a\u4eba\u4fe1\u606f\u88ab\u8bc8\u9a97\u7684\u641e\u5230\u4e86\uff0c\u7136\u540e\u8fd8\u88ab\u9a97\u4e86\u4e0d\u5c11\u94b1[\u6487\u5634]\u6240\u4ee5\u5176\u5b9e\u6709\u70b9\u4e0d\u592a\u6562\u8fc8\u51fa\u8fd9\u4e00\u6b65\u7684\u201d**\n2. > **\u201c\u5e08\u59d0\uff0c\u6211\u4ea4\u9519\u4e86\uff0c\u4ea4\u4e86\u4e24\u4e2a\u7684\u5b66\u8d39\uff0c\u6211\u60f3\u5b667380\u7684\uff0c3980\u7684\u5b66\u8d39\u8fd8\u80fd\u9000\u5417\uff1f[\u51b7\u6c57]\u201d**\n3. > **\u201c\u6211\u8981\u6539\u53d8\u201d** (\u51cc\u66681\u70b9\u53d1\u9001\uff0c\u5145\u6ee1\u7126\u8651\u4e0e\u6025\u8feb\u611f)\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010\u521b\u4f24\u540e\u51b2\u52a8\u907f\u9669\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\uff08\u7ecf\u6d4e\u4e0e\u5fc3\u7406\u5b89\u5168\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7acb\u5373\u964d\u7ea7\u81f3\u6700\u4f4e\u98ce\u9669\u4ea7\u54c1\uff0c\u542f\u52a8\u9ad8\u5f3a\u5ea6\u5fc3\u7406\u7597\u6108\u5f0f\u966a\u4f34\uff0c\u5e76\u505a\u597d\u968f\u65f6\u9000\u8d39\u7684\u51c6\u5907\u3011**\u3002\n\n```json\n{\"core_type\": \"\u9000\u8d39\u578b (\u4ea7\u54c1\u9519\u914d\u578b)\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u98ce\u9669\u9694\u79bb\u4f53\u9a8c\u7ebf + \u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\"}\n```";
