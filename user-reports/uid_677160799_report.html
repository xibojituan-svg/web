    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n## \u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e\n**\u5173\u952e\u4fe1\u606f\u7f3a\u5931**\uff1a\u804a\u5929\u8bb0\u5f55\u4e3a\u8bad\u7ec3\u8425\u671f\u95f4\u53ca\u8f6c\u5316\u540e\u671f\u7684\u7247\u6bb5\uff0c\u7f3a\u5c11\u7528\u6237\u521d\u59cb\u62a5\u540d\u52a8\u673a\u3001\u4e2a\u4eba\u80cc\u666f\uff08\u5e74\u9f84\u3001\u804c\u4e1a\u3001\u5bb6\u5ead\u72b6\u51b5\u3001\u6536\u5165\u6c34\u5e73\uff09\u3001\u652f\u4ed8\u80fd\u529b\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u7b49\u5173\u952e\u4fe1\u606f\u3002\u7528\u6237\u4ec5\u5728\u6700\u540e\u9636\u6bb5\u624d\u900f\u9732\u201c\u7f3a\u94b1\u201d\u548c\u201c\u670b\u53cb\u8d1f\u9762\u7ecf\u5386\u201d\u4e24\u4e2a\u5173\u952e\u987e\u8651\u3002\n\n---\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49\u504f\u4f4e)**\n    *   **\u8868\u5c42\u52a8\u673a**\uff1a\u660e\u786e\u8868\u8fbe\u201c\u60f3\u5b66\u4e60\u9ad8\u9636\u201d\uff0c\u5bf9\u6709\u58f0\u6f14\u64ad\u6280\u80fd\u611f\u5174\u8da3\uff0c\u5e76\u5b8c\u6210\u4e86\u8bad\u7ec3\u8425\u5168\u90e8\u4f5c\u4e1a\u548c\u8003\u6838\uff0c\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b\u3002\n    *   **\u6df1\u5c42\u52a8\u673a**\uff1a**\u6838\u5fc3\u9a71\u52a8\u529b\u4e3a\u201c\u8d5a\u94b1\u201d**\uff08\u201c\u6211\u73b0\u5728\u4e5f\u7f3a\u94b1\u8bf4\u5b9e\u8bdd\u201d\uff09\u3002\u5bf9\u884c\u4e1a\u524d\u666f\u548c\u53d8\u73b0\u6e20\u9053\uff08\u76f4\u64ad\u4e2d\u5f3a\u8c03\u8fd120\u79cd\uff09\u8868\u73b0\u51fa\u5173\u6ce8\u3002\u52a8\u673a\u4e2d**\u529f\u5229\u6027\uff08\u751f\u5b58/\u7ecf\u6d4e\u9700\u6c42\uff09\u8fdc\u5927\u4e8e\u5174\u8da3\u70ed\u7231\u6216\u81ea\u6211\u5b9e\u73b0**\u3002\n    *   **\u98ce\u9669\u4fe1\u53f7**\uff1a\u52a8\u673a\u6613\u53d7\u5916\u90e8\u4fe1\u606f\uff08\u670b\u53cb\u8d1f\u9762\u7ecf\u5386\uff09\u548c\u77ed\u671f\u7ecf\u6d4e\u538b\u529b\u52a8\u6447\uff0c**\u5fe0\u8bda\u5ea6\u4e0e\u575a\u6301\u5ea6\u5b58\u7591**\u3002\n\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4f4e)**\n    *   **\u7ecf\u6d4e\u8d44\u6e90**\uff1a**\u660e\u786e\u8868\u793a\u201c\u7f3a\u94b1\u201d\u3001\u201c\u6ca1\u6709\u8fd9\u4e2a\u5b66\u8d39\u201d**\uff0c\u652f\u4ed8\u80fd\u529b\u5f31\u3002\u6700\u7ec8\u8be2\u95ee\u4fe1\u7528\u5361\u5206\u671f\uff0c\u5c5e\u4e8e**\u7ecf\u6d4e\u62ee\u636e\u578b\u7528\u6237**\u3002\n    *   **\u65f6\u95f4/\u7cbe\u529b\u8d44\u6e90**\uff1a\u80fd\u6309\u65f6\u5b8c\u6210\u8bad\u7ec3\u8425\u4f5c\u4e1a\u548c\u76f4\u64ad\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u53ef\u652f\u914d\u65f6\u95f4\u3002\u4f46\u672a\u900f\u9732\u5177\u4f53\u804c\u4e1a\u72b6\u6001\uff0c\u65f6\u95f4\u5f39\u6027\u672a\u77e5\u3002\n    *   **\u6280\u80fd/\u8ba4\u77e5\u8d44\u6e90**\uff1a\u58f0\u97f3\u6761\u4ef6\u88ab\u9500\u552e\u8bc4\u4ef7\u4e3a\u201c\u4e0d\u9519\u201d\u3001\u201c\u6709\u53ef\u5851\u6027\u201d\uff0c\u901a\u8fc7\u4e86\u65c1\u767d\u548c\u89d2\u8272\u97f3\u8003\u6838\uff0c\u5177\u5907\u57fa\u7840\u6f5c\u529b\u3002\u4f46\u5bf9\u884c\u4e1a\u8ba4\u77e5\u6d45\uff0c\u6613\u53d7\u4ed6\u4eba\uff08\u670b\u53cb\uff09\u8d1f\u9762\u7ecf\u9a8c\u5f71\u54cd\u3002\n\n*   **\u5fc3\u7406\u5f39\u6027 (\u4f4e)**\n    *   **\u6297\u538b\u4e0e\u575a\u6301\u6027**\uff1a\u5728\u9500\u552e\u9ad8\u5f3a\u5ea6\u8ddf\u8fdb\u548c\u201c\u7ed3\u8425\u5012\u8ba1\u65f6\u201d\u538b\u529b\u4e0b\uff0c\u6700\u7ec8\u505a\u51fa\u62a5\u540d\u51b3\u5b9a\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u4ece\u4f17\u6027\u548c\u51b3\u7b56\u6613\u611f\u6027\u3002\u4f46**\u51b3\u7b56\u8fc7\u7a0b\u72b9\u8c6b\u3001\u53cd\u590d**\uff08\u591a\u6b21\u672a\u56de\u590d\u9500\u552e\u50ac\u5355\uff0c\u6700\u540e\u4e00\u5929\u624d\u8868\u8fbe\u987e\u8651\uff09\uff0c\u6297\u5e72\u6270\u80fd\u529b\u5f31\u3002\n    *   **\u632b\u6298\u9884\u671f\u4e0e\u5f52\u56e0**\uff1a**\u9ad8\u5ea6\u6050\u60e7\u201c\u88ab\u629b\u5f03\u201d\u548c\u201c\u5b66\u5b8c\u6ca1\u4eba\u5e26\u201d**\uff08\u670b\u53cb\u5728\u522b\u5904\u5b66\u4e60\u7684\u5931\u8d25\u7ecf\u5386\u662f\u5176\u6700\u5927\u987e\u8651\uff09\u3002\u503e\u5411\u4e8e\u5c06\u6210\u529f\u5f52\u56e0\u4e8e\u5916\u90e8\u652f\u6301\uff08\u201c\u6709\u4eba\u5e26\u201d\uff09\uff0c\u800c\u975e\u81ea\u8eab\u52aa\u529b\uff0c**\u4f9d\u8d56\u5fc3\u7406\u5f3a**\u3002\n    *   **\u5b66\u4e60\u5fc3\u6001**\uff1a\u504f\u5b9e\u7528\u4e3b\u4e49\uff0c\u5173\u6ce8\u7ed3\u679c\uff08\u63a5\u5355\u3001\u8d5a\u94b1\uff09\u800c\u975e\u8fc7\u7a0b\u6210\u957f\u3002\u5fc3\u6001\u8f83\u4e3a\u8106\u5f31\uff0c\u6613\u4ea7\u751f\u6295\u5165\u540e\u7684\u5931\u843d\u611f\u3002\n\n---\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u7528\u6237\u5df2\u652f\u4ed8\u9ad8\u9636\u8bfe\u7a0b\u8d39\u7528\uff087380\u5143\uff09\uff0c**\u652f\u4ed8\u52a8\u4f5c\u5b8c\u6210**\u3002\u4f46\u652f\u4ed8\u524d\u660e\u786e\u8868\u8fbe\u7ecf\u6d4e\u56f0\u96be\uff0c\u4f7f\u7528\u4fe1\u7528\u5361\u5206\u671f\uff0c\u5c5e\u4e8e**\u9ad8\u538b\u652f\u4ed8**\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u4fe1\u606f\u4e0d\u8db3\u3002\u672a\u63d0\u53ca\u914d\u5076\u6216\u5bb6\u4eba\uff0c\u51b3\u7b56\u4f3c\u4e4e\u4e3a\u4e2a\u4eba\u505a\u51fa\uff0c\u4f46\u7ecf\u6d4e\u538b\u529b\u53ef\u80fd\u9690\u542b\u5bb6\u5ead\u8d22\u52a1\u7ea6\u675f\u3002\n*   **\u6b65\u9aa4A\uff08\u652f\u4ed8\u80fd\u529b\u4e0e\u610f\u613f\uff09**\uff1a\u652f\u4ed8\u610f\u613f\u7ecf\u8fc7\u957f\u671f\u50ac\u5355\u540e\u88ab\u6fc0\u53d1\uff0c\u4f46\u652f\u4ed8\u80fd\u529b\u5f31\uff08\u7f3a\u94b1\u3001\u5206\u671f\uff09\u3002**\u5224\u5b9a\uff1aA-\uff08\u652f\u4ed8\u80fd\u529b\u4e0d\u8db3\uff0c\u610f\u613f\u6447\u6446\uff09**\u3002\n*   **\u6b65\u9aa4B\uff08\u76ee\u6807\u6e05\u6670\u5ea6\uff09**\uff1a\u76ee\u6807\u4e3a\u201c\u5b66\u4e60\u9ad8\u9636\u201d\u548c\u201c\u8d5a\u94b1\u201d\uff0c\u4f46\u8def\u5f84\u4f9d\u8d56\u5916\u90e8\u5e26\u9886\uff0c\u5bf9\u5b66\u4e60\u540e\u7684\u81ea\u6211\u53d1\u5c55\u8def\u5f84\u6a21\u7cca\u3002**\u5224\u5b9a\uff1aB-\uff08\u76ee\u6807\u7ed3\u679c\u5bfc\u5411\u660e\u786e\uff0c\u4f46\u8def\u5f84\u6a21\u7cca\uff0c\u4f9d\u8d56\u6027\u5f3a\uff09**\u3002\n*   **\u6b65\u9aa4C\uff08\u6267\u884c\u529b\u4e0e\u575a\u6301\u5ea6\uff09**\uff1a\u8bad\u7ec3\u8425\u671f\u95f4\u6267\u884c\u529b\u5c1a\u53ef\uff0c\u4f46\u51b3\u7b56\u62d6\u5ef6\uff0c\u4e14\u5bf9\u957f\u671f\u575a\u6301\u7684\u4fe1\u5ff5\u57fa\u4e8e\u5916\u90e8\u6301\u7eed\u652f\u6301\u3002**\u5224\u5b9a\uff1aC-\uff08\u77ed\u671f\u4efb\u52a1\u6267\u884c\u529b\u53ef\uff0c\u957f\u671f\u575a\u6301\u6027\u5b58\u7591\uff09**\u3002\n*   **\u6b65\u9aa4D\uff08\u8ba4\u77e5\u4e0e\u8d44\u6e90\uff09**\uff1a\u8ba4\u77e5\u6c34\u5e73\u6d45\uff0c\u6613\u53d7\u8d1f\u9762\u4fe1\u606f\u5f71\u54cd\uff1b\u7ecf\u6d4e\u8d44\u6e90\u532e\u4e4f\u3002**\u5224\u5b9a\uff1aD-\uff08\u8d44\u6e90\u4e0e\u8ba4\u77e5\u53cc\u4f4e\uff09**\u3002\n\n**\u7efc\u5408\u5224\u5b9a**\uff1a\u7528\u6237\u753b\u50cf\u504f\u5411 **\u201c\u9ad8\u610f\u613f-\u4f4e\u8d44\u6e90-\u4f4e\u5f39\u6027\u201d** \u7c7b\u578b\uff0c\u5904\u4e8e**\u8f6c\u5316\u6f0f\u6597\u5e95\u90e8\u9760\u538b\u529b\u6210\u4ea4\u7684\u654f\u611f\u7528\u6237**\u3002\n\n---\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n\n**\u5339\u914d\u539f\u578b\uff1aT7 \u751f\u5b58\u7126\u8651\u578b**\n*   **\u6838\u5fc3\u7279\u5f81**\uff1a\u7ecf\u6d4e\u538b\u529b\u5927\uff0c\u5c06\u8bfe\u7a0b\u89c6\u4e3a\u201c\u6551\u547d\u7a3b\u8349\u201d\u6216\u5feb\u901f\u53d8\u73b0\u901a\u9053\uff1b\u51b3\u7b56\u53d7\u77ed\u671f\u751f\u5b58\u7126\u8651\u9a71\u52a8\uff1b\u5bf9\u6295\u5165\u56de\u62a5\u6bd4\u6781\u5176\u654f\u611f\uff0c\u5bb9\u9519\u7387\u4f4e\u3002\n*   **\u543b\u5408\u70b9**\uff1a\n    1.  **\u76f4\u63a5\u8868\u8fbe\u201c\u7f3a\u94b1\u201d**\uff0c\u7ecf\u6d4e\u8d44\u6e90\u662f\u6838\u5fc3\u77ed\u677f\u3002\n    2.  \u52a8\u673a\u9ad8\u5ea6\u529f\u5229\u5316\uff08\u8d5a\u94b1\uff09\uff0c\u800c\u975e\u5174\u8da3\u6216\u6210\u957f\u3002\n    3.  \u51b3\u7b56\u53d7\u670b\u53cb\u5931\u8d25\u6848\u4f8b\uff08\u53ef\u80fd\u610f\u5473\u7740\u91d1\u94b1\u635f\u5931\uff09\u5f71\u54cd\u5de8\u5927\uff0c\u6050\u60e7\u4e8c\u6b21\u635f\u5931\u3002\n    4.  \u5bf9\u201c\u5b66\u5b8c\u662f\u5426\u6709\u4eba\u5e26\u201d\u6781\u5ea6\u5173\u6ce8\uff0c\u53cd\u6620\u51fa\u5bf9\u201c\u6295\u5165\u540e\u80fd\u5426\u786e\u4fdd\u4ea7\u51fa\u201d\u7684\u6df1\u5ea6\u7126\u8651\u3002\n\n---\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4e2d\u9ad8)\n\n\u9010\u9879\u6392\u67e57\u79cd\u9000\u8d39\u6839\u56e0\uff1a\n1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u671f\u5f85\u201c\u6709\u4eba\u5e26\u201d\u786e\u4fdd\u63a5\u5355\u8d5a\u94b1\uff0c\u4f46\u7cfb\u7edf\u8bfe\u65e0\u6cd5\u4fdd\u8bc1\u5c31\u4e1a\u3002\u4e00\u65e6\u77ed\u671f\u672a\u83b7\u5f97\u9884\u671f\u6536\u5165\uff0c\u6781\u6613\u4ea7\u751f\u201c\u88ab\u9a97\u201d\u611f\u3002\n2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u9ad8\u98ce\u9669**\u3002\u672c\u8eab\u7ecf\u6d4e\u62ee\u636e\uff0c\u5206\u671f\u4ed8\u6b3e\u4f1a\u6301\u7eed\u5e26\u6765\u538b\u529b\u3002\u4efb\u4f55\u751f\u6d3b\u7a81\u53d1\u5f00\u652f\u90fd\u53ef\u80fd\u5f15\u53d1\u6094\u5355\u548c\u9000\u8d39\u8bc9\u6c42\u3002\n3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a\u4e2d\u98ce\u9669\u3002\u867d\u76ee\u524d\u6709\u65f6\u95f4\uff0c\u4f46\u82e5\u672a\u6765\u56e0\u5de5\u4f5c/\u751f\u6d3b\u5bfc\u81f4\u5b66\u4e60\u4e2d\u65ad\uff0c\u53ef\u80fd\u5f52\u548e\u4e8e\u8bfe\u7a0b\u3002\n4.  **\u8bfe\u7a0b\u8d28\u91cf**\uff1a\u4e2d\u98ce\u9669\u3002\u82e5\u611f\u89c9\u8bfe\u7a0b\u5185\u5bb9\u4e0e\u8bad\u7ec3\u8425\u91cd\u590d\u6216\u201c\u4e0d\u503c\u8fd9\u4e2a\u4ef7\u201d\uff0c\u4f1a\u7ed3\u5408\u7ecf\u6d4e\u538b\u529b\u653e\u5927\u4e0d\u6ee1\u3002\n5.  **\u670d\u52a1\u611f\u77e5**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u6781\u5ea6\u770b\u91cd\u201c\u6301\u7eed\u6709\u4eba\u5e26\u201d\u3002\u82e5\u6b63\u5f0f\u8bfe\u52a9\u6559\u670d\u52a1\u4e0d\u5982\u9500\u552e\u8ddf\u8fdb\u7d27\u5bc6\uff0c\u6216\u611f\u89c9\u88ab\u201c\u653e\u517b\u201d\uff0c\u4f1a\u7acb\u523b\u89e6\u53d1\u670b\u53cb\u6848\u4f8b\u7684\u8d1f\u9762\u8054\u60f3\uff0c\u5bfc\u81f4\u5f3a\u70c8\u6295\u8bc9\u3002\n6.  **\u7ade\u54c1\u5bf9\u6bd4**\uff1a\u4e2d\u98ce\u9669\u3002\u670b\u53cb\u6848\u4f8b\uff08\u68a8\u82b1\uff09\u5df2\u5f62\u6210\u8d1f\u9762\u951a\u70b9\uff0c\u4f1a\u6301\u7eed\u5bf9\u6bd4\u3002\n7.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a\u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7ecf\u6d4e\u538b\u529b\u53ef\u80fd\u9690\u542b\u5bb6\u5ead\u77db\u76fe\u98ce\u9669\u3002\n\n**\u7efc\u5408\u9000\u8d39\u98ce\u9669\uff1a\u4e2d\u9ad8**\u3002\u98ce\u9669\u96c6\u4e2d\u5728**\u7ecf\u6d4e\u538b\u529b\u3001\u670d\u52a1\u843d\u5dee\u3001\u6548\u679c\u7126\u8651**\u4e09\u65b9\u9762\uff0c\u4e14\u76f8\u4e92\u53e0\u52a0\u3002\n\n---\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n\n*   **\u9500\u552e\u884c\u4e3a**\uff1a\n    *   **\u9ad8\u538b\u50ac\u5355**\uff1a\u5229\u7528\u201c\u7ed3\u8425\u201d\u3001\u201c\u540d\u989d\u4fdd\u7559\u201d\u3001\u201c\u6700\u540e\u4e00\u6b21\u79c1\u4fe1\u201d\u7b49\u8bdd\u672f\u5236\u9020\u7a00\u7f3a\u548c\u7d27\u8feb\u611f\uff0c\u7b26\u5408\u884c\u4e1a\u5e38\u89c1\u8f6c\u5316\u7b56\u7565\uff0c\u4f46\u9488\u5bf9\u7ecf\u6d4e\u56f0\u96be\u7528\u6237\u5b58\u5728\u4f26\u7406\u538b\u529b\u3002\n    *   **\u6536\u5165\u627f\u8bfa\u6697\u793a**\uff1a\u9891\u7e41\u5c55\u793a\u201c\u65f6\u85aa\u4e66\u5355\u201d\uff08120-300\u5143\uff09\u3001\u5e08\u5144\u5e08\u59d0\u6536\u5165\u6848\u4f8b\uff0c\u867d\u672a\u76f4\u63a5\u627f\u8bfa\uff0c\u4f46\u5f3a\u70c8\u6697\u793a\u201c\u5b66\u5b8c\u53ef\u63a5\u5355\u8d5a\u94b1\u201d\uff0c**\u5b58\u5728\u5938\u5927\u5ba3\u4f20\u98ce\u9669**\u3002\n    *   **\u201c\u5168\u7a0b\u5e26\u7740\u5b66\u201d\u627f\u8bfa**\uff1a\u9500\u552e\u591a\u6b21\u627f\u8bfa\u201c\u5168\u7a0b\u5e26\u7740\u4f60\u5b66\u201d\u3001\u201c\u624b\u628a\u624b\u5e26\u4f60\u201d\uff0c\u8fd9\u53ef\u80fd\u62ac\u9ad8\u7528\u6237\u5bf9\u540e\u7eed\u670d\u52a1\u7684\u9884\u671f\uff0c\u4e0e\u6b63\u5f0f\u8bfe\u5b9e\u9645\u670d\u52a1\u6807\u51c6\uff08\u975e1\u5bf91\u4e13\u5c5e\u5e26\u6559\uff09\u53ef\u80fd\u5b58\u5728\u843d\u5dee\uff0c**\u6613\u5f15\u53d1\u6295\u8bc9**\u3002\n*   **\u5408\u89c4\u6027**\uff1a\u672a\u53d1\u73b0\u660e\u663e\u8fdd\u89c4\u3002\u4f46\u9488\u5bf9T7\u7c7b\u578b\u7528\u6237\uff0c\u9500\u552e\u672a\u5145\u5206\u8bc4\u4f30\u5176\u7ecf\u6d4e\u627f\u53d7\u80fd\u529b\u4e0e\u98ce\u9669\uff0c**\u5b58\u5728\u8fc7\u5ea6\u9500\u552e\u503e\u5411**\u3002\n\n---\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n\n**\u6838\u5fc3\u7b56\u7565\uff1a\u9884\u9632\u4e3a\u4e3b\uff0c\u5f3a\u5316\u652f\u6301\uff0c\u7ba1\u7406\u9884\u671f\uff0c\u7d27\u76ef\u98ce\u9669\u3002**\n\n1.  **\u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357**\uff1a\n    *   **\u5f00\u8bfe\u521d\u7d27\u6025\u4ecb\u5165**\uff1a\u62a5\u540d\u540e\u7b2c\u4e00\u65f6\u95f4\u8054\u7cfb\uff0c**\u91cd\u70b9\u5f3a\u5316\u201c\u88ab\u652f\u6301\u611f\u201d**\u3002\u660e\u786e\u544a\u77e5\u73ed\u4e3b\u4efb\u3001\u52a9\u6559\u3001\u7ec3\u4e60\u5c0f\u7ec4\u7b49\u652f\u6301\u4f53\u7cfb\uff0c\u6253\u6d88\u5176\u201c\u5b66\u5b8c\u6ca1\u4eba\u5e26\u201d\u7684\u6050\u60e7\u3002\n    *   **\u5efa\u7acb\u9ad8\u9891\u3001\u6e29\u6696\u7684\u6c9f\u901a**\uff1a\u524d\u671f\u9700\u6bd4\u666e\u901a\u5b66\u5458\u66f4\u9ad8\u9891\u5730\u5173\u6ce8\u5176\u5b66\u4e60\u8fdb\u5ea6\u548c\u60c5\u7eea\uff0c\u53ca\u65f6\u89e3\u7b54\u7591\u95ee\uff0c\u8ba9\u5176\u611f\u89c9\u201c\u4e00\u76f4\u88ab\u5173\u6ce8\u201d\u3002\n    *   **\u52a1\u5b9e\u7ba1\u7406\u6536\u5165\u9884\u671f**\uff1a\u907f\u514d\u7a7a\u8c08\u9ad8\u6536\u5165\u3002\u5f15\u5bfc\u5176\u5173\u6ce8\u6280\u80fd\u63d0\u5347\uff0c\u5f3a\u8c03\u201c\u8bd5\u97f3-\u5f55\u7528\u201d\u7684\u7ade\u4e89\u6027\uff0c\u5206\u4eab\u666e\u901a\u5b66\u5458\u4ece\u57fa\u7840\u5355\u5f00\u59cb\u7684\u6210\u957f\u6848\u4f8b\uff0c**\u964d\u4f4e\u5176\u201c\u5feb\u901f\u66b4\u5bcc\u201d\u7684\u5e7b\u60f3**\u3002\n    *   **\u8d22\u52a1\u60c5\u51b5\u654f\u611f\u5173\u6ce8**\uff1a\u7559\u610f\u5176\u662f\u5426\u63d0\u53ca\u8fd8\u6b3e\u538b\u529b\u3001\u751f\u6d3b\u53d8\u6545\u7b49\u3002\u82e5\u51fa\u73b0\u5b66\u4e60\u61c8\u6020\uff0c\u9700\u4f18\u5148\u4ece\u201c\u662f\u5426\u9047\u5230\u7ecf\u6d4e\u56f0\u96be\u201d\u89d2\u5ea6\u5173\u6000\uff0c\u800c\u975e\u5355\u7eaf\u7763\u4fc3\u5b66\u4e60\u3002\n    *   **\u98ce\u9669\u9884\u8b66**\uff1a\u5c06\u5176\u6807\u8bb0\u4e3a**\u9ad8\u5173\u6000\u3001\u9ad8\u98ce\u9669\u7528\u6237**\u3002\u4efb\u4f55\u670d\u52a1\u758f\u6f0f\u6216\u6c9f\u901a\u5ef6\u8fdf\u90fd\u53ef\u80fd\u88ab\u5176\u653e\u5927\u3002\u6295\u8bc9\u82d7\u5934\u51fa\u73b0\u65f6\u9700\u7acb\u5373\u5347\u7ea7\u5904\u7406\u3002\n\n2.  **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**\uff1a\n    *   **\u5f53\u524d\u6302\u8f7d**\uff1a\u9ad8\u9636\u7cfb\u7edf\u8bfe\uff087380\u5143\uff09\u3002**\u5339\u914d\u5ea6\u4e2d\u4f4e**\u3002\u4ea7\u54c1\u4ef7\u683c\u4e0e\u5176\u7ecf\u6d4e\u80fd\u529b\u4e25\u91cd\u4e0d\u5339\u914d\uff0c\u662f\u4e3b\u8981\u98ce\u9669\u6e90\u3002\n    *   **\u7406\u60f3\u4ea7\u54c1**\uff1a**\u66f4\u4f4e\u5355\u4ef7\u3001\u5468\u671f\u66f4\u77ed\u3001\u4fa7\u91cd\u5b9e\u64cd\u548c\u5373\u65f6\u53cd\u9988\u7684\u5165\u95e8/\u8f7b\u91cf\u7ea7\u8bfe\u7a0b**\u3002\u5148\u5e2e\u52a9\u5176\u5efa\u7acb\u4fe1\u5fc3\u5e76\u83b7\u5f97\u5fae\u5c0f\u6b63\u53cd\u9988\uff08\u5982\u5b8c\u6210\u4e00\u4e2a\u5c0f\u4f5c\u54c1\uff09\uff0c\u518d\u5f15\u5bfc\u5347\u7ea7\u3002\u5bf9\u4e8eT7\u7528\u6237\uff0c**\u201c\u5c0f\u6b65\u5feb\u8dd1\u3001\u5373\u65f6\u53d8\u73b0\u201d\u7684\u4ea7\u54c1\u6a21\u578b\u66f4\u9002\u5408**\u3002\n    *   **\u8865\u6551\u5efa\u8bae**\uff1a\u9274\u4e8e\u5df2\u62a5\u540d\u9ad8\u9636\u8bfe\uff0c\u5e94**\u91cd\u70b9\u5411\u5176\u5c55\u793a\u8bfe\u7a0b\u4e2d\u201c\u5b9e\u6218\u201d\u3001\u201c\u8bd5\u97f3\u6307\u5bfc\u201d\u3001\u201c\u8d44\u6e90\u5bf9\u63a5\u201d\u7b49\u6a21\u5757\u7684\u4ef7\u503c**\uff0c\u5e76\u5c3d\u53ef\u80fd\u63d0\u524d\u63d0\u4f9b\u4e00\u4e9b\u4f4e\u95e8\u69db\u7684\u8bd5\u97f3\u6216\u7ec3\u4e60\u673a\u4f1a\uff0c\u8ba9\u5176\u5c3d\u5feb\u611f\u77e5\u5230\u201c\u6295\u5165\u6709\u6240\u503c\u201d\uff0c\u7a33\u4f4f\u5fc3\u6001\u3002\n\n{\"core_type\": \"T7 \u751f\u5b58\u7126\u8651\u578b\", \"risk_level\": \"\u4e2d\u9ad8\", \"refund_risk\": \"\u4e2d\u9ad8\", \"maslow_need\": \"\u751f\u5b58/\u5b89\u5168\", \"target_product_line\": \"\u5165\u95e8\u5b9e\u6218/\u8f7b\u91cf\u7ea7\u53d8\u73b0\u8bfe\u7a0b\uff08\u5f53\u524d\u9ad8\u9636\u8bfe\u98ce\u9669\u9ad8\uff09\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u5973\uff08\u4ece\u2018\u5e08\u59d0\u2019\u79f0\u547c\u53ca\u4e0a\u4e0b\u6587\u63a8\u65ad\uff09\", \"city\": \"\u672a\u77e5\"}";
