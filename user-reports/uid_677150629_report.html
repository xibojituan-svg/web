    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u4e0e\u98ce\u63a7\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u7f3a\u652f\u4ed8\u91d1\u989d\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u3001\u5177\u4f53\u804c\u4e1a\u4e0e\u6536\u5165\u3001\u8be6\u7ec6\u65f6\u95f4\u8d44\u6e90\u7b49\u4fe1\u606f\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a\u4e2d\u7b49\u3002\u660e\u786e\u8868\u793a\u201c\u517c\u804c\u201d\u53d8\u73b0\u76ee\u7684\uff0c\u5bf9AI\u5de5\u5177\u96f6\u57fa\u7840\u4f46\u6709\u5c1d\u8bd5\u610f\u613f\u3002\u4f5c\u4e1a\u5b8c\u6210\u5ea6\u597d\uff0c\u5bf9\u70b9\u8bc4\u6709\u79ef\u6781\u53cd\u9988\u3002\u4f46\u52a8\u673a\u4ecd\u505c\u7559\u5728\u201c\u8d5a\u5916\u5feb\u201d\u5c42\u9762\uff0c\u5bf9\u5b66\u4e60\u6295\u5165\u7684\u957f\u671f\u6027\u3001\u6280\u80fd\u6df1\u5ea6\u8981\u6c42\u8ba4\u77e5\u53ef\u80fd\u4e0d\u8db3\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4fe1\u606f\u4e25\u91cd\u4e0d\u8db3**\u3002\u5df2\u77e5\uff1a\u670d\u52a1\u4e1a\u4ece\u4e1a\u8005\uff0c\u5de5\u4f5c\u65f6\u95f4\u53ef\u80fd\u4e0d\u56fa\u5b9a\uff08\u201c\u4e5d\u70b9\u624d\u4e0b\u73ed\u201d\u3001\u201c\u6ca1\u5ba2\u4eba\u5c31\u770b\u201d\uff09\uff0c\u6709\u788e\u7247\u5316\u65f6\u95f4\u3002**\u5173\u952e\u7f3a\u5931**\uff1a\u7ecf\u6d4e\u652f\u4ed8\u80fd\u529b\u3001\u53ef\u7528\u4e8e\u5b66\u4e60\u7684\u7a33\u5b9a\u65f6\u95f4\u6bb5\u3001\u8bbe\u5907\u4e0e\u7f51\u7edc\u6761\u4ef6\u3001\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a\u4e2d\u7b49\u504f\u9ad8\u3002\u88ab\u8bef\u8e22\u51fa\u7fa4\u540e\u867d\u6709\u77ed\u6682\u8d1f\u9762\u60c5\u7eea\uff08\u201c\u65e0\u8bed\u201d\uff09\uff0c\u4f46\u80fd\u5feb\u901f\u7406\u89e3\u5e76\u81ea\u6211\u5316\u89e3\uff08\u201c\u770b\u4e86\u4e0b\u786e\u5b9e\u81ea\u52a8\u8e22\u4e86\u201d\uff09\u3002\u6c9f\u901a\u914d\u5408\u5ea6\u9ad8\uff0c\u80fd\u4e3b\u52a8\u5b8c\u6210\u4f5c\u4e1a\u5e76\u8bf7\u6c42\u53cd\u9988\uff0c\u5bf9\u9500\u552e\u5f15\u5bfc\u54cd\u5e94\u79ef\u6781\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40\uff08\u652f\u4ed8\u6838\u67e5\uff09**\uff1a\u5df2\u652f\u4ed8\u3002\u652f\u4ed8\u8fc7\u7a0b\u6709\u5c0f\u6ce2\u6298\uff08\u5fae\u4fe1\u8df3\u8f6c\u652f\u4ed8\u5b9d\u5931\u8d25\uff09\uff0c\u4f46\u7528\u6237\u81ea\u884c\u89e3\u51b3\uff0c\u672a\u8868\u73b0\u51fa\u652f\u4ed8\u56f0\u96be\u6216\u72b9\u8c6b\u3002\n*   **\u6b65\u9aa41.5\uff08\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5\uff09**\uff1a**\u4fe1\u606f\u7f3a\u5931**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u6216\u914d\u5076\u610f\u89c1\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u4e3a\u72ec\u7acb\u51b3\u7b56\u3002\n*   **\u6b65\u9aa41-4\uff08ABCD\u5224\u5b9a\uff09**\uff1a\n    *   **A\uff08\u652f\u4ed8\u80fd\u529b\u4e0e\u610f\u613f\uff09**\uff1a\u652f\u4ed8\u52a8\u4f5c\u5df2\u5b8c\u6210\uff0c\u610f\u613f\u660e\u786e\u3002\n    *   **B\uff08\u5b66\u4e60\u9002\u5e94\u6027\uff09**\uff1a\u4f5c\u4e1a\u5b8c\u6210\u8d28\u91cf\u83b7\u9500\u552e\u9ad8\u5ea6\u8bc4\u4ef7\uff08\u201c\u4f5c\u4e1a\u5b8c\u6210\u7684\u975e\u5e38\u597d\u201d\uff09\uff0c\u663e\u793a\u4e00\u5b9a\u7684\u5b66\u4e60\u6f5c\u529b\u548c\u6267\u884c\u529b\u3002\u65f6\u95f4\u788e\u7247\u5316\u662f\u6f5c\u5728\u6311\u6218\u3002\n    *   **C\uff08\u76ee\u6807\u5408\u7406\u6027\uff09**\uff1a\u76ee\u6807\uff08\u517c\u804c\u53d8\u73b0\uff09\u4e0e\u8bfe\u7a0b\u5ba3\u4f20\u5339\u914d\u3002\u4f46**\u9700\u8b66\u60d5\u53d8\u73b0\u9884\u671f\u7ba1\u7406**\uff0c\u9500\u552e\u5df2\u63d0\u53ca\u201c\u5546\u5355100-300\u201d\u3001\u201c\u5de5\u4f5c\u5ba4\u8d44\u6e90\u201d\uff0c\u53ef\u80fd\u62d4\u9ad8\u7528\u6237\u77ed\u671f\u6536\u5165\u9884\u671f\u3002\n    *   **D\uff08\u957f\u671f\u884c\u52a8\u529b\uff09**\uff1a\u521d\u6b65\u914d\u5408\u5ea6\u597d\uff0c\u4f46\u957f\u671f\u575a\u6301\u5ea6\u5f85\u89c2\u5bdf\u3002\u670d\u52a1\u4e1a\u5de5\u4f5c\u53ef\u80fd\u5f71\u54cd\u6301\u7eed\u6295\u5165\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**\uff1a**B-\u578b\uff08\u652f\u4ed8\u5df2\u8fbe\u6210\uff0c\u5b66\u4e60\u9002\u5e94\u6027\u521d\u663e\uff0c\u4f46\u8d44\u6e90\u5e95\u5ea7\u4e0e\u957f\u671f\u884c\u52a8\u529b\u5b58\u7591\uff09**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**\uff1a**T4 \u52a1\u5b9e\u63a2\u7d22\u8005**\u3002\n    *   \u7279\u5f81\uff1a\u76ee\u6807\u660e\u786e\uff08\u517c\u804c\uff09\uff0c\u884c\u52a8\u529b\u5c1a\u53ef\uff08\u5b8c\u6210\u4f5c\u4e1a\uff09\uff0c\u5bf9\u5b9e\u7528\u6280\u80fd\uff08AI\u7ed8\u56fe\u3001\u89c6\u9891\uff09\u6709\u63a2\u7d22\u5174\u8da3\uff0c\u6613\u88ab\u201c\u8d44\u6e90\u201d\u3001\u201c\u5546\u5355\u201d\u7b49\u627f\u8bfa\u5438\u5f15\u3002\n    *   \u504f\u5dee\uff1a\u5fc3\u7406\u5f39\u6027\u7565\u9ad8\u4e8e\u5178\u578bT4\uff08\u88ab\u8e22\u7fa4\u540e\u53cd\u5e94\u76f8\u5bf9\u5e73\u548c\uff09\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u98ce\u9669\u7b49\u7ea7**\uff1a**\u4e2d**\u3002\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u6838\u5fc3\u8bc9\u6c42\u662f\u517c\u804c\u53d8\u73b0\u3002\u82e5\u8bfe\u7a0b\u7ed3\u675f\u540e\u63a5\u5355\u56f0\u96be\u6216\u6536\u5165\u8fdc\u4f4e\u4e8e\u9500\u552e\u6697\u793a\uff08100-300\u5143/\u5355\uff09\uff0c\u6781\u6613\u5f15\u53d1\u6295\u8bc9\u3002\n    2.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5de5\u4f5c\u65f6\u95f4\u665a\uff089\u70b9\u4e0b\u73ed\uff09\uff0c\u4e14\u65f6\u95f4\u788e\u7247\u5316\u3002\u82e5\u8bfe\u7a0b\u8981\u6c42\u9ad8\u5f3a\u5ea6\u7684\u8fde\u7eed\u5b66\u4e60\u6216\u56fa\u5b9a\u65f6\u95f4\u76f4\u64ad\uff0c\u53ef\u80fd\u96be\u4ee5\u575a\u6301\u3002\n    3.  **\u5185\u5bb9/\u670d\u52a1\u4e0d\u7b26**\uff1a\u4f4e\u98ce\u9669\u3002\u76ee\u524d\u8bfe\u7a0b\u5185\u5bb9\u4e0e\u5ba3\u4f20\u57fa\u672c\u4e00\u81f4\uff0c\u7528\u6237\u53cd\u9988\u79ef\u6781\u3002\n    4.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u9700\u6838\u67e5**\u3002\u672a\u77e5\u652f\u4ed8\u91d1\u989d\u5360\u5176\u6536\u5165\u6bd4\u91cd\u3002\n    5.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u9700\u6838\u67e5**\u3002\n    6.  **\u4f53\u9a8c\u4e0d\u4f73**\uff1a\u4f4e\u98ce\u9669\u3002\u867d\u6709\u7fa4\u7ba1\u7406\u5c0f\u63d2\u66f2\uff0c\u4f46\u5df2\u59a5\u5584\u89e3\u51b3\uff0c\u7528\u6237\u672a\u6301\u7eed\u4e0d\u6ee1\u3002\n    7.  **\u7ade\u54c1/\u66ff\u4ee3\u65b9\u6848**\uff1a\u4f4e\u98ce\u9669\u3002\u7528\u6237\u4e3a\u96f6\u57fa\u7840\uff0c\u6682\u65e0\u5176\u4ed6\u65b9\u6848\u63d0\u53ca\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5408\u89c4\u70b9**\uff1a\u9500\u552e\u6d41\u7a0b\u5b8c\u6574\uff0c\u6709\u8bfe\u524d\u5f15\u5bfc\u3001\u4f5c\u4e1a\u70b9\u8bc4\u3001\u8bfe\u7a0b\u9884\u544a\u3002\n*   **\u98ce\u9669\u70b9**\uff1a\n    *   **\u8fc7\u5ea6\u627f\u8bfa\u98ce\u9669**\uff1a\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u5546\u5355\u53d8\u73b0\u201d\u3001\u201c\u5de5\u4f5c\u5ba4\u8d44\u6e90\u201d\u3001\u201c\u5b98\u65b9\u8d44\u6e90\u6276\u6301\u201d\u3001\u201c\u4e00\u5343\u591a\u4e07\u90e8\u7684\u6709\u58f0\u4e13\u8f91\u8981\u66f4\u6362\u5c01\u9762\u201d\uff0c**\u53ef\u80fd\u8425\u9020\u201c\u5b66\u5b8c\u5373\u80fd\u8f7b\u677e\u63a5\u5355\u201d\u7684\u865a\u5047\u7e41\u8363\u9884\u671f**\u3002\n    *   **\u5236\u9020\u7a00\u7f3a\u4e0e\u7d27\u8feb\u611f**\uff1a\u201c\u9501\u5b9a\u540d\u989d\u62a2\u8d2d\u4f18\u60e0\u5238\u201d\u3001\u201c\u63d0\u524d\u8fdb\u5165\u65b0\u624b\u6751\u201d\u3001\u201c\u660e\u65e5\u62bd\u5956\u201d\uff0c\u5c5e\u4e8e\u5e38\u89c4\u8425\u9500\u624b\u6bb5\uff0c\u672a\u53d1\u73b0\u660e\u663e\u8fdd\u89c4\u3002\n    *   **\u4fe1\u606f\u6838\u67e5\u7f3a\u5931**\uff1a\u9500\u552e\u672a\u8be2\u95ee\u7528\u6237\u7ecf\u6d4e\u72b6\u51b5\u3001\u5bb6\u5ead\u60c5\u51b5\u3001\u6bcf\u65e5\u53ef\u56fa\u5b9a\u5b66\u4e60\u65f6\u957f\u7b49\u5173\u952e\u98ce\u63a7\u4fe1\u606f\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**\uff1a**\u5339\u914d**\u3002\u7528\u6237\u201c\u517c\u804c\u53d8\u73b0\u201d\u76ee\u6807\u4e0eAI\u77ed\u89c6\u9891\u6280\u80fd\u53d8\u73b0\u8bfe\u7a0b\u8868\u9762\u5339\u914d\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**\u9996\u5468\u91cd\u70b9\u6821\u6b63\u53d8\u73b0\u9884\u671f\uff0c\u6838\u67e5\u65f6\u95f4\u8d44\u6e90**\u3002\n*   **\u8be6\u7ec6\u884c\u52a8\u5efa\u8bae**\uff1a\n    1.  **\u9884\u671f\u7ba1\u7406**\uff1a\u9996\u6b21\u6c9f\u901a\u5fc5\u987b\u660e\u786e\u5f3a\u8c03\u6280\u80fd\u638c\u63e1\u4e0e\u5e02\u573a\u63a5\u5355\u4e4b\u95f4\u7684\u5dee\u8ddd\uff0c\u7528\u6848\u4f8b\u8bf4\u660e\u53d8\u73b0\u5468\u671f\u548c\u6536\u5165\u7684\u4e0d\u786e\u5b9a\u6027\uff0c\u964d\u4f4e\u5176\u201c\u5feb\u901f\u8d5a\u5916\u5feb\u201d\u7684\u5e7b\u60f3\u3002\n    2.  **\u65f6\u95f4\u89c4\u5212**\uff1a\u7acb\u5373\u4e86\u89e3\u5176\u6bcf\u65e5/\u6bcf\u5468\u53ef\u6295\u5165\u5b66\u4e60\u7684**\u56fa\u5b9a\u3001\u6574\u5757\u65f6\u95f4**\uff0c\u534f\u52a9\u5236\u5b9a\u5207\u5b9e\u53ef\u884c\u7684\u5b66\u4e60\u8ba1\u5212\uff0c\u8bc4\u4f30\u5176\u8ddf\u8bfe\u53ef\u884c\u6027\u3002\n    3.  **\u5bb6\u5ead\u77e5\u60c5\u786e\u8ba4**\uff1a\u59d4\u5a49\u8be2\u95ee\u8bfe\u7a0b\u8d2d\u4e70\u662f\u5426\u4e3a\u4e2a\u4eba\u72ec\u7acb\u51b3\u7b56\uff0c\u662f\u5426\u5df2\u544a\u77e5\u5bb6\u4eba\u3002\n    4.  **\u6301\u7eed\u5173\u6ce8**\uff1a\u524d\u671f\u9ad8\u9891\u8ddf\u8fdb\uff0c\u786e\u4fdd\u5176\u8ddf\u4e0a\u8bfe\u7a0b\u8282\u594f\uff0c\u53ca\u65f6\u89e3\u51b3\u56e0\u65f6\u95f4\u788e\u7247\u5316\u5bfc\u81f4\u7684\u5b66\u4e60\u65ad\u5c42\u95ee\u9898\u3002\n    5.  **\u98ce\u9669\u6807\u8bb0**\uff1a\u5728\u7cfb\u7edf\u4e2d\u6807\u8bb0\u4e3a\u201c**\u53d8\u73b0\u9884\u671f\u8fc7\u9ad8**\u201d\u4e0e\u201c**\u65f6\u95f4\u8d44\u6e90\u7d27\u5f20**\u201d\uff0c\u540e\u7eed\u670d\u52a1\u4fa7\u91cd\u6280\u80fd\u638c\u63e1\u800c\u975e\u63a5\u5355\u9f13\u5439\u3002\n\n{\"core_type\": \"T4 \u52a1\u5b9e\u63a2\u7d22\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u9996\u5468\u6821\u6b63\u53d8\u73b0\u9884\u671f\u5e76\u6838\u67e5\u65f6\u95f4\"}";
