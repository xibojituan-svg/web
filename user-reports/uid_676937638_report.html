        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u6d41\u5fc3\u7cd6 (UID: 676937638) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-02-15 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e-\u51af\u6587\u857e / \u73ed\u4e3b\u4efb-\u51b0\u7f8e\u5f0f(\u5f20\u54f2\u8c6a) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u9ad8\u9636\u7cfb\u7edf\u8bfe (\u4ef7\u683c\uff1a7380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3** (\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u5de5\u5382\u5012\u73ed\u5236\uff0c\u5e38\u52a0\u73ed\uff0c\u65f6\u95f4\u4e0d\u7a33\u5b9a) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3** (\u672a\u63d0\u53ca\u5bb6\u5ead\u6001\u5ea6) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** (\u5173\u952e\u652f\u4ed8\u3001\u5bb6\u5ead\u3001\u804c\u4e1a\u80cc\u666f\u4fe1\u606f\u7f3a\u5931) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u6709\u660e\u786e\u7684\u53d8\u73b0\u671f\u5f85\uff08\u201c\u6211\u8981\u505a\u4e3b\u64ad\u201d\uff09\uff0c\u4f46\u540c\u65f6\u4e5f\u8868\u73b0\u51fa\u5bf9\u6280\u80fd\u63d0\u5347\u548c\u793e\u7fa4\u53c2\u4e0e\u7684\u5174\u8da3\uff0c\u52a8\u673a\u4e2d\u6df7\u6742\u4e86\u804c\u4e1a\u53d1\u5c55\u3001\u5174\u8da3\u63a2\u7d22\u548c\u793e\u4ea4\u9700\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u8981\u505a\u4e 8\u80fd\u7406\u6027\u6c9f\u901a\uff0c\u672a\u89c1\u60c5\u7eea\u5316\u62b1\u6028\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8c22\u8c22\u5e08\u59d0\u7684\u70b9\u8bc4\uff0c\u6211\u4e00\u4f1a\u6309\u7167\u70b9\u8bc4\u91cd\u65b0\u5f55\u4e00\u6bb5\u201d (2026-02-16 07:37:25) > \u201c\u6211\u4e5f\u662f\uff0c\u56e0\u4e3a\u603b\u52a0\u73ed[\u6342\u8138]\u6240\u4ee5\u5c31\u5f88\u7ea0\u7ed3\u201d (2026-04-07 12:35:20)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u5f52\u5c5e\u4e0e\u5c0a\u91cd ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5728\u91cd\u590d\u6027\u3001\u4e0d\u81ea\u7531\u7684\u5de5\u5382\u5de5\u4f5c\u4e2d\uff0c\u7f3a\u4e4f\u4ef7\u503c\u8ba4\u540c\u548c\u5f52\u5c5e\u611f\u3002** \u5979\u6e34\u671b\u901a\u8fc7\u6709\u58f0\u6f14\u64ad\u83b7\u5f97\u65b0\u7684\u793e\u4f1a\u8eab\u4efd\uff08\u4e3b\u64ad\uff09\u3001\u6280\u80fd\u8ba4\u53ef\uff08\u540c\u5b66\u5938\u5956\u201c\u64ad\u5f97\u5f88\u591a\uff0c\u5f88\u81ea\u7136\u201d\uff09\u548c\u9ad8\u8d28\u91cf\u7684\u793e\u7fa4\u8fde\u63a5\uff08\u79ef\u6781\u606d\u559c\u540c\u5b66\u3001\u5bfb\u6c42\u7ec4\u961f\uff09\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u201d\u7684\u6210\u5c31\u611f\u548c\u5728\u4e13\u4e1a\u5708\u5c42\u5185\u7684\u8eab\u4efd\u8ba4\u540c\u3002** \u8ba9\u5979\u611f\u5230\u81ea\u5df1\u4e0d\u4ec5\u662f\u6d41\u6c34\u7ebf\u5de5\u4eba\uff0c\u66f4\u662f\u4e00\u4e2a\u6709\u6f5c\u529b\u3001\u88ab\u540c\u4f34\u9700\u8981\u7684\u6709\u58f0\u521b\u4f5c\u8005\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1** \u7c7b (\u52a8\u673a\u4e2d\u7b49\u3001\u8d44\u6e90\u5e95\u5ea7\u4f4e\u4f46\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u6709\u5b66\u4e60\u610f\u613f\u4f46\u73b0\u5b9e\u7ea6\u675f\u5f3a) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T3 \u6b7b\u78d5\u5b66\u9738\u578b** (\u5177\u5907\u9ad8\u5fc3\u7406\u5f39\u6027\uff0c\u79ef\u6781\u5b8c\u6210\u4f5c\u4e1a\u3001\u4e3b\u52a8\u5bfb\u6c42\u53cd\u9988\u3001\u5728\u793e\u7fa4\u4e2d\u4e92\u52a9\uff0c\u5b66\u4e60\u884c\u4e3a\u7b26\u5408\u201c\u5b66\u9738\u201d\u7279\u8d28\uff0c\u5c3d\u7ba1\u53d7\u9650\u4e8e\u65f6\u95f4\u548c\u7ecf\u6d4e\u6761\u4ef6) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u6625\u8282\u671f\u95f4\u63d0\u53ca\u5bb6\u4eba\u591a\u5f71\u54cd\u5f55\u97f3\uff0c\u9700\u5173\u6ce8\u5bb6\u5ead\u662f\u5426\u652f\u6301\u5176\u957f\u671f\u6295\u5165\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u5de5\u5382\u5012\u73ed\u548c\u9891\u7e41\u52a0\u73ed\u5bfc\u81f4\u65e0\u6cd5\u6309\u65f6\u8ddf\u76f4\u64ad\u3001\u5b8c\u6210\u4f5c\u4e1a\uff0c\u4ea7\u751f\u6301\u7eed\u79ef\u538b\u548c\u81ea\u8d23\uff0c\u6700\u7ec8\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u7834\u9632\u98ce\u9669\u4f4e\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u5bf9\u53d8\u73b0\u62b1\u6709\u671f\u5f85\uff08\u201c\u6211\u8981\u505a\u4e3b\u64ad\u201d\uff09\uff0c\u82e5\u5b66\u4e60\u4e2d\u671f\u53d1\u73b0\u63a5\u5355\u95e8\u69db\u9ad8\u6216\u65f6\u95f4\u65e0\u6cd5\u5339\u914d\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c3-4\u5468**\u3002\u5c4a\u65f6\u8bfe\u7a0b\u96be\u5ea6\u548c\u4f5c\u4e1a\u91cf\u589e\u52a0\uff0c\u4e0e\u4e0d\u7a33\u5b9a\u7684\u5de5\u4f5c\u65f6\u95f4\u51b2\u7a81\u52a0\u5267\uff0c\u5bb9\u6613\u4ea7\u751f\u201c\u6211\u6839\u672c\u8ddf\u4e0d\u4e0a\u201d\u7684\u65e0\u529b\u611f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u7cd6\u7cd6\uff0c\u770b\u5230\u4f60\u8bad\u7ec3\u8425\u91cc\u90a3\u4e48\u79ef\u6781\uff0c\u4f5c\u4e1a\u4e5f\u5b8c\u6210\u5f97\u7279\u522b\u8ba4\u771f\uff0c\u771f\u7684\u4e3a\u4f60\u9ad8\u5174\uff01\u6211\u77e5\u9053\u54b1\u4eec\u4e0a\u73ed\u65f6\u95f4\u4e0d\u56fa\u5b9a\uff0c\u7279\u522b\u8f9b\u82e6\u3002**\u54b1\u4eec\u7684\u7cfb\u7edf\u8bfe\u8bbe\u8ba1\u5c31\u662f\u4e3a\u2018\u65f6\u95f4\u6218\u58eb\u2019\u51c6\u5907\u7684\uff0c\u76f4\u64ad\u6709\u56de\u653e\uff0c\u4f5c\u4e1a\u63d0\u4ea4\u7a97\u53e3\u671f\u4e5f\u957f\uff0c\u4f60\u5b8c\u5168\u53ef\u4ee5\u6839\u636e\u81ea\u5df1\u7684\u8282\u594f\u6765\u3002** \u522b\u6015\u843d\u4e0b\uff0c\u6709\u4efb\u4f55\u65f6\u95f4\u51b2\u7a81\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u8c03\u6574\u8ba1\u5212\u3002\u4f60\u7684\u575a\u6301\u548c\u8ba4\u771f\uff0c\u6bd4\u51c6\u65f6\u66f4\u91cd\u8981\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72+\u5174\u8da3\u793e\u4ea4\u7ebf**\u3011\u3002\u6ee1\u8db3\u5176\u63d0\u5347\u6280\u80fd\uff08\u786c\u6838\uff09\u548c\u83b7\u5f97\u793e\u7fa4\u5f52\u5c5e\u611f\uff08\u793e\u4ea4\uff09\u7684\u53cc\u91cd\u9700\u6c42\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\u7279\u70b9\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010**\u5f02\u6b65\u5b66\u4e60\u652f\u6301\u5305**\u3011\uff08\u5982\uff1a\u7cbe\u534e\u5f55\u64ad\u5207\u7247\u3001\u6587\u5b57\u7248\u8981\u70b9\u3001\u5f39\u6027\u4f5c\u4e1a\u6279\u6539\u901a\u9053\uff09\u3002\u9488\u5bf9\u5176\u7ecf\u6d4e\u60c5\u51b5\uff0c\u8c28\u614e\u63a8\u8350\u3010**\u8bbe\u5907\u79df\u8d41\u6216\u5206\u671f\u652f\u6301**\u3011\u4fe1\u606f\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u522b\u4eba\u90fd\u80fd\u8ddf\u4e0a\u4f60\u4e3a\u4ec0\u4e48\u4e0d\u884c\u201d\u6765\u65bd\u538b\uff1b\u5728\u5979\u56e0\u52a0\u73ed\u65e0\u6cd5\u53c2\u4e0e\u76f4\u64ad\u65f6\uff0c\u8868\u73b0\u51fa\u4e0d\u8010\u70e6\u6216\u4ec5\u673a\u68b0\u53d1\u9001\u56de\u653e\u94fe\u63a5\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u77ed\u671f\u5185\u8fdb\u884c\u5927\u989d\u5347\u5355\uff08\u5982\u9ad8\u4ef7\u540e\u671f\u8bfe\uff09**\u3002\u53ef\u57fa\u4e8e\u5176\u5b9e\u9645\u5b66\u4e60\u8fdb\u5ea6\u548c\u63a5\u5355\u610f\u5411\uff0c\u5728\u8bfe\u7a0b\u4e2d\u540e\u671f\u914c\u60c5\u63a8\u8350500\u5143\u4ee5\u5185\u7684\u5fae\u8bfe\u6216\u5de5\u5177\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u54ce\u5440\uff0c\u597d\u5f00\u5fc3\u597d\u6fc0\u52a8\u5440\uff0c\u5e08\u59d0\u901a\u8fc7\u4e86\uff0c\u6211\u521a\u624d\u8fd8\u5728\u62c5\u5fc3\u5462\uff0c\u6211\u6015\u6211\u4e0d\u884c\uff0c\u54ce\u5440\uff0c\u6211\u73b0\u5728\u6709\u70b9\u6fc0\u52a8...\u201d (2026-02-16 10:57:13) \u2014 **\u3010\u6e34\u671b\u8ba4\u53ef\u4e0e\u5f52\u5c5e\u3011**\n2. > \u201c\u6211\u662f\u7ea0\u7ed3\u4e70\u8bbe\u5907\u8fd8\u662f\u62a5\u540e\u671f\uff0c\u672c\u6765\u6512\u7684\u662f\u8bbe\u5907\u94b1\uff0c\u73b0\u5728\u53c8\u6765\u4e2a\u540e\u671f\uff0c\u4e5f\u60f3\u6293\uff0c\u54ce[\u53f9\u6c14]\u5934\u75bc\u201d (2026-04-07 12:33:42) \u2014 **\u3010\u8d44\u6e90\u6709\u9650\u4e0b\u7684\u7ea0\u7ed3\u3011**\n3. > \u201c\u6211\u4e5f\u662f\uff0c\u56e0\u4e3a\u603b\u52a0\u73ed[\u6342\u8138]\u6240\u4ee5\u5c31\u5f88\u7ea0\u7ed3\u201d (2026-04-07 12:35:20) \u2014 **\u3010\u6838\u5fc3\u969c\u788d\uff1a\u65f6\u95f4\u3011**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T3\u6b7b\u78d5\u5b66\u9738\u578b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u793e\u4ea4\u5f52\u5c5e\u4e0e\u5c0a\u91cd\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u81f4\u7684\u5f02\u6b65\u5b66\u4e60\u652f\u6301\u548c\u5f39\u6027\u65f6\u95f4\u7ba1\u7406\u65b9\u6848\uff0c\u7edd\u4e0d\u7528\u540c\u6b65\u5b66\u4e60\u8981\u6c42\u65bd\u538b\u3011**\u3002\n\n```json\n{\"core_type\": \"T3 \u6b7b\u78d5\u5b66\u9738\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u793e\u4ea4\u5f52\u5c5e\u4e0e\u5c0a\u91cd\", \"target_product_line\": \"\u786c
