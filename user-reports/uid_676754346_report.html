    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a676754346\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a676754346 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u7eb8\u7cca\u7684\u6bcd\u8001\u864e~\u5b98\u65b9\u52a9\u6559(\u6e38\u8302)\u3001\u77b3\u77b3(\u8c37\u6d77\u9759) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u5199\u4f5c\u7cfb\u7edf\u8bfe\uff08\u4ef7\u683c\u672a\u660e\u793a\uff0c\u63d0\u53ca\u4f18\u60e0\u5238\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u672a\u63d0\u53ca** |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u5df2\u62a5\u540d\u6709\u58f0\u8fdb\u9636\u8bfe\u548c\u8fd0\u8425\u8bfe\uff0c\u611f\u89c9\u201c\u624b\u5fd9\u811a\u4e71\u201d\u3001\u201c\u6765\u4e0d\u53ca\u201d\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u672a\u63d0\u53ca** |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\uff08\u6709\u660e\u786e\u5b66\u4e60\u80cc\u666f\u548c\u89c4\u5212\uff0c\u4f46\u7f3a\u4e4f\u652f\u4ed8\u3001\u5bb6\u5ead\u7b49\u5173\u952e\u4fe1\u606f\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34(\u4e2d)**\u3002\u6709\u660e\u786e\u7684\u517c\u804c\u53d8\u73b0\u8bc9\u6c42\uff08\u201c\u5e0c\u671b\u80fd\u5c3d\u5feb\u53d8\u73b0\u201d\uff09\uff0c\u4f46\u52a8\u673a\u4e2d\u6df7\u6742\u4e86\u5bf9\u6280\u80fd\u6574\u5408\uff08\u201c\u81ea\u5df1\u5199\u672c\u81ea\u5df1\u64ad\u201d\uff09\u7684\u63a2\u7d22\u548c\u73b0\u6709\u5b66\u4e60\u538b\u529b\u7684\u7126\u8651\uff0c\u5e76\u975e\u7eaf\u7cb9\u7684\u201c\u51e0\u5929\u5185\u63d0\u73b0\u201d\u7684\u6781\u7aef\u529f\u5229\u8005\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u4e5f\u5f88\u60f3\u5b66\uff0c\u5e0c\u671b\u80fd\u5c3d\u5feb\u53d8\u73b0\uff0c\u6709\u58f0\u6295\u5165\u4e00\u4e07\u591a\u4e86\uff0c\u90fd\u6ca1\u770b\u5230\u5e0c\u671b\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u5df2\u4e3a\u6709\u58f0\u8bfe\u7a0b\u6295\u5165\u4e00\u4e07\u591a\uff0c\u8868\u660e\u6709\u4e00\u5b9a\u4ed8\u8d39\u80fd\u529b\u548c\u5b66\u4e60\u6295\u8d44\u610f\u613f\uff0c\u4f46\u672a\u900f\u9732\u5f53\u524d\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e (3-4\u5206)** \u2014 **\u6838\u5fc3\u77ed\u677f**\u3002\u660e\u786e\u8868\u793a\u201c\u624b\u5934\u6709\u8bfe\u201d\u3001\u201c\u6392\u5f97\u86ee\u6ee1\u7684\u201d\u3001\u201c\u611f\u89c9\u6765\u4e0d\u53ca\u554a\u201d\u3001\u201c\u624b\u5fd9\u811a\u4e71\u201d\uff0c\u663e\u793a\u65f6\u95f4\u88ab\u591a\u4e2a\u8bfe\u7a0b\u6324\u5360\uff0c\u7cbe\u529b\u9ad8\u5ea6\u5206\u6563\uff0c\u5b58\u5728**\u65f6\u95f4\u67af\u7aed\u98ce\u9669**\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b07\u4f4e (3-4\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u5728\u524d\u671f\u6295\u5165\uff08\u6709\u58f0\u8bfe\uff09\u672a\u8fbe\u9884\u671f\u540e\uff0c\u8868\u73b0\u51fa\u660e\u663e\u7684\u632b\u8d25\u611f\u548c\u5bf9\u201c\u5e0c\u671b\u201d\u7684\u6e34\u6c42\uff08\u201c\u90fd\u6ca1\u770b\u5230\u5e0c\u671b\u201d\uff09\u3002\u9762\u5bf9\u65b0\u8bfe\u7a0b\uff08\u5199\u4f5c\uff09\u7684\u52a0\u5165\uff0c\u7b2c\u4e00\u53cd\u5e94\u662f\u201c\u624b\u5fd9\u811a\u4e71\u201d\u3001\u201c\u4e00\u5934\u96fe\u6c34\u201d\uff0c\u663e\u793a\u51fa\u5bf9\u5b66\u4e60\u538b\u529b\u7684**\u4f4e\u627f\u53d7\u80fd\u529b\u548c\u9ad8\u5ea6\u7126\u8651**\uff0c\u9700\u8981\u5916\u90e8\u660e\u786e\u7684\u8def\u5f84\u6307\u5f15\u548c\u60c5\u7eea\u5b89\u629a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u73ed\u73ed\u554a\uff0c\u6211\u611f\u89c9\u6709\u70b9\u624b\u5fd9\u811a\u4e71\u7684\u4e86\u3002\u4f60\u6559\u6211\u4eec\u90aa\u4fee\u7684\u5199\u4f5c\u6587\u7ae0\uff0c\u6211\u5982\u4f55\u786e\u5b9a\u80fd\u4e0a\u624b\u64ad\u5462\uff1f\u8def\u5f84\u662f\u5565\uff1f\u6211\u7684\u5b9a\u4f4d\u65b9\u5411\u5e94\u8be5\u662f\u54ea\u91cc\uff1f\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u524d\u671f\u6295\u8d44\uff08\u6709\u58f0\u8bfe\uff09\u5931\u8d25\u7684\u6050\u60e7\u548c\u5bf9\u672a\u6765\u5b66\u4e60\u8def\u5f84\u7684\u8ff7\u832b**\u3002\u5979\u6295\u5165\u4e86\u91d1\u94b1\u548c\u65f6\u95f4\uff0c\u4f46\u201c\u6ca1\u770b\u5230\u5e0c\u671b\u201d\uff0c\u4ea7\u751f\u4e86\u5f3a\u70c8\u7684\u201c\u6c89\u6ca1\u6210\u672c\u201d\u7126\u8651\u548c\u201c\u518d\u6b21\u9009\u9519\u201d\u7684\u6050\u614c\u3002\u5979\u9700\u8981\u7684\u662f\u4e00\u4e2a\u80fd\u5e26\u6765\u786e\u5b9a\u6027\u548c\u5b89\u5168\u611f\u7684\u201c\u6210\u529f\u8def\u5f84\u201d\u627f\u8bfa\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u8def\u5f84\u6e05\u6670\u201d\u7684\u5b89\u5168\u611f\u4e0e\u201c\u8fd9\u6b21\u9009\u5bf9\u4e86\u201d\u7684\u786e\u5b9a\u6027**\u3002\u9700\u8981\u5c06\u5979\u4ece\u201c\u591a\u5934\u5b66\u4e60\u3001\u624b\u5fd9\u811a\u4e71\u201d\u7684\u7126\u8651\u4e2d\u89e3\u6551\u51fa\u6765\uff0c\u63d0\u4f9b\u4e00\u4e2a\u6e05\u6670\u3001\u53ef\u6267\u884c\u3001\u4e14\u80fd\u4e0e\u5df2\u6709\u6295\u5165\uff08\u6709\u58f0\uff09\u4ea7\u751f\u534f\u540c\u6548\u5e94\u7684\u5b66\u4e60\u84dd\u56fe\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b**\uff08\u98ce\u9669\u7ba1\u63a7\u578b\uff09 |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b**\uff08\u4e25\u91cd\u5185\u8017\uff09 |\n\n**\u5224\u5b9a\u6811\u8def\u5f84\u63a8\u6f14**\uff1a\n1.  **\u524d\u7f6e\u9694\u7206\u7b5b**\uff1a\u672a\u89e6\u53d1T0\uff08\u6f5c\u4f0f\u730e\u624b\uff09\u6216T8-D\uff08\u7edd\u8def\u8d4c\u5f92\uff09\u4fe1\u53f7\u3002\n2.  **\u4ea4\u6613\u4fe1\u53f7\u786c\u62e6\u622a\u5c42**\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4ed8\u6b3e\u65b9\u5f0f\u6216\u65f6\u957f\u3002\n3.  **\u4e09\u8f74\u8bc4\u5206**\uff1a\u52a8\u673a\u7eaf\u5ea6(5-6\u5206\uff0c\u4e2d)\u3001\u8d44\u6e90\u5e95\u5ea7(\u65f6\u95f4\u77ed\u677f\u5bfc\u81f4\u7efc\u5408\u8bc4\u52063-4\u5206\uff0c\u4f4e)\u3001\u5fc3\u7406\u5f39\u6027(3-4\u5206\uff0c\u4f4e)\u3002\n4.  **\u5224\u5b9a\u6811\u5206\u6d41**\uff1a\u52a8\u673a\u22655\u5206\uff0c\u8fdb\u5165**\u4e2d\u9ad8\u52a8\u673a\u7cbe\u5206**\u3002\u5fc3\u7406\u5f39\u6027\u22644\u5206\uff0c\u8fdb\u5165**\u4f4e\u5f39\u6027\u901a\u9053**\u3002\u7528\u6237\u8868\u73b0\u51fa\u201c\u624b\u5fd9\u811a\u4e71\u201d\u3001\u201c\u4e00\u5934\u96fe\u6c34\u201d\u3001\u201c\u6ca1\u770b\u5230\u5e0c\u671b\u201d\u7b49**\u81ea\u5351\u4e0e\u7126\u8651\u4fe1\u53f7**\uff0c\u4e14\u672a\u663e\u793a\u6280\u672f\u8ffd\u95ee\u6df1\u5ea6\u3002\u7b26\u5408 **T6 \u60c5\u7eea\u5de8\u5a74** \u7684\u5224\u5b9a\u6761\u4ef6\u3002\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5c5e\u53cd\u5bf9\u7b49\u6781\u7aef\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u9700\u8b66\u60d5\u56e0\u65f6\u95f4\u88ab\u8bfe\u7a0b\u6324\u5360\u5f15\u53d1\u7684\u5bb6\u5ead\u77db\u76fe\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u73b0\u6709\u8bfe\u7a0b\u5df2\u8ba9\u5176\u201c\u624b\u5fd9\u811a\u4e71\u201d\uff0c\u53e0\u52a0\u65b0\u8bfe\u7a0b\u540e\u6781\u6613\u56e0\u65f6\u95f4\u7cbe\u529b\u4e0d\u6d4e\u5bfc\u81f4\u4f5c\u4e1a\u79ef\u538b\u3001\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\uff0c\u4ea7\u751f\u201c\u5b66\u4e0d\u8fc7\u6765\u201d\u7684\u5d29\u6e83\u611f\uff0c\u8fdb\u800c\u9000\u8d39\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u9ad8** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u5bf9\u201c\u8def\u5f84\u201d\u548c\u201c\u7ed3\u679c\u201d\u6709\u6781\u9ad8\u4f9d\u8d56\u3002\u4e00\u65e6\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u9047\u5230\u632b\u6298\uff08\u5982\u7a3f\u4ef6\u88ab\u62d2\u3001AI\u4f7f\u7528\u4e0d\u987a\uff09\uff0c\u6216\u53d1\u73b0\u53d8\u73b0\u901f\u5ea6\u4e0d\u5982\u9500\u552e\u627f\u8bfa\uff0c\u4f1a\u8fc5\u901f\u8054\u60f3\u5230\u201c\u6709\u58f0\u8bfe\u6ca1\u5e0c\u671b\u201d\u7684\u7ecf\u5386\uff0c\u4ea7\u751f\u201c\u8fd9\u6b21\u53c8\u4e0a\u5f53\u4e86\u201d\u7684\u81ea\u6211\u5426\u5b9a\uff0c\u89e6\u53d1\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u82e5\u77ed\u671f\u5185\uff08\u59821-2\u4e2a\u6708\uff09\u672a\u83b7\u5f97\u4efb\u4f55\u5f62\u5f0f\u7684\u6b63\u53cd\u9988\uff08\u5982\u8fc7\u7a3f\u3001\u54ea\u6015\u662f\u5c0f\u989d\u6536\u76ca\uff09\uff0c\u4f1a\u52a0\u5267\u5176\u7126\u8651\u548c\u5931\u671b\u60c5\u7eea\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\u3002\u6b64\u65f6\u5b66\u4e60\u538b\u529b\u8fbe\u5230\u5cf0\u503c\uff0c\u82e5\u4f5c\u4e1a\u65e0\u6cd5\u6309\u65f6\u5b8c\u6210\u6216\u7b2c\u4e00\u6b21\u6295\u7a3f\u5c1d\u8bd5\u5931\u8d25\uff0c\u5c06\u76f4\u63a5\u5f15\u7206\u201c\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u201d\u548c\u201c\u8106\u5f31\u7834\u9632\u201d\u53cc\u91cd\u98ce\u9669\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5b9d\u5b50\uff0c\u770b\u5230\u4f60\u8bf4\u4e4b\u524d\u6709\u58f0\u8bfe\u6295\u5165\u4e86\u5f88\u591a\u7cbe\u529b\uff0c\u7279\u522b\u7406\u89e3\u4f60\u73b0\u5728\u2018\u624b\u5fd9\u811a\u4e71\u2019\u7684\u611f\u89c9\u3002\u522b\u62c5\u5fc3\uff0c\u54b1\u4eec\u5199\u4f5c\u8bfe\u4e0d\u548c\u4f60\u7684\u5176\u4ed6\u8bfe\u7a0b\u62a2\u65f6\u95f4\uff0c\u6211\u4eec\u7684\u6838\u5fc3\u662f\u5e2e\u4f60**\u6253\u901a\u2018\u5199\u2019\u548c\u2018\u64ad\u2019\u7684\u4efb\u7763\u4e8c\u8109**\uff0c\u8ba9\u4f60\u4e4b\u524d\u7684\u6295\u5165\u4e0d\u518d\u767d\u8d39\u3002\u6211\u4f1a\u7ed9\u4f60\u89c4\u5212\u4e00\u4e2a\u6700\u7701\u529b\u7684\u5b66\u4e60\u8def\u5f84\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u8fd9\u6b21\u80af\u5b9a\u80fd\u770b\u5230\u5e0c\u671b\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011**\uff08\u9700\u7ed3\u5408**\u9884\u671f\u7ba1\u7406**\uff09\u3002\u5fc5\u987b\u660e\u786e\u544a\u77e5\u63a5\u5355\u9700\u8981\u7684\u57fa\u7840\u7ec3\u4e60\u5468\u671f\uff0c\u4f46\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u8fbe\u6210\u7684\u5c0f\u76ee\u6807\u91cc\u7a0b\u7891\uff08\u5982\uff1a\u7b2c\u4e00\u5468\u5b8c\u6210\u4e00\u7bc7\u5b8c\u6574\u6545\u4e8b\u6846\u67b6\uff09\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T6\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\uff08\u6ee1\u914dC\u6a21\u5757\uff09\u3002\u5305\u62ec\uff1a\u2460 **\u50bb\u74dc\u7248A\u6a21\u5757**\uff1a\u5c06\u590d\u6742\u64cd\u4f5c\u62c6\u89e3\u4e3a\u201c\u6309\u952e\u7ea7\u201d\u6307\u4ee4\u3002\u2461 **\u6ee1\u914d\u7279\u79cdC\u6a21\u5757**\uff1a\u73ed\u4e3b\u4efb\u9700\u9ad8\u9891\uff08\u81f3\u5c11\u9694\u5929\u4e00\u6b21\uff09\u8fdb\u884c1v1\u60c5\u7eea\u6258\u5e95\uff0c\u7ed9\u4e88\u6781\u5938\u5f20\u7684\u8d5e\u7f8e\u548c\u201c\u4f60\u80fd\u884c\u201d\u7684\u80af\u5b9a\uff0c\u62ff\u8d70\u5176\u5173\u4e8e\u201c\u8def\u5f84\u201d\u548c\u201c\u65b9\u5411\u201d\u7684\u96be\u9898\u3002\u2462 **\u7cbe\u786e\u6d3e\u5355\u62e6\u622aB\u6a21\u5757**\uff1a\u4ec5\u5728\u5176\u5b8c\u6210\u57fa\u7840\u7ec3\u4e60\u540e\uff0c\u63d0\u4f9b\u95e8\u69db\u6781\u4f4e\u7684\u5185\u90e8\u5546\u5355\uff08\u5982\u9519\u522b\u5b57\u4fee\u6539\uff09\u5efa\u7acb\u9996\u6b21\u6210\u529f\u4f53\u9a8c\uff0c**\u4e25\u63a7\u5176\u201c\u5feb\u901f\u66b4\u5bcc\u201d\u7684\u9884\u671f**\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u2460 \u7528\u201c\u5b66\u5b8c\u7acb\u523b\u6708\u5165\u8fc7\u4e07\u201d\u7b49\u8bdd\u672f\u523a\u6fc0\u5176\u7126\u8651\u3002\u2461 \u5728\u5176\u62b1\u6028\u201c\u5fd9\u4e0d\u8fc7\u6765\u201d\u65f6\uff0c\u4ecd\u50ac\u4fc3\u4f5c\u4e1a\u6216\u63a8\u9500\u65b0\u8bfe\u3002\u2462 \u7528\u51b0\u51b7\u7684\u6280\u672f\u6807\u51c6\u5426\u5b9a\u5176\u521d\u671f\u4f5c\u54c1\uff0c\u5fc5\u987b\u5148\u627e\u4eae\u70b9\u5938\u8d5e\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u57fa\u7840\u8bfe\u6d88\u5316\u5b8c\u6bd5\u524d\u8fdb\u884c\u4efb\u4f55\u5347\u5355\u6216\u4ea4\u53c9\u63a8\u9500**\u3002\u5fc5\u987b\u6267\u884c **\u3010\u6218\u7565\u6027\u62d2\u5356\u7194\u65ad\u3011**\uff0c\u4e3b\u52a8\u4e3a\u5176\u505a\u51cf\u6cd5\uff0c\u544a\u77e5\u201c\u5148\u4e13\u6ce8\u6253\u901a\u5199\u4f5c\u53d8\u73b0\uff0c\u540e\u671f\u8bfe\u7b49\u4f60\u51c6\u5907\u597d\u4e86\u518d\u8bf4\u201d\uff0c\u4ee5\u6b64\u5efa\u7acb\u6781\u81f4\u4fe1\u4efb\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u73b0\u5728\u624b\u5934\u6709\u8bfe\uff0c\u7b49\u6709\u58f0\u8fdb\u9636\u4e0a\u5b8c\u8fd8\u6709\u8fd0\u8425\u8bfe\u8981\u4e0a...\u611f\u89c9\u6765\u4e0d\u53ca\u554a\u201d \n2. > \u201c\u73ed\u73ed\u554a\uff0c\u6211\u611f\u89c9\u6709\u70b9\u624b\u5fd9\u811a\u4e71\u7684\u4e86\u3002\u4f60\u6559\u6211\u4eec\u90aa\u4fee\u7684\u5199\u4f5c\u6587\u7ae0\uff0c\u6211\u5982\u4f55\u786e\u5b9a\u80fd\u4e0a\u624b\u64ad\u5462\uff1f\u8def\u5f84\u662f\u5565\uff1f\u6211\u7684\u5b9a\u4f4d\u65b9\u5411\u5e94\u8be5\u662f\u54ea\u91cc\uff1f\u201d\n3. > \u201c\u6211\u4e5f\u5f88\u60f3\u5b66\uff0c\u5e0c\u671b\u80fd\u5c3d\u5feb\u53d8\u73b0\uff0c\u6709\u58f0\u6295\u5165\u4e00\u4e07\u591a\u4e86\uff0c\u90fd\u6ca1\u770b\u5230\u5e0c\u671b\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u9700\u6c42\u2014\u2014\u5bf9\u786e\u5b9a\u6027\u548c\u6295\u8d44\u56de\u62a5\u7684\u7126\u8651\u4fdd\u969c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u6ee1\u914d\u60c5\u7eea\u6258\u5e95\uff08C\u6a21\u5757\uff09+ \u50bb\u74dc\u5f0f\u8def\u5f84\u6307\u5f15\uff08A\u6a21\u5757\uff09+ \u4e25\u683c\u7684\u77ed\u671f\u9884\u671f\u7ba1\u7406\u3011**\u3002**\u52a1\u5fc5\u8b66\u60d5\u5176\u56e0\u65f6\u95f4\u67af\u7aed\u548c\u591a\u8bfe\u7a0b\u538b\u529b\u5bfc\u81f4\u7684\u201c\u5b66\u4e0d\u8fc7\u6765\u201d\u5d29\u6e83\u3002**\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf\uff08\u9700\u642d\u914d\u7597\u6108\u966a\u5b66\u5305\uff09\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}\n```";
