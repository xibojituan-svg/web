    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a (UID: 85198361)\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u7f3a\u4e4f\u4e0e\u9500\u552e\u76f4\u63a5\u5173\u4e8e\u8bfe\u7a0b\u4ef7\u503c\u3001\u5b66\u4e60\u76ee\u6807\u3001\u652f\u4ed8\u80fd\u529b\u3001\u5bb6\u5ead\u51b3\u7b56\u7b49\u5173\u952e\u6c9f\u901a\u4fe1\u606f\uff0c\u73b0\u6709\u8bb0\u5f55\u4e3b\u8981\u4e3a\u5b66\u5458\u5728\u793e\u7fa4\u5185\u7684\u793e\u4ea4\u4e92\u52a8\u3002\n\n---\n\n### 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u4f4e)**: \u793e\u4ea4\u4e0e\u4f53\u9a8c\u9a71\u52a8\u3002\u804a\u5929\u8bb0\u5f55\u663e\u793a\u7528\u6237\u9ad8\u5ea6\u6d3b\u8dc3\u4e8e\u793e\u7fa4\uff0c\u70ed\u8877\u4e8e\u7ebf\u4e0b\u805a\u4f1a\u3001\u793e\u4ea4\u4e92\u52a8\uff08\u7ea6\u996d\u3001\u8e29\u70b9\u3001\u5f00\u73a9\u7b11\uff09\uff0c\u5bf9\u4e0e\u660e\u661f\u5bfc\u5e08\uff08\u5f20\u9707\uff09\u7684\u4e92\u52a8\u611f\u5230\u5174\u594b\u3002**\u5b66\u4e60\u52a8\u673a\u4e0e\u793e\u4ea4\u3001\u5a31\u4e50\u3001\u8ffd\u661f\u4f53\u9a8c\u9ad8\u5ea6\u7ed1\u5b9a**\uff0c\u5bf9\u8bfe\u7a0b\u6838\u5fc3\u6280\u80fd\u63d0\u5347\u7684\u6e34\u671b\u8868\u8fbe\u6a21\u7cca\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u9ad8)**: \u7ecf\u6d4e\u4e0e\u65f6\u95f4\u5bbd\u88d5\u3002\u81ea\u8ff055\u5c81\u5df2\u9000\u4f11\uff0c\u6709\u517b\u9a6c\uff08\u201c\u6211\u5bb6\u9a6c\u53ebCapricorn\u201d\uff09\u3001\u56fd\u5185\u5916\u65c5\u884c\uff08\u4e39\u9ea6\u9a91\u9a6c\uff09\u3001\u9891\u7e41\u5916\u51fa\u5c31\u9910\u7b49\u6d88\u8d39\u884c\u4e3a\uff0c\u663e\u793a**\u7ecf\u6d4e\u72b6\u51b5\u826f\u597d\uff0c\u65f6\u95f4\u81ea\u7531**\u3002\u80fd\u81ea\u4e3b\u652f\u4ed8\u8bfe\u7a0b\u8d39\u7528\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u9ad8)**: \u5fc3\u6001\u5f00\u653e\u677e\u5f1b\u3002\u53d1\u8a00\u98ce\u683c\u5e7d\u9ed8\u3001\u4e3b\u52a8\u6d3b\u8dc3\uff0c\u662f\u793e\u7fa4\u7684\u201c\u6c14\u6c1b\u7ec4\u201d\u3002\u5bf9\u5b66\u4e60\u8fdb\u5ea6\u6301\u8f7b\u677e\u6001\u5ea6\uff08\u201c\u8ddf\u4e0d\u4e0a\u5c31\u8ddf\u4e0d\u4e0a\uff0c\u6162\u6162\u8ddf\u5457\u201d\uff09\uff0c**\u65e0\u660e\u663e\u7126\u8651\u6216\u538b\u529b\u8868\u73b0\uff0c\u793e\u4ea4\u9002\u5e94\u6027\u6781\u5f3a**\u3002\n\n### 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: \u5df2\u652f\u4ed8\u3002\u7528\u6237\u4e3b\u52a8\u8be2\u95ee\u201c\u6211\u548b\u4ea4\u94b1\uff1f\u201d\uff0c\u5e76\u5b8c\u6210\u586b\u8868\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u6210\u5458\uff0c\u51b3\u7b56\u8fc7\u7a0b\u72ec\u7acb\uff0c\u4f46\u65e0\u6cd5\u786e\u8ba4\u5bb6\u5ead\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u7eaf\u5ea6 (B\u7c7b: \u793e\u4ea4/\u4f53\u9a8c\u9a71\u52a8)**: \u52a8\u673a\u504f\u5411\u793e\u4ea4\u4f53\u9a8c\u4e0e\u8ffd\u661f\uff0c\u800c\u975e\u660e\u786e\u7684\u6280\u80fd\u63d0\u5347\u6216\u804c\u4e1a\u8f6c\u578b\u3002\n*   **\u6b65\u9aa42 - \u8d44\u6e90\u5e95\u5ea7 (A\u7c7b: \u8d44\u6e90\u5145\u8db3)**: \u7ecf\u6d4e\u4e0e\u65f6\u95f4\u8d44\u6e90\u5747\u5145\u8db3\u3002\n*   **\u6b65\u9aa43 - \u5fc3\u7406\u5f39\u6027 (A\u7c7b: \u9ad8\u5f39\u6027)**: \u5fc3\u6001\u79ef\u6781\uff0c\u6297\u538b\u80fd\u529b\u5f3a\uff0c\u793e\u4ea4\u878d\u5165\u5ea6\u9ad8\u3002\n*   **\u7efc\u5408\u5224\u5b9a**: **BAA\u578b\u7528\u6237**\u3002\u8d44\u6e90\u4e0e\u5fc3\u6001\u4ff1\u4f73\uff0c\u4f46\u6838\u5fc3\u5b66\u4e60\u52a8\u673a\u4e0d\u7eaf\uff0c\u5b58\u5728\u504f\u79fb\u98ce\u9669\u3002\n\n### 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b: T4 \u793e\u4ea4\u4f53\u9a8c\u5bb6**\u3002\u6838\u5fc3\u7279\u5f81\uff1a\u5c06\u5b66\u4e60\u89c6\u4e3a\u9ad8\u54c1\u8d28\u793e\u4ea4\u4e0e\u5708\u5c42\u4f53\u9a8c\u7684\u9014\u5f84\uff0c\u8ffd\u6c42\u8fc7\u7a0b\u4e2d\u7684\u4e50\u8da3\u3001\u4eba\u8109\u548c\u8eab\u4efd\u8ba4\u540c\u611f\uff0c\u5bf9\u786c\u6027\u5b66\u4e60\u6210\u679c\u548c\u6280\u80fd\u53d8\u73b0\u9884\u671f\u6a21\u7cca\u3002\n\n### 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u98ce\u9669\u7b49\u7ea7\uff1a\u4e2d)\n\u9010\u9879\u6392\u67e57\u79cd\u9000\u8d39\u6839\u56e0\uff1a\n1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f (\u9ad8\u98ce\u9669)**: **\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u7528\u6237\u5bf9\u201c\u4e0e\u5f20\u9707\u3001\u59dc\u5e7f\u6d9b\u5f55\u4e66\u201d\u7b49\u5149\u73af\u4f53\u9a8c\u671f\u5f85\u6781\u9ad8\uff0c\u82e5\u540e\u7eed\u8bfe\u7a0b\u6838\u5fc3\u5185\u5bb9\u4e0e\u9876\u7ea7\u8d44\u6e90\u94fe\u63a5\u4e0d\u7b26\uff0c\u6613\u4ea7\u751f\u201c\u4e0d\u503c\u201d\u611f\u3002\n2.  **\u7ecf\u6d4e\u538b\u529b (\u4f4e\u98ce\u9669)**: \u7ecf\u6d4e\u72b6\u51b5\u826f\u597d\uff0c\u81ea\u4e3b\u652f\u4ed8\uff0c\u98ce\u9669\u4f4e\u3002\n3.  **\u65f6\u95f4\u51b2\u7a81 (\u4f4e\u98ce\u9669)**: \u5df2\u9000\u4f11\uff0c\u65f6\u95f4\u81ea\u7531\u3002\n4.  **\u5185\u5bb9\u4e0d\u5339\u914d (\u4e2d\u98ce\u9669)**: \u7528\u6237\u4e3a\u6709\u58f0\u4e66\u4e3b\u64ad\uff08\u201c\u5929\u5929\u5f55\u201d\u3001\u201c\u62d6\u4e86\u5267\u7ec4\u8fdb\u5ea6\u201d\uff09\uff0c\u8bfe\u7a0b\u5185\u5bb9\u5339\u914d\u3002\u4f46\u52a8\u673a\u504f\u5411\u793e\u4ea4\uff0c\u53ef\u80fd\u5bf9\u6df1\u5ea6\u8bad\u7ec3\u5185\u5bb9\u6295\u5165\u4e0d\u8db3\u3002\n5.  **\u670d\u52a1\u4f53\u9a8c\u5dee (\u4e2d\u98ce\u9669)**: \u9ad8\u5ea6\u4f9d\u8d56\u793e\u7fa4\u6c1b\u56f4\u548c\u7ebf\u4e0b\u4f53\u9a8c\u3002\u82e5\u73ed\u7ea7\u7ba1\u7406\u6216\u793e\u4ea4\u4f53\u9a8c\u4e0d\u4f73\uff0c\u53ef\u80fd\u5f71\u54cd\u6ee1\u610f\u5ea6\u3002\n6.  **\u5bb6\u5ead\u53cd\u5bf9 (\u4fe1\u606f\u4e0d\u8db3)**: \u672a\u63d0\u53ca\uff0c\u9700\u6838\u67e5\u3002\n7.  **\u7ade\u54c1/\u8d1f\u9762\u4fe1\u606f (\u4f4e\u98ce\u9669)**: \u7528\u6237\u5df2\u6df1\u5ea6\u878d\u5165\u5f53\u524d\u793e\u7fa4\uff0c\u5e76\u8ba1\u5212\u7eed\u62a5\u8fd0\u8425\u8bfe\uff0c\u77ed\u671f\u5185\u88ab\u7ade\u54c1\u64ac\u52a8\u98ce\u9669\u4f4e\u3002\n\n### 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u98ce\u9669\u70b9**: \u9500\u552e\u8bb0\u5f55\u7f3a\u5931\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u5b58\u5728**\u8fc7\u5ea6\u627f\u8bfa\u9876\u7ea7\u8d44\u6e90\uff08\u5982\u4e0e\u9876\u6d41\u914d\u97f3\u6f14\u5458\u5408\u4f5c\u5f55\u4e66\uff09** \u4ee5\u4fc3\u6210\u7b7e\u5355\u7684\u884c\u4e3a\u3002\u7528\u6237\u8bed\u97f3\u4e2d\u63d0\u53ca\u201c\u6bd5\u4e1a\u4e4b\u540e\u8ddf\u5f20\u9707\u5927\u5927\u4f1a\u4e00\u8d77\uff0c\u8fd8\u6709\u59dc\u5e7f\u6d9b\u4e00\u8d77\u5f55\u4e00\u672c\u4e66\u201d\uff0c**\u6b64\u627f\u8bfa\u82e5\u6765\u81ea\u9500\u552e\uff0c\u5219\u5c5e\u91cd\u5927\u5408\u89c4\u98ce\u9669**\u3002\n*   **\u7ed3\u8bba**: **\u9500\u552e\u73af\u8282\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931\uff0c\u5b58\u5728\u5408\u89c4\u76f2\u533a**\u3002\u9700\u91cd\u70b9\u56de\u6eaf\u9500\u552e\u6c9f\u901a\u8bb0\u5f55\uff0c\u6838\u67e5\u662f\u5426\u5b58\u5728\u4e0d\u5b9e\u627f\u8bfa\u3002\n\n### 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**: **\u504f\u5dee**\u3002\u7528\u6237\u8d44\u6e90\u4e0e\u8bfe\u7a0b\u5339\u914d\uff0c\u4f46\u6df1\u5c42\u52a8\u673a\uff08\u793e\u4ea4\u4f53\u9a8c\uff09\u4e0e\u4ea7\u54c1\u6838\u5fc3\u4ef7\u503c\uff08\u6280\u80fd\u63d0\u5347\uff09\u5b58\u5728\u504f\u5dee\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **\u9996\u5468\u951a\u5b9a\u8bfe\u7a0b\u6838\u5fc3\u4ef7\u503c\uff0c\u7ba1\u7406\u5149\u73af\u9884\u671f**\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**:\n    1.  **\u9884\u671f\u7ba1\u7406**: \u5f00\u8425\u9996\u5468\uff0c\u9700\u4e00\u5bf9\u4e00\u660e\u786e\u544a\u77e5\u8bfe\u7a0b\u6838\u5fc3\u662f\u201c\u6280\u80fd\u8bad\u7ec3\u4e0e\u4e2a\u4eba\u6210\u957f\u201d\uff0c\u660e\u661f\u4e92\u52a8\u662f\u989d\u5916\u798f\u5229\u800c\u975e\u4fdd\u8bc1\uff0c**\u964d\u4f4e\u5176\u5bf9\u201c\u4e0e\u9876\u6d41\u5408\u4f5c\u201d\u7684\u4e0d\u5207\u5b9e\u9645\u671f\u5f85**\u3002\n    2.  **\u4ef7\u503c\u5f15\u5bfc**: \u5c06\u5176\u793e\u4ea4\u80fd\u91cf\u5f15\u5bfc\u81f3\u5b66\u4e60\u7814\u8ba8\u3001\u4f5c\u4e1a\u4e92\u52a9\u3001\u7ec3\u4e60\u642d\u6863\u7b49\u65b9\u5411\uff0c\u8f6c\u5316\u4e3a\u5b66\u4e60\u52a9\u529b\u3002\n    3.  **\u98ce\u9669\u6838\u67e5**: \u6e29\u548c\u8be2\u95ee\u8bfe\u7a0b\u62a5\u540d\u662f\u5426\u4e0e\u5bb6\u4eba\u5546\u91cf\u8fc7\uff0c\u786e\u4fdd\u5bb6\u5ead\u77e5\u60c5\u3002\n    4.  **\u670d\u52a1\u5f3a\u5316**: \u4fdd\u969c\u7ebf\u4e0b\u6d3b\u52a8\u4f53\u9a8c\uff0c\u7ef4\u62a4\u79ef\u6781\u7684\u793e\u7fa4\u6c1b\u56f4\uff0c\u6ee1\u8db3\u5176\u793e\u4ea4\u9700\u6c42\u3002\n    5.  **\u7eed\u62a5\u94fa\u57ab**: \u7528\u6237\u5df2\u8868\u8fbe\u7eed\u62a5\u8fd0\u8425\u8bfe\u610f\u5411\uff08\u201c\u62a5\u5c0f\u767d\u5e08\u5144\u7684\u8fd0\u8425\u8bfe\u201d\uff09\uff0c\u53ef\u987a\u52bf\u63d0\u4f9b\u6e05\u6670\u8def\u5f84\uff0c\u5c06\u5176\u4f53\u9a8c\u9700\u6c42\u8f6c\u5316\u4e3a\u957f\u671f\u5b66\u4e60\u65c5\u7a0b\u3002\n\n{\"core_type\": \"T4 \u793e\u4ea4\u4f53\u9a8c\u5bb6\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u9996\u5468\u951a\u5b9a\u8bfe\u7a0b\u6838\u5fc3\u4ef7\u503c\uff0c\u7ba1\u7406\u5149\u73af\u9884\u671f\"}";
