    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4ee5\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\u7684\u8eab\u4efd\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677159136 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6843\u5341\u516d(\u4ed8\u5b9d\u5a1f) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u4ef7\u683c\u672a\u660e\u786e\uff0c\u4f46\u63d0\u53ca\u201c7380\u201d\u5143\u652f\u4ed8\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u4ec5\u663e\u793a\u652f\u4ed8\u884c\u4e3a\uff0c\u672a\u63d0\u53ca\u8d44\u91d1\u6765\u6e90\u3002\u9700\u8b66\u60d5\u662f\u5426\u5b58\u5728\u5206\u671f\u6216\u501f\u8d37\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u63d0\u53ca\u201c\u5de5\u4f5c\u65e5\u7684\u65f6\u95f4\u8fd8\u662f\u633a\u65b9\u4fbf\u201d\uff0c\u8868\u660e\u6709\u56fa\u5b9a\u5de5\u4f5c\u65f6\u95f4\uff0c\u4f46\u5177\u4f53\u65f6\u957f\u548c\u788e\u7247\u5316\u7a0b\u5ea6\u672a\u77e5\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u5b66\u4e60\u4e92\u52a8\u79ef\u6781\uff0c\u4f46\u5173\u952e\u80cc\u666f\u4fe1\u606f\uff08\u65f6\u95f4\u3001\u8d44\u91d1\u3001\u5bb6\u5ead\uff09\u7f3a\u5931\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e\uff0c\u4f46\u4f34\u6709\u5bf9\u6280\u80fd\u6210\u957f\u7684\u5174\u8da3**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u6211\u8981\u5f55\u4e66\u201d\u3001\u201c\u90fd\u60f3\u505a\u201d\uff0c\u5bf9\u53d8\u73b0\u6e20\u9053\uff08\u5f55\u4e66\u3001\u753b\u672c\u5bf9\u8f68\uff09\u8868\u73b0\u51fa\u6d53\u539a\u5174\u8da3\u3002\u540c\u65f6\uff0c\u4e5f\u8ba4\u771f\u542c\u53d6\u6280\u672f\u70b9\u8bc4\u5e76\u5c1d\u8bd5\u6539\u8fdb\uff0c\u8868\u660e\u6709\u5b66\u4e60\u610f\u613f\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u4e5f\u60f3\u73b0\u9636\u6bb5\u591a\u63a5\u89e6\u4e00\u4e9b\uff0c\u8fd9\u6837\u53ef\u80fd\u80fd\u6210\u957f\u7684\u5feb\u4e9b\u201d\uff1b> \u201c\u5bf9\uff0c\u6211\u4e5f\u662f\u8fd9\u6837\u8003\u8651\u7684\uff0c\u6211\u73b0\u5728\u5de5\u4f5c\u65e5\u7684\u65f6\u95f4\u8fd8\u662f\u633a\u65b9\u4fbf\u505a\u8fd9\u4e9b\u5de5\u4f5c\u7684\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u5df2\u652f\u4ed87380\u5143\u8bfe\u7a0b\u8d39\u7528\uff0c\u672a\u8868\u73b0\u51fa\u7ecf\u6d4e\u538b\u529b\uff0c\u4f46\u8d44\u91d1\u6765\u6e90\u4e0d\u660e\uff0c\u9700\u8b66\u60d5\u501f\u8d37\u53ef\u80fd\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u81ea\u79f0\u5de5\u4f5c\u65e5\u65f6\u95f4\u65b9\u4fbf\uff0c\u80fd\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u548c\u53c2\u4e0e\u76f4\u64ad\uff0c\u8868\u660e\u6709\u89c4\u5f8b\u7684\u5b66\u4e60\u65f6\u95f4\uff0c\u4f46\u975e\u5168\u5929\u5019\u81ea\u7531\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\uff0c\u4f46\u7528\u6237\u67097\u5c81\u5973\u513f\uff08\u201c\u628a\u6211\u4e03\u5c81\u7684\u5c0f\u5973\u513f\u9017\u5f97\u5927\u7b11\u4e0d\u6b62\u201d\uff09\uff0c\u53ef\u80fd\u4e3a\u5b9d\u5988\uff0c\u9700\u5173\u6ce8\u5bb6\u5ead\u65f6\u95f4\u5206\u914d\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8 (7-8\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u6280\u672f\u95ee\u9898\uff08\u5f55\u97f3\u7a0b\u5e8f\u8df3\u51fa\uff09\u80fd\u81ea\u884c\u5c1d\u8bd5\u89e3\u51b3\uff08\u5f55\u4e86\u4e24\u6b21\uff09\uff0c\u5e76\u4e3b\u52a8\u3001\u6e05\u6670\u5730\u63cf\u8ff0\u95ee\u9898\u5bfb\u6c42\u5e2e\u52a9\u3002\u63a5\u53d7\u4e13\u4e1a\u70b9\u8bc4\u540e\uff0c\u80fd\u81ea\u4fe1\u5730\u7ed9\u51fa\u5bf9\u6bd4\u53cd\u9988\uff0c\u5fc3\u6001\u79ef\u6781\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u521a\u624d\u5f55\u4e86\u4e24\u6b21\u548b\u90fd\u76f4\u63a5\u8df3\u51fa\u6765\u4e86\u201d\uff1b> \u201c\u4f60\u521a\u624d\u7ed9\u6211\u7684\u65c1\u767d\u4f5c\u4e1a\u70b9\u8bc4\u6211\u6536\u5230\u4e86...\u6211\u89c9\u5f97\u6211\u6bd4\u4ed6\u5f3a\u3002\u611f\u89c9\u8fd9\u4e2a\u5973\u97f3\u8fc7\u4e8e\u5e73\uff0c\u6ca1\u6709\u91cd\u70b9\uff0c\u4e5f\u6ca1\u6709\u611f\u60c5\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 (Esteem Needs)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u65b0\u6280\u80fd\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u793e\u4f1a\u5c0a\u91cd**\u3002\u5979\u4e0d\u4ec5\u60f3\u8d5a\u94b1\uff0c\u66f4\u5728\u610f\u81ea\u5df1\u7684\u8868\u73b0\u662f\u5426\u201c\u4e13\u4e1a\u201d\u3001\u201c\u6709\u611f\u67d3\u529b\u201d\uff0c\u5e76\u4e50\u4e8e\u4e0e\u201c\u5e08\u59d0\u201d\u7684\u6210\u529f\u6848\u4f8b\u8fdb\u884c\u6bd4\u8f83\uff0c\u5bfb\u6c42\u201c\u6211\u4e5f\u80fd\u884c\u201d\u7684\u8bc1\u660e\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u201c\u88ab\u9009\u4e2d\u201d\u7684\u4f18\u8d8a\u611f**\u3002\u63d0\u4f9b\u5177\u4f53\u7684\u3001\u6709\u6df1\u5ea6\u7684\u6280\u672f\u6307\u5bfc\uff08\u5982\u5bf9\u8c61\u611f\u3001\u8bb2\u8ff0\u611f\uff09\uff0c\u5e76\u8d4b\u4e88\u5176\u201c\u6211\u7684\u4eba\uff0c\u4e0d\u7f3a\u8d44\u6e90\u201d\u7684\u5708\u5c42\u5f52\u5c5e\u611f\u548c\u88ab\u91cd\u89c6\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u6709\u5411T1-A\u6216\u6df7\u5408\u4f533\u53f7\u8fdb\u5316\u7684\u6f5c\u529b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n**\u3010\u5224\u5b9a\u6811\u63a8\u6f14\u3011**\uff1a\n1.  **\u4ea4\u6613\u4fe1\u53f7\u6838\u67e5**\uff1a\u652f\u4ed8\u91d1\u989d7380\u5143\uff0c\u4f46**\u652f\u4ed8\u65b9\u5f0f\u4e0e\u8017\u65f6\u672a\u77e5**\uff0c\u65e0\u6cd5\u6267\u884cC2\u88c5B\u7c7b\u786c\u62e6\u622a\u3002\u9700\u540e\u7eed\u8865\u5145\u6838\u67e5\u3002\n2.  **\u4e09\u8f74\u8bc4\u5206**\uff1a\u52a8\u673a\u7eaf\u5ea6(5-6\u5206)\uff0c\u8d44\u6e90\u5e95\u5ea7(5-6\u5206)\uff0c\u5fc3\u7406\u5f39\u6027(7-8\u5206)\u3002\n3.  **\u5224\u5b9a\u6811\u8def\u5f84**\uff1a\u52a8\u673a\u22655\u5206\uff0c\u5f39\u6027\u22657\u5206\uff0c\u8fdb\u5165**\u9ad8\u5f39\u6027\u901a\u9053**\u3002\u7528\u6237\u672a\u8868\u73b0\u51fa\u4e3b\u52a8\u7edf\u7b79\u884c\u4e3a\uff08T1\uff09\u6216\u6df1\u5ea6\u6280\u672f\u8ffd\u95ee\uff08T3\uff09\uff0c\u4e5f\u672a\u8868\u73b0\u51fa\u9ad8\u9891\u975e\u5b66\u4e60\u793e\u4ea4\uff08T7\uff09\u3002\u6839\u636e\u5224\u5b9a\u6811\u515c\u5e95\u903b\u8f91\uff0c**\u5224\u5b9a\u4e3aT2\u4f4e\u8c03\u8001\u9ec4\u725b**\u3002\u5176\u6309\u65f6\u5b8c\u6210\u4efb\u52a1\u3001\u79ef\u6781\u53cd\u9988\u3001\u5bfb\u6c42\u6210\u957f\u7684\u884c\u4e3a\u5b8c\u5168\u7b26\u5408T2\u7279\u5f81\u3002\n4.  **\u52a8\u6001\u8fc1\u79fb\u76d1\u63a7**\uff1a\u7528\u6237\u8868\u73b0\u51fa\u201c\u60f3\u591a\u63a5\u89e6\u3001\u6210\u957f\u5feb\u201d\u7684\u8fdb\u53d6\u5fc3\uff0c\u4e14\u5bf9\u5e08\u5144\u7684\u201c\u738b\u8005\u201d\u6f14\u7ece\u80fd\u529b\u8868\u793a\u94a6\u4f69\uff0c**\u5b58\u5728\u5411T1-A\uff08\u5bfc\u6f14\u578b\uff09\u6216\u6df7\u5408\u4f533\u53f7\uff08\u6743\u9650\u89c9\u9192\uff09\u8fdb\u5316\u7684\u6f5c\u529b**\uff0c\u9700\u89c2\u5bdf\u5176\u540e\u7eed\u662f\u5426\u51fa\u73b0\u4e3b\u52a8\u5e2e\u52a9\u4ed6\u4eba\u6216\u7edf\u7b79\u884c\u4e3a\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u4f5c\u4e3a\u53ef\u80fd\u6709\u5b69\u5b50\u7684\u5973\u6027\uff0c\u9700\u5173\u6ce8\u5bb6\u5ead\u65f6\u95f4\u51b2\u7a81\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u82e5\u6b63\u5f0f\u5f00\u8bfe\u540e\uff0c\u5176\u201c\u5de5\u4f5c\u65e5\u65b9\u4fbf\u201d\u7684\u65f6\u95f4\u88ab\u6324\u538b\uff0c\u65e0\u6cd5\u8ddf\u4e0a\u9ad8\u5f3a\u5ea6\u5b66\u4e60\u4e0e\u63a5\u5355\u8282\u594f\uff0c\u53ef\u80fd\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u4ea7\u751f\u7126\u8651\u548c\u653e\u5f03\u5ff5\u5934\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\u5e76\u63a5\u53d7\u53cd\u9988\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u632b\u6298\u7834\u9632\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u5bf9\u53d8\u73b0\u6709\u660e\u786e\u671f\u5f85\uff08\u201c\u5f55\u4e66\u201d\u3001\u201c\u90fd\u60f3\u505a\u201d\uff09\u3002\u82e5\u5728\u627f\u8bfa\u671f\u5185\uff08\u59822-3\u4e2a\u6708\uff09\u672a\u63a5\u5230\u7b2c\u4e00\u5355\uff0c\u6216\u63a5\u5355\u6536\u5165\u8fdc\u4f4e\u4e8e\u9884\u671f\uff08100-150/\u65f6\u85aa\uff09\uff0c\u53ef\u80fd\u4ea7\u751f\u5f3a\u70c8\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c4-8\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u5b66\u4e60\u66f2\u7ebf\u53d8\u9661\uff0c\u82e5\u540c\u65f6\u9762\u4e34\u201c\u65f6\u95f4\u4e0d\u591f\u7528\u201d\u548c\u201c\u63a5\u5355\u65e0\u679c\u201d\u7684\u53cc\u91cd\u538b\u529b\uff0c\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u606d\u559c\u901a\u5173\uff01\u4f60\u7684\u5b66\u4e60\u6001\u5ea6\u548c\u9886\u609f\u529b\u975e\u5e38\u51fa\u8272\uff0c\u662f\u73ed\u91cc\u516c\u8ba4\u7684\u6f5c\u529b\u80a1\u3002\u63a5\u4e0b\u6765\u6211\u4eec\u4f1a\u8fdb\u5165\u66f4\u7cfb\u7edf\u7684\u8bad\u7ec3\u548c\u5b9e\u6218\u63a5\u5355\u73af\u8282\u3002\u6211\u77e5\u9053\u4f60\u5de5\u4f5c\u65e5\u65f6\u95f4\u65b9\u4fbf\uff0c\u4f46\u4e5f\u8981\u505a\u597d\u89c4\u5212\uff0c\u628a\u5b66\u4e60\u548c\u751f\u6d3b\u5e73\u8861\u597d\u3002\u6709\u4efb\u4f55\u65f6\u95f4\u4e0a\u7684\u56f0\u96be\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4eec\u4e00\u8d77\u8c03\u6574\u8282\u594f\u3002\u8bb0\u4f4f\uff0c\u4f60\u4e0d\u662f\u4e00\u4e2a\u4eba\u5728\u6218\u6597\uff0c\u5e08\u5144/\u59d0\u548c\u6574\u4e2a\u5267\u793e\u90fd\u662f\u4f60\u7684\u540e\u76fe\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176\u5c0a\u91cd\u9700\u6c42\u548c\u52a1\u5b9e\u8fdb\u53d6\u7684\u5fc3\u6001\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T2\u8001\u9ec4\u725b\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010B\u6a21\u5757(\u6ee1\u914d)\uff1a\u786c\u6838\u624b\u827a\u6c60\u3011**\uff0c\u5373\u63d0\u4f9b\u9ad8\u96be\u5ea6\u7684\u5b9e\u64cd\u4efb\u52a1\u3001\u4e25\u683c\u7684\u4e13\u5bb61v1\u70b9\u8bc4\u548c\u771f\u5b9e\u7684\u6d3e\u5355\u5b9e\u6218\u3002**\u540c\u65f6\uff0c\u9700\u76d1\u63a7\u5176\u201c\u6743\u9650\u89c9\u9192\u201d\u4fe1\u53f7\uff0c\u9002\u65f6\u8865\u5145\u3010D\u6a21\u5757\uff1a\u8eab\u4efd\u4e0e\u6743\u529b\u5149\u73af\u6c60\u3011**\uff0c\u5982\u4efb\u547d\u4e3a\u5c0f\u7ec4\u957f\u6216\u4f5c\u4e1a\u7edf\u8ba1\u5b98\uff0c\u6ee1\u8db3\u5176\u6f5c\u5728\u7684\u9886\u5bfc\u6b32\u548c\u88ab\u5c0a\u91cd\u611f\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u7528\u201c\u7b80\u5355\u8f7b\u677e\u8d5a\u5feb\u94b1\u201d\u7684\u8bdd\u672f\u523a\u6fc0\u5979\uff0c\u8fd9\u4e0e\u5176\u8ffd\u6c42\u7684\u201c\u4e13\u4e1a\u8ba4\u53ef\u201d\u80cc\u9053\u800c\u9a70\uff1b2. \u5ffd\u89c6\u5176\u65f6\u95f4\u7ba1\u7406\u4e0a\u7684\u6f5c\u5728\u538b\u529b\uff0c\u4e0d\u95fb\u4e0d\u95ee\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u8fdb\u884c\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u5fc5\u987b\u5efa\u7acb\u5728\u624e\u5b9e\u7684\u6280\u80fd\u8fdb\u6b65\u548c\u63a5\u5355\u6210\u679c\u57fa\u7840\u4e0a**\u3002\u5728\u5979\u5b8c\u6210\u7b2c\u4e00\u4e2a\u91cc\u7a0b\u7891\uff08\u5982\u63a5\u5230\u7b2c\u4e00\u5355\uff09\u540e\uff0c\u987a\u52bf\u63a8\u4ecb\u9ad8\u9636\u8bfe\u7a0b\u6216\u8bbe\u5907\uff0c\u6210\u529f\u7387\u66f4\u9ad8\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u4f60\u521a\u624d\u7ed9\u6211\u7684\u65c1\u767d\u4f5c\u4e1a\u70b9\u8bc4\u6211\u6536\u5230\u4e86\uff0c\u6211\u542c\u4e86\u597d\u51e0\u904d\uff0c\u6211\u89c9\u5f97\u55ef\u5e08\u5144\u70b9\u8bc4\u7684\u5f88\u5230\u4f4d\uff0c\u6211\u975e\u5e38\u975e\u5e38\u7684\u53d7\u76ca\u3002\u521a\u624d\u5e08\u5144\u53d1\u8fc7\u6765\u7684\u8fd9\u4e2a\u97f3\u9891\u6211\u4e5f\u4ed4\u7ec6\u542c\u4e86\uff0c\u55ef\uff0c\u6211\u89c9\u5f97\u6211\u6bd4\u4ed6\u5f3a\u3002\u201d **\u2014\u2014 \u8bc1\u660e\u9ad8\u5fc3\u7406\u5f39\u6027\u3001\u81ea\u4fe1\u3001\u8ffd\u6c42\u4e13\u4e1a\u8ba4\u53ef\uff08\u5c0a\u91cd\u9700\u6c42\uff09**\n2. > \u201c\u6211\u4e5f\u60f3\u73b0\u9636\u6bb5\u591a\u63a5\u89e6\u4e00\u4e9b\uff0c\u8fd9\u6837\u53ef\u80fd\u80fd\u6210\u957f\u7684\u5feb\u4e9b\u3002\u201d **\u2014\u2014 \u8bc1\u660e\u4e2d\u9ad8\u52a8\u673a\u7eaf\u5ea6\uff0c\u517c\u5177\u6210\u957f\u4e0e\u53d8\u73b0\u76ee\u7684**\n3. > \u201c\u5bf9\uff0c\u6211\u4e5f\u662f\u8fd9\u6837\u8003\u8651\u7684\uff0c\u6211\u73b0\u5728\u5de5\u4f5c\u65e5\u7684\u65f6\u95f4\u8fd8\u662f\u633a\u65b9\u4fbf\u505a\u8fd9\u4e9b\u5de5\u4f5c\u7684\u201d **\u2014\u2014 \u8bc1\u660e\u6709\u89c4\u5212\uff0c\u8d44\u6e90\u5e95\u5ea7\uff08\u65f6\u95f4\uff09\u4e2d\u7b49\uff0c\u4f46\u5b58\u5728\u88ab\u6324\u538b\u98ce\u9669**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2\u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u6709\u8fdb\u5316\u6210\u9886\u8896\u7684\u6f5c\u529b\u3002\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4e0e\u5708\u5c42\u8ba4\u53ef\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u4e3b\u8981\u98ce\u9669\u6765\u81ea **\u3010\u65f6\u95f4\u51b2\u7a81\u4e0e\u6536\u76ca\u843d\u5dee\u3011**\u3002\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u624e\u5b9e\u7684B\u6a21\u5757\uff08\u786c\u6838\u624b\u827a\uff09\u8bad\u7ec3\uff0c\u5e76\u5bc6\u5207\u5173\u6ce8\u5176\u65f6\u95f4\u7ba1\u7406\uff0c\u9002\u65f6\u8d4b\u4e88D\u6a21\u5757\uff08\u7ba1\u7406\u6743\u9650\uff09\u4ee5\u6fc0\u53d1\u5176\u6f5c\u80fd\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\"}\n```";
