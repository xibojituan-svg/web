        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u6587\u541b\u59d0\u59d0 (UID: 676969120) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-15 \u81f3 2026-03-25 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u7206\u8354\u767d/\u5c0f\u767d\u73ed\u4e3b\u4efb (\u590f\u70dc) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u6f14\u64ad\u8bfe\u7a0b (\u4ef7\u683c\u672a\u77e5) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u7f3a\u5931** (\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u652f\u4ed8\u65b9\u5f0f) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u540c\u65f6\u5b66\u4e60\u4e2d\u533b\u8bfe\u3001\u5de5\u4f5c\u3001\u5bb6\u52a1\uff0c\u591a\u6b21\u5f3a\u8c03\u65f6\u95f4\u7d27\u5f20) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u5df2\u62a5\u5907\u5e76\u652f\u6301** (\u63d0\u53ca\u4e3a\u201c\u5148\u751f\u201d\u522e\u75e7\uff0c\u5bb6\u5ead\u6d3b\u52a8\u6b63\u5e38) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** (\u7528\u6237\u4e3b\u52a8\u3001\u8be6\u7ec6\u5730\u8868\u8fbe\u4e86\u81ea\u8eab\u72b6\u6001\u3001\u56f0\u96be\u548c\u60f3\u6cd5) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u27a1\u4e2d\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u5bf9\u6280\u80fd\u63d0\u5347\u6709\u5174\u8da3\uff0c\u4f46\u53d8\u73b0\u76ee\u7684\u4e0d\u660e\u786e\uff0c\u66f4\u591a\u662f\u4f5c\u4e3a\u201c\u4e1a\u4f59\u7231\u597d\u201d\u63a2\u7d22\uff0c\u5bf9\u201c\u63a5\u5355\u8d5a\u94b1\u201d\u7b49\u77ed\u671f\u53d8\u73b0\u538b\u529b\u611f\u4e0d\u5f3a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622 **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201cAU\u5f04\u4e0a\u4e86\u54c8\uff0c\u4e5f\u4e0d\u4f1a\u4f7f...\u559c\u9a6c\u62c9\u96c5\u90a3\u9876\u4e0a\u90a3\u4e2a...\u6211\u4e5f\u6ca1\u627e\u7740...\u54ea\u5934\u90fd\u987e\u4e0d\u4e0a\u4e86\u73b0\u5728\u3002\u54ce\u5440\uff0c\u8bf4\u5b9e\u8bdd\uff0c\u611f\u89c9\u8fd8\u633a\u4e0a\u706b\u7684\u3002\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42 (\u5f52\u5c5e\u611f\u4e0e\u8fde\u63a5)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5728\u591a\u91cd\u89d2\u8272\uff08\u5b66\u5458\u3001\u5bb6\u4eba\u3001\u53ef\u80fd\u7684\u5de5\u4f5c\u8005\uff09\u6324\u538b\u4e0b\u7684\u201c\u65f6\u95f4\u8d2b\u56f0\u201d\u4e0e\u201c\u80fd\u529b\u7126\u8651\u201d\uff0c\u6df1\u5c42\u6e34\u671b\u83b7\u5f97\u793e\u7fa4\u63a5\u7eb3\u3001\u8ba4\u53ef\uff0c\u907f\u514d\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u88ab\u8fb9\u7f18\u5316\u3002**\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u5305\u5bb9\u3001\u80af\u5b9a\u4e0e\u201c\u65e0\u538b\u529b\u201d\u7684\u793e\u7fa4\u5f52\u5c5e\u611f**\u3002\u8ba9\u5979\u611f\u5230\u201c\u5373\u4f7f\u6162\u4e00\u70b9\u3001\u7b28\u4e00\u70b9\uff0c\u4e5f\u662f\u88ab\u56e2\u4f53\u63a5\u7eb3\u548c\u6b22\u8fce\u7684\u4e00\u4efd\u5b50\u201d\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1 \u7c7b** (\u52a8\u673a\u4e2d\u7b49\uff0c\u8d44\u6e90\u5e95\u5ea7\u4f4e\uff0c\u5fc3\u7406\u5f39\u6027\u6781\u4f4e) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u5178\u578b\u7279\u5f81\uff1a\u65f6\u95f4\u7cbe\u529b\u4e25\u91cd\u4e0d\u8db3\u3001\u5b66\u4e60\u8fc7\u7a0b\u6613\u4ea7\u751f\u632b\u8d25\u611f\u548c\u7126\u8651\u3001\u6781\u5ea6\u4f9d\u8d56\u5916\u90e8\u60c5\u7eea\u5b89\u629a\u3001\u5bf9\u6280\u672f\u7ec6\u8282\u611f\u5230\u6050\u60e7) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5c5e\u5f3a\u70c8\u53cd\u5bf9\u8ff9\u8c61\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u5bb6\u5ead\u5173\u7cfb\u548c\u8c10\uff0c\u672a\u89c1\u5e72\u9884\u98ce\u9669\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u56e0\u4e2d\u533b\u8bfe\u3001\u5de5\u4f5c\u7b49\u6324\u5360\u65f6\u95f4\uff0c\u5bfc\u81f4\u8bfe\u7a0b\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u6c38\u8fdc\u8ddf\u4e0d\u4e0a\u201d\u7684\u7edd\u671b\u611f\u548c\u81ea\u8d23\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u9ad8** | **\u6781\u9ad8\u98ce\u9669**\u3002\u4efb\u4f55\u7a0d\u590d\u6742\u7684\u64cd\u4f5c\uff08\u5982AU\u4f7f\u7528\u3001\u8bbe\u5907\u8c03\u8bd5\u3001\u4efb\u52a1\u67e5\u627e\uff09\u90fd\u53ef\u80fd\u6210\u4e3a\u538b\u57ae\u9a86\u9a7c\u7684\u6700\u540e\u4e00\u6839\u7a3b\u8349\uff0c\u5f15\u53d1\u201c\u6211\u592a\u7b28\u4e86\u201d\u3001\u201c\u5b66\u4e0d\u4f1a\u201d\u7684\u5d29\u6e83\u60c5\u7eea\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u77ed\u671f\u5185\u5bf9\u53d8\u73b0\u671f\u5f85\u4e0d\u9ad8\uff0c\u4f46\u82e5\u957f\u671f\u6295\u5165\uff08\u65f6\u95f4\u3001\u8d2d\u4e70\u8bbe\u5907\uff09\u540e\u611f\u89c9\u6beb\u65e0\u8fdb\u6b65\u6216\u6210\u5c31\u611f\uff0c\u53ef\u80fd\u56e0\u201c\u4e0d\u503c\u5f97\u201d\u800c\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\u3002\u6b64\u65f6\u8bfe\u7a0b\u96be\u5ea6\u548c\u64cd\u4f5c\u8981\u6c42\u63d0\u5347\uff0c\u793e\u7fa4\u6d3b\u52a8\uff08\u5982\u6709\u58f0\u4e4b\u591c\uff09\u5f00\u59cb\uff0c\u5979\u7684\u65f6\u95f4\u51b2\u7a81\u548c\u6280\u672f\u6050\u60e7\u4f1a\u96c6\u4e2d\u7206\u53d1\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6587\u541b\u59d0\u59d0\uff0c\u770b\u5230\u60a8\u8fd8\u5728\u5b66\u4e2d\u533b\uff0c\u771f\u7684\u592a\u4f69\u670d\u60a8\u4e0d\u65ad\u5b66\u4e60\u7684\u7cbe\u795e\u4e86\uff01\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u6700\u5927\u7684\u597d\u5904\u5c31\u662f\u2018\u968f\u4f60\u5b89\u6392\u2019\uff0c\u6240\u6709\u76f4\u64ad\u90fd\u6709\u56de\u653e\uff0c\u4f5c\u4e1a\u4e5f\u6ca1\u6709\u786c\u6027\u622a\u6b62\u65e5\u671f\u3002\u60a8\u5343\u4e07\u522b\u6709\u538b\u529b\uff0c\u5c31\u628a\u8fd9\u91cc\u5f53\u6210\u4e00\u4e2a\u653e\u677e\u7684\u3001\u73a9\u58f0\u97f3\u7684\u793e\u7fa4\u3002\u54b1\u4e0d\u8ddf\u522b\u4eba\u6bd4\u8fdb\u5ea6\uff0c\u5c31\u6309\u60a8\u6700\u8212\u670d\u7684\u8282\u594f\u6765\uff0c\u6709\u4efb\u4f55\u4e00\u70b9\u5c0f\u5361\u58f3\uff0c\u968f\u65f6\u558a\u6211\uff0c\u6211\u5e2e\u60a8\u641e\u5b9a\u90a3\u4e9b\u9ebb\u70e6\u7684\u6b65\u9aa4\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5174\u8da3\u6e38\u4e50\u7ebf\u3011**\u3002\u6838\u5fc3\u76ee\u6807\u662f\u7ef4\u6301\u5174\u8da3\u548c\u793e\u7fa4\u8fde\u63a5\uff0c\u800c\u975e\u6280\u80fd\u786c\u6838\u7a81\u7834\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u5f3a\u70c8\u8865\u5145\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u5305\u62ec\uff1a1\uff09\u7b80\u5316\u7248\u64cd\u4f5c\u6307\u5357\uff08\u56fe\u6587/\u89c6\u9891\uff09\uff1b2\uff09\u5b9a\u671f\u4e00\u5bf9\u4e00\u8f7b\u91cf\u7ea7\u9f13\u52b1\uff08\u4e0d\u50ac\u4f5c\u4e1a\uff0c\u53ea\u95ee\u611f\u53d7\uff09\uff1b3\uff09\u5c06\u5176\u5728\u793e\u7fa4\u4e2d\u7684\u4efb\u4f55\u5fae\u5c0f\u4e92\u52a8\uff08\u5982\u95ee\u5019\u3001\u9f13\u52b1\u4ed6\u4eba\uff09\u8fdb\u884c\u516c\u5f00\u8868\u626c\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u5979\u5f3a\u8c03\u201c\u4f5c\u4e1a\u622a\u6b62\u65e5\u671f\u201d\u3001\u201c\u5b66\u4e60\u8fdb\u5ea6\u843d\u540e\u201d\u3001\u201c\u522b\u4eba\u5df2\u7ecf\u63a5\u5355\u201d\u7b49\u5236\u9020\u7126\u8651\u548c\u6bd4\u8f83\u7684\u4fe1\u606f\u3002**\n    2. **\u7edd\u4e0d\u8981\u7ed9\u5979\u5e03\u7f6e\u590d\u6742\u3001\u9700\u8981\u5927\u5757\u65f6\u95f4\u6216\u9ad8\u6280\u672f\u95e8\u69db\u7684\u201c\u6311\u6218\u4efb\u52a1\u201d\u3002**\n    3. **\u907f\u514d\u5728\u521d\u671f\u8fc7\u5ea6\u63a8\u9500\u9ad8\u4ef7\u8bbe\u5907\uff0c\u8fd9\u4f1a\u52a0\u5267\u5979\u7684\u7ecf\u6d4e\u538b\u529b\u548c\u201c\u5fc5\u987b\u5b66\u597d\u201d\u7684\u8d1f\u62c5\u611f\u3002**\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u5b8c\u6210\u5f53\u524d\u8bfe\u7a0b\u5e76\u83b7\u5f97\u7a33\u5b9a\u3001\u79ef\u6781\u7684\u60c5\u7eea\u4f53\u9a8c\u524d\uff0c\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u662f\u9ad8\u98ce\u9669\u64cd\u4f5c\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u73b0\u5728\u4e5f\u662f\u611f\u89c9\u81ea\u5df1\u529f\u592b\u4e0d\u5230\u4f4d\uff0c\u8fd8\u6709\u65f6\u95f4\u6709\u4e9b\u7d27\u5f20[\u6342\u8138]\u201d\n2. > \u201c\u54ce\u5440\uff0c\u8bf4\u5b9e\u8bdd\uff0c\u611f\u89c9\u8fd8\u633a\u4e0a\u706b\u7684\u3002...\u54ea\u5934\u90fd\u987e\u4e0d\u4e0a\u4e86\u73b0\u5728\u3002\u201d\n3. > \u201c\u6211\u7684\u5fc3\u6001\u5c31\u662f\u5148\u5927\u5bb6\u5b66\u5b66\uff0c\u73a9\u73a9\u7684...\u4f60\u6574\u7684\u90a3\u4e48\u96be\uff0c\u55ef\uff0c\u8fd9\u4e48\u591a\u7684\u95e8\u69db\u513f\uff0c\u4f60\u628a\u5927\u5bb6\u5c31\u9694\u5230\u5916\u8fb9\u4e86\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6 \u60c5\u7eea\u5de8\u5a74\u578b**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u5728\u65f6\u95f4\u88ab\u4e25\u91cd\u6324\u538b\u7684\u751f\u6d3b\u4e2d\uff0c\u627e\u5230\u4e00\u4e2a\u6ca1\u6709\u538b\u529b\u3001\u80fd\u88ab\u63a5\u7eb3\u548c\u80af\u5b9a\u7684\u793e\u4ea4\u5f52\u5c5e\u5730**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u5265\u79bb\u4e00\u5207\u5b66\u4e60\u538b\u529b\u548c\u590d\u6742\u64cd\u4f5c\uff0c\u7528\u6781\u81f4\u7b80\u5355\u3001\u9f13\u52b1\u5f0f\u7684\u201c\u6e38\u4e50\u7ebf\u201d\u670d\u52a1\u7ef4\u6301\u5176\u5fae\u5f31\u7684\u5174\u8da3\u706b\u82d7\uff0c\u5e76\u63d0\u4f9b\u9ad8\u9891\u60c5\u7eea\u5b89\u629a**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"maslow_need\": \"\u793e\u4ea4\u9700\u6c42\", \"risk_level\": \"\u9ad8\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf+\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\"}\n```";
