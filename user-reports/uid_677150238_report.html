        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677150238 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-06 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u516d\u6708\u6668\u516e(\u4ed8\u838e\u838e) / \u8389\u838e3(\u4ed8\u838e\u838e) / \u73ed\u4e3b\u4efb-\u6d6e\u6c89(\u9648\u78ca) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u6f14\u64ad\u7cfb\u7edf\u8bfe\uff082\u4e2a\u6708\u7248\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u91d1\u989d\u3001\u5206\u671f\u6216\u501f\u8d37\u60c5\u51b5\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u5de5\u4f5c\u5236\u7279\u6b8a\uff1a\u4e0a\u534810\u70b9\u4e0a\u73ed\uff0c\u665a\u4e0a9\u70b9\u4e0b\u73ed\uff0c\u65e0\u56fa\u5b9a\u4f11\u606f\u65e5\uff0c\u9700\u503c\u73ed\uff08\u4e09\u5929\u4e00\u8f6e\uff09\u3002\u5b66\u4e60\u9700\u9760\u201c\u4e0b\u73ed\u540e\u201d\u6216\u201c\u4e0a\u73ed\u4e0d\u5fd9\u65f6\u6302\u7740\u8033\u673a\u542c\u201d\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u5173\u952e\u4fe1\u606f\u5982\u652f\u4ed8\u65b9\u5f0f\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u5177\u4f53\u7ecf\u6d4e\u72b6\u51b5\u3001\u5b66\u4e60\u8bbe\u5907\u4e0e\u7f51\u7edc\u6761\u4ef6\u5747\u672a\u77e5\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u63a2\u7d22\u800c\u6765\uff0c\u5bf9\u53d8\u73b0\u9884\u671f\u6a21\u7cca\uff0c\u5b66\u4e60\u6001\u5ea6\u79ef\u6781\uff0c\u5173\u6ce8\u8bfe\u7a0b\u5185\u5bb9\u4e0e\u81ea\u8eab\u9002\u914d\u5ea6\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u6682\u65f6\u60f3\u4e86\u89e3\u4e00\u4e0b\uff0c\u770b\u770b\u81ea\u5df1\u6709\u6ca1\u6709\u8fd9\u4e2a\u80fd\u529b\uff0c\u5fc3\u91cc\u8fd8\u662f\u5fd0\u5fd1\u7684\uff0c\u6211\u5c3d\u91cf\u4e86\u89e3\u201d\n> \u201c\u4e0d\u4e0a\u8bfe\u7684\u8bdd\uff0c\u53ef\u4ee5\u63a5\u60a8\u7684\u6d3b\u5417\uff0c\u6bd4\u5982\u753b\u672c\u4e4b\u7c7b\u7684\u201d\n> \u201c\u6211\u597d\u50cf\u4e00\u8282\u8bfe\u4e5f\u8d76\u4e0d\u4e0a\u201d / \u201c\u8bfe\u7a0b\u53ef\u80fd\u57fa\u672c\u9760\u8865\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u4efb\u4f55\u652f\u4ed8\u7ec6\u8282\u3001\u6536\u5165\u538b\u529b\u6216\u4ef7\u683c\u654f\u611f\u5ea6\u3002\u65e0\u6cd5\u8bc4\u7ea7\uff0c\u4f46\u7ed3\u5408\u804c\u4e1a\uff08\u670d\u52a1\u5458\uff0c\u6708\u51655000\uff09\u63a8\u65ad\u4e3a**\u4e2d\u4f4e**\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u2b07\u4f4e** \u2014 \u5de5\u4f5c\u5236\u7279\u6b8a\uff0810-21\u70b9\uff0c\u65e0\u56fa\u5b9a\u4f11\u606f\u65e5\uff09\uff0c\u660e\u786e\u8868\u793a\u201c\u4e00\u8282\u8bfe\u4e5f\u8d76\u4e0d\u4e0a\u201d\u3001\u201c\u8bfe\u7a0b\u53ef\u80fd\u57fa\u672c\u9760\u8865\u201d\u3002**\u65f6\u95f4\u8d44\u6e90\u4e25\u91cd\u4e0d\u8db3**\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u4fe1\u606f\uff0c\u65e0\u6cd5\u5224\u65ad\u652f\u6301\u6216\u53cd\u5bf9\u3002\n- **\u5e95\u5ea7\u53d6\u77ed\u677f**\uff1a**\u2b07\u4f4e**\uff08\u65f6\u95f4\u7ef4\u5ea6\u4e3a\u81f4\u547d\u77ed\u677f\uff09\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u27a1\u4e2d\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u9700\u95f4\u6b47\u6027\u5b89\u629a\u4e0e\u9f13\u52b1\uff0c\u4f46\u80fd\u4e3b\u52a8\u6c9f\u901a\u56f0\u96be\uff0c\u6001\u5ea6\u793c\u8c8c\u914d\u5408\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u6211\u597d\u50cf\u4e00\u8282\u8bfe\u4e5f\u8d76\u4e0d\u4e0a\u201d\uff08\u4e3b\u52a8\u66b4\u9732\u56f0\u96be\uff09\n> \u201c\u5fc3\u91cc\u8fd8\u662f\u5fd0\u5fd1\u7684\u201d\uff08\u8868\u8fbe\u4e0d\u81ea\u4fe1\uff0c\u5bfb\u6c42\u786e\u8ba4\uff09\n> \u201c\u6211\u53ef\u4ee5\u4e00\u76f4\u548c\u60a8\u4fdd\u6301\u8054\u7cfb\u5417\uff1f\u7b49\u6211\u5565\u65f6\u5019\u8bf7\u4e24\u4e2a\u6708\u5047\uff0c\u8d76\u4e0a\u6709\u73ed\uff0c\u8fd8\u8ddf\u60a8\u5b66\u201d\uff08\u9762\u5bf9\u65f6\u95f4\u51b2\u7a81\uff0c\u63d0\u51fa\u5ef6\u8fdf\u65b9\u6848\uff0c\u800c\u975e\u76f4\u63a5\u653e\u5f03\u6216\u62b1\u6028\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42\uff08\u7126\u8651\u4fdd\u969c\uff09**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u5f53\u524d\u670d\u52a1\u5458\u804c\u4e1a\uff08\u201c\u5565\u7a33\u5b9a\u4e0d\u7a33\u5b9a\u7684\u201d\uff09\u7f3a\u4e4f\u5b89\u5168\u611f\u548c\u4ef7\u503c\u611f\uff0c\u6708\u51655000\u5143\uff0c\u6e34\u671b\u83b7\u5f97\u4e00\u9879\u80fd\u5e26\u6765**\u7ecf\u6d4e\u4fdd\u969c\u548c\u804c\u4e1a\u8fc7\u6e21**\u7684\u786c\u6280\u80fd\uff0c\u4ee5\u5e94\u5bf9\u672a\u6765\u53ef\u80fd\u7684\u53d8\u52a8\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u7684\u6210\u957f\u8def\u5f84\u4e0e\u4f4e\u95e8\u69db\u7684\u542f\u52a8\u4fe1\u5fc3**\u3002\u4ed6\u9700\u8981\u88ab\u53cd\u590d\u544a\u77e5\u201c\u788e\u7247\u5316\u65f6\u95f4\u4e5f\u80fd\u5b66\u201d\u3001\u201c\u6709\u56de\u653e\u201d\u3001\u201c\u6709\u89c4\u5212\u201d\uff0c\u4ee5\u7f13\u89e3\u5176\u5bf9\u65f6\u95f4\u4e0d\u8db3\u7684\u7126\u8651\uff0c\u5e76\u76f8\u4fe1\u8fd9\u95e8\u6280\u80fd\u80fd\u6210\u4e3a\u5176\u804c\u4e1a\u7684\u201c\u5b89\u5168\u57ab\u201d\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5 C2\u7c7b\uff08\u51b2\u52a8\u98ce\u9669\u578b\uff09** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u578b** (\u6df7\u5408 **T6 \u60c5\u7eea\u5de8\u5a74\u578b** \u7279\u5f81) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u5bb6\u5ead\u53cd\u5bf9\u3001\u5065\u5eb7\u5371\u673a\u7b49\u7194\u65ad\u7ea2\u7ebf\u3002\u4f46**\u65f6\u95f4\u7ea2\u7ebf**\u5df2\u4eae\u9ec4\u706f\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4e2d | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u9700\u8b66\u60d5**\u3002\u82e5\u62a5\u540d\u8d44\u91d1\u5f71\u54cd\u5bb6\u5ead\u5f00\u652f\u6216\u5bb6\u4eba\u4e0d\u77e5\u60c5\uff0c\u98ce\u9669\u9aa4\u589e\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669\uff01** \u7279\u6b8a\u5de5\u4f5c\u5236\u5bfc\u81f4\u65e0\u6cd5\u8ddf\u4e0a\u76f4\u64ad\u548c\u4f5c\u4e1a\u8282\u594f\uff0c\u79ef\u538b\u7684\u8bfe\u7a0b\u548c\u632b\u8d25\u611f\u4f1a\u8fc5\u901f\u5f15\u7206\u201c\u5b66\u4e0d\u4f1a\u3001\u6ca1\u65f6\u95f4\u201d\u7684\u9000\u8d39\u8bc9\u6c42\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4e2d | \u5df2\u6709\u201c\u5fd0\u5fd1\u201d\u60c5\u7eea\uff0c\u82e5\u521d\u671f\u4f5c\u4e1a\u53d7\u632b\u6216\u8f6f\u4ef6\u64cd\u4f5c\u9047\u5230\u56f0\u96be\uff0c\u53ef\u80fd\u56e0\u81ea\u5351\u800c\u653e\u5f03\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u867d\u52a8\u673a\u8f83\u7eaf\uff0c\u4f46\u5e95\u5c42\u662f\u5b89\u5168\u9700\u6c42\uff0c\u82e5\u5b66\u4e60\u4e00\u6bb5\u65f6\u95f4\u540e\u611f\u89c9\u201c\u53d8\u73b0\u9065\u9065\u65e0\u671f\u201d\uff0c\u4f1a\u8d28\u7591\u6295\u5165\u4ef7\u503c\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-3\u5468**\u3002\u5f53\u8bfe\u7a0b\u5185\u5bb9\u52a0\u6df1\u3001\u4f5c\u4e1a\u8981\u6c42\u63d0\u9ad8\uff0c\u800c\u5176\u788e\u7247\u5316\u65f6\u95f4\u65e0\u6cd5\u652f\u6491\u7cfb\u7edf\u5b66\u4e60\u65f6\uff0c\u5c06\u4ea7\u751f\u5de8\u5927\u538b\u529b\u5e76\u53ef\u80fd\u653e\u5f03\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6d77\u89d2\u540c\u5b66\uff0c\u770b\u5230\u4f60\u7684\u5de5\u4f5c\u65f6\u95f4\u4e86\uff0c\u786e\u5b9e\u6bd4\u8f83\u7279\u6b8a\u3002\u522b\u62c5\u5fc3\uff0c\u54b1\u4eec\u73ed\u91cc\u5f88\u591a\u540c\u5b66\u90fd\u662f\u5229\u7528\u788e\u7247\u65f6\u95f4\u5b66\u4e60\u7684\uff0c\u6211\u4eec\u7684\u8bfe\u7a0b\u56de\u653e\u548c\u4f5c\u4e1a\u63d0\u4ea4\u5468\u671f\u5c31\u662f\u4e3a\u8fd9\u79cd\u60c5\u51b5\u8bbe\u8ba1\u7684\u3002\u6211\u4f1a\u6839\u636e\u4f60\u7684\u6392\u73ed\uff0c\u5e2e\u4f60\u5b9a\u5236\u4e00\u4e2a\u2018\u9519\u5cf0\u5b66\u4e60\u8ba1\u5212\u2019\uff0c\u54b1\u4eec\u4e0d\u6c42\u5feb\uff0c\u53ea\u6c42\u7a33\u624e\u7a33\u6253\u628a\u6280\u80fd\u5b66\u5230\u624b\u3002\u6709\u4efb\u4f55\u8ddf\u4e0d\u4e0a\u968f\u65f6\u627e\u6211\uff0c\u6211\u4eec\u4e00\u8d77\u8c03\u6574\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72-\u4fdd\u5e95\u7ebf\u3011**\u3002\u5f31\u5316\u201c\u5feb\u901f\u53d8\u73b0\u201d\u8bdd\u672f\uff0c\u5f3a\u5316\u201c\u6280\u80fd\u79ef\u7d2f-\u804c\u4e1a\u5907\u4efd\u201d\u8def\u5f84\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u6302\u8f7d **\u3010\u65f6\u95f4\u7ba1\u7406\u8f85\u52a9\u5305\u3011**\uff08\u63d0\u4f9b\u788e\u7247\u5316\u5b66\u4e60\u6307\u5357\u3001\u91cd\u70b9\u5185\u5bb9\u5212\u53d6\uff09\u548c **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\uff08\u9488\u5bf9\u5176\u201c\u5fd0\u5fd1\u201d\u60c5\u7eea\uff0c\u52a0\u5f3a\u9636\u6bb5\u6027\u9f13\u52b1\u4e0e\u5fae\u5c0f\u6210\u5c31\u53cd\u9988\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u522b\u4eba\u90fd\u8ddf\u4e0a\u4e86\u201d\u4e4b\u7c7b\u7684\u8bdd\u672f\u65bd\u538b\uff1b\u627f\u8bfa\u77ed\u671f\u5185\uff08\u59821-2\u4e2a\u6708\uff09\u80fd\u63a5\u5355\u53d8\u73b0\uff1b\u5ffd\u7565\u5176\u65f6\u95f4\u56f0\u5883\uff0c\u8981\u6c42\u5176\u5fc5\u987b\u51c6\u65f6\u53c2\u52a0\u76f4\u64ad\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u73b0\u67092\u4e2a\u6708\u8bfe\u7a0b\u672a\u987a\u5229\u5b8c\u6210\u524d\uff0c\u7981\u6b62\u4efb\u4f55\u54114\u4e2a\u6708\u6216\u66f4\u9ad8\u9636\u8bfe\u7a0b\u7684\u63a8\u4ecb\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u597d\u50cf\u4e00\u8282\u8bfe\u4e5f\u8d76\u4e0d\u4e0a\u201d\n2. > \u201c\u6211\u5de5\u4f5c\u7684\u65f6\u95f4\u6bd4\u8f83\u957f\uff0c\u8bfe\u7a0b\u53ef\u80fd\u57fa\u672c\u9760\u8865\u201d\n3. > \u201c\u6682\u65f6\u60f3\u4e86\u89e3\u4e00\u4e0b\uff0c\u770b\u770b\u81ea\u5df1\u6709\u6ca1\u6709\u8fd9\u4e2a\u80fd\u529b\uff0c\u5fc3\u91cc\u8fd8\u662f\u5fd0\u5fd1\u7684\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010\u65f6\u95f4\u7834\u4ea7\u7684\u8c28\u614e\u63a2\u7d22\u8005\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e00\u4efd\u62b5\u5fa1\u804c\u4e1a\u98ce\u9669\u7684\u5b89\u5168\u4fdd\u969c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u4e3a\u5176\u91cf\u8eab\u5b9a\u5236\u788e\u7247\u5316\u5b66\u4e60\u65b9\u6848\uff0c\u5e76\u6301\u7eed\u7ed9\u4e88\u201c\u6162\u5c31\u662f\u5feb\u201d\u7684\u5fc3\u7406\u6309\u6469\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u578b (\u6df7\u5408T6\u7279\u5f81)\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72-\u4fdd\u5e95\u7ebf + \u65f6\u95f4\u7ba1\u7406\u8f85\u52a9\u5305 + \u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\"}\n```";
