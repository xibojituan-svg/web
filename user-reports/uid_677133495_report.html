        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677133495 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5416\u5416\u51b2\u9e2d1(\u65bd\u73ca\u73ca) / \u5b98\u65b9\u62db\u52df\u5b98(\u65bd\u73ca\u73ca) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u4e3b\u64ad\u8bad\u7ec3\u8425\uff08\u9ad8\u9636\u73ed/4\u4e2a\u6708\u8bfe\u7a0b\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u7f3a\u5931**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u4ef7\u683c\u3001\u5206\u671f\u6216\u8d44\u91d1\u6765\u6e90\u3002\u65e0\u6cd5\u5224\u65ad\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u4eca\u665a\u5341\u70b9\u534a\u4e0b\u73ed\u201d\uff082026-04-08 21:25:59\uff09\uff0c\u4e14\u201c\u6709\u4e9b\u76f4\u64ad\u7684\u65f6\u95f4\u5c31\u548c\u6211\u4e0a\u73ed\u65f6\u95f4\u649e\u4e0a\u4e86\u201d\uff082026-04-09 15:36:16\uff09\uff0c\u8868\u660e\u5176\u6709\u56fa\u5b9a\u5de5\u4f5c\uff0c\u5b66\u4e60\u65f6\u95f4\u9700\u5728\u5de5\u4f59\u62fc\u51d1\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u6216\u4f34\u4fa3\u4fe1\u606f\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u5173\u952e\u4fe1\u606f\u5982\u652f\u4ed8\u6765\u6e90\u3001\u5bb6\u5ead\u652f\u6301\u3001\u7ecf\u6d4e\u72b6\u51b5\u3001\u5177\u4f53\u5de5\u4f5c\u6027\u8d28\u3001\u5e74\u9f84\u7b49\u5747\u672a\u63d0\u53ca\u3002\u5224\u65ad\u4e3b\u8981\u57fa\u4e8e\u5b66\u4e60\u884c\u4e3a\u548c\u5c11\u91cf\u65f6\u95f4\u7ebf\u7d22\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u5173\u6ce8\u5b66\u4e60\u8def\u5f84\u4e0e\u884c\u4e1a\u89c4\u5219\uff0c\u5bf9\u53d8\u73b0\u6709\u4e00\u5b9a\u671f\u5f85\u4f46\u975e\u552f\u4e00\u6216\u6025\u8feb\u76ee\u6807\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n    > \u201c\u8001\u5e08\uff0c\u4eca\u5929\u6211\u542c\u5e08\u59d0\u8bf4\u6709\u521d\u7ea7\u548c\u4e2d\u7ea7\u7684\u8bc1\uff0c\u5148\u8003\u521d\u7ea7\u518d\u770b\u4e2d\u7ea7\u5417\u201d\uff082026-04-07 16:34:21\uff09\n    > \u201c\u611f\u89c9\u521a\u5f00\u59cb\u53ea\u80fd\u505a\u753b\u672c\uff0c\u5ba1\u542c\u201d\uff082026-04-08 14:32:26\uff09\n    > \u201c\u5927\u8111\u7a7a\u767d[\u53ef\u601c]\u201d\uff082026-04-09 15:01:57\uff09\u2014\u2014\u9762\u5bf9\u9009\u4e66\u4efb\u52a1\u65f6\u7684\u771f\u5b9e\u53cd\u5e94\uff0c\u800c\u975e\u8d28\u95ee\u6536\u76ca\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u65e0\u4efb\u4f55\u5173\u4e8e\u652f\u4ed8\u80fd\u529b\u3001\u7ecf\u6d4e\u72b6\u51b5\u7684\u8ba8\u8bba\u3002**\u6b64\u7ef4\u5ea6\u56e0\u4fe1\u606f\u7f3a\u5931\uff0c\u6309\u6700\u8c28\u614e\u539f\u5219\u6682\u8bc4\u4e3a\u201c\u4e2d\u201d\uff0c\u4f46\u9700\u9ad8\u5ea6\u8b66\u60d5\u3002**\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u6709\u56fa\u5b9a\u5de5\u4f5c\uff08\u9700\u665a\u4e0a10\u70b9\u534a\u4e0b\u73ed\uff09\uff0c\u5b66\u4e60\u65f6\u95f4\u9700\u5728\u5de5\u4f59\u62fc\u51d1\uff0c\u5b58\u5728\u4e0e\u76f4\u64ad\u8bfe\u51b2\u7a81\u7684\u98ce\u9669\u3002\u4f46\u80fd\u575a\u6301\u5b8c\u6210\u65e9\u529f\u3001\u542c\u8bfe\u3001\u4ea4\u4f5c\u4e1a\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u65e0\u4efb\u4f55\u63d0\u53ca\u3002**\u6b64\u7ef4\u5ea6\u56e0\u4fe1\u606f\u7f3a\u5931\uff0c\u6309\u6700\u8c28\u614e\u539f\u5219\u6682\u8bc4\u4e3a\u201c\u4e2d\u201d\uff0c\u4f46\u9700\u9ad8\u5ea6\u8b66\u60d5\u3002**\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u9762\u5bf9\u65b0\u4efb\u52a1\uff08\u9009\u4e66\u3001\u64cd\u4f5c\uff09\u65f6\u8868\u73b0\u51fa\u660e\u663e\u7684\u754f\u96be\u3001\u4e0d\u81ea\u4fe1\u548c\u9ad8\u5ea6\u4f9d\u8d56\u6307\u5bfc\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n    > \u201c\u4f46\u662f\u6211\u6ca1\u6709\u601d\u8def[\u7834\u6d95\u4e3a\u7b11]\u201d\uff082026-04-07 15:33:28\uff09\u2014\u2014\u521d\u671f\u5373\u8868\u9732\u4e0d\u81ea\u4fe1\u3002\n    > \u201c\u96be\u5ea6\u597d\u5927[\u6342\u8138]\u201d\uff082026-04-09 14:57:40\uff09\u2014\u2014\u9762\u5bf9\u72ec\u7acb\u5efa\u7ec4\u4efb\u52a1\u65f6\u76f4\u63a5\u9000\u7f29\u3002\n    > \u201c\u5927\u8111\u7a7a\u767d[\u53ef\u601c]\u201d\uff082026-04-09 15:01:57\uff09\u2014\u2014\u9762\u5bf9\u9009\u62e9\u65f6\u4ea7\u751f\u65e0\u52a9\u611f\u3002\n    > \u201c\u4e0b\u8f7d\u4e66\u4e86\uff0c\u4f46\u662f\u627e\u4e0d\u5230\u4e86\uff0c\u4e0b\u8f7d\u7684\u4e66\u600e\u4e48\u7528[\u82e6\u6da9]\u201d\uff082026-04-09 14:53:10\uff09\u2014\u2014\u57fa\u7840\u64cd\u4f5c\u80fd\u529b\u5f31\uff0c\u6613\u4ea7\u751f\u632b\u8d25\u611f\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42**\uff08\u6e34\u671b\u8ba4\u53ef\u3001\u8bc1\u660e\u81ea\u6211\uff09\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5f3a\u70c8\u7684\u81ea\u6211\u6000\u7591\u4e0e\u5bf9\u8ba4\u53ef\u7684\u6781\u5ea6\u6e34\u671b**\u3002\u4ed6\u79ef\u6781\u5b8c\u6210\u4f5c\u4e1a\u3001\u7d27\u8ddf\u76f4\u64ad\u3001\u6e34\u671b\u201c\u8fdb\u524d\u5341\u201d\uff082026-04-09 13:59:34\uff09\uff0c\u884c\u4e3a\u80cc\u540e\u662f\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u83b7\u5f97\u6280\u80fd\u548c\u6210\u5c31\uff0c\u4ece\u800c\u8bc1\u660e\u81ea\u5df1\u7684\u4ef7\u503c\uff0c\u6446\u8131\u201c\u5927\u8111\u7a7a\u767d\u201d\u548c\u201c\u6ca1\u6709\u601d\u8def\u201d\u7684\u65e0\u529b\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u3001\u5177\u4f53\u5316\u7684\u80af\u5b9a\u4e0e\u9f13\u52b1\uff0c\u5e76\u63d0\u4f9b\u6e05\u6670\u7684\u3001\u6b65\u9aa4\u5316\u7684\u8def\u5f84\u6307\u5bfc**\u3002\u907f\u514d\u4efb\u4f55\u53ef\u80fd\u6253\u51fb\u5176\u81ea\u4fe1\u5fc3\u7684\u6bd4\u8f83\u6216\u6279\u8bc4\uff0c\u7528\u201c\u5c0f\u6b65\u5feb\u8dd1\u201d\u7684\u6210\u5c31\u611f\u6765\u5582\u517b\u5176\u81ea\u5c0a\u5fc3\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b\uff08\u51b2\u52a8\u98ce\u9669\u578b\uff09** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u5bb6\u5ead\u53cd\u5bf9\u3001\u751f\u5b58\u5371\u673a\u7b49D\u7c7b\u7194\u65ad\u4fe1\u53f7\u3002**\u4f46\u8d44\u91d1\u4e0e\u5bb6\u5ead\u652f\u6301\u4fe1\u606f\u5b8c\u5168\u7f3a\u5931\uff0c\u5b58\u5728\u6f5c\u5728\u9ad8\u98ce\u9669\u3002**\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u9ad8** | **\u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u98ce\u9669\u6781\u9ad8\u3002** \u82e5\u4e3a\u9690\u7792\u5bb6\u4eba\u62a5\u540d\uff0c\u4e00\u65e6\u88ab\u53d1\u73b0\u6781\u6613\u5f15\u53d1\u51b2\u7a81\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | \u56fa\u5b9a\u5de5\u4f5c\u4e0e\u76f4\u64ad\u65f6\u95f4\u51b2\u7a81\uff0c\u4f5c\u4e1a\u79ef\u538b\u5bfc\u81f4\u81ea\u8d23\uff0c\u53e0\u52a0\u201c\u60c5\u7eea\u5de8\u5a74\u201d\u7279\u8d28\uff0c\u6781\u6613\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u5d29\u6e83\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669\u70b9\u3002** \u9762\u5bf9\u7a0d\u6709\u96be\u5ea6\u7684\u72ec\u7acb\u4efb\u52a1\uff08\u5982\u9009\u4e66\u3001\u5efa\u7ec4\u3001\u8f6f\u4ef6\u64cd\u4f5c\uff09\u65f6\uff0c\u6781\u6613\u56e0\u201c\u4e0d\u4f1a\u3001\u4e0d\u61c2\u3001\u592a\u96be\u201d\u800c\u81ea\u5c0a\u5fc3\u53d7\u632b\uff0c\u4ea7\u751f\u201c\u6211\u592a\u7b28\u4e86\uff0c\u5b66\u4e0d\u4f1a\u201d\u7684\u5ff5\u5934\uff0c\u8fdb\u800c\u8981\u6c42\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u867d\u52a8\u673a\u7eaf\u5ea6\u8f83\u9ad8\uff0c\u4f46\u82e5\u77ed\u671f\u5185\u65e0\u6cd5\u83b7\u5f97\u4efb\u4f55\u6b63\u5411\u53cd\u9988\uff08\u5982\u4f5c\u4e1a\u88ab\u6279\u3001\u63a5\u5355\u65e0\u671b\uff09\uff0c\u5176\u8106\u5f31\u7684\u5fc3\u7406\u5f39\u6027\u53ef\u80fd\u5c06\u632b\u8d25\u611f\u8f6c\u5316\u4e3a\u5bf9\u201c\u8bfe\u7a0b\u65e0\u7528\u201d\u7684\u6307\u63a7\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-3\u5468**\u3002\u5f53\u8bfe\u7a0b\u4ece\u5f15\u5bfc\u5f0f\u6559\u5b66\u8f6c\u5411\u9700\u8981\u66f4\u591a\u72ec\u7acb\u5b9e\u8df5\u548c\u521b\u9020\u6027\u8f93\u51fa\u65f6\uff08\u5982\u7b2c\u4e00\u6b21\u72ec\u7acb\u9009\u4e66\u3001\u7b2c\u4e00\u6b21\u7ec4\u961f\u3001\u7b2c\u4e00\u6b21\u4f7f\u7528\u590d\u6742\u8f6f\u4ef6\uff09\uff0c\u662f\u5176\u5fc3\u7406\u9632\u7ebf\u6700\u8106\u5f31\u7684\u65f6\u523b\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u540c\u5b66\u4f60\u597d\uff01\u770b\u5230\u4f60\u5728\u4f53\u9a8c\u8425\u7279\u522b\u8ba4\u771f\uff0c\u4f5c\u4e1a\u5b8c\u6210\u5f97\u4e5f\u5f88\u68d2\uff0c\u5c24\u5176\u662f\u90a3\u4efd\u793e\u79d1\u6587\u672c\uff0c\u8bb2\u8ff0\u611f\u5f88\u7a33\uff0c\u80fd\u770b\u51fa\u4f60\u7684\u6f5c\u529b\u548c\u7528\u5fc3\u3002\u6b63\u5f0f\u8bfe\u7a0b\u6211\u4eec\u4f1a\u4e00\u6b65\u6b65\u6765\uff0c\u6bcf\u4e2a\u9636\u6bb5\u90fd\u6709\u6211\u624b\u628a\u624b\u5e26\u7740\uff0c\u4f60\u4e0d\u7528\u62c5\u5fc3\u2018\u5927\u8111\u7a7a\u767d\u2019\uff0c\u54b1\u4eec\u7684\u4efb\u52a1\u5c31\u662f\u628a\u8fd9\u4e9b\u2018\u7a7a\u767d\u2019\u4e00\u70b9\u70b9\u586b\u4e0a\u8272\u5f69\u3002\u6709\u4efb\u4f55\u5361\u4f4f\u7684\u5730\u65b9\uff0c\u968f\u65f6\u6233\u6211\uff0c\u6211\u5c31\u662f\u4f60\u7684\u2018\u771f\u4eba\u7248\u64cd\u4f5c\u8bf4\u660e\u4e66\u2019\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\u3011**\u3002\u6838\u5fc3\u662f\u201c\u964d\u96be\u5ea6\u3001\u5f3a\u53cd\u9988\u3001\u5c0f\u95ed\u73af\u201d\u3002\u907f\u514d\u8fc7\u65e9\u8ba9\u5176\u63a5\u89e6\u590d\u6742\u3001\u5f00\u653e\u7684\u72ec\u7acb\u4efb\u52a1\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n    1.  **\u3010\u6781\u7ec6\u6b65\u9aa4\u62c6\u89e3\u5305\u3011**\uff1a\u6240\u6709\u64cd\u4f5c\uff08\u5982\u4e0b\u8f7d\u3001\u4e0a\u4f20\u3001\u9009\u4e66\uff09\u5fc5\u987b\u63d0\u4f9b\u56fe\u6587/\u89c6\u9891\u4e00\u6b65\u4e00\u56fe\u6559\u7a0b\u3002\n    2.  **\u3010\u9ad8\u9891\u6b63\u5411\u53cd\u9988\u5305\u3011**\uff1a\u73ed\u4e3b\u4efb\u9700\u5bf9\u5176\u4efb\u4f55\u5fae\u5c0f\u8fdb\u6b65\uff08\u5982\u6309\u65f6\u4ea4\u4f5c\u4e1a\u3001\u63d0\u4e86\u4e00\u4e2a\u95ee\u9898\uff09\u8fdb\u884c\u5373\u65f6\u3001\u5177\u4f53\u7684\u8868\u626c\u3002\n    3.  **\u3010\u56fa\u5b9a\u642d\u5b50\u5339\u914d\u5305\u3011**\uff1a\u65e9\u671f\u5f3a\u5236\u5339\u914d1-2\u4f4d\u6027\u683c\u6e29\u548c\u3001\u8fdb\u5ea6\u76f8\u8fd1\u7684\u5b66\u4f34\uff0c\u51cf\u5c11\u5176\u72ec\u81ea\u9762\u5bf9\u4efb\u52a1\u7684\u6050\u614c\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1.  \u5728\u5176\u8868\u8fbe\u754f\u96be\u60c5\u7eea\u65f6\uff0c\u4f7f\u7528\u201c\u522b\u4eba\u90fd\u80fd\u505a\u5230\u201d\u3001\u201c\u8fd9\u5f88\u7b80\u5355\u201d\u7b49\u5bf9\u6bd4\u6027\u3001\u5426\u5b9a\u6027\u8bed\u8a00\u3002\n    2.  \u5e03\u7f6e\u5f00\u653e\u6027\u3001\u65e0\u6807\u51c6\u7b54\u6848\u7684\u4f5c\u4e1a\uff08\u5982\u201c\u81ea\u7531\u521b\u4f5c\u4e00\u6bb5\u201d\uff09\u3002\n    3.  \u5728\u7fa4\u5185\u516c\u5f00\u6279\u8bc4\u6216\u6307\u51fa\u5176\u660e\u663e\u4e0d\u8db3\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u5b8c\u6210\u5f53\u524d\u8bfe\u7a0b\u
