    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u5206\u6790\u4e0e\u98ce\u63a7\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u7f3a\u4e4f\u652f\u4ed8\u4fe1\u606f\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u5177\u4f53\u5b66\u4e60\u76ee\u6807\u3001\u7ecf\u6d4e\u72b6\u51b5\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u7b49\u5173\u952e\u7ef4\u5ea6\u4fe1\u606f\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a**\u4e2d\u7b49**\u3002\u6709\u660e\u786e\u7684\u5b66\u4e60\u884c\u4e3a\uff08\u4e3b\u52a8\u8bf7\u5047\u3001\u7533\u8bf7\u8c03\u6574\u6392\u73ed\u3001\u5c1d\u8bd5\u7ec3\u4e60\uff09\uff0c\u8868\u660e\u6709\u53c2\u4e0e\u610f\u613f\u3002\u4f46\u76ee\u6807\u6a21\u7cca\uff0c\u672a\u63d0\u53ca\u5177\u4f53\u5b66\u4e60\u76ee\u6807\uff08\u5982\u517c\u804c\u3001\u8f6c\u884c\u3001\u5174\u8da3\uff09\uff0c\u66f4\u591a\u8868\u73b0\u4e3a\u5bf9\u73ed\u4e3b\u4efb\u4e13\u4e1a\u6307\u5bfc\u7684\u8ba4\u53ef\u548c\u8ddf\u968f\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u4ec5\u77e5\u6709\u5168\u804c\u5de5\u4f5c\uff08\u201c\u95e8\u5e97\u73ed\u201d\uff09\uff0c\u9700\u8f6e\u73ed\uff0c\u4e1a\u4f59\u65f6\u95f4\u6709\u9650\u4e14\u4e0d\u56fa\u5b9a\u3002\u65e0\u7ecf\u6d4e\u72b6\u51b5\u3001\u8bbe\u5907\u3001\u5b89\u9759\u73af\u5883\u7b49\u4fe1\u606f\u3002**\u65f6\u95f4\u8d44\u6e90\u662f\u4e3b\u8981\u7ea6\u675f**\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a**\u4e2d\u7b49\u504f\u9ad8**\u3002\u6c9f\u901a\u79ef\u6781\u3001\u793c\u8c8c\uff08\u9891\u7e41\u4f7f\u7528[\u62b1\u62f3][\u5408\u5341]\uff09\uff0c\u63a5\u53d7\u53cd\u9988\uff08\u4e3b\u52a8\u7ec3\u4e60\u666e\u901a\u8bdd\uff09\uff0c\u80fd\u4e3b\u52a8\u6c9f\u901a\u65f6\u95f4\u51b2\u7a81\u5e76\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff08\u7533\u8bf7\u8c03\u6574\u6392\u73ed\uff09\u3002\u8868\u73b0\u51fa\u8f83\u597d\u7684\u914d\u5408\u5ea6\u4e0e\u9002\u5e94\u6027\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u6267\u884c\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**\uff1a**\u65e0\u6cd5\u5224\u65ad**\u3002\u8bb0\u5f55\u4e2d\u65e0\u4efb\u4f55\u652f\u4ed8\u3001\u8ba2\u5355\u3001\u4ef7\u683c\u8ba8\u8bba\u4fe1\u606f\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u65e0\u6cd5\u5224\u65ad**\u3002\u8bb0\u5f55\u4e2d\u65e0\u4efb\u4f55\u6d89\u53ca\u5bb6\u4eba\u3001\u5171\u540c\u51b3\u7b56\u7684\u5bf9\u8bdd\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u7eaf\u5ea6**\uff1a**B\u7c7b\uff08\u4e2d\u7b49\uff09**\u3002\u6709\u5b66\u4e60\u884c\u52a8\uff0c\u4f46\u5185\u5728\u9a71\u52a8\u529b\uff08\u53d8\u73b0\uff1f\u5174\u8da3\uff1f\uff09\u4e0d\u660e\u786e\u3002\n*   **\u6b65\u9aa42 - \u8d44\u6e90\u5e95\u5ea7**\uff1a**C\u7c7b\uff08\u7ea6\u675f\u578b\uff09**\u3002\u5de5\u4f5c\u5360\u7528\u5927\u91cf\u65f6\u95f4\uff0c\u5b66\u4e60\u65f6\u95f4\u788e\u7247\u5316\u4e14\u9700\u9891\u7e41\u534f\u8c03\uff0c\u662f\u663e\u8457\u7684\u6267\u884c\u969c\u788d\u3002\n*   **\u6b65\u9aa43 - \u5fc3\u7406\u5f39\u6027**\uff1a**B\u7c7b\uff08\u4e2d\u7b49\uff09**\u3002\u6001\u5ea6\u79ef\u6781\uff0c\u914d\u5408\u5ea6\u9ad8\u3002\n*   **\u7efc\u5408\u5224\u5b9a**\uff1a**B-C\u578b\u7528\u6237**\u3002\u6709\u610f\u613f\u4f46\u8d44\u6e90\u53d7\u9650\uff0c\u9700\u9ad8\u5ea6\u4f9d\u8d56\u5916\u90e8\u65f6\u95f4\u7ba1\u7406\u548c\u5b66\u4e60\u652f\u6301\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**\uff1a**T5 \u65f6\u95f4\u532e\u4e4f\u7684\u8ddf\u5b66\u8005**\u3002\u6838\u5fc3\u7279\u5f81\u543b\u5408\uff1a\u6709\u57fa\u672c\u5b66\u4e60\u610f\u613f\uff0c\u884c\u52a8\u53d7\u5168\u804c\u5de5\u4f5c\uff08\u95e8\u5e97\u73ed\uff09\u65f6\u95f4\u8868\u4e25\u91cd\u5236\u7ea6\uff0c\u5b66\u4e60\u5b89\u6392\u88ab\u52a8\u8c03\u6574\uff0c\u5bf9\u73ed\u4e3b\u4efb\u7684\u6307\u5bfc\u8868\u73b0\u51fa\u4fe1\u4efb\u548c\u8ddf\u968f\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u9884\u671f\u843d\u5dee**\uff1a**\u4e2d\u98ce\u9669**\u3002\u9500\u552e\u8fc7\u5ea6\u5f3a\u8c03\u201c\u58f0\u97f3\u597d\u542c\u201d\u3001\u201c\u8d5b\u9053\u6709\u6210\u5c31\u201d\uff0c\u53ef\u80fd\u5851\u9020\u4e86\u4e0d\u5207\u5b9e\u9645\u7684\u53d8\u73b0\u9884\u671f\uff0c\u800c\u7528\u6237\u5b9e\u9645\u65f6\u95f4\u6295\u5165\u4e25\u91cd\u4e0d\u8db3\u3002\n    2.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u9ad8\u98ce\u9669**\u3002**\u7528\u6237\u5df2\u591a\u6b21\u56e0\u201c\u95e8\u5e97\u73ed\u201d\u8bf7\u5047\uff0c\u8fd9\u662f\u6700\u660e\u786e\u7684\u9000\u8d39\u4fe1\u53f7**\u3002\u5de5\u4f5c\u4e0e\u5b66\u4e60\u7684\u77db\u76fe\u5df2\u663e\u6027\u5316\u3002\n    3.  **\u6548\u679c\u4e0d\u4f73**\uff1a**\u4e2d\u98ce\u9669**\u3002\u82e5\u540e\u7eed\u56e0\u7ec3\u4e60\u65f6\u95f4\u4e0d\u8db3\u5bfc\u81f4\u8fdb\u6b65\u7f13\u6162\uff0c\u6613\u4ea7\u751f\u632b\u8d25\u611f\u3002\n    4.  **\u8d22\u52a1\u538b\u529b**\uff1a**\u65e0\u6cd5\u5224\u65ad**\u3002\n    5.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u65e0\u6cd5\u5224\u65ad**\u3002\n    6.  **\u7ade\u54c1\u6bd4\u8f83/\u8d1f\u9762\u4fe1\u606f**\uff1a**\u4f4e\u98ce\u9669**\u3002\u5f53\u524d\u4e92\u52a8\u79ef\u6781\uff0c\u672a\u63d0\u53ca\u3002\n    7.  **\u670d\u52a1\u4f53\u9a8c**\uff1a**\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u5bf9\u73ed\u4e3b\u4efb\u670d\u52a1\u53cd\u9988\u6b63\u9762\u3002\n*   **\u6574\u4f53\u9000\u8d39\u98ce\u9669\u7b49\u7ea7**\uff1a**\u4e2d**\u3002**\u4e3b\u8981\u98ce\u9669\u96c6\u4e2d\u4e8e\u65f6\u95f4\u51b2\u7a81\u5bfc\u81f4\u7684\u65e0\u6cd5\u6301\u7eed\u5b66\u4e60**\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u9500\u552e\u884c\u4e3a**\uff1a\u5b58\u5728**\u8f7b\u5ea6\u5938\u5927\u503e\u5411**\uff08\u5982\u201c\u672a\u6765\u5728\u8fd9\u4e2a\u8d5b\u9053\u4e0a\u53ef\u80fd\u4f1a\u8d70\u5f97\u975e\u5e38\u4e0d\u9519\u201d\uff09\uff0c\u4f46\u5c1a\u672a\u53d1\u73b0\u627f\u8bfa\u4fdd\u5e95\u6536\u5165\u3001\u4f2a\u9020\u6210\u529f\u6848\u4f8b\u7b49**\u7ea2\u7ebf\u95ee\u9898**\u3002\u9500\u552e\u4ee5\u4e13\u4e1a\u70b9\u8bc4\u5efa\u7acb\u4fe1\u4efb\uff0c\u65b9\u5f0f\u53ef\u63a5\u53d7\u3002\n*   **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u672a\u5728\u6c9f\u901a\u521d\u671f\u5145\u5206\u63a2\u67e5\u5e76\u5bf9\u9f50\u7528\u6237\u7684\u65f6\u95f4\u53ef\u7528\u6027\uff0c\u5bf9\u201c\u95e8\u5e97\u73ed\u201d\u8fd9\u4e00\u660e\u663e\u7684\u65f6\u95f4\u969c\u788d\u672a\u8fdb\u884c\u98ce\u9669\u63d0\u793a\u6216\u5b66\u4e60\u8ba1\u5212\u8c03\u6574\u8ba8\u8bba\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**\uff1a**\u504f\u5dee**\u3002\u7528\u6237\u65f6\u95f4\u9ad8\u5ea6\u4e0d\u56fa\u5b9a\uff0c\u4e0e\u9700\u8981\u56fa\u5b9a\u76f4\u64ad\u4e92\u52a8\u6216\u9ad8\u5f3a\u5ea6\u7ec3\u4e60\u7684\u6807\u51c6\u5316\u4ea7\u54c1\u5b58\u5728\u9519\u914d\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**24h\u5185\u8fdb\u884c\u65f6\u95f4\u76d8\u70b9\u4e0e\u9884\u671f\u5bf9\u9f50**\u3002\n*   **\u5177\u4f53\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u7d27\u6025\u6c9f\u901a**\uff1a\u7acb\u5373\u79c1\u4fe1\u7528\u6237\uff0c\u6b63\u5f0f\u4e86\u89e3\u5176\u6bcf\u5468\u53ef\u7528\u4e8e\u5b66\u4e60\u548c\u7ec3\u4e60\u7684\u56fa\u5b9a\u65f6\u95f4\u6bb5\uff0c\u5e76\u660e\u786e\u6307\u51fa\u5f53\u524d\u8bf7\u5047\u9891\u7387\u5bf9\u5b66\u4e60\u6548\u679c\u7684\u5f71\u54cd\u3002\n    2.  **\u9884\u671f\u7ba1\u7406**\uff1a\u57fa\u4e8e\u5176\u65f6\u95f4\u6295\u5165\u7684\u5b9e\u9645\u60c5\u51b5\uff0c\u6821\u6b63\u5b66\u4e60\u76ee\u6807\uff0c\u5c06\u91cd\u70b9\u4ece\u201c\u5feb\u901f\u53d8\u73b0\u201d\u8f6c\u5411\u201c\u5229\u7528\u788e\u7247\u65f6\u95f4\u592f\u5b9e\u57fa\u7840\uff08\u5982\u666e\u901a\u8bdd\uff09\u201d\u3002\n    3.  **\u65b9\u6848\u8c03\u6574**\uff1a\u63d0\u4f9b\u7075\u6d3b\u7684\u5b66\u4e60\u65b9\u6848\uff0c\u5982\u91cd\u70b9\u63a8\u8350\u5f55\u64ad\u8bfe\u3001\u5f02\u6b65\u4f5c\u4e1a\u70b9\u8bc4\u3001\u788e\u7247\u5316\u7ec3\u4e60\u4efb\u52a1\uff0c\u964d\u4f4e\u5bf9\u540c\u6b65\u76f4\u64ad\u7684\u4f9d\u8d56\u3002\n    4.  **\u6301\u7eed\u5173\u6ce8**\uff1a\u9996\u6708\u7d27\u5bc6\u8ddf\u8e2a\u5176\u5b9e\u9645\u51fa\u52e4\u4e0e\u4f5c\u4e1a\u5b8c\u6210\u60c5\u51b5\uff0c\u82e5\u65f6\u95f4\u95ee\u9898\u65e0\u6cd5\u89e3\u51b3\uff0c\u9700\u63d0\u524d\u9884\u8b66\u5b66\u4e60\u4e2d\u65ad\u98ce\u9669\u3002\n\n{\"core_type\": \"T5 \u65f6\u95f4\u532e\u4e4f\u7684\u8ddf\u5b66\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"24h\u5185\u8fdb\u884c\u65f6\u95f4\u76d8\u70b9\u4e0e\u9884\u671f\u5bf9\u9f50\"}";
        document.getElementById('content').innerHTML = marked.parse(markdownText);
    </script>
