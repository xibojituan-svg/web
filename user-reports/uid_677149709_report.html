    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677149709 (\u6635\u79f0\uff1a\u5723\u6770\u7269\u6d41 \u9648\u4f73\u946b) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u8096\u5c0f\u4ea67(\u8096\u6167\u5a1f) / \u5143\u8bed\u8005(\u8096\u6167\u5a1f) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b (2\u4e2a\u67083980\u5143 / 4\u4e2a\u67087380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u672a\u77e5** (\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c**\u5173\u952e\u4fe1\u606f\u7f3a\u5931\uff0c\u9700\u8b66\u60d5C2\u7c7b\u98ce\u9669**) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u6709\u4e3b\u4e1a\uff0c\u95f2\u6687\u65f6\u95f4\u5b66\u4e60\uff0c\u665a\u95f4\u6709\u5e94\u916c) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u672a\u77e5** (\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff0c**\u5173\u952e\u4fe1\u606f\u7f3a\u5931**) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49** (\u6709\u4e92\u52a8\uff0c\u4f46\u5173\u952e\u51b3\u7b56\u4fe1\u606f\u5982\u652f\u4ed8\u80fd\u529b\u3001\u5bb6\u5ead\u652f\u6301\u5ea6\u7f3a\u5931) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e\uff0c\u4f46\u4f34\u968f\u5bf9\u81ea\u8eab\u80fd\u529b\u3001\u65f6\u95f4\u3001\u56e2\u961f\u534f\u4f5c\u7684\u62c5\u5fe7\uff0c\u52a8\u673a\u4e2d\u6df7\u6742\u4e86\u201c\u8bd5\u4e00\u8bd5\u201d\u7684\u8c28\u614e\u548c\u5b66\u4e60\u63d0\u5347\u7684\u610f\u613f\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u56e0\u4e3a\u6211\u6709\u4e3b\u4e1a \u5c31\u662f\u95f2\u6687\u65f6\u95f4\u60f3\u901a\u8fc7\u8bfb\u4e66\u591a\u5b66\u4e60\u7684\u540c\u65f6\u8fd8\u80fd\u8d5a\u70b9\u5916\u5feb\u201d\n  > \u201c\u5e08\u59d0 \u6211\u662f\u62b1\u7740\u8bd5\u4e00\u8bd5\u7684\u6001\u5ea6\u6765\u7684 \uff0c\u6211\u60f3\u5b66\u4e60 \u6015\u6211\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\u201d\n  > \u201c\u5e08\u59d0 \u8981\u4e0d\u4f60\u770b\u8fd9\u6837\u884c\u4e0d\u884c\uff0c\u60a8\u7ed9\u6211\u5e03\u7f6e\u4f5c\u4e1a \u6211\u4e0d\u8981\u4efb\u4f55\u62a5\u916c\uff0c\u5148\u7ed9\u60a8\u505a\u4e00\u4e2a\u661f\u671f\u6216\u534a\u4e2a\u6708 \uff0c\u60a8\u770b\u6211\u884c\u4e0d\u884c\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u5bf93980/7380\u7684\u8bfe\u7a0b\u4ef7\u683c\u6709\u660e\u786e\u8be2\u95ee\u548c\u5bf9\u6bd4\uff0c\u672a\u8868\u73b0\u51fa\u8d44\u91d1\u538b\u529b\uff0c\u4f46\u4e5f\u672a\u663e\u793a\u5145\u88d5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u6709\u4e3b\u4e1a\uff0c\u65f6\u95f4\u788e\u7247\u5316\u4e14\u4e0d\u786e\u5b9a\uff08\u201c\u6211\u7684\u65f6\u95f4\u4e0d\u592a\u786e\u5b9a \u4f46\u662f\u6211\u786e\u5b9e\u6709\u81ea\u7531\u7684\u65f6\u95f4\u201d\uff09\uff0c\u665a\u95f4\u6709\u5e94\u916c\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u672a\u77e5** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff0c**\u77ed\u677f\u672a\u77e5\uff0c\u9700\u6838\u67e5**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b07\u4f4e\u6781\u5371**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56**\u3002\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u81ea\u6211\u6000\u7591\u3001\u5bb3\u6015\u62d6\u7d2f\u4ed6\u4eba\u3001\u9700\u8981\u5916\u90e8\u5f3a\u80af\u5b9a\u6765\u5efa\u7acb\u4fe1\u5fc3\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u6015\u62d6\u5408\u4f5c\u4f19\u4f34\u7684\u540e\u817f\u201d\n  > \u201c\u5e08\u59d0 \u6211\u662f\u62b1\u7740\u8bd5\u4e00\u8bd5\u7684\u6001\u5ea6\u6765\u7684 \uff0c\u6211\u60f3\u5b66\u4e60 \u6015\u6211\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\u201d\n  > \u201c\u5e08\u59d0\u6211\u6709\u60f3\u6cd5 \u4f46\u662f\u6211\u770b\u6709\u4e4b\u524d\u5b66\u7684\u5b66\u5458\u8bf4 \u5206\u914d\u8bfb\u4e66\u8d44\u6e90\u5f88\u5c11 \u6d6a\u8d39\u65f6\u95f4\u4e5f\u6323\u4e0d\u4e86\u591a\u5c11\u94b1 \u6709\u70b9\u72b9\u8c6b\u4e86\u201d (**\u6781\u6613\u53d7\u5916\u90e8\u8d1f\u9762\u8bc4\u4ef7\u5f71\u54cd**)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 (\u7126\u8651\u4fdd\u969c) \u4e0e \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42 (\u5c0a\u91cd\u5f52\u5c5e)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u4e0d\u786e\u5b9a\u6027\u7684\u6df1\u5ea6\u6050\u60e7**\u3002\u65e2\u5bb3\u6015\u6295\u5165\u65f6\u95f4\u91d1\u94b1\u540e\u65e0\u6cd5\u53d8\u73b0\uff08\u5b89\u5168\u9700\u6c42\uff09\uff0c\u53c8\u5bb3\u6015\u56e0\u80fd\u529b\u4e0d\u8db3\u5728\u56e2\u961f\u534f\u4f5c\u4e2d\u88ab\u5426\u5b9a\u3001\u62d6\u540e\u817f\uff08\u5c0a\u91cd\u4e0e\u5f52\u5c5e\u9700\u6c42\uff09\u3002\u4ed6\u7684\u72b9\u8c6b\u4e0d\u51b3\u6e90\u4e8e\u5bf9\u201c\u5931\u8d25\u201d\u548c\u201c\u4e0d\u88ab\u8ba4\u53ef\u201d\u7684\u53cc\u91cd\u7126\u8651\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u4f60\u88ab\u9009\u4e2d\u4e86\u201d\u7684\u786e\u5b9a\u611f\u4e0e\u201c\u4f60\u4e0d\u4f1a\u88ab\u629b\u5f03\u201d\u7684\u5b89\u5168\u627f\u8bfa**\u3002\u9700\u8981\u63d0\u4f9b\u6e05\u6670\u7684\u8def\u5f84\u3001\u964d\u4f4e\u8bd5\u9519\u6210\u672c\uff08\u5982\u5206\u9636\u6bb5\u4ed8\u8d39\uff09\u3001\u5e76\u7ed9\u4e88\u6301\u7eed\u7684\u4e2a\u4eba\u5173\u6ce8\u4e0e\u80af\u5b9a\uff0c\u5efa\u7acb\u5e08\u5f92\u822c\u7684\u5f3a\u4fe1\u4efb\u5173\u7cfb\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u4e25\u91cd\u5185\u8017) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u672a\u53d1\u73b0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u8a00\u8bba)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a/\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u4fe1\u606f\u7f3a\u5931\uff0c\u82e5\u4e3a\u9690\u7792\u62a5\u540d\uff0c\u540e\u7eed\u538b\u529b\u5927\u65f6\u6613\u7206\u53d1\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | \u4e3b\u4e1a\u7e41\u5fd9+\u5e94\u916c\u591a\uff0c\u6781\u6613\u56e0\u65f6\u95f4\u51b2\u7a81\u5bfc\u81f4\u8bfe\u7a0b\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u7126\u8651\u548c\u81ea\u8d23\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u4efb\u4f55\u5fae\u5c0f\u7684\u632b\u6298\uff08\u5982\u8bd5\u97f3\u5931\u8d25\u3001\u4f5c\u4e1a\u88ab\u6279\u3001\u770b\u5230\u4ed6\u4eba\u8d1f\u9762\u8bc4\u4ef7\uff09\u90fd\u53ef\u80fd\u89e6\u53d1\u5176\u201c\u6211\u679c\u7136\u4e0d\u884c\u201d\u7684\u81ea\u6211\u5426\u5b9a\uff0c\u8fdb\u800c\u8981\u6c42\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | \u5bf9\u201c\u8fb9\u5b66\u8fb9\u63a5\u5355\u201d\u62b1\u6709\u671f\u5f85\uff0c\u82e51-2\u4e2a\u6708\u5185\u672a\u83b7\u5f97\u4efb\u4f55\u6b63\u53cd\u9988\uff08\u54ea\u6015\u662f\u5c0f\u989d\u6536\u5165\uff09\uff0c\u4f1a\u8fc5\u901f\u8d28\u7591\u8bfe\u7a0b\u4ef7\u503c\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c3-4\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u5b66\u4e60\u96be\u5ea6\u589e\u52a0\uff0c\u82e5\u672a\u83b7\u5f97\u4efb\u4f55\u63a5\u5355\u673a\u4f1a\u6216\u6b63\u9762\u9f13\u52b1\uff0c\u5176\u7d2f\u79ef\u7684\u81ea\u6211\u6000\u7591\u5c06\u8fbe\u5230\u9876\u5cf0\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4f73\u946b\uff0c\u770b\u5230\u4f60\u62a5\u540d\u4e86\uff0c\u7279\u522b\u4e3a\u4f60\u5f00\u5fc3\uff01\u6211\u77e5\u9053\u4f60\u65f6\u95f4\u6bd4\u8f83\u5fd9\uff0c\u5fc3\u91cc\u53ef\u80fd\u4e5f\u62c5\u5fc3\u81ea\u5df1\u8ddf\u4e0d\u4e0a\u3002\u522b\u6015\uff0c\u54b1\u4eec\u8fd9\u4e2a\u73ed\u5c31\u662f\u4e3a\u6709\u4e3b\u4e1a\u7684\u670b\u53cb\u8bbe\u8ba1\u7684\uff0c\u8fdb\u5ea6\u5b8c\u5168\u81ea\u5df1\u638c\u63a7\u3002\u6211\u5df2\u7ecf\u8ddf\u70b9\u8bc4\u8001\u5e08\u6253\u8fc7\u62db\u547c\u4e86\uff0c\u4f1a\u7279\u522b\u5173\u6ce8\u4f60\u7684\u4f5c\u4e1a\uff0c\u6709\u4efb\u4f55\u4e00\u70b9\u5c0f\u8fdb\u6b65\u6211\u90fd\u4f1a\u7b2c\u4e00\u65f6\u95f4\u544a\u8bc9\u4f60\u3002\u4f60\u4e0d\u662f\u4e00\u4e2a\u4eba\u5728\u6218\u6597\uff0c\u5e08\u59d0\uff08\u6211\uff09\u4f1a\u4e00\u76f4\u966a\u7740\u4f60\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u7a33\u7a33\u5730\u6765\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\u3011**\u3002\u6838\u5fc3\u76ee\u6807\u662f\u5efa\u7acb\u5b89\u5168\u611f\uff0c\u6d88\u9664\u7126\u8651\uff0c\u800c\u975e\u6025\u4e8e\u63a8\u9ad8\u96be\u5ea6\u5185\u5bb9\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n  1.  **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305 (\u6ee1\u914dC\u6a21\u5757)\u3011**\uff1a\u73ed\u4e3b\u4efb\u9700\u9ad8\u9891\u6b21\u3001\u5938\u5f20\u5316\u5730\u8fdb\u884c1v1\u9f13\u52b1\u3002\u4f5c\u4e1a\u70b9\u8bc4\u4ee5\u201c\u53d1\u73b0\u95ea\u5149\u70b9\u201d\u4e3a\u4e3b\uff0c\u6280\u672f\u7ea0\u9519\u4e3a\u8f85\u3002\n  2.  **\u3010\u964d\u7ef4\u4efb\u52a1\u62c6\u89e3\u5305 (\u7279\u79cdA\u6a21\u5757)\u3011**\uff1a\u5c06\u6bcf\u5468\u5b66\u4e60\u4efb\u52a1\u62c6\u89e3\u6210\u201c\u50bb\u74dc\u5f0f\u201d\u6bcf\u65e5\u6307\u4ee4\uff08\u5982\u201c\u4eca\u5929\u53ea\u7ec310\u5206\u949f\u6c14\u606f\u201d\uff09\uff0c\u964d\u4f4e\u5176\u9762\u5bf9\u590d\u6742\u8bfe\u7a0b\u4f53\u7cfb\u7684\u754f\u96be\u60c5\u7eea\u3002\n  3.  **\u3010\u5c0f\u6b65\u5feb\u8dd1\u63a5\u5355\u4f53\u9a8c\u5305 (\u8f7b\u91cfB\u6a21\u5757)\u3011**\uff1a\u5728\u5176\u5b66\u4e60\u521d\u671f\uff081\u4e2a\u6708\u5185\uff09\uff0c\u4f18\u5148\u5b89\u6392\u6781\u4f4e\u95e8\u69db\u3001\u9ad8\u6210\u529f\u7387\u7684\u201c\u4f53\u9a8c\u5355\u201d\uff08\u5982\u51e0\u5206\u949f\u7684\u77ed\u6587\uff09\uff0c\u54ea\u6015\u62a5\u916c\u6781\u4f4e\uff0c\u76ee\u7684\u662f\u5feb\u901f\u5efa\u7acb\u201c\u6211\u80fd\u884c\u201d\u7684\u6b63\u53cd\u9988\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n  1.  \u4f7f\u7528\u201c\u522b\u4eba\u90fd\u884c\u4f60\u600e\u4e48\u4e0d\u884c\u201d\u7b49\u5bf9\u6bd4\u8bdd\u672f\u3002\n  2.  \u5728\u5176\u8868\u8fbe\u7126\u8651\u65f6\uff0c\u7528\u201c\u4f60\u60f3\u591a\u4e86\u201d\u6577\u884d\u3002\n  3.  \u5728\u5176\u672a\u5b8c\u6210\u4f5c\u4e1a\u65f6\u516c\u5f00\u6279\u8bc4\u6216\u65bd\u52a0\u538b\u529b\u3002\n  4.  \u8fc7\u65e9\u63a8\u8350\u9ad8\u5ba2\u5355\u4ef7\u8fdb\u9636\u8bfe\u6216\u6602\u8d35\u8bbe\u5907\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u7b2c\u4e00\u4e2a\u6708\u5185\u8fdb\u884c\u4efb\u4f55\u5347\u5355**\u3002\u5f85\u5176\u901a\u8fc7\u5c0f\u5355\u5efa\u7acb\u4fe1\u5fc3\u3001\u60c5\u7eea\u7a33\u5b9a\u540e\uff0c\u53ef\u8bd5\u63a2\u6027\u63a8\u8350500\u5143\u4ee5\u5185\u7684\u5fae\u5347\u5355\uff08\u5982\u4e13\u9898\u8bad\u7ec3\u8425\uff09\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u6015\u62d6\u5408\u4f5c\u4f19\u4f34\u7684\u540e\u817f\u201d \u2014\u2014 **\u5178\u578bT6\u4fe1\u53f7\uff1a\u8fc7\u5ea6\u62c5\u5fe7\u4ed6\u4eba\u8bc4\u4ef7\uff0c\u81ea\u6211\u4ef7\u503c\u611f\u4f4e\u3002**\n2. > \u201c\u5e08\u59d0 \u6211\u662f\u62b1\u7740\u8bd5\u4e00\u8bd5\u7684\u6001\u5ea6\u6765\u7684 \uff0c\u6211\u60f3\u5b66\u4e60 \u6015\u6211\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\u201d \u2014\u2014 **\u52a8\u673a\u4e0d\u7eaf\u4e14\u5fc3\u7406\u5f39\u6027\u6781\u4f4e\u7684\u8868\u73b0\u3002**\n3. > \u201c\u5e08\u59d0\u6211\u6709\u60f3\u6cd5 \u4f46\u662f\u6211\u770b\u6709\u4e4b\u524d\u5b66\u7684\u5b66\u5458\u8bf4 \u5206\u914d\u8bfb\u4e66\u8d44\u6e90\u5f88\u5c11 \u6d6a\u8d39\u65f6\u95f4\u4e5f\u6323\u4e0d\u4e86\u591a\u5c11\u94b1 \u6709\u70b9\u72b9\u8c6b\u4e86\u201d \u2014\u2014 **\u6781\u6613\u53d7\u5916\u90e8\u8d1f\u9762\u4fe1\u606f\u5f71\u54cd\uff0c\u7f3a\u4e4f\u72ec\u7acb\u5224\u65ad\u548c\u6297\u5e72\u6270\u80fd\u529b\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u4e0e\u5f52\u5c5e\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7528\u6ee1\u914dC\u6a21\u5757\uff08\u60c5\u7eea\u6258\u5e95\uff09\u548c\u964d\u7ef4A\u6a21\u5757\uff08\u4efb\u52a1\u62c6\u89e3\uff09\u6784\u5efa\u7edd\u5bf9\u5b89\u5168\u611f\uff0c\u4e25\u7981\u65bd\u52a0\u4efb\u4f55\u538b\u529b\uff0c\u5e76\u901a\u8fc7\u5c0f\u5355\u5feb\u901f\u5efa\u7acb\u6b63\u53cd\u9988\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\u4e0e\u5c0a\u91cd\u5f52\u5c5e\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
