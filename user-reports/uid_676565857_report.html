    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u4e00\u6f47\u6708-\u6e56\u5357 (UID: 676565857) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-14 \u81f3 2026-01-15 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u590f\u5929\u73ed\u73ed |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u63a8\u6d4b\u4e3a\u6709\u58f0\u4e66/\u914d\u97f3\u7c7b\u8bfe\u7a0b |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u4fe1\u606f\u4e0d\u8db3 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1 (\u65e5\u7a0b\u6781\u6ee1\uff0c\u9700\u201c\u8d76\u5730\u94c1\u505a\u65e9\u5de5\u201d\u3001\u201c\u4e0b\u73ed\u542c\u8bfe\u201d\u3001\u201c\u673a\u6784\u4e0a\u73ed\u201d\u7b49) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u4e0d\u8db3 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** - \u7f3a\u5c11\u652f\u4ed8\u3001\u5bb6\u5ead\u652f\u6301\u3001\u62a5\u540d\u52a8\u673a\u7b49\u5173\u952e\u4fe1\u606f\uff0c\u4ec5\u80fd\u57fa\u4e8e\u793e\u7fa4\u6d3b\u8dc3\u884c\u4e3a\u5206\u6790\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u804a\u5929\u4e2d\u672a\u63d0\u53ca\u53d8\u73b0\u6216\u8d5a\u94b1\uff0c\u6838\u5fc3\u5173\u6ce8\u70b9\u5728\u6280\u80fd\u5b66\u4e60\u3001\u793e\u7fa4\u534f\u4f5c\u548c\u89d2\u8272\u626e\u6f14\u7684\u4e50\u8da3\u4e0a\uff0c\u4f46\u201c\u4e3a\u4e86\u4ee5\u540e\u80fd\u5c45\u5bb6\u966a\u5b69\u5b50\uff0c\u80fd\u81ea\u7531\u4e00\u70b9\u201d\u8868\u660e\u6709\u957f\u671f\u804c\u4e1a\u8f6c\u578b\u7684\u6a21\u7cca\u671f\u671b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4e3a\u4e86\u4ee5\u540e\u80fd\u5c45\u5bb6\u966a\u5b69\u5b50\uff0c\u80fd\u81ea\u7531\u4e00\u70b9\uff0c\u73b0\u5728\u62fc\u4e86\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4fe1\u606f\u4e0d\u8db3] \u2014 \u672a\u63d0\u53ca\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4f4e] \u2014 \u65e5\u7a0b\u6781\u5176\u9971\u548c\uff1a\u201c\u8d76\u5730\u94c1\u505a\u65e9\u5de5\u3001\u4e0a\u73ed\u3001\u9009\u4e66\u3001\u6536\u96c6\u56e2\u5efa\u4fe1\u606f\u3001\u4e0b\u73ed\u542c\u8bfe\u3001\u673a\u6784\u4e0a\u73ed\u3001\u8bc6\u8bfb\u6253\u5361\u3001\u517b\u8d26\u6237\u201d\uff0c\u4e14\u81ea\u5632\u201c\u50cf\u9640\u87ba\u201d\u3002**\u65f6\u95f4\u7cbe\u529b\u662f\u660e\u663e\u77ed\u677f**\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u4e0d\u8db3] \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u5728\u793e\u7fa4\u4e2d\u626e\u6f14\u79ef\u6781\u7ec4\u7ec7\u8005\u3001\u534f\u8c03\u8005\u89d2\u8272\uff08\u7ec4\u7ec7\u4f1a\u8bae\u3001\u5206\u914d\u89d2\u8272\u3001\u9f13\u52b1\u540c\u5b66\uff09\uff0c\u60c5\u7eea\u7a33\u5b9a\u4e50\u89c2\uff0c\u672a\u89c1\u4efb\u4f55\u62b1\u6028\u6216\u6c42\u52a9\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u529e\u6cd5\u603b\u6bd4\u56f0\u96be\u591a\u201d\uff1b\u79ef\u6781\u7ec4\u7ec7\u5267\u672c\u6392\u7ec3\u3001\u534f\u8c03\u65f6\u95f4\u3001\u9f13\u52b1\u73ed\u59d4\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5728\u7e41\u91cd\u7684\u5de5\u4f5c\u548c\u751f\u6d3b\u538b\u529b\u4e0b\uff08\u201c\u50cf\u9640\u87ba\u201d\uff09\uff0c\u6e34\u671b\u901a\u8fc7\u4e00\u4e2a\u79ef\u6781\u7684\u3001\u6709\u521b\u9020\u6027\u7684\u793e\u7fa4\u83b7\u5f97\u5f52\u5c5e\u611f\u3001\u8ba4\u53ef\u548c\u60c5\u611f\u652f\u6301\uff0c\u4ee5\u5bf9\u6297\u65e5\u5e38\u7684\u67af\u71e5\u4e0e\u75b2\u60eb\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u8d4b\u4e88\u5176\u201c\u793e\u7fa4\u6838\u5fc3\u7ec4\u7ec7\u8005\u201d\u7684\u8eab\u4efd\u5149\u73af\u548c\u5c0a\u91cd**\uff0c\u8ba9\u5979\u5728\u4ed8\u51fa\u4e2d\u83b7\u5f97\u5f3a\u70c8\u7684\u88ab\u9700\u8981\u611f\u548c\u6210\u5c31\u611f\uff0c\u4ece\u800c\u83b7\u5f97\u60c5\u7eea\u6ecb\u517b\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 B \u7c7b (\u9ad8\u53c2\u4e0e\u3001\u9ad8\u4e92\u52a8\uff0c\u4f46\u8d44\u6e90\u5e95\u5ea7\u5b58\u5728\u98ce\u9669) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T1 \u5708\u517b\u9886\u8896\u578b** (\u5728\u793e\u7fa4\u4e2d\u5929\u7136\u6210\u4e3a\u7ec4\u7ec7\u8005\u3001\u6c14\u6c1b\u5e26\u52a8\u8005\u3001\u89c4\u5219\u63a8\u52a8\u8005\uff0c\u4eab\u53d7\u88ab\u5173\u6ce8\u548c\u8ba4\u53ef) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5c5e\u53cd\u5bf9\u7b49\u7ea2\u7ebf\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u5f53\u524d\u793e\u7fa4\u6295\u5165\u5ea6\u9ad8\uff0c\u5bb6\u5ead\u963b\u529b\u98ce\u9669\u6682\u65f6\u9690\u853d\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669\uff01** \u5f53\u524d\u65f6\u95f4\u5df2\u6781\u5ea6\u9971\u548c(\u201c\u50cf\u9640\u87ba\u201d)\uff0c\u82e5\u8bfe\u7a0b\u4efb\u52a1\u91cf\u53e0\u52a0\u6216\u5de5\u4f5c\u751f\u6d3b\u7a81\u53d1\u53d8\u6545\uff0c\u6781\u6613\u56e0\u65f6\u95f4\u7cbe\u529b\u5d29\u6e83\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u793e\u7fa4\u89d2\u8272\u7a33\u56fa\uff0c\u4e0d\u6613\u56e0\u5b66\u4e60\u632b\u6298\u7834\u9632\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u957f\u671f\u201c\u5c45\u5bb6\u81ea\u7531\u201d\u7684\u671f\u671b\u82e5\u5728\u8bfe\u7a0b\u4e2d\u671f\u672a\u770b\u5230\u6e05\u6670\u8def\u5f84\uff0c\u53ef\u80fd\u4ea7\u751f\u5931\u671b\u60c5\u7eea\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-4\u5468**\uff0c\u5f53\u8bfe\u7a0b\u56fa\u5b9a\u4efb\u52a1\u3001\u793e\u7fa4\u8fd0\u8425\u804c\u8d23\u4e0e\u539f\u6709\u7e41\u5fd9\u65e5\u7a0b\u4ea7\u751f\u4e0d\u53ef\u8c03\u548c\u7684\u51b2\u7a81\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4e00\u6f47\u6708\uff0c\u6211\u770b\u4f60\u5728\u7fa4\u91cc\u7b80\u76f4\u5c31\u662f\u54b1\u4eec\u73ed\u7684\u2018\u5b9a\u6d77\u795e\u9488\u2019\uff0c\u7ec4\u7ec7\u6392\u7ec3\u3001\u9f13\u52b1\u540c\u5b66\u6837\u6837\u5728\u884c\u3002\u7279\u522b\u4f69\u670d\u4f60\u5728\u8fd9\u4e48\u5fd9\u7684\u60c5\u51b5\u4e0b\u8fd8\u80fd\u8fd9\u4e48\u6295\u5165\u3002\u54b1\u4eec\u8bfe\u7a0b\u8bbe\u8ba1\u4e0a\uff0c\u4f60\u5b8c\u5168\u53ef\u4ee5\u6839\u636e\u81ea\u5df1\u7684\u8282\u594f\u6765\uff0c**\u4f60\u7684\u6838\u5fc3\u4ef7\u503c\u662f\u5e26\u52a8\u5927\u5bb6\uff0c\u800c\u4e0d\u662f\u88ab\u4f5c\u4e1a\u62d6\u57ae**\u3002\u6709\u4efb\u4f55\u65f6\u95f4\u5b89\u6392\u4e0d\u8fc7\u6765\u7684\uff0c\u968f\u65f6\u8ddf\u6211\u6c9f\u901a\uff0c\u6211\u4eec\u4e00\u8d77\u8c03\u6574\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf**\u3011\u2014\u2014 \u8d4b\u4e88\u5176\u201c\u73ed\u59d4\u201d\u3001\u201c\u5c0f\u7ec4\u957f\u201d\u7b49\u6b63\u5f0f\u8eab\u4efd\uff0c\u8ba9\u5176\u7ec4\u7ec7\u6d3b\u52a8\u3001\u5206\u4eab\u7ecf\u9a8c\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u65f6\u95f4\u7ba1\u7406\u8f7b\u91cf\u5305**\u3011\u2014\u2014 \u63d0\u4f9b\u7075\u6d3b\u7684\u4efb\u52a1\u5b8c\u6210\u65b9\u6848\uff0c\u5141\u8bb8\u5176\u7528\u201c\u7ec4\u7ec7\u534f\u8c03\u5de5\u4f5c\u201d\u62b5\u6263\u90e8\u5206\u786c\u6027\u4f5c\u4e1a\uff0c**\u6838\u5fc3\u662f\u51cf\u8f7b\u5176\u8bfe\u4e1a\u538b\u529b\uff0c\u4fdd\u5168\u5176\u793e\u7fa4\u70ed\u60c5**\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7ed9\u5979\u5e03\u7f6e\u8fc7\u91cf\u3001\u6b7b\u677f\u7684\u786c\u6027\u4f5c\u4e1a\uff0c\u5c06\u5176\u5f53\u6210\u666e\u901a\u5b66\u5458\u8fdb\u884c\u673a\u68b0\u5316\u7684\u5b66\u4e60\u8fdb\u5ea6\u50ac\u6536\u3002\u8fd9\u4f1a\u6d88\u8017\u5979\u7684\u70ed\u60c5\u5e76\u5f15\u7206\u65f6\u95f4\u5371\u673a\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u8bfe\u7a0b\u524d\u671f\u8fdb\u884c\u4efb\u4f55\u5347\u5355**\u3002\u5e94\u5148\u7a33\u56fa\u5176\u793e\u7fa4\u9886\u8896\u5730\u4f4d\uff0c\u5f85\u5176\u4ece\u4e2d\u83b7\u5f97\u8db3\u591f\u6210\u5c31\u611f\u548c\u5f52\u5c5e\u611f\u540e\uff0c\u518d\u8003\u8651\u57fa\u4e8e\u201c\u6df1\u5ea6\u8d4b\u80fd\u201d\u89d2\u5ea6\u63a8\u8350\u9ad8\u9636\u8bfe\u7a0b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u52a0\u6cb9\uff0c\u50cf\u6211\u4eec\u4ec0\u4e48\u90fd\u5b66\u7684\uff0c\u786e\u5b9e\u50cf\u9640\u87ba\u201d \u2014\u2014 **\u8d44\u6e90\u5e95\u5ea7\uff08\u65f6\u95f4\u7cbe\u529b\uff09\u77ed\u677f\u81ea\u8bc1**\n2. > \u201c\u4f60\u4eec\u4e24\u4e2a\u662f\u6211\u4eec\u73ed\u7684\u56e2\u5ba0...\u6709\u4ed6\u4eec\u4e24\uff0c\u73ed\u73ed\u4e0d\u7528\u591a\u64cd\u5fc3\u7684\u201d \u2014\u2014 **T1\u5708\u517b\u9886\u8896\u539f\u578b\uff1a\u4e3b\u52a8\u7ba1\u7406\u793e\u7fa4\u3001\u5206\u62c5\u73ed\u73ed\u538b\u529b**\n3. > \u201c\u4e3a\u4e86\u4ee5\u540e\u80fd\u5c45\u5bb6\u966a\u5b69\u5b50\uff0c\u80fd\u81ea\u7531\u4e00\u70b9\uff0c\u73b0\u5728\u62fc\u4e86\u201d \u2014\u2014 **\u4e2d\u7eaf\u5ea6\u52a8\u673a\uff1a\u957f\u671f\u613f\u666f\u9a71\u52a8\uff0c\u975e\u6025\u529f\u8fd1\u5229**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T1 \u5708\u517b\u9886\u8896\u578b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u9ad8\u538b\u751f\u6d3b\u4e2d\u83b7\u5f97\u793e\u7fa4\u5f52\u5c5e\u4e0e\u5c0a\u91cd\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5c06\u5176\u8f6c\u5316\u4e3a\u201c\u73ed\u59d4\u201d\uff0c\u7528\u8eab\u4efd\u8363\u8a89\u66ff\u4ee3\u8bfe\u4e1a\u538b\u529b\uff0c\u4e25\u9632\u65f6\u95f4\u5d29\u76d8\u3011**\u3002\n\n```json\n{\"core_type\": \"T1 \u5708\u517b\u9886\u8896\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u793e\u4ea4/\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\"}\n```";
