        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u5409\u7965\u65e0\u8fb9 (UID: 676968360) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-02-28 \u81f3 2026-03-06 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6e05\u6e05\u673d\u67083(\u5b59\u971e) / \u76ae\u86cb\u4e0d\u5410\u76ae(\u5468\u598d) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u64ad\u6709\u58f0\u4e66\u6f14\u64ad\u7cfb\u7edf\u8bfe (\u5df2\u4ed8\u8d39) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u5145\u88d5 (\u804a\u5929\u4e2d\u65e0\u4efb\u4f55\u5173\u4e8e\u652f\u4ed8\u538b\u529b\u7684\u8ba8\u8bba) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1 (\u9700\u7167\u987e\u5b69\u5b50\u3001\u5904\u7406\u5bb6\u5ead\u4e8b\u52a1\u3001\u4e34\u65f6\u5916\u51fa) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u5df2\u62a5\u5907\u5e76\u652f\u6301 (\u7528\u6237\u63d0\u53ca\u201c\u5c0f\u5b69\u7684\u73ed\u7ea7\u7fa4\u201d\uff0c\u8868\u660e\u6709\u5bb6\u5ead\uff0c\u4f46\u65e0\u53cd\u5bf9\u8ff9\u8c61\uff0c\u4e14\u5b66\u4e60\u884c\u4e3a\u81ea\u7136) |\n| **\u4fe1\u606f\u539a\u5ea6** | \u9971\u6ee1 (\u4e92\u52a8\u9891\u7e41\uff0c\u4e3b\u52a8\u63d0\u95ee\uff0c\u66b4\u9732\u4e86\u5b66\u4e60\u72b6\u6001\u3001\u5bb6\u5ead\u60c5\u51b5\u3001\u65f6\u95f4\u5b89\u6392) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u800c\u6765\uff0c\u5173\u6ce8\u6280\u80fd\u5b66\u4e60\u672c\u8eab\uff0c\u5bf9\u53d8\u73b0\u65e0\u6025\u5207\u8981\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u7684\u76ee\u7684\u662f\u6765\u5b66\u4e60\uff0c\u5b66\u64ad\u97f3\u6280\u80fd\u3002\u201d > \u201c\u53d7\u76ca\u532a\u6d45[\u5f3a][\u5f3a][\u5f3a]\u201d > \u201c\u611f\u89c9\u559c\u9a6c\u62c9\u96c5\u725b\u5f97\u5f88\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a\u9ad8 \u2014 \u5df2\u5168\u6b3e\u652f\u4ed8\uff0c\u65e0\u7ecf\u6d4e\u538b\u529b\u8868\u8ff0\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a\u4e2d \u2014 \u6709\u5168\u804c\u5de5\u4f5c\u6216\u5bb6\u5ead\u4e3b\u5987\u804c\u8d23\uff0c\u65f6\u95f4\u88ab\u80b2\u513f\uff08\u201c\u5c0f\u5b69\u7684\u73ed\u7ea7\u7fa4\u201d\uff09\u3001\u5bb6\u5ead\u4e8b\u52a1\uff08\u7236\u4eb2\u751f\u75c5\u966a\u62a4\uff09\u5207\u5272\uff0c\u4f46\u80fd\u4e3b\u52a8\u5b89\u6392\u5b66\u4e60\uff08\u201c\u4eca\u5929\u770b\u4e86\uff0c\u4e5f\u505a\u4e86\u7b14\u8bb0\u201d\uff09\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a\u9ad8 \u2014 \u5bb6\u5ead\u60c5\u51b5\u6b63\u5e38\u63d0\u53ca\uff0c\u65e0\u53cd\u5bf9\u6216\u9690\u7792\u8ff9\u8c61\uff0c\u5b66\u4e60\u884c\u4e3a\u672a\u53d7\u5bb6\u5ead\u963b\u529b\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\uff0c\u9047\u5230\u56f0\u96be\u4e3b\u52a8\u63d0\u95ee\u5e76\u5bfb\u6c42\u5177\u4f53\u89e3\u51b3\u65b9\u6cd5\uff0c\u5fc3\u6001\u79ef\u6781\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u73ed\u73ed\uff0c\u538b\u55d3\u5b50\u662f\u4ec0\u4e48\u539f\u56e0\u7684\uff1f\u662f\u4e0d\u662f\u5589\u5499\u8fd8\u6ca1\u6253\u5f00\uff1f\u201d > \u201c\u5341\u4e2a\u67a3\u6362\u6c14\u8fd8\u63a5\u53d7\u5f97\u6765\uff0c\u4e24\u4e2a\u67a3\u6362\u6c14\uff0c\u5988\u5440\uff0c\u6709\u70b9\u624b\u5fd9\u811a\u4e71[\u5077\u7b11]\u201d (\u4ee5\u8f7b\u677e\u53e3\u543b\u9762\u5bf9\u56f0\u96be) > \u201c\u4f46\u662f\u6211\u8fd8\u4e0d\u61c2\u600e\u4e48\u5e94\u7528\u3002\u5148\u5b66\u4e86\u518d\u8bf4\u3002\u201d (\u52a1\u5b9e\u4e14\u8010\u5fc3)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5728\u5bb6\u5ead\u89d2\u8272\uff08\u6bcd\u4eb2\u3001\u5973\u513f\uff09\u548c\u65e5\u5e38\u7410\u4e8b\u4e4b\u5916\uff0c\u6e34\u671b\u83b7\u5f97\u4e00\u4e2a\u80fd\u8bc1\u660e\u81ea\u6211\u4ef7\u503c\u3001\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u548c\u793e\u7fa4\u5f52\u5c5e\u7684\u65b0\u8eab\u4efd\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u8fdb\u6b65\u611f**\uff0c\u4ee5\u53ca\u5c06\u5979\u7eb3\u5165\u4e00\u4e2a\u79ef\u6781\u5411\u4e0a\u7684\u5b66\u4e60\u793e\u7fa4\uff0c\u8ba9\u5979\u611f\u53d7\u5230\u201c\u88ab\u770b\u89c1\u201d\u548c\u201c\u5728\u6210\u957f\u201d\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 B \u7c7b (\u52a8\u673a\u7eaf\u3001\u8d44\u6e90\u4e2d\u3001\u5f39\u6027\u9ad8\uff0c\u662f\u6838\u5fc3\u57f9\u517b\u7528\u6237) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u4e3b\u52a8\u5b66\u4e60\u3001\u8ba4\u771f\u505a\u7b14\u8bb0\u3001\u79ef\u6781\u63d0\u95ee\u3001\u4e0d\u5f20\u626c\u4f46\u6e34\u671b\u8fdb\u6b65) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u5bb6\u5ead\u77e5\u60c5\u4e14\u652f\u6301\uff0c\u7236\u4eb2\u751f\u75c5\u7b49\u7a81\u53d1\u4e8b\u4ef6\u5c5e\u6b63\u5e38\u5bb6\u5ead\u8d23\u4efb\uff0c\u975e\u5b66\u4e60\u963b\u529b\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4e2d | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u65f6\u95f4\u88ab\u5bb6\u5ead\u4e8b\u52a1\u4e25\u91cd\u6324\u5360\uff0c\u5bfc\u81f4\u4f5c\u4e1a\u79ef\u538b\u3001\u65e0\u6cd5\u8ddf\u4e0a\u76f4\u64ad\uff0c\u4ea7\u751f\u81ea\u8d23\u548c\u632b\u8d25\u611f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u6001\u79ef\u6781\uff0c\u5c06\u7ec3\u4e60\u4e2d\u7684\u56f0\u96be\u5e7d\u9ed8\u5316\uff08\u201c\u820c\u5934\u6253\u6b6a\u4e86\u201d\uff09\uff0c\u4e3b\u52a8\u6c42\u89e3\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u52a8\u673a\u4e3a\u5b66\u4e60\u6280\u80fd\uff0c\u975e\u77ed\u671f\u53d8\u73b0\uff0c\u5bf9\u6536\u76ca\u9884\u671f\u7ba1\u7406\u826f\u597d\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe\u7b2c2-3\u5468\uff0c\u5f53\u8bfe\u7a0b\u5185\u5bb9\u52a0\u6df1\u3001\u4f5c\u4e1a\u91cf\u589e\u52a0\uff0c\u4e0e\u5bb6\u5ead\u7a81\u53d1\u4e8b\u52a1\uff08\u5982\u5bb6\u4eba\u5065\u5eb7\u95ee\u9898\uff09\u53e0\u52a0\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5409\u7965\u4f60\u597d\u5440\uff0c\u770b\u5230\u4f60\u7b14\u8bb0\u505a\u5f97\u7279\u522b\u8ba4\u771f\uff0c\u63d0\u95ee\u4e5f\u90fd\u5728\u70b9\u5b50\u4e0a\uff0c\u662f\u54b1\u4eec\u73ed\u7684\u2018\u9690\u5f62\u5b66\u9738\u2019\u6ca1\u9519\u4e86\uff01\u54b1\u4eec\u8bfe\u7a0b\u8bbe\u8ba1\u5c31\u662f\u4e3a\u50cf\u4f60\u8fd9\u6837\u60f3\u624e\u5b9e\u5b66\u672c\u4e8b\u7684\u4eba\u51c6\u5907\u7684\u3002\u77e5\u9053\u4f60\u5e73\u65f6\u8981\u517c\u987e\u5bb6\u5ead\uff0c\u65f6\u95f4\u5b9d\u8d35\uff0c\u6240\u4ee5\u522b\u62c5\u5fc3\u8fdb\u5ea6\uff0c\u54b1\u4eec\u7684\u6838\u5fc3\u662f\u2018\u5b66\u61c2\u7ec3\u4f1a\u2019\uff0c\u800c\u4e0d\u662f\u2018\u5237\u5b8c\u4efb\u52a1\u2019\u3002\u6709\u4efb\u4f55\u65f6\u95f4\u51b2\u7a81\u968f\u65f6\u8ddf\u6211\u8bf4\uff0c\u54b1\u4eec\u4e00\u8d77\u8c03\u6574\u8ba1\u5212\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011\u2014 \u5339\u914d\u5176T2\u5b9e\u5e72\u7279\u8d28\uff0c\u63d0\u4f9b\u624e\u5b9e\u7684\u6280\u5de7\u8bad\u7ec3\u548c\u6df1\u5ea6\u5185\u5bb9\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010\u65f6\u95f4\u5f39\u6027\u652f\u6301\u5305\u3011\u2014 \u660e\u786e\u544a\u77e5\u76f4\u64ad\u6709\u56de\u653e\uff0c\u4f5c\u4e1a\u63d0\u4ea4\u6709\u7075\u6d3b\u7a97\u53e3\u671f\uff0c\u51cf\u8f7b\u5176\u56e0\u5bb6\u5ead\u4e8b\u52a1\u4ea7\u751f\u7684\u8fdb\u5ea6\u7126\u8651\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u56e0\u4e3a\u5979\u6001\u5ea6\u597d\u5c31\u5ffd\u7565\u5176\u65f6\u95f4\u56f0\u5883\uff0c\u7528\u201c\u522b\u4eba\u90fd\u80fd\u8ddf\u4e0a\u201d\u65bd\u52a0\u538b\u529b\u3002\u907f\u514d\u5c06\u5176\u63a8\u5411\u9700\u8981\u5927\u91cf\u5373\u65f6\u4e92\u52a8\u548c\u56fa\u5b9a\u65f6\u95f4\u53c2\u4e0e\u7684\u201c\u5708\u5c42\u793e\u4ea4\u7ebf\u201d\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u8fdb\u884c**\u4ef7\u503c\u578b\u5347\u5355**\uff0c\u4f8b\u5982\u63a8\u8350\u66f4\u4e13\u4e1a\u7684\u8bbe\u5907\u8bfe\u3001\u9ad8\u9636\u6f14\u64ad\u6280\u5de7\u8bfe\u7b49\uff0c\u5173\u8054\u5176\u201c\u5b66\u7cbe\u201d\u7684\u9700\u6c42\uff0c\u800c\u975e\u201c\u8d5a\u5feb\u94b1\u201d\u7684\u627f\u8bfa\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u7684\u76ee\u7684\u662f\u6765\u5b66\u4e60\uff0c\u5b66\u64ad\u97f3\u6280\u80fd\u3002\u521a\u624d\u8fd9\u4e2a\u534f\u8bae\u4e5f\u4e0d\u662f\u6211\u7684\u4e3b\u8981\u5173\u6ce8\u7684\u3002\u201d\n2. > \u201c\u53d7\u76ca\u532a\u6d45[\u5f3a][\u5f3a][\u5f3a] \u5c31\u662f\u6211\u8fd8\u4e0d\u77e5\u9053\u600e\u4e48\u5e94\u7528\u3002\u5148\u5b66\u4e86\u518d\u8bf4\u3002\u201d\n3. > \u201c\u5341\u4e2a\u67a3\u6362\u6c14\u8fd8\u63a5\u53d7\u5f97\u6765\uff0c\u4e24\u4e2a\u67a3\u6362\u6c14\uff0c\u5988\u5440\uff0c\u6709\u70b9\u624b\u5fd9\u811a\u4e71[\u5077\u7b11]\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2\u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4f4e**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u5f39\u6027\u7684\u65f6\u95f4\u652f\u6301\u4e0e\u6301\u7eed\u7684\u4e13\u4e1a\u6b63\u53cd\u9988\uff0c\u907f\u514d\u56e0\u5bb6\u5ead\u4e8b\u52a1\u5bfc\u81f4\u7684\u5b66\u4e60\u65ad\u5c42\u632b\u8d25\u611f**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u65f6\u95f4\u5f39\u6027\u652f\u6301\u5305\"}\n```";
