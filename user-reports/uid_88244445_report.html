    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 88244445 (\u6635\u79f0\uff1a\u76ae\u86cb) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-14 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5854\u5854(\u738b\u5f6c)\u3001\u8d1d\u5854\u73ed\u73ed(\u8d75\u8d1d\u797a) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u77ed\u89c6\u9891/\u5199\u4f5c\u76f8\u5173\u8bfe\u7a0b\uff08\u63d0\u53ca\u201cL3\u7b2c\u4e8c\u671f\u201d\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u80fd\u6df1\u591c\uff0802:28\uff09\u63d0\u4ea4\u4f5c\u4e1a\uff0c\u6709\u4e00\u5b9a\u65f6\u95f4\u5f39\u6027 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u4e0d\u8db3 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49\u504f\u8584**\uff08\u4e92\u52a8\u4ee5\u4e8b\u52a1\u6027\u4e3a\u4e3b\uff0c\u7f3a\u4e4f\u6df1\u5ea6\u52a8\u673a\u3001\u8d44\u6e90\u3001\u60c5\u7eea\u66b4\u9732\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34\u578b**\u3002\u6709\u660e\u786e\u7684\u5b66\u4e60\u548c\u5b8c\u6210\u4f5c\u4e1a\u884c\u4e3a\uff0c\u5173\u6ce8\u5de5\u5177\u4f7f\u7528\uff08\u8c46\u5305\u3001DeepSeek\u3001\u5373\u68a6\uff09\u548c\u8bfe\u7a0b\u5347\u7ea7\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u6781\u901f\u53d8\u73b0\u7684\u72c2\u70ed\u6216\u6df1\u5ea6\u94bb\u7814\u7684\u6781\u5ba2\u7cbe\u795e\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u5230\u73b0\u5728\uff0c\u6700\u540e\u4e24\u4e2a\u89c6\u9891\u8fd8\u6ca1\u51fa\u6765[\u6342\u8138]\u201d (\u4f53\u73b0\u6295\u5165\u4e0e\u52aa\u529b)\uff1b> \u201c\u6211\u62a5\u540d\u4e86\u201d (\u5bf9\u5347\u7ea7\u8bfe\u7a0b\u6709\u884c\u52a8\u529b)\uff1b> \u201c\u6211\u505a\u7684\u592a\u4e11\u4e86\uff0c\u4e0d\u597d\u610f\u601d\u62ff\u51fa\u6765[\u6342\u8138]\u201d (\u6709\u6210\u679c\u8ffd\u6c42\u4f46\u975e\u53d8\u73b0\u9a71\u52a8)\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u8d2d\u4e70\u8bfe\u7a0b\uff08\u5982\u201c\u5373\u68a6\u9ad8\u7ea7\u4f1a\u5458\u201d\uff09\u5e76\u62a5\u540d\u5347\u7ea7\u73ed\uff08L3\u7b2c\u4e8c\u671f\uff09\uff0c\u65e0\u501f\u8d37\u4fe1\u53f7\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u8ddf\u4e0a\u8bfe\u7a0b\u8282\u594f\u3001\u63d0\u4ea4\u4f5c\u4e1a\uff0c\u751a\u81f3\u80fd\u71ac\u591c\uff0802:28\uff09\u526a\u8f91\uff0c\u8868\u660e\u6709\u53ef\u652f\u914d\u7684\u788e\u7247\u5316\u65f6\u95f4\u6295\u5165\u5b66\u4e60\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u672a\u77e5** \u2014 \u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a**\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u8868\u683c\u7c98\u8d34\u3001\u5de5\u5177\u6392\u961f\uff09\u4f1a\u4e3b\u52a8\u63d0\u95ee\u6c42\u89e3\uff0c\u800c\u975e\u5d29\u6e83\u3002\u6709\u8f7b\u5fae\u81ea\u6211\u6000\u7591\uff08\u201c\u505a\u7684\u592a\u4e11\u201d\uff09\uff0c\u4f46\u80fd\u575a\u6301\u5b8c\u6210\u5e76\u5bfb\u6c42\u53cd\u9988\uff0c\u5c5e\u4e8e\u6b63\u5e38\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u7684\u60c5\u7eea\u6ce2\u52a8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4f5c\u4e1a\u4e0d\u80fd\u518d\u63d0\u4ea4\u4e86\u5417\uff1f\u4e0d\u662f\u8bf4\u5230\u4eca\u5929\u5417\uff1f\u201d (\u9047\u5230\u622a\u6b62\u95ee\u9898\uff0c\u4e3b\u52a8\u6c9f\u901a\u89e3\u51b3)\uff1b> \u201c\u6211\u505a\u7684\u592a\u4e11\u4e86\uff0c\u4e0d\u597d\u610f\u601d\u62ff\u51fa\u6765[\u6342\u8138]\u201d (\u6709\u7f9e\u803b\u611f\u4f46\u4ecd\u5728\u63a8\u8fdb)\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a\u3010 \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e / \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 \u3011\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u6210\u679c\u8d28\u91cf\u7684\u4e0d\u81ea\u4fe1\u4e0e\u5bf9\u793e\u7fa4\u5f52\u5c5e\u7684\u6e34\u671b**\u3002\u4ed6\u5bb3\u6015\u81ea\u5df1\u4f5c\u54c1\u201c\u592a\u4e11\u201d\uff0c\u4f46\u79ef\u6781\u53c2\u4e0e\u63a5\u9f99\u3001\u56de\u590d\u73ed\u73ed\u6d88\u606f\u3001\u5173\u6ce8\u7fa4\u5185\u52a8\u6001\uff08\u8f6c\u53d1\u4ed6\u4eba\u6d88\u606f\uff09\uff0c\u8868\u660e\u4ed6\u6e34\u671b\u88ab\u793e\u7fa4\u63a5\u7eb3\u548c\u8ba4\u53ef\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u9636\u6bb5\u6027\u6210\u679c\u7684\u5373\u65f6\u3001\u5177\u4f53\u80af\u5b9a\uff0c\u4ee5\u53ca\u5c06\u5176\u7eb3\u5165\u201c\u4f18\u79c0\u5b66\u5458\u201d\u5708\u5c42\u7684\u5f52\u5c5e\u611f\u8d4b\u4e88**\u3002\u4ed6\u9700\u8981\u7684\u4e0d\u53ea\u662f\u6280\u672f\u6307\u5bfc\uff0c\u66f4\u662f\u201c\u6211\u505a\u7684\u4e1c\u897f\u88ab\u770b\u89c1\u4e86\uff0c\u5e76\u4e14\u8fd8\u4e0d\u9519\u201d\u7684\u4ef7\u503c\u786e\u8ba4\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u6709\u5411 **\u6df7\u5408\u4f533\u53f7\uff1a\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b** \u8fdb\u5316\u6f5c\u529b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u96f6\u4e92\u52a8\u4e0b\u8f7d\u7b49\u5371\u9669\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u672a\u66b4\u9732\u5bb6\u5ead\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u82e5\u8bfe\u7a0b\u96be\u5ea6\u9661\u589e\u6216\u4f5c\u4e1a\u91cf\u8fc7\u5927\uff0c\u8d85\u51fa\u5176\u788e\u7247\u5316\u65f6\u95f4\u627f\u8f7d\u529b\uff0c\u53ef\u80fd\u5bfc\u81f4\u79ef\u538b\u7126\u8651\uff0c\u6700\u7ec8\u653e\u5f03\u3002** |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u4e2d\u7b49\uff0c\u6709\u7f9e\u803b\u611f\u4f46\u80fd\u884c\u52a8\uff0c\u4e0d\u5c5e\u4e8e\u6613\u5d29\u6e83\u578b\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u5f53\u524d\u52a8\u673a\u4ee5\u5b66\u4e60\u548c\u5b8c\u6210\u4e3a\u4e3b\uff0c\u672a\u8868\u73b0\u51fa\u201c\u51e0\u5929\u5185\u5fc5\u987b\u53d8\u73b0\u201d\u7684\u6025\u5207\uff0c\u6536\u76ca\u843d\u5dee\u98ce\u9669\u8f83\u4f4e\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u8bfe\u7a0b\u4e2d\u540e\u671f\uff08\u7b2c4-6\u5468\uff09\uff0c\u5f53\u591a\u6a21\u5757\u4f5c\u4e1a\u5e76\u884c\u3001\u6280\u672f\u590d\u6742\u5ea6\u63d0\u5347\u65f6\u3002**\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u76ae\u86cb\uff0c\u770b\u5230\u4f60\u5728\u4f53\u9a8c\u8425\u91cc\u7279\u522b\u8ba4\u771f\uff0c\u4f5c\u4e1a\u90fd\u575a\u6301\u5b8c\u6210\u4e86\uff0c\u8fd9\u79cd\u2018\u9ed8\u9ed8\u628a\u4e8b\u60c5\u505a\u597d\u2019\u7684\u98ce\u683c\u7279\u522b\u9760\u8c31\uff01\u65b0\u9636\u6bb5\u8bfe\u7a0b\u4f1a\u66f4\u6709\u6311\u6218\uff0c\u4f46\u522b\u6015\u2018\u4e11\u2019\uff0c\u6bcf\u4e00\u4e2a\u6562\u4ea4\u4f5c\u4e1a\u7684\u5b66\u5458\u90fd\u662f\u6700\u68d2\u7684\u6210\u957f\u8005\u3002\u6709\u4efb\u4f55\u5361\u70b9\u968f\u65f6@\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u641e\u5b9a\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u5339\u914d\u5176T2\u8001\u9ec4\u725b\u7279\u8d28\uff0c\u63d0\u4f9b\u6e05\u6670\u3001\u6709\u6311\u6218\u6027\u7684\u5b66\u4e60\u8def\u5f84\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u6f5c\u5728\u7684\u201c\u6df7\u5408\u4f533\u53f7\u201d\u8fdb\u5316\u53ef\u80fd\uff0c\u53ef\u9002\u65f6\u8865\u5145\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf**\u3011\u7684\u8f7b\u91cf\u6743\u9650\uff0c\u5982\u9080\u8bf7\u5176\u534f\u52a9\u7edf\u8ba1\u5c0f\u7ec4\u4f5c\u4e1a\u8fdb\u5ea6\u3001\u5206\u4eab\u67d0\u4e2a\u5de5\u5177\u4f7f\u7528\u5fc3\u5f97\uff0c\u7ed9\u4e88\u201c\u7f16\u5916\u52a9\u6559\u201d\u7684\u8eab\u4efd\u8ba4\u540c\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5ffd\u89c6\u4ed6\u7684\u4f5c\u4e1a\u63d0\u4ea4\u548c\u63d0\u95ee\u3002\u5f53\u4ed6\u4e3b\u52a8\u8be2\u95ee\u6280\u672f\u95ee\u9898\uff08\u5982\u8868\u683c\u7c98\u8d34\uff09\u6216\u7533\u8bf7\u91cd\u5f00\u63d0\u4ea4\u901a\u9053\u65f6\uff0c\u5fc5\u987b\u53ca\u65f6\u3001\u6e05\u6670\u5730\u56de\u5e94\u3002**\u7981\u6b62\u7528\u201c\u52a0\u6cb9\u54e6\u201d\u7b49\u7a7a\u6cdb\u9f13\u52b1\u4ee3\u66ff\u5177\u4f53\u7684\u95ee\u9898\u89e3\u51b3\u3002**\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u8fdb\u884c**\u5927\u989d\u63a8\u4ecb**\u3002\u56e0\u5176\u5df2\u4e3b\u52a8\u590d\u8d2dL3\u8bfe\u7a0b\uff0c\u8bc1\u660e\u6709\u4ed8\u8d39\u610f\u613f\u548c\u5b66\u4e60\u60ef\u6027\u3002\u63a8\u4ecb\u65f6\u5e94\u4fa7\u91cd\u201c\u6280\u80fd\u8fdb\u9636\u201d\u548c\u201c\u4f5c\u54c1\u8d28\u91cf\u63d0\u5347\u201d\uff0c\u800c\u975e\u201c\u5feb\u901f\u53d8\u73b0\u201d\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u4f5c\u4e1a\u4e0d\u80fd\u518d\u63d0\u4ea4\u4e86\u5417\uff1f\u4e0d\u662f\u8bf4\u5230\u4eca\u5929\u5417\uff1f\u201d **\u2014\u2014 \u4f53\u73b0\u89c4\u5219\u610f\u8bc6\u3001\u4e3b\u52a8\u6c9f\u901a\u3001\u5bf9\u5b8c\u6210\u4efb\u52a1\u7684\u6267\u7740\uff08T2\u6838\u5fc3\u7279\u5f81\uff09**\n2. > \u201c\u6211\u505a\u7684\u592a\u4e11\u4e86\uff0c\u4e0d\u597d\u610f\u601d\u62ff\u51fa\u6765[\u6342\u8138]\u201d **\u2014\u2014 \u66b4\u9732\u5bf9\u6210\u679c\u8d28\u91cf\u7684\u5728\u610f\u548c\u8f7b\u5fae\u4e0d\u81ea\u4fe1\uff0c\u662f\u8ffd\u6c42\u201c\u88ab\u8ba4\u53ef\u201d\u7684\u5c0a\u91cd\u9700\u6c42\uff0c\u800c\u975e\u201c\u5fc5\u987b\u8d5a\u94b1\u201d\u7684\u5b89\u5168\u9700\u6c42\u3002**\n3. > \u201c\u6211\u62a5\u540d\u4e86\u201d (\u9488\u5bf9L3\u4e8c\u671f) **\u2014\u2014 \u7528\u884c\u52a8\u8bc1\u660e\u590d\u8d2d\u610f\u613f\u548c\u5b66\u4e60\u5ef6\u7eed\u6027\uff0c\u662fB\u7c7b\u7528\u6237\u7684\u5178\u578b\u884c\u4e3a\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u4e0e\u793e\u7fa4\u5f52\u5c5e\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u53ca\u65f6\u54cd\u5e94\u5176\u5177\u4f53\u95ee\u9898\uff0c\u5e76\u5bf9\u5176\u9636\u6bb5\u6027\u6210\u679c\u7ed9\u4e88\u660e\u786e\u3001\u5177\u4f53\u7684\u6b63\u5411\u53cd\u9988\uff0c\u9002\u65f6\u8d4b\u4e88\u8f7b\u91cf\u7ea7\u7ba1\u7406\u6743\u9650\u4ee5\u6fc0\u53d1\u5176\u201c\u6743\u9650\u89c9\u9192\u201d\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u5f52\u5c5e\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
