        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 145491548 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e\uff1a\u661f\u9e7f1(\u5218\u7acb\u541b)\uff1b\u73ed\u4e3b\u4efb\uff1a\u9065\u8fdc(\u5f20\u6587\u9759) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6500\u767b\u8ba1\u5212\u6709\u58f0\u6f14\u64ad\u7cfb\u7edf\u8bfe (\u56db\u4e2a\u6708\u9ad8\u9636\u73ed\uff0c\u603b\u4ef77380\u5143\uff0c\u5206\u671f\u652f\u4ed8) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u7528\u5361\u5468\u8f6c / \u88ab\u8feb\u5206\u671f** (\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u8d44\u91d1\u4e0d\u591f\u201d\uff0c\u5e76\u4e3b\u52a8\u8be2\u95ee\u82b1\u5457\u5206\u671f\u53ca\u624b\u7eed\u8d39\uff0c\u6700\u7ec8\u9009\u62e9\u5206\u4e24\u7b14\u652f\u4ed8) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u7528\u6237\u9700\u5e26\u4e24\u4e2a\u5b69\u5b50\uff0c\u665a\u4e0a\u6d17\u6f31\u65f6\u95f4\u51b2\u7a81\uff0c\u56de\u590d\u6d88\u606f\u53ef\u80fd\u4e0d\u53ca\u65f6) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** (\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u51b3\u7b56\u4fe1\u606f\uff0c\u9700\u8b66\u60d5\u9690\u7792\u98ce\u9669) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49** (\u5b66\u4e60\u4e92\u52a8\u79ef\u6781\uff0c\u4f46\u5173\u952e\u5bb6\u5ead\u3001\u8d22\u52a1\u3001\u804c\u4e1a\u80cc\u666f\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u6709\u660e\u786e\u7684\u201c\u56de\u672c\u201d\u76ee\u6807\uff08\u201c\u80fd\u628a\u6211\u7684\u5b66\u8d39\u6323\u56de\u6765\u5c31\u884c\u201d\uff09\uff0c\u5bf9\u53d8\u73b0\u6e20\u9053\u548c\u63a5\u5355\u89c4\u5219\u8868\u73b0\u51fa\u5174\u8da3\uff0c\u4f46\u540c\u65f6\u4e5f\u6d41\u9732\u51fa\u5bf9\u201c\u6f14\u620f\u9b45\u529b\u201d\u548c\u201c\u653e\u98de\u81ea\u6211\u201d\u7684\u5174\u8da3\uff0c\u52a8\u673a\u4e2d\u6df7\u6742\u4e86\u5174\u8da3\u63a2\u7d22\u548c\u5b9e\u9645\u6536\u76ca\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u8981\u6c42\u4e0d\u9ad8\uff0c\u4e0a\u5b8c\u8bfe\uff0c\u80fd\u628a\u6211\u7684\u5b66\u8d39\u6323\u56de\u6765\u5c31\u884c\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u660e\u786e\u8868\u793a\u201c\u8d44\u91d1\u4e0d\u591f\u201d\uff0c\u9700\u8981\u5206\u671f\u652f\u4ed8\u5b66\u8d39\uff0c\u5b58\u5728\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e** \u2014 \u9700\u7167\u987e\u4e24\u4e2a\u5b69\u5b50\uff08\u201c\u8fd9\u4e2a\u70b9\u6211\u6b63\u5e26\u4e24\u4e2a\u5b69\u5b50\u6d17\u6f31\u5462\u201d\uff09\uff0c\u65f6\u95f4\u88ab\u9ad8\u5ea6\u788e\u7247\u5316\uff0c\u5b66\u4e60\u65f6\u95f4\u9700\u201c\u62fc\u51d1\u201d\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u672a\u77e5** \u2014 \u804a\u5929\u8bb0\u5f55\u5b8c\u5168\u672a\u63d0\u53ca\u914d\u5076\u6216\u5bb6\u4eba\u6001\u5ea6\uff0c\u662f**\u91cd\u5927\u98ce\u9669\u7f3a\u53e3**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u9700\u95f4\u6b47\u6027\u5b89\u629a\u3002\u7528\u6237\u80fd\u63a5\u53d7\u6307\u5bfc\u5e76\u5c1d\u8bd5\u6539\u8fdb\uff08\u201c\u6211\u518d\u8bd5\u4e00\u904d\u201d\uff09\uff0c\u5bf9Pia\u620f\u6709\u79ef\u6781\u6709\u8da3\u7684\u53cd\u9988\u3002\u4f46\u5728\u521d\u671f\u5bf9\u81ea\u8eab\u95ee\u9898\uff08\u538b\u55d3\uff09\u6709\u8f7b\u5fae\u7684\u4e0d\u786e\u5b9a\u611f\uff08\u201c\u4f46\u662f\u6211\u4e00\u70b9\u90fd\u611f\u89c9\u4e0d\u5230\u201d\uff09\uff0c\u9700\u8981\u9500\u552e\u6301\u7eed\u7684\u6b63\u5411\u53cd\u9988\u548c\u9f13\u52b1\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8fd9\u4e2apia\u620f\u9002\u5408\u4e00\u4e2a\u4eba\u5728\u5bb6\u73a9\uff0c\u8981\u4e0d\u7136\u522b\u4eba\u4ee5\u4e3a\u5728\u62bd\u98ce[\u6342\u8138][\u6342\u8138][\u6342\u8138]\u201d (\u4f53\u73b0\u5bf9\u4ed6\u4eba\u773c\u5149\u7684\u5728\u610f\u548c\u4e00\u5b9a\u7684\u5fc3\u7406\u5305\u88b1)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4f5c\u4e3a\u5b9d\u5988\uff0c\u5728\u5bb6\u5ead\u8d23\u4efb\u4e0e\u4e2a\u4eba\u4ef7\u503c/\u7ecf\u6d4e\u72ec\u7acb\u4e4b\u95f4\u7684\u62c9\u626f\u4e0e\u7126\u8651**\u3002\u5979\u6e34\u671b\u901a\u8fc7\u4e00\u9879\u201c\u6709\u8da3\u201d\u4e14\u201c\u80fd\u8d5a\u94b1\u201d\u7684\u6280\u80fd\uff0c\u5728\u7167\u987e\u5bb6\u5ead\u4e4b\u4f59\u627e\u5230\u5b89\u5168\u611f\u548c\u81ea\u6211\u8bc1\u660e\u7684\u9014\u5f84\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u201d\u7684\u6210\u5c31\u611f\u548c\u201c\u88ab\u6258\u4f4f\u201d\u7684\u5b89\u5168\u611f**\u3002\u5979\u9700\u8981\u6301\u7eed\u3001\u5177\u4f53\u7684\u80af\u5b9a\uff08\u5982\u9500\u552e\u5bf9\u5176\u8fdb\u6b65\u7684\u8868\u626c\uff09\uff0c\u4ee5\u53ca\u4e00\u4e2a\u660e\u786e\u3001\u53ef\u5b9e\u73b0\u7684\u201c\u56de\u672c\u201d\u8def\u5f84\u6765\u7f13\u89e3\u5176\u5bf9\u6295\u5165\u7684\u7ecf\u6d4e\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1** \u7c7b (\u52a8\u673a\u4e2d\u7b49\u4f46\u8d44\u6e90\u5e95\u5ea7\u8584\u5f31\uff0c\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u4e0d\u660e\uff0c\u98ce\u9669\u8f83\u9ad8) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u578b (\u6df7\u5408T5\u5c1d\u9c9c\u7279\u8d28)** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u867d\u8d44\u91d1\u7d27\u5f20\u5206\u671f\u652f\u4ed8\uff0c\u4f46\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u7b49\u6781\u7aef\u60c5\u51b5)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a/\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u9ad8** | **\u3010\u9ad8\u98ce\u9669\u3011** \u804a\u5929\u8bb0\u5f55\u5b8c\u5168\u672a\u63d0\u53ca\u5bb6\u4eba\uff0c\u6781\u6709\u53ef\u80fd\u662f\u7792\u7740\u5bb6\u4eba\uff08\u5c24\u5176\u662f\u914d\u5076\uff09\u7528\u5bb6\u5ead\u5171\u540c\u8d44\u91d1\u6216\u79c1\u623f\u94b1\u62a5\u8bfe\u3002\u4e00\u65e6\u88ab\u5bb6\u4eba\u53d1\u73b0\uff0c\u6781\u6613\u5f15\u53d1\u6fc0\u70c8\u77db\u76fe\u5e76\u8981\u6c42\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u5e26\u4e24\u4e2a\u5b69\u5b50\u5bfc\u81f4\u65f6\u95f4\u6781\u5ea6\u788e\u7247\u5316\uff0c\u65e0\u6cd5\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\u6216\u63a5\u5355\u5b9e\u8df5\uff0c\u4ea7\u751f\u79ef\u7d2f\u6027\u632b\u8d25\u611f\u548c\u201c\u94b1\u767d\u82b1\u4e86\u201d\u7684\u7126\u8651\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u7528\u6237\u4e92\u52a8\u79ef\u6781\uff0c\u80fd\u63a5\u53d7\u6307\u5bfc\uff0c\u6682\u65e0\u6b64\u503e\u5411\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u5bf9\u201c\u6323\u56de\u5b66\u8d39\u201d\u6709\u660e\u786e\u4e14\u6025\u5207\u7684\u671f\u5f85\u3002\u82e5\u5b66\u4e60\u4e00\u6bb5\u65f6\u95f4\u540e\uff08\u59821-2\u4e2a\u6708\uff09\u53d1\u73b0\u63a5\u5355\u56f0\u96be\u6216\u6536\u76ca\u5fae\u8584\uff0c\u6781\u6613\u4ea7\u751f\u88ab\u6b3a\u9a97\u611f\u5e76\u8981\u6c42\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c1\u4e2a\u6708\u672b\u81f3\u7b2c2\u4e2a\u6708**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u8bfe\u4e1a\u538b\u529b\u4e0e\u65f6\u95f4\u77db\u76fe\u51f8\u663e\uff0c\u82e5\u63a5\u5355\u65e0\u671b\uff0c\u5bb6\u5ead\u77db\u76fe\u53ef\u80fd\u7206\u53d1\uff0c\u5f62\u6210\u9000\u8d39\u9ad8\u5cf0\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u7b80\u5355\u7684\u65f6\u5149\u4f60\u597d\uff0c\u6211\u662f\u4f60\u7684\u73ed\u4e3b\u4efb\u9065\u8fdc\u3002\u5e08\u59d0\u7279\u610f\u8ddf\u6211\u4ea4\u4ee3\u4e86\uff0c\u4f60\u662f\u4e00\u4f4d\u975e\u5e38\u8ba4\u771f\u4e14\u6709\u6f5c\u529b\u7684\u5988\u5988\u5b66\u5458\uff0c\u65f6\u95f4\u90fd\u662f\u2018\u6324\u2019\u51fa\u6765\u7684\uff0c\u7279\u522b\u4e0d\u5bb9\u6613\u3002\u54b1\u4eec\u7684\u8bfe\u7a0b\u8bbe\u8ba1\u8003\u8651\u5230\u4e86\u5927\u5bb6\u7684\u65f6\u95f4\u788e\u7247\u5316\u95ee\u9898\uff0c\u4f60\u6709\u4efb\u4f55\u65f6\u95f4\u4e0a\u7684\u56f0\u96be\u968f\u65f6\u8ddf\u6211\u6c9f\u901a\uff0c\u6211\u4eec\u4e00\u8d77\u8c03\u6574\u8ba1\u5212\u3002\u6211\u4eec\u7684\u9996\u8981\u5c0f\u76ee\u6807\uff0c\u5c31\u662f\u5e2e\u4f60\u7a33\u7a33\u5730\u628a\u5b66\u8d39\u6323\u56de\u6765\uff0c\u8ba9\u4f60\u8fd9\u4efd\u5bf9\u81ea\u5df1\u7684\u6295\u8d44\u770b\u5f97\u89c1\u56de\u62a5\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5feb\u901f\u63a5\u5355\u7ebf**\u3011\u3002\u5fc5\u987b\u4f18\u5148\u6ee1\u8db3\u5176\u201c\u56de\u672c\u201d\u7684\u6838\u5fc3\u8bc9\u6c42\uff0c\u5feb\u901f\u5bf9\u63a5\u95e8\u69db\u8f83\u4f4e\u7684\u6709\u58f0\u4e66\u5ba1\u542c\u3001\u5bf9\u8f68\u7b49\u517c\u804c\u5c97\u4f4d\uff0c\u54ea\u6015\u5355\u91cf\u5c0f\u3001\u5355\u4ef7\u4f4e\uff0c\u4e5f\u8981\u5c3d\u5feb\u4ea7\u751f\u6b63\u5411\u73b0\u91d1\u6d41\u548c\u6210\u5c31\u611f\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u65f6\u95f4\u7ba1\u7406\u8f85\u52a9\u5305**\u3011\u63d0\u4f9b\u7075\u6d3b\u7684\u5f55\u64ad\u8bfe\u5b66\u4e60\u8def\u5f84\u3001\u53ef\u968f\u65f6\u56de\u770b\u7684\u4f5c\u4e1a\u70b9\u8bc4\u3001\u975e\u5b9e\u65f6\u53c2\u4e0e\u7684\u63a5\u5355\u4efb\u52a1\u3002\u3010**\u5b9d\u5988\u540c\u4faa\u652f\u6301\u5708**\u3011\u5c06\u5176\u5f15\u5165\u6709\u7c7b\u4f3c\u80cc\u666f\u7684\u5b66\u5458\u793e\u7fa4\uff0c\u63d0\u4f9b\u60c5\u611f\u652f\u6301\u548c\u7ecf\u9a8c\u5206\u4eab\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u7edd\u4e0d\u5bf9\u5176\u65bd\u538b\u8981\u6c42\u5fc5\u987b\u53c2\u52a0\u6240\u6709\u5b9e\u65f6\u76f4\u64ad\u548c\u6d3b\u52a8\u30022. \u7edd\u4e0d\u5728\u521d\u671f\u753b\u201c\u6708\u5165\u8fc7\u4e07\u201d\u7684\u5927\u997c\uff0c\u5e94\u7ba1\u7406\u5176\u6536\u76ca\u9884\u671f\u30023. **\u7edd\u53e3\u4e0d\u63d0\u201c\u8ba9\u8001\u516c\u652f\u6301\u4f60\u201d\u6216\u7c7b\u4f3c\u6d89\u53ca\u5bb6\u5ead\u51b3\u7b56\u7684\u8bdd\u9898\uff0c\u9664\u975e\u7528\u6237\u4e3b\u52a8\u63d0\u53ca\u3002**\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5f53\u524d\u5206\u671f\u652f\u4ed87380\u5143\u5df2\u89e6\u53ca\u5176\u652f\u4ed8\u80fd\u529b\u4e0a\u9650\uff0c\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u5c06\u6781\u5927\u589e\u52a0\u5176\u7ecf\u6d4e\u538b\u529b\u548c\u9000\u8d39\u98ce\u9669\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u8fd9\u4e2a\u70b9\u6211\u611f\u89c9\u6211\u6709\u70b9\u591f\u545b\uff0c\u8fd9\u4e2a\u70b9\u6211\u6b63\u5e26\u4e24\u4e2a\u5b69\u5b50\u6d17\u6f31\u5462\uff0c\u6211\u4e89\u53d6\u4e0a\u7ebf\u201d **(\u8d44\u6e90\u5e95\u5ea7-\u65f6\u95f4\u77ed\u677f\u7684\u6838\u5fc3\u8bc1\u636e)**\n2. > \u201c\u5728\u7ea0\u7ed32\u4e2a\u6708\u8fd8\u662f\u56db\u4e2a\u6708\uff0c\u60f3\u62a5\u56db\u4e2a\u6708\uff0c\u4f46\u786e\u5b9e\u662f\u8d44\u91d1\u4e0d\u591f\uff0c\u4f46\u662f\u62a5\u4e24\u4e2a\u6708\u7684\u6709\u4e0d\u7518\u5fc3\u201d **(\u652f\u4ed8\u80fd\u529b\u4e0e\u52a8\u673a\u7eaf\u5ea6\u7684\u77db\u76fe\u4f53\u73b0)**\n3. > \u201c\u6211\u8981\u6c42\u4e0d\u9ad8\uff0c\u4e0a\u5b8c\u8bfe\uff0c\u80fd\u628a\u6211\u7684\u5b66\u8d39\u6323\u56de\u6765\u5c31\u884c\u3002\u201d **(\u6838\u5fc3\u8bc9\u6c42\uff1a\u7126\u8651\u4fdd\u969c\u4e0e\u7ed3\u679c\u5bfc\u5411)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010\u7126\u8651\u641e\u94b1\u5b9d\u5988\u578b(T4\u6df7\u5408T5)\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7ecf\u6d4e\u4e0e\u4ef7\u503c\u7684\u53cc\u91cd\u5b89\u5168\u4fdd\u969c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u524d\u7f6e\u6c9f\u901a\u65f6\u95f4\u7075\u6d3b\u6027\uff0c\u5e76\u4f18\u5148\u63d0\u4f9b\u5fae\u5c0f\u4f46\u786e\u5b9a\u7684\u53d8\u73b0\u673a\u4f1a\uff0c\u540c\u65f6\u7edd\u5bf9\u907f\u5f00\u5bb6\u5ead\u96f7\u533a\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf+\u65f6\u95f4\u7ba1\u7406\u8f85\u52a9\u5305\"}\n```";
