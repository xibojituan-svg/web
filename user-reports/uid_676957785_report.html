    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u5f20\u9b41 (UID: 676957785) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-02-21 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u4e2b\u4e2b(\u6c6a\u9510) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u5199\u4f5c/\u77ed\u89c6\u9891\u76f8\u5173\u8bfe\u7a0b\uff08\u5df2\u62a5\u540d5\u670823\u65e5\u5f00\u73ed\u7684\u7b2c17\u671f\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u4fe1\u606f\u4e0d\u8db3\u3002\u4ece\u201c\u626b\u7801\u4ed8\u4e86\u201d\u63a8\u6d4b\u4e3a\u5168\u6b3e\u6216\u4fe1\u7528\u5361\u652f\u4ed8\uff0c**\u65e0\u660e\u786e\u501f\u8d37\u4fe1\u53f7**\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u63d0\u53ca\u201c\u4e8c\u5b9d\u751f\u75c5\u201d\u3001\u201c\u8fd9\u4e24\u5929\u5fd9\u7684\u5fc3\u4e71\u201d\u3001\u201c\u5c3d\u91cf\u6324\u65f6\u95f4\u201d\uff0c\u8868\u660e\u65f6\u95f4\u88ab\u5bb6\u5ead\u548c\u5de5\u4f5c\u9ad8\u5ea6\u6324\u538b\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\uff0c\u4f46\u201c\u4e8c\u5b9d\u201d\u4fe1\u606f\u6697\u793a\u6709\u5bb6\u5ead\u8d23\u4efb\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u6709\u660e\u786e\u7684\u884c\u52a8\u4fe1\u53f7\uff08\u4ea4\u4f5c\u4e1a\u3001\u62a5\u540d\u3001\u53c2\u4f1a\uff09\uff0c\u4f46\u7f3a\u4e4f\u6df1\u5c42\u52a8\u673a\u3001\u80cc\u666f\u548c\u60c5\u7eea\u8868\u8fbe\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u6309\u65f6\u53c2\u4f1a\u3001\u4ea4\u4f5c\u4e1a\u3001\u62a5\u540d\u6b63\u4ef7\u8bfe\uff0c\u8868\u73b0\u51fa\u5b66\u4e60\u610f\u613f\u3002\u4f46\u804a\u5929\u4e2d**\u672a\u63d0\u53ca\u4efb\u4f55\u660e\u786e\u7684\u53d8\u73b0\u8bc9\u6c42\u3001\u6280\u672f\u8ffd\u95ee\u6216\u81ea\u6211\u5b9e\u73b0\u76ee\u6807**\uff0c\u52a8\u673a\u504f\u5411\u201c\u5b8c\u6210\u4efb\u52a1\u201d\u548c\u201c\u8ddf\u4e0a\u8fdb\u5ea6\u201d\uff0c\u7eaf\u5ea6\u4e2d\u7b49\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4f5c\u4e1a\u5df2\u4ea4[\u5472\u7259]\u201d > \u201c\u5c3d\u91cf\u6324\u65f6\u95f4\u5427[\u6d41\u6cea]\u201d > \u201c\u6211\u62a5\u4e86\uff0c\u9009\u4e8617\u671f\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u76f4\u63a5\u62a5\u540d\u6b63\u4ef7\u8bfe\uff0c\u672a\u8868\u73b0\u51fa\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e** \u2014 **\u6838\u5fc3\u77ed\u677f**\u3002\u591a\u6b21\u63d0\u53ca\u201c\u5fd9\u201d\u3001\u201c\u4e8c\u5b9d\u751f\u75c5\u201d\u3001\u201c\u7126\u5934\u70c2\u989d\u201d\u3001\u201c\u6324\u65f6\u95f4\u201d\uff0c\u8868\u660e\u65f6\u95f4\u7cbe\u529b\u4e25\u91cd\u4e0d\u8db3\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u6709\u5bb6\u5ead\u8d23\u4efb\uff08\u4e8c\u5b9d\uff09\uff0c\u4f46\u672a\u63d0\u53ca\u652f\u6301\u6216\u53cd\u5bf9\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u201c\u5fae\u4fe1\u88ab\u9650\u5236\u7fa4\u804a\u4e00\u5468\u201d\u3001\u201c\u4e8c\u5b9d\u751f\u75c5\u803d\u8bef\u4f5c\u4e1a\u201d\u7b49\u7a81\u53d1\u632b\u6298\uff0c\u7528\u6237\u60c5\u7eea\u7a33\u5b9a\uff0c\u4e3b\u52a8\u89e3\u91ca\u539f\u56e0\u5e76\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff08\u5982\u79c1\u53d1\u4f5c\u4e1a\u3001\u4ea4\u7a7a\u767d\u6587\u4ef6\u5148\u8fc7\u5173\uff09\uff0c**\u672a\u51fa\u73b0\u4efb\u4f55\u62b1\u6028\u3001\u81ea\u6211\u5426\u5b9a\u6216\u5411\u73ed\u4e3b\u4efb\u7d22\u6c42\u60c5\u7eea\u4ef7\u503c\u7684\u884c\u4e3a**\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u521a\u521a\u6709\u4e2a\u5de5\u4f5c\u7fa4\u88ab\u505c\u4e86\uff0c\u6211\u662f\u7fa4\u7ba1\u4e4b\u4e00\uff0c\u5c31\u88ab\u9650\u5236\u4e86[\u6d41\u6cea]...\u663e\u793a\u89811\u5468\u65f6\u95f4\u201d > \u201c\u4f5c\u4e1a\u6211\u5c3d\u529b\uff0c\u4e8c\u5b9d\u751f\u75c5\uff0c\u8fd9\u51e0\u5929\u6709\u70b9\u7126\u5934\u70c2\u989d[\u6342\u8138]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u5f52\u5c5e\u4e0e\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u8ba4\u53ef**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u56e0\u5916\u90e8\u4e0d\u53ef\u6297\u529b\uff08\u5de5\u4f5c\u7fa4\u88ab\u5c01\u3001\u5b69\u5b50\u751f\u75c5\uff09\u5bfc\u81f4\u7684\u793e\u7fa4\u53c2\u4e0e\u7f3a\u5931\u548c\u4efb\u52a1\u5ef6\u8bef\uff0c\u53ef\u80fd\u4ea7\u751f\u7684\u201c\u6389\u961f\u201d\u7126\u8651\u548c\u88ab\u8fb9\u7f18\u5316\u7684\u4e0d\u5b89\u3002** \u4ed6\u4e3b\u52a8\u89e3\u91ca\u3001\u9053\u6b49\u5e76\u79ef\u6781\u8865\u6551\uff0c\u8bf4\u660e\u4ed6\u91cd\u89c6\u5728\u8fd9\u4e2a\u5b66\u4e60\u793e\u7fa4\u4e2d\u7684\u201c\u6210\u5458\u8eab\u4efd\u201d\u548c\u201c\u5c65\u7ea6\u5f62\u8c61\u201d\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u7406\u89e3\u201d\u548c\u201c\u88ab\u4fe1\u4efb\u201d\u7684\u5b89\u5168\u611f\u3002** \u5f53\u4ed6\u7684\u65f6\u95f4\u88ab\u73b0\u5b9e\u6324\u538b\u65f6\uff0c\u63d0\u4f9b\u5f39\u6027\u7684\u4efb\u52a1\u5b8c\u6210\u65b9\u6848\uff08\u5982\u63a5\u53d7\u7a7a\u767d\u4f5c\u4e1a\uff09\uff0c\u5e76\u80af\u5b9a\u4ed6\u514b\u670d\u56f0\u96be\u575a\u6301\u5b66\u4e60\u7684\u52aa\u529b\uff0c\u80fd\u6781\u5927\u589e\u5f3a\u5176\u5f52\u5c5e\u611f\u548c\u5bf9\u5e73\u53f0\u7684\u5fe0\u8bda\u5ea6\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u95f7\u58f0\u5e72\u786c\u6838\u6d3b\u6c42\u80af\u5b9a) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u65e0\u6781\u7aef\u8a00\u8bba\u3001\u65e0\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u201c\u4e8c\u5b9d\u201d\u53ef\u80fd\u5206\u6563\u5176\u7cbe\u529b\uff0c\u957f\u671f\u770b\u662f\u6f5c\u5728\u98ce\u9669\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u4e2d** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u65f6\u95f4\u7cbe\u529b\u77ed\u677f\u662f\u6700\u5927\u9690\u60a3\u3002\u82e5\u8bfe\u7a0b\u5f3a\u5ea6\u6301\u7eed\u8d85\u51fa\u5176\u53ef\u8c03\u914d\u65f6\u95f4\uff0c\u7d2f\u79ef\u7684\u201c\u4f5c\u4e1a\u503a\u201d\u548c\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u7126\u8651\u53ef\u80fd\u5bfc\u81f4\u5176\u9ed8\u9ed8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u81ea\u884c\u5904\u7406\u632b\u6298\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u76ee\u524d\u672a\u8868\u73b0\u51fa\u6025\u529f\u8fd1\u5229\u7684\u53d8\u73b0\u8bc9\u6c42\uff0c\u4f46\u5bf9\u201c\u53d8\u73b0\u5f88\u5feb\u201d\u7684\u9500\u552e\u8bdd\u672f\uff08\u73ed\u73ed\u63d0\u53ca\uff09\u672a\u6765\u53ef\u80fd\u4ea7\u751f\u9884\u671f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-4\u5468\u540e**\uff0c\u5f53\u8bfe\u7a0b\u4efb\u52a1\u91cf\u8fdb\u5165\u9ad8\u5cf0\u671f\uff0c\u82e5\u5176\u5bb6\u5ead\u6216\u5de5\u4f5c\u7a81\u53d1\u72b6\u51b5\uff0c\u53ef\u80fd\u5bfc\u81f4\u5176\u65e0\u6cd5\u8ddf\u4e0a\u8fdb\u5ea6\uff0c\u4ea7\u751f\u6301\u7eed\u6027\u7684\u632b\u8d25\u611f\u800c\u6c89\u9ed8\u9000\u573a\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u9b41\u54e5\uff0c\u770b\u5230\u4f60\u4e4b\u524d\u4f53\u9a8c\u8425\u5728\u90a3\u4e48\u5fd9\u7684\u60c5\u51b5\u4e0b\u8fd8\u575a\u6301\u4ea4\u4f5c\u4e1a\u3001\u53c2\u4f1a\uff0c\u8fd9\u4efd\u8ba4\u771f\u548c\u97e7\u6027\u73ed\u73ed\u7279\u522b\u4f69\u670d\u3002\u6b63\u8bfe\u671f\u95f4\u54b1\u4eec\u8282\u594f\u4f1a\u5feb\u4e00\u4e9b\uff0c\u4f46\u522b\u62c5\u5fc3\uff0c\u4f60\u7684\u60c5\u51b5\u6211\u8bb0\u4e0b\u4e86\u3002\u4e07\u4e00\u5bb6\u91cc\u5b9d\u5b9d\u6709\u4e8b\u6216\u8005\u5de5\u4f5c\u5fd9\u4e0d\u8fc7\u6765\uff0c\u968f\u65f6\u79c1\u4fe1\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u8c03\u6574\u8ba1\u5212\uff0c**\u4fdd\u8bc1\u4f60\u4e0d\u6389\u961f**\u3002\u4f60\u8fd9\u79cd\u7a33\u624e\u7a33\u6253\u7684\u98ce\u683c\uff0c\u5b66\u51fa\u6765\u6548\u679c\u80af\u5b9a\u6700\u624e\u5b9e\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176\u8e0f\u5b9e\u3001\u6709\u8d23\u4efb\u611f\u7684\u6027\u683c\uff0c\u63d0\u4f9b\u6e05\u6670\u3001\u6709\u6df1\u5ea6\u7684\u6280\u80fd\u8fdb\u9636\u8def\u5f84\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\u7684\u7279\u70b9\uff0c\u8865\u5145**\u3010\u5f39\u6027\u65f6\u95f4\u7ba1\u7406\u6307\u5357\u3011**\u548c**\u3010\u91cd\u70b9\u96be\u70b9\u5f55\u64ad\u5207\u7247\u3011**\uff0c\u5e2e\u52a9\u5176\u9ad8\u6548\u5229\u7528\u6709\u9650\u65f6\u95f4\u3002**\u8c28\u614e\u63d0\u4f9b\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\uff0c\u8fc7\u5ea6\u60c5\u611f\u5173\u6000\u53ef\u80fd\u8ba9\u5176\u611f\u5230\u88ab\u201c\u7279\u6b8a\u7167\u987e\u201d\u800c\u4e0d\u9002\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a**\u7528\u201c\u6700\u540e\u540d\u989d\u201d\u3001\u201c\u5012\u8ba1\u65f6\u201d\u7b49\u8bdd\u672f\u5bf9\u5176\u65bd\u538b**\uff1b**\u5728\u5176\u56e0\u5bb6\u5ead\u4e8b\u52a1\u5ef6\u8bef\u65f6\uff0c\u8fdb\u884c\u4efb\u4f55\u5f62\u5f0f\u7684\u6279\u8bc4\u6216\u5bf9\u6bd4**\uff08\u5982\u201c\u4f60\u770b\u522b\u4eba\u90fd\u4ea4\u4e86\u201d\uff09\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u5fc5\u987b\u5efa\u7acb\u5728\u624e\u5b9e\u7684\u5b66\u4e60\u6210\u679c\u548c\u660e\u786e\u7684\u4e2a\u4eba\u65f6\u95f4\u89c4\u5212\u4e4b\u540e**\u3002\u907f\u514d\u5728\u5176\u65f6\u95f4\u6700\u7d27\u5f20\u7684\u9636\u6bb5\u63a8\u9500\u9ad8\u9636\u8bfe\u7a0b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5c3d\u91cf\u6324\u65f6\u95f4\u5427[\u6d41\u6cea]\u201d **\u2014\u2014 \u8d44\u6e90\u5e95\u5ea7\uff08\u65f6\u95f4\uff09\u77ed\u677f\u7684\u6838\u5fc3\u8bc1\u636e\u3002**\n2. > \u201c\u4f5c\u4e1a\u6211\u5c3d\u529b\uff0c\u4e8c\u5b9d\u751f\u75c5\uff0c\u8fd9\u51e0\u5929\u6709\u70b9\u7126\u5934\u70c2\u989d[\u6342\u8138]\u201d **\u2014\u2014 \u9ad8\u5fc3\u7406\u5f39\u6027\u4e0e\u8d23\u4efb\u611f\u7684\u4f53\u73b0\uff0c\u9047\u632b\u4e3b\u52a8\u6c9f\u901a\uff0c\u4e0d\u62b1\u6028\u3002**\n3. > \u201c\u6211\u521a\u521a\u6709\u4e2a\u5de5\u4f5c\u7fa4\u88ab\u505c\u4e86\uff0c\u6211\u662f\u7fa4\u7ba1\u4e4b\u4e00\uff0c\u5c31\u88ab\u9650\u5236\u4e86[\u6d41\u6cea]...\u663e\u793a\u89811\u5468\u65f6\u95f4\u201d **\u2014\u2014 \u518d\u6b21\u8bc1\u660e\u5176\u9047\u4e8b\u51b7\u9759\u89e3\u91ca\u3001\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\u7684\u6210\u719f\u5fc3\u6001\uff0c\u975e\u60c5\u7eea\u5316\u4eba\u683c\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u793e\u7fa4\u4e2d\u83b7\u5f97\u7a33\u5b9a\u7684\u5f52\u5c5e\u611f\u548c\u56e0\u514b\u670d\u56f0\u96be\u575a\u6301\u5b66\u4e60\u800c\u83b7\u5f97\u7684\u5c0a\u91cd\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u5f39\u6027\u7684\u65f6\u95f4\u652f\u6301\u548c\u4efb\u52a1\u5b8c\u6210\u65b9\u6848\uff0c\u7528\u201c\u4fe1\u4efb\u201d\u548c\u201c\u7406\u89e3\u201d\u66ff\u4ee3\u201c\u50ac\u4fc3\u201d\uff0c\u4e25\u9632\u5176\u56e0\u65f6\u95f4\u6324\u538b\u4ea7\u751f\u7d2f\u79ef\u6027\u632b\u8d25\u800c\u6c89\u9ed8\u6d41\u5931\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u793e\u4ea4\u4e0e\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\"}\n```";
