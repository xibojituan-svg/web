        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u542c\u6f9c (UID: 676997609) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-13 \u81f3 2026-03-23 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u964c\u5b09(\u5434\u5ff5\u5e86) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66/\u914d\u97f3\u57f9\u8bad\u8bfe\u7a0b (\u4ef7\u683c\u672a\u77e5) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3** (\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u91d1\u989d\u6216\u7ecf\u6d4e\u538b\u529b) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3** (\u63d0\u53ca\u201c\u503c\u73ed\u201d\u3001\u201c\u5355\u4f4d\u4eba\u591a\u201d\uff0c\u63a8\u6d4b\u4e3a\u5728\u804c\u72b6\u6001\uff0c\u4f46\u5177\u4f53\u65f6\u95f4\u5f39\u6027\u672a\u77e5) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3** (\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u4fe1\u606f) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** (\u804a\u5929\u8bb0\u5f55\u591a\u4e3a\u793e\u7fa4\u4e92\u52a8\uff0c\u7f3a\u4e4f\u5173\u4e8e\u5b66\u4e60\u76ee\u6807\u3001\u7ecf\u6d4e\u72b6\u51b5\u3001\u5bb6\u5ead\u80cc\u666f\u3001\u8fc7\u5f80\u7ecf\u5386\u7b49\u5173\u952e\u51b3\u7b56\u4fe1\u606f) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u5174\u8da3\u9a71\u52a8\u4e0e\u793e\u7fa4\u5f52\u5c5e\u611f\u5f3a\uff0c\u53d8\u73b0\u52a8\u673a\u4e0d\u660e\u786e\u3002\u7528\u6237\u79ef\u6781\u53c2\u4e0e\u793e\u7fa4\u4e92\u52a8\u3001\u4eab\u53d7\u88ab\u5938\u8d5e\u3001\u4e50\u4e8e\u52a9\u4eba\u3001\u8ba8\u8bba\u827a\u672f\u521b\u4f5c\uff0c\u8868\u73b0\u51fa\u5bf9\u6709\u58f0\u6f14\u64ad\u672c\u8eab\u7684\u6d53\u539a\u5174\u8da3\u548c\u793e\u4ea4\u9700\u6c42\u3002**\u672a\u63d0\u53ca\u4efb\u4f55\u5173\u4e8e\u53d8\u73b0\u3001\u8d5a\u94b1\u3001\u63a5\u5355\u7684\u8feb\u5207\u9700\u6c42\u6216\u7591\u95ee\u3002**\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u662f\u89c9\u5f97\uff0c\u53ea\u8981\u4eba\u5f88\u5389\u5bb3\u5f88\u4f18\u79c0\uff0c\u58f0\u97f3\u5c31\u4e0d\u4f1a\u663e\u5f97\u90a3\u4e48\u91cd\u8981\u201d\uff1b > \u201c\u4f5c\u54c1\u7684\u80cc\u540e\u5f80\u5f80\u662f\u4eba\u7684\u7ecf\u5386\u4e0e\u6545\u4e8b\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 \u81ea\u8d2d\u4e13\u4e1a\u52a8\u5708\u8bdd\u7b52\uff08SM58\uff09\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u6d88\u8d39\u80fd\u529b\u548c\u6295\u5165\u610f\u613f\uff0c\u4f46\u672a\u900f\u9732\u652f\u4ed8\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 \u80fd\u53c2\u4e0e\u65e9\u665a\u8bfe\u3001\u73ed\u4f1a\u3001pia\u620f\uff0c\u5e76\u4e3b\u52a8\u5e2e\u52a9\u540c\u5b66\u89e3\u51b3\u8f6f\u4ef6\u5b89\u88c5\u95ee\u9898\uff0c\u663e\u793a\u65f6\u95f4\u7ba1\u7406\u5c1a\u53ef\uff0c\u4f46\u5076\u6709\u201c\u503c\u73ed\u201d\u4efb\u52a1\u5f71\u54cd\u53c2\u4e0e\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u4e0d\u8db3] \u2014 \u804a\u5929\u8bb0\u5f55\u4e2d\u5b8c\u5168\u672a\u63d0\u53ca\u5bb6\u5ead\uff0c\u65e0\u6cd5\u5224\u65ad\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u7528\u6237\u8868\u73b0\u51fa\u6781\u5f3a\u7684\u4e3b\u52a8\u6027\u548c\u89e3\u51b3\u95ee\u9898\u7684\u80fd\u529b\uff08\u6307\u5bfc\u540c\u5b66\u5b89\u88c5\u8f6f\u4ef6\uff09\uff0c\u60c5\u7eea\u79ef\u6781\u5916\u5411\uff0c\u4e50\u4e8e\u793e\u4ea4\u548c\u8868\u8fbe\u3002\u5728\u9047\u5230\u89c4\u5219\u7591\u95ee\uff08\u7981\u8a00\u7fa4\u64a4\u56de\uff09\u65f6\uff0c\u80fd\u4e3b\u52a8\u3001\u7406\u6027\u5730\u5bfb\u6c42\u73ed\u4e3b\u4efb\u6f84\u6e05\uff0c\u800c\u975e\u60c5\u7eea\u5316\u62b1\u6028\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5927\u5bb6\u53ef\u4ee5\u5148\u7167\u7740\u6b65\u9aa4\u5b89\u88c5\uff0c\u4e0d\u4f1a\u7684\u8bdd\uff0c\u6211\u53ef\u4ee5\u5e2e\u4f60\u54e6\u201d\uff1b > \u201c\u73ed\u73ed\uff0c\u60a8\u53ef\u4ee5\u63d0\u9192\u4e00\u4e0b\u90a3\u4e2a\u6728\u6613\u5417\uff1f\u4ed6\u8fd9\u6837\u957f\u65f6\u95f4\u4e00\u4e2a\u4eba\u5360\u9ea6\uff0c\u5f88\u5f71\u54cd\u542c\u8bfe\u4f53\u9a8c\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42 / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9**\u8ba4\u53ef\u3001\u5173\u6ce8\u548c\u793e\u7fa4\u5f52\u5c5e\u611f**\u6709\u5f3a\u70c8\u9700\u6c42\u3002\u4ed6\u4e3b\u52a8\u7d22\u8981\u5938\u5956\uff08\u201c\u5feb\uff0c\u5728\u7fa4\u91cc\u5938\u6211\u201d\uff09\uff0c\u4eab\u53d7\u88ab\u5173\u6ce8\u7684\u611f\u89c9\uff08\u201c\u9ad8\u5174\u6b7b\u4e86\uff01\uff01\uff01\u201d\uff09\uff0c\u5e76\u79ef\u6781\u5728\u793e\u7fa4\u4e2d\u626e\u6f14\u201c\u6280\u672f\u8fbe\u4eba\u201d\u548c\u201c\u6c1b\u56f4\u7ec4\u201d\u89d2\u8272\uff0c\u4ee5\u83b7\u53d6\u5b58\u5728\u611f\u548c\u4ef7\u503c\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u8d4b\u4e88\u5176\u201c\u793e\u7fa4\u9886\u8896\u201d\u6216\u201c\u6838\u5fc3\u6210\u5458\u201d\u7684\u8eab\u4efd\u5149\u73af**\uff0c\u63d0\u4f9b\u516c\u5f00\u7684\u3001\u4eea\u5f0f\u611f\u7684\u8ba4\u53ef\u4e0e\u5938\u8d5e\uff0c\u6ee1\u8db3\u5176\u88ab\u5c0a\u91cd\u548c\u5efa\u7acb\u793e\u4ea4\u8fde\u63a5\u7684\u6df1\u5c42\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u9ad8\u53c2\u4e0e\u5ea6\u3001\u9ad8\u4e92\u52a8\u6027\uff0c\u4f46\u6838\u5fc3\u53d8\u73b0\u52a8\u673a\u6a21\u7cca\uff0c\u5c5e\u4e8e\u9ad8\u6f5c\u529b\u4f46\u9700\u5f15\u5bfc\u8f6c\u5316\u7684\u7528\u6237) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T1 \u5708\u517b\u9886\u8896\u578b** (\u6838\u5fc3\u7279\u5f81\uff1a\u4eab\u53d7\u88ab\u5173\u6ce8\uff0c\u4e50\u4e8e\u7ec4\u7ec7\u3001\u5e2e\u52a9\u4ed6\u4eba\uff0c\u5728\u793e\u7fa4\u4e2d\u5bfb\u6c42\u9886\u5bfc\u5730\u4f4d\u548c\u8ba4\u53ef) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u56e0\u5176\u72ec\u7acb\u6027\u5f3a\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5c1a\u53ef\uff0c\u4e14\u6709\u503c\u73ed\u5b89\u6392\uff0c\u4f46\u6574\u4f53\u8ddf\u8fdb\u610f\u613f\u5f3a\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | **\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u662f\u5e2e\u52a9\u8005\u800c\u975e\u6c42\u52a9\u8005\u3002** |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u82e5\u8bfe\u7a0b\u540e\u671f\u65e0\u6cd5\u6ee1\u8db3\u5176\u201c\u88ab\u8ba4\u53ef\u201d\u548c\u201c\u793e\u4ea4\u5730\u4f4d\u201d\u9700\u6c42\uff0c\u6216\u611f\u5230\u81ea\u5df1\u4e0d\u518d\u662f\u7126\u70b9\uff0c\u53ef\u80fd\u56e0\u201c\u4ef7\u503c\u611f\u843d\u7a7a\u201d\u800c\u6d41\u5931\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u8bfe\u7a0b\u4e2d\u540e\u671f\uff08\u7b2c4-6\u5468\uff09**\u3002\u5f53\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u82e5\u672a\u83b7\u5f97\u9884\u671f\u7684\u793e\u7fa4\u5730\u4f4d\u6216\u6df1\u5ea6\u8ba4\u53ef\uff0c\u53ef\u80fd\u56e0\u201c\u65e0\u804a\u201d\u6216\u201c\u4e0d\u88ab\u91cd\u89c6\u201d\u800c\u6c89\u9ed8\u6216\u9000\u51fa\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u542c\u6f9c\uff0c\u6211\u770b\u4f60\u5728\u7fa4\u91cc\u7279\u522b\u6d3b\u8dc3\uff0c\u800c\u4e14\u5f88\u70ed\u5fc3\u5e2e\u52a9\u540c\u5b66\uff0c\u7b80\u76f4\u662f\u54b1\u4eec\u73ed\u7684\u2018\u6280\u672f\u5927\u795e\u2019\u517c\u2018\u6c1b\u56f4\u62c5\u5f53\u2019\u3002\u54b1\u4eec\u73ed\u6b63\u9700\u8981\u4f60\u8fd9\u6837\u6709\u9886\u5bfc\u529b\u7684\u540c\u5b66\uff0c\u4ee5\u540e\u73ed\u59d4/\u5c0f\u7ec4\u957f\u7684\u4f4d\u7f6e\uff0c\u6211\u7b2c\u4e00\u4e2a\u60f3\u5230\u4f60\u3002\u671f\u5f85\u4f60\u5e26\u7740\u5927\u5bb6\u4e00\u8d77\u73a9\u51fa\u5f69\uff01\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf**\u3011\u3002\u91cd\u70b9\u4e0d\u662f\u6559\u4ed6\u6280\u80fd\uff0c\u800c\u662f\u7ed9\u4ed6\u821e\u53f0\u548c\u8eab\u4efd\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u8eab\u4efd\u5149\u73af\u5305**\u3011\uff1a\u4efb\u547d\u4e3a\u73ed\u59d4/\u5c0f\u7ec4\u957f\uff1b\u3010**\u786c\u6838\u624b\u827a\u6c60\uff08\u8f7b\u91cf\uff09**\u3011\uff1a\u7ed9\u4e88\u5176\u201c\u52a9\u6559\u201d\u8eab\u4efd\uff0c\u9080\u8bf7\u5176\u5076\u5c14\u89e3\u7b54\u540c\u5b66\u6280\u672f\u95ee\u9898\uff0c\u5e76\u516c\u5f00\u8868\u626c\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5ffd\u89c6\u4ed6\u7684\u8d21\u732e\u548c\u53d1\u8a00\u3002**\u7edd\u4e0d\u80fd\u8ba9\u4ed6\u611f\u5230\u88ab\u51b7\u843d\u6216\u4e0d\u88ab\u9700\u8981**\u3002\u907f\u514d\u5c06\u4ed6\u89c6\u4e3a\u666e\u901a\u5b66\u5458\u8fdb\u884c\u673a\u68b0\u5316\u7ba1\u7406\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5411\u4ed6\u63a8\u8350\u9ad8\u9636\u7684\u201c\u5bfc\u5e08\u8bad\u7ec3\u8425\u201d\u3001\u201c\u79c1\u8463\u4f1a\u201d\u6216\u201c\u7ebf\u4e0b\u6e38\u5b66\u201d\u7b49\u80fd\u5f3a\u5316\u5176\u201c\u9886\u8896\u201d\u8eab\u4efd\u548c\u5708\u5c42\u4ef7\u503c\u7684\u9ad8\u9636\u4ea7\u54c1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u4eca\u5929\u4f5c\u4e1a\u505a\u7684\u8fd9\u4e48\u597d\uff0c\u7adf\u7136\u6ca1\u6709\u4eba\u5938\u6211 @\u8584\u8377\u5473\u2005\u5feb\uff0c\u5728\u7fa4\u91cc\u5938\u6211\u201d\n2. > \u201c\u5927\u5bb6\u53ef\u4ee5\u5148\u7167\u7740\u6b65\u9aa4\u5b89\u88c5\uff0c\u4e0d\u4f1a\u7684\u8bdd\uff0c\u6211\u53ef\u4ee5\u5e2e\u4f60\u54e6\u201d\n3. > \u201c\u73ed\u73ed\uff0c\u60a8\u53ef\u4ee5\u63d0\u9192\u4e00\u4e0b\u90a3\u4e2a\u6728\u6613\u5417\uff1f\u4ed6\u8fd9\u6837\u957f\u65f6\u95f4\u4e00\u4e2a\u4eba\u5360\u9ea6\uff0c\u5f88\u5f71\u54cd\u542c\u8bfe\u4f53\u9a8c\uff0c\u8bfe\u5802\u662f\u5927\u5bb6\u7684\uff0c\u4e0d\u662f\u4ed6\u4e00\u4e2a\u4eba\u7684\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T1 \u5708\u517b\u9886\u8896\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u793e\u7fa4\u4e2d\u83b7\u5f97\u5c0a\u91cd\u3001\u8ba4\u53ef\u4e0e\u9886\u5bfc\u5730\u4f4d\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u8d4b\u4e88\u5176\u5b98\u65b9\u8ba4\u53ef\u7684\u201c\u9886\u5bfc\u8005\u201d\u8eab\u4efd\uff0c\u5e76\u6301\u7eed\u63d0\u4f9b\u516c\u5f00\u7684\u3001\u4eea\u5f0f\u611f\u7684\u8d5e\u7f8e\u4e0e\u5173\u6ce8\u3011**\u3002\n\n{\"core_type\": \"T1 \u5708\u517b\u9886\u8896\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd/\u793e\u4ea4\", \"target_product_line\": \"\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\"}";
