    <script>
        const markdownText = "\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e\u3002\u7f3a\u5931\u5173\u952e\u4fe1\u606f\uff1a\u652f\u4ed8\u8bb0\u5f55\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u5177\u4f53\u8bfe\u7a0b\u4ef7\u683c\u3001\u7528\u6237\u5e74\u9f84/\u804c\u4e1a/\u5bb6\u5ead\u7ed3\u6784\u3001\u660e\u786e\u7684\u6536\u5165\u9884\u671f\u4e0e\u65f6\u95f4\u627f\u8bfa\u3002\n\n# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49)**\n    *   **\u8868\u5c42**\uff1a\u5b66\u4e60\u6f14\u64ad\u6280\u80fd\uff0c\u6e34\u671b\u63a5\u5355\u53d8\u73b0\uff0c\u7f13\u89e3\u7ecf\u6d4e\u538b\u529b\u3002\n    *   **\u6df1\u5c42**\uff1a\u5bfb\u6c42\u804c\u4e1a\u8f6c\u578b\u6216\u526f\u4e1a\u53ef\u80fd\u6027\uff0c\u5bf9\u6709\u58f0\u884c\u4e1a\u6709\u57fa\u672c\u5174\u8da3\u548c\u63a2\u7d22\u610f\u613f\u3002\n    *   **\u98ce\u9669\u4fe1\u53f7**\uff1a**\u53d8\u73b0\u8bc9\u6c42\u660e\u786e\u4e14\u6025\u8feb**\uff08\u201c\u7ecf\u6d4e\u538b\u529b\u6709\u70b9\u5927\uff0c\u60f3\u80fd\u65e9\u70b9\u53d8\u73b0\u201d\uff09\uff0c\u5b58\u5728\u5c06\u8bfe\u7a0b\u89c6\u4e3a\u201c\u5feb\u901f\u8d5a\u94b1\u5de5\u5177\u201d\u7684\u6f5c\u5728\u8ba4\u77e5\u504f\u5dee\u3002\n\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d\u7b49\u504f\u4f4e)**\n    *   **\u7ecf\u6d4e**\uff1a\u80fd\u652f\u4ed8\u8bfe\u7a0b\u53ca\u989d\u5916\u8bbe\u5907\u8d39\u7528\uff08\u8d2d\u4e70\u4e86SE\u5957\u88c5\uff09\uff0c\u4f46**\u8bbe\u5907\u8d2d\u4e70\u51b3\u7b56\u8fc7\u7a0b\u663e\u793a\u7ecf\u6d4e\u5e76\u4e0d\u5bbd\u88d5**\uff08\u201c\u6211\u518d\u7a0d\u5fae\u8003\u8651\u4e00\u4e0b\u201d\uff09\uff0c\u4e14\u4f7f\u7528\u8001\u65e7Mac\u7535\u8111\uff0c\u9700\u989d\u5916\u82b1\u8d39\u89e3\u51b3\u5b89\u88c5\u95ee\u9898\u3002\n    *   **\u65f6\u95f4**\uff1a\u80fd\u8ddf\u4e0a\u8bfe\u7a0b\u3001\u73ed\u4f1a\u3001\u5c0f\u7ec4\u6d3b\u52a8\uff0c\u4f46**\u9700\u517c\u987e\u5bb6\u5ead**\uff08\u201c\u4e2d\u5348\u653e\u5b66\u8981\u63a5\u5b69\u5b50\u201d\uff09\uff0c\u6697\u793a\u975e\u5168\u804c\u5b66\u4e60\u72b6\u6001\u3002\n    *   **\u8bbe\u5907/\u73af\u5883**\uff1a\u521d\u671f\u8bbe\u5907\u7b80\u964b\uff08\u624b\u673a\uff09\uff0c\u540e\u4e3b\u52a8\u5347\u7ea7\u4e13\u4e1a\u8bbe\u5907\uff0c\u5177\u5907\u57fa\u7840\u5b66\u4e60\u6761\u4ef6\u3002\u4f46\u6280\u672f\u57fa\u7840\u4e00\u822c\uff08AU\u5b89\u88c5\u56f0\u96be\uff09\u3002\n\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u7b49\u504f\u9ad8)**\n    *   **\u575a\u6301\u6027**\uff1a\u8f83\u9ad8\u3002\u80fd\u6301\u7eed\u53c2\u4e0e\u8bfe\u7a0b\u3001\u63d0\u95ee\uff08r/l\u53d1\u97f3\uff09\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u4e3b\u52a8\u7ec4\u961f\u53c2\u4e0e\u5b9e\u6218\u9879\u76ee\u3002\n    *   **\u95ee\u9898\u89e3\u51b3**\uff1a\u4e3b\u52a8\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08AU\u5b89\u88c5\u3001\u58f0\u5361\u8fde\u63a5\uff09\u4f1a\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\uff08\u81ea\u884c\u4ed8\u8d39\u5b89\u88c5\u3001\u8be2\u95ee\u73ed\u73ed\uff09\u3002\n    *   **\u632b\u6298\u53cd\u5e94**\uff1a\u79ef\u6781\u3002\u9762\u5bf9\u5b66\u4e60\u96be\u70b9\uff08\u53d1\u97f3\u3001\u6c14\u606f\uff09\u80fd\u6301\u7eed\u7ec3\u4e60\u5e76\u5bfb\u6c42\u53cd\u9988\uff0c\u672a\u6d41\u9732\u653e\u5f03\u60c5\u7eea\u3002\n    *   **\u4ece\u4f17\u6027**\uff1a\u5b58\u5728\u3002\u5728\u9500\u552e\u201c\u65e9\u7528\u65e9\u53d7\u76ca\u201d\u3001\u201c\u5185\u9a71\u529b\u66f4\u5f3a\u201d\u7b49\u8bdd\u672f\u5f71\u54cd\u4e0b\uff0c\u6700\u7ec8\u8d2d\u4e70\u4e86\u63a8\u8350\u8bbe\u5907\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a**\u4fe1\u606f\u7f3a\u5931**\u3002\u8bb0\u5f55\u663e\u793a\u7528\u6237\u5df2\u4e0b\u5355\u8d2d\u4e70\u8bbe\u5907\uff0c\u4f46**\u672a\u63d0\u53ca\u8bfe\u7a0b\u672c\u8eab\u662f\u5426\u5df2\u4ed8\u8d39\u3001\u4ed8\u8d39\u91d1\u989d\u53ca\u65b9\u5f0f**\u3002\u6b64\u4e3a\u5173\u952e\u98ce\u9669\u655e\u53e3\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u7f3a\u5931**\u3002\u7528\u6237\u63d0\u53ca\u201c\u63a5\u5b69\u5b50\u201d\uff0c\u6697\u793a\u53ef\u80fd\u6709\u5bb6\u5ead\uff0c\u4f46**\u8d2d\u4e70\u8bfe\u7a0b\u53ca\u8bbe\u5907\u7684\u51b3\u7b56\u662f\u5426\u4e3a\u4e2a\u4eba\u72ec\u7acb\u505a\u51fa\uff0c\u6216\u9700\u4e0e\u914d\u5076/\u5bb6\u4eba\u5546\u8bae\uff0c\u5b8c\u5168\u672a\u77e5**\u3002\u6b64\u4e3a\u9ad8\u9000\u8d39\u98ce\u9669\u70b9\u3002\n*   **\u6b65\u9aa42-4\uff1a\u7efc\u5408\u5224\u5b9a**\uff1a\u57fa\u4e8e\u73b0\u6709\u884c\u4e3a\u4fe1\u53f7\uff0c\u7528\u6237\u8868\u73b0\u4e3a **B-\uff08\u52a8\u673a\u660e\u786e\u4f46\u8d44\u6e90\u7d27\u5f20\u578b\uff09** \u4e0e **C+\uff08\u6613\u53d7\u5f15\u5bfc\u7684\u52a1\u5b9e\u8005\uff09** \u7684\u6df7\u5408\u7279\u5f81\u3002**\u6838\u5fc3\u77db\u76fe\u5728\u4e8e\u6025\u5207\u7684\u53d8\u73b0\u52a8\u673a\u4e0e\u53ef\u80fd\u53d7\u9650\u7684\u8d44\u6e90\uff08\u65f6\u95f4\u3001\u7ecf\u6d4e\uff09\u53ca\u884c\u4e1a\u73b0\u5b9e\u4e4b\u95f4\u7684\u843d\u5dee**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u6700\u5339\u914d\u539f\u578b\uff1aT5 \u52a1\u5b9e\u63a2\u7d22\u8005**\uff1a\u6838\u5fc3\u9a71\u52a8\u4e3a\u201c\u5b66\u4ee5\u81f4\u7528\u201d\u548c\u53d8\u73b0\uff0c\u884c\u52a8\u529b\u5f3a\uff0c\u613f\u610f\u4e3a\u63d0\u5347\u6548\u679c\u6295\u8d44\uff08\u4e70\u8bbe\u5907\uff09\uff0c\u4f46**\u5bf9\u884c\u4e1a\u96be\u5ea6\u548c\u53d8\u73b0\u5468\u671f\u7f3a\u4e4f\u8db3\u591f\u8ba4\u77e5**\u3002\n*   **\u6b21\u5339\u914d\u539f\u578b\uff1aT4 \u7126\u8651\u6539\u5584\u8005**\uff1a\u5b58\u5728\u7ecf\u6d4e\u538b\u529b\u5e26\u6765\u7684\u7126\u8651\uff0c\u5e0c\u671b\u901a\u8fc7\u6280\u80fd\u5b66\u4e60\u6539\u53d8\u73b0\u72b6\uff0c\u6613\u53d7\u201c\u5feb\u901f\u53d8\u73b0\u201d\u3001\u201c\u62b1\u56e2\u53d6\u6696\u201d\u7b49\u627f\u8bfa\u5f71\u54cd\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4e2d\u9ad8)\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u4e0d\u53ca\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u201c\u65e9\u70b9\u53d8\u73b0\u201d\u671f\u671b\u9ad8\uff0c\u4f46\u57fa\u672c\u529f\u7ec3\u4e60\uff08\u5982\u533a\u5206r/l\uff09\u5df2\u663e\u793a\u96be\u5ea6\uff0c\u540e\u7eed\u63a5\u5355\u7ade\u4e89\u6fc0\u70c8\uff0c\u53d8\u73b0\u5468\u671f\u957f\uff0c\u6781\u6613\u4ea7\u751f\u843d\u5dee\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u4e2d\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u660e\u786e\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\uff0c\u4e14\u8bbe\u5907\u8d2d\u4e70\u51b3\u7b56\u8c28\u614e\u3002**\u82e5\u8bfe\u7a0b\u8d39\u7528\u672c\u8eab\u6784\u6210\u8d1f\u62c5\uff0c\u6216\u77ed\u671f\u5185\u65e0\u6536\u5165\uff0c\u9000\u8d39\u98ce\u9669\u6fc0\u589e**\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u4e2d\u98ce\u9669**\u3002\u9700\u63a5\u9001\u5b69\u5b50\uff0c\u6697\u793a\u5bb6\u5ead\u8d23\u4efb\u53ef\u80fd\u6324\u538b\u5b66\u4e60\u4e0e\u7ec3\u4e60\u65f6\u95f4\uff0c\u957f\u671f\u53ef\u80fd\u5bfc\u81f4\u96be\u4ee5\u8ddf\u4e0a\u8fdb\u5ea6\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u9ad8\u98ce\u9669**\u3002**\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u7f3a\u5931\u662f\u6700\u5927\u96f7\u533a**\u3002\u82e5\u5bb6\u4eba\u4e0d\u77e5\u60c5\u6216\u53cd\u5bf9\u6b64\u9879\u6d88\u8d39\uff0c\u9000\u8d39\u53ef\u80fd\u6027\u6781\u9ad8\u3002\n    5.  **\u9500\u552e\u8bef\u5bfc**\uff1a**\u4e2d\u98ce\u9669**\u3002\u9500\u552e\u5b58\u5728\u201c\u80af\u5b9a\u6ca1\u95ee\u9898\u201d\u3001\u201c\u62a5\u5230\u5267\u7ec4\u201d\u3001\u201c\u65e9\u7528\u65e9\u53d7\u76ca\u201d\u7b49\u8fc7\u5ea6\u627f\u8bfa\u548c\u50ac\u5355\u8bdd\u672f\uff08\u8bbe\u5907\u63a8\u9500\uff09\uff0c\u53ef\u80fd\u62c9\u9ad8\u7528\u6237\u9884\u671f\u3002\n    6.  **\u4ea7\u54c1\u670d\u52a1**\uff1a**\u4f4e\u98ce\u9669**\u3002\u7528\u6237\u79ef\u6781\u53c2\u4e0e\uff0c\u5bf9\u73ed\u73ed\u3001\u552e\u540e\u54cd\u5e94\u57fa\u672c\u6ee1\u610f\uff0c\u76ee\u524d\u672a\u663e\u670d\u52a1\u7aef\u95ee\u9898\u3002\n    7.  **\u4e2a\u4eba\u7a81\u53d1**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u4e3b\u8981\u8fdd\u89c4/\u98ce\u9669\u70b9**\uff1a\n    *   **\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u65bd\u538b**\uff1a\u9500\u552e\u4f7f\u7528\u201c\u80af\u5b9a\u6ca1\u6709\u95ee\u9898\u201d\u3001\u201c\u6211\u4f1a\u76f4\u63a5\u628a\u4f60\u62a5\u5230\u5267\u7ec4\u201d\u3001\u201c\u5185\u9a71\u529b\u4f1a\u66f4\u5f3a\u2026\u66f4\u5bb9\u6613\u5b66\u597d\u201d\u7b49\u8bdd\u672f\uff0c**\u6a21\u7cca\u4e86\u57f9\u8bad\u4e0e\u5c31\u4e1a\u4fdd\u969c\u7684\u754c\u9650**\uff0c\u5e76\u5229\u7528\u7126\u8651\u611f\uff08\u201c\u803d\u8bef\u4f60\u81ea\u5df1\u7684\u6210\u957f\u201d\uff09\u4fc3\u5355\u3002\n    *   **\u8bbe\u5907\u6346\u7ed1\u8425\u9500**\uff1a\u9500\u552e\u5c06\u8bbe\u5907\u8d2d\u4e70\u4e0e\u5b66\u4e60\u6548\u679c\u3001\u804c\u4e1a\u89c4\u5212\u5f3a\u5173\u8054\uff08\u201c\u5982\u679c\u60f3\u8d70\u8fd9\u4e2a\u65b9\u5411\u2026\u5c31\u662f\u4e00\u54ac\u7259\u5c31OK\u4e86\u201d\uff09\uff0c**\u5b58\u5728\u8bf1\u5bfc\u975e\u5fc5\u8981\u6d88\u8d39\u7684\u5acc\u7591**\u3002\n    *   **\u77e5\u60c5\u6743\u98ce\u9669**\uff1a\u8bb0\u5f55\u4e2d**\u5b8c\u5168\u672a\u6d89\u53ca\u5bf9\u8bfe\u7a0b\u4ef7\u683c\u3001\u670d\u52a1\u6761\u6b3e\u3001\u9000\u8d39\u653f\u7b56\u7684\u660e\u786e\u544a\u77e5\u4e0e\u786e\u8ba4\u73af\u8282**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**\uff1a**\u504f\u5dee**\u3002\u7528\u6237\u6838\u5fc3\u9700\u6c42\u662f\u201c\u5feb\u901f\u53d8\u73b0\u201d\uff0c\u4f46\u4ea7\u54c1\u672c\u8d28\u662f\u201c\u6280\u80fd\u57f9\u8bad\u201d\uff0c\u4e24\u8005\u5b58\u5728\u6839\u672c\u6027\u9519\u4f4d\u98ce\u9669\u3002\u73ed\u4e3b\u4efb\u9700\u7740\u529b\u6821\u6b63\u6b64\u9884\u671f\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**24h\u5185\u7d27\u6025\u6838\u67e5\u652f\u4ed8\u4e0e\u5bb6\u5ead\u77e5\u60c5\u72b6\u51b5**\u3002\n*   **\u5177\u4f53\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u7d27\u6025\u98ce\u63a7**\uff1a\u7acb\u5373\u8054\u7cfb\u7528\u6237\uff0c\u4ee5\u201c\u670d\u52a1\u5173\u6000\u201d\u540d\u4e49\uff0c\u6e29\u548c\u4f46\u76f4\u63a5\u5730\u786e\u8ba4\uff1a\u2460\u8bfe\u7a0b\u8d39\u7528\u662f\u5426\u7531\u672c\u4eba\u652f\u4ed8\u3001\u652f\u4ed8\u65b9\u5f0f\uff1b\u2461\u5b66\u4e60\u51b3\u5b9a\u662f\u5426\u5df2\u4e0e\u5bb6\u4eba\u6c9f\u901a\u5e76\u83b7\u5f97\u652f\u6301\u3002**\u6b64\u6b65\u9aa4\u5fc5\u987b\u6267\u884c\uff0c\u7528\u4e8e\u6392\u9664\u6700\u5927\u9000\u8d39\u96f7\u533a**\u3002\n    2.  **\u9884\u671f\u7ba1\u7406**\uff1a\u5728\u9996\u5468\u8f85\u5bfc\u4e2d\uff0c\u91cd\u70b9\u5f3a\u8c03\u6709\u58f0\u884c\u4e1a\u7684\u73b0\u72b6\u3001\u53d8\u73b0\u5468\u671f\u3001\u6210\u529f\u6240\u9700\u7684\u65f6\u95f4\u4e0e\u7ec3\u4e60\u6295\u5165\uff0c\u7528\u6848\u4f8b\u66ff\u4ee3\u627f\u8bfa\uff0c**\u4e3b\u52a8\u7ed9\u7528\u6237\u7684\u201c\u6025\u8e81\u201d\u5fc3\u6001\u964d\u6e29**\u3002\n    3.  **\u4ef7\u503c\u5f3a\u5316**\uff1a\u80af\u5b9a\u5176\u5b66\u4e60\u884c\u52a8\u529b\uff08\u5982\u653b\u514b\u53d1\u97f3\u3001\u8d2d\u4e70\u8bbe\u5907\uff09\uff0c\u5c06\u8fdb\u6b65\u4e0e\u201c\u57fa\u672c\u529f\u624e\u5b9e\u201d\u6302\u94a9\uff0c\u800c\u975e\u76f4\u63a5\u4e0e\u201c\u63a5\u5355\u8d5a\u94b1\u201d\u6302\u94a9\uff0c\u5f15\u5bfc\u5173\u6ce8\u6280\u80fd\u6210\u957f\u672c\u8eab\u3002\n    4.  **\u6301\u7eed\u5173\u6ce8**\uff1a\u7559\u610f\u5176\u7ec3\u4e60\u65f6\u95f4\u662f\u5426\u7a33\u5b9a\uff0c\u5173\u6ce8\u5176\u5728\u9996\u6b21\u8bd5\u97f3\u6216\u5b9e\u6218\u9879\u76ee\u53d7\u632b\u65f6\u7684\u53cd\u5e94\uff0c\u63d0\u524d\u505a\u597d\u5fc3\u7406\u758f\u5bfc\u548c\u652f\u6301\u3002\n\n{\"core_type\": \"T5 \u52a1\u5b9e\u63a2\u7d22\u8005 (\u504fT4\u7126\u8651\u6539\u5584\u8005)\", \"risk_level\": \"\u4e2d\u9ad8\", \"refund_risk\": \"\u4e2d\u9ad8\", \"product_match\": \"\u504f\u5dee\", \"action\": \"24h\u5185\u7d27\u6025\u6838\u67e5\u652f\u4ed8\u4e0e\u5bb6\u5ead\u77e5\u60c5\"}";
