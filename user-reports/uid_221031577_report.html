        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 221031577 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-02-24 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9ed1\u55b5\u68ee\u6dfc(\u738b\u7389)\u3001\u843d\u6e05\u6800(\u90d1\u9676)\u3001\u5357\u679d/\u5609\u5609\u8389(\u9648\u7ea2\u4f1f) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u5199\u4f5c\u77ed\u6545\u4e8b\u57fa\u7840\u73ed (25\u671f) + \u6539\u7a3f\u8bfe (1880\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u5df2\u652f\u4ed8\u57fa\u7840\u73ed\uff0c\u5e76\u4e3b\u52a8\u7eed\u62a5\u6539\u7a3f\u8bfe\uff0c\u672a\u89c1\u652f\u4ed8\u56f0\u96be\u8868\u8ff0\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u5468\u516d\u9700\u4e0a\u73ed\uff0c\u4e3b\u8981\u4f9d\u8d56\u665a\u4e0a\u770b\u56de\u653e\u5b66\u4e60\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u4eba\uff0c\u9ed8\u8ba4\u5355\u8eab\u72ec\u7acb\u6216\u5df2\u62a5\u5907\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u5b66\u4e60\u8fc7\u7a0b\u3001\u5fc3\u6001\u53d8\u5316\u3001\u6280\u672f\u95ee\u9898\u5747\u6709\u5145\u5206\u4ea4\u4e92\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u521d\u671f\u4e3a\u5b66\u4e60\u6280\u80fd\u800c\u6765\uff0c\u6709\u53d8\u73b0\u671f\u5f85\u4f46\u975e\u6781\u7aef\u6025\u8feb\uff1b\u540e\u671f\u4e3b\u52a8\u7eed\u62a5\u9ad8\u9636\u8bfe\u7a0b\uff0c\u52a8\u673a\u5411\u4e13\u4e1a\u7cbe\u8fdb\u504f\u79fb\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u73ed\u73ed\uff0c\u6539\u7a3f\u8bfe\u662f\u591a\u5c11\u94b1\uff1f...\u6211\u8981\u62a5...\u6211\u89c9\u5f97\u6211\u5148\u8981\u628a\u57fa\u7840\u6253\u4e0b\uff0c\u90099\u671f\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 \u80fd\u8fde\u7eed\u652f\u4ed8\u57fa\u7840\u73ed\u548c\u6539\u7a3f\u8bfe\uff0c\u672a\u89c1\u7ecf\u6d4e\u538b\u529b\u8868\u8ff0\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 \u5468\u516d\u56fa\u5b9a\u4e0a\u73ed\uff0c\u5b66\u4e60\u65f6\u95f4\u4f9d\u8d56\u665a\u4e0a\u548c\u56de\u653e\uff0c\u5c5e\u4e8e**\u788e\u7247\u5316\u62fc\u51d1**\uff0c\u4f46\u6709\u6301\u7eed\u6295\u5165\u7684\u610f\u613f\u548c\u884c\u52a8\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u5b9a\u4e2d] \u2014 \u672a\u63d0\u53ca\u5bb6\u5ead\u963b\u529b\u6216\u652f\u6301\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b07\u4f4e\u6781\u5371]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56**\u3002\u9891\u7e41\u81ea\u6211\u5426\u5b9a\uff08\u201c\u6587\u91c7\u4e0d\u597d\u201d\u3001\u201c\u4e0d\u600e\u4e48\u4f1a\u5199\u201d\u3001\u201c\u53ea\u6709\u6211[\u6d41\u6cea]\u201d\uff09\uff0c\u6280\u672f\u64cd\u4f5c\u5c0f\u632b\u6298\uff08\u94fe\u63a5\u5220\u9664\u3001\u8f6f\u4ef6\u4f7f\u7528\uff09\u6613\u5f15\u53d1\u7126\u8651\uff0c\u6781\u5ea6\u4f9d\u8d56\u5916\u90e8\uff08\u73ed\u73ed\u3001AI\uff09\u7684\u5373\u65f6\u5b89\u629a\u548c\u80af\u5b9a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u73ed\u73ed\uff0c\u6211\u505a\u4e1a\u63d0\u4ea4\u4e86\uff0c\u5c31\u662f\u6587\u91c7\u4e0d\u597d[\u5927\u54ed]...\u5c31\u662f\u6211\u77e5\u9053\u6545\u4e8b\u7684\u5927\u6982\u5185\u5bb9\uff0c\u4f46\u5c31\u662f\u4e0d\u600e\u4e48\u4f1a\u5199[\u6342\u8138]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5f3a\u70c8\u7684\u81ea\u6211\u4ef7\u503c\u611f\u7f3a\u5931\u4e0e\u5bf9\u8ba4\u53ef\u7684\u6781\u5ea6\u6e34\u671b**\u3002\u5979\u53cd\u590d\u5f3a\u8c03\u81ea\u5df1\u201c\u5e74\u9f84\u5927\u5b66\u5f97\u6162\u201d\u3001\u201c\u6587\u91c7\u4e0d\u597d\u201d\u3001\u201c\u53ea\u6709\u6211\u7528AI\u201d\uff0c\u6df1\u5c42\u662f\u5bb3\u6015\u5728\u7fa4\u4f53\u4e2d\u843d\u540e\u3001\u4e0d\u88ab\u8ba4\u53ef\uff0c\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u6280\u80fd\u83b7\u5f97\u5c0a\u91cd\u548c\u81ea\u4fe1\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6301\u7eed\u3001\u5177\u4f53\u3001\u5938\u5f20\u7684\u6b63\u9762\u53cd\u9988\u4e0e\u201c\u88ab\u770b\u89c1\u201d\u7684\u5f52\u5c5e\u611f**\u3002\u9700\u8981\u4e0d\u65ad\u544a\u8bc9\u5979\u201c\u4f60\u5f88\u68d2\u201d\u3001\u201c\u6709\u4f18\u52bf\u201d\uff0c\u5e76\u5c06\u5979\u7684\u4efb\u4f55\u5fae\u5c0f\u8fdb\u6b65\uff08\u5982\u201c\u4fe1\u5fc3+1+1+1\u201d\uff09\u90fd\u653e\u5927\u8868\u626c\uff0c\u8ba9\u5979\u611f\u53d7\u5230\u5728\u793e\u7fa4\u4e2d\u7684\u5b58\u5728\u548c\u4ef7\u503c\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfea **C1** \u7c7b (\u9ad8\u4e92\u52a8\u3001\u9ad8\u670d\u52a1\u9700\u6c42\u3001\u4e2d\u7b49\u98ce\u9669) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a[\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5c5e\u53cd\u5bf9\u7b49\u7ea2\u7ebf]\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u672a\u66b4\u9732\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u5b66\u4e60\u521d\u671f\uff08\u5f00\u8bfe2-3\u5468\uff09**\uff0c\u56e0\u65f6\u95f4\u788e\u7247\u5316\u5bfc\u81f4\u8bfe\u7a0b\u79ef\u538b\uff0c\u53e0\u52a0\u6280\u672f\u64cd\u4f5c\u56f0\u96be\uff08\u5982\u627e\u4e0d\u5230\u56de\u653e\u3001\u5220\u9519\u4f5c\u4e1a\uff09\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u632b\u8d25\u611f\u548c\u81ea\u8d23\uff0c\u53ef\u80fd\u7a81\u7136\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | **\u4efb\u4f55\u589e\u52a0\u5176\u632b\u8d25\u611f\u7684\u65f6\u523b**\u3002\u4f8b\u5982\uff1a\u7b2c\u4e00\u6b21\u72ec\u7acb\u5b8c\u6210\u4f5c\u4e1a\u88ab\u70b9\u8bc4\u4e3a\u201c\u5e73\u6de1\u201d\uff1b\u8f6f\u4ef6\u64cd\u4f5c\u591a\u6b21\u5931\u8d25\u65e0\u4eba\u53ca\u65f6\u54cd\u5e94\uff1b\u770b\u5230\u5176\u4ed6\u540c\u5b66\u8fdb\u5ea6\u5feb\u800c\u81ea\u5df1\u4ecd\u4f9d\u8d56AI\u65f6\u3002\u8fd9\u662f**\u6700\u6838\u5fc3\u7684\u9000\u8d39\u98ce\u9669**\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u5b66\u4e60\u4e2d\u671f\uff0c\u82e5\u53d1\u73b0\u201c\u5b66\u5b8c\u5e76\u4e0d\u80fd\u7acb\u523b\u8d5a\u94b1\u201d\u6216\u6295\u7a3f\u5c61\u6b21\u88ab\u62d2\uff0c\u53ef\u80fd\u56e0\u73b0\u5b9e\u4e0e\u9884\u671f\u843d\u5dee\u800c\u52a8\u6447\uff0c\u4f46\u5176\u7eed\u62a5\u884c\u4e3a\u8868\u660e\u5bf9\u957f\u671f\u5b66\u4e60\u6709\u5fc3\u7406\u51c6\u5907\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u4f5c\u4e1a\u96be\u5ea6\u548c\u72ec\u7acb\u6027\u8981\u6c42\u63d0\u5347\uff0c\u6280\u672f\u95ee\u9898\u9891\u53d1\uff0c\u662f\u5176\u81ea\u4fe1\u5fc3\u6700\u8106\u5f31\u3001\u6700\u6613\u56e0\u201c\u5b66\u4e0d\u4f1a\u201d\u800c\u5d29\u6e83\u9000\u51fa\u7684\u65f6\u671f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u5979\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u5979\u8bf4......\u201d**\n> \u201c\u4eb2\u7231\u7684\uff0c\u770b\u5230\u4f60\u5468\u516d\u8fd8\u8981\u4e0a\u73ed\u8fd8\u8fd9\u4e48\u575a\u6301\u5b66\u4e60\uff0c\u771f\u7684\u7279\u522b\u4f69\u670d\u4f60\u7684\u884c\u52a8\u529b\uff01\u54b1\u4eec\u8fd9\u4e2a\u73ed\u5f88\u591a\u540c\u5b66\u90fd\u662f\u5229\u7528\u788e\u7247\u65f6\u95f4\u5b66\u4e60\u7684\uff0c\u5305\u62ec\u6211\u3002\u8bb0\u4f4f\u54e6\uff0c\u5728\u8fd9\u91cc\u6ca1\u6709\u2018\u7b28\u5b66\u751f\u2019\uff0c\u53ea\u6709\u2018\u8fd8\u6ca1\u627e\u5230\u65b9\u6cd5\u7684\u5c0f\u4f19\u4f34\u2019\u3002\u6709\u4efb\u4f55\u4e00\u4e01\u70b9\u5361\u4f4f\u7684\u5730\u65b9\uff0c\u54ea\u6015\u53ea\u662f\u627e\u4e0d\u5230\u6309\u94ae\uff0c\u968f\u65f6\u6233\u6211\uff0c\u6211\u79d2\u56de\uff01\u4f60\u7684\u6bcf\u4e00\u4e2a\u95ee\u9898\u90fd\u7279\u522b\u6709\u4ef7\u503c\uff0c\u80fd\u5e2e\u5230\u5176\u4ed6\u6709\u540c\u6837\u56f0\u60d1\u7684\u540c\u5b66\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\u3011**\u3002\u6838\u5fc3\u76ee\u6807\u662f\u5efa\u7acb\u81ea\u4fe1\u3001\u964d\u4f4e\u632b\u8d25\u611f\uff0c\u7ef4\u6301\u5b66\u4e60\u7c98\u6027\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u6ee1\u914d **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011** + **\u3010\u50bb\u74dc\u5f0f\u64cd\u4f5c\u6307\u5357\u5305\u3011**\u3002\u9488\u5bf9\u5176\u6280\u672f\u6050\u60e7\uff0c\u63d0\u4f9b\u56fe\u6587/\u89c6\u9891\u4e00\u6b65\u5230\u4f4d\u7684\u64cd\u4f5c\u6307\u5f15\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5728\u516c\u5f00\u573a\u5408\uff08\u5982\u7fa4\u5185\uff09\u6279\u8bc4\u6216\u5bf9\u6bd4\u5979\u7684\u4f5c\u4e1a**\uff0c\u6240\u6709\u53cd\u9988\u5fc5\u987b\u79c1\u804a\u4e14\u4ee5\u201c\u9f13\u52b1+\u5177\u4f53\u5c0f\u5efa\u8bae\u201d\u5f62\u5f0f\u3002\n    2. **\u7edd\u4e0d\u7ed9\u5979\u5e03\u7f6e\u8d85\u51fa\u5f53\u524d\u80fd\u529b\u7684\u201c\u6311\u6218\u4efb\u52a1\u201d**\uff0c\u907f\u514d\u89e6\u53d1\u5176\u201c\u6211\u4e0d\u884c\u201d\u7684\u81ea\u6211\u8ba4\u77e5\u3002\n    3. **\u7edd\u4e0d\u5728\u5979\u8868\u8fbe\u7126\u8651\u65f6\u8bb2\u5927\u9053\u7406\u6216\u5355\u7eaf\u8bf4\u201c\u52a0\u6cb9\u201d**\uff0c\u5fc5\u987b\u63d0\u4f9b**\u53ef\u7acb\u5373\u6267\u884c**\u7684\u4e0b\u4e00\u6b65\u5177\u4f53\u64cd\u4f5c\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u73b0\u9636\u6bb5\u4e25\u7981\u4efb\u4f55\u5347\u5355**\u3002\u5176\u4e3b\u52a8\u7eed\u62a5\u6539\u7a3f\u8bfe\u5df2\u662f\u4fe1\u4efb\u7684\u6781\u9650\u6d88\u8017\uff0c\u77ed\u671f\u5185\u4efb\u4f55\u65b0\u7684\u4ed8\u8d39\u63a8\u8350\u90fd\u4f1a\u88ab\u89c6\u4e3a\u538b\u529b\u6e90\uff0c\u53ef\u80fd\u5f15\u53d1\u53cd\u611f\u548c\u9000\u8d39\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u73ed\u73ed\uff0c\u6211\u505a\u4e1a\u63d0\u4ea4\u4e86\uff0c\u5c31\u662f\u6587\u91c7\u4e0d\u597d[\u5927\u54ed]...\u5c31\u662f\u6211\u77e5\u9053\u6545\u4e8b\u7684\u5927\u6982\u5185\u5bb9\uff0c\u4f46\u5c31\u662f\u4e0d\u600e\u4e48\u4f1a\u5199[\u6342\u8138]\u201d \n2. > \u201c\u521a\u5f00\u59cb\uff0c\u6211\u89c9\u5f97\u6211\u8fde\u5206\u6790\u90fd\u4e0d\u600e\u4e48\u597d...\u6211\u770b\u6628\u5929\u5927\u5bb6\u90fd\u662f\u81ea\u5df1\u5199\u7684\uff0c\u53ea\u6709\u6211[\u6d41\u6cea]\u201d \n3. > \u201c\u6211\u611f\u89c9\u5e74\u9f84\u5927\uff0c\u5b66\u4e1c\u897f\u5c31\u662f\u6162[\u53f9\u6c14]\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6\u60c5\u7eea\u5de8\u5a74\u578b**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u5c0a\u91cd\u4e0e\u8ba4\u53ef\uff08\u9a6c\u65af\u6d1b\u7b2c\u56db\u5c42\uff09**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u6781\u81f4\u7684\u60c5\u611f\u5b89\u629a\u4e0e\u50bb\u74dc\u5f0f\u64cd\u4f5c\u652f\u6301\uff0c\u575a\u51b3\u907f\u514d\u4efb\u4f55\u5f62\u5f0f\u7684\u632b\u8d25\u611f\u52a0\u538b**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"maslow_need\": \"\u5c0a\u91cd\u5f52\u5c5e\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
