    <script>
        const markdownText = "\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e\u3002\u7f3a\u4e4f\u5173\u952e\u652f\u4ed8\u4fe1\u606f\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u3001\u5177\u4f53\u8bfe\u7a0b\u540d\u79f0\u4e0e\u4ef7\u683c\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u3001\u660e\u786e\u6536\u5165\u6765\u6e90\u4e0e\u804c\u4e1a\u7a33\u5b9a\u6027\u3001\u8be6\u7ec6\u5bb6\u5ead\u80cc\u666f\u3002\n\n# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u4e0e\u98ce\u63a7\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49\u504f\u9ad8)**\n    *   **\u5b66\u4e60\u9a71\u52a8**\uff1a\u4e3b\u52a8\u8be2\u95ee\u8bbe\u5907\u3001\u58f0\u7ebf\u7c7b\u578b\uff0c\u79ef\u6781\u8bd5\u97f3\u5e76\u5bfb\u6c42\u4e13\u4e1a\u53cd\u9988\uff0c\u8ffd\u6c42\u201c\u620f\u7cbe\u611f\u201d\u548c\u89d2\u8272\u97f3\uff0c\u8868\u73b0\u51fa\u5bf9\u914d\u97f3\u6280\u80fd\u63d0\u5347\u7684\u660e\u786e\u5174\u8da3\u3002\n    *   **\u793e\u4ea4\u4e0e\u8ba4\u53ef\u9a71\u52a8**\uff1a\u5728\u7fa4\u5185\u6d3b\u8dc3\u4e92\u52a8\uff0c\u7ec4\u7ec7\u5408\u4f5c\u8bd5\u97f3\uff0c\u5f3a\u8c03\u201c\u8ba9\u5927\u5bb6\u77e5\u9053\u201d\u3001\u201c\u9ad8\u4e25\u683c\u9ad8\u8981\u6c42\u201d\uff0c\u6709\u8f83\u5f3a\u7684\u793e\u7fa4\u53c2\u4e0e\u611f\u548c\u5bfb\u6c42\u8ba4\u53ef\u7684\u503e\u5411\u3002\n    *   **\u53d8\u73b0\u52a8\u673a (\u4fe1\u606f\u4e0d\u8db3)**\uff1a\u8bb0\u5f55\u4e2d\u672a\u76f4\u63a5\u63d0\u53ca\u660e\u786e\u7684\u53d8\u73b0\u9884\u671f\u6216\u7ecf\u6d4e\u538b\u529b\u3002\u5176\u4f5c\u4e3a\u201c\u5fc3\u7406\u54a8\u8be2\u5e08\u50ac\u7720\u5e08\u201d\uff0c\u53ef\u80fd\u5c06\u914d\u97f3\u89c6\u4e3a\u6280\u80fd\u62d3\u5c55\u6216\u526f\u4e1a\u63a2\u7d22\uff0c\u4f46**\u53d8\u73b0\u7d27\u8feb\u6027\u4e0d\u660e\u786e**\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d\u7b49)**\n    *   **\u7ecf\u6d4e\u8d44\u6e90**\uff1a\u80fd\u81ea\u4e3b\u51b3\u7b56\u8d2d\u4e70MK4\u7b49\u4e13\u4e1a\u8bbe\u5907\uff0c\u663e\u793a\u6709**\u4e00\u5b9a\u7684\u53ef\u652f\u914d\u8d44\u91d1**\u3002\u804c\u4e1a\u4e3a\u201c\u5fc3\u7406\u54a8\u8be2\u5e08\u50ac\u7720\u5e08\u201d\uff0c\u63a8\u6d4b\u6709\u72ec\u7acb\u6536\u5165\u6765\u6e90\u3002\n    *   **\u65f6\u95f4\u8d44\u6e90**\uff1a\u80fd\u5728\u5de5\u4f5c\u65e5\u201c\u529e\u516c\u5ba4\u6478\u9c7c\u201d\u5904\u7406\u914d\u97f3\u4e8b\u52a1\uff0c\u665a\u4e0a\u6709\u50ac\u7720\u8bfe\u9884\u7ea6\uff0c\u663e\u793a\u65f6\u95f4\u5b89\u6392\u76f8\u5bf9\u7075\u6d3b\uff0c\u4f46**\u4e3b\u4e1a\u5360\u7528\u90e8\u5206\u7cbe\u529b**\u3002\n    *   **\u73af\u5883\u8d44\u6e90**\uff1a\u5728\u529e\u516c\u5ba4\u642d\u5efa\u5f55\u97f3\u73af\u5883\uff08\u8ba1\u5212\u81ea\u9020\u5c0f\u5f55\u97f3\u68da\uff09\uff0c\u9762\u4e34\u9694\u97f3\u95ee\u9898\uff0c**\u7269\u7406\u73af\u5883\u5b58\u5728\u4e00\u5b9a\u9650\u5236**\u3002\n    *   **\u6280\u80fd\u57fa\u7840**\uff1a\u5df2\u5177\u5907AU\u8f6f\u4ef6\u64cd\u4f5c\u3001\u8bbe\u5907\u8c03\u8bd5\u80fd\u529b\uff0c\u80fd\u5206\u6790\u97f3\u9891\u9891\u8c31\uff0c\u6709\u660e\u786e\u7684\u58f0\u7ebf\u8ba4\u77e5\u548c\u89d2\u8272\u5851\u9020\u8ffd\u6c42\uff0c**\u5b66\u4e60\u80fd\u529b\u548c\u52a8\u624b\u80fd\u529b\u8f83\u5f3a**\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u9ad8)**\n    *   **\u4e3b\u52a8\u6027**\uff1a\u6781\u9ad8\u3002\u4e3b\u52a8\u53d1\u8d77\u7fa4\u5185\u5408\u4f5c\u3001\u5236\u4f5c\u753b\u672c\u3001\u5206\u914d\u89d2\u8272\u3001\u8de8\u5e73\u53f0\u8054\u7cfb\u540c\u5b66\uff0c\u8868\u73b0\u51fa\u6781\u5f3a\u7684**\u7ec4\u7ec7\u529b\u548c\u9886\u5bfc\u529b**\u3002\n    *   **\u8010\u632b\u6027**\uff1a\u8bbe\u5907\u62a5\u9519\u80fd\u81ea\u884c\u6392\u67e5\u89e3\u51b3\uff1b\u62bd\u5956\u624b\u6c14\u5dee\u4ee5\u81ea\u5632\u5316\u89e3\uff1b\u5bf9\u8bd5\u97f3\u4e0d\u4e2d\u5956\u6709\u5fc3\u7406\u51c6\u5907\uff08\u201c\u4e0d\u4e2d\u5956\u624d\u662f\u6b63\u5e38\u201d\uff09\uff0c\u5fc3\u6001\u79ef\u6781\u3002\n    *   **\u9002\u5e94\u6027**\uff1a\u8bbe\u5907\u5230\u8d27\u540e\u5feb\u901f\u5b89\u88c5\u8c03\u8bd5\u5e76\u6295\u5165\u4f7f\u7528\uff08\u7528\u4e8e\u50ac\u7720\u5de5\u4f5c\uff09\uff0c\u5b66\u4e60\u53cd\u9988\u5438\u6536\u5feb\uff0c\u80fd\u6839\u636e\u5efa\u8bae\u8c03\u6574\u4f5c\u54c1\u3002\n    *   **\u76ee\u6807\u611f**\uff1a\u76ee\u6807\u6e05\u6670\uff0c\u884c\u52a8\u529b\u5f3a\uff0c\u4ece\u9009\u4e66\u3001\u753b\u672c\u5230\u7ec4\u7ec7\u8bd5\u97f3\uff0c\u63a8\u8fdb\u8282\u594f\u5feb\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u8bb0\u5f55\u663e\u793a\u7528\u6237\u5df2\u8d2d\u4e70\u8bbe\u5907\uff08MK4\uff09\uff0c\u4f46**\u672a\u63d0\u53ca\u8bfe\u7a0b\u652f\u4ed8\u60c5\u51b5**\u3002\u9700\u6838\u5b9e\u662f\u5426\u5df2\u5b8c\u6210\u8bfe\u7a0b\u4ed8\u8d39\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u8bb0\u5f55\u4e2d**\u5b8c\u5168\u672a\u6d89\u53ca\u5bb6\u5ead\u6210\u5458**\uff0c\u8d2d\u4e70\u8bbe\u5907\u3001\u6295\u5165\u65f6\u95f4\u7b49\u5747\u4e3a\u81ea\u4e3b\u51b3\u7b56\uff0c\u521d\u6b65\u5224\u65ad\u4e3a**\u72ec\u7acb\u51b3\u7b56\u8005**\u3002\n*   **\u7efc\u5408\u5224\u5b9a**\uff1a\u52a8\u673a\u660e\u786e\uff08\u6280\u80fd\u63d0\u5347+\u793e\u4ea4\uff09\uff0c\u8d44\u6e90\u5c1a\u53ef\uff08\u6709\u6536\u5165\u3001\u6709\u65f6\u95f4\u3001\u6709\u57fa\u7840\uff09\uff0c\u5fc3\u7406\u5f39\u6027\u6781\u4f73\uff08\u4e3b\u52a8\u3001\u575a\u97e7\u3001\u9002\u5e94\u6027\u5f3a\uff09\u3002\u5c5e\u4e8e**\u9ad8\u6f5c\u529b\u3001\u9ad8\u53c2\u4e0e\u5ea6\u7528\u6237**\u3002\u6682\u5f52\u4e3a**B\u7c7b\uff08\u9ad8\u610f\u613f\u9ad8\u6f5c\u529b\uff09**\uff0c\u4f46\u9700\u786e\u8ba4\u8bfe\u7a0b\u652f\u4ed8\u72b6\u6001\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b\uff1aT3 \u81ea\u5f8b\u8fdb\u53d6\u8005**\n    *   **\u6838\u5fc3\u7279\u5f81**\uff1a\u76ee\u6807\u9a71\u52a8\u3001\u81ea\u5f8b\u6027\u5f3a\u3001\u4e3b\u52a8\u5b66\u4e60\u3001\u4e50\u4e8e\u5206\u4eab\u4e0e\u534f\u4f5c\u3001\u8ffd\u6c42\u4e13\u4e1a\u7cbe\u8fdb\u3002\n    *   **\u4f9d\u636e**\uff1a\u7528\u6237\u8868\u73b0\u51fa\u6781\u5f3a\u7684\u81ea\u6211\u9a71\u52a8\u548c\u7ec4\u7ec7\u80fd\u529b\uff0c\u4e0d\u4ec5\u81ea\u5df1\u5b66\u4e60\uff0c\u8fd8\u79ef\u6781\u63a8\u52a8\u793e\u7fa4\u534f\u4f5c\uff0c\u5bf9\u4f5c\u54c1\u8d28\u91cf\u6709\u8981\u6c42\uff0c\u5fc3\u6001\u6210\u719f\u7a33\u5b9a\uff0c\u7b26\u5408T3\u201c\u5efa\u8bbe\u8005\u201d\u4e0e\u201c\u5f15\u9886\u8005\u201d\u7279\u8d28\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669\uff1a\u6781\u4f4e**\n    *   **\u9884\u671f\u7ba1\u7406\u504f\u5dee**\uff1a\u98ce\u9669\u6781\u4f4e\u3002\u7528\u6237\u5173\u6ce8\u6280\u80fd\u63d0\u5347\u4e0e\u5408\u4f5c\uff0c\u672a\u8868\u73b0\u51fa\u4e0d\u5207\u5b9e\u9645\u7684\u5feb\u901f\u53d8\u73b0\u671f\u671b\u3002\n    *   **\u6548\u679c\u611f\u77e5\u843d\u5dee**\uff1a\u98ce\u9669\u4f4e\u3002\u7528\u6237\u5df2\u5f00\u59cb\u5b9e\u8df5\u5e76\u83b7\u5f97\u6b63\u5411\u53cd\u9988\uff08\u8bbe\u5907\u51cf\u8f7b\u8bf4\u8bdd\u8d1f\u62c5\uff09\uff0c\u6709\u6301\u7eed\u6539\u8fdb\u7684\u884c\u52a8\u3002\n    *   **\u670d\u52a1\u4f53\u9a8c\u7f3a\u9677**\uff1a\u98ce\u9669\u4f4e\u3002\u7528\u6237\u4e0e\u9500\u552e\u3001\u552e\u540e\u4e92\u52a8\u987a\u7545\uff0c\u95ee\u9898\u80fd\u53ca\u65f6\u89e3\u51b3\u3002\n    *   **\u8d22\u52a1\u538b\u529b\u89e6\u53d1**\uff1a\u98ce\u9669\u4f4e\u3002\u81ea\u4e3b\u8d2d\u4e70\u8bbe\u5907\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\u3002\n    *   **\u5bb6\u5ead\u5e72\u9884**\uff1a\u98ce\u9669\u6781\u4f4e\u3002\u51b3\u7b56\u72ec\u7acb\u3002\n    *   **\u7ade\u54c1\u6bd4\u8f83/\u8d1f\u9762\u4fe1\u606f**\uff1a\u98ce\u9669\u6781\u4f4e\u3002\u7528\u6237\u6df1\u5ea6\u53c2\u4e0e\u5f53\u524d\u793e\u7fa4\u4e0e\u8bfe\u7a0b\u6d3b\u52a8\u3002\n    *   **\u4e2a\u4eba\u91cd\u5927\u53d8\u6545**\uff1a\u57fa\u4e8e\u73b0\u6709\u4fe1\u606f\uff0c\u98ce\u9669\u65e0\u6cd5\u8bc4\u4f30\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u65e0\u663e\u8457\u98ce\u9669**\u3002\u9500\u552e\u6c9f\u901a\u4ee5\u9f13\u52b1\u3001
