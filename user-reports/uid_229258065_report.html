    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4f5c\u4e3a\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID: 229258065\uff08\u6635\u79f0\uff1a\u8c46\u8c46\uff09\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 229258065 (\u6635\u79f0\uff1a\u8c46\u8c46) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-02-14 \u81f3 2026-03-05 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u51ac\u51ac\u8001\u5e08\uff08\u9500\u552e\uff09\u3001\u51cc\u96e8/\u6e56\u6c34\u73ed\u73ed\uff08\u73ed\u4e3b\u4efb\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66/AI\u914d\u97f3\u76f8\u5173\u8bfe\u7a0b\uff08\u5177\u4f53\u8bfe\u7a0b\u540d\u79f0\u672a\u660e\u786e\u63d0\u53ca\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1\uff08\u6709\u5168\u804c\u5de5\u4f5c\uff0c\u4f46\u80fd\u5229\u7528\u6478\u9c7c\u65f6\u95f4\u5b66\u4e60\u3001\u5f55\u97f3\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u672a\u63d0\u53ca |\n| **\u4fe1\u606f\u539a\u5ea6** | \u9971\u6ee1\uff08\u804a\u5929\u8bb0\u5f55\u4e30\u5bcc\uff0c\u884c\u4e3a\u6a21\u5f0f\u6e05\u6670\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u6210\u679c\u800c\u6765\u3002\u7528\u6237\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u5b66\u4e60\u3001\u5b9e\u8df5\u548c\u53d8\u73b0\u6b32\u671b\uff0c\u4f46\u6838\u5fc3\u9a71\u52a8\u662f\u201c\u505a\u51fa\u4f5c\u54c1\u3001\u83b7\u5f97\u8ba4\u53ef\u3001\u5b9e\u73b0\u63a5\u5355\u201d\uff0c\u800c\u975e\u77ed\u671f\u66b4\u5bcc\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u9886\u4e86\u4e00\u4e2a\u559c\u64ad\u7684\u5c0f\u8bd5\u97f3\uff0c\u4f60\u80fd\u5e2e\u6211\u95ee\u4e00\u4e0b\u73ed\u91cc\u54ea\u4e2a\u7537\u751f\u80fd\u5e2e\u5fd9\u642d\u4e2a\u97f3\u5417\uff1f\u4eca\u5929\u534a\u591c\u5c31\u8981\u5230\u671f\u4e86[\u6d41\u6cea]\u201d\n  > \u201c\u6211\u53ef\u4ee5\u548c\u4ed6\u52a0\u4e2a\u597d\u53cb\u5417\uff1f\u540e\u7eed\u4e00\u8d77\u628a\u8fd9\u672c\u4e66\u5f55\u4e0b\u6765\u201d\n  > \u201c\u4e00\u4e2a\u6708\u5c315\u6b21\u673a\u4f1a\uff0c\u4e0d\u8bd5\u767d\u4e0d\u8bd5\uff0c\u563f\u563f[\u8272]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4fe1\u606f\u4e0d\u8db3] \u2014 \u672a\u63d0\u53ca\u7ecf\u6d4e\u72b6\u51b5\uff0c\u4f46\u4ece\u6709\u7535\u8111\u3001\u4f7f\u7528AU\u8f6f\u4ef6\u3001\u80fd\u4e0a\u73ed\u6478\u9c7c\u5b66\u4e60\u63a8\u65ad\uff0c\u5e94\u65e0\u751f\u5b58\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 \u6709\u5168\u804c\u5de5\u4f5c\uff0c\u4f46\u80fd\u5229\u7528\u4e0a\u73ed\u6478\u9c7c\u65f6\u95f4\u5b66\u4e60\u3001\u5f55\u97f3\u3001\u5904\u7406\u8bd5\u97f3\uff0c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u8f83\u5f3a\u3002**\u77ed\u677f**\uff1a\u8fd1\u671f\u56e0\u201c\u5728\u533b\u9662\u62a4\u7406\u201d\u5bfc\u81f43\u5929\u65e0\u6cd5\u5b8c\u6210\u7fa4\u5185\u7ec3\u4e60\uff0c\u663e\u793a\u65f6\u95f4\u53d7\u5916\u90e8\u4e8b\u4ef6\u5f71\u54cd\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u4e0d\u8db3] \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9762\u5bf9\u8bd5\u97f3\u5931\u8d25\uff08\u521d\u5ba1\u8fc7\u7ec8\u5ba1\u672a\u8fc7\uff09\u65f6\uff0c\u80fd\u4e3b\u52a8\u5206\u6790\u539f\u56e0\uff08\u201c\u6211\u7684\u505c\u8fde\u548c\u91cd\u97f3\u5e94\u8be5\u4e5f\u6709\u95ee\u9898\u201d\uff09\uff0c\u5e76\u79ef\u6781\u5bfb\u6c42\u4e0b\u4e00\u6b21\u673a\u4f1a\uff0c\u65e0\u8d1f\u9762\u60c5\u7eea\u5ba3\u6cc4\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u8fc7\u521d\u5ba1\u90a3\u4e2a\uff0c\u6ca1\u8fc7\u7ec8\u5ba1\uff0c\u4e0d\u77e5\u5dee\u5728\u54ea\u513f\uff0c\u6ca1\u8bf4[\u5077\u7b11]\u201d\n  > \u201c\u6211\u7684\u505c\u8fde\u548c\u91cd\u97f3\u5e94\u8be5\u4e5f\u6709\u95ee\u9898\uff0c\u4e0d\u4e00\u5b9a\u662f\u6811\u7684\u95ee\u9898[\u5077\u7b11]\u3002...\u6211\u4f1a\u7ee7\u7eed\u52aa\u529b\u54d2[\u80dc\u5229]\u201d\n  > \u80fd\u4e3b\u52a8\u5728\u7fa4\u5185\u5e2e\u52a9\u5176\u4ed6\u540c\u5b66\u89e3\u7b54\u6280\u672f\u95ee\u9898\uff08\u5982\u4f55\u4e0a\u4f20\u8bd5\u97f3\uff09\uff0c\u5c55\u73b0\u4e50\u4e8e\u52a9\u4eba\u548c\u7a33\u5b9a\u7684\u5fc3\u6001\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 & \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u201c\u88ab\u8ba4\u53ef\u201d\u548c\u201c\u4f5c\u54c1\u6210\u529f\u201d\u6709\u5f3a\u70c8\u6e34\u671b\u3002\u901a\u8fc7\u201c\u8fc7\u521d\u5ba1\u201d\u7684\u5174\u594b\u3001\u4e3b\u52a8\u5bfb\u6c42\u5408\u4f5c\uff08\u52a0\u7537\u64ad\u597d\u53cb\uff09\u3001\u5728\u7fa4\u5185\u5206\u4eab\u7ecf\u9a8c\u83b7\u5f97\u5b58\u5728\u611f\uff0c\u6765\u6ee1\u8db3\u5c0a\u91cd\u548c\u5f52\u5c5e\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6210\u5c31\u8ba4\u53ef\u4e0e\u5708\u5c42\u878d\u5165**\u3002\u63d0\u4f9b\u5c55\u793a\u5e73\u53f0\uff08\u5982\u559c\u62a5\uff09\u3001\u4fc3\u6210\u5408\u4f5c\u673a\u4f1a\uff08\u642d\u97f3\u3001\u7ec4\u961f\uff09\u3001\u8d4b\u4e88\u5176\u201c\u5c0f\u8001\u5e08\u201d\u6216\u201c\u70ed\u5fc3\u540c\u5b66\u201d\u7684\u793e\u7fa4\u89d2\u8272\uff0c\u6ee1\u8db3\u5176\u88ab\u5c0a\u91cd\u548c\u793e\u4ea4\u8fde\u63a5\u7684\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 **B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u5411 **\u6df7\u5408\u4f533\u53f7\uff1a\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b** \u8fdb\u5316\u4e2d) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u8a00\u8bba\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u672a\u63d0\u53ca\u5bb6\u5ead\u56e0\u7d20\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4e2d | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u56e0\u5916\u90e8\u4e8b\u4ef6\uff08\u5982\u62a4\u7406\u5bb6\u4eba\uff09\u5bfc\u81f4\u5b66\u4e60\u65f6\u95f4\u88ab\u4e25\u91cd\u6324\u538b\uff0c\u4ea7\u751f\u8fdb\u5ea6\u7126\u8651\u548c\u843d\u540e\u611f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u81ea\u6211\u8c03\u8282\u5931\u8d25\uff0c\u4e3b\u52a8\u5206\u6790\u539f\u56e0\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u5bf9\u53d8\u73b0\u6709\u671f\u5f85\u4f46\u975e\u201c\u51e0\u5929\u66b4\u5bcc\u201d\u578b\uff0c\u4e14\u5df2\u83b7\u5f97\u201c\u8fc7\u521d\u5ba1\u201d\u7684\u6b63\u5411\u53cd\u9988\uff0c\u5efa\u7acb\u4e86\u521d\u6b65\u4fe1\u5fc3\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f53\u957f\u671f\uff08\u8d85\u8fc71-2\u5468\uff09\u56e0\u5ba2\u89c2\u539f\u56e0\u65e0\u6cd5\u8ddf\u4e0a\u8bfe\u7a0b\u8fdb\u5ea6\u548c\u8bd5\u97f3\u8282\u594f\u65f6\uff0c\u53ef\u80fd\u56e0\u201c\u88ab\u843d\u4e0b\u201d\u7684\u7126\u8651\u800c\u840c\u751f\u9000\u610f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u8c46\u8c46\uff0c\u770b\u4f60\u8fd9\u4e48\u79ef\u6781\u8bd5\u97f3\u548c\u5e2e\u52a9\u540c\u5b66\uff0c\u7edd\u5bf9\u662f\u54b1\u4eec\u73ed\u7684\u6f5c\u529b\u80a1\uff01\u4ee5\u540e\u73ed\u91cc\u6709\u5565\u9700\u8981\u534f\u8c03\u7684\uff0c\u6216\u8005\u65b0\u540c\u5b66\u6709\u6280\u672f\u95ee\u9898\uff0c\u6211\u53ef\u80fd\u5f97\u7ecf\u5e38\u2018\u9ebb\u70e6\u2019\u4f60\u5e2e\u5fd9\u89e3\u7b54\u4e00\u4e0b\u54e6\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011\u3002\u7528\u6237\u5df2\u5177\u5907\u57fa\u7840\u6280\u80fd\uff08\u4f7f\u7528AU\uff09\uff0c\u5e76\u8ffd\u6c42\u6280\u672f\u7cbe\u8fdb\u548c\u5b9e\u6218\u6210\u679c\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n  1.  **\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743 (B\u6a21\u5757)\u3011**\uff1a\u9488\u5bf9\u5176\u63d0\u51fa\u7684\u201c\u4f24\u5fc3\u60c5\u7eea\u6f14\u7ece\u201d\u3001\u201c\u505c\u8fde\u91cd\u97f3\u201d\u7b49\u95ee\u9898\uff0c\u63d0\u4f9b\u66f4\u6df1\u5ea6\u76841v1\u6280\u672f\u70b9\u8bc4\u6216\u8d44\u6599\u3002\n  2.  **\u3010\u793e\u7fa4\u7edf\u7b79\u6743\u8d4b\u80fd (D\u6a21\u5757)\u3011**\uff1a\u89c2\u5bdf\u5176\u201c\u5e2e\u52a9\u540c\u5b66\u89e3\u7b54\u95ee\u9898\u201d\u7684\u884c\u4e3a\uff0c\u53ef\u9002\u65f6\u8d4b\u4e88\u5176\u201c\u5c0f\u7ec4\u957f\u201d\u3001\u201c\u6280\u672f\u7b54\u7591\u5b98\u201d\u7b49\u975e\u6b63\u5f0f\u5934\u8854\uff0c**\u542f\u52a8\u201c\u9ec4\u888d\u52a0\u8eab\u63d0\u5e72\u6cd5\u201d**\uff0c\u5c06\u5176\u56fa\u5316\u4e3a\u751f\u6001\u5efa\u8bbe\u8005\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5c06\u5176\u89c6\u4e3a\u9700\u8981\u60c5\u7eea\u5b89\u629a\u7684\u201c\u5b9d\u5b9d\u201d\u3002\u907f\u514d\u8fc7\u5ea6\u4f7f\u7528\u201c\u5b9d\u5b9d\u201d\u3001\u201c\u6492\u5a07\u201d\u7b49 infantilizing\uff08\u5e7c\u513f\u5316\uff09\u8bdd\u672f\uff0c\u8fd9\u53ef\u80fd\u4f1a\u77ee\u5316\u5176\u80fd\u529b\u611f\u3002\u5e94\u5c06\u5176\u89c6\u4e3a\u5e73\u7b49\u7684\u201c\u6218\u53cb\u201d\u6216\u201c\u5408\u4f5c\u4f19\u4f34\u201d\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u8fdb\u884c\u5927\u989d\u63a8\u4ecb\u3002\u5f53\u5176\u6280\u672f\u8fbe\u5230\u4e00\u5b9a\u6c34\u5e73\u5e76\u8868\u73b0\u51fa\u6301\u7eed\u70ed\u60c5\u65f6\uff0c\u53ef\u63a8\u8350\u9ad8\u9636\u540e\u671f\u8bfe\u3001\u8bbe\u5907\u8bfe\u6216\u79c1\u6559\u8bfe\uff0c\u6ee1\u8db3\u5176\u7cbe\u8fdb\u9700\u6c42\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u9886\u4e86\u4e00\u4e2a\u559c\u64ad\u7684\u5c0f\u8bd5\u97f3\uff0c\u4f60\u80fd\u5e2e\u6211\u95ee\u4e00\u4e0b\u73ed\u91cc\u54ea\u4e2a\u7537\u751f\u80fd\u5e2e\u5fd9\u642d\u4e2a\u97f3\u5417\uff1f\u4eca\u5929\u534a\u591c\u5c31\u8981\u5230\u671f\u4e86[\u6d41\u6cea]\u201d **\uff08\u8bc1\u660e\uff1a\u4e3b\u52a8\u5b9e\u8df5\uff0c\u6709 deadline \u610f\u8bc6\uff0c\u5bfb\u6c42\u5408\u4f5c\uff09**\n2. > \u201c\u8fc7\u521d\u5ba1\u90a3\u4e2a\uff0c\u6ca1\u8fc7\u7ec8\u5ba1\uff0c\u4e0d\u77e5\u5dee\u5728\u54ea\u513f\uff0c\u6ca1\u8bf4[\u5077\u7b11]\u201d **\uff08\u8bc1\u660e\uff1a\u9762\u5bf9\u5931\u8d25\u60c5\u7eea\u7a33\u5b9a\uff0c\u7528[\u5077\u7b11]\u8868\u60c5\u5316\u89e3\uff0c\u5173\u6ce8\u70b9\u5728\u4e8e\u201c\u5dee\u5728\u54ea\u201d\u800c\u975e\u62b1\u6028\uff09**\n3. > \u201c@\u5f20\u82f1\u2005\u81ea\u5df1\u5728\u7535\u8111\u4e0a\u5f55\uff0c\u5f55\u5b8c\uff0c\u505a\u4e00\u4e9b\u5e72\u97f3\u5904\u7406\uff0c\u5982\u964d\u566a\u4e4b\u7c7b\u7684\u3002\u7136\u540e\u4f20\u5230\u5fae\u4fe1\u4e0a\u3002\u518d\u6253\u5f00\u559c\u4e0a\u4f20\u6837\u97f3\u56db\u4e2a\u5b57...\u201d **\uff08\u8bc1\u660e\uff1a\u4e3b\u52a8\u5e2e\u52a9\u540c\u5b66\uff0c\u5177\u5907\u6280\u672f\u5206\u4eab\u80fd\u529b\u548c\u793e\u7fa4\u8d21\u732e\u610f\u613f\uff0c\u662fT2\u5411\u6df7\u5408\u4f533\u53f7\u8fdb\u5316\u7684\u5173\u952e\u4fe1\u53f7\uff09**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2\u4f4e\u8c03\u8001\u9ec4\u725b\uff0c\u6b63\u5411\u6df7\u5408\u4f533\u53f7\uff08\u6743\u9650\u89c9\u9192\uff09\u8fdb\u5316\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u4e0e\u793e\u7fa4\u5f52\u5c5e\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u53ca\u65f6\u8d4b\u4e88\u5176\u793e\u7fa4\u89d2\u8272\u4e0e\u7edf\u7b79\u6743\u9650\uff0c\u5c06\u5176\u4ece\u201c\u5b66\u5458\u201d\u8f6c\u5316\u4e3a\u201c\u5171\u5efa\u8005\u201d\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b (\u5411\u6df7\u5408\u4f533\u53f7\u8fdb\u5316)\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u793e\u4ea4\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u793e\u7fa4\u7edf\u7b79\u6743\u8d4b\u80fd\"}\n```";
