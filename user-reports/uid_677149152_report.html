    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u4e0e\u98ce\u63a7\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u4e2d\u9ad8**\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5b66\u4e60\u5174\u8da3\uff08\u201c\u5927\u5f00\u773c\u754c\u201d\u3001\u201c\u6709\u641e\u5934\u201d\uff09\uff0c\u4e3b\u52a8\u53c2\u4e0e\u7ec3\u4e60\u548c\u63d0\u95ee\uff0c\u5bf9\u6280\u80fd\u672c\u8eab\uff08\u753b\u672c\u3001\u5ba1\u542c\uff09\u6709\u63a2\u7d22\u6b32\u3002\u4f46\u6838\u5fc3\u9a71\u52a8\u529b\u4e2d\u5305\u542b\u663e\u8457\u7684**\u53d8\u73b0\u9884\u671f**\uff08\u201c\u6211\u7684\u7b2c\u4e00\u6876\u91d1\u4ece\u8fd9\u91cc\u5f00\u59cb\u201d\u3001\u201c\u53ea\u8981\u80af\u5e72\uff0c\u90fd\u662f\ud83d\udcb0\u201d\uff09\uff0c\u5c5e\u4e8e\u5174\u8da3\u4e0e\u526f\u4e1a\u8d5a\u94b1\u7684\u6df7\u5408\u52a8\u673a\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u4e2d**\u3002\u7528\u6237\u80fd\u5168\u7a0b\u8ddf\u8fdb\u8bad\u7ec3\u8425\uff08\u5168\u52e4\uff09\uff0c\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\uff0c\u8868\u660e\u62e5\u6709**\u53ef\u652f\u914d\u7684\u788e\u7247\u65f6\u95f4**\u548c**\u57fa\u7840\u6267\u884c\u529b**\u3002\u4f46\u672a\u63d0\u53ca\u5177\u4f53\u804c\u4e1a\u3001\u5bb6\u5ead\u72b6\u51b5\u3001\u7ecf\u6d4e\u80fd\u529b\u6216\u8bbe\u5907\u6761\u4ef6\uff0c**\u4fe1\u606f\u4e0d\u8db3**\uff0c\u65e0\u6cd5\u8bc4\u4f30\u5176\u957f\u671f\u6295\u5165\u7684\u7a33\u5b9a\u6027\u4e0e\u786c\u4ef6\u652f\u6301\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u4e2d\u9ad8**\u3002\u7528\u6237\u6001\u5ea6\u79ef\u6781\uff08\u201c\u597d\u7684\u201d\u3001\u201c\u575a\u6301\u201d\u3001\u201c\u975e\u5e38\u671f\u5f85\u201d\uff09\uff0c\u80fd\u63a5\u53d7\u53cd\u9988\uff08\u201c\u8c22\u8c22\u70b9\u8bc4\u201d\uff09\uff0c\u5bf9\u5b66\u4e60\u96be\u5ea6\u6709\u5408\u7406\u8ba4\u77e5\uff08\u201c\u8111\u5b50\u542c\u61c2\u4e86\uff0c\u505a\u4e0d\u505a\u5f97\u5230\u4e0d\u6653\u5f97\u201d\uff09\uff0c\u5e76\u8868\u73b0\u51fa**\u4e00\u5b9a\u7684\u81ea\u4e3b\u601d\u8003\u4e0e\u884c\u4e1a\u8ba4\u77e5**\uff08\u201c\u8fd9\u8ddf\u6f14\u620f\u4e00\u6837\u554a\u201d\u3001\u201c\u6ca1\u6709\u8d44\u6e90\uff0c\u5c31\u50cf\u505a\u751f\u610f\u4e00\u6837\u201d\uff09\uff0c\u6297\u632b\u6298\u6f5c\u529b\u8f83\u597d\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u5df2\u9009\u62e9\u201c\u9ad8\u9636\u201d\u8bfe\u7a0b\u5e76\u5b8c\u6210\u62a5\u540d\u6d41\u7a0b\uff0c\u9500\u552e\u5df2\u8f6c\u4ea4\u73ed\u4e3b\u4efb\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u6216\u914d\u5076\u610f\u89c1\uff0c\u7528\u6237\u51b3\u7b56\u8868\u73b0\u4e3a\u5b8c\u5168\u4e2a\u4eba\u4e3b\u5bfc\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u7eaf\u5ea6**: **B\u7c7b (\u6df7\u5408\u52a8\u673a)**\u3002\u517c\u5177\u6280\u80fd\u5b66\u4e60\u5174\u8da3\u4e0e\u660e\u786e\u7684\u526f\u4e1a\u53d8\u73b0\u671f\u671b\u3002\n*   **\u6b65\u9aa42 - \u8d44\u6e90\u5339\u914d\u5ea6**: **B\u7c7b (\u8d44\u6e90\u90e8\u5206\u53ef\u89c1)**\u3002\u65f6\u95f4\u4e0e\u6267\u884c\u529b\u53ef\u89c1\uff0c\u4f46\u6df1\u5c42\u8d44\u6e90\uff08\u7ecf\u6d4e\u57fa\u7840\u3001\u5bb6\u5ead\u652f\u6301\u3001\u804c\u4e1a\u80cc\u666f\uff09\u672a\u77e5\u3002\n*   **\u6b65\u9aa43 - \u5fc3\u7406\u51c6\u5907\u5ea6**: **B\u7c7b (\u7406\u6027\u4e50\u89c2\u8005)**\u3002\u5bf9\u884c\u4e1a\u6709\u521d\u6b65\u4e86\u89e3\uff0c\u8ba4\u77e5\u76f8\u5bf9\u7406\u6027\uff0c\u5b66\u4e60\u6001\u5ea6\u7aef\u6b63\uff0c\u6709\u6301\u7eed\u6295\u5165\u7684\u610f\u613f\u3002\n*   **\u7efc\u5408\u5224\u5b9a**: **B\u7c7b\u7528\u6237**\u3002\u5174\u8da3\u4e0e\u529f\u5229\u6df7\u5408\u9a71\u52a8\uff0c\u5177\u5907\u57fa\u7840\u884c\u52a8\u529b\u4e0e\u7406\u6027\u8ba4\u77e5\uff0c\u4f46\u6df1\u5c42\u8d44\u6e90\u4e0e\u957f\u671f\u627f\u8bfa\u5ea6\u5f85\u89c2\u5bdf\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b: T4 \u52a1\u5b9e\u63a2\u7d22\u8005**\u3002\n    *   \u7279\u5f81\u543b\u5408\uff1a\u5bf9\u6709\u58f0\u884c\u4e1a\u6709\u5177\u4f53\u8ba4\u77e5\uff08\u201c\u591a\u64ad\u201d\u3001\u201c\u8d44\u6e90\u201d\uff09\uff0c\u4e0d\u76f2\u76ee\u4e50\u89c2\uff1b\u52a8\u673a\u6df7\u5408\uff08\u5174\u8da3+\u53d8\u73b0\uff09\uff1b\u884c\u52a8\u4e0a\u914d\u5408\u5ea6\u9ad8\uff0c\u4e3b\u52a8\u5c1d\u8bd5\uff08\u201c\u6211\u60f3\u5148\u8bd5\u8bd5\u753b\u672c\u548c\u5ba1\u542c\u201d\uff09\uff1b\u51b3\u7b56\u57fa\u4e8e\u8bad\u7ec3\u8425\u4f53\u9a8c\u4e0e\u4fe1\u606f\u8bc4\u4f30\uff08\u201c\u5927\u5f00\u773c\u754c\u201d\uff09\uff0c\u800c\u975e\u5355\u7eaf\u60c5\u611f\u51b2\u52a8\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u98ce\u9669\u7b49\u7ea7: \u4e2d**\u3002\n*   **\u6839\u56e0\u6392\u67e5**:\n    1.  **\u9884\u671f\u7ba1\u7406\u98ce\u9669 (\u4e2d\u9ad8)**\uff1a\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u65f6\u85aa300\u5143\u201d\u3001\u201c\u7b2c\u4e00\u6876\u91d1\u201d\u3001\u201c\u8fb9\u5b66\u8fb9\u8d5a\u201d\uff0c\u7528\u6237\u4e5f\u8868\u73b0\u51fa\u8f83\u5f3a\u53d8\u73b0\u671f\u5f85\uff08\u201c\u6253\u62fc\u4e8b\u4e1a\u5f00\u59cb\u201d\uff09\u3002**\u82e5\u540e\u671f\u53d8\u73b0\u4e0d\u53ca\u9884\u671f\uff0c\u4e3a\u4e3b\u8981\u98ce\u9669\u70b9\u3002**\n    2.  **\u6548\u679c\u611f\u77e5\u98ce\u9669 (\u4f4e)**\uff1a\u7528\u6237\u5df2\u83b7\u5f97\u6b63\u5411\u53cd\u9988\uff08\u4f5c\u4e1a\u597d\u8bc4\u3001\u901a\u5173\uff09\uff0c\u5bf9\u5b66\u4e60\u5185\u5bb9\u8ba4\u53ef\u3002\n    3.  **\u7cbe\u529b\u8017\u7aed\u98ce\u9669 (\u4f4e)**\uff1a\u7528\u6237\u5168\u7a0b\u8ddf\u8fdb\uff0c\u672a\u8868\u73b0\u51fa\u65f6\u95f4\u538b\u529b\u3002\n    4.  **\u7ecf\u6d4e\u538b\u529b\u98ce\u9669 (\u672a\u77e5)**\uff1a\u672a\u63d0\u53ca\u652f\u4ed8\u538b\u529b\u6216\u8bfe\u7a0b\u4ef7\u683c\u7591\u8651\u3002\n    5.  **\u5bb6\u5ead\u53cd\u5bf9\u98ce\u9669 (\u4f4e)**\uff1a\u51b3\u7b56\u6743\u72ec\u7acb\uff0c\u672a\u63d0\u53ca\u5bb6\u5ead\u56e0\u7d20\u3002\n    6.  **\u4ea7\u54c1\u9519\u914d\u98ce\u9669 (\u4f4e)**\uff1a\u7528\u6237\u4e3b\u52a8\u9009\u62e9\u201c\u9ad8\u9636\u201d\u8bfe\u7a0b\uff0c\u5339\u914d\u5176\u63a2\u7d22\u6df1\u5ea6\u9700\u6c42\u3002\n    7.  **\u4f26\u7406\u53cd\u611f\u98ce\u9669 (\u4f4e)**\uff1a\u9500\u552e\u8fc7\u7a0b\u4ee5\u6559\u5b66\u3001\u9f13\u52b1\u3001\u8d44\u6e90\u5c55\u793a\u4e3a\u4e3b\uff0c\u65e0\u8fc7\u5ea6\u9a9a\u6270\u6216\u6b3a\u9a97\u6027\u8bdd\u672f\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u603b\u4f53\u5408\u89c4\uff0c\u4f46\u5b58\u5728\u98ce\u9669\u70b9**\uff1a\n    *   **\u5408\u89c4\u70b9**\uff1a\u9500\u552e\u8fc7\u7a0b\u4ee5\u6559\u5b66\u3001\u966a\u4f34\u3001\u8d44\u6e90\u5206\u4eab\u4e3a\u4e3b\u7ebf\uff0c\u63d0\u4f9b\u4e86\u5b9e\u8d28\u6027\u7684\u7ec3\u4e60\u548c\u53cd\u9988\u3002\n    *   **\u98ce\u9669\u70b9**\uff1a\n        1.  **\u8fc7\u5ea6\u627f\u8bfa\u503e\u5411**\uff1a\u9500\u552e\u63d0\u53ca\u201c\u65f6\u85aa300\u5143\u201d\u3001\u201c\u7b2c\u4e00\u6876\u91d1240\u5143\u201d\u3001\u201c\u8eab\u517c\u6570\u804c\u201d\u7b49\u6848\u4f8b\uff0c\u53ef\u80fd**\u62d4\u9ad8\u7528\u6237\u77ed\u671f\u6536\u5165\u9884\u671f**\u3002\n        2.  **\u4fe1\u606f\u5dee\u5229\u7528**\uff1a\u5f3a\u8c03\u201c\u4fe1\u606f\u5dee\u201d\u3001\u201c\u6ca1\u6709\u5e26\u8def\u4eba\uff0c\u5f88\u96be\u8fdb\u8fd9\u4e2a\u5708\u5b50\u201d\uff0c\u5c5e\u4e8e\u884c\u4e1a\u5e38\u89c1\u8bdd\u672f\uff0c\u4f46\u7ed3\u5408\u6536\u5165\u6848\u4f8b\uff0c\u6613\u5851\u9020\u201c\u8f7b\u677e\u5165\u884c\u9ad8\u56de\u62a5\u201d\u5370\u8c61\u3002\n        3.  **\u7d27\u8feb\u611f\u8425\u9020**\uff1a\u4f7f\u7528\u201c\u5168\u52e4\u5956\u52b1\u7248\u6743\u4e66\u201d\u3001\u201c\u8003\u6838\u901a\u5173\u201d\u3001\u201c\u4e13\u5c5e\u540d\u989d\u201d\u7b49\u7b56\u7565\uff0c\u5c5e\u4e8e\u5e38\u89c4\u4fc3\u5355\u624b\u6bb5\uff0c\u672a\u53d1\u73b0\u8fdd\u89c4\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6: \u5339\u914d**\u3002\u7528\u6237\u9009\u62e9\u9ad8\u9636\u8bfe\u7a0b\uff0c\u4e0e\u5176\u63a2\u7d22\u591a\u79cd\u5de5\u79cd\uff08\u753b\u672c\u3001\u5ba1\u542c\uff09\u7684\u6df1\u5ea6\u9700\u6c42\u76f8\u7b26\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c: \u9996\u5468\u5f3a\u5316\u7ec3\u4e60\u4e0e\u6821\u6b63\u53d8\u73b0\u9884\u671f**\n*   **\u5177\u4f53\u884c\u52a8\u6307\u5357**:\n    1.  **\u9884\u671f\u7ba1\u7406**\uff1a\u5728\u9996\u6b21\u6c9f\u901a\u4e2d\uff0c**\u660e\u786e\u5f3a\u8c03**\u6709\u58f0\u884c\u4e1a\u7684\u6210\u957f\u5468\u671f\u3001\u6536\u5165\u4e0e\u6280\u80fd/\u65f6\u95f4\u7684\u6b63\u6bd4\u5173\u7cfb\uff0c\u5c06\u201c\u5feb\u901f\u53d8\u73b0\u201d\u9884\u671f\u8f6c\u5316\u4e3a\u201c\u6280\u80fd\u79ef\u7d2f\u8def\u5f84\u201d\u3002\n    2.  **\u8d44\u6e90\u5bf9\u63a5**\uff1a\u5229\u7528\u5176\u201c\u52a1\u5b9e\u63a2\u7d22\u201d\u7279\u8d28\uff0c**\u5c3d\u5feb\u63d0\u4f9b\u6e05\u6670\u7684\u3001\u9636\u68af\u5f0f\u7684\u7ec3\u4e60\u4e0e\u63a5\u5355\u8def\u5f84**\uff08\u5982\u753b\u672c\u5165\u95e8\u4efb\u52a1\uff09\uff0c\u7528\u53ef\u5b9e\u73b0\u7684\u77ed\u671f\u76ee\u6807\u5de9\u56fa\u4fe1\u5fc3\u3002\n    3.  **\u6df1\u5ea6\u7ed1\u5b9a**\uff1a\u56e0\u5176\u51b3\u7b56\u76f8\u5bf9\u7406\u6027\uff0c\u73ed\u4e3b\u4efb\u5e94\u5c55\u73b0**\u4e13\u4e1a\u6027\u4e0e\u8d44\u6e90\u652f\u6301\u80fd\u529b**\uff0c\u6210\u4e3a\u5176\u53ef\u9760\u7684\u201c\u884c\u4e1a\u5f15\u8def\u4eba\u201d\uff0c\u800c\u4e0d\u4ec5\u662f\u5ba2\u670d\u3002\n    4.  **\u98ce\u9669\u76d1\u6d4b**\uff1a\u5bc6\u5207\u5173\u6ce8\u5176**\u9996\u6b21\u5b9e\u8df5\u5c1d\u8bd5\uff08\u5982\u753b\u672c\uff09\u7684\u53cd\u9988**\u3002\u82e5\u906d\u9047\u632b\u6298\u6216\u53d1\u73b0\u6536\u5165\u4e0e\u9884\u671f\u4e0d\u7b26\uff0c\u9700\u7acb\u5373\u4ecb\u5165\uff0c\u63d0\u4f9b\u5177\u4f53\u5e2e\u52a9\u5e76\u91cd\u7533\u957f\u671f\u4e3b\u4e49\u89c2\u5ff5\u3002\n\n{\"core_type\": \"T4 \u52a1\u5b9e\u63a2\u7d22\u8005\", \"risk_le
