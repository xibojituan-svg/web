    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n> **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4e3b\u8981\u96c6\u4e2d\u4e8e\u4f53\u9a8c\u8425\u6700\u540e\u4e00\u5929\uff084\u670810\u65e5\uff09\u7684\u8f6c\u5316\u73af\u8282\uff0c\u7f3a\u5c11\u5bf9\u7528\u6237\u8fc7\u5f80\u7ecf\u5386\u3001\u5bb6\u5ead\u60c5\u51b5\u3001\u804c\u4e1a\u3001\u65e5\u5e38\u65f6\u95f4\u5b89\u6392\u7684\u6df1\u5ea6\u4ea4\u6d41\u3002**\u652f\u4ed8\u80fd\u529b\u3001\u5bb6\u5ead\u652f\u6301\u5ea6\u3001\u771f\u5b9e\u53ef\u7528\u65f6\u95f4**\u7b49\u5173\u952e\u7ef4\u5ea6\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931\uff0c\u5bfc\u81f4\u90e8\u5206\u8bc4\u7ea7\u57fa\u4e8e\u6709\u9650\u4fe1\u606f\u63a8\u65ad\uff0c\u5b58\u5728\u98ce\u9669\u3002\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676286821 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u590f\u51b05(\u5b59\u8302\u6cc9) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b (\u6700\u7ec8\u652f\u4ed83980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3** (\u660e\u786e\u8868\u793a\u9700\u501f\u94b1\u3001\u4f59\u989d\u4e0d\u8db3\u3001\u5206\u6b21\u51d1\u6b3e) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u7f3a\u5931** (\u4ec5\u63d0\u53ca\u201c\u5728\u5f00\u8f66\u201d\u3001\u201c\u9001\u533b\u9662\u201d\uff0c\u65e0\u6cd5\u5224\u65ad) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** (\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u6210\u5458\uff0c\u7591\u4f3c\u5355\u8eab\u6216\u51b3\u7b56\u72ec\u7acb) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u2b06\u9ad8]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u7ed3\u679c\u800c\u6765(\u9ad8)\u3002\u7528\u6237\u6709\u660e\u786e\u7684\u53d8\u73b0\u76ee\u6807\uff08\u5f55\u4e66\u4e3b\u64ad\u3001\u6709\u58f0\u5c0f\u8bf4\uff09\uff0c\u5e76\u5df2\u6709\u7248\u6743\u4e66\u5728\u624b\uff0c\u6025\u4e8e\u5c06\u6295\u5165\u8f6c\u5316\u4e3a\u4ea7\u51fa\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u516b\u65b9\u6765\u8d22\u201d\u3001\u201c\u5f55\u4e66\u4e3b\u64ad\u201d\u3001\u201c\u6709\u58f0\u5c0f\u8bf4\u201d\u3001\u201c\u65f6\u85aa\u4e66\u4e5f\u53ef\u4ee5\u201d\u3001\u201c\u6211\u6709\u4e00\u672c\u677f\u6743\u4e66\u5728\u624b\u4e2d\uff0c\u5f55\u4e86\u4e00\u534a\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u2b07\u4f4e** \u2014 \u652f\u4ed83980\u5143\u8bfe\u7a0b\u8d39\u65f6\uff0c\u5fae\u4fe1\u4f59\u989d\u4ec51000\u591a\uff0c\u660e\u786e\u8868\u793a\u201c\u94b1\u4e0d\u591f\u201d\u3001\u201c\u4f59\u989d\u4e0d\u8db3\u201d\u3001\u201c\u6211\u501f\u4e0b\u201d\u3001\u201c\u4e3a\u4e86\u5b66\u4e60\u501f\u4e5f\u5b66\u201d\u3002**\u5b58\u5728\u660e\u663e\u7684\u7ecf\u6d4e\u538b\u529b\u548c\u501f\u8d37\u652f\u4ed8\u884c\u4e3a\u3002**\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u27a1\u4e2d (\u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u4f30)** \u2014 \u80fd\u5b8c\u6210\u4f5c\u4e1a\u3001\u8ddf\u76f4\u64ad\uff0c\u4f46\u73af\u5883\u5608\u6742\uff08\u5bb6\u5728\u9a6c\u8def\u8fb9\uff09\uff0c\u4e14\u6709\u7a81\u53d1\u5bb6\u5ead\u4e8b\u52a1\uff08\u9001\u6bcd\u4eb2\u53bb\u533b\u9662\uff09\uff0c\u65f6\u95f4\u53ef\u80fd\u88ab\u6324\u538b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u4fe1\u606f\uff0c\u65e0\u6cd5\u5224\u65ad\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b07\u4f4e\u6781\u5371]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u7528\u6237\u8868\u73b0\u51fa\u5f3a\u70c8\u7684**\u4e0d\u5b89\u5168\u611f**\u548c**\u88ab\u5751\u5bb3PTSD**\uff08\u63d0\u53ca\u5728\u201c\u68a8\u82b1\u201d\u673a\u6784\u88ab\u5751\u201c\u4e00\u6b65\u4e00\u5751\uff0c\u5751\u5751\u4ea4\u5b66\u8d39\u201d\uff09\uff0c\u53cd\u590d\u786e\u8ba4\u8d39\u7528\u3001\u6743\u76ca\u3001\u627f\u8bfa\uff0c\u5bf9\u9500\u552e\u6709\u5f3a\u70c8\u7684\u60c5\u611f\u7d22\u53d6\u548c\u786e\u8ba4\u9700\u6c42\uff08\u53cd\u590d\u8981\u6c42\u201c\u9001\u6211\u9ad8\u9636\u73ed\u201d\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5728\u68a8\u82b1\u9a6c\u4e0a\u516b\u4e2a\u6708\u4e86\uff0c\u4e00\u6b65\u4e00\u5751\uff0c\u5751\u5751\u4ea4\u5b66\u8d39\u201d\u3001\u201c\u6211\u6709\u4e00\u672c\u677f\u6743\u4e66\u5728\u624b\u4e2d\uff0c\u5f55\u4e86\u4e00\u534a\uff0c\u53ef\u4ed6\u4eec\u8bf4\u597d\u5e2e\u4e0a\u67b6\uff0c\u7ed3\u679c\uff0c\u7ee7\u7eed\u4ea4\u51e0\u4e07\u624d\u534f\u52a9\u201d\u3001\u201c\u4f60\u8bb2\u9001\u6211\u7684\u201d\u3001\u201c\u4e0d\u61c2[\u5472\u7259] \u5c11\u95ee\u7684\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u56e0\u8fc7\u5f80\u88ab\u5272\u97ed\u83dc\u7ecf\u5386\uff08\u68a8\u82b1\u673a\u6784\uff09\u800c\u4ea7\u751f\u7684\u5f3a\u70c8\u8d22\u52a1\u4e0d\u5b89\u5168\u611f\u4e0e\u4fe1\u4efb\u5371\u673a**\u3002\u4ed6\u5bb3\u6015\u518d\u6b21\u6295\u5165\u540e\u6ca1\u6709\u7ed3\u679c\uff0c\u6e34\u671b\u4e00\u4e2a\u786e\u5b9a\u6027\u7684\u3001\u6709\u4fdd\u969c\u7684\u53d8\u73b0\u8def\u5f84\u6765\u6d88\u9664\u7126\u8651\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u201c\u5b89\u5168\u627f\u8bfa\u201d\u4e0e\u201c\u786e\u5b9a\u6027\u5b89\u629a\u201d**\u3002\u9700\u8981\u4e0d\u65ad\u7ed9\u4e88\u201c\u8fd9\u6b21\u4e0d\u4e00\u6837\u201d\u3001\u201c\u6709\u7ed3\u679c\u201d\u3001\u201c\u6709\u4fdd\u969c\u201d\u3001\u201c\u6211\u966a\u4f60\u201d\u7684\u5f3a\u627f\u8bfa\uff0c\u5145\u5f53\u5176\u5bf9\u6297\u5916\u90e8\u4e0d\u786e\u5b9a\u6027\u7684\u201c\u9632\u62a4\u76fe\u201d\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udd34D \u7c7b** (\u89e6\u53d1\u652f\u4ed8\u7ea2\u7ebf) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u6df7\u5408 **T4 \u641e\u94b1\u7ed3\u679c\u578b** \u7684\u8868\u5c42\u52a8\u673a) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a**\ud83d\udd34\u5df2\u89e6\u53d1 D \u7c7b\u7194\u65ad\u7ea2\u7ebf\uff01**\n- **\u89e6\u53d1\u56e0\u7531**\uff1a**\u660e\u786e\u5b58\u5728\u501f\u8d37\u652f\u4ed8\u884c\u4e3a**\uff08\u201c\u6211\u501f\u4e0b\u201d\u3001\u201c\u4e3a\u4e86\u5b66\u4e60\u501f\u4e5f\u5b66\u201d\uff09\uff0c\u4e14\u81ea\u8eab\u652f\u4ed8\u80fd\u529b\u660e\u663e\u4e0d\u8db3\uff08\u4f59\u989d\u4ec5\u5343\u4f59\u5143\uff09\uff0c\u5c5e\u4e8e\u9ad8\u98ce\u9669\u8d22\u52a1\u51b3\u7b56\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u82e5\u501f\u6b3e\u884c\u4e3a\u88ab\u5bb6\u4eba\u53d1\u73b0\u5e76\u65bd\u538b\uff0c\u53ef\u80fd\u5f15\u53d1\u6fc0\u70c8\u51b2\u7a81\u5e76\u8981\u6c42\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | \u5b66\u4e60\u8fc7\u7a0b\u4e2d\u9047\u5230\u4efb\u4f55\u6280\u672f\u56f0\u96be\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u3001\u566a\u97f3\u5904\u7406\uff09\u3001\u6216\u65f6\u95f4\u88ab\u5bb6\u5ead/\u7a81\u53d1\u4e8b\u52a1\u6324\u5360\uff0c\u6781\u6613\u56e0\u7126\u8651\u548c\u632b\u8d25\u611f\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u4e00\u65e6\u611f\u89c9\u627f\u8bfa\u672a\u5151\u73b0\uff08\u5982\u201c\u8fdb\u5267\u7ec4\u201d\u3001\u201c\u9ad8\u9636\u8d60\u8bfe\u201d\u6a21\u7cca\uff09\u3001\u6216\u9047\u5230\u7a0d\u96be\u7684\u4f5c\u4e1a\u3001\u6216\u770b\u5230\u5176\u4ed6\u540c\u5b66\u8fdb\u6b65\u66f4\u5feb\uff0c\u5176\u201c\u88ab\u5751PTSD\u201d\u4f1a\u77ac\u95f4\u5f15\u7206\uff0c\u4ea7\u751f\u5f3a\u70c8\u88ab\u6b3a\u9a97\u611f\uff0c\u60c5\u7eea\u5316\u8981\u6c42\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | \u5bf9\u201c\u5feb\u901f\u63a5\u5355\u201d\u62b1\u6709\u6781\u9ad8\u671f\u671b\uff0c\u82e5\u5f00\u8bfe\u540e\u77ed\u671f\u5185\uff08\u59821-2\u5468\uff09\u672a\u83b7\u5f97\u5b9e\u8d28\u63a5\u5355\u673a\u4f1a\u6216\u6536\u5165\uff0c\u4f1a\u7acb\u523b\u8d28\u7591\u8bfe\u7a0b\u4ef7\u503c\uff0c\u66b4\u6012\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c7-14\u5929**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u4f5c\u4e1a\u96be\u5ea6\u53ef\u80fd\u63d0\u5347\uff0c\u4f46\u53d8\u73b0\u8def\u5f84\u5c1a\u672a\u6e05\u6670\uff0c\u5176\u7126\u8651\u611f\u548c\u4e0d\u4fe1\u4efb\u611f\u5c06\u8fbe\u5230\u7b2c\u4e00\u4e2a\u5cf0\u503c\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cXX\u540c\u5b66\uff0c\u6211\u770b\u5230\u4f60\u4e3a\u4e86\u5b66\u4e60\u751a\u81f3\u613f\u610f\u53bb\u7b79\u94b1\uff0c\u8fd9\u4efd\u51b3\u5fc3\u6211\u7279\u522b\u4f69\u670d\uff0c\u4e5f\u7279\u522b\u5fc3\u75bc\u3002\u8bf7\u653e\u5fc3\uff0c\u4f60\u4e4b\u524d\u5728\u522b\u5904\u8e29\u8fc7\u7684\u5751\uff0c\u5728\u6211\u8fd9\u91cc\u7edd\u5bf9\u4e0d\u4f1a\u518d\u53d1\u751f\u3002\u6211\u4eec\u7684\u6bcf\u4e00\u6b65\u90fd\u624e\u624e\u5b9e\u5b9e\uff0c\u6211\u6bcf\u5929\u90fd\u4f1a\u76ef\u7740\u4f60\u7684\u8fdb\u5ea6\uff0c\u6709\u4efb\u4f55\u4e0d\u786e\u5b9a\u3001\u4e0d\u8212\u670d\u7684\u5730\u65b9\uff0c\u4f60\u968f\u65f6\u627e\u6211\uff0c\u6211\u4fdd\u8bc1\u7ed9\u4f60\u4e00\u4e2a\u6e05\u6e05\u695a\u695a\u7684\u4ea4\u4ee3\u3002\u54b1\u4eec\u4e0d\u56fe\u5feb\uff0c\u5c31\u56fe\u4e00\u4e2a\u7a33\u5b57\uff0c\u628a\u672c\u4e8b\u7ec3\u5230\u624b\uff0c\u628a\u94b1\u8d5a\u5230\u515c\u91cc\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5feb\u901f\u63a5\u5355\u7ebf**\u3011\u3002\u5fc5\u987b\u4f18\u5148\u6ee1\u8db3\u5176\u201c\u641e\u94b1\u201d\u7684\u8feb\u5207\u9700\u6c42\uff0c\u54ea\u6015\u662f\u5c0f\u5355\u3001\u4f53\u9a8c\u5355\uff0c\u65e9\u671f\u7ed9\u4e88\u6b63\u53cd\u9988\u81f3\u5173\u91cd\u8981\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u5f3a\u70c8\u8865\u5145\u3010**\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305**\u3011\u3002\u5305\u62ec\uff1a1\uff09\u6bcf\u65e5\u60c5\u7eea\u6253\u5361\u4e0e\u5b89\u629a\uff1b2\uff09\u4e00\u5bf9\u4e00\u4fdd\u59c6\u7ea7\u6280\u672f\u95ee\u9898\u89e3\u51b3\uff08\u964d\u566a\u3001\u8f6f\u4ef6\uff09\uff1b3\uff09\u201c\u9632\u5751\u907f\u96f7\u201d\u5c0f\u8bfe\u5802\uff0c\u5f3a\u5316\u4fe1\u4efb\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1\uff09\u7ed9\u51fa\u6a21\u7cca\u627f\u8bfa\uff08\u5982\u201c\u80af\u5b9a\u80fd\u8d5a\u5927\u94b1\u201d\uff09\uff1b2\uff09\u5728\u4ed6\u62b1\u6028\u65f6\u8bb2\u5927\u9053\u7406\u6216\u6279\u8bc4\uff1b3\uff09\u5e03\u7f6e\u8fc7\u96be\u3001\u632b\u8d25\u611f\u5f3a\u7684\u4f5c\u4e1a\u800c\u4e0d\u63d0\u4f9b\u624b\u628a\u624b\u652f\u6301\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5347\u5355**\uff01\u5f53\u524d3980\u5143\u8bfe\u7a0b\u5df2\u662f\u5176\u627f\u53d7\u6781\u9650\uff0c\u4efb\u4f55\u9644\u52a0\u6d88\u8d39\u5efa\u8bae\u90fd\u4f1a\u7acb\u523b\u5f15\u7206\u4fe1\u4efb\u5371\u673a\uff0c\u89e6\u53d1\u9000\u8d39\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5728\u68a8\u82b1\u9a6c\u4e0a\u516b\u4e2a\u6708\u4e86\uff0c\u4e00\u6b65\u4e00\u5751\uff0c\u5751\u5751\u4ea4\u5b66\u8d39\u201d\n2. > \u201c\u94b1\u4e0d\u591f\u548b\u529e\u201d\u3001\u201c\u6211\u501f\u4e0b\u201d\u3001\u201c\u4e3a\u4e86\u5b66\u4e60\u501f\u4e5f\u5b66\u201d\n3. > \u201c\u4f60\u8bb2\u9001\u6211\u7684\u201d\u3001\u201c\u4e0d\u61c2[\u5472\u7259] \u5c11\u95ee\u7684\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010\u521b\u4f24\u540e\u641e\u94b1\u7126\u8651\u5de8\u5a74\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u4e0e\u4fdd\u969c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u8d85\u9ad8\u9891\u3001\u8d85\u5177\u4f53\u7684\u60c5\u611f\u5b89\u629a\u4e0e\u8fdb\u5ea6\u786e\u8ba4\uff0c\u5e76\u5c3d\u65e9\u5b89\u6392\u5fae\u5c0f\u53d8\u73b0\u6b63\u53cd\u9988\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf+\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\"}\n```";
