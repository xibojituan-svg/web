    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u7f3a\u5c11\u652f\u4ed8\u73af\u8282\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u5177\u4f53\u8d44\u6e90\u6295\u5165\uff08\u65f6\u95f4/\u8bbe\u5907\uff09\u53ca\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u7b49\u5173\u952e\u4fe1\u606f\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a\u4e2d\u7b49\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u6709\u58f0\u8bfb\u4e66\u5c31\u662f\u5174\u8da3\u201d\uff0c\u5e76\u9009\u62e9\u201cA \u5c1d\u8bd5\u58f0\u97f3\u517c\u804c\u201d\uff0c\u8868\u660e\u5174\u8da3\u4e0e\u53d8\u73b0\u53cc\u91cd\u9a71\u52a8\u3002\u4f46\u5b58\u5728\u201c\u4e0d\u77e5\u9053\u80fd\u4e0d\u80fd\u575a\u6301\u4e0b\u53bb\u201d\u7684\u7591\u8651\uff0c\u52a8\u673a\u7a33\u5b9a\u6027\u5f85\u89c2\u5bdf\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a\u4e2d\u7b49\u504f\u4e0a\u3002\u7528\u6237\u4e3a\u9000\u4f11\u4eba\u5458\uff08\u201c\u9000\u4f11\u4e24\u5e74\u591a\u201d\uff09\uff0c\u6709\u201c\u4e2d\u7b49\u7684\u9000\u4f11\u91d1\u201d\u4e14\u201c\u4e00\u76f4\u90fd\u5728\u4e0a\u73ed\u201d\uff0c\u8868\u660e\u6709\u7a33\u5b9a\u7684\u7ecf\u6d4e\u6765\u6e90\u548c\u53ef\u80fd\u53ef\u63a7\u7684\u4e1a\u4f59\u65f6\u95f4\u3002\u4f46\u5177\u4f53\u6bcf\u65e5\u53ef\u6295\u5165\u5b66\u4e60\u65f6\u957f\u3001\u8bbe\u5907\u6761\u4ef6\uff08\u5982\u5f55\u97f3\u73af\u5883\uff09\u672a\u77e5\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a\u4e2d\u7b49\u3002\u7528\u6237\u80fd\u6309\u65f6\u5b8c\u6210\u65e9\u529f\u3001\u6253\u5361\u3001\u542c\u8bfe\u7b49\u4efb\u52a1\uff0c\u914d\u5408\u5ea6\u9ad8\uff08\u201c\u597d\u7684\u201d\u3001\u201c\u8c22\u8c22\u201d\u3001\u201c\u53ef\u4ee5\u201d\uff09\uff0c\u884c\u52a8\u529b\u5c1a\u53ef\u3002\u4f46\u591a\u6b21\u8868\u8fbe\u201c\u4fe1\u5fc3\u4e0d\u8db3\u201d\u3001\u201c\u4e0d\u786e\u5b9a\u201d\uff0c\u4f9d\u8d56\u5916\u90e8\u9f13\u52b1\uff08\u201c\u591a\u8c22\u4f60\u7ed9\u6211\u4fe1\u5fc3\u201d\uff09\uff0c**\u5185\u5728\u81ea\u4fe1\u4e0e\u6297\u632b\u6298\u80fd\u529b\u504f\u5f31**\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u8bb0\u5f55\u4e2d\u672a\u63d0\u53ca\u652f\u4ed8\u884c\u4e3a\u6216\u91d1\u989d\uff0c**\u5173\u952e\u4fe1\u606f\u7f3a\u5931**\u3002\u65e0\u6cd5\u5224\u65ad\u7528\u6237\u662f\u5426\u5df2\u5b8c\u6210\u4ed8\u8d39\u8f6c\u5316\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u8bb0\u5f55\u4e2d\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u6210\u5458\u6216\u51b3\u7b56\u8ba8\u8bba\uff0c**\u4fe1\u606f\u7f3a\u5931**\u3002\u9274\u4e8e\u7528\u6237\u4e3a\u9000\u4f11\u4eba\u58eb\uff0c\u9700\u8b66\u60d5\u5176\u5927\u989d\u6d88\u8d39\u53ef\u80fd\u5f15\u53d1\u7684\u5bb6\u5ead\u77db\u76fe\u98ce\u9669\u3002\n*   **\u6b65\u9aa41-4\u5224\u5b9a**\uff1a\u57fa\u4e8e\u73b0\u6709\u4e92\u52a8\uff1a\n    *   **A\uff08\u884c\u52a8\u529b\uff09**\uff1a\u4e2d\u7b49\u3002\u80fd\u5b8c\u6210\u89c4\u5b9a\u52a8\u4f5c\uff0c\u4f46\u4e3b\u52a8\u6027\u63d0\u95ee\u5c11\uff0c\u591a\u4e3a\u88ab\u52a8\u54cd\u5e94\u3002\n    *   **B\uff08\u4fe1\u4efb\u5ea6\uff09**\uff1a\u4e2d\u7b49\u504f\u9ad8\u3002\u5bf9\u9500\u552e\uff08\u5e08\u5144\uff09\u7684\u6307\u5bfc\u8868\u793a\u63a5\u53d7\u548c\u611f\u8c22\uff0c\u914d\u5408\u6253\u5361\u3001\u6539\u7fa4\u6635\u79f0\u7b49\u8981\u6c42\u3002\n    *   **C\uff08\u8ba4\u77e5\u6e05\u6670\u5ea6\uff09**\uff1a\u504f\u4f4e\u3002\u5bf9\u81ea\u8eab\u9002\u5408\u8d5b\u9053\u8868\u793a\u201c\u5176\u5b9e\u6211\u4e5f\u4e0d\u786e\u5b9a\u201d\uff0c\u5bf9\u884c\u4e1a\u8ba4\u77e5\u4e3b\u8981\u6765\u81ea\u9500\u552e\u5355\u65b9\u9762\u704c\u8f93\uff0c\u7f3a\u4e4f\u72ec\u7acb\u5224\u65ad\u4fe1\u606f\u3002\n    *   **D\uff08\u51b3\u7b56\u7d27\u8feb\u6027\uff09**\uff1a\u4f4e\u3002\u672a\u8868\u73b0\u51fa\u6025\u4e8e\u62a5\u540d\u6216\u7126\u8651\u60c5\u7eea\uff0c\u8282\u594f\u7531\u9500\u552e\u4e3b\u5bfc\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n**T5 \u8c28\u614e\u63a2\u7d22\u8005**\u3002\n*   **\u7279\u5f81\u543b\u5408**\uff1a\u9000\u4f11\u540e\u6709\u7a33\u5b9a\u6536\u5165\uff0c\u5bfb\u6c42\u5174\u8da3\u4e0e\u517c\u804c\u53ef\u80fd\u3002\u5b66\u4e60\u6001\u5ea6\u8ba4\u771f\u4f46\u4fe1\u5fc3\u4e0d\u8db3\uff0c\u51b3\u7b56\u8c28\u614e\uff08\u201c\u6211\u60f3\u505a\uff0c\u4f46\u662f\u73b0\u5728\u8fd8\u662f\u4fe1\u5fc3\u4e0d\u8db3\u201d\uff09\uff0c\u5bf9\u884c\u4e1a\u4e86\u89e3\u6d45\uff0c\u6613\u53d7\u9500\u552e\u6848\u4f8b\uff08\u5b66\u5458\u524d\u540e\u5bf9\u6bd4\u97f3\u9891\uff09\u5f71\u54cd\u3002\n*   **\u6838\u5fc3\u8bc9\u6c42**\uff1a\u5728\u4f4e\u98ce\u9669\u524d\u63d0\u4e0b\uff0c\u9a8c\u8bc1\u81ea\u5df1\u80fd\u5426\u901a\u8fc7\u6709\u58f0\u6f14\u64ad\u83b7\u5f97\u989d\u5916\u6536\u5165\u4e0e\u6210\u5c31\u611f\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u98ce\u9669\u7b49\u7ea7\uff1a\u4e2d**\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a\u4e2d\u98ce\u9669\u3002\u7528\u6237\u4fe1\u5fc3\u57fa\u7840\u5f31\uff0c\u82e5\u521d\u671f\u7ec3\u4e60\u53cd\u9988\u4e0d\u4f73\u6216\u63a5\u5355\u4e0d\u987a\uff0c\u6613\u4ea7\u751f\u632b\u8d25\u611f\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a\u4f4e\u98ce\u9669\u3002\u6709\u9000\u4f11\u91d1\u4e0e\u5de5\u4f5c\u6536\u5165\uff0c\u7ecf\u6d4e\u538b\u529b\u8f83\u5c0f\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a\u4e2d\u98ce\u9669\u3002\u7528\u6237\u4ecd\u5728\u4e0a\u73ed\uff0c\u9700\u5e73\u8861\u5de5\u4f5c\u3001\u5b66\u4e60\u4e0e\u751f\u6d3b\uff0c\u82e5\u8bfe\u7a0b\u5f3a\u5ea6\u5927\u6613\u653e\u5f03\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u4e2d\u9ad8\u98ce\u9669**\u3002**\u5173\u952e\u4fe1\u606f\u7f3a\u5931**\uff0c\u9000\u4f11\u4eba\u58eb\u5927\u989d\u652f\u51fa\u6613\u5f15\u53d1\u5b50\u5973\u5173\u5207\uff0c\u662f\u6f5c\u5728\u96f7\u533a\u3002\n    5.  **\u9500\u552e\u8bef\u5bfc**\uff1a\u4e2d\u98ce\u9669\u3002\u9500\u552e\u8bdd\u672f\u5b58\u5728**\u8fc7\u5ea6\u627f\u8bfa\u503e\u5411**\uff08\u5982\u201c\u7ad9\u5728\u5de8\u4eba\u7684\u80a9\u8180\u4e0a\u6500\u767b\u201d\u3001\u201c\u559c\u9a6c\u5ae1\u7cfb\u6f14\u64ad\u5e08\u201d\uff09\uff0c\u53ef\u80fd\u62c9\u9ad8\u7528\u6237\u9884\u671f\u3002\n    6.  **\u4ea7\u54c1\u4e0d\u7b26**\uff1a\u4e2d\u98ce\u9669\u3002\u7528\u6237\u52a8\u673a\u542b\u5174\u8da3\u6210\u5206\uff0c\u82e5\u540e\u671f\u4ea7\u54c1\u8fc7\u5ea6\u4fa7\u91cd\u201c\u63a5\u5355\u53d8\u73b0\u201d\u800c\u5ffd\u89c6\u5174\u8da3\u57f9\u517b\u4e0e\u80fd\u529b\u6e10\u8fdb\uff0c\u53ef\u80fd\u4ea7\u751f\u504f\u5dee\u3002\n    7.  **\u670d\u52a1\u4f53\u9a8c**\uff1a\u4f4e\u98ce\u9669\u3002\u76ee\u524d\u9500\u552e\u8ddf\u8fdb\u53ca\u65f6\uff0c\u4e92\u52a8\u826f\u597d\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u4e3b\u8981\u95ee\u9898**\uff1a\n    *   **\u5938\u5927\u627f\u8bfa**\uff1a\u9500\u552e\u4f7f\u7528\u201c\u767e\u5ea6\u90fd\u641c\u4e0d\u5230\u7684\u591a\u5e74\u5de5\u4f5c\u7ecf\u9a8c\u201d\u3001\u201c\u7ad9\u5728\u5de8\u4eba\u7684\u80a9\u8180\u4e0a\u6500\u767b\u201d\u3001\u201c\u559c\u9a6c\u5ae1\u7cfb\u6f14\u64ad\u5e08\u201d\u7b49\u8bdd\u672f\uff0c**\u5b58\u5728\u5938\u5927\u548c\u7ed1\u5b9a\u5e73\u53f0\u80cc\u4e66\u5acc\u7591**\u3002\n    *   **\u5236\u9020\u7a00\u7f3a\u4e0e\u7d27\u8feb**\uff1a\u9891\u7e41\u4f7f\u7528\u201c\u52a1\u5fc5\u53c2\u4e0e\uff0c\u624d\u4e0d\u4f1a\u6389\u961f\u201d\u3001\u201c\u6700\u91cd\u8981\u201d\u3001\u201c\u4e0d\u8981\u5f71\u54cd\u4f60\u5165\u9a7b\u201d\u7b49\u8bdd\u672f\u8425\u9020\u7126\u8651\u3002\n    *   **\u5229\u7528\u4ece\u4f17\u4e0e\u6743\u5a01**\uff1a\u5c55\u793a\u5176\u4ed6\u5b66\u5458\u6848\u4f8b\uff08\u97f3\u9891\u5bf9\u6bd4\uff09\u8fdb\u884c\u8bf1\u5bfc\u3002\n*   **\u5408\u89c4\u6027**\uff1a\u6574\u4f53\u6d41\u7a0b\u5b58\u5728\u8bf1\u5bfc\u6027\u8425\u9500\uff0c\u4f46\u5c1a\u672a\u53d1\u73b0\u76f4\u63a5\u6b3a\u9a97\u6216\u8fdd\u89c4\u6536\u8d39\u8bc1\u636e\uff08\u56e0\u652f\u4ed8\u73af\u8282\u7f3a\u5931\uff09\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d**\uff1a**\u504f\u5dee**\u3002\u7528\u6237\u5174\u8da3\u4e0e\u517c\u804c\u52a8\u673a\u5e76\u5b58\uff0c\u9700**\u5174\u8da3\u57f9\u517b\u4e0e\u8f7b\u91cf\u5316\u53d8\u73b0\u7ed3\u5408**\u7684\u4ea7\u54c1\u8def\u5f84\u3002\u82e5\u540e\u7eed\u4ea7\u54c1\u4ec5\u4e3a\u9ad8\u5f3a\u5ea6\u7684\u201c\u63a5\u5355\u8bad\u7ec3\u8425\u201d\uff0c\u5219\u6613\u9519\u914d\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**24h\u5185\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\u4e0e\u652f\u4ed8\u60c5\u51b5**\n*   **\u8be6\u7ec6\u6307\u5357**\uff1a\n    1.  **\u9996\u8981\u98ce\u63a7**\uff1a\u7acb\u5373\u8054\u7cfb\u7528\u6237\uff0c\u6e29\u548c\u6838\u5b9e**\u5927\u989d\u652f\u51fa\u662f\u5426\u5df2\u544a\u77e5\u5bb6\u4eba**\uff0c\u5e76\u660e\u786e\u544a\u77e5\u5b66\u4e60\u5468\u671f\u3001\u6295\u5165\u65f6\u95f4\u53ca\u6210\u529f\u6240\u9700\u52aa\u529b\uff0c**\u7ba1\u7406\u53d8\u73b0\u9884\u671f**\u3002\n    2.  **\u4fe1\u5fc3\u5efa\u8bbe**\uff1a\u521d\u671f\u7ed9\u4e88\u66f4\u591a\u6b63\u5411\u3001\u5177\u4f53\u7684\u53cd\u9988\uff0c\u805a\u7126\u5176\u201c\u5b8c\u6210\u65e9\u529f\u201d\u7b49\u884c\u4e3a\uff0c\u800c\u975e\u6025\u4e8e\u63a8\u9001\u63a5\u5355\u4fe1\u606f\u3002\u5e2e\u52a9\u8bbe\u7acb\u5fae\u5c0f\u3001\u53ef\u8fbe\u6210\u7684\u9636\u6bb5\u6027\u76ee\u6807\u3002\n    3.  **\u8def\u5f84\u89c4\u5212**\uff1a\u6c9f\u901a\u660e\u786e\u5176\u6bcf\u5468\u53ef\u6295\u5165\u5b66\u4e60\u7684\u7a33\u5b9a\u65f6\u95f4\uff0c\u63a8\u8350\u5339\u914d\u5176\u65f6\u95f4\u7684\u8bfe\u7a0b\u8282\u594f\u4e0e\u7ec3\u4e60\u4efb\u52a1\u3002\u4f18\u5148\u63a8\u8350\u201c\u4eba\u6587\u793e\u79d1\u201d\u7c7b\u8bd5\u97f3\u5185\u5bb9\uff0c\u8d34\u5408\u5176\u5174\u8da3\u3002\n    4.  **\u98ce\u9669\u76d1\u63a7**\uff1a\u91cd\u70b9\u5173\u6ce8\u5176\u7ec3\u4e60\u4f5c\u4e1a\u7684\u5b8c\u6210\u8d28\u91cf\u4e0e\u60c5\u7eea\u53cd\u9988\uff0c\u4e00\u65e6\u51fa\u73b0\u8fde\u7eed\u5026\u6020\u6216\u8d1f\u9762\u53cd\u9988\uff0c\u9700\u4e3b\u52a8\u4ecb\u5165\uff0c\u4e86\u89e3\u662f\u65f6\u95f4\u95ee\u9898\u3001\u96be\u5ea6\u95ee\u9898\u8fd8\u662f\u4fe1\u5fc3\u95ee\u9898\uff0c\u53ca\u65f6\u8c03\u6574\u3002\n\n{\"core_type\": \"T5 \u8c28\u614e\u63a2\u7d22\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"24h\u5185\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\u4e0e\u652f\u4ed8\u60c5\u51b5\"}";
