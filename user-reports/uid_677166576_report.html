    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v4.1.3)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID 677166576 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-13 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5317\u65b9\u7b71\u7b19(\u674e\u82b3) / \u5143\u82f1\u73ed\u73ed(\u8303\u57f9\u5a1c) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u77ed\u89c6\u9891\u8bfe\u7a0b\uff08\u521b\u4f5c\u84252980\u5143/\u5b9e\u6218\u84253980\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff08\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u5206\u671f\u6216\u501f\u8d37\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u9700\u505a\u5bb6\u52a1\u3001\u665a\u4e0a\u6709\u7a7a\uff0c\u4f46\u65f6\u95f4\u4e0d\u56fa\u5b9a\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u9690\u7792\u5077\u62a5**\uff08\u8001\u516c\u66fe\u62d2\u63a5\u9500\u552e\u7535\u8bdd\uff0c\u7528\u6237\u89e3\u91ca\u201c\u62d2\u63a5\u7684\u4e0d\u662f\u6211\uff01\u662f\u6211\u8001\u516c\uff01\u201d\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\uff08\u6709\u5b66\u4e60\u610f\u613f\u548c\u57fa\u7840\u4e92\u52a8\uff0c\u4f46\u5173\u952e\u51b3\u7b56\u4fe1\u606f\u5982\u652f\u4ed8\u80fd\u529b\u3001\u6df1\u5c42\u52a8\u673a\u4e0d\u8db3\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u8868\u73b0\u51fa\u5b66\u4e60\u5174\u8da3\u548c\u6267\u884c\u529b\uff08\u4e0b\u8f7d\u8f6f\u4ef6\u3001\u542c\u56de\u653e\uff09\uff0c\u4f46\u672a\u660e\u786e\u8868\u8fbe\u5f3a\u70c8\u7684\u53d8\u73b0\u8bc9\u6c42\uff0c\u66f4\u591a\u662f\u8ddf\u968f\u5f15\u5bfc\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u81ea\u7531\u53d1\u6325\u8fd8\u6ca1\u5230\u8fd9\u4e2a\u7ea7\u522b[\u5077\u7b11]\u8fd8\u662f\u8ddf\u7740\u8001\u5e08\u6162\u6162\u6765\u5427\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u610f\u54113980\u5143\u8bfe\u7a0b\uff0c\u4f46\u9700\u4e0e\u8001\u516c\u6c9f\u901a\uff0c\u5b58\u5728\u5bb6\u5ead\u963b\u529b\uff0c\u8d44\u91d1\u81ea\u4e3b\u6743\u53d7\u9650\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u665a\u4e0a\u6709\u65f6\u95f4\u5b66\u4e60\uff0c\u4f46\u9700\u5904\u7406\u5bb6\u52a1\uff0c\u65f6\u95f4\u788e\u7247\u5316\u3002\u80fd\u575a\u6301\u542c\u56de\u653e\uff0c\u6267\u884c\u529b\u5c1a\u53ef\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4f4e** \u2014 **\u5173\u952e\u77ed\u677f**\u3002\u8001\u516c\u5bf9\u5b66\u4e60\u6301\u53cd\u5bf9\u6216\u4e0d\u77e5\u60c5\u6001\u5ea6\uff08\u62d2\u63a5\u7535\u8bdd\uff09\uff0c\u6784\u6210\u6f5c\u5728\u7684\u5bb6\u5ead\u5e72\u9884\u98ce\u9669\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u27a1\u4e2d**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u9700\u95f4\u6b47\u6027\u5b89\u629a\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u8fdb\u4e0d\u53bb\u76f4\u64ad\uff09\u4f1a\u8868\u8fbe\u7126\u8651\uff08\u201c\u5b8c\u86cb\u4e86\u201d\uff09\uff0c\u4f46\u80fd\u63a5\u53d7\u89e3\u51b3\u65b9\u6848\uff08\u542c\u56de\u653e\uff09\u3002\u6574\u4f53\u60c5\u7eea\u5e73\u7a33\uff0c\u65e0\u6781\u7aef\u5d29\u6e83\u4fe1\u53f7\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u8fd9\u4e00\u8282\u8bfe\u90fd\u6ca1\u542c\u5230\uff0c\u5b8c\u86cb\u4e86\uff0c\u6211\u8fd8\u662f\u8fdb\u53bb\u770b\u4e00\u4e0b\uff0c\u770b\u6709\u6ca1\u6709\u8865\u8865\u8865\u8bfe\u7684\u3002\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 / \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bb6\u5ead\u5185\u90e8\u7684\u4e0d\u652f\u6301\u4e0e\u6f5c\u5728\u51b2\u7a81**\u3002\u5979\u9700\u8981\u5728\u4e0d\u88ab\u5bb6\u4eba\uff08\u5c24\u5176\u662f\u4e08\u592b\uff09\u7406\u89e3\u6216\u652f\u6301\u7684\u60c5\u51b5\u4e0b\uff0c\u4e3a\u81ea\u5df1\u5bfb\u627e\u4e00\u4e2a\u5b89\u5168\u3001\u6709\u5f52\u5c5e\u611f\u7684\u5b66\u4e60\u7a7a\u95f4\u548c\u53ef\u80fd\u7684\u6536\u5165\u6765\u6e90\uff0c\u4ee5\u63d0\u5347\u4e2a\u4eba\u5b89\u5168\u611f\u548c\u5bb6\u5ead\u5730\u4f4d\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u63d0\u4f9b\u4e00\u79cd\u201c\u88ab\u770b\u89c1\u3001\u88ab\u652f\u6301\u3001\u88ab\u79d8\u5bc6\u5b88\u62a4\u201d\u7684\u5b89\u5168\u6e2f\u6e7e\u611f**\u3002\u73ed\u4e3b\u4efb\u9700\u8981\u6210\u4e3a\u5979\u5bf9\u6297\u5916\u90e8\uff08\u5bb6\u5ead\uff09\u538b\u529b\u7684\u76df\u53cb\uff0c\u7ed9\u4e88\u5979\u5b8c\u6210\u5b66\u4e60\u7684\u4fe1\u5fc3\u548c\u201c\u5077\u5077\u53d8\u597d\u201d\u7684\u6210\u5c31\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b**\uff08\u98ce\u9669\u7ba1\u63a7\u578b\uff09 |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u8bba\uff08\u5bb6\u5ead\u91cd\u8d1f\u62fc\u547d\u578b\u4e9a\u79cd\uff09** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\u3002\u4f46**\u5bb6\u5ead\u5e72\u9884\u98ce\u9669\u9ad8**\uff0c\u9700\u5bc6\u5207\u5173\u6ce8\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| **\u5bb6\u5ead\u5e72\u9884\u578b** | **\u9ad8** | \u4e08\u592b\u53d1\u73b0\u8bfe\u7a0b\u652f\u51fa\u5e76\u5f3a\u70c8\u53cd\u5bf9\uff0c\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\uff0c\u88ab\u8feb\u9000\u8d39\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u4e2d** | \u5bb6\u52a1\u4e0e\u5b66\u4e60\u65f6\u95f4\u51b2\u7a81\u52a0\u5267\uff0c\u5bfc\u81f4\u4f5c\u4e1a\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u632b\u8d25\u611f\u800c\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u4f4e** | \u6682\u65e0\u5f3a\u70c8\u81ea\u5351\u6216\u73bb\u7483\u5fc3\u8868\u73b0\uff0c\u4f46\u82e5\u521d\u671f\u5b66\u4e60\u9047\u963b\u4e14\u65e0\u4eba\u53ca\u65f6\u5b89\u629a\uff0c\u53ef\u80fd\u9000\u7f29\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u4e2d** | \u82e5\u5b66\u4e60\u4e00\u6bb5\u65f6\u95f4\u540e\uff08\u59821-2\u4e2a\u6708\uff09\u672a\u770b\u5230\u4efb\u4f55\u53d8\u73b0\u5e0c\u671b\u6216\u6210\u679c\uff0c\u53ef\u80fd\u56e0\u9884\u671f\u843d\u5dee\u800c\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\u3002\u6b64\u65f6\u5b66\u4e60\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u5bb6\u5ead\u538b\u529b\u53ef\u80fd\u663e\u73b0\uff0c\u82e5\u5b66\u4e60\u8fdb\u5ea6\u53d7\u963b\u6216\u672a\u4ea7\u751f\u4efb\u4f55\u6b63\u5411\u53cd\u9988\uff08\u5982\u5c0f\u4f5c\u54c1\u3001\u88ab\u8ba4\u53ef\uff09\uff0c\u9000\u8d39\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u59d0\uff0c\u6211\u770b\u5230\u4f60\u7279\u522b\u8ba4\u771f\uff0c\u665a\u4e0a\u8fd8\u575a\u6301\u542c\u56de\u653e\uff0c\u771f\u7684\u5f88\u4f69\u670d\u3002\u54b1\u4eec\u8fd9\u4e2a\u5b66\u4e60\u5c31\u50cf\u2018\u5077\u5077\u5b58\u79c1\u623f\u94b1\u2019\uff0c\u4e00\u70b9\u70b9\u79ef\u7d2f\uff0c\u4ee5\u540e\u90fd\u662f\u81ea\u5df1\u7684\u672c\u4e8b\u3002\u5bb6\u91cc\u7684\u4e8b\u6162\u6162\u6765\uff0c\u5b66\u4e60\u4e0a\u6709\u4ec0\u4e48\u5361\u4f4f\u7684\u968f\u65f6\u627e\u6211\uff0c\u6211\u5e2e\u4f60\u4e00\u8d77\u60f3\u529e\u6cd5\uff0c\u54b1\u4eec\u4f4e\u8c03\u5730\u628a\u4e8b\u60c5\u505a\u6210\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\uff08\u4ea7\u54c1\u7ebfA\uff09\u3002\u5979\u6709\u610f\u54113980\u8bfe\u7a0b\uff0c\u6709\u5b66\u4e60\u6267\u884c\u529b\uff0c\u5e94\u5f15\u5bfc\u5176\u638c\u63e1\u624e\u5b9e\u6280\u80fd\uff0c\u4f46\u9700\u4e25\u63a7\u53d8\u73b0\u9884\u671f\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176**\u5bb6\u5ead\u5e72\u9884\u9ad8\u98ce\u9669**\uff0c\u8865\u5145 **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\uff08C\u6a21\u5757\uff09\u3002\u63d0\u4f9b\u60c5\u611f\u652f\u6301\u548c\u65f6\u95f4\u7ba1\u7406\u5efa\u8bae\uff0c\u5e2e\u52a9\u5979\u5728\u5bb6\u5ead\u538b\u529b\u4e0b\u575a\u6301\u5b66\u4e60\u3002\n- **\u6838\u5fc3\u8bdd\u672f\u7b56\u7565**\uff1a\u5e94\u7528 **\u201c\u9006\u5411\u9884\u671f\u7ba1\u7406\u9632\u5fa1\u6cd5\u201d**\u3002\u660e\u786e\u544a\u77e5\u6280\u80fd\u79ef\u7d2f\u9700\u8981\u65f6\u95f4\uff0c\u5265\u79bb\u4e0d\u5207\u5b9e\u9645\u7684\u66b4\u5bcc\u5e7b\u60f3\uff0c\u7528\u201c\u5b89\u5168\u6210\u957f\u201d\u66ff\u4ee3\u201c\u5feb\u901f\u8d5a\u94b1\u201d\u4f5c\u4e3a\u6838\u5fc3\u4ef7\u503c\u70b9\u3002**\u4e25\u7981\u753b\u997c**\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5728\u7fa4\u5185\u6216\u6c9f\u901a\u4e2d\u8fc7\u5ea6\u5ba3\u626c\u201c\u5feb\u901f\u66b4\u5bcc\u201d\u6848\u4f8b\uff0c\u8fd9\u4f1a\u52a0\u5267\u5176\u5bb6\u5ead\u5185\u90e8\u77db\u76fe\u548c\u5bf9\u8bfe\u7a0b\u7684\u8d28\u7591\u3002\u907f\u514d\u4f7f\u7528\u9ad8\u538b\u903c\u5355\u8bdd\u672f\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u5bb6\u5ead\u77db\u76fe\u672a\u89e3\u51b3\u524d\u8fdb\u884c\u4efb\u4f55\u5347\u5355**\u3002\u5f53\u524d\u9636\u6bb5\u4ee5\u7a33\u5b9a\u5b66\u4e60\u548c\u5efa\u7acb\u4fe1\u4efb\u4e3a\u4e3b\u3002\u53ef\u5f15\u5bfc\u5b8c\u6210\u5c0f\u4f5c\u54c1\u83b7\u5f97\u6210\u5c31\u611f\uff0c\u4f46\u7edd\u53e3\u4e0d\u63d0\u66f4\u9ad8\u9636\u8bfe\u7a0b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u62d2\u63a5\u7684\u4e0d\u662f\u6211\uff01\u662f\u6211\u8001\u516c\uff01\u8ddf\u4ed6\u201d\uff08**\u5bb6\u5ead\u652f\u6301\u5ea6\u4f4e\u3001\u9690\u7792\u62a5\u540d**\uff09\n2. > \u201c\u6211\u81ea\u7531\u53d1\u6325\u8fd8\u6ca1\u5230\u8fd9\u4e2a\u7ea7\u522b[\u5077\u7b11]\u8fd8\u662f\u8ddf\u7740\u8001\u5e08\u6162\u6162\u6765\u5427\u201d\uff08**\u52a8\u673a\u4e2d\u7b49\uff0c\u6709\u5b66\u4e60\u610f\u613f\u4f46\u7f3a\u4e4f\u81ea\u4fe1**\uff09\n3. > \u201c\u6211\u8fd9\u4e00\u8282\u8bfe\u90fd\u6ca1\u542c\u5230\uff0c\u5b8c\u86cb\u4e86\uff0c\u6211\u8fd8\u662f\u8fdb\u53bb\u770b\u4e00\u4e0b\uff0c\u770b\u6709\u6ca1\u6709\u8865\u8865\u8865\u8bfe\u7684\u3002\u201d\uff08**\u6709\u8d23\u4efb\u5fc3\uff0c\u9047\u632b\u4f1a\u7126\u8651\u4f46\u613f\u610f\u8865\u6551\uff0c\u5fc3\u7406\u5f39\u6027\u4e2d\u7b49**\uff09\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4-\u5bb6\u5ead\u91cd\u8d1f\u62fc\u547d\u578b\u4e9a\u79cd\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u7f3a\u4e4f\u5bb6\u5ead\u652f\u6301\u7684\u73af\u5883\u4e2d\uff0c\u83b7\u5f97\u4e00\u4efd\u5b89\u5168\u611f\u548c\u81ea\u6211\u63d0\u5347\u7684\u53ef\u80fd\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u60c5\u611f\u6258\u5e95\uff08C\u6a21\u5757\uff09+ \u4e25\u683c\u6267\u884c\u9006\u5411\u9884\u671f\u7ba1\u7406\uff0c\u4e25\u9632\u5bb6\u5ead\u77db\u76fe\u7206\u53d1\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u8bba\uff08\u5bb6\u5ead\u91cd\u8d1f\u62fc\u547d\u578b\u4e9a\u79cd\uff09\", \"risk_level\": \"C2\u7c7b-\u9ad8\u5371\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168/\u793e\u4ea4\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\uff08A\u7ebf\uff09+ \u7597\u6108\u966a\u4f34\u8f85\u52a9\u5305\uff08C\u6a21\u5757\uff09\"}\n```";
