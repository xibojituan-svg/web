    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4ee5\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\u7684\u8eab\u4efd\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u6bb5\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5206\u6790\uff0c\u5e76\u8f93\u51fa\u5b8c\u6574\u62a5\u544a\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677163121 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e-\u68a6\u5883\uff08\u90d1\u5b87\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u4f53\u9a8c\u8425/\u6b63\u4ef7\u8bfe |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3** |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u5de5\u4f5c\u65e5\u767d\u5929\u4e0a\u73ed\u65e0\u6cd5\u4f7f\u7528\u624b\u673a/\u8033\u673a\uff0c\u4ec5\u4e2d\u5348\u67091\u5c0f\u65f6\uff0c\u665a\u4e0a\u53ef\u5b66\u4e60\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3** |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\uff08\u5b66\u4e60\u884c\u4e3a\u4e0e\u65f6\u95f4\u9650\u5236\u4fe1\u606f\u660e\u786e\uff0c\u4f46\u7f3a\u4e4f\u652f\u4ed8\u3001\u5bb6\u5ead\u3001\u6df1\u5c42\u52a8\u673a\u4fe1\u606f\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5b66\u4e60\u610f\u613f\u548c\u6267\u884c\u529b\uff08\u5b8c\u6210\u58f0\u97f3\u9274\u5b9a\u3001\u4ea4\u4f5c\u4e1a\u3001\u8865\u56de\u653e\uff09\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u5bf9\u6280\u672f\u539f\u7406\u7684\u6df1\u5ea6\u8ffd\u95ee\u6216\u5f3a\u70c8\u7684\u53d8\u73b0\u6e34\u671b\u3002\u5176\u6838\u5fc3\u5173\u6ce8\u70b9\u5728\u4e8e\u201c\u6d41\u7a0b\u5408\u89c4\u201d\uff08\u5982\u8bd5\u97f3\u8d44\u683c\u3001\u56de\u653e\u7533\u8bf7\uff09\uff0c\u52a8\u673a\u4ecb\u4e8e\u201c\u4e3a\u80fd\u529b\u800c\u6765\u201d\u548c\u201c\u517c\u804c\u53d8\u73b0\u201d\u4e4b\u95f4\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u53e3\u4ee4\u5927\u6982\u51e0\u70b9\u53d1\uff0c\u6211\u4e2d\u5348\u5c31\u7b97\u6234\u8033\u673a\u4e5f\u53ea\u6709\u4e00\u4e2a\u5c0f\u65f6\u65f6\u95f4\u201d\uff1b> \u201c\u8bd5\u97f3\u8d44\u683c\u4e00\u5b9a\u8981\u5168\u7a0b\u8ddf\u76f4\u64ad\u5417\u201d\uff1b> \u201c\u5f55\u4e66\uff0c\u753b\u672c\uff0c\u5bf9\u8f68\u201d\uff08\u5bf9\u5177\u4f53\u5de5\u79cd\u611f\u5174\u8da3\uff09\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u65e0\u76f8\u5173\u4fe1\u606f\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u2b07\u4f4e** \u2014 \u7528\u6237\u591a\u6b21\u5f3a\u8c03\u201c\u4e0a\u73ed\u4e0d\u80fd\u5e26\u624b\u673a\u548c\u8033\u673a\uff0c\u662f\u7279\u6b8a\u5de5\u4f5c\u201d\u3001\u201c\u4e2d\u5348\u53ea\u6709\u4e00\u4e2a\u5c0f\u65f6\u65f6\u95f4\u201d\u3001\u201c\u660e\u540e\u4e24\u5929\u5468\u672b\u8fd8\u662f\u9700\u8981\u4e0a\u73ed\u7684\u201d\u3002**\u65f6\u95f4\u6781\u5ea6\u788e\u7247\u5316\u4e14\u53d7\u5de5\u4f5c\u4e25\u683c\u9650\u5236**\uff0c\u662f\u660e\u663e\u7684\u77ed\u677f\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u65e0\u76f8\u5173\u4fe1\u606f\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u27a1\u4e2d**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a**\u3002\u7528\u6237\u9047\u5230\u64cd\u4f5c\u95ee\u9898\uff08\u94fe\u63a5\u6253\u4e0d\u5f00\uff09\u6216\u65f6\u95f4\u51b2\u7a81\u65f6\uff0c\u4f1a\u4e3b\u52a8\u3001\u7406\u6027\u5730\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff08\u201c\u590d\u5236\u5230\u6d4f\u89c8\u5668\u4e5f\u8fd8\u662f\u6253\u4e0d\u5f00\u201d\u3001\u201c\u6211\u9700\u8981\u4e00\u70b9\u65f6\u95f4\u201d\uff09\uff0c\u6ca1\u6709\u8868\u73b0\u51fa\u5d29\u6e83\u6216\u81ea\u6211\u5426\u5b9a\u3002\u4f46\u4f1a\u56e0\u6d41\u7a0b\u4e0d\u786e\u5b9a\u6027\uff08\u5982\u8d44\u683c\u3001\u798f\u5229\uff09\u4ea7\u751f\u7126\u8651\uff0c\u9700\u8981\u73ed\u4e3b\u4efb\u7684\u660e\u786e\u7b54\u590d\u548c\u5b89\u629a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u90a3\u6211\u8981\u662f\u9519\u8fc7\u53e3\u4ee4\u600e\u4e48\u529e[\u88c2\u5f00]\u201d\uff1b> \u201c\u4eca\u5929\u8fd8\u662f\u9700\u8981\u56de\u653e\u7684\uff0c\u8c22\u8c22\u5e08\u59d0[\u73ab\u7470][\u73ab\u7470]\u201d\uff08\u793c\u8c8c\u4f46\u575a\u6301\u8bc9\u6c42\uff09\uff1b> \u201c\u5b66\u59d0\uff0c\u6211\u8001\u662f\u89c9\u5f97\u6211\u6c14\u606f\u96be\u4ee5\u63a7\u5236\uff0c\u6709\u4ec0\u4e48\u529e\u6cd5\u5417\u201d\uff08\u4e3b\u52a8\u5bfb\u6c42\u6280\u672f\u6307\u5bfc\uff0c\u800c\u975e\u62b1\u6028\uff09\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 / \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u89c4\u5219\u548c\u8d44\u683c\u7684\u4e0d\u786e\u5b9a\u6027\u611f\u5230\u7126\u8651**\u3002\u7528\u6237\u7684\u6838\u5fc3\u75db\u70b9\u5e76\u975e\u6280\u672f\u672c\u8eab\uff0c\u800c\u662f\u201c\u6211\u80fd\u5426\u5408\u89c4\u5730\u83b7\u5f97\u8bd5\u97f3\u8d44\u683c\u201d\u3001\u201c\u6211\u7684\u7279\u6b8a\u60c5\u51b5\uff08\u4e0a\u73ed\uff09\u4f1a\u4e0d\u4f1a\u5f71\u54cd\u6743\u76ca\u201d\u3002\u8fd9\u53cd\u6620\u51fa\u5176\u5bf9\u201c\u7ecf\u6d4e\u4fdd\u969c\u201d\uff08\u517c\u804c\u673a\u4f1a\uff09\u548c\u201c\u793e\u7fa4\u5f52\u5c5e\u201d\uff08\u4e0d\u88ab\u89c4\u5219\u6392\u9664\u5728\u5916\uff09\u7684\u53cc\u91cd\u5b89\u5168\u9700\u6c42\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u63d0\u4f9b\u786e\u5b9a\u6027\u548c\u6d41\u7a0b\u4e0a\u7684\u201c\u7eff\u8272\u901a\u9053\u201d**\u3002\u660e\u786e\u544a\u77e5\u5176\u7279\u6b8a\u60c5\u51b5\u4e0b\u7684\u6743\u76ca\u4fdd\u969c\u8def\u5f84\uff08\u5982\u56de\u653e\u7533\u8bf7\u3001\u8d44\u683c\u4fdd\u7559\uff09\uff0c\u7528\u201c\u6211\u5e2e\u4f60\u5907\u6ce8\u201d\u3001\u201c\u6211\u7ed9\u4f60\u7559\u4e00\u4efd\u201d\u7b49\u8bdd\u8bed\u5efa\u7acb\u4fe1\u4efb\uff0c\u6d88\u9664\u5176\u56e0\u65f6\u95f4\u51b2\u7a81\u4ea7\u751f\u7684\u88ab\u5265\u593a\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1\u7c7b**\uff08\u5174\u8da3\u6d88\u8d39\u578b\uff0c\u4f46\u9700\u89c2\u5bdf\uff09 |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T5 \u597d\u73a9\u5c1d\u9c9c\u8005\uff08\u5174\u8da3\u805a\u7126\u53d8\u4f53\uff09** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\u3002\n\n**\u5224\u5b9a\u6811\u63a8\u6f14**\uff1a\n1.  **\u652f\u4ed8\u6838\u67e5**\uff1a\u65e0\u652f\u4ed8\u6570\u636e\uff0c\u8df3\u8fc7\u3002\n2.  **\u4e09\u8f74\u8bc4\u5206**\uff1a\u52a8\u673a\u7eaf\u5ea6\uff085-6\u5206\uff0c\u4e2d\uff09\u3001\u8d44\u6e90\u5e95\u5ea7\uff083-4\u5206\uff0c\u4f4e-\u65f6\u95f4\u77ed\u677f\uff09\u3001\u5fc3\u7406\u5f39\u6027\uff085-6\u5206\uff0c\u4e2d\uff09\u3002\n3.  **\u5224\u5b9a\u6811\u5339\u914d**\uff1a\u52a8\u673a\u7eaf\u5ea6\u22655\u5206\uff0c\u8fdb\u5165\u201c\u4e2d\u9ad8\u52a8\u673a\u7cbe\u5206\u201d\u3002\u5fc3\u7406\u5f39\u60275-6\u5206\uff0c\u8fdb\u5165\u201c\u4e2d\u7b49\u5f39\u6027\u901a\u9053\u201d\u3002\u7528\u6237\u53d1\u8a00\u805a\u7126\u4e8e\u201c\u7ea0\u6b63\u53d1\u97f3\u201d\u3001\u201c\u5f55\u4e66/\u753b\u672c/\u5bf9\u8f68\u201d\u7b49\u5177\u4f53\u5174\u8da3\u65b9\u5411\uff0c\u65e0\u660e\u786e\u53d8\u73b0\u8ffd\u95ee\uff0c\u8d44\u6e90\u5e95\u5ea75-7\u5206\uff08\u65f6\u95f4\u77ed\u677f\u62c9\u4f4e\u603b\u5206\uff0c\u4f46\u8ba4\u77e5\u548c\u64cd\u4f5c\u80fd\u529b\u6b63\u5e38\uff09\u3002**\u5339\u914d\u201c\u5174\u8da3\u805a\u7126\u578b\u89c2\u671b\u8005\u201d\u573a\u666f**\uff0c\u5224\u5b9a\u4e3a **T5 \u597d\u73a9\u5c1d\u9c9c\u8005\uff08\u5174\u8da3\u805a\u7126\u53d8\u4f53\uff09**\u3002\n4.  **ABCD\u6620\u5c04**\uff1aT5 \u2192 C1\u7c7b\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u65e0\u6cd5\u5224\u65ad\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u4e2d** | **\u56e0\u5de5\u4f5c\u5bfc\u81f4\u65e0\u6cd5\u5168\u7a0b\u53c2\u4e0e\u76f4\u64ad\u3001\u9519\u8fc7\u5173\u952e\u798f\u5229\u6216\u8d44\u683c\uff0c\u7d2f\u79ef\u7684\u632b\u8d25\u611f\u548c\u201c\u4e0d\u516c\u5e73\u611f\u201d\u53ef\u80fd\u5f15\u53d1\u9000\u8d39\u3002** |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u5c1a\u53ef\uff0c\u9047\u5230\u95ee\u9898\u4f1a\u4e3b\u52a8\u6c9f\u901a\u89e3\u51b3\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u5f53\u524d\u9636\u6bb5\u66f4\u5173\u6ce8\u5b66\u4e60\u8fc7\u7a0b\u548c\u8d44\u683c\u83b7\u53d6\uff0c\u800c\u975e\u7acb\u5373\u53d8\u73b0\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c\u4e00\u5468**\u3002\u5f53\u7528\u6237\u56e0\u5de5\u4f5c\u53cd\u590d\u9519\u8fc7\u76f4\u64ad\u5173\u952e\u4fe1\u606f\uff08\u5982\u798f\u5229\u3001\u4e13\u5c5e\u8d44\u6e90\uff09\uff0c\u800c\u73ed\u4e3b\u4efb\u672a\u80fd\u6709\u6548\u63d0\u4f9b\u66ff\u4ee3\u65b9\u6848\u6216\u660e\u786e\u4fdd\u969c\u65f6\uff0c\u6613\u4ea7\u751f\u201c\u88ab\u533a\u522b\u5bf9\u5f85\u201d\u7684\u5931\u843d\u611f\u800c\u9000\u51fa\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5a1f\u5a1c\uff0c\u770b\u5230\u4f60\u5de5\u4f5c\u8fd9\u4e48\u5fd9\u8fd8\u575a\u6301\u62bd\u65f6\u95f4\u5b66\u4e60\uff0c\u771f\u7684\u5f88\u4f69\u670d\u4f60\u7684\u6bc5\u529b\u3002\u522b\u62c5\u5fc3\u65f6\u95f4\u95ee\u9898\uff0c\u4f60\u7684\u7279\u6b8a\u60c5\u51b5\u6211\u5df2\u7ecf\u8bb0\u4e0b\u4e86\u3002\u54b1\u4eec\u7684\u76f4\u64ad\u56de\u653e\u548c\u5173\u952e\u6743\u76ca\uff08\u6bd4\u5982\u8bd5\u97f3\u8d44\u683c\uff09\u6211\u4f1a\u5355\u72ec\u5e2e\u4f60\u8ddf\u8fdb\u786e\u8ba4\uff0c\u4fdd\u8bc1\u4f60\u4e0d\u4f1a\u56e0\u4e3a\u4e0a\u73ed\u800c\u9519\u8fc7\u4efb\u4f55\u91cd\u8981\u7684\u4e1c\u897f\u3002\u4f60\u5c31\u6309\u81ea\u5df1\u7684\u8282\u594f\u6765\uff0c\u6709\u4efb\u4f55\u4e0d\u786e\u5b9a\u7684\u968f\u65f6\u95ee\u6211\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5174\u8da3\u6e38\u4e50\u7ebf\u3011**\u3002\u91cd\u70b9\u5f15\u5bfc\u5176\u5bf9\u201c\u5f55\u4e66\u3001\u753b\u672c\u3001\u5bf9\u8f68\u201d\u7684\u5174\u8da3\uff0c\u800c\u975e\u5f3a\u538b\u53d8\u73b0\u9884\u671f\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u77ed\u677f\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u6d41\u7a0b\u4fbf\u5229\u5305\u3011**\uff1a\u4e3b\u52a8\u3001\u63d0\u524d\u4e3a\u5176\u7533\u8bf7\u56de\u653e\u6743\u9650\uff0c\u660e\u786e\u544a\u77e5\u5176\u7279\u6b8a\u60c5\u51b5\u4e0b\u7684\u6743\u76ca\u4fdd\u969c\u8def\u5f84\uff0c\u7528\u201c\u4ee3\u529e\u201d\u548c\u201c\u9884\u7559\u201d\u6d88\u9664\u5176\u7126\u8651\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u540d\u989d\u6709\u9650\u201d\u3001\u201c\u5012\u8ba1\u65f6\u622a\u6b62\u201d\u7b49\u5236\u9020\u7a00\u7f3a\u611f\u7684\u8bdd\u672f\u903c\u5355\u3002\u8fd9\u4f1a\u52a0\u5267\u5176\u56e0\u65f6\u95f4\u65e0\u6cd5\u81ea\u7531\u652f\u914d\u800c\u4ea7\u751f\u7684\u7126\u8651\u548c\u9006\u53cd\u5fc3\u7406\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u4f53\u9a8c\u8425\u671f\u95f4\u8fdb\u884c\u9ad8\u538b\u5347\u5355**\u3002\u5e94\u5148\u901a\u8fc7\u63d0\u4f9b\u201c\u6d41\u7a0b\u4fbf\u5229\u201d\u5efa\u7acb\u6df1\u5ea6\u4fe1\u4efb\uff0c\u5f85\u5176\u8fdb\u5165\u6b63\u4ef7\u73ed\u3001\u65f6\u95f4\u66f4\u81ea\u7531\u540e\uff0c\u518d\u6839\u636e\u5b66\u4e60\u6210\u679c\u8c28\u614e\u63a8\u8350\u8fdb\u9636\u8bfe\u7a0b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u6211\u4e2d\u5348\u5c31\u7b97\u6234\u8033\u673a\u4e5f\u53ea\u6709\u4e00\u4e2a\u5c0f\u65f6\u65f6\u95f4**\u201d \u2014\u2014 **\u8d44\u6e90\u5e95\u5ea7\uff08\u65f6\u95f4\uff09\u77ed\u677f\u7684\u6838\u5fc3\u8bc1\u636e**\u3002\n2. > \u201c**\u8bd5\u97f3\u8d44\u683c\u4e00\u5b9a\u8981\u5168\u7a0b\u8ddf\u76f4\u64ad\u5417**\u201d \u2014\u2014 **\u5bf9\u89c4\u5219\u548c\u8d44\u683c\u5b89\u5168\u611f\u7684\u7126\u8651\uff0c\u662f\u6838\u5fc3\u9700\u6c42\u70b9**\u3002\n3. > \u201c**\u5f55\u4e66\uff0c\u753b\u672c\uff0c\u5bf9\u8f68**\u201d \u2014\u2014 **\u5174\u8da3\u5177\u4f53\u3001\u805a\u7126\uff0c\u800c\u975e\u6cdb\u6cdb\u7684\u201c\u8d5a\u94b1\u201d\uff0c\u5c5e\u4e8eT5\u5174\u8da3\u9a71\u52a8\u7279\u5f81**\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T5 \u5174\u8da3\u805a\u7126\u578b\u89c2\u671b\u8005\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u6709\u9650\u65f6\u95f4\u5185\uff0c\u5b89\u5168\u3001\u5408\u89c4\u5730\u63a2\u7d22\u548c\u4f53\u9a8c\u6709\u58f0\u6f14\u64ad\u7684\u4e50\u8da3\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u73ed\u4e3b\u4efb\u4e3b\u52a8\u63d0\u4f9b\u201c\u6d41\u7a0b\u4fbf\u5229\u201d\u548c\u201c\u8d44\u683c\u4fdd\u969c\u201d\uff0c\u6d88\u9664\u5176\u56e0\u5de5\u4f5c\u65f6\u95f4\u51b2\u7a81\u4ea7\u751f\u7684\u88ab\u5265\u593a\u611f\u548c\u7126\u8651\u3011**\u3002\n\n```json\n{\"core_type\": \"T5 \u597d\u73a9\u5c1d\u9c9c\u8005\uff08\u5174\u8da3\u805a\u7126\u53d8\u4f53\uff09\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168/\u793e\u4ea4\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf+\u6d41\u7a0b\u4fbf\u5229\u5305\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u5973\uff08\u63a8\u6d4b\uff09\", \"city\": \"\u672a\u77e5\"}\n```";
