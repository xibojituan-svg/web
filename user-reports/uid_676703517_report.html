    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**  \n**\u7f3a\u5931\u4fe1\u606f\u7ef4\u5ea6**\uff1a\u652f\u4ed8\u8bb0\u5f55\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u804c\u4e1a/\u6536\u5165\u3001\u5b66\u4e60\u76ee\u6807\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u3001\u5bf9\u8bfe\u7a0b\u4ef7\u683c/\u4ef7\u503c\u7684\u76f4\u63a5\u8ba8\u8bba\u3001\u660e\u786e\u7684\u8d1f\u9762\u60c5\u7eea\u6216\u6295\u8bc9\u3002\n\n---\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n\n### \u52a8\u673a\u7eaf\u5ea6\n*   **\u5b66\u4e60\u6295\u5165**\uff1a\u9ad8\u3002\u79ef\u6781\u53c2\u4e0e\u73ed\u7ea7\u6d3b\u52a8\uff08\u6709\u58f0\u4e4b\u591c\u7ec4\u961f\u3001Pia\u620f\uff09\u3001\u4e3b\u52a8\u7ec4\u7ec7\u534f\u8c03\uff08\u53d1\u8d77\u63a5\u9f99\u3001\u5236\u4f5c\u6210\u5458\u8868\u3001\u50ac\u4fc3\u586b\u8868\uff09\u3001\u63d0\u9192\u540c\u5b66\u4e0a\u8bfe\u3001\u4e3b\u52a8\u8be2\u95ee\u6280\u672f\u95ee\u9898\uff08AU\u8bbe\u7f6e\u3001\u8bbe\u5907\u5207\u6362\uff09\u3002\n*   **\u793e\u4ea4\u9a71\u52a8**\uff1a\u5f3a\u3002\u5728\u7fa4\u5185\u9ad8\u5ea6\u6d3b\u8dc3\uff0c\u4e3b\u52a8@\u591a\u4eba\u4e92\u52a8\uff0c\u8868\u73b0\u51fa\u660e\u663e\u7684\u793e\u7fa4\u5f52\u5c5e\u611f\u548c\u7ec4\u7ec7\u610f\u613f\u3002\n*   **\u53d8\u73b0/\u804c\u4e1a\u76ee\u6807**\uff1a**\u672a\u63d0\u53ca**\u3002\u804a\u5929\u8bb0\u5f55\u96c6\u4e2d\u4e8e\u8bfe\u7a0b\u5185\u7684\u7ec3\u4e60\u3001\u6d3b\u52a8\u548c\u793e\u4ea4\uff0c\u672a\u8ba8\u8bba\u63a5\u5355\u3001\u53d8\u73b0\u3001\u804c\u4e1a\u89c4\u5212\u7b49\u5916\u90e8\u76ee\u6807\u3002\n*   **\u4fe1\u53f7\u8bc4\u4f30**\uff1a**\u5174\u8da3\u9a71\u52a8 & \u793e\u7fa4\u9a71\u52a8**\u3002\u5b66\u4e60\u884c\u4e3a\u79ef\u6781\uff0c\u4f46\u52a8\u673a\u66f4\u504f\u5411\u4e8e\u8bfe\u7a0b\u5185\u7684\u6c89\u6d78\u4f53\u9a8c\u548c\u793e\u7fa4\u4e92\u52a8\uff0c\u800c\u975e\u660e\u786e\u7684\u804c\u4e1a\u7ed3\u679c\u5bfc\u5411\u3002**\u7eaf\u5ea6\u4e2d\u7b49**\uff0c\u5b58\u5728\u56e0\u793e\u4ea4\u4e50\u8da3\u800c\u6301\u7eed\u53c2\u4e0e\u7684\u53ef\u80fd\u3002\n\n### \u8d44\u6e90\u5e95\u5ea7\n*   **\u65f6\u95f4/\u7cbe\u529b**\uff1a\u5145\u8db3\u3002\u5168\u5929\u5019\uff08\u65e9\u3001\u4e2d\u3001\u665a\uff09\u5728\u7fa4\u5185\u6d3b\u8dc3\uff0c\u80fd\u6295\u5165\u65f6\u95f4\u7ec4\u7ec7\u6d3b\u52a8\u3001\u89e3\u51b3\u6280\u672f\u95ee\u9898\u3001\u53c2\u4e0e\u665a\u95f4Pia\u620f\u3002\n*   **\u8bbe\u5907/\u73af\u5883**\uff1a**\u5b58\u5728\u660e\u786e\u77ed\u677f**\u3002\u62e5\u6709\u4e13\u4e1a\u9ea6\u514b\u98ce\uff08X3-B\uff09\uff0c\u4f46\u5f55\u97f3\u73af\u5883\u5608\u6742\uff08\u5bb6\u4eba\u5e72\u6270\u3001\u8857\u8fb9\u566a\u97f3\u3001\u540c\u5c4b\u7535\u8111\u58f0\uff09\uff0c\u9700\u989d\u5916\u8d2d\u4e70\u9694\u97f3\u8bbe\u5907\uff08\u767e\u5143\u7ea7\u9694\u97f3\u7bb1\uff09\u3002\u5b58\u5728AU\u8f6f\u4ef6\u4e0e\u8bbe\u5907\u9a71\u52a8\u51b2\u7a81\u7684\u6280\u672f\u95ee\u9898\u3002\n*   **\u7ecf\u6d4e\u57fa\u7840**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u4ec5\u63d0\u53ca\u201c\u65a5\u5de8\u8d44\u201d\u8d2d\u4e70\u767e\u5143\u9694\u97f3\u7bb1\uff0c\u8bed\u6c14\u620f\u8c11\uff0c\u65e0\u6cd5\u5224\u65ad\u771f\u5b9e\u7ecf\u6d4e\u627f\u53d7\u529b\u4e0e\u8bfe\u7a0b\u4ef7\u683c\u7684\u5339\u914d\u5ea6\u3002\n*   **\u6280\u80fd\u57fa\u7840**\uff1a**\u5b58\u5728\u632b\u8d25\u611f**\u3002\u81ea\u8ff0\u65c1\u767d\u5ff5\u4e0d\u597d\u3001\u88ab\u5bb6\u4eba\u6279\u8bc4\u8282\u594f\u6709\u95ee\u9898\u5bfc\u81f4\u201c\u5e72\u81ea\u95ed\u201d\uff0c\u8868\u660e\u5904\u4e8e\u6280\u80fd\u521d\u5b66\u9636\u6bb5\u7684\u8ff7\u832b\u671f\u3002\n*   **\u4fe1\u53f7\u8bc4\u4f30**\uff1a**\u65f6\u95f4\u5145\u88d5\uff0c\u4f46\u8bbe\u5907\u73af\u5883\u4e0e\u6280\u80fd\u57fa\u7840\u5b58\u5728\u6311\u6218**\u3002\u5b66\u4e60\u70ed\u60c5\u53ef\u80fd\u88ab\u7cdf\u7cd5\u7684\u5f55\u97f3\u73af\u5883\u548c\u521d\u671f\u7684\u6280\u80fd\u632b\u8d25\u611f\u6d88\u8017\u3002\n\n### \u5fc3\u7406\u5f39\u6027\n*   **\u632b\u6298\u53cd\u5e94**\uff1a**\u5916\u5f52\u56e0\u503e\u5411**\u3002\u5c06\u5f55\u97f3\u95ee\u9898\u90e8\u5206\u5f52\u56e0\u4e8e\u5916\u90e8\u73af\u5883\uff08\u5bb6\u4eba\u8d1f\u9762\u8bc4\u4ef7\u3001\u73af\u5883\u566a\u97f3\uff09\uff0c\u5e76\u901a\u8fc7\u8d2d\u4e70\u8bbe\u5907\uff08\u9694\u97f3\u7bb1\uff09\u5bfb\u6c42\u5916\u90e8\u89e3\u51b3\u65b9\u6848\u3002\u4f46\u4e5f\u80fd\u63a5\u53d7\u540c\u5b66\u5b89\u6170\uff0c\u81ea\u6211\u8c03\u8282\uff08\u201c\u4e00\u8fb9\u9f13\u52b1\u81ea\u5df1\u4e00\u8fb9\u6000\u7591\u81ea\u5df1\u201d\uff09\u3002\n*   **\u4e3b\u52a8\u6027**\uff1a\u6781\u9ad8\u3002\u662f\u73ed\u7ea7\u6d3b\u52a8\u7684\u6838\u5fc3\u7ec4\u7ec7\u8005\uff08\u7ec4\u961f\u3001\u5236\u8868\u3001\u53d1\u8d77Pia\u620f\uff09\u3001\u95ee\u9898\u89e3\u51b3\u8005\uff08\u4e3b\u52a8\u8be2\u95ee\u73ed\u73ed\u6280\u672f\u95ee\u9898\uff09\u3001\u6c1b\u56f4\u5e26\u52a8\u8005\u3002\n*   **\u652f\u6301\u7cfb\u7edf**\uff1a\u5f3a\u3002\u79ef\u6781\u5728\u540c\u5b66\u4e2d\u5bfb\u6c42\u5e76\u7ed9\u4e88\u60c5\u611f\u652f\u6301\uff08\u201c\u6709\u4f60\u4eec\u7684\u5b89\u6170\u6211\u53c8\u884c\u4e86\u201d\uff09\uff0c\u4e0e\u73ed\u73ed\u548c\u540c\u5b66\u4e92\u52a8\u9891\u7e41\u3002\n*   **\u4fe1\u53f7\u8bc4\u4f30**\uff1a**\u9ad8\u4e3b\u52a8\u6027 & \u4e2d\u7b49\u504f\u8106\u5f31\u7684\u6297\u632b\u529b**\u3002\u884c\u52a8\u529b\u5f3a\uff0c\u4e50\u4e8e\u4e92\u52a9\uff0c\u4f46\u5bf9\u8d1f\u9762\u8bc4\u4ef7\u654f\u611f\uff0c\u6613\u53d7\u5916\u754c\u53cd\u9988\u5f71\u54cd\u60c5\u7eea\uff0c**\u5b58\u5728\u56e0\u6301\u7eed\u53d7\u632b\uff08\u6280\u80fd\u8fdb\u6b65\u6162\u3001\u73af\u5883\u5e72\u6270\uff09\u800c\u653e\u5f03\u7684\u98ce\u9669**\u3002\n\n---\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**\uff1a**\u65e0\u6cd5\u5224\u65ad**\u3002\u8bb0\u5f55\u4e2d\u65e0\u4efb\u4f55\u5173\u4e8e\u652f\u4ed8\u3001\u8ba2\u5355\u3001\u4ef7\u683c\u654f\u611f\u5ea6\u7684\u4fe1\u606f\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u5b58\u5728\u98ce\u9669\u4fe1\u53f7**\u3002\u8bb0\u5f55\u663e\u793a\u5bb6\u4eba\u5bf9\u5176\u5b66\u4e60\u884c\u4e3a\u6709\u8d1f\u9762\u8bc4\u4ef7\uff08\u201c\u8bf4\u6211\u4e0d\u4f1a\u597d\u597d\u8bf4\u8bdd\u201d\uff09\uff0c\u5e76\u5df2\u5bf9\u5176\u9020\u6210\u60c5\u7eea\u5e72\u6270\u3002**\u867d\u672a\u76f4\u63a5\u53cd\u5bf9\u4ed8\u8d39\uff0c\u4f46\u5bb6\u5ead\u652f\u6301\u5ea6\u5b58\u7591**\uff0c\u53ef\u80fd\u5f71\u54cd\u5176\u957f\u671f\u5b66\u4e60\u7684\u7a33\u5b9a\u6027\u3002\n*   **\u6838\u5fc3\u5224\u5b9a**\uff1a\n    *   **A\u8f74\uff08\u52a8\u673a\uff09**\uff1aB+\uff08\u9ad8\u53c2\u4e0e\uff0c\u4f46\u76ee\u6807\u5185\u5316\uff0c\u7f3a\u4e4f\u5916\u663e\u804c\u4e1a\u52a8\u673a\uff09\u3002\n    *   **B\u8f74\uff08\u8d44\u6e90\uff09**\uff1aC\uff08\u65f6\u95f4\u8db3\uff0c\u4f46\u73af\u5883\u4e0e\u6280\u80fd\u57fa\u7840\u6709\u660e\u663e\u77ed\u677f\uff09\u3002\n    *   **C\u8f74\uff08\u5f39\u6027\uff09**\uff1aB\uff08\u9ad8\u4e3b\u52a8\uff0c\u4f46\u6297\u632b\u529b\u4e00\u822c\uff0c\u4f9d\u8d56\u5916\u90e8\u652f\u6301\uff09\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**\uff1a**B-C\u578b\u7528\u6237**\u3002\u9ad8\u53c2\u4e0e\u3001\u9ad8\u793e\u4ea4\u9a71\u52a8\u7684\u201c\u73ed\u7ea7\u6d3b\u8dc3\u5206\u5b50\u201d\uff0c\u4f46\u5b66\u4e60\u6839\u57fa\uff08\u6280\u80fd\u3001\u73af\u5883\uff09\u4e0d\u7262\uff0c\u4e14\u6613\u53d7\u5916\u754c\u8d1f\u9762\u53cd\u9988\u5f71\u54cd\u3002\n\n---\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n\n**T4 \u793e\u7fa4\u4f9d\u8d56\u578b\u4f53\u9a8c\u8005**\n*   **\u6838\u5fc3\u7279\u5f81**\uff1a\u5b66\u4e60\u52a8\u529b\u4e0e\u73ed\u7ea7\u793e\u7fa4\u7ed1\u5b9a\u7d27\u5bc6\uff0c\u4eab\u53d7\u7ec4\u7ec7\u3001\u4e92\u52a8\u3001\u88ab\u9700\u8981\u7684\u8fc7\u7a0b\u3002\u5b66\u4e60\u662f\u83b7\u5f97\u793e\u4ea4\u8ba4\u540c\u548c\u7fa4\u4f53\u5f52\u5c5e\u611f\u7684\u9014\u5f84\u3002\n*   **\u5339\u914d\u70b9**\uff1a\n    1.  \u6781\u5f3a\u7684\u73ed\u7ea7\u6d3b\u52a8\u7ec4\u7ec7\u4e0e\u53f7\u53ec\u529b\uff08\u7ec4\u961f\u3001\u63a5\u9f99\u3001\u5236\u8868\u3001\u53d1\u8d77Pia\u620f\uff09\u3002\n    2.  \u9ad8\u9891\u7684\u793e\u7fa4\u4e92\u52a8\u4e0e\u60c5\u611f\u652f\u6301\u4ea4\u6362\u3002\n    3.  \u5b66\u4e60\u95ee\u9898\uff08\u5982\u8bbe\u5907\u8bbe\u7f6e\uff09\u503e\u5411\u4e8e\u516c\u5f00\u5728\u7fa4\u5185\u8be2\u95ee\uff0c\u800c\u975e\u79c1\u4e0b\u89e3\u51b3\u3002\n    4.  \u5bf9\u5b66\u4e60\u672c\u8eab\u7684\u632b\u8d25\u611f\uff08\u5982\u65c1\u767d\u5ff5\u4e0d\u597d\uff09\u53ef\u901a\u8fc7\u793e\u7fa4\u5b89\u6170\u5f97\u5230\u7f13\u89e3\u3002\n*   **\u504f\u5dee\u70b9**\uff1a\u539f\u578b\u901a\u5e38\u5bf9\u5b66\u4e60\u7ed3\u679c\u8981\u6c42\u4e0d\u9ad8\uff0c\u4f46\u8be5\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6280\u80fd\u8fdb\u6b65\u7684\u7126\u8651\u548c\u53d7\u632b\u611f\uff0c\u6bd4\u5178\u578bT4\u66f4\u5728\u610f\u5b66\u4e60\u6548\u679c\u3002\n\n---\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n\n| \u9000\u8d39\u6839\u56e0 | \u98ce\u9669\u7b49\u7ea7 | \u5173\u952e\u8bc1\u636e |\n| :--- | :--- | :--- |\n| **1. \u6548\u679c\u4e0d\u53ca\u9884\u671f** | **\u4e2d** | \u5df2\u51fa\u73b0\u6280\u80fd\u7126\u8651\uff08\u201c\u65c1\u767d\u5ff5\u4e0d\u597d\u201d\uff09\u3001\u88ab\u5bb6\u4eba\u8d1f\u9762\u8bc4\u4ef7\u6253\u51fb\u3002\u82e5\u957f\u671f\u65e0\u8fdb\u6b65\uff0c\u98ce\u9669\u5347\u9ad8\u3002 |\n| **2. \u65f6\u95f4\u65e0\u6cd5\u4fdd\u969c** | **\u4f4e** | \u5f53\u524d\u65f6\u95f4\u6295\u5165\u5ea6\u9ad8\uff0c\u8bb0\u5f55\u4e2d\u65e0\u65f6\u95f4\u51b2\u7a81\u8ff9\u8c61\u3002 |\n| **3. \u7ecf\u6d4e\u538b\u529b** | **\u672a\u77e5** | \u65e0\u76f8\u5173\u4fe1\u606f\u3002 |\n| **4. \u5bb6\u5ead\u53cd\u5bf9** | **\u4e2d** | **\u3010\u5173\u952e\u96f7\u533a\u3011** \u5df2\u8bb0\u5f55\u5230\u5bb6\u4eba\u7684\u76f4\u63a5\u8d1f\u9762\u5e72\u9884\uff08\u201c\u8bf4\u6211\u4e0d\u4f1a\u597d\u597d\u8bf4\u8bdd\u201d\uff09\uff0c\u5e76\u5f71\u54cd\u7528\u6237\u60c5\u7eea\u3002\u662f\u6f5c\u5728\u9000\u8d39\u89e6\u53d1\u70b9\u3002 |\n| **5. \u670d\u52a1\u4f53\u9a8c\u5dee** | **\u4f4e** | \u4e0e\u73ed\u73ed\u4e92\u52a8\u987a\u7545\uff0c\u79ef\u6781\u5bfb\u6c42\u5e76\u63a5\u53d7\u5e2e\u52a9\uff0c\u672a\u62b1\u6028\u670d\u52a1\u3002 |\n| **6. \u8bfe\u7a0b\u4e0d\u7b26\u9700\u6c42** | **\u4f4e** | \u9ad8\u5ea6\u53c2\u4e0e\u8bfe\u7a0b\u5185\u6240\u6709\u73af\u8282\uff0c\u672a\u8868\u73b0\u51fa\u5185\u5bb9\u4e0d\u6ee1\u3002 |\n| **7. \u7ade\u54c1/\u66ff\u4ee3\u65b9\u6848** | **\u4f4e** | \u672a\u63d0\u53ca\u3002 |\n| **\u7efc\u5408\u9000\u8d39\u98ce\u9669** | **\u4e2d** | \u98ce\u9669\u4e3b\u8981\u6765\u81ea**\u6280\u80fd\u8fdb\u6b65\u7f13\u6162\u5e26\u6765\u7684\u632b\u8d25\u611f**\u4ee5\u53ca**\u5bb6\u5ead\u652f\u6301\u7f3a\u5931\u7684\u6f5c\u5728\u538b\u529b**\u3002 |\n\n---\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n\n*   **\u8fc7\u5ea6\u627f\u8bfa**\uff1a\u65e0\u8bb0\u5f55\u3002\n*   **\u5236\u9020\u7126\u8651**\uff1a\u65e0\u8bb0\u5f55\u3002\n*   **\u865a\u5047\u5ba3\u4f20**\uff1a\u65e0\u8bb0\u5f55\u3002\n*   **\u5bb6\u5ead\u5173\u7cfb**\uff1a**\u9700\u5173\u6ce8**\u3002\u9500\u552e/\u73ed\u73ed\u5df2\u77e5\u7528\u6237\u9762\u4e34\u5bb6\u4eba\u8d1f\u9762\u8bc4\u4ef7\uff0c\u540e\u7eed\u6c9f\u901a\u5e94\u907f\u514d\u5f3a\u5316\u5176\u5bb6\u5ead\u77db\u76fe\uff0c\u53ef\u5f15\u5bfc\u5176\u6b63\u5411\u6c9f\u901a\u6216\u5bfb\u627e\u72ec\u7acb\u5b66\u4e60\u7a7a\u95f4\u3002\n*   **\u5408\u89c4\u8bc4\u4f30**\uff1a\u5f53\u524d\u8bb0\u5f55\u672a\u53d1\u73b0\u9500\u552e\u7aef\u8fdd\u89c4\u884c\u4e3a\u3002\u7528\u6237\u95ee\u9898\u591a\u96c6\u4e2d\u4e8e\u5b66\u4e60\u6280\u672f\u4e0e\u6d3b\u52a8\u53c2\u4e0e\u3002\n\n---\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n\n*   **\u4ea7\u54c1\u5339\u914d**\uff1a**\u5339\u914d**\u3002\u7528\u6237\u6df1\u5ea6\u53c2\u4e0e\u8bfe\u7a0b\u8bbe\u8ba1\u7684\u793e\u7fa4\u4e0e\u6d3b\u52a8\u73af\u8282\uff0c\u662f\u73ed\u7ea7\u6c1b\u56f4\u7684\u201c\u50ac\u5316\u5242\u201d\u3002\u4ea7\u54c1\u63d0\u4f9b\u7684\u7ec4\u961f\u3001Pia\u620f\u3001\u4f5c\u4e1a\u70b9\u8bc4\u7b49\u673a\u5236\u4e0e\u5176\u9700\u6c42\u9ad8\u5ea6\u5951\u5408\u3002\n*   **\u6838\u5fc3\u98ce\u9669**\uff1a\u6280\u80fd\u6210\u957f\u74f6\u9888\u4e0e\u5bb6\u5ead\u8d1f\u9762\u73af\u5883\u53ef\u80fd\u4fb5\u8680\u5176\u793e\u4ea4\u70ed\u60c5\uff0c\u5bfc\u81f4\u6d41\u5931\u3002\n*   **\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9996\u5468\u5f3a\u5316\u6280\u672f\u8d4b\u80fd\u4e0e\u5fae\u5c0f\u6b63\u53cd\u9988**\uff1a\u9488\u5bf9\u5176\u8bbe\u5907\u3001AU\u4f7f\u7528\u95ee\u9898\uff0c\u63d0\u4f9b**\u4e00\u5bf9\u4e00\u3001\u624b\u628a\u624b\u7684\u89e3\u51b3\u65b9\u6848**\uff0c\u5e2e\u52a9\u5176\u5feb\u901f\u83b7\u5f97\u201c\u6211\u80fd\u641e\u5b9a\u201d\u7684\u6280\u672f\u638c\u63a7\u611f\u3002\u5728\u5176\u63d0\u4ea4\u7684\u4f5c\u4e1a\u6216Pia\u620f\u8868\u73b0\u4e2d\uff0c\u5bfb\u627e\u4eae\u70b9\u7ed9\u4e88\u5177\u4f53\u3001\u516c\u5f00\u7684\u8868\u626c\uff0c\u5bf9\u51b2\u5bb6\u5ead\u8d1f\u9762\u8bc4\u4ef7\u3002\n    2.  **\u8d4b\u4e88\u5b98\u65b9\u7ec4\u7ec7\u89d2\u8272\uff0c\u7ed1\u5b9a\u793e\u7fa4\u5173\u7cfb**\uff1a\u53ef\u5c06\u5176\u4efb\u547d\u4e3a\u201c\u5c0f\u7ec4\u957f\u201d\u3001\u201c\u6d3b\u52a8\u59d4\u5458\u201d\u7b49\u534a\u5b98\u65b9\u89d2\u8272\uff0c\u5c06\u5176\u81ea\u53d1\u7ec4\u7ec7\u884c\u4e3a\u201c\u6b63\u5f0f\u5316\u201d\uff0c\u589e\u5f3a\u5176\u5f52\u5c5e\u611f\u4e0e\u8d23\u4efb\u611f\u3002\n    3.  **\u9884\u9632\u6027\u6c9f\u901a\u5bb6\u5ead\u652f\u6301\u8bae\u9898**\uff1a\u79c1\u4e0b\u6c9f\u901a\uff0c\u59d4\u5a49\u8be2\u95ee\u5bb6\u5ead\u5bf9\u5176\u5b66\u4e60\u7684\u770b\u6cd5\uff0c\u63d0\u4f9b\u201c\u5982\u4f55\u4e0e\u5bb6\u4eba\u6c9f\u901a\u5b66\u4e60\u4ef7\u503c\u201d\u7684\u8bdd\u672f\u5efa\u8bae\uff0c\u6216\u9f13\u52b1\u5176\u8bbe\u5b9a\u56fa\u5b9a\u7684\u3001\u4e0d\u53d7\u6253\u6270\u7684\u5b66\u4e60\u65f6\u6bb5\u3002\n    4.  **\u5f15\u5bfc\u8bbe\u5b9a\u5408\u7406\u7684\u9636\u6bb5\u76ee\u6807**\uff1a\u5e2e\u52a9\u5176\u5c06\u201c\u5ff5\u597d\u65c1\u767d\u201d\u7684\u5927\u76ee\u6807\uff0c\u62c6\u89e3\u4e3a\u201c\u672c\u5468\u91cd\u70b9\u7ec3\u4e60\u505c\u8fde\u201d\u7b49\u5c0f\u76ee\u6807\uff0c\u7ba1\u7406\u5176\u5bf9\u5b66\u4e60\u901f\u5ea6\u7684\u9884\u671f\uff0c\u51cf\u5c11\u632b\u8d25\u611f\u3002\n\n{\"core_type\": \"T4 \u793e\u7fa4\u4f9d\u8d56\u578b\u4f53\u9a8c\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u5f3a\u5316\u6280\u672f\u8d4b\u80fd\uff0c\u8d4b\u4e88\u7ec4\u7ec7\u89d2\u8272\"}";
