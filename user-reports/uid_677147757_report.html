    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a**\u9ad8**\u3002\u7528\u6237\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u5b66\u4e60\u610f\u613f\u548c\u804c\u4e1a\u53d1\u5c55\u5174\u8da3\uff08\u201c\u6211\u662f\u771f\u60f3\u5728\u8fd9\u4e2a\u8d5b\u9053\u597d\u597d\u5b66\u4e60\u53d1\u5c55\u7684\u201d\uff09\uff0c\u5bf9\u884c\u4e1a\u5168\u6d41\u7a0b\uff08\u5f55\u5236\u3001\u753b\u672c\u3001\u5bf9\u8f68\u3001\u5ba1\u542c\u3001\u7ec8\u5ba1\uff09\u548c\u5b9e\u5730\u5b66\u4e60\uff08\u201c\u53bb\u516c\u53f8\u73b0\u573a\u5b66\u4e60\u201d\uff09\u6709\u660e\u786e\u63a2\u7d22\u6b32\uff0c\u5e76\u63d0\u53ca\u8fc7\u5f80\u97f3\u9891/\u89c6\u9891\u526a\u8f91\u7ecf\u9a8c\uff0c\u663e\u793a\u5185\u5728\u9a71\u52a8\u8f83\u5f3a\u3002**\u4f46\u9700\u6ce8\u610f**\uff0c\u5176\u52a8\u673a\u4e0e\u201c\u53d8\u73b0\u201d\u3001\u201c\u517c\u804c\u201d\u3001\u201c\u8d5a\u94b1\u201d\u7b49\u5916\u90e8\u6fc0\u52b1\u9ad8\u5ea6\u7ed1\u5b9a\uff08\u201c\u5e0c\u671b\u80fd\u6709\u673a\u4f1a\u5c3d\u5feb\u4f53\u9a8c\u5404\u4e2a\u73af\u8282\uff0c\u719f\u6089\u4e1a\u52a1\u6d41\u7a0b\uff0c\u7531\u751f\u624b\u53d8\u6210\u719f\u624b\u201d\uff09\uff0c\u5b58\u5728**\u53d8\u73b0\u9884\u671f\u8fc7\u9ad8**\u7684\u98ce\u9669\u4fe1\u53f7\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4e2d\u7b49**\u3002\u7528\u6237\u5177\u5907\u4e00\u5b9a\u7684\u97f3\u9891/\u89c6\u9891\u526a\u8f91\u57fa\u7840\uff08GoldWave\u3001\u526a\u6620\uff09\uff0c\u5b66\u4e60\u65f6\u95f4\u6295\u5165\u5ea6\u9ad8\uff08\u201c\u5168\u7a0b\u8ba4\u771f\u89c2\u770b\uff0c\u8fde\u4e2d\u5348\u996d\u90fd\u6ca1\u5403\u201d\uff09\uff0c\u884c\u52a8\u529b\u5f3a\uff08\u6309\u65f6\u5b8c\u6210\u6240\u6709\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\uff09\u3002**\u5173\u952e\u4fe1\u606f\u7f3a\u5931**\uff1a\u672a\u63d0\u53ca\u4e2a\u4eba\u7ecf\u6d4e\u72b6\u51b5\u3001\u804c\u4e1a\u80cc\u666f\u3001\u6bcf\u65e5\u53ef\u6295\u5165\u5b66\u4e60\u65f6\u957f\u7b49\u5173\u952e\u8d44\u6e90\u4fe1\u606f\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a**\u9ad8**\u3002\u7528\u6237\u4e92\u52a8\u79ef\u6781\u3001\u914d\u5408\u5ea6\u9ad8\uff08\u201c\u4e00\u5207\u542c\u4ece\u7c7d\u83f2\u8001\u5e08\u7684\u5b89\u6392\u201d\uff09\uff0c\u5bf9\u4f5c\u4e1a\u53cd\u9988\u548c\u6311\u6218\uff08\u201c\u4f5c\u4e1a\u96be\u5ea6\u8fd8\u597d\u5566\u201d\uff09\u6001\u5ea6\u6b63\u9762\uff0c\u80fd\u4e3b\u52a8\u8868\u8fbe\u5b66\u4e60\u70ed\u60c5\u548c\u611f\u8c22\uff08\u201c\u8ddf\u7740\u7c7d\u83f2\u8001\u5e08\u5b66\u4e60\u4e00\u5929\u5929\u90fd\u5728\u98de\u901f\u8fdb\u6b65\u5462\u201d\uff09\u3002\u4f46\u5728\u4ed8\u8d39\u540e\u5bf9\u8bfe\u7a0b\u7b49\u7ea7\uff08LV7\uff09\u548c\u53d8\u73b0\u6a21\u5f0f\uff08\u201c\u65e0\u5e95\u85aa\u7684\u600e\u4e48\u8d5a\u94b1\u201d\uff09\u4ea7\u751f\u7591\u8651\uff0c\u663e\u793a\u51fa\u4e00\u5b9a\u7684**\u7ed3\u679c\u5bfc\u5411\u7126\u8651**\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u6267\u884c\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a**\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u4e8e4\u67088\u65e5\u652f\u4ed8\u9ad8\u9636\u73ed\u8d39\u7528\uff087380\u5143\uff09\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u4e2d\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u6216\u914d\u5076\u7684\u8ba8\u8bba\uff0c\u51b3\u7b56\u8fc7\u7a0b\u5448\u73b0\u4e3a\u4e2a\u4eba\u72ec\u7acb\u884c\u4e3a\u3002\n*   **\u6b65\u9aa41-4\u5224\u5b9a**\uff1a\n    *   **A (\u9ad8\u52a8\u673a-\u9ad8\u8d44\u6e90)**\uff1a\u52a8\u673a\u7eaf\u5ea6\u4e0e\u884c\u52a8\u529b\u7b26\u5408\uff0c\u4f46\u8d44\u6e90\u5e95\u5ea7\u4fe1\u606f\u4e0d\u5168\uff0c**\u6682\u4e0d\u5b8c\u5168\u5339\u914d**\u3002\n    *   **B (\u9ad8\u52a8\u673a-\u4f4e\u8d44\u6e90)**\uff1a\u52a8\u673a\u7b26\u5408\uff0c\u4f46\u672a\u663e\u793a\u660e\u786e\u4f4e\u8d44\u6e90\u4fe1\u53f7\uff08\u5982\u7ecf\u6d4e\u56f0\u96be\u3001\u65f6\u95f4\u6781\u5ea6\u532e\u4e4f\uff09\uff0c**\u4e0d\u5339\u914d**\u3002\n    *   **C (\u4f4e\u52a8\u673a-\u9ad8\u8d44\u6e90)**\uff1a\u52a8\u673a\u660e\u786e\u4e14\u9ad8\uff0c**\u4e0d\u5339\u914d**\u3002\n    *   **D (\u4f4e\u52a8\u673a-\u4f4e\u8d44\u6e90)**\uff1a\u52a8\u673a\u660e\u786e\u4e14\u9ad8\uff0c**\u4e0d\u5339\u914d**\u3002\n*   **\u7efc\u5408\u5224\u5b9a**\uff1a\u57fa\u4e8e\u73b0\u6709\u4fe1\u606f\uff0c\u7528\u6237\u66f4\u504f\u5411 **A\u7c7b\uff08\u9ad8\u52a8\u673a-\u4e2d/\u9ad8\u8d44\u6e90\uff09**\uff0c\u4f46\u9700\u8865\u5145\u8d44\u6e90\u4fe1\u606f\u4ee5\u786e\u8ba4\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**\uff1a**T4 \u52a1\u5b9e\u63a2\u7d22\u8005**\u3002\n    *   **\u4f9d\u636e**\uff1a\u5177\u5907\u660e\u786e\u7684\u6280\u80fd\u63d0\u5347\u548c\u804c\u4e1a\u53d1\u5c55\u76ee\u6807\uff08\u201c\u957f\u671f\u53d1\u5c55\u201d\u3001\u201c\u719f\u6089\u4e1a\u52a1\u6d41\u7a0b\u201d\uff09\uff0c\u6709\u76f8\u5173\u7ecf\u9a8c\u57fa\u7840\uff08\u526a\u8f91\uff09\uff0c\u5b66\u4e60\u884c\u52a8\u529b\u5f3a\uff0c\u79ef\u6781\u53c2\u4e0e\u5b9e\u64cd\uff08\u8bd5\u97f3\u3001\u8bd5\u620f\uff09\u3002\u540c\u65f6\u8868\u73b0\u51fa\u5bf9\u53d8\u73b0\u8def\u5f84\u548c\u5177\u4f53\u56de\u62a5\uff08\u201c\u4e00\u8fb9\u5de5\u4f5c\u5c31\u5148\u628a\u5b66\u8d39\u8d5a\u56de\u6765\u4e86\u201d\uff09\u7684\u5f3a\u70c8\u5173\u6ce8\uff0c\u7b26\u5408T4\u201c\u8ffd\u6c42\u660e\u786e\u56de\u62a5\u4e0e\u6280\u80fd\u589e\u957f\u201d\u7684\u6838\u5fc3\u7279\u5f81\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u4e0d\u53ca\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u201c\u8fdb\u5267\u7ec4\u201d\u3001\u201c\u63a5\u5355\u53d8\u73b0\u201d\u6709\u6025\u5207\u671f\u5f85\uff08\u201c\u5e0c\u671b\u80fd\u8fdb\u5267\u7ec4\u953b\u70bc\u4e00\u4e0b\u201d\uff09\uff0c\u4e14\u5bf9\u8bfe\u7a0b\u7b49\u7ea7\u4e0e\u53d8\u73b0\u80fd\u529b\u7684\u5173\u7cfb\u5b58\u5728\u7591\u95ee\uff08\u201c\u60f3\u664b\u5347\u52304\u7ea7\u90fd\u5f88\u96be\u5462\u201d\uff09\u3002\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa\u201c\u6377\u5f84\u201d\uff08\u201c\u62a5\u8bfe\u5c31\u662f\u6377\u5f84\u201d\uff09\u548c\u201c\u76f4\u63a5\u8fdb\u5267\u7ec4\u201d\u53ef\u80fd\u62c9\u9ad8\u9884\u671f\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u8d39\u7528\u8d85\u8fc7\u6211\u5fc3\u7406\u9884\u671f\u4e86\u201d\uff0c\u867d\u6700\u7ec8\u652f\u4ed8\uff0c\u4f46\u53ef\u80fd\u52a8\u7528\u50a8\u5907\u6216\u5b58\u5728\u538b\u529b\uff0c\u662f\u6f5c\u5728\u7684\u9000\u8d39\u89e6\u53d1\u70b9\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u3002\n    5.  **\u8bfe\u7a0b\u8d28\u91cf\u4e0d\u6ee1**\uff1a**\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u5bf9\u6559\u5b66\u5185\u5bb9\u548c\u8001\u5e08\u53cd\u9988\u975e\u5e38\u79ef\u6781\u3002\n    6.  **\u9500\u552e\u8bef\u5bfc**\uff1a**\u4e2d\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u591a\u6b21\u4f7f\u7528\u201c\u76f4\u63a5\u8fdb\u5267\u7ec4\u201d\u3001\u201c\u53d8\u73b0\u201d\u3001\u201c\u6377\u5f84\u201d\u7b49\u8bf1\u5bfc\u6027\u8bcd\u6c47\uff0c\u5bf9\u7528\u6237\u5173\u4e8e\u7b49\u7ea7\uff08LV7\uff09\u548c\u8d5a\u94b1\u6a21\u5f0f\uff08\u201c\u65e0\u5e95\u85aa\u201d\uff09\u7684\u5408\u7406\u7591\u95ee\u56de\u5e94\u6a21\u7cca\uff08\u201c\u4f60\u4e0d\u7528\u62c5\u5fc3\u8fd9\u4e2a\u201d\u3001\u201c\u540e\u9762\u4f1a\u63a5\u89e6\u5230\u7684\u201d\uff09\uff0c**\u5b58\u5728\u8bef\u5bfc\u548c\u89c4\u907f\u5173\u952e\u95ee\u9898**\u7684\u98ce\u9669\u3002\n    7.  **\u7ade\u54c1\u6bd4\u8f83/\u51b2\u52a8\u6d88\u8d39**\uff1a**\u4f4e\u98ce\u9669**\u3002\u7528\u6237\u51b3\u7b56\u57fa\u4e8e\u6570\u65e5\u7684\u4f53\u9a8c\u548c\u4e92\u52a8\uff0c\u975e\u77ac\u65f6\u51b2\u52a8\u3002\n*   **\u603b\u4f53\u9000\u8d39\u98ce\u9669**\uff1a**\u4e2d\u9ad8**\u3002\u4e3b\u8981\u98ce\u9669\u96c6\u4e2d\u4e8e**\u53d8\u73b0\u9884\u671f\u7ba1\u7406\u5931\u8d25**\u548c**\u9500\u552e\u8bdd\u672f\u5408\u89c4\u6027\u95ee\u9898**\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u4e3b\u8981\u8fdd\u89c4\u70b9**\uff1a\n    *   **\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u8bf1\u5bfc**\uff1a\u9500\u552e\u591a\u6b21\u6697\u793a\u6216\u660e\u793a\u62a5\u8bfe\u4e0e\u201c\u76f4\u63a5\u8fdb\u5267\u7ec4\u201d\u3001\u201c\u53d8\u73b0\u201d\u7684\u5f3a\u5173\u8054\uff08\u201c\u6211\u6709\u6253\u7b97\u9080\u8bf7\u4f60\u8fdb\u5267\u7ec4\u7684\u201d\u3001\u201c\u62a5\u8bfe\u5c31\u662f\u6377\u5f84\u201d\uff09\uff0c**\u4e25\u91cd\u8fdd\u53cd\u5408\u89c4\u8981\u6c42**\u3002\n    *   **\u89c4\u907f\u5173\u952e\u95ee\u9898**\uff1a\u5f53\u7528\u6237\u8be2\u95ee\u5177\u4f53\u664b\u5347\u8def\u5f84\uff08LV7\uff09\u548c\u6536\u5165\u6a21\u5f0f\u65f6\uff0c\u9500\u552e\u4ee5\u201c\u4e0d\u7528\u62c5\u5fc3\u201d\u3001\u201c\u5f88\u7b80\u5355\u201d\u3001\u201c\u4e13\u4e1a\u8bfe\u7a0b\u4f1a\u8bb2\u89e3\u7684\u201d\u7b49\u8bdd\u672f\u56de\u907f\uff0c\u672a\u8fdb\u884c\u771f\u5b9e\u3001\u6e05\u6670\u7684\u8bf4\u660e\u3002\n    *   **\u5229\u7528\u7126\u8651\u4e0e\u4ece\u4f17**\uff1a\u5f3a\u8c03\u201c\u540d\u989d\u201d\u3001\u201c\u52a9\u5b66\u91d1\u4f18\u60e0\u5238\u201d\u5236\u9020\u7a00\u7f3a\u611f\u548c\u7d27\u8feb\u611f\u3002\n*   **\u4f26\u7406\u98ce\u9669**\uff1a**\u9ad8**\u3002\u9500\u552e\u884c\u4e3a\u53ef\u80fd\u6784\u6210\u5bf9\u7528\u6237\u7684**\u8bef\u5bfc\u6027\u9500\u552e**\uff0c\u4e3a\u540e\u7eed\u670d\u52a1\u548c\u5ba2\u8bc9\u57cb\u4e0b\u91cd\u5927\u9690\u60a3\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**24\u5c0f\u65f6\u5185\u8fdb\u884c\u9884\u671f\u6821\u6b63\u4e0e\u5173\u7cfb\u7834\u51b0**\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9884\u671f\u7ba1\u7406\uff08\u9996\u8981\uff09**\uff1a\u9996\u6b21\u8054\u7cfb\u5fc5\u987b\u4e3b\u52a8\u3001\u6e05\u6670\u5730\u8fdb\u884c\u8bfe\u7a0b\u4ef7\u503c\u4e0e\u53d8\u73b0\u9884\u671f\u7684\u6821\u6b63\u3002\u660e\u786e\u8bf4\u660e\u8bfe\u7a0b\u6838\u5fc3\u662f\u6280\u80fd\u6559\u5b66\u4e0e\u884c\u4e1a\u8ba4\u77e5\uff0c\u800c\u975e\u5c31\u4e1a\u4fdd\u969c\u6216\u6536\u5165\u627f\u8bfa\u3002\u7ed3\u5408\u7528\u6237T4\u539f\u578b\uff0c\u5f3a\u8c03\u6280\u80fd\u79ef\u7d2f\u4e0e\u957f\u671f\u804c\u4e1a\u53d1\u5c55\u7684\u5173\u7cfb\u3002\n    2.  **\u98ce\u9669\u9884\u8b66**\uff1a\u5c06\u7528\u6237\u6807\u8bb0\u4e3a\u201c**\u9ad8\u9884\u671f-\u9ad8\u4e92\u52a8**\u201d\u7c7b\u578b\uff0c\u540c\u6b65\u7ed9\u8f85\u5bfc\u8001\u5e08\uff0c\u786e\u4fdd\u6559\u5b66\u53cd\u9988\u4e2d**\u907f\u514d\u4f7f\u7528\u201c\u4fdd\u8bc1\u63a5\u5355\u201d\u3001\u201c\u8f7b\u677e\u53d8\u73b0\u201d\u7b49\u8bcd\u6c47**\uff0c\u591a\u5f3a\u8c03\u7ec3\u4e60\u3001\u8fc7\u7a0b\u548c\u80fd\u529b\u63d0\u5347\u3002\n    3.  **\u6df1\u5ea6\u9700\u6c42\u6316\u6398**\uff1a\u5728\u5efa\u7acb\u4fe1\u4efb\u540e\uff0c\u6e29\u548c\u63a2\u8be2\u5176\u804c\u4e1a\u73b0\u72b6\u3001\u6bcf\u65e5\u53ef\u652f\u914d\u5b66\u4e60\u65f6\u95f4\u3001\u4ed8\u8d39\u51b3\u7b56\u662f\u5426\u4e0e\u5bb6\u4eba\u6c9f\u901a\u3001\u4ee5\u53ca\u5bf9\u201c\u8d5a\u56de\u5b66\u8d39\u201d\u7684\u5177\u4f53\u65f6\u95f4\u9884\u671f\u3002\u8865\u5145\u8d44\u6e90\u5e95\u5ea7\u4fe1\u606f\u3002\n    4.  **\u4ea7\u54c1\u5339\u914d**\uff1a**\u5339\u914d**\u3002\u7528\u6237\u6709\u57fa\u7840\u3001\u6709\u70ed\u60c5\u3001\u76ee\u6807\u660e\u786e\uff0c\u4e0e\u9ad8\u9636\u6280\u80fd\u8bfe\u7a0b\u5339\u914d\u5ea6\u9ad8\u3002\u5173\u952e\u5728\u4e8e\u5c06\u4ed6\u7684\u201c\u53d8\u73b0\u7126\u8651\u201d\u8f6c\u5316\u4e3a\u201c\u6280\u80fd\u63d0\u5347\u8ba1\u5212\u201d\u3002\n    5.  **\u5408\u89c4\u8865\u6551**\uff1a\u73ed\u4e3b\u4efb\u6c9f\u901a\u4e2d\u9700**\u95f4\u63a5\u7ea0\u6b63**\u524d\u7aef\u9500\u552e\u7684\u4e0d\u5f53\u627f\u8bfa\uff0c\u7528\u5b98\u65b9\u3001\u5ba2\u89c2\u7684\u53e3\u5f84\u91cd\u65b0\u9610\u8ff0\u8bfe\u7a0b\u80fd\u63d0\u4f9b\u7684\u4ef7\u503c\u4e0e\u652f\u6301\u8fb9\u754c\u3002\n\n{\"core_type\": \"T4 \u52a1\u5b9e\u63a2\u7d22\u8005\", \"risk_level\": \"\u4e2d\u9ad8\", \"refund_risk\": \"\u4e2d\u9ad8\", \"product_match\": \"\u5339\u914d\", \"action\": \"24\u5c0f\u65f6\u5185\u8fdb\u884c\u9884\u671f\u6821\u6b63\u4e0e\u5173\u7cfb\u7834\u51b0\"}";
