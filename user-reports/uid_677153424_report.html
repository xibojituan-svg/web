        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677153424 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u65bd\u73ca\u73ca (\u6696\u6696\u5e08\u59d0) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u9ad8\u9636\u73ed (4\u4e2a\u6708\uff0c3980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u652f\u4ed8 (\u672a\u63d0\u53ca\u5206\u671f\u6216\u501f\u6b3e) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3** (\u672a\u660e\u786e\u63d0\u53ca\uff0c\u4f46\u7528\u6237\u62c5\u5fc3\u201c\u65f6\u95f4\u4e0d\u591f\u201d) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3** (\u672a\u63d0\u53ca) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49** (\u7528\u6237\u6709\u6df1\u5ea6\u63d0\u95ee\uff0c\u4f46\u7f3a\u4e4f\u65f6\u95f4\u3001\u5bb6\u5ead\u3001\u8bbe\u5907\u7b49\u5173\u952e\u4fe1\u606f) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u5bf9\u526f\u4e1a\u53d8\u73b0\u7684\u5174\u8da3\uff08\u201c\u5982\u679c\u80fd\u6709\u4e00\u4efd\u526f\u4e1a\u90a3\u5c31\u66f4\u597d\u4e86\u201d\uff09\uff0c\u4f46\u540c\u65f6\u5bf9\u884c\u4e1a\u524d\u666f\u3001\u6295\u5165\u56de\u62a5\u5468\u671f\u3001\u5de5\u4f5c\u6d41\u7a0b\u7ec6\u8282\u6709\u975e\u5e38\u7406\u6027\u548c\u6df1\u5165\u7684\u8ffd\u95ee\uff0c\u8868\u660e\u5176\u52a8\u673a\u662f\u201c\u5174\u8da3+\u53d8\u73b0\u201d\u7684\u6df7\u5408\u4f53\uff0c\u800c\u975e\u7eaf\u7cb9\u7684\u201c\u51e0\u5929\u63d0\u73b0\u201d\u5e7b\u60f3\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c3980\u7684\u6210\u672c\u5982\u679c\u82b1\u4e0b\u53bb\uff0c\u5b66\u5f97\u597d\u7684\u60c5\u51b5\uff0c\u591a\u4e45\u80fd\u628a\u5b66\u8d39\u8d5a\u56de\u6765\u5462[\u6342\u8138][\u6342\u8138][\u6342\u8138]\u201d > \u201c\u6211\u5e73\u65f6\u4e5f\u662f\u4f1a\u5728\u559c\u9a6c\u62c9\u96c5\u4e0a\u9762\u542c\u542c\u4e66\u7684\uff0c\u89c9\u5f97\u80fd\u6709\u5e78\u4ee5\u540e\u5236\u4f5c\u4e00\u672c\u6709\u58f0\u4e66\u4e5f\u86ee\u6709\u8da3\u7684\uff0c\u5982\u679c\u80fd\u6709\u4e00\u4efd\u526f\u4e1a\u90a3\u5c31\u66f4\u597d\u4e86[\u5077\u7b11]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u76f4\u63a5\u652f\u4ed83980\u5143\u8bfe\u7a0b\uff0c\u672a\u8868\u73b0\u51fa\u8d44\u91d1\u538b\u529b\uff0c\u4f46\u4e3b\u52a8\u8be2\u95ee\u6295\u8d44\u56de\u62a5\u5468\u671f\uff0c\u8bf4\u660e\u5bf9\u8d44\u91d1\u4f7f\u7528\u8f83\u4e3a\u5ba1\u614e\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e (\u77ed\u677f)** \u2014 \u7528\u6237\u660e\u786e\u8868\u793a\u201c\u6211\u6700\u8fd1\u6bd4\u8f83\u5fd9\u201d\u3001\u201c\u6211\u8981\u662f\u65f6\u95f4\u4e0d\u591f\u600e\u4e48\u529e\u5440\uff01\u201d\uff0c\u8fd9\u662f\u6700\u6838\u5fc3\u7684\u77ed\u677f\u548c\u98ce\u9669\u70b9\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8 (7-8\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u7f51\u7edc\u8d1f\u9762\u4fe1\u606f\uff08\u8c46\u5305\u5dee\u8bc4\uff09\uff0c\u7528\u6237\u6ca1\u6709\u60c5\u7eea\u5316\u62b1\u6028\u6216\u76f4\u63a5\u653e\u5f03\uff0c\u800c\u662f\u4e3b\u52a8\u3001\u7406\u6027\u5730\u5411\u9500\u552e\u6c42\u8bc1\uff0c\u5e76\u8bd5\u56fe\u5206\u6790\u539f\u56e0\uff08\u201c\u662f\u4e0d\u662f\u4f60\u4eec\u8fd9\u8fb9\u6bd5\u4e1a\u7684...\u4e00\u90e8\u5206\u4eba\u4e5f\u8bb8\u6bd5\u4e1a\u540e\u63a5\u5355\u5e76\u4e0d\u987a\u5229\u7684\u5b66\u5458\u5c31\u4f1a\u7ed9\u4e2a\u5dee\u8bc4\u201d\uff09\u3002\u9762\u5bf9\u590d\u6742\u7684\u884c\u4e1a\u89c4\u5219\uff08\u5ba1\u6838\u3001\u62a2\u5355\u3001\u8bbe\u5907\uff09\uff0c\u8868\u73b0\u51fa\u6781\u5f3a\u7684\u903b\u8f91\u68b3\u7406\u548c\u95ee\u9898\u89e3\u51b3\u80fd\u529b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u968f\u4fbf\u67e5\u4e86\u4e00\u4e0b[\u6342\u8138] \u548b\u56de\u4e8b\u5440\u201d > \u201c\u770b\u6765\u4e5f\u4e0d\u662f\u4e00\u4efd\u5bb9\u6613\u7684\u5de5\u4f5c\u5462\uff01\u201d > \u201c\u662f\u4e0d\u662f\u4e0d\u5408\u683c\u5c31\u62ff\u4e0d\u5230\u94b1\uff0c\u5c31\u4f1a\u6709\u5b66\u5458\u4e0d\u6ee1\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 (\u7126\u8651\u4fdd\u969c) \u4e0e \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 (\u4e13\u4e1a\u8ba4\u53ef)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9**\u4e0d\u786e\u5b9a\u6027**\u548c**\u4fe1\u606f\u4e0d\u5bf9\u79f0**\u7684\u6df1\u5ea6\u7126\u8651\u3002\u4ed6\u5bb3\u6015\u6295\u5165\uff08\u65f6\u95f4\u3001\u91d1\u94b1\uff09\u540e\u5f97\u4e0d\u5230\u786e\u5b9a\u6027\u7684\u56de\u62a5\uff0c\u5bb3\u6015\u88ab\u201c\u5272\u97ed\u83dc\u201d\uff0c\u5bb3\u6015\u56e0\u4fe1\u606f\u5dee\u800c\u505a\u51fa\u9519\u8bef\u51b3\u7b56\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u3001\u900f\u660e\u3001\u53ef\u4fe1\u8d56\u7684\u201c\u884c\u4e1a\u5f15\u8def\u4eba\u201d\u5f62\u8c61**\u3002\u4ed6\u9700\u8981\u7684\u662f\u80fd\u6253\u6d88\u5176\u7591\u8651\u3001\u63d0\u4f9b\u6e05\u6670\u8def\u5f84\u548c\u771f\u5b9e\u884c\u4e1a\u56fe\u666f\u7684\u6743\u5a01\u611f\uff0c\u800c\u975e\u5355\u7eaf\u7684\u9f13\u52b1\u6216\u60c5\u611f\u966a\u4f34\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T3 \u6b7b\u78d5\u6781\u5ba2\u6d3e** (\u9ad8\u590d\u8d2d\u6f5c\u529b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u8a00\u8bba\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\uff0c\u98ce\u9669\u672a\u77e5\u4f46\u975e\u9996\u8981\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669\uff01** \u7528\u6237\u5df2\u660e\u786e\u8868\u8fbe\u201c\u65f6\u95f4\u4e0d\u591f\u201d\u7684\u62c5\u5fe7\u3002\u4e00\u65e6\u5f00\u8bfe\u540e\u56e0\u5de5\u4f5c/\u751f\u6d3b\u7e41\u5fd9\u65e0\u6cd5\u8ddf\u4e0a\u8fdb\u5ea6\uff0c\u79ef\u7d2f\u7684\u632b\u8d25\u611f\u548c\u201c\u94b1\u767d\u82b1\u4e86\u201d\u7684\u8ba4\u77e5\u4f1a\u8fc5\u901f\u5bfc\u81f4\u9000\u8d39\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u903b\u8f91\u6027\u5f3a\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u632b\u6298\u60c5\u7eea\u5d29\u6e83\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u4e2d** | \u7528\u6237\u5bf9\u6295\u8d44\u56de\u62a5\u5468\u671f\u6709\u660e\u786e\u8ba1\u7b97\uff08\u201c\u591a\u4e45\u80fd\u628a\u5b66\u8d39\u8d5a\u56de\u6765\u201d\uff09\u3002\u5982\u679c\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u53d1\u73b0\u63a5\u5355\u96be\u5ea6\u3001\u6536\u5165\u6c34\u5e73\u4e0e\u9500\u552e\u63cf\u8ff0\u7684\u201c\u7b2c\u516d\u5468\u63a5\u5355\u201d\u3001\u201c\u8eba\u7740\u62ff\u6536\u76ca\u201d\u6709\u8f83\u5927\u5dee\u8ddd\uff0c\u4f1a\u4ea7\u751f\u5f3a\u70c8\u7684\u88ab\u6b3a\u9a97\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c3-4\u5468**\u3002\u6b64\u65f6\u5b66\u4e60\u538b\u529b\u589e\u5927\uff0c\u82e5\u65f6\u95f4\u65e0\u6cd5\u534f\u8c03\uff0c\u4e14\u672a\u770b\u5230\u4efb\u4f55\u53d8\u73b0\u5e0c\u671b\uff0c\u9000\u8d39\u610f\u613f\u5c06\u8fbe\u5230\u9876\u5cf0\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5e08\u5144/\u5e08\u59d0\uff0c\u770b\u5230\u4f60\u62a5\u540d\u524d\u95ee\u7684\u90a3\u4e9b\u4e13\u4e1a\u95ee\u9898\uff0c\u5c31\u77e5\u9053\u4f60\u662f\u505a\u4e8b\u975e\u5e38\u8ba4\u771f\u3001\u8003\u8651\u5468\u5168\u7684\u4eba\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\uff0c\u6700\u6015\u7684\u5c31\u662f\u2018\u65f6\u95f4\u7ba1\u7406\u2019\u3002\u6211\u5148\u8ddf\u4f60\u540c\u6b65\u4e00\u4e0b\u672a\u67654\u4e2a\u6708\u6700\u6838\u5fc3\u7684\u65f6\u95f4\u8282\u70b9\u548c\u6700\u4f4e\u65f6\u95f4\u4fdd\u969c\uff0c\u54b1\u4eec\u4e00\u8d77\u505a\u4e2a\u89c4\u5212\uff0c\u786e\u4fdd\u4f60\u7684\u6295\u5165\u80fd\u7a33\u7a33\u5730\u62ff\u5230\u7ed3\u679c\uff0c\u907f\u514d\u56e0\u4e3a\u5fd9\u800c\u534a\u9014\u800c\u5e9f\uff0c\u4f60\u770b\u600e\u4e48\u6837\uff1f\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u4ed6\u9700\u8981\u7684\u662f\u624e\u5b9e\u7684\u6280\u80fd\u548c\u6e05\u6670\u7684\u53d8\u73b0\u8def\u5f84\uff0c\u5bf9\u201c\u60c5\u7eea\u533b\u7f8e\u201d\u5174\u8da3\u4e0d\u5927\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T3\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011**\uff08B\u6a21\u5757\uff09\u3002\u4e3a\u4ed6\u5f00\u901a\u4e0e\u540e\u7aef\u6280\u672f\u4e13\u5bb6\uff08\u70b9\u8bc4\u5b98/\u5927\u5496\u8001\u5e08\uff09\u7684\u76f4\u63a5\u95ee\u7b54\u901a\u9053\uff0c\u6ee1\u8db3\u5176\u94bb\u7814\u5e95\u5c42\u903b\u8f91\u7684\u9700\u6c42\u3002\u540c\u65f6\uff0c\u5fc5\u987b\u63d0\u524d\u7ba1\u7406\u65f6\u95f4\u9884\u671f\uff0c\u63d0\u4f9b **\u3010\u7075\u6d3b\u5b66\u4e60\u65f6\u95f4\u8868\u3011**\uff08A\u6a21\u5757\u53d8\u4f53\uff09\uff0c\u5141\u8bb8\u4e00\u5b9a\u7a0b\u5ea6\u7684\u65f6\u95f4\u5f39\u6027\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u753b\u4e0d\u5207\u5b9e\u9645\u7684\u201c\u5feb\u94b1\u201d\u5927\u997c**\uff1b2. **\u7528\u60c5\u611f\u7ed1\u67b6\u6216\u793e\u7fa4\u538b\u529b\u903c\u8feb\u4ed6\u8d76\u8fdb\u5ea6**\uff1b3. **\u56de\u907f\u6216\u6a21\u7cca\u56de\u7b54\u4ed6\u63d0\u51fa\u7684\u5177\u4f53\u64cd\u4f5c\u95ee\u9898\uff08\u5982\u5ba1\u6838\u6807\u51c6\u3001\u5206\u6210\u7ec6\u8282\uff09**\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u5fc5\u987b\u5efa\u7acb\u5728\u624e\u5b9e\u7684\u6280\u672f\u8fdb\u9636\u548c\u660e\u786e\u7684\u804c\u4e1a\u8def\u5f84\u4e0a**\u3002\u4f8b\u5982\uff0c\u5728\u4ed6\u5b8c\u6210\u57fa\u7840\u8bfe\u7a0b\u5e76\u4ea7\u51fa\u5408\u683c\u4f5c\u54c1\u540e\uff0c\u63a8\u4ecb\u66f4\u9ad8\u7ea7\u7684\u540e\u671f\u5236\u4f5c\u6216\u5546\u4e1a\u914d\u97f3\u8bfe\u7a0b\u3002\u5207\u5fcc\u5728\u57fa\u7840\u4e0d\u7262\u65f6\u4ea4\u53c9\u63a8\u9500\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c3980\u7684\u6210\u672c\u5982\u679c\u82b1\u4e0b\u53bb\uff0c\u5b66\u5f97\u597d\u7684\u60c5\u51b5\uff0c\u591a\u4e45\u80fd\u628a\u5b66\u8d39\u8d5a\u56de\u6765\u5462[\u6342\u8138][\u6342\u8138][\u6342\u8138]\u201d **(\u7406\u6027\u6295\u8d44\u56de\u62a5\u8ba1\u7b97)**\n2. > \u201c\u6211\u8981\u662f\u65f6\u95f4\u4e0d\u591f\u600e\u4e48\u529e\u5440\uff01\u8fd8\u67093980\u7684\u5b66\u4e60\uff0c\u9700\u89812\u4e2a\u6708\u5b8c\u6210\uff0c\u8981\u662f\u5b8c\u4e0d\u6210\u600e\u4e48\u529e\u5462\uff1f\u201d **(\u5bf9\u65f6\u95f4\u6295\u5165\u7684\u6df1\u5ea6\u7126\u8651\u4e0e\u98ce\u9669\u9884\u5224)**\n3. > \u201c\u57f9\u8bad\u8fc7\u540e \u771f\u7684\u6709\u63a5\u5355\u7684\u6d3b\uff0c\u4ee5\u53ca\u5c31\u4e1a\u662f\u5426\u524d\u666f\u771f\u7684\u50cf\u60a8\u8bf4\u7684\u90a3\u4e48\u597d\uff0c\u8fd8\u662f\u4f1a\u6709\u70b9\u5c0f\u7591\u60d1\uff0c\u3002\u6211\u731c\u6d4b\u662f\u4e0d\u662f\u4e00\u90e8\u5206\u4eba\u4e5f\u8bb8\u6bd5\u4e1a\u540e\u63a5\u5355\u5e76\u4e0d\u987a\u5229\u7684\u5b66\u5458\u5c31\u4f1a\u7ed9\u4e2a\u5dee\u8bc4...\u201d **(\u6df1\u5ea6\u8c03\u7814\u4e0e\u6279\u5224\u6027\u601d\u7ef4\uff0c\u4e0d\u76f2\u4ece)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T3 \u6b7b\u78d5\u6781\u5ba2\u6d3e\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u9700\u6c42\uff08\u786e\u5b9a\u6027\u4fdd\u969c\uff09\u4e0e\u5c0a\u91cd\u9700\u6c42\uff08\u4e13\u4e1a\u8ba4\u53ef\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u504f\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u524d\u7f6e\u65f6\u95f4\u7ba1\u7406\u89c4\u5212 + \u6301\u7eed\u63d0\u4f9b\u4e13\u4e1a\u3001\u900f\u660e\u7684\u884c\u4e1a\u4fe1\u606f\u4e0e\u6280\u672f\u652f\u6301\uff0c\u675c\u7edd\u865a\u5047\u627f\u8bfa\u3011**\u3002\n\n```json\n{\"core_type\": \"T3 \u6b7b\u78d5\u6781\u5ba2\u6d3e\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168/\u5c0a\u91cd\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\"}\n```";
