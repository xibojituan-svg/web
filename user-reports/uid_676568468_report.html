    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n> **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4e3b\u8981\u56f4\u7ed5\u8bfe\u7a0b\u5185\u5bb9\u3001\u4f5c\u4e1a\u3001\u5de5\u5177\u4f7f\u7528\u548c\u9879\u76ee\u54a8\u8be2\u5c55\u5f00\uff0c**\u4e25\u91cd\u7f3a\u5931**\u5173\u4e8e\u7528\u6237**\u652f\u4ed8\u80fd\u529b\u3001\u5bb6\u5ead\u80cc\u666f\u3001\u804c\u4e1a\u72b6\u6001\u3001\u5177\u4f53\u6536\u5165\u6c34\u5e73\u3001\u6bcf\u65e5\u53ef\u7528\u5b66\u4e60\u65f6\u95f4\u3001\u8fc7\u5f80\u5b66\u4e60\u6295\u5165\u4e0e\u6210\u679c**\u7b49\u5173\u952e\u7ef4\u5ea6\u7684\u4fe1\u606f\u3002\u672c\u6b21\u5206\u6790\u4e3b\u8981\u57fa\u4e8e\u5176\u5b66\u4e60\u884c\u4e3a\u4e0e\u4e92\u52a8\u6a21\u5f0f\u3002\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676568468 (\u6635\u79f0\u672a\u4f53\u73b0) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-24 \u81f3 2026-01-30 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u8def\u8def\u901a(\u675c\u4e50\u5b87)\u3001\u559c\u66f0\u559c\u8a00(\u8d75\u6708) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u5199\u4f5c\u8bfe\u3001AIGC\u5168\u80fd\u521b\u4f5c\u8425\u3001\u610f\u5411\u201c\u6536\u7a3f\u9879\u76ee\u201d(1880\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u7f3a\u5931** (\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u4e0e\u538b\u529b) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u7f3a\u5931** (\u4ec5\u77e5\u201c\u65f6\u95f4\u6709\u9650\uff0c\u5f97\u8981\u6709\u4e00\u5b9a\u53d6\u820d\u201d\u3001\u201c\u8fd9\u51e0\u5929\u592a\u5fd9\u4e86\uff0c\u843d\u4e0b\u597d\u591a\u4e1c\u897f\u201d) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931** (\u4ec5\u80fd\u5206\u6790\u5b66\u4e60\u884c\u4e3a\u4e0e\u8868\u5c42\u52a8\u673a\uff0c\u5173\u952e\u8d44\u6e90\u5e95\u5ea7\u4fe1\u606f\u672a\u77e5) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34(\u4e2d)\u3002\u7528\u6237\u6709\u660e\u786e\u7684\u53d8\u73b0\u671f\u671b\uff08\u201c\u771f\u7684\u5e0c\u671b\u81ea\u5df1\u80fd\u628a\u5b66\u8d39\u4ea4\u56de\u6765\u201d\uff09\uff0c\u5e76\u4e3b\u52a8\u54a8\u8be2\u6536\u7a3f\u9879\u76ee\uff0c\u8868\u73b0\u51fa\u7ed3\u679c\u5bfc\u5411\u3002\u4f46\u540c\u65f6\uff0c\u5176\u5b66\u4e60\u884c\u4e3a\u4e5f\u663e\u793a\u51fa\u5bf9AI\u5de5\u5177\u672c\u8eab\u7684\u597d\u5947\u4e0e\u63a2\u7d22\u4e50\u8da3\uff0c\u52a8\u673a\u5e76\u975e\u7eaf\u7cb9\u4e3a\u201c\u51e0\u5929\u5185\u63d0\u73b0\u201d\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u73ed\u73ed\u6323\ud83d\udcb0\u591a\uff0c\u6211\u4e5f\u60f3\u50cf\u73ed\u73ed\u8fd9\u6837\u6709\u5e95\u6c14 \u73b0\u5728\u56e0\u4e3a\u5de5\u8d44\u4f4e\uff0c\u7ecf\u5e38\u88ab\u4eba\u5632\u7b11[\u6d41\u6cea]\u201d > \u201c\u771f\u7684\u5e0c\u671b\u81ea\u5df1\u80fd\u628a\u5b66\u8d39\u4ea4\u56de\u6765 \u9646\u9646\u7eed\u7eed\u4ea4\u4e86\u597d\u591a[\u6342\u8138]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d] (\u4fe1\u606f\u4e0d\u8db3\uff0c\u57fa\u4e8e\u6709\u9650\u4fe1\u606f\u63a8\u65ad)\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 \u81ea\u8ff0\u201c\u5de5\u8d44\u4f4e\u201d\uff0c\u4f46\u5df2\u8d2d\u4e70\u591a\u4e2a\u8bfe\u7a0b\u5e76\u54a8\u8be2\u65b0\u9879\u76ee\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u6d88\u8d39\u610f\u613f\u4e0e\u80fd\u529b\uff0c\u4f46\u53ef\u80fd\u5b58\u5728\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4f4e] \u2014 \u591a\u6b21\u63d0\u53ca\u201c\u65f6\u95f4\u6709\u9650\u201d\u3001\u201c\u592a\u5fd9\u4e86\uff0c\u843d\u4e0b\u597d\u591a\u4e1c\u897f\u201d\uff0c\u8868\u660e\u65f6\u95f4\u8d44\u6e90\u7d27\u5f20\uff0c\u662f\u660e\u663e\u7684\u77ed\u677f\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 \u65e0\u76f8\u5173\u4fe1\u606f\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b07\u4f4e\u6781\u5371]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u7528\u6237\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u81ea\u6211\u6000\u7591\uff08\u201c\u6211\u89c9\u5f97\u6211\u5728\u5199\u4f5c\u65b9\u9762\u5f88\u4e00\u822c\u201d\u3001\u201c\u6211\u4e5f\u6709\u540c\u611f\uff0c\u540c\u5b66\u4eec\u90fd\u597d\u4f18\u79c0\u201d\uff09\u3001\u5bf9\u9519\u8fc7\u7684\u6781\u5ea6\u7126\u8651\uff08\u201c\u603b\u5bb3\u6015\u9519\u8fc7\u201d\u3001\u201c\u8981\u54ed\u4e86\u201d\uff09\uff0c\u4ee5\u53ca\u5bf9\u73ed\u73ed/\u52a9\u6559\u7684\u6280\u672f\u6307\u5bfc\u6709\u9ad8\u5ea6\u4f9d\u8d56\u6027\uff08\u9891\u7e41\u63d0\u95ee\u64cd\u4f5c\u7ec6\u8282\uff09\u3002\u60c5\u7eea\u6613\u53d7\u5916\u754c\uff08\u5982\u540c\u5b66\u6bd4\u8f83\uff09\u548c\u8fdb\u5ea6\u5f71\u54cd\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u54ce\u6211\u4e5f\u6709\u540c\u611f\uff0c\u540c\u5b66\u4eec\u90fd\u597d\u4f18\u79c0\u201d > \u201c\u6211\u89c9\u5f97\u6211\u5728\u5199\u4f5c\u65b9\u9762\u5f88\u4e00\u822c\u201d > \u201c\u603b\u5bb3\u6015\u9519\u8fc7\u201d > \u201c\u8981\u54ed\u4e86\u201d > \u201c\u8fd9\u4e2a\u4e0d\u770b\u662f\u4e0d\u662f\u5f88\u4e8f\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e / \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u56e0\u4f4e\u6536\u5165\u800c\u4ea7\u751f\u7684\u5f3a\u70c8\u81ea\u5351\u611f\u4e0e\u4e0d\u88ab\u5c0a\u91cd\u7684\u75db\u82e6**\uff08\u201c\u73b0\u5728\u56e0\u4e3a\u5de5\u8d44\u4f4e\uff0c\u7ecf\u5e38\u88ab\u4eba\u5632\u7b11\u201d\uff09\uff0c\u4ee5\u53ca\u56e0\u80fd\u529b\u4e0d\u8db3\u3001\u5bb3\u6015\u843d\u540e\u4e8e\u540c\u5b66\u800c\u4ea7\u751f\u7684**\u6df1\u5ea6\u7126\u8651\u548c\u4e0d\u5b89\u5168\u611f**\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6301\u7eed\u7684\u3001\u5177\u4f53\u7684\u80af\u5b9a\u4e0e\u9f13\u52b1\uff0c\u6784\u5efa\u4e00\u4e2a\u201c\u88ab\u770b\u89c1\u3001\u88ab\u8ba4\u53ef\u201d\u7684\u5b89\u5168\u5f52\u5c5e\u611f**\uff0c\u540c\u65f6\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u6267\u884c\u7684\u8def\u5f84\u4ee5\u7f13\u89e3\u5176\u201c\u8ddf\u4e0d\u4e0a\u3001\u5b66\u4e0d\u4f1a\u201d\u7684\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1** \u7c7b (\u52a8\u673a\u4e2d\u7b49\u4f46\u5fc3\u7406\u5f39\u6027\u6781\u4f4e\uff0c\u8d44\u6e90\u5b58\u5728\u77ed\u677f\uff0c\u9700\u91cd\u70b9\u60c5\u7eea\u7ef4\u62a4) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u6838\u5fc3\u7279\u5f81\uff1a\u81ea\u5351\u3001\u7126\u8651\u3001\u4f9d\u8d56\u6027\u5f3a\u3001\u5bb3\u6015\u88ab\u6bd4\u8f83\u3001\u9700\u8981\u9ad8\u9891\u60c5\u7eea\u5b89\u629a) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1] (\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u7b49\u6781\u7aef\u60c5\u51b5)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a[\u4e0d\u9002\u7528]\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | [\u4f4e] | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u81ea\u8ff0\u5de5\u8d44\u4f4e\uff0c\u82e5\u8bfe\u7a0b\u652f\u51fa\u5f71\u54cd\u5bb6\u5ead\u5f00\u652f\u53ef\u80fd\u5f15\u53d1\u77db\u76fe\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **[\u9ad8]** | **\u65f6\u95f4\u7d27\u5f20\u5bfc\u81f4\u4f5c\u4e1a\u79ef\u538b\uff0c\u770b\u5230\u540c\u5b66\u8fdb\u6b65\u800c\u81ea\u5df1\u843d\u540e\uff0c\u4ea7\u751f\u5de8\u5927\u7126\u8651\u548c\u81ea\u8d23\uff0c\u6700\u7ec8\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u653e\u5f03\u3002** |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **[\u6781\u9ad8]** | **\u5b66\u4e60\u9047\u5230\u6280\u672f\u96be\u9898\uff08\u5982\u63d0\u793a\u8bcd\u5199\u4e0d\u597d\u3001\u8f6f\u4ef6\u64cd\u4f5c\u5361\u58f3\uff09\u65e0\u4eba\u53ca\u65f6\u54cd\u5e94\uff0c\u6216\u4f5c\u4e1a\u88ab\u6279\u8bc4\u3001\u6295\u7a3f\u88ab\u62d2\uff0c\u81ea\u5c0a\u5fc3\u4e25\u91cd\u53d7\u632b\uff0c\u77ac\u95f4\u5d29\u6e83\u3002** |\n| \u6536\u76ca\u843d\u5dee\u578b | [\u4e2d] | \u5bf9\u201c\u6536\u7a3f\u9879\u76ee\u201d\u7b49\u53d8\u73b0\u9014\u5f84\u62b1\u6709\u8fc7\u9ad8\u671f\u671b\uff0c\u82e5\u77ed\u671f\u5185\u65e0\u6536\u76ca\u6216\u6536\u76ca\u8fdc\u4f4e\u4e8e\u9884\u671f\uff0c\u53ef\u80fd\u4ea7\u751f\u88ab\u6b3a\u9a97\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-3\u5468**\u3002\u6b64\u65f6\u8bfe\u7a0b\u96be\u5ea6\u548c\u4f5c\u4e1a\u91cf\u589e\u52a0\uff0c\u6280\u672f\u95ee\u9898\u9891\u53d1\uff0c\u6295\u7a3f\u53ef\u80fd\u6536\u5230\u7b2c\u4e00\u6b21\u62d2\u7a3f\u53cd\u9988\uff0c\u662f\u5176\u81ea\u4fe1\u6700\u8106\u5f31\u3001\u7126\u8651\u6700\u9ad8\u5cf0\u7684\u65f6\u671f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u946b\u840c\u5b9d\u513f\uff0c\u6211\u770b\u5230\u4f60\u7279\u522b\u8ba4\u771f\uff0c\u95ee\u7684\u95ee\u9898\u90fd\u5f88\u7ec6\u81f4\uff0c\u8fd9\u662f\u5b66\u597d\u4e1c\u897f\u7684\u5173\u952e\uff01\u522b\u62c5\u5fc3\u8ddf\u4e0d\u4e0a\uff0c\u54b1\u4eec\u8fd9\u4e2a\u8425\u91cc\u5f88\u591a\u540c\u5b66\u90fd\u662f\u65b0\u624b\u8d77\u6b65\uff0c\u73ed\u73ed\u4f1a\u4e00\u76f4\u966a\u7740\u4f60\uff0c\u6709\u4efb\u4f55\u5361\u4f4f\u7684\u5730\u65b9\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u89e3\u51b3\u3002\u4f60\u7684\u6bcf\u4e00\u6b65\u52aa\u529b\uff0c\u6211\u90fd\u770b\u5f97\u89c1\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf**\u3011\u3002\u6838\u5fc3\u76ee\u6807\u662f\u5efa\u7acb\u5b89\u5168\u611f\uff0c\u9632\u6b62\u5176\u56e0\u60c5\u7eea\u95ee\u9898\u5d29\u76d8\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u5f3a\u70c8\u8865\u5145\u3010**\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305**\u3011\uff08\u5982\uff1a\u4e00\u5bf9\u4e00\u8fdb\u5ea6\u5173\u6000\u3001\u5fae\u5c0f\u8fdb\u6b65\u5373\u65f6\u8868\u626c\u3001\u6280\u672f\u5361\u70b9\u624b\u628a\u624b\u6559\u5b66\uff09\u3002\u53ef\u8c28\u614e\u9644\u52a0\u3010**\u5feb\u901f\u63a5\u5355\u7ebf**\u3011\uff08\u5982\u6536\u7a3f\u9879\u76ee\uff09\uff0c\u4f46\u5fc5\u987b\u7ba1\u7406\u5176\u6536\u76ca\u9884\u671f\uff0c\u5f3a\u8c03\u201c\u5148\u5b8c\u6210\u518d\u5b8c\u7f8e\u201d\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u5728\u7fa4\u91cc\u516c\u5f00\u6279\u8bc4\u6216\u5bf9\u6bd4\u5176\u4f5c\u4e1a\u30022. \u7528\u201c\u522b\u4eba\u90fd\u80fd\u505a\u5230\u4f60\u4e3a\u4ec0\u4e48\u4e0d\u884c\u201d\u4e4b\u7c7b\u7684\u8bdd\u672f\u65bd\u538b\u30023. \u5bf9\u5176\u63d0\u51fa\u7684\u201c\u5e7c\u7a1a\u201d\u95ee\u9898\u8868\u73b0\u51fa\u4e0d\u8010\u70e6\u30024. **\u7edd\u4e0d\u5bf9T6\u8bb2\u5927\u9053\u7406\u6216\u7a7a\u8c08\u575a\u6301**\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u8c28\u614e\u63a8\u4ecb\uff0c\u4e25\u7981\u9ad8\u538b\u5347\u5355**\u3002\u53ef\u57fa\u4e8e\u5176\u5df2\u8868\u9732\u7684\u5174\u8da3\uff08\u5982\u6536\u7a3f\u9879\u76ee\uff09\u8fdb\u884c\u6e29\u548c\u4ecb\u7ecd\uff0c\u4f46\u5fc5\u987b\u5145\u5206\u544a\u77e5\u5b66\u4e60\u8def\u5f84\u548c\u53ef\u80fd\u6311\u6218\uff0c\u907f\u514d\u5236\u9020\u201c\u4e70\u4e86\u5c31\u80fd\u7acb\u523b\u8d5a\u94b1\u201d\u7684\u5e7b\u89c9\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u73b0\u5728\u56e0\u4e3a\u5de5\u8d44\u4f4e\uff0c\u7ecf\u5e38\u88ab\u4eba\u5632\u7b11[\u6d41\u6cea]\u201d **(\u81ea\u5351\u4e0e\u5c0a\u91cd\u9700\u6c42)**\n2. > \u201c\u6211\u89c9\u5f97\u6211\u5728\u5199\u4f5c\u65b9\u9762\u5f88\u4e00\u822c\u201d\u3001\u201c\u54ce\u6211\u4e5f\u6709\u540c\u611f\uff0c\u540c\u5b66\u4eec\u90fd\u597d\u4f18\u79c0\u201d **(\u81ea\u6211\u6000\u7591\u4e0e\u6bd4\u8f83\u7126\u8651)**\n3. > \u201c\u603b\u5bb3\u6015\u9519\u8fc7\u201d\u3001\u201c\u8981\u54ed\u4e86\u201d\u3001\u201c\u8fd9\u4e2a\u4e0d\u770b\u662f\u4e0d\u662f\u5f88\u4e8f\u201d **(\u7126\u8651\u4f9d\u8d56\u4e0e\u5bb3\u6015\u843d\u540e)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6\u60c5\u7eea\u5de8\u5a74\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u5c0a\u91cd\u4e0e\u6d88\u9664\u7126\u8651**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u9ad8\u9891\u3001\u5177\u4f53\u3001\u5145\u6ee1\u80af\u5b9a\u7684\u60c5\u7eea\u966a\u4f34\u4e0e\u624b\u628a\u624b\u6280\u672f\u515c\u5e95**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5c0a\u91cd/\u5b89\u5168\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
