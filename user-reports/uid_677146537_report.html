    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677146537 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-04 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u623f\u5229\u519b68(\u623f\u5229\u519b)\u3001\u4e66\u97f5\u73ed\u73ed\uff08\u6768\u5112\u5a77\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u77ed\u89c6\u9891\u8bfe\u7a0b (2980\u5143\u5347\u7ea7\u81f33980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u4fe1\u7528\u5361\u5468\u8f6c / \u82b1\u5457\u5206\u671f (\u9500\u552e\u63d0\u53ca) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1 (\u6709\u5168\u804c\u5de5\u4f5c\uff0c\u9700\u4f7f\u7528\u98de\u4e66) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** (\u672a\u63d0\u53ca\uff0c\u9700\u8b66\u60d5) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931** (\u7528\u6237\u4e3b\u52a8\u8868\u8fbe\u6781\u5c11\uff0c\u591a\u4e3a\u9500\u552e\u5355\u65b9\u9762\u8f93\u51fa\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b07\u4f4e\n- **\u7279\u5f81\u901f\u5199**\uff1a\u7eaf\u4e3a\u51e0\u5929\u5185\u63d0\u73b0\u4fdd\u5e95\u800c\u6765(\u4f4e\u6781\u5371)\u3002\u7528\u6237\u6838\u5fc3\u5173\u6ce8\u70b9\u5728\u4e8e\u201c\u591a\u4e45\u80fd\u8d5a\u94b1\u201d\u3001\u201c\u80fd\u5426\u63a5\u5355\u201d\uff0c\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u3001\u80fd\u529b\u6210\u957f\u51e0\u4e4e\u65e0\u8be2\u95ee\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c4\u201d (\u56de\u590d\u9500\u552e\u201c\u62c5\u5fc3\u8d5a\u4e0d\u4e86\u94b1\u201d\u7684\u9009\u9879)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u521d\u59cb\u9009\u62e92980\u5143\u8bfe\u7a0b\uff0c\u5728\u9500\u552e\u591a\u6b21\u65bd\u538b\u540e\u672a\u7acb\u5373\u62a5\u540d\uff0c\u8868\u73b0\u51fa\u5bf9\u4ef7\u683c\u7684\u654f\u611f\u3002\u9500\u552e\u4e3b\u52a8\u63d0\u53ca\u201c\u652f\u6301\u82b1\u5457\u3001\u4fe1\u7528\u5361\u62a5\u540d\u201d\uff0c\u4fa7\u9762\u5370\u8bc1\u7528\u6237\u53ef\u80fd\u5b58\u5728\u8d44\u91d1\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u6709\u5168\u804c\u5de5\u4f5c\uff0c\u9700\u8981\u534f\u8c03\u4f7f\u7528\u98de\u4e66\u7b49\u529e\u516c\u8f6f\u4ef6\uff0c\u65f6\u95f4\u5448\u788e\u7247\u5316\u72b6\u6001\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u804a\u5929\u8bb0\u5f55\u4e2d\u5b8c\u5168\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\uff0c**\u6b64\u4e3a\u9ad8\u98ce\u9669\u4fe1\u53f7**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)\u3002\u7528\u6237\u8868\u73b0\u51fa\u6781\u5f3a\u7684\u5de5\u5177\u4f9d\u8d56\u548c\u8def\u5f84\u4f9d\u8d56\uff0c\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u5982\u8bfe\u7a0b\u67e5\u770b\u3001\u98de\u4e66\u4f7f\u7528\uff09\u65f6\uff0c\u53cd\u590d\u3001\u88ab\u52a8\u5730\u5bfb\u6c42\u5e2e\u52a9\uff0c\u7f3a\u4e4f\u81ea\u4e3b\u63a2\u7d22\u548c\u89e3\u51b3\u95ee\u9898\u7684\u80fd\u529b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08\u6211\u8fd9\u8fb9\u6ca1\u6709\u8bfe\u201d (\u591a\u6b21\u8be2\u95ee\u8bfe\u7a0b\u67e5\u770b\u95ee\u9898)\uff1b\u201c\u6211\u4eec\u5e73\u5e38\u4e0a\u73ed\u4e5f\u7528\u98de\u4e66\u4f1a\u51b2\u7a81\u5417\u201d (\u5bf9\u57fa\u7840\u5de5\u5177\u4f7f\u7528\u8868\u73b0\u51fa\u62c5\u5fe7\u548c\u4f9d\u8d56)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u7ecf\u6d4e\u72b6\u51b5\u548c\u672a\u6765\u804c\u4e1a\u53d1\u5c55\u7684**\u6df1\u5ea6\u4e0d\u5b89\u5168\u611f**\u3002\u5e0c\u671b\u901a\u8fc7\u4e00\u4e2a\u201c\u786e\u5b9a\u201d\u7684\u3001\u5feb\u901f\u7684\u526f\u4e1a\u8def\u5f84\u6765\u83b7\u53d6\u7ecf\u6d4e\u4fdd\u969c\uff0c\u62b5\u5fa1\u5931\u4e1a\u6216\u6536\u5165\u4e0d\u8db3\u7684\u98ce\u9669\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u548c\u5b89\u5168\u611f**\u3002\u9700\u8981\u4e0d\u65ad\u7ed9\u4e88\u201c\u8def\u5f84\u6e05\u6670\u201d\u3001\u201c\u5e73\u53f0\u53ef\u9760\u201d\u3001\u201c\u6709\u5355\u53ef\u63a5\u201d\u7684\u627f\u8bfa\uff0c\u5e76\u5728\u4ed6\u9047\u5230\u4efb\u4f55\u5fae\u5c0f\u632b\u6298\u65f6\uff0c\u7acb\u5373\u63d0\u4f9b\u4fdd\u59c6\u5f0f\u7684\u3001\u65e0\u5fae\u4e0d\u81f3\u7684\u89e3\u51b3\u65b9\u6848\uff0c\u9632\u6b62\u5176\u56e0\u7126\u8651\u800c\u5d29\u6e83\u9000\u8d39\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2 \u7c7b** (\u9ad8\u98ce\u9669\uff0c\u52a8\u673a\u4e0d\u7eaf\u4e14\u8d44\u6e90\u5e95\u5ea7\u8106\u5f31) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u6781\u5ea6\u4f9d\u8d56\u5916\u90e8\u80af\u5b9a\u4e0e\u6307\u5bfc\uff0c\u6297\u538b\u80fd\u529b\u5dee\uff0c\u6613\u56e0\u5c0f\u632b\u6298\u653e\u5f03) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u4f46\u8d44\u91d1\u7aef\u5b58\u5728\u9690\u60a3\uff0c\u9700\u8b66\u60d5)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u7b49\u660e\u786e\u7ea2\u7ebf\uff0c\u4f46**\u5bb6\u5ead\u652f\u6301\u5ea6\u4fe1\u606f\u5b8c\u5168\u7f3a\u5931**\uff0c\u9700\u5728\u540e\u7eed\u670d\u52a1\u4e2d\u8c28\u614e\u63a2\u67e5\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u9ad8** | **\u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u98ce\u9669\u6781\u9ad8**\u3002\u4e00\u65e6\u5bb6\u4eba\u53d1\u73b0\u5176\u82b1\u8d39\u8fd14000\u5143\u5b66\u4e60\u201c\u4e0d\u9760\u8c31\u201d\u7684\u526f\u4e1a\u8bfe\u7a0b\uff0c\u6781\u6613\u5f15\u53d1\u51b2\u7a81\u548c\u9000\u8d39\u8981\u6c42\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | \u5de5\u4f5c\u7e41\u5fd9\u5bfc\u81f4\u5b66\u4e60\u65f6\u95f4\u88ab\u6324\u538b\uff0c\u65e0\u6cd5\u8ddf\u4e0a\u8bfe\u7a0b\u8fdb\u5ea6\uff0c\u4ea7\u751f\u201c\u94b1\u767d\u82b1\u4e86\u201d\u7684\u7126\u8651\u548c\u81ea\u8d23\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u7b2c\u4e00\u4efd\u4f5c\u4e1a\u6216\u7b2c\u4e00\u4e2a\u8f6f\u4ef6\u5b89\u88c5\u5931\u8d25**\uff0c\u5c31\u4f1a\u6210\u4e3a\u538b\u57ae\u4ed6\u7684\u6700\u540e\u4e00\u6839\u7a3b\u8349\u3002\u4ed6\u4f1a\u7acb\u523b\u5f52\u56e0\u4e8e\u201c\u81ea\u5df1\u592a\u7b28\u201d\u3001\u201c\u8bfe\u7a0b\u9a97\u4eba\u201d\uff0c\u8981\u6c42\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u6781\u9ad8** | \u5f00\u8bfe\u540e\u7b2c\u4e8c\u5468\uff0c\u53d1\u73b0\u6240\u8c13\u7684\u201c\u63a5\u5355\u201d\u5e76\u975e\u553e\u624b\u53ef\u5f97\uff0c\u6216\u5355\u5b50\u4ef7\u683c\u8fdc\u4f4e\u4e8e\u9884\u671f\uff08\u598280\u5143/\u5206\u949f\u800c\u975e6000\u5143/\u5206\u949f\uff09\uff0c\u4f1a\u7acb\u523b\u611f\u5230\u88ab\u6b3a\u9a97\u800c\u66b4\u6012\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c\u4e00\u5468\u81f3\u7b2c\u4e8c\u5468**\u3002\u6b64\u65f6\u5c06\u9762\u4e34\u7b2c\u4e00\u6b21\u5b9e\u64cd\u4f5c\u4e1a\u548c\u201c\u63a5\u5355\u8d44\u6e90\u5f00\u901a\u201d\u7684\u627f\u8bfa\u68c0\u9a8c\u671f\uff0c\u4efb\u4f55\u632b\u6298\u6216\u843d\u5dee\u90fd\u5c06\u76f4\u63a5\u5f15\u7206\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u540c\u5b66\u4f60\u597d\u5440\uff01\u770b\u5230\u4f60\u5df2\u7ecf\u6210\u529f\u5347\u7ea7\u52303.5\u4e2a\u6708\u7684\u8bfe\u7a0b\u5566\uff0c\u592a\u68d2\u4e86\uff01\u54b1\u4eec\u4e0d\u7740\u6025\uff0c\u6162\u6162\u6765\u3002**\u73ed\u73ed\u5728\u8fd9\u91cc\u7ed9\u4f60\u5403\u4e2a\u5b9a\u5fc3\u4e38\uff1a\u54b1\u4eec\u7684\u8bfe\u7a0b\u8bbe\u8ba1\u5c31\u662f\u2018\u624b\u628a\u624b\u3001\u96f6\u538b\u529b\u2019\uff0c\u4f60\u9047\u5230\u4efb\u4f55\u95ee\u9898\uff0c\u54ea\u6015\u662f\u6700\u5c0f\u7684\u95ee\u9898\uff0c\u6bd4\u5982\u8f6f\u4ef6\u6253\u4e0d\u5f00\u3001\u63d0\u793a\u8bcd\u4e0d\u4f1a\u5199\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u79d2\u56de\u5e2e\u4f60\u641e\u5b9a\u3002\u54b1\u4eec\u7684\u76ee\u6807\u4e0d\u662f\u6210\u4e3a\u4e13\u5bb6\uff0c\u800c\u662f\u5148\u7a33\u7a33\u5730\u505a\u51fa\u7b2c\u4e00\u4e2a\u80fd\u8d5a\u94b1\u7684\u5c0f\u4f5c\u54c1\u3002\u4f60\u53ea\u8981\u8ddf\u7740\u8d70\uff0c\u6bcf\u4e00\u6b65\u6211\u90fd\u966a\u7740\u4f60\uff0c\u7edd\u5bf9\u4e0d\u8ba9\u4f60\u6389\u961f\u3002\u201d**\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\u3011**\u3002\u6838\u5fc3\u662f\u964d\u4f4e\u9884\u671f\u3001\u51cf\u5c11\u632b\u8d25\u611f\u3001\u63d0\u4f9b\u5373\u65f6\u60c5\u7eea\u4ef7\u503c\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u5f3a\u5236\u6302\u8f7d **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u5305\u62ec\uff1a1\uff09\u6bcf\u65e5\u7b80\u5316\u7248\u201c\u4e00\u53e5\u8bdd\u201d\u6253\u5361\u4efb\u52a1\uff1b2\uff09\u4f5c\u4e1a\u63d0\u4ea4\u540e\uff0c\u73ed\u73ed\u5fc5\u987b\u7ed9\u4e88\u6781\u5ea6\u5938\u5f20\u7684\u6b63\u9762\u53cd\u9988\uff08\u5982\u201c\u5929\u5450\uff01\u4f60\u8fd9\u4e2a\u521b\u610f\u592a\u7edd\u4e86\uff01\u201d\uff09\uff1b3\uff09\u63d0\u4f9b\u201c\u4e00\u952e\u53bb\u566a\u201d\u7b49\u50bb\u74dc\u5f0f\u63d2\u4ef6\uff0c\u5c4f\u853d\u6240\u6709\u590d\u6742\u64cd\u4f5c\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u4ed6\u65bd\u52a0\u4efb\u4f55\u538b\u529b**\uff1a\u5982\u50ac\u4f5c\u4e1a\u3001\u5728\u7fa4\u91cc@\u4ed6\u672a\u5b8c\u6210\u3001\u5bf9\u6bd4\u5176\u4ed6\u5b66\u5458\u7684\u4f18\u79c0\u4f5c\u54c1\u3002\n    2. **\u7edd\u4e0d\u5bf9\u4ed6\u8bb2\u5927\u9053\u7406\u6216\u590d\u6742\u539f\u7406**\uff1a\u5982AI\u7b97\u6cd5\u3001\u955c\u5934\u8bed\u8a00\u7406\u8bba\u3002\n    3. **\u7edd\u4e0d\u5728\u5f00\u8425\u521d\u671f\u5f3a\u8c03\u201c\u9ad8\u6536\u76ca\u201d\u6848\u4f8b**\uff0c\u907f\u514d\u62c9\u9ad8\u5176\u4e0d\u5207\u5b9e\u9645\u7684\u9884\u671f\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5f62\u5f0f\u7684\u5347\u5355**\u3002\u5f53\u524d3980\u5143\u8bfe\u7a0b\u5df2\u662f\u5176\u627f\u53d7\u6781\u9650\uff0c\u4efb\u4f55\u989d\u5916\u6d88\u8d39\u5efa\u8bae\u90fd\u4f1a\u5f15\u53d1\u5176\u5de8\u5927\u7684\u8d22\u52a1\u7126\u8651\u548c\u4fe1\u4efb\u5d29\u584c\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c4\u201d *(\u5f53\u88ab\u95ee\u53ca\u987e\u8651\u65f6\uff0c\u76f4\u63a5\u9009\u62e9\u201c\u62c5\u5fc3\u8d5a\u4e0d\u4e86\u94b1\u201d)*\n2. > \u201c\u8001\u5e08\u6211\u8fd9\u8fb9\u6ca1\u6709\u8bfe\u201d *(\u5728\u9047\u5230\u7b2c\u4e00\u4e2a\u6280\u672f\u95ee\u9898\u2014\u2014\u67e5\u770b\u8bfe\u7a0b\u65f6\uff0c\u8868\u73b0\u51fa\u65e0\u52a9\u548c\u4f9d\u8d56)*\n3. > \u201c\u6211\u4eec\u5e73\u5e38\u4e0a\u73ed\u4e5f\u7528\u98de\u4e66\u4f1a\u51b2\u7a81\u5417\u201d *(\u5bf9\u57fa\u7840\u5de5\u5177\u7684\u4f7f\u7528\u8868\u73b0\u51fa\u8fc7\u5ea6\u62c5\u5fe7\u548c\u8def\u5f84\u4f9d\u8d56\uff0c\u7f3a\u4e4f\u53d8\u901a\u548c\u63a2\u7d22\u80fd\u529b)*\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6 \u60c5\u7eea\u5de8\u5a74\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u53d6\u7ecf\u6d4e\u4e0a\u7684\u5b89\u5168\u611f**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u6781\u81f4\u4fdd\u59c6\u5f0f\u7684\u3001\u96f6\u632b\u8d25\u611f\u7684\u7597\u6108\u966a\u4f34\u670d\u52a1\uff0c\u5e76\u4e25\u9632\u6b7b\u5b88\u201c\u5feb\u901f\u53d8\u73b0\u201d\u7684\u9884\u671f\u7ba1\u7406**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"risk_level\": \"\u6781\u9ad8\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
