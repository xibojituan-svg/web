    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a (UID: 677144822)\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u4e2d\u4f4e**\u3002\u7528\u6237\u8868\u73b0\u51fa\u5174\u8da3\u4e0e\u5c1d\u8bd5\u610f\u613f\uff08\u5982\u8be2\u95ee\u8bd5\u97f3\u3001\u9009\u62e9\u201c\u753b\u672c\u201d\u5de5\u79cd\uff09\uff0c\u4f46\u6838\u5fc3\u9a71\u52a8\u529b\u4e3a**\u77ed\u671f\u517c\u804c\u53d8\u73b0**\uff08\u201c\u4e0d\u6e05\u695a\u8d5a\u4e0d\u8d5a\u56de\u6765\u94b1\u201d\uff09\uff0c\u5bf9\u884c\u4e1a\u8ba4\u77e5\u6d45\uff08\u201c\u7801\u7387\u90fd\u4e0d\u592a\u61c2\u201d\uff09\uff0c\u7f3a\u4e4f\u957f\u671f\u804c\u4e1a\u89c4\u5212\u4e0e\u5185\u5728\u70ed\u7231\u9a71\u52a8\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u6781\u4f4e**\u3002**\u5173\u952e\u4fe1\u53f7\uff1a\u7528\u6237\u81ea\u8ff0\u201c\u6ee1\u6253\u6ee1\u7b97\u53ea\u67094000\u591a\u5757\uff0c\u6211\u8fd8\u8981\u751f\u6d3b\u201d\u3002** \u652f\u4ed83980\u5143\u8bfe\u7a0b\u8d39\u540e\uff0c\u5176\u6d41\u52a8\u8d44\u91d1\u5c06\u6240\u5269\u65e0\u51e0\uff0c\u6297\u98ce\u9669\u80fd\u529b\u6781\u5f31\u3002\u65f6\u95f4\u8d44\u6e90\u4ec5\u5230\u6691\u5047\u524d\uff08\u201c\u4e0b\u534a\u5e74\u4f1a\u53bb\u522b\u7684\u5730\u65b9\u53d1\u5c55\u201d\uff09\uff0c\u540e\u7eed\u4e0d\u7a33\u5b9a\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u4f4e**\u3002\u8868\u73b0\u4e3a**\u9ad8\u4f9d\u8d56\u3001\u4f4e\u81ea\u4fe1\u3001\u56de\u907f\u578b\u4eba\u683c**\u3002\u591a\u6b21\u8868\u8fbe\u201c\u5bb3\u6015\u81ea\u5df1\u505a\u7684\u51b3\u5b9a\u4e0d\u5bf9\u201d\u3001\u201c\u4e3b\u8981\u662f\u6211\u6bd4\u8f83\u5185\u5411\uff0c\u4e0d\u662f\u5f88\u559c\u6b22\u8ddf\u4eba\u6253\u4ea4\u9053\u201d\u3001\u201c\u4e0d\u662f\u5f88\u4f1a\u641e\u5173\u7cfb\u201d\u3002\u51b3\u7b56\u9700\u5916\u90e8\u786e\u8ba4\uff08\u201c\u8ddf\u5bb6\u91cc\u5546\u91cf\u201d\uff09\uff0c\u9762\u5bf9\u6280\u672f\u672f\u8bed\uff08\u7801\u7387\uff09\u548c\u793e\u4ea4\u73af\u8282\uff08\u201c\u8ddf\u4eba\u6253\u4ea4\u9053\u7684\u4e8b\u591a\u5417\uff1f\u201d\uff09\u8868\u73b0\u51fa\u754f\u96be\u4e0e\u9000\u7f29\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: \u5df2\u652f\u4ed8\u3002\u652f\u4ed8\u91d1\u989d3980\u5143\uff08\u7cbe\u82f1\u7248\uff09\uff0c\u7528\u6237\u786e\u8ba4\u4e86\u5b98\u65b9\u786e\u8ba4\u51fd\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u5bb6\u5ead\u975e\u77e5\u60c5\u540c\u610f\uff0c\u7528\u6237\u81ea\u4e3b\u51b3\u7b56\u4f46\u627f\u53d7\u5bb6\u5ead\u538b\u529b**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u7236\u6bcd\u6bd4\u8f83\u4fdd\u5b88\u201d\uff0c\u4e14\u9500\u552e\u5efa\u8bae\u201c\u5148\u4e0d\u8981\u8ddf\u4ed6\u4eec\u8bb2...\u505a\u51fa\u6210\u7ee9\u4e86\u518d\u8ddf\u4ed6\u4eec\u8bf4\u201d\u3002**\u6b64\u4e3a\u7528\u6237\u540e\u7eed\u9000\u8d39\u7684\u91cd\u5927\u6f5c\u5728\u98ce\u9669\u70b9\u3002**\n*   **\u6b65\u9aa42 - \u4e09\u8f74\u5b9a\u4f4d**:\n    *   **\u52a8\u673a (M)**: \u4e2d\u4f4e (2\u5206) - \u77ed\u671f\u53d8\u73b0\u9a71\u52a8\uff0c\u975e\u5185\u5728\u70ed\u7231\u3002\n    *   **\u8d44\u6e90 (R)**: \u6781\u4f4e (1\u5206) - \u8d22\u52a1\u6fd2\u4e34\u67af\u7aed\uff0c\u65f6\u95f4\u7a97\u53e3\u77ed\u3002\n    *   **\u5f39\u6027 (E)**: \u4f4e (2\u5206) - \u9ad8\u4f9d\u8d56\u3001\u4f4e\u81ea\u4fe1\u3001\u56de\u907f\u793e\u4ea4\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**: **D\u7c7b\u7528\u6237 (M\u4f4e, R\u4f4e, E\u4f4e)**\u3002\u5c5e\u4e8e\u9ad8\u98ce\u9669\u3001\u4f4e\u4ef7\u503c\u7528\u6237\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b: T7 \u8d44\u6e90\u67af\u7aed\u7684\u6295\u673a\u8005**\u3002\n    *   **\u6838\u5fc3\u7279\u5f81**: \u8d44\u6e90\u4e25\u91cd\u4e0d\u8db3\uff08\u8d22\u52a1\u3001\u65f6\u95f4\uff09\uff0c\u52a8\u673a\u4ee5\u77ed\u671f\u5feb\u901f\u53d8\u73b0\u4e3a\u4e3b\uff0c\u5fc3\u7406\u5f39\u6027\u5dee\uff0c\u4f9d\u8d56\u6027\u5f3a\uff0c\u51b3\u7b56\u53d7\u5916\u90e8\u538b\u529b\uff08\u5bb6\u5ead\uff09\u5f71\u54cd\u3002\n    *   **\u543b\u5408\u70b9**:\n        1.  **\u8d22\u52a1\u67af\u7aed**: \u652f\u4ed8\u540e\u751f\u6d3b\u8d39\u7d27\u5f20\u3002\n        2.  **\u65f6\u95f4\u6709\u9650**: \u4ec5\u6691\u5047\u524d\u6709\u7a7a\uff0c\u672a\u6765\u4e0d\u7a33\u5b9a\u3002\n        3.  **\u6295\u673a\u5fc3\u6001**: \u6838\u5fc3\u5173\u5207\u662f\u201c\u8d5a\u4e0d\u8d5a\u56de\u6765\u94b1\u201d\uff0c\u5bf9\u5b66\u4e60\u8fc7\u7a0b\u548c\u884c\u4e1a\u6311\u6218\u8ba4\u77e5\u4e0d\u8db3\u3002\n        4.  **\u4f9d\u8d56\u4e0e\u56de\u907f**: \u5f3a\u70c8\u4f9d\u8d56\u9500\u552e\u5f15\u5bfc\uff0c\u56de\u907f\u793e\u4ea4\u4e0e\u590d\u6742\u64cd\u4f5c\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u6781\u9ad8)\n*   **\u98ce\u9669\u7b49\u7ea7: \u6781\u9ad8**\u3002\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u6548\u679c\u4e0d\u53ca\u9884\u671f**: **\u9ad8**\u3002\u7528\u6237\u671f\u671b\u5feb\u901f\u53d8\u73b0\uff0c\u4f46\u81ea\u8eab\u57fa\u7840\u5f31\u3001\u65f6\u95f4\u77ed\u3001\u6027\u683c\u5185\u5411\uff0c\u5b9e\u9645\u5b66\u4e60\u5468\u671f\u957f\u3001\u63a5\u5355\u7ade\u4e89\u6fc0\u70c8\uff0c\u6781\u6613\u4ea7\u751f\u201c\u5b66\u5b8c\u8d5a\u4e0d\u5230\u94b1\u201d\u7684\u843d\u5dee\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**: **\u6781\u9ad8**\u3002**\u652f\u4ed8\u540e\u751f\u6d3b\u8d39\u4ec5\u5269\u51e0\u767e\u5143**\uff0c\u4efb\u4f55\u610f\u5916\u5f00\u652f\u6216\u53d8\u73b0\u5ef6\u8fdf\u90fd\u5c06\u5bfc\u81f4\u4e25\u91cd\u7ecf\u6d4e\u7126\u8651\uff0c\u662f\u9000\u8d39\u6700\u76f4\u63a5\u7684\u5bfc\u706b\u7d22\u3002\n    3.  **\u5bb6\u5ead\u53cd\u5bf9**: **\u9ad8**\u3002\u5bb6\u5ead\u4e0d\u77e5\u60c5\u4e14\u4fdd\u5b88\uff0c\u4e00\u65e6\u77e5\u60c5\u53ef\u80fd\u65bd\u538b\u9000\u8d39\u3002\n    4.  **\u65f6\u95f4\u51b2\u7a81**: **\u9ad8**\u3002\u7528\u6237\u8ba1\u5212\u201c\u4e0b\u534a\u5e74\u53bb\u522b\u7684\u5730\u65b9\u53d1\u5c55\u201d\uff0c\u5b66\u4e60\u4e0e\u672a\u6765\u89c4\u5212\u5b58\u5728\u51b2\u7a81\u98ce\u9669\u3002\n    5.  **\u5b66\u4e60\u754f\u96be**: **\u4e2d\u9ad8**\u3002\u5df2\u8868\u73b0\u51fa\u5bf9\u6280\u672f\uff08\u7801\u7387\uff09\u548c\u793e\u4ea4\u7684\u754f\u96be\u60c5\u7eea\uff0c\u540e\u7eed\u8bfe\u7a0b\u96be\u5ea6\u63d0\u5347\u53ef\u80fd\u5f15\u53d1\u9000\u7f29\u3002\n    6.  **\u793e\u4ea4\u4e0d\u9002**: **\u4e2d**\u3002\u5bf9\u201c\u641e\u5173\u7cfb\u201d\u3001\u201c\u6253\u4ea4\u9053\u201d\u6709\u987e\u8651\uff0c\u800c\u884c\u4e1a\u63a5\u5355\u3001\u534f\u4f5c\u9700\u8981\u4e00\u5b9a\u6c9f\u901a\u3002\n    7.  **\u88ab\u8bf1\u5bfc\u611f**: **\u4e2d**\u3002\u9500\u552e\u5b58\u5728**\u8fc7\u5ea6\u627f\u8bfa\u5acc\u7591**\uff08\u5982\u201c\u5b89\u6392\u5230\u5de5\u4f5c\u5ba4\u201d\u3001\u201c\u8003\u517c\u804c\u6559\u52a1\u201d\uff09\uff0c\u53ef\u80fd\u57cb\u4e0b\u201c\u627f\u8bfa\u672a\u5151\u73b0\u201d\u7684\u6295\u8bc9\u9690\u60a3\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u4e3b\u8981\u96f7\u533a**:\n    1.  **\u3010\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u8bf1\u5bfc\u3011**: \u9500\u552e\u8bed\u97f3\u4e2d\u63d0\u53ca\u201c\u5b89\u6392\u5230\u6211\u4eec\u81ea\u5df1\u7684\u5de5\u4f5c\u5ba4\u201d\u3001\u201c\u8003\u517c\u804c\u7684\u6559\u52a1\u7ec4\u5de5\u4f5c\u201d\uff0c**\u6b64\u4e3a\u975e\u6807\u51c6\u5316\u3001\u4e0d\u786e\u5b9a\u6027\u7684\u5c31\u4e1a\u627f\u8bfa\uff0c\u6d89\u5acc\u8bf1\u5bfc\u62a5\u540d**\u3002\n    2.  **\u3010\u5ffd\u89c6\u7528\u6237\u652f\u4ed8\u80fd\u529b\u3011**: \u5728\u660e\u77e5\u7528\u6237\u201c\u4ec5\u52694000\u591a\u5757\u201d\u9700\u7528\u4e8e\u751f\u6d3b\u7684\u60c5\u51b5\u4e0b\uff0c\u4ecd\u63a8\u52a8\u5176\u652f\u4ed83980\u5143\u8bfe\u7a0b\u8d39\uff0c**\u672a\u5145\u5206\u8bc4\u4f30\u5176\u8d22\u52a1\u98ce\u9669\uff0c\u8fdd\u80cc\u9002\u5f53\u6027\u539f\u5219**\u3002\n    3.  **\u3010\u89c4\u907f\u5bb6\u5ead\u76d1\u7763\u3011**: \u5efa\u8bae\u7528\u6237\u201c\u5148\u4e0d\u8981\u8ddf\u5bb6\u4eba\u8bb2\u201d\uff0c**\u6b64\u884c\u4e3a\u89c4\u907f\u4e86\u5bb6\u5ead\u77e5\u60c5\u540c\u610f\uff0c\u5c06\u7528\u6237\u7f6e\u4e8e\u5bb6\u5ead\u77db\u76fe\u98ce\u9669\u4e2d\uff0c\u4e0d\u5408\u89c4**\u3002\n    4.  **\u3010\u672a\u5145\u5206\u63d0\u793a\u98ce\u9669\u3011**: \u6c9f\u901a\u4e2d\u672a\u9488\u5bf9\u7528\u6237\u201c\u65f6\u95f4\u6709\u9650\u201d\u3001\u201c\u6027\u683c\u5185\u5411\u201d\u3001\u201c\u8d22\u52a1\u7d27\u5f20\u201d\u7b49\u7279\u8d28\uff0c\u5ba2\u89c2\u63d0\u793a\u6709\u58f0\u884c\u4e1a\u53d8\u73b0\u5468\u671f\u3001\u96be\u5ea6\u53ca\u53ef\u80fd\u7684\u4e0d\u9002\u914d\u98ce\u9669\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**: **\u9519\u914d**\u3002\u7528\u6237\u5f53\u524d\u7684\u8d44\u6e90\u72b6\u51b5\uff08\u8d22\u52a1\u3001\u65f6\u95f4\uff09\u548c\u5fc3\u7406\u7279\u8d28\uff08\u4f4e\u5f39\u6027\u3001\u56de\u907f\u578b\uff09\u4e0e\u9700\u8981\u957f\u671f\u6295\u5165\u3001\u4e3b\u52a8\u4e89\u53d6\u3001\u5177\u5907\u4e00\u5b9a\u6297\u538b\u80fd\u529b\u7684\u6709\u58f0\u6f14\u64ad\u804c\u4e1a\u8def\u5f84\u4e25\u91cd\u4e0d\u5339\u914d\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **\u542f\u52a8\u9ad8\u98ce\u9669\u9884\u8b66\uff0c\u91cd\u70b9\u5b89\u629a\u4e0e\u964d\u4f4e\u9884\u671f**\u3002\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**:\n    1.  **24\u5c0f\u65f6\u5185\u7d27\u6025\u4ecb\u5165**: \u73ed\u4e3b\u4efb\u9700\u7acb\u5373\u8054\u7cfb\uff0c\u9996\u8981\u5173\u6ce8\u5176**\u652f\u4ed8\u540e\u7684\u751f\u6d3b\u5b89\u6392\u4e0e\u5fc3\u7406\u72b6\u6001**\uff0c\u8868\u8fbe\u5173\u6000\uff0c\u5efa\u7acb\u4fe1\u4efb\u3002\n    2.  **\u6821\u6b63\u53d8\u73b0\u9884\u671f**: \u5728\u9996\u6b21\u6c9f\u901a\u4e2d\uff0c\u5fc5\u987b\u660e\u786e\u3001\u53cd\u590d\u5f3a\u8c03**\u5b66\u4e60\u5468\u671f\u3001\u53d8\u73b0\u7684\u4e0d\u786e\u5b9a\u6027\u4ee5\u53ca\u524d\u671f\u6295\u5165\u7684\u5fc5\u8981\u6027**\u3002\u907f\u514d\u4efb\u4f55\u201c\u5feb\u901f\u8d5a\u94b1\u201d\u7684\u8bdd\u672f\uff0c\u5f15\u5bfc\u5176\u5173\u6ce8\u6280\u80fd\u6210\u957f\u672c\u8eab\u3002\n    3.  **\u5efa\u7acb\u4f4e\u538b\u529b\u5b66\u4e60\u8ba1\u5212**: \u9488\u5bf9\u5176\u65f6\u95f4\u7a97\u53e3\uff08\u5230\u6691\u5047\uff09\uff0c\u5e2e\u52a9\u5236\u5b9a\u4e00\u4e2a**\u52a1\u5b9e\u3001\u7d27\u51d1\u3001\u4ee5\u638c\u63e1\u57fa\u7840\u6280\u80fd\u4e3a\u6838\u5fc3**\u7684\u5b66\u4e60\u8ba1\u5212\uff0c\u800c\u975e\u5f3a\u8c03\u63a5\u5355\u91cf\u3002\n    4.  **\u63d0\u4f9b\u60c5\u611f\u652f\u6301\u4e0e\u7b80\u5355\u4efb\u52a1**: \u56e0\u5176\u5185\u5411\u3001\u4f9d\u8d56\u6027\u5f3a\uff0c\u9700\u7ed9\u4e88\u66f4\u591a\u9f13\u52b1\u548c\u6e05\u6670\u7684\u6b65\u9aa4\u6307\u5bfc\u3002\u521d\u671f\u53ef\u5f15\u5bfc\u53c2\u4e0e\u201c\u753b\u672c\u201d\u3001\u201c\u5bf9\u8f68\u201d\u7b49\u4f4e\u793e\u4ea4\u3001\u6613\u4e0a\u624b\u7684\u659c\u6760\u5de5\u79cd\u5efa\u7acb\u4fe1\u5fc3\u3002\n    5.  **\u98ce\u9669\u76d1\u63a7\u4e0e\u9884\u6848**: \u6807\u8bb0\u4e3a**\u6781\u9ad8\u98ce\u9669\u7528\u6237**\u3002\u5bc6\u5207\u89c2\u5bdf\u5176\u5b66\u4e60\u6295\u5165\u5ea6\u3001\u60c5\u7eea\u53d8\u5316\u53ca\u7ecf\u6d4e\u72b6\u51b5\u53cd\u9988\u3002\u63d0\u524d\u51c6\u5907\u5e94\u5bf9\u5176\u53ef\u80fd\u56e0\u7ecf\u6d4e\u538b\u529b\u6216\u5bb6\u5ead\u5e72\u9884\u63d0\u51fa\u7684\u9000\u8d39\u54a8\u8be2\uff0c**\u786e\u4fdd\u6c9f\u901a\u7559\u75d5\uff0c\u6240\u6709\u627f\u8bfa\u4ee5\u5b98\u65b9\u786e\u8ba4\u51fd\u4e3a\u51c6**\u3002\n    6.  **\u4f26\u7406\u8865\u6551**: \u5728\u540e\u7eed\u670d\u52a1\u4e2d\uff0c\u5e94\u59d4\u5a49\u5efa\u8bae\u7528\u6237\u4e0e\u5bb6\u4eba\u4fdd\u6301\u826f\u597d\u6c9f\u901a\uff0c\u53ef\u5206\u4eab\u5b66\u4e60\u6210\u679c\u4ee5\u83b7\u5f97\u652f\u6301\uff0c\u907f\u514d\u9690\u7792\u9020\u6210\u7684\u540e\u7eed\u7ea0\u7eb7\u3002\n\n{\"core_type\": \"T7 \u8d44\u6e90\u67af\u7aed\u7684\u6295\u673a\u8005\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"product_match\": \"\u9519\u914d\", \"action\": \"\u542f\u52a8\u9ad8\u98ce\u9669\u9884\u8b66\uff0c\u91cd\u70b9\u5b89\u629a\u4e0e\u964d\u4f4e\u9884\u671f\"}";
