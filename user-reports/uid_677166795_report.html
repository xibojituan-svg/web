    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677166795\uff08\u6db5\u5b50\uff09\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677166795 (\u6635\u79f0\uff1a\u6db5\u5b50) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5fae\u6f9c\u5b66\u59d0-\u5b98\u65b9\u62db\u52df\u5b98\uff08\u8def\u4e91\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u7cbe\u82f1\u8bfe\u7a0b\uff08\u4e24\u4e2a\u6708\uff09\uff0c\u4ef7\u683c3980\u5143 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3**\uff08\u82b1\u5457\u989d\u5ea6\u4e0d\u8db3\uff0c\u9700\u7ec4\u5408\u652f\u4ed8\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u8d76\u8f66\u3001\u8003\u8bd5\uff0c\u65f6\u95f4\u4e0d\u7a33\u5b9a\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\uff08\u672a\u63d0\u53ca\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\uff08\u6709\u5b66\u4e60\u884c\u4e3a\u3001\u652f\u4ed8\u884c\u4e3a\uff0c\u4f46\u6df1\u5ea6\u5fc3\u7406\u548c\u5bb6\u5ead\u4fe1\u606f\u4e0d\u8db3\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u6709\u660e\u786e\u7684\u53d8\u73b0\u8bc9\u6c42\uff08\u8be2\u95ee\u201c\u6211\u5565\u65f6\u5019\u53ef\u4ee5\u63a5\u5355\u6765\u7740\u201d\uff09\uff0c\u4f46\u540c\u65f6\u4e5f\u8868\u73b0\u51fa\u5bf9\u8bfe\u7a0b\u5185\u5bb9\uff08\u5f55\u97f3\u3001\u753b\u672c\uff09\u7684\u5174\u8da3\u548c\u914d\u5408\u5ea6\uff0c\u5e76\u975e\u7eaf\u7cb9\u201c\u51e0\u5929\u63d0\u73b0\u201d\u7684\u6781\u7aef\u529f\u5229\u5fc3\u6001\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u5565\u65f6\u5019\u53ef\u4ee5\u63a5\u5355\u6765\u7740 \u8fd8\u6b3e[\u82e6\u6da9][\u82e6\u6da9]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u652f\u4ed83980\u5143\u8bfe\u7a0b\u8d39\u65f6\uff0c\u82b1\u5457\u989d\u5ea6\u4ec52200\u5143\uff0c\u9700\u9500\u552e\u6307\u5bfc\u201c\u5206\u4e24\u7b14\u4ed8\u201d\uff0c\u4e14\u660e\u786e\u8868\u793a\u201c\u94f6\u884c\u5361\u6ca1\u90a3\u4e48\u591a\u201d\uff0c\u5b58\u5728\u660e\u663e\u7684\u8d44\u91d1\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\uff0c\u4f46\u591a\u6b21\u56e0\u201c\u8d76\u8f66\u201d\u3001\u201c\u8003\u8bd5\u201d\u5f71\u54cd\u53c2\u4e0e\uff0c\u65f6\u95f4\u4e0d\u7a33\u5b9a\uff0c\u5448\u788e\u7247\u5316\u7279\u5f81\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u27a1\u4e2d**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a**\u3002\u9762\u5bf9\u652f\u4ed8\u56f0\u96be\u3001\u64cd\u4f5c\u95ee\u9898\uff08\u9886\u53d6\u7248\u6743\u4e66\uff09\u65f6\uff0c\u4f1a\u8868\u8fbe\u201c\u545c\u545c\u545c\u201d\u3001\u201c\u548b\u4e2a\u4ed8\u54c7\u201d\u3001\u201c\u9886\u53d6\u4e0d\u4e86\u54e6\u201d\u7b49\u6c42\u52a9\u4fe1\u53f7\uff0c\u4f46\u60c5\u7eea\u7a33\u5b9a\uff0c\u80fd\u63a5\u53d7\u6307\u5bfc\u5e76\u89e3\u51b3\u95ee\u9898\uff0c\u672a\u89c1\u5d29\u6e83\u6216\u653e\u5f03\u8ff9\u8c61\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u545c\u545c\u545c\uff0c\u82b1\u5457\u989d\u5ea6\u4e0d\u591f\uff0c\u83ab\u6709mony[\u82e6\u6da9][\u82e6\u6da9]\u201d > \u201c\u8fd8\u662f\u9886\u53d6\u4e0d\u4e86\u54e6\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u7ecf\u6d4e\u4e0d\u7a33\u5b9a\u5e26\u6765\u7684\u7126\u8651**\u3002\u7528\u6237\u652f\u4ed8\u65f6\u8d44\u91d1\u7d27\u5f20\uff0c\u4e14\u4ed8\u6b3e\u540e\u7acb\u523b\u8ffd\u95ee\u63a5\u5355\u65f6\u95f4\u5e76\u63d0\u53ca\u201c\u8fd8\u6b3e\u201d\uff0c\u8868\u660e\u5176\u62a5\u540d\u884c\u4e3a\u5e26\u6709\u8f83\u5f3a\u7684\u7ecf\u6d4e\u6539\u5584\u52a8\u673a\uff0c\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u83b7\u5f97\u517c\u804c\u6536\u5165\u4ee5\u7f13\u89e3\u8d22\u52a1\u538b\u529b\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u660e\u786e\u7684\u8def\u5f84\u5b89\u5168\u611f\u548c\u9636\u6bb5\u6027\u6210\u679c\u53cd\u9988**\u3002\u4ed6\u9700\u8981\u6e05\u6670\u7684\u201c\u63a5\u5355-\u53d8\u73b0\u201d\u8def\u5f84\u56fe\uff0c\u4ee5\u53ca\u8fc7\u7a0b\u4e2d\u7684\u5fae\u5c0f\u6210\u529f\u6fc0\u52b1\uff0c\u6765\u5bf9\u51b2\u5176\u5bf9\u6295\u5165\uff08\u91d1\u94b1\u3001\u65f6\u95f4\uff09\u53ef\u80fd\u65e0\u6cd5\u6536\u56de\u7684\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u8bba** (\u52a8\u673a\u4e2d\u7b49\u3001\u8d44\u6e90\u5e95\u5ea7\u4f4e\u3001\u5fc3\u7406\u5f39\u6027\u4e2d\u7b49\uff0c\u7b26\u5408T4\u7279\u5f81) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 **\u5b89\u5168\u672a\u89e6\u53d1**\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u7528\u6237\u867d\u4f7f\u7528\u82b1\u5457\u4e14\u989d\u5ea6\u4e0d\u8db3\uff0c\u4f46\u672a\u51fa\u73b0\u201c\u501f\u94b1\u62a5\u540d\u201d\u3001\u201c\u4e0d\u9000\u6b3e\u5c31XX\u201d\u7b49\u6781\u7aef\u8a00\u8bba\uff0c\u4e14\u652f\u4ed8\u884c\u4e3a\u5728\u9500\u552e\u5f15\u5bfc\u4e0b\u5b8c\u6210\uff0c\u6682\u672a\u89e6\u53caT8-D\u7edd\u8def\u8d4c\u5f92\u7ea2\u7ebf\u3002**\u4f46\u9700\u9ad8\u5ea6\u8b66\u60d5\u5176\u7ecf\u6d4e\u538b\u529b\u5411\u60c5\u7eea\u5d29\u6e83\uff08T6\uff09\u6216\u6781\u7aef\u884c\u4e3a\uff08T8-D\uff09\u7684\u6f14\u53d8\u3002**\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u7ecf\u6d4e\u538b\u529b\u53ef\u80fd\u6e90\u4e8e\u5bb6\u5ead\uff0c\u82e5\u5bb6\u4eba\u53cd\u5bf9\u6216\u53d1\u73b0\u5176\u501f\u8d37\u5b66\u4e60\uff0c\u6613\u5f15\u53d1\u51b2\u7a81\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u65f6\u95f4\u788e\u7247\u5316\uff0c\u82e5\u8bfe\u7a0b\u8282\u594f\u7d27\u51d1\u3001\u4f5c\u4e1a\u91cf\u5927\uff0c\u53ef\u80fd\u56e0\u201c\u8d76\u4e0d\u4e0a\u8fdb\u5ea6\u201d\u800c\u79ef\u7d2f\u632b\u8d25\u611f\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u76ee\u524d\u5fc3\u7406\u5f39\u6027\u5c1a\u53ef\uff0c\u80fd\u4e3b\u52a8\u6c9f\u901a\u95ee\u9898\u3002\u4f46\u82e5\u63a5\u5355\u4e0d\u987a\u6216\u9047\u5230\u590d\u6742\u6280\u672f\u95ee\u9898\u65e0\u4eba\u53ca\u65f6\u89e3\u51b3\uff0c\u53ef\u80fd\u89e6\u53d1\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669\uff01** \u5bf9\u201c\u63a5\u5355\u8fd8\u6b3e\u201d\u62b1\u6709\u6025\u5207\u671f\u671b\u3002\u82e5\u5f00\u8bfe\u540e1-2\u4e2a\u6708\u5185\u672a\u80fd\u83b7\u5f97\u4efb\u4f55\u5b9e\u8d28\u6027\u7684\u63a5\u5355\u673a\u4f1a\u6216\u5fae\u5c0f\u6536\u5165\uff0c\u6781\u6613\u56e0\u201c\u6295\u5165\u4ea7\u51fa\u6bd4\u5931\u8861\u201d\u800c\u66b4\u6012\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c4-8\u5468**\uff08\u5373\u627f\u8bfa\u201c\u5f00\u653e\u63a5\u5355\u5e73\u53f0\u201d\u540e\uff0c\u82e5\u8fdf\u8fdf\u65e0\u5355\u53ef\u63a5\u6216\u8bd5\u97f3\u5c61\u6b21\u5931\u8d25\u65f6\uff09\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6db5\u5b50\u4f60\u597d\u5440\uff01\u770b\u5230\u4f60\u4e3a\u4e86\u5b66\u4e60\u53c8\u662f\u8d76\u8f66\u53c8\u662f\u8003\u8bd5\u7684\uff0c\u771f\u7684\u592a\u62fc\u4e86\uff01\u54b1\u4eec\u4e0d\u7740\u6025\uff0c\u5b66\u4e60\u662f\u573a\u9a6c\u62c9\u677e\u3002\u6211\u5148\u7ed9\u4f60\u4e00\u4efd\u6e05\u6670\u7684\u2018\u65b0\u624b\u63a5\u5355\u8def\u7ebf\u56fe\u2019\uff0c\u54b1\u4eec\u4e00\u6b65\u6b65\u6765\uff0c\u6bcf\u5b8c\u6210\u4e00\u4e2a\u5c0f\u76ee\u6807\uff0c\u79bb\u2018\u8fd8\u6b3e\u2019\u5c31\u66f4\u8fd1\u4e00\u6b65\u3002\u6709\u4efb\u4f55\u5361\u4f4f\u7684\u5730\u65b9\uff0c\u968f\u65f6\u558a\u6211\uff0c\u6211\u5e2e\u4f60\u4e00\u8d77\u641e\u5b9a\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5feb\u901f\u63a5\u5355\u7ebf**\u3011\u3002\u6838\u5fc3\u8bc9\u6c42\u662f\u53d8\u73b0\uff0c\u5fc5\u987b\u4f18\u5148\u6ee1\u8db3\u3002\u8bfe\u7a0b\u5185\u5bb9\u9700\u7d27\u5bc6\u56f4\u7ed5\u201c\u5982\u4f55\u63a5\u5230\u7b2c\u4e00\u5355\u201d\u5c55\u5f00\uff0c\u5f3a\u5316\u5b9e\u64cd\u548c\u6d3e\u5355\u673a\u4f1a\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\uff0c\u8865\u5145\u3010**\u65f6\u95f4\u7ba1\u7406\u8f85\u52a9\u5305**\u3011\uff08\u5982\u5f55\u64ad\u91cd\u70b9\u5207\u7247\u3001\u788e\u7247\u65f6\u95f4\u5b66\u4e60\u6307\u5357\uff09\u3002\u9488\u5bf9\u5176\u8d44\u6e90\u5e95\u5ea7\u4f4e\uff0c\u8865\u5145\u3010**\u624b\u673a\u4f18\u5148\u8f7b\u91cf\u5316\u5de5\u5177\u5305**\u3011\uff08\u907f\u514d\u63a8\u8350\u6602\u8d35\u7535\u8111\u8bbe\u5907\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a**\u753b\u4e0d\u5207\u5b9e\u9645\u7684\u5927\u997c**\uff08\u5982\u201c\u5b66\u5b8c\u9a6c\u4e0a\u6708\u5165\u8fc7\u4e07\u201d\uff09\uff1b\u5728\u5176\u9047\u5230\u64cd\u4f5c\u56f0\u96be\u65f6\uff0c\u53ea\u53d1\u6559\u7a0b\u94fe\u63a5\u800c\u4e0d\u63d0\u4f9b\u201c\u6309\u952e\u7ea7\u201d\u6307\u5bfc\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u57fa\u7840\u6280\u80fd\u672a\u638c\u63e1\u3001\u7b2c\u4e00\u5355\u672a\u843d\u5730\u524d\u8fdb\u884c\u4efb\u4f55\u5927\u989d\u5347\u5355\u63a8\u4ecb**\u3002\u53ef\u8003\u8651500\u5143\u4ee5\u5185\u7684\u5fae\u5347\uff08\u5982\u9488\u5bf9\u6027\u5f3a\u7684\u77ed\u8bad\u8425\uff09\uff0c\u4e14\u5fc5\u987b\u4e0e\u201c\u63d0\u5347\u63a5\u5355\u6210\u529f\u7387\u201d\u5f3a\u76f8\u5173\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u545c\u545c\u545c\uff0c\u82b1\u5457\u989d\u5ea6\u4e0d\u591f\uff0c\u83ab\u6709mony[\u82e6\u6da9][\u82e6\u6da9]\u201d \n2. > \u201c\u6211\u5565\u65f6\u5019\u53ef\u4ee5\u63a5\u5355\u6765\u7740 \u8fd8\u6b3e[\u82e6\u6da9][\u82e6\u6da9]\u201d\n3. > \u201c\u6211\u5728\u8d76\u8f66\uff0c\u4fe1\u53f7\u4e0d\u592a\u597d\u53ef\u80fd\u6709\u70b9\u6162 \u5b66\u59d0\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4 \u641e\u94b1\u7ed3\u679c\u8bba\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7ecf\u6d4e\u5b89\u5168\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5728\u5176\u5f00\u8bfe4-8\u5468\u5185\uff0c\u5fc5\u987b\u534f\u52a9\u5176\u5b8c\u6210\u81f3\u5c11\u4e00\u6b21\u5fae\u5c0f\u53d8\u73b0\uff08\u5982\u8bd5\u97f3\u6210\u529f\u3001\u5c0f\u989d\u6d3e\u5355\uff09\uff0c\u7528\u771f\u5b9e\u6536\u76ca\u7a33\u4f4f\u9884\u671f\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u8bba\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf\"}\n```";
