    <script>
        const markdownText = "\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e\u3002\u7f3a\u4e4f\u652f\u4ed8\u4fe1\u606f\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u660e\u786e\u5b66\u4e60\u76ee\u6807\u3001\u7ecf\u6d4e\u72b6\u51b5\u3001\u8fc7\u5f80\u5b66\u4e60\u6295\u5165\u7ec6\u8282\u7b49\u5173\u952e\u7ef4\u5ea6\u3002\n\n# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u4e0e\u98ce\u63a7\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4f4e-\u4e2d)**: \u6709\u660e\u786e\u7684\u5b66\u4e60\u548c\u64cd\u4f5c\u9700\u6c42\uff08\u5b8c\u6210\u4f5c\u4e1a\u3001\u4e0a\u4f20\u4f5c\u54c1\uff09\uff0c\u4f46**\u7f3a\u4e4f\u660e\u786e\u7684\u5b66\u4e60\u76ee\u6807\u6216\u804c\u4e1a\u89c4\u5212\u8868\u8ff0**\u3002\u52a8\u673a\u504f\u5411\u4e8e\u201c\u5b8c\u6210\u4efb\u52a1\u201d\u548c\u201c\u89e3\u51b3\u773c\u524d\u95ee\u9898\u201d\uff0c\u6df1\u5c42\u9a71\u52a8\u529b\uff08\u5982\u804c\u4e1a\u8f6c\u578b\u3001\u5174\u8da3\u53d8\u73b0\uff09\u4e0d\u6e05\u6670\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d-\u4f4e)**: **\u6280\u672f\u64cd\u4f5c\u80fd\u529b\u660e\u663e\u8584\u5f31**\uff0c\u5bf9\u7535\u8111\u3001\u8f6f\u4ef6\uff08AU\u3001\u6587\u4ef6\u7ba1\u7406\u3001\u97f3\u6548\u7ba1\u7406\u5668\u3001\u559c\u9a6c\u62c9\u96c5\u540e\u53f0\uff09\u4f7f\u7528\u4e0d\u719f\u7ec3\uff0c\u9891\u7e41\u9047\u5230\u57fa\u7840\u64cd\u4f5c\u969c\u788d\u3002\u5b66\u4e60\u65f6\u95f4\u6295\u5165\u53ef\u89c1\uff0c\u4f46**\u6548\u7387\u53ef\u80fd\u56e0\u6280\u672f\u95ee\u9898\u800c\u4f4e\u4e0b**\u3002\u66fe\u63d0\u53ca\u201c\u5728\u67d0\u82b1\u5b66\u4e60\u8fc7\uff0c\u5751\u4e86\u4e0d\u5c11\u94b1\u201d\uff0c\u6697\u793a\u6709\u6559\u80b2\u6295\u5165\u5386\u53f2\u4f46\u53ef\u80fd\u6548\u679c\u4e0d\u4f73\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d)**: **\u8868\u73b0\u51fa\u8f83\u9ad8\u7684\u6c42\u52a9\u610f\u613f\u548c\u575a\u6301\u5ea6**\uff0c\u9762\u5bf9\u53cd\u590d\u7684\u6280\u672f\u95ee\u9898\uff08\u5982AU\u64ad\u653e\u95ee\u9898\u3001\u4e0a\u4f20\u5931\u8d25\uff09\u80fd\u6301\u7eed\u5c1d\u8bd5\u5e76\u5bfb\u6c42\u5e2e\u52a9\u3002\u6709\u81ea\u6211\u8c03\u4f83\uff08\u201c\u6211\u771f\u7684\u5f88\u7b28\u201d\uff09\uff0c\u5fc3\u6001\u5c1a\u53ef\uff0c\u4f46**\u9690\u542b\u632b\u8d25\u611f**\uff08\u201c\u65f6\u95f4\u90fd\u803d\u8bef\u5728\u8fd9\u4e0a\u8fb9\u4e86\u201d\u3001\u201c\u65e0\u5948\u201d\uff09\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40: \u652f\u4ed8\u6838\u67e5**: **\u65e0\u6cd5\u5224\u65ad**\u3002\u8bb0\u5f55\u4e2d\u65e0\u4efb\u4f55\u652f\u4ed8\u3001\u4ef7\u683c\u3001\u4f18\u60e0\u3001\u5408\u540c\u7b49\u8d22\u52a1\u76f8\u5173\u4fe1\u606f\u3002\n*   **\u6b65\u9aa41.5: \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u65e0\u6cd5\u5224\u65ad**\u3002\u8bb0\u5f55\u4e2d\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u6210\u5458\u3001\u51b3\u7b56\u8fc7\u7a0b\u6216\u7ecf\u6d4e\u6765\u6e90\u3002\n*   **\u6b65\u9aa41-4 (\u57fa\u4e8e\u73b0\u6709\u4fe1\u606f)**:\n    *   **A\u8f74 (\u652f\u4ed8\u80fd\u529b/\u610f\u613f)**: \u4fe1\u606f\u7f3a\u5931\u3002\n    *   **B\u8f74 (\u5b66\u4e60\u9002\u5e94\u6027)**: **B- (\u9002\u5e94\u56f0\u96be)**\u3002\u7528\u6237\u8868\u73b0\u51fa\u663e\u8457\u7684\u6280\u672f\u9002\u5e94\u4e0d\u826f\uff0c\u64cd\u4f5c\u5b66\u4e60\u66f2\u7ebf\u9661\u5ced\uff0c\u5c5e\u4e8e\u9700\u8981\u9ad8\u5f3a\u5ea6\u624b\u628a\u624b\u652f\u6301\u7684\u201c\u6280\u672f\u5c0f\u767d\u201d\u3002\n    *   **C\u8f74 (\u76ee\u6807\u6e05\u6670\u5ea6)**: **C- (\u76ee\u6807\u6a21\u7cca)**\u3002\u4ea4\u6d41\u96c6\u4e2d\u4e8e\u5177\u4f53\u64cd\u4f5c\u95ee\u9898\uff0c\u672a\u8868\u8fbe\u957f\u671f\u5b66\u4e60\u76ee\u6807\u3001\u804c\u4e1a\u89c4\u5212\u6216\u5bf9\u8bfe\u7a0b\u7684\u4ef7\u503c\u671f\u671b\u3002\n    *   **D\u8f74 (\u884c\u52a8\u529b\u4e0e\u575a\u6301\u5ea6)**: **D+ (\u884c\u52a8\u79ef\u6781\u4f46\u6548\u7387\u53d7\u9650)**\u3002\u7528\u6237\u79ef\u6781\u63d0\u4ea4\u4f5c\u4e1a\u3001\u53c2\u4e0e\u7b54\u7591\u3001\u5c1d\u8bd5\u4e0a\u4f20\u4f5c\u54c1\uff0c\u884c\u52a8\u529b\u5c1a\u53ef\uff0c\u4f46**\u6280\u672f\u74f6\u9888\u4e25\u91cd\u62d6\u6162\u5176\u8fdb\u5ea6\u548c\u6210\u679c\u4ea7\u51fa**\u3002\n\n**\u521d\u6b65\u5224\u5b9a**: \u56e0\u5173\u952e\u652f\u4ed8\u4e0e\u51b3\u7b56\u4fe1\u606f\u7f3a\u5931\uff0c\u65e0\u6cd5\u5b8c\u6210\u5b8c\u6574ABCD\u5206\u7c7b\u3002\u73b0\u6709\u7279\u5f81\u6307\u5411 **\u201c\u9ad8\u4f9d\u8d56\u3001\u4f4e\u57fa\u7840\u201d\u7684\u64cd\u4f5c\u56f0\u96be\u578b\u5b66\u5458**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u6700\u5339\u914d\u539f\u578b: T7 \u6280\u672f\u6050\u60e7\u7684\u6162\u70ed\u8005**\u3002\u6838\u5fc3\u7279\u5f81\uff1a**\u5bf9\u6280\u672f\u5de5\u5177\u548c\u8f6f\u4ef6\u64cd\u4f5c\u5b58\u5728\u663e\u8457\u6050\u60e7\u4e0e\u4e0d\u9002\u5e94**\uff0c\u5b66\u4e60\u8fdb\u5ea6\u4e25\u91cd\u53d7\u5236\u4e8e\u57fa\u7840\u64cd\u4f5c\u95ee\u9898\uff0c\u9700\u8981\u5927\u91cf\u3001\u91cd\u590d\u3001\u7ec6\u81f4\u7684\u6280\u672f\u652f\u6301\u3002\u5b66\u4e60\u52a8\u673a\u53ef\u80fd\u6e90\u4e8e\u5174\u8da3\u6216\u8f7b\u5ea6\u804c\u4e1a\u5c1d\u8bd5\uff0c\u4f46\u88ab\u6280\u672f\u95e8\u69db\u4e25\u91cd\u906e\u853d\u3002\n*   **\u6b21\u5339\u914d\u539f\u578b: T4 \u8ff7\u832b\u63a2\u7d22\u8005**\u3002\u7279\u5f81\uff1a\u76ee\u6807\u4e0d\u660e\u786e\uff0c\u901a\u8fc7\u5c1d\u8bd5\u6027\u5b66\u4e60\u63a2\u7d22\u53ef\u80fd\u6027\uff0c\u5bb9\u6613\u56e0\u632b\u6298\u800c\u653e\u5f03\u3002\u7528\u6237\u66fe\u6709\u8fc7\u5176\u4ed6\u673a\u6784\u7684\u4e0d\u6109\u5feb\u4ed8\u8d39\u7ecf\u5386\uff0c\u5f53\u524d\u5b66\u4e60\u72b6\u6001\u4e5f\u4ee5\u89e3\u51b3\u5177\u4f53\u95ee\u9898\u4e3a\u4e3b\uff0c\u7b26\u5408\u63a2\u7d22\u8005\u7279\u5f81\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u98ce\u9669\u7b49\u7ea7: \u4e2d**\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**: **\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u6280\u672f\u57fa\u7840\u5dee\uff0c\u82e5\u65e0\u6cd5\u8de8\u8d8a\u64cd\u4f5c\u95e8\u69db\uff0c\u5c06\u65e0\u6cd5\u4f53\u9a8c\u8bfe\u7a0b\u6838\u5fc3\u5185\u5bb9\uff0c\u6781\u6613\u4ea7\u751f\u201c\u5b66\u4e0d\u4f1a\u201d\u3001\u201c\u6ca1\u7528\u201d\u7684\u611f\u77e5\u3002\n    2.  **\u670d\u52a1\u4f53\u9a8c\u843d\u5dee**: **\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5df2\u8868\u73b0\u51fa\u5bf9\u6280\u672f\u652f\u6301\u7684\u9ad8\u5ea6\u4f9d\u8d56\u3002**\u82e5\u540e\u7eed\u670d\u52a1\u54cd\u5e94\u4e0d\u53ca\u65f6\u6216\u95ee\u9898\u53cd\u590d\u65e0\u6cd5\u89e3\u51b3\uff0c\u632b\u8d25\u611f\u7d2f\u79ef\u5c06\u76f4\u63a5\u5f15\u53d1\u6295\u8bc9**\u3002\n    3.  **\u7ecf\u6d4e\u538b\u529b**: \u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u8bc4\u4f30\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9**: \u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u8bc4\u4f30\u3002\n    5.  **\u7ade\u54c1/\u66ff\u4ee3\u65b9\u6848**: \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u6709\u88ab\u5176\u4ed6\u673a\u6784\u201c\u5751\u201d\u7684\u7ecf\u5386\uff0c\u53ef\u80fd\u5bf9\u884c\u4e1a\u4fe1\u4efb\u5ea6\u4e0d\u9ad8\u3002\n    6.  **\u5b66\u4e60\u65f6\u95f4\u51b2\u7a81**: **\u4f4e\u98ce\u9669**\u3002\u7528\u6237\u80fd\u8ddf\u4e0a\u8bfe\u7a0b\u8282\u594f\u5e76\u63d0\u4ea4\u4f5c\u4e1a\uff0c\u65f6\u95f4\u6295\u5165\u53ef\u89c1\u3002\n    7.  **\u4ea7\u54c1\u9519\u914d**: **\u4e2d\u9ad8\u98ce\u9669**\u3002\u8bfe\u7a0b\u82e5\u5bf9\u7535\u8111\u64cd\u4f5c\u548c\u8f6f\u4ef6\u81ea\u5b66\u80fd\u529b\u6709\u9690\u6027\u8981\u6c42\uff0c\u5219\u4e0e\u7528\u6237\u73b0\u72b6\u5b58\u5728**\u6f5c\u5728\u9519\u914d**\u3002\u7528\u6237\u611f\u53f9\u201c\u65f6\u95f4\u90fd\u803d\u8bef\u5728\u8fd9\u4e0a\u8fb9\u4e86\u201d\uff0c\u5df2\u662f\u9519\u914d\u611f\u7684\u82d7\u5934\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u8bb0\u5f55\u4e2d\u672a\u53d1\u73b0**\u5938\u5927\u627f\u8bfa\u3001\u8d2c\u4f4e\u7ade\u54c1\u3001\u8bf1\u5bfc\u8d37\u6b3e\u3001\u865a\u5047\u5ba3\u4f20\u7b49**\u91cd\u5927\u8fdd\u89c4**\u3002\n*   **\u6f5c\u5728\u98ce\u9669\u70b9**: \u9500\u552e\uff08\u73ed\u4e3b\u4efb\uff09\u5728\u63d0\u4f9b\u6280\u672f\u652f\u6301\u65f6\uff0c**\u672a\u53d1\u73b0\u5bf9\u7528\u6237\u201c\u9ad8\u9f84\u201d\u3001\u201c\u6280\u672f\u57fa\u7840\u5dee\u201d\u7b49\u7279\u5f81\u8fdb\u884c\u8fc7\u5ea6\u7684\u201c\u5305\u5b66\u4f1a\u201d\u6216\u201c\u8f7b\u677e\u53d8\u73b0\u201d\u627f\u8bfa**\u3002\u670d\u52a1\u6001\u5ea6\u603b\u4f53\u8010\u5fc3\u3002\n*   **\u6ce8\u610f**: \u9700\u56de\u6eaf\u652f\u4ed8\u73af\u8282\u7684\u6c9f\u901a\u8bb0\u5f55\uff0c\u68c0\u67e5\u662f\u5426\u5b58\u5728\u9488\u5bf9\u8be5\u7528\u6237\u7279\u70b9\u7684**\u8fc7\u5ea6\u627f\u8bfa\u6216\u5ffd\u89c6\u5176\u5b66\u4e60\u96be\u5ea6\u7684\u9500\u552e\u884c\u4e3a**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6: \u504f\u5dee**\u3002\u7528\u6237\u6838\u5fc3\u9700\u6c42\u662f**\u8d85\u9ad8\u9891\u3001\u8d85\u57fa\u7840\u7684\u6280\u672f\u652f\u6301**\uff0c\u800c\u975e\u8bfe\u7a0b\u5185\u5bb9\u672c\u8eab\u3002\u5f53\u524d\u4ea7\u54c1\u82e5\u4ee5\u5185\u5bb9\u6559\u5b66\u4e3a\u4e3b\uff0c\u914d\u5957\u670d\u52a1\u82e5\u65e0\u6cd5\u6ee1\u8db3\u5176\u201c\u624b\u628a\u624b\u6559\u64cd\u4f5c\u201d\u7684\u9700\u6c42\uff0c\u5219\u5339\u914d\u5ea6\u5b58\u7591\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c: \u542f\u52a8\u6280\u672f\u62a4\u822a\u4e13\u9879\u652f\u6301**\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**:\n    1.  **\u7acb\u5373\u8fdb\u884c\u201c\u6280\u672f\u6478\u5e95\u201d**: \u4e3b\u52a8\u8054\u7cfb\uff0c\u7cfb\u7edf\u8bc4\u4f30\u5176\u7535\u8111\u64cd\u4f5c\u3001\u8f6f\u4ef6\u5b89\u88c5\u3001\u6587\u4ef6\u7ba1\u7406\u7b49\u57fa\u7840\u6c34\u5e73\uff0c\u5efa\u7acb\u4e13\u5c5e\u7684\u201c\u5c0f\u767d\u95ee\u9898\u6e05\u5355\u201d\u3002\n    2.  **\u63d0\u4f9b\u201c\u53ef\u89c6\u5316\u64cd\u4f5c\u6307\u5357\u201d**: \u9488\u5bf9\u5176\u9ad8\u9891\u95ee\u9898\uff08AU\u57fa\u7840\u64cd\u4f5c\u3001\u6587\u4ef6\u4e0a\u4f20\u3001\u97f3\u6548\u7ba1\u7406\u5668\u4f7f\u7528\uff09\uff0c\u5236\u4f5c**\u6781\u7b80\u7684\u56fe\u6587\u6216\u77ed\u89c6\u9891\u6b65\u9aa4\u6307\u5357**\uff0c\u66ff\u4ee3\u7eaf\u6587\u5b57\u8bf4\u660e\u3002\n    3.  **\u5efa\u7acb\u201c\u5b9a\u671f\u56de\u8bbf\u201d\u673a\u5236**: \u6bcf\u5468\u56fa\u5b9a\u65f6\u95f4\u4e3b\u52a8\u8be2\u95ee\u64cd\u4f5c\u8fdb\u5c55\uff0c\u9884\u9632\u95ee\u9898\u5806\u79ef\u5f15\u53d1\u5d29\u6e83\u60c5\u7eea\u3002**\u80af\u5b9a\u5176\u6bcf\u4e00\u6b21\u5fae\u5c0f\u7684\u8fdb\u6b65**\uff08\u5982\u201c\u4eca\u5929\u6210\u529f\u5bfc\u51faMP3\u4e86\uff0c\u5f88\u68d2\uff01\u201d\uff09\uff0c\u5f3a\u5316\u6b63\u5411\u53cd\u9988\u3002\n    4.  **\u7ba1\u7406\u6210\u679c\u9884\u671f**: \u5728\u6c9f\u901a\u4e2d\u5de7\u5999\u5f15\u5bfc\uff0c**\u964d\u4f4e\u5176\u77ed\u671f\u5185\u4ea7\u51fa\u5b8c\u7f8e\u4f5c\u54c1\u7684\u9884\u671f**\uff0c\u5f3a\u8c03\u201c\u5148\u5b8c\u6210\u3001\u518d\u5b8c\u7f8e\u201d\uff0c\u5c06\u5b66\u4e60\u76ee\u6807\u62c6\u89e3\u4e3a\u201c\u672c\u5468\u719f\u7ec3\u4f7f\u7528AU\u5f55\u97f3\u201d\u3001\u201c\u4e0b\u5468\u5b66\u4f1a\u5bfc\u51fa\u201d\u7b49\u53ef\u8fbe\u6210\u7684\u5c0f\u6b65\u9aa4\u3002\n    5.  **\u98ce\u9669\u9884\u8b66**: \u5411\u8fd0\u8425\u56e2\u961f\u540c\u6b65\u8be5\u5b66\u5458\u60c5\u51b5\uff0c\u6807\u8bb0\u4e3a\u201c\u9ad8\u6280\u672f\u652f\u6301\u9700\u6c42\u7528\u6237\u201d\uff0c\u786e\u4fdd\u670d\u52a1\u8d44\u6e90\u503e\u659c\u548c\u54cd\u5e94\u901f\u5ea6\u3002**\u5173\u6ce8\u5176\u62b1\u6028\u201c\u6d6a\u8d39\u65f6\u95f4\u201d\u7684\u9891\u7387\uff0c\u8fd9\u662f\u9000\u8d39\u524d\u5146\u4fe1\u53f7**\u3002\n\n{\"core_type\": \"T7 \u6280\u672f\u6050\u60e7\u7684\u6162\u70ed\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u542f\u52a8\u6280\u672f\u62a4\u822a\u4e13\u9879\u652f\u6301\"}";
