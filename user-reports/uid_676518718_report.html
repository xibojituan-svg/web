    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a676518718\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676518718 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-25 \u81f3 2026-04-03 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u67da\u6a59(\u5f90\u5bb9) -> \u6c90\u6b4c(\u674e\u6653\u8273) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u77ed\u89c6\u9891/\u5c0f\u8bf4\u63a8\u6587\u7c7b\u8bfe\u7a0b\uff08L1\u9636\u6bb5\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u65e0\u6cd5\u5224\u65ad\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u63d0\u53ca\u201c\u6ca1\u6709\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u201d\u3001\u201c\u5728\u5916\u9762\u201d\u3001\u201c\u8fd8\u6ca1\u5b8c\u5168\u9000\u4f11\u201d\u3001\u201c\u4f53\u5236\u5185\u8eab\u4e0d\u7531\u5df1\u201d\uff0c\u8868\u660e\u65f6\u95f4\u4e0d\u81ea\u7531\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u5bf9\u8bdd\u5185\u5bb9\u8f83\u591a\uff0c\u80fd\u6e05\u6670\u53cd\u6620\u7528\u6237\u7684\u5b66\u4e60\u72b6\u6001\u3001\u52a8\u673a\u548c\u60c5\u7eea\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e\uff0c\u4f46\u5fc3\u6001\u52a1\u5b9e\uff0c\u80fd\u63a5\u53d7\u957f\u671f\u4e3b\u4e49**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u505a\u4e2a\u7b2c\u4e8c\u4ea7\u4e1a\u201d\uff0c\u5e76\u4e3b\u52a8\u8be2\u95ee\u63a5\u5355\u5e73\u53f0\uff08\u53f3\u8c79\u3001\u559c\u64ad\u5b66\u5802\u62db\u52df\u4efb\u52a1\uff09\uff0c\u8868\u73b0\u51fa\u660e\u786e\u7684\u53d8\u73b0\u8bc9\u6c42\u3002\u4f46\u540c\u65f6\uff0c\u7528\u6237\u4e5f\u63a5\u53d7\u201c\u8fd9\u662f\u4e2a\u957f\u671f\u6d3b\u201d\uff0c\u5e76\u613f\u610f\u201c\u597d\u597d\u5b66\u201d\u3001\u201c\u4e00\u76f4\u575a\u6301\u4e0b\u53bb\u201d\uff0c\u6ca1\u6709\u8868\u73b0\u51fa\u201c\u51e0\u5929\u5185\u5fc5\u987b\u8d5a\u94b1\u201d\u7684\u6781\u7aef\u7126\u8651\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u60f3\u5148\u4ece\u4ef7\u683c\u4f4e\u7684\u5f00\u59cb\u505a\u201d\n  > \u201c\u662f\u6211\u5b66\u7684\u665a\u4e86...\u4e0d\u8fc7\u4f1a\u4e00\u76f4\u575a\u6301\u4e0b\u53bb\u7684\u201d\n  > \u201c\u505a\u4e2a\u7b2c\u4e8c\u4ea7\u4e1a\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u4e3a\u201c\u4f53\u5236\u5185\u201d\u4eba\u5458\uff0c\u6709\u7a33\u5b9a\u6536\u5165\uff0c\u62a5\u540d\u8bfe\u7a0b\u65e0\u7ecf\u6d4e\u538b\u529b\u4fe1\u53f7\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e (3-4\u5206)** \u2014 **\u6838\u5fc3\u77ed\u677f**\u3002\u7528\u6237\u591a\u6b21\u8868\u793a\u201c\u6ca1\u6709\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u201d\u3001\u201c\u5728\u5916\u9762\u201d\u3001\u201c\u8fd8\u6ca1\u5b8c\u5168\u9000\u4f11\u201d\u3001\u201c\u4f53\u5236\u5185\u8eab\u4e0d\u7531\u5df1\u201d\uff0c\u8868\u660e\u5176\u65f6\u95f4\u88ab\u5de5\u4f5c\u4e25\u91cd\u6324\u538b\uff0c\u5b66\u4e60\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\uff0c\u4e14\u4e0d\u53ef\u63a7\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4e2d** \u2014 \u4fe1\u606f\u4e0d\u8db3\uff0c\u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8 (7-8\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u7528\u6237\u9047\u5230\u6280\u672f\u95ee\u9898\uff08DeepSeek\u811a\u672c\u4e22\u5931\u3001\u8f6f\u4ef6\u64cd\u4f5c\u56f0\u96be\uff09\u65f6\uff0c\u4f1a\u4e3b\u52a8\u5bfb\u6c42\u5e2e\u52a9\u5e76\u5c1d\u8bd5\u89e3\u51b3\uff08\u201c\u624b\u673a\u91cd\u542f\u4e24\u6b21\u4e86\u201d\uff09\uff0c\u6ca1\u6709\u8868\u73b0\u51fa\u5d29\u6e83\u6216\u62b1\u6028\u3002\u9762\u5bf9\u4f5c\u4e1a\u538b\u529b\u548c\u65f6\u95f4\u7d27\u5f20\uff0c\u6001\u5ea6\u662f\u201c\u4e89\u53d6\u201d\u3001\u201c\u4e0d\u8ba1\u8fc7\u5f80\u201d\u3001\u201c\u52aa\u529b\u594b\u6597\u201d\uff0c\u5c55\u73b0\u51fa\u8f83\u5f3a\u7684\u97e7\u6027\u548c\u79ef\u6781\u5fc3\u6001\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u4f30\u8ba1\u6709\u70b9\u96be\uff0c\u4e89\u53d6\uff01\u201d\n  > \u201c\u4e0d\u8ba1\u8fc7\u5f80\uff01...\u8fd9\u4e2a\u6211\u80fd\u505a\u5230\u201d\n  > \u201c\u5c81\u6570\u5927\u4e86\u6709\u65f6\u5019\u53cd\u5e94\u4f1a\u6162[\u5bb3\u7f9e]\u201d\uff08\u80fd\u5766\u7136\u9762\u5bf9\u81ea\u8eab\u77ed\u677f\uff0c\u800c\u975e\u81ea\u5351\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42\uff08\u7ecf\u6d4e\u4fdd\u969c\uff09 + \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42\uff08\u4ef7\u503c\u8ba4\u540c\uff09**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e2d\u5e74\u8f6c\u578b\u7684\u7126\u8651\u4e0e\u4ef7\u503c\u611f\u7f3a\u5931**\u3002\u4f5c\u4e3a\u4f53\u5236\u5185\u4eba\u5458\uff0c\u9762\u4e34\u201c\u8fd8\u6ca1\u5b8c\u5168\u9000\u4f11\u201d\u7684\u8fc7\u6e21\u671f\uff0c\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u65b0\u6280\u80fd\u5f00\u8f9f\u201c\u7b2c\u4e8c\u4ea7\u4e1a\u201d\uff0c\u5bfb\u6c42\u7ecf\u6d4e\u4e0a\u7684\u5b89\u5168\u611f\u548c\u4e2a\u4eba\u4ef7\u503c\u7684\u65b0\u8bc1\u660e\u3002\u4ed6\u62c5\u5fc3\u201c\u5b66\u5f97\u665a\u201d\u3001\u201c\u53cd\u5e94\u6162\u201d\uff0c\u6df1\u5c42\u9700\u6c42\u662f\u83b7\u5f97\u793e\u4f1a\uff08\u5c24\u5176\u662f\u5e74\u8f7b\u793e\u7fa4\uff09\u7684\u8ba4\u53ef\u548c\u5c0a\u91cd\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u201d\u7684\u6210\u5c31\u611f\u548c\u201c\u8001\u5f53\u76ca\u58ee\u201d\u7684\u80af\u5b9a**\u3002\u4ed6\u9700\u8981\u7684\u4e0d\u53ea\u662f\u6280\u672f\u6307\u5bfc\uff0c\u66f4\u662f\u5bf9\u5176\u52aa\u529b\u548c\u575a\u6301\u7684\u5f3a\u70c8\u8ba4\u53ef\uff08\u73ed\u4e3b\u4efb\u7684\u5938\u5956\u201c\u4f60\u7279\u522b\u4f18\u79c0\u201d\u8ba9\u4ed6\u611f\u5230\u201c\u6c57\u989c\u201d\u4f46\u53d7\u7528\uff09\uff0c\u4ee5\u53ca\u4e00\u4e2a\u80fd\u8bc1\u660e\u81ea\u5df1\u201c\u8ddf\u5f97\u4e0a\u65f6\u4ee3\u201d\u7684\u8eab\u4efd\u6807\u7b7e\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u8fdb\u5316\u524d\u4f53\uff1a\u6df7\u5408\u4f533\u53f7 \u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u96f6\u4e92\u52a8\u4fe1\u53f7\u3002\n\n**\u3010\u5224\u5b9a\u6811\u63a8\u6f14\u3011**\uff1a\n1.  **\u652f\u4ed8\u6838\u67e5**\uff1a\u65e0\u652f\u4ed8\u884c\u4e3a\u6570\u636e\uff0c\u8df3\u8fc7\u3002\n2.  **\u4e09\u8f74\u8bc4\u5206**\uff1a\u52a8\u673a\u7eaf\u5ea6(5-6\u5206)\uff0c\u8d44\u6e90\u5e95\u5ea7(5-6\u5206\uff0c\u65f6\u95f4\u77ed\u677f)\uff0c\u5fc3\u7406\u5f39\u6027(7-8\u5206)\u3002\n3.  **\u5224\u5b9a\u6811\u8def\u5f84**\uff1a\u52a8\u673a\u22655\u5206\uff0c\u5f39\u6027\u22657\u5206 \u2192 \u8fdb\u5165\u201c\u9ad8\u5f39\u6027\u901a\u9053\u201d\u3002\n4.  **\u539f\u578b\u5339\u914d**\uff1a\u7528\u6237\u672a\u8868\u73b0\u51fa\u4e3b\u52a8\u7edf\u7b79\u884c\u4e3a\uff08\u975eT1\uff09\uff0c\u65e0\u6df1\u5ea6\u6280\u672f\u8ffd\u95ee\uff08\u975eT3\uff09\uff0c\u65e0\u9ad8\u9891\u793e\u4ea4\u53d1\u8a00\uff08\u975eT7\uff09\u3002\u7b26\u5408\u201c\u4ee5\u4e0a\u5747\u672a\u547d\u4e2d\u7684\u9ad8\u52a8\u673a\u3001\u9ad8\u5f39\u6027\u7528\u6237\u201d \u2192 **\u9ed8\u8ba4\u5f52\u7c7b\u4e3aT2\u4f4e\u8c03\u8001\u9ec4\u725b**\u3002\n5.  **\u8fdb\u5316\u76d1\u63a7**\uff1a\u7528\u6237\u8868\u73b0\u51fa\u201c\u4f53\u5236\u5185\u201d\u80cc\u666f\u3001\u9ad8\u6267\u884c\u529b\uff08\u54ac\u7259\u62a5\u540d\u4efb\u52a1\uff09\u3001\u5bfb\u6c42\u6307\u5bfc\u4f46\u5fc3\u6001\u79ef\u6781\u3002\u5177\u5907**\u6df7\u5408\u4f533\u53f7\uff08\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b\uff09**\u7684\u8fdb\u5316\u6f5c\u529b\u3002\u4e00\u65e6\u6280\u80fd\u7a81\u7834\u6216\u83b7\u5f97\u8ba4\u53ef\uff0c\u53ef\u80fd\u6fc0\u6d3b\u9886\u5bfc\u6b32\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u672a\u63d0\u53ca\u5bb6\u5ead\u77db\u76fe\uff0c\u98ce\u9669\u4f4e\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u4e2d** | **\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u56e0\u201c\u4f53\u5236\u5185\u8eab\u4e0d\u7531\u5df1\u201d\u5bfc\u81f4\u65f6\u95f4\u6301\u7eed\u88ab\u6324\u538b\uff0c\u4f5c\u4e1a\u957f\u671f\u62d6\u6b20\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u632b\u8d25\u611f\u548c\u6127\u759a\u611f\uff0c\u6700\u7ec8\u56e0\u65e0\u6cd5\u5151\u73b0\u5b66\u4e60\u627f\u8bfa\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u632b\u80fd\u4e3b\u52a8\u6c42\u89e3\uff0c\u4e0d\u6613\u60c5\u7eea\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u867d\u7136\u5fc3\u6001\u52a1\u5b9e\uff0c\u4f46\u82e5\u957f\u671f\uff08\u59823-6\u4e2a\u6708\uff09\u5728\u201c\u53f3\u8c79\u201d\u3001\u201c\u559c\u64ad\u62db\u52df\u201d\u7b49\u5e73\u53f0\u63a5\u4e0d\u5230\u5355\u6216\u6536\u76ca\u6781\u4f4e\uff0c\u53ef\u80fd\u52a8\u6447\u5176\u201c\u7b2c\u4e8c\u4ea7\u4e1a\u201d\u7684\u4fe1\u5fc3\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-4\u5468\u540e\uff0c\u9996\u6b21\u72ec\u7acb\u5b8c\u6210\u4f5c\u54c1\u5e76\u5c1d\u8bd5\u63a5\u5355\u4f46\u8fde\u7eed\u53d7\u632b\u65f6**\u3002\u6b64\u65f6\u82e5\u65e0\u4eba\u7ed9\u4e88\u5177\u4f53\u6307\u5bfc\u548c\u7cbe\u795e\u9f13\u52b1\uff0c\u5bb9\u6613\u4ea7\u751f\u201c\u5b66\u4e86\u4e5f\u6ca1\u7528\u201d\u7684\u6d88\u6781\u60f3\u6cd5\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cX\u54e5/\u59d0\uff0c\u770b\u5230\u60a8\u4f53\u5236\u5185\u5de5\u4f5c\u8fd8\u8fd9\u4e48\u62fc\uff0c\u771f\u5fc3\u4f69\u670d\uff01\u54b1\u4eec\u8fd9\u8bfe\u5c31\u662f\u7ed9\u6709\u7b2c\u4e8c\u66f2\u7ebf\u60f3\u6cd5\u7684\u4eba\u51c6\u5907\u7684\uff0c\u4e0d\u56fe\u5feb\uff0c\u56fe\u7a33\u3002\u60a8\u65f6\u95f4\u96f6\u788e\u6ca1\u5173\u7cfb\uff0c\u73ed\u73ed\u5e2e\u60a8\u628a\u4efb\u52a1\u62c6\u89e3\u5230\u6700\u5c0f\u9897\u7c92\uff0c\u54b1\u5229\u7528\u597d\u788e\u7247\u65f6\u95f4\uff0c\u4e00\u6b65\u6b65\u6765\uff0c\u80af\u5b9a\u80fd\u6210\u3002\u4ee5\u540e\u6280\u672f\u4e0a\u3001\u63a5\u5355\u4e0a\u4efb\u4f55\u95ee\u9898\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u5c31\u662f\u60a8\u7684\u4e13\u5c5e\u519b\u5e08\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176\u201c\u505a\u7b2c\u4e8c\u4ea7\u4e1a\u201d\u7684\u52a1\u5b9e\u76ee\u6807\u548c\u8f83\u5f3a\u7684\u5b66\u4e60\u97e7\u6027\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n    1.  **\u3010\u65f6\u95f4\u7ba1\u7406\u8f85\u52a9\u5305\u3011**\uff1a\u4e3a\u5176\u5b9a\u5236\u201c\u788e\u7247\u65f6\u95f4\u5b66\u4e60\u8ba1\u5212\u8868\u201d\uff0c\u5c06\u5927\u4efb\u52a1\u62c6\u89e3\u4e3a10-15\u5206\u949f\u53ef\u5b8c\u6210\u7684\u5fae\u4efb\u52a1\u3002\n    2.  **\u3010\u7cbe\u51c6\u6d3e\u5355\u62e6\u622a(B\u6a21\u5757)\u3011**\uff1a\u5728\u5176\u5b8c\u6210\u57fa\u7840\u4f5c\u54c1\u540e\uff0c\u4e3b\u52a8\u7b5b\u9009\u5e76\u63a8\u9001\u5339\u914d\u5176\u80fd\u529b\uff08\u5386\u53f2\u7c7b\u3001\u4f4e\u5355\u4ef7\uff09\u7684\u8bd5\u7a3f\u4efb\u52a1\uff0c\u5e76\u63d0\u4f9b1v1\u4f5c\u54c1\u4f18\u5316\u6307\u5bfc\uff0c**\u786e\u4fdd\u5176\u80fd\u83b7\u5f97\u65e9\u671f\u6b63\u53cd\u9988**\u3002\n    3.  **\u3010\u8f7b\u91cfC\u6a21\u5757\uff08\u5c0a\u91cd\u8d4b\u80fd\uff09\u3011**\uff1a\u5728\u5176\u6bcf\u4e00\u6b21\u63d0\u4ea4\u4f5c\u4e1a\u3001\u5c1d\u8bd5\u63a5\u5355\u540e\uff0c\u7ed9\u4e88\u5177\u4f53\u3001\u771f\u8bda\u7684\u5938\u5956\uff0c\u5f3a\u8c03\u5176\u201c\u4f53\u5236\u5185\u8f6c\u578b\u5178\u8303\u201d\u3001\u201c\u5b66\u4e60\u6001\u5ea6\u6807\u6746\u201d\u7684\u8eab\u4efd\uff0c\u6ee1\u8db3\u5176\u5c0a\u91cd\u9700\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u5b9d\u5988/\u5b66\u751f\u90fd\u80fd\u8f7b\u677e\u6708\u5165\u8fc7\u4e07\u201d\u7684\u8bdd\u672f\u523a\u6fc0\u4ed6\uff0c\u8fd9\u4e0e\u5176\u52a1\u5b9e\u7684\u201c\u957f\u671f\u4e3b\u4e49\u201d\u8ba4\u77e5\u76f8\u6096\u3002\u4e0d\u8981\u56e0\u4e3a\u4ed6\u8fdb\u5ea6\u6162\u800c\u65bd\u52a0\u7fa4\u4f53\u538b\u529b\uff08@\u5168\u4f53\u50ac\u4f5c\u4e1a\uff09\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u63a8\u4ecb\u4e0e\u201c\u5386\u53f2\u5185\u5bb9\u521b\u4f5c\u201d\u3001\u201c\u7a33\u5b9a\u53d8\u73b0\u8def\u5f84\u201d\u76f8\u5173\u7684\u4e2d\u9ad8\u9636\u8bfe\u7a0b\uff0c\u4f46\u5fc5\u987b\u5efa\u7acb\u5728**\u4ed6\u5df2\u901a\u8fc7\u521d\u7ea7\u8bfe\u7a0b\u83b7\u5f97\u660e\u786e\u6210\u5c31\u611f\uff08\u5982\u63a5\u5230\u7b2c\u4e00\u5355\uff09\u4e4b\u540e**\u3002\u7981\u6b62\u5728\u5176\u5fd9\u4e8e\u5de5\u4f5c\u3001\u4f5c\u4e1a\u79ef\u538b\u65f6\u8fdb\u884c\u5347\u5355\u63a8\u9500\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u8fd9\u662f\u4e2a\u957f\u671f\u6d3b\uff0c\u6211\u6ca1\u6709\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a[\u5bb3\u7f9e]**\u201d \u2014\u2014 **\u52a8\u673a\u52a1\u5b9e\uff08\u957f\u671f\u4e3b\u4e49\uff09\uff0c\u8d44\u6e90\u77ed\u677f\uff08\u65f6\u95f4\u4e0d\u8db3\uff09\u7684\u76f4\u63a5\u8bc1\u636e\u3002**\n2. > \u201c**\u4f53\u5236\u5185\u7684\u6709\u65f6\u5019\u8eab\u4e0d\u7531\u5df1\uff0c\u8bf7\u4f60\u7406\u89e3**\u201d \u2014\u2014 **\u6838\u5fc3\u8d44\u6e90\u9650\u5236\uff08\u65f6\u95f4\uff09\u548c\u5bfb\u6c42\u7406\u89e3\uff08\u5c0a\u91cd\u9700\u6c42\uff09\u7684\u96c6\u4e2d\u4f53\u73b0\u3002**\n3. > \u201c**\u6211\u60f3\u5148\u4ece\u4ef7\u683c\u4f4e\u7684\u5f00\u59cb\u505a**\u201d \u548c \u201c**\u6211\u662f\u5c0f\u767d\u5f00\u59cb\u5b66\u7684\uff0c\u4e0d\u8fc7\u4f1a\u4e00\u76f4\u575a\u6301\u4e0b\u53bb\u7684\uff0c\u5c81\u6570\u5927\u4e86\u6709\u65f6\u5019\u53cd\u5e94\u4f1a\u6162[\u5bb3\u7f9e]**\u201d \u2014\u2014 **\u6e05\u6670\u7684\u53d8\u73b0\u610f\u56fe\u3001\u8c26\u900a\u7684\u5b66\u4e60\u6001\u5ea6\u3001\u9ad8\u5fc3\u7406\u5f39\u6027\uff08\u5766\u7136\u9762\u5bf9\u77ed\u677f\u5e76\u575a\u6301\uff09\u7684\u4e09\u91cd\u5370\u8bc1\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\uff08\u5411\u6df7\u5408\u4f533\u53f7\u8fdb\u5316\u4e2d\uff09\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7ecf\u6d4e\u4fdd\u969c\u4e0e\u4ef7\u503c\u5c0a\u91cd\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u788e\u7247\u5316\u65f6\u95f4\u7ba1\u7406\u65b9\u6848 + \u786e\u4fdd\u65e9\u671f\u63a5\u5355\u6b63\u53cd\u9988 + \u7ed9\u4e88\u201c\u8f6c\u578b\u6807\u6746\u201d\u5f0f\u7684\u9ad8\u5ea6\u5c0a\u91cd\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b (\u6df7\u5408\u4f533\u53f7\u8fdb\u5316\u524d\u4f53)\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\u4e0e\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u65f6\u95f4\u7ba1\u7406\u8f85\u52a9\u5305 + \u7cbe\u51c6\u6d3e\u5355\u62e6\u622a\", \"age\": \"\u672a\u77e5\uff08\u4e2d\u5e74\uff0c\u672a\u5b8c\u5168\u9000\u4f11\uff09\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u592a\u539f\"}\n```";
