    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a346938500\uff08\u521d\u89c1\uff09\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a346938500\uff08\u521d\u89c1\uff09 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e-97\u6e05\u98ce3(\u66f9\u6d01)\u3001\u73ed\u4e3b\u4efb-\u4e00\u975e\ud83c\udf53\u73ed\u73ed(\u5434\u4e00\u975e) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6500\u767b\u8ba1\u5212\u7cbe\u82f1\u7248\uff08\u5df2\u62a5\u540d2\u4e2a\u6708\u7248\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u5b58\u5728\u501f\u8d37\u9690\u60a3\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u9ad8\u5bbd\u88d5**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u6211\u53ef\u4ee5\u5168\u804c\u7684\u201d\uff0c\u5177\u5907\u5168\u804c\u6295\u5165\u7684\u65f6\u95f4\u6761\u4ef6\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\uff0c\u65e0\u6cd5\u5224\u65ad\u652f\u6301\u5ea6\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u7528\u6237\u4e92\u52a8\u79ef\u6781\uff0c\u63d0\u4f9b\u4e86\u804c\u4e1a\u80cc\u666f\u3001\u5b66\u4e60\u6001\u5ea6\u3001\u65f6\u95f4\u89c4\u5212\u7b49\u5173\u952e\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u2b06\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u53d8\u73b0\u53cc\u91cd\u9a71\u52a8\u800c\u6765\u3002\u65e2\u6709\u201c\u6211\u60f3\u5f55\u4e66\u201d\u7684\u660e\u786e\u6280\u80fd\u76ee\u6807\uff0c\u4e5f\u6709\u201c\u901a\u8fc7\u8fd9\u4e2a\u5b66\u4e60\u53c8\u80fd\u8d5a\u5230\u201d\u7684\u52a1\u5b9e\u53d8\u73b0\u8bc9\u6c42\uff0c\u4e14\u5bf9\u5b66\u4e60\u8fc7\u7a0b\u8868\u73b0\u51fa\u9ad8\u5ea6\u6295\u5165\u548c\u601d\u8003\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u53ef\u4ee5\u5168\u804c\u7684\u201d\n  > \u201c\u6211\u8981\u5f55\u4e66\u201d\n  > \u201c\u659c\u6760\u4f1a\u5148\u9009\u753b\u672c\u548c\u5ba1\u542c\uff0c\u5148\u5b66\u5f55\u97f3\u201d\n  > \u201c\u6211\u60f3\u53c2\u52a0\u8fd9\u4e2a\u73ed\u662f\u60f3\u901a\u8fc7\u5b66\u4e60\u7f8e\u5316\u81ea\u5df1\u7684\u58f0\u97f3\u548c\u64ad\u97f3\u7684\u6280\u5de7\uff0c\u7136\u540e\u901a\u8fc7\u8fd9\u4e2a\u5b66\u4e60\u53c8\u80fd\u8d5a\u5230\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b06\u9ad8**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u672a\u63d0\u53ca\u5177\u4f53\u7ecf\u6d4e\u72b6\u51b5\uff0c\u4f46\u9009\u62e9\u5148\u62a52\u4e2a\u6708\u8bfe\u7a0b\u201c\u6211\u60f3\u6162\u6162\u6765\u201d\uff0c\u8868\u73b0\u51fa\u7406\u6027\u6d88\u8d39\u548c\u89c4\u5212\u610f\u8bc6\uff0c\u672a\u89c1\u8d44\u91d1\u538b\u529b\u4fe1\u53f7\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u9ad8** \u2014 \u660e\u786e\u8868\u793a\u53ef\u5168\u804c\u6295\u5165\uff0c\u65f6\u95f4\u6781\u5ea6\u5145\u88d5\u3002\u4e3b\u52a8\u5b8c\u6210\u6668\u7ec3\u3001\u542c\u8bfe\u3001\u4ea4\u4f5c\u4e1a\uff0c\u7cbe\u529b\u6295\u5165\u5ea6\u9ad8\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\uff0c\u6682\u65e0\u6cd5\u8bc4\u4f30\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9762\u5bf9\u9500\u552e\u63d0\u4f9b\u7684\u8be6\u7ec6\u4f5c\u4e1a\u70b9\u8bc4\uff0c\u7528\u6237\u53cd\u9988\u79ef\u6781\u3001\u7406\u6027\uff08\u201c\u597d\u7684\uff0c\u8c22\u8c22\u201d\u3001\u201c\u8fd8\u9700\u8981\u66f4\u591a\u7ec3\u4e60\u201d\uff09\uff0c\u4e3b\u52a8\u5bfb\u6c42\u786e\u8ba4\uff08\u201c\u8bd5\u97f3\u4f5c\u4e1a\u5462\uff0c\u8981\u4e0d\u8981\u91cd\u5f55\u201d\uff09\uff0c\u8868\u73b0\u51fa\u7a33\u5b9a\u7684\u5b66\u4e60\u5fc3\u6001\u548c\u89e3\u51b3\u95ee\u9898\u7684\u80fd\u529b\uff0c\u65e0\u4efb\u4f55\u81ea\u5351\u3001\u7126\u8651\u6216\u4f9d\u8d56\u60c5\u7eea\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u4eca\u5929\u5b66\u5230\u5f88\u591a\u77e5\u8bc6\u3002\u201d\n  > \u201c\u8fd8\u9700\u8981\u66f4\u591a\u7ec3\u4e60\u3002\u201d\n  > \u201c\u8bd5\u97f3\u4f5c\u4e1a\u5462\uff0c\u8981\u4e0d\u8981\u91cd\u5f55\u201d\n  > \u201c\u6211\u4f1a\u8ba4\u771f\u5bf9\u5f85\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 (Esteem Needs) \u4e0e \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 (Self-Actualization) \u7684\u6df7\u5408**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u4ece\u6559\u5e08\u804c\u4e1a\u8f6c\u578b\uff0c\u62e5\u6709\u4e8c\u7ea7\u7532\u7b49\u666e\u901a\u8bdd\u8bc1\u4e66\uff0c\u5177\u5907\u826f\u597d\u7684\u58f0\u97f3\u57fa\u7840\u548c\u804c\u4e1a\u7d20\u517b\u3002\u5176\u8f6f\u808b\u5e76\u975e\u751f\u5b58\u7126\u8651\uff0c\u800c\u662f**\u5bfb\u6c42\u5728\u65b0\u7684\u9886\u57df\uff08\u6709\u58f0\u6f14\u64ad\uff09\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u3001\u5b9e\u73b0\u4ef7\u503c\u8f6c\u6362\uff0c\u5e76\u5efa\u7acb\u65b0\u7684\u804c\u4e1a\u8eab\u4efd\u8ba4\u540c**\u3002\u5979\u9700\u8981\u8bc1\u660e\u81ea\u5df1\u201c\u4e5f\u80fd\u884c\u201d\uff0c\u5e76\u4eab\u53d7\u6280\u80fd\u7cbe\u8fdb\u5e26\u6765\u7684\u6210\u5c31\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u6df1\u5ea6\u8ba4\u53ef\u4e0e\u8fdb\u9636\u8def\u5f84\u7684\u6e05\u6670\u6307\u5f15**\u3002\u5979\u4e0d\u9700\u8981\u9e21\u6c64\u5f0f\u7684\u9f13\u52b1\uff0c\u800c\u662f\u9700\u8981\u88ab\u5f53\u4f5c\u4e00\u4e2a\u201c\u51c6\u4e13\u4e1a\u4eba\u58eb\u201d\u6765\u5bf9\u5f85\uff0c\u7ed9\u4e88\u6709\u6280\u672f\u542b\u91cf\u7684\u53cd\u9988\u548c\u660e\u786e\u7684\u6210\u957f\u5730\u56fe\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe2 A\u7c7b** (\u9ad8\u4ef7\u503c\u9886\u8896\u578b/\u6838\u5fc3\u7a33\u5b9a\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u6838\u5fc3\u7a33\u5b9a\u578b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n**\u5224\u5b9a\u6811\u63a8\u6f14**\uff1a\n1.  **\u524d\u7f6e\u9694\u7206\u7b5b**\uff1a\u52a8\u673a\u7eaf\u5ea6\u975e0\uff0c\u8d44\u6e90\u5e95\u5ea7\u975e\u8d1f\u503c\uff0c\u672a\u89e6\u53d1T0\u6216T8-D\u3002\n2.  **\u4ea4\u6613\u4fe1\u53f7\u786c\u62e6\u622a\u5c42**\uff1a\u65e0\u652f\u4ed8\u6570\u636e\uff0c\u65e0\u6cd5\u5224\u65ad\u3002\n3.  **\u4e09\u8f74\u8bc4\u5206**\uff1a\u52a8\u673a\u7eaf\u5ea6(7-8\u5206)\u3001\u8d44\u6e90\u5e95\u5ea7(7-8\u5206)\u3001\u5fc3\u7406\u5f39\u6027(7-8\u5206)\u3002\n4.  **\u5224\u5b9a\u6811\u5206\u6d41**\uff1a\u52a8\u673a\u7eaf\u5ea6\u22655\u5206\uff0c\u5fc3\u7406\u5f39\u6027\u22657\u5206\uff0c\u8fdb\u5165\u201c\u9ad8\u5f39\u6027\u901a\u9053\u201d\u3002\u7528\u6237\u672a\u8868\u73b0\u51fa\u660e\u663e\u7684\u4e3b\u52a8\u7edf\u7b79\u884c\u4e3a\u6216\u6781\u5ba2\u5f0f\u6df1\u5ea6\u8ffd\u95ee\uff0c\u4f46\u8868\u73b0\u51fa\u6781\u5f3a\u7684\u6267\u884c\u529b\u3001\u7a33\u5b9a\u6027\u548c\u5b66\u4e60\u610f\u613f\u3002\u7b26\u5408 **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** \u7279\u5f81\uff1a\u9ad8\u52a8\u673a\u3001\u9ad8\u8d44\u6e90\u3001\u9ad8\u5f39\u6027\uff0c\u9ed8\u9ed8\u5b9e\u5e72\uff0c\u8ffd\u6c42\u4e13\u4e1a\u7cbe\u8fdb\u548c\u7ed3\u679c\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u51b3\u7b56\u7406\u6027\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u6781\u4f4e** | \u65f6\u95f4\u5145\u88d5\uff0c\u5b66\u4e60\u81ea\u5f8b\u6027\u5f3a\uff0c\u5d29\u76d8\u98ce\u9669\u6781\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u5fc3\u6001\u7a33\u5b9a\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u632b\u6298\u800c\u5d29\u6e83\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u4e2d** | **\u4f5c\u4e3a\u524d\u6559\u5e08\u548c\u5168\u804c\u6295\u5165\u8005\uff0c\u5979\u5bf9\u5b66\u4e60\u6210\u679c\u548c\u53d8\u73b0\u8def\u5f84\u6709\u8f83\u9ad8\u671f\u5f85\u3002\u82e5\u5728\u627f\u8bfa\u5468\u671f\u5185\uff08\u59822-3\u4e2a\u6708\uff09\u63a5\u5355\u4e0d\u987a\u5229\u6216\u611f\u89c9\u6210\u957f\u7f13\u6162\uff0c\u53ef\u80fd\u4ea7\u751f\u8d28\u7591\u3002** |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe\u540e\u7684**\u7b2c2-3\u4e2a\u6708**\u3002\u6b64\u65f6\u6280\u80fd\u8fdb\u5165\u5e73\u53f0\u671f\uff0c\u82e5\u63a5\u5355\u673a\u4f1a\u672a\u8fbe\u9884\u671f\uff0c\u6613\u4ea7\u751f\u201c\u6295\u5165\u4ea7\u51fa\u6bd4\u201d\u7684\u7126\u8651\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u521d\u89c1\u540c\u5b66\u4f60\u597d\uff0c\u770b\u5230\u4f60\u7684\u666e\u901a\u8bdd\u4e8c\u7532\u80cc\u666f\u548c\u5168\u804c\u6295\u5165\u7684\u51b3\u5fc3\uff0c\u975e\u5e38\u6b23\u8d4f\u3002\u6211\u4eec\u8fd9\u5957\u8bfe\u7a0b\u4f53\u7cfb\u5c31\u662f\u4e3a\u50cf\u4f60\u8fd9\u6837\u6709\u57fa\u7840\u3001\u80af\u94bb\u7814\u7684\u2018\u5b9e\u529b\u6d3e\u2019\u51c6\u5907\u7684\u3002\u63a5\u4e0b\u6765\u4e24\u4e2a\u6708\uff0c\u6211\u4f1a\u91cd\u70b9\u5e2e\u4f60\u6253\u901a\u4ece\u2018\u4f1a\u8bfb\u2019\u5230\u2018\u4f1a\u6f14\u2019\u3001\u518d\u5230\u2018\u4f1a\u63a5\u5355\u2019\u7684\u6bcf\u4e00\u4e2a\u6280\u672f\u5361\u70b9\uff0c\u671f\u5f85\u4f60\u6210\u4e3a\u73ed\u91cc\u7684\u6807\u6746\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176\u9ad8\u52a8\u673a\u3001\u9ad8\u6267\u884c\u529b\u7684\u7279\u70b9\uff0c\u63d0\u4f9b\u7cfb\u7edf\u3001\u6df1\u5ea6\u7684\u6280\u80fd\u8bad\u7ec3\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743 (B\u6a21\u5757)\u3011** + **\u3010\u65e9\u671f\u5b9e\u6218\u6d3e\u5355\u673a\u4f1a (B\u6a21\u5757)\u3011**\u3002\u4e3a\u5176\u63d0\u4f9b\u8d85\u51fa\u6807\u51c6\u8bfe\u7a0b\u7684\u6280\u672f\u7b54\u7591\u548c\u771f\u5b9e\u7684\u3001\u5339\u914d\u5176\u80fd\u529b\u7684\u8bd5\u97f3\u673a\u4f1a\uff0c\u6ee1\u8db3\u5176\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\u9700\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u5bf9\u5f85\u5c0f\u767d\u6216\u5a31\u4e50\u7528\u6237\u7684\u65b9\u5f0f\u4e0e\u5979\u4ea4\u6d41\uff1b\u7ed9\u4e88\u6a21\u7cca\u3001\u4e0d\u4e13\u4e1a\u7684\u53cd\u9988\uff1b\u8fc7\u5ea6\u4f7f\u7528\u60c5\u611f\u5b89\u629a\uff08C\u6a21\u5757\uff09\uff0c\u8fd9\u4f1a\u88ab\u5979\u89c6\u4e3a\u4e0d\u4e13\u4e1a\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u57282\u4e2a\u6708\u8bfe\u7a0b\u540e\u671f\uff0c\u82e5\u5979\u8fdb\u5c55\u987a\u5229\uff0c\u53ef\u57fa\u4e8e\u5176\u6280\u672f\u63d0\u5347\u548c\u63a5\u5355\u6210\u679c\uff0c\u7406\u6027\u63a8\u4ecb4\u4e2a\u6708\u8fdb\u9636\u8bfe\u7a0b\u6216\u9ad8\u9636\u79c1\u6559\u8bfe\uff0c\u5979\u662f\u6709\u6f5c\u529b\u7684\u9ad8\u590d\u8d2d\u7528\u6237\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u53ef\u4ee5\u5168\u804c\u7684\u201d \u2014\u2014 **\u8d44\u6e90\u5e95\u5ea7\uff08\u65f6\u95f4\uff09\u9ad8\uff0c\u51b3\u5fc3\u5f3a\u3002**\n2. > \u201c\u6211\u8981\u5f55\u4e66\u201d \u2014\u2014 **\u52a8\u673a\u660e\u786e\u3001\u76f4\u63a5\uff0c\u6307\u5411\u5177\u4f53\u884c\u52a8\u76ee\u6807\u3002**\n3. > \u201c\u659c\u6760\u4f1a\u5148\u9009\u753b\u672c\u548c\u5ba1\u542c\uff0c\u5148\u5b66\u5f55\u97f3\u201d \u2014\u2014 **\u6709\u6e05\u6670\u7684\u804c\u4e1a\u89c4\u5212\u548c\u8def\u5f84\u601d\u8003\uff0c\u7406\u6027\u52a1\u5b9e\u3002**\n4. > \u201c\u4eca\u5929\u5b66\u5230\u5f88\u591a\u77e5\u8bc6\u3002\u201d\u3001\u201c\u8fd8\u9700\u8981\u66f4\u591a\u7ec3\u4e60\u3002\u201d \u2014\u2014 **\u5fc3\u6001\u79ef\u6781\u3001\u7a33\u5b9a\uff0c\u5177\u5907\u6210\u957f\u578b\u601d\u7ef4\u548c\u9ad8\u5fc3\u7406\u5f39\u6027\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6301\u7eed\u3001\u6709\u6df1\u5ea6\u7684\u4e13\u4e1a\u53cd\u9988\u4e0e\u6e05\u6670\u7684\u8fdb\u9636\u53d8\u73b0\u8def\u5f84\uff0c\u907f\u514d\u8ba9\u5979\u611f\u5230\u6210\u957f\u505c\u6ede\u6216\u201c\u5b66\u65e0\u6240\u7528\u201d\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\"}\n```";
