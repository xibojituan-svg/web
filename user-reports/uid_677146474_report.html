        const markdownText = "# \ud83d\udd0d \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677146474 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-05 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u5bf9\u8c61** | \u9500\u552e - 103\u82b1\u82b12(\u9648\u6625\u6885) |\n| **\u8d2d\u4e70\u4ea7\u54c1** | \u6709\u58f0\u4e66\u914d\u97f3\u9ad8\u9636\u73ed\uff087380\u5143\uff09 |\n| **\u652f\u4ed8\u65b9\u5f0f** | **\u88ab\u529d\u5bfc\u5f00\u82b1\u5457**\uff08\u7528\u6237\u8868\u793a\u8d44\u91d1\u4e0d\u8db3\uff0c\u9500\u552e\u8be2\u95ee\u82b1\u5457\u989d\u5ea6\uff09 |\n| **\u5de5\u4f5c\u5236\u5ea6** | **\u6807\u51c6\u73ed**\uff08\u4f53\u5236\u5185\u5de5\u4f5c\uff0c\u4f46\u7ecf\u5e38\u52a0\u73ed\uff09 |\n| **\u5bb6\u5ead\u51b3\u7b56\u6743** | **\u5916\u90e8\u963b\u65ad\uff08\u5bb6\u4eba\u53cd\u5bf9\uff09**\uff08\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u7792\u7740\u7238\u5988\u201d\u3001\u201c\u4e4b\u524d\u56e0\u4e3a\u8fd9\u4e2a\u4e8b\u60c5\u5435\u8fc7\u67b6\u201d\uff09 |\n| **\u6210\u4ea4\u573a\u666f** | \u957f\u5468\u671f\u8ddf\u8fdb\uff08\u4f53\u9a8c\u8425+\u76f4\u64ad\u8f6c\u5316\uff09 |\n| **\u9000\u8d39\u5386\u53f2** | \u672a\u77e5 |\n| **\u4fe1\u606f\u5b8c\u6574\u5ea6** | **\u5145\u8db3** |\n\n---\n\n## \u4e8c\u3001\u8f6c\u5316\u524d\u5fc5\u95ee\u4e09\u95ee\u6838\u9a8c\n\n| \u5fc5\u95ee\u95ee\u9898 | \u662f\u5426\u5df2\u6838\u9a8c | \u7528\u6237\u56de\u7b54\u6458\u8981 | \u98ce\u9669\u4fe1\u53f7 |\n|---|---|---|---|\n| Q1 \u5bb6\u5ead\u6838\u67e5\uff1a\"\u5bb6\u91cc\u4eba\u77e5\u9053\u5417\uff1f\u652f\u6301\u5417\uff1f\" | **\u5df2\u6838\u9a8c\uff08\u7528\u6237\u4e3b\u52a8\u66b4\u9732\uff09** | > \u201c\u6211\u662f\u7792\u7740\u6211\u7238\u5988\u7684\u3002\u4ed6\u4eec\u5f88\u8001\u6d3e\u3002\u4e4b\u524d\u56e0\u4e3a\u8fd9\u4e2a\u4e8b\u60c5\u5435\u8fc7\u67b6\u3002\u201d | **\u9ad8\u98ce\u9669** |\n| Q2 \u65f6\u95f4\u6838\u67e5\uff1a\"\u665a\u4e0a\u51e0\u70b9\u6709\u7a7a\uff1f\u56fa\u5b9a\u73ed\u8fd8\u662f\u5012\u73ed\uff1f\" | **\u5df2\u6838\u9a8c** | > \u201c\u4e3b\u8981\u662f\u6211\u62c5\u5fc3\u6211\u7684\u6642\u9593\u4e0d\u591f\u2026\u4e00\u5468\u6709\u4e2a5\u4e2a\u5c0f\u65f6\u7684\u6642\u9593\uff0c\u6211\u60f3\u5e94\u8be5\u662f\u8fd8\u80fd\u51d1\u7684\u51fa\u6765\u7684\u201d | **\u6709\u538b\u529b** |\n| Q3 \u8d44\u91d1\u6838\u67e5\uff1a\"\u81ea\u5df1\u7684\u94b1\u8fd8\u662f\u82b1\u5457/\u4fe1\u7528\u5361\u5206\u671f\uff1f\" | **\u5df2\u6838\u9a8c\uff08\u9500\u552e\u4e3b\u52a8\u8be2\u95ee\uff09** | > \u201c\u53ea\u67092000\u591a\u2026\u82b1\u5457\u8c8c\u4f3c\u989d\u5ea6\u4e0d\u591f\u2026\u8fd8\u5dee1500\u5de6\u53f3\u201d | **\u9ad8\u98ce\u9669** |\n\n\u26a0\ufe0f **\u672a\u6838\u9a8c\u9879 = \u76f2\u533a**\uff1a\u5bb6\u5ead\u548c\u8d44\u91d1\u95ee\u9898\u5df2\u66b4\u9732\uff0c\u4f46\u9500\u552e\u5728\u5df2\u77e5\u9ad8\u98ce\u9669\u4e0b\u4ecd\u5728\u63a8\u8fdb\u3002\n\n---\n\n## \u4e09\u3001\u4e09\u8f74\u8bc4\u7ea7\n\n### \u8f741\uff1a\u52a8\u673a\u7eaf\u5ea6 \u2192 \u2b07\u4f4e\n\n| \u4fe1\u53f7 | \u8bc1\u636e\u6458\u5f55 |\n|---|---|\n| \u7b2c\u4e00\u53e5\u8bdd\u7684\u95ee\u9898\u5c42\u6b21 | \u672a\u76f4\u63a5\u8be2\u95ee\u8bfe\u7a0b\u5185\u5bb9\uff0c\u5173\u6ce8\u201c\u8bd5\u97f3\u63a5\u5355\u201d\u6d41\u7a0b\u3002 |\n| \u53d8\u73b0\u9884\u671f\u65f6\u95f4\u7ebf | **\u77ed\u671f\uff081-3\u6708\uff09** \u2014 \u5173\u6ce8\u201c\u8bd5\u97f3\u63a5\u5355\u201d\u3001\u201c\u901a\u5173\u201d\uff0c\u5bf9\u53d8\u73b0\u8def\u5f84\u6709\u5373\u65f6\u5174\u8da3\u3002 |\n| \u5bf9\u786e\u5b9a\u6027\u7684\u4f9d\u8d56 | **\u9700\u8981\u6848\u4f8b\u8bc1\u660e** \u2014 \u9500\u552e\u591a\u6b21\u5206\u4eab\u5b66\u957f\u5b66\u59d0\u6848\u4f8b\uff0c\u7528\u6237\u672a\u8981\u6c42\u4fdd\u5e95\uff0c\u4f46\u88ab\u6848\u4f8b\u5438\u5f15\u3002 |\n| \u5174\u8da3\u9a71\u52a8\u7a0b\u5ea6 | **\u6309\u90e8\u5c31\u73ed/\u53d8\u73b0\u6df7\u5408** \u2014 \u8868\u793a\u201c\u6709\u6536\u83b7\u201d\uff0c\u4f46\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u201c\u526f\u4e1a\u6536\u5165\u201d\uff0c\u4e14\u591a\u6b21\u8868\u8fbe\u5bf9\u201c\u94b1\u4e0d\u591f\u201d\u7684\u62c5\u5fe7\u3002 |\n\n**\u5224\u5b9a\u4f9d\u636e**\uff1a\u7528\u6237\u6838\u5fc3\u8bc9\u6c42\u662f\u589e\u52a0\u526f\u4e1a\u6536\u5165\uff08\u201c\u526f\u4e1a\uff0c\u6211\u6709\u4e3b\u4e1a\u201d\uff09\uff0c\u5bf9\u5b66\u4e60\u5185\u5bb9\u672c\u8eab\u5174\u8da3\u4e00\u822c\uff0c\u66f4\u591a\u88ab\u9500\u552e\u5c55\u793a\u7684\u201c\u63a5\u5355\u8d5a\u94b1\u201d\u6848\u4f8b\u548c\u8def\u5f84\u5438\u5f15\uff0c\u52a8\u673a\u4ee5\u53d8\u73b0\u4e3a\u4e3b\uff0c\u7eaf\u5ea6\u8f83\u4f4e\u3002\n\n### \u8f742\uff1a\u8d44\u6e90\u5e95\u5ea7 \u2192 \u2b07\u4f4e\n\n| \u5b50\u7ef4\u5ea6 | \u8bc4\u7ea7 | \u5b9e\u8bc1\u91cf\u5316\u951a\u70b9 | \u8bc1\u636e\u6458\u5f55 |\n|---|---|---|---|\n| \ud83d\udcb0 \u8d44\u91d1 | **D\u89e6\u53d1** | **\u501f\u8d37+\u5f71\u54cd\u751f\u6d3b\u8d39** | > \u201c\u53ea\u67092000\u591a\u2026\u7ed9\u4e86\u4e00\u90e8\u5206\u7238\u5988\u8fd8\u623f\u8d37\u2026\u8fd8\u6709\u5916\u516c\u770b\u75c5\u2026\u8fd8\u5dee1500\u5de6\u53f3\u2026\u5de5\u8d44\u8981\u4e2d\u65ec\u624d\u80fd\u53d1\u4e0b\u6765\u201d |\n| \u23f1 \u65f6\u95f4 | **\u4e2d** | **\u6807\u51c6\u73ed+\u53ef\u534f\u8c03\u65f6\u95f4** | > \u201c\u4e00\u5468\u80fd\u7a33\u4f4f5\u5c0f\u65f6\uff0c\u5b8c\u5168\u591f\u5165\u95e8\u4e86\u201d\uff08\u9500\u552e\u8bc4\u4f30\uff09<br>> \u201c\u4e3b\u8981\u662f\u6211\u62c5\u5fc3\u6211\u7684\u6642\u9593\u4e0d\u591f\u2026\u5929\u5929\u52a0\u73ed\u2026\u4e00\u5468\u6709\u4e2a5\u4e2a\u5c0f\u65f6\u7684\u6642\u9593\u2026\u8fd8\u80fd\u51d1\u7684\u51fa\u6765\u201d |\n| \ud83e\udde0 \u7cbe\u529b | **\u4e2d** | **\u5fc3\u6001\u5e73\u7a33+\u6162\u6162\u5b66** | \u80fd\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\uff0c\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u95ea\u9000\uff09\u4f1a\u5c1d\u8bd5\u89e3\u51b3\uff08\u91cd\u542f\u624b\u673a\uff09\u3002 |\n| \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u51b3\u7b56\u6743 | **D\u89e6\u53d1** | **\u5bb6\u4eba\u660e\u786e\u53cd\u5bf9+\u4e89\u5435** | > \u201c\u6211\u662f\u7792\u7740\u6211\u7238\u5988\u7684\u3002\u4ed6\u4eec\u5f88\u8001\u6d3e\u3002\u4e4b\u524d\u56e0\u4e3a\u8fd9\u4e2a\u4e8b\u60c5\u5435\u8fc7\u67b6\u2026\u548c\u4ed6\u4eec\u8bf4\u4e0d\u901a\u201d |\n\n\u26a1 **\u5e95\u5ea7\u53d6\u77ed\u677f** \u2192 \u6700\u7ec8\u8bc4\u7ea7 = **\u2b07\u4f4e**\uff08\u77ed\u677f\u7ef4\u5ea6\uff1a**\u8d44\u91d1**\u3001**\u5bb6\u5ead\u51b3\u7b56\u6743**\uff09\n\n### \u8f743\uff1a\u5fc3\u7406\u5f39\u6027 \u2192 \u2b07\u4f4e\n\n| \u4fe1\u53f7 | \u8bc1\u636e\u6458\u5f55 |\n|---|---|\n| \u9047\u5230\u95ee\u9898\u65f6\u7684\u7b2c\u4e00\u53cd\u5e94 | **\u5916\u90e8\u6c42\u6551/\u7126\u8651** \u2014 \u9047\u5230\u76f4\u64ad\u95ea\u9000\u4f1a\u53cd\u9988\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u5f3a\u70c8\u5d29\u6e83\u3002 |\n| \u51b3\u7b56\u72ec\u7acb\u6027 | **\u5b8c\u5168\u4f9d\u8d56\u4ed6\u4eba/\u5bb6\u4eba\u963b\u529b\u5de8\u5927** \u2014 \u7ecf\u6d4e\u4e0d\u72ec\u7acb\uff08\u7ed9\u7236\u6bcd\u94b1\uff09\uff0c\u4e14\u5bb6\u4eba\u660e\u786e\u53cd\u5bf9\uff0c\u51b3\u7b56\u53d7\u5916\u90e8\u4e25\u91cd\u5236\u7ea6\u3002 |\n| \u9996\u6b21\u9047\u963b\u65f6\u53cd\u5e94 | **\u7126\u8651\u4f46\u53ef\u5b89\u629a** \u2014 \u5bf9\u8d44\u91d1\u548c\u65f6\u95f4\u95ee\u9898\u8868\u73b0\u51fa\u62c5\u5fe7\uff08\u201c\u592a\u96be\u4e86\u201d\uff09\uff0c\u4f46\u4ecd\u5728\u9500\u552e\u5b89\u629a\u4e0b\u8868\u793a\u201c\u6211\u8bd5\u8bd5\u770b\u5427\u201d\u3002 |\n| \u7ade\u54c1\u7ecf\u5386 | \u672a\u77e5 |\n| \u670d\u52a1\u4f9d\u8d56\u5ea6 | **\u6b63\u5e38\u7b54\u7591** \u2014 \u4e0e\u9500\u552e\u6b63\u5e38\u6c9f\u901a\uff0c\u672a\u8868\u73b0\u51fa\u6781\u7aef\u4f9d\u8d56\u3002 |\n\n**\u5224\u5b9a\u4f9d\u636e**\uff1a\u7528\u6237\u9762\u4e34\u8d44\u91d1\u548c\u5bb6\u5ead\u53cc\u91cd\u538b\u529b\u65f6\u8868\u73b0\u51fa\u660e\u663e\u7126\u8651\uff08\u201c\u592a\u96be\u4e86\u201d\uff09\uff0c\u4e14\u5bb6\u5ead\u53cd\u5bf9\u662f\u5176\u91cd\u5927\u51b3\u7b56\u969c\u788d\uff0c\u5fc3\u7406\u9632\u7ebf\u8106\u5f31\uff0c\u5f39\u6027\u4f4e\u3002\n\n---\n\n## \u56db\u3001\u5206\u5c42\u5224\u5b9a\u7ed3\u679c\n\n### \u5224\u5b9a\u6811\u6267\u884c\u8def\u5f84\n\n```\n\u6b65\u9aa40\uff1a\u652f\u4ed8\u6765\u6e90\u524d\u7f6e\u6838\u67e5 \u2192 \u26a0\ufe0f\u88ab\u529d\u5bfc\u82b1\u5457\u2192\u964dC2\u9884\u8b66\uff08\u9500\u552e\u5728\u7528\u6237\u8d44\u91d1\u4e0d\u8db3\u65f6\u4e3b\u52a8\u8be2\u95ee\u82b1\u5457\u989d\u5ea6\uff09\n\u6b65\u9aa41\uff1aD\u7c7b\u7194\u65ad\u68c0\u67e5 \u2192 \ud83d\udd34\u5df2\u89e6\u53d1\uff1a\u5177\u4f53\u6761\u6b3e\uff08\u7ecf\u6d4e\u7ea2\u7ebf\uff1a\u201c\u53ea\u67092000\u591a\u2026\u7ed9\u4e86\u4e00\u90e8\u5206\u7238\u5988\u8fd8\u623f\u8d37\u2026\u8fd8\u6709\u5916\u516c\u770b\u75c5\u201d\uff1b\u5bb6\u5ead\u7ea2\u7ebf\uff1a\u201c\u7792\u7740\u6211\u7238\u5988\u2026\u5435\u8fc7\u67b6\u201d\uff09\n\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5 \u2192 \ud83d\udd34\u5bb6\u4eba\u53cd\u5bf9\u4e89\u5435\u2192D\u7c7b\u7ec8\u6b62\n\u6b65\u9aa42\uff1a\u9700\u6c42\u771f\u5b9e\u5ea6\u68c0\u67e5 \u2192 [\u52a8\u673a\u4f4e+\u8d44\u6e90\u4f4e\u2192C2\u7ec8\u6b62] \uff08\u8def\u5f84\u7ec8\u6b62\u4e8eD\u7c7b\uff09\n\u6b65\u9aa43\uff1aC1\u8bc6\u522b \u2192 [\u4e0d\u9002\u7528]\n\u6b65\u9aa44\uff1aAB\u533a\u5206 \u2192 [\u4e0d\u9002\u7528]\n\u6b65\u9aa45\uff1a\u4fee\u6b63\u56e0\u5b50 \u2192 [\u4e0d\u9002\u7528]\n```\n\n### \u6700\u7ec8\u7ed3\u8bba\n\n| \u9879\u76ee | \u7ed3\u679c |\n|---|---|\n| **ABCD \u5206\u5c42** | **\ud83d\udd34D \u2014 \u9ad8\u5371\u7194\u65ad\u578b** |\n| **\u7528\u6237\u539f\u578b** | **\u9000\u8d39\u578b \u2014 \u4ea7\u54c1\u9519\u914d\u578b** |\n| **\u7efc\u5408\u7f6e\u4fe1\u5ea6** | **\u9ad8\uff08\u4fe1\u53f7\u5145\u5206\uff09** |\n\n### \u539f\u578b\u5339\u914d\u4f9d\u636e\n\n| \u539f\u578b | \u540d\u79f0 | \u662f\u5426\u547d\u4e2d | \u5339\u914d\u8bc1\u636e |\n|---|---|---|---|\n| T1 | \ud83c\udf96\ufe0f \u793e\u533a\u5efa\u9020\u8005 | \u5426 | \u65e0\u8bc1\u636e |\n| T2 | \ud83d\udee0\ufe0f \u5e55\u540e\u627f\u91cd\u8005 | \u5426 | \u65e0\u8bc1\u636e |\n| T3 | \ud83d\udcda \u6280\u672f\u94bb\u7814\u8005 | \u5426 | \u65e0\u8bc1\u636e |\n| T4 | \ud83d\udcdd \u52a1\u5b9e\u53d8\u73b0\u8005 | **\u662f** | \u5173\u6ce8\u201c\u8bd5\u97f3\u63a5\u5355\u201d\u3001\u201c\u526f\u4e1a\u6536\u5165\u201d\uff0c\u4f46\u8d44\u6e90\u4e25\u91cd\u4e0d\u8db3\u3002 |\n| T5 | \ud83c\udf31 \u8bd5\u6c34\u63a2\u7d22\u8005 | \u5426 | \u5174\u8da3\u9a71\u52a8\u4e0d\u8db3\u3002 |\n| T6 | \ud83d\ude1f \u9ad8\u7126\u8651\u4ece\u4f17\u8005 | **\u662f** | \u5728\u8d44\u91d1\u548c\u5bb6\u5ead\u538b\u529b\u4e0b\u7126\u8651\uff08\u201c\u592a\u96be\u4e86\u201d\uff09\uff0c\u51b3\u7b56\u53d7\u9500\u552e\u5f15\u5bfc\u3002 |\n| T7 | \ud83d\udd04 \u590d\u8d2d\u751f\u6001\u578b | \u5426 | \u65e0\u8bc1\u636e |\n| T8 | \ud83d\udd70\ufe0f \u4e34\u754c\u89c2\u671b\u8005 | \u5426 | \u5df2\u8868\u73b0\u51fa\u8d2d\u4e70\u610f\u5411\u3002 |\n| \u9000\u8d39\u578b | \ud83d\udea8 \u4ea7\u54c1\u9519\u914d\u578b | **\u662f** | **\u6838\u5fc3\u8bc1\u636e**\uff1a7380\u5143\u8bfe\u7a0b\u4ef7\u683c\u8fdc\u8d85\u5176\u652f\u4ed8\u80fd\u529b\uff08\u4ec52000\u4f59\u5143\uff09\uff0c\u4e14\u5bb6\u4eba\u5f3a\u70c8\u53cd\u5bf9\u3002\u8d2d\u4e70\u51b3\u7b56\u5efa\u7acb\u5728\u8d44\u6e90\u4e25\u91cd\u9519\u914d\u7684\u57fa\u7840\u4e0a\u3002 |\n\n**\u6700\u7ec8\u539f\u578b** \u2192 **\u9000\u8d39\u578b\uff08\u4ea7\u54c1\u9519\u914d\u578b\uff09**\uff0c\u7406\u7531\uff1a\u7528\u6237\u6709\u53d8\u73b0\u52a8\u673a\uff08T4\uff09\u548c\u7126\u8651\u60c5\u7eea\uff08T6\uff09\uff0c\u4f46**\u8d44\u91d1\u4e25\u91cd\u77ed\u7f3a**\uff08\u9700\u501f\u8d37/\u52a8\u7528\u751f\u6d3b\u8d39\uff09\u53e0\u52a0**\u5bb6\u5ead\u660e\u786e\u53cd\u5bf9**\uff0c\u6784\u6210\u53cc\u91cdD\u7c7b\u7194\u65ad\u6761\u4ef6\uff0c\u8d2d\u4e70\u884c\u4e3a\u4e0e\u81ea\u8eab\u8d44\u6e90\u5e95\u5ea7\u4e25\u91cd\u4e0d\u5339\u914d\uff0c\u9000\u8d39\u98ce\u9669\u6781\u9ad8\u3002\n\n---\n\n## \u4e94\u3001\u9000\u8d39\u6295\u8bc9\u98ce\u9669\u4e13\u9879\u8bc4\u4f30\n\n### \u98ce\u9669\u7b49\u7ea7\uff1a\u26d4\u6781\u9ad8\n\n### \u9000\u8d39\u6839\u56e0\u9884\u5224\n\n| \u9000\u8d39\u6839\u56e0\u7c7b\u578b | \u547d\u4e2d\u5224\u65ad | \u8bc1\u636e |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b\uff08\u914d\u5076/\u7236\u6bcd\u53cd\u5bf9\uff0c\u5360\u9000\u8d3925%\uff09 | **\u662f** | > \u201c\u6211\u662f\u7792\u7740\u6211\u7238\u5988\u7684\u2026\u4e4b\u524d\u56e0\u4e3a\u8fd9\u4e2a\u4e8b\u60c5\u5435\u8fc7\u67b6\u201d |\n| \u65f6\u95f4\u7ed3\u6784\u5d29\u6e83\u578b\uff08\u5012\u73ed/\u62a4\u5de5/\u65e0\u6cd5\u53c2\u52a0\uff0c\u536021%\uff09 | \u5426 | \u65f6\u95f4\u53ef\u534f\u8c03\uff0c\u975e\u4e3b\u8981\u77db\u76fe\u3002 |\n| **\u501f\u8d37\u4ed8\u6b3e\u540e\u7ecf\u6d4e\u5d29\u6e83\u578b\uff08\u536015%\uff09** | **\u662f** | > \u201c\u53ea\u67092000\u591a\u2026\u8fd8\u5dee1500\u5de6\u53f3\u2026\u82b1\u5457\u8c8c\u4f3c\u989d\u5ea6\u4e0d\u591f\u201d \u2014 **\u6781\u6709\u53ef\u80fd\u5728\u4ed8\u6b3e\u540e\u56e0\u7ecf\u6d4e\u538b\u529b\u53cd\u6094** |\n| \u8eab\u4f53/\u5065\u5eb7\u95ee\u9898\u578b\uff08\u536013%\uff09 | \u5426 | \u65e0\u8bc1\u636e\u3002 |\n| \u51b2\u52a8\u6d88\u8d39\u51b7\u9759\u671f\u6094\u5355\u578b\uff08\u536010%\uff09 | **\u662f** | \u5728\u8d44\u91d1\u538b\u529b\u548c\u5bb6\u5ead\u53cd\u5bf9\u4e0b\uff0c\u4ecd\u88ab\u9500\u552e\u5f15\u5bfc\u5c1d\u8bd5\u652f\u4ed8\uff0c\u6781\u6613\u5728\u51b7\u9759\u671f\u540e\u6094\u3002 |\n| \u5185\u5bb9/\u9884\u671f\u843d\u5dee\u578b\uff08\u53607%\uff09 | \u4e0d\u786e\u5b9a | \u5c1a\u672a\u5f00\u59cb\u5b66\u4e60\uff0c\u4f46\u8d44\u6e90\u4e0d\u8db3\u53ef\u80fd\u5bfc\u81f4\u5b66\u4e60\u6548\u679c\u4e0d\u4f73\u3002 |\n| \u6570\u5b57\u5316\u64cd\u4f5c\u80fd\u529b\u4e0d\u8db3\u578b\uff08\u53605%\uff09 | \u5426 | \u80fd\u6b63\u5e38\u4f7f\u7528\u5fae\u4fe1\u3001\u53c2\u4e0e\u76f4\u64ad\uff0c\u65e0\u64cd\u4f5c\u969c\u788d\u3002 |\n\n### \u9000\u8d39\u65f6\u95f4\u7a97\u9884\u6d4b\n\n- **\u9ad8\u5371\u7a97\u53e3**\uff1a**\u4ed8\u6b3e\u540e24\u5c0f\u65f6\u5185 / \u9996\u6708\u5185**\n- **\u9884\u5224\u7406\u7531**\uff1a\u7528\u6237\u652f\u4ed8\u540e\uff0c\u5c06\u7acb\u5373\u9762\u4e34\u771f\u5b9e\u7684\u7ecf\u6d4e\u538b\u529b\uff08\u9700\u8fd8\u6b3e\uff09\u548c\u6f5c\u5728\u7684\u5bb6\u4eba\u8d28\u95ee\uff0c\u53cc\u91cd\u538b\u529b\u4e0b\u6781\u6613\u5728\u77ed\u65f6\u95f4\u5185\u7533\u8bf7\u9000\u8d39\u3002\n\n### \u6295\u8bc9\u5347\u7ea7\u98ce\u9669\n\n- **\u6295\u8bc9\u53ef\u80fd\u6027**\uff1a**\u9ad8**\n- **\u4e3b\u8981\u89e6\u53d1\u70b9**\uff1a**\u9500\u552e\u5728\u660e\u77e5\u7528\u6237\u8d44\u91d1\u7d27\u5f20\u3001\u5bb6\u4eba\u53cd\u5bf9\u7684\u60c5\u51b5\u4e0b\uff0c\u4ecd\u5f15\u5bfc\u5176\u4f7f\u7528\u82b1\u5457\u652f\u4ed8**\u3002\u4e00\u65e6\u7528\u6237\u652f\u4ed8\u540e\u53cd\u6094\uff0c\u6781\u6613\u4ee5\u201c\u8bf1\u5bfc\u501f\u8d37\u201d\u3001\u201c\u9690\u7792\u5bb6\u4eba\u201d\u4e3a\u7531\u53d1\u8d77\u6295\u8bc9\u3002\n\n---\n\n## \u516d\u3001\u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n\n### \u4f26\u7406\u9632\u7ebf\u89e6\u53d1\u72b6\u6001\uff08\u5341\u6761\uff0c\u9010\u6761\u68c0\u67e5\uff09\n\n| \u9632\u7ebf\u7f16\u53f7 | \u9632\u7ebf\u540d\u79f0 | \u72b6\u6001 |\n|---|---|---|\n| \u2460 | \u65f6\u95f4\u7834\u4ea7\uff08\u6559\u5506\u6302\u673a\u51fa\u52e4\uff09 | \u2705\u672a\u89e6\u53d1 |\n| \u2461 | \u6bd2\u9e21\u6c64PUA\uff08\u6311\u62e8\u5bb6\u5ead\u8bdd\u672f\uff09 | \u2705\u672a\u89e6\u53d1 |\n| **\u2462** | **\u5e95\u5c42\u5d29\u584c\uff08\u91cd\u75be/\u4e27\u4eb2/\u6324\u538b\u53e3\u7cae/\u996d\u94b1/\u5b69\u5b50\u5b66\u8d39\uff09** | **\ud83d\udd34\u5df2\u89e6\u53d1**\uff08\u7528\u6237\u8d44\u91d1\u7528\u4e8e\u201c\u7ed9\u7238\u5988\u8fd8\u623f\u8d37\u201d\u3001\u201c\u5916\u516c\u770b\u75c5\u201d\uff0c\u62a5\u540d\u5c06\u6324\u538b\u5bb6\u5ead\u5fc5\u8981\u5f00\u652f\uff09 |\n| \u2463 | \u9ad8\u77e5\u9519\u6295\uff08\u5bf9\u9ad8\u7406\u667a\u7528\u6237\u4f7f\u7528\u4e0b\u6c89\u60c5\u611fPUA\u8bdd\u672f\uff09 | \u2705\u672a\u89e6\u53d1 |\n| \u2464 | \u4ee3\u9645\u65ad\u5976\uff08\u4f4e\u9f84\u4f9d\u8d56\u7236\u8f88\uff09 | \u2705\u672a\u89e6\u53d1\uff08\u7528\u6237\u4e3a\u4f53\u5236\u5185\u5de5\u4f5c\u8005\uff0c\u4f46\u7ecf\u6d4e\u4e0a\u4ecd\u9700\u652f\u6301\u5bb6\u5ead\uff09 |\n| \u2465 | \u94f6\u53d1\u65cf\u64cd\u4f5c\u65ad\u5c42\uff08>65\u5c81+\u590d\u6742\u8f6f\u4ef6\u8bfe\u7a0b\uff09 | \u2705\u672a\u89e6\u53d1 |\n| \u2466 | AI\u5c65\u7ea6\u9020\u5047\uff08AI\u4ee3\u66ff\u771f\u4eba\u8f85\u5bfc\u672a\u544a\u77e5\u7528\u6237\uff09 | \u2705\u672a\u89e6\u53d1 |\n| **\u2467** | **\u5bb6\u5ead\u8d44\u91d1\u9690\u7792\uff08\u80cc\u7740\u4f34\u4fa3\u62a5\u540d\uff0c\u6781\u6613\u5168\u76d8\u9000\u8d39+\u5bb6\u5ead\u7ea0\u7eb7\uff09** | **\ud83d\udd34\u5df2\u89e6\u53d1**\uff08\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u7792\u7740\u6211\u7238\u5988\u201d\uff09 |\n| \u2468 | \u51b2\u52a8\u8d2d\u4e70\u60c5\u5883\uff08\u6df1\u591c22:00\u540e\u76f4\u64ad\u95f4\u51b2\u5355+\u65e0\u524d\u671f\u54a8\u8be2\uff09 | \u2705\u672a\u89e6\u53d1\uff08\u65e5\u95f4\u54a8\u8be2\u8f6c\u5316\uff09 |\n| \u2469 | \u9000\u8d39\u5386\u53f2\u9884\u8b66\uff08\u672c\u5e73\u53f0\u6216\u7ade\u54c1\u6709\u9000\u8d39\u8bb0\u5f55\u2192\u81ea\u52a8\u964d\u4e00\u6863\uff09 | \u4e0d\u786e\u5b9a |\n\n### \u9500\u552e\u884c\u4e3a\u5408\u89c4\u5ba1\u67e5\n\n| \u5408\u89c4\u9879 | \u72b6\u6001 |\n|---|---|\n| **\u662f\u5426\u5728\u7528\u6237\u8bf4\u201c\u6ca1\u94b1\u201d\u540e\u63a8\u8350\u82b1\u5457/\u4fe1\u7528\u5361** | **\u662f**\uff08\u7528\u6237\u8bf4\u201c\u53ea\u67092000\u591a\u201d\uff0c\u9500\u552e\u95ee\u201c\u67092000\u5de6\u53f3\u7684\u652f\u4ed8\u5b9d\u82b1\u5457\u6216\u8005\u4fe1\u7528\u5361\u989d\u5ea6\u561b\uff1f\u201d\uff09 |\n| \u662f\u5426\u4f7f\u7528\u201c\u968f\u65f6\u9000\u8d39\u201d\u4f5c\u4e3a\u4fc3\u6210\u8bdd\u672f | \u5426 |\n| **\u662f\u5426\u5bf9\u8d22\u52a1\u8106\u5f31\u7528\u6237\u4f7f\u7528\u201c\u903c\u81ea\u5df1\u4e00\u628a\u201d\u8bdd\u672f** | **\u662f**\uff08\u9500\u552e\u8bf4\u201c\u6211\u5f53\u65f6\u8d1f\u503a\u51e0\u5341\u4e2a\uff0c\u8981\u6324\u51fa\u8fd9\u51e0\u5343\uff0c\u4e5f\u662f\u4f7f\u51fa\u4e86\u5403\u5976\u7684\u529b\u6c14\uff0c\u5bb3\uff0c\u771f\u7684\u662f\u8c41\u51fa\u53bb\u4e86\u201d\uff09 |\n| **\u7528\u6237\u8bf4\u201c\u5bb6\u4eba\u4e0d\u77e5\u9053\u201d\u540e\u662f\u5426\u8ffd\u95ee\u6838\u5b9e** | **\u5426**\uff08\u7528\u6237\u4e3b\u52a8\u66b4\u9732\u5bb6\u5ead\u77db\u76fe\u540e\uff0c\u9500\u552e\u672a\u6838\u5b9e\u98ce\u9669\uff0c\u53cd\u800c\u7ee7\u7eed\u5f15\u5bfc\u652f\u4ed8\uff09 |\n| \u662f\u5426\u5728\u7528\u6237\u8bf4\u201c\u6211\u53bb\u501f\u94b1\u201d\u540e\u4ecd\u7ee7\u7eed\u63a8\u8fdb\u6210\u4ea4 | \u4e0d\u786e\u5b9a\uff08\u7528\u6237\u672a\u660e\u786e\u8bf4\u501f\u94b1\uff0c\u4f46\u8d44\u91d1\u7f3a\u53e3\u660e\u663e\uff09 |\n| \u662f\u5426\u4f7f\u7528\u6536\u76ca\u4fdd\u5e95\u627f\u8bfa\uff08\u201c\u4fdd\u8bc1\u6708\u5165\u8fc7\u4e07\u201d\uff09 | \u5426\uff08\u4f7f\u7528\u6848\u4f8b\u5f15\u5bfc\uff0c\u5982\u201c\u6708\u5165\u51e0\u4e07\u7684\u5b66\u59d0\u201d\uff09 |\n| \u662f\u5426\u5728\u7528\u6237\u8868\u8fbe\u72b9\u8c6b\u65f6\u65bd\u52a0\u65f6\u95f4\u9650\u538b\uff08\u201c\u4eca\u5929\u4e0d\u62a5\u5c31\u6ca1\u540d\u989d\u201d\uff09 | \u662f\uff08\u201c\u6ca1\u51e0\u4e2a\u540d\u989d\u4e86\u201d\u3001\u201c\u540d\u989d\u7d27\u5f20\u201d\uff09 |\n\n---\n\n## \u4e03\u3001\u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\n\n### \u2705 \u7acb\u523b\u505a\uff08\u6700\u9ad8\u4f18\u5148\u7ea7\uff09\n\n1.  **\u7acb\u5373\u542f\u52a8\u7eff\u8272\u9000\u8d39\u901a\u9053**\uff1a\u9274\u4e8e\u7528\u6237\u5df2\u89e6\u53d1\u53cc\u91cdD\u7c7b\u7194\u65ad\uff08\u7ecf\u6d4e\u7ea2\u7ebf+\u5bb6\u5ead\u7ea2\u7ebf\uff09\uff0c**\u5fc5\u987b\u53cb\u597d\u529d\u9000\uff0c\u5efa\u8bae\u5176\u7ecf\u6d4e\u6761\u4ef6\u6539\u5584\u3001\u83b7\u5f97\u5bb6\u4eba\u652f\u6301\u540e\u518d\u8003\u8651\u5b66\u4e60**\u3002\n2.  **\u51bb\u7ed3\u5347\u4ed3\u4e0e\u4efb\u4f55\u4ed8\u8d39\u5f15\u5bfc**\uff1a\u4e25\u7981\u4efb\u4f55\u8fdb\u4e00\u6b65\u7684\u4ed8\u8d39\u5f15\u5bfc\uff0c\u5305\u62ec\u4f53\u9a8c\u5305\u3002\n3.  **\u5411\u9500\u552e\u56e2\u961f\u540c\u6b65\u98ce\u9669**\uff1a\u6807\u8bb0\u8be5\u7528\u6237\u4e3a\u201c\u9ad8\u5371\u7194\u65ad\u578b\u201d\uff0c\u9632\u6b62\u5176\u4ed6\u9500\u552e\u518d\u6b21\u89e6\u8fbe\u8f6c\u5316\u3002\n\n### \u23f0 \u5165\u5b66\u7b2c\u4e00\u5468\u505a\n*\u4e0d\u9002\u7528\uff0c\u7528\u6237\u4e0d\u5e94\u88ab\u5141\u8bb8\u5165\u5b66\u3002*\n\n### \u274c \u7edd\u5bf9\u4e0d\u505a\uff08\u96f7\u533a\u8b66\u544a\uff09\n\n1.  **\u4e25\u7981\u4efb\u4f55\u5f62\u5f0f\u7684\u633d\u56de\u6216\u903c\u5355**\u3002\u7ee7\u7eed\u63a8\u8fdb\u5c06\u5bfc\u81f4\u6781\u9ad8\u6982\u7387\u7684\u9000\u8d39\u548c\u6295\u8bc9\u3002\n2.  **\u7981\u6b62\u5f15\u5bfc\u7528\u6237\u4f7f\u7528\u82b1\u5457\u3001\u4fe1\u7528\u5361\u6216\u5411\u4ed6\u4eba\u501f\u94b1**\u6765\u8865\u9f50\u5b66\u8d39\u3002\n3.  **\u7981\u6b62\u5ffd\u89c6\u6216\u6de1\u5316\u7528\u6237\u5df2\u660e\u786e\u8868\u8fbe\u7684\u5bb6\u5ead\u53cd\u5bf9\u548c\u7ecf\u6d4e\u538b\u529b**\u3002\n\n### \ud83d\udcac \u7834\u51b0\u8bdd\u672f\u5efa\u8bae\n*\u4e0d\u9002\u7528\uff0c\u5e94\u4ee5\u529d\u9000\u548c\u5b89\u629a\u4e3a\u4e3b\u3002*\n\n### \u26a0\ufe0f \u5347\u4ed3\u7b56\u7565\n- **\u80fd\u5426\u5347\u4ed3**\uff1a**\u4e25\u7981**\n- **\u5347\u4ed3\u6761\u4ef6**\uff1a\u65e0\n- **\u82e5\u7ea0\u7ed3\u4e0d\u51b3**\uff1a**\u4e0d\u9002\u7528Down-sell\uff0c\u76f4\u63a5\u529d\u9000**\u3002\n\n---\n\n## \u516b\u3001\u4ea7\u54c1\u4e0e\u670d\u52a1\u5339\u914d\u6027\u5224\u65ad\n\n### \u5f53\u524d\u4ea7\u54c1\u5339\u914d\u5ea6\uff1a\ud83d\udd34\u9519\u914d\n\n| \u7ef4\u5ea6 | \u5224\u65ad |\n|---|---|\n| \u8bfe\u7a0b\u65b9\u5411\u4e0e\u7528\u6237\u5174\u8da3/\u9700\u6c42\u662f\u5426\u4e00\u81f4 | \u6709\u504f\u5dee\uff08\u7528\u6237\u6709\u526f\u4e1a\u9700\u6c42\uff0c\u4f46\u5f53\u524d\u7ecf\u6d4e\u4e0e\u5bb6\u5ead\u72b6\u51b5\u4e0d\u652f\u6301\uff09 |\n| \u8bfe\u7a0b\u96be\u5ea6\u4e0e\u7528\u6237\u64cd\u4f5c\u80fd\u529b\u662f\u5426\u5339\u914d | \u5339\u914d\uff08\u7528\u6237\u80fd\u5b8c\u6210\u57fa\u7840\u64cd\u4f5c\uff09 |\n| **\u8bfe\u7a0b\u65f6\u95f4\u8981\u6c42\u4e0e\u7528\u6237\u53ef\u7528\u65f6\u95f4\u662f\u5426\u5339\u914d** | **\u6709\u538b\u529b\u4f46\u53ef\u534f\u8c03**\uff08\u7528\u6237\u8868\u793a\u53ef\u51d1\u51fa\u6bcf\u54685\u5c0f\u65f6\uff0c\u4f46\u5e38\u52a0\u73ed\uff09 |\n| **\u8bfe\u7a0b\u4ef7\u683c\u4e0e\u7528\u6237\u652f\u4ed8\u80fd\u529b\u662f\u5426\u5339\u914d** | **\u660e\u663e\u8d85\u51fa**\uff08\u7528\u6237\u81ea\u6709\u8d44\u91d1\u4ec52000+\uff0c\u9700\u501f\u8d37\u4e14\u5f71\u54cd\u5bb6\u5ead\u5f00\u652f\uff09 |\n| \u62db\u52df\u8425\u5c97\u4f4d\u9009\u62e9\u4e0e\u8d2d\u4e70\u8bfe\u7a0b\u65b9\u5411\u662f\u5426\u4e00\u81f4 | \u4e00\u81f4\uff08\u7528\u6237\u5bf9\u753b\u672c\u3001\u6709\u58f0\u8bfb\u3001\u8bbe\u8ba1\u5747\u611f\u5174\u8da3\uff09 |\n\n### \u6539\u914d\u5efa\u8bae\n- **\u575a\u51b3\u529d\u9000\u5f53\u524d\u9ad8\u4ef7\u8bfe\u7a0b**\u3002\n- \u82e5\u7528\u6237\u672a\u6765\u7ecf\u6d4e\u72ec\u7acb\u4e14\u83b7\u5f97\u5bb6\u5ead\u652f\u6301\uff0c\u53ef\u8003\u8651\u63a8\u8350**98-398\u5143\u7684\u5165\u95e8\u4f53\u9a8c\u5305**\u8fdb\u884c\u8f7b\u91cf\u5c1d\u8bd5\u3002\n- \u73b0\u9636\u6bb5\u53ef\u5f15\u5bfc\u5176\u5173\u6ce8\u5e73\u53f0\u514d\u8d39\u8d44\u6e90\uff0c\u7ef4\u6301\u5174\u8da3\u3002\n\n---\n\n## \u4e5d\u3001\u5173\u952e\u8bc1\u636e\u6458\u5f55\n\n> \u4ee5\u4e0b\u4e3a\u804a\u5929\u8bb0\u5f55\u4e2d\u6700\u80fd\u652f\u6491\u5224\u65ad\u7684\u539f\u8bdd\uff08\u6700\u591a5\u6761\uff09\uff1a\n\n1. > \u201c\u53ea\u67092000\u591a\u2026\u7ed9\u4e86\u4e00\u90e8\u5206\u7238\u5988\u8fd8\u623f\u8d37\u2026\u8fd8\u6709\u5916\u516c\u770b\u75c5\u2026\u8fd8\u5dee1500\u5de6\u53f3\u2026\u5de5\u8d44\u8981\u4e2d\u65ec\u624d\u80fd\u53d1\u4e0b\u6765\u201d \u2014 \u6307\u5411\uff1a**\u8d44\u91d1\u7ef4\u5ea6D\u7c7b\u7194\u65ad\uff08\u7ecf\u6d4e\u7ea2\u7ebf\uff09**\n2. > \u201c\u6211\u662f\u7792\u7740\u6211\u7238\u5988\u7684\u3002\u4ed6\u4eec\u5f88\u8001\u6d3e\u3002\u4e4b\u524d\u56e0\u4e3a\u8fd9\u4e2a\u4e8b\u60c5\u5435\u8fc7\u67b6\u2026\u548c\u4ed6\u4eec\u8bf4\u4e0d\u901a\u201d \u2014 \u6307\u5411\uff1a**\u5bb6\u5ead\u51b3\u7b56\u6743D\u7c7b\u7194\u65ad\uff08\u5bb6\u5ead\u7ea2\u7ebf\uff09**\n3. > \u201c\u67092000\u5de6\u53f3\u7684\u652f\u4ed8\u5b9d\u82b1\u5457\u6216\u8005\u4fe1\u7528\u5361\u989d\u5ea6\u561b\uff1f\u201d \u2014 \u6307\u5411\uff1a**\u9500\u552e\u5728\u7528\u6237\u8d44\u91d1\u4e0d\u8db3\u65f6\u5f15\u5bfc\u4f7f\u7528\u501f\u8d37\u5de5\u5177**\n4. > \u201c\u526f\u4e1a \uff0c\u6211\u6709\u4e3b\u4e1a \u6211\u662f\u4f53\u5236\u5185\u7684[\u6342\u8138]\u201d \u2014 \u6307\u5411\uff1a**\u52a8\u673a\u7eaf\u5ea6\u4f4e\uff08\u4e3a\u526f\u4e1a\u53d8\u73b0\u800c\u6765\uff09**\n5. > \u201c\u6211\u6015\u94b1\u4e0d\u591f[\u6342\u8138]\u201d \u2014 \u6307\u5411\uff1a**\u7528\u6237\u5bf9\u4ef7\u683c\u7684\u654f\u611f\u548c\u8d44\u91d1\u7126\u8651**\n\n---\n\n## \u5341\u3001\u4e00\u53e5\u8bdd\u7ed3\u8bba\uff08\u4f9b\u7ba1\u7406\u5c42\u5feb\u901f\u626b\u8bfb\uff09\n\n> **UID: 677146474** \u5224\u5b9a\u4e3a **\ud83d\udd34D\u7c7b\uff08\u9ad8\u5371\u7194\u65ad\u578b\uff09**\uff08\u9000\u8d39\u578b-\u4ea7\u54c1\u9519\u914d\u578b\uff09\uff0c\u9000\u8d39\u98ce\u9669 **\u26d4\u6781\u9ad8**\u3002\u6838\u5fc3\u539f\u56e0\uff1a**\u8d44\u91d1\u4e25\u91cd\u4e0d\u8db3\uff08\u9700\u52a8\u7528\u751f\u6d3b\u8d39/\u501f\u8d37\uff09\u4e14\u5bb6\u4eba\u660e\u786e\u53cd\u5bf9\uff0c\u6784\u6210\u53cc\u91cd\u7194\u65ad**\u3002\u5efa\u8bae\uff1a**\u7acb\u5373\u542f\u52a8\u7eff\u8272\u9000\u8d39\u901a\u9053\uff0c\u53cb\u597d\u529d\u9000**\u3002\n\n{\"core_type\": \"\u9000\u8d39\u578b-\u4ea7\u54c1\u9519\u914d\u578b\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"product_match\": \"\u9519\u914d\", \"action\": \"\u7acb\u5373\u529d\u9000\u5e76\u542f\u52a8\u7eff\u8272\u9000\u8d39\u901a\u9053\"}";
