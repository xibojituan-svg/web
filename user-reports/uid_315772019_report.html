    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n> **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4e2d\u7f3a\u5931\u5173\u952e\u4fe1\u606f\uff0c\u5305\u62ec\uff1a1. \u7528\u6237\u8d2d\u4e70\u7684\u5177\u4f53\u8bfe\u7a0b\u53ca\u4ef7\u683c\uff1b2. \u7528\u6237\u7684\u652f\u4ed8\u65b9\u5f0f\u4e0e\u8d44\u91d1\u6765\u6e90\uff1b3. \u7528\u6237\u7684\u5bb6\u5ead\u60c5\u51b5\u4e0e\u51b3\u7b56\u77e5\u60c5\u6743\uff1b4. \u7528\u6237\u8fc7\u5f80\u804c\u4e1a\u4e0e\u6536\u5165\u80cc\u666f\u3002\u4ee5\u4e0b\u5206\u6790\u57fa\u4e8e\u73b0\u6709\u884c\u4e3a\u4e0e\u60c5\u7eea\u7ebf\u7d22\uff0c\u90e8\u5206\u8bc4\u7ea7\u5b58\u5728\u63a8\u65ad\u3002\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 315772019 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-23 \u81f3 2026-02-07 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6de1\u6de1\u7684\u84dd(\u9646\u4e1b\u5dcd) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | **\u4fe1\u606f\u7f3a\u5931** (\u63a8\u6d4b\u4e3a\u6709\u58f0\u4e66/\u914d\u97f3\u7c7b\u8bfe\u7a0b) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u7f3a\u5931** (\u9700\u8b66\u60d5\u9910\u996e\u4e2a\u4f53\u6237\u73b0\u91d1\u6d41\u4e0d\u7a33\u5b9a\u98ce\u9669) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u7ecf\u8425\u9910\u996e\u5e97\uff0c\u81ea\u79f0\u201c\u6bd4\u72d7\u72d7\u8fd8\u5fd9\u201d\uff0c\u9700\u7167\u987e\u5b69\u5b50\uff0c\u65f6\u95f4\u88ab\u4e25\u91cd\u5207\u5272) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** (\u63d0\u53ca\u201c\u7ed9\u5b69\u5b50\u5e2e\u5fd9\u201d\uff0c\u4f46\u672a\u660e\u786e\u5bb6\u4eba\u5bf9\u5b66\u4e60\u7684\u652f\u6301\u6216\u53cd\u5bf9\u6001\u5ea6) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u6709\u660e\u786e\u7684\u53d8\u73b0\u671f\u671b\uff08\u201c\u8fd8\u662f\u4ee5\u53d8\u73b0\u4e3a\u4e3b\u201d\uff09\uff0c\u4f46\u884c\u52a8\u4e0a\u53d7\u9650\u4e8e\u4e3b\u4e1a\uff0c\u6295\u5165\u5ea6\u6447\u6446\uff0c\u66f4\u50cf\u662f\u5728\u63a2\u7d22\u526f\u4e1a\u53ef\u80fd\u6027\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8fd9\u4e2a\u8bd7\u7136\u6bd4\u53d8\u6162\u4e00\u4e9b\uff0c,\u4f46\u662f\u4e0d\u662f\u4ee5\u5a31\u4e50\u4e3a\u4e3b\uff0c,\u5b83\u8fd8\u662f\u4ee5\u53d8\u73b0\u4e3a\u4e3b\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u8003\u8651\u8d2d\u4e70\u4e8c\u624b\u8bbe\u5907\uff08\u201c\u5979\u59b9\u59b9\u7684\u90a3\u5957\u201d\uff09\uff0c\u5bf9\u4ef7\u683c\u654f\u611f\uff0c\u975e\u51b2\u52a8\u6d88\u8d39\uff0c\u4f46\u4e3b\u4e1a\u4e3a\u9910\u996e\uff0c\u73b0\u91d1\u6d41\u53ef\u80fd\u4e0d\u7a33\u5b9a\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u6781\u4f4e** \u2014 **\u6838\u5fc3\u77ed\u677f**\u3002\u53cd\u590d\u5f3a\u8c03\u201c\u592a\u5fd9\u4e86\u201d\u3001\u201c\u4e00\u5929\u6bd4\u6211\u4eec\u5bb6\u72d7\u5b50\u8fd8\u5fd9\u201d\u3001\u201c\u505a\u9910\u996e\u592a\u62d6\u7d2f\u4eba\u201d\uff0c\u5b66\u4e60\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\u4e14\u4e0d\u53ef\u63a7\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4e2d** \u2014 \u63d0\u53ca\u9700\u8981\u201c\u7ed9\u5b69\u5b50\u5e2e\u5fd9\u201d\uff0c\u5bb6\u5ead\u4e8b\u52a1\u53ef\u80fd\u5360\u7528\u7cbe\u529b\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u5f3a\u70c8\u53cd\u5bf9\u6216\u652f\u6301\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u9700\u95f4\u6b47\u6027\u5b89\u629a\u3002\u9762\u5bf9\u6280\u672f\u64cd\u4f5c\u56f0\u96be\uff08\u627e\u4e0d\u5230\u76f4\u64ad\u8bfe\uff09\u65f6\u8868\u73b0\u51fa\u660e\u663e\u7684\u7126\u8651\u548c\u4f9d\u8d56\uff08\u201c\u8fd8\u5f97\u6709\u8001\u5e08\u6307\u5bfc\u201d\uff09\uff0c\u4f46\u80fd\u4fdd\u6301\u793c\u8c8c\u548c\u79ef\u6781\u6c9f\u901a\uff0c\u672a\u51fa\u73b0\u60c5\u7eea\u5d29\u6e83\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u8fd9 \u4e00\u5929\u6bd4\u6211\u4eec\u5bb6\u72d7\u5b50\u8fd8\u5fd9\u5462[\u8272]\u201d\uff1b > \u201c\u6211\u8fd9\u53ef\u80fd\u70b9\u5f00\u8fd9\u4e2a\u5c31\u662f\u5fae\u4fe1\u56e2\u961f\u91cc\u7684\u90a3\u4e2a\uff0c,\u6309\u7167\u90a3\u4e2a\u5c31\u662f\u5341\u5341\u4e2a\u5b57\u662f\u600e\u4e48\u8bf4\u4e5f\u597d\uff0c,\u7136\u540e\u6309\u7167\u4ed6\u90a3\u4e2a\u64cd\u4f5c\uff0c,\u53ef\u80fd\u6211\u5c31\u6709\u8fd9\u79cd\u76f4\u64ad\u4e86\u3002,\u5982\u679c\u4e0d\u52a0\u64cd\u4f5c\uff0c,\u6211\u8fd9\u4e2a\u662f\u6ca1\u6709\u7684\uff0c,\u6709\u8fd9\u4e2a\u4f5c\u7528\uff0c,\u5c31\u662f\u3002\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c / \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e2d\u5e74\u8f6c\u578b\u7126\u8651\u4e0e\u4ef7\u503c\u611f\u7f3a\u5931**\u3002\u4ece\u4e8b\u9910\u996e\u7b49\u4f53\u529b\u52b3\u52a8\uff0c\u6df1\u611f\u65f6\u95f4\u88ab\u201c\u62d6\u7d2f\u201d\uff0c\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u65b0\u6280\u80fd\uff08\u6709\u58f0\u4e66\uff09\u83b7\u5f97\u4e00\u4efd\u66f4\u7075\u6d3b\u3001\u66f4\u6709\u5c0a\u4e25\u7684\u6536\u5165\u6765\u6e90\uff0c\u4ee5\u62b5\u5fa1\u4e3b\u4e1a\u7684\u4e0d\u786e\u5b9a\u6027\u548c\u5e74\u9f84\u5e26\u6765\u7684\u804c\u4e1a\u5371\u673a\uff08\u201c\u5c31\u611f\u89c9\u5e74\u7eaa\u5e74\u7eaa\u6709\u70b9\u504f\u5927\u4e86\uff0c,\u5c31\u4e0d\u597d\u610f\u601d\u201d\uff09\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u201d\u7684\u5c0a\u91cd\u4e0e\u201c\u88ab\u5e26\u9886\u201d\u7684\u5b89\u5168\u611f**\u3002\u4ed6\u9700\u8981\u88ab\u80af\u5b9a\u5176\u5b66\u4e60\u7684\u52aa\u529b\uff08\u5c3d\u7ba1\u65f6\u95f4\u5c11\uff09\uff0c\u5e76\u5728\u9047\u5230\u6280\u672f\u969c\u788d\u65f6\u83b7\u5f97\u8010\u5fc3\u3001\u4e0d\u5acc\u5f03\u7684\u6307\u5bfc\uff0c\u4ece\u800c\u83b7\u5f97\u201c\u6211\u8fd8\u80fd\u5b66\u65b0\u4e1c\u897f\u201d\u7684\u4ef7\u503c\u8ba4\u540c\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1** \u7c7b (\u52a8\u673a\u5c1a\u53ef\u4f46\u8d44\u6e90\u4e25\u91cd\u53d7\u9650\uff0c\u9700\u91cd\u70b9\u5e2e\u6276) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u578b** (\u76ee\u6807\u6307\u5411\u53d8\u73b0\uff0c\u4f46\u88ab\u73b0\u5b9e\u6761\u4ef6\u4e25\u91cd\u62d6\u7d2f) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4e2d | \u82e5\u5bb6\u4eba\u53d1\u73b0\u5176\u6295\u5165\u5927\u91cf\u788e\u7247\u65f6\u95f4\u5374\u65e0\u5373\u65f6\u6536\u76ca\uff0c\u53ef\u80fd\u62b1\u6028\u201c\u4e0d\u52a1\u6b63\u4e1a\u201d\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u9910\u996e\u4e3b\u4e1a\u7e41\u5fd9\uff08\u201c\u4ece\u4e0b\u5348\u5230\u96f6\u66683\u70b9\u201d\uff09\uff0c\u5bfc\u81f4\u8bfe\u7a0b\u4e25\u91cd\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u3001\u5b66\u4e0d\u4f1a\u3001\u94b1\u767d\u82b1\u201d\u7684\u632b\u8d25\u611f\u548c\u81ea\u8d23\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4e2d | \u9762\u5bf9\u590d\u6742\u7684\u8f6f\u4ef6\u64cd\u4f5c\u3001\u4f5c\u4e1a\u8981\u6c42\u65f6\uff0c\u56e0\u5e74\u9f84\u3001\u89c6\u529b\uff08\u201c\u4e03\u767e\u591a\u5ea6\u201d\uff09\u7b49\u95ee\u9898\u4ea7\u751f\u5b66\u4e60\u65e0\u529b\u611f\uff0c\u82e5\u591a\u6b21\u6c42\u52a9\u65e0\u679c\u53ef\u80fd\u5fc3\u6001\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u77ed\u671f\u5185\u65e0\u6cd5\u63a5\u5355\u53d8\u73b0\uff0c\u4e0e\u201c\u5feb\u901f\u641e\u94b1\u201d\u7684\u671f\u671b\u4ea7\u751f\u843d\u5dee\uff0c\u4f46\u56e0\u5176\u5bf9\u201c\u4e00\u4e07\u5c0f\u65f6\u201d\u6709\u8ba4\u77e5\uff0c\u77ed\u671f\u7206\u53d1\u98ce\u9669\u4e2d\u7b49\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-3\u5468\u540e**\u3002\u5f53\u8bfe\u7a0b\u5185\u5bb9\u52a0\u6df1\u3001\u4f5c\u4e1a\u96be\u5ea6\u548c\u9891\u7387\u589e\u52a0\uff0c\u800c\u5176\u4e3b\u4e1a\uff08\u9910\u996e\uff09\u8fdb\u5165\u5e38\u6001\u7e41\u5fd9\u671f\uff0c\u65f6\u95f4\u51b2\u7a81\u8fbe\u5230\u9876\u5cf0\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cX\u54e5/\u59d0\uff0c\u770b\u5230\u60a8\u804a\u5929\u8bf4\u505a\u9910\u996e\u7279\u522b\u5fd9\uff0c\u8fd8\u62bd\u7a7a\u5b66\u4e60\uff0c\u771f\u7684\u592a\u4e0d\u5bb9\u6613\u4e86\uff0c\u8fd9\u4efd\u4e0a\u8fdb\u5fc3\u7279\u522b\u8ba9\u4eba\u4f69\u670d\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u5c31\u662f\u7ed9\u5fd9\u91cc\u5077\u95f2\u7684\u5b9e\u5e72\u5bb6\u8bbe\u8ba1\u7684\uff0c**\u4f5c\u4e1a\u4e0d\u6015\u665a\u4ea4\uff0c\u76f4\u64ad\u4e0d\u6015\u9519\u8fc7\uff0c\u56de\u653e\u968f\u65f6\u80fd\u770b**\u3002\u60a8\u5c31\u6309\u81ea\u5df1\u7684\u8282\u594f\u6765\uff0c\u6709\u4efb\u4f55\u641e\u4e0d\u61c2\u7684\u64cd\u4f5c\uff0c\u968f\u65f6\u6233\u6211\uff0c\u6211\u7ed9\u60a8\u753b\u5708\u5708\u6307\u8def\uff0c\u4fdd\u8bc1\u4e0d\u8ba9\u8fd9\u4e9b\u5c0f\u4e8b\u513f\u803d\u8bef\u60a8\u5b66\u771f\u672c\u4e8b\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7cbe\u7b80\u7ebf**\u3011\u3002\u805a\u7126\u6700\u6838\u5fc3\u7684\u5f55\u97f3\u3001\u8bd5\u97f3\u6d41\u7a0b\uff0c\u5f31\u5316\u590d\u6742\u7684\u540e\u671f\u3001\u793e\u7fa4\u6d3b\u52a8\u8981\u6c42\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u8865\u5145\u3010**\u4fdd\u59c6\u7ea7\u6280\u672f\u62a4\u822a\u5305**\u3011\uff08\u4e00\u5bf9\u4e00\u64cd\u4f5c\u6307\u5bfc\u3001\u56fe\u6587/\u89c6\u9891\u6307\u5f15\uff09\u3001\u3010**\u5f39\u6027\u65f6\u95f4\u7ba1\u7406\u5305**\u3011\uff08\u4f5c\u4e1a\u5f39\u6027\u63d0\u4ea4\u3001\u91cd\u70b9\u5185\u5bb9\u6458\u8981\u63a8\u9001\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u522b\u4eba\u90fd\u80fd\u5b8c\u6210\u4f60\u4e3a\u4ec0\u4e48\u4e0d\u884c\u201d\u65bd\u538b\uff1b\u5728\u5176\u62b1\u6028\u5fd9\u788c\u65f6\u8bb2\u201c\u65f6\u95f4\u6324\u6324\u603b\u6709\u201d\u7684\u5927\u9053\u7406\uff1b\u50ac\u4fc3\u5176\u53c2\u4e0e\u6240\u6709\u76f4\u64ad\u548c\u793e\u7fa4\u6d3b\u52a8\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u73b0\u6709\u8bfe\u7a0b\u672a\u5b8c\u6210\u3001\u65f6\u95f4\u95ee\u9898\u672a\u89e3\u51b3\u524d\uff0c\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u4f1a\u6781\u5927\u589e\u52a0\u5176\u7126\u8651\u548c\u9000\u8d39\u98ce\u9669\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u5929\u5929\u5fd9\u5f97\u6bd4\u72d7\u72d7\u8fd8\u5fd9\u5462\uff0c\u8eb2\u4e0d\u5f00\u600e\u4e48\u4e5f\u5f97\u7ed9\u5b69\u5b50\u5e2e\u5fd9\u3002\u201d\n2. > \u201c\u505a\u9910\u996e\u592a\u62d6\u7d2f\u4eba\u201d\n3. > \u201c\u6ca1\u6709\u4e00\u4e07\u5c0f\u65f6\u7684\u6253\u78e8\u60f3\u64ad\u6709\u58f0\u4e66\u4e0d\u662f\u90a3\u4e48\u7b80\u5355\u7684\uff0c\u5b66\u4e60\u7684\u65f6\u95f4\u592a\u5c11...\u5fc3\u6025\u5403\u4e0d\u4e86\u70ed\u8c46\u8150\uff0c\u6d88\u5316\u4e0d\u826f\u554a\u7ee7\u7eed\u52aa\u529b\u5b66\u4e60\u3002\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010\u88ab\u751f\u8ba1\u62d6\u7d2f\u7684\u641e\u94b1\u7ed3\u679c\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e00\u4efd\u6709\u5c0a\u4e25\u7684\u526f\u4e1a\u4fdd\u969c\uff0c\u5bf9\u6297\u4e2d\u5e74\u7126\u8651\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u81f4\u5f39\u6027\u7684\u5b66\u4e60\u8def\u5f84\u4e0e\u624b\u628a\u624b\u7684\u6280\u672f\u515c\u5e95\uff0c\u7edd\u4e0d\u65bd\u52a0\u65f6\u95f4\u538b\u529b\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168/\u5c0a\u91cd\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7cbe\u7b80\u7ebf+\u4fdd\u59c6\u7ea7\u6280\u672f\u62a4\u822a\u5305\"}\n```";
