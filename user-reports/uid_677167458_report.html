    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u7528\u6237UID\uff1a677167458\uff08Mr.small fry\uff09\u8fdb\u884c\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677167458 (Mr.small fry) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u4e00\u7c737(\u5218\u51b0\u51b0) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u5199\u4f5c\u8bad\u7ec3\u8425\uff08\u5df2\u4ed8\u6b3e\u62a5\u540d\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3**\uff08\u660e\u786e\u63d0\u53ca\u201c\u5237\u4fe1\u7528\u5361\u7684\u94b1\u90fd\u5f97\u8fd8\u597d\u4e45\u201d\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1\uff08\u6709\u6b63\u5f0f\u5de5\u4f5c\uff0c\u9700\u5e94\u5bf9\u4e34\u65f6\u4f1a\u8bae\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u5355\u8eab\u72ec\u7acb\uff08\u672a\u63d0\u53ca\u5bb6\u5ead\uff0c\u81ea\u8ff0\u9700\u201c\u517b\u6d3b\u81ea\u5df1\u201d\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | \u9971\u6ee1 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u53d8\u73b0\u53cc\u91cd\u9a71\u52a8\u800c\u6765\u3002\u65e2\u6709\u5bf9\u5199\u4f5c\u6280\u5de7\u7684\u94bb\u7814\u5174\u8da3\uff08\u4e3b\u52a8\u66f4\u65b0\u5c0f\u8bf4\u3001\u5206\u6790AI\u4f5c\u54c1\u4e0d\u8db3\uff09\uff0c\u53c8\u6709\u660e\u786e\u7684\u3001\u8feb\u5207\u7684\u73b0\u5b9e\u7ecf\u6d4e\u6539\u5584\u9700\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6ca1\u529e\u6cd5\uff0c\u5f97\u60f3\u529e\u6cd5\u517b\u6d3b\u81ea\u5df1\u201d > \u201c\u6211\u8fd9\u70b9\u5de5\u8d44\uff0c\u4ea4\u5b8c\u6c34\u7535\u4e94\u9669\u4e00\u91d1\u8fd8\u6709\u623f\u79df\uff0c\u5c31\u5269\u4e0b\u5403\u996d\u94b1\u4e86\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u6708\u85aa\u4ec52000+\uff0c\u652f\u4ed8\u5b66\u8d39\u9700\u5237\u4fe1\u7528\u5361\uff0c\u7ecf\u6d4e\u538b\u529b\u6781\u5927\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u6709\u6b63\u5f0f\u5de5\u4f5c\uff08\u4fe1\u8bbf\u4e34\u65f6\u5de5\uff09\uff0c\u4f46\u80fd\u5229\u7528\u788e\u7247\u65f6\u95f4\u7801\u5b57\uff08\u5df2\u519910\u4e07\u5b57\u5c0f\u8bf4\uff09\uff0c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5c1a\u53ef\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4e2d** \u2014 \u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\uff0c\u4f46\u7ecf\u6d4e\u72ec\u7acb\uff0c\u51b3\u7b56\u81ea\u4e3b\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u27a1\u4e2d\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u9700\u95f4\u6b47\u6027\u5b89\u629a\u3002\u9762\u5bf9AI\u5199\u4f5c\u7684\u521d\u671f\u751f\u786c\u7ed3\u679c\u80fd\u7406\u6027\u5206\u6790\uff08\u201c\u903b\u8f91\u4e0d\u901a\u3001\u4eba\u7269\u4e0d\u4e30\u6ee1\u201d\uff09\uff0c\u4f46\u9762\u5bf9\u7ecf\u6d4e\u538b\u529b\u548c\u7f51\u7edc\u8d1f\u9762\u8bc4\u4ef7\u65f6\uff0c\u8868\u73b0\u51fa\u660e\u663e\u7684\u7126\u8651\u548c\u72b9\u8c6b\uff0c\u9700\u8981\u9500\u552e\u63d0\u4f9b\u534f\u8bae\u4fdd\u969c\u548c\u6210\u529f\u6848\u4f8b\u6765\u5efa\u7acb\u4fe1\u5fc3\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4f46\u662f\u6211\u770b\u7f51\u4e0a\u8bf4\u559c\u64ad\u6709\u4e0d\u5c11\u8d1f\u9762\u7684\u8bc4\u8bba\uff0c\u6211\u662f\u633a\u62c5\u5fc3\u7684\u3002\u5c31\u6015\u5230\u65f6\u5237\u4fe1\u7528\u5361\u7684\u94b1\u90fd\u5f97\u8fd8\u597d\u4e45[\u6342\u8138]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42\uff08\u7126\u8651\u4fdd\u969c\uff09**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u7ecf\u6d4e\u4e0a\u7684\u6781\u5ea6\u4e0d\u5b89\u5168\u611f**\u3002\u73b0\u6709\u5de5\u4f5c\uff08\u4fe1\u8bbf\u4e34\u65f6\u5de5\uff09\u6536\u5165\u5fae\u8584\u3001\u4e0a\u5347\u7a7a\u95f4\u6709\u9650\uff0c\u5904\u4e8e\u201c\u4e0d\u6562\u8f9e\u804c\u201d\u53c8\u201c\u8e49\u8dce\u5c81\u6708\u201d\u7684\u56f0\u5883\u4e2d\uff0c\u6025\u9700\u4e00\u4e2a\u786e\u5b9a\u6027\u5f3a\u3001\u80fd\u5e26\u6765\u7a33\u5b9a\u989d\u5916\u6536\u5165\u7684\u8def\u5f84\u6765\u4fdd\u969c\u57fa\u672c\u751f\u6d3b\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u7684\u5e0c\u671b\u4e0e\u53ef\u843d\u5730\u7684\u5b89\u5168\u611f**\u3002\u4e0d\u662f\u753b\u5927\u997c\uff0c\u800c\u662f\u7528\u6e05\u6670\u7684\u534f\u8bae\uff08\u9000\u8d39\u89c4\u5219\uff09\u3001\u5177\u4f53\u7684\u8d44\u6e90\uff08\u5185\u63a8\u7801\u3001\u6295\u7a3f\u901a\u9053\uff09\u548c\u770b\u5f97\u89c1\u7684\u8def\u5f84\uff08\u4ece\u77ed\u7bc7\u5230MCN\uff09\u6765\u6784\u5efa\u4e00\u4e2a\u201c\u8e2e\u811a\u80fd\u591f\u5230\u201d\u7684\u4e0a\u5347\u9636\u68af\uff0c\u7f13\u89e3\u5176\u751f\u5b58\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u8bba** (\u9ad8\u53d8\u73b0\u9a71\u52a8\uff0c\u4f4e\u8d44\u6e90\u5e95\u5ea7) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 **\u5b89\u5168\u672a\u89e6\u53d1** (\u4f46\u5df2\u89e6\u53caC2\u7c7b\u98ce\u9669\u7ea2\u7ebf)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u7528\u6237\u660e\u786e\u8868\u8fbe\u7ecf\u6d4e\u538b\u529b\uff08\u5237\u4fe1\u7528\u5361\u4ed8\u8d39\uff09\uff0c\u4f46\u5c1a\u672a\u51fa\u73b0\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\u6216\u786e\u8ba4\u4f7f\u7528\u7f51\u8d37\u3002\u9700\u542f\u52a8**\u9006\u5411\u9884\u671f\u7ba1\u7406**\u4e25\u9632\u5176\u9000\u8d39\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| **\u5bb6\u5ead\u5e72\u9884\u578b** | \u4f4e | \u5355\u8eab\u72ec\u7acb\uff0c\u51b3\u7b56\u81ea\u4e3b\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | \u4e2d | \u5de5\u4f5c\u4e34\u65f6\u4f1a\u8bae\u53ef\u80fd\u5bfc\u81f4\u9519\u8fc7\u76f4\u64ad\uff0c\u82e5\u8bfe\u7a0b\u56de\u653e\u4f53\u9a8c\u4e0d\u4f73\u6216\u4f5c\u4e1a\u79ef\u538b\uff0c\u53ef\u80fd\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u632b\u8d25\u611f\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | \u4f4e | \u5fc3\u7406\u5f39\u6027\u5c1a\u53ef\uff0c\u80fd\u7406\u6027\u5206\u6790\u95ee\u9898\uff0c\u975e\u60c5\u7eea\u5316\u5d29\u6e83\u578b\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u4ed6\u5bf9\u201c\u8fc7\u7a3f\u738790%\u201d\u3001\u201c\u5185\u63a8\u7801\u201d\u62b1\u6709\u9ad8\u671f\u5f85\u3002\u82e5\u5b66\u4e60\u540e\u6295\u7a3f\u5c61\u6b21\u88ab\u62d2\uff0c\u6216\u63a5\u5355\u7ade\u4e89\u6fc0\u70c8\u3001\u6536\u76ca\u8fdc\u4f4e\u4e8e\u9884\u671f\uff08\u5bf9\u6bd4\u201c\u534a\u4e2a\u670840\u5757\u201d\u7684\u73b0\u72b6\uff09\uff0c\u5176\u201c\u5237\u4fe1\u7528\u5361\u201d\u7684\u7ecf\u6d4e\u538b\u529b\u4f1a\u8fc5\u901f\u8f6c\u5316\u4e3a\u9000\u8d39\u8bc9\u6c42\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c4-8\u5468**\u3002\u6b64\u65f6\u57fa\u7840\u8bfe\u7a0b\u7ed3\u675f\uff0c\u8fdb\u5165\u5b9e\u6218\u6295\u7a3f/\u63a5\u5355\u9636\u6bb5\uff0c\u82e5\u8fde\u7eed\u53d7\u632b\uff0c\u5176\u201c\u6295\u8d44\u56de\u62a5\u201d\u7126\u8651\u5c06\u8fbe\u5230\u9876\u5cf0\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cSmall fry\uff0c\u770b\u5230\u4f60\u5df2\u7ecf\u5199\u4e8610\u4e07\u5b57\uff0c\u8fd9\u4efd\u575a\u6301\u592a\u5389\u5bb3\u4e86\uff01\u54b1\u4eec\u8bfe\u7a0b\u5c31\u662f\u5e2e\u4f60\u628a\u8fd9\u4efd\u575a\u6301\u2018\u53d8\u73b0\u2019\u3002\u6211\u77e5\u9053\u4f60\u65f6\u95f4\u7d27\u3001\u538b\u529b\u5927\uff0c\u54b1\u4eec\u4e0d\u641e\u865a\u7684\uff0c\u6bcf\u4e00\u6b65\u90fd\u7784\u51c6\u2018\u8fc7\u7a3f\u2019\u548c\u2018\u63a5\u5355\u2019\u3002\u4f60\u6709\u4efb\u4f55\u5361\u70b9\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4eec\u4e00\u8d77\u62c6\u89e3\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u63a5\u5355\u7ebf\u3011**\u3002\u5fc5\u987b\u7d27\u6263\u201c\u641e\u94b1\u201d\u6838\u5fc3\uff0c\u6240\u6709\u6559\u5b66\u548c\u8f85\u5bfc\u90fd\u6307\u5411\u6295\u7a3f\u548c\u5546\u5355\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u7ecf\u6d4e\u538b\u529b\u548c\u65f6\u95f4\u788e\u7247\u5316\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u7cbe\u786e\u6d3e\u5355\u4e0e\u8fdb\u5ea6\u8ffd\u8e2a\u5305\u3011**\u3002\u73ed\u4e3b\u4efb\u9700\u4e3b\u52a8\u4e3a\u5176\u7b5b\u9009\u5339\u914d\u5ea6\u9ad8\u7684\u5165\u95e8\u7ea7\u5546\u5355\uff0c\u5e76\u5efa\u7acb\u6e05\u6670\u7684\u201c\u63a5\u5355-\u53cd\u9988-\u4fee\u6539\u201d\u5c0f\u5faa\u73af\uff0c\u7528\u5fae\u5c0f\u7684\u6b63\u53cd\u9988\uff08\u54ea\u6015\u7b2c\u4e00\u5355\u53ea\u8d5a\u51e0\u767e\u5143\uff09\u7a33\u4f4f\u5176\u4fe1\u5fc3\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u753b\u4e0d\u5207\u5b9e\u9645\u7684\u5927\u997c**\uff08\u5982\u201c\u5b66\u5b8c\u6708\u5165\u8fc7\u4e07\u201d\uff09\u30022. \u7528\u201c\u4f5b\u7cfb\u201d\u3001\u201c\u4eab\u53d7\u8fc7\u7a0b\u201d\u7b49\u8bdd\u672f\u6de1\u5316\u5176\u53d8\u73b0\u8bc9\u6c42\u30023. \u5728\u5176\u9047\u5230\u6295\u7a3f\u632b\u6298\u65f6\uff0c\u53ea\u7ed9\u9e21\u6c64\u4e0d\u7ed9\u5177\u4f53\u89e3\u51b3\u65b9\u6848\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u57fa\u7840\u8bfe\u672a\u6d88\u5316\u3001\u672a\u4ea7\u751f\u7b2c\u4e00\u7b14\u6536\u76ca\u524d\uff0c\u8fdb\u884c\u4efb\u4f55\u9ad8\u9636\u8bfe\u7a0b\uff08\u5982\u957f\u6587\u8bfe\uff09\u7684\u5347\u5355\u63a8\u9500**\u3002\u5fc5\u987b\u4e25\u683c\u6267\u884c **\u3010\u6218\u7565\u6027\u62d2\u5356\u7194\u65ad\u3011**\uff0c\u5f85\u5176\u901a\u8fc7\u77ed\u7bc7\u83b7\u5f97\u7a33\u5b9a\u611f\u548c\u521d\u6b65\u6536\u76ca\u540e\uff0c\u518d\u81ea\u7136\u5f15\u5bfc\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u8fd9\u70b9\u5de5\u8d44\uff0c\u4ea4\u5b8c\u6c34\u7535\u4e94\u9669\u4e00\u91d1\u8fd8\u6709\u623f\u79df\uff0c\u5c31\u5269\u4e0b\u5403\u996d\u94b1\u4e86\u201d\n2. > \u201c\u6ca1\u529e\u6cd5\uff0c\u5f97\u60f3\u529e\u6cd5\u517b\u6d3b\u81ea\u5df1\u201d\n3. > \u201c\u4f46\u662f\u6211\u770b\u7f51\u4e0a\u8bf4\u559c\u64ad\u6709\u4e0d\u5c11\u8d1f\u9762\u7684\u8bc4\u8bba\uff0c\u6211\u662f\u633a\u62c5\u5fc3\u7684\u3002\u5c31\u6015\u5230\u65f6\u5237\u4fe1\u7528\u5361\u7684\u94b1\u90fd\u5f97\u8fd8\u597d\u4e45[\u6342\u8138]\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4 \u641e\u94b1\u7ed3\u679c\u8bba\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7ecf\u6d4e\u5b89\u5168\u4e0e\u4fdd\u969c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7528\u201c\u9006\u5411\u9884\u671f\u7ba1\u7406\u201d+\u201c\u7cbe\u786e\u6d3e\u5355\u201d\u5efa\u7acb\u5fae\u5c0f\u6b63\u53cd\u9988\u5faa\u73af\uff0c\u4e25\u9632\u6536\u76ca\u843d\u5dee\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u8bba\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u63a5\u5355\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
