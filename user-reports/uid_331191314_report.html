        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 331191314 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-02-10 \u81f3 2026-03-01 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u767d\u767d (\u8d75\u660e\u660e)\u3001\u5341\u4e03 (\u90d1\u6676\u6676) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u5199\u4f5c\u8bfe\u7a0b (\u63a8\u6d4b\u4e3a\u9ad8\u9636\u73ed) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\uff0c\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u5206\u671f\u6216\u501f\u6b3e\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u591a\u6b21\u63d0\u53ca\u201c\u521a\u4e0b\u73ed\u201d\u3001\u201c\u8fd8\u6ca1\u4e0b\u73ed\u201d\u3001\u201c\u8fc7\u5e74\u4e00\u76f4\u5728\u4e0a\u73ed\u201d\uff0c\u8868\u660e\u6709\u5168\u804c\u5de5\u4f5c\uff0c\u5b66\u4e60\u65f6\u95f4\u9700\u4ece\u5de5\u4f5c\u95f4\u9699\u548c\u4e0b\u73ed\u540e\u6324\u51fa\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u4e2d\u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\uff0c\u4f46\u63d0\u5230\u201c\u8ddf\u7236\u6bcd\u6709\u65f6\u5019\u4e00\u8d77\u4f4f\u201d\uff0c\u5bb6\u5ead\u5173\u7cfb\u5b58\u5728\u4f46\u652f\u6301\u5ea6\u672a\u77e5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u804a\u5929\u8bb0\u5f55\u4e30\u5bcc\uff0c\u80fd\u5145\u5206\u53cd\u6620\u7528\u6237\u7684\u5b66\u4e60\u72b6\u6001\u3001\u5174\u8da3\u3001\u6027\u683c\u53ca\u8d44\u6e90\u60c5\u51b5\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06**\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u6df1\u5ea6\u6c89\u6d78\u5728\u521b\u4f5c\u3001AI\u6280\u672f\u63a2\u7d22\u4e0e\u6545\u4e8b\u6784\u601d\u4e2d\uff0c\u4eab\u53d7\u8fc7\u7a0b\uff0c\u5bf9\u53d8\u73b0\u65e0\u6025\u5207\u8981\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c@\u4f55\u4ee5\u534e\u5e74\u5e86+\u5e38\u5dde+\u7537\u2005\u52a0\u6cb9\uff0c\u597d\u591a\u5751\u5c31\u662f\u4e0d\u65ad\u5b66\u4e60\u624d\u80fd\u8d8a\u6316\u8d8a\u6df1\u7684\ud83d\ude02\u201d > \u201c@\u53e4\u53e4+\u9999\u6e2f+\u7537\u2005\u52a0\u6cb9\u52a0\u6cb9\uff0c\u6211\u4e5f\u662f\u5929\u5929\u548c\u7d20\u6750\u8f83\u52b2\uff0c\u603b\u89c9\u5f97\u6709ai\u540e\u6fc0\u53d1\u4e86\u4e86\u6211\u521b\u4f5c\u7684\u4e50\u8da3\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1**\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u8ba8\u8bbaAI\u786c\u4ef6\uff08\u5982RTX 5090\u663e\u5361\uff09\u65f6\u8868\u793a\u201c\u914d\u4e2a\u7535\u8111\u6bd4\u6211\u4e00\u5e74\u5de5\u8d44\u90fd\u591a\u201d\uff0c\u5e76\u63d0\u53ca\u66fe\u88ab\u4f4e\u4ef7\u8bfe\u7a0b\u9a97\u8fc7200\u5143\uff0c\u8868\u660e\u6709\u6d88\u8d39\u610f\u613f\u4f46\u9884\u7b97\u6709\u9650\uff0c\u975e\u6325\u970d\u578b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u5982\u4e0a\u6240\u8ff0\uff0c\u6709\u5168\u804c\u5de5\u4f5c\uff0c\u5b66\u4e60\u65f6\u95f4\u788e\u7247\u5316\uff0c\u4f46\u80fd\u575a\u6301\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u8ba8\u8bba\uff0c\u5e76\u4e3b\u52a8\u201c\u62bd\u7a7a\u8865\u8bfe\u201d\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4e2d** \u2014 \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u5bb6\u5ead\u963b\u529b\u3002\u4e0e\u7236\u6bcd\u540c\u4f4f\uff0c\u6709\u72ec\u7acb\u4e66\u623f\uff08\u201c\u623f\u5b50\u6210\u4e86\u6211\u7684\u4e66\u5c4b\u201d\uff09\uff0c\u6697\u793a\u6709\u57fa\u672c\u652f\u6301\u7a7a\u95f4\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06**\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9762\u5bf9AI\u5de5\u5177\u5361\u987f\u3001\u672c\u5730\u90e8\u7f72\u5931\u8d25\u7b49\u56f0\u96be\uff0c\u80fd\u5e7d\u9ed8\u5316\u89e3\uff08\u201c\u6211\u653e\u5f03\u4e86\u201d\u3001\u201c\u51d1\u4e4e\u7528\u5427\u201d\uff09\uff0c\u5e76\u79ef\u6781\u5bfb\u627e\u66ff\u4ee3\u65b9\u6848\uff08\u7528\u7f51\u9875\u7248\u3001APP\uff09\u3002\u4e3b\u52a8\u5728\u793e\u7fa4\u5e2e\u52a9\u4ed6\u4eba\u89e3\u51b3\u95ee\u9898\uff0c\u5fc3\u6001\u79ef\u6781\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4e0a\u5348\u6211\u8bf4\u8fc7\uff0c\u672c\u5730\u914d\u7f6edeep\u7ed3\u679c\u5361\u6b7b\u4e86\u201d > \u201c\u73b0\u5728\u4e00\u822c\u5c31\u662f\u7528\u7f51\u9875\u201d > \u201c\u53bb\u4efb\u52a1\u7ba1\u7406\u5668\u770b\u4e00\u4e0b\u98de\u4e66\u7a0b\u5e8f\u7684\u670d\u52a1\u9879\uff0c\u542f\u52a8\u4e86\u6ca1\u6709\uff1f\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u624d\u534e\u88ab\u770b\u89c1\u3001\u88ab\u8ba4\u53ef\u7684\u6e34\u671b**\u3002\u4ed6\u70ed\u7231\u521b\u4f5c\u3001\u94bb\u7814AI\u6280\u672f\uff0c\u6709\u4e30\u5bcc\u7684\u77e5\u8bc6\u50a8\u5907\uff08\u4ece\u77ed\u5267\u3001\u97f3\u4e50\u5230\u7384\u5b66\uff09\uff0c\u4f46\u5728\u73b0\u5b9e\u4e2d\u53ef\u80fd\u53ea\u662f\u4e00\u4e2a\u666e\u901a\u4e0a\u73ed\u65cf\uff08\u201c\u8fd9\u5e74\u5934\uff0c\u9664\u975e\u81ea\u5df1\u5e72\uff0c\u8981\u4e0d\u53ea\u80fd\u5f53\u725b\u9a6c\u201d\uff09\u3002\u5b66\u4e60\u5199\u4f5c\u548cAI\uff0c\u662f\u4ed6\u6784\u5efa\u4e00\u4e2a\u80fd\u83b7\u5f97\u5c0a\u91cd\u548c\u5b9e\u73b0\u81ea\u6211\u4ef7\u503c\u7684\u201c\u7b2c\u4e8c\u8eab\u4efd\u201d\u7684\u9014\u5f84\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u63d0\u4f9b\u4e00\u4e2a\u80fd\u5c55\u793a\u5176\u624d\u534e\u3001\u83b7\u5f97\u540c\u597d\u8ba4\u53ef\u548c\u4e13\u5bb6\u80af\u5b9a\u7684\u201c\u821e\u53f0\u201d\u4e0e\u201c\u5708\u5b50\u201d**\u3002\u4ed6\u9700\u8981\u88ab\u770b\u89c1\u3001\u88ab\u6b23\u8d4f\uff0c\u800c\u4e0d\u4ec5\u4ec5\u662f\u6280\u80fd\u6559\u5b66\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 **B\u7c7b** (\u9ad8\u6f5c\u529b\u3001\u9ad8\u53c2\u4e0e\u3001\u9700\u5f15\u5bfc) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T3 \u6b7b\u78d5\u5b66\u9738\u578b** (\u517c\u5177 **T1 \u5708\u517b\u9886\u8896** \u6f5c\u8d28) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5ead\u5927\u5435\u7b49\u8ff9\u8c61\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u672a\u63d0\u53ca\u5bb6\u5ead\u77db\u76fe\uff0c\u98ce\u9669\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u5de5\u4f5c\u7e41\u5fd9\u5bfc\u81f4\u8bfe\u7a0b\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u7126\u8651\u548c\u81ea\u8d23\u3002\u8bc1\u636e\uff1a\u201c\u521a\u4e0b\u73ed\u201d\u3001\u201c\u8fd8\u6ca1\u4e0b\u73ed\u201d\u3001\u201c\u62bd\u7a7a\u8865\u8bfe\u201d\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u81ea\u6211\u8c03\u8282\uff0c\u6280\u672f\u95ee\u9898\u81ea\u884c\u89e3\u51b3\u6216\u5e7d\u9ed8\u5316\u89e3\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u52a8\u673a\u7eaf\u5ea6\u9ad8\uff0c\u975e\u6025\u529f\u8fd1\u5229\u578b\uff0c\u5bf9\u77ed\u671f\u53d8\u73b0\u65e0\u5f3a\u70c8\u671f\u5f85\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-3\u5468\u540e**\u3002\u5f53\u8bfe\u7a0b\u5185\u5bb9\u52a0\u6df1\u3001\u4f5c\u4e1a\u91cf\u589e\u52a0\uff0c\u800c\u5176\u5de5\u4f5c\u7e41\u5fd9\u5bfc\u81f4\u65e0\u6cd5\u6309\u65f6\u5b8c\u6210\u65f6\uff0c\u53ef\u80fd\u56e0\u201c\u5b8c\u7f8e\u4e3b\u4e49\u201d\u548c\u201c\u843d\u540e\u7126\u8651\u201d\u800c\u4ea7\u751f\u6301\u7eed\u538b\u529b\uff0c\u82e5\u5f97\u4e0d\u5230\u758f\u5bfc\uff0c\u53ef\u80fd\u9ed8\u9ed8\u653e\u5f03\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5e08\u5144/\u5e08\u59d0\uff0c\u770b\u4f60\u804a\u5929\u5c31\u77e5\u9053\u4f60\u662f\u771f\u61c2\u884c\u3001\u7231\u94bb\u7814\u7684\u2018\u6280\u672f\u6d3e\u521b\u4f5c\u4eba\u2019\u3002\u54b1\u4eec\u8fd9\u8bfe\u4e0d\u6015\u4f60\u95ee\u5f97\u6df1\uff0c\u5c31\u6015\u4f60\u5fd9\u5f97\u6ca1\u65f6\u95f4\u95ee\u3002\u4ee5\u540e\u65f6\u95f4\u7d27\u7684\u65f6\u5019\u76f4\u63a5\u627e\u6211\uff0c\u6211\u7ed9\u4f60\u5212\u91cd\u70b9\uff0c\u4fdd\u8bc1\u4f60\u4e0d\u6389\u961f\uff0c\u8fd8\u80fd\u8ba9\u4f60\u8fd9\u8eab\u672c\u4e8b\u5728\u7fa4\u91cc\u2018\u79c0\u2019\u51fa\u6765\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011+\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf**\u3011\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T3\u5b66\u9738\u7279\u8d28\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010**\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743**\u3011\uff08\u6a21\u5757B\uff09\uff0c\u5141\u8bb8\u4ed6\u63d0\u51fa\u66f4\u6df1\u5ea6\u7684\u6280\u672f/\u539f\u7406\u95ee\u9898\u3002\u540c\u65f6\uff0c\u56e0\u5176\u6709T1\u9886\u8896\u6f5c\u8d28\uff08\u4e50\u4e8e\u52a9\u4eba\u3001\u5206\u4eab\u89c1\u89e3\uff09\uff0c\u53ef\u9002\u65f6\u8d4b\u4e88\u3010**\u73ed\u59d4\u6216\u5c0f\u7ec4\u957f**\u3011\u8eab\u4efd\uff08\u6a21\u5757D\uff09\uff0c\u6ee1\u8db3\u5176\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\u9700\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u628a\u4ed6\u5f53\u6210\u5c0f\u767d\u6216\u201c\u60c5\u7eea\u5de8\u5a74\u201d\u6765\u8fc7\u5ea6\u5b89\u629a\u3002\u4e0d\u8981\u7ed9\u4ed6\u8fc7\u4e8e\u7b80\u5355\u3001\u91cd\u590d\u6027\u7684\u4efb\u52a1\uff0c\u8fd9\u4f1a\u8ba9\u4ed6\u89c9\u5f97\u88ab\u8f7b\u89c6\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u8fdb\u884c**\u5927\u989d\u63a8\u4ecb**\u3002\u5f53\u4ed6\u5c55\u73b0\u51fa\u5bf9\u66f4\u9ad8\u9636\u6280\u672f\uff08\u5982\u6a21\u578b\u8bad\u7ec3\u3001\u5de5\u4f5c\u6d41\u642d\u5efa\uff09\u7684\u5174\u8da3\u65f6\uff0c\u53ef\u4ee5\u63a8\u8350\u76f8\u5173\u7684\u9ad8\u9636\u8bfe\u7a0b\u6216\u670d\u52a1\uff0c\u6ee1\u8db3\u5176\u6df1\u5ea6\u63a2\u7d22\u6b32\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c@\u53e4\u53e4+\u9999\u6e2f+\u7537\u2005\u52a0\u6cb9\u52a0\u6cb9\uff0c\u6211\u4e5f\u662f\u5929\u5929\u548c\u7d20\u6750\u8f83\u52b2\uff0c\u603b\u89c9\u5f97\u6709ai\u540e\u6fc0\u53d1\u4e86\u4e86\u6211\u521b\u4f5c\u7684\u4e50\u8da3\u201d\n2. > \u201c\u914d\u4e2a\u7535\u8111\u6bd4\u6211\u4e00\u5e74\u5de5\u8d44\u90fd\u591a\uff0c\u6240\u4ee5\u5c31\u4e00\u822c\u7684\u51d1\u4e4e\u7528\u5427\u201d\n3. > \u201c\u770b\u77ed\u5267\u5c31\u662f\u5148\u628a\u8111\u5b50\u6254\u4e86\uff0c\u53cd\u6b63\u662f\u5267\u60c5\u8d8a\u65e0\u7406\uff0c\u4eba\u4eec\u770b\u7684\u8d8a\u723d\uff0c\u8fd9\u5c31\u662f\u73b0\u5728\u77ed\u5267\u7684\u8fd9\u4e2a\u8d70\u5411\u3002\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T3\u6b7b\u78d5\u5b66\u9738\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5708\u5c42\u8ba4\u53ef\u4e0e\u81ea\u6211\u5b9e\u73b0\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u8d4b\u4e88\u5176\u201c\u4e13\u5bb6\u201d\u8eab\u4efd\u611f\uff0c\u5e76\u63d0\u4f9b\u5f39\u6027\u5b66\u4e60\u652f\u6301\uff0c\u907f\u514d\u5176\u56e0\u5de5\u4f5c\u5fd9\u800c\u79ef\u7d2f\u632b\u8d25\u611f\u3011**\u3002\n\n```json\n{\"core_type\": \"T3 \u6b7b\u78d5\u5b66\u9738\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\"}\n```";
