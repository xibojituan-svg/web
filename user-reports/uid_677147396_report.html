    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677147396\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677147396 (\u6635\u79f0\uff1a\u5a60\u5a60) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-05 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e-\u5e78\u5b89(\u5531\u9e3f\u535a) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e3b\u64ad\u9ad8\u9636\u73ed (\u5df2\u652f\u4ed8) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u65e0\u6cd5\u5224\u65ad\u8d44\u91d1\u538b\u529b\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u5168\u804c\u5b9d\u5988\uff0c\u4e24\u4e2a\u5b69\u5b50\uff08\u5e7c\u513f\u56ed+\u5c0f\u5b66\uff09\uff0c\u9700\u5728\u5b69\u5b50\u4e0a\u5b66\u540e\u53ca\u4f11\u606f\u65f6\u95f4\u5b66\u4e60\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\uff0c\u4f46\u4f5c\u4e3a\u5168\u804c\u5b9d\u5988\uff0c\u5bb6\u5ead\u652f\u6301\u5ea6\u5b58\u7591\uff0c\u9700\u540e\u7eed\u6478\u5e95\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u6709\u57fa\u7840\u753b\u50cf\u4e0e\u5b66\u4e60\u884c\u4e3a\uff0c\u4f46\u7f3a\u4e4f\u6df1\u5ea6\u5fc3\u7406\u4e0e\u5bb6\u5ead\u80cc\u666f\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (\u8bc4\u5206\uff1a5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e\uff0c\u6709\u5b66\u4e60\u610f\u613f\u4f46\u975e\u6781\u901f\u53d8\u73b0\u9a71\u52a8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u60f3\u505a\u5168\u804c\u7684\u201d\u3001\u201c\u517c\u804c\u201d\u3001\u201c\u60f3\u7ee7\u7eed\u5728\u8fd9\u4e2a\u884c\u4e1a\u52aa\u529b\u201d\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u5168\u804c/\u517c\u804c\u76ee\u7684\uff0c\u4f46\u672a\u51fa\u73b0\u201c\u51e0\u5929\u80fd\u8d5a\u94b1\u201d\u7b49\u6781\u7aef\u53d8\u73b0\u50ac\u4fc3\uff0c\u5c5e\u4e8e\u4e2d\u7b49\u7eaf\u5ea6\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e (\u8bc4\u5206\uff1a3-4\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u5df2\u652f\u4ed8\u9ad8\u9636\u73ed\u8d39\u7528\uff0c\u4f46\u652f\u4ed8\u65b9\u5f0f\u672a\u77e5\uff0c\u65e0\u6cd5\u5224\u65ad\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e** \u2014 \u5168\u804c\u5b9d\u5988\uff0c\u4e24\u4e2a\u5b69\u5b50\uff08\u5e7c\u513f\u56ed+\u5c0f\u5b66\uff09\uff0c\u5b66\u4e60\u65f6\u95f4\u9ad8\u5ea6\u4f9d\u8d56\u5b69\u5b50\u4f5c\u606f\uff0c\u5c5e\u4e8e\u5178\u578b\u7684**\u788e\u7247\u5316\u62fc\u51d1**\uff0c\u662f\u8d44\u6e90\u5e95\u5ea7\u7684\u6700\u5927\u77ed\u677f\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\uff0c\u4f46\u4f5c\u4e3a\u5168\u804c\u5b9d\u5988\uff0c\u5bb6\u5ead\u652f\u6301\u662f\u6f5c\u5728\u98ce\u9669\u70b9\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u27a1\u4e2d (\u8bc4\u5206\uff1a5-6\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a**\u3002\u80fd\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\uff0c\u5bf9\u9500\u552e\u5f15\u5bfc\u6709\u79ef\u6781\u56de\u5e94\uff08\u201c\u6211\u4f1a\u52aa\u529b\u7684\u201d\u3001\u201c\u52a0\u6cb9\u201d\uff09\uff0c\u672a\u8868\u73b0\u51fa\u5d29\u6e83\u6216\u6781\u5ea6\u81ea\u5351\u3002\u4f46\u5b66\u4e60\u8fc7\u7a0b\u88ab\u5b69\u5b50\u6253\u65ad\uff08\u201c\u5b69\u5b50\u653e\u5047\u6bd4\u8f83\u95f9\u817e\u201d\uff09\u662f\u6f5c\u5728\u538b\u529b\u6e90\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u4f1a\u52aa\u529b\u7684\u201d\u3001\u201c\u52a0\u6cb9[\u62f3\u5934]\u201d\u3001\u201c\u51c6\u65f6\u5230\u8bfe\u201d\u3002\u8868\u73b0\u51fa\u914d\u5408\u4e0e\u575a\u6301\u7684\u6001\u5ea6\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c / \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u4f5c\u4e3a\u5168\u804c\u5b9d\u5988\uff0c\u8131\u79bb\u804c\u573a\uff0c\u5b58\u5728\u7ecf\u6d4e\u4e0d\u72ec\u7acb\u4e0e\u793e\u4f1a\u8131\u8282\u7684**\u53cc\u91cd\u7126\u8651**\u3002\u5979\u5bfb\u6c42\u7684\u4e0d\u4ec5\u662f\u4e00\u4efd\u6536\u5165\uff0c\u66f4\u662f\u4e00\u79cd**\u81ea\u6211\u4ef7\u503c\u8bc1\u660e**\u548c**\u4e0e\u793e\u4f1a\u91cd\u65b0\u8fde\u63a5\u7684\u9014\u5f84**\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u201d\u7684\u5c0a\u91cd\u611f**\u548c**\u201c\u4f60\u80fd\u884c\u201d\u7684\u80af\u5b9a**\u3002\u8ba9\u5979\u5728\u5e26\u5a03\u7684\u7410\u788e\u4e2d\uff0c\u627e\u5230\u4e00\u4e2a\u80fd\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u548c\u6b63\u5411\u53cd\u9988\u7684\u201c\u5c0f\u4e16\u754c\u201d\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b (\u98ce\u9669\u7ba1\u63a7\u578b)** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u8bba (\u5939\u5fc3\u7537\u793e\u755c\u51cf\u538b\u6392\u6c14\u9600\u53d8\u79cd)** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u7b49\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u82e5\u4e3a\u7792\u7740\u5bb6\u4eba\u62a5\u540d\uff0c\u540e\u7eed\u5b66\u4e60\u65f6\u95f4\u4e0e\u5bb6\u5ead\u8d23\u4efb\u51b2\u7a81\uff0c\u53ef\u80fd\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u4e24\u4e2a\u5b69\u5b50\u5e26\u6765\u7684\u65f6\u95f4\u4e0d\u786e\u5b9a\u6027\u6781\u9ad8\u3002\u4e00\u65e6\u5b69\u5b50\u751f\u75c5/\u653e\u5047\uff0c\u5b66\u4e60\u8ba1\u5212\u6781\u6613\u88ab\u6253\u65ad\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u632b\u8d25\u611f\u548c\u81ea\u8d23\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u76ee\u524d\u8868\u73b0\u914d\u5408\uff0c\u672a\u663e\u8106\u5f31\u3002\u4f46\u82e5\u5728\u6280\u672f\u64cd\u4f5c\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u3001\u97f3\u9891\u526a\u8f91\uff09\u4e0a\u53cd\u590d\u53d7\u632b\uff0c\u53ef\u80fd\u56e0\u201c\u5b66\u4e0d\u4f1a\u201d\u800c\u653e\u5f03\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u5bf9\u201c\u5168\u804c\u201d\u6709\u671f\u5f85\uff0c\u82e5\u5b66\u4e602-3\u4e2a\u6708\u540e\u63a5\u5355\u56f0\u96be\u6216\u6536\u76ca\u4e0d\u53ca\u9884\u671f\uff0c\u6613\u4ea7\u751f\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\u3002\u6b64\u65f6\u5b66\u4e60\u96be\u5ea6\u589e\u52a0\uff0c\u4f5c\u4e1a\u91cf\u53ef\u80fd\u52a0\u5927\uff0c\u4e0e\u80b2\u513f\u65f6\u95f4\u51b2\u7a81\u8fbe\u5230\u9876\u5cf0\uff0c\u662f\u653e\u5f03\u7684\u9ad8\u53d1\u671f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u5979\u8bf4......\u201d**\n> \u201c\u5a60\u5a60\u5988\u5988\u4f60\u597d\uff01\u7279\u522b\u7406\u89e3\u4f60\u4e00\u8fb9\u5e26\u5a03\u4e00\u8fb9\u60f3\u63d0\u5347\u81ea\u5df1\u7684\u4e0d\u5bb9\u6613\u3002\u54b1\u4eec\u73ed\u91cc\u6709\u597d\u51e0\u4f4d\u5b9d\u5988\uff0c\u5927\u5bb6\u65f6\u95f4\u90fd\u633a\u788e\u7684\u3002\u522b\u62c5\u5fc3\uff0c\u8bfe\u7a0b\u53ef\u4ee5\u968f\u65f6\u56de\u770b\uff0c\u4f5c\u4e1a\u54b1\u4eec\u4e5f\u4e0d\u5361\u6b7b\u7ebf\uff0c\u4eca\u5929\u5fd9\u4e0d\u5b8c\u660e\u5929\u4ea4\uff0c\u4e00\u5207\u4ee5\u4f60\u65b9\u4fbf\u4e3a\u4e3b\u3002\u54b1\u4eec\u5148\u4e00\u8d77\u628a\u57fa\u7840\u6253\u7262\uff0c\u6162\u6162\u6765\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** (\u517c\u987e\u53d8\u73b0\u9700\u6c42) + **\u3010\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\u3011** (\u63d0\u4f9b\u5f52\u5c5e\u611f)\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176**\u65f6\u95f4\u788e\u7247\u5316**\u548c**\u6f5c\u5728\u60c5\u7eea\u538b\u529b**\uff0c\u5fc5\u987b\u8865\u5145 **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011** \u548c **\u3010\u65f6\u95f4\u5f39\u6027\u673a\u5236\u3011**\u3002**\u4e25\u7981\u9b54\u9b3c\u7763\u5b66**\uff0c\u5c06\u73ed\u7ea7\u7fa4\u8f6c\u5316\u4e3a\u5979\u7684\u201c\u60c5\u7eea\u907f\u98ce\u6e2f\u201d\u548c\u201c\u5b9d\u5988\u4e92\u52a9\u793e\u533a\u201d\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u9519\u8fc7\u76f4\u64ad\u53d6\u6d88\u8d44\u683c\u201d\u3001\u201c\u4f5c\u4e1a\u903e\u671f\u4e0d\u5019\u201d\u7b49\u521a\u6027\u7eaa\u5f8b\u65bd\u538b\u3002\u7981\u6b62\u5728\u5979\u63d0\u53ca\u5b69\u5b50\u4e8b\u52a1\u65f6\uff0c\u4ecd\u4e00\u5473\u5f3a\u8c03\u5b66\u4e60\u4efb\u52a1\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u524d\u671f**\u4e25\u7981\u4efb\u4f55\u5347\u5355**\u3002\u5f85\u5176\u7a33\u5b9a\u5b8c\u6210\u57fa\u7840\u8bfe\u7a0b\u3001\u5e76\u4ea7\u751f\u7b2c\u4e00\u7b14\u5c0f\u989d\u6536\u5165\uff08\u54ea\u6015\u662f\u8c61\u5f81\u6027\u7684\uff09\u540e\uff0c\u53ef\u5c1d\u8bd5\u63a8\u8350**\u4f4e\u5ba2\u5355\u4ef7\u3001\u9ad8\u60c5\u7eea\u4ef7\u503c**\u7684\u5468\u8fb9\u4ea7\u54c1\uff08\u5982\u58f0\u97f3\u5b9a\u5236\u76f2\u76d2\uff09\u3002**\u7edd\u5bf9\u7981\u6b62**\u5728\u672a\u4ea7\u751f\u6b63\u53cd\u9988\u524d\u63a8\u9500\u9ad8\u4ef7\u8bbe\u5907\u6216\u9ad8\u9636\u8bfe\u7a0b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u662f\u5168\u804c\u5b9d\u5988\u201d\u3001\u201c\u4e24\u4e2a\u5b69\u5b50\u4e00\u4e2a\u5e7c\u513f\u56ed\uff0c\u4e00\u4e2a\u5c0f\u5b66\u201d\u3001\u201c\u5c31\u662f\u5b69\u5b50\u653e\u5047\u6bd4\u8f83\u95f9\u817e\u201d \u2014\u2014 **\u8d44\u6e90\u5e95\u5ea7\u77ed\u677f\uff08\u65f6\u95f4\uff09\u7684\u6838\u5fc3\u8bc1\u636e**\u3002\n2. > \u201c\u60f3\u505a\u5168\u804c\u7684\u201d\u3001\u201c\u517c\u804c\u201d\u3001\u201c\u60f3\u7ee7\u7eed\u5728\u8fd9\u4e2a\u884c\u4e1a\u52aa\u529b\u201d \u2014\u2014 **\u4e2d\u7b49\u52a8\u673a\u7eaf\u5ea6\uff08\u517c\u804c\u53d8\u73b0\uff09\u7684\u8bc1\u636e**\u3002\n3. > \u201c\u6211\u4f1a\u52aa\u529b\u7684\u201d\u3001\u201c\u52a0\u6cb9[\u62f3\u5934]\u201d\u3001\u201c\u51c6\u65f6\u5230\u8bfe\u201d \u2014\u2014 **\u5fc3\u7406\u5f39\u6027\u4e2d\u7b49\uff0c\u914d\u5408\u5ea6\u9ad8\u7684\u8bc1\u636e**\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4\u53d8\u79cd\uff1a\u5939\u5fc3\u5b9d\u5988\u51cf\u538b\u578b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u9700\u6c42\uff08\u7ecf\u6d4e\u4fdd\u969c\uff09\u4e0e\u793e\u4ea4\u9700\u6c42\uff08\u4ef7\u503c\u8ba4\u540c\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u81f4\u5f39\u6027\u7684\u65f6\u95f4\u673a\u5236\u4e0e\u60c5\u7eea\u4ef7\u503c\uff0c\u5c06\u73ed\u7ea7\u6253\u9020\u6210\u5979\u7684\u201c\u7ebf\u4e0a\u89e3\u538b\u9152\u9986\u201d\u548c\u201c\u5b9d\u5988\u4e92\u52a9\u793e\u533a\u201d\uff0c\u7528\u5f52\u5c5e\u611f\u5bf9\u6297\u65f6\u95f4\u538b\u529b\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u8bba\u578b (\u5939\u5fc3\u5b9d\u5988\u51cf\u538b\u53d8\u79cd)\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\u9ad8\", \"maslow_need\": \"\u5b89\u5168/\u793e\u4ea4\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5708\u5c42\u5408\u4f19\u4eba\u7ebf+\u7597\u6108\u966a\u4f34\u8f85\u52a9\u5305\", \"age\": \"35\u5c81\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}\n```";
