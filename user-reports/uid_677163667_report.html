    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677163667 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e-\u5b59\u91ce |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u6f14\u64ad\u8bfe\u7a0b (7380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u652f\u4ed8\uff0c\u65e0\u5206\u671f/\u501f\u8d37\u4fe1\u53f7 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1 (\u533b\u751f\u804c\u4e1a\uff0c\u9700\u503c\u73ed\uff0c\u6df1\u591c\u9700\u7167\u987e\u5b69\u5b50) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u672a\u63d0\u53ca |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e2d\u7b49\u504f\u9971\u6ee1 (\u6709\u804c\u4e1a\u3001\u6536\u5165\u3001\u5b66\u4e60\u884c\u4e3a\u3001\u76ee\u6807\u7b49\u4fe1\u606f) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u27a1\u4e2d\n- **\u7279\u5f81\u901f\u5199**\uff1a\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u6781\u7aef\u6025\u8feb\u6216\u4fdd\u5e95\u5e7b\u60f3\u3002\u6709\u5b66\u4e60\u610f\u613f\uff0c\u76ee\u6807\u52a1\u5b9e\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u4eec\u7684\u6536\u5165\u8fd8\u884c\uff0c\u6211\u662f\u60f3\u7740\u540e\u9762\u80fd\u5e72\u4e2a\u5927\u5343\u5c0f\u4e07\uff0c\u8d34\u8865\u4e00\u4e0b\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b06\u9ad8\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a\u2b06\u9ad8 \u2014 \u533b\u751f\u804c\u4e1a\uff0c\u81ea\u8ff0\u201c\u6536\u5165\u8fd8\u884c\u201d\uff0c\u80fd\u5168\u6b3e\u652f\u4ed87380\u5143\u8bfe\u7a0b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a\u27a1\u4e2d \u2014 \u533b\u751f\u804c\u4e1a\uff0c\u9700\u503c\u73ed\uff0c\u65f6\u95f4\u788e\u7247\u5316\uff0c\u6df1\u591c\u9700\u7167\u987e\u5b69\u5b50\uff0c\u4f46\u80fd\u6324\u51fa\u65f6\u95f4\u5b66\u4e60\u5e76\u5b8c\u6210\u4f5c\u4e1a\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a\u4fe1\u606f\u4e0d\u8db3 \u2014 \u672a\u63d0\u53ca\u5bb6\u5ead\u6001\u5ea6\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u6c9f\u901a\u7b80\u6d01\u9ad8\u6548\uff0c\u65e0\u60c5\u7eea\u5316\u8868\u8fbe\uff0c\u80fd\u4e3b\u52a8\u63d0\u95ee\u5e76\u6267\u884c\u6307\u4ee4\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u5728\u9500\u552e\u5bc6\u96c6\u63a8\u9001\u548c\u50ac\u4fc3\u8fdb\u5ea6\u65f6\uff0c\u7528\u6237\u59cb\u7ec8\u4fdd\u6301\u201c\u6536\u5230\u201d\u3001\u201c\u597d\u54d2\u201d\u3001\u201c\u55ef\u55ef\u201d\u3001\u201c\u6e05\u6670\u4e86\u201d\u7b49\u7b80\u6d01\u3001\u914d\u5408\u7684\u56de\u5e94\uff0c\u65e0\u62b1\u6028\u6216\u7126\u8651\u4fe1\u53f7\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42\uff08\u7ecf\u6d4e\u4fdd\u969c\uff09]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bfb\u6c42\u7a33\u5b9a\u7684\u526f\u4e1a\u6536\u5165\u4ee5\u201c\u8d34\u8865\u201d\u5bb6\u5ead\uff0c\u5bf9\u6297\u804c\u4e1a\u4e0d\u786e\u5b9a\u6027\u5e26\u6765\u7684\u7ecf\u6d4e\u7126\u8651\u3002\u533b\u751f\u804c\u4e1a\u867d\u4f53\u9762\uff0c\u4f46\u4ecd\u6709\u589e\u52a0\u6536\u5165\u3001\u63d0\u5347\u5b89\u5168\u611f\u7684\u8bc9\u6c42\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u63d0\u4f9b\u4e00\u6761\u6e05\u6670\u3001\u7a33\u5b9a\u3001\u53ef\u9884\u671f\u7684\u517c\u804c\u53d8\u73b0\u8def\u5f84**\uff0c\u7ed9\u4e88\u201c\u8ddf\u7740\u5e73\u53f0\u8d70\uff0c\u80fd\u7a33\u6b65\u8d5a\u5230\u94b1\u201d\u7684\u786e\u5b9a\u611f\u548c\u5b89\u5168\u611f\uff0c\u800c\u975e\u7a7a\u6d1e\u7684\u9f13\u52b1\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 B\u7c7b (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u65e0\u6781\u7aef\u8a00\u8bba\u3001\u65e0\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u533b\u751f\u804c\u4e1a\u901a\u5e38\u5bb6\u5ead\u51b3\u7b56\u6743\u72ec\u7acb\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4e2d | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u533b\u751f\u503c\u73ed\u5236\u5bfc\u81f4\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\uff0c\u82e5\u8bfe\u7a0b\u8282\u594f\u8fc7\u5bc6\u6216\u4f5c\u4e1a\u91cf\u8fc7\u5927\uff0c\u53ef\u80fd\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u4ea7\u751f\u79ef\u7d2f\u6027\u7126\u8651\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u804c\u4e1a\u5c5e\u6027\u51b3\u5b9a\u5176\u6297\u538b\u80fd\u529b\u5f3a\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u82e5\u5728\u627f\u8bfa\u7684\u201c\u7b2c\u516b\u5929\u5f00\u901a\u63a5\u5355\u201d\u540e\uff0c\u957f\u65f6\u95f4\uff08\u59822-3\u4e2a\u6708\uff09\u672a\u80fd\u63a5\u5230\u7b26\u5408\u5176\u201c\u5927\u5343\u5c0f\u4e07\u201d\u9884\u671f\u7684\u5355\u5b50\uff0c\u53ef\u80fd\u56e0\u53d8\u73b0\u671f\u671b\u843d\u7a7a\u800c\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe\u7b2c2-4\u5468\uff0c\u5f53\u8bfe\u7a0b\u4efb\u52a1\u91cf\u4e0e\u503c\u73ed\u3001\u5bb6\u5ead\u65f6\u95f4\u51b2\u7a81\u8fbe\u5230\u9876\u5cf0\u65f6\uff1b\u6216\u5f00\u8bfe\u7b2c3\u4e2a\u6708\uff0c\u82e5\u63a5\u5355\u53d8\u73b0\u8fdb\u5ea6\u7f13\u6162\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cX\u533b\u751f/\u8001\u5e08\uff0c\u770b\u5230\u60a8\u7684\u65f6\u95f4\u6bd4\u8f83\u5b9d\u8d35\uff0c\u54b1\u4eec\u7684\u8bfe\u7a0b\u5b89\u6392\u548c\u4f5c\u4e1a\u63d0\u4ea4\u90fd\u975e\u5e38\u7075\u6d3b\uff0c\u5b8c\u5168\u53ef\u4ee5\u6839\u636e\u60a8\u7684\u503c\u73ed\u8868\u6765\u8c03\u6574\u3002\u60a8\u7684\u76ee\u6807\u662f\u7a33\u6b65\u589e\u52a0\u6536\u5165\uff0c\u54b1\u4eec\u5c31\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u5148\u628a\u57fa\u7840\u6253\u7262\u3002\u6709\u4efb\u4f55\u65f6\u95f4\u4e0a\u7684\u51b2\u7a81\u968f\u65f6\u8ddf\u6211\u8bf4\uff0c\u6211\u6765\u5e2e\u60a8\u534f\u8c03\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011\u3002\u5339\u914d\u5176\u52a1\u5b9e\u3001\u8ffd\u6c42\u7ed3\u679c\u7684\u7279\u8d28\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\u7684\u7279\u70b9\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145**\u3010\u7075\u6d3b\u65f6\u95f4\u7ba1\u7406\u5305\u3011**\uff08\u5982\uff1a\u63d0\u4f9b\u5f55\u64ad\u8bfe\u91cd\u70b9\u5207\u7247\u3001\u4f5c\u4e1a\u5f39\u6027\u63d0\u4ea4\u7a97\u53e3\u3001\u9519\u5cf01v1\u70b9\u8bc4\u9884\u7ea6\uff09\u3002\u540c\u65f6\uff0c\u56e0\u5176\u804c\u4e1a\u80cc\u666f\u53ef\u80fd\u5bf9\u6280\u672f\u539f\u7406\u6709\u63a2\u7a76\u6b32\uff0c\u53ef\u9002\u65f6\u63d0\u4f9b**\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011**\uff08B\u6a21\u5757\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u5b9d\u5988\u9006\u88ad\u201d\u3001\u201c\u4e00\u591c\u66b4\u5bcc\u201d\u7b49\u611f\u6027\u6848\u4f8b\u8fc7\u5ea6\u523a\u6fc0\uff1b\u4e0d\u8981\u7528\u5bc6\u96c6\u7684\u3001\u4e0d\u5bb9\u5546\u91cf\u7684\u6253\u5361\u4efb\u52a1\u538b\u8feb\u5176\u672c\u5df2\u7d27\u5f20\u7684\u65f6\u95f4\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u8fdb\u884c\u5927\u989d\u63a8\u4ecb\uff08\u5982\u9ad8\u9636\u8bbe\u5907\u3001\u79c1\u6559\u8bfe\uff09\uff0c\u4f46**\u5fc5\u987b\u5efa\u7acb\u5728\u5df2\u5e2e\u52a9\u5176\u83b7\u5f97\u521d\u6b65\u53d8\u73b0\u6210\u679c\u3001\u5efa\u7acb\u5145\u5206\u4fe1\u4efb\u4e4b\u540e**\u3002\u524d\u671f\u91cd\u70b9\u5728\u4e8e\u4ea4\u4ed8\u786e\u5b9a\u6027\u548c\u8282\u594f\u611f\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u4eec\u7684\u6536\u5165\u8fd8\u884c\uff0c\u6211\u662f\u60f3\u7740\u540e\u9762\u80fd\u5e72\u4e2a\u5927\u5343\u5c0f\u4e07\uff0c\u8d34\u8865\u4e00\u4e0b\u201d \u2014\u2014 **\u52a8\u673a\u52a1\u5b9e\uff0c\u76ee\u6807\u660e\u786e\u3002**\n2. > \u201c\u91cf\u4e0d\u662f\u7279\u522b\u5927\uff0c\u9002\u5408\u517c\u804c\u7ec3\u624b\u7684\uff0c\u6211\u90fd\u63a5\u53d7\u201d \u2014\u2014 **\u5fc3\u6001\u5e73\u7a33\uff0c\u63a5\u53d7\u6e10\u8fdb\uff0c\u65e0\u66b4\u5bcc\u5e7b\u60f3\u3002**\n3. > \u201c\u624d\u628a\u5b69\u5b50\u641e\u5b8c\uff0c\u624d\u62bd\u51fa\u65f6\u95f4\u201d \u2014\u2014 **\u8d44\u6e90\u5e95\u5ea7\u4e2d\u65f6\u95f4\u7ef4\u5ea6\u7684\u771f\u5b9e\u5199\u7167\uff0c\u4f46\u65e0\u62b1\u6028\uff0c\u4f53\u73b0\u9ad8\u5f39\u6027\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u589e\u52a0\u7ecf\u6d4e\u5b89\u5168\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u7075\u6d3b\u53ef\u8c03\u7684\u5b66\u4e60\u8282\u594f\uff0c\u5e76\u5c3d\u5feb\u5e2e\u52a9\u5176\u83b7\u5f97\u7b2c\u4e00\u7b14\u53ef\u611f\u77e5\u7684\u53d8\u73b0\u6536\u5165\uff0c\u5efa\u7acb\u6b63\u53cd\u9988\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\"}\n```";
