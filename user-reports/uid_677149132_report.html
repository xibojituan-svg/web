        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677149132 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u4e66\u5c0f\u6ee1(\u5f20\u7eb3\u4e66) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e3b\u64ad\u7cfb\u7edf\u8bfe (\u610f\u5411\u4ef7\u683c\uff1a3980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u5bb6\u5ead\u652f\u6301\u578b\u652f\u4ed8**\u3002\u7528\u6237\u4e3a17\u5c81\u4e2d\u4e13\u5b66\u751f\uff0c\u65e0\u72ec\u7acb\u6536\u5165\uff0c\u9700\u7236\u6bcd\u51fa\u8d44\u3002\u5df2\u4e0e\u6bcd\u4eb2\u6c9f\u901a\u5e76\u83b7\u5f97\u652f\u6301\uff0c\u7236\u4eb2\u77e5\u60c5\u4f46\u672a\u660e\u786e\u8868\u6001\u3002\u652f\u4ed8\u6d41\u7a0b\u9700\u7b49\u5f85\u5bb6\u957f\u786e\u8ba4\uff0c\u65e0\u501f\u8d37\u6216\u5206\u671f\u8ff9\u8c61\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u9ad8\u5bbd\u88d5**\u3002\u8d70\u8bfb\u751f\uff0c\u660e\u786e\u8868\u793a\u6bcf\u5929\u4e2d\u53481\u5c0f\u65f6\u3001\u665a\u4e0a3\u5c0f\u65f6\uff0c\u5468\u672b\u4e5f\u6709\u65f6\u95f4\uff0c\u603b\u8ba1\u81f3\u5c114-5\u5c0f\u65f6\u8fde\u7eed\u5b66\u4e60\u65f6\u95f4\uff0c\u4e14\u73af\u5883\u5b89\u9759\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u5df2\u62a5\u5907\u5e76\u652f\u6301**\u3002\u4e3b\u8981\u4e0e\u6bcd\u4eb2\u6c9f\u901a\uff0c\u6bcd\u4eb2\u4e86\u89e3\u5e76\u8d5e\u540c\uff0c\u524d\u63d0\u662f\u201c\u4e0d\u7279\u522b\u803d\u8bef\u5b66\u4e1a\u201d\u3001\u201c\u4e0d\u662f\u5751\u8499\u62d0\u9a97\u201d\u3002\u7236\u4eb2\u4e5f\u77e5\u60c5\u3002\u5bb6\u5ead\u652f\u6301\u5ea6\u9ad8\uff0c\u662f\u91cd\u8981\u79ef\u6781\u4fe1\u53f7\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u7528\u6237\u4e3b\u52a8\u3001\u6e05\u6670\u5730\u63d0\u4f9b\u4e86\u5e74\u9f84\u3001\u5b66\u4e1a\u3001\u65f6\u95f4\u3001\u5bb6\u5ead\u652f\u6301\u3001\u5b66\u4e60\u52a8\u673a\u3001\u804c\u4e1a\u89c4\u5212\u7b49\u591a\u7ef4\u5ea6\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u77ed\u671f\u53d8\u73b0\u4e0e\u957f\u671f\u804c\u4e1a\u53d1\u5c55\u6df7\u5408\u9a71\u52a8**\u3002\u65e2\u6709\u660e\u786e\u7684\u201c\u8d5a\u96f6\u82b1\u94b1\u201d\u77ed\u671f\u76ee\u6807\uff0c\u4e5f\u6709\u201c\u638c\u63e1\u6280\u80fd\u201d\u3001\u201c\u6bd5\u4e1a\u540e\u8f6c\u957f\u671f\u804c\u4e1a\u201d\u7684\u957f\u671f\u89c4\u5212\uff0c\u5174\u8da3\u4e0e\u529f\u5229\u5e76\u5b58\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u7b2c\u4e00\u4e2a\u662f\u786e\u5b9e\u662f\u60f3\u6323\u70b9\u96f6\u7528\u94b1\u561b...\u7b2c\u4e8c\u4e2a\u5c31\u662f\u786e\u5b9e\u4e5f\u662f\u60f3\u7ed9\u81ea\u5df1\u591a\u52a0\u70b9\u6280\u80fd...\u7b2c\u4e09\u4e2a\u5c31\u662f\u60f3\u7740...\u7b49\u6bd5\u4e1a\u4ee5\u540e...\u8f6c\u6210\u957f\u671f\u7684\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b06\u9ad8]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 17\u5c81\u5b66\u751f\u65e0\u6536\u5165\uff0c\u4f9d\u8d56\u5bb6\u5ead\u652f\u6301\u3002\u4f46\u5bb6\u5ead\u652f\u6301\u5ea6\u9ad8\uff0c\u6bcd\u4eb2\u540c\u610f\uff0c\u652f\u4ed8\u610f\u613f\u660e\u786e\uff08\u201c\u6211\u60f3\u8981\u90a3\u4e2a3980\u7684\u201d\uff09\uff0c\u4e14\u672a\u8868\u73b0\u51fa\u7ecf\u6d4e\u538b\u529b\u3002**\u77ed\u677f\u4e0d\u77ed**\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u9ad8] \u2014 \u8d70\u8bfb\u751f\uff0c\u6bcf\u5929\u67094-5\u5c0f\u65f6\u56fa\u5b9a\u3001\u8fde\u7eed\u3001\u5b89\u9759\u7684\u5b66\u4e60\u65f6\u95f4\uff0c\u5b66\u4e1a\u538b\u529b\u63cf\u8ff0\u4e2d\u672a\u4f53\u73b0\u51b2\u7a81\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u9ad8] \u2014 \u6bcd\u4eb2\u77e5\u60c5\u4e14\u652f\u6301\uff0c\u7236\u4eb2\u77e5\u60c5\uff0c\u5bb6\u5ead\u73af\u5883\u63d0\u4f9b\u72ec\u7acb\u7a7a\u95f4\u3002**\u6700\u5f3a\u957f\u677f**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u94fe\u63a5\u6253\u4e0d\u5f00\u3001\u6587\u672c\u9009\u62e9\u56f0\u60d1\uff09\u65f6\uff0c\u4e3b\u52a8\u3001\u793c\u8c8c\u5730\u5411\u9500\u552e\u6c42\u52a9\uff0c\u5e76\u79ef\u6781\u5c1d\u8bd5\u89e3\u51b3\uff08\u201c\u6211\u7b49\u4f1a\u5c31\u53ef\u4ee5\u5f55\u201d\uff09\u3002\u63a5\u53d7\u4e13\u4e1a\u70b9\u8bc4\u540e\uff0c\u80fd\u8f6c\u5316\u4e3a\u884c\u52a8\u65b9\u5411\uff08\u201c\u80fd\u542c\u61c2\uff0c\u6211\u5c31\u77e5\u9053\u6211\u8be5\u5f80\u54ea\u4e2a\u5730\u513f\u4f7f\u52b2\u513f\u4e86\u201d\uff09\u3002\u6001\u5ea6\u79ef\u6781\uff0c\u65e0\u62b1\u6028\u6216\u81ea\u6211\u5426\u5b9a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5e08\u59d0\uff0c\u90a3\u4e2a\u6587\u672c\u6211\u6253\u4e0d\u5f00\u3002\u201d > \u201c\u80fd\u542c\u61c2\uff0c\u6211\u5c31\u77e5\u9053\u6211\u8be5\u5f80\u54ea\u4e2a\u5730\u513f\u4f7f\u52b2\u513f\u4e86\u3002\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u4f5c\u4e3a\u4e2d\u4e13\u5b66\u751f\uff0c\u5728\u540c\u9f84\u4eba\uff08\u201c\u4ed6\u4eec\u8df3\u821e\u4ec0\u4e48\u7684\u6211\u90fd\u4e0d\u4f1a\u201d\uff09\u4e2d\u7f3a\u4e4f\u6280\u80fd\u7279\u957f\u548c\u81ea\u4fe1\uff0c\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u201c\u786c\u6838\u201d\u6280\u80fd\uff08\u6709\u58f0\u6f14\u64ad\uff09\u6765\u83b7\u5f97\u81ea\u6211\u4ef7\u503c\u8ba4\u540c\u3001\u7ecf\u6d4e\u72ec\u7acb\uff08\u4e0d\u5411\u7236\u6bcd\u8981\u94b1\uff09\u4ee5\u53ca\u672a\u6765\u7684\u804c\u4e1a\u5c0a\u4e25\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u201c\u88ab\u770b\u89c1\u201d\u7684\u6210\u5c31\u611f**\u3002\u5c06\u4ed6\u89c6\u4e3a\u6709\u6f5c\u529b\u7684\u201c\u51c6\u4e13\u4e1a\u4eba\u58eb\u201d\uff0c\u7ed9\u4e88\u5177\u4f53\u3001\u4e13\u4e1a\u7684\u6307\u5bfc\uff08\u5982\u753b\u672c\u3001\u7f8e\u5de5\u65b9\u5411\uff09\uff0c\u5e76\u4e3a\u5176\u89c4\u5212\u6e05\u6670\u7684\u6210\u957f\u8def\u5f84\uff08\u4ece\u517c\u804c\u5230\u957f\u671f\u804c\u4e1a\uff09\uff0c\u6ee1\u8db3\u5176\u8ffd\u6c42\u5c0a\u91cd\u548c\u81ea\u6211\u5b9e\u73b0\u7684\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u9ad8\u6f5c\u529b\u3001\u9ad8\u914d\u5408\u5ea6\u3001\u8d44\u6e90\u5e95\u5ea7\u624e\u5b9e\u7684\u6f5c\u529b\u7528\u6237) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u517c\u987eT3\u6b7b\u78d5\u5b66\u9738\u7279\u8d28) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u3002\u5bb6\u5ead\u652f\u6301\u5ea6\u9ad8\uff0c\u65e0\u7ecf\u6d4e\u538b\u529b\uff0c\u5fc3\u7406\u5f39\u6027\u597d\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u6781\u4f4e** | \u6bcd\u4eb2\u662f\u4e3b\u8981\u652f\u6301\u8005\u4e14\u5df2\u540c\u610f\uff0c\u98ce\u9669\u6781\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u65f6\u95f4\u5145\u88d5\uff0c\u5b66\u4e60\u610f\u613f\u5f3a\u3002\u552f\u4e00\u98ce\u9669\u662f**\u4e2d\u4e13\u8bfe\u4e1a\u7a81\u7136\u52a0\u91cd**\uff0c\u6324\u538b\u5b66\u4e60\u65f6\u95f4\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u4e0d\u73bb\u7483\u5fc3\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u5176\u201c\u8d5a\u96f6\u82b1\u94b1\u201d\u7684\u77ed\u671f\u671f\u671b\u82e5\u5728\u521d\u671f\uff08\u59821-2\u4e2a\u6708\u5185\uff09\u672a\u5f97\u5230\u6ee1\u8db3\uff08\u5982\u672a\u63a5\u5230\u5355\u6216\u5355\u4ef7\u6781\u4f4e\uff09\uff0c\u53ef\u80fd\u4ea7\u751f\u5931\u843d\u611f\u3002\u9700\u63d0\u524d\u7ba1\u7406\u9884\u671f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c4-8\u5468\uff08\u201c\u6b7b\u4ea1\u8c37\u201d\u9636\u6bb5\uff09**\u3002\u5f53\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u57fa\u7840\u7ec3\u4e60\u67af\u71e5\uff0c\u82e5\u4ecd\u672a\u83b7\u5f97\u4efb\u4f55\u6b63\u53cd\u9988\uff08\u5982\u8bd5\u97f3\u901a\u8fc7\u3001\u5c0f\u989d\u6536\u5165\uff09\uff0c\u77ed\u671f\u53d8\u73b0\u671f\u671b\u53d7\u632b\uff0c\u53ef\u80fd\u52a8\u6447\u957f\u671f\u4fe1\u5fc3\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u540c\u5b66\u4f60\u597d\uff01\u770b\u5230\u4f60\u5bf9\u81ea\u5df1\u672a\u6765\u7684\u89c4\u5212\u8fd9\u4e48\u6e05\u6670\uff0c\u800c\u4e14\u5df2\u7ecf\u8d62\u5f97\u4e86\u5988\u5988\u7684\u652f\u6301\uff0c\u771f\u7684\u7279\u522b\u68d2\uff01\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u7a0b\uff0c\u5c31\u662f\u4e3a\u4f60\u8fd9\u6837\u6709\u60f3\u6cd5\u3001\u80af\u884c\u52a8\u7684\u540c\u5b66\u8bbe\u8ba1\u7684\u3002\u524d\u671f\u54b1\u4eec\u4f1a\u624e\u624e\u5b9e\u5b9e\u6253\u597d\u57fa\u7840\uff0c\u4ece\u753b\u672c\u3001\u5bf9\u8f68\u8fd9\u4e9b\u80fd\u5feb\u901f\u4e0a\u624b\u53c8\u6709\u6210\u5c31\u611f\u7684\u5730\u65b9\u5f00\u59cb\uff0c\u8ba9\u4f60\u5148\u2018\u8dd1\u8d77\u6765\u2019\u3002\u522b\u62c5\u5fc3\u8d5a\u96f6\u82b1\u94b1\u7684\u4e8b\uff0c\u5e08\u59d0/\u5e08\u5144\u4f1a\u5e2e\u4f60\u76ef\u7740\u9002\u5408\u65b0\u624b\u7684\u5355\u5b50\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u65e2\u80fd\u7ec3\u672c\u4e8b\uff0c\u4e5f\u80fd\u6162\u6162\u770b\u5230\u56de\u62a5\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72+\u5174\u8da3\u63a2\u7d22\u53cc\u8f68\u7ebf\u3011**\u3002\u524d\u671f\u4fa7\u91cd**\u753b\u672c\u3001\u5bf9\u8f68**\u7b49\u6613\u51fa\u6210\u679c\u7684\u786c\u6280\u80fd\uff0c\u5feb\u901f\u5efa\u7acb\u4fe1\u5fc3\u548c\u5fae\u5c0f\u6536\u5165\uff1b\u540c\u65f6\u5f15\u5bfc\u5176\u63a2\u7d22**\u7f8e\u5de5\u3001\u89d2\u8272\u97f3**\u7b49\u5174\u8da3\u65b9\u5411\uff0c\u6ee1\u8db3\u5176\u201c\u62d3\u5bbd\u6280\u80fd\u201d\u7684\u81ea\u6211\u5b9e\u73b0\u9700\u6c42\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176T2\u5b9e\u5e72+T3\u5b66\u9738\u7279\u8d28\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145**\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011**\u548c**\u3010\u65b0\u624b\u63a5\u5355\u62a4\u822a\u5305\u3011**\u3002\u524d\u8005\u6ee1\u8db3\u5176\u94bb\u7814\u539f\u7406\u7684\u9700\u6c42\uff0c\u540e\u8005\u7528\u5177\u4f53\u7684\u5c0f\u5355\u673a\u4f1a\u7ba1\u7406\u5176\u77ed\u671f\u6536\u76ca\u9884\u671f\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u8981\u53ea\u753b\u5927\u997c\u4e0d\u8c08\u8def\u5f84**\uff1a\u907f\u514d\u7a7a\u6d1e\u7684\u201c\u5b66\u5b8c\u5c31\u80fd\u8d5a\u5927\u94b1\u201d\u627f\u8bfa\uff0c\u5fc5\u987b\u7ed9\u51fa\u4ece\u201c\u753b\u672c\u201d\u5230\u201c\u63a5\u5c0f\u89d2\u8272\u97f3\u201d\u7684\u6e05\u6670\u3001\u53ef\u8fbe\u6210\u7684\u91cc\u7a0b\u7891\u3002\n    2. **\u7edd\u4e0d\u8981\u5ffd\u89c6\u5176\u201c\u88ab\u4e13\u4e1a\u8ba4\u53ef\u201d\u7684\u9700\u6c42**\uff1a\u70b9\u8bc4\u9700\u5177\u4f53\u3001\u4e13\u4e1a\u3001\u6709\u5efa\u8bbe\u6027\uff0c\u6577\u884d\u7684\u5938\u5956\u4f1a\u8ba9\u4ed6\u89c9\u5f97\u4e0d\u88ab\u91cd\u89c6\u3002\n    3. **\u7edd\u4e0d\u8981\u5728\u521d\u671f\u65bd\u52a0\u8fc7\u91cd\u7684\u201c\u53d8\u73b0\u201d\u538b\u529b**\uff1a\u907f\u514d\u9891\u7e41\u8ffd\u95ee\u201c\u63a5\u5230\u5355\u6ca1\u201d\uff0c\u8f6c\u800c\u5173\u6ce8\u5176\u6280\u80fd\u6210\u957f\u548c\u4f5c\u54c1\u5b8c\u6210\u5ea6\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u9700\u5173\u8054\u6e05\u6670\u6210\u957f\u8def\u5f84**\u3002\u7531\u4e8e\u5176\u6709\u957f\u671f\u804c\u4e1a\u89c4\u5212\uff0c\u4e14\u5bb6\u5ead\u652f\u6301\uff0c\u5bf9\u7cfb\u7edf\u8bfe\u6709\u652f\u4ed8\u610f\u613f\u3002\u5347\u5355\u8bdd\u672f\u5e94\u7d27\u6263\u201c\u4ece\u517c\u804c\u5230\u804c\u4e1a\u201d\u7684\u8def\u5f84\uff0c\u5c55\u793a\u7cfb\u7edf\u8bfe\u5982\u4f55\u4f53\u7cfb\u5316\u5730\u89e3\u51b3\u5176\u6280\u80fd\u74f6\u9888\u548c\u8d44\u6e90\u83b7\u53d6\u95ee\u9898\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u4eca\u5e74\u662f17\u5c81...\u7b2c\u4e00\u4e2a\u662f\u786e\u5b9e\u662f\u60f3\u6323\u70b9\u96f6\u7528\u94b1\u561b\uff0c\u4e0d\u5411\u5bb6\u957f\u7236\u6bcd\u8981\u3002\u7b2c\u4e8c\u4e2a\u5c31\u662f\u60f3\u62d3\u5bbd\u4e00\u4e0b\u6280\u80fd...\u7b2c\u4e09\u4e2a\u5c31\u662f\u60f3\u7740\u957f\u4e45\u505a\uff0c\u6bd5\u4e1a\u4ee5\u540e\u5c31\u662f\u60f3\u8f6c\u5230\u5c31\u76f4\u63a5\u505a\u6709\u58f0\u4e3b\u64ad\u8fd9\u4e2a\u804c\u4e1a\u3002\u201d\n2. > \u201c\u6211\u5988\u5988\u662f\u77e5\u9053\u7684...\u4e86\u89e3\u4e5f\u8d5e\u540c...\u4e0d\u662f\u5751\u8499\u62d0\u9a97\uff0c\u5c31\u662f\u5b8c\u5168\u540c\u610f\u6211\u505a\u7684\u3002\u201d\n3. > \u201c\u5e08\u59d0\u62b1\u6b49\uff0c\u6211\u521a\u521a\u5728\u4e0a\u5b66\u6821\u7684\u793e\u56e2...\u6211\u521a\u521a\u542c\u4e86\u60a8\u7684\u70b9\u8bc4...\u80fd\u542c\u61c2\uff0c\u6211\u5c31\u77e5\u9053\u6211\u8be5\u5f80\u54ea\u4e2a\u5730\u513f\u4f7f\u52b2\u513f\u4e86\u3002\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2\u4f4e\u8c03\u5b9e\u5e72\u578b\uff08\u517cT3\u5b66\u9738\u7279\u8d28\uff09\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7528\u201c\u786c\u6838\u5b9e\u64cd+\u5fae\u5c0f\u6b63\u53cd\u9988\u201d\u7ba1\u7406\u5176\u77ed\u671f\u53d8\u73b0\u9884\u671f\uff0c\u540c\u65f6\u7528\u201c\u4e13\u4e1a\u6df1\u5ea6+\u804c\u4e1a\u8def\u5f84\u89c4\u5212\u201d\u6ee1\u8db3\u5176\u957f\u671f\u6210\u957f\u9700\u6c42\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"maslow_need\": \"\u7b2c\u56db\u5c42\u5c0a\u91cd\u9700\u6c42/\u7b2c\u4e94\u5c42\u81ea\u6211\u5b9e\u73b0\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72+\u5174\u8da3\u63a2\u7d22\u53cc\u8f68\u7ebf\"}\n```";
