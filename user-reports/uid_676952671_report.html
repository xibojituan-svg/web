    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u67d2 (UID: 676952671) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-02-25 \u81f3 2026-03-04 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u79cb\u6c344(\u5f20\u6676)\u3001\u5b98\u65b9S\u7ea7\u62db\u52df\u5b98(\u67f3\u96ea\u6885)\u3001\u6a59\u679c3(\u67f3\u96ea\u6885)\u3001\u4e91\u95f4\u6708(\u91d1\u5955\u5f64) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u5199\u4f5c/\u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b (\u4ef7\u683c\u672a\u660e\u786e\uff0c\u7ea63980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u7f3a\u5931** (\u7528\u6237\u66fe\u70b9\u51fb\u201c\u8d44\u91d1\u56f0\u96be\uff0c\u8d1f\u503a\u8fc7\u591a\u201d\u9009\u9879\uff0c\u4f46\u672a\u5c55\u5f00) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u4e3b\u8981\u5728\u5bb6\u5e26\u5a03\uff0c\u9700\u770b\u5b69\u5b50\uff0c\u65f6\u95f4\u4e0d\u56fa\u5b9a) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** (\u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** (\u5173\u952e\u4fe1\u606f\u5982\u652f\u4ed8\u80fd\u529b\u3001\u5bb6\u5ead\u652f\u6301\u5ea6\u3001\u5177\u4f53\u804c\u4e1a\u72b6\u51b5\u5747\u672a\u900f\u9732) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u5174\u8da3\u4e0e\u53d8\u73b0\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u201c50%\u5956\u52b1\uff0c50%\u4e3a\u4e86\u8d5a\u94b1\u201d\uff0c\u5bf9\u5b66\u4e60\u5185\u5bb9\uff08\u62c6\u6587\u3001\u5199\u4f5c\uff09\u8868\u73b0\u51fa\u6d53\u539a\u5174\u8da3\u548c\u53c2\u4e0e\u611f\uff0c\u4f46\u6838\u5fc3\u9a71\u52a8\u529b\u5305\u542b\u660e\u786e\u7684\u77ed\u671f\u53d8\u73b0\u671f\u671b\uff08\u201c\u4e24\u4e2a\u6708\u5185\uff0c\u628a\u5b66\u5230\u7684\u4e1c\u897f\u53d8\u6210\u6536\u5165\u201d\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u55ef\u90a350%\u5956\u52b1\uff0c50%\u4e3a\u4e86\u8d5a\u94b1\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e (\u6781\u5371)** \u2014 \u7528\u6237\u66fe\u4e3b\u52a8\u70b9\u51fb\u9500\u552e\u8bdd\u672f\u4e2d\u7684\u201c**\u8d44\u91d1\u56f0\u96be\uff0c\u8d1f\u503a\u8fc7\u591a**\u201d\u9009\u9879\uff0c\u8fd9\u662f\u5f3a\u70c8\u7684\u5371\u9669\u4fe1\u53f7\uff0c\u6697\u793a\u652f\u4ed8\u80fd\u529b\u4e25\u91cd\u4e0d\u8db3\uff0c\u53ef\u80fd\u5b58\u5728\u501f\u8d37\u6216\u632a\u7528\u5bb6\u5ead\u5fc5\u9700\u8d44\u91d1\u7684\u98ce\u9669\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u4f5c\u4e3a\u5168\u804c\u5988\u5988\uff0c\u65f6\u95f4\u788e\u7247\u5316\uff08\u201c\u770b\u5b69\u5b50\u90a3\u521a\u6709\u65f6\u95f4\u201d\uff09\uff0c\u4f46\u5b66\u4e60\u610f\u613f\u5f3a\uff0c\u80fd\u6324\u51fa\u65f6\u95f4\u5b8c\u6210\u4f5c\u4e1a\u548c\u53c2\u4e0e\u8ba8\u8bba\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\uff0c\u4f46\u7ed3\u5408\u201c\u8d44\u91d1\u56f0\u96be\u201d\u548c\u5168\u804c\u5988\u5988\u8eab\u4efd\uff0c\u5bb6\u5ead\u652f\u6301\u5ea6\u5b58\u7591\uff0c**\u98ce\u9669\u6781\u9ad8**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b07\u4f4e\u6781\u5371]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u7528\u6237\u5728\u5b66\u4e60\u4e2d\u8868\u73b0\u51fa\u6781\u5f3a\u7684\u81ea\u6211\u5426\u5b9a\uff08\u201c\u662f\u4e0d\u662f\u597d\u7b28\u554a\u201d\uff09\u3001\u5bf9\u632b\u6298\u7684\u4f4e\u5bb9\u5fcd\u5ea6\uff08\u201c\u90fd\u6709\u4e9b\u5d29\u6e83\u4e86\u201d\uff09\uff0c\u4ee5\u53ca**\u5bf9\u73ed\u4e3b\u4efb\uff08\u73ed\u73ed\uff09\u6781\u9ad8\u7684\u60c5\u611f\u4f9d\u8d56\u548c\u7d22\u53d6**\uff08\u201c\u4f60\u4e00\u4e0d\u7406\u6211\uff0c\u6211\u771f\u4e2a\u4eba\u90fd\u6ca1\u7cbe\u795e\u4e86\u201d\u3001\u201c\u6211\u7684\u5973\u795e\u5927\u4eba\u201d\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u662f\u4e0d\u662f\u597d\u7b28\u554a\uff0c\u90a3\u4e48\u7b80\u5355\u7684\u4e8b\u60c5\u6211\u5374\u8981\u6765\u56de\u6298\u817e\u534a\u5929\u201d\uff1b > \u201c\u4f60\u4e00\u4e0d\u7406\u6211\uff0c\u6211\u771f\u4e2a\u4eba\u90fd\u6ca1\u7cbe\u795e\u4e86\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 / \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5f3a\u70c8\u7684\u81ea\u6211\u4ef7\u503c\u611f\u7f3a\u5931\u4e0e\u60c5\u611f\u7a7a\u865a**\u3002\u4f5c\u4e3a\u5168\u804c\u5988\u5988\uff0c\u5176\u793e\u4f1a\u89d2\u8272\u5355\u4e00\uff0c\u6e34\u671b\u901a\u8fc7\u6280\u80fd\u5b66\u4e60\u548c\u201c\u8d5a\u94b1\u201d\u6765\u8bc1\u660e\u81ea\u5df1\u3001\u83b7\u5f97\u8ba4\u53ef\uff0c\u4ee5\u62b5\u5fa1\u201c\u4e0d\u5b66\u4e60\u5c31\u4f1a\u5f88\u7126\u8651\u201d\u7684\u4e0d\u5b89\u5168\u611f\u3002\u540c\u65f6\uff0c\u6781\u5ea6\u6e34\u671b\u5728\u793e\u7fa4\uff08\u73ed\u7ea7\uff09\u548c\u4e0e\u73ed\u4e3b\u4efb\u7684\u5173\u7cfb\u4e2d\u83b7\u5f97\u60c5\u611f\u966a\u4f34\u548c\u80af\u5b9a\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u3001\u6301\u7eed\u7684\u60c5\u611f\u80af\u5b9a\u4e0e\u966a\u4f34**\uff0c\u8ba9\u5979\u611f\u53d7\u5230\u88ab\u5173\u6ce8\u3001\u88ab\u9700\u8981\u3001\u88ab\u8d5e\u8d4f\uff0c\u4ee5\u6b64\u4f5c\u4e3a\u5979\u575a\u6301\u5b66\u4e60\u7684\u6838\u5fc3\u52a8\u529b\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udd34D\u7c7b** (\u56e0\u89e6\u53d1\u8d44\u91d1\u7ea2\u7ebf) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u6838\u5fc3\u7279\u5f81\uff1a\u9ad8\u60c5\u7eea\u4f9d\u8d56\u3001\u4f4e\u5fc3\u7406\u5f39\u6027\u3001\u4f4e\u6297\u538b\u6027\u3001\u6e34\u671b\u5373\u65f6\u60c5\u611f\u53cd\u9988) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a**\ud83d\udd34\u5df2\u89e6\u53d1 D \u7c7b\u7194\u65ad\u7ea2\u7ebf\uff01**\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u7528\u6237\u4e3b\u52a8\u66b4\u9732\u201c**\u8d44\u91d1\u56f0\u96be\uff0c\u8d1f\u503a\u8fc7\u591a**\u201d\uff0c\u6b64\u4fe1\u53f7\u76f4\u63a5\u89e6\u53ca\u8d44\u6e90\u5e95\u5ea7\u4e2d\u7684\u8d44\u91d1\u7ea2\u7ebf\uff0c\u5c5e\u4e8e\u9ad8\u5371\u652f\u4ed8\u9690\u60a3\uff0c\u6781\u6613\u5f15\u53d1\u540e\u7eed\u56e0\u7ecf\u6d4e\u538b\u529b\u5bfc\u81f4\u7684\u9000\u8d39\u6216\u5ba2\u8bc9\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u6781\u9ad8** | \u62a5\u540d\u8d44\u91d1\u53ef\u80fd\u6765\u6e90\u4e8e\u5bb6\u5ead\u5fc5\u8981\u5f00\u652f\u6216\u501f\u8d37\uff0c\u4e00\u65e6\u88ab\u5bb6\u4eba\u53d1\u73b0\u6216\u5bb6\u5ead\u7ecf\u6d4e\u538b\u529b\u589e\u5927\uff0c\u6781\u6613\u7206\u53d1\u51b2\u7a81\u5e76\u8981\u6c42\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u5e26\u5a03\u5bfc\u81f4\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\uff0c\u4e00\u65e6\u8bfe\u7a0b\u8fdb\u5165\u9700\u8981\u6574\u5757\u65f6\u95f4\u5b8c\u6210\u590d\u6742\u4f5c\u4e1a\u7684\u9636\u6bb5\uff08\u5982\u7b2c\u4e8c\u3001\u4e09\u5468\uff09\uff0c\u53ef\u80fd\u56e0\u65e0\u6cd5\u8ddf\u4e0a\u8fdb\u5ea6\u800c\u81ea\u8d23\u3001\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u9996\u6b21\u9047\u5230\u7a0d\u6709\u96be\u5ea6\u7684\u4f5c\u4e1a\uff08\u5982\u62c6\u6587\uff09\u3001\u8f6f\u4ef6\u64cd\u4f5c\u95ee\u9898\u6216\u672a\u88ab\u53ca\u65f6\u56de\u5e94\u65f6\uff0c\u6781\u6613\u56e0\u201c\u7b28\u201d\u7684\u81ea\u6211\u8ba4\u77e5\u800c\u60c5\u7eea\u5d29\u6e83\uff0c\u76f4\u63a5\u8981\u6c42\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | \u5bf9\u201c\u4e24\u4e2a\u6708\u5185\u53d8\u73b0\u201d\u62b1\u6709\u671f\u5f85\uff0c\u82e5\u77ed\u671f\u5185\u672a\u770b\u5230\u6536\u76ca\u82d7\u5934\uff0c\u4f1a\u8fc5\u901f\u4ea7\u751f\u843d\u5dee\u611f\u548c\u88ab\u6b3a\u9a97\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c\u4e00\u5468\u81f3\u7b2c\u4e8c\u5468**\u3002\u6b64\u65f6\u5c06\u9762\u4e34\u7b2c\u4e00\u4e2a\u5b9e\u64cd\u96be\u70b9\uff08\u5982AI\u5de5\u5177\u4f7f\u7528\u3001\u9996\u6b21\u4f5c\u4e1a\uff09\uff0c\u4e14\u53d8\u73b0\u627f\u8bfa\u5c1a\u672a\u5151\u73b0\uff0c\u60c5\u7eea\u6ce2\u52a8\u548c\u6536\u76ca\u7126\u8651\u53e0\u52a0\uff0c\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u67d2\u5b9d\uff0c\u770b\u5230\u4f60\u7684\u81ea\u6211\u4ecb\u7ecd\u7279\u522b\u611f\u52a8\uff0c\u80fd\u628a\u5bb6\u5ead\u548c\u5b69\u5b50\u7167\u987e\u5f97\u90a3\u4e48\u597d\uff0c\u672c\u8eab\u5c31\u662f\u8d85\u5389\u5bb3\u7684\u80fd\u529b\uff01\u54b1\u4eec\u5b66\u4e60\u4e0d\u56fe\u5feb\uff0c\u5c31\u56fe\u4e2a\u5f00\u5fc3\u548c\u8fdb\u6b65\u3002\u73ed\u73ed\u4f1a\u4e00\u76f4\u5728\u8fd9\u513f\u966a\u7740\u4f60\uff0c\u6709\u4efb\u4f55\u4e00\u70b9\u5c0f\u5361\u58f3\u3001\u5c0f\u60c5\u7eea\uff0c\u968f\u65f6\u6233\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u89e3\u51b3\u3002\u4f60\u6bcf\u4e00\u6b65\u5c0f\u5c0f\u7684\u5c1d\u8bd5\uff0c\u90fd\u7279\u522b\u68d2\uff01\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5174\u8da3\u6e38\u4e50\u7ebf\u3011** (\u6838\u5fc3\u76ee\u6807\uff1a\u7ef4\u6301\u5174\u8da3\u548c\u793e\u7fa4\u5f52\u5c5e\u611f\uff0c\u800c\u975e\u5f3a\u63a8\u53d8\u73b0)\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305 (\u6ee1\u914d)\u3011**\u3002\u5fc5\u987b\u5305\u542b\uff1a\u6bcf\u65e5\u60c5\u611f\u6253\u5361\u5173\u6000\u3001\u4f5c\u4e1a\u4ee5\u9f13\u52b1\u548c\u5b8c\u6210\u5ea6\u4e3a\u4e3b\uff08\u975e\u8d28\u91cf\uff09\u3001\u7b80\u5316\u6240\u6709\u64cd\u4f5c\u6b65\u9aa4\u3001\u63d0\u4f9b\u201c\u4e00\u53e5\u8bdd\u6253\u5361\u201d\u7b49\u96f6\u538b\u529b\u4efb\u52a1\u9009\u9879\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u5979\u65bd\u52a0\u4efb\u4f55\u4f5c\u4e1a\u96be\u5ea6\u548c\u8fdb\u5ea6\u538b\u529b**\uff0c\u907f\u514d\u4f7f\u7528\u201c\u4f18\u79c0\u201d\u3001\u201c\u6807\u6746\u201d\u7b49\u8bcd\u6c47\u5236\u9020\u5bf9\u6bd4\u3002\n    2. **\u7edd\u4e0d\u5728\u65e9\u671f\uff08\u81f3\u5c11\u524d\u4e00\u4e2a\u6708\uff09\u4e3b\u52a8\u63d0\u53ca\u6216\u627f\u8bfa\u53d8\u73b0**\uff0c\u6de1\u5316\u201c\u8d5a\u94b1\u201d\u76ee\u6807\uff0c\u5f3a\u5316\u201c\u6210\u957f\u201d\u548c\u201c\u966a\u4f34\u201d\u3002\n    3. **\u7edd\u4e0d\u5141\u8bb8\u957f\u65f6\u95f4\u4e0d\u56de\u590d\u5979\u7684\u6d88\u606f**\uff0c\u5fc5\u987b\u5efa\u7acb\u9ad8\u9891\u3001\u6e29\u6696\u7684\u60c5\u611f\u8fde\u63a5\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5347\u5355**\u3002\u5f53\u524d\u9636\u6bb5\u4efb\u4f55\u4ed8\u8d39\u52a8\u4f5c\u90fd\u4f1a\u6781\u5927\u52a0\u5267\u5176\u7ecf\u6d4e\u538b\u529b\u548c\u9000\u8d39\u98ce\u9669\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u662f\u4e0d\u662f\u597d\u7b28\u554a\uff0c\u90a3\u4e48\u7b80\u5355\u7684\u4e8b\u60c5\u6211\u5374\u8981\u6765\u56de\u6298\u817e\u534a\u5929\u201d\n2. > \u201c\u4f60\u4e00\u4e0d\u7406\u6211\uff0c\u6211\u771f\u4e2a\u4eba\u90fd\u6ca1\u7cbe\u795e\u4e86\u201d\n3. > \u201c\u55ef\u90a350%\u5956\u52b1\uff0c50%\u4e3a\u4e86\u8d5a\u94b1\u201d\n4. > *\u7528\u6237\u70b9\u51fb\u4e86\u9500\u552e\u8bdd\u672f\u4e2d\u7684\u9009\u9879* **\u201c\u56de\u590d3\uff1a\u8d44\u91d1\u56f0\u96be\uff0c\u8d1f\u503a\u8fc7\u591a\u201d**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u60c5\u611f\u966a\u4f34\u4e0e\u81ea\u6211\u4ef7\u503c\u786e\u8ba4\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u81f4\u7684\u60c5\u611f\u629a\u6170\u4e0e\u96f6\u538b\u529b\u5b66\u4e60\u73af\u5883\uff0c\u4e25\u683c\u89c4\u907f\u4efb\u4f55\u65bd\u538b\u548c\u53d8\u73b0\u50ac\u4fc3\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168/\u793e\u4ea4\u9700\u6c42\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf+\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\"}\n```";
