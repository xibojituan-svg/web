    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u7f3a\u652f\u4ed8\u4fe1\u606f\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u6df1\u5c42\u5b66\u4e60\u52a8\u673a\u3001\u7ecf\u6d4e\u72b6\u51b5\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u7b49\u5173\u952e\u7ef4\u5ea6\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a**\u4e2d\u7b49**\u3002\u6709\u660e\u786e\u5b66\u4e60\u884c\u4e3a\uff08\u4ea4\u4f5c\u4e1a\u3001\u53c2\u4e0e\u8ba8\u8bba\u3001\u8bbe\u5907\u8c03\u8bd5\uff09\uff0c\u5bf9\u8bfe\u7a0b\u5185\u5bb9\uff08\u5982\u641e\u7b11\u9898\u6750\u3001\u6545\u4e8b\u7acb\u610f\uff09\u8868\u73b0\u51fa\u5174\u8da3\u3002\u4f46\u52a8\u673a\u504f\u5411\u5174\u8da3\u63a2\u7d22\u4e0e\u793e\u7fa4\u53c2\u4e0e\uff0c**\u53d8\u73b0/\u804c\u4e1a\u5316\u9a71\u52a8\u529b\u672a\u663e**\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u62e5\u6709\u57fa\u7840\u5f55\u97f3\u8bbe\u5907\uff08\u58f0\u5361\u3001\u8033\u673a\uff09\uff0c\u80fd\u6295\u5165\u65f6\u95f4\u53c2\u4e0e\u8bfe\u7a0b\u4e0e\u793e\u7fa4\u6d3b\u52a8\u3002**\u7ecf\u6d4e\u80fd\u529b\u3001\u53ef\u652f\u914d\u5b66\u4e60\u65f6\u95f4\u3001\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u672a\u77e5**\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a**\u8f83\u9ad8**\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u8bbe\u5907\u8fde\u63a5\u3001\u8bfe\u7a0b\u5361\u987f\u3001\u6587\u4ef6\u4e22\u5931\uff09\u80fd\u4e3b\u52a8\u8be2\u95ee\u5e76\u5c1d\u8bd5\u89e3\u51b3\u3002\u5728\u56e2\u961f\u8ba8\u8bba\u4e2d\u80fd\u63d0\u51fa\u4e0d\u540c\u610f\u89c1\uff08\u5982\u8d28\u7591\u9898\u6750\u96f7\u540c\uff09\uff0c\u4e5f\u80fd\u63a5\u53d7\u4ed6\u4eba\u89c2\u70b9\uff08\u201c\u770b\u5927\u5bb6\u5427\uff0c\u6211\u90fd\u884c\u201d\uff09\uff0c**\u534f\u4f5c\u6027\u4e0e\u9002\u5e94\u6027\u826f\u597d**\u3002\u81ea\u8ff0\u6709\u201c\u5f3a\u8feb\u75c7\u201d\uff0c\u4f46\u80fd\u542c\u53d6\u5efa\u8bae\u8c03\u6574\uff08\u201c\u5c3d\u91cf\u63a7\u5236\u81ea\u5df1\u201d\uff09\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a**\u65e0\u6cd5\u5224\u65ad**\u3002\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u884c\u4e3a\u3001\u8bfe\u7a0b\u4ef7\u683c\u3001\u4f18\u60e0\u7b49\u4fe1\u606f\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u65e0\u6cd5\u5224\u65ad**\u3002\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u6210\u5458\u6216\u51b3\u7b56\u76f8\u5173\u8ba8\u8bba\u3002\n*   **\u6b65\u9aa41-4\u5224\u5b9a**\uff1a\u57fa\u4e8e\u73b0\u6709\u884c\u4e3a\u4fe1\u53f7\uff0c\u7528\u6237\u5904\u4e8e **B\u7c7b\uff08\u4f53\u9a8c\u63a2\u7d22\u671f\uff09**\u3002\u8868\u73b0\u4e3a\uff1a\u5df2\u4ed8\u8d39\u5165\u5b66\uff0c\u79ef\u6781\u53c2\u4e0e\u8bfe\u7a0b\u4e0e\u793e\u7fa4\u4e92\u52a8\uff0c\u5b8c\u6210\u4f5c\u4e1a\uff0c\u5173\u6ce8\u6280\u80fd\u63d0\u5347\u4e0e\u5185\u5bb9\u521b\u4f5c\uff0c\u4f46\u957f\u671f\u5b66\u4e60\u76ee\u6807\u548c\u53d8\u73b0\u8def\u5f84\u5c1a\u4e0d\u6e05\u6670\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n**T5 \u5174\u8da3\u9a71\u52a8\u63a2\u7d22\u8005**\u3002\u6838\u5fc3\u7279\u5f81\uff1a\u51fa\u4e8e\u4e2a\u4eba\u5174\u8da3\uff08\u5982\u5bf9\u6709\u58f0\u5185\u5bb9\u3001\u6545\u4e8b\u521b\u4f5c\u7684\u70ed\u7231\uff09\u53c2\u4e0e\u5b66\u4e60\uff0c\u793e\u7fa4\u53c2\u4e0e\u5ea6\u9ad8\uff0c\u4eab\u53d7\u5b66\u4e60\u8fc7\u7a0b\u548c\u540c\u597d\u4ea4\u6d41\uff0c\u5bf9\u53d8\u73b0\u538b\u529b\u4e0d\u654f\u611f\u6216\u5904\u4e8e\u8fdc\u671f\u89c4\u5212\u9636\u6bb5\u3002\u884c\u4e3a\u7b26\u5408\uff1a\u79ef\u6781\u53c2\u4e0e\u201c\u6709\u58f0\u4e4b\u591c\u201d\u6d3b\u52a8\u3001\u4e0e\u540c\u5b66\u8ba8\u8bba\u6545\u4e8b\u9898\u6750\u3001\u5bf9\u641e\u7b11\u60ac\u7591\u5185\u5bb9\u8868\u73b0\u51fa\u6d53\u539a\u5174\u8da3\u3001\u4e3b\u52a8\u8c03\u8bd5\u8bbe\u5907\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u98ce\u9669\u7b49\u7ea7**\uff1a**\u4f4e**\n*   **\u6839\u56e0\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a\u4f4e\u3002\u7528\u6237\u5df2\u83b7\u5f97\u6b63\u9762\u53cd\u9988\uff08\u201c\u53e3\u8154\u72b6\u6001\u6700\u597d\u201d\uff09\uff0c\u4e14\u6301\u7eed\u63d0\u4ea4\u4f5c\u4e1a\uff0c\u672a\u89c1\u6548\u679c\u62b1\u6028\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a\u672a\u77e5\u3002\u65e0\u76f8\u5173\u4fe1\u606f\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a\u4f4e\u3002\u7528\u6237\u867d\u5076\u6709\u4e8b\u52a1\u7e41\u5fd9\uff08\u201c\u65e9\u51fa\u665a\u5f52\u201d\uff09\uff0c\u4f46\u4f1a\u4e3b\u52a8\u8865\u8bfe\uff0c\u5e76\u89c4\u5212\u540e\u7eed\u5b66\u4e60\uff08\u8be2\u95ee\u540e\u671f\u73ed\u62a5\u540d\uff09\uff0c**\u5b66\u4e60\u7c98\u6027\u8f83\u9ad8**\u3002\n    4.  **\u5185\u5bb9/\u670d\u52a1\u4e0d\u6ee1**\uff1a\u4f4e\u3002\u5bf9\u73ed\u73ed\u670d\u52a1\uff08\u201c\u8f9b\u82e6\u73ed\u73ed\u4e86\uff0c\u7231\u4f60\u201d\uff09\u3001\u8bfe\u7a0b\u5185\u5bb9\uff08\u201c\u7acb\u610f\u5f88\u9ad8\u201d\uff09\u8bc4\u4ef7\u79ef\u6781\uff0c\u9047\u5230\u6280\u672f\u95ee\u9898\u6c9f\u901a\u987a\u7545\u3002\n    5.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a\u672a\u77e5\u3002\u65e0\u76f8\u5173\u4fe1\u606f\u3002\n    6.  **\u9500\u552e\u8bef\u5bfc**\uff1a\u672a\u77e5\u3002\u65e0\u552e\u524d\u6c9f\u901a\u8bb0\u5f55\u3002\n    7.  **\u5e73\u53f0\u4f53\u9a8c/\u4f26\u7406\u95ee\u9898**\uff1a\u6781\u4f4e\u3002\u4ec5\u53cd\u9988\u8fc7\u8bfe\u7a0b\u64ad\u653e\u5361\u987f\u7684\u6280\u672f\u95ee\u9898\uff0c\u4e14\u5df2\u89e3\u51b3\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5f53\u524d\u8bb0\u5f55\u672a\u53d1\u73b0**\u5938\u5927\u627f\u8bfa\u3001\u865a\u5047\u5ba3\u4f20\u3001\u8bf1\u5bfc\u8d37\u6b3e\u3001\u5236\u9020\u7126\u8651\u7b49\u8fdd\u89c4\u884c\u4e3a\u3002\n*   **\u6f5c\u5728\u98ce\u9669\u70b9**\uff1a\u7528\u6237\u8be2\u95ee\u540e\u671f\u73ed\u62a5\u540d\u65f6\uff0c\u9500\u552e\u63d0\u53ca\u201c\u7a0b\u5927\u8001\u5e08\u540d\u989d\u6709\u9650\u201d\uff0c**\u5b58\u5728\u5229\u7528\u7a00\u7f3a\u6027\u8fdb\u884c\u4fc3\u5355\u7684\u503e\u5411**\uff0c\u4f46\u672a\u53d1\u73b0\u5f3a\u5236\u6216\u8fc7\u5ea6\u65bd\u538b\u3002\n*   **\u5efa\u8bae**\uff1a\u540e\u7eed\u6c9f\u901a\u5e94\u805a\u7126\u7528\u6237\u5b66\u4e60\u9700\u6c42\u4e0e\u65f6\u95f4\u89c4\u5212\uff0c\u907f\u514d\u8fc7\u5ea6\u4f7f\u7528\u201c\u9650\u989d\u201d\u7b49\u8bdd\u672f\u5236\u9020\u7d27\u8feb\u611f\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d**\uff1a**\u5339\u914d**\u3002\u7528\u6237\u5f53\u524d\u53c2\u4e0e\u7684\u57fa\u7840\u8bfe\u7a0b\u4e0e\u5176\u63a2\u7d22\u5174\u8da3\u3001\u7ec3\u4e60\u6280\u80fd\u7684\u9700\u6c42\u5339\u914d\u3002\u5176\u8be2\u95ee\u540e\u671f\u73ed\uff0c\u8868\u660e\u6709\u6df1\u5316\u5b66\u4e60\u7684\u6f5c\u5728\u610f\u5411\u3002\n*   **\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9996\u8981\u52a8\u4f5c**\uff1a**\u5de9\u56fa\u5174\u8da3\uff0c\u5f15\u5bfc\u89c4\u5212**\u3002\u80af\u5b9a\u5176\u5728\u793e\u7fa4\u4e2d\u7684\u79ef\u6781\u8d21\u732e\u548c\u521b\u4f5c\u60f3\u6cd5\uff0c\u5728\u540e\u7eed\u6c9f\u901a\u4e2d\u81ea\u7136\u63a2\u8be2\u5176\u957f\u671f\u5b66\u4e60\u76ee\u6807\uff08\u7eaf\u5174\u8da3\uff1f\u517c\u804c\uff1f\u804c\u4e1a\u8f6c\u578b\uff1f\uff09\uff0c\u4e3a\u540e\u7eed\u8bfe\u7a0b\u63a8\u8350\u94fa\u57ab\u3002\n    2.  **\u670d\u52a1\u91cd\u70b9**\uff1a\u6301\u7eed\u63d0\u4f9b\u53ca\u65f6\u7684\u6280\u672f\u652f\u6301\uff08\u5982\u8bbe\u5907\u8c03\u8bd5\uff09\u548c\u4f5c\u4e1a\u53cd\u9988\uff0c\u7ef4\u6301\u5176\u826f\u597d\u7684\u5b66\u4e60\u4f53\u9a8c\u548c\u793e\u7fa4\u5f52\u5c5e\u611f\u3002\n    3.  **\u8f6c\u5316\u94fa\u57ab**\uff1a\u5728\u7528\u6237\u4e3b\u52a8\u95ee\u53ca\u540e\u671f\u8bfe\u7a0b\u65f6\uff0c\u53ef\u8be6\u7ec6\u4ecb\u7ecd\u4e0d\u540c\u8bfe\u7a0b\uff08\u5982\u7a0b\u5927\u3001\u67cf\u51b0\uff09\u7684\u7279\u70b9\u3001\u9002\u5408\u4eba\u7fa4\u53ca\u6210\u679c\u6848\u4f8b\uff0c\u5e2e\u52a9\u5176\u6839\u636e\u81ea\u8eab\u5174\u8da3\u548c\u65f6\u95f4\u505a\u51fa\u7406\u6027\u9009\u62e9\uff0c**\u907f\u514d\u6025\u8feb\u63a8\u9500**\u3002\n    4.  **\u98ce\u9669\u76d1\u63a7**\uff1a\u5173\u6ce8\u5176\u65f6\u95f4\u5b89\u6392\u53d8\u5316\uff0c\u82e5\u51fa\u73b0\u957f\u671f\u65e0\u6cd5\u8ddf\u4e0a\u8fdb\u5ea6\u7684\u60c5\u51b5\uff0c\u9700\u4e3b\u52a8\u5173\u6000\uff0c\u63d0\u4f9b\u7075\u6d3b\u5b66\u4e60\u65b9\u6848\u3002\n\n{\"core_type\": \"T5 \u5174\u8da3\u9a71\u52a8\u63a2\u7d22\u8005\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u5de9\u56fa\u5174\u8da3\uff0c\u5f15\u5bfc\u957f\u671f\u89c4\u5212\"}";
        document.getElementById('content').innerHTML = marked.parse(markdownText);
