        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676233645 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-13 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u559c\u64ad\u5eb7\u5eb7\u3001\u7c7d\u83f2\uff08\u5b98\u65b9\u62db\u52df\u5b98\uff09\u3001\u503e\u4e16\u6c89\u6d6e\uff08\u73ed\u4e3b\u4efb\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad/\u914d\u97f3\u8bfe\u7a0b\uff08\u6500\u767b\u8ba1\u5212\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u4ec5\u8be2\u95ee\u4ef7\u683c\uff0c\u672a\u900f\u9732\u652f\u4ed8\u65b9\u5f0f\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4e2d\uff08\u788e\u7247\u5316\u62fc\u51d1\uff09** \u2014 \u7528\u6237\u81ea\u8ff0\u4e3a\u4e0a\u73ed\u65cf\uff0c\u6bcf\u5929\u67093-4\u5c0f\u65f6\u4e1a\u4f59\u65f6\u95f4\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** \u2014 \u7528\u6237\u4ec5\u5728\u6700\u540e\u9636\u6bb5\u6709\u7b80\u77ed\u4e92\u52a8\uff0c\u524d\u671f\u5747\u4e3a\u9500\u552e\u5355\u5411\u63a8\u9001\uff0c\u52a8\u673a\u3001\u8fc7\u5f80\u7ecf\u5386\u3001\u6297\u538b\u6027\u7b49\u5173\u952e\u7ef4\u5ea6\u4fe1\u606f\u4e25\u91cd\u4e0d\u8db3\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u76ee\u6807\u662f\u201c\u81ea\u6211\u63d0\u5347/\u4ef7\u503c\u53d8\u73b0\u201d\uff0c\u8868\u660e\u5176\u52a8\u673a\u662f\u201c\u80fd\u529b\u63d0\u5347\u201d\u4e0e\u201c\u8d5a\u94b1\u201d\u7684\u6df7\u5408\u4f53\uff0c\u5e76\u975e\u7eaf\u7cb9\u4e3a\u51e0\u5929\u5185\u63d0\u73b0\u7684\u6781\u901f\u53d8\u73b0\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u81ea\u6211\u63d0\u5347/\u4ef7\u503c\u53d8\u73b0\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 \u4fe1\u606f\u4e0d\u8db3\u3002\u4f5c\u4e3a\u4e0a\u73ed\u65cf\uff0c\u6709\u7a33\u5b9a\u6536\u5165\u6765\u6e90\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u7ecf\u6d4e\u72b6\u51b5\u53ca\u8bfe\u7a0b\u652f\u4ed8\u80fd\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 \u7528\u6237\u81ea\u8ff0\u4e3a\u4e0a\u73ed\u65cf\uff0c\u6bcf\u5929\u67093-4\u5c0f\u65f6\u4e1a\u4f59\u65f6\u95f4\uff0c\u5177\u5907\u5b66\u4e60\u7684\u57fa\u7840\u65f6\u95f4\u6761\u4ef6\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u4e0d\u8db3] \u2014 \u5b8c\u5168\u672a\u63d0\u53ca\uff0c\u5b58\u5728\u6f5c\u5728\u98ce\u9669\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u4fe1\u606f\u4e0d\u8db3]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u672a\u5728\u6c9f\u901a\u4e2d\u8868\u73b0\u51fa\u4efb\u4f55\u60c5\u7eea\u6ce2\u52a8\u6216\u5bf9\u56f0\u96be\u7684\u63cf\u8ff0\uff0c\u65e0\u6cd5\u5224\u65ad\u5176\u6297\u538b\u80fd\u529b\u548c\u60c5\u7eea\u4f9d\u8d56\u7a0b\u5ea6\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u65e0\u76f4\u63a5\u8bc1\u636e\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u4f5c\u4e3a\u4e0a\u73ed\u65cf\uff0c\u5bfb\u6c42\u201c\u81ea\u6211\u63d0\u5347\u201d\u548c\u201c\u4ef7\u503c\u53d8\u73b0\u201d\uff0c\u6df1\u5c42\u9700\u6c42\u53ef\u80fd\u662f\u5bf9\u73b0\u6709\u804c\u4e1a\u53d1\u5c55\u6216\u6536\u5165\u6c34\u5e73\u7684\u4e0d\u5b89\u5168\u611f\uff08\u5b89\u5168\u9700\u6c42\uff09\uff0c\u4ee5\u53ca\u5e0c\u671b\u901a\u8fc7\u638c\u63e1\u65b0\u6280\u80fd\u83b7\u5f97\u793e\u4f1a\u8ba4\u53ef\u548c\u5c0a\u91cd\uff08\u5c0a\u91cd\u9700\u6c42\uff09\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u63d0\u4f9b\u4e00\u6761\u6e05\u6670\u3001\u53ef\u5b9e\u73b0\u7684\u201c\u6280\u80fd\u53d8\u73b0\u201d\u8def\u5f84\uff0c\u5e76\u7ed9\u4e88\u9636\u6bb5\u6027\u6b63\u53cd\u9988\uff0c\u8ba9\u4ed6\u611f\u53d7\u5230\u201c\u88ab\u770b\u89c1\u201d\u548c\u201c\u88ab\u80af\u5b9a\u201d**\uff0c\u4ece\u800c\u6ee1\u8db3\u5176\u5b89\u5168\u611f\u548c\u5c0a\u91cd\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** \u2014 \u52a8\u673a\u660e\u786e\uff08\u53d8\u73b0+\u63d0\u5347\uff09\uff0c\u6709\u57fa\u7840\u65f6\u95f4\u8d44\u6e90\uff0c\u4f46\u4fe1\u606f\u4e0d\u8db3\u5bfc\u81f4\u98ce\u9669\u672a\u77e5\uff0c\u9700\u8c28\u614e\u89c2\u5bdf\u3002 |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u578b** \u2014 \u6838\u5fc3\u8bc9\u6c42\u662f\u201c\u4ef7\u503c\u53d8\u73b0\u201d\uff0c\u76ee\u6807\u5bfc\u5411\u660e\u786e\uff0c\u5bf9\u6295\u8d44\u56de\u62a5\u6709\u9884\u671f\u3002 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5c5e\u53cd\u5bf9\u7b49\u7ea2\u7ebf\u4fe1\u606f\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4e2d | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u4f5c\u4e3a\u4e0a\u73ed\u65cf\uff0c\u82e5\u5927\u989d\u652f\u51fa\u672a\u4e0e\u5bb6\u4eba\u6c9f\u901a\uff0c\u5b58\u5728\u9690\u60a3\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4e2d | \u6bcf\u59293-4\u5c0f\u65f6\u770b\u4f3c\u5145\u88d5\uff0c\u4f46\u82e5\u5de5\u4f5c\u7e41\u5fd9\u6216\u8bfe\u7a0b\u96be\u5ea6\u8d85\u51fa\u9884\u671f\uff0c\u6613\u4ea7\u751f\u79ef\u538b\u548c\u632b\u8d25\u611f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4fe1\u606f\u4e0d\u8db3** | \u672a\u8868\u73b0\u51fa\u60c5\u7eea\u5316\u7279\u5f81\uff0c\u4f46\u9700\u8b66\u60d5\u201c\u6c89\u9ed8\u578b\u201d\u632b\u8d25\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | **\u4f5c\u4e3a\u5178\u578b\u7684T4\u641e\u94b1\u7ed3\u679c\u578b\u7528\u6237\uff0c\u5bf9\u53d8\u73b0\u901f\u5ea6\u548c\u91d1\u989d\u6709\u660e\u786e\u671f\u5f85\u3002\u82e5\u5b66\u4e60\u521d\u671f\uff08\u5982\u5f00\u8bfe\u540e2-4\u5468\uff09\u672a\u770b\u5230\u4efb\u4f55\u53d8\u73b0\u5e0c\u671b\u6216\u63a5\u5355\u8def\u5f84\u4e0d\u6e05\u6670\uff0c\u6781\u6613\u56e0\u201c\u6536\u76ca\u843d\u5dee\u201d\u800c\u66b4\u6012\u9000\u8d39\u3002** |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468\uff08\u7b2c\u4e00\u4efd\u4f5c\u4e1a\u63d0\u4ea4\u540e\u6216\u9996\u6b21\u63a5\u5355\u5c1d\u8bd5\u5931\u8d25\u65f6\uff09**\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c[\u7528\u6237\u6635\u79f0]\uff0c\u770b\u5230\u4f60\u62a5\u540d\u65f6\u5199\u7684\u2018\u81ea\u6211\u63d0\u5347/\u4ef7\u503c\u53d8\u73b0\u2019\uff0c\u6211\u7279\u522b\u7406\u89e3\u3002\u54b1\u4eec\u4e0a\u73ed\u65cf\u65f6\u95f4\u5b9d\u8d35\uff0c\u6bcf\u4e00\u5206\u6295\u5165\u90fd\u5e0c\u671b\u6709\u56de\u62a5\u3002\u63a5\u4e0b\u6765\u7684\u5b66\u4e60\uff0c\u6211\u4f1a\u5e2e\u4f60\u628a\u2018\u53d8\u73b0\u2019\u8fd9\u4e2a\u76ee\u6807\u62c6\u89e3\u6210\u6bcf\u4e00\u6b65\u53ef\u6267\u884c\u7684\u5c0f\u4efb\u52a1\uff0c\u8ba9\u4f60\u6bcf\u5468\u90fd\u80fd\u770b\u5230\u81ea\u5df1\u7684\u8fdb\u6b65\u548c\u79bb\u2018\u8d5a\u94b1\u2019\u66f4\u8fd1\u4e00\u70b9\u3002\u8fc7\u7a0b\u4e2d\u6709\u4efb\u4f55\u5361\u70b9\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4eec\u4e00\u8d77\u89e3\u51b3\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5feb\u901f\u63a5\u5355\u7ebf**\u3011\u2014 \u6838\u5fc3\u6ee1\u8db3\u5176\u201c\u4ef7\u503c\u53d8\u73b0\u201d\u7684\u8feb\u5207\u9700\u6c42\uff0c\u4f18\u5148\u6559\u6388\u53ef\u76f4\u63a5\u7528\u4e8e\u8bd5\u97f3\u3001\u63a5\u5355\u7684\u786c\u6838\u6280\u5de7\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T4\u7528\u6237\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010**\u786c\u6838\u5b9e\u5e72\u5305**\u3011\uff0c\u5373\u63d0\u4f9b\u660e\u786e\u7684\u63a5\u5355\u6e20\u9053\u3001\u771f\u5b9e\u7684\u6d3e\u5355\u673a\u4f1a\uff08\u54ea\u6015\u662f\u5c0f\u5355\uff09\u548c\u7cbe\u51c6\u76841v1\u8bd5\u97f3\u6307\u5bfc\uff0c\u7528\u201c\u770b\u5f97\u89c1\u7684\u7ed3\u679c\u201d\u7a33\u4f4f\u4ed6\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9T4\u7528\u6237\u7a7a\u8c08\u5174\u8da3\u3001\u60c5\u6000\u6216\u957f\u671f\u4e3b\u4e49**\uff0c\u5fc5\u987b\u7d27\u6263\u201c\u53d8\u73b0\u201d\u548c\u201c\u7ed3\u679c\u201d\u3002\n    2. **\u7edd\u4e0d\u5728\u521d\u671f\u753b\u4e0d\u5207\u5b9e\u9645\u7684\u5927\u997c**\uff08\u5982\u201c\u5b66\u5b8c\u6708\u5165\u8fc7\u4e07\u201d\uff09\uff0c\u5e94\u7ba1\u7406\u9884\u671f\uff0c\u5f3a\u8c03\u201c\u4ece\u8d5a\u5230\u7b2c\u4e00\u7b14\u5c0f\u94b1\u5f00\u59cb\u201d\u3002\n    3. **\u907f\u514d\u5e03\u7f6e\u8fc7\u4e8e\u62bd\u8c61\u3001\u4e0e\u63a5\u5355\u65e0\u5173\u7684\u4f5c\u4e1a**\uff0c\u6240\u6709\u7ec3\u4e60\u5c3d\u91cf\u5bfc\u5411\u6700\u7ec8\u7684\u8bd5\u97f3\u6216\u4f5c\u54c1\u4ea7\u51fa\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u9996\u6b21\u53d8\u73b0\u76ee\u6807\u8fbe\u6210\u524d\u8fdb\u884c\u5927\u989d\u5347\u5355**\u3002\u53ef\u8003\u8651\u5728\u5176\u6210\u529f\u63a5\u5355\u540e\uff0c\u63a8\u8350500\u5143\u4ee5\u5185\u7684\u5fae\u5347\u5355\uff08\u5982\u8fdb\u9636\u914d\u97f3\u6280\u5de7\u8bfe\uff09\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u81ea\u6211\u63d0\u5347/\u4ef7\u503c\u53d8\u73b0\u201d\n2. > \u201c\u4e0a\u73ed\u65cf\u201d\n3. > \u201c\u6bcf\u59293-4\u5c0f\u65f6\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T4\u641e\u94b1\u7ed3\u679c\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u7ecf\u6d4e\u4fdd\u969c\u4e0e\u793e\u4f1a\u5c0a\u91cd**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u5728\u5f00\u8425\u521d\u671f\u5c31\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u6267\u884c\u7684\u53d8\u73b0\u8def\u5f84\uff0c\u5e76\u7528\u5fae\u5c0f\u4f46\u771f\u5b9e\u7684\u201c\u7ed3\u679c\u201d\uff08\u5982\u4e00\u6b21\u8bd5\u97f3\u673a\u4f1a\u3001\u4e00\u7b14\u5c0f\u989d\u7a3f\u8d39\uff09\u6301\u7eed\u5582\u517b\u5176\u4fe1\u5fc3\uff0c\u4e25\u9632\u201c\u6536\u76ca\u843d\u5dee\u201d**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168/\u5c0a\u91cd\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf+\u786c\u6838\u5b9e\u5e72\u5305\"}\n```";
