    <script>
        const markdownText = "# AI\u77ed\u89c6\u9891\u8bfe\u7a0b\u5b66\u5458\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u7f3a\u4e4f\u652f\u4ed8\u91d1\u989d\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u3001\u5177\u4f53\u804c\u4e1a\u6536\u5165\u3001\u8be6\u7ec6\u65f6\u95f4\u6295\u5165\u627f\u8bfa\u7b49\u4fe1\u606f\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u4e2d\u4f4e**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u80af\u5b9a\u662f\u53d8\u73b0\u5440\u201d\uff0c\u5e76\u63d0\u53ca\u201c\u6ca1\u6cd5\u53d8\u73b0\u5b66\u518d\u591a\u4e5f\u5403\u4e0d\u9971\u996d\u201d\uff0c\u663e\u793a\u5f3a\u70c8\u7684\u529f\u5229\u6027\u53d8\u73b0\u9a71\u52a8\u3002\u4f46\u5b58\u5728\u5bf9\u201c\u5272\u97ed\u83dc\u201d\u7684\u62c5\u5fe7\uff0c\u52a8\u673a\u4e2d\u6df7\u6742\u4e86\u4e0d\u4fe1\u4efb\u4e0e\u8bd5\u63a2\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u4e2d\u4f4e**\u3002\u7528\u6237\u4e3a30\u5c81\u53a8\u5e08\uff08\u201c\u70e7\u83dc\u7684\u201d\uff09\uff0c\u804c\u4e1a\u80cc\u666f\u4e0eAI\u521b\u4f5c\u5173\u8054\u5ea6\u4f4e\u3002\u81ea\u79f0\u201c\u4e86\u89e3\u8fc7\u201dAI\u5de5\u5177\uff08\u8c46\u5305\u3001\u5373\u68a6\uff09\u5e76\u201c\u81ea\u5df1\u505a\u4e86\uff0c\u4e0d\u8fc7\u90fd\u662f\u76ae\u6bdb\u201d\uff0c\u8868\u660e\u6709\u521d\u6b65\u63a2\u7d22\u610f\u613f\u548c\u6781\u57fa\u7840\u7684\u6570\u5b57\u6280\u80fd\uff0c\u4f46\u7f3a\u4e4f\u76f8\u5173\u7ecf\u9a8c\u3001\u4eba\u8109\u4e0e\u77e5\u8bc6\u50a8\u5907\u3002**\u65f6\u95f4\u8d44\u6e90\u672a\u77e5**\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u4e2d\u4f4e**\u3002\u7528\u6237\u6709\u4e3b\u52a8\u5b66\u4e60\u884c\u4e3a\uff08\u5b8c\u6210\u4f5c\u4e1a\u3001\u5206\u4eab\u4f5c\u54c1\uff09\uff0c\u4f46**\u5173\u952e\u96f7\u533a\uff1a\u5b58\u5728\u660e\u786e\u7684\u8d1f\u9762\u53c2\u7167\uff08\u5bf9\u8c61\u88ab\u5272\u97ed\u83dc\u7ecf\u5386\uff09**\uff0c\u5bfc\u81f4\u5bf9\u627f\u8bfa\uff08\u5c24\u5176\u662f\u201c\u5185\u90e8\u6e20\u9053\u201d\uff09\u9ad8\u5ea6\u6000\u7591\uff0c\u53cd\u590d\u8bd5\u63a2\uff08\u201c\u5fc3\u91cc\u6ca1\u8c31\u201d\uff09\u3002\u9500\u552e\u63d0\u53ca\u201c\u968f\u65f6\u652f\u6301\u9000\u8d39\u201d\u540e\uff0c\u7528\u6237\u8ffd\u95ee\u201c\u4e0d\u5f00\u53d1\u7968\u2026\u4f60\u9000\u4e48\u201d\uff0c\u663e\u793a\u5176\u9632\u5fa1\u6027\u5f3a\uff0c\u4fe1\u4efb\u5efa\u7acb\u56f0\u96be\uff0c\u6613\u56e0\u9884\u671f\u4e0d\u7b26\u800c\u653e\u5f03\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 (\u652f\u4ed8\u6838\u67e5)**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u63d0\u4f9b\u4e86\u624b\u673a\u53f7\u5e76\u5b8c\u6210\u62a5\u540d\u6d41\u7a0b\u3002\n*   **\u6b65\u9aa41.5 (\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5)**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u4ec5\u63d0\u53ca\u201c\u5bf9\u8c61\u201d\u6709\u88ab\u5272\u97ed\u83dc\u7ecf\u5386\uff0c\u672a\u8868\u660e\u672c\u6b21\u62a5\u540d\u662f\u5426\u9700\u4e0e\u5bb6\u4eba\u5546\u8bae\u6216\u53d7\u5176\u5f71\u54cd\u3002**\u9700\u6838\u67e5**\u3002\n*   **\u6b65\u9aa41 (\u52a8\u673a\u7eaf\u5ea6)**: **M- (\u529f\u5229\u9a71\u52a8\uff0c\u4f46\u6709\u7591\u8651)**\u3002\u53d8\u73b0\u9700\u6c42\u660e\u786e\uff0c\u4f46\u4fe1\u4efb\u57fa\u7840\u8584\u5f31\u3002\n*   **\u6b65\u9aa42 (\u8d44\u6e90\u5e95\u5ea7)**: **R- (\u57fa\u7840\u8584\u5f31)**\u3002\u804c\u4e1a\u80cc\u666f\u3001\u6280\u80fd\u50a8\u5907\u4e0e\u76ee\u6807\u8d5b\u9053\uff08AI\u77ed\u89c6\u9891/\u77ed\u5267\uff09\u5339\u914d\u5ea6\u4f4e\uff0c\u5b66\u4e60\u66f2\u7ebf\u53ef\u80fd\u9661\u5ced\u3002\n*   **\u6b65\u9aa43 (\u5fc3\u7406\u5f39\u6027)**: **E- (\u9632\u5fa1\u6027\u5f3a\uff0c\u6613\u53d7\u632b)**\u3002\u53d7\u8fc7\u5f80\u8d1f\u9762\u7ecf\u5386\u5f71\u54cd\uff0c\u5bf9\u201c\u8d44\u6e90\u627f\u8bfa\u201d\u654f\u611f\uff0c\u9884\u671f\u7ba1\u7406\u96be\u5ea6\u9ad8\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**: **C\u7c7b (\u52a8\u673a\u4e0d\u7eaf/\u8d44\u6e90\u532e\u4e4f/\u5fc3\u7406\u8106\u5f31) - \u9ad8\u98ce\u9669\u7fa4\u4f53**\u3002\u7528\u6237\u5904\u4e8e\u201c\u9ad8\u671f\u671b\u3001\u4f4e\u4fe1\u4efb\u3001\u57fa\u7840\u5f31\u201d\u7684\u77db\u76fe\u72b6\u6001\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**: **T7 \u529f\u5229\u8bd5\u63a2\u8005**\u3002\n    *   **\u7279\u5f81\u543b\u5408**: \u6838\u5fc3\u8bc9\u6c42\u4e3a\u5feb\u901f\u53d8\u73b0\uff08\u201c\u5403\u4e0d\u9971\u996d\u201d\uff09\uff0c\u5bf9\u884c\u4e1a\u6709\u6d45\u5c42\u4e86\u89e3\u5e76\u81ea\u884c\u5c1d\u8bd5\u8fc7\uff08\u201c\u76ae\u6bdb\u201d\uff09\uff0c\u4f46\u5bf9\u673a\u6784\u627f\u8bfa\u6781\u5ea6\u4e0d\u4fe1\u4efb\uff08\u201c\u5272\u97ed\u83dc\u7684\u592a\u591a\u4e86\u201d\uff09\uff0c\u652f\u4ed8\u540e\u7acb\u5373\u5bfb\u6c42\u4fdd\u969c\uff08\u53d1\u7968\u3001\u9000\u8d39\u8ffd\u95ee\uff09\u3002\u5b66\u4e60\u884c\u52a8\u529b\u5c1a\u53ef\uff0c\u4f46\u5fc3\u7406\u9632\u7ebf\u9ad8\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u98ce\u9669\u7b49\u7ea7**: **\u9ad8**\u3002\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u9884\u671f\u7ba1\u7406\u5931\u63a7**: **\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa\u201c\u5185\u90e8\u5546\u5355\u201d\u3001\u201c\u6d77\u5916\u5546\u5355100-300\u201d\u3001\u201c\u5feb\u901f\u8d5a\u94b1\u201d\uff0c\u4e0e\u7528\u6237\u201c\u6015\u88ab\u5272\u97ed\u83dc\u201d\u7684\u62c5\u5fe7\u5f62\u6210\u5de8\u5927\u5f20\u529b\u3002\n    2.  **\u80fd\u529b\u8fdb\u5ea6\u9519\u914d**: **\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u57fa\u7840\u8584\u5f31\uff08\u53a8\u5e08\u804c\u4e1a\uff09\uff0c\u76ee\u6807\uff08\u63a5\u5355\u3001\u505a\u77ed\u5267\uff09\u6240\u9700\u6280\u80fd\u590d\u5408\u5ea6\u9ad8\uff0c\u6781\u6613\u5728\u5b66\u4e60\u4e2d\u671f\u56e0\u632b\u8d25\u611f\u800c\u653e\u5f03\u3002\n    3.  **\u8d44\u6e90\u627f\u8bfa\u672a\u5151\u73b0**: **\u6781\u9ad8\u98ce\u9669**\u3002**\u5173\u952e\u96f7\u533a\uff1a\u7528\u6237\u56e0\u5bf9\u8c61\u7ecf\u5386\uff0c\u5bf9\u201c\u5185\u90e8\u6e20\u9053\u201d\u9ad8\u5ea6\u654f\u611f**\u3002\u9500\u552e\u627f\u8bfa\u201c\u7b2c2\u5468\u5f00\u901a\u8d44\u6e90\u201d\uff0c\u82e5\u540e\u7eed\u8d44\u6e90\u8d28\u91cf\u3001\u6570\u91cf\u6216\u63a5\u5165\u95e8\u69db\u4e0d\u7b26\u9884\u671f\uff0c\u5c06\u662f\u9996\u8981\u9000\u8d39\u7406\u7531\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9**: **\u4e2d\u98ce\u9669**\u3002\u5bf9\u8c61\u5df2\u6709\u8d1f\u9762\u7ecf\u5386\uff0c\u53ef\u80fd\u5bf9\u7528\u6237\u5b66\u4e60\u6301\u6000\u7591\u6216\u53cd\u5bf9\u6001\u5ea6\uff0c\u5f71\u54cd\u5176\u575a\u6301\u3002\n    5.  **\u65f6\u95f4\u51b2\u7a81**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\n    6.  **\u7ecf\u6d4e\u538b\u529b**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u652f\u4ed8\u91d1\u989d\u672a\u77e5\u3002\n    7.  **\u4ea7\u54c1\u4f53\u9a8c\u4e0d\u4f73**: **\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5df2\u8868\u73b0\u51fa\u5bf9\u6d41\u7a0b\uff08\u5c0f\u7a0b\u5e8f\u9875\u9762\uff09\u7684\u56f0\u60d1\uff0c\u82e5\u540e\u7eed\u8bfe\u7a0b\u3001\u670d\u52a1\u4f53\u9a8c\u6709\u7455\u75b5\uff0c\u4f1a\u52a0\u5267\u4e0d\u4fe1\u4efb\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u9500\u552e\u884c\u4e3a**:\n    *   **\u5408\u89c4\u70b9**: \u63d0\u53ca\u201c\u652f\u6301\u9000\u8d39\u201d\u3001\u201c\u5f00\u53d1\u7968\u201d\u3001\u201c\u9605\u8bfb\u534f\u8bae\u201d\uff0c\u63d0\u4f9b\u4e86\u57fa\u672c\u4fdd\u969c\u4fe1\u606f\u3002\n    *   **\u98ce\u9669\u70b9**:\n        1.  **\u8fc7\u5ea6\u627f\u8bfa**: \u9891\u7e41\u4f7f\u7528\u201c\u5feb\u901f\u8d5a\u94b1\u201d\u3001\u201c\u7ea2\u5229\u671f\u201d\u3001\u201c\u5f3a\u529b\u5f15\u64ce\u201d\u7b49\u8bcd\u6c47\uff0c\u6e32\u67d3\u201c\u5b66\u5b8c\u5373\u53ef\u63a5\u9ad8\u4ef7\u5546\u5355\u201d\u7684\u9884\u671f\uff0c**\u5b58\u5728\u5938\u5927\u5ba3\u4f20\u98ce\u9669**\u3002\n        2.  **\u5229\u7528\u7126\u8651\u4e0e\u4ece\u4f17**: \u5f3a\u8c03\u201c\u771f\u6b63\u5229\u7528AI\u8d5a\u94b1\u7684\u4eba\u5be5\u5be5\u65e0\u51e0\u201d\u3001\u201c\u540c\u5b66\u90fd\u76f4\u63a5\u62a5\u540d\u4e86\u201d\uff0c\u5236\u9020\u7a00\u7f3a\u548c\u4ece\u4f17\u538b\u529b\u3002\n        3.  **\u672a\u5145\u5206\u98ce\u9669\u63d0\u793a**: \u672a\u9488\u5bf9\u7528\u6237\u201c\u96f6\u57fa\u7840\u201d\u548c\u201c\u53a8\u5e08\u201d\u80cc\u666f\uff0c\u5ba2\u89c2\u8bf4\u660e\u5b66\u4e60\u96be\u5ea6\u3001\u53d8\u73b0\u5468\u671f\u53ca\u5e02\u573a\u7ade\u4e89\u60c5\u51b5\u3002\n*   **\u4f26\u7406\u9632\u7ebf**: **\u90e8\u5206\u5931\u5b88**\u3002\u9500\u552e\u4fa7\u91cd\u4e8e\u6253\u6d88\u7528\u6237\u5bf9\u201c\u5272\u97ed\u83dc\u201d\u7684\u987e\u8651\uff08\u901a\u8fc7\u627f\u8bfa\u9000\u8d39\u3001\u5c55\u793a\u6848\u4f8b\uff09\uff0c\u4f46\u672a\u5bf9\u5176\u4e0d\u5207\u5b9e\u9645\u7684\u201c\u5feb\u901f\u53d8\u73b0\u201d\u9884\u671f\u8fdb\u884c\u6709\u6548\u6821\u6b63\u548c\u964d\u6e29\uff0c\u4e3a\u540e\u7eed\u670d\u52a1\u57cb\u4e0b\u91cd\u5927\u9690\u60a3\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**: **\u504f\u5dee**\u3002\u7528\u6237\u5f3a\u70c8\u7684\u3001\u6025\u8feb\u7684\u53d8\u73b0\u9700\u6c42\u4e0e\u8bfe\u7a0b\u9700\u8981\u7cfb\u7edf\u5b66\u4e60\u3001\u79ef\u7d2f\u624d\u80fd\u53d8\u73b0\u7684\u7279\u6027\u5b58\u5728\u6839\u672c\u77db\u76fe\u3002\u7528\u6237\u672c\u8d28\u9700\u8981\u7684\u662f\u201c\u96f6\u95e8\u69db\u517c\u804c\u6e20\u9053\u201d\uff0c\u800c\u975e\u201c\u6280\u80fd\u57f9\u8bad\u201d\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **24h\u5185\u7d27\u6025\u542f\u52a8\u9884\u671f\u7ba1\u7406\u4e0e\u4fe1\u4efb\u91cd\u5efa**\u3002\n*   **\u5177\u4f53\u884c\u52a8\u6307\u5357**:\n    1.  **\u9996\u7535\u6c9f\u901a (\u9ec4\u91d124\u5c0f\u65f6)**: \u73ed\u4e3b\u4efb\u5fc5\u987b\u7acb\u5373\u7535\u8bdd\u8054\u7cfb\uff0c\u6838\u5fc3\u76ee\u6807\u4e0d\u662f\u6b22\u8fce\uff0c\u800c\u662f **\u201c\u6821\u51c6\u9884\u671f\u201d**\u3002\u9700\u5766\u8bda\u8bf4\u660e\uff1a\u2460AI\u6280\u80fd\u5b66\u4e60\u5230\u7a33\u5b9a\u63a5\u5355\u7684\u5e73\u5747\u5468\u671f\uff1b\u2461\u201c\u5185\u90e8\u8d44\u6e90\u201d\u7684\u6027\u8d28\uff08\u662f\u673a\u4f1a\u6c60\u800c\u975e\u4fdd\u5e95\u5206\u914d\uff09\u3001\u51c6\u5165\u6807\u51c6\u4e0e\u7ade\u4e89\u60c5\u51b5\uff1b\u2462\u524d\u671f\u53ef\u80fd\u4ece\u4f4e\u5355\u4ef7\u3001\u7b80\u5355\u4efb\u52a1\u5f00\u59cb\u3002\n    2.  **\u6316\u6398\u771f\u5b9e\u80cc\u666f**: \u4e86\u89e3\u5176\u5de5\u4f5c\u65f6\u95f4\u3001\u53ef\u7528\u4e8e\u5b66\u4e60\u7684\u56fa\u5b9a\u65f6\u6bb5\u3001\u5bb6\u5ead\uff08\u7279\u522b\u662f\u5bf9\u8c61\uff09\u5bf9\u6b64\u6b21\u6295\u5165\u7684\u6001\u5ea6\u4e0e\u652f\u6301\u5ea6\u3002\n    3.  **\u5efa\u7acb\u201c\u5c0f\u76ee\u6807-\u6b63\u53cd\u9988\u201d\u5faa\u73af**: \u5728\u8bfe\u7a0b\u521d\u671f\uff0c\u4e3a\u5176\u8bbe\u5b9a\u6781\u6613\u8fbe\u6210\u7684\u3001\u4e0e\u53d8\u73b0\u5173\u8054\u7684\u5fae\u4efb\u52a1\uff08\u5982\u5b8c\u6210\u4e00\u4e2a\u8868\u60c5\u5305\u3001\u751f\u6210\u4e00\u7ec4\u5934\u50cf\uff09\uff0c\u5e76\u5c1d\u8bd5\u5bf9\u63a5\u6781\u4f4e\u95e8\u69db\u7684\u4f53\u9a8c\u6027\u5546\u5355\uff08\u5982\u6709\uff09\uff0c\u54ea\u6015\u62a5\u916c\u6781\u4f4e\uff0c\u65e8\u5728\u5feb\u901f\u5efa\u7acb\u201c\u5b66\u6709\u6240\u5f97\u201d\u7684\u4fe1\u4efb\u611f\u3002\n    4.  **\u98ce\u9669\u9884\u6848**: \u63d0\u524d\u4e0e\u98ce\u63a7\u540c\u6b65\u8be5\u5b66\u5458\u60c5\u51b5\uff0c\u51c6\u5907\u5e94\u5bf9\u5176\u53ef\u80fd\u56e0\u201c\u8d44\u6e90\u672a\u8fbe\u9884\u671f\u201d\u800c\u63d0\u51fa\u7684\u65e9\u671f\u9000\u8d39\u8bc9\u6c42\u3002\u6240\u6709\u5173\u4e8e\u8d44\u6e90\u3001\u6536\u76ca\u7684\u627f\u8bfa\uff0c\u52a1\u5fc5\u7559\u6709\u4e66\u9762\u8bb0\u5f55\uff08\u5982\u7fa4\u516c\u544a\u3001\u8d44\u6599\u5305\u8bf4\u660e\uff09\uff0c\u907f\u514d\u53e3\u5934\u627f\u8bfa\u3002\n    5.  **\u957f\u671f\u5173\u7cfb**: \u5c06\u5176\u5217\u4e3a\u91cd\u70b9\u8ddf\u8fdb\u5bf9\u8c61\uff0c\u4fdd\u6301\u9ad8\u9891\u3001\u771f\u8bda\u7684\u6c9f\u901a\uff0c\u53ca\u65f6\u758f\u5bfc\u5176\u56e0\u5b66\u4e60\u96be\u5ea6\u6216\u63a5\u5355\u4e0d\u987a\u4ea7\u751f\u7684\u7126\u8651\u548c\u6000\u7591\uff0c\u907f\u514d\u5176\u8d1f\u9762\u60c5\u7eea\u7d2f\u79ef\u7206\u53d1\u3002\n\n{\"core_type\": \"T7 \u529f\u5229\u8bd5\u63a2\u8005\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"product_match\": \"\u504f\u5dee\", \"action\": \"24h\u5185\u7d27\u6025\u542f\u52a8\u9884\u671f\u7ba1\u7406\u4e0e\u4fe1\u4efb\u91cd\u5efa\"}";
