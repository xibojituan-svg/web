    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677158235\u7684\u7528\u6237\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677158235 (\u6635\u79f0\uff1a\u8317\u5929\ud83c\udf3d) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e-\u7c7d\u83f2(\u5468\u4e1c\u82b1) -> \u73ed\u4e3b\u4efb-\u5fc3\u60a6\u541b\u516e(\u5355\u601d\u7ef4) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u9a6c\u62c9\u96c5\u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff082\u4e2a\u6708\uff0c3980\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7591\u4f3c\u5168\u6b3e\u652f\u4ed8**\uff08\u672a\u63d0\u53ca\u5206\u671f/\u501f\u6b3e\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u5b9d\u5988+\u6253\u5de5\u65cf\uff0c\u9700\u517c\u987e\u5bb6\u5ead\u4e0e\u5de5\u4f5c\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u5ea6\uff0c\u9700\u73ed\u4e3b\u4efb\u540e\u7eed\u6478\u5e95\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u4e92\u52a8\u79ef\u6781\uff0c\u6709\u660e\u786e\u5b66\u4e60\u89c4\u5212\u548c\u53cd\u9988\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e\uff0c\u4f46\u6001\u5ea6\u52a1\u5b9e\uff0c\u613f\u610f\u4ece\u57fa\u7840\u5f00\u59cb\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08\u6211\u660e\u5929\u4e0a\u5348\u7ed9\u60a8\u56de\u590d\u554a[\u5496\u5561][\u73ab\u7470]\u201d (\u51b3\u7b56\u8c28\u614e) > \u201c\u8001\u5e08\u597d\uff01\u6211\u521a\u63a5\u89e6\uff0c\u6ca1\u6709\u592a\u5b8c\u6574\u7684\u89c4\u5212\u65b9\u5411\uff0c\u521d\u671f\u5148\u7ec3\u597d\u65c1\u767d\u5427\uff0c\u628a\u64ad\u97f3\u7684\u57fa\u7840\u6253\u597d\uff0c\u518d\u8003\u8651\u5176\u4ed6\u5427[\u5472\u7259][\u5496\u5561][\u73ab\u7470]\u201d (\u89c4\u5212\u6e05\u6670\uff0c\u4e0d\u6025\u4e8e\u6c42\u6210)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u652f\u4ed83980\u5143\u8bfe\u7a0b\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\uff0c\u4f46\u9700\u517c\u987e\u5bb6\u5ead\u5f00\u652f\uff0c\u975e\u9ad8\u51c0\u503c\u4eba\u7fa4\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u5b9d\u5988+\u6253\u5de5\u65cf\uff0c\u65f6\u95f4\u788e\u7247\u5316\uff0c\u4f46\u80fd\u575a\u6301\u542c\u8bfe\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\uff0c\u662f\u6f5c\u5728\u98ce\u9669\u70b9\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8 (7-8\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u9500\u552e\u5bc6\u96c6\u8ddf\u8fdb\uff0c\u4fdd\u6301\u793c\u8c8c\u548c\u8282\u594f\uff1b\u80fd\u6e05\u6670\u8868\u8fbe\u81ea\u5df1\u7684\u5b66\u4e60\u89c4\u5212\uff08\u5148\u6253\u597d\u57fa\u7840\uff09\uff0c\u8868\u73b0\u51fa\u8f83\u5f3a\u7684\u81ea\u4e3b\u6027\u548c\u89c4\u5212\u80fd\u529b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08\u62b1\u6b49\u5bb6\u91cc\u6765\u5ba2\u4eba\u5566[\u5496\u5561][\u73ab\u7470]\u201d (\u793c\u8c8c\u89e3\u91ca\u7f3a\u5e2d\uff0c\u672a\u8868\u73b0\u51fa\u7126\u8651) > \u201c\u8001\u5e08\u597d\uff01\u6211\u521a\u63a5\u89e6\uff0c\u6ca1\u6709\u592a\u5b8c\u6574\u7684\u89c4\u5212\u65b9\u5411\uff0c\u521d\u671f\u5148\u7ec3\u597d\u65c1\u767d\u5427\uff0c\u628a\u64ad\u97f3\u7684\u57fa\u7840\u6253\u597d\uff0c\u518d\u8003\u8651\u5176\u4ed6\u5427[\u5472\u7259][\u5496\u5561][\u73ab\u7470]\u201d (\u6709\u4e3b\u89c1\uff0c\u80fd\u81ea\u6211\u89c4\u5212\uff0c\u4e0d\u76f2\u4ece)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 (Safety Needs)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u4f5c\u4e3a\u201c\u5b9d\u5988+\u6253\u5de5\u65cf\u201d\uff0c\u9762\u4e34\u5bb6\u5ead\u4e0e\u5de5\u4f5c\u7684\u53cc\u91cd\u538b\u529b\uff0c\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u6709\u58f0\u6280\u80fd\u83b7\u5f97\u4e00\u4efd**\u7a33\u5b9a\u7684\u526f\u4e1a\u6536\u5165**\uff0c\u4ee5\u589e\u5f3a\u5bb6\u5ead\u7ecf\u6d4e\u5b89\u5168\u611f\u548c\u4e2a\u4eba\u804c\u4e1a\u4fdd\u969c\uff0c\u62b5\u5fa1\u672a\u6765\u4e0d\u786e\u5b9a\u6027\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u4e0e\u8def\u5f84\u611f**\u3002\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u6267\u884c\u7684\u5b66\u4e60\u8def\u5f84\u548c\u63a5\u5355\u53d8\u73b0\u901a\u9053\uff0c\u8ba9\u5979\u770b\u5230\u201c\u53ea\u8981\u6309\u90e8\u5c31\u73ed\uff0c\u5c31\u80fd\u83b7\u5f97\u56de\u62a5\u201d\u7684\u5e0c\u671b\uff0c\u4ece\u800c\u83b7\u5f97\u5b89\u5168\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u52a8\u673a\u4e2d\u7b49\u3001\u8d44\u6e90\u4e2d\u7b49\u3001\u5f39\u6027\u9ad8\u3001\u52a1\u5b9e\u89c4\u5212) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u8a00\u8bba\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n**\u3010\u5224\u5b9a\u6811\u63a8\u6f14\u3011**\uff1a\n1.  **\u652f\u4ed8\u6838\u67e5**\uff1a\u672a\u63d0\u53ca\u5206\u671f/\u501f\u8d37\uff0c**\u672a\u89e6\u53d1C2\u88c5B\u7c7b\u62e6\u622a**\u3002\n2.  **\u4e09\u8f74\u8bc4\u5206**\uff1a\u52a8\u673a(5-6\u5206)\uff0c\u8d44\u6e90(5-6\u5206)\uff0c\u5f39\u6027(7-8\u5206)\u3002\n3.  **\u5224\u5b9a\u6811\u8def\u5f84**\uff1a\u52a8\u673a\u22655\u5206 \u2192 \u8fdb\u5165\u201c\u4e2d\u9ad8\u52a8\u673a\u7cbe\u5206\u201d \u2192 \u5fc3\u7406\u5f39\u6027\u22657\u5206 \u2192 \u8fdb\u5165\u201c\u9ad8\u5f39\u6027\u901a\u9053\u201d \u2192 \u672a\u51fa\u73b0T1/T3/T7\u7684\u5178\u578b\u4fe1\u53f7 \u2192 **\u9ed8\u8ba4\u5f52\u7c7b\u4e3aT2\u4f4e\u8c03\u8001\u9ec4\u725b**\u3002\n4.  **ABCD\u6620\u5c04**\uff1aT2 \u2192 **B\u7c7b**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u82e5\u62a5\u540d\u4e3a\u9690\u7792\u5bb6\u4eba\u6216\u52a8\u7528\u5bb6\u5ead\u5907\u7528\u91d1\uff0c\u540e\u671f\u53ef\u80fd\u56e0\u5bb6\u5ead\u538b\u529b\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u65f6\u95f4\u788e\u7247\u5316\u4e25\u91cd\uff0c\u82e5\u8bfe\u7a0b\u8282\u594f\u8fc7\u5feb\u3001\u4f5c\u4e1a\u91cf\u8fc7\u5927\uff0c\u53ef\u80fd\u56e0\u65e0\u6cd5\u8ddf\u4e0a\u8fdb\u5ea6\u800c\u4ea7\u751f\u81ea\u8d23\u3001\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u81ea\u6211\u8c03\u8282\u80fd\u529b\u5f3a\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u632b\u6298\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u6838\u5fc3\u98ce\u9669\u3002\u82e5\u5b66\u4e602-3\u4e2a\u6708\u540e\uff0c\u63a5\u5355\u8def\u5f84\u4e0d\u6e05\u6670\u6216\u8fdf\u8fdf\u65e0\u6cd5\u83b7\u5f97\u7b2c\u4e00\u7b14\u6536\u5165\uff0c\u53ef\u80fd\u56e0\u201c\u5b89\u5168\u9700\u6c42\u201d\u672a\u6ee1\u8db3\u800c\u4ea7\u751f\u5f3a\u70c8\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c60-90\u5929**\uff08\u53732\u4e2a\u6708\u8bfe\u7a0b\u5373\u5c06\u7ed3\u675f\uff0c\u82e5\u672a\u8fbe\u6210\u521d\u6b65\u53d8\u73b0\u9884\u671f\u65f6\uff09\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u8317\u5929\u4f60\u597d\uff0c\u770b\u5230\u4f60\u4e3a\u81ea\u5df1\u89c4\u5212\u4e86\u2018\u5148\u6253\u597d\u65c1\u767d\u57fa\u7840\u2019\u7684\u6e05\u6670\u8def\u5f84\uff0c\u771f\u7684\u975e\u5e38\u68d2\uff01\u5f88\u591a\u5b66\u5458\u5c31\u662f\u7f3a\u4e86\u8fd9\u4efd\u8e0f\u5b9e\u3002\u54b1\u4eec\u7684\u8bfe\u7a0b\u5c31\u662f\u4e3a\u4f60\u8fd9\u6837\u6709\u89c4\u5212\u3001\u80af\u5b9e\u5e72\u7684\u4eba\u8bbe\u8ba1\u7684\u3002\u63a5\u4e0b\u6765\u4e24\u4e2a\u6708\uff0c\u6211\u4f1a\u966a\u4f60\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u628a\u57fa\u7840\u6253\u7262\u3002\u8fc7\u7a0b\u4e2d\u6709\u4efb\u4f55\u65f6\u95f4\u5b89\u6392\u4e0a\u7684\u56f0\u96be\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4eec\u4e00\u8d77\u8c03\u6574\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** (\u4ea7\u54c1\u7ebfA)\u3002\u5339\u914d\u5176\u52a1\u5b9e\u3001\u6c42\u7a33\u3001\u5e0c\u671b\u638c\u63e1\u786c\u6280\u80fd\u7684\u9700\u6c42\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\u7684\u7279\u70b9\uff0c\u8865\u5145**\u3010\u65f6\u95f4\u7ba1\u7406\u8f85\u52a9\u5305\u3011**\uff08\u5982\u63d0\u4f9b\u5f55\u64ad\u8bfe\u91cd\u70b9\u5207\u7247\u3001\u7075\u6d3b\u4f5c\u4e1a\u63d0\u4ea4\u673a\u5236\uff09\u3002**\u8c28\u614e\u89c2\u5bdf\uff0c\u82e5\u5176\u540e\u671f\u5c55\u73b0\u51fa\u9886\u5bfc\u529b\uff08\u5982\u4e3b\u52a8\u5e2e\u52a9\u540c\u5b66\uff09\uff0c\u53ef\u8003\u8651\u6302\u8f7d\u3010D\u6a21\u5757\uff1a\u9ec4\u888d\u52a0\u8eab\u63d0\u5e72\u3011**\uff0c\u6fc0\u53d1\u5176\u6210\u4e3a\u6df7\u5408\u4f533\u53f7\uff08\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u5728\u5979\u6253\u597d\u57fa\u7840\u524d\uff0c\u8fc7\u5ea6\u63a8\u9500\u9ad8\u9636\u8bfe\u7a0b\u6216\u4ea4\u53c9\u9500\u552e\uff0c\u5f15\u53d1\u77e5\u8bc6\u7126\u8651\u30022. \u7528\u201c\u51e0\u5929\u66b4\u5bcc\u201d\u7684\u8bdd\u672f\u523a\u6fc0\u5979\uff0c\u7834\u574f\u5176\u52a1\u5b9e\u7684\u9884\u671f\u30023. \u5ffd\u89c6\u5176\u65f6\u95f4\u788e\u7247\u5316\u7684\u7279\u70b9\uff0c\u5e03\u7f6e\u8fc7\u4e8e\u5bc6\u96c6\u3001\u8017\u65f6\u7684\u4efb\u52a1\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u524d\u671f\u4e25\u7981\u5347\u5355**\u3002\u5f85\u5176\u57fa\u7840\u624e\u5b9e\u3001\u5b8c\u6210\u7b2c\u4e00\u5355\u53d8\u73b0\u3001\u5efa\u7acb\u5145\u5206\u4fe1\u4efb\u540e\uff0c\u53ef\u57fa\u4e8e\u5176\u6280\u672f\u7cbe\u8fdb\u9700\u6c42\uff0c\u81ea\u7136\u63a8\u4ecb\u9ad8\u9636\u8bfe\u7a0b\u6216\u786c\u4ef6\u8bbe\u5907\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u8001\u5e08\u597d\uff01\u6211\u521a\u63a5\u89e6\uff0c\u6ca1\u6709\u592a\u5b8c\u6574\u7684\u89c4\u5212\u65b9\u5411\uff0c\u521d\u671f\u5148\u7ec3\u597d\u65c1\u767d\u5427\uff0c\u628a\u64ad\u97f3\u7684\u57fa\u7840\u6253\u597d\uff0c\u518d\u8003\u8651\u5176\u4ed6\u5427[\u5472\u7259][\u5496\u5561][\u73ab\u7470]\u201d **(\u5178\u578bT2\u52a1\u5b9e\u89c4\u5212\uff0c\u4e0d\u5192\u8fdb)**\n2. > \u201c\u8001\u5e08\u62b1\u6b49\u5bb6\u91cc\u6765\u5ba2\u4eba\u5566[\u5496\u5561][\u73ab\u7470]\u201d **(\u793c\u8c8c\u3001\u60c5\u7eea\u7a33\u5b9a\uff0c\u9ad8\u5f39\u6027\u8868\u73b0)**\n3. > \u201c\u8001\u5e08\u6211\u660e\u5929\u4e0a\u5348\u7ed9\u60a8\u56de\u590d\u554a[\u5496\u5561][\u73ab\u7470]\u201d **(\u51b3\u7b56\u8c28\u614e\uff0c\u6709\u4e3b\u89c1\uff0c\u975e\u51b2\u52a8\u578b\u6d88\u8d39)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e00\u4efd\u7a33\u5b9a\u7684\u526f\u4e1a\u6536\u5165\uff0c\u63d0\u5347\u5bb6\u5ead\u7ecf\u6d4e\u5b89\u5168\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u5b9e\u73b0\u7684\u53d8\u73b0\u8def\u5f84\uff0c\u5e76\u5c0a\u91cd\u5176\u788e\u7247\u5316\u65f6\u95f4\uff0c\u907f\u514d\u56e0\u8fdb\u5ea6\u8ddf\u4e0d\u4e0a\u6216\u6536\u76ca\u5ef6\u8fdf\u800c\u5d29\u76d8\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\"}\n```";
