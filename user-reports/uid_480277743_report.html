    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a (UID: 480277743)\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u9ad8)**: \u5174\u8da3\u9a71\u52a8\u4e0e\u804c\u4e1a\u63a2\u7d22\u5e76\u5b58\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u914d\u97f3/\u6709\u58f0\u6f14\u64ad\u7684\u6d53\u539a\u5174\u8da3\uff08\u4e3b\u52a8\u753b\u672c\u3001\u627e\u540c\u5b66\u642d\u97f3\u3001\u8be2\u95ee\u7248\u6743\u4e66\u4f7f\u7528\uff09\uff0c\u5e76\u5df2\u6709\u521d\u6b65\u53d8\u73b0\u5c1d\u8bd5\uff08\u517c\u804c\u3001AI\u5c0f\u8bf4\u63a8\u6587\uff09\u3002**\u4f46\u5b58\u5728\u201c\u5174\u8da3\u63a2\u7d22\u201d\u4e0e\u201c\u5feb\u901f\u53d8\u73b0\u201d\u7684\u6df7\u5408\u52a8\u673a**\uff0c\u5bf9\u8bfe\u7a0b\u80fd\u5e26\u6765\u7684\u76f4\u63a5\u6536\u76ca\uff08\u5982\u63a5\u5355\uff09\u6709\u671f\u5f85\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d\u7b49)**: **\u65f6\u95f4\u8d44\u6e90\u4e25\u91cd\u788e\u7247\u5316\u4e14\u88ab\u6324\u5360**\uff08\u9700\u7b49\u5b69\u5b50\u7761\u89c9\u540e\u5728\u5395\u6240\u5b66\u4e60\u3001\u56e0\u5e26\u5a03/\u627e\u5de5\u4f5c/\u642c\u5bb6\u7b49\u4e8b\u52a1\u9891\u7e41\u8bf7\u5047/\u770b\u56de\u653e\uff09\u3002\u5177\u5907\u57fa\u7840\u5b66\u4e60\u80fd\u529b\uff08\u8bbe\u8ba1\u4e13\u4e1a\u80cc\u666f\uff0c\u80fd\u81ea\u5b66PS/CAD/AU\u8f6f\u4ef6\uff09\uff0c\u6709\u521d\u6b65\u8bbe\u5907\u8d2d\u4e70\u610f\u5411\u4f46\u53d7\u642c\u5bb6\u7b49\u73b0\u5b9e\u56e0\u7d20\u5ef6\u8fdf\u3002\u7ecf\u6d4e\u80fd\u529b\u672a\u77e5\uff0c\u4f46\u80fd\u652f\u4ed8\u5f53\u524d\u8bfe\u7a0b\u53ca\u540e\u7eed\u52a0\u62a5\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u652f\u4ed8\u5f39\u6027\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u9ad8)**: **\u575a\u97e7\u6027\u7a81\u51fa\uff0c\u81ea\u4e3b\u89e3\u51b3\u95ee\u9898\u80fd\u529b\u5f3a**\u3002\u9762\u5bf9AI\u68c0\u6d4b\u4e0d\u901a\u8fc7\uff08\u666e\u901a\u8bdd\u3001\u5f55\u97f3\u73af\u5883\uff09\u80fd\u53cd\u590d\u5c1d\u8bd5\u6570\u5341\u6b21\u76f4\u81f3\u6210\u529f\uff1b\u5b66\u4e60\u6001\u5ea6\u79ef\u6781\uff0c\u4e3b\u52a8\u5bfb\u6c42\u8d44\u6e90\uff08\u8bf7\u73ed\u73ed\u534f\u8c03CV\u642d\u97f3\u3001\u8be2\u95ee\u80cc\u666f\u97f3\u4e50\u6765\u6e90\uff09\uff1b\u80fd\u63a5\u53d7\u632b\u6298\uff08\u8bd5\u97f3\u672a\u4e2d\uff09\uff0c\u5fc3\u6001\u8f83\u4e3a\u4e50\u89c2\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: \u5df2\u652f\u4ed8\u5f53\u524d\u8bfe\u7a0b\uff0c\u5e76\u4e8e4\u67088\u65e5\u6210\u529f\u52a0\u62a5\u540e\u671f\u73ed\uff0893\u671f\uff09\u3002**\u652f\u4ed8\u884c\u4e3a\u5df2\u53d1\u751f\uff0c\u8fdb\u5165\u6b63\u5f0f\u670d\u52a1\u6d41\u7a0b**\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: \u7528\u6237\u4e3a**\u5b9d\u5988**\uff0c\u804a\u5929\u4e2d\u9891\u7e41\u63d0\u53ca\u201c\u5c0f\u5b69\u201d\u3001\u201c\u5973\u513f\u201d\u3001\u201c\u5e26\u5a03\u201d\uff0c\u663e\u793a\u5bb6\u5ead\u80b2\u513f\u8d23\u4efb\u91cd\u3002\u4f46\u8d2d\u8bfe\u51b3\u7b56\u7531\u672c\u4eba\u505a\u51fa\uff0c\u672a\u63d0\u53ca\u9700\u4e0e\u914d\u5076\u6216\u5bb6\u4eba\u5546\u8bae\uff0c**\u62e5\u6709\u8f83\u9ad8\u7684\u4e2a\u4eba\u6d88\u8d39\u51b3\u7b56\u6743**\u3002\n*   **\u6b65\u9aa42/3/4 - \u7efc\u5408\u5224\u5b9a**: **B\u7c7b\u7528\u6237 (\u9ad8\u610f\u613f-\u4e2d\u8d44\u6e90\u578b)**\u3002\u5b66\u4e60\u610f\u613f\u5f3a\u70c8\uff0c\u884c\u52a8\u529b\u9ad8\uff0c\u4f46\u65f6\u95f4\u8d44\u6e90\u662f\u6700\u5927\u74f6\u9888\u3002\u975e\u51b2\u52a8\u6d88\u8d39\uff0c\u52a0\u62a5\u51b3\u7b56\u7ecf\u8fc7\u6743\u8861\uff08\u62c5\u5fc3\u7cbe\u529b\u4e0d\u591f\uff09\uff0c\u5e76\u5728\u9500\u552e\u5f15\u5bfc\u4e0b\uff08\u627f\u8bfa\u53ef\u5ef6\u671f\u8fdb\u9636\u73ed\uff09\u5b8c\u6210\u8f6c\u5316\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n**T4 \u52a1\u5b9e\u63a2\u7d22\u8005**\u3002\n*   **\u7279\u5f81\u543b\u5408**\uff1a\u6709\u660e\u786e\u5174\u8da3\uff08\u914d\u97f3\uff09\uff0c\u5e76\u5df2\u5f00\u59cb\u5b9e\u8df5\u63a2\u7d22\uff08\u753b\u672c\u3001\u8bd5\u97f3\u3001\u63a5\u517c\u804c\uff09\u3002\u5b66\u4e60\u76ee\u7684\u517c\u5177\u5174\u8da3\u4e0e\u804c\u4e1a\u53ef\u80fd\uff0c**\u6ce8\u91cd\u5b9e\u7528\u6027\u4e0e\u6280\u80fd\u63d0\u5347**\uff08\u5173\u5fc3\u7248\u6743\u4e66\u4f7f\u7528\u3001\u8bbe\u5907\u63a8\u8350\u3001\u540e\u671f\u6280\u672f\uff09\u3002\u80fd\u514b\u670d\u56f0\u96be\u575a\u6301\u5b66\u4e60\uff0c\u4f46**\u53d7\u73b0\u5b9e\u751f\u6d3b\uff08\u80b2\u513f\u3001\u5de5\u4f5c\uff09\u62c9\u626f\u4e25\u91cd**\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u98ce\u9669\u7b49\u7ea7\uff1a**\u4f4e**)\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**: \u98ce\u9669**\u4f4e**\u3002\u7528\u6237\u5df2\u83b7\u5f97\u521d\u6b65\u6b63\u53cd\u9988\uff08\u666e\u901a\u8bdd\u6d4b\u8bd5\u901a\u8fc7\u3001\u88ab\u5938\u58f0\u97f3\u9002\u5408\u6717\u8bf5\uff09\uff0c\u4e14\u80fd\u611f\u77e5\u81ea\u8eab\u8fdb\u6b65\u3002\n    2.  **\u65f6\u95f4\u7cbe\u529b\u51b2\u7a81**: \u98ce\u9669**\u4e2d**\u3002**\u8fd9\u662f\u6838\u5fc3\u6f5c\u5728\u98ce\u9669\u70b9**\u3002\u7528\u6237\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\uff0c\u968f\u7740\u8bfe\u7a0b\u6df1\u5165\u548c\u4f5c\u4e1a\u91cf\u589e\u52a0\uff0c\u53ef\u80fd\u56e0\u65e0\u6cd5\u517c\u987e\u800c\u4ea7\u751f\u538b\u529b\u6216\u5026\u6020\u3002\n    3.  **\u7ecf\u6d4e\u538b\u529b**: \u98ce\u9669**\u4f4e**\u3002\u5df2\u8fde\u7eed\u4ed8\u8d39\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u56f0\u96be\u3002\n    4.  **\u8bfe\u7a0b\u8d28\u91cf\u5f02\u8bae**: \u98ce\u9669**\u4f4e**\u3002\u4e0e\u73ed\u73ed\u4e92\u52a8\u826f\u597d\uff0c\u79ef\u6781\u63d0\u95ee\uff0c\u672a\u8868\u8fbe\u4e0d\u6ee1\u3002\n    5.  **\u9500\u552e\u627f\u8bfa\u672a\u5151\u73b0**: \u98ce\u9669**\u4f4e**\u3002\u9500\u552e\u627f\u8bfa\u201c\u5ef6\u671f\u8fdb\u9636\u73ed\u201d\u9700\u540e\u7eed\u8ddf\u8fdb\uff0c\u4f46\u76ee\u524d\u65e0\u8bc1\u636e\u663e\u793a\u8fc7\u5ea6\u627f\u8bfa\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9**: \u98ce\u9669**\u4f4e**\u3002\u51b3\u7b56\u6743\u5728\u5df1\uff0c\u4f46\u9700\u5173\u6ce8\u957f\u671f\u65f6\u95f4\u6295\u5165\u662f\u5426\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u3002\n    7.  **\u5e73\u53f0/\u670d\u52a1\u4f53\u9a8c**: \u98ce\u9669**\u4f4e**\u3002\u5bf9\u73ed\u73ed\u670d\u52a1\u6ee1\u610f\u5ea6\u9ad8\uff0c\u4e92\u52a8\u9891\u7e41\u4e14\u6b63\u5411\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u9500\u552e\u884c\u4e3a**: \u57fa\u672c\u5408\u89c4\u3002\u9500\u552e\u901a\u8fc7\u89e3\u51b3\u7528\u6237\u5177\u4f53\u95ee\u9898\uff08\u5e2e\u52a9\u901a\u8fc7\u68c0\u6d4b\u3001\u534f\u8c03\u642d\u97f3\uff09\u5efa\u7acb\u4fe1\u4efb\uff0c\u5728\u52a0\u62a5\u8f6c\u5316\u65f6\uff0c**\u4ee5\u201c\u79d1\u5b66\u5b66\u4e60\u8def\u5f84\u89c4\u5212\u201d\u4e3a\u5207\u5165\u70b9\uff0c\u5e76\u63d0\u4f9b\u4e86\u201c\u5ef6\u671f\u8fdb\u9636\u73ed\u201d\u7684\u89e3\u51b3\u65b9\u6848\u6765\u6253\u6d88\u7528\u6237\u5bf9\u65f6\u95f4\u51b2\u7a81\u7684\u987e\u8651**\uff0c\u5c5e\u4e8e\u9488\u5bf9\u6027\u4fc3\u5355\uff0c\u672a\u53d1\u73b0\u5938\u5927\u627f\u8bfa\u6216\u6050\u5413\u5f0f\u9500\u552e\u3002\n*   **\u4f26\u7406\u98ce\u9669**: **\u8f83\u4f4e**\u3002\u4e3b\u8981\u98ce\u9669\u5728\u4e8e\u9700\u6301\u7eed\u5173\u6ce8\u8be5\u5b9d\u5988\u7684**\u65f6\u95f4\u7cbe\u529b\u8d1f\u8377**\uff0c\u907f\u514d\u56e0\u8bfe\u7a0b\u4efb\u52a1\u52a0\u91cd\u5176\u751f\u6d3b\u538b\u529b\uff0c\u5bfc\u81f4\u5065\u5eb7\u6216\u5bb6\u5ead\u5173\u7cfb\u95ee\u9898\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**: **\u5339\u914d**\u3002\u7528\u6237\u5bf9\u5f53\u524d\u6280\u80fd\u63d0\u5347\u8def\u5f84\uff08\u7cbe\u82f1\u2192\u540e\u671f\u2192\u8fdb\u9636\uff09\u63a5\u53d7\u5ea6\u9ad8\uff0c\u4e14\u4e2a\u4eba\u6280\u80fd\uff08\u8f6f\u4ef6\u5b66\u4e60\u80fd\u529b\uff09\u4e0e\u540e\u671f\u8bfe\u7a0b\u5339\u914d\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **\u534f\u52a9\u5236\u5b9a\u4e2a\u6027\u5316\u3001\u5f39\u6027\u7684\u5b66\u4e60\u8ba1\u5212**\u3002\n*   **\u5177\u4f53\u884c\u52a8\u6307\u5357**:\n    1.  **\u65f6\u95f4\u7ba1\u7406\u652f\u6301**: \u4e3b\u52a8\u4e0e\u7528\u6237\u6c9f\u901a\uff0c\u6839\u636e\u5176\u5e26\u5a03\u3001\u5de5\u4f5c\u7684\u8282\u594f\uff0c\u5171\u540c\u89c4\u5212\u4e00\u4e2a**\u5f39\u6027\u3001\u53ef\u6301\u7eed**\u7684\u5b66\u4e60\u548c\u4f5c\u4e1a\u63d0\u4ea4\u65f6\u95f4\u8868\uff0c\u5141\u8bb8\u5176\u5229\u7528\u788e\u7247\u65f6\u95f4\uff0c\u51cf\u8f7b\u5176\u201c\u8d76\u4f5c\u4e1a\u201d\u7684\u7126\u8651\u3002\n    2.  **\u9884\u671f\u7ba1\u7406**: \u660e\u786e\u544a\u77e5\u540e\u671f\u8bfe\u7a0b\u7684\u4f5c\u4e1a\u91cf\u548c\u6240\u9700\u65f6\u95f4\uff0c\u5e2e\u52a9\u5176\u5efa\u7acb\u5408\u7406\u9884\u671f\u3002\u5f3a\u8c03\u201c\u5b8c\u6210\u6bd4\u5b8c\u7f8e\u91cd\u8981\u201d\uff0c\u80af\u5b9a\u5176\u5728\u56f0\u96be\u6761\u4ef6\u4e0b\u575a\u6301\u5b66\u4e60\u7684\u52aa\u529b\u3002\n    3.  **\u8d44\u6e90\u94fe\u63a5**: \u9274\u4e8e\u5176\u8f83\u5f3a\u7684\u81ea\u4e3b\u5b66\u4e60\u80fd\u529b\uff0c\u53ef\u63d0\u4f9b\u66f4\u591a**\u81ea\u52a9\u5f0f\u5b66\u4e60\u8d44\u6e90**\uff08\u5982AU\u5feb\u6377\u952e\u56fe\u8868\u3001\u97f3\u6548\u7d20\u6750\u5e93\u94fe\u63a5\uff09\uff0c\u51cf\u5c11\u5176\u56e0\u7b49\u5f85\u7b54\u7591\u800c\u803d\u8bef\u7684\u65f6\u95f4\u3002\n    4.  **\u60c5\u611f\u652f\u6301\u4e0e\u63d0\u9192**: \u6301\u7eed\u7ed9\u4e88\u9f13\u52b1\uff0c\u8ba4\u53ef\u5176\u201c\u5b9d\u5988+\u5b66\u4e60\u8005\u201d\u7684\u53cc\u91cd\u89d2\u8272\u4e0d\u6613\u3002\u540c\u65f6\uff0c**\u5173\u6ce8\u5176\u4f5c\u606f\u5065\u5eb7**\uff0c\u63d0\u9192\u52ff\u8fc7\u5ea6\u71ac\u591c\u3002\n    5.  **\u5c65\u7ea6\u8ddf\u8fdb**: **\u786e\u4fdd\u201c\u8fdb\u9636\u73ed\u5ef6\u671f\u201d\u627f\u8bfa\u7684\u987a\u5229\u6267\u884c**\uff0c\u5e76\u5728\u540e\u671f\u8bfe\u7a0b\u4e2d\u6bb5\uff0c\u63d0\u524d\u6c9f\u901a\u8fdb\u9636\u73ed\u7684\u5f00\u8bfe\u65f6\u95f4\uff0c\u65b9\u4fbf\u5176\u63d0\u524d\u5b89\u6392\u3002\n\n{\"core_type\": \"T4 \u52a1\u5b9e\u63a2\u7d22\u8005\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u534f\u52a9\u5236\u5b9a\u5f39\u6027\u5b66\u4e60\u8ba1\u5212\"}";
