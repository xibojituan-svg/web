        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676873901 (\u661f\u60f3\u662f\u6a59) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-02 \u81f3 2026-03-19 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u76ae\u76ae(\u590f\u6893\u8f69) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66/AI\u914d\u97f3\u57f9\u8bad\u8bfe\u7a0b (\u5df2\u8d2d\u8bfe\uff0c\u5e76\u8ffd\u52a0\u8d2d\u4e70SE2200\u8bbe\u5907) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u5bb6\u5ead\u5171\u540c\u51b3\u7b56**\u3002\u7528\u6237\u4e2a\u4eba\u79ef\u84c4\u5df2\u8017\u5c3d\uff0c\u8bbe\u5907\u8d2d\u4e70\u9700\u4e08\u592b\u540c\u610f\u5e76\u51fa\u8d44\u3002\u975e\u501f\u8d37\uff0c\u4f46\u8d44\u91d1\u652f\u914d\u6743\u53d7\u9650\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u5168\u804c\u5988\u5988\uff0c\u72ec\u81ea\u5e26\u5a03\uff08\u5c0f\u7537\u5b69\uff09\uff0c\u65f6\u95f4\u88ab\u4e25\u91cd\u5207\u5272\uff0c\u4f9d\u8d56\u5b69\u5b50\u7761\u89c9\u540e\u7684\u6df1\u591c\u65f6\u6bb5\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u5df2\u62a5\u5907\u5e76\u652f\u6301**\u3002\u4e08\u592b\u77e5\u60c5\u5e76\u652f\u6301\uff0c\u4f46\u7528\u6237\u56e0\u65e0\u4e2a\u4eba\u6536\u5165\u800c\u81ea\u5351\uff0c\u62c5\u5fc3\u201c\u6ca1\u56de\u672c\u201d\u4f1a\u5931\u53bb\u8bdd\u8bed\u6743\u3002\u5a46\u5a46\u6709\u7ecf\u6d4e\u63a7\u5236\u6b32\uff0c\u4e0d\u652f\u6301\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u7528\u6237\u4e3b\u52a8\u3001\u6df1\u5ea6\u5730\u5206\u4eab\u4e86\u4e2a\u4eba\u80cc\u666f\u3001\u8d22\u52a1\u72b6\u51b5\u3001\u5bb6\u5ead\u5173\u7cfb\u548c\u5fc3\u7406\u72b6\u6001\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u201c\u60f3\u7834\u5c40\u6240\u4ee5\u5b66\u4e86\u8fd9\u4e2a\u201d\uff0c\u6709\u5f3a\u70c8\u7684\u7ecf\u6d4e\u72ec\u7acb\u548c\u627e\u56de\u8bdd\u8bed\u6743\u7684\u8bc9\u6c42\uff08\u7ed3\u679c\u5bfc\u5411\uff09\u3002\u4f46\u540c\u65f6\uff0c\u5979\u4e5f\u8868\u73b0\u51fa\u5bf9\u793e\u7fa4\u3001\u5b66\u4e60\u8fc7\u7a0b\u672c\u8eab\u7684\u6295\u5165\u548c\u4eab\u53d7\uff08\u201c\u771f\u4e3a\u4f60\u4eec\u5f00\u5fc3\u201d\u3001\u201c\u611f\u8c22\u5927\u5bb6\u90fd\u5728\u64cd\u5fc3\u6211\u201d\uff09\uff0c\u5e76\u975e\u7eaf\u7cb9\u8ffd\u6c42\u6781\u901f\u53d8\u73b0\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5c31\u662f\u60f3\u7834\u5c40\u6240\u4ee5\u5b66\u4e86\u8fd9\u4e2a\u201d > \u201c\u4e07\u4e00\u6ca1\u56de\u672c \u611f\u89c9\u8ddf\u5bb6\u91cc\u4eba\u8bf4\u8bdd\u66f4\u6ca1\u8bdd\u8bed\u6743\u4e86[\u53f9\u6c14]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u5bb6\u5ead\u6709\u7ecf\u6d4e\u57fa\u7840\uff08\u201c\u4e0d\u662f\u5bb6\u91cc\u6ca1\u94b1\u201d\uff09\uff0c\u4f46\u7528\u6237\u4e2a\u4eba\u65e0\u79ef\u84c4\uff0c\u8d44\u91d1\u9700\u4e08\u592b\u5ba1\u6279\uff0c\u81ea\u4e3b\u6027\u4f4e\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e** \u2014 **\u6838\u5fc3\u77ed\u677f**\u3002\u5168\u804c\u5e26\u5a03\uff0c\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\uff0c\u5b66\u4e60\u9700\u89c1\u7f1d\u63d2\u9488\uff0c\u7cbe\u529b\u88ab\u80b2\u513f\u5927\u91cf\u6d88\u8017\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4e2d** \u2014 \u4e08\u592b\u53e3\u5934\u652f\u6301\uff08\u201c\u60f3\u62a5\u5c31\u62a5\u5427\uff0c\u628a\u94b1\u8f6c\u7ed9\u6211\u4e86\u201d\uff09\uff0c\u4f46\u5b58\u5728\u5a46\u5a46\u7684\u538b\u529b\u548c\u7528\u6237\u81ea\u8eab\u56e0\u65e0\u6536\u5165\u4ea7\u751f\u7684\u81ea\u5351\u5fc3\u7406\uff0c\u5f62\u6210\u5185\u90e8\u60c5\u611f\u6d88\u8017\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a**\u3002\u7528\u6237\u60c5\u7eea\u654f\u611f\uff0c\u6613\u9677\u5165\u81ea\u6211\u5426\u5b9a\uff08\u201c\u6211\u81ea\u5351\u4e86\u201d\u3001\u201c\u6389\u8fdb\u8c37\u5e95\u4e86\u201d\uff09\uff0c\u6709\u8f83\u5f3a\u7684\u503e\u8bc9\u548c\u60c5\u611f\u652f\u6301\u9700\u6c42\u3002\u4f46\u5728\u5177\u4f53\u5b66\u4e60\u548c\u6280\u672f\u95ee\u9898\u4e0a\uff08\u5982\u8bbe\u5907\u8c03\u8bd5\uff09\uff0c\u80fd\u4e3b\u52a8\u6c9f\u901a\u3001\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u800c\u975e\u76f4\u63a5\u653e\u5f03\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5fc3\u91cc\u6709\u70b9\u96be\u8fc7\uff0c\u6015\u81ea\u5df1\u505a\u4e0d\u597d\u201d > \u201c\u5b69\u5b50\u95f9\u5f97\u4e0d\u884c\uff0c\u6211\u5148\u4e0d\u5f04\u4e86\uff0c\u665a\u4e0a\u518d\u5f04\u5427\u201d\uff08\u5c55\u793a\u4e86\u73b0\u5b9e\u56f0\u96be\u4e0b\u7684\u5f39\u6027\u8c03\u6574\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 (\u5c0a\u91cd\u4e0e\u5f52\u5c5e)** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u56e0\u751f\u80b2\u548c\u5bb6\u5ead\u727a\u7272\u804c\u4e1a\u540e\uff0c\u5931\u53bb\u7ecf\u6d4e\u72ec\u7acb\uff0c\u5bfc\u81f4\u5728\u5bb6\u5ead\u5185\u90e8\uff08\u5c24\u5176\u662f\u9762\u5bf9\u5a46\u5a46\uff09\u7f3a\u4e4f\u5c0a\u91cd\u548c\u8bdd\u8bed\u6743\uff0c\u81ea\u6211\u4ef7\u503c\u611f\u4e25\u91cd\u8dcc\u843d\u3002** \u5b66\u4e60\u914d\u97f3\u662f\u5979\u8bd5\u56fe\u201c\u91cd\u65b0\u6740\u51fa\u4e00\u6761\u8def\u201d\u3001\u8bc1\u660e\u81ea\u5df1\u3001\u593a\u56de\u5c0a\u91cd\u548c\u5bb6\u5ead\u5730\u4f4d\u7684\u65b9\u5f0f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u8ba4\u53ef\u4e0e\u8d4b\u80fd**\u3002\u5979\u9700\u8981\u7684\u4e0d\u4ec5\u662f\u6280\u80fd\uff0c\u66f4\u662f\u901a\u8fc7\u201c\u88ab\u770b\u89c1\u3001\u88ab\u80af\u5b9a\u3001\u88ab\u9700\u8981\u201d\u6765\u91cd\u5efa\u81ea\u4fe1\u3002\u793e\u7fa4\u4e92\u52a8\u3001\u73ed\u59d4\u89d2\u8272\u3001\u4f5c\u54c1\u88ab\u8868\u626c\u90fd\u80fd\u6781\u5927\u6ee1\u8db3\u5176\u5c0a\u91cd\u4e0e\u5f52\u5c5e\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u52a8\u673a\u4e2d\u7b49\uff0c\u8d44\u6e90\u5e95\u5ea7\u5b58\u5728\u660e\u663e\u77ed\u677f\uff0c\u5fc3\u7406\u5f39\u6027\u4e2d\u7b49\uff0c\u9700\u91cd\u70b9\u6276\u6301\u4e0e\u98ce\u9669\u76d1\u63a7) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u6838\u5fc3\u7279\u5f81\uff1a\u9ad8\u60c5\u611f\u9700\u6c42\u3001\u6613\u81ea\u5351\u3001\u9700\u8981\u6301\u7eed\u7684\u60c5\u7eea\u4ef7\u503c\u704c\u6e89\u548c\u4f4e\u632b\u8d25\u611f\u73af\u5883) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u7b49D\u7c7b\u7ea2\u7ebf\u3002\u5bb6\u5ead\u652f\u6301\u7ed3\u6784\u867d\u6709\u538b\u529b\u4f46\u672a\u7834\u88c2\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u82e5\u5b66\u4e60\u6295\u5165\uff08\u65f6\u95f4\u3001\u7cbe\u529b\uff09\u52a0\u5267\u5bb6\u5ead\u77db\u76fe\uff08\u5982\u56e0\u71ac\u591c\u5b66\u4e60\u5f71\u54cd\u5e26\u5a03\u6216\u592b\u59bb\u5173\u7cfb\uff09\uff0c\u6216\u957f\u671f\u65e0\u6536\u76ca\u5f15\u53d1\u4e08\u592b/\u5a46\u5a46\u8d28\u7591\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u56e0\u5e26\u5a03\u5bfc\u81f4\u65f6\u95f4\u6781\u5ea6\u4e0d\u7a33\u5b9a\uff0c\u65e0\u6cd5\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\uff0c\u4ea7\u751f\u6301\u7eed\u79ef\u538b\u548c\u81ea\u8d23\uff0c\u6700\u7ec8\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u5d29\u6e83\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4e2d** | \u5728\u8bbe\u5907\u8c03\u8bd5\u3001\u8f6f\u4ef6\u5b89\u88c5\u7b49\u5177\u4f53\u6280\u672f\u73af\u8282\u9047\u5230\u632b\u6298\u65f6\uff0c\u53e0\u52a0\u201c\u81ea\u5df1\u5f88\u7b28\u201d\u7684\u81ea\u5351\u5fc3\u7406\uff0c\u53ef\u80fd\u4ea7\u751f\u5f3a\u70c8\u632b\u8d25\u611f\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4f4e** | \u77ed\u671f\u5185\u5bf9\u201c\u63a5\u5355\u53d8\u73b0\u201d\u9884\u671f\u76f8\u5bf9\u7406\u6027\uff08\u201c\u6682\u65f6\u8fd8\u6ca1\u6709\u63a5\u5355\u7684\u80fd\u529b\u6216\u7cbe\u529b\uff0c\u81f3\u5c11\u5148\u5b8c\u6210\u5b66\u4e1a\u201d\uff09\uff0c\u4f46\u957f\u671f\u65e0\u8fdb\u5c55\u4f1a\u52a0\u5267\u81ea\u5351\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-4\u5468\uff0c\u9996\u6b21\u8981\u6c42\u63d0\u4ea4\u590d\u6742\u4f5c\u4e1a\u6216\u53c2\u4e0e\u9ad8\u5f3a\u5ea6\u76f4\u64ad\u8bfe\u65f6**\u3002\u5f53\u5979\u7684\u788e\u7247\u5316\u65f6\u95f4\u65e0\u6cd5\u5e94\u5bf9\u7cfb\u7edf\u5316\u5b66\u4e60\u8981\u6c42\u65f6\uff0c\u5d29\u6e83\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u661f\u60f3\uff0c\u770b\u5230\u4f60\u5728\u7fa4\u91cc\u90a3\u4e48\u70ed\u5fc3\u5e2e\u52a9\u540c\u5b66\uff0c\u771f\u7684\u611f\u89c9\u4f60\u5c31\u50cf\u6211\u4eec\u73ed\u7684\u2018\u5b9a\u6d77\u795e\u9488\u2019\u3002\u5e26\u5a03\u5df2\u7ecf\u8fd9\u4e48\u8f9b\u82e6\u4e86\uff0c\u8fd8\u8fd9\u4e48\u575a\u6301\u5b66\u4e60\uff0c\u8fd9\u4efd\u97e7\u52b2\u7279\u522b\u8ba9\u4eba\u4f69\u670d\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\uff0c\u4f60\u5b8c\u5168\u6309\u81ea\u5df1\u7684\u8282\u594f\u6765\uff0c\u5b69\u5b50\u7761\u4e86\u5b66\u5341\u5206\u949f\u4e5f\u662f\u80dc\u5229\u3002\u4f5c\u4e1a\u4e0d\u8ffd\u6c42\u5b8c\u7f8e\uff0c\u5b8c\u6210\u6bd4\u5b8c\u7f8e\u91cd\u8981\u4e00\u767e\u500d\u3002\u6709\u4efb\u4f55\u5361\u4f4f\u7684\u5730\u65b9\uff0c\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u60f3\u529e\u6cd5\uff0c\u4f60\u7edd\u5bf9\u4e0d\u662f\u4e00\u4e2a\u4eba\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5174\u8da3\u6e38\u4e50\u7ebf**\u3011\u3002\u6838\u5fc3\u76ee\u6807\u662f\u8ba9\u5979\u5728\u4f4e\u538b\u529b\u4e0b\u83b7\u5f97\u5b8c\u6210\u611f\u548c\u793e\u7fa4\u8ba4\u540c\uff0c\u5148\u5efa\u7acb\u5b66\u4e60\u4e60\u60ef\u548c\u81ea\u4fe1\uff0c\u800c\u975e\u5f3a\u63a8\u201c\u5feb\u901f\u63a5\u5355\u201d\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u5305\u62ec\uff1a1\uff09\u5f39\u6027\u4f5c\u4e1a\u63d0\u4ea4\u673a\u5236\uff1b2\uff09\u4e13\u5c5e\u7684\u3001\u975e\u6280\u672f\u6027\u7684\u9f13\u52b1\u8bdd\u672f\u5e93\uff1b3\uff09\u9080\u8bf7\u5176\u62c5\u4efb\u5c0f\u7ec4\u957f\u6216\u6c14\u6c1b\u5b98\uff0c\u8d4b\u4e88\u5176\u201c\u88ab\u9700\u8981\u201d\u7684\u793e\u7fa4\u89d2\u8272\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u5979\u65bd\u52a0\u4f5c\u4e1a\u8fdb\u5ea6\u538b\u529b**\uff0c\u4e25\u7981\u4f7f\u7528\u201c\u843d\u540e\u201d\u3001\u201c\u6293\u7d27\u201d\u7b49\u8bcd\u6c47\u5728\u79c1\u4e0b\u50ac\u4fc3\u8fdb\u5ea6\u3002\n    2. **\u7edd\u4e0d\u8ba9\u5979\u5728\u6280\u672f\u95ee\u9898\u4e0a\u72ec\u81ea\u6323\u624e**\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\uff09\uff0c\u5fc5\u987b\u7b2c\u4e00\u65f6\u95f4\u63d0\u4f9b\u50bb\u74dc\u5f0f\u6307\u5f15\u6216\u76f4\u63a5\u4ee3\u52b3\u3002\n    3. **\u7edd\u4e0d\u5728\u516c\u5f00\u573a\u5408\u6279\u8bc4\u5176\u4f5c\u54c1**\uff0c\u6240\u6709\u53cd\u9988\u4ee5\u79c1\u4fe1\u5f62\u5f0f\u8fdb\u884c\uff0c\u4e14\u5fc5\u987b\u5148\u626c\u540e\u6291\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u73b0\u9636\u6bb5\u4e25\u7981\u4efb\u4f55\u5347\u5355**\u3002\u5979\u7684\u8d44\u6e90\u5e95\u5ea7\uff08\u65f6\u95f4\u3001\u5fc3\u7406\uff09\u65e0\u6cd5\u627f\u53d7\u66f4\u591a\u538b\u529b\uff0c\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u662f\u5c06\u5176\u63a8\u5411\u9000\u8d39\u8fb9\u7f18\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u73b0\u5728\u8fd8\u6ca1\u5b66\u51fa\u4ec0\u4e48\u540d\u5802\uff0c\u8ba9\u6211\u8001\u516c\u638f\u94b1\uff0c\u4ed6\u80af\u5b9a\u4f1a\u8d28\u7591\u201d\n2. > \u201c\u5fc3\u91cc\u6709\u70b9\u96be\u8fc7\uff0c\u6015\u81ea\u5df1\u505a\u4e0d\u597d\u2026\u2026\u56e0\u4e3a\u7ed3\u5a5a\u4e70\u623f\u88c5\u4fee\u4e70\u5bb6\u5177\u751f\u5b9d\u5b9d\u5a18\u5bb6\u90fd\u6ca1\u7ed9\u94b1\uff0c\u6211\u81ea\u5df1\u7684\u79ef\u84c4\u5df2\u7ecf\u7528\u5b8c\u2026\u2026\u662f\u6211\u81ea\u5351\u4e86\u201d\n3. > \u201c\u5b69\u5b50\u95f9\u5f97\u4e0d\u884c\uff0c\u6211\u5148\u4e0d\u5f04\u4e86\uff0c\u665a\u4e0a\u518d\u5f04\u5427\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u5bb6\u5ead\u4e2d\u91cd\u83b7\u5c0a\u91cd\u4e0e\u81ea\u6211\u4ef7\u503c\u8ba4\u540c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u81f4\u7684\u60c5\u611f\u966a\u4f34\u4e0e\u5f39\u6027\u5b66\u4e60\u8def\u5f84\uff0c\u7528\u793e\u7fa4\u8ba4\u53ef\u66ff\u4ee3\u6280\u672f\u65bd\u538b\uff0c\u4e25\u9632\u65f6\u95f4\u5d29\u76d8\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"maslow_need\": \"\u5c0a\u91cd\u9700\u6c42\", \"risk_level\": \"\u4e2d\u9ad8\", \"refund_risk\": \"\u4e2d\u9ad8\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf + \u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\"}\n```";
