    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v3.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 191527335 (\u6635\u79f0\uff1a\u79cb) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u62db\u52df\u5b98\uff08\u66f9\u6d01\uff09\u3001\u73ed\u4e3b\u4efb-\u6d6e\u6c89\uff08\u9648\u78ca\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6500\u767b\u8ba1\u5212\u9ad8\u9636\u7248\uff087380\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u88ab\u8feb\u5206\u671f/\u501f\u6b3e\u9690\u60a3**\uff08\u5148\u4ed83980\uff0c\u9700\u6b21\u65e5\u8865\u4ea43400\uff0c\u4e14\u652f\u4ed8\u8fc7\u7a0b\u51fa\u73b0\u94f6\u884c\u5361\u9650\u989d\u95ee\u9898\uff0c\u8d44\u91d1\u8c03\u52a8\u7d27\u5f20\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u804a\u5929\u672a\u660e\u786e\u63d0\u53ca\u5de5\u4f5c/\u751f\u6d3b\u4f5c\u606f\uff0c\u4ec5\u63d0\u53ca\u201c\u6709\u70b9\u5435\u201d\uff0c\u65e0\u6cd5\u5224\u65ad\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u804a\u5929\u672a\u63d0\u53ca\u5bb6\u4eba\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\uff08\u5173\u952e\u7ef4\u5ea6\u5982\u5bb6\u5ead\u652f\u6301\u3001\u65f6\u95f4\u7cbe\u529b\u3001\u8d44\u91d1\u6765\u6e90\u8be6\u60c5\u7f3a\u5931\uff0c\u5224\u65ad\u98ce\u9669\u6781\u9ad8\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b07\u4f4e\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u7eaf\u4e3a\u51e0\u5929\u5185\u63d0\u73b0\u4fdd\u5e95\u800c\u6765(\u4f4e\u6781\u5371)**\u3002\u7528\u6237\u6838\u5fc3\u8bc9\u6c42\u662f\u5feb\u901f\u63a5\u5355\u53d8\u73b0\uff0c\u5bf9\u5b66\u4e60\u8fc7\u7a0b\u672c\u8eab\u5174\u8da3\u4e00\u822c\uff0c\u6781\u5ea6\u5173\u6ce8\u201c\u80fd\u5426\u63a5\u5230\u5355\u201d\u548c\u201c\u591a\u4e45\u80fd\u8d5a\u94b1\u201d\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u60f3\u901a\u8fc7\u753b\u672c\u5148\u6323\u70b9\u540c\u65f6\u5176\u4ed6\u7684\u4e5f\u5b66\u201d\n  > \u201c\u6211\u60f3\u77e5\u9053\u5177\u4f53\u7684\u5355\u5b50\u591a\u4e0d\u591a\u5c31\u662f\u6211\u771f\u7684\u80fd\u63a5\u5230\u5417\u201d\n  > \u201c\u6211\u6015\u6211\u53bb\u8df3\u63a5\u4e0d\u5230\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u8bc1\u636e\uff1a\u652f\u4ed87380\u5143\u8bfe\u7a0b\u8d39\u9700\u5206\u4e24\u5929\uff08\u5148\u4ed83980\uff0c\u6b21\u65e5\u88653400\uff09\uff0c\u4e14\u652f\u4ed8\u65f6\u51fa\u73b0\u94f6\u884c\u5361\u9650\u989d\u95ee\u9898\uff08\u201c\u4eca\u5929\u8d85\u8fc7\u6700\u5927\u4ea4\u6613\u6b21\u6570\u201d\uff09\uff0c\u8868\u660e\u5176\u6d41\u52a8\u8d44\u91d1\u7d27\u5f20\uff0c\u5927\u989d\u652f\u4ed8\u80fd\u529b\u8106\u5f31\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u65e0\u660e\u786e\u5de5\u4f5c/\u4f5c\u606f\u4fe1\u606f\uff0c\u4ec5\u63d0\u53ca\u201c\u6211\u8fd9\u8fb9\u6709\u70b9\u5435\u201d\uff0c\u65e0\u6cd5\u8bc4\u4f30\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u5168\u7a0b\u672a\u63d0\u53ca\u5bb6\u5ead\uff0c\u51b3\u7b56\u6743\u672a\u77e5\uff0c\u5b58\u5728**\u9ad8\u98ce\u9669\u76f2\u533a**\u3002\n- **\u5e95\u5ea7\u53d6\u77ed\u677f**\uff1a**\u4f4e**\uff08\u8d44\u91d1\u7ef4\u5ea6\u5df2\u89e6\u53ca\u7ea2\u7ebf\uff0c\u4e14\u5176\u4ed6\u7ef4\u5ea6\u4fe1\u606f\u7f3a\u5931\uff0c\u6309\u6700\u77ed\u677f\u539f\u5219\u5224\u5b9a\u4e3a\u4f4e\uff09\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u81ea\u6211\u6000\u7591\u548c\u4e0d\u81ea\u4fe1\uff0c\u5bf9\u201c\u80fd\u5426\u901a\u8fc7\u201d\u3001\u201c\u80fd\u5426\u5b66\u4f1a\u201d\u3001\u201c\u80fd\u5426\u63a5\u5230\u5355\u201d\u5b58\u5728\u6301\u7eed\u6027\u7126\u8651\uff0c\u4f9d\u8d56\u9500\u552e\uff08\u5e08\u5144\uff09\u7684\u80af\u5b9a\u548c\u627f\u8bfa\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u4e5f\u5e0c\u671b\u6211\u80fd\u505a\u8d77\u6765\u4e0d\u8fc7\u6211\u90fd\u4e0d\u77e5\u9053\u6211\u80fd\u4e0d\u80fd\u901a\u8fc7\u201d\n  > \u201c\u6211\u6015\u6211\u53bb\u8df3\u63a5\u4e0d\u5230\u201d\n  > \uff08\u652f\u4ed8\u5931\u8d25\u65f6\uff09\u201c\u554a\u554a\u554a\u6211\u8fd9\u4e2a\u600e\u4e48\u529e\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u7ecf\u6d4e\u6765\u6e90\u4e0d\u7a33\u5b9a\u548c\u672a\u6765\u804c\u4e1a\u53d1\u5c55\u7684\u6df1\u5ea6\u7126\u8651**\u3002\u7528\u6237\u5e0c\u671b\u901a\u8fc7\u6709\u58f0\u4e66\u526f\u4e1a\u5feb\u901f\u83b7\u5f97\u4e00\u4efd\u201c\u4fdd\u969c\u201d\uff0c\u5176\u5b66\u4e60\u52a8\u673a\u6e90\u4e8e\u5bf9\u201c\u63a5\u4e0d\u5230\u5355\u201d\uff08\u5373\u65e0\u6cd5\u53d8\u73b0\uff09\u7684\u6050\u60e7\uff0c\u800c\u975e\u5bf9\u6280\u80fd\u6216\u884c\u4e1a\u7684\u70ed\u7231\u3002\u652f\u4ed8\u65f6\u7684\u7a98\u8feb\uff08\u9650\u989d\u3001\u5206\u6b21\u652f\u4ed8\uff09\u8fdb\u4e00\u6b65\u5370\u8bc1\u4e86\u5176\u7ecf\u6d4e\u5b89\u5168\u611f\u7684\u7f3a\u5931\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u9632\u62a4\u76fe\u5f0f\u7684\u9000\u8d39\u901a\u9053\u4e0e\u6781\u5ea6\u6e29\u548c\u7684\u9884\u671f\u7ba1\u7406**\u3002\u4e0d\u80fd\u7ed9\u4e88\u4efb\u4f55\u201c\u5305\u8d5a\u201d\u7684\u5e7b\u60f3\uff0c\u800c\u662f\u5f3a\u8c03\u6280\u80fd\u79ef\u7d2f\u7684\u957f\u671f\u6027\uff0c\u5e76\u660e\u786e\u544a\u77e5\u5b66\u4e60\u521d\u671f\u53ef\u80fd\u9762\u4e34\u7684\u6311\u6218\u548c\u5408\u7406\u7684\u53d8\u73b0\u5468\u671f\uff0c\u540c\u65f6\u786e\u4fdd\u9000\u8d39\u6d41\u7a0b\u6e05\u6670\u65e0\u963b\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b\uff08\u51b2\u52a8\u98ce\u9669\u578b\uff09** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 / \ud83d\udd34\u5df2\u89e6\u53d1 D \u7c7b\u7194\u65ad\u7ea2\u7ebf\uff01\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u76f4\u63a5\u89e6\u53d1\u201c\u501f\u94b1\u62a5\u540d\u201d\u3001\u201c\u6551\u547d\u94b1\u201d\u7b49\u7edd\u5bf9\u7ea2\u7ebf\u3002\u4f46**\u8d44\u91d1\u627f\u8f7d\u529b\u4f4e\uff08\u652f\u4ed8\u56f0\u96be\uff09** \u53e0\u52a0**\u52a8\u673a\u7eaf\u5ea6\u4f4e\uff08\u5feb\u901f\u53d8\u73b0\uff09** \u548c**\u5fc3\u7406\u5f39\u6027\u4f4e\uff08\u6613\u7126\u8651\uff09**\uff0c\u5df2\u6784\u6210C2\u7c7b\u5178\u578b\u7279\u5f81\uff0c\u8ddd\u79bbD\u7c7b\u4ec5\u4e00\u6b65\u4e4b\u9065\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u9ad8** | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u82e5\u5bb6\u4eba\u4e0d\u77e5\u60c5\u6216\u53cd\u5bf9\uff0c\u6781\u6613\u6210\u4e3a\u9000\u8d39\u5bfc\u706b\u7d22\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u82e5\u540e\u7eed\u8bfe\u7a0b\u5f3a\u5ea6\u5927\u3001\u4f5c\u4e1a\u591a\uff0c\u5176\u81ea\u5351\u5fc3\u7406\u53ef\u80fd\u5bfc\u81f4\u201c\u5b66\u4e0d\u4f1a\u201d\u7684\u81ea\u6211\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u7b2c\u4e00\u4efd\u4f5c\u4e1a\u53d7\u632b\u3001\u7b2c\u4e00\u6b21\u8bd5\u97f3\u5931\u8d25\u3001\u77ed\u671f\u5185\u672a\u63a5\u5230\u5355\uff0c\u90fd\u53ef\u80fd\u76f4\u63a5\u5bfc\u81f4\u5176\u60c5\u7eea\u5d29\u6e83\u5e76\u8981\u6c42\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u5bf9\u201c\u7b2c\u4e8c\u5468\u63a5\u5355\u201d\u62b1\u6709\u6781\u9ad8\u671f\u5f85\uff0c\u82e5\u5f00\u8bfe\u540e\u53d1\u73b0\u63a5\u5355\u95e8\u69db\u9ad8\u3001\u7ade\u4e89\u6fc0\u70c8\uff0c\u4f1a\u7acb\u523b\u4ea7\u751f\u201c\u88ab\u9a97\u201d\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-3\u5468**\u3002\u6b64\u65f6\u201c\u7b2c\u4e8c\u5468\u5f00\u901a\u63a5\u5355\u6743\u9650\u201d\u7684\u627f\u8bfa\u9762\u4e34\u73b0\u5b9e\u68c0\u9a8c\uff0c\u82e5\u7528\u6237\u5c1d\u8bd5\u63a5\u5355\u4f46\u5c61\u5c61\u5931\u8d25\uff0c\u5c06\u76f4\u63a5\u5f15\u7206\u6536\u76ca\u843d\u5dee\u548c\u8106\u5f31\u5fc3\u7406\u53cc\u91cd\u96f7\u533a\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u79cb\u540c\u5b66\uff0c\u606d\u559c\u4f60\u6b63\u5f0f\u52a0\u5165\uff01\u6211\u770b\u4e86\u4f60\u7684\u8bad\u7ec3\u8425\u8868\u73b0\uff0c\u58f0\u97f3\u5f88\u6709\u7279\u70b9\u3002\u54b1\u4eec\u8fd9\u4e2a\u884c\u4e1a\u5c31\u50cf\u5b66\u5f00\u8f66\uff0c\u62ff\u5230\u9a7e\u7167\uff08\u5b66\u4f1a\u6280\u80fd\uff09\u548c\u6210\u4e3a\u8001\u53f8\u673a\uff08\u7a33\u5b9a\u63a5\u5355\uff09\u4e2d\u95f4\u9700\u8981\u4e00\u6bb5\u8def\u7684\u78e8\u5408\u3002\u524d\u671f\u54b1\u4eec\u4e0d\u6025\u7740\u2018\u98d9\u8f66\u2019\uff0c\u5148\u628a\u57fa\u672c\u529f\u7ec3\u624e\u5b9e\u3002\u6211\u4f1a\u966a\u4f60\u4e00\u8d77\uff0c\u6bcf\u4e00\u6b65\u90fd\u8d70\u7a33\uff0c\u6709\u4efb\u4f55\u5361\u4f4f\u7684\u5730\u65b9\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u89e3\u51b3\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\u3011**\u3002\u6838\u5fc3\u662f\u201c\u964d\u9884\u671f\u3001\u5f3a\u966a\u4f34\u3001\u5c0f\u6b63\u53cd\u9988\u201d\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n  1.  **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\uff1a\u73ed\u4e3b\u4efb\u9700\u9ad8\u9891\u3001\u6e29\u548c\u5730\u8ddf\u8fdb\uff0c\u5bf9\u5176\u4efb\u4f55\u5fae\u5c0f\u8fdb\u6b65\u7ed9\u4e88\u5938\u5f20\u5f0f\u80af\u5b9a\u3002\n  2.  **\u3010\u788e\u7247\u5316\u6210\u5c31\u611f\u6a21\u5757\u3011**\uff1a\u4f18\u5148\u63a8\u8350\u201c\u753b\u672c\u201d\u7b49\u5165\u95e8\u5feb\u3001\u53cd\u9988\u5468\u671f\u77ed\u7684\u5fae\u4efb\u52a1\uff0c\u907f\u514d\u4e00\u5f00\u59cb\u5c31\u6311\u6218\u9ad8\u96be\u5ea6\u5f55\u4e66\u3002\n  3.  **\u3010\u9884\u671f\u7ba1\u7406\u5f3a\u5316\u5305\u3011**\uff1a\u53cd\u590d\u3001\u660e\u786e\u5730\u6c9f\u901a\u201c\u5b66\u4e60-\u7ec3\u4e60-\u8bd5\u97f3-\u63a5\u5355\u201d\u7684\u5408\u7406\u5468\u671f\uff0c\u7528\u771f\u5b9e\u5b66\u5458\u6848\u4f8b\uff08\u5305\u542b\u5931\u8d25\u6848\u4f8b\uff09\u8bf4\u660e\u6210\u957f\u8def\u5f84\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n  1.  \u7edd\u4e0d\u5bf9\u5176\u4f7f\u7528\u201c\u5feb\u901f\u53d8\u73b0\u201d\u3001\u201c\u8f7b\u677e\u63a5\u5355\u201d\u7b49\u8bdd\u672f\u3002\n  2.  \u7edd\u4e0d\u5728\u5176\u8868\u8fbe\u7126\u8651\u65f6\u6577\u884d\u6216\u5426\u5b9a\uff08\u5982\u201c\u522b\u4eba\u90fd\u884c\u4f60\u600e\u4e48\u4e0d\u884c\u201d\uff09\u3002\n  3.  \u7edd\u4e0d\u5728\u5176\u672a\u51c6\u5907\u597d\u7684\u60c5\u51b5\u4e0b\uff0c\u50ac\u4fc3\u5176\u53c2\u4e0e\u9ad8\u7ade\u4e89\u8bd5\u97f3\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5f53\u524d7380\u5143\u8bfe\u7a0b\u5df2\u662f\u5176\u627f\u53d7\u6781\u9650\uff0c\u4efb\u4f55\u9644\u52a0\u6d88\u8d39\u5efa\u8bae\u90fd\u5c06\u76f4\u63a5\u5f15\u7206\u8d44\u91d1\u548c\u4fe1\u4efb\u5371\u673a\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u6211\u60f3\u901a\u8fc7\u753b\u672c\u5148\u6323\u70b9**\u540c\u65f6\u5176\u4ed6\u7684\u4e5f\u5b66\u201d\n2. > \u201c**\u6211\u6015\u6211\u53bb\u8df3\u63a5\u4e0d\u5230**\u201d\n3. > \u201c**\u6211\u4e5f\u5e0c\u671b\u6211\u80fd\u505a\u8d77\u6765\u4e0d\u8fc7\u6211\u90fd\u4e0d\u77e5\u9053\u6211\u80fd\u4e0d\u80fd\u901a\u8fc7**\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6\u60c5\u7eea\u5de8\u5a74\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\uff08\u7ecf\u6d4e\u4fdd\u969c\uff09**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u6781\u81f4\u7684\u9884\u671f\u7ba1\u7406 + \u9ad8\u9891\u60c5\u611f\u966a\u62a4 + \u4e25\u7981\u4efb\u4f55\u53d8\u73b0\u538b\u529b**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"maslow_need\": \"\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\", \"risk_level\": \"\u6781\u9ad8\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
