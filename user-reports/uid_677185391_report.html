    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID 677185391 (\u5f20\u6c3f\u6843) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u738b\u5c0f\u4ed91(\u738b\u8339) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u6f14\u64ad\u8bfe\u7a0b (\u8fdb\u9636\u73ed/\u9ad8\u9636\u73ed\uff0c\u4ef7\u683c2380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u88ab\u8feb\u5206\u671f** (\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u76ee\u524d\u8fd8\u662f\u6709\u538b\u529b\u7684\u201d\uff0c\u5e76\u9009\u62e9\u201c\u4ece\u4e24\u4e2a\u6708\u5f00\u59cb\u5427\u201d\uff0c\u6700\u7ec8\u652f\u4ed8400\u5143\u9996\u671f) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u4e2d\u672a\u63d0\u53ca\u5177\u4f53\u804c\u4e1a\u6216\u65f6\u95f4\u5b89\u6392\uff0c\u4ec5\u8868\u793a\u201c\u665a\u4e00\u70b9\u5f55\u597d\u7ed9\u60a8\u201d\uff0c\u63a8\u6d4b\u4e3a**\u788e\u7247\u5316\u62fc\u51d1**\u578b\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u5b66\u4e60\u884c\u4e3a\u8bb0\u5f55\u6e05\u6670\uff0c\u4f46\u4e2a\u4eba\u80cc\u666f\u3001\u8d44\u91d1\u6765\u6e90\u3001\u65f6\u95f4\u5b89\u6392\u7b49\u5173\u952e\u4fe1\u606f\u7f3a\u5931\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u6709\u660e\u786e\u7684\u517c\u804c\u53d8\u73b0\u8bc9\u6c42\uff08\u201c\u52aa\u529b\u5b66\u4e60\u8d5a\u94b1\u201d\uff09\uff0c\u4f46\u540c\u65f6\u4e5f\u8868\u73b0\u51fa\u5bf9\u6280\u80fd\u672c\u8eab\u7684\u5174\u8da3\u548c\u8ba4\u771f\u5b66\u4e60\u7684\u610f\u613f\uff08\u201c\u5bf9\u8fd9\u4e2a\u884c\u4e1a\u6709\u4e86\u6df1\u5c42\u6b21\u7684\u4e86\u89e3 \u4e4b\u540e\u8981\u591a\u7ec3\u57fa\u672c\u529f\u6253\u4e00\u70b9\u57fa\u7840\u201d\uff09\u3002\u52a8\u673a\u4e2d\u201c\u641e\u94b1\u201d\u4e0e\u201c\u5b66\u4e60\u201d\u5e76\u5b58\uff0c\u672a\u8868\u73b0\u51fa\u6781\u7aef\u7684\u201c\u51e0\u5929\u5185\u63d0\u73b0\u201d\u7684\u7126\u8651\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c**\u80af\u5b9a\u662f\u60f3\u901a\u5173\u7684**\u201d > \u201c**\u6211\u4e00\u5b9a\u52aa\u529b\u5b66\u4e60\u8d5a\u94b1**\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u660e\u786e\u8868\u793a\u201c\u76ee\u524d\u8fd8\u662f\u6709\u538b\u529b\u7684\u201d\uff0c\u5e76\u9009\u62e9\u5206\u671f\u4ed8\u6b3e\uff08400\u5143/\u6708\uff09\uff0c\u8868\u660e\u5176\u7ecf\u6d4e\u72b6\u51b5\u4e0d\u5bbd\u88d5\uff0c\u62a5\u540d\u51b3\u7b56\u5b58\u5728\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u660e\u786e\u63d0\u53ca\uff0c\u4f46\u80fd\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u548c\u76f4\u64ad\u6253\u5361\uff0c\u63a8\u6d4b\u6709**\u4e2d\u7b49**\u7684\u788e\u7247\u5316\u65f6\u95f4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b07\u4f4e\u6781\u5371**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56**\u3002\u5728\u9047\u5230\u632b\u6298\uff08\u4f5c\u4e1a\u5f55\u4e0d\u597d\uff09\u65f6\uff0c\u8868\u73b0\u51fa\u660e\u663e\u7684\u81ea\u6211\u5426\u5b9a\u548c\u60c5\u7eea\u4f4e\u843d\uff0c\u9700\u8981\u5916\u90e8\uff08\u9500\u552e\uff09\u7684\u5373\u65f6\u5b89\u629a\u548c\u9f13\u52b1\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c**\u8def\u4e86\u597d\u591a\u904d \u6700\u540e\u8d8a\u5f55\u8d8a\u5dee\u4e86[\u6d41\u6cea]**\u201d (\u9762\u5bf9\u4f5c\u4e1a\u632b\u6298\u65f6\u7684\u5d29\u6e83\u4fe1\u53f7) > \u201c**\u5e08\u59d0\u8f9b\u82e6\u5566 \u6211\u540e\u8fb9\u5c31\u6ce8\u610f\u60a8\u8bf4\u7684\u51e0\u4e2a\u70b9 \u6162\u6162\u7ec3\u4e60**\u201d (\u4f9d\u8d56\u5916\u90e8\u6307\u5bfc\uff0c\u7f3a\u4e4f\u81ea\u6211\u8c03\u6574\u7684\u4e3b\u52a8\u6027)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c / \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u7ecf\u6d4e\u4e0d\u5b89\u5168\u611f\u4e0e\u6280\u80fd\u81ea\u5351\u611f\u5e76\u5b58**\u3002\u4e00\u65b9\u9762\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u83b7\u5f97\u517c\u804c\u6536\u5165\u4ee5\u7f13\u89e3\u7ecf\u6d4e\u538b\u529b\uff08\u5b89\u5168\u9700\u6c42\uff09\uff0c\u53e6\u4e00\u65b9\u9762\u5728\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u6781\u6613\u56e0\u8868\u73b0\u4e0d\u4f73\u800c\u81ea\u6211\u6000\u7591\uff0c\u9700\u8981\u6765\u81ea\u201c\u5e08\u59d0\u201d\u7684\u6301\u7eed\u80af\u5b9a\u548c\u966a\u4f34\u6765\u83b7\u5f97\u60c5\u611f\u652f\u6301\uff08\u793e\u4ea4\u4e0e\u5c0a\u91cd\u9700\u6c42\uff09\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u9632\u62a4\u76fe\u5f0f\u7684\u5b89\u5168\u611f\u4e0e\u4fdd\u59c6\u7ea7\u7684\u9f13\u52b1**\u3002\u65e2\u8981\u63d0\u4f9b\u660e\u786e\u7684\u3001\u53ef\u5b9e\u73b0\u7684\u53d8\u73b0\u8def\u5f84\u4ee5\u5b89\u629a\u5176\u7ecf\u6d4e\u7126\u8651\uff0c\u53c8\u8981\u5728\u5176\u6bcf\u4e00\u6b21\u53d7\u632b\u65f6\u7ed9\u4e88\u53ca\u65f6\u3001\u5938\u5f20\u7684\u6b63\u9762\u53cd\u9988\uff0c\u5145\u5f53\u5176\u201c\u7ebf\u4e0a\u957f\u8f88\u5f0f\u60c5\u611f\u62a4\u822a\u5458\u201d\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74** (\u4e25\u91cd\u5185\u8017\u578b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u867d\u7136\u5b58\u5728\u7ecf\u6d4e\u538b\u529b\uff08\u5206\u671f\u4ed8\u6b3e\uff09\uff0c\u4f46\u672a\u8fbe\u5230\u501f\u8d37\u62a5\u540d\u6216\u6781\u7aef\u5a01\u80c1\u7684T8-D\u7ea2\u7ebf\u3002\u5c5e\u4e8e\u9700\u8981\u91cd\u70b9\u76d1\u63a7\u7684C2\u98ce\u9669\u7528\u6237\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7ecf\u6d4e\u538b\u529b\u53ef\u80fd\u6e90\u4e8e\u5bb6\u5ead\uff0c\u82e5\u540e\u7eed\u5bb6\u5ead\u53cd\u5bf9\uff0c\u98ce\u9669\u5347\u9ad8\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | \u8fd9\u662f\u6700\u5927\u98ce\u9669\u70b9\u3002\u4e00\u65e6\u8bfe\u7a0b\u96be\u5ea6\u63d0\u5347\u3001\u4f5c\u4e1a\u91cf\u52a0\u5927\uff0c\u6216\u63a5\u5355\u53d8\u73b0\u4e0d\u5982\u9884\u671f\u987a\u5229\uff0c\u5176\u201c\u4f4e\u5fc3\u7406\u5f39\u6027\u201d\u5c06\u5bfc\u81f4\u8fc5\u901f\u79ef\u7d2f\u632b\u8d25\u611f\uff0c\u4ea7\u751f\u201c\u5b66\u4e0d\u4f1a/\u8d5a\u4e0d\u5230\u94b1\u201d\u7684\u5ff5\u5934\u800c\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | \u6838\u5fc3\u98ce\u9669\u3002\u4efb\u4f55\u6280\u672f\u4e0a\u7684\u5c0f\u632b\u6298\uff08\u5982\u8f6f\u4ef6\u64cd\u4f5c\u3001\u8bd5\u97f3\u5931\u8d25\u3001\u88ab\u7532\u65b9\u9000\u7a3f\uff09\u90fd\u53ef\u80fd\u89e6\u53d1\u5176\u201c\u8d8a\u5f55\u8d8a\u5dee[\u6d41\u6cea]\u201d\u7684\u5d29\u6e83\u6a21\u5f0f\uff0c\u82e5\u73ed\u4e3b\u4efb\u672a\u53ca\u65f6\u5b89\u629a\uff0c\u6781\u6613\u5f15\u53d1\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | \u5bf9\u201c\u52aa\u529b\u5b66\u4e60\u8d5a\u94b1\u201d\u62b1\u6709\u671f\u5f85\uff0c\u82e5\u5728\u627f\u8bfa\u671f\u5185\uff08\u59822-3\u4e2a\u6708\uff09\u672a\u83b7\u5f97\u5b9e\u9645\u6536\u5165\uff0c\u843d\u5dee\u611f\u4f1a\u8fc5\u901f\u8f6c\u5316\u4e3a\u9000\u8d39\u8bc9\u6c42\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u8bfe\u7a0b\u96be\u5ea6\u548c\u4f5c\u4e1a\u538b\u529b\u589e\u52a0\uff0c\u800c\u53d8\u73b0\u5c1a\u672a\u5f00\u59cb\uff0c\u81ea\u5351\u548c\u7126\u8651\u60c5\u7eea\u4f1a\u8fbe\u5230\u9876\u5cf0\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6c3f\u6843\u540c\u5b66\uff0c\u6b22\u8fce\u4f60\uff01\u770b\u5230\u4f60\u8bad\u7ec3\u8425\u671f\u95f4\u7279\u522b\u8ba4\u771f\uff0c\u4f5c\u4e1a\u4e5f\u5b8c\u6210\u5f97\u5f88\u7528\u5fc3\uff0c\u771f\u7684\u4e3a\u4f60\u9ad8\u5174\u3002\u54b1\u4eec\u8fd9\u4e2a\u73ed\u5c31\u50cf\u4e00\u4e2a\u5927\u5bb6\u5ead\uff0c\u4ee5\u540e\u5b66\u4e60\u4e0a\u9047\u5230\u4efb\u4f55\u5361\u70b9\uff0c\u6bd4\u5982\u8f6f\u4ef6\u4e0d\u4f1a\u88c5\u3001\u4f5c\u4e1a\u5f55\u4e0d\u597d\uff0c\u5343\u4e07\u522b\u81ea\u5df1\u618b\u7740\u96be\u53d7\uff0c\u968f\u65f6\u627e\u6211\u3002\u6211\u7684\u4efb\u52a1\u5c31\u662f\u5e2e\u4f60\u628a\u8fd9\u4e9b\u95ee\u9898\u4e00\u4e2a\u4e2a\u62c6\u89e3\u6389\uff0c\u54b1\u4eec\u6162\u6162\u6765\uff0c\u6bcf\u4e00\u6b65\u8d70\u7a33\u4e86\uff0c\u7ed3\u679c\u81ea\u7136\u6c34\u5230\u6e20\u6210\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** (\u56e0\u5176\u6709\u53d8\u73b0\u8bc9\u6c42\uff0c\u4f46\u9700\u642d\u914d\u6781\u5f3a\u7684\u60c5\u611f\u652f\u6301)\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u5f3a\u70c8\u8865\u5145\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u9488\u5bf9T6\u60c5\u7eea\u5de8\u5a74\uff0c\u6838\u5fc3\u662f**A(\u50bb\u74dc\u7248) + C(\u6ee1\u914d\u5168\u5f00)**\u3002\u62ff\u8d70\u96be\u9898\uff0c\u4e88\u4ee5\u6781\u5938\u5f20\u7684\u8d5e\u7f8e\u3002\u4f5c\u4e1a\u70b9\u8bc4\u4ee5\u9f13\u52b1\u4e3a\u4e3b\uff0c\u6280\u672f\u7ea0\u9519\u8981\u5305\u88f9\u5728\u5927\u91cf\u80af\u5b9a\u4e2d\u3002\u5b9a\u671f\u8fdb\u884c1v1\u79c1\u804a\uff0c\u8be2\u95ee\u5176\u60c5\u7eea\u72b6\u6001\uff0c\u800c\u975e\u4ec5\u5173\u6ce8\u4f5c\u4e1a\u8fdb\u5ea6\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u5728\u5176\u53d7\u632b\u65f6\u4f7f\u7528\u6279\u8bc4\u6216\u5bf9\u6bd4\u6027\u8bed\u8a00\uff08\u5982\u201c\u522b\u4eba\u90fd\u884c\u4f60\u600e\u4e48\u4e0d\u884c\u201d\uff09\u30022. \u8fc7\u65e9\u65bd\u52a0\u9ad8\u538b\u6216\u5e03\u7f6e\u8fdc\u8d85\u5176\u5f53\u524d\u80fd\u529b\u7684\u4efb\u52a1\u30023. \u5728\u5176\u60c5\u7eea\u4f4e\u843d\u65f6\u8fdb\u884c\u5347\u5355\u63a8\u9500\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u60c5\u7eea\u4e0d\u7a33\u5b9a\u671f\u6216\u672a\u53d6\u5f97\u660e\u663e\u8fdb\u6b65\u524d\u8fdb\u884c\u4efb\u4f55\u5347\u5355**\u3002\u5347\u5355\u5fc5\u987b\u5efa\u7acb\u5728\u201c\u5c0f\u6210\u529f\u201d\u4e8b\u4ef6\u4e4b\u540e\uff08\u5982\u7b2c\u4e00\u6b21\u8bd5\u97f3\u901a\u8fc7\u3001\u7b2c\u4e00\u6b21\u83b7\u5f97\u7532\u65b9\u597d\u8bc4\uff09\uff0c\u5e76\u91c7\u7528\u201c\u5956\u52b1\u201d\u548c\u201c\u4e3a\u4f60\u4e89\u53d6\u5230\u201d\u7684\u8bdd\u672f\uff0c\u800c\u975e\u5236\u9020\u7126\u8651\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u8def\u4e86\u597d\u591a\u904d \u6700\u540e\u8d8a\u5f55\u8d8a\u5dee\u4e86[\u6d41\u6cea]**\u201d \u2014\u2014 **\u4f4e\u5fc3\u7406\u5f39\u6027\u7684\u76f4\u63a5\u8bc1\u636e\uff0c\u9047\u632b\u5373\u5d29\u6e83\u3002**\n2. > \u201c**\u76ee\u524d\u8fd8\u662f\u6709\u538b\u529b\u7684**\u201d / \u201c**\u6211\u5148\u4ece\u4e24\u4e2a\u6708\u5f00\u59cb\u5427**\u201d \u2014\u2014 **\u8d44\u6e90\u5e95\u5ea7\uff08\u8d44\u91d1\uff09\u8584\u5f31\u7684\u76f4\u63a5\u8bc1\u636e\uff0c\u5b58\u5728\u7ecf\u6d4e\u538b\u529b\u3002**\n3. > \u201c**\u5e08\u59d0\u8f9b\u82e6\u5566 \u6211\u540e\u8fb9\u5c31\u6ce8\u610f\u60a8\u8bf4\u7684\u51e0\u4e2a\u70b9 \u6162\u6162\u7ec3\u4e60**\u201d \u2014\u2014 **\u5bf9\u6743\u5a01\uff08\u5e08\u59d0\uff09\u6709\u9ad8\u5ea6\u4f9d\u8d56\uff0c\u7f3a\u4e4f\u81ea\u6211\u9a71\u52a8\u7684\u8c03\u6574\u80fd\u529b\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\uff08\u7ecf\u6d4e\u4fdd\u969c\uff09\u4e0e\u793e\u4ea4\u966a\u4f34\uff08\u60c5\u611f\u80af\u5b9a\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u542f\u52a8\u6ee1\u914dC\u6a21\u5757\uff08\u60c5\u7eea\u4fdd\u59c6\u4e0e\u4f34\u98de\u6c60\uff09\uff0c\u63d0\u4f9b\u201c\u8f6e\u6905\u7ea7\u201d\u60c5\u611f\u6258\u5e95\u4e0e\u5938\u5f20\u8d5e\u7f8e\uff0c\u4e25\u9632\u4efb\u4f55\u6280\u672f\u632b\u6298\u5bfc\u81f4\u7684\u5fc3\u7406\u5d29\u76d8\u3011\u3002**\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168/\u793e\u4ea4\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\uff08\u5fc5\u987b\u6302\u8f7d\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\uff09\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
