    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677000117 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-26 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u8c46\u76ae\u571f\u53f8(\u738b\u5174\u6885) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u64ad\u7cbe\u82f1\u73ed\uff08\u5df2\u8d2d\uff09\u3001\u540e\u671f\u526a\u8f91\u73ed\uff08\u610f\u5411/\u5df2\u8d2d94\u671f\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u3010\u26a0\ufe0f \u9ad8\u8d1f\u503a\u9690\u60a3\u3011** \u81ea\u8ff0\u201c\u62a5\u8bfe\u548c\u7535\u8111\u8bbe\u5907\u5df2\u7ecf\u4e00\u4e07\u4e94\u4e86\u201d\uff0c\u4e14\u5bf9\u540e\u671f\u73ed\u989d\u5916\u8d39\u7528\u8868\u793a\u60ca\u8bb6\u548c\u538b\u529b\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u3010\ud83d\udfe1 \u788e\u7247\u5316\u62fc\u51d1\u3011** \u9700\u517c\u987e\u5b69\u5b50\uff08\u63a5\u9001\u3001\u505a\u996d\u3001\u5174\u8da3\u73ed\uff09\uff0c\u5b66\u4e60\u65f6\u95f4\u88ab\u4e25\u91cd\u5207\u5272\uff0c\u6709\u201c\u770b\u5f55\u64ad\u8bfe\u4e2d\uff0c\u6ca1\u6ce8\u610f\u65f6\u95f4\uff0c\u628a\u5a03\u7ed9\u5fd8\u4e86\u201d\u7684\u60c5\u51b5\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u3010\ud83d\udfe1 \u4fe1\u606f\u4e0d\u8db3\u3011** \u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\uff0c\u4f46\u9ad8\u989d\u652f\u51fa\uff081.5\u4e07\uff09\u53ca\u5bb6\u5ead\u4e3b\u5987/\u5b9d\u5988\u8eab\u4efd\uff0c**\u5b58\u5728\u9690\u7792\u6216\u5bb6\u4eba\u4e0d\u652f\u6301\u7684\u91cd\u5927\u98ce\u9669**\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u3010\u9971\u6ee1\u3011** \u804a\u5929\u8bb0\u5f55\u8be6\u7ec6\uff0c\u80fd\u6e05\u6670\u53cd\u6620\u5b66\u4e60\u8fc7\u7a0b\u3001\u5fc3\u6001\u53d8\u5316\u53ca\u7ecf\u6d4e\u72b6\u51b5\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u6709\u660e\u786e\u7684\u53d8\u73b0\u6e34\u671b\uff08\u201c\u6211\u60f3\u5feb\u70b9\u53d8\u73b0\u517b\u6d3b\u81ea\u5df1\u554a\u201d\uff09\uff0c\u4f46\u540c\u65f6\u4e5f\u8868\u73b0\u51fa\u5bf9\u6280\u80fd\u672c\u8eab\u7684\u94bb\u7814\u5174\u8da3\u548c\u957f\u671f\u5b66\u4e60\u7684\u51c6\u5907\uff08\u53cd\u590d\u7422\u78e8\u91cd\u97f3\u3001\u505c\u8fde\u3001\u6587\u672c\u5206\u6790\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u60f3\u5feb\u70b9\u53d8\u73b0\u517b\u6d3b\u81ea\u5df1\u554a\u201d\n> \u201c\u6211\u611f\u89c9\u8fd9\u5468\u7684\u55ef\u597d\u96be\u5440...\u53ef\u80fd\u5c31\u662f\u8981\u591a\u53bb\u8bfb...\u7136\u540e\u81ea\u5df1\u627e\u627e\u611f\u89c9\uff0c\u6211\u89c9\u5f97\u597d\u96be\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e\u6781\u5371]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u5df2\u6295\u51651.5\u4e07\uff0c\u5bf9\u540e\u7eed\u8bfe\u7a0b\u8d39\u7528\uff08\u540e\u671f\u73ed\uff09\u611f\u5230\u610f\u5916\u548c\u538b\u529b\uff0c\u76f4\u8a00\u201c\u6ca1\u94b1\u201d\uff0c\u5b58\u5728\u7ecf\u6d4e\u7d27\u5f20\u548c\u6f5c\u5728\u503a\u52a1\u98ce\u9669\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e** \u2014 \u5b9d\u5988\u8eab\u4efd\uff0c\u65f6\u95f4\u88ab\u80b2\u513f\u548c\u5bb6\u52a1\u9ad8\u5ea6\u788e\u7247\u5316\uff0c\u591a\u6b21\u56e0\u5b69\u5b50\u6253\u65ad\u5b66\u4e60\u8fdb\u7a0b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u6781\u4f4e\uff08\u63a8\u65ad\uff09** \u2014 \u9ad8\u989d\u652f\u51fa\u672a\u63d0\u53ca\u5bb6\u4eba\u652f\u6301\uff0c\u7ed3\u5408\u5176\u201c\u517b\u6d3b\u81ea\u5df1\u201d\u7684\u8868\u8ff0\uff0c**\u6781\u6709\u53ef\u80fd\u9762\u4e34\u5bb6\u5ead\u7ecf\u6d4e\u538b\u529b\u6216\u53cd\u5bf9**\uff0c\u662f\u9000\u8d39\u7684\u6781\u9ad8\u5371\u4fe1\u53f7\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a**\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u8f6f\u4ef6\u5b89\u88c5\u3001\u4f1a\u8bae\u6ca1\u58f0\u97f3\uff09\u4f1a\u4e3b\u52a8\u6c42\u52a9\u5e76\u5feb\u901f\u89e3\u51b3\uff0c\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u52a8\u624b\u80fd\u529b\u548c\u97e7\u6027\u3002\u4f46\u5728\u5b66\u4e60\u632b\u8d25\u65f6\uff08\u201c\u6211\u611f\u89c9\u6211\u7684\u95ee\u9898\u597d\u591a\u201d\u3001\u201c\u5f55\u7684\u8fd8\u4e0d\u5982\u524d\u4e00\u4e2a\u597d\u201d\uff09**\u9ad8\u5ea6\u4f9d\u8d56\u73ed\u73ed\u7684\u9f13\u52b1\u548c\u80af\u5b9a**\uff0c\u9700\u8981\u5916\u90e8\u60c5\u7eea\u652f\u6301\u6765\u7ef4\u6301\u4fe1\u5fc3\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u55ef\u52a0\u6cb9\uff0c\u6211\u89c9\u5f97\u6211\u7684\u95ee\u9898\u597d\u591a\u201d\n> \u201c\u6709\u73ed\u73ed\u5728\u4e0d\u6015\u7684[\u62f3\u5934]\u201d\n> \u201c\u73ed\u73ed\uff0c\u8c03\u8bd5\u597d\u4e86...\u8001\u5e08\u5e2e\u6211\u8c03\u8bd55\u5206\u949f\u641e\u5b9a[\u5472\u7259]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4f5c\u4e3a\u5b9d\u5988\uff0c\u7f3a\u4e4f\u7ecf\u6d4e\u72ec\u7acb\u7684\u5b89\u5168\u611f\u548c\u81ea\u6211\u4ef7\u503c\u8ba4\u540c**\u3002\u5979\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u914d\u97f3/\u540e\u671f\u6280\u80fd\u201c\u53d8\u73b0\u517b\u6d3b\u81ea\u5df1\u201d\uff0c\u6df1\u5c42\u9a71\u52a8\u529b\u662f\u6446\u8131\u5bf9\u5bb6\u5ead\u7684\u7ecf\u6d4e\u4f9d\u8d56\u6216\u5bfb\u6c42\u4e2a\u4eba\u4ef7\u503c\uff0c\u62b5\u5fa1\u201c\u65e0\u6cd5\u517b\u6d3b\u81ea\u5df1\u201d\u7684\u751f\u5b58\u7126\u8651\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u201d\u7684\u80af\u5b9a\u4e0e\u201c\u88ab\u6258\u4f4f\u201d\u7684\u5b89\u5168\u611f**\u3002\u5979\u9700\u8981\u6301\u7eed\u3001\u5177\u4f53\u7684\u6280\u672f\u6307\u5bfc\uff08\u89e3\u51b3\u5b9e\u9645\u95ee\u9898\uff09\u548c\u5927\u91cf\u7684\u60c5\u7eea\u9f13\u52b1\uff08\u201c\u4f60\u80fd\u884c\u201d\uff09\uff0c\u6765\u5bf9\u6297\u56e0\u65f6\u95f4\u788e\u7247\u3001\u8fdb\u5ea6\u7f13\u6162\u3001\u81ea\u6211\u6000\u7591\u800c\u4ea7\u751f\u7684\u5de8\u5927\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5 C2 \u7c7b** (\u52a8\u673a\u4e2d\u7b49\u4f46\u8d44\u6e90\u5e95\u5ea7\u5b58\u5728\u81f4\u547d\u77ed\u677f\uff0c\u5fc3\u7406\u5f39\u6027\u4e00\u822c\uff0c\u9700\u9ad8\u5f3a\u5ea6\u5e72\u9884) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u6838\u5fc3\u7279\u5f81\uff1a\u6280\u80fd\u7126\u8651\u4e25\u91cd\u3001\u4f9d\u8d56\u5916\u90e8\u80af\u5b9a\u3001\u8d44\u6e90\u7d27\u5f20\u3001\u5bb6\u5ead\u652f\u6301\u5b58\u7591) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\ud83d\udfe1 **\u9ec4\u706f\u9884\u8b66\uff0c\u903c\u8fd1\u7ea2\u7ebf\uff01** \u867d\u672a\u660e\u786e\u89e6\u53d1\u501f\u8d37\uff0c\u4f46\u201c\u5df2\u6295\u51651.5\u4e07\u201d+\u201c\u6ca1\u94b1\u201d+\u201c\u517b\u6d3b\u81ea\u5df1\u201d\u7684\u7ec4\u5408\uff0c\u5df2\u6784\u6210**\u9ad8\u5371\u5bb6\u5ead\u7ecf\u6d4e\u77db\u76fe\u4e0e\u9000\u8d39\u9690\u60a3**\u3002\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u9ad8\u989d\u6559\u80b2\u6d88\u8d39\u53ef\u80fd\u8d85\u51fa\u5bb6\u5ead\u53ef\u627f\u53d7\u8303\u56f4\uff0c\u5b58\u5728\u9690\u7792\u5bb6\u4eba\u6216\u5f15\u53d1\u5bb6\u5ead\u51b2\u7a81\u7684\u6781\u9ad8\u98ce\u9669\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| **\u5bb6\u5ead\u5e72\u9884\u578b** | **\u6781\u9ad8** | \u5bb6\u4eba\u53d1\u73b0\u5df2\u82b1\u8d391.5\u4e07\u5e76\u8ba1\u5212\u7ee7\u7eed\u6295\u5165\uff0c\u5f15\u53d1\u6fc0\u70c8\u4e89\u5435\u6216\u7ecf\u6d4e\u5c01\u9501\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | \u80b2\u513f\u4e0e\u5bb6\u52a1\u5bfc\u81f4\u5b66\u4e60\u65f6\u95f4\u65e0\u6cd5\u4fdd\u8bc1\uff0c\u4f5c\u4e1a\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u3001\u5b66\u4e0d\u4f1a\u201d\u7684\u5d29\u6e83\u611f\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u4e2d** | \u591a\u6b21\u8bd5\u97f3\u4e0d\u4e2d\u6216\u4f5c\u4e1a\u88ab\u6279\u201c\u592a\u5e73\u201d\u3001\u201c\u65ad\u53e5\u9519\u8bef\u201d\u540e\uff0c\u81ea\u5c0a\u5fc3\u53d7\u632b\uff0c\u4ea7\u751f\u201c\u6211\u4e0d\u884c\u201d\u7684\u5f7b\u5e95\u653e\u5f03\u5ff5\u5934\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u4e2d** | \u5b66\u5b8c\u7cbe\u82f1\u73ed\u548c\u540e\u671f\u73ed\u540e\uff0c\u53d1\u73b0\u63a5\u5355\u8fdc\u4e0d\u5982\u60f3\u8c61\u4e2d\u5bb9\u6613\u548c\u8d5a\u94b1\u5feb\uff0c\u611f\u5230\u88ab\u6b3a\u9a97\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c4-6\u5468\uff08\u6b7b\u4ea1\u8c37\uff09**\u3002\u6b64\u65f6\u8bfe\u7a0b\u96be\u5ea6\u52a0\u5927\uff08\u5982\u6587\u672c\u5206\u6790\uff09\uff0c\u4f5c\u4e1a\u8981\u6c42\u63d0\u9ad8\uff0c\u82e5\u540c\u65f6\u906d\u9047\u5bb6\u5ead\u7ecf\u6d4e\u538b\u529b\u6216\u7b2c\u4e00\u6b21\u8bd5\u97f3\u5931\u8d25\uff0c\u6781\u6613\u5168\u9762\u5d29\u6e83\u9000\u8d39\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u591a\u591a\uff0c\u770b\u5230\u4f60\u53c8\u8981\u5e26\u5a03\u53c8\u8981\u8fd9\u4e48\u52aa\u529b\u5730\u5b66\u4e60\uff0c\u771f\u7684\u7279\u522b\u4f69\u670d\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u4e0d\u6015\u6162\uff0c\u5c31\u6015\u7ad9\u3002\u4f60\u6bcf\u6b21\u4ea4\u4f5c\u4e1a\u3001\u95ee\u95ee\u9898\uff0c\u90fd\u662f\u5728\u4e3a\u81ea\u5df1\u2018\u80fd\u517b\u6d3b\u81ea\u5df1\u2019\u8fd9\u4e2a\u76ee\u6807\u5b9e\u5b9e\u5728\u5728\u5730\u94fa\u8def\u3002\u4ee5\u540e\u9047\u5230\u4efb\u4f55\u65f6\u95f4\u4e0a\u7684\u56f0\u96be\u6216\u8005\u89c9\u5f97\u8ddf\u4e0d\u4e0a\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4eec\u4e00\u8d77\u60f3\u529e\u6cd5\u8c03\u6574\u8282\u594f\uff0c**\u4f60\u7684\u575a\u6301\u6bd4\u5b8c\u7f8e\u66f4\u91cd\u8981**\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\u3011**\u3002\u6838\u5fc3\u76ee\u6807\u662f\u7ef4\u6301\u5176\u5b66\u4e60\u4fe1\u5fc3\u548c\u7c98\u6027\uff0c\u800c\u975e\u8ffd\u6c42\u6280\u672f\u5c16\u5cf0\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u5f3a\u70c8\u8865\u5145\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305(C\u6a21\u5757\u6ee1\u914d)\u3011**\uff1a\u6bcf\u65e5\u6253\u5361\u7ed9\u4e88\u5938\u5f20\u8d5e\u7f8e\uff1b\u4f5c\u4e1a\u70b9\u8bc4\u4ee5\u9f13\u52b1\u5fae\u5c0f\u8fdb\u6b65\u4e3a\u4e3b\uff1b\u63d0\u4f9b\u65f6\u95f4\u7ba1\u7406\u5efa\u8bae\uff08\u5982\u201c\u5b69\u5b50\u7761\u540e\u9ec4\u91d1\u4e00\u5c0f\u65f6\u201d\u5b66\u4e60\u6cd5\uff09\u3002**\u8c28\u614e\u4f9b\u7ed9\u3010\u786c\u6838\u624b\u827a\u6c60(B\u6a21\u5757)\u3011**\uff1a\u4ec5\u5728\u89e3\u51b3\u5176\u660e\u786e\u63d0\u51fa\u7684\u5177\u4f53\u6280\u672f\u95ee\u9898\u65f6\u63d0\u4f9b1v1\u6307\u5bfc\uff0c\u907f\u514d\u5e03\u7f6e\u9ad8\u96be\u5ea6\u6311\u6218\u4efb\u52a1\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u5979\u65bd\u538b\u6216\u6279\u8bc4\u5176\u8fdb\u5ea6\u6162**\u3002\u907f\u514d\u8bf4\u201c\u522b\u4eba\u90fd\u884c\u4e86\u4f60\u600e\u4e48\u8fd8\u4e0d\u884c\u201d\u3002\n    2. **\u7edd\u4e0d\u5728\u5979\u9762\u524d\u8fc7\u5ea6\u6e32\u67d3\u201c\u5b66\u5b8c\u7acb\u5373\u9ad8\u85aa\u63a5\u5355\u201d**\uff0c\u9700\u7ba1\u7406\u53d8\u73b0\u9884\u671f\uff0c\u5f3a\u8c03\u201c\u6280\u80fd\u79ef\u7d2f\u9700\u8981\u8fc7\u7a0b\u201d\u3002\n    3. **\u4e25\u7981\u4e3b\u52a8\u63a8\u52a8\u5927\u989d\u5347\u5355**\uff0c\u5728\u5bb6\u5ead\u7ecf\u6d4e\u72b6\u51b5\u660e\u6670\u524d\uff0c\u4efb\u4f55\u65b0\u8bfe\u7a0b\u63a8\u8350\u90fd\u662f\u706b\u4e0a\u6d47\u6cb9\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u3010\u4e25\u7981\u5347\u5355\u3011**\u3002\u5728\u73b0\u6709\u8bfe\u7a0b\uff08\u7cbe\u82f1\u73ed+\u540e\u671f\u73ed\uff09\u672a\u5b8c\u6210\u4e14\u5bb6\u5ead\u8d22\u52a1\u95ee\u9898\u672a\u89e3\u51b3\u524d\uff0c\u7981\u6b62\u4efb\u4f55\u8fdb\u4e00\u6b65\u6d88\u8d39\u5f15\u5bfc\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u60f3\u5feb\u70b9\u53d8\u73b0\u517b\u6d3b\u81ea\u5df1\u554a\u201d\n2. > \u201c\u62a5\u8bfe\u548c\u7535\u8111\u8bbe\u5907\u5df2\u7ecf\u4e00\u4e07\u4e94\u4e86[\u6342\u8138]\u201d\n3. > \u201c\u6709\u73ed\u73ed\u5728\u4e0d\u6015\u7684[\u62f3\u5934]\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u7ecf\u6d4e\u72ec\u7acb\u7684\u5b89\u5168\u611f\uff08\u9a6c\u65af\u6d1b\u7b2c\u4e8c\u5c42\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u81f4\u7684\u60c5\u611f\u966a\u4f34\u4e0e\u9f13\u52b1\uff0c\u540c\u65f6\u4e25\u9632\u5bb6\u5ead\u7ecf\u6d4e\u77db\u76fe\u7206\u53d1\uff0c\u4e25\u7981\u65bd\u52a0\u5b66\u4e1a\u538b\u529b\u548c\u63a8\u9500\u65b0\u8bfe\u7a0b\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
