    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677158353 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5218\u4e9a\u5a1f (\u9500\u552e/\u73ed\u4e3b\u4efb) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6500\u767b\u8ba1\u5212\u7cfb\u7edf\u8bfe (\u4ef7\u683c\u672a\u660e\u793a\uff0c\u4f46\u63d0\u53ca\u201c400\u201d\u53ca\u201c\u4f18\u60e0\u5238\u201d) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3** (\u4ec5\u89c1\u201c400\u201d\u53ca\u5207\u6362\u652f\u4ed8\u5b9d\uff0c\u65e0\u6cd5\u5224\u65ad\u652f\u4ed8\u65b9\u5f0f\u53ca\u8d44\u91d1\u6765\u6e90) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u6709\u4e3b\u4e1a\uff0c\u9700\u4e0b\u73ed\u540e\u3001\u665a\u4e0a\u53ca\u5348\u4f11\u65f6\u95f4\u5b66\u4e60) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3** (\u804a\u5929\u672a\u6d89\u53ca\u5bb6\u5ead\u51b3\u7b56) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931** (\u5173\u952e\u7ef4\u5ea6\u5982\u652f\u4ed8\u80fd\u529b\u3001\u5bb6\u5ead\u652f\u6301\u3001\u6df1\u5c42\u52a8\u673a\u3001\u804c\u4e1a\u80cc\u666f\u5747\u672a\u63d0\u53ca\uff0c**\u7f6e\u4fe1\u5ea6\u964d\u4f4e**) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34(\u4e2d)\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6709\u58f0\u884c\u4e1a\u7684\u5174\u8da3\u548c\u5b66\u4e60\u70ed\u60c5\uff0c\u4f46\u804a\u5929\u4e2d\u672a\u660e\u786e\u8868\u8fbe\u5f3a\u70c8\u7684\u7ecf\u6d4e\u538b\u529b\u6216\u660e\u786e\u7684\u53d8\u73b0\u76ee\u6807\uff0c\u66f4\u591a\u662f\u5bf9\u6280\u80fd\u5b66\u4e60\u548c\u884c\u4e1a\u63a2\u7d22\u7684\u79ef\u6781\u56de\u5e94\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u4f1a\u5c3d\u5feb\u63d0\u5347\u81ea\u5df1\uff0c\u5c3d\u91cf\u4e0d\u62d6\u540e\u817f[\u61a8\u7b11]\u201d (\u4f53\u73b0\u5b66\u4e60\u6001\u5ea6\u800c\u975e\u76f4\u63a5\u641e\u94b1\u8bc9\u6c42)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u8bc4\u7ea7\u7f3a\u5931]** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5173\u4e8e\u5b66\u8d39\u3001\u6536\u5165\u3001\u7ecf\u6d4e\u72b6\u51b5\u7684\u4fe1\u606f\uff0c\u65e0\u6cd5\u8bc4\u4f30\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**[\u4e2d]** \u2014 \u7528\u6237\u6709\u5168\u804c\u5de5\u4f5c\uff0c\u4f46\u80fd\u5229\u7528\u4e0b\u73ed\u540e\u3001\u665a\u4e0a\u65f6\u95f4\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\u548cpia\u620f\uff0c\u8868\u73b0\u51fa\u8f83\u597d\u7684\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u548c\u6267\u884c\u529b\u3002\u8bc1\u636e\uff1a`\u201c\u8fd9\u8fb9\u7b49\u6211\u4e0b\u73ed\u518d\u7ec6\u770b\u8d44\u6599\u201d`\uff1b`\u201c\u4eca\u665a\u4e0a\u4e00\u5b9a\u4f1a\u5b8c\u6210\u7684\u201d`\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u8bc4\u7ea7\u7f3a\u5931]** \u2014 \u804a\u5929\u8bb0\u5f55\u5b8c\u5168\u672a\u6d89\u53ca\u5bb6\u5ead\u6216\u4f34\u4fa3\uff0c\u65e0\u6cd5\u8bc4\u4f30\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u7528\u6237\u80fd\u4e3b\u52a8\u53d1\u73b0\u4e0d\u8db3\u3001\u63a5\u53d7\u53cd\u9988\u3001\u79ef\u6781\u7ec3\u4e60\uff0c\u9047\u5230\u6311\u6218\uff08\u5982\u73af\u5883\u5435\u3001\u89d2\u8272\u97f3\u96be\uff09\u65f6\u6001\u5ea6\u79ef\u6781\uff0c\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u65e0\u62b1\u6028\u6216\u60c5\u7eea\u5316\u8868\u73b0\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u770b\u4e86\u4f5c\u4e1a\uff0c\u592a\u6709\u6311\u6218\u4e86\uff0c\u6211\u5f97\u7422\u78e8\u7422\u78e8\u627e\u627e\u611f\u89c9\u3002\u56e0\u4e3a\u662f\u8001\u57ce\u533a\u6709\u4e9b\u5435\uff0c\u4f5c\u4e1a\u63d0\u4ea4\u4f1a\u7a0d\u5fae\u665a\u70b9\u201d (\u5ba2\u89c2\u9648\u8ff0\u56f0\u96be\u5e76\u627f\u8bfa\u89e3\u51b3\uff0c\u65e0\u8d1f\u9762\u60c5\u7eea)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u81ea\u8eab\u80fd\u529b\u7684\u4e0d\u786e\u5b9a\u611f\uff0c\u4ee5\u53ca\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u65b0\u6280\u80fd\u83b7\u5f97\u8ba4\u53ef\u548c\u878d\u5165\u4e13\u4e1a\u5708\u5c42\u7684\u5f52\u5c5e\u611f\u3002\u4ed6\u53cd\u590d\u5f3a\u8c03\u201c\u4e0d\u62d6\u540e\u817f\u201d\u3001\u201c\u5c3d\u5feb\u63d0\u5347\u81ea\u5df1\u201d\uff0c\u5e76\u79ef\u6781\u56de\u5e94\u6bcf\u4e00\u6b21\u8868\u626c\u548c\u8d44\u6e90\u7ed9\u4e88\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u8eab\u4efd\u7684\u8ba4\u540c\u4e0e\u5708\u5c42\u63a5\u7eb3\u611f**\u3002\u901a\u8fc7\u201c\u5e08\u59d0/\u8001\u5e08\u201d\u7684\u6301\u7eed\u5173\u6ce8\u3001\u7ec6\u81f4\u70b9\u8bc4\u3001\u7ed9\u4e88\u201c\u901a\u5173\u201d\u3001\u201c\u4f18\u79c0\u5b66\u5458\u201d\u3001\u201c\u9884\u7559\u7248\u6743\u4e66\u540d\u989d\u201d\u7b49\u7279\u6b8a\u5f85\u9047\uff0c\u6ee1\u8db3\u5176\u88ab\u770b\u89c1\u3001\u88ab\u8ba4\u53ef\u3001\u88ab\u7eb3\u5165\u201c\u4e13\u4e1a\u6709\u58f0\u5708\u201d\u7684\u6df1\u5c42\u6e34\u671b\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u5f52\u4e3a \ud83d\udfe7B \u7c7b** (\u5b66\u4e60\u610f\u613f\u5f3a\u3001\u914d\u5408\u5ea6\u9ad8\uff0c\u4f46\u5173\u952e\u652f\u4ed8\u4e0e\u5bb6\u5ead\u4fe1\u606f\u7f3a\u5931\uff0c\u65e0\u6cd5\u6392\u9664C/D\u7c7b\u98ce\u9669) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **[T3 \u6b7b\u78d5\u5b66\u9738\u578b]** (\u6838\u5fc3\u7279\u5f81\uff1a\u8ba4\u771f\u5b8c\u6210\u6240\u6709\u4efb\u52a1\uff0c\u79ef\u6781\u5bfb\u6c42\u53cd\u9988\uff0c\u6ce8\u91cd\u7ec6\u8282\u63d0\u5347\uff0c\u6709\u8f83\u5f3a\u7684\u81ea\u5f8b\u6027\u548c\u76ee\u6807\u611f\uff0c\u8ffd\u6c42\u6280\u80fd\u7cbe\u8fdb\u672c\u8eab\u5e26\u6765\u7684\u6210\u5c31\u611f\u3002) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u57fa\u4e8e\u73b0\u6709\u4fe1\u606f)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5ead\u51b2\u7a81\u7b49\u7ea2\u7ebf\u4fe1\u606f\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** (\u4fe1\u606f\u7f3a\u5931\uff0c\u5b58\u5728\u9690\u60a3) | \u82e5\u62a5\u540d\u884c\u4e3a\u9690\u7792\u5bb6\u4eba\uff0c\u540e\u7eed\u5927\u989d\u652f\u51fa\u6216\u65f6\u95f4\u5360\u7528\u53ef\u80fd\u5f15\u53d1\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u7528\u6237\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5c1a\u53ef\uff0c\u4e14\u4e3b\u52a8\u6c9f\u901a\uff0c\u4f46\u9700\u8b66\u60d5\u4e3b\u4e1a\u7a81\u7136\u7e41\u5fd9\u5bfc\u81f4\u5b66\u4e60\u4e2d\u65ad\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u7528\u6237\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u79ef\u6781\u9762\u5bf9\u6311\u6218\u548c\u53cd\u9988\uff0c\u60c5\u7eea\u7a33\u5b9a\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | **\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u82e5\u6b63\u5f0f\u8bfe\u7a0b\u5f00\u59cb\u540e\uff0c\u53d1\u73b0\u63a5\u5355\u96be\u5ea6\u3001\u53d8\u73b0\u5468\u671f\u8fdc\u8d85\u9884\u671f\uff0c\u6216\u201c\u9884\u7559\u7248\u6743\u4e66\u201d\u7b49\u627f\u8bfa\u672a\u5151\u73b0\uff0c\u53ef\u80fd\u4ea7\u751f\u88ab\u6b3a\u9a97\u611f\u800c\u8981\u6c42\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\u3002\u5f53\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u8fdb\u5165\u67af\u71e5\u7684\u6280\u80fd\u6253\u78e8\u671f\uff0c\u4e14\u672a\u83b7\u5f97\u9884\u671f\u7684\u63a5\u5355\u673a\u4f1a\u6216\u53d8\u73b0\u8fdb\u5c55\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4e9a\u5a1f\u5e08\u59d0\u8ddf\u6211\u8bf4\u4f60\u7279\u522b\u8ba4\u771f\uff0c\u4f5c\u4e1a\u5b8c\u6210\u5f97\u53c8\u5feb\u53c8\u597d\uff0c\u662f\u54b1\u4eec\u8fd9\u6279\u91cc\u6700\u6709\u6f5c\u529b\u7684\u2018\u5b66\u9738\u82d7\u5b50\u2019\u3002\u63a5\u4e0b\u6765\u7684\u7cfb\u7edf\u8bfe\u4f1a\u5e26\u4f60\u6df1\u6316\u89d2\u8272\u5851\u9020\u548c\u540e\u671f\u6280\u5de7\uff0c\u5f88\u591a\u50cf\u4f60\u4e00\u6837\u8ba4\u771f\u7684\u540c\u5b66\u5df2\u7ecf\u5f00\u59cb\u5728\u559c\u9a6c\u62c9\u96c5\u5efa\u81ea\u5df1\u7684\u4e13\u8f91\u4e86\u3002\u6709\u4efb\u4f55\u5361\u70b9\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u628a\u4f60\u7684\u58f0\u97f3\u4f5c\u54c1\u6253\u78e8\u5230\u80fd\u63a5\u5355\u7684\u6c34\u5e73\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** (\u5339\u914d\u5176T3\u6b7b\u78d5\u5b66\u9738\u7279\u8d28\uff0c\u63d0\u4f9b\u624e\u5b9e\u3001\u4f53\u7cfb\u5316\u7684\u6280\u80fd\u6559\u5b66\u548c\u660e\u786e\u7684\u8fdb\u9636\u8def\u5f84)\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T3\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a**\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011** (\u5982\u4e13\u5c5e\u7b54\u7591\u65f6\u95f4\u3001\u52a0\u9910\u6280\u672f\u5206\u4eab)\uff1b**\u3010\u9879\u76ee\u5236\u5b9e\u6218\u5305\u3011** (\u5c3d\u65e9\u63d0\u4f9b\u771f\u5b9e\u7684\u3001\u6709\u53cd\u9988\u7684\u8ff7\u4f60\u9879\u76ee\uff0c\u5982\u77ed\u7bc7\u65c1\u767d\u5f55\u5236\uff0c\u6ee1\u8db3\u5176\u201c\u5b66\u4ee5\u81f4\u7528\u201d\u7684\u6210\u5c31\u611f)\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7edd\u4e0d\u5bf9T3\u5b66\u5458\u8fdb\u884c\u865a\u5047\u7684\u201c\u8f7b\u677e\u6708\u5165\u8fc7\u4e07\u201d\u5ba3\u4f20\uff1b\u7edd\u4e0d\u5728\u5176\u672a\u638c\u63e1\u57fa\u7840\u6280\u80fd\u65f6\u5c31\u8fc7\u5ea6\u63a8\u9001\u9ad8\u96be\u5ea6\u63a5\u5355\u4fe1\u606f\uff1b\u907f\u514d\u4f7f\u7528\u8fc7\u4e8e\u60c5\u611f\u5316\u3001\u4e0d\u4e13\u4e1a\u7684\u6c9f\u901a\u65b9\u5f0f\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u5fc5\u987b\u57fa\u4e8e\u6e05\u6670\u7684\u6280\u80fd\u8fdb\u9636\u548c\u53d8\u73b0\u8def\u5f84**\u3002\u5411\u5176\u63a8\u8350\u66f4\u9ad8\u9636\u8bfe\u7a0b\u65f6\uff0c\u9700\u63d0\u4f9b\u660e\u786e\u7684\u80fd\u529b\u5bf9\u6807\u6848\u4f8b\u548c\u53ef\u91cf\u5316\u7684\u6536\u76ca\u9884\u671f\uff0c\u6ee1\u8db3\u5176\u201c\u5b66\u9738\u201d\u5f0f\u7684\u7406\u6027\u51b3\u7b56\u9700\u6c42\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u4f1a\u5c3d\u5feb\u63d0\u5347\u81ea\u5df1\uff0c\u5c3d\u91cf\u4e0d\u62d6\u540e\u817f[\u61a8\u7b11]\u201d **(\u4f53\u73b0\u81ea\u5f8b\u3001\u8d23\u4efb\u611f\u548c\u5bf9\u878d\u5165\u96c6\u4f53\u7684\u6e34\u671b)**\n2. > \u201c\u7528\u4f60\u6807\u6ce8\u8fc7\u7684\u518d\u6765\u8bfb\uff0c\u5c42\u6b21\u611f\u4e00\u4e0b\u5c31\u4e0a\u6765\u4e86[\u61a8\u7b11] \u6211\u628a\u8fd9\u4e2a\u4fdd\u5b58\u8d77\u6765\u591a\u7ec3\u4e60\uff0c\u591a\u627e\u611f\u89c9\u201d **(\u4f53\u73b0\u5bf9\u4e13\u4e1a\u6307\u5bfc\u7684\u73cd\u89c6\u3001\u6b7b\u78d5\u7ec6\u8282\u7684\u5b66\u4e60\u6001\u5ea6)**\n3. > \u201c\u4eca\u665a\u4e0apia\u620f\u6211\u7528\u6cb3\u5357\u8bdd\u914d\u97f3\u5c0f\u9752\u7684\u89d2\u8272\uff0c\u89c9\u5f97\u5f88\u6709\u8da3\uff0c\u4e0b\u6765\u89c9\u5f97\u8f7b\u677e\u591a\u4e86\u201d **(\u4f53\u73b0\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u7684\u63a2\u7d22\u4e50\u8da3\u548c\u79ef\u6781\u5fc3\u6001\uff0c\u975e\u7eaf\u7cb9\u529f\u5229\u9a71\u52a8)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T3\u6b7b\u78d5\u5b66\u9738\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u5708\u5c42\u5f52\u5c5e\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u4e25\u683c\u5151\u73b0\u201c\u9884\u7559\u8d44\u6e90\u201d\u627f\u8bfa\uff0c\u5e76\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u6267\u884c\u7684\u8fdb\u9636\u8def\u5f84\u4e0e\u53ca\u65f6\u7684\u6b63\u53cd\u9988\u3011**\u3002\n\n```json\n{\"core_type\": \"T3 \u6b7b\u78d5\u5b66\u9738\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u5f52\u5c5e\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\"}\n```";
