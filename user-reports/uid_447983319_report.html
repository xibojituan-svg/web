        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 447983319 (\u6635\u79f0\uff1a\u4f59\u5bfb/\u4e91\u5bfb) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-06 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u7c7d\u83f2/\u4e4b\u7720(\u4f59\u6653\u4e3d)\u3001\u8d85\u8d85\u4e08\u4eba(\u9a6c\u4ec1\u8d85) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b (\u5df2\u8d2d\u4e70\u201c\u7cbe\u82f1\u201d\u73ed\u578b) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u5145\u88d5 (\u672a\u63d0\u53ca\u8d44\u91d1\u538b\u529b\uff0c\u76f4\u63a5\u652f\u4ed8) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u5de5\u4f5c\u7e41\u5fd9\uff0c\u5e38\u5e72\u5230\u665a\u4e0a9\u70b9\uff0c\u767d\u5929\u65f6\u95f4\u7d27\u5f20) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** (\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u60c5\u51b5\uff0c\u9700\u8b66\u60d5) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49** (\u5b66\u4e60\u884c\u4e3a\u4e0e\u4e92\u52a8\u53ef\u89c1\uff0c\u4f46\u5173\u952e\u5bb6\u5ead\u4e0e\u6df1\u5c42\u52a8\u673a\u4fe1\u606f\u4e0d\u8db3) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u5174\u8da3\u9a71\u52a8\u4e0e\u517c\u804c\u53d8\u73b0\u76ee\u7684\u6df7\u6742\uff0c\u5bf9\u6280\u80fd\u63d0\u5347\u6709\u8981\u6c42\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u6781\u901f\u53d8\u73b0\u7684\u8feb\u5207\u6027\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u672c\u8eab\u4e5f\u662f\u4e2a\u662f\u4e2a10\u5206\u5185\u5411\u7684\u4eba\uff0c\u4e5f\u60f3\u901a\u8fc7\u8fd9\u6b21\u5b66\u4e60\u63d0\u5347\u81ea\u5df1\u4ea4\u9645\u4fe1\u5fc3\u4e0e\u80fd\u529b\u3002\u201d (\u5174\u8da3\u4e0e\u81ea\u6211\u63d0\u5347)\n> \u201c\u662f\u5f97\u8981\u4e70\u8bbe\u5907\u554a\uff01\u201d (\u5bf9\u6295\u5165\u6709\u8ba4\u77e5\uff0c\u4f46\u672a\u8ffd\u95ee\u53d8\u73b0\u5468\u671f)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u76f4\u63a5\u652f\u4ed8\u8bfe\u7a0b\u8d39\u7528\uff0c\u5e76\u8003\u8651\u8d2d\u4e70\u8bbe\u5907\uff0c\u65e0\u660e\u663e\u8d44\u91d1\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 **\u4e3b\u8981\u77ed\u677f**\u3002\u5de5\u4f5c\u7e41\u5fd9\uff08\u201c\u8fd9\u4e24\u5468\u4e5f\u57fa\u672c\u4e0a\u5f97\u5e72\u52309\u70b9\u624d\u80fd\u7ed3\u675f\u201d\uff09\uff0c\u5b66\u4e60\u65f6\u95f4\u4f9d\u8d56\u665a\u4e0a\u548c\u788e\u7247\u65f6\u95f4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff0c\u9700\u540e\u7eed\u6838\u67e5\uff0c**\u5b58\u5728\u6f5c\u5728\u98ce\u9669**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9047\u5230\u56f0\u96be\uff08\u4f5c\u4e1a\u9700\u5f55\u591a\u904d\uff09\u65f6\uff0c\u5f52\u56e0\u4e8e\u81ea\u8eab\u52aa\u529b\u4e0d\u8db3\uff0c\u5e76\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff08\u770b\u56de\u653e\u3001\u591a\u7ec3\uff09\uff0c\u672a\u8868\u73b0\u51fa\u62b1\u6028\u6216\u4f9d\u8d56\u5b89\u629a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u89c9\u5f97\u81ea\u5df1\u8fd8\u662f\u5f97\u591a\u7ec3\u7ec3\uff0c\u50cf\u6628\u5929\u7684\u4f5c\u4e1a\u6211\u662f\u5f55\u4e86\u597d\u51e0\u904d\u624d\u89c9\u5f97\u6ee1\u610f\u4e00\u70b9\u4e86\u3002\u201d (\u79ef\u6781\u5f52\u56e0\uff0c\u4e3b\u52a8\u52aa\u529b)\n> \u201c\u603b\u7b97\u901a\u8fc7\u4e86[\u6d41\u6cea] \u90a3\u5f55\u97f3\u5f55\u4e86\u597d\u51e0\u904d[\u6d41\u6cea]\u201d (\u514b\u670d\u56f0\u96be\u540e\u7684\u6210\u5c31\u611f\uff0c\u800c\u975e\u62b1\u6028)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42 & \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5185\u5411\u5bfc\u81f4\u7684\u793e\u4ea4\u4fe1\u5fc3\u4e0d\u8db3\u4e0e\u81ea\u6211\u4ef7\u503c\u611f\u7f3a\u5931**\u3002\u4ed6\u660e\u786e\u8868\u793a\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u63d0\u5347\u201c\u4ea4\u9645\u4fe1\u5fc3\u4e0e\u80fd\u529b\u201d\uff0c\u5e76\u5728\u81ea\u6211\u4ecb\u7ecd\u65f6\u611f\u5230\u56f0\u96be\u3002\u5176\u5b66\u4e60\u52a8\u529b\u4e0d\u4ec5\u6e90\u4e8e\u6280\u80fd\uff0c\u66f4\u6e90\u4e8e\u5bf9\u201c\u88ab\u770b\u89c1\u201d\u3001\u201c\u88ab\u8ba4\u53ef\u201d\u548c\u5efa\u7acb\u793e\u4f1a\u8fde\u63a5\u7684\u6e34\u671b\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u793e\u7fa4\u5f52\u5c5e\u611f\u4e0e\u9636\u6bb5\u6027\u6210\u5c31\u7684\u5373\u65f6\u80af\u5b9a**\u3002\u4ed6\u9700\u8981\u5728\u4e00\u4e2a\u5b89\u5168\u3001\u9f13\u52b1\u7684\u73af\u5883\u4e2d\uff0c\u901a\u8fc7\u5b8c\u6210\u5177\u4f53\u4efb\u52a1\uff08\u5982\u4f5c\u4e1a\u3001\u8bd5\u97f3\uff09\u83b7\u5f97\u540c\u4f34\u548c\u8001\u5e08\u7684\u8ba4\u53ef\uff0c\u4ece\u800c\u5efa\u7acb\u81ea\u4fe1\uff0c\u6ee1\u8db3\u5176\u5c0a\u91cd\u4e0e\u793e\u4ea4\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u52a8\u673a\u4e2d\u7b49\u3001\u8d44\u6e90\u4e2d\u7b49\u3001\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u6709\u660e\u786e\u5b66\u4e60\u884c\u4e3a) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u6838\u5fc3\u7279\u5f81\uff1a\u4e0d\u5f20\u626c\uff0c\u9ed8\u9ed8\u52aa\u529b\u5b8c\u6210\u4f5c\u4e1a\u548c\u4efb\u52a1\uff0c\u9047\u5230\u95ee\u9898\u503e\u5411\u4e8e\u81ea\u6211\u89e3\u51b3\u548c\u53cd\u590d\u7ec3\u4e60\uff0c\u8ffd\u6c42\u6280\u80fd\u7cbe\u8fdb\u548c\u5185\u5728\u80af\u5b9a) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5c5e\u53cd\u5bf9\u8ff9\u8c61\u3002**\u4f46\u5bb6\u5ead\u652f\u6301\u5ea6\u4fe1\u606f\u7f3a\u5931\uff0c\u9700\u5728\u540e\u7eed\u670d\u52a1\u4e2d\u6e29\u548c\u63a2\u67e5**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | **\u4fe1\u606f\u7f3a\u5931\uff0c\u9700\u6838\u67e5**\u3002\u82e5\u5b58\u5728\u9690\u7792\u6216\u53cd\u5bf9\uff0c\u53ef\u80fd\u6210\u4e3a\u9690\u60a3\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u56e0\u5de5\u4f5c\u7e41\u5fd9\uff08\u665a9\u70b9\u4e0b\u73ed\uff09\uff0c\u53ef\u80fd\u65e0\u6cd5\u8ddf\u4e0a\u76f4\u64ad\u3001\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\uff0c\u4ea7\u751f\u79ef\u538b\u548c\u81ea\u8d23\uff0c\u6700\u7ec8\u56e0\u201c\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\u201d\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u81ea\u6211\u8c03\u8282\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u56f0\u96be\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u3001\u4f5c\u4e1a\u96be\u5ea6\uff09\u76f4\u63a5\u7834\u9632\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4f4e** | \u672a\u8868\u73b0\u51fa\u5bf9\u77ed\u671f\u53d8\u73b0\u7684\u5f3a\u70c8\u6267\u5ff5\uff0c\u66f4\u5173\u6ce8\u5b66\u4e60\u8fc7\u7a0b\u4e0e\u81ea\u6211\u63d0\u5347\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c2-4\u5468**\u3002\u6b64\u65f6\u8bfe\u7a0b\u96be\u5ea6\u548c\u4f5c\u4e1a\u91cf\u589e\u52a0\uff0c\u82e5\u5176\u56e0\u5de5\u4f5c\u7e41\u5fd9\u65e0\u6cd5\u8ddf\u4e0a\uff0c\u7d2f\u79ef\u7684\u632b\u8d25\u611f\u548c\u8fdb\u5ea6\u538b\u529b\u53ef\u80fd\u8fbe\u5230\u5cf0\u503c\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4f59\u5bfb\u4f60\u597d\uff0c\u770b\u5230\u4f60\u4e4b\u524d\u63d0\u5230\u5de5\u4f5c\u6bd4\u8f83\u5fd9\uff0c\u7ecf\u5e38\u5230\u665a\u4e0a9\u70b9\u3002\u54b1\u4eec\u7684\u8bfe\u7a0b\u8bbe\u8ba1\u548c\u4f5c\u4e1a\u63d0\u4ea4\u90fd\u975e\u5e38\u7075\u6d3b\uff0c\u5b8c\u5168\u53ef\u4ee5\u6839\u636e\u4f60\u7684\u65f6\u95f4\u8282\u594f\u6765\u3002**\u91cd\u70b9\u662f\u6bcf\u4e00\u6b65\u7684\u638c\u63e1\uff0c\u800c\u4e0d\u662f\u8ffd\u8d76\u901f\u5ea6\u3002** \u6709\u4efb\u4f55\u65f6\u95f4\u5b89\u6392\u4e0a\u7684\u56f0\u96be\uff0c\u968f\u65f6\u544a\u8bc9\u6211\uff0c\u6211\u4eec\u4e00\u8d77\u8c03\u6574\u8ba1\u5212\u3002\u4f60\u4e4b\u524d\u2018\u5f55\u597d\u51e0\u904d\u2019\u7684\u8ba4\u771f\u52b2\u513f\u7279\u522b\u68d2\uff0c\u8fd9\u79cd\u2018\u6b7b\u78d5\u2019\u7cbe\u795e\u6b63\u662f\u5b66\u597d\u6f14\u64ad\u6700\u9700\u8981\u7684\uff0c\u54b1\u4eec\u6162\u6162\u6765\uff0c\u7a33\u624e\u7a33\u6253\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** (\u5339\u914dT2\u4f4e\u8c03\u5b9e\u5e72\u578b\u5bf9\u786c\u6838\u6280\u80fd\u7684\u8ffd\u6c42)\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u3010\u65f6\u95f4\u7ba1\u7406\u8f85\u52a9\u5305\u3011** (\u63d0\u4f9b\u5f55\u64ad\u8bfe\u91cd\u70b9\u5207\u7247\u3001\u4f5c\u4e1a\u5f39\u6027\u63d0\u4ea4\u65b9\u6848\u3001\u788e\u7247\u65f6\u95f4\u7ec3\u4e60\u6307\u5357)\uff1b**\u3010\u793e\u7fa4\u8f7b\u5ea6\u4e92\u52a8\u5305\u3011** (\u9f13\u52b1\u5176\u5728\u611f\u5230\u8212\u9002\u7684\u8303\u56f4\u5185\u53c2\u4e0e\u7fa4\u804a\uff0c\u83b7\u5f97\u540c\u4f34\u8ba4\u53ef\uff0c\u6ee1\u8db3\u793e\u4ea4\u9700\u6c42)\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u65bd\u52a0\u8fc7\u5f3a\u7684\u65f6\u95f4\u538b\u529b**\uff0c\u7528\u201c\u522b\u4eba\u90fd\u4ea4\u4e86\u201d\u6765\u50ac\u4fc3\u4ed6\u30022. **\u5ffd\u89c6\u5176\u65f6\u95f4\u56f0\u5883**\uff0c\u5f3a\u884c\u8981\u6c42\u53c2\u52a0\u6240\u6709\u76f4\u64ad\u30023. **\u7ed9\u4e88\u7a7a\u6d1e\u7684\u8868\u626c**\uff0c\u53cd\u9988\u9700\u5177\u4f53\u5230\u5176\u4f5c\u4e1a\u7684\u8fdb\u6b65\u70b9\uff08\u5982\u201c\u8fd9\u6b21\u91cd\u97f3\u5904\u7406\u6bd4\u4e0a\u6b21\u51c6\u786e\u591a\u4e86\u201d\uff09\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u9700\u7ed1\u5b9a\u201c\u65f6\u95f4\u53ef\u884c\u6027\u201d**\u3002\u5728\u63a8\u8350\u9ad8\u9636\u8bfe\u7a0b\u6216\u8bbe\u5907\u65f6\uff0c\u5fc5\u987b\u4e0e\u5176\u5171\u540c\u89c4\u5212\u65f6\u95f4\u6295\u5165\uff0c\u786e\u4fdd\u5176\u5de5\u4f5c\u751f\u6d3b\u80fd\u627f\u8f7d\uff0c\u907f\u514d\u56e0\u201c\u6ca1\u65f6\u95f4\u5b66\u201d\u800c\u4ea7\u751f\u8d1f\u7f6a\u611f\u548c\u9000\u8d39\u5ff5\u5934\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u672c\u8eab\u4e5f\u662f\u4e2a\u662f\u4e2a10\u5206\u5185\u5411\u7684\u4eba\uff0c\u4e5f\u60f3\u901a\u8fc7\u8fd9\u6b21\u5b66\u4e60\u63d0\u5347\u81ea\u5df1\u4ea4\u9645\u4fe1\u5fc3\u4e0e\u80fd\u529b\u3002\u201d **(\u66b4\u9732\u6838\u5fc3\u793e\u4ea4\u4e0e\u5c0a\u91cd\u9700\u6c42)**\n2. > \u201c\u6211\u89c9\u5f97\u81ea\u5df1\u8fd8\u662f\u5f97\u591a\u7ec3\u7ec3\uff0c\u50cf\u6628\u5929\u7684\u4f5c\u4e1a\u6211\u662f\u5f55\u4e86\u597d\u51e0\u904d\u624d\u89c9\u5f97\u6ee1\u610f\u4e00\u70b9\u4e86\u3002\u201d **(\u5c55\u73b0T2\u5b9e\u5e72\u7279\u8d28\u4e0e\u9ad8\u5fc3\u7406\u5f39\u6027)**\n3. > \u201c\u8fd9\u4e24\u5468\u4e5f\u57fa\u672c\u4e0a\u5f97\u5e72\u52309\u70b9\u624d\u80fd\u7ed3\u675f\u201d **(\u66b4\u9732\u8d44\u6e90\u5e95\u5ea7\u4e2d\u7684\u65f6\u95f4\u77ed\u677f\uff0c\u662f\u4e3b\u8981\u98ce\u9669\u70b9)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2\u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u793e\u4ea4\u4fe1\u5fc3\u4e0e\u5c0a\u91cd\u8ba4\u53ef**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u6781\u5ea6\u7075\u6d3b\u7684\u65f6\u95f4\u5b89\u6392\u65b9\u6848\u4e0e\u5177\u4f53\u3001\u771f\u8bda\u7684\u6280\u80fd\u53cd\u9988\uff0c\u4e25\u9632\u5176\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u7d2f\u79ef\u632b\u8d25\u611f**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u793e\u4ea4\u4e0e\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u65f6\u95f4\u7ba1\u7406\u8f85\u52a9\u5305\"}\n```";
