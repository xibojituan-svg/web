        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676927127 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-11 \u81f3 2026-03-28 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u76f8\u4f34\u4e0e\u58f0(\u96f7\u743c\u743c)\u3001\u6c99\u59dc1/\u51ac\u51ac\u8001\u5e08(\u59da\u6021\u537f) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u5f20\u9707\u8001\u5e08\u5b9e\u6218\u8425\uff08\u4ef7\u683c\u672a\u77e5\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | [\u4fe1\u606f\u7f3a\u5931] |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | [\u4fe1\u606f\u7f3a\u5931] |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | [\u4fe1\u606f\u7f3a\u5931] |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** - \u7f3a\u4e4f\u652f\u4ed8\u80fd\u529b\u3001\u5bb6\u5ead\u652f\u6301\u3001\u65f6\u95f4\u5b89\u6392\u7b49\u5173\u952e\u4fe1\u606f\uff0c\u7528\u6237\u4e3b\u52a8\u8868\u8fbe\u6781\u5c11\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u8868\u73b0\u51fa\u5b66\u4e60\u610f\u613f\u548c\u6280\u80fd\u7126\u8651\uff0c\u4f46\u672a\u660e\u786e\u8868\u8fbe\u5f3a\u70c8\u7684\u3001\u6025\u8feb\u7684\u53d8\u73b0\u8bc9\u6c42\u3002\u5176\u52a8\u673a\u6df7\u6742\u4e86\u5174\u8da3\u3001\u81ea\u6211\u63d0\u5347\u548c\u6f5c\u5728\u7684\u526f\u4e1a\u53ef\u80fd\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u73ed\u73ed\uff0c\u8fd9\u662f\u53cd\u9988\uff0c\u6211\u7684\u6c14\u606f\u8fd8\u662f\u7ec3\u7684\u4e0d\u597d\u600e\u4e48\u52a0\u5f3a\u201d > \u201c\u8fd8\u6709\u6211\u8001\u662f\u627e\u4e0d\u5230\u6587\u672c\u7684\u91cd\u70b9\uff0c\u4e2d\u5fc3\u610f\u601d\u3002\u4e0d\u77e5\u9053\u8be5\u7528\u4ec0\u4e48\u4ec0\u4e48\u8bed\u6c14\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 \u65e0\u4efb\u4f55\u652f\u4ed8\u3001\u6536\u5165\u3001\u7ecf\u6d4e\u72b6\u51b5\u4fe1\u606f\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 \u65e0\u4efb\u4f55\u5173\u4e8e\u5de5\u4f5c\u3001\u5bb6\u5ead\u3001\u65e5\u5e38\u65f6\u95f4\u5b89\u6392\u7684\u63cf\u8ff0\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 \u65e0\u4efb\u4f55\u5173\u4e8e\u5bb6\u5ead\u6216\u51b3\u7b56\u73af\u5883\u7684\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b07\u4f4e\u6781\u5371]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u7528\u6237\u4e3b\u52a8\u66b4\u9732\u5b66\u4e60\u4e2d\u7684\u632b\u8d25\u611f\uff08\u201c\u611f\u89c9\u81ea\u5df1\u4e0d\u592a\u884c\u201d\uff09\uff0c\u5e76\u76f4\u63a5\u5411\u73ed\u4e3b\u4efb\u5bfb\u6c42\u5177\u4f53\u95ee\u9898\u7684\u89e3\u51b3\u65b9\u6848\uff0c\u8868\u73b0\u51fa\u5bf9\u6743\u5a01\u6307\u5bfc\u7684\u9ad8\u5ea6\u4f9d\u8d56\u548c\u8f83\u4f4e\u7684\u81ea\u6211\u6548\u80fd\u611f\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u611f\u89c9\u81ea\u5df1\u4e0d\u592a\u884c\u201d > \u201c\u73ed\u73ed\uff0c\u8fd9\u662f\u53cd\u9988\uff0c\u6211\u7684\u6c14\u606f\u8fd8\u662f\u7ec3\u7684\u4e0d\u597d\u600e\u4e48\u52a0\u5f3a\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u81ea\u8eab\u80fd\u529b\u6781\u5ea6\u4e0d\u81ea\u4fe1\uff0c\u5bb3\u6015\u6295\u5165\u540e\u5931\u8d25\uff0c\u6e34\u671b\u83b7\u5f97\u8ba4\u53ef\u548c\u5f52\u5c5e\u611f\uff0c\u4ee5\u8bc1\u660e\u81ea\u5df1\u7684\u4ef7\u503c\u3002**\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6301\u7eed\u7684\u3001\u5177\u4f53\u7684\u3001\u624b\u628a\u624b\u7684\u80af\u5b9a\u4e0e\u9f13\u52b1\uff0c\u6784\u5efa\u4e00\u4e2a\u201c\u88ab\u63a5\u7eb3\u3001\u88ab\u652f\u6301\u3001\u88ab\u770b\u89c1\u201d\u7684\u5b89\u5168\u5b66\u4e60\u73af\u5883\uff0c\u5e2e\u52a9\u5176\u5efa\u7acb\u201c\u6211\u80fd\u884c\u201d\u7684\u4fe1\u5ff5\u3002**\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1** \u7c7b (\u52a8\u673a\u4e2d\u7b49\u4f46\u5fc3\u7406\u5f39\u6027\u6781\u4f4e\uff0c\u8d44\u6e90\u4fe1\u606f\u5168\u65e0\uff0c\u98ce\u9669\u6781\u9ad8) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1] (\u56e0\u5173\u952e\u652f\u4ed8\u4e0e\u5bb6\u5ead\u4fe1\u606f\u7f3a\u5931\uff0c\u65e0\u6cd5\u5224\u5b9a\u662f\u5426\u89e6\u53ca\u501f\u8d37\u3001\u7edd\u5883\u7b49\u7ea2\u7ebf)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a[\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad]\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | [\u4fe1\u606f\u7f3a\u5931] | [\u4fe1\u606f\u7f3a\u5931] |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | [\u4fe1\u606f\u7f3a\u5931] | [\u4fe1\u606f\u7f3a\u5931] |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | **\u5b66\u4e60\u9047\u5230\u7b2c\u4e00\u4e2a\u5b9e\u8d28\u6027\u74f6\u9888\uff08\u5982\u4f5c\u4e1a\u88ab\u6279\u3001\u8bd5\u97f3\u5931\u8d25\uff09\u65f6\uff0c\u56e0\u201c\u611f\u89c9\u81ea\u5df1\u4e0d\u884c\u201d\u800c\u5f7b\u5e95\u653e\u5f03\uff0c\u5e76\u5c06\u632b\u8d25\u611f\u5f52\u548e\u4e8e\u8bfe\u7a0b\u65e0\u6548\u3002** |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u5b66\u4e60\u4e00\u6bb5\u65f6\u95f4\u540e\uff0c\u53d1\u73b0\u6280\u80fd\u63d0\u5347\u7f13\u6162\uff0c\u4e0e\u9500\u552e\u63cf\u7ed8\u7684\u201c\u5feb\u901f\u53d8\u73b0\u201d\u84dd\u56fe\u4ea7\u751f\u5de8\u5927\u843d\u5dee\uff0c\u611f\u5230\u88ab\u6b3a\u9a97\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468\uff0c\u7b2c\u4e00\u6b21\u72ec\u7acb\u5b8c\u6210\u4f5c\u4e1a\u5e76\u83b7\u5f97\u8be6\u7ec6\u70b9\u8bc4\u540e\uff0c\u6216\u7b2c\u4e00\u6b21\u5c1d\u8bd5\u8bd5\u97f3\u5931\u8d25\u65f6\u3002**\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6653\u98ce\u540c\u5b66\uff0c\u6211\u770b\u5230\u4f60\u4e4b\u524d\u95ee\u8fc7\u6c14\u606f\u548c\u6587\u672c\u5206\u6790\u7684\u95ee\u9898\uff0c\u8bf4\u660e\u4f60\u5b66\u5f97\u975e\u5e38\u8ba4\u771f\uff0c\u5df2\u7ecf\u5728\u601d\u8003\u66f4\u6df1\u5c42\u7684\u4e1c\u897f\u4e86\uff0c\u8fd9\u7279\u522b\u597d\uff01\u54b1\u4eec\u8fd9\u4e2a\u8bad\u7ec3\u8425\uff0c\u6700\u91cd\u8981\u7684\u4e0d\u662f\u4e00\u5f00\u59cb\u5c31\u505a\u5230\u5b8c\u7f8e\uff0c\u800c\u662f\u770b\u5230\u81ea\u5df1\u6bcf\u4e00\u6b21\u5fae\u5c0f\u7684\u8fdb\u6b65\u3002\u73ed\u73ed\u4f1a\u4e00\u76f4\u966a\u7740\u4f60\uff0c\u6709\u4efb\u4f55\u5361\u4f4f\u7684\u5730\u65b9\uff0c\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u628a\u5b83\u62c6\u89e3\u6389\u3002\u8bb0\u4f4f\uff0c\u5728\u8fd9\u91cc\uff0c\u4f60\u7684\u6bcf\u4e00\u4e2a\u95ee\u9898\u90fd\u503c\u5f97\u88ab\u8ba4\u771f\u5bf9\u5f85\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u8f6f\u6027\u7597\u6108\u966a\u5b66\u7ebf**\u3011 - \u6838\u5fc3\u76ee\u6807\u662f\u5efa\u7acb\u81ea\u4fe1\u548c\u5b89\u5168\u611f\uff0c\u800c\u975e\u6025\u4e8e\u53d8\u73b0\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u6302\u8f7d\u3010**1v1\u4fdd\u59c6\u5f0f\u7b54\u7591\u5305**\u3011\u548c\u3010**\u5c0f\u6b65\u5feb\u8dd1\u9f13\u52b1\u5305**\u3011\uff08\u5982\uff1a\u5b8c\u6210\u57fa\u7840\u7ec3\u4e60\u5373\u7ed9\u4e88\u52cb\u7ae0/\u8868\u626c\uff0c\u964d\u4f4e\u4efb\u52a1\u96be\u5ea6\u9608\u503c\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u5728\u521d\u671f\u7ed9\u4e88\u8fc7\u9ad8\u96be\u5ea6\u7684\u4efb\u52a1\u6216\u65bd\u52a0\u201c\u63a5\u5355\u201d\u538b\u529b\u30022. \u4f7f\u7528\u5bf9\u6bd4\u6027\u8bed\u8a00\uff08\u5982\u201c\u522b\u4eba\u90fd\u80fd\u505a\u5230\uff0c\u4f60\u600e\u4e48\u4e0d\u884c\u201d\uff09\u30023. \u5ffd\u89c6\u5176\u60c5\u7eea\u53cd\u9988\uff0c\u53ea\u8bb2\u6280\u672f\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u7528\u6237\u5efa\u7acb\u7a33\u5b9a\u81ea\u4fe1\u548c\u5b8c\u6210\u57fa\u7840\u5b66\u4e60\u5468\u671f\u524d\uff0c\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u53ef\u80fd\u6210\u4e3a\u538b\u57ae\u5176\u5fc3\u7406\u9632\u7ebf\u7684\u6700\u540e\u4e00\u6839\u7a3b\u8349\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u73ed\u73ed\uff0c\u8fd9\u662f\u53cd\u9988\uff0c\u6211\u7684\u6c14\u606f\u8fd8\u662f\u7ec3\u7684\u4e0d\u597d\u600e\u4e48\u52a0\u5f3a\u201d\n2. > \u201c\u8fd8\u6709\u6211\u8001\u662f\u627e\u4e0d\u5230\u6587\u672c\u7684\u91cd\u70b9\uff0c\u4e2d\u5fc3\u610f\u601d\u3002\u4e0d\u77e5\u9053\u8be5\u7528\u4ec0\u4e48\u4ec0\u4e48\u8bed\u6c14\u201d\n3. > \u201c\u611f\u89c9\u81ea\u5df1\u4e0d\u592a\u884c\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6\u60c5\u7eea\u5de8\u5a74\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u4e0e\u5f52\u5c5e\u611f\uff0c\u4ee5\u514b\u670d\u81ea\u5351\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5728\u4ea4\u4ed8\u524d\u671f\u63d0\u4f9b\u8d85\u9ad8\u9891\u3001\u8d85\u5177\u4f53\u7684\u60c5\u7eea\u5b89\u629a\u4e0e\u624b\u628a\u624b\u6559\u5b66\uff0c\u4e25\u9632\u5176\u56e0\u201c\u4e60\u5f97\u6027\u65e0\u52a9\u201d\u800c\u5d29\u6e83\u9000\u8d39\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5c0a\u91cd\u5f52\u5c5e\", \"target_product_line\": \"\u8f6f\u6027\u7597\u6108\u966a\u5b66\u7ebf\"}\n```";
