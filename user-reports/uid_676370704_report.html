        const markdownText = "# \ud83d\udd0d \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676370704 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-02-06 \u81f3 2026-03-06 |\n| **\u5bf9\u8bdd\u5bf9\u8c61** | \u9500\u552e/\u73ed\u4e3b\u4efb\uff1a\u5c0f\u5976\u6a58\u5440(\u90ed\u5c11\u5a55)\u3001\u60ca\u8273\u73ed\u73ed(\u738b\u6653\u6770) |\n| **\u8d2d\u4e70\u4ea7\u54c1** | \u6709\u58f0\u4e66\u540e\u671f\u8fdb\u9636\u8bfe\uff08\u63a8\u6d4b\uff09 |\n| **\u652f\u4ed8\u65b9\u5f0f** | \u672a\u77e5\uff08\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff09 |\n| **\u5de5\u4f5c\u5236\u5ea6** | \u672a\u77e5\uff08\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff09 |\n| **\u5bb6\u5ead\u51b3\u7b56\u6743** | \u672a\u77e5\uff08\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff09 |\n| **\u6210\u4ea4\u573a\u666f** | \u672a\u77e5\uff08\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff09 |\n| **\u9000\u8d39\u5386\u53f2** | \u65e0\uff08\u4f46\u66fe\u77ed\u6682\u8003\u8651\u9000\u8bfe/\u6362\u8bfe\uff09 |\n| **\u4fe1\u606f\u5b8c\u6574\u5ea6** | **\u90e8\u5206\u7f3a\u5931**\uff08\u5173\u952e\u7ef4\u5ea6\u5982\u652f\u4ed8\u3001\u65f6\u95f4\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e\uff09 |\n\n---\n\n## \u4e8c\u3001\u8f6c\u5316\u524d\u5fc5\u95ee\u4e09\u95ee\u6838\u9a8c\n\n> \u5f15\u64ce\u89c4\u5b9a\uff1a\u73ed\u4e3b\u4efb\u5728\u8f6c\u5316\u524d\u5fc5\u987b\u6838\u9a8c\u4ee5\u4e0b\u4e09\u95ee\uff0c\u6b64\u5904\u5ba1\u67e5\u804a\u5929\u4e2d\u662f\u5426\u51fa\u73b0\u76f8\u5173\u4fe1\u606f\u3002\n\n| \u5fc5\u95ee\u95ee\u9898 | \u662f\u5426\u5df2\u6838\u9a8c | \u7528\u6237\u56de\u7b54\u6458\u8981 | \u98ce\u9669\u4fe1\u53f7 |\n|---|---|---|---|\n| Q1 \u5bb6\u5ead\u6838\u67e5\uff1a\"\u5bb6\u91cc\u4eba\u77e5\u9053\u5417\uff1f\u652f\u6301\u5417\uff1f\" | **\u672a\u6838\u9a8c** | > \u65e0\u76f8\u5173\u4fe1\u606f | **\u76f2\u533a** |\n| Q2 \u65f6\u95f4\u6838\u67e5\uff1a\"\u665a\u4e0a\u51e0\u70b9\u6709\u7a7a\uff1f\u56fa\u5b9a\u73ed\u8fd8\u662f\u5012\u73ed\uff1f\" | **\u672a\u6838\u9a8c** | > \u65e0\u76f8\u5173\u4fe1\u606f | **\u76f2\u533a** |\n| Q3 \u8d44\u91d1\u6838\u67e5\uff1a\"\u81ea\u5df1\u7684\u94b1\u8fd8\u662f\u82b1\u5457/\u4fe1\u7528\u5361\u5206\u671f\uff1f\" | **\u672a\u6838\u9a8c** | > \u65e0\u76f8\u5173\u4fe1\u606f | **\u76f2\u533a** |\n\n\u26a0\ufe0f **\u672a\u6838\u9a8c\u9879 = \u76f2\u533a**\uff1a\u73ed\u4e3b\u4efb\u672a\u5728\u804a\u5929\u4e2d\u4e3b\u52a8\u8be2\u95ee\u4e0a\u8ff0\u95ee\u9898\uff0c\u5bf9\u5e94\u7ef4\u5ea6\u7684\u5224\u65ad\u7f6e\u4fe1\u5ea6\u81ea\u52a8\u964d\u4f4e\u4e00\u7ea7\u3002\n\n---\n\n## \u4e09\u3001\u4e09\u8f74\u8bc4\u7ea7\n\n### \u8f741\uff1a\u52a8\u673a\u7eaf\u5ea6 \u2192 \u2b06\u9ad8\n\n| \u4fe1\u53f7 | \u8bc1\u636e\u6458\u5f55 |\n|---|---|\n| \u7b2c\u4e00\u53e5\u8bdd\u7684\u95ee\u9898\u5c42\u6b21 | > \u804a\u5929\u8bb0\u5f55\u59cb\u4e8e\u6280\u672f\u64cd\u4f5c\u95ee\u9898\uff0c\u5173\u6ce8\u201c\u600e\u4e48\u4e0b\u8f7d\u97f3\u4e50\u201d\u3001\u201cAU\u5b89\u88c5\u5bc6\u7801\u201d\u3001\u201c\u5305\u7edc\u7ebf\u600e\u4e48\u7528\u201d\u7b49\u3002 |\n| \u53d8\u73b0\u9884\u671f\u65f6\u95f4\u7ebf | **\u957f\u671f/\u65e0\u660e\u786e\u53d8\u73b0\u538b\u529b** \u2014 \u7528\u6237\u63d0\u5230\u201c\u6211\u672c\u6765\u76ee\u6807\u9760\u540e\u671f\u5165\u4e07\u7684\uff0c\u8fd9\u4e24\u5929\u89c9\u5f97\u51e0\u5343\u4e5f\u80fd\u63a5\u53d7\u201d\uff0c\u8868\u660e\u9884\u671f\u5408\u7406\u4e14\u53ef\u8c03\u6574\uff0c\u65e0\u77ed\u671f\u53d8\u73b0\u538b\u529b\u3002 |\n| \u5bf9\u786e\u5b9a\u6027\u7684\u4f9d\u8d56 | **\u4e0d\u5f3a\u6c42** \u2014 \u672a\u8981\u6c42\u4fdd\u5e95\u627f\u8bfa\uff0c\u5173\u6ce8\u70b9\u5728\u5b66\u4e60\u8fc7\u7a0b\u548c\u6280\u672f\u7ec6\u8282\u3002 |\n| \u5174\u8da3\u9a71\u52a8\u7a0b\u5ea6 | **\u5185\u5728\u5174\u8da3\u9a71\u52a8** \u2014 \u4e3b\u52a8\u5206\u4eab\u97f3\u4e50\u3001\u8ba8\u8bba\u52a8\u6f2b\u3001\u79ef\u6781\u5b8c\u6210\u4f5c\u4e1a\u3001\u4e3b\u52a8\u63d0\u95ee\u6280\u672f\u95ee\u9898\uff08\u5982\u5e73\u884c\u538b\u7f29\u4f5c\u7528\uff09\u3002 |\n\n**\u5224\u5b9a\u4f9d\u636e**\uff1a\u7528\u6237\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u5185\u5728\u5b66\u4e60\u5174\u8da3\u548c\u6280\u80fd\u63d0\u5347\u5bfc\u5411\uff0c\u5173\u6ce8\u8bfe\u7a0b\u5185\u5bb9\u672c\u8eab\uff0c\u5bf9\u53d8\u73b0\u6709\u5408\u7406\u9884\u671f\u4e14\u4e0d\u6025\u4e8e\u6c42\u6210\u3002\n\n### \u8f742\uff1a\u8d44\u6e90\u5e95\u5ea7 \u2192 \u27a1\u4e2d\n\n| \u5b50\u7ef4\u5ea6 | \u8bc4\u7ea7 | \u5b9e\u8bc1\u91cf\u5316\u951a\u70b9 | \u8bc1\u636e\u6458\u5f55 |\n|---|---|---|---|\n| \ud83d\udcb0 \u8d44\u91d1 | **\u4e2d** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u65e0\u8d1f\u9762\u4fe1\u53f7\u3002\u66fe\u8003\u8651\u9000/\u6362\u8fdb\u9636\u8bfe\uff0c\u53ef\u80fd\u5bf9\u4ef7\u683c\u654f\u611f\uff0c\u4f46\u672a\u63d0\u53ca\u7ecf\u6d4e\u56f0\u96be\u3002 | > \u201c\u6211\u6709\u70b9\u60f3\u9000\u6389\u8fdb\u9636\u8bfe\u201d |\n| \u23f1 \u65f6\u95f4 | **\u4e2d** | \u4fe1\u606f\u4e0d\u8db3\u3002\u7528\u6237\u80fd\u53c2\u4e0e\u665a\u95f4\u76f4\u64ad\uff08\u201c\u51c6\u65f6\u8fdb\u201d\uff09\uff0c\u4f46\u672a\u63d0\u53ca\u5177\u4f53\u5de5\u4f5c\u5236\u5ea6\u3002\u6625\u8282\u671f\u95f4\u56de\u8001\u5bb6\uff0c\u6709\u957f\u9014\u9a7e\u9a76\u65f6\u95f4\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u65f6\u95f4\u81ea\u4e3b\u6027\u3002 | > \u201c\u51c6\u65f6\u8fdb[\u52a0\u6cb9]\u201d <br> > \u201c\u6211\u73b0\u5728\u8fd8\u5835\u5728\u9ad8\u901f\u4e0a\uff0c\u6211\u662f\u6628\u665a\u4e0a\u5f00\u59cb\u8fd4\u7a0b\u5e7f\u4e1c\u201d |\n| \ud83e\udde0 \u7cbe\u529b | **\u9ad8** | \u5b66\u4e60\u81ea\u4fe1+\u6570\u5b57\u5316\u719f\u7ec3+\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\u3002\u80fd\u72ec\u7acb\u5b89\u88c5AU\u3001\u5904\u7406\u786c\u76d8\u3001\u5bfb\u627e\u514d\u8d39\u8d44\u6e90\uff0c\u9047\u5230\u6280\u672f\u95ee\u9898\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\u3002 | > \u201c\u4e0b\u5348\u521a\u88c5\u597d\u201d <br> > \u201c\u6211\u8981\u8bd5\u8bd5\u5176\u4ed6\u514d\u8d39\u7684\u3002\u575a\u51b3\u4e0d\u82b1\u91d1\u5e01\u201d <br> > \u9891\u7e41\u63d0\u95ee\u6280\u672f\u7ec6\u8282 |\n| \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u51b3\u7b56\u6743 | **\u672a\u77e5** | \u4fe1\u606f\u4e0d\u8db3\u3002\u672a\u63d0\u53ca\u5bb6\u4eba\u3002 | \u65e0\u76f8\u5173\u4fe1\u606f |\n\n\u26a1 **\u5e95\u5ea7\u53d6\u77ed\u677f** \u2192 \u6700\u7ec8\u8bc4\u7ea7 = **\u4e2d**\uff08\u77ed\u677f\u7ef4\u5ea6\uff1a**\u8d44\u91d1\u3001\u65f6\u95f4\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u4e0d\u8db3\uff0c\u6309\u4fdd\u5b88\u539f\u5219\u53d6\u4e2d**\uff09\n\n### \u8f743\uff1a\u5fc3\u7406\u5f39\u6027 \u2192 \u2b06\u9ad8\n\n| \u4fe1\u53f7 | \u8bc1\u636e\u6458\u5f55 |\n|---|---|\n| \u9047\u5230\u95ee\u9898\u65f6\u7684\u7b2c\u4e00\u53cd\u5e94 | > **\u81ea\u6211\u5f52\u56e0\uff0c\u4e3b\u52a8\u60f3\u529e\u6cd5\u89e3\u51b3** \u2014 \u7f51\u7edc\u5361\u987f\u3001\u8f6f\u4ef6\u5b89\u88c5\u95ee\u9898\u3001\u4f5c\u4e1a\u96be\u9898\u65f6\uff0c\u7528\u6237\u7b2c\u4e00\u53cd\u5e94\u662f\u5c1d\u8bd5\u89e3\u51b3\u6216\u5e7d\u9ed8\u81ea\u5632\uff0c\u800c\u975e\u62b1\u6028\u6216\u5f52\u548e\u4ed6\u4eba\u3002 |\n| \u51b3\u7b56\u72ec\u7acb\u6027 | > **\u72ec\u7acb\u51b3\u7b56** \u2014 \u4e3b\u52a8\u8003\u8651\u9000\u8bfe/\u6362\u8bfe\uff0c\u5e76\u6700\u7ec8\u81ea\u884c\u51b3\u5b9a\u201c\u6309\u539f\u8ba1\u5212\u4e0a\u8fdb\u9636\u5427\u201d\u3002 |\n| \u9996\u6b21\u9047\u963b\u65f6\u53cd\u5e94 | > **\u7ee7\u7eed\u52aa\u529b** \u2014 \u4f5c\u4e1a\u96be\u65f6\u8868\u793a\u201c\u611f\u89c9\u8981\u53bb\u770b\u70b9\u52a8\u6f2b\u8865\u8865\u8bfe\u201d\uff0c\u9047\u5230\u7f51\u7edc\u95ee\u9898\u201c\u7ed9\u6211\u5361\u5f97\u6ca1\u813e\u6c14\u4e86[\u6342\u8138]\u201d\u540e\u7ee7\u7eed\u5c1d\u8bd5\u3002 |\n| \u7ade\u54c1\u7ecf\u5386 | > **\u65e0\u63d0\u53ca** \u2014 \u672a\u63d0\u53ca\u88ab\u5272\u97ed\u83dc\u7ecf\u5386\u3002 |\n| \u670d\u52a1\u4f9d\u8d56\u5ea6 | > **\u6b63\u5e38\u7b54\u7591** \u2014 \u6709\u95ee\u9898\u4f1a@\u8001\u5e08\u6216\u73ed\u73ed\uff0c\u4f46\u4e0d\u8fc7\u5ea6\u4f9d\u8d56\uff0c\u80fd\u72ec\u7acb\u63a2\u7d22\uff08\u5982\u627e\u514d\u8d39\u97f3\u4e50\u7f51\u7ad9\uff09\u3002 |\n\n**\u5224\u5b9a\u4f9d\u636e**\uff1a\u7528\u6237\u5fc3\u6001\u79ef\u6781\uff0c\u9047\u5230\u632b\u6298\u80fd\u5e7d\u9ed8\u5316\u89e3\u5e76\u6301\u7eed\u5c1d\u8bd5\uff0c\u5b66\u4e60\u8fc7\u7a0b\u81ea\u4e3b\u6027\u5f3a\uff0c\u60c5\u7eea\u7a33\u5b9a\u3002\n\n---\n\n## \u56db\u3001\u5206\u5c42\u5224\u5b9a\u7ed3\u679c\n\n### \u5224\u5b9a\u6811\u6267\u884c\u8def\u5f84\n\n```\n\u6b65\u9aa40\uff1a\u652f\u4ed8\u6765\u6e90\u524d\u7f6e\u6838\u67e5 \u2192 [\u901a\u8fc7] (\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u501f\u8d37\u4fe1\u53f7)\n\u6b65\u9aa41\uff1aD\u7c7b\u7194\u65ad\u68c0\u67e5 \u2192 [\u672a\u89e6\u53d1] (\u65e0\u7ecf\u6d4e\u3001\u5bb6\u5ead\u3001\u5065\u5eb7\u7ea2\u7ebf)\n\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5 \u2192 [\u901a\u8fc7] (\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u53cd\u5bf9\u4fe1\u53f7\uff0c\u6309\u901a\u8fc7\u5904\u7406)\n\u6b65\u9aa42\uff1a\u9700\u6c42\u771f\u5b9e\u5ea6\u68c0\u67e5 \u2192 [\u52a8\u673a\u9ad8\u2192\u7ee7\u7eed]\n\u6b65\u9aa43\uff1aC1\u8bc6\u522b \u2192 [\u662f\u5174\u8da3/\u793e\u4ea4\u9a71\u52a8+\u8d44\u6e90\u4e2d+\u5f39\u6027\u9ad8\u2192C1\u7ec8\u6b62] \u2705\n\u6b65\u9aa44\uff1aAB\u533a\u5206 \u2192 [\u8df3\u8fc7\uff0c\u5df2\u5728\u6b65\u9aa43\u5206\u6d41]\n\u6b65\u9aa45\uff1a\u4fee\u6b63\u56e0\u5b50 \u2192 [\u65e0\u89e6\u53d1]\n```\n\n### \u6700\u7ec8\u7ed3\u8bba\n\n| \u9879\u76ee | \u7ed3\u679c |\n|---|---|\n| **ABCD \u5206\u5c42** | **\ud83d\udfea C1\u7c7b\uff08\u60c5\u7eea\u6d88\u8d39\u578b\uff09** |\n| **\u7528\u6237\u539f\u578b** | **T1 \u793e\u533a\u5efa\u9020\u8005** \u2014 \u4fe1\u606f\u5145\u8db3\uff0c\u53ef\u5224\u5b9a |\n| **\u7efc\u5408\u7f6e\u4fe1\u5ea6** | **\u4e2d**\uff08\u4e09\u8f74\u4fe1\u53f7\u6e05\u6670\uff0c\u4f46\u5173\u952e\u57fa\u7840\u4fe1\u606f\u7f3a\u5931\uff09 |\n\n### \u539f\u578b\u5339\u914d\u4f9d\u636e\n\n| \u539f\u578b | \u540d\u79f0 | \u662f\u5426\u547d\u4e2d | \u5339\u914d\u8bc1\u636e |\n|---|---|---|---|\n| T1 | \ud83c\udf96\ufe0f \u793e\u533a\u5efa\u9020\u8005 | **\u662f** | \u4e3b\u52a8\u5728\u7fa4\u5185\u5206\u4eab\u97f3\u4e50\u3001\u53f7\u53ec\u4ea4\u4f5c\u4e1a\u3001\u5173\u5fc3\u4ed6\u4eba\u8fdb\u5ea6\u3001\u8bd5\u56fe\u8c03\u52a8\u73ed\u7ea7\u6c1b\u56f4\u3002 |\n| T2 | \ud83d\udee0\ufe0f \u5e55\u540e\u627f\u91cd\u8005 | \u5426 | \u65e0\u8bc1\u636e\u3002 |\n| T3 | \ud83d\udcda \u6280\u672f\u94bb\u7814\u8005 | \u662f\uff08\u6b21\u8981\uff09 | \u9891\u7e41\u63d0\u95ee\u6280\u672f\u7ec6\u8282\uff08\u5305\u7edc\u7ebf\u3001\u5e73\u884c\u538b\u7f29\u3001AU\u64cd\u4f5c\uff09\u3002 |\n| T4 | \ud83d\udcdd \u52a1\u5b9e\u53d8\u73b0\u8005 | \u5426 | \u53d8\u73b0\u9884\u671f\u5408\u7406\u4e14\u975e\u9996\u8981\u5173\u6ce8\u70b9\u3002 |\n| T5 | \ud83c\udf31 \u8bd5\u6c34\u63a2\u7d22\u8005 | \u5426 | \u7528\u6237\u5df2\u8d2d\u4e70\u8fdb\u9636\u8bfe\uff0c\u975e\u8bd5\u6c34\u9636\u6bb5\u3002 |\n| T6 | \ud83d\ude1f \u9ad8\u7126\u8651\u4ece\u4f17\u8005 | \u5426 | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u65e0\u7126\u8651\u4f9d\u8d56\u8868\u73b0\u3002 |\n| T7 | \ud83d\udd04 \u590d\u8d2d\u751f\u6001\u578b | \u5426 | \u65e0\u8de8\u4ea7\u54c1\u7ebf\u590d\u8d2d\u8bc1\u636e\u3002 |\n| T8 | \ud83d\udd70\ufe0f \u4e34\u754c\u89c2\u671b\u8005 | \u5426 | \u5df2\u4ed8\u8d39\u4e14\u79ef\u6781\u53c2\u4e0e\u3002 |\n| \u9000\u8d39\u578b | \ud83d\udea8 \u4ea7\u54c1\u9519\u914d\u578b | \u5426 | \u8bfe\u7a0b\u65b9\u5411\uff08\u6709\u58f0\u4e66\u540e\u671f\uff09\u4e0e\u7528\u6237\u5174\u8da3\uff08\u5206\u4eab\u97f3\u4e50\u3001\u8ba8\u8bba\u52a8\u6f2b\uff09\u4e00\u81f4\u3002 |\n\n**\u6700\u7ec8\u539f\u578b** \u2192 **T1 \u793e\u533a\u5efa\u9020\u8005**\uff0c\u7406\u7531\uff1a\u7528\u6237\u7684\u6838\u5fc3\u884c\u4e3a\u662f**\u4e3b\u52a8\u8425\u9020\u5b66\u4e60\u6c1b\u56f4\u3001\u5206\u4eab\u8d44\u6e90\u3001\u5173\u5fc3\u793e\u7fa4\u4e92\u52a8**\uff0c\u6280\u672f\u94bb\u7814\u662f\u670d\u52a1\u4e8e\u793e\u533a\u53c2\u4e0e\u548c\u5171\u540c\u8fdb\u6b65\u7684\u5174\u8da3\u3002\n\n---\n\n## \u4e94\u3001\u9000\u8d39\u6295\u8bc9\u98ce\u9669\u4e13\u9879\u8bc4\u4f30\n\n### \u98ce\u9669\u7b49\u7ea7\uff1a\ud83d\udfe2\u6781\u4f4e\n\n### \u9000\u8d39\u6839\u56e0\u9884\u5224\n\n| \u9000\u8d39\u6839\u56e0\u7c7b\u578b | \u547d\u4e2d\u5224\u65ad | \u8bc1\u636e |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b\uff08\u914d\u5076/\u7236\u6bcd\u53cd\u5bf9\uff0c\u5360\u9000\u8d3925%\uff09 | **\u4e0d\u786e\u5b9a** | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u7528\u6237\u51b3\u7b56\u72ec\u7acb\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65f6\u95f4\u7ed3\u6784\u5d29\u6e83\u578b\uff08\u5012\u73ed/\u62a4\u5de5/\u65e0\u6cd5\u53c2\u52a0\uff0c\u536021%\uff09 | **\u5426** | \u80fd\u53c2\u4e0e\u76f4\u64ad\u3001\u5b8c\u6210\u4f5c\u4e1a\uff0c\u65f6\u95f4\u5b89\u6392\u663e\u793a\u5f39\u6027\u3002 |\n| \u501f\u8d37\u4ed8\u6b3e\u540e\u7ecf\u6d4e\u5d29\u6e83\u578b\uff08\u536015%\uff09 | **\u5426** | \u65e0\u501f\u8d37\u4ed8\u6b3e\u8bc1\u636e\u3002 |\n| \u8eab\u4f53/\u5065\u5eb7\u95ee\u9898\u578b\uff08\u536013%\uff09 | **\u5426** | \u65e0\u76f8\u5173\u63d0\u53ca\u3002 |\n| \u51b2\u52a8\u6d88\u8d39\u51b7\u9759\u671f\u6094\u5355\u578b\uff08\u536010%\uff09 | **\u5426** | \u5df2\u8fc7\u51b7\u9759\u671f\uff0c\u4e14\u4e3b\u52a8\u51b3\u5b9a\u7ee7\u7eed\u5b66\u4e60\u3002 |\n| \u5185\u5bb9/\u9884\u671f\u843d\u5dee\u578b\uff08\u53607%\uff09 | **\u5426** | \u7528\u6237\u5bf9\u8bfe\u7a0b\u5185\u5bb9\uff08\u7384\u5e7b\u3001\u8a00\u60c5\uff09\u6709\u8ba4\u77e5\uff0c\u4e14\u4e3b\u52a8\u8c03\u6574\u9884\u671f\uff08\u201c\u51e0\u5343\u4e5f\u80fd\u63a5\u53d7\u201d\uff09\u3002 |\n| \u6570\u5b57\u5316\u64cd\u4f5c\u80fd\u529b\u4e0d\u8db3\u578b\uff08\u53605%\uff09 | **\u5426** | \u6570\u5b57\u5316\u64cd\u4f5c\u80fd\u529b\u719f\u7ec3\uff08\u5b89\u88c5\u8f6f\u4ef6\u3001\u5904\u7406\u4e0b\u8f7d\u95ee\u9898\uff09\u3002 |\n\n### \u9000\u8d39\u65f6\u95f4\u7a97\u9884\u6d4b\n\n- **\u9ad8\u5371\u7a97\u53e3**\uff1a\u4e0d\u786e\u5b9a\uff08\u5df2\u8fc7\u521d\u671f\u9636\u6bb5\uff09\n- **\u9884\u5224\u7406\u7531**\uff1a\u7528\u6237\u5df2\u8fdb\u5165\u5b66\u4e60\u4e2d\u540e\u671f\uff0c\u53c2\u4e0e\u5ea6\u9ad8\uff0c\u5174\u8da3\u9a71\u52a8\uff0c\u4e14\u5df2\u81ea\u884c\u6d88\u5316\u4e86\u77ed\u6682\u7684\u72b9\u8c6b\u671f\uff082\u670828\u65e5\u8003\u8651\u9000\u6362\u8bfe\uff0c\u4f46\u5f88\u5feb\u51b3\u5b9a\u7ee7\u7eed\uff09\u3002\n\n### \u6295\u8bc9\u5347\u7ea7\u98ce\u9669\n\n- **\u6295\u8bc9\u53ef\u80fd\u6027**\uff1a\u4f4e\n- **\u4e3b\u8981\u89e6\u53d1\u70b9**\uff1a\u51e0\u4e4e\u65e0\u89e6\u53d1\u70b9\u3002\u552f\u4e00\u6f5c\u5728\u98ce\u9669\u662f**\u793e\u7fa4\u51b7\u6e05\u5e26\u6765\u7684\u5931\u843d\u611f**\uff08\u201c\u6211\u5206\u4eab\u5230\u7fa4\u91cc\u7684\u97f3\u4e50\u90fd\u6ca1\u4eba\u7406\u6211[\u6d41\u6cea]\u201d\uff09\uff0c\u4f46\u7528\u6237\u5df2\u81ea\u884c\u8c03\u6574\uff08\u201c\u53ef\u80fd\u4ed6\u4eec\u5728\u5077\u5077\u7ec3\u201d\uff09\u3002\n\n---\n\n## \u516d\u3001\u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n\n### \u4f26\u7406\u9632\u7ebf\u89e6\u53d1\u72b6\u6001\uff08\u5341\u6761\uff0c\u9010\u6761\u68c0\u67e5\uff09\n\n| \u9632\u7ebf\u7f16\u53f7 | \u9632\u7ebf\u540d\u79f0 | \u72b6\u6001 |\n|---|---|---|\n| \u2460 | \u65f6\u95f4\u7834\u4ea7\uff08\u6559\u5506\u6302\u673a\u51fa\u52e4\uff09 | \u2705\u672a\u89e6\u53d1 |\n| \u2461 | \u6bd2\u9e21\u6c64PUA\uff08\u6311\u62e8\u5bb6\u5ead\u8bdd\u672f\uff09 | \u2705\u672a\u89e6\u53d1 |\n| \u2462 | \u5e95\u5c42\u5d29\u584c\uff08\u91cd\u75be/\u4e27\u4eb2/\u6324\u538b\u53e3\u7cae\uff09 | \u2705\u672a\u89e6\u53d1 |\n| \u2463 | \u9ad8\u77e5\u9519\u6295\uff08\u5bf9\u9ad8\u7406\u667a\u7528\u6237\u4f7f\u7528\u4e0b\u6c89\u60c5\u611fPUA\u8bdd\u672f\uff09 | \u2705\u672a\u89e6\u53d1 |\n| \u2464 | \u4ee3\u9645\u65ad\u5976\uff08\u4f4e\u9f84\u4f9d\u8d56\u7236\u8f88\uff09 | \u2705\u672a\u89e6\u53d1 |\n| \u2465 | \u94f6\u53d1\u65cf\u64cd\u4f5c\u65ad\u5c42\uff08>65\u5c81+\u590d\u6742\u8f6f\u4ef6\u8bfe\u7a0b\uff09 | \u2705\u672a\u89e6\u53d1 |\n| \u2466 | AI\u5c65\u7ea6\u9020\u5047\uff08AI\u4ee3\u66ff\u771f\u4eba\u8f85\u5bfc\u672a\u544a\u77e5\u7528\u6237\uff09 | \u2705\u672a\u89e6\u53d1 |\n| \u2467 | \u5bb6\u5ead\u8d44\u91d1\u9690\u7792\uff08\u80cc\u7740\u4f34\u4fa3\u62a5\u540d\uff09 | **\u4e0d\u786e\u5b9a**\uff08\u4fe1\u606f\u7f3a\u5931\uff09 |\n| \u2468 | \u51b2\u52a8\u8d2d\u4e70\u60c5\u5883\uff08\u6df1\u591c22:00\u540e\u76f4\u64ad\u95f4\u51b2\u5355+\u65e0\u524d\u671f\u54a8\u8be2\uff09 | **\u4e0d\u786e\u5b9a**\uff08\u4fe1\u606f\u7f3a\u5931\uff09 |\n| \u2469 | \u9000\u8d39\u5386\u53f2\u9884\u8b66\uff08\u672c\u5e73\u53f0\u6216\u7ade\u54c1\u6709\u9000\u8d39\u8bb0\u5f55\uff09 | \u2705\u672a\u89e6\u53d1 |\n\n### \u9500\u552e\u884c\u4e3a\u5408\u89c4\u5ba1\u67e5\n\n| \u5408\u89c4\u9879 | \u72b6\u6001 |\n|---|---|\n| \u662f\u5426\u5728\u7528\u6237\u8bf4\u201c\u6ca1\u94b1\u201d\u540e\u63a8\u8350\u82b1\u5457/\u4fe1\u7528\u5361 | \u4e0d\u786e\u5b9a\uff08\u4fe1\u606f\u7f3a\u5931\uff09 |\n| \u662f\u5426\u4f7f\u7528\u201c\u968f\u65f6\u9000\u8d39\u201d\u4f5c\u4e3a\u4fc3\u6210\u8bdd\u672f | \u5426\uff08\u9500\u552e\u5bf9\u9000\u8bfe\u8be2\u95ee\u56de\u590d\u7b80\u6d01\uff09 |\n| \u662f\u5426\u5bf9\u8d22\u52a1\u8106\u5f31\u7528\u6237\u4f7f\u7528\u201c\u903c\u81ea\u5df1\u4e00\u628a\u201d\u8bdd\u672f | \u5426 |\n| \u7528\u6237\u8bf4\u201c\u5bb6\u4eba\u4e0d\u77e5\u9053\u201d\u540e\u662f\u5426\u8ffd\u95ee\u6838\u5b9e | \u4e0d\u9002\u7528\uff08\u7528\u6237\u672a\u63d0\u53ca\uff09 |\n| \u662f\u5426\u5728\u7528\u6237\u8bf4\u201c\u6211\u53bb\u501f\u94b1\u201d\u540e\u4ecd\u7ee7\u7eed\u63a8\u8fdb\u6210\u4ea4 | \u4e0d\u9002\u7528\uff08\u7528\u6237\u672a\u63d0\u53ca\uff09 |\n| \u662f\u5426\u4f7f\u7528\u6536\u76ca\u4fdd\u5e95\u627f\u8bfa\uff08\u201c\u4fdd\u8bc1\u6708\u5165\u8fc7\u4e07\u201d\uff09 | \u5426 |\n| \u662f\u5426\u5728\u7528\u6237\u8868\u8fbe\u72b9\u8c6b\u65f6\u65bd\u52a0\u65f6\u95f4\u9650\u538b | \u5426 |\n\n---\n\n## \u4e03\u3001\u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\n\n### \u2705 \u7acb\u523b\u505a\uff08\u6700\u9ad8\u4f18\u5148\u7ea7\uff09\n\n1.  **\u8865\u5168\u4fe1\u606f\u76f2\u533a**\uff1a\u4ee5\u5173\u5fc3\u5b66\u4e60\u8fdb\u5ea6\u7684\u540d\u4e49\uff0c\u81ea\u7136\u8be2\u95ee\u201c\u665a\u4e0a\u5b66\u4e60\u65f6\u95f4\u56fa\u5b9a\u5417\uff1f\u201d\u3001\u201c\u5bb6\u4eba\u652f\u6301\u4f60\u5b66\u8fd9\u4e2a\u5417\uff1f\u201d\uff0c**\u52a1\u5fc5\u57287\u5929\u5185\u5b8c\u6210\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\u3002\n2.  **\u8d4b\u4e88\u793e\u7fa4\u89d2\u8272**\uff1a\u7acb\u5373\u4efb\u547d\u5176\u4e3a**\u5c0f\u7ec4\u957f\u6216\u6c1b\u56f4\u5b98**\uff0c\u8ba9\u5176\u8d1f\u8d23\u7ec4\u7ec7\u97f3\u4e50\u5206\u4eab\u3001\u4f5c\u4e1a\u6253\u5361\u63d0\u9192\uff0c\u6ee1\u8db3\u5176T1\u793e\u533a\u5efa\u9020\u8005\u539f\u578b\u7684\u5185\u5728\u9a71\u52a8\u3002\n3.  **\u516c\u5f00\u8ba4\u53ef\u4e0e\u9f13\u52b1**\uff1a\u5728\u73ed\u7ea7\u7fa4\u516c\u5f00\u8868\u626c\u5176\u5206\u4eab\u884c\u4e3a\u548c\u79ef\u6781\u63d0\u95ee\uff0c\u5f3a\u5316\u5176\u793e\u7fa4\u4ef7\u503c\u611f\u3002\n\n### \u23f0 \u5165\u5b66\u7b2c\u4e00\u5468\u505a\uff08\u5df2\u8fc7\uff0c\u4f46\u9700\u8865\u505a\uff09\n\n1.  **\u9884\u671f\u6821\u6b63**\uff1a\u867d\u5df2\u8fdb\u884c\uff0c\u4f46\u4ecd\u9700\u4e00\u5bf9\u4e00\u5f3a\u8c03\uff1a\u6280\u80fd\u7cbe\u8fdb\u662f\u957f\u671f\u8fc7\u7a0b\uff0c\u53d8\u73b0\u662f\u6c34\u5230\u6e20\u6210\uff0c\u8ba4\u53ef\u5176\u201c\u51e0\u5343\u4e5f\u80fd\u63a5\u53d7\u201d\u7684\u52a1\u5b9e\u5fc3\u6001\u3002\n2.  **\u5b66\u4e60\u8282\u594f\u5efa\u7acb**\uff1a\u534f\u52a9\u5176\u89c4\u5212\u5927\u6587\u4ef6\uff08\u5982\u786c\u76d8\u8d44\u6e90\uff09\u4e0b\u8f7d\u8ba1\u5212\uff0c\u907f\u514d\u5f71\u54cd\u65e5\u5e38\u4f5c\u4e1a\u7f51\u7edc\u3002\n3.  **\u672a\u6838\u9a8c\u7684\u5fc5\u95ee\u4e09\u95ee\u987b\u5728\u7b2c\u4e00\u5468\u8865\u5b8c**\u3002\n\n### \u274c \u7edd\u5bf9\u4e0d\u505a\uff08\u96f7\u533a\u8b66\u544a\uff09\n\n1.  **\u4e25\u7981\u5ffd\u89c6\u5176\u793e\u7fa4\u5efa\u8bbe\u70ed\u60c5**\u3002\u51b7\u843d\u5176\u5206\u4eab\u6216\u8ba9\u5176\u611f\u89c9\u201c\u72ec\u89d2\u620f\u201d\u662f\u6700\u5927\u7684\u670d\u52a1\u96f7\u533a\u3002\n2.  **\u7981\u6b62\u4f7f\u7528\u9ad8\u538b\u53d8\u73b0\u8bdd\u672f**\u3002\u5176\u52a8\u673a\u7eaf\u5ea6\u9ad8\uff0cPUA\u6216\u8fc7\u5ea6\u627f\u8bfa\u6536\u76ca\u4f1a\u5f15\u53d1\u53cd\u611f\u3002\n3.  **\u4e0d\u8981\u5c06\u5176\u5f53\u4f5c\u7eaf\u7cb9\u7684\u95ee\u9898\u89e3\u7b54\u673a**\u3002\u5e94\u5c06\u5176\u89c6\u4e3a**\u5b66\u4e60\u793e\u7fa4\u7684\u5171\u5efa\u4f19\u4f34**\uff0c\u9080\u8bf7\u5176\u53c2\u4e0e\u8fd0\u8425\u8ba8\u8bba\u3002\n\n### \ud83d\udcac \u7834\u51b0/\u7ef4\u62a4\u8bdd\u672f\u5efa\u8bae\n\n> \u201c\u770b\u5230\u4f60\u7ecf\u5e38\u5728\u7fa4\u91cc\u5206\u4eab\u97f3\u4e50\u548c\u9f13\u52b1\u540c\u5b66\uff0c\u771f\u7684\u7ed9\u73ed\u7ea7\u5e26\u6765\u4e86\u5f88\u591a\u6d3b\u529b\uff01\u6709\u6ca1\u6709\u5174\u8da3\u5f53\u54b1\u4eec\u73ed\u7684\u2018\u97f3\u4e50\u63a8\u8350\u5b98\u2019\u5440\uff1f\u5927\u5bb6\u80af\u5b9a\u90fd\u9700\u8981\u4f60\u7684\u5b9d\u85cf\u6b4c\u5355~\u201d\n\n### \u26a0\ufe0f \u5347\u4ed3\u7b56\u7565\n\n- **\u80fd\u5426\u5347\u4ed3**\uff1a**\u53ef\u4ee5**\uff08\u4f46\u975e\u5f53\u524d\u91cd\u70b9\uff09\n- **\u5347\u4ed3\u6761\u4ef6**\uff1a\u5728\u5176\u6210\u529f\u5e26\u9886\u5c0f\u7ec4\u5b8c\u6210\u4e00\u6b21\u9879\u76ee\u6216\u6d3b\u8dc3\u5ea6\u660e\u663e\u63d0\u5347\u540e\uff0c\u4ee5\u201c\u6280\u80fd\u6df1\u5316\u201d\u6216\u201c\u8d44\u6e90\u62d3\u5c55\u201d\u4e3a\u7531\u63a8\u8350\u3002\n- **\u82e5\u7ea0\u7ed3\u4e0d\u51b3**\uff1a\u4e0d\u9002\u7528\u3002\u7528\u6237\u5df2\u51b3\u5b9a\u7ee7\u7eed\u8fdb\u9636\u8bfe\u3002\n\n---\n\n## \u516b\u3001\u4ea7\u54c1\u4e0e\u670d\u52a1\u5339\u914d\u6027\u5224\u65ad\n\n### \u5f53\u524d\u4ea7\u54c1\u5339\u914d\u5ea6\uff1a\u2705\u5339\u914d\n\n| \u7ef4\u5ea6 | \u5224\u65ad |\n|---|---|\n| \u8bfe\u7a0b\u65b9\u5411\u4e0e\u7528\u6237\u5174\u8da3/\u9700\u6c42\u662f\u5426\u4e00\u81f4 | **\u4e00\u81f4** \u2014 \u7528\u6237\u5bf9\u6709\u58f0\u4e66\u540e\u671f\uff08\u5c24\u5176\u662f\u97f3\u4e50\u3001\u97f3\u6548\u3001AU\u64cd\u4f5c\uff09\u8868\u73b0\u51fa\u6d53\u539a\u5174\u8da3\u3002 |\n| \u8bfe\u7a0b\u96be\u5ea6\u4e0e\u7528\u6237\u64cd\u4f5c\u80fd\u529b\u662f\u5426\u5339\u914d | **\u5339\u914d** \u2014 \u7528\u6237\u80fd\u8ddf\u4e0a\u8bfe\u7a0b\uff0c\u4e3b\u52a8\u94bb\u7814\u9ad8\u9636\u95ee\u9898\uff08\u5982\u5e73\u884c\u538b\u7f29\uff09\u3002 |\n| \u8bfe\u7a0b\u65f6\u95f4\u8981\u6c42\u4e0e\u7528\u6237\u53ef\u7528\u65f6\u95f4\u662f\u5426\u5339\u914d | **\u6709\u538b\u529b\u4f46\u53ef\u534f\u8c03** \u2014 \u80fd\u8ddf\u76f4\u64ad\uff0c\u4f46\u9700\u786e\u8ba4\u56fa\u5b9a\u65f6\u95f4\u3002 |\n| \u8bfe\u7a0b\u4ef7\u683c\u4e0e\u7528\u6237\u652f\u4ed8\u80fd\u529b\u662f\u5426\u5339\u914d | **\u5408\u7406** \u2014 \u65e0\u7ecf\u6d4e\u56f0\u96be\u8868\u8ff0\uff0c\u4f46\u66fe\u72b9\u8c6b\uff0c\u8bf4\u660e\u4ef7\u683c\u5728\u5176\u51b3\u7b56\u8303\u56f4\u5185\u3002 |\n| \u62db\u52df\u8425\u5c97\u4f4d\u9009\u62e9\u4e0e\u8d2d\u4e70\u8bfe\u7a0b\u65b9\u5411\u662f\u5426\u4e00\u81f4 | **\u4e00\u81f4** \u2014 \u804a\u5929\u56f4\u7ed5\u540e\u671f\u8bfe\u7a0b\u5c55\u5f00\uff0c\u65e0\u9519\u914d\u8ff9\u8c61\u3002 |\n\n### \u6539\u914d\u5efa\u8bae\n\n- \u65e0\u9700\u6539\u914d\u3002\u5f53\u524d\u8bfe\u7a0b\u4e0e\u7528\u6237\u5174\u8da3\u3001\u80fd\u529b\u9ad8\u5ea6\u5339\u914d\u3002\n- **\u670d\u52a1\u8865\u5145**\uff1a\u63d0\u4f9b\u66f4\u591a**\u793e\u7fa4\u8fd0\u8425\u548c\u5c55\u793a\u673a\u4f1a**\uff0c\u5982\u8ba9\u5176\u4e3b\u6301\u97f3\u4e50\u9274\u8d4f\u5c0f\u8bfe\u5802\u3001\u5206\u4eab\u514d\u8d39\u8d44\u6e90\u5bfb\u627e\u6280\u5de7\u3002\n\n---\n\n## \u4e5d\u3001\u5173\u952e\u8bc1\u636e\u6458\u5f55\n\n> \u4ee5\u4e0b\u4e3a\u804a\u5929\u8bb0\u5f55\u4e2d\u6700\u80fd\u652f\u6491\u5224\u65ad\u7684\u539f\u8bdd\uff08\u6700\u591a5\u6761\uff09\uff1a\n\n1. > \u201c\u6211\u5206\u4eab\u5230\u7fa4\u91cc\u7684\u97f3\u4e50\u90fd\u6ca1\u4eba\u7406\u6211[\u6d41\u6cea][\u6d41\u6cea]\u201d \u2014 \u6307\u5411\uff1a**T1\u793e\u533a\u5efa\u9020\u8005\u539f\u578b**\uff0c\u6e34\u671b\u793e\u7fa4\u4e92\u52a8\u4e0e\u8ba4\u53ef\u3002\n2. > \u201c\u6211\u672c\u6765\u76ee\u6807\u9760\u540e\u671f\u5165\u4e07\u7684\uff0c\u8fd9\u4e24\u5929\u89c9\u5f97\u51e0\u5343\u4e5f\u80fd\u63a5\u53d7[\u6342\u8138]\u201d \u2014 \u6307\u5411\uff1a**\u52a8\u673a\u7eaf\u5ea6\u9ad8\u4e2d\u4f4e\u53d8\u73b0\u9884\u671f**\uff0c\u80fd\u7406\u6027\u8c03\u6574\u76ee\u6807\uff0c\u975e\u6781\u7aef\u53d8\u73b0\u9a71\u52a8\u3002\n3. > \u201c\u73ed\u73ed\uff0c\u6211\u4e2d\u9014\u6709\u4e8b\u9000\u51fa\u53bb\u4e86\uff0c\uff0c\u53ef\u4ee5\u62e5\u6709\u798f\u5229\u5417[\u59d4\u5c48]\u201d \u2014 \u6307\u5411\uff1a**\u5fc3\u7406\u5f39\u6027\u9ad8**\uff0c\u4ee5\u8f7b\u677e\u3001\u5e26\u70b9\u6492\u5a07\u7684\u65b9\u5f0f\u6c9f\u901a\u95ee\u9898\uff0c\u975e\u6307\u8d23\u6216\u5d29\u6e83\u3002\n4. > \u201c\u6211\u8981\u8bd5\u8bd5\u5176\u4ed6\u514d\u8d39\u7684\u3002\u575a\u51b3\u4e0d\u82b1\u91d1\u5e01\u54c8\u54c8\u54c8\u54c8\u201d \u2014 \u6307\u5411\uff1a**\u8d44\u6e90\u7cbe\u529b\u7ef4\u5ea6\u9ad8**\uff0c\u5177\u5907\u72ec\u7acb\u5bfb\u627e\u548c\u89e3\u51b3\u95ee\u9898\u7684\u80fd\u529b\uff0c\u5b66\u4e60\u6001\u5ea6\u79ef\u6781\u3002\n5. > \u201c\u7b97\u4e86\u8001\u5e08\uff0c\u6309\u539f\u8ba1\u5212\u4e0a\u8fdb\u9636\u5427\uff0c\u4e0d\u9000\u4e86\u201d \u2014 \u6307\u5411\uff1a**\u51b3\u7b56\u72ec\u7acb\u6027\u5f3a**\uff0c\u77ed\u6682\u72b9\u8c6b\u540e\u80fd\u81ea\u6211\u8bf4\u670d\u5e76\u575a\u6301\u5b66\u4e60\u8ba1\u5212\u3002\n\n---\n\n## \u5341\u3001\u4e00\u53e5\u8bdd\u7ed3\u8bba\uff08\u4f9b\u7ba1\u7406\u5c42\u5feb\u901f\u626b\u8bfb\uff09\n\n> **UID: 676370704** \u5224\u5b9a\u4e3a **C1\u7c7b\uff08T1\u793e\u533a\u5efa\u9020\u8005\uff09**\uff0c\u9000\u8d39\u98ce\u9669 **\u6781\u4f4e**\u3002\u6838\u5fc3\u539f\u56e0\uff1a\u9ad8\u5174\u8da3\u9a71\u52a8\u3001\u9ad8\u5fc3\u7406\u5f39\u6027\u3001\u6d3b\u8dc3\u7684\u793e\u7fa4\u5171\u5efa\u8005\u3002\u5efa\u8bae\uff1a**\u8d4b\u4e88\u793e\u7fa4\u89d2\u8272\uff0c\u516c\u5f00\u8ba4\u53ef\uff0c\u8865\u5168\u5bb6\u5ead/\u65f6\u95f4\u4fe1\u606f\u76f2\u533a**\u3002\n\n{\"core_type\": \"T1 \u793e\u533a\u5efa\u9020\u8005\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u6781\u4f4e\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u8d4b\u4e88\u793e\u7fa4\u89d2\u8272\u5e76\u516c\u5f00\u8ba4\u53ef\"}";
