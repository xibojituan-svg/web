        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676186215 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-16 \u81f3 2026-01-20 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u706b\u7089\u73ed\u73ed\uff08\u5f20\u5a1c\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u77ed\u89c6\u9891/\u5e7f\u544a\u5236\u4f5c\u8bfe\u7a0b\uff08\u63a8\u6d4b\u4e3a4\u671f\u5b66\u5458\uff0c\u53c2\u4e0e\u4eac\u4e1cAI\u5927\u8d5b\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff08\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u201c\u660e\u5929\u51fa\u5dee\uff0c\u6ca1\u4ec0\u4e48\u65f6\u95f4\u505a\u201d\u3001\u201c\u5728\u52a8\u8f66\u4e0a\uff0c\u4e5f\u505a\u4e0d\u4e86\u201d\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff08\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u4e92\u52a8\u9891\u7e41\uff0c\u5185\u5bb9\u6d89\u53ca\u6280\u672f\u3001\u793e\u4ea4\u3001\u4f5c\u4e1a\u3001\u884c\u4e1a\u89c2\u5bdf\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u2b06\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u4eab\u53d7\u521b\u4f5c\u8fc7\u7a0b\u4e0e\u793e\u7fa4\u4e92\u52a8\uff0c\u5bf9\u53d8\u73b0\u6709\u4e00\u5b9a\u5173\u6ce8\u4f46\u975e\u552f\u4e00\u9a71\u52a8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u5176\u5b9e\u4e0d\u60f3\u5e2e\u7684\uff0c\u6211\u53ea\u60f3\u5b89\u5b89\u9759\u9759\u5730\u5f53\u4e00\u4e2a\u8eba\u5e73\u7684\u6df7\u5b50\uff0c\u8981\u662f\u80fd\u7ed9\u963f\u5c14\u6cd5\u4ed6\u4eec\u505a\u5c31\u597d\u4e86[\u76b1\u7709]\u201d (\u4f53\u73b0\u5174\u8da3\u9a71\u52a8\u548c\u793e\u7fa4\u5f52\u5c5e\u611f)\n> \u201c\u4e07\u4e00\u4f60\u80fd\u559d\u70b9\u6c64\u5462\u201d\u3001\u201c\u9ad8\u4f4e\u5f97\u518d\u505a\u4e24\u4e2a\u201d (\u5bf9\u6bd4\u8d5b\u5956\u91d1\u6709\u671f\u5f85\uff0c\u4f46\u975e\u72c2\u70ed)\n> \u201c\u6211\u5c31\u662f\u4e2a\u6df7\u5b50\u201d\u3001\u201c\u6ca1\u6709\uff0c\u662f\u5927\u5bb6\u7ed9\u9762\u5b50\u201d (\u8868\u9762\u81ea\u8c26\uff0c\u5b9e\u5219\u4eab\u53d7\u88ab\u8ba4\u53ef)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\uff0c\u80fd\u51fa\u5dee\uff0c\u6709\u7a33\u5b9a\u5de5\u4f5c\uff0c\u4f46\u672a\u663e\u793a\u9ad8\u6d88\u8d39\u80fd\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u6709\u672c\u804c\u5de5\u4f5c\uff08\u9700\u51fa\u5dee\uff09\uff0c\u65f6\u95f4\u788e\u7247\u5316\uff0c\u4f46\u4ecd\u80fd\u6324\u51fa\u65f6\u95f4\u521b\u4f5c\u548c\u53c2\u4e0e\u793e\u7fa4\u8ba8\u8bba\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u4f5c\u4e1a\u96be\u5ea6\u3001\u65f6\u95f4\u538b\u529b\u3001\u6280\u672f\u95ee\u9898\uff08AI\u751f\u6210\u9650\u5236\uff09\u65f6\uff0c\u8868\u73b0\u4e3a\u5410\u69fd\u3001\u8c03\u4f83\u3001\u81ea\u6211\u89e3\u5632\uff0c\u5e76\u79ef\u6781\u5bfb\u627e\u89e3\u51b3\u65b9\u6848\u6216\u66ff\u4ee3\u8def\u5f84\uff0c\u65e0\u5d29\u6e83\u3001\u653e\u5f03\u6216\u5411\u73ed\u4e3b\u4efb\u8fc7\u5ea6\u7d22\u53d6\u60c5\u7eea\u4ef7\u503c\u7684\u884c\u4e3a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u9ebb\u4e86\uff0c\u592a\u5377\u4e86[\u6342\u8138]\u201d (\u9762\u5bf9\u7ade\u4e89\u538b\u529b\uff0c\u7528\u5e7d\u9ed8\u5316\u89e3)\n> \u201c\u6211\u5361\u4e86\u4e24\u5929\u4e86\uff0c\u6d6a\u8d39\u4e24\u5929\u79ef\u5206[\u82e6\u6da9]\u201d\u3001\u201c\u6211\u4e0d\u60f3\u505a\u7684\u65f6\u5019\u6211\u8eba\u5e73\u4e00\u5468\u90fd\u65e0\u6240\u8c13\uff0c\u60f3\u505a\u7684\u65f6\u5019\u505a\u4e0d\u4e86\u5c31\u592a\u96be\u53d7\u4e86[\u6342\u8138]\u201d (\u8868\u8fbe\u632b\u6298\u611f\uff0c\u4f46\u8fc5\u901f\u8f6c\u5316\u4e3a\u521b\u4f5c\u6b32\u671b)\n> \u201c\u6211\u6700\u591a\u51fa\u5230\u8fd9\u79cd\u7a0b\u5ea6\uff0c\u518d\u591a\u5c31\u4e0d\u884c\u4e86\u201d (\u6e05\u6670\u8ba4\u77e5\u81ea\u8eab\u80fd\u529b\u8fb9\u754c)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6e34\u671b\u5728\u6280\u672f\u793e\u7fa4\u4e2d\u83b7\u5f97\u8ba4\u53ef\u4e0e\u5730\u4f4d**\u3002\u4ed6\u4eab\u53d7\u201c\u90aa\u795e\u201d\u7684\u79f0\u53f7\uff0c\u5728\u610f\u81ea\u5df1\u7684\u4f5c\u54c1\u88ab\u5c55\u793a\uff08\u73ed\u4f1a\u653eMV\uff09\uff0c\u4e50\u4e8e\u5206\u4eab\u60f3\u6cd5\u548c\u6280\u5de7\uff0c\u5e76\u4e3b\u52a8\u5173\u5fc3\u73ed\u7ea7\u8fd0\u8425\uff08\u8be2\u95ee\u5e26\u73ed\u6570\u91cf\uff09\uff0c\u663e\u793a\u51fa\u5f3a\u70c8\u7684\u793e\u7fa4\u53c2\u4e0e\u611f\u548c\u83b7\u5f97\u5c0a\u91cd\u7684\u9700\u6c42\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u8d4b\u4e88\u5176\u201c\u6280\u672f\u8fbe\u4eba/\u793e\u7fa4\u9886\u8896\u201d\u7684\u8eab\u4efd\u8ba4\u540c\u4e0e\u821e\u53f0**\u3002\u63d0\u4f9b\u516c\u5f00\u7684\u8ba4\u53ef\uff08\u5982\u73ed\u4f1a\u5c55\u793a\uff09\u3001\u8d4b\u4e88\u5176\u8f85\u52a9\u6559\u5b66\u7684\u8d23\u4efb\uff08\u5982\u5efa\u8bae\u5176\u5f53\u70b9\u8bc4\u5b98\uff09\u3001\u7ed9\u4e88\u5176\u6280\u672f\u63a2\u7d22\u7684\u81ea\u7531\u5ea6\u548c\u5c55\u793a\u673a\u4f1a\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T7 \u72c2\u70ed\u6b7b\u5fe0\u7c89** (\u9ad8\u590d\u8d2d\u6f5c) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u96f6\u4e92\u52a8\u4fe1\u53f7\u3002\n\n**\u3010\u5224\u5b9a\u6811\u8def\u5f84\u63a8\u6f14\u3011**\uff1a\n1.  **\u52a8\u673a\u7eaf\u5ea6**\uff1a\u8bc4\u52067-8\u5206\u3002\u5173\u6ce8\u6280\u672f\u5b9e\u73b0\uff08AI\u751f\u6210\u753b\u98ce\u3001\u7248\u6743\u95ee\u9898\uff09\u3001\u79ef\u6781\u53c2\u4e0e\u793e\u7fa4\u8ba8\u8bba\u3001\u4eab\u53d7\u521b\u4f5c\u8fc7\u7a0b\uff0c\u975e\u7eaf\u53d8\u73b0\u9a71\u52a8\u3002\n2.  **\u8d44\u6e90\u5e95\u5ea7**\uff1a\u8bc4\u52065-6\u5206\u3002\u6709\u7a33\u5b9a\u5de5\u4f5c\uff0c\u65f6\u95f4\u788e\u7247\u5316\u4f46\u53ef\u7ba1\u7406\uff0c\u65e0\u6570\u5b57\u9e3f\u6c9f\u3002\n3.  **\u5fc3\u7406\u5f39\u6027**\uff1a\u8bc4\u52067-8\u5206\u3002\u9ad8\u6297\u538b\uff0c\u9047\u632b\u80fd\u81ea\u6211\u8c03\u4f83\u5e76\u7ee7\u7eed\u5c1d\u8bd5\u3002\n4.  **\u5224\u5b9a\u6811\u5206\u6d41**\uff1a\n    *   \u672a\u89e6\u53d1\u524d\u7f6e\u9694\u7206\u7b5b\u3002\n    *   \u52a8\u673a\u7eaf\u5ea6\u22655\u5206\uff0c\u8fdb\u5165**\u4e2d\u9ad8\u52a8\u673a\u7cbe\u5206**\u901a\u9053\u3002\n    *   \u5fc3\u7406\u5f39\u6027\u22657\u5206\uff0c\u8fdb\u5165**\u9ad8\u5f39\u6027\u901a\u9053**\u3002\n    *   \u7b26\u5408\u201c\u65e5\u5747\u7fa4\u53d1\u8a00\u226510\u6761 AND \u5185\u5bb9\u226560%\u4e3a\u975e\u5b66\u4e60\u793e\u4ea4\u201d\u6761\u4ef6\uff0c\u4e14\u8d44\u6e90\u5e95\u5ea7\u22655\u5206\u3002\n    *   **\u5224\u5b9a\u7ed3\u679c**\uff1aT7 \u72c2\u70ed\u6b7b\u5fe0\u7c89\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u56e0\u5176\u72ec\u7acb\u6027\u548c\u9ad8\u5f39\u6027\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u51fa\u5dee\u9891\u7e41\u5bfc\u81f4\u4f5c\u4e1a\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\u201d\u7684\u7126\u8651\uff0c\u82e5\u7f3a\u4e4f\u7075\u6d3b\u673a\u5236\u53ef\u80fd\u5f15\u53d1\u4e0d\u6ee1\u3002** |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u81ea\u6211\u8c03\u8282\u80fd\u529b\u5f3a\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u5bf9\u53d8\u73b0\u6709\u4e00\u5b9a\u671f\u5f85\u4f46\u975e\u6838\u5fc3\u9a71\u52a8\uff0c\u66f4\u770b\u91cd\u793e\u7fa4\u8ba4\u540c\u548c\u6280\u672f\u4e50\u8da3\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u4e2d\u540e\u671f\uff0c\u5f53\u9ad8\u5f3a\u5ea6\u51fa\u5dee\u4e0e\u5bc6\u96c6\u4f5c\u4e1a/\u6bd4\u8d5b\u622a\u6b62\u65e5\u671f\u51b2\u7a81\u65f6\u3002**\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u90aa\u795e\u5927\u4f6c\uff0c\u77e5\u9053\u4f60\u5e73\u65f6\u5fd9\uff0c\u4f46\u54b1\u4eec\u73ed\u6ca1\u4f60\u771f\u4e0d\u884c\u3002\u4f5c\u4e1a\u4e0d\u50ac\u4f60\uff0c\u4f46\u2018\u6280\u672f\u987e\u95ee\u2019\u8fd9\u6d3b\u513f\u4f60\u5f97\u63a5\u7740\u3002\u6709\u5565\u65b0\u53d1\u73b0\uff08\u6bd4\u5982\u64e6\u8fb9AI\u56fe\uff09\u968f\u65f6@\u6211\uff0c\u5e26\u5e26\u65b0\u4eba\uff0c6\u671f\u90a3\u5e2e\u5c0f\u5b50\u7b49\u7740\u4f60\u4f20\u529f\u5462\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** + **\u3010\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\u3011**\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T7\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a**\u3010\u793e\u7fa4\u8363\u8a89\u52cb\u7ae0\u3011**\uff08\u5982\u201c\u90aa\u795e\u201d\u3001\u201c\u9996\u5e2d\u8111\u6d1e\u5b98\u201d\u7b49\u865a\u62df\u5934\u8854\uff09\u3001**\u3010\u6280\u672f\u63a2\u7d22\u7279\u6743\u3011**\uff08\u4f18\u5148\u4f53\u9a8c\u65b0\u5de5\u5177/\u5185\u6d4b\u529f\u80fd\uff09\u3001**\u3010\u8f7b\u91cf\u7ea7\u52a9\u6559\u89d2\u8272\u3011**\uff08\u5982\u9080\u8bf7\u5728\u73ed\u4f1a/\u65b0\u4eba\u7fa4\u505a\u7b80\u77ed\u5206\u4eab\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u5b98\u50da\u6216\u547d\u4ee4\u5f0f\u53e3\u543b\u4e0e\u4ed6\u6c9f\u901a\uff1b\u5ffd\u89c6\u4ed6\u7684\u6280\u672f\u5206\u4eab\u548c\u793e\u7fa4\u8d21\u732e\uff1b\u5728\u4ed6\u65f6\u95f4\u7d27\u5f20\u65f6\u65bd\u52a0\u6b7b\u677f\u7684\u8003\u52e4\u538b\u529b\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u56e0\u5176\u6280\u672f\u5174\u8da3\u548c\u793e\u7fa4\u9ecf\u6027\u9ad8\uff0c\u53ef\u63a8\u8350\u9ad8\u9636\u6280\u672f\u8bfe\u3001\u79c1\u6559\u8bfe\u6216\u5de5\u5177\u4f1a\u5458\uff0c\u4f46\u9700\u7ed3\u5408\u5176\u65f6\u95f4\u60c5\u51b5\uff0c\u63d0\u4f9b\u7075\u6d3b\u7684\u5b66\u4e60\u65b9\u6848\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u5176\u5b9e\u4e0d\u60f3\u5e2e\u7684\uff0c\u6211\u53ea\u60f3\u5b89\u5b89\u9759\u9759\u5730\u5f53\u4e00\u4e2a\u8eba\u5e73\u7684\u6df7\u5b50\uff0c\u8981\u662f\u80fd\u7ed9\u963f\u5c14\u6cd5\u4ed6\u4eec\u505a\u5c31\u597d\u4e86[\u76b1\u7709]\u201d **(\u5178\u578bT7\u53e3\u543b\uff1a\u5634\u4e0a\u8bf4\u8eba\u5e73\uff0c\u8eab\u4f53\u5f88\u8bda\u5b9e\uff0c\u4eab\u53d7\u88ab\u9700\u8981\u7684\u611f\u89c9)**\n2. > \u201c4 \u671f\u706b\u7089\u73ed\u7684\u90aa\u795e\u201d\u3001\u201c\u4f60\u7684\u540d\u58f0\u6628\u5929\u665a\u4e0a\u7ed9\u4f60\u6253\u51fa\u53bb\u4e86\u201d **(\u73ed\u4e3b\u4efb\u7684\u8ba4\u53ef\uff0c\u7cbe\u51c6\u547d\u4e2d\u5176\u5c0a\u91cd\u9700\u6c42)**\n3. > \u201c\u6211\u5361\u4e86\u4e24\u5929\u4e86\uff0c\u6d6a\u8d39\u4e24\u5929\u79ef\u5206[\u82e6\u6da9]\u201d\u3001\u201c\u6211\u4e0d\u60f3\u505a\u7684\u65f6\u5019\u6211\u8eba\u5e73\u4e00\u5468\u90fd\u65e0\u6240\u8c13\uff0c\u60f3\u505a\u7684\u65f6\u5019\u505a\u4e0d\u4e86\u5c31\u592a\u96be\u53d7\u4e86[\u6342\u8138]\u201d **(\u9ad8\u5fc3\u7406\u5f39\u6027\u7684\u4f53\u73b0\uff1a\u632b\u6298\u611f\u8fc5\u901f\u8f6c\u5316\u4e3a\u66f4\u5f3a\u7684\u521b\u4f5c\u6b32\uff0c\u800c\u975e\u653e\u5f03)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T7\u72c2\u70ed\u6b7b\u5fe0\u7c89\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u6280\u672f\u793e\u7fa4\u4e2d\u83b7\u5f97\u5c0a\u91cd\u4e0e\u9886\u8896\u5730\u4f4d\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u8d4b\u4e88\u5176\u201c\u7f16\u5916\u6280\u672f\u9886\u8896\u201d\u8eab\u4efd\uff0c\u7528\u8363\u8a89\u548c\u7279\u6743\u7ed1\u5b9a\uff0c\u63d0\u4f9b\u7075\u6d3b\u7684\u65f6\u95f4\u652f\u6301\u3011**\u3002\n\n```json\n{\"core_type\": \"T7 \u72c2\u70ed\u6b7b\u5fe0\u7c89\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd\u5f52\u5c5e\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
