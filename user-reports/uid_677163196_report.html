    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4f5c\u4e3a\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677163196\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677163196 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u68a6\u5883/\u6d69\u8bda\uff08\u674e\u4e50\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u7cbe\u82f1\u8bfe\uff08\u4ef7\u683c\uff1a3980\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad**\uff08\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u6709\u5168\u804c\u5de5\u4f5c\uff0c\u5229\u7528\u5348\u4f11\u3001\u901a\u52e4\u3001\u665a\u95f4\u65f6\u95f4\u5b66\u4e60\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad** |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u4e92\u52a8\u79ef\u6781\uff0c\u81ea\u6211\u8868\u8fbe\u5145\u5206\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06**\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u8ffd\u6c42\u4e13\u4e1a\u7cbe\u8fdb\u4e0e\u81ea\u6211\u5b9e\u73b0\uff0c\u4eab\u53d7\u6f14\u7ece\u4e0d\u540c\u89d2\u8272\u7684\u4e50\u8da3\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u662f\u4e00\u4e2a\u5f88\u559c\u6b22\u6f14\u7ece\u7684\u5973\u751f~\u4ee5\u524d\u9ad8\u8003\u7684\u65f6\u5019\u4e5f\u88ab\u7535\u5f71\u5b66\u9662\u5f55\u53d6\u8fc7~\u540e\u6765\u5bb6\u91cc\u53ef\u80fd\u4e0d\u592a\u652f\u6301\u8d70\u6f14\u827a\u8def\u7ebf~\u6240\u4ee5\u653e\u5f03\u4e86~\u73b0\u5728\u63a5\u89e6\u5230\u4e86\u914d\u97f3\u4e3b\u64ad\u8fd9\u4e2a\u884c\u4e1a~\u6211\u611f\u89c9\u81ea\u5df1\u53ef\u4ee5\u626e\u6f14\u4e0d\u540c\u7684\u89d2\u8272~\u8ba9\u5c0f\u8bf4\u91cc\u9762\u7684\u4eba\u7269\u5f62\u8c61\u771f\u5b9e\u8d77\u6765~\u5fc3\u91cc\u8fd8\u662f\u5f88\u5f00\u5fc3\u7684\u201d\n  > \u201c\u8001\u5e08~\u6211\u5bf9\u5f55\u4e66\uff0c\u753b\u672c\uff0c\u5ba1\u542c\u90fd\u975e\u5e38\u611f\u5174\u8da3[\u5472\u7259]\u4e5f\u5f88\u60f3\u8ddf\u60a8\u597d\u597d\u5b66\u4e60~\u52aa\u529b\u52a0\u6cb9\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1**\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u652f\u4ed83980\u5143\u8bfe\u7a0b\uff0c\u4f46\u672a\u63d0\u53ca\u652f\u4ed8\u7ec6\u8282\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u5bbd\u88d5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u6709\u5168\u804c\u5de5\u4f5c\uff08\u201c\u5728\u5f00\u8f66\u5f80\u516c\u53f8\u8d70\u7684\u8def\u4e0a\u201d\uff09\uff0c\u4f46\u80fd\u5229\u7528\u788e\u7247\u65f6\u95f4\uff08\u5348\u4f11\u3001\u665a\u4e0a\uff09\u5b8c\u6210\u6240\u6709\u4f5c\u4e1a\u548c\u76f4\u64ad\u5b66\u4e60\uff0c\u6267\u884c\u529b\u5f3a\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06**\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\uff0c\u4e3b\u52a8\u5bfb\u6c42\u53cd\u9988\uff0c\u9762\u5bf9\u6280\u672f\u6311\u6218\u6001\u5ea6\u79ef\u6781\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u8001\u5e08~\u6211\u8fd9\u8fb9\u6ca1\u6709\u95ee\u9898\uff0c\u7136\u540e\u5b8c\u4e86\u6211\u53ef\u4ee5\u53d1\u5c55\u4e00\u4e0b\u3002\u201d\uff08\u5bf9\u53d1\u5c55\u524d\u666f\u7684\u79ef\u6781\u56de\u5e94\uff09\n  > \u201c\u5b66\u59d0\u5b66\u59d0~\u6211\u542c\u5b8c\u5566[\u5472\u7259]\u8ddf\u7740\u8001\u5e08\u8bf4\u4e86\u51e0\u53e5~\u867d\u7136\u548c\u8001\u5e08\u8bf4\u7684\u8fd8\u662f\u4e0d\u592a\u4e00\u6837~\u4f46\u6211\u77e5\u9053\u8ba4\u771f\u5b66\u4e60~\u6162\u6162\u6765~\u603b\u6709\u4e00\u5929\u6211\u4e5f\u80fd\u8bf4\u7684\u8fd9\u4e48\u597d\u201d\uff08\u9762\u5bf9\u5dee\u8ddd\uff0c\u8868\u73b0\u51fa\u8010\u5fc3\u548c\u957f\u671f\u4e3b\u4e49\u5fc3\u6001\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u672a\u7adf\u7684\u827a\u672f\u68a6\u60f3**\u3002\u66fe\u56e0\u5bb6\u5ead\u539f\u56e0\u653e\u5f03\u7535\u5f71\u5b66\u9662\uff0c\u5185\u5fc3\u6709\u5f3a\u70c8\u7684\u8868\u6f14\u6b32\u548c\u89d2\u8272\u5851\u9020\u6e34\u671b\uff0c\u5e0c\u671b\u901a\u8fc7\u6709\u58f0\u6f14\u64ad\u5f25\u8865\u9057\u61be\uff0c\u5b9e\u73b0\u4e2a\u4eba\u4ef7\u503c\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u821e\u53f0\u8d4b\u80fd**\u3002\u80af\u5b9a\u5979\u7684\u5929\u8d4b\u548c\u70ed\u7231\uff0c\u5c06\u5979\u89c6\u4e3a\u201c\u672a\u6765\u7684\u4e13\u4e1a\u6f14\u64ad\u8005\u201d\u800c\u975e\u201c\u5b66\u5458\u201d\uff0c\u63d0\u4f9b\u80fd\u8ba9\u5979\u201c\u626e\u6f14\u4e0d\u540c\u89d2\u8272\u3001\u8ba9\u5c0f\u8bf4\u4eba\u7269\u771f\u5b9e\u8d77\u6765\u201d\u7684\u521b\u4f5c\u821e\u53f0\u548c\u8d44\u6e90\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u9ad8\u52a8\u673a\u3001\u4e2d\u8d44\u6e90\u3001\u9ad8\u5f39\u6027\uff0c\u7a33\u5b9a\u4ea4\u4ed8\uff0c\u6709\u5411T1-A\u8fdb\u5316\u7684\u6f5c\u529b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u6709\u72ec\u7acb\u5de5\u4f5c\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u5168\u804c\u5de5\u4f5c\u53ef\u80fd\u5bfc\u81f4\u65f6\u95f4\u51b2\u7a81\uff0c\u82e5\u8bfe\u7a0b\u5f3a\u5ea6\u4e0e\u5de5\u4f5c\u538b\u529b\u53e0\u52a0\uff0c\u53ef\u80fd\u4ea7\u751f\u79ef\u538b\u7126\u8651\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u6027\u5f3a\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u632b\u6298\u653e\u5f03\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u52a8\u673a\u4ee5\u5174\u8da3\u548c\u81ea\u6211\u5b9e\u73b0\u4e3a\u4e3b\uff0c\u5bf9\u201c\u51e0\u5929\u8d5a\u94b1\u201d\u7684\u6025\u8feb\u6027\u4f4e\uff0c\u80fd\u63a5\u53d7\u201c\u6162\u6162\u6765\u201d\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe\u540e\u7b2c2-4\u5468\uff0c\u5f53\u5de5\u4f5c\u7e41\u5fd9\u4e0e\u8bfe\u7a0b\u4f5c\u4e1a\u91cf\u4ea7\u751f\u51b2\u7a81\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u606d\u559c\u4f60\u901a\u5173\uff01\u6211\u770b\u5230\u4f60\u63d0\u4ea4\u7684\u4f5c\u4e1a\u548c\u5bf9\u89d2\u8272\u7684\u7406\u89e3\uff0c\u771f\u7684\u5f88\u6709\u7075\u6c14\uff0c\u8ba9\u6211\u60f3\u8d77\u4e86\u5f53\u5e74\u8003\u7535\u5f71\u5b66\u9662\u65f6\u5bf9\u8868\u6f14\u7684\u90a3\u79cd\u7eaf\u7cb9\u70ed\u7231\u3002\u63a5\u4e0b\u6765\u7684\u7cfb\u7edf\u8bfe\uff0c\u6211\u4eec\u4f1a\u4e00\u8d77\u628a\u4f60\u8fd9\u4efd\u5929\u8d4b\u6253\u78e8\u6210\u771f\u6b63\u7684\u4e13\u4e1a\u80fd\u529b\uff0c\u8ba9\u4f60\u5728\u58f0\u97f3\u7684\u4e16\u754c\u91cc\uff0c\u628a\u5f53\u5e74\u6ca1\u6f14\u5b8c\u7684\u620f\uff0c\u4e00\u4e2a\u4e2a\u2018\u6f14\u2019\u51fa\u6765\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\uff08\u4ea7\u54c1\u7ebfA\uff09\u3002\u5979\u9700\u8981\u624e\u5b9e\u7684\u6280\u672f\u8bad\u7ec3\u548c\u4e13\u4e1a\u7684\u53cd\u9988\uff0c\u4ee5\u6ee1\u8db3\u5176\u7cbe\u8fdb\u9700\u6c42\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u6ee1\u914dB\u6a21\u5757\uff08\u786c\u6838\u624b\u827a\u6c60\uff09** + **\u8f7b\u91cfC\u6a21\u5757\uff08\u60c5\u7eea\u8ba4\u540c\uff09**\u3002\u63d0\u4f9b\u4e13\u5bb61v1\u70b9\u8bc4\u548c\u771f\u5b9e\u6d3e\u5355\u5b9e\u6218\u673a\u4f1a\uff08B\u6a21\u5757\uff09\uff0c\u540c\u65f6\u7528\u771f\u8bda\u7684\u8d5e\u7f8e\uff08C\u6a21\u5757\uff09\u6ecb\u517b\u5176\u70ed\u60c5\u3002**\u5bc6\u5207\u5173\u6ce8\u5176\u662f\u5426\u51fa\u73b0\u4e3b\u52a8\u5e2e\u52a9\u540c\u5b66\u3001\u7ec4\u7ec7\u7ec3\u4e60\u7b49\u884c\u4e3a\uff0c\u4e00\u65e6\u51fa\u73b0\uff0c\u7acb\u5373\u542f\u52a8D\u6a21\u5757\uff08\u9ec4\u888d\u52a0\u8eab\u63d0\u5e72\u6cd5\uff09\uff0c\u8d4b\u4e88\u5176\u5c0f\u7ec4\u957f\u6216\u52a9\u6559\u89d2\u8272\u3002**\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u628a\u5979\u5f53\u4f5c\u666e\u901a\u5c0f\u767d\u7528\u201c\u4fdd\u59c6\u5f0f\u201d\u6559\u5b66\uff0c\u8fd9\u4f1a\u8ba9\u5979\u611f\u5230\u88ab\u77ee\u5316\u3002\u7981\u6b62\u7528\u201c\u51e0\u5929\u56de\u672c\u201d\u3001\u201c\u4fdd\u5e95\u6536\u5165\u201d\u7b49\u4f4e\u7aef\u8bdd\u672f\u523a\u6fc0\uff0c\u8fd9\u4e0e\u5176\u8ffd\u6c42\u827a\u672f\u5b9e\u73b0\u7684\u52a8\u673a\u76f8\u6096\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5f53\u5979\u6280\u672f\u8fbe\u6807\u3001\u83b7\u5f97\u6210\u5c31\u611f\u540e\uff0c\u53ef\u4ee5\u63a8\u8350\u9ad8\u9636\u8bbe\u5907\u3001\u79c1\u6559\u8bfe\u6216\u5bfc\u6f14\u8fdb\u9636\u8bfe\u7a0b\uff0c\u5979\u4e3a\u4e13\u4e1a\u4e70\u5355\u7684\u610f\u613f\u5f88\u9ad8\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u662f\u4e00\u4e2a\u5f88\u559c\u6b22\u6f14\u7ece\u7684\u5973\u751f~\u4ee5\u524d\u9ad8\u8003\u7684\u65f6\u5019\u4e5f\u88ab\u7535\u5f71\u5b66\u9662\u5f55\u53d6\u8fc7~\u540e\u6765\u5bb6\u91cc\u53ef\u80fd\u4e0d\u592a\u652f\u6301\u8d70\u6f14\u827a\u8def\u7ebf~\u6240\u4ee5\u653e\u5f03\u4e86~\u73b0\u5728\u63a5\u89e6\u5230\u4e86\u914d\u97f3\u4e3b\u64ad\u8fd9\u4e2a\u884c\u4e1a~\u6211\u611f\u89c9\u81ea\u5df1\u53ef\u4ee5\u626e\u6f14\u4e0d\u540c\u7684\u89d2\u8272~\u8ba9\u5c0f\u8bf4\u91cc\u9762\u7684\u4eba\u7269\u5f62\u8c61\u771f\u5b9e\u8d77\u6765~\u5fc3\u91cc\u8fd8\u662f\u5f88\u5f00\u5fc3\u7684\u201d\n2. > \u201c\u8001\u5e08~\u6211\u5bf9\u5f55\u4e66\uff0c\u753b\u672c\uff0c\u5ba1\u542c\u90fd\u975e\u5e38\u611f\u5174\u8da3[\u5472\u7259][\u5472\u7259][\u5472\u7259][\u80dc\u5229][\u80dc\u5229]\u4e5f\u5f88\u60f3\u8ddf\u60a8\u597d\u597d\u5b66\u4e60~\u52aa\u529b\u52a0\u6cb9\u201d\n3. > \u201c\u5b66\u59d0\u5b66\u59d0~\u6211\u542c\u5b8c\u5566[\u5472\u7259][\u80dc\u5229]\u8ddf\u7740\u8001\u5e08\u8bf4\u4e86\u51e0\u53e5~\u867d\u7136\u548c\u8001\u5e08\u8bf4\u7684\u8fd8\u662f\u4e0d\u592a\u4e00\u6837~\u4f46\u6211\u77e5\u9053\u8ba4\u771f\u5b66\u4e60~\u6162\u6162\u6765~\u603b\u6709\u4e00\u5929\u6211\u4e5f\u80fd\u8bf4\u7684\u8fd9\u4e48\u597d\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u81ea\u6211\u5b9e\u73b0\uff08\u5f25\u8865\u672a\u7adf\u7684\u827a\u672f\u68a6\u60f3\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u4e13\u4e1a\u821e\u53f0\u8d4b\u80fd\uff0c\u7528B\u6a21\u5757\u6ee1\u8db3\u6280\u672f\u7cbe\u8fdb\u9700\u6c42\uff0c\u5e76\u89c2\u5bdf\u63d0\u62d4\u4e3a\u751f\u6001\u5efa\u8bbe\u8005\uff08D\u6a21\u5757\uff09\u7684\u673a\u4f1a\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\"}\n```";
