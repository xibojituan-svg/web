    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677162176\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677162176 / \u6635\u79f0\uff1a\u65af\u97f5 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-11 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e-\u4f0a\u71361(\u80e1\u82e5\u4f0a) -> \u73ed\u4e3b\u4efb-\u5b89\u7ae5\u58f0(\u5218\u7d20\u82f1) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u9a6c\u62c9\u96c5\u6500\u767b\u8ba1\u5212\u7cbe\u82f1\u7248\uff08\u7cfb\u7edf\u8bfe\uff09\uff0c\u4ef7\u683c2380\u5143 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3**\uff08\u5b66\u8d39\u7531\u5802\u59d0\u57ab\u4ed8\uff0c\u81ea\u8eab\u7ecf\u6d4e\u7d27\u5f20\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u9ad8\u5bbd\u88d5**\uff08\u81ea\u79f024\u5c0f\u65f6\u6709\u7a7a\uff0c\u8ba1\u5212\u5168\u804c\uff0c\u6bcf\u5929\u9884\u8ba1\u5f55\u97f36\u5c0f\u65f6\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u5df2\u62a5\u5907\u5e76\u652f\u6301**\uff08\u5802\u59d0\u867d\u62c5\u5fc3\u8bc8\u9a97\uff0c\u4f46\u6700\u7ec8\u5e2e\u5fd9\u4ed8\u6b3e\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u2b06\u9ad8 (7-8\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u957f\u671f\u804c\u4e1a\u53d1\u5c55\u800c\u6765\uff0c\u517c\u5177\u660e\u786e\u7684\u53d8\u73b0\u76ee\u6807\uff0c\u4f46\u5fc3\u6001\u52a1\u5b9e\uff0c\u4e0d\u8ffd\u6c42\u77ed\u671f\u66b4\u5bcc\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u5e08\u59d0\u4f60\u653e\u5fc3\uff0c\u6211\u4e0d\u4f1a\u98d8\u8d77\u6765\uff0c\u6211\u77e5\u9053\u6211\u81ea\u5df1\u662f\u4ec0\u4e48\u5b9e\u529b...\u6211\u613f\u610f\u642c\u7816\uff0c\u613f\u610f\u4ece\u5c31\u662f\u6700\u7b80\u5355\u7684\u5f00\u59cb\u4e00\u70b9\u70b9\u79ef\u7d2f\u7ecf\u9a8c\u505a\u8d77\u3002\u201d\n  > \u201c\u6211\u4e5f\u662f\u5c31\u662f\u60f3\u8981\u4ece\u4e8b\u8fd9\u4e00\u884c\uff0c\u7136\u540e\u60f3\u8981\u8d5a\u94b1\uff0c\u8fd8\u662f\u8d5a\u94b1\u517b\u5bb6\u6700\u91cd\u8981\uff0c\u6210\u5e74\u4eba\u5c31\u662f\u90fd\u662f\u8981\u8e0f\u8e0f\u5b9e\u5b9e...\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 **\u8d44\u91d1\u627f\u8f7d\u529b\uff1a\u4f4e (2-3\u5206)** \u2014 \u5b66\u8d39\u9700\u5802\u59d0\u57ab\u4ed8\uff0c\u81ea\u8ff0\u201c\u73b0\u5728\u6bd4\u8f83\u7a77\u201d\uff0c\u8bbe\u5907\u4e3a\u4e8c\u624b\u95f2\u9c7c\u8d2d\u4e70\u4e14\u65e0\u6cd5\u9000\u8d27\u3002**\u77ed\u677f\u51b3\u5b9a\u6574\u4f53\u8bc4\u7ea7\u3002**\n- \u23f1 **\u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a\u9ad8 (8-9\u5206)** \u2014 \u5168\u592924\u5c0f\u65f6\u6709\u7a7a\uff0c\u8ba1\u5212\u5168\u804c\uff0c\u6bcf\u5929\u9884\u8ba1\u5f55\u97f36\u5c0f\u65f6\uff0c\u5b66\u4e60\u6295\u5165\u5ea6\u9ad8\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 **\u5bb6\u5ead\u652f\u6301\u5ea6\uff1a\u4e2d (5-6\u5206)** \u2014 \u5802\u59d0\u867d\u652f\u6301\u4ed8\u6b3e\uff0c\u4f46\u8fc7\u7a0b\u6709\u201c\u6015\u88ab\u8bc8\u9a97\u201d\u7684\u7591\u8651\uff0c\u8bf4\u660e\u975e\u65e0\u6761\u4ef6\u7684\u5f3a\u529b\u652f\u6301\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8 (7-8\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u80fd\u6e05\u6670\u8ba4\u77e5\u81ea\u8eab\u4e0d\u8db3\uff08\u5982\u82f1\u8bed\u53e3\u97f3\u4e0d\u6807\u51c6\uff09\uff0c\u9762\u5bf9\u6280\u672f\u95ee\u9898\uff08\u5f55\u97f3\u8f6f\u4ef6\u64cd\u4f5c\uff09\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u4e0d\u62b1\u6028\u3002\u5bf9\u9500\u552e/\u73ed\u4e3b\u4efb\u7684\u9f13\u52b1\u548c\u6307\u5bfc\u8868\u73b0\u51fa\u6781\u9ad8\u7684\u73cd\u60dc\u4e0e\u611f\u6069\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u8001\u5e08\u7ed9\u6211\u6253\u7684\u8fd9\u4e9b\u6211\u90fd\u6709\u8bb0\u5f55\u4e0b\u6765\uff0c\u7136\u540e\u8ba4\u771f\u7684\u53cd\u590d\u770b\u4e86\uff0c\u55ef\uff0c\u60a8\u5bf9\u6211\u7684\u8bc4\u70b9\u8bc4\uff0c\u6211\u5f88\u73cd\u60dc\u673a\u4f1a\uff0c\u8c22\u8c22\u60a8\u3002\u201d\n  > \u201c\u4eca\u5929\u65e9\u4e0a\u8fd9\u4e2a\u6211\u8bfb\u7684\u8fd9\u4e2a\u65b9\u5f0f\u7edd\u5bf9\u5c31\u662f\u90a3\u79cd\u64ad\u97f3\u4f53...\u8fd9\u4e2a\u592a\u79bb\u8c31\u4e86\u3002\u6211\u4e00\u77ac\u95f4\u89c9\u5f97\u6211\u90fd\u56de\u5230\u4e86\u90a3\u4e2a\u5c0f\u5b66\u65f6\u5019\u53bb\u53c2\u52a0\u90a3\u4e2a\u4ec0\u4e48\u6717\u8bf5\u6bd4\u8d5b\u3002\u201d\uff08\u80fd\u81ea\u5632\uff0c\u5fc3\u6001\u8f7b\u677e\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42** \u4e0e **\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42** \u7684\u590d\u5408\u4f53\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u7ecf\u6d4e\u4e0a\u7684\u4e0d\u5b89\u5168\u611f**\uff08\u9700\u8981\u8d5a\u94b1\u517b\u5bb6\uff0c\u5b66\u8d39\u9700\u501f\u6b3e\uff09\u4e0e **\u5bf9\u81ea\u8eab\u80fd\u529b\u4ef7\u503c\u7684\u4e0d\u786e\u5b9a\u611f**\uff08\u62c5\u5fc3\u53e3\u97f3\u3001\u8bbe\u5907\u4e0d\u597d\u3001\u57fa\u7840\u843d\u4e0b\u592a\u4e45\uff09\u3002\u5979\u9700\u8981\u4e00\u4efd\u80fd\u5e26\u6765\u7a33\u5b9a\u6536\u5165\u7684\u6280\u80fd\uff0c\u4ee5\u83b7\u53d6\u7ecf\u6d4e\u72ec\u7acb\u548c\u804c\u4e1a\u5c0a\u4e25\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u6e05\u6670\u7684\u6210\u957f\u8def\u5f84**\u3002\u5979\u6781\u5ea6\u73cd\u89c6\u4e13\u4e1a\u70b9\u8bc4\uff08\u201c\u5f88\u73cd\u60dc\u673a\u4f1a\u201d\uff09\uff0c\u5e76\u9700\u8981\u88ab\u660e\u786e\u544a\u77e5\u201c\u4ece\u54ea\u5f00\u59cb\u3001\u5982\u4f55\u4e00\u6b65\u6b65\u8d5a\u94b1\u201d\uff0c\u7528\u201c\u8e0f\u5b9e\u79ef\u7d2f\u201d\u7684\u5b89\u5168\u611f\u5bf9\u51b2\u5979\u7684\u7ecf\u6d4e\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u5411 **\u6df7\u5408\u4f533\u53f7\uff1a\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b** \u8fdb\u5316\u524d\u4f53) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u62a5\u540d\u3001\u65e0\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\u3002\u867d\u6709\u501f\u6b3e\uff08\u5802\u59d0\u57ab\u4ed8\uff09\uff0c\u4f46\u5c5e\u4e8e\u4eb2\u53cb\u652f\u6301\uff0c\u672a\u8fbeT8-D\u7edd\u8def\u8d4c\u5f92\u7ea2\u7ebf\u3002\n\n**\u5224\u5b9a\u6811\u8def\u5f84\u63a8\u6f14**\uff1a\n1.  **\u652f\u4ed8\u6838\u67e5**\uff1a\u5b66\u8d39\u7531\u5802\u59d0\u652f\u4ed8\uff0c\u975e\u7f51\u8d37/\u501f\u5457\uff0c\u4e0d\u89e6\u53d1C2\u964d\u7ea7\u3002\n2.  **\u4e09\u8f74\u8bc4\u5206**\uff1a\u52a8\u673a\u7eaf\u5ea6(7-8\u5206\uff0c\u9ad8)\u3001\u8d44\u6e90\u5e95\u5ea7(5-6\u5206\uff0c\u4e2d)\u3001\u5fc3\u7406\u5f39\u6027(7-8\u5206\uff0c\u9ad8)\u3002\n3.  **\u5224\u5b9a\u6811\u5339\u914d**\uff1a\u52a8\u673a\u22655\u5206\uff0c\u5f39\u6027\u22657\u5206\uff0c\u8fdb\u5165**\u9ad8\u5f39\u6027\u901a\u9053**\u3002\u7528\u6237\u672a\u8868\u73b0\u51fa\u4e3b\u52a8\u7edf\u7b79\u884c\u4e3a\uff08\u975eT1\uff09\uff0c\u6280\u672f\u8ffd\u95ee\u6df1\u5ea6\u4e00\u822c\uff08\u975eT3\uff09\uff0c\u793e\u4ea4\u53d1\u8a00\u91cf\u9002\u4e2d\u4e14\u805a\u7126\u5b66\u4e60\uff08\u975eT7\uff09\u3002\u7b26\u5408\u201c\u4ee5\u4e0a\u5747\u672a\u547d\u4e2d\u201d\u7684**T2 \u4f4e\u8c03\u8001\u9ec4\u725b**\u9ed8\u8ba4\u5f52\u7c7b\u3002\u540c\u65f6\uff0c\u5176\u201c\u73cd\u60dc\u673a\u4f1a\u201d\u3001\u201c\u8e0f\u5b9e\u79ef\u7d2f\u201d\u7684\u5fc3\u6001\u548c\u5168\u804c\u6295\u5165\u7684\u610f\u613f\uff0c\u662f**\u6df7\u5408\u4f533\u53f7\uff08\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b\uff09** \u7684\u5178\u578b\u8fdb\u5316\u524d\u4f53\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4f4e** | \u5802\u59d0\u5df2\u652f\u6301\u4ed8\u6b3e\uff0c\u98ce\u9669\u89e3\u9664\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u65f6\u95f4\u5145\u88d5\uff0c\u5b66\u4e60\u610f\u613f\u5f3a\uff0c\u5d29\u76d8\u98ce\u9669\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u81ea\u6211\u8c03\u6574\uff0c\u9047\u632b\u4f1a\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u4e2d** | **\u6700\u6838\u5fc3\u98ce\u9669**\u3002\u5979\u76ee\u6807\u660e\u786e\uff08\u8d5a\u94b1\u517b\u5bb6\uff09\uff0c\u4e14\u5df2\u6295\u5165\u8d44\u91d1\uff08\u8bbe\u5907\uff09\u548c\u65f6\u95f4\uff08\u5168\u804c\uff09\u3002\u82e5\u5728\u627f\u8bfa\u5468\u671f\u5185\uff08\u59822-3\u4e2a\u6708\uff09\u63a5\u4e0d\u5230\u7b2c\u4e00\u5355\u6216\u6536\u5165\u8fdc\u4f4e\u4e8e\u9884\u671f\uff08\u201c3511h\u6211\u4e5f\u613f\u610f\u63a5\u201d\uff09\uff0c**\u52a1\u5b9e\u7684\u7ecf\u6d4e\u538b\u529b\u53ef\u80fd\u8f6c\u5316\u4e3a\u5931\u671b\u548c\u9000\u8d39\u8bc9\u6c42**\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c60-90\u5929**\u3002\u82e5\u6b64\u65f6\u4ecd\u65e0\u4efb\u4f55\u5b9e\u8d28\u6027\u7684\u63a5\u5355\u673a\u4f1a\u6216\u6781\u4f4e\u6536\u76ca\uff0c\u5176\u201c\u8e0f\u5b9e\u79ef\u7d2f\u201d\u7684\u8010\u5fc3\u53ef\u80fd\u8017\u5c3d\uff0c\u9000\u8d39\u98ce\u9669\u6025\u5267\u5347\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u5979\u8bf4......\u201d**\n> \u201c\u65af\u97f5\uff0c\u770b\u5230\u4f60\u4e3a\u81ea\u5df1\u89c4\u5212\u4e86\u5168\u804c\u5b66\u4e60\u7684\u51b3\u5fc3\uff0c\u5e76\u4e14\u5df2\u7ecf\u63d0\u524d\u51c6\u5907\u597d\u4e86\u8bbe\u5907\uff0c\u8fd9\u4efd\u884c\u52a8\u529b\u975e\u5e38\u96be\u5f97\u3002\u4f60\u7684\u58f0\u97f3\u5e95\u5b50\u548c\u5b66\u4e60\u6001\u5ea6\u90fd\u5f88\u68d2\uff0c\u54b1\u4eec\u4e0d\u7740\u6025\uff0c\u5c31\u50cf\u4f60\u8bf4\u7684\u2018\u4ece\u6700\u7b80\u5355\u7684\u5f00\u59cb\u4e00\u70b9\u70b9\u79ef\u7d2f\u2019\u3002\u6211\u4f1a\u5e2e\u4f60\u628a\u6bcf\u4e00\u6b65\u90fd\u8d70\u624e\u5b9e\uff0c\u5148\u641e\u5b9a\u8bbe\u5907\u8c03\u8bd5\uff0c\u518d\u4e00\u6b65\u6b65\u5e26\u4f60\u63a5\u89e6\u8bd5\u97f3\u3002\u8d5a\u94b1\u517b\u5bb6\u7684\u76ee\u6807\uff0c\u6211\u4eec\u7a33\u7a33\u5730\u6765\u5b9e\u73b0\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5979\u9700\u8981\u624e\u5b9e\u7684\u6280\u80fd\u548c\u660e\u786e\u7684\u63a5\u5355\u8def\u5f84\uff0c\u5bf9\u201c\u5174\u8da3\u6e38\u4e50\u201d\u65e0\u611f\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n  1.  **\u3010B\u6a21\u5757\uff1a\u786c\u6838\u624b\u827a\u6c60\u6ee1\u914d\u3011**\uff1a\u63d0\u4f9b\u7cbe\u786e\u76841v1\u4f5c\u4e1a\u70b9\u8bc4\u3001\u771f\u5b9e\u7684\u6d3e\u5355\u5b9e\u6218\u673a\u4f1a\uff08\u54ea\u6015\u662f\u5c0f\u5355\uff09\u3002\u8fd9\u662f\u6ee1\u8db3\u5176\u201c\u8d5a\u94b1\u201d\u6838\u5fc3\u8bc9\u6c42\u7684\u5173\u952e\u3002\n  2.  **\u3010\u7279\u79cdA\u6a21\u5757\uff1a\u964d\u7ef4\u7269\u7406\u4ee3\u529e\u3011**\uff1a\u9488\u5bf9\u5176\u201c\u4e0d\u4f1a\u5b89\u88c5\u8c03\u8bd5\u201d\u58f0\u5361\u7684\u95ee\u9898\uff0c**\u7acb\u5373\u542f\u52a8\u8fdc\u7a0b\u7269\u7406\u4ee3\u529e**\uff0c\u7531\u73ed\u4e3b\u4efb\u6216\u6280\u672f\u652f\u6301\u76f4\u63a5\u8fdc\u7a0b\u534f\u52a9\u5b89\u88c5\u8c03\u8bd5\uff0c\u8de8\u8d8a\u64cd\u4f5c\u9e3f\u6c9f\uff0c\u5efa\u7acb\u5f3a\u4fe1\u4efb\u3002\n  3.  **\u3010D\u6a21\u5757\uff1a\u9ec4\u888d\u52a0\u8eab\u63d0\u5e72\u89c2\u5bdf\u3011**\uff1a\u89c2\u5bdf\u5176\u5b66\u4e60\u8fdb\u5c55\uff0c\u5f53\u5176\u4f5c\u4e1a\u8d28\u91cf\u7a33\u5b9a\u3001\u5f00\u59cb\u5e2e\u52a9\u540c\u5b66\u7b54\u7591\u65f6\uff0c**\u8fc5\u901f\u63d0\u62d4\u4e3a\u5c0f\u7ec4\u957f\u6216\u4f5c\u4e1a\u70b9\u8bc4\u5b98**\uff0c\u8d4b\u4e88\u5176\u7ba1\u7406\u6743\u9650\uff0c\u6fc0\u53d1\u5176\u8d23\u4efb\u611f\u548c\u5f52\u5c5e\u611f\uff0c\u5b8c\u6210\u5411\u6df7\u5408\u4f533\u53f7\u7684\u8fdb\u5316\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n  1.  \u753b\u4e0d\u5207\u5b9e\u9645\u7684\u5927\u997c\uff08\u5982\u201c\u4e00\u4e2a\u6708\u8f7b\u677e\u8fc7\u4e07\u201d\uff09\u3002\u5fc5\u987b\u4e0e\u5176\u201c\u8e0f\u5b9e\u79ef\u7d2f\u201d\u7684\u9884\u671f\u5bf9\u9f50\u3002\n  2.  \u5ffd\u89c6\u5176\u8bbe\u5907\u8c03\u8bd5\u7684\u6c42\u52a9\u3002\u8fd9\u662f\u5efa\u7acb\u4fe1\u4efb\u7684\u7b2c\u4e00\u4e2a\u5173\u952e\u8282\u70b9\uff0c\u5fc5\u987b\u9ad8\u6548\u89e3\u51b3\u3002\n  3.  \u7528\u8fc7\u4e8e\u5a31\u4e50\u5316\u3001\u8f7b\u677e\u7684\u8bed\u6c14\u4ea4\u6d41\u3002\u5979\u9700\u8981\u7684\u662f\u4e13\u4e1a\u3001\u52a1\u5b9e\u7684\u6307\u5bfc\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u9700\u4e0e\u6210\u679c\u6302\u94a9**\u3002\u5f53\u5176\u6280\u80fd\u8fbe\u6807\u3001\u63a5\u5230\u7b2c\u4e00\u5355\u540e\uff0c\u53ef\u4ee5\u987a\u52bf\u63a8\u4ecb\u9ad8\u9636\u8bbe\u5907\u3001\u540e\u671f\u8bfe\u7a0b\u7b49\u3002\u5347\u5355\u8bdd\u672f\u5e94\u56f4\u7ed5\u201c\u63d0\u5347\u63a5\u5355\u6548\u7387\u548c\u5355\u4ef7\u201d\u5c55\u5f00\uff0c\u800c\u975e\u5236\u9020\u7126\u8651\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5e08\u59d0\u4f60\u653e\u5fc3\uff0c\u6211\u4e0d\u4f1a\u98d8\u8d77\u6765\uff0c\u6211\u77e5\u9053\u6211\u81ea\u5df1\u662f\u4ec0\u4e48\u5b9e\u529b...\u6211\u613f\u610f\u642c\u7816\uff0c\u613f\u610f\u4ece\u5c31\u662f\u6700\u7b80\u5355\u7684\u5f00\u59cb\u4e00\u70b9\u70b9\u79ef\u7d2f\u7ecf\u9a8c\u505a\u8d77\uff0c\u60a8\u4e0d\u7528\u62c5\u5fc3\u6211\u90a3\u4e2a\u597d\u9ad8\u9a9b\u8fdc\u3002\u201d\n2. > \u201c\u6211\u4e5f\u662f\u5c31\u662f\u60f3\u8981\u4ece\u4e8b\u8fd9\u4e00\u884c\uff0c\u7136\u540e\u60f3\u8981\u8d5a\u94b1\uff0c\u8fd8\u662f\u8d5a\u94b1\u517b\u5bb6\u6700\u91cd\u8981\uff0c\u6210\u5e74\u4eba\u5c31\u662f\u90fd\u662f\u8981\u8e0f\u8e0f\u5b9e\u5b9e...\u201d\n3. > \u201c\u6211\u73b0\u5728\u6bd4\u8f83\u7a77\uff0c\u6211\u5b66\u8d39\u662f\u6211\u5802\u59d0\u5e2e\u6211\u4ea4\u7684\uff0c\u6240\u4ee5\u6211\u73b0\u5728\u8fd9\u4e2a\u8bbe\u5907\u5c31\u662f\u5c06\u5c31\u7528\uff0c\u80fd\u5f55\u5c31\u884c\u3002\u7b49\u5230\u8d5a\u4e86\u94b1\u4e4b\u540e\uff0c\u80af\u5b9a\u662f\u8fd8\u662f\u60f3\u8981\u5728\u54b1\u4eec\u8fd9\u8fb9\u4e70\u4e00\u624b\u7684\u8bbe\u5907...\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\uff08\u5411\u6df7\u5408\u4f533\u53f7\u8fdb\u5316\uff09\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7ecf\u6d4e\u5b89\u5168\u4e0e\u804c\u4e1a\u5c0a\u91cd\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u572860-90\u5929\u5185\u63d0\u4f9b\u771f\u5b9e\u7684\u3001\u54ea\u6015\u5fae\u5c0f\u7684\u53d8\u73b0\u673a\u4f1a\uff0c\u5e76\u7528\u201c\u9ec4\u888d\u52a0\u8eab\u201d\u8d4b\u4e88\u5176\u73ed\u7ea7\u5185\u89d2\u8272\u4e0e\u8d23\u4efb\u611f\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b (\u6df7\u5408\u4f533\u53f7\u8fdb\u5316\u524d\u4f53)\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168\u4e0e\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + B\u6a21\u5757(\u6ee1\u914d) + \u7279\u79cdA\u6a21\u5757(\u8fdc\u7a0b\u4ee3\u529e) + D\u6a21\u5757(\u89c2\u5bdf\u63d0\u5e72)\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u5973\", \"city\": \"\u8fbd\u5b81\u6c88\u9633\"}\n```";
