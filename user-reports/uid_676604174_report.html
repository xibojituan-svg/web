f1b> \u201c\u521d\u51fa\u8305\u5e90\uff0c\u4e0d\u8981\u7d27\u7684\u201d\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42** \u4e0e **\u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u4e2d\u5e74\u5371\u673a\u4e0b\u7684\u4ef7\u503c\u8bc1\u660e\u7126\u8651\u3002\u4ed6\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u65b0\u6280\u80fd\u3001\u83b7\u5f97\u6210\u5c31\uff08\u8bc1\u4e66\u3001\u63a5\u5355\uff09\uff0c\u5728\u5b69\u5b50\u9762\u524d\u91cd\u5851\u4e00\u4e2a\u201c\u52aa\u529b\u6311\u6218\u81ea\u6211\u201d\u7684\u7236\u4eb2\u5f62\u8c61\uff0c\u8d62\u5f97\u5bb6\u5ead\u4e0e\u793e\u4f1a\u7684\u5c0a\u91cd\uff0c\u5e76\u5b9e\u73b0\u4e2a\u4eba\u6f5c\u80fd\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u4e13\u4e1a\u9886\u8def\u4eba\u201d\u4e0e\u201c\u4ef7\u503c\u89c1\u8bc1\u8005\u201d\u7684\u53cc\u91cd\u8eab\u4efd\u8ba4\u540c**\u3002\u63d0\u4f9b\u660e\u786e\u7684\u6210\u957f\u8def\u5f84\uff08\u8bc1\u4e66\u3001\u63a5\u5355\uff09\u3001\u7ed9\u4e88\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\uff0c\u5e76\u8ba4\u53ef\u4ed6\u4f5c\u4e3a\u201c\u52aa\u529b\u7236\u4eb2\u201d\u548c\u201c\u6f5c\u529b\u5b66\u5458\u201d\u7684\u53cc\u91cd\u4ef7\u503c\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u8fdb\u5316\u524d\u4f53\uff0c\u6709\u5411\u6df7\u5408\u4f533\u53f7\u3010\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b\u3011\u8fc1\u79fb\u7684\u6f5c\u529b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u7b49\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u56e0\u5176\u52a8\u673a\u5305\u542b\u5bb6\u5ead\u8d23\u4efb\uff0c\u82e5\u5bb6\u4eba\u5f3a\u70c8\u53cd\u5bf9\u53ef\u80fd\u4ea7\u751f\u5f71\u54cd\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u65f6\u95f4\u5145\u88d5\uff0c\u5b66\u4e60\u610f\u613f\u5f3a\uff0c\u5d29\u76d8\u98ce\u9669\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u6267\u884c\u529b\u5f3a\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u632b\u6298\u653e\u5f03\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u4ed6\u867d\u672a\u6781\u7aef\u8ffd\u95ee\u201c\u51e0\u5929\u8d5a\u94b1\u201d\uff0c\u4f46\u5bf9\u6536\u76ca\u6709\u660e\u786e\u9884\u671f\uff08\u8be2\u95ee\u6536\u76ca\u8868\u683c\uff09\u3002\u82e5\u5b66\u4e60\u540e\u671f\u63a5\u5355\u4e0d\u987a\u6216\u6536\u76ca\u8fdc\u4f4e\u4e8e\u9884\u671f\uff0c\u53ef\u80fd\u4ea7\u751f\u5931\u671b\u60c5\u7eea\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-3\u4e2a\u6708**\u3002\u5f53\u6280\u80fd\u5b66\u4e60\u8fdb\u5165\u5e73\u53f0\u671f\uff0c\u4e14\u8bd5\u97f3/\u63a5\u5355\u6210\u679c\u672a\u8fbe\u5176\u201c\u8bc1\u660e\u81ea\u6211\u201d\u7684\u9884\u671f\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6f58\u4fca\u4f60\u597d\uff0c\u770b\u5230\u4f60\u4e3a\u4e86\u7ed9\u5b69\u5b50\u505a\u699c\u6837\u800c\u9009\u62e9\u5b66\u4e60\u65b0\u6280\u80fd\uff0c\u8fd9\u4efd\u8d23\u4efb\u611f\u7279\u522b\u8ba9\u4eba\u656c\u4f69\u3002\u4f60\u4e0d\u662f\u4e00\u4e2a\u4eba\u5728\u6218\u6597\uff0c\u6211\u4eec\u4f1a\u4e3a\u4f60\u89c4\u5212\u6e05\u6670\u7684\u6210\u957f\u8def\u5f84\uff0c\u4ece\u62ff\u5230\u8bc1\u4e66\u5230\u63a5\u5230\u7b2c\u4e00\u5355\uff0c\u6bcf\u4e00\u6b65\u90fd\u8d70\u5f97\u624e\u5b9e\u3002\u4f60\u7684\u8ba4\u771f\u52b2\u513f\uff0c\u6ce8\u5b9a\u4f1a\u5f00\u82b1\u7ed3\u679c\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176\u9ad8\u8d44\u6e90\u5e95\u5ea7\u3001\u5f3a\u6267\u884c\u529b\u548c\u5bf9\u4e13\u4e1a\u6027\u7684\u8ffd\u6c42\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u6ee1\u914dB\u6a21\u5757\uff08\u786c\u6838\u624b\u827a\u6c60\uff09**\u3002\u63d0\u4f9b\u4e13\u5bb61v1\u7b54\u7591\u3001\u9ad8\u96be\u5ea6\u5b9e\u64cd\u4efb\u52a1\u3001\u771f\u5b9e\u6d3e\u5355\u5b9e\u6218\u3002**\u89c2\u5bdf\u5e76\u9002\u65f6\u542f\u52a8D\u6a21\u5757\uff08\u8eab\u4efd\u4e0e\u6743\u529b\u5149\u73af\u6c60\uff09**\uff1a\u4e00\u65e6\u53d1\u73b0\u5176\u51fa\u73b0\u4e3b\u52a8\u5e2e\u52a9\u540c\u5b66\u3001\u7edf\u8ba1\u8fdb\u5ea6\u7b49\u201c\u7edf\u7b79\u201d\u884c\u4e3a\uff0c\u7acb\u5373\u8fdb\u884c\u201c\u9ec4\u888d\u52a0\u8eab\u63d0\u5e72\u201d\uff0c\u4efb\u547d\u4e3a\u7ec4\u957f\u6216\u5236\u4f5c\u4eba\uff0c\u6ee1\u8db3\u5176\u6f5c\u5728\u7684\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\u9700\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u8f7b\u677e\u6708\u5165\u8fc7\u4e07\u201d\u7b49\u6d6e\u5938\u8bdd\u672f\u523a\u6fc0\u5176\u53d8\u73b0\u9884\u671f\uff0c\u7834\u574f\u5176\u201c\u8e0f\u5b9e\u52aa\u529b\u201d\u7684\u4ef7\u503c\u89c2\u3002\u907f\u514d\u5c06\u5176\u89c6\u4e3a\u7eaf\u7cb9\u7684\u201c\u641e\u94b1\u5de5\u5177\u4eba\u201d\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5176\u9ad8\u8d44\u6e90\u5e95\u5ea7\u548c\u9ad8\u5fc3\u7406\u5f39\u6027\uff0c\u80fd\u627f\u53d7\u5e76\u53ef\u80fd\u8ffd\u6c42\u66f4\u9ad8\u9636\u3001\u66f4\u4e13\u4e1a\u7684\u8bfe\u7a0b\uff08\u5982\u540e\u671f\u5236\u4f5c\u3001\u8bbe\u5907\u8fdb\u9636\u8bfe\uff09\u3002\u4f46\u63a8\u4ecb\u9700\u57fa\u4e8e\u5176\u6280\u80fd\u8fdb\u5c55\u548c\u660e\u786e\u9700\u6c42\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u8fd9\u4efd\u5de5\u4f5c\u6700\u8d77\u7801\u8ba9\u5b69\u5b50\u4e5f\u53ef\u4ee5\u5728\u9762\u5bf9\u4e2d\u8003\u7684\u538b\u529b\u65f6\u770b\u5230\u4ed6\u7684\u7236\u4eb2\u5728\u4e0d\u60d1\u4e4b\u5e74\u4e5f\u53ef\u4ee5\u52aa\u529b\u5c1d\u8bd5\u6311\u6218\u81ea\u6211\u3002\u201d **(\u6838\u5fc3\u52a8\u673a\uff1a\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0)**\n2. > \u201c\u6211\u6709\u65f6\u95f4\u4e14\u6709\u7535\u8111\uff0c\u7535\u8111\u914d\u7f6e\u5f88\u9ad8\u3002\u201d **(\u9ad8\u8d44\u6e90\u5e95\u5ea7\u8bc1\u660e)**\n3. > \u201c\u5e72\u5c31\u5b8c\u4e86\u3002\u201d **(\u9ad8\u5fc3\u7406\u5f39\u6027\u4e0e\u5f3a\u6267\u884c\u529b\u8bc1\u660e)**\n4. > \u201c\u540e\u9762\u8bfe\u7a0b\u8981\u591a\u5c11\u8d39\u7528\u54c8\u201d **(\u7406\u6027\u6d88\u8d39\uff0c\u5173\u6ce8\u957f\u671f\u6295\u5165)**\n5. > \u201c\u5f55\u4e66\u3001\u7edf\u7b79\u3001\u753b\u672c\u3001\u540e\u671f\u90fd\u53ef\u4ee5\u201d **(\u5b66\u4e60\u76ee\u6807\u660e\u786e\uff0c\u613f\u610f\u627f\u62c5\u591a\u79cd\u89d2\u8272\uff0c\u6f5c\u529b\u5de8\u5927)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\uff08\u8fdb\u5316\u524d\u4f53\uff09\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6e05\u6670\u3001\u4e13\u4e1a\u7684\u6210\u957f\u8def\u5f84\u4e0e\u4ef7\u503c\u8ba4\u53ef\uff0c\u4e25\u9632\u6536\u76ca\u9884\u671f\u843d\u5dee\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\"}\n```";
