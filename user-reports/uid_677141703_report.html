    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u4e0e\u98ce\u63a7\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u7f3a\u652f\u4ed8\u80fd\u529b\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u3001\u804c\u4e1a\u72b6\u6001\u3001\u5177\u4f53\u65f6\u95f4\u6295\u5165\u627f\u8bfa\u7b49\u5173\u952e\u4fe1\u606f\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n\n### \u52a8\u673a\u7eaf\u5ea6\n- **\u8868\u5c42**\uff1a\u5bf9\u201c\u5feb\u901f\u548c\u957f\u671f\u6536\u5165\u201d\u611f\u5174\u8da3\uff0c\u5173\u6ce8\u8d44\u6e90\u5206\u914d\uff08\u7248\u6743\u4e66\u6570\u91cf\u3001\u798f\u5229\uff09\uff0c\u8be2\u95ee\u62a5\u540d\u533a\u522b\u3002\n- **\u6df1\u5c42**\uff1a**\u53d8\u73b0\u9a71\u52a8\u660e\u786e**\uff0c\u5bf9\u201c\u62a2\u5355\u201d\u673a\u5236\u654f\u611f\uff0c\u5bf9\u201cAI\u201d\u56de\u590d\u8b66\u89c9\uff0c\u6709\u8d44\u6e90\u8c08\u5224\u610f\u8bc6\u3002\n- **\u7eaf\u5ea6\u8bc4\u4f30**\uff1a**\u4e2d\u4f4e**\u3002\u5174\u8da3\u59cb\u4e8e\u53d8\u73b0\uff0c\u5bf9\u5b66\u4e60\u8fc7\u7a0b\uff08\u4f5c\u4e1a\u3001\u7ec3\u4e60\uff09\u6709\u57fa\u672c\u914d\u5408\uff0c\u4f46\u6838\u5fc3\u5173\u6ce8\u70b9\u59cb\u7ec8\u5728\u8d44\u6e90\u3001\u798f\u5229\u3001\u53d8\u73b0\u8def\u5f84\u7b49\u5916\u90e8\u6fc0\u52b1\uff0c\u5185\u5728\u5174\u8da3\u4e0e\u957f\u671f\u5b66\u4e60\u9a71\u52a8\u529b\u4fe1\u53f7\u5f31\u3002\n\n### \u8d44\u6e90\u5e95\u5ea7\n- **\u65f6\u95f4\u8d44\u6e90**\uff1a\u81ea\u79f0\u517c\u804c\u4e0d\u5f71\u54cd\u4e3b\u4e1a\uff0c\u80fd\u5b8c\u6210\u665a\u95f4\u4f5c\u4e1a\uff0823:26\u63d0\u4ea4\uff09\uff0c\u4f46\u6700\u540e\u8868\u793a\u201c\u4eca\u5929\u6ca1\u65f6\u95f4\uff0c\u660e\u5929\u518d\u770b\u201d\uff0c**\u65f6\u95f4\u5f39\u6027\u5b58\u7591**\u3002\n- **\u7ecf\u6d4e\u8d44\u6e90**\uff1a\u4e3b\u52a8\u5bf9\u6bd4\u9ad8\u9636\u73ed\uff087380\u5143\uff09\u4e0e\u7cbe\u82f1\u73ed\uff083980\u5143\uff09\u4ef7\u683c\u53ca\u798f\u5229\uff0c**\u5bf9\u4ef7\u683c\u654f\u611f**\uff0c\u5177\u5907\u521d\u6b65\u652f\u4ed8\u610f\u613f\u4f46\u9700\u9ad8\u4ef7\u503c\u611f\u77e5\u9a71\u52a8\u3002\n- **\u8ba4\u77e5/\u6280\u80fd\u8d44\u6e90**\uff1a\u4e09\u6b21\u4f5c\u4e1a\u5747\u901a\u8fc7\uff0c\u83b7\u201c\u58f0\u97f3\u6709\u4eb2\u548c\u529b\u201d\u3001\u201c\u6709\u6f5c\u529b\u201d\u7b49\u6b63\u9762\u53cd\u9988\uff0c\u5177\u5907\u57fa\u7840\u5b66\u4e60\u80fd\u529b\u4e0e\u58f0\u97f3\u6761\u4ef6\u3002\n- **\u8d44\u6e90\u8bc4\u4f30**\uff1a**\u4e2d\u7b49**\u3002\u5177\u5907\u57fa\u672c\u5b66\u4e60\u80fd\u529b\u4e0e\u652f\u4ed8\u95e8\u69db\u610f\u613f\uff0c\u4f46\u65f6\u95f4\u6295\u5165\u7684\u6301\u7eed\u6027\u4e0e\u7ecf\u6d4e\u8d44\u6e90\u7684\u5145\u88d5\u5ea6\u672a\u7ecf\u9a8c\u8bc1\u3002\n\n### \u5fc3\u7406\u5f39\u6027\n- **\u6297\u538b\u4e0e\u575a\u6301**\uff1a\u80fd\u6309\u622a\u6b62\u65e5\u671f\u5b8c\u6210\u591a\u9879\u8003\u6838\u4f5c\u4e1a\uff0c\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u4efb\u52a1\u6267\u884c\u529b\u3002\n- **\u632b\u6298\u53cd\u5e94**\uff1a\u5bf9\u9500\u552e\u91cd\u590d\u6027\u8bdd\u672f\uff08\u201cAI\uff1f\u201d\uff09\u8868\u73b0\u51fa\u4e0d\u8010\u70e6\u4e0e\u8d28\u7591\uff0c**\u5bf9\u8fc7\u5ea6\u8425\u9500\u654f\u611f**\u3002\n- **\u4f9d\u8d56\u6027**\uff1a\u4e3b\u52a8\u63d0\u95ee\u201c\u8d44\u6e90\u662f\u8981\u9760\u81ea\u5df1\u62a2\u5355\u5417\uff1f\u201d\uff0c\u8868\u73b0\u51fa\u5bf9\u5e73\u53f0\u8d44\u6e90\u652f\u6301\u7684\u671f\u5f85\u4e0e\u4f9d\u8d56\u3002\n- **\u5f39\u6027\u8bc4\u4f30**\uff1a**\u4e2d\u4f4e**\u3002\u5177\u5907\u57fa\u7840\u914d\u5408\u5ea6\uff0c\u4f46**\u5bf9\u9500\u552e\u6d41\u7a0b\u7684\u673a\u68b0\u611f\u5bb9\u5fcd\u5ea6\u4f4e**\uff0c\u6613\u4ea7\u751f\u4fe1\u4efb\u6ce2\u52a8\uff0c\u5728\u4fe1\u606f\u8f70\u70b8\u4e0b\uff08\u201c\u53d1\u7684\u6d88\u606f\u592a\u591a\u4e86\u201d\uff09\u4f1a\u4e3b\u52a8\u8bbe\u7f6e\u8fb9\u754c\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n- **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u672a\u53d1\u751f\u652f\u4ed8\u884c\u4e3a\uff0c\u5904\u4e8e\u8be2\u4ef7\u4e0e\u6743\u76ca\u786e\u8ba4\u9636\u6bb5\u3002\n- **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u65e0\u76f8\u5173\u4fe1\u606f\u3002\u7528\u6237\u8868\u73b0\u72ec\u7acb\uff0c\u4f46\u65e0\u6cd5\u6392\u9664\u5bb6\u5ead\u56e0\u7d20\u3002\n- **\u6b65\u9aa41\uff1a\u52a8\u673a\u7eaf\u5ea6**\uff1a\u53d8\u73b0\u9a71\u52a8\u660e\u786e\uff0c\u5b66\u4e60\u5185\u9a71\u529b\u5f31 \u2192 **\u503e\u5411C\u7c7b\uff08\u6295\u673a\u8005\uff09\u6216D\u7c7b\uff08\u4f4e\u52a8\u673a\u8005\uff09**\u3002\n- **\u6b65\u9aa42\uff1a\u8d44\u6e90\u5e95\u5ea7**\uff1a\u65f6\u95f4\u5b58\u7591\u3001\u4ef7\u683c\u654f\u611f \u2192 **\u8d44\u6e90\u5339\u914d\u5ea6\u4e2d\u7b49\uff0c\u4f46\u5b58\u5728\u98ce\u9669\u70b9**\u3002\n- **\u6b65\u9aa43\uff1a\u5fc3\u7406\u5f39\u6027**\uff1a\u914d\u5408\u4f46\u6613\u751f\u7591\uff0c\u6297\u8425\u9500\u75b2\u52b3\u80fd\u529b\u5f31 \u2192 **\u5f39\u6027\u4e0d\u8db3\uff0c\u6613\u5f15\u53d1\u4fe1\u4efb\u5371\u673a**\u3002\n- **\u5224\u5b9a\u7ed3\u679c**\uff1a**C2\u578b\uff08\u4ef7\u683c\u654f\u611f\u578b\u6295\u673a\u8005\uff09**\u3002\u6838\u5fc3\u7279\u5f81\uff1a\u5f3a\u53d8\u73b0\u671f\u5f85\u3001\u5f3a\u4ef7\u683c\u4e0e\u6743\u76ca\u6bd4\u8f83\u5fc3\u7406\u3001\u914d\u5408\u5ea6\u8868\u9762\u826f\u597d\u4f46\u5185\u5728\u4fe1\u4efb\u8106\u5f31\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n- **\u5339\u914d\u539f\u578b**\uff1a**T7 \u7cbe\u6253\u7ec6\u7b97\u7684\u798f\u5229\u730e\u4eba**\u3002\n    - **\u7279\u5f81\u543b\u5408**\uff1a\u9ad8\u5ea6\u5173\u6ce8\u8bfe\u7a0b\u9644\u52a0\u798f\u5229\uff08\u7248\u6743\u4e66\u6570\u91cf\u3001\u8d60\u8bfe\uff09\u3001\u8fdb\u884c\u73ed\u578b\u4ef7\u683c\u5bf9\u6bd4\u3001\u5bf9\u9500\u552e\u8bdd\u672f\u7684\u201c\u4ef7\u503c\u5305\u88c5\u201d\u4fdd\u6301\u8b66\u60d5\u5e76\u76f4\u63a5\u8d28\u7591\u3002\n    - **\u504f\u79bb\u70b9**\uff1a\u76f8\u6bd4\u5178\u578bT7\uff0c\u7528\u6237\u5b8c\u6210\u4e86\u5168\u90e8\u4f53\u9a8c\u8425\u4f5c\u4e1a\uff0c\u663e\u793a\u51fa\u9ad8\u4e8e\u5e73\u5747\u7684\u521d\u59cb\u884c\u52a8\u529b\uff0c\u4f46\u6838\u5fc3\u884c\u4e3a\u903b\u8f91\u4e00\u81f4\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n- **\u603b\u4f53\u98ce\u9669**\uff1a**\u4e2d\u9ad8**\u3002\u7528\u6237\u51b3\u7b56\u7406\u6027\u4e14\u8b66\u60d5\uff0c\u82e5\u9884\u671f\uff08\u798f\u5229\u3001\u8d44\u6e90\u3001\u53d8\u73b0\u901f\u5ea6\uff09\u672a\u8fbe\uff0c\u6295\u8bc9\u98ce\u9669\u663e\u8457\u3002\n- **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u5bf9\u201c\u5feb\u901f\u53d8\u73b0\u201d\u6709\u671f\u5f85\uff0c\u82e5\u5b66\u4e60\u540e\u63a5\u5355\u4e0d\u987a\uff0c\u6781\u6613\u4e0d\u6ee1\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u4e2d\u98ce\u9669**\u3002\u8868\u73b0\u51fa\u4ef7\u683c\u654f\u611f\uff0c\u4f46\u672a\u63d0\u53ca\u7ecf\u6d4e\u56f0\u96be\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u4e2d\u98ce\u9669**\u3002\u81ea\u79f0\u53ef\u517c\u804c\uff0c\u4f46\u201c\u6ca1\u65f6\u95f4\u201d\u7684\u8868\u8ff0\u6697\u793a\u65f6\u95f4\u7d27\u5f20\u3002\n    4.  **\u5174\u8da3\u8f6c\u79fb**\uff1a**\u4f4e\u98ce\u9669**\u3002\u6682\u65e0\u4fe1\u53f7\u3002\n    5.  **\u9500\u552e\u8bef\u5bfc**\uff1a**\u9ad8\u98ce\u9669**\u3002**\u5df2\u5bf9\u9500\u552e\u6c9f\u901a\u7684\u201cAI\u611f\u201d\u4ea7\u751f\u8d28\u7591**\uff0c\u82e5\u540e\u7eed\u53d1\u73b0\u798f\u5229\u627f\u8bfa\uff08\u59824\u672c\u7248\u6743\u4e66\uff09\u4e0e\u4e8b\u5b9e\u4e0d\u7b26\uff0c\u5c06\u6210\u4e3a\u6838\u5fc3\u6295\u8bc9\u70b9\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u672a\u77e5\u98ce\u9669**\u3002\u4fe1\u606f\u7f3a\u5931\u3002\n    7.  **\u670d\u52a1\u4f53\u9a8c**\uff1a**\u4e2d\u98ce\u9669**\u3002\u5bf9\u4fe1\u606f\u8fc7\u8f7d\u5df2\u611f\u538b\u529b\uff0c\u82e5\u6b63\u5f0f\u73ed\u670d\u52a1\u4e0d\u7cbe\u7ec6\uff0c\u6613\u5f15\u53d1\u4e0d\u6ee1\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n- **\u98ce\u9669\u70b9**\uff1a\n    - **\u8fc7\u5ea6\u627f\u8bfa**\uff1a\u9500\u552e\u627f\u8bfa\u201c\u7533\u8bf74\u672c\u7248\u6743\u4e66\u201d\uff0c\u9700\u786e\u4fdd\u540e\u7eed\u5151\u73b0\uff0c\u5426\u5219\u6d89\u865a\u5047\u5ba3\u4f20\u3002\n    - **\u5236\u9020\u7a00\u7f3a\u4e0e\u7d27\u8feb**\uff1a\u9891\u7e41\u4f7f\u7528\u201c\u622a\u6b62\u65f6\u95f4\u201d\u3001\u201c\u6700\u540e\u673a\u4f1a\u201d\u3001\u201c\u540d\u989d\u6709\u9650\u201d\u7b49\u8bdd\u672f\uff0c\u7b26\u5408\u884c\u4e1a\u60ef\u4f8b\u4f46\u9700\u6ce8\u610f\u5c3a\u5ea6\u3002\n    - **\u6536\u5165\u6697\u793a**\uff1a\u63d0\u53ca\u201c\u6708\u51653-4W\u201d\u3001\u201c\u6708\u5165\u4e94\u767e\u4e07\u201d\u7b49\u6848\u4f8b\uff0c\u5b58\u5728\u4e0d\u5f53\u6536\u5165\u5f15\u5bfc\u98ce\u9669\u3002\n- **\u5408\u89c4\u8bc4\u4f30**\uff1a\u6d41\u7a0b\u65e0\u91cd\u5927\u8fdd\u89c4\uff0c\u4f46**\u5728\u798f\u5229\u627f\u8bfa\u7684\u660e\u786e\u6027\u4e0e\u4e00\u81f4\u6027\u4e0a\u5b58\u5728\u9690\u60a3**\uff0c\u6613\u5f15\u53d1\u540e\u7eed\u7ea0\u7eb7\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n- **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**\uff1a**\u504f\u5dee**\u3002\u7528\u6237\u4ef7\u683c\u654f\u611f\u4e14\u671f\u5f85\u5feb\u901f\u53d8\u73b0\uff0c\u4e0e\u9700\u8981\u957f\u671f\u6295\u5165\u3001\u7ed3\u679c\u4e0d\u786e\u5b9a\u7684\u6709\u58f0\u6f14\u64ad\u57f9\u8bad\u5b58\u5728\u6839\u672c\u77db\u76fe\u3002\u7cbe\u82f1\u73ed\uff08\u8f7b\u91cf\u3001\u4f4e\u4ef7\uff09\u6bd4\u9ad8\u9636\u73ed\uff08\u91cd\u6295\u5165\uff09\u66f4\u5339\u914d\u5176\u98ce\u9669\u504f\u597d\uff0c\u4f46\u5747\u9700\u7ba1\u7406\u5176\u53d8\u73b0\u9884\u671f\u3002\n- **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**\u7b7e\u7ea6\u524d\u4e66\u9762\u786e\u8ba4\u6743\u76ca\u7ec6\u5219**\n- **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9884\u671f\u7ba1\u7406\uff08\u9996\u8981\uff09**\uff1a\u73ed\u4e3b\u4efb\u9996\u5468\u5fc5\u987b\u8fdb\u884c\u201c\u9884\u671f\u6821\u6b63\u201d\u8c08\u8bdd\uff0c\u7528\u6570\u636e\u5ba2\u89c2\u8bf4\u660e\u517c\u804c\u6709\u58f0\u4e66\u4e3b\u64ad\u7684\u6536\u5165\u5468\u671f\u3001\u6210\u529f\u7387\u4e0e\u6240\u9700\u65f6\u95f4\u6295\u5165\uff0c**\u964d\u4f4e\u5176\u201c\u5feb\u901f\u53d8\u73b0\u201d\u5e7b\u60f3**\u3002\n    2.  **\u6743\u76ca\u4e66\u9762\u5316**\uff1a\u5c06\u9500\u552e\u627f\u8bfa\u7684\u201c4\u672c\u7248\u6743\u4e66\u201d\u53ca\u5404\u9879\u798f\u5229\uff0c\u4ee5\u5b98\u65b9\u4e66\u9762\u5f62\u5f0f\uff08\u5982\u6743\u76ca\u786e\u8ba4\u4e66\uff09\u660e\u786e\u5217\u51fa\uff0c\u907f\u514d\u540e\u7eed\u7ea0\u7eb7\u3002\n    3.  **\u5efa\u7acb\u4fe1\u4efb**\uff1a\u6c9f\u901a\u65f6\u907f\u514d\u6a21\u677f\u5316\u56de\u590d\uff0c\u9488\u5bf9\u5176\u4f5c\u4e1a\u8868\u73b0\u7ed9\u4e88\u5177\u4f53\u3001\u771f\u8bda\u7684\u53cd\u9988\uff0c\u4fee\u590d\u5176\u56e0\u201cAI\u611f\u201d\u8d28\u7591\u53d7\u635f\u7684\u4fe1\u4efb\u3002\n    4.  **\u98ce\u9669\u524d\u7f6e\u6c9f\u901a**\uff1a\u660e\u786e\u8be2\u95ee\u5176\u6bcf\u65e5/\u6bcf\u5468\u53ef\u4fdd\u969c\u7684\u5b66\u4e60\u65f6\u95f4\uff0c\u5e76\u8bf4\u660e\u65f6\u95f4\u6295\u5165\u4e0e\u5b66\u4e60\u6548\u679c\u7684\u5173\u7cfb\u3002\n    5.  **\u5173\u6ce8\u65e9\u671f\u53cd\u9988**\uff1a\u5f00\u8bfe\u540e\u7d27\u5bc6\u8ddf\u8e2a\u5176\u9996\u6b21\u8bd5\u97f3\u6216\u5b9e\u6218\u4efb\u52a1\u53cd\u9988\uff0c\u82e5\u9047\u632b\u6298\u53ca\u65f6\u758f\u5bfc\uff0c\u9632\u6b62\u65e9\u671f\u5931\u671b\u6027\u9000\u8d39\u3002\n\n{\"core_type\": \"T7 \u7cbe\u6253\u7ec6\u7b97\u7684\u798f\u5229\u730e\u4eba\", \"risk_level\": \"\u4e2d\u9ad8\", \"refund_risk\": \"\u4e2d\u9ad8\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u7b7e\u7ea6\u524d\u4e66\u9762\u786e\u8ba4\u6743\u76ca\u7ec6\u5219\"}";
