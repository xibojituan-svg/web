    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4ee5\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\u7684\u8eab\u4efd\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677168454\uff08\u6635\u79f0\uff1a\u83e0\u83dc\u9762\uff09\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677168454 / \u6635\u79f0\uff1a\u83e0\u83dc\u9762 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e - \u5609\u97f31(\u5b59\u91ce) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u4ef7\u683c\uff1a3980\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u5b58\u5728\u501f\u8d37\u9690\u60a3\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u660e\u786e\u63d0\u53ca\u5de5\u4f5c\u6027\u8d28\u6216\u65f6\u95f4\u5b89\u6392\uff0c\u4ec5\u8868\u793a\u201c\u4e2d\u5e74\u201d\uff0c\u65f6\u95f4\u81ea\u7531\u5ea6\u672a\u77e5\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u5bf9\u8bdd\u56f4\u7ed5\u5b66\u4e60\u3001\u89c4\u5212\u3001\u53d8\u73b0\u5c55\u5f00\uff0c\u4f46\u7f3a\u4e4f\u8d44\u91d1\u3001\u65f6\u95f4\u3001\u5bb6\u5ead\u7b49\u5173\u952e\u80cc\u666f\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **[\u2b06\u9ad8]**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u6210\u957f\u800c\u6765\uff0c\u5173\u6ce8\u6280\u80fd\u6253\u78e8\u4e0e\u957f\u8fdc\u53d1\u5c55\uff0c\u800c\u975e\u77ed\u671f\u66b4\u5bcc\u3002\u5177\u5907\u81ea\u6211\u5b9e\u73b0\u9a71\u52a8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u94b1\u4e0d\u94b1\u7684\uff0c\u5e76\u4e0d\u662f\u6700\u91cd\u8981\u7684\uff0c\u7ecf\u9a8c\u4e0e\u6210\u957f\u624d\u662f\u3002\u201d\n  > \u201c\u6c89\u4e0b\u8eab\u5b50\uff0c\u597d\u597d\u6253\u78e8\u662f\u5f53\u52a1\u4e4b\u6025\u3002\u201d\n  > \u201c\u4ece1\u5f00\u59cb\u5427\uff0c\u4ece\u753b\u672c\u5f00\u59cb\uff0c\u719f\u6089\u5168\u6d41\u7a0b\uff0c\u6bd4\u8f83\u59a5\u5e16\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **[\u27a1\u4e2d]**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u5df2\u652f\u4ed83980\u5143\u8bfe\u7a0b\u8d39\u7528\uff0c\u672a\u8868\u73b0\u51fa\u7ecf\u6d4e\u538b\u529b\uff0c\u4f46\u672a\u900f\u9732\u66f4\u591a\u8d22\u52a1\u7ec6\u8282\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u542c\u76f4\u64ad\uff0c\u4f46\u81ea\u79f0\u201c\u5e74\u7eaa\u6709\u4e9b\u5927\u4e86\uff0c\u63a5\u53d7\u53ef\u80fd\u6709\u4e9b\u6162\u201d\uff0c\u6697\u793a\u5b66\u4e60\u7cbe\u529b\u53ef\u80fd\u6709\u9650\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **[\u2b06\u9ad8]**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9762\u5bf9\u56f0\u96be\uff08\u591a\u89d2\u8272\u53e3\u97f3\u8f6c\u53d8\u5403\u529b\uff09\u80fd\u5ba2\u89c2\u9648\u8ff0\uff0c\u5e76\u81ea\u6211\u6fc0\u52b1\uff0c\u65e0\u9700\u5916\u90e8\u5b89\u629a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u591a\u89d2\u8272\u53e3\u97f3\u8f6c\u53d8\u8fd8\u662f\u6709\u4e9b\u5403\u529b\u7684\u3002\u201d (\u5ba2\u89c2\u9648\u8ff0\u56f0\u96be)\n  > \u201c\u793e\u4f1a\u8650\u6211\u4e07\u5343\u904d\uff0c\u6211\u5bf9\u793e\u4f1a\u59cb\u5982\u4e00\u3002\u201d (\u4f53\u73b0\u97e7\u6027)\n  > \u201c\u672c\u4eba\u4e0d\u559c\u6b22\u8d70\u8001\u8def\uff0c\u6700\u7231\u53e6\u8f9f\u8e4a\u5f84[\u62f3\u5934]\u3002\u201d (\u4f53\u73b0\u81ea\u4e3b\u6027\u4e0e\u6311\u6218\u7cbe\u795e)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u4e2d\u5e74\u5371\u673a\u4e0b\u7684\u4ef7\u503c\u7126\u8651\u4e0e\u5bf9\u201c\u88ab\u65f6\u4ee3\u629b\u4e0b\u201d\u7684\u6050\u60e7\u3002\u4ed6\u6e34\u671b\u901a\u8fc7\u5b66\u4e60\u65b0\u6280\u80fd\uff08\u6709\u58f0\u6f14\u64ad\uff09\u5b9e\u73b0\u804c\u4e1a\u8f6c\u578b\uff08\u517c\u804c\u8f6c\u4e13\u804c\uff09\uff0c\u5728\u201c\u5c81\u6708\u4e0d\u9976\u4eba\u201d\u7684\u538b\u529b\u4e0b\uff0c\u5bfb\u6c42\u4e00\u6761\u80fd\u8bc1\u660e\u81ea\u8eab\u4ef7\u503c\u3001\u5b9e\u73b0\u4e2a\u4eba\u7406\u60f3\u7684\u65b0\u8def\u5f84\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u6df1\u5ea6\u8ba4\u540c\u4e0e\u201c\u540c\u9053\u4e2d\u4eba\u201d\u7684\u5c0a\u91cd\u611f**\u3002\u4ed6\u9700\u8981\u88ab\u8ba4\u53ef\u4e3a\u201c\u6709\u6f5c\u529b\u3001\u6709\u60f3\u6cd5\u3001\u80fd\u6210\u4e8b\u201d\u7684\u540c\u884c\u8005\uff0c\u800c\u975e\u4e00\u4e2a\u9700\u8981\u88ab\u54c4\u7740\u7684\u5b66\u751f\u3002\u63d0\u4f9b\u6e05\u6670\u7684\u6280\u672f\u6210\u957f\u8def\u5f84\u548c\u201c\u5e76\u80a9\u4f5c\u6218\u201d\u7684\u4f19\u4f34\u611f\u81f3\u5173\u91cd\u8981\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u9ad8\u52a8\u673a\u3001\u4e2d\u7b49\u8d44\u6e90\u3001\u9ad8\u5f39\u6027) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u7b49\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u8868\u73b0\u72ec\u7acb\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u82e5\u8bfe\u7a0b\u8282\u594f\u8fc7\u5feb\u3001\u4f5c\u4e1a\u96be\u5ea6\u9661\u589e\uff0c\u8d85\u51fa\u5176\u201c\u6162\u529f\u51fa\u7ec6\u6d3b\u201d\u7684\u9884\u671f\uff0c\u53ef\u80fd\u5bfc\u81f4\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u4ea7\u751f\u7684\u81ea\u8d23\u4e0e\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u5ba2\u89c2\u770b\u5f85\u56f0\u96be\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u95ee\u9898\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u660e\u786e\u8868\u793a\u201c\u94b1\u4e0d\u94b1\u7684\uff0c\u5e76\u4e0d\u662f\u6700\u91cd\u8981\u7684\u201d\uff0c\u5bf9\u77ed\u671f\u53d8\u73b0\u671f\u5f85\u503c\u7ba1\u7406\u8f83\u597d\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-4\u5468\u540e**\u3002\u5f53\u57fa\u7840\u5b66\u4e60\u9636\u6bb5\u7ed3\u675f\uff0c\u8fdb\u5165\u5b9e\u6218\u6216\u9ad8\u96be\u5ea6\u6280\u5de7\u8bad\u7ec3\u65f6\uff0c\u82e5\u5176\u611f\u5230\u8fdb\u6b65\u7f13\u6162\u6216\u4e0e\u9884\u671f\u4e0d\u7b26\uff0c\u53ef\u80fd\u4ea7\u751f\u201c\u6295\u5165\u4ea7\u51fa\u6bd4\u5931\u8861\u201d\u7684\u6000\u7591\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u83e0\u83dc\u9762\u5927\u54e5\uff0c\u770b\u4e86\u4f60\u7684\u4ecb\u7ecd\u548c\u6c9f\u901a\uff0c\u611f\u89c9\u4f60\u662f\u4f4d\u6709\u60f3\u6cd5\u3001\u6709\u97e7\u52b2\u7684\u5b9e\u5e72\u6d3e\u3002\u54b1\u4eec\u8fd9\u4e2a\u73ed\u5c31\u9700\u8981\u4f60\u8fd9\u6837\u7a33\u624e\u7a33\u6253\u7684\u540c\u5b66\u3002\u63a5\u4e0b\u6765\u7684\u8bfe\u7a0b\uff0c\u54b1\u4eec\u4e0d\u8ffd\u6c42\u5feb\uff0c\u4f46\u6c42\u6bcf\u4e00\u6b65\u90fd\u8d70\u5f97\u624e\u5b9e\u3002\u6709\u4efb\u4f55\u6280\u672f\u4e0a\u7684\u2018\u786c\u9aa8\u5934\u2019\uff0c\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u5543\u4e0b\u6765\u3002\u4f60\u7684\u76ee\u6807\u662f\u4e13\u804c\uff0c\u6211\u7684\u4efb\u52a1\u5c31\u662f\u5e2e\u4f60\u628a\u8fd9\u6761\u8def\u94fa\u5b9e\u4e86\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u3002\u5339\u914d\u5176\u201c\u4ece0\u5f00\u59cb\uff0c\u719f\u6089\u5168\u6d41\u7a0b\u201d\u548c\u201c\u6253\u78e8\u58f0\u7ebf\u201d\u7684\u8bc9\u6c42\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T2\u8001\u9ec4\u725b\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010**\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743(B\u6a21\u5757)**\u3011\u548c\u3010**\u9ad8\u96be\u5ea6\u5b9e\u64cd\u4efb\u52a1\u5305**\u3011\u3002\u4ed6\u9700\u8981\u4e25\u82db\u7684\u70b9\u8bc4\u548c\u6df1\u5ea6\u7684\u6280\u672f\u539f\u7406\u89e3\u7b54\u6765\u83b7\u5f97\u6210\u957f\u611f\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u5b9d\u5988/\u4e0a\u73ed\u65cf\u8f7b\u677e\u6708\u5165\u8fc7\u4e07\u201d\u7b49\u4f4e\u7aef\u8bdd\u672f\u523a\u6fc0\u4ed6\uff1b\u4e0d\u8981\u8fc7\u5ea6\u60c5\u611f\u5b89\u629a\uff08C\u6a21\u5757\u8f7b\u91cf\u5373\u53ef\uff09\uff0c\u8fd9\u4f1a\u8ba9\u4ed6\u89c9\u5f97\u4e0d\u88ab\u4e25\u8083\u5bf9\u5f85\uff1b\u4e0d\u8981\u5e72\u6d89\u4ed6\u7684\u5b66\u4e60\u8282\u594f\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5f53\u5176\u6280\u80fd\u6709\u660e\u663e\u7a81\u7834\u3001\u63a5\u5230\u7b2c\u4e00\u5355\u6216\u6709\u660e\u786e\u8fdb\u9636\u610f\u613f\u65f6\uff0c\u53ef\u63a8\u8350\u9ad8\u9636\u8bbe\u5907\u3001\u79c1\u6559\u8bfe\u6216\u6df1\u5ea6\u540e\u671f\u8bfe\u7a0b\u3002\u4ed6\u662f\u786c\u4ef6\u548c\u6df1\u5ea6\u8bfe\u7a0b\u7684\u6838\u5fc3\u4e70\u5355\u76d8\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u94b1\u4e0d\u94b1\u7684\uff0c\u5e76\u4e0d\u662f\u6700\u91cd\u8981\u7684\uff0c\u7ecf\u9a8c\u4e0e\u6210\u957f\u624d\u662f\u3002**\u201d (\u52a8\u673a\u7eaf\u5ea6\u9ad8\u7684\u6838\u5fc3\u8bc1\u660e)\n2. > \u201c**\u672c\u4eba\u4e0d\u559c\u6b22\u8d70\u8001\u8def\uff0c\u6700\u7231\u53e6\u8f9f\u8e4a\u5f84[\u62f3\u5934]\u3002**\u201d (\u9ad8\u5fc3\u7406\u5f39\u6027\u4e0e\u81ea\u4e3b\u6027\u7684\u4f53\u73b0)\n3. > \u201c**\u5c31\u662f\u4e0d\u77e5\u80fd\u4e0d\u80fd\u63a5\u5230\uff0c\u63a5\u5230\u4e86\u80fd\u4e0d\u80fd\u505a\u5f97\u8ba9\u7532\u65b9\u6ee1\u610f\uff0c\u633a\u60f6\u6050\u7684\u3002**\u201d (\u4f53\u73b0\u52a1\u5b9e\u6001\u5ea6\u548c\u5bf9\u4e13\u4e1a\u6027\u7684\u656c\u754f\uff0c\u975e\u76f2\u76ee\u81ea\u4fe1)\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u81ea\u6211\u5b9e\u73b0\u4e0e\u4ef7\u503c\u91cd\u5851\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6e05\u6670\u3001\u6709\u6311\u6218\u6027\u7684\u6280\u672f\u6210\u957f\u8def\u5f84\uff0c\u7ed9\u4e88\u4e13\u4e1a\u5c42\u9762\u7684\u6df1\u5ea6\u8ba4\u540c\u548c\u5c0a\u91cd\uff0c\u907f\u514d\u8fc7\u5ea6\u60c5\u611f\u5316\u670d\u52a1\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\"}\n```";
