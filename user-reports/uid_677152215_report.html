        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u6d45\u96ea\u6696\u9633 (UID: 677152215) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u4e00\u9897\u7cd6\u4e00\u7c92\u8a004 (\u82cf\u5efa\u73b2) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u77ed\u89c6\u9891\u5b9e\u6218\u8425 (\u4ef7\u683c\uff1a3980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u7528\u5361/\u82b1\u5457\u5206\u671f** (\u7528\u6237\u4e3b\u52a8\u8be2\u95ee\u5206\u671f\u4ed8\u6b3e) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u7f3a\u5931** (\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5de5\u4f5c/\u751f\u6d3b\u4f5c\u606f) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** (\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** (\u4ec5\u6709\u4e00\u6b21\u7b80\u77ed\u4e92\u52a8\uff0c\u7528\u6237\u53d1\u8a00\u6781\u5c11\uff0c\u591a\u4e3a\u9500\u552e\u5355\u5411\u8f93\u51fa) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u5bf9AI\u5de5\u5177\u8868\u73b0\u51fa\u5174\u8da3\u548c\u8ba4\u53ef\uff08\u201c\u8d85\u51fa\u9884\u671f\u4e86\u201d\uff09\uff0c\u4f46\u9762\u5bf9\u9500\u552e\u591a\u6b21\u7684\u53d8\u73b0\u627f\u8bfa\u548c\u50ac\u4fc3\uff0c\u59cb\u7ec8\u672a\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u641e\u94b1\u6b32\u671b\uff0c\u4ec5\u4ee5\u201c\u5728\u770b\u770b\u201d\u3001\u201c\u76ee\u524d\u8fd8\u4e0d\u786e\u5b9a\u201d\u56de\u5e94\u3002\u5176\u52a8\u673a\u4ecb\u4e8e\u5174\u8da3\u63a2\u7d22\u4e0e\u53d8\u73b0\u671f\u671b\u4e4b\u95f4\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u76ee\u524d\u8fd8\u4e0d\u786e\u5b9a\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u7528\u6237\u4e3b\u52a8\u8be2\u95ee\u201c\u53ef\u4ee5\u5206\u671f\u4ed8\u6b3e\u5417\u201d\uff0c\u5e76\u6700\u7ec8\u4f7f\u7528\u82b1\u5457/\u4fe1\u7528\u5361\u652f\u4ed8\uff0c\u8868\u660e\u5176**\u652f\u4ed8\u80fd\u529b\u7d27\u5f20\uff0c\u5b58\u5728\u501f\u8d37\u6d88\u8d39\u884c\u4e3a**\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u7528\u6237\u53ef\u652f\u914d\u7684\u5b66\u4e60\u65f6\u95f4\u4e0e\u7cbe\u529b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5bb6\u5ead\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a**\u3002\u7528\u6237\u80fd\u5b8c\u6210\u4f5c\u4e1a\u5e76\u83b7\u5f97\u201c\u8d85\u51fa\u9884\u671f\u201d\u7684\u79ef\u6781\u53cd\u9988\uff0c\u5b66\u4e60\u8fc7\u7a0b\u672a\u89c1\u660e\u663e\u8d1f\u9762\u60c5\u7eea\u3002\u4f46\u56e0\u5176\u4e92\u52a8\u6781\u5c11\uff0c\u65e0\u6cd5\u5224\u65ad\u5176\u5728\u9047\u5230\u771f\u5b9e\u56f0\u96be\u65f6\u7684\u5177\u4f53\u53cd\u5e94\uff0c\u6682\u5b9a\u4e3a\u4e2d\u7b49\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8d85\u51fa\u9884\u671f\u4e86\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u672a\u6765\u7684\u4e0d\u786e\u5b9a\u6027\u548c\u7ecf\u6d4e\u5b89\u5168\u611f\u7f3a\u5931\u7684\u7126\u8651**\u3002\u7528\u6237\u613f\u610f\u5c1d\u8bd5\u65b0\u6280\u80fd\uff08AI\u77ed\u89c6\u9891\uff09\uff0c\u4f46\u884c\u52a8\u8c28\u614e\uff08\u201c\u5728\u770b\u770b\u201d\uff09\uff0c\u4e14\u9700\u8981\u5206\u671f\u4ed8\u6b3e\uff0c\u8868\u660e\u5176\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u4e00\u9879\u65b0\u6280\u80fd\u6765\u589e\u52a0\u6536\u5165\u3001\u62b5\u5fa1\u98ce\u9669\uff0c\u6838\u5fc3\u9a71\u52a8\u529b\u662f**\u5bf9\u7ecf\u6d4e\u72b6\u51b5\u6539\u5584\u7684\u6e34\u671b\u548c\u5bf9\u672a\u6765\u804c\u4e1a/\u6536\u5165\u5b89\u5168\u7684\u62c5\u5fe7**\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u7684\u8def\u5f84\u548c\u4f4e\u98ce\u9669\u7684\u627f\u8bfa**\u3002\u4ed6\u9700\u8981\u88ab\u660e\u786e\u544a\u77e5\u201c\u5b66\u4e86\u5c31\u80fd\u8d5a\u94b1\u201d\u7684\u6e05\u6670\u3001\u4f4e\u95e8\u69db\u7684\u53d8\u73b0\u8def\u5f84\uff0c\u4ee5\u53ca\u201c\u4e0d\u6ee1\u610f\u652f\u6301\u9000\u8d39\u201d\u7684\u5b89\u5168\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2 \u7c7b** (\u52a8\u673a\u4e2d\u7b49\u4f46\u8d44\u6e90\u5e95\u5ea7\u5b58\u5728\u501f\u8d37\u98ce\u9669) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u578b** (\u6838\u5fc3\u8bc9\u6c42\u662f\u53d8\u73b0\uff0c\u4f46\u884c\u52a8\u4e0a\u56e0\u8d44\u91d1\u538b\u529b\u800c\u72b9\u8c6b\uff0c\u9700\u8981\u660e\u786e\u7684\u3001\u4f4e\u98ce\u9669\u7684\u53d8\u73b0\u627f\u8bfa) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 **\u5b89\u5168\u672a\u89e6\u53d1** (\u867d\u4f7f\u7528\u5206\u671f\uff0c\u4f46\u672a\u53d1\u73b0\u201c\u6551\u547d\u94b1\u201d\u3001\u201c\u5bb6\u4eba\u6781\u7aef\u53cd\u5bf9\u201d\u7b49D\u7c7b\u7ea2\u7ebf)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a/\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u56e0\u4fe1\u606f\u7f3a\u5931\uff0c\u65e0\u6cd5\u6392\u9664\u5176\u4f7f\u7528\u5bb6\u5ead\u5171\u540c\u8d44\u91d1\u6216\u9690\u7792\u5bb6\u4eba\u62a5\u540d\u7684\u53ef\u80fd\u3002\u4e00\u65e6\u5bb6\u5ead\u7ecf\u6d4e\u538b\u529b\u663e\u73b0\u6216\u5bb6\u4eba\u53cd\u5bf9\uff0c\u6781\u6613\u5f15\u53d1\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u4fe1\u606f\u7f3a\u5931\u3002\u82e5\u5176\u771f\u5b9e\u53ef\u7528\u65f6\u95f4\u4e0e\u8bfe\u7a0b\u8282\u594f\u51b2\u7a81\uff08\u5982\u591c\u73ed\u3001\u5e26\u5a03\uff09\uff0c\u65e0\u6cd5\u8ddf\u4e0a\u5b66\u4e60\uff0c\u4f1a\u4ea7\u751f\u201c\u94b1\u767d\u82b1\u4e86\u201d\u7684\u632b\u8d25\u611f\u800c\u9000\u8d39\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u76ee\u524d\u672a\u8868\u73b0\u51fa\u60c5\u7eea\u5316\u7279\u5f81\uff0c\u4f46\u82e5\u5b66\u4e60\u521d\u671f\u9047\u5230\u6280\u672f\u96be\u9898\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u3001\u63d0\u793a\u8bcd\u65e0\u6548\uff09\u4e14\u5f97\u4e0d\u5230\u53ca\u65f6\u89e3\u51b3\uff0c\u53ef\u80fd\u56e0\u632b\u8d25\u800c\u653e\u5f03\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u6781\u9ad8** | **\u8fd9\u662f\u6700\u5927\u98ce\u9669\u70b9**\u3002T4\u7528\u6237\u5bf9\u201c\u7b2c\u4e8c\u5468\u63a5\u5355\u201d\u3001\u201c80-150\u5143/\u5206\u949f\u201d\u7b49\u627f\u8bfa\u9ad8\u5ea6\u654f\u611f\u3002\u4e00\u65e6\u5f00\u8bfe\u540e\u53d1\u73b0\u63a5\u5355\u95e8\u69db\u9ad8\u3001\u6536\u76ca\u5468\u671f\u957f\u6216\u4e0e\u5ba3\u4f20\u4e0d\u7b26\uff0c\u4f1a\u7acb\u523b\u4ea7\u751f\u88ab\u6b3a\u9a97\u611f\uff0c\u8981\u6c42\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c\u4e8c\u5468\u81f3\u7b2c\u4e00\u4e2a\u6708\uff08\u201c\u6b7b\u4ea1\u8c37\u201d\u9636\u6bb5\uff09**\u3002\u5f53\u627f\u8bfa\u7684\u201c\u63a5\u5355\u6743\u9650\u201d\u5f00\u653e\u540e\uff0c\u82e5\u7528\u6237\u53d1\u73b0\u65e0\u6cd5\u5b9e\u9645\u63a5\u5230\u5355\u6216\u6536\u76ca\u8fdc\u4f4e\u4e8e\u9884\u671f\uff0c\u5c06\u96c6\u4e2d\u7206\u53d1\u6295\u8bc9\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6696\u9633\u4f60\u597d\uff0c\u606d\u559c\u52a0\u5165\uff01\u6211\u77e5\u9053\u54b1\u4eec\u62a5\u8bfe\u90fd\u662f\u4e3a\u4e86\u80fd\u5b9e\u5b9e\u5728\u5728\u589e\u52a0\u4e00\u4efd\u6536\u5165\uff0c\u8ba9\u751f\u6d3b\u591a\u4e00\u4efd\u4fdd\u969c\u3002\u4f60\u653e\u5fc3\uff0c\u4ece\u7b2c\u4e8c\u5468\u5f00\u59cb\uff0c\u6211\u5c31\u4f1a\u5e26\u4f60\u4e00\u6b65\u6b65\u63a5\u89e6\u771f\u5b9e\u7684\u5546\u5355\u8d44\u6e90\u3002\u54b1\u4eec\u4e0d\u753b\u5927\u997c\uff0c\u5c31\u4ece\u4f60\u80fd\u4e0a\u624b\u7684\u5c0f\u5355\u5b50\u5f00\u59cb\uff0c\u5148\u8d5a\u5230\u7b2c\u4e00\u7b14\uff0c\u5efa\u7acb\u4fe1\u5fc3\u3002\u8fc7\u7a0b\u4e2d\u6709\u4efb\u4f55\u5361\u70b9\uff0c\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u89e3\u51b3\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5feb\u901f\u63a5\u5355\u7ebf**\u3011\u3002\u6838\u5fc3\u662f\u5151\u73b0\u201c\u8fb9\u5b66\u8fb9\u8d5a\u201d\u7684\u627f\u8bfa\uff0c\u4f18\u5148\u63d0\u4f9b\u6700\u7b80\u5355\u3001\u6700\u660e\u786e\u7684\u5546\u5355\u6e20\u9053\u548c\u6a21\u677f\uff0c\u8ba9\u4ed6\u5c3d\u5feb\u770b\u5230\u201c\u56de\u8840\u201d\u7684\u53ef\u80fd\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\uff08\u8f7b\u91cf\uff09**\u3011\u3002\u56e0\u5176\u8d44\u91d1\u538b\u529b\u53ef\u80fd\u5e26\u6765\u7126\u8651\uff0c\u9700\u5728\u521d\u671f\u7ed9\u4e88\u66f4\u591a\u9f13\u52b1\u548c\u5b8c\u6210\u7b80\u5355\u4efb\u52a1\u7684\u6b63\u9762\u53cd\u9988\uff0c\u9632\u6b62\u56e0\u521d\u671f\u632b\u6298\u800c\u653e\u5f03\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u4ed6\u6301\u7eed\u753b\u5927\u997c**\uff1a\u907f\u514d\u53cd\u590d\u5f3a\u8c03\u201c\u6708\u5165\u8fc7\u4e07\u201d\u3001\u201c\u9ad8\u9636\u5546\u5355\u201d\uff0c\u800c\u5e94\u805a\u7126\u4e8e\u201c\u672c\u5468\u4f60\u80fd\u63a5\u5230\u4ec0\u4e48\u5355\u201d\u3001\u201c\u7b2c\u4e00\u6b65\u600e\u4e48\u505a\u201d\u3002\n    2. **\u7edd\u4e0d\u5728\u5176\u9047\u5230\u64cd\u4f5c\u56f0\u96be\u65f6\u53ea\u7ed9\u6559\u7a0b\u94fe\u63a5**\uff1a\u5fc5\u987b\u63d0\u4f9b\u624b\u628a\u624b\u76841v1\u6307\u5bfc\uff0c\u9632\u6b62\u5176\u56e0\u201c\u5b66\u4e0d\u4f1a\u201d\u800c\u5fc3\u6001\u5d29\u6e83\u3002\n    3. **\u4e25\u7981\u5347\u5355**\uff1a\u5728\u672c\u6b21\u8bfe\u7a0b\u672a\u4ea7\u751f\u7a33\u5b9a\u6b63\u53cd\u9988\uff08\u5982\u6210\u529f\u63a5\u5230\u5e76\u5b8c\u62103\u5355\u4ee5\u4e0a\uff09\u524d\uff0c**\u4e25\u7981**\u63a8\u8350\u4efb\u4f55\u9ad8\u9636\u8bfe\u7a0b\u6216\u9644\u52a0\u670d\u52a1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u95ee\u4e00\u4e0b\u53ef\u4ee5\u5206\u671f\u4ed8\u6b3e\u5417\u201d \n2. > \u201c3980\u201d\n3. > \u201c\u76ee\u524d\u8fd8\u4e0d\u786e\u5b9a\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4 \u641e\u94b1\u7ed3\u679c\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7ecf\u6d4e\u5b89\u5168\u4e0e\u4fdd\u969c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5728\u5f00\u8425\u7b2c\u4e8c\u5468\u52a1\u5fc5\u5151\u73b0\u4e00\u4e2a\u4f4e\u95e8\u69db\u7684\u771f\u5b9e\u63a5\u5355\u673a\u4f1a\uff0c\u5e76\u5168\u7a0b\u63d0\u4f9b\u50bb\u74dc\u5f0f\u966a\u8dd1\uff0c\u4e25\u9632\u6536\u76ca\u9884\u671f\u843d\u5dee\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u578b\", \"maslow_need\": \"\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf\"}\n```";
