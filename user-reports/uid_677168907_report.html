    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID: 677168907\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677168907 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u7c7d\u83f2(\u5b8b\u6653\u78ca)\u3001\u6854\u5b50JZT(\u7a0b\u5c55\u6b22) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u9ad8\u9636\u8bfe\u7a0b\uff08\u5df2\u652f\u4ed8\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1\uff08\u4e0a\u73ed\u65cf\uff0c\u4f46\u80fd\u5b8c\u6210\u65e9\u529f\u3001\u4f5c\u4e1a\u3001\u76f4\u64ad\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e2d\u7b49\u504f\u8584\uff08\u4e92\u52a8\u4ee5\u4efb\u52a1\u5e94\u7b54\u4e3a\u4e3b\uff0c\u7f3a\u4e4f\u6df1\u5ea6\u81ea\u6211\u66b4\u9732\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34\u578b**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u6211\u5148\u5b66\u4e60\u5427\uff0c\u6682\u65f6\u6ca1\u60f3\u597d\u201d\u8d5b\u9053\uff0c\u9500\u552e\u4e5f\u8bc4\u4ef7\u5176\u201c\u56e0\u4e3a\u559c\u6b22\u548c\u63d0\u5347\u81ea\u5df1\u6765\u5b66\u4e60\u201d\u3002\u4f46\u540c\u65f6\u4e5f\u5173\u6ce8\u201c\u753b\u672c \u5bf9\u8f68\u201d\u7b49\u517c\u804c\u5de5\u79cd\uff0c\u5bf9\u53d8\u73b0\u8def\u5f84\u6709\u8ba4\u77e5\u3002\u52a8\u673a\u4ecb\u4e8e\u5174\u8da3\u63a2\u7d22\u4e0e\u517c\u804c\u53d8\u73b0\u4e4b\u95f4\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u5148\u5b66\u4e60\u5427\uff0c\u6682\u65f6\u6ca1\u60f3\u597d\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u5df2\u652f\u4ed8\u9ad8\u9636\u8bfe\u7a0b\u8d39\u7528\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\u6216\u501f\u8d37\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u8d22\u52a1\u72b6\u51b5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u4e0a\u73ed\u65cf\uff0c\u4f46\u80fd\u6309\u65f6\u5b8c\u6210\u6240\u6709\u4f5c\u4e1a\u3001\u89c2\u770b\u76f4\u64ad\u3001\u53c2\u4e0e\u4e92\u52a8\uff0c\u8868\u73b0\u51fa\u826f\u597d\u7684\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u7528\u6237\u884c\u4e3a\u7a33\u5b9a\u3001\u79ef\u6781\uff0c\u4e3b\u52a8\u63d0\u95ee\uff08\u201c\u9ed1\u5ba2\u5a07\u59bb\u90a3\u4e2a\u8bd5\u97f3\u6ca1\u6709\u6587\u672c\u201d\uff09\uff0c\u63a5\u53d7\u5efa\u8bae\u540e\u80fd\u7acb\u5373\u5b9e\u8df5\u5e76\u53cd\u9988\u8fdb\u6b65\uff08\u201c\u542c\u4e86\u8001\u5e08\u8bb2\u7684\u611f\u60c5\u5938\u5f20\u4e00\u70b9\uff0c\u786e\u5b9e\u5f55\u7684\u6548\u679c\u66f4\u597d\u201d\uff09\u3002\u5168\u7a0b\u65e0\u8d1f\u9762\u60c5\u7eea\u8868\u8fbe\uff0c\u5c55\u73b0\u51fa\u72ec\u7acb\u3001\u52a1\u5b9e\u7684\u5b66\u4e60\u8005\u5fc3\u6001\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u542c\u4e86\u8001\u5e08\u8bb2\u7684\u611f\u60c5\u5938\u5f20\u4e00\u70b9\uff0c\u786e\u5b9e\u5f55\u7684\u6548\u679c\u66f4\u597d\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u5f52\u5c5e\u4e0e\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u8ba4\u53ef**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u6709\u58f0\u884c\u4e1a\u6709\u63a2\u7d22\u5174\u8da3\uff0c\u4f46\u8def\u5f84\u4e0d\u6e05\u6670\uff0c\u9700\u8981\u88ab\u5f15\u5bfc\u548c\u80af\u5b9a\uff0c\u4ee5\u5efa\u7acb\u5728\u8fd9\u4e2a\u65b0\u9886\u57df\u7684\u8eab\u4efd\u8ba4\u540c\u548c\u6280\u80fd\u81ea\u4fe1\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u7cbe\u51c6\u80af\u5b9a\u4e0e\u8def\u5f84\u89c4\u5212**\u3002\u9500\u552e\u5bf9\u5176\u201c\u5fa1\u59d0\u97f3\u201d\u7684\u7cbe\u51c6\u5206\u6790\u3001\u5bf9\u8fdb\u6b65\u7684\u53ca\u65f6\u8868\u626c\uff08\u201c\u4f60\u609f\u6027\u8d85\u9ad8\u7684\uff01\u201d\uff09\u4ee5\u53ca\u63d0\u4f9b\u201c\u7248\u6743\u4e66\u201d\u7b49\u8d44\u6e90\uff0c\u90fd\u7cbe\u51c6\u5730\u6ee1\u8db3\u4e86\u5176\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u548c\u5f52\u5c5e\u611f\u7684\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n**\u5224\u5b9a\u6811\u8def\u5f84\u63a8\u6f14**\uff1a\n1.  **\u524d\u7f6e\u9694\u7206\u7b5b**\uff1a\u52a8\u673a\u975e0\uff0c\u8d44\u6e90\u5e95\u5ea7\u975e\u8d1f\uff0c\u65e0\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\uff0c\u672a\u89e6\u53d1\u3002\n2.  **\u4ea4\u6613\u4fe1\u53f7\u786c\u62e6\u622a\u5c42**\uff1a\u65e0\u652f\u4ed8\u65b9\u5f0f\u4fe1\u606f\uff0c\u65e0\u6cd5\u5224\u65ad\uff0c\u8df3\u8fc7\u3002\n3.  **\u52a8\u673a\u7eaf\u5ea6\u22655\u5206\uff0c\u8fdb\u5165\u4e2d\u9ad8\u52a8\u673a\u7cbe\u5206\u901a\u9053**\u3002\n4.  **\u5fc3\u7406\u5f39\u6027\u9ad8(\u22657\u5206)\uff0c\u8fdb\u5165\u9ad8\u5f39\u6027\u901a\u9053**\u3002\n5.  \u7528\u6237\u65e0\u4e3b\u52a8\u7edf\u7b79\u884c\u4e3a\uff0c\u65e0\u6df1\u5ea6\u6280\u672f\u8ffd\u95ee\uff0c\u65e0\u9ad8\u9891\u975e\u5b66\u4e60\u793e\u4ea4\u3002\n6.  **\u547d\u4e2d\u9ed8\u8ba4\u5f52\u7c7b**\uff1a\u2192 **T2 \u4f4e\u8c03\u8001\u9ec4\u725b**\u3002\u7b26\u5408\u201c\u6309\u65f6\u4ea4\u4f5c\u4e1a\u3001\u8d28\u91cf\u7a33\u6b65\u63d0\u5347\u3001\u53d1\u8a00\u805a\u7126\u5b66\u4e60\u3001\u60c5\u7eea\u7a33\u5b9a\u201d\u7b49\u7279\u5f81\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u884c\u4e3a\u72ec\u7acb\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u7528\u6237\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5f3a\uff0c\u80fd\u8ddf\u4e0a\u8282\u594f\uff0c\u98ce\u9669\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u6297\u538b\u6027\u5f3a\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | **\u6838\u5fc3\u98ce\u9669\u70b9**\uff1a\u5982\u679c\u5b66\u4e60\u4e00\u6bb5\u65f6\u95f4\u540e\uff08\u59821-2\u4e2a\u6708\uff09\u63a5\u5355\u8def\u5f84\u4e0d\u6e05\u6670\u6216\u8fdb\u5c55\u7f13\u6162\uff0c\u53ef\u80fd\u56e0\u201c\u641e\u94b1\u201d\u9884\u671f\u672a\u8fbe\u800c\u52a8\u6447\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe1-2\u4e2a\u6708\u540e**\uff0c\u5f53\u6280\u80fd\u7ec3\u4e60\u8fdb\u5165\u5e73\u53f0\u671f\uff0c\u800c\u53d8\u73b0\u673a\u4f1a\u5c1a\u672a\u660e\u786e\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6b22\u8fce\u52a0\u5165\u7cbe\u82f1\u73ed\uff01\u770b\u5230\u4f60\u5728\u4f53\u9a8c\u8425\u7684\u8868\u73b0\u975e\u5e38\u624e\u5b9e\uff0c\u4f5c\u4e1a\u5b8c\u6210\u5ea6\u548c\u609f\u6027\u90fd\u5f88\u9ad8\u3002\u54b1\u4eec\u8fd9\u4e2a\u9636\u6bb5\u5c31\u662f\u628a\u4f60\u2018\u5fa1\u59d0\u97f3\u2019\u7684\u4f18\u52bf\u7cfb\u7edf\u5316\uff0c\u540c\u65f6\u62d3\u5c55\u66f4\u591a\u89d2\u8272\u53ef\u80fd\u3002\u6709\u4efb\u4f55\u6280\u672f\u4e0a\u7684\u2018\u786c\u9aa8\u5934\u2019\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u5543\u4e0b\u6765\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176T2\u8001\u9ec4\u725b\u7279\u8d28\uff0c\u63d0\u4f9b\u7ed3\u6784\u5316\u3001\u6709\u6df1\u5ea6\u7684\u8bfe\u7a0b\u548c\u5b9e\u6218\u4efb\u52a1\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743(B\u6a21\u5757)\u3011** + **\u3010\u9636\u6bb5\u6027\u6210\u679c\u5c55\u793a\u4e0e\u63a5\u5355\u8def\u5f84\u89c4\u5212\u3011**\u3002\u5728\u624e\u5b9e\u5b66\u4e60\u7684\u57fa\u7840\u4e0a\uff0c\u9002\u65f6\u5f15\u5165\u771f\u5b9e\u6d3e\u5355\u6216\u5185\u90e8\u8bd5\u97f3\u673a\u4f1a\uff0c\u6ee1\u8db3\u5176\u6f5c\u5728\u7684\u53d8\u73b0\u671f\u5f85\uff0c\u5de9\u56fa\u5b66\u4e60\u52a8\u529b\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u8fc7\u4e8e\u5a31\u4e50\u5316\u6216\u60c5\u611f\u6cdb\u6ee5\u7684\u65b9\u5f0f\u6c9f\u901a\uff1b\u7ed9\u4e88\u6a21\u7cca\u3001\u4e0d\u5207\u5b9e\u9645\u7684\u201c\u901f\u6210\u66b4\u5bcc\u201d\u627f\u8bfa\uff1b\u5ffd\u89c6\u5176\u4f5c\u4e1a\u53cd\u9988\u548c\u8fdb\u6b65\u7ec6\u8282\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5f53\u5176\u6280\u80fd\u8fbe\u5230\u4e00\u5b9a\u6c34\u5e73\u540e\uff0c\u53ef\u4ee5\u63a8\u8350\u9ad8\u9636\u8bbe\u5907\u3001\u79c1\u6559\u8bfe\u6216\u66f4\u5782\u76f4\u7684\u8d5b\u9053\u8bfe\u7a0b\uff08\u5982\u5546\u914d\u3001\u6709\u58f0\u5267\u540e\u671f\uff09\uff0c\u4f46\u63a8\u4ecb\u5fc5\u987b\u57fa\u4e8e\u5176\u5b9e\u9645\u4f5c\u54c1\u548c\u8fdb\u6b65\uff0c\u6709\u7406\u6709\u636e\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u5148\u5b66\u4e60\u5427\uff0c\u6682\u65f6\u6ca1\u60f3\u597d\u201d \u2014\u2014 **\u52a8\u673a\u4e2d\u6027\u7684\u76f4\u63a5\u8bc1\u636e\uff0c\u4e0d\u6025\u529f\u8fd1\u5229\u3002**\n2. > \u201c\u542c\u4e86\u8001\u5e08\u8bb2\u7684\u611f\u60c5\u5938\u5f20\u4e00\u70b9\uff0c\u786e\u5b9e\u5f55\u7684\u6548\u679c\u66f4\u597d\u201d \u2014\u2014 **\u9ad8\u5fc3\u7406\u5f39\u6027\u548c\u5b66\u4e60\u80fd\u529b\u7684\u4f53\u73b0\uff0c\u80fd\u5438\u6536\u53cd\u9988\u5e76\u7acb\u5373\u6539\u8fdb\u3002**\n3. > \u201c\u8001\u5e08\u4ecb\u7ecd\u7684\u5f88\u5168\u9762[\u9f13\u638c]\u201d / \u201c\u6536\u5230\uff0c\u7ee7\u7eed\u5b66\u4e60[\u5472\u7259]\u201d \u2014\u2014 **\u6001\u5ea6\u79ef\u6781\u3001\u914d\u5408\u5ea6\u9ad8\uff0c\u662f\u5178\u578b\u7684\u201c\u597d\u5b66\u751f\u201d\u53cd\u9988\u6a21\u5f0f\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2\u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u9886\u57df\u7684\u5c0a\u91cd\u4e0e\u6e05\u6670\u7684\u6210\u957f\u8def\u5f84\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u7a33\u5b9a\u3001\u6709\u6df1\u5ea6\u7684\u5b66\u4e60\u5185\u5bb9\uff0c\u5e76\u9002\u65f6\u7ed9\u4e88\u6e05\u6670\u7684\u53d8\u73b0\u8def\u5f84\u6307\u5f15\u548c\u5b9e\u6218\u673a\u4f1a\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd/\u793e\u4ea4\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
