        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677160769 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u83ab\u8bed9(\u5218\u6587\u4e1c)\u3001\u9648\u9648(\u5218\u6587\u4e1c)\u3001\u53ef\u4e3d\u513f(\u5b54\u4ee4\u5a77) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u7cfb\u7edf\u8bfe (\u4ef7\u683c\uff1a7380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u7528\u6237\u76f4\u63a5\u56de\u590d\u201c7380\u201d\uff0c\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u8d44\u91d1\u6765\u6e90\u6216\u5bb6\u5ead\u8ba8\u8bba\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u9ad8\u5bbd\u88d5**\u3002\u7528\u6237\u4e3a\u9000\u4f11\u72b6\u6001\uff0c\u660e\u786e\u8868\u793a\u201c\u53ef\u4ee5\u5168\u804c\u201d\uff0c\u5e76\u613f\u610f\u6295\u5165\u201c\u6700\u591a\u7684\u65f6\u95f4\u201d\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u6210\u5458\u6216\u5bb6\u5ead\u652f\u6301/\u53cd\u5bf9\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u5173\u952e\u4fe1\u606f\u5982\u652f\u4ed8\u80fd\u529b\u3001\u5bb6\u5ead\u652f\u6301\u3001\u8fc7\u5f80\u5b66\u4e60\u632b\u6298\u53f2\u3001\u5177\u4f53\u7ecf\u6d4e\u72b6\u51b5\u5b8c\u5168\u7a7a\u767d\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4ee5\u201c\u8d5a\u7c73\u201d\u4e3a\u4e3b\u8981\u76ee\u7684\uff0c\u4f46\u5bf9\u5b66\u4e60\u8fc7\u7a0b\u8868\u73b0\u51fa\u79ef\u6781\u6001\u5ea6\uff0c\u613f\u610f\u6295\u5165\u65f6\u95f4\u7ec3\u4e60\uff0c\u672a\u8981\u6c42\u77ed\u671f\u4fdd\u5e95\u627f\u8bfa\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6765\u8bad\u7ec3\u8425\u60f3\u6536\u83b7\u4ec0\u4e48\uff1f\u8d5a\u7c73/\u5174\u8da3]: \u8d5a\u7c73\u201d > \u201c\u6211\u4f1a\u8ba4\u771f\u7684\u8ddf\u4f60\u5b66\u4e60\u62ff\u5230\u7ed3\u679c[\u52a0\u6cb9]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b06\u9ad8]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[**\u4fe1\u606f\u4e0d\u8db3**] \u2014 \u672a\u63d0\u53ca\u652f\u4ed8\u538b\u529b\u6216\u8d44\u91d1\u6765\u6e90\uff0c\u76f4\u63a5\u62a5\u51fa\u4ef7\u683c\uff0c\u4f46\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u5f71\u54cd\u751f\u6d3b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[**\u9ad8**] \u2014 \u9000\u4f11\u72b6\u6001\uff0c\u65f6\u95f4\u5145\u88d5\uff0c\u80fd\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u52a0\u76f4\u64ad\u548cPia\u620f\u6d3b\u52a8\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[**\u4fe1\u606f\u4e0d\u8db3**] \u2014 \u5b8c\u5168\u672a\u63d0\u53ca\uff0c\u662f**\u6700\u5927\u98ce\u9669\u76f2\u533a**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u6001\u5ea6\u79ef\u6781\uff0c\u80fd\u63a5\u53d7\u4e13\u4e1a\u5efa\u8bae\u5e76\u8868\u793a\u611f\u8c22\u3002\u5728\u611f\u5192\u5f71\u54cd\u72b6\u6001\u65f6\uff0c\u80fd\u4e3b\u52a8\u8bf4\u660e\u60c5\u51b5\u5e76\u575a\u6301\u5b66\u4e60\uff0c\u672a\u8868\u73b0\u51fa\u62b1\u6028\u6216\u653e\u5f03\u503e\u5411\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6628\u5929\u611f\u5192\u4e25\u91cd\u5589\u5499\u75db\u6240\u4ee5\u4e0d\u662f\u5f88\u7406\u60f3\u201d > \u201c\u867d\u7136\u6211\u5e74\u9f84\u6709\u70b9\u5927\uff0c\u4f46\u662f\u6211\u4f1a\u66f4\u52aa\u529b\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u9000\u4f11\u540e\u53ef\u80fd\u9762\u4e34\u793e\u4f1a\u89d2\u8272\u7f3a\u5931\u3001\u4ef7\u503c\u611f\u964d\u4f4e\u7684\u56f0\u5883\u3002\u5b66\u4e60\u6709\u58f0\u6f14\u64ad\uff0c\u4e0d\u4ec5\u662f\u201c\u8d5a\u7c73\u201d\uff0c\u66f4\u662f\u5bfb\u6c42\u65b0\u7684\u793e\u4f1a\u8eab\u4efd\u8ba4\u540c\u3001\u83b7\u5f97\u4ed6\u4eba\uff08\u8001\u5e08\u3001\u540c\u5b66\u3001\u542c\u4f17\uff09\u7684\u5c0a\u91cd\uff0c\u4ee5\u53ca\u5b9e\u73b0\u665a\u5e74\u81ea\u6211\u4ef7\u503c\u7684\u65b0\u9014\u5f84\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u80af\u5b9a\u4e0e\u4ef7\u503c\u8d4b\u4e88**\u3002\u5c06\u4ed6\u89c6\u4e3a\u201c\u53ef\u5851\u4e4b\u624d\u201d\u3001\u201c\u4f18\u79c0\u5b66\u5458\u201d\uff0c\u8d4b\u4e88\u4ed6\u201c\u4e13\u4e1a\u4e3b\u64ad\u201d\u7684\u6f5c\u5728\u8eab\u4efd\uff0c\u6ee1\u8db3\u5176\u88ab\u9700\u8981\u3001\u88ab\u8ba4\u53ef\u3001\u88ab\u5c0a\u91cd\u7684\u6df1\u5c42\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u7cbe\u51c6\u843d\u4f4d**\u3002\u8d44\u6e90\u5e95\u5ea7\uff08\u8d44\u91d1\u3001\u5bb6\u5ead\uff09\u4fe1\u606f\u7f3a\u5931\uff0c\u65e0\u6cd5\u5b8c\u6210\u6b65\u9aa40\uff08\u652f\u4ed8\u6838\u67e5\uff09\u4e0e\u6b65\u9aa41.5\uff08\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5\uff09\u3002\u57fa\u4e8e\u73b0\u6709\u4fe1\u606f\uff0c\u503e\u5411 **\ud83d\udfe7B\u7c7b**\uff08\u6709\u660e\u786e\u76ee\u6807\uff0c\u8d44\u6e90\u770b\u4f3c\u5145\u8db3\uff0c\u4f46\u5173\u952e\u98ce\u9669\u672a\u77e5\uff09\u3002 |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **\u503e\u5411 T2 \u4f4e\u8c03\u5b9e\u5e72\u578b**\u3002\u7528\u6237\u76ee\u6807\u660e\u786e\uff08\u8d5a\u7c73\uff09\uff0c\u884c\u52a8\u529b\u5f3a\uff08\u6309\u65f6\u6253\u5361\u3001\u79ef\u6781\u4e0a\u9ea6\uff09\uff0c\u6001\u5ea6\u8ba4\u771f\uff08\u53cd\u590d\u770b\u8bfe\u3001\u611f\u8c22\u70b9\u8bc4\uff09\uff0c\u4e0d\u5f20\u626c\u4f46\u6e34\u671b\u901a\u8fc7\u52aa\u529b\u83b7\u5f97\u7ed3\u679c\u548c\u8ba4\u53ef\u3002 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1] (\u57fa\u4e8e\u73b0\u6709\u4fe1\u606f)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u7b49\u8868\u8ff0\u3002\u4f46**\u5bb6\u5ead\u652f\u6301\u5ea6\u4fe1\u606f\u7f3a\u5931\uff0c\u662f\u6f5c\u5728\u7684D\u7c7b\u7194\u65ad\u7ea2\u7ebf**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u9ad8** | **\u3010\u9ad8\u5371\u76f2\u533a\u3011** \u804a\u5929\u8bb0\u5f55\u5b8c\u5168\u672a\u63d0\u53ca\u5bb6\u4eba\u3002\u82e5\u62a5\u540d\u662f\u7792\u7740\u914d\u5076\u6216\u5b50\u5973\u52a8\u7528\u5bb6\u5ead\u50a8\u84c4\uff0c\u540e\u7eed\u6781\u6613\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u5bfc\u81f4\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u9000\u4f11\u72b6\u6001\u65f6\u95f4\u5145\u88d5\uff0c\u5b66\u4e60\u610f\u613f\u5f3a\uff0c\u8ddf\u8fdb\u538b\u529b\u5c0f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u4e2d\u7b49\uff0c\u80fd\u63a5\u53d7\u6279\u8bc4\uff0c\u4e3b\u52a8\u8bf4\u660e\u56f0\u96be\uff08\u611f\u5192\uff09\uff0c\u672a\u8868\u73b0\u51fa\u73bb\u7483\u5fc3\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u76ee\u6807\u662f\u201c\u8d5a\u7c73\u201d\uff0c\u82e5\u5b66\u4e601-2\u4e2a\u6708\u540e\u672a\u83b7\u5f97\u9884\u671f\u7684\u8bd5\u97f3\u673a\u4f1a\u6216\u5fae\u5c0f\u6536\u76ca\uff0c\u53ef\u80fd\u4ea7\u751f\u6000\u7591\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c1\u4e2a\u6708\u5185**\u3002\u82e5\u5bb6\u5ead\u53cd\u5bf9\u7206\u53d1\uff0c\u6216\u53d1\u73b0\u53d8\u73b0\u8fdb\u5ea6\u8fdc\u4f4e\u4e8e\u9884\u671f\uff08\u5982\u201c4-6\u4e2a\u6708\u63a5\u5355\u201d\u7684\u627f\u8bfa\u672a\u5151\u73b0\uff09\uff0c\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cX\u53d4\u53d4/\u963f\u59e8\uff0c\u770b\u5230\u60a8\u8fd9\u4e48\u8ba4\u771f\u548c\u52aa\u529b\uff0c\u771f\u7684\u7279\u522b\u4f69\u670d\u3002\u6211\u4eec\u8fd9\u4e2a\u73ed\u91cc\u6709\u4e0d\u5c11\u50cf\u60a8\u4e00\u6837\uff0c\u628a\u9000\u4f11\u751f\u6d3b\u8fc7\u51fa\u65b0\u7cbe\u5f69\u7684\u4f19\u4f34\u3002\u60a8\u7684\u58f0\u97f3\u5e95\u5b50\u548c\u5b66\u4e60\u6001\u5ea6\u90fd\u7279\u522b\u597d\uff0c\u54b1\u4eec\u4e0d\u7740\u6025\uff0c\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u73ed\u73ed\u4f1a\u966a\u7740\u60a8\uff0c\u4e0d\u4ec5\u628a\u6280\u80fd\u5b66\u5230\u624b\uff0c\u66f4\u8ba9\u60a8\u7684\u58f0\u97f3\u88ab\u66f4\u591a\u4eba\u542c\u5230\u548c\u559c\u6b22\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u3002\u5339\u914d\u5176T2\u5b9e\u5e72\u7279\u8d28\uff0c\u63d0\u4f9b\u6e05\u6670\u7684\u6280\u80fd\u8fdb\u9636\u8def\u5f84\u548c\u5b9e\u64cd\u4efb\u52a1\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u201c\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\u201d\u9700\u6c42\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\uff08\u8f7b\u91cf\uff09**\u3011\u5143\u7d20\u3002\u4f8b\u5982\uff1a\u4efb\u547d\u4e3a\u5c0f\u7ec4\u957f\u3001\u9080\u8bf7\u5206\u4eab\u9000\u4f11\u540e\u5b66\u4e60\u5fc3\u5f97\u3001\u5c06\u5176\u4f18\u79c0\u4f5c\u4e1a\u4f5c\u4e3a\u8303\u4f8b\u5c55\u793a\u3002**\u8c28\u614e\u4f7f\u7528\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\uff0c\u8fc7\u5ea6\u5b89\u629a\u53ef\u80fd\u9002\u5f97\u5176\u53cd\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u5ffd\u89c6\u5bb6\u5ead\u98ce\u9669**\uff1a\u5fc5\u987b\u7b2c\u4e00\u65f6\u95f4\u4ee5\u5173\u6000\u65b9\u5f0f\u4e86\u89e3\u5176\u62a5\u540d\u662f\u5426\u5df2\u83b7\u5bb6\u4eba\u652f\u6301\u30022. **\u8fc7\u5ea6\u753b\u997c**\uff1a\u907f\u514d\u5f3a\u8c03\u201c\u5feb\u901f\u66b4\u5bcc\u201d\uff0c\u5e94\u5f3a\u8c03\u201c\u6280\u80fd\u79ef\u7d2f-\u83b7\u5f97\u8ba4\u53ef-\u7a33\u5b9a\u53d8\u73b0\u201d\u7684\u5408\u7406\u8def\u5f84\u30023. **\u5c06\u5176\u89c6\u4e3a\u201c\u8001\u5e74\u4eba\u201d\u7279\u6b8a\u5bf9\u5f85**\uff1a\u907f\u514d\u4f7f\u7528\u201c\u60a8\u5e74\u7eaa\u5927\u8fd8\u8fd9\u4e48\u52aa\u529b\u201d\u7b49\u53ef\u80fd\u5f15\u53d1\u53cd\u611f\u7684\u5bf9\u6bd4\u5f0f\u9f13\u52b1\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u672a\u4e86\u89e3\u5176\u5bb6\u5ead\u8d22\u52a1\u72b6\u51b5\u524d\u8fdb\u884c\u4efb\u4f55\u5927\u989d\u5347\u5355**\u3002\u53ef\u57fa\u4e8e\u5176\u5b66\u4e60\u6210\u679c\uff0c\u63a8\u8350500\u5143\u4ee5\u5185\u7684\u5fae\u8bfe\u6216\u5de5\u5177\u4f5c\u4e3a\u5956\u52b1\u548c\u8ba4\u53ef\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c[\u5e74\u9f84]\uff1a57 [\u804c\u4e1a]: \u9000\u4f11 [\u6765\u8bad\u7ec3\u8425\u60f3\u6536\u83b7\u4ec0\u4e48\uff1f\u8d5a\u7c73/\u5174\u8da3]: \u8d5a\u7c73\u201d\n2. > \u201c\u867d\u7136\u6211\u5e74\u9f84\u6709\u70b9\u5927\uff0c\u4f46\u662f\u6211\u4f1a\u66f4\u52aa\u529b\u201d\n3. > \u201c\u542c\u4e86\u4f60\u7684\u8bfe\u6211\u611f\u89c9\u8c41\u7136\u5f00\u6717\uff0c\u6253\u5f00\u4e86\u6211\u7684\u773c\u754c\uff0c\u5bf9\u751f\u6d3b\u5145\u6ee1\u4e86\u5e0c\u671b\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2\u4f4e\u8c03\u5b9e\u5e72\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u4e0e\u5b9e\u73b0\u665a\u5e74\u4ef7\u503c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\uff08\u5bb6\u5ead\u98ce\u9669\u672a\u77e5\uff09\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5f00\u8425\u521d\u671f\u5fc5\u987b\u79c1\u4e0b\u3001\u59d4\u5a49\u5730\u6838\u5b9e\u5bb6\u5ead\u652f\u6301\u5ea6\u4e0e\u652f\u4ed8\u5b89\u5168\u6027\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd/\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5708\u5c42\u5408\u4f19\u4eba\u7ebf(\u8f7b\u91cf)\"}\n```";
