    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677185181\u7684\u7528\u6237\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677185181 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u516d\u6708\u6668\u516e1(\u5218\u5c0f\u5a1f) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u64ad\u6709\u58f0\u6f14\u64ad\u9ad8\u9636\u73ed (2380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u7528\u5361\u5468\u8f6c** (\u7528\u6237\u652f\u4ed8\u540e\u8868\u793a\u201c\u665a\u70b9\u6362\u8001\u516c\u8d26\u53f7\u201d\uff0c\u6697\u793a\u53ef\u80fd\u4f7f\u7528\u4e2a\u4eba\u4fe1\u7528\u5361\u6216\u8d44\u91d1\u9700\u5468\u8f6c) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u7528\u6237\u63d0\u53ca\u201c\u521a\u5fd9\u5b8c\u5bb6\u91cc\u7684\u4e8b\u201d\u3001\u201c\u665a\u4e0a\u516b\u70b9\u6709\u6f14\u51fa\u201d\uff0c\u8868\u660e\u65f6\u95f4\u88ab\u5de5\u4f5c\u3001\u5bb6\u5ead\u3001\u4e2a\u4eba\u4e8b\u52a1\u5206\u5272) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u9690\u7792\u5077\u62a5** (\u652f\u4ed8\u540e\u9700\u201c\u6362\u8001\u516c\u8d26\u53f7\u201d\uff0c\u660e\u786e\u8868\u660e\u5bb6\u4eba\u4e0d\u77e5\u60c5\u6216\u672a\u5b8c\u5168\u652f\u6301) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** (\u4e92\u52a8\u9891\u7e41\uff0c\u5b66\u4e60\u884c\u4e3a\u3001\u4e2a\u4eba\u504f\u597d\u3001\u987e\u8651\u5747\u6709\u6e05\u6670\u8868\u8fbe) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u60f3\u62d3\u5c55\u517c\u804c\u4e3a\u4e3b\u201d\uff0c\u6709\u660e\u786e\u7684\u53d8\u73b0\u76ee\u7684\uff0c\u4f46\u540c\u65f6\u4e5f\u8868\u73b0\u51fa\u5bf9\u7279\u5b9a\u5185\u5bb9\u7c7b\u578b\uff08\u793e\u79d1\u3001\u60ac\u7591\uff09\u7684\u4e2a\u4eba\u5174\u8da3\uff0c\u5e76\u4e3b\u52a8\u8fdb\u884c\u58f0\u97f3\u63a2\u7d22\uff08\u201c\u5c45\u7136\u8bfb\u7537\u751f\u7684\u4f5c\u54c1\u53cd\u800c\u6bd4\u8f83\u987a\u201d\uff09\uff0c\u52a8\u673a\u4e2d\u6df7\u6742\u4e86\u5174\u8da3\u63a2\u7d22\u4e0e\u517c\u804c\u53d8\u73b0\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8fd8\u60f3\u5728\u770b\u770b\uff0c\u6211\u76ee\u524d\u60f3\u62d3\u5c55\u517c\u804c\u4e3a\u4e3b \u5982\u679c\u80fd\u8ddf\u7740\u6668\u516e\u8001\u5e08\u7684\u5de5\u4f5c\u5ba4\u6709\u7a7a\u7684\u65f6\u5019\u8d5a\u70b9\u5916\u5feb\u4e5f\u662f\u4e0d\u9519\u7684\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u652f\u4ed82380\u5143\u8bfe\u7a0b\uff0c\u4f46\u652f\u4ed8\u540e\u9700\u201c\u6362\u8001\u516c\u8d26\u53f7\u201d\uff0c\u5b58\u5728\u8d44\u91d1\u5468\u8f6c\u6216\u5bb6\u5ead\u8d22\u52a1\u4e0d\u72ec\u7acb\u7684\u60c5\u51b5\uff0c\u975e\u7edd\u5bf9\u5bbd\u88d5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u6709\u5de5\u4f5c\uff08\u201c\u548c\u6211\u73b0\u5b9e\u5de5\u4f5c\u6709\u70b9\u91cd\u590d\u4e86\u201d\uff09\uff0c\u6709\u5bb6\u5ead\u4e8b\u52a1\uff0c\u65f6\u95f4\u5448\u788e\u7247\u5316\uff0c\u4f46\u80fd\u575a\u6301\u5b8c\u6210\u4f5c\u4e1a\u548c\u76f4\u64ad\u5b66\u4e60\uff0c\u5177\u5907\u57fa\u672c\u7684\u5b66\u4e60\u6295\u5165\u80fd\u529b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4f4e** \u2014 **\u5173\u952e\u77ed\u677f**\u3002\u652f\u4ed8\u884c\u4e3a\u9700\u201c\u6362\u8001\u516c\u8d26\u53f7\u201d\uff0c\u660e\u786e\u6307\u5411\u5bb6\u5ead\u8d22\u52a1\u4e0d\u900f\u660e\u6216\u652f\u6301\u5ea6\u4f4e\uff0c\u6784\u6210\u91cd\u5927\u6f5c\u5728\u98ce\u9669\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3**\u3002\u7528\u6237\u80fd\u4e3b\u52a8\u8fdb\u884c\u7ec3\u4e60\u590d\u76d8\uff08\u201c\u91cd\u590d\u542c\u89c9\u5f97\u90e8\u5206\u5b57\u4f1a\u6709\u7279\u522b\u7684\u91cd\u97f3\u201d\uff09\uff0c\u5bf9\u9500\u552e/\u73ed\u4e3b\u4efb\u7684\u53cd\u9988\u79ef\u6781\u63a5\u7eb3\u5e76\u8868\u793a\u611f\u8c22\uff0c\u672a\u8868\u73b0\u51fa\u4efb\u4f55\u60c5\u7eea\u5d29\u6e83\u6216\u8fc7\u5ea6\u4f9d\u8d56\u5b89\u629a\u7684\u8ff9\u8c61\uff0c\u5c55\u73b0\u51fa\u826f\u597d\u7684\u81ea\u6211\u8c03\u8282\u548c\u5b66\u4e60\u4e3b\u52a8\u6027\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u597d\u7684 \u8c22\u8c22\u5e08\u59d0\u6307\u70b9 \u665a\u70b9\u6709\u7a7a\u6211\u518d\u91cd\u65b0\u7ec3\u4e00\u4e0b\u201d (\u63a5\u53d7\u53cd\u9988\u5e76\u8ba1\u5212\u884c\u52a8) > \u201c\u5e08\u59d0\u4e0d\u597d\u610f\u601d\u5462 \u4eca\u665a\u4e0a\u516b\u70b9\u5de6\u53f3\u6709\u70b9\u4e8b\u60c5 \u53ef\u80fd\u6ca1\u529e\u6cd5\u53ca\u65f6\u53c2\u52a0\u201d (\u80fd\u6e05\u6670\u3001\u793c\u8c8c\u5730\u6c9f\u901a\u65f6\u95f4\u51b2\u7a81)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u73b0\u6709\u804c\u4e1a\u53d1\u5c55\u6216\u6536\u5165\u6765\u6e90\u7684\u4e0d\u5b89\u5168\u611f\u4e0e\u7126\u8651**\u3002\u7528\u6237\u6709\u672c\u804c\u5de5\u4f5c\uff08\u201c\u548c\u6211\u73b0\u5b9e\u5de5\u4f5c\u6709\u70b9\u91cd\u590d\u4e86\u201d\uff09\uff0c\u4f46\u5e0c\u671b\u901a\u8fc7\u6709\u58f0\u6f14\u64ad\u62d3\u5c55\u517c\u804c\uff0c\u589e\u52a0\u6536\u5165\u6e20\u9053\uff0c\u5bfb\u6c42\u804c\u4e1a\u548c\u7ecf\u6d4e\u7684\u201c\u7b2c\u4e8c\u66f2\u7ebf\u201d\u4fdd\u969c\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u4fe1\u7684\u53d8\u73b0\u8def\u5f84\u548c\u804c\u4e1a\u5b89\u5168\u611f**\u3002\u7528\u5177\u4f53\u7684\u63a5\u5355\u6848\u4f8b\u3001\u8d44\u6e90\u6276\u6301\uff08\u5982\u9884\u7559\u7248\u6743\u4e66\uff09\u548c\u201c\u5e08\u59d0\u5e26\u8def\u201d\u7684\u966a\u4f34\u611f\uff0c\u7f13\u89e3\u5176\u5bf9\u672a\u77e5\u9886\u57df\u7684\u7126\u8651\uff0c\u5efa\u7acb\u201c\u8ddf\u7740\u5e73\u53f0/\u8001\u5e08\u8d70\u5c31\u6709\u94b1\u8d5a\u201d\u7684\u786e\u5b9a\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2** \u7c7b (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u8bba** (\u52a8\u673a\u4e2d+\u8d44\u6e90\u4e2d+\u5bb6\u5ead\u652f\u6301\u5ea6\u4f4e\uff0c\u6784\u6210\u5178\u578bC2\u98ce\u9669) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 **\u5b89\u5168\u672a\u89e6\u53d1** (\u672a\u53d1\u73b0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u7b49\u4fe1\u53f7)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a/\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| **\u5bb6\u5ead\u5e72\u9884\u578b** | **\u9ad8** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u652f\u4ed8\u884c\u4e3a\u5df2\u66b4\u9732\u5bb6\u5ead\u8d22\u52a1\u4e0d\u900f\u660e\uff08\u201c\u6362\u8001\u516c\u8d26\u53f7\u201d\uff09\u3002\u4e00\u65e6\u5bb6\u4eba\u53d1\u73b0\u5e76\u53cd\u5bf9\uff0c\u6781\u6613\u5f15\u53d1\u5f3a\u70c8\u9000\u8d39\u8981\u6c42\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u4e2d** | \u65f6\u95f4\u788e\u7247\u5316\uff0c\u82e5\u8bfe\u7a0b\u5f3a\u5ea6\u4e0e\u672c\u804c\u5de5\u4f5c\u3001\u5bb6\u5ead\u4e8b\u52a1\u51b2\u7a81\u52a0\u5267\uff0c\u53ef\u80fd\u5bfc\u81f4\u5b66\u4e60\u8fdb\u5ea6\u6ede\u540e\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u632b\u8d25\u611f\u800c\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u81ea\u6211\u6d88\u5316\u95ee\u9898\uff0c\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u4e0d\u6613\u56e0\u5b66\u4e60\u632b\u6298\u800c\u60c5\u7eea\u5d29\u6e83\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u4e2d** | \u517c\u804c\u53d8\u73b0\u8bc9\u6c42\u660e\u786e\u3002\u82e5\u5728\u627f\u8bfa\u5468\u671f\u5185\uff08\u59821-3\u4e2a\u6708\uff09\u672a\u83b7\u5f97\u5b9e\u8d28\u6027\u7684\u63a5\u5355\u673a\u4f1a\u6216\u6536\u5165\uff0c\u53ef\u80fd\u56e0\u9884\u671f\u672a\u8fbe\u800c\u8981\u6c42\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e1\u4e2a\u6708\u5185**\u3002\u6b64\u9636\u6bb5\u82e5\u5bb6\u5ead\u77db\u76fe\u7206\u53d1\uff0c\u6216\u9996\u6b21\u5c1d\u8bd5\u63a5\u5355\u5931\u8d25\u4e14\u672a\u83b7\u5f97\u6709\u6548\u5b89\u629a\u4e0e\u6307\u5bfc\uff0c\u9000\u8d39\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5e08\u59d0\u770b\u5230\u4f60\u5b66\u4e60\u7279\u522b\u8ba4\u771f\uff0c\u4f5c\u4e1a\u4e5f\u5b8c\u6210\u5f97\u5f88\u68d2\uff01\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u5c31\u662f\u4e3a\u4f60\u8fd9\u6837\u60f3\u8e0f\u5b9e\u5b66\u70b9\u6280\u80fd\u3001\u62d3\u5c55\u4e00\u4efd\u9760\u8c31\u517c\u804c\u7684\u540c\u5b66\u8bbe\u8ba1\u7684\u3002\u522b\u62c5\u5fc3\u65f6\u95f4\u788e\uff0c\u5f88\u591a\u5e08\u5144\u5e08\u59d0\u90fd\u662f\u5229\u7528\u4e0b\u73ed\u548c\u5468\u672b\u65f6\u95f4\u6162\u6162\u505a\u8d77\u6765\u7684\u3002**\u6700\u91cd\u8981\u7684\u662f\uff0c\u54b1\u4eec\u6bcf\u4e00\u6b65\u90fd\u8d70\u5f97\u7a33\uff0c\u6709\u5355\u5b50\u5e08\u59d0\u4f1a\u4f18\u5148\u60f3\u7740\u4f60\uff0c\u5bb6\u91cc\u90a3\u8fb9\u5982\u679c\u9700\u8981\u5e2e\u5fd9\u89e3\u91ca\uff0c\u4e5f\u53ef\u4ee5\u968f\u65f6\u627e\u6211\u3002**\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011**\u3002\u7d27\u6263\u5176\u201c\u517c\u804c\u53d8\u73b0\u201d\u6838\u5fc3\u8bc9\u6c42\uff0c\u4f18\u5148\u63d0\u4f9b\u660e\u786e\u7684\u63a5\u5355\u8def\u5f84\u3001\u8bd5\u97f3\u6307\u5bfc\u548c\u521d\u671f\u8d44\u6e90\u6276\u6301\uff08\u5982\u627f\u8bfa\u7684\u7248\u6743\u4e66\uff09\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176**\u5bb6\u5ead\u652f\u6301\u5ea6\u4f4e**\u7684\u98ce\u9669\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145**\u3010\u5bb6\u5ead\u5173\u7cfb\u7f13\u51b2\u5305\u3011**\uff0c\u7531\u73ed\u4e3b\u4efb\u51c6\u5907\u4e00\u5957\u5e94\u5bf9\u5bb6\u4eba\u8d28\u7591\u7684\u201c\u5b66\u4e60\u4ef7\u503c\u4e0e\u5b89\u5168\u4fdd\u969c\u201d\u8bdd\u672f\uff0c\u4ee5\u5907\u4e0d\u65f6\u4e4b\u9700\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a**\u8fc7\u5ea6\u753b\u997c\uff0c\u627f\u8bfa\u77ed\u671f\u5185\uff08\u59821\u4e2a\u6708\uff09\u5fc5\u80fd\u8d5a\u5230\u591a\u5c11\u94b1**\u3002\u5fc5\u987b\u8fdb\u884c**\u9006\u5411\u9884\u671f\u7ba1\u7406**\uff0c\u5f3a\u8c03\u6280\u80fd\u79ef\u7d2f\u548c\u5e73\u53f0\u8d44\u6e90\u7684\u91cd\u8981\u6027\uff0c\u964d\u4f4e\u5176\u4e0d\u5207\u5b9e\u9645\u7684\u66b4\u5bcc\u5e7b\u60f3\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u5728\u9996\u6b21\u6210\u529f\u63a5\u5355\u5e76\u83b7\u5f97\u6b63\u5411\u53cd\u9988\u524d\uff0c\u4e25\u7981\u4efb\u4f55\u5927\u989d\u5347\u5355\u63a8\u4ecb**\u3002\u53ef\u9002\u5ea6\u63a8\u8350500\u5143\u4ee5\u5185\u7684\u8f7b\u91cf\u7ea7\u8f85\u52a9\u5de5\u5177\u6216\u8d44\u6599\u5305\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u8fd8\u60f3\u5728\u770b\u770b\uff0c\u6211\u76ee\u524d\u60f3\u62d3\u5c55\u517c\u804c\u4e3a\u4e3b \u5982\u679c\u80fd\u8ddf\u7740\u6668\u516e\u8001\u5e08\u7684\u5de5\u4f5c\u5ba4\u6709\u7a7a\u7684\u65f6\u5019\u8d5a\u70b9\u5916\u5feb\u4e5f\u662f\u4e0d\u9519\u7684\u201d **(\u6838\u5fc3\u52a8\u673a\uff1a\u517c\u804c\u53d8\u73b0)**\n2. > \u201c\u6211\u5148\u652f\u4ed8\u665a\u70b9\u6362\u8001\u516c\u8d26\u53f7\u884c\u5417\u201d **(\u6838\u5fc3\u98ce\u9669\uff1a\u5bb6\u5ead\u8d22\u52a1\u4e0d\u900f\u660e/\u652f\u6301\u5ea6\u4f4e)**\n3. > \u201c\u91cd\u590d\u542c\u89c9\u5f97\u90e8\u5206\u5b57\u4f1a\u6709\u7279\u522b\u7684\u91cd\u97f3 \u5e94\u8be5\u662f\u548c\u6211\u5e73\u65f6\u8bf4\u8bdd\u4e0d\u600e\u4e48\u8bf4\u7fd8\u820c\u97f3\u7684\u5173\u7cfb\u201d **(\u9ad8\u5fc3\u7406\u5f39\u6027\uff1a\u4e3b\u52a8\u590d\u76d8\u4e0e\u81ea\u6211\u5206\u6790)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4 \u641e\u94b1\u7ed3\u679c\u8bba\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7ecf\u6d4e\u4fdd\u969c\u4e0e\u804c\u4e1a\u5b89\u5168\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u4e25\u9632\u5bb6\u5ead\u5e72\u9884\u98ce\u9669 + \u8fdb\u884c\u624e\u5b9e\u7684\u9006\u5411\u9884\u671f\u7ba1\u7406\uff0c\u7528\u65e9\u671f\u5c0f\u989d\u63a5\u5355\u6210\u529f\u5efa\u7acb\u4fe1\u4efb\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u8bba\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}\n```";
