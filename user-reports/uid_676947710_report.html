        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u661f\u8bed\u7476\u513f\u7476 (UID: 676947710) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-08 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u90a6\u5c3c(\u9ece\u4f73\u6167) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b (\u5df2\u8d2d)\uff1b\u540e\u671f\u8bfe\u7a0b (\u5df2\u62a5\u540d93\u671f\uff0c2399\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u7528\u5361\u5468\u8f6c / \u501f\u6b3e\u9690\u60a3** (\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u4eca\u5e74\u6211\u5f88\u7f3a\u94b1\u201d\uff0c\u5e76\u63d0\u53ca\u4e3a\u4fee\u65e7\u7535\u8111\u82b1\u8d39\u51e0\u767e\u5143\uff0c\u65b0\u8d2d\u7535\u8111\u9884\u7b97\u4ec53000\u5143\u5de6\u53f3) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u7528\u6237\u591a\u6b21\u5728\u4e0b\u73ed\u540e\uff0823:27\uff09\u6216\u6df1\u591c\uff0801:15\uff09\u6c9f\u901a\u5b66\u4e60\u95ee\u9898\uff0c\u8868\u660e\u5de5\u4f5c\u7e41\u5fd9\uff0c\u65f6\u95f4\u4e0d\u56fa\u5b9a) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u5df2\u62a5\u5907\u5e76\u652f\u6301** (\u7528\u6237\u63d0\u5230\u201c\u6211\u8001\u516c\u8bf4\u8981\u62ff\u53bb\u4fee\u201d\u65e7\u7535\u8111\uff0c\u8868\u660e\u5bb6\u4eba\u77e5\u60c5\u4e14\u652f\u6301\u5176\u5b66\u4e60\u6295\u5165) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e\uff0c\u4f46\u63a5\u53d7\u957f\u671f\u5b66\u4e60\u8def\u5f84\uff0c\u5bf9\u6280\u80fd\u672c\u8eab\u6709\u6295\u5165\u610f\u613f\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u5c31\u662f\u60f3\u8981\u597d\u70b9\u56de\u62a5\u70b9...\u4eca\u5e74\u6211\u5f88\u7f3a\u94b1\u201d > \u201c\u6240\u4ee5\u6211\u5c31\u60f3\u5c31\u662f\u53ef\u80fd\u5148\u53d1\u5c55\u659c\u6760\u5de5\u79cd\uff0c\u628a\u6211\u7684\u672c\u94b1\u627e\u56de\u6765\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u660e\u786e\u8868\u793a\u201c\u4eca\u5e74\u6211\u5f88\u7f3a\u94b1\u201d\uff0c\u4fee\u65e7\u7535\u8111\u82b1\u8d39\u51e0\u767e\u5143\u9700\u63d0\u53ca\uff0c\u65b0\u7535\u8111\u9884\u7b97\u4ec53000\u5143\uff0c\u62a5\u540d\u540e\u671f\u8bfe\u7a0b\u9700\u201c\u7b49\u51e0\u5929\u201d\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u5de5\u4f5c\u7e41\u5fd9\uff0c\u4e0b\u73ed\u665a\uff0c\u4f46\u80fd\u5229\u7528\u788e\u7247\u65f6\u95f4\u5b66\u4e60\u3001\u63d0\u95ee\u3001\u5b8c\u6210\u4f5c\u4e1a\uff0c\u5e76\u4e3b\u52a8\u53c2\u4e0e\u5c0f\u7ec4\u8ba8\u8bba\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u9ad8** \u2014 \u5bb6\u4eba\uff08\u4e08\u592b\uff09\u652f\u6301\u5176\u5b66\u4e60\uff0c\u5e76\u4e3b\u52a8\u5e2e\u5fd9\u5904\u7406\u7535\u8111\u95ee\u9898\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u3001\u64cd\u4f5c\uff09\u4f1a\u4e3b\u52a8\u3001\u53cd\u590d\u6c42\u52a9\uff0c\u4f46\u6001\u5ea6\u79ef\u6781\uff0c\u65e0\u62b1\u6028\u6216\u653e\u5f03\u8a00\u8bba\u3002\u80fd\u81ea\u6211\u8c03\u4f83\uff08\u201c\u820c\u5934\u5728\u91cc\u9762\u6253\u67b6\u201d\uff09\uff0c\u5e76\u5728\u56f0\u96be\u4e2d\u575a\u6301\uff08\u201c\u6211\u5f55\u4e86\u597d\u591a\u904d\u597d\u591a\u904d\u201d\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6362\u4e86\u4e00\u4e2a\u7535\u8111\u8fc7\u540e\uff0c\u7136\u540e\u6211\u611f\u89c9\u6211\u5565\u90fd\u4e0d\u4f1a\u4e86\u201d (\u9047\u5230\u56f0\u96be\uff0c\u4f46\u4ecd\u5728\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848) > \u201c\u6211\u5f55\u4e86\u597d\u591a\u904d\u597d\u591a\u904d\uff0c\u6211\u5728\u8863\u67dc\u91cc\u5f55\u7684\u201d (\u5c55\u793a\u51fa\u514b\u670d\u56f0\u96be\u7684\u884c\u52a8\u529b)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9**\u7ecf\u6d4e\u72b6\u51b5\u7684\u6df1\u5ea6\u7126\u8651\u548c\u4e0d\u5b89\u5168\u611f**\u3002\u5b66\u4e60\u526f\u4e1a\u7684\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u201c\u4eca\u5e74\u6211\u5f88\u7f3a\u94b1\u201d\u3001\u201c\u628a\u672c\u94b1\u627e\u56de\u6765\u201d\uff0c\u5e0c\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u6280\u80fd\uff08\u5c24\u5176\u662f\u80fd\u5feb\u901f\u4e0a\u624b\u7684\u540e\u671f\u6280\u80fd\uff09\u6765\u83b7\u5f97\u786e\u5b9a\u6027\u7684\u7ecf\u6d4e\u56de\u62a5\uff0c\u7f13\u89e3\u751f\u5b58\u538b\u529b\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u7684\u8def\u5f84\u548c\u53ca\u65f6\u7684\u6210\u5c31\u611f**\u3002\u4e3a\u4ed6\u63d0\u4f9b\u4e00\u6761\u6e05\u6670\u3001\u53ef\u6267\u884c\u3001\u80fd\u5feb\u901f\u770b\u5230\u201c\u56de\u672c\u201d\u5e0c\u671b\u7684\u6280\u80fd\u53d8\u73b0\u8def\u5f84\uff08\u5982\u540e\u671f\u8bfe\u7a0b\uff09\uff0c\u5e76\u5728\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u7ed9\u4e88\u5927\u91cf\u6b63\u5411\u53cd\u9988\u548c\u5fae\u5c0f\u6210\u5c31\u8ba4\u53ef\uff0c\u7f13\u89e3\u5176\u56e0\u7ecf\u6d4e\u538b\u529b\u4ea7\u751f\u7684\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u52a8\u673a\u4e2d\u7b49\uff0c\u8d44\u6e90\u5e95\u5ea7\u5b58\u5728\u660e\u663e\u77ed\u677f\uff0c\u4f46\u5fc3\u7406\u5f39\u6027\u548c\u5b66\u4e60\u610f\u613f\u5c1a\u53ef) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u578b** (\u6838\u5fc3\u8bc9\u6c42\u662f\u5feb\u901f\u53d8\u73b0\u56de\u672c\uff0c\u5bf9\u6280\u80fd\u5b66\u4e60\u6709\u529f\u5229\u6027\u76ee\u7684\uff0c\u4f46\u613f\u610f\u4ed8\u51fa\u884c\u52a8) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u867d\u6709\u7ecf\u6d4e\u538b\u529b\uff0c\u4f46\u672a\u5230\u501f\u8d37\u62a5\u540d\u3001\u5f71\u54cd\u57fa\u672c\u751f\u5b58\u7684\u7a0b\u5ea6\uff0c\u4e14\u5bb6\u4eba\u652f\u6301)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u5bb6\u4eba\u77e5\u60c5\u4e14\u652f\u6301\uff0c\u98ce\u9669\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u5de5\u4f5c\u7e41\u5fd9\u3001\u65f6\u95f4\u788e\u7247\u5316\uff0c\u4e00\u65e6\u8bfe\u7a0b\u96be\u5ea6\u63d0\u5347\u6216\u4f5c\u4e1a\u91cf\u52a0\u5927\uff0c\u6781\u6613\u56e0\u201c\u6ca1\u65f6\u95f4\u201d\u800c\u79ef\u538b\u4efb\u52a1\uff0c\u4ea7\u751f\u632b\u8d25\u611f\u548c\u7126\u8651\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4e2d | \u5bf9\u7535\u8111\u64cd\u4f5c\u3001\u8f6f\u4ef6\u5b89\u88c5\u7b49\u57fa\u7840\u6280\u672f\u95ee\u9898\u5b58\u5728\u4f9d\u8d56\uff0c\u82e5\u591a\u6b21\u6c42\u52a9\u65e0\u679c\u6216\u95ee\u9898\u53cd\u590d\uff0c\u53ef\u80fd\u56e0\u201c\u5b66\u4e0d\u4f1a\u201d\u800c\u4ea7\u751f\u632b\u8d25\u611f\uff0c\u4f46\u5f53\u524d\u770b\u5176\u6c42\u52a9\u540e\u80fd\u89e3\u51b3\u95ee\u9898\uff0c\u97e7\u6027\u5c1a\u53ef\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u4f5c\u4e3a\u5178\u578b\u7684T4\u7528\u6237\uff0c\u5bf9\u201c\u56de\u672c\u201d\u548c\u201c\u8d5a\u94b1\u201d\u6709\u6025\u5207\u671f\u5f85\u3002\u82e5\u5728\u540e\u671f\u8bfe\u7a0b\u5b66\u4e60\u4e2d\u671f\uff08\u7ea6\u7b2c4-6\u5468\uff09\u4ecd\u672a\u770b\u5230\u660e\u786e\u7684\u63a5\u5355\u8def\u5f84\u6216\u5fae\u5c0f\u6536\u76ca\uff0c\u6781\u6613\u56e0\u201c\u6295\u5165\u4ea7\u51fa\u6bd4\u4e0d\u7b26\u9884\u671f\u201d\u800c\u66b4\u6012\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c4-6\u5468\uff08\u6536\u76ca\u6b7b\u4ea1\u8c37\uff09**\u3002\u5f53\u57fa\u7840\u6280\u80fd\u5b66\u5b8c\uff0c\u8fdb\u5165\u5b9e\u6218\u6216\u63a5\u5355\u9884\u5907\u671f\uff0c\u82e5\u6ca1\u6709\u660e\u786e\u7684\u201c\u8d5a\u94b1\u201d\u53cd\u9988\uff0c\u9000\u8d39\u98ce\u9669\u6781\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u661f\u8bed\uff0c\u770b\u5230\u4f60\u4e3a\u4e86\u5b66\u4e60\u53c8\u662f\u501f\u7535\u8111\u53c8\u662f\u81ea\u5df1\u4e70\u65b0\u8bbe\u5907\uff0c\u8fd8\u5728\u8863\u67dc\u91cc\u5f55\u97f3\uff0c\u771f\u7684\u7279\u522b\u6709\u884c\u52a8\u529b\uff01\u54b1\u4eec\u8fd9\u4e2a\u540e\u671f\u8bfe\uff0c\u5c31\u662f\u4e3a\u4f60\u8fd9\u6837\u60f3\u5c3d\u5feb\u628a\u6280\u80fd\u53d8\u6210\u6536\u5165\u7684\u4f19\u4f34\u8bbe\u8ba1\u7684\u3002\u73ed\u73ed\u4f1a\u91cd\u70b9\u5e26\u4f60\u76ef\u7d27\u6bcf\u4e00\u4e2a\u80fd\u63a5\u5355\u7684\u5b9e\u64cd\u73af\u8282\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u7a33\u624e\u7a33\u6253\u628a\u94b1\u8d5a\u56de\u6765\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5feb\u901f\u63a5\u5355\u7ebf**\u3011\u3002\u6240\u6709\u6559\u5b66\u548c\u670d\u52a1\u56f4\u7ed5\u201c\u5982\u4f55\u6700\u5feb\u63a5\u5230\u7b2c\u4e00\u5355\u201d\u5c55\u5f00\uff0c\u5f31\u5316\u7406\u8bba\uff0c\u5f3a\u5316\u5e73\u53f0\u89c4\u5219\u3001\u7b80\u5386\u5305\u88c5\u3001\u8bd5\u97f3\u6280\u5de7\u548c\u4f4e\u4ef7\u5355\u6e20\u9053\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305** (\u8f7b\u91cf)\u3011\u3002\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\u548c\u6280\u672f\u7126\u8651\uff0c\u63d0\u4f9b\u66f4\u50bb\u74dc\u5f0f\u7684\u56fe\u6587/\u89c6\u9891\u64cd\u4f5c\u6307\u5357\uff0c\u5e76\u5728\u5176\u5b8c\u6210\u6bcf\u4e00\u4e2a\u5fae\u5c0f\u4efb\u52a1\uff08\u5982\u6210\u529f\u5b89\u88c5\u8f6f\u4ef6\u3001\u5b8c\u6210\u7b2c\u4e00\u4e2a\u7b80\u5355\u5bf9\u8f68\uff09\u65f6\u7ed9\u4e88\u5938\u5f20\u7684\u80af\u5b9a\u548c\u201c\u91d1\u5e01\u201d\u6fc0\u52b1\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u5176\u63cf\u7ed8\u4e0d\u5207\u5b9e\u9645\u7684\u201c\u66b4\u5bcc\u201d\u84dd\u56fe**\u3002\u6240\u6709\u5173\u4e8e\u6536\u76ca\u7684\u6c9f\u901a\u5fc5\u987b\u57fa\u4e8e\u5e73\u53f0\u771f\u5b9e\u6848\u4f8b\u548c\u6570\u636e\uff0c\u7ba1\u7406\u5176\u9884\u671f\u3002\n    2. **\u7edd\u4e0d\u5728\u5176\u62b1\u6028\u65f6\u95f4\u4e0d\u591f\u65f6\uff0c\u53ea\u56de\u590d\u201c\u52a0\u6cb9\u201d\u6216\u201c\u518d\u6324\u6324\u65f6\u95f4\u201d**\u3002\u5e94\u63d0\u4f9b\u5177\u4f53\u7684\u3001\u788e\u7247\u5316\u7684\u5b66\u4e60\u65b9\u6848\uff08\u5982\u201c\u6bcf\u5929\u53ea\u9700\u4e13\u6ce815\u5206\u949f\u5b8c\u6210XX\u6b65\u9aa4\u201d\uff09\u3002\n    3. **\u7edd\u4e0d\u5728\u5176\u9047\u5230\u6280\u672f\u95ee\u9898\u65f6\uff0c\u53ea\u4e22\u4e00\u4e2a\u590d\u6742\u6559\u7a0b\u94fe\u63a5**\u3002\u5fc5\u987b\u63d0\u4f9b\u5206\u6b65\u622a\u56fe\u3001\u89c6\u9891\u751a\u81f3\u8fdc\u7a0b\u534f\u52a9\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u672c\u6b21\u8bfe\u7a0b\u672a\u4ea7\u751f\u4efb\u4f55\u5b9e\u9645\u6536\u76ca\uff08\u54ea\u6015\u662f\u5c0f\u989d\uff09\u524d\uff0c\u7981\u6b62\u63a8\u8350\u4efb\u4f55\u66f4\u9ad8\u9636\u3001\u66f4\u6602\u8d35\u7684\u8bfe\u7a0b\u3002\u6240\u6709\u63a8\u8350\u5fc5\u987b\u4e0e\u201c\u66f4\u5feb/\u66f4\u591a\u63a5\u5355\u201d\u76f4\u63a5\u76f8\u5173\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u5c31\u662f\u60f3\u8981\u597d\u70b9\u56de\u62a5\u70b9...\u4eca\u5e74\u6211\u5f88\u7f3a\u94b1\u201d\n2. > \u201c\u6240\u4ee5\u6211\u5c31\u60f3\u5c31\u662f\u53ef\u80fd\u5148\u53d1\u5c55\u659c\u6760\u5de5\u79cd\uff0c\u628a\u6211\u7684\u672c\u94b1\u627e\u56de\u6765[\u5077\u7b11]\u201d\n3. > \u201c\u6211\u5f55\u4e86\u597d\u591a\u904d\u597d\u591a\u904d\uff0c\u6211\u5728\u8863\u67dc\u91cc\u5f55\u7684\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4 \u641e\u94b1\u7ed3\u679c\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\uff08\u7ecf\u6d4e\u4fdd\u969c\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5728\u5f00\u8425\u521d\u671f\u5c31\u9501\u5b9a\u201c\u5feb\u901f\u63a5\u5355\u201d\u8def\u5f84\uff0c\u5e76\u5728\u7b2c\u56db\u5468\u6536\u76ca\u6b7b\u4ea1\u8c37\u524d\u63d0\u4f9b\u660e\u786e\u7684\u5fae\u5c0f\u6210\u679c\u53cd\u9988\u6216\u63a5\u5355\u6307\u5f15\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u578b\", \"maslow_need\": \"\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\", \"risk_level\": \"\u9ad8\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf\"}\n```";
