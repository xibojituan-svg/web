        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 546000940 (\u6635\u79f0\uff1a\u6d45\u6cab) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e-\u661f\u661f(\u5f20\u536b\u5a1c) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u77ed\u89c6\u9891\u521b\u4f5c\u8425 (3.5\u4e2a\u6708\uff0c3980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3** (\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u6211\u4eec\u5bb6\u8d1f\u503a\u6709\u70b9\u5389\u5bb3\uff0c\uff0c\u623f\u8d37\uff0c\u8f66\u8d37\uff0c\u8fd8\u6709\u5b69\u5b50\u201d) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u9700\u7167\u987e9\u4e2a\u6708\u5927\u7684\u5a74\u513f\uff0c\u65f6\u95f4\u88ab\u4e25\u91cd\u5207\u5272\uff0c\u4f9d\u8d56\u5b69\u5b50\u7761\u89c9\u540e\u7684\u788e\u7247\u65f6\u95f4) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u9690\u7792\u5077\u62a5** (\u7528\u6237\u8868\u793a\u9700\u8981\u548c\u5bb6\u4eba\u5546\u91cf\uff0c\u4f46\u6700\u7ec8\u5728\u672a\u660e\u786e\u8868\u793a\u5bb6\u4eba\u652f\u6301\u7684\u60c5\u51b5\u4e0b\u5b8c\u6210\u652f\u4ed8) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** (\u7528\u6237\u591a\u6b21\u4e3b\u52a8\u66b4\u9732\u6838\u5fc3\u56f0\u5883\uff0c\u4fe1\u606f\u53ef\u4fe1\u5ea6\u9ad8) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u751f\u5b58\u4fdd\u969c\u800c\u6765\u3002\u7528\u6237\u5b66\u4e60AI\u7684\u52a8\u673a\u660e\u786e\u6307\u5411\u201c\u7ecf\u6d4e\u56f0\u96be\u201d\u3001\u201c\u60f3\u6323\u94b1\u201d\u4ee5\u7f13\u89e3\u5bb6\u5ead\u8d1f\u503a\u538b\u529b\uff0c\u800c\u975e\u8ffd\u6c42\u6781\u901f\u53d8\u73b0\u3002\u5979\u5173\u6ce8AI\u7684\u672a\u6765\u8d8b\u52bf(\u201c\u4ee5\u540e\u5e94\u8be5\u662fAI\u7684\u65f6\u4ee3\u4e86\u201d)\uff0c\u5e76\u613f\u610f\u6295\u5165\u5b66\u4e60\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u7cfb\u7edf\u8bfe\u591a\u5c11\u94b1\u554a\uff1f\u6211\u4eec\u73b0\u5728\u7ecf\u6d4e\u975e\u5e38\u56f0\u96be\u201d > \u201c\u6211\u4e5f\u60f3\u6323\u94b1\u554a\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u6781\u4f4e** \u2014 \u7528\u6237\u660e\u786e\u8868\u793a\u5bb6\u5ead\u8d1f\u503a\u4e25\u91cd\uff08\u623f\u8d37\u3001\u8f66\u8d37\u3001\u5b69\u5b50\uff09\uff0c\u7ecf\u6d4e\u975e\u5e38\u56f0\u96be\uff0c\u5b66\u8d39\u652f\u4ed8\u80fd\u529b\u5b58\u5728\u5de8\u5927\u9690\u60a3\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e** \u2014 \u9700\u5168\u804c\u7167\u987e9\u4e2a\u6708\u5927\u7684\u5a74\u513f\uff0c\u5b66\u4e60\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\u4e14\u4e0d\u7a33\u5b9a\uff08\u201c\u521a\u7761\u9192\u201d\u3001\u201c\u6709\u7684\u76f4\u64ad\u6ca1\u6709\u542c\u201d\uff09\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4f4e** \u2014 \u7528\u6237\u8868\u793a\u9700\u8981\u548c\u5bb6\u4eba\u5546\u91cf\u5b66\u8d39\u95ee\u9898\uff0c\u6697\u793a\u5bb6\u5ead\u8d22\u52a1\u51b3\u7b56\u53ef\u80fd\u4e0d\u72ec\u7acb\uff0c\u5b58\u5728\u6f5c\u5728\u7684\u5bb6\u5ead\u963b\u529b\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u7528\u6237\u53cd\u590d\u5f3a\u8c03\u7ecf\u6d4e\u56f0\u96be\uff0c\u900f\u9732\u51fa\u5de8\u5927\u7684\u751f\u6d3b\u538b\u529b\u548c\u65e0\u529b\u611f(\u201c\u5c31\u6015\u94b1\u591a\u4e86\u6211\u4eec\u8d1f\u62c5\u4e0d\u8d77\u554a[\u6342\u8138]\u201d)\u3002\u62a5\u540d\u540e\u7559\u8a00\u201c\u5e0c\u671b\u4e0d\u8981\u8ba9\u6211\u5931\u671b\u201d\uff0c\u663e\u793a\u51fa\u5bf9\u8bfe\u7a0b\u7ed3\u679c\u7684\u9ad8\u671f\u5f85\u548c\u6f5c\u5728\u7684\u8106\u5f31\u5fc3\u6001\uff0c\u4e00\u65e6\u5b66\u4e60\u9047\u963b\u6216\u77ed\u671f\u672a\u89c1\u6536\u76ca\uff0c\u6781\u6613\u4ea7\u751f\u5de8\u5927\u5fc3\u7406\u843d\u5dee\u548c\u653e\u5f03\u5ff5\u5934\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5e0c\u671b\u4e0d\u8981\u8ba9\u6211\u5931\u671b\u201d > \u201c\u6211\u4eec\u5bb6\u8d1f\u503a\u6709\u70b9\u5389\u5bb3\uff0c\uff0c\u623f\u8d37\uff0c\u8f66\u8d37\uff0c\u8fd8\u6709\u5b69\u5b50\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u56e0\u5bb6\u5ead\u8d1f\u503a\u548c\u80b2\u513f\u538b\u529b\u5bfc\u81f4\u7684\u5f3a\u70c8\u7ecf\u6d4e\u4e0d\u5b89\u5168\u611f\u4e0e\u81ea\u6211\u4ef7\u503c\u7126\u8651**\u3002\u5979\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u6280\u80fd\u83b7\u5f97\u6536\u5165\uff0c\u4ee5\u6446\u8131\u201c\u624b\u5fc3\u5411\u4e0a\u201d\u7684\u7a98\u5883\uff0c\u5bfb\u6c42\u5bb6\u5ead\u7ecf\u6d4e\u548c\u4e2a\u4eba\u5c0a\u4e25\u7684\u57fa\u672c\u4fdd\u969c\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u9632\u62a4\u76fe\u5f0f\u7684\u5b89\u5168\u611f\u4e0e\u201c\u88ab\u770b\u89c1\u201d\u7684\u80af\u5b9a**\u3002\u5979\u9700\u8981\u88ab\u7406\u89e3\u7ecf\u6d4e\u56f0\u5883\uff0c\u9700\u8981\u88ab\u6301\u7eed\u9f13\u52b1\u201c\u4f60\u80fd\u884c\u201d\uff0c\u66f4\u9700\u8981\u4e00\u4e2a\u6e05\u6670\u3001\u4f4e\u98ce\u9669\u7684\u8def\u5f84\u6765\u8bc1\u660e\u81ea\u5df1\u7684\u6295\u5165\u662f\u5b89\u5168\u7684\u3001\u6709\u5e0c\u671b\u7684\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udd34D \u7c7b** (\u89e6\u53d1\u5bb6\u5ead\u963b\u529b\u4e0e\u501f\u6b3e\u9690\u60a3\u53cc\u91cd\u7ea2\u7ebf) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u53e0\u52a0 **D\u7c7b\u9ad8\u5371\u8d22\u52a1\u80cc\u666f**) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\ud83d\udd34**\u5df2\u89e6\u53d1 D \u7c7b\u7194\u65ad\u7ea2\u7ebf\uff01**\n- **\u89e6\u53d1\u56e0\u7531**\uff1a1. **\u5bb6\u5ead\u8d22\u52a1\u5371\u673a**\uff1a\u7528\u6237\u660e\u786e\u8868\u793a\u5bb6\u5ead\u8d1f\u503a\u4e25\u91cd\uff08\u623f\u8d37\u3001\u8f66\u8d37\uff09\uff0c\u5b66\u8d39\u652f\u4ed8\u5df2\u89e6\u53ca\u201c\u5976\u7c89\u94b1\u201d\u8b66\u6212\u7ebf\u30022. **\u5bb6\u5ead\u51b3\u7b56\u6743\u7f3a\u5931**\uff1a\u7528\u6237\u62a5\u540d\u524d\u9700\u4e0e\u5bb6\u4eba\u5546\u91cf\uff0c\u4f46\u6700\u7ec8\u652f\u4ed8\u884c\u4e3a\u7591\u4f3c\u5728\u672a\u83b7\u5f97\u660e\u786e\u652f\u6301\u4e0b\u7684\u201c\u5077\u62a5\u201d\uff0c\u5bb6\u5ead\u5e72\u9884\u98ce\u9669\u6781\u9ad8\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| **\u5bb6\u5ead\u5e72\u9884\u578b** | **\u6781\u9ad8** | \u5bb6\u4eba\u53d1\u73b0\u5176\u52a8\u7528\u5bb6\u5ead\u7d27\u5f20\u8d44\u91d1\u62a5\u540d\u8bfe\u7a0b\uff0c\u5f15\u53d1\u6fc0\u70c8\u77db\u76fe\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | \u56e0\u7167\u987e\u5a74\u513f\u5bfc\u81f4\u65f6\u95f4\u7cbe\u529b\u4e25\u91cd\u4e0d\u8db3\uff0c\u65e0\u6cd5\u8ddf\u4e0a\u8bfe\u7a0b\u8282\u594f\u548c\u4f5c\u4e1a\uff0c\u4ea7\u751f\u81ea\u8d23\u548c\u653e\u5f03\u60c5\u7eea\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u9ad8** | \u5b66\u4e60\u521d\u671f\u9047\u5230\u8f6f\u4ef6\u5b89\u88c5\u3001\u64cd\u4f5c\u7b49\u57fa\u7840\u56f0\u96be\uff0c\u6216\u7b2c\u4e00\u4efd\u4f5c\u4e1a\u672a\u83b7\u597d\u8bc4\uff0c\u81ea\u5c0a\u5fc3\u53d7\u632b\uff0c\u8ba4\u4e3a\u201c\u81ea\u5df1\u592a\u7b28\u201d\u3001\u201c\u8bfe\u7a0b\u6ca1\u7528\u201d\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u4e2d** | \u5bf9\u201c\u8fb9\u5b66\u8fb9\u8d5a\u201d\u62b1\u6709\u4e0d\u5207\u5b9e\u9645\u7684\u77ed\u671f\u671f\u671b\uff0c\u82e5\u5f00\u8bfe1-2\u5468\u5185\u672a\u611f\u53d7\u5230\u201c\u8d5a\u94b1\u201d\u5e0c\u671b\uff0c\u53ef\u80fd\u8fc5\u901f\u5931\u671b\u5e76\u8981\u6c42\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c\u4e00\u5468\u81f3\u7b2c\u4e8c\u5468**\u3002\u6b64\u65f6\u5c06\u9762\u4e34\u9996\u6b21\u5b9e\u64cd\u4f5c\u4e1a\u538b\u529b\u3001\u65f6\u95f4\u7ba1\u7406\u6311\u6218\uff0c\u82e5\u540c\u65f6\u906d\u9047\u5bb6\u4eba\u8d28\u7591\uff0c\u9000\u8d39\u98ce\u9669\u5c06\u96c6\u4e2d\u7206\u53d1\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6d45\u6cab\uff0c\u73ed\u73ed\u770b\u5230\u4f60\u7684\u62a5\u540d\u4fe1\u606f\u4e86\uff0c\u7279\u522b\u7406\u89e3\u4f60\u4e00\u8fb9\u5e26\u5a03\u4e00\u8fb9\u60f3\u4e3a\u5bb6\u91cc\u5206\u62c5\u7684\u5fc3\u60c5\uff0c\u771f\u7684\u592a\u4e86\u4e0d\u8d77\u4e86\u3002\u54b1\u4eec\u8fd9\u4e2a\u73ed\u5f88\u591a\u90fd\u662f\u5b9d\u5988\uff0c\u65f6\u95f4\u90fd\u9760\u2018\u6324\u2019\uff0c\u6240\u4ee5\u522b\u62c5\u5fc3\u8ddf\u4e0d\u4e0a\u3002\u54b1\u4eec\u7b2c\u4e00\u5468\u4e0d\u8ffd\u6c42\u901f\u5ea6\uff0c\u53ea\u6c42\u2018\u5b8c\u6210\u2019\uff0c\u54ea\u6015\u5b9d\u5b9d\u95f9\u7684\u65f6\u5019\u53ea\u542c5\u5206\u949f\uff0c\u90fd\u662f\u80dc\u5229\u3002\u6709\u4efb\u4f55\u56f0\u96be\uff0c\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u60f3\u529e\u6cd5\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf**\u3011\u3002\u9996\u8981\u76ee\u6807\u662f\u5e2e\u52a9\u5979\u5efa\u7acb\u5b66\u4e60\u4fe1\u5fc3\u548c\u575a\u6301\u7684\u4e60\u60ef\uff0c\u800c\u975e\u65bd\u52a0\u53d8\u73b0\u538b\u529b\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u5f3a\u5236\u6302\u8f7d\u3010**\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305**\u3011\u3002\u5305\u542b\uff1a\u50bb\u74dc\u5f0f\u4efb\u52a1\u62c6\u89e3\u3001\u6bcf\u65e5\u5fae\u9f13\u52b1\u6253\u5361\u3001\u5141\u8bb8\u63d0\u4ea4\u201c\u6700\u4f4e\u5b8c\u6210\u5ea6\u201d\u4f5c\u4e1a\uff08\u5982\u4e00\u6bb5\u8bed\u97f3\u5206\u4eab\uff09\u3001\u63d0\u4f9b\u6781\u5ea6\u7b80\u5316\u7684\u8f6f\u4ef6\u5b89\u88c5\u6307\u5357\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u5979\u65bd\u52a0\u4efb\u4f55\u4f5c\u4e1a\u96be\u5ea6\u548c\u8fdb\u5ea6\u538b\u529b**\uff0c\u4e25\u7981\u5728\u7fa4\u5185\u516c\u5f00\u8868\u626c\u201c\u5b66\u9738\u201d\u6216\u5c55\u793a\u9ad8\u6536\u76ca\u6848\u4f8b\u523a\u6fc0\u5979\u3002\n    2. **\u7edd\u4e0d\u5728\u524d\u4e24\u5468\u4e3b\u52a8\u63d0\u53ca\u201c\u63a5\u5355\u201d\u3001\u201c\u53d8\u73b0\u201d**\uff0c\u907f\u514d\u5f15\u53d1\u5176\u7126\u8651\u548c\u6536\u76ca\u843d\u5dee\u3002\n    3. **\u4e25\u7981\u4efb\u4f55\u5f62\u5f0f\u7684\u5347\u5355\u6216\u4e8c\u6b21\u9500\u552e**\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5f53\u524d\u9636\u6bb5\u4efb\u4f55\u989d\u5916\u4ed8\u8d39\u884c\u4e3a\u90fd\u4f1a\u5c06\u5176\u63a8\u5411\u8d22\u52a1\u5d29\u6e83\u8fb9\u7f18\uff0c\u89e6\u53d1\u5bb6\u5ead\u77db\u76fe\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u7cfb\u7edf\u8bfe\u591a\u5c11\u94b1\u554a\uff1f\u6211\u4eec\u73b0\u5728\u7ecf\u6d4e\u975e\u5e38\u56f0\u96be\u201d\n2. > \u201c\u5c31\u6015\u94b1\u591a\u4e86\u6211\u4eec\u8d1f\u62c5\u4e0d\u8d77\u554a[\u6342\u8138]\u201d\n3. > \u201c\u6211\u4eec\u5bb6\u8d1f\u503a\u6709\u70b9\u5389\u5bb3\uff0c\uff0c\u623f\u8d37\uff0c\u8f66\u8d37\uff0c\u8fd8\u6709\u5b69\u5b50\u201d\n4. > \u201c\u5e0c\u671b\u4e0d\u8981\u8ba9\u6211\u5931\u671b\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6\u60c5\u7eea\u5de8\u5a74\u578b\u53e0\u52a0D\u7c7b\u8d22\u52a1\u9ad8\u5371\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\uff08\u7ecf\u6d4e\u4e0e\u5c0a\u4e25\u4fdd\u969c\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u542f\u52a8\u6781\u81f4\u7597\u6108\u6a21\u5f0f\uff0c\u5265\u79bb\u4e00\u5207\u5b66\u4e60\u538b\u529b\uff0c\u4f18\u5148\u5efa\u7acb\u60c5\u611f\u4fe1\u4efb\u4e0e\u5b8c\u6210\u4e60\u60ef\uff0c\u4e25\u9632\u5bb6\u5ead\u77db\u76fe\u7206\u53d1\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"maslow_need\": \"\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
