    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u4e0e\u98ce\u63a7\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49)**\n    *   **\u8868\u5c42\u52a8\u673a**: \u5bf9AI\u77ed\u89c6\u9891\u53d8\u73b0\uff08\u5c24\u5176\u662f\u52a8\u6f2b\u77ed\u5267\u3001\u63a5\u5355\uff09\u6709\u660e\u786e\u5174\u8da3\uff0c\u5e0c\u671b\u83b7\u5f97\u7a33\u5b9a\u63a5\u5355\u6e20\u9053\u5e76\u8003\u8651\u5168\u804c\u3002\n    *   **\u6df1\u5c42\u52a8\u673a**: \u5bfb\u6c42\u804c\u4e1a\u8f6c\u578b\u6216\u6536\u5165\u4fdd\u969c\uff0c\u5bf9\u201c\u7a33\u5b9a\u63a5\u5355\u91cf\u201d\u6709\u5f3a\u70c8\u8bc9\u6c42\u3002\u5b58\u5728\u5bf9\u6280\u672f\u5feb\u901f\u8fed\u4ee3\u7684\u7126\u8651\uff08\u201c\u4e07\u4e00\u521a\u5b66\u4f1a\uff0c\u5c31\u88ab\u8fed\u4ee3\u4e86\u201d\uff09\uff0c\u8868\u660e\u5176\u52a8\u673a\u5305\u542b\u5bf9\u672a\u6765\u7684\u4e0d\u786e\u5b9a\u6027\u548c\u98ce\u9669\u89c4\u907f\u3002\n    *   **\u7eaf\u5ea6\u8bc4\u4f30**: \u5b9e\u7528\u4e3b\u4e49\u9a71\u52a8\uff0c\u76ee\u6807\u660e\u786e\uff08\u53d8\u73b0\u3001\u5168\u804c\uff09\uff0c\u4f46**\u5bf9\u884c\u4e1a\u8ba4\u77e5\u8f83\u6d45\uff0c\u53d8\u73b0\u9884\u671f\u53ef\u80fd\u504f\u9ad8**\uff0c\u5b58\u5728\u201c\u6280\u80fd=\u7a33\u5b9a\u6536\u5165\u201d\u7684\u7ebf\u6027\u601d\u7ef4\u3002\n\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4fe1\u606f\u4e0d\u8db3)**\n    *   **\u7ecf\u6d4e\u8d44\u6e90**: \u672a\u63d0\u53ca\u3002\u6709\u80fd\u529b\u652f\u4ed8\u8bfe\u7a0b\u8d39\u7528\uff0c\u4f46\u4e3b\u52a8\u5bfb\u6c42\u4f18\u60e0\uff08\u201c\u8fd8\u80fd\u4f18\u60e0\u4e0d\u201d\uff09\uff0c\u5e76\u63d0\u53ca\u201c\u62c9\u4e86\u4e2a\u4eba\u201d\u4ee5\u4e89\u53d6\u66f4\u591a\u6743\u76ca\u3002\n    *   **\u65f6\u95f4\u8d44\u6e90**: \u8868\u793a\u201c\u60f3\u5168\u804c\u505a\u201d\uff0c\u6697\u793a\u6709\u53ef\u6295\u5165\u7684\u6574\u5757\u65f6\u95f4\u3002\u4f46\u66fe\u63d0\u53ca\u201c\u665a\u4e0a\u4e03\u70b9\u8981\u5f00\u4f1a\u201d\uff0c\u8868\u660e\u53ef\u80fd\u6709\u5176\u4ed6\u5de5\u4f5c\u6216\u4e8b\u52a1\u3002\n    *   **\u6280\u80fd\u8d44\u6e90**: \u5df2\u5b8c\u6210AI\u751f\u56fe/\u89c6\u9891\u4f5c\u4e1a\u5e76\u83b7\u5f97\u6b63\u9762\u53cd\u9988\uff08\u201c\u5b66\u4e60\u80fd\u529b\u3001\u5b8c\u6210\u5ea6\u8fd8\u6709\u5b9e\u64cd\u80fd\u529b\u975e\u5e38\u68d2\u201d\uff09\uff0c\u5177\u5907\u521d\u6b65\u52a8\u624b\u80fd\u529b\u548c\u5b66\u4e60\u610f\u613f\u3002\n    *   **\u8bc4\u4f30**: **\u7ecf\u6d4e\u4e0e\u804c\u4e1a\u80cc\u666f\u4fe1\u606f\u7f3a\u5931**\uff0c\u65e0\u6cd5\u5224\u65ad\u5176\u6297\u98ce\u9669\u80fd\u529b\u53ca\u5168\u804c\u8f6c\u578b\u7684\u53ef\u884c\u6027\u3002\u793e\u4ea4\u8d44\u6e90\u5c1a\u53ef\uff08\u80fd\u62c9\u4eba\u4e00\u8d77\u5b66\u4e60\uff09\u3002\n\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u7b49\u504f\u4f4e)**\n    *   **\u4e3b\u52a8\u6027**: \u4e3b\u52a8\u63d0\u95ee\uff08\u8fed\u4ee3\u7126\u8651\u3001\u63a5\u5355\u6e20\u9053\uff09\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u9884\u7ea6\u8bfe\u7a0b\uff0c\u884c\u52a8\u529b\u5c1a\u53ef\u3002\n    *   **\u6297\u632b\u6027**: \u5bf9\u6280\u672f\u8fed\u4ee3\u8868\u73b0\u51fa\u660e\u663e\u62c5\u5fe7\uff0c\u9700\u8981\u9500\u552e\u8fdb\u884c\u5b89\u629a\u548c\u89e3\u91ca\u3002**\u5bf9\u4e0d\u786e\u5b9a\u6027\u7684\u5bb9\u5fcd\u5ea6\u8f83\u4f4e**\uff0c\u9700\u8981\u660e\u786e\u7684\u8def\u5f84\u548c\u4fdd\u969c\uff08\u201c\u7a33\u5b9a\u7684\u63a5\u5355\u91cf\u201d\uff09\u3002\n    *   **\u4f9d\u8d56\u6027**: \u5bf9\u201c\u5e73\u53f0\u8d44\u6e90\u201d\u3001\u201c\u63a5\u5355\u6e20\u9053\u201d\u8868\u73b0\u51fa\u8f83\u9ad8\u4f9d\u8d56\u548c\u671f\u5f85\u3002\u51b3\u7b56\u524d\u9700\u8981\u201c\u6c9f\u901a\u4e00\u4e0b\uff0c\u6211\u60f3\u4e86\u89e3\u8003\u8651\u4e00\u4e0b\u201d\uff0c\u5c5e\u4e8e\u5ba1\u614e\u578b\u3002\n    *   **\u8bc4\u4f30**: **\u5b66\u4e60\u610f\u613f\u5f3a\u4f46\u98ce\u9669\u538c\u6076\u660e\u663e**\uff0c\u5c5e\u4e8e\u201c\u8c28\u614e\u7684\u63a2\u7d22\u8005\u201d\u3002\u9700\u8981\u6301\u7eed\u7684\u6b63\u53cd\u9988\u548c\u660e\u786e\u7684\u8def\u5f84\u6307\u5f15\uff0c\u5426\u5219\u6613\u56e0\u8fdb\u5c55\u4e0d\u987a\u6216\u9884\u671f\u843d\u5dee\u800c\u4ea7\u751f\u52a8\u6447\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: \u5df2\u652f\u4ed8\u3002\u7528\u6237\u4e3b\u52a8\u8be2\u95ee\u4f18\u60e0\u5e76\u5b8c\u6210\u652f\u4ed8\u6d41\u7a0b\uff0c\u8fdb\u5165\u73ed\u7ea7\u7fa4\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u6216\u914d\u5076\u610f\u89c1\uff0c\u51b3\u7b56\u4f3c\u4e4e\u7531\u7528\u6237\u72ec\u7acb\u505a\u51fa\u3002\u9700\u540e\u7eed\u7531\u73ed\u4e3b\u4efb\u8865\u5145\u6838\u67e5\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u7eaf\u5ea6\u5224\u65ad (B\u7c7b: \u529f\u5229\u9a71\u52a8\u578b)**: \u6838\u5fc3\u9a71\u52a8\u529b\u4e3a\u660e\u786e\u7684\u804c\u4e1a\u53d8\u73b0\u548c\u5168\u804c\u8f6c\u578b\uff0c\u5c5e\u4e8e\u5178\u578b\u7684\u529f\u5229\u9a71\u52a8\u3002\u4f46\u63ba\u6742\u4e86\u5bf9\u884c\u4e1a\u4e0d\u786e\u5b9a\u6027\u7684\u7126\u8651\u3002\n*   **\u6b65\u9aa42 - \u8d44\u6e90\u5e95\u5ea7\u5224\u65ad (\u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u5f52C\u7c7b: \u8d44\u6e90\u6a21\u7cca\u578b)**: \u65f6\u95f4\u610f\u613f\u5145\u8db3\uff0c\u7ecf\u6d4e\u80fd\u529b\u3001\u73b0\u6709\u804c\u4e1a\u72b6\u6001\u4e0d\u660e\uff0c\u6280\u80fd\u6709\u57fa\u7840\u3002**\u5173\u952e\u98ce\u9669\u70b9\u5728\u4e8e\u201c\u5168\u804c\u201d\u610f\u613f\u4e0e\u672a\u77e5\u8d44\u6e90\u4e4b\u95f4\u7684\u6f5c\u5728\u77db\u76fe**\u3002\n*   **\u6b65\u9aa43 - \u5fc3\u7406\u5f39\u6027\u5224\u65ad (C\u7c7b: \u4f4e\u5f39\u6027\u4f9d\u8d56\u8005)**: \u5b66\u4e60\u884c\u52a8\u5c1a\u53ef\uff0c\u4f46\u5bf9\u5e73\u53f0\u3001\u6e20\u9053\u3001\u6280\u672f\u7a33\u5b9a\u6027\u6709\u9ad8\u4f9d\u8d56\uff0c\u5bf9\u98ce\u9669\u654f\u611f\uff0c\u5fc3\u7406\u5f39\u6027\u4e0d\u8db3\u3002\n*   **\u7efc\u5408\u5224\u5b9a**: **B-C\u6df7\u5408\u578b (\u529f\u5229\u9a71\u52a8\u4f46\u8d44\u6e90\u6a21\u7cca\u4e14\u5fc3\u7406\u5f39\u6027\u4e0d\u8db3)**\u3002\u6838\u5fc3\u6807\u7b7e\uff1a**\u201c\u9ad8\u9884\u671f\u3001\u9ad8\u4f9d\u8d56\u7684\u8f6c\u578b\u63a2\u7d22\u8005\u201d**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b: T5 \u529f\u5229\u53d8\u73b0\u8005**\n    *   **\u543b\u5408\u70b9**: \u6838\u5fc3\u76ee\u6807\u660e\u786e\u6307\u5411\u201c\u53d8\u73b0\u201d\u548c\u201c\u5168\u804c\u201d\uff0c\u5bf9\u201c\u63a5\u5355\u6e20\u9053\u201d\u3001\u201c\u5546\u5355\u4ef7\u683c\u201d\u7b49\u5546\u4e1a\u4fe1\u606f\u9ad8\u5ea6\u5173\u6ce8\u3002\u9500\u552e\u8bdd\u672f\u4e5f\u91cd\u70b9\u56f4\u7ed5\u201c\u5546\u5355\u201d\u3001\u201c\u6536\u76ca\u201d\u5c55\u5f00\uff0c\u4e0e\u7528\u6237\u9700\u6c42\u540c\u9891\u3002\n    *   **\u504f\u5dee\u70b9**: \u76f8\u6bd4\u5178\u578b\u7684T5\uff0c\u8be5\u7528\u6237\u8868\u73b0\u51fa\u66f4\u5f3a\u7684**\u6280\u672f\u7126\u8651**\u548c\u5bf9**\u8def\u5f84\u786e\u5b9a\u6027\u7684\u6e34\u6c42**\uff0c\u5fc3\u7406\u5c42\u9762\u66f4\u63a5\u8fd1T6\uff08\u9ad8\u7126\u8651\u4ece\u4f17\u8005\uff09\u7684\u90e8\u5206\u7279\u5f81\uff0c\u4f46\u6838\u5fc3\u9a71\u52a8\u4ecd\u662f\u529f\u5229\u800c\u975e\u7126\u8651\u3002\n    *   **\u7ed3\u8bba**: **\u4e3b\u8981\u539f\u578b\u4e3aT5\uff0c\u4f46\u5e26\u6709T6\u7684\u7126\u8651\u7279\u5f81**\u3002\u53ef\u6807\u8bb0\u4e3a **T5+ (\u7126\u8651\u578b\u529f\u5229\u53d8\u73b0\u8005)**\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4e2d\u9ad8\u98ce\u9669)\n*   **\u6839\u56e01 - \u9884\u671f\u7ba1\u7406\u5931\u8861 (\u9ad8\u98ce\u9669)**: \u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u5546\u5355100-300/\u5206\u949f\u201d\u3001\u201c\u5355\u5b50\u8ffd\u7740\u4f60\u8dd1\u201d\u3001\u201c\u6536\u76ca\u53ef\u89c2\u201d\u3001\u201c\u5168\u804c\u53d1\u5c55\u201d\uff0c\u6781\u5927\u62ac\u9ad8\u4e86\u7528\u6237\u9884\u671f\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u201c\u5982\u679c\u6536\u76ca\u53ef\u4ee5\uff0c\u6211\u5f53\u7136\u60f3\u5168\u804c\u505a\u201d\uff0c**\u5b58\u5728\u663e\u8457\u7684\u201c\u6295\u5165\u5373\u9ad8\u56de\u62a5\u201d\u5e7b\u60f3**\u3002\n*   **\u6839\u56e02 - \u6548\u679c\u5f52\u56e0\u5916\u5316 (\u4e2d\u98ce\u9669)**: \u7528\u6237\u5c06\u6210\u529f\u5173\u952e\u5f52\u4e8e\u201c\u7a33\u5b9a\u7684\u63a5\u5355\u91cf\u201d\u548c\u201c\u5e73\u53f0\u8d44\u6e90\u201d\uff0c\u5bf9\u81ea\u8eab\u6301\u7eed\u5b66\u4e60\u3001\u521b\u610f\u80fd\u529b\u548c\u5e02\u573a\u7ade\u4e89\u7684\u8ba4\u77e5\u4e0d\u8db3\u3002**\u4e00\u65e6\u63a5\u5355\u4e0d\u987a\uff0c\u6781\u6613\u5f52\u548e\u4e8e\u5e73\u53f0\u8d44\u6e90\u4e0d\u8db3**\u3002\n*   **\u6839\u56e03 - \u51b3\u7b56\u72ec\u7acb\u6027\u5b58\u7591 (\u4fe1\u606f\u4e0d\u8db3)**: \u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\uff0c\u9700\u6838\u67e5\u3002**\u82e5\u5bb6\u5ead\u4e0d\u77e5\u60c5\u6216\u53cd\u5bf9\uff0c\u5c06\u6210\u4e3a\u91cd\u5927\u9000\u8d39\u9690\u60a3**\u3002\n*   **\u6839\u56e04 - \u9002\u5e94\u6027\u98ce\u9669 (\u4e2d\u98ce\u9669)**: \u7528\u6237\u5bf9\u6280\u672f\u8fed\u4ee3\u6709\u7126\u8651\uff0c\u8868\u660e\u5176\u9002\u5e94\u5feb\u901f\u53d8\u5316\u73af\u5883\u7684\u80fd\u529b\u5b58\u7591\u3002\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u9047\u5230\u5de5\u5177\u66f4\u65b0\u3001\u5de5\u4f5c\u6d41\u8c03\u6574\u65f6\u53ef\u80fd\u4ea7\u751f\u632b\u8d25\u611f\u3002\n*   **\u6839\u56e05 - \u7ecf\u6d4e\u538b\u529b/\u51b2\u52a8\u6d88\u8d39 (\u4fe1\u606f\u4e0d\u8db3)**: \u4e3b\u52a8\u8981\u4f18\u60e0\uff0c\u4f46\u652f\u4ed8\u884c\u4e3a\u679c\u65ad\u3002\u65e0\u6cd5\u5224\u65ad\u8bfe\u7a0b\u8d39\u7528\u662f\u5426\u5bf9\u5176\u6784\u6210\u7ecf\u6d4e\u538b\u529b\u3002\n*   **\u6839\u56e06 - \u793e\u4ea4\u4ece\u4f17 (\u4f4e\u98ce\u9669)**: \u867d\u62c9\u4eba\u4e00\u8d77\u5b66\uff0c\u4f46\u81ea\u8eab\u6709\u660e\u786e\u63a2\u7d22\u52a8\u673a\uff0c\u975e\u7eaf\u7cb9\u4ece\u4f17\u3002\n*   **\u6839\u56e07 - \u4ea7\u54c1\u9519\u914d (\u4e2d\u98ce\u9669)**: \u7528\u6237\u76ee\u6807\u662f\u201c\u5168\u804c\u201d\u548c\u201c\u7a33\u5b9a\u63a5\u5355\u201d\uff0c\u4f46\u4ea7\u54c1\u672c\u8d28\u662f\u6280\u80fd\u6559\u5b66\u4e0e\u8d44\u6e90\u5bf9\u63a5\uff0c\u65e0\u6cd5\u4fdd\u8bc1\u201c\u7a33\u5b9a\u6536\u5165\u201d\u3002**\u201c\u5168\u804c\u201d\u8bc9\u6c42\u4e0e\u4ea7\u54c1\u80fd\u63d0\u4f9b\u7684\u201c\u7075\u6d3b\u517c\u804c\u201d\u8def\u5f84\u5b58\u5728\u6f5c\u5728\u9519\u914d**\u3002\n*   **\u7efc\u5408\u98ce\u9669\u7b49\u7ea7: \u4e2d\u9ad8**\u3002\u6838\u5fc3\u98ce\u9669\u96c6\u4e2d\u4e8e**\u88ab\u62ac\u9ad8\u7684\u53d8\u73b0\u9884\u671f**\u4e0e**\u73b0\u5b9e\u5b66\u4e60\u66f2\u7ebf\u3001\u5e02\u573a\u7ade\u4e89\u4e4b\u95f4\u7684\u5de8\u5927\u843d\u5dee**\uff0c\u4ee5\u53ca**\u5bb6\u5ead\u51b3\u7b56\u6743\u4e0d\u660e\u786e**\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5408\u89c4\u70b9**:\n    *   \u9500\u552e\u5f3a\u8c03\u4e86\u5b66\u4e60\u3001\u7ec3\u4e60\u548c\u6280\u672f\u7684\u91cd\u8981\u6027\uff08\u201c\u524d\u63d0\u4f60\u7684\u6280\u672f\u5f97\u5b66\u597d\u201d\uff09\u3002\n    *   \u63d0\u53ca\u4e86\u4ece\u7b80\u5355\u5546\u5355\u505a\u8d77\uff0c\u9010\u6b65\u63d0\u5347\u3002\n*   **\u98ce\u9669\u70b9**:\n    *   **\u8fc7\u5ea6\u627f\u8bfa\u98ce\u9669**: \u201c\u5355\u5b50\u662f\u771f\u4e0d\u7f3a\u7684\uff0c\u5b83\u662f\u57fa\u672c\u4e0a\u6765\u8bf4\u662f\u5355\u5b50\u8ffd\u7740\u4f60\u8dd1\u201d\u3001\u201c\u6536\u76ca\u53ef\u89c2\u201d\u3001\u201c\u5b8c\u5168\u53ef\u4ee5\uff08\u4f5c\u4e3a\u4e3b\u4e1a\uff09\u201d\uff0c\u6b64\u7c7b\u63cf\u8ff0**\u6a21\u7cca\u4e86\u5e73\u53f0\u8d44\u6e90\u5bf9\u63a5\u4e0e\u4e2a\u4eba\u6536\u5165\u4fdd\u969c\u7684\u8fb9\u754c**\uff0c\u6613\u8ba9\u7528\u6237\u4ea7\u751f\u201c\u5305\u63a5\u5355\u3001\u5305\u8d5a\u94b1\u201d\u7684\u8bef\u89e3\u3002\n    *   **\u7a00\u7f3a\u6027\u8425\u9020**: \u201c\u672a\u6765\u4f1a\u5f88\u62e5\u6324\uff0c\u4f46\u662f\u5f53\u4e0b\u2026\u86ee\u65e9\u671f\u7684\u201d\uff0c\u5229\u7528\u7a97\u53e3\u671f\u7126\u8651\u4fc3\u5355\u3002\n    *   **\u672a\u5145\u5206\u63d0\u793a\u98ce\u9669**: \u672a\u5bf9\u201c\u5168\u804c\u201d\u60f3\u6cd5\u7684\u53ef\u884c\u6027\u3001\u5e02\u573a\u7ade\u4e89\u6fc0\u70c8\u7a0b\u5ea6\u3001\u4e2a\u4eba\u52aa\u529b\u4e0e\u7ed3\u679c\u7684\u975e\u7ebf\u6027\u5173\u7cfb\u8fdb\u884c\u5145\u5206\u7684\u98ce\u9669\u63d0\u793a\u3002\n    *   **\u201c\u62c9\u4eba\u4f18\u60e0\u201d\u5408\u89c4\u6027**: \u5229\u7528\u7528\u6237\u793e\u4ea4\u5173\u7cfb\u8fdb\u884c\u53d8\u76f8\u4fc3\u9500\uff0c\u9700\u6ce8\u610f\u5408\u89c4\u754c\u9650\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6: \u504f\u5dee**\n    *   \u7528\u6237\u9700\u6c42\uff08\u7a33\u5b9a\u5168\u804c\u6536\u5165\uff09\u4e0e\u4ea7\u54c1\u6838\u5fc3\u4ea4\u4ed8\uff08AI\u77ed\u89c6\u9891\u6280\u80fd+\u63a5\u5355\u6e20\u9053\uff09\u5b58\u5728**\u76ee\u6807\u5bf9\u9f50\u4f46\u9884\u671f\u7ba1\u7406\u4e0a\u7684\u4e25\u91cd\u504f\u5dee**\u3002\u4ea7\u54c1\u80fd\u63d0\u4f9b\u201c\u53ef\u80fd\u6027\u201d\uff0c\u4f46\u65e0\u6cd5\u627f\u8bfa\u201c\u7a33\u5b9a\u6027\u201d\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c (10\u5b57\u5185): \u9996\u5468\u6821\u6b63\u53d8\u73b0\u9884\u671f\uff0c\u6838\u67e5\u5bb6\u5ead\u652f\u6301**\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**:\n    1.  **\u9884\u671f\u6821\u6b63 (\u9ec4\u91d124-72\u5c0f\u65f6)**: \u9996\u5468\u5185\u5fc5\u987b\u8fdb\u884c\u4e00\u5bf9\u4e00\u6c9f\u901a\uff0c**\u660e\u786e\u6f84\u6e05**\uff1a\n        *   **\u5e73\u53f0\u89d2\u8272**: \u63d0\u4f9b\u6280\u80fd\u3001\u77e5\u8bc6\u548c\u63a5\u5355\u6e20\u9053\uff0c\u4f46\u975e\u201c\u6d3e\u5355\u516c\u53f8\u201d\u6216\u201c\u6536\u5165\u4fdd\u969c\u201d\u3002\n        *   **\u6536\u5165\u903b\u8f91**: \u6536\u5165\u53d6\u51b3\u4e8e\u4e2a\u4eba\u6280\u80fd\u6c34\u5e73\u3001\u4f5c\u54c1\u8d28\u91cf\u3001\u6295\u5165\u65f6\u95f4\u53ca\u5e02\u573a\u56e0\u7d20\uff0c\u6ce2\u52a8\u662f\u5e38\u6001\u3002\n        *   **\u5168\u804c\u5efa\u8bae**: \u5f3a\u70c8\u5efa\u8bae\u4ece\u517c\u804c\u8bd5\u6c34\u5f00\u59cb\uff0c\u5f85\u6709\u7a33\u5b9a\u6d41\u6c34\u548c\u5ba2\u6237\u540e\u518d\u8003\u8651\u5168\u804c\u8f6c\u578b\u3002\u5206\u4eab\u5176\u4ed6\u5b66\u5458\u4ece\u517c\u804c\u5230\u5168\u804c\u7684\u771f\u5b9e\uff08\u4e14\u66f2\u6298\uff09\u6848\u4f8b\u3002\n    2.  **\u5bb6\u5ead\u77e5\u60c5\u6838\u67e5**: \u79c1\u804a\u8be2\u95ee\u201c\u5b66\u4e60\u8ba1\u5212\u662f\u5426\u548c\u5bb6\u4eba\u5546\u91cf\u8fc7\uff1f\u201d\uff0c\u786e\u4fdd\u51b3\u7b56\u6709\u5bb6\u5ead\u652f\u6301\uff0c\u907f\u514d\u540e\u7eed\u7ea0\u7eb7\u3002\n    3.  **\u5efa\u7acb\u6b63\u786e\u5f52\u56e0**: \u5728\u4f5c\u4e1a\u53cd\u9988\u548c\u65e5\u5e38\u6c9f\u901a\u4e2d\uff0c\u591a\u5f3a\u8c03\u201c\u4f60\u7684XX\u52aa\u529b/\u521b\u610f\u5e26\u6765\u4e86\u4f5c\u54c1\u63d0\u5347\u201d\uff0c\u5c06\u6210\u529f\u5f52\u56e0\u4e8e\u5176\u81ea\u8eab\u884c\u52a8\uff0c\u800c\u975e\u5355\u7eaf\u201c\u8001\u5e08\u6559\u5f97\u597d\u201d\u6216\u201c\u5e73\u53f0\u8d44\u6e90\u591a\u201d\u3002\n    4.  **\u9636\u6bb5\u6027\u76ee\u6807\u7ba1\u7406**: \u4e3a\u5176\u8bbe\u5b9a\u4ee5\u201c\u5b8c\u6210\u7b2c\u4e00\u4e2a\u5c0f\u4f5c\u54c1\u201d\u3001\u201c\u63a5\u5230\u7b2c\u4e00\u4e2a\u4f4e\u4ef7\u4f53\u9a8c\u5355\u201d\u4e3a\u6838\u5fc3\u7684\u77ed\u671f\u76ee\u6807\uff0c\u7528\u5fae\u5c0f\u6b63\u53cd\u9988\u66ff\u4ee3\u5bf9\u201c\u9ad8\u6536\u5165\u201d\u7684\u9065\u8fdc\u671f\u5f85\u3002\n    5.  **\u5173\u6ce8\u7126\u8651\u52a8\u6001**: \u7559\u610f\u5176\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u5bf9\u6280\u672f\u66f4\u65b0\u3001\u4f5c\u4e1a\u96be\u5ea6\u3001\u63a5\u5355\u7ade\u4e89\u7684\u8a00\u8bba\uff0c\u53ca\u65f6\u758f\u5bfc\uff0c\u5f3a\u8c03\u5e95\u5c42\u903b\u8f91\u548c\u5ba1\u7f8e\u7684\u91cd\u8981\u6027\uff0c\u800c\u975e\u67d0\u4e2a\u5177\u4f53\u5de5\u5177\u7684\u64cd\u4f5c\u3002\n    6.  **\u98ce\u9669\u9884\u8b66\u6807\u8bb0**: \u5728\u5185\u90e8\u5c06\u8be5\u5b66\u5458\u6807\u8bb0\u4e3a\u201c\u9ad8\u9884\u671f\u3001\u4e2d\u9ad8\u98ce\u9669\u201d\u7528\u6237\uff0c\u73ed\u4e3b\u4efb\u9700\u5b9a\u671f\uff08\u5982\u6bcf\u5468\uff09\u5173\u6ce8\u5176\u5b66\u4e60\u72b6\u6001\u548c\u60c5\u7eea\u53cd\u9988\u3002\n\n{\"core_type\": \"T5+ (\u7126\u8651\u578b\u529f\u5229\u53d8\u73b0\u8005)\", \"risk_level\": \"\u4e2d\u9ad8\", \"refund_risk\": \"\u4e2d\u9ad8\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u9996\u5468\u6821\u6b63\u53d8\u73b0\u9884\u671f\uff0c\u6838\u67e5\u5bb6\u5ead\u652f\u6301\"}";
