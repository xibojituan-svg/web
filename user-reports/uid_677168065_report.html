    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4ee5\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\u7684\u8eab\u4efd\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677168065 (\u6635\u79f0\uff1a\u77e5\u8db3) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-11 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e - \u4e00\u6c40\u96ea2(\u59dc\u9e23) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u9a6c\u62c9\u96c5\u6500\u767b\u8ba1\u5212\u7cbe\u82f1\u7248 (\u5df2\u62a5\u540d) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u672a\u77e5** (\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u9700\u6838\u67e5\u662f\u5426\u5b58\u5728\u82b1\u5457/\u5206\u671f) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u5468\u4e00\u5230\u5468\u4e94\u5145\u88d5\uff0c\u5468\u672b\u5b69\u5b50\u5728\u5bb6\u65f6\u95f4\u5c11) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u672a\u77e5** (\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\uff0c\u9700\u8c28\u614e\u8bc4\u4f30) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** (\u7528\u6237\u8868\u8fbe\u4e86\u5145\u5206\u7684\u4e2a\u4eba\u80cc\u666f\u3001\u987e\u8651\u4e0e\u671f\u671b) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u6709\u660e\u786e\u7684\u517c\u804c\u53d8\u73b0\u8bc9\u6c42\uff08\u201c\u60f3\u641e\u4e00\u70b9\u6709\u6536\u5165\u7684\u4e8b\u60c5\u201d\uff09\uff0c\u4f46\u540c\u65f6\u4e5f\u8868\u73b0\u51fa\u5bf9\u884c\u4e1a\u957f\u671f\u53d1\u5c55\u7684\u8ba4\u53ef\uff08\u201c\u957f\u671f\u6765\u8bb2\u8fd8\u662f\u505a\u5206\u6210\u4e66\u4f1a\u597d\u4e00\u70b9\u201d\uff09\uff0c\u5e76\u975e\u7eaf\u7cb9\u7684\u201c\u51e0\u5929\u5185\u63d0\u73b0\u201d\u7684\u6781\u7aef\u53d8\u73b0\u9a71\u52a8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u4e3b\u8981\u662f\u60f3\u505a\u54ea\u4e00\u5757\u5462\uff0c\u5c31\u662f\u90a3\u79cd\u8a00\u60c5\u5c0f\u8bf4\u6211\u4e0d\u592a\u60f3...\u6709\u6ca1\u6709\u90a3\u79cd\uff0c\u6bd4\u8f83\u600e\u4e48\u8bf4\uff0c\u50cf\u513f\u7ae5\u7684\u6216\u8005\u8bf4\u90a3\u79cd\u8bfb\u7269\uff0c\u6216\u8005\u8bf4\u90a3\u4e9b\u5386\u53f2\u4e4b\u7c7b\u7684\u8fd9\u8fd9\u79cd\u6709\u5417\uff1f\u201d\n  > \u201c\u65e9\u70b9\u638c\u63e1\u6280\u80fd\u65e9\u70b9\u4e0a\u624b\u6323\u94b1[\u52a0\u6cb9]\u201d\n  > \u201c\u7cbe\u82f1\u5b66\u4e86\u6bcf\u4e2a\u6708\u6709\u4e2a 5-6 \u5343\u4e5f\u662f\u53ef\u4ee5\uff0c\u8981\u6c42\u90fd\u4e0d\u662f\u9ad8\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e (3-4\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u7528\u6237\u660e\u786e\u8868\u793a\u201c\u4e3b\u8981\u662f\u7ecf\u6d4e\u6709\u9650\u201d\uff0c\u5728\u9500\u552e\u63a8\u8350\u9ad8\u9636\u7248\u65f6\u4e3b\u52a8\u9009\u62e9\u7cbe\u82f1\u7248\uff0c\u8868\u660e\u9884\u7b97\u7d27\u5f20\uff0c\u5bf9\u4ef7\u683c\u654f\u611f\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u5468\u4e00\u5230\u5468\u4e94\u65f6\u95f4\u5145\u88d5\uff0c\u4f46\u5468\u672b\u56e0\u5e26\u5b69\u5b50\u65f6\u95f4\u5c11\u3002\u6574\u4f53\u65f6\u95f4\u5448\u788e\u7247\u5316\uff0c\u4f46\u5177\u5907\u89c4\u5f8b\u6027\u5b66\u4e60\u7684\u57fa\u7840\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u672a\u77e5** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff0c\u4f46\u7528\u6237\u4e3a\u5b9d\u5988\uff08\u201c\u5728\u5bb6\u5e26\u5b69\u5b50\u201d\uff09\uff0c\u9700\u8b66\u60d5\u5bb6\u5ead\u5e72\u9884\u98ce\u9669\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b07\u4f4e\u6781\u5371 (1-2\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56**\u3002\u7528\u6237\u53cd\u590d\u8868\u8fbe\u5bf9\u81ea\u8eab\u80fd\u529b\u7684\u6000\u7591\u548c\u5bf9\u672a\u6765\u7684\u4e0d\u786e\u5b9a\u6027\uff0c\u9700\u8981\u5916\u90e8\u6301\u7eed\u80af\u5b9a\u548c\u5b89\u5168\u611f\u515c\u5e95\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u5c31\u62c5\u5fc3\u81ea\u5df1\u7b28\uff0c\u5b66\u4e0d\u4f1a[\u6342\u8138]\u201d\n  > \u201c\u5982\u679c\u4ea4\u4e86\u5b66\u8d39\uff0c\u6ca1\u5b66\u4f1a\u600e\u4e48\u529e\u201d\n  > \u201c\u5e94\u8be5\u4e0d\u4f1a\u662f\u5047\u7684\u5427[\u6342\u8138]\u201d\n  > \u201c\u9ad8\u6536\u5165\u4e5f\u662f\u6709\u6bd4\u4f8b\u7684\u5bf9\u4e0d\uff0c\u4e0d\u662f\u6bcf\u4e2a\u4eba\u90fd\u80fd\u505a\u5230\u7684\u5bf9\u5427\u201d\n  > \u201c\u6211\u4e4b\u524d\u88ab\u9a97\u8fc7\u5f88\u591a\u6b21[\u6342\u8138]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 (\u7126\u8651\u4fdd\u969c)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u56e0\u8fc7\u5f80\u53d7\u9a97\u7ecf\u5386\u548c\u5168\u804c\u5e26\u5a03\u5bfc\u81f4\u7684\u5f3a\u70c8\u4e0d\u5b89\u5168\u611f\u4e0e\u81ea\u6211\u6000\u7591**\u3002\u5979\u5bfb\u6c42\u7684\u4e0d\u4ec5\u662f\u4e00\u4efd\u6536\u5165\uff0c\u66f4\u662f\u4e00\u4e2a**\u786e\u5b9a\u3001\u53ef\u9760\u3001\u80fd\u5728\u5bb6\u5b8c\u6210\u3001\u4e14\u80fd\u62b5\u5fa1\u672a\u6765\u98ce\u9669**\u7684\u751f\u5b58\u4fdd\u969c\u3002\u5979\u5bb3\u6015\u518d\u6b21\u88ab\u5272\u97ed\u83dc\uff0c\u5bb3\u6015\u6295\u5165\u6ca1\u6709\u56de\u62a5\uff0c\u5bb3\u6015\u81ea\u5df1\u80fd\u529b\u4e0d\u8db3\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u3001\u5177\u8c61\u5316\u7684\u5b89\u5168\u611f\u4e0e\u786e\u5b9a\u6027**\u3002\u9700\u8981\u63d0\u4f9b\u201c\u624b\u628a\u624b\u201d\u7684\u6258\u5e95\u611f\uff0c\u7528\u6210\u529f\u6848\u4f8b\uff08\u598249\u5c81\u9500\u552e\u7684\u6210\u529f\uff09\u548c\u660e\u786e\u7684\u8def\u5f84\u89c4\u5212\uff08\u77ed\u671f\u659c\u6760\u3001\u957f\u671f\u5206\u6210\uff09\u6765\u5bf9\u51b2\u5979\u7684\u7126\u8651\uff0c\u5efa\u7acb\u201c\u8fd9\u4ef6\u4e8b\u867d\u7136\u96be\uff0c\u4f46\u53ea\u8981\u4f60\u8ddf\u7740\u6211\uff0c\u5c31\u4e00\u5b9a\u80fd\u6210\u201d\u7684\u4fe1\u4efb\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2 \u98ce\u9669\u7ba1\u63a7\u578b** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b (\u9ad8\u5185\u8017\u98ce\u9669)** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u7b49\u4fe1\u53f7\u3002\u4f46**\u9700\u7d27\u6025\u6838\u67e5\u652f\u4ed8\u65b9\u5f0f**\uff0c\u82e5\u4e3a\u5206\u671f/\u501f\u8d37\uff0c\u98ce\u9669\u7b49\u7ea7\u5c06\u6025\u5267\u4e0a\u5347\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u5b9d\u5988\u8eab\u4efd\uff0c\u82e5\u4e3a\u7792\u7740\u5bb6\u4eba\u62a5\u540d\u6216\u52a8\u7528\u5bb6\u5ead\u50a8\u5907\u91d1\uff0c\u540e\u671f\u538b\u529b\u5927\u65f6\u6613\u7206\u53d1\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | \u5b66\u4e60\u521d\u671f\uff08\u5f00\u8bfe\u540e2-3\u5468\uff09\u9047\u5230\u6280\u672f\u96be\u9898\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u3001\u5f55\u97f3\u6548\u679c\u5dee\uff09\u65f6\uff0c\u6781\u6613\u56e0\u201c\u6211\u592a\u7b28\u4e86\u201d\u7684\u81ea\u5351\u611f\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u4efb\u4f55\u8d1f\u9762\u53cd\u9988\u3001\u4f5c\u4e1a\u88ab\u9000\u56de\u3001\u8bd5\u97f3\u5931\u8d25\uff0c\u90fd\u53ef\u80fd\u76f4\u63a5\u89e6\u53d1\u201c\u6211\u4e0d\u884c\u201d\u7684\u5d29\u6e83\uff0c\u8fdb\u800c\u8981\u6c42\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u5bf9\u201c\u6bcf\u67085-6\u5343\u201d\u6709\u660e\u786e\u671f\u5f85\u3002\u82e5\u5b66\u4e602-3\u4e2a\u6708\u540e\u4ecd\u672a\u63a5\u5230\u4efb\u4f55\u5355\u5b50\u6216\u6536\u76ca\u751a\u5fae\uff0c\u4f1a\u4ea7\u751f\u5f3a\u70c8\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u6280\u672f\u96be\u70b9\u96c6\u4e2d\u51fa\u73b0\uff0c\u82e5\u7b2c\u4e00\u6b21\u4f5c\u4e1a\u6216\u8bd5\u97f3\u906d\u9047\u632b\u6298\uff0c\u9000\u8d39\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u77e5\u8db3\u540c\u5b66\u4f60\u597d\u5440\uff01\u770b\u5230\u4f60\u62a5\u540d\u4e86\u7cbe\u82f1\u7248\uff0c\u7279\u522b\u4e3a\u4f60\u5f00\u5fc3\uff01\u54b1\u4eec\u73ed\u5f88\u591a\u5b9d\u5988\u540c\u5b66\uff0c\u5927\u5bb6\u65f6\u95f4\u90fd\u5dee\u4e0d\u591a\uff0c\u4ee5\u540e\u53ef\u4ee5\u4e92\u76f8\u6253\u6c14\u3002**\u522b\u62c5\u5fc3\u2018\u7b28\u2019\u8fd9\u4e2a\u5b57\uff0c\u6211\u5e26\u8fc7\u7684\u5b66\u5458\u91cc\uff0c\u8d77\u6b65\u65f6\u89c9\u5f97\u81ea\u5df1\u2018\u7b28\u2019\u7684\uff0c\u6700\u540e\u90fd\u6210\u4e86\u73ed\u91cc\u6700\u7a33\u624e\u7a33\u6253\u7684\u90a3\u4e00\u6279\u3002** \u54b1\u4eec\u4e0d\u8ddf\u522b\u4eba\u6bd4\u901f\u5ea6\uff0c\u5c31\u6309\u4f60\u81ea\u5df1\u7684\u8282\u594f\u6765\uff0c\u6709\u4efb\u4f55\u5361\u4f4f\u7684\u5730\u65b9\uff0c\u54ea\u6015\u662f\u4e00\u4e2a\u6309\u94ae\u627e\u4e0d\u5230\uff0c\u968f\u65f6\u558a\u6211\uff0c\u6211\u2018\u624b\u628a\u624b\u2019\u5e26\u4f60\u8fc7\u53bb\u3002\u54b1\u4eec\u7684\u76ee\u6807\u4e0d\u662f\u6210\u4e3a\u5929\u624d\uff0c\u662f\u7a33\u7a33\u5730\u628a\u6280\u80fd\u5b66\u5230\u624b\uff0c\u628a\u90a3\u4efd\u5c5e\u4e8e\u4f60\u7684\u6536\u5165\u6323\u5230\u624b\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** (\u9700\u642d\u914d\u9ad8\u5f3a\u5ea6\u60c5\u7eea\u6258\u5e95)\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u5f3a\u70c8\u8865\u5145\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u9488\u5bf9\u5176T6\uff08\u60c5\u7eea\u5de8\u5a74\uff09\u7279\u8d28\uff0c\u63d0\u4f9b\u201c\u8f6e\u6905\u7ea7\u201d\u60c5\u611f\u966a\u4f34\u3002**\u4e25\u7981\u8fc7\u65e9\u4ea4\u53c9\u63a8\u9500\u9ad8\u9636\u8bfe\u7a0b**\uff0c\u907f\u514d\u89e6\u53d1\u6df7\u5408\u4f531\u53f7\uff08\u9ad8\u77e5\u5185\u8017\uff09\u7684\u201c\u5b66\u4e0d\u8fc7\u6765\u201d\u6050\u614c\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n  1. **\u4e25\u7981\u7528\u201c\u522b\u4eba\u90fd\u884c\u4f60\u600e\u4e48\u4e0d\u884c\u201d\u7b49\u5bf9\u6bd4\u6027\u3001\u65bd\u538b\u6027\u8bed\u8a00\u3002**\n  2. **\u4e25\u7981\u5728\u5979\u8868\u8fbe\u201c\u5b66\u4e0d\u4f1a\u201d\u65f6\uff0c\u53ea\u7ed9\u6559\u7a0b\u94fe\u63a5\u6216\u51b7\u51b0\u51b0\u7684\u201c\u591a\u7ec3\u51e0\u904d\u201d\u3002\u5fc5\u987b\u7acb\u523b\u7ed9\u4e88\u5177\u4f53\u3001\u53ef\u64cd\u4f5c\u7684\u6b65\u9aa4\uff0c\u751a\u81f3\u8fdc\u7a0b\u534f\u52a9\u3002**\n  3. **\u4e25\u7981\u5728\u5979\u9996\u6b21\u8bd5\u97f3/\u4f5c\u4e1a\u5931\u8d25\u65f6\uff0c\u53ea\u7ed9\u6280\u672f\u6027\u5dee\u8bc4\u3002\u5fc5\u987b\u5148\u80af\u5b9a\u52aa\u529b\u548c\u8fdb\u6b65\uff0c\u518d\u59d4\u5a49\u6307\u51fa\u95ee\u9898\u3002**\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u5f00\u8425\u540e\u81f3\u5c112\u4e2a\u6708\u5185\uff0c\u4e25\u7981\u4efb\u4f55\u5927\u989d\u5347\u5355\u63a8\u4ecb**\u3002\u5f85\u5176\u5b8c\u6210\u7b2c\u4e00\u4e2a\u5c0f\u91cc\u7a0b\u7891\uff08\u5982\u6210\u529f\u63d0\u4ea4\u4e00\u4efd\u5408\u683c\u4f5c\u4e1a\u6216\u63a5\u5230\u7b2c\u4e00\u4e2a\u7b80\u5355\u5355\u5b50\uff09\uff0c\u5efa\u7acb\u521d\u6b65\u81ea\u4fe1\u540e\uff0c\u518d\u8003\u8651\u8f7b\u91cf\u7ea7\u9644\u52a0\u670d\u52a1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > **\u201c\u6211\u5c31\u62c5\u5fc3\u81ea\u5df1\u7b28\uff0c\u5b66\u4e0d\u4f1a[\u6342\u8138]\u201d** \u2014\u2014 **\u5178\u578bT6\u81ea\u5351\u4fe1\u53f7\uff0c\u5fc3\u7406\u5f39\u6027\u6781\u4f4e\u3002**\n2. > **\u201c\u5982\u679c\u4ea4\u4e86\u5b66\u8d39\uff0c\u6ca1\u5b66\u4f1a\u600e\u4e48\u529e\u201d** \u2014\u2014 **\u5bf9\u5931\u8d25\u6781\u5ea6\u6050\u60e7\uff0c\u9700\u8981\u7edd\u5bf9\u7684\u5b89\u5168\u515c\u5e95\u627f\u8bfa\u3002**\n3. > **\u201c\u6211\u4e4b\u524d\u88ab\u9a97\u8fc7\u5f88\u591a\u6b21[\u6342\u8138]\u201d** \u2014\u2014 **\u89e3\u91ca\u4e86\u5979\u4e3a\u4f55\u5982\u6b64\u8c28\u614e\u548c\u591a\u7591\uff0c\u5b89\u5168\u9700\u6c42\u662f\u6838\u5fc3\u9a71\u52a8\u529b\u3002**\n4. > **\u201c\u6211\u8fd8\u662f\u6bd4\u8f83\u9002\u5408\u9760\u81ea\u5df1\u7684\u4e00\u6280\u4e4b\u957f\u8d5a\u94b1[\u5bb3\u7f9e]\u201d** \u2014\u2014 **\u52a8\u673a\u4e3a\u201c\u4e2d\u201d\uff0c\u6709\u52a1\u5b9e\u53d8\u73b0\u8bc9\u6c42\uff0c\u4f46\u6392\u65a5\u9500\u552e\u7b49\u4e0d\u786e\u5b9a\u6027\u5de5\u4f5c\uff0c\u8ffd\u6c42\u7a33\u5b9a\u6280\u80fd\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u9700\u6c42\u2014\u2014\u4e00\u4efd\u53ef\u9760\u7684\u5bb6\u5ead\u6536\u5165\u4fdd\u969c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u201c\u8f6e\u6905\u7ea7\u201d\u60c5\u611f\u6258\u5e95\u4e0e\u7269\u7406\u4ee3\u529e\uff0c\u7528\u6781\u81f4\u7684\u5b89\u5168\u611f\u5bf9\u51b2\u5176\u81ea\u5351\u4e0e\u7126\u8651\uff0c\u5728\u6280\u672f\u6307\u5bfc\u524d\u5fc5\u987b\u5148\u5b8c\u6210\u60c5\u7eea\u5b89\u629a\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\uff08\u9700\u642d\u914d\u6ee1\u914d\u7597\u6108\u966a\u4f34\u5305\uff09\", \"age\": \"\u672a\u77e5\uff08\u63a8\u6d4b\u4e3a30-40\u5c81\u5b9d\u5988\uff09\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}\n```";
