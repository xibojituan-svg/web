        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 105083055 / \u6635\u79f0\uff1a\u9648\u4eae\uff0c\u571f\u5efa\u88c5\u4fee |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-11 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u559c\u64ad\u9752\u9752 -> \u4e54\u672812(\u5468\u8389\u840d) -> \u7eb8\u7cca\u7684\u6bcd\u8001\u864e\uff5e\u5b98\u65b9\u62db\u52df\u5b98(\u5468\u8389\u840d) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u9a6c\u62c9\u96c5-AI\u77ed\u6545\u4e8b\u5199\u4f5c\u8bfe (\u57fa\u7840\u73ed2880\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u624b\u91cc\u8fd8\u53ea\u6709\u4e00\u5343\u3002\u6708\u5e95\u624d\u6536\u5230\u94b1\uff0c\u4e2d\u95f4\u518d\u6323\u70b9\u3002\u660e\u5929\u53bb\u51d1\u4e9b\u3002\u201d\uff0c\u8868\u660e\u62a5\u540d\u8d44\u91d1\u9700\u901a\u8fc7\u4e34\u65f6\u7b79\u63aa\uff08\u501f\u94b1\u6216\u9884\u652f\uff09\u83b7\u5f97\uff0c\u975e\u81ea\u6709\u95f2\u94b1\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u7f3a\u5931**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u900f\u9732\u7528\u6237\u5177\u4f53\u804c\u4e1a\uff08\u571f\u5efa\u88c5\u4fee\u53ef\u80fd\u4e3a\u81ea\u7531\u804c\u4e1a\u6216\u5de5\u4eba\uff09\u3001\u5de5\u4f5c\u65f6\u95f4\u5b89\u6392\u53ca\u5bb6\u5ead\u8d23\u4efb\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\u3002\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u4fe1\u606f\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u7528\u6237\u4e3b\u52a8\u53d1\u8a00\u6781\u5c11\uff08\u4ec515\u6761\uff09\uff0c\u591a\u4e3a\u88ab\u52a8\u56de\u5e94\uff0c\u5173\u4e8e\u5176\u4e2a\u4eba\u80cc\u666f\u3001\u5b66\u4e60\u6761\u4ef6\u3001\u5bb6\u5ead\u72b6\u51b5\u3001\u8fc7\u5f80\u7ecf\u5386\u7b49\u5173\u952e\u4fe1\u606f\u51e0\u4e4e\u4e3a\u96f6\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e\uff0c\u5bf9\u201c\u5feb\u901f\u63a5\u5355\u201d\u3001\u201c\u53d8\u73b0\u8def\u5f84\u201d\u3001\u201c\u4e00\u7a3f\u591a\u5403\u201d\u7b49\u6536\u76ca\u6a21\u5f0f\u9ad8\u5ea6\u5173\u6ce8\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u201c\u51e0\u5929\u5185\u63d0\u73b0\u201d\u7684\u6781\u7aef\u6025\u8feb\u6027\uff0c\u613f\u610f\u53c2\u4e0e\u5b66\u4e60\u5e76\u5b8c\u6210\u4f5c\u4e1a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u662f\u7684\uff0c\u8fd9\u4e2a\u975e\u5e38\u597d\uff0c\u6536\u8d39\u4e0d\u9ad8\uff0c\u542b\u91cf\u9ad8\u3002\u4e00\u5b9a\u62a5\uff0c\u770b\u4e0b\u5348\u80fd\u4e0d\u80fd\u51d1\u9f50\u94b1\u6765\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u6838\u5fc3\u8bc1\u636e\u3002\u62a5\u540d\u9700\u201c\u51d1\u94b1\u201d\uff0c\u4e14\u5f53\u524d\u624b\u5934\u4ec5\u67091000\u5143\uff0c\u6708\u5e95\u624d\u6709\u6536\u5165\u3002\u8d44\u91d1\u72b6\u51b5\u7d27\u5f20\uff0c\u652f\u4ed8\u5b66\u8d39\u5df2\u6784\u6210\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u65e0\u4fe1\u606f\u5224\u65ad\u3002\u4f46\u8003\u8651\u5230\u5176\u4ece\u4e8b\u201c\u571f\u5efa\u88c5\u4fee\u201d\u884c\u4e1a\uff0c\u53ef\u80fd\u5b58\u5728\u5de5\u4f5c\u65f6\u95f4\u4e0d\u89c4\u5f8b\u6216\u4f53\u529b\u6d88\u8017\u5927\u7684\u60c5\u51b5\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u65e0\u4fe1\u606f\u5224\u65ad\u3002\u4f46\u7ed3\u5408\u8d44\u91d1\u7d27\u5f20\u60c5\u51b5\uff0c**\u5b58\u5728\u5bb6\u4eba\u4e0d\u77e5\u60c5\u6216\u53cd\u5bf9\u7684\u6781\u9ad8\u98ce\u9669**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a**\u3002\u7528\u6237\u5b66\u4e60\u6001\u5ea6\u79ef\u6781\uff08\u56de\u590d\u201c1\u201d\u3001\u201c\u597d\u201d\u3001\u201c\u8fdb\u4e86\u201d\u3001\u201c\u9a6c\u4e0a\u5230\u201d\uff09\uff0c\u80fd\u5b8c\u6210\u4f5c\u4e1a\u5e76\u4e3b\u52a8\u8be2\u95ee\u8bfe\u7a0b\u4ef7\u683c\u3002\u9762\u5bf9\u9500\u552e\u538b\u529b\uff08\u201c\u4eca\u5929\u662f\u62a2\u514d\u5355\u6700\u540e\u4e00\u5929\u201d\uff09\u65f6\uff0c\u8868\u73b0\u51fa\u201c\u5fc5\u987b\u5b66\u201d\u7684\u51b3\u5fc3\u548c\u201c\u51d1\u94b1\u201d\u7684\u884c\u52a8\uff0c\u800c\u975e\u76f4\u63a5\u653e\u5f03\u6216\u62b1\u6028\u3002\u4f46\u672a\u7ecf\u5386\u771f\u5b9e\u5b66\u4e60\u632b\u6298\uff0c\u5f39\u6027\u5f85\u89c2\u5bdf\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5fc5\u987b\u5b66\uff0c\u770b\u660e\u5929\u80fd\u4e0d\u80fd\u51d1\u591f\u94b1\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u7ecf\u6d4e\u4e0a\u7684\u4e0d\u5b89\u5168\u611f\u4e0e\u5bf9\u7a33\u5b9a\u6536\u5165\u7684\u6e34\u671b**\u3002\u4ece\u4e8b\u201c\u571f\u5efa\u88c5\u4fee\u201d\u5de5\u4f5c\uff0c\u6536\u5165\u53ef\u80fd\u4e0d\u7a33\u5b9a\u6216\u6709\u9650\uff08\u9700\u201c\u6708\u5e95\u624d\u6536\u5230\u94b1\u201d\uff09\uff0c\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60AI\u5199\u4f5c\u6280\u80fd\u83b7\u5f97\u4e00\u4efd\u53ef\u9884\u6d4b\u7684\u3001\u989d\u5916\u7684\u201c\u96f6\u82b1\u94b1\u201d\u6216\u201c\u7761\u540e\u6536\u76ca\u201d\uff0c\u4ee5\u7f13\u89e3\u7ecf\u6d4e\u538b\u529b\uff0c\u5bfb\u6c42\u804c\u4e1a\u548c\u6536\u5165\u7684\u201c\u5b89\u5168\u57ab\u201d\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u4e0e\u8def\u5f84\u611f**\u3002\u4ed6\u9700\u8981\u6e05\u6670\u7684\u3001\u53ef\u6267\u884c\u7684\u53d8\u73b0\u8def\u5f84\u548c\u53ca\u65f6\u7684\u6b63\u9762\u53cd\u9988\uff08\u5982\u4f5c\u4e1a\u70b9\u8bc4\u3001\u6295\u7a3f\u6e20\u9053\uff09\uff0c\u6765\u5bf9\u51b2\u5176\u56e0\u8d44\u91d1\u6295\u5165\u800c\u4ea7\u751f\u7684\u7126\u8651\uff0c\u5e76\u9a8c\u8bc1\u201c\u6295\u8d44\u201d\u7684\u56de\u62a5\u53ef\u80fd\u6027\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udd34 D\u7c7b** (\u89e6\u53d1\u652f\u4ed8\u94fe\u7ea2\u7ebf) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u578b** (\u52a8\u673a\u660e\u786e\u4e3a\u53d8\u73b0\uff0c\u8d44\u6e90\u5e95\u5ea7\u5b58\u5728\u4e25\u91cd\u77ed\u677f) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\ud83d\udd34**\u5df2\u89e6\u53d1 D \u7c7b\u7194\u65ad\u7ea2\u7ebf\uff01**\n- **\u89e6\u53d1\u56e0\u7531**\uff1a**\u652f\u4ed8\u94fe\u5b58\u5728\u501f\u6b3e/\u51d1\u94b1\u9690\u60a3**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u8d44\u91d1\u4e0d\u8db3\u9700\u201c\u51d1\u94b1\u201d\uff0c\u5c5e\u4e8e\u201c\u5f71\u54cd\u57fa\u672c\u751f\u6d3b\u5f00\u652f\u201d\u6216\u201c\u501f\u8d37\u62a5\u540d\u201d\u7684\u9ad8\u98ce\u9669\u884c\u4e3a\uff0c\u7b26\u5408D\u7c7b\u5224\u5b9a\u6807\u51c6\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u9ad8** | \u62a5\u540d\u8d44\u91d1\u53ef\u80fd\u662f\u5bb6\u5ead\u5fc5\u8981\u5f00\u652f\uff0c\u4e00\u65e6\u5bb6\u4eba\u53d1\u73b0\u6216\u53cd\u5bf9\uff0c\u6781\u6613\u5f15\u53d1\u5f3a\u70c8\u9000\u8d39\u8981\u6c42\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u82e5\u571f\u5efa\u88c5\u4fee\u5de5\u4f5c\u7e41\u5fd9\u3001\u4f5c\u606f\u4e0d\u89c4\u5f8b\uff0c\u65e0\u6cd5\u8ddf\u4e0a\u76f4\u64ad\u548c\u4f5c\u4e1a\u8282\u594f\uff0c\u4f1a\u4ea7\u751f\u201c\u94b1\u767d\u82b1\u4e86\u201d\u7684\u7126\u8651\uff0c\u8fdb\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u76ee\u524d\u672a\u8868\u73b0\u51fa\u60c5\u7eea\u5316\u7279\u5f81\uff0c\u4f46\u82e5\u521d\u671f\u5b66\u4e60\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u3001\u6307\u4ee4\u4f7f\u7528\uff09\u9047\u5230\u8f83\u5927\u632b\u6298\uff0c\u53ef\u80fd\u56e0\u6295\u5165\u4ea7\u51fa\u7126\u8651\u800c\u653e\u5f03\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u4ed6\u5bf9\u201c\u6536\u8d39\u4e0d\u9ad8\uff0c\u542b\u91cf\u9ad8\u201d\u62b1\u6709\u9ad8\u6027\u4ef7\u6bd4\u671f\u5f85\uff0c\u4e14\u6025\u9700\u53d8\u73b0\u3002\u82e5\u5f00\u8425\u540e\u77ed\u671f\u5185\uff08\u59822-4\u5468\uff09\u672a\u611f\u53d7\u5230\u660e\u786e\u7684\u201c\u63a5\u5355\u201d\u8def\u5f84\u6216\u83b7\u5f97\u5fae\u5c0f\u6b63\u53cd\u9988\uff0c\u6781\u6613\u56e0\u201c\u88ab\u9a97\u201d\u6216\u201c\u6ca1\u6548\u679c\u201d\u800c\u66b4\u6012\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u82e5\u672a\u83b7\u5f97\u4efb\u4f55\u6295\u7a3f\u673a\u4f1a\u3001\u53d8\u73b0\u53cd\u9988\u6216\u611f\u5230\u8bfe\u7a0b\u5185\u5bb9\u4e0e\u201c\u5feb\u901f\u8d5a\u94b1\u201d\u5ba3\u4f20\u4e0d\u7b26\uff0c\u9000\u8d39\u98ce\u9669\u5c06\u96c6\u4e2d\u7206\u53d1\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4eae\u54e5\uff0c\u770b\u5230\u4f60\u4e3a\u4e86\u5b66\u4e60\u8fd8\u7279\u610f\u53bb\u7b79\u94b1\uff0c\u8fd9\u4efd\u51b3\u5fc3\u6211\u7279\u522b\u4f69\u670d\u3002\u54b1\u4eec\u8fd9\u884c\uff0c\u5f88\u591a\u5e08\u5144\u5e08\u59d0\u4e5f\u662f\u4ece\u96f6\u5f00\u59cb\uff0c\u7b2c\u4e00\u7b14\u7a3f\u8d39\u53ef\u80fd\u4e0d\u591a\uff0c\u4f46\u8e0f\u51fa\u7b2c\u4e00\u6b65\u6700\u5173\u952e\u3002\u4f60\u653e\u5fc3\uff0c\u6211\u4f1a\u76ef\u7740\u6700\u9002\u5408\u65b0\u624b\u7684\u6295\u7a3f\u6e20\u9053\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u5148\u628a\u7b2c\u4e00\u4e2a\u4f5c\u54c1\u641e\u51fa\u6765\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5feb\u901f\u63a5\u5355\u7ebf**\u3011\u3002\u5fc5\u987b\u4f18\u5148\u6ee1\u8db3\u5176\u53d8\u73b0\u6838\u5fc3\u8bc9\u6c42\uff0c\u63d0\u4f9b\u6700\u7b80\u5355\u3001\u6700\u76f4\u63a5\u7684\u6295\u7a3f\u901a\u9053\u548c\u6a21\u677f\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u8d44\u91d1\u538b\u529b\u548c\u7126\u8651\u5fc3\u6001\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010**\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305**\u3011\u3002\u73ed\u4e3b\u4efb\u9700\u9ad8\u9891\u3001\u5177\u4f53\u5730\u80af\u5b9a\u5176\u6bcf\u4e00\u6b65\u8fdb\u5c55\uff08\u5982\u201c\u8fd9\u4e2a\u5f00\u5934\u6539\u5f97\u5f88\u597d\uff01\u201d\uff09\uff0c\u5e76\u7ba1\u7406\u5176\u6536\u76ca\u9884\u671f\uff0c\u5f3a\u8c03\u201c\u5148\u5b8c\u6210\uff0c\u518d\u5b8c\u7f8e\uff0c\u5148\u8fc7\u7a3f\uff0c\u518d\u8c08\u4ef7\u201d\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u4ed6\u753b\u957f\u671f\u5927\u997c**\u3002\u907f\u514d\u8c08\u8bba\u201c\u672a\u6765\u6708\u5165\u8fc7\u4e07\u201d\uff0c\u805a\u7126\u4e8e\u201c\u672c\u5468\u80fd\u8fc7\u7a3f\u7684\u77ed\u6545\u4e8b\u6a21\u677f\u201d\u3002\n    2. **\u7edd\u4e0d\u65bd\u52a0\u8fc7\u96be\u4f5c\u4e1a**\u3002\u521d\u671f\u4efb\u52a1\u5fc5\u987b\u7b80\u5355\u3001\u53ef\u5feb\u901f\u5b8c\u6210\uff0c\u907f\u514d\u56e0\u6280\u672f\u632b\u6298\u5bfc\u81f4\u653e\u5f03\u3002\n    3. **\u7edd\u4e0d\u5ffd\u89c6\u5176\u8d44\u91d1\u538b\u529b**\u3002\u6c9f\u901a\u4e2d\u907f\u514d\u63d0\u53ca\u4efb\u4f55\u989d\u5916\u6d88\u8d39\u6216\u5347\u5355\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u672a\u4ea7\u751f\u4efb\u4f55\u7a33\u5b9a\u7a3f\u8d39\u6536\u5165\u524d\uff0c\u7981\u6b62\u63a8\u8350\u4efb\u4f55\u9ad8\u9636\u8bfe\u7a0b\u6216\u9644\u52a0\u670d\u52a1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u8001\u5e08\uff0c\u6211\u60f3\u95ee\u4e00\u4e0b\u8bfe\u7a0b\u662f\u51e0\u5343\uff0c\u6015\u94b1\u4e0d\u591f\u201d\n2. > \u201c\u624b\u91cc\u8fd8\u53ea\u6709\u4e00\u5343\u3002\u6708\u5e95\u624d\u6536\u5230\u94b1\uff0c\u4e2d\u95f4\u518d\u6323\u70b9\u3002\u660e\u5929\u53bb\u51d1\u4e9b\u3002\u201d\n3. > \u201c\u662f\u7684\uff0c\u8fd9\u4e2a\u975e\u5e38\u597d\uff0c\u6536\u8d39\u4e0d\u9ad8\uff0c\u542b\u91cf\u9ad8\u3002\u4e00\u5b9a\u62a5\uff0c\u770b\u4e0b\u5348\u80fd\u4e0d\u80fd\u51d1\u9f50\u94b1\u6765\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4\u641e\u94b1\u7ed3\u679c\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7ecf\u6d4e\u5b89\u5168\u4e0e\u4fdd\u969c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5f00\u8425\u5373\u63d0\u4f9b\u6700\u4f4e\u95e8\u69db\u7684\u6295\u7a3f\u901a\u9053\u5e76\u7d27\u76ef\u5176\u7b2c\u4e00\u4e2a\u4f5c\u54c1\u7684\u8fc7\u7a3f\u53cd\u9988\uff0c\u540c\u65f6\u8fdb\u884c\u5bc6\u96c6\u7684\u3001\u5177\u4f53\u5316\u7684\u60c5\u7eea\u5b89\u629a\u4e0e\u9884\u671f\u7ba1\u7406\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u578b\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"risk_level\": \"\u6781\u9ad8\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf+\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
