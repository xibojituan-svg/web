        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 274769815 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-19 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9152\u4e66\u68a6\u58f0(\u674e\u661f\u5b87)\u3001\u7af9\u9752\u6311\u6708(\u9a6c\u5efa\u5a1c) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u6f2b\u5267\u7279\u8bad\u8425 (\u5df2\u62a5\u540d) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b07\u4f4e\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u52a8\u673a\u4fe1\u53f7\u4e25\u91cd\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u4e2d\u672a\u63d0\u53ca\u4efb\u4f55\u53d8\u73b0\u3001\u8d5a\u94b1\u3001\u63a5\u5355\u7b49\u8bc9\u6c42\uff0c\u4e5f\u672a\u8868\u73b0\u51fa\u5bf9\u6280\u672f\u539f\u7406\u3001\u80fd\u529b\u6210\u957f\u7684\u6df1\u5ea6\u8ffd\u95ee\u3002\u4e92\u52a8\u4ec5\u9650\u4e8e\u63a5\u6536\u901a\u77e5\u548c\u793c\u8c8c\u56de\u5e94\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u65e0\u76f4\u63a5\u8bc1\u636e\u3002\u7528\u6237\u53d1\u8a00\u591a\u4e3a\u201c\u6536\u5230\u201d\u3001\u201c\u8c22\u8c22\u73ed\u73ed\u201d\u3001\u201c\u5df2\u9884\u7ea6\u201d\u7b49\u6307\u4ee4\u6027\u56de\u5e94\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a\u672a\u77e5 \u2014 \u65e0\u4fe1\u606f\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a\u4e2d \u2014 \u80fd\u53ca\u65f6\u54cd\u5e94\u73ed\u73ed\u6d88\u606f\uff0c\u53c2\u4e0e\u6d3b\u52a8\u9884\u7ea6\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u788e\u7247\u5316\u65f6\u95f4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a\u672a\u77e5 \u2014 \u65e0\u4fe1\u606f\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u7528\u6237\u4e3b\u52a8\u53cd\u9988\u98de\u4e66\u94fe\u63a5\u95ee\u9898\u5e76\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u95ee\u9898\u89e3\u51b3\u540e\u793c\u8c8c\u81f4\u8c22\u3002\u5168\u7a0b\u65e0\u60c5\u7eea\u5316\u3001\u81ea\u6211\u6000\u7591\u6216\u4f9d\u8d56\u5b89\u629a\u7684\u8a00\u8bba\uff0c\u8868\u73b0\u51fa\u72ec\u7acb\u89e3\u51b3\u95ee\u9898\u7684\u503e\u5411\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u65e9\u4e0a\u597d\uff0c\u9152\u4e66\u73ed\u73ed\uff0c\u6628\u5929\u65e0\u6781\u8001\u5e08\u5206\u4eab\u7684\u98de\u4e66\u8fde\u63a5\u6709\u95ee\u9898\uff0c\u6709\u65b0\u8fde\u63a5\u5417\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u793e\u7fa4\u5f52\u5c5e\u4e0e\u89c4\u5219\u9075\u4ece\u7684\u6f5c\u5728\u9700\u6c42**\u3002\u7528\u6237\u884c\u4e3a\u6a21\u5f0f\u9ad8\u5ea6\u201c\u5408\u89c4\u201d\uff1a\u53ca\u65f6\u56de\u5e94\u3001\u4e3b\u52a8\u53cd\u9988\u95ee\u9898\u3001\u9075\u5b88\u6307\u4ee4\uff08\u53d1UID\u3001\u9884\u7ea6\u76f4\u64ad\uff09\u3002\u8fd9\u6697\u793a\u5176\u53ef\u80fd\u5c06\u8bfe\u7a0b\u793e\u7fa4\u89c6\u4e3a\u4e00\u4e2a\u9700\u8981\u201c\u878d\u5165\u201d\u548c\u201c\u88ab\u63a5\u7eb3\u201d\u7684\u793e\u4ea4\u73af\u5883\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u63d0\u4f9b\u7a33\u5b9a\u3001\u6709\u5e8f\u3001\u6709\u56de\u5e94\u7684\u793e\u7fa4\u4e92\u52a8\u6846\u67b6**\u3002\u4ed6\u9700\u8981\u7684\u662f\u88ab\u770b\u89c1\uff08\u56de\u5e94\u4ed6\u7684\u201c\u6536\u5230\u201d\uff09\u3001\u88ab\u652f\u6301\uff08\u89e3\u51b3\u4ed6\u7684\u6280\u672f\u95ee\u9898\uff09\u4ee5\u53ca\u5728\u4e00\u4e2a\u6709\u660e\u786e\u89c4\u5219\u7684\u96c6\u4f53\u4e2d\u83b7\u5f97\u5b89\u5168\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfea **C1** \u7c7b |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T5 \u597d\u73a9\u5c1d\u9c9c\u8005** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u5f53\u524d\u65e0\u8ff9\u8c61\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u82e5\u8bfe\u7a0b\u8282\u594f\u8fc7\u5feb\u3001\u4f5c\u4e1a\u538b\u529b\u9661\u589e\uff0c\u8d85\u51fa\u5176\u201c\u8f7b\u677e\u53c2\u4e0e\u201d\u7684\u9884\u671f\uff0c\u53ef\u80fd\u56e0\u65e0\u6cd5\u8ddf\u4e0a\u800c\u9ed8\u9ed8\u9000\u51fa\u3002** |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u6280\u672f\u95ee\u9898\u80fd\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\uff0c\u4e0d\u6613\u56e0\u64cd\u4f5c\u56f0\u96be\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | **\u82e5\u8bfe\u7a0b\u5185\u5bb9\u8fc7\u4e8e\u201c\u786c\u6838\u641e\u94b1\u201d\u800c\u7f3a\u4e4f\u8da3\u5473\u6027\u548c\u793e\u4ea4\u5c5e\u6027\uff0c\u4e0e\u5176\u201c\u793e\u4ea4\u966a\u4f34\u201d\u7684\u6838\u5fc3\u9700\u6c42\u9519\u914d\uff0c\u53ef\u80fd\u5bfc\u81f4\u5174\u8da3\u4e27\u5931\u800c\u9000\u8d39\u3002** |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe2-3\u5468\u540e\uff0c\u5f53\u8bfe\u7a0b\u4ece\u201c\u65b0\u9c9c\u6709\u8da3\u201d\u8f6c\u5165\u201c\u9ad8\u5f3a\u5ea6\u5b9e\u64cd\u548c\u4f5c\u4e1a\u201d\u9636\u6bb5\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cTracy\u4f60\u597d\u5440\uff0c\u770b\u5230\u4f60\u6bcf\u6b21\u6d88\u606f\u90fd\u56de\u590d\u5f97\u7279\u522b\u53ca\u65f6\uff0c\u611f\u89c9\u4f60\u662f\u4e2a\u5f88\u9760\u8c31\u7684\u4f19\u4f34\u5462\uff01\u54b1\u4eec\u8fd9\u4e2a\u8425\u91cc\u6709\u5f88\u591a\u50cf\u4f60\u4e00\u6837\u5bf9AI\u521b\u4f5c\u611f\u5174\u8da3\u7684\u670b\u53cb\uff0c\u63a5\u4e0b\u6765\u4e00\u8d77\u73a9\u7740\u5b66\uff0c\u6709\u4efb\u4f55\u4e0d\u6e05\u695a\u7684\u968f\u65f6@\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u641e\u5b9a~\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5174\u8da3\u6e38\u4e50\u7ebf**\u3011\u3002\u907f\u514d\u9ad8\u538b\u3001\u786c\u6838\u7684\u201c\u641e\u94b1\u201d\u8bdd\u672f\uff0c\u5f3a\u8c03AI\u521b\u4f5c\u7684\u8da3\u5473\u6027\u3001\u521b\u610f\u6027\u548c\u793e\u7fa4\u5171\u521b\u7684\u4e50\u8da3\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u53ef\u8865\u5145\u3010**\u793e\u7fa4\u6c1b\u56f4\u7ec4\u89d2\u8272**\u3011\uff0c\u9080\u8bf7\u5176\u53c2\u4e0e\u7b80\u5355\u7684\u793e\u7fa4\u4e92\u52a8\u4efb\u52a1\uff08\u5982\u6d3b\u52a8\u63d0\u9192\u5b98\u3001\u6c1b\u56f4\u70b9\u8d5e\u5b98\uff09\uff0c\u6ee1\u8db3\u5176\u793e\u4ea4\u5f52\u5c5e\u611f\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u6700\u540e\u540d\u989d\u201d\u3001\u201c\u5012\u8ba1\u65f6\u201d\u3001\u201c\u5b66\u5b8c\u9a6c\u4e0a\u63a5\u5355\u201d\u7b49\u9ad8\u538b\u529b\u8bdd\u672f\u8fdb\u884c\u903c\u5355\u6216\u65bd\u538b\u3002\u907f\u514d\u5e03\u7f6e\u8fc7\u4e8e\u590d\u6742\u3001\u8017\u65f6\u7684\u786c\u6838\u4f5c\u4e1a\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u521d\u671f\u8fdb\u884c\u5927\u989d\u5347\u5355\u63a8\u4ecb**\u3002\u53ef\u89c2\u5bdf\u5176\u53c2\u4e0e\u6df1\u5ea6\u540e\uff0c\u914c\u60c5\u63a8\u8350\u4f4e\u5ba2\u5355\u3001\u9ad8\u60c5\u7eea\u4ef7\u503c\u7684\u5468\u8fb9\u4ea7\u54c1\uff08\u5982AI\u58f0\u97f3\u76f2\u76d2\u3001\u865a\u62df\u5934\u50cf\u5b9a\u5236\uff09\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u65e9\u4e0a\u597d\uff0c\u9152\u4e66\u73ed\u73ed\uff0c\u6628\u5929\u65e0\u6781\u8001\u5e08\u5206\u4eab\u7684\u98de\u4e66\u8fde\u63a5\u6709\u95ee\u9898\uff0c\u6709\u65b0\u8fde\u63a5\u5417\u201d \u2014 **\uff08\u5c55\u793a\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\u80fd\u529b\uff0c\u975e\u60c5\u7eea\u5316\u62b1\u6028\uff09**\n2. > \u201c\u6536\u5230\uff0c\u8c22\u8c22\u73ed\u73ed\u201d \u2014 **\uff08\u9ad8\u9891\u51fa\u73b0\u7684\u793c\u8c8c\u6027\u3001\u89c4\u5219\u9075\u4ece\u6027\u56de\u5e94\uff09**\n3. > \u201c\u597d\uff0c\u8981\u591a\u5c1d\u8bd5\u7684\u201d \u2014 **\uff08\u5bf9\u9f13\u52b1\u6027\u5efa\u8bae\u7684\u6b63\u9762\u4f46\u975e\u72c2\u70ed\u56de\u5e94\uff09**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T5 \u597d\u73a9\u5c1d\u9c9c\u8005\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u6709\u5e8f\u3001\u6709\u8da3\u7684\u793e\u7fa4\u4e2d\u83b7\u5f97\u966a\u4f34\u4e0e\u5f52\u5c5e\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u4fdd\u6301\u8bfe\u7a0b\u4e0e\u670d\u52a1\u7684\u8f7b\u91cf\u5316\u3001\u8da3\u5473\u5316\uff0c\u907f\u514d\u65bd\u52a0\u786c\u6838\u53d8\u73b0\u538b\u529b\uff0c\u7528\u793e\u7fa4\u4e92\u52a8\u7ed1\u5b9a\u5176\u53c2\u4e0e\u611f\u3011**\u3002\n\n```json\n{\"core_type\": \"T5 \u597d\u73a9\u5c1d\u9c9c\u8005\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u793e\u4ea4\u966a\u4f34\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
