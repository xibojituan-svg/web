    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u8bb8\u66d9\u6656 (UID: 676984105) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-03 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u4e03\u6708\u4f73\u97f3(\u5468\u5c0f\u797a) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u7cbe\u82f1\u8bfe\u3001\u8fdb\u9636\u8bfe\u3001\u540e\u671f\u8bfe (\u5df2\u8d2d) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u7f3a\u5931** (\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u652f\u4ed8\u65b9\u5f0f) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u9700\u4e0a\u73ed\uff0c\u5229\u7528\u5468\u672b\u548c\u4e0b\u73ed\u540e\u65f6\u95f4\u5f55\u97f3\u3001\u8c03\u8bd5) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** (\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5bb6\u5ead\u6001\u5ea6) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49** (\u5b66\u4e60\u884c\u4e3a\u4e0e\u6001\u5ea6\u4fe1\u606f\u9971\u6ee1\uff0c\u4f46\u5173\u952e\u5bb6\u5ead\u3001\u652f\u4ed8\u4fe1\u606f\u7f3a\u5931) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u6709\u660e\u786e\u7684\u6280\u80fd\u7cbe\u8fdb\u8bc9\u6c42\uff0c\u5173\u6ce8\u53d1\u97f3\u7ec6\u8282\u3001\u8f6f\u4ef6\u64cd\u4f5c\u3001\u8bfe\u7a0b\u5185\u5bb9\uff0c\u4f46\u4e5f\u8be2\u95ee\u201c\u7248\u6743\u4e66\u5982\u4f55\u6f14\u64ad\u53d8\u73b0\u201d\uff0c\u8868\u660e\u5bf9\u53d8\u73b0\u8def\u5f84\u6709\u671f\u5f85\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u81f3\u4e8e\u6c14\u606f\u8bad\u7ec3\u53ea\u80fd\u5728\u4e0b\u73ed\u540e\u4eba\u5c11\u7684\u5730\u65b9\uff0c\u56e0\u4e3a\u592a\u5b89\u9759\u7684\u5730\u65b9\u5c31\u6210\u663e\u773c\u5305\u4e86\u201d (\u4f53\u73b0\u4e3a\u5174\u8da3\u6295\u5165\uff0c\u4f46\u53d7\u73b0\u5b9e\u6761\u4ef6\u9650\u5236)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 \u5df2\u8d2d\u4e70\u591a\u95e8\u8bfe\u7a0b\uff08\u7cbe\u82f1\u3001\u8fdb\u9636\u3001\u540e\u671f\uff09\uff0c\u5e76\u54a8\u8be2\u8bbe\u5907\u76f8\u5173\u8d60\u8bfe\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u652f\u4ed8\u80fd\u529b\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u8d22\u52a1\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 **\u4e0a\u73ed\u65cf**\uff0c\u65f6\u95f4\u9700\u201c\u62fc\u51d1\u201d\uff08\u201c\u5230\u5468\u672b\uff0c\u5468\u516d\u7684\uff0c\u5468\u5929\u4e86\u624d\u80fd\u518d\u5f55\u201d\uff09\uff0c\u4e14\u4e0a\u73ed\u671f\u95f4\u4e0d\u4fbf\u7ec3\u4e60\uff08\u201c\u4e0a\u73ed\u4e0d\u5141\u8bb8\u201d\uff09\u3002\u7cbe\u529b\u88ab\u5de5\u4f5c\u5206\u5272\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff0c**\u9700\u91cd\u70b9\u6838\u5b9e**\u3002\u6b64\u7ef4\u5ea6\u7f3a\u5931\u5bfc\u81f4\u8bc4\u7ea7\u7f6e\u4fe1\u5ea6\u4e0b\u964d\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u8bdd\u7b52\u6ca1\u58f0\u97f3\u3001\u8f6f\u4ef6\u64cd\u4f5c\uff09\u65f6\uff0c\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff08\u53d1\u8fdc\u7a0b\u63a7\u5236\u94fe\u63a5\u3001\u8be2\u95ee\u5177\u4f53\u64cd\u4f5c\uff09\uff0c\u867d\u6709\u77ed\u6682\u62b1\u6028\u5ba2\u670d\u54cd\u5e94\u6162\uff0c\u4f46\u5728\u83b7\u5f97\u6307\u5bfc\u540e\u80fd\u8fc5\u901f\u8ddf\u8fdb\u5e76\u89e3\u51b3\u95ee\u9898\u3002\u9762\u5bf9\u4e13\u4e1a\u6279\u8bc4\uff08\u201c\u53e3\u8154\u72b6\u6001\u548c\u6f14\u64ad\u72b6\u6001\u4e0d\u4f73\u201d\uff09\u65f6\uff0c\u80fd\u4e3b\u52a8\u8bf7\u6559\u3001\u7406\u89e3\u5e76\u8f6c\u5316\u4e3a\u5177\u4f53\u884c\u52a8\u65b9\u6848\uff08\u201c\u5047\u5b9a\u5728\u8336\u9986\u91cc\u7ed9\u4eba\u8bf4\u4e66\u201d\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u55ef\uff0c\u4ee5\u540e\u6f14\u64ad\u65f6\u6211\u5047\u5b9a\u5728\u8336\u9986\u91cc\u7ed9\u4eba\u8bf4\u4e66\uff0c\u6548\u679c\u5e94\u8be5\u4f1a\u597d\u4e00\u4e9b\u3002\u8fd9\u6837\u65e2\u8981\u63d0\u7740\u52b2\u6709\u8868\u8fbe\u6b32\u671b\uff0c\u53c8\u8981\u8db3\u591f\u677e\u5f1b\u4e0d\u50f5\u786c\u3002\u201d (\u9762\u5bf9\u6279\u8bc4\u540e\u7684\u79ef\u6781\u601d\u8003\u4e0e\u7b56\u7565\u8c03\u6574)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u4e13\u4e1a\u80fd\u529b\u83b7\u5f97\u8ba4\u53ef\u4e0e\u81ea\u6211\u7cbe\u8fdb\u7684\u6e34\u671b**\u3002\u4ed6\u4e0d\u4ec5\u81ea\u5df1\u8ba4\u771f\u7ec3\u4e60\uff0c\u8fd8\u4e3b\u52a8\u3001\u7ec6\u81f4\u5730\u70b9\u8bc4\u5176\u4ed6\u540c\u5b66\u7684\u4f5c\u4e1a\uff08\u6307\u51fa\u201c\u5320\u201d\u3001\u201c\u7fa4\u201d\u7684\u524d\u540e\u9f3b\u97f3\uff0c\u201c\u523d\u5b50\u624b\u201d\u7684\u8bfb\u97f3\u7b49\uff09\uff0c\u5c55\u73b0\u51fa\u5f3a\u70c8\u7684\u201c\u5708\u5185\u4eba\u201d\u8eab\u4efd\u8ba4\u540c\u548c\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u7684\u9700\u6c42\u3002\u53d8\u73b0\u662f\u8def\u5f84\uff0c\u4f46**\u6210\u4e3a\u88ab\u8ba4\u53ef\u7684\u201c\u4e13\u4e1a\u8005\u201d\u662f\u5185\u6838\u9a71\u52a8\u529b**\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u201c\u88ab\u770b\u89c1\u201d\u4e0e\u201c\u88ab\u80af\u5b9a\u201d**\u3002\u5c06\u4ed6\u89c6\u4e3a\u201c\u6f5c\u529b\u4e13\u4e1a\u8005\u201d\u800c\u975e\u201c\u5c0f\u767d\u5b66\u5458\u201d\uff0c\u7ed9\u4e88\u5176\u6280\u672f\u7ec6\u8282\u4e0a\u7684\u7cbe\u51c6\u53cd\u9988\uff0c\u5e76\u521b\u9020\u8ba9\u5176\u5c55\u793a\u4e13\u4e1a\u89c1\u89e3\uff08\u5982\u70b9\u8bc4\u4ed6\u4eba\uff09\u7684\u673a\u4f1a\uff0c\u6ee1\u8db3\u5176\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\u7684\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u52a8\u673a\u4e2d\u7b49\u3001\u8d44\u6e90\u4e2d\u7b49\u3001\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u5c5e\u4e8e\u53ef\u57f9\u517b\u7684\u6f5c\u529b\u7528\u6237) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u5173\u6ce8\u786c\u6838\u6280\u80fd\u7ec6\u8282\uff0c\u4e3b\u52a8\u7ec3\u4e60\u5e76\u5e2e\u52a9\u540c\u5b66\uff0c\u4e0d\u5f20\u626c\u4f46\u8ffd\u6c42\u5185\u5728\u4e13\u4e1a\u8ba4\u53ef) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a[\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5c5e\u5f3a\u70c8\u53cd\u5bf9\u7b49\u7ea2\u7ebf\u4fe1\u53f7]\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | **\u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u9700\u8b66\u60d5**\u3002\u82e5\u62a5\u540d/\u8d2d\u8bfe\u4e3a\u9690\u7792\u5bb6\u4eba\u6216\u4f7f\u7528\u5bb6\u5ead\u91cd\u8981\u8d44\u91d1\uff0c\u98ce\u9669\u5c06\u6025\u5267\u5347\u9ad8\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u4e3b\u8981\u98ce\u9669\u70b9\u3002\u5de5\u4f5c\u7e41\u5fd9\u5bfc\u81f4\u4f5c\u4e1a\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u7126\u8651\u548c\u81ea\u8d23\uff0c\u5c24\u5176\u5728\u8bfe\u7a0b\u4e2d\u540e\u671f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u6280\u672f\u95ee\u9898\u80fd\u81ea\u884c\u6d88\u5316\uff0c\u4e13\u4e1a\u6279\u8bc4\u80fd\u8f6c\u5316\u4e3a\u52a8\u529b\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4f4e** | \u5f53\u524d\u5173\u6ce8\u70b9\u66f4\u504f\u5411\u6280\u80fd\u7cbe\u8fdb\uff0c\u5bf9\u201c\u5feb\u901f\u66b4\u5bcc\u201d\u9884\u671f\u4e0d\u660e\u663e\u3002\u4f46\u82e5\u957f\u671f\u65e0\u6b63\u5411\u53cd\u9988\uff08\u5982\u8bd5\u97f3\u65e0\u679c\uff09\uff0c\u53ef\u80fd\u4ea7\u751f\u4ef7\u503c\u8d28\u7591\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u8bfe\u7a0b\u7b2c4-8\u5468\uff08\u6b7b\u4ea1\u8c37\u9636\u6bb5\uff09**\u3002\u5f53\u5de5\u4f5c\u4e0e\u5b66\u4e60\u538b\u529b\u53e0\u52a0\uff0c\u4f5c\u4e1a\u96be\u5ea6\u548c\u91cf\u7ea7\u63d0\u5347\uff0c\u65f6\u95f4\u65e0\u6cd5\u517c\u987e\u65f6\uff0c\u6613\u4ea7\u751f\u6301\u7eed\u7126\u8651\u5e76\u840c\u751f\u9000\u610f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u66d9\u6656\uff0c\u770b\u4e86\u4f60\u7684\u7ec3\u4e60\u548c\u7ed9\u540c\u5b66\u7684\u70b9\u8bc4\uff0c\u80fd\u611f\u89c9\u5230\u4f60\u5bf9\u7ec6\u8282\u7684\u8ffd\u6c42\u548c\u4e13\u4e1a\u4e0a\u7684\u8f83\u771f\u52b2\u513f\uff0c\u8fd9\u7279\u522b\u5b9d\u8d35\u3002\u54b1\u4eec\u73ed\u5c31\u9700\u8981\u4f60\u8fd9\u6837\u80fd\u6c89\u4e0b\u5fc3\u6253\u78e8\u624b\u827a\u7684\u540c\u5b66\u3002\u6211\u77e5\u9053\u4f60\u5e73\u65f6\u5de5\u4f5c\u5fd9\uff0c\u65f6\u95f4\u5f97\u6324\uff0c\u54b1\u4eec\u4e0d\u8ffd\u6c42\u901f\u5ea6\uff0c\u5c31\u76ef\u4f4f\u6bcf\u4e00\u4e2a\u5c0f\u8fdb\u6b65\u3002\u9047\u5230\u65f6\u95f4\u51b2\u7a81\u968f\u65f6\u8ddf\u6211\u8bf4\uff0c\u54b1\u4eec\u4e00\u8d77\u8c03\u6574\u8282\u594f\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176T2\u5b9e\u5e72\u578b\u7279\u8d28\uff0c\u63d0\u4f9b\u624e\u5b9e\u7684\u6280\u80fd\u8bad\u7ec3\u548c\u7ec6\u8282\u6307\u5bfc\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\u7684\u7279\u70b9\uff0c\u8865\u5145 **\u3010\u7075\u6d3b\u65f6\u95f4\u7ba1\u7406\u5305\u3011**\uff08\u5982\uff1a\u63d0\u4f9b\u5f55\u64ad\u8bfe\u91cd\u70b9\u5207\u7247\u3001\u5141\u8bb8\u4f5c\u4e1a\u5f39\u6027\u63d0\u4ea4\uff09\u3002\u9488\u5bf9\u5176\u5c0a\u91cd\u9700\u6c42\uff0c\u53ef\u914c\u60c5\u8d4b\u4e88 **\u3010\u8f7b\u91cf\u7ea7\u73ed\u59d4/\u70b9\u8bc4\u5b98\u8eab\u4efd\u3011**\uff0c\u6ee1\u8db3\u5176\u201c\u88ab\u770b\u89c1\u201d\u7684\u6df1\u5c42\u9700\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u5ffd\u89c6\u4ed6\u7684\u4e13\u4e1a\u63d0\u95ee**\u3002\u5bf9\u4ed6\u7684\u6280\u672f\u95ee\u9898\uff08\u5982AU\u64cd\u4f5c\u3001\u53d1\u97f3\uff09\u5fc5\u987b\u7ed9\u4e88\u4e13\u4e1a\u3001\u5177\u4f53\u7684\u89e3\u7b54\u30022. **\u7ed9\u4ed6\u753b\u4e0d\u5207\u5b9e\u9645\u7684\u201c\u5feb\u94b1\u201d\u5927\u997c**\u3002\u4ea4\u6d41\u91cd\u70b9\u5e94\u653e\u5728\u80fd\u529b\u6210\u957f\u548c\u884c\u4e1a\u8ba4\u77e5\u4e0a\u30023. **\u7528\u6a21\u677f\u5316\u7684\u201c\u52a0\u6cb9\u201d\u6577\u884d**\u3002\u53cd\u9988\u9700\u5177\u4f53\u3001\u6709\u9488\u5bf9\u6027\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u8fdb\u884c\u5408\u7406\u5347\u5355**\u3002\u56e0\u5176\u5df2\u8d2d\u591a\u95e8\u8bfe\u7a0b\uff0c\u4e14\u6709\u6301\u7eed\u5b66\u4e60\u610f\u613f\uff0c\u53ef\u57fa\u4e8e\u5176\u6280\u80fd\u8fdb\u9636\u8def\u5f84\uff08\u5982\u4ece\u6f14\u64ad\u5230\u540e\u671f\u5236\u4f5c\uff09\uff0c\u63a8\u8350\u76f8\u5173\u9ad8\u9636\u8bfe\u7a0b\u6216\u670d\u52a1\uff0c\u4f46\u9700\u7d27\u5bc6\u7ed3\u5408\u5176\u5b9e\u9645\u65f6\u95f4\u5b89\u6392\uff0c\u907f\u514d\u9020\u6210\u538b\u529b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u54ce\uff0c\u8001\u53d1\uff0c\u4f60\u90a3\u4e2a\u6574\u4f53\u90fd\u633a\u597d\u7684\uff0c\u90fd\u6bd4\u8f83\u6807\u51c6\uff0c\u4e2d\u95f4\u5c31\u662f\u6709\u5320\u4eba\u7684\u5320\uff0c\u8fd8\u6709\u4e00\u7fa4\u7684\u7fa4\uff0c\u8fd9\u4e24\u4e2a\u524d\u540e\u9f3b\u97f3\u597d\u50cf\u4e0d\u662f\u592a\u5230\u4f4d\uff0c\u518d\u5c31\u662f\u6a58\u6c34\u7684\u6a58\u662f\u4e8c\u58f0\uff0c\u55ef\uff0c\u5176\u4ed6\u7684\u90fd\u975e\u5e38\u597d\u3002\u201d **(T2\u539f\u578b\u8bc1\u636e\uff1a\u4e3b\u52a8\u3001\u7ec6\u81f4\u5730\u70b9\u8bc4\u4ed6\u4eba\uff0c\u8ffd\u6c42\u4e13\u4e1a\u7cbe\u51c6)**\n2. > \u201c\u55ef\uff0c\u4ee5\u540e\u6f14\u64ad\u65f6\u6211\u5047\u5b9a\u5728\u8336\u9986\u91cc\u7ed9\u4eba\u8bf4\u4e66\uff0c\u6548\u679c\u5e94\u8be5\u4f1a\u597d\u4e00\u4e9b\u3002\u8fd9\u6837\u65e2\u8981\u63d0\u7740\u52b2\u6709\u8868\u8fbe\u6b32\u671b\uff0c\u53c8\u8981\u8db3\u591f\u677e\u5f1b\u4e0d\u50f5\u786c\u3002\u201d **(\u9ad8\u5fc3\u7406\u5f39\u6027\u8bc1\u636e\uff1a\u5c06\u6279\u8bc4\u8f6c\u5316\u4e3a\u5177\u4f53\u3001\u6709\u521b\u610f\u7684\u89e3\u51b3\u65b9\u6848)**\n3. > \u201c\u81f3\u4e8e\u6c14\u606f\u8bad\u7ec3\u53ea\u80fd\u5728\u4e0b\u73ed\u540e\u4eba\u5c11\u7684\u5730\u65b9\uff0c\u56e0\u4e3a\u592a\u5b89\u9759\u7684\u5730\u65b9\u5c31\u6210\u663e\u773c\u5305\u4e86\u201d **(\u8d44\u6e90\u5e95\u5ea7\u4e2d\u8bc1\u636e\uff1a\u6709\u5b66\u4e60\u610f\u613f\uff0c\u4f46\u53d7\u9650\u4e8e\u73b0\u5b9e\u5de5\u4f5c\u4e0e\u73af\u5883)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2\u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d\u7b49**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u7cbe\u51c6\u7684\u4e13\u4e1a\u53cd\u9988+\u7075\u6d3b\u7684\u65f6\u95f4\u7ba1\u7406\u652f\u6301\uff0c\u5e76\u4e25\u9632\u5176\u56e0\u5de5\u4f5c\u7e41\u5fd9\u5bfc\u81f4\u7684\u201c\u8ddf\u4e0d\u4e0a\u201d\u7126\u8651**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u7075\u6d3b\u65f6\u95f4\u7ba1\u7406\u5305\"}\n```";
