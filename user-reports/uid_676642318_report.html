    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u4e0e\u98ce\u63a7\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u7f3a\u5931\u5173\u952e\u4fe1\u606f\uff1a\u652f\u4ed8\u8bb0\u5f55\u3001\u8bfe\u7a0b\u8d2d\u4e70\u8be6\u60c5\u3001\u5bb6\u5ead\u51b3\u7b56\u7ed3\u6784\u3001\u5177\u4f53\u804c\u4e1a\u4e0e\u6536\u5165\u3001\u8fc7\u5f80\u5b66\u4e60\u6295\u5165\u53f2\u3001\u660e\u786e\u7684\u5347\u5355/\u7eed\u8d39\u610f\u5411\u8868\u8fbe\u3002\n\n---\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n\n*   **\u52a8\u673a\u7eaf\u5ea6 (B+)**\n    *   **\u5f3a\u4fe1\u53f7**\uff1a\u9ad8\u5ea6\u6c89\u6d78\u4e8e\u8bfe\u7a0b\u5b9e\u8df5\u9879\u76ee\uff08\u6709\u58f0\u4e4b\u591c\u540e\u671f\u5236\u4f5c\uff09\uff0c\u4e3b\u52a8\u62c5\u4efb\u5c0f\u7ec4\u9879\u76ee**\u7ec4\u7ec7\u8005\u4e0e\u6838\u5fc3\u540e\u671f**\uff0c\u6295\u5165\u5927\u91cf\u65f6\u95f4\u8fdb\u884c\u4efb\u52a1\u5206\u914d\u3001\u8fdb\u5ea6\u534f\u8c03\u3001\u8d28\u91cf\u628a\u63a7\uff08\u5982\u7edf\u4e00\u5f55\u97f3\u6807\u51c6\u3001\u5904\u7406\u5e72\u97f3\u3001\u6dfb\u52a0\u97f3\u6548\u3001\u5bf9\u8f68\u3001\u8c03\u6574\u65f6\u957f\uff09\u3002\n    *   **\u5f3a\u4fe1\u53f7**\uff1a\u9891\u7e41\u5206\u4eab\u3001\u5206\u6790\u97f3\u4e50/\u97f3\u6548\u7d20\u6750\uff08\u5982\u201c\u963f\u9cb2-\u6735\u6735\u7684\u8eab\u4e16.mp3\u201d\u3001\u201c\u4f4e\u6c89\u8870\u8d25\u4e2d\u6709\u4e00\u4e9b\u660e\u4eae\u7684\u8c03\u5b50\uff0c\u662f\u4e0d\u706d\u7684\u52c7\u6c14\u201d\uff09\uff0c\u5c55\u73b0\u5bf9**\u58f0\u97f3\u827a\u672f**\u7684\u6df1\u5c42\u5174\u8da3\u4e0e\u5ba1\u7f8e\u8ffd\u6c42\u3002\n    *   **\u4e2d\u6027\u4fe1\u53f7**\uff1a\u52a8\u673a\u96c6\u4e2d\u4e8e**\u6280\u80fd\u7cbe\u8fdb\u4e0e\u4f5c\u54c1\u5b8c\u6210\u5ea6**\uff0c\u672a\u76f4\u63a5\u8868\u9732\u660e\u786e\u7684\u804c\u4e1a\u53d8\u73b0\u6216\u526f\u4e1a\u589e\u6536\u8bc9\u6c42\u3002\u5b66\u4e60\u884c\u4e3a\u9ad8\u5ea6\u5185\u9a71\uff0c\u4f46\u5546\u4e1a\u76ee\u7684\u6027\u6a21\u7cca\u3002\n\n*   **\u8d44\u6e90\u5e95\u5ea7 (B)**\n    *   **\u5f3a\u4fe1\u53f7**\uff1a**\u65f6\u95f4\u8d44\u6e90\u5145\u6c9b**\u3002\u80fd\u6301\u7eed\u6570\u65e5\u9ad8\u5f3a\u5ea6\u6295\u5165\u5c0f\u7ec4\u534f\u4f5c\u9879\u76ee\uff0c\u534f\u8c03\u591a\u4eba\u8fdb\u5ea6\uff0c\u5e76\u4e3b\u52a8\u8fdb\u884c\u590d\u6742\u7684\u540e\u671f\u5236\u4f5c\u3002\n    *   **\u5f3a\u4fe1\u53f7**\uff1a**\u8bbe\u5907\u4e0e\u5b66\u4e60\u5de5\u5177\u6295\u5165**\u3002\u62e5\u6709\u4e13\u4e1a\u5f55\u97f3\u8bbe\u5907\uff08\u63d0\u53caAu\u5f55\u97f3\uff09\uff0c\u4e3b\u52a8\u54a8\u8be2\u8bbe\u5907\u8c03\u8bd5\u95ee\u9898\uff08\u5e95\u566a\uff09\uff0c\u5e76**\u81ea\u8d39\u8d2d\u4e702T\u786c\u76d8**\uff08\u540e\u56e0\u201c\u88c5\u4fee\u8425\u671f\u5305\u201d\u4e0d\u591f\u7528\uff0c\u518d\u6b21\u8d2d\u4e70\u66f4\u5927\u5bb9\u91cf\u786c\u76d8\uff09\uff0c\u663e\u793a\u51fa\u4e3a\u5b66\u4e60\u6301\u7eed\u6295\u8d44\u7684\u610f\u613f\u548c\u80fd\u529b\u3002\n    *   **\u5f31\u4fe1\u53f7**\uff1a\u7ecf\u6d4e\u80fd\u529b\u7ec6\u8282\uff08\u804c\u4e1a\u3001\u6536\u5165\u3001\u57ce\u5e02\uff09\u672a\u77e5\u3002\u4f46\u4ece\u6d88\u8d39\u51b3\u7b56\uff08\u8d2d\u4e70\u786c\u76d8\uff09\u770b\uff0c\u5177\u5907\u4e00\u5b9a\u53ef\u652f\u914d\u8d44\u91d1\u3002\n\n*   **\u5fc3\u7406\u5f39\u6027 (A-)**\n    *   **\u5f3a\u4fe1\u53f7**\uff1a**\u6781\u5f3a\u7684\u8d23\u4efb\u5fc3\u4e0e\u9886\u5bfc\u529b**\u3002\u5728\u5c0f\u7ec4\u9879\u76ee\u4e2d\u4e3b\u52a8\u627f\u62c5\u7edf\u7b79\u89d2\u8272\uff0c\u63a8\u52a8\u8fdb\u5ea6\uff08\u201c\u4e0d\u80fd\u518d\u7b49\u4e86\u201d\uff09\uff0c\u8010\u5fc3\u6307\u5bfc\u540c\u4f34\u6280\u672f\u95ee\u9898\uff08\u5982Au\u5bfc\u51famp3\uff09\uff0c\u5904\u7406\u5206\u6b67\uff0c\u9f13\u52b1\u56e2\u961f\uff08\u201c\u91cd\u5728\u53c2\u4e0e...\u7ed3\u679c\u5982\u4f55\u90fd\u503c\u5f97\u6211\u4eec\u7ed9\u81ea\u5df1\u7ad6\u8d77\u5927\u62c7\u6307\u201d\uff09\u3002\n    *   **\u5f3a\u4fe1\u53f7**\uff1a**\u95ee\u9898\u89e3\u51b3\u5bfc\u5411**\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u5e95\u566a\u3001\u683c\u5f0f\u9519\u8bef\u3001\u89e3\u538b\u5bc6\u7801\uff09\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\u6216\u8be2\u95ee\u8001\u5e08\uff0c\u800c\u975e\u62b1\u6028\u3002\n    *   **\u5f3a\u4fe1\u53f7**\uff1a**\u9ad8\u914d\u5408\u5ea6\u4e0e\u793c\u8c8c**\u3002\u5bf9\u73ed\u4e3b\u4efb\uff08\u73ed\u73ed\u3001\u5c0f\u73ed\u732a\uff09\u56de\u590d\u53ca\u65f6\u3001\u793c\u8c8c\uff0c\u4f7f\u7528\u656c\u8bed\uff0c\u4e3b\u52a8\u63d0\u4ea4\u4f5c\u4e1a\uff0c\u611f\u8c22\u8001\u5e08\u3002\n    *   **\u4e2d\u6027\u4fe1\u53f7**\uff1a\u672a\u906d\u9047\u660e\u663e\u632b\u6298\uff0c\u6297\u538b\u80fd\u529b\u672a\u53d7\u6781\u7aef\u6d4b\u8bd5\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u8bb0\u5f55\u4e2d\u4ec5\u6709**\u786c\u76d8\u8d2d\u4e70**\u884c\u4e3a\uff0c\u672a\u63d0\u53ca\u8bfe\u7a0b\u652f\u4ed8\u3002**\u5173\u952e\u652f\u4ed8\u4fe1\u606f\u7f3a\u5931**\uff0c\u65e0\u6cd5\u5b8c\u6210A0\u5224\u5b9a\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u6240\u6709\u6c9f\u901a\u5747\u4e3a\u4e2a\u4eba\u51b3\u7b56\uff08\u8d2d\u4e70\u786c\u76d8\u3001\u7ec4\u7ec7\u5b66\u4e60\uff09\uff0c\u672a\u63d0\u53ca\u914d\u5076\u6216\u5bb6\u4eba\u610f\u89c1\u3002**\u63a8\u65ad\u4e3a\u72ec\u7acb\u51b3\u7b56\u8005**\u3002\n*   **\u6b65\u9aa41-4\u7efc\u5408\u63a8\u65ad**\uff1a\n    *   **\u5b66\u4e60\u6295\u5165\u5ea6 (A)**\uff1a\u6781\u9ad8\uff0c\u8fdc\u8d85\u8bfe\u7a0b\u57fa\u7840\u8981\u6c42\uff0c\u8fdb\u5165\u9879\u76ee\u5b9e\u8df5\u4e0e\u521b\u4f5c\u5c42\u9762\u3002\n    *   **\u76ee\u6807\u6e05\u6670\u5ea6 (B)**\uff1a\u6280\u80fd\u7cbe\u8fdb\u76ee\u6807\u6e05\u6670\uff0c\u4f46\u5546\u4e1a\u53d8\u73b0\u8def\u5f84\u6a21\u7cca\u3002\n    *   **\u8d44\u6e90\u5339\u914d\u5ea6 (B+)**\uff1a\u65f6\u95f4\u3001\u8bbe\u5907\u3001\u91d1\u94b1\u6295\u5165\u610f\u613f\u5f3a\uff0c\u4e0e\u9ad8\u9636\u6280\u80fd\u5b66\u4e60\u9700\u6c42\u5339\u914d\u3002\n    *   **\u7efc\u5408\u5224\u5b9a\u503e\u5411**\uff1a**B+\u7c7b\u7528\u6237\uff08\u9ad8\u6f5c\u6df1\u8015\u8005\uff09**\u3002\u5177\u5907A\u7c7b\u7684\u6295\u5165\u4e0e\u70ed\u60c5\uff0c\u4f46\u5546\u4e1a\u52a8\u673a\u672a\u663e\u6027\u5316\uff0c\u6682\u672a\u8fdb\u5165\u660e\u786e\u7684\u5347\u5355\u8f6c\u5316\u901a\u9053\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n\n*   **\u5339\u914d\u539f\u578b\uff1aT3 \u5320\u4eba\u8ffd\u6c42\u578b**\n    *   **\u6838\u5fc3\u7279\u5f81**\uff1a\u75f4\u8ff7\u4e8e\u6280\u827a\u672c\u8eab\uff0c\u4eab\u53d7\u521b\u4f5c\u8fc7\u7a0b\u4e0e\u4f5c\u54c1\u6253\u78e8\uff0c\u5bf9\u7ec6\u8282\u6709\u6781\u81f4\u8981\u6c42\uff08\u5982\u97f3\u4e50\u60c5\u7eea\u6807\u6ce8\u3001\u97f3\u6548\u8bbe\u8ba1\u3001\u5de6\u53f3\u58f0\u9053\u3001\u65f6\u957f\u63a7\u5236\uff09\u3002\n    *   **\u884c\u4e3a\u5370\u8bc1**\uff1a\u4e3b\u5bfc\u6709\u58f0\u4e4b\u591c\u9879\u76ee\uff0c\u5173\u6ce8\u97f3\u4e50\u4e0e\u5267\u60c5\u7684\u60c5\u7eea\u5339\u914d\uff0c\u53cd\u590d\u8c03\u6574\u540e\u671f\u7ec6\u8282\uff0c\u8ffd\u6c42\u4f5c\u54c1\u5b8c\u6574\u6027\u4e0e\u827a\u672f\u8868\u8fbe\u3002\n    *   **\u504f\u79bb\u70b9**\uff1a\u672a\u8868\u73b0\u51faT3\u5178\u578b\u7684\u5185\u5411\u4e0e\u6392\u65a5\u793e\u4ea4\u7279\u5f81\uff0c\u53cd\u800c\u5c55\u73b0\u51fa\u8f83\u5f3a\u7684\u793e\u7fa4\u7ec4\u7ec7\u4e0e\u534f\u8c03\u80fd\u529b\uff08**\u517c\u5177\u90e8\u5206T1\u9886\u5bfc\u8005\u7279\u8d28**\uff09\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n\n*   **\u6574\u4f53\u98ce\u9669\uff1a\u4f4e**\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a\u98ce\u9669**\u4f4e**\u3002\u7528\u6237\u5df2\u8fdb\u5165\u6df1\u5ea6\u5b9e\u8df5\u5e76\u4ea7\u51fa\u4f5c\u54c1\uff0c\u83b7\u5f97\u611f\u548c\u6210\u5c31\u611f\u5f3a\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a\u98ce\u9669**\u4f4e**\u3002\u6709\u81ea\u4e3b\u6d88\u8d39\u884c\u4e3a\uff08\u786c\u76d8\uff09\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u56f0\u96be\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a\u98ce\u9669**\u4e2d\u4f4e**\u3002\u76ee\u524d\u65f6\u95f4\u6295\u5165\u5ea6\u9ad8\uff0c\u4f46\u82e5\u672a\u6765\u9879\u76ee\u7ed3\u675f\uff0c\u9ad8\u5f3a\u5ea6\u6295\u5165\u53ef\u80fd\u96be\u4ee5\u4e3a\u7ee7\uff0c\u9700\u5173\u6ce8\u5b66\u4e60\u8282\u594f\u7684\u53ef\u6301\u7eed\u6027\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a\u98ce\u9669**\u4f4e**\u3002\u51b3\u7b56\u72ec\u7acb\u6027\u9ad8\u3002\n    5.  **\u9500\u552e\u8bef\u5bfc**\uff1a\u98ce\u9669**\u4f4e**\u3002\u8bb0\u5f55\u4e2d\u9500\u552e\u591a\u4e3a\u6807\u51c6\u5e7f\u64ad\uff0c\u65e0\u8fc7\u5ea6\u627f\u8bfa\u75d5\u8ff9\u3002\u7528\u6237\u63d0\u95ee\u96c6\u4e2d\u4e8e\u6280\u672f\u5b9e\u64cd\u3002\n    6.  **\u670d\u52a1\u4f53\u9a8c**\uff1a\u98ce\u9669**\u4f4e**\u3002\u7528\u6237\u4e0e\u73ed\u4e3b\u4efb\u3001\u6280\u672f\u52a9\u6559\u4e92\u52a8\u6b63\u5e38\uff0c\u672a\u8868\u8fbe\u4e0d\u6ee1\u3002\n    7.  **\u5e73\u53f0/\u5e08\u8d44\u95ee\u9898**\uff1a\u98ce\u9669**\u4f4e**\u3002\u672a\u63d0\u53ca\u76f8\u5173\u95ee\u9898\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n\n*   **\u672a\u53d1\u73b0\u91cd\u5927\u98ce\u9669**\u3002\n*   **\u6f5c\u5728\u5173\u6ce8\u70b9**\uff1a\u7528\u6237\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u201c\u5949\u732e\u8005\u201d\u503e\u5411\uff0c\u4e3a\u5c0f\u7ec4\u9879\u76ee\u4ed8\u51fa\u6781\u591a\u3002\u9700\u786e\u4fdd\u73ed\u4e3b\u4efb\u5728\u9f13\u52b1\u5176\u70ed\u60c5\u7684\u540c\u65f6\uff0c**\u907f\u514d\u8fc7\u5ea6\u6d88\u8017\u7528\u6237**\uff0c\u5e94\u5f15\u5bfc\u5176\u5e73\u8861\u4ed8\u51fa\u4e0e\u81ea\u6211\u6210\u957f\uff0c\u5e76\u7ed9\u4e88\u5176\u8d21\u732e\u5145\u5206\u7684\u8ba4\u53ef\u4e0e\u5956\u52b1\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n\n*   **\u6838\u5fc3\u7b56\u7565**\uff1a**\u8ba4\u53ef\u5176\u201c\u5320\u4eba\u201d\u4ef7\u503c\uff0c\u5f15\u5bfc\u201c\u521b\u4f5c\u8005\u201d\u8eab\u4efd\u8ba4\u540c\uff0c\u8c28\u614e\u63a2\u7d22\u5546\u4e1a\u95ed\u73af**\u3002\n*   **\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u6df1\u5ea6\u5171\u60c5\u4e0e\u8d4b\u80fd**\uff1a\u5bf9\u5176\u5728\u9879\u76ee\u4e2d\u7684\u9886\u5bfc\u529b\u4e0e\u4e13\u4e1a\u8ffd\u6c42\u7ed9\u4e88\u9ad8\u5ea6\u516c\u5f00\u8d5e\u626c\u3002\u53ef\u9080\u8bf7\u5176\u5206\u4eab\u9879\u76ee\u7ecf\u9a8c\uff0c\u6811\u7acb\u4e3a\u201c\u5b66\u5458\u699c\u6837\u201d\u3002\n    2.  **\u63d0\u4f9b\u9ad8\u9636\u6311\u6218**\uff1a\u63a8\u8350\u5176\u53c2\u4e0e\u66f4\u590d\u6742\u7684\u540e\u671f\u5236\u4f5c\u6bd4\u8d5b\u3001\u6709\u58f0\u5267\u5b9e\u6218\u9879\u76ee\u6216\u5185\u90e8\u5b9e\u4e60\u673a\u4f1a\uff0c\u6ee1\u8db3\u5176\u6280\u827a\u7cbe\u8fdb\u9700\u6c42\u3002\n    3.  **\u5f15\u5bfc\u4ef7\u503c\u8ba4\u77e5**\uff1a\u5728\u6c9f\u901a\u4e2d\uff0c\u9010\u6b65\u63a2\u8ba8\u5176\u4f5c\u54c1\u7684\u5e94\u7528\u573a\u666f\uff08\u5982\u4e2a\u4ebaIP\u3001\u5546\u4e1a\u6295\u7a3f\u3001\u63a5\u5355\u5e73\u53f0\uff09\uff0c**\u6e29\u548c\u5730**\u5c06\u6280\u827a\u4e0e\u5e02\u573a\u4ef7\u503c\u8fde\u63a5\uff0c\u4f46\u907f\u514d\u6025\u529f\u8fd1\u5229\u7684\u63a8\u9500\u3002\n    4.  **\u5173\u6ce8\u957f\u671f\u7559\u5b58**\uff1a\u9879\u76ee\u7ed3\u675f\u540e\uff0c\u53ef\u80fd\u4ea7\u751f\u201c\u70ed\u60c5\u7a7a\u7a97\u671f\u201d\u3002\u9700\u63d0\u524d\u89c4\u5212\u540e\u7eed\u5b66\u4e60\u8def\u5f84\uff0c\u5982\u8fdb\u9636\u540e\u671f\u73ed\u3001\u6709\u58f0\u4e66\u5236\u4f5c\u5168\u6d41\u7a0b\u73ed\uff0c\u5c06\u5176\u70ed\u60c5\u5f15\u5bfc\u81f3\u65b0\u7684\u6280\u80fd\u9ad8\u5cf0\u3002\n    5.  **\u907f\u514d\u8fc7\u5ea6\u7d22\u53d6**\uff1a\u4e0d\u5b9c\u9891\u7e41\u8ba9\u5176\u627f\u62c5\u65e0\u507f\u7684\u73ed\u7ea7\u7ba1\u7406\u6216\u52a9\u6559\u5de5\u4f5c\uff0c\u9664\u975e\u914d\u5957\u660e\u786e\u7684\u6743\u76ca\uff08\u5982\u5956\u5b66\u91d1\u3001\u5185\u90e8\u63a8\u8350\u8d44\u683c\u3001\u8bfe\u7a0b\u6298\u6263\uff09\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**\uff1a\n    *   **\u9996\u9009\u6302\u8f7d**\uff1a**\u540e\u671f\u5236\u4f5c\u9ad8\u9636\u8bad\u7ec3\u8425**\u3001**\u6709\u58f0\u5267\u5bfc\u6f14/\u7b56\u5212\u5b9e\u6218\u8425**\u3002\u5339\u914d\u5176\u5f53\u524d\u7684\u6280\u672f\u5174\u8da3\u548c\u9879\u76ee\u7edf\u7b79\u80fd\u529b\u3002\n    *   **\u6b21\u9009\u6302\u8f7d**\uff1a**\u6709\u58f0\u4e66\u64ad\u8bb2\u5168\u94fe\u8def\u73ed**\uff08\u82e5\u5176\u6709\u8868\u6f14\u5174\u8da3\uff09\u3001**\u4e2a\u4ebaIP\u5b75\u5316\u4e0e\u8fd0\u8425\u8bfe**\uff08\u9700\u5728\u5176\u8868\u73b0\u51fa\u660e\u786e\u610f\u613f\u540e\u63a8\u8350\uff09\u3002\n    *   **\u8c28\u614e\u63a8\u8350**\uff1a\u5355\u7eaf\u4ee5\u201c\u5feb\u901f\u53d8\u73b0\u201d\u4e3a\u5356\u70b9\u7684\u63a5\u5355\u8bfe\u3001\u8425\u9500\u8bfe\uff0c\u4e0e\u5176\u5f53\u524d\u52a8\u673a\u4e0d\u7b26\uff0c\u6613\u5f15\u53d1\u53cd\u611f\u3002\n\n{\"core_type\": \"T3 \u5320\u4eba\u8ffd\u6c42\u578b (\u517c\u5177T1\u7279\u8d28)\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u540e\u671f\u5236\u4f5c\u9ad8\u9636\u8bad\u7ec3\u8425/\u6709\u58f0\u5267\u5bfc\u6f14\u5b9e\u6218\u8425\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u5973\uff08\u63a8\u65ad\uff0c\u79f0\u5176\u4ed6\u5b66\u5458\u4e3a\u201c\u59d0\u59b9\u4eec\u201d\uff09\", \"city\": \"\u672a\u77e5\"}";
