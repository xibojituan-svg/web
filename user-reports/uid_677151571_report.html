    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u4e0e\u98ce\u9669\u8bca\u65ad\u62a5\u544a (UID: 677151571)\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u4e2d\u7b49\u504f\u5de5\u5177\u6027**\u3002\u7528\u6237\uff0853\u5c81\u9000\u4f11\u4eba\u5458\uff09\u660e\u786e\u8868\u8fbe\u201c\u6574\u5929\u5728\u5bb6\u201d\u3001\u201c\u6211\u53cd\u6b63\u6ca1\u4e8b\u201d\uff0c\u5bfb\u6c42\u526f\u4e1a\u5145\u5b9e\u65f6\u95f4\u5e76\u8d5a\u53d6\u6536\u5165\uff08\u201c\u8ddf\u7740\u8001\u5e08\u8fb9\u5b66\u8fb9\u8d5a\u201d\uff09\u3002\u6709\u57fa\u7840\uff08\u68a8\u82b1\u5b66\u5458\u6bd5\u4e1a\uff09\uff0c\u5b66\u4e60\u914d\u5408\u5ea6\u9ad8\uff0c\u5bf9\u53d8\u73b0\u8def\u5f84\uff08\u5f55\u4e66\u3001\u753b\u672c\uff09\u6709\u5177\u4f53\u5174\u8da3\u3002\u4f46\u52a8\u673a\u4e2d\u201c\u6253\u53d1\u65f6\u95f4\u201d\u4e0e\u201c\u53d8\u73b0\u671f\u5f85\u201d\u5e76\u5b58\uff0c**\u53d8\u73b0\u9884\u671f\u9700\u5173\u6ce8**\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u4e2d\u7b49**\u3002\u65f6\u95f4\u8d44\u6e90\u5145\u6c9b\uff08\u201c\u5168\u5929\u90fd\u53ef\u4ee5\u201d\uff09\uff0c\u5177\u5907\u6709\u58f0\u5b66\u4e60\u57fa\u7840\u3002\u4f46\u5e74\u9f8453\u5c81\uff0c**\u5b66\u4e60\u4e0e\u9002\u5e94\u65b0\u6280\u672f\u7684\u5f39\u6027\u53ef\u80fd\u4f4e\u4e8e\u5e74\u8f7b\u5b66\u5458**\u3002\u5bb6\u5ead\u7ecf\u6d4e\u72b6\u51b5\u4e0d\u660e\uff0c\u4f46\u63d0\u53ca\u513f\u5b50\u9ad8\u5b66\u5386\uff0c\u53ef\u80fd\u5bb6\u5ead\u652f\u6301\u5c1a\u53ef\uff0c\u4f46**\u652f\u4ed8\u80fd\u529b\uff082380\u5143\u8bfe\u7a0b\uff09\u4e0e\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u7f3a\u5931**\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u9ad8**\u3002\u7528\u6237\u5b66\u4e60\u6001\u5ea6\u79ef\u6781\uff0c\u5168\u7a0b\u914d\u5408\u9500\u552e\u6307\u4ee4\uff08\u6253\u5361\u3001\u56de\u590d\u3001\u63d0\u4ea4\u4f5c\u4e1a\uff09\uff0c\u5bf9\u53cd\u9988\u63a5\u53d7\u5ea6\u9ad8\uff08\u201c\u8c22\u8c22\u6307\u70b9\u201d\u3001\u201c\u6211\u8bd5\u8bd5\u201d\uff09\uff0c\u4e3b\u52a8\u5206\u4eab\u8d44\u6e90\uff08\u513f\u5b50\u82f1\u8bed\u80fd\u529b\uff09\uff0c\u8868\u73b0\u51fa\u9ad8\u670d\u4ece\u6027\u3001\u9ad8\u4e92\u52a8\u610f\u613f\u548c\u8f83\u5f3a\u7684\u4fe1\u4efb\u611f\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u6267\u884c\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u4e8e4\u67088\u65e5\u652f\u4ed82380\u5143\u62a5\u540d\u201c\u9ad8\u9636\u73ed/\u7cfb\u7edf\u8bfe\u201d\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u7f3a\u5931\uff0c\u9ad8\u98ce\u9669\u96f7\u533a**\u3002\u804a\u5929\u8bb0\u5f55\u4e2d**\u5b8c\u5168\u672a\u63d0\u53ca\u4e0e\u5bb6\u4eba\uff08\u914d\u5076\u3001\u5b50\u5973\uff09\u6c9f\u901a\u6216\u83b7\u5f97\u652f\u6301**\u3002\u7528\u6237\u4e3a\u9000\u4f11\u4eba\u5458\uff0c\u652f\u4ed82380\u5143\u8bfe\u7a0b\u8d39\u7528\uff0c**\u5b58\u5728\u5bb6\u5ead\u4e0d\u77e5\u60c5\u6216\u540e\u7eed\u53cd\u5bf9\u5f15\u53d1\u9000\u8d39\u7684\u91cd\u5927\u98ce\u9669**\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u4e0e\u8d44\u6e90\u521d\u6b65\u5224\u65ad**: \u52a8\u673a\u660e\u786e\uff08\u517c\u804c\u53d8\u73b0+\u5174\u8da3\uff09\uff0c\u8d44\u6e90\u5c1a\u53ef\uff08\u65f6\u95f4+\u57fa\u7840\uff09\uff0c\u914d\u5408\u5ea6\u9ad8\u3002\u4f46\u5e74\u9f84\u548c\u5bb6\u5ead\u51b3\u7b56\u6743\u662f\u6f5c\u5728\u98ce\u9669\u70b9\u3002\n*   **\u6b65\u9aa42 - \u627f\u8bfa\u4e0e\u884c\u52a8\u4e00\u81f4\u6027**: **\u9ad8\u4e00\u81f4\u6027**\u3002\u7528\u6237\u4ece\u767b\u8bb0\u3001\u542c\u8bfe\u3001\u5b8c\u6210\u4f5c\u4e1a\u5230\u6700\u7ec8\u4ed8\u8d39\uff0c\u884c\u52a8\u8def\u5f84\u5b8c\u6574\uff0c\u627f\u8bfa\u5ea6\u9ad8\u3002\n*   **\u6b65\u9aa43 - \u6297\u538b\u4e0e\u632b\u6298\u53cd\u5e94**: \u8bb0\u5f55\u4e2d\u672a\u906d\u9047\u660e\u663e\u632b\u6298\uff0c\u5bf9\u9500\u552e\u7684\u5efa\u8bbe\u6027\u53cd\u9988\uff08\u5982\u5bf9\u8c61\u611f\u3001\u505c\u987f\u95ee\u9898\uff09\u5747\u79ef\u6781\u63a5\u53d7\u5e76\u5c1d\u8bd5\u6539\u8fdb\uff08\u201c\u6211\u8bd5\u8fc7\u4e86\u8001\u5e08\uff0c\u771f\u7684\u5f88\u4e0d\u4e00\u6837\u201d\uff09\uff0c\u8868\u73b0\u51fa\u8f83\u597d\u7684\u6297\u538b\u6027\u3002\n*   **\u6b65\u9aa44 - \u957f\u671f\u4ef7\u503c\u8ba4\u540c**: \u7528\u6237\u5bf9\u884c\u4e1a\u6709\u57fa\u7840\u8ba4\u77e5\uff08\u524d\u68a8\u82b1\u5b66\u5458\uff09\uff0c\u5bf9\u201c\u8fb9\u5b66\u8fb9\u8d5a\u201d\u6a21\u5f0f\u8868\u793a\u8ba4\u540c\uff0c\u5e76\u9009\u62e9\u4e86\u5177\u4f53\u5de5\u79cd\uff08\u5f55\u4e66\u3001\u753b\u672c\uff09\uff0c\u663e\u793a\u51fa\u4e00\u5b9a\u7684\u4ef7\u503c\u8ba4\u540c\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**: **B-\u7ea7 (\u6f5c\u529b\u578b\u4f46\u6709\u660e\u663e\u98ce\u9669)**\u3002\u7528\u6237\u753b\u50cf\u6e05\u6670\u3001\u914d\u5408\u5ea6\u9ad8\uff0c\u4f46**\u6838\u5fc3\u98ce\u9669\u5728\u4e8e\u5bb6\u5ead\u51b3\u7b56\u6743\u672a\u7ecf\u9a8c\u8bc1**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b: T5 \u52a1\u5b9e\u63a2\u7d22\u8005**\u3002\n    *   \u7279\u5f81\uff1a\u6709\u660e\u786e\u95f2\u6687\u65f6\u95f4\uff08\u9000\u4f11\uff09\uff0c\u5bfb\u6c42\u5b9e\u7528\u6280\u80fd\u53d8\u73b0\uff0c\u5b66\u4e60\u8fc7\u7a0b\u52a1\u5b9e\u3001\u914d\u5408\uff0c\u5bf9\u5177\u4f53\u8def\u5f84\uff08\u5f55\u4e66\uff09\u6709\u5174\u8da3\u3002\n    *   \u504f\u5dee\uff1a\u7528\u6237\u5e74\u9f84\u504f\u5927\uff0c\u4e14**\u9690\u542b\u4e86T8 \u5b64\u72ec\u5bfb\u6c42\u8005**\u7684\u90e8\u5206\u7279\u8d28\uff08\u201c\u6574\u5929\u5728\u5bb6\u201d\uff09\uff0c\u60c5\u611f\u4f9d\u8d56\u548c\u966a\u4f34\u9700\u6c42\u53ef\u80fd\u88ab\u9500\u552e\u8fc7\u7a0b\u6ee1\u8db3\uff0c\u4ece\u800c\u4fc3\u8fdb\u4e86\u8f6c\u5316\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u6781\u9ad8/\u9ad8/\u4e2d/\u4f4e/\u6781\u4f4e)\n*   **\u7efc\u5408\u98ce\u9669\u7b49\u7ea7: \u4e2d\u504f\u9ad8**\u3002\n*   **\u4e03\u5927\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u6548\u679c\u4e0d\u7b26\u9884\u671f**: \u98ce\u9669**\u4e2d**\u3002\u7528\u6237\u6709\u57fa\u7840\uff0c\u4f46\u5e74\u9f84\u53ef\u80fd\u5f71\u54cd\u5b66\u4e60\u901f\u5ea6\u548c\u6700\u7ec8\u53d8\u73b0\u6548\u679c\uff0c\u9700\u7ba1\u7406\u9884\u671f\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**: \u98ce\u9669**\u672a\u77e5**\u3002\u652f\u4ed8\u91d1\u989d2380\u5143\u5bf9\u9000\u4f11\u4eba\u5458\u800c\u8a00\u9700\u8bc4\u4f30\uff0c**\u5bb6\u5ead\u51b3\u7b56\u6743\u7f3a\u5931\u4f7f\u6b64\u98ce\u9669\u9aa4\u589e**\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**: \u98ce\u9669**\u4f4e**\u3002\u7528\u6237\u65f6\u95f4\u5145\u88d5\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9**: \u98ce\u9669**\u9ad8**\u3002**\u8fd9\u662f\u5f53\u524d\u6700\u6838\u5fc3\u7684\u9000\u8d39\u98ce\u9669\u70b9**\u3002\u8bb0\u5f55\u4e2d\u65e0\u4efb\u4f55\u5bb6\u5ead\u77e5\u60c5\u8bc1\u636e\u3002\n    5.  **\u9500\u552e\u8bef\u5bfc**: \u98ce\u9669**\u4e2d**\u3002\u9500\u552e\u8fc7\u7a0b\u4e2d\u5b58\u5728**\u8fc7\u5ea6\u627f\u8bfa\u503e\u5411**\uff08\u5982\u201c\u5e26\u4f60\u5f55\u4e66\u8d5a\u94b1\u201d\u3001\u201c\u5b98\u65b9\u65f6\u85aa80-500\u5143\u201d\u3001\u201c\u4f18\u5148\u5165\u5267\u7ec4\u201d\uff09\uff0c\u53ef\u80fd\u62d4\u9ad8\u7528\u6237\u9884\u671f\u3002\n    6.  **\u670d\u52a1\u4f53\u9a8c**: \u98ce\u9669**\u4f4e**\u3002\u76ee\u524d\u9500\u552e\u670d\u52a1\u7ec6\u81f4\uff0c\u7528\u6237\u53cd\u9988\u6b63\u9762\u3002\n    7.  **\u5e73\u53f0\u5bf9\u6bd4/\u7ade\u54c1**: \u98ce\u9669**\u4f4e**\u3002\u7528\u6237\u4e3a\u524d\u68a8\u82b1\u5b66\u5458\uff0c\u5df2\u4ea7\u751f\u4e00\u5b9a\u8def\u5f84\u4f9d\u8d56\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u4e3b\u8981\u5408\u89c4\u95ee\u9898**:\n    *   **\u5938\u5927\u6536\u76ca\u4e0e\u6a21\u7cca\u95e8\u69db**: \u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u5f55\u4e66\u8d5a\u94b1\u201d\u3001\u201c\u65f6\u85aa80-500\u5143\u201d\u3001\u201c\u4f18\u5148\u5165\u5267\u7ec4\u201d\uff0c\u4f46\u672a\u5145\u5206\u8bf4\u660e\u884c\u4e1a\u7ade\u4e89\u6fc0\u70c8\u6027\u3001\u8fbe\u6210\u8be5\u6536\u5165\u7684\u96be\u5ea6\u4e0e\u5468\u671f\uff0c**\u5b58\u5728\u8bf1\u5bfc\u6027\u5ba3\u4f20**\u3002\n    *   **\u5229\u7528\u60c5\u611f\u4f9d\u8d56\u4e0e\u6743\u5a01**: \u9500\u552e\u4f7f\u7528\u201c\u5e08\u59d0\u201d\u3001\u201c\u770b\u597d\u4f60\u201d\u3001\u201c\u72ec\u5ba0\u8d44\u6e90\u201d\u7b49\u8bdd\u672f\uff0c\u5efa\u7acb\u4eb2\u5bc6\u611f\u548c\u6743\u5a01\u611f\uff0c\u53ef\u80fd\u5f71\u54cd\u7528\u6237\u7406\u6027\u51b3\u7b56\u3002\n    *   **\u7f3a\u5931\u5173\u952e\u98ce\u9669\u544a\u77e5**: **\u5168\u7a0b\u672a\u63d0\u53ca\u201c\u5bb6\u5ead\u652f\u6301\u201d\u7684\u91cd\u8981\u6027**\uff0c\u4e5f\u672a\u5efa\u8bae\u7528\u6237\u4e0e\u5bb6\u4eba\u6c9f\u901a\uff0c\u4e25\u91cd\u8fdd\u53cd\u9488\u5bf9\u4e2d\u8001\u5e74\u5b66\u5458\u7684\u9500\u552e\u4f26\u7406\u3002\n    *   **\u5236\u9020\u7a00\u7f3a\u4e0e\u7d27\u8feb\u611f**: \u201c\u6700\u540e\u4e00\u6b21\u8003\u6838\u201d\u3001\u201c\u622a\u6b62\u660e\u592910:00\u201d\u3001\u201c\u5c11\u91cf20%VIP\u540d\u989d\u201d\u7b49\u8bdd\u672f\u5c5e\u4e8e\u5e38\u89c4\u8425\u9500\u624b\u6bb5\uff0c\u5728\u672c\u6b21\u8bb0\u5f55\u4e2d\u672a\u8fc7\u5ea6\u4f7f\u7528\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6: \u5339\u914d**\u3002\u7528\u6237\u6709\u57fa\u7840\u3001\u6709\u65f6\u95f4\u3001\u6709\u660e\u786e\u5b66\u4e60\u610f\u5411\uff0c\u4e0e\u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\u5339\u914d\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c: 24\u5c0f\u65f6\u5185\u7d27\u6025\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\u4e0e\u652f\u6301\u60c5\u51b5**\u3002\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**:\n    1.  **\u9996\u8981\u4efb\u52a1\uff08\u98ce\u9669\u7ba1\u63a7\uff09**: \u73ed\u4e3b\u4efb\u6dfb\u52a0\u540e\uff0c**\u9996\u901a\u7535\u8bdd\u6216\u6df1\u5ea6\u6c9f\u901a\u5fc5\u987b\u59d4\u5a49\u4f46\u660e\u786e\u6838\u5b9e\u5bb6\u5ead\u652f\u6301\u60c5\u51b5**\u3002\u4f8b\u5982\uff1a\u201c\u963f\u59e8/\u53d4\u53d4\uff0c\u606d\u559c\u60a8\u52a0\u5165\u5b66\u4e60\uff01\u54b1\u4eec\u8fd9\u4e2a\u5b66\u4e60\u9700\u8981\u6301\u7eed\u51e0\u4e2a\u6708\uff0c\u65f6\u95f4\u548c\u7cbe\u529b\u6295\u5165\u4e0d\u5c0f\uff0c\u60a8\u62a5\u540d\u7684\u4e8b\u60c5\u548c\u5bb6\u4eba\uff08\u6bd4\u5982\u5b69\u5b50\uff09\u5546\u91cf\u8fc7\u4e86\u5417\uff1f\u83b7\u5f97\u4ed6\u4eec\u7684\u652f\u6301\u4f1a\u8ba9\u60a8\u5b66\u4e60\u66f4\u5b89\u5fc3\u3002\u201d\n    2.  **\u9884\u671f\u7ba1\u7406\uff08\u6838\u5fc3\u670d\u52a1\uff09**: \u5728\u9996\u6b21\u5b66\u4e60\u89c4\u5212\u6c9f\u901a\u4e2d\uff0c**\u5fc5\u987b\u6821\u6b63\u53d8\u73b0\u9884\u671f**\u3002\u7ed3\u5408\u5176\u5e74\u9f84\u548c\u57fa\u7840\uff0c\u5236\u5b9a\u5207\u5b9e\u53ef\u884c\u7684\u9636\u6bb5\u6027\u76ee\u6807\uff08\u5982\u5148\u5b8c\u6210\u65c1\u767d\u57fa\u7840\u7ec3\u4e60\uff0c\u5c1d\u8bd5\u8bd5\u97f3\uff09\uff0c\u5f3a\u8c03\u5b66\u4e60\u8fc7\u7a0b\u7684\u6210\u957f\u6027\uff0c\u800c\u975e\u77ed\u671f\u9ad8\u6536\u5165\u3002\n    3.  **\u60c5\u611f\u7ef4\u7cfb\u4e0e\u8fdb\u5ea6\u5173\u6ce8**: \u9274\u4e8e\u7528\u6237\u914d\u5408\u5ea6\u9ad8\u4e14\u53ef\u80fd\u6709\u60c5\u611f\u966a\u4f34\u9700\u6c42\uff0c\u73ed\u4e3b\u4efb\u9700\u4fdd\u6301\u5b9a\u671f\u3001\u771f\u8bda\u7684\u5173\u6000\u4e0e\u8fdb\u5ea6\u8ddf\u8fdb\uff0c\u53ca\u65f6\u89e3\u7b54\u6280\u672f\u95ee\u9898\uff08\u5982\u624b\u673a\u5f55\u97f3\uff09\uff0c\u5de9\u56fa\u4fe1\u4efb\u3002\n    4.  **\u5408\u89c4\u8865\u4f4d**: \u5728\u540e\u7eed\u670d\u52a1\u4e2d\uff0c\u8865\u5145\u544a\u77e5\u884c\u4e1a\u771f\u5b9e\u60c5\u51b5\uff0c\u5f3a\u8c03\u575a\u6301\u7ec3\u4e60\u548c\u79ef\u7d2f\u7684\u91cd\u8981\u6027\uff0c\u5c06\u9500\u552e\u7aef\u7684\u8fc7\u5ea6\u627f\u8bfa\u62c9\u56de\u73b0\u5b9e\u3002\n\n{\"core_type\": \"T5 \u52a1\u5b9e\u63a2\u7d22\u8005 (\u542bT8\u7279\u8d28)\", \"risk_level\": \"\u4e2d\u504f\u9ad8\", \"refund_risk\": \"\u4e2d\u504f\u9ad8\", \"product_match\": \"\u5339\u914d\", \"action\": \"24h\u5185\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\u4e0e\u652f\u6301\"}";
