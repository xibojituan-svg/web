    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n> **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4e2d\u7f3a\u5c11\u5173\u4e8e\u7528\u6237**\u652f\u4ed8\u80fd\u529b\u3001\u8d44\u91d1\u6765\u6e90\u3001\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u3001\u8fc7\u5f80\u7ecf\u5386\u53ca\u6df1\u5c42\u52a8\u673a**\u7684\u76f4\u63a5\u4fe1\u606f\uff0c\u6240\u6709\u5224\u65ad\u57fa\u4e8e\u5176\u201c\u9000\u4f11\u4eba\u5458\u201d\u8eab\u4efd\u53ca\u884c\u4e3a\u6a21\u5f0f\u63a8\u65ad\u3002\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677156479 / \u6635\u79f0\uff1a\u6b66\u5411\u5f64 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u590f\u51b05(\u5b59\u8302\u6cc9) -> \u9065\u8fdc(\u5f20\u6587\u9759) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u9ad8\u9636\u8bfe\u7a0b (\u4ef7\u683c7380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **[\u4fe1\u606f\u7f3a\u5931]** (\u57fa\u4e8e\u9000\u4f11\u8eab\u4efd\uff0c\u63a8\u6d4b\u4e3a\u50a8\u84c4\u652f\u4ed8\uff0c\u4f46\u9700\u8b66\u60d5\u517b\u8001\u91d1\u632a\u7528\u98ce\u9669) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **[\u9ad8\u5bbd\u88d5]** (\u9000\u4f11\u72b6\u6001\uff0c\u80fd\u9891\u7e41\u54cd\u5e94\u5e76\u5b8c\u6210\u591a\u9879\u4efb\u52a1) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **[\u4fe1\u606f\u7f3a\u5931]** (\u672a\u63d0\u53ca\u5bb6\u4eba\uff0c\u98ce\u9669\u672a\u77e5) |\n| **\u4fe1\u606f\u539a\u5ea6** | **[\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09]** (\u7528\u6237\u4e3b\u52a8\u8868\u8fbe\u6781\u5c11\uff0c\u591a\u4e3a\u88ab\u52a8\u56de\u5e94) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u5bf9\u201c\u517c\u804c\u201d\u3001\u201c\u63a5\u5355\u201d\u3001\u201c\u753b\u672c\u201d\u7b49\u53d8\u73b0\u8bcd\u6c47\u6709\u660e\u786e\u56de\u5e94\uff0c\u4f46\u540c\u65f6\u4e5f\u8868\u73b0\u51fa\u5bf9\u201c\u5b66\u65e0\u6b62\u5883\u201d\u3001\u201c\u58f0\u5165\u4eba\u5fc3\u201d\u7b49\u5174\u8da3\u548c\u6210\u957f\u6027\u5185\u5bb9\u7684\u5173\u6ce8\uff0c\u52a8\u673a\u662f\u201c\u641e\u94b1\u201d\u4e0e\u201c\u5174\u8da3/\u4ef7\u503c\u611f\u201d\u7684\u6df7\u5408\u4f53\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u517c\u804c\u9996\u5148\u9009\u62e9\u753b\u672c\uff0c\u5176\u4ed6\u7684\u6df1\u5165\u4e86\u89e3\u540e\u518d\u9009\u62e9\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b06\u9ad8]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[**\u4e2d**] \u2014 \u4f5c\u4e3a\u9000\u4f11\u4eba\u5458\uff0c\u5177\u5907\u652f\u4ed87380\u5143\u8bfe\u7a0b\u8d39\u7528\u7684\u53ef\u80fd\u6027\uff0c\u4f46\u8d44\u91d1\u6765\u6e90\uff08\u517b\u8001\u91d1/\u50a8\u84c4\uff09\u53ca\u53ef\u6301\u7eed\u6027\u4e0d\u660e\uff0c\u5b58\u5728**\u632a\u7528\u517b\u8001\u94b1**\u7684\u6f5c\u5728\u98ce\u9669\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[**\u9ad8**] \u2014 \u9000\u4f11\u8eab\u4efd\uff0c\u65f6\u95f4\u9ad8\u5ea6\u81ea\u7531\uff0c\u80fd\u5feb\u901f\u5b8c\u6210\u201c\u57fa\u672c\u529f\u7ec3\u4e60\u201d\u3001\u201c\u5f55\u64ad\u8bfe\u201d\u3001\u201c\u4f5c\u4e1a\u201d\u7b49\u591a\u9879\u4efb\u52a1\uff0c\u54cd\u5e94\u53ca\u65f6\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[**\u4fe1\u606f\u7f3a\u5931**] \u2014 \u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u6210\u5458\uff0c\u652f\u6301\u5ea6\u672a\u77e5\uff0c\u662f\u91cd\u5927\u98ce\u9669\u655e\u53e3\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u5168\u7a0b\u6c9f\u901a\u5e73\u548c\u3001\u79ef\u6781\uff0c\u5bf9\u4efb\u52a1\u548c\u53cd\u9988\u5747\u4ee5\u201c\u597d\u201d\u3001\u201c[OK]\u201d\u3001\u201c\u671f\u5f85[\u5fae\u7b11]\u201d\u7b49\u6b63\u9762\u3001\u7b80\u6d01\u65b9\u5f0f\u56de\u5e94\uff0c\u672a\u8868\u73b0\u51fa\u4efb\u4f55\u8d1f\u9762\u60c5\u7eea\u6216\u4f9d\u8d56\u503e\u5411\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5df2\u5b8c\u6210\u57fa\u672c\u529f\u7ec3\u4e60\u201d / \u201c\u827e\u5b9d\u826f\u201d / \u201c\u671f\u5f85[\u5fae\u7b11]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e** ] \u4e0e [ **\u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0** ] \u7684\u6df7\u5408\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u9000\u4f11\u540e\u793e\u4f1a\u89d2\u8272\u7f3a\u5931\u5e26\u6765\u7684**\u4ef7\u503c\u611f\u4e0e\u5f52\u5c5e\u611f\u7126\u8651**\u3002\u5979\u9700\u8981\u4e00\u4e2a\u65b0\u7684\u3001\u80fd\u83b7\u5f97\u8ba4\u53ef\u7684\u8eab\u4efd\uff08\u5982\u201c\u4e3b\u64ad\u201d\u3001\u201c\u5fa1\u59d0\u97f3\u6f14\u7ece\u8005\u201d\uff09\uff0c\u6765\u5bf9\u6297\u9000\u4f11\u540e\u7684\u201c\u65e0\u7528\u611f\u201d\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u9886\u57df\u7684\u5c0a\u91cd\u4e0e\u4ef7\u503c\u786e\u8ba4**\u3002\u901a\u8fc7\u201c\u5fa1\u59d0\u97f3\u201d\u3001\u201c\u76f4\u63a5\u8fdb\u5267\u7ec4\u201d\u3001\u201c\u6c34\u5e73\u4e0d\u9519\u201d\u7b49\u6b63\u9762\u53cd\u9988\uff0c\u8ba9\u5979\u611f\u53d7\u5230\u88ab\u4e13\u4e1a\u4f53\u7cfb\u8ba4\u53ef\uff0c\u91cd\u83b7\u793e\u4f1a\u8eab\u4efd\u548c\u6210\u5c31\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **[\ud83d\udfe7B]** \u7c7b (\u9ad8\u914d\u5408\u5ea6\u3001\u9ad8\u65f6\u95f4\u8d44\u6e90\u3001\u52a8\u673a\u4e2d\u7b49\uff0c\u4f46\u5b58\u5728\u5bb6\u5ead\u4e0e\u652f\u4ed8\u672a\u77e5\u98ce\u9669) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **[T2 \u4f4e\u8c03\u5b9e\u5e72]** \u578b (\u914d\u5408\u6307\u4ee4\u3001\u884c\u52a8\u529b\u5f3a\u3001\u60c5\u7eea\u7a33\u5b9a\u3001\u76ee\u6807\u5bfc\u5411\uff0c\u4f46\u8868\u8fbe\u5185\u655b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u76f4\u63a5\u8bc1\u636e\u8868\u660e\u5b58\u5728\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5ead\u5267\u70c8\u51b2\u7a81\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **[\u4e2d]** | **\u98ce\u9669\u672a\u77e5\u4f46\u9700\u8b66\u60d5**\uff1a\u82e5\u8bfe\u7a0b\u8d39\u7528\u52a8\u7528\u5bb6\u5ead\u5171\u540c\u50a8\u84c4\u6216\u517b\u8001\u91d1\uff0c\u53ef\u80fd\u5f15\u53d1\u5b50\u5973\u6216\u914d\u5076\u53cd\u5bf9\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **[\u4f4e]** | \u65f6\u95f4\u5145\u88d5\uff0c\u5b66\u4e60\u914d\u5408\u5ea6\u9ad8\uff0c\u5d29\u76d8\u53ef\u80fd\u6027\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **[\u6781\u4f4e]** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u4e0d\u6613\u56e0\u5b66\u4e60\u632b\u6298\u7834\u9632\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **[\u4e2d]** | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u82e5\u201c\u753b\u672c\u201d\u7b49\u517c\u804c\u5c1d\u8bd5\u540e\uff0c\u5b9e\u9645\u6536\u76ca\u8fdc\u4f4e\u4e8e\u9884\u671f\uff0820-150\u5143/\u65f6\uff09\uff0c\u6216\u63a5\u5355\u4e0d\u987a\uff0c\u53ef\u80fd\u4ea7\u751f\u201c\u88ab\u9a97\u201d\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u82e5\u7b2c\u4e00\u6b21\u8bd5\u97f3\u6216\u63a5\u5355\u5c1d\u8bd5\u5931\u8d25\uff0c\u6216\u53d1\u73b0\u5b9e\u9645\u6536\u76ca\u4e0e\u5ba3\u4f20\u6709\u5dee\u8ddd\uff0c\u6613\u4ea7\u751f\u5f3a\u70c8\u843d\u5dee\u611f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6b66\u59d0\uff0c\u770b\u5230\u60a8\u8fd9\u51e0\u5929\u7684\u4f5c\u4e1a\u5b8c\u6210\u5f97\u53c8\u5feb\u53c8\u597d\uff0c\u90a3\u4efd\u8ba4\u771f\u548c\u6c89\u7a33\u52b2\u513f\u7279\u522b\u8ba9\u4eba\u4f69\u670d\u3002\u5f88\u591a\u9000\u4f11\u7684\u4f19\u4f34\u6765\u627e\u6211\u4eec\uff0c\u4e0d\u53ea\u662f\u4e3a\u4e86\u8d5a\u70b9\u96f6\u82b1\u94b1\uff0c\u66f4\u662f\u60f3\u627e\u4e00\u4e2a\u80fd\u6301\u7eed\u53d1\u5149\u53d1\u70ed\u3001\u88ab\u5927\u5bb6\u8ba4\u53ef\u7684\u65b0\u821e\u53f0\u3002\u60a8\u7684\u58f0\u97f3\u6761\u4ef6\u548c\u5b66\u4e60\u6001\u5ea6\uff0c\u5b8c\u5168\u6709\u6f5c\u529b\u6210\u4e3a\u6211\u4eec\u2018\u94f6\u53d1\u4e3b\u64ad\u56e2\u2019\u91cc\u7684\u699c\u6837\u3002\u63a5\u4e0b\u6765\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u6211\u966a\u60a8\u5148\u628a\u2018\u753b\u672c\u2019\u8fd9\u4e2a\u8d5b\u9053\u8dd1\u901a\uff0c\u627e\u5230\u90a3\u79cd\u2018\u88ab\u9700\u8981\u2019\u7684\u6210\u5c31\u611f\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf**\u3011\u3002\u4e3a\u5176\u6253\u9020\u201c\u8d44\u6df1\u5fa1\u59d0\u97f3\u4e3b\u64ad\u201d\u3001\u201c\u94f6\u53d1\u5b66\u4e60\u699c\u6837\u201d\u7b49\u6807\u7b7e\uff0c\u6ee1\u8db3\u5176\u5c0a\u91cd\u4e0e\u5f52\u5c5e\u9700\u6c42\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u5feb\u901f\u63a5\u5355\u4f53\u9a8c\u5305**\u3011\u3002\u4f18\u5148\u63d0\u4f9b\u4f4e\u95e8\u69db\u3001\u6613\u4e0a\u624b\u7684\u201c\u753b\u672c\u201d\u7c7b\u8bd5\u97f3\u8ba2\u5355\uff0c\u8ba9\u5979\u5feb\u901f\u83b7\u5f97\u6b63\u53cd\u9988\u548c\u5fae\u5c0f\u6536\u76ca\uff0c\u5efa\u7acb\u4fe1\u5fc3\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a**\u7edd\u4e0d\u5bf9\u5176\u8fc7\u5ea6\u627f\u8bfa\u77ed\u671f\u9ad8\u6536\u76ca**\uff1b\u907f\u514d\u4f7f\u7528\u201c\u8f7b\u677e\u6708\u5165\u8fc7\u4e07\u201d\u7b49\u5938\u5f20\u8bdd\u672f\uff0c\u5e94\u5f3a\u8c03\u201c\u7a33\u6b65\u63d0\u5347\u201d\u3001\u201c\u4ef7\u503c\u5b9e\u73b0\u201d\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5f53\u524d7380\u5143\u8bfe\u7a0b\u5df2\u5c5e\u5927\u989d\u6d88\u8d39\uff0c\u5728\u672a\u786e\u8ba4\u5176\u5bb6\u5ead\u652f\u6301\u4e0e\u652f\u4ed8\u65e0\u538b\u529b\u524d\uff0c\u7981\u6b62\u4efb\u4f55\u8fdb\u4e00\u6b65\u5347\u5355\u884c\u4e3a\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u9000\u4f11\u4eba\u5458\u201d **(\u8eab\u4efd\u951a\u5b9a\uff0c\u65f6\u95f4\u5145\u88d5\u4f46\u9700\u5173\u6ce8\u8d44\u91d1\u6765\u6e90)**\n2. > \u201c\u517c\u804c\u9996\u5148\u9009\u62e9\u753b\u672c\uff0c\u5176\u4ed6\u7684\u6df1\u5165\u4e86\u89e3\u540e\u518d\u9009\u62e9\u201d **(\u52a1\u5b9e\u3001\u8bd5\u6c34\u5fc3\u6001\uff0c\u52a8\u673a\u4e3a\u641e\u94b1\u4e0e\u5174\u8da3\u6df7\u5408)**\n3. > \u201c\u5b66\u65e0\u6b62\u5883\u201d / \u201c\u58f0\u5165\u4eba\u5fc3\u201d **(\u66b4\u9732\u6df1\u5c42\u9700\u6c42\uff1a\u4ef7\u503c\u8ffd\u6c42\u4e0e\u7cbe\u795e\u6ee1\u8db3\uff0c\u8d85\u8d8a\u7eaf\u7cb9\u91d1\u94b1\u52a8\u673a)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2\u4f4e\u8c03\u5b9e\u5e72\u578b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u9000\u4f11\u540e\u7684\u4ef7\u503c\u91cd\u83b7\u4e0e\u5c0a\u91cd\u8ba4\u53ef\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u907f\u514d\u6536\u76ca\u843d\u5dee\uff0c\u4f18\u5148\u63d0\u4f9b\u4f4e\u95e8\u69db\u6b63\u53cd\u9988\u63a5\u5355\u4f53\u9a8c\uff0c\u5e76\u8c28\u614e\u63a2\u67e5\u5bb6\u5ead\u652f\u6301\u5ea6\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u5708\u5c42\u5408\u4f19\u4eba\u7ebf+\u5feb\u901f\u63a5\u5355\u4f53\u9a8c\u5305\"}\n```";
