    <script>
        const markdownText = "\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e\u3002\u7f3a\u652f\u4ed8\u4fe1\u606f\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u6df1\u5c42\u52a8\u673a\u3001\u5177\u4f53\u8d44\u6e90\u4e0e\u627f\u8bfa\u5ea6\u4fe1\u606f\u3002\n\n# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**: \u4e2d\u4f4e\u3002**\u4ece\u4f17\u6a21\u4eff**\uff08\u540c\u5b66\u63a8\u8350\uff09\u3001\u5174\u8da3\u9a71\u52a8\uff08\u201c\u611f\u5174\u8da3\u201d\uff09\uff0c\u4f46\u76ee\u6807\u6a21\u7cca\uff08\u5206\u4e0d\u6e05\u77ed\u89c6\u9891\u4e0e\u77ed\u5267\uff0c\u5bf9AI\u7f16\u7a0b\u6709\u989d\u5916\u671f\u5f85\uff09\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**: \u4fe1\u606f\u4e0d\u8db3\u3002\u5728\u804c\u72b6\u6001\uff08\u201c\u6211\u8fd8\u5728\u4e0a\u73ed\u201d\uff09\uff0c\u5177\u5907\u57fa\u7840\u5b66\u4e60\u65f6\u95f4\uff08\u665a\u4e0a/\u5468\u672b\uff09\u3002**\u652f\u4ed8\u80fd\u529b\u4e0e\u5b66\u4e60\u8bbe\u5907\u672a\u77e5**\u3002\n*   **\u5fc3\u7406\u5f39\u6027**: \u4e2d\u3002\u4e3b\u52a8\u8be2\u95ee\uff08\u65f6\u95f4\u3001\u8bfe\u7a0b\u5185\u5bb9\uff09\uff0c\u4f46**\u51b3\u7b56\u72b9\u8c6b**\uff08\u201c\u6211\u5148\u8003\u8651\u4e00\u4e0b\u201d\uff09\uff0c\u4e14\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u5b58\u5728**\u8ba4\u77e5\u504f\u5dee**\uff08\u6df7\u6dc6\u4ea7\u54c1\uff09\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u6267\u884c\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u672a\u63d0\u53ca**\u3002\u65e0\u6cd5\u5224\u65ad\u652f\u4ed8\u65b9\u5f0f\u3001\u662f\u5426\u672c\u4eba\u652f\u4ed8\u3001\u6709\u65e0\u72b9\u8c6b\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u672a\u63d0\u53ca**\u3002\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u4e3a\u72ec\u7acb\u51b3\u7b56\u6216\u9700\u5bb6\u5ead\u652f\u6301\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u4e0e\u76ee\u6807**: D\u7c7b\uff08\u6a21\u7cca/\u4ece\u4f17\uff09\u3002\u76ee\u6807\u975e\u5185\u751f\uff0c\u6e90\u4e8e\u540c\u5b66\u5f71\u54cd\uff0c\u4e14\u5bf9\u4ea7\u54c1\u5177\u4f53\u5185\u5bb9\u8ba4\u77e5\u4e0d\u6e05\u3002\n*   **\u6b65\u9aa42 - \u8d44\u6e90\u4e0e\u627f\u8bfa**: \u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u5f52C\u7c7b\uff08\u6709\u6761\u4ef6\uff09\u3002\u6709\u65f6\u95f4\uff0c\u4f46**\u627f\u8bfa\u5ea6\u5b58\u7591**\uff08\u66fe\u72b9\u8c6b\uff0c\u8ba4\u77e5\u6709\u504f\u5dee\uff09\u3002\n*   **\u6b65\u9aa43 - \u5fc3\u7406\u4e0e\u884c\u4e3a**: C\u7c7b\uff08\u6613\u53d7\u5e72\u6270\uff09\u3002\u5b58\u5728\u4fe1\u606f\u8fc7\u8f7d\u53cd\u5e94\uff08\u201c\u6d88\u606f\u597d\u5feb\uff0c\u6765\u4e0d\u53ca\u7406\u89e3\u201d\uff09\uff0c\u51b3\u7b56\u53d7\u793e\u4ea4\u5f71\u54cd\u3002\n*   **\u7efc\u5408\u5224\u5b9a**: **C/D\u6df7\u5408\u578b\uff08\u4ece\u4f17\u542f\u52a8\uff0c\u8ba4\u77e5\u6a21\u7cca\u578b\uff09**\u3002\u542f\u52a8\u6e90\u4e8e\u793e\u4ea4\u53c2\u7167\uff0c\u4f46\u5bf9\u4ea7\u54c1\u4ef7\u503c\u548c\u4e2a\u4eba\u6295\u5165\u9884\u671f\u4e0d\u6e05\u6670\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**: **T6 \u9ad8\u7126\u8651\u4ece\u4f17\u8005**\uff08\u90e8\u5206\u5339\u914d\uff09\u3002\u6838\u5fc3\u7279\u5f81\uff1a\u793e\u4ea4\u53c2\u7167\u542f\u52a8\uff08\u540c\u5b66\uff09\u3001\u76ee\u6807\u6a21\u7cca\u3001\u5b58\u5728\u8ba4\u77e5\u504f\u5dee\u4e0e\u4fe1\u606f\u7126\u8651\uff08\u201c\u6765\u4e0d\u53ca\u7406\u89e3\u201d\uff09\u3002\u4f46\u201c\u9ad8\u7126\u8651\u201d\u8bc1\u636e\u4e0d\u8db3\u3002\n*   **\u6b21\u9009\u539f\u578b**: T3 \u5c1d\u9c9c\u63a2\u7d22\u8005\uff08\u5bf9AI\u7f16\u7a0b\u6709\u989d\u5916\u5174\u8da3\uff0c\u4f46\u672a\u575a\u6301\uff09\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669**: **\u4e2d**\u3002\u6838\u5fc3\u98ce\u9669\u5728\u4e8e**\u8ba4\u77e5\u504f\u5dee\u4e0e\u9884\u671f\u7ba1\u7406**\u3002\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**: **\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u201cAI\u77ed\u5267\u5199\u4f5c\u201d\u548c\u201cAI\u77ed\u89c6\u9891\u201d\u6982\u5ff5\u6df7\u6dc6\uff0c\u4e14\u66fe\u8be2\u95eeAI\u7f16\u7a0b\uff0c**\u5b58\u5728\u9519\u8bef\u7684\u4ea7\u54c1\u529f\u80fd\u671f\u5f85**\u3002\n    2.  \u4ea4\u4ed8\u8d28\u91cf\u6295\u8bc9: \u4fe1\u606f\u4e0d\u8db3\u3002\n    3.  \u7ecf\u6d4e\u538b\u529b: \u4fe1\u606f\u4e0d\u8db3\u3002\n    4.  \u65f6\u95f4\u51b2\u7a81: \u4f4e\u98ce\u9669\u3002\u5df2\u786e\u8ba4\u665a\u4e0a/\u5468\u672b\u4e0a\u8bfe\uff0c\u4e14\u5728\u804c\u3002\n    5.  \u5bb6\u5ead\u53cd\u5bf9: \u4fe1\u606f\u4e0d\u8db3\u3002\n    6.  \u7ade\u54c1\u6bd4\u8f83/\u51b2\u52a8\u6d88\u8d39: **\u4e2d\u98ce\u9669**\u3002\u51b3\u7b56\u53d7\u540c\u5b66\u5f71\u54cd\uff08\u4ece\u4f17\uff09\uff0c\u53ef\u80fd\u5b58\u5728\u51b2\u52a8\u6210\u5206\u3002\n    7.  \u670d\u52a1\u4f53\u9a8c: \u4f4e\u98ce\u9669\u3002\u76ee\u524d\u6c9f\u901a\u987a\u7545\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u4e3b\u8981\u96f7\u533a**: **\u5b58\u5728\u4ea7\u54c1\u8ba4\u77e5\u504f\u5dee\u98ce\u9669**\u3002\u7528\u6237\u63d0\u53ca\u201cAI\u77ed\u5267\u201d\uff08\u5199\u4f5c\u8bfe\uff09\u4f46\u62a5\u540d\u201cAI\u77ed\u89c6\u9891\u201d\u8bfe\uff0c\u9500\u552e\u672a\u5c31**\u6b64\u5173\u952e\u5dee\u5f02\u8fdb\u884c\u6f84\u6e05\u4e0e\u786e\u8ba4**\uff0c\u53ef\u80fd\u57cb\u4e0b\u9884\u671f\u4e0d\u7b26\u7684\u9690\u60a3\u3002\n*   **\u5408\u89c4\u6027**: \u65e0\u8fc7\u5ea6\u627f\u8bfa\u3001\u6050\u5413\u9500\u552e\u7b49\u660e\u663e\u8fdd\u89c4\u3002\u4f46**\u77e5\u60c5\u540c\u610f\u73af\u8282\u6709\u7455\u75b5**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**: **\u504f\u5dee**\u3002\u7528\u6237\u5174\u8da3\u70b9\uff08\u540c\u5b66\u5b66\u5199\u4f5c/\u77ed\u89c6\u9891\u3001\u81ea\u8ff0\u6709\u57fa\u7840\u3001\u95eeAI\u7f16\u7a0b\uff09\u4e0e\u201cAIGC\u5168\u80fd\u89c6\u9891\u521b\u4f5c\u8425\u201d\u6709\u4ea4\u96c6\uff0c\u4f46**\u5176\u90e8\u5206\u671f\u5f85\uff08\u5982\u77ed\u5267\u5199\u4f5c\u3001\u7f16\u7a0b\uff09\u8d85\u51fa\u8be5\u4ea7\u54c1\u8303\u56f4**\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**:\n    1.  **\u5f00\u8bfe\u524d\u5fc5\u987b\u8fdb\u884c\u9884\u671f\u6821\u51c6**\uff1a\u9996\u5468\u5185\uff0c\u901a\u8fc7\u4e00\u5bf9\u4e00\u6c9f\u901a\u6216\u95ee\u5377\uff0c\u660e\u786e\u6f84\u6e05\u672c\u8bfe\u7a0b\u6559\u6388\u7684\u662f\u201cAI\u89c6\u9891\u5236\u4f5c\u5de5\u5177\u5e94\u7528\u4e0e\u5185\u5bb9\u521b\u4f5c\u201d\uff0c**\u5e76\u975e\u201cAI\u77ed\u5267\u5199\u4f5c\u201d\u6216\u201cAI\u7f16\u7a0b\u201d**\uff0c\u786e\u8ba4\u5176\u5b66\u4e60\u76ee\u6807\u4e0e\u8bfe\u7a0b\u76ee\u6807\u4e00\u81f4\u3002\n    2.  **\u5f3a\u5316\u4ef7\u503c\u5f15\u5bfc\u4e0e\u793e\u4ea4\u7ed1\u5b9a**\uff1a\u5229\u7528\u5176\u201c\u4ece\u4f17\u201d\u7279\u70b9\uff0c\u5728\u7fa4\u5185\u7a81\u51fa\u5c55\u793a\u5176\u540c\u5b66\uff08\u82e5\u5728\u540c\u671f\uff09\u6216\u7c7b\u4f3c\u5b66\u5458\u7684\u5b66\u4e60\u6210\u679c\uff0c\u589e\u5f3a\u5176\u5f52\u5c5e\u611f\u548c\u575a\u6301\u52a8\u529b\u3002\n    3.  **\u5173\u6ce8\u521d\u671f\u5b66\u4e60\u53cd\u9988**\uff1a\u524d\u4e24\u5468\u5bc6\u5207\u8ddf\u8e2a\u5176\u4f5c\u4e1a\u5b8c\u6210\u60c5\u51b5\u4e0e\u4e92\u52a8\uff0c\u9884\u9632\u56e0\u9884\u671f\u843d\u5dee\u6216\u754f\u96be\u60c5\u7eea\u5bfc\u81f4\u7684\u8131\u843d\u3002\n\n{\"core_type\": \"T6 \u9ad8\u7126\u8651\u4ece\u4f17\u8005\uff08\u503e\u5411\uff09\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u5f00\u8bfe\u524d\u6f84\u6e05\u8bfe\u7a0b\u8fb9\u754c\u4e0e\u9884\u671f\"}";
