    <script>
        const markdownText = "# AI\u5199\u4f5c\u8bfe\u5b66\u5458\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n## \u4fe1\u606f\u5145\u8db3\u6027\u8bc4\u4f30\n\u4fe1\u606f\u5145\u8db3\uff0c\u53ef\u8fdb\u884c\u5b8c\u6574\u5206\u6790\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49)**\n    *   **\u8868\u5c42\u9700\u6c42**\uff1a\u5b66\u4e60AI\u5199\u4f5c\u6280\u80fd\uff0c\u5b9e\u73b0\u526f\u4e1a\u53d8\u73b0\uff0c\u671f\u671b\u517c\u804c\u85aa\u8d4410000\u5143\u3002\n    *   **\u6df1\u5c42\u9700\u6c42**\uff1a\u5bfb\u6c42\u804c\u4e1a/\u6536\u5165\u7a81\u7834\uff08\u7a0b\u5e8f\u5458\u80cc\u666f\uff09\uff0c\u83b7\u5f97\u786e\u5b9a\u6027\u7684\u6280\u80fd\u63d0\u5347\u8def\u5f84\u548c\u53d8\u73b0\u6e20\u9053\u3002\n    *   **\u4fe1\u53f7**\uff1a\u660e\u786e\u8868\u8fbe\u4e86\u201c\u6709\u8fd9\u4e2a\u6253\u7b97\u201d\uff0c\u5173\u6ce8\u201c\u5199\u4f5c\u52a0\u77ed\u5267\u201d\u7b49\u9ad8\u6536\u76ca\u65b9\u5411\uff0c\u5bf9\u201c\u63d0\u793a\u8bcd\u5f88\u91cd\u8981\u201d\u3001\u201c\u6545\u4e8b\u7ed3\u6784\u4e5f\u5f88\u91cd\u8981\u201d\u7b49\u6838\u5fc3\u6280\u80fd\u70b9\u6709\u8ba4\u77e5\uff0c**\u52a8\u673a\u805a\u7126\u4e8e\u5b9e\u7528\u6280\u80fd\u4e0e\u53d8\u73b0**\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u521b\u4f5c\u70ed\u60c5\u6216\u6587\u5b66\u68a6\u60f3\u3002\n\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d\u7b49)**\n    *   **\u65f6\u95f4\u8d44\u6e90**\uff1a\u80fd\u8ddf\u4e0a\u4f53\u9a8c\u8425\u8282\u594f\uff0c\u5b8c\u6210\u4f5c\u4e1a\uff0c\u53c2\u4e0e\u76f4\u64ad\uff0c\u663e\u793a\u6709\u53ef\u652f\u914d\u7684\u4e1a\u4f59\u65f6\u95f4\u3002\n    *   **\u7ecf\u6d4e\u8d44\u6e90**\uff1a\u80fd\u652f\u4ed84380\u5143\u8bfe\u7a0b\u8d39\u7528\uff0c\u5177\u5907\u57fa\u7840\u6d88\u8d39\u80fd\u529b\u3002\n    *   **\u8ba4\u77e5\u8d44\u6e90**\uff1a29\u5c81\u7a0b\u5e8f\u5458\uff0c\u5bf9\u6280\u672f\u5de5\u5177\uff08AI\uff09\u63a5\u53d7\u5ea6\u9ad8\uff0c\u903b\u8f91\u601d\u7ef4\u5f3a\uff08\u80fd\u8bc6\u522bAI\u4f5c\u54c1\u201c\u903b\u8f91\u6709\u70b9\u4e0d\u6e05\u695a\u201d\uff09\uff0c\u5b66\u4e60\u80fd\u529b\u6709\u4fdd\u969c\u3002\n    *   **\u4fe1\u53f7**\uff1a\u804c\u4e1a\u80cc\u666f\u5e26\u6765\u5b66\u4e60\u4f18\u52bf\uff0c\u652f\u4ed8\u884c\u4e3a\u786e\u8ba4\u7ecf\u6d4e\u57fa\u7840\u3002**\u7f3a\u4e4f\u4fe1\u606f**\uff1a\u6bcf\u65e5\u53ef\u7a33\u5b9a\u6295\u5165\u7684\u5b66\u4e60\u65f6\u957f\u3001\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u3002\n\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u7b49\u504f\u9ad8)**\n    *   **\u575a\u6301\u6027**\uff1a\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\uff0c\u53c2\u4e0e\u591a\u573a\u76f4\u64ad\uff0c\u4e3b\u52a8\u63d0\u4ea4\u201c\u6536\u7a3f\u4fe1\u606f\u8868\u201d\uff0c\u884c\u4e3a\u914d\u5408\u5ea6\u9ad8\u3002\n    *   **\u5bb9\u9519\u4e0e\u6210\u957f\u5fc3\u6001**\uff1a\u80fd\u63a5\u53d7AI\u521d\u7a3f\u7684\u4e0d\u8db3\uff08\u201c\u903b\u8f91\u6709\u70b9\u4e0d\u6e05\u695a\u201d\uff09\uff0c\u8ba4\u53ef\u201c\u6bd4\u6628\u5929\u6709\u8fdb\u6b65\u201d\uff0c\u5173\u6ce8\u201c\u5ba1\u7a3f\u6539\u7a3f\uff0c\u4fdd\u8bc1\u8d28\u91cf\u201d\u7684\u540e\u671f\u6d41\u7a0b\uff0c\u8868\u73b0\u51fa\u52a1\u5b9e\u548c\u6301\u7eed\u4f18\u5316\u7684\u5fc3\u6001\u3002\n    *   **\u81ea\u4e3b\u6027**\uff1a\u6c9f\u901a\u7b80\u6d01\u3001\u76ee\u6807\u660e\u786e\uff08\u201c\u8981\u957f\u7bc7\u540d\u989d\u201d\uff09\uff0c\u51b3\u7b56\u679c\u65ad\uff08\u5feb\u901f\u652f\u4ed8\uff09\u3002\n    *   **\u4fe1\u53f7**\uff1a**\u884c\u4e3a\u914d\u5408\u5ea6\u9ad8\uff0c\u5177\u5907\u52a1\u5b9e\u548c\u89e3\u51b3\u95ee\u9898\u7684\u503e\u5411**\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u672a\u8868\u73b0\u51fa\u7126\u8651\u6216\u6025\u4e8e\u6c42\u6210\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u5df2\u652f\u4ed84380\u5143\uff0c**\u652f\u4ed8\u5b8c\u6210**\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u7528\u6237\u72ec\u7acb\u5b8c\u6210\u4fe1\u606f\u586b\u5199\u3001\u8bfe\u7a0b\u54a8\u8be2\u4e0e\u652f\u4ed8\uff0c\u804a\u5929\u8bb0\u5f55\u4e2d\u65e0\u63d0\u53ca\u914d\u5076\u6216\u5bb6\u4eba\u610f\u89c1\uff0c**\u53ef\u5224\u5b9a\u4e3a\u4e2a\u4eba\u51b3\u7b56**\u3002\n*   **\u6b65\u9aa41-4\u5224\u5b9a**\uff1a\n    *   **A (\u884c\u52a8\u529b)**\uff1a\u9ad8\u3002\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\u3001\u4e3b\u52a8\u4e92\u52a8\u3001\u5feb\u901f\u51b3\u7b56\u652f\u4ed8\u3002\n    *   **B (\u4fe1\u4efb\u5ea6)**\uff1a\u4e2d\u9ad8\u3002\u914d\u5408\u9500\u552e\u6307\u4ee4\uff08\u5982\u7fa4\u5185\u56de\u590d\u53e3\u4ee4\uff09\uff0c\u5bf9\u9500\u552e\u5206\u4eab\u7684\u53d8\u73b0\u6848\u4f8b\u548c\u8def\u5f84\u672a\u8868\u8d28\u7591\uff0c\u652f\u4ed8\u884c\u4e3a\u672c\u8eab\u662f\u4fe1\u4efb\u7684\u4f53\u73b0\u3002\n    *   **C (\u8ba4\u77e5\u5ea6)**\uff1a\u4e2d\u3002\u8ba4\u53ef\u6838\u5fc3\u6280\u80fd\u70b9\uff08\u63d0\u793a\u8bcd\u3001\u7ed3\u6784\uff09\uff0c\u4f46\u5bf9\u884c\u4e1a\u6df1\u5ea6\u3001\u81ea\u8eab\u957f\u671f\u6295\u5165\u7684\u8ba4\u77e5\u53ef\u80fd\u4ecd\u5904\u4e8e\u521d\u7ea7\u9636\u6bb5\u3002\n    *   **D (\u51b3\u7b56\u7d27\u8feb\u5ea6)**\uff1a\u4e2d\u3002\u5728\u4f53\u9a8c\u8425\u7b2c\u4e8c\u5929\u5373\u8868\u8fbe\u610f\u5411\u5e76\u5b8c\u6210\u652f\u4ed8\uff0c\u51b3\u7b56\u5468\u671f\u77ed\uff0c\u4f46\u8fc7\u7a0b\u4e2d\u8868\u73b0\u7406\u6027\uff0c\u5e76\u975e\u51b2\u52a8\u3002\n*   **\u7efc\u5408\u5224\u5b9a**\uff1a**A\u578b\u7528\u6237 (\u9ad8\u884c\u52a8\u529b\u4e3b\u5bfc\u578b)**\u3002\u884c\u4e3a\u9a71\u52a8\u660e\u663e\uff0c\u76ee\u6807\u660e\u786e\uff0c\u51b3\u7b56\u6548\u7387\u9ad8\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n**T4 \u52a1\u5b9e\u8fdb\u53d6\u578b**\n*   **\u6838\u5fc3\u7279\u5f81**\uff1a\u76ee\u6807\u5bfc\u5411\uff08\u53d8\u73b0\uff09\u3001\u7406\u6027\u52a1\u5b9e\uff08\u5173\u6ce8\u6280\u5de7\u4e0e\u7ed3\u6784\uff09\u3001\u6267\u884c\u529b\u5f3a\uff08\u6309\u65f6\u5b8c\u6210\u4efb\u52a1\uff09\u3001\u5bf9\u60c5\u611f\u6fc0\u52b1\u9700\u6c42\u4f4e\u3002\n*   **\u5339\u914d\u70b9**\uff1a\n    1.  \u804c\u4e1a\u4e3a\u7a0b\u5e8f\u5458\uff0c\u5177\u5907\u6280\u672f\u7406\u6027\u601d\u7ef4\u3002\n    2.  \u6c9f\u901a\u76f4\u63a5\uff0c\u5173\u6ce8\u201c\u63d0\u793a\u8bcd\u201d\u3001\u201c\u7ed3\u6784\u201d\u3001\u201c\u5ba1\u7a3f\u201d\u7b49\u5177\u4f53\u6280\u80fd\u548c\u6d41\u7a0b\u3002\n    3.  \u5bf9\u9ad8\u6536\u76ca\u53d8\u73b0\u8def\u5f84\uff08\u77ed\u5267\uff09\u8868\u73b0\u51fa\u660e\u786e\u5174\u8da3\u3002\n    4.  \u5b66\u4e60\u8fc7\u7a0b\u8868\u73b0\u51fa\u7a33\u5b9a\u7684\u8fdb\u6b65\u5fc3\u6001\u548c\u95ee\u9898\u89e3\u51b3\u5bfc\u5411\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4f4e)\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a\u98ce\u9669**\u4e2d**\u3002\u7528\u6237\u671f\u671b\u85aa\u8d4410000\u5143\uff0c\u5bf9\u6210\u679c\u6709\u660e\u786e\u91cf\u5316\u671f\u5f85\u3002\u82e5\u4e2d\u671f\u6295\u7a3f\u4e0d\u987a\u6216\u6536\u76ca\u751a\u5fae\uff0c\u6613\u4ea7\u751f\u843d\u5dee\u3002\n    2.  **\u8d44\u91d1\u538b\u529b**\uff1a\u98ce\u9669**\u4f4e**\u3002\u652f\u4ed8\u679c\u65ad\uff0c\u672a\u63d0\u53ca\u4ef7\u683c\u7591\u8651\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a\u98ce\u9669**\u4e2d**\u3002\u7a0b\u5e8f\u5458\u804c\u4e1a\u53ef\u80fd\u5b58\u5728\u9879\u76ee\u52a0\u73ed\uff0c\u5f71\u54cd\u957f\u671f\u5b66\u4e60\u6295\u5165\u3002\n    4.  **\u8bfe\u7a0b\u8d28\u91cf\u5f02\u8bae**\uff1a\u98ce\u9669**\u4f4e**\u3002\u76ee\u524d\u5bf9\u6559\u5b66\u5185\u5bb9\u53cd\u9988\u79ef\u6781\u3002\n    5.  **\u670d\u52a1\u4f53\u9a8c**\uff1a\u98ce\u9669**\u4f4e**\u3002\u4e0e\u9500\u552e\u4e92\u52a8\u987a\u7545\uff0c\u914d\u5408\u5ea6\u9ad8\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a\u98ce\u9669**\u4f4e**\u3002\u51b3\u7b56\u6743\u72ec\u7acb\u3002\n    7.  **\u7ade\u54c1\u8f6c\u79fb/\u51b2\u52a8\u6d88\u8d39\u540e\u6094**\uff1a\u98ce\u9669**\u4f4e**\u3002\u51b3\u7b56\u57fa\u4e8e\u4e24\u5929\u4f53\u9a8c\u548c\u7406\u6027\u8ba4\u77e5\uff0c\u975e\u51b2\u52a8\u3002\n*   **\u7efc\u5408\u98ce\u9669\u7b49\u7ea7**\uff1a**\u4f4e**\u3002\u4e3b\u8981\u98ce\u9669\u70b9\u5728\u4e8e**\u6548\u679c\u5151\u73b0\u5468\u671f\u548c\u5f3a\u5ea6\u4e0e\u9884\u671f\u53ef\u80fd\u4ea7\u751f\u7684\u504f\u5dee**\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5408\u89c4\u60c5\u51b5**\uff1a\u9500\u552e\u6d41\u7a0b\u57fa\u672c\u5408\u89c4\u3002\u63d0\u4f9b\u4e86\u4f53\u9a8c\u8bfe\u3001\u4f5c\u4e1a\u70b9\u8bc4\u3001\u53d8\u73b0\u6848\u4f8b\u3001\u660e\u786e\u8bfe\u7a0b\u4ef7\u683c\u4e0e\u5185\u5bb9\u3002\n*   **\u98ce\u9669\u63d0\u793a**\uff1a\n    *   **\u3010\u9700\u5173\u6ce8\u3011** \u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u6295\u7a3f\u8fc7\u7a3f\u7387\u9ad8\u8fbe80-90%\u201d\u3001\u201c\u7a3f\u8d39\u6700\u9ad8\u8bb0\u5f55\u4e00\u672c\u7a3f\u5b5080000\u201d\u7b49\u6536\u76ca\u6848\u4f8b\uff0c\u53ef\u80fd**\u62d4\u9ad8\u7528\u6237\u9884\u671f**\u3002\u9700\u786e\u4fdd\u540e\u7eed\u6709\u8db3\u591f\u7684\u98ce\u9669\u63d0\u793a\uff08\u5982\u6536\u76ca\u56e0\u4eba\u800c\u5f02\u3001\u9700\u6301\u7eed\u6295\u5165\uff09\u3002\n    *   \u7528\u6237\u652f\u4ed8\u540e\uff0c\u9500\u552e\u7acb\u5373\u63d0\u4f9b\u201c\u62a5\u8bfe\u798f\u5229\u201d\u548c\u201c\u8d60\u8bfe\u201d\uff0c\u7b26\u5408\u670d\u52a1\u6d41\u7a0b\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6838\u5fc3\u7b56\u7565**\uff1a**\u63d0\u4f9b\u6e05\u6670\u8def\u5f84\u3001\u5173\u6ce8\u8fdb\u5ea6\u53cd\u9988\u3001\u5f3a\u5316\u7ed3\u679c\u5bfc\u5411\u652f\u6301**\u3002\n*   **\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u521d\u671f\uff08\u7834\u51b0\u4e0e\u76ee\u6807\u786e\u8ba4\uff09**\uff1a\u795d\u8d3a\u52a0\u5165\uff0c\u660e\u786e\u5176\u201c\u5199\u4f5c\u52a0\u77ed\u5267\u201d\u7684\u5b66\u4e60\u76ee\u6807\u3002\u4e0e\u5176\u5171\u540c\u5236\u5b9a\u4e00\u4e2a**\u9636\u6bb5\u6027\u7684\u3001\u53ef\u91cf\u5316\u7684\u5b66\u4e60\u4e0e\u6295\u7a3f\u8ba1\u5212**\uff08\u5982\uff1a\u7b2c\u4e00\u6708\u5b8c\u6210\u57fa\u7840\u8bfe\u5e76\u5c1d\u8bd5\u7b2c\u4e00\u7bc7\u77ed\u6545\u4e8b\u6295\u7a3f\uff09\uff0c\u5c06\u4e07\u5143\u671f\u671b\u5206\u89e3\u4e3a\u9636\u6bb5\u6027\u5c0f\u76ee\u6807\u3002\n    2.  **\u4e2d\u671f\uff08\u5b66\u4e60\u652f\u6301\uff09**\uff1a\u63d0\u4f9b\u6e05\u6670\u7684\u8bfe\u7a0b\u5b66\u4e60\u8def\u5f84\u56fe\u3002\u56e0\u5176\u4e3a\u7a0b\u5e8f\u5458\uff0c\u53ef\u4fa7\u91cd\u5f15\u5bfc\u5176\u5173\u6ce8\u201c\u63d0\u793a\u8bcd\u5de5\u7a0b\u201d\u7684\u6280\u672f\u9762\uff0c\u53d1\u6325\u5176\u903b\u8f91\u4f18\u52bf\u3002\u5b9a\u671f\u68c0\u67e5\u4f5c\u4e1a\uff0c**\u53cd\u9988\u9700\u5177\u4f53\u3001\u805a\u7126\u4e8e\u6280\u5de7\u63d0\u5347\u548c\u95ee\u9898\u89e3\u51b3**\uff08\u5982\uff1a\u5982\u4f55\u4f18\u5316\u63d0\u793a\u8bcd\u7ed3\u6784\u4ee5\u63a7\u5236\u5267\u60c5\u8d70\u5411\uff09\uff0c\u51cf\u5c11\u60c5\u611f\u5316\u9f13\u52b1\u3002\n    3.  **\u540e\u671f\uff08\u53d8\u73b0\u966a\u8dd1\uff09**\uff1a**\u4f18\u5148\u5bf9\u63a5\u5176\u611f\u5174\u8da3\u7684\u77ed\u5267\u5267\u672c\u76f8\u5173\u8d44\u6e90\u548c\u5546\u5355\u4fe1\u606f**\u3002\u5728\u6295\u7a3f\u73af\u8282\uff0c\u63d0\u4f9b\u6e05\u6670\u7684\u5e73\u53f0\u89c4\u5219\u3001\u5ba1\u7a3f\u6807\u51c6\u548c\u6539\u7a3f\u5efa\u8bae\uff0c\u5e2e\u52a9\u5176\u8de8\u8d8a\u4ece\u201c\u5199\u5b8c\u201d\u5230\u201c\u8fc7\u7a3f\u201d\u7684\u5b9e\u8df5\u9e3f\u6c9f\u3002\u7ba1\u7406\u5176\u6536\u76ca\u9884\u671f\uff0c\u5f3a\u8c03\u6301\u7eed\u4f18\u5316\u548c\u6570\u91cf\u79ef\u7d2f\u7684\u91cd\u8981\u6027\u3002\n    4.  **\u98ce\u9669\u9632\u63a7**\uff1a\u5bc6\u5207\u5173\u6ce8\u5176\u9996\u6b21\u6295\u7a3f\u7ed3\u679c\u3002\u82e5\u9047\u632b\uff0c\u53ca\u65f6\u4ecb\u5165\uff0c\u5f15\u5bfc\u5176\u5206\u6790\u539f\u56e0\u3001\u8c03\u6574\u7b56\u7565\uff0c\u907f\u514d\u56e0\u65e9\u671f\u632b\u6298\u76f4\u63a5\u5bfc\u81f4\u653e\u5f03\u6216\u6295\u8bc9\u3002\u5f3a\u8c03\u5199\u4f5c\u6280\u80fd\u7684\u957f\u671f\u6027\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**\uff1a\n    *   **\u4e3b\u7ebf**\uff1aAI\u5199\u4f5c+\u77ed\u5267\u5267\u672c\u521b\u4f5c\u65d7\u8230\u73ed\uff08\u5df2\u9009\u62e9\uff09\u3002\n    *   **\u589e\u503c/\u4e50\u9ad8\u7ebf**\uff1a\u53ef\u540e\u7eed\u63a8\u8350**\u9ad8\u9636\u63d0\u793a\u8bcd\u5de5\u7a0b\u8bfe**\u3001**\u7ec6\u5206\u5782\u7c7b\uff08\u5982\u60ac\u7591\u3001\u90fd\u5e02\uff09\u6545\u4e8b\u7ed3\u6784\u6df1\u7814\u8bfe**\u3001**\u77ed\u5267\u6570\u636e\u5206\u6790\u4e0e\u8fd0\u8425\u8bfe**\uff0c\u6ee1\u8db3\u5176\u6280\u672f\u6df1\u5316\u548c\u53d8\u73b0\u6548\u7387\u63d0\u5347\u7684\u9700\u6c42\u3002\n\n{\"core_type\": \"T4 \u52a1\u5b9e\u8fdb\u53d6\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd\uff08\u80fd\u529b\u63d0\u5347\uff09/\u81ea\u6211\u5b9e\u73b0\uff08\u526f\u4e1a\u6210\u5c31\uff09\", \"target_product_line\": \"AI\u5199\u4f5c+\u77ed\u5267\u5267\u672c\u65d7\u8230\u73ed\uff08\u5df2\u9009\uff09\uff0c\u540e\u7eed\u53ef\u6302\u8f7d\u9ad8\u9636\u63d0\u793a\u8bcd\u5de5\u7a0b\u3001\u5782\u7c7b\u6545\u4e8b\u6df1\u7814\u3001\u77ed\u5267\u8fd0\u8425\u8bfe\", \"age\": \"29\", \"gender\": \"\u7537\", \"city\": \"\u672a\u77e5\"}";
