    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u6ca1\u523a\u7684\u4ed9\u4eba\u638cD-\u8fde\u4e91\u6e2f-\u5973\u64ad |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-19 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u8d85\u8d85\u4e08\u4eba(\u9a6c\u4ec1\u8d85) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66/\u914d\u97f3\u8bfe\u7a0b\uff08\u5177\u4f53\u8bfe\u7a0b\u540d\u79f0\u53ca\u4ef7\u683c\u672a\u77e5\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u4e3b\u52a8\u54a8\u8be2\u5e76\u4e0b\u5355\u8d2d\u4e70\u8bbe\u5907\uff08\u201c\u5df2\u7ecf\u4e0b\u5355\u5566\u201d\uff09\uff0c\u4f46\u672a\u63d0\u53ca\u8bfe\u7a0b\u652f\u4ed8\u65b9\u5f0f\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u4e3a\u5b9d\u5988\uff0c\u9700\u7167\u987e\u5c0f\u5b69\uff08\u201c\u5728\u5916\u9762\u5e26\u5c0f\u5b69\u4e86\u201d\u3001\u201c\u5c0f\u7684\u5c31\u5f80\u8eab\u4e0a\u722c\u201d\uff09\uff0c\u5b66\u4e60\u65f6\u95f4\u9700\u4ece\u80b2\u513f\u548c\u5bb6\u52a1\u4e2d\u6324\u51fa\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\uff0c\u4f46\u7528\u6237\u80fd\u81ea\u4e3b\u5b89\u6392\u5b66\u4e60\u3001\u8d2d\u4e70\u8bbe\u5907\uff0c\u63a8\u6d4b\u4e3a**\u5355\u8eab\u72ec\u7acb\u6216\u5df2\u62a5\u5907\u5e76\u652f\u6301**\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u4e92\u52a8\u9891\u7e41\uff0c\u6df1\u5ea6\u53c2\u4e0e\u793e\u7fa4\u4e0e\u5b66\u4e60\u6d3b\u52a8\uff0c\u4fe1\u606f\u5145\u5206\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u5173\u6ce8\u6280\u80fd\u63d0\u5347\u3001\u793e\u7fa4\u534f\u4f5c\u4e0e\u81ea\u6211\u5b9e\u73b0\uff0c\u800c\u975e\u77ed\u671f\u53d8\u73b0\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u60f3\u8bf4\u6211\u4eec\u662f\u4e0d\u662f\u4e0d\u592a\u5bf9@\u5c0f\u82f1-\u8d63\u5dde-\u5973\u64ad\u2005@\u5c81\u6708\u9759\u597d\u2014\u79e6\u7687\u5c9b\u2014\u5973\u64ad\u2005@\u5c0f\u7070\u72fc-\u5357\u5b81-\u5973\u64ad\u201d (\u79ef\u6781\u53c2\u4e0e\u793e\u7fa4\u534f\u4f5c\uff0c\u5173\u6ce8\u4efb\u52a1\u672c\u8eab)\n> \u201c\u8d85\u8d85\uff0c\u5982\u679c\u62ff\u5230\u672c\u5b50\uff0c\u60f3\u52a0\u91cd\u97f3\u505c\u8fde\u8fd9\u4e9b\u6807\u8bb0\u7684\u8bdd\uff0c\u662f\u9700\u8981\u6253\u5370\u51fa\u6765\u753b\u5417\uff0c\u7535\u8111\u6216\u624b\u673a\u4e0a\u6709\u4ec0\u4e48\u5de5\u5177\u53ef\u4ee5\u64cd\u4f5c\u5417\u201d (\u5173\u6ce8\u5177\u4f53\u6280\u80fd\u7ec6\u8282\u548c\u5de5\u5177)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u81ea\u4e3b\u8d2d\u4e70\u8bfe\u7a0b\u76f8\u5173\u8bbe\u5907\uff08\u201c\u5df2\u7ecf\u4e0b\u5355\u5566\u201d\uff09\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\uff0c\u4f46\u672a\u663e\u793a\u9ad8\u6d88\u8d39\u80fd\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u65f6\u95f4\u88ab\u80b2\u513f\u548c\u5bb6\u5ead\u4e8b\u52a1\u5206\u5272\uff0c\u5448\u73b0\u201c\u788e\u7247\u5316\u62fc\u51d1\u201d\u72b6\u6001\uff08\u201c\u4e00\u5929\u90fd\u5728\u5916\u9762\uff0c\u665a\u4e0a\u5fd9\u8d77\u6765\u201d\u3001\u201c\u4e00\u8fb9\u770b\uff0c\u5c0f\u7684\u5c31\u5f80\u8eab\u4e0a\u722c\u201d\uff09\uff0c\u4f46\u80fd\u575a\u6301\u5b66\u4e60\u548c\u793e\u7fa4\u6d3b\u52a8\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4e2d** \u2014 \u867d\u672a\u660e\u786e\u63d0\u53ca\uff0c\u4f46\u80fd\u6301\u7eed\u6295\u5165\u5b66\u4e60\uff0c\u4e14\u9700\u5e26\u5c0f\u5b69\uff0c\u63a8\u6d4b\u5bb6\u5ead\u73af\u5883\u5141\u8bb8\u5176\u6709\u4e00\u5b9a\u4e2a\u4eba\u53d1\u5c55\u7a7a\u95f4\uff0c\u4f46\u975e\u5b8c\u5168\u65e0\u5fe7\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\uff0c\u79ef\u6781\u4e50\u89c2\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u65e0\u8d1f\u9762\u60c5\u7eea\u5ba3\u6cc4\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u66b4\u98ce\u96e8\u66f4\u731b\u70c8\u4e9b\u5427[\u5077\u7b11]\u201d (\u4ee5\u5e7d\u9ed8\u79ef\u6781\u6001\u5ea6\u9762\u5bf9\u5b66\u4e60\u538b\u529b)\n> \u201c\u95ee\u9898\u4e0d\u5927\uff0c\u5e26\u53bb\u770b\u770b\uff0c\u786e\u8ba4\u4e00\u4e0b\u597d\u653e\u5fc3[\u5fae\u7b11]\u201d (\u5904\u7406\u5bb6\u5ead\u4e8b\u52a1\u65f6\u60c5\u7eea\u7a33\u5b9a\u3001\u6709\u6761\u7406)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42 / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5728\u5bb6\u5ead\u4e3b\u5987/\u5b9d\u5988\u8eab\u4efd\u4e4b\u5916\uff0c\u6e34\u671b\u83b7\u5f97**\u4e13\u4e1a\u7684\u793e\u7fa4\u5f52\u5c5e\u611f\u3001\u56e2\u961f\u534f\u4f5c\u4e2d\u7684\u4ef7\u503c\u8ba4\u53ef**\uff0c\u5e76\u8ffd\u6c42**\u4e2a\u4eba\u5174\u8da3\u4e0e\u6f5c\u80fd\u7684\u53d1\u5c55**\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u8d4b\u4e88\u5979\u5728\u4e13\u4e1a\u793e\u7fa4\u4e2d\u7684\u89d2\u8272\u611f\u4e0e\u9886\u5bfc\u529b\uff08\u5982\u5c0f\u7ec4\u534f\u8c03\uff09\uff0c\u5e76\u5bf9\u5176\u5b66\u4e60\u70ed\u60c5\u548c\u8fdb\u6b65\u7ed9\u4e88\u516c\u5f00\u7684\u3001\u5177\u4f53\u7684\u80af\u5b9a\u3002**\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 **B\u7c7b** (\u9ad8\u52a8\u673a\u3001\u4e2d\u8d44\u6e90\u3001\u9ad8\u5f39\u6027\uff0c\u662f\u6838\u5fc3\u57f9\u517b\u7528\u6237) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u79ef\u6781\u53c2\u4e0e\u793e\u7fa4\u534f\u4f5c\u3001\u4e3b\u52a8\u63d0\u95ee\u6280\u672f\u7ec6\u8282\u3001\u60c5\u7eea\u7a33\u5b9a\u3001\u4e50\u4e8e\u52a9\u4eba) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u5bb6\u5ead\u4e8b\u52a1\uff08\u5982\u5b69\u5b50\u751f\u75c5\uff09\u53ef\u80fd\u6682\u65f6\u6324\u5360\u5b66\u4e60\u65f6\u95f4\uff0c\u4f46\u7528\u6237\u80fd\u81ea\u6211\u534f\u8c03\uff0c\u672a\u89c1\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4e2d | **\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u56e0\u80b2\u513f\u5bfc\u81f4\u65f6\u95f4\u6781\u5ea6\u788e\u7247\u5316\uff0c\u53ef\u80fd\u65e0\u6cd5\u6309\u65f6\u5b8c\u6210\u9ad8\u5f3a\u5ea6\u4f5c\u4e1a\u6216\u76f4\u64ad\uff0c\u4ea7\u751f\u7d2f\u79ef\u6027\u7126\u8651\u548c\u632b\u8d25\u611f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u672a\u89c1\u4efb\u4f55\u62b1\u6028\u6216\u81ea\u6211\u5426\u5b9a\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u52a8\u673a\u7eaf\u5ea6\u9ad8\uff0c\u5173\u6ce8\u8fc7\u7a0b\u4e0e\u80fd\u529b\u6210\u957f\uff0c\u800c\u975e\u77ed\u671f\u53d8\u73b0\uff0c\u5bf9\u6536\u76ca\u9884\u671f\u7ba1\u7406\u8f83\u597d\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u8bfe\u7a0b\u4e2d\u540e\u671f\uff08\u7b2c4-6\u5468\uff09\uff0c\u5f53\u8bfe\u7a0b\u96be\u5ea6\u548c\u4f5c\u4e1a\u91cf\u589e\u52a0\uff0c\u4e0e\u788e\u7247\u5316\u65f6\u95f4\u77db\u76fe\u6fc0\u5316\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4ed9\u4eba\u638c\uff0c\u770b\u5230\u4f60\u5728\u7fa4\u91cc\u7279\u522b\u70ed\u5fc3\uff0c\u7ecf\u5e38\u534f\u8c03\u5927\u5bb6\u7ec3\u4e60\uff0c\u771f\u7684\u5f88\u9760\u8c31\uff01\u54b1\u4eec\u8fd9\u671f\u8bfe\u7a0b\u5b9e\u6218\u4efb\u52a1\u4f1a\u6bd4\u8f83\u591a\uff0c\u77e5\u9053\u4f60\u5e73\u65f6\u5e26\u5a03\u7279\u522b\u5fd9\uff0c\u65f6\u95f4\u90fd\u662f\u6324\u51fa\u6765\u7684\u3002\u522b\u62c5\u5fc3\uff0c\u54b1\u4eec\u4e0d\u8ffd\u6c42\u901f\u5ea6\uff0c\u91cd\u70b9\u662f\u6bcf\u4e00\u6b65\u90fd\u624e\u5b9e\u3002\u65f6\u95f4\u5b89\u6392\u4e0a\u6709\u4ec0\u4e48\u56f0\u96be\uff0c\u968f\u65f6\u8ddf\u6211\u6c9f\u901a\uff0c\u6211\u4eec\u4e00\u8d77\u60f3\u529e\u6cd5\u8c03\u6574\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u3002\u5339\u914d\u5176T2\u5b9e\u5e72\u7279\u8d28\uff0c\u63d0\u4f9b\u6e05\u6670\u7684\u6280\u80fd\u8fdb\u9636\u8def\u5f84\u548c\u5b9e\u6218\u4efb\u52a1\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\u7684\u7279\u70b9\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010**\u7075\u6d3b\u65f6\u95f4\u7ba1\u7406\u5305**\u3011\uff08\u5982\uff1a\u63d0\u4f9b\u5173\u952e\u77e5\u8bc6\u70b9\u5207\u7247\u3001\u5141\u8bb8\u4f5c\u4e1a\u5f39\u6027\u63d0\u4ea4\u3001\u91cd\u70b9\u76f4\u64ad\u63d0\u4f9b\u56de\u653e+\u8981\u70b9\u603b\u7ed3\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u56e0\u5176\u5076\u5c14\u7f3a\u5e2d\u6216\u5ef6\u8fdf\u63d0\u4ea4\u4f5c\u4e1a\u800c\u65bd\u52a0\u538b\u529b\u6216\u516c\u5f00\u6279\u8bc4\u30022. \u5ffd\u7565\u5979\u5728\u793e\u7fa4\u4e2d\u7684\u534f\u4f5c\u8d21\u732e\uff0c\u4e0d\u7ed9\u4e88\u89d2\u8272\u8ba4\u53ef\u30023. \u53ea\u63d0\u4f9b\u6807\u51c6\u5316\u7684\u3001\u4e0d\u8003\u8651\u5b9d\u5988\u65f6\u95f4\u7279\u6027\u7684\u5b66\u4e60\u8ba1\u5212\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u63a8\u4ecb\u4e0e\u6280\u80fd\u6df1\u5ea6\u76f8\u5173\u7684**\u9ad8\u9636\u4e13\u9879\u8bfe**\uff08\u5982\u9ad8\u7ea7\u6f14\u64ad\u3001\u753b\u672c\u7cbe\u4fee\uff09\uff0c\u4f46\u9700\u660e\u786e\u5176\u65f6\u95f4\u6295\u5165\u8981\u6c42\uff0c\u8c28\u614e\u63a8\u8350\u65f6\u95f4\u627f\u8bfa\u8fc7\u91cd\u7684\u957f\u671f\u9879\u76ee\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u60f3\u8bf4\u6211\u4eec\u662f\u4e0d\u662f\u4e0d\u592a\u5bf9@\u5c0f\u82f1-\u8d63\u5dde-\u5973\u64ad\u2005@\u5c81\u6708\u9759\u597d\u2014\u79e6\u7687\u5c9b\u2014\u5973\u64ad\u2005@\u5c0f\u7070\u72fc-\u5357\u5b81-\u5973\u64ad\u201d **(\u4f53\u73b0\u793e\u7fa4\u53c2\u4e0e\u4e0e\u534f\u4f5c\u7cbe\u795e)**\n2. > \u201c\u4e00\u8fb9\u770b\uff0c\u5c0f\u7684\u5c31\u5f80\u8eab\u4e0a\u722c[\u7834\u6d95\u4e3a\u7b11]\u6253\u7b97\u53bb\u91cd\u770b\u201d **(\u4f53\u73b0\u65f6\u95f4\u788e\u7247\u5316\u73b0\u72b6\u4e0e\u575a\u6301\u5b66\u4e60\u7684\u97e7\u6027)**\n3. > \u201c\u66b4\u98ce\u96e8\u66f4\u731b\u70c8\u4e9b\u5427[\u5077\u7b11]\u201d **(\u4f53\u73b0\u9ad8\u5fc3\u7406\u5f39\u6027\u4e0e\u79ef\u6781\u6311\u6218\u5fc3\u6001)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2\u4f4e\u8c03\u5b9e\u5e72\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u4e13\u4e1a\u793e\u7fa4\u4e2d\u83b7\u5f97\u5f52\u5c5e\u611f\u3001\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u8ba4\u53ef\u5176\u793e\u7fa4\u8d21\u732e\uff0c\u5e76\u63d0\u4f9b\u9002\u914d\u5176\u788e\u7247\u5316\u65f6\u95f4\u7684\u5f39\u6027\u5b66\u4e60\u652f\u6301\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"maslow_need\": \"\u793e\u4ea4/\u5c0a\u91cd/\u81ea\u6211\u5b9e\u73b0\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u7075\u6d3b\u65f6\u95f4\u7ba1\u7406\u5305\"}\n```";
