    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a\u4e2d\u7b49\u504f\u9ad8\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5174\u8da3\u63a2\u7d22\u4e0e\u526f\u4e1a\u53d8\u73b0\u53cc\u91cd\u9a71\u52a8\u3002\u81ea\u8ff0\u201c\u4e3b\u4e1a\u9ad8\u6821\u79d1\u7814\uff08\u4eba\u6587\u793e\u79d1\u7c7b\uff09\uff0c\u526f\u4e1a\u505a\u6559\u80b2\u9879\u76ee\uff0c\u5e73\u65f6\u63a5\u89e6\u513f\u7ae5\u9752\u5c11\u5e74\u6bd4\u8f83\u591a\uff0c\u6240\u4ee5\u5e0c\u671b\u53ef\u4ee5\u5728\u54b1\u4eec\u8fd9\u4e2a\u9886\u57df\u627e\u5230\u5408\u9002\u7684\u65b9\u5411\u201d\uff0c\u663e\u793a\u5176\u5c06\u6709\u58f0\u6f14\u64ad\u4e0e\u73b0\u6709\u804c\u4e1a\u80cc\u666f\uff08\u6559\u80b2\u3001\u513f\u7ae5\uff09\u7ed3\u5408\u7684\u610f\u56fe\uff0c\u975e\u7eaf\u7cb9\u51b2\u52a8\u6d88\u8d39\u3002\u4e3b\u52a8\u8be2\u95ee\u201c\u514d\u8d39\u8bad\u7ec3\u8425\u662f\u5426\u80fd\u8ba9\u6211\u5165\u884c\uff0c\u4ed8\u8d39\u8bfe\u7a0b\u662f\u4ec0\u4e48\u6388\u8bfe\u6a21\u5f0f\uff0c\u4e0a\u5b8c\u540e\u987a\u5229\u63a5\u5355\u7684\u5b66\u5458\u6bd4\u4f8b\u662f\u591a\u5c11\uff1f\u201d\uff0c\u4f53\u73b0\u5176\u7406\u6027\u8003\u5bdf\u4e0e\u7ed3\u679c\u5bfc\u5411\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u4e2d\u7b49**\u3002\u804c\u4e1a\u80cc\u666f\uff08\u9ad8\u6821\u79d1\u7814\u3001\u6559\u80b2\u9879\u76ee\uff09\u663e\u793a\u5177\u5907\u826f\u597d\u7684\u5b66\u4e60\u80fd\u529b\u3001\u65f6\u95f4\u89c4\u5212\u80fd\u529b\u53ca\u6f5c\u5728\u7684\u77e5\u8bc6\u50a8\u5907\uff0c\u6709\u5229\u4e8e\u5185\u5bb9\u7406\u89e3\u4e0e\u5b66\u4e60\u3002\u4f46\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u5177\u4f53\u7ecf\u6d4e\u72b6\u51b5\u3001\u6bcf\u65e5\u53ef\u6295\u5165\u5b66\u4e60/\u7ec3\u4e60\u7684\u7a33\u5b9a\u65f6\u957f\u3001\u5bb6\u5ead\u652f\u6301\u5ea6\u7b49\u5173\u952e\u8d44\u6e90\u4fe1\u606f\uff0c**\u5b58\u5728\u4fe1\u606f\u7f3a\u53e3**\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a**\u8f83\u9ad8**\u3002\u7528\u6237\u5728\u6574\u4e2a\u6c9f\u901a\u8fc7\u7a0b\u4e2d\u914d\u5408\u5ea6\u6781\u9ad8\uff0c\u6309\u65f6\u5b8c\u6210\u65e9\u529f\u3001\u542c\u8bfe\u3001\u4f5c\u4e1a\uff0c\u5bf9\u9500\u552e\uff08\u5e08\u59d0\uff09\u7684\u6307\u5bfc\u53cd\u9988\u79ef\u6781\uff08\u5982\u201c\u6536\u5230\uff0c\u611f\u8c22\u5e08\u59d0\u201d\u3001\u201c\u6211\u4f1a\u8ba4\u771f\u5b66\u4e60\u201d\uff09\uff0c\u5e76\u4e3b\u52a8\u8868\u8fbe\u201c\u6211\u5f88\u559c\u6b22\u5b66\u8fd9\u4e9b\uff0c\u4e5f\u6709\u70b9\u57fa\u7840\uff0c\u5e0c\u671b\u8ddf\u7740\u5e08\u59d0\u53ef\u4ee5\u6210\u957f\u66f4\u5feb\u201d\u3002\u9762\u5bf9\u9500\u552e\u5bc6\u96c6\u7684\u4e92\u52a8\u4e0e\u4efb\u52a1\uff0c\u672a\u8868\u73b0\u51fa\u538b\u529b\u6216\u62b5\u89e6\uff0c\u9002\u5e94\u6027\u826f\u597d\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u5df2\u652f\u4ed8\u3002\u7528\u6237\u4e8e4\u67088\u65e5\u76f4\u64ad\u4e2d\u652f\u4ed82380\u5143\u62a5\u540d\u201c\u56db\u4e2a\u6708\u7684\u7cfb\u7edf\u8bfe\u201d\uff08\u9ad8\u9636\u73ed\uff09\uff0c\u652f\u4ed8\u884c\u4e3a\u5df2\u5b8c\u6210\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u5168\u7a0b\u4e3a\u7528\u6237\u4e2a\u4eba\u4e0e\u9500\u552e\u5bf9\u63a5\uff0c\u672a\u63d0\u53ca\u914d\u5076\u3001\u7236\u6bcd\u7b49\u5bb6\u5ead\u6210\u5458\uff0c\u4e5f\u672a\u8868\u73b0\u51fa\u9700\u8981\u5f81\u6c42\u5bb6\u4eba\u540c\u610f\u7684\u8ff9\u8c61\u3002\u4f46\u9274\u4e8e\u652f\u4ed8\u91d1\u989d\u4e3a2380\u5143\uff0c\u5c5e\u4e8e\u4e2d\u7b49\u4ef7\u4f4d\uff0c\u4e14\u7528\u6237\u6709\u7a33\u5b9a\u804c\u4e1a\uff0c**\u521d\u6b65\u5224\u65ad\u4e3a\u4e2a\u4eba\u53ef\u51b3\u7b56\u8303\u56f4\uff0c\u4f46\u5bb6\u5ead\u77e5\u60c5\u60c5\u51b5\u672a\u77e5**\u3002\n*   **\u6b65\u9aa41-4\u5224\u5b9a**\uff1a\n    *   **A\uff08\u652f\u4ed8\u80fd\u529b\u4e0e\u610f\u613f\uff09**\uff1a\u7b26\u5408\u3002\u5df2\u652f\u4ed8\u3002\n    *   **B\uff08\u9700\u6c42\u771f\u5b9e\u6027\uff09**\uff1a\u7b26\u5408\u3002\u57fa\u4e8e\u804c\u4e1a\u80cc\u666f\u7684\u5ef6\u4f38\u63a2\u7d22\u9700\u6c42\u660e\u786e\uff0c\u4e14\u53c2\u4e0e\u4e86\u524d\u671f\u8bad\u7ec3\u8425\u7684\u5b8c\u6574\u5b66\u4e60\u6d41\u7a0b\u3002\n    *   **C\uff08\u4ea7\u54c1\u5339\u914d\u5ea6\uff09**\uff1a**\u5f85\u89c2\u5bdf**\u3002\u7528\u6237\u9700\u6c42\uff08\u7ed3\u5408\u6559\u80b2\u80cc\u666f\u627e\u65b9\u5411\uff09\u4e0e\u6709\u58f0\u6f14\u64ad\u7684\u591a\u5143\u53d8\u73b0\u8def\u5f84\uff08\u5f55\u4e66\u3001\u753b\u672c\u3001\u5ba1\u542c\u7b49\uff09\u5b58\u5728\u5339\u914d\u70b9\u3002\u4f46\u9700\u5173\u6ce8\u5176\u5bf9\u201c\u5b66\u5b8c\u63a5\u5355\u6bd4\u4f8b\u201d\u7684\u5173\u5207\uff0c\u540e\u7eed\u9700\u7ba1\u7406\u5176\u53d8\u73b0\u9884\u671f\u3002\n    *   **D\uff08\u957f\u671f\u884c\u52a8\u529b\uff09**\uff1a**\u503e\u5411\u7b26\u5408**\u3002\u5728\u4f53\u9a8c\u8425\u9636\u6bb5\u5c55\u73b0\u4e86\u826f\u597d\u7684\u4efb\u52a1\u5b8c\u6210\u5ea6\u548c\u5b66\u4e60\u4e3b\u52a8\u6027\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**\uff1a**B+ \u6f5c\u529b\u7528\u6237**\u3002\u5df2\u5b8c\u6210\u652f\u4ed8\uff0c\u9700\u6c42\u771f\u5b9e\uff0c\u914d\u5408\u5ea6\u9ad8\uff0c\u4f46\u9700\u8865\u5145\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u5e76\u5bc6\u5207\u8ddf\u8e2a\u4ea7\u54c1\u5339\u914d\u4e0e\u9884\u671f\u7ba1\u7406\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**\uff1a**T4 \u7406\u6027\u89c4\u5212\u8005**\u3002\n    *   \u7279\u5f81\uff1a\u6709\u4e3b\u4e1a\uff0c\u5bfb\u6c42\u6280\u80fd\u62d3\u5c55\u6216\u526f\u4e1a\u589e\u6536\uff1b\u51b3\u7b56\u524d\u4f1a\u8fdb\u884c\u7406\u6027\u8003\u5bdf\uff08\u8be2\u95ee\u8bfe\u7a0b\u6a21\u5f0f\u3001\u63a5\u5355\u6bd4\u4f8b\uff09\uff1b\u5b66\u4e60\u8fc7\u7a0b\u8ba4\u771f\u3001\u6709\u6761\u7406\uff1b\u76ee\u6807\u660e\u786e\uff08\u7ed3\u5408\u81ea\u8eab\u80cc\u666f\u627e\u65b9\u5411\uff09\u3002\n    *   \u543b\u5408\u70b9\uff1a\u9ad8\u6821\u79d1\u7814\u4e0e\u6559\u80b2\u9879\u76ee\u80cc\u666f\u3001\u5bf9\u8bfe\u7a0b\u4fe1\u606f\u7684\u7ed3\u6784\u5316\u8be2\u95ee\u3001\u8bad\u7ec3\u8425\u671f\u95f4\u7a33\u5b9a\u7684\u4efb\u52a1\u5b8c\u6210\u8bb0\u5f55\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u660e\u786e\u8be2\u95ee\u201c\u4e0a\u5b8c\u540e\u987a\u5229\u63a5\u5355\u7684\u5b66\u5458\u6bd4\u4f8b\u662f\u591a\u5c11\uff1f\u201d\uff0c\u663e\u793a\u5bf9\u5b66\u4e60\u7ed3\u679c\u7684\u671f\u5f85\u3002\u82e5\u540e\u7eed\u63a5\u5355\u673a\u4f1a\u6216\u6536\u5165\u672a\u8fbe\u5176\u9690\u6027\u9884\u671f\uff0c\u6613\u5f15\u53d1\u6295\u8bc9\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u4f4e\u98ce\u9669**\u3002\u57fa\u4e8e\u5176\u804c\u4e1a\u80cc\u666f\uff0c2380\u5143\u8bfe\u7a0b\u8d39\u7528\u9020\u6210\u91cd\u5927\u7ecf\u6d4e\u538b\u529b\u7684\u53ef\u80fd\u6027\u8f83\u4f4e\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u4f4e\u98ce\u9669**\u3002\u4f53\u9a8c\u8425\u671f\u95f4\u5c55\u73b0\u4e86\u826f\u597d\u7684\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\uff0c\u4f46\u957f\u671f\u575a\u6301\u9700\u89c2\u5bdf\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u9700\u6838\u67e5**\u3002\u8bb0\u5f55\u672a\u4f53\u73b0\uff0c\u4f46\u5c5e\u6f5c\u5728\u98ce\u9669\u70b9\u3002\n    5.  **\u9500\u552e\u8bef\u5bfc**\uff1a**\u4f4e\u98ce\u9669**\u3002\u9500\u552e\u8fc7\u7a0b\u4ee5\u9f13\u52b1\u3001\u63d0\u4f9b\u8d44\u6e90\u4e3a\u4e3b\uff0c\u672a\u53d1\u73b0\u5938\u5927\u627f\u8bfa\u6216\u6b3a\u8bc8\u8bdd\u672f\u3002\u4f46\u201c\u770b\u597d\u4f60\u201d\u3001\u201c\u91cd\u70b9\u57f9\u517b\u201d\u7b49\u8bdd\u672f\u53ef\u80fd\u95f4\u63a5\u63a8\u9ad8\u7528\u6237\u9884\u671f\u3002\n    6.  **\u4ea7\u54c1\u670d\u52a1\u4e0d\u7b26**\uff1a**\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u5904\u4e8e\u670d\u52a1\u542f\u52a8\u671f\uff0c\u9700\u89c2\u5bdf\u6b63\u5f0f\u8bfe\u7a0b\u5185\u5bb9\u3001\u73ed\u4e3b\u4efb\u670d\u52a1\u662f\u5426\u4e0e\u9500\u552e\u9636\u6bb5\u63cf\u8ff0\u4e00\u81f4\u3002\n    7.  **\u7ade\u54c1\u6bd4\u8f83/\u51b2\u52a8\u540e\u6094**\uff1a**\u4f4e\u98ce\u9669**\u3002\u7528\u6237\u51b3\u7b56\u57fa\u4e8e\u6570\u5929\u7684\u4f53\u9a8c\u8425\u53c2\u4e0e\u548c\u7406\u6027\u8be2\u95ee\uff0c\u975e\u5373\u65f6\u51b2\u52a8\u3002\n*   **\u7efc\u5408\u9000\u8d39\u98ce\u9669\u7b49\u7ea7**\uff1a**\u4e2d**\u3002\u6838\u5fc3\u98ce\u9669\u70b9\u5728\u4e8e**\u5b66\u4e60\u6548\u679c\u4e0e\u53d8\u73b0\u9884\u671f\u7ba1\u7406**\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5408\u89c4\u60c5\u51b5**\uff1a\u57fa\u672c\u5408\u89c4\u3002\u9500\u552e\u6d41\u7a0b\u5b8c\u6574\uff08\u516c\u5f00\u8bfe-\u4f53\u9a8c\u8425-\u8f6c\u5316\uff09\uff0c\u63d0\u4f9b\u4e86\u8bd5\u542c\u3001\u7ec3\u4e60\u3001\u70b9\u8bc4\u7b49\u4ef7\u503c\u73af\u8282\u3002\u672a\u53d1\u73b0\u660e\u663e\u4ef7\u683c\u6b3a\u8bc8\u6216\u865a\u5047\u627f\u8bfa\u3002\n*   **\u98ce\u9669\u63d0\u793a**\uff1a\n    *   **\u9884\u671f\u7ba1\u7406**\uff1a\u9500\u552e\u591a\u6b21\u4f7f\u7528\u201c\u770b\u597d\u4f60\u201d\u3001\u201c\u91cd\u70b9\u57f9\u517b\u5bf9\u8c61\u201d\u3001\u201c\u5e26\u4f60\u4e00\u8d77\u5b66\u4e60\u548c\u5f55\u4e66\u201d\u7b49\u8bdd\u672f\uff0c\u867d\u5c5e\u9f13\u52b1\u6027\u8d28\uff0c\u4f46\u53ef\u80fd\u8ba9T4\u7406\u6027\u89c4\u5212\u8005\u4ea7\u751f\u4e0d\u5207\u5b9e\u9645\u7684\u8d44\u6e90\u503e\u659c\u9884\u671f\u3002\n    *   **\u5bb6\u5ead\u77e5\u60c5**\uff1a\u9500\u552e\u672a\u4e3b\u52a8\u8be2\u95ee\u6216\u63d0\u9192\u7528\u6237\u4e0e\u5bb6\u4eba\u6c9f\u901a\uff0c**\u5b58\u5728\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5\u7684\u5408\u89c4\u758f\u6f0f**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d**\uff1a**\u5339\u914d**\u3002\u7528\u6237\u804c\u4e1a\u80cc\u666f\u4e0e\u6709\u58f0\u6f14\u64ad\u4e2d\u7684\u513f\u7ae5\u8bfb\u7269\u3001\u793e\u79d1\u6587\u5b66\u7c7b\u5185\u5bb9\u6709\u7ed3\u5408\u70b9\uff0c\u5176\u63a2\u7d22\u7684\u201c\u5f55\u4e66\u3001\u753b\u672c\u3001\u5ba1\u542c\u3001\u7f8e\u5de5\u201d\u7b49\u591a\u5143\u5de5\u79cd\u4e5f\u4e0e\u8bfe\u7a0b\u63d0\u4f9b\u7684\u6280\u80fd\u57f9\u8bad\u5339\u914d\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**\u9996\u5468\u91cd\u70b9\u6c9f\u901a\u53d8\u73b0\u8def\u5f84\u4e0e\u9884\u671f**\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9884\u671f\u6821\u6b63\uff08\u5173\u952e\uff09**\uff1a\u5728\u9996\u6b21\u6df1\u5ea6\u6c9f\u901a\u4e2d\uff0c\u660e\u786e\u544a\u77e5\u884c\u4e1a\u5e73\u5747\u63a5\u5355\u5468\u671f\u3001\u6536\u76ca\u8303\u56f4\uff08\u5f3a\u8c03\u201c\u591a\u52b3\u591a\u5f97\u201d\u4e0e\u4e2a\u4f53\u5dee\u5f02\uff09\uff0c\u5f15\u5bfc\u5176\u5c06\u76ee\u6807\u4ece\u201c\u63a5\u5355\u6bd4\u4f8b\u201d\u8c03\u6574\u4e3a\u201c\u6280\u80fd\u63d0\u5347\u4e0e\u8d44\u6e90\u79ef\u7d2f\u201d\u3002\u53ef\u5206\u4eab\u5f80\u671f\u540c\u7c7b\u80cc\u666f\uff08\u6559\u80b2\u3001\u6587\u79d1\uff09\u5b66\u5458\u7684\u6210\u957f\u6848\u4f8b\uff08\u975e\u6536\u5165\u627f\u8bfa\uff09\u3002\n    2.  **\u4f18\u52bf\u5bf9\u63a5**\uff1a\u8fc5\u901f\u8bc6\u522b\u5176\u201c\u9ad8\u6821\u79d1\u7814\u201d\u3001\u201c\u63a5\u89e6\u513f\u7ae5\u9752\u5c11\u5e74\u201d\u7684\u80cc\u666f\u4f18\u52bf\uff0c\u5728\u8bfe\u7a0b\u5b66\u4e60\u3001\u4f5c\u4e1a\u5b9e\u8df5\u4e2d\uff0c\u5f15\u5bfc\u5176\u5411\u793e\u79d1\u77e5\u8bc6\u666e\u53ca\u3001\u513f\u7ae5\u5185\u5bb9\u6f14\u64ad\u7b49\u65b9\u5411\u503e\u659c\uff0c\u589e\u5f3a\u5b66\u4e60\u4ef7\u503c\u611f\u548c\u72ec\u7279\u6027\u3002\n    3.  **\u5bb6\u5ead\u77e5\u60c5\u6838\u67e5**\uff1a\u53cb\u597d\u8be2\u95ee\u8bfe\u7a0b\u5b66\u4e60\u65f6\u95f4\u5b89\u6392\uff0c\u81ea\u7136\u5e26\u51fa\u201c\u5bb6\u4eba\u662f\u5426\u652f\u6301\u60a8\u5229\u7528\u4e1a\u4f59\u65f6\u95f4\u5b66\u4e60\u65b0\u6280\u80fd\u201d\u7684\u8bdd\u9898\uff0c**\u8865\u5168\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f**\u3002\n    4.  **\u8d44\u6e90\u8854\u63a5**\uff1a\u53ca\u65f6\u5151\u73b0\u9500\u552e\u627f\u8bfa\u7684\u201c\u7248\u6743\u4e66\u201d\u7b49\u8d44\u6e90\uff0c\u5e76\u6e05\u6670\u8bf4\u660e\u4f7f\u7528\u89c4\u5219\u548c\u9650\u5236\uff0c\u5efa\u7acb\u4fe1\u4efb\u3002\n    5.  **\u6301\u7eed\u89c2\u5bdf**\uff1a\u5173\u6ce8\u5176\u8fdb\u5165\u7cfb\u7edf\u8bfe\u540e\u7684\u4efb\u52a1\u5b8c\u6210\u8d28\u91cf\u4e0e\u4e92\u52a8\u9891\u7387\u53d8\u5316\uff0cT4\u7528\u6237\u82e5\u53d1\u73b0\u5185\u5bb9\u4e0e\u9884\u671f\u4e0d\u7b26\u6216\u8fdb\u5ea6\u7f13\u6162\uff0c\u53ef\u80fd\u7406\u6027\u6c89\u9ed8\u540e\u76f4\u63a5\u7533\u8bf7\u9000\u8d39\u3002\n\n{\"core_type\": \"T4 \u7406\u6027\u89c4\u5212\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u9996\u5468\u91cd\u70b9\u6c9f\u901a\u53d8\u73b0\u8def\u5f84\u4e0e\u9884\u671f\"}";
