    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u4e0e\u98ce\u63a7\u62a5\u544a\n\n## \u4e00\u3001 \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n\n*   **\u52a8\u673a\u7eaf\u5ea6**\uff1a**\u4e2d\u7b49**\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b\uff08\u6309\u65f6\u53c2\u52a0\u73ed\u4f1a\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u79ef\u6781\u63d0\u95ee\u3001\u53c2\u4e0e\u5c0f\u7ec4\u6d3b\u52a8\uff09\uff0c\u5e76\u4e3b\u52a8\u7eed\u62a5\u540e\u671f\u8bfe\u7a0b\u3002\u4f46\u521d\u59cb\u8d2d\u4e70\u51b3\u7b56\u53d7\u9500\u552e\u201c\u9519\u8fc7\u673a\u4f1a\u201d\u3001\u201c\u540c\u5b66\u5df2\u5f00\u59cb\u8bd5\u97f3\u201d\u7b49\u5916\u90e8\u538b\u529b\u5f71\u54cd\uff0c\u5185\u5728\u5174\u8da3\u4e0e\u5916\u90e8\u9a71\u52a8\u5e76\u5b58\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7**\uff1a**\u504f\u4f4e**\u3002\n    *   **\u7ecf\u6d4e**\uff1a\u660e\u786e\u8868\u793a\u201c\u6ca1\u6709\u7ecf\u6d4e\u80fd\u529b\u4e24\u4e2a\u8bfe\u90fd\u62a5\u201d\uff0c**\u652f\u4ed8\u80fd\u529b\u6709\u9650**\u3002\n    *   **\u8bbe\u5907**\uff1a\u65e0\u4e13\u4e1a\u5f55\u97f3\u8bbe\u5907\uff08\u201c\u6211\u8fd8\u6ca1\u6709\u8bbe\u5907\u201d\uff09\uff0c\u4f7f\u7528\u624b\u673a\u5f55\u97f3\uff0c\u5f71\u54cd\u8bd5\u97f3\u8d28\u91cf\uff08\u201c\u4e0d\u7b26\u5408\u5f55\u97f3\u68da\u97f3\u8d28\u8981\u6c42\u201d\uff09\u3002\n    *   **\u65f6\u95f4/\u7cbe\u529b**\uff1a\u80fd\u8ddf\u4e0a\u8bfe\u7a0b\u8282\u594f\uff0c\u53c2\u4e0e\u5c0f\u7ec4\u534f\u4f5c\uff0c\u65f6\u95f4\u6295\u5165\u5ea6\u5c1a\u53ef\u3002\n*   **\u5fc3\u7406\u5f39\u6027**\uff1a**\u4e2d\u7b49\u504f\u9ad8**\u3002\n    *   **\u97e7\u6027**\uff1a\u9762\u5bf9AI\u7ec3\u529f\u623f\u632b\u6298\uff08\u201c\u7d2b\u201d\u8bfb\u97f3\u901a\u4e0d\u8fc7\uff09\u3001\u8bbe\u5907\u9650\u5236\u3001\u6587\u672c\u7406\u89e3\u56f0\u96be\uff08\u201c\u8bed\u6587\u7406\u89e3\u80fd\u529b\u5f88\u5dee\u201d\uff09\u65f6\uff0c\u80fd\u4e3b\u52a8\u6c42\u52a9\u5e76\u6301\u7eed\u7ec3\u4e60\uff0c\u672a\u8868\u73b0\u51fa\u660e\u663e\u632b\u8d25\u6216\u62b1\u6028\u3002\n    *   **\u5f00\u653e\u6027**\uff1a\u4e50\u4e8e\u63a5\u53d7\u53cd\u9988\uff08\u201c\u6839\u636e\u5927\u5bb6\u7684\u610f\u89c1\u4fee\u6539\u201d\uff09\uff0c\u79ef\u6781\u53c2\u4e0e\u96c6\u4f53\u521b\u4f5c\uff0c\u63d0\u51fa\u5efa\u8bbe\u6027\u610f\u89c1\u3002\n    *   **\u81ea\u6211\u8ba4\u77e5**\uff1a\u5bf9\u81ea\u8eab\u77ed\u677f\uff08\u8bbe\u5907\u3001\u6587\u672c\u5206\u6790\uff09\u6709\u6e05\u6670\u8ba4\u77e5\uff0c\u6001\u5ea6\u52a1\u5b9e\uff08\u201c\u6162\u6162\u6765\u201d\uff09\u3002\n\n## \u4e8c\u3001 ABCD\u5224\u5b9a\u6811\u5206\u6790\n\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a**\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u5df2\u4e3a\u7cbe\u82f1\u73ed\u4ed8\u8d39\uff0c\u5e76\u5728\u8bfe\u7a0b\u672b\u671f\u4e3b\u52a8\u7eed\u62a5\u4e86\u540e\u671f\u526a\u8f91\u8bad\u7ec3\u8425\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u5bb6\u5ead\u5176\u4ed6\u6210\u5458\uff0c\u7528\u6237\u8868\u73b0\u4e3a\u72ec\u7acb\u51b3\u7b56\uff08\u201c\u6211\u6ca1\u6709\u7ecf\u6d4e\u80fd\u529b\u4e24\u4e2a\u8bfe\u90fd\u62a5\uff0c\u53ea\u80fd\u9009\u5176\u4e00\u201d\uff09\uff0c\u4f46\u65e0\u6cd5\u5b8c\u5168\u6392\u9664\u5bb6\u5ead\u8d22\u52a1\u5236\u7ea6\u3002\n*   **\u6b65\u9aa41\uff1a\u52a8\u673a\u4e0e\u8d44\u6e90\u5339\u914d\u5ea6**\uff1a\u52a8\u673a\uff08\u4e2d\uff09\u4e0e\u8d44\u6e90\uff08\u4f4e\uff09\u5b58\u5728**\u4e2d\u5ea6\u4e0d\u5339\u914d**\u3002\u5b66\u4e60\u610f\u613f\u5f3a\uff0c\u4f46\u7ecf\u6d4e\u4e0e\u8bbe\u5907\u8d44\u6e90\u6784\u6210\u660e\u663e\u77ed\u677f\u3002\n*   **\u6b65\u9aa42\uff1a\u884c\u52a8\u4e0e\u627f\u8bfa\u5ea6**\uff1a**\u9ad8**\u3002\u7528\u6237\u5168\u7a0b\u8ddf\u8bfe\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u8bd5\u97f3\u3001\u79ef\u6781\u8fdb\u884c\u5c0f\u7ec4\u534f\u4f5c\uff0c\u884c\u52a8\u529b\u5f3a\uff0c\u4e14\u4e3b\u52a8\u590d\u8d2d\uff0c\u627f\u8bfa\u5ea6\u9ad8\u3002\n*   **\u6b65\u9aa43\uff1a\u98ce\u9669\u4e0e\u9002\u5e94\u6027**\uff1a**\u4e2d\u7b49**\u3002\u4e3b\u8981\u98ce\u9669\u6765\u81ea\u8d44\u6e90\u9650\u5236\uff08\u7ecf\u6d4e\u3001\u8bbe\u5907\uff09\u53ef\u80fd\u5bfc\u81f4\u7684\u540e\u7eed\u5b66\u4e60\u6548\u679c\u74f6\u9888\u6216\u53d8\u73b0\u56f0\u96be\u3002\u4f46\u7528\u6237\u5fc3\u7406\u5f39\u6027\u8f83\u597d\uff0c\u9002\u5e94\u6027\u8f83\u5f3a\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**\uff1a**B\u7c7b\uff08\u9ad8\u610f\u613f-\u4e2d\u4f4e\u8d44\u6e90\u578b\uff09**\u3002\u7528\u6237\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b\u5f3a\uff0c\u4f46\u8d44\u6e90\u5e95\u5ea7\u8584\u5f31\uff0c\u662f\u5178\u578b\u7684\u201c\u5fc3\u6709\u4f59\u800c\u529b\u53ef\u80fd\u4e0d\u8db3\u201d\u7684\u6f5c\u529b\u7528\u6237\uff0c\u9700\u91cd\u70b9\u5173\u6ce8\u5176\u8d44\u6e90\u9650\u5236\u5e26\u6765\u7684\u540e\u7eed\u98ce\u9669\u3002\n\n## \u4e09\u3001 \u7528\u6237\u539f\u578b\u5339\u914d\n\n*   **\u5339\u914d\u539f\u578b**\uff1a**T5 \u52a1\u5b9e\u8fdb\u53d6\u578b**\u3002\n    *   **\u7279\u5f81**\uff1a\u76ee\u6807\u660e\u786e\uff08\u5b66\u4e60\u6280\u80fd\uff09\uff0c\u884c\u52a8\u529b\u5f3a\uff08\u8ddf\u8bfe\u3001\u505a\u4f5c\u4e1a\u3001\u8bd5\u97f3\uff09\uff0c\u52a1\u5b9e\u7406\u6027\uff08\u6e05\u695a\u81ea\u8eab\u77ed\u677f\uff0c\u5728\u7ecf\u6d4e\u9650\u5236\u4e0b\u505a\u9009\u62e9\uff09\uff0c\u91cd\u89c6\u5b9e\u8df5\u4e0e\u53cd\u9988\uff08\u79ef\u6781\u53c2\u4e0e\u5c0f\u7ec4\u4f5c\u4e1a\uff09\u3002\n    *   **\u4e0d\u7b26\u70b9**\uff1a\u65e0\u660e\u663eT6\uff08\u60c5\u7eea\u4f9d\u8d56\uff09\u3001T7\uff08\u6295\u673a\u53d6\u5de7\uff09\u6216T8\uff08\u6210\u5c31\u7126\u8651\uff09\u7279\u5f81\u3002\u867d\u6709\u8d44\u6e90\u7126\u8651\uff0c\u4f46\u672a\u8f6c\u5316\u4e3a\u60c5\u7eea\u5ba3\u6cc4\u6216\u653e\u5f03\u884c\u4e3a\u3002\n\n## \u56db\u3001 \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\uff08\u98ce\u9669\u7b49\u7ea7\uff1a\u4e2d\uff09\n\n\u9010\u9879\u6392\u67e57\u79cd\u9000\u8d39\u6839\u56e0\uff1a\n1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u5b66\u4e60\u6709\u83b7\u5f97\u611f\uff08\u201c\u6536\u83b7\u6ee1\u6ee1\u201d\uff09\uff0c\u4f46\u53d7\u8bbe\u5907\u9650\u5236\uff0c\u8bd5\u97f3\u7ade\u4e89\u529b\u5f31\uff0c\u957f\u671f\u82e5\u65e0\u6b63\u5411\u53cd\u9988\uff0c\u6613\u4ea7\u751f\u632b\u8d25\u611f\u3002\n2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u9ad8\u98ce\u9669**\u3002**\u7528\u6237\u5df2\u660e\u786e\u8868\u8fbe\u7ecf\u6d4e\u80fd\u529b\u6709\u9650**\uff0c\u4e3a\u540e\u7eed\u66f4\u9ad8\u9636\u8bfe\u7a0b\u4ed8\u8d39\u6216\u8bbe\u5907\u6295\u8d44\u57cb\u4e0b\u9690\u60a3\uff0c\u662f\u6838\u5fc3\u98ce\u9669\u70b9\u3002\n3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u65f6\u95f4\u6295\u5165\u5ea6\u826f\u597d\uff0c\u672a\u8868\u73b0\u51fa\u65f6\u95f4\u51b2\u7a81\u3002\n4.  **\u8bfe\u7a0b\u8d28\u91cf\u5f02\u8bae**\uff1a**\u4f4e\u98ce\u9669**\u3002\u5bf9\u8bfe\u7a0b\u548c\u8001\u5e08\u8bc4\u4ef7\u6b63\u9762\uff08\u201c\u975e\u5e38\u559c\u6b22\u8001\u5e08\u4eec\u201d\uff09\u3002\n5.  **\u670d\u52a1\u4f53\u9a8c\u4e0d\u4f73**\uff1a**\u4f4e\u98ce\u9669**\u3002\u4e0e\u73ed\u73ed\u4e92\u52a8\u826f\u597d\uff0c\u6c9f\u901a\u987a\u7545\uff0c\u672a\u4ea7\u751f\u670d\u52a1\u51b2\u7a81\u3002\n6.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\uff0c\u4f46\u7ecf\u6d4e\u538b\u529b\u53ef\u80fd\u9690\u542b\u5bb6\u5ead\u56e0\u7d20\u3002\n7.  **\u7ade\u54c1\u8f6c\u79fb/\u5174\u8da3\u8f6c\u79fb**\uff1a**\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u4e13\u6ce8\u5ea6\u8f83\u9ad8\uff0c\u5df2\u7eed\u62a5\u8bfe\u7a0b\uff0c\u8f6c\u79fb\u53ef\u80fd\u6027\u4f4e\u3002\n\n## \u4e94\u3001 \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n\n*   **\u9500\u552e\u884c\u4e3a**\uff1a\u524d\u671f\u9500\u552e\uff08\u53ef\u5e0c\uff09\u4f7f\u7528\u4e86\u201c\u9519\u8fc7\u673a\u4f1a\u201d\u3001\u201c\u522b\u4eba\u5df2\u5f00\u59cb\u201d\u7b49\u5236\u9020\u7a00\u7f3a\u548c\u4ece\u4f17\u5fc3\u7406\u7684\u8bdd\u672f\uff0c**\u5b58\u5728\u8f7b\u5ea6\u65bd\u538b\u503e\u5411**\u3002\u4f46\u540e\u7eed\u73ed\u4e3b\u4efb\uff08\u76f8\u4f34\u4e0e\u58f0\uff09\u670d\u52a1\u4e13\u4e1a\uff0c\u4ee5\u652f\u6301\u3001\u5f15\u5bfc\u4e3a\u4e3b\uff0c\u672a\u53d1\u73b0\u8fc7\u5ea6\u627f\u8bfa\u3001\u865a\u5047\u5ba3\u4f20\u7b49**\u91cd\u5927\u8fdd\u89c4**\u3002\n*   **\u7528\u6237\u6743\u76ca**\uff1a\u5728\u7528\u6237\u660e\u786e\u8868\u8fbe\u7ecf\u6d4e\u9650\u5236\u540e\uff0c\u73ed\u4e3b\u4efb\u901a\u8fc7\u8bed\u97f3\u7ed9\u51fa\u4e86\u540e\u671f\u8bfe\u4e0e\u8fdb\u9636\u8bfe\u7684\u5bf9\u6bd4\u5efa\u8bae\uff0c\u7528\u6237\u57fa\u4e8e\u6b64\u81ea\u4e3b\u9009\u62e9\uff0c**\u672a\u8bf1\u5bfc\u8d85\u989d\u6d88\u8d39**\uff0c\u8fc7\u7a0b\u57fa\u672c\u5408\u89c4\u3002\n*   **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u7528\u6237\u7ecf\u6d4e\u80fd\u529b\u4e0e\u8bfe\u7a0b\u6295\u5165\uff08\u65f6\u95f4\u3001\u540e\u7eed\u53ef\u80fd\u4ea7\u751f\u7684\u8bbe\u5907\u8d39\u7528\uff09\u7684\u5339\u914d\u5ea6\u9700\u6301\u7eed\u5173\u6ce8\uff0c\u907f\u514d\u56e0\u7ecf\u6d4e\u538b\u529b\u5bfc\u81f4\u5b66\u4e60\u4e2d\u65ad\u6216\u6295\u8bc9\u3002\n\n## \u516d\u3001 \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n\n1.  **\u6838\u5fc3\u7b56\u7565**\uff1a**\u8d4b\u80fd\u4e0e\u8d44\u6e90\u94fe\u63a5**\u3002\u5b9a\u4f4d\u4e3a\u201c\u652f\u6301\u8005\u201d\u548c\u201c\u8d44\u6e90\u534f\u8c03\u8005\u201d\uff0c\u6838\u5fc3\u76ee\u6807\u662f\u5e2e\u52a9\u7528\u6237\u514b\u670d\u8d44\u6e90\u77ed\u677f\uff0c\u6700\u5927\u5316\u5176\u5b66\u4e60\u6548\u679c\u3002\n2.  **\u884c\u52a8\u6307\u5357**\uff1a\n    *   **\u5f3a\u5316\u4ef7\u503c\u786e\u8ba4**\uff1a\u6301\u7eed\u80af\u5b9a\u5176\u52aa\u529b\u548c\u8fdb\u6b65\uff08\u5982\u80af\u5b9a\u5176\u5c0f\u7ec4\u534f\u4f5c\u8d21\u732e\u3001\u5b66\u4e60\u6001\u5ea6\uff09\uff0c\u5f3a\u5316\u201c\u6295\u5165\u503c\u5f97\u201d\u7684\u8ba4\u77e5\uff0c\u5bf9\u51b2\u7ecf\u6d4e\u538b\u529b\u5e26\u6765\u7684\u8d1f\u9762\u60c5\u7eea\u3002\n    *   **\u63d0\u4f9b\u4f4e\u6210\u672c\u89e3\u51b3\u65b9\u6848**\uff1a\u4e3b\u52a8\u5206\u4eab\u624b\u673a\u5f55\u5236\u4f18\u5316\u6280\u5de7\u3001\u514d\u8d39\u97f3\u6548\u7d20\u6750\u7f51\u7ad9\uff08\u5df2\u505a\uff09\u3001\u4f4e\u6210\u672c\u8bbe\u5907\u65b9\u6848\uff0c**\u907f\u514d\u76f4\u63a5\u63a8\u8350\u9ad8\u4ef7\u8bbe\u5907**\uff0c\u51cf\u8f7b\u5176\u5fc3\u7406\u8d1f\u62c5\u3002\n    *   **\u5173\u6ce8\u5b9e\u8df5\u673a\u4f1a**\uff1a\u4e3a\u5176\u7559\u610f\u5bf9\u8bbe\u5907\u8981\u6c42\u4e0d\u9ad8\uff08\u5982\u65b9\u8a00\u3001\u65c1\u767d\uff09\u7684\u8bd5\u97f3\u6216\u5185\u90e8\u7ec3\u4e60\u9879\u76ee\uff0c\u5e2e\u52a9\u5176\u83b7\u5f97\u65e9\u671f\u6210\u5c31\u611f\u3002\n    *   **\u98ce\u9669\u9884\u8b66\u4e0e\u6c9f\u901a**\uff1a\u5728\u63a8\u8350\u4efb\u4f55\u4ed8\u8d39\u9879\u76ee\uff08\u5982\u4e0b\u4e00\u9636\u6bb5\u8bfe\u7a0b\u3001\u8bbe\u5907\uff09\u524d\uff0c**\u52a1\u5fc5\u9884\u5148\u6e29\u548c\u63a2\u8be2\u5176\u9884\u7b97\u548c\u8003\u8651**\uff0c\u7edd\u5bf9\u907f\u514d\u76f4\u63a5\u63a8\u9500\u3002\n3.  **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**\uff1a\n    *   **\u5f53\u524d**\uff1a\u5df2\u5339\u914d**\u540e\u671f\u526a\u8f91\u8bad\u7ec3\u8425**\uff0c\u7b26\u5408\u5176\u63d0\u5347\u7efc\u5408\u6280\u80fd\u7684\u9700\u6c42\uff0c\u4e14\u5bf9\u5373\u65f6\u8bbe\u5907\u8981\u6c42\u4f4e\u4e8e\u8fdb\u9636\u6f14\u64ad\u8bfe\uff0c\u9009\u62e9\u5408\u7406\u3002\n    *   **\u672a\u6765**\uff1a\u4f18\u5148\u63a8\u8350**\u8f7b\u91cf\u7ea7\u3001\u9ad8\u6027\u4ef7\u6bd4\u7684\u5b9e\u6218\u8425\u6216\u4e13\u9898\u8bad\u7ec3**\uff0c\u800c\u975e\u957f\u671f\u9ad8\u4ef7\u8bfe\u7a0b\u3002\u53ef\u5f15\u5bfc\u5173\u6ce8\u5e73\u53f0\u5185**\u79ef\u5206\u5151\u6362\u3001\u5956\u5b66\u91d1\u673a\u5236\u6216\u4f4e\u95e8\u69db\u63a5\u5355\u6e20\u9053**\uff0c\u5e2e\u52a9\u5176\u5b9e\u73b0\u201c\u4ee5\u5b66\u517b\u5b66\u201d\u3002\n\n{\"core_type\": \"T5 \u52a1\u5b9e\u8fdb\u53d6\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c
