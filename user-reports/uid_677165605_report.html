    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID:677165605\u7684\u7528\u6237\u8fdb\u884c\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677165605 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u653e\u98de\u7684\u5927\u773c\u775b(\u5f20\u57f9\u6e05)\u3001\u9065\u8fdc\u4e0d\u8fdc(\u5f20\u6587\u9759) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u7cbe\u82f1\u7248\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u73b0\u91d1\u5468\u8f6c\u56f0\u96be**\uff08\u652f\u4ed8\u5b9d\u94b1\u4e0d\u591f\uff0c\u9700\u7528\u73b0\u91d1\u5151\u6362\uff0c\u5b58\u5728\u77ed\u671f\u8d44\u91d1\u538b\u529b\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u81ea\u79f0\u81ea\u7531\u804c\u4e1a\uff0c\u4f46\u5f55\u97f3\u73af\u5883\u5dee\uff0c\u9700\u627e\u5b89\u9759\u65f6\u95f4\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\uff08\u672a\u63d0\u53ca\u5bb6\u5ead\uff0c\u9ed8\u8ba4\u5355\u8eab\u72ec\u7acb\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b07\u4f4e\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u7eaf\u4e3a\u51e0\u5929\u5185\u63d0\u73b0\u4fdd\u5e95\u800c\u6765**\u3002\u76ee\u6807\u6781\u5ea6\u5355\u4e00\u4e14\u6025\u8feb\uff0c\u5bf9\u6280\u80fd\u5b66\u4e60\u672c\u8eab\u5174\u8da3\u4f4e\uff0c\u5bf9\u53d8\u73b0\u5468\u671f\u548c\u8d44\u6e90\u53d1\u653e\u9ad8\u5ea6\u654f\u611f\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u76ee\u7684:\u8d5a\u94b1\u201d\n  > \u201c\u53ea\u60f3\u8d5a\u94b1\u201d\n  > \u201c\u6211\u60f3\u5168\u804c\u201d\n  > \u201c\u8001\u5e08\uff0c\u90a3\u4e2a\u8bd5\u97f3\u8d44\u6e90\u4ec0\u4e48\u65f6\u5019\u53d1\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u62a5\u540d\u65f6\u652f\u4ed8\u5b9d\u94b1\u4e0d\u591f\uff0c\u9700\u8981\u53bb\u5151\u6362\u73b0\u91d1\uff0c\u8868\u660e\u8d44\u91d1\u5468\u8f6c\u4e0d\u5bbd\u88d5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u81ea\u7531\u804c\u4e1a\uff0c\u65f6\u95f4\u76f8\u5bf9\u53ef\u63a7\uff0c\u80fd\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u548c\u76f4\u64ad\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u672a\u63d0\u53ca\uff0c\u6682\u4e0d\u6784\u6210\u77ed\u677f\u3002\n- **\u7269\u7406\u73af\u5883\u77ed\u677f**\uff1a**\u6781\u4f4e** \u2014 \u660e\u786e\u63d0\u5230\u201c\u5728\u4fbf\u5b9c\u51fa\u79df\u5c4b\u91cc\uff0c\u9694\u97f3\u4e0d\u592a\u597d\u201d\uff0c\u8fd9\u662f**\u8d44\u6e90\u5e95\u5ea7\u7684\u6700\u5927\u77ed\u677f**\uff0c\u5c06\u4e25\u91cd\u5f71\u54cd\u5f55\u97f3\u8d28\u91cf\u548c\u4f5c\u4e1a\u5b8c\u6210\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56**\u3002\u8868\u73b0\u51fa\u5bf9\u5931\u8d25\u7684\u5f3a\u70c8\u6050\u60e7\u548c\u9ad8\u5ea6\u4f9d\u8d56\u5916\u90e8\u80af\u5b9a\uff0c\u8f7b\u5fae\u632b\u6298\uff08\u5982\u73af\u5883\u566a\u97f3\u3001\u6280\u672f\u4e0d\u719f\uff09\u5373\u5f15\u53d1\u7126\u8651\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u6015\u5f04\u4e0d\u597d\u88ab\u6dd8\u6c70\u201d\n  > \u201c\u4f46\u662f\u53c8\u6015\u5e72\u4e0d\u597d\u201d\n  > \u201c\u6015\u7d27\u5f20\u201d\n  > \u201c\u8001\u5e08\uff0c\u8bfb\u7684\u65f6\u5019\u6709\u70b9\u7d27\u5f20\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u7ecf\u6d4e\u4e0d\u7a33\u5b9a\u4e0e\u804c\u4e1a\u5b89\u5168\u611f\u7f3a\u5931**\u3002\u4f5c\u4e3a\u521a\u6bd5\u4e1a\u7684\u5e74\u8f7b\u4eba\uff0c\u4f4f\u5728\u4fbf\u5b9c\u51fa\u79df\u5c4b\uff0c\u5bf9\u201c\u5168\u804c\u201d\u8d5a\u94b1\u6709\u5f3a\u70c8\u6e34\u671b\uff0c\u4f46\u540c\u65f6\u53c8\u56e0\u6280\u80fd\u4e0d\u8db3\u548c\u73af\u5883\u9650\u5236\u800c\u6781\u5ea6\u4e0d\u81ea\u4fe1\uff0c\u5bb3\u6015\u88ab\u6dd8\u6c70\uff0c\u672c\u8d28\u662f\u5bfb\u6c42\u4e00\u4efd\u80fd\u5e26\u6765\u7a33\u5b9a\u6536\u5165\u7684\u804c\u4e1a\u4fdd\u969c\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u9632\u62a4\u76fe\u5f0f\u7684\u5b89\u5168\u611f\u4e0e\u201c\u88ab\u770b\u89c1\u201d\u7684\u80af\u5b9a**\u3002\u9700\u8981\u6301\u7eed\u7ed9\u4e88\u201c\u4f60\u80fd\u884c\u201d\u7684\u9f13\u52b1\uff0c\u5e76\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u6267\u884c\u7684\u53d8\u73b0\u8def\u5f84\uff08\u5982\u753b\u672c\u5165\u95e8\uff09\uff0c\u7f13\u89e3\u5176\u56e0\u7ecf\u6d4e\u538b\u529b\u548c\u80fd\u529b\u7126\u8651\u5e26\u6765\u7684\u6050\u614c\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2 \u7c7b** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u8bba** (\u5411T6\u60c5\u7eea\u5de8\u5a74\u9000\u5316\u7684\u9ad8\u98ce\u9669) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\uff0c\u4f46**\u8d44\u6e90\u5e95\u5ea7\u4f4e\uff08\u73af\u5883\u5dee\uff09** \u4e0e **\u5fc3\u7406\u5f39\u6027\u6781\u4f4e** \u7684\u7ec4\u5408\uff0c\u662f\u9000\u8d39\u7684\u9ad8\u5371\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u672a\u63d0\u53ca\u5bb6\u5ead\uff0c\u98ce\u9669\u4f4e\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | **\u5f55\u97f3\u73af\u5883\u5dee\u5bfc\u81f4\u4f5c\u4e1a\u65e0\u6cd5\u5b8c\u6210\u6216\u8d28\u91cf\u4e0d\u8fbe\u6807**\uff0c\u53e0\u52a0\u5176\u81ea\u5351\u5fc3\u7406\uff0c\u6781\u6613\u4ea7\u751f\u201c\u6211\u4e0d\u884c\u201d\u7684\u632b\u8d25\u611f\u800c\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | **\u9996\u6b21\u8bd5\u97f3\u5931\u8d25\u6216\u6536\u5230\u4e25\u5389\u6279\u8bc4**\u3002\u5176\u201c\u6015\u6dd8\u6c70\u201d\u3001\u201c\u6015\u5e72\u4e0d\u597d\u201d\u7684\u5fc3\u6001\u8868\u660e\uff0c\u4efb\u4f55\u8d1f\u9762\u53cd\u9988\u90fd\u53ef\u80fd\u6210\u4e3a\u538b\u57ae\u9a86\u9a7c\u7684\u6700\u540e\u4e00\u6839\u7a3b\u8349\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u9ad8** | **\u5f00\u8bfe\u540e\u77ed\u671f\u5185\uff08\u59821-2\u5468\uff09\u672a\u83b7\u5f97\u4efb\u4f55\u53d8\u73b0\u673a\u4f1a\u6216\u6b63\u5411\u53cd\u9988**\u3002\u5176\u201c\u53ea\u60f3\u8d5a\u94b1\u201d\u7684\u52a8\u673a\u65e0\u6cd5\u88ab\u6ee1\u8db3\uff0c\u4f1a\u8fc5\u901f\u8d28\u7591\u8bfe\u7a0b\u4ef7\u503c\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c1-2\u5468**\uff0c\u9996\u6b21\u6b63\u5f0f\u4f5c\u4e1a\u63d0\u4ea4\u540e\u6536\u5230\u70b9\u8bc4\u65f6\uff0c\u6216\u9996\u6b21\u8bd5\u97f3\u5931\u8d25\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u540c\u5b66\uff0c\u770b\u5230\u4f60\u8bf4\u60f3\u5168\u804c\u53d1\u5c55\uff0c\u8fd9\u4efd\u51b3\u5fc3\u7279\u522b\u68d2\uff01\u54b1\u4eec\u4e0d\u7740\u6025\uff0c\u5148\u4ece\u2018\u753b\u672c\u2019\u8fd9\u79cd\u5bf9\u8bbe\u5907\u8981\u6c42\u4f4e\u3001\u4e0a\u624b\u5feb\u53c8\u80fd\u7acb\u523b\u6709\u6536\u5165\u7684\u5c97\u4f4d\u5f00\u59cb\u3002\u4f60\u7684\u6bcf\u4e00\u6b21\u4f5c\u4e1a\u6211\u90fd\u4f1a\u4ed4\u7ec6\u770b\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u628a\u57fa\u7840\u6253\u7262\uff0c\u63a5\u5355\u662f\u6c34\u5230\u6e20\u6210\u7684\u4e8b\u3002\u522b\u6709\u538b\u529b\uff0c\u73ed\u73ed\u966a\u4f60\u4e00\u8d77\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011**\u3002\u5fc5\u987b\u4f18\u5148\u5bf9\u63a5\u201c\u753b\u672c\u201d\u3001\u201c\u5bf9\u8f68\u201d\u7b49\u4f4e\u95e8\u69db\u3001\u5bf9\u5f55\u97f3\u73af\u5883\u8981\u6c42\u4e0d\u9ad8\u7684\u5c97\u4f4d\u8d44\u6e90\uff0c\u8ba9\u5176\u5feb\u901f\u83b7\u5f97\u6b63\u53cd\u9988\u548c\u5fae\u5c0f\u6536\u76ca\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176**\u4f4e\u5fc3\u7406\u5f39\u6027**\uff0c\u5fc5\u987b\u8865\u5145 **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\uff08\u6ee1\u914dC\u6a21\u5757\uff09\u3002\u9488\u5bf9\u5176**\u4f4e\u8d44\u6e90\u5e95\u5ea7\uff08\u73af\u5883\uff09**\uff0c\u9700\u63d0\u4f9b **\u3010\u7b80\u6613\u9694\u97f3\u6307\u5357\u3011** \u6216\u63a8\u8350\u624b\u673a\u7aef\u8f7b\u91cf\u5de5\u5177\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u7edd\u4e0d\u5bf9\u5176\u4f7f\u7528\u4efb\u4f55\u9ad8\u538b\u903c\u5355\u6216\u5236\u9020\u7126\u8651\u7684\u8bdd\u672f**\uff08\u5982\u201c\u6700\u540e\u540d\u989d\u201d\uff09\u30022. **\u7edd\u4e0d\u5728\u5176\u4f5c\u4e1a\u6216\u8bd5\u97f3\u5931\u8d25\u65f6\u7ed9\u4e88\u51b0\u51b7\u3001\u76f4\u63a5\u7684\u5426\u5b9a**\uff0c\u5fc5\u987b\u201c\u4e09\u660e\u6cbb\u6c9f\u901a\u6cd5\u201d\uff08\u80af\u5b9a+\u5efa\u8bae+\u9f13\u52b1\uff09\u30023. **\u7edd\u4e0d\u753b\u5927\u997c**\uff0c\u660e\u786e\u544a\u77e5\u53d8\u73b0\u9700\u8981\u65f6\u95f4\u79ef\u7d2f\uff0c\u4ece\u753b\u672c\u7b49\u5c0f\u5355\u5f00\u59cb\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u57fa\u7840\u6280\u80fd\u672a\u7a33\u5b9a\u3001\u672a\u83b7\u5f97\u9996\u6b21\u6210\u529f\u4f53\u9a8c\u524d\u8fdb\u884c\u4efb\u4f55\u5347\u5355\u63a8\u4ecb**\u3002\u9996\u8981\u4efb\u52a1\u662f\u5efa\u7acb\u5b89\u5168\u611f\u548c\u5fae\u5c0f\u6210\u529f\u95ed\u73af\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u76ee\u7684:\u8d5a\u94b1\u201d / \u201c\u53ea\u60f3\u8d5a\u94b1\u201d\n2. > \u201c\u6211\u4eca\u5e74\u6bd5\u4e1a\uff0c\u73b0\u5728\u5728\u4fbf\u5b9c\u51fa\u79df\u5c4b\u91cc\uff0c\u9694\u97f3\u4e0d\u592a\u597d\u201d\n3. > \u201c\u6211\u6015\u5f04\u4e0d\u597d\u88ab\u6dd8\u6c70\u201d / \u201c\u4f46\u662f\u53c8\u6015\u5e72\u4e0d\u597d\u201d / \u201c\u6015\u7d27\u5f20\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4\u641e\u94b1\u7ed3\u679c\u8bba + \u5411T6\u60c5\u7eea\u5de8\u5a74\u9000\u5316\u9ad8\u98ce\u9669\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7ecf\u6d4e\u5b89\u5168\u4e0e\u804c\u4e1a\u4fdd\u969c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7528\u6ee1\u914dC\u6a21\u5757\uff08\u60c5\u7eea\u6258\u5e95\uff09\u7ed3\u5408B\u6a21\u5757\uff08\u7cbe\u51c6\u6d3e\u53d1\u753b\u672c\u7b49\u4f4e\u95e8\u69db\u5355\uff09\u5feb\u901f\u5efa\u7acb\u5fae\u5c0f\u6210\u529f\u95ed\u73af\uff0c\u4e25\u9632\u9996\u6b21\u632b\u6298\u6253\u51fb\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u8bba\u578b (\u9ad8\u98ce\u9669\u5411T6\u9000\u5316)\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf + \u7597\u6108\u966a\u4f34\u8f85\u52a9\u5305\"}\n```";
