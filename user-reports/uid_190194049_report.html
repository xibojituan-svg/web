        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 190194049 (\u6635\u79f0\uff1a\u534e) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 14:13 \u81f3 2026-04-09 15:28 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e - \u8096\u5c0f\u4ea67(\u8096\u6167\u5a1f) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u64ad\u6709\u58f0\u4e66\u4e3b\u64ad\u6500\u767b\u8ba1\u5212\u7cbe\u82f1\u7248 (\u4ef7\u683c\uff1a3980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u4ec5\u63d0\u53ca\u201c3980\u201d\uff0c\u672a\u900f\u9732\u652f\u4ed8\u65b9\u5f0f\u3001\u8d44\u91d1\u6765\u6e90\u3001\u5206\u671f\u60c5\u51b5\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u672a\u63d0\u53ca\u5de5\u4f5c\u3001\u5bb6\u5ead\u3001\u4f5c\u606f\u3002\u4ec5\u4ece\u201c\u65e9\u8bfe\u5df2\u7ec3\u5b8c\u201d\u63a8\u6d4b\u53ef\u80fd\u6709\u89c4\u5f8b\u65f6\u95f4\uff0c\u4f46\u65f6\u957f\u672a\u77e5\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u5168\u7a0b\u672a\u63d0\u53ca\u5bb6\u4eba\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u72ec\u7acb\u51b3\u7b56\u6216\u5bb6\u4eba\u77e5\u60c5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u804a\u5929\u8bb0\u5f55\u96c6\u4e2d\u4e8e\u8bfe\u7a0b\u5185\u5bb9\u3001\u4f5c\u4e1a\u3001\u8bd5\u97f3\u4e92\u52a8\uff0c\u7f3a\u4e4f\u5173\u4e8e\u7528\u6237\u80cc\u666f\uff08\u804c\u4e1a\u3001\u6536\u5165\u3001\u5bb6\u5ead\u3001\u65f6\u95f4\u5b89\u6392\uff09\u3001\u652f\u4ed8\u80fd\u529b\u3001\u51b3\u7b56\u72ec\u7acb\u6027\u7684\u5173\u952e\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u27a1\u4e2d\n- **\u7279\u5f81\u901f\u5199**\uff1a\u80fd\u529b\u63d0\u5347\u4e0e\u517c\u804c\u53d8\u73b0\u6df7\u5408\u9a71\u52a8\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u5b66\u4e60\u5185\u5bb9\uff08\u753b\u672c\u3001\u5bf9\u8f68\u3001\u89d2\u8272\u97f3\uff09\u7684\u5174\u8da3\u548c\u6295\u5165\uff0c\u4f46\u4e5f\u660e\u786e\u5173\u6ce8\u201c\u659c\u6760\u6536\u5165\u201d\u3001\u201c\u7761\u540e\u6536\u5165\u201d\u7b49\u53d8\u73b0\u8def\u5f84\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u6211\u89c9\u5f97\u753b\u672c\u4e5f\u633a\u597d\u7684\uff0c\u753b\u5b8c\u4e00\u96c6\u5c31\u5dee\u4e0d\u591a\u770b\u5b8c\u4e00\u96c6[\u5077\u7b11]\u201d (\u5174\u8da3\u9a71\u52a8)\n> \u201c\u90a3\u6211\u4ec0\u4e48\u65f6\u5019\u53ef\u4ee5\u8bd5\u4e00\u4e0b\u5462\u201d (\u5bf9\u753b\u672c\u517c\u804c\u7684\u5b9e\u64cd\u5174\u8da3)\n> \u9500\u552e\u591a\u6b21\u5f15\u5bfc\u201c\u5feb\u901f\u6536\u5165\u3001\u957f\u671f\u6536\u5165\u3001\u659c\u6760\u6536\u5165\u201d\u3001\u201c\u65f6\u85aa\u4e66\u201d\u3001\u201c\u5206\u6210\u6536\u5165\u201d\uff0c\u7528\u6237\u672a\u8868\u73b0\u51fa\u5bf9\u201c\u4fdd\u5e95\u627f\u8bfa\u201d\u7684\u6267\u7740\u8ffd\u95ee\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e (\u56e0\u4fe1\u606f\u7f3a\u5931\uff0c\u6309\u6700\u77ed\u677f\u539f\u5219\u4fdd\u5b88\u8bc4\u4f30)\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u65e0\u6cd5\u8bc4\u7ea7** \u2014 **\u5173\u952e\u4fe1\u606f\u7f3a\u5931**\u3002\u672a\u63d0\u53ca\u6536\u5165\u3001\u50a8\u84c4\u3001\u652f\u4ed8\u538b\u529b\u3002\u4ec5\u5b8c\u62103980\u5143\u652f\u4ed8\uff0c\u4f46\u652f\u4ed8\u65b9\u5f0f\uff08\u5168\u6b3e/\u5206\u671f/\u501f\u8d37\uff09\u672a\u77e5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u65e0\u6cd5\u8bc4\u7ea7** \u2014 **\u5173\u952e\u4fe1\u606f\u7f3a\u5931**\u3002\u7528\u6237\u80fd\u5b8c\u6210\u65e9\u8bfe\u3001\u770b\u56de\u653e\u3001\u53c2\u4e0e\u665a\u95f4\u76f4\u64ad\u8bd5\u97f3\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u7a7a\u95f2\u3002\u4f46\u5177\u4f53\u5de5\u4f5c\u6027\u8d28\u3001\u5bb6\u5ead\u8d1f\u62c5\u3001\u6bcf\u65e5\u56fa\u5b9a\u5b66\u4e60\u65f6\u957f\u672a\u77e5\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u65e0\u6cd5\u8bc4\u7ea7** \u2014 **\u5173\u952e\u4fe1\u606f\u7f3a\u5931**\u3002\u5168\u7a0b\u672a\u63d0\u53ca\u5bb6\u4eba\uff0c\u51b3\u7b56\u72ec\u7acb\u6027\u5b58\u7591\u3002\n- **\u5e95\u5ea7\u53d6\u77ed\u677f**\uff1a**\u2b07\u4f4e**\u3002\u7531\u4e8e**\u8d44\u91d1\u3001\u65f6\u95f4\u3001\u5bb6\u5ead\u652f\u6301**\u4e09\u4e2a\u7ef4\u5ea6\u5747\u65e0\u6709\u6548\u4fe1\u606f\uff0c\u4f9d\u636e\u201c\u4fe1\u606f\u7f3a\u5931\u964d\u7ea7\u7f6e\u4fe1\u5ea6\u201d\u53ca\u201cD\u7c7b\u5b81\u53ef\u8bef\u6740\u201d\u539f\u5219\uff0c**\u6309\u6700\u574f\u60c5\u51b5\uff08\u4f4e\uff09\u8fdb\u884c\u4fdd\u5b88\u8bc4\u4f30**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9762\u5bf9\u65b0\u4e8b\u7269\uff08\u89d2\u8272\u97f3\u627e\u4e0d\u5230\u611f\u89c9\u3001\u4e0a\u9ea6\u7d27\u5f20\uff09\u80fd\u4e3b\u52a8\u5c1d\u8bd5\u3001\u590d\u76d8\uff0c\u5e76\u4fdd\u6301\u79ef\u6781\u5b66\u4e60\u5fc3\u6001\uff0c\u65e0\u62b1\u6028\u6216\u5f52\u548e\u5916\u90e8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u521a\u4e00\u5f00\u59cb\u89c9\u5f97\u8001\u7d27\u5f20\u4e86...\u6211\u8fd8\u7279\u610f\u4e3a\u4e86\u90a3\u4e2a\u89d2\u8272\uff0c\u6211\u7279\u610f\u62ff\u4e86\u6839\u7259\u7b7e\u53fc\u5728\u5634\u91cc...\u4e0d\u8fc7\u540e\u6765\u5ff5\u7b2c\u4e8c\u4e2a\u65f6\u5019\u89c9\u5f97\u5c31\u4e0d\u90a3\u4e48\u7d27\u5f20\u4e86...\u5c31\u662f\u8fd8\u662f\u89d2\u8272\u4e3b\u8981\u7684\u4ed6\u90a3\u4e2a\u90a3\u4e2a\u6c14\u52bf\u5440\uff0c\u90a3\u4e2a\u8981\u8868\u8fbe\u7684\u90a3\u4e2a\u6c14\u52bf\u4e0d\u592a\u597d\uff0c\u5c31\u662f\u8868\u73b0\u7684\u4e0d\u5b8c\u7f8e\u3002\u201d (\u80fd\u6e05\u6670\u590d\u76d8\u95ee\u9898\uff0c\u81ea\u6211\u5f52\u56e0)\n> \u201c\u6211\u7b2c\u4e00\u6b21\u63a5\u89e6\u5230\u8fd9\u4e2a\uff0c\u4e00\u5f00\u59cb\u53cd\u6b63\u5c31\u662f\u6709\u70b9\u7d27\u5f20\uff0c\u4f46\u662f\u540e\u6765\u5f55\u7740\u5f55\u7740\u89c9\u5f97\u8fd8\u633a\u597d\u73a9\u7684\uff0c\u4e3b\u8981\u5c31\u662f\u8fd8\u8981\u597d\u597d\u7684\u53bb\u5b66\u4e60\u5404\u4e2a\u89d2\u8272\u7684\u6f14\u7ece\u3002\u201d (\u5c06\u632b\u6298\u8f6c\u5316\u4e3a\u5b66\u4e60\u52a8\u529b\u548c\u5174\u8da3)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e** (\u517c\u6709\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34)\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bfb\u6c42\u5728\u67d0\u4e2a\u9886\u57df\uff08\u6709\u58f0\u6f14\u64ad\uff09\u83b7\u5f97\u8ba4\u53ef\u3001\u5efa\u7acb\u81ea\u4fe1\u548c\u8eab\u4efd\u8ba4\u540c\u3002\u7528\u6237\u79ef\u6781\u53c2\u4e0e\u3001\u6e34\u671b\u88ab\u70b9\u8bc4\uff08\u201c\u8001\u5e08\u89d2\u8272\u97f3\u627e\u4e0d\u5230\u611f\u89c9\u5440\u201d\uff09\u3001\u5e76\u4e50\u4e8e\u5728\u793e\u7fa4\u4e2d\u81ea\u6211\u4ecb\u7ecd\uff08\u201c\u5927\u5bb6\u597d\uff0c\u6211\u662f\u534e...\u201d\uff09\uff0c\u663e\u793a\u51fa\u5bf9\u6210\u5c31\u611f\u548c\u793e\u7fa4\u5f52\u5c5e\u7684\u6e34\u671b\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u5938\u5956\u80af\u5b9a\u4e0e\u9636\u6bb5\u6027\u6210\u5c31\u611f\u53cd\u9988**\u3002\u7528\u6237\u5bf9\u9500\u552e\u201c\u4f60\u7684\u58f0\u97f3\u6761\u4ef6\u5f88\u4e0d\u9519\u201d\u3001\u201c\u8fdb\u6b65\u8d85\u660e\u663e\u201d\u7b49\u6b63\u9762\u53cd\u9988\u6709\u826f\u597d\u56de\u5e94\uff0c\u5e76\u4e3b\u52a8\u5206\u4eab\u5b66\u4e60\u611f\u53d7\uff0c\u8bf4\u660e\u5176\u5b66\u4e60\u52a8\u529b\u90e8\u5206\u6765\u6e90\u4e8e\u5916\u754c\u7684\u8ba4\u53ef\u548c\u5185\u5728\u7684\u201c\u6211\u80fd\u884c\u201d\u7684\u8bc1\u660e\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b\uff08\u51b2\u52a8\u98ce\u9669\u578b\uff09** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T5 \u597d\u73a9\u5c1d\u9c9c\u578b** (\u5174\u8da3\u9a71\u52a8\u660e\u663e\uff0c\u7ecf\u6d4e\u538b\u529b\u672a\u77e5\uff0c\u5b66\u4e60\u6001\u5ea6\u79ef\u6781\u4f46\u8d44\u6e90\u5e95\u5ea7\u4fe1\u606f\u7f3a\u5931) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u57fa\u4e8e\u73b0\u6709\u4fe1\u606f)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5ead\u53cd\u5bf9\u7b49\u660e\u786e\u7194\u65ad\u4fe1\u53f7\u3002**\u4f46\u5173\u952e\u4fe1\u606f\uff08\u652f\u4ed8\u6765\u6e90\u3001\u5bb6\u5ead\u77e5\u60c5\u6743\uff09\u7f3a\u5931\uff0c\u9700\u5728\u540e\u7eed\u670d\u52a1\u4e2d\u7d27\u6025\u8865\u5168\u6838\u67e5\u3002**\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u9ad8** | **\u5173\u952e\u4fe1\u606f\u7f3a\u5931\u3002** \u82e5\u652f\u4ed8\u4e3a\u9690\u7792\u5bb6\u4eba\u6216\u52a8\u7528\u5bb6\u5ead\u91cd\u8981\u8d44\u91d1\uff0c\u98ce\u9669\u6781\u9ad8\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u82e5\u5b9e\u9645\u5de5\u4f5c\u65f6\u95f4\u4e0e\u5b66\u4e60\u76f4\u64ad\u51b2\u7a81\uff08\u5982\u591c\u73ed\uff09\uff0c\u6216\u5bb6\u5ead\u8d1f\u62c5\u91cd\uff0c\u53ef\u80fd\u5bfc\u81f4\u4f5c\u4e1a\u79ef\u538b\u3001\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u81ea\u6211\u8c03\u8282\uff0c\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6cd5\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u52a8\u673a\u7eaf\u5ea6\u4e2d\u7b49\uff0c\u5305\u542b\u53d8\u73b0\u671f\u671b\u3002\u82e5\u5b66\u4e60\u4e00\u6bb5\u65f6\u95f4\u540e\uff08\u59821-2\u4e2a\u6708\uff09\u672a\u83b7\u5f97\u4efb\u4f55\u517c\u804c\u673a\u4f1a\u6216\u6536\u5165\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\u3002\u5f53\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u6b63\u5f0f\u8bfe\u7a0b\u4f5c\u4e1a\u538b\u529b\u589e\u5927\uff0c\u82e5\u540c\u65f6\u53d1\u73b0\u53d8\u73b0\u8def\u5f84\u4e0d\u5982\u9884\u671f\u6e05\u6670\uff0c\u4e14**\u5bb6\u5ead\u6216\u65f6\u95f4\u77db\u76fe\u7206\u53d1**\uff0c\u98ce\u9669\u6700\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u534e\u59d0\uff0c\u770b\u5230\u4f60\u5728\u4f53\u9a8c\u8425\u7279\u522b\u6295\u5165\uff0c\u4e0a\u9ea6\u8bd5\u97f3\u90a3\u80a1\u8ba4\u771f\u52b2\u513f\u592a\u68d2\u4e86\uff01\u54b1\u4eec\u6b63\u5f0f\u8bfe\u8282\u594f\u4f1a\u66f4\u6709\u4f53\u7cfb\uff0c\u4e5f\u4f1a\u63a5\u89e6\u5230\u66f4\u591a\u6837\u7684\u89d2\u8272\u548c\u53d8\u73b0\u73a9\u6cd5\u3002\u4e3a\u4e86\u5e2e\u4f60\u89c4\u5212\u597d\u5b66\u4e60\u65f6\u95f4\uff0c\u65b9\u4fbf\u4e86\u89e3\u4e00\u4e0b\u4f60\u5e73\u65f6\u5927\u6982\u4ec0\u4e48\u65f6\u95f4\u6bb5\u6bd4\u8f83\u65b9\u4fbf\u8ddf\u76f4\u64ad\u548c\u7ec3\u4e60\u5417\uff1f\u53e6\u5916\uff0c\u5b66\u4e60\u662f\u4ef6\u503c\u5f97\u5168\u5bb6\u652f\u6301\u7684\u4e8b\uff0c\u62a5\u540d\u7684\u4e8b\u513f\u8ddf\u5bb6\u91cc\u4eba\u90fd\u5206\u4eab\u559c\u60a6\u4e86\u5427\uff1f\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5174\u8da3\u6e38\u4e50\u7ebf**\u3011\u3002\u4f18\u5148\u5de9\u56fa\u5176\u201c\u597d\u73a9\u201d\u7684\u5174\u8da3\uff0c\u901a\u8fc7\u591a\u6837\u5316\u7684\u89d2\u8272\u4f53\u9a8c\u3001PIA\u620f\u6d3b\u52a8\u7ef4\u6301\u5b66\u4e60\u70ed\u60c5\uff0c\u5ef6\u8fdf\u53d8\u73b0\u538b\u529b\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176**\u5c0a\u91cd\u9700\u6c42**\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a\u3010**\u9636\u6bb5\u6027\u6210\u5c31\u8ba4\u53ef\u5305**\u3011\u3002\u5982\u8bbe\u7acb\u201c\u6bcf\u5468\u8fdb\u6b65\u4e4b\u661f\u201d\u3001\u4f5c\u4e1a\u7cbe\u9009\u5c55\u793a\u3001\u9080\u8bf7\u5728\u793e\u7fa4\u505a\u5c0f\u578b\u5206\u4eab\uff0c\u6ee1\u8db3\u5176\u88ab\u770b\u89c1\u3001\u88ab\u8ba4\u53ef\u7684\u5fc3\u7406\u9700\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5728\u524d\u671f\uff08\u81f3\u5c11\u7b2c\u4e00\u4e2a\u6708\uff09\u8fc7\u5ea6\u5f3a\u8c03\u201c\u6708\u5165\u8fc7\u4e07\u201d\u3001\u201c\u5feb\u901f\u53d8\u73b0\u201d\uff0c\u907f\u514d\u62d4\u9ad8\u5176\u6536\u76ca\u9884\u671f\u3002\u7981\u6b62\u4f7f\u7528\u201c\u624b\u5fc3\u5411\u4e0a\u201d\u7b49\u6311\u62e8\u5bb6\u5ead\u7684PUA\u8bdd\u672f\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u8d44\u6e90\u5e95\u5ea7\uff08\u5c24\u5176\u662f\u5bb6\u5ead\u652f\u6301\u5ea6\uff09\u672a\u660e\u786e\u524d\u8fdb\u884c\u4efb\u4f55\u5347\u5355**\u3002\u5f53\u524d\u4ec5\u53ef\u7ef4\u62a4\u73b0\u6709\u8bfe\u7a0b\u670d\u52a1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u7b2c\u4e00\u6b21\u63a5\u89e6\u5230\u8fd9\u4e2a\uff0c\u4e00\u5f00\u59cb\u53cd\u6b63\u5c31\u662f\u6709\u70b9\u7d27\u5f20\uff0c\u4f46\u662f\u540e\u6765\u5f55\u7740\u5f55\u7740\u89c9\u5f97\u8fd8\u633a\u597d\u73a9\u7684\uff0c\u4e3b\u8981\u5c31\u662f\u8fd8\u8981\u597d\u597d\u7684\u53bb\u5b66\u4e60\u5404\u4e2a\u89d2\u8272\u7684\u6f14\u7ece\u3002\u201d **(\u5174\u8da3\u9a71\u52a8 + \u9ad8\u5fc3\u7406\u5f39\u6027)**\n2. > \u201c\u6211\u89c9\u5f97\u753b\u672c\u4e5f\u633a\u597d\u7684\uff0c\u753b\u5b8c\u4e00\u96c6\u5c31\u5dee\u4e0d\u591a\u770b\u5b8c\u4e00\u96c6[\u5077\u7b11]\u201d **(\u5bf9\u5b66\u4e60\u5185\u5bb9\u672c\u8eab\u6709\u5174\u8da3)**\n3. > \u201c\u8001\u5e08\u89d2\u8272\u97f3\u627e\u4e0d\u5230\u611f\u89c9\u5440\u201d **(\u4e3b\u52a8\u66b4\u9732\u56f0\u96be\uff0c\u5bfb\u6c42\u6307\u5bfc\uff0c\u975e\u62b1\u6028)** \n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T5 \u597d\u73a9\u5c1d\u9c9c\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u4e0e\u793e\u7fa4\u5f52\u5c5e\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u9ad8\u98ce\u9669\u3011**\uff0c**\u5173\u952e\u98ce\u9669\u70b9\u5728\u4e8e\u652f\u4ed8\u6765\u6e90\u4e0e\u5bb6\u5ead\u77e5\u60c5\u6743\u5b8c\u5168\u672a\u77e5**\u3002\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5f00\u8425\u9996\u5468\u5185\uff0c\u5fc5\u987b\u7531\u73ed\u4e3b\u4efb\u4ee5\u5173\u6000\u65b9\u5f0f\u8865\u5168\u5bb6\u5ead\u652f\u6301\u4e0e\u652f\u4ed8\u80fd\u529b\u4fe1\u606f\uff0c\u5e76\u5f15\u5bfc\u81f3\u201c\u5174\u8da3\u6210\u5c31\u201d\u8f68\u9053\uff0c\u4e25\u9632\u8fc7\u65e9\u65bd\u52a0\u53d8\u73b0\u538b\u529b\u3011**\u3002\n\n```json\n{\"core_type\": \"T5 \u597d\u73a9\u5c1d\u9c9c\u578b\", \"maslow_need\": \"\u7b2c\u56db\u5c42\u5c0a\u91cd\u9700\u6c42\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf + \u9636\u6bb5\u6027\u6210\u5c31\u8ba4\u53ef\u5305\"}\n```";
