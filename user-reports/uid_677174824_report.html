    <script>
        const markdownText = "\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e\u3002\u7f3a\u4e4f\u652f\u4ed8\u7ec6\u8282\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u3001\u5177\u4f53\u804c\u4e1a\u4e0e\u6536\u5165\u3001\u6df1\u5c42\u5b66\u4e60\u52a8\u673a\u7b49\u4fe1\u606f\u3002\n\n# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49)**\n    *   **\u8868\u5c42\u52a8\u673a**\uff1a\u5bf9AI\u201c\u6709\u70b9\u5174\u8da3\u201d\uff0c\u5e0c\u671b\u4f5c\u4e3a\u517c\u804c\u526f\u4e1a\uff0c\u589e\u52a0\u6536\u5165/\u53d1\u5c55\u53ef\u80fd\u3002\u63d0\u53ca\u201c\u4e4b\u540e\u4e5f\u60f3\u548c\u670b\u53cb\u4e5f\u641e\u4e00\u4efd\u81ea\u5df1\u7684\u77ed\u7bc7\u201d\uff0c\u6709\u521b\u4f5c/\u53d8\u73b0\u840c\u82bd\u3002\n    *   **\u6df1\u5c42\u52a8\u673a**\uff1a\u672a\u660e\u786e\u8868\u8fbe\u3002\u53ef\u80fd\u4e3a\u804c\u4e1a\u7126\u8651\uff08\u5bfb\u6c42\u65b0\u6280\u80fd\uff09\u3001\u5174\u8da3\u63a2\u7d22\u6216\u793e\u4ea4\u9700\u6c42\u3002\u52a8\u673a\u504f\u5411\u5b9e\u7528\u4e3b\u4e49\uff0c\u4f46\u6df1\u5ea6\u548c\u575a\u5b9a\u6027\u5f85\u89c2\u5bdf\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d\u7b49\u504f\u4f4e)**\n    *   **\u65f6\u95f4\u8d44\u6e90**\uff1a\u5728\u804c\uff0c\u65f6\u95f4\u4e0d\u56fa\u5b9a\uff0c\u6709\u591c\u73ed\u3002\u80fd\u4fdd\u8bc1\u665a\u4e0a8-9:30\u7684\u76f4\u64ad\u5b66\u4e60\uff0c\u4f46\u660e\u786e\u8981\u6c42\u5f55\u64ad\u4ee5\u5907\u8865\u8bfe\u3002**\u65f6\u95f4\u788e\u7247\u5316\uff0c\u5b58\u5728\u51b2\u7a81\u98ce\u9669**\u3002\n    *   **\u8d22\u52a1\u8d44\u6e90**\uff1a\u652f\u4ed83980\u5143\u8bfe\u7a0b\u8d39\u65e0\u72b9\u8c6b\u6216\u8bae\u4ef7\u8bb0\u5f55\uff0c\u663e\u793a\u5177\u5907\u4e00\u5b9a\u652f\u4ed8\u80fd\u529b\u3002\u4f46\u5177\u4f53\u804c\u4e1a\u4e0e\u6536\u5165\u672a\u77e5\uff0c\u6297\u98ce\u9669\u80fd\u529b\u4e0d\u660e\u3002\n    *   **\u8ba4\u77e5\u8d44\u6e90**\uff1aAI\u65b0\u624b\uff08\u201c\u521a\u63a5\u89e6\u201d\uff09\uff0c\u4f46\u80fd\u5b8c\u6210\u4f5c\u4e1a\u5e76\u5f97\u5230\u6b63\u9762\u53cd\u9988\uff0c\u5b66\u4e60\u57fa\u7840\u80fd\u529b\u5c1a\u53ef\u3002\u5bf9\u5b66\u4e60\u8def\u5f84\u6709\u521d\u6b65\u89c4\u5212\uff08\u201c\u4ece\u7b80\u5355\u5f00\u59cb\u505a\u4e0e\u7ec3\u201d\uff09\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u7b49\u504f\u9ad8)**\n    *   **\u914d\u5408\u5ea6**\uff1a\u9ad8\u3002\u53ca\u65f6\u56de\u590d\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u9075\u5b88\u6307\u4ee4\u3001\u793c\u8c8c\u7528\u8bed\uff08\u201c\u60a8\u8f9b\u82e6\u4e86\u201d\uff09\u3002\n    *   **\u4e3b\u52a8\u6027**\uff1a\u4e2d\u7b49\u3002\u4e3b\u52a8\u8be2\u95ee\u76f4\u64ad\u65f6\u957f\u3001\u4f5c\u4e1a\u63d0\u4ea4\u65b9\u5f0f\u3001APP\u3001\u5f55\u64ad\u7b49\uff0c\u8868\u73b0\u51fa\u5bf9\u5b66\u4e60\u5b89\u6392\u7684\u5173\u6ce8\u548c\u89c4\u5212\u3002\n    *   **\u6297\u538b\u6027**\uff1a\u672a\u7ecf\u5386\u660e\u663e\u632b\u6298\uff0c\u8868\u73b0\u5e73\u7a33\u3002\u6c9f\u901a\u6001\u5ea6\u79ef\u6781\u3001\u53cb\u597d\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u7528\u6237\u5df2\u652f\u4ed83980\u5143\uff0c\u5b8c\u6210\u8f6c\u5316\u3002**\u652f\u4ed8\u73af\u8282\u65e0\u963b\u529b\u4fe1\u53f7**\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u8bb0\u5f55\u4e2d\u672a\u63d0\u53ca\u914d\u5076\u3001\u7236\u6bcd\u7b49\u51b3\u7b56\u76f8\u5173\u65b9\u3002\u7528\u6237\u81ea\u79f0\u201c\u5728\u804c\u201d\uff0c\u51b3\u7b56\u8868\u73b0\u4e3a\u4e2a\u4eba\u884c\u4e3a\u3002**\u6682\u5224\u5b9a\u4e3a\u72ec\u7acb\u51b3\u7b56\u8005**\u3002\n*   **\u6b65\u9aa41-4\u5224\u5b9a**\uff1a\n    *   **A\uff08\u652f\u4ed8\u80fd\u529b\uff09**\uff1a\u5df2\u652f\u4ed8\uff0c\u901a\u8fc7\u3002\n    *   **B\uff08\u5b66\u4e60\u610f\u613f\uff09**\uff1a\u6709\u660e\u786e\u5174\u8da3\u548c\u5b66\u4e60\u884c\u52a8\uff08\u542c\u8bfe\u3001\u505a\u4f5c\u4e1a\uff09\uff0c\u901a\u8fc7\u3002\n    *   **C\uff08\u65f6\u95f4\u5339\u914d\uff09**\uff1a**\u5b58\u5728\u6f5c\u5728\u98ce\u9669**\u3002\u7528\u6237\u5728\u804c\u4e14\u65f6\u95f4\u4e0d\u56fa\u5b9a\uff0c\u867d\u80fd\u8ddf\u4e0a\u5f53\u524d\u8282\u594f\uff0c\u4f46\u957f\u671f\u7cfb\u7edf\u5b66\u4e60\u5bf9\u65f6\u95f4\u4fdd\u969c\u8981\u6c42\u9ad8\uff0c\u5176\u201c\u5e0c\u671b\u6709\u5f55\u64ad\u201d\u7684\u9700\u6c42\u662f\u5173\u952e\u9884\u8b66\u4fe1\u53f7\u3002\n    *   **D\uff08\u6548\u679c\u9884\u671f\u7ba1\u7406\uff09**\uff1a\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa\u201c\u7b2c\u4e8c\u5468\u63a5\u5355\u201d\u3001\u201c\u5546\u535580-300/\u5206\u949f\u201d\u3001\u201c\u591a\u52b3\u591a\u5f97\u201d\u7b49\uff0c**\u5b58\u5728\u663e\u8457\u62d4\u9ad8\u9884\u671f\u98ce\u9669**\u3002\u7528\u6237\u8868\u8fbe\u201c\u8fb9\u505a\u5b66\u201d\u3001\u201c\u4ece\u7b80\u5355\u5f00\u59cb\u201d\uff0c\u9884\u671f\u76f8\u5bf9\u52a1\u5b9e\uff0c\u4f46\u4e0e\u9500\u552e\u627f\u8bfa\u5b58\u5728\u5dee\u8ddd\u3002\n    *   **\u5224\u5b9a\u7ed3\u679c**\uff1a**B+\u578b\uff08\u610f\u613f\u660e\u786e\u4f46\u65f6\u95f4\u5b58\u7591\uff09**\u3002\u6838\u5fc3\u98ce\u9669\u70b9\u5728C\u8f74\uff08\u65f6\u95f4\u53ef\u6301\u7eed\u6027\uff09\u4e0eD\u8f74\uff08\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa\u53ef\u80fd\u5f15\u53d1\u7684\u6548\u679c\u843d\u5dee\uff09\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**\uff1a**T4 \u52a1\u5b9e\u63a2\u7d22\u8005**\n    *   \u7279\u5f81\uff1a\u5728\u804c\u72b6\u6001\uff0c\u5bfb\u6c42\u6280\u80fd\u63d0\u5347\u4e0e\u526f\u4e1a\u53ef\u80fd\u3002\u52a8\u673a\u52a1\u5b9e\uff08\u517c\u804c\u53d8\u73b0\uff09\uff0c\u884c\u52a8\u914d\u5408\uff0c\u5bf9\u5b66\u4e60\u5b89\u6392\u6709\u5408\u7406\u5173\u5207\uff08\u65f6\u95f4\u3001\u5f55\u64ad\uff09\u3002\u60c5\u7eea\u7a33\u5b9a\uff0c\u6c9f\u901a\u793c\u8c8c\u3002\n    *   \u4e0d\u7b26\u70b9\uff1a\u672a\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u804c\u4e1a\u7126\u8651\u6216\u8f6c\u578b\u6025\u8feb\u611f\uff08\u975eT3\uff09\uff0c\u4e5f\u975e\u7eaf\u7cb9\u5174\u8da3\u9a71\u52a8\uff08\u975eT5\uff09\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u98ce\u9669\u7b49\u7ea7**\uff1a**\u4e2d**\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u627f\u8bfa\u201c\u5feb\u901f\u53d8\u73b0\u201d\u3001\u201c\u7b2c\u4e8c\u5468\u63a5\u5355\u201d\uff0c\u4e0eAI\u6280\u80fd\u5b66\u4e60\u66f2\u7ebf\u4e0d\u7b26\uff0c\u6613\u5f15\u53d1\u843d\u5dee\u3002\n    2.  **\u65f6\u95f4\u65e0\u6cd5\u4fdd\u969c**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5728\u804c\u4e14\u65f6\u95f4\u4e0d\u56fa\u5b9a\uff0c\u662f\u6f5c\u5728\u9000\u8d39\u70b9\u3002\n    3.  **\u5185\u5bb9\u8d28\u91cf\u4e0d\u6ee1**\uff1a\u4f4e\u98ce\u9669\u3002\u76ee\u524d\u53cd\u9988\u6b63\u9762\uff08\u201c\u8001\u5e08\u8bb2\u7684\u5f88\u597d\u201d\uff09\u3002\n    4.  **\u670d\u52a1\u4f53\u9a8c\u4e0d\u4f73**\uff1a\u4f4e\u98ce\u9669\u3002\u76ee\u524d\u4e92\u52a8\u826f\u597d\u3002\n    5.  **\u7ecf\u6d4e\u72b6\u51b5\u53d8\u5316**\uff1a\u4fe1\u606f\u4e0d\u8db3\u3002\u65e0\u6cd5\u8bc4\u4f30\u3002\n    6.  **\u7ade\u54c1\u5bf9\u6bd4/\u51b2\u52a8\u6d88\u8d39\u540e\u6094**\uff1a\u4fe1\u606f\u4e0d\u8db3\u3002\u65e0\u6cd5\u8bc4\u4f30\u3002\n    7.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a\u4fe1\u606f\u4e0d\u8db3\u3002\u6682\u672a\u4f53\u73b0\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u4e3b\u8981\u8fdd\u89c4\u70b9**\uff1a\n    *   **\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u5938\u5927\u5ba3\u4f20**\uff1a\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u7b2c\u4e8c\u5468\u5f00\u901a\u63a5\u5355\u201d\u3001\u201c\u5546\u535580-300/\u5206\u949f\u201d\u3001\u201c\u8f7b\u677e\u5e94\u5bf9\u201d\u3001\u201c\u5de8\u5927\u8d22\u5bcc\u673a\u4f1a\u201d\uff0c**\u4e25\u91cd\u8fdd\u53cd\u5408\u89c4\u8981\u6c42\uff0c\u662f\u6700\u5927\u98ce\u9669\u6e90**\u3002\n    *   **\u5de5\u4f5c\u5ba4\u8d44\u6e90\u8bf1\u5bfc**\uff1a\u4ee5\u201c\u52a0\u5165\u5de5\u4f5c\u5ba4\u201d\u3001\u201c\u5185\u90e8\u8d44\u6e90\u201d\u4e3a\u5356\u70b9\uff0c\u53ef\u80fd\u6d89\u53ca\u6a21\u7cca\u516c\u53f8\u4e3b\u4f53\u4e0e\u989d\u5916\u627f\u8bfa\u98ce\u9669\u3002\n*   **\u5408\u89c4\u70b9**\uff1a\u7528\u6237\u4e3b\u52a8\u8be2\u95ee\u5e76\u652f\u4ed8\uff0c\u65e0\u5f3a\u4e70\u5f3a\u5356\u8ff9\u8c61\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6838\u5fc3\u7b56\u7565**\uff1a**\u9884\u671f\u7ba1\u7406 + \u65f6\u95f4\u652f\u6301**\u3002\u91cd\u70b9\u9632\u8303\u56e0\u201c\u6548\u679c\u4e0d\u53ca\u9500\u552e\u627f\u8bfa\u201d\u548c\u201c\u65f6\u95f4\u51b2\u7a81\u201d\u5bfc\u81f4\u7684\u6d41\u5931\u3002\n*   **\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u7d27\u6025\u9884\u671f\u7ba1\u7406**\uff1a\u73ed\u4e3b\u4efb\u9996\u901a\u7535\u8bdd\u9700**\u660e\u786e\u5b66\u4e60\u66f2\u7ebf**\uff0c\u5f3a\u8c03\u6280\u80fd\u79ef\u7d2f\u5468\u671f\uff0c\u5c06\u201c\u63a5\u5355\u201d\u5b9a\u4f4d\u4e3a\u5b66\u4e60\u540e\u671f\u7684\u5b9e\u8df5\u76ee\u6807\uff0c\u800c\u975e\u77ed\u671f\u4fdd\u8bc1\u3002\u63d0\u4f9b\u5206\u9636\u6bb5\u3001\u53ef\u8fbe\u6210\u7684\u5b66\u4e60\u91cc\u7a0b\u7891\u3002\n    2.  **\u5f3a\u5316\u65f6\u95f4\u652f\u6301**\uff1a\u7acb\u5373\u786e\u8ba4\u5e76\u63d0\u4f9b\u6240\u6709\u8bfe\u7a0b\u7684**\u5f55\u64ad\u56de\u653e**\u8def\u5f84\u3002\u534f\u52a9\u7528\u6237\u5236\u5b9a\u7b26\u5408\u5176\u4f5c\u606f\u7684\u5b66\u4e60\u8ba1\u5212\uff0c\u5f3a\u8c03\u788e\u7247\u5316\u5b66\u4e60\u53ef\u884c\u6027\u3002\n    3.  **\u5efa\u7acb\u52a1\u5b9e\u76ee\u6807**\uff1a\u5f15\u5bfc\u7528\u6237\u805a\u7126\u9996\u4e2a\u5c0f\u578b\u4f5c\u54c1\u4ea7\u51fa\uff0c\u800c\u975e\u76f4\u63a5\u5bf9\u6807\u5546\u5355\u6536\u5165\u3002\u53ca\u65f6\u7ed9\u4e88\u4f5c\u4e1a\u6b63\u5411\u53cd\u9988\uff0c\u5de9\u56fa\u5b66\u4e60\u4fe1\u5fc3\u3002\n    4.  **\u5bc6\u5207\u76d1\u63a7\u65e9\u671f\u53cd\u9988**\uff1a\u5f00\u8bfe\u7b2c\u4e00\u5468\u91cd\u70b9\u8ddf\u8fdb\uff0c\u4efb\u4f55\u56f0\u60d1\u6216\u65f6\u95f4\u538b\u529b\u9700\u7acb\u5373\u54cd\u5e94\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**\uff1a\n    *   \u9002\u5408**\u6807\u51c6\u7cfb\u7edf\u8bfe**\uff0c\u4f46\u9700\u642d\u914d**\u5f3a\u73ed\u4e3b\u4efb\u966a\u8dd1**\u3002\n    *   \u53ef\u63a8\u8350**\u8f7b\u91cf\u7ea7\u5b9e\u6218\u9879\u76ee\u5305**\u4f5c\u4e3a\u521d\u671f\u6210\u5c31\u611f\u6765\u6e90\uff0c\u907f\u514d\u4e00\u4e0a\u6765\u63a5\u89e6\u590d\u6742\u5546\u5355\u3002\n    *   **\u8c28\u614e\u63a8\u8350\u9ad8\u5355\u4ef7\u79c1\u6559\u6216\u4fdd\u6536\u5165\u5957\u9910**\uff0c\u9664\u975e\u7528\u6237\u4e3b\u52a8\u63d0\u51fa\u4e14\u7ecf\u4e25\u683c\u8bc4\u4f30\u3002\n\n{\"core_type\": \"T4 \u52a1\u5b9e\u63a2\u7d22\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168/\u5c0a\u91cd\", \"target_product_line\": \"AI\u77ed\u89c6\u9891\u7cfb\u7edf\u8bfe\uff08\u6807\u51c6\u7248\uff09+ \u8f7b\u91cf\u5b9e\u6218\u9879\u76ee\u5305\", \"age\": \"28\u5c81\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}";
