    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u4e0e\u98ce\u63a7\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u9ad8)**: \u5b66\u4e60\u76ee\u6807\u660e\u786e\uff0c\u4e3b\u52a8\u6027\u5f3a\u3002\u5df2\u53c2\u4e0e\u8bd5\u97f3\u5e76\u901a\u8fc7\u521d\u5ba1\uff0c\u79ef\u6781\u7ec4\u7ec7\u9879\u76ee\u63a5\u9f99\u3001\u5206\u914d\u89d2\u8272\u3001\u534f\u8c03\u8fdb\u5ea6\uff0c\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u5b9e\u8df5\u548c\u53d8\u73b0\u610f\u613f\u3002\u4e3b\u52a8\u89c4\u5212\u5b66\u4e60\u8def\u5f84\uff08\u5982\u8be2\u95ee\u73ed\u4e3b\u4efb\u5c97\u4f4d\u8981\u6c42\uff09\uff0c\u5e76\u4e3b\u52a8\u8bc6\u522b\u548c\u63d0\u9192\u540c\u5b66\u9632\u8303\u5916\u90e8\u8bc8\u9a97\uff0c\u5b66\u4e60\u5185\u9a71\u529b\u5f3a\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d)**: \u5177\u5907\u57fa\u7840\u6267\u884c\u80fd\u529b\u3002\u80fd\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u8bd5\u97f3\u3001\u7ec4\u7ec7\u534f\u8c03\u3002\u62e5\u6709\u57fa\u7840\u8bbe\u5907\uff08\u63d0\u53ca\u201c\u5b98\u65b9\u8bbe\u5907\u201d\uff09\uff0c\u5e76\u5df2\u5f00\u59cb\u5b66\u4e60\u540e\u671f\u8bfe\u7a0b\u3002**\u4fe1\u606f\u7f3a\u53e3\uff1a\u65e0\u660e\u786e\u7684\u804c\u4e1a\u3001\u6536\u5165\u3001\u65f6\u95f4\u81ea\u7531\u5ea6\u4fe1\u606f\uff0c\u5bb6\u5ead\u7ecf\u6d4e\u72b6\u51b5\u4e0e\u51b3\u7b56\u6743\u672a\u77e5\u3002**\n*   **\u5fc3\u7406\u5f39\u6027 (\u9ad8)**: \u5fc3\u6001\u79ef\u6781\uff0c\u6297\u632b\u6298\u80fd\u529b\u5f3a\u3002\u5bf9\u8bd5\u97f3\u5931\u8d25\u6709\u6e05\u9192\u8ba4\u77e5\uff08\u201c\u88ab\u62d2\u7edd\u4e86\u597d\u51e0\u6b21\u4e86\u201d\uff09\uff0c\u4f46\u80fd\u7406\u6027\u5206\u6790\u539f\u56e0\uff08\u89d2\u8272\u4e0e\u58f0\u7ebf\u5339\u914d\uff09\uff0c\u5e76\u4fdd\u6301\u6301\u7eed\u5c1d\u8bd5\u7684\u70ed\u60c5\u3002\u4e50\u4e8e\u52a9\u4eba\uff0c\u5728\u793e\u7fa4\u4e2d\u626e\u6f14\u7ec4\u7ec7\u8005\u548c\u652f\u6301\u8005\u89d2\u8272\uff0c\u60c5\u7eea\u7a33\u5b9a\u4e14\u5bcc\u6709\u97e7\u6027\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: \u8bb0\u5f55\u4e2d\u672a\u6d89\u53ca\u652f\u4ed8\u884c\u4e3a\u6216\u8ba8\u8bba\u3002**\u65e0\u6cd5\u76f4\u63a5\u786e\u8ba4\u5df2\u5b8c\u6210\u652f\u4ed8\uff0c\u9700\u540e\u53f0\u6570\u636e\u6838\u5b9e\u3002**\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: \u8bb0\u5f55\u4e2d\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u6210\u5458\u6216\u51b3\u7b56\u76f8\u5173\u8ba8\u8bba\u3002**\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u7f3a\u5931\uff0c\u4e3a\u5173\u952e\u98ce\u9669\u70b9\u3002**\n*   **\u6b65\u9aa42 - \u52a8\u673a\u4e0e\u884c\u52a8\u5339\u914d (A\u7c7b\u8ff9\u8c61)**: \u7528\u6237\u884c\u4e3a\u4e0e\u5b66\u4e60\u52a8\u673a\u9ad8\u5ea6\u4e00\u81f4\u3002\u4e0d\u4ec5\u81ea\u5df1\u79ef\u6781\u5b66\u4e60\u3001\u8bd5\u97f3\uff0c\u8fd8\u4e3b\u52a8\u627f\u62c5\u9879\u76ee\u7edf\u7b79\u3001\u753b\u672c\u3001\u62db\u52df\u7b49\u804c\u8d23\uff0c\u884c\u52a8\u529b\u8fdc\u8d85\u666e\u901a\u5b66\u5458\uff0c\u5448\u73b0\u5178\u578b\u7684\u201c\u884c\u52a8\u6d3e\u201d\u7279\u5f81\u3002\n*   **\u6b65\u9aa43 - \u8d44\u6e90\u4e0e\u627f\u8bfa\u8bc4\u4f30 (B\u7c7b\u8ff9\u8c61)**: \u7528\u6237\u5df2\u6295\u5165\u663e\u8457\u65f6\u95f4\u7cbe\u529b\uff08\u7ec4\u7ec7\u6d3b\u52a8\u3001\u753b\u672c\u3001\u8bd5\u97f3\uff09\uff0c\u5e76\u5df2\u62a5\u540d\u540e\u671f\u73ed\u3001\u89c4\u5212\u8fdb\u9636\u73ed\uff0c\u663e\u793a\u51fa\u8f83\u5f3a\u7684\u8bfe\u7a0b\u6295\u5165\u610f\u613f\u3002\u4f46**\u5173\u952e\u7684\u5bb6\u5ead\u652f\u6301\u4e0e\u7ecf\u6d4e\u8d44\u6e90\u4fe1\u606f\u7f3a\u5931**\u3002\n*   **\u6b65\u9aa44 - \u98ce\u9669\u4e0e\u5f39\u6027\u5224\u65ad (\u4f4e\u98ce\u9669)**: \u7528\u6237\u5c55\u73b0\u51fa\u9ad8\u5fc3\u7406\u5f39\u6027\u3001\u7406\u6027\u8ba4\u77e5\uff08\u5982\u5bf9\u4f5c\u4e1a\u8d28\u91cf\u6709\u5408\u7406\u9884\u671f\uff09\u548c\u98ce\u9669\u9632\u8303\u610f\u8bc6\uff08\u8bc6\u522b\u8bc8\u9a97\uff09\uff0c\u9000\u8d39\u6216\u6295\u8bc9\u7684\u4e3b\u52a8\u98ce\u9669\u4f4e\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n**T3 \u52a1\u5b9e\u884c\u52a8\u6d3e**\n*   **\u6838\u5fc3\u7279\u5f81**: \u76ee\u6807\u5bfc\u5411\u660e\u786e\uff0c\u4e0d\u7a7a\u60f3\uff0c\u7acb\u5373\u884c\u52a8\u3002\u5c06\u6240\u5b66\u8fc5\u901f\u5e94\u7528\u4e8e\u5b9e\u8df5\uff08\u8bd5\u97f3\u3001\u9879\u76ee\u7ec4\u7ec7\uff09\uff0c\u5e76\u5bfb\u6c42\u53d8\u73b0\u8def\u5f84\u3002\u5728\u793e\u7fa4\u4e2d\u81ea\u7136\u6210\u4e3a\u6838\u5fc3\u8282\u70b9\uff0c\u5177\u5907\u4e00\u5b9a\u7684\u9886\u5bfc\u529b\u548c\u534f\u8c03\u80fd\u529b\u3002\n*   **\u5339\u914d\u4f9d\u636e**: \u7528\u6237\u884c\u4e3a\u5b8c\u5168\u7b26\u5408\u201c\u5b66\u4ee5\u81f4\u7528\u3001\u5feb\u901f\u5b9e\u8df5\u3001\u7ec4\u7ec7\u534f\u8c03\u3001\u63a2\u7d22\u53d8\u73b0\u201d\u7684\u52a1\u5b9e\u884c\u52a8\u6d3e\u7279\u5f81\uff0c\u662f\u5e73\u53f0\u6700\u7406\u60f3\u7684\u7528\u6237\u7c7b\u578b\u4e4b\u4e00\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u6574\u4f53\u98ce\u9669**: **\u4f4e**\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**: \u98ce\u9669\u4f4e\u3002\u7528\u6237\u5bf9\u5b66\u4e60\u6709\u6e10\u8fdb\u5f0f\u8ba4\u77e5\uff08\u201c\u505a\u4e0d\u5230\u5c3d\u5584\u5c3d\u7f8e\u201d\uff09\uff0c\u4e14\u5df2\u83b7\u5f97\u521d\u6b65\u6b63\u53cd\u9988\uff08\u8bd5\u97f3\u521d\u5ba1\u901a\u8fc7\uff09\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**: **\u672a\u77e5\u3002\u5bb6\u5ead\u7ecf\u6d4e\u4e0e\u51b3\u7b56\u6743\u4fe1\u606f\u7f3a\u5931\uff0c\u662f\u4e3b\u8981\u4e0d\u786e\u5b9a\u6027\u6765\u6e90\u3002**\n    3.  **\u65f6\u95f4\u51b2\u7a81**: \u98ce\u9669\u4f4e\u3002\u7528\u6237\u65f6\u95f4\u6295\u5165\u5ea6\u9ad8\uff0c\u4e14\u80fd\u7075\u6d3b\u5b89\u6392\u3002\n    4.  **\u8bfe\u7a0b\u8d28\u91cf\u8d28\u7591**: \u98ce\u9669\u6781\u4f4e\u3002\u7528\u6237\u4e3b\u52a8\u5b66\u4e60\u3001\u5206\u4eab\u8bfe\u7a0b\u5185\u5bb9\uff08\u5982\u63d0\u53ca\u201c\u53e5\u5c3e\u2018\u554a\u2019\u7684\u97f3\u53d8\u89c4\u5f8b\u201d\uff09\uff0c\u5e76\u79ef\u6781\u89c4\u5212\u540e\u7eed\u8bfe\u7a0b\u3002\n    5.  **\u9500\u552e\u627f\u8bfa\u672a\u5151\u73b0**: \u98ce\u9669\u4f4e\u3002\u8bb0\u5f55\u4e2d\u9500\u552e\u4e92\u52a8\u591a\u4e3a\u4e8b\u52a1\u6027\u652f\u6301\uff0c\u672a\u89c1\u8fc7\u5ea6\u627f\u8bfa\u3002\n    6.  **\u5e73\u53f0/\u670d\u52a1\u4f53\u9a8c**: \u98ce\u9669\u4f4e\u3002\u7528\u6237\u4e0e\u9500\u552e\uff08\u73ed\u73ed\uff09\u6c9f\u901a\u987a\u7545\uff0c\u4e3b\u52a8\u5bfb\u6c42\u5e76\u63a5\u53d7\u6307\u5bfc\u3002\n    7.  **\u4ece\u4f17\u540e\u6094/\u7ade\u54c1\u8f6c\u79fb**: \u98ce\u9669\u6781\u4f4e\u3002\u7528\u6237\u6df1\u5ea6\u6c89\u6d78\u4e8e\u5f53\u524d\u5b66\u4e60\u4e0e\u5b9e\u8df5\u751f\u6001\u4e2d\uff0c\u5e76\u8868\u73b0\u51fa\u957f\u671f\u7559\u5b58\u7684\u610f\u613f\uff08\u8be2\u95ee\u73ed\u4e3b\u4efb\u4efb\u804c\u6761\u4ef6\uff09\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u672a\u53d1\u73b0**\u9500\u552e\u5b58\u5728\u5938\u5927\u627f\u8bfa\u3001\u5236\u9020\u7126\u8651\u3001\u8d2c\u4f4e\u7ade\u54c1\u7b49\u8fdd\u89c4\u884c\u4e3a\u3002\n*   **\u53d1\u73b0\u6f5c\u5728\u98ce\u9669\u70b9**: \u7528\u6237\u4e3b\u52a8\u8be2\u95ee\u201c\u7559\u5728\u559c\u9a6c\u5f53\u73ed\u4e3b\u4efb\u201d\u7684\u8def\u5f84\uff0c\u9500\u552e\u56de\u5e94\u201c\u7532\u65b9\u76f4\u901a\u8f66\u4e2d\u97f3\u4e5f\u662f\u4f60\u7684\u4f18\u70b9\u548c\u4f18\u52bf\u201d**\u53ef\u80fd\u6784\u6210\u5bf9\u201c\u5185\u90e8\u673a\u4f1a\u201d\u7684\u9690\u6027\u627f\u8bfa**\uff0c\u9700\u6ce8\u610f\u8868\u8ff0\u8fb9\u754c\uff0c\u907f\u514d\u5f15\u53d1\u672a\u6765\u804c\u4e1a\u53d1\u5c55\u65b9\u9762\u7684\u9884\u671f\u843d\u5dee\u3002\n*   **\u7528\u6237\u4e3b\u52a8\u8bc6\u522b\u5e76\u63d0\u9192\u8bc8\u9a97**\uff0c\u8bf4\u660e\u5176\u5177\u5907\u826f\u597d\u7684\u98ce\u9669\u610f\u8bc6\uff0c\u4fa7\u9762\u53cd\u6620\u793e\u7fa4\u73af\u5883\u5065\u5eb7\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**: **\u5339\u914d**\u3002\u7528\u6237\u884c\u4e3a\u4e0e\u201c\u57f9\u8bad+\u5b9e\u8df5+\u8d44\u6e90\u5bf9\u63a5\u201d\u7684\u4ea7\u54c1\u6a21\u5f0f\u9ad8\u5ea6\u5951\u5408\uff0c\u662f\u6838\u5fc3\u4ef7\u503c\u7528\u6237\u3002\n*   **\u6700\u4f18\u5148\u52a8\u4f5c**: **\u8865\u5145\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\uff0c\u5de9\u56fa\u4fe1\u4efb**\n*   **\u8be6\u7ec6\u6307\u5357**:\n    1.  **\u4fe1\u606f\u8865\u5168\u4e0e\u5173\u7cfb\u6df1\u5316**: \u5728\u540e\u7eed\u6c9f\u901a\u4e2d\uff0c\u81ea\u7136\u4e86\u89e3\u5176\u5b66\u4e60\u65f6\u95f4\u7684\u4fdd\u969c\uff08\u662f\u5426\u5728\u804c\u3001\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\uff09\uff0c**\u786e\u8ba4\u5176\u652f\u4ed8\u884c\u4e3a\u7684\u5bb6\u5ead\u77e5\u60c5\u4e0e\u652f\u6301\u5ea6**\u3002\u8fd9\u662f\u5f53\u524d\u552f\u4e00\u4e14\u5173\u952e\u7684\u4fe1\u606f\u7f3a\u53e3\u3002\n    2.  **\u8d44\u6e90\u503e\u659c\u4e0e\u4ef7\u503c\u8d4b\u80fd**: \u5c06\u5176\u4f5c\u4e3a\u201c\u79cd\u5b50\u7528\u6237\u201d\u6216\u201c\u793e\u7fa4\u9886\u8896\u201d\u57f9\u517b\u3002\u53ef\u9080\u8bf7\u5176\u5206\u4eab\u8bd5\u97f3\u3001\u9879\u76ee\u7ec4\u7ec7\u7ecf\u9a8c\uff0c\u8d4b\u4e88\u5176\u66f4\u591a\u8d23\u4efb\u611f\uff0c\u6ee1\u8db3\u5176\u6210\u5c31\u611f\u548c\u5f52\u5c5e\u611f\u3002\n    3.  **\u8def\u5f84\u5f15\u5bfc\u4e0e\u9884\u671f\u7ba1\u7406**: \u5bf9\u5176\u804c\u4e1a\u53d1\u5c55\u5174\u8da3\uff08\u5982\u73ed\u4e3b\u4efb\uff09\u7ed9\u4e88\u6b63\u9762\u4f46\u73b0\u5b9e\u7684\u5f15\u5bfc\uff0c\u5f3a\u8c03\u80fd\u529b\u79ef\u7d2f\u4e0e\u4f5c\u54c1\u7684\u91cd\u8981\u6027\uff0c\u7ba1\u7406\u5176\u5bf9\u201c\u5185\u90e8\u673a\u4f1a\u201d\u7684\u9884\u671f\uff0c\u5c06\u5176\u70ed\u60c5\u5bfc\u5411\u6301\u7eed\u5b66\u4e60\u548c\u4ea7\u51fa\u4f18\u8d28\u4f5c\u54c1\u3002\n    4.  **\u98ce\u9669\u9884\u63a7**: \u867d\u7136\u5176\u4e2a\u4eba\u9000\u8d39\u98ce\u9669\u4f4e\uff0c\u4f46\u4ecd\u9700\u786e\u4fdd\u5176\u53c2\u4e0e\u7684\u6240\u6709\u9879\u76ee\uff08\u5982\u7532\u65b9\u4e66\uff09\u6d41\u7a0b\u987a\u7545\u3001\u6c9f\u901a\u53ca\u65f6\uff0c\u907f\u514d\u56e0\u5916\u90e8\u5408\u4f5c\u65b9\u5ef6\u8fdf\uff08\u5982\u5176\u50ac\u4fc3\u5267\u672c\uff09\u5bfc\u81f4\u5176\u5bf9\u5e73\u53f0\u8d44\u6e90\u652f\u6301\u80fd\u529b\u4ea7\u751f\u6000\u7591\u3002\n\n{\"core_type\": \"T3 \u52a1\u5b9e\u884c\u52a8\u6d3e\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u8865\u5145\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\"}";
