    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n> **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u4e3b\u8981\u4e3a\u8bad\u7ec3\u8425\u671f\u95f4\u53ca\u540e\u7eed\u7fa4\u5185\u4e92\u52a8\uff0c\u7f3a\u5931\u5173\u952e\u4fe1\u606f\uff1a**\u652f\u4ed8\u65b9\u5f0f\u4e0e\u91d1\u989d**\u3001**\u5bb6\u5ead\u51b3\u7b56\u6743\u4e0e\u652f\u6301\u5ea6**\u3001**\u4e2a\u4eba\u5de5\u4f5c\u4e0e\u6536\u5165\u72b6\u51b5**\u3001**\u8d2d\u4e70\u51b3\u7b56\u65f6\u7684\u6df1\u5ea6\u5fc3\u7406\u52a8\u673a**\u3002\u4ee5\u4e0b\u5206\u6790\u57fa\u4e8e\u73b0\u6709\u4e92\u52a8\u884c\u4e3a\u63a8\u65ad\u3002\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676939804 (\u6635\u79f0\uff1a\u725b\u5976\u5496\u5561) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-02-13 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e-\u9752\u6728(\u5218\u6021\u68b5) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u64ad\u6559\u80b2\u6709\u58f0\u6f14\u64ad\u8bad\u7ec3\u8425 (\u4ef7\u683c\u672a\u77e5) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **[\u4fe1\u606f\u7f3a\u5931]** \u65e0\u6cd5\u5224\u65ad\uff0c\u9700\u8b66\u60d5\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **[\u4fe1\u606f\u7f3a\u5931]** \u4e92\u52a8\u79ef\u6781\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u65f6\u95f4\u5b89\u6392\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **[\u4fe1\u606f\u7f3a\u5931]** \u672a\u63d0\u53ca\u5bb6\u5ead\uff0c\u98ce\u9669\u672a\u77e5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** \u5173\u952e\u4e09\u8f74\u4fe1\u606f\u4e0d\u8db3\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **[\u27a1\u4e2d]**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u5174\u8da3\u3001\u81ea\u6211\u63d0\u5347\u4e0e\u8d5a\u94b1\u52a8\u673a\u5e76\u5b58\uff0c\u672a\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u751f\u5b58\u538b\u529b\u6216\u6025\u8feb\u53d8\u73b0\u9700\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4f5c\u4e3a\u517c\u804c\uff0c\u7ed9\u81ea\u5df1\u627e\u4e2a\u5174\u8da3\u7231\u597d\uff0c\u8bad\u7ec3\u81ea\u5df1\u7684\u8bed\u8a00\u8868\u8fbe\u80fd\u529b\uff0c\u5f53\u7136\u8fd8\u80fd\u8d5a\u94b1\u662f\u66f4\u597d\u5566[\u5472\u7259]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **[\u27a1\u4e2d]**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u4fe1\u606f\u7f3a\u5931]** \u2014 \u672a\u63d0\u53ca\u7ecf\u6d4e\u72b6\u51b5\uff0c\u8d2d\u4e70\u51b3\u7b56\u8f7b\u677e\uff0c\u4f46\u65e0\u6cd5\u5224\u65ad\u771f\u5b9e\u627f\u8f7d\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**[\u4e2d]** \u2014 \u80fd\u6309\u65f6\u5b8c\u6210\u8bad\u7ec3\u8425\u4efb\u52a1\u3001\u53c2\u4e0e\u7fa4\u5185\u5408\u4f5c\uff0c\u663e\u793a\u6709\u89c4\u5f8b\u4e1a\u4f59\u65f6\u95f4\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u804c\u4e1a\u4e0e\u65f6\u95f4\u538b\u529b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u4fe1\u606f\u7f3a\u5931]** \u2014 \u5b8c\u5168\u672a\u63d0\u53ca\uff0c\u5b58\u5728\u6f5c\u5728\u98ce\u9669\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **[\u2b06\u9ad8]**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9047\u5230\u95ee\u9898\uff08\u5982\u55d3\u5b50\u4e0d\u9002\u3001\u5f55\u97f3\u6548\u679c\u4e0d\u6ee1\u610f\uff09\u80fd\u4e3b\u52a8\u6c9f\u901a\u3001\u5bfb\u6c42\u65b9\u6cd5\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u4e50\u4e8e\u5408\u4f5c\u4e0e\u53cd\u9988\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5c31\u662f\u524d\u6bb5\u65f6\u95f4\u611f\u5192\u54b3\u55fd\u4e86\u5feb\u4e00\u4e2a\u6708\uff0c\u867d\u7136\u73b0\u5728\u4e0d\u54b3\u55fd\u4e86\uff0c\u4f46\u55d3\u5b50\u4e00\u76f4\u4e0d\u8212\u670d\uff0c\u6709\u70b9\u627e\u4e0d\u5230\u72b6\u6001\u3002\u201d (\u9648\u8ff0\u4e8b\u5b9e\uff0c\u975e\u62b1\u6028) > \u201c\u597d\u7684\uff0c\u4eca\u5929\u592a\u665a\u4e86\uff0c\u72b6\u6001\u4e0d\u592a\u597d\u3002\u6211\u660e\u5929\u518d\u91cd\u65b0\u5f55\u4e00\u4e0b\u201d (\u63a5\u53d7\u53cd\u9988\uff0c\u4e3b\u52a8\u8c03\u6574)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u5f52\u5c5e\u4e0e\u5c0a\u91cd** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9**\u7fa4\u4f53\u8ba4\u53ef\u4e0e\u5408\u4f5c\u4ef7\u503c**\u7684\u6e34\u671b\u3002\u5979\u79ef\u6781\u53c2\u4e0e\u7fa4\u5185\u642d\u620f\u3001\u8ba8\u8bba\uff0c\u4eab\u53d7\u56e2\u961f\u534f\u4f5c\u8fc7\u7a0b\uff0c\u5e76\u4ece\u4e2d\u83b7\u5f97\u6210\u5c31\u611f\u4e0e\u5f52\u5c5e\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5728\u4e13\u4e1a\u793e\u7fa4\u4e2d\u83b7\u5f97\u201c\u88ab\u9700\u8981\u201d\u7684\u5c0a\u91cd\u611f\u4e0e\u201c\u5171\u540c\u521b\u9020\u201d\u7684\u5f52\u5c5e\u611f**\u3002\u5c06\u5979\u89c6\u4e3a\u6709\u4ef7\u503c\u7684\u5408\u4f5c\u4f19\u4f34\uff0c\u800c\u975e\u5355\u7eaf\u5b66\u5458\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B** \u7c7b (\u52a8\u673a\u4e2d\u7b49\u3001\u8d44\u6e90\u4e2d\u7b49\u3001\u5f39\u6027\u9ad8\uff0c\u6709\u826f\u597d\u57f9\u517b\u6f5c\u529b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u914d\u5408\u5ea6\u9ad8\u3001\u6267\u884c\u529b\u5f3a\u3001\u4e50\u4e8e\u5408\u4f5c\u3001\u60c5\u7eea\u7a33\u5b9a\u3001\u4e0d\u5f20\u626c) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u4fe1\u606f\u7f3a\u5931\uff0c\u82e5\u4e3a\u9690\u7792\u5bb6\u5ead\u652f\u51fa\uff0c\u5b58\u5728\u98ce\u9669\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u5b66\u4e60\u6001\u5ea6\u79ef\u6781\uff0c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5c1a\u53ef\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u63a5\u53d7\u53cd\u9988\u5e76\u81ea\u6211\u8c03\u6574\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u82e5\u957f\u671f\u65e0\u6cd5\u83b7\u5f97\u5b9e\u8d28\u6027\u7684\u5408\u4f5c\u673a\u4f1a\u6216\u793e\u7fa4\u8ba4\u53ef\uff0c\u53ef\u80fd\u56e0\u201c\u65e0\u4ef7\u503c\u611f\u201d\u800c\u6d41\u5931\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe**1\u4e2a\u6708\u540e**\uff0c\u5f53\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u82e5\u672a\u80fd\u878d\u5165\u6838\u5fc3\u5708\u5b50\u6216\u83b7\u5f97\u6709\u6210\u5c31\u611f\u7684\u5408\u4f5c\u9879\u76ee\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u5979\u8bf4......\u201d**\n> \u201c\u725b\u5976\u5496\u5561\uff0c\u6211\u770b\u4f60\u5728\u8bad\u7ec3\u8425\u91cc\u7279\u522b\u79ef\u6781\uff0c\u8ddf\u961f\u53cb\u5408\u4f5c\u5f97\u4e5f\u5f88\u68d2\uff01\u54b1\u4eec\u6b63\u5f0f\u8bfe\u91cc\u6709\u5f88\u591a\u50cf\u4e0a\u6b21\u90a3\u6837\u7684\u56e2\u961f\u5b9e\u6218\u9879\u76ee\uff0c\u6211\u89c9\u5f97\u4f60\u7279\u522b\u9002\u5408\u505a\u5c0f\u7ec4\u7684\u2018\u5b9a\u6d77\u795e\u9488\u2019\uff0c\u4ee5\u540e\u6709\u597d\u7684\u5408\u4f5c\u673a\u4f1a\uff0c\u6211\u7b2c\u4e00\u4e2a\u60f3\u5230\u4f60\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf**\u3011\u2014\u2014 \u91cd\u70b9\u63d0\u4f9b\u793e\u7fa4\u5185\u89d2\u8272\u626e\u6f14\u3001\u642d\u620f\u3001\u5c0f\u7ec4\u9879\u76ee\u5408\u4f5c\u673a\u4f1a\uff0c\u5c06\u5176\u53d1\u5c55\u4e3a\u793e\u7fa4\u6838\u5fc3\u6d3b\u8dc3\u5206\u5b50\u4e0e\u201c\u52a9\u6559\u201d\u89d2\u8272\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u5b9e\u6218\u9879\u76ee\u4f18\u5148\u4f53\u9a8c\u5305**\u3011\u2014\u2014 \u4f18\u5148\u9080\u8bf7\u53c2\u4e0e\u5185\u90e8\u5c0f\u5267\u573a\u3001\u6709\u58f0\u5267\u5236\u4f5c\u7b49\u80fd\u4f53\u73b0\u5176\u5408\u4f5c\u4ef7\u503c\u7684\u9879\u76ee\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5c06\u5979\u5f53\u4f5c\u201c\u5c0f\u767d\u201d\u6216\u201c\u95ee\u9898\u5b66\u5458\u201d\u5bf9\u5f85\uff1b\u5ffd\u89c6\u5979\u5728\u793e\u7fa4\u4e2d\u7684\u8d21\u732e\uff1b\u53ea\u7ed9\u5355\u6253\u72ec\u6597\u7684\u4f5c\u4e1a\uff0c\u4e0d\u7ed9\u56e2\u961f\u534f\u4f5c\u7684\u673a\u4f1a\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u63a8\u4ecb**\u4e2d\u9ad8\u9636\u793e\u7fa4\u6216\u9879\u76ee\u5236\u8bfe\u7a0b**\uff0c\u4f46\u9700\u7ed1\u5b9a\u201c\u56e2\u961f\u9886\u8896\u201d\u3001\u201c\u5408\u4f5c\u4f18\u5148\u6743\u201d\u7b49\u793e\u4ea4\u4ef7\u503c\uff0c\u800c\u975e\u5355\u7eaf\u6280\u80fd\u63d0\u5347\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u4f5c\u4e3a\u517c\u804c\uff0c\u7ed9\u81ea\u5df1\u627e\u4e2a\u5174\u8da3\u7231\u597d\uff0c\u8bad\u7ec3\u81ea\u5df1\u7684\u8bed\u8a00\u8868\u8fbe\u80fd\u529b\uff0c\u5f53\u7136\u8fd8\u80fd\u8d5a\u94b1\u662f\u66f4\u597d\u5566[\u5472\u7259]\u201d **(\u52a8\u673a\u590d\u5408\u6027)**\n2. > \u201c\u5ba2\u6c14\u5565\uff0c\u6211\u4eec\u662f\u4e00\u4e2a\u961f\u7684[\u5472\u7259]\u201d **(\u5f3a\u70c8\u7684\u56e2\u961f\u5f52\u5c5e\u611f)**\n3. > \u201c\u597d\u7684\uff0c\u4eca\u5929\u592a\u665a\u4e86\uff0c\u72b6\u6001\u4e0d\u592a\u597d\u3002\u6211\u660e\u5929\u518d\u91cd\u65b0\u5f55\u4e00\u4e0b\u201d **(\u9ad8\u5f39\u6027\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2\u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u5728\u4e13\u4e1a\u793e\u7fa4\u4e2d\u83b7\u5f97\u5f52\u5c5e\u611f\u4e0e\u5c0a\u91cd**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u6301\u7eed\u8d4b\u4e88\u5176\u793e\u7fa4\u5185\u7684\u5408\u4f5c\u4ef7\u503c\u4e0e\u6838\u5fc3\u6210\u5458\u8eab\u4efd\u611f**\u3002\n\n```json\n{\"cor
