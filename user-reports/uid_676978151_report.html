    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | WL |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-22 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u897f\u57ce\u5f3a\u54e5(\u738b\u5f3a) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | sE2200\u5957\u88c5 (3999\u5143) / \u610f\u5411\u540e\u671f\u8fdb\u9636\u8bfe |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u5145\u88d5 (\u76f4\u63a5\u4e0b\u5355\uff0c\u65e0\u5206\u671f/\u501f\u6b3e\u8ff9\u8c61) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1 (\u4e3b\u4e1a\u7e41\u5fd9\uff0c\u9700\u201c\u8ffd\u8d76\u8282\u594f\u201d\uff0c\u4f46\u65f6\u95f4\u53ef\u81ea\u7531\u5b89\u6392) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u7f3a\u5931 (\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff0c\u9700\u6838\u67e5) |\n| **\u4fe1\u606f\u539a\u5ea6** | \u9971\u6ee1 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u5173\u6ce8\u5b66\u4e60\u8fc7\u7a0b\u4e0e\u6280\u80fd\u7cbe\u8fdb\uff0c\u65e0\u77ed\u671f\u53d8\u73b0\u538b\u529b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u73b0\u5728\u662f\u53c8\u559c\u6b22\u64ad\u97f3\u653e\u4e0d\u4e0b\uff0c\u53c8\u65f6\u95f4\u4e0d\u5141\u8bb8\uff0c\u54c8\u54c8\uff0c\u6b63\u5728\u505a\u8c03\u6574\u201d\uff1b > \u201c\u5b66\u4e2d\u73a9\uff0c\u73a9\u4e2d\u5b66\u5427\uff0c\u53cd\u800c\u66f4\u5bb9\u6613\u5438\u6536\u4e00\u4e9b\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a\u9ad8 \u2014 \u76f4\u63a5\u8d2d\u4e703999\u5143\u8bbe\u5907\uff0c\u8ba1\u5212\u8d2d\u4e70\u540e\u7eed\u8bfe\u7a0b\uff0c\u65e0\u8d44\u91d1\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a\u4e2d \u2014 \u4e3b\u4e1a\u7e41\u5fd9\uff0c\u591a\u6b21\u63d0\u53ca\u201c\u843d\u4e0b\u529f\u8bfe\u201d\u3001\u201c\u65f6\u95f4\u7d27\u201d\uff0c\u4f46\u80fd\u4e3b\u52a8\u8c03\u6574\u3001\u8ffd\u8d76\uff0c\u65f6\u95f4\u5b89\u6392\u7075\u6d3b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a\u4fe1\u606f\u7f3a\u5931 \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff0c**\u9700\u91cd\u70b9\u6838\u67e5**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\uff0c\u9047\u5230\u95ee\u9898\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u6001\u5ea6\u79ef\u6781\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u7535\u8111\u4e0d\u7b26\u5408\u8bbe\u5907\u5b89\u88c5\u7684\u7cfb\u7edf\u914d\u7f6e\uff0c\u5468\u672b\u6211\u4e70\u53f0\u65b0\u7535\u8111\u53bb\u201d\uff1b > \u201c\u8bbe\u5907\u5df2\u5230\uff0c\u6211\u8981\u5927\u5e72\u5feb\u4e0a\u4e86\uff0c\u843d\u4e0b\u7684\u8865\u8d77\u6765\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u4e3b\u4e1a\u7e41\u5fd9\u5e26\u6765\u7684\u65f6\u95f4\u51b2\u7a81\u4e0e\u6280\u80fd\u7cbe\u8fdb\u6e34\u671b\u4e4b\u95f4\u7684\u77db\u76fe\uff0c\u672c\u8d28\u662f\u8ffd\u6c42\u4e2a\u4eba\u6f5c\u80fd\u53d1\u6325\u4e0e\u5174\u8da3\u4ef7\u503c\u5b9e\u73b0\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u6df1\u5ea6\u8ba4\u540c\u4e0e\u5708\u5c42\u5f52\u5c5e\u611f**\u3002\u4ed6\u9700\u8981\u88ab\u5f53\u4f5c\u201c\u6709\u6f5c\u529b\u7684\u540c\u884c\u201d\u800c\u975e\u201c\u5c0f\u767d\u5b66\u5458\u201d\u5bf9\u5f85\uff0c\u6e34\u671b\u83b7\u5f97\u6280\u672f\u4e0a\u7684\u70b9\u62e8\u548c\u5708\u5185\u7684\u8ba4\u53ef\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \u2b50A \u7c7b (\u9ad8\u52a8\u673a\u3001\u9ad8\u5f39\u6027\u3001\u8d44\u6e90\u5e95\u5ea7\u4e2d\u7b49\u4f46\u6709\u8c03\u6574\u80fd\u529b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u517c\u987e\u90e8\u5206T3\u6b7b\u78d5\u5b66\u9738\u7279\u5f81) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4e2d (\u4fe1\u606f\u7f3a\u5931\uff0c\u9700\u6838\u67e5) | \u82e5\u5bb6\u4eba\u4e0d\u77e5\u60c5\u6216\u53cd\u5bf9\uff0c\u53ef\u80fd\u6210\u4e3a\u9690\u60a3\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5f3a\uff0c\u80fd\u4e3b\u52a8\u8c03\u6574\u8ffd\u8d76\uff0c\u5d29\u76d8\u98ce\u9669\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u5982\u7535\u8111\u7cfb\u7edf\u4e0d\u7b26\uff09\u4e3b\u52a8\u89e3\u51b3\uff0c\u65e0\u62b1\u6028\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u6781\u4f4e | \u52a8\u673a\u4e3a\u5174\u8da3\u4e0e\u80fd\u529b\u6210\u957f\uff0c\u975e\u77ed\u671f\u53d8\u73b0\uff0c\u5bf9\u6536\u76ca\u65e0\u8feb\u5207\u8981\u6c42\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u65e0\u660e\u663e\u5371\u9669\u65f6\u95f4\u7a97\u3002\u552f\u4e00\u98ce\u9669\u70b9\u5728\u4e8e**\u5bb6\u5ead\u652f\u6301\u5ea6\u672a\u77e5**\uff0c\u82e5\u5b58\u5728\u9690\u7792\u6216\u53cd\u5bf9\uff0c\u53ef\u80fd\u5728\u5f00\u8425\u521d\u671f\u6216\u7eed\u8d39\u65f6\u7206\u53d1\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cWL\u540c\u5b66\uff0c\u770b\u5230\u4f60\u4e3a\u4e86\u5b66\u4e60\u8fde\u7535\u8111\u90fd\u6362\u4e86\uff0c\u8fd9\u4efd\u6295\u5165\u548c\u884c\u52a8\u529b\u975e\u5e38\u96be\u5f97\u3002\u54b1\u4eec\u8fd9\u4e2a\u5708\u5b50\u5c31\u9700\u8981\u4f60\u8fd9\u6837\u8ba4\u771f\u94bb\u7814\u7684\u4f19\u4f34\u3002\u65f6\u95f4\u7d27\u6ca1\u5173\u7cfb\uff0c\u54b1\u4eec\u6293\u6838\u5fc3\u3001\u8bb2\u65b9\u6cd5\uff0c\u6211\u4f1a\u5e2e\u4f60\u628a\u6700\u7cbe\u534e\u7684\u8def\u5f84\u7406\u51fa\u6765\uff0c\u8ba9\u4f60\u6bcf\u4e00\u6b65\u90fd\u8e29\u5728\u70b9\u4e0a\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u3002\u4ed6\u9700\u8981\u624e\u5b9e\u7684\u6280\u672f\u6307\u5bfc\u548c\u9ad8\u6548\u7684\u89e3\u51b3\u65b9\u6848\uff0c\u5bf9\u201c\u5c0f\u7076\u201d\u3001\u9488\u5bf9\u6027\u7b54\u7591\u9700\u6c42\u5f3a\u70c8\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743**\u3011\u3002\u5141\u8bb8\u4ed6\u6df1\u5165\u63d0\u95eeAU\u64cd\u4f5c\u3001\u8bbe\u5907\u8c03\u8bd5\u3001\u573a\u666f\u642d\u5efa\u7b49\u786c\u6838\u95ee\u9898\uff0c\u6ee1\u8db3\u5176\u94bb\u7814\u9700\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u628a\u4ed6\u5f53\u4f5c\u9700\u8981\u60c5\u7eea\u5b89\u629a\u7684\u5c0f\u767d\uff0c\u6216\u4ec5\u63d0\u4f9b\u80a4\u6d45\u7684\u9f13\u52b1\u3002**\u907f\u514d\u8fc7\u5ea6\u4f7f\u7528\u201c\u60c5\u7eea\u4fdd\u59c6\u6c60(C\u6a21\u5757)\u201d\u7684\u5b89\u6170\u8bdd\u672f**\uff0c\u8fd9\u4f1a\u8ba9\u4ed6\u89c9\u5f97\u4e0d\u88ab\u91cd\u89c6\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u5927\u989d\u63a8\u4ecb\u3002\u4ed6\u5bf9\u540e\u7eed\u8bfe\u7a0b\uff08\u5982\u540e\u671f\u8bfe\uff09\u6709\u660e\u786e\u610f\u5411\uff0c\u4e14\u5177\u5907\u652f\u4ed8\u80fd\u529b\uff0c\u662f\u4f18\u8d28\u590d\u8d2d\u5bf9\u8c61\u3002\u63a8\u4ecb\u65f6\u5e94\u4fa7\u91cd\u8bfe\u7a0b\u7684\u6280\u672f\u6df1\u5ea6\u548c\u80fd\u5e26\u6765\u7684\u80fd\u529b\u63d0\u5347\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u73b0\u5728\u662f\u53c8\u559c\u6b22\u64ad\u97f3\u653e\u4e0d\u4e0b\uff0c\u53c8\u65f6\u95f4\u4e0d\u5141\u8bb8\uff0c\u54c8\u54c8\uff0c\u6b63\u5728\u505a\u8c03\u6574\u201d\n2. > \u201c\u7535\u8111\u4e0d\u7b26\u5408\u8bbe\u5907\u5b89\u88c5\u7684\u7cfb\u7edf\u914d\u7f6e\uff0c\u5468\u672b\u6211\u4e70\u53f0\u65b0\u7535\u8111\u53bb\u201d\n3. > \u201c\u5b66\u4e2d\u73a9\uff0c\u73a9\u4e2d\u5b66\u5427\uff0c\u53cd\u800c\u66f4\u5bb9\u6613\u5438\u6536\u4e00\u4e9b\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2\u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u81ea\u6211\u5b9e\u73b0\u4e0e\u4e13\u4e1a\u7cbe\u8fdb**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4f4e**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u786c\u6838\u3001\u9ad8\u6548\u7684\u6280\u672f\u652f\u6301\u4e0e\u8def\u5f84\u6307\u5bfc\uff0c\u5e76\u6838\u67e5\u5bb6\u5ead\u652f\u6301\u60c5\u51b5**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"maslow_need\": \"\u7b2c\u4e94\u5c42\u81ea\u6211\u5b9e\u73b0\", \"risk_level\": \"\u4f4e\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\"}\n```";
