    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | 677149983 (\u6635\u79f0\uff1a\u5c0f\u9ca4\u9c7c) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5b98\u65b9\u52a9\u6559-\u6696\u6696(\u5218\u5bb6\u7537) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b (\u6700\u7ec8\u652f\u4ed83980\u5143\uff0c\u610f\u5411\u4e3a7380\u5143\u9ad8\u9636\u73ed) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u5bb6\u4eba\u652f\u6301\u652f\u4ed8** (\u7528\u6237\u8868\u793a\u201c\u6211\u8ba9\u6211\u8001\u516c\u4ed8\u201d) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u5b9d\u5988\uff0c\u53ef\u5229\u7528\u4e0b\u73ed\u540e\u65f6\u95f4) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u5df2\u62a5\u5907\u5e76\u652f\u6301** (\u652f\u4ed8\u7531\u8001\u516c\u5b8c\u6210\uff0c\u5bb6\u5ead\u77e5\u60c5) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b07\u4f4e\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u7eaf\u4e3a\u51e0\u5929\u5185\u63d0\u73b0\u4fdd\u5e95\u800c\u6765(\u4f4e\u6781\u5371)**\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u5b66\u4e60\u76ee\u7684\u662f\u201c\u60f3\u901a\u8fc7\u6709\u58f0\u770b\u80fd\u4e0d\u80fd\u8d5a\u5230\u81ea\u5df1\u60f3\u8981\u7684\u201d\uff0c\u671f\u671b\u6708\u51656000-7000\u5143\uff0c\u5e76\u591a\u6b21\u5f3a\u8c03\u201c\u6323\u94b1\u7684\u80af\u5b9a\u90fd\u60f3\u53bb\u5e72\u4e86\u201d\u3001\u201c\u6bd5\u7adf\u6ca1\u4eba\u5acc\u94b1\u591a\u201d\u3002\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u672c\u8eab\u5174\u8da3\u4e00\u822c\uff0c\u66f4\u5173\u6ce8\u53d8\u73b0\u8def\u5f84\u548c\u201c\u591a\u4e45\u80fd\u8d5a\u94b1\u201d\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u56e0\u4e3a\u5b66\u5386\u4e5f\u4e0d\u9ad8\u561b\uff0c\u53ef\u80fd\u8bf4\u50cf\u5728\u8fd9\u4e2a\u5e74\u7eaa\u6709\u4e00\u4efd...\u60f3\u901a\u8fc7\u6709\u58f0\u770b\u80fd\u4e0d\u80fd\u8d5a\u5230\u81ea\u5df1\u60f3\u8981\u7684\uff0c\u4f60\u8bf4\uff0c\u4f60\u8fd9\u671f\u5f85\u7684\u5de5\u8d44\u5c31\u662f\u5927\u6982\u5de5\u8d44\u662f\u591a\u5c11\u7684\u8bdd\uff0c\u90a3\u80af\u5b9a\u662f\u8d8a\u591a\u8d8a\u597d\u5566\uff0c\u90a3\u6700\u597d\u8bf4\u80fd\u62ff\u4e2a6000~7000\u54af\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u7528\u6237\u6700\u7ec8\u9009\u62e9\u652f\u4ed83980\u5143\uff08\u800c\u975e7380\u5143\uff09\uff0c\u652f\u4ed8\u8fc7\u7a0b\u6709\u72b9\u8c6b\uff08\u8be2\u95ee\u5206\u671f\uff09\uff0c\u4f46\u6700\u7ec8\u7531\u4e08\u592b\u652f\u4ed8\uff0c\u8868\u660e\u5bb6\u5ead\u6709\u57fa\u672c\u652f\u6301\uff0c\u4f46\u975e\u4e2a\u4eba\u5145\u88d5\u8d44\u91d1\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u7528\u6237\u4e3a\u5b9d\u5988\uff0c\u53ef\u5229\u7528\u201c\u4e0b\u73ed\u540e\u201d\u65f6\u95f4\u5b66\u4e60\uff0c\u5177\u5907\u788e\u7247\u5316\u65f6\u95f4\u3002\u4f46\u201c\u8bb0\u6027\u4e0d\u662f\u90a3\u4e48\u597d\uff0c\u6709\u65f6\u5019\u4e00\u4e0b\u5b50\u592a\u591a\u8bb0\u4e0d\u4f4f\u201d\u8868\u660e\u7cbe\u529b\u4e0e\u5b66\u4e60\u80fd\u529b\u5b58\u5728\u4e00\u5b9a\u6311\u6218\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u9ad8** \u2014 \u652f\u4ed8\u73af\u8282\u7531\u4e08\u592b\u5b8c\u6210\uff0c\u5bb6\u5ead\u77e5\u60c5\u4e14\u652f\u6301\u3002\n- **\u5e95\u5ea7\u53d6\u77ed\u677f**\uff1a**\u4e2d** (\u65f6\u95f4\u7cbe\u529b\u7ef4\u5ea6\u4e3a\u77ed\u677f)\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u7528\u6237\u591a\u6b21\u8868\u8fbe\u4e0d\u81ea\u4fe1\uff1a\u201c\u53ef\u80fd\u521a\u5f00\u59cb\u5e95\u6c14\u4e0d\u662f\u5f88\u8db3\u201d\u3001\u201c\u8bb0\u6027\u4e0d\u662f\u90a3\u4e48\u597d\u201d\u3002\u5728\u9500\u552e\u7ed9\u4e88\u79ef\u6781\u53cd\u9988\u548c\u627f\u8bfa\u540e\uff0c\u8868\u73b0\u51fa\u9ad8\u5ea6\u4f9d\u8d56\u548c\u5174\u594b\uff08\u201c\u5fc3\u91cc\u662f\u5f88\u5174\u594b\u7684\uff0c\u4e5f\u4e3a\u81ea\u5df1\u627e\u5230\u4e00\u4e2a\u5f88\u68d2\u7684\u9886\u8def\u4eba\u611f\u5230\u6b23\u6170\u201d\uff09\uff0c\u60c5\u7eea\u6613\u53d7\u5916\u754c\u53cd\u9988\u5f71\u54cd\uff0c\u7f3a\u4e4f\u72ec\u7acb\u89e3\u51b3\u95ee\u9898\u7684\u4fe1\u5fc3\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u53ef\u80fd\u521a\u5f00\u59cb\u5e95\u6c14\u4e0d\u662f\u5f88\u8db3[\u5472\u7259]\u201d > \u201c\u8bb0\u6027\u4e0d\u662f\u90a3\u4e48\u597d\uff0c\u6709\u65f6\u5019\u4e00\u4e0b\u5b50\u592a\u591a\u8bb0\u4e0d\u4f4f\u3002\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e2d\u5e74\u5931\u4e1a\u7126\u8651\u4e0e\u81ea\u6211\u4ef7\u503c\u5371\u673a**\u3002\u7528\u6237\u662f\u5b9d\u5988\uff0c\u5b66\u5386\u4e0d\u9ad8\uff0c\u65e0\u7279\u522b\u4e00\u6280\u4e4b\u957f\uff0c\u56e0\u201c\u5927\u7ecf\u6d4e\u4e0d\u597d\uff0c\u5de5\u4f5c\u53ef\u80fd\u4e5f\u9047\u5230\u4e86\u74f6\u9888\u201d\uff0c\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u6709\u58f0\u6280\u80fd\u83b7\u5f97\u4e00\u4efd\u201c\u62ff\u5f97\u51fa\u624b\u7684\u5de5\u4f5c\u201d\u548c\u7a33\u5b9a\u6536\u5165\uff086000-7000\u5143\uff09\uff0c\u6838\u5fc3\u662f\u5e94\u5bf9\u7ecf\u6d4e\u4e0d\u7a33\u5b9a\u548c\u804c\u4e1a\u65e0\u4fdd\u969c\u7684\u6050\u60e7\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u9632\u62a4\u76fe\u5f0f\u7684\u5b89\u5168\u611f\u4e0e\u660e\u786e\u7684\u8def\u5f84\u627f\u8bfa**\u3002\u5979\u9700\u8981\u88ab\u53cd\u590d\u4fdd\u8bc1\u201c\u8fd9\u6761\u8def\u80fd\u8d70\u901a\u201d\u3001\u201c\u6709\u4eba\u5e26\u201d\u3001\u201c\u6709\u8d44\u6e90\u201d\uff0c\u4ee5\u7f13\u89e3\u5176\u56e0\u8d44\u6e90\u4e0d\u8db3\u548c\u80fd\u529b\u4e0d\u81ea\u4fe1\u5e26\u6765\u7684\u6df1\u5c42\u7126\u8651\u3002\u4efb\u4f55\u4e0d\u786e\u5b9a\u6027\u90fd\u53ef\u80fd\u5f15\u53d1\u5d29\u6e83\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b\uff08\u51b2\u52a8\u98ce\u9669\u578b\uff09** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u5bb6\u5ead\u77e5\u60c5\u4e14\u652f\u6301\u652f\u4ed8\uff0c\u98ce\u9669\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u5b9d\u5988+\u788e\u7247\u5316\u65f6\u95f4+\u81ea\u8ba4\u8bb0\u6027\u5dee**\uff0c\u5b66\u4e60\u8fdb\u5ea6\u4e00\u65e6\u843d\u540e\u6216\u6280\u672f\u64cd\u4f5c\uff08\u5982\u4e0b\u8f7d\u7248\u6743\u4e66\uff09\u9047\u963b\uff0c\u6781\u6613\u56e0\u632b\u8d25\u611f\u548c\u65f6\u95f4\u538b\u529b\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u7528\u6237\u6781\u5ea6\u4e0d\u81ea\u4fe1\uff0c\u4f9d\u8d56\u5916\u90e8\u80af\u5b9a\u3002\u5f53\u5b66\u4e60\u9047\u5230\u7b2c\u4e00\u4e2a\u5b9e\u8d28\u6027\u56f0\u96be\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u3001\u89d2\u8272\u97f3\u7ec3\u4e60\u5931\u8d25\u3001\u7b2c\u4e00\u6b21\u8bd5\u97f3\u672a\u901a\u8fc7\uff09\uff0c\u81ea\u5c0a\u5fc3\u53d7\u632b\uff0c\u6781\u6613\u60c5\u7eea\u5d29\u6e83\u5e76\u5f52\u548e\u4e8e\u8bfe\u7a0b\u201c\u6ca1\u7528\u201d\u3001\u201c\u9a97\u4eba\u201d\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | \u5bf9\u53d8\u73b0\u671f\u671b\u9ad8\u4e14\u6025\u8feb\uff08\u6708\u51656-7k\uff09\u3002\u82e5\u5f00\u8bfe\u540e\u53d1\u73b0\u65e0\u6cd5\u5feb\u901f\u63a5\u5355\u6216\u6536\u5165\u8fdc\u4f4e\u4e8e\u9884\u671f\uff0c\u4f1a\u7acb\u523b\u611f\u5230\u88ab\u6b3a\u9a97\uff0c\u5f15\u53d1\u5f3a\u70c8\u6295\u8bc9\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c1-2\u5468**\uff0c\u9996\u6b21\u72ec\u7acb\u5b8c\u6210\u590d\u6742\u4f5c\u4e1a\u6216\u9996\u6b21\u8bd5\u97f3\u5931\u8d25\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5c0f\u9ca4\u9c7c\u4f60\u597d\u5440\uff01\u770b\u5230\u4f60\u987a\u5229\u52a0\u5165\uff0c\u771f\u5fc3\u4e3a\u4f60\u9ad8\u5174\u3002\u54b1\u4eec\u5f88\u591a\u5b9d\u5988\u540c\u5b66\u90fd\u662f\u4ece\u8fd9\u91cc\u8d77\u6b65\u7684\uff0c\u522b\u62c5\u5fc3\u2018\u8bb0\u4e0d\u4f4f\u2019\uff0c\u54b1\u4eec\u7684\u8bfe\u7a0b\u53ef\u4ee5\u53cd\u590d\u56de\u770b\uff0c\u6bcf\u4e00\u6b65\u90fd\u6709\u8be6\u7ec6\u6307\u5f15\u3002\u4f60\u4e0d\u9700\u8981\u4e00\u4e0b\u5b50\u5168\u5b66\u4f1a\uff0c\u54b1\u4eec\u5c31\u5b9a\u4e2a\u5c0f\u76ee\u6807\uff0c\u6bd4\u5982\u8fd9\u5468\u5148\u641e\u5b9a\u2018\u65c1\u767d\u2019\u8fd9\u4e00\u9879\uff0c\u7a33\u7a33\u5730\u6765\u3002\u6709\u4efb\u4f55\u5361\u4f4f\u7684\u5730\u65b9\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u5e2e\u4f60\u62c6\u89e3\u3002\u8bb0\u4f4f\uff0c\u4f60\u4e0d\u662f\u4e00\u4e2a\u4eba\u5728\u5b66\uff0c\u54b1\u4eec\u4e00\u8d77\u6162\u6162\u628a\u8fd9\u6761\u8def\u8d70\u8e0f\u5b9e\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011** (\u5fc5\u987b\u642d\u914d\u5f3a\u5f15\u5bfc\u548c\u5373\u65f6\u6b63\u53cd\u9988)\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u5305\u542b\uff1a1\uff09\u6bcf\u65e5\u5fae\u4efb\u52a1\u6253\u5361\uff08\u964d\u4f4e\u542f\u52a8\u538b\u529b\uff09\uff1b2\uff09\u4e13\u5c5e\u201c\u9f13\u52b1\u5e08\u201d\u89d2\u8272\uff08\u73ed\u4e3b\u4efb\u9ad8\u9891\u3001\u5177\u4f53\u5316\u7684\u79ef\u6781\u53cd\u9988\uff09\uff1b3\uff09\u64cd\u4f5c\u53ef\u89c6\u5316\u6307\u5f15\uff08\u56fe\u6587/\u89c6\u9891\u6b65\u9aa4\uff0c\u89e3\u51b3\u201c\u8bb0\u4e0d\u4f4f\u201d\u548c\u64cd\u4f5c\u7126\u8651\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7edd\u4e0d\u5bf9\u5979\u4f7f\u7528\u4efb\u4f55\u65bd\u538b\u8bdd\u672f\uff08\u5982\u201c\u522b\u4eba\u90fd\u5b8c\u6210\u4e86\u201d\uff09\uff1b\u7edd\u4e0d\u5728\u524d\u4e24\u5468\u5e03\u7f6e\u9ad8\u96be\u5ea6\u7efc\u5408\u4f5c\u4e1a\uff1b\u7edd\u4e0d\u627f\u8bfa\u5177\u4f53\u53d8\u73b0\u65f6\u95f4\u548c\u91d1\u989d\uff08\u5982\u201c\u5b66\u5b8c\u8fd9\u4e2a\u6708\u5c31\u80fd\u63a5\u5355\u201d\uff09\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5f53\u524d3980\u5143\u8bfe\u7a0b\u5df2\u662f\u98ce\u9669\u4e0a\u9650\uff0c\u540e\u7eed\u4efb\u4f55\u5347\u4ed3\u884c\u4e3a\u90fd\u5c06\u6781\u5927\u63d0\u9ad8\u9000\u8d39\u98ce\u9669\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u56e0\u4e3a\u5b66\u5386\u4e5f\u4e0d\u9ad8\u561b\uff0c\u53ef\u80fd\u8bf4\u50cf\u5728\u8fd9\u4e2a\u5e74\u7eaa\u6709\u4e00\u4efd...\u60f3\u901a\u8fc7\u6709\u58f0\u770b\u80fd\u4e0d\u80fd\u8d5a\u5230\u81ea\u5df1\u60f3\u8981\u7684...\u90a3\u6700\u597d\u8bf4\u80fd\u62ff\u4e2a6000~7000\u54af\u3002\u201d\n2. > \u201c\u53ef\u80fd\u521a\u5f00\u59cb\u5e95\u6c14\u4e0d\u662f\u5f88\u8db3[\u5472\u7259]\u201d\n3. > \u201c\u8bb0\u6027\u4e0d\u662f\u90a3\u4e48\u597d\uff0c\u6709\u65f6\u5019\u4e00\u4e0b\u5b50\u592a\u591a\u8bb0\u4e0d\u4f4f\u3002\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6\u60c5\u7eea\u5de8\u5a74\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\uff08\u7ecf\u6d4e\u4fdd\u969c\u4e0e\u804c\u4e1a\u4ef7\u503c\uff09**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u6781\u81f4\u7684\u624b\u628a\u624b\u966a\u62a4\u4e0e\u5373\u65f6\u60c5\u7eea\u5b89\u629a\uff0c\u5c06\u5b66\u4e60\u8def\u5f84\u62c6\u89e3\u4e3a\u5fae\u6b65\u9aa4\uff0c\u4e25\u9632\u7b2c\u4e00\u6b21\u632b\u8d25\u4f53\u9a8c**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"maslow_need\": \"\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\", \"risk_level\": \"\u6781\u9ad8\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf+\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\"}\n```";
        document.getElementById('content').innerHTML = marked.parse(markdownText);
