    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u4e0e\u98ce\u63a7\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u4e2d\u7b49**\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b\uff08\u5b8c\u6210\u65e9\u529f\u3001\u65c1\u767d\u4f5c\u4e1a\u3001\u8bd5\u97f3\u3001\u53c2\u4e0e\u76f4\u64ad\uff09\uff0c\u5bf9\u6709\u58f0\u884c\u4e1a\u7684\u5177\u4f53\u5de5\u79cd\uff08\u5982\u753b\u672c\uff09\u8868\u73b0\u51fa\u5174\u8da3\u3002\u4f46\u52a8\u673a\u4e2d**\u53d8\u73b0\u9a71\u52a8**\u4e0e**\u6280\u80fd\u5b66\u4e60**\u5e76\u5b58\uff0c\u4e14\u5bf9\u53d8\u73b0\u8def\u5f84\u7684\u8ba4\u77e5\u5c1a\u6d45\uff08\u201c\u90fd\u633a\u611f\u5174\u8da3\u7684\u201d\uff09\uff0c\u5b58\u5728\u4e00\u5b9a\u6a21\u7cca\u6027\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u504f\u4f4e**\u3002\u804a\u5929\u8bb0\u5f55\u4e2d\u900f\u9732\u51fa**\u73af\u5883\u8d44\u6e90\u53d7\u9650**\uff08\u201c\u4e0a\u73ed\u7684\u73af\u5883\u597d\u5435\u201d\u3001\u201c\u5bb6\u91cc\u697c\u4e0a\u6709\u4eba\u5728\u6572\u4e1c\u897f\u597d\u5435\u201d\uff09\uff0c\u53ef\u80fd\u5f71\u54cd\u5b66\u4e60\u4e0e\u5f55\u97f3\u7684\u6301\u7eed\u6027\u3002\u6280\u672f\u64cd\u4f5c\u80fd\u529b\u4e00\u822c\uff08\u591a\u6b21\u8be2\u95ee\u8f6f\u4ef6\u4f7f\u7528\u3001\u6587\u672c\u67e5\u770b\u95ee\u9898\uff09\u3002\u652f\u4ed8\u80fd\u529b\u5df2\u901a\u8fc72380\u5143\u8bfe\u7a0b\u652f\u4ed8\u9a8c\u8bc1\uff0c\u4f46\u672a\u63d0\u53ca\u66f4\u9ad8\u9636\u8bbe\u5907\u6295\u5165\u610f\u613f\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u4e2d\u7b49\u504f\u4e0b**\u3002\u7528\u6237\u5b66\u4e60\u6001\u5ea6\u8ba4\u771f\u3001\u914d\u5408\u5ea6\u9ad8\uff0c\u4f46\u8868\u73b0\u51fa**\u8f83\u5f3a\u7684\u4f9d\u8d56\u6027**\u548c**\u8f83\u4f4e\u7684\u81ea\u4e3b\u51b3\u7b56/\u4fe1\u606f\u5904\u7406\u80fd\u529b**\uff08\u591a\u6b21\u8bf7\u6c42\u9500\u552e\u4ee3\u4e3a\u9009\u62e9\u3001\u64cd\u4f5c\u6307\u5bfc\u3001\u6982\u5ff5\u89e3\u91ca\uff09\u3002\u9762\u5bf9\u5c0f\u632b\u6298\uff08\u5982\u53e3\u6c34\u97f3\u3001\u73af\u5883\u566a\u97f3\uff09\u6709\u53cd\u9988\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u5f3a\u70c8\u632b\u8d25\u611f\uff0c\u5c5e\u4e8e\u88ab\u52a8\u8ddf\u968f\u578b\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u4e8e4\u67088\u65e5\u652f\u4ed82380\u5143\u62a5\u540d\u56db\u4e2a\u6708\u7cfb\u7edf\u8bfe\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u6216\u7b2c\u4e09\u65b9\u51b3\u7b56\u4fe1\u606f\uff0c\u53ef\u521d\u6b65\u5224\u65ad\u4e3a\u4e2a\u4eba\u51b3\u7b56\uff0c\u4f46\u9700\u540e\u7eed\u73ed\u4e3b\u4efb\u6838\u5b9e\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u4e0e\u627f\u8bfa**: \u7528\u6237\u5b8c\u6210\u4e86\u4f53\u9a8c\u8425\u6240\u6709\u4efb\u52a1\uff08\u6668\u7ec3\u3001\u542c\u8bfe\u3001\u4f5c\u4e1a\u3001\u76f4\u64ad\u3001\u8bd5\u97f3\uff09\uff0c\u884c\u52a8\u529b\u7b26\u5408B\u7c7b\uff08\u9ad8\u884c\u52a8\u529b\uff09\u7279\u5f81\u3002\n*   **\u6b65\u9aa42 - \u8d44\u6e90\u4e0e\u6761\u4ef6**: \u73af\u5883\u566a\u97f3\u95ee\u9898\u3001\u5bf9\u57fa\u7840\u64cd\u4f5c\uff08\u5982\u4e0b\u62c9\u6587\u672c\u3001\u8f6f\u4ef6\u4f7f\u7528\uff09\u7684\u56f0\u60d1\uff0c\u663e\u793a\u5176**\u5b66\u4e60\u73af\u5883\u4e0e\u57fa\u7840\u6280\u80fd\u5b58\u5728\u77ed\u677f**\uff0c\u7b26\u5408C\u7c7b\uff08\u8d44\u6e90\u53d7\u9650\uff09\u7279\u5f81\u3002\n*   **\u6b65\u9aa43 - \u5f39\u6027\u4e0e\u98ce\u683c**: \u7528\u6237\u9ad8\u5ea6\u4f9d\u8d56\u9500\u552e\u6307\u5bfc\uff0c\u7f3a\u4e4f\u81ea\u4e3b\u63a2\u7d22\u548c\u51b3\u7b56\u610f\u613f\uff08\u201c\u6211\u4e0d\u61c2\u9009\u201d\u3001\u201c\u5e08\u59d0\u4f60\u4e13\u4e1a\u4e9b\u53ef\u4ee5\u5e2e\u6211\u63a8\u8350\u201d\u3001\u201c\u6211\u4e5f\u4e0d\u77e5\u9053\u81ea\u5df1\u9002\u5408\u8bfb\u4ec0\u4e48\u7c7b\u578b\u7684\u201d\uff09\uff0c\u8868\u73b0\u51fa\u660e\u663e\u7684**\u88ab\u52a8\u8ddf\u968f**\u7279\u5f81\uff0c\u7b26\u5408D\u7c7b\uff08\u4f9d\u8d56\u578b\uff09\u7279\u5f81\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**: **B-C-D\u6df7\u5408\u578b**\u3002\u6838\u5fc3\u77db\u76fe\u5728\u4e8e**\u9ad8\u884c\u52a8\u610f\u613f\u4e0e\u4f4e\u81ea\u4e3b\u80fd\u529b\u3001\u53d7\u9650\u5b66\u4e60\u73af\u5883\u4e4b\u95f4\u7684\u51b2\u7a81**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**: **T4 \u52e4\u594b\u8ddf\u968f\u8005**\u3002\n    *   **\u4f9d\u636e**: \u6267\u884c\u529b\u5f3a\uff08\u6309\u65f6\u5b8c\u6210\u6240\u6709\u4efb\u52a1\uff09\uff0c\u670d\u4ece\u6027\u9ad8\uff08\u5bf9\u9500\u552e\u6307\u4ee4\u79ef\u6781\u54cd\u5e94\u201c\u6536\u5230\u201d\u3001\u201c\u597d\u7684\u201d\uff09\uff0c\u4f46\u81ea\u4e3b\u6027\u5f31\uff0c\u72ec\u7acb\u601d\u8003\u4e0e\u89e3\u51b3\u95ee\u9898\u80fd\u529b\u4e0d\u8db3\uff0c\u9700\u8981\u6301\u7eed\u3001\u7ec6\u81f4\u7684\u5916\u90e8\u5f15\u5bfc\u548c\u51b3\u7b56\u652f\u6301\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669\u7b49\u7ea7**: **\u4e2d**\u3002\n*   **\u9010\u9879\u6392\u67e5**:\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**: **\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u201c\u53d8\u73b0\u201d\u6709\u671f\u5f85\uff0c\u4f46\u81ea\u8eab\u6761\u4ef6\uff08\u73af\u5883\u3001\u57fa\u7840\uff09\u53ef\u80fd\u6210\u4e3a\u4ea7\u51fa\u74f6\u9888\uff0c\u6613\u5728\u540e\u671f\u56e0\u8fdb\u6b65\u7f13\u6162\u6216\u63a5\u5355\u56f0\u96be\u4ea7\u751f\u843d\u5dee\u3002\n    2.  **\u65f6\u95f4\u7cbe\u529b\u51b2\u7a81**: **\u4e2d\u9ad8\u98ce\u9669**\u3002**\u73af\u5883\u566a\u97f3\u95ee\u9898\uff08\u4e0a\u73ed\u3001\u5c45\u5bb6\u5747\u5b58\u5728\uff09\u662f\u663e\u8457\u96f7\u533a**\uff0c\u53ef\u80fd\u6301\u7eed\u5e72\u6270\u5b66\u4e60\u4e0e\u7ec3\u4e60\uff0c\u5bfc\u81f4\u65e0\u6cd5\u575a\u6301\u3002\n    3.  **\u8bfe\u7a0b\u5185\u5bb9\u4e0d\u7b26**: **\u4f4e\u98ce\u9669**\u3002\u7528\u6237\u5df2\u521d\u6b65\u63a5\u89e6\u8bfe\u7a0b\u5185\u5bb9\u5e76\u5b8c\u6210\u4f5c\u4e1a\uff0c\u672a\u63d0\u51fa\u5185\u5bb9\u8d28\u7591\u3002\n    4.  **\u670d\u52a1\u8d28\u91cf\u4e0d\u6ee1**: **\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u5bf9\u9500\u552e\u670d\u52a1\u53cd\u9988\u79ef\u6781\u3002\n    5.  **\u7ecf\u6d4e\u538b\u529b**: **\u4f4e\u98ce\u9669**\u3002\u5df2\u652f\u4ed8\uff0c\u672a\u63d0\u53ca\u538b\u529b\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u9700\u540e\u7eed\u6838\u67e5\u3002\n    7.  **\u7ade\u54c1\u6bd4\u8f83/\u51b2\u52a8\u6d88\u8d39**: **\u4f4e\u98ce\u9669**\u3002\u51b3\u7b56\u8fc7\u7a0b\u8ddf\u968f\u9500\u552e\u8282\u594f\uff0c\u672a\u4f53\u73b0\u6bd4\u8f83\u884c\u4e3a\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u9500\u552e\u884c\u4e3a**: \u5b58\u5728**\u8fc7\u5ea6\u627f\u8bfa\u503e\u5411**\uff08\u201c\u6211\u5bf9\u4f60\u8fd8\u662f\u86ee\u6709\u4fe1\u5fc3\u7684\u201d\u3001\u201c\u770b\u597d\u4f60\u5462\u201d\u3001\u201c\u4f18\u5148\u5165\u5267\u7ec4\u7fa4\u6743\u9650\u201d\uff09\uff0c\u53ef\u80fd\u62d4\u9ad8\u7528\u6237\u9884\u671f\u3002\u4f46\u6574\u4f53\u670d\u52a1\u7ec6\u81f4\uff0c\u672a\u53d1\u73b0\u6b3a\u8bc8\u3001\u6050\u5413\u7b49\u7ea2\u7ebf\u95ee\u9898\u3002\n*   **\u7528\u6237\u77e5\u60c5\u6743**: \u7528\u6237\u5bf9\u8bfe\u7a0b\u7ed3\u6784\uff084\u4e2a\u6708 vs 8\u5468\uff09\u4ea7\u751f\u8fc7\u77ed\u6682\u56f0\u60d1\uff0c\u7ecf\u89e3\u91ca\u540e\u7406\u89e3\u3002\u9500\u552e\u5df2\u53d1\u9001\u5165\u5b66\u987b\u77e5\uff0c\u57fa\u672c\u5408\u89c4\u3002\n*   **\u4e3b\u8981\u98ce\u9669\u70b9**: \u9500\u552e\u901a\u8fc7\u201c\u8d44\u6e90\u503e\u659c\u201d\u3001\u201c\u770b\u597d\u4f60\u201d\u7b49\u8bdd\u672f\u5efa\u7acb\u4e86\u8f83\u5f3a\u7684\u60c5\u611f\u7ed1\u5b9a\u548c\u9884\u671f\uff0c**\u9700\u9632\u8303\u540e\u671f\u56e0\u7528\u6237\u4e2a\u4eba\u6761\u4ef6\u9650\u5236\u65e0\u6cd5\u5151\u73b0\u201c\u770b\u597d\u201d\u627f\u8bfa\u800c\u5f15\u53d1\u7684\u5931\u671b\u60c5\u7eea**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**: **\u5339\u914d**\u3002\u7cfb\u7edf\u8bfe\u7684\u7ed3\u6784\u5316\u6559\u5b66\u4e0e\u6301\u7eed\u8f85\u5bfc\u9002\u5408\u8be5\u4f9d\u8d56\u578b\u3001\u9700\u5f15\u5bfc\u7684\u7528\u6237\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **\u9996\u5468\u91cd\u70b9\u652f\u6301\u4e0e\u9884\u671f\u7ba1\u7406**\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**:\n    1.  **\u9884\u671f\u6821\u6b63\uff08\u5173\u952e\uff09**: \u9996\u6b21\u6c9f\u901a\u9700\u6e29\u548c\u4f46\u660e\u786e\u5730\u7ba1\u7406\u5176\u53d8\u73b0\u9884\u671f\uff0c\u5f3a\u8c03\u6280\u80fd\u79ef\u7d2f\u7684\u957f\u671f\u6027\uff0c\u5c06\u7126\u70b9\u4ece\u201c\u5feb\u901f\u63a5\u5355\u201d\u5f15\u5bfc\u81f3\u201c\u624e\u5b9e\u5b66\u4e60\u201d\u3002\n    2.  **\u73af\u5883\u7834\u5c40\u652f\u6301**: \u4e3b\u52a8\u8be2\u95ee\u5176\u5f55\u97f3\u73af\u5883\uff0c\u63d0\u4f9b**\u4f4e\u6210\u672c\u964d\u566a\u65b9\u6848**\uff08\u5982\u5f55\u97f3\u65f6\u95f4\u5efa\u8bae\u3001\u7b80\u6613\u9694\u97f3\u6280\u5de7\uff09\uff0c\u5e2e\u52a9\u5176\u514b\u670d\u6700\u5927\u73b0\u5b9e\u969c\u788d\u3002\n    3.  **\u5f3a\u5316\u624b\u628a\u624b\u6307\u5bfc**: \u8be5\u7528\u6237\u9700\u8981\u201c\u5582\u5230\u5634\u8fb9\u201d\u5f0f\u7684\u6307\u5bfc\u3002\u521d\u671f\u5e94\u63d0\u4f9b\u6781\u5176\u6e05\u6670\u3001\u6b65\u9aa4\u5316\u7684\u64cd\u4f5c\u6307\u5357\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u3001\u8bfe\u7a0b\u67e5\u770b\u3001\u4f5c\u4e1a\u63d0\u4ea4\uff09\uff0c\u5e76\u4e3b\u52a8\u3001\u5b9a\u671f\u8ddf\u8fdb\u5176\u7406\u89e3\u60c5\u51b5\u3002\n    4.  **\u5efa\u7acb\u5fae\u5c0f\u6b63\u53cd\u9988**: \u5bf9\u5176\u4efb\u4f55\u5fae\u5c0f\u8fdb\u6b65\u7ed9\u4e88\u53ca\u65f6\u3001\u5177\u4f53\u7684\u8868\u626c\uff0c\u5de9\u56fa\u5176\u5b66\u4e60\u52a8\u529b\uff0c\u5bf9\u6297\u53ef\u80fd\u56e0\u73af\u5883\u6216\u8fdb\u5ea6\u5e26\u6765\u7684\u632b\u8d25\u611f\u3002\n    5.  **\u51b3\u7b56\u652f\u6301**: \u5728\u5982\u9009\u4e66\u3001\u9009\u62e9\u7ec3\u4e60\u65b9\u5411\u65f6\uff0c\u63d0\u4f9b\u6709\u9650\u7684\u3001\u660e\u786e\u7684\u9009\u9879\uff08A\u6216B\uff09\uff0c\u8f85\u52a9\u5176\u505a\u51fa\u9009\u62e9\uff0c\u51cf\u5c11\u5176\u56e0\u8ff7\u832b\u800c\u4ea7\u751f\u7684\u7126\u8651\u3002\n\n{\"core_type\": \"T4 \u52e4\u594b\u8ddf\u968f\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u9996\u5468\u91cd\u70b9\u652f\u6301\u4e0e\u9884\u671f\u7ba1\u7406\"}";
