    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a676970014 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u98ce\u542c\u96e82(\u738b\u6656) / \u7eb8\u7cca\u7684\u6bcd\u8001\u864e(\u738b\u6656) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u5199\u4f5c\u8bfe\u7a0b\uff08\u610f\u54114\u4e2a\u6708\u65d7\u8230\u73ed\uff0c4380\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3**\uff08\u201c\u80cc\u4e86\u4e00\u5c41\u80a1\u503a\u4e86\uff0c\u5230\u5904\u662f\u6f0f\u6d1e\uff0c\u5de5\u8d44\u4e5f\u6307\u4e0d\u4e0a\u201d\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u591c\u73ed\u5de5\u4f5c\u5236\uff0c\u767d\u5929\u9700\u7761\u89c9\uff0c\u65f6\u95f4\u6781\u5ea6\u7d27\u5f20\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u672a\u77e5**\uff08\u4fe1\u606f\u7f3a\u5931\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u2b06\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u53d8\u73b0\u53cc\u91cd\u9a71\u52a8\u800c\u6765\u3002\u65e2\u6709\u5f3a\u70c8\u7684\u77ed\u671f\u53d8\u73b0\u8bc9\u6c42\uff08\u201c\u73b0\u5728\u5c31\u8981\u4e2a\u7a33\u5b9a\u4e1a\u4f59\u80fd\u8d5a\u4e2a4000\u52305000\u201d\uff09\uff0c\u4e5f\u5c55\u73b0\u51fa\u5bf9AI\u6280\u672f\u539f\u7406\u7684\u6df1\u5ea6\u63a2\u7d22\u6b32\uff08\u8ffd\u95eeAI\u5b66\u4e60\u98ce\u683c\u3001\u8c03\u6559AI\u5199\u6b4c\u8bcd\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u89c9\u7684\u5bf9\u6211\u5e2e\u52a9\u6700\u5927\u7684\u4e0d\u662f\u5b66\u5230\u4ec0\u4e48\uff0c\u662f\u627e\u5230\u4ec0\u4e48\uff0c\u4e5f\u5c31\u662f\u5e73\u53f0\u7532\u65b9\u201d\uff1b > \u201c\u4f60\u89c9\u5f97\u6211\u4ec0\u4e48\u65f6\u5019\u80fd\u89c1\u56de\u5934\u94b1\u201d\uff1b > \u201c\u6b4c\u8bcd\u6211\u90fd\u5b9e\u73b0\u8eba\u5e73\u4e86\uff0cai\u88ab\u6211\u8c03\u6559\u7684\uff0c\u5199\u7684\u6bd4\u6211\u8fd8\u50cf\u6211\u201d\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 **\u8d44\u91d1\u627f\u8f7d\u529b\uff1a\u4f4e** \u2014 \u660e\u786e\u8868\u793a\u201c\u80cc\u4e86\u4e00\u5c41\u80a1\u503a\u201d\uff0c\u4e3b\u4e1a\u6708\u85aa\u201c2800\u4e0d\u5230\u201d\uff0c\u5b58\u5728\u4e25\u91cd\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 **\u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a\u4f4e** \u2014 \u957f\u671f\u591c\u73ed\uff0c\u767d\u5929\u9700\u8981\u8865\u89c9\uff0c\u5b66\u4e60\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\u4e14\u4e0d\u89c4\u5f8b\uff08\u201c\u540e\u534a\u591c\u5077\u7761\u89c9\u4e86\u201d\u3001\u201c11\u70b9\u624d\u4e0b\u73ed\uff0c\u56de\u6765\u5750\u7740\u7761\u7740\u4e86\u201d\uff09\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 **\u5bb6\u5ead\u652f\u6301\u5ea6\uff1a\u672a\u77e5** \u2014 \u4fe1\u606f\u7f3a\u5931\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u27a1\u4e2d**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a**\u3002\u80fd\u81ea\u6211\u8c03\u4f83\uff08\u201c\u80d6\u662f\u501f\u53e3\u201d\uff09\uff0c\u9762\u5bf9\u9500\u552e\u7684\u538b\u529b\uff08\u201c\u4f60\u8fd8\u6ca1\u62a5\u540d\u54c8\uff0c\u901f\u5ea6\u201d\uff09\u80fd\u4fdd\u6301\u6c9f\u901a\uff0c\u672a\u51fa\u73b0\u5d29\u6e83\u6216\u6781\u7aef\u8d1f\u9762\u60c5\u7eea\u3002\u4f46\u900f\u9732\u51fa\u56e0\u5e74\u9f84\u3001\u8eab\u6750\u5bfc\u81f4\u7684\u804c\u4e1a\u632b\u8d25\u611f\uff0c\u6709\u4e00\u5b9a\u81ea\u5351\u60c5\u7eea\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u662f\u56e0\u4e3a\u80d6\u5931\u4e1a\u7684\uff0c\u4f46\u4e0d\u662f\u6211\u7279\u522b\u80d6\u201d\uff1b > \u201c\u73b0\u5728\u884c\u4e1a\uff0c\u4e0d\u8981\u80fd\u5e72\u7684\uff0c\u8981\u5e74\u8f7b\u7684\uff0c\u7ecf\u5e38\u6362\u4eba\u201d\uff1b > \u201cai\u7ed9\u7684\u6211\u90fd\u4e0d\u6ee1\u610f\uff0c\u53c8\u6ca1\u529f\u592b\u6162\u6162\u641e\uff0c\u5c31\u5e94\u4ed8\u5e94\u4ed8\u5148\u51fa\u4e2a\u201d\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e2d\u5e74\u804c\u4e1a\u5371\u673a\u4e0e\u751f\u5b58\u7126\u8651**\u3002\u4e3b\u4e1a\u6536\u5165\u4f4e\u5fae\uff08<2800\u5143\uff09\uff0c\u56e0\u5e74\u9f84\u548c\u8eab\u6750\u88ab\u804c\u573a\u8fb9\u7f18\u5316\uff0c\u80cc\u8d1f\u503a\u52a1\uff0c\u6025\u9700\u4e00\u4e2a\u4e0d\u53d7\u5e74\u9f84\u3001\u4f53\u529b\u9650\u5236\u7684\u7a33\u5b9a\u526f\u4e1a\u6536\u5165\u6765\u586b\u8865\u201c\u6f0f\u6d1e\u201d\uff0c\u4fdd\u969c\u57fa\u672c\u751f\u6d3b\u5b89\u5168\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u63d0\u4f9b\u4e00\u6761\u6e05\u6670\u3001\u53ef\u9884\u671f\u3001\u80fd\u5feb\u901f\u4ea7\u751f\u73b0\u91d1\u6d41\u7684\u201c\u6551\u547d\u7a3b\u8349\u201d**\u3002\u4ed6\u9700\u8981\u7684\u4e0d\u4ec5\u662f\u6280\u80fd\uff0c\u66f4\u662f\u4e00\u4e2a\u80fd\u5bf9\u6297\u73b0\u5b9e\u4e0d\u786e\u5b9a\u6027\u7684\u3001\u6709\u660e\u786e\u8def\u5f84\u7684\u201c\u4fdd\u969c\u65b9\u6848\u201d\u3002\u540c\u65f6\uff0c\u9700\u8981\u7ed9\u4e88\u5176\u6280\u672f\u80fd\u529b\u4e0a\u7684\u8ba4\u53ef\uff08\u5982\u5bf9\u5176AI\u8c03\u6559\u80fd\u529b\u7684\u80af\u5b9a\uff09\uff0c\u4ee5\u5bf9\u51b2\u5176\u56e0\u5e74\u9f84\u3001\u5916\u8c8c\u4ea7\u751f\u7684\u81ea\u5351\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u8bba** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 **\u5b89\u5168\u672a\u89e6\u53d1** / \ud83d\udd34\u5df2\u89e6\u53d1 D \u7c7b\u7194\u65ad\u7ea2\u7ebf\uff01\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u7528\u6237\u660e\u786e\u63d0\u53ca\u201c\u80cc\u4e86\u4e00\u5c41\u80a1\u503a\u201d\uff0c\u4f46**\u672a\u76f4\u63a5\u8868\u660e\u4f7f\u7528\u7f51\u8d37\u62a5\u540d**\uff0c\u4e14\u672a\u51fa\u73b0\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\u3002\u6839\u636e\u5224\u5b9a\u6811\u89c4\u5219\uff0c\u6682\u672a\u8fbe\u5230T8-D\uff08\u7edd\u8def\u8d4c\u5f92\uff09\u7684\u89e6\u53d1\u7ea2\u7ebf\u3002**\u4f46\u5df2\u5904\u4e8eC2\u98ce\u9669\u533a\u7684\u6700\u9ad8\u8b66\u6212\u7ebf\u3002**\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u7ecf\u6d4e\u538b\u529b\u5927\uff0c\u82e5\u5bb6\u4eba\u53cd\u5bf9\u6216\u53d1\u73b0\u5176\u501f\u8d37\u5b66\u4e60\uff0c\u6781\u6613\u5f15\u53d1\u51b2\u7a81\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u591c\u73ed\u5de5\u4f5c\u5236\u5bfc\u81f4\u65e0\u6cd5\u89c4\u5f8b\u5b66\u4e60**\uff0c\u4f5c\u4e1a\u79ef\u538b\u3001\u8ddf\u4e0d\u4e0a\u76f4\u64ad\uff0c\u4ea7\u751f\u201c\u94b1\u767d\u82b1\u4e86\u201d\u7684\u632b\u8d25\u611f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4e2d** | \u5bf9AI\u5199\u4f5c\u62b1\u6709\u8f83\u9ad8\u671f\u5f85\uff08\u201c\u8eba\u5e73\u201d\uff09\uff0c\u82e5\u521d\u671f\u6295\u7a3f\u5c61\u5c61\u88ab\u62d2\uff0c\u6216\u53d1\u73b0\u53d8\u73b0\u901f\u5ea6\u8fdc\u4f4e\u4e8e\u9884\u671f\uff08\u201c3-4\u5468\u6295\u7a3f\u201d\uff09\uff0c\u81ea\u5c0a\u5fc3\u53d7\u632b\u53e0\u52a0\u7ecf\u6d4e\u538b\u529b\uff0c\u53ef\u80fd\u77ac\u95f4\u653e\u5f03\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u201c\u5feb\u901f\u8d5a\u94b1\u201d\uff08\u6708\u51654-5k\uff09\u6709\u660e\u786e\u3001\u6025\u8feb\u7684\u671f\u671b\u3002\u82e5\u5f00\u8bfe1-2\u4e2a\u6708\u5185\u672a\u80fd\u89c1\u5230\u4efb\u4f55\u6536\u5165\u8ff9\u8c61\uff0c\u6781\u6709\u53ef\u80fd\u56e0\u201c\u6536\u76ca\u843d\u5dee\u201d\u800c\u5f3a\u70c8\u8981\u6c42\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c4-8\u5468**\u3002\u6b64\u65f6\u82e5\u672a\u80fd\u5b8c\u6210\u7b2c\u4e00\u6b21\u6709\u6548\u6295\u7a3f\u6216\u83b7\u5f97\u4efb\u4f55\u5fae\u5c0f\u6b63\u53cd\u9988\uff0c\u53e0\u52a0\u591c\u73ed\u5bfc\u81f4\u7684\u75b2\u60eb\u4e0e\u8bfe\u7a0b\u79ef\u538b\uff0c\u9000\u8d39\u610f\u613f\u5c06\u8fbe\u5230\u5cf0\u503c\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5144\u5f1f\uff0c\u770b\u5230\u4f60\u4e0a\u591c\u73ed\u8fd8\u8fd9\u4e48\u62fc\uff0c\u771f\u5fc3\u4f69\u670d\u3002\u54b1\u4eec\u8fd9\u884c\u4e0d\u770b\u5e74\u7eaa\u4e0d\u770b\u8eab\u6750\uff0c\u5c31\u770b\u4f60\u8ddfAI\u2018\u5bf9\u7ebf\u2019\u7684\u529f\u592b\u3002\u4f60\u5df2\u7ecf\u6709\u8c03\u6559AI\u5199\u6b4c\u7684\u672c\u4e8b\u4e86\uff0c\u5e95\u5b50\u6bd4\u5f88\u591a\u4eba\u90fd\u5f3a\u3002\u63a5\u4e0b\u6765\u54b1\u4eec\u4e0d\u641e\u865a\u7684\uff0c\u5c31\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u6211\u5e2e\u4f60\u76ef\u7740\uff0c\u600e\u4e48\u7528\u6700\u77ed\u8def\u5f84\u628a\u8fd9\u4efd\u672c\u4e8b\u6362\u6210\u771f\u91d1\u767d\u94f6\uff0c\u5148\u628a\u773c\u524d\u7684\u751f\u6d3b\u7a9f\u7abf\u5835\u4e0a\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5feb\u901f\u63a5\u5355\u7ebf**\u3011\u5fc5\u987b\uff01\u6838\u5fc3\u662f\u201c\u5806\u91cf\u51fa\u5355\u201d\uff0c\u524d\u671f\u4e0d\u6c42\u8d28\u91cf\uff0c\u53ea\u6c42\u5feb\u901f\u5efa\u7acb\u201c\u6295\u7a3f-\u8fc7\u7a3f-\u6536\u6b3e\u201d\u7684\u6700\u5c0f\u6b63\u5faa\u73af\uff0c\u7f13\u89e3\u5176\u751f\u5b58\u7126\u8651\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u5df2\u6709AI\u4f7f\u7528\u7ecf\u9a8c\uff0c\u8865\u5145\u3010**\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743**\u3011\uff08B\u6a21\u5757\uff09\uff0c\u8ba4\u53ef\u5e76\u5229\u7528\u5176\u6280\u672f\u63a2\u7d22\u80fd\u529b\uff0c\u5c06\u5176\u4ece\u201c\u88ab\u52a8\u5b66\u4e60\u8005\u201d\u8f6c\u5316\u4e3a\u201c\u5171\u540c\u7814\u7a76\u8005\u201d\uff0c\u63d0\u5347\u7c98\u6027\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u753b\u4e0d\u5207\u5b9e\u9645\u7684\u5927\u997c**\uff08\u5982\u201c\u5b66\u5b8c\u5c31\u6708\u5165\u8fc7\u4e07\u201d\uff09\uff1b2. **\u7528\u4e25\u683c\u7684\u8003\u52e4\u7eaa\u5f8b\u65bd\u538b**\uff08\u5176\u65f6\u95f4\u65e0\u6cd5\u4fdd\u8bc1\uff09\uff1b3. **\u5ffd\u89c6\u5176\u7ecf\u6d4e\u538b\u529b**\uff0c\u76f2\u76ee\u63a8\u9500\u66f4\u9ad8\u9636\u8bfe\u7a0b\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5347\u5355**\uff01\u5728\u5b9e\u73b0\u7a33\u5b9a\u5c0f\u989d\u53d8\u73b0\uff08\u5982\u6708\u51651000-2000\u5143\uff09\u5e76\u507f\u8fd8\u90e8\u5206\u503a\u52a1\u524d\uff0c\u7981\u6b62\u63a8\u8350\u4efb\u4f55\u9644\u52a0\u8bfe\u7a0b\u6216\u9ad8\u4ef7\u8bbe\u5907\u3002\u9996\u8981\u76ee\u6807\u662f\u5e2e\u52a9\u5176\u201c\u6d3b\u4e0b\u6765\u201d\uff0c\u5efa\u7acb\u4fe1\u4efb\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u73b0\u5728\u80cc\u4e86\u4e00\u5c41\u80a1\u503a\u4e86\uff0c\u5230\u5904\u662f\u6f0f\u6d1e\uff0c\u5de5\u8d44\u4e5f\u6307\u4e0d\u4e0a**\u201d\n2. > \u201c**\u6211\u73b0\u5728\u5c31\u8981\u4e2a\u7a33\u5b9a\u4e1a\u4f59\u80fd\u8d5a\u4e2a4000\u52305000\uff0c\u73b0\u91d1\u6d41\u5165\u8d26\uff0c\u6211\u5c31\u6ee1\u610f\u4e86**\u201d\n3. > \u201c**\u6211\u662f\u56e0\u4e3a\u80d6\u5931\u4e1a\u7684...\u73b0\u5728\u884c\u4e1a\uff0c\u4e0d\u8981\u80fd\u5e72\u7684\uff0c\u8981\u5e74\u8f7b\u7684\uff0c\u7ecf\u5e38\u6362\u4eba**\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4 \u641e\u94b1\u7ed3\u679c\u8bba\uff08\u9ad8\u538b\u751f\u5b58\u53d8\u79cd\uff09\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\uff08\u5bf9\u6297\u4e2d\u5e74\u5931\u4e1a\u4e0e\u503a\u52a1\u5371\u673a\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u542f\u52a8\u9006\u5411\u9884\u671f\u7ba1\u7406 + \u63d0\u4f9b\u201c\u5806\u91cf\u5feb\u8dd1\u201d\u7684\u4fdd\u59c6\u7ea7\u63a5\u5355\u8def\u5f84\uff0c\u7528\u6700\u5feb\u901f\u5ea6\u5e2e\u4ed6\u5b9e\u73b0\u7b2c\u4e00\u7b14\u5c0f\u989d\u6536\u5165\uff0c\u5efa\u7acb\u751f\u5b58\u4fe1\u5fc3\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u8bba\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf\", \"age\": \"\u672a\u77e5\uff08\u63a8\u6d4b30\u5c81\u4ee5\u4e0a\uff09\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
