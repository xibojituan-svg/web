    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n## \u4fe1\u606f\u5145\u8db3\u6027\u8bc4\u4f30\n\u4fe1\u606f\u5145\u8db3\uff0c\u53ef\u8fdb\u884c\u6709\u6548\u5206\u6790\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u4e2d\u7b49**\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u201c\u753b\u672c\u201d\uff08\u7ed8\u672c/\u513f\u7ae5\u6545\u4e8b\uff09\u548c\u201c\u77ed\u89c6\u9891\u201d\u7684\u5174\u8da3\uff0c\u6709\u5177\u4f53\u504f\u597d\u3002\u4f46\u52a8\u673a\u504f\u5411\u5174\u8da3\u63a2\u7d22\u548c\u517c\u804c\u5c1d\u8bd5\uff0c\u5bf9\u957f\u671f\u6295\u5165\u3001\u804c\u4e1a\u8f6c\u578b\u7684\u6df1\u5ea6\u9700\u6c42\u672a\u660e\u786e\u8868\u8fbe\u3002\u5bf9\u201c\u5b9a\u5411\u6d3e\u5355\u201d\u7b49\u5177\u4f53\u53d8\u73b0\u6a21\u5f0f\u8868\u793a\u201c\u4e0d\u592a\u61c2\u201d\uff0c\u5b66\u4e60\u52a8\u673a\u4e0e\u660e\u786e\u53d8\u73b0\u8def\u5f84\u7684\u94fe\u63a5\u5c1a\u4e0d\u7d27\u5bc6\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u4f4e/\u672a\u77e5**\u3002\u8bb0\u5f55\u4e2d\u672a\u900f\u9732\u4efb\u4f55\u4e2a\u4eba\u7ecf\u6d4e\u72b6\u51b5\u3001\u804c\u4e1a\u3001\u65f6\u95f4\u81ea\u7531\u5ea6\u7b49\u4fe1\u606f\u3002\u4ec5\u80fd\u63a8\u65ad\u5176\u62e5\u6709\u5b8c\u6210\u8bd5\u97f3\u3001AI\u4f5c\u56fe\u7b49\u57fa\u7840\u4efb\u52a1\u6240\u9700\u7684\u624b\u673a/\u7535\u8111\u8bbe\u5907\u53ca\u96f6\u6563\u65f6\u95f4\u3002**\u5173\u952e\u8d44\u6e90\u7ef4\u5ea6\uff08\u652f\u4ed8\u80fd\u529b\u3001\u7a33\u5b9a\u5b66\u4e60\u65f6\u95f4\uff09\u4e25\u91cd\u7f3a\u5931**\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u4e2d\u7b49\u504f\u9ad8**\u3002\u7528\u6237\u914d\u5408\u5ea6\u9ad8\uff0c\u80fd\u6309\u65f6\u63d0\u4ea4\u4f5c\u4e1a\uff08\u65c1\u767d\u5f55\u97f3\u3001AI\u89c6\u9891\uff09\u3001\u53c2\u4e0e\u76f4\u64ad\u3001\u56de\u590d\u9500\u552e\u3002\u9762\u5bf9\u201c\u4e0d\u592a\u61c2\u201d\u7684\u5185\u5bb9\uff08\u5982\u76f4\u64ad\u3001\u5b9a\u5411\u6d3e\u5355\uff09\u4f1a\u4e3b\u52a8\u63d0\u51fa\uff0c\u5e76\u5728\u6307\u5bfc\u4e0b\u5c1d\u8bd5\uff08\u201c\u91cd\u65b0\u542c\u4e00\u904d\u56de\u653e\u201d\uff09\u3002\u5bf9AI\u89c6\u9891\u751f\u6210\u6548\u679c\u4e0d\u4f73\uff08\u201c\u4e0d\u9ad8\u201d\uff09\u80fd\u5ba2\u89c2\u53cd\u9988\uff0c\u672a\u8868\u73b0\u51fa\u660e\u663e\u632b\u8d25\u6216\u653e\u5f03\u60c5\u7eea\uff0c\u5177\u5907\u57fa\u7840\u7684\u5b66\u4e60\u97e7\u6027\u548c\u884c\u52a8\u529b\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u672a\u53d1\u751f\u652f\u4ed8\u884c\u4e3a\u3002\u7528\u6237\u4ec5\u56de\u590d\u4e86\u8bfe\u7a0b\u4ef7\u683c\u201c2980\u201d\uff0c\u4f46\u65e0\u652f\u4ed8\u52a8\u4f5c\u6216\u660e\u786e\u652f\u4ed8\u610f\u5411\u8868\u8fbe\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u65e0\u6cd5\u5224\u65ad\u3002\u8bb0\u5f55\u4e2d\u65e0\u4efb\u4f55\u6d89\u53ca\u5bb6\u5ead\u3001\u914d\u5076\u6216\u5171\u540c\u51b3\u7b56\u7684\u4fe1\u606f\u3002\n*   **\u6b65\u9aa41\uff1a\u9700\u6c42\u771f\u5b9e\u6027 (A/B)**\uff1a**B\u7c7b\uff08\u89c2\u671b\u4f53\u9a8c\u578b\uff09**\u3002\u7528\u6237\u884c\u4e3a\u7b26\u5408\u5178\u578b\u4f53\u9a8c\u8bfe\u53c2\u4e0e\u8def\u5f84\uff1a\u5b8c\u6210\u4f5c\u4e1a\u3001\u8ddf\u76f4\u64ad\u3001\u9886\u8d44\u6599\u3002\u5174\u8da3\u70b9\u5177\u4f53\uff08\u753b\u672c\u3001\u77ed\u89c6\u9891\uff09\uff0c\u4f46\u505c\u7559\u5728\u201c\u611f\u5174\u8da3\u201d\u5c42\u9762\uff0c\u672a\u5c55\u73b0\u51fa\u4e3a\u660e\u786e\u804c\u4e1a\u76ee\u6807\u4ed8\u8d39\u7684\u5f3a\u70c8\u51b3\u5fc3\u3002\n*   **\u6b65\u9aa42\uff1a\u51b3\u7b56\u80fd\u529b (C/D)**\uff1a**D\u7c7b\uff08\u4f4e\u81ea\u4e3b\u51b3\u7b56\u578b\uff09**\u3002\u7528\u6237\u5168\u7a0b\u5904\u4e8e\u88ab\u52a8\u54cd\u5e94\u72b6\u6001\uff0c\u5bf9\u8bdd\u7531\u9500\u552e\u4e3b\u5bfc\u3002\u5bf9\u4e8e\u201c\u66f4\u559c\u6b22\u54ea\u4e2a\u8d5b\u9053\u201d\u3001\u201c\u5bf9\u6b63\u5f0f\u5b66\u4e60\u5176\u4ed6\u9700\u8981\u89c4\u5212\u201d\u7b49\u5173\u952e\u51b3\u7b56\u95ee\u9898\uff0c\u56de\u7b54\u6781\u5176\u7b80\u77ed\uff08\u201c\u753b\u672c\u201d\u3001\u201c\u77ed\u89c6\u9891\u201d\u3001\u201c\u55ef\u201d\uff09\uff0c\u7f3a\u4e4f\u4e3b\u52a8\u63d0\u95ee\u548c\u6df1\u5ea6\u63a2\u8ba8\u3002**\u51b3\u7b56\u4f9d\u8d56\u5916\u90e8\u5f15\u5bfc\uff0c\u81ea\u4e3b\u6027\u5f31**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n**T4 \u8ff7\u832b\u63a2\u7d22\u578b**\n*   **\u7279\u5f81\u543b\u5408**\uff1a\u6709\u6a21\u7cca\u5174\u8da3\u65b9\u5411\uff08\u753b\u672c\u3001\u77ed\u89c6\u9891\uff09\uff0c\u613f\u610f\u5c1d\u8bd5\u548c\u5b8c\u6210\u57fa\u7840\u4efb\u52a1\uff0c\u4f46\u5bf9\u884c\u4e1a\u8ba4\u77e5\u6d45\u3001\u53d8\u73b0\u8def\u5f84\u6a21\u7cca\uff08\u201c\u4e0d\u592a\u61c2\u201d\uff09\uff0c\u7f3a\u4e4f\u6e05\u6670\u7684\u81ea\u6211\u89c4\u5212\u548c\u51b3\u7b56\u529b\u3002\u884c\u4e3a\u6a21\u5f0f\u4e3a\u201c\u8ddf\u968f\u5f0f\u201d\u5b66\u4e60\uff0c\u9700\u8981\u6301\u7eed\u7684\u5916\u90e8\u4efb\u52a1\u9a71\u52a8\u548c\u660e\u786e\u6307\u5f15\u3002\n*   **\u504f\u79bb\u70b9**\uff1a\u672a\u8868\u73b0\u51faT4\u5e38\u6709\u7684\u7126\u8651\u6216\u6025\u5207\u60c5\u7eea\uff0c\u5fc3\u6001\u76f8\u5bf9\u5e73\u7a33\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669\u7b49\u7ea7\uff1a\u4e2d**\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5bf9AI\u89c6\u9891\u751f\u6210\u6548\u679c\u5df2\u8868\u793a\u201c\u4e0d\u9ad8\u201d\uff0c\u82e5\u6b63\u5f0f\u8bfe\u5b66\u4e60\u540e\u5b9e\u64cd\u6548\u679c\u4ecd\u4e0d\u7406\u60f3\uff0c\u6613\u5f15\u53d1\u5931\u671b\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u672a\u77e5\u98ce\u9669**\u3002\u8d44\u6e90\u5e95\u5ea7\u4fe1\u606f\u7f3a\u5931\uff0c\u652f\u4ed8\u80fd\u529b\u4e0d\u660e\u3002\u82e5\u7528\u6237\u7ecf\u6d4e\u72b6\u51b5\u4e00\u822c\uff0c\u652f\u4ed8\u540e\u53ef\u80fd\u4ea7\u751f\u538b\u529b\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u80fd\u8ddf\u76f4\u64ad\u3001\u4ea4\u4f5c\u4e1a\uff0c\u4f46\u672a\u8bf4\u660e\u65f6\u95f4\u81ea\u7531\u5ea6\u3002\u6b63\u5f0f\u8bfe\u9700\u6301\u7eed\u6295\u5165\uff0c\u53ef\u80fd\u56e0\u65f6\u95f4\u4e0d\u8db3\u5bfc\u81f4\u5b66\u4e60\u4e2d\u65ad\u3002\n    4.  **\u8bfe\u7a0b\u5185\u5bb9\u4e0d\u7b26**\uff1a**\u4f4e\u98ce\u9669**\u3002\u5174\u8da3\u70b9\uff08\u753b\u672c\u3001\u77ed\u89c6\u9891\uff09\u4e0e\u8bfe\u7a0b\u63a8\u5e7f\u65b9\u5411\u5339\u914d\u3002\n    5.  **\u9500\u552e\u627f\u8bfa\u672a\u5151\u73b0**\uff1a**\u4e2d\u98ce\u9669**\u3002\u9500\u552e\u63d0\u53ca\u201c\u767e\u5206\u767e\u6536\u7a3f\u201d\u3001\u201c\u5b9a\u5411\u6d3e\u5355\u201d\u3001\u201c\u7b2c\u4e8c\u5468\u63a5\u5355\u201d\u7b49\u627f\u8bfa\uff0c\u82e5\u540e\u671f\u65e0\u6cd5\u5151\u73b0\u6216\u4e0e\u7528\u6237\u7406\u89e3\u6709\u504f\u5dee\uff0c\u6613\u4ea7\u751f\u7ea0\u7eb7\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u672a\u77e5\u98ce\u9669**\u3002\u51b3\u7b56\u6743\u4fe1\u606f\u7f3a\u5931\u3002\n    7.  **\u7ade\u54c1\u6bd4\u8f83/\u51b2\u52a8\u6d88\u8d39\u540e\u6094**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u51b3\u7b56\u504f\u88ab\u52a8\uff0c\u82e5\u540e\u7eed\u63a5\u89e6\u5176\u4ed6\u4fe1\u606f\u6216\u51b7\u9759\u540e\uff0c\u53ef\u80fd\u540e\u6094\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5408\u89c4\u70b9**\uff1a\u9500\u552e\u6d41\u7a0b\u5b8c\u6574\uff0c\u63d0\u4f9b\u4e86\u8bd5\u97f3\u673a\u4f1a\u3001\u4f5c\u4e1a\u70b9\u8bc4\u3001\u8d44\u6599\u5206\u4eab\uff0c\u5f3a\u8c03\u4e86\u201c\u5b9e\u8df5\u201d\u548c\u201c\u8d44\u6e90\u201d\u3002\n*   **\u98ce\u9669\u70b9**\uff1a\n    *   **\u8fc7\u5ea6\u627f\u8bfa**\uff1a\u9500\u552e\u63d0\u53ca\u201c\u767e\u5206\u767e\u6536\u7a3f\u201d\u3001\u201c\u4e0d\u770b\u8d28\u91cf\u201d\uff0c\u6b64\u7c7b\u7edd\u5bf9\u5316\u627f\u8bfa\u5b58\u5728\u5408\u89c4\u98ce\u9669\uff0c\u6613\u5f15\u53d1\u540e\u7eed\u4e89\u8bae\u3002\n    *   **\u5236\u9020\u7a00\u7f3a\u4e0e\u7d27\u8feb\u611f**\uff1a\u201c\u4f18\u60e0\u540d\u989d\u6709\u9650\u201d\u3001\u201c\u4eca\u665a\u62db\u52df\u5f00\u59cb\u201d\u3001\u201c\u62bd\u5956\u62a2\u5238\u201d\u7b49\u8bdd\u672f\u5c5e\u4e8e\u5e38\u89c4\u8425\u9500\uff0c\u4f46\u9700\u6ce8\u610f\u5c3a\u5ea6\uff0c\u907f\u514d\u8fc7\u5ea6\u538b\u8feb\u3002\n    *   **\u4fe1\u606f\u8f70\u70b8**\uff1a\u4e24\u4f4d\u9500\u552e\uff08\u6709\u58f0\u3001AI\uff09\u5728\u77ed\u65f6\u95f4\u5185\u5bc6\u96c6\u53d1\u9001\u5927\u91cf\u4fe1\u606f\u3001\u94fe\u63a5\u3001\u4efb\u52a1\uff0c\u53ef\u80fd\u5bf9\u7528\u6237\u9020\u6210\u4fe1\u606f\u8fc7\u8f7d\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6838\u5fc3\u7b56\u7565**\uff1a**\u5f15\u5bfc\u660e\u786e\u76ee\u6807\uff0c\u5efa\u7acb\u5fae\u5c0f\u6b63\u53cd\u9988\uff0c\u8c28\u614e\u63a8\u8fdb\u8f6c\u5316**\u3002\n*   **\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u6df1\u5ea6\u5174\u8da3\u6316\u6398**\uff1a\u56f4\u7ed5\u201c\u753b\u672c\u201d\u548c\u201c\u77ed\u89c6\u9891\u201d\u5c55\u5f00\u4e00\u5bf9\u4e00\u6c9f\u901a\uff0c\u4e86\u89e3\u5176\u5174\u8da3\u6765\u6e90\uff08\u662f\u7231\u597d\u3001\u517c\u804c\u8d5a\u94b1\u3001\u8fd8\u662f\u804c\u4e1a\u8f6c\u578b\uff1f\uff09\uff0c\u5e2e\u52a9\u5176\u5c06\u6a21\u7cca\u5174\u8da3\u8f6c\u5316\u4e3a\u5177\u4f53\u3001\u53ef\u8fbe\u6210\u7684\u77ed\u671f\u5b66\u4e60\u76ee\u6807\uff08\u4f8b\u5982\uff1a\u5b8c\u6210\u4e00\u4e2a\u513f\u7ae5\u6545\u4e8b\u914d\u97f3\u5c0f\u4f5c\u54c1\uff1b\u5236\u4f5c\u4e00\u6761\u5b8c\u6574\u7684AI\u77ed\u89c6\u9891\uff09\u3002\n    2.  **\u63d0\u4f9b\u4ef7\u503c\uff0c\u800c\u975e\u50ac\u4fc3**\uff1a\u51cf\u5c11\u7fa4\u53d1\u548c\u4fc3\u9500\u4fe1\u606f\u3002\u9488\u5bf9\u5176\u201c\u63d0\u793a\u8bcd\u60f3\u4e0d\u51fa\u6765\u201d\u7b49\u5177\u4f53\u56f0\u96be\uff0c\u63d0\u4f9b\u66f4\u7ec6\u81f4\u7684\u6280\u5de7\u6307\u5bfc\u6216\u6848\u4f8b\u5206\u4eab\uff0c\u8ba9\u5176\u611f\u53d7\u5230\u5b9e\u9645\u6536\u83b7\u3002\n    3.  **\u900f\u660e\u5316\u53d8\u73b0\u8def\u5f84**\uff1a\u7528\u6848\u4f8b\uff08\u975e\u627f\u8bfa\uff09\u6e05\u6670\u8bf4\u660e\u4ece\u5b66\u4e60\u5230\u63a5\u5355\u7684\u6b65\u9aa4\u3001\u65f6\u95f4\u5468\u671f\u3001\u53ef\u80fd\u6536\u5165\u8303\u56f4\u53ca\u4e0d\u786e\u5b9a\u6027\u3002\u7ba1\u7406\u5176\u9884\u671f\uff0c\u907f\u514d\u56e0\u201c\u767e\u5206\u767e\u6536\u7a3f\u201d\u7b49\u8bdd\u672f\u4ea7\u751f\u8bef\u89e3\u3002\n    4.  **\u8bd5\u63a2\u6027\u652f\u4ed8\u80fd\u529b\u8bc4\u4f30**\uff1a\u5728\u5efa\u7acb\u4e00\u5b9a\u4fe1\u4efb\u540e\uff0c\u53ef\u81ea\u7136\u8be2\u95ee\u5b66\u4e60\u65f6\u95f4\u5b89\u6392\u3001\u5bf9\u8bfe\u7a0b\u6295\u8d44\u7684\u770b\u6cd5\uff0c\u95f4\u63a5\u8bc4\u4f30\u5176\u652f\u4ed8\u610f\u613f\u548c\u80fd\u529b\uff0c**\u5207\u5fcc\u76f4\u63a5\u95ee\u6536\u5165**\u3002\n    5.  **\u51b3\u7b56\u8f85\u52a9**\uff1a\u7528\u6237\u51b3\u7b56\u529b\u5f31\uff0c\u9700\u63d0\u4f9b\u6e05\u6670\u7684\u5bf9\u6bd4\u9009\u9879\uff08\u5982\u4e0d\u540c\u4ea7\u54c1\u7ebf\u7684\u533a\u522b\u3001\u6295\u5165\u4ea7\u51fa\u6bd4\uff09\uff0c\u5e76\u5f15\u5bfc\u5176\u8bf4\u51fa\u987e\u8651\uff0c\u9010\u4e00\u89e3\u7b54\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**\uff1a\n    *   **\u9996\u9009**\uff1a**\u8f7b\u91cf\u7ea7\u3001\u77ed\u5468\u671f\u3001\u7ed3\u679c\u53ef\u89c6\u5316\u7684\u5165\u95e8\u5b9e\u8bad\u9879\u76ee**\uff08\u5982\u201c\u77ed\u89c6\u9891\u5b9e\u6218\u8425\u201d\u3001\u201c\u6709\u58f0\u7ed8\u672c\u5165\u95e8\u8bfe\u201d\uff09\u3002\u5355\u4ef7\u4e0d\u5b9c\u8fc7\u9ad8\uff0c\u5f3a\u8c03\u201c\u5feb\u901f\u4e0a\u624b\u505a\u51fa\u4f5c\u54c1\u201d\uff0c\u5951\u5408\u5176\u63a2\u7d22\u5fc3\u6001\u548c\u9700\u8981\u6b63\u53cd\u9988\u7684\u7279\u70b9\u3002\n    *   **\u6b21\u9009**\uff1a\u82e5\u7528\u6237\u8868\u73b0\u51fa\u5f3a\u70c8\u575a\u6301\u548c\u66f4\u591a\u65f6\u95f4\u6295\u5165\u610f\u613f\uff0c\u53ef\u8003\u8651**\u6807\u51c6\u7cfb\u7edf\u8bfe**\uff0c\u4f46\u5fc5\u987b\u5f3a\u5316\u201c\u73ed\u4e3b\u4efb+\u966a\u8dd1\u5b98\u201d\u7684\u6276\u6301\u4f53\u7cfb\uff0c\u4ee5\u5e94\u5bf9\u5176\u81ea\u4e3b\u6027\u5f31\u7684\u7f3a\u70b9\u3002\n    *   **\u907f\u514d**\uff1a\u76f4\u63a5\u63a8\u8350\u9ad8\u5355\u4ef7\u3001\u957f\u5468\u671f\u7684\u201c\u5168\u80fd\u5927\u5e08\u73ed\u201d\uff0c\u6781\u6613\u56e0\u7528\u6237\u51b3\u5fc3\u4e0d\u8db3\u3001\u9884\u671f\u8fc7\u9ad8\u5bfc\u81f4\u9000\u8d39\u3002\n\n{\"core_type\": \"T4 \u8ff7\u832b\u63a2\u7d22\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd/\u793e\u4ea4\uff08\u6280\u80fd\u83b7\u5f97\u8ba4\u53ef\u3001\u793e\u7fa4\u5f52\u5c5e\uff09\", \"target_product_line\": \"\u77ed\u89c6\u9891\u5b9e\u6218\u8425/\u6709\u58f0\u7ed8\u672c\u5165\u95e8\u8bfe\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}";
