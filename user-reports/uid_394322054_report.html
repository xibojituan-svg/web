        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 394322054 / \u6635\u79f0\uff1a\u9633\u5927\u5927 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-11 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e-\u5c0f\u8bd7\u665a\u665a3(\u6768\u4e3d) / \u73ed\u4e3b\u4efb-\u5b89\u7ae5\u58f0(\u5218\u7d20\u82f1) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u9a6c\u62c9\u96c5\u6500\u767b\u8ba1\u5212\u7cbe\u82f1\u7248\u6b63\u5f0f\u8bfe |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e** (\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e** (\u672a\u63d0\u53ca\u5de5\u4f5c/\u751f\u6d3b\u72b6\u6001) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e** (\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** (\u5173\u952e\u4e09\u8f74\u4fe1\u53f7\u5982\u8d44\u91d1\u3001\u65f6\u95f4\u3001\u5bb6\u5ead\u3001\u5fc3\u7406\u5f39\u6027\u7b49\u5747\u65e0\u76f4\u63a5\u4fe1\u606f) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\uff0c\u6709\u660e\u786e\u7684\u53d8\u73b0\u8bc9\u6c42\uff08\u5173\u6ce8\u659c\u6760\u5de5\u79cd\u3001\u8bd5\u97f3\u5355\uff09\uff0c\u4f46\u540c\u65f6\u4e5f\u8868\u73b0\u51fa\u5bf9\u884c\u4e1a\u53d1\u5c55\u7684\u5174\u8da3\u548c\u81ea\u6211\u5b9e\u73b0\u7684\u8ffd\u6c42\uff08\u201c\u4f20\u5a92\u8def\u4e0a\u7684\u8ffd\u68a6\u4eba\u201d\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u753b\u672c \u5ba1\u542c\u5bf9\u8f68 \u540e\u671f\u201d (\u5173\u6ce8\u53d8\u73b0\u8def\u5f84)\n> \u201c\u5bf9\u884c\u4e1a\u53d1\u5c55\u548c\u53d8\u73b0\u65b9\u5f0f\u6709\u4e86\u591a\u7ef4\u5ea6\u7684\u4e86\u89e3\u201d (\u6709\u5b66\u4e60\u610f\u613f)\n> \u201c\u5176\u5b9e\u6211\u4e00\u76f4\u662f\u4e2a\u4f20\u5a92\u8def\u4e0a\u7684\u8ffd\u68a6\u4eba\uff0c\u6211\u4e5f\u7279\u522b\u60f3\u50cf\u60a8\u4e00\u6837\u9010\u6e10\u6210\u4e3a\u4e13\u804c\u7684\u884c\u4e1a\u4eba\uff01\u201d (\u81ea\u6211\u5b9e\u73b0\u52a8\u673a)\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d] (\u4fe1\u606f\u4e0d\u8db3\uff0c\u57fa\u4e8e\u6709\u9650\u4fe1\u606f\u63a8\u6d4b)\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 \u5df2\u62a5\u540d\u9ad8\u9636\u8bfe\u7a0b\uff0c\u63a8\u6d4b\u6709\u4e00\u5b9a\u652f\u4ed8\u80fd\u529b\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u6765\u6e90\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 \u80fd\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u76f4\u64ad\u548c\u665a\u95f4\u6d3b\u52a8\uff08\u201c\u4e00\u76f4\u5728\u76f4\u64ad\u95f4\u73a9\u5267\u672c\u201d\uff09\uff0c\u8868\u660e\u6709\u53ef\u652f\u914d\u7684\u788e\u7247\u5316\u65f6\u95f4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u672a\u77e5] \u2014 \u65e0\u4fe1\u606f\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9762\u5bf9\u6280\u672f\u64cd\u4f5c\u95ee\u9898\uff08\u5982\u5f55\u9519\u5e73\u53f0\u3001\u56fe\u7247\u770b\u4e0d\u6e05\uff09\u65f6\uff0c\u53cd\u5e94\u662f\u201c\u6211\u518d\u53bb\u770b\u770b\u201d\u3001\u201c\u7b49\u4f1a\u6211\u518d\u770b\u4e00\u4e0b\u201d\uff0c\u4e3b\u52a8\u5c1d\u8bd5\u89e3\u51b3\uff0c\u672a\u51fa\u73b0\u60c5\u7eea\u5316\u6216\u6c42\u52a9\u4f9d\u8d56\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u5f55\u4e86\u4e00\u4e2a\u5306\u5306\u5728\u559c\u9a6c\u62c9\u96c5\u5f55\u7684\u597d\u50cf\u6ca1\u529e\u6cd5\u4fdd\u5b58\u5230\u672c\u5730\u201d (\u9648\u8ff0\u95ee\u9898)\n> \u201c\u597d\u7684\uff0c\u6211\u91cd\u65b0\u5f55\u4e00\u6b21\u201d (\u7acb\u5373\u884c\u52a8)\n> \u201c\u662f\u4e0d\u662f\u6211\u624b\u673a\u6709\u95ee\u9898[\u6342\u8138]\u201d (\u81ea\u6211\u8c03\u4f83\uff0c\u65e0\u5d29\u6e83\u8ff9\u8c61)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u4e13\u4e1a\u8eab\u4efd\u548c\u884c\u4e1a\u8ba4\u53ef\u7684\u6e34\u671b\u3002\u4ed6\u4e0d\u4ec5\u662f\u201c\u641e\u94b1\u201d\uff0c\u66f4\u5e0c\u671b\u6210\u4e3a\u201c\u4e13\u804c\u7684\u884c\u4e1a\u4eba\u201d\uff0c\u83b7\u5f97\u4e13\u4e1a\u5708\u5c42\u7684\u5c0a\u91cd\u548c\u5b9e\u73b0\u4e2a\u4eba\u4ef7\u503c\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u5f15\u9886**\u3002\u5c06\u4ed6\u89c6\u4e3a\u201c\u6709\u6f5c\u529b\u7684\u540c\u884c\u201d\u800c\u975e\u201c\u666e\u901a\u5b66\u5458\u201d\uff0c\u7ed9\u4e88\u6280\u672f\u4e0a\u7684\u9ad8\u5ea6\u8ba4\u53ef\uff08\u5982\u201c\u4e3b\u64ad\u7684\u597d\u82d7\u5b50\u201d\uff09\u548c\u672a\u6765\u804c\u4e1a\u8def\u5f84\u7684\u6e05\u6670\u6307\u5f15\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u8fdb\u5316\u524d\u4f53\uff0c\u6709\u5411T1-A\u6216\u6df7\u5408\u4f533\u53f7\u53d1\u5c55\u7684\u6f5c\u529b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a[\u65e0]\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u56e0\u5176\u52a8\u673a\u504f\u5411\u81ea\u6211\u5b9e\u73b0\uff0c\u5bb6\u5ead\u5e72\u9884\u98ce\u9669\u76f8\u5bf9\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u6267\u884c\u529b\u5f3a\uff0c\u5b66\u4e60\u6001\u5ea6\u79ef\u6781\uff0c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u770b\u4f3c\u4e0d\u9519\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u4e8b\u4e3b\u52a8\u89e3\u51b3\uff0c\u65e0\u81ea\u5351\u6216\u4f9d\u8d56\u4fe1\u53f7\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u5bf9\u53d8\u73b0\u8def\u5f84\uff08\u753b\u672c\u3001\u5ba1\u542c\u7b49\uff09\u6709\u660e\u786e\u671f\u5f85\u3002\u82e5\u5b66\u4e60\u540e\u671f\u63a5\u5355\u673a\u4f1a\u6e3a\u832b\u6216\u53d8\u73b0\u5468\u671f\u8fc7\u957f\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe\u540e **2-3\u4e2a\u6708**\uff0c\u5f53\u6280\u80fd\u5b66\u4e60\u8fdb\u5165\u5e73\u53f0\u671f\uff0c\u800c\u53d8\u73b0\u673a\u4f1a\u672a\u5982\u9884\u671f\u822c\u51fa\u73b0\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u9633\u5927\u5927\uff0c\u770b\u5230\u4f60\u4e4b\u524d\u5bf9\u659c\u6760\u5de5\u79cd\u548c\u884c\u4e1a\u53d1\u5c55\u7684\u601d\u8003\uff0c\u80fd\u611f\u89c9\u5230\u4f60\u662f\u771f\u7684\u60f3\u5728\u8fd9\u6761\u8def\u4e0a\u6df1\u8015\u3002\u54b1\u4eec\u8fd9\u4e2a\u73ed\u91cc\u6709\u4e0d\u5c11\u50cf\u4f60\u8fd9\u6837\u6709\u6f5c\u529b\u7684\u2018\u51c6\u4e13\u4e1a\u9009\u624b\u2019\uff0c\u63a5\u4e0b\u6765\u7684\u8bfe\u7a0b\u6211\u4f1a\u7ed9\u4f60\u5339\u914d\u66f4\u6709\u6311\u6218\u6027\u7684\u4efb\u52a1\u548c\u66f4\u7cbe\u51c6\u7684\u8d44\u6e90\uff0c\u671f\u5f85\u4f60\u6210\u4e3a\u73ed\u91cc\u7684\u6807\u6746\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011\u3002\u5339\u914d\u5176\u8ffd\u6c42\u4e13\u4e1a\u548c\u53d8\u73b0\u7684\u53cc\u91cd\u76ee\u6807\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011+ **\u6f5c\u5728\u7684\u3010D\u6a21\u5757\uff1a\u7edf\u7b79\u6743\u529b\u4e0b\u653e\u3011**\u3002\u89c2\u5bdf\u5176\u540e\u7eed\u662f\u5426\u51fa\u73b0\u4e3b\u52a8\u5e2e\u52a9\u540c\u5b66\u3001\u7ec4\u7ec7\u6d3b\u52a8\u7b49\u884c\u4e3a\uff0c\u9002\u65f6\u201c\u9ec4\u888d\u52a0\u8eab\u201d\uff0c\u8d4b\u4e88\u5176\u5c0f\u7ec4\u957f\u6216\u70b9\u8bc4\u5b98\u7b49\u89d2\u8272\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u5bf9\u5f85\u201c\u5c0f\u767d\u201d\u6216\u201c\u60c5\u7eea\u5de8\u5a74\u201d\u7684\u65b9\u5f0f\u8fc7\u5ea6\u5475\u62a4\u3002\u907f\u514d\u4f7f\u7528\u201c\u5b9d\u5b9d\u201d\u3001\u201c\u522b\u7740\u6025\u6162\u6162\u6765\u201d\u7b49\u77ee\u5316\u8bcd\u6c47\u3002**\u7981\u6b62\u753b\u4e0d\u5207\u5b9e\u9645\u7684\u201c\u901f\u6210\u66b4\u5bcc\u201d\u5927\u997c**\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u8fdb\u884c**\u5927\u989d\u63a8\u4ecb**\uff0c\u4f46\u5fc5\u987b\u57fa\u4e8e\u5176\u6280\u672f\u6210\u957f\u548c\u5b9e\u9645\u63a5\u5355\u8fdb\u5c55\uff0c\u7528\u4e13\u4e1a\u8fdb\u9636\u8def\u5f84\uff08\u5982\u540e\u671f\u5236\u4f5c\u3001\u9ad8\u9636\u6f14\u64ad\u6280\u5de7\uff09\u4f5c\u4e3a\u5347\u5355\u7406\u7531\uff0c\u800c\u975e\u5355\u7eaf\u5236\u9020\u7126\u8651\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u753b\u672c \u5ba1\u542c\u5bf9\u8f68 \u540e\u671f\u201d \u2013 **\u5173\u6ce8\u5177\u4f53\u53d8\u73b0\u8def\u5f84\uff0c\u52a1\u5b9e\u4e14\u76ee\u6807\u660e\u786e\u3002**\n2. > \u201c\u5176\u5b9e\u6211\u4e00\u76f4\u662f\u4e2a\u4f20\u5a92\u8def\u4e0a\u7684\u8ffd\u68a6\u4eba\uff0c\u6211\u4e5f\u7279\u522b\u60f3\u50cf\u60a8\u4e00\u6837\u9010\u6e10\u6210\u4e3a\u4e13\u804c\u7684\u884c\u4e1a\u4eba\uff01\u201d \u2013 **\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u4e13\u4e1a\u8eab\u4efd\u8ba4\u540c\u548c\u81ea\u6211\u5b9e\u73b0\uff0c\u8d85\u8d8a\u5355\u7eaf\u8d5a\u94b1\u3002**\n3. > \u201c\u597d\u7684\uff0c\u6211\u91cd\u65b0\u5f55\u4e00\u6b21\u201d \u2013 **\u9047\u632b\u540e\u7acb\u5373\u884c\u52a8\uff0c\u65e0\u60c5\u7eea\u5185\u8017\uff0c\u5fc3\u7406\u5f39\u6027\u6781\u9ad8\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\uff08\u6f5c\u529b\u9886\u8896\u578b\uff09\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4e0e\u5b9e\u73b0\u4f20\u5a92\u68a6\u60f3\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u786c\u6838\u6280\u672f\u6311\u6218\u4e0e\u6e05\u6670\u7684\u804c\u4e1a\u8def\u5f84\u6307\u5f15\uff0c\u9002\u65f6\u8d4b\u4e88\u7ba1\u7406\u6743\u9650\u8fdb\u884c\u201c\u9ec4\u888d\u52a0\u8eab\u201d\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u7537\", \"city\": \"\u56db\u5ddd\u6210\u90fd\"}\n```";
