    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4ee5\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\u7684\u8eab\u4efd\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u63d0\u4f9b\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676942697 (\u6635\u79f0\uff1a\u8d39\u9a6c) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-13 \u81f3 2026-04-07 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u76f8\u4f34\u4e0e\u58f0(\u96f7\u743c\u743c) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u6f14\u64ad\u8bfe\u7a0b (\u4ef7\u683c\u672a\u77e5) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3** (\u201c\u94b1\u5b9e\u8bdd\u8bf4\u771f\u662f\u6709\u70b9\u7d27\u5f20\u201d\uff0c\u8bbe\u5907\u4e3a\u670b\u53cb\u5904\u62ff\u7684\uff0c\u65e0\u529b\u8d2d\u4e70\u63a8\u8350\u5957\u9910) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u767d\u5929\u5728\u5916\u8dd1\u6d3b\uff0c\u665a\u4e0a\u5b66\u4e60\uff0c\u9700\u63a5\u9001\u5b69\u5b50) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u5df2\u62a5\u5907\u5e76\u652f\u6301** (\u63d0\u53ca\u5b69\u5b50\uff0c\u5bb6\u5ead\u6d3b\u52a8\u672a\u8868\u73b0\u51fa\u9690\u7792\u6216\u53cd\u5bf9\u8ff9\u8c61) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** (\u5bf9\u8bdd\u5185\u5bb9\u4e30\u5bcc\uff0c\u6d89\u53ca\u5b66\u4e60\u3001\u5b9e\u8df5\u3001\u8bbe\u5907\u3001\u5bb6\u5ead\u3001\u7ecf\u6d4e\u72b6\u51b5) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u2b06\u9ad8]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u800c\u6765\uff0c\u5173\u6ce8\u4e13\u4e1a\u7cbe\u8fdb\u3001\u6280\u672f\u7ec6\u8282\u548c\u5ba1\u7f8e\u63d0\u5347\uff0c\u6709\u957f\u671f\u5b66\u4e60\u9884\u671f\uff0c\u4e0d\u8981\u6c42\u77ed\u671f\u53d8\u73b0\u4fdd\u5e95\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5c31\u76ee\u524d\u6765\u770b\uff0c\u4e0d\u8c26\u865a\u7684\u8bf4\uff0c\u6211\u611f\u89c9\u6211\u81ea\u5df1\u7684\u8fdb\u6b65\u8fd8\u662f\u633a\u660e\u663e\u7684\u201d\uff1b > \u201c\u8fd9\u4e24\u5468\u4e00\u76f4\u7528\u8fd9\u4e9b\u4e2d\u4e66\u7684\u4eba\u5f53\u4e2a\u6807\u6746\uff0c\u770b\u770b\u4eba\u5bb6\u8bfb\u5230\u4ec0\u4e48\u6c34\u51c6\u80fd\u4e2d\u4e66\uff0c\u7136\u540e\u5bf9\u7740\u90a3\u4e9b\u6587\u672c\u8bfb\u4e00\u4e0b\uff0c\u81ea\u5df1\u7684\u611f\u89c9\uff0c\u7136\u540e\u6bd4\u8f83\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u660e\u786e\u8868\u793a\u201c\u94b1\u73b0\u5728\u6068\u4e0d\u5f97\u63b0\u7740\u82b1\u4e86\uff0c\u5b9e\u5728\u662f\u592a\u7d27\u5f20\u4e86\u201d\uff0c\u65e0\u529b\u8d2d\u4e70\u63a8\u8350\u7684\u4e13\u4e1a\u8bbe\u5907\uff0c\u4f9d\u8d56\u670b\u53cb\u5904\u62ff\u7684\u65e7\u8bbe\u5907\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u65f6\u95f4\u788e\u7247\u5316\uff08\u767d\u5929\u8dd1\u6d3b\uff0c\u665a\u4e0a\u5b66\u4e60\u3001\u505a\u4f5c\u4e1a\uff09\uff0c\u4f46\u5b66\u4e60\u6295\u5165\u5ea6\u9ad8\uff0c\u80fd\u575a\u6301\u5b8c\u6210\u4f5c\u4e1a\u548c\u5c0f\u7ec4\u4efb\u52a1\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4e2d** \u2014 \u5bb6\u5ead\u60c5\u51b5\u6b63\u5e38\u63d0\u53ca\uff08\u9001\u5b69\u5b50\u8e22\u7403\uff09\uff0c\u672a\u8868\u73b0\u51fa\u53cd\u5bf9\u6216\u5f3a\u70c8\u652f\u6301\uff0c\u5c5e\u4e8e\u4e2d\u6027\u72b6\u6001\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\uff0c\u9047\u5230\u95ee\u9898\u4e3b\u52a8\u5bfb\u627e\u89e3\u51b3\u65b9\u6848\uff08\u5982\u6539\u9020\u5f55\u97f3\u73af\u5883\u3001\u7814\u7a76\u6807\u6746\uff09\uff0c\u5fc3\u6001\u79ef\u6781\uff0c\u80fd\u81ea\u6211\u6fc0\u52b1\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u738b\u8001\u5e08\u592a\u5389\u5bb3\u4e86\uff0c\u5f55\u97f3\u7684\u65f6\u5019\u58f0\u97f3\u4e0d\u8981\u592a\u7a33\u5b9a...\u8001\u5e08\u5f55\u4e66\u4e5f\u8001\u51fa\u9519\uff0c\u54c8\u54c8\u54c8\uff0c\u5634\u74e2\u662f\u5927\u5bb6\u90fd\u6709\u7684\u95ee\u9898\u201d\uff1b > \u201c\u4e4b\u524d\u6bcf\u6b21\u90fd\u89c9\u5f97\u81ea\u5df1\u5c0f\u7a0b\u5e8f\u4e0d\u4e2d\u4e66\u90fd\u662f\u5185\u5e55\uff0c\u4eca\u5929\u770b\u540c\u5b66\u7684\u4f5c\u4e1a\uff0c\u8ddf\u4eba\u5bb6\u7684\u5dee\u8ddd\u662f\u771f\u7684\u5927...\u73ed\u73ed\u4e4b\u524d\u8bf4\u505a\u540e\u671f\u8981\u6709\u601d\u8def\uff0c\u6211\u8fd8\u60f3\u8fd9\u8fd8\u80fd\u52a0\u5565\u4e1c\u897f\uff0c\u7136\u540e\u4e00\u770b\uff0c\u54e6\u80fd\u52a0\u7684\u4e1c\u897f\u8fd9\u4e48\u591a\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u7ecf\u6d4e\u538b\u529b\u4e0b\u7684\u81ea\u6211\u4ef7\u503c\u7126\u8651\u3002\u4ed6\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u786c\u6838\u6280\u80fd\uff08\u6709\u58f0\u6f14\u64ad\uff09\uff0c\u83b7\u5f97\u4e13\u4e1a\u4e0a\u7684\u8ba4\u53ef\u548c\u5c0a\u91cd\uff0c\u4ece\u800c\u626d\u8f6c\u5f53\u524d\u201c\u94b1\u7d27\u5f20\u201d\u7684\u7a98\u8feb\u611f\uff0c\u5b9e\u73b0\u4eba\u751f\u7684\u201c\u7b2c\u4e8c\u4e2a\u8f6c\u6298\u70b9\u201d\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u8fdb\u9636\u8def\u5f84\u7684\u6e05\u6670\u611f**\u3002\u4ed6\u9700\u8981\u88ab\u8ba4\u53ef\u4e3a\u201c\u6709\u6f5c\u529b\u7684\u5b66\u4e60\u8005\u201d\u800c\u975e\u201c\u6025\u4e8e\u6c42\u6210\u7684\u53d8\u73b0\u8005\u201d\uff0c\u5e76\u901a\u8fc7\u660e\u786e\u7684\u8fdb\u6b65\u53cd\u9988\u548c\u9636\u6bb5\u6027\u6210\u679c\uff08\u5982\u8fc7\u521d\u5ba1\uff09\u6765\u5efa\u7acb\u81ea\u4fe1\u548c\u5f52\u5c5e\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1 \u7c7b** (\u52a8\u673a\u9ad8\u3001\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4f46\u8d44\u6e90\u5e95\u5ea7\u5b58\u5728\u660e\u663e\u77ed\u677f\u2014\u2014\u8d44\u91d1\u7d27\u5f20) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u5173\u6ce8\u786c\u6838\u6280\u672f\uff0c\u4e3b\u52a8\u7ec3\u4e60\u3001\u7814\u7a76\u6807\u6746\u3001\u89e3\u51b3\u95ee\u9898\uff0c\u4e0d\u5f20\u626c\u4f46\u884c\u52a8\u529b\u5f3a) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u867d\u8d44\u91d1\u7d27\u5f20\uff0c\u4f46\u672a\u5230\u501f\u8d37\u62a5\u540d\u3001\u5f71\u54cd\u57fa\u672c\u751f\u5b58\u7684\u7a0b\u5ea6\uff0c\u4e14\u5b66\u4e60\u52a8\u673a\u7eaf\u7cb9\uff0c\u5fc3\u7406\u5f39\u6027\u597d\uff0c\u5bb6\u5ead\u65e0\u660e\u663e\u963b\u529b\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u5bb6\u5ead\u77e5\u60c5\u4e14\u672a\u53cd\u5bf9\uff0c\u98ce\u9669\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4e2d | **\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u56e0\u767d\u5929\u5de5\u4f5c\u7e41\u5fd9\uff0c\u82e5\u8bfe\u7a0b\u4efb\u52a1\u91cf\u9661\u589e\u6216\u65f6\u95f4\u51b2\u7a81\uff0c\u53ef\u80fd\u5bfc\u81f4\u4f5c\u4e1a\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u632b\u8d25\u611f\u548c\u7126\u8651\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u6b63\u89c6\u5dee\u8ddd\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u56f0\u96be\u7834\u9632\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u52a8\u673a\u4e3a\u80fd\u529b\u6210\u957f\u800c\u975e\u77ed\u671f\u53d8\u73b0\uff0c\u5bf9\u6536\u76ca\u671f\u5f85\u7406\u6027\u3002\u4f46\u9700\u8b66\u60d5\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa\u201c\u5feb\u901f\u63a5\u5355\u201d\u5bfc\u81f4\u5176\u9884\u671f\u5931\u8861\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u8bfe\u7a0b\u4e2d\u540e\u671f\uff08\u7b2c4-8\u5468\uff09**\u3002\u5f53\u8bfe\u7a0b\u96be\u5ea6\u63d0\u5347\u3001\u5c0f\u7ec4\u534f\u4f5c\u4efb\u52a1\u52a0\u91cd\uff0c\u800c\u5176\u65f6\u95f4\u7cbe\u529b\u56e0\u5de5\u4f5c\u548c\u751f\u6d3b\u88ab\u8fdb\u4e00\u6b65\u6324\u538b\u65f6\uff0c\u53ef\u80fd\u56e0\u201c\u65e0\u6cd5\u6295\u5165\u8db3\u591f\u65f6\u95f4\u8fbe\u5230\u81ea\u6211\u8981\u6c42\u7684\u6807\u51c6\u201d\u800c\u4ea7\u751f\u653e\u5f03\u5ff5\u5934\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u8d39\u9a6c\u5927\u54e5\uff0c\u770b\u4e86\u4f60\u7684\u7ec3\u4e60\u548c\u8ba8\u8bba\uff0c\u80fd\u611f\u89c9\u5230\u4f60\u662f\u771f\u7684\u5728\u94bb\u8fd9\u95e8\u624b\u827a\u3002\u54b1\u4eec\u4e0d\u8ddf\u522b\u4eba\u6bd4\u901f\u5ea6\uff0c\u5c31\u8ddf\u4f60\u81ea\u5df1\u4e0a\u4e2a\u6708\u6bd4\u3002\u4f60\u65f6\u95f4\u96f6\u788e\u6ca1\u5173\u7cfb\uff0c\u73ed\u73ed\u4f1a\u5e2e\u4f60\u628a\u5b66\u4e60\u8def\u5f84\u62c6\u89e3\u6210\u2018\u5730\u94c1\u4e0a\u80fd\u542c\u2019\u3001\u2018\u7761\u524d\u80fd\u7ec3\u2019\u7684\u6a21\u5757\u3002\u4f60\u7684\u76ee\u6807\u4e0d\u662f\u2018\u5feb\u2019\uff0c\u662f\u2018\u7a33\u2019\u548c\u2018\u6df1\u2019\uff0c\u54b1\u4eec\u4e00\u8d77\u628a\u6bcf\u4e2a\u5751\u90fd\u8e0f\u8e0f\u5b9e\u5b9e\u8e29\u8fc7\u53bb\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176T2\u5b9e\u5e72\u7279\u8d28\uff0c\u63d0\u4f9b\u6e05\u6670\u7684\u6280\u672f\u8fdb\u9636\u5730\u56fe\u548c\u786c\u6838\u8bad\u7ec3\u4efb\u52a1\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176**\u65f6\u95f4\u788e\u7247\u5316**\u7684\u7279\u70b9\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u65f6\u95f4\u7ba1\u7406\u8f85\u52a9\u5305\u3011**\uff08\u5982\uff1a\u63d0\u4f9b\u97f3\u9891\u77e5\u8bc6\u70b9\u5207\u7247\u300115\u5206\u949f\u5fae\u7ec3\u4e60\u6307\u5357\uff09\u3002\u9488\u5bf9\u5176**\u8d44\u91d1\u7d27\u5f20**\u7684\u73b0\u72b6\uff0c\u63d0\u4f9b **\u3010\u4f4e\u6210\u672c\u8bbe\u5907\u4f18\u5316\u65b9\u6848\u3011**\uff08\u5982\uff1a\u5982\u4f55\u7528\u5e8a\u5355\u3001\u9e21\u86cb\u68c9\u4f4e\u6210\u672c\u6539\u5584\u5f55\u97f3\u73af\u5883\uff09\uff0c**\u4e25\u7981**\u5728\u5176\u7ecf\u6d4e\u7f13\u89e3\u524d\u5f3a\u63a8\u9ad8\u4ef7\u8bbe\u5907\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u6301\u7eed\u7528\u201c\u522b\u4eba\u5df2\u7ecf\u4e2d\u4e66\u8d5a\u94b1\u201d\u6765\u523a\u6fc0\u4ed6\uff0c\u8fd9\u4f1a\u52a0\u5267\u5176\u65f6\u95f4\u7126\u8651\u548c\u7ecf\u6d4e\u538b\u529b\u30022. \u5ffd\u89c6\u5176\u65f6\u95f4\u9650\u5236\uff0c\u5b89\u6392\u9700\u8981\u5927\u5757\u3001\u56fa\u5b9a\u65f6\u95f4\u53c2\u4e0e\u7684\u5bc6\u96c6\u578b\u6d3b\u52a8\u30023. \u5728\u672a\u89e3\u51b3\u5176\u57fa\u7840\u8bbe\u5907/\u73af\u5883\u95ee\u9898\u524d\uff0c\u8fc7\u5ea6\u5f3a\u8c03\u8bbe\u5907\u5bf9\u6548\u679c\u7684\u51b3\u5b9a\u6027\u4f5c\u7528\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u53ef\u89c1\u804a\u5929\u8bb0\u5f55\u5468\u671f\u5185\uff0c\u5176\u7ecf\u6d4e\u72b6\u51b5\u662f\u660e\u786e\u77ed\u677f\u3002\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u53ef\u80fd\u89e6\u53d1\u5176\u7ecf\u6d4e\u538b\u529b\uff0c\u5bfc\u81f4\u53cd\u611f\u6216\u9000\u8d39\u3002\u5e94\u5148\u5e2e\u52a9\u5176\u901a\u8fc7\u73b0\u6709\u8d44\u6e90\u53d6\u5f97\u53ef\u89c1\u6210\u679c\uff0c\u5efa\u7acb\u4fe1\u4efb\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u6700\u8fd1\u94b1\u5b9e\u8bdd\u8bf4\u771f\u662f\u6709\u70b9\u7d27\u5f20[\u6342\u8138]\u201d **(\u8d44\u6e90\u5e95\u5ea7\u77ed\u677f-\u8d44\u91d1)**\n2. > \u201c\u4e4b\u524d\u6bcf\u6b21\u90fd\u89c9\u5f97\u81ea\u5df1\u5c0f\u7a0b\u5e8f\u4e0d\u4e2d\u4e66\u90fd\u662f\u5185\u5e55\uff0c\u4eca\u5929\u770b\u540c\u5b66\u7684\u4f5c\u4e1a\uff0c\u8ddf\u4eba\u5bb6\u7684\u5dee\u8ddd\u662f\u771f\u7684\u5927...\u7136\u540e\u4e00\u770b\uff0c\u54e6\u80fd\u52a0\u7684\u4e1c\u897f\u8fd9\u4e48\u591a\u201d **(\u9ad8\u5fc3\u7406\u5f39\u6027\u4e0e\u5b9e\u5e72\u7cbe\u795e)**\n3. > \u201c\u54b1\u4eec\u7ea6\u597d\u4e86\u5c31\u5c3d\u91cf\u51fa\u73b0\uff0c\u4e0d\u80fd\u6765\u4e5f\u8bf4\u4e00\u4e0b\u201d **(\u8d23\u4efb\u611f\u5f3a\uff0cT2\u4f4e\u8c03\u5b9e\u5e72\u578b\u5178\u578b\u7279\u5f81)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2\u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4ee5\u6539\u53d8\u7ecf\u6d4e\u73b0\u72b6**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u9002\u914d\u5176\u788e\u7247\u5316\u65f6\u95f4\u7684\u786c\u6838\u8bad\u7ec3\u65b9\u6848\uff0c\u5e76\u7edd\u5bf9\u907f\u514d\u65bd\u52a0\u7ecf\u6d4e\u538b\u529b**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u65f6\u95f4\u7ba1\u7406\u8f85\u52a9\u5305\"}\n```";
