    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a676164646\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676164646 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-12 \u81f3 2026-04-07 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5609\u76c8\u5999\u8bed(\u5b63\u6625\u96e8)\u3001\u9ed1\u55b5\u68ee\u6dfc(\u738b\u7389) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u77ed\u6545\u4e8b\u5199\u4f5c\u57fa\u7840\u73ed \u2192 \u610f\u5411\u5347\u5355\u77ed\u5267\u5199\u4f5c\u8bfe\uff0823\u671f\uff0c\u96d5\u7422\u8001\u5e08\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u591a\u6b21\u63d0\u53ca\u52a0\u73ed\u3001\u51fa\u5dee\u3001\u5f00\u4f1a\uff0c\u5229\u7528\u95f4\u9699\u5b66\u4e60\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u63d0\u4f9b\u4e86\u5927\u91cf\u5173\u4e8e\u5b66\u4e60\u3001\u6295\u7a3f\u3001\u5267\u7ec4\u534f\u4f5c\u7684\u4e92\u52a8\u7ec6\u8282\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **[\u2b06\u9ad8]**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u6210\u679c\u800c\u6765\uff0c\u5173\u6ce8\u6295\u7a3f\u7b7e\u7ea6\u3001\u4f5c\u54c1\u8d28\u91cf\u3001\u6280\u672f\u7ec6\u8282\uff08\u5982AU\u63d2\u4ef6\u3001\u591a\u8f68\u754c\u9762\uff09\uff0c\u6709\u660e\u786e\u7684\u53d8\u73b0\u8def\u5f84\u63a2\u7d22\u884c\u4e3a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4e0a\u4f20\u4f5c\u54c1\u4e86\uff0c\u88ab\u9009\u4e0a\u4e86\uff0c\u624d\u6709\u53ef\u80fd\u88ab\u7b7e\u7ea6\u5427\u201d > \u201c\u6211\u5148\u628a\u7ec6\u7eb2\u91cd\u65b0\u505a\u4e86\u4e00\u4e0b\uff0c\u9ebb\u70e6\u5e2e\u6211\u770b\u54c8\u201d > \u201c\u5927\u7eb2\u62c6\u89e3\u51b2\u7a81\u4e8b\u4ef6\u7684\u65b9\u5f0f\uff0c\u4f7f\u7528\u7684\u662f\u54ea\u5957\u63d0\u793a\u8bcd\uff1f\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **[\u27a1\u4e2d]**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u4fe1\u606f\u4e0d\u8db3]** \u2014 \u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u6216\u7ecf\u6d4e\u72b6\u51b5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**[\u2b07\u4f4e]** \u2014 \u591a\u6b21\u56e0\u201c\u52a0\u73ed\u201d\u3001\u201c\u51fa\u5dee\u201d\u3001\u201c\u5f00\u4f1a\u201d\u800c\u9519\u8fc7\u8bfe\u7a0b\u6216\u9700\u8981\u8bf7\u5047\uff0c\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\u4e14\u88ab\u5de5\u4f5c\u6324\u538b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u4fe1\u606f\u4e0d\u8db3]** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **[\u2b06\u9ad8]**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08AU\u64cd\u4f5c\u3001\u6295\u7a3f\u8def\u5f84\uff09\u4e3b\u52a8\u3001\u591a\u6b21\u3001\u6709\u8010\u5fc3\u5730\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u65e0\u62b1\u6028\u6216\u81ea\u6211\u5426\u5b9a\u3002\u9762\u5bf9\u9519\u8bef\uff08\u4f20\u9519\u6587\u4ef6\u3001\u8bfb\u9519\u5b57\uff09\u80fd\u5766\u7136\u627f\u8ba4\u5e76\u79ef\u6781\u4fee\u6b63\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u91cd\u65b0\u5f04\u4e00\u4e0b[\u6342\u8138][\u6342\u8138]\u201d > \u201c\u81ea\u5df1\u90fd\u4e0d\u80fd\u8fc7\u773c\uff0c\u5199\u5f97\u81ed[\u82e6\u6da9][\u82e6\u6da9]\u201d > \u201c\u5bf9\u4e0d\u4f4f\u5927\u5bb6\uff0c\u9700\u8981\u6211\u91cd\u65b0\u5220\u9664\u4e0a\u4f20\u54c8\u660e\u5929\u4e0a\u5348\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5728\u7e41\u5fd9\u5de5\u4f5c\u4e2d\u6324\u51fa\u65f6\u95f4\u5b66\u4e60\uff0c\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u6280\u80fd\u3001\u4ea7\u51fa\u5408\u683c\u4f5c\u54c1\u5e76\u83b7\u5f97\u7b7e\u7ea6\u8ba4\u53ef\uff0c\u6765\u8bc1\u660e\u81ea\u5df1\u7684\u80fd\u529b\u548c\u4ef7\u503c\uff0c\u83b7\u5f97\u4e13\u4e1a\u9886\u57df\u7684\u5c0a\u91cd\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u6210\u679c\u7684\u5373\u65f6\u53cd\u9988**\u3002\u5728\u4ed6\u56e0\u5de5\u4f5c\u7e41\u5fd9\u800c\u53ef\u80fd\u4ea7\u751f\u7684\u201c\u6389\u961f\u7126\u8651\u201d\u4e2d\uff0c\u63d0\u4f9b\u6e05\u6670\u3001\u9ad8\u6548\u7684\u6280\u672f\u652f\u6301\u548c\u6210\u679c\u9a8c\u8bc1\u901a\u9053\uff08\u5982\u6295\u7a3f\u6307\u5bfc\u3001\u4f5c\u54c1\u70b9\u8bc4\uff09\uff0c\u8ba9\u4ed6\u611f\u53d7\u5230\u52aa\u529b\u88ab\u770b\u89c1\u3001\u95ee\u9898\u88ab\u89e3\u51b3\u3001\u8def\u5f84\u6e05\u6670\u53ef\u884c\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u5411 **\u6df7\u5408\u4f533\u53f7\uff1a\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b** \u8fdb\u5316\u4e2d) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n**\u3010\u5224\u5b9a\u6811\u63a8\u6f14\u3011**\n1.  **\u4ea4\u6613\u4fe1\u53f7\u6838\u67e5**\uff1a\u65e0\u652f\u4ed8\u6570\u636e\uff0c\u8df3\u8fc7\u3002\n2.  **\u4e09\u8f74\u8bc4\u5206**\uff1a\u52a8\u673a\u7eaf\u5ea6\uff087-8\u5206\uff0c\u5173\u6ce8\u6280\u80fd\u4e0e\u6210\u679c\uff09\u3001\u8d44\u6e90\u5e95\u5ea7\uff085-6\u5206\uff0c\u65f6\u95f4\u788e\u7247\u5316\u4f46\u80fd\u575a\u6301\uff09\u3001\u5fc3\u7406\u5f39\u6027\uff087-8\u5206\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u6297\u632b\u6298\uff09\u3002\n3.  **\u5224\u5b9a\u6811\u8def\u5f84**\uff1a\u52a8\u673a\u22655\u5206\uff0c\u5f39\u6027\u22657\u5206 \u2192 \u8fdb\u5165\u201c\u9ad8\u5f39\u6027\u901a\u9053\u201d\u3002\u7528\u6237\u672a\u8868\u73b0\u51fa\u4e3b\u52a8\u7edf\u7b79\u884c\u4e3a\uff08T1\uff09\u6216\u6df1\u5ea6\u6280\u672f\u8ffd\u95ee\uff08T3\uff09\uff0c\u4f46\u8868\u73b0\u51fa**\u6781\u5f3a\u7684\u6267\u884c\u529b\u548c\u534f\u4f5c\u610f\u613f**\uff08\u4e3b\u52a8\u63d0\u4ea4\u4f5c\u4e1a\u3001\u53c2\u4e0e\u5267\u7ec4\u3001\u4fee\u6b63\u9519\u8bef\uff09\u3002\u7b26\u5408\u201c\u4ee5\u4e0a\u5747\u672a\u547d\u4e2d\u7684\u9ad8\u52a8\u673a\u3001\u9ad8\u5f39\u6027\u7528\u6237 \u2192 \u9ed8\u8ba4\u5f52\u7c7b\u4e3aT2\u4f4e\u8c03\u8001\u9ec4\u725b\u201d\u3002\n4.  **\u52a8\u6001\u8fc1\u79fb\u76d1\u63a7**\uff1a\u7528\u6237\u5df2\u5728\u7fa4\u5185\u4e3b\u52a8@\u540c\u5b66\u8fdb\u884c\u6280\u672f\u4ea4\u6d41\uff08\u201c\u4f60\u653e\u5f00\u55d3\u5b50\u5f55\u65f6\uff0c\u662f\u600e\u4e48\u5f04\u7684\u201d\uff09\u3001\u53c2\u4e0e\u5267\u7ec4\u5206\u5de5\u5e76\u5173\u6ce8\u6574\u4f53\u8fdb\u5ea6\uff08\u8be2\u95ee\u8fd4\u97f3\u60c5\u51b5\u3001\u5267\u672c\uff09\u3002**\u5df2\u89e6\u53d1\u6df7\u5408\u4f533\u53f7\uff08\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b\uff09\u7684\u8fdb\u5316\u6273\u673a**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u672a\u63d0\u53ca\u5bb6\u5ead\uff0c\u98ce\u9669\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u5de5\u4f5c\u7e41\u5fd9\u5bfc\u81f4\u8bfe\u7a0b\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\u201d\u7684\u7126\u8651\u548c\u81ea\u8d23\uff0c\u82e5\u957f\u671f\u65e0\u6cd5\u534f\u8c03\u65f6\u95f4\uff0c\u53ef\u80fd\u56e0\u201c\u5b66\u4e86\u767d\u5b66\u201d\u7684\u632b\u8d25\u611f\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u81ea\u6211\u6d88\u5316\u95ee\u9898\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u5df2\u5f00\u59cb\u6295\u7a3f\u5e76\u6709\u6b63\u5411\u53cd\u9988\uff08\u756a\u8304\u53ef\u7533\u8bf7\u7b7e\u7ea6\uff09\uff0c\u5bf9\u53d8\u73b0\u8def\u5f84\u6709\u7406\u6027\u8ba4\u77e5\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u4e2d\u671f\uff08\u7ea6\u7b2c3-4\u5468\uff09**\uff0c\u5f53\u5de5\u4f5c\u4e0e\u5b66\u4e60\u4efb\u52a1\u53cc\u91cd\u9ad8\u538b\u53e0\u52a0\uff0c\u4e14\u672a\u83b7\u5f97\u53ca\u65f6\u7684\u6280\u672f\u652f\u6301\u6216\u6210\u679c\u53cd\u9988\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5cb3\u540c\u5b66\uff0c\u770b\u5230\u4f60\u7ecf\u5e38\u52a0\u73ed\u8fd8\u575a\u6301\u5b66\u4e60\uff0c\u771f\u7684\u5f88\u4f69\u670d\u3002\u54b1\u4eec\u77ed\u5267\u8bfe\u8282\u594f\u5feb\uff0c\u4f46\u522b\u62c5\u5fc3\uff0c\u6240\u6709\u91cd\u70b9\u90fd\u6709\u56de\u653e\u548c\u7b14\u8bb0\uff0c\u4f60\u6839\u636e\u81ea\u5df1\u7684\u65f6\u95f4\u7075\u6d3b\u5b89\u6392\u5c31\u884c\u3002\u9047\u5230\u4efb\u4f55\u64cd\u4f5c\u95ee\u9898\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u5e2e\u4f60\u6700\u5feb\u901f\u5ea6\u641e\u5b9a\uff0c\u7edd\u4e0d\u8ba9\u4f60\u56e0\u4e3a\u6280\u672f\u5361\u58f3\u803d\u8bef\u65f6\u95f4\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176\u9ad8\u52a8\u673a\u548c\u8ffd\u6c42\u6210\u679c\u7684\u8bc9\u6c42\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176**\u65f6\u95f4\u788e\u7247\u5316**\u7684\u7279\u70b9\uff0c\u5fc5\u987b\u8865\u5145 **\u3010\u65f6\u95f4\u5f39\u6027\u515c\u5e95\u5305\u3011**\uff08\u6240\u6709\u8bfe\u7a0b\u63d0\u4f9b\u6e05\u6670\u56de\u653e\u548c\u8981\u70b9\u6587\u6863\uff09\uff1b\u9488\u5bf9\u5176**\u5411\u6df7\u5408\u4f533\u53f7\u8fdb\u5316**\u7684\u8d8b\u52bf\uff0c\u51c6\u5907 **\u3010\u6743\u9650\u89c9\u9192\u8d4b\u80fd\u5305\u3011**\uff08D\u6a21\u5757\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u9519\u8fc7\u76f4\u64ad\u5c31\u6ca1\u673a\u4f1a\u201d\u7b49\u8bdd\u672f\u65bd\u538b\u3002\u7981\u6b62\u5ffd\u89c6\u5176\u56e0\u5de5\u4f5c\u5bfc\u81f4\u7684\u65f6\u95f4\u95ee\u9898\uff0c\u5fc5\u987b\u63d0\u4f9b\u7075\u6d3b\u7684\u89e3\u51b3\u65b9\u6848\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5176\u5df2\u4e3b\u52a8\u8be2\u95ee\u5e76\u9009\u62e9\u9ad8\u9636\u8bfe\u7a0b\uff08\u77ed\u5267\u73ed\uff09\uff0c\u590d\u8d2d\u610f\u613f\u660e\u786e\u3002\u63a8\u4ecb\u65f6\u5e94\u4fa7\u91cd\u8bfe\u7a0b\u5982\u4f55\u5e2e\u52a9\u5176\u66f4\u9ad8\u6548\u5730\u4ea7\u51fa\u9ad8\u8d28\u91cf\u3001\u6613\u8fc7\u7a3f\u7684\u4f5c\u54c1\uff0c\u89e3\u51b3\u5176\u65f6\u95f4\u7a00\u7f3a\u4e0b\u7684\u201c\u6548\u7387\u7126\u8651\u201d\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u540c\u65f6\u591a\u4e0a\u4e86\u4e00\u4e2a\u73ed\u7684\u8bfe\uff0c\u786c\u662f\u5fd9\u6655\u5934\u54d2[\u6c57][\u6c57][\u6c57]**\u201d \u2014\u2014 **\u8d44\u6e90\u5e95\u5ea7\uff08\u65f6\u95f4\uff09\u77ed\u677f\u7684\u6838\u5fc3\u8bc1\u660e**\u3002\n2. > \u201c**\u6211\u5148\u628a\u7ec6\u7eb2\u91cd\u65b0\u505a\u4e86\u4e00\u4e0b\uff0c\u9ebb\u70e6\u5e2e\u6211\u770b\u54c8**\u201d \u2014\u2014 **\u9ad8\u52a8\u673a\u7eaf\u5ea6\u3001\u4e3b\u52a8\u6267\u884c\u529b\u7684\u8bc1\u660e**\u3002\n3. > \u201c**\u5bf9\u4e0d\u4f4f\u5927\u5bb6\uff0c\u9700\u8981\u6211\u91cd\u65b0\u5220\u9664\u4e0a\u4f20\u54c8\u660e\u5929\u4e0a\u5348**\u201d \u2014\u2014 **\u9ad8\u5fc3\u7406\u5f39\u6027\u3001\u6709\u8d23\u4efb\u611f\u3001\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\u7684\u8bc1\u660e**\u3002\n4. > \u201c**\u6211\u60f3\u53bb\u96d5\u7422\u768423\u73ed\uff0c\u9ebb\u70e6\u5e2e\u6211\u7533\u8bf7\u54c8**\u201d \u2014\u2014 **\u660e\u786e\u7684\u9ad8\u9636\u8bfe\u7a0b\u590d\u8d2d\u610f\u5411\uff0cB\u7c7b\u7528\u6237\u5178\u578b\u7279\u5f81**\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2\u4f4e\u8c03\u8001\u9ec4\u725b\uff08\u6b63\u5411\u6df7\u5408\u4f533\u53f7\u8fdb\u5316\u4e2d\uff09\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4e0e\u9ad8\u6548\u4ea7\u51fa\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u81f4\u7075\u6d3b\u7684\u65f6\u95f4\u89e3\u51b3\u65b9\u6848\uff0c\u5e76\u9002\u65f6\u8d4b\u4e88\u5176\u5c0f\u7ec4\u7ba1\u7406\u6216\u5e2e\u6276\u89d2\u8272\uff08D\u6a21\u5757\uff09\uff0c\u5c06\u5176\u56fa\u5316\u4e3a\u73ed\u7ea7\u751f\u6001\u5efa\u8bbe\u8005\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b (\u5411\u6df7\u5408\u4f533\u53f7\u8fdb\u5316)\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u65f6\u95f4\u5f39\u6027\u515c\u5e95\u5305 + \u6743\u9650\u89c9\u9192\u8d4b\u80fd\u5305\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
