    <script>
        const markdownText = "\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e\u3002\u7f3a\u652f\u4ed8\u65b9\u5f0f\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u3001\u6536\u5165\u6c34\u5e73\u3001\u804c\u4e1a\u72b6\u6001\u3001\u8fc7\u5f80\u5b66\u4e60\u6295\u5165\u3001\u5177\u4f53\u9000\u8d39\u653f\u7b56\u6c9f\u901a\u7b49\u5173\u952e\u4fe1\u606f\u3002\n\n# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u4e0e\u98ce\u63a7\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49)**\n    *   **\u5b66\u4e60\u9a71\u52a8**\uff1a\u4e3b\u52a8\u63d0\u4ea4\u4f5c\u4e1a\u3001\u8bd5\u97f3\uff0c\u5bfb\u6c42\u53cd\u9988\uff08\u201c\u611f\u89c9\u542c\u7740\u8fd8\u662f\u4e0d\u6ee1\u610f\u201d\uff09\uff0c\u5173\u6ce8\u8bfe\u7a0b\u56de\u653e\uff0c\u6709\u660e\u786e\u63d0\u5347\u610f\u613f\u3002\n    *   **\u793e\u4ea4/\u60c5\u611f\u9a71\u52a8**\uff1a\u5728\u7fa4\u5185\u5206\u4eab\u4e2a\u4eba\u751f\u6d3b\uff08\u9003\u5a5a\u3001\u76f8\u4eb2\uff09\uff0c\u5bfb\u6c42\u60c5\u611f\u5171\u9e23\u4e0e\u652f\u6301\u3002\n    *   **\u53d8\u73b0\u9a71\u52a8**\uff1a\u53c2\u4e0e\u201c\u7532\u65b9\u76f4\u901a\u8f66\u201d\u8bd5\u97f3\uff0c\u5173\u6ce8\u7248\u6743\u4e66\u8d44\u6e90\uff0c\u4f46\u5bf9\u9ad8\u5ba2\u5355\u4ef7\u8bfe\u7a0b\uff08\u9ad8\u7814\u73ed\uff09\u51b3\u7b56\u53d7\u73b0\u5b9e\u56e0\u7d20\uff08\u65f6\u95f4\u3001\u7ecf\u6d4e\uff09\u5236\u7ea6\uff0c**\u53d8\u73b0\u7d27\u8feb\u611f\u4e0d\u5f3a**\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4fe1\u606f\u4e0d\u8db3\uff0c\u503e\u5411\u4e2d\u7b49\u504f\u4f4e)**\n    *   **\u7ecf\u6d4e\u8d44\u6e90**\uff1a\u5df2\u652f\u4ed82399\u5143\u8bfe\u7a0b\uff0c\u4f46\u5bf917800-19800\u5143\u9ad8\u7814\u73ed\u8868\u73b0\u51fa\u4ef7\u683c\u654f\u611f\uff08\u8be2\u95ee\u5305\u4f4f\u5bbf\u3001\u7f34\u8d39\u8282\u70b9\uff09\uff0c**\u6697\u793a\u652f\u4ed8\u80fd\u529b\u6709\u9650\u6216\u51b3\u7b56\u8c28\u614e**\u3002\u63d0\u53ca\u76f8\u4eb2\u5bf9\u8c61\u7ecf\u6d4e\u6761\u4ef6\u597d\u4f46\u81ea\u5df1\u201c\u4e0d\u770b\u91cd\u201d\uff0c\u4fa7\u9762\u53cd\u6620\u81ea\u8eab\u7ecf\u6d4e\u72b6\u51b5\u53ef\u80fd\u4e00\u822c\u3002\n    *   **\u65f6\u95f4\u8d44\u6e90**\uff1a\u6709\u5de5\u4f5c\uff08\u63d0\u53ca\u201c\u665a\u4e0a\u4e0b\u73ed\u201d\uff09\uff0c\u4f46\u80fd\u6295\u5165\u65f6\u95f4\u5b66\u4e60\u3001\u7ec3\u4e60\u3001\u8bd5\u97f3\u3002\u5bf9\u9ad8\u7814\u73ed\u65f6\u95f4\u4e0d\u786e\u5b9a\uff08\u201c5\u6708\u6211\u80af\u5b9a\u4e0d\u53bb\u7684\u201d\uff09\uff0c**\u65f6\u95f4\u81ea\u7531\u5ea6\u53d7\u9650**\u3002\n    *   **\u8bbe\u5907/\u73af\u5883\u8d44\u6e90**\uff1a\u62e5\u6709\u5f55\u97f3\u8bbe\u5907\uff08\u9ea6\u514b\u98ce\u3001AU\u8f6f\u4ef6\uff09\uff0c\u4f46\u5b58\u5728\u6280\u672f\u95ee\u9898\uff08AU\u65e0\u6cd5\u4fdd\u5b58\uff09\u3002\u8ba1\u5212\u201c\u51fa\u8fdc\u95e8\u201d\u4e14\u201c\u4e0d\u5e26\u9ea6\u514b\u98ce\u201d\uff0c**\u5b66\u4e60\u73af\u5883\u53ef\u80fd\u4e0d\u7a33\u5b9a**\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u7b49\u504f\u9ad8)**\n    *   **\u632b\u6298\u5e94\u5bf9**\uff1a\u5bf9\u81ea\u8eab\u95ee\u9898\uff08\u201c\u4e0d\u81ea\u7136\u201d\u3001\u201c\u8d8a\u6539\u8d8a\u4e71\u201d\uff09\u6709\u89c9\u5bdf\uff0c\u80fd\u63a5\u53d7\u53cd\u9988\u5e76\u8c03\u6574\uff08\u201c\u4eca\u665a\u7684\u72b6\u6001\u8fd8\u662f\u633a\u597d\u7684\u201d\uff09\uff0c**\u6709\u4e00\u5b9a\u8010\u632b\u6027**\u3002\n    *   **\u4e3b\u52a8\u6027**\uff1a\u4e3b\u52a8\u63d0\u95ee\u3001\u4ea4\u4f5c\u4e1a\u3001\u7d22\u8981\u8d44\u6e90\uff08\u201c\u4eb2\uff0c\u8fd8\u4f5c\u6570\u5417\uff1f\u201d\uff09\u3001\u8bf7\u6c42\u642d\u97f3\uff0c**\u5b66\u4e60\u884c\u52a8\u529b\u5f3a**\u3002\n    *   **\u4f9d\u8d56\u6027**\uff1a\u9891\u7e41\u5411\u9500\u552e/\u73ed\u73ed\u5bfb\u6c42\u6280\u672f\u6307\u5bfc\u3001\u60c5\u611f\u652f\u6301\u3001\u8d44\u6e90\u534f\u8c03\uff0c**\u5b58\u5728\u4e2d\u5ea6\u60c5\u611f\u4e0e\u51b3\u7b56\u4f9d\u8d56**\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5** \u2705 \u5df2\u652f\u4ed82399\u5143\u8bfe\u7a0b\u8d39\u7528\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5** \u26a0\ufe0f **\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u63d0\u53ca\u201c\u5bb6\u91cc\u4eba\u7ed9\u8ba2\u4eb2\u201d\u3001\u201c\u9003\u5a5a\u201d\uff0c\u663e\u793a\u5728\u91cd\u5927\u4eba\u751f\u51b3\u7b56\u4e0a\u53ef\u80fd\u4e0e\u5bb6\u5ead\u5b58\u5728\u51b2\u7a81\uff0c\u4f46**\u672a\u63d0\u53ca\u6559\u80b2\u6d88\u8d39\u662f\u5426\u9700\u5bb6\u5ead\u652f\u6301\u6216\u77e5\u60c5**\uff0c\u6b64\u70b9\u4e3a\u5173\u952e\u98ce\u9669\u655e\u53e3\u3002\n*   **\u6b65\u9aa42\uff1a\u52a8\u673a-\u8d44\u6e90\u77e9\u9635\u5b9a\u4f4d**\n    *   \u52a8\u673a\u4e2d\u7b49\uff08\u5b66\u4e60+\u793e\u4ea4\uff09\uff0c\u8d44\u6e90\u503e\u5411\u4e2d\u7b49\u504f\u4f4e\uff08\u7ecf\u6d4e\u654f\u611f\u3001\u65f6\u95f4\u53d7\u9650\u3001\u73af\u5883\u53ef\u80fd\u53d8\u52a8\uff09\u3002**\u521d\u6b65\u5b9a\u4f4dB\u7c7b\uff08\u6f5c\u529b\u578b\u4f46\u8d44\u6e90\u53d7\u9650\uff09\u6216C\u7c7b\uff08\u4f53\u9a8c\u578b\u5b66\u4e60\u8005\uff09\u8fb9\u7f18**\u3002\u9ad8\u5ba2\u5355\u4ef7\u8f6c\u5316\u8bd5\u63a2\u4e2d\u66b4\u9732\u8d44\u6e90\u77ed\u677f\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u6700\u5339\u914d\uff1aT4 \u8d44\u6e90\u654f\u611f\u578b\u52a1\u5b9e\u8005**\n    *   \u6838\u5fc3\u7279\u5f81\uff1a\u5b66\u4e60\u884c\u52a8\u529b\u5f3a\uff0c\u5173\u6ce8\u5b9e\u64cd\u4e0e\u8d44\u6e90\uff08\u8bd5\u97f3\u3001\u7248\u6743\u4e66\uff09\uff0c\u4f46\u5bf9\u9ad8\u5ba2\u5355\u4ef7\u4ea7\u54c1\u4ef7\u683c\u654f\u611f\uff0c\u51b3\u7b56\u53d7\u73b0\u5b9e\u6761\u4ef6\uff08\u65f6\u95f4\u3001\u7ecf\u6d4e\uff09\u7ea6\u675f\u3002\u7b26\u5408\u5176\u5173\u6ce8\u6027\u4ef7\u6bd4\u3001\u53cd\u590d\u786e\u8ba4\u798f\u5229\uff08\u201c\u8fd8\u4f5c\u6570\u5417\uff1f\u201d\uff09\u3001\u5728\u9ad8\u4ef7\u8bfe\u7a0b\u524d\u72b9\u8c6b\u7684\u8868\u73b0\u3002\n*   **\u6b21\u5339\u914d\uff1aT7 \u60c5\u611f\u5bc4\u6258\u578b\u5b66\u5458**\n    *   \u6838\u5fc3\u7279\u5f81\uff1a\u5c06\u5b66\u4e60\u793e\u7fa4\u4f5c\u4e3a\u60c5\u611f\u51fa\u53e3\u548c\u793e\u4ea4\u652f\u6301\u3002\u7528\u6237\u4e3b\u52a8\u5206\u4eab\u201c\u9003\u5a5a\u201d\u7b49\u4e2a\u4eba\u9690\u79c1\uff0c\u5bfb\u6c42\u73ed\u73ed\u60c5\u611f\u56de\u5e94\uff0c\u663e\u793a\u8f83\u5f3a\u7684\u60c5\u611f\u8054\u7ed3\u9700\u6c42\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4e2d)\n| \u9000\u8d39\u6839\u56e0 | \u98ce\u9669\u7b49\u7ea7 | \u8bc1\u636e\u4e0e\u8bf4\u660e |\n| :--- | :--- | :--- |\n| **1. \u6548\u679c\u672a\u8fbe\u9884\u671f** | \u4e2d | \u5df2\u8868\u9732\u5bf9\u5b66\u4e60\u6548\u679c\u7684\u7126\u8651\uff08\u201c\u4e0d\u6ee1\u610f\u201d\u3001\u201c\u4e0d\u77e5\u9053\u600e\u4e48\u56de\u4e8b\u201d\uff09\u3002\u82e5\u540e\u671f\u8fdb\u6b65\u611f\u77e5\u4e0d\u5f3a\uff0c\u98ce\u9669\u5347\u9ad8\u3002 |\n| **2. \u7ecf\u6d4e\u538b\u529b** | **\u4e2d\u9ad8** | **\u5173\u952e\u96f7\u533a**\u3002\u5bf9\u9ad8\u5ba2\u5355\u4ef7\u8bfe\u7a0b\u4ef7\u683c\u654f\u611f\uff0c\u4e14\u4e2a\u4eba\u751f\u6d3b\u5904\u4e8e\u53d8\u52a8\u671f\uff08\u201c\u9003\u5a5a\u201d\u3001\u201c\u6295\u5954\u5b66\u59d0\u201d\uff09\uff0c**\u7ecf\u6d4e\u7a33\u5b9a\u6027\u5b58\u7591**\u3002 |\n| 3. \u65f6\u95f4\u51b2\u7a81 | \u4e2d | \u660e\u786e\u8868\u793a5\u6708\u6ca1\u65f6\u95f4\uff0c\u672a\u6765\u65f6\u95f4\u4e0d\u786e\u5b9a\uff08\u201c\u4e0d\u786e\u5b9a\u540e\u9762\u4f1a\u53d1\u751f\u4ec0\u4e48\u201d\uff09\u3002 |\n| 4. \u4ea7\u54c1\u4e0d\u7b26 | \u4f4e | \u76ee\u524d\u79ef\u6781\u53c2\u4e0e\u8bfe\u7a0b\u6d3b\u52a8\u4e0e\u8d44\u6e90\u4f7f\u7528\uff0c\u672a\u663e\u9519\u914d\u3002 |\n| 5. \u9500\u552e\u8bef\u5bfc | \u4f4e | \u9500\u552e\u6c9f\u901a\u4ee5\u9f13\u52b1\u3001\u63d0\u4f9b\u8d44\u6e90\u4e3a\u4e3b\uff0c\u672a\u89c1\u8fc7\u5ea6\u627f\u8bfa\u3002\u4f46**\u201c\u5c0f\u9053\u6d88\u606f\uff1a7\u6708\u5f00\u59cb\u5927\u5e08\u73ed\u4e0d\u7ed9\u7248\u6743\u4e66\u201d** \u5c5e\u4e8e\u5236\u9020\u7a00\u7f3a\u6027\u7684\u8bdd\u672f\uff0c\u9700\u6ce8\u610f\u3002 |\n| **6. \u5bb6\u5ead\u53cd\u5bf9** | **\u4e2d\u9ad8** | **\u5173\u952e\u96f7\u533a**\u3002**\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u7f3a\u5931**\uff0c\u4e14\u7528\u6237\u6b63\u56e0\u201c\u8ba2\u4eb2\u201d\u4e0e\u5bb6\u5ead\u4ea7\u751f\u77db\u76fe\uff0c**\u5b58\u5728\u5bb6\u5ead\u53d1\u73b0\u6d88\u8d39\u540e\u65bd\u538b\u9000\u8d39\u7684\u98ce\u9669**\u3002 |\n| 7. \u670d\u52a1\u4f53\u9a8c | \u4f4e | \u4e0e\u9500\u552e/\u73ed\u73ed\u4e92\u52a8\u9891\u7e41\u4e14\u878d\u6d3d\uff0c\u670d\u52a1\u4f53\u9a8c\u6b63\u5411\u3002 |\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u2705 \u57fa\u672c\u5408\u89c4**\uff1a\u9500\u552e\u63d0\u4f9b\u4e86\u5177\u4f53\u670d\u52a1\uff08\u53cd\u9988\u3001\u8d44\u6e90\u94fe\u63a5\uff09\uff0c\u672a\u53d1\u73b0\u8fb1\u9a82\u3001\u6b3a\u8bc8\u3002\n*   **\u26a0\ufe0f \u98ce\u9669\u63d0\u793a**\uff1a\n    1.  **\u7a00\u7f3a\u6027\u8bdd\u672f**\uff1a\u4f7f\u7528\u201c\u5c0f\u9053\u6d88\u606f\u201d\u6697\u793a\u653f\u7b56\u53d8\u52a8\u4fc3\u5355\uff0c\u9700\u8c28\u614e\u3002\n    2.  **\u60c5\u611f\u8fb9\u754c**\uff1a\u9500\u552e\u6df1\u5ea6\u4ecb\u5165\u7528\u6237\u4e2a\u4eba\u60c5\u611f\u751f\u6d3b\uff08\u76f8\u4eb2\u3001\u9003\u5a5a\uff09\uff0c\u867d\u63d0\u5347\u4e86\u9ecf\u6027\uff0c\u4f46\u4e5f**\u53ef\u80fd\u6a21\u7cca\u670d\u52a1\u8fb9\u754c\uff0c\u589e\u52a0\u975e\u7406\u6027\u51b3\u7b56\u6216\u540e\u7eed\u60c5\u611f\u7ed1\u67b6\u98ce\u9669**\u3002\n    3.  **\u77e5\u60c5\u540c\u610f**\uff1a**\u672a\u53d1\u73b0\u5bf9\u9ad8\u7814\u73ed\u8bfe\u7a0b\u6548\u679c\u3001\u9000\u6b3e\u653f\u7b56\u7b49\u5173\u952e\u6761\u6b3e\u7684\u660e\u786e\u4e66\u9762\u544a\u77e5\u6216\u786e\u8ba4**\uff0c\u4ec5\u505c\u7559\u5728\u53e3\u5934\u6c9f\u901a\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d\u8bc4\u4f30**\uff1a**\u5339\u914d**\u3002\u5f53\u524d2399\u5143\u8bfe\u7a0b\u4e0e\u5176\u5b66\u4e60\u6295\u5165\u5ea6\u548c\u8d44\u6e90\u6c34\u5e73\u5339\u914d\u3002\u9ad8\u7814\u73ed\uff0815800+\uff09**\u5b58\u5728\u9519\u914d\u98ce\u9669**\uff0c\u9700\u4e25\u683c\u8bc4\u4f30\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**24h\u5185\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\u4e0e\u652f\u4ed8\u80fd\u529b**\n*   **\u5177\u4f53\u884c\u52a8\u5efa\u8bae**\uff1a\n    1.  **\u98ce\u9669\u6838\u5b9e**\uff1a\u4ee5\u5173\u6000\u65b9\u5f0f\uff0c\u6e29\u548c\u6838\u5b9e\u9ad8\u989d\u6559\u80b2\u6d88\u8d39\u662f\u5426\u5df2\u4e0e\u5bb6\u4eba\u6c9f\u901a\u5e76\u83b7\u5f97\u652f\u6301\u3002\u4e86\u89e3\u5176\u5f53\u524d\u7ecf\u6d4e\u6765\u6e90\u4e0e\u7a33\u5b9a\u6027\u3002\n    2.  **\u9884\u671f\u7ba1\u7406**\uff1a\u5f3a\u5316\u5f53\u524d\u8bfe\u7a0b\u7684\u5b66\u4e60\u8def\u5f84\u4e0e\u53d8\u73b0\u6848\u4f8b\uff0c\u964d\u4f4e\u5176\u5bf9\u201c\u9ad8\u7814\u73ed\u201d\u4f5c\u4e3a\u552f\u4e00\u6210\u529f\u8def\u5f84\u7684\u5e7b\u60f3\u3002\u660e\u786e\u544a\u77e5\u9ad8\u7814\u73ed\u9000\u6b3e\u653f\u7b56\u4e0e\u670d\u52a1\u6761\u6b3e\u3002\n    3.  **\u60c5\u611f\u652f\u6301\u4e0e\u8fb9\u754c**\uff1a\u4fdd\u6301\u60c5\u611f\u652f\u6301\uff0c\u4f46\u9010\u6b65\u5c06\u8bdd\u9898\u5f15\u5bfc\u56de\u5b66\u4e60\u4e0e\u804c\u4e1a\u6210\u957f\uff0c\u907f\u514d\u8fc7\u5ea6\u5377\u5165\u5176\u5bb6\u5ead\u77db\u76fe\u3002\n    4.  **\u5b66\u4e60\u52a0\u56fa**\uff1a\u9488\u5bf9\u5176\u201c\u4e0d\u6ee1\u610f\u201d\u7684\u70b9\uff0c\u63d0\u4f9b\u66f4\u5177\u4f53\u7684\u6280\u672f\u6307\u5bfc\u548c\u8fdb\u6b65\u6b63\u53cd\u9988\uff0c\u5de9\u56fa\u73b0\u6709\u8bfe\u7a0b\u4ef7\u503c\u611f\u3002\n    5.  **\u9ad8\u5ba2\u5355\u4ef7\u8f6c\u5316\u6682\u7f13**\uff1a\u5728\u672a\u660e\u786e\u5176\u7ecf\u6d4e\u7a33\u5b9a\u6027\u548c\u5bb6\u5ead\u652f\u6301\u524d\uff0c\u6682\u505c\u9ad8\u7814\u73ed\u7684\u5f3a\u529b\u63a8\u9500\uff0c\u8f6c\u5411\u9f13\u52b1\u5176\u7528\u597d\u73b0\u6709\u8d44\u6e90\uff0c\u4ea7\u51fa\u4f5c\u54c1\u3002\n\n{\"core_type\": \"T4 \u8d44\u6e90\u654f\u611f\u578b\u52a1\u5b9e\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u5339\u914d\", \"action\": \"24h\u5185\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\u4e0e\u652f\u4ed8\u80fd\u529b\"}";
