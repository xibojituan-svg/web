    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | 677151334 (\u6708\u8272\u4e0d\u504f) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5fae\u98ce\u5f90\u67657(\u5f90\u5c0f\u6d01) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u9ad8\u9636\u73ed (7380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u5145\u88d5 (\u63d0\u53ca\u627e\u5148\u751f\u62a5\u9500\u53d1\u7968\uff0c\u8868\u660e\u5bb6\u5ead\u7ecf\u6d4e\u652f\u6301) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u9ad8\u5bbd\u88d5 (\u7528\u6237\u81ea\u79f0\u201c\u6563\u6f2b\u60ef\u4e86\u201d\uff0c\u5973\u513f\u5df2\u4e0a\u5927\u5b66\uff0c\u65f6\u95f4\u81ea\u7531) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u5df2\u62a5\u5907\u5e76\u652f\u6301 (\u4e3b\u52a8\u63d0\u53ca\u627e\u5148\u751f\u62a5\u9500\uff0c\u8868\u660e\u5bb6\u4eba\u77e5\u60c5\u4e14\u652f\u6301) |\n| **\u4fe1\u606f\u539a\u5ea6** | \u9971\u6ee1 (\u5b66\u4e60\u4e92\u52a8\u3001\u5bb6\u5ead\u80cc\u666f\u3001\u652f\u4ed8\u610f\u613f\u5747\u6709\u660e\u786e\u4fe1\u606f) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u81ea\u6211\u4ef7\u503c\u800c\u6765\uff0c\u5174\u8da3\u9a71\u52a8\u660e\u663e\uff0c\u5bf9\u53d8\u73b0\u65e0\u6025\u8feb\u8981\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u6211\u8fd9\u4e2a\u5c81\u6570\u56de\u5934\u770b\u770b\uff0c\u603b\u611f\u89c9\u4e0d\u52a1\u6b63\u4e1a\u592a\u4e45\u4e86\uff0c\u8d81\u7740\u8fd8\u6ca1\u592a\u8001\uff0c\u627e\u4e2a\u4e8b\u60c5\u4f53\u73b0\u4f53\u73b0\u81ea\u6211\u4ef7\u503c\u8fd8\u662f\u53ef\u4ee5\u8bd5\u8bd5\u770b\u7684\u201d\n> \u201c\u4e3b\u8981\u662f\u8fd9\u4e2a\u4e1c\u897f\u771f\u7684\u633a\u6709\u610f\u601d...\u6240\u4ee5\u6211\u89c9\u5f97\u55ef\u53ef\u80fd\u4ee5\u540e\u5de5\u4f5c\u7684\u8bdd\u65f6\u95f4\u4e0a\u4e5f\u4f1a\u6bd4\u8f83\u5bcc\u4f59\uff0c\u5c31\u662f\u6bd4\u8f83\u81ea\u7531\u4e00\u4e9b\u201d\n> \u201c\u672c\u6765\u60f3\u6d77\u8fb9\u8e0f\u8e0f\u6c34\uff0c\u542c\u5b8c\u60f3\u9068\u6e38\u5927\u6d77\u4e86[\u5077\u7b11]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b06\u9ad8\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a\u9ad8 \u2014 7380\u5143\u5168\u6b3e\u652f\u4ed8\uff0c\u4e14\u8f7b\u677e\u8868\u793a\u201c\u627e\u5148\u751f\u62a5\u9500\u201d\uff0c\u65e0\u4efb\u4f55\u8d44\u91d1\u538b\u529b\u8868\u8ff0\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a\u9ad8 \u2014 \u81ea\u79f0\u201c\u6563\u6f2b\u60ef\u4e86\u201d\uff0c\u5973\u513f\u5df2\u4e0a\u5927\u5b66\uff0c\u65f6\u95f4\u81ea\u7531\u5145\u88d5\uff1b\u80fd\u79ef\u6781\u53c2\u4e0e\u76f4\u64ad\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u53cd\u590d\u6253\u78e8\u5f55\u97f3\uff0c\u7cbe\u529b\u6295\u5165\u5ea6\u9ad8\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a\u9ad8 \u2014 \u4e3b\u52a8\u63d0\u53ca\u201c\u627e\u6211\u5148\u751f\u7ed9\u6211\u62a5\u9500\u53bb\u201d\uff0c\u8868\u660e\u5bb6\u5ead\u7ecf\u6d4e\u652f\u6301\u4e14\u77e5\u60c5\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9047\u5230\u56f0\u96be\uff08\u5982\u5f55\u97f3\u4e0d\u6ee1\u610f\u3001\u64cd\u4f5c\u95ee\u9898\uff09\u4e3b\u52a8\u5bfb\u6c42\u5177\u4f53\u89e3\u51b3\u65b9\u6848\uff0c\u800c\u975e\u60c5\u7eea\u5ba3\u6cc4\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u6211\u5f55\u4e86\u597d\u591a\u7248\uff0c\u8d8a\u542c\u8d8a\u4e0d\u884c[\u5c34\u5c2c]\u201d (\u81ea\u6211\u53cd\u601d)\n> \u201c\u5e08\u59d0\uff0c\u8fd9\u4e2a\u8bd5\u97f3\u662f\u4e0d\u662f\u8fd8\u662f\u53ef\u4ee5\u53ea\u9009\u53ea\u9009\u65c1\u767d\uff1f\u201d (\u4e3b\u52a8\u786e\u8ba4\u89c4\u5219)\n> \u201c\u5e08\u59d0\uff0c\u6700\u540e\u4e00\u6bb5\u4e0d\u77e5\u9053\u600e\u4e48\u65ad\u53e5\u201d (\u5bfb\u6c42\u5177\u4f53\u6280\u672f\u6307\u5bfc)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 (\u6e34\u671b\u8ba4\u53ef\u4e0e\u81ea\u6211\u4ef7\u503c\u5b9e\u73b0)\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u4e2d\u5e74\u9636\u6bb5\u5bf9\u8fc7\u5f80\u201c\u4e0d\u52a1\u6b63\u4e1a\u201d\u7684\u9057\u61be\uff0c\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u65b0\u6280\u80fd\u3001\u83b7\u5f97\u65b0\u8eab\u4efd\u6765\u8bc1\u660e\u81ea\u5df1\uff0c\u4f53\u73b0\u81ea\u6211\u4ef7\u503c\uff0c\u83b7\u5f97\u793e\u4f1a\u4e0e\u5bb6\u5ead\u7684\u5c0a\u91cd\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u8ba4\u53ef\u4e0e\u6210\u5c31\u611f\u8d4b\u4e88**\u3002\u80af\u5b9a\u4ed6\u7684\u5b66\u4e60\u80fd\u529b\u3001\u8fdb\u6b65\u548c\u9009\u62e9\uff0c\u5c06\u4ed6\u89c6\u4e3a\u201c\u6f5c\u529b\u80a1\u201d\u548c\u201c\u5708\u5185\u4eba\u201d\uff0c\u63d0\u4f9b\u5c55\u793a\u5e73\u53f0\u548c\u8eab\u4efd\u8ba4\u540c\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \u2b50A \u7c7b (\u4ef7\u503c\u5171\u521b\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | T2 \u4f4e\u8c03\u5b9e\u5e72\u578b (\u517c\u987e T5 \u597d\u73a9\u5c1d\u9c9c\u578b\u7279\u8d28) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u6781\u4f4e | \u5bb6\u4eba\u77e5\u60c5\u4e14\u652f\u6301\uff0c\u4e3b\u52a8\u63d0\u53ca\u62a5\u9500\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u65f6\u95f4\u5145\u88d5\uff0c\u5b66\u4e60\u4e3b\u52a8\u6027\u5f3a\uff0c\u5d29\u76d8\u98ce\u9669\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u5230\u95ee\u9898\u4e3b\u52a8\u6c42\u89e3\u800c\u975e\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u82e5\u5b66\u4e60\u540e\u671f\u53d1\u73b0\u63a5\u5355\u673a\u4f1a\u3001\u6536\u5165\u6c34\u5e73\u4e0e\u521d\u671f\u201c\u4f53\u73b0\u4ef7\u503c\u201d\u7684\u6a21\u7cca\u671f\u5f85\u4e0d\u7b26\uff0c\u53ef\u80fd\u4ea7\u751f\u5931\u843d\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe2-3\u4e2a\u6708\u540e\uff0c\u5f53\u6280\u80fd\u8fdb\u5165\u5e73\u53f0\u671f\uff0c\u4e14\u672a\u83b7\u5f97\u9884\u671f\u4e2d\u7684\u201c\u4ef7\u503c\u8ba4\u53ef\u201d\uff08\u5982\u63a5\u5355\u673a\u4f1a\u3001\u793e\u7fa4\u8ba4\u53ef\uff09\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6708\u8272\u540c\u5b66\uff0c\u770b\u4e86\u4f60\u524d\u51e0\u5929\u7684\u4f5c\u4e1a\u548c\u4e92\u52a8\uff0c\u80fd\u611f\u89c9\u5230\u4f60\u4e0d\u4ec5\u5b66\u5f97\u5feb\uff0c\u800c\u4e14\u5bf9\u2018\u6709\u58f0\u2019\u8fd9\u4ef6\u4e8b\u672c\u8eab\u6709\u5f88\u6df1\u7684\u70ed\u7231\u548c\u601d\u8003\u3002\u6211\u4eec\u8fd9\u4e2a\u73ed\u91cc\u6709\u4e0d\u5c11\u50cf\u4f60\u4e00\u6837\uff0c\u5e0c\u671b\u7528\u58f0\u97f3\u63a2\u7d22\u65b0\u53ef\u80fd\u3001\u5b9e\u73b0\u65b0\u4ef7\u503c\u7684\u540c\u5b66\u3002\u63a5\u4e0b\u6765\u7684\u56db\u4e2a\u6708\uff0c\u6211\u4f1a\u91cd\u70b9\u5e2e\u4f60\u5bf9\u63a5\u9002\u5408\u4f60\u98ce\u683c\u7684\u8d44\u6e90\u548c\u5c55\u793a\u673a\u4f1a\uff0c\u8ba9\u4f60\u6bcf\u4e00\u6b65\u7684\u6210\u957f\u90fd\u88ab\u770b\u89c1\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011+\u3010\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\u3011\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176T2\uff08\u5b9e\u5e72\uff09\u548c\u5c0a\u91cd\u9700\u6c42\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a\u3010\u65e9\u671f\u5b9e\u8df5\u673a\u4f1a\u5305\u3011\uff08\u5982\u7b80\u5355\u753b\u672c\u3001\u5bf9\u8f68\u4efb\u52a1\uff09\u3001\u3010\u5185\u90e8\u5c55\u793a\u4e0e\u70b9\u8bc4\u7279\u6743\u3011\uff08\u5982\u4f18\u79c0\u4f5c\u4e1a\u5c55\u793a\u3001\u5bfc\u5e081v1\u70b9\u8bc4\uff09\u3001\u3010\u8f7b\u91cf\u7ea7\u793e\u7fa4\u89d2\u8272\u3011\uff08\u5982\u5c0f\u7ec4\u957f\u3001\u5185\u5bb9\u5206\u4eab\u8005\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u5b9d\u5988\u9006\u88ad\u201d\u3001\u201c\u6708\u5165\u8fc7\u4e07\u201d\u7b49\u4e0b\u6c89\u7126\u8651\u8bdd\u672f\u8fdb\u884cPUA\u3002\u907f\u514d\u8fc7\u5ea6\u627f\u8bfa\u77ed\u671f\u53d8\u73b0\uff0c\u7834\u574f\u5176\u8ffd\u6c42\u957f\u671f\u4ef7\u503c\u5b9e\u73b0\u7684\u521d\u5fc3\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u5f53\u524d\u4ea7\u54c1\u5339\u914d\u5ea6\u5df2\u9ad8\uff0c\u65e0\u9700\u989d\u5916\u5347\u5355\u3002\u540e\u7eed\u53ef\u57fa\u4e8e\u5176\u5b66\u4e60\u6210\u679c\uff0c\u81ea\u7136\u63a8\u8350\u66f4\u9ad8\u7ea7\u7684\u5708\u5c42\u6216\u8d44\u6e90\u5bf9\u63a5\u670d\u52a1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u8fd9\u4e2a\u5c81\u6570\u56de\u5934\u770b\u770b\uff0c\u603b\u611f\u89c9\u4e0d\u52a1\u6b63\u4e1a\u592a\u4e45\u4e86\uff0c\u8d81\u7740\u8fd8\u6ca1\u592a\u8001\uff0c\u627e\u4e2a\u4e8b\u60c5\u4f53\u73b0\u4f53\u73b0\u81ea\u6211\u4ef7\u503c\u8fd8\u662f\u53ef\u4ee5\u8bd5\u8bd5\u770b\u7684\u201d\n2. > \u201c\u90a3\u9ebb\u70e6\u7ed9\u6211\u5f00\u4e2a\u53d1\u7968\uff0c\u6211\u627e\u6211\u5148\u751f\u7ed9\u6211\u62a5\u9500\u53bb[\u5077\u7b11]\u201d\n3. > \u201c\u6211\u5f55\u4e86\u597d\u591a\u7248\uff0c\u8d8a\u542c\u8d8a\u4e0d\u884c[\u5c34\u5c2c]\u201d & \u201c\u5e08\u59d0\uff0c\u6700\u540e\u4e00\u6bb5\u4e0d\u77e5\u9053\u600e\u4e48\u65ad\u53e5\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2\u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u5c0a\u91cd\u4e0e\u81ea\u6211\u4ef7\u503c\u5b9e\u73b0**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4f4e**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u6301\u7eed\u63d0\u4f9b\u6210\u5c31\u611f\u53cd\u9988\u548c\u65e9\u671f\u5b9e\u8df5\u673a\u4f1a\uff0c\u6ee1\u8db3\u5176\u201c\u88ab\u770b\u89c1\u3001\u88ab\u8ba4\u53ef\u201d\u7684\u6838\u5fc3\u9700\u6c42**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"maslow_need\": \"\u7b2c\u56db\u5c42\u5c0a\u91cd\u9700\u6c42\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\"}\n```";
