    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a550662878\u7684\u7528\u6237\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 550662878 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u7bf1\u4eba1(\u9ad8\u7af9\u7c89) / \u79cb\u7c73\u679c(\u767d\u82b3) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u7cbe\u82f1\u73ed\u8bfe\u7a0b (3980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3** (\u9700\u5411\u5bb6\u91cc\u8981\u94b1\uff0c\u81ea\u8eab\u8d44\u91d1\u4e0d\u8db3) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u4e0a\u73ed\u65cf\uff0c\u665a\u4e0a10\u70b9\u7761\u89c9\uff0c\u767d\u5929\u4e0a\u73ed) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u9690\u7792\u5077\u62a5** (\u5b66\u751f\uff0c\u9700\u5411\u7236\u6bcd\u8981\u94b1\u4f46\u672a\u83b7\u5f97\u652f\u6301) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u5bf9\u6709\u58f0\u884c\u4e1a\u6709\u5174\u8da3\uff08\u559c\u6b22\u53e4\u98ce\uff09\uff0c\u6709\u53d8\u73b0\u610f\u613f\uff08\u8be2\u95ee\u201c\u8bd5\u4e0a\u4e86\uff0c\u662f\u8981\u4ea4\u94b1\u624d\u80fd\u63a5\u5355\u5417\u201d\uff09\uff0c\u4f46\u5e76\u975e\u6781\u901f\u53d8\u73b0\u9a71\u52a8\uff0c\u66f4\u591a\u662f\u51fa\u4e8e\u5174\u8da3\u548c\u6280\u80fd\u63d0\u5347\u7684\u63a2\u7d22\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u8fd8\u662f\u5b66\u751f\uff0c\u6211\u8981\u8ddf\u5bb6\u91cc\u9762\u8981\u201d > \u201c\u6211\u60f3\u81ea\u5df1\u8d5a\u94b1\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u5b66\u751f\u8eab\u4efd\uff0c\u7ecf\u6d4e\u4e0d\u72ec\u7acb\uff0c\u9700\u5411\u5bb6\u91cc\u8981\u94b1\uff0c\u652f\u4ed8\u8bfe\u7a0b\u8d39\u7528\u5b58\u5728\u56f0\u96be\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u6709\u56fa\u5b9a\u5de5\u4f5c\uff087\u70b9\u4e0b\u73ed\uff09\uff0c\u4f46\u65f6\u95f4\u788e\u7247\u5316\uff0c\u5b66\u4e60\u9700\u5728\u665a\u4e0a\u8fdb\u884c\uff0c\u4e14\u56e0\u201c\u5bbf\u820d\u592a\u5435\u201d\u5f71\u54cd\u5f55\u97f3\u73af\u5883\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4f4e** \u2014 \u660e\u786e\u8868\u793a\u201c\u7236\u6bcd\u53c8\u4e0d\u7ed9\u6211\u94b1\u201d\uff0c\u5bb6\u5ead\u4e0d\u652f\u6301\u5176\u4ed8\u8d39\u5b66\u4e60\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b07\u4f4e\u6781\u5371**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56**\u3002\u9891\u7e41\u4f7f\u7528\u6d41\u6cea\u8868\u60c5\uff0c\u591a\u6b21\u8868\u8fbe\u201c\u6ca1\u6709\u4fe1\u5fc3\u201d\u3001\u201c\u5bb3\u6015\u201d\u3001\u201c\u7d27\u5f20\u201d\uff0c\u5bf9\u516c\u5f00\u4e0a\u9ea6\u3001\u60c5\u611f\u6f14\u7ece\u611f\u5230\u5de8\u5927\u538b\u529b\uff0c\u6781\u5ea6\u9700\u8981\u5916\u90e8\u80af\u5b9a\u548c\u5b89\u629a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u611f\u89c9\u6ca1\u6709\u4fe1\u5fc3[\u6d41\u6cea][\u6d41\u6cea]\uff0c\u6211\u6ca1\u6709\u4e00\u70b9\u611f\u60c5\u201d > \u201c\u6211\u4e0d\u592a\u4f1a\u554a\uff0c\u800c\u4e14\u6211\u4e0d\u4f1a\u600e\u4e48\u6709\u60c5\u611f\u7684\u8bfb\uff0c\u6709\u70b9\u5bb3\u6015\u4e86\u8001\u5e08\u201d > \u201c\u7d27\u5f20\u4e86\u522b\u8ba9\u6211\u7b2c\u4e00\u4e2a\u554a[\u59d4\u5c48]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 (\u7126\u8651\u4fdd\u969c) \u4e0e \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42 (\u5f52\u5c5e\u611f)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5f3a\u70c8\u7684\u81ea\u6211\u6000\u7591\u4e0e\u4e0d\u5b89\u5168\u611f**\u3002\u4f5c\u4e3a\u5b66\u751f/\u804c\u573a\u65b0\u4eba\uff0c\u7ecf\u6d4e\u4e0d\u72ec\u7acb\uff0c\u6280\u80fd\u4e0d\u81ea\u4fe1\uff0c\u5bb3\u6015\u5728\u7fa4\u4f53\u4e2d\u66b4\u9732\u77ed\u677f\uff08\u201c\u6211\u89c9\u5f97\u4ed6\u4eec\u90fd\u8bf4\u7684\u597d\u597d\uff0c\u6211\u611f\u89c9\u6839\u672c\u8bfb\u4e0d\u51fa\u60c5\u611f\u201d\uff09\uff0c\u6781\u5ea6\u6e34\u671b\u88ab\u63a5\u7eb3\u548c\u80af\u5b9a\uff0c\u4ee5\u7f13\u89e3\u5bf9\u672a\u6765\u7684\u7126\u8651\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u65e0\u6761\u4ef6\u7684\u9f13\u52b1\u4e0e\u201c\u88ab\u770b\u89c1\u201d\u7684\u5b89\u5168\u611f**\u3002\u9700\u8981\u6301\u7eed\u3001\u5177\u4f53\u3001\u5938\u5f20\u7684\u6b63\u9762\u53cd\u9988\uff08\u5982\u9500\u552e\u5bf9\u5176\u201c\u751c\u7f8e\u201d\u3001\u201c\u6709\u8fa8\u8bc6\u5ea6\u201d\u58f0\u97f3\u7684\u80af\u5b9a\uff09\uff0c\u5e76\u63d0\u4f9b\u4e00\u4e2a\u4f4e\u538b\u529b\u3001\u5141\u8bb8\u72af\u9519\u3001\u6709\u5f52\u5c5e\u611f\u7684\u7ec3\u4e60\u73af\u5883\uff0c\u8ba9\u5979\u611f\u5230\u81ea\u5df1\u662f\u88ab\u652f\u6301\u548c\u4fdd\u62a4\u7684\uff0c\u800c\u975e\u88ab\u8bc4\u5224\u7684\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74** (\u4e25\u91cd\u5185\u8017\u578b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u501f\u8d37\u62a5\u540d\u3001\u6781\u7aef\u5a01\u80c1\u7b49D\u7c7b\u7ea2\u7ebf\u4fe1\u53f7\u3002\u4f46**\u8d44\u6e90\u5e95\u5ea7\u4f4e\uff08\u7ecf\u6d4e\u4f9d\u8d56\u5bb6\u5ead\uff09+ \u5fc3\u7406\u5f39\u6027\u6781\u4f4e**\u7684\u7ec4\u5408\uff0c\u4f7f\u5176\u5904\u4e8e\u9ad8\u98ce\u9669\u8fb9\u7f18\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u9ad8** | \u5411\u5bb6\u91cc\u8981\u94b1\u62a5\u540d\uff0c\u82e5\u88ab\u7236\u6bcd\u53d1\u73b0\u5e76\u53cd\u5bf9\uff0c\u6781\u6613\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u5e76\u5f3a\u5236\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | \u5de5\u4f5c\u4e0e\u5b66\u4e60\u65f6\u95f4\u51b2\u7a81\uff0c\u82e5\u8bfe\u7a0b\u538b\u529b\u5927\u3001\u4f5c\u4e1a\u8ddf\u4e0d\u4e0a\uff0c\u53e0\u52a0\u81ea\u6211\u6000\u7591\uff0c\u5bb9\u6613\u56e0\u201c\u5b66\u4e0d\u4f1a\u201d\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u4efb\u4f55\u4e00\u6b21\u4e25\u5389\u7684\u70b9\u8bc4\u3001\u516c\u5f00\u7684\u632b\u8d25\uff08\u5982\u8bd5\u97f3\u5931\u8d25\uff09\u3001\u6216\u611f\u89c9\u88ab\u5ffd\u89c6\uff0c\u90fd\u53ef\u80fd\u89e6\u53d1\u5176\u201c\u6211\u4e0d\u884c\u201d\u7684\u5d29\u6e83\u60c5\u7eea\uff0c\u5bfc\u81f4\u77ac\u95f4\u653e\u5f03\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u5bf9\u201c\u4e00\u8fb9\u5b66\u4e60\u4e00\u8fb9\u63a5\u5355\u201d\u62b1\u6709\u4e0d\u5207\u5b9e\u9645\u7684\u77ed\u671f\u671f\u671b\uff0c\u82e5\u77ed\u671f\u5185\u65e0\u6cd5\u53d8\u73b0\uff0c\u4f1a\u52a0\u5267\u5176\u7ecf\u6d4e\u538b\u529b\u548c\u632b\u8d25\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c1-2\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u6b63\u5f0f\u8bfe\u7a0b\u96be\u5ea6\u548c\u4f5c\u4e1a\u538b\u529b\u4e0a\u6765\uff0c\u5176\u201c\u5bb3\u6015\u505a\u4e0d\u597d\u201d\u7684\u7126\u8651\u5c06\u8fbe\u5230\u9876\u5cf0\uff0c\u662f\u9000\u8d39\u9ad8\u53d1\u671f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4eb2\u7231\u7684\uff0c\u770b\u5230\u4f60\u62a5\u540d\u6211\u771f\u7684\u7279\u522b\u5f00\u5fc3\uff01\u4f60\u7684\u58f0\u97f3\u771f\u7684\u5f88\u6709\u7279\u70b9\uff0c\u54b1\u4eec\u73ed\u597d\u591a\u540c\u5b66\u90fd\u8bb0\u5f97\u4f60\u751c\u751c\u7684\u55d3\u97f3\u5462\u3002\u522b\u62c5\u5fc3\u8ddf\u4e0d\u4e0a\uff0c\u54b1\u4eec\u73ed\u5c31\u662f\u4e00\u4e2a\u5c0f\u5bb6\u5ead\uff0c\u6ca1\u6709\u2018\u597d\u2019\u4e0e\u2018\u4e0d\u597d\u2019\uff0c\u53ea\u6709\u2018\u6562\u2019\u4e0e\u2018\u4e0d\u6562\u2019\u3002\u4f60\u53ea\u8981\u6562\u5f00\u53e3\uff0c\u5c31\u662f\u6700\u68d2\u7684\uff01\u6709\u4efb\u4f55\u4e00\u70b9\u5c0f\u56f0\u96be\u3001\u5c0f\u60c5\u7eea\uff0c\u968f\u65f6\u627e\u6211\uff0c\u621124\u5c0f\u65f6\u90fd\u5728\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\u3011**\u3002\u6838\u5fc3\u76ee\u6807\u662f\u5efa\u7acb\u5b89\u5168\u611f\u548c\u5f52\u5c5e\u611f\uff0c\u800c\u975e\u5feb\u901f\u53d8\u73b0\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u6ee1\u914d **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u63d0\u4f9b\u50bb\u74dc\u5f0f\u3001\u6b65\u9aa4\u62c6\u89e3\u5230\u6781\u81f4\u7684\u4f5c\u4e1a\u6307\u5bfc\uff1b\u521d\u671f\u4f5c\u4e1a\u70b9\u8bc4\u4ee5\u201c\u627e\u95ea\u5149\u70b9\u201d\u4e3a\u4e3b\uff0c\u907f\u514d\u4efb\u4f55\u53ef\u80fd\u88ab\u89e3\u8bfb\u4e3a\u201c\u5426\u5b9a\u201d\u7684\u6279\u8bc4\uff1b\u5efa\u7acb\u201c\u5938\u5938\u7fa4\u201d\u6c1b\u56f4\uff0c\u8ba9\u5979\u5728\u793e\u7fa4\u4e2d\u83b7\u5f97\u60c5\u7eea\u4ef7\u503c\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5728\u516c\u5f00\u573a\u5408\u8fdb\u884c\u5bf9\u6bd4\u6216\u6279\u8bc4**\u3002\u70b9\u8bc4\u5fc5\u987b\u79c1\u804a\uff0c\u4e14\u5148\u626c\u540e\u6291\uff08\u6291\u7684\u90e8\u5206\u8981\u6781\u5176\u59d4\u5a49\uff09\u3002\n    2. **\u7edd\u4e0d\u8fc7\u65e9\u65bd\u52a0\u53d8\u73b0\u538b\u529b**\u3002\u81f3\u5c11\u5728\u7b2c\u4e00\u4e2a\u6708\u5185\uff0c\u907f\u514d\u8ffd\u95ee\u201c\u63a5\u5355\u8fdb\u5ea6\u201d\u3002\n    3. **\u7edd\u4e0d\u5ffd\u89c6\u5979\u7684\u60c5\u7eea\u4fe1\u53f7**\u3002\u4e00\u65e6\u51fa\u73b0\u201c\u5bb3\u6015\u201d\u3001\u201c\u6ca1\u4fe1\u5fc3\u201d\u7b49\u5b57\u773c\uff0c\u5fc5\u987b\u7b2c\u4e00\u65f6\u95f4\u7ed9\u4e88\u5b89\u629a\u548c\u5177\u4f53\u6307\u5bfc\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5347\u5355**\u3002\u5728\u5b8c\u6210\u57fa\u7840\u8bfe\u7a0b\u3001\u5efa\u7acb\u8db3\u591f\u81ea\u4fe1\u548c\u4fe1\u4efb\u4e4b\u524d\uff0c\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u4f1a\u88ab\u89c6\u4e3a\u201c\u9a97\u94b1\u201d\u7684\u5370\u8bc1\uff0c\u89e6\u53d1\u5176\u201c\u5bb3\u6015\u88ab\u9a97\u201d\u7684\u8b66\u89c9\uff0c\u5bfc\u81f4\u4fe1\u4efb\u5d29\u584c\u548c\u9000\u8d39\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u611f\u89c9\u6ca1\u6709\u4fe1\u5fc3[\u6d41\u6cea][\u6d41\u6cea]\uff0c\u6211\u6ca1\u6709\u4e00\u70b9\u611f\u60c5\u201d\n2. > \u201c\u6211\u4e0d\u592a\u4f1a\u554a\uff0c\u800c\u4e14\u6211\u4e0d\u4f1a\u600e\u4e48\u6709\u60c5\u611f\u7684\u8bfb\uff0c\u6709\u70b9\u5bb3\u6015\u4e86\u8001\u5e08\u201d\n3. > \u201c\u4e3a\u4ec0\u4e48\u6211\u6709\u79cd\u5bb3\u6015\u80cc\u9a97\u7684\u611f\u89c9[\u6d41\u6cea][\u6d41\u6cea][\u6d41\u6cea]\u201d\n4. > \u201c\u6211\u8fd8\u662f\u5b66\u751f\uff0c\u6211\u8981\u8ddf\u5bb6\u91cc\u9762\u8981\u201d & \u201c\u7236\u6bcd\u53c8\u4e0d\u7ed9\u6211\u94b1\uff0c\u6211\u60f3\u81ea\u5df1\u8d5a\u94b1\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u4e0e\u5f52\u5c5e\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u6781\u81f4\u7684\u60c5\u611f\u6258\u5e95\u4e0e\u65e0\u538b\u529b\u966a\u4f34\uff0c\u4e25\u7981\u4efb\u4f55\u5f62\u5f0f\u7684\u65bd\u538b\u548c\u5426\u5b9a\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168/\u793e\u4ea4\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\", \"age\": \"\u672a\u77e5\uff08\u5b66\u751f/\u804c\u573a\u65b0\u4eba\uff09\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}\n```";
