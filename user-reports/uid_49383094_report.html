    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49)**\n    *   **\u8868\u5c42\u9700\u6c42**\uff1a\u5b66\u4e60AI\u77ed\u89c6\u9891\u6280\u80fd\uff0c\u5b9e\u73b0\u526f\u4e1a\u53d8\u73b0\u3002\n    *   **\u6df1\u5c42\u9700\u6c42**\uff1a\u4e3a\u672a\u6765\uff08\u664b\u5347\u5b9d\u5988\uff09\u505a\u51c6\u5907\uff0c\u770b\u597d\u513f\u7ae5\u5185\u5bb9\u8d5b\u9053\uff0c\u5bfb\u6c42\u7a33\u5b9a\u3001\u7075\u6d3b\u7684\u589e\u6536\u9014\u5f84\u3002\n    *   **\u4fe1\u53f7**\uff1a\u4e3b\u52a8\u8be2\u95ee\u201c\u8fdb\u5de5\u4f5c\u5ba4\u201d\u3001\u201c\u6536\u5165\u662f\u5426\u9700\u5b9e\u540d\u201d\uff0c\u5173\u6ce8\u201c\u9700\u6c42\u5927\u201d\u7684\u7ec6\u5206\u9886\u57df\uff0c\u8868\u660e\u5176\u52a8\u673a\u517c\u5177\u5b9e\u7528\u4e3b\u4e49\uff08\u53d8\u73b0\uff09\u548c\u957f\u671f\u89c4\u5212\uff08\u80b2\u513f\u7ed3\u5408\uff09\uff0c\u975e\u51b2\u52a8\u6d88\u8d39\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d\u7b49)**\n    *   **\u65f6\u95f4/\u7cbe\u529b**\uff1a\u80fd\u53ca\u65f6\u8ddf\u8fdb\u8bfe\u7a0b\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u4e3b\u52a8\u7d22\u8981\u56de\u653e\uff0c\u884c\u52a8\u529b\u5f3a\uff0c\u65f6\u95f4\u76f8\u5bf9\u5145\u88d5\u3002\n    *   **\u7ecf\u6d4e\u80fd\u529b**\uff1a\u5bf9\u4ef7\u683c\u654f\u611f\uff08\u591a\u6b21\u8be2\u95ee\u4ef7\u683c\u3001\u8981\u6c42\u4f18\u60e0\uff09\uff0c\u4f46\u6700\u7ec8\u80fd\u652f\u4ed82980\u5143\u5e76\u5feb\u901f\u51b3\u5b9a\u5347\u7ea7\u8865\u5dee\u4ef71000\u5143\uff0c\u8868\u660e\u5177\u5907\u4e00\u5b9a\u652f\u4ed8\u80fd\u529b\uff0c\u4f46\u9884\u7b97\u6709\u9650\uff0c\u5c5e\u4e8e**\u4ef7\u683c\u654f\u611f\u578b\u5b9e\u7528\u4e3b\u4e49\u8005**\u3002\n    *   **\u6280\u80fd\u57fa\u7840**\uff1a\u5df2\u63d0\u524d\u5907\u597d\u76f8\u5173APP\uff08\u526a\u6620\u3001\u98de\u4e66\u7b49\uff09\uff0c\u6709\u4e00\u5b9a\u5b66\u4e60\u51c6\u5907\u548c\u5de5\u5177\u610f\u8bc6\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u7b49\u504f\u9ad8)**\n    *   **\u4e92\u52a8\u6a21\u5f0f**\uff1a\u6c9f\u901a\u79ef\u6781\u3001\u793c\u8c8c\uff08\u9891\u7e41\u4f7f\u7528\u201c\u597d\u7684\u54c8\u201d\u3001\u201c\u8c22\u8c22\u201d\uff09\uff0c\u914d\u5408\u5ea6\u9ad8\uff0c\u80fd\u4e3b\u52a8\u53cd\u9988\u5b66\u4e60\u8fdb\u5ea6\uff08\u201c\u5b66\u5b8c\u4e86\u54c8\u201d\uff09\u3002\n    *   **\u632b\u6298\u53cd\u5e94**\uff1a\u9047\u5230\u95ee\u9898\uff08\u9519\u8fc7\u76f4\u64ad\u3001\u79ef\u5206\u4e0d\u591f\uff09\u4f1a\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff08\u8981\u56de\u653e\u3001\u8bf4\u660e\u60c5\u51b5\uff09\uff0c\u6001\u5ea6\u79ef\u6781\u3002\n    *   **\u51b3\u7b56\u98ce\u683c**\uff1a\u8c28\u614e\u4f46\u679c\u65ad\u3002\u51b3\u7b56\u524d\u8be6\u7ec6\u8be2\u95ee\u8bfe\u7a0b\u5b89\u6392\u3001\u4ef7\u683c\u3001\u5347\u7ea7\u8def\u5f84\uff1b\u4e00\u65e6\u660e\u786e\u4ef7\u503c\uff08\u542c\u5b8c\u7b2c\u4e8c\u573a\u76f4\u64ad\u540e\uff09\uff0c**\u7acb\u5373\u51b3\u5b9a\u5347\u7ea7**\uff0c\u51b3\u7b56\u94fe\u6761\u6e05\u6670\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u5df2\u5b8c\u6210\u652f\u4ed8\uff082980\u5143\uff09\uff0c\u5e76\u5728\u77ed\u65f6\u95f4\u5185\uff0824\u5c0f\u65f6\u5185\uff09\u5b8c\u6210\u5347\u7ea7\u8865\u6b3e\uff081000\u5143\uff09\u3002**\u652f\u4ed8\u610f\u613f\u4e0e\u80fd\u529b\u5df2\u9a8c\u8bc1**\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u7528\u6237\u4e3a\u5973\u6027\uff0c\u63d0\u53ca\u201c\u51c6\u5907\u664b\u5347\u5b9d\u5988\u201d\uff0c\u4f46\u6240\u6709\u8bfe\u7a0b\u54a8\u8be2\u3001\u4ef7\u683c\u8c08\u5224\u3001\u652f\u4ed8\u51b3\u7b56\u5747\u7531\u672c\u4eba\u5b8c\u6210\uff0c\u672a\u63d0\u53ca\u9700\u4e0e\u4ed6\u4eba\u5546\u8bae\u3002**\u5224\u65ad\u4e3a\u72ec\u7acb\u51b3\u7b56\u8005**\u3002\n*   **\u6b65\u9aa41-4\u5224\u5b9a**\uff1a\n    *   **A (\u8ba4\u77e5\u5c42-\u77e5\u9053\u8981\u5b66)**\uff1a\u660e\u786e\u77e5\u6653\u8981\u5b66AI\u77ed\u89c6\u9891\u53d8\u73b0\u3002\n    *   **B (\u65b9\u6848\u5c42-\u9009\u62e9\u8ddf\u4f60\u5b66)**\uff1a\u7ecf\u8fc7\u591a\u8f6e\u8bfe\u7a0b\u4ef7\u503c\u3001\u4ef7\u683c\u3001\u8d44\u6e90\uff08\u5de5\u4f5c\u5ba4\u3001\u5546\u5355\uff09\u8be2\u95ee\u540e\uff0c\u9009\u62e9\u62a5\u540d\u3002\n    *   **C (\u4fe1\u4efb\u5c42-\u613f\u610f\u4ed8\u8d39)**\uff1a\u5df2\u4ed8\u8d39\u5e76\u5347\u7ea7\uff0c\u4fe1\u4efb\u5173\u7cfb\u521d\u6b65\u5efa\u7acb\u3002\n    *   **D (\u4ea4\u4ed8\u5c42-\u5f00\u59cb\u884c\u52a8)**\uff1a\u5df2\u6dfb\u52a0\u73ed\u4e3b\u4efb\u3001\u8fdb\u7fa4\u3001\u5b8c\u6210\u5b66\u524d\u4efb\u52a1\u3001\u63d0\u4ea4\u4f5c\u4e1a\uff0c\u8fdb\u5165\u5b66\u4e60\u4ea4\u4ed8\u9636\u6bb5\u3002\n    *   **\u7ed3\u8bba**\uff1a\u7528\u6237\u5904\u4e8e **D\u9636\u6bb5\uff08\u4ea4\u4ed8\u521d\u671f\uff09**\uff0c\u5df2\u5b8c\u6210\u4ece\u8ba4\u77e5\u5230\u4ed8\u8d39\u7684\u5168\u6d41\u7a0b\uff0c\u5f53\u524d\u91cd\u70b9\u662f\u5b66\u4e60\u4ea4\u4ed8\u4e0e\u4ef7\u503c\u5b9e\u73b0\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b\uff1aT4 \u7cbe\u7b97\u5e08\u578b**\n    *   **\u6838\u5fc3\u7279\u5f81**\uff1a\u76ee\u6807\u660e\u786e\uff08\u5b66\u6280\u80fd\u53d8\u73b0\uff09\u3001\u51b3\u7b56\u7406\u6027\u3001\u5bf9\u4ef7\u683c\u548c\u8bfe\u7a0b\u7ec6\u8282\uff08\u8bfe\u65f6\u6570\u3001\u6743\u9650\u5f00\u653e\u65f6\u95f4\uff09\u6781\u4e3a\u5173\u6ce8\u3001\u4f1a\u8ba1\u7b97\u6295\u5165\u4ea7\u51fa\u6bd4\uff08\u5148\u62a52\u4e2a\u6708\u518d\u5347\u7ea7\uff09\u3002\n    *   **\u884c\u4e3a\u5370\u8bc1**\uff1a\u53cd\u590d\u786e\u8ba4\u4ef7\u683c\u3001\u8bfe\u7a0b\u5177\u4f53\u5b89\u6392\uff08\u201c\u4e24\u4e2a\u6708\u7684\u8bdd\uff0c\u662f8\u8282\u8bfe\uff1f\u201d\uff09\u3001\u8d44\u6e90\u6743\u9650\uff08\u201c60\u8282\u5f55\u64ad\u8bfe\u662f\u4e00\u4e0b\u5b50\u6743\u9650\u90fd\u5f00\u4e86\u5417\u201d\uff09\uff0c\u5728\u83b7\u5f97\u660e\u786e\u4fe1\u606f\u5e76\u611f\u77e5\u5230\u540e\u7eed\u4ef7\u503c\uff08\u7b2c\u4e8c\u573a\u76f4\u64ad\u540e\uff09\u624d\u51b3\u5b9a\u5347\u7ea7\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669\uff1a\u4f4e**\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u76ee\u6807\u660e\u786e\uff08\u53d8\u73b0\uff09\uff0c\u82e5\u5b66\u4e60\u540e\u63a5\u5355\u4e0d\u987a\u6216\u6536\u76ca\u4e0d\u4f73\uff0c\u6613\u4ea7\u751f\u843d\u5dee\u3002\u9700\u91cd\u70b9\u5173\u6ce8\u5176\u5546\u5355\u5b9e\u8df5\u8fdb\u5c55\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u4f4e\u98ce\u9669**\u3002\u5df2\u652f\u4ed8\uff0c\u4e14\u4e3a\u4e3b\u52a8\u5347\u7ea7\uff0c\u77ed\u671f\u5185\u7ecf\u6d4e\u538b\u529b\u5bfc\u81f4\u9000\u8d39\u53ef\u80fd\u6027\u4f4e\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u4f4e\u98ce\u9669**\u3002\u5f53\u524d\u4e92\u52a8\u79ef\u6781\uff0c\u65f6\u95f4\u5b89\u6392\u770b\u4f3c\u53ef\u63a7\u3002\n    4.  **\u8bfe\u7a0b\u8d28\u91cf\u5f02\u8bae**\uff1a**\u4e2d\u4f4e\u98ce\u9669**\u3002\u4f5c\u4e3a\u201c\u7cbe\u7b97\u5e08\u201d\uff0c\u4f1a\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u4e0e\u5ba3\u4f20\u7684\u5339\u914d\u5ea6\u4fdd\u6301\u5ba1\u89c6\u3002\u9700\u786e\u4fdd\u4ea4\u4ed8\u5185\u5bb9\u624e\u5b9e\uff0c\u907f\u514d\u201c\u5938\u5927\u5ba3\u4f20\u201d\u611f\u3002\n    5.  **\u670d\u52a1\u4f53\u9a8c**\uff1a**\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u5bf9\u9500\u552e\uff08\u5b89\u5b89\u5e08\u59d0\uff09\u548c\u73ed\u4e3b\u4efb\u670d\u52a1\u53cd\u9988\u6b63\u9762\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u4f4e\u98ce\u9669**\u3002\u5224\u65ad\u4e3a\u72ec\u7acb\u51b3\u7b56\u3002\n    7.  **\u7ade\u54c1\u8f6c\u79fb**\uff1a**\u4e2d\u98ce\u9669**\u3002\u6b64\u7c7b\u7528\u6237\u7406\u6027\uff0c\u82e5\u53d1\u73b0\u6027\u4ef7\u6bd4\u66f4\u9ad8\u7684\u7ade\u54c1\uff0c\u53ef\u80fd\u52a8\u6447\u3002\u9700\u6301\u7eed\u5f3a\u5316\u4e13\u5c5e\u8d44\u6e90\uff08\u5de5\u4f5c\u5ba4\u3001\u5546\u5355\u6e20\u9053\uff09\u7684\u4e0d\u53ef\u66ff\u4ee3\u6027\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5408\u89c4\u60c5\u51b5**\uff1a\u9500\u552e\u8fc7\u7a0b\u57fa\u672c\u5408\u89c4\u3002\u9500\u552e\u660e\u786e\u4e86\u8bfe\u7a0b\u4ef7\u683c\u3001\u5185\u5bb9\u6784\u6210\uff08\u76f4\u64ad+\u5f55\u64ad\uff09\u3001\u5347\u7ea7\u89c4\u5219\u3002\u63d0\u53ca\u201c\u7ea2\u5229\u671f\u201d\u3001\u201c\u5feb\u901f\u8d5a\u94b1\u201d\u5c5e\u4e8e\u5e38\u89c1\u884c\u4e1a\u8bdd\u672f\uff0c\u4f46\u672a\u53d1\u73b0**\u627f\u8bfa\u5177\u4f53\u6536\u5165\u3001\u62c5\u4fdd\u5c31\u4e1a**\u7b49\u8fdd\u89c4\u7ea2\u7ebf\u3002\n*   **\u98ce\u9669\u70b9**\uff1a\u5f3a\u8c03\u201c\u7b2c\u516b\u5929\u5f00\u6240\u6709\u8d44\u6e90\u6743\u9650\u201d\u3001\u201c\u5f00\u901a\u63a5\u5355\u6e20\u9053\u201d\u53ef\u80fd\u8ba9\u7528\u6237\u4ea7\u751f\u201c\u5feb\u901f\u53d8\u73b0\u201d\u7684**\u4e0d\u5207\u5b9e\u9645\u671f\u5f85**\uff0c\u82e5\u540e\u7eed\u63a5\u5355\u4e0d\u987a\u6613\u5f15\u53d1\u6295\u8bc9\u3002**\u9700\u5728\u4ea4\u4ed8\u4e2d\u7ba1\u7406\u9884\u671f**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6838\u5fc3\u7b56\u7565**\uff1a**\u63d0\u4f9b\u6e05\u6670\u8def\u5f84\uff0c\u5f3a\u5316\u4ef7\u503c\u611f\u77e5\uff0c\u52a9\u529b\u65e9\u671f\u6b63\u53cd\u9988**\u3002\n*   **\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9884\u671f\u7ba1\u7406**\uff1a\u660e\u786e\u544a\u77e5\u5b66\u4e60\u66f2\u7ebf\uff0c\u5f3a\u8c03\u6280\u80fd\u79ef\u7d2f\u4e0e\u5546\u5355\u62a5\u916c\u7684\u6e10\u8fdb\u5173\u7cfb\uff0c\u907f\u514d\u201c\u66b4\u5bcc\u201d\u671f\u5f85\u3002\n    2.  **\u8def\u5f84\u53ef\u89c6\u5316**\uff1a\u4e3a\u5176\u5236\u5b9a\u6e05\u6670\u7684\u201c\u5b66\u4e60-\u7ec3\u4e60-\u63a5\u5355\u201d\u91cc\u7a0b\u7891\u8ba1\u5212\uff0c\u6ee1\u8db3\u5176\u201c\u7cbe\u7b97\u201d\u9700\u6c42\u3002\n    3.  **\u91cd\u70b9\u5173\u6ce8**\uff1a\u4e3b\u52a8\u8ddf\u8fdb\u5176\u4f5c\u4e1a\u5b8c\u6210\u60c5\u51b5\uff0c\u5728\u5176\u63d0\u53ca\u7684\u201c\u513f\u7ae5\u89c6\u9891\u201d\u8d5b\u9053\u4e0a\u63d0\u4f9b\u9488\u5bf9\u6027\u8d44\u6e90\u6216\u6848\u4f8b\u5f15\u5bfc\u3002\n    4.  **\u65e9\u671f\u6b63\u53cd\u9988**\uff1a\u534f\u52a9\u5176\u5b8c\u6210\u7b2c\u4e00\u4e2a\u7b80\u5355\u5546\u5355\u6216\u4f5c\u54c1\uff0c\u83b7\u5f97\u9996\u6b21\u6536\u76ca\uff08\u65e0\u8bba\u591a\u5c11\uff09\uff0c\u662f\u7ef4\u6301\u5176\u4fe1\u5fc3\u7684\u5173\u952e\u3002\n    5.  **\u98ce\u9669\u76d1\u63a7**\uff1a\u7559\u610f\u5176\u5bf9\u4e8e\u8bfe\u7a0b\u201c\u6027\u4ef7\u6bd4\u201d\u7684\u8a00\u8bba\uff0c\u82e5\u6709\u7591\u8651\u9700\u53ca\u65f6\u4ecb\u5165\uff0c\u7528\u4e8b\u5b9e\uff08\u5b66\u5458\u6848\u4f8b\u3001\u5176\u81ea\u8eab\u8fdb\u6b65\uff09\u5de9\u56fa\u4ef7\u503c\u8ba4\u77e5\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**\uff1a\n    *   \u5df2\u5339\u914d **AI\u77ed\u89c6\u9891\u53d8\u73b0\u8bfe\u7a0b**\uff0c\u7528\u6237\u5df2\u4ece\u201c\u5165\u95e8\u8425\u201d\u5347\u7ea7\u81f3\u201c\u5b9e\u6218\u8425\u201d\uff0c\u8def\u5f84\u6b63\u786e\u3002\n    *   \u53ef\u540e\u7eed\u5173\u6ce8\u5176\u53d8\u73b0\u60c5\u51b5\uff0c\u9002\u65f6\u63a8\u8350 **\u9ad8\u9636\u79c1\u6559\u6216\u4e13\u9879\u8bad\u7ec3\u8425**\uff08\u5982\u513f\u7ae5\u5185\u5bb9\u521b\u4f5c\u4e13\u9879\uff09\uff0c\u6ee1\u8db3\u5176\u6df1\u8015\u7ec6\u5206\u9886\u57df\u7684\u9700\u6c42\u3002\n\n{\"core_type\": \"T4 \u7cbe\u7b97\u5e08\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u5b89\u5168/\u5c0a\u91cd\", \"target_product_line\": \"AI\u77ed\u89c6\u9891\u5b9e\u6218\u8425\uff08\u5df2\u6302\u8f7d\uff09\", \"age\": \"\u672a\u77e5\uff08\u63a8\u6d4b\u4e3a\u80b2\u9f84\u5973\u6027\uff09\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}";
