        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676684889 (Mandy) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-30 \u81f3 2026-02-02 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e - AA\u9053\u5ba3(\u9648\u6653\u5a07) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u6f14\u64ad\u8bfe\u7a0b\uff08\u5177\u4f53\u8bfe\u7a0b\u540d\u79f0\u53ca\u4ef7\u683c\u672a\u63d0\u53ca\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u63d0\u53ca\u201c\u7b49\u6211\u5565\u65f6\u5019\u4e0d\u8003\u8651\u94b1\u4e86\u201d\uff0c\u5e76\u7ea0\u7ed3\u4e8e\u7535\u8111\u4ef7\u683c\uff08\u7ea64000\u5143\uff09\uff0c\u5b58\u5728\u8d44\u91d1\u9884\u7b97\u7d27\u5f20\u8ff9\u8c61\uff0c\u4f46\u672a\u660e\u786e\u652f\u4ed8\u65b9\u5f0f\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u5bf9\u8bdd\u96c6\u4e2d\u5728\u767d\u5929\u53ca\u508d\u665a\uff0c\u7528\u6237\u6709\u8f83\u957f\u65f6\u95f4\u7528\u4e8e\u7535\u8111\u9009\u8d2d\u3001\u8f6f\u4ef6\u5b89\u88c5\uff0c\u4f46\u672a\u63d0\u53ca\u5177\u4f53\u5de5\u4f5c/\u751f\u6d3b\u65f6\u95f4\u5b89\u6392\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u63d0\u53ca\u201c\u6211\u8001\u516c\u662f\u8bf4\uff0c\u4f1a\u4e0d\u4f1a\u8fd9\u4e2a\u540e\u9762\u7528\u7740\u7528\u7740\u53c8\u4e0d\u884c\u554a\u201d\uff0c\u8868\u660e\u5bb6\u4eba\u77e5\u60c5\uff0c\u4f46\u652f\u6301\u5ea6\u672a\u77e5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u5bf9\u8bdd\u56f4\u7ed5\u8bbe\u5907\u51c6\u5907\u3001\u8f6f\u4ef6\u5b89\u88c5\u3001\u4f5c\u4e1a\u70b9\u8bc4\u3001\u9009\u89d2\u8bd5\u97f3\u5c55\u5f00\uff0c\u5b66\u4e60\u884c\u4e3a\u4fe1\u53f7\u5145\u8db3\uff0c\u4f46\u7f3a\u4e4f\u5bf9\u5b66\u4e60\u76ee\u6807\u3001\u9884\u671f\u3001\u5bb6\u5ead/\u8d22\u52a1\u72b6\u51b5\u7684\u6df1\u5ea6\u4ea4\u6d41\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u5174\u8da3\u9a71\u52a8\u4e0e\u80fd\u529b\u6210\u957f\u4e3a\u4e3b\uff0c\u517c\u6709\u53d8\u73b0\u671f\u5f85\u3002\u7528\u6237\u79ef\u6781\u5b8c\u6210\u8f6f\u4ef6\u5b89\u88c5\u3001\u53c2\u4e0e\u4f5c\u4e1a\u70b9\u8bc4\u3001\u4e3b\u52a8\u7814\u7a76\u89d2\u8272\u548c\u8bd5\u97f3\uff0c\u8868\u73b0\u51fa\u5bf9\u6280\u80fd\u672c\u8eab\u7684\u63a2\u7d22\u6b32\u548c\u6210\u5c31\u611f\u3002\u867d\u6709\u201c\u5185\u5bb9\u6211\u4e5f\u633a\u559c\u6b22\u201d\u7b49\u5174\u8da3\u8868\u8fbe\uff0c\u4f46\u6574\u4f53\u672a\u8868\u73b0\u51fa\u5bf9\u201c\u6781\u901f\u53d8\u73b0\u201d\u6216\u201c\u4fdd\u5e95\u627f\u8bfa\u201d\u7684\u5f3a\u70c8\u6267\u5ff5\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4eca\u5929\u89c9\u5f97\u81ea\u5df1\u597d\u725b\u903c\u201d\uff1b> \u201c\u770b\u4e86\u4e00\u5708\u8fd9\u4e2a\u76ee\u524d\u4e00\u4e2a\u4eba\u5c31\u80fd\u89e3\u51b3 [\u7834\u6d95\u4e3a\u7b11]\u5185\u5bb9\u6211\u4e5f\u633a\u559c\u6b22\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 \u5bf9\u7535\u8111\u4ef7\u683c\u654f\u611f\uff08\u201c\u90fd\u5f976000\u591a\u201d\u3001\u201c\u8d35\u4e86500\u591a\u53ef\u4ee5\u63a5\u53d7\u201d\uff09\uff0c\u4f1a\u7cbe\u6253\u7ec6\u7b97\u5e76\u5229\u7528\u201c\u56fd\u8865\u201d\uff0c\u4f46\u6700\u7ec8\u80fd\u5b8c\u62104000\u5143\u5de6\u53f3\u7684\u6d88\u8d39\u51b3\u7b56\uff0c\u4e0d\u5c5e\u4e8e\u501f\u8d37\u6216\u5f71\u54cd\u57fa\u672c\u751f\u6d3b\u7684\u8303\u7574\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 \u80fd\u6295\u5165\u4e00\u4e0b\u5348\u65f6\u95f4\u6298\u817e\u8f6f\u4ef6\u5b89\u88c5\uff08\u201c\u6298\u817e\u4e00\u4e0b\u5348\u201d\u3001\u201c\u5fc3\u529b\u4ea4\u7601\u201d\uff09\uff0c\u6709\u6301\u7eed\u6027\u53c2\u4e0e\u5b66\u4e60\u4e92\u52a8\uff08\u4ea4\u4f5c\u4e1a\u3001\u70b9\u8bc4\u3001\u9009\u89d2\uff09\uff0c\u4f46\u8fc7\u7a0b\u4e2d\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u75b2\u60eb\u611f\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4e2d] \u2014 \u5bb6\u4eba\uff08\u4e08\u592b\uff09\u77e5\u60c5\u5e76\u53c2\u4e0e\u8ba8\u8bba\uff08\u201c\u6211\u8001\u516c\u662f\u8bf4\u2026\u201d\uff09\uff0c\u672a\u8868\u73b0\u51fa\u53cd\u5bf9\uff0c\u4f46\u652f\u6301\u6df1\u5ea6\u672a\u77e5\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9762\u5bf9\u8f6f\u4ef6\u5b89\u88c5\u7684\u590d\u6742\u95ee\u9898\uff08\u89e3\u538b\u9519\u8bef\u3001\u627e\u4e0d\u5230\u5b89\u88c5\u8def\u5f84\uff09\uff0c\u80fd\u4e3b\u52a8\u641c\u7d22\u89e3\u51b3\u65b9\u6848\uff08\u201c\u6211\u518d\u95eeai\u201d\uff09\uff0c\u6301\u7eed\u5c1d\u8bd5\u76f4\u81f3\u89e3\u51b3\uff08\u201c\u7ec8\u4e8e\u770b\u89c1\u6587\u4ef6\u5939\u4e86\u201d\uff09\uff0c\u867d\u6709\u62b1\u6028\uff08\u201c\u6211\u7684\u8001\u5929\u9e45\u201d\u3001\u201c\u5fc3\u529b\u4ea4\u7601\u201d\uff09\u4f46\u672a\u653e\u5f03\u6216\u5b8c\u5168\u4f9d\u8d56\u9500\u552e\uff0c\u6700\u7ec8\u72ec\u7acb\u5b8c\u6210\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u597d\u6b79\u8ba4\u8bc6\u70b9\u82f1\u6587 \u6211\u5ffd\u7565\u4e86\u8fd9\u4e2a\u63d0\u9192\u201d\uff1b> \u201c\u6211\u5148\u6d45\u793a\u4e00\u4e0b\uff0c\u5982\u679c\u6709\u56f0\u96be\uff0c\u6211\u5c31\u76f4\u63a5\u8bf7\u4f60\u5e2e\u52a9\u4e86\u3002\u641e\u4e00\u5929\u4e86\uff0c\u6211\u5929\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u6e34\u671b\u83b7\u5f97\u4e13\u4e1a\u4e0a\u7684\u8ba4\u53ef\u4e0e\u81ea\u6211\u4ef7\u503c\u8bc1\u660e\u3002\u901a\u8fc7\u72ec\u7acb\u89e3\u51b3\u6280\u672f\u96be\u9898\uff08\u201c\u4eca\u5929\u89c9\u5f97\u81ea\u5df1\u597d\u725b\u903c\u201d\uff09\u3001\u79ef\u6781\u53c2\u4e0e\u793e\u7fa4\u4e92\u52a8\uff08\u70b9\u8bc4\u3001\u9009\u89d2\uff09\u3001\u5bf9\u58f0\u97f3\u54c1\u8d28\u548c\u89d2\u8272\u6f14\u7ece\u6709\u5ba1\u7f8e\u8ffd\u6c42\uff08\u201c\u97f3\u8272\u5f88\u4e0d\u9519\u201d\u3001\u201c\u611f\u53d7\u89d2\u8272\u60c5\u7eea\u4ee3\u5165\u201d\uff09\uff0c\u663e\u793a\u51fa\u5f3a\u70c8\u7684\u201c\u88ab\u770b\u89c1\u201d\u548c\u201c\u6211\u80fd\u884c\u201d\u7684\u9700\u6c42\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u6210\u5c31\u611f\u8d4b\u4e88**\u3002\u53ca\u65f6\u3001\u5177\u4f53\u5730\u8868\u626c\u5979\u7684\u5b66\u4e60\u6210\u679c\u548c\u8fdb\u6b65\uff0c\u63d0\u4f9b\u80fd\u5c55\u793a\u5176\u80fd\u529b\u7684\u821e\u53f0\uff08\u5982\u5408\u9002\u7684\u89d2\u8272\u8bd5\u97f3\u673a\u4f1a\uff09\uff0c\u8ba9\u5979\u611f\u53d7\u5230\u5728\u4e13\u4e1a\u793e\u7fa4\u4e2d\u7684\u5b58\u5728\u611f\u548c\u4ef7\u503c\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 **B\u7c7b** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u5bb6\u4eba\u77e5\u60c5\u4e14\u672a\u53cd\u5bf9\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4e2d | **\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u7528\u6237\u5bf9\u6280\u672f\u7ec6\u8282\u6709\u94bb\u7814\u7cbe\u795e\u4f46\u8fc7\u7a0b\u6613\u611f\u75b2\u60eb\uff08\u201c\u5fc3\u529b\u4ea4\u7601\u201d\uff09\u3002\u82e5\u8bfe\u7a0b\u4e2d\u540e\u671f\u4f5c\u4e1a\u96be\u5ea6\u9661\u589e\u6216\u6280\u672f\u95ee\u9898\u9891\u53d1\uff0c\u53ef\u80fd\u56e0\u6301\u7eed\u53d7\u632b\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u72ec\u7acb\u89e3\u51b3\u95ee\u9898\uff0c\u4e0d\u5c5e\u4e8e\u6613\u7834\u9632\u7c7b\u578b\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d\u4f4e | \u5f53\u524d\u52a8\u673a\u4ee5\u5174\u8da3\u548c\u80fd\u529b\u6210\u957f\u4e3a\u4e3b\uff0c\u5bf9\u77ed\u671f\u53d8\u73b0\u671f\u5f85\u4e0d\u660e\u663e\u3002\u4f46\u82e5\u957f\u671f\u65e0\u6b63\u5411\u53cd\u9988\uff08\u5982\u4f5c\u54c1\u672a\u88ab\u8ba4\u53ef\u3001\u65e0\u8bd5\u97f3\u673a\u4f1a\uff09\uff0c\u53ef\u80fd\u4ea7\u751f\u4ef7\u503c\u6000\u7591\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c3-4\u5468\uff08\u6280\u672f\u5b9e\u64cd\u4e0e\u4f5c\u4e1a\u96be\u5ea6\u63d0\u5347\u671f\uff09**\u3002\u5f53\u72ec\u7acb\u94bb\u7814\u65e0\u6cd5\u89e3\u51b3\u590d\u6742\u97f3\u9891\u5904\u7406\u6216\u89d2\u8272\u6f14\u7ece\u96be\u9898\u65f6\uff0c\u7d2f\u79ef\u7684\u632b\u8d25\u611f\u53ef\u80fd\u5bfc\u81f4\u653e\u5f03\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cMandy\uff0c\u770b\u5230\u4f60\u81ea\u5df1\u641e\u5b9aAU\u548c\u63d2\u4ef6\u5b89\u88c5\u7684\u5168\u8fc7\u7a0b\uff0c\u771f\u7684\u592a\u5389\u5bb3\u4e86\uff01\u54b1\u4eec\u8bfe\u7a0b\u91cc\u5c31\u9700\u8981\u4f60\u8fd9\u6837\u7231\u94bb\u7814\u3001\u52a8\u624b\u80fd\u529b\u5f3a\u7684\u540c\u5b66\u3002\u540e\u9762\u80af\u5b9a\u4f1a\u9047\u5230\u66f4\u6709\u6311\u6218\u6027\u7684\u6f14\u64ad\u6280\u5de7\u548c\u540e\u671f\u5904\u7406\uff0c\u8bb0\u4f4f\u4f60\u8fd9\u79cd\u2018\u641e\u5b9a\u5b83\u2019\u7684\u52b2\u5934\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4eec\u4e00\u8d77\u62c6\u89e3\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u3002\u5339\u914d\u5176\u94bb\u7814\u7cbe\u795e\u548c\u83b7\u5f97\u8ba4\u53ef\u7684\u6e34\u671b\uff0c\u63d0\u4f9b\u6709\u6311\u6218\u6027\u7684\u4efb\u52a1\u548c\u6df1\u5ea6\u7684\u6280\u80fd\u6307\u5bfc\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u53ef\u80fd\u7684\u6280\u672f\u75b2\u60eb\u671f\uff0c\u8865\u5145\u3010**\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743**\u3011\uff08B\u6a21\u5757\uff09\uff0c\u786e\u4fdd\u9047\u5230\u786c\u6838\u6280\u672f\u95ee\u9898\u65f6\u80fd\u5f97\u5230\u4e13\u5bb6\u7ea7\u5feb\u901f\u54cd\u5e94\uff0c\u7ef4\u6301\u5176\u6210\u5c31\u611f\u5faa\u73af\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u53ea\u7ed9\u6cdb\u6cdb\u7684\u5938\u5956**\u3002\u8868\u626c\u5fc5\u987b\u5177\u4f53\u5230\u5979\u7684\u64cd\u4f5c\u7ec6\u8282\u6216\u4f5c\u54c1\u8fdb\u6b65\u70b9\u30022. **\u5e03\u7f6e\u5927\u91cf\u7b80\u5355\u3001\u91cd\u590d\u7684\u4f5c\u4e1a**\u3002\u8fd9\u4f1a\u8ba9\u5979\u89c9\u5f97\u65e0\u804a\uff0c\u7f3a\u4e4f\u6311\u6218\u30023. **\u5ffd\u89c6\u5979\u7684\u4e3b\u52a8\u63a2\u7d22\u548c\u63d0\u95ee**\u3002\u5fc5\u987b\u8ba4\u771f\u5bf9\u5f85\u5979\u7684\u6bcf\u4e00\u4e2a\u6280\u672f\u6216\u4e13\u4e1a\u7591\u95ee\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u57fa\u4e8e\u5176\u5b66\u4e60\u8fdb\u5c55\u548c\u4f5c\u54c1\u8d28\u91cf\uff0c\u63a8\u4ecb**\u9ad8\u9636\u6f14\u64ad\u6280\u5de7\u8bfe\u6216\u7ec6\u5206\u9886\u57df\uff08\u5982\u60ac\u7591\u3001\u5e7f\u64ad\u5267\uff09\u4e13\u8bad\u8425**\u3002\u907f\u514d\u63a8\u9500\u4e0e\u5f53\u524d\u6280\u80fd\u6210\u957f\u8def\u5f84\u65e0\u5173\u7684\u201c\u53d8\u73b0\u6377\u5f84\u201d\u8bfe\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u4eca\u5929\u89c9\u5f97\u81ea\u5df1\u597d\u725b\u903c\u201d\n2. > \u201c\u597d\u6b79\u8ba4\u8bc6\u70b9\u82f1\u6587 \u6211\u5ffd\u7565\u4e86\u8fd9\u4e2a\u63d0\u9192\u201d\n3. > \u201c\u770b\u4e86\u4e00\u5708\u8fd9\u4e2a\u76ee\u524d\u4e00\u4e2a\u4eba\u5c31\u80fd\u89e3\u51b3 [\u7834\u6d95\u4e3a\u7b11]\u5185\u5bb9\u6211\u4e5f\u633a\u559c\u6b22\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2\u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d\u4f4e**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u6709\u6311\u6218\u6027\u7684\u786c\u6838\u4efb\u52a1+\u53ca\u65f6\u5177\u4f53\u7684\u4e13\u4e1a\u80af\u5b9a\uff0c\u5e76\u4fdd\u969c\u5176\u6280\u672f\u96be\u9898\u7684\u89e3\u51b3\u901a\u9053**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"risk_level\": \"\u4e2d\u4f4e\", \"refund_risk\": \"\u4e2d\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\"}\n```";
