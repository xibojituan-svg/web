    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (B+)**: \u660e\u786e\u3002\u7528\u6237\u4e3b\u52a8\u7533\u8bf7\u4ece\u201c\u7cbe\u82f1\u73ed\u201d\u5ef6\u671f\u81f3\u201c\u8fdb\u9636\u73ed\u201d\uff0c\u5e76\u5e0c\u671b\u201c\u9a6c\u4e0a\u5f00\u8bfe\u201d\uff0c\u8868\u73b0\u51fa\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u6709\u660e\u786e\u9700\u6c42\u548c\u5b66\u4e60\u89c4\u5212\u3002\u540e\u7eed\u79ef\u6781\u53c2\u4e0e\u8bfe\u7a0b\u3001\u4ea4\u4f5c\u4e1a\u3001\u9884\u7ea61V1\u3001\u4e3b\u52a8\u8be2\u95ee\u8fd0\u8425\u8bfe\uff0c\u5b66\u4e60\u9a71\u52a8\u529b\u5f3a\uff0c\u975e\u51b2\u52a8\u6216\u76f2\u76ee\u62a5\u8bfe\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (B)**: \u4e2d\u7b49\u3002\u6709\u5168\u804c\u5de5\u4f5c\uff08\u9700\u51fa\u5dee\u3001\u52a0\u73ed\uff09\uff0c\u65f6\u95f4\u7ba1\u7406\u662f\u4e3b\u8981\u6311\u6218\uff08\u201c\u8fd8\u6ca1\u4e0b\u73ed\u201d\u3001\u201c\u8981\u548c\u5ba2\u6237\u5f00\u4f1a\u201d\u3001\u201c\u5f55\u64ad\u8bfe\u8fd8\u6ca1\u770b\u5b8c\u201d\uff09\u3002\u4f46\u5177\u5907\u57fa\u7840\u8bbe\u5907\uff08\u201c\u6709\u8bbe\u5907\u201d\uff09\uff0c\u80fd\u5e73\u8861\u5de5\u4f5c\u4e0e\u5b66\u4e60\uff08\u201c\u665a\u529f\u201d\u3001\u201c\u8e29\u70b9\u4ea4\u4f5c\u4e1a\u201d\uff09\uff0c\u663e\u793a\u51fa\u4e00\u5b9a\u7684\u8d44\u6e90\u6574\u5408\u80fd\u529b\u3002**\u7ecf\u6d4e\u80fd\u529b\u672a\u76f4\u63a5\u4f53\u73b0\uff0c\u4f46\u80fd\u8fde\u7eed\u62a5\u8bfe\uff08\u7cbe\u82f1\u3001\u8fdb\u9636\u3001\u8ba1\u5212\u540e\u671f\u3001\u8fd0\u8425\uff09\uff0c\u63a8\u6d4b\u6709\u7a33\u5b9a\u6536\u5165\u3002**\n*   **\u5fc3\u7406\u5f39\u6027 (A-)**: \u9ad8\u3002\u6c9f\u901a\u79ef\u6781\u3001\u914d\u5408\u5ea6\u9ad8\uff08\u201c\u597d\u561f\u201d\u3001\u201c\u597d\u597d\u201d\u3001\u201c\u8c22\u8c22\u201d\uff09\u3002\u80fd\u6e05\u6670\u8ba4\u77e5\u81ea\u8eab\u5c40\u9650\uff08\u201c\u4e00\u8d77\u4e0a\u80af\u5b9a\u90fd\u5b66\u4e0d\u597d\u201d\uff09\uff0c\u5e76\u4e3b\u52a8\u8c03\u6574\u7b56\u7565\uff08\u7533\u8bf7\u5ef6\u671f\u3001\u63d0\u524d\u89c4\u5212\u4f5c\u4e1a\uff09\u3002\u9762\u5bf9\u65f6\u95f4\u51b2\u7a81\uff08\u51fa\u5dee\u3001\u52a0\u73ed\uff09\u80fd\u4e3b\u52a8\u6c9f\u901a\u3001\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff08\u8bf7\u5047\u3001\u770b\u56de\u653e\u3001\u63d0\u524d\u505a\u4f5c\u4e1a\uff09\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u65e0\u62b1\u6028\u6216\u8d1f\u9762\u60c5\u7eea\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: \u5df2\u652f\u4ed8\u3002\u7528\u6237\u5df2\u8fdb\u5165\u201c\u8fdb\u9636\u73ed\u201d\u5b66\u4e60\uff0c\u5e76\u8ba8\u8bba\u540e\u7eed\u8bfe\u7a0b\uff08\u540e\u671f\u3001\u8fd0\u8425\uff09\uff0c\u652f\u4ed8\u884c\u4e3a\u5df2\u5b8c\u6210\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u5bb6\u5ead\u6216\u914d\u5076\u610f\u89c1\uff0c\u7528\u6237\u51b3\u7b56\u8868\u73b0\u4e3a\u9ad8\u5ea6\u81ea\u4e3b\u3002**\u9700\u5728\u540e\u7eed\u670d\u52a1\u4e2d\u9690\u6027\u786e\u8ba4\uff0c\u5c24\u5176\u662f\u6d89\u53ca\u5927\u989d\u7eed\u8d39\uff08\u5982\u8fd0\u8425\u8bfe\uff09\u65f6\u3002**\n*   **\u6b65\u9aa42 - \u52a8\u673a\u4e0e\u8d44\u6e90\u5339\u914d (AB\u8f74)**: **B\u578b (\u52a1\u5b9e\u89c4\u5212\u8005)**\u3002\u52a8\u673a\u660e\u786e\uff08\u63d0\u5347\u6f14\u64ad\u6280\u80fd\uff09\uff0c\u8d44\u6e90\uff08\u65f6\u95f4\uff09\u6709\u9650\u4f46\u80fd\u4e3b\u52a8\u7ba1\u7406\uff0c\u76ee\u6807\u4e0e\u884c\u52a8\u57fa\u672c\u5339\u914d\u3002\n*   **\u6b65\u9aa43 - \u5fc3\u7406\u5f39\u6027\u4e0e\u98ce\u9669 (C\u8f74)**: **C+\u578b (\u9ad8\u5f39\u6027\u9002\u5e94\u8005)**\u3002\u9002\u5e94\u6027\u5f3a\uff0c\u80fd\u79ef\u6781\u5e94\u5bf9\u65f6\u95f4\u51b2\u7a81\u7b49\u5916\u90e8\u538b\u529b\uff0c\u5b66\u4e60\u8fc7\u7a0b\u7a33\u5b9a\u3002\n*   **\u7efc\u5408\u5224\u5b9a**: **B+\u578b\u7528\u6237**\u3002\u76ee\u6807\u6e05\u6670\u3001\u884c\u52a8\u52a1\u5b9e\u3001\u5f39\u6027\u826f\u597d\uff0c\u662f\u5178\u578b\u7684**\u9ad8\u4ef7\u503c\u7eed\u8d39\u6f5c\u529b\u7528\u6237**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n**T4 \u81ea\u5f8b\u8fdb\u53d6\u8005**\u3002\n*   **\u7279\u5f81\u543b\u5408**: \u6709\u660e\u786e\u804c\u4e1a\uff08\u9700\u51fa\u5dee\u53c2\u5c55\uff0c\u7591\u4f3c\u5916\u8d38/\u9500\u552e\uff09\uff0c\u5b66\u4e60\u76ee\u7684\u6027\u5f3a\uff08\u4ece\u7cbe\u82f1\u73ed\u8f6c\u8fdb\u9636\u73ed\u4ee5\u66f4\u597d\u5438\u6536\uff09\u3002\u81ea\u5f8b\u6027\u9ad8\uff08\u575a\u6301\u4ea4\u4f5c\u4e1a\uff0c\u5373\u4f7f\u201c\u8e29\u70b9\u201d\uff09\u3002\u89c4\u5212\u6027\u5f3a\uff08\u63d0\u524d\u8be2\u95ee\u4f5c\u4e1a\u3001\u89c4\u52121V1\u3001\u8003\u8651\u8bfe\u7a0b\u8854\u63a5\uff09\u3002\n*   **\u6838\u5fc3\u8bc9\u6c42**: \u5728\u6709\u9650\u65f6\u95f4\u5185\u83b7\u5f97\u6700\u9ad8\u6548\u7684\u5b66\u4e60\u8def\u5f84\u548c\u660e\u786e\u7684\u6280\u80fd\u63d0\u5347\u56de\u62a5\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u6781\u4f4e)\n*   **\u6839\u56e01 (\u6548\u679c\u4e0d\u7b26\u9884\u671f)**: \u4f4e\u3002\u7528\u6237\u5bf9\u5b66\u4e60\u6709\u5408\u7406\u9884\u671f\uff08\u201c\u4e00\u4e2a\u4e00\u4e2a\u5438\u6536\u597d\u4e00\u70b9\u201d\uff09\uff0c\u4e14\u6301\u7eed\u6295\u5165\u3002\n*   **\u6839\u56e02 (\u7ecf\u6d4e\u538b\u529b)**: \u4f4e\u3002\u672a\u63d0\u53ca\uff0c\u4e14\u6709\u8fde\u7eed\u62a5\u8bfe\u610f\u5411\u3002\n*   **\u6839\u56e03 (\u65f6\u95f4\u51b2\u7a81)**: **\u4e2d (\u4e3b\u8981\u98ce\u9669\u70b9)**\u3002\u5de5\u4f5c\u7e41\u5fd9\u662f\u5ba2\u89c2\u4e8b\u5b9e\uff0c\u4f46\u7528\u6237\u5df2\u5c55\u73b0\u51fa\u4f18\u79c0\u7684\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u548c\u5f39\u6027\uff08\u5229\u7528\u788e\u7247\u65f6\u95f4\u3001\u770b\u56de\u653e\uff09\u3002\u98ce\u9669\u53ef\u63a7\u3002\n*   **\u6839\u56e04 (\u5bb6\u5ead\u53cd\u5bf9)**: \u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u8bc4\u4f4e\u3002\n*   **\u6839\u56e05 (\u7ade\u54c1\u6bd4\u8f83/\u9500\u552e\u8bef\u5bfc)**: \u6781\u4f4e\u3002\u7528\u6237\u4e0e\u73ed\u73ed\u5173\u7cfb\u878d\u6d3d\uff0c\u4e14\u5bf9\u9500\u552e\u5de5\u4f5c\u8868\u793a\u7406\u89e3\uff08\u201c\u505a\u9500\u552e\u7684\u5f88\u5bb9\u6613\u5171\u60c5\u201d\uff09\u3002\n*   **\u6839\u56e06 (\u5e73\u53f0/\u670d\u52a1\u4f53\u9a8c)**: \u6781\u4f4e\u3002\u6c9f\u901a\u987a\u7545\uff0c\u670d\u52a1\u54cd\u5e94\u53ca\u65f6\u3002\n*   **\u6839\u56e07 (\u4ece\u4f17\u540e\u6094)**: \u6781\u4f4e\u3002\u51b3\u7b56\u81ea\u4e3b\uff0c\u5b66\u4e60\u8def\u5f84\u6e05\u6670\u3002\n*   **\u7efc\u5408\u98ce\u9669\u7b49\u7ea7**: **\u4f4e**\u3002\u4e3b\u8981\u98ce\u9669\u4ec5\u4e3a\u65f6\u95f4\u51b2\u7a81\uff0c\u4f46\u7528\u6237\u81ea\u6211\u7ba1\u7406\u80fd\u529b\u6781\u5f3a\uff0c\u98ce\u9669\u53ef\u63a7\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u98ce\u9669\u70b9**: \u9500\u552e\u57284\u67087\u65e5\u5bf9\u8bdd\u4e2d\uff0c**\u5b58\u5728\u660e\u663e\u7684\u5347\u5355\u5f15\u5bfc\u884c\u4e3a**\uff08\u63a8\u8350\u8fd0\u8425\u8bfe\u3001\u97f3\u526a\u8054\u62a5\u3001\u63d0\u53ca\u201c\u65f6\u85aa\u201d\u3001\u201c\u6323\u96f6\u82b1\u94b1\u201d\u7b49\u53d8\u73b0\u9884\u671f\uff09\u3002\u867d\u672a\u53d1\u73b0\u5938\u5927\u6216\u6b3a\u9a97\uff0c\u4f46\u5c5e\u4e8e\u4e3b\u52a8\u8425\u9500\u3002\n*   **\u5408\u89c4\u6027**: \u6574\u4f53\u5408\u89c4\u3002\u9500\u552e\u6c9f\u901a\u98ce\u683c\u4eb2\u5207\uff0c\u672a\u53d1\u73b0\u627f\u8bfa\u4fdd\u5e95\u6536\u5165\u3001\u8bcb\u6bc1\u7ade\u54c1\u7b49**\u7ea2\u7ebf\u884c\u4e3a**\u3002\u4f46\u9700\u6ce8\u610f\u5728\u7528\u6237\u8868\u793a\u201c\u6211\u8981\u60f3\u60f3\u201d\u540e\uff0c\u5e94\u7ed9\u4e88\u5145\u5206\u51b3\u7b56\u65f6\u95f4\uff0c\u907f\u514d\u8fc7\u5ea6\u8ddf\u8fdb\u5f15\u53d1\u53cd\u611f\u3002\n*   **\u7ed3\u8bba**: \u9500\u552e\u8fc7\u7a0b\u57fa\u672c\u5408\u89c4\uff0c**\u5347\u5355\u610f\u56fe\u660e\u663e\u4f46\u65b9\u5f0f\u67d4\u548c**\uff0c\u7b26\u5408\u5bf9\u9ad8\u6f5c\u529b\u7528\u6237\u7684\u6b63\u5e38\u8fd0\u8425\u52a8\u4f5c\u3002\u9700\u5173\u6ce8\u540e\u7eed\u8ddf\u8fdb\u8282\u594f\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d**: **\u9ad8\u5ea6\u5339\u914d**\u3002\u7528\u6237\u5f53\u524d\u201c\u8fdb\u9636\u73ed\u201d\u4e0e\u5176\u201c\u52a1\u5b9e\u63d0\u5347\u201d\u9700\u6c42\u5339\u914d\u3002\u89c4\u5212\u7684\u201c\u8fd0\u8425\u8bfe\u201d\u4e0e\u5176\u201c\u660e\u786e\u53d8\u73b0\u201d\u7684\u8fdb\u9636\u9700\u6c42\u5339\u914d\u3002\u201c\u540e\u671f\u8bfe\u201d\u5ef6\u671f\u5b89\u6392\u4e5f\u4f53\u73b0\u4e86\u5bf9\u5176\u65f6\u95f4\u8d44\u6e90\u7684\u5c0a\u91cd\u3002\n*   **\u884c\u52a8\u6307\u5357**:\n    1.  **\u9996\u8981\u52a8\u4f5c**: **\u5de9\u56fa\u4fe1\u4efb\uff0c\u63d0\u4f9b\u5f39\u6027\u652f\u6301**\u3002\u8ba4\u53ef\u5176\u5b66\u4e60\u6001\u5ea6\uff0c\u4e3b\u52a8\u4e3a\u5176\u65f6\u95f4\u7ba1\u7406\u63d0\u4f9b\u4fbf\u5229\uff08\u5982\u56de\u653e\u3001\u4f5c\u4e1a\u5f39\u6027\uff09\u3002\n    2.  **1V1\u91cd\u70b9**: \u5728\u5df2\u9884\u7ea6\u76841V1\u4e2d\uff0c\u91cd\u70b9\u5e2e\u52a9\u5176**\u5236\u5b9a\u6e05\u6670\u7684\u3001\u4e0e\u5de5\u4f5c\u517c\u5bb9\u7684\u5b66\u4e60-\u5b9e\u8df5\u8def\u5f84\u56fe**\uff0c\u5f3a\u5316\u5176\u201c\u81ea\u5f8b\u8fdb\u53d6\u8005\u201d\u7684\u6b63\u5411\u8eab\u4efd\u8ba4\u540c\u3002\n    3.  **\u5347\u5355\u7b56\u7565**: \u5bf9\u8fd0\u8425\u8bfe\u7b49\u5347\u5355\uff0c**\u91c7\u7528\u201c\u4fe1\u606f\u63d0\u4f9b\u8005\u201d\u800c\u975e\u201c\u63a8\u9500\u8005\u201d\u59ff\u6001**\u3002\u63d0\u4f9b\u6e05\u6670\u7684\u8bfe\u7a0b\u4ef7\u503c\u3001\u6392\u671f\u4e0e\u5ef6\u671f\u653f\u7b56\uff0c**\u7531\u5176\u81ea\u4e3b\u51b3\u7b56**\u3002\u53ef\u5206\u4eab\u5f80\u671f\u540c\u7c7b\uff08\u5728\u804c\uff09\u5b66\u5458\u7684\u6210\u529f\u6848\u4f8b\uff0c\u589e\u5f3a\u4fe1\u5fc3\u3002\n    4.  **\u98ce\u9669\u76d1\u63a7**: \u65e0\u9700\u7279\u6b8a\u5e72\u9884\u3002\u4ec5\u9700\u5728\u5176\u51fa\u5dee\u3001\u5de5\u4f5c\u7e41\u5fd9\u671f\u7ed9\u4e88\u8f7b\u5ea6\u5173\u6000\uff0c\u9632\u6b62\u56e0\u8fc7\u5ea6\u75b2\u52b3\u4ea7\u751f\u77ed\u6682\u61c8\u6020\u3002\n\n{\"core_type\": \"T4 \u81ea\u5f8b\u8fdb\u53d6\u8005\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"product_match\": \"\u5339\u914d\", \"action\": \"1V1\u5f3a\u5316\u8def\u5f84\u89c4\u5212\u4e0e\u8eab\u4efd\u8ba4\u540c\"}";
