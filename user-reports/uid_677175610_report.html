    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n## \u4fe1\u606f\u5145\u8db3\u6027\u8bc4\u4f30\n\u4fe1\u606f\u5145\u8db3\uff0c\u53ef\u8fdb\u884c\u5b8c\u6574\u5206\u6790\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u4e2d\u7b49**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u8003\u8651\u5b66\u597d\u6280\u80fd\u901a\u8fc7\u6280\u80fd\u7ed9\u81ea\u5df1\u4e00\u4e2a\u4fdd\u969c\u201d\uff0c\u663e\u793a\u51fa\u5bf9\u6280\u80fd\u63d0\u5347\u548c\u6536\u5165\u4fdd\u969c\u7684\u52a1\u5b9e\u9700\u6c42\u3002\u4f46\u52a8\u673a\u4e2d\u201c\u5feb\u901f\u6536\u5165\u201d\u7684\u503e\u5411\u660e\u663e\uff0c\u5bf9\u53d8\u73b0\u901f\u5ea6\u548c\u96be\u5ea6\u7684\u8ba4\u77e5\u53ef\u80fd\u4e0d\u5145\u5206\uff0c\u5b58\u5728**\u77ed\u671f\u529f\u5229\u4e3b\u4e49**\u503e\u5411\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u8f83\u4f4e**\u3002\u7528\u6237\u900f\u9732\u201c\u5f04\u5b69\u5b50\u4f5c\u4e1a\u201d\uff0c\u8868\u660e\u5176\u4e3a**\u6709\u5bb6\u5ead\u8d1f\u62c5\u7684\u6210\u5e74\u4eba**\uff0c\u53ef\u80fd\u4e3a\u5b9d\u5988\u3002\u53ef\u81ea\u7531\u652f\u914d\u7684\u5b66\u4e60\u65f6\u95f4\uff08\u6bcf\u59292-4\u5c0f\u65f6\uff09\u548c\u7cbe\u529b\u6709\u9650\uff0c\u7ecf\u6d4e\u6297\u98ce\u9669\u80fd\u529b\u672a\u77e5\u4f46\u53ef\u80fd\u4e0d\u5f3a\uff08\u5173\u6ce8\u9000\u8d39\u653f\u7b56\uff09\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u4e2d\u7b49\u504f\u4e0b**\u3002\u7528\u6237\u80fd\u5b8c\u6210\u4f5c\u4e1a\u3001\u8ddf\u8fdb\u76f4\u64ad\uff0c\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u914d\u5408\u5ea6\u4e0e\u6267\u884c\u529b\u3002\u4f46\u81ea\u6211\u8bc4\u4ef7\u504f\u4f4e\uff08\u201c\u5f55\u7684\u4e0d\u597d\u201d\uff09\uff0c\u9700\u8981\u5916\u90e8\u9f13\u52b1\u548c\u80af\u5b9a\uff0c\u9762\u5bf9\u5b66\u4e60\u538b\u529b\u548c\u672a\u6765\u53d8\u73b0\u4e0d\u786e\u5b9a\u6027\u65f6\uff0c**\u4f9d\u8d56\u611f\u8f83\u5f3a\uff0c\u81ea\u4fe1\u5fc3\u4e0d\u8db3**\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u5df2\u652f\u4ed8\u8ba2\u5355\uff08\u8ba2\u5355\u53f7\uff1a202604124001610007941449437\uff09\uff0c\u8bfe\u7a0b\u4ef7\u683c3980\u5143\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u5b58\u5728\u7ebf\u7d22**\u3002\u7528\u6237\u63d0\u53ca\u201c\u5f04\u5b69\u5b50\u4f5c\u4e1a\u201d\uff0c\u6697\u793a\u5176\u4e3a\u5bb6\u5ead\u4e8b\u52a1\u7684\u4e3b\u8981\u627f\u62c5\u8005\u4e4b\u4e00\uff0c\u53ef\u80fd\u62e5\u6709\u4e00\u5b9a\u7684\u5bb6\u5ead\u5185\u90e8\u51b3\u7b56\u6743\uff0c\u4f46\u672a\u660e\u786e\u63d0\u53ca\u662f\u5426\u9700\u8981\u4e0e\u914d\u5076\u5546\u8bae\u5927\u989d\u6d88\u8d39\u3002**\u9700\u73ed\u4e3b\u4efb\u540e\u7eed\u786e\u8ba4**\u3002\n*   **\u6b65\u9aa41 - \u9700\u6c42\u5f3a\u5ea6**: **B\u7c7b\uff08\u4e2d\u7b49\u9700\u6c42\uff09**\u3002\u7528\u6237\u6709\u660e\u786e\u7684\u6280\u80fd\u5b66\u4e60\u548c\u6536\u5165\u4fdd\u969c\u9700\u6c42\uff0c\u4f46\u975e\u8feb\u5728\u7709\u776b\u7684\u751f\u5b58\u538b\u529b\uff0c\u4e14\u5bf9\u201c\u5feb\u901f\u6536\u5165\u201d\u6709\u671f\u5f85\u3002\n*   **\u6b65\u9aa42 - \u652f\u4ed8\u80fd\u529b**: **C\u7c7b\uff08\u652f\u4ed8\u80fd\u529b\u5b58\u7591\uff09**\u3002\u7528\u6237\u5173\u6ce8\u9000\u8d39\u653f\u7b56\uff08\u201c\u62a5\u540d\u540e\u5b66\u4e60\u4e00\u6bb5\u65f6\u95f4\u540e\u4e0d\u60f3\u5b66\u4e86\uff0c\u5b66\u8d39\u80fd\u9000\u5417\u201d\uff09\uff0c\u662f**\u5178\u578b\u7684\u98ce\u9669\u654f\u611f\u578b\u4fe1\u53f7**\uff0c\u8868\u660e\u5176\u5bf9\u8fd9\u7b14\u652f\u51fa\u7684\u8c28\u614e\u6001\u5ea6\u548c\u53ef\u80fd\u6709\u9650\u7684\u7ecf\u6d4e\u7f13\u51b2\u7a7a\u95f4\u3002\n*   **\u6b65\u9aa43 - \u51b3\u7b56\u5468\u671f**: **\u77ed\u5468\u671f\uff08A\u7c7b\uff09**\u3002\u4ece\u8be2\u95ee\u4ef7\u683c\u5230\u5b8c\u6210\u652f\u4ed8\uff0c\u51b3\u7b56\u901f\u5ea6\u8f83\u5feb\uff0c\u6613\u53d7\u9500\u552e\u8bdd\u672f\uff08\u201c\u62fc\u624b\u901f\u201d\u3001\u201c\u9650\u91cf\u201d\u3001\u201c\u5de5\u4f5c\u5ba4\u8d44\u6e90\u201d\uff09\u5f71\u54cd\u3002\n*   **\u6b65\u9aa44 - \u4fe1\u4efb\u57fa\u7840**: **\u4e2d\u7b49**\u3002\u7528\u6237\u5bf9\u9500\u552e\uff08\u5b66\u59d0\uff09\u7684\u6307\u5bfc\u6709\u57fa\u672c\u670d\u4ece\uff08\u5b8c\u6210\u4f5c\u4e1a\u3001\u53d1\u53e3\u4ee4\uff09\uff0c\u4f46\u4fe1\u4efb\u66f4\u591a\u5efa\u7acb\u5728\u201c\u8d44\u6e90\u627f\u8bfa\u201d\uff08\u5de5\u4f5c\u5ba4\u3001\u5546\u5355\uff09\u4e0a\uff0c\u800c\u975e\u5bf9\u4e2a\u4eba\u80fd\u529b\u7684\u6df1\u5ea6\u8ba4\u540c\u3002\n*   **\u7efc\u5408\u5224\u5b9a**: **B2C\u578b\u7528\u6237**\u3002\u6709\u4e2d\u7b49\u5b66\u4e60\u610f\u613f\u548c\u4fdd\u969c\u9700\u6c42\uff0c\u4f46\u652f\u4ed8\u80fd\u529b\u662f\u660e\u663e\u77ed\u677f\uff0c\u4e14\u51b3\u7b56\u6613\u53d7\u5916\u90e8\u6fc0\u52b1\u9a71\u52a8\uff0c**\u540e\u7eed\u670d\u52a1\u538b\u529b\u548c\u9000\u8d39\u98ce\u9669\u5e76\u5b58**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n**T5 \u7126\u8651\u4fdd\u969c\u578b**\n*   **\u6838\u5fc3\u7279\u5f81**: \u5bfb\u6c42\u5b89\u5168\u611f\u548c\u751f\u6d3b\u4fdd\u969c\uff0c\u5bf9\u98ce\u9669\u654f\u611f\uff0c\u51b3\u7b56\u8c28\u614e\u4f46\u6613\u53d7\u201c\u4fdd\u969c\u627f\u8bfa\u201d\u5f71\u54cd\u3002\n*   **\u5339\u914d\u4f9d\u636e**: \u7528\u6237\u6838\u5fc3\u8bc9\u6c42\u662f\u201c\u7ed9\u81ea\u5df1\u4e00\u4e2a\u4fdd\u969c\u201d\uff0c\u5173\u6ce8\u9000\u8d39\u653f\u7b56\uff0c\u7b26\u5408T5\u5bf9\u786e\u5b9a\u6027\u548c\u98ce\u9669\u89c4\u907f\u7684\u5f3a\u70c8\u9700\u6c42\u3002\u540c\u65f6\uff0c\u5176\u201c\u5feb\u901f\u6536\u5165\u201d\u7684\u671f\u671b\u4e0eT5\u5e0c\u671b\u5feb\u901f\u770b\u5230\u56de\u62a5\u4ee5\u7f13\u89e3\u7126\u8651\u7684\u5fc3\u6001\u76f8\u7b26\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669**: **\u4e2d\u9ad8**\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u6548\u679c\u4e0d\u53ca\u9884\u671f**: **\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u201c\u5feb\u901f\u6536\u5165\u201d\u548c\u201c\u6280\u80fd\u4fdd\u969c\u201d\u62b1\u6709\u8f83\u9ad8\u671f\u5f85\uff0c\u82e5\u5b66\u4e60\u66f2\u7ebf\u9661\u5ced\u6216\u521d\u671f\u63a5\u5355\u4e0d\u987a\uff0c\u6781\u6613\u4ea7\u751f\u843d\u5dee\u611f\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**: **\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u4e3b\u52a8\u8be2\u95ee\u9000\u8d39\u653f\u7b56\uff0c\u662f\u6f5c\u5728\u7ecf\u6d4e\u538b\u529b\u7684\u663e\u6027\u4fe1\u53f7\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**: **\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u9700\u517c\u987e\u5bb6\u5ead\uff08\u5b69\u5b50\uff09\uff0c\u82e5\u8bfe\u7a0b\u5f3a\u5ea6\u4e0e\u5bb6\u5ead\u4e8b\u52a1\u51b2\u7a81\uff0c\u53ef\u80fd\u65e0\u6cd5\u6301\u7eed\u6295\u5165\u3002\n    4.  **\u8bfe\u7a0b\u8d28\u91cf**: \u4fe1\u606f\u4e0d\u8db3\uff0c\u5f85\u89c2\u5bdf\u3002\n    5.  **\u670d\u52a1\u4f53\u9a8c**: **\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u9500\u552e\u8ddf\u8fdb\u53ca\u65f6\uff0c\u4f53\u9a8c\u5c1a\u53ef\u3002\n    6.  **\u9500\u552e\u8bef\u5bfc**: **\u4e2d\u98ce\u9669**\u3002\u9500\u552e\u5927\u91cf\u4f7f\u7528\u201c\u5de5\u4f5c\u5ba4\u8d44\u6e90\u201d\u3001\u201cMCN\u7b7e\u7ea6\u201d\u3001\u201c\u5feb\u901f\u63a5\u5355\u201d\u7b49\u627f\u8bfa\u6027\u8bdd\u672f\uff0c**\u53ef\u80fd\u62c9\u9ad8\u7528\u6237\u9884\u671f**\uff0c\u57cb\u4e0b\u7ea0\u7eb7\u9690\u60a3\u3002\n    7.  **\u7ade\u54c1\u5bf9\u6bd4/\u9700\u6c42\u6d88\u5931**: \u4f4e\u98ce\u9669\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u3010\u5b58\u5728\u98ce\u9669\u70b9\u3011**\n    *   **\u8fc7\u5ea6\u627f\u8bfa**: \u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u7b2c\u4e8c\u4e2a\u6708\u63a5\u5355\u7a33\u4e86\u201d\u3001\u201c\u52a0\u5165\u5de5\u4f5c\u5ba4\u201d\u3001\u201cMCN\u7b7e\u7ea6\u201d\u3001\u201c\u5185\u90e8\u8d44\u6e90\u5e93\u201d\u3001\u201c\u5e74\u5ba1\u901a\u9053\u201d\u7b49\uff0c**\u5b58\u5728\u4ee5\u672a\u6765\u4e0d\u786e\u5b9a\u8d44\u6e90\u4f5c\u4e3a\u5f53\u524d\u9500\u552e\u5de5\u5177\u7684\u98ce\u9669**\uff0c\u6613\u5f15\u53d1\u540e\u7eed\u6295\u8bc9\u3002\n    *   **\u5236\u9020\u7a00\u7f3a\u4e0e\u7126\u8651**: \u9891\u7e41\u4f7f\u7528\u201c\u62fc\u624b\u901f\u201d\u3001\u201c\u62a2\u540d\u989d\u201d\u3001\u201c\u9650\u91cf\u201d\u3001\u201c\u9519\u8fc7\u5c31\u542c\u4e0d\u61c2\u201d\u7b49\u8bdd\u672f\uff0c\u7b26\u5408\u5408\u89c4\u7070\u8272\u5730\u5e26\uff0c\u4f46\u9700\u8b66\u60d5\u3002\n    *   **\u9000\u8d39\u653f\u7b56\u544a\u77e5**: \u5f53\u7528\u6237\u8be2\u95ee\u9000\u8d39\u65f6\uff0c\u9500\u552e\u4ec5\u7b80\u5355\u56de\u590d\u201c\u6ca1\u6709\u89e3\u9501\u7684\u8bfe\u7a0b\u5b66\u8d39\u5168\u9000\u201d\uff0c**\u672a\u8be6\u7ec6\u8bf4\u660e\u9000\u8d39\u7684\u5177\u4f53\u6d41\u7a0b\u3001\u6761\u4ef6\u548c\u53ef\u80fd\u4ea7\u751f\u7684\u8d39\u7528**\uff0c\u544a\u77e5\u4e0d\u5145\u5206\u3002\n*   **\u3010\u5408\u89c4\u70b9\u3011**\n    *   \u9500\u552e\u5bf9\u8bfe\u7a0b\u5f62\u5f0f\uff08\u6bcf\u5468\u89e3\u9501\uff09\u3001\u5b66\u4e60\u6295\u5165\u65f6\u95f4\uff082-4\u5c0f\u65f6/\u5929\uff09\u6709\u57fa\u672c\u8bf4\u660e\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6838\u5fc3\u7b56\u7565**: **\u964d\u4f4e\u9884\u671f\uff0c\u5f3a\u5316\u8fc7\u7a0b\uff0c\u63d0\u4f9b\u5b89\u5168\u611f**\u3002\u91cd\u70b9\u7ba1\u7406\u7528\u6237\u5bf9\u201c\u5feb\u901f\u53d8\u73b0\u201d\u7684\u9884\u671f\uff0c\u5c06\u76ee\u6807\u4ece\u201c\u5feb\u901f\u6536\u5165\u201d\u5f15\u5bfc\u81f3\u201c\u6280\u80fd\u624e\u5b9e\u6210\u957f\u201d\u3002\n*   **\u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357**:\n    1.  **\u7834\u51b0\u671f\uff08\u5173\u952e\uff09**: \u9996\u6b21\u6c9f\u901a\u5fc5\u987b**\u660e\u786e\u3001\u4e66\u9762\u5316**\u5730\u91cd\u7533\u5b66\u4e60\u8def\u5f84\u3001\u53d8\u73b0\u5468\u671f\u548c\u9000\u8d39\u653f\u7b56\uff0c\u7ba1\u7406\u9884\u671f\u3002\u91cd\u70b9\u4e86\u89e3\u5176\u6bcf\u65e5\u53ef\u56fa\u5b9a\u5b66\u4e60\u7684\u65f6\u95f4\u6bb5\u3002\n    2.  **\u8fc7\u7a0b\u6fc0\u52b1**: \u7ed9\u4e88\u9ad8\u9891\u3001\u5177\u4f53\u7684\u4f5c\u4e1a\u53cd\u9988\u548c\u9f13\u52b1\uff0c\u5f25\u8865\u5176\u81ea\u4fe1\u4e0d\u8db3\u3002**\u907f\u514d\u7a7a\u6cdb\u8868\u626c**\uff0c\u591a\u6307\u51fa\u5177\u4f53\u8fdb\u6b65\u70b9\u3002\n    3.  **\u98ce\u9669\u9884\u8b66**: \u63d0\u524d\u544a\u77e5\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u53ef\u80fd\u9047\u5230\u7684\u74f6\u9888\uff08\u5982\u8bd5\u97f3\u4e0d\u4e2d\u3001\u6280\u80fd\u5e73\u53f0\u671f\uff09\uff0c\u5c06\u5176\u6b63\u5e38\u5316\uff0c\u51cf\u5c11\u7126\u8651\u3002\n    4.  **\u8d44\u6e90\u5bf9\u63a5**: \u5728\u7528\u6237\u5b8c\u6210\u57fa\u7840\u6280\u80fd\u5b66\u4e60\u540e\uff0c\u518d\u9002\u65f6\u3001\u9002\u91cf\u5730\u63d0\u4f9b\u771f\u5b9e\u7684\u521d\u7ea7\u8bd5\u97f3\u6216\u5546\u5355\u673a\u4f1a\uff0c\u7528\u201c\u5c0f\u6b63\u53cd\u9988\u201d\u7ef4\u6301\u52a8\u529b\uff0c\u5207\u5fcc\u8fc7\u65e9\u627f\u8bfa\u9ad8\u4ef7\u503c\u8d44\u6e90\u3002\n    5.  **\u5bb6\u5ead\u652f\u6301**: \u53ef\u59d4\u5a49\u8be2\u95ee\u5176\u5b66\u4e60\u65f6\u95f4\u5b89\u6392\u662f\u5426\u4e0e\u5bb6\u4eba\u6c9f\u901a\u597d\uff0c\u4e89\u53d6\u5bb6\u5ead\u73af\u5883\u7684\u652f\u6301\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**:\n    *   **\u4e3b\u7ebf**: \u5339\u914d\u6807\u51c6\u5316\u7684**\u6280\u80fd\u8fdb\u9636\u8bfe\u7a0b**\uff0c\u5f3a\u8c03\u7cfb\u7edf\u6027\u3001\u6253\u57fa\u7840\u3002\n    *   **\u589e\u503c\u670d\u52a1**: \u8c28\u614e\u63a8\u9001\u201c\u4fdd\u5e95\u63a5\u5355\u201d\u6216\u201c\u9ad8\u989d\u53d8\u73b0\u201d\u7c7b\u4ea7\u54c1\u3002\u53ef\u63a8\u8350**\u201c\u5b66\u4e60\u4fdd\u969c\u8ba1\u5212\u201d\u6216\u201c\u6162\u6210\u957f\u966a\u4f34\u8425\u201d** \u8fd9\u7c7b\u5f3a\u8c03\u957f\u671f\u4e3b\u4e49\u548c\u793e\u7fa4\u652f\u6301\u7684\u4ea7\u54c1\uff0c\u66f4\u7b26\u5408\u5176\u201c\u4fdd\u969c\u201d\u9700\u6c42\u3002\n    *   **\u6302\u8f7d\u4e50\u9ad8\u7ebf**: **\u201c\u8f7b\u91cf\u7ea7\u5546\u5355\u5b9e\u6218\u5305\u201d**\uff08\u5c0f\u989d\u3001\u786e\u5207\u7684\u5355\u5b50\uff09\u4f18\u4e8e\u201c\u8d44\u6e90\u5bf9\u63a5\u5927\u5e08\u73ed\u201d\u3002\u524d\u8005\u80fd\u63d0\u4f9b\u771f\u5b9e\u4f53\u9a8c\u548c\u5fae\u5c0f\u6536\u76ca\uff0c\u540e\u8005\u5bb9\u6613\u56e0\u9884\u671f\u8fc7\u9ad8\u800c\u5f15\u53d1\u4e0d\u6ee1\u3002\n\n{\"core_type\": \"T5 \u7126\u8651\u4fdd\u969c\u578b\", \"risk_level\": \"\u4e2d\u9ad8\", \"refund_risk\": \"\u4e2d\u9ad8\", \"maslow_need\": \"\u5b89\u5168/\u5c0a\u91cd\", \"target_product_line\": \"\u6280\u80fd\u8fdb\u9636\u8bfe\u7a0b + \u8f7b\u91cf\u7ea7\u5546\u5355\u5b9e\u6218\u5305\", \"age\": \"\u672a\u77e5\uff08\u63a8\u6d4b\u4e3a30\u5c81\u4ee5\u4e0a\u5b9d\u5988\uff09\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}";
