    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677152442 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-06 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u4e8e\u53cc\u53cc\uff08\u9500\u552e/\u73ed\u4e3b\u4efb\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u9ad8\u9636\u73ed\uff08\u4ef7\u683c\uff1a3980\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u7528\u6237\u4e3a55\u5c81\u65e0\u4e1a\u5973\u6027\uff0c\u65f6\u95f4\u76f8\u5bf9\u81ea\u7531\uff0c\u4f46\u9700\u5904\u7406\u5bb6\u5ead\u4e8b\u52a1\uff0c\u5982\u201c\u665a\u4e0a\u5904\u7406\u4e00\u4e9b\u4e8b\u60c5\u201d\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\uff08\u6709\u57fa\u7840\u4e92\u52a8\u4e0e\u5b66\u4e60\u884c\u4e3a\uff0c\u4f46\u7f3a\u4e4f\u652f\u4ed8\u3001\u5bb6\u5ead\u3001\u6df1\u5c42\u52a8\u673a\u7b49\u5173\u952e\u4fe1\u606f\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u660e\u786e\u8868\u8fbe\u4e86\u201c\u6280\u80fd\u53d8\u73b0\u201d\u7684\u529f\u5229\u76ee\u7684\uff0c\u4f46\u540c\u65f6\u4e5f\u6709\u201c\u4e30\u5bcc\u4e1a\u4f59\u751f\u6d3b\uff0c\u63d0\u5347\u58f0\u97f3\u54c1\u8d28\u201d\u7684\u5174\u8da3\u548c\u81ea\u6211\u63d0\u5347\u8bc9\u6c42\u3002\u672a\u8868\u73b0\u51fa\u5bf9\u201c\u51e0\u5929\u5185\u63d0\u73b0\u201d\u7684\u6781\u7aef\u6e34\u671b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6765\u8fd9\u91cc\u7684\u76ee\u7684\u662f\u4ec0\u4e48\u5462\uff1f\u5e0c\u671b\u4e30\u5bcc\u4e1a\u4f59\u751f\u6d3b\uff0c\u63d0\u5347\u58f0\u97f3\u54c1\u8d28\uff0c\u53ef\u4ee5\u6280\u80fd\u53d8\u73b0\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u7ecf\u6d4e\u72b6\u51b5\uff0c\u4f463980\u5143\u8bfe\u7a0b\u5df2\u62a5\u540d\uff0c\u9700\u8b66\u60d5\u662f\u5426\u5b58\u5728\u501f\u8d37\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 55\u5c81\u65e0\u4e1a\uff0c\u65f6\u95f4\u76f8\u5bf9\u5bbd\u88d5\uff0c\u80fd\u5b8c\u6210\u4f5c\u4e1a\u548c\u76f4\u64ad\u8bfe\uff0c\u4f46\u5b66\u4e60\u8fc7\u7a0b\u5b58\u5728\u201c\u624b\u5fd9\u811a\u4e71\u201d\u7684\u9002\u5e94\u671f\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n- **\u5173\u952e\u77ed\u677f**\uff1a**\u5b58\u5728\u6570\u5b57\u9e3f\u6c9f\u98ce\u9669**\u3002\u7528\u623755\u5c81\uff0c\u9996\u6b21\u63a5\u89e6\u8be5\u9886\u57df\uff0c\u660e\u786e\u8868\u793a\u201c\u5e73\u53f0\u64cd\u4f5c\u65b9\u9762\u611f\u89c9\u7740\u6bd4\u8f83\u751f\u758f\uff0c\u53ef\u80fd\u4f1a\u9700\u8981\u4e00\u4e9b\u719f\u7ec3\u7684\u8fc7\u7a0b\u201d\u3002\u8fd9\u662f\u5178\u578b\u7684**\u6570\u5b57\u76f2\u533a\u96be\u6c11\uff08T9\uff09** \u521d\u671f\u4fe1\u53f7\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u27a1\u4e2d**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a**\u3002\u7528\u6237\u6001\u5ea6\u79ef\u6781\u3001\u914d\u5408\u5ea6\u9ad8\uff0c\u80fd\u4e3b\u52a8\u5b8c\u6210\u4f5c\u4e1a\u5e76\u611f\u8c22\u8001\u5e08\u3002\u9762\u5bf9\u64cd\u4f5c\u4e0d\u719f\u548c\u611f\u5192\u7b49\u5c0f\u632b\u6298\uff0c\u672a\u8868\u73b0\u51fa\u5d29\u6e83\u6216\u653e\u5f03\uff0c\u800c\u662f\u793c\u8c8c\u6c42\u52a9\uff08\u201c\u8bf7\u6279\u8bc4\u6307\u6b63\u201d\uff09\u3002\u4f46\u8003\u8651\u5230\u5176\u5e74\u9f84\u548c\u6570\u5b57\u9e3f\u6c9f\uff0c\u5f39\u6027\u5904\u4e8e\u4e2d\u7b49\u504f\u4e0b\u6c34\u5e73\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u62b1\u6b49\u8001\u5e08\uff0c\u665a\u4e0a\u5904\u7406\u4e00\u4e9b\u4e8b\u60c5\uff0c\u6ca1\u80fd\u53ca\u65f6\u770b\u6d88\u606f\uff0c\u521a\u5b8c\u6210\u4f5c\u4e1a\uff0c\u8bf7\u6279\u8bc4\u6307\u6b63\uff0c\u8001\u5e08\u8f9b\u82e6\u5566\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42** \u4e0e **\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42** \u7684\u6df7\u5408\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u4e92\u8054\u7f51\u65b0\u4e8b\u7269\u7684\u64cd\u4f5c\u6050\u614c\u4e0e\u4e0d\u5b89\u5168\u611f**\uff08\u201c\u5e73\u53f0\u64cd\u4f5c\u65b9\u9762\u611f\u89c9\u7740\u6bd4\u8f83\u751f\u758f\u201d\uff09\uff0c\u4ee5\u53ca\u6f5c\u5728\u7684**\u5bf9\u9000\u4f11/\u65e0\u4e1a\u540e\u751f\u6d3b\u4ef7\u503c\u611f\u7f3a\u5931\u7684\u7126\u8651**\uff08\u201c\u4e30\u5bcc\u4e1a\u4f59\u751f\u6d3b\uff0c\u6280\u80fd\u53d8\u73b0\u201d\uff09\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u6400\u6276\u8fc7\u9a6c\u8def\u201d\u5f0f\u7684\u5b89\u5168\u611f\u4e0e\u5f52\u5c5e\u611f**\u3002\u9700\u8981\u63d0\u4f9b\u6781\u5ea6\u8010\u5fc3\u3001\u4e0d\u538c\u5176\u70e6\u7684\u201c\u7269\u7406\u7ea7\u201d\u64cd\u4f5c\u6307\u5bfc\uff0c\u5e76\u8ba9\u5979\u5728\u793e\u7fa4\u4e2d\u627e\u5230\u201c\u88ab\u9700\u8981\u201d\u548c\u201c\u8ddf\u4e0a\u65f6\u4ee3\u201d\u7684\u4ef7\u503c\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b**\uff08\u98ce\u9669\u7ba1\u63a7\u578b\uff09 |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T9 \u6570\u5b57\u76f2\u533a\u96be\u6c11**\uff08\u6781\u91cd\u62a4\u822a\u578b\uff09 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u501f\u8d37\u3001\u7edd\u5883\u7b49\u6781\u7aef\u4fe1\u53f7\u3002**\u4f46\u9700\u9ad8\u5ea6\u8b66\u60d5**\uff0c\u56e0\u5176\u5e74\u9f84\u3001\u6570\u5b57\u9e3f\u6c9f\u53ca\u65e0\u4e1a\u72b6\u6001\uff0c\u662f\u6f5c\u5728\u9ad8\u98ce\u9669\u7528\u6237\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4e2d | \u82e5\u4e3a\u7792\u7740\u5bb6\u4eba\u62a5\u540d\uff0c\u540e\u7eed\u5b66\u4e60\u6295\u5165\u65f6\u95f4\u53ef\u80fd\u5f15\u53d1\u77db\u76fe\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | **\u6700\u6838\u5fc3\u98ce\u9669\uff01** \u4e00\u65e6\u8fdb\u5165\u6b63\u8bfe\uff0c\u9762\u5bf9\u66f4\u590d\u6742\u7684\u8f6f\u4ef6\u64cd\u4f5c\uff08AU/PR\uff09\u3001\u4f5c\u4e1a\u63d0\u4ea4\u6d41\u7a0b\uff0c\u6781\u6613\u56e0\u201c\u5b66\u4e0d\u4f1a\u201d\u3001\u201c\u627e\u4e0d\u5230\u201d\u800c\u81ea\u8d23\u3001\u5d29\u6e83\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u4e2d\u9ad8** | \u5e76\u975e\u60c5\u7eea\u5316\u5de8\u5a74\uff0c\u800c\u662f\u56e0**\u6570\u5b57\u64cd\u4f5c\u5931\u8d25**\u5bfc\u81f4\u7684\u81ea\u5c0a\u5fc3\u53d7\u632b\uff08\u201c\u6211\u592a\u7b28\u4e86\uff0c\u5b66\u4e0d\u4f1a\u8fd9\u4e9b\u201d\uff09\u3002\u4e00\u6b21\u590d\u6742\u7684\u8f6f\u4ef6\u5b89\u88c5\u5931\u8d25\u5c31\u53ef\u80fd\u89e6\u53d1\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u82e5\u77ed\u671f\u5185\uff08\u59821-2\u4e2a\u6708\uff09\u672a\u63a5\u5230\u8bd5\u97f3\u6216\u53d8\u73b0\uff0c\u53ef\u80fd\u56e0\u201c\u6280\u80fd\u53d8\u73b0\u201d\u76ee\u6807\u672a\u8fbe\u800c\u5931\u671b\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c1-2\u5468**\uff0c\u9996\u6b21\u63a5\u89e6\u590d\u6742\u8f6f\u4ef6\u64cd\u4f5c\u6216\u72ec\u7acb\u5b8c\u6210\u9ad8\u96be\u5ea6\u4f5c\u4e1a\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u963f\u59e8/\u59d0\u59d0\u60a8\u597d\uff0c\u770b\u5230\u60a8\u8fd9\u4e48\u8ba4\u771f\u5b8c\u6210\u4f5c\u4e1a\u7279\u522b\u611f\u52a8\uff01\u54b1\u4eec\u8fd9\u4e2a\u5b66\u4e60\u554a\uff0c\u5c31\u50cf\u5b66\u7528\u667a\u80fd\u624b\u673a\u4e00\u6837\uff0c\u4e00\u5f00\u59cb\u6709\u70b9\u8499\u592a\u6b63\u5e38\u4e86\u3002\u60a8\u5343\u4e07\u522b\u7740\u6025\uff0c\u6709\u4efb\u4f55\u4e0d\u4f1a\u64cd\u4f5c\u7684\uff0c\u968f\u65f6\u558a\u6211\uff0c\u6211\u4e00\u6b65\u6b65\u622a\u56fe\u6216\u8005\u8fdc\u7a0b\u5e2e\u60a8\u5f04\u597d\u3002\u54b1\u4eec\u6162\u6162\u6765\uff0c\u4eab\u53d7\u8fd9\u4e2a\u8fc7\u7a0b\u6700\u91cd\u8981\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u9002\u8001\u9632\u8131\u8282\u4f34\u98de\u8425\u3011**\uff08\u4ea7\u54c1\u7ebfC\uff09\u3002\u6838\u5fc3\u662f\u63d0\u4f9b\u5168\u966a\u4f34\u3001\u4fdd\u59c6\u7ea7\u3001\u624b\u673a\u4f18\u5148\u7684\u6559\u5b66\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u6ee1\u914d **\u3010\u6838\u5f39\u7ea7\u7279\u79cdA(\u8fdc\u7a0b\u7269\u7406\u4ee3\u529e)\u3011** + **\u3010\u6ee1\u914d\u7279\u79cdC(\u51cc\u6668\u60c5\u7eea\u6258\u5e95)\u3011**\u3002\u653e\u5f03\u6559\u539f\u7406\uff0c\u76f4\u63a5\u4f7f\u7528\u201c\u4e00\u952e\u4ee3\u64cd\u4f5c\u201d\u6a21\u5f0f\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u8981**\u7ed9\u5979\u53d1\u56fe\u6587\u64cd\u4f5c\u624b\u518c\u6216PDF\u94fe\u63a5\u8ba9\u5979\u81ea\u5df1\u7814\u7a76\u3002\n    2. **\u7edd\u4e0d\u8981**\u7528\u201c\u91cd\u542f\u8bd5\u8bd5\u201d\u3001\u201c\u4f60\u81ea\u5df1\u518d\u627e\u627e\u201d\u7b49\u51b0\u51b7\u8bdd\u672f\u56de\u590d\u5979\u7684\u64cd\u4f5c\u95ee\u9898\u3002\n    3. **\u7edd\u4e0d\u8981**\u5728\u521d\u671f\u5c31\u5f3a\u8c03\u9ad8\u96be\u5ea6\u6280\u672f\u548c\u590d\u6742\u8f6f\u4ef6\uff0c\u4f18\u5148\u4f7f\u7528\u624b\u673aAPP\u6559\u5b66\u3002\n    4. **\u7edd\u4e0d\u8981**\u7528\u201c\u6700\u540eX\u4e2a\u540d\u989d\u201d\u7b49\u9ad8\u538b\u8bdd\u672f\u903c\u5355\uff0c\u4f1a\u52a0\u5267\u4e0d\u5b89\u5168\u611f\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u57fa\u7840\u64cd\u4f5c\u672a\u719f\u7ec3\u524d\u8fdb\u884c\u4efb\u4f55\u5347\u5355**\u3002\u5f85\u5176\u8de8\u8d8a\u6570\u5b57\u9e3f\u6c9f\u3001\u5efa\u7acb\u5145\u5206\u4fe1\u4efb\u540e\uff0c\u53ef\u8003\u8651\u8f7b\u91cf\u7ea7\u590d\u8d2d\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6765\u8fd9\u91cc\u7684\u76ee\u7684\u662f\u4ec0\u4e48\u5462\uff1f\u5e0c\u671b\u4e30\u5bcc\u4e1a\u4f59\u751f\u6d3b\uff0c\u63d0\u5347\u58f0\u97f3\u54c1\u8d28\uff0c\u53ef\u4ee5\u6280\u80fd\u53d8\u73b0\u201d \u2014 **\u6df7\u5408\u52a8\u673a\uff08\u5174\u8da3+\u53d8\u73b0\uff09\uff0c\u975e\u7eaf\u641e\u94b1\u3002**\n2. > \u201c\u5e73\u53f0\u64cd\u4f5c\u65b9\u9762\u611f\u89c9\u7740\u6bd4\u8f83\u751f\u758f\uff0c\u53ef\u80fd\u4f1a\u9700\u8981\u4e00\u4e9b\u719f\u7ec3\u7684\u8fc7\u7a0b\u201d \u2014 **\u5178\u578b\u6570\u5b57\u9e3f\u6c9f\u4fe1\u53f7\uff0c\u662fT9\u7684\u6838\u5fc3\u7279\u5f81\u3002**\n3. > \u201c\u62b1\u6b49\u8001\u5e08\uff0c\u665a\u4e0a\u5904\u7406\u4e00\u4e9b\u4e8b\u60c5\uff0c\u6ca1\u80fd\u53ca\u65f6\u770b\u6d88\u606f\uff0c\u521a\u5b8c\u6210\u4f5c\u4e1a\uff0c\u8bf7\u6279\u8bc4\u6307\u6b63\uff0c\u8001\u5e08\u8f9b\u82e6\u5566\u201d \u2014 **\u914d\u5408\u5ea6\u9ad8\uff0c\u6709\u793c\u8c8c\uff0c\u4f46\u900f\u9732\u51fa\u65f6\u95f4\u88ab\u5bb6\u5ead\u4e8b\u52a1\u5206\u5272\uff0c\u4e14\u5bf9\u201c\u6b63\u786e\u6027\u201d\u6709\u4f9d\u8d56\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T9 \u6570\u5b57\u76f2\u533a\u96be\u6c11\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\u4e0e\u5f52\u5c5e\u611f\u3011**\uff0c\u5bb3\u6015\u88ab\u65f6\u4ee3\u629b\u5f03\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u542f\u52a8\u201c\u9738\u603b\u5f0f\u4e00\u952e\u5305\u529e\u4ee3\u7406\u201d\u670d\u52a1\uff0c\u7528\u7269\u7406\u4ee3\u529e\u548c\u6781\u81f4\u8010\u5fc3\u8de8\u8d8a\u6570\u5b57\u9e3f\u6c9f\u3011**\u3002\n\n```json\n{\"core_type\": \"T9 \u6570\u5b57\u76f2\u533a\u96be\u6c11\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168/\u793e\u4ea4\u9700\u6c42\", \"target_product_line\": \"\u9002\u8001\u9632\u8131\u8282\u4f34\u98de\u8425\uff08\u4ea7\u54c1\u7ebfC\uff09\"}\n```";
