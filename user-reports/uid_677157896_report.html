    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | 677157896 (\u674e\u7ef4) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e-\u66b4\u66b4\uff08\u987e\u79cb\u83b9\uff09\uff1b\u73ed\u4e3b\u4efb-\u9065\u8fdc\uff08\u5f20\u6587\u9759\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u9ad8\u9636\u8bfe\u7a0b\uff08\u63a8\u6d4b\u4e3a\u201c4+1\u4e2a\u6708\u201d\u5957\u9910\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **[\u4fe1\u606f\u7f3a\u5931]** \u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u8d44\u91d1\u6765\u6e90\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **[\u4fe1\u606f\u7f3a\u5931]** \u672a\u660e\u786e\u63d0\u53ca\u4e2a\u4eba\u5de5\u4f5c\u3001\u5bb6\u5ead\u65f6\u95f4\u5b89\u6392\u3002\u4ec5\u6709\u4e00\u6b21\u201c\u660e\u5929\u4e2d\u5348\u6211\u542c\u4e0d\u4e86\uff0c\u8981\u8bf7\u4e2a\u5047\u201d\u7684\u8bf7\u5047\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **[\u4fe1\u606f\u7f3a\u5931]** \u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u80cc\u666f\u3001\u914d\u5076\u3001\u5b50\u5973\u6216\u5bb6\u4eba\u6001\u5ea6\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** - \u804a\u5929\u8bb0\u5f55\u4ee5\u9500\u552e\u5355\u5411\u8f93\u51fa\u4e3a\u4e3b\uff0c\u7528\u6237\u6781\u5c11\u4e3b\u52a8\u66b4\u9732\u4e2a\u4eba\u4fe1\u606f\u3001\u52a8\u673a\u3001\u8d44\u6e90\u72b6\u51b5\u3002\u5173\u952e\u4e09\u8f74\u4fe1\u53f7\uff08\u7279\u522b\u662f\u8d44\u6e90\u5e95\u5ea7\u548c\u5fc3\u7406\u5f39\u6027\uff09\u8bc1\u636e\u4e25\u91cd\u4e0d\u8db3\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **[\u27a1\u4e2d]**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u526f\u4e1a\u53d8\u73b0\u8def\u5f84\u7684\u5174\u8da3\uff0c\u5e76\u5b8c\u6210\u4e86\u62a5\u540d\u52a8\u4f5c\uff0c\u4f46\u7f3a\u4e4f\u5bf9\u201c\u5feb\u901f\u8d5a\u94b1\u201d\u7684\u5f3a\u70c8\u8ffd\u95ee\u6216\u7126\u8651\u8868\u8fbe\uff0c\u66f4\u50cf\u662f\u5728\u63a2\u7d22\u4e00\u4e2a\u53ef\u884c\u7684\u65b0\u9009\u9879\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u62a5\u540d\u7684\u540c\u65f6\u5c31\u53ef\u4ee5\u63a5\u5355\u4e86\u5417\u201d > \u201c\u662f\u4e0d\u662f\u4e0d\u62a5\u540d\u5c31\u4e0d\u80fd\u505a\u4e86\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **[\u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u8bc4\u27a1\u4e2d]**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u4fe1\u606f\u7f3a\u5931]** \u2014 \u672a\u63d0\u53ca\u6536\u5165\u3001\u50a8\u84c4\u3001\u652f\u4ed8\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**[\u4fe1\u606f\u7f3a\u5931]** \u2014 \u4ec5\u6709\u4e00\u6b21\u8bf7\u5047\uff0c\u65e0\u6cd5\u5224\u65ad\u5176\u65e5\u5e38\u65f6\u95f4\u5145\u88d5\u5ea6\u4e0e\u89c4\u5f8b\u6027\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u4fe1\u606f\u7f3a\u5931]** \u2014 \u5b8c\u5168\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **[\u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u8bc4\u27a1\u4e2d]**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u4ece\u6709\u9650\u4e92\u52a8\u770b\uff0c\u7528\u6237\u60c5\u7eea\u5e73\u7a33\uff0c\u80fd\u63a5\u53d7\u6307\u5bfc\u5e76\u8868\u8fbe\u611f\u8c22\uff0c\u672a\u8868\u73b0\u51fa\u6781\u7aef\u60c5\u7eea\u3002\u4f46\u7f3a\u4e4f\u9762\u5bf9\u56f0\u96be\u6216\u8d1f\u9762\u53cd\u9988\u65f6\u7684\u8868\u73b0\u8bc1\u636e\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6536\u5230\uff0c\u8c22\u8c22[\u73ab\u7470]\u201d > \u201c\u4e0d\u6025\u4e0d\u6025\uff0c\u6211\u518d\u7ec3\u4e00\u6bb5\u65f6\u95f4\u518d\u6b63\u5f0f\u5f55\u5427\u201d > \u201c\u54c8\u54c8\uff0c\u591a\u8c22\u5e08\u59d0\u63d0\u9192[\u62b1\u62f3]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u526f\u4e1a\u8def\u5f84\u7684**\u4e0d\u786e\u5b9a\u6027\u548c\u5b89\u5168\u6027**\u5b58\u5728\u7591\u8651\uff08\u201c\u662f\u4e0d\u662f\u4e0d\u62a5\u540d\u5c31\u4e0d\u80fd\u505a\u4e86\u201d\uff09\uff0c\u9700\u8981\u660e\u786e\u7684\u89c4\u5219\u548c\u4fdd\u969c\u6765\u6d88\u9664\u8e0f\u5165\u65b0\u9886\u57df\u7684\u7126\u8651\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u7684\u8def\u5f84\u6307\u5f15\u4e0e\u5b89\u5168\u611f**\u3002\u63d0\u4f9b\u6e05\u6670\u7684\u6b65\u9aa4\uff08\u5982\u5e08\u59d0\u7ed9\u51fa\u76845\u70b9\u65b9\u5411\uff09\u3001\u660e\u786e\u7684\u8d44\u6e90\u652f\u6301\uff08\u5982\u7248\u6743\u4e66\uff09\u548c\u201c\u90aa\u4fee\u201d\u7701\u4e8b\u6280\u5de7\uff0c\u80fd\u6781\u5927\u7f13\u89e3\u5176\u63a2\u7d22\u65b0\u9886\u57df\u7684\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **[\ud83d\udfeaC1]** \u7c7b - \u4fe1\u606f\u4e25\u91cd\u4e0d\u8db3\uff0c\u4f46\u57fa\u4e8e\u5176\u5e73\u7a33\u4e92\u52a8\u548c\u63a2\u7d22\u6027\u52a8\u673a\uff0c\u6682\u5f52\u4e3aC1\uff08\u89c2\u671b\u5c1d\u8bd5\u578b\uff09\u3002**\u9700\u7d27\u6025\u8865\u5168\u5bb6\u5ead\u3001\u652f\u4ed8\u3001\u65f6\u95f4\u4fe1\u606f\uff0c\u4ee5\u9632\u964d\u7ea7\u4e3aD\u3002** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **[T5 \u597d\u73a9\u5c1d\u9c9c]** - \u7528\u6237\u8868\u73b0\u51fa\u5bf9\u591a\u79cd\u5c97\u4f4d\uff08\u753b\u672c\u3001CV\u7b49\uff09\u7684\u5174\u8da3\uff08\u201c\u5927\u6982\u4e86\u89e3\u4e86\uff0c\u4e5f\u90fd\u5f88\u6709\u5174\u8da3\u201d\uff09\uff0c\u884c\u52a8\u4e0a\u8ddf\u8fdb\u8bfe\u7a0b\u548c\u4f5c\u4e1a\uff0c\u4f46\u7f3a\u4e4f\u7834\u91dc\u6c89\u821f\u7684\u641e\u94b1\u7d27\u8feb\u611f\uff0c\u66f4\u504f\u5411\u4e8e\u63a2\u7d22\u548c\u5c1d\u8bd5\u4e00\u4e2a\u6709\u8da3\u7684\u65b0\u6280\u80fd\u3002 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u8bc1\u636e\u8868\u660e\u5b58\u5728\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5ead\u51b2\u7a81\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **[\u4e2d]** | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u82e5\u5b58\u5728\u9690\u7792\u5bb6\u4eba\u7684\u60c5\u51b5\uff0c\u98ce\u9669\u4e2d\u7b49\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **[\u4e2d]** | \u82e5\u5176\u771f\u5b9e\u53ef\u7528\u65f6\u95f4\u4e0e\u8bfe\u7a0b\u76f4\u64ad\u3001\u4f5c\u4e1a\u8981\u6c42\u51b2\u7a81\uff0c\u53ef\u80fd\u56e0\u79ef\u538b\u4ea7\u751f\u81ea\u8d23\u5e76\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **[\u4f4e]** | \u76ee\u524d\u4e92\u52a8\u5e73\u7a33\uff0c\u672a\u8868\u73b0\u51fa\u4f4e\u81ea\u5c0a\u6216\u6613\u6012\u503e\u5411\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **[\u9ad8]** | **\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u7528\u6237\u5bf9\u201c\u62a5\u540d\u5373\u53ef\u63a5\u5355\u201d\u6709\u8bef\u89e3\uff0c\u82e5\u5f00\u8bfe\u540e\u53d1\u73b0\u4ecd\u9700\u957f\u65f6\u95f4\u5b66\u4e60\u6253\u78e8\u624d\u80fd\u63a5\u5355\uff0c\u6216\u521d\u671f\u63a5\u5355\u6536\u5165\u6781\u4f4e\uff0c\u6613\u4ea7\u751f\u201c\u88ab\u9a97\u201d\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c8\u5929\u201c\u5f00\u901a\u63a5\u5355\u6743\u9650\u201d\u524d\u540e**\u3002\u5f53\u7528\u6237\u53d1\u73b0\u63a5\u5355\u95e8\u69db\u3001\u7ade\u4e89\u6fc0\u70c8\u6216\u65f6\u85aa\u8fdc\u4f4e\u4e8e\u9884\u671f\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u674e\u7ef4\u540c\u5b66\u4f60\u597d\uff0c\u770b\u5230\u4f60\u9009\u4e86\u60ac\u7591\u7c7b\u7684\u7248\u6743\u4e66\uff0c\u773c\u5149\u5f88\u51c6\uff0c\u8fd9\u4e2a\u54c1\u7c7b\u7537\u64ad\u673a\u4f1a\u5f88\u591a\u3002\u54b1\u4eec\u4e0d\u7740\u6025\u9a6c\u4e0a\u5f55\uff0c\u524d\u671f\u6700\u91cd\u8981\u7684\u662f\u628a\u57fa\u7840\u6253\u7262\uff0c\u6211\u4f1a\u5e26\u4f60\u4e00\u6b65\u6b65\u719f\u6089\u4ece\u6587\u672c\u5904\u7406\u5230\u4e0a\u4f20\u53d1\u5e03\u7684\u5b8c\u6574\u6d41\u7a0b\u3002\u6709\u4efb\u4f55\u5173\u4e8e\u65f6\u95f4\u5b89\u6392\u6216\u8005\u5b9e\u64cd\u4e0a\u7684\u5361\u70b9\uff0c\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u7528\u6700\u7701\u4e8b\u513f\u7684\u2018\u90aa\u4fee\u2019\u529e\u6cd5\u641e\u5b9a\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5174\u8da3\u6e38\u4e50\u7ebf**\u3011- \u91cd\u70b9\u5f15\u5bfc\u5176\u4f53\u9a8c\u4e0d\u540c\u9898\u6750\uff08\u6050\u6016\u3001\u60ac\u7591\u3001\u7a7f\u8d8a\u7b49\uff09\u7684\u5f55\u5236\u4e50\u8da3\uff0c\u5efa\u7acb\u6210\u5c31\u611f\uff0c\u800c\u975e\u8fc7\u65e9\u65bd\u52a0\u53d8\u73b0\u538b\u529b\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u8def\u5f84\u53ef\u89c6\u5316\u5305**\u3011- \u4e3a\u5176\u7ed8\u5236\u6e05\u6670\u7684\u201c\u5b66\u4e60-\u7ec3\u4e60-\u8bd5\u97f3-\u63a5\u5355\u201d\u91cc\u7a0b\u7891\u5730\u56fe\uff0c\u6bcf\u5468\u540c\u6b65\u8fdb\u5ea6\uff0c\u6d88\u9664\u4e0d\u786e\u5b9a\u6027\u7126\u8651\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5728\u524d\u671f\u8fc7\u5ea6\u9f13\u5439\u9ad8\u6536\u5165\uff0c\u6216\u5c06\u5176\u4e0e\u201c\u5b9d\u5988/\u6ef4\u6ef4\u53f8\u673a\u201d\u7b49\u6781\u7aef\u6848\u4f8b\u5f3a\u884c\u5bf9\u6807\u3002\u907f\u514d\u7ed9\u5176\u5236\u9020\u4e0d\u5207\u5b9e\u9645\u7684\u9884\u671f\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u5b8c\u5168\u6478\u6e05\u5176\u8d44\u6e90\u5e95\u5ea7\uff08\u65f6\u95f4\u3001\u8d44\u91d1\u3001\u5bb6\u5ead\uff09\u5e76\u5efa\u7acb\u5f3a\u4fe1\u4efb\u524d\uff0c\u7981\u6b62\u4efb\u4f55\u540e\u7eed\u8bfe\u7a0b\u6216\u670d\u52a1\u63a8\u9500\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u62a5\u540d\u7684\u540c\u65f6\u5c31\u53ef\u4ee5\u63a5\u5355\u4e86\u5417\u201d\n2. > \u201c\u662f\u4e0d\u662f\u4e0d\u62a5\u540d\u5c31\u4e0d\u80fd\u505a\u4e86\u201d\n3. > \u201c\u4e0d\u6025\u4e0d\u6025\uff0c\u6211\u518d\u7ec3\u4e00\u6bb5\u65f6\u95f4\u518d\u6b63\u5f0f\u5f55\u5427\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **[T5\u597d\u73a9\u5c1d\u9c9c\u578b]**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **[\u6d88\u9664\u65b0\u9886\u57df\u7684\u4e0d\u786e\u5b9a\u6027\uff0c\u83b7\u5f97\u5b89\u5168\u4fdd\u969c]**\u3002\u9000\u5355\u51e0\u7387\u4e3a **[\u4e2d]**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **[\u5728\u5f00\u8bfe\u521d\u671f\uff0c\u7528\u6781\u5176\u6e05\u6670\u3001\u53ef\u89c6\u5316\u7684\u8def\u5f84\u56fe\u7ba1\u7406\u5176\u9884\u671f\uff0c\u91cd\u70b9\u9632\u8303\u201c\u6536\u76ca\u843d\u5dee\u201d\u578b\u5931\u671b]**\u3002\n\n```json\n{\"core_type\": \"T5 \u597d\u73a9\u5c1d\u9c9c\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf\"}\n```";
