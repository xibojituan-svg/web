    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n- **\u52a8\u673a\u7eaf\u5ea6**\uff1a\u4e2d\u7b49\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u64ad\u97f3/\u914d\u97f3\u5b66\u4e60\u7684\u5174\u8da3\u548c\u53c2\u4e0e\u5ea6\uff08\u8ba8\u8bba\u5267\u672c\u3001\u6a21\u4eff\u89d2\u8272\u3001\u5173\u6ce8\u6280\u5de7\uff09\uff0c\u4f46**\u52a8\u673a\u53ef\u80fd\u90e8\u5206\u6e90\u4e8e\u793e\u7fa4\u5f52\u5c5e\u611f\u548c\u4ece\u4f17**\uff08\u201c\u5bb6\u4eba\u4eec\u201d\u3001\u201c\u4e00\u8d77\u52a0\u6cb9\u201d\u3001\u79ef\u6781\u4e92\u52a8\uff09\uff0c\u800c\u975e\u7eaf\u7cb9\u7684\u5185\u9a71\u6216\u804c\u4e1a\u89c4\u5212\u3002\n- **\u8d44\u6e90\u5e95\u5ea7**\uff1a\u4fe1\u606f\u4e0d\u8db3\u3002\u672a\u63d0\u53ca\u7ecf\u6d4e\u72b6\u51b5\u3001\u8bbe\u5907\u6295\u5165\u3001\u65f6\u95f4\u6295\u5165\u7b49\u5173\u952e\u8d44\u6e90\u4fe1\u606f\u3002**\u5b58\u5728\u5bb6\u5ead\u89d2\u8272\uff08\u4e3a\u59d0\u59d0\u8d2d\u8bfe\uff09**\uff0c\u4f46\u51b3\u7b56\u81ea\u4e3b\u6027\u4e0d\u660e\u3002\n- **\u5fc3\u7406\u5f39\u6027**\uff1a\u8f83\u9ad8\u3002\u7528\u6237\u79ef\u6781\u53c2\u4e0e\u793e\u7fa4\u4e92\u52a8\u3001\u4e3b\u52a8\u63d0\u4ea4\u4f5c\u4e1a\u3001\u5c1d\u8bd5\u89d2\u8272\u6a21\u4eff\u3001\u9762\u5bf9\u6280\u672f\u95ee\u9898\uff08\u7f51\u6162\u3001\u4fe1\u606f\u6e05\u7a7a\uff09\u65f6\u6001\u5ea6\u79ef\u6781\uff0c\u8868\u73b0\u51fa\u8f83\u597d\u7684\u9002\u5e94\u6027\u548c\u575a\u6301\u5ea6\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n- **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u5df2\u652f\u4ed8\uff08\u7528\u6237\u63d0\u53ca\u201c\u8fd9\u4e2a\u8bfe\u7a0b\u662f\u7ed9\u6211\u59d0\u4e70\u7684\u201d\uff09\u3002\n- **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a**\u5173\u952e\u4fe1\u606f\u7f3a\u5931**\u3002\u7528\u6237\u4e3a\u59d0\u59d0\u8d2d\u8bfe\uff0c\u4f46\u672a\u660e\u786e\u5176\u59d0\u662f\u5426\u4e3a\u5b9e\u9645\u4f7f\u7528\u8005\u3001\u662f\u5426\u77e5\u60c5\u540c\u610f\u3001\u4ee5\u53ca\u7528\u6237\u672c\u4eba\u662f\u5426\u4e3a\u51b3\u7b56\u8005\u6216\u4ec5\u4ee3\u4ed8\u3002**\u5b58\u5728\u5bb6\u5ead\u51b3\u7b56\u6743\u6a21\u7cca\u98ce\u9669**\u3002\n- **\u6b65\u9aa42-4\uff08ABCD\u5224\u5b9a\uff09**\uff1a\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u51c6\u786e\u5f52\u7c7b\u81f3A/B/C/D\u7c7b\u3002\u7528\u6237\u6709\u5b66\u4e60\u884c\u4e3a\uff08B\u7c7b\u7279\u5f81\uff09\uff0c\u4f46\u8d2d\u8bfe\u52a8\u673a\u548c\u6700\u7ec8\u4f7f\u7528\u8005\u4e0d\u660e\uff08\u53ef\u80fd\u6d89\u53caC\u7c7b\u4ee3\u4ed8\u6216D\u7c7b\u793c\u54c1\u5361\u573a\u666f\uff09\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n- **\u5339\u914d\u539f\u578b**\uff1a**T3 \u793e\u7fa4\u4f9d\u8d56\u578b\u5b66\u4e60\u8005**\u3002\u6838\u5fc3\u7279\u5f81\uff1a\u9ad8\u5ea6\u4f9d\u8d56\u793e\u7fa4\u4e92\u52a8\u83b7\u5f97\u5b66\u4e60\u52a8\u529b\u4e0e\u8ba4\u540c\uff1b\u5b66\u4e60\u8fc7\u7a0b\u793e\u4ea4\u5316\uff1b\u6613\u53d7\u540c\u4f34\u5f71\u54cd\uff08\u201c\u597d\u672c\u5b50\u65e9\u4e0b\u624b\u201d\u3001\u201c\u4e09\u4e2a\u4eba\u559c\u6b22\u7b2c\u4e00\u4e2a\u4e86\u201d\uff09\uff1b\u5b8c\u6210\u4f5c\u4e1a\u548c\u53c2\u4e0e\u6d3b\u52a8\u79ef\u6781\uff0c\u4f46\u6df1\u5c42\u804c\u4e1a\u76ee\u6807\u6a21\u7cca\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n- **\u603b\u4f53\u98ce\u9669**\uff1a**\u4e2d**\u3002\n- **\u9010\u9879\u6392\u67e5**\uff1a\n    1. \u6548\u679c\u672a\u8fbe\u9884\u671f\uff1a\u4e2d\u3002\u7528\u6237\u6709\u7ec3\u4e60\u548c\u63d0\u4ea4\uff0c\u4f46\u82e5\u5176\u59d0\u4e3a\u5b9e\u9645\u4f7f\u7528\u8005\u4e14\u65e0\u540c\u7b49\u6295\u5165\uff0c\u98ce\u9669\u5347\u9ad8\u3002\n    2. \u7ecf\u6d4e\u538b\u529b\uff1a\u672a\u77e5\u3002\n    3. \u65f6\u95f4\u51b2\u7a81\uff1a\u4f4e\u3002\u7528\u6237\u80fd\u6301\u7eed\u53c2\u4e0e\u3002\n    4. \u5bb6\u5ead\u53cd\u5bf9\uff1a**\u4e2d\u9ad8\u3002\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u8bfe\u7a0b\u5b9e\u9645\u4f7f\u7528\u8005\uff08\u59d0\u59d0\uff09\u7684\u610f\u613f\u3001\u77e5\u60c5\u5ea6\u548c\u914d\u5408\u5ea6\u5b8c\u5168\u672a\u77e5\u3002\n    5. \u4ea7\u54c1\u4e0d\u7b26\uff1a\u4f4e\u3002\u7528\u6237\u884c\u4e3a\u4e0e\u64ad\u97f3\u8bfe\u7a0b\u5339\u914d\u3002\n    6. \u9500\u552e\u8bef\u5bfc\uff1a\u4f4e\u3002\u8bb0\u5f55\u4e2d\u672a\u89c1\u8fc7\u5ea6\u627f\u8bfa\u3002\n    7. \u7ade\u54c1\u6bd4\u8f83/\u51b2\u52a8\u6d88\u8d39\uff1a\u4f4e\u3002\u7528\u6237\u53c2\u4e0e\u5468\u671f\u8f83\u957f\uff0c\u975e\u5373\u65f6\u51b2\u52a8\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n- **\u4e3b\u8981\u98ce\u9669**\uff1a**\u5b58\u5728\u201c\u4ee3\u4ed8\u4ee3\u5b66\u201d\u5acc\u7591**\u3002\u9500\u552e\u5728\u7528\u6237\u63d0\u51fa\u8f6c\u8bfe\u7a0b\u7ed9\u59d0\u59d0\u65f6\uff0c\u4ec5\u64cd\u4f5c\u6d41\u7a0b\uff0c**\u672a\u8ffd\u95ee\u6216\u786e\u8ba4\u5173\u952e\u4fe1\u606f**\uff1a\u2460\u59d0\u59d0\u662f\u5426\u77e5\u60c5\u5e76\u540c\u610f\u5b66\u4e60\uff1f\u2461\u59d0\u59d0\u7684\u5b66\u4e60\u76ee\u6807\u4e0e\u8bfe\u7a0b\u5339\u914d\u5ea6\uff1f\u2462\u7528\u6237\u672c\u4eba\u662f\u5426\u4ee3\u66ff\u59d0\u59d0\u505a\u51fa\u5b66\u4e60\u627f\u8bfa\uff1f**\u6b64\u73af\u8282\u5b58\u5728\u5408\u89c4\u758f\u6f0f**\u3002\n- \u5176\u4ed6\u65b9\u9762\u672a\u89c1\u660e\u663e\u8fdd\u89c4\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n- **\u4ea7\u54c1\u5339\u914d**\uff1a**\u504f\u5dee**\u3002\u8bfe\u7a0b\u5185\u5bb9\u4e0e\u7528\u6237\uff08\u6216\u5b9e\u9645\u4f7f\u7528\u8005\u59d0\u59d0\uff09\u7684\u771f\u5b9e\u9700\u6c42\u5339\u914d\u5ea6\u5b58\u7591\u3002\n- **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**\u7acb\u5373\u6838\u5b9e\u5b9e\u9645\u4f7f\u7528\u8005\u610f\u613f\u4e0e\u76ee\u6807**\n\n{\"core_type\": \"T3 \u793e\u7fa4\u4f9d\u8d56\u578b\u5b66\u4e60\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u7acb\u5373\u6838\u5b9e\u5b9e\u9645\u4f7f\u7528\u8005\u610f\u613f\u4e0e\u76ee\u6807\"}";
