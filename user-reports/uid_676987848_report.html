    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a676987848\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a676987848 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-05 \u81f3 2026-03-08 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9752\u9e1f\u6d1b\u4e00(\u9e7f\u73cd\u73cd)\u3001\u5e7b\u591c\u4e4b\u6b4c-\u62db\u52df\u5b98-\u7c7d\u83f2\u56e2\u961f(\u5f90\u8389\u6021) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66/\u914d\u97f3\u8bfe\u7a0b |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3** |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u767d\u5929\u4e0a\u73ed\uff0c\u665a\u4e0a8\u70b9\u540e\u624d\u6709\u65f6\u95f4\uff0c\u9700\u52a0\u73ed\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3** |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u5b66\u4e60\u884c\u4e3a\u3001\u60c5\u7eea\u3001\u6280\u672f\u56f0\u60d1\u3001\u793e\u4ea4\u4e92\u52a8\u5747\u6709\u4f53\u73b0\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u5bf9\u53d8\u73b0\uff08\u7248\u6743\u4e66\u6536\u76ca\uff09\u6709\u660e\u786e\u5174\u8da3\uff0c\u4f46\u540c\u65f6\u4e5f\u8868\u73b0\u51fa\u5bf9\u6280\u672f\u672c\u8eab\uff08\u53d1\u58f0\u6280\u5de7\u3001\u58f0\u7ebf\u53d8\u5316\uff09\u7684\u94bb\u7814\u70ed\u60c5\u548c\u4eab\u53d7\u5b66\u4e60\u5e26\u6765\u7684\u81ea\u6211\u63d0\u5347\u611f\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5728\u5404\u4e2a\u5e73\u53f0\u4e0a\uff0c\u8fd9\u4e09\u672c\u4e66\u662f\u7ed9\u6211\u4eec\u7248\u6743\u7684\uff0c\u6211\u4eec\u53ef\u4ee5\uff0c\u6211\u4eec\u53ef\u4ee5\u5c31\u662f\u4e0a\u8fd9\u4e2a\u4e09\u672c\u4e66\uff0c\u5982\u679c\u8c01\u770b\u4e86\uff0c\u6211\u4eec\u6709\u70b9\u6536\u76ca\uff0c\u662f\u4e0d\u662f\uff1f\u201d > \u201c\u6211\u611f\u89c9\u5982\u679c\u8981\u628a\u8fd9\u4e2a\u767e\u53d8\u767e\u53d8\u90a3\u4e2a\u58f0\u7ebf\u8981\u5b66\u597d\u4e86\u7684\u8bdd\uff0c\u90a3\u975e\u5e38\u597d\uff0c\u4ee5\u540e\u5982\u679c\u6211\u4eec\u8981\u662f\u63a5\u5230\u4e00\u672c\u4e66\uff0c\u6216\u8005\u6717\u8bfb\u7684\u65f6\u5019\uff0c\uff0c\u5b83\u4e0d\u540c\u7684\u4eba\u7269\u54c8\uff0c\uff0c\u9700\u8981\u4ec0\u4e48\u4e0d\u540c\u7684\u8bed\u8c03\uff0c\u8fd9\u4e2a\u6211\u611f\u89c9\u662f\u975e\u5e38\u597d\u7684\uff0c\u5bf9\u6211\u4eec\u5c31\u662f\u5f88\u6709\u5e2e\u52a9\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u2b07\u4f4e** \u2014 \u767d\u5929\u4e0a\u73ed\uff0c\u665a\u4e0a\u53ef\u80fd\u52a0\u73ed\uff0c\u5b66\u4e60\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\uff0c\u4f9d\u8d56\u665a\u4e0a\u56de\u770b\u5f55\u64ad\u3002\u8bc1\u636e\uff1a\u201c\u6211\u4eca\u5929\u53ef\u80fd\u8981\u52a0\u73ed...\u6211\u4eca\u5929\u56de\u53bb\u597d\u50cf\u5f97\u516b\u70b9\u591a\u56de\u53bb\u6700\u665a\u201d\u3001\u201c\u6211\u53ea\u6709\u665a\u4e0a\u56de\u53bb\u7684\u65f6\u5019\u624d\u6709\u65f6\u95f4\uff0c\u8981\u767d\u5929\u4e0a\u73ed\u513f\u201d\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n- **\u7269\u7406\u4e0e\u6570\u5b57\u57fa\u5efa**\uff1a**\u2b07\u4f4e** \u2014 \u624b\u673a\u5185\u5b58\u5c0f\uff0c\u9700\u5220\u9664\u7fa4\u804a\u8bb0\u5f55\u4ee5\u8282\u7701\u7a7a\u95f4\uff1b\u5bf9\u57fa\u7840\u64cd\u4f5c\uff08\u5982\u6587\u672c\u53d8\u8272\u3001\u8fdb\u5165\u4f1a\u8bae\u94fe\u63a5\uff09\u5b58\u5728\u660e\u663e\u56f0\u60d1\u548c\u64cd\u4f5c\u969c\u788d\u3002\u8bc1\u636e\uff1a\u201c\u6211\u8fd9\u4e2a\u5185\u5b58\u5427\uff0c\u4e0d\u90a3\u4e48\u592a\u5927\u201d\u3001\u201c\u7fa4\u91cc\u90a3\u4e2a\u7559\u7684\u4f5c\u4e1a\u4ec0\u4e48\u7684\u54c8...\u6211\u5c31\u770b\u6211\u5c31\u770b\u4e0d\u5230\u90a3\u4e2a\u5c31\u662f\u53d1\u7684\u90a3\u4e2a\u56fe\u7247\uff0c\u6211\u8fd9\u4eba\u5427\u6709\u70b9\u7b28\uff0c\u7136\u540e\u6211\u5c31\u62ff\u53e6\u4e00\u4e2a\u624b\u673a\u201d\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b07\u4f4e\u6781\u5371**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56**\u3002\u9891\u7e41\u81ea\u6211\u5426\u5b9a\uff08\u201c\u6211\u6709\u70b9\u7b28\u201d\u3001\u201c\u6211\u4e0d\u662f\u4e2a\u5f88\u806a\u660e\u7684\u4eba\u201d\uff09\uff0c\u770b\u5230\u522b\u4eba\u4f1a\u800c\u81ea\u5df1\u4e0d\u4f1a\u65f6\u4ea7\u751f\u5f3a\u70c8\u7126\u8651\u548c\u632b\u8d25\u611f\uff0c\u6781\u5ea6\u4f9d\u8d56\u8001\u5e08\u7684\u5b89\u629a\u548c\u5177\u4f53\u6307\u5bfc\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u6709\u70b9\u6ca1\u770b\u660e\u767d\u8fd9\u4e2a\u3002\u201d > \u201c\u6211\u770b\u89c1\u4ed6\u4eec\u522b\u4eba\u90fd\u4f1a\u505a\uff0c\u5230\u6211\u8fd9\u6211\u6211\u5f04\u4e86\u534a\u5929\u4e5f\u5f04\u4e0d\u597d...\u597d\u51e0\u4e2a\u4eba\u90fd\u4f1a\u505a...\u7740\u6025\u4e86\u3002\u201d > \u201c\u6211\u5c31\u770b\u6211\u5c31\u770b\u4e0d\u5230\u90a3\u4e2a\u5c31\u662f\u53d1\u7684\u90a3\u4e2a\u56fe\u7247\uff0c\u6211\u8fd9\u4eba\u5427\u6709\u70b9\u7b28...\u6709\u70b9\u7b28[\u96be\u8fc7]\u201d > \u201c\u6211\u4e0d\u662f\u4e2a\u5f88\u806a\u660e\u7684\u4eba\u4f46\u6211\u4f1a\u4e00\u76f4\u52aa\u529b\u7684[\u5fae\u7b11]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u5f52\u5c5e\u4e0e\u5c0a\u91cd\u9700\u6c42** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5f3a\u70c8\u7684\u81ea\u5351\u611f\u4e0e\u5bb3\u6015\u6389\u961f\u7684\u6050\u614c**\u3002\u5979\u8eab\u5904\u4e00\u4e2a\u201c\u522b\u4eba\u90fd\u4f1a\u201d\u7684\u7fa4\u4f53\u4e2d\uff0c\u56e0\u81ea\u8eab\u201c\u7b28\u201d\u3001\u201c\u6162\u201d\u800c\u611f\u5230\u7126\u8651\uff0c\u6781\u5ea6\u6e34\u671b\u83b7\u5f97\u8ba4\u53ef\u548c\u5f52\u5c5e\u611f\uff0c\u5bb3\u6015\u88ab\u7fa4\u4f53\u629b\u4e0b\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u63d0\u4f9b\u201c\u5b89\u5168\u5bb9\u5668\u201d\u4e0e\u201c\u5fae\u5c0f\u8fdb\u6b65\u7684\u6b63\u53cd\u9988\u201d**\u3002\u521b\u9020\u4e00\u4e2a\u5141\u8bb8\u5979\u201c\u6162\u201d\u3001\u5141\u8bb8\u5979\u201c\u7b28\u201d\u7684\u65e0\u538b\u529b\u73af\u5883\uff0c\u5e76\u901a\u8fc7\u6301\u7eed\u3001\u5177\u4f53\u3001\u5938\u5f20\u7684\u9f13\u52b1\uff0c\u8ba9\u5979\u611f\u53d7\u5230\u6bcf\u4e00\u6b65\u5fae\u5c0f\u8fdb\u6b65\u90fd\u88ab\u770b\u89c1\u548c\u80af\u5b9a\uff0c\u4ece\u800c\u5efa\u7acb\u81ea\u4fe1\u548c\u5f52\u5c5e\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74** (\u4e25\u91cd\u5185\u8017\u578b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u7b49\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u65e0\u6cd5\u5224\u65ad\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | **\u65f6\u95f4\u788e\u7247\u5316+\u64cd\u4f5c\u56f0\u96be**\uff1a\u56e0\u52a0\u73ed\u6216\u64cd\u4f5c\u95ee\u9898\uff08\u5982\u8fdb\u4e0d\u53bb\u4f1a\u8bae\u3001\u627e\u4e0d\u5230\u4f5c\u4e1a\uff09\u8fde\u7eed\u9519\u8fc7\u5173\u952e\u5b66\u4e60\u8282\u70b9\uff0c\u4ea7\u751f\u201c\u6211\u8ddf\u4e0d\u4e0a\u201d\u7684\u7edd\u671b\u611f\uff0c\u8fdb\u800c\u81ea\u8d23\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | **\u6280\u672f\u632b\u8d25+\u540c\u4faa\u538b\u529b**\uff1a\u5728\u7ec3\u4e60\u4e2d\u53cd\u590d\u53d7\u632b\uff08\u5982\u201c\u7eaf\u6253\u54cd\u201d\u5b66\u4e0d\u4f1a\uff09\uff0c\u540c\u65f6\u770b\u5230\u5176\u4ed6\u540c\u5b66\u8fdb\u6b65\u66f4\u5feb\uff0c\u5f3a\u70c8\u7684\u81ea\u5351\u548c\u7126\u8651\u4f1a\u77ac\u95f4\u51fb\u57ae\u5176\u5b66\u4e60\u52a8\u529b\uff0c\u89e6\u53d1\u201c\u6211\u592a\u7b28\u4e86\uff0c\u5b66\u4e0d\u4f1a\u201d\u7684\u9000\u8d39\u5ff5\u5934\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u5982\u679c\u77ed\u671f\u5185\u672a\u611f\u53d7\u5230\u58f0\u97f3\u7684\u660e\u663e\u53d8\u5316\u6216\u63a5\u5230\u53d8\u73b0\u673a\u4f1a\uff0c\u53ef\u80fd\u4f1a\u8d28\u7591\u8bfe\u7a0b\u6548\u679c\uff0c\u4f46\u6b64\u98ce\u9669\u6b21\u4e8e\u60c5\u7eea\u5d29\u76d8\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c1-2\u5468**\u3002\u6b64\u65f6\u6280\u672f\u96be\u5ea6\u63d0\u5347\uff0c\u4f5c\u4e1a\u8981\u6c42\u589e\u52a0\uff0c\u82e5\u5979\u56e0\u64cd\u4f5c\u6216\u65f6\u95f4\u95ee\u9898\u65e0\u6cd5\u5b8c\u6210\uff0c\u6216\u5728\u7fa4\u5185\u5bf9\u6bd4\u4e2d\u611f\u5230\u5de8\u5927\u5dee\u8ddd\uff0c\u6781\u6613\u60c5\u7eea\u5d29\u6e83\u9000\u8d39\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u59d0\u59d0\uff0c\u770b\u5230\u4f60\u7279\u522b\u8ba4\u771f\uff0c\u6bcf\u5929\u4e0b\u73ed\u8fd8\u575a\u6301\u7ec3\u4e60\uff0c\u771f\u7684\u5f88\u611f\u52a8\u3002\u54b1\u4eec\u8fd9\u4e2a\u73ed\u5c31\u662f\u2018\u6162\u5c31\u662f\u5feb\u2019\uff0c\u5343\u4e07\u522b\u8ddf\u522b\u4eba\u6bd4\u8fdb\u5ea6\u3002\u4f60\u53ea\u8981\u6bcf\u5929\u6bd4\u6628\u5929\u7684\u81ea\u5df1\u597d\u4e00\u70b9\u70b9\uff0c\u5c31\u662f\u6700\u5927\u7684\u6210\u529f\u3002\u6709\u4efb\u4f55\u5361\u4f4f\u7684\u5730\u65b9\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4e00\u6b65\u6b65\u5e26\u4f60\u8d70\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u9002\u8001\u9632\u8131\u8282\u4f34\u98de\u8425\uff08\u4ea7\u54c1\u7ebfC\uff09\u53d8\u4f53**\u3011\u2014\u2014 \u9488\u5bf9\u201c\u6570\u5b57\u64cd\u4f5c\u56f0\u96be+\u60c5\u7eea\u5185\u8017\u201d\u7684\u5e74\u8f7b\u4e0a\u73ed\u65cf\u3002\u6838\u5fc3\u662f**\u964d\u7ef4\u4ea4\u4ed8\u4e0e\u5168\u966a\u4f34**\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\uff08\u6ee1\u914dC\u6a21\u5757\uff09**\u3011 + **\u964d\u7ef4\u7248A\u6a21\u5757\uff08\u50bb\u74dc\u5f0f\u64cd\u4f5c\u6307\u5f15\uff09**\u3002\u5fc5\u987b\u914d\u5907**\u7279\u79cdC\uff08\u7ebf\u4e0a\u9632\u8d70\u5931\u6258\u5e95\uff09**\uff0c\u63d0\u4f9b\u201c\u8f6e\u6905\u7ea7\u201d\u60c5\u7eea\u966a\u4f34\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5728\u7fa4\u5185\u516c\u5f00\u6279\u8bc4\u6216\u5bf9\u6bd4\u5979\u7684\u4f5c\u4e1a\uff1b\u7ed9\u5979\u5e03\u7f6e\u8d85\u51fa\u5176\u5f53\u524d\u80fd\u529b\u7684\u590d\u6742\u4efb\u52a1\uff1b\u7528\u201c\u522b\u4eba\u90fd\u4f1a\u4e86\u4f60\u600e\u4e48\u8fd8\u4e0d\u4f1a\u201d\u4e4b\u7c7b\u7684\u8bed\u8a00\u65bd\u538b\uff1b\u5728\u5979\u8868\u8fbe\u56f0\u60d1\u65f6\u53ea\u56de\u590d\u201c\u591a\u7ec3\u7ec3\u201d\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u60c5\u7eea\u7a33\u5b9a\u524d\u8fdb\u884c\u4efb\u4f55\u5347\u5355**\u3002\u9996\u8981\u4efb\u52a1\u662f\u5efa\u7acb\u5b89\u5168\u611f\u548c\u5b8c\u6210\u57fa\u7840\u5b66\u4e60\u3002\u5f85\u5176\u80fd\u72ec\u7acb\u5b8c\u6210\u4f5c\u4e1a\u3001\u60c5\u7eea\u8d8b\u4e8e\u7a33\u5b9a\uff08\u7ea61-2\u4e2a\u6708\u540e\uff09\uff0c\u53ef\u8bd5\u63a2\u6027\u63a8\u8350\u4f4e\u5ba2\u5355\u3001\u9ad8\u60c5\u7eea\u4ef7\u503c\u7684**\u4ea7\u54c1\u7ebfB\uff08\u60c5\u7eea\u533b\u7f8e\uff09** \u5468\u8fb9\uff0c\u5982\u58f0\u97f3\u5b9a\u5236\u76f2\u76d2\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u770b\u89c1\u4ed6\u4eec\u522b\u4eba\u90fd\u4f1a\u505a\uff0c\u5230\u6211\u8fd9\u6211\u6211\u5f04\u4e86\u534a\u5929\u4e5f\u5f04\u4e0d\u597d\u3002\u597d\u51e0\u4e2a\u4eba\u90fd\u4f1a\u505a...\u7740\u6025\u4e86\u3002\u201d\n2. > \u201c\u7fa4\u91cc\u90a3\u4e2a\u7559\u7684\u4f5c\u4e1a\u4ec0\u4e48\u7684\u54c8...\u6211\u5c31\u770b\u6211\u5c31\u770b\u4e0d\u5230\u90a3\u4e2a\u5c31\u662f\u53d1\u7684\u90a3\u4e2a\u56fe\u7247\uff0c\u6211\u8fd9\u4eba\u5427\u6709\u70b9\u7b28\uff0c\u7136\u540e\u6211\u5c31\u62ff\u53e6\u4e00\u4e2a\u624b\u673a...\u6709\u70b9\u7b28[\u96be\u8fc7]\u201d\n3. > \u201c\u6211\u4e0d\u662f\u4e2a\u5f88\u806a\u660e\u7684\u4eba\u4f46\u6211\u4f1a\u4e00\u76f4\u52aa\u529b\u7684[\u5fae\u7b11]\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u7fa4\u4f53\u5f52\u5c5e\u4e0e\u5c0a\u91cd\uff0c\u514b\u670d\u81ea\u5351\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u81f4\u7684\u60c5\u611f\u6258\u5e95\u4e0e\u50bb\u74dc\u5f0f\u64cd\u4f5c\u6307\u5f15\uff0c\u4e25\u9632\u540c\u4faa\u538b\u529b\u548c\u6280\u672f\u632b\u8d25\u5bfc\u81f4\u60c5\u7eea\u5d29\u76d8\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u793e\u4ea4\u4e0e\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u9002\u8001\u4f34\u98de\u8425\uff08\u964d\u7ef4\u7248\uff09+ \u6ee1\u914d\u60c5\u7eea\u966a\u5b66\
