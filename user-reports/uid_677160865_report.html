    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677160865 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e - \u83ab\u8bed9(\u5218\u6587\u4e1c)\u3001\u9648\u9648(\u5218\u6587\u4e1c)\u3001\u53ef\u4e3d\u513f(\u5b54\u4ee4\u5a77) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u9a6c\u62c9\u96c5\u6709\u58f0\u6f14\u64ad\u8bad\u7ec3\u8425 (\u4ef7\u683c\uff1a3980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u4ec5\u63d0\u53ca\u4ef7\u683c\uff0c\u672a\u900f\u9732\u652f\u4ed8\u65b9\u5f0f\u3001\u8d44\u91d1\u6765\u6e90\u6216\u5bb6\u5ead\u8d22\u52a1\u72b6\u51b5\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u4e3b\u4e1a\u65f6\u95f4\u201c\u975e\u5e38\u4e0d\u89c4\u5f8b\u201d\uff0c\u4f46\u8868\u793a\u201c\u6bcf\u5929\u4e24\u4e2a\u5c0f\u65f6\u5de6\u53f3\u8fd8\u662f\u53ef\u4ee5\u7684\u201d\u3002\u5b58\u5728\u591c\u73ed\uff08\u201c\u665a\u4e0a\u591c\u73ed\uff0c\u516b\u70b9\u7a7a\u4e0d\u51fa\u6765\u201d\uff09\uff0c\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\u4e14\u4e0d\u7a33\u5b9a\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u4e2d\u672a\u63d0\u53ca\u4efb\u4f55\u5173\u4e8e\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\u7684\u4fe1\u606f\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u7f3a\u4e4f\u5173\u4e8e\u8d44\u91d1\u6765\u6e90\u3001\u5bb6\u5ead\u652f\u6301\u5ea6\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u3001\u5177\u4f53\u804c\u4e1a\u7b49\u5173\u952e\u4fe1\u606f\u3002\u5224\u65ad\u57fa\u4e8e\u6709\u9650\u884c\u4e3a\u4fe1\u53f7\uff0c\u98ce\u9669\u8f83\u9ad8\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u5bf9\u53d8\u73b0\u6e20\u9053\uff08\u659c\u6760\u3001\u5f55\u4e66\uff09\u660e\u786e\u611f\u5174\u8da3\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u201c\u51e0\u5929\u5185\u63d0\u73b0\u201d\u7684\u6781\u7aef\u6025\u8feb\u6027\u3002\u5176\u884c\u4e3a\uff08\u8865\u8bfe\u3001\u4ea4\u4f5c\u4e1a\uff09\u663e\u793a\u51fa\u4e00\u5b9a\u7684\u5b66\u4e60\u610f\u613f\uff0c\u4f46\u6838\u5fc3\u9a71\u52a8\u529b\u4ecd\u662f\u517c\u804c\u8d5a\u94b1\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u90fd\u5f88\u611f\u5174\u8da3\uff0c\u4f46\u662f\u76ee\u524d\u4e3b\u4e1a\u65f6\u95f4\u975e\u5e38\u4e0d\u786e\u5b9a\uff0c\u659c\u6760\u90a3\u51e0\u4e2a\u548c\u5f55\u4e66\u611f\u89c9\u6bd4\u8f83\u5408\u9002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[**\u4fe1\u606f\u4e0d\u8db3**] \u2014 \u672a\u63d0\u53ca\uff0c\u65e0\u6cd5\u5224\u65ad\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[**\u4f4e**] \u2014 \u4e3b\u4e1a\u65f6\u95f4\u201c\u975e\u5e38\u4e0d\u89c4\u5f8b\u201d\uff0c\u6709\u591c\u73ed\uff0c\u9700\u8981\u7533\u8bf7\u76f4\u64ad\u56de\u653e\uff0c\u8868\u660e\u56fa\u5b9a\u5b66\u4e60\u65f6\u95f4\u96be\u4ee5\u4fdd\u8bc1\u3002\u867d\u58f0\u79f0\u6bcf\u5929\u53ef\u5b89\u63922\u5c0f\u65f6\uff0c\u4f46\u5b9e\u9645\u6267\u884c\u4e2d\uff08\u7f3a\u8bfe\u3001\u8865\u8bfe\uff09\u663e\u793a\u65f6\u95f4\u7ba1\u7406\u5b58\u5728\u6311\u6218\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[**\u4fe1\u606f\u4e0d\u8db3**] \u2014 \u672a\u63d0\u53ca\uff0c\u65e0\u6cd5\u5224\u65ad\u3002**\u6b64\u4e3a\u91cd\u5927\u98ce\u9669\u9690\u60a3**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a**\u3002\u7528\u6237\u80fd\u4e3b\u52a8\u89e3\u91ca\u539f\u56e0\uff08\u201c\u4e3b\u4e1a\u65f6\u95f4\u4e0d\u89c4\u5f8b\u201d\uff09\u3001\u8868\u8fbe\u6b49\u610f\uff08\u201c\u5e08\u59d0\uff0c\u4e0d\u597d\u610f\u601d\u54c8\u201d\uff09\u3001\u79ef\u6781\u8865\u8bfe\uff08\u201c\u4e00\u5b9a\u8ba4\u771f\u8865\u8bfe\u201d\uff09\uff0c\u663e\u793a\u51fa\u4e00\u5b9a\u7684\u8d23\u4efb\u611f\u548c\u914d\u5408\u5ea6\u3002\u672a\u8868\u73b0\u51fa\u6781\u7aef\u60c5\u7eea\u5316\u6216\u653e\u5f03\u8a00\u8bba\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5e08\u59d0\u8fd8\u6ca1\u7ed9\u6211\u91cd\u65b0\u53d1\u90a3\u4e2a\u5927\u793c\u5305[\u59d4\u5c48]\u201d (\u8f7b\u5fae\u4f9d\u8d56\uff0c\u4f46\u8bed\u6c14\u5e73\u548c)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e3b\u4e1a\u65f6\u95f4\u4e0d\u89c4\u5f8b\u5e26\u6765\u7684\u6536\u5165\u4e0d\u7a33\u5b9a\u611f\u548c\u5bf9\u672a\u6765\u7684\u7126\u8651**\u3002\u7528\u6237\u5bfb\u6c42\u4e00\u4efd\u65f6\u95f4\u7075\u6d3b\u3001\u80fd\u8865\u5145\u6536\u5165\u7684\u526f\u4e1a\uff0c\u6838\u5fc3\u662f\u62b5\u5fa1\u4e3b\u4e1a\u4e0d\u786e\u5b9a\u6027\u5e26\u6765\u7684\u7ecf\u6d4e\u98ce\u9669\uff0c\u5bfb\u6c42\u4e00\u4efd\u201c\u5b89\u5168\u57ab\u201d\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u7075\u6d3b\u53ef\u63a7\u201d\u7684\u786e\u5b9a\u611f\u548c\u201c\u88ab\u770b\u89c1\u201d\u7684\u8ba4\u53ef**\u3002\u5f3a\u8c03\u6709\u58f0\u884c\u4e1a\u7684\u7075\u6d3b\u6027\uff08\u201c\u4e0d\u5361\u5750\u73ed\u65f6\u95f4\u201d\uff09\uff0c\u5e76\u5bf9\u5176\u6bcf\u4e00\u6b21\u8fdb\u6b65\uff08\u4f5c\u4e1a\u901a\u8fc7\uff09\u7ed9\u4e88\u53ca\u65f6\u3001\u5177\u4f53\u7684\u80af\u5b9a\uff0c\u8ba9\u4ed6\u611f\u5230\u8fd9\u6761\u8def\u201c\u53ef\u884c\u201d\u4e14\u201c\u6709\u5e0c\u671b\u201d\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1** \u7c7b (\u52a8\u673a\u4e2d\u7b49\u3001\u8d44\u6e90\u5e95\u5ea7\u5b58\u5728\u660e\u663e\u77ed\u677f\u3001\u5fc3\u7406\u5f39\u6027\u5c1a\u53ef) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u578b** (\u6838\u5fc3\u8bc9\u6c42\u662f\u7075\u6d3b\u53d8\u73b0\uff0c\u5bf9\u5b66\u4e60\u8fc7\u7a0b\u6709\u4e00\u5b9a\u914d\u5408\u5ea6\uff0c\u4f46\u8d44\u6e90\u7d27\u5f20) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5c5e\u5927\u5435\u7b49\u660e\u786e\u7ea2\u7ebf\u4fe1\u53f7\u3002**\u4f46\u5bb6\u5ead\u652f\u6301\u5ea6\u672a\u77e5\uff0c\u662f\u6f5c\u5728\u98ce\u9669\u70b9\u3002**\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u4e3a\u6700\u5927\u9690\u60a3**\u3002\u82e5\u62a5\u540d\u8d39\u7528\u652f\u51fa\u672a\u4e0e\u5bb6\u4eba\u6c9f\u901a\u6216\u906d\u53cd\u5bf9\uff0c\u6781\u6613\u5f15\u53d1\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u4e3b\u4e1a\u65f6\u95f4\u4e0d\u89c4\u5f8b**\uff0c\u5bfc\u81f4\u65e0\u6cd5\u6309\u65f6\u53c2\u52a0\u76f4\u64ad\u3001\u5b8c\u6210\u4f5c\u4e1a\uff0c\u4ea7\u751f\u79ef\u538b\u548c\u632b\u8d25\u611f\uff0c\u6700\u7ec8\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u7528\u6237\u60c5\u7eea\u7a33\u5b9a\uff0c\u6c9f\u901a\u793c\u8c8c\uff0c\u672a\u8868\u73b0\u51fa\u6613\u7834\u9632\u7279\u8d28\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u5982\u679c\u5b66\u4e601-2\u5468\u540e\uff0c\u53d1\u73b0\u65e0\u6cd5\u7acb\u5373\u83b7\u5f97\u9884\u671f\u7684\u201c\u7075\u6d3b\u63a5\u5355\u201d\u673a\u4f1a\uff0c\u6216\u63a5\u5355\u95e8\u69db\u9ad8\u4e8e\u9884\u671f\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-3\u5468**\u3002\u5f53\u8bfe\u7a0b\u8282\u594f\u52a0\u5feb\u3001\u4f5c\u4e1a\u96be\u5ea6\u63d0\u5347\uff0c\u800c\u4ed6\u7684\u4e0d\u89c4\u5f8b\u4f5c\u606f\u4e0e\u5b66\u4e60\u8981\u6c42\u51b2\u7a81\u52a0\u5267\u65f6\uff0c\u662f\u653e\u5f03\u7684\u9ad8\u5cf0\u671f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5e08\u5144/\u5e08\u59d0\uff0c\u770b\u5230\u4f60\u4e3b\u4e1a\u65f6\u95f4\u6bd4\u8f83\u7279\u6b8a\uff0c\u54b1\u4eec\u8fd9\u884c\u6700\u5927\u7684\u597d\u5904\u5c31\u662f\u2018\u65f6\u95f4\u81ea\u5df1\u8bf4\u4e86\u7b97\u2019\u3002\u4f60\u4e0d\u7528\u6709\u538b\u529b\uff0c\u76f4\u64ad\u90fd\u6709\u56de\u653e\uff0c\u4f5c\u4e1a\u63d0\u4ea4\u65f6\u95f4\u6211\u4eec\u4e5f\u7ed9\u4f60\u653e\u5bbd\u523024\u5c0f\u65f6\u3002\u54b1\u4eec\u7684\u76ee\u6807\u4e0d\u662f\u2018\u6309\u65f6\u6253\u5361\u2019\uff0c\u800c\u662f\u2018\u5b66\u4f1a\u3001\u80fd\u63a5\u5355\u2019\u3002\u6211\u4f1a\u6839\u636e\u4f60\u7684\u65f6\u95f4\uff0c\u5e2e\u4f60\u89c4\u5212\u6700\u7701\u529b\u7684\u5b66\u4e60\u8def\u5f84\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5feb\u901f\u63a5\u5355\u7ebf**\u3011\u3002\u6838\u5fc3\u662f\u8ba9\u4ed6\u5c3d\u5feb\u770b\u5230\u201c\u53d8\u73b0\u53ef\u80fd\u6027\u201d\uff0c\u54ea\u6015\u662f\u5c0f\u989d\u5546\u5355\u6216\u7b80\u5355\u659c\u6760\u4efb\u52a1\uff0c\u5efa\u7acb\u6b63\u53cd\u9988\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u7075\u6d3b\u65f6\u95f4\u9002\u914d\u5305**\u3011\u3002\u81ea\u52a8\u63a8\u9001\u76f4\u64ad\u56de\u653e\u3001\u5ef6\u957f\u4f5c\u4e1a\u63d0\u4ea4\u622a\u6b62\u65f6\u95f4\u3001\u63d0\u4f9b\u788e\u7247\u5316\u5b66\u4e60\u6307\u5357\uff08\u59825\u5206\u949f\u53e3\u90e8\u64cd\u97f3\u9891\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u4ed6\u4f7f\u7528\u4e25\u683c\u7684\u201c\u5b9a\u65f6\u6253\u5361\u201d\u9ad8\u538b\u7b56\u7565**\u3002\u8fd9\u4f1a\u76f4\u63a5\u5f15\u7206\u4ed6\u7684\u65f6\u95f4\u77ed\u677f\u3002\n    2. **\u7edd\u4e0d\u5728\u521d\u671f\u753b\u201c\u8f7b\u677e\u6708\u5165\u8fc7\u4e07\u201d\u7684\u5927\u997c**\u3002\u5e94\u5f3a\u8c03\u201c\u4ece\u5c0f\u65f6\u85aa\u3001\u5c0f\u659c\u6760\u8d77\u6b65\u201d\uff0c\u7ba1\u7406\u9884\u671f\u3002\n    3. **\u7edd\u4e0d\u5ffd\u89c6\u5176\u201c\u5bb6\u5ead\u652f\u6301\u5ea6\u201d\u7684\u6478\u5e95**\u3002\u5fc5\u987b\u5728\u4ed8\u8d39\u540e\u7b2c\u4e00\u65f6\u95f4\u6e29\u548c\u63a2\u8be2\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u652f\u6301\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u8bfe\u7a0b\u524d\u671f\uff08\u524d\u4e24\u4e2a\u6708\uff09\u8fdb\u884c\u5927\u989d\u5347\u5355**\u3002\u53ef\u8003\u8651500\u5143\u4ee5\u5185\u7684\u5de5\u5177\u3001\u8d44\u6599\u5305\u5fae\u5347\u5355\uff0c\u524d\u63d0\u662f\u5176\u5b66\u4e60\u8fdb\u5ea6\u7a33\u5b9a\u4e14\u6709\u5c0f\u989d\u6b63\u53cd\u9988\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u4e3b\u4e1a\u538b\u529b\u8fd8\u884c\uff0c\u517c\u804c\u4e0d\u4f1a\u5f71\u54cd\u4e3b\u4e1a\uff0c\u4f46\u662f\uff0c\u4e3b\u4e1a\u7684\u65f6\u95f4\u975e\u5e38\u4e0d\u89c4\u5f8b\uff0c\u5e0c\u671b\u517c\u804c\u7684\u65f6\u95f4\u4e5f\u4e0d\u8981\u592a\u89c4\u5f8b[\u6342\u8138]\u201d\n2. > \u201c\u665a\u4e0a\u591c\u73ed\uff0c\u516b\u70b9\u7a7a\u4e0d\u51fa\u6765\u600e\u4e48\u529e[\u6d41\u6cea]\u201d\n3. > \u201c\u90fd\u5f88\u611f\u5174\u8da3\uff0c\u4f46\u662f\u76ee\u524d\u4e3b\u4e1a\u65f6\u95f4\u975e\u5e38\u4e0d\u786e\u5b9a\uff0c\u659c\u6760\u90a3\u51e0\u4e2a\u548c\u5f55\u4e66\u611f\u89c9\u6bd4\u8f83\u5408\u9002\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4\u641e\u94b1\u7ed3\u679c\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u62b5\u5fa1\u4e3b\u4e1a\u4e0d\u89c4\u5f8b\u5e26\u6765\u7684\u7ecf\u6d4e\u7126\u8651\uff0c\u5bfb\u6c42\u4e00\u4efd\u7075\u6d3b\u7684\u5b89\u5168\u6536\u5165\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u504f\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u81f4\u7075\u6d3b\u7684\u65f6\u95f4\u9002\u914d\u65b9\u6848\uff0c\u5e76\u5c3d\u65e9\u7ed9\u4e88\u5c0f\u989d\u53d8\u73b0\u7684\u6b63\u53cd\u9988\uff0c\u540c\u65f6\u79d8\u5bc6\u6392\u67e5\u5bb6\u5ead\u652f\u6301\u5ea6\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf+\u7075\u6d3b\u65f6\u95f4\u9002\u914d\u5305\"}\n```";
