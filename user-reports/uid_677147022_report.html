    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d)**: \u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b\uff08\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u4e3b\u52a8\u7ec3\u4e60\u3001\u79ef\u6781\u53cd\u9988\uff09\uff0c\u5bf9\u6709\u58f0\u884c\u4e1a\u6709\u57fa\u7840\u5174\u8da3\u3002\u4f46\u52a8\u673a\u4e2d**\u53d8\u73b0\u671f\u5f85**\u4e0e**\u6280\u80fd\u63d0\u5347**\u5e76\u5b58\uff0c\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u53d8\u73b0\u201d\u3001\u201c\u63a5\u5355\u201d\u3001\u201c\u7b2c\u4e00\u6876\u91d1\u201d\uff0c\u7528\u6237\u5bf9\u6b64\u6709\u56de\u5e94\uff08\u201c\u5f55\u4e66\u201d\uff09\uff0c**\u5b58\u5728\u88ab\u77ed\u671f\u6536\u76ca\u627f\u8bfa\u9a71\u52a8\u7684\u6210\u5206**\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4f4e)**: \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u7528\u6237\u7684\u7ecf\u6d4e\u72b6\u51b5\u3001\u804c\u4e1a\u3001\u7a7a\u95f2\u65f6\u95f4\u7b49\u5173\u952e\u8d44\u6e90\u4fe1\u606f\u3002\u4ec5\u4ece\u652f\u4ed82380\u5143\uff082\u4e2a\u6708\u8bfe\u7a0b\uff09\u7684\u884c\u4e3a\u770b\uff0c**\u652f\u4ed8\u80fd\u529b\u6709\u9650**\uff0c\u53ef\u80fd\u5bf9\u9ad8\u5355\u4ef7\u4ea7\u54c1\u627f\u53d7\u529b\u5f31\u3002**\u4fe1\u606f\u4e25\u91cd\u4e0d\u8db3**\uff0c\u65e0\u6cd5\u8bc4\u4f30\u65f6\u95f4\u3001\u8bbe\u5907\u3001\u5bb6\u5ead\u652f\u6301\u7b49\u8d44\u6e90\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u9ad8)**: \u7528\u6237\u914d\u5408\u5ea6\u9ad8\uff0c\u6307\u4ee4\u54cd\u5e94\u53ca\u65f6\uff08\u201c\u597d\u201d\u3001\u201c\u5df2\u6536\u5230\u201d\u3001\u201c\u51c6\u65f6\u5230\u201d\uff09\uff0c\u5bf9\u9500\u552e\uff08\u5e08\u59d0\uff09\u7684\u9f13\u52b1\u548c\u6307\u5bfc\u7ed9\u4e88\u6b63\u5411\u53cd\u9988\uff08\u201c\u8c22\u8c22\u5e08\u59d0\u201d\uff09\u3002\u5728\u8bad\u7ec3\u8425\u8282\u594f\u4e0b\u80fd\u5b8c\u6210\u591a\u9879\u4efb\u52a1\uff0c\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u575a\u6301\u6027\u548c\u670d\u4ece\u6027\u3002\u4f46**\u672a\u7ecf\u5386\u660e\u663e\u632b\u6298\u6216\u538b\u529b\u6d4b\u8bd5**\uff0c\u5f39\u6027\u6df1\u5ea6\u672a\u77e5\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: \u5df2\u652f\u4ed8\u3002\u652f\u4ed8\u91d1\u989d\u4e3a2380\u5143\uff082\u4e2a\u6708\u8bfe\u7a0b\uff09\uff0c\u975e\u9ad8\u4ef7\u4ea7\u54c1\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: **\u4fe1\u606f\u7f3a\u5931**\u3002\u804a\u5929\u8bb0\u5f55\u5168\u7a0b\u4e3a\u7528\u6237\u4e0e\u9500\u552e\u5355\u7ebf\u6c9f\u901a\uff0c\u672a\u63d0\u53ca\u914d\u5076\u3001\u7236\u6bcd\u7b49\u5bb6\u5ead\u6210\u5458\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u4e3a\u72ec\u7acb\u51b3\u7b56\u3002\n*   **\u6b65\u9aa41 - \u52a8\u673a\u7eaf\u5ea6**: \u52a8\u673a\u6df7\u5408\uff08\u5174\u8da3+\u53d8\u73b0\uff09\uff0c\u7eaf\u5ea6\u4e2d\u7b49\u3002\n*   **\u6b65\u9aa42 - \u8d44\u6e90\u5e95\u5ea7**: \u8d44\u6e90\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931\uff0c\u4ec5\u77e5\u652f\u4ed8\u91d1\u989d\u4e0d\u9ad8\uff0c\u6682\u8bc4\u4f30\u4e3a\u4f4e\u3002\n*   **\u6b65\u9aa43 - \u5fc3\u7406\u5f39\u6027**: \u8868\u73b0\u914d\u5408\u3001\u987a\u4ece\uff0c\u5f39\u6027\u8bc4\u4f30\u4e3a\u4e2d\u9ad8\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**: \u7ed3\u5408\u201c\u4e2d\u52a8\u673a\u3001\u4f4e\u8d44\u6e90\u3001\u4e2d\u9ad8\u5f39\u6027\u201d\u4fe1\u53f7\uff0c**\u521d\u6b65\u503e\u5411B\u7c7b\uff08\u6f5c\u529b\u578b\uff09**\uff0c\u4f46\u8d44\u6e90\u7ef4\u5ea6\u4fe1\u606f\u4e0d\u8db3\u5bfc\u81f4\u7f6e\u4fe1\u5ea6\u964d\u4f4e\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**: **T5 \u52a1\u5b9e\u63a2\u7d22\u8005**\u3002\n*   **\u4f9d\u636e**: \u7528\u6237\u884c\u4e3a\u4f53\u73b0\u52a1\u5b9e\u6027\u2014\u2014\u6309\u65f6\u5b8c\u6210\u4efb\u52a1\u3001\u5173\u6ce8\u5177\u4f53\u64cd\u4f5c\uff08\u5982\u201c\u5f55\u4e66\u201d\u5de5\u79cd\uff09\u3002\u5bf9\u884c\u4e1a\u6709\u63a2\u7d22\u5174\u8da3\uff0c\u4f46\u52a8\u673a\u4e2d\u5305\u542b\u660e\u786e\u7684\u53d8\u73b0\u671f\u5f85\uff08\u56de\u5e94\u9500\u552e\u53d8\u73b0\u8bdd\u9898\uff09\u3002\u652f\u4ed8\u884c\u4e3a\u8c28\u614e\uff08\u9009\u62e92\u4e2a\u6708\u800c\u975e4\u4e2a\u6708\u8bfe\u7a0b\uff09\uff0c\u7b26\u5408\u8be5\u539f\u578b\u201c\u6210\u672c\u654f\u611f\u201d\u3001\u201c\u6548\u679c\u5bfc\u5411\u201d\u7279\u5f81\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u98ce\u9669\u7b49\u7ea7\uff1a\u4e2d)\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**: **\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa\u201c\u5feb\u901f\u6323\u5230\u7b2c\u4e00\u6876\u91d1\u201d\u3001\u201c\u5e26\u4f60\u5165\u884c\u201d\u3001\u201c\u8d44\u6e90\u975e\u5e38\u591a\u201d\uff0c\u53ef\u80fd\u62c9\u9ad8\u7528\u6237\u5bf9\u77ed\u671f\u53d8\u73b0\u7684\u671f\u671b\u3002\u7528\u6237\u52a8\u673a\u542b\u53d8\u73b0\uff0c\u82e5\u540e\u671f\u63a5\u5355\u4e0d\u987a\u6613\u5931\u671b\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**: **\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u9009\u62e9\u4f4e\u4ef7\u4f4d\u8bfe\u7a0b\uff0c\u663e\u793a\u652f\u4ed8\u80fd\u529b\u6709\u9650\u6216\u6d88\u8d39\u8c28\u614e\u3002\u82e5\u540e\u7eed\u88ab\u63a8\u8350\u66f4\u9ad8\u9636\u8bfe\u7a0b\u6216\u611f\u89c9\u6295\u5165\u65e0\u56de\u62a5\uff0c\u53ef\u80fd\u56e0\u7ecf\u6d4e\u538b\u529b\u9000\u8d39\u3002\n    3.  **\u5bb6\u5ead\u53cd\u5bf9**: **\u672a\u77e5\u98ce\u9669**\u3002**\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u7f3a\u5931**\uff0c\u662f\u91cd\u5927\u98ce\u9669\u76f2\u533a\u3002\n    4.  **\u65f6\u95f4\u51b2\u7a81**: **\u672a\u77e5\u98ce\u9669**\u3002\u672a\u63d0\u53ca\u804c\u4e1a\u4e0e\u7a7a\u95f2\u65f6\u95f4\u3002\n    5.  **\u4ea7\u54c1\u4e0d\u7b26**: **\u4f4e\u98ce\u9669**\u3002\u7528\u6237\u5bf9\u8bfe\u7a0b\u5185\u5bb9\uff08\u53e3\u90e8\u64cd\u3001\u65c1\u767d\u3001\u89d2\u8272\u97f3\uff09\u6709\u8ddf\u8fdb\u548c\u7ec3\u4e60\uff0c\u76ee\u524d\u672a\u663e\u4e0d\u9002\u3002\n    6.  **\u670d\u52a1\u4f53\u9a8c**: **\u4f4e\u98ce\u9669**\u3002\u4e0e\u9500\u552e\u4e92\u52a8\u826f\u597d\uff0c\u8ba4\u53ef\u201c\u5e08\u59d0\u201d\u3002\n    7.  **\u7ade\u54c1\u6bd4\u8f83/\u8d1f\u9762\u4fe1\u606f**: **\u4f4e\u98ce\u9669**\u3002\u5f53\u524d\u8bb0\u5f55\u672a\u4f53\u73b0\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5b58\u5728\u5408\u89c4\u98ce\u9669\u70b9**:\n    *   **\u8fc7\u5ea6\u627f\u8bfa\u4e0e\u8bf1\u5bfc**: \u9500\u552e\u591a\u6b21\u4f7f\u7528\u201c\u5feb\u901f\u6323\u5230\u7b2c\u4e00\u6876\u91d1\u201d\u3001\u201c\u5e26\u4f60\u5165\u884c\u201d\u3001\u201c\u6211\u4f1a\u5e26\u7740\u4f60\u201d\u7b49\u8bdd\u672f\uff0c**\u5b58\u5728\u5938\u5927\u6536\u76ca\u3001\u6a21\u7cca\u5b66\u4e60\u4e0e\u6210\u529f\u4e4b\u95f4\u56e0\u679c\u5173\u7cfb\u7684\u98ce\u9669**\uff0c\u53ef\u80fd\u8fdd\u53cd\u5173\u4e8e\u4e0d\u5f97\u4f5c\u4fdd\u8bc1\u6027\u627f\u8bfa\u7684\u89c4\u8303\u3002\n    *   **\u5236\u9020\u7a00\u7f3a\u4e0e\u7d27\u8feb\u611f**: \u201c\u540d\u989d\u8981\u6ca1\u6709\u4e86\u54c8\u201d\u3001\u201c\u798f\u5229\u5b66\u59d0\u90fd\u7ed9\u4f60\u51c6\u5907\u597d\u4e86\u5462\u201d\uff0c\u5c5e\u4e8e\u5e38\u89c4\u4f46\u9700\u6ce8\u610f\u5c3a\u5ea6\u7684\u4fc3\u5355\u624b\u6cd5\u3002\n    *   **\u201c\u5e08\u59d0\u201d\u4eba\u8bbe**: \u5229\u7528\u4eb2\u5bc6\u79f0\u547c\u5efa\u7acb\u4fe1\u4efb\uff0c\u5c5e\u60c5\u611f\u8425\u9500\uff0c\u9700\u6ce8\u610f\u8fb9\u754c\u3002\n*   **\u672a\u53d1\u73b0\u91cd\u5927\u4f26\u7406\u7ea2\u7ebf\u95ee\u9898**\uff08\u5982\u6b3a\u8bc8\u3001\u6050\u5413\uff09\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d**: **\u504f\u5dee**\u3002\u7528\u6237\u4e3aT5\u52a1\u5b9e\u63a2\u7d22\u8005\uff0c\u52a8\u673a\u542b\u8f83\u5f3a\u53d8\u73b0\u671f\u5f85\uff0c\u4e14\u8d44\u6e90\u5e95\u5ea7\u53ef\u80fd\u8f83\u8584\u5f31\u3002\u5f53\u524d\u9500\u552e\u94fe\u8def\u4ee5\u201c\u5feb\u901f\u53d8\u73b0\u201d\u4e3a\u94a9\u5b50\uff0c\u4e0e\u7528\u6237\u6df1\u5c42\u9700\u6c42\uff08\u53ef\u80fd\u5e0c\u671b\u7a33\u5065\u5165\u95e8\u3001\u660e\u786e\u8def\u5f84\uff09\u5b58\u5728\u6f5c\u5728\u504f\u5dee\uff0c\u6613\u5bfc\u81f4\u540e\u7eed\u6ee1\u610f\u5ea6\u95ee\u9898\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **\u9996\u5468\u6821\u6b63\u53d8\u73b0\u9884\u671f\uff0c\u540c\u6b65\u6838\u67e5\u5bb6\u5ead\u652f\u6301**\u3002\n*   **\u5177\u4f53\u884c\u52a8\u5efa\u8bae**:\n    1.  **\u9884\u671f\u7ba1\u7406**: \u73ed\u4e3b\u4efb\u9996\u5468\u6c9f\u901a\u5fc5\u987b**\u6b63\u9762\u3001\u6e05\u6670\u6821\u6b63\u53d8\u73b0\u9884\u671f**\uff0c\u5f3a\u8c03\u6280\u80fd\u79ef\u7d2f\u5468\u671f\u3001\u884c\u4e1a\u7ade\u4e89\u73b0\u72b6\uff0c\u5c06\u7528\u6237\u76ee\u6807\u4ece\u201c\u5feb\u901f\u8d5a\u94b1\u201d\u5f15\u5bfc\u81f3\u201c\u7cfb\u7edf\u5b66\u4e60\u3001\u7a33\u6b65\u5165\u95e8\u201d\u3002\n    2.  **\u5bb6\u5ead\u77e5\u60c5\u6838\u67e5**: \u5c3d\u5feb\u4ee5\u6e29\u548c\u65b9\u5f0f\u4e86\u89e3\u8bfe\u7a0b\u4ed8\u8d39\u662f\u5426\u5df2\u83b7\u5bb6\u5ead\u652f\u6301\uff0c**\u786e\u8ba4\u72ec\u7acb\u51b3\u7b56\u6743\u6216\u83b7\u53d6\u5173\u952e\u51b3\u7b56\u4eba\u77e5\u60c5**\u3002\n    3.  **\u8d44\u6e90\u8bc4\u4f30**: \u4e86\u89e3\u7528\u6237\u804c\u4e1a\u3001\u6bcf\u65e5\u53ef\u56fa\u5b9a\u5b66\u4e60\u65f6\u95f4\u3001\u5f55\u97f3\u8bbe\u5907\u6761\u4ef6\uff0c\u8bc4\u4f30\u5176\u80fd\u5426\u8ddf\u4e0a\u8bfe\u7a0b\u8282\u594f\u3002\n    4.  **\u5f3a\u5316\u8fc7\u7a0b\u6fc0\u52b1**: \u9488\u5bf9T5\u539f\u578b\uff0c\u591a\u7ed9\u4e88\u5177\u4f53\u3001\u7ec6\u5fae\u7684\u8fdb\u6b65\u53cd\u9988\uff08\u5982\u80af\u5b9a\u5176\u4f5c\u4e1a\u4e2d\u7684\u67d0\u5904\u5904\u7406\uff09\uff0c\u5c06\u6210\u5c31\u611f\u4e0e\u5b66\u4e60\u8fc7\u7a0b\u800c\u975e\u4ec5\u4e0e\u63a5\u5355\u7ed3\u679c\u7ed1\u5b9a\u3002\n    5.  **\u98ce\u9669\u76d1\u63a7**: \u91cd\u70b9\u89c2\u5bdf\u7528\u6237\u5728\u5b66\u4e60\u4e2d\u540e\u671f\uff08\u7ea6\u7b2c3-4\u5468\uff09\u662f\u5426\u51fa\u73b0\u56e0\u672a\u63a5\u5230\u8bd5\u97f3\u6216\u5355\u91cf\u5c11\u800c\u4ea7\u751f\u7684\u7126\u8651\u3001\u61c8\u6020\u60c5\u7eea\uff0c\u53ca\u65f6\u5e72\u9884\u3002\n\n{\"core_type\": \"T5 \u52a1\u5b9e\u63a2\u7d22\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u9996\u5468\u6821\u6b63\u53d8\u73b0\u9884\u671f\u5e76\u6838\u67e5\u5bb6\u5ead\u652f\u6301\"}";
