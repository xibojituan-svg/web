        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 676981362 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-24 \u81f3 2026-04-06 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u8d85\u4eba\u6897\u54e5(\u803f\u4e1a\u4e1c) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u57f9\u8bad\u8bfe\u7a0b\uff08\u542b\u8bbe\u5907\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u91d1\u989d\u6216\u8d44\u91d1\u6765\u6e90\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u4e3a\u9500\u552e\uff0c\u5de5\u4f5c\u533a\u57df\u4e3a\u6574\u4e2a\u897f\u5317\uff0c\u9891\u7e41\u51fa\u5dee\uff0c\u65f6\u95f4\u4e0d\u56fa\u5b9a\uff0c\u9700\u201c\u4e0b\u5e02\u573a\u201d\u540e\u5168\u662f\u5ba2\u6237\u65f6\u95f4\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u4ec5\u63d0\u53ca\u5b69\u5b50\u5728\u5b66\u6821\uff0c\u672a\u6d89\u53ca\u5bb6\u4eba\u5bf9\u5b66\u4e60/\u6d88\u8d39\u7684\u6001\u5ea6\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u5b66\u4e60\u8fc7\u7a0b\u3001\u5fc3\u6001\u3001\u6280\u672f\u95ee\u9898\u66b4\u9732\u5145\u5206\uff0c\u4f46\u5173\u952e\u5bb6\u5ead\u4e0e\u8d22\u52a1\u4fe1\u606f\u7f3a\u5931\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u5bf9\u201c\u4e2d\u4e66\u201d\uff08\u63a5\u5355\uff09\u7684\u62c5\u5fe7\uff08\u201c\u4e2d\u4e66\u4f1a\u6709\u9ebb\u70e6\u5427\u201d\uff09\uff0c\u4f46\u66f4\u591a\u7cbe\u529b\u6295\u5165\u5728\u6280\u672f\u7ec6\u8282\u3001\u53d1\u97f3\u6280\u5de7\u7684\u94bb\u7814\u4e0a\uff0c\u8868\u73b0\u51fa\u5bf9\u80fd\u529b\u63d0\u5347\u7684\u6d53\u539a\u5174\u8da3\u548c\u957f\u671f\u7ec3\u4e60\u7684\u9884\u671f\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u5c31\u611f\u89c9\u73b0\u5728\u6709\u6709\u975e\u5e38\u5927\u7684\u95ee\u9898\uff0c\u6211\u4eec\u6bd5\u4e1a\u4ee5\u540e...\u8fd9\u4e2a\u7ec3\u65b9\u5411\u53bb\u54ea\u513f\u7ec3\uff1f...\u5bf9\u4e8e\u6211\u6765\u8bb2\uff0c\u6211\u73b0\u5728\u5f88\u5e73\u548c\u4e86\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4fe1\u606f\u4e0d\u8db3] \u2014 \u672a\u63d0\u53ca\uff0c\u65e0\u6cd5\u5224\u65ad\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 \u51fa\u5dee\u9891\u7e41\uff0c\u5de5\u4f5c\u7e41\u5fd9\uff0c\u4f46\u80fd\u5229\u7528\u788e\u7247\u65f6\u95f4\u5b66\u4e60\u3001\u8c03\u8bd5\u8bbe\u5907\u3001\u5728\u7fa4\u5185\u6d3b\u8dc3\u4ea4\u6d41\uff0c\u5177\u5907\u8f83\u5f3a\u7684\u81ea\u6211\u7ba1\u7406\u80fd\u529b\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u4e0d\u8db3] \u2014 \u672a\u63d0\u53ca\uff0c\u65e0\u6cd5\u5224\u65ad\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9762\u5bf9\u8bbe\u5907\u5b89\u88c5\u3001\u8f6f\u4ef6\u4f7f\u7528\u3001\u53d1\u97f3\u56f0\u60d1\u7b49\u5927\u91cf\u6280\u672f\u96be\u9898\u65f6\uff0c\u6001\u5ea6\u79ef\u6781\uff0c\u4e3b\u52a8\u5c1d\u8bd5\uff0c\u53cd\u590d\u8c03\u8bd5\uff0c\u5e76\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff08\u201c\u529e\u6cd5\u6bd4\u56f0\u96be\u591a\u201d\uff09\u3002\u867d\u6709\u8ff7\u832b\uff08\u201c\u90af\u90f8\u5b66\u6b65\u201d\uff09\uff0c\u4f46\u80fd\u6e05\u6670\u9648\u8ff0\u95ee\u9898\uff0c\u5bfb\u6c42\u5177\u4f53\u6307\u5bfc\uff0c\u800c\u975e\u62b1\u6028\u6216\u653e\u5f03\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u8c03\u6574\u4e00\u4e0b\uff0c\u6211\u518d\u6211\u518d\u8bd5\u4e00\u4e0b\u3002\u201d / \u201c\u7136\u540e\u6709\u4e9b\u5e73\u7fd8...\u7ea0\u6b63\u4ee5\u540e\u5462\uff0c\u5c31\u523b\u610f\u53bb\u52a0\u91cd\u8fd9\u4e2a\u7fd8\u820c\u97f3\uff0c\u7279\u522b\u626d\uff0c\u8d85\u7ea7\u522b\u626d\u3002\u201d (\u80fd\u5177\u4f53\u5206\u6790\u95ee\u9898)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u81ea\u8eab\u58f0\u97f3\u6761\u4ef6\uff08\u4e1c\u5317\u53e3\u97f3\u3001\u58f0\u97f3\u4e0b\u6c89\uff09\u548c\u53d1\u97f3\u6280\u5de7\uff08\u5e73\u7fd8\u820c\uff09\u7684\u4e0d\u81ea\u4fe1\uff0c\u6e34\u671b\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u548c\u793e\u7fa4\u5f52\u5c5e\u611f\uff0c\u4ee5\u8bc1\u660e\u81ea\u5df1\u7684\u5b66\u4e60\u4ef7\u503c\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u5c42\u9762\u7684\u7cbe\u51c6\u80af\u5b9a\u4e0e\u8eab\u4efd\u8ba4\u540c**\u3002\u4ed6\u9700\u8981\u88ab\u8ba4\u53ef\u4e3a\u201c\u6709\u6f5c\u529b\u7684\u5b66\u4e60\u8005\u201d\uff0c\u800c\u4e0d\u4ec5\u4ec5\u662f\u201c\u60f3\u8d5a\u94b1\u7684\u5b66\u5458\u201d\u3002\u63d0\u4f9b\u6e05\u6670\u7684\u8fdb\u9636\u8def\u5f84\u548c\u793e\u7fa4\u5185\u7684\u201c\u9ad8\u624b\u201d\u8eab\u4efd\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u52a8\u673a\u4e2d\u7b49\uff0c\u8d44\u6e90\u4e2d\u7b49\uff0c\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u6709\u660e\u786e\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u5173\u6ce8\u786c\u6838\u6280\u672f\u7ec6\u8282\uff0c\u4e3b\u52a8\u7ec3\u4e60\uff0c\u79ef\u6781\u89e3\u51b3\u95ee\u9898\uff0c\u4e0d\u5f20\u626c\u4f46\u6e34\u671b\u88ab\u4e13\u4e1a\u8ba4\u53ef) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u72ec\u7acb\u6027\u5f3a\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u51fa\u5dee\u5bfc\u81f4\u5b66\u4e60\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\uff0c\u65e0\u6cd5\u8ddf\u4e0a\u76f4\u64ad\u548c\u96c6\u4e2d\u7ec3\u4e60\uff0c\u4ea7\u751f\u8fdb\u5ea6\u7126\u8651\u548c\u201c\u6389\u961f\u201d\u611f\u3002** |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u5230\u95ee\u9898\u503e\u5411\u4e8e\u89e3\u51b3\u800c\u975e\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u8bfe\u7a0b\u540e\u671f\u82e5\u65e0\u6cd5\u627e\u5230\u6e05\u6670\u7684\u201c\u7ec3\u65b9\u5411\u201d\u6216\u83b7\u5f97\u63a5\u5355\u673a\u4f1a\uff0c\u53ef\u80fd\u56e0\u76ee\u6807\u611f\u7f3a\u5931\u800c\u4ea7\u751f\u4ef7\u503c\u8d28\u7591\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c8-12\u5468\uff08\u8bfe\u7a0b\u4e2d\u540e\u671f\uff09**\u3002\u5f53\u57fa\u7840\u8bfe\u7a0b\u7ed3\u675f\uff0c\u8fdb\u5165\u81ea\u4e3b\u7ec3\u4e60\u548c\u5bfb\u6c42\u53d8\u73b0\u9636\u6bb5\u65f6\uff0c\u82e5\u7f3a\u4e4f\u660e\u786e\u6307\u5f15\u548c\u6b63\u5411\u53cd\u9988\uff0c\u8ff7\u832b\u611f\u4f1a\u52a0\u5267\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4f9d\u73b2\u59d0\uff0c\u770b\u5230\u4f60\u7ecf\u5e38\u51fa\u5dee\u8fd8\u8fd9\u4e48\u8ba4\u771f\u7814\u7a76\u8bbe\u5907\u3001\u62a0\u53d1\u97f3\u7ec6\u8282\uff0c\u771f\u7684\u5f88\u4f69\u670d\u4f60\u7684\u884c\u52a8\u529b\u3002\u54b1\u4eec\u73ed\u5c31\u7f3a\u4f60\u8fd9\u6837\u80fd\u6c89\u4e0b\u5fc3\u94bb\u7814\u7684\u2018\u6280\u672f\u6d3e\u2019\u3002\u522b\u62c5\u5fc3\u65f6\u95f4\u788e\uff0c\u5f88\u591a\u9ad8\u624b\u90fd\u662f\u5229\u7528\u788e\u7247\u65f6\u95f4\u7ec3\u51fa\u6765\u7684\u3002\u4ee5\u540e\u6709\u4efb\u4f55\u8bbe\u5907\u4e0a\u3001\u53d1\u97f3\u4e0a\u7684\u2018\u786c\u9aa8\u5934\u2019\uff0c\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u5543\u4e0b\u6765\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u91cd\u70b9\u63d0\u4f9b\u8bbe\u5907\u4f7f\u7528\u3001AU\u8f6f\u4ef6\u3001\u53d1\u97f3\u7ea0\u6b63\uff08\u5c24\u5176\u662f\u5e73\u7fd8\u820c\u548c\u53e3\u8154\u72b6\u6001\uff09\u7684\u6df1\u5ea6\u6307\u5bfc\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T2\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a\u3010**\u8fdb\u9636\u6280\u672f\u7b54\u7591\u5305**\u3011\uff08\u4f18\u5148\u54cd\u5e94\u5176\u6280\u672f\u95ee\u9898\uff09\u3001\u3010**\u540c\u9891\u9ad8\u624b\u793e\u7fa4\u94fe\u63a5**\u3011\uff08\u5c06\u5176\u4e0e\u73ed\u4e0a\u5176\u4ed6\u201c\u6280\u672f\u6d41\u201d\u5b66\u5458\u6216\u5f80\u671f\u4f18\u79c0\u5b66\u5458\u5efa\u7acb\u8fde\u63a5\uff0c\u6ee1\u8db3\u5176\u5c0a\u91cd\u4e0e\u5f52\u5c5e\u9700\u6c42\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u53ea\u7ed9\u5176\u704c\u9e21\u6c64\u6216\u7a7a\u6d1e\u9f13\u52b1\uff0c\u4e0d\u89e3\u51b3\u5177\u4f53\u6280\u672f\u95ee\u9898\u30022. \u5c06\u5176\u4e0e\u8ffd\u6c42\u5feb\u901f\u53d8\u73b0\u7684\u5b66\u5458\u6df7\u4e3a\u4e00\u8c08\uff0c\u5ffd\u89c6\u5176\u4e13\u4e1a\u7cbe\u8fdb\u7684\u9700\u6c42\u30023. \u56e0\u5176\u51fa\u5dee\u9891\u7e41\u800c\u964d\u4f4e\u670d\u52a1\u6807\u51c6\u6216\u9884\u671f\uff0c\u5e94\u63d0\u4f9b\u66f4\u7075\u6d3b\u7684\u5f02\u6b65\u652f\u6301\u65b9\u6848\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u63a8\u4ecb\u4e0e**\u6280\u672f\u6df1\u5316\u3001\u8bbe\u5907\u5347\u7ea7\u3001\u9ad8\u9636\u6f14\u64ad\u6280\u5de7**\u76f8\u5173\u7684\u8bfe\u7a0b\u6216\u670d\u52a1\uff0c\u4e25\u7981\u63a8\u4ecb\u7eaf\u201c\u66b4\u5bcc\u201d\u3001\u201c\u901f\u6210\u201d\u7c7b\u4ea7\u54c1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u73ed\u73ed\u6709\u4e2a\u9898\u5916\u8bdd\uff0c\u6211\u8fd9\u6837\u51fa\u5dee\u9891\u7387\uff0c\u7528\u5728\u6709\u58f0\u4e0a\u65f6\u95f4\u592a\u5c11\u4e86\uff0c\u4e2d\u4e66\u4f1a\u6709\u9ebb\u70e6\u5427\u201d **(\u66b4\u9732\u73b0\u5b9e\u987e\u8651\u4e0e\u76ee\u6807\u611f)**\n2. > \u201c\u7136\u540e\u6709\u4e9b\u5e73\u7fd8\uff0c\u6709\u4e9b\u90a3\u4e2a\u7fd8\u820c\u97f3\uff0c\u5176\u5b9e\u6211\u539f\u6765\u53d1\u7684\u662f\u5bf9\u7684\uff0c\u7136\u540e\u7ea0\u6b63\u4ee5\u540e\u5462\uff0c\u5c31\u523b\u610f\u53bb\u52a0\u91cd\u8fd9\u4e2a\u7fd8\u820c\u97f3\uff0c\u7279\u522b\u626d\uff0c\u8d85\u7ea7\u522b\u626d\u3002\u201d **(\u5c55\u73b0\u5bf9\u6280\u672f\u7ec6\u8282\u7684\u6df1\u5ea6\u601d\u8003\u548c\u75db\u82e6\u94bb\u7814)**\n3. > \u201c\u76ee\u524d\u5904\u4e8e\u4e00\u79cd\u4ec0\u4e48\u72b6\u6001\u5462\uff1f...\u6211\u5c31\u611f\u89c9\u73b0\u5728\u6709\u6709\u975e\u5e38\u5927\u7684\u95ee\u9898...\u8fd9\u4e2a\u7ec3\u65b9\u5411\u53bb\u54ea\u513f\u7ec3\uff1f...\u5bf9\u4e8e\u6211\u6765\u8bb2\uff0c\u6211\u73b0\u5728\u5f88\u5e73\u548c\u4e86\uff0c\u4f46\u662f\u8fd9\u4e2a\u7ec3\u65b9\u5411\u53bb\u54ea\u513f\u7ec3\uff1f\u201d **(\u5728\u8ff7\u832b\u4e2d\u4ecd\u4fdd\u6301\u5e73\u548c\uff0c\u5bfb\u6c42\u5177\u4f53\u8def\u5f84\uff0c\u662f\u5178\u578b\u7684T2\u5b9e\u5e72\u5bb6\u56f0\u60d1)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u548c\u6e05\u6670\u7684\u8fdb\u9636\u8def\u5f84**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u6301\u7eed\u3001\u5177\u4f53\u3001\u9ad8\u4ef7\u503c\u7684\u6280\u672f\u6307\u5bfc\uff0c\u5e76\u4e3a\u5176\u5728\u793e\u7fa4\u4e2d\u6811\u7acb\u201c\u6280\u672f\u8fbe\u4eba\u201d\u7684\u9690\u5f62\u8eab\u4efd**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"maslow_need\": \"\u5c0a\u91cd\u5f52\u5c5e\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u8fdb\u9636\u6280\u672f\u7b54\u7591\u5305\"}\n```";
