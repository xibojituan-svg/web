    <script>
        const markdownText = "\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e\u3002\u7f3a\u4e4f\u5e74\u9f84\u3001\u6027\u522b\u3001\u57ce\u5e02\u3001\u804c\u4e1a\u8be6\u60c5\u3001\u6536\u5165\u3001\u5bb6\u5ead\u72b6\u51b5\u3001\u51b3\u7b56\u6743\u3001\u5177\u4f53\u652f\u4ed8\u91d1\u989d\u4e0e\u65b9\u5f0f\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u3001\u6df1\u5c42\u52a8\u673a\u7b49\u5173\u952e\u4fe1\u606f\u3002\n\n# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4f4e\u4fe1\u53f7)**\n    *   **\u8868\u5c42**\uff1a\u53c2\u4e0e\u8bad\u7ec3\u8425\uff0c\u5b8c\u6210\u4f5c\u4e1a\uff0c\u56de\u590d\u9500\u552e\uff0c\u8868\u73b0\u51fa\u57fa\u7840\u914d\u5408\u5ea6\u3002\n    *   **\u6df1\u5c42**\uff1a\u672a\u4e3b\u52a8\u8868\u8fbe\u660e\u786e\u5b66\u4e60\u76ee\u6807\u6216\u804c\u4e1a\u89c4\u5212\u3002\u5bf9\u9500\u552e\u63a8\u8350\u7684\u8d5b\u9053\uff08\u201c1\u548c2\u201d\uff09\u6709\u7b80\u5355\u56de\u5e94\uff0c\u4f46\u672a\u5c55\u73b0\u5f3a\u70c8\u5174\u8da3\u6216\u94bb\u7814\u70ed\u60c5\u3002**\u6838\u5fc3\u52a8\u673a\u6a21\u7cca\uff0c\u53ef\u80fd\u4e3a\u8f7b\u5ea6\u5174\u8da3\u6216\u88ab\u52a8\u5c1d\u8bd5**\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4f4e\u4fe1\u53f7)**\n    *   **\u7ecf\u6d4e**\uff1a**\u5173\u952e\u96f7\u533a\uff1a\u660e\u786e\u8868\u793a\u201c\u652f\u4ed8\u5b9d\u4f59\u989d\u4e0d\u591f\u201d\u652f\u4ed8\u9ad8\u9636\u8bfe\u7a0b\uff0c\u4e14\u201c\u4e0d\u591f\u201d\u652f\u4ed8\u7cbe\u82f1\u8bfe\u7a0b\u3002** \u663e\u793a\u53ef\u81ea\u7531\u652f\u914d\u8d44\u91d1\u975e\u5e38\u6709\u9650\uff0c\u652f\u4ed8\u80fd\u529b\u5f31\u3002\n    *   **\u65f6\u95f4**\uff1a\u81ea\u79f0\u201c\u4e0a\u73ed\u65cf\u201d\uff0c\u4e14\u201c\u4e0a\u73ed\u6ca1\u6709\u65f6\u95f4\u770b\u624b\u673a\u201d\u3002\u8868\u660e\u53ef\u7528\u4e8e\u5b66\u4e60\u7684\u65f6\u95f4\u7d27\u5f20\uff0c\u4e14\u53ef\u80fd\u4e0d\u89c4\u5f8b\u3002\n    *   **\u793e\u4f1a\u652f\u6301**\uff1a\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u6216\u793e\u4f1a\u652f\u6301\u4fe1\u606f\u3002\u51b3\u7b56\u8fc7\u7a0b\u672a\u51fa\u73b0\u4ed6\u4eba\uff0c\u7591\u4f3c\u72ec\u7acb\u51b3\u7b56\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u4f4e\u4fe1\u53f7)**\n    *   **\u575a\u6301\u6027**\uff1a\u80fd\u8ddf\u968f\u8bad\u7ec3\u8425\u8282\u594f\u5b8c\u6210\u57fa\u7840\u4efb\u52a1\uff08\u4ea4\u4f5c\u4e1a\u3001\u770b\u76f4\u64ad\u3001\u56de\u53e3\u4ee4\uff09\uff0c\u4f46\u4e3b\u52a8\u6027\u4e0d\u5f3a\uff0c\u591a\u7531\u9500\u552e\u63a8\u52a8\u3002\n    *   **\u632b\u6298\u53cd\u5e94**\uff1a\u5bf9\u81ea\u6211\u8fdb\u6b65\u611f\u77e5\u6d88\u6781\uff08\u201c\u6211\u611f\u89c9\u6211\u81ea\u5df1\u7684\u72b6\u6001\u597d\u50cf\u6ca1\u6709\u8fdb\u6b65\u201d\uff09\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u5f3a\u70c8\u8d1f\u9762\u60c5\u7eea\u6216\u653e\u5f03\uff0c\u4ec5\u9648\u8ff0\u4e8b\u5b9e\u3002**\u6709\u4e00\u5b9a\u81ea\u6211\u6000\u7591\u503e\u5411**\u3002\n    *   **\u627f\u8bfa\u5ea6**\uff1a\u5728\u8d44\u91d1\u4e0d\u8db3\u7684\u60c5\u51b5\u4e0b\uff0c\u4ecd\u9009\u62e9\u62a5\u540d\u4f4e\u9636\u8bfe\u7a0b\uff082\u4e2a\u6708\u7cbe\u82f1\u7248\uff09\uff0c\u663e\u793a\u51fa\u4e00\u5b9a\u7684\u5c1d\u8bd5\u610f\u613f\uff0c\u4f46**\u652f\u4ed8\u884c\u4e3a\u66b4\u9732\u4e86\u6781\u5f3a\u7684\u7ecf\u6d4e\u7ea6\u675f**\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u5df2\u652f\u4ed8\uff082\u4e2a\u6708\u7cbe\u82f1\u8bfe\u7a0b\uff0c\u4ef7\u683c\u63a8\u65ad\u4e3a3980\u5143\uff09\u3002\u4f46\u652f\u4ed8\u8fc7\u7a0b\u66b4\u9732\u4e25\u91cd\u7ecf\u6d4e\u538b\u529b\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u65e0\u4fe1\u606f\u8868\u660e\u5b58\u5728\u5bb6\u5ead\u51b3\u7b56\u8005\u3002\u7528\u6237\u81ea\u884c\u6c9f\u901a\u5e76\u51b3\u7b56\uff0c**\u63a8\u65ad\u4e3a\u4e2a\u4eba\u51b3\u7b56**\u3002\n*   **\u6b65\u9aa41-4\u5224\u5b9a**\uff1a\n    *   **\u52a8\u673a**\uff1a\u6a21\u7cca\uff0c\u504f\u5411\u5174\u8da3\u63a2\u7d22\u6216\u526f\u4e1a\u5c1d\u8bd5\uff0c\u672a\u8fbe\u201c\u5f3a\u70c8\u6539\u53d8\u201d\u6216\u201c\u804c\u4e1a\u8f6c\u578b\u201d\u7ea7\u522b\u3002\n    *   **\u8d44\u6e90**\uff1a**\u7ecf\u6d4e\u8d44\u6e90\u4e25\u91cd\u4e0d\u8db3**\uff0c\u65f6\u95f4\u8d44\u6e90\u7d27\u5f20\u3002\n    *   **\u884c\u52a8**\uff1a\u88ab\u52a8\u8ddf\u968f\uff0c\u5b8c\u6210\u89c4\u5b9a\u52a8\u4f5c\uff0c\u7f3a\u4e4f\u4e3b\u52a8\u63a2\u7d22\u3002\n    *   **\u5224\u5b9a\u7ed3\u679c**\uff1a**C\u7c7b\uff08\u89c2\u671b\u5c1d\u8bd5\u578b\uff09**\u3002\u7528\u6237\u6709\u521d\u6b65\u610f\u613f\uff0c\u4f46\u6838\u5fc3\u8d44\u6e90\uff08\u8d44\u91d1\uff09\u77ed\u677f\u660e\u663e\uff0c\u52a8\u673a\u4e0d\u5f3a\u70c8\uff0c\u884c\u52a8\u504f\u88ab\u52a8\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b\uff1aT7 \u7ecf\u6d4e\u62ee\u636e\u578b**\n    *   **\u6838\u5fc3\u7279\u5f81**\uff1a\u652f\u4ed8\u80fd\u529b\u662f\u6700\u5927\u74f6\u9888\uff0c\u6d88\u8d39\u51b3\u7b56\u6781\u5ea6\u8c28\u614e\uff0c\u5bf9\u4ef7\u683c\u654f\u611f\u3002\u5b66\u4e60\u52a8\u673a\u5e38\u4e0e\u201c\u589e\u52a0\u6536\u5165\u201d\u3001\u201c\u517c\u804c\u201d\u5f3a\u76f8\u5173\uff0c\u4f46\u53d7\u9650\u4e8e\u73b0\u5b9e\u7ecf\u6d4e\u538b\u529b\u3002\n    *   **\u543b\u5408\u70b9**\uff1a\n        1.  \u660e\u786e\u56e0\u201c\u4f59\u989d\u4e0d\u591f\u201d\u653e\u5f03\u9ad8\u9636\u8bfe\u7a0b\u3002\n        2.  \u63a5\u53d7\u4f4e\u9636\u8bfe\u7a0b\u5e76\u8be2\u95ee\u5347\u7ea7\u53ef\u80fd\u6027\uff0c\u663e\u793a\u5bf9\u6210\u672c\u7684\u7cbe\u7ec6\u8ba1\u7b97\u3002\n        3.  \u52a8\u673a\u4e0e\u201c\u8d5a\u94b1\u65b9\u5f0f\u201d\u3001\u201c\u659c\u6760\u5de5\u79cd\u201d\u7b49\u9500\u552e\u8bdd\u672f\u6709\u56de\u5e94\uff0c\u7b26\u5408\u7ecf\u6d4e\u9a71\u52a8\u7279\u5f81\u3002\n        4.  \u6574\u4f53\u4e92\u52a8\u8f83\u4e3a\u88ab\u52a8\u3001\u7b80\u6d01\uff0c\u53ef\u80fd\u56e0\u7ecf\u6d4e\u538b\u529b\u5bfc\u81f4\u4fe1\u5fc3\u4e0d\u8db3\u6216\u4e0d\u613f\u8fc7\u591a\u6295\u5165\u60c5\u611f\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669\u7b49\u7ea7\uff1a\u9ad8**\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5df2\u8868\u9732\u5bf9\u8fdb\u6b65\u7684\u6d88\u6781\u611f\u77e5\uff08\u201c\u6ca1\u6709\u8fdb\u6b65\u201d\uff09\uff0c\u540e\u7eed\u82e5\u5b66\u4e60\u6548\u679c\u4e0d\u660e\u663e\uff0c\u6781\u6613\u5f15\u53d1\u5931\u671b\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u6781\u9ad8\u98ce\u9669**\u3002**\u652f\u4ed8\u884c\u4e3a\u5df2\u66b4\u9732\u5176\u7ecf\u6d4e\u72b6\u51b5\u7d27\u5f20**\uff0c\u4efb\u4f55\u540e\u7eed\u7684\u751f\u6d3b\u5f00\u652f\u53d8\u52a8\u90fd\u53ef\u80fd\u8feb\u4f7f\u5176\u5bfb\u6c42\u9000\u8d39\u4ee5\u7f13\u89e3\u538b\u529b\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u4e2d\u9ad8\u98ce\u9669**\u3002\u4f5c\u4e3a\u4e0a\u73ed\u65cf\uff0c\u65f6\u95f4\u7d27\u5f20\uff0c\u82e5\u5de5\u4f5c\u6216\u751f\u6d3b\u7e41\u5fd9\uff0c\u6781\u6613\u5bfc\u81f4\u65e0\u6cd5\u8ddf\u8bfe\uff0c\u4ea7\u751f\u201c\u6ca1\u65f6\u95f4\u5b66\u201d\u7684\u9000\u8d39\u7406\u7531\u3002\n    4.  **\u8bfe\u7a0b\u8d28\u91cf\u8d28\u7591**\uff1a\u4e2d\u98ce\u9669\u3002\u76ee\u524d\u672a\u8868\u73b0\uff0c\u4f46\u82e5\u540e\u7eed\u670d\u52a1\u6216\u5185\u5bb9\u4e0e\u5176\u9884\u671f\u4e0d\u7b26\uff0c\u53ef\u80fd\u7ed3\u5408\u7ecf\u6d4e\u538b\u529b\u7206\u53d1\u3002\n    5.  **\u9500\u552e\u8bef\u5bfc**\uff1a\u4f4e\u98ce\u9669\u3002\u8bb0\u5f55\u4e2d\u9500\u552e\u6d41\u7a0b\u6807\u51c6\uff0c\u672a\u53d1\u73b0\u660e\u663e\u5938\u5927\u6216\u627f\u8bfa\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a\u672a\u77e5\u98ce\u9669\u3002\u65e0\u76f8\u5173\u4fe1\u606f\u3002\n    7.  **\u7ade\u54c1\u6bd4\u8f83/\u51b2\u52a8\u6d88\u8d39**\uff1a\u4e2d\u98ce\u9669\u3002\u7528\u6237\u51b3\u7b56\u8fc7\u7a0b\u8f83\u77ed\uff0c\u53ef\u80fd\u5305\u542b\u51b2\u52a8\u6210\u5206\uff0c\u7ecf\u6d4e\u538b\u529b\u4e0b\u66f4\u5bb9\u6613\u540e\u6094\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5408\u89c4\u60c5\u51b5**\uff1a\u9500\u552e\u6d41\u7a0b\u57fa\u672c\u5408\u89c4\uff0c\u4f7f\u7528\u6807\u51c6\u8bdd\u672f\u5f15\u5bfc\uff0c\u63d0\u4f9b\u4f5c\u4e1a\u70b9\u8bc4\uff0c\u672a\u53d1\u73b0\u8fdd\u89c4\u627f\u8bfa\u3002\n*   **\u4f26\u7406\u98ce\u9669\u70b9**\uff1a\n    *   **\u7528\u6237\u660e\u786e\u8868\u8fbe\u7ecf\u6d4e\u56f0\u96be\u540e\uff0c\u4ecd\u5f15\u5bfc\u5176\u62a5\u540d\u4f4e\u9636\u8bfe\u7a0b**\u3002\u867d\u7136\u63d0\u4f9b\u4e86\u9009\u9879\uff0c\u4f46**\u672a\u5145\u5206\u8bc4\u4f30\u8be5\u652f\u51fa\u5bf9\u5176\u751f\u6d3b\u53ef\u80fd\u9020\u6210\u7684\u8d1f\u62c5**\uff0c\u5b58\u5728\u6f5c\u5728\u4f26\u7406\u98ce\u9669\u3002\n    *   \u5bf9\u7528\u6237\u201c\u6ca1\u6709\u8fdb\u6b65\u201d\u7684\u53cd\u9988\uff0c\u4ec5\u7ed9\u4e88\u6280\u5de7\u6027\u5efa\u8bae\uff0c\u672a\u6df1\u5165\u8fdb\u884c\u5fc3\u7406\u5efa\u8bbe\u548c\u671f\u671b\u7ba1\u7406\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u6838\u5fc3\u7b56\u7565**\uff1a**\u98ce\u9669\u9632\u63a7\u4f18\u5148\uff0c\u8f7b\u91cf\u8fd0\u8425\uff0c\u5f3a\u5316\u4ef7\u503c\u611f\u77e5\u4e0e\u60c5\u611f\u652f\u6301**\u3002\n*   **\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u521d\u671f\u5f3a\u5173\u6ce8**\uff1a\u5f00\u8bfe\u521d\u671f\u5bc6\u5207\u8ddf\u8fdb\uff0c\u91cd\u70b9\u89e3\u51b3\u5176\u201c\u65e0\u8fdb\u6b65\u611f\u201d\uff0c\u7ed9\u4e88\u5177\u4f53\u3001\u5fae\u5c0f\u7684\u6b63\u53cd\u9988\uff0c\u5efa\u7acb\u4fe1\u5fc3\u3002\n    2.  **\u7ba1\u7406\u671f\u671b**\uff1a\u660e\u786e\u544a\u77e5\u5b66\u4e60\u66f2\u7ebf\uff0c\u5f3a\u8c03\u57fa\u7840\u79ef\u7d2f\u7684\u91cd\u8981\u6027\uff0c\u964d\u4f4e\u5176\u77ed\u671f\u5185\u5bf9\u201c\u53d8\u73b0\u201d\u7684\u8fc7\u9ad8\u671f\u5f85\u3002\n    3.  **\u65f6\u95f4\u89c4\u5212\u8f85\u52a9**\uff1a\u4e3b\u52a8\u5e2e\u52a9\u5176\u89c4\u5212\u788e\u7247\u5316\u5b66\u4e60\u65f6\u95f4\uff0c\u63d0\u4f9b\u7075\u6d3b\u7684\u5b66\u4e60\u65b9\u6848\u3002\n    4.  **\u60c5\u611f\u94fe\u63a5**\uff1a\u591a\u4f7f\u7528\u9f13\u52b1\u6027\u8bed\u8a00\uff0c\u8ba4\u53ef\u5176\u201c\u4e0a\u73ed\u575a\u6301\u5b66\u4e60\u201d\u7684\u52aa\u529b\uff0c\u5efa\u7acb\u4fe1\u4efb\u5173\u7cfb\u3002\n    5.  **\u8b66\u60d5\u9000\u8d39\u4fe1\u53f7**\uff1a\u5bc6\u5207\u5173\u6ce8\u5176\u63d0\u53ca\u201c\u5fd9\u201d\u3001\u201c\u7d2f\u201d\u3001\u201c\u7ecf\u6d4e\u7d27\u5f20\u201d\u3001\u201c\u6ca1\u6548\u679c\u201d\u7b49\u5173\u952e\u8bcd\uff0c\u63d0\u524d\u4ecb\u5165\u758f\u5bfc\u3002\n*   **\u4ea7\u54c1\u5339\u914d\u5efa\u8bae**\uff1a\n    *   **\u5f53\u524d\u6302\u8f7d**\uff1a2\u4e2a\u6708\u7cbe\u82f1\u7248\u8bfe\u7a0b\uff08\u5df2\u62a5\uff09\u3002\n    *   **\u540e\u7eed\u63a8\u8350**\uff1a**\u4e25\u7981\u77ed\u671f\u5185\u5f3a\u529b\u63a8\u5d07\u9ad8\u9636\u8bfe\u7a0b\u6216\u9644\u52a0\u4ea7\u54c1**\u3002\u5e94\u805a\u7126\u4e8e\u8ba9\u5176\u5145\u5206\u6d88\u5316\u73b0\u6709\u8bfe\u7a0b\u5185\u5bb9\uff0c\u83b7\u5f97\u5b9e\u5728\u7684\u6210\u5c31\u611f\u3002\u4ec5\u5728\u5176\u4e3b\u52a8\u63d0\u51fa\u3001\u4e14\u660e\u663e\u8868\u73b0\u51fa\u5b66\u4e60\u70ed\u60c5\u548c\u8fdb\u6b65\u540e\uff0c\u65b9\u53ef\u8c28\u614e\u63a2\u8ba8\u5347\u7ea7\u53ef\u80fd\uff0c\u5e76\u5fc5\u987b\u518d\u6b21\u786e\u8ba4\u5176\u7ecf\u6d4e\u627f\u53d7\u80fd\u529b\u3002\n\n{\"core_type\": \"T7 \u7ecf\u6d4e\u62ee\u636e\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168/\u5c0a\u91cd\", \"target_product_line\": \"\u7ef4\u6301\u73b0\u67092\u4e2a\u6708\u7cbe\u82f1\u7248\uff0c\u4e25\u7981\u6fc0\u8fdb\u5347\u5355\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u5973\uff08\u6839\u636e\u58f0\u97f3\u9274\u5b9a\u4e3a\u201c\u5fa1\u59d0\u97f3\u201d\u63a8\u65ad\uff09\", \"city\": \"\u672a\u77e5\"}";
