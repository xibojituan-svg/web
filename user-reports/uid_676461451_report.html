u884c\u4e1a\u7684\u5927\u95e8\uff0c\u5927\u5bb6\u90fd\u8fdb\u6765\u4e86\uff0c\u5c31\u624b\u62c9\u624b\u4e00\u8d77\u8d70~\u201d\uff1b\u201c\u7b49\u5927\u5496\u8001\u5e08\u6559\u6211\u4eec\u5c31\u80fd\u8ba9AI\u542c\u8bdd\u4e86\u201d\u3002\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u4e2d]** \u2014 \u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\uff0c\u80fd\u652f\u4ed8\u8bfe\u7a0b\u53ca\u989d\u5916\u8ba4\u8bc1\u8d39\u7528\uff08\u5982399\u5143\u5f55\u97f3\u5e08\u8bc1\uff09\uff0c\u4f46\u9700\u7167\u987e\u5bb6\u5ead\uff0c\u975e\u9ad8\u6d88\u8d39\u4eba\u7fa4\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**[\u4f4e]** \u2014 **\u6838\u5fc3\u77ed\u677f**\u3002\u5168\u804c\u5988\u5988\uff0c\u9700\u7167\u987e\u4e24\u4e2a\u4f4e\u9f84\u5e7c\u513f\uff084\u5c81\u548c2\u5c81\uff09\uff0c\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\uff0c\u5b66\u4e60\u9700\u201c\u62bd\u7a7a\u770b\u4e00\u773c\u7fa4\u91cc\u201d\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u9ad8]** \u2014 \u5bb6\u5ead\u5173\u7cfb\u548c\u8c10\uff0c\u4e08\u592b\u804c\u4e1a\u7a33\u5b9a\uff08\u5f8b\u5e08\uff09\uff0c\u5bf9\u5b66\u4e60\u77e5\u60c5\u4e14\u672a\u8868\u73b0\u51fa\u53cd\u5bf9\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\uff0c\u79ef\u6781\u4e50\u89c2\uff0c\u4e50\u4e8e\u52a9\u4eba\uff0c\u662f\u793e\u7fa4\u4e2d\u7684\u60c5\u7eea\u7a33\u5b9a\u5668\u548c\u652f\u6301\u8005\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5927\u5bb6\u90fd\u662f28\u539f\u5219\uff0c\u4f46\u662f\u6211\u4eec\u65e0\u8bba\u57282\u8fd8\u662f8\u90fd\u53ef\u4ee5\u505a\u81ea\u5df1\u7684\u638c\u8235\u4eba\u201d\uff1b\u201c\u505a\u597d\u81ea\u5df1[\u673a\u667a]\u8ddf\u81ea\u5df1\u6bd4\u8fdb\u6b65\uff0c\u5c31\u53ef\u4ee5\u4e86\u201d\uff1b\u201c\u4e0d\u53bb\u60f3\u8fd9\u4e2a\uff0c\u5c31\u5c3d\u5feb\u4f18\u5316\u6211\u4eec\u7684\u4f5c\u54c1\u201d\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u5f52\u5c5e \u4e0e \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u8ba4\u53ef ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5728\u7e41\u91cd\u80b2\u513f\u751f\u6d3b\u4e2d\uff0c\u5bfb\u6c42\u4e2a\u4eba\u4ef7\u503c\u8ba4\u540c\u548c\u9ad8\u8d28\u91cf\u7684\u6210\u4eba\u793e\u4ea4\u5708\u5c42\uff0c\u6e34\u671b\u88ab\u770b\u89c1\u3001\u88ab\u9700\u8981\u3001\u88ab\u5c0a\u91cd\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u8d4b\u4e88\u5176\u201c\u56e2\u961f\u9886\u8896\u201d\u6216\u201c\u6838\u5fc3\u9aa8\u5e72\u201d\u7684\u8eab\u4efd\u5149\u73af**\uff0c\u8ba9\u5979\u5728\u793e\u7fa4\u4e2d\u83b7\u5f97\u5c0a\u91cd\u3001\u8ba4\u53ef\u548c\u5f52\u5c5e\u611f\uff0c\u4ece\u800c\u62b5\u6d88\u80b2\u513f\u5e26\u6765\u7684\u793e\u4f1a\u8131\u8282\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u9ad8\u52a8\u673a\u3001\u4e2d\u8d44\u6e90\u3001\u9ad8\u5f39\u6027\uff0c\u9ad8\u4ef7\u503c\u6f5c\u529b\u7528\u6237) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T1 \u5708\u517b\u9886\u8896\u578b** (\u793e\u7fa4\u6d3b\u8dc3\uff0c\u4e3b\u52a8\u7ec4\u7ec7\u3001\u9f13\u52b1\u4ed6\u4eba\uff0c\u4eab\u53d7\u5e26\u9886\u56e2\u961f\u548c\u83b7\u5f97\u8ba4\u53ef\u7684\u611f\u89c9) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u5bb6\u5ead\u652f\u6301\u5ea6\u9ad8\uff0c\u98ce\u9669\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u6838\u5fc3\u98ce\u9669**\uff1a\u56e0\u80b2\u513f\u7a81\u53d1\u72b6\u51b5\uff08\u5b69\u5b50\u751f\u75c5\u7b49\uff09\u5bfc\u81f4\u5b66\u4e60\u8fdb\u5ea6\u4e25\u91cd\u6ede\u540e\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u7126\u8651\u548c\u81ea\u8d23\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e50\u4e8e\u89e3\u51b3\u95ee\u9898\u800c\u975e\u62b1\u6028\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u52a8\u673a\u975e\u77ed\u671f\u53d8\u73b0\uff0c\u66f4\u770b\u91cd\u80fd\u529b\u6210\u957f\u548c\u793e\u7fa4\u4ef7\u503c\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u8bfe\u7a0b\u4e2d\u540e\u671f\uff0c\u5f53\u56e2\u961f\u4efb\u52a1\u6216\u4e2a\u4eba\u4f5c\u4e1a\u96be\u5ea6\u4e0e\u5f3a\u5ea6\u63d0\u5347\uff0c\u4e0e\u80b2\u513f\u65f6\u95f4\u51b2\u7a81\u52a0\u5267\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u662d\u662d\uff0c\u770b\u5230\u4f60\u5728\u7fa4\u91cc\u5c31\u50cf\u4e2a\u6696\u5fc3\u5c0f\u592a\u9633\uff0c\u7279\u522b\u80fd\u5e26\u52a8\u5927\u5bb6\u3002\u54b1\u4eec\u73ed\u6b63\u9700\u8981\u4f60\u8fd9\u6837\u6709\u9886\u5bfc\u529b\u7684\u540c\u5b66\uff01\u8003\u8651\u5230\u4f60\u5e26\u4fe9\u5a03\u7279\u522b\u8f9b\u82e6\uff0c\u65f6\u95f4\u6bd4\u8f83\u788e\u7247\u5316\uff0c\u54b1\u4eec\u7684\u8bfe\u7a0b\u8bbe\u8ba1\u548c\u4f5c\u4e1a\u63d0\u4ea4\u90fd\u5f88\u7075\u6d3b\uff0c\u5b8c\u5168\u53ef\u4ee5\u6839\u636e\u4f60\u7684\u8282\u594f\u6765\u3002\u6709\u4efb\u4f55\u65f6\u95f4\u51b2\u7a81\u968f\u65f6\u627e\u6211\uff0c\u6211\u4eec\u4e00\u8d77\u8c03\u6574\uff0c\u5343\u4e07\u522b\u6709\u538b\u529b\u3002\u671f\u5f85\u4f60\u5e26\u7740\u54b1\u4eec\u5c0f\u7ec4\u4e00\u8d77\u51b2\uff01\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\u3011** + **\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u8d4b\u4e88\u5176\u5c0f\u7ec4\u957f\u3001\u73ed\u59d4\u7b49\u89d2\u8272\uff0c\u6ee1\u8db3\u5176\u5c0a\u91cd\u4e0e\u9886\u5bfc\u9700\u6c42\uff1b\u540c\u65f6\u63d0\u4f9b\u624e\u5b9e\u7684\u6280\u80fd\u6307\u5bfc\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\u7684\u7279\u70b9\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u5f39\u6027\u65f6\u95f4\u652f\u6301\u5305\u3011**\uff08\u5982\u5f55\u64ad\u8bfe\u91cd\u70b9\u5207\u7247\u3001\u5f02\u6b65\u7b54\u7591\u4f18\u5148\u6743\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5ffd\u89c6\u5979\u7684\u65f6\u95f4\u56f0\u5883\uff0c\u7528\u50f5\u786c\u7684\u622a\u6b62\u65e5\u671f\u65bd\u538b\uff1b\u5c06\u5979\u89c6\u4e3a\u666e\u901a\u5b66\u5458\uff0c\u4e0d\u8d4b\u4e88\u4efb\u4f55\u7ec4\u7ec7\u89d2\u8272\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u63a8\u4ecb\u9ad8\u9636\u3001\u9ad8\u4ef7\u503c\u7684\u5708\u5c42\u578b\u4ea7\u54c1\uff08\u5982\u79c1\u8463\u4f1a\u3001\u7ebf\u4e0b\u6e38\u5b66\uff09\uff0c\u4f46\u9700\u660e\u786e\u5176\u65f6\u95f4\u6295\u5165\u8981\u6c42\uff0c\u907f\u514d\u9020\u6210\u538b\u529b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u540c\u5fd7\u4eec\uff0c\u6211\u4eec\u8fdb50\u5f3a\u4e86...\u8f9b\u82e6\u4e86\u5404\u4f4d\u4f19\u4f34\u4eec\uff0c\u5927\u5bb6\u4e00\u8d77\u52aa\u529b\u7684\u6210\u679c\u201d **(T1\u5708\u517b\u9886\u8896\uff1a\u56e2\u961f\u8363\u8a89\u611f\u4e0e\u7ec4\u7ec7\u8005\u5fc3\u6001)**\n2. > \u201c\u6211\u4e09\u5e74\u751f\u4fe9[\u82e6\u6da9]...\u62bd\u7a7a\u770b\u4e00\u773c\u7fa4\u91cc\u201d **(\u8d44\u6e90\u5e95\u5ea7\u77ed\u677f\uff1a\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316)**\n3. > \u201c\u5927\u5bb6\u90fd\u662f28\u539f\u5219\uff0c\u4f46\u662f\u6211\u4eec\u65e0\u8bba\u57282\u8fd8\u662f8\u90fd\u53ef\u4ee5\u505a\u81ea\u5df1\u7684\u638c\u8235\u4eba\u201d **(\u9ad8\u5fc3\u7406\u5f39\u6027\uff1a\u79ef\u6781\u81ea\u4e3b\uff0c\u81ea\u6211\u6fc0\u52b1)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T1\u5708\u517b\u9886\u8896\u578b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u80b2\u513f\u751f\u6d3b\u4e2d\u91cd\u5efa\u4e2a\u4eba\u793e\u4f1a\u4ef7\u503c\u4e0e\u5c0a\u91cd\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u8d4b\u4e88\u5176\u793e\u7fa4\u9886\u5bfc\u89d2\u8272\uff0c\u5e76\u63d0\u4f9b\u6781\u5ea6\u7075\u6d3b\u7684\u65f6\u95f4\u652f\u6301\u3011**\u3002\n\n```json\n{\"core_type\": \"T1 \u5708\u517b\u9886\u8896\u578b\", \"maslow_need\": \"\u793e\u4ea4\u5f52\u5c5e\u4e0e\u5c0a\u91cd\u8ba4\u53ef\", \"risk_level\": \"\u4f4e\", \"target_product_line\": \"\u5708\u5c42\u5408\u4f19\u4eba\u7ebf+\u786c\u6838\u5b9e\u5e72\u7ebf+\u5f39\u6027\u65f6\u95f4\u652f\u6301\u5305\"}\n```";
