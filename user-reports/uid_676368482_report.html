    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: \u4e2d\u7b49\u3002\u7528\u6237\u4ece\u201c\u521b\u4f5c\u8425\u201d\u5347\u9636\u81f3\u201c\u8fdb\u9636\u8425\u201d\uff0c\u5e76\u4e3b\u52a8\u7eed\u62a5\u201cAI\u6f2b\u5267\u201d\u8bfe\u7a0b\uff0c\u663e\u793a\u6301\u7eed\u5b66\u4e60\u610f\u613f\u3002\u4f46\u5b66\u4e60\u884c\u4e3a\u88ab\u52a8\uff08\u591a\u6b21\u9519\u8fc7\u76f4\u64ad\u3001\u4f5c\u4e1a\u6ede\u540e\uff09\uff0c\u4e14\u5bf9\u53d8\u73b0\uff08\u5546\u5355\uff09\u6709\u660e\u786e\u671f\u671b\uff08\u201c\u5546\u5355\u81ea\u5df1\u505a\u8fc7\u4e0d\u4e86\uff0c\u6709\u70b9\u96be\u5ea6\u201d\uff09\uff0c\u52a8\u673a\u4e2d**\u53d8\u73b0\u9a71\u52a8**\u4e0e**\u5174\u8da3/\u6210\u957f\u9a71\u52a8**\u5e76\u5b58\uff0c\u7eaf\u5ea6\u4e2d\u7b49\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: \u4e2d\u7b49\u504f\u4f4e\u3002\u7528\u6237\u6709\u5168\u804c\u5de5\u4f5c\uff08\u201c\u8fb9\u5de5\u4f5c\u8fb9\u5e72\u201d\uff09\uff0c\u65f6\u95f4\u8d44\u6e90\u7d27\u5f20\u662f\u4e3b\u8981\u5236\u7ea6\uff08\u201c\u4eca\u5929\u6709\u4e8b\u6765\u4e0d\u53ca\u53c2\u52a0\u4e86\u201d\u3001\u201c\u8fd8\u5728\u8d70\u4eb2\u621a\u201d\u3001\u201c\u4e00\u76f4\u6ca1\u6709\u65f6\u95f4\u505a\u201d\uff09\u3002\u7ecf\u6d4e\u8d44\u6e90\u5c1a\u53ef\uff08\u80fd\u652f\u4ed8\u8fdb\u9636\u8bfe\u7a0b\uff09\u3002**\u65f6\u95f4\u8d44\u6e90\u662f\u660e\u663e\u77ed\u677f**\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: \u4e2d\u7b49\u3002\u9762\u5bf9\u5b66\u4e60\u56f0\u96be\uff08\u4f5c\u4e1a\u3001\u5546\u5355\u672a\u8fc7\uff09\u65f6\uff0c\u6001\u5ea6\u5e73\u548c\uff08\u4f7f\u7528[\u6342\u8138]\u8868\u60c5\uff09\uff0c\u672a\u8868\u73b0\u51fa\u660e\u663e\u7126\u8651\u6216\u653e\u5f03\uff0c\u80fd\u4e3b\u52a8\u4e0e\u73ed\u73ed\u6c9f\u901a\u5ef6\u671f\u3002\u4f46\u884c\u52a8\u529b\u504f\u5f31\uff0c\u4f9d\u8d56\u5916\u90e8\u63d0\u9192\u548c\u5bbd\u677e\u89c4\u5219\uff0c**\u97e7\u6027\u4e00\u822c\uff0c\u6267\u884c\u529b\u4e0d\u8db3**\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u5df2\u652f\u4ed8\u201cAIGC\u8fdb\u9636\u8425\u201d\u53ca\u540e\u7eed\u201cAI\u6f2b\u5267\u201d\u8bfe\u7a0b\u8d39\u7528\uff0c\u652f\u4ed8\u884c\u4e3a\u660e\u786e\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u65e0\u4fe1\u606f\u8868\u660e\u5b58\u5728\u5bb6\u5ead\u51b3\u7b56\u8005\uff0c\u7528\u6237\u4e3a\u81ea\u4e3b\u51b3\u7b56\u3002\n*   **\u6b65\u9aa41\uff1a\u52a8\u673a\u7eaf\u5ea6 (M)**\uff1aM2\uff08\u4e2d\u7b49\uff09\u3002\u6709\u6301\u7eed\u5b66\u4e60\u884c\u4e3a\uff0c\u4f46\u53d8\u73b0\u671f\u671b\u660e\u786e\uff0c\u5b66\u4e60\u6295\u5165\u5ea6\u4e0d\u8db3\u3002\n*   **\u6b65\u9aa42\uff1a\u8d44\u6e90\u5e95\u5ea7 (R)**\uff1aR2\uff08\u4e2d\u7b49\u504f\u4f4e\uff09\u3002\u7ecf\u6d4e\u8d44\u6e90\u5c1a\u53ef\uff0c\u4f46**\u65f6\u95f4\u8d44\u6e90\u4e25\u91cd\u4e0d\u8db3**\uff0c\u662f\u6838\u5fc3\u5236\u7ea6\u3002\n*   **\u6b65\u9aa43\uff1a\u5fc3\u7406\u5f39\u6027 (E)**\uff1aE2\uff08\u4e2d\u7b49\uff09\u3002\u80fd\u5e73\u548c\u5e94\u5bf9\u632b\u6298\uff0c\u4f46\u7f3a\u4e4f\u4e3b\u52a8\u653b\u575a\u548c\u9ad8\u6548\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u3002\n*   **\u5224\u5b9a\u7ed3\u679c**\uff1a**B\u7c7b\u7528\u6237 (M2, R2, E2)**\u3002\u6709\u5b66\u4e60\u610f\u613f\u548c\u652f\u4ed8\u80fd\u529b\uff0c\u4f46\u53d7\u9650\u4e8e\u65f6\u95f4\u4e0e\u6267\u884c\u529b\uff0c\u5c5e\u4e8e\u201c**\u610f\u613f\u5c1a\u53ef\u4f46\u884c\u52a8\u529b\u4e0d\u8db3\u7684\u5fd9\u788c\u5728\u804c\u8005**\u201d\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b**\uff1a**T5 \u89c2\u671b\u5c1d\u9c9c\u8005**\u3002\u7279\u5f81\u9ad8\u5ea6\u543b\u5408\uff1a\u88ab\u65b0\u6982\u5ff5\uff08AI\u6f2b\u5267\uff09\u5438\u5f15\u800c\u7eed\u8d39\uff0c\u5b66\u4e60\u8fc7\u7a0b\u4ee5\u201c\u5b8c\u6210\u201d\u4e3a\u5bfc\u5411\u800c\u975e\u201c\u7cbe\u901a\u201d\uff0c\u6295\u5165\u5ea6\u968f\u8bfe\u7a0b\u63a8\u8fdb\u9012\u51cf\uff0c\u5bf9\u53d8\u73b0\u7ed3\u679c\u6709\u671f\u5f85\u4f46\u884c\u52a8\u8ddf\u4e0d\u4e0a\u3002\n*   **\u6b21\u8981\u7279\u5f81**\uff1a\u517c\u5177\u90e8\u5206 **T4 \u7406\u6027\u52a1\u5b9e\u6d3e** \u7279\u5f81\uff08\u5173\u6ce8\u8d60\u8bfe\u3001\u798f\u5229\u7b49\u5b9e\u9645\u5229\u76ca\uff09\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669\u7b49\u7ea7**\uff1a**\u4e2d**\u3002\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**\uff1a**\u9ad8\u98ce\u9669**\u3002\u7528\u6237\u5df2\u8868\u8fbe\u5546\u5355\u201c\u505a\u4e0d\u8fc7\uff0c\u6709\u70b9\u96be\u5ea6\u201d\uff0c\u82e5\u540e\u7eed\u8bfe\u7a0b\u4ecd\u65e0\u6cd5\u52a9\u5176\u83b7\u5f97\u5b9e\u8d28\u6027\u6210\u679c\uff08\u5982\u63a5\u5355\uff09\uff0c\u662f\u6838\u5fc3\u9000\u8d39\u8bf1\u56e0\u3002\n    2.  **\u65f6\u95f4\u7cbe\u529b\u4e0d\u8db3**\uff1a**\u9ad8\u98ce\u9669**\u3002\u5386\u53f2\u8bb0\u5f55\u5df2\u591a\u6b21\u56e0\u201c\u5fd9\u201d\u7f3a\u5e2d\u76f4\u64ad\u3001\u5ef6\u8fdf\u4f5c\u4e1a\uff0c\u65b0\u8bfe\u7a0b\u5f3a\u5ea6\u82e5\u52a0\u5927\uff0c\u6781\u6613\u56e0\u65f6\u95f4\u51b2\u7a81\u5bfc\u81f4\u5b8c\u8bfe\u7387\u4f4e\u3002\n    3.  **\u8bfe\u7a0b\u8d28\u91cf\u5f02\u8bae**\uff1a\u4f4e\u98ce\u9669\u3002\u6682\u65e0\u8ff9\u8c61\u3002\n    4.  **\u9500\u552e\u627f\u8bfa\u672a\u5151\u73b0**\uff1a\u4f4e\u98ce\u9669\u3002\u73ed\u73ed\u6c9f\u901a\u4ee5\u9f13\u52b1\u548c\u670d\u52a1\u4e3a\u4e3b\uff0c\u65e0\u8fc7\u5ea6\u627f\u8bfa\u3002\n    5.  **\u5bb6\u5ead/\u7ecf\u6d4e\u538b\u529b**\uff1a\u4f4e\u98ce\u9669\u3002\u6682\u65e0\u8ff9\u8c61\u3002\n    6.  **\u7ade\u54c1/\u66ff\u4ee3\u65b9\u6848**\uff1a\u4f4e\u98ce\u9669\u3002\u6682\u65e0\u8ff9\u8c61\u3002\n    7.  **\u670d\u52a1\u4f53\u9a8c\u4e0d\u4f73**\uff1a\u4f4e\u98ce\u9669\u3002\u7528\u6237\u5bf9\u73ed\u73ed\u670d\u52a1\u6001\u5ea6\u6ee1\u610f\uff08\u591a\u6b21\u611f\u8c22\uff09\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u65e0\u91cd\u5927\u4f26\u7406\u98ce\u9669**\u3002\u9500\u552e\u8fc7\u7a0b\u672a\u53d1\u73b0\u865a\u5047\u627f\u8bfa\u3001\u5236\u9020\u7126\u8651\u3001\u8d2c\u4f4e\u7528\u6237\u7b49\u884c\u4e3a\u3002\n*   **\u5408\u89c4\u6027\u63d0\u793a**\uff1a\u73ed\u73ed\u5728\u7eed\u62a5\u8f6c\u5316\u65f6\uff0c\u4f7f\u7528\u4e86\u201c\u8d60\u8bfe\u201d\u3001\u201c\u798f\u5229\u201d\u3001\u201c\u5546\u5355\u673a\u4f1a\u201d\u7b49\u8425\u9500\u624b\u6bb5\uff0c\u5c5e\u4e8e\u5e38\u89c4\u64cd\u4f5c\u3002\u4f46\u9700\u5173\u6ce8\u5bf9\u7528\u6237\u201c\u53d8\u73b0\u201d\u671f\u671b\u7684\u7ba1\u7406\uff0c\u907f\u514d\u5176\u4ea7\u751f\u4e0d\u5207\u5b9e\u9645\u7684\u5e7b\u60f3\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**\uff1a**\u504f\u5dee**\u3002\u7528\u6237\u65f6\u95f4\u8d44\u6e90\u4e0e\u8bfe\u7a0b\u6240\u9700\u7684\u6301\u7eed\u3001\u9ad8\u5f3a\u5ea6\u6295\u5165\u4e0d\u5339\u914d\u3002\u5176\u201c\u53d8\u73b0\u201d\u8bc9\u6c42\u4e0e\u8bfe\u7a0b\u63d0\u4f9b\u7684\u201c\u6280\u80fd\u6559\u5b66\u201d\u6838\u5fc3\u4ef7\u503c\u5b58\u5728\u9884\u671f\u5dee\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**\u9996\u5468\u91cd\u70b9\u6c9f\u901a\u65f6\u95f4\u89c4\u5212\u4e0e\u53d8\u73b0\u9884\u671f**\u3002\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9884\u671f\u7ba1\u7406**\uff1a\u5728\u65b0\u8bfe\u7a0b\u5f00\u59cb\u524d\uff0c\u5fc5\u987b\u8fdb\u884c\u4e00\u5bf9\u4e00\u6c9f\u901a\uff0c\u660e\u786e\u544a\u77e5\u8bfe\u7a0b\u7684\u5b66\u4e60\u5f3a\u5ea6\u3001\u65f6\u95f4\u8981\u6c42\uff0c\u5e76**\u6821\u6b63\u5176\u53d8\u73b0\u9884\u671f**\uff0c\u5f3a\u8c03\u6280\u80fd\u79ef\u7d2f\u4e0e\u4f5c\u54c1\u6253\u78e8\u7684\u957f\u671f\u6027\u3002\n    2.  **\u65f6\u95f4\u89c4\u5212\u8f85\u52a9**\uff1a\u5e2e\u52a9\u7528\u6237\u5236\u5b9a\u5207\u5b9e\u53ef\u884c\u7684\u6bcf\u5468\u5b66\u4e60\u8ba1\u5212\uff0c\u5f3a\u8c03\u5229\u7528\u788e\u7247\u65f6\u95f4\u770b\u56de\u653e\u3001\u5206\u9636\u6bb5\u5b8c\u6210\u4f5c\u4e1a\u3002\n    3.  **\u8fc7\u7a0b\u6fc0\u52b1**\uff1a\u91cd\u70b9\u5173\u6ce8\u5176\u4f5c\u4e1a\u63d0\u4ea4\u7684\u53ca\u65f6\u6027\uff0c\u8bbe\u7acb\u5fae\u76ee\u6807\uff0c\u53ca\u65f6\u7ed9\u4e88\u6b63\u5411\u53cd\u9988\uff0c\u9632\u6b62\u56e0\u62d6\u5ef6\u5bfc\u81f4\u79ef\u538b\u548c\u653e\u5f03\u3002\n    4.  **\u98ce\u9669\u76d1\u63a7**\uff1a\u5bc6\u5207\u8ddf\u8e2a\u5176\u5728\u65b0\u8bfe\u7a0b\u524d\u4e24\u5468\u7684\u5b8c\u8bfe\u4e0e\u4f5c\u4e1a\u63d0\u4ea4\u60c5\u51b5\uff0c\u4e00\u65e6\u51fa\u73b0\u4e25\u91cd\u6ede\u540e\uff0c\u9700\u7acb\u5373\u4ecb\u5165\uff0c\u4e86\u89e3\u5177\u4f53\u56f0\u96be\uff0c\u5fc5\u8981\u65f6\u5f15\u5bfc\u5176\u8c03\u6574\u5b66\u4e60\u8282\u594f\u6216\u8003\u8651\u5ef6\u671f\u3002\n\n{\"core_type\": \"T5 \u89c2\u671b\u5c1d\u9c9c\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u9996\u5468\u6821\u6b63\u53d8\u73b0\u9884\u671f\u4e0e\u65f6\u95f4\u89c4\u5212\"}";
