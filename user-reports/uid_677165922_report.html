        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677165922 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5f90\u8389\u6021\uff08\u9500\u552e\uff09\uff0c\u5b54\u4ee4\u5a77\uff08\u73ed\u4e3b\u4efb\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u9ad8\u9636\u8bfe\u7a0b\uff0c\u4ef7\u683c7380\u5143 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\uff0c\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u79f0\u201c\u6bcf\u5929\u7a7a\u95f2\u7684\u65f6\u95f4\u6bb5:2-4\u70b9\u201d\uff0c\u51712\u5c0f\u65f6\uff0c\u4e14\u201c\u665a\u4e0a\u5728\u7ed9\u5a03\u505a\u996d\uff0c\u5fd9\u8d77\u6765\u4f1a\u9519\u8fc7\u4e00\u5c0f\u4f1a\u201d\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\uff0c\u672a\u63d0\u53ca\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931**\u3002\u5bf9\u8bdd\u4e3b\u8981\u7531\u9500\u552e\u63a8\u52a8\uff0c\u7528\u6237\u4e3b\u52a8\u4fe1\u606f\u6781\u5c11\uff0c\u4ec5\u56de\u7b54\u4e86\u57fa\u7840\u95ee\u5377\uff0c\u52a8\u673a\u548c\u8d44\u6e90\u4fe1\u606f\u5355\u8584\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b07\u4f4e\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u7eaf\u4e3a\u51e0\u5929\u5185\u63d0\u73b0\u4fdd\u5e95\u800c\u6765(\u4f4e\u6781\u5371)**\u3002\u7528\u6237\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u3001\u6280\u80fd\u63d0\u5347\u6beb\u65e0\u5174\u8da3\uff0c\u6240\u6709\u56de\u7b54\u5747\u6307\u5411\u201c\u8d5a\u94b1\u201d\u3001\u201c\u8d5a\u94b1\u751f\u6d3b\u201d\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u3010\u9009\u62e9\u6709\u58f0\u5b66\u4e60\u7684\u539f\u56e0\u3011: \u8d5a\u94b1\u201d > \u201c\u3010\u53c2\u52a0\u8bad\u7ec3\u8425\u7684\u5c0f\u76ee\u6807\u3011\u901a\u8fc75\u5929\u5b66\u4e60\uff0c\u60f3\u5f97\u5230\u4ec0\u4e48? \u8d5a\u94b1\u751f\u6d3b\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b07\u4f4e\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u7ecf\u6d4e\u72b6\u51b5\uff0c\u4f46**\u65e0\u4e1a\u72b6\u6001**\u662f\u9ad8\u98ce\u9669\u4fe1\u53f7\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u2b07\u4f4e** \u2014 \u6bcf\u65e5\u4ec52\u5c0f\u65f6\uff08\u4e0b\u53482-4\u70b9\uff09\uff0c\u4e14\u9700\u517c\u987e\u5bb6\u5ead\uff08\u7ed9\u5a03\u505a\u996d\uff09\uff0c\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\u4e14\u4e0d\u56fa\u5b9a\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\uff0c\u4f46\u9700\u7167\u987e\u5b69\u5b50\uff0c\u53ef\u80fd\u9762\u4e34\u5bb6\u5ead\u8d23\u4efb\u4e0e\u5b66\u4e60\u7684\u51b2\u7a81\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u5728\u56e0\u7cfb\u7edf\u901a\u77e5\u95ee\u9898\u9519\u8fc7\u76f4\u64ad\u540e\uff0c\u8868\u73b0\u51fa\u660e\u663e\u7684**\u7126\u8651\u3001\u4e0d\u4fe1\u4efb\u548c\u8f7b\u5fae\u5bf9\u6297\u60c5\u7eea**\uff08\u201c\u6240\u4ee5\u54b1\u4fe9\u804a\u4e86\u4e2a\u5bc2\u5bde\u201d\uff09\uff0c\u9700\u8981\u9500\u552e\u53cd\u590d\u89e3\u91ca\u548c\u5b89\u629a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5927\u54e5\u3002\u6211\u8bf4\u4e86\u597d\u51e0\u6b21\u4e86\u3002\u6211\u8fd9\u6ca1\u6709\u7cfb\u7edf\u901a\u77e5\uff0c\u4e5f\u6ca1\u6709\u6536\u5230\u76f4\u64ad\u7684\u94fe\u63a5\uff0c\u5230\u73b0\u5728\u6211\u90fd\u6ca1\u6709\u770b\u5230\u76f4\u64ad\u7684\u94fe\u63a5\u3002\u4e0d\u662f\u6211\u4e0d\u60f3\u4e0a\u554a\u3002\u201d > \u201c\u9ebb\u70e6\u4f60\u770b\u770b\u6211\u624b\u673a\u7684\u8bb0\u5f55\u3002\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e00\u5c42\uff1a\u751f\u5b58\u5b89\u5168**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u65e0\u4e1a\u72b6\u6001\u4e0b\u7684\u751f\u5b58\u7126\u8651**\u3002\u5176\u5b66\u4e60\u52a8\u673a\u5b8c\u5168\u6e90\u4e8e\u201c\u8d5a\u94b1\u751f\u6d3b\u201d\uff0c\u5c5e\u4e8e\u6700\u5e95\u5c42\u7684\u751f\u5b58\u9a71\u52a8\uff0c\u800c\u975e\u5174\u8da3\u6216\u804c\u4e1a\u53d1\u5c55\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u9632\u62a4\u76fe\u5f0f\u7684\u9000\u8d39\u901a\u9053\u4e0e\u6781\u81f4\u7684\u5b89\u629a**\u3002\u4ed6\u9700\u8981\u88ab\u53cd\u590d\u4fdd\u8bc1\u201c\u4e0d\u4f1a\u767d\u82b1\u94b1\u201d\uff0c\u4efb\u4f55\u5b66\u4e60\u632b\u6298\u6216\u6d41\u7a0b\u4e0d\u7545\u90fd\u53ef\u80fd\u88ab\u5176\u89e3\u8bfb\u4e3a\u201c\u9a97\u5c40\u201d\uff0c\u4ece\u800c\u5f15\u7206\u9000\u8d39\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udd34D \u7c7b** (\u9ad8\u98ce\u9669\u7194\u65ad\u533a) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u6df7\u5408 **T4 \u641e\u94b1\u7ed3\u679c\u578b** \u7684\u6781\u7aef\u751f\u5b58\u7126\u8651\u7279\u5f81) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a**\u26a0\ufe0f \u9ad8\u5ea6\u7591\u4f3c\u89e6\u53d1 D \u7c7b\u7194\u65ad\u7ea2\u7ebf\uff01**\n- **\u89e6\u53d1\u56e0\u7531**\uff1a**\u65e0\u4e1a\u72b6\u6001 + \u6781\u7aef\u751f\u5b58\u7126\u8651\u9a71\u52a8\u7684\u201c\u8d5a\u94b1\u751f\u6d3b\u201d\u52a8\u673a**\u3002\u8fd9\u662f\u5178\u578b\u7684\u201c\u6551\u547d\u94b1\u201d\u5fc3\u6001\uff0c\u6781\u6613\u56e0\u77ed\u671f\u65e0\u6cd5\u53d8\u73b0\u800c\u4ea7\u751f\u88ab\u6b3a\u9a97\u611f\uff0c\u5f15\u53d1\u6fc0\u70c8\u6295\u8bc9\u6216\u9000\u8d39\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u82e5\u5bb6\u4eba\u4e0d\u77e5\u60c5\u6216\u53cd\u5bf9\u5176\u7528\u5bb6\u5ead\u5f00\u652f\u62a5\u540d\uff0c\u98ce\u9669\u9661\u589e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | \u6bcf\u65e5\u4ec52\u5c0f\u65f6\u4e14\u4e0d\u56fa\u5b9a\uff0c\u6781\u6613\u56e0\u5bb6\u52a1\uff08\u5982\u5e26\u5a03\uff09\u4e2d\u65ad\u5b66\u4e60\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u632b\u8d25\u611f\u548c\u81ea\u8d23\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u5df2\u521d\u6b65\u663e\u73b0**\u3002\u5bf9\u6280\u672f\u95ee\u9898\uff08\u6536\u4e0d\u5230\u94fe\u63a5\uff09\u53cd\u5e94\u6fc0\u70c8\uff0c\u5c06\u8d23\u4efb\u5916\u63a8\u3002\u4e00\u65e6\u5b66\u4e60\u9047\u5230\u7b2c\u4e00\u4e2a\u5b9e\u64cd\u56f0\u96be\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u3001\u5f55\u97f3\u6548\u679c\u5dee\uff09\uff0c\u4f1a\u7acb\u523b\u5d29\u6e83\u653e\u5f03\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u6781\u9ad8** | \u5f00\u8425\u7b2c\u4e00\u5468\u82e5\u672a\u770b\u5230\u201c\u8d5a\u94b1\u201d\u7684\u660e\u786e\u8def\u5f84\u6216\u63a5\u5230\u5355\uff0c\u4f1a\u7acb\u523b\u8d28\u7591\u8bfe\u7a0b\u4ef7\u503c\uff0c\u8981\u6c42\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e48\u5c0f\u65f6\u5185\u81f3\u7b2c\u4e00\u5468\u4f5c\u4e1a\u63d0\u4ea4\u671f**\u3002\u5f53\u4ed6\u53d1\u73b0\u5b66\u4e60\u9700\u8981\u6295\u5165\u65f6\u95f4\u7cbe\u529b\u800c\u975e\u201c\u76f4\u63a5\u8d5a\u94b1\u201d\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cX\u54e5/\u59d0\uff0c\u770b\u5230\u60a8\u62a5\u540d\u4e86\uff0c\u7279\u522b\u7406\u89e3\u60a8\u60f3\u5c3d\u5feb\u901a\u8fc7\u65b0\u6280\u80fd\u6539\u5584\u751f\u6d3b\u7684\u5fc3\u60c5\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\uff0c\u7b2c\u4e00\u6b65\u662f\u5e2e\u60a8\u628a\u57fa\u7840\u6253\u7262\uff0c\u5c31\u50cf\u76d6\u623f\u5b50\u5148\u6253\u5730\u57fa\uff0c\u8fd9\u6837\u540e\u9762\u63a5\u5355\u624d\u7a33\u5f53\u3001\u4ef7\u683c\u624d\u9ad8\u3002\u8fc7\u7a0b\u4e2d\u6709\u4efb\u4f55\u4e00\u70b9\u89c9\u5f97\u5361\u4f4f\u4e86\u3001\u6216\u8005\u65f6\u95f4\u5b89\u6392\u4e0d\u8fc7\u6765\uff0c\u60a8\u968f\u65f6\u558a\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u60f3\u529e\u6cd5\uff0c\u5343\u4e07\u522b\u81ea\u5df1\u618b\u7740\u3002\u6211\u4eec\u7684\u76ee\u6807\u662f\u4e00\u81f4\u7684\uff1a\u8ba9\u60a8\u5b66\u6709\u6240\u6210\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\u3011**\u3002\u6838\u5fc3\u76ee\u6807\u662f\u7a33\u4f4f\u60c5\u7eea\uff0c\u5b8c\u6210\u57fa\u7840\u5b66\u4e60\uff0c\u964d\u4f4e\u671f\u671b\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u6ee1\u914d **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u6bcf\u65e5\u6253\u5361\u53ea\u9700\u4e00\u53e5\u8bed\u97f3\uff0c\u7ed9\u4e88\u6781\u5ea6\u5938\u5f20\u7684\u8d5e\u7f8e\uff08\u5982\u201c\u60a8\u8fd9\u4e2a\u58f0\u97f3\u6761\u4ef6\u592a\u6709\u6f5c\u529b\u4e86\uff01\u201d\uff09\u3002**\u5265\u79bb\u4e00\u5207\u589e\u52a0\u632b\u8d25\u611f\u7684\u4e8b\u7269**\uff0c\u5982\u590d\u6742\u8f6f\u4ef6\u3001\u9ad8\u96be\u5ea6\u4f5c\u4e1a\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. \u7edd\u4e0d\u5bf9\u4ed6\u753b\u4efb\u4f55\u201c\u5feb\u901f\u8d5a\u94b1\u201d\u7684\u5927\u997c\uff0c\u660e\u786e\u544a\u77e5\u5b66\u4e60\u5468\u671f\u548c\u53d8\u73b0\u95e8\u69db\u3002\n    2. \u7edd\u4e0d\u4e0a\u9ad8\u96be\u5ea6\u4f5c\u4e1a\u6216\u590d\u6742\u4efb\u52a1\u65bd\u538b\u3002\n    3. \u7edd\u4e0d\u6279\u8bc4\u6216\u6307\u51fa\u5176\u4f5c\u4e1a\u4e2d\u7684\u590d\u6742\u95ee\u9898\uff0c\u53ea\u505a\u6700\u57fa\u7840\u7684\u6b63\u9762\u9f13\u52b1\u3002\n    4. \u907f\u514d\u4f7f\u7528\u7fa4\u5185\u5bf9\u6bd4\u3001\u6392\u540d\u7b49\u53ef\u80fd\u6fc0\u53d1\u5176\u7126\u8651\u7684\u8fd0\u8425\u624b\u6bb5\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5347\u5355**\u3002\u5f53\u524d\u9636\u6bb5\u552f\u4e00\u76ee\u6807\u662f\u5e73\u7a33\u4ea4\u4ed8\uff0c\u9632\u6b62\u5ba2\u8bc9\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u3010\u9009\u62e9\u6709\u58f0\u5b66\u4e60\u7684\u539f\u56e0\u3011: \u8d5a\u94b1\u201d \n2. > \u201c\u3010\u53c2\u52a0\u8bad\u7ec3\u8425\u7684\u5c0f\u76ee\u6807\u3011\u901a\u8fc75\u5929\u5b66\u4e60\uff0c\u60f3\u5f97\u5230\u4ec0\u4e48? \u8d5a\u94b1\u751f\u6d3b\u201d\n3. > \u201c\u5927\u54e5\u3002\u6211\u8bf4\u4e86\u597d\u51e0\u6b21\u4e86\u3002\u6211\u8fd9\u6ca1\u6709\u7cfb\u7edf\u901a\u77e5\uff0c\u4e5f\u6ca1\u6709\u6536\u5230\u76f4\u64ad\u7684\u94fe\u63a5\uff0c\u5230\u73b0\u5728\u6211\u90fd\u6ca1\u6709\u770b\u5230\u76f4\u64ad\u7684\u94fe\u63a5\u3002\u4e0d\u662f\u6211\u4e0d\u60f3\u4e0a\u554a\u3002\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6\u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u751f\u5b58\u5b89\u5168\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u6781\u81f4\u60c5\u7eea\u5b89\u629a\u4e0e\u964d\u4f4e\u9884\u671f\uff0c\u5c06\u5176\u5f15\u5bfc\u81f3\u7597\u6108\u966a\u4f34\u7ebf\uff0c\u4e25\u9632\u4efb\u4f55\u5b66\u4e60\u632b\u6298\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"maslow_need\": \"\u751f\u5b58\u5b89\u5168\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
