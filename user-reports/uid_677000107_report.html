        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677000107 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-10 \u81f3 2026-03-13 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u8c46\u76ae\u571f\u53f8(\u738b\u5174\u6885) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u63a8\u6d4b\u4e3a\u201c\u6500\u767b\u8ba1\u5212\u201d\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\uff08\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u652f\u4ed8\u65b9\u5f0f\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u4e0a\u73ed\u65cf\uff0c\u9700\u7167\u987e\u5bb6\u5ead\uff0c\u665a\u4e0a9\u70b9\u534a\u540e\u65e0\u4e2a\u4eba\u65f6\u95f4\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u5df2\u62a5\u5907\u5e76\u652f\u6301**\uff08\u4e08\u592b\u548c\u5b69\u5b50\u5728\u573a\u65c1\u542cPia\u620f\uff0c\u5bb6\u5ead\u6c1b\u56f4\u878d\u6d3d\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u793e\u7fa4\u4e92\u52a8\u79ef\u6781\uff0c\u5b66\u4e60\u884c\u4e3a\u3001\u5bb6\u5ead\u72b6\u51b5\u3001\u60c5\u7eea\u53d8\u5316\u5747\u6709\u4f53\u73b0\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u5174\u8da3\u4e0e\u80fd\u529b\u6210\u957f\u9a71\u52a8\u4e3a\u4e3b\uff0c\u517c\u6709\u5bf9\u672a\u6765\u7684\u79ef\u6781\u671f\u5f85\uff0c\u4f46\u672a\u63d0\u53ca\u660e\u786e\u7684\u77ed\u671f\u53d8\u73b0\u8bc9\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u542c\u4e86\u5e08\u5144\u7684\u8bfe\uff0c\u6211\u89c9\u5f97\u81ea\u5df1\u6628\u5929\u7684\u4e0d\u81ea\u4fe1\u4e00\u4e0b\u5168\u6ca1\u4e86\u201d > \u201c\u53ea\u8981\u591a\u9605\u8bfb\uff0c\u4ee5\u540e\u6211\u4eec\u4e5f\u4e00\u5b9a\u53ef\u4ee5\u6210\u4e3a\u8fd9\u6837\u751a\u81f3\u66f4\u597d\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u4f5c\u4e3a\u6709\u7a33\u5b9a\u5de5\u4f5c\u7684\u5df2\u5a5a\u5df2\u80b2\u5973\u6027\uff0c\u672a\u8868\u73b0\u51fa\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 **\u6838\u5fc3\u77ed\u677f**\u3002\u9700\u517c\u987e\u5168\u804c\u5de5\u4f5c\u4e0e\u80b2\u513f\uff0c\u4e2a\u4eba\u5b66\u4e60\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\uff08\u5348\u4f11\u3001\u665a\u996d\u540e\u3001\u5b69\u5b50\u7761\u524d\uff09\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u9ad8] \u2014 \u5bb6\u4eba\u77e5\u60c5\u4e14\u53c2\u4e0e\u4e92\u52a8\uff08\u4e08\u592b\u5b69\u5b50\u65c1\u542c\uff09\uff0c\u5bb6\u5ead\u6c1b\u56f4\u652f\u6301\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u5982\u4f5c\u4e1a\u63d0\u4ea4\uff09\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\uff08\u95ee\u8c46\u5305\u3001\u95ee\u73ed\u73ed\uff09\uff0c\u53d7\u632b\u540e\uff08\u88ab\u70b9\u8bc4\u201c\u7167\u672c\u5ba3\u79d1\u201d\uff09\u80fd\u5feb\u901f\u8c03\u6574\u5fc3\u6001\uff0c\u5e76\u8f6c\u5316\u4e3a\u884c\u52a8\u529b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u5148\u591a\u542c\u51e0\u904d\uff0c\u6211\u4e00\u5b9a\u8981\u641e\u51fa\u6765\uff0c\u4e0d\u7136\u6211\u4eca\u665a\u90fd\u4f1a\u7761\u4e0d\u7740\u4e86\u201d > \u201c\u8c22\u8c22\u8c46\u76ae\u73ed\u73ed\u3002\u4eca\u5929\u767d\u5929\u8ddf\u4f60\u804a\u5b8c\u5929\u6211\u89c9\u5f97\u6211\u5ffd\u7136\u60f3\u5f00\u4e86\u3002\u5fc3\u4e5f\u5e73\u9759\u4e86\uff0c\u611f\u8c22\u4f60\u7684\u6559\u5bfc\uff0c\u6211\u4e00\u5b9a\u4f1a\u52aa\u529b\u7684\uff0c\u6700\u540e\u600e\u4e48\u6837\u90fd\u6ca1\u4e8b\uff0c\u6211\u5e94\u8be5\u4eab\u53d7\u8fc7\u7a0b\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u957f\u671f\u5c06\u5168\u90e8\u65f6\u95f4\u5949\u732e\u7ed9\u5bb6\u5ead\u548c\u5de5\u4f5c\uff0c**\u81ea\u6211\u4ef7\u503c\u611f\u7f3a\u5931**\uff0c\u6e34\u671b\u83b7\u5f97\u4e13\u4e1a\u4e0a\u7684\u8ba4\u53ef\u3001\u5efa\u7acb\u65b0\u7684\u793e\u4ea4\u5708\u5c42\u3001\u5e76\u91cd\u65b0\u53d1\u73b0\u548c\u5b9e\u73b0\u4e2a\u4eba\u6f5c\u80fd\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u201d\u7684\u5c0a\u91cd\u611f\u4e0e\u201c\u80fd\u6210\u957f\u201d\u7684\u6210\u5c31\u611f**\u3002\u5728\u5fd9\u788c\u7684\u65e5\u5e38\u4e2d\uff0c\u4e3a\u5979\u5f00\u8f9f\u4e00\u4e2a\u4e13\u5c5e\u7684\u3001\u80fd\u83b7\u5f97\u6b63\u5411\u53cd\u9988\u548c\u793e\u7fa4\u5f52\u5c5e\u7684\u7cbe\u795e\u89d2\u843d\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** \uff08\u52a8\u673a\u4e2d\u7b49\u3001\u8d44\u6e90\u4e2d\u7b49\u3001\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u662f\u6838\u5fc3\u670d\u52a1\u4e0e\u8f6c\u5316\u7684\u6f5c\u529b\u7528\u6237\uff09 |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** \uff08\u79ef\u6781\u4e92\u52a8\u3001\u4e3b\u52a8\u7ec3\u4e60\u3001\u8ffd\u6c42\u80fd\u529b\u7cbe\u8fdb\u3001\u5728\u793e\u7fa4\u4e2d\u4e50\u4e8e\u52a9\u4eba\u5e26\u52a8\u6c1b\u56f4\uff0c\u4f46\u4e0d\u8fc7\u5206\u5f20\u626c\uff09 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u5bb6\u5ead\u652f\u6301\u5ea6\u9ad8\uff0c\u98ce\u9669\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u6838\u5fc3\u98ce\u9669**\uff1a\u65f6\u95f4\u88ab\u5bb6\u5ead\u548c\u5de5\u4f5c\u4e25\u91cd\u6324\u538b\uff0c\u4e00\u65e6\u751f\u6d3b\u51fa\u73b0\u7a81\u53d1\u72b6\u51b5\uff08\u5982\u5b69\u5b50\u751f\u75c5\u3001\u5de5\u4f5c\u52a0\u73ed\uff09\uff0c\u6781\u6613\u5bfc\u81f4\u8bfe\u7a0b\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u7126\u8651\u548c\u81ea\u8d23\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u4e3b\u52a8\u6d88\u5316\u632b\u6298\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u5f53\u524d\u52a8\u673a\u4ee5\u5174\u8da3\u548c\u80fd\u529b\u6210\u957f\u4e3a\u4e3b\uff0c\u5bf9\u77ed\u671f\u53d8\u73b0\u671f\u5f85\u4e0d\u660e\u663e\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-3\u5468\u540e**\u3002\u5f53\u8bfe\u7a0b\u5185\u5bb9\u52a0\u6df1\u3001\u4f5c\u4e1a\u91cf\u589e\u52a0\uff0c\u4e0e\u5979\u788e\u7247\u5316\u7684\u65f6\u95f4\u77db\u76fe\u6fc0\u5316\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u84dd\u6849\uff0c\u770b\u5230\u4f60\u5728\u7fa4\u91cc\u8fd9\u4e48\u70ed\u5fc3\u5730\u5e26\u52a8\u5927\u5bb6\uff0c\u771f\u7684\u7279\u522b\u68d2\uff01\u6211\u77e5\u9053\u4f60\u53c8\u8981\u4e0a\u73ed\u53c8\u8981\u5e26\u5a03\uff0c\u65f6\u95f4\u90fd\u662f\u6324\u51fa\u6765\u7684\u3002\u522b\u62c5\u5fc3\u8fdb\u5ea6\uff0c\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u5c31\u662f\u4e3a\u4f60\u8fd9\u6837\u5fd9\u788c\u4f46\u70ed\u7231\u751f\u6d3b\u7684\u4eba\u8bbe\u8ba1\u7684\u3002**\u4f60\u7684\u6bcf\u4e00\u5206\u949f\u6295\u5165\u90fd\u7b97\u6570**\uff0c\u7d2f\u4e86\u5c31\u8ddf\u6211\u8bf4\uff0c\u54b1\u4eec\u4e00\u8d77\u628a\u5b66\u4e60\u8ba1\u5212\u62c6\u89e3\u5230\u4f60\u7684\u751f\u6d3b\u8282\u594f\u91cc\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011+ **\u3010\u5708\u5c42\u5f52\u5c5e\u7ebf\u3011**\u3002\u5979\u9700\u8981\u624e\u5b9e\u7684\u6280\u5de7\u63d0\u5347\u6765\u83b7\u5f97\u6210\u5c31\u611f\uff0c\u4e5f\u9700\u8981\u5728\u793e\u7fa4\u4e2d\u627e\u5230\u5f52\u5c5e\u611f\u548c\u4ef7\u503c\u611f\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\u7684\u7279\u70b9\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u788e\u7247\u65f6\u95f4\u5b66\u4e60\u5305\u3011**\uff08\u5982\uff1a5\u5206\u949f\u8ddf\u7ec3\u97f3\u9891\u3001\u901a\u52e4\u53ef\u542c\u7684\u6280\u5de7\u8981\u70b9\uff09\u3002\u53ef\u914c\u60c5\u8d4b\u4e88 **\u3010\u5c0f\u7ec4\u957f/\u6c1b\u56f4\u5b98\u3011\u8f7b\u91cf\u8eab\u4efd**\uff0c\u6ee1\u8db3\u5176\u5c0a\u91cd\u9700\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u7528\u201c\u522b\u4eba\u90fd\u4ea4\u4f5c\u4e1a\u4e86\u201d\u6765\u65bd\u538b**\uff1b2. \u5ffd\u89c6\u5176\u65f6\u95f4\u56f0\u5883\uff0c\u5e03\u7f6e\u9700\u8981\u5927\u5757\u8fde\u7eed\u65f6\u95f4\u624d\u80fd\u5b8c\u6210\u7684\u590d\u6742\u4f5c\u4e1a\uff1b3. \u53ea\u8fdb\u884c\u6cdb\u6cdb\u7684\u9f13\u52b1\uff0c\u4e0d\u7ed9\u5177\u4f53\u3001\u53ef\u843d\u5730\u7684\u7ec3\u4e60\u53cd\u9988\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u8fdb\u884c\u5927\u989d\u63a8\u4ecb**\u3002\u5f53\u5979\u5efa\u7acb\u8d77\u8db3\u591f\u7684\u81ea\u4fe1\u548c\u5f52\u5c5e\u611f\u540e\uff0c\u5bf9\u9ad8\u9636\u8bfe\u7a0b\uff08\u5982\u540e\u671f\u5236\u4f5c\u3001IP\u6253\u9020\uff09\u6709\u5929\u7136\u9700\u6c42\uff0c\u662f\u4f18\u8d28\u7684\u5347\u5355\u5bf9\u8c61\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u600e\u4e48\u611f\u89c9\u6211\u628a\u81ea\u5df1\u65f6\u95f4\u5168\u90e8\u5949\u732e\u7ed9\u4e86\u5bb6[\u7834\u6d95\u4e3a\u7b11]\u201d\n2. > \u201c\u6211\u5148\u591a\u542c\u51e0\u904d\uff0c\u6211\u4e00\u5b9a\u8981\u641e\u51fa\u6765\uff0c\u4e0d\u7136\u6211\u4eca\u665a\u90fd\u4f1a\u7761\u4e0d\u7740\u4e86\u201d\n3. > \u201c\u8c22\u8c22\u8c46\u76ae\u73ed\u73ed\u3002\u4eca\u5929\u767d\u5929\u8ddf\u4f60\u804a\u5b8c\u5929\u6211\u89c9\u5f97\u6211\u5ffd\u7136\u60f3\u5f00\u4e86\u3002\u5fc3\u4e5f\u5e73\u9759\u4e86\uff0c\u611f\u8c22\u4f60\u7684\u6559\u5bfc\uff0c\u6211\u4e00\u5b9a\u4f1a\u52aa\u529b\u7684\uff0c\u6700\u540e\u600e\u4e48\u6837\u90fd\u6ca1\u4e8b\uff0c\u6211\u5e94\u8be5\u4eab\u53d7\u8fc7\u7a0b\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2\u4f4e\u8c03\u5b9e\u5e72\u578b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u5bb6\u5ead\u89d2\u8272\u4e4b\u5916\uff0c\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5e2e\u5979\u89c4\u5212\u788e\u7247\u5316\u5b66\u4e60\u8282\u594f\uff0c\u7528\u5177\u4f53\u3001\u5fae\u5c0f\u7684\u6b63\u53cd\u9988\u7ef4\u6301\u5176\u5b66\u4e60\u70ed\u60c5\u4e0e\u793e\u7fa4\u5f52\u5c5e\u611f\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"maslow_need\": \"\u5c0a\u91cd\u5f52\u5c5e/\u81ea\u6211\u5b9e\u73b0\", \"risk_level\": \"\u4e2d\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5708\u5c42\u5f52\u5c5e\u7ebf+\u788e\u7247\u65f6\u95f4\u5b66\u4e60\u5305\"}\n```";
        document.getElementById('content').innerHTML = marked.parse(markdownText);
