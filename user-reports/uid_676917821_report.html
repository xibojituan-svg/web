    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a676917821\uff08\u5b59\u7ef4\u82b8\uff09\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a676917821 / cv\u7ef4\u82b8 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-28 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u732b\u4e5d\u68a8(\u5f20\u4eac\u4e3d)\u3001\u4e45\u9605\u73ed\u73ed\uff08\u51af\u58eb\u52c7\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66/AI\u914d\u97f3\u76f8\u5173\u8bfe\u7a0b\uff08\u5177\u4f53\u8bfe\u7a0b\u540d\u79f0\u53ca\u4ef7\u683c\u672a\u77e5\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u5206\u671f\u6216\u7ecf\u6d4e\u538b\u529b\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u9ad8\u5bbd\u88d5**\u3002\u7528\u6237\u5df2\u9000\u4f11\uff08\u201c50+\u5df2\u7ecf\u9000\u4f11\u4e86\u201d\uff09\uff0c\u65f6\u95f4\u81ea\u7531\uff0c\u53ef\u5168\u5929\u5019\u53c2\u4e0e\u7fa4\u804a\u3001\u6392\u7ec3\u3001\u8865\u8bfe\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u7fa4\u5185\u4e92\u52a8\u79ef\u6781\uff0c\u63d0\u4f9b\u4e86\u5927\u91cf\u5173\u4e8e\u4e2a\u4eba\u80cc\u666f\u3001\u5b66\u4e60\u72b6\u6001\u3001\u793e\u4ea4\u884c\u4e3a\u548c\u6280\u672f\u8ba8\u8bba\u7684\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **[\u2b06\u9ad8]**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u3001\u793e\u4ea4\u4e0e\u81ea\u6211\u5b9e\u73b0\u800c\u6765\u3002\u804a\u5929\u4e2d\u672a\u89c1\u4efb\u4f55\u201c\u51e0\u5929\u80fd\u8d5a\u94b1\u201d\u3001\u201c\u4fdd\u5e95\u5408\u540c\u201d\u7b49\u53d8\u73b0\u9a71\u52a8\u4fe1\u53f7\u3002\u5176\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u53c2\u4e0e\u56e2\u961f\u521b\u4f5c\u3001\u4eab\u53d7\u914d\u97f3\u8fc7\u7a0b\u3001\u83b7\u5f97\u60c5\u611f\u5171\u9e23\u4e0e\u793e\u4ea4\u5f52\u5c5e\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u4eec\u8fd9\u6b21\u6bd4\u8d5b\u662f\u5f18\u626c\u4eba\u7c7b\uff0c\u4f1a\u4e0d\u4f1a\u6709\u70b9\u6096\u8bba\u201d \uff08\u5173\u6ce8\u4f5c\u54c1\u5185\u6db5\u4e0e\u4ef7\u503c\uff09\n> \u201c\u6f14\u64ad\u7684\u65f6\u5019\u75db\u54ed\u6d41\u6d95\u6211\u4e5f\u884c\uff0c\u60f3\u60f3\u6211\u5bb6\u72d7\u72d7\u620f\u611f\u5c31\u6765\u4e86\u201d \uff08\u4e3a\u60c5\u611f\u5171\u9e23\u4e0e\u827a\u672f\u8868\u8fbe\u800c\u5b66\u4e60\uff09\n> \u201c\u5c0f\u4f19\u4f34\u4eec\u6211\u4eec\u4ee5\u540e\u4e00\u5b9a\u8981\u5408\u4f5c\u5f55\u4e66\u54e6\uff0c\u4e00\u8d77\u52a0\u6cb9\ud83d\udcaa\u201d \uff08\u8ffd\u6c42\u957f\u671f\u5408\u4f5c\u4e0e\u793e\u4ea4\u8fde\u63a5\uff09\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **[\u2b06\u9ad8]**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u9ad8]** \u2014 \u5df2\u9000\u4f11\uff0c\u6709\u7a33\u5b9a\u7ecf\u6d4e\u6765\u6e90\u3002\u4e3a\u6539\u5584\u5f55\u97f3\u73af\u5883\u4e3b\u52a8\u8d2d\u7f6e\u8bbe\u5907\uff08\u201c\u53c8\u4e70\u4e86\u4e2a\u5199\u5b57\u53f0\u201d\uff09\uff0c\u8868\u660e\u8d44\u91d1\u65e0\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**[\u9ad8]** \u2014 \u9000\u4f11\u72b6\u6001\uff0c\u65f6\u95f4\u6781\u5ea6\u5bbd\u88d5\u3002\u53ef\u5168\u5929\u53c2\u4e0e\u7fa4\u8ba8\u8bba\u3001\u8865\u8bfe\u3001\u6392\u7ec3\uff08\u201c\u6211\u65f6\u95f4\u5bbd\u88d5\u7684\uff0c\u4e00\u5b9a\u5168\u529b\u4ee5\u8d74\u201d\uff09\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u4e2d]** \u2014 \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u63d0\u53ca\u4e0e\u6bcd\u4eb2\u5171\u540c\u7167\u987e\u75c5\u72ac\uff0c\u63a8\u6d4b\u5bb6\u5ead\u5173\u7cfb\u548c\u7766\u3002\u65e0\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **[\u2b06\u9ad8]**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9762\u5bf9\u6280\u672f\u96be\u9898\uff08\u540e\u671f\u96be\u3001\u5f55\u97f3\u73af\u5883\u5dee\uff09\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff08\u642c\u4e1c\u897f\u3001\u4e70\u8bbe\u5907\uff09\uff0c\u60c5\u7eea\u7a33\u5b9a\u4e50\u89c2\uff0c\u662f\u56e2\u961f\u7684\u60c5\u7eea\u7a33\u5b9a\u5668\u548c\u9f13\u52b1\u8005\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u540e\u671f\u592a\u96be\u4e86\uff0c\u6211\u4eca\u5929\u505a\u540e\u671f\u4f5c\u4e1a\u505a\u52304\u70b9\u949f[\u6342\u8138]\u201d \uff08\u9648\u8ff0\u56f0\u96be\uff0c\u65e0\u62b1\u6028\uff09\n> \u201c\u53ea\u80fd\u642c\u4e1c\u897f\uff0c\u6df7\u54cd\u6ca1\u6cd5\u5168\u90e8\u53bb\u9664\u201d \uff08\u7406\u6027\u5206\u6790\u95ee\u9898\uff0c\u800c\u975e\u60c5\u7eea\u5d29\u6e83\uff09\n> \u201c\u6211\u4eec\u4e00\u5b9a\u80fd\u6210\u529f\u767b\u9876\ud83d\udcaa\ud83d\udcaa\ud83d\udcaa\u201d \uff08\u79ef\u6781\u9f13\u52b1\u56e2\u961f\uff0c\u5c55\u73b0\u9886\u5bfc\u529b\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42 + \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u9000\u4f11\u540e\u5bf9\u9ad8\u8d28\u91cf\u793e\u4ea4\u5708\u5c42\u548c\u7cbe\u795e\u5f52\u5c5e\u7684\u5f3a\u70c8\u6e34\u671b\u3002\u5979\u4eab\u53d7\u5728\u56e2\u961f\u4e2d\u88ab\u9700\u8981\u3001\u88ab\u8ba4\u53ef\u7684\u611f\u89c9\uff0c\u5e76\u901a\u8fc7\u914d\u97f3\u521b\u4f5c\u5b9e\u73b0\u5e74\u8f7b\u65f6\u7684\u68a6\u60f3\uff08\u201c\u4ece\u5c0f\u7236\u6bcd\u559c\u6b22\u770b\u5916\u56fd\u5f71\u7247\u548c\u7535\u89c6\u5267\uff0c\u6240\u4ee5\u8ddf\u7740\u4ed6\u4eec\u770b\u5c31\u5f88\u559c\u6b22\u91cc\u9762\u7684\u914d\u97f3\u8001\u5e08\u201d\uff09\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u8d4b\u4e88\u5176\u201c\u56e2\u961f\u6838\u5fc3/\u60c5\u611f\u5bfc\u5e08\u201d\u7684\u8eab\u4efd\u8ba4\u540c\u4e0e\u6743\u529b\u5149\u73af**\u3002\u8ba9\u5979\u5728\u9879\u76ee\u4e2d\u626e\u6f14\u91cd\u8981\u89d2\u8272\uff08\u5982\u60c5\u611f\u6307\u5bfc\u3001\u56e2\u961f\u7c98\u5408\u5242\uff09\uff0c\u6ee1\u8db3\u5176\u88ab\u5c0a\u91cd\u548c\u88ab\u9700\u8981\u7684\u6df1\u5c42\u9700\u6c42\uff0c\u4ece\u800c\u5b9e\u73b0\u4ece\u201c\u5b66\u4e60\u6280\u80fd\u201d\u5230\u201c\u521b\u9020\u4ef7\u503c\u3001\u5f71\u54cd\u4ed6\u4eba\u201d\u7684\u81ea\u6211\u5b9e\u73b0\u8dc3\u8fc1\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\u2b50A\u7c7b** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T1-A \u5bfc\u6f14\u578b\u9886\u8896\uff08\u5708\u517b\u9886\u8896\uff09** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u5bb6\u5ead\u652f\u6301\u5ea6\u9ad8\uff0c\u65e0\u53cd\u5bf9\u8ff9\u8c61\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u6781\u4f4e | \u65f6\u95f4\u6781\u5ea6\u5bbd\u88d5\uff0c\u5b66\u4e60\u610f\u613f\u5f3a\uff0c\u4e3b\u52a8\u8865\u8bfe\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u4e8b\u4e3b\u52a8\u89e3\u51b3\uff0c\u662f\u56e2\u961f\u7684\u60c5\u7eea\u652f\u67f1\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u52a8\u673a\u975e\u77ed\u671f\u53d8\u73b0\uff0c\u66f4\u770b\u91cd\u8fc7\u7a0b\u4f53\u9a8c\u4e0e\u793e\u4ea4\u4ef7\u503c\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u6781\u4f4e\u98ce\u9669**\u3002\u552f\u4e00\u6f5c\u5728\u98ce\u9669\u662f\u5982\u679c\u56e2\u961f\u9879\u76ee\u5931\u8d25\u6216\u56e2\u961f\u89e3\u6563\uff0c\u5176\u793e\u4ea4\u5f52\u5c5e\u611f\u548c\u81ea\u6211\u5b9e\u73b0\u611f\u843d\u7a7a\uff0c\u53ef\u80fd\u4ea7\u751f\u5931\u843d\u60c5\u7eea\uff0c\u4f46\u8f6c\u5316\u4e3a\u9000\u8d39\u884c\u52a8\u7684\u6982\u7387\u4e0d\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u7ef4\u82b8\u59d0\uff0c\u770b\u5230\u60a8\u5728\u7fa4\u91cc\u7684\u53d1\u8a00\uff0c\u611f\u89c9\u60a8\u5c31\u662f\u6211\u4eec\u56e2\u961f\u6700\u9700\u8981\u7684\u2018\u5b9a\u6d77\u795e\u9488\u2019\u3002\u4e0d\u4ec5\u7ecf\u9a8c\u4e30\u5bcc\uff0c\u8fd8\u80fd\u628a\u5927\u5bb6\u51dd\u805a\u5728\u4e00\u8d77\u3002\u63a5\u4e0b\u6765\u7684\u9879\u76ee\uff0c\u7279\u522b\u9700\u8981\u60a8\u8fd9\u6837\u6709\u9886\u5bfc\u529b\u548c\u5171\u60c5\u529b\u7684\u524d\u8f88\u6765\u5e26\u5e26\u8282\u594f\uff0c\u60a8\u770b\u80fd\u4e0d\u80fd\u591a\u5e2e\u6211\u4eec\u7ec4\u7ec7\u4e00\u4e0b\u5927\u5bb6\u7684\u6392\u7ec3\u548c\u60c5\u7eea\u8c03\u52a8\uff1f\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\u3011**\u3002\u5979\u4e0d\u662f\u6765\u201c\u4e0a\u8bfe\u201d\u7684\uff0c\u662f\u6765\u201c\u5e26\u961f\u201d\u548c\u201c\u627e\u5708\u5b50\u201d\u7684\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T1-A\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a**\u3010D\u6a21\u5757\uff1a\u7edf\u7b79\u6743\u529b\u4e0b\u653e\u3011**\u3002\u6388\u4e88\u5176\u5c0f\u7ec4\u957f\u3001\u9879\u76ee\u5236\u7247\u4eba\u6216\u60c5\u611f\u6307\u5bfc\u5b98\u7b49\u6b63\u5f0f/\u975e\u6b63\u5f0f\u5934\u8854\uff0c\u7ed9\u4e88\u7fa4\u5185\u7ec4\u7ec7\u6392\u7ec3\u3001\u534f\u8c03\u8fdb\u5ea6\u3001\u60c5\u611f\u52a8\u5458\u7684\u7edd\u5bf9\u6743\u9650\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u5bf9\u5f85\u65b0\u624b\u5b66\u5458\u7684\u201c\u6559\u5b66\u201d\u6216\u201c\u7ba1\u7406\u201d\u53e3\u543b\u4e0e\u5979\u6c9f\u901a\u3002\u7981\u6b62\u5e72\u9884\u5979\u7684\u56e2\u961f\u7edf\u7b79\u5b89\u6392\uff0c\u7981\u6b62\u7528\u201c\u4f5b\u7cfb\u201d\u8a00\u8bba\u6253\u51fb\u5176\u56e2\u961f\u58eb\u6c14\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5979\u5177\u5907\u9ad8\u5ba2\u5355\u4ef7\u6d88\u8d39\u6f5c\u529b\uff08\u5982\u9ad8\u7ea7\u8bbe\u5907\u3001\u79c1\u6559\u8bfe\u3001\u9ad8\u9636\u521b\u4f5c\u8425\uff09\u3002\u63a8\u4ecb\u65f6\uff0c\u5e94\u4ece\u201c\u5e2e\u52a9\u5979\u66f4\u597d\u5730\u5e26\u9886\u56e2\u961f\u3001\u4ea7\u51fa\u66f4\u4e13\u4e1a\u4f5c\u54c1\u201d\u7684\u89d2\u5ea6\u5207\u5165\uff0c\u800c\u975e\u5355\u7eaf\u63a8\u9500\u6280\u80fd\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u621150+\u5df2\u7ecf\u9000\u4f11\u4e86**\uff0c\u4ece\u5c0f\u7236\u6bcd\u559c\u6b22\u770b\u5916\u56fd\u5f71\u7247\u548c\u7535\u89c6\u5267\uff0c\u6240\u4ee5\u8ddf\u7740\u4ed6\u4eec\u770b\u5c31\u5f88\u559c\u6b22\u91cc\u9762\u7684\u914d\u97f3\u8001\u5e08\uff0c\u6709\u5e78\u5728\u8fd9\u91cc\u4e2a\u5927\u5bb6\u76f8\u9047\u975e\u5e38\u5f00\u5fc3\ud83d\ude0a\ud83d\ude0a\u201d \uff08**\u9ad8\u8d44\u6e90\u5e95\u5ea7\u3001\u9ad8\u7eaf\u5ea6\u5174\u8da3\u52a8\u673a\u3001\u793e\u4ea4\u9700\u6c42**\uff09\n2. > \u201c**\u6653\u6656\u7ec4\u7ec7\u56e2\u961f\u80fd\u529b\u592a\u5f3a\u4e86\uff0c\u770b\u597d\u4f60[\u5f3a]**\u201d & \u201c**\u5728\u4f60\u62d2\u7edd\u5c71\u6cb3\u8bf4\u7684\u90a3\u6bb5\u8bdd\u7684\u65f6\u5019\uff0c\u6211\u5c31\u575a\u5b9a\u7684\u8ba4\u5b9a\u4f60\u4e86[\u62e5\u62b1]**\u201d \uff08**\u5177\u5907\u8bc6\u522b\u548c\u8d5e\u8d4f\u9886\u5bfc\u529b\u7684\u773c\u5149\uff0c\u81ea\u8eab\u6709\u5f3a\u70c8\u7684\u56e2\u961f\u5f52\u5c5e\u548c\u4ef7\u503c\u89c2\u8ba4\u540c**\uff09\n3. > \u201c**\u540e\u671f\u592a\u96be\u4e86\uff0c\u6211\u4eca\u5929\u505a\u540e\u671f\u4f5c\u4e1a\u505a\u52304\u70b9\u949f[\u6342\u8138]**\u201d & \u201c**\u53ea\u80fd\u642c\u4e1c\u897f\uff0c\u6df7\u54cd\u6ca1\u6cd5\u5168\u90e8\u53bb\u9664**\u201d \uff08**\u9ad8\u5fc3\u7406\u5f39\u6027\uff0c\u9762\u5bf9\u56f0\u96be\u4e3b\u52a8\u884c\u52a8\u3001\u7406\u6027\u89e3\u51b3\uff0c\u65e0\u60c5\u7eea\u5316\u62b1\u6028**\uff09\n4. > \u201c**\u6211\u4eec\u7fa4\u91cc\u5168\u662f\u5b9d**\u201d & \u201c**\u6211\u4eec\u8fd9\u4e2a\u7fa4\u4e0d\u80fd\u89e3\u6563\u54e6**\u201d & \u201c**\u521a\u624d\u88ab\u73ed\u73ed\u8bf4\u7684\u597d\u96be\u8fc7[\u6d41\u6cea]\u820d\u4e0d\u5f97**\u201d \uff08**\u6838\u5fc3\u9700\u6c42\u662f\u9ad8\u8d28\u91cf\u793e\u4ea4\u8fde\u63a5\u4e0e\u60c5\u611f\u5f52\u5c5e\uff0c\u8fdc\u8d85\u6280\u80fd\u5b66\u4e60\u672c\u8eab**\uff09\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T1-A \u5bfc\u6f14\u578b\u9886\u8896/\u5708\u517b\u9886\u8896\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u9000\u4f11\u540e\u627e\u5230\u4e00\u4e2a\u80fd\u53d1\u6325\u5f71\u54cd\u529b\u3001\u83b7\u5f97\u5c0a\u91cd\u4e0e\u5f52\u5c5e\u7684\u9ad8\u8d28\u91cf\u793e\u4ea4\u5708\uff0c\u5e76\u5b9e\u73b0\u914d\u97f3\u68a6\u60f3\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u653f\u6743\u8ba9\u6e21\u6cd5\uff1a\u6388\u4e88\u5176\u56e2\u961f\u7ec4\u7ec7\u6743\u4e0e\u60c5\u611f\u9886\u8896\u8eab\u4efd\uff0c\u73ed\u4e3b\u4efb\u9000\u5c45\u5e55\u540e\u5145\u5f53\u6367\u54cf\u4e0e\u8d44\u6e90\u652f\u6301\u8005\u3011**\u3002\n\n```json\n{\"core_type\": \"T1-A \u5bfc\u6f14\u578b\u9886\u8896\uff08\u5708\u517b\u9886\u8896\uff09\", \"risk_level\": \"\u6781\u4f4e\", \"refund_risk\": \"\u6781\u4f4e\", \"maslow_need\": \"\u793e\u4ea4\u9700\u6c42\u4e0e\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\", \"age\": \"50+\u5c81\", \"gender\": \"\u5973\", \"city\": \"\u4e0a\u6d77\"}\n```";
