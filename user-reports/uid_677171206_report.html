    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4f5c\u4e3a\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677171206\u7684\u7528\u6237\u8fdb\u884c\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677171206 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u516d\u6708\u6668\u516e(\u5218\u519b) / \u5e03\u4e01(\u5218\u519b) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u9ad8\u9636\u73ed\uff08\u4ef7\u683c\uff1a2380\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u672a\u77e5\uff08\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1\uff08\u533b\u9662\u836f\u5c40\u5de5\u4f5c\uff0c\u6709\u503c\u73ed\uff0c\u4f46\u201c\u4f11\u73ed\u5f88\u591a\u201d\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u672a\u77e5\uff08\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e2d\u7b49\uff08\u6709\u5b66\u4e60\u884c\u4e3a\u3001\u804c\u4e1a\u3001\u65f6\u95f4\u4fe1\u606f\uff0c\u4f46\u7f3a\u4e4f\u652f\u4ed8\u3001\u5bb6\u5ead\u3001\u6df1\u5c42\u52a8\u673a\u4fe1\u606f\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u81ea\u6211\u5b9e\u73b0\u800c\u6765\u3002\u7528\u6237\u5173\u6ce8\u70b9\u5728\u5b66\u4e60\u6536\u83b7\u3001\u6280\u5de7\u63d0\u5347\u548c\u53c2\u4e0e\u611f\uff0c\u800c\u975e\u77ed\u671f\u53d8\u73b0\u3002\u5bf9\u76f4\u64ad\u8bfe\u5185\u5bb9\uff08\u53d8\u73b0\u6e20\u9053\u3001\u5c97\u4f4d\u5206\u5de5\uff09\u8868\u73b0\u51fa\u6d53\u539a\u5174\u8da3\uff0c\u5e76\u79ef\u6781\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0ePia\u620f\uff0c\u4eab\u53d7\u5b66\u4e60\u8fc7\u7a0b\u672c\u8eab\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u5462\uff0c\u4ee5\u524d\u6ca1\u6709\u63a5\u89e6\u8fc7\u8fd9\u4e2a\u884c\u4e1a\uff0c\u4eca\u5929\u542c\u90a3\u4e2a\u76f4\u64ad\u8bfe\u4ee5\u540e\u5427\uff0c\u5c31\u662f\u8bf4\u61c2\u4e86\u5f88\u591a\uff0c\uff0c\u5c31\u662f\u8fd9\u53ef\u80fd\u662f\u54b1\u4ee5\u524d\u6ca1\u63a5\u89e6\u8fc7\uff0c\u957f\u4e86\u5f88\u591a\u77e5\u8bc6\u5427\u3002\u201d > \u201c\u53ef\u771f\u597d\u73a9\u3002\u6211\u5c45\u7136\u8054\u4e0a\u9ea6\u4e86\uff0c\u53ef\u60dc\u7531\u4e8e\u6211\u6ca1\u6253\u5f00\u9ea6\uff0c\u9057\u61be\u7684\u9000\u573a\u4e86[\u6d41\u6cea]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a\u672a\u77e5 \u2014 \u672a\u63d0\u53ca\u652f\u4ed8\u538b\u529b\u6216\u7ecf\u6d4e\u72b6\u51b5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a\u4e2d \u2014 \u533b\u9662\u836f\u5c40\u5de5\u4f5c\uff0c\u6709\u503c\u73ed\u548c\u788e\u7247\u65f6\u95f4\uff0c\u4f46\u201c\u4f11\u73ed\u5f88\u591a\u201d\uff0c\u8868\u660e\u6709\u89c4\u5f8b\u4e14\u76f8\u5bf9\u5145\u88d5\u7684\u4e1a\u4f59\u65f6\u95f4\u7528\u4e8e\u5b66\u4e60\u3002\u80fd\u575a\u6301\u5b8c\u6210\u65e9\u529f\u3001\u542c\u8bfe\u3001\u4f5c\u4e1a\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a\u672a\u77e5 \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9762\u5bf9\u201c\u7ed5\u5507\u96be\u201d\u7b49\u6280\u672f\u56f0\u96be\uff0c\u80fd\u4e3b\u52a8\u6c9f\u901a\u5e76\u63a5\u53d7\u5efa\u8bae\uff08\u201c\u597d\u7684\uff0c\u8c22\u8c22\u201d\uff09\u3002Pia\u620f\u56e0\u64cd\u4f5c\u5931\u8bef\u672a\u6210\u529f\uff0c\u8868\u8fbe\u7684\u662f\u201c\u9057\u61be\u201d\u800c\u975e\u5d29\u6e83\u3002\u6574\u4f53\u60c5\u7eea\u7a33\u5b9a\u3001\u79ef\u6781\uff0c\u80fd\u4e3b\u52a8\u89c4\u5212\u5b66\u4e60\uff08\u201c\u665a\u4e0a\u6211\u6309\u5e08\u59d0\u7684\u65b9\u6cd5\u518d\u8bd5\u4e00\u4e0b\u201d\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u7ed5\u5507\u6211\u6ca1\u611f\u5230\u96be\u5ea6[\u5077\u7b11]\u201d > \u201c\u8bf4\u9519\u4e86\uff0c\u7ed5\u820c\u53ef\u4ee5\uff0c\u7ed5\u5507\u96be\u201d > \u201c\u53ef\u771f\u597d\u73a9\u3002\u6211\u5c45\u7136\u8054\u4e0a\u9ea6\u4e86\uff0c\u53ef\u60dc\u7531\u4e8e\u6211\u6ca1\u6253\u5f00\u9ea6\uff0c\u9057\u61be\u7684\u9000\u573a\u4e86[\u6d41\u6cea]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u5168\u65b0\u9886\u57df\uff08\u6709\u58f0\u6f14\u64ad\uff09\u7684\u597d\u5947\u4e0e\u63a2\u7d22\u6b32\uff0c\u6e34\u671b\u901a\u8fc7\u5b66\u4e60\u83b7\u5f97\u65b0\u6280\u80fd\u3001\u65b0\u4f53\u9a8c\uff0c\u5b9e\u73b0\u4e2a\u4eba\u6210\u957f\u4e0e\u4ef7\u503c\u62d3\u5c55\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u6210\u957f\u8def\u5f84\u7684\u6e05\u6670\u6307\u5f15**\u3002\u7528\u6237\u9700\u8981\u88ab\u770b\u5230\u201c\u8fdb\u6b65\u201d\uff08\u9500\u552e\u591a\u6b21\u5938\u8d5e\u5176\u8fdb\u6b65\u660e\u663e\uff09\uff0c\u5e76\u9700\u8981\u660e\u786e\u7684\u201c\u4e0b\u4e00\u6b65\u201d\u89c4\u5212\uff08\u5982\u5165\u9a7b\u5e73\u53f0\u3001\u63a5\u5355\u8def\u5f84\uff09\uff0c\u4ee5\u6ee1\u8db3\u5176\u81ea\u6211\u5b9e\u73b0\u7684\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 **B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u8fdb\u5316\u524d\u4f53\uff0c\u6709\u5411\u6df7\u5408\u4f533\u53f7\u3010\u6743\u9650\u89c9\u9192\u7684\u8001\u9ec4\u725b\u3011\u53d1\u5c55\u7684\u6f5c\u529b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u3001\u96f6\u4e92\u52a8\u7b49\u5371\u9669\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u804c\u4e1a\u7a33\u5b9a\uff0c\u98ce\u9669\u76f8\u5bf9\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u7528\u6237\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5f3a\uff08\u201c\u4e0a\u73ed\u4e4b\u524d\u90fd\u5df2\u7ec3\u5b8c\u201d\uff09\uff0c\u4e14\u4e3b\u52a8\u6c9f\u901a\u65f6\u95f4\u5b89\u6392\uff0c\u8ddf\u8fdb\u610f\u613f\u5f3a\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u632b\u80fd\u5e73\u548c\u9762\u5bf9\u5e76\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u7528\u6237\u52a8\u673a\u7eaf\u5ea6\u9ad8\uff0c\u82e5\u957f\u671f\u5b66\u4e60\u540e\u63a5\u5355\u673a\u4f1a\u6e3a\u832b\u6216\u4e0e\u5ba3\u4f20\u4e0d\u7b26\uff0c\u53ef\u80fd\u56e0\u201c\u81ea\u6211\u5b9e\u73b0\u201d\u8def\u5f84\u53d7\u963b\u800c\u4ea7\u751f\u5931\u671b\u60c5\u7eea\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe2-3\u4e2a\u6708\u540e\uff0c\u5f53\u6280\u80fd\u63d0\u5347\u8fdb\u5165\u5e73\u53f0\u671f\uff0c\u4e14\u63a5\u5355\u53d8\u73b0\u8fdb\u5c55\u7f13\u6162\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u770b\u5230\u4f60\u8bad\u7ec3\u8425\u671f\u95f4\u5b66\u4e60\u8fd9\u4e48\u624e\u5b9e\uff0c\u4f5c\u4e1a\u4ea4\u5f97\u53c8\u5feb\u53c8\u597d\uff0cPia\u620f\u4e5f\u79ef\u6781\u53c2\u4e0e\uff0c\u771f\u7684\u5f88\u6709\u6f5c\u529b\u3002\u7cfb\u7edf\u8bfe\u6211\u4eec\u4f1a\u5e26\u4f60\u66f4\u6df1\u5165\u5730\u6253\u78e8\u6280\u5de7\uff0c\u4e00\u6b65\u6b65\u89e3\u9501\u4ece\u65c1\u767d\u5230\u89d2\u8272\u97f3\uff0c\u518d\u5230\u5b9e\u6218\u63a5\u5355\u7684\u5168\u6d41\u7a0b\u3002\u4f60\u8fd9\u79cd\u7a33\u624e\u7a33\u6253\u7684\u98ce\u683c\uff0c\u662f\u6700\u5bb9\u6613\u51fa\u6210\u679c\u7684\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176T2\u7279\u8d28\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010B\u6a21\u5757\uff1a\u786c\u6838\u624b\u827a\u6c60\u3011\u7684\u4e13\u5bb61v1\u7b54\u7591\u548c\u771f\u5b9e\u6d3e\u5355\u5b9e\u6218\u3002\u540c\u65f6\uff0c**\u6301\u7eed\u89c2\u5bdf\u5176\u662f\u5426\u51fa\u73b0\u4e3b\u52a8\u5e2e\u52a9\u4ed6\u4eba\u3001\u7edf\u7b79\u4e8b\u52a1\u7684\u884c\u4e3a**\uff0c\u4e00\u65e6\u51fa\u73b0\uff0c\u7acb\u5373\u542f\u52a8\u3010D\u6a21\u5757\uff1a\u8eab\u4efd\u4e0e\u6743\u529b\u5149\u73af\u6c60\u3011\uff0c\u6388\u4e88\u5176\u5c0f\u7ec4\u957f\u6216\u4f5c\u4e1a\u7edf\u8ba1\u5458\u7b49\u89d2\u8272\uff0c\u6fc0\u53d1\u5176\u9886\u5bfc\u6f5c\u80fd\uff08\u6df7\u5408\u4f533\u53f7\u8fdb\u5316\u8def\u5f84\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u51e0\u5929\u5feb\u901f\u8d5a\u94b1\u201d\u7684\u8bdd\u672f\u53bb\u523a\u6fc0\u4ed6\uff0c\u8fd9\u4f1a\u62c9\u4f4e\u5176\u8ffd\u6c42\u81ea\u6211\u5b9e\u73b0\u7684\u683c\u8c03\u3002\u4e0d\u8981\u8fc7\u5ea6\u60c5\u611f\u6309\u6469\uff08C\u6a21\u5757\uff09\uff0c\u4ed6\u9700\u8981\u7684\u662f\u4e13\u4e1a\u7684\u80af\u5b9a\u548c\u6e05\u6670\u7684\u8def\u5f84\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u8fdb\u884c\u5927\u989d\u63a8\u4ecb\uff08\u5982\u9ad8\u9636\u8bbe\u5907\u3001\u79c1\u6559\u8bfe\uff09\uff0c\u4f46\u5fc5\u987b\u5efa\u7acb\u5728\u624e\u5b9e\u7684\u5b66\u4e60\u6210\u679c\u548c\u660e\u786e\u7684\u8fdb\u9636\u9700\u6c42\u4e0a\uff0c**\u5207\u5fcc\u5728\u57fa\u7840\u672a\u7a33\u65f6\u4ea4\u53c9\u63a8\u9500**\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u5462\uff0c\u4ee5\u524d\u6ca1\u6709\u63a5\u89e6\u8fc7\u8fd9\u4e2a\u884c\u4e1a\uff0c\u4eca\u5929\u542c\u90a3\u4e2a\u76f4\u64ad\u8bfe\u4ee5\u540e\u5427\uff0c\u5c31\u662f\u8bf4\u61c2\u4e86\u5f88\u591a\uff0c\uff0c\u5c31\u662f\u8fd9\u53ef\u80fd\u662f\u54b1\u4ee5\u524d\u6ca1\u63a5\u89e6\u8fc7\uff0c\u957f\u4e86\u5f88\u591a\u77e5\u8bc6\u5427\u3002\u201d **(\u52a8\u673a\u7eaf\u5ea6\u9ad8\u7684\u8bc1\u660e)**\n2. > \u201c\u53e3\u90e8\u64cd\u5176\u5b83\u8fd8\u597d\uff0c\u5c31\u7ed5\u5507\u6709\u96be\u5ea6\u201d -> \u201c\u7ed5\u5507\u6211\u6ca1\u611f\u5230\u96be\u5ea6[\u5077\u7b11]\u201d -> \u201c\u8bf4\u9519\u4e86\uff0c\u7ed5\u820c\u53ef\u4ee5\uff0c\u7ed5\u5507\u96be\u201d **(\u5fc3\u7406\u5f39\u6027\u9ad8\u3001\u80fd\u81ea\u6211\u8c03\u4f83\u7684\u8bc1\u660e)**\n3. > \u201c\u53ef\u771f\u597d\u73a9\u3002\u6211\u5c45\u7136\u8054\u4e0a\u9ea6\u4e86\uff0c\u53ef\u60dc\u7531\u4e8e\u6211\u6ca1\u6253\u5f00\u9ea6\uff0c\u9057\u61be\u7684\u9000\u573a\u4e86[\u6d41\u6cea]\u201d **(\u4eab\u53d7\u8fc7\u7a0b\u3001\u79ef\u6781\u53c2\u4e0e\u7684\u8bc1\u660e\uff0c\u975e\u7ed3\u679c\u5bfc\u5411)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u81ea\u6211\u5b9e\u73b0\u4e0e\u6280\u80fd\u7cbe\u8fdb\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6301\u7eed\u7684\u4e13\u4e1a\u6210\u957f\u53cd\u9988\u4e0e\u6e05\u6670\u7684\u8fdb\u9636\u8def\u5f84\uff0c\u9002\u65f6\u8d4b\u4e88\u7ba1\u7406\u6743\u9650\u6fc0\u53d1\u5176\u9886\u5bfc\u529b\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"maslow_need\": \"\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
