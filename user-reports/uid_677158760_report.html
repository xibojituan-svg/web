        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677158760 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u7b71\u6590\u5440\uff5e\u5b98\u65b9S\u7ea7\u62db\u52df\u5b98(\u5f90\u632f\u5f3a) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bad\u7ec3\u8425 (\u4ef7\u683c\uff1a7380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u4ec5\u770b\u5230\u6700\u7ec8\u62a5\u4ef7\uff0c\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u8d44\u91d1\u6765\u6e90\u6216\u5bb6\u5ead\u7ecf\u6d4e\u72b6\u51b5\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u81ea\u79f0\u201c\u4e0a\u73ed\u65cf\u201d\uff0c\u4e14\u8868\u793a\u201c\u517c\u804c\u4e0d\u4f1a\u5f71\u54cd\u4e3b\u4e1a\uff0c\u53ef\u4ee5\u62bd\u51fa\u65f6\u95f4\u201d\uff0c\u4f46\u672a\u660e\u786e\u5177\u4f53\u804c\u4e1a\u3001\u5de5\u4f5c\u65f6\u957f\u53ca\u5bb6\u5ead\u8d23\u4efb\uff08\u5982\u5e26\u5a03\uff09\u5bf9\u788e\u7247\u5316\u65f6\u95f4\u7684\u6324\u5360\u7a0b\u5ea6\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u5168\u7a0b\u672a\u63d0\u53ca\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\uff0c\u662f**\u9ad8\u98ce\u9669\u76f2\u533a**\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u5bf9\u8bdd\u4e3b\u8981\u7531\u9500\u552e\u5f15\u5bfc\uff0c\u7528\u6237\u88ab\u52a8\u56de\u5e94\uff0c\u5173\u952e\u7ef4\u5ea6\uff08\u5bb6\u5ead\u652f\u6301\u3001\u8d22\u52a1\u72b6\u51b5\u3001\u8fc7\u5f80\u5b66\u4e60\u632b\u6298\u7ecf\u5386\uff09\u4fe1\u606f\u51e0\u4e4e\u4e3a\u96f6\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b07\u4f4e\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u7eaf\u4e3a\u77ed\u671f\u5feb\u901f\u53d8\u73b0\u800c\u6765**\u3002\u7528\u6237\u660e\u786e\u56de\u7b54\u6765\u8bad\u7ec3\u8425\u7684\u76ee\u6807\u662f\u201c\u8d5a\u7c73\u201d\uff0c\u5bf9\u201c\u5feb\u901f\u6536\u5165\u201d\u548c\u201c\u957f\u671f\u6536\u5165\u201d\u90fd\u611f\u5174\u8da3\uff0c\u4f46\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u201c\u6c42\u5e26\u98de\u201d\u7684\u53d8\u73b0\u8bc9\u6c42\uff0c\u800c\u975e\u5bf9\u58f0\u97f3\u827a\u672f\u6216\u4e13\u4e1a\u6f14\u64ad\u672c\u8eab\u7684\u5174\u8da3\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c[\u6765\u8bad\u7ec3\u8425\u60f3\u6536\u83b7\u4ec0\u4e48\uff1f\u8d5a\u7c73/\u5174\u8da3]: \u8d5a\u7c73\u201d\uff1b > \u201c\u6c42\u5e26\u98de\u201d\uff1b > \u201c\u5feb\u53bb\u6536\u5165\u548c\u957f\u671f\u6536\u5165\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2192 **\u8bc4\u7ea7\uff1a\u672a\u77e5**\u30027380\u5143\u8bfe\u7a0b\u4ef7\u683c\u672a\u5f15\u53d1\u7528\u6237\u5173\u4e8e\u4ef7\u683c\u7684\u4efb\u4f55\u8ba8\u8bba\u6216\u7591\u8651\uff0c\u4f46\u65e0\u6cd5\u5224\u65ad\u5176\u652f\u4ed8\u80fd\u529b\u4e0e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u8bc4\u7ea7\uff1a\u4e2d** \u2014 \u81ea\u79f0\u4e0a\u73ed\u65cf\uff0c\u4e3b\u4e1a\u538b\u529b\u4e0d\u5927\uff0c\u627f\u8bfa\u53ef\u62bd\u51fa1-2\u5c0f\u65f6\u788e\u7247\u5316\u65f6\u95f4\u5b66\u4e60\u3002\u4f46\u4f5c\u4e3a\u201c\u5b9d\u5988\u201d\uff0c\u5b9e\u9645\u53ef\u652f\u914d\u65f6\u95f4\u53ef\u80fd\u88ab\u4e25\u91cd\u9ad8\u4f30\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2192 **\u8bc4\u7ea7\uff1a\u6781\u4f4e\uff08\u63a8\u65ad\uff09**\u3002**\u8fd9\u662f\u6700\u77ed\u7684\u677f\uff0c\u4e5f\u662f\u6700\u5927\u98ce\u9669\u70b9**\u3002\u5168\u7a0b\u672a\u63d0\u53ca\u5bb6\u4eba\uff0c\u7ed3\u5408\u201c\u5b9d\u5988\u201d\u8eab\u4efd\uff0c\u5b58\u5728**\u9690\u7792\u4e08\u592b/\u5bb6\u4eba\u62a5\u540d\u9ad8\u989d\u8bfe\u7a0b**\u7684\u6781\u9ad8\u53ef\u80fd\u6027\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6280\u672f\u4f9d\u8d56\u578b\u8106\u5f31**\u3002\u5728\u9996\u6b21\u4f7f\u7528\u5c0f\u7a0b\u5e8f\u5f55\u97f3\u9047\u5230\u201c\u65ad\u65ad\u7eed\u7eed\u201d\u7684\u6280\u672f\u95ee\u9898\u65f6\uff0c\u4e24\u6b21\u4e3b\u52a8\u63d0\u95ee\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u8868\u73b0\u51fa\u5bf9\u5de5\u5177\u7a33\u5b9a\u6027\u7684\u4f4e\u5bb9\u5fcd\u5ea6\u548c\u5bf9\u5373\u65f6\u6307\u5bfc\u7684\u4f9d\u8d56\u3002\u867d\u672a\u76f4\u63a5\u62b1\u6028\uff0c\u4f46\u5df2\u66b4\u9732\u5728\u6280\u672f\u5c0f\u969c\u788d\u524d\u7684**\u4f4e\u81ea\u4e3b\u89e3\u51b3\u80fd\u529b**\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4e3a\u4ec0\u4e48\u5f55\u5236\u4e4b\u540e\u58f0\u97f3\u65ad\u65ad\u7eed\u7eed\u7684\u201d\uff1b > \u201c\u5b66\u59d0\uff0c\u4e3a\u4ec0\u4e48\u7528\u8fd9\u4e2a\u5c0f\u7a0b\u5e8f\u5f55\u97f3\u542c\u8d77\u6765\u65ad\u65ad\u7eed\u7eed\u7684\uff0c\u4f46\u662f\u7528\u624b\u673a\u81ea\u5e26\u7684\u5f55\u97f3\u8f6f\u4ef6\u5c31\u4e0d\u4f1a\u8fd9\u6837\u5462\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4f5c\u4e3a\u5b9d\u5988\uff0c\u5bf9\u5bb6\u5ead\u7ecf\u6d4e\u8d21\u732e\u7684\u7126\u8651\u4e0e\u5bfb\u6c42\u7ecf\u6d4e\u72ec\u7acb/\u8865\u8d34\u7684\u5b89\u5168\u611f**\u3002\u5176\u201c\u8d5a\u7c73\u201d\u8bc9\u6c42\u80cc\u540e\uff0c\u662f\u5e0c\u671b\u901a\u8fc7\u517c\u804c\u589e\u52a0\u6536\u5165\uff0c\u63d0\u5347\u4e2a\u4eba\u5728\u5bb6\u5ead\u4e2d\u7684\u7ecf\u6d4e\u4ef7\u503c\u4e0e\u5b89\u5168\u611f\uff0c\u53ef\u80fd\u4f34\u968f\u5bf9\u81ea\u8eab\u804c\u4e1a\u53d1\u5c55\u505c\u6ede\u7684\u9690\u5fe7\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u5e26\u9886\u201d\u7684\u5b89\u5168\u611f\u4e0e\u201c\u786e\u5b9a\u6027\u201d\u7684\u627f\u8bfa**\u3002\u5979\u9700\u8981\u88ab\u660e\u786e\u544a\u77e5\u201c\u8ddf\u7740\u6211\u505a\u5c31\u80fd\u6709\u7ed3\u679c\u201d\uff0c\u4ee5\u7f13\u89e3\u5176\u56e0\u4fe1\u606f\u4e0d\u5bf9\u79f0\u548c\u6280\u80fd\u4e0d\u8db3\u800c\u4ea7\u751f\u7684\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1 \u7c7b** (\u52a8\u673a\u7eaf\u5ea6\u4f4e\uff0c\u8d44\u6e90\u5e95\u5ea7\u5b58\u5728\u5bb6\u5ead\u652f\u6301\u76f2\u533a\uff0c\u5fc3\u7406\u5f39\u6027\u4f4e) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u578b** (\u6838\u5fc3\u8bc9\u6c42\u662f\u5feb\u901f\u3001\u786e\u5b9a\u6027\u7684\u53d8\u73b0\uff0c\u5bf9\u8fc7\u7a0b\u5174\u8da3\u4f4e\uff0c\u6297\u98ce\u9669\u80fd\u529b\u5f31) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 **\u5b89\u5168\u672a\u89e6\u53d1 (\u4f46\u9ec4\u706f\u95ea\u70c1)** \n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u76f4\u63a5\u89e6\u53d1\u501f\u8d37\u3001\u7edd\u5883\u7b49\u7ea2\u7ebf\uff0c\u4f46**\u5bb6\u5ead\u652f\u6301\u5ea6\u4fe1\u606f\u5b8c\u5168\u7f3a\u5931**\uff0c\u662f\u6f5c\u5728\u7684D\u7c7b\u7194\u65ad\u5bfc\u706b\u7d22\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| **\u5bb6\u5ead\u5e72\u9884\u578b** | **\u6781\u9ad8** | **\u3010\u6700\u5371\u9669\u3011** \u62a5\u540d\u540e\u82e5\u88ab\u5bb6\u4eba\uff08\u5c24\u5176\u662f\u914d\u5076\uff09\u53d1\u73b0\u82b1\u8d39\u8fd17400\u5143\u5b66\u4e60\u201c\u4e0d\u52a1\u6b63\u4e1a\u201d\u7684\u8bfe\u7a0b\uff0c\u6781\u6613\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\uff0c\u5bfc\u81f4\u5f3a\u5236\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4e2d | \u4f4e\u4f30\u5e26\u5a03\u4e0e\u5de5\u4f5c\u7684\u7cbe\u529b\u6d88\u8017\uff0c\u65e0\u6cd5\u575a\u6301\u6bcf\u65e5\u5b66\u4e60\u6253\u5361\uff0c\u4ea7\u751f\u79ef\u538b\u548c\u81ea\u8d23\u540e\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4e2d | \u5728\u5b66\u4e60\u4e2d\u9047\u5230\u7a0d\u590d\u6742\u7684\u8f6f\u4ef6\u64cd\u4f5c\u3001\u97f3\u9891\u5904\u7406\u6216\u89d2\u8272\u97f3\u6280\u5de7\u65f6\uff0c\u56e0\u65e0\u6cd5\u5feb\u901f\u638c\u63e1\u800c\u81ea\u5c0a\u5fc3\u53d7\u632b\uff0c\u4ea7\u751f\u201c\u6211\u592a\u7b28\u4e86\uff0c\u5b66\u4e0d\u4f1a\u201d\u7684\u5ff5\u5934\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u9ad8 | \u5f00\u8425\u540e\u51e0\u5468\u5185\u672a\u63a5\u5230\u9884\u671f\u4e2d\u7684\u201c\u5feb\u6536\u5165\u201d\u5355\u5b50\uff0c\u6216\u8bd5\u97f3\u5c61\u6b21\u5931\u8d25\uff0c\u5bf9\u201c\u5feb\u901f\u8d5a\u94b1\u201d\u7684\u627f\u8bfa\u4ea7\u751f\u6000\u7591\uff0c\u8fdb\u800c\u66b4\u6012\u6295\u8bc9\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u6d88\u9000\uff0c\u4f5c\u4e1a\u96be\u5ea6\u63d0\u5347\uff0c\u4f46\u53d8\u73b0\u8def\u5f84\u5c1a\u672a\u6e05\u6670\uff0c\u5bb6\u5ead\u538b\u529b\u3001\u5b66\u4e60\u632b\u8d25\u611f\u3001\u6536\u76ca\u7126\u8651\u4e09\u91cd\u53e0\u52a0\uff0c\u6781\u6613\u7206\u53d1\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5b9d\u5988\u540c\u5b66\u4f60\u597d\uff01\u7279\u522b\u7406\u89e3\u4f60\u60f3\u4e3a\u5bb6\u91cc\u591a\u4e00\u4efd\u6536\u5165\u7684\u5fc3\u60c5\uff0c\u54b1\u4eec\u4e0d\u7740\u6025\uff0c\u5b66\u59d0\u4f1a\u4e00\u6b65\u6b65\u5e26\u4f60\uff0c\u5148\u4ece\u80fd\u7acb\u523b\u4e0a\u624b\u7684\u5c0f\u5355\u5b50\u5f00\u59cb\uff0c\u8ba9\u4f60\u5148\u770b\u5230\u56de\u5934\u94b1\uff0c\u5efa\u7acb\u4fe1\u5fc3\u3002\u8fc7\u7a0b\u4e2d\u6709\u4efb\u4f55\u8bbe\u5907\u6216\u64cd\u4f5c\u4e0a\u7684\u5c0f\u95ee\u9898\uff0c\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u89e3\u51b3\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5feb\u901f\u63a5\u5355\u7ebf**\u3011\u3002\u5fc5\u987b\u4f18\u5148\u63d0\u4f9b\u660e\u786e\u7684\u3001\u4f4e\u95e8\u69db\u7684\u53d8\u73b0\u8def\u5f84\uff08\u5982\u753b\u672c\u3001\u5bf9\u8f68\u3001\u7b80\u5355\u65c1\u767d\u5355\uff09\uff0c\u8ba9\u5979\u5728\u77ed\u671f\u5185\u83b7\u5f97\u6b63\u53cd\u9988\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010**\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305**\u3011\u3002\u914d\u5907\u4e13\u5c5e\u201c\u9f13\u52b1\u5e08\u201d\u89d2\u8272\uff0c\u5bf9\u5176\u4efb\u4f55\u5fae\u5c0f\u8fdb\u6b65\u7ed9\u4e88\u5938\u5f20\u8d5e\u7f8e\uff08\u201c\u5b9d\u5988\u8fd8\u80fd\u5b66\u8fd9\u4e48\u5feb\u592a\u5389\u5bb3\u4e86\uff01\u201d\uff09\uff0c\u5e76\u4e3b\u52a8\u63d0\u4f9b\u50bb\u74dc\u5f0f\u6280\u672f\u6307\u5bfc\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u5979\u5927\u8c08\u58f0\u97f3\u827a\u672f\u3001\u60c5\u6000\u548c\u957f\u671f\u4e3b\u4e49**\uff0c\u5979\u4f1a\u89c9\u5f97\u201c\u865a\u201d\u3002\n    2. **\u7edd\u4e0d\u5728\u521d\u671f\u5e03\u7f6e\u9ad8\u96be\u5ea6\u3001\u8017\u65f6\u7684\u521b\u610f\u4f5c\u4e1a**\uff0c\u4f1a\u76f4\u63a5\u51fb\u57ae\u5176\u4fe1\u5fc3\u3002\n    3. **\u7edd\u4e0d\u8fc7\u5ea6\u627f\u8bfa\u201c\u6708\u5165\u8fc7\u4e07\u201d\u6216\u5177\u4f53\u6536\u76ca\u91d1\u989d**\uff0c\u907f\u514d\u540e\u7eed\u843d\u5dee\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5347\u5355**\u3002\u5728\u5b8c\u6210\u5f53\u524d\u8bfe\u7a0b\u5e76\u6709\u7a33\u5b9a\u5c0f\u989d\u6536\u5165\u4e4b\u524d\uff0c\u4efb\u4f55\u5347\u5355\u5efa\u8bae\u90fd\u4f1a\u52a0\u5267\u5176\u7ecf\u6d4e\u538b\u529b\u548c\u5bb6\u5ead\u77db\u76fe\u98ce\u9669\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c[\u6765\u8bad\u7ec3\u8425\u60f3\u6536\u83b7\u4ec0\u4e48\uff1f\u8d5a\u7c73/\u5174\u8da3]: \u8d5a\u7c73\u201d \n2. > \u201c\u6c42\u5e26\u98de\u201d\n3. > \u201c\u5b66\u59d0\uff0c\u4e3a\u4ec0\u4e48\u7528\u8fd9\u4e2a\u5c0f\u7a0b\u5e8f\u5f55\u97f3\u542c\u8d77\u6765\u65ad\u65ad\u7eed\u7eed\u7684\uff0c\u4f46\u662f\u7528\u624b\u673a\u81ea\u5e26\u7684\u5f55\u97f3\u8f6f\u4ef6\u5c31\u4e0d\u4f1a\u8fd9\u6837\u5462\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4\u641e\u94b1\u7ed3\u679c\u578b\u5b9d\u5988\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5bb6\u5ead\u7ecf\u6d4e\u5b89\u5168\u4e0e\u4e2a\u4eba\u4ef7\u503c\u786e\u8ba4\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5f00\u8425\u5373\u63d0\u4f9b\u786e\u5b9a\u6027\u5c0f\u5355\u8def\u5f84 + \u4e25\u9632\u5bb6\u5ead\u77e5\u60c5\u6743\u96f7\u533a\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u578b\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf+\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
