        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677159544 / \u6635\u79f0\uff1a\u98ce\u82b1\u96ea\u6708 (\u540e\u6b32\u6539\u4e3a\u201c\u9047\u89c1\u55e8\u9732\u201d) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u96ea\u591c\u4e1c\u884c (\u5b5f\u60a6) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bad\u7ec3\u8425 (\u5177\u4f53\u8bfe\u7a0b\u540d\u79f0\u4e0e\u4ef7\u683c\u672a\u77e5) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931** (\u672a\u63d0\u53ca\u4efb\u4f55\u652f\u4ed8\u65b9\u5f0f\u3001\u91d1\u989d\u3001\u5206\u671f\u7b49\u4fe1\u606f) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u9700\u770b\u5b69\u5b50\uff0c\u76f4\u64ad\u65f6\u95f4\u9700\u770b\u56de\u653e) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931** (\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u6210\u5458\u6216\u5bb6\u5ead\u6001\u5ea6) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** (\u5173\u952e\u7ef4\u5ea6\u5982\u652f\u4ed8\u80fd\u529b\u3001\u5bb6\u5ead\u652f\u6301\u3001\u6df1\u5c42\u52a8\u673a\u5747\u65e0\u4fe1\u606f) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u526f\u4e1a\u8d5a\u94b1\u7684\u5174\u8da3\uff0c\u5e76\u5b8c\u6210\u4e86\u6240\u6709\u57fa\u7840\u8003\u6838\u4efb\u52a1\uff0c\u4f46\u7f3a\u4e4f\u5bf9\u5177\u4f53\u6536\u5165\u3001\u6295\u5165\u6210\u672c\u7684\u8ffd\u95ee\uff0c\u52a8\u673a\u505c\u7559\u5728\u201c\u5c1d\u8bd5\u201d\u548c\u201c\u76f8\u4fe1\u201d\u5c42\u9762\uff0c\u672a\u5c55\u73b0\u51fa\u6781\u81f4\u7684\u751f\u5b58\u538b\u529b\u6216\u660e\u786e\u7684\u53d8\u73b0\u6e34\u671b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4e0d\u77e5\u9053\u672a\u6765\u4f1a\u53d1\u5c55\u6210\u4ec0\u4e48\u6837\uff0c\u4f46\u662f\u6211\u613f\u610f\u76f8\u4fe1\u4f60\uff0c\u9047\u89c1\u66f4\u597d\u7684\u81ea\u5df1\uff01\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4efb\u4f55\u5173\u4e8e\u5b66\u8d39\u3001\u652f\u4ed8\u80fd\u529b\u7684\u8ba8\u8bba\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u2b07\u4f4e] \u2014 \u7528\u6237\u660e\u786e\u8868\u793a\u201c\u6211\u8fd9\u70b9\u770b\u5b69\u5b50\uff0c\u987e\u4e0d\u4e0a\u76f4\u64ad\u201d\uff0c\u5b66\u4e60\u65f6\u95f4\u9700\u9760\u201c\u770b\u56de\u653e\u201d\u548c\u201c\u788e\u7247\u5316\u62fc\u51d1\u201d\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 \u5b8c\u5168\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\uff0c\u652f\u6301\u5ea6\u672a\u77e5\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u5728\u5f55\u97f3\u4f5c\u4e1a\u672a\u5b8c\u6210\u3001\u827a\u540d\u4fee\u6539\u5931\u8d25\u65f6\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u80fd\u4e3b\u52a8\u8bf4\u660e\u60c5\u51b5\u5e76\u63a5\u53d7\u73b0\u5b9e\uff0c\u65e0\u62b1\u6028\u6216\u60c5\u7eea\u5ba3\u6cc4\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u5f55\u4e86\u4e00\u534a\uff0c\u8fd8\u6709\u540e\u9762\u7684\u90a3\u534a\u5462[\u5c34\u5c2c]\u201d > \u201c\u6539\u4e0d\u4e86\uff0c\u4e0b\u4e2a\u6708\u6539\u5427\uff0c[\u5927\u54ed]\u201d\uff08\u6b64\u5904\u8868\u60c5\u4e3a\u8f7b\u5ea6\u81ea\u5632\uff0c\u975e\u5d29\u6e83\uff09 > \u201c\u524d\u4e24\u5929\u4e0b\u8f7d\u6211\u5199\u4e86\u98ce\u82b1\u96ea\u6708\u8fd9\u4e2a\uff0c\u6bcf\u6708\u5c31\u80fd\u5199\u4e00\u6b21\uff0c\u4e0b\u4e2a\u6708\u6539\u518d\u8bf4\u5427\uff0c\u5148\u5c31\u8fd9\u6837\u5427\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u804c\u573a\u5916\uff08\u8d22\u52a1\u5de5\u4f5c\uff09\u7684\u81ea\u6211\u4ef7\u503c\u611f\u7f3a\u5931\u4e0e\u793e\u4ea4\u5708\u5c42\u56fa\u5316**\u3002\u4f5c\u4e3a32\u5c81\u7684\u8d22\u52a1\u4ece\u4e1a\u8005\uff0c\u751f\u6d3b\u53ef\u80fd\u88ab\u5de5\u4f5c\u548c\u80b2\u513f\u586b\u6ee1\uff0c\u7f3a\u4e4f\u80fd\u5e26\u6765\u65b0\u9c9c\u611f\u3001\u6210\u5c31\u611f\u548c\u65b0\u793e\u4ea4\u94fe\u63a5\u7684\u51fa\u53e3\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u3001\u88ab\u8ba4\u53ef\u3001\u88ab\u5f15\u9886\u8fdb\u5165\u4e00\u4e2a\u65b0\u5708\u5b50\u201d\u7684\u5f52\u5c5e\u611f\u4e0e\u6210\u957f\u966a\u4f34**\u3002\u9500\u552e\u201c\u5e08\u5144\u201d\u7684\u9f13\u52b1\u548c\u7ec6\u81f4\u6307\u5bfc\uff0c\u4ee5\u53ca\u201c\u62b1\u56e2\u53d6\u6696\u201d\u3001\u201c\u4e00\u8d77\u52a0\u6cb9\u201d\u7684\u793e\u7fa4\u627f\u8bfa\uff0c\u7cbe\u51c6\u51fb\u4e2d\u4e86\u5176\u6e34\u671b\u7a81\u7834\u73b0\u72b6\u3001\u5bfb\u627e\u65b0\u8eab\u4efd\u8ba4\u540c\u7684\u5fc3\u7406\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1 \u7c7b** (\u52a8\u673a\u4e2d\u7b49\u3001\u65f6\u95f4\u8d44\u6e90\u53d7\u9650\u3001\u4f46\u914d\u5408\u5ea6\u9ad8\u3001\u5fc3\u7406\u5f39\u6027\u597d) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T5 \u597d\u73a9\u5c1d\u9c9c\u578b** (\u6838\u5fc3\u9a71\u52a8\u662f\u63a2\u7d22\u65b0\u53ef\u80fd\u3001\u5bfb\u627e\u65b0\u4f53\u9a8c\u548c\u793e\u4ea4\u4ef7\u503c\uff0c\u800c\u975e\u8feb\u5207\u7684\u751f\u5b58\u538b\u529b\u6216\u6781\u81f4\u7684\u641e\u94b1\u7ed3\u679c) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5ead\u51b2\u7a81\u7b49\u8ff9\u8c61\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | **\u3010\u4fe1\u606f\u7f3a\u5931\u4f46\u9700\u8b66\u60d5\u3011** \u804a\u5929\u672a\u63d0\u53ca\u5bb6\u5ead\uff0c\u82e5\u4e3a\u9690\u7792\u62a5\u8bfe\uff0c\u540e\u7eed\u65f6\u95f4\u6295\u5165\u53ef\u80fd\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u56e0\u80b2\u513f\u3001\u5de5\u4f5c\u5bfc\u81f4\u65f6\u95f4\u4e25\u91cd\u788e\u7247\u5316\uff0c\u65e0\u6cd5\u8ddf\u4e0a\u76f4\u64ad\u548c\u5bc6\u96c6\u7684\u7ec3\u4e60/\u8bd5\u97f3\u8282\u594f\uff0c\u4ea7\u751f\u79ef\u538b\u6027\u7126\u8651\u548c\u632b\u8d25\u611f\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u597d\uff0c\u80fd\u81ea\u6211\u8c03\u8282\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u82e5\u77ed\u671f\u5185\uff08\u59821-2\u4e2a\u6708\uff09\u65e0\u6cd5\u83b7\u5f97\u4efb\u4f55\u6b63\u5411\u53cd\u9988\uff08\u5982\u8bd5\u97f3\u6210\u529f\u3001\u5c0f\u989d\u6536\u76ca\uff09\uff0c\u5c1d\u9c9c\u70ed\u60c5\u6d88\u9000\u540e\u53ef\u80fd\u653e\u5f03\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\u3002\u65b0\u9c9c\u611f\u8fc7\u540e\uff0c\u73b0\u5b9e\u7684\u65f6\u95f4\u51b2\u7a81\u4e0e\u5b66\u4e60\u538b\u529b\u8fbe\u5230\u5cf0\u503c\uff0c\u82e5\u6b64\u65f6\u65e0\u4efb\u4f55\u201c\u5c0f\u786e\u5e78\u201d\u5f0f\u6210\u679c\uff08\u5982\u4e00\u6b21\u8868\u626c\u3001\u4e00\u4e2a\u7b80\u5355\u4efb\u52a1\u5b8c\u6210\uff09\uff0c\u6781\u6613\u4ea7\u751f\u201c\u6211\u4e0d\u884c/\u6ca1\u65f6\u95f4\u201d\u7684\u81ea\u6211\u5426\u5b9a\u5e76\u6c89\u9ed8\u6d41\u5931\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u55e8\u9732\u540c\u5b66\uff0c\u770b\u5230\u4f60\u4e00\u8fb9\u5e26\u5a03\u4e00\u8fb9\u8fd8\u8fd9\u4e48\u8ba4\u771f\u5730\u5b8c\u6210\u6bcf\u4e00\u6b21\u4f5c\u4e1a\uff0c\u771f\u7684\u7279\u522b\u4f69\u670d\u4f60\u7684\u884c\u52a8\u529b\uff01\u54b1\u4eec\u7fa4\u91cc\u5f88\u591a\u5b9d\u5988\u5b9d\u7238\uff0c\u65f6\u95f4\u90fd\u9760\u2018\u6324\u2019\uff0c\u5b8c\u5168\u7406\u89e3\u3002\u522b\u62c5\u5fc3\u76f4\u64ad\u8ddf\u4e0d\u5b8c\uff0c\u6211\u4eec\u7684\u6838\u5fc3\u662f\u2018\u7ed3\u679c\u2019\u800c\u4e0d\u662f\u2018\u6253\u5361\u2019\u3002\u6211\u4f1a\u5e2e\u4f60\u628a\u91cd\u70b9\u5212\u51fa\u6765\uff0c\u54b1\u4eec\u5b9a\u4e2a\u6bcf\u5468\u80fd\u8f7b\u677e\u5b8c\u6210\u7684\u5c0f\u76ee\u6807\uff0c\u6162\u6162\u6765\uff0c\u4eab\u53d7\u8fd9\u4e2a\u4e3a\u81ea\u5df1\u5f00\u8f9f\u65b0\u5929\u5730\u7684\u8fc7\u7a0b\uff0c\u6709\u4efb\u4f55\u65f6\u95f4\u5b89\u6392\u4e0a\u7684\u56f0\u96be\u968f\u65f6\u627e\u6211\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5174\u8da3\u6e38\u4e50\u7ebf**\u3011\u3002\u6838\u5fc3\u76ee\u6807\u662f\u7ef4\u6301\u5176\u63a2\u7d22\u4e50\u8da3\u548c\u793e\u7fa4\u5f52\u5c5e\u611f\uff0c\u800c\u975e\u65bd\u52a0\u786c\u6838\u7684\u53d8\u73b0\u538b\u529b\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\u7279\u70b9\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a\u3010**\u5f02\u6b65\u966a\u4f34\u4e0e\u5fae\u6210\u5c31\u4f53\u7cfb\u5305**\u3011\u3002\u5305\u62ec\uff1a1) \u5f55\u64ad\u7cbe\u534e\u5207\u7247\uff1b2) 5-10\u5206\u949f\u53ef\u5b8c\u6210\u7684\u201c\u6bcf\u65e5\u58f0\u97f3\u5c0f\u6e38\u620f\u201d\u4efb\u52a1\uff1b3) \u8bbe\u7acb\u201c\u6bcf\u5468\u6700\u4f73\u8fdb\u6b65\u5956\u201d\u7b49\u975e\u7ecf\u6d4e\u6027\u6fc0\u52b1\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7edd\u4e0d\u4ee5\u201c\u5168\u804c\u4e3b\u64ad\u6708\u5165\u8fc7\u4e07\u201d\u6848\u4f8b\u5bf9\u5176\u8fdb\u884c\u9ad8\u538b\u523a\u6fc0\uff1b\u7edd\u4e0d\u5728\u5176\u8868\u793a\u201c\u5fd9\u3001\u6ca1\u65f6\u95f4\u201d\u65f6\u8fdb\u884c\u9053\u5fb7\u7ed1\u67b6\u6216\u7126\u8651\u8d29\u5356\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5f53\u524d\u9636\u6bb5\u4efb\u4f55\u5927\u989d\u8bfe\u7a0b\u63a8\u4ecb\u90fd\u4f1a\u7834\u574f\u5176\u201c\u5c1d\u9c9c\u201d\u7684\u8f7b\u677e\u5fc3\u6001\uff0c\u6781\u6613\u5f15\u53d1\u53cd\u611f\u4e0e\u9000\u8d39\u3002\u4ec5\u53ef\u8003\u8651\u672a\u6765\u57fa\u4e8e\u5176\u5177\u4f53\u6210\u679c\uff08\u5982\u6210\u529f\u8bd5\u97f3\uff09\u540e\uff0c\u63a8\u8350500\u5143\u4ee5\u5185\u7684\u4e13\u9879\u6280\u5de7\u5fae\u8bfe\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u8fd9\u70b9\u770b\u5b69\u5b50\uff0c\u987e\u4e0d\u4e0a\u76f4\u64ad\uff0c\u665a\u4e0a\u6211\u770b\u56de\u653e\uff0c\u8bd5\u97f3\u5355\u6211\u5f55\u5b8c\u53d1\u4f60\u5c31\u884c\u5427\u201d \u2014\u2014 **\u3010\u65f6\u95f4\u788e\u7247\u5316\u7684\u6838\u5fc3\u8bc1\u636e\u3011**\n2. > \u201c\u6700\u540e\u4e24\u6bb5\u8bf4\u7684\u786e\u5b9e\u662f\uff0c\u6211\u4e5f\u662f\u4e24\u4e2a\u52a8\u7269\u60f3\u8868\u8fbe\u51fa\u6765\uff0c\u5634\u4e0a\u60f3\u8bf4\u53c8\u611f\u89c9\u653e\u4e0d\u5f00\u8bf4\u201d \u2014\u2014 **\u3010\u6709\u5c1d\u8bd5\u610f\u613f\u4f46\u9700\u8981\u5f15\u5bfc\u548c\u9f13\u52b1\uff0c\u975e\u7ed3\u679c\u9a71\u52a8\u3011**\n3. > \u201c\u4e0d\u77e5\u9053\u672a\u6765\u4f1a\u53d1\u5c55\u6210\u4ec0\u4e48\u6837\uff0c\u4f46\u662f\u6211\u613f\u610f\u76f8\u4fe1\u4f60\uff0c\u9047\u89c1\u66f4\u597d\u7684\u81ea\u5df1\uff01\u201d \u2014\u2014 **\u3010\u6838\u5fc3\u9a71\u52a8\u662f\u201c\u63a2\u7d22\u81ea\u6211\u201d\u548c\u201c\u60c5\u611f\u4fe1\u4efb\u201d\uff0c\u800c\u975e\u77ed\u671f\u91d1\u94b1\u56de\u62a5\u3011**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T5\u597d\u73a9\u5c1d\u9c9c\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u793e\u4ea4\u5f52\u5c5e\u4e0e\u81ea\u6211\u63a2\u7d22\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u9ad8\u5f39\u6027\u3001\u9ad8\u9f13\u52b1\u3001\u4f4e\u538b\u529b\u7684\u5f02\u6b65\u966a\u4f34\u5b66\u4e60\u8def\u5f84\uff0c\u4e25\u9632\u65f6\u95f4\u538b\u57ae\u3011**\u3002\n\n```json\n{\"core_type\": \"T5 \u597d\u73a9\u5c1d\u9c9c\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u793e\u4ea4/\u5c0a\u91cd\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf\"}\n```";
