    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a325886022\uff08\u6635\u79f0\uff1a\u51c0\u57df\u8377\u9999\uff09\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 325886022 / \u6635\u79f0\uff1a\u51c0\u57df\u8377\u9999 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5fae\u6f9c\u5b66\u59d0-\u5b98\u65b9\u62db\u52df\u5b98\uff08\u8def\u4e91\uff09\u3001\u4e91\u67353\uff08\u8def\u4e91\uff09\u3001\u4e00\u975e\uff08\u5434\u4e00\u975e\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u7cbe\u82f1\u8bfe\u7a0b\uff082\u4e2a\u6708\uff09\uff0c\u4ef7\u683c3980\u5143 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u5168\u6b3e\u5145\u88d5**\uff08\u76f4\u63a5\u652f\u4ed83980\u5143\uff0c\u65e0\u5206\u671f\u3001\u501f\u8d37\u8ff9\u8c61\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u9ad8\u5bbd\u88d5**\uff08\u9000\u4f11\u4eba\u5458\uff0c\u65f6\u95f4\u81ea\u7531\uff0c\u4f46\u81ea\u8ff0\u7cbe\u529b\u3001\u8bb0\u5fc6\u529b\u4e0b\u964d\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u5355\u8eab\u72ec\u7acb**\uff08\u4e3a\u513f\u5b50\u4e70\u623f\u800c\u517c\u804c\uff0c\u51b3\u7b56\u72ec\u7acb\uff0c\u65e0\u5bb6\u5ead\u5e72\u9884\u4fe1\u53f7\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\uff08\u7528\u6237\u4e3b\u52a8\u63d0\u4f9b\u4e86\u5927\u91cf\u4e2a\u4eba\u4fe1\u606f\u3001\u52a8\u673a\u3001\u987e\u8651\u548c\u80fd\u529b\u80cc\u666f\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e\uff0c\u4f46\u5939\u6742\u7740\u5174\u8da3\u3001\u81ea\u6211\u4ef7\u503c\u5b9e\u73b0\u4e0e\u9632\u8131\u8282\u9700\u6c42\u3002** \u7528\u6237\u660e\u786e\u8868\u793a\u201c\u60f3\u591a\u6323\u70b9\u94b1\u7ed9\u6211\u513f\u5b50\u4e70\u623f\u5b50\u201d\uff0c\u8fd9\u662f\u5178\u578b\u7684T4\u53d8\u73b0\u9a71\u52a8\u3002\u4f46\u540c\u65f6\uff0c\u5979\u5bf9\u4f20\u7edf\u6587\u5316\u3001\u4eba\u6587\u5386\u53f2\u6709\u6d53\u539a\u5174\u8da3\uff0c\u5e76\u5f3a\u8c03\u81ea\u5df1\u201c\u5b66\u4e60\u80fd\u529b\u6bd4\u8f83\u5f3a\u201d\uff0c\u9000\u4f11\u540e\u5bfb\u6c42\u65b0\u6280\u80fd\uff0c\u4e5f\u4f53\u73b0\u4e86\u9632\u8131\u8282\u548c\u81ea\u6211\u5b9e\u73b0\u7684\u6df7\u5408\u52a8\u673a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n    > \u201c\u6211\u521a\u9000\u4f11\uff0c\u505a\u517c\u804c\uff0c\u662f\u60f3\u591a\u6323\u70b9\u94b1\u7ed9\u6211\u513f\u5b50\u4e70\u623f\u5b50\u3002\u6211\u513f\u5b50\u8fd8\u6ca1\u6709\u7ed3\u5a5a\u6210\u5bb6\u201d\n    > \u201c\u56e0\u4e3a\u6211\u559c\u6b22\u4f20\u7edf\u6587\u5316\uff0c\u4eba\u6587\u5386\u53f2\u5730\u7406\uff0c\u54f2\u5b66\u201d\n    > \u201c\u6211\u4ee5\u524d\u5728\u5355\u4f4d\u4e0a\u73ed\uff0c\u80fd\u529b\u8fd8\u662f\u5f88\u5f3a\u7684...\u5199\u4f5c\u529f\u5e95\u597d\uff0c\u4e5f\u4f1a\u57fa\u672c\u7684\u89c6\u9891\u548c\u56fe\u7247\u526a\u8f91\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 **\u8d44\u91d1\u627f\u8f7d\u529b**\uff1a**\u4e2d** \u2014 \u80fd\u4e00\u6b21\u6027\u652f\u4ed83980\u5143\u5168\u6b3e\uff0c\u65e0\u7ecf\u6d4e\u538b\u529b\u4fe1\u53f7\uff0c\u4f46\u52a8\u673a\u662f\u4e3a\u513f\u5b50\u6512\u94b1\uff0c\u975e\u9ad8\u6d88\u8d39\u9636\u5c42\u3002\n- \u23f1 **\u65f6\u95f4\u4e0e\u7cbe\u529b**\uff1a**\u4e2d** \u2014 \u9000\u4f11\u72b6\u6001\uff0c\u65f6\u95f4\u5145\u88d5\u3002\u4f46**\u6838\u5fc3\u77ed\u677f**\uff1a**56\u5c81\u9ad8\u9f84\uff0c\u81ea\u8ff0\u201c\u4f53\u529b\u548c\u8bb0\u5fc6\u8fd8\u662f\u6709\u4e0b\u964d\uff0c\u7cbe\u529b\u6ca1\u6709\u4ee5\u524d\u597d\u4e86\u201d**\uff0c\u4e14\u5b58\u5728**\u542c\u529b\u969c\u788d\uff08\u9700\u6234\u52a9\u542c\u5668\uff09**\u3002\u8fd9\u662f\u5178\u578b\u7684\u751f\u7406\u6027\u8d44\u6e90\u8870\u51cf\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 **\u5bb6\u5ead\u652f\u6301\u5ea6**\uff1a**\u9ad8** \u2014 \u51b3\u7b56\u72ec\u7acb\uff0c\u65e0\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b07\u4f4e (3-4\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u5b58\u5728\u660e\u663e\u7684\u81ea\u6211\u6000\u7591\u548c\u754f\u96be\u60c5\u7eea\uff0c\u9700\u8981\u5916\u90e8\u80af\u5b9a\u548c\u8282\u594f\u8c03\u6574\u3002** \u9762\u5bf9\u5b66\u4e60\u8282\u594f\u548c\u96be\u5ea6\uff0c\u8868\u73b0\u51fa\u7126\u8651\u548c\u4e0d\u81ea\u4fe1\uff0c\u4f46\u80fd\u901a\u8fc7\u6c9f\u901a\u8868\u8fbe\u8bc9\u6c42\uff0c\u672a\u5230\u5d29\u6e83\u8fb9\u7f18\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n    > \u201c\u4f46\u662f\u621156\u5c81\u4e86\uff0c\u521a\u624d\u542c\u4e86\u8bfe\uff0c\u770b\u8001\u5e08\u6f14\u793a\uff0c\u611f\u89c9\u540e\u671f\u6709\u70b9\u96be\u554a\u201d\n    > \u201c\u6211\u6015\u5b66\u4e0d\u597d\u3002\u56e0\u4e3a\u6211\u5e73\u5e38\u5c31\u662f\u547c\u5438\u6362\u6c14\u4e0d\u7a33\uff0c\u611f\u89c9\u4e2d\u6c14\u4e0d\u8db3\u554a\u201d\n    > \u201c\u6211\u770b\u4e86\u4f60\u53d1\u7684\u8d44\u6599\uff0c\u611f\u89c9\u7ec3\u4e60\u6709\u70b9\u96be\u201d\n    > \u201c\u53ea\u662f\u73b0\u572856\u5c81\u4e86\uff0c\u4f53\u529b\u548c\u8bb0\u5fc6\u8fd8\u662f\u6709\u4e0b\u964d\uff0c\u7cbe\u529b\u6ca1\u6709\u4ee5\u524d\u597d\u4e86\u3002\u6240\u4ee5\u5f3a\u5ea6\u592a\u5feb\u4e86\uff0c\u611f\u89c9\u5403\u529b\u201d\n    > \u201c\u4f60\u4eec\u786e\u5b9e\u5f88\u8d1f\u8d23\uff0c\u6548\u7387\u9ad8\uff0c\u5982\u679c\u8282\u594f\u518d\u6162\u4e00\u70b9\u5c31\u66f4\u597d\u4e86\uff01\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42\uff08\u7ecf\u6d4e\u4fdd\u969c\uff09\u4e0e \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42\uff08\u4ef7\u503c\u8ba4\u540c\uff09\u7684\u6df7\u5408\u4f53**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5e74\u9f84\u4e0e\u8eab\u4f53\u673a\u80fd\u5e26\u6765\u7684\u4e0d\u81ea\u4fe1\u4e0e\u7126\u8651\u3002** \u5979\u62c5\u5fc3\u81ea\u5df1\u201c\u5b66\u4e0d\u4f1a\u201d\u3001\u201c\u8ddf\u4e0d\u4e0a\u8282\u594f\u201d\u3001\u201c\u7cbe\u529b\u4e0d\u8db3\u201d\uff0c\u5bb3\u6015\u88ab\u5feb\u901f\u53d1\u5c55\u7684\u65f6\u4ee3\u548c\u8bfe\u7a0b\u8fdb\u5ea6\u629b\u5f03\uff0c\u8fd9\u672c\u8d28\u4e0a\u662f\u5b89\u5168\u611f\u7684\u7f3a\u5931\u3002\u540c\u65f6\uff0c\u5979\u53cd\u590d\u5f3a\u8c03\u81ea\u5df1\u201c\u80fd\u529b\u5f3a\u201d\u3001\u201c\u5199\u4f5c\u529f\u5e95\u597d\u201d\uff0c\u6e34\u671b\u83b7\u5f97\u4e0e\u8fc7\u53bb\u804c\u573a\u80fd\u529b\u76f8\u5339\u914d\u7684\u5c0a\u91cd\u548c\u8ba4\u53ef\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u201d\u7684\u5c0a\u91cd\u611f\u4e0e\u201c\u80fd\u8ddf\u4e0a\u201d\u7684\u5b89\u5168\u611f\u3002** \u65e2\u8981\u80af\u5b9a\u5979\u8fc7\u5f80\u7684\u80fd\u529b\uff08\u8d22\u52a1\u3001\u5199\u4f5c\u3001\u5b66\u4e60\u80fd\u529b\uff09\uff0c\u7ed9\u4e88\u5979\u201c\u5b9d\u5200\u672a\u8001\u201d\u7684\u5c0a\u91cd\uff1b\u53c8\u8981\u4e3a\u5979\u63d0\u4f9b\u201c\u6162\u8282\u594f\u201d\u3001\u201c\u53ef\u6d88\u5316\u201d\u7684\u5b66\u4e60\u8def\u5f84\uff0c\u6d88\u9664\u5979\u5bf9\u5b66\u4e60\u96be\u5ea6\u7684\u6050\u60e7\uff0c\u91cd\u5efa\u201c\u6211\u80fd\u5b66\u4f1a\u201d\u7684\u5b89\u5168\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b (\u98ce\u9669\u7ba1\u63a7\u578b)** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b (\u5411\u6df7\u5408\u4f535\u53f7\u8fdb\u5316\u4e2d)** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u65e0\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\u3002\u652f\u4ed8\u884c\u4e3a\u4e3a\u5168\u6b3e\uff0c**\u4ea4\u6613\u4fe1\u53f7\u786c\u62e6\u622a\u5c42\u672a\u89e6\u53d1**\u3002\n\n**\u5224\u5b9a\u6811\u8def\u5f84\u63a8\u6f14**\uff1a\n1.  **\u52a8\u673a\u7eaf\u5ea6 (5-6\u5206)**\uff1a\u660e\u786e\u517c\u804c\u53d8\u73b0+\u5174\u8da3+\u9632\u8131\u8282\uff0c\u5c5e\u4e2d\u7b49\u3002\n2.  **\u8d44\u6e90\u5e95\u5ea7 (5-6\u5206)**\uff1a\u65f6\u95f4\u5145\u88d5\u4f46\u5b58\u5728**\u5e74\u9f84\uff0856\u5c81\uff09\u3001\u542c\u529b\u969c\u788d\u3001\u7cbe\u529b\u4e0b\u964d**\u7b49\u663e\u8457\u77ed\u677f\uff0c\u7efc\u5408\u8bc4\u7ea7\u4e3a\u4e2d\u3002\n3.  **\u5fc3\u7406\u5f39\u6027 (3-4\u5206)**\uff1a\u591a\u6b21\u8868\u8fbe\u754f\u96be\u3001\u81ea\u6211\u6000\u7591\uff0c\u9700\u8981\u9f13\u52b1\u548c\u8282\u594f\u8c03\u6574\uff0c\u8bc4\u7ea7\u4e3a\u4f4e\u3002\n4.  **\u5224\u5b9a\u6811\u5206\u6d41**\uff1a\u52a8\u673a\u22655\u5206\uff0c\u5f39\u6027\u22644\u5206\uff0c\u8fdb\u5165**\u4f4e\u5f39\u6027\u901a\u9053**\u3002\u8d44\u6e90\u5e95\u5ea7\u867d\u4e3a\u4e2d\uff0c\u4f46\u5e74\u9f84\u226550\u4e14\u5b58\u5728\u201c\u542c\u529b\u969c\u788d\u201d\u3001\u201c\u8ddf\u4e0d\u4e0a\u8282\u594f\u201d\u7b49\u6570\u5b57/\u5b66\u4e60\u6050\u614c\u4fe1\u53f7\uff0c\u7b26\u5408**\u6df7\u5408\u4f535\u53f7\uff08\u6570\u5b57\u6df1\u6d77\u5b64\u5c9b = T6 + T9\uff09** \u7684\u89e6\u53d1\u6761\u4ef6\uff1a**T9\uff08\u6570\u5b57/\u5b66\u4e60\u76f2\u533a\uff09\u7684\u6050\u614c + T6\uff08\u60c5\u7eea\u5185\u8017\uff09\u7684\u81ea\u5351\u4fe1\u53f7**\u3002\u7528\u6237\u5c1a\u672a\u51fa\u73b0\u201c\u51cc\u6668\u5d29\u6e83\u957f\u6587\u201d\uff0c\u4f46\u5df2\u663e\u9732\u51fa\u201c\u6df1\u6d77\u5b64\u5c9b\u201d\u7684\u65e9\u671f\u7279\u5f81\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| **\u5bb6\u5ead\u5e72\u9884\u578b** | **\u4f4e** | \u51b3\u7b56\u72ec\u7acb\uff0c\u4e3a\u5bb6\u5ead\uff08\u513f\u5b50\uff09\u8d5a\u94b1\uff0c\u5bb6\u5ead\u662f\u52a8\u529b\u800c\u975e\u963b\u529b\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669\uff01** \u8bfe\u7a0b\u8282\u594f\u8fc7\u5feb\u3001\u4f5c\u4e1a\u96be\u5ea6\u8d85\u51fa\u5176\u7cbe\u529b/\u542c\u529b\u627f\u53d7\u8303\u56f4\uff0c\u5bfc\u81f4\u201c\u5b66\u4e0d\u8fc7\u6765\u201d\u7684\u632b\u8d25\u611f\u7d2f\u79ef\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u9ad8** | **\u6781\u9ad8\u98ce\u9669\uff01** \u5bf9\u201c\u5b66\u4e0d\u4f1a\u201d\u7684\u6050\u60e7\u5df2\u591a\u6b21\u8868\u8fbe\u3002\u4e00\u65e6\u7b2c\u4e00\u6b21\u4f5c\u4e1a\u88ab\u4e25\u5389\u70b9\u8bc4\u6216\u6280\u672f\u64cd\u4f5c\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u3001\u753b\u672c\uff09\u53d7\u632b\uff0c\u6781\u6613\u56e0\u81ea\u5c0a\u5fc3\u53d7\u632b\uff08\u201c\u6211\u592a\u7b28\u4e86\u201d\uff09\u800c\u89e6\u53d1\u9000\u8d39\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u4e2d** | \u867d\u6709\u53d8\u73b0\u671f\u671b\uff0c\u4f46\u5f53\u524d\u8868\u8fbe\u66f4\u4fa7\u91cd\u4e8e\u201c\u5b66\u4f1a\u201d\u800c\u975e\u201c\u9a6c\u4e0a\u8d5a\u94b1\u201d\u3002\u82e5\u5b66\u4e60\u8fc7\u7a0b\u4e0d\u987a\uff0c\u6536\u76ca\u671f\u671b\u4f1a\u8fc5\u901f\u8f6c\u5316\u4e3a\u9000\u8d39\u7406\u7531\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c1-2\u5468**\u3002\u5f53\u6b63\u5f0f\u8bfe\u7a0b\u5f00\u59cb\uff0c\u9762\u5bf9\u66f4\u7cfb\u7edf\u7684\u5b66\u4e60\u4efb\u52a1\u548c\u7b2c\u4e00\u6b21\u5b9e\u64cd\u4f5c\u4e1a\u65f6\uff0c\u5979\u7684\u7cbe\u529b\u77ed\u677f\u3001\u64cd\u4f5c\u6050\u60e7\u548c\u81ea\u6211\u6000\u7591\u4f1a\u96c6\u4e2d\u7206\u53d1\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u5979\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u5979\u8bf4......\u201d**\n> \u201c\u5411\u5f64\u59d0\uff0c\u770b\u5230\u60a8\u62a5\u540d\u4e86\u7279\u522b\u5f00\u5fc3\uff01\u60a8\u4e4b\u524d\u662f\u8d22\u52a1\uff0c\u505a\u4e8b\u80af\u5b9a\u7279\u522b\u6709\u6761\u7406\uff0c\u8fd9\u70b9\u5728\u5b66\u4e60\u4e0a\u7edd\u5bf9\u662f\u4f18\u52bf\u3002\u54b1\u4eec\u8bfe\u7a0b\u4e0d\u8d76\u8fdb\u5ea6\uff0c\u60a8\u5b8c\u5168\u6309\u81ea\u5df1\u7684\u8282\u594f\u6765\uff0c\u6709\u4efb\u4f55\u89c9\u5f97\u5feb\u7684\u5730\u65b9\u968f\u65f6\u558a\u505c\uff0c\u6211\u5e2e\u60a8\u68b3\u7406\u3002\u60a8\u542c\u529b\u4e0d\u592a\u65b9\u4fbf\uff0c\u4ee5\u540e\u6240\u6709\u91cd\u8981\u901a\u77e5\u6211\u90fd\u7ed9\u60a8\u5355\u72ec\u6587\u5b57\u53d1\u4e00\u904d\uff0c\u9700\u8981\u542c\u7684\u8d44\u6599\u6211\u4e5f\u5c3d\u91cf\u627e\u6587\u5b57\u7248\u3002\u54b1\u4eec\u6162\u6162\u5b66\uff0c\u7a33\u7a33\u5730\u6765\uff0c\u60a8\u80af\u5b9a\u6ca1\u95ee\u9898\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u9002\u8001\u9632\u8131\u8282\u4f34\u98de\u8425 (\u4ea7\u54c1\u7ebfC)\u3011**\u3002\u6838\u5fc3\u662f**\u964d\u7ef4\u3001\u653e\u6162\u3001\u5168\u966a\u4f34**\u3002\u7edd\u4e0d\u80fd\u628a\u5979\u6254\u8fdb\u201c\u786c\u6838\u641e\u94b1\u8425\u201d\u7684\u5feb\u8282\u594f\u91cc\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n    1.  **\u3010\u6838\u5f39\u7ea7\u7279\u79cdA(\u8fdc\u7a0b\u7269\u7406\u4ee3\u529e)\u3011**\uff1a\u5bf9\u4e8e\u8f6f\u4ef6\u5b89\u88c5\u3001\u5e73\u53f0\u5165\u9a7b\u3001\u4f5c\u4e1a\u63d0\u4ea4\u7b49\u64cd\u4f5c\uff0c\u4e00\u65e6\u5979\u8868\u73b0\u51fa\u56f0\u60d1\uff0c\u7acb\u5373\u542f\u52a8\u201c\u8001\u5e08\u5e2e\u4f60\u5f04\u201d\u6a21\u5f0f\uff0c\u7528ToDesk/\u5411\u65e5\u8475\u8fdc\u7a0b\u89e3\u51b3\uff0c**\u7edd\u4e0d**\u53d1\u56fe\u6587\u6559\u7a0b\u8ba9\u5979\u81ea\u5df1\u7814\u7a76\u3002\n    2.  **\u3010\u6ee1\u914d\u7279\u79cdC(\u60c5\u7eea\u6258\u5e95)\u3011**\uff1a\u73ed\u4e3b\u4efb\u9700\u626e\u6f14\u201c\u7ebf\u4e0a\u5973\u513f\u201d\u89d2\u8272\uff0c\u7ed9\u4e88\u9ad8\u9891\u3001\u5938\u5f20\u7684\u6b63\u9762\u53cd\u9988\u3002\u201c\u59d0\uff0c\u60a8\u8fd9\u4e2a\u7406\u89e3\u529b\u592a\u5f3a\u4e86\uff01\u201d\u201c\u522b\u7740\u6025\uff0c\u54b1\u8fd9\u4e2a\u5e74\u9f84\u5b66\u8fd9\u4e2a\u5c31\u662f\u6162\u5de5\u51fa\u7ec6\u6d3b\uff0c\u60a8\u5df2\u7ecf\u6bd4\u5f88\u591a\u5e74\u8f7b\u4eba\u5f3a\u591a\u4e86\uff01\u201d\n    3.  **\u3010\u6218\u7565\u6027\u62d2\u5356\u7194\u65ad\u3011**\uff1a\u4e25\u7981\u5728\u57fa\u7840\u8bfe\u672a\u6d88\u5316\u65f6\uff0c\u5411\u5979\u4ea4\u53c9\u63a8\u9500\u4efb\u4f55\u9ad8\u9636\u8bfe\u7a0b\uff08\u5982\u540e\u671f\u8bfe\u3001AI\u8bfe\uff09\u3002\u8981\u4e3b\u52a8\u66ff\u5979\u505a\u51cf\u6cd5\uff1a\u201c\u59d0\uff0c\u60a8\u5148\u628a\u914d\u97f3\u57fa\u7840\u6253\u7262\uff0c\u540e\u671f\u90a3\u4e9b\u590d\u6742\u7684\u54b1\u4eec\u5148\u4e0d\u78b0\u3002\u201d\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1.  \u7528\u201c\u6700\u540e\u540d\u989d\u201d\u3001\u201c\u5012\u8ba1\u65f6\u201d\u7b49\u8bdd\u672f\u50ac\u903c\u3002\n    2.  \u7528\u201c\u5e74\u8f7b\u4eba\u5b66\u5f97\u5feb\u201d\u7b49\u8a00\u8bba\u8fdb\u884c\u65e0\u610f\u8bc6\u5bf9\u6bd4\uff0c\u52a0\u5267\u5176\u5e74\u9f84\u7126\u8651\u3002\n    3.  \u5728\u5979\u8868\u8fbe\u201c\u96be\u201d\u3001\u201c\u8ddf\u4e0d\u4e0a\u201d\u65f6\uff0c\u56de\u590d\u201c\u591a\u7ec3\u7ec3\u5c31\u4f1a\u4e86\u201d\u4e4b\u7c7b\u7684\u6577\u884d\u8bdd\u672f\u3002\n    4.  \u5728\u5979\u64cd\u4f5c\u5361\u58f3\u65f6\uff0c\u53d1\u9001\u51b0\u51b7\u7684PDF\u6559\u7a0b\u94fe\u63a5\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u5b66\u4e60\u521d\u671f\uff08\u81f3\u5c11\u524d2\u4e2a\u6708\uff09\u4e25\u7981\u4efb\u4f55\u5347\u5355\u63a8\u9500**\u3002\u5f85\u5176\u5efa\u7acb\u8db3\u591f\u5b89\u5168\u611f\u548c\u521d\u6b65\u6210\u5c31\u611f\u540e\uff0c\u53ef\u8c28\u614e\u8bd5\u63a2\u8f7b\u91cf\u7ea7\u60c5\u7eea\u4ea7\u54c1\uff08\u5982\u5b9a\u5236\u58f0\u97f3\u76f2\u76d2\uff09\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u4f46\u662f\u621156\u5c81\u4e86**\uff0c\u521a\u624d\u542c\u4e86\u8bfe\uff0c\u770b\u8001\u5e08\u6f14\u793a\uff0c\u611f\u89c9\u540e\u671f\u6709\u70b9\u96be\u554a\u201d\n2. > \u201c\u8fd8\u6709\u6211\u542c\u529b\u56e0\u4e3a\u5f97\u8fc7\u75c5\uff0c\u6253\u4e86\u94fe\u9709\u7d20\uff0c\u542c\u795e\u7ecf\u6709\u635f\u4f24\uff0c\u5df2\u7ecf33\u5e74\u4e86\uff0c\u6211\u73b0\u5728\u6234\u7684\u52a9\u542c\u5668\uff0c\u6709\u65f6\u5019\u6ca1\u6709\u5b57\u5e55\uff0c\u4e0d\u600e\u4e48\u542c\u5f97\u6e05\u695a\uff0c\u6709\u6ca1\u6709\u5f71\u54cd\u54df\u201d\n3. > \u201c\u53ea\u662f\u73b0\u572856\u5c81\u4e86\uff0c\u4f53\u529b\u548c\u8bb0\u5fc6\u8fd8\u662f\u6709\u4e0b\u964d\uff0c\u7cbe\u529b\u6ca1\u6709\u4ee5\u524d\u597d\u4e86\u3002\u6240\u4ee5**\u5f3a\u5ea6\u592a\u5feb\u4e86\uff0c\u611f\u89c9\u5403\u529b**\u201d\n4. > \u201c\u4f60\u4eec\u786e\u5b9e\u5f88\u8d1f\u8d23\uff0c\u6548\u7387\u9ad8\uff0c\u5982\u679c**\u8282\u594f\u518d\u6162\u4e00\u70b9\u5c31\u66f4\u597d\u4e86\uff01**\u201d\n5. > \u201c\u6211\u6015\u5b66\u4e0d\u597d\u3002\u56e0\u4e3a\u6211\u5e73\u5e38\u5c31\u662f\u547c\u5438\u6362\u6c14\u4e0d\u7a33\uff0c\u611f\u89c9\u4e2d\u6c14\u4e0d\u8db3\u554a\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010\u6df7\u5408\u4f535\u53f7\uff1a\u6570\u5b57\u6df1\u6d77\u5b64\u5c9b\u8131\u56f0\u8005\uff08T6\u60c5\u7eea\u5de8\u5a74 + T9\u6570\u5b57/\u5b66\u4e60\u76f2\u533a\uff09\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\uff08\u8ddf\u4e0a\u8282\u594f\uff09\u4e0e\u5c0a\u91cd\uff08\u4ef7\u503c\u8ba4\u53ef\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u542f\u52a8\u201c\u6838\u5f39\u7ea7\u7279\u79cdA+\u6ee1\u914d\u7279\u79cdC\u201d\u7ec4\u5408\u62f3\uff1a\u8fdc\u7a0b\u7269\u7406\u4ee3\u529e + \u5168\u5929\u5019\u60c5\u7eea\u6258\u5e95\uff0c\u5c06\u5b66\u4e60\u8282\u594f\u653e\u6162\u81f3\u5176\u8212\u9002\u533a\uff0c\u7528\u201c\u88ab\u5168\u7a0b\u6400\u6276\u201d\u7684\u5b89\u5168\u611f\u9501\u6b7b\u4fe1\u4efb\u3011**\u3002\n\n```json\n{\"core_type\": \"\u6df7\u5408\u4f535\u53f7\uff1a\u6570\u5b57\u6df1\u6d77\u5b64\u5c9b\u8131\u56f0\u8005 (T6\u60c5\u7eea\u5de8\u5a74+T9\u6570\u5b57\u76f2\u533a)\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\u4e0e\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u9002\u8001\u9632\u8131\u8282\u4f34\u98de\u8425 (\u4ea7\u54c1\u7ebfC)\"}\n```";
