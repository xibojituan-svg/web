        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677175335 (\u6635\u79f0: \u5c0fU) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u516d\u6708\u6668\u516e(\u738b\u8339) -> \u53ef\u4e3d\u513f(\u5b54\u4ee4\u5a77) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u9ad8\u9636\u73ed (7380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u4fe1\u606f\u4e0d\u8db3\u3002\u7528\u6237\u76f4\u63a5\u652f\u4ed82380\u5143\uff08\u53ef\u80fd\u4e3a\u5b9a\u91d1\u6216\u90e8\u5206\u6b3e\u9879\uff09\uff0c\u672a\u63d0\u53ca\u8d44\u91d1\u6765\u6e90\u3002**\u9700\u8b66\u60d5\u540e\u7eed\u652f\u4ed8\u538b\u529b**\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4e2d\uff08\u788e\u7247\u5316\u62fc\u51d1\uff09**\u3002\u7528\u6237\u56e0\u5de5\u4f5c\u539f\u56e0\u65e0\u6cd5\u53c2\u52a0\u4e2d\u5348\u76f4\u64ad\uff0c\u9700\u770b\u665a\u4e0a\u5f55\u64ad\uff0c\u8868\u660e\u6709\u56fa\u5b9a\u4e3b\u4e1a\uff0c\u65f6\u95f4\u9700\u534f\u8c03\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u4fe1\u606f\uff0c**\u6b64\u4e3a\u9ad8\u98ce\u9669\u76f2\u533a**\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u5b66\u4e60\u884c\u4e3a\u4e0e\u6001\u5ea6\u4fe1\u606f\u9971\u6ee1\uff0c\u4f46\u5173\u952e\u51b3\u7b56\u4fe1\u606f\uff08\u8d44\u91d1\u3001\u5bb6\u5ead\uff09\u7f3a\u5931\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u660e\u786e\u5bf9\u201c\u5f55\u4e66\u548c\u753b\u672c\u201d\u6709\u5174\u8da3\uff0c\u5e76\u4e3b\u52a8\u63d0\u53ca\u201c\u82f1\u8bed\u53e3\u8bed\u57fa\u7840\u201d\uff0c\u663e\u793a\u51fa\u5bf9\u6280\u80fd\u672c\u8eab\u7684\u63a2\u7d22\u6b32\u3002\u4f46\u540c\u65f6\uff0c\u9500\u552e\u5168\u7a0b\u4ee5\u201c\u517c\u804c\u53d8\u73b0\u201d\u3001\u201c\u5feb\u901f\u6323\u5230\u7b2c\u4e00\u6876\u91d1\u201d\u5f15\u5bfc\uff0c\u7528\u6237\u79ef\u6781\u54cd\u5e94\uff0c\u8868\u660e\u5bf9\u53d8\u73b0\u6709\u660e\u786e\u671f\u5f85\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u201c\u51e0\u5929\u5185\u5fc5\u987b\u8d5a\u94b1\u201d\u7684\u6781\u7aef\u6025\u8feb\u6027\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5f55\u4e66\u548c\u753b\u672c\u975e\u5e38\u6709\u5174\u8da3\u201d & \u201c\u672c\u4eba\u4e5f\u6709\u4e00\u70b9\u82f1\u8bed\u53e3\u8bed\u57fa\u7840\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u652f\u4ed82380\u5143\u672a\u8868\u73b0\u538b\u529b\uff0c\u4f467380\u5143\u603b\u4ef7\u53ca\u540e\u7eed\u652f\u4ed8\u80fd\u529b\u672a\u77e5\u3002**\u9700\u91cd\u70b9\u6838\u67e5**\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u5b8c\u6210\u65e9\u529f\u3001\u4f5c\u4e1a\u3001\u8bd5\u97f3\uff0c\u4f46\u9700\u8c03\u6574\u65f6\u95f4\u770b\u5f55\u64ad\uff0c\u8868\u660e\u65f6\u95f4\u975e\u5b8c\u5168\u81ea\u7531\uff0c\u9700\u4ece\u4e3b\u4e1a\u4e2d\u6324\u51fa\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 **\u9ad8\u98ce\u9669\u76f2\u533a**\u3002\u5b8c\u5168\u672a\u63d0\u53ca\uff0c\u9700\u7acb\u5373\u6838\u67e5\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u7528\u6237\u80fd\u63a5\u53d7\u4e13\u4e1a\u70b9\u8bc4\uff08\u201c\u4e00\u9488\u89c1\u8840\u201d\uff09\uff0c\u4e3b\u52a8\u7422\u78e8\u201c\u5bf9\u8c61\u611f\u201d\uff0c\u9047\u5230\u65f6\u95f4\u51b2\u7a81\u4e3b\u52a8\u8be2\u95ee\u89e3\u51b3\u65b9\u6848\uff08\u770b\u5f55\u64ad\uff09\uff0c\u5b66\u4e60\u884c\u4e3a\u79ef\u6781\u3001\u7a33\u5b9a\u3001\u914d\u5408\u5ea6\u9ad8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8001\u5e08\u7684\u4f5c\u4e1a\u70b9\u8bc4\u4e00\u9488\u89c1\u8840...\u9700\u8981\u5f88\u591a\u7ec3\u4e60\u201d & \u201c\u8001\u5e08 \u6211\u60f3\u8bf7\u6559\u4e00\u4e0b \u660e\u5929\u76f4\u64ad\u8bfe\u53ef\u80fd\u53c2\u52a0\u4e0d\u4e86 \u770b\u5f55\u64ad\u4f1a\u5f71\u54cd...\u5417\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u73b0\u6709\u4e3b\u4e1a\u53ef\u80fd\u7f3a\u4e4f\u6210\u5c31\u611f\u6216\u4ef7\u503c\u8ba4\u540c\uff0c\u6e34\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u9879\u201c\u9177\u201d\u7684\u6280\u80fd\uff08\u6709\u58f0\u6f14\u64ad\uff09\u83b7\u5f97\u65b0\u7684\u793e\u4f1a\u89d2\u8272\u3001\u4e13\u4e1a\u8ba4\u53ef\u548c\u81ea\u4fe1\uff0c\u5b9e\u73b0\u81ea\u6211\u4ef7\u503c\u7684\u63d0\u5347\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u201c\u88ab\u9009\u4e2d\u201d\u7684\u4f18\u8d8a\u611f**\u3002\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u770b\u597d\u4f60\u201d\u3001\u201c\u7ed9\u4f60\u9884\u7559\u540d\u989d\u201d\u3001\u201c\u6709\u5851\u9020\u6027\u201d\uff0c\u7528\u6237\u5bf9\u6b64\u79ef\u6781\u56de\u5e94\uff0c\u8868\u660e\u4ed6\u975e\u5e38\u9700\u8981\u88ab\u6743\u5a01\uff08\u8001\u5e08/\u5e73\u53f0\uff09\u8ba4\u53ef\u4e3a\u201c\u6709\u6f5c\u529b\u3001\u88ab\u7279\u522b\u5173\u7167\u201d\u7684\u5b66\u5458\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u52a8\u673a\u4e2d\u7b49\u3001\u8d44\u6e90\u5e95\u5ea7\u5b58\u5728\u76f2\u533a\u4f46\u884c\u4e3a\u79ef\u6781\u3001\u5fc3\u7406\u5f39\u6027\u9ad8) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u517c\u987eT3\u6b7b\u78d5\u5b66\u9738\u7279\u5f81) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u3002\u4f46**\u5bb6\u5ead\u652f\u6301\u5ea6\u4e0e\u5b8c\u6574\u652f\u4ed8\u80fd\u529b\u4e3a\u91cd\u5927\u672a\u77e5\u98ce\u9669**\uff0c\u9700\u5728\u4e0b\u4e00\u6b65\u7acb\u5373\u6838\u67e5\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | **\u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u98ce\u9669\u9ad8**\u3002\u82e5\u62a5\u540d\u5927\u989d\u8bfe\u7a0b\u4e3a\u9690\u7792\u5bb6\u4eba\u6216\u52a8\u7528\u5bb6\u5ead\u50a8\u5907\u91d1\uff0c\u540e\u671f\u6613\u5f15\u53d1\u51b2\u7a81\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u7528\u6237\u5b66\u4e60\u4e60\u60ef\u597d\uff0c\u4e3b\u52a8\u6027\u5f3a\uff0c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5c1a\u53ef\uff0c\u56e0\u5b66\u4e1a\u79ef\u538b\u5d29\u76d8\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u7406\u6027\u5bf9\u5f85\u6279\u8bc4\u4e0e\u56f0\u96be\uff0c\u4e0d\u5c5e\u4e8e\u60c5\u7eea\u6613\u788e\u4f53\u8d28\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u5bf9\u53d8\u73b0\u6709\u671f\u5f85\u3002\u82e5\u8fdb\u5165\u6b63\u5f0f\u5b66\u4e60\u540e\uff0c\u53d1\u73b0\u63a5\u5355\u96be\u5ea6\u3001\u56de\u62a5\u5468\u671f\u8fdc\u8d85\u9884\u671f\uff08\u5982\u9500\u552e\u627f\u8bfa\u7684\u201c\u5feb\u901f\u201d\uff09\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c3-4\u5468**\u3002\u65b0\u9c9c\u611f\u8fc7\u540e\uff0c\u82e5\u672a\u83b7\u5f97\u4efb\u4f55\u5b9e\u8d28\u6027\u7684\u201c\u88ab\u8ba4\u53ef\u201d\u673a\u4f1a\uff08\u5982\u8bd5\u97f3\u901a\u8fc7\u3001\u8001\u5e08\u7279\u522b\u6307\u5bfc\uff09\u6216\u5fae\u5c0f\u53d8\u73b0\uff0c\u540c\u65f6\u9762\u4e34\u65f6\u95f4\u7cbe\u529b\u6301\u7eed\u6295\u5165\u7684\u538b\u529b\uff0c\u5931\u671b\u60c5\u7eea\u53ef\u80fd\u7d2f\u79ef\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5c0fU\uff0c\u770b\u5230\u4f60\u8fd9\u51e0\u5929\u7684\u4f5c\u4e1a\u548c\u8bd5\u97f3\uff0c\u73ed\u73ed\u548c\u6559\u7814\u8001\u5e08\u90fd\u8ba8\u8bba\u8fc7\uff0c\u4e00\u81f4\u8ba4\u4e3a\u4f60\u7684\u58f0\u97f3\u6761\u4ef6\u548c\u5b66\u4e60\u6001\u5ea6\u5728\u6211\u4eec\u8fd9\u6279\u5b66\u5458\u91cc\u975e\u5e38\u7a81\u51fa\uff0c\u662f\u5c11\u6570\u51e0\u4e2a\u88ab\u6807\u8bb0\u4e3a\u2018\u9ad8\u6f5c\u529b\u5b66\u5458\u2019\u7684\u3002\u6240\u4ee5\u6211\u4eec\u4f1a\u7ed9\u4f60\u5339\u914d\u66f4\u7cbe\u51c6\u7684\u8bd5\u97f3\u8d44\u6e90\u548c1v1\u7684\u8fdb\u9636\u6307\u5bfc\uff0c\u671f\u5f85\u4f60\u6210\u4e3a\u54b1\u4eec\u73ed\u7684\u6807\u6746\u3002\u5f53\u7136\uff0c\u8fc7\u7a0b\u4e2d\u6709\u4efb\u4f55\u5361\u70b9\uff0c\u968f\u65f6\u627e\u6211\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176T2\u5b9e\u5e72\u5c5e\u6027\uff0c\u63d0\u4f9b\u624e\u5b9e\u7684\u6280\u80fd\u8bad\u7ec3\u548c\u660e\u786e\u7684\u8fdb\u9636\u8def\u5f84\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u201c\u5c0a\u91cd/\u81ea\u6211\u5b9e\u73b0\u201d\u9700\u6c42\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u5708\u5c42\u8eab\u4efd\u5305\u3011**\u3002\u4f8b\u5982\uff1a\u4efb\u547d\u4e3a\u5c0f\u7ec4\u957f\u3001\u63d0\u4f9b\u201c\u9ad8\u6f5c\u529b\u5b66\u5458\u201d\u4e13\u5c5e\u6807\u7b7e\u3001\u4f18\u5148\u83b7\u5f97\u5185\u90e8\u8bc4\u4f18\u548c\u5c55\u793a\u673a\u4f1a\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u8981\u53ea\u7ed9\u6cdb\u6cdb\u7684\u9f13\u52b1**\u3002\u53cd\u9988\u5fc5\u987b\u5177\u4f53\u3001\u4e13\u4e1a\u3001\u6709\u63d0\u5347\u70b9\uff0c\u5426\u5219\u4ed6\u4f1a\u89c9\u5f97\u4f60\u4e0d\u91cd\u89c6\u4ed6\u3002\n    2. **\u7edd\u4e0d\u8981\u62d6\u5ef6\u6216\u9057\u5fd8\u7ed9\u4ed6\u7684\u201c\u7279\u522b\u627f\u8bfa\u201d**\uff08\u5982\u9884\u7559\u7684\u4e66\u5355\u30011v1\u6307\u5bfc\uff09\uff0c\u4fe1\u7528\u5d29\u584c\u4f1a\u76f4\u63a5\u5bfc\u81f4\u5176\u5931\u671b\u79bb\u5f00\u3002\n    3. **\u5728\u672a\u6838\u5b9e\u652f\u4ed8\u80fd\u529b\u548c\u5bb6\u5ead\u652f\u6301\u524d\uff0c\u5207\u52ff\u76f2\u76ee\u63a8\u52a8\u5927\u989d\u5347\u5355**\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u6682\u7f13\u5927\u989d\u5347\u5355**\u3002\u5e94\u5148\u5b8c\u6210B\u7c7b\u670d\u52a1\u7684\u826f\u597d\u4ea4\u4ed8\uff0c\u5efa\u7acb\u6df1\u5ea6\u4fe1\u4efb\uff0c\u5e76**\u52a1\u5fc5\u79c1\u4e0b\u6838\u5b9e\u5176\u5bb6\u5ead\u652f\u6301\u4e0e\u8d22\u52a1\u60c5\u51b5**\u540e\uff0c\u518d\u8003\u8651\u540e\u7eed\u5347\u5355\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u8001\u5e08\u7684\u4f5c\u4e1a\u70b9\u8bc4\u4e00\u9488\u89c1\u8840 \u6211\u5c31\u662f\u8bcd\u8bed\u4e4b\u95f4\u6ca1\u6709\u62b1\u56e2 \u505c\u987f\u751f\u786c\u4e14\u6709\u7684\u4e0d\u7b26\u5408\u8bed\u5883 \u9700\u8981\u5f88\u591a\u7ec3\u4e60\u201d \u2014\u2014 **\u8bc1\u660e\u9ad8\u5fc3\u7406\u5f39\u6027\u4e0e\u5b9e\u5e72\u6001\u5ea6**\n2. > \u201c\u5f55\u4e66\u548c\u753b\u672c\u975e\u5e38\u6709\u5174\u8da3\u201d & \u201c\u672c\u4eba\u4e5f\u6709\u4e00\u70b9\u82f1\u8bed\u53e3\u8bed\u57fa\u7840\u201d \u2014\u2014 **\u8bc1\u660e\u5174\u8da3\u4e0e\u6280\u80fd\u63a2\u7d22\u9a71\u52a8\u7684\u4e2d\u7eaf\u5ea6\u52a8\u673a**\n3. > \u201c\u8001\u5e08 \u6211\u60f3\u8bf7\u6559\u4e00\u4e0b \u660e\u5929\u76f4\u64ad\u8bfe\u53ef\u80fd\u53c2\u52a0\u4e0d\u4e86 \u770b\u5f55\u64ad\u4f1a\u5f71\u54cd\u62a5\u540d\u4e13\u4e1a\u8bfe\u8fdb\u60a8\u7684\u5267\u7ec4\u5417\u201d \u2014\u2014 **\u8bc1\u660e\u79ef\u6781\u89e3\u51b3\u95ee\u9898\u3001\u9075\u5b88\u89c4\u5219\u7684\u9ad8\u914d\u5408\u5ea6**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2\u4f4e\u8c03\u5b9e\u5e72\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u4e0e\u5b9e\u73b0\u81ea\u6211\u4ef7\u503c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5151\u73b0\u201c\u7279\u522b\u770b\u597d\u201d\u7684\u627f\u8bfa\uff0c\u7ed9\u4e88\u8eab\u4efd\u8ba4\u53ef\u4e0e\u7cbe\u51c6\u7684\u786c\u6838\u6307\u5bfc\uff0c\u540c\u65f6\u73ed\u4e3b\u4efb\u9700\u7acb\u5373\u79c1\u4e0b\u6838\u67e5\u5176\u5bb6\u5ead\u652f\u6301\u5ea6\u4e0e\u5b8c\u6574\u652f\u4ed8\u80fd\u529b\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u9700\u6c42/\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u5708\u5c42\u8eab\u4efd\u5305\"}\n```";
