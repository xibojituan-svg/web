    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4ee5\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\u7684\u8eab\u4efd\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677162482 (\u6635\u79f0\uff1a\u559c\u6d0b\u6d0b) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u72d0\u4e4b\u592d\u592d5(\u8521\u6768)\u3001\u7b71\u6590\u3010\u5b98\u65b9S\u7ea7\u52a9\u6559\u3011(\u8521\u6768)\u3001\u9065\u8fdc\u4e0d\u8fdc(\u5f20\u6587\u9759) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u559c\u9a6c\u62c9\u96c5\u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u4ef7\u683c\u672a\u660e\u786e\uff0c\u63d0\u53ca\u201c7380\u201d\u53e3\u4ee4\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u5206\u671f\u6216\u501f\u8d37\u60c5\u51b5\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u6bcf\u5929\u788e\u7247\u5316\u53ef\u4ee5\u7528\u4e8e\u5b66\u4e60\u548c\u517c\u804c\u7684\u65f6\u95f4\uff1a2-4\u5c0f\u65f6\u201d\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\uff0c\u5728\u4fe1\u606f\u8868\u4e2d\u672a\u586b\u5199\u201c\u5bb6\u4eba\u662f\u5426\u652f\u6301\u201d\u9009\u9879\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u7528\u6237\u6709\u660e\u786e\u7684\u65f6\u95f4\u3001\u804c\u4e1a\u3001\u5b66\u4e60\u52a8\u673a\u9648\u8ff0\uff0c\u4f46\u7f3a\u4e4f\u5bb6\u5ead\u652f\u6301\u3001\u7ecf\u6d4e\u72b6\u51b5\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u7b49\u6df1\u5ea6\u4fe1\u606f\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e\uff0c\u4f46\u517c\u987e\u201c\u57f9\u517b\u5174\u8da3\u201d\u548c\u201c\u5b66\u4e60\u6280\u80fd\u201d\uff0c\u52a8\u673a\u76f8\u5bf9\u52a1\u5b9e\uff0c\u975e\u6781\u7aef\u53d8\u73b0\u9a71\u52a8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u672c\u60f3\u7740\u6280\u591a\u4e0d\u538b\u8eab\uff0c\u95f2\u6687\u65f6\u95f4\u5b66\u70b9\u4e1c\u897f\u633a\u597d\uff0c\ud83c\ude36\u989d\u5916\u7684\u6536\u5165\u4e5f\u633a\u597d\u201d\n  > \u201c\u6253\u7b97\u957f\u671f\u53d1\u5c55\u5427\uff0c\u968f\u4fbf\u73a9\u73a9\u5b66\u7740\u5c31\u5931\u53bb\u610f\u4e49\u4e86\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u7ecf\u6d4e\u72b6\u51b5\uff0c\u65e0\u6cd5\u5224\u65ad\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u6709\u56fa\u5b9a\u5de5\u4f5c\uff08\u624b\u672f\u5ba4\uff09\uff0c\u4f46\u80fd\u6324\u51fa2-4\u5c0f\u65f6\u788e\u7247\u65f6\u95f4\u5b66\u4e60\u3002**\u77ed\u677f\u5728\u4e8e\u65f6\u95f4\u4e0d\u56fa\u5b9a**\uff0c\u660e\u786e\u8868\u793a\u201c\u56fa\u5b9a\u65f6\u95f4\u7684\u8bdd\u4f1a\u51b2\u7a81\u201d\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\uff0c\u5b58\u5728\u6f5c\u5728\u98ce\u9669\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b06\u9ad8 (7-8\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)**\u3002\u9762\u5bf9\u9500\u552e\u5bc6\u96c6\u7684\u8bfe\u7a0b\u3001\u4f5c\u4e1a\u3001\u76f4\u64ad\u5b89\u6392\uff0c\u7528\u6237\u59cb\u7ec8\u4ee5\u201c\u597d\u7684\u201d\u3001\u201cokk\u201d\u3001\u201c\u53ef\u4ee5\u201d\u7b49\u7b80\u6d01\u3001\u79ef\u6781\u7684\u6307\u4ee4\u6027\u56de\u590d\u914d\u5408\uff0c\u672a\u8868\u73b0\u51fa\u4efb\u4f55\u7126\u8651\u3001\u62b1\u6028\u6216\u4f9d\u8d56\u60c5\u7eea\u3002\u5728\u9519\u8fc7\u76f4\u64ad\u53e3\u4ee4\u65f6\uff0c\u4e3b\u52a8\u89e3\u91ca\u201c\u521a\u505a\u624b\u672f\u9519\u8fc7\u4e86\u201d\uff0c\u5e76\u79ef\u6781\u8ddf\u8fdb\u201c\u6c42\u5e26\u98de\u201d\uff0c\u8868\u73b0\u51fa\u826f\u597d\u7684\u6297\u538b\u548c\u89e3\u51b3\u95ee\u9898\u5bfc\u5411\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u6211\u8fd8\u5728\u542c\u76f4\u64ad\uff0c\u53ef\u80fd\u521a\u505a\u624b\u672f\u9519\u8fc7\u4e86[\u6342\u8138]\u201d\n  > \u201c\u6c42\u5e26\u98de\u201d\n  > \u201c\u5df2\u6536\u5230\uff0c\u771f\u5fc3\u611f\u8c22\u4f60\u7684\u544a\u77e5\uff0c\u6211\u5e73\u65f6\u90fd\u662f\u770b\u52a8\u6f2b\uff0c\u6ca1\u600e\u4e48\u4e86\u89e3\u8fc7\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a\u3010 \u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 \u3011\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u804c\u4e1a\u53d1\u5c55\u7684\u4e0d\u5b89\u5168\u611f\u4e0e\u5bf9\u4e13\u4e1a\u6280\u80fd\u7684\u5c0a\u91cd\u6e34\u671b**\u3002\u4f5c\u4e3a\u624b\u672f\u5ba4\u5de5\u4f5c\u4eba\u5458\uff0c\u5de5\u4f5c\u5f3a\u5ea6\u5927\u3001\u65f6\u95f4\u4e0d\u56fa\u5b9a\uff0c\u5e0c\u671b\u901a\u8fc7\u5b66\u4e60\u4e00\u9879\u201c\u6280\u591a\u4e0d\u538b\u8eab\u201d\u7684\u786c\u6280\u80fd\uff0c\u83b7\u5f97\u4e00\u4efd\u65f6\u95f4\u81ea\u7531\u7684\u517c\u804c\u6536\u5165\uff0c\u4ee5\u589e\u5f3a\u7ecf\u6d4e\u5b89\u5168\u611f\u548c\u804c\u4e1a\u9009\u62e9\u7684\u4e3b\u52a8\u6743\u3002\u540c\u65f6\uff0c\u5979\u5bf9\u201c\u8bed\u8a00\u7c7b\u5b66\u95ee\u201d\u7684\u8ba4\u53ef\u548c\u201c\u957f\u671f\u53d1\u5c55\u201d\u7684\u8ffd\u6c42\uff0c\u4e5f\u4f53\u73b0\u4e86\u5bf9\u4e13\u4e1a\u80fd\u529b\u548c\u884c\u4e1a\u8ba4\u53ef\u7684\u5c0a\u91cd\u9700\u6c42\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u80af\u5b9a\u4e0e\u6e05\u6670\u7684\u6210\u957f\u8def\u5f84**\u3002\u5979\u4e0d\u9700\u8981\u8fc7\u5ea6\u60c5\u7eea\u5b89\u629a\uff0c\u800c\u662f\u9700\u8981\u88ab\u8ba4\u53ef\u4e3a\u201c\u6709\u6f5c\u529b\u201d\u3001\u201c\u9002\u5408\u914d\u97f3\u201d\u3001\u201c\u58f0\u7ebf\u4e0d\u9519\u201d\uff0c\u5e76\u770b\u5230\u4e00\u4e2a\u4ece\u201c\u5c0f\u767d\u201d\u5230\u201c\u7a33\u5b9a\u63a5\u5355\u201d\u7684\u53ef\u884c\u3001\u6e05\u6670\u7684\u7cfb\u7edf\u8def\u5f84\u3002\u9500\u552e\u591a\u6b21\u5f3a\u8c03\u201c\u770b\u597d\u4f60\u201d\u3001\u201c\u5f88\u9002\u5408\u201d\uff0c\u5e76\u63d0\u4f9b\u5177\u4f53\u7684\u53d1\u5c55\u65b9\u5411\uff08\u5fa1\u59d0\u97f3\u8d5b\u9053\uff09\uff0c\u6b63\u662f\u51fb\u4e2d\u4e86\u8fd9\u4e00\u70b9\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u6838\u5fc3\u7a33\u5b9a) |\n\n**\u5224\u5b9a\u6811\u63a8\u6f14**\uff1a\n1.  **\u652f\u4ed8\u6838\u67e5**\uff1a\u65e0\u652f\u4ed8\u884c\u4e3a\u6570\u636e\uff0c\u8df3\u8fc7\u3002\n2.  **\u4e09\u8f74\u8bc4\u5206**\uff1a\u52a8\u673a\u7eaf\u5ea6(5-6\u5206)\u3001\u8d44\u6e90\u5e95\u5ea7(5-6\u5206)\u3001\u5fc3\u7406\u5f39\u6027(7-8\u5206)\u3002\n3.  **\u5224\u5b9a\u6811\u5339\u914d**\uff1a\n    - \u52a8\u673a\u7eaf\u5ea6\u22655\u5206\uff0c\u8fdb\u5165**\u7b2c\u4e09\u5c42\uff1a\u4e2d\u9ad8\u52a8\u673a\u7cbe\u5206**\u3002\n    - \u5fc3\u7406\u5f39\u6027\u22657\u5206\uff0c\u8fdb\u5165**\u5206\u652fA\uff1a\u9ad8\u5f39\u6027\u901a\u9053**\u3002\n    - \u804a\u5929\u8bb0\u5f55\u4e2d**\u672a\u51fa\u73b0**\u4e3b\u52a8\u7edf\u7b79\u3001\u6df1\u5ea6\u6280\u672f\u8ffd\u95ee\u3001\u9ad8\u9891\u975e\u5b66\u4e60\u793e\u4ea4\u7b49\u7279\u5f81\u4fe1\u53f7\u3002\n    - \u6839\u636e\u5224\u5b9a\u6811\u515c\u5e95\u903b\u8f91\uff1a\u201c\u4ee5\u4e0a\u5747\u672a\u547d\u4e2d\u7684\u9ad8\u52a8\u673a\u3001\u9ad8\u5f39\u6027\u7528\u6237 \u2192 \u9ed8\u8ba4\u5f52\u7c7b\u4e3a T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u201d\u3002\n4.  **\u539f\u578b\u786e\u8ba4**\uff1a\u7528\u6237\u8868\u73b0\u7b26\u5408T2\u7279\u5f81\uff1a**\u201c\u95f7\u58f0\u5e72\u786c\u6838\u6d3b\u6c42\u80af\u5b9a\u201d**\u3002\u5979\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\uff08\u201c\u5df2\u5165\u7fa4\u201d\u3001\u201c\u597d\u7684\u201d\uff09\u3001\u79ef\u6781\u8ddf\u8fdb\u76f4\u64ad\uff08\u201c\u5df2\u5230\u8bfe\u201d\uff09\u3001\u5bf9\u4e13\u4e1a\u5efa\u8bae\u865a\u5fc3\u63a5\u53d7\uff08\u201c\u5df2\u6536\u5230\uff0c\u771f\u5fc3\u611f\u8c22\u201d\uff09\uff0c\u5c55\u73b0\u51fa\u7a33\u5b9a\u3001\u52a1\u5b9e\u3001\u9ad8\u6267\u884c\u529b\u7684\u7279\u8d28\uff0c\u4e14\u5bf9\u9500\u552e\u7684\u4e13\u4e1a\u5f15\u5bfc\u8868\u73b0\u51fa\u9ad8\u5ea6\u914d\u5408\u4e0e\u4fe1\u4efb\u3002\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 **\u5b89\u5168\u672a\u89e6\u53d1**\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u3001\u5bb6\u5ead\u53cd\u5bf9\u7b49\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u4fe1\u606f\u7f3a\u5931\u9879\u3002\u82e5\u62a5\u540d\u4e3a\u7792\u7740\u5bb6\u4eba\u8fdb\u884c\uff0c\u540e\u7eed\u53ef\u80fd\u56e0\u5bb6\u5ead\u538b\u529b\u5f15\u53d1\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u7528\u6237\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5f3a\uff08\u624b\u672f\u5ba4\u5de5\u4f5c\uff09\uff0c\u4e14\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u9002\u5e94\u788e\u7247\u5316\u5b66\u4e60\u3002\u4e3b\u8981\u98ce\u9669\u5728\u4e8e**\u5de5\u4f5c\u7a81\u53d1\u52a0\u73ed\u5bfc\u81f4\u65f6\u95f4\u88ab\u6781\u5ea6\u538b\u7f29**\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u5177\u5907\u72ec\u7acb\u89e3\u51b3\u95ee\u9898\u80fd\u529b\uff08\u9519\u8fc7\u76f4\u64ad\u4e3b\u52a8\u89e3\u91ca\u5e76\u8ddf\u8fdb\uff09\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u7528\u6237\u52a8\u673a\u5305\u542b\u201c\u989d\u5916\u6536\u5165\u201d\uff0c\u82e5\u5728\u627f\u8bfa\u5468\u671f\u5185\uff08\u5982\u9500\u552e\u6697\u793a\u7684\u201c\u7b2c\u4e00\u4e2a\u6708\u201d\uff09\u672a\u63a5\u5230\u5355\u6216\u6536\u5165\u8fdc\u4f4e\u4e8e\u9884\u671f\uff0c\u53ef\u80fd\u4ea7\u751f\u4fe1\u4efb\u5371\u673a\u548c\u9000\u8d39\u51b2\u52a8\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-3\u4e2a\u6708**\u3002\u6b64\u65f6\u57fa\u7840\u8bfe\u7a0b\u7ed3\u675f\uff0c\u8fdb\u5165\u5b9e\u6218\u63a5\u5355\u9636\u6bb5\u3002\u82e5\u7528\u6237\u6295\u5165\u5927\u91cf\u65f6\u95f4\u7ec3\u4e60\u5374\u8fdf\u8fdf\u65e0\u6cd5\u83b7\u5f97\u6b63\u5411\u53cd\u9988\uff08\u8bd5\u97f3\u5931\u8d25\u3001\u65e0\u5355\u53ef\u63a5\uff09\uff0c\u5176\u201c\u5b89\u5168\u9700\u6c42\u201d\uff08\u7ecf\u6d4e\u589e\u6536\uff09\u672a\u88ab\u6ee1\u8db3\uff0c\u9000\u8d39\u98ce\u9669\u5c06\u6025\u5267\u5347\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u5979\u8bf4......\u201d**\n> \u201c\u559c\u6d0b\u6d0b\uff0c\u770b\u5230\u4f60\u624b\u672f\u5ba4\u7684\u5de5\u4f5c\u80cc\u666f\u8fd8\u80fd\u8fd9\u4e48\u9ad8\u6548\u5730\u5b8c\u6210\u8bad\u7ec3\u8425\u4efb\u52a1\uff0c\u771f\u7684\u975e\u5e38\u4f69\u670d\u4f60\u7684\u65f6\u95f4\u7ba1\u7406\u548c\u6267\u884c\u529b\u3002\u4f60\u7684\u58f0\u97f3\u6761\u4ef6\u548c\u5b66\u4e60\u6001\u5ea6\u90fd\u5f88\u68d2\uff0c\u54b1\u4eec\u4e0d\u8ffd\u6c42\u901f\u6210\uff0c\u5c31\u6309\u7167\u4f60\u7684\u8282\u594f\uff0c\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\u628a\u57fa\u7840\u6253\u624e\u5b9e\u3002\u4f60\u7684\u76ee\u6807\u662f\u957f\u671f\u53d1\u5c55\uff0c\u6211\u7684\u4efb\u52a1\u5c31\u662f\u5e2e\u4f60\u628a\u8fd9\u6761\u8def\u89c4\u5212\u6e05\u6670\u3001\u8d70\u7a33\u3002\u6709\u4efb\u4f55\u65f6\u95f4\u51b2\u7a81\u968f\u65f6\u8ddf\u6211\u8bf4\uff0c\u54b1\u4eec\u7075\u6d3b\u8c03\u6574\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u3002\u7528\u6237\u8ffd\u6c42\u201c\u6280\u591a\u4e0d\u538b\u8eab\u201d\u548c\u957f\u671f\u53d1\u5c55\uff0c\u9002\u5408\u8bfe\u4e1a\u5145\u5b9e\u3001\u5f3a\u8c03\u6280\u80fd\u6253\u78e8\u7684\u8def\u5f84\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n  1.  **\u3010\u65f6\u95f4\u7ba1\u7406\u8f85\u52a9\u5305\u3011**\uff1a\u4e3a\u5176\u5b9a\u5236\u788e\u7247\u5316\u5b66\u4e60\u8ba1\u5212\u8868\uff0c\u5c06\u5927\u4efb\u52a1\u62c6\u89e3\u4e3a15-30\u5206\u949f\u53ef\u5b8c\u6210\u7684\u5fae\u4efb\u52a1\u3002\n  2.  **\u3010\u7cbe\u51c6\u6d3e\u5355B\u6a21\u5757\u3011**\uff1a\u6839\u636e\u5176\u201c\u5fa1\u59d0\u97f3\u201d\u58f0\u7ebf\u7279\u70b9\uff0c\u4f18\u5148\u63a8\u9001\u5339\u914d\u7684\u3001\u9ad8\u8d28\u91cf\u7684\u8bd5\u97f3\u5355\uff0c\u907f\u514d\u6d77\u91cf\u4f4e\u8d28\u5355\u6d88\u8017\u5176\u7cbe\u529b\u3002\n  3.  **\u3010\u9636\u6bb5\u6027\u6210\u679c\u53ef\u89c6\u5316\u3011**\uff1a\u5b9a\u671f\uff08\u5982\u6bcf\u6708\uff09\u4e3a\u5176\u603b\u7ed3\u5b66\u4e60\u8fdb\u5ea6\u548c\u6280\u80fd\u63d0\u5347\u70b9\uff0c\u5236\u4f5c\u7b80\u5355\u7684\u201c\u6210\u957f\u62a5\u544a\u201d\uff0c\u5f3a\u5316\u5176\u201c\u957f\u671f\u4e3b\u4e49\u201d\u7684\u83b7\u5f97\u611f\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n  1.  \u7edd\u4e0d\u7528\u201c\u51e0\u5929\u5185\u66b4\u5bcc\u201d\u7684\u8bdd\u672f\u523a\u6fc0\u5979\uff0c\u8fd9\u4e0e\u5176\u201c\u957f\u671f\u53d1\u5c55\u201d\u7684\u52a1\u5b9e\u5fc3\u6001\u76f8\u6096\u3002\n  2.  \u7edd\u4e0d\u5728\u5176\u5de5\u4f5c\u65f6\u95f4\uff08\u53ef\u80fd\u6b63\u5728\u624b\u672f\uff09\u9891\u7e41\u50ac\u4fc3\u6216\u65bd\u52a0\u538b\u529b\u3002\n  3.  \u7edd\u4e0d\u5ffd\u89c6\u5176\u201c\u65f6\u95f4\u4e0d\u56fa\u5b9a\u201d\u7684\u5ba2\u89c2\u9650\u5236\uff0c\u5f3a\u884c\u8981\u6c42\u53c2\u4e0e\u6240\u6709\u56fa\u5b9a\u65f6\u95f4\u7684\u793e\u7fa4\u6d3b\u52a8\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u8fdb\u884c\u5927\u989d\u7cfb\u7edf\u8bfe\u63a8\u4ecb**\u3002\u56e0\u5176\u5c5e\u4e8eB\u7c7b\u6838\u5fc3\u7528\u6237\uff0c\u6709\u9ad8\u590d\u8d2d\u6f5c\u529b\uff0c\u4f46\u63a8\u4ecb\u65f6\u5fc5\u987b\u7d27\u6263\u201c\u7cfb\u7edf\u5316\u63d0\u5347\u201d\u3001\u201c\u7a33\u5b9a\u63a5\u5355\u201d\u3001\u201c\u804c\u4e1a\u5316\u53d1\u5c55\u201d\u7b49\u4ef7\u503c\u70b9\uff0c\u800c\u975e\u201c\u5feb\u901f\u8d5a\u94b1\u201d\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u672c\u60f3\u7740\u6280\u591a\u4e0d\u538b\u8eab\uff0c\u95f2\u6687\u65f6\u95f4\u5b66\u70b9\u4e1c\u897f\u633a\u597d\uff0c\ud83c\ude36\u989d\u5916\u7684\u6536\u5165\u4e5f\u633a\u597d\u201d \u2014 **\u52a8\u673a\u52a1\u5b9e\uff0c\u517c\u987e\u5174\u8da3\u4e0e\u53d8\u73b0**\u3002\n2. > \u201c\u51b2\u7a81\u4e0d\u5927\uff0c\u53ea\u8981\u4e0d\u662f\u975e\u8981\u5728\u56fa\u5b9a\u65f6\u95f4\u5c31\u53ef\u4ee5\uff0c\u4e3b\u8981\u662f\u6211\u7684\u672c\u804c\u5de5\u4f5c\u662f\u5728\u624b\u672f\u5ba4\u5de5\u4f5c\uff0c\u56fa\u5b9a\u65f6\u95f4\u7684\u8bdd\u4f1a\u51b2\u7a81\u201d \u2014 **\u8d44\u6e90\u5e95\u5ea7\u6e05\u6670\uff0c\u65f6\u95f4\u788e\u7247\u5316\u4f46\u53ef\u7ba1\u7406**\u3002\n3. > \u201c\u6253\u7b97\u957f\u671f\u53d1\u5c55\u5427\uff0c\u968f\u4fbf\u73a9\u73a9\u5b66\u7740\u5c31\u5931\u53bb\u610f\u4e49\u4e86\u201d \u2014 **\u76ee\u6807\u660e\u786e\uff0c\u8ffd\u6c42\u6df1\u5ea6\u5b66\u4e60\u548c\u957f\u671f\u4ef7\u503c\uff0c\u975e\u73a9\u7968\u5fc3\u6001**\u3002\n4. > \u201c\u6211\u8fd8\u5728\u542c\u76f4\u64ad\uff0c\u53ef\u80fd\u521a\u505a\u624b\u672f\u9519\u8fc7\u4e86[\u6342\u8138] \u6c42\u5e26\u98de\u201d \u2014 **\u9ad8\u5fc3\u7406\u5f39\u6027\uff0c\u9047\u963b\u4e3b\u52a8\u6c9f\u901a\u5e76\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u65e0\u60c5\u7eea\u5316\u62b1\u6028**\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u804c\u4e1a\u5b89\u5168\u611f\u4e0e\u4e13\u4e1a\u6280\u80fd\u5c0a\u91cd\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6e05\u6670\u3001\u7a33\u5b9a\u7684\u6210\u957f\u8def\u5f84\uff0c\u7ba1\u7406\u597d\u201c\u63a5\u5355\u53d8\u73b0\u201d\u7684\u9884\u671f\uff0c\u907f\u514d\u6536\u76ca\u843d\u5dee\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42/\u5c0a\u91cd\u9700\u6c42\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\"}\n```";
