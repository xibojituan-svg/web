    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a (UID: 676880715)\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u9ad8)**\uff1a\n    *   **\u5b66\u4e60\u9a71\u52a8**\uff1a\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\uff0c\u4e3b\u52a8\u8be2\u95ee\u9009\u4e66\u6280\u5de7\u3001AU\u8f6f\u4ef6\u64cd\u4f5c\u3001\u97f3\u9891\u95ee\u9898\u89e3\u51b3\u65b9\u6848\uff0c\u5e76\u63d0\u53ca\u575a\u6301\u65e9\u529f\u3001\u770b\u56de\u653e\u8bfe\u3002\n    *   **\u5b9e\u8df5\u5bfc\u5411**\uff1a\u5173\u6ce8\u5b9e\u64cd\u7ec6\u8282\uff08\u5982\u9009\u4e66\u6548\u7387\u3001\u5f55\u97f3\u4f4d\u7f6e\u3001AU\u8c03\u6574\uff09\uff0c\u5e76\u5df2\u5f00\u59cb\u63d0\u4ea4\u4f5c\u4e1a\u3001\u53c2\u4e0e\u8bd5\u97f3\uff0c\u6709\u7532\u65b9\u53cd\u9988\u8bb0\u5f55\u3002\n    *   **\u957f\u671f\u89c6\u89d2**\uff1a\u8ba4\u53ef\u201c\u5de5\u4f5c\u53ef\u4ee5\u505a\u4e00\u8f88\u5b50\u201d\u3001\u201c\u5148\u79ef\u7d2f\u7ecf\u9a8c\u201d\u3001\u201c\u653e\u5e73\u5fc3\u6001\uff0c\u5148\u628a\u57fa\u672c\u529f\u6253\u597d\u201d\u7b49\u89c2\u70b9\uff0c\u663e\u793a\u51fa\u5bf9\u6280\u80fd\u957f\u671f\u6295\u5165\u7684\u8ba4\u77e5\u3002\n    *   **\u53d8\u73b0\u7126\u8651**\uff1a\u5b58\u5728\u201c\u770b\u770b\u51e0\u5468\u7684\u65f6\u5019\u80fd\u641e\u4e0a\u4e2a\u4e66\u201d\u7684\u671f\u5f85\uff0c\u4f46\u80fd\u63a5\u53d7\u9500\u552e\u201c\u628a\u672c\u9886\u5b66\u597d\uff0c\u5bf9\u5f97\u8d77\u5b66\u8d39\u201d\u7684\u5f15\u5bfc\uff0c\u7126\u8651\u7a0b\u5ea6\u53ef\u63a7\u3002\n\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d)**\uff1a\n    *   **\u65f6\u95f4\u8d44\u6e90**\uff1a\u7528\u6237\u63d0\u53ca\u201c\u65f6\u95f4\u8001\u4e0d\u591f\u7528\u201d\u3001\u201c\u65f6\u95f4\u5b89\u6392\u7279\u522b\u7d27\u201d\u3001\u201c\u6709\u5de5\u4f5c\u6709\u5bb6\u5ead\u201d\uff0c\u8868\u660e\u4e3a\u5728\u804c\u72b6\u6001\uff0c\u5b66\u4e60\u65f6\u95f4\u7d27\u5f20\u4e14\u788e\u7247\u5316\u3002\n    *   **\u7cbe\u529b\u6295\u5165**\uff1a\u79ef\u6781\u6295\u5165\u5b66\u4e60\u8fc7\u7a0b\uff0c\u53cd\u590d\u5c1d\u8bd5\u89e3\u51b3\u6280\u672f\u95ee\u9898\uff08\u97f3\u9891\u76f8\u4f4d\u95ee\u9898\uff09\uff0c\u4e3b\u52a8\u5bfb\u6c42\u53cd\u9988\u5e76\u8ba1\u5212\u6539\u8fdb\u3002\n    *   **\u7ecf\u6d4e\u4e0e\u8bbe\u5907**\uff1a\u5df2\u652f\u4ed8\u5b66\u8d39\u5e76\u53c2\u4e0e\u8bfe\u7a0b\uff0c\u62e5\u6709\u5f55\u97f3\u8bbe\u5907\uff08\u624b\u673a\uff09\u53ca\u5b66\u4e60\u8f6f\u4ef6\uff08AU\uff09\uff0c\u5177\u5907\u57fa\u7840\u5b66\u4e60\u6761\u4ef6\u3002**\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u7f3a\u5931**\u3002\n    *   **\u5b66\u4e60\u80fd\u529b**\uff1a\u80fd\u7406\u89e3\u5e76\u5c1d\u8bd5\u5e94\u7528\u9500\u552e\u4f20\u6388\u7684AU\u6280\u5de7\uff0c\u5177\u5907\u4e00\u5b9a\u7684\u6280\u672f\u7406\u89e3\u548c\u52a8\u624b\u80fd\u529b\u3002\n\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u9ad8)**\uff1a\n    *   **\u632b\u6298\u5e94\u5bf9**\uff1a\u9762\u5bf9\u201c\u97f3\u9891\u76f8\u4f4d\u201d\u95ee\u9898\u91cd\u590d\u51fa\u73b0\uff08\u8001\u5e08\u3001\u7532\u65b9\u5747\u6307\u51fa\uff09\u65f6\uff0c\u867d\u6709\u201c\u95f9\u5fc3\u201d\u3001\u201c\u53ef\u60dc\u201d\u60c5\u7eea\uff0c\u4f46\u672a\u62b1\u6028\u6216\u653e\u5f03\uff0c\u800c\u662f\u79ef\u6781\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff08\u201c\u660e\u5929\u518d\u6363\u9f13\u201d\u3001\u201c\u4e89\u53d6\u5f7b\u5e95\u89e3\u51b3\u201d\uff09\u3002\n    *   **\u538b\u529b\u8c03\u8282**\uff1a\u80fd\u81ea\u6211\u758f\u5bfc\uff08\u201c\u6025\u4e5f\u6ca1\u7528\u201d\u3001\u201c\u6162\u6162\u6765\u5427\u201d\uff09\uff0c\u5e76\u63a5\u53d7\u9500\u552e\u201c\u653e\u5e73\u5fc3\u6001\u201d\u7684\u5efa\u8bae\uff0c\u5fc3\u6001\u603b\u4f53\u5e73\u7a33\u3002\n    *   **\u5173\u7cfb\u4e92\u52a8**\uff1a\u4e0e\u9500\u552e\uff08\u73ed\u73ed\uff09\u6c9f\u901a\u793c\u8c8c\u3001\u79ef\u6781\uff08\u591a\u6b21\u611f\u8c22\u3001\u5173\u5fc3\u5bf9\u65b9\u5403\u996d\uff09\uff0c\u4e92\u52a8\u6c1b\u56f4\u826f\u597d\uff0c\u613f\u610f\u63a5\u53d7\u6307\u5bfc\u3002\n    *   **\u671f\u671b\u7ba1\u7406**\uff1a\u5bf9\u201c\u5feb\u901f\u63a5\u4e66\u201d\u6709\u671f\u5f85\uff0c\u4f46\u80fd\u7406\u89e3\u5e76\u8ba4\u540c\u201c\u57fa\u672c\u529f\u6253\u597d\u201d\u7684\u957f\u671f\u4ef7\u503c\uff0c\u672a\u8868\u73b0\u51fa\u4e0d\u5207\u5b9e\u9645\u7684\u901f\u6210\u5e7b\u60f3\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5**\uff1a\u7528\u6237\u63d0\u53ca\u201c\u5bf9\u5f97\u8d77\u6211\u4eec\u4ea4\u7684\u8fd9\u4efd\u5b66\u8d39\u201d\uff0c**\u786e\u8ba4\u5df2\u5b8c\u6210\u652f\u4ed8**\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**\uff1a\u8bb0\u5f55\u4e2d\u672a\u63d0\u53ca\u914d\u5076\u3001\u7236\u6bcd\u7b49\u5bb6\u5ead\u6210\u5458\u610f\u89c1\uff0c**\u4fe1\u606f\u7f3a\u5931\uff0c\u9700\u540e\u7eed\u6838\u67e5**\u3002\n*   **\u6b65\u9aa41\uff1a\u52a8\u673a\u7eaf\u5ea6 (B\u7c7b - \u6280\u80fd\u63d0\u5347\u578b)**\uff1a\u52a8\u673a\u660e\u786e\u6307\u5411\u6280\u80fd\u5b66\u4e60\u4e0e\u95ee\u9898\u89e3\u51b3\uff0c\u975e\u5355\u7eaf\u7126\u8651\u9a71\u52a8\u6216\u76f2\u76ee\u8ddf\u98ce\u3002\n*   **\u6b65\u9aa42\uff1a\u8d44\u6e90\u5e95\u5ea7 (C\u7c7b - \u8d44\u6e90\u53d7\u9650\u594b\u6597\u8005)**\uff1a\u6709\u65f6\u95f4\u538b\u529b\uff08\u5728\u804c\u3001\u5bb6\u5ead\uff09\uff0c\u4f46\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b\u5f3a\uff0c\u8d44\u6e90\u5229\u7528\u6548\u7387\u5c1a\u53ef\u3002\n*   **\u6b65\u9aa43\uff1a\u5fc3\u7406\u5f39\u6027 (B\u7c7b - \u7a33\u5065\u6210\u957f\u578b)**\uff1a\u80fd\u6b63\u89c6\u95ee\u9898\u3001\u79ef\u6781\u89e3\u51b3\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u6709\u957f\u671f\u575a\u6301\u7684\u97e7\u6027\u3002\n*   **\u7efc\u5408\u5224\u5b9a\uff1aB-C\u578b\u7528\u6237**\u3002\u6838\u5fc3\u7279\u5f81\u662f**\u6709\u660e\u786e\u5b66\u4e60\u76ee\u6807\u3001\u6267\u884c\u529b\u5f3a\uff0c\u4f46\u53d7\u9650\u4e8e\u65f6\u95f4\u7cbe\u529b\uff0c\u9700\u8981\u9ad8\u6548\u3001\u805a\u7126\u7684\u5b66\u4e60\u8def\u5f84\u652f\u6301**\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b\uff1aT4 \u52a1\u5b9e\u8fdb\u53d6\u8005**\n    *   **\u7279\u5f81\u543b\u5408**\uff1a\u76ee\u6807\u6e05\u6670\uff08\u89e3\u51b3\u5177\u4f53\u95ee\u9898\u3001\u63d0\u5347\u6548\u7387\uff09\uff0c\u884c\u52a8\u529b\u5f3a\uff08\u4e3b\u52a8\u7ec3\u4e60\u3001\u5bfb\u6c42\u53cd\u9988\uff09\uff0c\u5fc3\u6001\u52a1\u5b9e\uff08\u63a5\u53d7\u6e10\u8fdb\u6210\u957f\uff09\uff0c\u80fd\u7406\u6027\u770b\u5f85\u632b\u6298\u3002\u4e0eT2\uff08\u8d44\u6e90\u65e0\u5fe7\u63a2\u7d22\u8005\uff09\u76f8\u6bd4\uff0c\u5176\u65f6\u95f4\u8d44\u6e90\u66f4\u7d27\u5f20\uff1b\u4e0eT6\uff08\u9ad8\u7126\u8651\u4ece\u4f17\u8005\uff09\u76f8\u6bd4\uff0c\u5176\u7126\u8651\u611f\u66f4\u4f4e\u3001\u884c\u52a8\u66f4\u805a\u7126\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4f4e)\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u9884\u671f\u843d\u5dee (\u4f4e)**\uff1a\u7528\u6237\u5bf9\u5b66\u4e60\u96be\u5ea6\u548c\u6210\u957f\u5468\u671f\u6709\u8ba4\u77e5\uff08\u201c\u6162\u6162\u6765\u201d\uff09\uff0c\u9500\u552e\u4e5f\u8fdb\u884c\u4e86\u9884\u671f\u7ba1\u7406\uff08\u201c\u5165\u95e8\u6ca1\u90a3\u4e48\u96be\u2026\u9700\u8981\u65f6\u95f4\u201d\uff09\u3002\n    2.  **\u6548\u679c\u4e0d\u7b26 (\u4f4e)**\uff1a\u7528\u6237\u5df2\u5728\u5b9e\u64cd\u4e2d\u9047\u5230\u5e76\u5c1d\u8bd5\u89e3\u51b3\u5177\u4f53\u95ee\u9898\uff08\u97f3\u9891\u6280\u672f\uff09\uff0c\u5b66\u4e60\u8fc7\u7a0b\u6709\u53cd\u9988\u95ed\u73af\uff0c\u611f\u77e5\u5230\u8fdb\u6b65\u8def\u5f84\u3002\n    3.  **\u7ecf\u6d4e\u538b\u529b (\u672a\u77e5)**\uff1a\u652f\u4ed8\u80fd\u529b\u4e0e\u5bb6\u5ead\u8d22\u52a1\u60c5\u51b5\u672a\u77e5\uff0c**\u662f\u4e3b\u8981\u98ce\u9669\u76d1\u6d4b\u70b9**\u3002\n    4.  **\u65f6\u95f4\u51b2\u7a81 (\u4e2d)**\uff1a\u7528\u6237\u53cd\u590d\u63d0\u53ca\u65f6\u95f4\u7d27\u5f20\uff0c**\u662f\u6f5c\u5728\u7684\u670d\u52a1\u6311\u6218\u70b9**\uff0c\u4f46\u7528\u6237\u76ee\u524d\u901a\u8fc7\u201c\u788e\u7247\u5316\u5b66\u4e60\u201d\u81ea\u6211\u8c03\u8282\u3002\n    5.  **\u5185\u5bb9/\u670d\u52a1\u4e0d\u6ee1 (\u4f4e)**\uff1a\u4e0e\u9500\u552e\u4e92\u52a8\u79ef\u6781\uff0c\u5bf9\u6307\u5bfc\u8ba4\u53ef\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9 (\u672a\u77e5)**\uff1a**\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u7f3a\u5931\uff0c\u9700\u6838\u67e5**\u3002\n    7.  **\u7ade\u54c1/\u8d1f\u9762\u4fe1\u606f (\u4f4e)**\uff1a\u672a\u8868\u73b0\u51fa\u5bf9\u6bd4\u6216\u6000\u7591\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u9500\u552e\u884c\u4e3a**\uff1a\u9500\u552e\uff08\u76ae\u76ae\uff09\u7684\u5f15\u5bfc\u603b\u4f53\u5408\u89c4\uff0c\u805a\u7126\u5b66\u4e60\u65b9\u6cd5\u3001\u5fc3\u6001\u8c03\u6574\u548c\u6280\u672f\u95ee\u9898\u89e3\u51b3\uff0c\u672a\u53d1\u73b0\u5938\u5927\u627f\u8bfa\u3001\u50ac\u5355\u6216\u5236\u9020\u7126\u8651\u7684\u8a00\u8bba\u3002\n*   **\u7528\u6237\u6743\u76ca**\uff1a\u9500\u552e\u63d0\u4f9b\u4e86\u5177\u4f53\u7684\u6280\u672f\u89e3\u51b3\u65b9\u6848\uff08AU\u8c03\u6574\uff09\uff0c\u5e76\u5f3a\u8c03\u4e86\u201c\u4ece\u6839\u672c\u89e3\u51b3\u201d\u7684\u539f\u5219\uff0c\u5c3d\u5230\u4e86\u6307\u5bfc\u8d23\u4efb\u3002\n*   **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u65e0\u91cd\u5927\u4f26\u7406\u98ce\u9669\u3002\u9700\u6ce8\u610f\u6301\u7eed\u7ba1\u7406\u7528\u6237\u5bf9\u201c\u63a5\u4e66\u201d\u901f\u5ea6\u7684\u9884\u671f\uff0c\u907f\u514d\u56e0\u8bd5\u97f3\u672a\u4e2d\u4ea7\u751f\u632b\u8d25\u611f\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6\uff1a\u5339\u914d**\u3002\u7528\u6237\u9700\u6c42\u4e0e\u6280\u80fd\u63d0\u5347\u7c7b\u8bfe\u7a0b\u5339\u914d\u5ea6\u9ad8\uff0c\u9700\u5339\u914d**\u65f6\u95f4\u5f39\u6027\u5927\u3001\u652f\u6301\u788e\u7247\u5316\u5b66\u4e60\u3001\u63d0\u4f9b\u6e05\u6670\u95ee\u9898\u89e3\u51b3\u8def\u5f84**\u7684\u670d\u52a1\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**\u9996\u5468\u91cd\u70b9\u63d0\u4f9b\u65f6\u95f4\u89c4\u5212\u4e0e\u95ee\u9898\u4f18\u5148\u89e3\u51b3\u652f\u6301**\u3002\n*   **\u5177\u4f53\u884c\u52a8\u5efa\u8bae**\uff1a\n    1.  **\u7acb\u5373\u6838\u67e5\u5bb6\u5ead\u652f\u6301\u5ea6**\uff1a\u5728\u9996\u6b21\u6df1\u5ea6\u6c9f\u901a\u4e2d\uff0c\u81ea\u7136\u4e86\u89e3\u5b66\u8d39\u51b3\u7b56\u8fc7\u7a0b\u53ca\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u652f\u6301\u3002\n    2.  **\u5f3a\u5316\u65f6\u95f4\u7ba1\u7406\u8d4b\u80fd**\uff1a\u5e2e\u52a9\u7528\u6237\u5236\u5b9a\u7b26\u5408\u5176\u201c\u788e\u7247\u5316\u65f6\u95f4\u201d\u7684\u5b66\u4e60\u8ba1\u5212\u8868\uff0c\u660e\u786e\u6bcf\u65e5\u6700\u5c0f\u53ef\u884c\u7ec3\u4e60\u91cf\u3002\n    3.  **\u5efa\u7acb\u95ee\u9898\u5feb\u901f\u54cd\u5e94\u901a\u9053**\uff1a\u9488\u5bf9\u5176\u201c\u6280\u672f\u5b9e\u64cd\u95ee\u9898\u591a\u201d\u7684\u7279\u70b9\uff0c\u786e\u4fdd\u5176\u9047\u5230AU\u3001\u5f55\u97f3\u7b49\u95ee\u9898\u65f6\u80fd\u83b7\u5f97\u53ca\u65f6\u3001\u6e05\u6670\u7684\u6307\u5f15\uff0c\u907f\u514d\u56e0\u5c0f\u95ee\u9898\u5806\u79ef\u4ea7\u751f\u632b\u8d25\u611f\u3002\n    4.  **\u6301\u7eed\u6821\u6b63\u53d8\u73b0\u9884\u671f**\uff1a\u7ed3\u5408\u5176\u8bd5\u97f3\u53cd\u9988\uff0c\u5f3a\u8c03\u201c\u57fa\u672c\u529f-\u8bd5\u97f3-\u53cd\u9988-\u4f18\u5316\u201d\u7684\u5faa\u73af\u4ef7\u503c\uff0c\u5c06\u201c\u63a5\u4e66\u201d\u76ee\u6807\u8f6c\u5316\u4e3a\u53ef\u8861\u91cf\u7684\u6280\u80fd\u63d0\u5347\u91cc\u7a0b\u7891\u3002\n    5.  **\u7ed9\u4e88\u8fc7\u7a0b\u6027\u80af\u5b9a**\uff1a\u5bf9\u5176\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\u3001\u575a\u6301\u7ec3\u4e60\u7684\u884c\u4e3a\u7ed9\u4e88\u53ca\u65f6\u8ba4\u53ef\uff0c\u5f3a\u5316\u5176\u201c\u52a1\u5b9e\u8fdb\u53d6\u201d\u7684\u7279\u8d28\u3002\n\n{\"core_type\": \"T4 \u52a1\u5b9e\u8fdb\u53d6\u8005\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u9996\u5468\u63d0\u4f9b\u65f6\u95f4\u89c4\u5212\u4e0e\u95ee\u9898\u4f18\u5148\u89e3\u51b3\u652f\u6301\"}";
