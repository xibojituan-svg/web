    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u4e0e\u98ce\u63a7\u62a5\u544a\n\n**\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u8bb0\u5f55\u59cb\u4e8e\u8bad\u7ec3\u8425\u4e2d\u671f\uff0c\u7f3a\u5931\u65e9\u671f\u610f\u5411\u6c9f\u901a\u3001\u7528\u6237\u80cc\u666f\uff08\u5e74\u9f84/\u804c\u4e1a/\u6536\u5165/\u5bb6\u5ead\u72b6\u51b5\uff09\u3001\u652f\u4ed8\u51b3\u7b56\u8fc7\u7a0b\u3001\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u7b49)**\n    *   **\u79ef\u6781\u4fe1\u53f7**\uff1a\u4e3b\u52a8\u53c2\u4e0e\u8bad\u7ec3\u8425\uff08\u4ea4\u4f5c\u4e1a\u3001\u62a2\u53e3\u4ee4\u3001\u53c2\u52a0PIA\u620f\uff09\uff0c\u8868\u8fbe\u201c\u4fe1\u5ff5\u5f88\u5f3a\u201d\uff0c\u5bf9\u4e13\u4e1a\u53cd\u9988\uff08\u5982\u6c14\u606f\u95ee\u9898\uff09\u6709\u56de\u5e94\u5e76\u5c1d\u8bd5\u6539\u8fdb\uff0c\u8868\u73b0\u51fa\u5b66\u4e60\u610f\u613f\u548c\u575a\u6301\u6027\u3002\n    *   **\u6a21\u7cca\u4fe1\u53f7**\uff1a\u52a8\u673a\u96c6\u4e2d\u4e8e\u201c\u5b66\u4e60\u6280\u80fd\u201d\u3001\u201c\u505a\u4e3b\u64ad\u201d\uff0c\u5bf9\u53d8\u73b0\u7684\u671f\u671b\uff08\u5982\u201c\u7b2c\u4e00\u6876\u91d1\u201d\uff09\u672a\u660e\u786e\u8868\u8fbe\u6216\u8d28\u7591\u3002**\u7f3a\u4e4f\u660e\u786e\u7684\u804c\u4e1a\u8f6c\u578b\u3001\u6536\u5165\u63d0\u5347\u91cf\u5316\u76ee\u6807\u6216\u5f3a\u70c8\u7684\u5174\u8da3\u9a71\u52a8\u63cf\u8ff0**\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4fe1\u606f\u4e0d\u8db3)**\n    *   **\u65f6\u95f4\u8d44\u6e90**\uff1a\u53ef\u914d\u5408\u8bad\u7ec3\u8425\u8282\u594f\u5b8c\u6210\u4f5c\u4e1a\u3001\u53c2\u4e0e\u665a\u95f4\u76f4\u64ad\uff0c\u663e\u793a\u6709\u4e00\u5b9a\u53ef\u652f\u914d\u65f6\u95f4\u3002\n    *   **\u7ecf\u6d4e\u8d44\u6e90**\uff1a\u652f\u4ed8\u4e862380\u5143\u8bfe\u7a0b\u8d39\u7528\uff0c\u4f46**\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u8d44\u91d1\u6765\u6e90\u3001\u5bf9\u4ef7\u683c\u7684\u654f\u611f\u5ea6\u6216\u51b3\u7b56\u8fc7\u7a0b**\u3002\n    *   **\u8bbe\u5907/\u73af\u5883\u8d44\u6e90**\uff1a\u672a\u63d0\u53ca\uff0c\u4ec5\u77e5\u53ef\u7528\u624b\u673a\u5f55\u5236\u3002\n    *   **\u6280\u80fd\u57fa\u7840**\uff1a\u81ea\u8bc4\u201c\u6c14\u606f\u4e0d\u884c\u201d\u3001\u201c\u63a7\u5236\u4e0d\u4e86\u60c5\u7eea\u201d\uff0c\u4f46\u9500\u552e\u53cd\u9988\u201c\u58f0\u97f3\u6761\u4ef6\u597d\u201d\u3001\u201c\u6709\u8bb2\u8ff0\u611f\u201d\u3001\u201c\u8fdb\u6b65\u5927\u201d\uff0c\u5b58\u5728**\u81ea\u6211\u8bc4\u4ef7\u4e0e\u5916\u90e8\u8bc4\u4ef7\u7684\u8ba4\u77e5\u504f\u5dee**\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u7b49\u504f\u9ad8)**\n    *   **\u97e7\u6027**\uff1a\u9762\u5bf9\u56f0\u96be\uff08\u201c\u592a\u96be\u4e86\u201d\u3001\u201c\u54ac\u7740\u7259\u5f55\u201d\uff09\u4ecd\u575a\u6301\u5b8c\u6210\u4f5c\u4e1a\uff0c\u4f7f\u7528\u201c\u4e0d\u7834\u4e0d\u7acb\u201d\u81ea\u6211\u6fc0\u52b1\u3002\n    *   **\u5f00\u653e\u6027**\uff1a\u63a5\u53d7\u9500\u552e\u6307\u5bfc\uff0c\u613f\u610f\u5c1d\u8bd5\uff08\u5982\u53cd\u4e32\u89d2\u8272\uff09\uff0c\u5bf9\u53cd\u9988\uff08\u201c\u597d\u591a\u4e86\uff0c\u8001\u5e08\u5e26\u5f97\u597d\u201d\uff09\u6709\u79ef\u6781\u56de\u5e94\u3002\n    *   **\u7126\u8651\u6c34\u5e73**\uff1a\u5b58\u5728\u4efb\u52a1\u538b\u529b\u4e0b\u7684\u7d27\u5f20\uff08\u201c\u597d\u7d27\u5f20\u201d\uff09\u3001\u81ea\u6211\u6000\u7591\uff08\u201c\u5b8c\u5168\u4e0d\u4f1a\u8bf4\u8bdd\u201d\uff09\uff0c\u4f46\u672a\u53d1\u5c55\u4e3a\u62b1\u6028\u6216\u653e\u5f03\u3002**\u5c5e\u4e8e\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u7684\u6b63\u5e38\u7126\u8651**\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40\uff1a\u652f\u4ed8\u6838\u67e5** \u2705 \u5df2\u652f\u4ed8\uff082380\u5143\uff09\u3002\n*   **\u6b65\u9aa41.5\uff1a\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5** \ud83d\udeab **\u4fe1\u606f\u7f3a\u5931**\u3002\u65e0\u4efb\u4f55\u5173\u4e8e\u914d\u5076\u3001\u7236\u6bcd\u7b49\u5bb6\u5ead\u6210\u5458\u77e5\u60c5\u6216\u53c2\u4e0e\u51b3\u7b56\u7684\u63d0\u53ca\u3002\n*   **\u6b65\u9aa41\uff1a\u52a8\u673a\u7eaf\u5ea6** \u2192 **B\u7c7b\uff08\u4e2d\u7b49\u7eaf\u5ea6\uff09**\u3002\u6709\u884c\u52a8\u548c\u575a\u6301\uff0c\u4f46\u6df1\u5c42\u52a8\u673a\uff08\u4e3a\u7231\u53d1\u7535/\u804c\u4e1a\u521a\u9700/\u8d5a\u94b1\u526f\u4e1a\uff09\u4e0d\u660e\u786e\u3002\n*   **\u6b65\u9aa42\uff1a\u8d44\u6e90\u5e95\u5ea7** \u2192 **\u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u5f52C\u7c7b\uff08\u8d44\u6e90\u6a21\u7cca\uff09**\u3002\u4ec5\u77e5\u6709\u65f6\u95f4\u3001\u652f\u4ed8\u4e86\u5165\u95e8\u8d39\u7528\uff0c\u4f46\u7ecf\u6d4e\u627f\u53d7\u529b\u3001\u5bb6\u5ead\u652f\u6301\u3001\u957f\u671f\u65f6\u95f4\u6295\u5165\u4fdd\u969c\u672a\u77e5\u3002\n*   **\u6b65\u9aa43\uff1a\u5fc3\u7406\u5f39\u6027** \u2192 **A\u7c7b\uff08\u9ad8\u5f39\u6027\uff09**\u3002\u80fd\u514b\u670d\u754f\u96be\u60c5\u7eea\uff0c\u575a\u6301\u5b8c\u6210\u4efb\u52a1\uff0c\u6001\u5ea6\u79ef\u6781\u3002\n*   **\u7efc\u5408\u5224\u5b9a**\uff1a**B-C-A\u578b**\u3002\u6838\u5fc3\u98ce\u9669\u5728\u4e8e**\u8d44\u6e90\u5e95\u5ea7\u4e0d\u660e**\uff0c\u7279\u522b\u662f\u5bb6\u5ead\u51b3\u7b56\u6743\u7f3a\u5931\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b\uff1aT4 \u52a1\u5b9e\u63a2\u7d22\u8005**\n    *   **\u4f9d\u636e**\uff1a\u613f\u610f\u4e3a\u5b66\u4e60\u4ed8\u8d39\u5e76\u6295\u5165\u65f6\u95f4\uff0c\u884c\u52a8\u529b\u5f3a\uff08\u5b8c\u6210\u6240\u6709\u8003\u6838\uff09\uff0c\u5bf9\u6b63\u5411\u53cd\u9988\u6709\u83b7\u5f97\u611f\u3002\u4f46\u76ee\u6807\u611f\u4e0d\u591f\u6781\u81f4\uff08\u975eT1\uff09\uff0c\u7126\u8651\u7a0b\u5ea6\u5728\u53ef\u63a7\u8303\u56f4\uff08\u975eT6\uff09\uff0c\u672a\u8868\u73b0\u51fa\u660e\u663e\u7684\u6295\u673a\uff08T7\uff09\u6216\u88ab\u52a8\uff08T8\uff09\u7279\u5f81\u3002\n    *   **\u504f\u5dee\u63d0\u793a**\uff1a\u56e0\u5bb6\u5ead\u51b3\u7b56\u6743\u4fe1\u606f\u7f3a\u5931\uff0c\u4e0d\u6392\u9664\u5176\u4e3a**T2 \u5bb6\u5ead\u4e3b\u5987/\u592b\uff08\u5bfb\u6c42\u4ef7\u503c\uff09** \u7684\u53ef\u80fd\u6027\uff0c\u9700\u8fdb\u4e00\u6b65\u6838\u5b9e\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\uff08\u98ce\u9669\u7b49\u7ea7\uff1a\u4e2d\uff09\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**\uff1a\n    1.  **\u6548\u679c\u4e0d\u53ca\u9884\u671f**\uff1a**\u4e2d\u98ce\u9669**\u3002\u7528\u6237\u5df2\u611f\u77e5\u5b66\u4e60\u96be\u5ea6\uff08\u201c\u592a\u96be\u4e86\u201d\uff09\uff0c\u5b58\u5728\u201c\u80fd\u529b\u6210\u957f\u9884\u671f\u201d\u4e0e\u201c\u5b9e\u9645\u8fdb\u6b65\u901f\u5ea6\u201d\u4e0d\u5339\u914d\u7684\u98ce\u9669\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**\uff1a**\u672a\u77e5\u98ce\u9669**\u3002\u652f\u4ed8\u91d1\u989d\u4e3a2380\u5143\uff0c\u5c5e\u4e2d\u4f4e\u5ba2\u5355\u4ef7\uff0c\u4f46**\u672a\u900f\u9732\u7ecf\u6d4e\u72b6\u51b5\u4e0e\u652f\u4ed8\u611f\u53d7**\uff0c\u9700\u8b66\u60d5\u9690\u85cf\u7684\u5bb6\u5ead\u7ecf\u6d4e\u77db\u76fe\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**\uff1a**\u4f4e\u98ce\u9669**\u3002\u76ee\u524d\u53c2\u4e0e\u5ea6\u826f\u597d\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9**\uff1a**\u9ad8\u98ce\u9669**\u3002**\u6700\u5927\u98ce\u9669\u70b9**\u3002\u5168\u6d41\u7a0b\u672a\u63d0\u53ca\u5bb6\u4eba\uff0c\u5bb6\u5ead\u51b3\u7b56\u6743\u72b6\u6001\u5b8c\u5168\u672a\u77e5\u3002\n    5.  **\u9500\u552e\u8bef\u5bfc**\uff1a**\u4f4e\u98ce\u9669**\u3002\u9500\u552e\u8bdd\u672f\u4ee5\u9f13\u52b1\u3001\u63d0\u4f9b\u8d44\u6e90\u4e3a\u4e3b\uff0c\u867d\u6709\u201c\u52a0\u5165\u5c31\u6709\u4e66\u5f55\u201d\u7b49\u627f\u8bfa\uff0c\u4f46\u672a\u53d1\u73b0\u5938\u5927\u6536\u5165\u6216\u5305\u5c31\u4e1a\u7b49**\u786c\u6027\u8fdd\u89c4\u627f\u8bfa**\u3002\n    6.  **\u4ea7\u54c1\u4e0d\u7b26**\uff1a**\u4f4e\u98ce\u9669**\u3002\u7528\u6237\u76ee\u6807\u201c\u6211\u8981\u505a\u4e3b\u64ad\u201d\u4e0e\u4ea7\u54c1\u65b9\u5411\u57fa\u672c\u5339\u914d\u3002\n    7.  **\u670d\u52a1\u4f53\u9a8c**\uff1a**\u4f4e\u98ce\u9669**\u3002\u9500\u552e\u670d\u52a1\u7ec6\u81f4\u3001\u53cd\u9988\u53ca\u65f6\uff0c\u7528\u6237\u6709\u201c\u5e08\u59d0\u8f9b\u82e6\u4e86\u201d\u7b49\u6b63\u9762\u53cd\u9988\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u5408\u89c4\u60c5\u51b5**\uff1a\n    *   \u9500\u552e\u8fc7\u7a0b\u5b58\u5728**\u8425\u9020\u7d27\u8feb\u611f**\uff08\u201c\u4e0d\u5b8c\u6210\u8003\u6838\u4f5c\u4e1a\u4f1a\u88ab\u6dd8\u6c70\u201d\u3001\u201c\u9650\u65f61\u5c0f\u65f6\u201d\uff09\u3001**\u5851\u9020\u7a00\u7f3a\u6027**\uff08\u201c\u540d\u989d\u5df2\u7ecf\u5360\u4e0b\u201d\u3001\u201c\u5c31\u8fd9\u4e00\u6b21\u673a\u4f1a\u201d\uff09\u7b49\u5e38\u89c4\u8425\u9500\u624b\u6bb5\u3002\n    *   **\u672a\u53d1\u73b0**\u76f4\u63a5\u3001\u5177\u4f53\u7684\u6536\u5165\u627f\u8bfa\u6216\u5c31\u4e1a\u4fdd\u8bc1\u3002\n    *   **\u5b58\u5728\u6a21\u7cca\u8bf1\u5bfc**\uff1a\u5982\u201c\u52a0\u5165\u5c31\u6709\u4e66\u5f55\u201d\u3001\u201c\u4e00\u6b65\u6b65\u6765\u2026\u4ef7\u683c\u8d8a\u6765\u8d8a\u9ad8\u201d\uff0c\u53ef\u80fd\u5851\u9020\u8fc7\u4e8e\u4e50\u89c2\u7684\u884c\u4e1a\u524d\u666f\u8ba4\u77e5\u3002\n*   **\u4f26\u7406\u98ce\u9669**\uff1a**\u4e3b\u8981\u98ce\u9669\u5728\u4e8e\u53ef\u80fd\u672a\u5145\u5206\u4e86\u89e3\u7528\u6237\u5bb6\u5ead\u4e0e\u7ecf\u6d4e\u72b6\u51b5**\uff0c\u5728\u51b3\u7b56\u6743\u4e0d\u660e\u7684\u60c5\u51b5\u4e0b\u4fc3\u6210\u4ea4\u6613\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**\uff1a**\u5339\u914d**\u3002\u7528\u6237\u6709\u5b66\u4e60\u884c\u52a8\u529b\uff0c\u4ea7\u54c1\u80fd\u63d0\u4f9b\u5176\u6240\u9700\u7684\u6280\u80fd\u8bad\u7ec3\u548c\u5165\u95e8\u6307\u5bfc\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**\uff1a**24h\u5185\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\u4e0e\u652f\u4ed8\u51b3\u7b56**\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**\uff1a\n    1.  **\u9996\u8981\u98ce\u63a7\u52a8\u4f5c**\uff1a\u73ed\u4e3b\u4efb\u5e94\u5728\u9996\u6b21\u8054\u7cfb\u65f6\uff0c\u4ee5\u5173\u6000\u53e3\u543b\u81ea\u7136\u8be2\u95ee\uff1a\u201c\u770b\u5230\u60a8\u5b66\u4e60\u5f88\u6295\u5165\uff0c\u5bb6\u4eba\u5bf9\u60a8\u5b66\u4e60\u6709\u58f0\u652f\u6301\u5417\uff1f\u5f53\u65f6\u62a5\u540d\u662f\u548c\u5bb6\u4eba\u4e00\u8d77\u5546\u91cf\u7684\u5427\uff1f\u201d**\u52a1\u5fc5\u786e\u8ba4\u5bb6\u5ead\u77e5\u60c5\u4e0e\u652f\u6301\u60c5\u51b5**\u3002\n    2.  **\u9884\u671f\u7ba1\u7406**\uff1a\u5728\u9996\u6b21\u73ed\u4f1a\u6216\u6c9f\u901a\u4e2d\uff0c\u660e\u786e\u5b66\u4e60\u8def\u5f84\u3001\u6210\u957f\u5468\u671f\u548c\u521d\u671f\u6536\u76ca\u7684**\u4e0d\u786e\u5b9a\u6027**\uff0c\u6821\u6b63\u201c\u5feb\u901f\u53d8\u73b0\u201d\u7684\u9884\u671f\uff0c\u5f3a\u8c03\u6280\u80fd\u79ef\u7d2f\u7684\u957f\u671f\u6027\u3002\n    3.  **\u5f3a\u5316\u652f\u6301**\uff1a\u9488\u5bf9\u5176\u201c\u81ea\u6211\u6000\u7591\u201d\u4e0e\u201c\u7126\u8651\u201d\u7279\u70b9\uff0c\u7ed9\u4e88\u66f4\u5177\u4f53\u7684\u9636\u6bb5\u6027\u5c0f\u76ee\u6807\u8fbe\u6210\u53cd\u9988\uff0c\u5de9\u56fa\u5176\u201c\u4e0d\u7834\u4e0d\u7acb\u201d\u7684\u575a\u6301\u5fc3\u6001\u3002\n    4.  **\u89c2\u5bdf\u8ddf\u8fdb**\uff1a\u5bc6\u5207\u5173\u6ce8\u6b63\u5f0f\u5f00\u8bfe\u540e\u9996\u6b21\u9047\u5230\u74f6\u9888\u671f\uff08\u901a\u5e38\u662f\u7b2c3-4\u5468\uff09\u65f6\u7684\u60c5\u7eea\u4e0e\u6295\u5165\u5ea6\u53d8\u5316\uff0c\u53ca\u65f6\u5e72\u9884\u3002\n\n{\"core_type\": \"T4 \u52a1\u5b9e\u63a2\u7d22\u8005\uff08\u9700\u6838\u67e5\u662f\u5426T2\uff09\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u5339\u914d\", \"action\": \"24h\u5185\u6838\u67e5\u5bb6\u5ead\u77e5\u60c5\"}";
