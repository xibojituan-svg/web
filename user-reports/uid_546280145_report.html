        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 546280145 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-22 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6c90\u7efe\u83c0(\u5f20\u5a49\u94b0) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u6500\u767b\u8ba1\u5212\uff09\uff0c\u5e76\u5df2\u62a5\u540d\u540e\u671f\u8bfe\u7a0b |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u5b58\u5728\u665a\u95f4\u5b66\u4e60\u65f6\u95f4\uff0823:57\u4ecd\u5728\u7ec3\u4f5c\u4e1a\uff09\uff0c\u4e14\u80fd\u4e3b\u52a8\u89c4\u5212\u5b66\u4e60\uff08\u8981\u6c42\u7763\u4fc3\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u5355\u8eab\u72ec\u7acb**\uff08\u521a\u5206\u624b\uff0c\u65e0\u5bb6\u5ead\u5e72\u9884\u8ff9\u8c61\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\uff08\u6709\u5b66\u4e60\u884c\u4e3a\u4e0e\u60c5\u611f\u503e\u8bc9\uff0c\u4f46\u7f3a\u4e4f\u8d44\u91d1\u3001\u804c\u4e1a\u3001\u8bbe\u5907\u7b49\u5173\u952e\u80cc\u666f\u4fe1\u606f\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u2b06\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u6210\u957f\u800c\u6765\u3002\u4e3b\u52a8\u8be2\u95ee\u6280\u672f\u7ec6\u8282\uff08\u5e73\u7fd8\u820c\u7ec3\u4e60\u65b9\u6cd5\uff09\uff0c\u4e3b\u52a8\u62a5\u540d\u540e\u671f\u8bfe\u7a0b\uff0c\u5e76\u5173\u6ce8\u5b9e\u64cd\u5de5\u5177\uff08AU\u8f6f\u4ef6\uff09\u3002\u5b66\u4e60\u884c\u4e3a\u6301\u7eed\uff0c\u672a\u63d0\u53ca\u4efb\u4f55\u201c\u51e0\u5929\u8d5a\u94b1\u201d\u7b49\u53d8\u73b0\u6025\u8feb\u8bc9\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u73ed\u73ed\uff0c\u817f\u817f\u8001\u5e08\u8bf4\u6211\u8981\u591a\u7ec3\u5e73\u7fd8\u820c\uff0c\u8fd8\u6709\u8bed\u901f\u5feb\u6162\uff0c\u5e73\u7fd8\u820c\u662f\u7ec3\u8bcd\u8bed\u5417\u201d > \u201c\u5b66\u540e\u671f\u662f\u4e0d\u662f\u8981\u6709AU\u8ddf\u7740\u7ec3\u6bd4\u8f83\u597d\u554a\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u27a1\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u7ecf\u6d4e\u72b6\u51b5\uff0c\u4f46\u80fd\u8fde\u7eed\u62a5\u8bfe\uff08\u6709\u58f0+\u540e\u671f\uff09\uff0c\u63a8\u6d4b\u6709\u4e00\u5b9a\u652f\u4ed8\u80fd\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u575a\u6301\u665a\u95f4\u5b66\u4e60\uff0823:57\u7ec3\u4f5c\u4e1a\uff09\uff0c\u4e3b\u52a8\u8981\u6c42\u88ab\u7763\u4fc3\uff08\u201c\u5f97\u73ed\u73ed\u591a\u7763\u4fc3\u7763\u4fc3\u4e86\uff0c\u4e0d\u7136\u6211\u6ca1\u6709\u7d27\u8feb\u611f\u201d\uff09\uff0c\u663e\u793a\u6709\u5b66\u4e60\u610f\u613f\u548c\u4e00\u5b9a\u65f6\u95f4\u89c4\u5212\u80fd\u529b\uff0c\u4f46\u9700\u8981\u5916\u90e8\u9a71\u52a8\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u9ad8** \u2014 \u5355\u8eab\u72b6\u6001\uff0c\u65e0\u5bb6\u5ead\u5e72\u9884\u4fe1\u53f7\uff0c\u60c5\u611f\u56f0\u6270\uff08\u5206\u624b\uff09\u672a\u5f71\u54cd\u5b66\u4e60\u6295\u5165\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b07\u4f4e\u6781\u5371**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56**\u3002\u521a\u7ecf\u5386\u5206\u624b\u60c5\u611f\u521b\u4f24\uff0c\u4e3b\u52a8\u5411\u73ed\u4e3b\u4efb\u503e\u8bc9\u7ec6\u8282\uff08\u201c\u4ed6\u592a\u504f\u6fc0\u4e86\u201d\u3001\u201c\u5341\u70b9\u591a\u6211\u7ec3\u4f5c\u4e1a\u8fd8\u633a\u597d\u7684\uff0c\u521a\u7ec3\u597d\u4ed6\u5c31\u4e00\u76f4\u6253\u7535\u8bdd\u5f71\u54cd\u6211\u201d\uff09\u3002\u4e3b\u52a8\u8981\u6c42\u5916\u90e8\u7763\u4fc3\uff0c\u663e\u793a\u81ea\u6211\u9a71\u52a8\u529b\u4e0d\u8db3\uff0c**\u9ad8\u5ea6\u4f9d\u8d56\u5916\u90e8\u60c5\u7eea\u652f\u6301\u548c\u884c\u4e3a\u63a8\u52a8**\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u524d\u4e24\u5929\u5206\u624b\uff0c\u4e5f\u662f\u4ed6\u5148\u8bf4\u7684\u201d > \u201c\u4ed6\u592a\u504f\u6fc0\u4e86\u201d > \u201c\u5f97\u73ed\u73ed\u591a\u7763\u4fc3\u7763\u4fc3\u4e86\uff0c\u4e0d\u7136\u6211\u6ca1\u6709\u7d27\u8feb\u611f\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34\u4e0e\u5f52\u5c5e\u611f**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u60c5\u611f\u65ad\u88c2\u540e\u7684\u7a7a\u865a\u4e0e\u4e0d\u5b89\u5168\u611f**\u3002\u521a\u521a\u7ed3\u675f\u4e00\u6bb5\u8c08\u5a5a\u8bba\u5ac1\u7684\u604b\u60c5\uff0c\u6b63\u5904\u4e8e\u60c5\u611f\u7a7a\u7a97\u671f\u548c\u81ea\u4fe1\u5fc3\u53d7\u632b\u9636\u6bb5\u3002\u5b66\u4e60\u884c\u4e3a\uff08\u6df1\u591c\u7ec3\u4f5c\u4e1a\uff09\u53ef\u80fd\u6210\u4e3a\u5176\u586b\u8865\u7a7a\u865a\u3001\u5bfb\u627e\u65b0\u751f\u6d3b\u652f\u70b9\u548c\u60c5\u611f\u5bc4\u6258\u7684\u65b9\u5f0f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u63d0\u4f9b\u7a33\u5b9a\u3001\u53ef\u9760\u4e14\u5e26\u6709\u8f7b\u5ea6\u4f9d\u8d56\u6027\u7684\u201c\u7ebf\u4e0a\u5bb6\u4eba\u201d\u5f0f\u966a\u4f34**\u3002\u5979\u9700\u8981\u7684\u4e0d\u53ea\u662f\u6280\u672f\u6307\u5bfc\uff0c\u66f4\u662f\u4e00\u4e2a\u80fd\u503e\u542c\u60c5\u611f\u3001\u7ed9\u4e88\u80af\u5b9a\u3001\u5e76\u63a8\u52a8\u5979\u524d\u8fdb\u7684\u201c\u59d0\u59d0\u201d\u6216\u201c\u5bfc\u5e08\u201d\u89d2\u8272\uff0c\u4ee5\u66ff\u4ee3\u7f3a\u5931\u7684\u60c5\u611f\u652f\u6301\u7cfb\u7edf\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2 \u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u4e25\u91cd\u5185\u8017) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u5355\u8eab\u72b6\u6001\uff0c\u65e0\u5bb6\u5ead\u5e72\u9884\u98ce\u9669\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u60c5\u611f\u4f9d\u8d56\u8fc7\u5f3a**\u3002\u4e00\u65e6\u73ed\u4e3b\u4efb\u5173\u6000\u51cf\u5f31\u6216\u66f4\u6362\uff0c\u53ef\u80fd\u56e0\u201c\u88ab\u629b\u5f03\u611f\u201d\u800c\u653e\u5f03\u5b66\u4e60\u3002\u540c\u65f6\uff0c\u81ea\u6211\u9a71\u52a8\u529b\u5f31\uff0c\u82e5\u5916\u90e8\u7763\u4fc3\u505c\u6b62\uff0c\u6613\u56e0\u60f0\u6027\u79ef\u538b\u4f5c\u4e1a\u4ea7\u751f\u81ea\u8d23\uff0c\u6700\u7ec8\u5d29\u76d8\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669\u70b9**\u3002\u6280\u672f\u5b66\u4e60\u9047\u5230\u74f6\u9888\uff08\u5982\u5e73\u7fd8\u820c\u95ee\u9898\u4e45\u653b\u4e0d\u514b\uff09\u6216\u60c5\u611f\u518d\u6b21\u53d7\u632b\u65f6\uff0c\u6781\u6613\u5c06\u632b\u8d25\u611f\u5f52\u56e0\u4e8e\u81ea\u8eab\u80fd\u529b\uff0c\u4ea7\u751f\u201c\u6211\u592a\u7b28\u4e86\u5b66\u4e0d\u4f1a\u201d\u7684\u5d29\u6e83\u5ff5\u5934\uff0c\u89e6\u53d1\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u76ee\u524d\u52a8\u673a\u7eaf\u5ea6\u9ad8\uff0c\u672a\u8868\u73b0\u51fa\u6025\u5207\u53d8\u73b0\u8bc9\u6c42\u3002\u4f46\u82e5\u957f\u671f\u63a5\u4e0d\u5230\u5355\uff0c\u7ed3\u5408\u5176\u4f4e\u5fc3\u7406\u5f39\u6027\uff0c\u53ef\u80fd\u9010\u6e10\u8f6c\u5316\u4e3a\u5bf9\u8bfe\u7a0b\u4ef7\u503c\u7684\u6000\u7591\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-4\u5468\u540e\uff0c\u9996\u6b21\u9047\u5230\u660e\u663e\u6280\u672f\u74f6\u9888\u6216\u4f5c\u4e1a\u88ab\u4e25\u5389\u6279\u8bc4\u65f6**\uff1b\u6216**\u73ed\u4e3b\u4efb\u5173\u6000\u9891\u7387\u663e\u8457\u964d\u4f4e\u65f6**\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u770b\u5230\u4f60\u6700\u8fd1\u5728\u52aa\u529b\u7ec3\u4e60\uff0c\u7279\u522b\u4e3a\u4f60\u5f00\u5fc3\u3002\u5b66\u4e60\u65b0\u6280\u80fd\u672c\u8eab\u5c31\u662f\u4e00\u6bb5\u5f88\u68d2\u7684\u81ea\u6211\u91cd\u5efa\u4e4b\u65c5\u3002\u522b\u6015\u9047\u5230\u95ee\u9898\uff0c\u6709\u4efb\u4f55\u6280\u672f\u4e0a\u7684\u5361\u70b9\u6216\u8005\u5fc3\u60c5\u4e0a\u7684\u6ce2\u52a8\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4e00\u76f4\u5728\u3002\u54b1\u4eec\u4e00\u6b65\u4e00\u6b65\u6765\uff0c\u628a\u8fd9\u91cc\u5f53\u6210\u4e00\u4e2a\u65b0\u7684\u8d77\u70b9\u548c\u4f9d\u9760\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** (\u56e0\u5176\u6709\u6280\u672f\u7cbe\u8fdb\u610f\u613f)\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\uff08\u6ee1\u914dC\u6a21\u5757\uff09\u3011** + **\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\uff08\u8f7b\u91cfB\u6a21\u5757\uff09\u3011**\u3002\u5fc5\u987b\u7528\u9ad8\u6d53\u5ea6\u60c5\u611f\u966a\u4f34\uff08C\uff09\u6258\u4f4f\u5176\u60c5\u7eea\uff0c\u540c\u65f6\u7528\u7cbe\u51c6\u7684\u6280\u672f\u6307\u5bfc\uff08B\uff09\u6ee1\u8db3\u5176\u5b66\u4e60\u8bc9\u6c42\uff0c\u907f\u514d\u56e0\u632b\u8d25\u611f\u5d29\u76d8\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5728\u5979\u503e\u8bc9\u60c5\u611f\u95ee\u9898\u65f6\u7ed9\u51fa\u7406\u6027\u5efa\u8bae\u6216\u6577\u884d\u56de\u5e94\uff1b\u5728\u5979\u9047\u5230\u6280\u672f\u96be\u9898\u65f6\u4ec5\u53d1\u9001\u6559\u7a0b\u94fe\u63a5\u800c\u4e0d\u7ed9\u4e88\u5177\u4f53\u3001\u9f13\u52b1\u6027\u7684\u6307\u5bfc\uff1b\u7528\u201c\u522b\u4eba\u90fd\u884c\u4f60\u600e\u4e48\u4e0d\u884c\u201d\u7b49\u8bdd\u8bed\u65bd\u538b\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u77ed\u671f\u5185\u4e25\u7981\u4efb\u4f55\u5347\u5355\u63a8\u9500**\u3002\u5f85\u5176\u60c5\u7eea\u7a33\u5b9a\u3001\u5b66\u4e60\u8fdb\u5165\u6b63\u8f68\u5e76\u5efa\u7acb\u5f3a\u4fe1\u4efb\u540e\uff0c\u53ef\u8003\u8651\u57fa\u4e8e\u5176\u5174\u8da3\uff08\u5982\u5df2\u62a5\u540e\u671f\u8bfe\uff09\u8fdb\u884c\u76f8\u5173\u8f7b\u91cf\u7ea7\u4ea4\u53c9\u63a8\u8350\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u524d\u4e24\u5929\u5206\u624b\uff0c\u4e5f\u662f\u4ed6\u5148\u8bf4\u7684\u201d **\uff08\u60c5\u611f\u8106\u5f31\uff0c\u5bfb\u6c42\u503e\u8bc9\uff09**\n2. > \u201c\u5341\u70b9\u591a\u6211\u7ec3\u4f5c\u4e1a\u8fd8\u633a\u597d\u7684\uff0c\u521a\u7ec3\u597d\u4ed6\u5c31\u4e00\u76f4\u6253\u7535\u8bdd\u5f71\u54cd\u6211\u201d **\uff08\u5b66\u4e60\u6210\u4e3a\u60c5\u611f\u907f\u96be\u6240\uff0c\u4e14\u6613\u53d7\u5916\u754c\u5e72\u6270\uff09**\n3. > \u201c\u5f97\u73ed\u73ed\u591a\u7763\u4fc3\u7763\u4fc3\u4e86\uff0c\u4e0d\u7136\u6211\u6ca1\u6709\u7d27\u8feb\u611f\u201d **\uff08\u5178\u578b\u4f4e\u5fc3\u7406\u5f39\u6027\u4e0e\u5916\u90e8\u4f9d\u8d56\u4fe1\u53f7\uff09**\n4. > \u201c\u73ed\u73ed\uff0c\u817f\u817f\u8001\u5e08\u8bf4\u6211\u8981\u591a\u7ec3\u5e73\u7fd8\u820c\uff0c\u8fd8\u6709\u8bed\u901f\u5feb\u6162\uff0c\u5e73\u7fd8\u820c\u662f\u7ec3\u8bcd\u8bed\u5417\u201d **\uff08\u9ad8\u52a8\u673a\u7eaf\u5ea6\uff0c\u5173\u6ce8\u6280\u672f\u7cbe\u8fdb\uff09**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7b2c\u4e09\u5c42\u793e\u4ea4\u966a\u4f34\u4e0e\u5f52\u5c5e\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u7a33\u5b9a\u3001\u9ad8\u9891\u3001\u5e26\u6709\u8f7b\u5ea6\u4f9d\u8d56\u6027\u7684\u201c\u7ebf\u4e0a\u5bb6\u4eba\u201d\u5f0f\u60c5\u611f\u6258\u5e95\uff08\u6ee1\u914dC\u6a21\u5757\uff09\uff0c\u540c\u65f6\u7528\u7cbe\u51c6\u3001\u9f13\u52b1\u5f0f\u7684\u6280\u672f\u6307\u5bfc\uff08B\u6a21\u5757\uff09\u5e2e\u52a9\u5979\u5efa\u7acb\u5b66\u4e60\u6b63\u53cd\u9988\uff0c\u4e25\u9632\u6280\u672f\u632b\u8d25\u611f\u5f15\u53d1\u60c5\u7eea\u5d29\u6e83\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"maslow_need\": \"\u7b2c\u4e09\u5c42\u793e\u4ea4\u966a\u4f34\u4e0e\u5f52\u5c5e\u611f\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\uff08\u6ee1\u914dC\uff09+ \u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\uff08\u8f7b\u91cfB\uff09\"}\n```";
