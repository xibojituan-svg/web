    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a\n\n## \u4fe1\u606f\u5145\u8db3\u6027\u8bc4\u4f30\n\u4fe1\u606f\u5145\u8db3\uff0c\u65e0\u9700\u989d\u5916\u6807\u6ce8\u3002\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u9ad8)**: \u660e\u786e\u804c\u4e1a/\u526f\u4e1a\u5bfc\u5411\u3002\u5df2\u5f00\u59cb\u63a5\u4e66\uff08\u201c\u521a\u53c8\u6536\u5230\u4e24\u672c\u4e66\u201d\uff09\u3001\u53c2\u4e0e\u5267\u7ec4\u3001\u62db\u52df\u89d2\u8272\u3001\u4f7f\u7528\u4e13\u4e1a\u5de5\u5177\uff08\u5471\u5471\uff09\uff0c\u884c\u52a8\u529b\u5f3a\uff0c\u76ee\u6807\u6e05\u6670\uff08\u6210\u4e3a\u201c\u975e\u5e38\u4f18\u79c0\u7684\u5236\u4f5c\u4eba\u201d\uff09\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d)**: \u5177\u5907\u57fa\u7840\u6280\u80fd\uff08\u6709\u58f0\u6f14\u64ad\u5b66\u4e60ing\uff09\u3001\u8bbe\u5907\u4e0e\u65f6\u95f4\uff08\u80fd\u53c2\u4e0e\u665a\u95f4\u6d3b\u52a8\u3001\u5904\u7406\u591a\u4efb\u52a1\uff09\u3002**\u4f46\u5b58\u5728\u8d44\u6e90\u7d27\u5f20\u4fe1\u53f7**\uff1a\u5bf9\u9ad8\u7814\u73ed\u8868\u793a\u201c\u5317\u4eac\u592a\u8fdc\u4e86 \u5b9e\u5728\u6ca1\u8fd9\u4e2a\u5b9e\u529b\u201d\u3001\u201c\u8981\u8bf7\u4e00\u793c\u62dc\u5047\u5462\u201d\u3001\u201c\u4e5f\u6709\u70b9\u8d35\u201d\uff0c\u663e\u793a\u65f6\u95f4\u4e0e\u8d44\u91d1\u5f39\u6027\u6709\u9650\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u9ad8)**: \u793e\u7fa4\u6d3b\u8dc3\u5ea6\u9ad8\uff08\u7ec4\u7ec7\u3001\u9f13\u52b1\u3001\u7b54\u7591\u3001\u5206\u4eab\uff09\uff0c\u4e50\u4e8e\u52a9\u4eba\uff0c\u60c5\u7eea\u79ef\u6781\u7a33\u5b9a\u3002\u9762\u5bf9\u201c\u6c14\u606f\u4e0d\u884c\u201d\u7b49\u5177\u4f53\u95ee\u9898\u6709\u6e05\u6670\u8ba4\u77e5\uff0c\u5e76\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff0c\u6297\u538b\u4e0e\u9002\u5e94\u6027\u597d\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 \u652f\u4ed8\u6838\u67e5**: \u5df2\u652f\u4ed8\uff08\u5904\u4e8e\u8bfe\u7a0b\u670d\u52a1\u671f\uff0c\u9500\u552e\u5728\u8ddf\u8fdb\u9ad8\u7814\u73ed\u8f6c\u5316\uff09\u3002\n*   **\u6b65\u9aa41.5 \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: \u672a\u63d0\u53ca\u5bb6\u5ead\u5e72\u9884\uff0c\u51b3\u7b56\u81ea\u4e3b\u3002\n*   **\u6838\u5fc3\u5224\u5b9a**: **B\u7c7b\u7528\u6237 (\u52a1\u5b9e\u884c\u52a8\u8005)**\u3002\u52a8\u673a\u6e05\u6670\uff08\u804c\u4e1a/\u526f\u4e1a\uff09\uff0c\u8d44\u6e90\u4e0e\u884c\u52a8\u5339\u914d\uff0c\u5df2\u8fdb\u5165\u5b9e\u8df5\u9636\u6bb5\uff08\u63a5\u4e66\u3001\u5efa\u7ec4\uff09\uff0c\u5fc3\u7406\u5f39\u6027\u597d\uff0c\u9500\u552e\u6c9f\u901a\u805a\u7126\u4e8e\u6280\u80fd\u63d0\u5347\u4e0e\u673a\u4f1a\u62d3\u5c55\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n**T4 \u52a1\u5b9e\u8fdb\u53d6\u8005**\u3002\u7279\u5f81\u9ad8\u5ea6\u543b\u5408\uff1a\u4ee5\u660e\u786e\u53d8\u73b0/\u804c\u4e1a\u53d1\u5c55\u4e3a\u5b66\u4e60\u6838\u5fc3\u9a71\u52a8\u529b\uff1b\u5df2\u542f\u52a8\u5b9e\u8df5\u5e76\u53d6\u5f97\u521d\u6b65\u6210\u679c\uff08\u6536\u5230A+\u9080\u7ea6\u3001\u7ec4\u5efa\u5267\u7ec4\uff09\uff1b\u5b66\u4e60\u4e0e\u793e\u7fa4\u53c2\u4e0e\u79ef\u6781\uff0c\u4e14\u5177\u5907\u7ec4\u7ec7\u4e0e\u52a9\u4eba\u884c\u4e3a\uff1b\u5bf9\u66f4\u9ad8\u9636\u6295\u5165\uff08\u5982\u9ad8\u7814\u73ed\uff09\u4f1a\u57fa\u4e8e\u73b0\u5b9e\u6761\u4ef6\uff08\u65f6\u95f4\u3001\u8d39\u7528\uff09\u7406\u6027\u6743\u8861\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n*   **\u603b\u4f53\u98ce\u9669\uff1a\u4f4e**\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**: \u98ce\u9669\u4f4e\u3002\u7528\u6237\u5df2\u83b7\u5f97\u6b63\u5411\u53cd\u9988\uff08\u63a5\u4e66\u3001\u9500\u552e\u8868\u626c\uff09\uff0c\u4e14\u81ea\u6211\u8ba4\u77e5\u6e05\u6670\uff08\u5982\u6c14\u606f\u95ee\u9898\uff09\uff0c\u5bf9\u5b66\u4e60\u8fc7\u7a0b\u6709\u5408\u7406\u9884\u671f\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b**: \u98ce\u9669\u4f4e\u3002\u672a\u63d0\u53ca\u7ecf\u6d4e\u56f0\u96be\uff0c\u4f46\u5bf9\u9ad8\u5355\u4ef7\u4ea7\u54c1\uff08\u9ad8\u7814\u73ed\uff09\u654f\u611f\uff0c\u5c5e\u7406\u6027\u6d88\u8d39\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**: \u98ce\u9669**\u4e2d**\u3002\u7528\u6237\u63d0\u53ca\u201c\u6700\u8fd1\u5de5\u4f5c\u6709\u70b9\u5fd9\u201d\uff0c\u4e14\u56e0\u65f6\u95f4/\u8bf7\u5047\u539f\u56e0\u62d2\u7edd\u9ad8\u7814\u73ed\u3002**\u9700\u5173\u6ce8\u5176\u4e3b\u4e1a\u4e0e\u526f\u4e1a\u5b66\u4e60\u7684\u65f6\u95f4\u5e73\u8861**\uff0c\u907f\u514d\u56e0\u8fc7\u8f7d\u5bfc\u81f4\u8bfe\u7a0b\u5b8c\u6210\u5ea6\u4e0b\u964d\u6216\u4ea7\u751f\u62b1\u6028\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9**: \u98ce\u9669\u6781\u4f4e\u3002\u672a\u63d0\u53ca\u3002\n    5.  **\u9500\u552e\u8bef\u5bfc**: \u98ce\u9669\u4f4e\u3002\u8bb0\u5f55\u4e2d\u9500\u552e\u4ee5\u9f13\u52b1\u3001\u63d0\u4f9b\u673a\u4f1a\u4e3a\u4e3b\uff0c\u672a\u53d1\u73b0\u5938\u5927\u627f\u8bfa\u3002\n    6.  **\u670d\u52a1\u4f53\u9a8c**: \u98ce\u9669\u6781\u4f4e\u3002\u7528\u6237\u6df1\u5ea6\u53c2\u4e0e\u793e\u7fa4\u4e0e\u670d\u52a1\uff0c\u5e76\u626e\u6f14\u7c7b\u4f3c\u201c\u5c0f\u52a9\u624b\u201d\u89d2\u8272\uff0c\u4f53\u9a8c\u79ef\u6781\u3002\n    7.  **\u7ade\u54c1\u6bd4\u8f83/\u89c2\u5ff5\u8f6c\u53d8**: \u98ce\u9669\u4f4e\u3002\u7528\u6237\u5df2\u6295\u5165\u5b9e\u8df5\uff0c\u8def\u5f84\u4f9d\u8d56\u8f83\u5f3a\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u9500\u552e\u884c\u4e3a**: \u57fa\u672c\u5408\u89c4\u3002\u9500\u552e\u4ee5\u9f13\u52b1\u3001\u63d0\u4f9b\u8d44\u6e90\uff08\u8bd5\u97f3\u673a\u4f1a\u3001\u9ad8\u7814\u73ed\u4fe1\u606f\uff09\u4e3a\u4e3b\u3002**\u4f46\u9700\u6ce8\u610f**\uff1a\u5728\u7528\u6237\u660e\u786e\u4ee5\u201c\u5de5\u4f5c\u5fd9\u3001\u8ddd\u79bb\u8fdc\u3001\u4ef7\u683c\u8d35\u201d\u4e09\u6b21\u62d2\u7edd\u9ad8\u7814\u73ed\u540e\uff0c\u9500\u552e\u4ecd\u6301\u7eed\u529d\u8bf4\uff08\u201c\u4f60\u503c\u5f97\u54e6\u201d\u3001\u201c\u4e0d\u8981\u7559\u4e0b\u9057\u61be\u201d\uff09\uff0c**\u5b58\u5728\u8f7b\u5fae\u65bd\u538b\u503e\u5411**\uff0c\u9700\u8b66\u60d5\u5f15\u53d1\u53cd\u611f\u3002\n*   **\u7528\u6237\u72b6\u6001**: \u65e0\u8fc7\u5ea6\u627f\u8bfa\u6216\u8bf1\u5bfc\u501f\u8d37\u98ce\u9669\u3002\u7528\u6237\u6d88\u8d39\u7406\u6027\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**: **\u5339\u914d**\u3002\u5f53\u524d\u8bfe\u7a0b\u5185\u5bb9\u4e0e\u7528\u6237\u7684\u5b9e\u8df5\u9700\u6c42\u9ad8\u5ea6\u5339\u914d\uff0c\u7528\u6237\u6b63\u5728\u6709\u6548\u5229\u7528\u8bfe\u7a0b\u8d44\u6e90\u4e0e\u793e\u7fa4\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **\u63d0\u4f9b\u8d44\u6e90\u94fe\u63a5\uff0c\u5de9\u56fa\u5b66\u4e60\u6210\u679c**\u3002\n*   **\u8be6\u7ec6\u884c\u52a8\u5efa\u8bae**:\n    1.  **\u6838\u5fc3\u7b56\u7565**: \u5c06\u5176\u89c6\u4e3a **\u201c\u79cd\u5b50\u7528\u6237\u201d/\u201c\u793e\u7fa4\u9886\u8896\u201d** \u8fdb\u884c\u7ef4\u62a4\u3002\u80af\u5b9a\u5176\u7ec4\u7ec7\u4e0e\u4e92\u52a9\u884c\u4e3a\uff0c\u53ef\u9002\u5f53\u8d4b\u4e88\u975e\u6b63\u5f0f\u89d2\u8272\uff08\u5982\u5c0f\u7ec4\u957f\uff09\uff0c\u6fc0\u53d1\u5176\u8d23\u4efb\u611f\u4e0e\u5f52\u5c5e\u611f\u3002\n    2.  **\u98ce\u9669\u9632\u8303**: \u5173\u6ce8\u5176\u65f6\u95f4\u7ba1\u7406\u3002\u5728\u6c9f\u901a\u4e2d\u7406\u89e3\u5176\u201c\u5de5\u4f5c\u5fd9\u201d\u7684\u73b0\u72b6\uff0c\u63d0\u4f9b\u7075\u6d3b\u7684\u5b66\u4e60\u4efb\u52a1\u5b8c\u6210\u5efa\u8bae\uff0c\u907f\u514d\u56e0\u65f6\u95f4\u538b\u529b\u4ea7\u751f\u632b\u8d25\u611f\u3002\n    3.  **\u673a\u4f1a\u6316\u6398**: **\u6682\u7f13\u9ad8\u9636\u8bfe\u7a0b\u5f3a\u63a8**\u3002\u5c0a\u91cd\u5176\u5f53\u524d\u9009\u62e9\uff0c\u5c06\u91cd\u70b9\u653e\u5728\u5e2e\u52a9\u5176\u7528\u597d\u73b0\u6709\u8bfe\u7a0b\uff0c\u901a\u8fc7\u5176\u53d6\u5f97\u7684\u5b9e\u8df5\u6210\u679c\uff08\u5982\u6210\u529f\u5b8c\u672c\u3001\u83b7\u5f97\u6536\u76ca\uff09\u81ea\u7136\u5efa\u7acb\u4fe1\u4efb\uff0c\u4e3a\u672a\u6765\u6f5c\u5728\u8f6c\u5316\u94fa\u57ab\u3002\n    4.  **\u670d\u52a1\u6df1\u5316**: \u4e3b\u52a8\u5bf9\u63a5\u5176\u9700\u8981\u7684\u8d44\u6e90\uff0c\u5982\u63a8\u8350\u66f4\u9002\u5408\u5176\u97f3\u8272\u7684\u8bd5\u97f3\u673a\u4f1a\u3001\u5f15\u8350\u540e\u671f\u4f19\u4f34\u7b49\uff0c\u505a\u5b9e\u201c\u652f\u6301\u8005\u201d\u89d2\u8272\u3002\n\n{\"core_type\": \"T4 \u52a1\u5b9e\u8fdb\u53d6\u8005\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4f4e\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u63d0\u4f9b\u8d44\u6e90\u94fe\u63a5\uff0c\u5de9\u56fa\u5b66\u4e60\u6210\u679c\"}";
        document.getElementById('content').innerHTML = marked.parse(markdownText);
