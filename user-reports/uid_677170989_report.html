    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677170989 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u516d\u6708\u6668\u516e/\u5e03\u4e01 (\u5218\u519b) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u6f14\u64ad\u9ad8\u9636\u73ed (2380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u672a\u77e5** (\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c**\u5173\u952e\u4fe1\u606f\u7f3a\u5931**) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u6d17\u8f66\u884c\u4e0a\u73ed + \u533b\u62a4\u4eba\u5458\uff0c\u53cc\u91cd\u517c\u804c) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u672a\u77e5** (\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49** (\u6709\u660e\u786e\u804c\u4e1a\u3001\u52a8\u673a\u3001\u8d44\u6e90\u77ed\u677f\u4fe1\u606f\uff0c\u4f46\u7f3a\u5931\u652f\u4ed8\u3001\u5bb6\u5ead\u652f\u6301\u7b49\u5173\u952e\u7ef4\u5ea6) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e\uff0c\u6709\u6781\u5f3a\u5b66\u4e60\u610f\u613f\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u5bf9\u6280\u672f\u539f\u7406\u7684\u6df1\u5ea6\u8ffd\u95ee\u6216\u81ea\u6211\u5b9e\u73b0\u7684\u8ffd\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u662f\u5728\u6d17\u8f66\u884c\u4e0a\u73ed\uff0c\u5b66\u4e60\u8fd9\u4e2a\u5f55\u97f3\u662f\u60f3\u505a\u4efd\u517c\u804c\uff0c\u80fd\u6709\u591a\u4e00\u4efd\u6536\u5165\u3002\u201d > \u201c\u96f6\u57fa\u7840\uff0c\u4f46\u6211\u60f3\u8bd5\u8bd5\u3002[\u574f\u7b11]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u672a\u77e5** \u2014 \u672a\u63d0\u53ca\uff0c\u4f46\u4ece\u4e8b\u6d17\u8f66\u884c\u548c\u533b\u62a4\u517c\u804c\uff0c\u63a8\u6d4b\u7ecf\u6d4e\u6761\u4ef6\u4e0d\u5bbd\u88d5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e** \u2014 \u53cc\u91cd\u517c\u804c\u5de5\u4f5c\uff0c\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\uff0c\u5b66\u4e60\u9700\u201c\u7a7a\u95f2\u65f6\u201d\u8fdb\u884c\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u672a\u77e5** \u2014 \u672a\u63d0\u53ca\u3002\n- **\u7269\u7406\u786c\u4ef6**\uff1a**\u6781\u4f4e** \u2014 \u201c\u6211\u73b0\u5728\u53ea\u6709\u4e00\u90e8\u624b\u673a\u201d\uff0c\u660e\u786e\u7f3a\u4e4f\u7535\u8111\u7b49\u57fa\u7840\u8bbe\u5907\uff0c\u6784\u6210**\u4e25\u91cd\u8d44\u6e90\u77ed\u677f**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u27a1\u4e2d**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a**\u3002\u80fd\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u542c\u4ece\u6307\u5bfc\uff0c\u672a\u51fa\u73b0\u5d29\u6e83\u6216\u653e\u5f03\u4fe1\u53f7\u3002\u9762\u5bf9\u9500\u552e\u5bc6\u96c6\u7684\u9f13\u52b1\u548c\u6307\u5bfc\uff0c\u80fd\u79ef\u6781\u56de\u5e94\uff08\u201c\u5bf9\u5bf9\u201d\u3001\u201c\u50cf\u60a8\u8fd9\u6837\u7684\u5c31\u5f88\u6709\u6c1b\u56f4\u611f\u201d\uff09\uff0c\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u5b66\u4e60\u97e7\u6027\u548c\u914d\u5408\u5ea6\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u7a7a\u95f2\u65f6\u518d\u4ed4\u7ec6\u770b\u770b\u5e08\u59d0\u60a8\u7ed9\u6211\u53d1\u6bcf\u4e00\u6761\u4fe1\u606f\u3002\u4e4b\u540e\u518d\u7b54\u590d\u60a8\uff01\u201d (\u8868\u73b0\u51fa\u8c28\u614e\u548c\u5c0a\u91cd\uff0c\u975e\u60c5\u7eea\u5316\u53cd\u5e94)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 (\u7126\u8651\u4fdd\u969c)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u7ecf\u6d4e\u538b\u529b\u4e0b\u7684\u804c\u4e1a\u7126\u8651**\u3002\u62e5\u6709\u4e24\u4efd\u517c\u804c\uff08\u6d17\u8f66\u884c\u3001\u533b\u62a4\u4eba\u5458\uff09\uff0c\u4f46\u4ecd\u5bfb\u6c42\u201c\u591a\u4e00\u4efd\u6536\u5165\u201d\uff0c\u8868\u660e\u5bf9\u7ecf\u6d4e\u5b89\u5168\u6709\u5f3a\u70c8\u7684\u4e0d\u786e\u5b9a\u611f\u548c\u6539\u5584\u6e34\u671b\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u53ef\u5b9e\u73b0\u7684\u5e0c\u671b\u201d\u4e0e\u201c\u6e05\u6670\u7684\u8def\u5f84\u201d**\u3002\u4ed6\u9700\u8981\u88ab\u660e\u786e\u544a\u77e5\uff0c\u5373\u4f7f\u65f6\u95f4\u788e\u7247\u5316\u3001\u8bbe\u5907\u7b80\u964b\uff0c\u901a\u8fc7\u7cfb\u7edf\u5b66\u4e60\u548c\u5e73\u53f0\u8d44\u6e90\uff0c\u517c\u804c\u53d8\u73b0\u662f\u53ef\u8fbe\u6210\u7684\u76ee\u6807\uff0c\u4ee5\u7f13\u89e3\u5176\u751f\u5b58\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u8bba** (\u4e9a\u79cd\uff1a\u5bb6\u5ead\u91cd\u8d1f\u62fc\u547d\u578b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1 (\u672a\u68c0\u6d4b\u5230\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u8a00\u8bba)\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n**\u5224\u5b9a\u6811\u8def\u5f84\u56de\u6eaf**\uff1a\n1.  **\u52a8\u673a\u7eaf\u5ea6 (5-6\u5206)**\uff1a\u660e\u786e\u517c\u804c\u53d8\u73b0\u76ee\u7684\uff0c\u7b26\u5408\u201c\u4e2d\u201d\u8bc4\u7ea7\u3002\n2.  **\u8d44\u6e90\u5e95\u5ea7 (1-2\u5206)**\uff1a\u4ec5\u6709\u624b\u673a\uff0c\u65f6\u95f4\u788e\u7247\u5316\uff0c\u77ed\u677f\u6781\u77ed\uff0c\u8bc4\u7ea7\u4e3a\u201c\u4f4e\u201d\u3002\n3.  **\u5fc3\u7406\u5f39\u6027 (5-6\u5206)**\uff1a\u914d\u5408\u5ea6\u9ad8\uff0c\u65e0\u5d29\u6e83\u4fe1\u53f7\uff0c\u8bc4\u7ea7\u4e3a\u201c\u4e2d\u201d\u3002\n4.  **\u5224\u5b9a\u6811\u5339\u914d**\uff1a\u52a8\u673a\u7eaf\u5ea65-6\u5206 + \u8d44\u6e90\u5e95\u5ea7\u22644\u5206 + \u51fa\u73b0\u52a1\u5b9e\u53d8\u73b0\u8bc9\u6c42 \u2192 **\ud83d\udfe1 \u5224\u5b9a\uff1aT4 \u641e\u94b1\u7ed3\u679c\u8bba (C2\u7c7b)**\u3002\u7b26\u5408**\u4e9a\u79cd\uff1a\u5bb6\u5ead\u91cd\u8d1f\u62fc\u547d\u578b**\u7279\u5f81\uff08\u201c\u4e3a\u4e86\u5b69\u5b50\u62fc\u4e86\u201d\u7684\u60b2\u60c5\u611f\uff09\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u53cc\u91cd\u517c\u804c\u53ef\u80fd\u610f\u5473\u7740\u5bb6\u5ead\u7ecf\u6d4e\u538b\u529b\u5927\uff0c\u82e5\u5bb6\u4eba\u53cd\u5bf9\u6216\u53d1\u73b0\u5360\u7528\u8fc7\u591a\u65f6\u95f4\uff0c\u53ef\u80fd\u5f15\u53d1\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u6d17\u8f66\u884c+\u533b\u62a4\u53cc\u91cd\u5de5\u4f5c\uff0c\u65f6\u95f4\u6781\u5ea6\u788e\u7247\u5316\u3002\u4e00\u65e6\u6b63\u5f0f\u8bfe\u8bfe\u4e1a\u538b\u529b\u4e0e\u5de5\u4f5c\u65f6\u95f4\u51b2\u7a81\uff0c\u6781\u6613\u56e0\u201c\u8ddf\u4e0d\u4e0a\u8fdb\u5ea6\u201d\u4ea7\u751f\u81ea\u8d23\u548c\u653e\u5f03\u5ff5\u5934\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u76ee\u524d\u8868\u73b0\u914d\u5408\uff0c\u5fc3\u7406\u5f39\u6027\u5c1a\u53ef\uff0c\u4f46\u82e5\u56e0\u8bbe\u5907\u95ee\u9898\uff08\u4ec5\u624b\u673a\uff09\u5bfc\u81f4\u4f5c\u4e1a\u53cd\u590d\u88ab\u62d2\u6216\u6280\u672f\u95e8\u69db\u8fc7\u9ad8\uff0c\u53ef\u80fd\u89e6\u53d1\u81ea\u5351\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** T4\u5178\u578b\u7279\u5f81\u3002\u5bf9\u201c\u591a\u4e45\u80fd\u8d5a\u94b1\u201d\u62b1\u6709\u6025\u5207\u671f\u671b\u3002\u82e5\u5b66\u4e601-2\u4e2a\u6708\u540e\u63a5\u5355\u4e0d\u987a\uff0c\u6216\u53d1\u73b0\u624b\u673a\u5f55\u97f3\u96be\u4ee5\u6ee1\u8db3\u63a5\u5355\u8981\u6c42\uff0c\u6781\u6613\u56e0\u201c\u6536\u76ca\u843d\u5dee\u201d\u66b4\u6012\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c4-8\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u8bfe\u4e1a\u96be\u5ea6\u548c\u4f5c\u4e1a\u91cf\u589e\u52a0\uff0c\u82e5\u4ecd\u672a\u83b7\u5f97\u4efb\u4f55\u5b9e\u8d28\u6027\u7684\u517c\u804c\u6536\u5165\u53cd\u9988\uff0c\u7ed3\u5408\u5176\u65f6\u95f4\u538b\u529b\uff0c\u9000\u8d39\u98ce\u9669\u8fbe\u5230\u5cf0\u503c\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5e08\u5144/\u5e08\u59d0\uff0c\u770b\u5230\u4f60\u4e24\u4efd\u5de5\u4f5c\u8fd9\u4e48\u62fc\u8fd8\u6765\u5b66\u4e60\uff0c\u771f\u7684\u7279\u522b\u4f69\u670d\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u5c31\u662f\u4e3a\u50cf\u4f60\u8fd9\u6837\u65f6\u95f4\u4e0d\u591a\u7684\u540c\u5b66\u8bbe\u8ba1\u7684\uff0c**\u5173\u952e\u4e0d\u662f\u6bcf\u5929\u5b66\u591a\u4e45\uff0c\u800c\u662f\u628a\u96f6\u788e\u65f6\u95f4\u7528\u5bf9\u65b9\u6cd5**\u3002\u524d\u671f\u54b1\u4eec\u5c31\u7528\u624b\u673a\u7ec3\uff0c\u6211\u4e00\u6b65\u6b65\u5e26\u4f60\uff0c\u5148\u63a5\u70b9\u5c0f\u5355\u5b50\u627e\u5230\u611f\u89c9\uff0c\u522b\u7ed9\u81ea\u5df1\u592a\u5927\u538b\u529b\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5feb\u901f\u63a5\u5355\u7ebf\u3011**\u3002\u5fc5\u987b\u7d27\u5bc6\u56f4\u7ed5\u201c\u53d8\u73b0\u201d\u6838\u5fc3\uff0c\u4f18\u5148\u6559\u6388\u624b\u673a\u7aef\u6781\u7b80\u5f55\u97f3\u3001\u526a\u8f91\u548c\u63a5\u5355\u6d41\u7a0b\u3002\u8bfe\u7a0b\u5185\u5bb9\u9700\u9ad8\u5ea6\u6a21\u5757\u5316\uff0c\u9002\u914d\u5176\u788e\u7247\u65f6\u95f4\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T4\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a**\u3010\u7cbe\u786e\u6d3e\u5355\u62e6\u622a\u5305\u3011** + **\u3010\u9006\u5411\u9884\u671f\u7ba1\u7406\u9632\u5fa1\u5305\u3011**\u3002\u73ed\u4e3b\u4efb\u9700\u660e\u786e\u544a\u77e5\u5e73\u5747\u63a5\u5355\u5468\u671f\uff08\u59822-3\u4e2a\u6708\uff09\uff0c\u5e76\u4e25\u683c\u7b5b\u9009\u3001\u63a8\u9001\u4e0e\u5176\u5f53\u524d\u8bbe\u5907\uff08\u624b\u673a\uff09\u548c\u6c34\u5e73\u5339\u914d\u7684\u771f\u5b9e\u8bd5\u97f3\u5355\uff0c\u675c\u7edd\u4e0d\u5207\u5b9e\u9645\u7684\u753b\u997c\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u7528\u201c\u6708\u5165\u8fc7\u4e07\u201d\u7b49\u5938\u5f20\u6848\u4f8b\u8fc7\u5ea6\u523a\u6fc0\u5176\u53d8\u73b0\u7126\u8651\uff1b2. \u8fc7\u65e9\u63a8\u8350\u9700\u8981\u7535\u8111\u548c\u9ad8\u9636\u8bbe\u5907\u7684\u8bfe\u7a0b\u6216\u4efb\u52a1\uff1b3. \u7528\u4e25\u683c\u7684\u6253\u5361\u8003\u52e4\u5236\u5ea6\u65bd\u538b\uff0c\u5ffd\u89c6\u5176\u5de5\u4f5c\u65f6\u95f4\u7279\u6b8a\u6027\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u57fa\u7840\u6280\u80fd\u672a\u8fbe\u6807\u3001\u672a\u4ea7\u751f\u7b2c\u4e00\u7b14\u6536\u5165\u524d\uff0c\u8fdb\u884c\u4efb\u4f55\u9ad8\u5ba2\u5355\u4ef7\u8bfe\u7a0b\uff08\u5982\u540e\u671f\u5236\u4f5c\u3001\u8bbe\u5907\u8bfe\uff09\u7684\u5347\u5355\u63a8\u9500**\u3002\u5fc5\u987b\u5148\u5e2e\u52a9\u5176\u7528\u73b0\u6709\u8d44\u6e90\uff08\u624b\u673a\uff09\u5b9e\u73b0\u96f6\u7684\u7a81\u7834\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u662f\u5728\u6d17\u8f66\u884c\u4e0a\u73ed\uff0c\u5b66\u4e60\u8fd9\u4e2a\u5f55\u97f3\u662f\u60f3\u505a\u4efd\u517c\u804c\uff0c\u80fd\u6709\u591a\u4e00\u4efd\u6536\u5165\u3002\u201d **(\u6838\u5fc3\u52a8\u673a\uff1a\u5b89\u5168\u9700\u6c42\u9a71\u52a8\u4e0b\u7684\u52a1\u5b9e\u53d8\u73b0)**\n2. > \u201c\u6211\u73b0\u5728\u53ea\u6709\u4e00\u90e8\u624b\u673a\u201d **(\u6838\u5fc3\u8d44\u6e90\u77ed\u677f\uff1a\u8bbe\u5907\u6781\u5ea6\u532e\u4e4f)**\n3. > \u201c\u6211\u771f\u6b63\u7684\u5de5\u4f5c\u662f\u533b\u62a4\u4eba\u5458\uff0c\u517c\u804c\u6d17\u8f66\u3002\u201d **(\u65f6\u95f4\u788e\u7247\u5316\u4e0e\u751f\u5b58\u538b\u529b\u7684\u53cc\u91cd\u5370\u8bc1)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T4 \u641e\u94b1\u7ed3\u679c\u8bba\uff08\u5bb6\u5ead\u91cd\u8d1f\u62fc\u547d\u578b\uff09\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u7ecf\u6d4e\u5b89\u5168\u4e0e\u4fdd\u969c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u4e25\u683c\u6267\u884c\u9006\u5411\u9884\u671f\u7ba1\u7406 + \u63d0\u4f9b\u4e0e\u5176\u624b\u673a\u8bbe\u5907\u5339\u914d\u7684\u3001\u6e05\u6670\u7684\u5fae\u5c0f\u53d8\u73b0\u8def\u5f84\uff0c\u5e76\u7528\u201c\u65f6\u95f4\u5f39\u6027\u673a\u5236\u201d\u515c\u5e95\u5176\u788e\u7247\u5316\u65f6\u95f4\u3011**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u8bba\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u5feb\u901f\u63a5\u5355\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
