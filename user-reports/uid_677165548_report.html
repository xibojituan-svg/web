u5fc3\u8fd8\u662f\u6709\u4e00\u70b9\u5bf9\u81ea\u5df1\u7684\u58f0\u97f3\u4e0d\u662f\u5f88\u81ea\u4fe1\u201d\uff09\uff0c\u5e0c\u671b\u901a\u8fc7\u6280\u80fd\u63d0\u5347\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u548c\u5c0a\u91cd\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u80af\u5b9a\u4e0e\u4ef7\u503c\u8ba4\u540c**\u3002\u901a\u8fc7\u7ec6\u81f4\u7684\u4f5c\u4e1a\u70b9\u8bc4\u3001\u7ed9\u4e88\u201c\u9752\u53d4\u97f3\u5f88\u6709\u8fa8\u8bc6\u5ea6\u201d\u7b49\u5177\u4f53\u80af\u5b9a\uff0c\u6ee1\u8db3\u5176\u88ab\u5c0a\u91cd\u3001\u88ab\u770b\u89c1\u7684\u9700\u6c42\uff0c\u4ece\u800c\u5efa\u7acb\u4e13\u4e1a\u4fe1\u4efb\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B\u7c7b** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4f4e** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u884c\u4e3a\u72ec\u7acb\uff0c\u672a\u89c1\u5bb6\u5ead\u5e72\u9884\u8ff9\u8c61\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u5b66\u4e60\u8282\u594f\u7a33\u5b9a\uff0c\u6267\u884c\u529b\u5f3a\uff0c\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5f85\u89c2\u5bdf\u4f46\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u4e3b\u52a8\u5904\u7406\u5b66\u4e60\u4e2d\u7684\u5c0f\u632b\u6298\uff08\u5982\u8bfb\u9519\u6682\u505c\uff09\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u95ee\u9898\u5d29\u6e83\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | **\u4e3b\u8981\u98ce\u9669\u70b9**\u3002\u52a8\u673a\u4e2d\u5305\u542b\u660e\u786e\u7684\u517c\u804c\u53d8\u73b0\u8bc9\u6c42\uff0c\u82e5\u5b66\u4e60\u4e00\u6bb5\u65f6\u95f4\u540e\uff08\u59822-3\u4e2a\u6708\uff09\u63a5\u5355\u4e0d\u987a\u5229\u6216\u6536\u76ca\u672a\u8fbe\u9884\u671f\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c60-90\u5929**\uff08\u6280\u80fd\u7ec3\u4e60\u671f\u7ed3\u675f\uff0c\u8fdb\u5165\u63a5\u5355\u5b9e\u6218\u671f\uff0c\u82e5\u8fdf\u8fdf\u65e0\u6210\u679c\u6613\u4ea7\u751f\u7126\u8651\uff09\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5e08\u5144\uff0c\u770b\u5230\u4f60\u5b66\u4e60\u8fd9\u4e48\u7a33\uff0c\u4f5c\u4e1a\u4ea4\u5f97\u53c8\u5feb\u53c8\u597d\uff0c\u7edd\u5bf9\u662f\u54b1\u4eec\u73ed\u7684\u6f5c\u529b\u80a1\u3002\u4f60\u7684\u2018\u9752\u53d4\u97f3\u2019\u5f88\u6709\u5e02\u573a\u8fa8\u8bc6\u5ea6\uff0c\u63a5\u4e0b\u6765\u54b1\u4eec\u5c31\u6309\u90e8\u5c31\u73ed\uff0c\u628a\u57fa\u7840\u6253\u624e\u5b9e\u3002**\u522b\u62c5\u5fc3\u63a5\u5355\uff0c\u6c34\u5230\u6e20\u6210\u7684\u4e8b\uff0c\u6211\u5148\u5e26\u4f60\u62ff\u4e0b\u51e0\u4e2a\u6709\u4ee3\u8868\u6027\u7684\u89d2\u8272\u97f3\u3002**\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011**\u3002\u5339\u914d\u5176\u7a33\u5b9a\u3001\u8ba4\u771f\u7684\u5b66\u4e60\u7279\u8d28\uff0c\u63d0\u4f9b\u7cfb\u7edf\u6027\u7684\u6280\u80fd\u8bad\u7ec3\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T2\u8001\u9ec4\u725b\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010B\u6a21\u5757\uff1a\u786c\u6838\u624b\u827a\u6c60\u3011**\uff0c\u5373**\u4e13\u5bb61v1\u7b54\u7591\u3001\u5201\u94bb\u53d1\u58f0/AI\u6307\u4ee4\u70b9\u8bc4\u3001\u771f\u5b9e\u6d3e\u5355\u5b9e\u6218**\u3002\u4e3a\u4ed6\u63d0\u4f9b\u6709\u6311\u6218\u6027\u7684\u4efb\u52a1\u548c\u6700\u4e25\u683c\u7684\u70b9\u8bc4\uff0c\u6ee1\u8db3\u5176\u8ffd\u6c42\u4e13\u4e1a\u7cbe\u8fdb\u7684\u9700\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u7528\u201c\u51e0\u5929\u5c31\u80fd\u8d5a\u5927\u94b1\u201d\u7684\u8bdd\u672f\u8fc7\u5ea6\u523a\u6fc0\u5176\u53d8\u73b0\u9884\u671f\uff1b2. \u5ffd\u89c6\u5176\u4f5c\u4e1a\u53cd\u9988\uff0c\u6216\u7ed9\u4e88\u6577\u884d\u7684\u8868\u626c\uff1b3. \u5728\u4ed6\u8868\u73b0\u51fa\u4e3b\u52a8\u5e2e\u52a9\u4ed6\u4eba\u6216\u7edf\u7b79\u610f\u613f\u65f6\uff0c\u7528\u5c45\u9ad8\u4e34\u4e0b\u7684\u53e3\u543b\u6253\u538b\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5f53\u5176\u6280\u80fd\u6709\u660e\u663e\u8fdb\u6b65\u5e76\u63a5\u5230\u7b2c\u4e00\u5355\u540e\uff0c\u53ef\u987a\u52bf\u63a8\u8350\u9ad8\u9636\u540e\u671f\u8bfe\u6216\u8bbe\u5907\u8bfe\u7a0b\uff0c\u4ed6\u6709\u6210\u4e3a\u9ad8\u590d\u8d2d\u6f5c\u529b\u7528\u6237\uff08T3\uff09\u7684\u6f5c\u8d28\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u517c\u804c\u526f\u4e1a\u201d & \u201c\u4e5f\u60f3\u63d0\u5347\u81ea\u5df1\u201d\n2. > \u201c\u540e\u9762\u7684\u8bfb\u9519\u4e86\u5c31\u6682\u505c\u4e86\u5e08\u5144\u201d\n3. > \u201c\u5176\u5b9e\u5185\u5fc3\u8fd8\u662f\u6709\u4e00\u70b9\u5bf9\u81ea\u5df1\u7684\u58f0\u97f3\u4e0d\u662f\u5f88\u81ea\u4fe1\u3002\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4e0e\u4ef7\u503c\u8ba4\u540c\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u624e\u5b9e\u7684B\u6a21\u5757\uff08\u786c\u6838\u624b\u827a\uff09\u652f\u6301\uff0c\u5e76\u7ba1\u7406\u597d\u5176\u517c\u804c\u53d8\u73b0\u7684\u9884\u671f\uff0c\u7528\u201c\u63a5\u5355\u662f\u6c34\u5230\u6e20\u6210\u201d\u66ff\u4ee3\u201c\u5feb\u901f\u66b4\u5bcc\u201d\u8bdd\u672f\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\"}\n```";
