    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677166092\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677166092 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5fae\u98ce\u5f90\u67656(\u5f90\u5c0f\u6d01) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u610f\u5411\u7cbe\u82f1\u7248\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u3010\u4fe1\u606f\u4e0d\u8db3\u3011**\uff0c\u7528\u6237\u4ec5\u8868\u8fbe\u201c\u60f3\u62a5\u9ad8\u9636\u7684\uff0c\u53c8\u6ca1\u6709\u90a3\u4e48\u591a\u94b1\u201d\uff0c\u672a\u900f\u9732\u5177\u4f53\u652f\u4ed8\u65b9\u5f0f\u3002\u9700\u8b66\u60d5\u6f5c\u5728\u5206\u671f/\u501f\u6b3e\u98ce\u9669\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u9910\u5385\u5de5\u4f5c\uff0c\u9ad8\u5cf0\u671f\u7e41\u5fd9\uff0c\u591a\u6b21\u56e0\u4e0a\u73ed\u9519\u8fc7\u76f4\u64ad\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u3010\u4fe1\u606f\u4e0d\u8db3\u3011**\uff0c\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u6709\u5b66\u4e60\u884c\u4e3a\u3001\u5174\u8da3\u8868\u8fbe\u548c\u51b3\u7b56\u7ea0\u7ed3\uff0c\u4f46\u5173\u952e\u652f\u4ed8\u548c\u5bb6\u5ead\u4fe1\u606f\u7f3a\u5931\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e**\uff0c\u5bf9\u201c\u63a5\u5355\u8d5a\u94b1\u201d\u6709\u76f4\u63a5\u8bc9\u6c42\uff0c\u4f46\u540c\u65f6\u4e5f\u5bf9\u6709\u58f0\u6f14\u64ad\u672c\u8eab\uff08\u8a00\u60c5/\u4fee\u4ed9\u7c7b\u5c0f\u8bf4\uff09\u8868\u73b0\u51fa\u5174\u8da3\u3002\u5c5e\u4e8e\u201c\u52a1\u5b9e\u53d8\u73b0+\u5174\u8da3\u63a2\u7d22\u201d\u7684\u6df7\u5408\u9a71\u52a8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u60f3\u517c\u804c\u6765\u7740\uff0c\u4f46\u662f\u80fd\u5168\u804c\u6700\u597d\u3002\u6211\u672c\u6765\u5c31\u662f\u4e2a\u5c0f\u8bf4\u8ff7\u3002\u89c9\u5f97\u633a\u6709\u610f\u601d\u7684\u201d\n  > \u201c\u6211\u60f3\u5148\u62a5\u7cbe\u82f1\u7248\uff0c\u4ee5\u540e\u518d\u5347\uff0c\u53c8\u6015\u6ca1\u4f4d\u7f6e\uff0c\u597d\u7ea0\u7ed3\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e (3-4\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u660e\u786e\u8868\u793a\u201c\u60f3\u62a5\u9ad8\u9636\u7684\uff0c\u53c8\u6ca1\u6709\u90a3\u4e48\u591a\u94b1\u201d\uff0c\u7ecf\u6d4e\u6761\u4ef6\u6709\u9650\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e** \u2014 \u9910\u5385\u5de5\u4f5c\uff0c\u65f6\u95f4\u4e0d\u81ea\u7531\uff0c\u591a\u6b21\u56e0\u4e0a\u73ed\u9519\u8fc7\u5173\u952e\u76f4\u64ad\uff08\u201c\u76f4\u64ad\u65f6\u95f4\u8ddf\u6211\u4e0a\u73ed\u65f6\u95f4\u5bf9\u4e0d\u4e0a\u201d\uff09\uff0c\u5b66\u4e60\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\uff0c\u6682\u4e0d\u6263\u5206\uff0c\u4f46\u9700\u540e\u7eed\u63a2\u67e5\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b07\u4f4e (3-4\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u5b58\u5728\u660e\u663e\u81ea\u5351\u548c\u754f\u96be\u60c5\u7eea**\uff0c\u9047\u5230\u521d\u671f\u5b66\u4e60\u56f0\u96be\uff08\u201c\u4e00\u5b66\u5c31\u4f1a\uff0c\u4e00\u8bf4\u5c31\u5e9f\u201d\u3001\u201c\u4e91\u91cc\u96fe\u91cc\u201d\uff09\u65f6\u8868\u73b0\u51fa\u632b\u8d25\u611f\uff0c\u5e76\u76f4\u63a5\u8868\u8fbe\u5bf9\u201c\u5b66\u4e0d\u4f1a\u201d\u7684\u6050\u60e7\u3002\u9700\u8981\u5916\u90e8\u9f13\u52b1\u548c\u660e\u786e\u6307\u5f15\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u4e00\u5b66\u5c31\u4f1a\uff0c\u4e00\u8bf4\u5c31\u5e9f\u201d\n  > \u201c\u4e91\u91cc\u96fe\u91cc\u201d\n  > \u201c\u6700\u6015\u592a\u7b28\uff0c\u5b66\u4e0d\u4f1a\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 (\u7126\u8651\u4fdd\u969c)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u7ecf\u6d4e\u72b6\u51b5\u6539\u5584\u7684\u8feb\u5207\u6e34\u671b\u4e0e\u81ea\u8eab\u80fd\u529b\u3001\u65f6\u95f4\u3001\u91d1\u94b1\u4e0d\u8db3\u4e4b\u95f4\u7684\u5f3a\u70c8\u51b2\u7a81**\u3002\u5979\u5e0c\u671b\u901a\u8fc7\u517c\u804c/\u5168\u804c\u6709\u58f0\u6f14\u64ad\u83b7\u5f97\u66f4\u7a33\u5b9a\u7684\u6536\u5165\uff08\u5b89\u5168\u9700\u6c42\uff09\uff0c\u4f46\u88ab\u201c\u6ca1\u94b1\u201d\u3001\u201c\u6ca1\u65f6\u95f4\u201d\u3001\u201c\u6015\u5b66\u4e0d\u4f1a\u201d\u4e09\u91cd\u73b0\u5b9e\u67b7\u9501\u56f0\u4f4f\uff0c\u4ea7\u751f\u5de8\u5927\u7126\u8651\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u63d0\u4f9b\u786e\u5b9a\u6027\u7684\u8def\u5f84\u548c\u5b89\u5168\u611f**\u3002\u5979\u4e0d\u9700\u8981\u7a7a\u6d1e\u7684\u9e21\u8840\uff0c\u800c\u662f\u9700\u8981\u4e00\u4efd\u6e05\u6670\u7684\u3001\u53ef\u6267\u884c\u7684\u3001\u80fd\u517c\u987e\u5979\u9910\u5385\u5de5\u4f5c\u7684\u201c\u8131\u8d2b\u201d\u8def\u7ebf\u56fe\uff0c\u4ee5\u53ca\u5bf9\u5979\u201c\u5b66\u4e0d\u4f1a\u201d\u6050\u60e7\u7684\u6301\u7eed\u5b89\u629a\u4e0e\u62c6\u89e3\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2\u7c7b (\u98ce\u9669\u7ba1\u63a7\u578b)** |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u5411T4\u641e\u94b1\u7ed3\u679c\u8bba\u8f7b\u5ea6\u504f\u79fb\u7684\u6df7\u5408\u6001) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5c5e\u53cd\u5bf9\u7684\u76f4\u63a5\u8bc1\u636e\u3002\u4f46**\u8d44\u6e90\u5e95\u5ea7\u4f4e\uff08\u65f6\u95f4\u3001\u91d1\u94b1\uff09\u4e0e\u5fc3\u7406\u5f39\u6027\u4f4e\uff08\u754f\u96be\uff09\u7684\u53e0\u52a0\uff0c\u6784\u6210\u4e86C2\u7ea7\u7684\u9ad8\u6d41\u5931\u98ce\u9669**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7ecf\u6d4e\u538b\u529b\u53ef\u80fd\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u6781\u9ad8** | **\u9910\u5385\u5de5\u4f5c\u5236\u5bfc\u81f4\u76f4\u64ad\u8bfe\u5927\u91cf\u7f3a\u5e2d\uff0c\u4f5c\u4e1a\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u632b\u8d25\u611f\u548c\u88ab\u629b\u5f03\u611f\u3002** |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u9ad8** | **\u201c\u4e00\u5b66\u5c31\u4f1a\uff0c\u4e00\u8bf4\u5c31\u5e9f\u201d\u662f\u5178\u578b\u4fe1\u53f7\u3002** \u4e00\u65e6\u5b9e\u64cd\u9047\u5230\u5177\u4f53\u6280\u672f\u96be\u9898\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u3001\u5f55\u97f3\u73af\u5883\u5dee\uff09\uff0c\u6781\u6613\u56e0\u81ea\u5c0a\u5fc3\u53d7\u632b\u800c\u653e\u5f03\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | \u5bf9\u201c\u517c\u804c\u8d5a\u94b1\u201d\u62b1\u6709\u671f\u671b\uff0c\u82e5\u5b66\u4e601-2\u5468\u540e\u611f\u89c9\u79bb\u63a5\u5355\u9065\u8fdc\uff0c\u6216\u63a5\u5355\u6536\u5165\u4e0d\u53ca\u9884\u671f\uff0c\u4f1a\u8fc5\u901f\u4ea7\u751f\u201c\u88ab\u9a97\u201d\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-3\u5468**\u3002\u6b64\u65f6\u5b66\u4e60\u96be\u5ea6\u63d0\u5347\uff0c\u65f6\u95f4\u51b2\u7a81\u52a0\u5267\uff0c\u82e5\u672a\u83b7\u5f97\u4efb\u4f55\u6b63\u5411\u53cd\u9988\uff08\u5982\u88ab\u8868\u626c\u3001\u63a5\u5230\u7b80\u5355\u4efb\u52a1\uff09\uff0c\u9000\u8d39\u610f\u613f\u5c06\u6025\u5267\u5347\u9ad8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u5979\u8bf4......\u201d**\n> \u201c\u4eb2\u7231\u7684\uff0c\u770b\u5230\u4f60\u8bf4\u5728\u9910\u5385\u5de5\u4f5c\u7279\u522b\u5fd9\uff0c\u8fd8\u8fd9\u4e48\u52aa\u529b\u60f3\u5b66\u65b0\u4e1c\u897f\uff0c\u771f\u7684\u7279\u522b\u4f69\u670d\u4f60\uff01\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u5c31\u662f\u4e3a\u4f60\u8fd9\u6837\u65f6\u95f4\u4e0d\u56fa\u5b9a\u7684\u540c\u5b66\u8bbe\u8ba1\u7684\uff0c**\u6240\u6709\u76f4\u64ad\u90fd\u6709\u56de\u653e\uff0c\u4f5c\u4e1a\u4e5f\u5f39\u6027\u4ea4**\u3002\u4f60\u522b\u6709\u538b\u529b\uff0c\u54b1\u4eec\u4e0d\u8ddf\u522b\u4eba\u6bd4\u8fdb\u5ea6\uff0c\u5c31\u6309\u4f60\u81ea\u5df1\u7684\u8282\u594f\u6765\u3002\u4f60\u672c\u6765\u5c31\u662f\u5c0f\u8bf4\u8ff7\uff0c\u8fd9\u5c31\u662f\u4f60\u6700\u5927\u7684\u4f18\u52bf\uff0c\u5148\u628a\u559c\u6b22\u7684\u6545\u4e8b\u8bfb\u51fa\u6765\uff0c\u4eab\u53d7\u8fd9\u4e2a\u8fc7\u7a0b\uff0c\u8d5a\u94b1\u662f\u6c34\u5230\u6e20\u6210\u7684\u4e8b\u3002\u6709\u4efb\u4f55\u5361\u4f4f\u7684\u5730\u65b9\uff0c\u54ea\u6015\u534a\u591c\u4e0b\u73ed\u4e86\uff0c\u968f\u65f6\u7ed9\u6211\u7559\u8a00\uff0c\u6211\u7b2c\u4e8c\u5929\u4e00\u65e9\u5c31\u5e2e\u4f60\u89e3\u51b3\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\uff08\u964d\u7ef4\u7248\uff09\u3011**\u3002\u5fc5\u987b\u660e\u786e\u63a5\u5355\u8def\u5f84\uff0c\u4f46\u9700\u5927\u5e45\u964d\u4f4e\u521d\u671f\u6280\u672f\u95e8\u69db\u548c\u9884\u671f\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n  1.  **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\uff08\u6ee1\u914dC\u6a21\u5757\uff09\u3011**\uff1a\u9488\u5bf9\u5176\u201c\u6015\u7b28\u201d\u7684\u5fc3\u7406\uff0c\u63d0\u4f9b\u9ad8\u9891\u3001\u5938\u5f20\u7684\u8d5e\u7f8e\u548c\u60c5\u7eea\u6258\u5e95\u3002\u4f5c\u4e1a\u70b9\u8bc4\u4ee5\u9f13\u52b1\u4e3a\u4e3b\uff0c\u5148\u5efa\u7acb\u4fe1\u5fc3\u3002\n  2.  **\u3010\u65f6\u95f4\u7ba1\u7406\u4fdd\u59c6\u5305\uff08\u7279\u79cdA\u6a21\u5757\uff09\u3011**\uff1a\u4e3a\u5979\u5b9a\u5236\u201c\u9910\u5385\u5de5\u4f5c\u65f6\u95f4\u8868\u201d\uff0c\u660e\u786e\u544a\u8bc9\u5979\u6bcf\u5929\u54ea\u4e2a\u788e\u7247\u65f6\u95f4\uff08\u5982\u5348\u4f11\u540e\u3001\u6253\u70ca\u540e\uff09\u53ef\u4ee5\u5b8c\u6210\u4ec0\u4e48\u5b66\u4e60\u52a8\u4f5c\uff08\u542c10\u5206\u949f\u56de\u653e\u3001\u7ec35\u5206\u949f\u53e3\u90e8\u64cd\uff09\u3002\n  3.  **\u3010\u7cbe\u786e\u6d3e\u5355\u62e6\u622a\uff08B\u6a21\u5757\u8f7b\u91cf\u7248\uff09\u3011**\uff1a\u5728\u5979\u57fa\u7840\u8fbe\u6807\u540e\uff0c\u4f18\u5148\u6d3e\u53d1**\u6781\u7b80\u5355\u3001\u8017\u65f6\u77ed\u3001\u53cd\u9988\u5feb**\u7684\u8bd5\u97f3\u6216\u753b\u672c\u4efb\u52a1\uff08\u5979\u611f\u5174\u8da3\u7684\u65b9\u5411\uff09\uff0c\u8ba9\u5979\u5feb\u901f\u83b7\u5f97\u201c\u6211\u80fd\u884c\u201d\u548c\u201c\u6709\u6536\u5165\u201d\u7684\u53cc\u91cd\u6b63\u53cd\u9988\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n  1.  \u7528\u201c\u522b\u4eba\u90fd\u884c\u4f60\u600e\u4e48\u4e0d\u884c\u201d\u65bd\u538b\u3002\n  2.  \u5728\u5979\u62b1\u6028\u65f6\u95f4\u4e0d\u591f\u65f6\uff0c\u53ea\u8bf4\u201c\u52a0\u6cb9\u6324\u65f6\u95f4\u201d\u8fd9\u79cd\u6b63\u786e\u7684\u5e9f\u8bdd\u3002\n  3.  \u5728\u5979\u8868\u8fbe\u201c\u6015\u5b66\u4e0d\u4f1a\u201d\u65f6\uff0c\u7528\u590d\u6742\u7684\u6280\u672f\u539f\u7406\u56de\u5e94\uff0c\u52a0\u5267\u5176\u7126\u8651\u3002\n  4.  \u8fc7\u65e9\u63a8\u9500\u9ad8\u9636\u8bfe\u7a0b\uff0c\u52a0\u91cd\u5176\u7ecf\u6d4e\u548c\u7cbe\u795e\u8d1f\u62c5\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u57fa\u7840\u73ed\u5b66\u4e60\u671f\u95f4\u8fdb\u884c\u4efb\u4f55\u5347\u5355\u63a8\u9500**\u3002\u5fc5\u987b\u5728\u5979\u6210\u529f\u5b8c\u62101-2\u6b21\u63a5\u5355\u3001\u5efa\u7acb\u5145\u5206\u81ea\u4fe1\u540e\uff0c\u518d\u8c28\u614e\u63a2\u8ba8\u8fdb\u9636\u53ef\u80fd\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u60f3\u517c\u804c\u6765\u7740\uff0c\u4f46\u662f\u80fd\u5168\u804c\u6700\u597d\u3002\u6211\u672c\u6765\u5c31\u662f\u4e2a\u5c0f\u8bf4\u8ff7\u3002\u89c9\u5f97\u633a\u6709\u610f\u601d\u7684\u201d \u2014 **\u52a8\u673a\u4e2d\uff08\u5174\u8da3+\u53d8\u73b0\uff09\uff0c\u975e\u7eaf\u641e\u94b1\u3002**\n2. > \u201c\u6211\u5728\u9910\u5385\u4e0a\u73ed\u201d\u3001\u201c\u4f60\u61c2\u7684\uff01\uff01\uff01\u201d \u2014 **\u8d44\u6e90\u5e95\u5ea7\u4f4e\uff08\u65f6\u95f4\u788e\u7247\u5316\u3001\u5de5\u4f5c\u6027\u8d28\u9650\u5236\uff09\u3002**\n3. > \u201c\u4e00\u5b66\u5c31\u4f1a\uff0c\u4e00\u8bf4\u5c31\u5e9f\u201d\u3001\u201c\u4e91\u91cc\u96fe\u91cc\u201d\u3001\u201c\u6700\u6015\u592a\u7b28\uff0c\u5b66\u4e0d\u4f1a\u201d \u2014 **\u5fc3\u7406\u5f39\u6027\u4f4e\uff0c\u5178\u578b\u754f\u96be\u548c\u81ea\u5351\u60c5\u7eea\uff0c\u6781\u6613\u7834\u9632\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u578b\uff08\u504fT4\u52a1\u5b9e\uff09\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e00\u4efd\u80fd\u517c\u987e\u9910\u5385\u5de5\u4f5c\u7684\u3001\u6709\u5b89\u5168\u611f\u7684\u517c\u804c\u6536\u5165\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7528\u201c\u65f6\u95f4\u7ba1\u7406\u4fdd\u59c6\u5305+\u6ee1\u914d\u60c5\u7eea\u7597\u6108\u201d\u53cc\u91cd\u6258\u5e95\uff0c\u5e76\u7528\u6700\u5feb\u901f\u5ea6\u7ed9\u5979\u4e00\u6b21\u6781\u7b80\u7684\u3001\u6210\u529f\u7684\u63a5\u5355\u4f53\u9a8c\uff0c\u5efa\u7acb\u6838\u5fc3\u4fe1\u5fc3\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5b89\u5168\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\uff08\u964d\u7ef4\u
