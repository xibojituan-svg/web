    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677145844 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u76ee\u5fc3(\u674e\u6d77\u71d5) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u5199\u4f5c\u65d7\u8230\u73ed (4380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u5145\u88d5 (\u672a\u63d0\u53ca\u5206\u671f\u6216\u501f\u6b3e) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u4fe1\u606f\u7f3a\u5931 (\u672a\u63d0\u53ca\u5177\u4f53\u5de5\u4f5c/\u751f\u6d3b\u72b6\u6001) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u7f3a\u5931 (\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u60c5\u51b5) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** (\u7528\u6237\u4e3b\u52a8\u8f93\u51fa\u4fe1\u606f\u6781\u5c11\uff0c\u591a\u4e3a\u88ab\u52a8\u56de\u5e94\uff0c\u5173\u952e\u7ef4\u5ea6\u5982\u65f6\u95f4\u3001\u7cbe\u529b\u3001\u5bb6\u5ead\u652f\u6301\u5ea6\u5747\u65e0\u4fe1\u606f) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34\u3002\u7528\u6237\u6700\u521d\u8868\u73b0\u51fa\u5bf9\u526f\u4e1a\u53d8\u73b0\u7684\u5174\u8da3\uff0c\u4f46\u6838\u5fc3\u987e\u8651\u5728\u4e8e\u201c\u88ab\u9a97\u201d\u548c\u201c\u521b\u4f5c\u88ab\u7a83\u53d6\u201d\uff0c\u5bf9\u53d8\u73b0\u7684\u6e34\u671b\u88ab\u5f3a\u70c8\u7684\u4e0d\u5b89\u5168\u611f\u6240\u8986\u76d6\u3002\u5176\u52a8\u673a\u662f\u201c\u60f3\u8d5a\u94b1\u201d\u4e0e\u201c\u6015\u88ab\u9a97\u201d\u7684\u6df7\u5408\u4f53\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u5728\u7f51\u4e0a\u5237\u5230\u4e86\u8bc8\u9a97\u201d > \u201c\u4e0d\u8981\u602a\u6211\uff0c\u6211\u4e4b\u524d\u4e5f\u88ab\u9a97\u8fc7[\u82e6\u6da9]\u5f88\u60e8\u201d > \u201c\u8001\u5e08\uff0c\u5982\u679c\u52a0\u5165\u4e86\u559c\u64ad\uff0c\u600e\u4e48\u4fdd\u8bc1\u81ea\u5df1\u7684\u7075\u611f\u3001\u521b\u4f5c\u4e0d\u88ab\u62ff\u8d70\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4e2d] \u2014 \u80fd\u76f4\u63a5\u8be2\u95ee4380\u5143\u8bfe\u7a0b\u6298\u6263\uff0c\u672a\u8868\u73b0\u51fa\u660e\u663e\u7684\u8d44\u91d1\u538b\u529b\u6216\u501f\u8d37\u503e\u5411\uff0c\u4f46\u53ef\u80fd\u5bf9\u4ef7\u683c\u654f\u611f\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5173\u4e8e\u5de5\u4f5c\u3001\u4f5c\u606f\u3001\u53ef\u6295\u5165\u5b66\u4e60\u65f6\u95f4\u7684\u63cf\u8ff0\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5173\u4e8e\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\u7684\u4fe1\u606f\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b07\u4f4e\u6781\u5371]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)\u3002\u7528\u6237\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u201c\u53d7\u5bb3\u8005\u5fc3\u6001\u201d\u548c\u5bf9\u5916\u754c\u7684\u9ad8\u5ea6\u4e0d\u4fe1\u4efb\u3002\u4e00\u6b21\u88ab\u9a97\u7ecf\u5386\u5bfc\u81f4\u5bf9\u4efb\u4f55\u4ed8\u8d39\u5b66\u4e60\u90fd\u62b1\u6709\u6781\u6df1\u7684\u9632\u5907\u3002\u81ea\u6211\u6548\u80fd\u611f\u4f4e\uff0c\u8ba4\u4e3a\u8bfe\u7a0b\u201c\u9002\u5408\u57fa\u7840\u597d\u7684\u4eba\u201d\uff0c\u9762\u5bf9\u4f5c\u4e1a\u53cd\u9988\u65f6\u81ea\u6211\u5426\u5b9a\uff08\u201c\u611f\u89c9\u81ea\u5df1\u7684\u9009\u9898\u4e0d\u662f\u7279\u522b\u597d\u201d\uff09\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u89c9\u5f97\u4f60\u4eec\u8fd9\u4e2a\u6a21\u5f0f\u9002\u5408\u90a3\u79cd\u672c\u6765\u57fa\u7840\u5c31\u5f88\u597d\u7684\uff0c\u518d\u7a0d\u5fae\u57f9\u517b\u6307\u5bfc\u4e00\u4e0b\u5c31\u53ef\u4ee5\u8fc7\u7a3f\u201d > \u201c\u6211\u542c\u4e86\u60a8\u7684\u70b9\u8bc4\uff0c\u5176\u5b9e\u6211\u4e5f\u5bf9\u8fd9\u4e2a\u4f5c\u7528\u4e0d\u600e\u4e48\u6ee1\u610f\uff0c\u611f\u89c9\u81ea\u5df1\u7684\u9009\u9898\u4e0d\u662f\u7279\u522b\u597d\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u5ea6\u7f3a\u4e4f\u5b89\u5168\u611f\u4e0e\u4fe1\u4efb\u611f**\u3002\u4ed6\u771f\u6b63\u7684\u75db\u70b9\u4e0d\u662f\u201c\u5982\u4f55\u8d5a\u94b1\u201d\uff0c\u800c\u662f\u201c\u5982\u4f55\u786e\u4fdd\u81ea\u5df1\u4e0d\u518d\u88ab\u9a97\u3001\u4e0d\u518d\u53d7\u4f24\u5bb3\u201d\u3002\u4ed6\u9700\u8981\u7684\u662f\u4e00\u4e2a\u7edd\u5bf9\u5b89\u5168\u3001\u65e0\u98ce\u9669\u7684\u201c\u9632\u62a4\u7f69\u201d\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u4fe1\u4efb\u80cc\u4e66\u4e0e\u98ce\u9669\u515c\u5e95\u627f\u8bfa**\u3002\u9700\u8981\u53cd\u590d\u3001\u5177\u4f53\u5730\u8bc1\u660e\u5e73\u53f0\u7684\u6b63\u89c4\u6027\u3001\u8bfe\u7a0b\u7684\u53ef\u9760\u6027\uff0c\u5e76\u63d0\u4f9b\u65e0\u540e\u987e\u4e4b\u5fe7\u7684\u9000\u8d39\u4fdd\u969c\uff0c\u4ee5\u6d88\u9664\u5176\u5185\u5fc3\u6df1\u5904\u7684\u6050\u60e7\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1** \u7c7b (\u9ad8\u610f\u5411\u4f46\u9ad8\u987e\u8651\uff0c\u9700\u5f3a\u529b\u4fe1\u4efb\u7834\u51b0) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u6838\u5fc3\u7279\u5f81\uff1a\u81ea\u5351\u3001\u4f9d\u8d56\u3001\u6613\u7834\u9632\u3001\u9700\u8981\u6301\u7eed\u7684\u60c5\u7eea\u5b89\u629a\u548c\u5b89\u5168\u611f\u4f9b\u7ed9) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u7b49D\u7c7b\u7ea2\u7ebf\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| **\u5bb6\u5ead\u5e72\u9884\u578b** | **[\u9ad8]** | **\u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u98ce\u9669\u6781\u9ad8**\u3002\u7531\u4e8e\u5176\u51b3\u7b56\u6781\u5ea6\u7f3a\u4e4f\u5b89\u5168\u611f\uff0c\u82e5\u62a5\u540d\u540e\u5bb6\u4eba\u53cd\u5bf9\u6216\u8d28\u7591\uff0c\u6781\u6613\u6210\u4e3a\u5176\u9000\u8d39\u7684\u201c\u6b63\u5f53\u7406\u7531\u201d\u3002 |\n| **\u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b** | **[\u4e2d]** | \u82e5\u5f00\u8425\u540e\u8ddf\u4e0d\u4e0a\u5b66\u4e60\u8282\u594f\uff0c\u6216\u7b2c\u4e00\u6b21\u4f5c\u4e1a\u53d7\u632b\uff0c\u5176\u201c\u6211\u4e0d\u884c\u201d\u7684\u81ea\u6211\u9884\u8a00\u4f1a\u8fc5\u901f\u5e94\u9a8c\uff0c\u5bfc\u81f4\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **[\u6781\u9ad8]** | **\u6838\u5fc3\u98ce\u9669**\u3002\u4efb\u4f55\u6280\u672f\u95ee\u9898\uff08\u8f6f\u4ef6\u5b89\u88c5\u5931\u8d25\uff09\u3001\u4f5c\u4e1a\u8d1f\u9762\u53cd\u9988\u3001\u6216\u770b\u5230\u5176\u4ed6\u540c\u5b66\u8fdb\u6b65\u66f4\u5feb\uff0c\u90fd\u53ef\u80fd\u89e6\u53d1\u5176\u201c\u88ab\u9a97\u4e86/\u6211\u4e0d\u9002\u5408\u201d\u7684\u5d29\u6e83\u60c5\u7eea\uff0c\u8981\u6c42\u9000\u8d39\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **[\u9ad8]** | \u5bf9\u201c\u5feb\u901f\u53d8\u73b0\u201d\u62b1\u6709\u5e7b\u60f3\uff0c\u4f46\u884c\u52a8\u529b\u5f31\u3002\u82e5\u5728\u5ba3\u4f20\u7684\u201c\u51e0\u5468\u5185\u6295\u7a3f\u201d\u9636\u6bb5\u672a\u80fd\u83b7\u5f97\u6b63\u53cd\u9988\uff0c\u4f1a\u7acb\u523b\u5f52\u56e0\u4e8e\u201c\u8bfe\u7a0b\u6ca1\u7528/\u53c8\u662f\u9a97\u5c40\u201d\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c\u4e00\u5468\u81f3\u7b2c\u4e00\u6b21\u63d0\u4ea4\u4f5c\u4e1a\u540e**\u3002\u8fd9\u662f\u5176\u4fe1\u5fc3\u6700\u8106\u5f31\u3001\u5bf9\u201c\u88ab\u9a97\u201d\u6050\u60e7\u6700\u654f\u611f\u7684\u65f6\u671f\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u540c\u5b66\u4f60\u597d\uff0c\u6211\u662f\u4f60\u7684\u73ed\u4e3b\u4efbXX\u3002\u770b\u5230\u4f60\u7684\u62a5\u540d\uff0c\u6211\u7279\u522b\u7406\u89e3\u4f60\u4e4b\u524d\u7684\u4e00\u4e9b\u987e\u8651\uff0c\u6bd5\u7adf\u73b0\u5728\u7f51\u4e0a\u4fe1\u606f\u592a\u6742\u4e86\u3002\u8bf7\u653e\u5fc3\uff0c\u5728\u6211\u4eec\u8fd9\u91cc\uff0c\u4f60\u7684\u6bcf\u4e00\u4e2a\u521b\u610f\u548c\u4f5c\u54c1\u7248\u6743\u90fd\u5c5e\u4e8e\u4f60\u81ea\u5df1\uff0c\u5e73\u53f0\u6709\u4e25\u683c\u7684\u89c4\u5219\u4fdd\u62a4\u3002\u6211\u4eec\u7684\u8bfe\u7a0b\u8bbe\u8ba1\u5c31\u662f\u4e3a0\u57fa\u7840\u540c\u5b66\u51c6\u5907\u7684\uff0c\u6bcf\u4e00\u6b65\u90fd\u6709\u624b\u628a\u624b\u7684\u63d0\u793a\u8bcd\u548c\u966a\u8dd1\u3002\u54b1\u4eec\u4e0d\u8ddf\u522b\u4eba\u6bd4\uff0c\u53ea\u8ddf\u6628\u5929\u7684\u81ea\u5df1\u6bd4\uff0c\u6709\u4efb\u4f55\u5361\u4f4f\u7684\u5730\u65b9\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u7684\u5de5\u4f5c\u5c31\u662f\u5e2e\u4f60\u628a\u8def\u94fa\u5e73\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\u3011**\u3002\u6838\u5fc3\u76ee\u6807\u662f\u5efa\u7acb\u4fe1\u4efb\u3001\u7ef4\u62a4\u4fe1\u5fc3\uff0c\u800c\u975e\u8ffd\u6c42\u786c\u6838\u4ea7\u51fa\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u5f3a\u5236\u6302\u8f7d **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u5305\u62ec\uff1a\u6bcf\u65e5\u9f13\u52b1\u6253\u5361\u3001\u4f5c\u4e1a\u7b80\u5316\u7248\uff08\u5982\u201c\u53ea\u9700\u5f55\u4e00\u53e5\u8bdd\u201d\uff09\u3001\u5938\u5f20\u7684\u6b63\u9762\u53cd\u9988\u3001\u907f\u514d\u5728\u7fa4\u5185\u516c\u5f00\u6bd4\u8f83\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9T6\u65bd\u52a0\u4efb\u4f55\u538b\u529b\u6216\u8d1f\u9762\u70b9\u8bc4**\u3002\u6240\u6709\u53cd\u9988\u5fc5\u987b\u5305\u88f9\u5728\u201c\u4f60\u5df2\u7ecf\u5f88\u68d2\u4e86\uff0c\u5982\u679c\u8fd9\u91cc\u7a0d\u5fae\u8c03\u6574\u4e00\u4e0b\u4f1a\u66f4\u5b8c\u7f8e\u201d\u7684\u7cd6\u8863\u91cc\u3002\n    2. **\u7edd\u4e0d\u5728\u7fa4\u5185@\u4ed6\u8fdb\u884c\u4f18\u79c0\u4f5c\u54c1\u5c55\u793a\u6216\u50ac\u4fc3\u4f5c\u4e1a**\u3002\n    3. **\u7edd\u4e0d\u5bf9\u4ed6\u753b\u201c\u5feb\u901f\u66b4\u5bcc\u201d\u7684\u5927\u997c**\uff0c\u5e94\u5f3a\u8c03\u201c\u5148\u5b8c\u6210\uff0c\u518d\u5b8c\u7f8e\uff0c\u5b89\u5168\u7b2c\u4e00\u201d\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5347\u5355**\u3002\u5728\u5b8c\u6210\u5f53\u524d\u8bfe\u7a0b\u5e76\u83b7\u5f97\u5176\u5b8c\u5168\u4fe1\u4efb\u524d\uff0c\u4efb\u4f55\u9644\u52a0\u6d88\u8d39\u5efa\u8bae\u90fd\u4f1a\u89e6\u53d1\u5176\u201c\u9a97\u5c40\u201d\u8b66\u62a5\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u5728\u7f51\u4e0a\u5237\u5230\u4e86\u8bc8\u9a97[\u7834\u6d95\u4e3a\u7b11][\u7834\u6d95\u4e3a\u7b11][\u7834\u6d95\u4e3a\u7b11]\u4e0d\u8981\u602a\u6211\uff0c\u6211\u4e4b\u524d\u4e5f\u88ab\u9a97\u8fc7[\u82e6\u6da9]\u5f88\u60e8\u201d\n2. > \u201c\u6211\u89c9\u5f97\u4f60\u4eec\u8fd9\u4e2a\u6a21\u5f0f\u9002\u5408\u90a3\u79cd\u672c\u6765\u57fa\u7840\u5c31\u5f88\u597d\u7684\uff0c\u518d\u7a0d\u5fae\u57f9\u517b\u6307\u5bfc\u4e00\u4e0b\u5c31\u53ef\u4ee5\u8fc7\u7a3f\u201d\n3. > \u201c\u8001\u5e08\uff0c\u5982\u679c\u52a0\u5165\u4e86\u559c\u64ad\uff0c\u600e\u4e48\u4fdd\u8bc1\u81ea\u5df1\u7684\u7075\u611f\u3001\u521b\u4f5c\u4e0d\u88ab\u62ff\u8d70\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6\u60c5\u7eea\u5de8\u5a74\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u5b89\u5168\u611f\u4e0e\u4fe1\u4efb**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u6781\u81f4\u7684\u60c5\u611f\u5b89\u629a\u4e0e\u96f6\u98ce\u9669\u627f\u8bfa\uff0c\u5265\u79bb\u4e00\u5207\u53ef\u80fd\u5f15\u53d1\u5176\u632b\u8d25\u611f\u7684\u4efb\u52a1\u548c\u6bd4\u8f83**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"maslow_need\": \"\u7b2c\u4e8c\u5c42\u5b89\u5168\u9700\u6c42\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
