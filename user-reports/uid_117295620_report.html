        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u534a\u590f\u4e50\u5b9d (UID: 117295620) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-02-28 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u7389\u7389\u4e09\u6dfc (\u66fe\u73b0\u4e3d) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b (\u5df2\u8d2d)\uff0c\u610f\u5411\u8fd0\u8425\u8bfe (\u8ba1\u5212\u4e2d) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u5145\u88d5 (\u5df2\u8d2d\u8bfe\u7a0b\uff0c\u5e76\u4e3b\u52a8\u62a5\u540d\u6f14\u64ad\u8bc1\u8003\u8bd5) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1 (\u767d\u5929\u4e0a\u73ed\uff0c\u665a\u4e0a\u53ca\u5468\u672b\u5b66\u4e60\u3001\u53c2\u4e0e\u5267\u7ec4\u7edf\u7b79) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u5355\u8eab\u72ec\u7acb / \u5df2\u62a5\u5907\u5e76\u652f\u6301 (\u65e0\u4efb\u4f55\u5bb6\u5ead\u963b\u529b\u4fe1\u53f7) |\n| **\u4fe1\u606f\u539a\u5ea6** | \u9971\u6ee1 (\u5927\u91cf\u5b66\u4e60\u3001\u4e92\u52a8\u3001\u95ee\u9898\u89e3\u51b3\u53ca\u793e\u7fa4\u7ba1\u7406\u8bb0\u5f55) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u5173\u6ce8\u6280\u80fd\u63d0\u5347\u4e0e\u884c\u4e1a\u878d\u5165\uff0c\u76ee\u6807\u660e\u786e\u4e14\u957f\u671f\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5f88\u559c\u6b22\u6709\u58f0\u8fd9\u4e2a\u884c\u4e1a\uff0c\u4ee5\u4e3a\u81ea\u5df1\u4e5f\u80fd\u53d1\u51fa\u559c\u9a6c\u62c9\u96c5\u91cc\u7684\u6545\u4e8b\u6f14\u64ad\u90a3\u6837\u7684\u58f0\u97f3\u3002\u4e5f\u540c\u6837\u80fd\u953b\u70bc\u81ea\u5df1\u7684\u8bed\u8a00\u80fd\u529b\u3002\u4f46\u5b66\u4e60\u8d8a\u4e45\uff0c\u624d\u53d1\u73b0\u4e0d\u662f\u90a3\u4e48\u7b80\u5355\u3002\u6211\u76ee\u524d\u76ee\u6807\u5c31\u662f\u8ba9\u81ea\u5df1\u7684\u6f14\u64ad\u80fd\u529b\u63d0\u5347\uff0c\u5c0f\u7a0b\u5e8f\u521d\u5ba1\u901a\u8fc7\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b06\u9ad8\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a\u9ad8 \u2014 \u5df2\u8d2d\u8bfe\u7a0b\uff0c\u4e3b\u52a8\u62a5\u540d\u989d\u5916\u8003\u8bd5\uff0c\u8ba1\u5212\u5347\u5355\u8fd0\u8425\u8bfe\uff0c\u65e0\u4efb\u4f55\u8d44\u91d1\u538b\u529b\u4fe1\u53f7\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a\u4e2d \u2014 \u767d\u5929\u4e0a\u73ed\uff0c\u5229\u7528\u665a\u4e0a\u548c\u5468\u672b\u65f6\u95f4\u5b66\u4e60\u3001\u5f55\u97f3\u3001\u53c2\u4e0e\u5267\u7ec4\u7edf\u7b79\uff0c\u65f6\u95f4\u867d\u788e\u7247\u5316\u4f46\u7ba1\u7406\u9ad8\u6548\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a\u9ad8 \u2014 \u804a\u5929\u4e2d\u65e0\u4efb\u4f55\u5bb6\u5ead\u51b2\u7a81\u6216\u9690\u7792\u8ff9\u8c61\uff0c\u51b3\u7b56\u72ec\u7acb\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u5982\u5f55\u97f3\u6545\u969c\u3001\u8f6f\u4ef6\u8bbe\u7f6e\uff09\u4e3b\u52a8\u6392\u67e5\u3001\u6c42\u52a9\u5e76\u590d\u76d8\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u79ef\u6781\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u6628\u5929\u5e94\u8be5\u622a\u56fe\u7684...\u6211\u6628\u5929\u8bbe\u7f6e\u90a3\u91cc\u5c31\u53d8\u6210MME\u4e86\uff0c\u6211\u624b\u52a8\u8c03\u56de\u53bb\u7684...\u6211\u53ea\u662f\u4e0d\u660e\u767d\u600e\u4e48\u7a81\u7136\u5c31\u5f55\u97f3\u7834\u97f3\u4e86\uff1f\u201d (\u4f53\u73b0\u63a2\u7a76\u7cbe\u795e\u800c\u975e\u62b1\u6028)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 (\u6210\u5c31\u3001\u8ba4\u53ef\u3001\u80fd\u529b\u8bc1\u660e)\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u4e13\u4e1a\u80fd\u529b\u63d0\u5347\u7684\u6e34\u671b\u4e0e\u5bf9\u884c\u4e1a\u8ba4\u53ef\u7684\u8ffd\u6c42\u3002\u4ed6\u4e0d\u4ec5\u60f3\u201c\u5b66\u4f1a\u201d\uff0c\u66f4\u60f3\u201c\u5b66\u597d\u201d\u5e76\u83b7\u5f97\u5b98\u65b9\u8ba4\u8bc1\uff08\u6f14\u64ad\u8bc1\uff09\u53ca\u793e\u7fa4\u5185\u7684\u89d2\u8272\u8ba4\u53ef\uff08\u7edf\u7b79\uff09\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u8d4b\u4e88\u8d23\u4efb\u4e0e\u5c55\u793a\u821e\u53f0**\u3002\u7ed9\u4e88\u5176\u7ec4\u7ec7\u8005\u89d2\u8272\uff08\u5982\u7edf\u7b79\uff09\uff0c\u516c\u5f00\u80af\u5b9a\u5176\u8d21\u732e\uff0c\u63d0\u4f9b\u80fd\u8bc1\u660e\u5176\u4e13\u4e1a\u80fd\u529b\u7684\u5b98\u65b9\u8ba4\u8bc1\u548c\u8fdb\u9636\u5b66\u4e60\u8def\u5f84\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \u2b50A \u7c7b (\u9ad8\u52a8\u673a\u3001\u9ad8\u8d44\u6e90\u3001\u9ad8\u5f39\u6027\uff0c\u6838\u5fc3\u4ef7\u503c\u7528\u6237) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T1 \u5708\u517b\u9886\u8896\u578b** (\u4e3b\u52a8\u627f\u62c5\u7edf\u7b79\u8d23\u4efb\uff0c\u7ec4\u7ec7\u534f\u8c03\uff0c\u4e50\u4e8e\u52a9\u4eba\uff0c\u5728\u793e\u7fa4\u4e2d\u6709\u5f71\u54cd\u529b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u5bb6\u5ead\u652f\u6301\u5ea6\u9ad8\uff0c\u51b3\u7b56\u72ec\u7acb\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5f3a\uff0c\u80fd\u5229\u7528\u788e\u7247\u65f6\u95f4\u9ad8\u6548\u8ddf\u8fdb\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u5230\u95ee\u9898\u4e3b\u52a8\u89e3\u51b3\uff0c\u4e0d\u60c5\u7eea\u5316\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4f4e | \u76ee\u6807\u660e\u786e\u4e3a\u80fd\u529b\u63d0\u5347\uff0c\u975e\u77ed\u671f\u66b4\u5229\uff0c\u4e14\u5df2\u8ba1\u5212\u5347\u5355\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u6781\u4f4e\u98ce\u9669**\u3002\u82e5\u5b58\u5728\u98ce\u9669\u70b9\uff0c\u53ef\u80fd\u5728\u957f\u671f\u5b66\u4e60\u540e\u906d\u9047**\u80fd\u529b\u63d0\u5347\u74f6\u9888\u671f**\uff0c\u82e5\u7f3a\u4e4f\u65b0\u7684\u6311\u6218\u548c\u8ba4\u53ef\uff0c\u53ef\u80fd\u4ea7\u751f\u5026\u6020\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4e50\u5b9d\uff0c\u6211\u770b\u4f60\u5728\u7fa4\u91cc\u7279\u522b\u70ed\u5fc3\uff0c\u7ec4\u7ec7\u80fd\u529b\u4e5f\u5f88\u5f3a\u3002\u8fd9\u671f\u5b9e\u6218\u5267\u7ec4\uff0c\u6211\u60f3\u9080\u8bf7\u4f60\u505a21-30\u96c6\u7684\u7edf\u7b79\uff0c\u5e26\u7740\u5927\u5bb6\u4e00\u8d77\u628a\u4f5c\u54c1\u6253\u78e8\u51fa\u6765\u3002\u8fd9\u4e0d\u4ec5\u662f\u5bf9\u4f60\u80fd\u529b\u7684\u953b\u70bc\uff0c\u4e5f\u662f\u4f60\u5728\u8fd9\u4e2a\u884c\u4e1a\u91cc\u5efa\u7acb\u4e2a\u4eba\u54c1\u724c\u7684\u7b2c\u4e00\u6b65\u3002\u4f60\u89c9\u5f97\u600e\u4e48\u6837\uff1f\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf**\u3011\u3002\u8d4b\u4e88\u5176\u73ed\u59d4\u3001\u7ec4\u957f\u3001\u9879\u76ee\u8d1f\u8d23\u4eba\u7b49\u89d2\u8272\uff0c\u63d0\u4f9b\u5185\u90e8\u664b\u5347\u901a\u9053\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u5305**\u3011(\u4e13\u5bb61v1\u7b54\u7591\u3001\u9ad8\u7ea7\u6280\u5de7\u5c0f\u7076\u8bfe)\u3001\u3010**\u8eab\u4efd\u5149\u73af\u5305**\u3011(\u4f18\u5148\u63a8\u8350\u7ed9\u4f18\u8d28\u5267\u7ec4\u3001\u5185\u90e8\u64ad\u5ba2\u5609\u5bbe\u673a\u4f1a)\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5c06\u5176\u89c6\u4e3a\u666e\u901a\u5b66\u5458\u8fdb\u884c\u201c\u586b\u9e2d\u5f0f\u201d\u7ba1\u7406\u3002\u907f\u514d\u53ea\u7ed9\u4efb\u52a1\u4e0d\u7ed9\u540d\u5206\uff0c\u6216\u5ffd\u89c6\u5176\u7ec4\u7ec7\u8d21\u732e\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5176\u5b66\u4e60\u8def\u5f84\u6e05\u6670\uff08\u5df2\u8ba1\u5212\u8fd0\u8425\u8bfe\uff09\uff0c\u662f\u5347\u5355\u9ad8\u9636\u8bfe\u7a0b\uff08\u5982\u8fd0\u8425\u8bfe\u3001\u9ad8\u7ea7\u6f14\u64ad\u5e08\u8bad\u7ec3\u8425\uff09\u7684\u4f18\u8d28\u76ee\u6807\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u76ee\u524d\u76ee\u6807\u5c31\u662f\u8ba9\u81ea\u5df1\u7684\u6f14\u64ad\u80fd\u529b\u63d0\u5347\uff0c\u5c0f\u7a0b\u5e8f\u521d\u5ba1\u901a\u8fc7\u201d\n2. > \u201c\u5206\u914d\u8868\u5df2\u66f4\u65b0\uff0c\u5927\u5bb6\u53ef\u4ee5\u70b9\u7fa4\u516c\u544a\uff0c\u770b\u81ea\u5df1\u5206\u914d\u7684\u4efb\u52a1\uff0c\u505a\u597d\u81ea\u5df1\u7684\u8fdb\u5ea6\u5b89\u6392[\u52a0\u6cb9]\u201d\n3. > \u201c\u6211\u4eec\u4f5c\u4e3a\u540c\u5b66\uff0c\u8f6e\u6d41\u5f3a\u63d0\u9192\uff0c\u5df2\u7ecf\u5c3d\u5230\u81ea\u5df1\u7684\u5fc3\u610f\u4e86\uff0c\u6c38\u8fdc\u53eb\u4e0d\u9192\u60f3\u7761\u7684\u4eba\uff0c\u8fd9\u6837\u53ef\u4ee5\u4e86\u3002\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T1 \u5708\u517b\u9886\u8896\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u5c0a\u91cd\u4e0e\u6210\u5c31\u8ba4\u53ef**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u4f4e**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u8d4b\u4e88\u5176\u7ec4\u7ec7\u8005\u89d2\u8272\u4e0e\u8d23\u4efb\uff0c\u5e76\u63d0\u4f9b\u5b98\u65b9\u80fd\u529b\u8ba4\u8bc1\u8def\u5f84**\u3002\n\n```json\n{\"core_type\": \"T1 \u5708\u517b\u9886\u8896\u578b\", \"risk_level\": \"\u6781\u4f4e\", \"refund_risk\": \"\u6781\u4f4e\", \"maslow_need\": \"\u5c0a\u91cd\", \"target_product_line\": \"\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\"}\n```";
