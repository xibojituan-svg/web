    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677157190 (\u6635\u79f0\uff1a\u9b54\u6cd5\u591a\u8089\u4ed9\u5973) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u828b\u59341(\u8096\u777f/\u9648\u9648\u5e08\u59d0) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u6f14\u64ad\u9ad8\u9636\u7cfb\u7edf\u8bfe (\u4ef7\u683c\u672a\u77e5) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u8d44\u91d1\u6765\u6e90\u6216\u5206\u671f\u60c5\u51b5\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u80fd\u6309\u65f6\u53c2\u52a0\u76f4\u64ad\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u5065\u8eab\uff0c\u4f46\u672a\u660e\u786e\u804c\u4e1a\u3001\u5bb6\u5ead\u72b6\u51b5\u6216\u6bcf\u65e5\u56fa\u5b9a\u7a7a\u95f2\u65f6\u6bb5\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u4eba\u662f\u5426\u77e5\u60c5\u6216\u652f\u6301\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\u3002\u5b66\u4e60\u4e92\u52a8\u4e0e\u5fc3\u6001\u4fe1\u606f\u9971\u6ee1\uff0c\u4f46\u5173\u952e\u8d44\u6e90\u5e95\u5ea7\uff08\u8d44\u91d1\u3001\u5bb6\u5ead\uff09\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931\uff0c**\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u53d8\u73b0\u4e0e\u80fd\u529b\u63d0\u5347\u76ee\u7684\u6df7\u6742\u3002\u5bf9\u201c\u5ba1\u542c\u3001\u540e\u671f\u201d\u7b49\u53d8\u73b0\u6e20\u9053\u611f\u5174\u8da3\uff0c\u4f46\u540c\u65f6\u4e5f\u8868\u73b0\u51fa\u5bf9\u4e13\u4e1a\u6280\u5de7\uff08\u5bf9\u8c61\u611f\u3001\u53d1\u58f0\u3001\u89d2\u8272\u97f3\uff09\u7684\u94bb\u7814\u70ed\u60c5\u548c\u957f\u671f\u5b66\u4e60\u610f\u613f\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u603b\u8981\u4e86\u89e3\u4e00\u4e9b\u624d\u6562\u5165\u884c\u561b\u201d > \u201c\u6682\u65f6\u5e0c\u671b\u8d5a\u4e2a\u96f6\u82b1\u94b1\u5427\uff0c\u7b49\u80fd\u529b\u4e0a\u53bb\u4e86\u518d\u8d5a\u66f4\u591a\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d] (\u4fe1\u606f\u4e0d\u8db3\uff0c\u57fa\u4e8e\u73b0\u6709\u4fe1\u606f\u63a8\u65ad)\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4fe1\u606f\u4e0d\u8db3] \u2014 \u672a\u63d0\u53ca\u7ecf\u6d4e\u72b6\u51b5\u6216\u652f\u4ed8\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u4e2d] \u2014 \u80fd\u575a\u6301\u65e9\u529f\u3001\u6309\u65f6\u53c2\u52a0\u6240\u6709\u76f4\u64ad\u3001\u5b8c\u6210\u989d\u5916\u4f5c\u4e1a\u3001\u5065\u8eab\uff0c\u663e\u793a\u6709\u89c4\u5f8b\u4e14\u53ef\u652f\u914d\u7684\u788e\u7247/\u6574\u5757\u65f6\u95f4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u4e0d\u8db3] \u2014 \u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u4fe1\u606f\uff0c\u662f**\u5173\u952e\u98ce\u9669\u7f3a\u53e3**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u4e3b\u52a8\u63d0\u95ee\u6280\u672f\u95ee\u9898\uff08\u58f0\u97f3\u53d1\u7d27\uff09\uff0c\u79ef\u6781\u5b9e\u8df5\u53cd\u9988\uff08\u7ad9\u8d77\u6765\u5f55\u3001\u7b11\u7740\u5f55\uff09\uff0c\u80fd\u63a5\u53d7\u4e13\u4e1a\u70b9\u8bc4\u5e76\u6539\u8fdb\uff0c\u867d\u6709\u201c\u793e\u6050\u201d\u3001\u201c\u5bb3\u7f9e\u201d\u4f46\u80fd\u514b\u670d\u5e76\u4e0a\u9ea6\u5b9e\u6218\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u56e0\u4e3a\u81ea\u5df1\u786e\u5b9e\u6709\u5f88\u591a\u4e0d\u8db3 \u53ef\u80fd\u5f88\u591a\u5185\u884c\u4eba\u4e00\u542c\u5c31\u77e5\u9053\u7684\u95ee\u9898 \u800c\u6211\u56e0\u4e3a\u5916\u884c\u6240\u4ee5\u4e0d\u4e86\u89e3 \u60f3\u8981\u53bb\u89e3\u51b3\u63d0\u5347\u81ea\u5df1\u201d > \u201c\u6709\u70b9\u793e\u6050 \u6211\u52aa\u529bhhh\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 (\u5c0a\u91cd\u5f52\u5c5e) ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u81ea\u8eab\u4e13\u4e1a\u80fd\u529b\u7684\u4e0d\u81ea\u4fe1\u4e0e\u5bf9\u884c\u4e1a\u8ba4\u53ef\u7684\u6e34\u6c42**\u3002\u5979\u53cd\u590d\u5f3a\u8c03\u81ea\u5df1\u662f\u201c\u5916\u884c\u201d\uff0c\u62c5\u5fc3\u88ab\u5185\u884c\u4eba\u542c\u51fa\u95ee\u9898\uff0c\u540c\u65f6\u975e\u5e38\u5728\u610f\u5e08\u59d0\uff08\u6743\u5a01\uff09\u7684\u80af\u5b9a\uff08\u201c\u4f60\u7684\u80af\u5b9a\u5bf9\u6211\u5f88\u91cd\u8981\u201d\uff09\u3002\u5979\u9700\u8981\u901a\u8fc7\u5b66\u4e60\u83b7\u5f97\u6280\u80fd\uff0c\u4ece\u800c\u8d62\u5f97\u5c0a\u91cd\u548c\u884c\u4e1a\u5185\u7684\u5f52\u5c5e\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u6743\u5a01\u8ba4\u53ef\u4e0e\u8fdb\u9636\u8def\u5f84\u7684\u5f52\u5c5e\u611f**\u3002\u5373\u201c\u4f60\u4e0d\u662f\u5c0f\u767d\uff0c\u4f60\u5f88\u6709\u6f5c\u529b\uff0c\u4f60\u5c5e\u4e8e\u8fd9\u4e2a\u5708\u5b50\u201d\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** (\u52a8\u673a\u4e2d\u7b49\uff0c\u8d44\u6e90\u63a8\u65ad\u4e2d\u7b49\uff0c\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u6709\u660e\u786e\u5b66\u4e60\u884c\u52a8) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u517c\u987eT3\u7279\u8d28)\u3002\u7279\u5f81\uff1a\u4e0d\u5f20\u626c\uff0c\u8e0f\u5b9e\u5b8c\u6210\u4f5c\u4e1a\uff0c\u4e3b\u52a8\u94bb\u7814\u6280\u5de7\uff08\u95ee\u53d1\u58f0\u95ee\u9898\uff09\uff0c\u5bf9\u53d8\u73b0\u611f\u5174\u8da3\u4f46\u66f4\u770b\u91cd\u80fd\u529b\u63d0\u5347\uff08\u201c\u67e5\u6f0f\u8865\u7f3a\u201d\uff09\uff0c\u6e34\u671b\u4e13\u4e1a\u8ba4\u53ef\u3002 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u8bc1\u636e\u8868\u660e\u5b58\u5728\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5ead\u5f3a\u70c8\u53cd\u5bf9\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** (\u4fe1\u606f\u7f3a\u5931\uff0c\u9700\u8b66\u60d5) | \u5173\u952e\u4fe1\u606f\u7f3a\u5931\u3002\u82e5\u62a5\u540d\u662f\u7792\u7740\u5bb6\u4eba\u6216\u52a8\u7528\u5927\u989d\u5bb6\u5ead\u50a8\u5907\u91d1\uff0c\u540e\u671f\u53ef\u80fd\u7206\u53d1\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u663e\u793a\u8f83\u5f3a\uff0c\u80fd\u89c4\u5f8b\u5b66\u4e60\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u5bfb\u6c42\u8fdb\u6b65\u800c\u975e\u5b89\u6170\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u5bf9\u201c\u5ba1\u542c\u3001\u540e\u671f\u201d\u7b49\u659c\u6760\u6536\u5165\u611f\u5174\u8da3\uff0c\u82e5\u5b66\u4e60\u4e2d\u671f\u53d1\u73b0\u63a5\u5355\u95e8\u69db\u6216\u6536\u76ca\u4e0e\u9884\u671f\u4e0d\u7b26\uff0c\u53ef\u80fd\u4ea7\u751f\u843d\u5dee\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c3-4\u5468\uff08\u6280\u80fd\u5e73\u53f0\u671f/\u9996\u6b21\u8bd5\u97f3\u5931\u8d25\u65f6\uff09**\u3002\u5f53\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u8fdb\u5165\u67af\u71e5\u7ec3\u4e60\u671f\u4e14\u9996\u6b21\u5c1d\u8bd5\u53d8\u73b0\u53d7\u632b\u65f6\uff0c\u82e5\u672a\u83b7\u5f97\u53ca\u65f6\u7684\u4e13\u4e1a\u6307\u5bfc\u4e0e\u5fc3\u7406\u758f\u5bfc\uff0c\u6613\u4ea7\u751f\u81ea\u6211\u6000\u7591\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4ed9\u5973\u540c\u5b66\uff0c\u6211\u770b\u8fc7\u4f60\u8bad\u7ec3\u8425\u7684\u4f5c\u4e1a\u548c\u5b9e\u6218\u8868\u73b0\uff0c\u5e95\u5b50\u597d\u53c8\u80af\u94bb\uff0c\u662f\u5757\u597d\u6599\u5b50\u3002\u54b1\u4eec\u7cfb\u7edf\u8bfe\u5c31\u662f\u5e2e\u4f60\u628a\u2018\u611f\u89c9\u2019\u53d8\u6210\u2018\u65b9\u6cd5\u2019\uff0c\u628a\u2018\u6f5c\u529b\u2019\u53d8\u6210\u2018\u5b9e\u529b\u2019\u3002\u8fc7\u7a0b\u4e2d\u9047\u5230\u74f6\u9888\u592a\u6b63\u5e38\u4e86\uff0c\u522b\u81ea\u5df1\u786c\u625b\uff0c\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u628a\u5b83\u653b\u514b\u4e86\u3002\u4f60\u7684\u76ee\u6807\uff0c\u4e0d\u53ea\u662f\u8d5a\u96f6\u82b1\u94b1\uff0c\u66f4\u662f\u6210\u4e3a\u88ab\u884c\u4e1a\u8ba4\u53ef\u7684\u4e13\u4e1a\u4eba\u58eb\uff0c\u5bf9\u5427\uff1f\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u3002\u5339\u914d\u5176T2\u5b9e\u5e72\u7279\u8d28\uff0c\u63d0\u4f9b\u6e05\u6670\u3001\u6709\u6311\u6218\u6027\u7684\u6280\u80fd\u8fdb\u9636\u8def\u5f84\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743**\u3011(\u9488\u5bf9T3\u7279\u8d28)\u3002\u5141\u8bb8\u5979\u6df1\u5165\u63d0\u95ee\u539f\u7406\u6027\u95ee\u9898\uff08\u5982\u53d1\u58f0\u673a\u5236\u3001\u540e\u671f\u6280\u672f\uff09\uff0c\u6ee1\u8db3\u5176\u201c\u67e5\u6f0f\u8865\u7f3a\u201d\u7684\u6df1\u5ea6\u9700\u6c42\u3002\u3010**\u5708\u5c42\u8f7b\u89e6\u5305**\u3011\u3002\u9002\u65f6\u5f15\u5165\u5267\u793e\u3001\u5e08\u59d0\u56e2\u961f\u8d44\u6e90\uff0c\u6ee1\u8db3\u5176\u5f52\u5c5e\u611f\u548c\u88ab\u8ba4\u53ef\u7684\u9700\u6c42\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. **\u53ea\u628a\u5979\u5f53\u201c\u641e\u94b1\u5de5\u5177\u4eba\u201d**\uff0c\u5ffd\u89c6\u5176\u4e13\u4e1a\u7cbe\u8fdb\u7684\u9700\u6c42\u30022. **\u7ed9\u4e88\u7a7a\u6d1e\u7684\u5938\u5956**\uff0c\u9700\u8981\u5177\u4f53\u5230\u6280\u672f\u70b9\u7684\u80af\u5b9a\uff08\u5982\u201c\u4f60\u8fd9\u6b21\u89d2\u8272\u97f3\u7684\u60c5\u7eea\u8f6c\u6298\u5904\u7406\u5f97\u5f88\u7ec6\u817b\u201d\uff09\u30023. **\u5728\u672a\u8bc4\u4f30\u5176\u771f\u5b9e\u5bb6\u5ead\u652f\u6301\u5ea6\u524d\uff0c\u76f2\u76ee\u63a8\u52a8\u5927\u989d\u5347\u5355**\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u8fdb\u884c\u5927\u989d\u63a8\u4ecb\uff0c\u4f46\u5fc5\u987b\u524d\u7f6e\u8fdb\u884c\u5bb6\u5ead\u652f\u6301\u5ea6\u6478\u5e95**\u3002\u5728\u786e\u8ba4\u5176\u8d44\u91d1\u5b89\u6392\u7a33\u59a5\u3001\u5bb6\u5ead\u77e5\u60c5\u540e\uff0c\u53ef\u57fa\u4e8e\u5176\u201c\u6210\u4e3a\u4e13\u4e1a\u4eba\u58eb\u201d\u7684\u957f\u671f\u76ee\u6807\uff0c\u63a8\u8350\u9ad8\u9636\u6216\u4e13\u9879\u8bfe\u7a0b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u603b\u8981\u4e86\u89e3\u4e00\u4e9b\u624d\u6562\u5165\u884c\u561b\u201d\n2. > \u201c\u56e0\u4e3a\u81ea\u5df1\u786e\u5b9e\u6709\u5f88\u591a\u4e0d\u8db3 \u53ef\u80fd\u5f88\u591a\u5185\u884c\u4eba\u4e00\u542c\u5c31\u77e5\u9053\u7684\u95ee\u9898 \u800c\u6211\u56e0\u4e3a\u5916\u884c\u6240\u4ee5\u4e0d\u4e86\u89e3 \u60f3\u8981\u53bb\u89e3\u51b3\u63d0\u5347\u81ea\u5df1\u201d\n3. > \u201c\u4f60\u7684\u80af\u5b9a\u5bf9\u6211\u5f88\u91cd\u8981\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2\u4f4e\u8c03\u5b9e\u5e72\u578b\uff08\u504fT3\u5b66\u9738\uff09\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4e0e\u884c\u4e1a\u5f52\u5c5e\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u624e\u5b9e\u7684\u6280\u672f\u6307\u5bfc+\u660e\u786e\u7684\u8fdb\u9636\u8def\u5f84+\u8c28\u614e\u63a2\u67e5\u5bb6\u5ead\u652f\u6301\u5ea6\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\"}\n```";
