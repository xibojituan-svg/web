        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677157158 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e - \u4e3b\u64ad\u516d\u6708\u6668\u516e\uff08\u5f55\u4e66+\u914d\u97f3\uff09(\u5218\u8d85\u4f1f) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | 4\u4e2a\u6708\u7cfb\u7edf\u8bfe\uff08\u9ad8\u9636\u73ed\uff09\uff0c\u4ef7\u683c2380\u5143 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u7528\u5361\u5468\u8f6c**\uff08\u82b1\u5457\u989d\u5ea6\u4e0d\u8db3\uff0c\u5c1d\u8bd5\u4fe1\u7528\u5361\u652f\u4ed8\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u9ad8\u5bbd\u88d5**\uff08\u804a\u5929\u8bb0\u5f55\u663e\u793a\u767d\u5929\u3001\u665a\u4e0a\u5747\u53ef\u53c2\u4e0e\u5b66\u4e60\u3001\u7ec3\u4e60\u3001\u76f4\u64ad\uff0c\u65f6\u95f4\u652f\u914d\u5ea6\u9ad8\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931**\uff08\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u6210\u5458\u6216\u5bb6\u5ead\u51b3\u7b56\u60c5\u51b5\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\uff08\u7f3a\u5931\u5173\u952e\u4fe1\u606f\uff1a\u5e74\u9f84\u3001\u804c\u4e1a\u3001\u6536\u5165\u3001\u5bb6\u5ead\u7ed3\u6784\u3001\u8d44\u91d1\u6765\u6e90\u3001\u8fc7\u5f80\u5b66\u4e60\u7ecf\u5386\u3001\u5177\u4f53\u65f6\u95f4\u5b89\u6392\u7ec6\u8282\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u6df7\u6742\u8bd5\u6c34(\u4e2d)\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6709\u58f0\u884c\u4e1a\u7684\u70ed\u7231\u548c\u5174\u8da3\uff08\u201c\u6211\u611f\u89c9\u627e\u5230\u4e86\u70ed\u7231\u7684\u4e8b\u4e1a\u201d\uff09\uff0c\u5e76\u79ef\u6781\u53c2\u4e0e\u8bd5\u97f3\u3001\u5173\u6ce8\u63a5\u5355\u8d44\u6e90\uff08\u201c\u6211\u5f88\u60f3\u8fdb\u7ec4\u201d\uff09\uff0c\u6709\u53d8\u73b0\u52a8\u673a\u3002\u4f46\u52a8\u673a\u4e2d\u201c\u70ed\u7231\u201d\u4e0e\u201c\u597d\u73a9\u201d\uff08\u201c\u5f88\u597d\u73a9\u201d\uff09\u7684\u6210\u5206\u4e0e\u201c\u641e\u94b1\u201d\u5e76\u5b58\uff0c\u7eaf\u5ea6\u4e2d\u7b49\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u611f\u89c9\u627e\u5230\u4e86\u70ed\u7231\u7684\u4e8b\u4e1a\uff0c\u4e00\u5b9a\u8ba4\u771f\u52aa\u529b\u3002[\u62f3\u5934][\u62f3\u5934]\u201d > \u201c\u6211\u5f88\u60f3\u8fdb\u7ec4\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u2b07\u4f4e]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4f4e** \u2014 \u652f\u4ed82380\u5143\u8bfe\u7a0b\u8d39\u65f6\uff0c\u82b1\u5457\u989d\u5ea6\u4e0d\u8db3\uff0c\u9700\u4f7f\u7528\u4fe1\u7528\u5361\u5468\u8f6c\uff0c\u8868\u660e\u5176\u6d41\u52a8\u8d44\u91d1\u7d27\u5f20\uff0c**\u652f\u4ed8\u80fd\u529b\u5904\u4e8e\u4e34\u754c\u70b9**\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u9ad8** \u2014 \u804a\u5929\u8bb0\u5f55\u663e\u793a\u5176\u80fd\u5168\u5929\u5019\u54cd\u5e94\uff0c\u5b8c\u6210\u6668\u7ec3\u3001\u4f5c\u4e1a\u3001\u76f4\u64ad\u8bfe\u3001pia\u620f\u7b49\u6d3b\u52a8\uff0c\u65f6\u95f4\u5145\u88d5\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931** \u2014 \u804a\u5929\u8bb0\u5f55\u5b8c\u5168\u672a\u63d0\u53ca\u5bb6\u5ead\uff0c\u65e0\u6cd5\u5224\u65ad\u652f\u6301\u5ea6\uff0c\u6309\u6700\u77ed\u677f\u539f\u5219\uff0c\u6b64\u9879\u8bc4\u7ea7\u4e3a\u201c\u4f4e\u201d\uff08\u56e0\u4fe1\u606f\u7f3a\u5931\u89c6\u4e3a\u98ce\u9669\u9879\uff09\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b07\u4f4e\u6781\u5371]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u7528\u6237\u591a\u6b21\u8868\u9732\u5bf9\u81ea\u8eab\u80fd\u529b\u7684\u4e0d\u81ea\u4fe1\uff08\u201c\u597d\u597d\u600e\u4e48\u8bf4\u597d\u751f\u786c\u201d\u3001\u201c\u8bfb\u9519\u7684\uff0c\u6211\u5c3d\u529b\u4e86\u201d\u3001\u201c\u6709\u70b9\u88ab\u5ffd\u60a0\u4f4f\u4e86\u201d\uff09\uff0c\u5728\u6280\u672f\u64cd\u4f5c\uff08\u5982\u63d0\u4ea4\u4f5c\u4e1a\u3001\u652f\u4ed8\uff09\u9047\u5230\u5c0f\u969c\u788d\u65f6\uff0c\u4f1a\u53cd\u590d\u3001\u6025\u5207\u5730\u5bfb\u6c42\u5916\u90e8\u5e2e\u52a9\uff08\u201c\u5e08\u59d0\uff0c\u6559\u6559\u6211\u201d\u3001\u201c\u600e\u4e48\u5206\u671f\u4ed8\u6b3e\uff1f\u201d\uff09\uff0c\u8868\u73b0\u51fa**\u4f4e\u81ea\u6211\u6548\u80fd\u611f\u548c\u9ad8\u4f9d\u8d56\u6027**\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u542c\u7740\u597d\u597d\u600e\u4e48\u8bf4\u597d\u751f\u786c\u3002\u201d > \u201c\u91cc\u9762\u6709\u8bfb\u9519\u7684\uff0c\u6211\u5c3d\u529b\u4e86\u3002[\u8c03\u76ae]\u201d > \u201c\u5e08\u59d0\uff0c\u600e\u4e48\u5206\u671f\u4ed8\u6b3e\uff1f\u201d > \u201c\u5e08\u59d0\uff0c\u6559\u6559\u6211\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u81ea\u6211\u80fd\u529b\u4ef7\u503c\u7684\u6df1\u5ea6\u6000\u7591\u4e0e\u6e34\u671b\u88ab\u8ba4\u53ef**\u3002\u4ed6\u53cd\u590d\u5f3a\u8c03\u81ea\u5df1\u201c\u5c3d\u529b\u4e86\u201d\u3001\u201c\u751f\u786c\u201d\u3001\u201c\u88ab\u5ffd\u60a0\u201d\uff0c\u672c\u8d28\u662f\u5bb3\u6015\u81ea\u5df1\u4e0d\u591f\u597d\uff0c\u65e0\u6cd5\u8fbe\u5230\u4ed6\u4eba\uff08\u5e08\u59d0\u3001\u884c\u4e1a\uff09\u7684\u6807\u51c6\uff0c\u6e34\u671b\u901a\u8fc7\u201c\u88ab\u9009\u4e2d\u201d\uff08\u8fdb\u7ec4\u3001\u88ab\u770b\u597d\uff09\u6765\u83b7\u5f97\u5c0a\u91cd\u548c\u7fa4\u4f53\u5f52\u5c5e\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6301\u7eed\u3001\u5177\u4f53\u3001\u65e0\u6761\u4ef6\u7684\u79ef\u6781\u5173\u6ce8\u4e0e\u80af\u5b9a**\u3002\u4ed6\u9700\u8981\u88ab\u201c\u770b\u89c1\u201d\u6bcf\u4e00\u6b21\u5fae\u5c0f\u7684\u8fdb\u6b65\uff0c\u9700\u8981\u88ab\u660e\u786e\u544a\u77e5\u201c\u4f60\u662f\u88ab\u9009\u4e2d\u7684\u5c11\u6570\u4eba\u201d\uff0c\u4ee5\u6b64\u5efa\u7acb\u81ea\u4fe1\u548c\u5f52\u5c5e\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2** \u7c7b \uff08\u52a8\u673a\u4e2d\u7b49\u4f46\u8d44\u6e90\u5e95\u5ea7\u8106\u5f31\uff0c\u5fc3\u7406\u5f39\u6027\u6781\u4f4e\uff0c\u5b58\u5728\u9ad8\u5d29\u76d8\u98ce\u9669\uff09 |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** \uff08\u6838\u5fc3\u7279\u5f81\uff1a\u9ad8\u60c5\u7eea\u4f9d\u8d56\u3001\u4f4e\u6297\u538b\u6027\u3001\u6e34\u671b\u88ab\u8ba4\u53ef\u4e0e\u966a\u4f34\uff09 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u867d\u4f7f\u7528\u4fe1\u7528\u5361\u652f\u4ed8\uff0c\u4f46\u672a\u53d1\u73b0\u660e\u786e\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5ead\u5927\u5435\u8bc1\u636e\u3002**\u4f46\u8d44\u91d1\u94fe\u8106\u5f31\u662f\u6f5c\u5728\u98ce\u9669\u70b9**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u82e5\u652f\u4ed8\u884c\u4e3a\u9690\u7792\u5bb6\u4eba\uff0c\u540e\u7eed\u88ab\u53d1\u73b0\u53ef\u80fd\u5f15\u53d1\u51b2\u7a81\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u65f6\u95f4\u5145\u88d5\uff0c\u5b66\u4e60\u6001\u5ea6\u79ef\u6781\uff0c\u4e3b\u52a8\u8ddf\u8fdb\u610f\u613f\u5f3a\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | **\u8fd9\u662f\u6838\u5fc3\u98ce\u9669**\u3002\u4e00\u65e6\u6b63\u5f0f\u8bfe\u7a0b\u96be\u5ea6\u63d0\u5347\u3001\u4f5c\u4e1a\u53d7\u632b\u3001\u8bd5\u97f3\u5c61\u6b21\u4e0d\u4e2d\uff0c\u6216\u611f\u89c9\u88ab\u73ed\u4e3b\u4efb/\u540c\u4f34\u5ffd\u89c6\uff0c\u6781\u6613\u56e0\u81ea\u5c0a\u5fc3\u53d7\u632b\u800c\u60c5\u7eea\u5d29\u6e83\uff0c\u4ea7\u751f\u201c\u6211\u4e0d\u884c\u201d\u3001\u201c\u88ab\u9a97\u4e86\u201d\u7684\u5ff5\u5934\uff0c\u8fdb\u800c\u8981\u6c42\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | \u5bf9\u201c\u8fdb\u7ec4\u201d\u3001\u201c\u63a5\u5355\u201d\u62b1\u6709\u6025\u5207\u671f\u671b\uff0c\u82e5\u5b66\u4e60\u4e00\u6bb5\u65f6\u95f4\u540e\u4ecd\u65e0\u53d8\u73b0\u673a\u4f1a\uff0c\u6613\u4ea7\u751f\u201c\u5b66\u800c\u65e0\u7528\u201d\u7684\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e2-4\u5468**\u3002\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u8bfe\u7a0b\u96be\u5ea6\u548c\u7ec3\u4e60\u5f3a\u5ea6\u589e\u52a0\uff0c\u7b2c\u4e00\u6b21\u6b63\u5f0f\u4f5c\u4e1a\u53cd\u9988\u6216\u9996\u6b21\u8bd5\u97f3\u5931\u8d25\u65f6\uff0c\u662f\u5176\u5fc3\u7406\u9632\u7ebf\u6700\u8106\u5f31\u7684\u65f6\u523b\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c[\u7528\u6237\u6635\u79f0]\uff0c\u6211\u662f\u4f60\u7684\u73ed\u4e3b\u4efb[\u540d\u5b57]\u3002\u516d\u6708\u5e08\u59d0\u7279\u610f\u8ddf\u6211\u4ea4\u4ee3\u4e86\uff0c\u8bf4\u4f60\u7279\u522b\u8ba4\u771f\uff0c\u58f0\u97f3\u6761\u4ef6\u4e5f\u597d\uff0c\u662f\u5979\u975e\u5e38\u770b\u597d\u7684\u2018\u6f5c\u529b\u80a1\u2019\u3002\u54b1\u4eec\u4e0d\u7740\u6025\u4e00\u4e0b\u5b50\u505a\u5230\u5b8c\u7f8e\uff0c\u5c31\u50cf\u4f60\u4e4b\u524d\u7ec3\u7ed5\u5507\u4e00\u6837\uff0c\u4e00\u5929\u6bd4\u4e00\u5929\u8f7b\u677e\u5c31\u662f\u8fdb\u6b65\u3002\u4ee5\u540e\u6709\u4efb\u4f55\u95ee\u9898\uff0c\u54ea\u6015\u4f60\u89c9\u5f97\u2018\u8fd9\u4e2a\u95ee\u9898\u662f\u4e0d\u662f\u592a\u50bb\u4e86\u2019\uff0c\u90fd\u968f\u65f6\u627e\u6211\uff0c\u54b1\u4eec\u4e00\u8d77\u89e3\u51b3\u3002\u4f60\u53ef\u4e0d\u662f\u4e00\u4e2a\u4eba\u5728\u5b66\uff0c\u54b1\u4eec\u662f\u4e00\u4e2a\u7ec4\u7684\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf**\u3011\u3002\u6838\u5fc3\u76ee\u6807\u662f\u5148\u7a33\u4f4f\u60c5\u7eea\uff0c\u5efa\u7acb\u5b66\u4e60\u5b89\u5168\u611f\u548c\u81ea\u4fe1\u5fc3\uff0c\u518d\u8c08\u6280\u80fd\u63d0\u5347\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\n    1.  **\u3010\u9ad8\u9891\u5fae\u80af\u5b9a\u5305\u3011**\uff1a\u73ed\u4e3b\u4efb\u9700\u5bf9\u5176\u4efb\u4f55\u5fae\u5c0f\u52aa\u529b\uff08\u5982\u6309\u65f6\u4e0a\u8bfe\u3001\u63d0\u4ea4\u4f5c\u4e1a\uff09\u8fdb\u884c\u5373\u65f6\u3001\u5177\u4f53\u7684\u8868\u626c\u3002\n    2.  **\u3010\u9632\u5d29\u76d8\u9884\u8b66\u5305\u3011**\uff1a\u5728\u96be\u5ea6\u8282\u70b9\uff08\u5982\u89d2\u8272\u97f3\u3001\u5ba1\u542c\u8003\u6838\uff09\u524d\uff0c\u63d0\u524d\u79c1\u4fe1\u6253\u9884\u9632\u9488\uff0c\u964d\u4f4e\u5176\u671f\u671b\uff0c\u5f3a\u8c03\u201c\u5b8c\u6210\u6bd4\u5b8c\u7f8e\u91cd\u8981\u201d\u3002\n    3.  **\u3010\u4f4e\u95e8\u69db\u6210\u5c31\u611f\u5305\u3011**\uff1a\u4f18\u5148\u63d0\u4f9b\u6781\u5176\u7b80\u5355\u3001\u6613\u8fc7\u7684\u8bd5\u97f3\u5355\u6216\u5c0f\u7ec4\u4efb\u52a1\uff0c\u8ba9\u5176\u5feb\u901f\u83b7\u5f97\u201c\u88ab\u9009\u4e2d\u201d\u3001\u201c\u5df2\u5b8c\u6210\u201d\u7684\u6b63\u53cd\u9988\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1.  \u7edd\u4e0d\u5bf9\u5176\u4f7f\u7528\u4efb\u4f55\u5426\u5b9a\u6216\u5bf9\u6bd4\u6027\u8bed\u8a00\uff08\u5982\u201c\u522b\u4eba\u90fd\u884c\u4f60\u600e\u4e48\u4e0d\u884c\u201d\uff09\u3002\n    2.  \u7edd\u4e0d\u5728\u5176\u62b1\u6028\u65f6\u8bb2\u5927\u9053\u7406\u6216\u8ba9\u5176\u201c\u81ea\u5df1\u6d88\u5316\u201d\u3002\n    3.  \u7edd\u4e0d\u4e00\u6b21\u6027\u5e03\u7f6e\u9ad8\u96be\u5ea6\u4f5c\u4e1a\u6216\u7ed9\u4e88\u590d\u6742\u64cd\u4f5c\u6307\u5f15\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5f53\u524d\u7528\u6237\u8d44\u91d1\u94fe\u5df2\u7d27\u7ef7\uff0c\u5fc3\u7406\u627f\u53d7\u529b\u5f31\uff0c\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u662f\u5728\u5176\u8106\u5f31\u795e\u7ecf\u4e0a\u65bd\u538b\uff0c\u6781\u6613\u5bfc\u81f4\u5d29\u76d8\u9000\u8d39\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u542c\u7740\u597d\u597d\u600e\u4e48\u8bf4\u597d\u751f\u786c\u3002\u201d\uff08\u66b4\u9732\u81ea\u6211\u6000\u7591\u4e0e\u6280\u672f\u7126\u8651\uff09\n2. > \u201c\u5e08\u59d0\uff0c\u600e\u4e48\u5206\u671f\u4ed8\u6b3e\uff1f\u201d\u3001\u201c\u82b1\u5457\u6211\u4ed8\u4e0d\u4e86\u5462\uff1f\u201d\u3001\u201c\u4e0d\u597d\u610f\u601d\uff0c\u4e0d\u591f\u603b\u91d1\u989d\u3002\u201d\uff08\u66b4\u9732\u8d44\u91d1\u94fe\u8106\u5f31\u4e0e\u652f\u4ed8\u7a98\u8feb\uff09\n3. > \u201c\u6709\u70b9\u88ab\u5ffd\u60a0\u4f4f\u4e86\u3002[\u5077\u7b11]\u201d\uff08\u4ee5\u73a9\u7b11\u53e3\u543b\u66b4\u9732\u5185\u5fc3\u6df1\u5904\u7684\u6000\u7591\u4e0e\u4e0d\u5b89\u5168\u611f\uff0c\u662f\u5178\u578bT6\u7684\u8bd5\u63a2\u6027\u8868\u8fbe\uff09\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6\u60c5\u7eea\u5de8\u5a74\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u5c0a\u91cd\u4e0e\u5f52\u5c5e\u611f**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u9ad8\u9891\u3001\u65e0\u6761\u4ef6\u7684\u60c5\u7eea\u4ef7\u503c\u4e0e\u4f4e\u95e8\u69db\u6210\u5c31\u611f\uff0c\u4e25\u7981\u65bd\u52a0\u4efb\u4f55\u538b\u529b\u4e0e\u5347\u5355\u884c\u4e3a**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5c0a\u91cd\u5f52\u5c5e\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
