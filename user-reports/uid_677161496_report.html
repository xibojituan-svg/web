    <script>
        const markdownText = "\u597d\u7684\uff0c\u6211\u5c06\u4ee5\u9876\u7ea7\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\u7684\u8eab\u4efd\uff0c\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677161496 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5f20\u4e00\u837b\uff08\u9500\u552e/\u5b98\u65b9\u62db\u52df\u5b98\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6500\u767b\u8ba1\u5212\u9ad8\u9636\u7248\uff08\u5df2\u652f\u4ed8\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad**\uff08\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad**\uff08\u672a\u63d0\u53ca\u5de5\u4f5c/\u751f\u6d3b\u72b6\u6001\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad**\uff08\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49**\uff08\u5b66\u4e60\u4e92\u52a8\u79ef\u6781\uff0c\u4f46\u4e2a\u4eba\u80cc\u666f\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06**\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u6210\u957f\u800c\u6765\uff0c\u5173\u6ce8\u6280\u80fd\u63d0\u5347\u8def\u5f84\uff0c\u6709\u957f\u671f\u5b66\u4e60\u89c4\u5212\uff0c\u800c\u975e\u77ed\u671f\u66b4\u5bcc\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u6211\u60f3\u7684\u662f\u6211\u73b0\u5728\u662f\u90fd\u4e0d\u597d\uff0c\u6162\u6162\u7684\u90fd\u5148\u5c1d\u8bd5\u4e00\u4e0b\u5b50\u201d\n> \u201c\u7b49\u6211\u96c6\u8d5e\u4e00\u4e9b\u7ecf\u9a8c\u4e30\u5bcc\uff0c\u63d0\u5347\u81ea\u5df1\u201d\n> \u201c\u56f0\u60d1\u7684\u8bdd\uff0c\u6211\u89c9\u5f97\u8fd8\u597d\uff0c\u8fd9\u4e2a\u4e1c\u897f\u5c31\u662f\u8bf4\u8fd8\u662f\u8981\u6562\u8bf4\u6562\u7ec3\u6562\u53bb\u505a\uff0c\u4e00\u5207\u90fd\u6709\u53ef\u80fd\u7684\u561b\uff0c\u662f\u5427\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1**\u4e2d**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u5df2\u652f\u4ed8\u9ad8\u9636\u8bfe\u7a0b\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u652f\u4ed8\u65b9\u5f0f\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u5bbd\u88d5\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u80fd\u6309\u65f6\u5b8c\u6210\u65e9\u529f\u3001\u4f5c\u4e1a\u3001\u89c2\u770b\u76f4\u64ad\uff0c\u663e\u793a\u51fa\u6709\u89c4\u5f8b\u7684\u5b66\u4e60\u65f6\u95f4\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u804c\u4e1a\u6216\u65f6\u95f4\u5b89\u6392\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u8bc4\u7ea7** \u2014 \u5b8c\u5168\u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07**\u4f4e\u6781\u5371**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56**\u3002\u81ea\u6211\u8bc4\u4ef7\u4f4e\uff0c\u660e\u786e\u8868\u8fbe\u9700\u8981\u4ed6\u4eba\u5e26\u9886\u548c\u4f9d\u8d56\uff0c\u5bf9\u72ec\u7acb\u5b8c\u6210\u4efb\u52a1\u4fe1\u5fc3\u4e0d\u8db3\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n> \u201c\u56e0\u4e3a\u6211\u5e73\u65f6\u5c31\u662f\u4e00\u4e2a\uff0c\u6bd4\u8f83\u5185\u5411\uff0c\u6216\u8005\u662f\u5185\u655b\uff0c\u4e0d\u592a\u7231\u8bf4\u8bdd\u7684\u90a3\u4e00\u79cd\u201d\n> \u201c\u6211\u89c9\u5f97\u6211\u7684\u8bdd\u5462\uff0c\u5c31\u662f\u53ef\u80fd\u9700\u8981\u65f6\u95f4\uff0c\u4f60\u5462\uff0c\u55ef\uff0c\u6709\u4e9b\u4e1c\u897f\u7a0d\u5fae\u5e26\u7740\u70b9\u6211\u53bb\u505a\u3002\u201d\n> \u201c\u55ef\uff0c\u6211\u89c9\u5f97\u6211\u7684\u8bdd\u5c31\u662f\u53ef\u80fd\u8bf4\uff0c\u55ef\uff0c\u6709\u4e9b\u65f6\u5019\u53ef\u80fd\u9700\u8981\u5e08\u59d0\u5440\uff0c\u4f60\u5e26\u7740\u70b9\u6211\u5440\uff0c\u53bb\uff0c\u505a\u8fd9\u4e9b\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42 / \u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5f3a\u70c8\u7684\u793e\u4ea4\u4f9d\u8d56\u4e0e\u4e0d\u81ea\u4fe1**\u3002\u4ed6\u5e76\u975e\u5355\u7eaf\u4e3a\u8d5a\u94b1\u800c\u6765\uff0c\u800c\u662f\u6e34\u671b\u5728\u4e00\u4e2a\u5b89\u5168\u3001\u88ab\u5e26\u9886\u7684\u73af\u5883\u4e2d\uff0c\u901a\u8fc7\u5b66\u4e60\u548c\u793e\u7fa4\u4e92\u52a8\uff0c\u514b\u670d\u5185\u5411\u6027\u683c\uff0c\u83b7\u5f97\u5f52\u5c5e\u611f\u548c\u6280\u80fd\u4e0a\u7684\u5b89\u5168\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u79c1\u4eba\u6559\u7ec3\u201d\u5f0f\u7684\u5168\u7a0b\u966a\u4f34\u4e0e\u80af\u5b9a**\u3002\u4ed6\u9700\u8981\u88ab\u660e\u786e\u544a\u77e5\u201c\u4e0b\u4e00\u6b65\u8be5\u600e\u4e48\u505a\u201d\uff0c\u5e76\u5728\u4ed6\u5b8c\u6210\u6bcf\u4e00\u6b65\u540e\u7ed9\u4e88\u5373\u65f6\u3001\u5177\u4f53\u7684\u9f13\u52b1\uff0c\u4ee5\u5efa\u7acb\u5176\u8106\u5f31\u7684\u81ea\u4fe1\u5fc3\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2 \u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74** (\u4e25\u91cd\u5185\u8017\u578b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u5a01\u80c1\u7b49\u6781\u7aef\u8a00\u8bba\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u65e0\u6cd5\u8bc4\u4f30\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u4e00\u65e6\u8fdb\u5165\u6b63\u8bfe\uff0c\u8bfe\u7a0b\u8282\u594f\u52a0\u5feb\u6216\u4efb\u52a1\u53d8\u590d\u6742\uff0c\u65e0\u4eba\u201c\u624b\u628a\u624b\u201d\u5e26\u9886\u65f6\uff0c\u6781\u6613\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u4ea7\u751f\u5de8\u5927\u632b\u8d25\u611f\uff0c\u8fdb\u800c\u81ea\u8d23\u3001\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u4f5c\u4e1a\u88ab\u4e25\u683c\u70b9\u8bc4\u3001\u8bd5\u97f3\u5931\u8d25\u3001\u6216\u9047\u5230\u6280\u672f\u95ee\u9898\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\uff09\u65f6\uff0c\u5176\u8106\u5f31\u7684\u81ea\u4fe1\u5fc3\u4f1a\u77ac\u95f4\u5d29\u584c\uff0c\u4ea7\u751f\u201c\u6211\u592a\u7b28\u4e86\uff0c\u5b66\u4e0d\u4f1a\u201d\u7684\u5ff5\u5934\uff0c\u662f\u9000\u8d39\u6700\u9ad8\u5371\u8bf1\u56e0\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u5982\u679c\u5b66\u4e60\u4e00\u6bb5\u65f6\u95f4\u540e\uff08\u59821-2\u4e2a\u6708\uff09\u4ecd\u672a\u83b7\u5f97\u4efb\u4f55\u6b63\u5411\u53cd\u9988\uff08\u5982\u88ab\u8868\u626c\u3001\u63a5\u5230\u5c0f\u5355\uff09\uff0c\u53ef\u80fd\u4f1a\u8d28\u7591\u5b66\u4e60\u6548\u679c\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u8bfe\u7a0b\u96be\u5ea6\u63d0\u5347\uff0c\u72ec\u7acb\u64cd\u4f5c\u8981\u6c42\u589e\u52a0\uff0c\u82e5\u73ed\u4e3b\u4efb\u672a\u80fd\u63d0\u4f9b\u8db3\u591f\u7684\u201c\u6309\u952e\u7ea7\u201d\u6307\u5bfc\u548c\u60c5\u7eea\u6258\u5e95\uff0c\u6781\u6613\u89e6\u53d1\u5d29\u6e83\u6027\u9000\u8d39\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u540c\u5b66\u4f60\u597d\uff01\u6211\u662f\u4f60\u7684\u73ed\u4e3b\u4efbXX\u3002\u770b\u5230\u4f60\u7684\u5b66\u4e60\u8bb0\u5f55\u975e\u5e38\u8ba4\u771f\uff0c\u4f5c\u4e1a\u4e5f\u5b8c\u6210\u5f97\u5f88\u53ca\u65f6\uff0c\u4e3a\u4f60\u70b9\u8d5e\uff01\u6211\u6ce8\u610f\u5230\u4f60\u5e0c\u671b\u6709\u4eba\u80fd\u5e26\u7740\u4f60\u4e00\u6b65\u6b65\u8d70\uff0c\u8fd9\u5b8c\u5168\u6ca1\u95ee\u9898\u3002**\u5728\u54b1\u4eec\u73ed\uff0c\u6211\u5c31\u662f\u4f60\u7684\u2018\u4e13\u5c5e\u5bfc\u822a\u2019**\u3002\u4ee5\u540e\u65e0\u8bba\u9047\u5230\u591a\u5c0f\u7684\u95ee\u9898\uff0c\u6bd4\u5982\u627e\u4e0d\u5230\u6587\u4ef6\u3001\u8f6f\u4ef6\u4e0d\u4f1a\u7528\uff0c\u6216\u8005\u5bf9\u4f5c\u4e1a\u6ca1\u4fe1\u5fc3\uff0c\u90fd\u968f\u65f6\u6233\u6211\u3002\u54b1\u4eec\u4e0d\u8ffd\u6c42\u4e00\u6b65\u767b\u5929\uff0c\u5c31\u8e0f\u8e0f\u5b9e\u5b9e\uff0c\u6211\u5e26\u4f60\u8d70\u7a33\u6bcf\u4e00\u6b65\uff0c\u4f60\u770b\u884c\u5417\uff1f\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** (\u4ea7\u54c1\u7ebfA)\u3002\u4ed6\u6709\u5b66\u4e60\u610f\u613f\uff0c\u9700\u624e\u5b9e\u6280\u80fd\u5efa\u7acb\u5b89\u5168\u611f\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u6ee1\u914d\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305 (C\u6a21\u5757)\u3011**\u3002\u9700\u8981\u9ad8\u9891\u3001\u7ec6\u81f4\u7684\u60c5\u7eea\u5b89\u629a\u548c\u201c\u7269\u7406\u7ea7\u201d\u64cd\u4f5c\u6307\u5bfc\u3002**\u8c28\u614e\u5f15\u5165\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743 (B\u6a21\u5757)**\uff0c\u521d\u671f\u5e94\u4ee5\u9f13\u52b1\u548c\u5efa\u7acb\u4fe1\u5fc3\u4e3a\u4e3b\uff0c\u907f\u514d\u8fc7\u96be\u7684\u6280\u672f\u95ee\u9898\u6253\u51fb\u5176\u79ef\u6781\u6027\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u522b\u4eba\u90fd\u80fd\u505a\u5230\uff0c\u4f60\u600e\u4e48\u4e0d\u884c\u201d\u4e4b\u7c7b\u7684\u8bdd\u8fdb\u884c\u6fc0\u5c06\uff1b\u5e03\u7f6e\u8d85\u51fa\u5176\u5f53\u524d\u80fd\u529b\u592a\u591a\u7684\u9ad8\u96be\u5ea6\u6311\u6218\u4f5c\u4e1a\uff1b\u5728\u4ed6\u6c42\u52a9\u65f6\u53ea\u53d1\u6559\u7a0b\u94fe\u63a5\u800c\u4e0d\u7ed9\u5177\u4f53\u64cd\u4f5c\u6307\u5f15\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u521d\u671f\uff08\u524d2\u4e2a\u6708\uff09\u8fdb\u884c\u4efb\u4f55\u5347\u5355\u63a8\u9500**\u3002\u5fc5\u987b\u5728\u5176\u6280\u80fd\u6709\u660e\u663e\u8fdb\u6b65\u3001\u81ea\u4fe1\u5fc3\u5efa\u7acb\u540e\uff0c\u518d\u4ee5\u201c\u5956\u52b1\u201d\u548c\u201c\u80fd\u529b\u5339\u914d\u201d\u4e3a\u7531\uff0c\u8c28\u614e\u63a8\u8350\u8fdb\u9636\u5185\u5bb9\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u56e0\u4e3a\u6211\u5e73\u65f6\u5c31\u662f\u4e00\u4e2a\uff0c\u6bd4\u8f83\u5185\u5411\uff0c\u6216\u8005\u662f\u5185\u655b\uff0c\u4e0d\u592a\u7231\u8bf4\u8bdd\u7684\u90a3\u4e00\u79cd**\u201d \u2014\u2014 **\u6838\u5fc3\u6027\u683c\u4e0e\u4f9d\u8d56\u6839\u6e90**\n2. > \u201c**\u6211\u89c9\u5f97\u6211\u7684\u8bdd\u5462\uff0c\u5c31\u662f\u53ef\u80fd\u9700\u8981\u65f6\u95f4\uff0c\u4f60\u5462\uff0c\u55ef\uff0c\u6709\u4e9b\u4e1c\u897f\u7a0d\u5fae\u5e26\u7740\u70b9\u6211\u53bb\u505a\u3002**\u201d \u2014\u2014 **\u660e\u786e\u7684\u201c\u88ab\u5e26\u9886\u201d\u9700\u6c42\uff0c\u81ea\u7406\u4fe1\u5fc3\u4e0d\u8db3**\n3. > \u201c**\u55ef\uff0c\u6211\u89c9\u5f97\u6211\u7684\u8bdd\u5c31\u662f\u53ef\u80fd\u8bf4\uff0c\u55ef\uff0c\u6709\u4e9b\u65f6\u5019\u53ef\u80fd\u9700\u8981\u5e08\u59d0\u5440\uff0c\u4f60\u5e26\u7740\u70b9\u6211\u5440\uff0c\u53bb\uff0c\u505a\u8fd9\u4e9b**\u201d \u2014\u2014 **\u91cd\u590d\u5f3a\u8c03\u4f9d\u8d56\uff0c\u662f\u5178\u578b\u7684T6\u201c\u60c5\u7eea\u5de8\u5a74\u201d\u6c42\u52a9\u6a21\u5f0f**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u5b89\u5168\u3001\u88ab\u5e26\u9886\u7684\u73af\u5883\u4e2d\u514b\u670d\u5185\u5411\uff0c\u83b7\u5f97\u793e\u4ea4\u5f52\u5c5e\u4e0e\u6280\u80fd\u5b89\u5168\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u201c\u8f6e\u6905\u7ea7\u201d\u5168\u7a0b\u966a\u4f34\u4e0e\u5373\u65f6\u80af\u5b9a\uff0c\u4e25\u9632\u5176\u5728\u6280\u672f\u632b\u6298\u9762\u524d\u5fc3\u7406\u5d29\u76d8\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u793e\u4ea4/\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u6ee1\u914d\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
