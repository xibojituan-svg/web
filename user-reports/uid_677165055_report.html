    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID 677165055 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6851\u6986\u975e\u665a\u97f37(\u82cf\u7476\u7476) / \u7c7d\u83f2(\u82cf\u7476\u7476) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u5165\u95e8\u8bfe\u7a0b (\u610f\u5411\u4ef73980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u672a\u77e5 (\u672a\u63d0\u53ca) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u9ad8\u5bbd\u88d5 (\u81ea\u7531\u804c\u4e1a\uff0c\u80fd\u9891\u7e41\u54cd\u5e94\u5e76\u5b8c\u6210\u4f5c\u4e1a) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u672a\u77e5 (\u672a\u63d0\u53ca) |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e2d\u7b49 (\u4e92\u52a8\u79ef\u6781\uff0c\u4f46\u672a\u6d89\u53ca\u6df1\u5c42\u80cc\u666f\u4fe1\u606f) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u5174\u8da3\u800c\u6765\uff0c\u5173\u6ce8\u5177\u4f53\u6280\u80fd\u64cd\u4f5c\u4e0e\u804c\u4e1a\u8def\u5f84\uff0c\u800c\u975e\u77ed\u671f\u66b4\u5bcc\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n    > \u201c\u95ee\u4e00\u4e0b\uff0c\u8fd9\u4e2a\u5f55\u97f3\u4f5c\u4e1a\u662f\u5565\u5440\uff1f\u5728\u5c0f\u7a0b\u5e8f\u91cc\u600e\u6837\u641e\uff1f\u201d\n    > \u201c\u60f3\u5148\u8bd5\u8bd5\u753b\u672c\uff0c\u4e00\u6b65\u4e00\u6b65\u6765\u201d\n    > \u201c\u8001\u5e08\uff0c\u6211\u60f3\u95ee\u4e00\u4e0b\uff0c\u5bf9\u4e8e\u7528\u624b\u673a\u5f04\u753b\u672c\uff0c\u600e\u6837\u5728word\u4e0a\u64cd\u4f5c\uff0c\u540e\u671f\u4f1a\u6559\u5417\uff1f\u56e0\u4e3a\u6211\u4e0d\u4f1a\u5f04\u5440\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u2b06\u9ad8\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a\u672a\u77e5 \u2014 \u672a\u63d0\u53ca\u7ecf\u6d4e\u72b6\u51b5\uff0c\u4f46\u81ea\u7531\u804c\u4e1a\u4e14\u5b66\u4e60\u610f\u613f\u5f3a\uff0c\u63a8\u6d4b\u4e2d\u7b49\u4ee5\u4e0a\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a\u2b06\u9ad8 \u2014 \u81ea\u7531\u804c\u4e1a\u8eab\u4efd\uff0c\u80fd\u9891\u7e41\u3001\u53ca\u65f6\u5730\u54cd\u5e94\u9500\u552e\u4fe1\u606f\u3001\u5b8c\u6210\u4f5c\u4e1a\u3001\u89c2\u770b\u76f4\u64ad\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a\u672a\u77e5 \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9047\u5230\u64cd\u4f5c\u95ee\u9898\uff08\u627e\u4e0d\u5230\u4f5c\u4e1a\u5165\u53e3\uff09\u65f6\uff0c\u60c5\u7eea\u7a33\u5b9a\uff0c\u4e3b\u52a8\u3001\u6e05\u6670\u5730\u63d0\u95ee\uff0c\u5e76\u63a5\u53d7\u6307\u5bfc\u540e\u7ee7\u7eed\u6267\u884c\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n    > \u201c\u6211\u5c31\u662f\u5728\u5c0f\u7a0b\u5e8f\u91cc\u6ca1\u627e\u5230\u5440\u201d\n    > \u201c\u6253\u5f00\u5c31\u662f\u8fd9\u6837\u201d (\u9644\u622a\u56fe)\n    > \u201c\u597d\u7684\uff0c\u8c22\u8c22\u201d (\u5f53\u88ab\u544a\u77e5\u53ef\u770b\u56de\u653e\u65f6)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u8fdb\u5165\u65b0\u9886\u57df\uff08\u6709\u58f0\u6f14\u64ad\uff09\u7684**\u6280\u80fd\u638c\u63e1\u4e0e\u804c\u4e1a\u8def\u5f84\u6e05\u6670\u5ea6**\u5b58\u5728\u4e0d\u786e\u5b9a\u6027\uff0c\u6e34\u671b\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\u548c\u660e\u786e\u7684\u6210\u957f\u9636\u68af\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u8def\u5f84\u7684\u6e05\u6670\u6307\u5f15\u4e0e\u80fd\u529b\u6210\u957f\u7684\u5373\u65f6\u6b63\u53cd\u9988**\u3002\u4ed6\u9700\u8981\u88ab\u80af\u5b9a\u201c\u4f60\u7684\u58f0\u97f3\u6761\u4ef6\u5f88\u597d\uff08\u5fa1\u59d0\u97f3\uff09\u201d\uff0c\u5e76\u770b\u5230\u201c\u4ece\u65c1\u767d\u5230\u753b\u672c\u518d\u5230\u8fdb\u5267\u7ec4\u201d\u7684\u53ef\u5b9e\u73b0\u8def\u5f84\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 B \u7c7b |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u8001\u9ec4\u725b** (\u5411 **T3 \u6b7b\u78d5\u6781\u5ba2\u6d3e** \u8fdb\u5316\u4e2d) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u60c5\u7eea\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u81ea\u7531\u804c\u4e1a\u8005\u81ea\u4e3b\u6743\u901a\u5e38\u8f83\u9ad8\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u65f6\u95f4\u5145\u88d5\uff0c\u5b66\u4e60\u610f\u613f\u5f3a\uff0c\u8ddf\u8fdb\u969c\u788d\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u9047\u5230\u95ee\u9898\u4e3b\u52a8\u6c42\u89e3\uff0c\u65e0\u60c5\u7eea\u5d29\u6e83\u8ff9\u8c61\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u82e5\u5728\u540e\u7eed\u6b63\u4ef7\u8bfe\u4e2d\uff0c\u63a5\u5355\u53d8\u73b0\u8def\u5f84\u4e0d\u6e05\u6670\u6216\u901f\u5ea6\u8fdc\u4f4e\u4e8e\u5176\u9884\u671f\uff08\u867d\u672a\u6025\u8feb\u8ffd\u95ee\uff0c\u4f46\u6709\u660e\u786e\u53d8\u73b0\u610f\u5411\uff09\uff0c\u53ef\u80fd\u56e0\u201c\u6295\u5165\u4ea7\u51fa\u6bd4\u5931\u8861\u201d\u800c\u4ea7\u751f\u5931\u671b\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe\u540e **1-2\u4e2a\u6708**\uff0c\u5f53\u6280\u80fd\u7ec3\u4e60\u8fdb\u5165\u5e73\u53f0\u671f\uff0c\u800c\u63a5\u5355\u673a\u4f1a\u672a\u5982\u671f\u51fa\u73b0\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u540c\u5b66\uff0c\u770b\u5230\u4f60\u81ea\u7531\u804c\u4e1a\u7684\u80cc\u666f\u548c\u8fd9\u4e48\u5f3a\u7684\u6267\u884c\u529b\uff0c\u771f\u7684\u5f88\u68d2\u3002\u54b1\u4eec\u8fd9\u4e2a\u884c\u4e1a\uff0c\u50cf\u4f60\u8fd9\u6837\u80fd\u9759\u4e0b\u5fc3\u6765\u2018\u4e00\u6b65\u4e00\u6b65\u6765\u2019\u7684\u4eba\uff0c\u540e\u671f\u7206\u53d1\u529b\u662f\u6700\u5f3a\u7684\u3002\u6211\u4f1a\u6839\u636e\u4f60\u7684\u5fa1\u59d0\u97f3\u7279\u8d28\uff0c\u5e2e\u4f60\u91cd\u70b9\u89c4\u5212\u4ece\u753b\u672c\u5230\u89d2\u8272\u97f3\u7684\u8fdb\u9636\u8def\u5f84\uff0c\u54b1\u4eec\u7a33\u624e\u7a33\u6253\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011+ \u3010\u7cbe\u786e\u6d3e\u5355\u8d44\u6e90\u5305\u3011\u3002\u9488\u5bf9\u5176\u201c\u753b\u672c\u64cd\u4f5c\u201d\u7b49\u5177\u4f53\u6280\u672f\u95ee\u9898\uff0c\u63d0\u4f9b\u6e05\u6670\u6307\u5f15\u548c\u5b9e\u6218\u673a\u4f1a\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u51e0\u5929\u66b4\u5bcc\u201d\u7684\u8bdd\u672f\u53bb\u523a\u6fc0\u4ed6\uff0c\u8fd9\u4f1a\u7834\u574f\u5176\u201c\u7a33\u624e\u7a33\u6253\u201d\u7684\u8282\u594f\u611f\uff0c\u5f15\u53d1\u53cd\u611f\u3002\u907f\u514d\u8fc7\u5ea6\u60c5\u611f\u5b89\u629a\uff0c\u4ed6\u9700\u8981\u7684\u662f\u89e3\u51b3\u65b9\u6848\uff0c\u4e0d\u662f\u9e21\u6c64\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u63a8\u4ecb\u9ad8\u9636\u8bfe\u7a0b\uff08\u5982\u540e\u671f\u5236\u4f5c\u3001\u89d2\u8272\u97f3\u7cbe\u8fdb\uff09\uff0c\u4f46**\u5fc5\u987b\u5efa\u7acb\u5728\u5df2\u89e3\u51b3\u5176\u5f53\u524d\u5177\u4f53\u6280\u672f\u5361\u70b9\uff08\u5982\u753b\u672cWord\u64cd\u4f5c\uff09\u5e76\u53d6\u5f97\u5c0f\u6210\u679c\u4e4b\u540e**\uff0c\u7528\u201c\u4e3a\u4e86\u89e3\u51b3\u4f60\u521a\u624d\u95ee\u7684XX\u95ee\u9898\uff0c\u6211\u4eec\u4e0b\u4e00\u9636\u6bb5\u4f1a\u5b66\u2026\u201d\u7684\u65b9\u5f0f\u81ea\u7136\u8854\u63a5\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u60f3\u5148\u8bd5\u8bd5\u753b\u672c\uff0c\u4e00\u6b65\u4e00\u6b65\u6765\u201d **\u2014\u2014 \u5178\u578bT2\u7279\u5f81\uff1a\u52a1\u5b9e\u3001\u4f4e\u8c03\u3001\u6ce8\u91cd\u57fa\u7840\u79ef\u7d2f\u3002**\n2. > \u201c\u8001\u5e08\uff0c\u6211\u60f3\u95ee\u4e00\u4e0b\uff0c\u5bf9\u4e8e\u7528\u624b\u673a\u5f04\u753b\u672c\uff0c\u600e\u6837\u5728word\u4e0a\u64cd\u4f5c\uff0c\u540e\u671f\u4f1a\u6559\u5417\uff1f\u56e0\u4e3a\u6211\u4e0d\u4f1a\u5f04\u5440\u201d **\u2014\u2014 \u5178\u578bT3\u840c\u82bd\u7279\u5f81\uff1a\u5173\u6ce8\u5177\u4f53\u64cd\u4f5c\u7ec6\u8282\u548c\u5e95\u5c42\u65b9\u6cd5\uff0c\u6709\u6781\u5ba2\u94bb\u7814\u503e\u5411\u3002**\n3. > \u201c\u6211\u5c31\u662f\u5728\u5c0f\u7a0b\u5e8f\u91cc\u6ca1\u627e\u5230\u5440\u201d & \u201c\u6253\u5f00\u5c31\u662f\u8fd9\u6837\u201d **\u2014\u2014 \u9ad8\u5fc3\u7406\u5f39\u6027\u8bc1\u636e\uff1a\u9047\u5230\u95ee\u9898\u4e0d\u62b1\u6028\uff0c\u76f4\u63a5\u63d0\u4f9b\u622a\u56fe\u7b49\u8bc1\u636e\uff0c\u5bfb\u6c42\u5177\u4f53\u89e3\u51b3\u65b9\u6848\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2 \u4f4e\u8c03\u8001\u9ec4\u725b\uff08\u5411T3\u8fdb\u5316\uff09\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u6e05\u6670\u7684\u6280\u80fd\u6210\u957f\u8def\u5f84\u4e0e\u4e13\u4e1a\u8ba4\u53ef\uff08\u5c0a\u91cd/\u81ea\u6211\u5b9e\u73b0\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u624e\u5b9e\u7684B\u6a21\u5757\uff08\u6280\u672f\u89e3\u7b54+\u7cbe\u786e\u6d3e\u5355\uff09\uff0c\u6ee1\u8db3\u5176\u201c\u4e00\u6b65\u4e00\u6b65\u6765\u201d\u7684\u52a1\u5b9e\u9700\u6c42\uff0c\u907f\u514d\u753b\u4e0d\u5207\u5b9e\u9645\u7684\u5927\u997c\u3011\u3002**\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u8001\u9ec4\u725b\u578b (\u5411T3\u8fdb\u5316)\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd\u9700\u6c42/\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}\n```";
