    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u6d45\u6d45 (UID: 147778279) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9e22\u9e22(\u80e1\u5f71) / \u53ef\u4e3d\u513f(\u5b54\u4ee4\u5a77) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u914d\u97f3\u6b63\u5f0f\u8bfe\u7a0b\uff08\u4ef7\u683c\u672a\u77e5\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\uff08\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u91d1\u989d\u3001\u5206\u671f\u7b49\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\uff08\u5728\u804c\uff0c\u4ec5\u665a\u4e0a\u6709\u65f6\u95f4\uff0c\u767d\u5929\u5de5\u4f5c\u7e41\u5fd9\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e25\u91cd\u7f3a\u5931**\uff08\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u60c5\u51b5\uff09 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\uff08\u5173\u952e\u4fe1\u606f\u5982\u652f\u4ed8\u80fd\u529b\u3001\u5bb6\u5ead\u652f\u6301\u3001\u5b66\u4e60\u9884\u671f\u3001\u8fc7\u5f80\u7ecf\u5386\u7b49\u5747\u672a\u6d89\u53ca\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34**\u3002\u7528\u6237\u8868\u73b0\u51fa\u5bf9\u6709\u58f0\u884c\u4e1a\u7684\u5174\u8da3\u548c\u63a2\u7d22\u6b32\uff0c\u4f46\u672a\u660e\u786e\u8868\u8fbe\u5f3a\u70c8\u7684\u53d8\u73b0\u8bc9\u6c42\u6216\u957f\u671f\u4e13\u4e1a\u7cbe\u8fdb\u76ee\u6807\u3002\u52a8\u673a\u4ecb\u4e8e\u5174\u8da3\u63a2\u7d22\u4e0e\u517c\u804c\u53d8\u73b0\u4e4b\u95f4\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u901a\u8fc7\u8fd9\u4e24\u5929\u7684\u5b66\u4e60\uff0c\u6211\u53d1\u73b0\u914d\u97f3\u4e0d\u662f\u6211\u4ee5\u4e3a\u7684\u53ea\u662f\u58f0\u97f3\uff0c\u8fd8\u662f\u6709\u5f88\u591a\u5176\u4ed6\u7684\u79cd\u7c7b\uff0c\u8981\u5b66\u4e60\u7684\u8fd8\u5f88\u591a\u201d > \u201c\u8fd8\u633a\u611f\u5174\u8da3\u7684\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 \u672a\u63d0\u53ca\u4efb\u4f55\u4e0e\u8d44\u91d1\u76f8\u5173\u7684\u4fe1\u606f\uff0c\u65e0\u6cd5\u8bc4\u4f30\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[\u2b07\u4f4e] \u2014 \u660e\u786e\u8868\u793a\u201c\u73b0\u5728\u8fd8\u5728\u4e0a\u73ed\uff0c\u53ef\u80fd\u53ea\u6709\u665a\u4e0a\u6709\u65f6\u95f4\u201d\uff0c\u4e14\u767d\u5929\u5de5\u4f5c\u7e41\u5fd9\uff08\u201c\u4e0a\u73ed\uff0c\u76ee\u524d\u6ca1\u6709\u65f6\u95f4\u201d\uff09\uff0c\u65f6\u95f4\u7cbe\u529b\u9ad8\u5ea6\u53d7\u9650\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[\u4fe1\u606f\u7f3a\u5931] \u2014 \u5b8c\u5168\u672a\u63d0\u53ca\uff0c\u5b58\u5728\u6f5c\u5728\u98ce\u9669\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u27a1\u4e2d]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a**\u3002\u7528\u6237\u6c9f\u901a\u987a\u7545\u3001\u914d\u5408\u5ea6\u9ad8\uff0c\u80fd\u4e3b\u52a8\u63d0\u95ee\uff08\u201c\u8bd5\u97f3\u662f\u76f4\u63a5\u53d1\u7ed9\u4f60\u662f\u4e48\uff1f\u201d\uff09\uff0c\u5e76\u5bf9\u5b66\u4e60\u5185\u5bb9\u8868\u793a\u671f\u5f85\uff08\u201c\u6709\u70b9\u671f\u5f85\uff01\u201d\uff09\u3002\u4f46\u9762\u5bf9\u9500\u552e\u50ac\u4fc3\u4f5c\u4e1a\u65f6\uff0c\u8868\u73b0\u51fa\u88ab\u52a8\u548c\u5ef6\u8fdf\uff08\u201c\u4eb2\uff0c\u4e0a\u73ed\uff0c\u76ee\u524d\u6ca1\u6709\u65f6\u95f4\u201d\uff09\uff0c**\u5b58\u5728\u56e0\u65f6\u95f4\u538b\u529b\u5bfc\u81f4\u5b66\u4e60\u8fdb\u5ea6\u62d6\u5ef6\u7684\u98ce\u9669**\uff0c\u9700\u8981\u5916\u90e8\u63d0\u9192\u548c\u63a8\u52a8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u4eb2\uff0c\u4e0a\u73ed\uff0c\u76ee\u524d\u6ca1\u6709\u65f6\u95f4\u201d > \u201c\u6709\u70b9\u671f\u5f85\uff01\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34 / \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u804c\u573a\u4e2d\u5e74\u4eba\u7684\u5174\u8da3\u63a2\u7d22\u4e0e\u4ef7\u503c\u611f\u5bfb\u6c42**\u300240\u5c81\u5728\u804c\uff0c\u751f\u6d3b\u53ef\u80fd\u8d8b\u4e8e\u5e73\u6de1\uff0c\u6e34\u671b\u901a\u8fc7\u63a2\u7d22\u65b0\u9886\u57df\uff08\u914d\u97f3\uff09\u83b7\u5f97\u65b0\u7684\u793e\u4ea4\u5708\u3001\u8eab\u4efd\u8ba4\u540c\u548c\u6210\u5c31\u611f\uff0c\u800c\u975e\u7eaf\u7cb9\u7684\u751f\u5b58\u538b\u529b\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u793e\u7fa4\u5f52\u5c5e\u611f\u4e0e\u9636\u6bb5\u6027\u6b63\u53cd\u9988**\u3002\u8ba9\u4ed6\u611f\u53d7\u5230\u88ab\u56e2\u961f\u63a5\u7eb3\uff08\u201c\u6765\u5230\u6211\u7684\u5267\u793e\u201d\uff09\u3001\u88ab\u770b\u89c1\uff08\u201c\u6211\u770b\u597d\u4f60\u54e6\u201d\uff09\uff0c\u5e76\u901a\u8fc7\u5b8c\u6210\u5c0f\u4efb\u52a1\u3001\u83b7\u5f97\u70b9\u8bc4\u6765\u5efa\u7acb\u81ea\u4fe1\u548c\u6301\u7eed\u53c2\u4e0e\u7684\u52a8\u529b\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7 B\u7c7b** \uff08\u52a8\u673a\u4e2d\u7b49\u3001\u8d44\u6e90\u53d7\u9650\u3001\u9700\u5f15\u5bfc\u4e0e\u966a\u4f34\uff09 |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T5 \u597d\u73a9\u5c1d\u9c9c\u578b** \uff08\u6838\u5fc3\u7279\u5f81\uff1a\u5174\u8da3\u9a71\u52a8\uff0c\u63a2\u7d22\u4e3a\u4e3b\uff0c\u65f6\u95f4\u788e\u7247\u5316\uff0c\u5bf9\u53d8\u73b0\u9884\u671f\u6a21\u7cca\uff0c\u9700\u8981\u8f7b\u677e\u6709\u8da3\u7684\u4f53\u9a8c\u548c\u793e\u4ea4\u6ee1\u8db3\u611f\uff09 |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5ead\u5f3a\u70c8\u53cd\u5bf9\u7b49\u7ea2\u7ebf\u4fe1\u53f7\u3002**\u4f46\u5bb6\u5ead\u652f\u6301\u5ea6\u4fe1\u606f\u7f3a\u5931\uff0c\u9700\u540e\u7eed\u8865\u5145\u786e\u8ba4\u3002**\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4e2d | **\u4fe1\u606f\u7f3a\u5931\uff0c\u4f46\u9700\u8b66\u60d5**\u3002\u82e5\u62a5\u540d\u8d39\u7528\u672a\u4e0e\u5bb6\u4eba\u6c9f\u901a\uff0c\u540e\u7eed\u53ef\u80fd\u5f15\u53d1\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u65f6\u95f4\u7cbe\u529b\u4e25\u91cd\u4e0d\u8db3**\u3002\u767d\u5929\u5de5\u4f5c\u7e41\u5fd9\uff0c\u4ec5\u9760\u665a\u4e0a\u788e\u7247\u65f6\u95f4\u5b66\u4e60\uff0c\u6781\u6613\u56e0\u5de5\u4f5c\u52a0\u73ed\u3001\u751f\u6d3b\u7410\u4e8b\u5bfc\u81f4\u8bfe\u7a0b\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u7126\u8651\u548c\u81ea\u8d23\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u76ee\u524d\u6c9f\u901a\u987a\u7545\uff0c\u672a\u8868\u73b0\u51fa\u6781\u7aef\u60c5\u7eea\u5316\u6216\u81ea\u5351\u3002\u4f46\u82e5\u5b66\u4e60\u521d\u671f\u9047\u5230\u6280\u672f\u96be\u9898\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u3001\u5f55\u97f3\u6548\u679c\u5dee\uff09\u4e14\u65e0\u4eba\u53ca\u65f6\u534f\u52a9\uff0c\u53ef\u80fd\u4ea7\u751f\u632b\u8d25\u611f\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u5f53\u524d\u5bf9\u53d8\u73b0\u9884\u671f\u4e0d\u5f3a\u70c8\uff0c\u4f46\u82e5\u8fdb\u5165\u6b63\u5f0f\u8bfe\u7a0b\u540e\uff0c\u53d1\u73b0\u63a5\u5355\u95e8\u69db\u9ad8\u3001\u56de\u62a5\u5468\u671f\u957f\uff0c\u4e0e\u9500\u552e\u524d\u671f\u63cf\u7ed8\u7684\u201c\u5267\u7ec4\u5206\u89d2\u8272\u201d\u3001\u201c\u5f88\u5feb\u5c31\u80fd\u6709\u620f\u611f\u201d\u4ea7\u751f\u843d\u5dee\uff0c\u53ef\u80fd\u5931\u671b\u9000\u51fa\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-4\u5468**\u3002\u6b64\u65f6\u5b66\u4e60\u5185\u5bb9\u52a0\u6df1\uff0c\u4f5c\u4e1a\u91cf\u53ef\u80fd\u589e\u52a0\uff0c\u7528\u6237\u56e0\u5de5\u4f5c\u65f6\u95f4\u51b2\u7a81\u65e0\u6cd5\u6309\u65f6\u5b8c\u6210\uff0c\u7d2f\u79ef\u7684\u632b\u8d25\u611f\u548c\u8fdb\u5ea6\u538b\u529b\u8fbe\u5230\u5cf0\u503c\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u6d45\u6d45\u540c\u5b66\u4f60\u597d\u5440\uff01\u770b\u5230\u4f60\u767d\u5929\u5de5\u4f5c\u8fd9\u4e48\u5fd9\uff0c\u665a\u4e0a\u8fd8\u575a\u6301\u5b66\u4e60\u65b0\u4e1c\u897f\uff0c\u771f\u7684\u7279\u522b\u6709\u63a2\u7d22\u7cbe\u795e\uff01\u54b1\u4eec\u8fd9\u4e2a\u5708\u5b50\u5f88\u591a\u90fd\u662f\u50cf\u4f60\u4e00\u6837\u7684\u4e0a\u73ed\u65cf\uff0c\u5927\u5bb6\u4e92\u76f8\u6253\u6c14\uff0c\u5229\u7528\u788e\u7247\u65f6\u95f4\u6162\u6162\u73a9\u51fa\u82b1\u6837\u3002\u522b\u62c5\u5fc3\u8fdb\u5ea6\uff0c\u54b1\u4eec\u4e3b\u6253\u4e00\u4e2a\u2018\u73a9\u4e2d\u5b66\u2019\uff0c\u6709\u4efb\u4f55\u95ee\u9898\u968f\u65f6\u627e\u6211\uff0c\u665a\u4e0a\u4e0b\u73ed\u540e\u6211\u5728\u7ebf\u7b49\u4f60~\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5174\u8da3\u6e38\u4e50\u7ebf\u3011**\u3002\u5f31\u5316\u201c\u786c\u6838\u8bad\u7ec3\u201d\u548c\u201c\u5feb\u901f\u53d8\u73b0\u201d\u538b\u529b\uff0c\u5f3a\u5316\u793e\u7fa4\u4e92\u52a8\u3001\u8da3\u5473\u7ec3\u4e60\u3001\u6210\u5c31\u611f\u6253\u5361\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T5\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\uff1a**\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\uff08\u5b9a\u671f\u5173\u6000\u3001\u964d\u4f4e\u4f5c\u4e1a\u96be\u5ea6\u9884\u671f\uff09\u3001**\u3010\u5708\u5c42\u8f7b\u793e\u4ea4\u5305\u3011**\uff08\u5c0f\u7ec4\u6d3b\u52a8\u3001\u8da3\u5473\u914d\u97f3\u6311\u6218\u3001\u6652\u8bc1\u4e66\u6d77\u62a5\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7edd\u4e0d\u5bf9T5\u65bd\u52a0\u8fc7\u91cd\u7684\u4f5c\u4e1a\u538b\u529b\u548c\u53d8\u73b0KPI\uff1b\u7edd\u4e0d\u7528\u201c\u4e0d\u52aa\u529b\u5c31\u8d5a\u4e0d\u5230\u94b1\u201d\u7b49\u7126\u8651\u8bdd\u672f\u65bd\u538b\uff1b\u907f\u514d\u5b89\u6392\u9700\u8981\u5927\u5757\u8fde\u7eed\u65f6\u95f4\u624d\u80fd\u5b8c\u6210\u7684\u590d\u6742\u4efb\u52a1\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u521d\u671f\u8fdb\u884c\u5927\u989d\u5347\u5355**\u3002\u53ef\u5c1d\u8bd5\u63a8\u8350\u4f4e\u5355\u4ef7\u3001\u9ad8\u8da3\u5473\u6027\u7684\u5fae\u8bfe\u6216\u793e\u7fa4\u6d3b\u52a8\uff0c\u89c2\u5bdf\u5176\u65f6\u95f4\u6295\u5165\u548c\u5174\u8da3\u6301\u4e45\u5ea6\u540e\u518d\u505a\u8003\u8651\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u73b0\u5728\u8fd8\u5728\u4e0a\u73ed\uff0c\u53ef\u80fd\u53ea\u6709\u665a\u4e0a\u6709\u65f6\u95f4\u201d\n2. > \u201c\u901a\u8fc7\u8fd9\u4e24\u5929\u7684\u5b66\u4e60\uff0c\u6211\u53d1\u73b0\u914d\u97f3\u4e0d\u662f\u6211\u4ee5\u4e3a\u7684\u53ea\u662f\u58f0\u97f3\uff0c\u8fd8\u662f\u6709\u5f88\u591a\u5176\u4ed6\u7684\u79cd\u7c7b\uff0c\u8981\u5b66\u4e60\u7684\u8fd8\u5f88\u591a\u201d\n3. > \u201c\u8fd8\u633a\u611f\u5174\u8da3\u7684\u201d / \u201c\u6709\u70b9\u671f\u5f85\uff01\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T5\u597d\u73a9\u5c1d\u9c9c\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u5bfb\u627e\u65b0\u5708\u5b50\u548c\u4ef7\u503c\u8ba4\u540c**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u964d\u4f4e\u5b66\u4e60\u5f3a\u5ea6\u9884\u671f\uff0c\u5f3a\u5316\u793e\u7fa4\u8da3\u5473\u966a\u4f34\uff0c\u5c06\u5b66\u4e60\u201c\u6e38\u620f\u5316\u201d**\u3002\n\n```json\n{\"core_type\": \"T5 \u597d\u73a9\u5c1d\u9c9c\u578b\", \"maslow_need\": \"\u793e\u4ea4/\u5c0a\u91cd\u9700\u6c42\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf+\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
