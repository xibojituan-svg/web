    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677153119 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-09 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u94c3\u6eaa\u3010\u559c\u9a6cAI\u5199\u4f5c\u9ad8\u7ea7\u6559\u7ec3\u3011(\u5218\u8273\u73b2) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u5199\u4f5c\u8bfe\u7a0b (\u4ef7\u683c\uff1a4380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\uff0c\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u65e0\u6cd5\u5224\u65ad\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3**\uff0c\u7528\u6237\u4ec5\u63d0\u53ca\u201c\u4e1a\u4f59\u65f6\u95f4\u201d\uff0c\u4f46\u672a\u660e\u786e\u5177\u4f53\u65f6\u957f\u4e0e\u7a33\u5b9a\u6027\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\uff0c\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u60c5\u51b5\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u7f6e\u4fe1\u5ea6\u964d\u4f4e\uff09**\u3002\u7528\u6237\u4ec5\u53d1\u8a005\u6b21\uff0c\u6838\u5fc3\u4fe1\u606f\uff08\u65f6\u95f4\u3001\u8d44\u91d1\u3001\u5bb6\u5ead\u3001\u8fc7\u5f80\u7ecf\u5386\u3001\u5b66\u4e60\u80fd\u529b\uff09\u5747\u672a\u66b4\u9732\uff0c\u5224\u65ad\u4e3b\u8981\u57fa\u4e8e\u9500\u552e\u5355\u65b9\u9762\u8f93\u51fa\u548c\u7528\u6237\u7684\u88ab\u52a8\u53cd\u5e94\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b07\u4f4e\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u7eaf\u4e3a\u51e0\u5929\u5185\u63d0\u73b0\u4fdd\u5e95\u800c\u6765(\u4f4e\u6781\u5371)**\u3002\u7528\u6237\u552f\u4e00\u4e3b\u52a8\u63d0\u51fa\u7684\u6838\u5fc3\u5173\u5207\u662f\u201c\u786e\u5b9a\u53ea\u7528\u4e1a\u4f59\u65f6\u95f4\u5c31\u80fd\u8d5a\u94b1\u5417\u201d\uff0c\u8868\u660e\u5176\u6838\u5fc3\u9a71\u52a8\u529b\u662f\u5feb\u901f\u3001\u4f4e\u95e8\u69db\u7684\u53d8\u73b0\u627f\u8bfa\uff0c\u800c\u975e\u5bf9\u5199\u4f5c\u6216AI\u6280\u80fd\u672c\u8eab\u7684\u70ed\u7231\u6216\u957f\u671f\u6295\u5165\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u542c\u4e86\u8fd9\u4e24\u5929\u7684\u8bfe\uff0c\u8fd8\u5728\u72b9\u8c6b\uff0c\u5728\u60f3\u8fd9\u4e2a\u786e\u5b9a\u53ea\u7528\u4e1a\u4f59\u65f6\u95f4\u5c31\u80fd\u8d5a\u94b1\u5417\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d (\u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u4f30)\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**[\u4fe1\u606f\u4e0d\u8db3]** \u2014 \u672a\u63d0\u53ca\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**[\u4fe1\u606f\u4e0d\u8db3]** \u2014 \u4ec5\u63d0\u53ca\u201c\u4e1a\u4f59\u65f6\u95f4\u201d\uff0c\u4f46\u672a\u8bf4\u660e\u5177\u4f53\u65f6\u957f\u4e0e\u7a33\u5b9a\u6027\uff0c\u5b58\u5728\u4e0d\u786e\u5b9a\u6027\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**[\u4fe1\u606f\u4e0d\u8db3]** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u7528\u6237\u8868\u73b0\u51fa\u6781\u5f3a\u7684\u72b9\u8c6b\u3001\u6000\u7591\u548c\u4e0d\u81ea\u4fe1\uff08\u201c\u8fd8\u5728\u72b9\u8c6b\u201d\u3001\u201c\u6211\u5728\u8003\u8651\u8003\u8651\u5427[\u6342\u8138]\u201d\uff09\uff0c\u4e14\u5728\u9500\u552e\u63d0\u4f9b\u5177\u4f53\u6307\u5bfc\uff08\u4fee\u6539\u4f5c\u4e1a\u3001\u63d0\u4f9b\u6295\u7a3f\u6e20\u9053\uff09\u540e\uff0c\u4ecd\u672a\u8868\u73b0\u51fa\u79ef\u6781\u5c1d\u8bd5\u7684\u884c\u52a8\u529b\uff0c\u53cd\u800c\u7ee7\u7eed\u9000\u7f29\u3002\u8fd9\u9884\u793a\u5176\u5728\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u9047\u5230\u4efb\u4f55\u6280\u672f\u56f0\u96be\u6216\u521d\u671f\u6295\u7a3f\u5931\u8d25\uff0c\u6781\u6613\u4ea7\u751f\u201c\u6211\u4e0d\u884c\u201d\u3001\u201c\u88ab\u9a97\u4e86\u201d\u7684\u632b\u8d25\u611f\uff0c\u8fdb\u800c\u5f15\u53d1\u9000\u8d39\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u5728\u8003\u8651\u8003\u8651\u5427[\u6342\u8138]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c** ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u4e3b\u4e1a\u6536\u5165\u6216\u672a\u6765\u7ecf\u6d4e\u72b6\u51b5\u7684**\u6df1\u5c42\u7126\u8651\u4e0e\u4e0d\u5b89\u5168\u611f**\uff0c\u5e0c\u671b\u901a\u8fc7\u4e00\u4e2a\u201c\u786e\u5b9a\u201d\u7684\u3001\u201c\u53ea\u7528\u4e1a\u4f59\u65f6\u95f4\u201d\u7684\u526f\u4e1a\u5feb\u901f\u83b7\u5f97\u7ecf\u6d4e\u4fdd\u969c\uff0c\u7f13\u89e3\u751f\u5b58\u538b\u529b\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u4e0e\u5b89\u5168\u611f**\u3002\u4ed6\u9700\u8981\u7684\u4e0d\u662f\u201c\u53ef\u80fd\u6027\u201d\uff0c\u800c\u662f\u201c\u4fdd\u8bc1\u201d\u3002\u9700\u8981\u4e0d\u65ad\u7528\u201c\u786e\u5b9a\u80fd\u8d5a\u94b1\u201d\u7684\u6848\u4f8b\u3001\u8def\u5f84\u548c\u627f\u8bfa\u6765\u5b89\u629a\u5176\u7126\u8651\uff0c\u540c\u65f6\u964d\u4f4e\u5176\u5b66\u4e60\u8fc7\u7a0b\u4e2d\u7684\u632b\u8d25\u9884\u671f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1 \u7c7b** (\u52a8\u673a\u4e0d\u7eaf\u3001\u8d44\u6e90\u4e0d\u660e\u3001\u5fc3\u7406\u5f39\u6027\u6781\u4f4e\uff0c\u4f46\u5c1a\u672a\u89e6\u53d1D\u7c7b\u7ea2\u7ebf) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u6838\u5fc3\u7279\u5f81\uff1a\u6781\u5ea6\u72b9\u8c6b\u3001\u4e0d\u81ea\u4fe1\u3001\u9700\u8981\u6301\u7eed\u7684\u60c5\u7eea\u5b89\u629a\u548c\u786e\u5b9a\u6027\u627f\u8bfa\uff0c\u884c\u52a8\u529b\u5f31\uff0c\u6297\u538b\u80fd\u529b\u5dee) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u804a\u5929\u8bb0\u5f55\u4e2d\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5c5e\u5f3a\u70c8\u53cd\u5bf9\u7b49D\u7c7b\u7194\u65ad\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **[\u4fe1\u606f\u4e0d\u8db3]** | \u672a\u77e5\uff0c\u4f46\u82e5\u62a5\u540d\u8d44\u91d1\u5f71\u54cd\u5bb6\u5ead\u5f00\u652f\u6216\u5bb6\u4eba\u53cd\u5bf9\uff0c\u98ce\u9669\u6781\u9ad8\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | \u5de5\u4f5c\u6216\u751f\u6d3b\u7e41\u5fd9\u5bfc\u81f4\u65e0\u6cd5\u8ddf\u4e0a\u8bfe\u7a0b\u8282\u594f\uff0c\u4ea7\u751f\u201c\u82b1\u4e86\u94b1\u6ca1\u65f6\u95f4\u5b66\u201d\u7684\u6127\u759a\u548c\u7126\u8651\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669\uff01** \u7b2c\u4e00\u6b21\u5b89\u88c5AI\u5de5\u5177\u5931\u8d25\u3001\u7b2c\u4e00\u6b21\u5199\u4f5c\u4e1a\u88ab\u6279\u8bc4\u3001\u7b2c\u4e00\u6b21\u6295\u7a3f\u88ab\u62d2\uff0c\u4efb\u4f55\u5fae\u5c0f\u7684\u632b\u6298\u90fd\u4f1a\u7acb\u523b\u89e6\u53d1\u5176\u201c\u6211\u4e0d\u884c\u201d\u3001\u201c\u88ab\u9a97\u4e86\u201d\u7684\u8ba4\u77e5\uff0c\u60c5\u7eea\u5d29\u6e83\u8981\u6c42\u9000\u8d39\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669\uff01** \u5f00\u8bfe\u7b2c\u4e00\u5468\u6216\u7b2c\u4e00\u6b21\u5c1d\u8bd5\u6295\u7a3f\u540e\uff0c\u53d1\u73b0\u65e0\u6cd5\u7acb\u523b\u8d5a\u5230\u94b1\uff0c\u4e0e\u9500\u552e\u63cf\u8ff0\u7684\u201c\u4e00\u4e2a\u6708\u7b7e\u7ea6\u201d\u3001\u201c\u4e1a\u4f59\u65f6\u95f4\u8f7b\u677e\u8d5a\u94b1\u201d\u4ea7\u751f\u5de8\u5927\u843d\u5dee\uff0c\u7acb\u523b\u66b4\u6012\u6295\u8bc9\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e7-14\u5929\uff08\u7b2c\u4e00\u4efd\u4f5c\u4e1a\u53cd\u9988\u671f/\u7b2c\u4e00\u6b21\u5c1d\u8bd5\u6295\u7a3f\u671f\uff09**\u3002\u6b64\u65f6\u65b0\u9c9c\u611f\u8fc7\u53bb\uff0c\u771f\u5b9e\u7684\u5b66\u4e60\u96be\u5ea6\u548c\u53d8\u73b0\u8ddd\u79bb\u663e\u73b0\uff0c\u662f\u5176\u5fc3\u7406\u9632\u7ebf\u6700\u8106\u5f31\u7684\u65f6\u523b\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5b9d\uff0c\u770b\u5230\u4f60\u62a5\u540d\u6211\u7279\u522b\u5f00\u5fc3\uff0c\u4e5f\u7279\u522b\u7406\u89e3\u4f60\u4e4b\u524d\u72b9\u8c6b\u7684\u5fc3\u60c5\u3002\u54b1\u4eec\u8fd9\u4e2a\u8bfe\u5c31\u662f\u4e3a\u2018\u60f3\u7528\u4e1a\u4f59\u65f6\u95f4\u7a33\u7a33\u8d5a\u70b9\u94b1\u2019\u7684\u4f19\u4f34\u8bbe\u8ba1\u7684\u3002\u4f60\u4e0d\u7528\u62c5\u5fc3\uff0c\u8ddf\u7740\u6211\u7684\u8282\u594f\uff0c\u54b1\u4eec\u7b2c\u4e00\u6b65\u5148\u4e0d\u6025\u7740\u8d5a\u94b1\uff0c\u5c31\u641e\u5b9a\u4e00\u4e2a\u2018\u66b4\u51fb\u5f00\u5934\u2019\uff0c\u6211\u624b\u628a\u624b\u5e26\u4f60\u8fc7\uff0c\u8ba9\u4f60\u5148\u627e\u5230\u2018\u6211\u80fd\u884c\u2019\u7684\u611f\u89c9\u3002\u6709\u4efb\u4f55\u5361\u4f4f\u7684\u5730\u65b9\uff0c\u54ea\u6015\u8f6f\u4ef6\u88c5\u4e0d\u4e0a\uff0c\u968f\u65f6\u558a\u6211\uff0c\u6211\u79d2\u56de\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf**\u3011\u3002\u6838\u5fc3\u76ee\u6807\u662f\u7ef4\u6301\u5176\u5b66\u4e60\u4fe1\u5fc3\uff0c\u800c\u975e\u8ffd\u6c42\u786c\u6838\u4ea7\u51fa\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u8865\u5145\u3010**\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305**\u3011\u3002\u5305\u62ec\uff1a\u6bcf\u65e5\u9f13\u52b1\u6253\u5361\u3001\u4f5c\u4e1a\u65e0\u8bba\u597d\u574f\u90fd\u5148\u7ed9\u4e88\u201c\u5b8c\u6210\u5373\u80dc\u5229\u201d\u7684\u5938\u5f20\u8d5e\u7f8e\u3001\u63d0\u4f9b\u6700\u7b80\u5316\u7684\u201c\u4e00\u952e\u751f\u6210\u201d\u5f0f\u5de5\u5177\u548c\u6a21\u677f\uff0c\u5265\u79bb\u4e00\u5207\u4f1a\u589e\u52a0\u5176\u632b\u8d25\u611f\u7684\u590d\u6742\u4efb\u52a1\u548c\u4e25\u82db\u70b9\u8bc4\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u4ed6\u4f7f\u7528\u6fc0\u5c06\u6cd5\u6216\u65bd\u52a0\u538b\u529b**\uff08\u5982\u201c\u522b\u4eba\u90fd\u6295\u7a3f\u4e86\u4f60\u600e\u4e48\u8fd8\u6ca1\u52a8\u201d\uff09\u3002\n    2. **\u7edd\u4e0d\u5728\u521d\u671f\u5e03\u7f6e\u9ad8\u96be\u5ea6\u4f5c\u4e1a\u6216\u8981\u6c42\u590d\u6742\u4ea7\u51fa**\u3002\n    3. **\u7edd\u4e0d\u5bf9\u4ed6\u753b\u201c\u77ed\u671f\u66b4\u5bcc\u201d\u7684\u5927\u997c**\uff0c\u8981\u7ba1\u7406\u9884\u671f\uff1a\u201c\u54b1\u4eec\u5148\u6253\u597d\u57fa\u7840\uff0c\u8d5a\u94b1\u662f\u6c34\u5230\u6e20\u6210\u201d\u3002\n    4. **\u907f\u514d\u8ba9\u4ed6\u76f4\u63a5\u9762\u5bf9\u51b0\u51b7\u7684\u6295\u7a3f\u7cfb\u7edf\u6216\u590d\u6742\u89c4\u5219**\uff0c\u5e94\u7531\u73ed\u4e3b\u4efb\u6216\u52a9\u6559\u4f5c\u4e3a\u7f13\u51b2\u5e26\u4ee3\u4e3a\u5904\u7406\u521d\u671f\u6295\u7a3f\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u5b8c\u6210\u5f53\u524d\u8bfe\u7a0b\u5e76\u6709\u7a33\u5b9a\u6b63\u53cd\u9988\uff08\u5982\u6210\u529f\u6536\u5230\u7b2c\u4e00\u7b14\u5c0f\u989d\u7a3f\u8d39\uff09\u524d\uff0c\u7981\u6b62\u63a8\u8350\u4efb\u4f55\u9ad8\u9636\u8bfe\u7a0b\u6216\u9644\u52a0\u4ea7\u54c1\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u542c\u4e86\u8fd9\u4e24\u5929\u7684\u8bfe\uff0c\u8fd8\u5728\u72b9\u8c6b\uff0c\u5728\u60f3\u8fd9\u4e2a\u786e\u5b9a\u53ea\u7528\u4e1a\u4f59\u65f6\u95f4\u5c31\u80fd\u8d5a\u94b1\u5417\u201d \u2014 **\u66b4\u9732\u6838\u5fc3\u52a8\u673a\uff1a\u8ffd\u6c42\u786e\u5b9a\u6027\u7684\u4f4e\u95e8\u69db\u5feb\u901f\u53d8\u73b0\u3002**\n2. > \u201c\u6211\u5728\u8003\u8651\u8003\u8651\u5427[\u6342\u8138]\u201d \u2014 **\u66b4\u9732\u6838\u5fc3\u72b6\u6001\uff1a\u6781\u5ea6\u72b9\u8c6b\u3001\u4e0d\u81ea\u4fe1\u3001\u884c\u52a8\u529b\u5f31\uff0c\u662f\u5178\u578b\u7684\u60c5\u7eea\u5de8\u5a74\u8868\u5f81\u3002**\n3. > (\u7528\u6237\u63d0\u4ea4\u4f5c\u4e1a\u94fe\u63a5\u5e76\u95ee\u201c\u4f60\u770b\u4e00\u4e0b\u8fd9\u4e2a\u8981\u600e\u6837\u4fee\u6539\u201d) \u2014 **\u66b4\u9732\u884c\u4e3a\u6a21\u5f0f\uff1a\u88ab\u52a8\u4f9d\u8d56\uff0c\u7b49\u5f85\u88ab\u6295\u5582\u89e3\u51b3\u65b9\u6848\uff0c\u7f3a\u4e4f\u4e3b\u52a8\u63a2\u7d22\u548c\u8bd5\u9519\u52c7\u6c14\u3002**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T6\u60c5\u7eea\u5de8\u5a74\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u786e\u5b9a\u6027\u7684\u7ecf\u6d4e\u4fdd\u969c\u4ee5\u7f13\u89e3\u7126\u8651**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u6781\u9ad8**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u63d0\u4f9b\u6781\u81f4\u7684\u60c5\u611f\u966a\u62a4\u4e0e\u5b89\u5168\u611f\uff0c\u5927\u5e45\u964d\u4f4e\u5b66\u4e60\u95e8\u69db\u548c\u632b\u8d25\u9884\u671f\uff0c\u7528\u201c\u5b8c\u6210\u5373\u80dc\u5229\u201d\u7684\u8d5e\u7f8e\u4ee3\u66ff\u7ed3\u679c\u8003\u6838**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"risk_level\": \"\u6781\u9ad8\", \"target_product_line\": \"\u7597\u6108\u966a\u4f34\u8f85\u52a9\u7ebf\"}\n```";
