    <script>
        const markdownText = "# \u7528\u6237\u5fc3\u7406\u8bca\u65ad\u62a5\u544a (UID: 43730832)\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u9ad8)**: \u5b66\u4e60\u52a8\u673a\u660e\u786e\uff0c\u517c\u5177**\u53d8\u73b0\u9700\u6c42**\uff08\u91cd\u8fd4\u804c\u573a/\u5728\u5bb6\u529e\u516c\uff09\u4e0e**\u5174\u8da3/\u81ea\u6211\u5b9e\u73b0**\uff08\u5706\u4f5c\u5bb6\u68a6\u3001\u4e3a\u5b69\u5b50\u505a\u699c\u6837\uff09\u3002\u4f46\u5b58\u5728**\u5174\u8da3\u5206\u6563**\u98ce\u9669\uff08\u540c\u65f6\u8003\u5bdf\u6709\u58f0\u6f14\u64ad\u4e0eAI\u5199\u4f5c\uff09\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d)**: \u6709\u4e00\u5b9a**\u884c\u4e1a\u80cc\u666f**\uff08IT\u5b9e\u65bd/\u4ea7\u54c1\u7ecf\u7406\u76f8\u5173\uff09\uff0c\u5177\u5907\u57fa\u7840\u8ba4\u77e5\u3002**\u65f6\u95f4\u788e\u7247\u5316**\uff083\u5c81\u5b9d\u5988\uff0c\u9700\u5e26\u5a03\uff09\uff0c**\u7cbe\u529b\u6709\u9650**\u3002\u5b66\u4e60\u5de5\u5177\uff08AI\u52a9\u624b\uff09\u4f7f\u7528\u79ef\u6781\uff0c\u4f46\u7f3a\u4e4f\u4e13\u4e1a\u4e50\u7406\u7b49\u7279\u5b9a\u6280\u80fd\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u4e2d\u9ad8)**: **\u5fc3\u6001\u79ef\u6781**\uff0c\u4e50\u4e8e\u5c1d\u8bd5\u4e0e\u5206\u4eab\uff08\u4e3b\u52a8\u5206\u4eab\u7075\u611f\u3001\u5206\u6790\u7535\u5f71\uff09\u3002**\u6c9f\u901a\u610f\u613f\u5f3a**\uff0c\u4e0e\u9500\u552e\u5efa\u7acb\u826f\u597d\u5173\u7cfb\u3002\u4f46\u5b58\u5728**\u81ea\u6211\u6000\u7591**\uff08\u201c\u4e0d\u77e5\u9053\u8fd8\u80fd\u4e0d\u80fd\u542c\u61c2\u201d\u3001\u201c\u611f\u89c9\u6ca1\u6709\u5e0c\u671b\u201d\uff09\uff0c\u4e14**\u6297\u538b\u80fd\u529b\u5b58\u7591**\uff08\u201c\u89c9\u5f97\u597d\u538b\u6291\u201d\uff09\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n*   **\u6b65\u9aa40 - \u652f\u4ed8\u6838\u67e5**: \u8bb0\u5f55\u4e2d\u672a\u660e\u786e\u63d0\u53ca\u5df2\u652f\u4ed8\u7cfb\u7edf\u8bfe\u8d39\u7528\u3002\u7528\u6237\u5904\u4e8e**\u8bd5\u542c\u8bfe/\u8bad\u7ec3\u8425**\u9636\u6bb5\uff0c\u8be2\u95ee\u201c\u8bfe\u7a0b\u4e0d\u77e5\u9053\u80fd\u4e0d\u80fd\u652f\u6301\u6211\u81ea\u5b66\u201d\uff0c\u8868\u660e**\u5c1a\u672a\u5b8c\u6210\u6b63\u4ef7\u8bfe\u8f6c\u5316**\u3002\n*   **\u6b65\u9aa41.5 - \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: \u7528\u6237\u4e3a**\u5168\u804c\u5988\u5988**\uff0c\u804a\u5929\u4e2d\u672a\u63d0\u53ca\u9700\u4e0e\u914d\u5076\u6216\u5176\u4ed6\u5bb6\u4eba\u5546\u8bae\uff0c\u8868\u73b0\u51fa\u8f83\u5f3a\u7684\u4e2a\u4eba\u51b3\u7b56\u81ea\u4e3b\u6027\u3002\u4f46\u9700\u6ce8\u610f\u5176\u7ecf\u6d4e\u6765\u6e90\u53ca\u5927\u989d\u652f\u51fa\u7684\u5bb6\u5ead\u77e5\u60c5\u6743\u53ef\u80fd\u6784\u6210\u9690\u5f62\u98ce\u9669\u3002\n*   **\u7efc\u5408\u5224\u5b9a**: **B\u7c7b (\u5174\u8da3\u63a2\u7d22\u578b)**\u3002\u7528\u6237\u6709\u660e\u786e\u5b66\u4e60\u610f\u613f\u548c\u4e00\u5b9a\u57fa\u7840\uff0c\u4f46\u76ee\u6807\u5c1a\u672a\u805a\u7126\uff08\u5728AI\u5199\u4f5c\u4e0e\u6709\u58f0\u6f14\u64ad\u95f4\u6447\u6446\uff09\uff0c\u4e14\u5bf9\u8bfe\u7a0b\u6548\u679c\u3001\u81ea\u8eab\u80fd\u529b\u53ca\u65f6\u95f4\u7cbe\u529b\u5339\u914d\u5ea6\u5b58\u5728\u987e\u8651\uff0c\u5904\u4e8e\u6df1\u5ea6\u8003\u8651\u548c\u8bc4\u4f30\u9636\u6bb5\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n**T4 \u52a1\u5b9e\u63a2\u7d22\u8005**\u3002\u7279\u5f81\u543b\u5408\uff1a\n*   **\u7406\u6027\u8bc4\u4f30**: \u5bf9\u6bd4\u591a\u4e2a\u8bfe\u7a0b\u65b9\u5411\uff08AI\u5199\u4f5c vs. \u6709\u58f0\u6f14\u64ad\uff09\uff0c\u5173\u6ce8\u8bfe\u7a0b\u5bf9\u81ea\u5b66\u7684\u652f\u6301\u5ea6\u3002\n*   **\u95ee\u9898\u9a71\u52a8**: \u4e3b\u52a8\u63d0\u51fa\u5177\u4f53\u95ee\u9898\uff08\u5982\u4f55\u751f\u6210MV\u3001\u63d0\u793a\u8bcd\u5de5\u7a0b\u5e08\u65b9\u5411\uff09\u3002\n*   **\u6210\u679c\u5bfc\u5411**: \u5173\u6ce8\u5b66\u4e60\u540e\u7684\u5e94\u7528\u573a\u666f\uff08\u91cd\u8fd4\u804c\u573a\u3001\u517c\u804c\u53ef\u80fd\u3001\u53c2\u52a0\u6bd4\u8d5b\uff09\u3002\n*   **\u8d44\u6e90\u6709\u9650**: \u660e\u786e\u610f\u8bc6\u5230\u65f6\u95f4\u3001\u7cbe\u529b\uff08\u5e26\u5a03\uff09\u7684\u9650\u5236\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u4e2d\u4f4e)\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f (\u4e2d)**: \u7528\u6237\u5bf9\u8bfe\u7a0b\u62b1\u6709\u8f83\u9ad8\u671f\u5f85\uff08\u89e3\u51b3\u804c\u573a\u7126\u8651\u3001\u5706\u68a6\uff09\uff0c\u82e5\u5b66\u4e60\u540e\u65e0\u6cd5\u5feb\u901f\u4ea7\u51fa\u6216\u53d8\u73b0\uff0c\u6613\u4ea7\u751f\u843d\u5dee\u3002\n    2.  **\u65f6\u95f4\u7cbe\u529b\u51b2\u7a81 (\u4e2d)**: **\u3010\u5173\u952e\u96f7\u533a\u3011** \u7528\u6237\u591a\u6b21\u5f3a\u8c03\u201c\u5e26\u5a03\u201d\u3001\u201c\u5fd9\u4e0d\u8fc7\u6765\u201d\uff0c\u8fd9\u662f\u6700\u73b0\u5b9e\u7684\u5236\u7ea6\u56e0\u7d20\u3002\u6b63\u8bfe\u5b66\u4e60\u5f3a\u5ea6\u53ef\u80fd\u5f15\u53d1\u540e\u7eed\u65f6\u95f4\u51b2\u7a81\u3002\n    3.  **\u8bfe\u7a0b\u5185\u5bb9\u9519\u914d (\u4f4e)**: \u7528\u6237\u5bf9\u8bfe\u7a0b\u5185\u5bb9\uff08AI\u5199\u4f5c\uff09\u8868\u73b0\u51fa\u6d53\u539a\u5174\u8da3\u548c\u521b\u4f5c\u6b32\uff0c\u5339\u914d\u5ea6\u8f83\u9ad8\u3002\n    4.  **\u9500\u552e\u627f\u8bfa\u4e0d\u7b26 (\u4f4e)**: \u9500\u552e\u6c9f\u901a\u4ee5\u9f13\u52b1\u3001\u5206\u4eab\u4e3a\u4e3b\uff0c\u672a\u53d1\u73b0\u8fc7\u5ea6\u627f\u8bfa\u3002\u4f46\u201c\u517c\u804c\u73ed\u4e3b\u4efb\u201d\u7684\u63d0\u53ca\u53ef\u80fd\u6a21\u7cca\u4e86\u8bfe\u7a0b\u4e3b\u8981\u76ee\u6807\u3002\n    5.  **\u7ecf\u6d4e\u538b\u529b (\u4fe1\u606f\u4e0d\u8db3)**: \u672a\u63d0\u53ca\u3002\n    6.  **\u5bb6\u5ead\u53cd\u5bf9 (\u4fe1\u606f\u4e0d\u8db3)**: \u672a\u63d0\u53ca\uff0c\u4f46\u51b3\u7b56\u6743\u81ea\u4e3b\u3002\n    7.  **\u5e73\u53f0/\u670d\u52a1\u4f53\u9a8c (\u4f4e)**: \u4e92\u52a8\u826f\u597d\uff0c\u672a\u53d1\u73b0\u670d\u52a1\u95ee\u9898\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u57fa\u672c\u5408\u89c4**: \u9500\u552e\u6c9f\u901a\u4ee5\u9f13\u52b1\u3001\u5206\u4eab\u7ecf\u9a8c\u3001\u89e3\u7b54\u95ee\u9898\u4e3a\u4e3b\uff0c\u672a\u53d1\u73b0\u5a01\u80c1\u3001\u6b3a\u8bc8\u6027\u8bdd\u672f\u3002\n*   **\u98ce\u9669\u70b9**:\n    *   **\u6a21\u7cca\u517c\u804c\u627f\u8bfa**: \u9500\u552e\u63d0\u53ca\u201c\u517c\u804c\u73ed\u4e3b\u4efb\u3001\u52a9\u6559\u4e5f\u53ef\u4ee5\u62a5\u540d\u201d\uff0c\u53ef\u80fd\u8ba9\u7528\u6237\u4ea7\u751f\u4e0d\u5207\u5b9e\u9645\u7684\u201c\u5185\u90e8\u5c97\u4f4d\u201d\u9884\u671f\u3002**\u9700\u660e\u786e\u6b64\u4e3a\u72ec\u7acb\u62db\u8058\u884c\u4e3a\uff0c\u4e0e\u8bfe\u7a0b\u7ed3\u4e1a\u65e0\u5fc5\u7136\u8054\u7cfb**\u3002\n    *   **\u5229\u7528\u7126\u8651**: \u90e8\u5206\u8bdd\u672f\u89e6\u53ca\u7528\u6237\u201c\u91cd\u8fd4\u804c\u573a\u65e0\u671b\u201d\u7684\u7126\u8651\uff0c\u4f46\u6574\u4f53\u5c3a\u5ea6\u5728\u5408\u7406\u8303\u56f4\u5185\u3002\n    *   **\u201c\u8d60\u54c1\u201d\u5f15\u5bfc**: \u4ee5\u201c\u7248\u6743\u4e66\u201d\u3001\u201c\u52a9\u5b66\u91d1\u4f18\u60e0\u5238\u201d\u7b49\u4f5c\u4e3a\u62a5\u540d\u8bf1\u56e0\uff0c\u5c5e\u4e8e\u5e38\u89c1\u9500\u552e\u7b56\u7565\uff0c\u672a\u89c1\u8fdd\u89c4\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6**: **\u5339\u914d**\u3002\u7528\u6237\u5bf9AI\u5199\u4f5c\u6709\u771f\u5b9e\u5174\u8da3\u3001\u521b\u4f5c\u7075\u611f\u548c\u5e94\u7528\u573a\u666f\u601d\u8003\uff0c\u4e0e\u8bfe\u7a0b\u76ee\u6807\u4e00\u81f4\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c**: **\u9996\u5468\u805a\u7126\u521b\u4f5c\u6b63\u53cd\u9988\uff0c\u5efa\u7acb\u5b66\u4e60\u8282\u594f**\n*   **\u5177\u4f53\u884c\u52a8\u6307\u5357**:\n    1.  **\u5f3a\u5316\u4ef7\u503c\u8ba4\u540c**: \u5145\u5206\u80af\u5b9a\u5176\u521b\u4f5c\u7075\u611f\uff08\u5982\u79d1\u5e7b\u60ac\u7591\u6784\u601d\uff09\uff0c\u5c06\u5176\u201c\u5706\u68a6\u201d\u4e0e\u201c\u5b9e\u7528\u6280\u80fd\u201d\u7ed3\u5408\uff0c\u8f6c\u5316\u4e3a\u6301\u7eed\u5b66\u4e60\u7684\u5185\u9a71\u529b\u3002\n    2.  **\u7ba1\u7406\u9884\u671f\uff0c\u62c6\u89e3\u76ee\u6807**: \u660e\u786e\u544a\u77e5\u8bfe\u7a0b\u6838\u5fc3\u662f\u638c\u63e1AI\u5199\u4f5c\u6280\u80fd\u4e0e\u53d8\u73b0\u8def\u5f84\uff0c\u800c\u975e\u76f4\u63a5\u63d0\u4f9b\u201c\u517c\u804c\u73ed\u4e3b\u4efb\u201d\u5c97\u4f4d\u3002\u5e2e\u52a9\u5176\u8bbe\u5b9a\u7b26\u5408\u201c\u5b9d\u5988\u201d\u65f6\u95f4\u7279\u6027\u7684\u3001\u9636\u6bb5\u6027\u3001\u53ef\u5b9e\u73b0\u7684\u5c0f\u76ee\u6807\uff08\u5982\u5b8c\u6210\u7b2c\u4e00\u4e2a\u77ed\u6545\u4e8b\uff09\u3002\n    3.  **\u63d0\u4f9b\u811a\u624b\u67b6\u652f\u6301**: \u9488\u5bf9\u5176\u201c\u4e0d\u61c2\u4e50\u7406\u201d\u7b49\u5177\u4f53\u5361\u70b9\uff0c\u63d0\u4f9b\u5de5\u5177\u3001\u6a21\u677f\u6216\u7b80\u5316\u6d41\u7a0b\uff0c\u52a9\u5176\u5b8c\u6210\u9996\u4e2a\u4f5c\u54c1\uff08\u5982MV\uff09\uff0c\u83b7\u53d6\u65e9\u671f\u6210\u5c31\u611f\u3002\n    4.  **\u5efa\u7acb\u89c4\u5f8b\u8054\u7cfb**: \u9274\u4e8e\u5176\u65f6\u95f4\u788e\u7247\u5316\uff0c\u9700\u7ea6\u5b9a\u56fa\u5b9a\u3001\u4f4e\u9891\u7387\u4f46\u9ad8\u8d28\u91cf\u7684\u901a\u8bdd\u6216\u6c9f\u901a\u65f6\u95f4\uff0c\u5e2e\u52a9\u5176\u7ef4\u6301\u5b66\u4e60\u8282\u594f\uff0c\u9632\u6b62\u56e0\u5fd9\u788c\u800c\u6389\u961f\u3002\n    5.  **\u98ce\u9669\u9884\u8b66**: \u53cb\u597d\u63d0\u9192\u5176\u5e73\u8861\u5b66\u4e60\u3001\u5e26\u5a03\u4e0e\u4f11\u606f\uff0c\u907f\u514d\u56e0\u538b\u529b\u8fc7\u5927\u800c\u4e2d\u65ad\u3002\u5173\u6ce8\u5176\u201c\u89c9\u5f97\u538b\u6291\u201d\u7b49\u60c5\u7eea\u4fe1\u53f7\u3002\n\n{\"core_type\": \"T4 \u52a1\u5b9e\u63a2\u7d22\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\u4f4e\", \"product_match\": \"\u5339\u914d\", \"action\": \"\u9996\u5468\u805a\u7126\u521b\u4f5c\u6b63\u53cd\u9988\uff0c\u5efa\u7acb\u5b66\u4e60\u8282\u594f\"}";
