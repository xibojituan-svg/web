    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID: 46630472\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u5168\u9762\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 46630472 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-10 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u51ac\u51ac\u8001\u5e08\uff08\u5170\u68a6\u4e39\uff09 |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u5f20\u9707\u6709\u58f0\u914d\u97f3\u8bad\u7ec3\u8425\uff08\u4ef7\u683c\u672a\u77e5\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3** |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u4fe1\u606f\u4e0d\u8db3** |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3** |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09** - \u7528\u6237\u4e3b\u52a8\u53d1\u8a00\u6781\u5c11\uff0c\u591a\u4e3a\u9500\u552e\u5355\u5411\u8f93\u51fa\uff0c\u5173\u952e\u4e09\u8f74\u4fe1\u606f\uff08\u8d44\u91d1\u3001\u65f6\u95f4\u3001\u5bb6\u5ead\u3001\u5fc3\u7406\u5f39\u6027\uff09\u4e25\u91cd\u4e0d\u8db3\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06**\u9ad8**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u4e3a\u80fd\u529b\u4e0e\u4e13\u4e1a\u7cbe\u8fdb\u800c\u6765**\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u4e86\u5bf9\u4e13\u4e1a\u6f14\u64ad\u6280\u5de7\uff08\u5982\u201c\u5165\u620f\u201d\u3001\u201c\u89d2\u8272\u628a\u63a7\u201d\uff09\u7684\u6df1\u5ea6\u597d\u5947\u548c\u8ffd\u6c42\uff0c\u800c\u975e\u5355\u7eaf\u8ffd\u95ee\u201c\u51e0\u5929\u80fd\u8d5a\u94b1\u201d\u3002\u5176\u52a8\u673a\u6e90\u4e8e\u5bf9\u884c\u4e1a\u6807\u6746\uff08\u7d2b\u7981\u3001\u5934\u9640\u6e0a\uff09\u7684\u6b23\u8d4f\u548c\u5bf9\u81ea\u8eab\u80fd\u529b\u5dee\u8ddd\u7684\u8ba4\u77e5\uff0c\u5c5e\u4e8e\u8ffd\u6c42\u81ea\u6211\u5b9e\u73b0\u7684\u6210\u957f\u578b\u52a8\u673a\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u4e00\u76f4\u5728\u559c\u9a6c\u62c9\u96c5\u542c\u4e66\uff0c\u6709\u58f0\u7684\u7d2b\u7981\uff0c\u5934\u9640\u6e0a\uff0c\u725b\u5927\u5b9d\u64ad\u7684\u611f\u89c9\u90fd\u633a\u597d\u3002\u611f\u89c9\u4ed6\u4eec\u7684\u58f0\u97f3\u5404\u6709\u7279\u8272\uff0c\u80fd\u7acb\u523b\u6293\u4f4f\u8033\u6735\uff0c\u611f\u89c9\u81ea\u5df1\u7684\u58f0\u97f3\u5dee\u592a\u8fdc\u3002\u201d > \u201c\u4ed6\u4eec\u662f\u5982\u4f55\u5165\u620f\uff0c\u5982\u4f55\u5c06\u89d2\u8272\u628a\u63a7\u7684\u90a3\u4e48\u51c6\u786e\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1**\u4e2d** (\u4fe1\u606f\u4e0d\u8db3\uff0c\u6682\u5b9a)\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u672a\u77e5** \u2014 \u65e0\u4efb\u4f55\u5173\u4e8e\u652f\u4ed8\u80fd\u529b\u3001\u5206\u671f\u3001\u501f\u8d37\u7684\u8ba8\u8bba\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u672a\u77e5** \u2014 \u7528\u6237\u80fd\u5b8c\u6210\u4f5c\u4e1a\u3001\u770b\u76f4\u64ad\uff0c\u4f46\u672a\u900f\u9732\u5177\u4f53\u65f6\u95f4\u5b89\u6392\uff08\u5982\u4e0a\u73ed\u65cf\u3001\u5b9d\u5988\u7b49\uff09\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u672a\u77e5** \u2014 \u65e0\u4efb\u4f55\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07**\u4f4e\u6781\u5371**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56**\u3002\u7528\u6237\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u201c\u81ea\u6211\u6000\u7591\u201d\u548c\u201c\u80fd\u529b\u4e0d\u8db3\u201d\u7684\u8ba4\u77e5\uff0c\u5c06\u201c\u627e\u4e0d\u5230\u611f\u89c9\u201d\u3001\u201c\u8499\u8499\u54d2\u201d\u5f52\u56e0\u4e8e\u4e2a\u4eba\u80fd\u529b\uff0c\u800c\u975e\u5b66\u4e60\u8fc7\u7a0b\u3002\u9762\u5bf9\u65b0\u4e8b\u7269\uff08Pia\u620f\uff09\u8868\u73b0\u51fa\u9000\u7f29\u548c\u8ff7\u832b\uff0c\u9700\u8981\u5916\u90e8\uff08\u9500\u552e\uff09\u7684\u5f3a\u70c8\u80af\u5b9a\u548c\u627f\u8bfa\u6765\u5efa\u7acb\u4fe1\u5fc3\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u60f3\u5165\u884c\uff0c\u4f46\u4e2a\u4eba\u80fd\u529b\u8fdc\u8fdc\u4e0d\u591f\uff0c\u65c1\u767d\u76f4\u63a5\u627e\u4e0d\u5230\u611f\u89c9\uff0c\u6628\u5929\u556a\u620f\u6211\u76f4\u63a5\u8499\u8499\u54d2\uff01\u201d > \u201c\u4e4b\u524d\u559c\u9a6c\u62c9\u96c5\u7684\u6500\u767b\u8ba1\u5212\u6211\u5c31\u53c2\u52a0\u4e86\u3002\u7ed3\u679c\u5929\u5929\u6253\u5361\u7ed5\u53e3\u4ee4\u3002\u6700\u540e\u5b66\u5b8c\u8fd8\u662f\u8499\u8499\u54d2\uff01\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5bf9\u81ea\u8eab\u80fd\u529b\u4ef7\u503c\u7684\u6df1\u5ea6\u6000\u7591\u4e0e\u4e0d\u81ea\u4fe1**\u3002\u4ed6\u6e34\u671b\u83b7\u5f97\u4e13\u4e1a\u8ba4\u53ef\uff08\u201c\u7537\u64ad\uff0c\u8fd9\u4e2a\u884c\u4e1a\u7684\u7a00\u7f3a\u4eba\u624d\u201d\uff09\uff0c\u5e0c\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u7cbe\u6e5b\u6280\u827a\uff08\u5982\u7d2b\u7981\u3001\u5934\u9640\u6e0a\u90a3\u6837\uff09\u6765\u8bc1\u660e\u81ea\u5df1\uff0c\u83b7\u5f97\u884c\u4e1a\u5185\u7684\u5c0a\u91cd\u548c\u5b9e\u73b0\u4e2a\u4eba\u6f5c\u80fd\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6781\u81f4\u7684\u4e13\u4e1a\u80af\u5b9a\u4e0e\u201c\u88ab\u9009\u4e2d\u201d\u7684\u7a00\u7f3a\u611f**\u3002\u4ed6\u9700\u8981\u7684\u4e0d\u662f\u6cdb\u6cdb\u7684\u5938\u5956\uff0c\u800c\u662f\u6765\u81ea\u201c\u5f20\u9707\u8001\u5e08\u5f92\u5f1f\u201d\u8fd9\u79cd\u4e13\u4e1a\u4eba\u58eb\u5bf9\u5176\u58f0\u97f3\u7279\u8d28\u548c\u6f5c\u529b\u7684\u5177\u4f53\u3001\u6743\u5a01\u7684\u8ba4\u53ef\uff0c\u4ee5\u53ca\u201c\u6211\u770b\u4e2d\u7684\u4eba\u201d\u3001\u201c\u4f18\u79c0\u5b66\u5458\u201d\u8fd9\u79cd\u88ab\u7279\u6b8a\u5bf9\u5f85\u7684\u5f52\u5c5e\u611f\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2 \u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u4e25\u91cd\u5185\u8017) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u6682\u65e0\u501f\u8d37\u3001\u5a01\u80c1\u7b49\u6781\u7aef\u4fe1\u53f7\u3002\u4f46**\u5fc3\u7406\u5f39\u6027\u6781\u4f4e**\uff0c\u662f\u9ad8\u98ce\u9669\u9000\u8d39\u4eba\u7fa4\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u5b66\u4e60\u521d\u671f\u9047\u5230\u6280\u672f\u74f6\u9888\uff08\u5982\u8f6f\u4ef6\u64cd\u4f5c\u3001Pia\u620f\u5b9e\u6218\uff09\u65f6\uff0c\u6781\u6613\u56e0\u201c\u5b66\u4e0d\u4f1a\u201d\u7684\u81ea\u5351\u611f\u800c\u653e\u5f03\u3002** |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u4efb\u4f55\u8d1f\u5411\u53cd\u9988\u6216\u5b66\u4e60\u632b\u6298\uff08\u5982\u4f5c\u4e1a\u88ab\u6279\u3001\u8bd5\u97f3\u5931\u8d25\uff09\u90fd\u53ef\u80fd\u76f4\u63a5\u89e6\u53d1\u201c\u6211\u679c\u7136\u4e0d\u884c\u201d\u7684\u5d29\u6e83\uff0c\u5bfc\u81f4\u9000\u8d39\u3002** |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u82e5\u5b66\u4e60\u4e00\u6bb5\u65f6\u95f4\u540e\uff0c\u611f\u89c9\u79bb\u201c\u7d2b\u7981\u3001\u5934\u9640\u6e0a\u201d\u7684\u6c34\u5e73\u4ecd\u9065\u4e0d\u53ef\u53ca\uff0c\u4f1a\u4ea7\u751f\u5de8\u5927\u843d\u5dee\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c1-2\u5468\uff0c\u9996\u6b21\u63d0\u4ea4\u6b63\u5f0f\u4f5c\u4e1a\u6216\u53c2\u4e0e\u5b9e\u6218\u6f14\u7ec3\uff08\u5982Pia\u620f\uff09\u65f6\u3002**\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u5e08\u5144/\u5e08\u59d0\uff0c\u770b\u5230\u4f60\u63d0\u5230\u7d2b\u7981\u548c\u5934\u9640\u6e0a\u8001\u5e08\uff0c\u773c\u5149\u771f\u7684\u5f88\u4e13\u4e1a\uff01\u5f88\u591a\u65b0\u4eba\u53ea\u60f3\u7740\u8d5a\u94b1\uff0c\u4f46\u4f60\u662f\u771f\u7684\u5728\u7422\u78e8\u2018\u620f\u2019\u600e\u4e48\u6f14\uff0c\u8fd9\u79cd\u5bf9\u4e13\u4e1a\u7684\u8ffd\u6c42\u7279\u522b\u96be\u5f97\u3002\u522b\u62c5\u5fc3\u2018\u8499\u8499\u54d2\u2019\uff0c\u5f20\u9707\u8001\u5e08\u8fd9\u5957\u65b9\u6cd5\u5c31\u662f\u4e13\u95e8\u89e3\u51b3\u8fd9\u4e2a\u7684\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u6b65\u6765\uff0c\u6211\u966a\u7740\u4f60\u628a\u6bcf\u4e2a\u2018\u611f\u89c9\u2019\u90fd\u6293\u5230\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011** - \u6ee1\u8db3\u5176\u5bf9\u4e13\u4e1a\u7cbe\u8fdb\u7684\u6838\u5fc3\u8bc9\u6c42\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u5fc5\u987b\u5f3a\u70c8\u8865\u5145\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u9488\u5bf9T6\u60c5\u7eea\u5de8\u5a74\uff0c\u9700\u8981\u6ee1\u914d\u7684C\u6a21\u5757\uff08\u60c5\u7eea\u4fdd\u59c6\u4e0e\u4f34\u98de\u6c60\uff09\u3002\u5728\u7ed9\u4e88B\u6a21\u5757\uff08\u4e13\u4e1a\u70b9\u8bc4\uff09\u7684\u540c\u65f6\uff0c\u5fc5\u987b\u7528\u5938\u5f20\u7684\u8d5e\u7f8e\u548c\u201c\u624b\u628a\u624b\u201d\u7684\u966a\u4f34\u6765\u5bf9\u51b2\u5176\u81ea\u5351\u611f\u3002**\u4e25\u7981**\u5728\u5176\u672a\u5efa\u7acb\u4fe1\u5fc3\u524d\uff0c\u65bd\u52a0\u8fc7\u9ad8\u7684\u4f5c\u4e1a\u538b\u529b\u6216\u8fdb\u884c\u4ea4\u53c9\u63a8\u9500\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u5728\u4ed6\u8868\u8fbe\u201c\u5b66\u4e0d\u4f1a\u201d\u3001\u201c\u6ca1\u611f\u89c9\u201d\u65f6\uff0c\u7528\u201c\u591a\u7ec3\u7ec3\u5c31\u4f1a\u4e86\u201d\u7b49\u6577\u884d\u8bdd\u672f\u56de\u5e94\u30022. \u5728\u5176\u4f5c\u4e1a\u4e2d\u7ed9\u4e88\u8fc7\u4e8e\u4e25\u5389\u6216\u6a21\u7cca\u7684\u6279\u8bc4\u30023. \u8fc7\u65e9\u63d0\u53ca\u201c\u63a5\u5355\u8d5a\u94b1\u201d\uff0c\u8fd9\u4f1a\u52a0\u5267\u5176\u201c\u80fd\u529b\u4e0d\u8db3\u65e0\u6cd5\u53d8\u73b0\u201d\u7684\u7126\u8651\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u521d\u671f\u8fdb\u884c\u4efb\u4f55\u5347\u5355**\u3002\u5fc5\u987b\u5148\u901a\u8fc7\u5927\u91cfC\u6a21\u5757\uff08\u60c5\u7eea\u4ef7\u503c\uff09\u548c\u7cbe\u51c6\u7684B\u6a21\u5757\uff08\u5c0f\u6210\u5c31\u53cd\u9988\uff09\u5e2e\u52a9\u5176\u5efa\u7acb\u7a33\u56fa\u7684\u5b66\u4e60\u4fe1\u5fc3\u548c\u201c\u6211\u80fd\u884c\u201d\u7684\u81ea\u6211\u8ba4\u77e5\u540e\uff0c\u518d\u8003\u8651\u5f15\u5bfc\u5347\u5355\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u60f3\u5165\u884c\uff0c\u4f46\u4e2a\u4eba\u80fd\u529b\u8fdc\u8fdc\u4e0d\u591f\uff0c\u65c1\u767d\u76f4\u63a5\u627e\u4e0d\u5230\u611f\u89c9\uff0c\u6628\u5929\u556a\u620f\u6211\u76f4\u63a5\u8499\u8499\u54d2\uff01\u201d\n2. > \u201c\u4e4b\u524d\u559c\u9a6c\u62c9\u96c5\u7684\u6500\u767b\u8ba1\u5212\u6211\u5c31\u53c2\u52a0\u4e86\u3002\u7ed3\u679c\u5929\u5929\u6253\u5361\u7ed5\u53e3\u4ee4\u3002\u6700\u540e\u5b66\u5b8c\u8fd8\u662f\u8499\u8499\u54d2\uff01\u201d\n3. > \u201c\u611f\u89c9\u81ea\u5df1\u7684\u58f0\u97f3\u5dee\u592a\u8fdc\u3002[\u6109\u5feb]\u201d (\u7528\u6109\u5feb\u8868\u60c5\u63a9\u9970\u6df1\u5ea6\u81ea\u5351)\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u4e13\u4e1a\u5c0a\u91cd\u4e0e\u81ea\u6211\u5b9e\u73b0\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7528\u6ee1\u914d\u7684\u201c\u60c5\u7eea\u4fdd\u59c6+\u7cbe\u51c6\u4e13\u4e1a\u80af\u5b9a\u201d\u7ec4\u5408\u62f3\uff0c\u5728\u5176\u6bcf\u6b21\u81ea\u6211\u6000\u7591\u65f6\u53ca\u65f6\u5e72\u9884\uff0c\u7528\u201c\u5c0f\u80dc\u201d\u79ef\u7d2f\u4fe1\u5fc3\uff0c\u4e25\u9632\u7b2c\u4e00\u6b21\u5b9e\u6218\u632b\u6298\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5c0a\u91cd/\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf + \u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u7537\", \"city\": \"\u672a\u77e5\"}\n```";
