    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a (UID: 676960245)\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n*   **\u52a8\u673a\u7eaf\u5ea6 (\u4e2d\u9ad8)**: \u5174\u8da3\u9a71\u52a8\u4e0e\u4f53\u9a8c\u9a71\u52a8\u4e3a\u4e3b\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u5bf9\u6b66\u4fa0\u9898\u6750\u7684\u504f\u597d\uff08\u201c\u5982\u679c\u6709\u76f8\u5173\u6b66\u4fa0\u5267\u7ec4\uff0c\u6211\u80af\u5b9a\u62a5\u540d\u201d\uff09\uff0c\u5e76\u79ef\u6781\u53c2\u4e0e\u201c\u6709\u58f0\u4e4b\u591c\u201d\u6d3b\u52a8\uff0c\u4e3b\u52a8\u62c5\u4efb\u7ec4\u957f\u3001\u521b\u4f5c\u5267\u672c\u3001\u7ec4\u7ec7\u534f\u8c03\u3002\u5176\u52a8\u673a\u5305\u542b\u201c\u5168\u6d3b\u4f53\u9a8c\u201d\uff08\u201c\u6211\u662f\u5954\u7740\u5168\u6d3b\u4f53\u9a8c\u6765\u7684\u201d\uff09\u548c\u6280\u80fd\u63a2\u7d22\uff0c\u800c\u975e\u5355\u4e00\u7684\u53d8\u73b0\u7126\u8651\u6216\u901f\u6210\u5e7b\u60f3\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (\u4e2d\u7b49)**: \u5177\u5907\u57fa\u7840\u5b66\u4e60\u6295\u5165\u80fd\u529b\u4e0e\u65f6\u95f4\u3002\u7528\u6237\u8d2d\u4e70\u4e86\u540e\u671f\u526a\u8f91\u8bfe\u7a0b\uff08\u8ffd\u52a0\u4ed8\u8d39\uff09\uff0c\u8868\u660e\u6709\u8fdb\u4e00\u6b65\u6295\u5165\u7684\u610f\u613f\u548c\u7ecf\u6d4e\u57fa\u7840\u3002\u80fd\u6295\u5165\u65f6\u95f4\u53c2\u4e0e\u5c0f\u7ec4\u6d3b\u52a8\u3001\u8c03\u8bd5\u8bbe\u5907\u3001\u5b8c\u6210\u4f5c\u4e1a\uff0c\u4f46\u63d0\u53ca\u201c\u4e0a\u73ed\u90fd\u6ca1\u8fd9\u4e48\u7d2f\u201d\uff0c\u6697\u793a\u65f6\u95f4\u7cbe\u529b\u5b58\u5728\u4e00\u5b9a\u9650\u5236\uff0c\u9700\u5e73\u8861\u5de5\u4f5c\u4e0e\u5b66\u4e60\u3002\n*   **\u5fc3\u7406\u5f39\u6027 (\u9ad8)**: \u4e3b\u52a8\u6027\u3001\u534f\u4f5c\u6027\u4e0e\u9002\u5e94\u6027\u6781\u5f3a\u3002\u7528\u6237\u5c55\u73b0\u51fa**\u7a81\u51fa\u7684\u9886\u5bfc\u529b\u4e0e\u7ec4\u7ec7\u80fd\u529b**\uff1a\u4e3b\u52a8\u53d1\u8d77\u7ec4\u961f\u3001\u521b\u4f5c\u5267\u672c\uff08\u4f7f\u7528AI\u5de5\u5177\uff09\u3001\u534f\u8c03\u7ec4\u5458\u3001\u5b89\u6392\u4f1a\u8bae\u3002\u9762\u5bf9\u56f0\u96be\uff08\u5982AU\u8f6f\u4ef6\u95ee\u9898\u3001\u7ec4\u961f\u4e0d\u786e\u5b9a\u6027\uff09\u80fd\u4e3b\u52a8\u5c1d\u8bd5\u89e3\u51b3\u5e76\u4fdd\u6301\u79ef\u6781\u5fc3\u6001\uff08\u201c\u4e07\u4e8b\u5f00\u5934\u96be...\u6700\u8d77\u7801\u8fd8\u662f\u8981\u4ea4\u4e2a\u4f5c\u54c1\u624d\u884c\u54df\u201d\uff09\u3002\u6c9f\u901a\u98ce\u683c\u79ef\u6781\u3001\u5305\u5bb9\u3001\u9f13\u52b1\u5171\u521b\uff08\u201c\u5927\u5bb6\u6709\u4efb\u4f55\u60f3\u6cd5\u6216\u8005\u610f\u89c1\uff0c\u968f\u65f6\u4ea4\u6d41\u201d\uff09\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\n*   **\u6b65\u9aa40 \u652f\u4ed8\u6838\u67e5**: \u5df2\u652f\u4ed8\u57fa\u7840\u8bfe\u7a0b\u8d39\u7528\uff08\u5904\u4e8e\u5b66\u4e60\u8425\u671f\uff09\uff0c\u5e76\u5df2\u8ffd\u52a0\u652f\u4ed8\u540e\u671f\u526a\u8f91\u8bfe\u7a0b\u8d39\u7528\uff0893\u671f\uff09\u3002**\u652f\u4ed8\u610f\u613f\u4e0e\u884c\u52a8\u5df2\u9a8c\u8bc1**\u3002\n*   **\u6b65\u9aa41.5 \u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5**: \u804a\u5929\u8bb0\u5f55\u4e2d**\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u6216\u7b2c\u4e09\u65b9\u51b3\u7b56\u4fe1\u606f**\u3002\u7528\u6237\u884c\u4e3a\u8868\u73b0\u51fa\u9ad8\u5ea6\u7684\u81ea\u4e3b\u51b3\u7b56\u6743\uff08\u81ea\u4e3b\u62a5\u540d\u3001\u8ffd\u52a0\u4ed8\u8d39\u3001\u5b89\u6392\u5b66\u4e60\u6d3b\u52a8\uff09\u3002\n*   **\u6700\u7ec8\u5224\u5b9a**: **B\u7c7b\u7528\u6237 (\u9ad8\u610f\u613f-\u4e2d\u9ad8\u884c\u52a8\u529b)**\u3002\u7528\u6237\u5b66\u4e60\u610f\u613f\u660e\u786e\uff0c\u884c\u52a8\u529b\u5f3a\uff08\u4e3b\u52a8\u53c2\u4e0e\u3001\u7ec4\u7ec7\u3001\u52a0\u8d2d\u8bfe\u7a0b\uff09\uff0c\u4e14\u51b3\u7b56\u81ea\u4e3b\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n*   **\u5339\u914d\u539f\u578b: T3 \u63a2\u7d22\u5b9e\u8df5\u8005**\u3002\n    *   \u7279\u5f81\u543b\u5408\uff1a\u4ee5\u5174\u8da3\u548c\u6280\u80fd\u63a2\u7d22\u4e3a\u6838\u5fc3\u52a8\u673a\uff0c\u4e50\u4e8e\u5b9e\u8df5\u548c\u53c2\u4e0e\uff08\u201c\u8d35\u5728\u53c2\u4e0e\uff0c\u6765\u90fd\u6765\u4e86\uff0c\u603b\u5f97\u8bd5\u8bd5\u201d\uff09\uff0c\u5177\u5907\u8f83\u5f3a\u7684\u81ea\u4e3b\u5b66\u4e60\u80fd\u529b\u548c\u9879\u76ee\u63a8\u52a8\u529b\uff08\u7ec4\u7ec7\u5c0f\u7ec4\u6d3b\u52a8\uff09\uff0c\u5bf9\u8bfe\u7a0b\u5185\u5bb9\u6709\u5b9e\u64cd\u6027\u9700\u6c42\uff08\u8be2\u95ee\u8bbe\u5907\u3001\u540e\u671f\uff09\uff0c\u5e76\u613f\u610f\u4e3a\u6df1\u5316\u6280\u80fd\u4ed8\u8d39\uff08\u52a0\u8d2d\u540e\u671f\u8bfe\uff09\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30 (\u6781\u4f4e)\n*   **\u6839\u56e0\u9010\u9879\u6392\u67e5**:\n    1.  **\u9884\u671f\u7ba1\u7406\u504f\u5dee**: \u98ce\u9669\u6781\u4f4e\u3002\u7528\u6237\u5bf9\u5b66\u4e60\u8fc7\u7a0b\u7684\u8017\u65f6\u8017\u529b\u6709\u6e05\u6670\u8ba4\u77e5\uff08\u201c\u90fd\u5dee\u70b9\u4e3a\u4e86\u6709\u58f0\u4e66\u8981\u71ac\u591c\u4e86\u201d\uff09\uff0c\u4e14\u76ee\u6807\u4e3a\u201c\u4f53\u9a8c\u201d\u548c\u6280\u80fd\u63d0\u5347\uff0c\u975e\u4e0d\u5207\u5b9e\u9645\u7684\u901f\u6210\u53d8\u73b0\u3002\n    2.  **\u6548\u679c\u611f\u77e5\u843d\u5dee**: \u98ce\u9669\u6781\u4f4e\u3002\u7528\u6237\u6b63\u901a\u8fc7\u79ef\u6781\u53c2\u4e0e\u6d3b\u52a8\uff08\u6709\u58f0\u4e4b\u591c\uff09\u548c\u52a0\u8d2d\u8bfe\u7a0b\uff08\u540e\u671f\u526a\u8f91\uff09\u4e3b\u52a8\u6784\u5efa\u5b66\u4e60\u6210\u679c\u548c\u6b63\u5411\u53cd\u9988\u3002\n    3.  **\u7ecf\u6d4e\u538b\u529b\u89e6\u53d1**: \u98ce\u9669\u6781\u4f4e\u3002\u5df2\u8ffd\u52a0\u4ed8\u8d39\uff0c\u672a\u63d0\u53ca\u4efb\u4f55\u7ecf\u6d4e\u538b\u529b\u3002\n    4.  **\u5bb6\u5ead/\u73af\u5883\u963b\u529b**: \u98ce\u9669\u4f4e\u3002\u8bb0\u5f55\u4e2d\u65e0\u76f8\u5173\u8ff9\u8c61\uff0c\u7528\u6237\u8868\u73b0\u51fa\u9ad8\u5ea6\u81ea\u4e3b\u6027\u3002\n    5.  **\u5b66\u4e60\u4f53\u9a8c\u65ad\u88c2**: \u98ce\u9669\u4f4e\u3002\u7528\u6237\u4e0e\u73ed\u4e3b\u4efb\u3001\u540c\u5b66\u4e92\u52a8\u9891\u7e41\uff0c\u5df2\u878d\u5165\u5b66\u4e60\u793e\u7fa4\u5e76\u62c5\u4efb\u7ec4\u7ec7\u8005\u89d2\u8272\u3002\n    6.  **\u9500\u552e\u627f\u8bfa\u672a\u5151**: \u98ce\u9669\u6781\u4f4e\u3002\u8bb0\u5f55\u4e2d\u9500\u552e\uff08\u73ed\u73ed\uff09\u6c9f\u901a\u4ee5\u670d\u52a1\u3001\u901a\u77e5\u3001\u7b54\u7591\u4e3a\u4e3b\uff0c\u65e0\u8fc7\u5ea6\u627f\u8bfa\u8ff9\u8c61\u3002\n    7.  **\u4ea7\u54c1\u8d28\u91cf\u95ee\u9898**: \u98ce\u9669\u4f4e\u3002\u7528\u6237\u9047\u5230\u6280\u672f\u95ee\u9898\uff08AU\u8bbe\u7f6e\uff09\u80fd\u81ea\u884c\u89e3\u51b3\uff0c\u672a\u62b1\u6028\u8bfe\u7a0b\u8d28\u91cf\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n*   **\u65e0\u663e\u8457\u98ce\u9669**\u3002\u9500\u552e\u6c9f\u901a\u5185\u5bb9\u4e3b\u8981\u4e3a\u8bfe\u7a0b\u63d0\u9192\u3001\u6d3b\u52a8\u901a\u77e5\u3001\u95ee\u9898\u89e3\u7b54\u53ca\u9f13\u52b1\u3002\u5728\u7528\u6237\u8be2\u95ee\u540e\u671f\u8bfe\u7a0b\u65f6\uff0c\u56de\u590d\u201c\u540e\u671f\u7684\u5c5e\u4e8e\u7406\u79d1\u751f\uff0c\u53ef\u80fd\u6ca1\u6709\u73ed\u73ed\u8fd9\u4e48\u7ec6\u5fc3\u7684\uff0c\u8fd9\u4e2a\u5f97\u6709\u5fc3\u7406\u51c6\u5907\u54e6\u201d\uff0c**\u8fdb\u884c\u4e86\u9002\u5f53\u7684\u9884\u671f\u7ba1\u7406**\uff0c\u672a\u53d1\u73b0\u5938\u5927\u3001\u6b3a\u9a97\u6216\u8bf1\u5bfc\u6027\u8bdd\u672f\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n*   **\u4ea7\u54c1\u5339\u914d**: **\u9ad8\u5ea6\u5339\u914d**\u3002\u7528\u6237\u5df2\u4ece\u6f14\u64ad\u8bfe\u7a0b\u81ea\u7136\u8fc7\u6e21\u81f3\u540e\u671f\u526a\u8f91\u8bfe\u7a0b\uff0c\u5b66\u4e60\u8def\u5f84\u7b26\u5408\u201c\u63a2\u7d22\u5b9e\u8df5\u8005\u201d\u7684\u6280\u80fd\u62d3\u5c55\u9700\u6c42\u3002\n*   **\u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357**:\n    *   **\u6838\u5fc3\u52a8\u4f5c**: **\u8d4b\u80fd\u652f\u6301\uff0c\u63d0\u4f9b\u8d44\u6e90\u8fde\u63a5**\u3002\u8ba4\u53ef\u5e76\u652f\u6301\u5176\u7ec4\u957f\u89d2\u8272\uff0c\u4e3a\u5176\u5c0f\u7ec4\u6d3b\u52a8\u63d0\u4f9b\u5fc5\u8981\u7684\u4f1a\u8bae\u3001\u8d44\u6e90\u534f\u8c03\u4fbf\u5229\u3002\n    *   **\u670d\u52a1\u91cd\u70b9**:\n        1.  **\u8d44\u6e90\u5bf9\u63a5**: \u5728\u5176\u7ec4\u7ec7\u201c\u6709\u58f0\u4e4b\u591c\u201d\u6d3b\u52a8\u65f6\uff0c\u53ca\u65f6\u63d0\u4f9b\u4f1a\u8bae\u652f\u6301\u3001\u89c4\u5219\u89e3\u7b54\uff0c\u5e76\u5173\u6ce8\u5176\u5c0f\u7ec4\u8fdb\u5c55\u3002\n        2.  **\u6df1\u5ea6\u9700\u6c42\u6316\u6398**: \u7528\u6237\u8868\u73b0\u51fa\u5bf9\u540e\u671f\u5236\u4f5c\u7684\u5174\u8da3\u548c\u6295\u5165\uff0c\u53ef\u9002\u65f6\u4ecb\u7ecd\u66f4\u8fdb\u9636\u7684\u5b9e\u6218\u9879\u76ee\u3001\u63a5\u5355\u6e20\u9053\u6216\u4f18\u79c0\u5b66\u5458\u6848\u4f8b\uff0c\u6ee1\u8db3\u5176\u6280\u80fd\u5e94\u7528\u548c\u63a2\u7d22\u7684\u6df1\u5c42\u9700\u6c42\u3002\n        3.  **\u6b63\u5411\u53cd\u9988\u5f3a\u5316**: \u516c\u5f00\u8868\u626c\u5176\u7ec4\u7ec7\u80fd\u529b\u548c\u8d21\u732e\uff0c\u5c06\u5176\u6811\u7acb\u4e3a\u73ed\u7ea7\u79ef\u6781\u5178\u578b\uff0c\u589e\u5f3a\u5176\u5f52\u5c5e\u611f\u4e0e\u6210\u5c31\u611f\u3002\n        4.  **\u7cbe\u529b\u7ba1\u7406\u63d0\u9192**: \u9002\u65f6\u63d0\u9192\u6ce8\u610f\u5b66\u4e60\u8282\u594f\uff0c\u907f\u514d\u56e0\u70ed\u60c5\u8fc7\u9ad8\u5bfc\u81f4\u5026\u6020\uff08\u7528\u6237\u5df2\u63d0\u53ca\u201c\u7d2f\u201d\uff09\uff0c\u786e\u4fdd\u957f\u671f\u5b66\u4e60\u4f53\u9a8c\u3002\n\n{\"core_type\": \"T3 \u63a2\u7d22\u5b9e\u8df5\u8005\", \"risk_level\": \"\u6781\u4f4e\", \"refund_risk\": \"\u6781\u4f4e\", \"product_match\": \"\u9ad8\u5ea6\u5339\u914d\", \"action\": \"\u8d4b\u80fd\u652f\u6301\uff0c\u63d0\u4f9b\u8d44\u6e90\u8fde\u63a5\"}";
