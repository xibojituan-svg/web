    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.2.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9UID\uff1a677168562\u7684\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID\uff1a677168562 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-12 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u9500\u552e - \u6668\u516e\u5e08\u59d0/\u851a\u84dd2(\u8096\u96ef\u99a8) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u4f53\u9a8c\u8425 \u2192 \u6b63\u4ef7\u8bfe\u7a0b\uff082380\u5143\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u5b58\u5728\u501f\u8d37\u9690\u60a3\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u63d0\u53ca\u201c\u6211\u628a\u5b69\u5b50\u54c4\u7761\uff0c\u5c31\u8865\u201d\uff0c\u8868\u660e\u662f\u5b9d\u5988\uff0c\u5b66\u4e60\u65f6\u95f4\u53d7\u5bb6\u5ead\u4e8b\u52a1\u6324\u538b\uff0c\u5448\u73b0\u5178\u578b\u7684\u788e\u7247\u5316\u7279\u5f81\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u63d0\u53ca\u5bb6\u4eba\u6001\u5ea6\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e25\u91cd\u7f3a\u5931\uff08\u964d\u7ea7\u7f6e\u4fe1\u5ea6\uff09**\u3002\u7528\u6237\u53d1\u8a00\u6781\u5c11\uff08\u51719\u6761\uff09\uff0c\u591a\u4e3a\u7b80\u77ed\u56de\u5e94\uff0c\u7f3a\u4e4f\u5173\u4e8e\u52a8\u673a\u3001\u80cc\u666f\u3001\u60c5\u7eea\u3001\u8d44\u6e90\u7684\u6df1\u5ea6\u81ea\u8ff0\uff0c\u5224\u65ad\u4e3b\u8981\u57fa\u4e8e\u884c\u4e3a\u6a21\u5f0f\u63a8\u65ad\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d**\n- **\u7279\u5f81\u901f\u5199**\uff1a**\u6df7\u6742\u8bd5\u6c34(\u4e2d)**\u3002\u7528\u6237\u5b8c\u6210\u4e86\u6240\u6709\u6307\u5b9a\u52a8\u4f5c\uff08\u7f6e\u9876\u3001\u9884\u7ea6\u3001\u63d0\u4ea4\u4f5c\u4e1a\u3001\u9886\u53d6\u53e3\u4ee4\uff09\uff0c\u8868\u73b0\u51fa\u8f83\u5f3a\u7684\u914d\u5408\u5ea6\u4e0e\u5b66\u4e60\u610f\u613f\u3002\u4f46\u5168\u7a0b\u672a\u4e3b\u52a8\u8ffd\u95ee\u53d8\u73b0\u7ec6\u8282\u6216\u8868\u8fbe\u5f3a\u70c8\u7684\u641e\u94b1\u6b32\u671b\uff0c\u52a8\u673a\u66f4\u504f\u5411\u4e8e\u201c\u5c1d\u8bd5\u5b66\u4e60\u4e00\u9879\u65b0\u6280\u80fd\u201d\u6216\u201c\u63a2\u7d22\u526f\u4e1a\u53ef\u80fd\u6027\u201d\uff0c\u800c\u975e\u7eaf\u7cb9\u7684\u201c\u51e0\u5929\u5185\u63d0\u73b0\u4fdd\u5e95\u201d\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u597d\u7684\u201d\u3001\u201c\u6536\u5230\u201d\u3001\u201c\u5df2\u53d1\u201d\u3001\u201c\u6211\u628a\u5b69\u5b50\u54c4\u7761\uff0c\u5c31\u8865\u201d\u3002\uff08\u5747\u4e3a\u914d\u5408\u6307\u4ee4\u7684\u56de\u5e94\uff0c\u65e0\u4e3b\u52a8\u52a8\u673a\u8868\u8fbe\uff09\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u2b07\u4f4e** \u2014 \u201c\u6211\u628a\u5b69\u5b50\u54c4\u7761\uff0c\u5c31\u8865\u201d\u662f\u5178\u578b\u5b9d\u5988\u65f6\u95f4\u788e\u7247\u5316\u4fe1\u53f7\uff0c\u7cbe\u529b\u88ab\u80b2\u513f\u5927\u91cf\u5360\u7528\uff0c\u5b66\u4e60\u65f6\u95f4\u9700\u201c\u62fc\u51d1\u201d\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u4e0d\u8db3** \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u27a1\u4e2d**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u9700\u95f4\u6b47\u6027\u5b89\u629a(\u4e2d)**\u3002\u7528\u6237\u5728\u9047\u5230\u56f0\u96be\uff08\u201c\u54ac\u6587\u6709\u4e9b\u56f0\u96be\u201d\u3001\u201c\u8bfb\u5b8c\u611f\u89c9\u6ca1\u6709\u90a3\u4e48\u6709\u753b\u9762\u611f\u201d\uff09\u65f6\uff0c\u4f1a\u4e3b\u52a8\u5411\u9500\u552e\u6c42\u52a9\uff0c\u8868\u73b0\u51fa\u4e00\u5b9a\u7684\u4f9d\u8d56\u3002\u4f46\u6c42\u52a9\u540e\u80fd\u63a5\u53d7\u6307\u5bfc\u5e76\u7ee7\u7eed\u5b8c\u6210\u4efb\u52a1\uff0c\u672a\u51fa\u73b0\u5d29\u6e83\u3001\u653e\u5f03\u6216\u62b1\u6028\u7684\u6781\u7aef\u60c5\u7eea\u4fe1\u53f7\uff0c\u5177\u5907\u57fa\u672c\u7684\u6297\u632b\u6298\u548c\u6062\u590d\u80fd\u529b\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5728\u8bfb\u6587\u662f\u611f\u89c9\u81ea\u5df1\u54ac\u6587\u6709\u4e9b\u56f0\u96be\u201d\u3001\u201c\u8bfb\u5b8c\u611f\u89c9\u6ca1\u6709\u90a3\u4e48\u6709\u753b\u9762\u611f\u201d\u3002\uff08\u4e3b\u52a8\u66b4\u9732\u95ee\u9898\uff0c\u5bfb\u6c42\u5e2e\u52a9\uff0c\u4f46\u8bed\u6c14\u5e73\u548c\uff09\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ **\u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u966a\u4f34** ] \u4e0e [ **\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42** ] \u7684\u590d\u5408\u4f53\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u65f6\u95f4\u7834\u788e\u4e0e\u6280\u80fd\u4e0d\u81ea\u4fe1**\u3002\u4f5c\u4e3a\u5b9d\u5988\uff0c\u5979\u7684\u65f6\u95f4\u88ab\u4e25\u91cd\u5207\u5272\uff0c\u540c\u65f6\u5728\u5b66\u4e60\u65b0\u6280\u80fd\u65f6\u8868\u73b0\u51fa\u5bf9\u81ea\u6211\u8868\u73b0\uff08\u753b\u9762\u611f\u3001\u54ac\u5b57\uff09\u7684\u62c5\u5fe7\uff0c\u8fd9\u80cc\u540e\u662f\u5bf9\u201c\u80fd\u5426\u517c\u987e\u5bb6\u5ead\u4e0e\u81ea\u6211\u6210\u957f\u201d\u7684\u4e0d\u5b89\u5168\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u201d\u7684\u966a\u4f34\u611f\u4e0e\u201c\u80fd\u5b66\u4f1a\u201d\u7684\u786e\u5b9a\u611f**\u3002\u5979\u9700\u8981\u7684\u4e0d\u53ea\u662f\u6280\u80fd\u6559\u5b66\uff0c\u66f4\u662f\u4e00\u4e2a\u80fd\u7406\u89e3\u5979\u65f6\u95f4\u56f0\u5883\u3001\u5728\u5979\u6c42\u52a9\u65f6\u80fd\u53ca\u65f6\u7ed9\u4e88\u660e\u786e\u6307\u5bfc\u3001\u5e76\u80af\u5b9a\u5979\u5fae\u5c0f\u8fdb\u6b65\u7684\u201c\u7ebf\u4e0a\u966a\u4f34\u8005\u201d\u3002\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u6267\u884c\u7684\u6b65\u9aa4\u548c\u53ca\u65f6\u7684\u6b63\u9762\u53cd\u9988\uff0c\u80fd\u6781\u5927\u6ee1\u8db3\u5176\u5b89\u5168\u4e0e\u5f52\u5c5e\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1\u7c7b** (\u5174\u8da3\u6d88\u8d39\u578b\uff0c\u517c\u987e\u90e8\u5206C2\u98ce\u9669\u7ba1\u63a7\u7279\u5f81) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T5 \u597d\u73a9\u5c1d\u9c9c\u8005** (\u5174\u8da3\u805a\u7126\u53d8\u4f53) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u7b49\u4fe1\u53f7\u3002\n\n**\u3010\u5224\u5b9a\u6811\u63a8\u6f14\u3011**\uff1a\n1.  **\u652f\u4ed8\u6838\u67e5**\uff1a\u65e0\u652f\u4ed8\u6570\u636e\uff0c\u8df3\u8fc7\u3002\n2.  **\u4e09\u8f74\u8bc4\u5206**\uff1a\u52a8\u673a\u7eaf\u5ea6(5-6\u5206\uff0c\u4e2d)\u3001\u8d44\u6e90\u5e95\u5ea7(3-4\u5206\uff0c\u4f4e\uff0c\u65f6\u95f4\u788e\u7247\u5316)\u3001\u5fc3\u7406\u5f39\u6027(5-6\u5206\uff0c\u4e2d)\u3002\n3.  **\u5224\u5b9a\u6811\u5339\u914d**\uff1a\u52a8\u673a\u7eaf\u5ea65-6\u5206\uff0c\u8d44\u6e90\u5e95\u5ea7\u22644\uff0c\u7b26\u5408\u201c\u4e2d\u7b49\u5f39\u6027\u901a\u9053\u201d\u4e2d`T4 \u641e\u94b1\u7ed3\u679c\u8bba`\u7684\u89e6\u53d1\u6761\u4ef6\u3002\u4f46\u7528\u6237**\u5e76\u672a\u51fa\u73b0\u201c\u591a\u4e45\u80fd\u8d5a\u94b1/\u6709\u5408\u540c\u5417\u201d\u7b49\u9ad8\u9891\u53d8\u73b0\u8ffd\u95ee**\uff0c\u53cd\u800c\u8868\u73b0\u51fa\u5bf9\u6280\u80fd\u672c\u8eab\u7684\u5173\u6ce8\uff08\u54ac\u5b57\u3001\u753b\u9762\u611f\uff09\u3002\u56e0\u6b64\u66f4\u7b26\u5408\u540c\u4e00\u901a\u9053\u4e0b\u65b0\u589e\u7684**\u201c\u5174\u8da3\u805a\u7126\u578b\u89c2\u671b\u8005\u201d**\u573a\u666f\uff1a\u52a8\u673a5-6\uff0c\u8d44\u6e905-7\uff0c\u65e0\u660e\u786e\u53d8\u73b0\u8ffd\u95ee\uff0c\u53d1\u8a00\u805a\u7126\u7279\u5b9a\u5174\u8da3\u65b9\u5411\uff08\u7528\u6237\u5173\u6ce8\u201c\u54ac\u5b57\u201d\u3001\u201c\u753b\u9762\u611f\u201d\u7b49\u6f14\u64ad\u6280\u5de7\uff09\u3002\u6545\u5224\u5b9a\u4e3a **T5 \u597d\u73a9\u5c1d\u9c9c\u8005\uff08\u5174\u8da3\u805a\u7126\u53d8\u4f53\uff09**\u3002\n4.  **ABCD\u6620\u5c04**\uff1aT5 \u2192 C1\u7c7b\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u4f5c\u4e3a\u5b9d\u5988\uff0c\u82e5\u56e0\u7167\u987e\u5b69\u5b50\u4e25\u91cd\u6324\u5360\u5b66\u4e60\u65f6\u95f4\uff0c\u6216\u5bb6\u4eba\u53cd\u5bf9\u5176\u201c\u4e0d\u52a1\u6b63\u4e1a\u201d\uff0c\u53ef\u80fd\u4ea7\u751f\u538b\u529b\u6027\u9000\u8d39\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u3010\u6838\u5fc3\u98ce\u9669\u3011** \u788e\u7247\u5316\u65f6\u95f4\u5bfc\u81f4\u65e0\u6cd5\u8ddf\u4e0a\u76f4\u64ad\u3001\u4f5c\u4e1a\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u6389\u961f\u201d\u7684\u7126\u8651\u548c\u81ea\u8d23\uff0c\u6700\u7ec8\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u76ee\u524d\u8868\u73b0\u51fa\u6c42\u52a9\u610f\u613f\uff0c\u4f46\u672a\u8fbe\u5d29\u6e83\u7ea7\u522b\u3002\u82e5\u540e\u7eed\u4f5c\u4e1a\u591a\u6b21\u88ab\u62d2\u6216\u5f97\u4e0d\u5230\u53ca\u65f6\u53cd\u9988\uff0c\u53ef\u80fd\u5347\u7ea7\u4e3a\u81ea\u6211\u6000\u7591\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4e2d** | \u82e5\u5b66\u4e60\u4e00\u6bb5\u65f6\u95f4\u540e\uff0c\u53d1\u73b0\u63a5\u5355\u53d8\u73b0\u8fdc\u4e0d\u5982\u9884\u671f\uff08\u5c3d\u7ba1\u5f53\u524d\u672a\u5f3a\u70c8\u8ffd\u95ee\uff09\uff0c\u53ef\u80fd\u56e0\u5931\u671b\u800c\u9000\u51fa\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe2-3\u5468\u540e**\u3002\u5f53\u8bfe\u7a0b\u5185\u5bb9\u52a0\u6df1\u3001\u4f5c\u4e1a\u96be\u5ea6\u548c\u9891\u7387\u589e\u52a0\uff0c\u5176\u788e\u7247\u5316\u65f6\u95f4\u65e0\u6cd5\u652f\u6491\u7cfb\u7edf\u5b66\u4e60\u65f6\uff0c\u6781\u6613\u56e0\u201c\u79ef\u538b-\u7126\u8651-\u653e\u5f03\u201d\u7684\u8fde\u9501\u53cd\u5e94\u800c\u5d29\u76d8\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u4eb2\u7231\u7684\uff0c\u770b\u5230\u4f60\u8bf4\u8981\u54c4\u7761\u5b69\u5b50\u624d\u80fd\u5b66\u4e60\uff0c\u592a\u4e0d\u5bb9\u6613\u4e86\uff01\u54b1\u4eec\u8fd9\u4e2a\u73ed\u5f88\u591a\u5b9d\u5988\u5b9d\u7238\uff0c\u65f6\u95f4\u90fd\u50cf\u6d77\u7ef5\u91cc\u6324\u51fa\u6765\u7684\u3002\u522b\u62c5\u5fc3\u8ddf\u4e0d\u4e0a\uff0c\u6211\u4eec\u7684\u8bfe\u7a0b\u548c\u4f5c\u4e1a\u90fd\u652f\u6301\u968f\u65f6\u56de\u770b\u3001\u7075\u6d3b\u63d0\u4ea4\u3002\u4f60\u7684\u6bcf\u4e00\u6b21\u52aa\u529b\u548c\u8fdb\u6b65\uff0c\u6211\u4eec\u90fd\u4f1a\u770b\u5230\u5e76\u7ed9\u4f60\u6700\u5b9e\u5728\u7684\u53cd\u9988\u3002\u6211\u4eec\u4e00\u8d77\u6162\u6162\u6765\uff0c\u628a\u5b66\u4e60\u53d8\u6210\u4f60\u4e13\u5c5e\u7684\u2018\u5145\u7535\u65f6\u95f4\u2019\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u5174\u8da3\u6e38\u4e50\u7ebf\u3011**\u3002\u964d\u4f4e\u786c\u6838\u53d8\u73b0\u538b\u529b\uff0c\u5f3a\u8c03\u58f0\u97f3\u63a2\u7d22\u7684\u4e50\u8da3\u548c\u60c5\u611f\u8868\u8fbe\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176\u65f6\u95f4\u788e\u7247\u5316\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011** \u548c **\u3010\u65f6\u95f4\u7ba1\u7406\u9526\u56ca\u3011**\u3002\u63d0\u4f9b\u201c\u6bcf\u65e515\u5206\u949f\u5fae\u7ec3\u4e60\u201d\u8ba1\u5212\uff0c\u5e76\u5c06\u73ed\u7ea7\u7fa4\u6253\u9020\u4e3a\u5b9d\u5988\u4eec\u7684\u4e92\u52a9\u4ea4\u6d41\u7a7a\u95f4\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u6700\u540e\u540d\u989d\u201d\u3001\u201c\u5012\u8ba1\u65f6\u201d\u7b49\u8bdd\u672f\u5236\u9020\u7126\u8651\uff1b\u5e03\u7f6e\u9700\u8981\u5927\u5757\u8fde\u7eed\u65f6\u95f4\u624d\u80fd\u5b8c\u6210\u7684\u9ad8\u96be\u5ea6\u4f5c\u4e1a\uff1b\u5728\u5979\u56e0\u5b69\u5b50\u803d\u8bef\u5b66\u4e60\u65f6\u8fdb\u884c\u6279\u8bc4\u6216\u5bf9\u6bd4\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u521d\u671f\u4e25\u7981\u5927\u989d\u5347\u5355\u63a8\u9500\u3002\u53ef\u5148\u5f15\u5bfc\u5b8c\u6210\u4e00\u4e9b\u5c0f\u4f5c\u54c1\u83b7\u5f97\u6210\u5c31\u611f\uff0c\u5f85\u5176\u5efa\u7acb\u7a33\u5b9a\u5b66\u4e60\u8282\u594f\u548c\u81ea\u4fe1\u540e\uff0c\u518d\u5c1d\u8bd5\u63a8\u8350**\u4f4e\u5ba2\u5355\u4ef7\u3001\u9ad8\u60c5\u7eea\u4ef7\u503c\u7684\u8f7b\u4ea4\u4ed8\u4ea7\u54c1**\uff08\u5982\u58f0\u97f3\u76f2\u76d2\u3001\u4e2a\u6027\u5316\u58f0\u97f3\u5b9a\u5236\uff09\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u628a\u5b69\u5b50\u54c4\u7761\uff0c\u5c31\u8865\u201d \u2014\u2014 **\u8d44\u6e90\u5e95\u5ea7\u77ed\u677f\uff08\u65f6\u95f4\u788e\u7247\u5316\uff09\u7684\u6838\u5fc3\u8bc1\u636e**\u3002\n2. > \u201c\u5728\u8bfb\u6587\u662f\u611f\u89c9\u81ea\u5df1\u54ac\u6587\u6709\u4e9b\u56f0\u96be\u201d\u3001\u201c\u8bfb\u5b8c\u611f\u89c9\u6ca1\u6709\u90a3\u4e48\u6709\u753b\u9762\u611f\u201d \u2014\u2014 **\u52a8\u673a\u504f\u5411\u6280\u80fd\u7cbe\u8fdb\u800c\u975e\u7eaf\u53d8\u73b0\uff0c\u4e14\u5177\u5907\u4e3b\u52a8\u6c42\u52a9\u7684\u4e2d\u7b49\u5fc3\u7406\u5f39\u6027**\u3002\n3. > \u201c\u597d\u7684\u201d\u3001\u201c\u6536\u5230\u201d\u3001\u201c\u5df2\u53d1\u201d \u2014\u2014 **\u9ad8\u914d\u5408\u5ea6\u3001\u670d\u4ece\u6307\u4ee4\u7684\u884c\u4e3a\u6a21\u5f0f\uff0c\u662f\u5178\u578b\u7684\u201c\u89c2\u671b-\u5c1d\u8bd5\u201d\u578b\u7528\u6237\u7279\u5f81**\u3002\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T5\u5174\u8da3\u805a\u7126\u578b\u5b9d\u5988\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u7834\u788e\u65f6\u95f4\u91cc\u83b7\u5f97\u966a\u4f34\u4e0e\u81ea\u6211\u6210\u957f\u7684\u786e\u5b9a\u611f\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u504f\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u81f4\u5f39\u6027\u7684\u65f6\u95f4\u5b89\u6392\u3001\u9ad8\u9891\u7ec6\u5fae\u7684\u6b63\u5411\u53cd\u9988\uff0c\u5e76\u5c06\u73ed\u7ea7\u8f6c\u5316\u4e3a\u5b9d\u5988\u4eec\u7684\u7ebf\u4e0a\u4e92\u52a9\u793e\u7fa4\u3011**\u3002\n\n```json\n{\"core_type\": \"T5 \u597d\u73a9\u5c1d\u9c9c\u8005\uff08\u5174\u8da3\u805a\u7126\u53d8\u4f53\uff09\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u793e\u4ea4\u966a\u4f34\u4e0e\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u5174\u8da3\u6e38\u4e50\u7ebf + \u7597\u6108\u966a\u4f34\u8f85\u52a9\u5305\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}\n```";
