    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | \u7c9f\u7396 (UID: 77474900) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-01-12 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u8d1d\u5854\u73ed\u73ed (\u8d75\u8d1d\u797a)\u3001\u8c46\u8c46 (\u607d\u6668)\u3001\u552f\u58f9\u73ed\u73ed (\u4efb\u5ce5) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u77ed\u89c6\u9891\u8bad\u7ec3\u8425 (\u5df2\u7ed3\u4e1a)\u3001AI\u5199\u4f5c\u8bfe (\u5df2\u7ed3\u4e1a)\u3001\u610f\u5411L3\u8fdb\u9636\u8bfe |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u4fe1\u606f\u4e0d\u8db3\uff0c\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1 (\u6709\u672c\u804c\u5de5\u4f5c\uff0c\u665a\u4e0a\u6709\u57f9\u8bad\uff0c\u65f6\u95f4\u7d27\u5f20) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u4e0d\u8db3 |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e2d\u7b49 (\u6709\u5b66\u4e60\u884c\u4e3a\u4e0e\u793e\u4ea4\u4e92\u52a8\uff0c\u4f46\u7f3a\u4e4f\u5bb6\u5ead\u3001\u7ecf\u6d4e\u7b49\u6df1\u5ea6\u4fe1\u606f) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u800c\u6765(\u9ad8)\u3002\u7528\u6237\u660e\u786e\u8868\u793a\u5b66\u4e60\u76ee\u6807\u662f\u201c\u517c\u804c\u526f\u4e1a\u8d5a\u94b1\u201d(\u56de\u590d\u6570\u5b573)\uff0c\u4e14\u5df2\u5728\u5b9e\u9645\u521b\u4f5c\u4e2d\u6295\u5165\uff08\u505a\u5c0f\u8bf4\u6f2b\u5267\u3001\u4f7f\u7528\u5de5\u4f5c\u6d41\u62c6\u89e3\u5206\u955c\uff09\uff0c\u5173\u6ce8\u5546\u5355\u673a\u4f1a\uff0c\u4f46\u5e76\u672a\u8868\u73b0\u51fa\u201c\u51e0\u5929\u5185\u53d8\u73b0\u201d\u7684\u6781\u7aef\u7126\u8651\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u4eec6\u73ed\u6709\u63a5\u5546\u5355\u7684\u4e48\uff0c\u770b\u7740\u6ca1\u52a8\u9759\u5462\u201d\uff1b> \u201c\u60f3\u4e0a\u8bfe \u5355\u7eaf\u5b66\u4e60\u591a\u8f7b\u677e\u201d\uff1b> \u201c\u60f3\u7efc\u5408\u638c\u63e1\uff0c\u505a\u517c\u804c\u526f\u4e1a\u8d5a\u94b1\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a\u4e2d \u2014 \u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\uff0c\u80fd\u53c2\u4e0e\u4ed8\u8d39\u8bfe\u7a0b\uff0c\u4f46\u672a\u8868\u73b0\u51fa\u9ad8\u6d88\u8d39\u80fd\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a\u4e2d \u2014 \u6709\u672c\u804c\u5de5\u4f5c\uff0c\u65f6\u95f4\u788e\u7247\u5316\uff08\u201c\u6700\u8fd1\u592a\u5fd9\u4e86\u201d\u3001\u201c\u5929\u5929\u778e\u5fd9\u201d\uff09\uff0c\u4f46\u80fd\u575a\u6301\u5b8c\u6210\u8bfe\u7a0b\u4f5c\u4e1a\u548c\u53c2\u4e0e\u989d\u5916\u521b\u4f5c\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a\u4fe1\u606f\u4e0d\u8db3 \u2014 \u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9762\u5bf9\u4f5c\u4e1a\u96be\u5ea6\uff08\u201c\u8fd9\u5468\u7684\u4f5c\u4e1a\u591f\u545b\u4e86\u201d\uff09\u80fd\u81ea\u6211\u8c03\u4f83\u5e76\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff08\u8be2\u95ee\u6280\u672f\u95ee\u9898\uff09\uff0c\u9047\u5230\u6bd5\u4e1a\u7126\u8651\uff08\u201c\u8981\u6bd5\u4e1a\u5f00\u59cb\u614c\u4e86\u201d\uff09\u80fd\u5e7d\u9ed8\u5316\u89e3\uff0c\u6574\u4f53\u60c5\u7eea\u7a33\u5b9a\u3001\u79ef\u6781\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u8981\u6bd5\u4e1a\u5f00\u59cb\u614c\u4e86...\u843d\u5dee\u597d\u5927\u201d\uff1b> \u201c\u90a3\u80fd\u70e6\u4e48 \u62ff\u7740\u5c0f\u76ae\u97ad\u50ac\u6211\u4e5f\u80fd\u63a5\u53d7[\u5978\u7b11]\u201d\uff1b> \u201c\u5929\u5929\u778e\u5fd9\uff0c\u4e5f\u4e0d\u77e5\u9053\u6709\u591a\u5c11\u80fd\u6d88\u5316\u5f97\u4e86[\u6342\u8138]\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e / \u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5728\u6280\u80fd\u6210\u957f\u4e0e\u793e\u7fa4\u5f52\u5c5e\u4e2d\u5bfb\u6c42\u4ef7\u503c\u8ba4\u540c\u3002\u5979\u4eab\u53d7\u201c\u5c81\u6708\u9759\u597d\u201d\u7684\u5c0f\u7ec4\u5b66\u4e60\u6c1b\u56f4\uff0c\u5173\u6ce8\u73ed\u7ea7\u52a8\u6001\u548c\u5546\u5355\u673a\u4f1a\uff0c\u5bf9\u201c\u6bd5\u4e1a\u201d\u540e\u7684\u8eab\u4efd\u8f6c\u53d8\uff08\u4ece\u88ab\u7167\u987e\u7684\u5b66\u5458\u5230\u201c\u5351\u5fae\u7684\u4e59\u65b9\u201d\uff09\u611f\u5230\u7126\u8651\uff0c\u672c\u8d28\u662f\u6e34\u671b\u5728\u4e13\u4e1a\u793e\u7fa4\u4e2d\u83b7\u5f97\u8ba4\u53ef\u548c\u6301\u7eed\u6210\u957f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u8d4b\u4e88\u5176\u201c\u5708\u5185\u4eba\u201d\u7684\u5f52\u5c5e\u611f\u4e0e\u201c\u51c6\u4e13\u5bb6\u201d\u7684\u8eab\u4efd\u8ba4\u540c**\u3002\u63d0\u4f9b\u8fdb\u9636\u7684\u5b66\u4e60\u8def\u5f84\uff08\u5982L3\u8bfe\u7a0b\uff09\u3001\u5c06\u5979\u7eb3\u5165\u66f4\u6838\u5fc3\u7684\u521b\u4f5c\u5708\u5b50\uff08\u5982\u5e08\u5144\u5e08\u59d0\u7684\u5de5\u4f5c\u7ec4\uff09\uff0c\u8ba9\u5979\u611f\u5230\u88ab\u9700\u8981\u3001\u88ab\u770b\u89c1\uff0c\u662f\u6301\u7eed\u5b66\u4e60\u548c\u590d\u8d2d\u7684\u5173\u952e\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 B \u7c7b (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T7 \u72c2\u70ed\u6b7b\u5fe0\u7c89** (\u9ad8\u590d\u8d2d\u6f5c) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u96f6\u4e92\u52a8\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u672a\u63d0\u53ca\u5bb6\u5ead\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u7528\u6237\u65f6\u95f4\u7ba1\u7406\u80fd\u529b\u5c1a\u53ef\uff0c\u867d\u5fd9\u4f46\u80fd\u8ddf\u8fdb\uff0c\u4e14\u4e3b\u52a8\u8be2\u95eeL3\u5f00\u8bfe\uff0c\u5b66\u4e60\u610f\u613f\u5f3a\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u5e7d\u9ed8\u5316\u89e3\u538b\u529b\uff0c\u4e0d\u5c5e\u4e8e\u6613\u5d29\u6e83\u7c7b\u578b\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | **\u4e3b\u8981\u98ce\u9669\u70b9**\uff1a\u5bf9\u201c\u63a5\u5546\u5355\u201d\u6709\u660e\u786e\u671f\u5f85\uff0c\u82e5\u957f\u671f\u65e0\u6cd5\u83b7\u5f97\u53d8\u73b0\u673a\u4f1a\u6216\u6210\u5c31\u611f\uff0c\u53ef\u80fd\u56e0\u201c\u6536\u76ca\u843d\u5dee\u201d\u800c\u6d41\u5931\u3002\u9700\u901a\u8fc7\u63d0\u4f9b\u5185\u90e8\u673a\u4f1a\uff08\u5982\u5de5\u4f5c\u7ec4\u3001\u6bd4\u8d5b\uff09\u7ef4\u6301\u5176\u53c2\u4e0e\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u8bfe\u7a0b\u7ed3\u4e1a\u540e1-2\u4e2a\u6708\u5185\u3002\u82e5\u7f3a\u4e4f\u540e\u7eed\u7684\u793e\u7fa4\u8fde\u63a5\u3001\u8fdb\u9636\u5b66\u4e60\u6216\u5b9e\u8df5\u673a\u4f1a\uff0c\u5176\u201c\u6bd5\u4e1a\u5373\u5931\u8054\u201d\u7684\u5931\u843d\u611f\u53ef\u80fd\u8f6c\u5316\u4e3a\u9000\u8d39\u6216\u4e0d\u518d\u590d\u8d2d\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u7c9f\u7396\uff0c\u770b\u5230\u4f60\u5728\u4e94\u671f\u548c\u5c0f\u7ec4\u91cc\u73a9\u5f97\u90a3\u4e48\u2018\u5c81\u6708\u9759\u597d\u2019\uff0c\u8fd8\u60e6\u8bb0\u7740\u5546\u5355\u548cL3\uff0c\u5c31\u77e5\u9053\u4f60\u662f\u771f\u5fc3\u60f3\u5728\u8fd9\u6761\u8def\u4e0a\u8d70\u4e0b\u53bb\u7684\u2018\u81ea\u5df1\u4eba\u2019\u3002\u4ee5\u540e\u6709\u5565\u65b0\u673a\u4f1a\u3001\u65b0\u8d44\u6e90\uff0c\u73ed\u73ed\u7b2c\u4e00\u4e2a\u5708\u4f60\u3002\u6bd5\u4e1a\u4e0d\u662f\u7ed3\u675f\uff0c\u662f\u54b1\u4eec\u4ece\u2018\u540c\u5b66\u2019\u5347\u7ea7\u6210\u2018\u6218\u53cb\u2019\u7684\u5f00\u59cb\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u5708\u5c42\u5408\u4f19\u4eba\u7ebf**\u3011\u3002\u5979\u5df2\u7ecf\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u793e\u7fa4\u5f52\u5c5e\u611f\u548c\u4e92\u52a9\u610f\u613f\uff08\u5173\u6ce8\u73ed\u7ea7\u3001\u60f3\u7ec4\u961f\uff09\uff0c\u662f\u6784\u5efa\u73ed\u7ea7\u751f\u6001\u7684\u6f5c\u5728\u6838\u5fc3\u8282\u70b9\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010**\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743 (B\u6a21\u5757)**\u3011 + \u3010**\u7279\u79cdC (\u7ebf\u4e0a\u9632\u8d70\u5931\u6258\u5e95)**\u3011\u3002\u5979\u4e3b\u52a8\u8bf7\u6559\u6280\u672f\u95ee\u9898\uff08\u5982\u201c\u751f\u4e09\u89c6\u56fe\u8138\u810f\u201d\uff09\uff0c\u9700\u63d0\u4f9b\u6df1\u5ea6\u89e3\u7b54\uff1b\u540c\u65f6\u7528\u201c\u6b7b\u515a\u201d\u59ff\u6001\u7ef4\u62a4\u60c5\u611f\u8fde\u63a5\uff0c\u963b\u65ad\u5916\u90e8\u8bf1\u60d1\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u5c06\u5979\u89c6\u4e3a\u666e\u901a\u5b66\u5458\u8fdb\u884c\u673a\u68b0\u5316\u7fa4\u53d1\u7ba1\u7406\u3002**\u7981\u6b62\u5ffd\u89c6\u5979\u7684\u793e\u7fa4\u6d3b\u8dc3\u5ea6\u548c\u9886\u5bfc\u6f5c\u529b**\uff0c\u7981\u6b62\u5728\u5979\u8868\u8fbe\u5bf9\u73ed\u7ea7\u6c1b\u56f4\u7684\u559c\u7231\u65f6\uff0c\u53ea\u7528\u5b98\u65b9\u8bdd\u672f\u56de\u5e94\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u53ef\u5927\u989d\u63a8\u4ecb**\u3002\u5979\u5bf9L3\u8bfe\u7a0b\u8868\u73b0\u51fa\u660e\u786e\u5174\u8da3\uff08\u4e3b\u52a8\u8be2\u95ee\uff09\uff0c\u4e14\u5df2\u5b8c\u6210\u524d\u671f\u8bfe\u7a0b\uff0c\u662f\u5347\u5355\u7684\u4f18\u8d28\u76ee\u6807\u3002\u63a8\u4ecb\u65f6\u5e94\u5f3a\u8c03\u201c\u8fdb\u9636\u5708\u5c42\u201d\u548c\u201c\u5185\u90e8\u673a\u4f1a\u201d\uff0c\u800c\u975e\u5355\u7eaf\u8d29\u5356\u7126\u8651\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u4eec\u5728\u4e00\u4e2a\u5c0f\u7ec4 \u5154\u7cd6\u9886\u7740\u6211\u4eec\u62c6\u62c6\u6587\u8bfb\u8bfb\u4e66 \u5c81\u6708\u9759\u597d \u6211\u90fd\u4e0d\u60f3\u4e0a\u6539\u7a3f\u4e86\u54c8\u54c8\u54c8\u201d **(\u793e\u7fa4\u5f52\u5c5e\u611f\u5f3a)**\n2. > \u201c\u73ed\u73ed\uff0c\u6211\u4eec6\u73ed\u6709\u63a5\u5546\u5355\u7684\u4e48\uff0c\u770b\u7740\u6ca1\u52a8\u9759\u5462\u201d **(\u5173\u6ce8\u5b9e\u8df5\u4e0e\u53d8\u73b0\uff0c\u6709\u5e26\u5934\u610f\u8bc6)**\n3. > \u201c\u8981\u6bd5\u4e1a\u5f00\u59cb\u614c\u4e86...\u4ee5\u540e\u662f\u5351\u5fae\u7684\u4e59\u65b9 \u4e5f\u6ca1\u4eba\u54c4\u7740\u5b66\u4e60\u4e86[\u56f0]\u201d **(\u5bf9\u5b66\u4e60\u793e\u7fa4\u6709\u60c5\u611f\u4f9d\u8d56\uff0c\u6050\u60e7\u8131\u79bb\u540e\u7684\u5b64\u72ec)**\n4. > \u201c\u73ed\u73ed\uff0c\u6700\u8fd1\u4e00\u76f4\u4e48\u6709L3\u7684\u6d88\u606f\u4e86\uff0c\u8fd8\u5f00\u4e0d\u201d **(\u4e3b\u52a8\u5bfb\u6c42\u8fdb\u9636\uff0c\u590d\u8d2d\u610f\u613f\u660e\u786e)**\n5. > \u201cL3\u73ed\u73ed\u8fd8\u662f\u5199\u4f5c\u73ed\u73ed\u561b \u552f\u58f9\u73ed\u73ed\u5e26\u5c31\u597d\u4e86\u201d **(\u5bf9\u7279\u5b9a\u73ed\u4e3b\u4efb\u4ea7\u751f\u60c5\u611f\u8fde\u63a5\u548c\u4fe1\u4efb)**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T7 \u72c2\u70ed\u6b7b\u5fe0\u7c89\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5728\u4e13\u4e1a\u793e\u7fa4\u4e2d\u83b7\u5f97\u5c0a\u91cd\u3001\u5f52\u5c5e\u4e0e\u6301\u7eed\u6210\u957f\u7684\u81ea\u6211\u5b9e\u73b0\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u5c06\u5979\u7eb3\u5165\u6838\u5fc3\u5708\u5c42\uff08\u5982\u5de5\u4f5c\u7ec4\u3001\u5b66\u957f\u5206\u4eab\u4f1a\uff09\uff0c\u8d4b\u4e88\u201c\u81ea\u5df1\u4eba\u201d\u8eab\u4efd\uff0c\u7528\u60c5\u611f\u8fde\u63a5\u548c\u8fdb\u9636\u673a\u4f1a\u9501\u6b7b\u957f\u671f\u4ef7\u503c\u3011**\u3002\n\n```json\n{\"core_type\": \"T7 \u72c2\u70ed\u6b7b\u5fe0\u7c89\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5c0a\u91cd/\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u5708\u5c42\u5408\u4f19\u4eba\u7ebf\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u5973\", \"city\": \"\u672a\u77e5\"}\n```";
