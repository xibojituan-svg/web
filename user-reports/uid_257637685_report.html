    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | YellowStar (UID: 257637685) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-03-15 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u4eca\u665a\u6253\u8001\u864e (\u987e\u5efa\u9f99) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | AI\u5199\u4f5c-\u77ed\u6545\u4e8b\u7279\u8bad\u8425 (\u65d7\u8230\u73ed)\u3001AI\u5199\u4f5c-\u7f16\u8f91\u6539\u7a3f\u6295\u7a3f\u8bfe (1880\u5143)\u3001AIGC\u89c6\u9891\u521b\u4f5c\u8425 (3980\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u5168\u6b3e\u5145\u88d5 (\u5df2\u62a5\u591a\u4e2a\u8bfe\u7a0b\uff0c\u672a\u63d0\u53ca\u8d44\u91d1\u538b\u529b) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u788e\u7247\u5316\u62fc\u51d1 (\u4f53\u5236\u5185\u5de5\u4f5c\uff0c\u9700\u770b\u7ba1\u5b66\u751f\uff0c\u65e0\u6cd5\u6478\u9c7c\uff0c\u65f6\u95f4\u7d27\u5f20) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** (\u672a\u63d0\u53ca\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u60c5\u51b5\uff0c\u9700\u91cd\u70b9\u63a2\u67e5) |\n| **\u4fe1\u606f\u539a\u5ea6** | \u9971\u6ee1 (\u6709\u6df1\u5ea6\u4e92\u52a8\u3001\u4f5c\u4e1a\u63d0\u4ea4\u3001\u7b7e\u7ea6\u6210\u529f\u3001\u5347\u5355\u51b3\u7b56\u8fc7\u7a0b) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u27a1\u4e2d]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e\uff0c\u4f46\u517c\u987e\u80fd\u529b\u6210\u957f\u4e0e\u5174\u8da3\uff0c\u5bf9\u201c\u8d5a\u5feb\u94b1\u201d\u6709\u6e05\u9192\u8ba4\u77e5\uff0c\u63a5\u53d7\u957f\u671f\u6295\u5165\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u60f3\u5148\u80fd\u62ff\u5230\u4e00\u70b9\u7c73\u3002\u8001\u5e08\u8fd9\u4e2a\u6b7b\u5de5\u8d44\u5728\u6210\u5bb6\u540e\u5b9e\u5728\u5403\u7d27[\u6342\u8138]\u201d\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5176\u5b9e\u6211\u60f3\u5b66\u8fd9\u4e2a\u4e5f\u4e0d\u662f\u4e3a\u4e86\u641e\u7c73\uff0c\u5c31\u662f\u60f3\u5b66\u6280\u672f\uff0c\u5de5\u4f5c\u91cc\u4f1a\u7528\u5230\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u8fde\u7eed\u62a5\u540d\u591a\u4e2a\u8bfe\u7a0b\uff08\u65d7\u8230\u73ed\u3001\u6539\u7a3f\u8bfe\u3001AIGC\u8bfe\uff09\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u538b\u529b\uff0c\u4f46\u52a8\u673a\u6e90\u4e8e\u5de5\u8d44\u5403\u7d27\uff0c\u975e\u9ad8\u51c0\u503c\u4eba\u7fa4\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4e2d** \u2014 \u4f53\u5236\u5185\u5de5\u4f5c\uff0c\u65f6\u95f4\u4e0d\u81ea\u7531\uff08\u201c\u56e0\u4e3a\u8981\u770b\u5b66\u751f\u8fd8\u4e0d\u80fd\u6478\u9c7c\u201d\uff09\uff0c\u9700\u201c\u62fc\u4e00\u628a\u201d\u6324\u51fa\u65f6\u95f4\uff0c\u5b58\u5728\u7cbe\u529b\u51b2\u7a81\u98ce\u9669\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u4fe1\u606f\u7f3a\u5931 (\u964d\u7ea7)** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u652f\u6301\u6216\u53cd\u5bf9\u4fe1\u606f\uff0c**\u6b64\u4e3a\u91cd\u5927\u98ce\u9669\u76f2\u533a**\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u9047\u5230\u95ee\u9898\u4e3b\u52a8\u5bfb\u6c42\u89e3\u51b3\u65b9\u6848\uff08\u95ee\u7b7e\u7ea6\u7ec6\u8282\u3001\u8bfe\u7a0b\u5b89\u6392\uff09\uff0c\u80fd\u72ec\u7acb\u51b3\u7b56\u5e76\u89c4\u5212\u5b66\u4e60\u8def\u5f84\uff0c\u60c5\u7eea\u7a33\u5b9a\u79ef\u6781\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u90a3\u4e2a\u7b97\u662f\u7b7e\u7ea6\u4e86\u5427...\u90a3\u4e2a\u5728\u7ebf\u8868\u683c\u6211\u4e5f\u586b\u4e86\u201d (\u4e3b\u52a8\u8ddf\u8fdb\uff0c\u89e3\u51b3\u95ee\u9898\u5bfc\u5411)\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5f04\u7684\u8bd5\u8bd5\u770b\uff0c\u6ca1\u90a3\u4e48\u96be\uff0c\u6478\u7d22\u6478\u7d22\u5c31\u4f1a\u4e86\u201d (\u5728\u7fa4\u5185\u4e3b\u52a8\u5e2e\u52a9\u540c\u5b66\uff0c\u5c55\u73b0\u81ea\u4fe1\u4e0e\u4e50\u4e8e\u5206\u4eab)\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u9700\u6c42 ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4f53\u5236\u5185\u5de5\u4f5c\u5e26\u6765\u7684\u7ecf\u6d4e\u675f\u7f1a\u4e0e\u4ef7\u503c\u611f\u7f3a\u5931**\u3002\u4ed6\u6e34\u671b\u901a\u8fc7\u526f\u4e1a\u6280\u80fd\u83b7\u5f97\u7ecf\u6d4e\u8865\u5145\u548c\u5916\u90e8\u8ba4\u53ef\uff0c\u4ee5\u5728\u201c\u6210\u5bb6\u540e\u201d\u7684\u7ecf\u6d4e\u538b\u529b\u4e0b\u91cd\u83b7\u638c\u63a7\u611f\u548c\u5c0a\u91cd\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6210\u5c31\u8ba4\u53ef\u4e0e\u8def\u5f84\u8d4b\u80fd**\u3002\u4ed6\u9700\u8981\u7684\u4e0d\u53ea\u662f\u201c\u60c5\u7eea\u6309\u6469\u201d\uff0c\u800c\u662f\u6e05\u6670\u7684\u8fdb\u9636\u8def\u5f84\u3001\u53ca\u65f6\u7684\u6210\u679c\u53cd\u9988\uff08\u5982\u7b7e\u7ea6\u6210\u529f\uff09\u4ee5\u53ca\u5c06\u4ed6\u89c6\u4e3a\u201c\u6f5c\u529b\u5b9e\u5e72\u8005\u201d\u7684\u5c0a\u91cd\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 **B\u7c7b** (\u52a8\u673a\u660e\u786e\u3001\u8d44\u6e90\u5c1a\u53ef\u3001\u6267\u884c\u529b\u5f3a\uff0c\u662f\u6838\u5fc3\u57f9\u517b\u5bf9\u8c61) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T2 \u4f4e\u8c03\u5b9e\u5e72\u578b** (\u517c\u987eT3\u6b7b\u78d5\u5b66\u9738\u7279\u8d28) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5c5e\u5927\u5435\u8ff9\u8c61\u3002**\u4f46\u5bb6\u5ead\u652f\u6301\u5ea6\u4fe1\u606f\u7f3a\u5931\uff0c\u9700\u5728\u670d\u52a1\u4e2d\u6e29\u548c\u63a2\u67e5**\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** (\u56e0\u4fe1\u606f\u7f3a\u5931\uff0c\u98ce\u9669\u672a\u77e5) | \u82e5\u5bb6\u4eba\u4e0d\u77e5\u60c5\u6216\u53cd\u5bf9\u5176\u6295\u5165\u5927\u91cf\u65f6\u95f4\u91d1\u94b1\u5b66\u4e60\uff0c\u53ef\u80fd\u5f15\u53d1\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4e2d** | **\u6838\u5fc3\u98ce\u9669**\uff1a\u4f53\u5236\u5185\u5de5\u4f5c\u7e41\u5fd9\uff0c\u591a\u8bfe\u5e76\u884c\u5bfc\u81f4\u65f6\u95f4\u7cbe\u529b\u900f\u652f\uff0c\u4ea7\u751f\u7126\u8651\u548c\u632b\u8d25\u611f\uff0c\u6700\u7ec8\u56e0\u201c\u8ddf\u4e0d\u4e0a\u201d\u800c\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u4e3b\u52a8\u89e3\u51b3\u95ee\u9898\uff0c\u4e0d\u6613\u56e0\u6280\u672f\u95ee\u9898\u7834\u9632\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u4f4e** | \u5bf9\u53d8\u73b0\u5468\u671f\u6709\u5408\u7406\u9884\u671f\uff08\u201c\u5148\u80fd\u62ff\u5230\u4e00\u70b9\u7c73\u201d\uff09\uff0c\u4e14\u5df2\u6709\u7b7e\u7ea6\u6210\u529f\u6b63\u53cd\u9988\uff0c\u4e0d\u6613\u56e0\u77ed\u671f\u65e0\u6536\u76ca\u66b4\u6012\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u7b2c2-4\u5468\uff0c\u591a\u95e8\u8bfe\u7a0b\u4f5c\u4e1a\u538b\u529b\u53e0\u52a0\u671f**\u3002\u5f53\u4ed6\u53d1\u73b0\u65f6\u95f4\u5b8c\u5168\u65e0\u6cd5\u517c\u987e\uff0c\u4ea7\u751f\u5f3a\u70c8\u81ea\u8d23\u548c\u538b\u529b\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cYellowStar\uff0c\u770b\u5230\u4f60\u4e3a\u4e86\u5bb6\u5ead\u548c\u63d0\u5347\u81ea\u5df1\u8fd9\u4e48\u62fc\uff0c\u771f\u7684\u5f88\u4f69\u670d\u3002\u4f60\u662f\u6211\u4eec\u73ed\u5c11\u89c1\u7684\u2018\u5b9e\u5e72\u6d3e\u2019\uff0c\u76ee\u6807\u6e05\u6670\u884c\u52a8\u529b\u5f3a\u3002\u54b1\u4eec\u4e0d\u8d2a\u591a\uff0c\u5148\u628a\u77ed\u6545\u4e8b\u8fd9\u6761\u7ebf\u8dd1\u901a\u62ff\u5230\u7ed3\u679c\uff0c\u5efa\u7acb\u4fe1\u5fc3\u3002\u65f6\u95f4\u7ba1\u7406\u4e0a\u522b\u6709\u538b\u529b\uff0c\u6211\u4f1a\u5e2e\u4f60\u76ef\u7740\u8282\u594f\uff0c\u54b1\u4eec\u7a33\u624e\u7a33\u6253\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u5feb\u901f\u63a5\u5355\u7ebf\u3011**\u3002\u4f18\u5148\u786e\u4fdd\u77ed\u6545\u4e8b/\u6539\u7a3f\u8bfe\u7684\u4ea4\u4ed8\u6df1\u5ea6\uff0c\u5e2e\u52a9\u5176\u5c3d\u5feb\u83b7\u5f97\u7b7e\u7ea6\u6216\u7a3f\u8d39\u6b63\u53cd\u9988\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9\u5176T2\u5b9e\u5e72+T3\u5b66\u9738\u7279\u8d28\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145 **\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011** \u548c **\u3010\u7cbe\u51c6\u6d3e\u5355/\u8d44\u6e90\u5bf9\u63a5\u3011**\u3002**\u8c28\u614e\u63d0\u4f9b\u3010\u60c5\u7eea\u4fdd\u59c6\u6c60\u3011\u5185\u5bb9**\uff0c\u8fc7\u5ea6\u5b89\u629a\u53ef\u80fd\u88ab\u89c6\u4e3a\u4e0d\u5c0a\u91cd\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u8981\u6301\u7eed\u753b\u5927\u997c\u6216\u50ac\u4fc3\u5176\u62a5\u66f4\u591a\u8bfe**\u3002\u4ed6\u5df2\u62a5\u591a\u95e8\u8bfe\uff0c\u91cd\u70b9\u5728\u6d88\u5316\u800c\u975e\u6269\u5f20\u3002\n    2. **\u7edd\u4e0d\u8981\u7528\u5bf9\u5f85\u201c\u5c0f\u767d\u201d\u6216\u201c\u5de8\u5a74\u201d\u7684\u8fc7\u5ea6\u5475\u62a4\u8bed\u6c14\u4ea4\u6d41**\uff0c\u8fd9\u4f1a\u88ab\u89c6\u4e3a\u8f7b\u89c6\u3002\n    3. **\u7edd\u4e0d\u8981\u5ffd\u7565\u5176\u65f6\u95f4\u7ba1\u7406\u56f0\u5883**\uff0c\u9700\u4e3b\u52a8\u534f\u52a9\u89c4\u5212\u8bfe\u7a0b\u5b66\u4e60\u987a\u5e8f\uff0c\u907f\u514d\u51b2\u7a81\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5f53\u524d\u8bfe\u7a0b\u5df2\u9971\u548c\uff0c\u9996\u8981\u4efb\u52a1\u662f\u786e\u4fdd\u73b0\u6709\u8bfe\u7a0b\u5b8c\u8bfe\u7387\u548c\u6ee1\u610f\u5ea6\uff0c\u5efa\u7acb\u4fe1\u4efb\u3002\u672a\u6765\u590d\u8d2d\u9700\u5728\u5176\u73b0\u6709\u8bfe\u7a0b\u53d6\u5f97\u660e\u786e\u6210\u679c\u540e\u8fdb\u884c\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c**\u5176\u5b9e\u6211\u60f3\u5b66\u8fd9\u4e2a\u4e5f\u4e0d\u662f\u4e3a\u4e86\u641e\u7c73\uff0c\u5c31\u662f\u60f3\u5b66\u6280\u672f\uff0c\u5de5\u4f5c\u91cc\u4f1a\u7528\u5230**\u201d (\u52a8\u673a\u4e0d\u7eaf\u4e3a\u5feb\u94b1\uff0c\u517c\u987e\u80fd\u529b\u6210\u957f)\n2. > \u201c**\u65f6\u95f4\u771f\u4e0d\u591a\uff0c\u5f88\u7d27[\u6342\u8138]\u4f46\u6211\u60f3\u62fc\u4e00\u628a[\u6342\u8138]**\u201d (\u8d44\u6e90\u5e95\u5ea7\u4e2d\uff0c\u65f6\u95f4\u7d27\u5f20\u4f46\u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u6709\u62fc\u640f\u5fc3\u6001)\n3. > \u201c**\u5f04\u7684\u8bd5\u8bd5\u770b\uff0c\u6ca1\u90a3\u4e48\u96be\uff0c\u6478\u7d22\u6478\u7d22\u5c31\u4f1a\u4e86**\u201d (\u4e3b\u52a8\u5e2e\u52a9\u4ed6\u4eba\uff0c\u5c55\u73b0\u9ad8\u5fc3\u7406\u5f39\u6027\u548c\u89e3\u51b3\u95ee\u9898\u7684\u80fd\u529b)\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T2\u4f4e\u8c03\u5b9e\u5e72\u578b\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u4e0e\u7ecf\u6d4e\u81ea\u4e3b\u6743\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4e2d\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u534f\u52a9\u5176\u505a\u597d\u591a\u8bfe\u7a0b\u65f6\u95f4\u89c4\u5212\uff0c\u4f18\u5148\u786e\u4fdd\u77ed\u6545\u4e8b\u7ebf\u51fa\u6210\u679c\uff0c\u907f\u514d\u56e0\u7cbe\u529b\u900f\u652f\u5d29\u76d8\u3011**\u3002\n\n```json\n{\"core_type\": \"T2 \u4f4e\u8c03\u5b9e\u5e72\u578b\", \"maslow_need\": \"\u5c0a\u91cd\u9700\u6c42\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u5feb\u901f\u63a5\u5355\u7ebf\"}\n```";
