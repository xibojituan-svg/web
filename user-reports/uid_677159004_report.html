        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677159004 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-07 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u6843\u5341\u516d(\u4ed8\u5b9d\u5a1f) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u8bfe\u7a0b\uff08\u4f53\u9a8c\u8425\u9636\u6bb5\uff09 |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | \u4fe1\u606f\u4e0d\u8db3\uff08\u4f53\u9a8c\u8425\u9636\u6bb5\uff0c\u672a\u6d89\u53ca\u652f\u4ed8\uff09 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | \u4fe1\u606f\u4e0d\u8db3\uff08\u7528\u6237\u8868\u793a\u201c\u65f6\u95f4\u6211\u6709\u201d\uff0c\u4f46\u672a\u8bf4\u660e\u5177\u4f53\u65f6\u6bb5\uff09 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | \u4fe1\u606f\u4e0d\u8db3 |\n| **\u4fe1\u606f\u539a\u5ea6** | \u4e2d\u7b49\uff08\u4e92\u52a8\u79ef\u6781\uff0c\u4f46\u7f3a\u4e4f\u5bb6\u5ead\u3001\u8d22\u52a1\u3001\u8fc7\u5f80\u7ecf\u5386\u7b49\u6df1\u5ea6\u4fe1\u606f\uff09 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u800c\u6765\uff0c\u5173\u6ce8\u4e13\u4e1a\u7cbe\u8fdb\u4e0e\u81ea\u6211\u5b9e\u73b0\u3002\u7528\u6237\u660e\u786e\u8868\u8fbe\u5bf9\u201c\u5ba1\u542c\u201d\u5de5\u4f5c\u7684\u5174\u8da3\uff0c\u5e76\u5f3a\u8c03\u201c\u5bf9\u6587\u5b57\u6bd4\u8f83\u654f\u611f\uff0c\u5bb9\u4e0d\u5f97\u9519\u8bef\u201d\uff0c\u663e\u793a\u51fa\u5bf9\u4e13\u4e1a\u7ec6\u8282\u7684\u8ffd\u6c42\uff0c\u800c\u975e\u5355\u7eaf\u77ed\u671f\u53d8\u73b0\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u6211\u8ba4\u4e3a\u6211\u9664\u4e86\u5f55\u4e66\uff0c\u8fd8\u9002\u5408\u5ba1\u542c\u7684\u5de5\u4f5c\u3002\u56e0\u4e3a\u6211\u5bf9\u6587\u5b57\u6bd4\u8f83\u654f\u611f\uff0c\u5bb9\u4e0d\u5f97\u9519\u8bef\u3002\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a\u4fe1\u606f\u4e0d\u8db3 \u2014 \u672a\u63d0\u53ca\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a\u4e2d \u2014 \u7528\u6237\u660e\u786e\u8868\u793a\u201c\u65f6\u95f4\u6211\u6709\u201d\uff0c\u80fd\u6309\u65f6\u5b8c\u6210\u6240\u6709\u4f53\u9a8c\u8425\u4efb\u52a1\uff08\u65e9\u529f\u3001\u58f0\u97f3\u9274\u5b9a\u3001\u65c1\u767d\u4f5c\u4e1a\u3001\u89d2\u8272\u4f5c\u4e1a\uff09\uff0c\u6267\u884c\u529b\u5f3a\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a\u4fe1\u606f\u4e0d\u8db3 \u2014 \u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b06\u9ad8\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3\u3002\u9762\u5bf9\u4e13\u4e1a\u70b9\u8bc4\uff0c\u80fd\u7406\u6027\u63a5\u53d7\u5e76\u8868\u793a\u611f\u8c22\uff0c\u65e0\u4efb\u4f55\u8d1f\u9762\u60c5\u7eea\u6d41\u9732\uff0c\u8868\u73b0\u51fa\u8f83\u5f3a\u7684\u5b66\u4e60\u97e7\u6027\u548c\u6210\u957f\u578b\u601d\u7ef4\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u60a8\u7684\u610f\u89c1\u90fd\u975e\u5e38\u4e2d\u80af\uff0c\u6211\u5728\u8fd9\u65b9\u9762\u5c31\u662f\u5c0f\u767d\uff0c\u6211\u80af\u5b9a\u865a\u5fc3\u63a5\u53d7\u3002\u8c22\u8c22\uff01\u201d\uff1b> \u201c\u542c\u4e86\u60a8\u7684\u53cd\u9988\uff0c\u53d7\u76ca\u532a\u6d45\uff0c\u8c22\u8c22\uff01\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a\u7b2c\u4e94\u5c42\uff1a\u81ea\u6211\u5b9e\u73b0\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u4e13\u4e1a\u80fd\u529b\u63d0\u5347\u548c\u83b7\u5f97\u884c\u4e1a\u8ba4\u53ef\u7684\u6e34\u671b\u3002\u4ed6\u4e0d\u4ec5\u60f3\u201c\u5f55\u4e66\u201d\uff0c\u8fd8\u4e3b\u52a8\u601d\u8003\u81ea\u5df1\u9002\u5408\u201c\u5ba1\u542c\u201d\u5de5\u4f5c\uff0c\u5e76\u5f3a\u8c03\u5bf9\u6587\u5b57\u7ec6\u8282\u7684\u654f\u611f\uff0c\u8fd9\u66b4\u9732\u4e86\u4ed6\u5bf9\u201c\u4e13\u4e1a\u8eab\u4efd\u201d\u548c\u201c\u4ef7\u503c\u8d21\u732e\u201d\u7684\u6df1\u5c42\u8ffd\u6c42\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u4e13\u4e1a\u4e0a\u7684\u6df1\u5ea6\u8ba4\u53ef\u4e0e\u8d4b\u80fd**\u3002\u5c06\u4ed6\u89c6\u4e3a\u201c\u6f5c\u529b\u4e13\u4e1a\u4eba\u58eb\u201d\uff0c\u63d0\u4f9b\u4e25\u8083\u7684\u6280\u672f\u6307\u5bfc\u3001\u884c\u4e1a\u8d44\u6e90\u5bf9\u63a5\uff0c\u5e76\u8d4b\u4e88\u4ed6\u53c2\u4e0e\u201c\u5ba1\u542c\u201d\u7b49\u66f4\u5177\u4e13\u4e1a\u95e8\u69db\u5de5\u4f5c\u7684\u673a\u4f1a\uff0c\u6ee1\u8db3\u5176\u81ea\u6211\u5b9e\u73b0\u7684\u9700\u6c42\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | \ud83d\udfe7 **B\u7c7b** (\u6838\u5fc3\u7a33\u5b9a/\u9ad8\u590d\u8d2d\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T3 \u6b7b\u78d5\u6781\u5ba2\u6d3e** (\u9ad8\u590d\u8d2d\u6f5c\u529b) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u65e0\u501f\u8d37\u3001\u6781\u7aef\u5a01\u80c1\u6216\u5bb6\u5ead\u53cd\u5bf9\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u4fe1\u606f\u4e0d\u8db3\uff0c\u4f46\u7528\u6237\u8868\u73b0\u72ec\u7acb\uff0c\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4f4e | \u65f6\u95f4\u5145\u88d5\uff0c\u6267\u884c\u529b\u5f3a\uff0c\u5b66\u4e60\u610f\u613f\u9ad8\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | \u6781\u4f4e | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u7406\u6027\u63a5\u53d7\u6279\u8bc4\u5e76\u611f\u8c22\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | **\u6838\u5fc3\u98ce\u9669\u70b9**\uff1a\u82e5\u540e\u7eed\u6b63\u4ef7\u8bfe\u7a0b\u4ea4\u4ed8\u7684\u6280\u672f\u6df1\u5ea6\u4e0d\u8db3\uff0c\u6216\u627f\u8bfa\u7684\u201c\u5ba1\u542c\u201d\u7b49\u9ad8\u9636\u673a\u4f1a\u65e0\u6cd5\u5151\u73b0\uff0c\u53ef\u80fd\u5bfc\u81f4\u5176\u56e0\u201c\u4e13\u4e1a\u6210\u957f\u505c\u6ede\u201d\u800c\u5931\u671b\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a\u5f00\u8bfe\u540e1-2\u4e2a\u6708\uff0c\u5f53\u57fa\u7840\u6280\u80fd\u638c\u63e1\u540e\uff0c\u82e5\u65e0\u6cd5\u63a5\u89e6\u5230\u66f4\u6df1\u5165\u7684\u6280\u672f\u5185\u5bb9\u6216\u9ad8\u8d28\u91cf\u5b9e\u8df5\u673a\u4f1a\u65f6\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u540c\u5b66\u4f60\u597d\uff0c\u770b\u5230\u4f60\u5bf9\u5ba1\u542c\u5de5\u4f5c\u4e5f\u6709\u5174\u8da3\uff0c\u8bf4\u660e\u4f60\u5bf9\u5185\u5bb9\u8d28\u91cf\u6709\u5f88\u9ad8\u7684\u8ffd\u6c42\u3002\u6211\u4eec\u7684\u8bfe\u7a0b\u4f53\u7cfb\u91cc\u6b63\u597d\u6709\u4e13\u95e8\u7684\u2018\u5ba1\u542c\u4e0e\u540e\u671f\u7cbe\u4fee\u2019\u6a21\u5757\uff0c\u6211\u4f1a\u5e2e\u4f60\u7559\u610f\u76f8\u5173\u7684\u8fdb\u9636\u673a\u4f1a\u3002\u6211\u4eec\u5148\u4ece\u624e\u5b9e\u7684\u6f14\u64ad\u57fa\u7840\u5f00\u59cb\uff0c\u4e00\u6b65\u6b65\u6784\u5efa\u4f60\u7684\u4e13\u4e1a\u80fd\u529b\u7248\u56fe\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010\u786c\u6838\u5b9e\u5e72\u7ebf\u3011\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u3010\u6781\u5ba2\u6df1\u7814\u63d0\u95ee\u7279\u6743\u3011+\u3010\u540e\u7aef\u4e13\u5bb61v1\u70b9\u8bc4\u901a\u9053\u3011\u3002\u5fc5\u987b\u5f15\u5165\u540e\u7aef\u6280\u672f\u5927\u725b\uff08B\u6a21\u5757\uff09\u89e3\u7b54\u5176\u53ef\u80fd\u63d0\u51fa\u7684\u6df1\u5c42\u6280\u672f\u95ee\u9898\uff08\u5982AU\u53c2\u6570\u3001\u6587\u672c\u5206\u6790\u903b\u8f91\u7b49\uff09\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7528\u201c\u51e0\u5929\u8d5a\u94b1\u201d\u3001\u201c\u8f7b\u677e\u53d8\u73b0\u201d\u7b49\u8bdd\u672f\u53bb\u201c\u77ee\u5316\u201d\u4ed6\u7684\u4e13\u4e1a\u8ffd\u6c42\u3002\u7981\u6b62\u7528\u60c5\u611f\u9e21\u6c64\u4ee3\u66ff\u4e13\u4e1a\u6307\u5bfc\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a\u53ef\u63a8\u4ecb\u9ad8\u9636\u6280\u672f\u8bfe\u3001\u79c1\u6559\u8bfe\u6216\u5ba1\u542c\u4e13\u9879\u8bad\u7ec3\u8425\u3002**\u4e25\u7981**\u5728\u5176\u57fa\u7840\u6280\u80fd\u672a\u7a33\u56fa\u65f6\uff0c\u4ea4\u53c9\u63a8\u9500\u4e0e\u5176\u6838\u5fc3\u5174\u8da3\uff08\u6587\u5b57\u3001\u5ba1\u542c\uff09\u65e0\u5173\u7684\u5a31\u4e50\u5411\u8bfe\u7a0b\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u6211\u8ba4\u4e3a\u6211\u9664\u4e86\u5f55\u4e66\uff0c\u8fd8\u9002\u5408\u5ba1\u542c\u7684\u5de5\u4f5c\u3002\u56e0\u4e3a\u6211\u5bf9\u6587\u5b57\u6bd4\u8f83\u654f\u611f\uff0c\u5bb9\u4e0d\u5f97\u9519\u8bef\u3002\u201d\n2. > \u201c\u542c\u4e86\u60a8\u7684\u53cd\u9988\uff0c\u53d7\u76ca\u532a\u6d45\uff0c\u8c22\u8c22\uff01\u201d (\u9762\u5bf9\u4e13\u4e1a\u70b9\u8bc4\u7684\u7406\u6027\u53cd\u9988)\n3. > \u201c\u5bf9\u554a\uff0c\u6b63\u5728\u7422\u78e8\uff0c\u9700\u8981\u5b66\u4e60\u7684\u4e1c\u897f\u5f88\u591a\u3002\u201d (\u8868\u73b0\u51fa\u4e3b\u52a8\u94bb\u7814\u7684\u6001\u5ea6)\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T3 \u6b7b\u78d5\u6781\u5ba2\u6d3e\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u4e13\u4e1a\u7cbe\u8fdb\u4e0e\u81ea\u6211\u5b9e\u73b0\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u4f4e\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6301\u7eed\u3001\u6709\u6df1\u5ea6\u7684\u4e13\u4e1a\u5185\u5bb9\u4e0e\u9ad8\u9636\u5b9e\u8df5\u673a\u4f1a\uff0c\u6ee1\u8db3\u5176\u201c\u6280\u672f\u6d01\u7656\u201d\u548c\u6210\u957f\u9700\u6c42\u3011**\u3002\n\n```json\n{\"core_type\": \"T3 \u6b7b\u78d5\u6781\u5ba2\u6d3e\", \"risk_level\": \"\u4f4e\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u81ea\u6211\u5b9e\u73b0\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf\"}\n```";
