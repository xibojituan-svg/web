        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n> **\u4fe1\u606f\u4e0d\u8db3\uff0c\u7f6e\u4fe1\u5ea6\u964d\u4f4e**\uff1a\u804a\u5929\u8bb0\u5f55\u96c6\u4e2d\u4e8e\u4f53\u9a8c\u8425\u5b66\u4e60\u4e0e\u8f6c\u5316\u8fc7\u7a0b\uff0c\u7f3a\u5c11\u5173\u4e8e**\u652f\u4ed8\u80fd\u529b\u3001\u5bb6\u5ead\u652f\u6301\u5ea6\u3001\u8fc7\u5f80\u5b66\u4e60/\u5de5\u4f5c\u632b\u6298\u7ecf\u5386**\u7b49\u5173\u952e\u7ef4\u5ea6\u7684\u76f4\u63a5\u4fe1\u606f\u3002\u5224\u65ad\u4e3b\u8981\u57fa\u4e8e\u7528\u6237\u7684\u5b66\u4e60\u6295\u5165\u5ea6\u548c\u5bf9\u672a\u6765\u7684\u671f\u671b\u3002\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677158524 (\u6635\u79f0: Eli) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | 101\u5b63\u590f(\u5eb7\u9896\u9896) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u7cfb\u7edf\u8bfe (\u4ef7\u683c\u672a\u77e5) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **[\u4fe1\u606f\u7f3a\u5931]** (\u672a\u63d0\u53ca\u652f\u4ed8\u7ec6\u8282) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u4e3b\u4e1a\u4e3a\u8001\u5e08\uff0c\u4e0b\u73ed\u540e\u7ea62-3\u5c0f\u65f6) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **[\u4fe1\u606f\u7f3a\u5931]** (\u672a\u63d0\u53ca\u5bb6\u5ead\u60c5\u51b5) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u4e2d\u7b49** (\u5b66\u4e60\u52a8\u673a\u3001\u65f6\u95f4\u3001\u804c\u4e1a\u4fe1\u606f\u660e\u786e\uff0c\u4f46\u8d22\u52a1\u4e0e\u5bb6\u5ead\u80cc\u666f\u7f3a\u5931) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 [\u2b06\u9ad8]\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u4e0e\u7ed3\u679c\u800c\u6765\u3002\u660e\u786e\u8868\u793a\u201c\u8d5a\u94b1\u201d\u662f\u9996\u8981\u76ee\u6807\uff0c\u5e76\u613f\u610f\u4e3a\u957f\u671f\u53d8\u73b0\u6295\u5165\u65f6\u95f4\uff082-4\u4e2a\u6708\u5b66\u4e60\uff09\uff0c\u751a\u81f3\u8003\u8651\u672a\u6765\u5168\u804c\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c[\u6765\u8bad\u7ec3\u8425\u60f3\u6536\u83b7\u4ec0\u4e48\uff1f\u8d5a\u7c73/\u5174\u8da3]: \u8d5a\u94b1\u201d > \u201c\u5982\u679c\u517c\u804c\u6536\u5165\u53ef\u4ee5\u7684\u8bdd\u751a\u81f3\u60f3\u8f9e\u804c\u4e13\u95e8\u505a\u8fd9\u4e2a\uff0c\u60f3\u5148\u5c1d\u8bd5\u534a\u5e74\u5230\u4e00\u5e74\u7684\u65f6\u95f4\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 [\u27a1\u4e2d]\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a[**\u4fe1\u606f\u7f3a\u5931**] \u2014 \u672a\u63d0\u53ca\u652f\u4ed8\u80fd\u529b\u6216\u7ecf\u6d4e\u538b\u529b\uff0c\u65e0\u6cd5\u8bc4\u4f30\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a[**\u4e2d**] \u2014 \u4e3b\u4e1a\u4e3a\u8001\u5e08\uff0c\u6709\u76f8\u5bf9\u7a33\u5b9a\u7684\u4e0b\u73ed\u540e2-3\u5c0f\u65f6\u3002\u4f46\u6559\u5e08\u5de5\u4f5c\u672c\u8eab\u53ef\u80fd\u6d88\u8017\u5fc3\u529b\uff0c\u65f6\u95f4\u5e76\u975e\u5b8c\u5168\u81ea\u7531\u5bbd\u88d5\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a[**\u4fe1\u606f\u7f3a\u5931**] \u2014 \u672a\u63d0\u53ca\u4efb\u4f55\u5bb6\u5ead\u4fe1\u606f\uff0c\u5b58\u5728\u6f5c\u5728\u98ce\u9669\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 [\u2b06\u9ad8]\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a\u81ea\u6211\u6d88\u5316\u95ed\u73af\u6c42\u89e3(\u9ad8)\u3002\u5728\u9500\u552e\u5bc6\u96c6\u7684\u8ddf\u8fdb\u3001\u4f5c\u4e1a\u63d0\u4ea4\u548c\u53cd\u9988\u4e2d\uff0c\u7528\u6237\u5747\u80fd\u53ca\u65f6\u3001\u6b63\u9762\u56de\u5e94\uff0c\u672a\u8868\u73b0\u51fa\u4efb\u4f55\u8d1f\u9762\u60c5\u7eea\u6216\u4f9d\u8d56\u3002\u80fd\u63a5\u53d7\u4e13\u4e1a\u5efa\u8bae\u5e76\u5feb\u901f\u884c\u52a8\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u542c\u5b8c\u76f4\u64ad\u6211\u611f\u89c9\u633a\u597d\u7684\uff0c\u76f4\u64ad\u8bf4\u540e\u7eed\u53ef\u80fd\u8fd8\u9700\u8981\u4e8c\u5230\u56db\u4e2a\u6708\u7684\u5b66\u4e60\uff0c\u6211\u4e5f\u80fd\u63a5\u53d7\u201d > \u5bf9\u9500\u552e\u7684\u6240\u6709\u4f5c\u4e1a\u3001\u6253\u5361\u3001\u4e0a\u64ad\u8981\u6c42\u5747\u56de\u590d\u201c\u597d\u7684\u201d\u5e76\u6267\u884c\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u4e8c\u5c42\uff1a\u7126\u8651\u4fdd\u969c ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a\u5bf9\u4e3b\u4e1a\uff08\u6559\u5e08\uff09\u6536\u5165\u6216\u804c\u4e1a\u53d1\u5c55\u8def\u5f84\u7684**\u4e0d\u5b89\u5168\u611f**\uff0c\u6e34\u671b\u627e\u5230\u4e00\u4e2a\u53ef\u9a8c\u8bc1\u3001\u6709\u6210\u957f\u6027\u7684\u526f\u4e1a/\u8f6c\u578b\u901a\u9053\uff0c\u4ee5\u5bf9\u51b2\u672a\u6765\u7684\u4e0d\u786e\u5b9a\u6027\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u786e\u5b9a\u6027\u4e0e\u8def\u5f84\u611f**\u3002\u63d0\u4f9b\u6e05\u6670\u3001\u53ef\u6267\u884c\u7684\u201c\u5b66\u4e60-\u63a5\u5355-\u53d8\u73b0\u201d\u8def\u7ebf\u56fe\uff0c\u4ee5\u53ca\u201c\u5e08\u59d0\u201d\u4f5c\u4e3a\u8fc7\u6765\u4eba\u7684\u6210\u529f\u80cc\u4e66\u548c\u8d44\u6e90\u6276\u6301\uff0c\u8ba9\u4ed6\u770b\u5230\u201c\u7a33\u5b9a\u526f\u4e1a\u6536\u5165\u201d\u4e43\u81f3\u201c\u8f6c\u578b\u5168\u804c\u201d\u7684\u53ef\u80fd\u6027\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe7B \u7c7b** (\u9ad8\u52a8\u673a\u3001\u4e2d\u8d44\u6e90\u3001\u9ad8\u5f39\u6027\uff0c\u662f\u6838\u5fc3\u57f9\u517b\u5bf9\u8c61) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T4 \u641e\u94b1\u7ed3\u679c\u578b** (\u76ee\u6807\u660e\u786e\u3001\u884c\u52a8\u529b\u5f3a\u3001\u5173\u6ce8\u6295\u5165\u4ea7\u51fa\u6bd4\u548c\u53d8\u73b0\u8def\u5f84) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a[\u2705 \u5b89\u5168\u672a\u89e6\u53d1]\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u3001\u5bb6\u5ead\u51b2\u7a81\u7b49\u7ea2\u7ebf\u4fe1\u53f7\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | **\u4e2d** | \u4fe1\u606f\u7f3a\u5931\u9879\u3002\u82e5\u8d2d\u8bfe\u4e3a\u5bb6\u5ead\u5927\u989d\u652f\u51fa\u4e14\u672a\u4e0e\u5bb6\u4eba\u5145\u5206\u6c9f\u901a\uff0c\u53ef\u80fd\u5f15\u53d1\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u4f4e** | \u6559\u5e08\u804c\u4e1a\u4f5c\u606f\u76f8\u5bf9\u89c4\u5f8b\uff0c\u6709\u56fa\u5b9a\u5b66\u4e60\u65f6\u95f4\uff0c\u5d29\u76d8\u98ce\u9669\u8f83\u4f4e\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u4f4e** | \u5fc3\u7406\u5f39\u6027\u9ad8\uff0c\u80fd\u63a5\u53d7\u53cd\u9988\u5e76\u884c\u52a8\uff0c\u975e\u60c5\u7eea\u5316\u7c7b\u578b\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | **\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u5bf9\u201c\u5feb\u901f\u6536\u5165\u201d\u62b1\u6709\u671f\u5f85\uff0c\u82e5\u5b66\u4e60\u521d\u671f\uff08\u59821-2\u4e2a\u6708\u5185\uff09\u63a5\u5355\u4e0d\u987a\u6216\u6536\u5165\u8fdc\u4f4e\u4e8e\u5ba3\u4f20\u6848\u4f8b\uff0c\u6613\u4ea7\u751f\u88ab\u6b3a\u9a97\u611f\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c4-8\u5468**\u3002\u6b64\u65f6\u57fa\u7840\u8bfe\u7a0b\u7ed3\u675f\uff0c\u8fdb\u5165\u5b9e\u6218\u8bd5\u97f3\u9636\u6bb5\uff0c\u82e5\u591a\u6b21\u8bd5\u97f3\u5931\u8d25\u6216\u63a5\u5355\u6536\u5165\u5fae\u8584\uff0c\u6536\u76ca\u843d\u5dee\u611f\u5c06\u8fbe\u5230\u9876\u5cf0\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201cEli\u4f60\u597d\uff0c\u770b\u5230\u4f60\u8bad\u7ec3\u8425\u671f\u95f4\u4f5c\u4e1a\u5b8c\u6210\u5f97\u53c8\u5feb\u53c8\u597d\uff0c\u76ee\u6807\u611f\u7279\u522b\u5f3a\uff0c\u4e0d\u6127\u662f\u8001\u5e08\u51fa\u8eab\u3002\u54b1\u4eec\u7cfb\u7edf\u8bfe\u7684\u8bbe\u8ba1\u5c31\u662f\u4e3a\u4f60\u8fd9\u6837\u60f3\u2018\u641e\u4e8b\u4e1a\u2019\u7684\u540c\u5b66\u51c6\u5907\u7684\uff0c**\u524d\u4e24\u4e2a\u6708\u6253\u57fa\u7840\u7ec3\u5185\u529f\uff0c\u540e\u4e24\u4e2a\u6708\u91cd\u70b9\u653b\u7834\u2018\u65f6\u85aa\u4e66\u2019\u63a5\u5355**\u3002\u6211\u4f1a\u50cf\u5b63\u590f\u5e08\u59d0\u4e00\u6837\uff0c\u6bcf\u5468\u7ed9\u4f60\u540c\u6b65\u9002\u5408\u4f60\u58f0\u97f3\u6761\u4ef6\u7684\u8bd5\u97f3\u5355\uff0c\u54b1\u4eec\u4e00\u6b65\u4e00\u4e2a\u811a\u5370\uff0c\u628a\u2018\u8001\u5e08\u2019\u7684\u4e25\u8c28\u7528\u5230\u2018\u641e\u94b1\u2019\u4e0a\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u786c\u6838\u5b9e\u5e72\u7ebf**\u3011\u3002\u6838\u5fc3\u56f4\u7ed5\u201c\u65f6\u85aa\u4e66\u63a5\u5355\u201d\u548c\u201c\u5feb\u901f\u53d8\u73b0\u6e20\u9053\u201d\u5c55\u5f00\uff0c\u6ee1\u8db3\u5176\u5f3a\u70c8\u7684\u7ed3\u679c\u5bfc\u5411\u9700\u6c42\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u9488\u5bf9T4\u641e\u94b1\u7ed3\u679c\u578b\uff0c\u5f3a\u70c8\u5efa\u8bae\u8865\u5145\u3010**\u63a5\u5355\u5b9e\u6218\u52a0\u901f\u5305**\u3011\uff0c\u5305\u542b\uff1a1) \u9ad8\u9891\u6b21\u3001\u5339\u914d\u5ea6\u9ad8\u7684\u8bd5\u97f3\u5355\u63a8\u9001\uff1b2) \u8bd5\u97f3\u5931\u8d25\u540e\u7684\u5feb\u901f\u590d\u76d8\u6307\u5bfc\uff1b3) \u65e9\u671f\u5c0f\u989d\u53d8\u73b0\u6210\u529f\u6848\u4f8b\u5206\u4eab\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\u7edd\u4e0d\u5bf9\u4ed6\u7a7a\u8c08\u201c\u5174\u8da3\u201d\u3001\u201c\u60c5\u6000\u201d\u3001\u201c\u58f0\u97f3\u827a\u672f\u201d\uff1b\u907f\u514d\u8fc7\u5ea6\u627f\u8bfa\u201c\u5b66\u5b8c\u7acb\u523b\u6708\u5165\u8fc7\u4e07\u201d\uff0c\u5e94\u5f3a\u8c03\u201c\u9636\u68af\u5f0f\u6210\u957f\u201d\u548c\u201c\u6301\u7eed\u6295\u5165\u201d\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5728\u672a\u5b9e\u73b0\u9996\u6b21\u7a33\u5b9a\u63a5\u5355\u524d\u8fdb\u884c\u4efb\u4f55\u5927\u989d\u5347\u5355**\u3002\u53ef\u8003\u8651500\u5143\u4ee5\u5185\u7684\u5fae\u5347\uff08\u5982\u9ad8\u7ea7\u97f3\u6548\u5305\u3001\u4e13\u5c5e\u58f0\u5361\u8c03\u8bd5\u670d\u52a1\uff09\uff0c\u4e14\u5fc5\u987b\u4e0e\u63d0\u5347\u63a5\u5355\u6210\u529f\u7387\u76f4\u63a5\u76f8\u5173\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c[\u6765\u8bad\u7ec3\u8425\u60f3\u6536\u83b7\u4ec0\u4e48\uff1f\u8d5a\u7c73/\u5174\u8da3]: \u8d5a\u94b1\u201d\n2. > \u201c\u5982\u679c\u517c\u804c\u6536\u5165\u53ef\u4ee5\u7684\u8bdd\u751a\u81f3\u60f3\u8f9e\u804c\u4e13\u95e8\u505a\u8fd9\u4e2a\uff0c\u60f3\u5148\u5c1d\u8bd5\u534a\u5e74\u5230\u4e00\u5e74\u7684\u65f6\u95f4\u201d\n3. > \u201c\u6211\u60f3\u5148\u4ece\u5feb\u901f\u6536\u5165\u90a3\u4e24\u680f\u5148\u8bd5\u8bd5\uff0c\u6211\u7684\u65b9\u8a00\u5e94\u8be5\u4e5f\u8fd8\u53ef\u4ee5\uff0c\u7b49\u79ef\u7d2f\u7ecf\u9a8c\uff0c\u7136\u540e\u6162\u6162\u8bd5\u957f\u671f\u6536\u5165\u7684\u5206\u6210\u4e66\u4e4b\u7c7b\u7684\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **T4\u641e\u94b1\u7ed3\u679c\u578b**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u83b7\u5f97\u804c\u4e1a\u7b2c\u4e8c\u66f2\u7ebf\u5e26\u6765\u7684\u5b89\u5168\u4fdd\u969c**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u4e2d**\uff08\u6838\u5fc3\u98ce\u9669\u5728\u4e8e\u6536\u76ca\u843d\u5dee\uff09\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u5728\u5f00\u8bfe\u4e00\u4e2a\u6708\u5185\uff0c\u52a1\u5fc5\u534f\u52a9\u5176\u5b8c\u6210\u7b2c\u4e00\u6b21\u5c0f\u989d\u53d8\u73b0\uff08\u54ea\u6015\u53ea\u662f\u51e0\u5341\u5143\u7684\u5355\u5b50\uff09\uff0c\u5e76\u5f3a\u5316\u201c\u8def\u5f84\u6b63\u786e\uff0c\u7ed3\u679c\u5fc5\u7136\u201d\u7684\u4fe1\u5ff5**\u3002\n\n```json\n{\"core_type\": \"T4 \u641e\u94b1\u7ed3\u679c\u578b\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u7ebf+\u63a5\u5355\u5b9e\u6218\u52a0\u901f\u5305\"}\n```";
