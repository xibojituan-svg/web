    <script>
        const markdownText = "# \u7528\u6237\u5206\u5c42\u8bca\u65ad\u62a5\u544a (UID: 676345523)\n\n## 1. \u4e09\u8f74\u4fe1\u53f7\u63d0\u53d6\n\n*   **\u52a8\u673a\u7eaf\u5ea6 (M)**: **\u4e2d-\u9ad8**\u3002\u7528\u6237\u8868\u73b0\u51fa\u660e\u786e\u7684\u5b66\u4e60\u610f\u613f\u548c\u884c\u52a8\u529b\uff08\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u3001\u6253\u5361\u3001\u63d0\u95ee\uff09\uff0c\u5bf9\u6709\u58f0\u884c\u4e1a\u6709\u63a2\u7d22\u5174\u8da3\u3002\u4f46**\u53d8\u73b0\u52a8\u673a**\u4e0e**\u5174\u8da3/\u6280\u80fd\u63d0\u5347\u52a8\u673a**\u6df7\u5408\uff0c\u9700\u8b66\u60d5\u201c\u5feb\u901f\u53d8\u73b0\u201d\u627f\u8bfa\u5bf9\u5176\u51b3\u7b56\u7684\u5f71\u54cd\u3002\n*   **\u8d44\u6e90\u5e95\u5ea7 (R)**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u900f\u9732\u7528\u6237\u7684\u7ecf\u6d4e\u72b6\u51b5\u3001\u804c\u4e1a\u3001\u5bb6\u5ead\u80cc\u666f\u3001\u53ef\u7528\u65f6\u95f4\u7b49\u5173\u952e\u8d44\u6e90\u4fe1\u606f\u3002**\u7f3a\u4e4f\u6b64\u7ef4\u5ea6\u4fe1\u606f\uff0c\u5bf9\u7528\u6237\u5206\u5c42\u548c\u98ce\u9669\u5224\u65ad\u6784\u6210\u663e\u8457\u5f71\u54cd\u3002**\n*   **\u5fc3\u7406\u5f39\u6027 (E)**: **\u4e2d**\u3002\u7528\u6237\u914d\u5408\u5ea6\u9ad8\uff0c\u80fd\u63a5\u53d7\u6307\u5bfc\u5e76\u5b8c\u6210\u7ec3\u4e60\uff08\u5982\u201c\u597d\u7684\u201d\u3001\u201c\u597d\u54d2\u201d\uff09\uff0c\u5bf9\u6b63\u5411\u53cd\u9988\u6709\u79ef\u6781\u56de\u5e94\uff08\u201c\u54c7\u201d\uff09\u3002\u4f46\u672a\u7ecf\u5386\u660e\u663e\u632b\u6298\u6216\u538b\u529b\u6d4b\u8bd5\uff0c\u6297\u538b\u80fd\u529b\u548c\u957f\u671f\u575a\u6301\u610f\u613f\u672a\u77e5\u3002\n\n## 2. ABCD\u5224\u5b9a\u6811\u5206\u6790\n\n*   **\u6b65\u9aa40 (\u652f\u4ed8\u6838\u67e5)**: **\u5df2\u652f\u4ed8**\u3002\u7528\u6237\u5df2\u62a5\u540d\u201c\u7cbe\u82f1\u73ed\u201d\uff082\u4e2a\u6708\u5468\u671f\uff09\uff0c\u5e76\u63d0\u4f9b\u4e86UID\u3002\n*   **\u6b65\u9aa41.5 (\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5)**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u804a\u5929\u8bb0\u5f55\u672a\u6d89\u53ca\u4efb\u4f55\u5bb6\u5ead\u6216\u7b2c\u4e09\u65b9\u51b3\u7b56\u8005\u4fe1\u606f\uff0c\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u4e3a\u72ec\u7acb\u51b3\u7b56\u3002\n*   **\u6b65\u9aa42-4 (\u9700\u6c42-\u80fd\u529b-\u4ed8\u8d39\u610f\u613f\u5339\u914d)**: **\u521d\u6b65\u5339\u914d**\u3002\u7528\u6237\u5c55\u793a\u4e86\u5b66\u4e60\u884c\u4e3a\uff08A\uff09\uff0c\u9500\u552e\u901a\u8fc7\u4f5c\u4e1a\u70b9\u8bc4\u548c\u6b63\u5411\u53cd\u9988\u5851\u9020\u4e86\u201c\u8fdb\u6b65\u5feb\u3001\u6709\u6f5c\u529b\u201d\u7684\u8ba4\u77e5\uff08B\uff09\uff0c\u5e76\u6700\u7ec8\u5f15\u5bfc\u81f3\u4ed8\u8d39\u8f6c\u5316\uff08C->D\uff09\u3002\u4f46**\u5339\u914d\u6df1\u5ea6\u5b58\u7591**\uff0c\u56e0\u7f3a\u4e4f\u5bf9\u7528\u6237\u771f\u5b9e\u80fd\u529b\u57fa\u7ebf\u3001\u65f6\u95f4\u6295\u5165\u548c\u53d8\u73b0\u9884\u671f\u7684\u6df1\u5ea6\u6821\u51c6\u3002\n\n## 3. \u7528\u6237\u539f\u578b\u5339\u914d\n\n*   **\u5339\u914d\u539f\u578b: T5 \u5c1d\u9c9c\u63a2\u7d22\u8005**\u3002\n    *   **\u4f9d\u636e**: \u7528\u6237\u884c\u4e3a\u4ee5\u8ddf\u968f\u9500\u552e\u5f15\u5bfc\u4e3a\u4e3b\uff08\u6253\u5361\u3001\u4ea4\u4f5c\u4e1a\u3001\u63d0\u95ee\u6280\u5de7\uff09\uff0c\u8868\u73b0\u51fa\u5bf9\u65b0\u9c9c\u4e8b\u7269\uff08\u6709\u58f0\u884c\u4e1a\uff09\u7684\u597d\u5947\u548c\u5c1d\u8bd5\u610f\u613f\u3002\u4e92\u52a8\u4e2d\u672a\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u7126\u8651\uff08T6\uff09\u3001\u660e\u786e\u7684\u804c\u4e1a\u8f6c\u578b\u8bc9\u6c42\uff08T3/T4\uff09\u6216\u6781\u9ad8\u7684\u81ea\u4e3b\u6027\uff08T1/T2\uff09\u3002\u9500\u552e\u901a\u8fc7\u201c\u901a\u5173\u201d\u3001\u201c\u8d44\u6e90\u201d\u3001\u201c\u7248\u6743\u4e66\u201d\u7b49\u5916\u90e8\u6fc0\u52b1\u6210\u529f\u63a8\u52a8\u8f6c\u5316\uff0c\u7b26\u5408T5\u6613\u88ab\u6d41\u7a0b\u548c\u77ed\u671f\u6fc0\u52b1\u9a71\u52a8\u7684\u7279\u5f81\u3002\n\n## 4. \u9000\u8d39\u6295\u8bc9\u98ce\u9669\u8bc4\u4f30\n\n*   **\u603b\u4f53\u98ce\u9669\u7b49\u7ea7: \u4e2d**\u3002\n*   **\u9010\u9879\u6392\u67e5**:\n    1.  **\u6548\u679c\u672a\u8fbe\u9884\u671f**: **\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u8fc7\u5ea6\u627f\u8bfa\u201c\u5feb\u901f\u6323\u5230\u7b2c\u4e00\u6876\u91d1\u201d\u3001\u201c\u5165\u9a7b\u63a5\u5355\u201d\u3001\u201c\u7248\u6743\u4e66\u201d\u3001\u201c\u91cd\u70b9\u57f9\u517b\u201d\uff0c\u6781\u6613\u62c9\u9ad8\u7528\u6237\u9884\u671f\u3002\u7528\u6237\u5b9e\u9645\u6280\u80fd\u4e0e\u5e02\u573a\u63a5\u5355\u8981\u6c42\u53ef\u80fd\u5b58\u5728\u5de8\u5927\u5dee\u8ddd\u3002\n    2.  **\u7ecf\u6d4e\u538b\u529b/\u51b2\u52a8\u6d88\u8d39**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u7f3a\u4e4f\u8d44\u6e90\u5e95\u5ea7\u4fe1\u606f\uff0c\u65e0\u6cd5\u8bc4\u4f30\u4ed8\u8d39\u662f\u5426\u6784\u6210\u5176\u7ecf\u6d4e\u8d1f\u62c5\u3002\n    3.  **\u65f6\u95f4\u51b2\u7a81**: **\u4e2d\u98ce\u9669**\u30022\u4e2a\u6708\u7684\u201c\u7cbe\u82f1\u73ed\u201d\u5bf9\u65f6\u95f4\u6295\u5165\u8981\u6c42\u8f83\u9ad8\uff0c\u7528\u6237\u5f53\u524d\u914d\u5408\u5ea6\u53ef\u80fd\u5efa\u7acb\u5728\u201c\u4f53\u9a8c\u671f\u201d\u7684\u65b0\u9c9c\u611f\u4e0a\uff0c\u957f\u671f\u65f6\u95f4\u6295\u5165\u5b58\u7591\u3002\n    4.  **\u5bb6\u5ead\u53cd\u5bf9**: **\u4fe1\u606f\u4e0d\u8db3**\u3002\u672a\u8fdb\u884c\u5bb6\u5ead\u51b3\u7b56\u6743\u6838\u67e5\u3002\n    5.  **\u9500\u552e\u8bef\u5bfc**: **\u4e2d\u9ad8\u98ce\u9669**\u3002\u9500\u552e\u8bdd\u672f\u5b58\u5728**\u5938\u5927\u53d8\u73b0\u524d\u666f**\uff08\u201c20+\u591a\u79cd\u8d5a\u94b1\u5c97\u4f4d\u201d\u3001\u201c\u9ad8\u4ef7\u89d2\u8272\u5355\u201d\u3001\u201c\u65f6\u85aa\u4e00\u6b65\u6b65\u6765\u201d\uff09\u548c**\u8425\u9020\u7a00\u7f3a\u7d27\u8feb\u611f**\uff08\u201c\u6700\u540e\u4e00\u6b21\u8003\u6838\u201d\u3001\u201c\u540d\u989d\u5360\u4e0b\u201d\u3001\u201c\u73b0\u573a\u53d1\u4f18\u60e0\u5238\u201d\uff09\u7684\u5acc\u7591\uff0c\u662f\u4e3b\u8981\u98ce\u9669\u70b9\u3002\n    6.  **\u8bfe\u7a0b\u8d28\u91cf\u4e0d\u7b26**: **\u4e2d\u98ce\u9669**\u3002\u53d6\u51b3\u4e8e\u540e\u7eed\u6b63\u5f0f\u8bfe\u7a0b\u4e0e\u8bad\u7ec3\u8425\u4f53\u9a8c\u7684\u843d\u5dee\u3002\n    7.  **\u670d\u52a1\u4f53\u9a8c\u5dee**: **\u4f4e\u98ce\u9669**\u3002\u524d\u7aef\u9500\u552e\u670d\u52a1\u7ec6\u81f4\u3001\u53cd\u9988\u53ca\u65f6\uff0c\u4f46\u9700\u5173\u6ce8\u670d\u52a1\u4ea4\u63a5\u81f3\u73ed\u4e3b\u4efb\u540e\u7684\u4f53\u9a8c\u8fde\u7eed\u6027\u3002\n\n## 5. \u4f26\u7406\u9632\u7ebf\u4e0e\u9500\u552e\u5408\u89c4\u68c0\u67e5\n\n*   **\u4e3b\u8981\u96f7\u533a**:\n    *   **\u5938\u5927\u627f\u8bfa**: \u591a\u6b21\u5f3a\u8c03\u201c\u5feb\u901f\u53d8\u73b0\u201d\u3001\u201c\u7b2c\u4e00\u6876\u91d1\u201d\u3001\u201c\u9ad8\u4ef7\u5355\u201d\uff0c\u53ef\u80fd\u6784\u6210\u5bf9\u884c\u4e1a\u6536\u5165\u6c34\u5e73\u7684\u8bef\u5bfc\u6027\u63cf\u8ff0\u3002\n    *   **\u8425\u9020\u7a00\u7f3a\u4e0e\u7d27\u8feb**: \u4f7f\u7528\u201c\u6700\u540e\u4e00\u6b21\u8003\u6838\u201d\u3001\u201c\u73b0\u573a\u6388\u6743\u201d\u3001\u201c\u540d\u989d\u6709\u9650\u201d\u7b49\u8bdd\u672f\uff0c\u53ef\u80fd\u8bf1\u5bfc\u51b2\u52a8\u51b3\u7b56\u3002\n    *   **\u8fc7\u5ea6\u5956\u52b1\u4e0e\u60c5\u611f\u7ed1\u5b9a**: \u9891\u7e41\u4f7f\u7528\u201c\u770b\u597d\u4f60\u201d\u3001\u201c\u5a18\u5bb6\u4eba\u201d\u3001\u201c\u72ec\u5ba0\u8d44\u6e90\u201d\u7b49\u8bdd\u672f\uff0c\u5efa\u7acb\u975e\u5bf9\u7b49\u7684\u60c5\u611f\u4f9d\u8d56\uff0c\u53ef\u80fd\u5f71\u54cd\u7528\u6237\u7406\u6027\u5224\u65ad\u3002\n*   **\u5408\u89c4\u6027**: \u9500\u552e\u6d41\u7a0b\u5b8c\u6574\uff08\u4f53\u9a8c-\u7ec3\u4e60-\u8003\u6838-\u8f6c\u5316\uff09\uff0c\u4f46**\u5728\u53d8\u73b0\u627f\u8bfa\u7684\u660e\u786e\u6027\u548c\u9002\u5ea6\u6027\u4e0a\u5b58\u5728\u5408\u89c4\u98ce\u9669**\u3002\n\n## 6. \u73ed\u4e3b\u4efb\u884c\u52a8\u6307\u5357\u4e0e\u4ea7\u54c1\u5339\u914d\u5efa\u8bae\n\n*   **\u4ea7\u54c1\u5339\u914d\u5ea6: \u504f\u5dee**\u3002\u7528\u6237\u4e3a\u201c\u5c1d\u9c9c\u63a2\u7d22\u8005\u201d(T5)\uff0c\u88ab\u201c\u5feb\u901f\u53d8\u73b0\u201d\u8bdd\u672f\u5438\u5f15\uff0c\u4f462\u4e2a\u6708\u7684\u7cbe\u82f1\u73ed\u8bfe\u7a0b\u9700\u8981\u8f83\u5f3a\u7684\u81ea\u5f8b\u6027\u548c\u957f\u671f\u6295\u5165\uff0c\u4e0eT5\u7528\u6237\u5e38\u89c1\u7684\u6d45\u5c1d\u8f84\u6b62\u3001\u9700\u8981\u5f3a\u5373\u65f6\u53cd\u9988\u7684\u7279\u6027\u5b58\u5728\u6f5c\u5728\u9519\u914d\u3002\n*   **\u73ed\u4e3b\u4efb\u6700\u4f18\u5148\u52a8\u4f5c: \u9996\u5468\u6df1\u5ea6\u6821\u51c6\u9884\u671f\u4e0e\u6295\u5165**\u3002\n*   **\u8be6\u7ec6\u884c\u52a8\u6307\u5357**:\n    1.  **\u9884\u671f\u7ba1\u7406**: \u5165\u5b66\u9996\u5468\u5185\uff0c\u5fc5\u987b\u8fdb\u884c\u4e00\u5bf9\u4e00\u6c9f\u901a\uff0c**\u660e\u786e\u6f84\u6e05\u884c\u4e1a\u6536\u5165\u771f\u76f8\u3001\u6210\u957f\u5468\u671f\u3001\u6240\u9700\u7684\u65f6\u95f4\u7cbe\u529b\u6295\u5165**\uff0c\u964d\u4f4e\u201c\u5feb\u901f\u81f4\u5bcc\u201d\u5e7b\u60f3\u3002\u63d0\u4f9b\u771f\u5b9e\u7684\u5b66\u5458\u6848\u4f8b\uff08\u5305\u62ec\u6210\u529f\u4e0e\u6311\u6218\uff09\u3002\n    2.  **\u9700\u6c42\u6df1\u6316**: \u4e86\u89e3\u7528\u6237\u62a5\u540d\u6838\u5fc3\u52a8\u673a\uff08\u5174\u8da3\uff1f\u517c\u804c\u589e\u6536\uff1f\uff09\u3001\u6bcf\u65e5/\u6bcf\u5468\u53ef\u7528\u5b66\u4e60\u65f6\u95f4\u3001\u73b0\u6709\u8bbe\u5907\u6761\u4ef6\u3002**\u8865\u5168\u8d44\u6e90\u5e95\u5ea7\u4fe1\u606f**\u3002\n    3.  **\u5efa\u7acb\u7406\u6027\u76ee\u6807**: \u5e2e\u52a9\u7528\u6237\u8bbe\u5b9a\u4ee5**\u6280\u80fd\u63d0\u5347\u4e3a\u6838\u5fc3**\u7684\u3001\u53ef\u8861\u91cf\u7684\u77ed\u671f\u5b66\u4e60\u76ee\u6807\uff08\u5982\u5b8c\u6210\u67d0\u6a21\u5757\u7ec3\u4e60\u3001\u638c\u63e1\u67d0\u6280\u5de7\uff09\uff0c\u800c\u975e\u4ee5\u201c\u63a5\u5355\u8d5a\u94b1\u201d\u4e3a\u521d\u59cb\u76ee\u6807\u3002\n    4.  **\u5173\u6ce8\u5b66\u4e60\u53cd\u9988**: \u5bc6\u5207\u8ddf\u8e2a\u7528\u6237\u8fdb\u5165\u7cfb\u7edf\u8bfe\u540e\u7684\u4f5c\u4e1a\u5b8c\u6210\u60c5\u51b5\u548c\u4e92\u52a8\u9891\u7387\uff0cT5\u7528\u6237\u5bb9\u6613\u5728\u65b0\u9c9c\u611f\u6d88\u9000\u540e\u6d41\u5931\uff0c\u9700\u53ca\u65f6\u4ecb\u5165\u9f13\u52b1\u6216\u8c03\u6574\u5b66\u4e60\u8ba1\u5212\u3002\n    5.  **\u98ce\u9669\u9884\u8b66**: \u6807\u8bb0\u4e3a\u201c**\u9ad8\u9884\u671f\u7ba1\u7406\u9700\u6c42**\u201d\u7528\u6237\uff0c\u5728\u670d\u52a1\u8fc7\u7a0b\u4e2d\u6ce8\u610f\u7559\u5b58\u6c9f\u901a\u8bb0\u5f55\uff0c\u7279\u522b\u662f\u5173\u4e8e\u5b66\u4e60\u76ee\u6807\u548c\u884c\u4e1a\u8ba4\u77e5\u7684\u6821\u51c6\u8bb0\u5f55\u3002\n\n{\"core_type\": \"T5 \u5c1d\u9c9c\u63a2\u7d22\u8005\", \"risk_level\": \"\u4e2d\", \"refund_risk\": \"\u4e2d\", \"product_match\": \"\u504f\u5dee\", \"action\": \"\u9996\u5468\u6df1\u5ea6\u6821\u51c6\u9884\u671f\u4e0e\u6295\u5165\"}";
