    <script>
        const markdownText = "# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 677175378 |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-08 \u81f3 2026-04-10 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u516d\u6708\u6668\u516e1(\u5218\u5c0f\u5a1f) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u6f14\u64ad\u9ad8\u9636\u7cfb\u7edf\u8bfe (\u4ef7\u683c\uff1a2380\u5143) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u4fe1\u606f\u4e0d\u8db3**\u3002\u7528\u6237\u76f4\u63a5\u652f\u4ed82380\u5143\uff0c\u672a\u63d0\u53ca\u652f\u4ed8\u65b9\u5f0f\u3001\u5206\u671f\u6216\u7ecf\u6d4e\u538b\u529b\u3002 |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1**\u3002\u7528\u6237\u7ecf\u8425\u591c\u5e02\uff0c\u9700\u5728\u5907\u83dc\u3001\u63a5\u5f85\u5ba2\u4eba\u3001\u5bb6\u5ead\u4e8b\u52a1\uff08\u5982\u9001\u5ba0\u7269\u5c31\u533b\uff09\u95f4\u9699\u6324\u51fa\u65f6\u95f4\u5b66\u4e60\u3002 |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u5df2\u62a5\u5907\u5e76\u652f\u6301**\u3002\u7528\u6237\u63d0\u5230\u201c\u6211\u8001\u516c\u6765\u63a5\u73ed\u6211\u5c31\u53bb\u5f55\u201d\uff0c\u8868\u660e\u5bb6\u5ead\u77e5\u60c5\u4e14\u4e08\u592b\u53c2\u4e0e\u7ecf\u8425\uff0c\u63d0\u4f9b\u652f\u6301\u3002 |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1**\u3002\u804a\u5929\u8bb0\u5f55\u8be6\u7ec6\uff0c\u8986\u76d6\u5b66\u4e60\u8fc7\u7a0b\u3001\u4f5c\u4e1a\u63d0\u4ea4\u3001\u5bb6\u5ead\u751f\u6d3b\u3001\u60c5\u7eea\u72b6\u6001\u53ca\u6700\u7ec8\u8f6c\u5316\u3002 |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 \u2b06\u9ad8\n- **\u7279\u5f81\u901f\u5199**\uff1a\u4e3a\u80fd\u529b\u800c\u6765\uff0c\u5b66\u4e60\u6001\u5ea6\u8ba4\u771f\uff0c\u5173\u6ce8\u6280\u80fd\u63d0\u5347\u7ec6\u8282\uff0c\u5bf9\u53d8\u73b0\u6709\u671f\u5f85\u4f46\u672a\u8868\u73b0\u51fa\u6025\u8feb\u6216\u8981\u6c42\u4fdd\u5e95\u627f\u8bfa\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5b66\u5230\u5f88\u591a\u4e1c\u897f\uff0c\u5c31\u662f\u6709\u7684\u4e0d\u592a\u8bb0\u5f97\u4f4f\uff0c\u6709\u7684\u7528\u7684\u65f6\u5019\u60f3\u4e0d\u8d77\u6765\uff0c\u8fd8\u6709\u5c31\u662f\u4ee3\u5165\u611f\u4e0d\u592a\u884c\u5bf9\u81ea\u5df1\u7684\u58f0\u97f3\u4e0d\u81ea\u4fe1\uff0c\u6c14\u606f\u8ddf\u4e0d\u4e0a\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 \u27a1\u4e2d\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u4e2d** \u2014 \u80fd\u76f4\u63a5\u652f\u4ed82380\u5143\u8bfe\u7a0b\uff0c\u672a\u63d0\u53ca\u7ecf\u6d4e\u56f0\u96be\uff0c\u4f46\u591c\u5e02\u7ecf\u8425\u80cc\u666f\u6697\u793a\u6536\u5165\u6c34\u5e73\u4e00\u822c\uff0c\u975e\u9ad8\u6d88\u8d39\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u4f4e** \u2014 **\u6838\u5fc3\u77ed\u677f**\u3002\u591c\u5e02\u7ecf\u8425\u8005\uff0c\u65f6\u95f4\u9ad8\u5ea6\u788e\u7247\u5316\uff0c\u9700\u5728\u6df1\u591c\uff08\u201c\u4eca\u665a12\u70b9\u524d\u4e00\u5b9a\u4ea4\u201d\uff09\u6216\u5bb6\u5ead\u4e8b\u52a1\u95f4\u9699\u5b66\u4e60\uff0c\u7cbe\u529b\u6613\u88ab\u7a81\u53d1\u72b6\u51b5\uff08\u5982\u5ba0\u7269\u751f\u75c5\uff09\u6253\u65ad\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u9ad8** \u2014 \u4e08\u592b\u53c2\u4e0e\u5bb6\u5ead\u751f\u610f\uff0c\u7528\u6237\u53ef\u62bd\u8eab\u5b66\u4e60\uff0c\u5bb6\u5ead\u77e5\u60c5\u4e14\u63d0\u4f9b\u57fa\u7840\u652f\u6301\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 \u2b07\u4f4e\u6781\u5371\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56(\u6781\u5371)**\u3002\u9891\u7e41\u8868\u8fbe\u4e0d\u81ea\u4fe1\u3001\u7d27\u5f20\u3001\u5bb3\u6015\u88ab\u653e\u5f03\uff0c\u5bf9\u5bfc\u5e08\uff08\u5e08\u59d0\uff09\u6709\u5f3a\u70c8\u7684\u60c5\u611f\u4f9d\u8d56\u548c\u5bfb\u6c42\u8ba4\u53ef\u7684\u9700\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a> \u201c\u5e08\u59d0\u522b\u653e\u5f03\u6211\u554a\u201d\uff1b > \u201c\u5b8c\u86cb\uff0c\u5e08\u59d0\u5927\u817f\u62b1\u4e0d\u7a33\u4e86\u201d\uff1b > \u201c\u6211\u5f55\u4e86\u597d\u591a\u904d\uff0c\u603b\u89c9\u5f97\u4e0d\u884c\u4e0d\u6562\u53d1\u201d\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n> **\u5927\u6a21\u578b\u5224\u5b9a\u6cd5\u5219**\uff1a\u7edd\u4e0d\u80fd\u53ea\u770b\u8868\u9762\u7684\u201c\u6211\u60f3\u8d5a\u94b1\u201d\uff0c\u5fc5\u987b\u6df1\u6316\u5176\u771f\u6b63\u6b20\u7f3a\u7684\u75db\u70b9\u3002\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a[ \u7b2c\u56db\u5c42\uff1a\u5c0a\u91cd\u5f52\u5c5e ]\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u5f3a\u70c8\u7684\u81ea\u6211\u4ef7\u503c\u611f\u7f3a\u5931\u4e0e\u5bf9\u88ab\u8ba4\u53ef\u7684\u6781\u5ea6\u6e34\u671b**\u3002\u5979\u7ecf\u8425\u591c\u5e02\uff0c\u53ef\u80fd\u793e\u4f1a\u8ba4\u540c\u611f\u8f83\u4f4e\uff0c\u5e0c\u671b\u901a\u8fc7\u638c\u63e1\u4e00\u95e8\u201c\u4f53\u9762\u201d\u7684\u6280\u80fd\uff08\u6709\u58f0\u6f14\u64ad\uff09\u6765\u83b7\u5f97\u4ed6\u4eba\uff08\u5c24\u5176\u662f\u6743\u5a01\u5982\u201c\u5e08\u59d0\u201d\uff09\u7684\u80af\u5b9a\u548c\u63a5\u7eb3\uff0c\u4ece\u800c\u5efa\u7acb\u81ea\u4fe1\u548c\u5f52\u5c5e\u611f\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u5979\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u6301\u7eed\u3001\u5177\u4f53\u3001\u5938\u5f20\u7684\u80af\u5b9a\u4e0e\u4e0d\u79bb\u4e0d\u5f03\u7684\u201c\u88ab\u9700\u8981\u611f\u201d**\u3002\u5979\u9700\u8981\u88ab\u660e\u786e\u544a\u77e5\u201c\u4f60\u5f88\u68d2\u201d\u3001\u201c\u6211\u770b\u597d\u4f60\u201d\u3001\u201c\u6211\u4e0d\u4f1a\u653e\u5f03\u4f60\u201d\uff0c\u4ee5\u6b64\u5bf9\u6297\u5185\u5fc3\u7684\u81ea\u5351\u548c\u7126\u8651\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfeaC1** \u7c7b (\u52a8\u673a\u5c1a\u53ef\uff0c\u4f46\u8d44\u6e90\u5e95\u5ea7\uff08\u65f6\u95f4\uff09\u548c\u5fc3\u7406\u5f39\u6027\u5b58\u5728\u4e25\u91cd\u77ed\u677f) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u6838\u5fc3\u7279\u5f81\uff1a\u9ad8\u60c5\u7eea\u4f9d\u8d56\u3001\u4f4e\u81ea\u4fe1\u3001\u6613\u7126\u8651\u3001\u9700\u8981\u6301\u7eed\u60c5\u611f\u5b89\u629a) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a\u2705 \u5b89\u5168\u672a\u89e6\u53d1\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u672a\u53d1\u73b0\u501f\u8d37\u3001\u7edd\u5883\u6216\u5bb6\u5c5e\u5f3a\u70c8\u53cd\u5bf9\u7b49D\u7c7b\u7ea2\u7ebf\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4f4e | \u5bb6\u5ead\u77e5\u60c5\u4e14\u652f\u6301\uff0c\u4e08\u592b\u53c2\u4e0e\u7ecf\u8425\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | **\u9ad8** | **\u65f6\u95f4\u4e25\u91cd\u788e\u7247\u5316**\uff0c\u591c\u5e02\u5de5\u4f5c+\u5bb6\u5ead\u4e8b\u52a1\u6613\u5bfc\u81f4\u8bfe\u7a0b\u79ef\u538b\uff0c\u4ea7\u751f\u201c\u8ddf\u4e0d\u4e0a\u201d\u7684\u7126\u8651\u548c\u81ea\u8d23\uff0c\u6700\u7ec8\u653e\u5f03\u3002 |\n| \u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u4e00\u65e6\u4f5c\u4e1a\u5f97\u4e0d\u5230\u53ca\u65f6\u3001\u5f3a\u70c8\u7684\u6b63\u9762\u53cd\u9988\uff0c\u6216\u9047\u5230\u6280\u672f\u96be\u9898\uff08\u5982\u8f6f\u4ef6\u64cd\u4f5c\uff09\uff0c\u6781\u6613\u56e0\u201c\u89c9\u5f97\u81ea\u5df1\u592a\u7b28\u201d\u800c\u81ea\u5c0a\u5fc3\u53d7\u632b\uff0c\u4ea7\u751f\u201c\u5e08\u59d0\u653e\u5f03\u6211\u4e86\u201d\u7684\u5ff5\u5934\uff0c\u8fdb\u800c\u8981\u6c42\u9000\u8d39\u3002 |\n| \u6536\u76ca\u843d\u5dee\u578b | \u4e2d | \u5bf9\u53d8\u73b0\u6709\u671f\u5f85\uff0c\u4f46\u5f53\u524d\u66f4\u5173\u6ce8\u6280\u80fd\u8ba4\u53ef\u3002\u82e5\u5b66\u4e60\u4e2d\u671f\u53d1\u73b0\u63a5\u5355\u56f0\u96be\uff0c\u53ef\u80fd\u53e0\u52a0\u632b\u8d25\u611f\u5f15\u53d1\u9000\u8d39\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c2-3\u5468**\u3002\u5f53\u8bfe\u7a0b\u5185\u5bb9\u52a0\u6df1\u3001\u4f5c\u4e1a\u96be\u5ea6\u589e\u52a0\uff0c\u800c\u5979\u7684\u65f6\u95f4\u65e0\u6cd5\u4fdd\u8bc1\u3001\u7ec3\u4e60\u6548\u679c\u4e0d\u4f73\u65f6\uff0c\u6781\u6613\u56e0\u201c\u8ddf\u4e0d\u4e0a+\u5f97\u4e0d\u5230\u8db3\u591f\u8868\u626c\u201d\u800c\u5d29\u6e83\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u5979\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u5979\u8bf4......\u201d**\n> \u201c\u5c0f\u90b9\uff0c\u770b\u5230\u4f60\u62a5\u540d\u6211\u7279\u522b\u5f00\u5fc3\uff0c\u4e5f\u7279\u522b\u4f69\u670d\u4f60\u3002\u4e00\u8fb9\u5fd9\u751f\u610f\u4e00\u8fb9\u8fd8\u80fd\u575a\u6301\u5b66\u4e60\uff0c\u8fd9\u4efd\u52b2\u5934\u6bd4\u5f88\u591a\u4eba\u90fd\u5f3a\uff01\u4f60\u653e\u5fc3\uff0c\u54b1\u4eec\u8fd9\u4e2a\u73ed\u8282\u594f\u662f\u4e3a\u4f60\u8fd9\u6837\u7684\u540c\u5b66\u8bbe\u8ba1\u7684\uff0c**\u4e0d\u6015\u6162\uff0c\u5c31\u6015\u7ad9**\u3002\u6709\u4efb\u4f55\u95ee\u9898\uff0c\u54ea\u6015\u4f60\u89c9\u5f97\u95ee\u9898\u518d\u5c0f\u3001\u518d\u4e0d\u597d\u610f\u601d\uff0c\u968f\u65f6\u627e\u6211\uff0c\u6211\u4e00\u76f4\u5728\u3002\u4f60\u4e0d\u662f\u4e00\u4e2a\u4eba\u5728\u5b66\u4e60\uff0c\u6211\u4eec\u662f\u4e00\u4e2a\u56e2\u961f\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a\u3010**\u8f6f\u6027\u7597\u6108\u966a\u4f34\u7ebf**\u3011\u3002\u9996\u8981\u76ee\u6807\u662f\u5efa\u7acb\u5979\u7684\u5b89\u5168\u611f\u548c\u5b66\u4e60\u4e60\u60ef\uff0c\u800c\u975e\u5feb\u901f\u63a5\u5355\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a\u5fc5\u987b\u6ee1\u914d **\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\u3011**\u3002\u5305\u542b\uff1a\u6bcf\u65e5\u201c\u4f60\u771f\u68d2\u201d\u6253\u5361\u9f13\u52b1\u3001\u7b80\u5316\u7248\u4f5c\u4e1a\uff08\u5982\u201c\u5f55\u4e00\u53e5\u8bdd\u5c31\u597d\u201d\uff09\u3001\u64cd\u4f5c\u95ee\u9898\u7684\u4fdd\u59c6\u7ea7\u56fe\u6587/\u89c6\u9891\u6307\u5f15\u3001\u5b9a\u671f\u4e00\u5bf9\u4e00\u60c5\u611f\u5173\u6000\u901a\u8bdd\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a\n    1. **\u7edd\u4e0d\u5bf9\u5979\u65bd\u52a0\u4f5c\u4e1a\u538b\u529b\u6216\u8fdb\u884c\u4e25\u5389\u6279\u8bc4**\u3002\u6240\u6709\u53cd\u9988\u5fc5\u987b\u5148\u626c\u540e\u6291\uff0c\u4e14\u201c\u626c\u201d\u7684\u90e8\u5206\u8981\u5177\u4f53\u3001\u5938\u5f20\u3002\n    2. **\u7edd\u4e0d\u5728\u73ed\u7ea7\u7fa4\u516c\u5f00\u6bd4\u8f83\u6216\u8868\u626c\u4ed6\u4eba\u800c\u5ffd\u7565\u5979**\u3002\n    3. **\u7edd\u4e0d\u8981\u8ba9\u5979\u611f\u89c9\u5230\u88ab\u5ffd\u89c6**\u3002\u6d88\u606f\u56de\u590d\u8981\u53ca\u65f6\uff0c\u5373\u4f7f\u53ea\u662f\u7b80\u5355\u5b89\u629a\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u4efb\u4f55\u5347\u5355**\u3002\u5f53\u524d\u9636\u6bb5\u5979\u7684\u6838\u5fc3\u9700\u6c42\u662f\u60c5\u7eea\u4ef7\u503c\u4e0e\u57fa\u7840\u6280\u80fd\u5efa\u7acb\uff0c\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u90fd\u4f1a\u589e\u52a0\u5176\u7126\u8651\u548c\u4e0d\u4fe1\u4efb\u611f\uff0c\u6781\u6613\u5f15\u53d1\u9000\u8d39\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u5e08\u59d0\u522b\u653e\u5f03\u6211\u554a\u201d\n2. > \u201c\u6211\u5f55\u4e86\u597d\u591a\u904d\uff0c\u603b\u89c9\u5f97\u4e0d\u884c\u4e0d\u6562\u53d1\u201d\n3. > \u201c\u5e08\u59d0\uff0c\u6211\u4eca\u665a12\u70b9\u524d\u4e00\u5b9a\u4ea4\uff0c\u56e0\u4e3a\u73b0\u5728\u5ba2\u4eba\u6709\u70b9\u591a\uff0c\u6211\u8001\u516c\u4e00\u4e2a\u4eba\u5fd9\u4e0d\u8fc7\u6765\uff0c\u6211\u4e00\u4f1a\u5fd9\u597d\u627e\u4e2a\u5b89\u9759\u7684\u5730\u65b9\u5f55\u201d\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6 \u60c5\u7eea\u5de8\u5a74\u578b\u3011**\uff0c\u5979\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u83b7\u5f97\u5c0a\u91cd\u3001\u8ba4\u53ef\u4e0e\u60c5\u611f\u5f52\u5c5e\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u63d0\u4f9b\u6781\u81f4\u7684\u60c5\u611f\u966a\u4f34\u4e0e\u7b80\u5316\u7248\u5b66\u4e60\u8def\u5f84\uff0c\u4e25\u9632\u4efb\u4f55\u5f62\u5f0f\u7684\u632b\u8d25\u611f\u7d2f\u79ef\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b\", \"risk_level\": \"\u9ad8\", \"refund_risk\": \"\u9ad8\", \"maslow_need\": \"\u5c0a\u91cd\u5f52\u5c5e\", \"target_product_line\": \"\u8f6f\u6027\u7597\u6108\u966a\u4f34\u7ebf\"}\n```";
