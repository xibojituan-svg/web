    <script>
        const markdownText = "\u597d\u7684\uff0c\u4f5c\u4e3a\u4e00\u540d\u9876\u7ea7\u7684\u6559\u80b2\u884c\u4e1a\u7528\u6237\u5fc3\u7406\u5206\u6790\u5e08\u548c\u8d28\u91cf\u98ce\u63a7\u4e13\u5bb6\uff0c\u6211\u5c06\u4e25\u683c\u9075\u5faa\u300a\u7528\u6237\u5206\u5c42\u5b9e\u6218\u5224\u65ad\u5f15\u64ce_v4.1.0\u300b\u7684\u89c4\u5219\uff0c\u5bf9\u8fd9\u4efd\u804a\u5929\u8bb0\u5f55\u8fdb\u884c\u6df1\u5ea6\u5206\u6790\u3002\n\n# \ud83d\udd0d \u559c\u64ad\u7528\u6237\u5168\u666f\u5206\u5c42\u4e0e\u9700\u6c42\u8bca\u65ad\u62a5\u544a (v3.0)\n\n---\n\n## \u4e00\u3001\u57fa\u7840\u5b9a\u7ea7\u4fe1\u606f\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| **\u7528\u6237\u6807\u8bc6** | UID: 81027402 (\u6635\u79f0\uff1a\u8463\u5927) |\n| **\u804a\u5929\u65f6\u95f4\u8303\u56f4** | 2026-04-09 \u81f3 2026-04-11 |\n| **\u5bf9\u8bdd\u9996\u5370\u9500\u552e/\u73ed\u4e3b\u4efb** | \u5434\u6e58\u5a1f (\u9500\u552e) |\n| **\u8d2d\u4e70\u6216\u610f\u5411\u4ea7\u54c1** | \u6709\u58f0\u4e66\u6f14\u64ad\u8bfe\u7a0b (\u610f\u5411\uff1a\u7cbe\u82f1\u72483980\u5143/\u9ad8\u9636\u73ed) |\n| **\u652f\u4ed8\u94fe\u52d8\u6d4b** | **\u501f\u6b3e\u9690\u60a3** (\u7528\u6237\u660e\u786e\u8868\u793a\u201c\u6b20\u6b3e\u592a\u591a\u4e86\uff0c\u6bcf\u4e2a\u6708\u9700\u8fd8\u6b3e\u201d) |\n| **\u771f\u5b9e\u53ef\u7528\u7269\u7406\u65f6\u95f4** | **\u788e\u7247\u5316\u62fc\u51d1** (\u7528\u6237\u8868\u793a\u767d\u5929\u65f6\u95f4\u788e\u7247\u5316\uff0c\u53ef\u505a\u659c\u6760\u5de5\u4f5c\uff0c\u665a\u4e0a\u5f55\u4e66) |\n| **\u5bb6\u5ead\u907f\u96f7\u9488(\u77e5\u60c5\u6743)** | **\u4fe1\u606f\u7f3a\u5931** (\u672a\u63d0\u53ca) |\n| **\u4fe1\u606f\u539a\u5ea6** | **\u9971\u6ee1** (\u52a8\u673a\u3001\u8d44\u6e90\u3001\u60c5\u7eea\u5747\u6709\u660e\u786e\u8868\u8fbe) |\n\n---\n\n## \u4e8c\u3001\u4e09\u8f74\u6838\u5fc3\u8bc4\u7ea7 (\u5224\u5b9a\u5e95\u5ea7)\n\n### \u8f74 1\uff1a\u641e\u94b1\u7eaf\u5ea6 (\u52a8\u673a) \u2192 **\u27a1\u4e2d (5-6\u5206)**\n- **\u7279\u5f81\u901f\u5199**\uff1a\u517c\u804c\u53d8\u73b0\u76ee\u7684\u660e\u786e\uff0c\u4f46\u6df7\u6742\u4e86\u201c\u7528\u58f0\u97f3\u629a\u6170\u4ed6\u4eba\u201d\u7684\u60c5\u611f\u4ef7\u503c\u8ffd\u6c42\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u60f3\u517c\u804c\u201d\n  > \u201c\u60f3\u7528\u81ea\u5df1\u7684\u58f0\u97f3\u5e26\u7ed9\u66f4\u591a\u4eba\u5fc3\u7075\u7684\u629a\u6170\u201d\n  > \u201c\u8001\u5e08\uff0c\u8bf7\u591a\u591a\u5173\u7167\uff0c\u6211\u771f\u7684\u60f3\u8d5a\u94b1[\u63e1\u624b]\u201d\n\n### \u8f74 2\uff1a\u8d44\u6e90\u5e95\u5ea7 (\u80fd\u529b\u5708) \u2192 **\u2b07\u4f4e (3-4\u5206)**\n*\u6ce8\uff1a\u53d6\u4e0b\u9762\u6700\u77ed\u7684\u4e00\u5757\u677f\u4f5c\u4e3a\u6700\u7ec8\u8bc4\u7ea7\u3002*\n- \ud83d\udcb0 \u8d44\u91d1\u627f\u8f7d\u529b\uff1a**\u2b07\u4f4e** \u2014 \u660e\u786e\u8868\u793a\u201c\u6b20\u6b3e\u592a\u591a\u4e86\uff0c\u6bcf\u4e2a\u6708\u9700\u8fd8\u6b3e\u201d\uff0c\u5b58\u5728\u660e\u663e\u7684\u7ecf\u6d4e\u538b\u529b\u3002\n- \u23f1 \u65f6\u95f4\u4e0e\u7cbe\u529b\uff1a**\u27a1\u4e2d** \u2014 \u6709\u7b14\u8bb0\u672c\u7535\u8111\uff0c\u80fd\u89c4\u5212\u201c\u767d\u5929\u659c\u6760+\u665a\u4e0a\u5f55\u4e66\u201d\u7684\u788e\u7247\u5316\u65f6\u95f4\u3002\n- \ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67 \u5bb6\u5ead\u652f\u6301\u5ea6\uff1a**\u672a\u77e5** \u2014 \u804a\u5929\u8bb0\u5f55\u672a\u63d0\u53ca\u3002\n\n### \u8f74 3\uff1a\u5fc3\u7406\u5f39\u6027\u4e0e\u6297\u538b\u6027 \u2192 **\u2b07\u4f4e (3-4\u5206)**\n- **\u53d7\u632b\u4e0e\u60c5\u7eea\u4f9d\u8d56**\uff1a**\u6781\u5ea6\u81ea\u5351\u6613\u7834\u9632\u4f9d\u8d56**\u3002\u5b66\u4e60\u521d\u671f\u5373\u8868\u73b0\u51fa\u5f3a\u70c8\u7684\u81ea\u6211\u6000\u7591\uff0c\u9700\u8981\u5916\u90e8\u80af\u5b9a\u548c\u9f13\u52b1\u3002\n- **\u804a\u5929\u8bc1\u636e\u622a\u53d6**\uff1a\n  > \u201c\u8001\u5e08\uff0c\u611f\u89c9\u81ea\u5df1\u58f0\u97f3\u4e0d\u884c\uff0c\u6c14\u4e0d\u8db3\uff0c\u666e\u901a\u8bdd\u4e0d\u884c\u201d\n  > \u201c\u542c\u5f97\u6709\u70b9\u61f5\u201d\n  > \u9891\u7e41\u4f7f\u7528\u201c\u611f\u6069\u8001\u5e08[\u5408\u5341]\u201d\uff0c\u8868\u73b0\u51fa\u5bf9\u6743\u5a01\u7684\u4f9d\u8d56\u548c\u5bfb\u6c42\u8ba4\u53ef\u3002\n\n---\n\n## \u4e09\u3001 \u9a6c\u65af\u6d1b\u9700\u6c42\u5c42\u6b21\u6df1\u5c42\u5b9a\u4f4d\n\n### \ud83d\udccc \u6700\u7ec8\u951a\u5b9a\u9700\u6c42\uff1a**\u7b2c\u4e8c\u5c42\uff1a\u5b89\u5168\u9700\u6c42 (\u7126\u8651\u4fdd\u969c) \u4e0e \u7b2c\u4e09\u5c42\uff1a\u793e\u4ea4\u9700\u6c42 (\u5c0a\u91cd\u5f52\u5c5e)**\n\n**\u4e0b\u94bb\u5206\u6790**\uff1a\n- **\u4ed6\u5728\u804a\u5929\u4e2d\u66b4\u9732\u7684\u8f6f\u808b\u662f\u4ec0\u4e48\uff1f**\uff1a**\u7ecf\u6d4e\u538b\u529b\u4e0e\u81ea\u6211\u4ef7\u503c\u611f\u7f3a\u5931\u7684\u53cc\u91cd\u7126\u8651**\u3002\u4e00\u65b9\u9762\u88ab\u503a\u52a1\u8ffd\u8d76\uff0c\u6025\u9700\u4e00\u4efd\u517c\u804c\u6536\u5165\u6765\u7f13\u89e3\u751f\u5b58\u538b\u529b\uff08\u5b89\u5168\u9700\u6c42\uff09\uff1b\u53e6\u4e00\u65b9\u9762\uff0c\u901a\u8fc7\u201c\u7528\u58f0\u97f3\u629a\u6170\u4ed6\u4eba\u201d\u7684\u613f\u666f\uff0c\u5bfb\u6c42\u793e\u4f1a\u8ba4\u540c\u548c\u5c0a\u91cd\uff0c\u5f25\u8865\u73b0\u5b9e\u4e2d\u7684\u65e0\u529b\u611f\uff08\u5c0a\u91cd/\u793e\u4ea4\u9700\u6c42\uff09\u3002\n- **\u6211\u4eec\u9700\u8981\u4e3a\u4ed6\u63d0\u4f9b\u7684\u6700\u9ad8\u60c5\u7eea\u4ef7\u503c\u662f\u4ec0\u4e48\uff1f**\uff1a**\u201c\u88ab\u770b\u89c1\u201d\u7684\u80af\u5b9a\u4e0e\u201c\u53ef\u8fbe\u6210\u201d\u7684\u8def\u5f84\u5b89\u5168\u611f**\u3002\u4ed6\u9700\u8981\u7684\u4e0d\u53ea\u662f\u6280\u672f\uff0c\u66f4\u662f\u201c\u6211\u80fd\u884c\u201d\u7684\u4fe1\u5fc3\u548c\u4e00\u6761\u6e05\u6670\u3001\u53ef\u6267\u884c\u7684\u3001\u80fd\u5feb\u901f\u7f13\u89e3\u7ecf\u6d4e\u538b\u529b\u7684\u517c\u804c\u8def\u5f84\u3002\n\n---\n\n## \u56db\u3001 \u5224\u5b9a\u7ed3\u8bba\u4e0e\u6781\u7b80\u6d41\u8f6c\u7b7e\n\n### \ud83d\udccd \u5206\u5c42\u843d\u4f4d\n| \u5206\u5c42\u6811\u7ed3\u6784 | \u7ed3\u8bba\u7ed3\u679c |\n|---|---|\n| **ABCD \u5c42\u7ea7** | **\ud83d\udfe5C2 \u7c7b** (\u98ce\u9669\u7ba1\u63a7\u578b) |\n| **\u516b\u5927\u4eba\u7fa4\u539f\u578b** | **T6 \u60c5\u7eea\u5de8\u5a74\u578b** (\u4e25\u91cd\u5185\u8017) |\n\n### \u26d4\u3010D\u7c7b\u5e95\u7ebf\u8b66\u62a5\u5668\u3011\n- **\u89e6\u53d1\u72b6\u6001**\uff1a**\u26a0\ufe0f \u9ad8\u98ce\u9669\u9884\u8b66 (\u63a5\u8fd1\u7ea2\u7ebf)**\u3002\u7528\u6237\u5df2\u89e6\u53d1**T8-D\u7edd\u8def\u8d4c\u5f92**\u7684**\u7ea2\u7ebf1\uff1a\u7f51\u8d37\u786e\u8ba4**\uff08\u201c\u6b20\u6b3e\u592a\u591a\uff0c\u6bcf\u6708\u9700\u8fd8\u6b3e\u201d\uff09\u3002\n- **\u89e6\u53d1\u56e0\u7531**\uff1a\u7528\u6237\u660e\u786e\u8868\u8fbe\u7ecf\u6d4e\u538b\u529b\uff0c\u52a8\u673a\u4e2d\u6df7\u6742\u4e86\u201c\u5feb\u901f\u8d5a\u94b1\u8fd8\u503a\u201d\u7684\u6025\u8feb\u6027\u3002\u867d\u672a\u51fa\u73b0\u6781\u7aef\u5a01\u80c1\u8a00\u8bba\uff0c\u4f46\u8d44\u6e90\u5e95\u5ea7\u5df2\u5904\u4e8e\u5d29\u584c\u8fb9\u7f18\uff0c\u5fc3\u7406\u5f39\u6027\u4f4e\uff0c\u6781\u6613\u56e0\u77ed\u671f\u53d8\u73b0\u65e0\u671b\u800c\u5d29\u6e83\u9000\u8d39\u3002\n\n---\n\n## \u4e94\u3001 \u9000\u8d39\u5ba2\u8bc9\u9884\u9632\u4f53\u7cfb\n\n| \u9000\u8d39\u8bf1\u56e0\u8ffd\u8e2a\u96f7\u8fbe | \u5f15\u7206\u51e0\u7387 | \u5f15\u7206\u56e0\u5b50\u9884\u4f30\uff08\u4ed6\u6700\u5bb9\u6613\u56e0\u4e3a\u4ec0\u4e48\u62a5\u8b66\u9000\u8d39\uff1f\uff09 |\n|---|---|---|\n| \u5bb6\u5ead\u5e72\u9884\u578b | \u4e2d | \u82e5\u62a5\u540d\u8d39\u7528\u8fdb\u4e00\u6b65\u52a0\u5267\u5bb6\u5ead\u503a\u52a1\u538b\u529b\uff0c\u53ef\u80fd\u5f15\u53d1\u5bb6\u5ead\u77db\u76fe\u3002 |\n| \u65e0\u6cd5\u8ddf\u8fdb\u5d29\u76d8\u578b | \u4e2d | \u5b66\u4e60\u521d\u671f\u9047\u5230\u6280\u672f\u96be\u9898\uff08\u5982\u8f6f\u4ef6\u5b89\u88c5\u3001\u666e\u901a\u8bdd\u7ea0\u6b63\uff09\u65f6\uff0c\u56e0\u81ea\u6211\u6000\u7591\u800c\u653e\u5f03\u3002 |\n| **\u8106\u5f31\u7834\u9632\u5de8\u5a74\u578b** | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u4efb\u4f55\u8d1f\u9762\u53cd\u9988\uff08\u5982\u8bd5\u97f3\u5931\u8d25\u3001\u4f5c\u4e1a\u88ab\u6279\uff09\u90fd\u53ef\u80fd\u89e6\u53d1\u5176\u201c\u6211\u4e0d\u884c\u201d\u7684\u56fa\u6709\u8ba4\u77e5\uff0c\u5bfc\u81f4\u60c5\u7eea\u5d29\u6e83\u548c\u653e\u5f03\u3002 |\n| **\u6536\u76ca\u843d\u5dee\u578b** | **\u6781\u9ad8** | **\u6838\u5fc3\u98ce\u9669**\u3002\u82e5\u5728\u627f\u8bfa\u7684\u201c\u5feb\u901f\u4e0a\u624b\u659c\u6760\u5de5\u4f5c\u201d\u540e1-2\u4e2a\u6708\u5185\u672a\u80fd\u83b7\u5f97\u5b9e\u9645\u6536\u5165\uff0c\u5176\u8fd8\u503a\u538b\u529b\u5c06\u8f6c\u5316\u4e3a\u5bf9\u8bfe\u7a0b\u7684\u6124\u6012\u548c\u9000\u8d39\u8bc9\u6c42\u3002 |\n\n- **\u23f0 \u6700\u5371\u9669\u5d29\u76d8\u65f6\u95f4\u7a97\u6d4b\u7b97**\uff1a**\u5f00\u8bfe\u540e\u7b2c1\u4e2a\u6708\u672b\u81f3\u7b2c2\u4e2a\u6708\u521d**\u3002\u6b64\u65f6\u82e5\u659c\u6760\u5de5\u4f5c\u63a5\u5355\u4e0d\u987a\uff0c\u6216\u914d\u97f3\u7ec3\u4e60\u9047\u5230\u74f6\u9888\uff0c\u53cc\u91cd\u538b\u529b\u53e0\u52a0\u5c06\u5bfc\u81f4\u60c5\u7eea\u51b3\u5824\u3002\n\n---\n\n## \u516d\u3001 \u4e50\u9ad8\u5f0f\u4ea7\u54c1\u6539\u914d\u4e0e\u670d\u52a1SOP\n\n### 1. \u73ed\u4e3b\u4efb\u7834\u9632\u524d\u7f6e\u5173\u6000\u8bdd\u672f\uff08\u4e25\u7981\u8bf4\u5957\u8bdd\uff09\n> \ud83d\udde3\ufe0f **\u201c\u6839\u636e\u4ed6\u7684\u6027\u683c\uff0c\u4f60\u5728\u5f00\u8425\u7b2c\u4e00\u5929\u5efa\u8bae\u8fd9\u4e48\u8ddf\u4ed6\u8bf4......\u201d**\n> \u201c\u8463\u5927\uff0c\u770b\u5230\u4f60\u8bf4\u60f3\u7528\u58f0\u97f3\u6e29\u6696\u522b\u4eba\uff0c\u6211\u7279\u522b\u611f\u52a8\u3002\u8fd9\u4efd\u521d\u5fc3\u6bd4\u4efb\u4f55\u6280\u5de7\u90fd\u73cd\u8d35\u3002\u54b1\u4eec\u4e0d\u7740\u6025\uff0c\u4e00\u6b65\u4e00\u6b65\u6765\u3002\u4f60\u7684\u58f0\u97f3\u5e95\u5b50\u6ca1\u95ee\u9898\uff0c\u54b1\u4eec\u5148\u5b9a\u4e2a\u5c0f\u76ee\u6807\uff1a\u8fd9\u5468\u5148\u641e\u5b9a\u4e00\u4e2a\u80fd\u9a6c\u4e0a\u8d5a\u70b9\u96f6\u82b1\u94b1\u7684\u2018\u753b\u672c\u2019\u5c0f\u4efb\u52a1\uff0c\u4f60\u770b\u600e\u4e48\u6837\uff1f\u6709\u4efb\u4f55\u5361\u4f4f\u7684\u5730\u65b9\uff0c\u968f\u65f6\u558a\u6211\uff0c\u6211\u624b\u628a\u624b\u5e26\u4f60\u8fc7\u3002\u201d\n\n### 2. \u4ea7\u54c1\u91cd\u6784\u6302\u8f7d\u5efa\u8bae\uff08\u6309\u9700\u7ec4\u88c5\uff09\n\u7ed3\u5408\u4e1a\u52a1\u76ee\u524d\u7684\u4e50\u9ad8\u6a21\u5757\u80fd\u529b\uff0c\u63a8\u8350\u4e3a\u8be5\u5b66\u5458\u6302\u8f7d\u5982\u4e0b\u6838\u5fc3\u8981\u7d20\uff1a\n- **\u63a8\u8350\u4e3b\u7ebf**\uff1a**\u3010\u786c\u6838\u5b9e\u5e72\u5feb\u901f\u63a5\u5355\u7ebf\u3011**\u3002\u5fc5\u987b\u4f18\u5148\u5bf9\u63a5\u80fd\u5feb\u901f\u4ea7\u751f\u5c0f\u989d\u6536\u5165\u7684\u201c\u753b\u672c\u3001\u5ba1\u542c\u201d\u7b49\u659c\u6760\u5de5\u4f5c\uff0c\u7528\u5373\u65f6\u6b63\u53cd\u9988\u5bf9\u51b2\u5176\u7ecf\u6d4e\u7126\u8651\u3002\n- **\u9644\u52a0\u8f85\u52a9\u5305**\uff1a**\u3010\u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305 (\u6ee1\u914dC\u6a21\u5757)\u3011** + **\u3010\u50bb\u74dc\u7248\u964d\u7ef4A\u6a21\u5757\u3011**\u3002\u73ed\u4e3b\u4efb\u9700\u63d0\u4f9b\u201c\u8f6e\u6905\u7ea7\u201d\u60c5\u7eea\u6258\u5e95\uff0c\u7528\u6781\u5938\u5f20\u7684\u8d5e\u7f8e\u5efa\u7acb\u4fe1\u5fc3\uff1b\u6240\u6709\u590d\u6742\u64cd\u4f5c\uff08\u8f6f\u4ef6\u5b89\u88c5\u3001\u4efb\u52a1\u63d0\u4ea4\uff09\u9700\u63d0\u4f9b\u201c\u4e00\u952e\u5f0f\u201d\u56fe\u6587\u6216\u89c6\u9891\u6307\u5f15\u3002\n\n### 3. \u3010\u7ea2\u7ebf\u94c1\u8840\u6212\u5f8b\u3011\n- \u274c **\u7edd\u5bf9\u4e0d\u8981**\uff1a1. \u5728\u4ed6\u8868\u8fbe\u81ea\u6211\u6000\u7591\u65f6\u8bb2\u5927\u9053\u7406\u6216\u6280\u672f\u539f\u7406\u30022. \u7528\u5176\u4ed6\u5b66\u5458\u7684\u201c\u9ad8\u6536\u5165\u6848\u4f8b\u201d\u523a\u6fc0\u4ed6\u30023. \u5728\u4ed6\u672a\u83b7\u5f97\u7b2c\u4e00\u6b21\u5c0f\u989d\u6536\u5165\u524d\uff0c\u63a8\u9500\u4efb\u4f55\u9ad8\u9636\u8bfe\u7a0b\u3002\n- \u274c **\u5347\u5355\u9632\u7ebf**\uff1a**\u4e25\u7981\u5347\u5355**\u3002\u5728\u6210\u529f\u5b8c\u62103-5\u6b21\u659c\u6760\u5de5\u4f5c\u5e76\u83b7\u5f97\u7a33\u5b9a\u5c0f\u989d\u6536\u5165\u3001\u4e14\u60c5\u7eea\u72b6\u6001\u660e\u663e\u597d\u8f6c\u524d\uff0c\u7981\u6b62\u4efb\u4f55\u5347\u5355\u884c\u4e3a\u3002\u9996\u8981\u76ee\u6807\u662f\u5e2e\u4ed6\u201c\u6d3b\u4e0b\u6765\u201d\uff0c\u5efa\u7acb\u5b89\u5168\u611f\u3002\n\n---\n\n## \u4e03\u3001 \u7075\u9b42\u5b9e\u8bc1\u539f\u97f3\uff08\u4e00\u5251\u5c01\u5589\u7684\u5224\u65ad\u6765\u6e90\uff09\n1. > \u201c\u8001\u5e08\uff0c\u611f\u89c9\u81ea\u5df1\u58f0\u97f3\u4e0d\u884c\uff0c\u6c14\u4e0d\u8db3\uff0c\u666e\u901a\u8bdd\u4e0d\u884c\u201d **\u2014\u2014 \u4f4e\u5fc3\u7406\u5f39\u6027\u7684\u7ecf\u5178\u81ea\u5351\u4fe1\u53f7**\n2. > \u201c\u6b20\u6b3e\u592a\u591a\u4e86\uff0c\u6bcf\u4e2a\u6708\u9700\u8fd8\u6b3e\uff0c\u6211\u770b\u770b\u80fd\u4e0d\u80fd\u8d1f\u62c5\u7684\u8d77\u201d **\u2014\u2014 \u8d44\u6e90\u5e95\u5ea7\u5d29\u584c\u3001T8-D\u98ce\u9669\u7684\u76f4\u63a5\u8bc1\u636e**\n3. > \u201c\u8001\u5e08\uff0c\u8bf7\u591a\u591a\u5173\u7167\uff0c\u6211\u771f\u7684\u60f3\u8d5a\u94b1[\u63e1\u624b]\u201d **\u2014\u2014 \u4e2d\u7eaf\u5ea6\u52a8\u673a\uff08\u641e\u94b1+\u60c5\u611f\uff09\u4e0e\u9ad8\u5ea6\u4f9d\u8d56\u6027\u7684\u6df7\u5408\u4f53\u73b0**\n\n---\n\n## \u516b\u3001 \u603b\u540e\u53c2\u8c0b\u957f 10 \u79d2\u626b\u8bfb\u6458\u8981\n> **\u3010\u9ad8\u5c42\u6781\u7b80\u51b3\u65ad\u7248\u3011**\uff1a\n> \u8fd9\u4e2a\u4eba\u662f\u5178\u578b\u7684 **\u3010T6\u60c5\u7eea\u5de8\u5a74\u578b + \u6f5c\u5728T8-D\u7edd\u8def\u8d4c\u5f92\u98ce\u9669\u3011**\uff0c\u4ed6\u5185\u5fc3\u771f\u6b63\u7684\u6e34\u6c42\u662f **\u3010\u5b89\u5168\uff08\u7f13\u89e3\u503a\u52a1\uff09\u4e0e\u5c0a\u91cd\uff08\u4ef7\u503c\u8ba4\u540c\uff09\u3011**\u3002\u9000\u5355\u51e0\u7387\u4e3a **\u3010\u6781\u9ad8\u3011**\uff0c\u9632\u7206\u7834\u7684\u6700\u5173\u952e\u624b\u6bb5\u662f **\u3010\u7528\u201c\u659c\u6760\u5de5\u4f5c\u5feb\u901f\u5c0f\u989d\u53d8\u73b0\u201d\u5efa\u7acb\u5b89\u5168\u611f\uff0c\u5e76\u7528\u6ee1\u914d\u60c5\u7eea\u6258\u5e95\uff08C\u6a21\u5757\uff09\u9632\u6b62\u5176\u56e0\u81ea\u5351\u800c\u5d29\u6e83\u3011**\u3002\n\n```json\n{\"core_type\": \"T6 \u60c5\u7eea\u5de8\u5a74\u578b (\u6f5c\u5728T8-D\u98ce\u9669)\", \"risk_level\": \"\u6781\u9ad8\", \"refund_risk\": \"\u6781\u9ad8\", \"maslow_need\": \"\u5b89\u5168\u9700\u6c42\u3001\u5c0a\u91cd\u9700\u6c42\", \"target_product_line\": \"\u786c\u6838\u5b9e\u5e72\u5feb\u901f\u63a5\u5355\u7ebf + \u8f6f\u6027\u7597\u6108\u966a\u5b66\u5305\", \"age\": \"\u672a\u77e5\", \"gender\": \"\u672a\u77e5\", \"city\": \"\u672a\u77e5\"}\n```";
